<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Урок 2 — Стыковка форм</title>
<style>
  :root {
    --bg: #0f1216; --panel: #171c22; --line: #2a323c;
    --text: #e6edf3; --dim: #8b98a5;
    --a: #4dabf7; --b: #ffd43b; --ok: #51cf66; --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, "SF Pro Text", system-ui, sans-serif;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--dim); margin: 0 0 20px; font-size: 14px; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 20px; max-width: 780px;
  }
  .sliders { display: grid; grid-template-columns: 120px 1fr 44px; gap: 10px 14px; align-items: center; }
  .sliders label { font: 13px ui-monospace, monospace; color: var(--dim); }
  .sliders output { font: 15px ui-monospace, monospace; font-weight: 700; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--a); }

  .eq {
    font: 22px/1.6 ui-monospace, "SF Mono", Menlo, monospace;
    text-align: center; margin: 26px 0 8px; letter-spacing: 0.5px;
  }
  .eq .out { color: var(--dim); }
  .inner { padding: 0 3px; border-radius: 4px; }
  .inner.ok { color: var(--ok); background: rgba(81,207,102,.14); }
  .inner.bad { color: var(--bad); background: rgba(255,107,107,.14); }
  .res { font-weight: 700; }
  .res.ok { color: var(--ok); }
  .res.bad { color: var(--bad); }

  .verdict { text-align: center; font-size: 14px; margin: 4px 0 22px; min-height: 22px; }
  .verdict.ok { color: var(--ok); }
  .verdict.bad { color: var(--bad); }

  .blocks { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 18px 0 6px; }
  .blk { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .grid { display: grid; gap: 2px; }
  .cell { width: 13px; height: 13px; border-radius: 2px; }
  .cA .cell { background: #1c4d78; }
  .cB .cell { background: #6b5410; }
  .cR .cell { background: #1f5c34; }
  .cR.bad .cell { background: #5c1f1f; }
  .cap { font: 11px ui-monospace, monospace; color: var(--dim); }
  .op { font: 20px ui-monospace, monospace; color: var(--dim); padding: 0 4px; }

  .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; }
  button {
    background: #222a33; color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 12px; font: 12px ui-monospace, monospace; cursor: pointer;
  }
  button:hover { border-color: var(--a); color: var(--a); }
  .hint { color: var(--dim); font-size: 13px; margin-top: 18px; }
  .hint b { color: var(--b); }
</style>
</head>
<body>

<h1>Стыковка форм — правило LEGO</h1>
<p class="sub">Двигай ползунки. Зелёное — крепления совпали, красное — деталь не подходит.</p>

<div class="card">
  <div class="sliders">
    <label>m — строк A</label>
    <input type="range" id="m" min="1" max="8" value="3"><output id="mo"></output>
    <label>n — столбцов A</label>
    <input type="range" id="n" min="1" max="8" value="5"><output id="no"></output>
    <label>k — строк B</label>
    <input type="range" id="k" min="1" max="8" value="5"><output id="ko"></output>
    <label>p — столбцов B</label>
    <input type="range" id="p" min="1" max="8" value="2"><output id="po"></output>
  </div>

  <div class="eq" id="eq"></div>
  <div class="verdict" id="verdict"></div>

  <div class="blocks" id="blocks"></div>

  <div class="presets">
    <button data-s="128,784,784,1">слой: (128x784) @ (784x1)</button>
    <button data-s="3,5,5,2">(3x5) @ (5x2)</button>
    <button data-s="3,5,2,5">(3x5) @ (2x5)</button>
    <button data-s="2,4,4,3">(2x4) @ (4x3)</button>
  </div>

  <p class="hint">
    Внутренние числа — <b>n</b> и <b>k</b>. Совпали — стыкуемся, и они
    <b>исчезают</b>. Наружу выходит только <b>m</b> и <b>p</b>.
    Двигай <b>k</b> и смотри, как одно число ломает всю операцию.
  </p>
</div>

<script>
const ids = ['m','n','k','p'];
const S = {};
ids.forEach(i => S[i] = document.getElementById(i));
const eq = document.getElementById('eq');
const verdict = document.getElementById('verdict');
const blocks = document.getElementById('blocks');

function grid(rows, cols, cls) {
  const cap = 8;
  const r = Math.min(rows, cap), c = Math.min(cols, cap);
  const d = document.createElement('div');
  d.className = 'grid ' + cls;
  d.style.gridTemplateColumns = `repeat(${c}, 13px)`;
  for (let i = 0; i < r * c; i++) {
    const x = document.createElement('div');
    x.className = 'cell';
    d.appendChild(x);
  }
  const wrap = document.createElement('div');
  wrap.className = 'blk';
  const label = document.createElement('div');
  label.className = 'cap';
  label.textContent = `${rows} x ${cols}` + ((rows > cap || cols > cap) ? ' (обрезано)' : '');
  wrap.appendChild(d);
  wrap.appendChild(label);
  return wrap;
}
function op(sym) {
  const d = document.createElement('div');
  d.className = 'op';
  d.textContent = sym;
  return d;
}

function render() {
  const m = +S.m.value, n = +S.n.value, k = +S.k.value, p = +S.p.value;
  ids.forEach(i => document.getElementById(i + 'o').textContent = S[i].value);

  const ok = n === k;
  const cls = ok ? 'ok' : 'bad';

  eq.innerHTML =
    `(<span class="out">${m}</span> x <span class="inner ${cls}">${n}</span>) @ ` +
    `(<span class="inner ${cls}">${k}</span> x <span class="out">${p}</span>) = ` +
    (ok
      ? `<span class="res ok">(${m} x ${p})</span>`
      : `<span class="res bad">ошибка</span>`);

  verdict.className = 'verdict ' + cls;
  verdict.textContent = ok
    ? `внутренние ${n} = ${k} — стыкуются, исчезают; наружу ${m} и ${p}`
    : `внутренние ${n} ≠ ${k} — крепления разные, деталь не подходит`;

  blocks.innerHTML = '';
  blocks.appendChild(grid(m, n, 'cA'));
  blocks.appendChild(op('@'));
  blocks.appendChild(grid(k, p, 'cB'));
  blocks.appendChild(op('='));
  if (ok) {
    blocks.appendChild(grid(m, p, 'cR'));
  } else {
    const x = document.createElement('div');
    x.className = 'op';
    x.style.color = '#ff6b6b';
    x.style.fontSize = '28px';
    x.textContent = '✕';
    blocks.appendChild(x);
  }
}

ids.forEach(i => S[i].addEventListener('input', render));
document.querySelectorAll('button[data-s]').forEach(b => {
  b.addEventListener('click', () => {
    const v = b.dataset.s.split(',').map(Number);
    ids.forEach((id, i) => {
      S[id].max = Math.max(8, v[i]);
      S[id].value = v[i];
    });
    render();
  });
});

render();
</script>
</body>
</html>
