<!-- Значок вкладки: два входа, скрытый слой, выход — сеть в один нейрон.
     Фон непрозрачный и тёмный: панель вкладок бывает и светлой, и тёмной, а
     прозрачный значок в одной из них пропал бы. Зелёный тот же, что у полоски
     прогресса. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#0b1210"/>
  <g stroke="#10b981" stroke-width="1.6" stroke-linecap="round" opacity="0.55">
    <path d="M9 10 L17 16 M9 22 L17 16 M17 16 L24 16"/>
  </g>
  <g fill="#10b981">
    <circle cx="9" cy="10" r="2.6"/>
    <circle cx="9" cy="22" r="2.6"/>
    <circle cx="17" cy="16" r="3.2"/>
    <circle cx="24" cy="16" r="2.6"/>
  </g>
</svg>
