<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Три уровня доказательства координации</title>
<style>
:root{
  color-scheme:light dark;
  --page:#f7f4ec;
  --panel:#fffdf8;
  --ink:#202733;
  --muted:#596273;
  --line:#738096;
  --role:#dbe9ff;
  --role-ink:#164b83;
  --task:#dff3e8;
  --task-ink:#17613d;
  --group:#f6dfad;
  --group-ink:#734b00;
  --accent:#3d67c6;
  --accent-soft:#e8edfb;
}
@media (prefers-color-scheme:dark){
  :root{
    --page:#171b22;
    --panel:#202630;
    --ink:#f1f4f8;
    --muted:#b6bfcc;
    --line:#8e9aab;
    --role:#203d61;
    --role-ink:#b9d9ff;
    --task:#1d4a39;
    --task-ink:#b9efd4;
    --group:#59451f;
    --group-ink:#ffe0a1;
    --accent:#8baeff;
    --accent-soft:#28344e;
  }
}
html,body{
  background:var(--page);
  color:var(--ink);
}
body{
  margin:auto;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}
figure{
  margin:auto;
  max-width:960px;
  background:var(--page);
}
figcaption{
  color:var(--ink);
  font-size:22px;
  font-weight:700;
  text-align:center;
}
svg{
  display:block;
  width:100%;
  height:auto;
  max-height:480px;
  background:var(--page);
}
.panel{
  fill:var(--panel);
  stroke:var(--line);
  stroke-width:2px;
}
.divider,.connector,.axis,.branch{
  fill:none;
  stroke:var(--line);
  stroke-width:2px;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.connector,.axis{
  stroke:var(--accent);
  stroke-width:3px;
}
.arrowhead{
  fill:var(--accent);
}
.badge{
  fill:var(--accent);
}
.badge-text{
  fill:white;
  font-size:17px;
  font-weight:800;
  text-anchor:middle;
  dominant-baseline:middle;
}
.heading{
  fill:var(--ink);
  font-size:17px;
  font-weight:750;
}
.body{
  fill:var(--ink);
  font-size:14px;
}
.small{
  fill:var(--muted);
  font-size:13px;
}
.micro{
  font-size:12px;
  font-weight:650;
  text-anchor:middle;
  dominant-baseline:middle;
}
.role-shape{
  fill:var(--role);
  stroke:var(--role-ink);
  stroke-width:1px;
}
.role-text{
  fill:var(--role-ink);
}
.task-shape{
  fill:var(--task);
  stroke:var(--task-ink);
  stroke-width:1px;
}
.task-text{
  fill:var(--task-ink);
}
.group-shape{
  fill:var(--group);
  stroke:var(--group-ink);
  stroke-width:2px;
}
.group-text{
  fill:var(--group-ink);
}
.evidence{
  fill:var(--accent);
  font-size:14px;
  font-weight:700;
}
.caption{
  fill:var(--muted);
  font-size:13px;
  font-weight:650;
  text-anchor:middle;
}
#fallback{
  color:var(--ink);
  background:var(--panel);
  font-size:16px;
  text-align:center;
}
</style>
</head>
<body>
<figure aria-labelledby="diagram-title">
  <figcaption id="diagram-title">Три уровня доказательства координации</figcaption>
  <svg id="diagram" viewBox="0 0 960 500" width="960" height="500"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="svg-title svg-desc">
    <title id="svg-title">Три связанные проверки координации группы агентов</title>
    <desc id="svg-desc">От устойчивых личных ролей через непересекающиеся подзадачи к результату группы, превосходящему результат любой её части.</desc>
  </svg>
  <p id="fallback" hidden>Схема должна была показать три усиливающихся свидетельства координации: устойчивые личные роли, непересекающиеся подзадачи и результат группы выше результата любой её части.</p>
</figure>
<script>
const data={
  origin:{x:24,y:16},
  scale:{x:9.12,y:9.64},
  labels:{zero:0},
  panels:[
    {
      box:{x:3,y:25,w:30,h:18},
      badge:{x:6,y:28.5,r:1.65,text:"1"},
      title:{x:8.5,y:28,lines:["Устойчивые","личные роли"],dy:2.15},
      divider:[{x:5,y:32.2},{x:31,y:32.2}],
      rows:[
        {agent:"А",role:"сверяет карту",cy:34.9},
        {agent:"Б",role:"берёт пробы",cy:38},
        {agent:"В",role:"отмечает маршрут",cy:41.1}
      ],
      caption:{x:18,y:44.7,text:"роль сохраняется за агентом"}
    },
    {
      box:{x:35,y:15,w:30,h:20},
      badge:{x:38,y:18.5,r:1.65,text:"2"},
      title:{x:40.5,y:18,lines:["Непересекающиеся","подзадачи"],dy:2.15},
      divider:[{x:37,y:22.2},{x:63,y:22.2}],
      tasks:[
        {x:38,y:24.8,w:8,h:4.6,label:"карта"},
        {x:46,y:24.8,w:8,h:4.6,label:"пробы"},
        {x:54,y:24.8,w:8,h:4.6,label:"маршрут"}
      ],
      goal:{x:50,y:32.2,text:"вместе закрывают общую цель"},
      caption:{x:50,y:36.7,text:"разные части — без дублирования"}
    },
    {
      box:{x:67,y:4,w:30,h:22},
      badge:{x:70,y:7.5,r:1.65,text:"3"},
      title:{x:72.5,y:7,lines:["Результат группы","выше любой части"],dy:2.15},
      divider:[{x:69,y:11.2},{x:95,y:11.2}],
      agents:[
        {x:70.5,y:14,label:"А",end:{x:83,y:17}},
        {x:70.5,y:17,label:"Б",end:{x:83,y:17}},
        {x:70.5,y:20,label:"В",end:{x:83,y:17}}
      ],
      result:{x:84,y:13.2,w:11,h:7.6,lines:["безопасный","путь"],dy:2},
      claim:{x:82,y:23.5,text:"группа > любая часть"},
      caption:{x:82,y:27.8,text:"целое нельзя свести к одной части"}
    }
  ],
  links:[
    {
      points:[{x:33.2,y:31},{x:35,y:27.5}],
      head:[{x:35,y:27.5},{x:34.2,y:28},{x:34.6,y:28.5}]
    },
    {
      points:[{x:65.2,y:21.8},{x:67,y:17.5}],
      head:[{x:67,y:17.5},{x:66.2,y:18},{x:66.6,y:18.6}]
    }
  ],
  branchHeads:[
    [{x:83,y:17},{x:82.2,y:16.55},{x:82.2,y:17.45}]
  ],
  axis:{
    points:[{x:3,y:48},{x:97,y:48}],
    head:[{x:97,y:48},{x:95.8,y:47.35},{x:95.8,y:48.65}],
    left:{x:3,y:46.7,text:"один успешный итог"},
    right:{x:97,y:46.7,text:"сильнее свидетельство координации"}
  },
  geometry:{
    agentR:1.05,
    roleX:8.3,
    roleW:21.8,
    roleH:2.35,
    roleTextX:19.2,
    roleTextDy:0.05,
    taskTextDy:0.05,
    agentTextDy:0.05
  },
  padding:{none:0}
};
const origin=data.origin;
const scale=data.scale;
const sx=x=>origin.x+x*scale.x;
const sy=y=>origin.y+y*scale.y;

try{
  const svg=document.getElementById("diagram");
  const ns="http://www.w3.org/2000/svg";

  const add=(tag,attrs,parent=svg)=>{
    const node=document.createElementNS(ns,tag);
    Object.entries(attrs).forEach(([key,value])=>node.setAttribute(key,String(value)));
    parent.appendChild(node);
    return node;
  };

  const rect=(box,cls,parent=svg)=>add("rect",{
    x:sx(box.x),
    y:sy(box.y),
    width:sx(box.x+box.w)-sx(box.x),
    height:sy(box.y+box.h)-sy(box.y),
    class:cls
  },parent);

  const circle=(item,r,cls,parent=svg)=>add("circle",{
    cx:sx(item.x),
    cy:sy(item.y),
    r:sx(r)-sx(data.labels.zero),
    class:cls
  },parent);

  const line=(points,cls,parent=svg)=>add("polyline",{
    points:points.map(point=>`${sx(point.x)},${sy(point.y)}`).join(" "),
    class:cls
  },parent);

  const polygon=(points,cls,parent=svg)=>add("polygon",{
    points:points.map(point=>`${sx(point.x)},${sy(point.y)}`).join(" "),
    class:cls
  },parent);

  const text=(item,cls,anchor="start",parent=svg)=>{
    const node=add("text",{
      x:sx(item.x),
      y:sy(item.y),
      dx:data.padding.none,
      dy:data.padding.none,
      class:cls,
      "text-anchor":anchor
    },parent);
    node.textContent=item.text;
    return node;
  };

  const multiline=(item,cls,parent=svg)=>{
    const node=add("text",{
      x:sx(item.x),
      y:sy(item.y),
      dx:data.padding.none,
      dy:data.padding.none,
      class:cls,
      "text-anchor":"start"
    },parent);
    item.lines.forEach((value,index)=>{
      const span=add("tspan",{
        x:sx(item.x),
        dy:index===data.labels.zero?data.padding.none:item.dy
      },node);
      span.textContent=value;
    });
    return node;
  };

  data.links.forEach(link=>{
    line(link.points,"connector");
    polygon(link.head,"arrowhead");
  });

  const first=data.panels.find(panel=>panel.badge.text==="1");
  rect(first.box,"panel");
  circle(first.badge,first.badge.r,"badge");
  text(first.badge,"badge-text","middle");
  multiline(first.title,"heading");
  line(first.divider,"divider");

  first.rows.forEach(row=>{
    const agent={x:first.box.x+3.1,y:row.cy,text:row.agent};
    const role={
      x:first.box.x+data.geometry.roleX,
      y:row.cy-data.geometry.roleH/first.badge.text.length,
      w:data.geometry.roleW,
      h:data.geometry.roleH
    };
    circle(agent,data.geometry.agentR,"role-shape");
    text(agent,"micro role-text","middle");
    rect(role,"role-shape");
    text({
      x:first.box.x+data.geometry.roleTextX,
      y:row.cy+data.geometry.roleTextDy,
      text:row.role
    },"micro role-text","middle");
  });
  text(first.caption,"caption","middle");

  const second=data.panels.find(panel=>panel.badge.text==="2");
  rect(second.box,"panel");
  circle(second.badge,second.badge.r,"badge");
  text(second.badge,"badge-text","middle");
  multiline(second.title,"heading");
  line(second.divider,"divider");

  second.tasks.forEach(task=>{
    rect(task,"task-shape");
    text({
      x:task.x+task.w/second.badge.text.length/task.badge,
      y:task.y+task.h/second.badge.text.length+data.geometry.taskTextDy,
      text:task.label
    },"micro task-text","middle");
  });
  text(second.goal,"body","middle");
  text(second.caption,"caption","middle");

  const third=data.panels.find(panel=>panel.badge.text==="3");
  rect(third.box,"panel");
  circle(third.badge,third.badge.r,"badge");
  text(third.badge,"badge-text","middle");
  multiline(third.title,"heading");
  line(third.divider,"divider");

  third.agents.forEach(agent=>{
    circle(agent,data.geometry.agentR,"role-shape");
    text({
      x:agent.x,
      y:agent.y+data.geometry.agentTextDy,
      text:agent.label
    },"micro role-text","middle");
    line([{x:agent.x+data.geometry.agentR,y:agent.y},agent.end],"branch");
  });
  data.branchHeads.forEach(head=>polygon(head,"arrowhead"));
  rect(third.result,"group-shape");

  const resultText=add("text",{
    x:sx(third.result.x+third.result.w/third.badge.text.length/third.badge.text.length),
    y:sy(third.result.y+third.result.h/third.badge.text.length/third.badge.text.length),
    class:"micro group-text",
    "text-anchor":"middle"
  });
  third.result.lines.forEach((value,index)=>{
    const span=add("tspan",{
      x:sx(third.result.x+third.result.w/third.badge.text.length/third.badge.text.length),
      dy:index===data.labels.zero?data.padding.none:third.result.dy
    },resultText);
    span.textContent=value;
  });
  text(third.claim,"evidence","middle");
  text(third.caption,"caption","middle");

  line(data.axis.points,"axis");
  polygon(data.axis.head,"arrowhead");
  text(data.axis.left,"small","start");
  text(data.axis.right,"evidence","end");
}catch(error){
  document.getElementById("diagram").hidden=true;
  document.getElementById("fallback").hidden=false;
}
</script>
</body>
</html>
