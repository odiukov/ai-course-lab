- concept: числовые, категориальные и текстовые признаки требуют разных преобразований
  question: В таблице есть сумма заказа, способ доставки и комментарий покупателя. Как корректно подготовить эти столбцы для модели?
  explanation: 'Тип данных определяет подходящее преобразование: числа можно масштабировать или нелинейно преобразовывать, категории нужно кодировать, а текст — переводить в текстовые признаки. После этого результаты относятся к тем же объектам и могут быть объединены.'
  kind: choice
  options:
    - После обработки пропусков применить к сумме числовое преобразование, способ доставки закодировать как категорию, а из комментария извлечь текстовые признаки
    - Применить одно и то же арифметическое преобразование ко всем трём столбцам
    - Передать модели исходные значения без преобразований
    - Удалить категориальный и текстовый столбцы, поскольку числовые признаки всегда полезнее
  correct: 0
  id: 004-konveyer-1
  fingerprint: bf296f9d
- concept: этапы подготовки признаков упорядочиваются по зависимостям между их входами и результатами
  question: Расположите этапы конвейера подготовки признаков в правильном порядке.
  explanation: Преобразования должны получать данные без необработанных пропусков. Разные типы столбцов сначала проходят специализированную обработку, затем их результаты объединяются, и только сформированный набор признаков можно отбирать.
  kind: order
  items:
    - Обработать пропуски в исходных столбцах
    - Отдельно преобразовать числовые, категориальные и текстовые данные
    - Объединить результаты ветвей в общее пространство признаков
    - Выполнить отбор признаков
  id: 004-konveyer-2
