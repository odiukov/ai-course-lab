- concept: у постоянного признака нет разброса, поэтому его дисперсия равна нулю
  question: Какова дисперсия признака, у которого все значения одинаковы?
  explanation: Все значения совпадают со средним, поэтому отклонений от среднего нет. Такой признак не различает объекты и будет удалён при любом положительном пороге дисперсии.
  kind: cloze
  template: Если все наблюдения признака одинаковы, его дисперсия ___.
  answer: равна нулю
  accept:
    - нулевая
    - не имеет разброса
  id: 042-dispersiya-1
  fingerprint: d6df7464
- concept: порог дисперсии удаляет до обучения признаки, чей разброс ниже выбранной границы
  question: Какое действие соответствует отбору признаков по порогу дисперсии?
  explanation: Порог дисперсии — фильтр до обучения модели. Он оценивает изменчивость каждой колонки и исключает почти постоянные признаки, не используя веса обученной модели.
  kind: choice
  options:
    - Обучить модель и удалить признаки с наименьшими весами
    - Удалить один признак из каждой пары с сильной корреляцией
    - Вычислить разброс каждого признака и удалить признаки с разбросом ниже выбранной границы
  correct: 2
