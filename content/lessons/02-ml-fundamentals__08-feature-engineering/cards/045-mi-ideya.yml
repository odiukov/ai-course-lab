- concept: вклад сочетания признака и класса во взаимную информацию взвешивается его совместной вероятностью
  question: Объясни своими словами, почему очень редкое сочетание значения признака и класса может слабо повлиять на итоговую взаимную информацию, даже если оно сильно отличается от ожидаемого при независимости.
  explanation: Взаимная информация усредняет силу связи по распределению данных. Редкие сочетания получают малый вес p(x, y), а часто встречающиеся закономерности влияют на результат сильнее.
  kind: open
  reference: Каждое слагаемое взаимной информации умножается на совместную вероятность сочетания. У редкого сочетания этот вес мал, поэтому даже большой логарифм отношения вероятностей может дать небольшой вклад в общую сумму.
