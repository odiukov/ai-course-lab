- concept: если признак полностью определяет цель, взаимная информация равна энтропии цели
  question: 'В выборке 16 объектов: у 8 признак X равен A и цель Y равна «да», у остальных 8 X равен B и Y равна «нет»; других сочетаний нет. Чему равна взаимная информация I(X; Y) при использовании натурального логарифма? Округли до тысячных.'
  explanation: 'Признак полностью раскрывает сбалансированную бинарную цель, поэтому снимает всю её неопределённость. Взаимная информация равна энтропии цели: ln(2) ≈ 0.693.'
  kind: numeric
  answer: 0.693
