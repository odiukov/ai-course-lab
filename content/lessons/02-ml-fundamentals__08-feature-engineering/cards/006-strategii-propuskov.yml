- concept: удаление строк допустимо лишь при редких случайных пропусках
  question: В каком случае удаление строк с пропущенными значениями наименее рискованно?
  explanation: При редких случайных пропусках удаление строк мало сокращает выборку и с меньшей вероятностью искажает её состав. Частые или систематические пропуски делают удаление рискованным.
  kind: choice
  options:
    - Пропуски редки и возникают независимо от свойств наблюдений
    - Пропуски часто встречаются у определённой категории клиентов
    - Пропущена значительная доля значений ключевого признака
    - Вероятность пропуска связана с целевой переменной
  correct: 0
  id: 006-strategii-propuskov-1
  fingerprint: 8953c4d9
- concept: медиана устойчивее среднего к выбросам при заполнении числовых пропусков
  question: В числовом признаке есть несколько чрезвычайно больших выбросов. Каким типичным значением разумнее заполнять пропуски, если нужно уменьшить влияние этих выбросов?
  explanation: Экстремальные значения могут сильно сдвинуть среднее, тогда как медиана определяется порядком наблюдений и гораздо устойчивее к выбросам.
  kind: choice
  options:
    - Средним арифметическим
    - Медианой
    - Модой категориального признака
    - Следующим значением временного ряда
  correct: 1
  id: 006-strategii-propuskov-2
  fingerprint: 6c665ff7
- concept: перенос соседнего значения во временном ряду допустим только при сохранении состояния и без утечки из будущего
  question: Объясни своими словами, когда прямое заполнение предыдущим значением уместно во временном ряду и почему обратное заполнение может быть опасно при прогнозировании.
  explanation: Forward fill выражает предположение о сохранении последнего известного состояния. Backward fill при построении прогноза способен передать модели сведения, которых в прогнозируемый момент ещё не было.
  kind: open
  reference: Прямое заполнение уместно, если наблюдаемое состояние действительно сохраняется до следующего изменения. Обратное заполнение может подставить в прошлое значение, ставшее известным лишь позднее, и тем самым создать утечку информации из будущего.
  id: 006-strategii-propuskov-3
  fingerprint: 2d4292eb
