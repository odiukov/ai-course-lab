- concept: сглаженный target-код лежит между средним категории и глобальным средним
  question: Объясни, почему при неотрицательном параметре сглаживания target-код категории не может оказаться за пределами между средним этой категории и глобальным средним.
  explanation: Формула сглаживания задаёт выпуклую комбинацию среднего категории и глобального среднего. Она может сдвинуть значение от одного среднего к другому, но не вывести его за образованный ими интервал.
  kind: open
  reference: 'Код является взвешенным средним двух величин: среднего категории и глобального среднего. Оба веса неотрицательны и в сумме равны единице, поэтому результат лежит между смешиваемыми значениями.'
  id: 031-smoothing-2
  fingerprint: aa3e4734
