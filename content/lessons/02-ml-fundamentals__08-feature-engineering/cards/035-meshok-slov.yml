- concept: count vectorizer сохраняет частоты слов, но теряет их порядок
  question: Объясни своими словами, почему предложения с разным смыслом иногда получают одинаковые count-векторы.
  explanation: Count-вектор представляет документ как набор частот слов. Связи между словами и последовательность их появления в таком представлении не сохраняются.
  kind: open
  reference: Count vectorizer записывает, какие слова встретились и сколько раз, но не хранит их порядок. Поэтому перестановка одних и тех же слов не меняет вектор, хотя может изменить смысл предложения.
  id: 035-meshok-slov-2
