- concept: вес TF-IDF равен произведению нормированной частоты слова на логарифмический штраф за распространённость по документам
  question: В коллекции 28 документов слово встречается в 7 из них. В рассматриваемом документе оно употреблено 6 раз среди 24 слов. Вычисли его TF-IDF по формуле TF × ln(N / DF).
  explanation: TF = 6 / 24 = 0.25, а IDF = ln(28 / 7) = ln(4). Поэтому TF-IDF = 0.25 × ln(4) ≈ 0.347.
  kind: numeric
  answer: 0.347
  tolerance: 0.005
  id: 036-tfidf-ideya-1
  fingerprint: 10968b81
- concept: document frequency учитывает число документов со словом, а не суммарное число его употреблений
  question: Объясни своими словами, почему многократное повторение слова в одном документе увеличивает TF, но не должно многократно увеличивать document frequency.
  explanation: При расчёте document frequency слова одного документа сначала рассматриваются как множество уникальных слов. Поэтому повторы влияют на локальную частоту TF, но не создают ложного впечатления, что слово распространено по всей коллекции.
  kind: open
  reference: 'TF отражает частоту слова внутри конкретного документа, поэтому реагирует на повторения. Document frequency показывает, в скольких разных документах присутствует слово: каждый документ учитывается для этого слова только один раз.'
  id: 036-tfidf-ideya-2
  fingerprint: '31801711'
