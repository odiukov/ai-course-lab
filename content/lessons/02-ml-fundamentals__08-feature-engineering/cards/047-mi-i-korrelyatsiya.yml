- concept: взаимная информация обнаруживает зависимость, но не описывает её форму и направление
  question: Взаимная информация между признаком и целью оказалась высокой. Что из этого можно заключить, а что нельзя?
  explanation: Взаимная информация оценивает силу статистической связи без знака. Чтобы понять форму и направление зависимости, нужны дополнительные средства, например график или анализ условных значений цели.
  kind: open
  reference: Можно заключить, что знание признака заметно уменьшает неопределённость о цели. Нельзя только по значению взаимной информации определить, возрастает или убывает цель, а также восстановить форму зависимости.
