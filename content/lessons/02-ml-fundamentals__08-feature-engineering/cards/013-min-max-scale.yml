- concept: постоянный признак требует отдельной обработки из-за нулевого размаха
  question: Почему обычную формулу min-max scaling нельзя напрямую применить к списку одинаковых значений и какой результат должна вернуть функция?
  explanation: При одинаковых значениях знаменатель формулы равен нулю. Отдельная ветка устраняет деление на ноль и сохраняет соответствие между входными и выходными элементами.
  kind: open
  reference: Минимум и максимум совпадают, поэтому размах равен нулю и деление на него невозможно. Функция должна вернуть список вещественных нулей той же длины, что и входной список.
