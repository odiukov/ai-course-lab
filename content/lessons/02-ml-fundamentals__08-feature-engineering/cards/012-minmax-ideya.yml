- concept: min-max scaling выражает значение как долю пройденного размаха от минимума
  question: В выборке минимальное значение признака равно 14, максимальное — 38. Какое значение после min-max scaling получит наблюдение 32?
  explanation: 'Нужно вычесть минимум и разделить результат на размах: (32 − 14) / (38 − 14) = 18 / 24 = 0,75.'
  kind: numeric
  answer: 0.75
  tolerance: 0.001
  id: 012-minmax-ideya-1
  fingerprint: dcb28b33
- concept: при ненулевом размахе min-max scaling сохраняет порядок значений
  question: Почему min-max scaling не меняет порядок наблюдений, если максимум больше минимума? Объясни своими словами.
  explanation: 'При положительном размахе преобразование является возрастающим: меньшее исходное значение всегда получает меньший масштабированный результат.'
  kind: open
  reference: Из всех значений вычитают один и тот же минимум, а затем делят их на один и тот же положительный размах. Эти операции сохраняют отношения «меньше» и «больше», поэтому порядок значений не меняется.
  id: 012-minmax-ideya-2
  fingerprint: 70ef6ca0
- concept: масштабированное значение обозначает относительное положение в диапазоне, а не вероятность
  question: После min-max scaling объект получил значение 0,25. Что это означает?
  explanation: 'Результат 0,25 описывает координату внутри наблюдаемого диапазона: от минимума пройдена четверть полного размаха. Само по себе это число не является вероятностью или процентом изменения.'
  kind: choice
  options:
    - Вероятность целевого события для объекта равна 25%
    - Исходное значение уменьшилось ровно на 25%
    - Исходное значение находится на четверти размаха от минимума к максимуму
  correct: 2
  id: 012-minmax-ideya-3
  fingerprint: 9fa77dbd
