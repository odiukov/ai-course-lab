- concept: число интервалов управляет детализацией биннинга
  question: Объясните своими словами, как выбор числа интервалов влияет на результат биннинга.
  explanation: 'Число интервалов задаёт компромисс между обобщением и сохранением деталей: широкие интервалы сильнее объединяют наблюдения, а узкие слабее упрощают исходный признак.'
  kind: open
  reference: Чем меньше интервалов, тем грубее представление и тем больше различий между исходными значениями теряется. Чем больше интервалов, тем больше деталей сохраняется и тем ближе новый признак к исходной числовой шкале.
