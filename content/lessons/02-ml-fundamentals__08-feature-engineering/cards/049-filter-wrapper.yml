- concept: рекурсивное исключение признаков последовательно переобучает модель и удаляет наименее важный признак
  question: Расположите действия рекурсивного исключения признаков в правильном порядке.
  explanation: 'Рекурсивное исключение не оценивает все признаки один раз: после каждого удаления модель обучается заново, потому что оценки важности на изменившемся наборе могут стать другими.'
  kind: order
  items:
    - Обучить модель на текущем наборе признаков
    - Получить оценки важности признаков от модели
    - Удалить признак с самой низкой оценкой
    - Повторять цикл до достижения нужного числа признаков
