- concept: индикатор пропуска дополняет импутацию, а не заменяет её
  question: Как правильно совместить импутацию признака с индикатором пропуска?
  explanation: Импутация делает основную колонку пригодной для обработки, а индикатор сообщает, было ли значение подставлено. Эти признаки решают разные задачи и используются вместе.
  kind: choice
  options:
    - Оставить основную колонку пустой, поскольку индикатор уже содержит нужное значение
    - Удалить основную колонку и обучать модель только на индикаторе
    - Заполнить пропуск в основной колонке, сохранив рядом индикатор отсутствия исходного значения
    - Заполнять только индикатор, а исходную колонку не изменять
  correct: 2
  id: 007-indikator-propuska-1
  fingerprint: a9e4b478
- concept: индикатор фиксирует наличие пропуска, но не объясняет его причину
  question: Объясни своими словами, почему индикатор пропуска нельзя сам по себе трактовать как признак низкого дохода или нежелания раскрывать данные.
  explanation: Одинаковая отметка может соответствовать разным причинам пропуска. Приписывая ей заранее конкретный смысл, инженер вносит неподтверждённое предположение.
  kind: open
  reference: Индикатор сообщает только о том, что исходное значение отсутствовало. Причина пропуска и её связь с целевой переменной должны подтверждаться данными, а не назначаться заранее.
  id: 007-indikator-propuska-2
  fingerprint: 9d4cb9ee
