- concept: robust scaling выражает отклонение от медианы в единицах межквартильного размаха
  question: Для числового признака медиана равна 30, нижний квартиль — 18, верхний квартиль — 38. Какое значение после robust scaling получит наблюдение 48?
  explanation: Межквартильный размах равен 38 − 18 = 20, а отклонение от медианы — 48 − 30 = 18. Поэтому результат равен 18 / 20 = 0.9.
  kind: numeric
  answer: 0.9
  tolerance: 0.006
  id: 053-praktika-1
  fingerprint: 90a186eb
- concept: влияние отбора признаков оценивают при неизменных условиях проверки моделей
  question: Как честно сравнить линейную регрессию на всех признаках и после автоматического отбора признаков?
  explanation: Одинаковые обучающие и отложенные данные, а также одна метрика изолируют влияние отбора признаков. Разные разбиения или сравнение по обучающей ошибке смешивают эффект отбора со случайностью и переобучением.
  kind: choice
  options:
    - Обучить обе версии на одной обучающей выборке и оценить одной метрикой на одной отложенной выборке
    - Для каждой версии подобрать наиболее удачное случайное разбиение данных
    - Сравнить только ошибку на обучающих данных
    - Оценить сокращённую матрицу на отложенных данных, а полную — на обучающих
