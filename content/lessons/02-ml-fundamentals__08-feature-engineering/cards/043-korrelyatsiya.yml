- concept: модуль корреляции выявляет дублирование как при прямой, так и при обратной линейной связи
  question: Заполните выражение для оценки сходства двух признаков перед сравнением с порогом.
  explanation: Сильная положительная и сильная отрицательная корреляция обе означают почти линейную зависимость признаков. Модуль позволяет обнаружить оба варианта.
  kind: cloze
  template: pair_score = ___
  answer: abs(correlation(feature_a, feature_b))
  accept:
    - abs(corr(feature_a, feature_b))
    - '|correlation(feature_a, feature_b)|'
  id: 043-korrelyatsiya-1
  fingerprint: '55165258'
- concept: жадный корреляционный фильтр сохраняет более ранний признак и помечает на удаление более поздние дубли
  question: Расположите действия жадного корреляционного фильтра в правильном порядке.
  explanation: Фильтр обрабатывает колонки последовательно и в каждой слишком похожей паре удаляет более позднюю. Поэтому результат может зависеть от порядка колонок.
  kind: order
  items:
    - Выбрать очередной ещё не удалённый признак при проходе слева направо
    - Сравнить его с каждым более поздним ещё не удалённым признаком
    - Вычислить модуль корреляции для каждой такой пары
    - Пометить более поздний признак на удаление, если порог достигнут
    - Вернуть индексы всех признаков, которые не были помечены
  id: 043-korrelyatsiya-2
  fingerprint: 12cc22ea
- concept: корреляция между признаками измеряет избыточность, но не их связь с целевой переменной
  question: Почему сильная корреляция двух признаков друг с другом не доказывает, что хотя бы один из них полезен для предсказания цели?
  explanation: Две колонки могут почти полностью повторять друг друга, но обе быть не связанными с целью. Корреляционный фильтр устраняет избыточность, а не оценивает предсказательную силу.
  kind: open
  reference: Корреляция этой пары показывает лишь то, что признаки содержат повторяющийся линейный сигнал. Для оценки предсказательной полезности нужно отдельно исследовать связь признаков с целевой переменной.
  id: 043-korrelyatsiya-3
  fingerprint: 1d7fa735
