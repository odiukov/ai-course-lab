- concept: строка матрицы признаков должна объединять значения одного и того же объекта
  question: Инженер отдельно отсортировал подготовленный столбец возраста, оставил остальные столбцы без изменений и затем объединил их в матрицу домов. Что произошло?
  explanation: При сборке строки все элементы с общим индексом должны описывать один дом. Отдельная сортировка одного столбца сохраняет допустимые значения и форму матрицы, но смешивает данные разных объектов.
  kind: choice
  options:
    - Изменился только масштаб значений возраста
    - 'Нарушилось соответствие строк: возраст может относиться к другому дому'
    - Матрица автоматически восстановила исходное соответствие
    - Сортировка повлияла только на порядок столбцов
  correct: 1
  id: 052-housing-demo-1
  fingerprint: 9373db07
- concept: форма матрицы признаков определяется числом объектов и числом признаков
  question: Пусть m — число домов, а p — число подготовленных признаков для каждого дома. Заполни обозначение формы матрицы X.
  explanation: Матрица X содержит m строк по числу домов и p столбцов по числу признаков. Чтобы она была прямоугольной, каждая строка должна иметь одинаковую длину p.
  kind: cloze
  template: X ∈ ℝ^(m × ___)
  answer: p
  accept:
    - число признаков
    - n_features
  id: 052-housing-demo-2
  fingerprint: 7504713a
- concept: целевая переменная хранится отдельно от матрицы признаков и выравнивается с ней по строкам
  question: Объясни, почему цену дома нельзя включать в матрицу X как обычный входной признак и как её следует хранить для обучения.
  explanation: В X находятся только признаки, доступные модели для предсказания. Цены образуют отдельный вектор y, выровненный со строками X; включение цены в X привело бы к утечке целевой переменной.
  kind: open
  reference: Цена является целевой переменной y, которую модель должна предсказывать. Её хранят отдельно, причём y[i] должна соответствовать дому в X[i]. Если включить цену в X, модель получит правильный ответ во входных данных, что создаст утечку целевой переменной.
  id: 052-housing-demo-3
  fingerprint: 0c7144d3
