- concept: индикатор пропуска сохраняет потенциально полезный сигнал после заполнения значения
  question: Пропуски показаний датчика чаще встречаются перед отказом оборудования. Как подготовить этот признак, чтобы модель не потеряла информацию о самом факте пропуска?
  explanation: Заполнение делает пустые и изначально заполненные строки внешне одинаковыми. Бинарный индикатор сохраняет информацию о том, где значение отсутствовало, а заполнение позволяет использовать исходный числовой признак.
  kind: choice
  options:
    - Заполнить пропуски медианой и не добавлять других признаков
    - Сначала создать бинарный индикатор пропуска, затем заполнить исходный признак
    - Удалить все строки с пропущенными показаниями
    - Заменить пропуски значением целевой переменной
  correct: 1
  id: 005-propuski-signal-1
  fingerprint: c8466f55
- concept: сравнение частоты целевого события в группах с пропуском и без него помогает обнаружить информативную пропущенность
  question: Среди 75 клиентов с пропущенным доходом ушли 15, а среди 300 клиентов с указанным доходом ушли 30. Во сколько раз частота ухода выше в группе с пропуском?
  explanation: Частота ухода при пропуске равна 15/75 = 0.20, а без пропуска — 30/300 = 0.10. Отношение равно 0.20/0.10 = 2. Это показывает связь пропуска с целью, хотя само по себе не доказывает причинность.
  kind: numeric
  answer: 2
  tolerance: 0.01
  id: 005-propuski-signal-2
  fingerprint: ec925f59
