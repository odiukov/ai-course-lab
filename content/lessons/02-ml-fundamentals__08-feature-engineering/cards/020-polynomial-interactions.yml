- concept: линейная по коэффициентам модель может нелинейно зависеть от исходного признака благодаря его степеням
  question: Почему линейная регрессия с исходным признаком и его квадратом способна описать кривую зависимость от исходного признака?
  explanation: Линейность модели относится к способу сочетания коэффициентов и признаков. Если среди признаков есть квадрат исходной величины, предсказание может нелинейно меняться относительно этой величины.
  kind: open
  reference: Модель остаётся линейной по своим коэффициентам, но квадрат является нелинейным преобразованием исходного признака. Поэтому линейная комбинация преобразованных признаков может задавать кривую.
  id: 020-polynomial-interactions-1
  fingerprint: 0a94d386
- concept: полное полиномиальное расширение быстро увеличивает размерность пространства признаков
  question: Что обычно происходит с числом столбцов при добавлении степеней и всевозможных произведений исходных признаков?
  explanation: Полиномиальное расширение создаёт не только степени отдельных признаков, но и множество их сочетаний. Поэтому повышение допустимой степени или добавление исходных признаков быстро порождает новые столбцы.
  kind: choice
  options:
    - Оно остаётся примерно постоянным
    - Оно быстро растёт вместе с числом исходных признаков и допустимой степенью
    - Оно обязательно уменьшается
  correct: 1
