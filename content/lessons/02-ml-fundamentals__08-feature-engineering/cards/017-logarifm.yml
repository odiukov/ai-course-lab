- concept: логарифмическое преобразование сжимает длинный правый хвост положительного числового признака
  question: Распределение положительного числового признака имеет плотную основную массу и редкие очень большие значения справа. Какое преобразование прежде всего подходит для сжатия хвоста?
  explanation: Логарифм сильнее сжимает большие значения, поэтому длинный правый хвост становится короче, а различия внутри основной массы — заметнее.
  kind: choice
  options:
    - One-hot encoding
    - Удаление дубликатов
    - Полиномиальное расширение
    - Стандартизация
    - Min-max scaling
    - Логарифмическое преобразование
  correct: 5
  id: 017-logarifm-1
  fingerprint: e95e816e
- concept: логарифм превращает умножение в сложение
  question: Заполни пропуск в тождестве для положительных a и b.
  explanation: Логарифм произведения равен сумме логарифмов множителей. Поэтому мультипликативную зависимость в логарифмическом пространстве можно представить как аддитивную.
  kind: cloze
  template: log(a · b) = ___
  answer: log(a) + log(b)
