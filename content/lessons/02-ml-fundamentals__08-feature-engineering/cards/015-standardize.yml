- concept: квадраты отклонений позволяют измерить разброс без взаимного уничтожения знаков
  question: Почему разброс нельзя вычислить как среднее обычных отклонений от среднего и зачем перед усреднением отклонения возводят в квадрат?
  explanation: Сумма отклонений от среднего равна нулю даже у сильно разбросанных данных. Возведение в квадрат устраняет компенсацию положительных и отрицательных отклонений и даёт дисперсию.
  kind: open
  reference: Обычные отклонения от среднего в сумме взаимно компенсируются. Квадраты делают их неотрицательными, поэтому их среднее отражает величину разброса.
