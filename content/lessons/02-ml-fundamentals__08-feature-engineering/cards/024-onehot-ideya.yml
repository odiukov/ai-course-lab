- concept: полное one-hot encoding создаёт по одному столбцу для каждой уникальной категории
  question: Номинальный признак содержит семь уникальных категорий. Сколько столбцов создаст полное one-hot encoding?
  explanation: Каждой уникальной категории соответствует отдельный индикаторный столбец, поэтому для семи категорий получится семь столбцов.
