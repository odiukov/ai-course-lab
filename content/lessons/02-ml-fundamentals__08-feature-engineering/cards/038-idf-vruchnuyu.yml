- concept: вычисление несглаженного IDF по размеру корпуса и числу документов со словом
  question: Корпус содержит 14 документов, а слово встречается в 7 из них. Чему равен его IDF при использовании натурального логарифма? Округли до тысячных.
  explanation: IDF = ln(14 / 7) = ln(2) ≈ 0,693. Слово встречается в половине корпуса, поэтому получает положительный, но сравнительно небольшой вес.
  kind: numeric
  answer: 0.693
  tolerance: 0.001
  id: 038-idf-vruchnuyu-1
  fingerprint: b5203dcc
- concept: добавление документов без данного слова увеличивает его IDF
  question: Объясни своими словами, как изменится IDF слова, если добавить в корпус новые документы, в которых этого слова нет.
  explanation: 'В формуле IDF = ln(N / df) увеличивается N, тогда как df не меняется. Следовательно, растут отношение N / df и его логарифм: слово становится более редким относительно всего корпуса.'
  kind: open
  reference: 'IDF увеличится: общее число документов вырастет, а число документов с данным словом останется прежним, поэтому отношение в логарифме станет больше.'
  id: 038-idf-vruchnuyu-2
  fingerprint: f44b6f1d
