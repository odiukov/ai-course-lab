- concept: min-max scaling чувствителен к экстремальным значениям
  question: Объясни своими словами, почему min-max scaling не защищает данные от выбросов.
  explanation: Min-max scaling меняет шкалу, но не устраняет необычные наблюдения. Поскольку границы задаются экстремумами, один далёкий максимум или минимум влияет на преобразование всех значений.
  kind: open
  reference: Преобразование использует минимум и максимум признака. Далёкое экстремальное значение сильно увеличивает размах, поэтому обычные наблюдения сжимаются в узкой части шкалы, а сам выброс не исчезает.
