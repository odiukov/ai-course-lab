- concept: масштабирование выравнивает числовые масштабы, но не задаёт predictive importance признаков
  question: 'Инженер утверждает: «После масштабирования модель обязана считать все признаки одинаково важными». Объясни, в чём ошибка.'
  explanation: Сопоставимый масштаб устраняет искусственное преимущество признака с более крупными числами. Равной предсказательной важности признаков из этого не следует.
  kind: open
  reference: 'Масштабирование лишь не позволяет диапазонам и единицам измерения заранее определять вклад признаков в расстояние. Оно не делает признаки одинаково информативными: их полезность для предсказания определяется данными и обучением модели.'
  id: 011-zachem-masshtab-2
