- concept: параметры преобразований оцениваются на обучающей выборке и без пересчёта применяются к тестовой
  question: После разделения данных тестовая выборка оказалась заметно старше обучающей. Как правильно использовать Pipeline с медианной импутацией и StandardScaler?
  explanation: При fit конвейер запоминает медиану, среднее, разброс и другие параметры только по train. На test вызывается преобразование с теми же параметрами, поэтому сведения о распределении тестовых данных не влияют на обучение.
  kind: choice
  options:
    - Обучить Pipeline на train, а test преобразовать с уже запомненными параметрами
    - Обучить Pipeline на объединении train и test, а затем снова разделить данные
    - Отдельно обучить Pipeline на train и отдельно на test
    - Запомнить медиану на train, но параметры StandardScaler пересчитать на test
  correct: 0
  id: 051-sklearn-pipeline-1
  fingerprint: 60417a87
- concept: Pipeline не устраняет утечку, произошедшую до помещения данных в конвейер
  question: Инженер сначала заполнил пропуски и стандартизировал всю таблицу, затем разделил её на train и test и обучил модель через Pipeline. Объясни, почему проверка всё равно содержит утечку.
  explanation: Защита работает лишь для преобразований, которые Pipeline обучает после разделения данных. Если статистики всей таблицы уже использованы, тестовая выборка успела повлиять на train, и конвейер не исправит это задним числом.
  kind: open
  reference: Параметры импутации и стандартизации уже были вычислены с участием test до разделения. Последующее использование Pipeline не может удалить эту информацию из подготовленных обучающих признаков; нужно сначала разделить исходные данные, а затем обучить все преобразования только на train.
  id: 051-sklearn-pipeline-2
  fingerprint: 7ca84a4f
