- concept: редкая категория даёт слишком мало наблюдений для оценки устойчивой связи с целевой переменной
  question: Почему отдельная one-hot колонка для категории, которая встречается крайне редко, часто оказывается ненадёжным признаком?
  explanation: Каждая категория получает собственную колонку, но редкая категория активирует её лишь в немногих строках. Такой объём данных обычно недостаточен для устойчивой оценки сигнала и повышает риск переобучения.
  kind: open
  reference: По малому числу наблюдений трудно отличить устойчивую связь с целевой переменной от случайного совпадения. Модель может подогнаться под единичные случаи, и обнаруженная зависимость плохо перенесётся на новые данные.
  id: 026-cardinality-3
