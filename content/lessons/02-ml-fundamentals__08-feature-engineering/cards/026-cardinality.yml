- concept: плотность one-hot блока обратно пропорциональна числу категорий
  question: Категориальный признак имеет 8192 уникальные категории. В каждой строке его one-hot представления активна единственная позиция. Какой процент элементов этого блока будет ненулевым?
  explanation: 'В каждой строке заполнена лишь одна позиция из 8192, поэтому доля ненулевых элементов равна обратной величине числа категорий. В процентах это примерно 0.0122%: матрица получается крайне разреженной.'
  kind: numeric
  answer: 0.0122
  tolerance: 0.0001
  id: 026-cardinality-1
  fingerprint: 3248691b
- concept: разреженный формат экономит память на нулях, но не устраняет высокую размерность one-hot представления
  question: После one-hot encoding один признак занял 65536 колонок. Матрицу сохранили в разреженном формате. Какое утверждение верно?
  explanation: Разреженное хранение не записывает большинство нулей и тем самым сокращает расход памяти. Однако пространство признаков остаётся высокоразмерным, поэтому вычисления и обучение модели всё ещё могут быть сложными.
  kind: choice
  options:
    - Нули будут храниться компактнее, но большое число координат всё ещё может усложнять обучение модели
    - Разреженный формат автоматически объединит похожие и редкие категории
    - Для модели все категории превратятся в один числовой признак
