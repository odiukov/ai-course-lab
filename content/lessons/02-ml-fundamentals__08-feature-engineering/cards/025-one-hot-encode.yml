- concept: сортировка уникальных категорий делает соответствие категорий столбцам детерминированным
  question: Функция формирует категории выражением `sorted(set(values))`. Какой список категорий получится для `values = ["груша", "яблоко", "банан", "груша"]`?
  explanation: '`set` устраняет повторы, а `sorted` располагает оставшиеся строки в определённом порядке. Поэтому одна и та же категория получает стабильный столбец независимо от порядка её первого появления.'
  kind: choice
  options:
    - '["яблоко", "банан", "груша"]'
    - '["банан", "груша", "яблоко"]'
    - '["груша", "яблоко", "банан"]'
  correct: 1
  id: 025-one-hot-encode-1
  fingerprint: 03405be5
- concept: строка one-hot строится активацией позиции, найденной через отображение категории в индекс
  question: Список категорий и словарь `cat_to_idx` уже подготовлены. Расположи действия кодирования очередного значения `v` в правильном порядке.
  explanation: Сначала нужна заготовка строки. Затем словарь указывает позицию текущей категории, эта позиция активируется, и только готовая строка добавляется в матрицу.
  kind: order
  items:
    - Создать строку неактивных значений длиной с список категорий
    - Получить индекс столбца из `cat_to_idx[v]`
    - Сделать значение в найденной позиции активным
    - Добавить готовую строку в результат
  id: 025-one-hot-encode-2
  fingerprint: f61141b5
- concept: порядок категорий является частью схемы, необходимой для интерпретации one-hot матрицы
  question: Объясни своими словами, почему функция one-hot кодирования должна возвращать не только матрицу, но и упорядоченный список категорий.
  explanation: Позиция активного элемента имеет смысл только вместе с соответствием между столбцами и категориями. Матрица без этой схемы не сообщает, что именно обозначает каждый столбец.
  kind: open
  reference: Без упорядоченного списка категорий неизвестно, какой категории соответствует каждый столбец матрицы. Этот список сохраняет схему кодирования и позволяет правильно интерпретировать результат.
  id: 025-one-hot-encode-3
  fingerprint: 871717c0
