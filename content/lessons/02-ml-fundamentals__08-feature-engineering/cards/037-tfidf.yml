- concept: слово из каждого документа получает нулевой вес при несглаженном IDF
  question: Объясни своими словами, почему при IDF вида ln(N / df) слово, присутствующее в каждом документе корпуса, исчезает из TF-IDF-векторов.
  explanation: 'Несглаженный IDF полностью подавляет слова, которые встречаются во всём корпусе: они не помогают отличать один документ от другого.'
