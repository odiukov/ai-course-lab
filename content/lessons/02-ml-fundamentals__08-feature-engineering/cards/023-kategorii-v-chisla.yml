- concept: категориальные строки нужно преобразовать в числовое представление, пригодное для вычислений модели
  question: Почему категориальный признак с произвольными строковыми значениями обычно нельзя напрямую передать математической модели?
  explanation: Написание категории не сообщает модели её смысл и не определяет допустимую арифметику. Кодирование переводит категории в числа, но должно при этом не создавать несуществующих отношений.
  kind: open
  reference: 'Большинство моделей выполняет числовые операции над признаками: умножает их на веса, сравнивает величины или вычисляет расстояния. Произвольные строки сами по себе не задают числового значения и отношений между категориями, поэтому их нужно корректно закодировать.'
  id: 023-kategorii-v-chisla-2
