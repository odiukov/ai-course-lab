- concept: Отбор признаков отделяет устойчивый сигнал от случайной подгонки после расширения пространства признаков
  question: После генерации множества полиномиальных признаков и взаимодействий качество на обучающих данных выросло, а на новых данных ухудшилось. Объясни причину и роль отбора признаков.
  explanation: Расширение набора признаков создаёт потенциальные сигналы, но одновременно добавляет шум и возможности для переобучения. Отбор сохраняет признаки, чья польза переносится на данные вне обучающей выборки.
  kind: open
  reference: Чем больше признаков-кандидатов, тем выше вероятность случайных корреляций с целевой переменной. Модель подстраивается под эти совпадения, поэтому переобучается. Отбор признаков с проверкой на отложенных данных или кросс-валидации удаляет нестабильные и бесполезные признаки.
  id: 003-engineering-selection-2
  fingerprint: 8e5f37b6
