- concept: 'мгновенная величина градиента DPO немонотонна по beta: слишком малая beta душит сигнал масштабом, слишком большая — насыщением сигмоиды'
  question: Разность лог-отношений (log-ratio preferred минус log-ratio rejected) для пары зафиксирована и равна 4. Градиент DPO-loss по этой разности равен beta·(σ(beta·4) − 1). При каком значении beta модуль этого градиента наибольший?
  explanation: 'beta входит дважды: множителем снаружи и внутри сигмоиды. При beta = 0.05 логит 0.2, σ ≈ 0.55, градиент ≈ −0.0225 — душит внешний множитель. При beta = 0.3 логит 1.2, σ ≈ 0.769, градиент ≈ −0.069. При beta = 2.5 логит 10, σ ≈ 0.99995, градиент ≈ −0.0001 — сигмоида насыщена, пара считается решённой. Максимум внутри, а не на краю.'
  kind: choice
  options:
    - beta = 0.05
    - beta = 0.3
    - beta = 2.5
    - модуль растёт монотонно с beta, поэтому beta = 2.5
  correct: 1
  id: 043-beta-gradient-1
  fingerprint: dca79339
- concept: 'малый loss пары не означает малый мгновенный градиент: это разные величины, вычисляемые отдельно'
  question: Разность лог-отношений внутри пары равна 4, beta = 0.5. Градиент DPO-loss по этой разности равен beta·(σ(beta·d) − 1). Чему он равен? (укажи со знаком)
  explanation: Логит = 0.5·4 = 2, σ(2) ≈ 0.8808, σ − 1 ≈ −0.1192, умножить на beta = 0.5 даёт ≈ −0.0596. При этом loss = −ln σ(2) ≈ 0.127 — уже мал, но градиент отнюдь не исчез. Мелкий loss и слабый шаг — разные утверждения.
  kind: numeric
  answer: -0.0596
  tolerance: 0.002
  id: 043-beta-gradient-2
  fingerprint: ad254509
- concept: утверждение «большая beta держит политику ближе к reference» относится к точке остановки всей оптимизации, а не к размеру отдельного шага
  question: Beta в DPO одновременно стоит множителем в формуле градиента и при этом считается силой, удерживающей политику рядом с reference. Объясни своими словами, почему тут нет противоречия.
  explanation: 'Ошибка возникает, когда роль beta как коэффициента компромисса (где остановится обучение) подменяется правилом про длину одного шага. Пример из шага: при разности 3 градиент при beta = 1 (−0.0474) по модулю не меньше, чем при beta = 0.1 (−0.0426), хотя loss при beta = 1 намного ниже.'
  kind: open
  reference: 'Это утверждения о разных масштабах времени. Долгосрочно beta задаёт курс обмена: чем она больше, тем меньшее отклонение log-ratio нужно, чтобы дать ту же неявную награду и ту же вероятность предпочтения, поэтому оптимум цели лежит ближе к reference и обучение стремится остановиться раньше. Мгновенно же смотрят на один backward при уже заданной разности лог-отношений: там beta и масштабирует аргумент сигмоиды, и умножает поправку снаружи, так что модуль шага по beta немонотонен и большая beta не обязана давать меньший шаг, чем средняя. Кроме того, итоговое изменение весов зависит ещё и от того, как лог-отношения зависят от параметров. Вывод «beta держит ближе к reference» — про направление и результат всего обучения, а не универсальное правило про размер каждого шага.'
  id: 043-beta-gradient-3
  fingerprint: 14b6ca95
