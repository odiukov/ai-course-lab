- concept: знак и величина неявной награды задаются логарифмом отношения вероятности политики к вероятности референса, умноженным на beta
  question: beta = 0.5. Политика даёт ответу y вероятность 0.015, reference-модель давала тому же ответу 0.06. Чему равна неявная награда R(x,y) без члена с нормировочной константой?
  explanation: 0.015 / 0.06 = 0.25, ln(0.25) ≈ -1.386, умножаем на beta = 0.5, получаем ≈ -0.693. Политика ослабила ответ вчетверо относительно референса, отношение меньше единицы, логарифм отрицателен — значит и неявная награда отрицательна.
  kind: numeric
  answer: -0.693
  tolerance: 0.02
  id: 008-reward-ratio-1
  fingerprint: 8fa741a5
- concept: 'текущая вероятность политики сама по себе не определяет неявную награду: сравнивать нужно отношение к вероятности референса'
  question: Политика присвоила ответам A и B одинаковую вероятность — по 0.08. Reference-модель давала A 0.02, а B 0.32. У какого ответа неявная награда выше?
  explanation: 'R = beta·log(pi/pi_ref) + beta·log Z(x). Для A отношение 0.08/0.02 = 4 (логарифм положителен), для B 0.08/0.32 = 0.25 (логарифм отрицателен). Член с Z(x) у обоих одинаков, промпт один. Совпадение текущих вероятностей ничего не говорит: важно направление сдвига относительно референса.'
  kind: choice
  options:
    - у A
    - у B
    - одинаковая, раз вероятности политики совпадают
    - определить нельзя без обученной модели награды
  correct: 0
