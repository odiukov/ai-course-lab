- concept: нулевой сдвиг относительно референса означает одинаковую неявную награду у всех ответов на промпт
  question: Политика в точности совпадает с reference-моделью на промпте x. Что можно сказать про неявные награды всех возможных ответов на этот промпт? Объясни своими словами.
  explanation: Неявная награда — след сдвига. Нет сдвига — нет и различий в наградах, кроме общего для промпта члена beta·log Z(x), который при сравнении двух ответов всё равно сокращается.
  kind: open
  reference: 'При pi = pi_ref отношение вероятностей равно 1 для любого ответа, логарифм равен нулю, поэтому R(x,y) = beta·log Z(x) — одно и то же число для всех ответов на данный промпт. Значит, неявная награда одинакова у всех ответов и не различает хорошие и плохие. Различия в награде появляются только тогда, когда политика начинает сдвигать вероятности относительно референса: неявная награда кодирует не качество ответа само по себе, а сдвиг, накопленный обучением.'
  id: 008-reward-ratio-3
  fingerprint: 639659af
