- concept: падающий training loss в DPO не свидетельствует о качестве выравнивания — нужны отложенная выборка и метрики зазора/точности предпочтений
  question: На прогоне DPO training loss монотонно падает. Какого вывода из одного этого факта сделать нельзя?
  explanation: 'Training loss — это функция зазора неявных наград на тех же парах, на которых считается градиент. Он честно говорит, что оптимизация движется и зазор растёт на обучающей выборке, но не отличает выученное предпочтение от подгонки под шум и смещения разметки. Поэтому смотрят на отложенную выборку: preference accuracy и reward margin на парах, не участвовавших в обучении.'
  kind: choice
  options:
    - Что модель стала лучше ранжировать предпочтения на данных, которых не видела
    - Что политика в среднем развела логарифмы отношений вероятностей принятых и отвергнутых ответов обучающей выборки
    - Что аргумент сигмоиды на обучающих парах в среднем вырос
    - Что оптимизация численно идёт, а не расходится
  correct: 0
  id: 046-stability-2
