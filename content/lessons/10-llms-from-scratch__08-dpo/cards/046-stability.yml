- concept: 'устойчивость DPO не отменяет чувствительности к learning rate: слишком крупный шаг сдвигает вероятности множества токенов сразу и уводит политику от reference'
  question: DPO часто называют устойчивым по сравнению с PPO. Объясни своими словами, почему при этом слишком большой learning rate всё равно портит обучение.
  explanation: 'Отсутствие RL-цикла убирает один источник нестабильности, но не делает оптимизацию невосприимчивой к размеру шага. Диагностика: скачущий training loss, резкий рост уверенности при малом росте качества на отложенной выборке, деградация беглости и следования инструкциям относительно SFT-чекпойнта.'
  kind: open
  reference: 'Устойчивость DPO касается устройства обучения: нет онлайн-генерации, нет отдельной оценивающей модели, чьи ошибки возвращались бы в следующий шаг. Но сам шаг остаётся обычным градиентным шагом по логарифмам вероятностей. Каждый обучающий пример — это последовательность токенов, и одно крупное обновление сдвигает вероятности сразу множества токенов, а не аккуратно приподнимает предпочитаемый ответ. Последствия: loss скачет вместо ровного спуска, политика быстро становится чрезмерно уверенной (сигмоида насыщается, градиент почти исчезает, и полезное небольшое улучшение проскакивается), а расхождение с reference растёт быстрее, чем beta успевает его штрафовать, — модель теряет удачное поведение, полученное на SFT. Лечится подбором lr, warmup и контролем расхождения с reference, а не тем, что алгоритм «стабильный».'
  id: 046-stability-3
  fingerprint: d298af8f
