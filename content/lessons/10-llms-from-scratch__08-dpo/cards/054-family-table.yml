- concept: требования к памяти и требования к формату разметки — независимые оси выбора метода, экономия по одной не даёт экономии по другой
  question: У команды есть только одна GPU, и разметчики могут помечать ответы поодиночке («хорошо/плохо»), но не выдают пары «этот лучше того». Почему выбор самого экономного по памяти метода (ORPO или SimPO) здесь не решает задачу?
  explanation: Формат данных и объём памяти — независимые оси. ORPO и SimPO держат в памяти одну копию весов и обходятся одним обучающим прогоном, но оба работают с парами. Непарную обратную связь принимает KTO, и он при этом сохраняет замороженный reference и две резидентные копии. Меньшая память не означает более лёгкую разметку и наоборот.
  kind: choice
  options:
    - Оба метода дают нестабильное обучение на моделях, помещающихся в одну GPU
    - Оба требуют парных предпочтений, которых у команды нет; отказ от reference-модели и от отдельного SFT-этапа экономит память, а не упрощает разметку
    - Оба требуют предварительно обученной модели награды, которую без пар не собрать
    - Оба нормируют награду по длине ответа, а для одиночных меток нормировка не определена
