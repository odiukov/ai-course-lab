- concept: колонка «моделей в памяти» измеряет ресурсную нагрузку конвейера, а не качество выравнивания, поэтому не задаёт рейтинг методов
  question: Сравнительная таблица методов выравнивания указывает для каждого метода число моделей, одновременно живущих в памяти. Что эта величина говорит о методе, а что — нет? Объясни своими словами.
  explanation: 'Таблица сравнивает стоимость, а не результат: колонки «моделей в памяти», «нужны ли пары», «нужен ли reference» и «число обучающих прогонов» — четыре разных ограничения. Тренд снижения памяти с трёх-четырёх копий у RLHF до одной у ORPO и SimPO объясняет, почему эти методы быстро разошлись по опенсорсу, но не доказывает, что они дают лучшее выравнивание.'
  kind: open
  reference: 'Число резидентных моделей — это ресурсная характеристика: сколько копий весов (обучаемая политика, замороженный reference, модель награды, value-модель) нужно держать одновременно, то есть сколько видеопамяти требует запуск. Она задаёт нижнюю границу по железу: конвейер из нескольких копий 7B-модели требует многокарточной машины, одна копия влезает в одну карту. Но она ничего не говорит о качестве выравненной модели, о том, насколько хорошо метод передаёт предпочтения людей, и о требованиях к данным. Метод с одной копией в памяти может нуждаться в парных предпочтениях, которые дороже собрать, чем одиночные метки. Поэтому колонка показывает, чем платишь, а не кто победил.'
