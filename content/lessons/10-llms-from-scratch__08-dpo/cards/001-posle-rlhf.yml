- concept: DPO убирает из RLHF отдельную модель награды и этап обучения с подкреплением, обучая политику прямо на парах предпочтений
  question: Команда переходит с классического RLHF на DPO. Что при этом исчезает из пайплайна?
  explanation: DPO выражает оптимальную награду через вероятности самой языковой модели, поэтому отдельный «судья» и PPO не нужны — остаётся один цикл обучения с одной функцией потерь. Пары предпочтений и SFT-этап при этом сохраняются, а референсная (замороженная) модель нужна для расчёта DPO-лосса.
  kind: choice
  options:
    - 'Сбор человеческих пар предпочтений: DPO обучается на неразмеченных диалогах'
    - Отдельно обучаемая модель награды и этап RL-оптимизации политики (PPO)
    - 'Этап SFT: DPO стартует прямо с базовой предобученной модели'
    - 'Референсная копия модели: DPO обходится одной моделью в памяти'
  correct: 1
  id: 001-posle-rlhf-1
  fingerprint: fd903a7f
- concept: порядок этапов выравнивания через DPO
  question: Расставьте этапы выравнивания модели через DPO в правильном порядке.
  explanation: 'DPO не отменяет SFT: политика стартует с SFT-модели, она же служит референсом. Пары предпочтений собираются так же, как для модели награды в RLHF, но идут сразу в обучение политики — вместо цепочки «модель награды затем PPO».'
  kind: order
  items:
    - Дообучить предобученную модель на демонстрациях инструкций (SFT)
    - Собрать пары ответов на запросы и отметить человеком, какой ответ лучше
    - Оптимизировать SFT-модель на этих парах одной функцией потерь DPO, сравнивая её с замороженной референсной копией
  id: 001-posle-rlhf-2
  fingerprint: 8c2bb113
- concept: 'почему отдельная модель награды избыточна: оптимальная награда выражается через логарифмы вероятностей политики относительно референса'
  question: Заголовок статьи о DPO утверждает, что языковая модель «втайне сама является моделью награды». Объясните своими словами, какой факт стоит за этим утверждением и почему он позволяет выбросить отдельную модель награды.
  explanation: Ключ — замкнутая связь между оптимальной политикой и наградой при KL-регуляризации. Награда параметризуется самой моделью, поэтому её не надо обучать отдельно; заодно исчезает главный источник взлома награды и нестабильности PPO.
  kind: open
  reference: 'В RLHF политика, оптимальная при данной награде и KL-ограничении, связана с наградой в замкнутой форме. Это соотношение можно перевернуть: награда выражается через логарифм отношения вероятностей политики и референсной модели (плюс член, зависящий только от запроса и сокращающийся при сравнении двух ответов). Значит, любая языковая модель неявно задаёт функцию награды. Подставив это выражение в функцию правдоподобия предпочтений (Брэдли–Терри), получаем потери, зависящие только от вероятностей самой модели и референса. Обучение превращается в обычный supervised-шаг по парам «предпочтённый/отвергнутый», а отдельная сеть-награда и RL-цикл становятся ненужными.'
  id: 001-posle-rlhf-3
  fingerprint: ac488e33
