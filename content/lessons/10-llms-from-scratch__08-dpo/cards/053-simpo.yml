- concept: балл ответа в SimPO — сумма токенных log-probabilities, делённая на число токенов, поэтому длинный ответ может обойти короткий
  question: 'Метод выравнивания без reference-модели оценивает ответ средней токенной log-probability. Ответ A: 5 токенов, сумма логарифмов вероятностей его токенов равна -7.5. Ответ B: 10 токенов, сумма -12. На сколько балл ответа B выше балла ответа A?'
  explanation: 'Баллы: A = -7.5/5 = -1.5, B = -12/10 = -1.2. Разница 0.3 в пользу B. По суммарной лог-вероятности B выглядел бы хуже (-12 против -7.5), но после деления на длину видно, что модель в среднем увереннее в токенах B. Нормировка меняет исход сравнения.'
  kind: numeric
  answer: 0.3
  tolerance: 0.01
  id: 053-simpo-1
  fingerprint: 5b5d7a78
- concept: деление на длину ответа нужно, чтобы неявная награда не вознаграждала короткие ответы автоматически
  question: Зачем в SimPO сумма логарифмов вероятностей токенов ответа делится на число токенов, а не берётся как есть?
  explanation: Каждый лишний токен добавляет отрицательное слагаемое, поэтому суммарная лог-вероятность длинного ответа почти всегда ниже. Без reference-модели, отношение к которой этот эффект частично гасило, сырая сумма превратилась бы в премию за краткость. Средняя лог-вероятность на токен от длины напрямую не зависит. Диапазон балла остаётся отрицательным (не [0,1]), а Z(x) сокращается внутри пары, а не нормировкой на длину.
  kind: choice
  options:
    - Без деления балл ответа систематически падает с ростом длины, и обучение сдвигает политику к коротким ответам
    - Деление приводит балл в диапазон от 0 до 1 и позволяет подать его в сигмоиду
    - Деление компенсирует отсутствие нормировочной константы Z(x), которую иначе пришлось бы вычислять
    - Деление делает баллы сопоставимыми между разными промптами, чего у DPO нет
  correct: 0
