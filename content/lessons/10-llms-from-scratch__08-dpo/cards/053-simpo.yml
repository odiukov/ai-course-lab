- concept: SimPO снимает требование reference-модели, но не требование парных данных
  question: Что SimPO убирает по сравнению с DPO, а что сохраняет?
  explanation: Неявная награда SimPO — средняя токенная log-probability самой обучаемой модели, поэтому reference не нужен и в памяти живёт одна копия весов вместо двух. Но потеря по-прежнему сравнивает два балла, то есть данные остаются парными. Непарная разметка — это KTO, а объединение SFT с выравниванием в один прогон — ORPO.
  kind: choice
  options:
    - Убирает замороженную reference-модель, сохраняет пары предпочтений на общий промпт
    - Убирает пары предпочтений, сохраняет замороженную reference-модель
    - Убирает и reference-модель, и парные данные — достаточно пометить ответ как хороший или плохой
    - Убирает reference-модель и отдельный этап SFT, сохраняя два обучающих прогона
  correct: 0
  id: 053-simpo-3
  fingerprint: 2a8f55f3
