- concept: 'DPO-logit одинаков при любой из двух группировок четырёх логарифмов: по ответам между моделями или по моделям между ответами'
  question: Один инженер считает DPO-logit как beta*[(logπ_w − logπ_ref,w) − (logπ_l − logπ_ref,l)], второй — как beta*[(logπ_w − logπ_l) − (logπ_ref,w − logπ_ref,l)]. Что получится?
  explanation: 'Обе формы раскрываются в logπ_w − logπ_ref,w − logπ_l + logπ_ref,l, поэтому значение одно. Разница чисто методическая: группировка по ответам даёт два осмысленных log-ratio (сдвиг каждого ответа относительно замороженного reference), которые полезно логировать и смотреть по отдельности.'
  kind: choice
  options:
