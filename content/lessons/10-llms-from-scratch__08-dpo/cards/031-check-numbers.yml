- concept: 'около нулевого логита потеря DPO убывает примерно вдвое медленнее логита: loss ≈ ln2 − z/2'
  question: У пары зазор лог-отношений равен 0,8, коэффициент beta равен 0,05. Чему примерно равна потеря DPO?
  explanation: 'Логит равен 0,05 · 0,8 = 0,04 — очень близко к нулю. Возле нуля −log σ(z) хорошо приближается линией ln2 − z/2, то есть 0,693 − 0,02 ≈ 0,673 (точное значение −ln σ(0,04) = 0,6733). Наклон 1/2, а не 1: маленький логит уменьшает потерю лишь наполовину от своей величины, поэтому при малом beta потеря надолго остаётся у 0,693.'
  kind: numeric
  answer: 0.673
  tolerance: 0.01
  id: 031-check-numbers-1
  fingerprint: 7d9bd768
- concept: потеря зависит от произведения beta на зазор лог-отношений, поэтому разные пары (beta, зазор) с одинаковым произведением дают одинаковую потерю
  question: 'Пара A: зазор лог-отношений 1,6 при beta = 0,25. Пара B: зазор 0,5 при beta = 0,8. Как соотносятся их потери DPO?'
  explanation: 'В сигмоиду попадает только произведение beta на зазор: 0,25 · 1,6 = 0,4 и 0,8 · 0,5 = 0,4. Логиты совпадают, значит совпадают и потери (−ln σ(0,4) ≈ 0,513). Ни зазор сам по себе, ни beta сама по себе значение потери не определяют.'
  kind: choice
  options:
    - У пары A потеря меньше, потому что её зазор больше
    - Потери равны
    - У пары B потеря меньше, потому что её beta больше
    - 'Сравнить нельзя: разные beta делают потери несопоставимыми'
