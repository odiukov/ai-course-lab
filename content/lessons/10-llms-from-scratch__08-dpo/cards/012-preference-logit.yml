- concept: знак зазора лог-отношений решает, кого политика ставит выше, даже если оба лог-отношения положительны
  question: 'В паре предпочтений политика подняла оба ответа относительно reference-модели: log-ratio отмеченного разметкой победителя равен 1,4, log-ratio отвергнутого — 2,0. При beta = 0,4 чему равна предсказанная моделью Брэдли — Терри вероятность победы отмеченного ответа?'
  explanation: Аргумент сигмоиды = beta * (log-ratio победителя − log-ratio проигравшего) = 0,4 * (1,4 − 2,0) = −0,24. sigmoid(−0,24) ≈ 0,44. Оба лог-отношения положительны, но политика подняла отвергнутый ответ сильнее, поэтому зазор отрицательный, а уверенность падает ниже половины — модель сейчас противоречит разметке.
  kind: numeric
  answer: 0.44
  tolerance: 0.02
  id: 012-preference-logit-1
  fingerprint: 9e8436f0
- concept: выход сигмоиды в DPO — вероятность победы в парном сравнении, а не вероятность сгенерировать ответ
  question: На паре ответов выражение sigmoid(beta * (log(pi/pi_ref) у принятого − log(pi/pi_ref) у отвергнутого)) даёт 0,73. Что означает это число?
  explanation: 'Сигмоида применяется к разности неявных наград, то есть моделирует исход парного сравнения. Вероятность генерации — это pi(y|x), совсем другая величина: она произведение вероятностей токенов и обычно крайне мала. 0,73 значит лишь, что текущий перевес принятого ответа согласуется с разметкой.'
  kind: choice
  options:
    - Вероятность того, что политика сгенерирует принятый ответ на данный промпт
    - Вероятность того, что принятый ответ окажется предпочтён отвергнутому в модели Брэдли — Терри при текущих неявных наградах
    - Долю токенов принятого ответа, которым политика назначила вероятность выше, чем reference-модель
    - Вероятность того, что разметчик пометил пару правильно
  correct: 1
  id: 012-preference-logit-2
  fingerprint: 6795f137
- concept: абсолютный уровень лог-отношений не влияет на уверенность — она зависит только от их разности
  question: 'В паре оба лог-отношения отрицательные: политика понизила вероятность и принятого, и отвергнутого ответа относительно reference-модели. Может ли DPO при этом быть уверен в победителе? Объясни, от чего вообще зависит эта уверенность.'
  explanation: 'DPO получает не два независимых балла, а один перевес. Отсюда же следует, что уверенность нельзя прочитать по одному ответу: одиночное лог-отношение без пары ничего не говорит об исходе сравнения.'
  kind: open
  reference: Да, может. В аргумент сигмоиды входит только разность двух лог-отношений, умноженная на beta, а не их уровень. Если у принятого ответа −1,2, а у отвергнутого −3,0, зазор равен +1,8 и уверенность заметно выше половины, хотя оба ответа политика подавила. Одинаковый общий сдвиг обоих лог-отношений (в том числе из-за общей для промпта нормировочной константы) при вычитании сокращается и на предсказанную вероятность предпочтения не влияет. Значение имеет только то, насколько сильнее принятый ответ поднят (или слабее опущен) относительно референса, чем отвергнутый.
  id: 012-preference-logit-3
  fingerprint: e31f5a10
