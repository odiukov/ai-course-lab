- concept: в PPO-конвейере обучаемых компонентов меньше, чем резидентных, — reward model и reference только выдают оценки, но занимают память наравне с обучаемыми
  question: В конвейере PPO рядом живут политика, reference, модель награды и функция ценности. Объясни своими словами, какие из них обучаются на этапе PPO, какие только вычисляют, и почему для планирования GPU-памяти это различие не помогает.
  explanation: 'Типичная ошибка расчёта: «обучаемая модель одна, значит и копия одна». Обучаемость определяет, нужны ли градиенты и состояние оптимизатора; резидентность определяется тем, участвует ли модель в вычислениях вообще. К этому в реальном запуске добавляется память под активации, поэтому расчёт «только по весам» — нижняя граница, а не полная смета.'
  kind: open
  reference: 'На этапе PPO обновляются политика и функция ценности; reference и модель награды заморожены — они только выдают числа (лог-вероятности для KL-штрафа и скалярную награду). Но память под веса занимают все четыре: чтобы получить оценку, модель должна быть загружена и сделать прямой проход. Различие обучаемых и замороженных влияет на память под градиенты и состояние оптимизатора, а не на количество резидентных комплектов весов. Поэтому при планировании железа считают число одновременно живых копий, а не число обучаемых моделей.'
