  fingerprint: e289dd4b
- concept: заморозка модели убирает градиенты и состояние оптимизатора, но не веса, поэтому замороженная копия дешевле обучаемой, а не бесплатна
  question: Комплект весов модели занимает 45 ГБ. Для обучаемой модели дополнительно хранятся градиенты того же размера и состояние оптимизатора размером 90 ГБ; для замороженной — ничего сверх весов. Сколько гигабайт займут вместе обучаемая policy и замороженная reference?
  explanation: 'Policy: 45 (веса) + 45 (градиенты) + 90 (оптимизатор) = 180 ГБ. Reference: только 45 ГБ весов. Итого 225 ГБ. Заморозка снимает градиенты и состояние оптимизатора, но копия весов остаётся в памяти — поэтому вторая модель дешевле первой, но не нулевая.'
  kind: numeric
  answer: 225
  tolerance: 1
