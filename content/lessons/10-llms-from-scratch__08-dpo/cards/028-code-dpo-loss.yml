- concept: 'потеря DPO и зазор неявных наград связаны обратимо: по значению loss однозначно восстанавливается аргумент сигмоиды, z = -ln(exp(loss) - 1)'
  question: Для одной пары предпочтений потеря DPO равна 0.40. Чему равен аргумент сигмоиды (DPO-logit) для этой пары?
  explanation: loss = -log σ(z), значит σ(z) = exp(-loss) = exp(-0.40) ≈ 0.6703, а z = ln(0.6703 / 0.3297) ≈ 0.71. Связь строго монотонна и обратима, поэтому для одной пары loss и зазор наград несут одну и ту же информацию; диагностика полезна не сама по себе, а тем, что раскладывает этот зазор на два отдельных слагаемых по ответам.
  kind: numeric
  answer: 0.71
  tolerance: 0.03
  id: 028-code-dpo-loss-1
  fingerprint: 4ce8ab88
- concept: диагностические numpy-скаляры приводятся к обычному python-типу перед складыванием в словарь метрик
  question: Диагностика DPO собирается в словарь для печати и записи в JSON-лог. Чего не хватает, чтобы значения не остались numpy-скалярами?
  explanation: Арифметика над numpy-массивами даёт np.float64, который печатается громоздко и не сериализуется стандартным json. Явное приведение float(...) превращает скаляр в обычное python-число; на само значение loss это не влияет, влияет только на удобство логирования.
  kind: cloze
  template: 'metrics = {"reward_margin": ___(preferred_reward - rejected_reward)}'
  answer: float
  accept:
    - float()
    - 'float '
    - float
  id: 028-code-dpo-loss-2
  fingerprint: f025deb2
