- concept: разница наград двух ответов меняет их отношение вероятностей в exp(ΔR/β) раз
  question: Оптимальная политика KL-регуляризованной задачи равна pi_ref(y|x)·exp(R(x,y)/beta)/Z(x). Пусть beta = 0.5, а награда ответа A превышает награду ответа B на 1.5. Во сколько раз отношение pi*(A|x)/pi*(B|x) больше, чем pi_ref(A|x)/pi_ref(B|x)?
  explanation: 'Отношение вероятностей двух ответов на один промпт: pi*(A)/pi*(B) = [pi_ref(A)/pi_ref(B)]·exp((R_A − R_B)/beta). Z(x) сокращается, потому что промпт один. exp(1.5/0.5) = exp(3) ≈ 20.09. Меньшая beta делает тот же перевес наград сильнее: при beta = 0.25 было бы exp(6) ≈ 403.'
  kind: numeric
  answer: 20.09
  tolerance: 0.5
  id: 007-optimal-policy-1
  fingerprint: 41bd8a26
- concept: экспоненциальное перевзвешивание не создаёт вероятность там, где у референса она нулевая
  question: Ответ y получает от модели награды очень высокую оценку, но reference-модель приписывает ему вероятность ровно 0. Какова вероятность y у оптимальной политики pi*(y|x) = pi_ref(y|x)·exp(R(x,y)/beta)/Z(x)?
  explanation: 'Награда входит множителем, а не слагаемым. Носитель оптимальной политики вложен в носитель референса: то, чего референс не порождает, не породит и выравненная модель, какой бы ни была награда. Отсюда практическое следствие — потолок выравнивания задан базовой моделью, а SFT-этап нужен как раз чтобы поднять нужные ответы над нулём.'
  kind: choice
  options:
    - 'Нулевая: экспонента награды — множитель, а любой конечный множитель на ноль даёт ноль'
    - 'Высокая: экспонента награды компенсирует нулевую reference-вероятность'
    - 'Равна 1/Z(x): нормировка сама выдаёт ответу минимальную ненулевую массу'
    - 'Зависит от beta: при малой beta вероятность станет положительной'
  correct: 0
  id: 007-optimal-policy-2
  fingerprint: 924ca650
- concept: нормировочная константа зависит только от промпта и одинакова для всех ответов на него
  question: В выражении оптимальной политики pi*(y|x) = pi_ref(y|x)·exp(R(x,y)/beta)/Z(x) знаменатель Z(x) написан как функция только от x. Объясни своими словами, почему он не зависит от y и почему его практически невозможно вычислить.
  explanation: Z(x) — не свободный параметр, а сумма по всему пространству ответов, поэтому индекс y в ней связан. Именно её невычислимость закрывает путь «посчитать pi* напрямую» и объясняет, почему работать приходится со сравнениями ответов на общий промпт, где Z(x) уходит.
  kind: open
  reference: 'Z(x) — сумма pi_ref(y''|x)·exp(R(x,y'')/beta) по всем возможным ответам y'' на промпт x. Переменная суммирования y'' пробегает все ответы, поэтому в результате её не остаётся: число зависит только от промпта. Его роль — привести перевзвешенные веса обратно к сумме 1. Вычислить его нельзя, потому что множество возможных ответов — все последовательности токенов, их экспоненциально много, перебор невозможен. Следствие: абсолютную вероятность отдельного ответа по этой формуле не получить, а вот отношение двух ответов на один и тот же промпт считается, так как одинаковый Z(x) сокращается.'
  id: 007-optimal-policy-3
  fingerprint: 1593be5a
