- concept: неявная награда отвергнутого ответа положительна, если policy подняла его вероятность относительно reference — знак задаёт сдвиг к reference, а не метка ответа в паре
  question: 'В DPO с beta = 0.4 для пары посчитали лог-вероятности. Отвергнутый ответ: policy даёт −17.3, reference даёт −18.05. Чему равна неявная награда отвергнутого ответа?'
  explanation: 'Лог-отношение = −17.3 − (−18.05) = 0.75, неявная награда = 0.4 · 0.75 = 0.3. Число положительное, хотя ответ помечен как отвергнутый: неявная награда измеряет только сдвиг вероятности относительно reference. Если preferred при этом имеет лог-отношение 0.9 (награда 0.36), policy подняла оба ответа, но preferred — сильнее, и зазор наград всё равно положителен (0.06).'
  kind: numeric
  answer: 0.3
  tolerance: 0.01
  id: 032-implicit-reward-1
  fingerprint: c1dc5436
- concept: две неявные награды по отдельности показывают, за счёт чего вырос их зазор — подъёма preferred или подавления rejected, — чего сам зазор (и потеря) различить не может
  question: Два прогона DPO дали одинаковый зазор неявных наград 0.6. В первом прогоне награды равны +0.45 и −0.15, во втором −0.35 и −0.95. Что даёт логирование двух наград по отдельности, чего не даёт один зазор?
  explanation: 'Потеря DPO зависит только от зазора, поэтому оба прогона неотличимы по loss. Раздельные награды показывают абсолютное направление сдвига каждого ответа относительно reference: во втором прогоне зазор набран проваливанием отвергнутого ответа сильнее, чем preferred, при том что и preferred просел (−0.35). Про нормировочную константу неявные награды ничего не говорят — она в них не восстанавливается.'
  kind: choice
  options:
    - Видно, что во втором прогоне policy опустила относительно reference вероятность обоих ответов, а в первом подняла preferred — при одинаковом зазоре и одинаковой потере
    - Видно, что во втором прогоне потеря выше, потому что обе награды отрицательные
    - Видно, что во втором прогоне обучение идёт быстрее, потому что модуль наград больше
    - Видно, что во втором прогоне нормировочная константа промпта отрицательна
