- concept: функция потерь DPO — отрицательное логарифмическое правдоподобие пары под моделью Брэдли — Терри, то есть логистическая потеря от разности неявных наград
  question: Модель предпочтений даёт вероятность выбора принятого ответа. Обучение по паре — максимизация правдоподобия этой вероятности. Какая функция стоит на месте пропуска в записи потерь DPO?
  explanation: Брэдли — Терри задаёт P(y_w > y_l) = sigmoid(разность наград). Максимизация правдоподобия пары = минимизация -log этой вероятности, то есть логистическая потеря от аргумента beta*(разность лог-отношений). На практике берут logsigmoid ради численной устойчивости.
  kind: cloze
  template: loss = -log( ___( beta * ( (logp_w - logp_ref_w) - (logp_l - logp_ref_l) ) ) )
  answer: sigmoid
  accept:
    - sigmoid
    - sigma
    - σ
    - torch.sigmoid
    - logsigmoid
    - логистическая функция
    - сигмоида
