- concept: в самом начале DPO политика совпадает с референсом, аргумент сигмоиды нулевой и стартовый loss равен -log(0.5) для любой пары
  question: 'Запуск DPO: веса политики только что скопированы с reference-модели, ни одного шага оптимизатора не сделано. Чему равен loss на первом батче пар предпочтений?'
  explanation: Пока политика равна референсу, оба лог-отношения равны нулю, их разность тоже ноль, sigmoid(0) = 0.5 и loss = -log(0.5) ≈ 0.693 независимо от beta и от содержания пары. Стартовое значение, заметно отличающееся от 0.693, означает, что референс не совпадает с исходной политикой или что маски/суммирование логвероятностей посчитаны неверно.
  kind: numeric
  answer: 0.693
  tolerance: 0.02
