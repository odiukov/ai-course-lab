- concept: нулевой DPO-logit означает равный сдвиг обоих ответов относительно reference, а не совпадение policy с reference
  question: Обучение DPO идёт давно, веса policy заметно ушли от reference. На очередной паре DPO-logit получился ровно нулевым. Что из этого следует?
  explanation: 'DPO-logit = beta·((log p_policy(y+) − log p_ref(y+)) − (log p_policy(y−) − log p_ref(y−))). Ноль получается, когда два лог-отношения равны — например оба равны −4.0 или оба +1.5. Это ничего не говорит ни о равенстве весов, ни о равенстве вероятностей ответов: равны только сдвиги. Потеря при этом равна −log σ(0) ≈ 0.693.'
  kind: choice
  options:
    - На этой паре policy вернулась к весам reference-модели
    - Policy сдвинула лог-вероятности принятого и отвергнутого ответов на одну и ту же величину, относительное предпочтение пары не изменилось
    - Policy присвоила обоим ответам пары одинаковую вероятность
    - Коэффициент beta для этой пары обнулился
  correct: 1
  id: 026-logit-sign-1
  fingerprint: b9a0e170
- concept: положительный beta масштабирует DPO-logit и потерю, но не может изменить его знак — знак задаёт только зазор лог-отношений
  question: 'Лог-отношения пары зафиксированы: у принятого ответа −0.5, у отвергнутого −1.25. Значение beta подняли с 0.05 до 0.4. Что произойдёт?'
  explanation: 'Зазор равен −0.5 − (−1.25) = 0.75 и от beta не зависит. Умножение на положительное число сохраняет знак: 0.05·0.75 = 0.0375 против 0.4·0.75 = 0.3. Потеря −log σ(z) убывает по z, поэтому она падает примерно с 0.674 до 0.554. Оба лог-отношения отрицательны, но решает их разность, а не уровень.'
  kind: choice
  options:
    - Знак DPO-logit не изменится, его модуль вырастет в 8 раз, потеря станет меньше
    - Знак DPO-logit перевернётся, потому что beta слишком велика
    - 'DPO-logit не изменится: beta влияет только на KL-штраф, а не на аргумент сигмоиды'
    - Знак станет отрицательным, потому что оба лог-отношения отрицательны
