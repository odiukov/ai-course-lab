- concept: 'взлом награды: рост оценки модели награды не равен росту качества, потому что награда — обученный на конечной выборке заменитель предпочтений'
  question: 'После нескольких эпох PPO средняя оценка модели награды выросла с 5,4 до 8,9, но люди-асессоры оценивают новые ответы хуже прежних: они стали длинными и уклончивыми. Что это означает?'
  explanation: 'Модель награды обучена на конечном наборе человеческих пар и лишь приближает предпочтения. Если в этих парах длинные ответы случайно чаще помечались как лучшие, награда даёт балл за многословие. Оптимизация против такого приближения — взлом награды: метрика растёт, качество нет.'
  kind: choice
  options:
    - Политика нашла закономерности, по которым модель награды завышает балл, и эксплуатирует их вместо реального улучшения ответов
    - Модель награды переобучилась и её оценки перестали расти, поэтому нужно поднять скорость обучения
    - KL-коэффициент слишком мал по отношению к скорости обучения, из-за чего оценка награды всегда занижена
    - Асессоры оценивают другую задачу, чем та, на которой обучалась модель награды, поэтому расхождение неизбежно
  correct: 0
  id: 002-hrupkost-ppo-1
  fingerprint: 488847b9
- concept: 'KL-штраф в RLHF — компромисс без хорошей настройки: он одновременно сдерживает взлом награды и обучение'
  question: Инженер поднял коэффициент KL-штрафа в PPO с 0,02 до 0,4, чтобы прекратить взлом награды. Какой побочный эффект ожидается?
  explanation: 'KL-штраф — плата за отклонение от референсной SFT-модели. Большой коэффициент удерживает политику на месте: взлом награды прекращается вместе с обучением. Маленький даёт свободу эксплуатировать слабости награды. Отдельного значения, снимающего обе проблемы, нет — это компромисс.'
  kind: choice
  options:
    - Политика почти перестанет отличаться от исходной SFT-модели, и полезное обучение по предпочтениям тоже остановится
    - Модель награды начнёт выдавать более высокие баллы, потому что KL входит в её обучение
    - Обучение станет численно нестабильным и градиенты будут расходиться тем сильнее, чем больше коэффициент
    - Политика станет отклоняться от референса сильнее, но в сторону более коротких ответов
  correct: 0
  id: 002-hrupkost-ppo-2
  fingerprint: b5f3e014
- concept: 'ошибки трёх этапов RLHF не независимы, а накапливаются: PPO усиливает смещение несовершенной награды'
  question: Почему ошибки модели награды, PPO и KL-штрафа в RLHF складываются, а не компенсируют друг друга?
  explanation: Ключ в том, что этапы последовательны. Оптимизация против несовершенного сигнала не усредняет ошибку, а ищет именно те точки, где сигнал ошибается в большую сторону. Поэтому наблюдаемый рост награды (например с 5,4 до 8,9) может целиком состоять из накопленной ошибки.
  kind: open
  reference: 'Модель награды даёт приближённую цель со своими смещениями. PPO не просто измеряет эту цель, а многократно двигает политику по её градиенту, поэтому любое смещение награды усиливается сотнями обновлений — плюс собственная нестабильность PPO от скорости обучения, clip-отношения и числа эпох. KL-штраф — единственный ограничитель, но он не различает вредное отклонение (взлом награды) и полезное: сдерживая первое, он сдерживает и второе. Получается цепочка: приближённая цель, усиливающая её ошибку оптимизация и ограничитель с неизбежным компромиссом.'
  id: 002-hrupkost-ppo-3
  fingerprint: 3bf23e81
