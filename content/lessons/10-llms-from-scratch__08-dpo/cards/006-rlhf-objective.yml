- concept: коэффициент beta задаёт курс обмена награды на KL-отклонение, и при некотором его значении два кандидата с разной наградой и разным KL становятся равноценными
  question: 'Цель выравнивания: E[R] − beta·KL(pi‖pi_ref). Кандидат A имеет среднюю награду 14 при KL = 3. Кандидат B имеет награду 26 при KL = 11. При каком значении beta оба кандидата дают одинаковое значение цели?'
  explanation: 'Приравниваем: 14 − 3·beta = 26 − 11·beta, откуда 8·beta = 12 и beta = 1.5. Проверка: 14 − 4.5 = 9.5 и 26 − 16.5 = 9.5. Ниже этого порога выгоднее B (награда дешевле оплачивается отклонением), выше — A.'
  kind: numeric
  answer: 1.5
  tolerance: 0.01
  id: 006-rlhf-objective-1
  fingerprint: 88a33653
- concept: рост beta смещает оптимум цели к политике, близкой к референсу, ценой недобора награды
  question: Команда увеличивает beta в цели E[R] − beta·KL(pi‖pi_ref) с 0.05 до 0.6 и переобучает модель. Что произойдёт с решением задачи оптимизации?
  explanation: 'beta — цена одной единицы KL, выраженная в единицах награды. Чем она выше, тем меньше отклонения окупаются: оптимум сдвигается к референсу, а средняя награда падает. Награда и KL входят в цель с разными знаками, поэтому одновременно вырасти в оптимуме они не могут.'
  kind: choice
  options:
    - Модель уйдёт дальше от reference-модели, потому что штраф теперь весомее и его надо перекрывать большей наградой
    - Модель останется ближе к reference-модели и, скорее всего, наберёт меньшую среднюю награду
    - 'И KL, и средняя награда вырастут: beta масштабирует оба члена цели одинаково'
    - 'Ничего не изменится: beta влияет только на скорость сходимости, но не на то, какая политика оптимальна'
  correct: 1
  id: 006-rlhf-objective-2
  fingerprint: c65553cb
- concept: KL-член измеряет расхождение распределений обучаемой политики и референса, а не качество ответов
  question: Модель показывает высокую среднюю награду, но и очень большой KL относительно reference-версии. Объясни своими словами, что именно измеряет KL-член и почему один только рост награды не говорит, что модель стала лучше.
  explanation: 'Ключевое различие: награда оценивает ответы, KL — расстояние между распределениями. Всё, что модель умела, но что награда не покрывает, защищено только KL-членом, поэтому цель максимизируют по разности, а не по одной награде.'
  kind: open
  reference: 'KL(pi‖pi_ref) измеряет, насколько распределение вероятностей обучаемой политики разошлось с распределением исходной reference-модели, — это расстояние между поведениями, а не оценка качества ответов. Награда — оценка внешнего оценщика на конечном наборе; максимизируя её без ограничений, модель может уйти в узкий режим генерации, потерять разнообразие и прежние языковые умения, которые наградой не измеряются. Поэтому цель складывает оба сигнала: награда тянет к предпочтениям людей, KL удерживает распределение рядом с исходным, и решением задачи считается баланс, а не максимум награды любой ценой.'
  id: 006-rlhf-objective-3
  fingerprint: f852e861
