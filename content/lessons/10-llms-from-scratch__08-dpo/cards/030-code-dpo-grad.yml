- concept: beta входит в градиент по policy-logprob множителем, так как logit равен beta, умноженной на разность лог-отношений
  question: В DPO аргумент сигмоиды равен z = beta*(разность лог-отношений принятого и отвергнутого ответов). Обучение идёт с beta = 0.2, для текущей пары z = -1.5. Чему равен градиент потери по policy-logprob предпочитаемого ответа?
  explanation: Потеря -log σ(z) даёт по z множитель σ(z)-1, а сам z линеен по policy-logprob предпочитаемого ответа с коэффициентом beta. По цепному правилу g = beta*(σ(z)-1) = 0.2*(0.1824-1) ≈ -0.1635. Beta не только масштабирует потерю, но и напрямую задаёт величину шага.
  kind: numeric
  answer: -0.1635
  tolerance: 0.005
  id: 030-code-dpo-grad-1
  fingerprint: f9bca0f5
- concept: оптимизатор вычитает градиент, поэтому отрицательный градиент по logprob предпочитаемого ответа поднимает его вероятность
  question: Градиент DPO-потери по policy-logprob принятого ответа получился равным -0.4. Что произойдёт с этой log-probability после шага градиентного спуска?
  explanation: 'Правило обновления x ← x - lr*grad. При grad = -0.4 получаем x + 0.4*lr, то есть рост log-probability принятого ответа — ровно то, чего требует DPO. Путаница со знаком здесь самая частая ошибка: сама потеря убывает, а параметр растёт.'
  kind: choice
  options:
    - 'Вырастет: шаг вычитает градиент, вычитание отрицательного числа увеличивает величину'
    - 'Упадёт: отрицательный градиент всегда означает уменьшение параметра'
    - 'Не изменится: знак градиента влияет только на отвергнутый ответ'
    - Упадёт, если beta положительна, и вырастет, если beta отрицательна
  correct: 0
  id: 030-code-dpo-grad-2
  fingerprint: d5480e4a
- concept: градиенты по двум policy-logprob равны по модулю и противоположны по знаку, их сумма нулевая
  question: Заполни пропуск в возврате аналитического градиента DPO по двум policy-logprob одной пары.
  explanation: 'logit входит в оба logprob линейно, но с противоположными коэффициентами: +beta у принятого и -beta у отвергнутого. Поэтому градиенты зеркальны, их сумма равна нулю, и шаг ровно настолько поднимает принятый ответ, насколько опускает отвергнутый.'
  kind: cloze
  template: |-
    g = beta * (sigmoid(logit) - 1.0)
    grad_policy_preferred = g
    grad_policy_rejected = ___
  answer: -g
  accept:
    - '- g'
    - -1.0 * g
    - -1 * g
    - (-1)*g
  id: 030-code-dpo-grad-3
  fingerprint: ee92a53a
