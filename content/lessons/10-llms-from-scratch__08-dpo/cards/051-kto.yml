- concept: KTO снимает требование парных данных, но сохраняет замороженную reference-модель и две резидентные копии весов
  question: Что именно KTO убирает по сравнению с DPO, а что оставляет?
  explanation: 'KTO меняет формат данных, а не вычислительную схему: сдвиг вероятности ответа по-прежнему меряется относительно замороженного референса, значит в памяти две модели, как в DPO. Reference-модель выбрасывает SimPO (заменяя лог-отношение нормированной по длине средней лог-вероятностью), а отдельный этап SFT сливает с выравниванием ORPO — это другие методы.'
  kind: choice
  options:
    - Убирает парность данных; замороженная reference-модель остаётся, в памяти по-прежнему живут policy и reference
    - Убирает reference-модель; парные данные остаются обязательными
    - Убирает и парность данных, и reference-модель, оставляя одну копию весов
    - Убирает отдельный этап SFT, объединяя его с выравниванием в один прогон
