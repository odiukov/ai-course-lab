- concept: 'асимметрия функции потерь KTO: неприятие потерь из теории перспектив делает штраф за плохой ответ сильнее поощрения за равный по величине хороший'
  question: Функция потерь KTO взвешивает вклад «хороших» и «плохих» ответов неодинаково. Объясни, какая идея из теории перспектив за этим стоит и как асимметрия проявляется в обучении.
  explanation: 'Ключ в том, что асимметрия не побочный трюк, а прямой перенос неприятия потерь: сила отталкивания от плохого больше силы притяжения к хорошему. Раз метки независимы и не сбалансированы парой, вес каждого класса становится настраиваемой частью функции потерь.'
  kind: open
  reference: 'Теория перспектив Канемана и Тверски: неприятие потерь — потеря субъективно весит больше, чем выигрыш той же величины. KTO переносит это в функцию потерь: сдвиг вероятности вниз для ответа с меткой «плохо» штрафуется сильнее, чем поощряется равный по величине сдвиг вверх для ответа с меткой «хорошо». Механика на каждом примере одна: сравнивается лог-вероятность ответа под обучаемой политикой с лог-вероятностью под замороженным референсом; хорошая метка толкает этот сдвиг вверх, плохая — вниз, но с большим весом. Практический смысл: модель осторожнее относительно порождения помеченного как плохое, и разный вес позволяет балансировать перекос датасета, где хороших и плохих примеров обычно не поровну.'
  id: 051-kto-3
  fingerprint: 222ca372
