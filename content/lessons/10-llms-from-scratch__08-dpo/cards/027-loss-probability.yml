- concept: штраф за пару равен минус натуральному логарифму вероятности правильного ранжирования
  question: Модель оценивает вероятность того, что предпочитаемый ответ победит отвергнутый, в 0,25. Чему равен штраф за эту пару при обучении по парным предпочтениям?
  explanation: Штраф = -log p = -log 0,25 ≈ 1,39. Вероятность ниже нейтральной означает, что модель ставит отвергнутый ответ выше предпочитаемого, и пара обходится дороже нейтральной оценки.
  kind: numeric
  answer: 1.39
  tolerance: 0.03
  id: 027-loss-probability-1
  fingerprint: 51fefda6
- concept: разность штрафов двух пар определяется отношением их вероятностей, а не их разностью
  question: Пара A получила вероятность правильного ранжирования 0,9, пара B — 0,3. Насколько штраф за B больше штрафа за A?
  explanation: L_B - L_A = -log 0,3 + log 0,9 = log(0,9/0,3) = log 3 ≈ 1,10. Логарифм переводит отношение вероятностей в разность штрафов, поэтому одинаковое кратное падение уверенности всегда добавляет одинаковую величину штрафа — падение с 0,9 до 0,3 и с 0,3 до 0,1 стоят поровну.
  kind: choice
  options:
    - на 0,60 — по разности вероятностей
    - на 1,10 — по логарифму отношения вероятностей
    - на 3,00 — во столько раз отличаются вероятности
    - штрафы равны, потому что обе вероятности выше нуля
  correct: 1
  id: 027-loss-probability-2
  fingerprint: 9856d8d6
- concept: штраф вида -log p неотрицателен и обнуляется только в недостижимом пределе полной уверенности
  question: Может ли штраф за отдельную пару предпочтений стать нулевым или отрицательным при конечных лог-вероятностях? Объясни своими словами.
  explanation: Сигмоида отображает всю числовую прямую в открытый интервал (0; 1). Логарифм такой величины всегда отрицателен, минус перед ним делает штраф положительным. При очень уверенном верном ранжировании штраф стремится к нулю, но не достигает его; при уверенном неверном — растёт неограниченно.
  kind: open
  reference: 'Нет. Вероятность правильного ранжирования — выход сигмоиды, она строго между нулём и единицей и никогда не равна единице при конечном аргументе. Значит -log p строго больше нуля: штраф неотрицателен, обнуляется только в пределе полной уверенности, который недостижим. Отрицательным он стать не может, потому что для этого понадобилась бы вероятность больше единицы. Практический вывод: loss можно сколь угодно приближать к нулю, но модель всегда сохраняет ненулевой градиент по паре.'
  id: 027-loss-probability-3
  fingerprint: 906b35d3
