- concept: две формы sigmoid алгебраически тождественны — они отличаются домножением числителя и знаменателя на exp(z), а не значением
  question: Объясни своими словами, почему 1/(1 + exp(-z)) и exp(z)/(1 + exp(z)) — это одна и та же функция, и что тогда меняет переключение между ними.
  explanation: Ключ в том, что это тождественное преобразование, а не другая функция и не аппроксимация. Ветвление не улучшает точность формулы — оно выбирает ту из двух записей, где промежуточное число заведомо помещается в float. Поэтому в коде и стоит np.where по знаку логита, а не одна формула с проверкой результата постфактум.
  kind: open
  reference: 'Домножь числитель и знаменатель первой дроби на exp(z): 1/(1 + exp(-z)) = exp(z)/(exp(z) + exp(z)·exp(-z)) = exp(z)/(exp(z) + 1). Это тождество, верное для любого вещественного z, поэтому математически формы неразличимы и никакого приближения не вводится. Меняется только маршрут вычисления в конечной арифметике: в первой форме экспонента берётся от -z, во второй — от z, и ветвление по знаку z гарантирует, что показатель всегда неположителен, а значит exp лежит в (0, 1]. Переполнения не возникает; худшее, что случается, — underflow до нуля, что для σ и так корректный предел.'
  id: 014-stable-sigmoid-3
  fingerprint: 0c197aca
