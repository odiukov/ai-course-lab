- concept: вероятность предпочтения внутри пары считается по разности логарифмов отношений вероятностей, умноженной на beta, без всякого знания нормировочной константы
  question: beta = 0.5. Для принятого ответа log(pi(y_w|x)/pi_ref(y_w|x)) = 1.6, для отвергнутого log(pi(y_l|x)/pi_ref(y_l|x)) = 0.4. Нормировочная константа промпта неизвестна. Чему равна вероятность предпочтения P(y_w > y_l | x) по модели Брэдли-Терри?
  explanation: 0.5*(1.6 − 0.4) = 0.6, sigmoid(0.6) ≈ 0.6457. Неизвестная константа входит в обе награды одинаково и в разности исчезает, поэтому ответ считается полностью.
