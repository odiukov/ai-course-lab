- concept: неявная награда сопоставима только внутри одного промпта, поэтому ранжирование любого числа ответов на общий промпт возможно, а сравнение по абсолютной шкале между промптами — нет
  question: 'У тебя есть 5 ответов на один промпт и 5 ответов на другой. Объясни своими словами, что с обученной DPO-политикой можно сделать корректно: упорядочить ответы внутри каждого промпта, назвать лучший ответ во всём наборе из десяти, и почему.'
  explanation: 'Сокращение работает для любого числа ответов, лишь бы промпт был общий: константа сдвигает все значения одинаково и порядок сохраняется. Как только промпты разные, остаётся неизвестная разность констант, и сравнение теряет смысл.'
  kind: open
  reference: Внутри одного промпта неизвестное слагаемое beta*log Z(x) одинаково у всех ответов, поэтому оно не меняет их порядок — ранжировать все 5 ответов по beta*log(pi/pi_ref) корректно. Между двумя промптами константы разные и неизвестные, их разность не сокращается, значит числа с разных промптов лежат на разных шкалах и выбирать лучший из всех десяти по этим значениям нельзя. Абсолютной оценки качества DPO не даёт ни в одном случае — только относительный порядок при общем промпте.
