- concept: строка логитов, предсказывающая первый токен ответа, стоит на позиции len(prompt_tokens) - 1 из-за сдвига вход/цель
  question: Промпт из 12 токенов склеен с ответом из 7 токенов, вся последовательность помещается в лимит длины. Вход — все токены кроме последнего, цели — все кроме первого. С какого индекса строки матрицы log-probabilities начинается участок, относящийся к токенам ответа?
  explanation: Строка i предсказывает токен i+1. Первый токен ответа стоит в полной последовательности на позиции 12, значит его предсказывает последний токен промпта — строка с индексом 12 - 1 = 11. Срезать с 12 значит потерять первый токен ответа, срезать с 10 — приплюсовать последний токен промпта.
  kind: numeric
  answer: 11
  tolerance: 0.01
  id: 022-code-sequence-logprob-1
  fingerprint: f0b76353
- concept: обрезка склеенной последовательности по лимиту длины может выкинуть весь ответ, и тогда суммировать нечего
  question: Промпт занимает 90 токенов, ответ 12, лимит длины модели 64 токена. Последовательность обрезается справа. Что должна вернуть функция суммарной лог-вероятности ответа?
  explanation: 'После обрезки до 64 позиций весь ответ отброшен: начало участка ответа (89) оказывается правее конца целей (63). Пустой срез суммировать нельзя, а лог-вероятности промпта в DPO не входят — функция возвращает нейтральный ноль. Тот же случай — слишком короткая последовательность, из которой не собрать ни одной пары «вход → следующий токен».'
  kind: choice
  options:
    - 'Нулевую лог-вероятность: после обрезки в целях не осталось ни одного токена ответа'
    - Сумму лог-вероятностей последних 64 токенов промпта — они заменяют ответ
    - 'Лог-вероятность первого токена ответа: он всегда попадает в окно'
    - Сильно отрицательное число, потому что модель не видела ответ
