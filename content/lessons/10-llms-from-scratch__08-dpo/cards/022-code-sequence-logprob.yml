- concept: из строки log-probabilities берётся столбец, равный идентификатору фактического target-токена
  question: 'Дополни выборку лог-вероятности фактически встретившегося токена: в строке шага i нужен столбец правильного целевого токена.'
  explanation: 'Строка log_probs[i] — распределение по всему словарю на позиции i. Нужен ровно тот столбец, чей индекс равен id реального токена ответа: log P(target | контекст). Взять argmax или максимум строки — оценка самого вероятного токена, а не того, который стоит в ответе; сумма по всей строке даст логарифмы всех вариантов сразу.'
