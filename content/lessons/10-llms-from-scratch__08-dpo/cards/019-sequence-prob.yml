- concept: лог-вероятность ответа равна сумме логарифмов вероятностей его токенов
  question: Модель присвоила четырём токенам ответа вероятности 0,9; 0,6; 0,4 и 0,2 (каждая — на своей позиции при уже выбранных предыдущих токенах). Чему равен log P(y|x) для всего ответа (натуральный логарифм)?
  explanation: 'Вероятности токенов перемножаются: 0,9·0,6·0,4·0,2 = 0,0432. Логарифм превращает произведение в сумму: ln0,9 + ln0,6 + ln0,4 + ln0,2 ≈ −0,105 − 0,511 − 0,916 − 1,609 ≈ −3,14. То же самое, что ln(0,0432). Именно эту сумму DPO использует как одно число для всего ответа.'
  kind: numeric
  answer: -3.14
  tolerance: 0.05
  id: 019-sequence-prob-1
  fingerprint: 9600e985
- concept: при равной уверенности на токен более длинный ответ получает более отрицательную суммарную лог-вероятность
  question: 'Два ответа на один промпт: первый из 6 токенов, второй из 30 токенов. Модель одинаково уверена на каждой позиции — вероятность каждого токена ровно 0,7. Что верно про их суммарные log-probability?'
  explanation: 'Каждое слагаемое равно ln0,7 ≈ −0,357 и отрицательно, поэтому каждый лишний токен тянет сумму вниз: 6·(−0,357) ≈ −2,14 против 30·(−0,357) ≈ −10,7. Это не ошибка вычисления, а прямое следствие перемножения вероятностей; отсюда и берётся смещение в сторону коротких ответов, которое лечат нормировкой на длину.'
  kind: choice
  options:
    - У обоих сумма одинакова, потому что уверенность на токен одна и та же
    - У ответа из 30 токенов сумма заметно более отрицательная, примерно в пять раз
    - У ответа из 30 токенов сумма ближе к нулю, потому что слагаемых больше
    - Сумма положительна у обоих, так как 0,7 больше 0,5
  correct: 1
  id: 019-sequence-prob-2
  fingerprint: 8df4716f
- concept: каждый множитель в вероятности последовательности условен на промпте и уже сгенерированных токенах ответа
  question: 'Дополни разложение лог-вероятности ответа по токенам: что стоит под логарифмом на позиции t?'
  explanation: 'Ответ генерируется авторегрессивно: токен на позиции t выбирается при известном промпте x и всех уже выданных токенах ответа y_{<t}. Безусловная P(y_t) была бы неверна — модель никогда не оценивает токен в отрыве от контекста. Именно поэтому достаточно одного прямого прохода по всей последовательности: каждая позиция выхода уже видит свой префикс.'
  kind: cloze
  template: log P(y | x) = sum_{t=1..T} log P( ___ )
  answer: y_t | x, y_{<t}
  accept:
    - y_t | x, y_<t
    - y_t|x,y_{<t}
    - y_t | x, y_1..y_{t-1}
    - y_t | x, предыдущие токены ответа
  id: 019-sequence-prob-3
  fingerprint: 269d1627
