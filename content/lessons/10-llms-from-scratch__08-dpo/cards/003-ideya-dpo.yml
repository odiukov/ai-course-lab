- concept: величина обновления в DPO зависит от текущего перевеса между принятым и отвергнутым ответом
  question: Модель обучается на парах предпочтений методом DPO. Для запроса A политика уже приписывает предпочтённому ответу заметно большую вероятность, чем отвергнутому. Для запроса B политика по-прежнему считает отвергнутый ответ более вероятным. Какая пара даст больший вклад в градиент?
  explanation: 'Потери DPO зависят от разности логарифмов вероятностей предпочтённого и отвергнутого ответов. Когда разность уже большая и положительная, сигмоида насыщается и градиент почти нулевой. Когда порядок нарушен, разность отрицательная, потери велики и обновление сильное. Это самокорректирующийся сигнал: обучение концентрируется на парах, где модель ошибается.'
  kind: choice
  options:
    - 'Пара A: чем увереннее модель в правильном ответе, тем сильнее сигнал закрепления'
    - 'Пара B: перевес идёт в неверную сторону, ошибка велика, параметры меняются сильнее'
    - 'Вклад одинаков: DPO использует фиксированный шаг для каждой пары независимо от вероятностей'
    - 'Ни одна: пары с уже правильным порядком и пары с неправильным взаимно компенсируются'
  correct: 1
  id: 003-ideya-dpo-1
  fingerprint: 98017a46
- concept: DPO требует только порядкового сравнения внутри пары, а не абсолютной оценки качества
  question: 'Разметчику предлагают два варианта разметки: поставить каждому ответу абсолютный балл по шкале либо просто указать, какой из двух ответов лучше. Почему для DPO достаточно второго и что это меняет в требованиях к данным?'
  explanation: Классический RLHF превращал предпочтения в скалярную награду через отдельную модель. DPO работает с сырым отношением порядка напрямую, поэтому и данные нужны только в виде пар «лучше — хуже» для общего запроса.
  kind: open
  reference: 'Функция потерь DPO смотрит только на разность логарифмов вероятностей двух ответов на один и тот же запрос: цель — сделать предпочтённый ответ вероятнее отвергнутого. Абсолютное значение «награды» в неё не входит, поэтому балл по шкале не даёт дополнительной информации сверх порядка. Практические следствия: разметка дешевле и согласованнее между людьми (сравнить два ответа проще, чем откалибровать шкалу), не нужен единый масштаб оценок между разметчиками, а данные обязаны быть парными — на один запрос нужны оба ответа, отдельный ответ с оценкой использовать нельзя.'
  id: 003-ideya-dpo-2
  fingerprint: 779a8ed0
- concept: DPO обновляет саму генеративную политику, а не обучает отдельный классификатор качества
  question: После обучения методом DPO инженер хочет получать ответы на пользовательские запросы. Что именно он запускает и почему?
  explanation: DPO не учит модель предсказывать ярлык «хорошо/плохо» как отдельную задачу классификации. Градиенты идут в параметры языковой модели и перераспределяют вероятность токенов. На инференсе это обычная генерация — никакой дополнительной модели рядом не требуется.
  kind: choice
  options:
    - 'Обученную модель как обычную языковую модель: DPO изменил параметры самой политики, генерирующей текст'
    - Классификатор качества, который отбирает лучший ответ из нескольких кандидатов базовой модели
    - 'Связку «политика + обученная голова награды»: голова нужна для ранжирования выходов на инференсе'
    - Базовую SFT-модель, а результат DPO используется только для фильтрации обучающих данных
  correct: 0
  id: 003-ideya-dpo-3
