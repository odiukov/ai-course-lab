- concept: seed переустанавливается перед каждым запуском, иначе последующие запуски получают другой отрезок последовательности случайных чисел
  question: Инженер сравнивает три значения beta. Он вызывает установку random seed один раз в начале скрипта, а затем в цикле подряд запускает три обучения. Что не так с таким сравнением?
  explanation: 'Генератор случайных чисел — поток: seed задаёт его начало, а каждый забор значений двигает позицию. Один вызов перед циклом даёт одинаковый старт только первому запуску; порядок пар и случайные отключения частей модели у остальных будут другими. Seed надо ставить заново перед каждым запуском — тогда все beta получают одинаковый поток случайностей.'
  kind: choice
  options:
    - 'Ничего: один вызов на скрипт делает все три запуска идентичными по случайности'
    - Первый запуск израсходует часть последовательности случайных чисел, и второй с третьим начнут с другого её места
    - Seed вообще не влияет на обучение, если данные уже перемешаны заранее
    - Seed надо устанавливать после обучения, чтобы зафиксировать итоговые веса
  correct: 1
  id: 044-beta-experiment-1
  fingerprint: 0709d2d5
- concept: каждый запуск сравнения начинается со свежей копии одних и тех же исходных весов, иначе продолженное обучение смешивает эффект beta с накопленным ранее прогрессом
  question: 'Скрипт сравнивает beta = 0.25 и beta = 0.6, но по ошибке переиспользует один и тот же объект policy: второй запуск продолжает обучать модель, оставшуюся после первого. Почему итоговые метрики нельзя приписывать разнице beta?'
  explanation: 'Честное сравнение требует одной стартовой точки: перед каждым значением beta policy заново копируется из исходных весов, а reference остаётся той же замороженной копией. Иначе beta = 0.6 стартует с модели, уже обученной под beta = 0.25, и различие метрик смешивает два фактора — сам параметр и накопленный прогресс.'
  kind: choice
  options:
    - Потому что вторая beta по построению всегда больше первой
    - Потому что второй запуск начинается с уже сдвинутых весов и его результат включает эффект первого обучения
    - Потому что reference-модель при повторном запуске тоже обучается
    - Потому что порядковый номер запуска входит в функцию потерь
  correct: 1
