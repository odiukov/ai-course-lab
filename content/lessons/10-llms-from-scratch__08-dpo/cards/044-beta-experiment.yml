- concept: фиксированный общий seed делает сравнение корректным, но не даёт вывода об устойчивости результата — для него нужны повторы на нескольких seed
  question: Сравнение нескольких значений beta проведено при одинаковых весах, данных, learning rate и одном общем random seed. Объясни своими словами, какой вывод такое сравнение поддерживает, а какой — нет, и что нужно сделать для более надёжного заключения.
  explanation: Фиксация seed отвечает за внутреннюю корректность сравнения (сравниваем только beta), а повторы на разных seed — за обобщаемость (результат не артефакт одного жребия). Это два разных требования, и первое не заменяет второе.
  kind: open
  reference: 'Общий seed убирает посторонние факторы: между запусками меняется только beta, поэтому разницу метрик законно связывать именно с ней. Но это один конкретный жребий — порядок пар, случайные отключения частей модели. Вывод «эта beta лучше в принципе» он не поддерживает: победитель может смениться при другом seed, а наблюдаемый разрыв может оказаться меньше случайного разброса. Для надёжного заключения эксперимент повторяют на нескольких seed (например, 7) и внутри каждого дают всем значениям beta равные условия, затем смотрят, устойчив ли порядок победителей и превышает ли разрыв разброс между seed.'
  id: 044-beta-experiment-3
  fingerprint: b943138e
