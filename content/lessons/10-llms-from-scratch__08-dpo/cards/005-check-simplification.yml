- concept: референс сдерживает политику изнутри функции потерь DPO — без него рост вероятности принятого ответа ничем не ограничен
  question: В DPO нет отдельного KL-штрафа как внешнего слагаемого, как в PPO. Объясни своими словами, что удерживает политику рядом с исходной моделью и что сломается, если референс убрать и считать потерю по чистым логарифмам вероятностей политики.
  explanation: KL-ограничение в DPO не исчезло, оно вшито в саму формулу потерь через отношение вероятностей к референсу. Отсюда и две модели в памяти вместо одной.
  kind: open
  reference: 'Потеря DPO смотрит не на абсолютные вероятности, а на разность логарифмических отношений политики к референсу для принятого и отвергнутого ответа. Отношение к замороженному референсу и есть сдерживание: как только политика уходит от исходного распределения, отношение растёт и вклад пары в градиент падает — роль коэффициента жёсткости играет beta. Уберём референс — останется просто «повышай вероятность принятого, понижай вероятность отвергнутого» без потолка: модель начнёт раздувать вероятности выбранных продолжений, схлопывать разнообразие и терять беглость, приобретённую на SFT. Поэтому «прямая» оптимизация не означает обучение без опоры: вторая копия модели в памяти обязательна.'
  id: 005-check-simplification-2
  fingerprint: a7b970b1
- concept: 'переход на DPO не снижает требований к данным: те же пары предпочтений, экономия только в моделях и обучающих прогонах'
  question: Команда переходит с PPO на DPO и рассчитывает сэкономить на разметке. Что на самом деле изменится в требованиях к данным?
  explanation: DPO ест ровно тот же датасет предпочтений, что и обучение модели награды в RLHF. Выбрасывается промежуточное звено — обученная модель награды и цикл PPO, — а сбор человеческих сравнений остаётся неизбежной частью выравнивания.
  kind: choice
  options:
    - 'Разметка больше не нужна: DPO обучается на обычном текстовом корпусе'
    - Вместо сравнений понадобятся абсолютные оценки качества по числовой шкале
    - 'Требования к данным те же: на запрос нужна пара «принятый — отвергнутый», а экономия идёт на моделях в памяти и числе обучающих прогонов'
    - Пар понадобится заметно больше, потому что нет модели награды, которая обобщала бы разметку на новые ответы
