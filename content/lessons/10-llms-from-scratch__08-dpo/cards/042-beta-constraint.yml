- concept: beta задаёт цену отклонения от reference, а не гарантированную границу расстояния до него
  question: 'Инженер запускает DPO с beta = 0.4 и пишет в отчёте: «этот выбор гарантирует, что политика уйдёт от reference не более чем на 5% по вероятностям ответов». Что здесь неверно?'
  explanation: Beta — коэффициент обмена «выигрыш против отклонения», а не бюджет отклонения. Она говорит, насколько веским должен быть выигрыш, чтобы оправдать уход от reference, но итоговое расстояние определяется совместно с данными предпочтений и распределением reference. Никакой предвычисляемой границы вида «не дальше 5%» beta не даёт.
  kind: choice
  options:
    - 'Ничего: beta прямо задаёт максимально допустимое расстояние до reference, надо лишь пересчитать проценты'
    - Beta задаёт лишь цену отклонения; фактическое расстояние — результат обучения и зависит от данных, силы предпочтений и самой reference-модели
    - Beta вообще не связана с reference-моделью, она масштабирует только скорость обучения
    - Гарантия верна, но только если reference совпадает с SFT-моделью
  correct: 1
  id: 042-beta-constraint-1
  fingerprint: 1eb0f211
- concept: значение beta осмысленно только в масштабе конкретного обучения и не переносится как универсальная константа
  question: Команда взяла beta = 0.35 из чужого проекта, где она хорошо работала, и получила на своих данных почти неизменную по поведению модель. Объясни своими словами, почему число beta нельзя переносить между обучениями как готовую константу.
  explanation: 'Beta — ручка цены, а не абсолютная величина. Диапазон вроде 0.1–0.3 в материале — эмпирическая стартовая точка, а не универсальное правило: тот же множитель при другой reference-модели и других парах даёт другое фактическое отклонение.'
  kind: open
  reference: 'Beta сопоставляет цену отклонения от reference с масштабом выигрыша в конкретной задаче. Этот масштаб задают данные: насколько разделимы пары предпочтений, насколько велики достижимые разности лог-отношений, насколько reference-модель уже близка к желаемому поведению. При другом reference и других парах то же самое число beta соответствует другому балансу: где-то оно оставляет достаточную свободу, где-то делает отклонение слишком дорогим и обучение почти не сдвигает политику. Поэтому beta подбирают заново под конкретную связку данных и reference, а типичные диапазоны — только стартовая точка.'
  id: 042-beta-constraint-2
  fingerprint: 1183a3c6
- concept: слишком малая beta почти отключает привязку к reference и допускает вырожденную политику
  question: После DPO с beta = 0.005 модель начинает уверенно выдавать однообразный повторяющийся текст, хотя SFT-модель до этого генерировала нормально. Наиболее вероятная причина?
  explanation: 'Beta стоит множителем перед разностью лог-отношений: при крошечном значении сигмоида почти не насыщается, модель продолжает толкать вероятности даже когда уже права, и цена ухода от reference ничтожна. Итог — быстрое обучение с риском вырожденных решений. Reference из формулы никуда не девается, и знак логита beta не меняет: положительный множитель только масштабирует.'
  kind: choice
  options:
    - Отклонение от reference стало почти бесплатным, и предпочтения переопределили распределение практически без сдерживания
    - При такой beta reference-модель перестаёт участвовать в вычислении логита, остаётся только лог-вероятность политики
    - Слишком малая beta переворачивает знак предпочтения, и модель училась поднимать отвергнутые ответы
    - Малая beta делает сигнал обучения нулевым, поэтому веса остались случайными
  correct: 0
  id: 042-beta-constraint-3
  fingerprint: ac1c667e
