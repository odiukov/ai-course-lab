- concept: проверка попадания через строгое неравенство не засчитывает ничьи, поэтому нулевые margins дают 0%, а не 50%
  question: Метрика preference accuracy считает пару угаданной, если неявная награда предпочитаемого ответа строго больше награды отвергнутого. Модель выдаёт на всех 24 парах ровно нулевой margin. Какое значение метрики получится и почему?
  explanation: 'Условие `preferred_reward > rejected_reward` при равных наградах ложно, счётчик correct не растёт: 0/24 = 0.0. Половину дал бы только случайный выбор или замена сравнения на нестрогое; при `>=` та же модель показала бы 100%. Ноль здесь — артефакт границы, а не признак того, что модель систематически ставит отвергнутый ответ выше.'
  kind: choice
  options:
    - 0.0 — строгое «больше» не выполняется ни разу, ничья попаданием не считается
    - 0.5 — ничья трактуется как половина попадания
    - 1.0 — при равенстве наград условие проверки выполняется автоматически
    - Метрика не определена, деление на ноль
  correct: 0
  id: 037-check-initial-accuracy-1
  fingerprint: ccf7f636
- concept: 'вклад ничьих в метрику точности: пары с нулевым margin уходят в знаменатель, но не в числитель'
  question: Датасет из 20 пар предпочтений. У 13 пар margin положительный, у 4 пар margin равен нулю, у 3 пар отрицательный. Чему равна preference accuracy при строгом сравнении наград?
  explanation: 'Числитель — только строго положительные margins: 13. Знаменатель — все пары, включая ничьи: 20. 13/20 = 0.65. Четыре ничьи ухудшают метрику ровно так же, как ошибки, хотя моделью ни одна из них не перевёрнута.'
  kind: numeric
  answer: 0.65
  tolerance: 0.01
  id: 037-check-initial-accuracy-2
  fingerprint: bbc5e5eb
- concept: нулевая preference accuracy у необученной политики измеряет отсутствие сдвига относительно reference, а не качество генераций
  question: 'Инженер запускает оценку до старта DPO, получает preference accuracy 0.0 и делает вывод: «базовая модель генерирует плохо, она выбирает худший ответ в каждой паре». В чём ошибка вывода?'
  explanation: Неявная награда определена только относительно reference. При совпадении моделей она тождественно нулевая для любого ответа, поэтому метрика вырождается и её значение не говорит ничего о качестве текста. Смысл у неё появляется после первых шагов обучения, когда margins расходятся.
  kind: open
  reference: До обучения policy побайтово совпадает с reference, поэтому оба log-ratio равны нулю, обе неявные награды равны нулю и margin нулевой в каждой паре. Строгое сравнение не засчитывает ничьи, отсюда 0.0. Метрика построена на разности log π/π_ref, то есть измеряет сдвиг политики относительно reference, а не абсолютное качество генераций. Нулевая точность здесь означает «политика ещё никуда не сместилась», а не «политика ставит отвергнутый ответ выше»; худший выбор дал бы отрицательные margins, а не нулевые.
  id: 037-check-initial-accuracy-3
  fingerprint: eec5b2e7
