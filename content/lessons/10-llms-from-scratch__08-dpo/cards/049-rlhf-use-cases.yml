- concept: 'цикл итеративного выравнивания в RLHF: генерация текущей политикой, разметка предпочтений, переобучение модели награды, обновление политики'
  question: Расставь шаги одной итерации онлайн-цикла RLHF в правильном порядке.
  explanation: Ключ цикла — источник данных. Ответы берутся не из статичного набора, а от текущей политики, поэтому разметка попадает ровно в те ошибки, которые модель делает сейчас. Модель награды переобучается на пополненных предпочтениях и только потом даёт сигнал политике; новая политика замыкает цикл. Именно эта петля недоступна DPO, работающему на фиксированном датасете пар.
  kind: order
  items:
    - текущая политика генерирует новые ответы на промпты
    - разметчики сравнивают эти ответы и отмечают предпочтения
    - модель награды переобучается на пополненных данных предпочтений
    - политика обучается под обновлённый сигнал награды
    - обновлённая политика становится источником генераций для следующей итерации
  id: 049-rlhf-use-cases-2
