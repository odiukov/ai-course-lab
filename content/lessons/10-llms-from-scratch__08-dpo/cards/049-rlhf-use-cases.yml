- concept: модель награды выучивает многокритериальный компромисс и оценивает произвольный новый ответ, тогда как DPO получает из пары только бинарный порядок без причины выбора
  question: 'Предпочтения разметчиков складываются из нескольких конфликтующих измерений: подробный ответ полезнее, но краткий отказ безопаснее. Объясни своими словами, что отдельная модель награды может извлечь из таких данных, чего не извлекает DPO, и при каком объёме данных это преимущество реально проявляется.'
  explanation: 'Два разных утверждения: (1) модель награды моделирует, насколько ответ хорош, а не только кто кого победил, поэтому способна выразить многокритериальный компромисс и оценивать невиданные ответы; (2) это работает только при больших данных и вычислениях — на малых выборках она переобучается на шум, и DPO выигрывает как более короткий и устойчивый путь.'
  kind: open
  reference: 'Из пары DPO получает один бит: этот ответ лучше того. Причина, по которой он лучше — перевесила полезность или перевесила безопасность, — в функции потерь не фигурирует. Модель награды обучается предсказывать скалярную оценку и на большом разнообразии сравнений вынуждена выучить повторяющийся компромисс между измерениями; она становится переиспользуемым оценщиком, который приписывает оценку произвольному новому ответу, а не только различает победителя внутри уже размеченной пары. Отсюда и её роль в онлайн-цикле. Преимущество проявляется на масштабе: на небольшом наборе (порядка десятков тысяч пар) модель награды видит каждый промпт считаные разы и запоминает шум разметки, а лишнее звено этот шум ещё и усиливает — там дешевле и надёжнее DPO. На миллионах разнообразных сравнений модель награды начинает обобщать лучше бинарного сигнала, и стоимость дополнительного звена окупается.'
  id: 049-rlhf-use-cases-3
