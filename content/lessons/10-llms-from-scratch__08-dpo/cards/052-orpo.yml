- concept: шанс события равен отношению его вероятности к вероятности противоположного, а отношение шансов сравнивает два ответа
  question: Модель приписывает предпочитаемому ответу вероятность 0.8, отвергнутому — 0.2. Чему равно отношение шансов предпочитаемого ответа к отвергнутому?
  explanation: 'Шанс = p/(1-p). Для предпочитаемого: 0.8/0.2 = 4. Для отвергнутого: 0.2/0.8 = 0.25. Отношение шансов = 4/0.25 = 16. Разрыв в шансах растёт куда резче, чем разрыв самих вероятностей (0.8 против 0.2 — всего вчетверо), поэтому ORPO штрафует по шансам: когда отвергнутый почти не уступает, отношение близко к 1 и давление максимально.'
  kind: numeric
  answer: 16
  tolerance: 0.1
