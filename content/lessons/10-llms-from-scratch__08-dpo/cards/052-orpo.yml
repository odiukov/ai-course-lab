- concept: в ORPO якорем против ухода политики служит SFT-слагаемое на предпочитаемом ответе, поэтому отдельная замороженная reference-модель не нужна и в памяти живёт одна копия весов
  question: Почему ORPO обходится без замороженной reference-модели, и как это сказывается на числе копий модели в памяти?
  explanation: Ключ в том, что ориентир задаётся изнутри самой потери, а не внешней замороженной копией. Убрав reference, ORPO сводит требования к железу до одной резидентной модели (у DPO — две, у RLHF — три-четыре) и до одного обучающего прогона вместо двух.
  kind: open
  reference: 'В DPO reference-модель служит неподвижной точкой отсчёта: неявная награда считается как логарифм отношения вероятности политики к вероятности референса, и без него ничто не сдерживает рост вероятности принятого ответа. В ORPO эту роль берёт на себя первое слагаемое потерь — обычное обучение на предпочитаемом ответе. Оно постоянно тянет модель к воспроизведению реального текста и не даёт preference-члену увести распределение куда угодно, поэтому внешний замороженный ориентир не нужен. Следствие: в памяти держится одна копия весов вместо двух, и не нужен отдельный прогон SFT перед выравниванием — обучение идёт одним циклом.'
  id: 052-orpo-3
  fingerprint: 512ab7c7
