- concept: 'рост неявной награды предпочитаемого ответа сам по себе не означает прогресс: значение имеет её рост относительно награды отвергнутого'
  question: 'Между двумя сохранениями DPO-модели на одной и той же паре неявные награды изменились так: preferred 0.42 → 0.61, rejected 0.30 → 0.56. Что можно сказать о предпочтении модели на этой паре?'
  explanation: 'Reward margin = R_w − R_l. Было 0.42 − 0.30 = 0.12, стало 0.61 − 0.56 = 0.05. Обе награды поднялись, но rejected поднялся сильнее, поэтому преимущество предпочитаемого ответа сократилось. Следить за одной наградой бесполезно: сигнал несёт разность.'
  kind: choice
  options:
    - 'Предпочтение усилилось: награда предпочитаемого ответа выросла'
    - 'Предпочтение ослабло: разрыв сократился с 0.12 до 0.05'
    - 'Предпочтение не изменилось: обе награды выросли, значит сдвиг общий и взаимно компенсируется'
    - 'Сказать нельзя: без значения loss разрыв не определён'
  correct: 1
  id: 034-reward-margin-1
  fingerprint: 9f723446
- concept: изменение reward margin между чекпойнтами равно разности приращений двух неявных наград
  question: На одной паре неявная награда предпочитаемого ответа изменилась с 0.14 до 0.50, а отвергнутого — с -0.06 до 0.17. На сколько вырос reward margin?
  explanation: 'Margin до: 0.14 − (−0.06) = 0.20. После: 0.50 − 0.17 = 0.33. Прирост 0.13. То же число даёт разность приращений: (+0.36) − (+0.23) = 0.13, потому что margin линеен по обеим наградам.'
  kind: numeric
  answer: 0.13
  tolerance: 0.005
  id: 034-reward-margin-2
  fingerprint: 8294c626
- concept: траектория reward margin сопоставима между сохранениями модели только при неизменных beta, reference-модели и наборе пар
  question: Инженер хочет по росту reward margin судить о ходе DPO-обучения, сравнивая несколько сохранений модели. Что обязательно должно совпадать при замерах, чтобы сравнение было корректным?
  explanation: Неявная награда — beta, умноженная на логарифм отношения вероятностей policy и reference. Смена reference меняет точку отсчёта, смена beta масштабирует все награды и margin, а другие пары дают другие числа. При тех же парах, том же reference и той же beta рост margin действительно означает усиление предпочтения.
  kind: choice
  options:
    - Только размер батча и learning rate при обучении
    - Набор пар, reference-модель и значение beta
    - Только количество шагов оптимизатора между сохранениями
    - Только seed генерации ответов policy-моделью
  correct: 1
  id: 034-reward-margin-3
  fingerprint: 7e322685
