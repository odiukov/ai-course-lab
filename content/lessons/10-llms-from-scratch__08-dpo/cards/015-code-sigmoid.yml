- concept: np.where выбирает ветвь поэлементно, а обычный if/else требует одного булева значения и падает на массиве
  question: 'Реализацию с np.where(x >= 0, A, B) переписали как обычный if x >= 0: ... else: ... и передали массив из 5 чисел. Что случится?'
  explanation: 'if требует одно булево значение, а x >= 0 для массива даёт массив булевых значений, поэтому NumPy отказывается его сворачивать: ''The truth value of an array with more than one element is ambiguous''. np.where решает задачу поэлементно — для каждого элемента берётся своя ветвь, и форма результата совпадает с формой входа. Именно поэтому одна и та же функция работает и на скаляре, и на батче.'
  kind: choice
  options:
    - 'Python бросит ошибку: истинность массива из нескольких элементов неоднозначна'
    - Ветвь выберется по первому элементу массива, остальные посчитаются той же формулой без ошибки
    - Обе ветви посчитаются и результаты сложатся поэлементно
    - Массив автоматически приведётся к скаляру-среднему, и ветвь выберется по знаку среднего
