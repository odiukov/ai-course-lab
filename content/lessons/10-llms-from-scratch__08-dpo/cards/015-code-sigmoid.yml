- concept: 'сигмоида симметрична: σ(-x) = 1 - σ(x)'
  question: Известно, что σ(6) ≈ 0.9975. Чему равно σ(-6)?
  explanation: 'σ(x) + σ(-x) = 1 для любого x, потому что 1/(1+e^{-x}) и e^{-x}/(1+e^{-x}) в сумме дают единицу. Значит σ(-6) = 1 - 0.9975 = 0.0025. Это свойство удобно как тест реализации: сумма значений на противоположных аргументах обязана равняться 1 независимо от того, какая ветвь формулы сработала.'
  kind: numeric
  answer: 0.0025
  tolerance: 0.0005
  id: 015-code-sigmoid-1
  fingerprint: 1e24bd7d
- concept: малая добавка под логарифмом защищает потерю от нулевого выхода сигмоиды при сильно отрицательном аргументе
  question: В функции потерь используется выражение -log(sigmoid(z) + 1e-8). Что произойдёт, если добавку убрать и подать z = -800?
  explanation: 'Математически σ(z) > 0 всегда, но в float64 значение около e^{-800} меньше минимального представимого числа и округляется до 0.0. log(0.0) даёт -inf, потеря становится inf и разрушает градиенты. Добавка 1e-8 ставит нижнюю границу: потеря упирается примерно в 18.4 вместо бесконечности. Стабильные ветви сигмоиды спасают от переполнения вверх, а эпсилон под логарифмом — от обнуления вниз.'
  kind: choice
  options:
    - sigmoid в float64 обратится в ровно 0.0, логарифм даст -inf, и потеря станет inf
    - sigmoid вернёт отрицательное число, и логарифм даст nan из-за отрицательного аргумента
    - 'ничего не изменится: sigmoid при любом конечном аргументе строго больше нуля в арифметике float64'
    - потеря станет ровно нулём, потому что логарифм нуля в NumPy определён как 0
