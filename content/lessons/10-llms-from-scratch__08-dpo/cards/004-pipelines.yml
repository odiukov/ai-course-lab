- concept: устойчивость DPO к гиперпараметрам следует из того, что это обучение с учителем по фиксированному офлайн-датасету, без онлайн-роллаутов и без обучаемого источника награды
  question: Почему обучение DPO по стабильности ближе к SFT, чем к PPO? Объясни своими словами, что именно в постановке задачи убирает нестабильность.
  explanation: 'Нестабильность PPO родом из двух мест: онлайн-роллауты (данные меняются вместе с политикой) и обучаемый носитель сигнала. DPO снимает оба — остаётся градиент по фиксированной выборке, как в обычном SFT, поэтому и требования к подбору гиперпараметров примерно те же.'
  kind: open
  reference: 'DPO — обучение с учителем: датасет пар предпочтений фиксирован заранее, цель считается в замкнутой форме по логарифмам вероятностей текущей и замороженной референсной модели. Нет генерации сэмплов текущей политикой во время обучения, значит распределение данных не смещается вслед за моделью и нет обратной связи «политика испортилась — данные испортились». Нет обучаемого источника сигнала: оценка не выдаётся отдельной сетью, которую можно переоптимизировать. Отсюда и отсутствие тонких RL-настроек вроде clipping и коэффициента KL, за которыми в PPO приходится следить, чтобы обучение не разошлось.'
