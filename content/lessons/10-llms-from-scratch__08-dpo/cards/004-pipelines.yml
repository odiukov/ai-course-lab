- concept: 'переход с PPO на DPO сокращает пространство гиперпараметров: исчезают настройки RL-цикла и обучения модели награды, остаётся lr, beta и число эпох'
  question: Команда переводит этап выравнивания с PPO на DPO. Какой набор гиперпараметров перестаёт существовать в новом конвейере?
  explanation: KL-коэффициент и clipping — параметры PPO как RL-алгоритма, learning rate модели награды — параметр отдельного цикла обучения награды. Ни того, ни другого цикла в DPO нет. Остаются обычные параметры обучения с учителем (lr, эпохи) плюс beta. Размер батча и длина контекста есть в любом обучении, они никуда не деваются.
  kind: choice
  options:
    - learning rate и число эпох
    - коэффициент KL-штрафа, clip-отношение и learning rate модели награды
    - beta и learning rate политики
    - размер батча и длина контекста
