- concept: значение log-ratio переводится в кратность вероятностей через экспоненту
  question: Для одного ответа обученная политика даёт log p = -3,1, а замороженная reference-модель log p = -4,7 (натуральные логарифмы). Во сколько раз политика повысила вероятность этого ответа относительно reference?
  explanation: Log-ratio = -3,1 - (-4,7) = 1,6. Кратность вероятностей = exp(1,6) ≈ 4,95. Положительный log-ratio означает рост вероятности относительно reference, а его величина — во сколько раз.
  kind: numeric
  answer: 4.95
  tolerance: 0.2
  id: 060-final-quiz-1
  fingerprint: c4593ffa
- concept: ORPO объединяет SFT и выравнивание в один обучающий прогон, поэтому отдельный предварительный этап SFT не нужен
  question: Команда хочет из базовой модели и набора пар предпочтений получить выровненную модель за один обучающий прогон, без отдельного предварительного этапа SFT. Какой метод соответствует этому требованию?
  explanation: ORPO добавляет член с отношением шансов прямо в потери SFT, поэтому дообучение и выравнивание идут одним циклом. DPO, KTO и SimPO стартуют с уже дообученной SFT-модели и требуют предварительного этапа.
  kind: choice
  options:
    - ORPO
    - Классический DPO
    - KTO
    - SimPO
  correct: 0
  id: 060-final-quiz-2
  fingerprint: 6f456c4a
