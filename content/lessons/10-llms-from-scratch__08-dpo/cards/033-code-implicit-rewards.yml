  question: В цикле DPO-обучения на каждом шаге логируют неявную награду принятого ответа, неявную награду отвергнутого и их зазор. Как это логирование влияет на обновление весов политики?
  explanation: 'Награды — это beta, умноженная на лог-отношения, то есть перепакованные промежуточные величины той же потери. Никакого нового слагаемого и никакого второго шага оптимизации они не создают. Смысл у них диагностический: если зазор наград по ходу обучения растёт, политика действительно разводит принятые и отвергнутые ответы; если стоит на месте — сигнал не проходит.'
