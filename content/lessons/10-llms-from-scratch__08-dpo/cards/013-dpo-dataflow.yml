- concept: 'порядок вычислений внутри одной пары: сначала лог-отношения по каждому ответу, потом их разность, потом масштабирование beta, потом сигмоида и минус логарифм'
  question: Расставь шаги расчёта потери DPO для одной пары (промпт, принятый ответ, отвергнутый ответ) в порядке выполнения.
  explanation: 'Вычитание reference-модели идёт поточечно по каждому ответу, и только потом сравниваются два сдвига. Порядок нельзя менять: разность сырых логарифмов вероятностей принятого и отвергнутого ответов без вычитания reference-модели дала бы другую величину, не учитывающую стартовую точку.'
  kind: order
  items:
    - Оценить логарифмические вероятности принятого и отвергнутого ответов текущей моделью и reference-моделью
    - Для каждого ответа вычесть логарифм вероятности reference-модели из логарифма вероятности текущей модели
    - Взять разность лог-отношения принятого и лог-отношения отвергнутого ответа
    - Умножить эту разность на beta
    - Подать результат в sigmoid и взять минус логарифм полученной вероятности
  id: 013-dpo-dataflow-2
  fingerprint: 7a70c376
- concept: расчёт одной пары требует оценить оба ответа и текущей моделью, и замороженной reference-моделью
  question: Сколько логарифмов вероятности последовательностей нужно получить, чтобы посчитать потерю DPO на одной паре предпочтений?
  explanation: Лог-отношение считается для каждого ответа отдельно, а значит нужны обе оценки принятого и обе оценки отвергнутого. Reference-модель заморожена и градиентов не требует, но её прогоны выполняются на каждом шаге, потому что зазор измеряется именно относительно неё.
  kind: choice
  options:
    - По одному на каждый ответ текущей моделью — оценки reference-модели нужны только в начале обучения
    - Каждый ответ оценивается и текущей моделью, и reference-моделью — четыре величины на пару
    - Только логарифм вероятности принятого ответа под текущей моделью; отвергнутый нужен лишь для отбора данных
    - По одной оценке на промпт от каждой модели, ответы отдельно не оцениваются
