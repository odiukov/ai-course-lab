- concept: 'аргумент сигмоиды в DPO антисимметричен относительно перестановки ответов в паре: только смена ролей preferred/rejected переворачивает его знак'
  question: Для пары ответов вычислен DPO-logit beta*((log pi(y_w) - log pi_ref(y_w)) - (log pi(y_l) - log pi_ref(y_l))), он равен +0.8. Какое изменение гарантированно даст ровно противоположный знак при том же наборе лог-вероятностей?
  explanation: 'Перестановка ролей меняет знак каждой скобки местами, то есть даёт -(logit): было +0.8, станет -0.8. beta > 0 — общий положительный множитель, знак не трогает. Общий сдвиг обеих reference-лог-вероятностей на одну константу добавляет её к обоим сдвигам policy-reference и в разности сокращается. Отсюда типичная ошибка реализации: перепутанные аргументы дают правдоподобное по модулю, но перевёрнутое по знаку число.'
  kind: choice
  options:
    - Поменять beta с 0.4 на 2.0
    - 'Поменять местами роли: считать бывший отвергнутый ответ предпочитаемым и наоборот'
    - Вычесть 5 из обеих reference-лог-вероятностей
    - Умножить все четыре лог-вероятности на 2
  correct: 1
  id: 025-code-dpo-logit-1
  fingerprint: 6a53c7ae
- concept: аргумент сигмоиды DPO численно равен зазору неявных наград пары
  question: Неявная награда DPO для предпочитаемого ответа равна 0.45, для отвергнутого -0.15 (обе при одном и том же beta и одном промпте). Чему равен аргумент сигмоиды в функции потерь DPO для этой пары?
  explanation: 'Неявная награда — beta*(log pi - log pi_ref) по каждому ответу. Аргумент сигмоиды beta*((сдвиг предпочитаемого) - (сдвиг отвергнутого)) после раскрытия beta и есть разность этих наград: 0.45 - (-0.15) = 0.6. Поэтому reward margin на графике обучения и логит под сигмоидой — одна величина, а не две связанные.'
  kind: numeric
  answer: 0.6
  tolerance: 0.01
  id: 025-code-dpo-logit-2
  fingerprint: 5172e1c4
