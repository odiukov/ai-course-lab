- concept: разрыв в бенчмарке между двумя моделями с разной базой, данными и процедурой обучения не приписывается методу выравнивания
  question: Модель A (база 8B, SFT на своём датасете, выравнивание методом X) набрала 7,12 на MT-Bench, модель B (другая база 65B, другой SFT, выравнивание методом Y) — 7,44. Какой вывод корректен?
  explanation: 'Модели различаются сразу по нескольким осям: база, объём и состав SFT-данных, набор предпочтений, вся процедура обучения. Любую из них можно объявить причиной 0,32 балла. Это пример успешного применения пайплайна, а не измерение вклада метода выравнивания.'
  kind: choice
  options:
    - Метод X эффективнее метода Y, раз меньшая модель почти догнала большую
    - Метод Y эффективнее, раз его модель набрала больше баллов
    - Пайплайн модели A позволил ей приблизиться к более крупной модели; про сравнительную силу X и Y результат ничего не говорит
    - Методы X и Y эквивалентны, так как разрыв меньше половины балла
  correct: 2
  id: 058-deployments-1
  fingerprint: 88a58c24
- concept: чтобы приписать разницу методу выравнивания, нужен контролируемый эксперимент с единственной различающейся деталью
  question: Вы хотите доказать, что DPO даёт лучшее выравнивание, чем RLHF. Какой план эксперимента это позволяет?
  explanation: 'Вывод о превосходстве метода даёт только сравнение при одинаковых исходных условиях: одна база, одна SFT-стадия, одни и те же пары, одна метрика. Вариант с разными данными подменяет проверяемую переменную, а loss двух методов лежат в разных шкалах и не сравнимы.'
  kind: choice
  options:
    - Взять самую сильную открытую DPO-модель и самую сильную открытую RLHF-модель и сравнить их баллы на общем бенчмарке
    - Взять одну базовую модель, одну и ту же SFT-стадию и один и тот же набор предпочтений, развести только алгоритм выравнивания и мерить на общей отложенной выборке
    - Обучить DPO на большем и более чистом наборе предпочтений, чем RLHF, чтобы показать потолок метода
    - 'Сравнить обучающие loss двух методов: у кого падает быстрее, тот и лучше выравнивает'
  correct: 1
  id: 058-deployments-2
  fingerprint: aa77a1c1
- concept: DPO и RLHF применимы последовательно как этапы одного конвейера, а не только как взаимоисключающая альтернатива
  question: Промышленный конвейер применяет DPO уже после этапов RLHF. Объясни своими словами, что это говорит о выборе между DPO и RLHF на практике.
  explanation: 'Meta применяла DPO после начальных этапов RLHF в Llama 3. Это подсказка про композицию этапов: наличие метода в конце конвейера не означает, что он вытеснил предыдущие.'
  kind: open
  reference: 'Постановка «DPO или RLHF» не единственная возможная: методы можно ставить в цепочку. RLHF с обученной моделью награды даёт широкое выравнивание и умеет оценивать произвольные новые ответы, включая свежесобранные онлайн-генерации; DPO дешевле и удобен для точечной доводки на фиксированном наборе пар. Их сочетание означает, что источники сигнала дополняют друг друга, а не конкурируют, и что удобство DPO не отменяет пользы отдельной модели награды. Практический выбор — это порядок и состав этапов, а не голосование за один метод.'
  id: 058-deployments-3
  fingerprint: d43e6bcc
