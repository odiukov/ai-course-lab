- concept: при ответах на разные промпты остаётся неизвестный остаток beta*(log Z(x1) - log Z(x2)), поэтому пара обязана делить промпт
  question: 'Инженер собрал датасет предпочтений так: принятый ответ взят на промпт x1, а отвергнутый — на другой промпт x2. Что сломается в выводе DPO-лосса?'
  explanation: 'Нормировочная константа входит в награду как beta*log Z(x). Сокращается она только при одинаковом x. На разных промптах остаток beta*(log Z(x1) - log Z(x2)) неизвестен, и градиент оптимизирует смесь реального предпочтения с этим мусором. Отсюда требование: оба ответа пары — продолжения одного запроса.'
  kind: choice
  options:
    - 'Ничего: сигмоида всё равно нормирует разность в вероятность от 0 до 1'
    - В разности наград останется член beta*(log Z(x1) - log Z(x2)), который неизвестен и не равен нулю
    - Модель Брэдли-Терри перестанет быть применима, потому что она требует более двух ответов
    - Reference-модель придётся разморозить, чтобы компенсировать разные промпты
