- concept: Z(x) в принципе не вычислима напрямую, поэтому оценка одиночного ответа недоступна, а разность внутри пары — доступна
  question: Почему нельзя просто вычислить Z(x) и получать абсолютную неявную награду для одиночного ответа, без пар?
  explanation: 'Ключ в том, что DPO не вычисляет Z(x), а строит выражение, куда она не входит. Отсюда парная форма лосса: одиночный ответ потребовал бы недоступной константы.'
  kind: open
  reference: 'Z(x) = сумма по y от pi_ref(y|x)*exp(R(x,y)/beta), то есть сумма по всему пространству возможных продолжений промпта. Число последовательностей растёт как |V|^L, перебор невозможен, а оценки методом сэмплирования шумны и смещены под экспонентой. Поэтому абсолютное значение неявной награды недоступно. Доступна только разность двух наград на одном промпте: там beta*log Z(x) входит дважды с противоположными знаками и исчезает точно, независимо от своей величины.'
  id: 009-z-cancel-3
  fingerprint: 1c0108e9
