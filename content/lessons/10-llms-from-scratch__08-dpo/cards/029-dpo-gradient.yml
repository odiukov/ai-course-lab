- concept: производная DPO-loss по логиту всегда строго отрицательна, поэтому направление шага одно и то же, меняется только сила
  question: Как ведёт себя знак производной DPO-loss по DPO-логиту пары при разных значениях логита?
  explanation: σ(s) ∈ (0, 1), поэтому σ(s) - 1 всегда строго меньше нуля. Градиентный спуск двигает логит только вверх, то есть поднимает относительную вероятность предпочитаемого ответа и опускает отвергнутого. Beta масштабирует шаг, но знак не трогает.
  kind: choice
  options:
    - 'Она отрицательна при любом конечном логите: спуск всегда увеличивает логит, меняется лишь модуль'
    - 'Она меняет знак в точке нулевого логита: правильно ранжированные пары толкают логит вниз, перепутанные — вверх'
    - Она положительна для правильно ранжированных пар и обнуляется для перепутанных
    - 'Её знак задаётся beta: при малом beta спуск уменьшает логит'
