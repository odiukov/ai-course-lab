- concept: модуль производной DPO-loss по логиту ограничен единицей, поэтому очень грубо перепутанные пары не дают неограниченно растущего сигнала
  question: 'Две пары ранжированы неверно: у первой DPO-logit равен -6, у второй -8. Насколько сильнее сигнал от второй пары?'
  explanation: 'Производная равна σ(s) - 1, то есть лежит в (-1, 0). σ(-6) ≈ 0.0025 и σ(-8) ≈ 0.00034, значит модули ≈ 0.9975 и 0.99966. Насыщение работает с обеих сторон: уверенно правильная пара получает почти нулевой сигнал, а сколь угодно перепутанная — не больше единицы по модулю.'
  kind: choice
  options:
