- concept: 'EMA-модель, обновляемая по ходу обучения, делает reference подвижной: измеряется отклонение от недавнего состояния политики, а не от фиксированной модели'
  question: В роли reference используют экспоненциальное скользящее среднее весов политики, которое пересчитывается на каждом шаге обучения. Чем такая конструкция отличается от обычного DPO?
  explanation: 'Классический DPO держит reference замороженным, поэтому log-ratio накапливается относительно одного и того же состояния. Движущийся EMA догоняет политику, и долгосрочная привязка превращается в сравнение с недавним прошлым: зазор перестаёт расти безгранично, но и ограничение на суммарный уход от исходной модели ослабевает. Если взять один снимок EMA и заморозить его, это снова обычная фиксированная точка отсчёта.'
  kind: choice
  options:
    - 'Точка отсчёта перестаёт быть неподвижной: log-ratio измеряет расхождение с недавним сглаженным прошлым политики, а не с фиксированной моделью'
    - Reference остаётся фиксированной, потому что усреднение весов не меняет распределение вероятностей
    - Функция потерь перестаёт быть логистической и превращается в обычную кросс-энтропию
    - 'Пары предпочтений становятся не нужны: EMA сама задаёт порядок ответов'
  correct: 0
