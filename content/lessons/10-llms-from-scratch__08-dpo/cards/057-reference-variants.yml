- concept: смена reference-модели между этапами обучения обнуляет шкалу неявных наград, поэтому margins до и после смены не образуют одну непрерывную кривую
  question: После первого прогона DPO инженер берёт полученный чекпоинт как новый reference и запускает второй прогон. Reward margin в начале второго прогона равен 0, хотя в конце первого был 1.7. Как это читать?
  explanation: 'Margin считается как зазор beta * log(pi_policy / pi_ref) между принятым и отвергнутым ответом. В момент, когда reference совпадает с политикой, оба log-ratio нулевые, значит и margin нулевой — при полностью сохранённом качестве политики. Дальнейший рост измеряет только движение относительно уже выровненного состояния. Сравнивать 1.7 и новые значения как точки одной шкалы нельзя: сопоставимость margins требует неизменных beta, reference и набора пар.'
  kind: choice
  options:
    - 'Второй прогон стёр результат первого: политика вернулась к исходному поведению'
    - Шкала обнулилась вместе со сменой точки отсчёта; margins двух прогонов нельзя склеивать в одну кривую
    - 'Значение 0 означает ошибку в коде: margin не может обнулиться при обученной политике'
    - Margin упал из-за смены beta, а не reference
  correct: 1
