- concept: устойчивый log-softmax вычитает максимум логитов и внутри логарифма суммы, и снаружи
  question: Дополни устойчивое вычисление логарифмов вероятностей по строке логитов.
  explanation: 'Максимум вычитается дважды: под экспонентой — чтобы аргумент не превысил границу типа, и отдельным слагаемым снаружи — чтобы компенсировать сдвиг. Экспонента получает степень не больше нуля, самый большой член равен 1, переполнения нет.'
  kind: cloze
  template: log_probs = logits - max_logits - np.log(np.exp(logits - ___).sum(axis=-1, keepdims=True))
  answer: max_logits
  accept:
    - max_logits
    - logits.max(axis=-1, keepdims=True)
    - 'max_logits # тот же максимум'
  id: 018-check-logspace-1
  fingerprint: beac86b1
- concept: log-softmax зависит только от разностей логитов, поэтому значение считается по зазору до максимума
  question: На шаге всего два кандидата с логитами 40 и 37. Чему равен логарифм вероятности кандидата с логитом 40?
  explanation: После вычитания максимума логиты становятся 0 и −3, а значение не меняется, потому что softmax чувствителен только к разности. log P = 0 − ln(1 + e^(−3)) = −ln(1.0498) ≈ −0.0486.
  kind: numeric
  answer: -0.0486
  tolerance: 0.01
  id: 018-check-logspace-2
  fingerprint: 3f8aacc6
- concept: прямой log-softmax даёт конечный логарифм там, где промежуточная вероятность обнулилась бы при округлении
  question: 'Логит токена на 900 единиц ниже максимума в строке. Что вернут два способа: логарифм от готового softmax и прямой log-softmax?'
  explanation: e^(−900) в float64 округляется до нуля, и логарифм нуля даёт −inf, который отравит сумму логарифмов вероятностей всей последовательности. Прямая форма считает logit − max − log(sum) арифметикой над логитами, не создавая промежуточную вероятность, и выдаёт конечное значение около −900.
  kind: choice
  options:
    - Первый вернёт −inf, второй — примерно −900
    - Оба вернут примерно −900, разницы нет
    - Первый вернёт примерно −900, второй — −inf
    - Оба вернут −inf, спасти вычисление нельзя
  correct: 0
  id: 018-check-logspace-3
  fingerprint: 61eca91e
