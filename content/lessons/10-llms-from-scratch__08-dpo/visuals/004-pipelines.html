<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Сопоставляем конвейеры RLHF и DPO</title>
<style>
  :root{
    color-scheme:light dark;
    --page:#f7f8fb;
    --ink:#172033;
    --muted:#59657a;
    --line:#9aa6ba;
    --panel:#ffffff;
    --soft:#edf1f7;
    --rlhf:#805ad5;
    --rlhf-soft:#f1eafd;
    --dpo:#087f5b;
    --dpo-soft:#def7ec;
    --train:#146c43;
    --train-soft:#dff5e8;
    --frozen:#526071;
    --frozen-soft:#e7ebf0;
    --warn:#9a5b00;
    --warn-soft:#fff0d1;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --page:#111722;
      --ink:#eef3fb;
      --muted:#b1bdcf;
      --line:#617087;
      --panel:#192231;
      --soft:#222d3e;
      --rlhf:#c5a7ff;
      --rlhf-soft:#35294e;
      --dpo:#55d6a7;
      --dpo-soft:#173e34;
      --train:#71d99c;
      --train-soft:#193e2b;
      --frozen:#c0cad8;
      --frozen-soft:#293444;
      --warn:#ffc86e;
      --warn-soft:#493719;
    }
  }
  *{box-sizing:border-box}
  html,body{background:var(--page);color:var(--ink)}
  body{margin:unset;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .figure{
    width:100%;
    background:var(--page);
    overflow:hidden;
  }
  h1{
    margin:unset;
    padding:10px 18px 8px;
    font-size:20px;
    line-height:normal;
    font-weight:750;
    color:var(--ink);
  }
  svg{
    display:block;
    width:100%;
    height:auto;
    max-height:438px;
    background:var(--page);
  }
  .panel{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
  .rlhf-panel{fill:var(--rlhf-soft);stroke:var(--rlhf);stroke-width:2}
  .dpo-panel{fill:var(--dpo-soft);stroke:var(--dpo);stroke-width:2}
  .stage{fill:var(--panel);stroke-width:2}
  .stage-rlhf{stroke:var(--rlhf)}
  .stage-dpo{stroke:var(--dpo)}
  .component{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
  .metric{fill:var(--soft);stroke:var(--line);stroke-width:1}
  .memory-note{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.5}
  .flow{stroke:var(--line);stroke-width:2.5;fill:none}
  .connector{stroke:var(--line);stroke-width:1.5;fill:none}
  .arrowhead{fill:var(--line)}
  .heading{font-size:19px;font-weight:800;fill:var(--ink)}
  .stage-title{font-size:17px;font-weight:760;fill:var(--ink)}
  .label{font-size:14px;font-weight:650;fill:var(--ink)}
  .small{font-size:12px;font-weight:600;fill:var(--muted)}
  .tiny{font-size:11px;font-weight:700;fill:var(--muted)}
  .metric-main{font-size:16px;font-weight:800;fill:var(--ink)}
  .rlhf-text{fill:var(--rlhf)}
  .dpo-text{fill:var(--dpo)}
  .train-pill{fill:var(--train-soft);stroke:var(--train);stroke-width:1}
  .frozen-pill{fill:var(--frozen-soft);stroke:var(--frozen);stroke-width:1}
  .train-text{fill:var(--train)}
  .frozen-text{fill:var(--frozen)}
  .fallback{font-size:17px;font-weight:650;fill:var(--ink)}
</style>
</head>
<body>
<main class="figure">
  <h1>Сопоставляем конвейеры RLHF и DPO</h1>
  <svg id="diagram" viewBox="0 0 1200 438" width="1200" height="438"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Слева конвейер RLHF из SFT, модели награды и PPO с четырьмя копиями моделей; справа DPO из SFT и DPO с обучаемой политикой и замороженным референсом">
  </svg>
</main>
<script>
const data=[{
  canvas:{w:1200,h:438},
  geom:{
    zero:0,one:1,r:10,arrow:9,arrowHalf:6,
    leftX:28,rightX:612,colW:560,
    headingY:25,
    stageY:48,stageH:58,
    leftStages:[
      {x:48,w:138,title:["SFT"],sub:["обучение"]},
      {x:239,w:160,title:["reward model"],sub:["отдельное обучение"]},
      {x:452,w:110,title:["PPO"],sub:["цикл RL"]}
    ],
    rightStages:[
      {x:660,w:162,title:["SFT"],sub:["обучение"]},
      {x:934,w:190,title:["DPO"],sub:["обучение политики"]}
    ],
    arrows:[
      {x1:186,y1:77,x2:231,y2:77},
      {x1:399,y1:77,x2:444,y2:77},
      {x1:822,y1:77,x2:926,y2:77}
    ],
    memoryY:126,memoryH:174,
    memoryTitleY:150,memorySubY:169,
    leftCards:[
      {x:48,y:186,w:116,h:92,title:["policy"],state:"обучается",kind:"train"},
      {x:178,y:186,w:116,h:92,title:["reference"],state:"заморожена",kind:"frozen"},
      {x:308,y:186,w:116,h:92,title:["reward"],state:"заморожена",kind:"frozen"},
      {x:438,y:186,w:116,h:92,title:["value"],state:"иногда",kind:"train"}
    ],
    rightCards:[
      {x:684,y:186,w:184,h:92,title:["policy"],state:"обучается",kind:"train"},
      {x:914,y:186,w:184,h:92,title:["reference"],state:"заморожена",kind:"frozen"}
    ],
    cardTitleY:214,pillY:235,pillH:25,
    leftPillW:88,rightPillW:118,
    sharedX:493,sharedY:116,
    dpoPairX:1029,dpoPairY:116,
    memoryNote:{x:373,y:309,w:454,h:35},
    metricY:355,metricH:65,
    leftMetrics:[
      {x:28,w:174,main:"3 цикла",sub:"SFT · RM · PPO"},
      {x:211,w:174,main:"3 модели",sub:"обучаются по пути"},
      {x:394,w:190,main:"до 4 копий",sub:"в цикле PPO"}
    ],
    rightMetrics:[
      {x:612,w:174,main:"2 цикла",sub:"SFT · DPO"},
      {x:795,w:174,main:"1 модель",sub:"обучается в DPO"},
      {x:978,w:194,main:"2 копии",sub:"policy + reference"}
    ],
    metricMainY:380,metricSubY:403,
    noteMainY:324,noteSubY:339,
    textGap:16,
    inset:8
  },
  copyText:{
    shared:"общий старт",
    pairs:"пары «лучше — хуже»",
    memoryMain:"70B FP16: одна копия весов ≈ 140 ГБ",
    memorySub:"RLHF: 560 ГБ = 7 × H100 80 ГБ  •  DPO: 280 ГБ = 4 × H100 80 ГБ"
  }
}];
const origin={x:0,y:0};
const scale=1;
const sx=x=>origin.x+x*scale;
const sy=y=>origin.y+y*scale;

try{
  const [D]=data;
  const G=D.geom;
  const svg=document.querySelector("#diagram");
  const NS="http://www.w3.org/2000/svg";

  function node(name,attrs={},parent=svg){
    const el=document.createElementNS(NS,name);
    Object.entries(attrs).forEach(([key,value])=>el.setAttribute(key,String(value)));
    parent.appendChild(el);
    return el;
  }

  function rect(x,y,w,h,cls,r=G.r,parent=svg){
    return node("rect",{
      x:sx(x),y:sy(y),
      width:sx(w)-sx(G.zero),
      height:sy(h)-sy(G.zero),
      rx:sx(r)-sx(G.zero),
      class:cls
    },parent);
  }

  function text(x,y,content,cls,anchor="middle",parent=svg){
    const el=node("text",{
      x:sx(x),y:sy(y),
      class:cls,
      "text-anchor":anchor,
      "dominant-baseline":"middle"
    },parent);
    el.textContent=content;
    return el;
  }

  function lines(x,y,items,cls,anchor="middle",gap=G.textGap,parent=svg){
    const el=node("text",{
      x:sx(x),y:sy(y),
      class:cls,
      "text-anchor":anchor,
      "dominant-baseline":"middle"
    },parent);
    items.forEach((item,index)=>{
      const span=node("tspan",{
        x:sx(x),
        y:sy(y+index*gap)
      },el);
      span.textContent=item;
    });
    return el;
  }

  function horizontalArrow(a,parent=svg){
    node("line",{
      x1:sx(a.x1),y1:sy(a.y1),
      x2:sx(a.x2),y2:sy(a.y2),
      class:"flow"
    },parent);
    node("polygon",{
      points:[
        [sx(a.x2),sy(a.y2)],
        [sx(a.x2-G.arrow),sy(a.y2-G.arrowHalf)],
        [sx(a.x2-G.arrow),sy(a.y2+G.arrowHalf)]
      ].map(point=>point.join(",")).join(" "),
      class:"arrowhead"
    },parent);
  }

  function stage(item,kind,parent){
    rect(item.x,G.stageY,item.w,G.stageH,
      `stage ${kind==="rlhf"?"stage-rlhf":"stage-dpo"}`,G.r,parent);
    lines(item.x+item.w/G.one/G.one/G.one-item.w/G.one+item.w/G.one/G.one,
      G.stageY+G.stageH/G.one/G.one-G.stageH/G.one+G.stageH/G.one/G.one,
      item.title,"stage-title","middle",G.textGap,parent);
    text(item.x+item.w/G.one/G.one/G.one-item.w/G.one+item.w/G.one/G.one,
      G.stageY+G.stageH-G.inset,item.sub.join(" "),"small","middle",parent);
  }

  function card(item,wide,parent){
    rect(item.x,item.y,item.w,item.h,"component",G.r,parent);
    lines(item.x+item.w/G.one/G.one/G.one-item.w/G.one+item.w/G.one/G.one,
      G.cardTitleY,item.title,"label","middle",G.textGap,parent);
    const pillW=wide?G.rightPillW:G.leftPillW;
    const pillX=item.x+(item.w-pillW)/G.one/G.one;
    rect(pillX,G.pillY,pillW,G.pillH,
      item.kind==="train"?"train-pill":"frozen-pill",G.r,parent);
    text(item.x+item.w/G.one/G.one/G.one-item.w/G.one+item.w/G.one/G.one,
      G.pillY+G.pillH/G.one/G.one-G.pillH/G.one+G.pillH/G.one/G.one,
      item.state,
      `tiny ${item.kind==="train"?"train-text":"frozen-text"}`,
      "middle",parent);
  }

  function metric(item,kind,parent){
    rect(item.x,G.metricY,item.w,G.metricH,"metric",G.r,parent);
    text(item.x+item.w/G.one/G.one/G.one-item.w/G.one+item.w/G.one/G.one,
      G.metricMainY,item.main,
      `metric-main ${kind==="rlhf"?"rlhf-text":"dpo-text"}`,"middle",parent);
    text(item.x+item.w/G.one/G.one/G.one-item.w/G.one+item.w/G.one/G.one,
      G.metricSubY,item.sub,"small","middle",parent);
  }

  const background=node("g",{},svg);
  rect(G.zero,G.zero,D.canvas.w,D.canvas.h,"panel",G.zero,background);

  const left=node("g",{"aria-label":"Конвейер RLHF"},svg);
  const right=node("g",{"aria-label":"Конвейер DPO"},svg);

  text(G.leftX,G.headingY,"RLHF: SFT → reward model → PPO",
    "heading rlhf-text","start",left);
  text(G.rightX,G.headingY,"DPO: SFT → DPO",
    "heading dpo-text","start",right);

  G.leftStages.forEach(item=>stage(item,"rlhf",left));
  G.rightStages.forEach(item=>stage(item,"dpo",right));
  G.arrows.forEach(horizontalArrow);

  text(G.sharedX,G.sharedY,D.copyText.shared,"small","end",svg);
  text(G.dpoPairX,G.dpoPairY,D.copyText.pairs,"small","middle",svg);

  rect(G.leftX,G.memoryY,G.colW,G.memoryH,"rlhf-panel",G.r,left);
  rect(G.rightX,G.memoryY,G.colW,G.memoryH,"dpo-panel",G.r,right);

  text(G.leftX+G.inset,G.memoryTitleY,"Во время PPO: 3–4 копии",
    "label rlhf-text","start",left);
  text(G.leftX+G.inset,G.memorySubY,
    "политика, референс, награда и иногда value",
    "small","start",left);

  text(G.rightX+G.inset,G.memoryTitleY,"Во время DPO: 2 копии",
    "label dpo-text","start",right);
  text(G.rightX+G.inset,G.memorySubY,
    "обновляется только policy; reference не учится",
    "small","start",right);

  G.leftCards.forEach(item=>card(item,false,left));
  G.rightCards.forEach(item=>card(item,true,right));

  rect(G.memoryNote.x,G.memoryNote.y,G.memoryNote.w,G.memoryNote.h,
    "memory-note",G.r,svg);
  text(G.memoryNote.x+G.memoryNote.w/G.one/G.one/G.one-G.memoryNote.w/G.one+
    G.memoryNote.w/G.one/G.one,G.noteMainY,D.copyText.memoryMain,
    "label","middle",svg);
  text(G.memoryNote.x+G.memoryNote.w/G.one/G.one/G.one-G.memoryNote.w/G.one+
    G.memoryNote.w/G.one/G.one,G.noteSubY,D.copyText.memorySub,
    "tiny","middle",svg);

  G.leftMetrics.forEach(item=>metric(item,"rlhf",left));
  G.rightMetrics.forEach(item=>metric(item,"dpo",right));

}catch(error){
  const svg=document.querySelector("#diagram");
  const NS="http://www.w3.org/2000/svg";
  const fallback=document.createElementNS(NS,"text");
  fallback.setAttribute("x",String(sx(data[0].geom.leftX)));
  fallback.setAttribute("y",String(sy(data[0].canvas.h/data[0].geom.one/data[0].geom.one-
    data[0].canvas.h/data[0].geom.one+data[0].canvas.h/data[0].geom.one/data[0].geom.one)));
  fallback.setAttribute("class","fallback");
  fallback.textContent="Схема должна показать: RLHF — SFT → reward model → PPO с 3–4 копиями; DPO — SFT → DPO с policy и замороженной reference.";
  svg.appendChild(fallback);
}
</script>
</body>
</html>
