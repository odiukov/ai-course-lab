<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Частица в потенциале с двумя ямами</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #f7f8fb;
      --surface: #ffffff;
      --ink: #172033;
      --muted: #657087;
      --grid: #cbd2df;
      --potential: #273b8f;
      --particle: #d64545;
      --low: #287a55;
      --medium: #c57618;
      --high: #8853ba;
      --barrier: #9a5b20;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #151821;
        --surface: #1c202b;
        --ink: #eef1f7;
        --muted: #aeb7c8;
        --grid: #4b5365;
        --potential: #91a7ff;
        --particle: #ff7a7a;
        --low: #65d49d;
        --medium: #ffc06a;
        --high: #cf9cff;
        --barrier: #f2b66f;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .figure {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--grid);
      overflow: hidden;
    }

    .title {
      padding: 12px 18px 6px;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.2;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 470px;
      background: var(--surface);
    }

    .axis,
    .tick {
      fill: none;
      stroke: var(--ink);
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .guide,
    .separator {
      fill: none;
      stroke: var(--grid);
      stroke-width: 1.2;
      stroke-linecap: round;
    }

    .guide {
      stroke-dasharray: 5 6;
    }

    .potential {
      fill: none;
      stroke: var(--potential);
      stroke-width: 3.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .trace-low,
    .trace-medium,
    .trace-high {
      fill: none;
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .trace-low {
      stroke: var(--low);
    }

    .trace-medium {
      stroke: var(--medium);
    }

    .trace-high {
      stroke: var(--high);
    }

    .particle {
      fill: var(--particle);
      stroke: var(--surface);
      stroke-width: 2.2;
    }

    .barrier-mark {
      fill: var(--barrier);
    }

    .label {
      fill: var(--ink);
      font-size: 15px;
    }

    .small {
      fill: var(--muted);
      font-size: 13px;
    }

    .formula {
      fill: var(--potential);
      font-size: 17px;
      font-weight: 650;
    }

    .lane-low,
    .lane-medium,
    .lane-high {
      font-size: 15px;
      font-weight: 650;
    }

    .lane-low {
      fill: var(--low);
    }

    .lane-medium {
      fill: var(--medium);
    }

    .lane-high {
      fill: var(--high);
    }

    .fallback {
      fill: var(--ink);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <figure class="figure" aria-labelledby="diagram-title">
    <figcaption id="diagram-title" class="title">Частица в потенциале с двумя ямами</figcaption>
    <svg id="diagram" viewBox="0 0 1000 500" width="1000" height="500"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-label="Потенциал U от x и три траектории Ланжевена: при низкой, средней и высокой температуре">
      <g id="drawing"></g>
    </svg>
  </figure>

  <script>
    (() => {
      const data = Object.freeze({
        potential: Object.freeze({
          minX: -1.55,
          maxX: 1.55,
          step: 0.025,
          axisLeft: -1.68,
          axisRight: 1.65,
          axisBottom: -0.14,
          axisTop: 3.32,
          curveLimit: 3.28,
          equationX: -1.58,
          equationY: 3.56,
          xLabelX: 1.65,
          xLabelY: -0.28,
          uLabelX: 0.12,
          uLabelY: 3.27,
          tickBottom: -0.09,
          tickTop: 0.09,
          tickLabelY: -0.29,
          leftWellX: -1.16,
          leftWellY: 0.48,
          rightWellX: 1.16,
          rightWellY: 0.48,
          barrierLabelX: 0.18,
          barrierLabelY: 1.18,
          particleX: -1,
          particleY: 0.06,
          particleRadius: 0.055,
          particleLabelX: -1.47,
          particleLabelY: 0.82,
          pointerStartX: -1.28,
          pointerStartY: 0.7,
          pointerEndX: -1.04,
          pointerEndY: 0.15,
          barrierRadius: 0.035
        }),
        arrows: Object.freeze({
          xBack: 0.11,
          xHalf: 0.075,
          yBack: 0.16,
          yHalf: 0.045,
          pointerBack: 0.09,
          pointerHalf: 0.045
        }),
        traces: Object.freeze({
          startX: 1.72,
          endX: 3.82,
          guideStartX: 1.62,
          guideEndX: 3.82,
          guideLabelX: 1.57,
          headingX: 1.68,
          headingLift: 0.69,
          amplitude: 0.43,
          lowCenter: -0.88,
          mediumCenter: -2.62,
          highCenter: -4.36,
          footerX: 2.75,
          footerY: -5.23,
          timeLabelX: 3.82,
          timeLabelY: -5.05,
          one: 1,
          low: Object.freeze([
            -1, -0.93, -1.05, -0.89, -1.08, -0.96, -1.12, -0.9,
            -1.02, -0.86, -1.07, -0.95, -1.11, -0.91, -1.04, -0.88,
            -1.09, -0.94, -1.06, -0.9, -1.03, -0.87, -1.08, -0.96,
            -1.1, -0.92, -1.04, -0.89, -1.07, -0.95, -1.02, -0.91
          ]),
          medium: Object.freeze([
            -1, -0.94, -1.08, -0.86, -1.02, -0.78, -0.42, 0.08,
            0.55, 0.91, 1.08, 0.93, 1.02, 0.84, 1.1, 0.88,
            0.96, 0.62, 0.14, -0.38, -0.82, -1.05, -0.9, -1.02,
            -0.76, -0.22, 0.31, 0.79, 1.04, 0.9, 1.08, 0.95
          ]),
          high: Object.freeze([
            -1, -0.42, 0.38, 1.24, 0.71, -0.18, -1.31, -0.65,
            0.52, 1.43, 0.94, -0.29, -1.52, -0.83, 0.26, 1.18,
            0.55, -0.71, -1.38, -0.12, 1.36, 0.81, -0.46, -1.22,
            -0.58, 0.69, 1.51, 0.22, -1.44, -0.76, 0.48, 1.12
          ])
        }),
        separators: Object.freeze({
          startX: 1.5,
          endX: 3.9,
          firstY: 0.02,
          secondY: -1.73,
          thirdY: -3.48
        }),
        constants: Object.freeze({
          zero: 0,
          one: 1,
          two: 2,
          four: 4
        })
      });

      const origin = Object.freeze({ x: 292, y: 200 });
      const scale = Object.freeze({ x: 174, y: 51 });

      const sx = x => origin.x + x * scale.x;
      const sy = y => origin.y - y * scale.y;

      const svg = document.getElementById("diagram");
      const drawing = document.getElementById("drawing");
      const ns = "http://www.w3.org/2000/svg";
      const { zero, one, two } = data.constants;

      const node = (name, attrs, content) => {
        const item = document.createElementNS(ns, name);
        Object.entries(attrs).forEach(([key, value]) => item.setAttribute(key, String(value)));
        if (content !== undefined) item.textContent = content;
        drawing.appendChild(item);
        return item;
      };

      const line = (x1, y1, x2, y2, className) =>
        node("line", {
          x1: sx(x1), y1: sy(y1),
          x2: sx(x2), y2: sy(y2),
          class: className
        });

      const text = (x, y, content, className, anchor) =>
        node("text", {
          x: sx(x),
          y: sy(y),
          class: className,
          "text-anchor": anchor,
          "dominant-baseline": "middle"
        }, content);

      const polygon = (points, className) =>
        node("polygon", {
          points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
          class: className
        });

      const polyline = (points, className) =>
        node("polyline", {
          points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
          class: className
        });

      const arrowHead = (tipX, tipY, direction) => {
        const a = data.arrows;
        if (direction === "right") {
          polygon([
            { x: tipX, y: tipY },
            { x: tipX - a.xBack, y: tipY + a.xHalf },
            { x: tipX - a.xBack, y: tipY - a.xHalf }
          ], "barrier-mark");
        } else {
          polygon([
            { x: tipX, y: tipY },
            { x: tipX - a.yHalf, y: tipY - a.yBack },
            { x: tipX + a.yHalf, y: tipY - a.yBack }
          ], "barrier-mark");
        }
      };

      const tracePoints = (values, center) => {
        const t = data.traces;
        return values.map((value, index, list) => ({
          x: t.startX + (t.endX - t.startX) * index / (list.length - t.one),
          y: center + value * t.amplitude
        }));
      };

      const drawLane = (center, values, pathClass, heading, headingClass) => {
        const t = data.traces;
        line(t.guideStartX, center + t.amplitude, t.guideEndX, center + t.amplitude, "guide");
        line(t.guideStartX, center - t.amplitude, t.guideEndX, center - t.amplitude, "guide");
        text(t.guideLabelX, center + t.amplitude, "+1", "small", "end");
        text(t.guideLabelX, center - t.amplitude, "−1", "small", "end");
        text(t.headingX, center + t.headingLift, heading, headingClass, "start");
        polyline(tracePoints(values, center), pathClass);
      };

      try {
        drawing.replaceChildren();

        const p = data.potential;
        const a = data.arrows;

        line(p.axisLeft, zero, p.axisRight, zero, "axis");
        line(zero, p.axisBottom, zero, p.axisTop, "axis");
        arrowHead(p.axisRight, zero, "right");
        arrowHead(zero, p.axisTop, "up");

        [-one, zero, one].forEach(value => {
          line(value, p.tickBottom, value, p.tickTop, "tick");
          const label = value === -one ? "−1" : value === one ? "+1" : "0";
          text(value, p.tickLabelY, label, "small", "middle");
        });

        const curve = [];
        for (let x = p.minX; x <= p.maxX; x += p.step) {
          const square = x * x;
          const y = (square - one) * (square - one);
          if (y <= p.curveLimit) curve.push({ x, y });
        }
        polyline(curve, "potential");

        text(p.equationX, p.equationY, "U(x) = (x² − 1)²", "formula", "start");
        text(p.xLabelX, p.xLabelY, "x", "label", "end");
        text(p.uLabelX, p.uLabelY, "U", "label", "start");
        text(p.leftWellX, p.leftWellY, "левая яма", "small", "middle");
        text(p.rightWellX, p.rightWellY, "правая яма", "small", "middle");
        text(p.barrierLabelX, p.barrierLabelY, "барьер около x = 0", "small", "start");

        node("circle", {
          cx: sx(zero),
          cy: sy(one),
          r: Math.abs(sx(p.barrierRadius) - sx(zero)),
          class: "barrier-mark"
        });

        node("circle", {
          cx: sx(p.particleX),
          cy: sy(p.particleY),
          r: Math.abs(sx(p.particleRadius) - sx(zero)),
          class: "particle"
        });

        line(p.pointerStartX, p.pointerStartY, p.pointerEndX, p.pointerEndY, "axis");
        polygon([
          { x: p.pointerEndX, y: p.pointerEndY },
          {
            x: p.pointerEndX - a.pointerHalf,
            y: p.pointerEndY + a.pointerBack
          },
          {
            x: p.pointerEndX + a.pointerHalf,
            y: p.pointerEndY + a.pointerBack
          }
        ], "barrier-mark");
        text(p.particleLabelX, p.particleLabelY, "старт частицы", "label", "start");

        const s = data.separators;
        line(s.startX, s.firstY, s.endX, s.firstY, "separator");
        line(s.startX, s.secondY, s.endX, s.secondY, "separator");
        line(s.startX, s.thirdY, s.endX, s.thirdY, "separator");

        const t = data.traces;
        drawLane(
          t.lowCenter,
          t.low,
          "trace-low",
          "низкая: остаётся около x ≈ −1",
          "lane-low"
        );
        drawLane(
          t.mediumCenter,
          t.medium,
          "trace-medium",
          "средняя: редкие переходы −1 ↔ +1",
          "lane-medium"
        );
        drawLane(
          t.highCenter,
          t.high,
          "trace-high",
          "высокая: широкое блуждание",
          "lane-high"
        );

        line(t.startX, t.footerY, t.endX, t.footerY, "axis");
        arrowHead(t.endX, t.footerY, "right");
        text(t.timeLabelX, t.timeLabelY, "время", "small", "end");
        text(
          t.footerX,
          t.footerY,
          "температура усиливает шум и помогает преодолеть барьер",
          "small",
          "middle"
        );
      } catch (error) {
        drawing.replaceChildren();
        node("text", {
          x: sx(-1.45),
          y: sy(1.25),
          class: "fallback",
          "text-anchor": "start"
        }, "Схема должна была показать двойную яму и траектории при низкой, средней и высокой температуре.");
        svg.setAttribute("aria-label", "Не удалось построить схему двойной потенциальной ямы");
      }
    })();
  </script>
</body>
</html>
