<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Погодная цепь из трёх состояний</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: ivory;
      --panel: white;
      --ink: midnightblue;
      --muted: slategray;
      --accent: darkorange;
      --node: floralwhite;
      --current: lemonchiffon;
      --border: lightsteelblue;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: midnightblue;
        --panel: darkslateblue;
        --ink: aliceblue;
        --muted: lightsteelblue;
        --accent: gold;
        --node: slateblue;
        --current: darkgoldenrod;
        --border: slategray;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
    }

    body {
      margin: auto;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      box-sizing: border-box;
      width: 1000px;
      max-width: 100%;
      margin: auto;
      background: var(--panel);
      border: 2px solid var(--border);
    }

    h1 {
      box-sizing: border-box;
      margin: auto;
      padding: 10px 16px 6px;
      font-size: 22px;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 450px;
      background: var(--panel);
    }

    .transition {
      fill: none;
      stroke: var(--muted);
      stroke-width: 3px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .transition.current {
      stroke: var(--accent);
      stroke-width: 4px;
    }

    .arrowhead {
      fill: var(--muted);
      stroke: var(--muted);
      stroke-width: 1px;
      stroke-linejoin: round;
    }

    .arrowhead.current {
      fill: var(--accent);
      stroke: var(--accent);
    }

    .probability {
      fill: var(--muted);
      stroke: var(--panel);
      stroke-width: 7px;
      stroke-linejoin: round;
      paint-order: stroke fill;
      font-size: 18px;
      font-weight: bold;
    }

    .probability.current {
      fill: var(--accent);
    }

    .node {
      fill: var(--node);
      stroke: var(--ink);
      stroke-width: 3px;
    }

    .node.current {
      fill: var(--current);
      stroke: var(--accent);
      stroke-width: 5px;
    }

    .state-name {
      fill: var(--ink);
      font-size: 20px;
      font-weight: bold;
      text-anchor: middle;
    }

    .state-translation {
      fill: var(--muted);
      font-size: 14px;
      font-weight: normal;
    }

    .today {
      fill: var(--accent);
      stroke: var(--panel);
      stroke-width: 6px;
      paint-order: stroke fill;
      font-size: 15px;
      font-weight: bold;
      text-anchor: middle;
    }

    .caption {
      fill: var(--accent);
      font-size: 16px;
      font-weight: bold;
      text-anchor: middle;
    }

    .fallback {
      fill: var(--ink);
      font-size: 18px;
      text-anchor: middle;
    }
  </style>
</head>
<body>
  <main>
    <h1>Погодная цепь из трёх состояний</h1>
    <svg
      id="weather-chain"
      viewBox="0 0 1000 440"
      width="1000"
      height="440"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-title diagram-description"
    >
      <title id="diagram-title">Переходы между состояниями Sunny, Rainy и Cloudy</title>
      <desc id="diagram-description">
        Девять стрелок показывают все вероятности переходов. Три выделенные
        стрелки выходят из состояния Sunny, соответствующего сегодняшней погоде.
      </desc>
    </svg>
  </main>

  <script>
    const diagram = {
      canvas: { width: 1000, height: 440 },
      geometry: {
        arrowLength: 0.22,
        arrowHalfWidth: 0.11,
        stateLineGap: 0.25,
        translationGap: 0.27
      },
      labels: {
        today: { x: 0, y: -2.34, dx: 0, dy: -8 },
        caption: { x: 0, y: 2.92, dx: 0, dy: 0 },
        fallback: { x: 0, y: 0, dx: 0, dy: 0 }
      },
      nodes: [
        {
          key: "S",
          en: "Sunny",
          ru: "солнечно",
          x: 0,
          y: -1.35,
          r: 0.78,
          current: true
        },
        {
          key: "R",
          en: "Rainy",
          ru: "дождливо",
          x: -3,
          y: 1.25,
          r: 0.78,
          current: false
        },
        {
          key: "C",
          en: "Cloudy",
          ru: "облачно",
          x: 3,
          y: 1.25,
          r: 0.78,
          current: false
        }
      ],
      arrows: [
        {
          from: "S",
          to: "S",
          value: "0,7",
          current: true,
          start: { x: -0.49, y: -1.96 },
          controlA: { x: -1.34, y: -2.94 },
          controlB: { x: 1.34, y: -2.94 },
          end: { x: 0.49, y: -1.96 },
          label: { x: 0, y: -2.72, dx: 0, dy: -5, anchor: "middle" }
        },
        {
          from: "S",
          to: "R",
          value: "0,1",
          current: true,
          start: { x: -0.62, y: -1.04 },
          controlA: { x: -1.58, y: -0.98 },
          controlB: { x: -2.72, y: -0.06 },
          end: { x: -2.88, y: 0.48 },
          label: { x: -2.04, y: -0.66, dx: -8, dy: -7, anchor: "end" }
        },
        {
          from: "S",
          to: "C",
          value: "0,2",
          current: true,
          start: { x: 0.62, y: -1.04 },
          controlA: { x: 1.58, y: -0.98 },
          controlB: { x: 2.72, y: -0.06 },
          end: { x: 2.88, y: 0.48 },
          label: { x: 2.04, y: -0.66, dx: 8, dy: -7, anchor: "start" }
        },
        {
          from: "R",
          to: "S",
          value: "0,3",
          current: false,
          start: { x: -2.45, y: 0.69 },
          controlA: { x: -1.76, y: 0.08 },
          controlB: { x: -0.93, y: -0.61 },
          end: { x: -0.47, y: -0.73 },
          label: { x: -1.52, y: -0.08, dx: 9, dy: 13, anchor: "start" }
        },
        {
          from: "R",
          to: "R",
          value: "0,4",
          current: false,
          start: { x: -3.58, y: 1.77 },
          controlA: { x: -4.75, y: 2.24 },
          controlB: { x: -4.75, y: 0.25 },
          end: { x: -3.61, y: 0.76 },
          label: { x: -4.55, y: 1.3, dx: -8, dy: 5, anchor: "end" }
        },
        {
          from: "R",
          to: "C",
          value: "0,3",
          current: false,
          start: { x: -2.24, y: 1.08 },
          controlA: { x: -1.18, y: 0.47 },
          controlB: { x: 1.18, y: 0.47 },
          end: { x: 2.24, y: 1.08 },
          label: { x: 0, y: 0.59, dx: 0, dy: -8, anchor: "middle" }
        },
        {
          from: "C",
          to: "S",
          value: "0,4",
          current: false,
          start: { x: 2.45, y: 0.69 },
          controlA: { x: 1.76, y: 0.08 },
          controlB: { x: 0.93, y: -0.61 },
          end: { x: 0.47, y: -0.73 },
          label: { x: 1.52, y: -0.08, dx: -9, dy: 13, anchor: "end" }
        },
        {
          from: "C",
          to: "R",
          value: "0,2",
          current: false,
          start: { x: 2.24, y: 1.55 },
          controlA: { x: 1.24, y: 2.39 },
          controlB: { x: -1.24, y: 2.39 },
          end: { x: -2.24, y: 1.55 },
          label: { x: 0, y: 2.25, dx: 0, dy: 15, anchor: "middle" }
        },
        {
          from: "C",
          to: "C",
          value: "0,4",
          current: false,
          start: { x: 3.58, y: 1.77 },
          controlA: { x: 4.75, y: 2.24 },
          controlB: { x: 4.75, y: 0.25 },
          end: { x: 3.61, y: 0.76 },
          label: { x: 4.55, y: 1.3, dx: 8, dy: 5, anchor: "start" }
        }
      ]
    };

    const origin = { x: 500, y: 214 };
    const scale = 68;

    const sx = (x) => origin.x + x * scale;
    const sy = (y) => origin.y + y * scale;

    try {
      const svg = document.getElementById("weather-chain");
      const namespace = "http://www.w3.org/2000/svg";

      const make = (name, attributes, text) => {
        const element = document.createElementNS(namespace, name);
        Object.entries(attributes).forEach(([attribute, value]) => {
          element.setAttribute(attribute, value);
        });
        if (text !== undefined) {
          element.textContent = text;
        }
        return element;
      };

      const pointString = (points) => points
        .map((point) => `${sx(point.x)},${sy(point.y)}`)
        .join(" ");

      const addArrowhead = (arrow, group) => {
        const dx = arrow.end.x - arrow.controlB.x;
        const dy = arrow.end.y - arrow.controlB.y;
        const magnitude = Math.hypot(dx, dy);
        const unitX = dx / magnitude;
        const unitY = dy / magnitude;
        const base = {
          x: arrow.end.x - unitX * diagram.geometry.arrowLength,
          y: arrow.end.y - unitY * diagram.geometry.arrowLength
        };
        const normal = {
          x: -unitY * diagram.geometry.arrowHalfWidth,
          y: unitX * diagram.geometry.arrowHalfWidth
        };
        const vertices = [
          arrow.end,
          { x: base.x + normal.x, y: base.y + normal.y },
          { x: base.x - normal.x, y: base.y - normal.y }
        ];
        group.appendChild(make("polygon", {
          points: pointString(vertices),
          class: `arrowhead${arrow.current ? " current" : ""}`
        }));
      };

      const edgeLayer = make("g", {
        "aria-label": "Все переходы и их вероятности"
      });
      const labelLayer = make("g", {
        "aria-label": "Вероятности переходов"
      });
      const nodeLayer = make("g", {
        "aria-label": "Состояния погоды"
      });

      diagram.arrows.forEach((arrow) => {
        const group = make("g", {
          "aria-label": `Из ${arrow.from} в ${arrow.to}: ${arrow.value}`
        });
        const path = make("path", {
          d: [
            `M ${sx(arrow.start.x)} ${sy(arrow.start.y)}`,
            `C ${sx(arrow.controlA.x)} ${sy(arrow.controlA.y)}`,
            `${sx(arrow.controlB.x)} ${sy(arrow.controlB.y)}`,
            `${sx(arrow.end.x)} ${sy(arrow.end.y)}`
          ].join(" "),
          class: `transition${arrow.current ? " current" : ""}`
        });
        const title = make(
          "title",
          {},
          `Переход из ${arrow.from} в ${arrow.to} с вероятностью ${arrow.value}`
        );
        group.appendChild(title);
        group.appendChild(path);
        addArrowhead(arrow, group);
        edgeLayer.appendChild(group);

        labelLayer.appendChild(make("text", {
          x: sx(arrow.label.x),
          y: sy(arrow.label.y),
          dx: arrow.label.dx,
          dy: arrow.label.dy,
          "text-anchor": arrow.label.anchor,
          class: `probability${arrow.current ? " current" : ""}`
        }, arrow.value));
      });

      diagram.nodes.forEach((node) => {
        const group = make("g", {
          "aria-label": `${node.en}, ${node.ru}${node.current ? ", сегодня" : ""}`
        });
        group.appendChild(make("circle", {
          cx: sx(node.x),
          cy: sy(node.y),
          r: sx(node.r) - sx(0),
          class: `node${node.current ? " current" : ""}`
        }));

        const text = make("text", {
          x: sx(node.x),
          y: sy(node.y - diagram.geometry.stateLineGap),
          class: "state-name"
        });
        text.appendChild(make("tspan", {
          x: sx(node.x),
          y: sy(node.y - diagram.geometry.stateLineGap)
        }, node.en));
        text.appendChild(make("tspan", {
          x: sx(node.x),
          y: sy(node.y + diagram.geometry.translationGap),
          class: "state-translation"
        }, node.ru));
        group.appendChild(text);
        nodeLayer.appendChild(group);
      });

      svg.appendChild(edgeLayer);
      svg.appendChild(labelLayer);
      svg.appendChild(nodeLayer);

      svg.appendChild(make("text", {
        x: sx(diagram.labels.today.x),
        y: sy(diagram.labels.today.y),
        dx: diagram.labels.today.dx,
        dy: diagram.labels.today.dy,
        class: "today"
      }, "сегодня"));

      svg.appendChild(make("text", {
        x: sx(diagram.labels.caption.x),
        y: sy(diagram.labels.caption.y),
        dx: diagram.labels.caption.dx,
        dy: diagram.labels.caption.dy,
        class: "caption"
      }, "Выделена строка «солнечно»: для завтра нужны только три стрелки из Sunny"));
    } catch (error) {
      const svg = document.getElementById("weather-chain");
      if (svg) {
        svg.replaceChildren();
        svg.appendChild(document.createElementNS(
          "http://www.w3.org/2000/svg",
          "title"
        )).textContent = "Погодная цепь из трёх состояний";

        const message = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "text"
        );
        message.setAttribute("x", sx(diagram.labels.fallback.x));
        message.setAttribute("y", sy(diagram.labels.fallback.y));
        message.setAttribute("dx", diagram.labels.fallback.dx);
        message.setAttribute("dy", diagram.labels.fallback.dy);
        message.setAttribute("class", "fallback");
        message.textContent =
          "Здесь должна быть схема девяти переходов между Sunny, Rainy и Cloudy.";
        svg.appendChild(message);
      }
    }
  </script>
</body>
</html>
