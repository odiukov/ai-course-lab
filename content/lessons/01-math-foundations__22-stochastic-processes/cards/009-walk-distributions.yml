- concept: нормированная позиция случайного блуждания сходится к стандартному нормальному распределению
  question: К какой форме приближается распределение величины S_n / sqrt(n) для честного случайного блуждания при большом n?
  explanation: Позиция S_n является суммой независимых приращений с нулевым средним и единичной дисперсией. Поэтому её стандартное отклонение равно sqrt(n), а центральная предельная теорема даёт сходимость S_n / sqrt(n) к стандартному нормальному распределению.
  kind: choice
  options:
    - К стандартному нормальному распределению
    - К равномерному распределению
    - К распределению с массой только на крайних позициях
    - К точечной массе в начале координат
  correct: 0
