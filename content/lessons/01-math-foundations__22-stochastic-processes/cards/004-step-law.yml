  fingerprint: aaa3ad9a
- concept: распределение описывает возможные исходы и их вероятности, а реализация является одним выпавшим исходом
  question: Объясните своими словами, чем распределение приращения случайного блуждания отличается от наблюдённого приращения.
  explanation: До шага значения +1 и −1 возможны с вероятностями 0,5. После шага наблюдается только одно из них; распределение при этом описывает правило выбора, а не результат отдельного испытания.
  kind: open
  reference: Распределение перечисляет все допустимые значения приращения и вероятности этих значений. Наблюдённое приращение — одно конкретное значение, выбранное случайно согласно распределению.
  id: 004-step-law-2
  fingerprint: 10f114d7
- concept: вероятности всех возможных исходов полного распределения нормируются
  question: Заполните условие нормировки распределения дискретной случайной величины.
  explanation: Сумма вероятностей всех допустимых исходов равна вероятности достоверного события, то есть 1. Для шага блуждания это 0,5 + 0,5 = 1.
