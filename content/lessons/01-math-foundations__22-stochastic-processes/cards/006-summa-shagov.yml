- concept: независимость приращений сохраняет распределение следующего шага независимо от прошлых исходов
  question: В честном случайном блуждании несколько последних шагов были направлены вправо. Как это влияет на направление следующего шага?
  explanation: 'Приращения независимы: предыдущие исходы не меняют вероятности нового броска. Серия шагов вправо не создаёт ни компенсации, ни инерции.'
  kind: choice
  options:
    - Следующий шаг с большей вероятностью будет направлен влево
    - Вероятности направлений не изменятся
    - Следующий шаг с большей вероятностью будет направлен вправо
  correct: 1
  id: 006-summa-shagov-1
  fingerprint: 6c2100bb
- concept: итоговая позиция случайного блуждания равна разности количеств шагов в противоположных направлениях
  question: Пусть R — количество шагов вправо, а L — количество шагов влево. Заполни пропуск в формуле позиции S после всего блуждания.
  explanation: Каждый шаг вправо даёт приращение +1, а каждый шаг влево — −1, поэтому S = R − L. Противоположно направленные шаги взаимно сокращаются.
  kind: cloze
  template: S = R ___ L
  answer: '-'
  accept:
    - −
    - минус
  id: 006-summa-shagov-2
  fingerprint: 177ebef5
