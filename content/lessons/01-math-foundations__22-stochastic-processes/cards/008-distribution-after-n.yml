- concept: распределение до совершения переходов является точечной массой в начальном состоянии
  question: Как задать распределение положения случайного блуждания до совершения каких-либо шагов и почему это корректная база для итеративного расчёта?
  explanation: 'При n = 0 блуждание ещё не покинуло начало, поэтому распределение равно {0: 1}. Такое вырожденное распределение служит базовым случаем для дальнейших обновлений.'
  kind: open
  reference: Нужно сосредоточить всю вероятность в начальной позиции. Это описывает достоверно известное начальное состояние, от которого затем последовательно вычисляются распределения после переходов.
  id: 008-distribution-after-n-1
  fingerprint: 6b94ff45
- concept: итеративный перенос распределения требует раздельных словарей для текущего и следующего моментов времени
  question: Расположите действия алгоритма вычисления распределения случайного блуждания в правильном порядке.
  explanation: 'Отдельный накопитель обеспечивает синхронное обновление: каждый новый слой строится только из распределения предыдущего момента. Если изменять перебираемый словарь, новые состояния могут ошибочно участвовать в том же переходе.'
  kind: order
  items:
    - Задать текущее распределение как точечную массу в начальной позиции
    - Создать пустой накопитель распределения следующего момента времени
    - Для каждой текущей позиции и каждого возможного приращения перенести соответствующую долю вероятности в накопитель
    - После полного обхода заменить текущее распределение накопленным
    - После нужного количества повторов вернуть текущее распределение
  id: 008-distribution-after-n-2
  fingerprint: 03855dad
- concept: чётность достижимой позиции совпадает с чётностью количества шагов блуждания
  question: Какая позиция недостижима после 9 шагов одномерного блуждания с приращениями плюс или минус единица?
  explanation: Каждый шаг меняет чётность позиции. Поэтому после нечётного количества шагов достижимы только нечётные позиции, а позиция 4 имеет нулевую вероятность.
  kind: choice
  options:
    - Позиция 4
    - Позиция 3
    - Позиция -3
    - Позиция 9
  correct: 0
  id: 008-distribution-after-n-3
  fingerprint: 964e523e
