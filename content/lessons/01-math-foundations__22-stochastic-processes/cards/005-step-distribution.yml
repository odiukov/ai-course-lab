- concept: порог в середине равномерного интервала делит его на два равновероятных события
  question: Случайная величина U равномерно распределена на интервале [a, b], где a < b. Какой порог разделит значения U на два исхода с одинаковой вероятностью?
  explanation: При равномерном распределении вероятность пропорциональна длине участка. Середина интервала создаёт два участка одинаковой длины, поэтому оба исхода равновероятны.
  kind: choice
  options:
    - (a + b) / 2
    - a + b
    - b - a
  correct: 0
  id: 005-step-distribution-1
  fingerprint: 0ecf7203
- concept: равные вероятности исходов не гарантируют равенства их частот в конечной выборке
  question: Объясни своими словами, почему в конечной серии независимых бросков честной монеты количества орлов и решек могут различаться.
  explanation: У честной монеты оба исхода одинаково вероятны, однако отдельная конечная серия остаётся случайной. При увеличении числа бросков их доли обычно приближаются друг к другу, но точное равенство не обязательно.
  kind: open
  reference: Равные вероятности описывают распределение каждого броска и долгосрочную долю исходов, но не требуют точного равенства частот в конкретной конечной серии. Случайные колебания могут дать перевес любому из исходов.
  id: 005-step-distribution-2
  fingerprint: bca5bb83
