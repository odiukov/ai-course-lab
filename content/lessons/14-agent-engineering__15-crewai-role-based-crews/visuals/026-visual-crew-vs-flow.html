<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crew против Flow</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f4ee;
      --panel: #fffdf8;
      --ink: #252a32;
      --muted: #69717d;
      --crew: #c85b3c;
      --crew-soft: #f7ded4;
      --flow: #2769a8;
      --flow-soft: #dcecf8;
      --accent: #7252a3;
      --accent-soft: #ece3f7;
      --line: 2px;
      --fine: 1px;
      --label-pad: 12px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .figure {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      background: var(--panel);
      border: var(--fine) solid color-mix(in srgb, var(--muted), transparent);
      overflow: hidden;
    }

    .figure__header {
      padding: var(--label-pad);
      border-bottom: var(--fine) solid color-mix(in srgb, var(--muted), transparent);
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 750;
      letter-spacing: 0.01em;
    }

    .figure__header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 430px;
      background: var(--panel);
    }

    .divider {
      stroke: color-mix(in srgb, var(--muted), transparent 45%);
      stroke-width: var(--fine);
      stroke-dasharray: 5 7;
    }

    .column-title {
      fill: var(--ink);
      font-size: 21px;
      font-weight: 760;
    }

    .column-subtitle {
      fill: var(--muted);
      font-size: 13px;
    }

    .crew-cloud {
      fill: var(--crew-soft);
      fill-opacity: 0.2;
      stroke: var(--crew);
      stroke-width: var(--fine);
      stroke-dasharray: 7 7;
    }

    .crew-card,
    .flow-card,
    .topic-card,
    .call-card,
    .goal-card,
    .note-card {
      stroke-width: var(--line);
    }

    .crew-card {
      fill: var(--panel);
      stroke: var(--crew);
    }

    .flow-card {
      fill: var(--panel);
      stroke: var(--flow);
    }

    .topic-card {
      fill: var(--flow-soft);
      stroke: var(--flow);
    }

    .call-card {
      fill: var(--accent-soft);
      stroke: var(--accent);
    }

    .goal-card {
      fill: var(--crew-soft);
      stroke: var(--crew);
    }

    .note-card {
      fill: color-mix(in srgb, var(--panel), var(--muted) 7%);
      stroke: color-mix(in srgb, var(--muted), transparent 30%);
      stroke-width: var(--fine);
    }

    .crew-arrow {
      fill: none;
      stroke: var(--crew);
      stroke-width: var(--line);
      stroke-linecap: round;
    }

    .flow-arrow {
      fill: none;
      stroke: var(--flow);
      stroke-width: var(--line);
      stroke-linecap: round;
    }

    .call-arrow {
      fill: none;
      stroke: var(--accent);
      stroke-width: var(--line);
      stroke-linecap: round;
    }

    .crew-head {
      fill: var(--crew);
    }

    .flow-head {
      fill: var(--flow);
    }

    .call-head {
      fill: var(--accent);
    }

    .card-title {
      fill: var(--ink);
      font-size: 15px;
      font-weight: 700;
    }

    .card-detail {
      fill: var(--muted);
      font-size: 12px;
    }

    .code-label {
      fill: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      font-weight: 650;
    }

    .decorator-label {
      fill: var(--flow);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      font-weight: 650;
    }

    .caption {
      fill: var(--muted);
      font-size: 13px;
    }

    .caption-strong {
      fill: var(--ink);
      font-size: 13px;
      font-weight: 700;
    }

    #fallback {
      margin: 0;
      padding: var(--label-pad);
      color: var(--ink);
      background: var(--panel);
      font-size: 15px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #11151b;
        --panel: #181e26;
        --ink: #edf1f6;
        --muted: #aab4c0;
        --crew: #ef8b69;
        --crew-soft: #482a24;
        --flow: #78b7ef;
        --flow-soft: #203b53;
        --accent: #c1a0ed;
        --accent-soft: #392c4d;
      }
    }
  </style>
</head>
<body>
  <main class="figure" aria-labelledby="diagram-title">
    <header class="figure__header">
      <h1 id="diagram-title">Crew против Flow</h1>
      <p>Свободный маршрут между ролями — или порядок, закреплённый в коде</p>
    </header>

    <svg id="diagram"
         viewBox="0 0 1000 430"
         width="1000"
         height="430"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Сравнение Crew и Flow</title>
      <desc id="svg-desc">
        Слева три агента Crew соединены стрелками в разных направлениях.
        Справа Flow проводит событие через researched, drafted и edited,
        причём второй шаг вызывает Crew.kickoff().
      </desc>
    </svg>

    <p id="fallback" hidden>
      Схема должна была показать Crew из трёх агентов со свободным порядком
      работы и Flow из трёх фиксированных этапов: researched → drafted →
      edited, где второй этап вызывает Crew.kickoff().
    </p>
  </main>

  <script>
    const data = {
      canvas: { w: 1000, h: 430 },
      corner: 12,
      divider: { x: 500, y1: 22, y2: 408 },
      headings: [
        { x: 250, y: 34, text: "Crew", className: "column-title" },
        {
          x: 250,
          y: 58,
          text: "маршрут рождается по ходу работы",
          className: "column-subtitle"
        },
        { x: 750, y: 34, text: "Flow", className: "column-title" },
        {
          x: 750,
          y: 58,
          text: "маршрут заранее задан связями",
          className: "column-subtitle"
        }
      ],
      cloud: [
        { x: 72, y: 82 },
        { x: 150, y: 66 },
        { x: 348, y: 66 },
        { x: 432, y: 112 },
        { x: 455, y: 292 },
        { x: 365, y: 350 },
        { x: 118, y: 346 },
        { x: 48, y: 272 },
        { x: 72, y: 82 }
      ],
      crewCards: [
        {
          x: 175, y: 88, w: 150, h: 66,
          title: "Историк", detail: "проверяет факты"
        },
        {
          x: 66, y: 260, w: 156, h: 66,
          title: "Дизайнер", detail: "ищет форму"
        },
        {
          x: 338, y: 260, w: 156, h: 66,
          title: "Куратор", detail: "собирает замысел"
        }
      ],
      crewArrows: [
        {
          start: { x: 195, y: 154 },
          control: { x: 112, y: 188 },
          end: { x: 126, y: 260 },
          head: [{ x: 126, y: 260 }, { x: 116, y: 246 }, { x: 136, y: 249 }]
        },
        {
          start: { x: 156, y: 260 },
          control: { x: 164, y: 202 },
          end: { x: 218, y: 154 },
          head: [{ x: 218, y: 154 }, { x: 199, y: 159 }, { x: 212, y: 173 }]
        },
        {
          start: { x: 305, y: 154 },
          control: { x: 390, y: 188 },
          end: { x: 404, y: 260 },
          head: [{ x: 404, y: 260 }, { x: 394, y: 246 }, { x: 414, y: 249 }]
        },
        {
          start: { x: 372, y: 260 },
          control: { x: 338, y: 200 },
          end: { x: 282, y: 154 },
          head: [{ x: 282, y: 154 }, { x: 289, y: 173 }, { x: 301, y: 158 }]
        },
        {
          start: { x: 222, y: 285 },
          control: { x: 280, y: 340 },
          end: { x: 338, y: 285 },
          head: [{ x: 338, y: 285 }, { x: 320, y: 280 }, { x: 326, y: 299 }]
        },
        {
          start: { x: 338, y: 309 },
          control: { x: 280, y: 366 },
          end: { x: 222, y: 309 },
          head: [{ x: 222, y: 309 }, { x: 240, y: 303 }, { x: 234, y: 322 }]
        }
      ],
      goal: {
        x: 143, y: 365, w: 214, h: 38,
        text: "Цель: придумать выставку"
      },
      goalArrow: {
        start: { x: 250, y: 365 },
        end: { x: 250, y: 337 },
        head: [{ x: 250, y: 337 }, { x: 241, y: 352 }, { x: 259, y: 352 }]
      },
      flowCards: [
        {
          x: 530, y: 210, w: 125, h: 68,
          title: "Исследовать", detail: "собрать материал"
        },
        {
          x: 688, y: 210, w: 125, h: 68,
          title: "Написать", detail: "получить черновик"
        },
        {
          x: 846, y: 210, w: 125, h: 68,
          title: "Редактировать", detail: "проверить итог"
        }
      ],
      flowArrows: [
        {
          start: { x: 655, y: 244 },
          end: { x: 688, y: 244 },
          head: [{ x: 688, y: 244 }, { x: 674, y: 235 }, { x: 674, y: 253 }]
        },
        {
          start: { x: 813, y: 244 },
          end: { x: 846, y: 244 },
          head: [{ x: 846, y: 244 }, { x: 832, y: 235 }, { x: 832, y: 253 }]
        }
      ],
      decorators: [
        { x: 592, y: 192, text: "@start" },
        { x: 671, y: 190, text: "@listen(researched)" },
        { x: 829, y: 190, text: "@listen(drafted)" }
      ],
      call: {
        x: 675, y: 88, w: 150, h: 42,
        text: "Crew.kickoff()"
      },
      callArrow: {
        start: { x: 750, y: 130 },
        end: { x: 750, y: 210 },
        head: [{ x: 750, y: 210 }, { x: 741, y: 195 }, { x: 759, y: 195 }]
      },
      topics: [
        { x: 530, y: 302, w: 125, h: 38, text: "researched" },
        { x: 688, y: 302, w: 125, h: 38, text: "drafted" },
        { x: 846, y: 302, w: 125, h: 38, text: "edited" }
      ],
      topicArrows: [
        {
          start: { x: 655, y: 321 },
          end: { x: 688, y: 321 },
          head: [{ x: 688, y: 321 }, { x: 674, y: 312 }, { x: 674, y: 330 }]
        },
        {
          start: { x: 813, y: 321 },
          end: { x: 846, y: 321 },
          head: [{ x: 846, y: 321 }, { x: 832, y: 312 }, { x: 832, y: 330 }]
        }
      ],
      notes: [
        {
          x: 66, y: 410,
          text: "Следующий ход зависит от промежуточного ответа",
          className: "caption-strong"
        },
        {
          x: 750, y: 380,
          text: "Свобода внутри шага; порядок шагов неизменен",
          className: "caption-strong"
        },
        {
          x: 750, y: 405,
          text: "researched → drafted → edited",
          className: "code-label"
        }
      ]
    };

    const origin = Object.freeze({ x: 0, y: 0 });
    const scale = Object.freeze({ x: 1, y: 1 });
    const labelPad = 12;

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const ns = "http://www.w3.org/2000/svg";

      const make = (name, attrs, parent = svg) => {
        const node = document.createElementNS(ns, name);
        Object.entries(attrs).forEach(([key, value]) => {
          node.setAttribute(key, String(value));
        });
        parent.appendChild(node);
        return node;
      };

      const group = className => make("g", { class: className });

      const text = (x, y, value, className, anchor = "middle", parent = svg) => {
        const node = make("text", {
          x: sx(x),
          y: sy(y),
          class: className,
          "text-anchor": anchor,
          "dominant-baseline": "middle"
        }, parent);
        node.textContent = value;
        return node;
      };

      const rect = (item, className, parent = svg) => make("rect", {
        x: sx(item.x),
        y: sy(item.y),
        width: sx(item.x + item.w) - sx(item.x),
        height: sy(item.y + item.h) - sy(item.y),
        rx: sx(data.corner) - sx(origin.x),
        ry: sy(data.corner) - sy(origin.y),
        class: className
      }, parent);

      const line = (item, className, parent = svg) => make("line", {
        x1: sx(item.start.x),
        y1: sy(item.start.y),
        x2: sx(item.end.x),
        y2: sy(item.end.y),
        class: className
      }, parent);

      const curve = (item, className, parent = svg) => make("path", {
        d: [
          "M", sx(item.start.x), sy(item.start.y),
          "Q", sx(item.control.x), sy(item.control.y),
          sx(item.end.x), sy(item.end.y)
        ].join(" "),
        class: className
      }, parent);

      const arrowHead = (points, className, parent = svg) => make("polygon", {
        points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
        class: className
      }, parent);

      const card = (item, className, parent) => {
        rect(item, className, parent);
        text(
          item.x + item.w / scale.x / (scale.x + scale.x),
          item.y + item.h / scale.y / (scale.y + scale.y) - labelPad / scale.y,
          item.title,
          "card-title",
          "middle",
          parent
        );
        text(
          item.x + item.w / scale.x / (scale.x + scale.x),
          item.y + item.h / scale.y / (scale.y + scale.y) + labelPad / scale.y,
          item.detail,
          "card-detail",
          "middle",
          parent
        );
      };

      make("rect", {
        x: sx(origin.x),
        y: sy(origin.y),
        width: sx(data.canvas.w) - sx(origin.x),
        height: sy(data.canvas.h) - sy(origin.y),
        fill: "var(--panel)"
      });

      make("line", {
        x1: sx(data.divider.x),
        y1: sy(data.divider.y1),
        x2: sx(data.divider.x),
        y2: sy(data.divider.y2),
        class: "divider"
      });

      data.headings.forEach(item => {
        text(item.x, item.y, item.text, item.className);
      });

      const crewLayer = group("crew-layer");
      const [cloudStart, ...cloudRest] = data.cloud;
      const cloudPath = [
        "M", sx(cloudStart.x), sy(cloudStart.y),
        ...cloudRest.flatMap(point => ["L", sx(point.x), sy(point.y)]),
        "Z"
      ].join(" ");
      make("path", { d: cloudPath, class: "crew-cloud" }, crewLayer);

      data.crewArrows.forEach(item => {
        curve(item, "crew-arrow", crewLayer);
        arrowHead(item.head, "crew-head", crewLayer);
      });

      data.crewCards.forEach(item => card(item, "crew-card", crewLayer));

      rect(data.goal, "goal-card", crewLayer);
      text(
        data.goal.x + data.goal.w / scale.x / (scale.x + scale.x),
        data.goal.y + data.goal.h / scale.y / (scale.y + scale.y),
        data.goal.text,
        "card-title",
        "middle",
        crewLayer
      );
      line(data.goalArrow, "crew-arrow", crewLayer);
      arrowHead(data.goalArrow.head, "crew-head", crewLayer);

      const flowLayer = group("flow-layer");
      data.flowArrows.forEach(item => {
        line(item, "flow-arrow", flowLayer);
        arrowHead(item.head, "flow-head", flowLayer);
      });

      data.flowCards.forEach(item => card(item, "flow-card", flowLayer));

      data.decorators.forEach(item => {
        text(item.x, item.y, item.text, "decorator-label");
      });

      rect(data.call, "call-card", flowLayer);
      text(
        data.call.x + data.call.w / scale.x / (scale.x + scale.x),
        data.call.y + data.call.h / scale.y / (scale.y + scale.y),
        data.call.text,
        "code-label",
        "middle",
        flowLayer
      );
      line(data.callArrow, "call-arrow", flowLayer);
      arrowHead(data.callArrow.head, "call-head", flowLayer);

      data.topicArrows.forEach(item => {
        line(item, "flow-arrow", flowLayer);
        arrowHead(item.head, "flow-head", flowLayer);
      });

      data.topics.forEach(item => {
        rect(item, "topic-card", flowLayer);
        text(
          item.x + item.w / scale.x / (scale.x + scale.x),
          item.y + item.h / scale.y / (scale.y + scale.y),
          item.text,
          "code-label",
          "middle",
          flowLayer
        );
      });

      data.notes.forEach(item => {
        text(item.x, item.y, item.text, item.className);
      });

      fallback.hidden = true;
    } catch (error) {
      const diagram = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      diagram.hidden = true;
      fallback.hidden = false;
    }
  </script>
</body>
</html>
