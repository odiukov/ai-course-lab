<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Схема: менеджер и три специалиста</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f4f7fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #526078;
      --line: #53647e;
      --manager-fill: #e3efff;
      --manager-stroke: #2367c9;
      --specialist-fill: #f7f9fc;
      --specialist-stroke: #718096;
      --context-fill: #fff4d6;
      --context-stroke: #b87512;
      --round-fill: #eef8f1;
      --round-stroke: #3d8060;
      --done-fill: #dff5e7;
      --done-stroke: #217a49;
      --accent: #175eb8;
      --done: #176f42;
      --shadow: rgba(28, 45, 75, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --panel: #182130;
        --text: #eef4ff;
        --muted: #b6c3d8;
        --line: #9aabc4;
        --manager-fill: #183b68;
        --manager-stroke: #78b4ff;
        --specialist-fill: #202c3e;
        --specialist-stroke: #91a3bd;
        --context-fill: #473718;
        --context-stroke: #e8b755;
        --round-fill: #18382d;
        --round-stroke: #78c89f;
        --done-fill: #17462f;
        --done-stroke: #6ed39b;
        --accent: #88beff;
        --done: #85dbaa;
        --shadow: rgba(0, 0, 0, 0.28);
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--text);
    }

    body {
      margin: 0;
      padding: 8px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .diagram {
      box-sizing: border-box;
      width: 100%;
      max-width: 1100px;
      max-height: 520px;
      margin: auto;
      padding: 8px;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--specialist-stroke);
      box-shadow: 0 2px 10px var(--shadow);
    }

    .diagram__title {
      margin: 0;
      padding: 2px 8px 6px;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.2;
    }

    .diagram__subtitle {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    svg {
      display: block;
      width: 100%;
      height: 462px;
      max-height: 462px;
      background: var(--panel);
    }

    .flow-line {
      fill: none;
      stroke: var(--line);
      stroke-width: 2;
      stroke-linecap: round;
    }

    .flow-head {
      fill: var(--line);
      stroke: none;
    }

    .context-line,
    .context-head {
      stroke: var(--context-stroke);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
    }

    .context-head {
      fill: var(--context-stroke);
      stroke: none;
    }

    .manager {
      fill: var(--manager-fill);
      stroke: var(--manager-stroke);
      stroke-width: 2;
    }

    .specialist {
      fill: var(--specialist-fill);
      stroke: var(--specialist-stroke);
      stroke-width: 2;
    }

    .context {
      fill: var(--context-fill);
      stroke: var(--context-stroke);
      stroke-width: 2;
    }

    .round {
      fill: var(--round-fill);
      stroke: var(--round-stroke);
      stroke-width: 1.5;
    }

    .round--done {
      fill: var(--done-fill);
      stroke: var(--done-stroke);
      stroke-width: 2;
    }

    .node-title {
      fill: var(--text);
      font-size: 15px;
      font-weight: 700;
    }

    .node-subtitle {
      fill: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .manager-title {
      fill: var(--accent);
      font-size: 17px;
      font-weight: 800;
    }

    .context-title {
      fill: var(--text);
      font-size: 14px;
      font-weight: 750;
    }

    .context-detail {
      fill: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .route-label {
      fill: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .round-title {
      fill: var(--text);
      font-size: 12px;
      font-weight: 750;
    }

    .round-detail {
      fill: var(--muted);
      font-size: 11px;
      font-weight: 500;
    }

    .done-text {
      fill: var(--done);
      font-size: 14px;
      font-weight: 850;
    }

    .fallback {
      fill: var(--text);
      font-size: 15px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <figure class="diagram" aria-labelledby="diagram-title">
    <figcaption id="diagram-title" class="diagram__title">
      Менеджер и три специалиста
      <span class="diagram__subtitle">маршрут возникает во время работы</span>
    </figcaption>

    <svg
      id="scheme"
      viewBox="0 0 960 470"
      width="960"
      height="470"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-desc"
    >
      <title id="svg-title">Менеджер-LLM выбирает следующего специалиста</title>
      <desc id="svg-desc">
        Менеджер получает весь список задач и все предыдущие результаты,
        направляет поручение исследователю, автору или редактору, принимает
        результат обратно и на четвёртом круге возвращает done.
      </desc>
    </svg>
  </figure>

  <script>
    const diagramData = [
      {
        kind: "config",
        arrowLength: 11,
        arrowHalf: 5,
        labelPadding: 10
      },
      {
        kind: "context",
        x: 0,
        y: -203,
        w: 790,
        h: 48,
        className: "context",
        lines: [
          {
            text: "Вход каждого круга",
            dy: -7,
            className: "context-title"
          },
          {
            text: "весь список задач  +  все предыдущие результаты",
            dy: 12,
            className: "context-detail"
          }
        ]
      },
      {
        kind: "node",
        id: "manager",
        x: 0,
        y: -105,
        w: 226,
        h: 76,
        className: "manager",
        lines: [
          {
            text: "МЕНЕДЖЕР-LLM",
            dy: -8,
            className: "manager-title"
          },
          {
            text: "выбирает следующий ход",
            dy: 15,
            className: "node-subtitle"
          }
        ]
      },
      {
        kind: "node",
        id: "researcher",
        x: -345,
        y: -64,
        w: 190,
        h: 74,
        className: "specialist",
        lines: [
          {
            text: "ИССЛЕДОВАТЕЛЬ",
            dy: -7,
            className: "node-title"
          },
          {
            text: "собирает факты",
            dy: 15,
            className: "node-subtitle"
          }
        ]
      },
      {
        kind: "node",
        id: "writer",
        x: 345,
        y: -64,
        w: 190,
        h: 74,
        className: "specialist",
        lines: [
          {
            text: "АВТОР",
            dy: -7,
            className: "node-title"
          },
          {
            text: "оформляет справку",
            dy: 15,
            className: "node-subtitle"
          }
        ]
      },
      {
        kind: "node",
        id: "editor",
        x: 0,
        y: 29,
        w: 190,
        h: 70,
        className: "specialist",
        lines: [
          {
            text: "РЕДАКТОР",
            dy: -7,
            className: "node-title"
          },
          {
            text: "проверяет результат",
            dy: 15,
            className: "node-subtitle"
          }
        ]
      },
      {
        kind: "arrow",
        className: "context",
        from: { x: 0, y: -179 },
        to: { x: 0, y: -143 }
      },
      {
        kind: "arrow",
        from: { x: -113, y: -120 },
        to: { x: -250, y: -88 }
      },
      {
        kind: "arrow",
        from: { x: -250, y: -47 },
        to: { x: -113, y: -88 }
      },
      {
        kind: "arrow",
        from: { x: 113, y: -120 },
        to: { x: 250, y: -88 }
      },
      {
        kind: "arrow",
        from: { x: 250, y: -47 },
        to: { x: 113, y: -88 }
      },
      {
        kind: "arrow",
        from: { x: -34, y: -67 },
        to: { x: -34, y: -6 }
      },
      {
        kind: "arrow",
        from: { x: 34, y: -6 },
        to: { x: 34, y: -67 }
      },
      {
        kind: "label",
        x: -160,
        y: -127,
        anchor: "end",
        text: "поручение",
        className: "route-label"
      },
      {
        kind: "label",
        x: -160,
        y: -51,
        anchor: "end",
        text: "результат",
        className: "route-label"
      },
      {
        kind: "label",
        x: 160,
        y: -127,
        anchor: "start",
        text: "поручение",
        className: "route-label"
      },
      {
        kind: "label",
        x: 160,
        y: -51,
        anchor: "start",
        text: "результат",
        className: "route-label"
      },
      {
        kind: "label",
        x: -49,
        y: -33,
        anchor: "end",
        text: "поручение",
        className: "route-label"
      },
      {
        kind: "label",
        x: 49,
        y: -33,
        anchor: "start",
        text: "результат",
        className: "route-label"
      },
      {
        kind: "label",
        x: 0,
        y: 86,
        anchor: "middle",
        text: "после каждого ответа управление снова у менеджера",
        className: "route-label"
      },
      {
        kind: "label",
        x: 0,
        y: 124,
        anchor: "middle",
        text: "Контекст менеджера растёт на каждом круге",
        className: "context-title"
      },
      {
        kind: "round",
        x: -337,
        y: 183,
        w: 190,
        h: 72,
        className: "round",
        lines: [
          {
            text: "первый круг",
            dy: -17,
            className: "round-title"
          },
          {
            text: "весь список задач",
            dy: 3,
            className: "round-detail"
          },
          {
            text: "результатов пока нет",
            dy: 21,
            className: "round-detail"
          }
        ]
      },
      {
        kind: "round",
        x: -112,
        y: 183,
        w: 190,
        h: 72,
        className: "round",
        lines: [
          {
            text: "второй круг",
            dy: -17,
            className: "round-title"
          },
          {
            text: "весь список задач",
            dy: 3,
            className: "round-detail"
          },
          {
            text: "предыдущий результат",
            dy: 21,
            className: "round-detail"
          }
        ]
      },
      {
        kind: "round",
        x: 112,
        y: 183,
        w: 190,
        h: 72,
        className: "round",
        lines: [
          {
            text: "третий круг",
            dy: -17,
            className: "round-title"
          },
          {
            text: "весь список задач",
            dy: 3,
            className: "round-detail"
          },
          {
            text: "все прошлые результаты",
            dy: 21,
            className: "round-detail"
          }
        ]
      },
      {
        kind: "round",
        x: 337,
        y: 183,
        w: 190,
        h: 72,
        className: "round round--done",
        lines: [
          {
            text: "четвёртый круг",
            dy: -14,
            className: "round-title"
          },
          {
            text: "done",
            dy: 14,
            className: "done-text"
          }
        ]
      },
      {
        kind: "arrow",
        from: { x: -242, y: 183 },
        to: { x: -207, y: 183 }
      },
      {
        kind: "arrow",
        from: { x: -17, y: 183 },
        to: { x: 17, y: 183 }
      },
      {
        kind: "arrow",
        from: { x: 207, y: 183 },
        to: { x: 242, y: 183 }
      }
    ];

    const origin = { x: 480, y: 240 };
    const scale = { x: 1, y: 1 };

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const svg = document.getElementById("scheme");
    const config = diagramData.find(item => item.kind === "config");
    const namespace = svg.namespaceURI;

    function makeElement(name, attributes, content) {
      const element = document.createElementNS(namespace, name);

      Object.entries(attributes).forEach(entry => {
        element.setAttribute(entry.at(), String(entry.at(-1)));
      });

      if (content !== undefined) {
        element.textContent = content;
      }

      return element;
    }

    function appendText(parent, x, y, lines, anchor) {
      const text = makeElement("text", {
        "text-anchor": anchor,
        "dominant-baseline": "middle"
      });

      lines.forEach(line => {
        const span = makeElement("tspan", {
          x: sx(x),
          y: sy(y + line.dy),
          class: line.className
        }, line.text);

        text.appendChild(span);
      });

      parent.appendChild(text);
    }

    function appendBox(parent, item) {
      const left = item.x - item.w / config.arrowHalf;
      const right = item.x + item.w / config.arrowHalf;
      const top = item.y - item.h / config.arrowHalf;
      const bottom = item.y + item.h / config.arrowHalf;

      const rect = makeElement("rect", {
        x: sx(left),
        y: sy(top),
        width: sx(right) - sx(left),
        height: sy(bottom) - sy(top),
        class: item.className
      });

      parent.appendChild(rect);
      appendText(parent, item.x, item.y, item.lines, "middle");
    }

    function appendArrow(parent, item) {
      const dx = item.to.x - item.from.x;
      const dy = item.to.y - item.from.y;
      const length = Math.hypot(dx, dy);
      const unitX = dx / length;
      const unitY = dy / length;
      const normalX = -unitY;
      const normalY = unitX;
      const baseX = item.to.x - unitX * config.arrowLength;
      const baseY = item.to.y - unitY * config.arrowLength;
      const lineClass = item.className === "context"
        ? "context-line"
        : "flow-line";
      const headClass = item.className === "context"
        ? "context-head"
        : "flow-head";

      const line = makeElement("line", {
        x1: sx(item.from.x),
        y1: sy(item.from.y),
        x2: sx(baseX),
        y2: sy(baseY),
        class: lineClass
      });

      const headPoints = [
        { x: item.to.x, y: item.to.y },
        {
          x: baseX + normalX * config.arrowHalf,
          y: baseY + normalY * config.arrowHalf
        },
        {
          x: baseX - normalX * config.arrowHalf,
          y: baseY - normalY * config.arrowHalf
        }
      ];

      const head = makeElement("polygon", {
        points: headPoints
          .map(point => `${sx(point.x)},${sy(point.y)}`)
          .join(" "),
        class: headClass
      });

      parent.appendChild(line);
      parent.appendChild(head);
    }

    function renderDiagram() {
      const arrowLayer = makeElement("g", {
        "aria-hidden": "true"
      });
      const boxLayer = makeElement("g", {
        "aria-hidden": "true"
      });
      const labelLayer = makeElement("g", {
        "aria-hidden": "true"
      });

      diagramData
        .filter(item => item.kind === "arrow")
        .forEach(item => appendArrow(arrowLayer, item));

      diagramData
        .filter(item =>
          item.kind === "node" ||
          item.kind === "context" ||
          item.kind === "round"
        )
        .forEach(item => appendBox(boxLayer, item));

      diagramData
        .filter(item => item.kind === "label")
        .forEach(item => {
          const label = makeElement("text", {
            x: sx(item.x),
            y: sy(item.y),
            class: item.className,
            "text-anchor": item.anchor,
            "dominant-baseline": "middle"
          }, item.text);

          labelLayer.appendChild(label);
        });

      svg.appendChild(arrowLayer);
      svg.appendChild(boxLayer);
      svg.appendChild(labelLayer);
    }

    function renderFallback() {
      svg.querySelectorAll("g").forEach(group => group.remove());

      const fallbackLines = [
        {
          text: "Менеджер-LLM находится в центре и выбирает",
          dy: -36,
          className: "fallback"
        },
        {
          text: "исследователя, автора или редактора.",
          dy: -12,
          className: "fallback"
        },
        {
          text: "После ответа специалиста управление возвращается менеджеру.",
          dy: 18,
          className: "fallback"
        },
        {
          text: "На каждом круге он видит задачи и прошлые результаты;",
          dy: 48,
          className: "fallback"
        },
        {
          text: "четвёртый круг возвращает done.",
          dy: 72,
          className: "fallback"
        }
      ];

      appendText(svg, 0, 0, fallbackLines, "middle");
    }

    try {
      renderDiagram();
    } catch (error) {
      renderFallback();
    }
  </script>
</body>
</html>
