- concept: consensus как процесс CrewAI зарезервирован в документации, но в публичном API не реализован
  question: Команда хочет, чтобы агенты голосовали за итоговый вариант, и видит в документации CrewAI упоминание процесса Consensus. Что верно про него на сегодня?
  explanation: 'Из трёх процессов рабочих два: Sequential (порядок объявления, дёшево и предсказуемо) и Hierarchical (агент-менеджер маршрутизирует, добавляя свой вызов LLM каждый раунд). Consensus — только запланированное имя; архитектуру, которая на него опирается, строить нельзя.'
  kind: choice
  options:
    - Имя зарезервировано под будущий процесс с голосованием, в публичном API он не реализован — закладываться на него нельзя
    - Он работает, но требует платной лицензии CrewAI Enterprise
    - 'Это синоним Hierarchical: менеджер собирает голоса специалистов и выбирает большинство'
    - Он реализован, но доступен только при включённой memory на уровне Crew
