- concept: 'порядок работы функции извлечения: приём запроса, два независимых обращения к разным хранилищам, отсев пустого, склейка одного текста'
  question: Расставь шаги функции, которая готовит контекст памяти для очередной задачи CrewAI.
  explanation: 'Два обращения независимы и опираются на разные входы: похожесть работает от текста задачи, ключевой поиск — от идентификатора сущности. Отсев пустых разделов идёт до склейки, иначе в промпт уедут пустые заголовки и съедят бюджет. При нулевом улове возвращается пустая строка, а не выдуманное содержимое.'
  kind: order
  items:
    - Принять текст задачи и необязательный ключ сущности
    - Достать из long-term хранилища ограниченное число фрагментов, ближайших по смыслу к тексту задачи
    - Запросить из entity-хранилища факты ровно по переданному ключу
    - Отбросить разделы, по которым ничего не нашлось
    - Склеить оставшееся в один размеченный по источникам текст и вернуть его
