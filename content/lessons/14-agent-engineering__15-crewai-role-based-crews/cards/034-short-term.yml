- concept: 'механика short-term внутри прогона: наблюдения накапливаются в общем буфере и подмешиваются к промпту следующей задачи автоматически, без ручного переноса'
  question: Расставь по порядку, что происходит с деталью, которую агент обнаружил по ходу выполнения задачи, при включённой short-term-памяти CrewAI.
  explanation: 'Ключ в том, что перенос происходит на этапе сборки промпта и без участия автора пайплайна: никто не копировал деталь в описание следующей задачи вручную. Отсюда и оба свойства short-term — команда перестаёт терять попутные наблюдения, но канал остаётся отбором по релевантности, а не адресной передачей.'
  kind: order
  items:
    - Агент выполняет свою задачу, найденная деталь попадает в рабочий буфер прогона
    - Стартует следующая задача, система собирает для её агента промпт
    - Из буфера отбираются записи, подходящие к текущей задаче
    - Отобранные записи добавляются к промпту, и агент видит деталь, которую сам не находил
