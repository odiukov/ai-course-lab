- concept: ручной последовательный вызов методов класса Flow воспроизводит результат, но не покрывает проверкой сам механизм диспетчеризации событий
  question: В тесте вместо kickoff() вызывают методы класса Flow подряд руками и сравнивают итог с ожидаемым. Итог совпадает. Что именно такой тест не проверяет?
  explanation: Ценность Flow — в воспроизводимом графе, а не в отдельных функциях. Тест, обходящий kickoff(), проверяет ровно то, что и так работает, и молчит про единственное место, где граф может развалиться.
  kind: open
  reference: 'Он проверяет только тела шагов как обычные функции. Вне проверки остаётся вся событийная обвязка: правильно ли расставлены подписки, действительно ли возврат одного шага доезжает до слушателя как его вход, срабатывает ли шаг вообще. Опечатка в подписке, потерянный шаг или разорванная связь дадут зелёный тест, а реальный kickoff() упадёт или вернёт не то. Тестировать нужно через kickoff(), потому что диспетчеризация — такая же часть кода, как и тела шагов.'
  id: 024-run-flow-3
  fingerprint: 1c77b0f5
