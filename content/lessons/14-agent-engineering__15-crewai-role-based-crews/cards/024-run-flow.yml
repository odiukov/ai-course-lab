- concept: kickoff возвращает результат последнего сработавшего шага цепочки, а не объект Flow и не результат стартового шага
  question: 'Flow из четырёх шагов: стартовый нормализует строку, дальше по цепочке подписчиков идут обрезка, транслитерация и хеширование. Что вернёт вызов kickoff() у экземпляра такого Flow?'
  explanation: 'kickoff() прогоняет граф и отдаёт результат финального шага. Возврат самого экземпляра — частая ошибка: маршрут собран, но данные по нему не пущены. Промежуточные значения kickoff не собирает — если они нужны, их кладут в state вручную.'
  kind: choice
  options:
    - Хеш — значение, возвращённое последним шагом цепочки
    - Нормализованную строку — значение стартового шага
    - Сам экземпляр Flow, из которого потом достают результаты
    - Список всех промежуточных значений в порядке срабатывания
  correct: 0
  id: 024-run-flow-1
  fingerprint: 790ea745
- concept: входные данные прогона Flow передаются аргументом kickoff и доступны шагам через state, а не через конструктор класса
  question: Нужно прогнать один и тот же класс Flow на пяти разных заявках. Как штатно подать заявку в конкретный прогон?
  explanation: Вход прогона идёт через kickoff(inputs=...) и попадает в state, откуда его читает стартовый шаг. Декоратор @start только помечает точку входа и полезной нагрузки не несёт. Глобальная переменная ломает изоляцию прогонов — пять заявок начнут мешать друг другу.
  kind: choice
  options:
    - Передать словарь в kickoff(inputs={...}) — значения окажутся в state прогона
    - Передать заявку в конструктор класса Flow при создании экземпляра
    - Присвоить заявку глобальной переменной модуля, стартовый шаг прочитает её оттуда
    - Передать заявку аргументом в декоратор @start
  correct: 0
