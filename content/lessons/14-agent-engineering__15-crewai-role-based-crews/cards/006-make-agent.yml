- concept: изменяемый объект в значении параметра по умолчанию создаётся один раз и разделяется всеми вызовами функции
  question: Фабрика агентов объявлена как `def make_agent(role, goal, backstory, tools=[]):` и просто передаёт `tools` в `Agent(...)`. Один из созданных агентов позже получает дополнительный инструмент через `agent.tools.append(...)`. Что произойдёт?
  explanation: 'Значение по умолчанию вычисляется один раз — в момент определения функции. Все вызовы без явного аргумента получают ссылку на ОДИН и тот же список, поэтому мутация через append протекает между агентами. Идиома: `tools=None`, а внутри `tools = tools or []` — новый список на каждый вызов.'
  kind: choice
  options:
    - Инструмент появится и у других агентов, созданных этой же фабрикой без явного списка tools
    - Python пересоздаст список при следующем вызове, поэтому остальные агенты не изменятся
    - 'Вызов упадёт с TypeError: списки нельзя использовать как значение по умолчанию'
    - CrewAI скопирует список внутри Agent, поэтому изменение затронет только одного агента
  correct: 0
  id: 006-make-agent-1
  fingerprint: 8e78d3d1
- concept: 'llm — необязательное поле Agent: без него агент работает на модели, настроенной по умолчанию'
  question: В CrewAI объект `Agent` создан с role, goal, backstory и tools, но без аргумента `llm`. Что это означает для агента?
  explanation: 'Обязательны role, goal, backstory; llm — опциональное поле. Пропуск llm — способ не хардкодить модель в каждом агенте: фабрика прокидывает её только тогда, когда конкретному агенту нужна своя (например, более дешёвая или более сильная), иначе действует общая настройка.'
  kind: choice
  options:
    - Агент будет работать на LLM по умолчанию, настроенной в окружении/конфигурации CrewAI
    - Агент не сможет обращаться к модели и будет только вызывать инструменты
    - 'Создание Agent завершится ошибкой валидации: llm — обязательное поле'
    - Агент возьмёт модель у первой задачи, в которой он указан исполнителем
  correct: 0
