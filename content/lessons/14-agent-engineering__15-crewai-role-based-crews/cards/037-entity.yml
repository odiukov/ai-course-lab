- concept: 'критерий выбора entity-памяти: цена ошибки в идентичности объекта выше цены пропущенного факта'
  question: 'Своими словами: по какому признаку решают, что нужна память с адресацией по сущности, а не извлечение по смысловой близости?'
  explanation: 'Различие лежит в форме вопроса: «что похоже по смыслу» против «что известно про этот объект». Отсюда и критерий выбора — сравнение цены ложного совпадения с ценой пропуска.'
  kind: open
  reference: 'Смотрят на цену ошибок. Извлечение по близости иногда приносит лишнее или чужое, зато редко возвращает пусто — это годится для исследовательских задач, где лишний похожий фрагмент максимум шум. Адресация по сущности либо отдаёт факты именно этого объекта, либо не отдаёт ничего. Её берут там, где спутать один объект с похожим дороже, чем не получить подсказку: условия конкретного договора, права доступа, кто согласует операцию. Срок хранения тут ни при чём — обе памяти живут между прогонами.'
  id: 037-entity-3
