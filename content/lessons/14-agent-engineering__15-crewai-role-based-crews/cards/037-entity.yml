- concept: 'устойчивый идентификатор сущности — условие работы entity-памяти: разные написания имени порождают разные ключи'
  question: 'Агент пишет факты в entity-память, используя как ключ название компании в том виде, в каком оно пришло в заявке: «Гранит-88», «ООО Гранит 88», «Granit-88». Что произойдёт с фактами этой компании?'
  explanation: Entity-память адресуется ключом, а не похожестью, и никакого сведения близких написаний не делает. Три написания = три независимые сущности. Поэтому ключом берут стабильный идентификатор (например, внутренний ID клиента), а человекочитаемое имя хранят как факт внутри сущности.
  kind: choice
  options:
    - Они разойдутся по разным сущностям, и поиск по одному написанию не увидит факты, записанные под другим
    - Память сама сведёт написания к одной сущности по близости строк
    - Все факты попадут в одну сущность, потому что ключ нормализуется провайдером эмбеддингов
    - 'Запись не пройдёт: entity-память отклоняет ключи, содержащие пробелы и латиницу'
  correct: 0
  id: 037-entity-1
  fingerprint: d1cd499b
- concept: промах по ключу в entity-памяти даёт пустой результат, тогда как поиск по похожести всегда возвращает ближайшего кандидата
  question: В entity-памяти нет записей по ключу `client_88301`. Что вернёт обращение к ней и почему это отличается от векторного поиска?
  explanation: 'Поиск по похожести ранжирует кандидатов и отдаёт лучших даже когда точного попадания нет — отсюда риск подставить чужие факты. Адресация по ключу бинарна: попал или не попал. «Не найдено» — корректный и полезный ответ, он не даёт агенту принять чужие данные за факты нужного объекта.'
  kind: choice
  options:
    - 'Ничего: ключ либо совпал, либо нет; векторный поиск в той же ситуации вернул бы факты ближайшего по смыслу клиента'
    - Факты ближайшего по написанию ключа, но с пометкой о низкой уверенности
    - Ошибку выполнения, которая прерывает задачу агента
    - Пустой результат, потому что векторный поиск в этой ситуации тоже ничего не возвращает
  correct: 0
