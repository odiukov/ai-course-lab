- concept: поиск в памяти опирается на настроенный провайдер эмбеддингов, и его замена меняет качество извлечения
  question: Почему память CrewAI неработоспособна без настроенного провайдера эмбеддингов и что меняется при замене облачного провайдера на локальную модель?
  explanation: 'Память — надстройка над векторным поиском, а не отдельная магия фреймворка. Провайдер эмбеддингов — её обязательная деталь: он задаёт и работоспособность, и качество попаданий.'
  kind: open
  reference: 'Извлечение по смысловой близости требует превратить текст в вектор — это делает провайдер эмбеддингов (по умолчанию OpenAI, заменяем). Без него нечем считать похожесть, и записи не находятся. Локальная модель убирает внешний вызов и утечку данных наружу, но качество близости определяется уже её представлениями: то, что находилось раньше, может перестать находиться. Смена провайдера на уже наполненном хранилище требует пересчёта векторов — старые и новые эмбеддинги несопоставимы.'
  id: 036-remember-2
  fingerprint: b55347d2
- concept: долговременная память лежит в векторном хранилище, бэкенд которого заменяем
  question: Где CrewAI по умолчанию держит долговременную память и насколько это жёстко зафиксировано?
  explanation: Долговременная память переживает прогон, значит нужна внешняя персистентность; поиск идёт по похожести, значит хранилище векторное. Chroma — только значение по умолчанию, его подменяют на другую векторную базу.
  kind: choice
  options:
    - В векторной базе Chroma по умолчанию, бэкенд заменяем на другой
    - В памяти процесса, поэтому хранилище исчезает вместе с прогоном
    - В файле JSON рядом с проектом, замена хранилища не предусмотрена
    - В реляционной таблице SQLite, единственном поддерживаемом варианте
  correct: 0
