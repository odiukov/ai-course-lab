- concept: при маршрутизации на LLM число вызовов модели за прогон не фиксировано, поэтому стоимость прогона нельзя назвать заранее
  question: Команда из семи агентов работает с делегированием, где следующего исполнителя выбирает модель. Финансовый отдел просит указать стоимость одного прогона в бюджете. Почему точную цифру дать нельзя?
  explanation: 'Цена за токен известна и трассировка тут ни при чём: проблема в том, что на один и тот же вход маршрутизация на LLM даёт разное число шагов и делегаций. В уроке разброс — от 11 до 40 вызовов. Бюджетируется только то, что имеет фиксированный путь исполнения, то есть Flow.'
  kind: choice
  options:
    - Провайдеры LLM не раскрывают цену за токен до выставления счёта
    - Количество вызовов модели меняется от прогона к прогону, так как путь исполнения определяется на лету
    - Токены агентов не тарифицируются, тарифицируется только время работы команды
    - Стоимость известна, но её нельзя измерить без отдельного сервиса трассировки
  correct: 1
  id: 001-problem-1
  fingerprint: a0e0e70d
- concept: в crew с маршрутизацией на LLM порядок исполнения выбирается моделью в рантайме, а не задан кодом
  question: Что конкретно означает «маршрутизация на LLM» в многоагентной команде?
  explanation: 'Маршрутизация на LLM — это делегирование решения «кто следующий» самой модели в рантайме. Отсюда и следствие: порядок шагов не зафиксирован в коде, значит один вход даёт разные траектории. В Flow этот выбор возвращается в код и становится детерминированным.'
  kind: choice
  options:
    - Запросы агентов распределяются между несколькими моделями-провайдерами для балансировки нагрузки
    - Модель на каждом шаге сама решает, какому агенту передать работу дальше, исходя из текущего состояния
    - Порядок агентов задаётся конфигурационным файлом, который модель читает перед стартом
    - Модель переписывает промпты агентов перед каждым вызовом, сохраняя фиксированный порядок
  correct: 1
  id: 001-problem-2
  fingerprint: 0ba88072
- concept: воспроизводимость прогона — общее требование за запросами на отладку бага, бюджетирование и разбор инцидента
  question: Клиент просит повторить вчерашний прогон, финансы просят цену прогона, дежурный инженер разбирает зависший инцидент. Какое одно свойство системы закрывает все три запроса и почему автономная команда его не даёт?
  explanation: 'Разные роли задают три разных вопроса, но упираются в одну стену. Отсюда позиция CrewAI: Crew — для исследовательской совместной работы, Flow — для событийного, кодом описанного, проверяемого продакшена.'
  kind: open
  reference: 'Все три запроса требуют воспроизводимости: один и тот же вход должен давать один и тот же порядок шагов. Повторение прогона нужно клиенту для воспроизведения бага, повторение счёта — финансам, повторение порядка шагов — дежурному, чтобы иметь эталон для сравнения с аварийным прогоном. Команда с маршрутизацией на LLM выбирает путь в рантайме, поэтому траектория и число вызовов меняются от запуска к запуску, и ни один из трёх ответов не получается. Flow описывает порядок кодом и потому воспроизводим и тестируем.'
  id: 001-problem-3
  fingerprint: 6e8686c2
