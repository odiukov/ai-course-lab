- concept: одиночный агентный цикл дешевле обслужить голым циклом с реестром инструментов, чем ролевым фреймворком
  question: Помощник получает запрос, выбирает один из 60 инструментов, вызывает его и проверяет результат — всё это делает один агент. Инженер предлагает разложить работу на роли «исследователь», «исполнитель» и «контролёр» внутри CrewAI. Что не так с предложением?
  explanation: 'Роли оправданы, когда есть содержательная работа, которую они разделяют. Если её нет, каждый «специалист» добавляет свой промпт с легендой и передачу результата — стоимость фреймворка превышает стоимость самой задачи. Число инструментов роли не требует: инструменты подключаются к агенту через tools независимо от того, сколько агентов в системе.'
  kind: choice
  options:
    - Ролевая рамка тут не разделяет работу, а превращает один короткий цикл в несколько обменов с моделью; достаточно агентного цикла и реестра инструментов
    - Такое разделение допустимо только при иерархическом процессе, а при последовательном роли конфликтуют за инструменты
    - 'Проблема в числе инструментов: 60 штук не помещаются в описание одного агента, поэтому роли нужны, но их должно быть больше'
