- concept: бюджет задержки в десятки миллисекунд несовместим с ролевой командой, потому что латентность растёт и от лишних вызовов модели, и от раздувания каждого промпта
  question: Сервис обязан отвечать за 80 миллисекунд. Объясни своими словами, почему ролевая команда CrewAI не укладывается в такой бюджет — и почему переход с иерархического процесса на последовательный проблему не решает.
  explanation: 'Латентность ролевой команды складывается из двух источников: число обращений к модели (менеджер добавляет их сверх предметных задач) и размер каждого обращения (легенды агентов плюс предыдущие результаты). Смена процесса убирает только первый источник.'
  kind: open
  reference: 'Иерархический процесс вставляет отдельные вызовы управляющего агента между шагами: каждый выбор исполнителя — это лишний круг по сети и лишняя генерация. Последовательный процесс эти круги убирает, но остаётся сериализация: каждая задача ждёт завершения предыдущего вызова модели, а один вызов модели уже сопоставим со всем бюджетом в 80 мс. Плюс в каждый промпт вкладываются описания ролей агента и накопленные результаты предыдущих задач — длинный вход сам по себе увеличивает время ответа. Итог: даже аккуратно собранная команда слишком тяжела для долей секунды, такой участок пишут кодом или отдают графовому оркестратору с минимумом обращений к модели.'
