- concept: служебный промпт менеджера в Hierarchical генерируется фреймворком и не лежит в коде проекта, поэтому судить о маршрутизации нужно по выгруженному фактическому промпту и трассе
  question: В иерархической команде менеджер стал отдавать задачи не тем специалистам. В репозитории текста инструкции менеджера нет — его никто не писал. Как получить основание для разбора?
  explanation: 'Управляющий промпт неявный: фреймворк собирает его сам из ролей, целей и списка задач, поэтому в проекте его текста нет. Он всё равно наблюдаем — verbose-выгрузка показывает то, что реально ушло в модель. Смена конфигурации, ролей или версии библиотеки сдвигает этот текст без единой правки вашего кода, и именно поэтому судить надо по наблюдаемому прогону, а не по предполагаемой схеме.'
  kind: choice
  options:
    - Включить подробный режим логирования и выгрузить фактический промпт менеджера с трассой вызовов — промпт собирает сам фреймворк из конфигурации
    - Дописать менеджера вручную в список agents, тогда его инструкция появится в коде
    - Перевести команду на последовательный процесс — иначе прочитать решение менеджера невозможно в принципе
    - 'Понизить температуру управляющей модели: без чтения промпта маршрутизация всё равно неанализируема'
  correct: 0
