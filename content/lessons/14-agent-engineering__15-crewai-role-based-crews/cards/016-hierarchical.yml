- concept: вызов менеджера — самый тяжёлый промпт прогона, потому что тащит весь список задач и все накопленные результаты
  question: Команда перевела конвейер с последовательного процесса на иерархический и увидела рост расхода токенов сильно больше, чем на один лишний вызов модели за раунд. Объясни, откуда берётся такой рост.
  explanation: 'Иерархический процесс добавляет вызов менеджера поверх каждого вызова специалиста, но основной налог — объём промпта менеджера: список задач плюс все предыдущие результаты. Отсюда оценка «расход может утроиться». Платить за это стоит только там, где маршрут действительно зависит от полученного результата.'
  kind: open
  reference: Дело не только в числе вызовов, а в их размере. Чтобы выбрать следующего исполнителя, менеджер должен видеть список доступных задач и все уже собранные результаты — значит каждый его вызов несёт самый жирный промпт в прогоне, и он растёт с каждым завершённым шагом. Специалист получает узкий промпт своей задачи, а менеджер — накопленный контекст целиком, поэтому суммарный расход поднимается кратно, а не на один вызов.
  id: 016-hierarchical-2
  fingerprint: f819155e
