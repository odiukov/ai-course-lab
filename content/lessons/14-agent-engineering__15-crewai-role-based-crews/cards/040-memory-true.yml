- concept: накладные расходы памяти в токенах умножаются на число задач прогона, потому что подмешивание идёт в каждый промпт
  question: Команда выполняет 6 задач за прогон. Для каждой задачи память подмешивает в промпт 4 фрагмента, в среднем по 180 токенов. Сколько дополнительных входных токенов даёт память за один прогон?
  explanation: '6 × 4 × 180 = 4320. Подбор фрагментов делается при подготовке входа каждой задачи, поэтому стоимость памяти масштабируется числом задач, а не платится один раз за прогон. Отсюда и практический рычаг: ограничивать число и размер подмешиваемых фрагментов, а не только объём хранилища.'
  kind: numeric
  answer: 4320
  tolerance: 1
