- concept: извлечённый фрагмент попадает в промпт неотличимо от достоверного входа, поэтому память несёт риск качества, а не только расходы
  question: Кроме денег, задержки и места в хранилище, включение памяти добавляет риск для качества ответов. Объясни своими словами, в чём он состоит и почему модель не отфильтрует такой случай сама.
  explanation: 'Ошибка памяти тихая: она не падает с исключением, а подменяет контекст. Поэтому память — обмен (меньше повторных объяснений в следующих задачах ценой инфраструктуры, времени, токенов и контроля качества воспоминаний), а не бесплатное улучшение.'
  kind: open
  reference: 'Поиск возвращает похожие, а не обязательно верные и актуальные записи: может вытащить фрагмент из старого прогона, где условия уже изменились, или просто нерелевантный кусок. В промпте он выглядит так же, как достоверный вход задачи — метки «это может быть устаревшим» у него нет. Модель принимает его за полезный контекст и строит на нём ответ. Отсюда требования: следить за свежестью и чисткой хранилища, ограничивать число подмешиваемых фрагментов и не полагаться на память там, где нужен гарантированный вход.'
