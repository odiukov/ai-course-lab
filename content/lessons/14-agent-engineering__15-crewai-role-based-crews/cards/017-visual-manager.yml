- concept: 'условие завершения прогона: в sequential — исчерпание списка задач, в hierarchical — решение менеджера'
  question: Чем определяется момент окончания прогона в sequential-процессе и чем — в hierarchical? Объясни своими словами.
  explanation: 'Разница в том, кто держит критерий остановки: код (позиция в списке) или LLM-менеджер. Отсюда и практические следствия — в hierarchical нужен ограничитель на число раундов, иначе менеджер может гонять работу по кругу.'
  kind: open
  reference: 'В sequential условие завершения структурное: задачи выполняются по порядку списка tasks, и прогон кончается, когда список исчерпан. Число шагов известно до запуска. В hierarchical завершение — решение агента-менеджера: после каждого результата он либо назначает следующую задачу (в том числе повторно тому же специалисту), либо объявляет работу законченной. Поэтому длина прогона не выводится из конфигурации.'
