- concept: порядок одного раунда иерархического процесса
  question: Расставь шаги одного раунда hierarchical-процесса в CrewAI по порядку.
  explanation: 'Раунд иерархического процесса — это цикл «менеджер выбирает, специалист делает, менеджер оценивает». Каждый раунд стоит двух вызовов LLM вместо одного: отсюда и разница в расходе токенов по сравнению с sequential.'
  kind: order
  items:
    - Менеджеру подаётся запрос вместе с текущим состоянием работы и накопленными результатами
    - Менеджер выбирает, какому специалисту отдать следующую задачу
    - Выбранный специалист выполняет задачу и возвращает результат
    - 'Результат приходит менеджеру, и тот решает: назначить следующую задачу или завершить прогон'
  id: 017-visual-manager-3
