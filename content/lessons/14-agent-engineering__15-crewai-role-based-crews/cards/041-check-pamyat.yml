- concept: 'срок полезности сведения решает, писать ли его в межпрогонные хранилища: одноразовое в long-term превращается в шум при извлечении'
  question: 'Агент по ходу прогона выдаёт много промежуточных заметок: «пробую формулировку запроса номер два», «страница вернула 503, повторяю». Почему такие записи не стоит складывать в long-term-память, и что произойдёт, если складывать?'
  explanation: Short-term стирается по концу прогона — ровно то поведение, которое нужно для служебных заметок. Всё, что попало в long-term, живёт дальше и участвует в каждом поиске по похожести, поэтому качество извлечения падает пропорционально объёму записанного мусора.
  kind: open
  reference: 'Полезность этих заметок кончается вместе с прогоном, для него хватает short-term-буфера. Long-term ищет по смысловой похожести и всегда возвращает ближайших кандидатов, поэтому одноразовый мусор начнёт всплывать в извлечении будущих прогонов: он вытесняет из выдачи действительно нужные фрагменты, попадает в промпт неотличимо от достоверного входа и одновременно тратит вызовы провайдера эмбеддингов на запись и на поиск. Правило: в межпрогонные хранилища идёт то, что сохранит ценность после завершения прогона — итоги, выводы, факты о сущностях.'
  id: 041-check-pamyat-2
  fingerprint: 600e14c5
