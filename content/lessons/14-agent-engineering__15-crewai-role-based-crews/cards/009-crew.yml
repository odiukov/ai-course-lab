- concept: manager_llm — поле Crew, задающее модель управляющего для процессов с менеджером
  question: Команда из пяти специалистов запускается под процессом с управляющим агентом. Каким полем Crew задаётся модель этого управляющего?
  explanation: 'manager_llm — опциональная настройка Crew, нужная там, где процессу требуется управляющий (Hierarchical). Для Sequential она бессмысленна: там маршрут никто не выбирает.'
