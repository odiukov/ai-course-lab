- concept: при последовательном процессе порядок исполнения задаётся позицией задачи в списке tasks
  question: Crew собран с последовательным процессом, в списке tasks лежат пять задач. Что определяет, какая задача выполнится первой?
  explanation: 'В Sequential порядок задан кодом: Crew идёт по списку tasks сверху вниз. Список agents на очерёдность не влияет — задачи сами ссылаются на своих агентов. Выбор порядка моделью — свойство процессов с маршрутизацией, а не последовательного.'
  kind: choice
  options:
    - Позиция задачи в списке tasks
    - Порядок агентов в списке agents
    - Модель, которая в рантайме оценивает, с чего выгоднее начать
    - 'Длина поля expected_output: короткие контракты берутся раньше'
