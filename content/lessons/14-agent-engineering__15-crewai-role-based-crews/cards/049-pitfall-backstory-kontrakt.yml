- concept: backstory выбирают эмпирическим сравнением вариантов на одинаковом наборе входов, после чего фиксируют как версионируемую часть конфигурации
  question: Команда готовит агента-аудитора и написала четыре кандидатных backstory. Расставь шаги процедуры выбора в правильном порядке.
  explanation: 'Выбор «на слух» ненадёжен: разные легенды при одинаковых role, goal и description дают разные решения. Единственный корректный способ сравнить — одинаковые входы и одна изменяемая переменная. После выбора формулировка становится частью поведения: безобидная редакторская правка меняет результат, хотя задача формально прежняя, поэтому её прогоняют заново.'
  kind: order
  items:
    - Зафиксировать общий набор тестовых входов, одинаковый для всех кандидатов
    - Прогнать каждый вариант backstory на этом наборе, остальные поля агента и задачи не меняя
    - Сравнить результаты прогонов между вариантами и оценить разброс
    - Выбрать один вариант и заморозить его как версионируемую часть конфигурации
    - Любую последующую правку формулировки проводить как изменение поведения, с повторным прогоном на том же наборе
  id: 049-pitfall-backstory-kontrakt-1
  fingerprint: 0760322c
- concept: без expected_output сбой не останавливает прогон, а смещает точку проявления вниз по цепочке относительно места возникновения
  question: В Crew задача проверки счёта оставлена без expected_output и вернула свободный абзац «счёт можно оплатить». Следующая задача рассчитывала на сумму, список расхождений и уровень риска. Что произойдёт при прогоне?
  explanation: Отсутствие expected_output — это отсутствие требования к форме, а не запрет на передачу. Результат уходит дальше, и потребитель работает с тем, что пришло. Поэтому симптом всплывает не в задаче, где данные потеряны, а ниже по потоку, и локализация сбоя стоит дороже, чем сам сбой.
  kind: choice
  options:
    - 'Crew остановит прогон на задаче-источнике: без контракта результат не пройдёт проверку'
    - Прогон продолжится, абзац уйдёт дальше как есть, а признаки поломки появятся на нижестоящей задаче, которая начнёт домысливать недостающие поля
    - Нижестоящая задача получит пустой context, потому что результат без контракта не передаётся
    - CrewAI подставит значения по умолчанию для отсутствующих полей и пометит результат как неполный
  correct: 1
  id: 049-pitfall-backstory-kontrakt-2
  fingerprint: '54307e18'
- concept: контракт на результат задачи не повышает достоверность ответа, но делает основание решения восстановимым постфактум
  question: 'Команда возражает: expected_output не заставляет модель отвечать правильнее, значит на него можно не тратить время. Объясни своими словами, что именно теряется без контракта на каждую задачу.'
  explanation: 'Разделение двух свойств: достоверность (что написано) и проверяемость (в какой форме написано). Контракт отвечает только за второе, и этого достаточно, чтобы отличить «команда отработала» от «можно доказать, что именно она проверила».'
  kind: open
  reference: 'Верно, что контракт не гарантирует правильность содержания — он задаёт форму результата. Но именно форма делает результат проверяемым: можно убедиться, что задача вернула сумму, перечень расхождений и уровень риска, а не убедительный текст без них. Без контракта команда выглядит исправной ровно до момента, когда нужно восстановить, на каком основании принято решение: в журнале лежит свободная проза, сопоставить её с требуемыми полями нельзя. Итог — прогон работает, аудит проваливается. Поэтому expected_output трактуют как обязательную границу между задачами, а не как опциональное украшение.'
  id: 049-pitfall-backstory-kontrakt-3
  fingerprint: cd9c3c60
