- concept: агенты обмениваются только результатами задач, прямой связи агент-агент в CrewAI нет
  question: В CrewAI агент-исследователь отработал, следом идёт агент-автор. Как рассуждения исследователя доходят до автора?
  explanation: 'Agent не видит другого Agent. Связь идёт через Task: задача возвращает результат, следующая задача получает его как вход (через порядок или через context). Поэтому «мысли» агента не передаются — передаётся только выданный им артефакт.'
  kind: choice
  options:
    - Автор получает только строку-результат задачи исследователя, переданную в его задачу как вход
    - Агенты обмениваются сообщениями напрямую через встроенный канал между Agent-объектами
    - Автор читает внутренний scratchpad исследователя из общей памяти агента
    - Crew транслирует всем агентам полный лог рассуждений каждого участника
  correct: 0
  id: 004-chetyre-primitiva-1
  fingerprint: 7872268e
- concept: поле context у Task перечисляет вышестоящие задачи, чьи результаты подаются на вход
  question: Задача редактора должна получить результаты задач исследователя и автора. Какое поле Task это объявляет?
  explanation: '`context` — список вышестоящих задач, чьи выводы передаются внутрь. Это штатный способ протянуть зависимость, отдельный от `agent` (кто делает) и от порядка задач в Crew.'
  kind: cloze
  template: edit_task = Task(description=..., expected_output=..., agent=editor, ___=[research_task, write_task])
  answer: context
  accept:
    - context
    - context=
  id: 004-chetyre-primitiva-2
