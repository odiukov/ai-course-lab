- concept: expected_output и output_pydantic задают контракт на форму результата задачи, а не на личность исполнителя
  question: Задача возвращает по сути верный текст, но каждый прогон — свободной прозой, тогда как дальше нужен объект с фиксированными полями. Что чинить в первую очередь?
  explanation: Форма результата — контракт задачи. `expected_output` описывает, что должно вернуться, а `output_pydantic` заставляет вывод принять заданную схему. Легенда влияет на тон и суждения, но не гарантирует структуру.
  kind: choice
  options:
    - backstory агента — прописать в легенде любовь к структурным ответам
    - expected_output задачи, а для жёсткой формы — output_pydantic
    - process у Crew — переключить стратегию выполнения
    - список agents у Crew — добавить второго исполнителя-форматтера
  correct: 1
  id: 004-chetyre-primitiva-3
  fingerprint: '51095e18'
