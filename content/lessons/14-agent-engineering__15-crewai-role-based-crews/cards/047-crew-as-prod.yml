- concept: 'процедура разбора плохого прогона опирается на фиксированные границы шагов: повтор условий, локализация шага, точечная замена, сравнение'
  question: Продакшен-конвейер собран как Flow с командой агентов внутри одного шага. Пришла жалоба на результат. Расставь действия дежурного по порядку.
  explanation: 'Ценность обёртки не в том, что модель становится детерминированной, а в том, что у процесса появляются адресуемые границы. Условия повторяемы, шаг локализуем, правка точечная, сравнение честное — меняли одну клетку. В свободной команде ни один из этих четырёх шагов не выполним: непонятно, что повторять и что именно менять.'
  kind: order
  items:
    - Взять сохранённый вход прогона и подать его в тот же Flow, воспроизводя те же условия
    - Пройти по фиксированным этапам маршрута и найти шаг, на котором результат расходится с ожидаемым
    - Изменить только этот шаг — промпт, схему результата или состав команды внутри него
    - Повторно прогнать тот же вход и сравнить новый результат с прежним, остальной маршрут не трогая
