- concept: 'число вызовов инструмента внутри Crew не выводится из числа задач: повтор вызова решает модель'
  question: Агенту в Crew дан инструмент `refund_payment`, и в конфигурации ровно одна задача на возврат средств. Что можно утверждать о числе фактических обращений к платёжному API за прогон?
  explanation: 'Задача задаёт поручение, а не число обращений к инструменту. Внутри задачи агент крутит цикл «рассуждение — вызов инструмента — наблюдение» столько раз, сколько модель посчитает нужным: неясный ответ, таймаут или желание перепроверить дают второй вызов. Для чтения это безобидно, для возврата денег — нет.'
  kind: choice
  options:
    - 'Ровно одно: одна задача — один вызов инструмента'
    - Не больше одного на агента, то есть максимум столько вызовов, сколько агентов в команде
    - 'Заранее неизвестно: агент может повторить вызов, если сочтёт ответ неубедительным или получит ошибку'
    - 'Ровно два: фреймворк всегда делает контрольный повтор для подтверждения результата'
  correct: 2
  id: 051-tool-side-effects-1
  fingerprint: b56b2a92
- concept: критерий размещения вызова — обратимость операции, а не её сложность или важность
  question: Какой признак операции решает, можно ли отдать её агенту как инструмент внутри Crew?
  explanation: Лишний вызов — не исключение, а нормальное поведение LLM-цикла, поэтому вопрос не «случится ли повтор», а «во что он обойдётся». Идемпотентное чтение переживает повтор без последствий; DELETE, POST и платёж меняют внешний мир на каждом обращении. Цена и латентность к этому критерию отношения не имеют.
  kind: choice
  options:
    - 'Обратимость: повторный вызов безопасен (поиск, чтение) — можно; необратимый эффект (POST, DELETE, списание средств) — нужно вынести в шаг Flow'
    - 'Стоимость вызова: дешёвые API можно отдавать агенту, дорогие — нет'
    - 'Число аргументов: инструменты с одним-двумя параметрами агент вызывает надёжнее'
    - 'Скорость ответа внешней системы: быстрые вызовы безопасны, медленные приводят к повторам'
  correct: 0
  id: 051-tool-side-effects-2
  fingerprint: 88772dee
- concept: 'разделение ответственности: Crew готовит параметры операции, шаг Flow валидирует и совершает необратимый вызов, обвязка живёт вокруг шага'
  question: 'Отмена ошибочного заказа: расставьте этапы конвейера, в котором необратимый вызов вынесен из Crew в Flow.'
  explanation: Crew рассуждает о действии, Flow отвечает за момент совершения. Подготовка и суждение остаются на стороне модели, а решение «выполнять ли ещё раз» уходит в код. Защита от повторов, журналирование и ручное подтверждение располагаются вокруг шага Flow — внутри инструмента агента они не помогут, потому что сам инструмент вызывается по решению модели.
  kind: order
  items:
    - Crew проверяет данные заказа, находит противоречия и собирает параметры операции отмены
    - 'Crew возвращает структурированный результат: идентификатор заказа, сумма, основание'
    - Шаг Flow валидирует формат и значения полученных полей
    - Шаг Flow проверяет ключ идемпотентности по журналу выполненных операций
    - Шаг Flow вызывает внешнюю систему ровно один раз и сохраняет её ответ
  id: 051-tool-side-effects-3
  fingerprint: 613ef97f
