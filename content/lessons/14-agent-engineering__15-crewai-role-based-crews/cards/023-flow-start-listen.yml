- concept: имя темы решает, каких слушателей запустить, а полезная нагрузка события — с чем им работать
  question: Во Flow шаг публикует событие с темой "shipment_booked" и передаёт вместе с ним словарь с трек-номером и складом. Как Flow использует эти две части?
  explanation: 'Тема — метка канала, по ней решается маршрутизация: кого запускать. Содержимое события в маршрутизации не участвует, оно попадает уже внутрь запущенного шага и отвечает на вопрос «с чем работать». Смешивать их вредно: если условие запуска зависит от данных, его пишут в теле шага или разводят на разные темы, а не ждут, что Flow заглянет в payload.'
  kind: choice
  options:
    - По теме выбираются шаги, которые будут запущены; переданный словарь достаётся запущенному шагу как входные данные
    - По словарю Flow выбирает подходящий шаг, а тема пишется только в журнал прогона
    - 'И тема, и словарь сравниваются с сигнатурой каждого шага: запускается тот, у кого совпали оба'
    - Тема задаёт очередь исполнения слушателей, а словарь определяет, сколько раз каждый из них повторится
  correct: 0
  id: 023-flow-start-listen-1
  fingerprint: 120ce794
- concept: одна опубликованная тема запускает всех подписанных на неё слушателей, а не только одного
  question: Во Flow на тему "order_paid" подписаны четыре шага. Шаг публикует эту тему один раз. Что произойдёт?
  explanation: 'Публикация темы — широковещательное событие. Все шаги с @listen на эту тему подходят под условие и запускаются. Это и есть штатный способ развести работу параллельно: чек и упаковка подписываются на одну тему оплаты, вместо того чтобы шаг оплаты вызывал обе функции сам.'
  kind: choice
  options:
    - Запустится только первый по объявлению слушатель, остальные будут пропущены
    - Запустятся все четыре слушателя — тема адресована не конкретной функции, а всем подписчикам
    - Flow потребует явно указать в публикации, кому из четырёх адресовано событие
    - Запустится случайный слушатель, выбранный моделью на основании данных события
  correct: 1
  id: 023-flow-start-listen-2
  fingerprint: 668c62e4
- concept: публикующий шаг не ссылается на имена слушателей, поэтому нового потребителя добавляют, не трогая источник события
  question: Объясни своими словами, что даёт разработчику то, что публикующий шаг Flow называет тему, а не имена функций-получателей. Опиши на примере добавления пятого потребителя события об оплате.
  explanation: 'Ключевое — направление зависимости: получатель зависит от темы, а источник не зависит ни от кого. Именно поэтому маршрут остаётся проверяемым по частям: отдельно тестируешь, что вход публикует нужную тему, и отдельно — что каждый слушатель на неё реагирует.'
  kind: open
  reference: 'Публикующий шаг знает только строку темы, зависимости от получателей у него нет. Чтобы добавить пятого потребителя (например, отправку в бухгалтерию), достаточно написать новый шаг с @listen на ту же тему — код шага оплаты не меняется и не перевыкатывается. Обратная сторона того же свойства: связи не видны в теле функции, поэтому граф читают по набору тем и подписок, а не по цепочке вызовов; опечатка в имени темы даёт молча не сработавшего слушателя, а не ошибку импорта.'
  id: 023-flow-start-listen-3
  fingerprint: 70ce1122
