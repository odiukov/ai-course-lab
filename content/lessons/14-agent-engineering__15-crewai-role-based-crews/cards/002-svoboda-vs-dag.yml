- concept: детерминизм даёт смена формы на кодом заданный порядок, а не подкрутка параметров LLM-маршрутизации
  question: 'Участок с маршрутизацией на LLM должен стать воспроизводимым: одинаковый вход — одинаковый порядок шагов. Что действительно решает задачу?'
  explanation: 'Первые три — подкрутки: они сужают разброс, но решение «кому передать дальше» остаётся за моделью, а провайдеры не гарантируют побитовую повторяемость даже при temperature 0 и seed. Потолок итераций ограничивает счёт, но не фиксирует маршрут. Воспроизводимость — свойство формы: её даёт Flow, где последовательность владеется кодом, а не выводом модели.'
  kind: choice
  options:
    - Выставить temperature 0 у модели-маршрутизатора
    - Ограничить участок потолком в 8 итераций
    - Зафиксировать seed запроса к провайдеру
    - Перенести участок на Flow, где порядок шагов задан кодом
  correct: 3
