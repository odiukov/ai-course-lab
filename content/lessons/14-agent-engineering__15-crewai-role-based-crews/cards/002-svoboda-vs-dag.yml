- concept: вариативность исследовательской команды — рабочее свойство формы, а не дефект, который чинят настройкой
  question: 'Инженер завёл тикет: «crew с маршрутизацией на LLM выдаёт разные планы на один и тот же запрос — починить». Объясни своими словами, почему формулировка тикета неверна и что стоит сделать вместо «починки».'
  explanation: 'CrewAI не делает вид, что свобода искать и повторяемость совместимы: он честно разводит Crews и Flows. Тикет вида «убрать вариативность у crew» просит превратить одну форму в другую подкруткой параметров. Верный ответ на такой тикет — не патч, а решение по участку: исследование остаётся Crew, продакшен-путь переезжает во Flow.'
  kind: open
  reference: 'Разные траектории на одном входе — не поломка, а рабочее свойство исследовательской формы: crew каждый раз ищет заново, и ровно поэтому находит ходы, которых не было в плане. На брейнсторме это польза, а не баг. Ошибка тикета в том, что от одной конструкции требуют сразу двух несовместимых вещей: свободы искать и одинакового результата на одинаковом входе. Компромисс не устраняется настройкой — это выбор формы. Правильное действие: решить, что нужно на этом участке. Нужна находка — оставить Crew и принять разброс по маршруту, времени и стоимости. Нужен предсказуемый прогон — переписать участок как Flow, где порядок шагов задан кодом и проверяется тестами.'
  id: 002-svoboda-vs-dag-3
  fingerprint: '29792181'
