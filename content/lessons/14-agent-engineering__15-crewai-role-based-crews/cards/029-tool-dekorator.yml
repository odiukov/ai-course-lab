- concept: имена и аннотации типов в сигнатуре функции под @tool становятся схемой аргументов инструмента
  question: 'Функцию под декоратором `@tool` переписали: было `def convert(amount: float, currency: str)`, стало `def convert(x, y)`. Тело функции не изменилось. Что именно потеряла модель?'
  explanation: Сигнатура — это схема входа инструмента. Имена аргументов сообщают, какие параметры существуют, аннотации — значения какого типа туда класть. `x` и `y` без типов оставляют модель без ориентиров, и она начнёт подставлять что попало (например, строку «сто евро» вместо числа). Назначение инструмента идёт из докстринга, не из сигнатуры; вызов при этом технически возможен.
  kind: choice
  options:
    - 'Схему входа: пропали осмысленные имена аргументов и типы значений, которые в них передавать'
    - Описание назначения инструмента — оно берётся из сигнатуры
    - 'Возможность вызвать инструмент: без аннотаций декоратор не регистрирует функцию'
    - Право выбрать инструмент — выбор идёт по числу аргументов
  correct: 0
  id: 029-tool-dekorator-1
  fingerprint: 1299595c
- concept: 'два контракта инструмента: докстринг и имя отвечают за выбор инструмента, сигнатура — за форму аргументов'
  question: У агента 6 инструментов. Он ни разу не обращается к инструменту пересчёта валют, хотя задача требует пересчёта. Что чинить в первую очередь?
  explanation: Проблема выбора и проблема аргументов лежат в разных контрактах. Название и докстринг отвечают на вопрос «зачем вызывать» — по ним модель решает, подходит ли инструмент. Сигнатура отвечает на «с какими данными» — к ней идут, когда инструмент выбран верно, но аргументы приходят кривые. Тело функции модель не видит вообще.
  kind: choice
  options:
    - Аннотации типов в сигнатуре функции
    - Название в `@tool(...)` и докстринг функции
    - Тело функции, которое выполняет пересчёт
    - Порядок аргументов в объявлении функции
  correct: 1
  id: 029-tool-dekorator-2
  fingerprint: 5b4bc917
- concept: докстринг функции под @tool служит описанием инструмента, которое читает модель при выборе
  question: Функция превращена в инструмент декоратором `@tool`. Тело функции подробно закомментировано, а докстринга нет вовсе. Объясни своими словами, почему это ломает работу агента.
  explanation: 'Граница видимости проходит по объявлению функции: наружу для модели идут название, сигнатура и докстринг, внутрь — реализация. Поэтому докстринг пишут как описание для читателя-модели, а не как заметку для разработчика.'
  kind: open
  reference: 'Модель не читает тело функции и комментарии внутри неё — ей достаётся только то, что декоратор выставляет наружу: название из `@tool(...)`, сигнатура и докстринг. Докстринг — это описание инструмента, по которому модель решает, подходит ли он для текущей задачи. Без него у агента остаётся лишь имя и список аргументов, и он либо пропустит нужный инструмент, либо возьмёт его невпопад. Комментарии в теле никак не компенсируют пропуск: реализация считает результат, но не объясняет, когда функцию выбирать.'
  id: 029-tool-dekorator-3
  fingerprint: 92d9253f
