- concept: отбор фрагментов памяти выполняется при подготовке входа задачи, до запроса к модели, а не по инициативе модели в середине генерации
  question: Про контекстную память CrewAI говорят, что она «достаёт нужное тогда, когда это понадобилось». Объясни своими словами, в какой момент прогона реально происходит извлечение и почему это не значит, что модель сама лезет в хранилище посреди ответа.
  explanation: Ключ — различать «избирательно под задачу» и «по инициативе модели». Контекстное извлечение работает до вызова модели, поэтому его результат детерминирован входом задачи и его можно посмотреть в собранном промпте. Если нужен доступ к данным именно по ходу рассуждения, это делают инструментом (tool), а не памятью.
  kind: open
  reference: 'Извлечение происходит на этапе сборки промпта задачи: система берёт содержание задачи, ищет по нему подходящие фрагменты в хранилищах памяти и дописывает их к инструкциям — и только после этого уходит запрос к модели. «Когда понадобилось» означает «под конкретную задачу, а не загружено заранее целиком», а не «по требованию модели в ходе генерации». Модель получает уже готовый вход и не прерывает генерацию ради обращения к памяти; поход в хранилище по решению модели — это отдельный механизм, инструмент, а не контекстная память.'
  id: 038-contextual-2
