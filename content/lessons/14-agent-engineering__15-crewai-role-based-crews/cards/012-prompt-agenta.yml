- concept: при неизменном description смена агента меняет результат, потому что позиция исполнителя входит в тот же промпт
  question: 'Одну и ту же задачу с текстом «Проверь квартальный отчёт» вешают на трёх разных агентов: аудитора, юриста и специалиста по коммуникациям. Текст задачи не меняется. Объясни, почему результаты будут разными.'
  explanation: 'Замена агента меняет способ рассуждения над тем же поручением; замена задачи направляет того же специалиста на другую работу. Отсюда практическое следствие: если вывод систематически смотрит «не туда», чинить надо агента, а не переписывать description.'
  kind: open
  reference: 'Описание задачи не единственное, что попадает в запрос к модели. Рядом с ним в тот же промпт уходит позиция исполнителя из агента: роль, цель, профессиональная история, доступные инструменты. Они задают, кем модели считать себя, что искать и какими суждениями руководствоваться. Аудитор ищет расхождения в цифрах, юрист — риски формулировок, коммуникационщик — ясность. Формулировка поручения общая, а точка зрения на него разная, поэтому и вывод разный.'
  id: 012-prompt-agenta-2
  fingerprint: e522b94d
- concept: 'порядок сборки рабочего запроса: позиция исполнителя, поручение с критерием результата, входные материалы из context, вызов модели'
  question: Расставь по порядку, что происходит перед тем, как задача уйдёт в модель.
  explanation: 'Ключевое следствие порядка: описание требуемого результата попадает в инструкцию ДО начала работы, а не приклеивается к ответу после. Результаты вышестоящих задач приходят как входной материал, а не как доступ к рассуждениям другого агента.'
  kind: order
  items:
    - 'Из настроек агента берётся позиция исполнителя: роль, цель, профессиональная история и правила вызова инструментов'
    - К ней присоединяется поручение задачи и описание того, каким должен быть результат
    - Если у задачи заполнен context, в тот же запрос подставляются результаты указанных задач как входной материал
    - Собранный текст уходит в модель одним запросом
