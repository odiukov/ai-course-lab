- concept: потребитель типизированного результата обращается к полю по имени, а не к фрагменту текста по позиции, поэтому переименование заголовков и перестановка перестают ломать передачу
  question: Объясни своими словами, почему переименование моделью заголовков разделов ломает цепочку при передаче плана свободным текстом и перестаёт ломать при передаче pydantic-объектом.
  explanation: 'Разница не в строгости просьбы, а в способе адресации: текст разбирают по позиции и заголовку, объект — по имени поля. Поэтому починка хрупкой передачи живёт на задаче-производителе (`output_pydantic`), а не в более защитном разборе у потребителя.'
  kind: open
  reference: 'В свободном тексте у следующей задачи нет адресации: она находит нужный кусок по позиции («третий блок») или по совпадению заголовка. Обе опоры хрупкие — модель вольна переименовать «Решение» в «Что делать» или добавить раздел, и позиции сдвинутся. В pydantic-объекте адресация задана именами полей схемы: потребитель читает `outline.solution` независимо от того, какой заголовок модель написала внутри значения и в каком порядке она их генерировала. Формулировки внутри полей остаются свободными, но контракт на структуру соблюдает задача-производитель, а не догадливость нижестоящего агента.'
  id: 046-brittle-handoffs-3
  fingerprint: 1b2b598b
