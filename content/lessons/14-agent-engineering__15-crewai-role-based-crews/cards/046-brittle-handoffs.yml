- concept: гарантию на число элементов даёт ограничение длины списка в схеме, сам по себе тип list её не даёт
  question: Нижестоящая задача рассчитывает ровно на 5 разделов. Дополни схему так, чтобы список другой длины не прошёл валидацию.
  explanation: 'Аннотация `list[str]` фиксирует только тип элементов — список из 6 или 2 строк ей соответствует. Допущение потребителя о количестве нужно записать в схему явно: пара `min_length`/`max_length` (в pydantic v1 — `min_items`/`max_items`) отсекает любую длину, кроме 5. Схема ловит ровно то, что в ней записано.'
  kind: cloze
  template: |-
    class Outline(BaseModel):
        sections: list[str] = Field(..., min_length=5, ___=5)
  answer: max_length
  accept:
    - max_length
    - max_items
  id: 046-brittle-handoffs-2
