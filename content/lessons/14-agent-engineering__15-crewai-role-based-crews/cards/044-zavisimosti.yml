- concept: заявленный вендором выигрыш по скорости без опубликованной методики задаёт гипотезу для проверки, а не доказанный результат
  question: 'Разработчики агентного фреймворка публикуют: «наш фреймворк заметно быстрее конкурента на задачах вопрос–ответ». Методика замера не приложена. Как корректно использовать такое утверждение при выборе основы проекта?'
  explanation: Без датасета, модели, железа и определения метрики (время до первого токена? полный ответ? запросов в минуту?) сравнение невоспроизводимо. Это не делает его ложным — оно просто не является доказательством. Чужое число экономит поиск гипотезы, но не сам эксперимент.
  kind: choice
  options:
    - Как повод поставить фреймворк первым в очередь на собственный замер на своих данных, модели и железе
    - 'Как подтверждённое преимущество: вендор отвечает за свои цифры репутацией'
    - 'Как заведомую ложь: без методики цифра всегда завышена'
    - Как аргумент, который перестаёт работать, только если конкурент опубликует свои цифры
  correct: 0
  id: 044-zavisimosti-1
  fingerprint: 6cc5a6d0
- concept: отсутствие зависимости от LangChain изолирует конфликты версий, но требует адаптера для инструментов, написанных под LangChain
  question: Фреймворк агентов не зависит от LangChain. Какое практическое следствие из этого верно?
  explanation: 'Независимость касается графа зависимостей: чужие версии не приезжают транзитивно и апгрейд LangChain не ломает команду агентов. Но интерфейсы не совпадают, поэтому инструмент, написанный под LangChain, включается через переходник. «Без LangChain» не равно «без сторонних пакетов».'
  kind: choice
  options:
    - Обновление LangChain в проекте не сломает фреймворк из-за конфликта версий, но готовый LangChain-инструмент придётся подключать через адаптер
    - Фреймворк вообще не тянет сторонних пакетов, поэтому конфликтов версий в проекте не будет
    - LangChain-инструменты подключаются напрямую, зато прочие зависимости проекта надо пинить вручную
    - Отказ от LangChain — идеологическое решение, на разрешение зависимостей оно не влияет
  correct: 0
  id: 044-zavisimosti-2
  fingerprint: 4da94a8e
- concept: совместимость проверяема по зависимостям и документации, производительность — только собственным прогоном
  question: Почему при выборе фреймворка совместимость и производительность проверяются разными способами? Объясни своими словами.
  explanation: 'Дрель с обычной вилкой: вилка сразу говорит, войдёт ли инструмент в розетку, — это форма зависимостей. Скорость сверления зависит от стены и сверла, то есть от твоих условий, а не от рекламного стенда.'
  kind: open
  reference: 'Совместимость — свойство, зафиксированное в артефактах: диапазон версий Python, менеджер пакетов, отсутствие зависимости от чужой библиотеки, задокументированная интеграция с провайдером (например, AWS Bedrock). Это читается прямо и проверяется установкой. Производительность — не свойство фреймворка, а свойство связки «фреймворк + модель + данные + инфраструктура + определение метрики». Она не переносится с чужого стенда, поэтому её измеряют собственным прогоном. Побочные сигналы вроде числа звёзд на GitHub или наличия документированной интеграции говорят о популярности и совместимости, но ничего не подтверждают в скорости; звёзды к тому же меняются и осмысленны только с датой снимка.'
  id: 044-zavisimosti-3
  fingerprint: ac1de8a5
