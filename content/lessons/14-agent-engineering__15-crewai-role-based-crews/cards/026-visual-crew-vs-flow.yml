- concept: детерминизм Flow распространяется на маршрут выполнения, а не на содержание ответов модели
  question: Инженер переписал пайплайн с Crew на Flow и запустил один и тот же вход 40 раз. Тексты, которые вернула модель, каждый раз отличались формулировками. Что это означает?
  explanation: 'Flow владеет маршрутом: какие обработчики запустятся и кому передаётся управление, задано кодом и повторяется от прогона к прогону. Содержимое ответа остаётся за моделью и может меняться. Именно поэтому Flow чинит воспроизводимость трассы и отладку, а не вариативность текста; за форму текста отвечают контракты на вывод.'
  kind: choice
  options:
    - 'Flow настроен неверно: при корректной сборке ответы модели совпадали бы дословно'
    - 'Это нормально: Flow фиксирует набор и порядок сработавших шагов, но не делает генерацию модели одинаковой'
    - Flow вообще не даёт никаких гарантий повторяемости — она достигается только внешним кэшем
    - 'Нужно вернуться к Crew: детерминизм текста обеспечивает только процесс с менеджером'
  correct: 1
  id: 026-visual-crew-vs-flow-1
  fingerprint: 5bb24e6d
- concept: 'критерий выбора формы: процедура известна заранее (Flow) против случая, когда найденный маршрут сам является частью результата (Crew)'
  question: 'Две задачи: (1) ночной регламент реагирования на сигнал пожарного датчика — набор действий и их порядок утверждены заранее; (2) подготовка исследовательской справки по новой теме, где заранее неизвестно, сколько раз понадобится вернуться к сбору фактов. Какую форму — Crew или Flow — выбрать для каждой и по какому признаку?'
  explanation: 'Выбор идёт не по шкале «умное/простое», а по тому, где разрешена неопределённость: между шагами или внутри шага. У Flow свобода модели остаётся внутри обработчика, переходы задаёт код. У Crew маршрут выбирается по ходу, и это его рабочее свойство, а не дефект.'
  kind: open
  reference: 'Регламент по датчику — Flow: процедура зафиксирована заранее, отклонение в порядке шагов недопустимо, требуется одинаковая воспроизводимая трасса для разбора инцидента. Исследовательская справка — Crew: путь заранее неизвестен, число возвратов к предыдущей роли определяется содержанием промежуточных результатов, и сам найденный маршрут является частью полезного результата. Признак выбора: допустима ли импровизация в порядке этапов. Если да — Crew; если импровизация допустима только внутри отдельного этапа, а последовательность этапов фиксирована — Flow.'
  id: 026-visual-crew-vs-flow-2
  fingerprint: bd15843d
