- concept: expected_output — текстовый ориентир для агента, а не механическая валидация результата
  question: 'В expected_output записано: «таблица из 7 строк, в каждой — цена, сегмент и ссылка на источник». Прогон вернул таблицу из 9 строк, в двух нет ссылок. Что это означает?'
  explanation: expected_output — формулировка на естественном языке, попадающая в промпт. Она задаёт критерий полноты и форму, но соблюдение остаётся на модели. Когда структура нужна гарантированно, её описывают в output_pydantic и валидируют результат кодом.
  kind: choice
  options:
    - 'Ошибка конфигурации: expected_output обязан проверяться, значит поле задано в неверном формате'
    - 'Нормальное поведение: expected_output направляет работу LLM, но сам по себе не валидирует результат; жёсткая форма достигается через output_pydantic и проверку на выходе'
    - Задача не получила context, поэтому проигнорировала требования к формату
    - 'Такой результат невозможен: crew не завершает задачу, пока expected_output не выполнен'
  correct: 1
  id: 007-task-2
  fingerprint: 238dafa9
- concept: 'разделение ролей двух полей: context отвечает «из чего работать», expected_output — «что должно получиться»'
  question: Объясни своими словами, на какие разные вопросы отвечают поля context и expected_output у Task в CrewAI, и какой сбой возникает при подмене одного другим.
  explanation: 'Два поля закрывают вход и выход задачи. context приносит сырьё, expected_output описывает изделие. Диагностика по симптому: неверные факты при верной форме — проблема context; верные факты при неверной форме — проблема expected_output.'
  kind: open
  reference: 'context отвечает на вопрос «из каких результатов работать»: в нём перечислены вышестоящие задачи, чьи ответы подаются на вход текущей. expected_output отвечает на вопрос «что должно получиться»: объём, состав, признаки готовности и форма результата. Если данные не проведены через context, агент остаётся без сырья и придумывает факты. Если expected_output размыт («подробный отчёт»), агент вернёт фактически верный, но не той формы и не того объёма результат — например эссе вместо таблицы.'
  id: 007-task-3
  fingerprint: 710df704
