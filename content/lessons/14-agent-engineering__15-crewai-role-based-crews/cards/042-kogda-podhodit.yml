- concept: нижняя и верхняя границы ориентира по размеру команды отсекают разные проблемы
  question: Ориентир по размеру ролевой команды имеет два края. Объясни своими словами, что именно ломается при выходе за нижний край и что — при выходе за верхний. Это разные проблемы или одна?
  explanation: Ориентир — не одно правило, а два разных вопроса. «Даёт ли состав действительно разные взгляды?» отсекает слишком мелкие команды. «Могу ли я всё ещё назвать, кто готовит, кто проверяет и кто решает?» отсекает слишком крупные. Команда, прошедшая обе проверки, обычно и есть тот случай, ради которого ролевая форма существует.
  kind: open
  reference: 'Разные. Снизу: при одном-двух агентах разделение ролей не окупается — точка зрения по сути одна, а каждая дополнительная роль стоит отдельных промптов и передач результата; проще решить задачу одной задачей или обычным кодом. Сверху: состав перестаёт быть читаемым как команда людей — зоны ответственности пересекаются, непонятно, чей результат влияет на чей, а при маршрутизации через менеджера растут и стоимость выбора, и трудность разбора прогона. Нижний край — про бесполезные накладные расходы, верхний — про потерю управляемости и наблюдаемости.'
  id: 042-kogda-podhodit-2
  fingerprint: ee1260e6
- concept: читаемость конфигурации сопровождающими — самостоятельный аргумент в пользу ролевой формы
  question: Какой признак задачи говорит в пользу ролевой Crew, а не описания работы графом шагов?
  explanation: 'Форма записи — не косметика: конфигурацию читают и правят люди. Если предметная область сама описывается как «исследователь, автор, критик, редактор», ролевые поля дают прямое соответствие, и новый человек понимает состав без чтения графа. Если же работа — это фиксированная последовательность переходов с условиями, схема шагов честнее описывает происходящее. Остальные признаки к выбору формы отношения не имеют: они одинаково выполнимы в обеих.'
  kind: choice
  options:
    - Работу естественнее записать как список сотрудников с зонами ответственности (role, goal, backstory), чем как схему переходов между шагами
    - Задач в конвейере меньше, чем агентов в составе
    - Все агенты используют одну и ту же модель
    - Нужно логировать каждый вызов инструмента
