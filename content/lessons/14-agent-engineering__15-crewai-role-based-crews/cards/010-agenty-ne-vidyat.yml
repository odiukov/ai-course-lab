- concept: через context проходит возвращённый результат задачи, а не журнал действий и рассуждений выполнившего её агента
  question: В crew задача B перечисляет задачу A в своём `context`. Агент задачи A вызвал 5 инструментов, отбросил часть найденных данных и вернул короткий вывод. Что получит агент задачи B?
  explanation: '`context` подставляет на вход результат вышестоящей задачи — то, что она вернула. Вызовы инструментов, промежуточные шаги и отброшенные варианты остаются внутри прогона задачи A и до задачи B не доезжают. Никакого канала «доспросить агента» в CrewAI нет.'
  kind: choice
  options:
    - Только текст, возвращённый задачей A как её результат
    - Результат задачи A вместе с логом всех 5 вызовов инструментов
    - Полную историю рассуждений агента задачи A, включая отброшенные данные
    - Ссылку на агента задачи A, у которого можно доспросить подробности
  correct: 0
  id: 010-agenty-ne-vidyat-1
  fingerprint: 94b25236
- concept: полнота передаваемых дальше данных обеспечивается контрактом апстрим-задачи, а не расчётом на догадливость нижестоящего агента
  question: Задача-исследователь возвращает одну строку с итоговым выбором, а следующей задаче для аргументации нужны ещё 4 критерия сравнения и перечень источников. Объясни своими словами, где в конфигурации crew правильно чинить такую потерю деталей и почему.
  explanation: 'Граница задачи — место передачи ответственности: дальше живёт только то, что пересекло её в виде результата. Поэтому требования к содержимому формулируются в `expected_output` той задачи, которая это содержимое производит.'
  kind: open
  reference: 'Чинить надо в `expected_output` вышестоящей задачи: расширить контракт так, чтобы результат содержал и выбор, и 4 критерия, и источники. Всё, что не попало в результат задачи, за её границу не выходит и восстановить это ниже по потоку нечем — нижестоящий агент не имеет доступа ни к рассуждениям, ни к промежуточным находкам исполнителя. Подкручивать формулировки задачи-потребителя или надеяться, что агент «сам разберётся», бесполезно: данных у него физически нет. Проводка (`context`) отвечает за то, что результат вообще дойдёт; полнота этого результата — зона ответственности апстрим-контракта.'
  id: 010-agenty-ne-vidyat-2
  fingerprint: '89653e75'
