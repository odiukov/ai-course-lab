- concept: структурируют результат, который дальше потребляет код, свободный текст оставляют для результата, который читает человек
  question: 'Конвейер из трёх задач: первая собирает заметки аналитика для человеческого ревью, вторая выдаёт решение, которое ветвит логику Flow, третья пишет итоговое письмо клиенту. Какой задаче в первую очередь нужен `output_pydantic`?'
  explanation: 'Схему ставят там, где результат должен без догадок принять следующий код. Ветвление Flow по решению — ровно этот случай: нужны поля с предсказуемыми типами. Заметки и письмо читает человек, свободный текст там уместен, а схема лишь добавит жёсткости без выигрыша.'
  kind: choice
  options:
    - Первой — заметки длиннее всех, схема их дисциплинирует
    - Второй — её результат читает код, а не человек
    - Третьей — письмо уходит наружу, форма важнее всего
    - 'Всем трём одинаково: схема обязательна на каждой задаче'
  correct: 1
  id: 031-output-pydantic-2
  fingerprint: 5ebba721
- concept: 'порядок обработки ответа задачи со схемой: генерация, попытка приведения к модели, повтор запроса при неудаче, отдача объекта модели'
  question: Расставь по порядку, что происходит с ответом задачи, у которой задан `output_pydantic`.
  explanation: 'Схема подключается после генерации: сначала агент отвечает, потом CrewAI валидирует ответ по модели. Приведение — это попытка, а не гарантия с первого раза; при провале идёт повтор. Поэтому плотный `expected_output` экономит деньги и время — он снижает шанс дойти до стадии повтора.'
  kind: order
  items:
    - Агент генерирует ответ по описанию задачи и ориентиру `expected_output`
    - CrewAI пытается разобрать ответ и привести его к указанной Pydantic-модели
    - При несовпадении полей или типов запрос к модели повторяется
    - Наружу отдаётся экземпляр модели с полями нужных типов
  id: 031-output-pydantic-3
