- concept: управляющего агента для иерархического процесса CrewAI поднимает сам из manager_llm, вручную в agents его не дописывают
  question: Команда из 5 специалистов запускается с `Process.hierarchical`. Как в CrewAI появляется управляющий агент?
  explanation: '`agents` — это список исполнителей предметной работы. Управляющего CrewAI инстанцирует самостоятельно из настройки `manager_llm`, а при её отсутствии берёт модель по умолчанию. Дописанный руками «менеджер» в `agents` стал бы ещё одним специалистом, которому менеджер раздаёт работу.'
  kind: choice
  options:
    - Его нужно описать как Agent с ролью «менеджер» и добавить шестым элементом в `agents`
    - CrewAI создаёт его сам на модели из `manager_llm` (или на модели по умолчанию), в `agents` остаются только специалисты
    - Менеджером становится агент первой задачи в списке `tasks`
    - Менеджер задаётся отдельной задачей в `tasks` с пустым `expected_output`
  correct: 1
  id: 019-run-hierarchical-2
  fingerprint: 6bc1e205
