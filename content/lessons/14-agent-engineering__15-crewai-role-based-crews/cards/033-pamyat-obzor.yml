- concept: Short-term-память ограничена одним прогоном и очищается по его завершении, поэтому переносить сведения между прогонами она не может
  question: Команда собирает заявку в диалоге, и разработчик рассчитывает, что уточнённый агентом адрес доставки будет доступен при следующем запуске команды. Объясни своими словами, сработает ли расчёт на Short-term-память и какой тип нужен вместо неё.
  explanation: Ключевое свойство Short-term — срок жизни, равный одному прогону. Всё, что должно пережить kickoff, кладут в Long-term или Entity; выбор между ними определяется тем, как запись потом ищут — по похожести или по ключу.
  kind: open
  reference: 'Не сработает. Short-term — буфер содержания одного прогона: он удерживает контекст диалога, пока прогон идёт, и очищается после его завершения. Для доступности адреса при следующем запуске нужна межпрогонная память: Entity, если адрес привязывается к конкретному клиенту и должен доставаться по ключу-сущности, или Long-term, если фрагмент достаточно находить по смысловой похожести на новую задачу.'
