- concept: Contextual — это извлечение в момент сборки промпта, а не ещё одно хранилище данных
  question: Чем Contextual-память CrewAI отличается по своей роли от Short-term, Long-term и Entity?
  explanation: 'Три первых типа отвечают на вопрос «где лежит запись». Contextual отвечает на вопрос «что положить в этот конкретный промпт»: она срабатывает при его сборке и подтягивает нужное тогда, когда агенту это понадобилось, вместо загрузки всего заранее.'
  kind: choice
  options:
    - Она хранит сжатые копии всех остальных типов памяти для быстрого доступа
    - 'Она не хранилище, а механизм извлечения: в момент сборки промпта достаёт из доступной памяти то, что нужно агенту сейчас'
    - Она хранит факты о сущностях, но, в отличие от Entity, только в пределах одного прогона
    - Она сохраняет служебные логи прогонов для последующей отладки
  correct: 1
