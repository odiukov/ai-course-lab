- concept: 'привязка исполнителя живёт на стороне Task: задача ссылается на агента, а не агент на задачу'
  question: В CrewAI нужно перевести подготовку сводки с одного исполнителя на другого. Где в конфигурации записана эта привязка?
  explanation: 'Ссылка однонаправленная: Task указывает на Agent через поле agent. У Agent нет поля со списком его задач, а Crew хранит просто два плоских списка — agents и tasks.'
  kind: choice
  options:
    - В Task — поле agent указывает, кто её выполняет
    - В Agent — список задач, которые он берёт
    - В Crew — таблица соответствия агентов и задач
    - В Process — правило распределения задач по ролям
  correct: 0
  id: 011-check-primitivy-1
  fingerprint: '03417e34'
- concept: memory и verbose — опциональные настройки уровня Crew, а не отдельных агентов или задач
  question: Команда CrewAI должна помнить контекст между прогонами, и нужен подробный лог выполнения. На каком примитиве включаются memory и verbose?
  explanation: 'Crew — контейнер: помимо agents, tasks и process он держит опциональные memory, verbose и manager_llm. Настройки прогона задаются один раз на уровне команды, а не рассыпаны по исполнителям.'
  kind: choice
  options:
    - На Crew — это его опциональные настройки
    - На каждом Agent отдельно
    - На каждом Task отдельно
    - На Process — вместе со стратегией выполнения
  correct: 0
  id: 011-check-primitivy-2
  fingerprint: fb764ef2
- concept: Process — это фиксированный набор стратегий выполнения, а не произвольная пользовательская логика
  question: Что задаёт Process в CrewAI?
  explanation: 'Process решает, кто берёт следующую задачу, и выбирается из выпущенных типов: Sequential и Hierarchical; Consensus заявлен как запланированный. Инструменты живут на Agent, схема вывода — на Task, модель — в llm агента или manager_llm команды.'
  kind: choice
  options:
    - Стратегию выполнения — Sequential, Hierarchical, Consensus (запланирован)
    - Набор инструментов, доступных агентам во время прогона
    - Схему выходных данных, которую обязана вернуть команда
    - Модель, на которой работают все агенты команды
  correct: 0
