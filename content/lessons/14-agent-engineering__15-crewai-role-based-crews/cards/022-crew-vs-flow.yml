- concept: тело шага Flow — обычный Python-код, а не декларативная спецификация задачи для модели
  question: Чем по сути является отдельный шаг Flow?
  explanation: 'Шаг Flow — код, а не поручение модели: HTTP-запрос, запись в базу, ветвление, вызов `Crew.kickoff()`. Именно поэтому Flow наблюдаем и тестируем обычными средствами — обращение к LLM появляется только там, где его написали руками.'
  kind: choice
  options:
    - Обычной Python-функцией, которая может делать что угодно, включая запуск команды агентов
    - Объектом Task, который обязан быть привязан к агенту
    - YAML-описанием поручения, которое фреймворк разворачивает в промпт
    - Промптом, который перед выполнением обязательно проходит через управляющую модель
