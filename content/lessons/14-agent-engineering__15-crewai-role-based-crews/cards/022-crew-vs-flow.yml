- concept: 'направление вложенности форм: Crew вызывается из шага Flow через kickoff, а не наоборот'
  question: Конвейер собран на Flow, но один участок — генерация вариантов заголовка — должен остаться автономным. Как CrewAI связывает эти две формы?
  explanation: 'Тело шага Flow — обычная Python-функция, поэтому она может вызвать `Crew.kickoff()` и получить результат. Вложенность идёт в одну сторону: Crew живёт внутри шага Flow. Process — это стратегия исполнения внутри Crew, к Flow отношения не имеет.'
  kind: choice
  options:
    - Шаг Flow — обычный Python, внутри него вызывается `Crew.kickoff()`
    - Flow передаётся в Crew как значение параметра `process`
    - Crew подписывается на события Flow через собственный декоратор и запускается фреймворком
    - Агенты Crew добавляются в список шагов Flow наравне с Python-функциями
