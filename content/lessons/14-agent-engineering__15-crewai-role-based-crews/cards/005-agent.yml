- concept: role задаёт точку зрения, но не даёт агенту возможностей — вызываемые функции приходят только через tools
  question: У агента CrewAI указан role="патентный аналитик" и подробный backstory про работу с базами патентов, но список tools пуст. Что произойдёт при запуске задачи, требующей поиска по базе патентов?
  explanation: 'role и backstory — текстовая настройка рассуждения, они не расширяют список доступных вызовов. Реальные возможности агента ровно те, что перечислены в tools. Отсюда типичный сбой: «исследователь с пустыми руками» уверенно выдумывает то, что должен был проверить инструментом.'
  kind: choice
  options:
    - 'Агент выполнит поиск: role автоматически включает соответствующие возможности'
    - Агент не сможет вызвать поиск и будет отвечать только из знаний модели
    - CrewAI подставит инструмент поиска по умолчанию, исходя из формулировки role
    - Crew откажется стартовать, пока role не совпадёт с набором tools
  correct: 1
  id: 005-agent-1
  fingerprint: ca90f4aa
- concept: goal задаёт направление и критерий завершения работы агента
  question: Агент-аналитик то останавливается после первого найденного факта, то бесконечно копает дальше. Какое поле Agent надо править в первую очередь?
  explanation: 'goal фиксирует, к чему агент идёт и когда работа считается законченной («опереться минимум на два независимых свидетельства»). Без финишной черты момент остановки решает модель, отсюда разброс: то слишком рано, то без пользы долго. Смена модели или добавление инструментов этот разброс не убирает.'
  kind: choice
  options:
    - role — уточнить название профессии
    - goal — задать направление и явный критерий достаточности результата
    - tools — добавить ещё один инструмент поиска
    - llm — переключить агента на более крупную модель
  correct: 1
  id: 005-agent-2
  fingerprint: d3c5140d
- concept: 'backstory — несущая часть настройки: задаёт тон, осторожность суждений и порог доказательности'
  question: Почему backstory считают несущей конструкцией Agent, а не украшением? Объясни своими словами, что именно он меняет в поведении.
  explanation: 'Четыре поля отвечают на разные вопросы: кто ты (role), к чему идёшь (goal), как судишь (backstory), чем можешь действовать (tools). Если один агент выдаёт уверенный ответ после первого совпадения, а другой перечисляет версии с пометками неопределённости — при одной и той же модели различие обычно сидит в backstory.'
  kind: open
  reference: backstory объясняет, почему агент рассуждает именно так, и через это влияет на тон ответа, осторожность суждений и порог, при котором доказательств считается достаточно. Например, легенда «работаешь с ошибочно подписанными архивами» заставляет отделять факт от догадки и явно помечать неопределённость вместо уверенного ответа по первому совпадению. role даёт лишь профессиональную точку зрения, goal — направление и момент остановки, tools — доступные вызовы; манеру суждения задаёт именно backstory. При этом длинные легенды съедают контекстный бюджет, поэтому их держат сжатыми.
  id: 005-agent-3
  fingerprint: 720f25a1
