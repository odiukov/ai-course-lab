- concept: изоляция сбоя при одновременном запуске независимых участников — задача акторной модели, а не последовательного или графового исполнения
  question: Сервис запускает девять независимых экспертиз документа одновременно. Падение одной экспертизы не должно останавливать остальные восемь. Какая модель исполнения решает это напрямую?
  explanation: 'Требования тут два сразу: конкурентность и изоляция сбоя. Акторная модель даёт и то и другое — участники общаются сообщениями и имеют раздельные границы отказа. Последовательный процесс по определению не запускает участников одновременно; менеджер в иерархическом процессе раздаёт работу по одному; Flow задаёт границу и порядок, но не изолирует параллельных исполнителей.'
  kind: choice
  options:
    - 'Акторная модель AutoGen: участники изолированы, сбой одного не валит остальных'
    - 'Crew Sequential: задачи идут по списку, сбойную просто пропускают'
    - 'Crew Hierarchical: менеджер перезапускает упавшего специалиста'
    - 'Flow: обёртка ловит исключение и продолжает прогон'
