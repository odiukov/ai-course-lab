- concept: 'выбор формы делается по свойству процесса, которым нельзя пожертвовать: граница прогона, порядок, состояние или конкурентность'
  question: 'Своими словами: по какому признаку выбирают между Crew, Flow, LangGraph и акторным фреймворком, и какое свойство обеспечивает каждый из них?'
  explanation: 'Правильная постановка вопроса — «что здесь обязано быть управляемым: граница прогона, порядок, состояние или конкурентность». Ответ на него сразу указывает на инструмент; сравнение фреймворков по общей «мощности» не даёт критерия. Частая ошибка — считать, что обёртка Flow заодно закрывает возобновление и строгость переходов: она закрывает только границу и порядок шагов.'
  kind: open
  reference: 'Выбирают не по «уму» фреймворка, а по тому свойству процесса, которым нельзя пожертвовать. Crew обеспечивает совместную работу нескольких ролей над результатом там, где маршрут допустимо оставить модели (Sequential при понятном порядке, Hierarchical когда следующий исполнитель определяется промежуточным ответом). Flow даёт наблюдаемую границу прогона — вход, выход, точку записи трассы — и кодом заданный порядок шагов; ради этого его ставят даже вокруг единственного вызова Crew. LangGraph даёт управляемое состояние: явные переходы и надёжное возобновление с конкретного узла после сбоя. Акторный фреймворк даёт конкурентность и изоляцию отказов между независимыми участниками. Форма выбирается под участок конвейера, и разные участки одного продукта могут требовать разных форм.'
