- concept: Flow — отдельный уровень оркестрации, а не одно из значений Process у Crew
  question: Инженер хочет детерминированный маршрут и пишет в конфигурации команды `process=Process.flow`. Что здесь неверно?
  explanation: 'Process перечисляет стратегии движения внутри команды (sequential, hierarchical, consensus как заявленный). Flow живёт уровнем выше: событийный код с шагами, откуда команда запускается через kickoff. Вложенность идёт в одну сторону — Flow вызывает Crew.'
  kind: choice
  options:
    - Flow не входит в перечень стратегий Process; детерминированный маршрут описывают отдельным классом Flow, а Crew вызывают из его шагов
    - Flow допустим как значение Process, но только вместе с заданным manager_llm
    - Flow — режим памяти, его включают отдельным флагом рядом с memory
    - Flow задаётся полем на уровне Task, а не на уровне Crew
  correct: 0
  id: 053-quiz-1
  fingerprint: d7a37868
- concept: 'process и память — независимые оси конфигурации: одна задаёт маршрут исполнения, другая — подмешиваемый на вход контекст'
  question: Объясни своими словами, что меняет переключение process с sequential на hierarchical, что меняет включение long-term памяти, и почему одно не заменяет другое.
  explanation: 'Типичная ошибка — лечить неопределённый порядок памятью или ждать от смены процесса другого набора извлечённых фрагментов. Это разные слои конфигурации: маршрут и содержимое промпта.'
  kind: open
  reference: 'Process отвечает на вопрос «кто получает работу и в каком порядке»: при sequential порядок задан списком задач, при hierarchical выбор следующего исполнителя делает управляющая LLM. Память отвечает на другой вопрос — «какой дополнительный текст попадёт во вход задачи»: long-term ищет по смысловой близости записи прошлых прогонов и подмешивает найденное при сборке промпта. Смена процесса не включает и не отключает извлечение, а включение памяти не меняет маршрут исполнения. Поэтому сломанный или неясный порядок чинят процессом либо переносом участка во Flow, а нехватку прошлого опыта — памятью; подмена одного другим не устраняет исходную причину.'
  id: 053-quiz-2
  fingerprint: b1073b4e
