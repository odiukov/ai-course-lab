- concept: токенная стоимость легенд команды растёт как произведение числа агентов на длину легенды
  question: В CrewAI-команде 4 агента, каждому написали backstory примерно на 750 русских слов. Считай, что одно русское слово — примерно 1.3 токена. Сколько токенов занимают легенды всей команды в одном запросе к модели?
  explanation: '4 × 750 = 3000 слов, 3000 × 1.3 ≈ 3900 токенов. Стоимость легенд — произведение числа агентов на длину легенды, поэтому лишний агент дорожает так же, как лишние абзацы у каждого. Урок рекомендует держать backstory короче 200 слов: тогда те же 4 агента дадут около 1000 токенов.'
  kind: numeric
  answer: 3900
  tolerance: 200
  id: 045-prompt-bloat-1
  fingerprint: 025c3173
- concept: конфигурация агента переотправляется в промпте на каждом вызове модели, а не оплачивается один раз за прогон
  question: Команда из 6 агентов с длинными backstory. Первый вызов модели вышел дорогим по входным токенам. Что произойдёт со стоимостью легенд на восьмом вызове того же прогона?
  explanation: 'У модели нет состояния между вызовами: инструкции агента приходят заново в каждом запросе. Поэтому раздутая легенда — не разовая справка, а налог на каждый ход. 5 легенд по 2000 слов дают ~13 000 токенов, и эти 13 000 повторяются при каждом обращении к модели.'
  kind: choice
  options:
    - Легенды снова попадут в промпт целиком, и их стоимость будет уплачена ещё раз
    - Фреймворк уже передал легенды модели, поэтому дальше отправляются только новые данные задачи
    - Легенды остаются только в промпте того вызова, где агент был создан
    - Легенды сжимаются автоматически после первого вызова
  correct: 0
