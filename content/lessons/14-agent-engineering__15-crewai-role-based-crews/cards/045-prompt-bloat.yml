- concept: критерий отбора содержимого backstory — влияние на решение агента, а общие для команды правила выносятся в одну переиспользуемую формулировку
  question: Три агента одной команды, у каждого в backstory дословно повторён один и тот же свод правил компании. Как правильно сократить конфигурацию?
  explanation: 'Место в backstory окупает только то, что меняет поведение: осторожность суждений, порог доказательности, специфический опыт. Дублирование общих формулировок между агентами умножает одни и те же токены на размер команды. Перенос текста в role ничего не экономит — role уходит в тот же промпт.'
  kind: choice
  options:
    - Сформулировать общий свод один раз и переиспользовать текст, оставив в каждой легенде только опыт, который меняет решения именно этого агента
    - 'Оставить повтор: без него агент не будет соблюдать правила, потому что они не попадут в его промпт'
    - Перенести свод правил в поле role каждого агента — там текст стоит дешевле
    - Заменить свод правил расширенной биографией, чтобы агент вывел правила сам
  correct: 0
