- concept: основание для иерархического процесса — зависимость следующего шага от результата, а не размер команды
  question: 'В команде CrewAI девять специалистов, но маршрут прогона зафиксирован: каждый следующий исполнитель известен ещё до запуска и не меняется от полученных результатов. Что говорит в пользу выбора процесса?'
  explanation: 'Менеджер окупается только тогда, когда результат открывает разные ветки и следующего исполнителя нельзя назвать заранее. Число агентов само по себе критерием не является: при фиксированном маршруте менеджер добавляет вызов LLM на каждый раунд и не добавляет ни одного решения.'
  kind: choice
  options:
    - 'Sequential: маршрутизировать нечего, менеджеру нечего решать'
    - 'Hierarchical: девять специалистов уже сами по себе требуют менеджера'
    - 'Hierarchical: чем больше агентов, тем выше риск, что порядок в списке задан неверно'
    - 'Consensus: девять исполнителей могут проголосовать за порядок'
  correct: 0
  id: 021-check-process-1
  fingerprint: 9b7d0c1a
- concept: фиксированный порядок задач задаётся значением Process.sequential при сборке Crew
  question: Порядок задач известен заранее и не зависит от промежуточных результатов, отдельный агент-менеджер не нужен. Какое значение процесса подставить?
  explanation: Process.sequential выполняет задачи в порядке объявления, результат задачи N уходит следующей как context. Это самый дешёвый и предсказуемый вариант. Process.hierarchical поднял бы управляющего агента и лишний вызов LLM на каждый раунд.
  kind: cloze
  template: crew = Crew(agents=agents, tasks=tasks, process=Process.___)
  answer: sequential
  accept:
    - Sequential
    - Process.sequential
