- concept: log-mel-спектрограмма хранит логарифмическую энергию для каждой пары временного кадра и мел-частотного бина
  question: Объясни своими словами, что обозначают две оси log-mel-спектрограммы и значение одной её ячейки.
  explanation: 'Log-mel — двумерное представление звука: время × мел-частота. Логарифм сжимает диапазон энергий и лучше приближает человеческое восприятие изменений громкости.'
  kind: open
  reference: Одна ось задаёт последовательные временные кадры, другая — частотные бины на мел-шкале. Ячейка содержит логарифмически преобразованную энергию соответствующего частотного диапазона в соответствующий момент времени.
