- concept: Large-v3 улучшает качество без увеличения архитектурного размера относительно Large
  question: У исходной крупной модели Whisper и её обновлённой версии совпадают число параметров, количество слоёв, d_model, число голов и потребление памяти. Какой вывод наиболее обоснован?
  explanation: 'Large и Large-v3 имеют одинаковый архитектурный масштаб: 1550M параметров, 32 слоя, d_model 1280 и 20 голов. Поэтому различия в качестве связаны не с увеличением модели, а с изменениями обучения и данных.'
  kind: choice
  options:
    - Обновлённая версия обрабатывает более длинную входную последовательность
    - Улучшение качества нельзя объяснить увеличением архитектуры модели
    - Обновлённая версия использует головы большей размерности
    - Улучшение обязательно вызвано увеличением числа слоёв
