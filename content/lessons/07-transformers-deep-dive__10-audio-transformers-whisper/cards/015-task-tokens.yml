- concept: начальный токен-таймстемп задаёт точку отсчёта времени для декодируемого фрагмента
  question: Объясни своими словами роль токена-таймстемпа в начальном префиксе декодера Whisper.
  explanation: В показанном в уроке префиксе `<|0.00|>` означает начало отсчёта с нулевой секунды. Это служебная временная метка, а не часть распознанной речи.
  kind: open
  reference: Он указывает временную позицию, с которой начинается декодируемый фрагмент, и тем самым задаёт начало отсчёта для последующих временных меток.
  id: 015-task-tokens-2
  fingerprint: 4df4d390
