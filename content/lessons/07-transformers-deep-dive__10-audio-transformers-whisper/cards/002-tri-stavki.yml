- concept: служебный токен задачи позволяет одному декодеру выполнять несколько речевых задач
  question: Заполни условие, благодаря которому один декодер Whisper может переключаться между транскрипцией, переводом и другими задачами.
  explanation: Служебные токены сообщают декодеру язык, требуемую операцию и необходимость таймстемпов. Поэтому режим работы меняется без замены весов или отдельной выходной головы.
  kind: cloze
