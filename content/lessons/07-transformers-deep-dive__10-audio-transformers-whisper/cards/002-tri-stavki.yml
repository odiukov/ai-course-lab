- concept: Whisper распознаёт речь стандартным encoder-decoder трансформером с авторегрессивной генерацией текста
  question: Расположи этапы распознавания речи в Whisper в правильном порядке.
  explanation: Encoder обрабатывает log-mel спектрограмму, после чего decoder последовательно предсказывает текстовые токены. Для такого преобразования Whisper не использует отдельный CTC-декодер, HMM или фонемную разметку.
  kind: order
  items:
    - Преобразовать аудио в log-mel спектрограмму
    - Получить акустическое представление с помощью encoder
    - Авторегрессивно сгенерировать текстовые токены с помощью decoder
  id: 002-tri-stavki-3
  fingerprint: 93b2f4e9
