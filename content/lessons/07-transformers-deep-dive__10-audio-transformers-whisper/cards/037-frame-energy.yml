- concept: энергия кадра изменяется пропорционально квадрату масштаба амплитуды
  question: Средняя энергия аудиокадра равна 0.18. Каждый сэмпл кадра умножили на 3. Чему станет равна энергия?
  explanation: После масштабирования каждый квадрат сэмпла увеличивается в 3² = 9 раз. Поэтому новая энергия равна 0.18 × 9 = 1.62.
  kind: numeric
  answer: 1.62
