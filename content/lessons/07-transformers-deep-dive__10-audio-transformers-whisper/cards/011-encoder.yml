- concept: слои энкодера контекстуализируют представления без изменения длины последовательности и ширины скрытого состояния
  question: Заполните формулу формы выхода трансформерного энкодера, если его блоки сохраняют размеры представлений.
  explanation: Трансформерные блоки изменяют содержимое скрытых состояний, но не обязаны менять форму тензора. Поэтому у large после 32 слоёв сохраняется форма 1500 × 1280.
