- concept: self-attention создаёт контекстные представления с учётом всей временной последовательности
  question: Объясните своими словами, как self-attention помогает аудиоэнкодеру учитывать далёкие друг от друга фрагменты записи.
  explanation: В Whisper self-attention связывает каждую из 1500 временных позиций со всей последовательностью. После последовательных слоёв состояние позиции описывает уже не только локальный фрагмент, но и его контекст во всей записи.
  kind: open
  reference: Каждая временная позиция сопоставляется со всеми остальными позициями и получает взвешенную смесь их представлений. Поэтому её скрытое состояние может содержать информацию даже о далёких фрагментах аудио.
  id: 011-encoder-1
  fingerprint: 6ef3ab37
- concept: позиционное кодирование сообщает трансформеру порядок временных позиций
  question: Какую роль выполняет синусоидальное позиционное кодирование в аудиоэнкодере трансформера?
  explanation: Сам по себе self-attention не различает порядок элементов. Позиционное кодирование добавляет сведения о месте каждого фрагмента в последовательности; в энкодере Whisper оно синусоидальное.
  kind: choice
  options:
    - Преобразует скрытые состояния в вероятности текстовых токенов
    - Добавляет сведения о порядке и положении фрагментов во времени
    - Выбирает частоты для построения mel-спектрограммы
    - Сокращает число временных позиций между слоями
  correct: 1
