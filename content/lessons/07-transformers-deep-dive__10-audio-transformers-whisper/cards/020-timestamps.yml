- concept: разрешение таймстемпов определяется длительностью аудиоокна и числом временных позиций энкодера
  question: Как выразить минимальный шаг таймстемпов через длительность входного окна и число временных позиций на выходе энкодера?
  explanation: Энкодер разбивает фиксированное аудиоокно на равномерную временную сетку. Поэтому шаг таймстемпов равен длительности окна, делённой на количество временных позиций энкодера.
