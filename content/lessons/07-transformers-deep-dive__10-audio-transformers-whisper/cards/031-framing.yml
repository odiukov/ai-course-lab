- concept: длина кадра задаёт анализируемый временной фрагмент, а шаг — частоту появления кадров
  question: Нужно получать признаки чаще, сохранив неизменной длительность звука, анализируемого в каждом кадре. Что следует сделать?
  explanation: Длительность анализируемого фрагмента определяется длиной кадра, поэтому её оставляют прежней. Уменьшение шага заставляет начинать новые кадры чаще и увеличивает их перекрытие.
  kind: choice
  options:
    - Уменьшить шаг, не меняя длину кадра
    - Уменьшить длину кадра, не меняя шаг
    - Одинаково увеличить длину кадра и шаг
    - Убрать перекрытие между кадрами
