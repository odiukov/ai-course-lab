- concept: число сэмплов равно произведению длительности сигнала на частоту дискретизации
  question: Сигнал длительностью 2.5 секунды дискретизируется с частотой 24 кГц. Сколько сэмплов должен содержать массив?
  explanation: Число сэмплов вычисляется как длительность в секундах, умноженная на частоту дискретизации в герцах. Аналогично, одна секунда при 16 кГц содержит 16 000 сэмплов.
  kind: numeric
  answer: 60000
  tolerance: 0.5
  id: 030-sine-wave-1
  fingerprint: 088e1702
- concept: при построении временной сетки правую границу интервала нужно исключать
  question: Заполни пропуск так, чтобы временная сетка не включала начало следующего аудиофрагмента.
  explanation: При включённой правой границе первая и последняя точки соответствуют границам соседних интервалов, а шаг времени становится неверным. Для секунды при 16 кГц нужны моменты от 0 до 15999/16000 включительно, но не t = 1.
  kind: cloze
  template: t = np.linspace(start, stop, num_samples, endpoint=___)
  answer: 'False'
  accept:
    - 'false'
