- concept: число сэмплов в периоде синусоиды определяется отношением частоты дискретизации к частоте сигнала
  question: Объясни своими словами, как по частоте дискретизации и частоте чистого тона определить число сэмплов в одном периоде.
  explanation: Для сигнала из урока отношение 16000/440 даёт примерно 36,4 сэмпла на период. Это позволяет проверить, соответствует ли сгенерированная синусоида заданной частоте.
  kind: open
  reference: 'Нужно разделить частоту дискретизации на частоту тона: samples_per_period = sample_rate / frequency. Частота дискретизации задаёт число замеров за секунду, а частота тона — число периодов за секунду, поэтому их отношение показывает число замеров на период.'
  id: 030-sine-wave-3
  fingerprint: 153f4e8c
