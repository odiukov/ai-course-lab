- concept: для сверхнизкой задержки нужен специализированный потоковый ASR, а не Whisper
  question: Голосовой интерфейс должен выдавать частичную расшифровку прямо во время речи и работать на маломощном устройстве. Какой класс моделей следует предпочесть Whisper и почему?
  explanation: Whisper силён в качественной пакетной расшифровке, но не спроектирован для разговорного интерфейса с задержкой менее 200 мс. Для такой задачи выбирают потоковый ASR, а на слабом железе одним из вариантов служит Moonshine.
  kind: open
  reference: Следует выбрать специализированный потоковый ASR, например Moonshine для edge-устройства. Такие модели рассчитаны на инкрементальную обработку и низкую задержку, тогда как оконная схема Whisper хуже подходит для немедленной выдачи результата.
  id: 042-vybor-2
