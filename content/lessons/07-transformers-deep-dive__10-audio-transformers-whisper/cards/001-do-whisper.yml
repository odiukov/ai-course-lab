- concept: обучающий сигнал при self-supervised предобучении аудиоэнкодера извлекается из самого аудио
  question: Почему self-supervised аудиоэнкодер можно предобучать на записях без текстовых расшифровок?
  explanation: 'В self-supervised обучении целевой сигнал строится из самих данных: часть аудио скрывают, а модель учится восстанавливать её представление по контексту. Поэтому для предобучения экстрактора признаков ручные транскрипции не требуются.'
  kind: choice
  options:
    - Модель восстанавливает скрытые фрагменты или их представления, используя остальную часть аудиозаписи как контекст
    - Текстовая расшифровка автоматически получается из амплитуды каждого отсчёта
    - Модель учится только различать языки, поэтому слова ей не нужны
    - Необученная выходная голова заранее знает соответствие между звуками и буквами
  correct: 0
  id: 001-do-whisper-1
  fingerprint: c5f08764
- concept: хрупкость дообученной ASR-системы к смене акустического домена
  question: Объясните, почему ASR-система, дообученная на чистой студийной речи, может резко потерять качество на телефонных звонках и что обычно приходилось делать до появления универсальных моделей.
  explanation: Высокое качество на исходном наборе данных не гарантирует устойчивости к другому каналу записи, шуму и акцентам. Для wav2vec второго поколения и HuBERT переход в новый домен часто означал новый набор размеченных записей и отдельное дообучение.
  kind: open
  reference: Телефонный канал, шум, перебивания и акценты меняют распределение входных сигналов по сравнению со студийными записями. Экстрактор и особенно дообученная распознающая голова не обязательно обобщаются на такой доменный сдвиг, поэтому обычно собирали размеченное аудио из нового домена и заново дообучали голову или всю систему.
  id: 001-do-whisper-2
  fingerprint: 29dd107f
