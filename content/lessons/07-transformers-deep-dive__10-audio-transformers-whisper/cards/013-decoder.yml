- concept: в Whisper turbo декодер значительно мельче энкодера
  question: Как архитектура Whisper turbo отличается от остальных размеров семейства?
  explanation: У большинства размеров Whisper глубина энкодера и декодера совпадает. В turbo энкодер сохраняет 32 слоя, тогда как декодер сокращён до 4 слоёв.
  kind: choice
  options:
    - Глубоким остаётся энкодер, а декодер содержит значительно меньше слоёв
    - Глубоким остаётся декодер, а энкодер содержит значительно меньше слоёв
    - Энкодер и декодер сохраняют одинаковую глубину, но лишаются позиционного кодирования
    - Авторегрессивный декодер полностью заменён классификатором
