- concept: галлюцинации Whisper на тишине возникают из-за влияния выученного языкового распределения при отсутствии речевого сигнала
  question: Почему Whisper может сгенерировать правдоподобную фразу на длинном участке тишины?
  explanation: Нулевой паддинг обеспечивает правильную форму входа, но не гарантирует пустую транскрипцию. Когда полезного речевого сигнала нет, выученные декодером частые фразы могут получить высокую вероятность и превратиться в галлюцинацию.
  kind: open
  reference: На тишине акустический вход почти не подсказывает декодеру, какой текст выбрать. Поскольку модель редко обучалась выдавать пустой результат и усвоила частые текстовые последовательности, генерация может определяться её языковыми предпочтениями, а не звуком.
