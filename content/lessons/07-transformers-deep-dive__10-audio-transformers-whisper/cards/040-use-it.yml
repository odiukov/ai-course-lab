- concept: ленивый генератор faster-whisper откладывает основную работу до потребления сегментов
  question: API распознавания возвращает сегменты как ленивый генератор. Расположи действия так, чтобы измерить полное время расшифровки.
  explanation: Получение генератора ещё не означает завершение распознавания. В faster-whisper вычисления выполняются по мере перебора segments, поэтому таймер нужно останавливать только после полного исчерпания генератора.
  kind: order
  items:
    - Запустить таймер
    - Вызвать transcribe и получить генератор сегментов
    - Полностью перебрать генератор сегментов
    - Остановить таймер
  id: 040-use-it-2
  fingerprint: 11dbe084
