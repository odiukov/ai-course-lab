- concept: скалярная энергия кадра теряет распределение сигнала по частотам
  question: Почему одной энергии на аудиокадр недостаточно для полноценного распознавания речи, даже если она хорошо отражает громкость?
  explanation: Сумма квадратов сохраняет общую интенсивность кадра, но уничтожает сведения о частотном составе. Для различения речевых звуков важно знать не только общую энергию, но и её распределение по частотным диапазонам.
  kind: open
  reference: Энергия сворачивает весь кадр в одно число и не показывает, в каких частотных диапазонах сосредоточен сигнал. Поэтому звуки с одинаковой энергией, но разным спектром могут получить одинаковый признак, тогда как мел-спектральные бины помогают их различить.
  id: 036-energiya-2
