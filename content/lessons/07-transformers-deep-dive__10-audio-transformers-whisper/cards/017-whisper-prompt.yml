- concept: порядок обязательных токенов в управляющем префиксе Whisper
  question: Расположи обязательные элементы префикса декодера Whisper в правильном порядке.
  explanation: Префикс начинается с маркера начала транскрипции, после него указывается язык, а затем задача. Декодер обучался видеть управляющие токены именно в таком порядке.
