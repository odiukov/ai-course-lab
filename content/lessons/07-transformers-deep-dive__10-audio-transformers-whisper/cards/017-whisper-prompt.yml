- concept: префикс Whisper представляется списком отдельных строковых токенов
  question: Какое представление результата `whisper_prompt` позволяет затем независимо преобразовать каждый служебный токен в идентификатор словаря?
  explanation: Токенизатор должен получить отдельные служебные токены. Склеенная строка меняет границы элементов и может быть разобрана не как ожидаемая последовательность специальных токенов.
