- concept: квантование уменьшает расход памяти снижением разрядности весов без удаления слоёв
  question: Почему после целочисленного квантования модель занимает меньше памяти, хотя её архитектура остаётся прежней?
  explanation: При квантовании число весов и структура модели не меняются. В режиме int8_float16 веса представлены восьмибитными целыми вместо шестнадцатибитных чисел, поэтому для них требуется примерно вдвое меньше памяти.
  kind: choice
  options:
    - Из модели удаляются целые слои энкодера
    - Каждый вес хранится с меньшей точностью и требует меньше памяти
    - Звуковой файл сжимается перед загрузкой модели
    - Декодер перестаёт генерировать текст авторегрессивно
  correct: 1
  id: 041-int8-vad-1
  fingerprint: 0b84a368
- concept: VAD перед распознаванием отсекает неречевые интервалы и снижает риск галлюцинаций на тишине
  question: Объясни, почему фильтрация аудио детектором голосовой активности до запуска Whisper уменьшает вероятность появления фраз, которых никто не произносил.
  explanation: Параметр vad_filter=True исключает тишину до распознавания. Whisper получает главным образом речевые участки и реже пытается сгенерировать правдоподобный текст там, где акустического содержания нет.
  kind: open
  reference: VAD находит интервалы без речи и не передаёт их модели. На тишине у Whisper мало акустических свидетельств, поэтому авторегрессивный декодер может продолжить генерацию, опираясь на выученное языковое распределение. Удаление таких интервалов устраняет источник этих галлюцинаций.
  id: 041-int8-vad-2
  fingerprint: b95ff794
