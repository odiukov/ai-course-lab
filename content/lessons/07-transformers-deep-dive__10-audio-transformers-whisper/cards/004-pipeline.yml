- concept: порядок преобразований в полном конвейере распознавания Whisper
  question: Расположите этапы обработки аудиозаписи моделью Whisper в правильном порядке.
  explanation: Whisper сначала превращает аудио в log-mel-спектрограмму, затем сокращает её с 3000 до 1500 временных позиций. Энкодер однократно кодирует эту последовательность, декодер генерирует текст, а beam search выбирает лучший вариант.
  kind: order
  items:
    - Привести аудио к нужной частоте дискретизации и построить log-mel-спектрограмму
    - Сократить временную последовательность свёрточными слоями
    - Получить скрытые состояния аудио с помощью энкодера
    - Авторегрессивно сгенерировать текстовые токены декодером
    - Выбрать итоговую последовательность из кандидатов поиска
  id: 004-pipeline-1
  fingerprint: 2e1fdd14
- concept: энкодер вычисляется однократно, а декодер повторно используется при авторегрессивной генерации
  question: Что происходит при генерации всё более длинной расшифровки одного и того же аудиофрагмента?
  explanation: Энкодер один раз строит скрытые состояния всего аудиофрагмента. Затем авторегрессивный декодер многократно обращается к ним, каждый раз учитывая уже созданный текст и предсказывая следующий токен.
  kind: choice
  options:
    - Энкодер заново обрабатывает аудио перед каждым следующим токеном
    - Выход энкодера остаётся фиксированным, а декодер вызывается для каждого следующего токена
    - Декодер одним проходом независимо предсказывает все токены текста
    - Свёрточные слои повторно сжимают спектрограмму после каждого сгенерированного токена
  correct: 1
  id: 004-pipeline-2
  fingerprint: 0039ff1c
