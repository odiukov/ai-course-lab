- concept: криптографическая подпись обнаруживает изменение любого подписанного поля записи о согласии
  question: После подписания записи о согласии кто-то расширил разрешённую цель использования голоса, но оставил прежнюю подпись. Что должна показать проверка?
  explanation: Подпись вычисляется для всего содержимого записи. Изменение цели, даты, speaker_id или другого подписанного поля нарушает соответствие между записью и подписью.
  kind: choice
  options:
    - Проверка должна завершиться ошибкой, поскольку подписанное содержимое изменилось
    - Проверка должна пройти, поскольку сама подпись не менялась
    - Проверка должна пройти, если consent_id остался прежним
    - Система должна автоматически подписать изменённую запись заново
  correct: 0
  id: 034-consent-record-1
  fingerprint: 8f3b9ed9
- concept: speaker_id связывает подлинное согласие с конкретным голосом в референсном аудио
  question: Почему успешной проверки подписи записи о согласии недостаточно перед клонированием голоса и какую дополнительную проверку нужно выполнить?
  explanation: Валидную подписанную запись можно попытаться использовать вместе с чужим аудио. Сравнение speaker_id с отпечатком референса предотвращает такую подмену.
  kind: open
  reference: Подпись подтверждает целостность и подлинность самой записи, но не доказывает, что поданный ref_audio принадлежит указанному человеку. Нужно получить идентификатор или отпечаток диктора из ref_audio и сравнить его со speaker_id в подписанной записи; при несовпадении синтез следует отклонить.
  id: 034-consent-record-2
  fingerprint: f777f75e
