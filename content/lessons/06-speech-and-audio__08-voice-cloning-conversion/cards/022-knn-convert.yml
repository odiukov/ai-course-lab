- concept: матрица попарных косинусных сходств нормированных кадров вычисляется одним матричным произведением
  question: Заполни пропуск так, чтобы без цикла получить сходство каждого исходного кадра с каждым кадром целевого словаря.
  explanation: После нормирования скалярное произведение равно косинусному сходству. Умножение матрицы исходных кадров на транспонированную матрицу словаря сразу создаёт таблицу сходств для всех пар кадров.
  kind: cloze
  template: |-
    # Строки обеих матриц уже нормированы по длине
    similarity = ___
  answer: source_unit @ target_unit.T
  accept:
    - torch.matmul(source_unit, target_unit.T)
    - source_unit.matmul(target_unit.T)
    - source_unit @ target_unit.mT
  id: 022-knn-convert-1
  fingerprint: 9e1a7471
- concept: длинные участки тишины следует исключать из целевого KNN-словаря
  question: При конверсии многие речевые кадры неожиданно получают почти беззвучные целевые признаки. В целевых записях обнаружены длинные паузы. Как лучше исправить индекс для поиска соседей?
  explanation: Кадры тишины могут становиться частыми ближайшими соседями для разных исходных кадров, хотя не несут нужного фонетического материала. Фильтрация длительных неречевых участков не даёт им вытеснять речевые признаки из результатов поиска.
  kind: choice
  options:
    - 'Оставить паузы: они увеличивают фонетическое покрытие словаря'
    - Заменить признаки пауз случайными векторами той же размерности
    - Обнаружить и удалить длительные неречевые участки до построения индекса
    - Добавить в словарь ещё больше кадров тишины для устойчивого усреднения
  correct: 2
  id: 022-knn-convert-2
  fingerprint: 0489c4ac
