- concept: assert нельзя использовать для обязательной проверки согласия, поскольку оптимизированный режим Python удаляет такие проверки
  question: Сервис клонирования голоса проверяет согласие только выражением assert verify_consent(record). Что произойдёт при запуске Python в оптимизированном режиме?
  explanation: Оптимизированный режим Python удаляет assert. Обязательные проверки входных данных должны выполняться обычным условием с явным исключением и не зависеть от настроек оптимизации.
  kind: choice
  options:
    - Проверка выполнится, но AssertionError будет заменён на RuntimeError
    - Проверка исчезнет, и синтез сможет начаться без подтверждённого согласия
    - Проверка останется, но станет выполняться асинхронно
    - Интерпретатор откажется запускать программу с assert
  correct: 1
  id: 035-ne-assert-1
  fingerprint: 0d98344a
- concept: проверка разрешения должна завершиться до создания клонированного аудио
  question: Расположите действия безопасного пайплайна клонирования голоса в правильном порядке.
  explanation: 'Гейт обязан сработать до синтеза: после генерации запрещённый клон уже существует. Маркировка и выдача результата выполняются только после успешной проверки и создания аудио.'
  kind: order
  items:
    - Проверить, что предоставленное согласие действительно и применимо к запросу
    - Синтезировать аудио с клонированным голосом
    - Встроить в результат идентификатор согласия
    - Вернуть маркированное аудио вызывающему коду
  id: 035-ne-assert-2
  fingerprint: 323795d1
- concept: ожидаемый отказ по неверным входным данным следует обозначать доменным исключением, а не AssertionError
  question: Почему при недействительном согласии сервис клонирования голоса должен выбрасывать ConsentError или аналогичное доменное исключение, а не AssertionError?
  explanation: AssertionError обычно означает дефект программы или нарушение предполагаемого инварианта. Отдельный тип исключения явно сообщает, что система исправна и намеренно отклонила запрос.
  kind: open
  reference: Недействительное согласие — ожидаемый вариант входных данных, а не нарушение внутреннего инварианта программы. Доменное исключение позволяет вызывающему коду отличить корректный отказ от программной ошибки и обработать его без попытки «починить» или автоматически повторить запрещённую операцию.
  id: 035-ne-assert-3
  fingerprint: ff96bcfc
