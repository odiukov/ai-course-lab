- concept: bit_accuracy не определена для пустого payload
  question: Почему функция bit_accuracy должна отклонять две пустые последовательности, а не считать их идеально совпавшими?
  explanation: Пустой вход приводит к делению на ноль и не содержит ни одной позиции, по которой можно оценить восстановление. Такой случай нужно обрабатывать отдельной ошибкой, а не превращать в значение от 0.0 до 1.0.
  kind: open
  reference: 'Метрика является долей совпавших позиций: число совпадений делится на длину payload. Для пустых последовательностей знаменатель отсутствует, поэтому результат математически не определён, а формальное равенство пустых списков ничего не говорит о восстановлении водяного знака.'
  id: 031-bit-accuracy-3
  fingerprint: 4af992eb
