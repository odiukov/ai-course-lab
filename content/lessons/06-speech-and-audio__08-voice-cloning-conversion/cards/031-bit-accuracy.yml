- concept: явная проверка равенства длин предотвращает расчёт точности по обрезанным данным
  question: Заполни условие, которое не позволит функции молча сравнить только общую часть последовательностей.
  explanation: Обычный zip останавливается вместе с более короткой последовательностью. Без явной проверки функция могла бы выдать правдоподобную точность, проигнорировав недостающие биты.
  kind: cloze
  template: |-
    def bit_accuracy(expected, detected):
        if ___:
            raise ValueError("Payload lengths differ")
  answer: len(expected) != len(detected)
  accept:
    - len(detected) != len(expected)
  id: 031-bit-accuracy-1
  fingerprint: 59a1b5d9
- concept: для независимых равновероятных битов случайное совпадение задаёт середину шкалы bit_accuracy
  question: Детектор выдал независимые случайные биты с равными вероятностями обоих значений. Как интерпретировать ожидаемую bit_accuracy относительно истинного payload?
  explanation: Каждый случайный бит совпадает с истинным с вероятностью 0.5, поэтому для 32 позиций ожидается около 16 совпадений. Значение около 0.5 соответствует шуму, а не частично сохранившемуся знаку.
  kind: choice
  options:
    - Она будет близка к уровню случайных совпадений и не подтвердит наличие водяного знака
    - Она будет близка к нижней границе шкалы и надёжно подтвердит отсутствие водяного знака
    - Она будет близка к верхней границе шкалы и подтвердит успешное восстановление водяного знака
  correct: 0
  id: 031-bit-accuracy-2
