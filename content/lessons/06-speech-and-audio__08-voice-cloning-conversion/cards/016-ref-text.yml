- concept: подготовка точной транскрипции референсного аудио сочетает автоматическое распознавание и ручную сверку
  question: Расположите действия подготовки ref_text в правильном порядке.
  explanation: Автоматическое распознавание ускоряет получение черновика, но не гарантирует буквального совпадения. Перед синтезом нужно вручную проверить слова и знаки препинания, поскольку они участвуют в выравнивании текста с аудио.
  kind: order
  items:
    - Получить черновую расшифровку референсной записи с помощью распознавания речи
    - Сверить расшифровку с аудио и исправить слова и пунктуацию в соответствии с фактическим произнесением
    - Передать проверенную расшифровку модели как ref_text
  id: 016-ref-text-2
  fingerprint: 5cb7420b
