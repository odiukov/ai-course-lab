- concept: zero-shot синтез использует голос нового диктора без изменения весов TTS-модели
  question: Как получить речь голосом нового диктора в zero-shot системе клонирования?
  explanation: В zero-shot режиме референс служит входом для speaker encoder, а полученный эмбеддинг задаёт голос при синтезе. Веса TTS-модели не дообучаются и не изменяются.
  kind: choice
  options:
    - Дообучить TTS-модель на референсной записи, а затем удалить speaker encoder
    - Извлечь speaker embedding из референса и передать его вместе с текстом в неизменяемую TTS-модель
    - Передать референсную запись непосредственно вокодеру вместо mel-спектрограммы
    - Заменить параметры TTS-модели координатами speaker embedding
  correct: 1
  id: 007-zero-shot-1
  fingerprint: d85c81e8
- concept: поток данных в recognition-synthesis пайплайне клонирования голоса
  question: Расположи операции пайплайна клонирования голоса в правильном порядке.
  explanation: Speaker encoder сначала превращает референс в представление голоса. TTS использует текст и это представление для построения mel-спектрограммы, после чего вокодер преобразует её в звуковую волну.
  kind: order
  items:
    - Извлечь speaker embedding из референсного аудио
    - Передать текст и speaker embedding в TTS-модель
    - Получить mel-спектрограмму синтезируемой речи
    - Преобразовать mel-спектрограмму в аудиосигнал вокодером
  id: 007-zero-shot-2
  fingerprint: 81a013b1
