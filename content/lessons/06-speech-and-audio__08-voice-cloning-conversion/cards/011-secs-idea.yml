- concept: SECS вычисляется как косинус между эмбеддингами целевого диктора и клона
  question: Заполни знаменатель формулы косинусного сходства эмбеддингов.
  explanation: Скалярное произведение делят на произведение норм векторов. Поэтому SECS сравнивает направления эмбеддингов, не смешивая сходство с их масштабом.
  kind: cloze
  template: SECS(a, b) = (a · b) / ___
  answer: (||a|| · ||b||)
  accept:
    - '||a|| · ||b||'
    - '||a||||b||'
    - произведение норм a и b
  id: 011-secs-idea-1
  fingerprint: 22b6646d
- concept: SECS оценивает сходство личности диктора, но не качество или подлинность аудио
  question: У клона B значение SECS выше, чем у клона A, при сравнении с одним целевым диктором. Какой вывод обоснован?
  explanation: SECS показывает сходство speaker-эмбеддингов цели и клона. Более высокое значение говорит о большем сходстве голоса с точки зрения энкодера, но не гарантирует чистоту, разборчивость или естественное происхождение записи.
  kind: choice
  options:
    - Клон B обязательно звучит чище и разборчивее
    - Speaker encoder считает голос клона B более похожим на голос цели
    - Клон B гарантированно записан человеком, а не синтезирован
  correct: 1
  id: 011-secs-idea-2
  fingerprint: f6873cd9
