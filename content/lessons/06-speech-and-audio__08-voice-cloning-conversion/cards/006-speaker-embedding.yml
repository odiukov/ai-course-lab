- concept: нормирование speaker embedding до единичной длины устраняет влияние масштаба вектора
  question: Заполни пропуск так, чтобы получить speaker embedding единичной евклидовой длины.
  explanation: Деление вектора на его евклидову норму оставляет направление и убирает масштаб. После этого скалярное произведение нормированных эмбеддингов совпадает с их косинусной близостью.
  kind: cloze
  template: embedding = raw_embedding / torch.linalg.vector_norm(___)
  answer: raw_embedding
  accept:
    - raw_embedding
