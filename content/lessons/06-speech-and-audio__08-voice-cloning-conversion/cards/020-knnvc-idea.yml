- concept: KNN-VC переносит новый целевой голос заменой набора поиска без обновления весов модели
  question: Нужно переключить KNN-VC на нового целевого диктора. Что для этого требуется изменить?
  explanation: 'KNN-VC — непараметрический метод: целевой голос задаётся набором покадровых признаков, а не новыми весами. Для другого диктора достаточно построить новый набор из его записей.'
  kind: choice
  options:
    - Заменить набор целевых записей, по кадрам которого выполняется поиск
    - Дообучить WavLM на совместных записях исходного и целевого дикторов
    - Вычислить один глобальный speaker embedding и добавить его ко всем кадрам
    - Обновить веса модели на транскрипциях речи нового диктора
  correct: 0
  id: 020-knnvc-idea-1
  fingerprint: 7f300df1
- concept: покадровая конверсия в KNN-VC выполняется через поиск ближайших целевых эмбеддингов
  question: Расположи операции KNN-VC в правильном порядке.
  explanation: WavLM сначала переводит обе стороны в пространство покадровых признаков. Затем каждый исходный кадр независимо сопоставляется с ближайшим кандидатом из целевого набора, после чего выбранная последовательность превращается в аудио.
  kind: order
  items:
    - Получить с помощью WavLM покадровые эмбеддинги исходной речи и целевых записей
    - Для каждого исходного эмбеддинга найти ближайший эмбеддинг в целевом наборе
    - Заменить исходные кадры выбранными целевыми представлениями и собрать выходной звук
  id: 020-knnvc-idea-2
  fingerprint: 8c77776f
- concept: качество KNN-VC ограничено фонетическим покрытием целевого набора
  question: Почему добавление фонетически разнообразных записей целевого диктора может уменьшить ошибки KNN-VC на редких звуках?
  explanation: Ближайший сосед существует даже при плохом совпадении. Поэтому отсутствие нужного звука не останавливает конверсию, а приводит к приблизительной подстановке; расширение покрытия целевого набора снижает вероятность такой ошибки.
  kind: open
  reference: Алгоритм способен выбирать только среди кадров, присутствующих в целевом наборе. Если подходящего звука там нет, поиск всё равно возвращает ближайший, но фонетически неточный кадр. Новые разнообразные записи добавляют более подходящих кандидатов.
  id: 020-knnvc-idea-3
  fingerprint: 81dadb7b
