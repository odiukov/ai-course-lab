- concept: сохранение временного порядка исходных кадров переносит в конвертированную речь последовательность звуков, длительности и паузы
  question: Для каждого кадра исходной речи найдены подходящие признаки целевого голоса. Почему нельзя случайно перемешать эти признаки перед подачей в вокодер, даже если каждый из них по отдельности хорошо подобран?
  explanation: KNN-поиск подменяет признаки каждого кадра, но не его временную позицию. Именно сохранённая последовательность позиций переносит слова, ритм и паузы исходной записи, а вокодер превращает упорядоченные признаки обратно в волну.
  kind: open
  reference: Положение кадра во временной последовательности задаёт, какой звук и в какой момент должен прозвучать. Перемешивание разрушит порядок фонетического содержания, длительности и паузы, поэтому вокодер соберёт не исходное высказывание, а беспорядочную последовательность звуков.
  id: 021-knnvc-kadry-2
