- concept: consent gate должен проверять разрешение на конкретное использование голоса и сохранять защищённое от подделки доказательство
  question: Объясните своими словами, что должен проверить и зафиксировать consent gate перед клонированием человеческого голоса.
  explanation: 'Согласие — не общий флаг доступа: оно связывает человека, разрешённую цель и факт авторизации. Защищённый журнал делает эту связь проверяемой, а отказ по умолчанию не позволяет сначала создать аудио и разбираться с разрешением после.'
  kind: open
  reference: Система должна проверить наличие подлинного согласия владельца голоса, его область действия и соответствие запрошенной цели. До синтеза она сохраняет проверяемую запись о том, кто дал разрешение, на какое использование и когда; журнал должен позволять обнаружить подделку или изменение записи. При отсутствии подходящего согласия клонирование отклоняется.
  id: 025-zakon-2
