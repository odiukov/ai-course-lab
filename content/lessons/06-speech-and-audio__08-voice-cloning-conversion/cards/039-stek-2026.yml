- concept: детектор синтетической речи дополняет проверку согласия при приёме голосового референса
  question: Почему подписанного согласия недостаточно при приёме референсного аудио для сервиса клонирования голоса?
  explanation: Гейт согласия проверяет полномочия и разрешённое использование, а Wav2Vec2-AASIST оценивает происхождение входного аудио. Эти проверки закрывают разные угрозы и должны применяться совместно.
  kind: open
  reference: Согласие подтверждает разрешение на использование голоса, но не доказывает, что присланное аудио является естественной записью. Пользователь может передать уже синтезированный или клонированный чужой голос, поэтому входной файл нужно дополнительно проверять детектором синтетической речи.
