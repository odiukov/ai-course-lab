- concept: заведомо немаркированное аудио служит отрицательным контролем для оценки ложных срабатываний детектора
  question: Почему перед использованием детектора водяного знака его нужно проверить на заведомо немаркированной записи?
  explanation: Из любой записи можно попытаться декодировать биты, но это ещё не доказывает наличие осмысленного знака. Проверка на отрицательном контроле выявляет ложноположительные срабатывания и помогает оценить пригодность порога уверенности.
  kind: open
  reference: Отрицательный контроль показывает, не принимает ли детектор обычный шум и артефакты кодека за водяной знак. Если уверенность на чистом аудио высока, порог или сам детектор не позволяют надёжно отличать размеченные записи от немаркированных.
  id: 029-detect-watermark-3
  fingerprint: '81804068'
