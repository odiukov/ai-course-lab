- concept: отсутствие водяного знака представляется отдельным значением, не пересекающимся с допустимыми идентификаторами
  question: Заполни ветку результата детектора так, чтобы отсутствие знака нельзя было спутать с допустимой полезной нагрузкой.
  explanation: 'None однозначно означает отсутствие нагрузки. Подстановка фиктивного числового значения опасна: оно может оказаться допустимым идентификатором и ошибочно связаться с реальной записью в журнале согласий.'
