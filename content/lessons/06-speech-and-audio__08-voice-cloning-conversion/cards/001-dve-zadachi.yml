- concept: при voice conversion содержание и личность диктора берутся из разных источников
  question: Алиса произнесла реплику, но результат должен звучать голосом Бориса. Объясни, какие компоненты система должна взять из исходной записи и из референса Бориса.
  explanation: Voice conversion опирается на раздельные представления content, speaker и prosody. Замена speaker-представления меняет воспринимаемого диктора, не требуя менять извлечённое содержание.
  kind: open
  reference: Из записи Алисы извлекают речевое содержание, а также при необходимости сохраняемую просодию. Из референса Бориса получают представление диктора. Синтезатор объединяет содержание с голосовой идентичностью Бориса, поэтому смысл реплики сохраняется, а голос меняется.
