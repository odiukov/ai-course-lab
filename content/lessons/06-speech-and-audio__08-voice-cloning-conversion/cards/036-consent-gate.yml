- concept: consent gate должен закрываться при ошибках и неоднозначных входных данных
  question: Как consent gate должен обрабатывать пустой журнал, неизвестного диктора или дату, которую невозможно разобрать, и почему?
  explanation: 'Это fail-closed поведение: отсутствие доказанного разрешения трактуется как запрет. Иначе сбой парсинга или неполный журнал могли бы случайно открыть путь к клонированию.'
  kind: open
  reference: Во всех случаях нужно отказать в генерации и вернуть конкретную причину. Разрешение допустимо только после успешной проверки явной записи согласия; ошибка данных не является неявным согласием.
  id: 036-consent-gate-2
  fingerprint: '76961620'
- concept: результат consent gate должен сохранять идентификатор разрешения при успехе и различимую причину при отказе
  question: Какой контракт результата consent gate лучше всего поддерживает последующий аудит генераций?
  explanation: consent_id связывает разрешённую генерацию с проверенной записью согласия и может попасть в лог и payload водяного знака. Раздельные причины отказа позволяют отличать отсутствие записи, неверную подпись, истечение срока, несовпадение назначения и отзыв.
  kind: choice
  options:
    - При успехе вернуть consent_id, а при отказе — структурированную причину
    - Во всех случаях вернуть только логическое значение
    - При успехе вернуть speaker_id, а все отказы обозначить одной общей ошибкой
    - Всегда возвращать найденную запись независимо от результата проверок
  correct: 0
  id: 036-consent-gate-3
  fingerprint: '79380e48'
