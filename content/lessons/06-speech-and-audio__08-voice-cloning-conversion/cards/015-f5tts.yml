- concept: высокоуровневый вызов infer скрывает извлечение голосовых признаков из референса
  question: Почему при работе с высокоуровневым API клонирования голоса перед вызовом infer не обязательно вручную вычислять и передавать speaker embedding?
  explanation: Извлечение голосового представления и его передача синтезатору инкапсулированы внутри infer. Пользователь задаёт образец, его расшифровку и новый текст, не управляя промежуточным вектором напрямую.
  kind: open
  reference: infer сам обрабатывает референсное аудио, извлекает нужные признаки голоса и использует их как условие при синтезе новой реплики.
