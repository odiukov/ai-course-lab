- concept: слишком ёмкое латентное узкое место допускает утечку тембра и ослабляет влияние speaker embedding
  question: Декодер автоэнкодера получает покадровый латентный код и отдельный speaker embedding. После увеличения ёмкости латентного кода реконструкция улучшилась, но при подмене speaker embedding голос остался похож на исходного диктора. Какова наиболее вероятная причина?
  explanation: Ёмкий латентный канал может передать не только содержание и просодию, но и признаки исходного голоса. Тогда реконструкция получается хорошей, однако декодеру незачем опираться на отдельный speaker embedding, и его подмена слабо меняет диктора.
  kind: choice
  options:
    - Speaker embedding не способен представлять личность диктора без полной копии исходной волны
    - Латентный код начал переносить тембр, поэтому декодер научился почти не использовать speaker embedding
    - Вокодер неизбежно возвращает тембр исходного диктора при любом латентном коде
    - Декодеру не хватает ASR-транскрипции исходной речи
  correct: 1
  id: 018-disentangle-1
  fingerprint: '75904193'
- concept: минимизация ошибки реконструкции сама по себе не гарантирует disentanglement латентных факторов
  question: Объясни своими словами, почему низкая ошибка реконструкции автоэнкодера ещё не доказывает, что содержание, диктор и просодия разделены в латентном пространстве.
  explanation: У реконструкционной цели существует множество решений. Среди них есть как полезное разделение факторов, так и обходные решения с передачей всех признаков через один код. Поэтому качество реконструкции и качество disentanglement необходимо проверять раздельно.
  kind: open
  reference: Ошибка реконструкции проверяет только совпадение восстановленного аудио с исходным, но не определяет, где и в каком виде закодирован каждый фактор. Автоэнкодер может получить ту же низкую ошибку с запутанным представлением, в котором латентный код одновременно несёт содержание, тембр и просодию. Для разделения нужны ограничения архитектуры, например узкое место и отдельное условие на диктора, а иногда дополнительные функции потерь.
  id: 018-disentangle-2
  fingerprint: 6974b336
