- concept: speaker embedding является необратимым представлением личности диктора, а не сжатой копией исходной записи
  question: Почему по speaker embedding нельзя восстановить точные слова и исходную звуковую волну?
  explanation: Вектор из 192 чисел специально сохраняет устойчивые признаки диктора и отбрасывает детали конкретного фрагмента. Поскольку разные фразы одного человека могут дать почти одинаковый вектор, однозначного обратного преобразования в исходное аудио не существует.
  kind: open
  reference: Множество записей одного диктора отображается в близкие эмбеддинги независимо от произнесённых слов, интонации и фонового шума. Такое отображение теряет информацию и является многозначным в обратную сторону, поэтому эмбеддинг задаёт признаки голоса, но не позволяет восстановить конкретную запись.
  id: 005-speaker-encoder-2
  fingerprint: 2a3aabc4
