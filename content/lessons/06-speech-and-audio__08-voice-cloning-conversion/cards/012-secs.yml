- concept: эмбеддинги разных speaker encoder лежат в несовместимых координатных пространствах
  question: Эталонную запись обработали одним speaker encoder, а синтезированную — другим. Оба энкодера возвращают векторы одинаковой размерности. Можно ли интерпретировать косинус между ними как сходство голосов?
  explanation: Одинаковая размерность векторов не означает одинакового смысла их координат. Для содержательного сравнения обе записи нужно обработать одним и тем же speaker encoder с согласованным препроцессингом.
  kind: choice
  options:
    - Да, одинаковая размерность гарантирует совместимость эмбеддингов
    - Да, если независимо нормировать оба эмбеддинга
    - Нет, энкодеры могли выучить разные системы координат
  correct: 2
  id: 012-secs-1
  fingerprint: 96cea8fe
- concept: отложенная запись целевого диктора проверяет перенос сходства за пределы референсного промпта
  question: Почему при оценке сходства клона с целевым диктором желательно использовать настоящую запись, которая не служила голосовым промптом для генерации?
  explanation: Совпадение с тем же промптом может быть завышено из-за копирования его акустических деталей. Независимая запись лучше измеряет, переносится ли сходство голоса на другой речевой материал.
  kind: open
  reference: Отложенная запись позволяет проверить, воспроизвёл ли клон устойчивые признаки личности диктора, а не особенности конкретного референсного фрагмента.
  id: 012-secs-2
  fingerprint: 4016e0bf
