- concept: битовая точность вычисляется по всем позициям полезной нагрузки во всём наборе файлов
  question: Детектор обработал 8 аудиофайлов с полезной нагрузкой длиной 40 бит. Всего он ошибся в 9 битовых позициях. Какова общая битовая точность в процентах?
  explanation: Всего проверено 8 × 40 = 320 бит, из них совпал 311. Поэтому битовая точность равна 311 / 320 × 100% ≈ 97.19%.
  kind: numeric
  answer: 97.19
  tolerance: 0.01
  id: 030-bit-accuracy-idea-1
  fingerprint: 56d0e56f
- concept: битовая точность различает близкое к правильному восстановление и сильное повреждение при одинаковой полной детекции
  question: Две схемы водяных знаков после сжатия показали одинаковую долю полностью восстановленных 24-битных payload — 87.5%. В ошибочных файлах схема A в среднем восстанавливает 23 бита из 24, а схема B — 12 бит из 24. Какой вывод обоснован?
  explanation: Полная детекция у схем одинакова, но побитовая метрика раскрывает характер отказов. У схемы A повреждено мало позиций, тогда как результат схемы B близок к случайному угадыванию каждого бита.
  kind: choice
  options:
    - 'Схема A сохраняет больше информации о payload: её неудачные результаты ближе к полному восстановлению'
    - Схемы одинаково устойчивы, поскольку доля полностью восстановленных payload совпадает
    - Схема B устойчивее, поскольку большее число ошибочных бит облегчает детекцию
  correct: 0
  id: 030-bit-accuracy-idea-2
  fingerprint: 0c071a60
