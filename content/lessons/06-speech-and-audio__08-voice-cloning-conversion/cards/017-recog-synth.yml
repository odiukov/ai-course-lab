- concept: мягкий PPG сохраняет фонетическую неопределённость вместо преждевременного выбора одной фонемы
  question: Объясни своими словами, почему для voice conversion синтезатору полезнее передать распределение вероятностей по фонемам для каждого кадра, чем только наиболее вероятную фонему.
  explanation: PPG содержит мягкие апостериорные вероятности фонем кадр за кадром. Это сохраняет неопределённость распознавания и позволяет последующему синтезатору использовать больше информации, чем даёт последовательность жёстко выбранных меток.
  kind: open
  reference: Распределение сохраняет альтернативные фонетические гипотезы и степень уверенности ASR. Синтезатор получает более богатое и устойчивое описание содержания, тогда как жёсткий выбор одной фонемы необратимо превращает даже небольшую ошибку распознавания в неверное условие синтеза.
  id: 017-recog-synth-2
  fingerprint: 5019519d
