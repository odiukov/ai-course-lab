- concept: последовательность преобразований в neural codec TTS
  question: Расположите этапы генерации речи с клонированием голоса в neural codec TTS.
  explanation: SoundStream или EnCodec превращает референс в дискретные токены. Модель продолжает эту последовательность с учётом текста, а декодер кодека восстанавливает из новых токенов аудио.
  kind: order
  items:
    - Закодировать референсную запись в последовательность дискретных аудиотокенов
    - Подать текст и аудиотокены референса как условие для модели
    - Предсказать продолжение последовательности аудиотокенов
    - Декодировать предсказанные токены обратно в звуковую волну
  id: 023-codec-tts-1
  fingerprint: 91cb03e4
- concept: клонирование тембра как следствие условного продолжения аудиотокенов
  question: Объясните, почему neural codec TTS может продолжить речь тем же голосом, не используя отдельный speaker encoder или явный идентификатор диктора.
  explanation: В такой архитектуре голос не обязан быть вынесен в отдельный фиксированный вектор. Он присутствует в последовательности токенов референса вместе с остальными характеристиками звука, а модель учится строить согласованное с ними продолжение.
  kind: open
  reference: Аудиотокены промпта уже содержат тембр, особенности произношения и другие акустические признаки. Предсказывая продолжение с условием на этот префикс, модель сохраняет статистически согласованные признаки голоса. Поэтому клонирование возникает как свойство задачи продолжения токенов, а не как отдельная операция копирования диктора.
  id: 023-codec-tts-2
  fingerprint: df8c04c4
