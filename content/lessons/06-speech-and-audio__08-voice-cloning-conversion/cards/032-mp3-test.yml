- concept: устойчивость аудиоводяного знака проверяется после полного прохождения через целевой канал преобразования
  question: Расположите операции испытания аудиоводяного знака на устойчивость к сжатию с потерями.
  explanation: Детектор нужно запускать на сигнале после полного цикла кодирования и декодирования. Проверка исходного маркированного файла показывает лишь корректность встраивания, но не живучесть знака в реальном канале распространения.
  kind: order
  items:
    - Встроить полезную нагрузку в исходное аудио
    - Закодировать маркированное аудио целевым кодеком
    - Раскодировать сжатый файл обратно в аудиосигнал
    - Запустить детектор на восстановленном сигнале и сравнить биты
  id: 032-mp3-test-2
  fingerprint: 517d321d
- concept: обучение с моделированием искажений повышает устойчивость водяного знака к реальным преобразованиям аудио
  question: Объясните своими словами, зачем при обучении системы аудиоводяных знаков пропускать маркированный сигнал через сжатие, шум и другие искажения перед восстановлением полезной нагрузки.
  explanation: Если обучать систему только на чистом аудио, она может выбрать хрупкий способ встраивания. Моделирование канала превращает устойчивость к ожидаемым искажениям в непосредственную цель обучения.
  kind: open
  reference: Такое обучение заставляет кодировщик размещать информацию в компонентах сигнала, которые сохраняются после типичных преобразований, а декодер — восстанавливать её из уже искажённого аудио. В результате система оптимизируется не только для чистого исходника, но и для реального канала распространения.
  id: 032-mp3-test-3
  fingerprint: 0c244d76
