- concept: speaker обычно задаётся глобально для фрагмента, а content и prosody меняются во времени
  question: Какое представление факторов речи наиболее естественно для фрагмента с одним диктором?
  explanation: Личность одного диктора обычно кодируется глобальным эмбеддингом. Последовательность звуков и манера их произнесения меняются по ходу фразы, поэтому content и prosody представлены во времени.
  kind: choice
  options:
