- concept: утечка просодии в speaker-эмбеддинг связывает манеру произнесения с личностью диктора
  question: Почему нежелательно кодировать интонацию конкретной исходной фразы внутри speaker-эмбеддинга?
  explanation: Разделение факторов даёт независимое управление голосом и исполнением. Утечка просодии в speaker делает временные особенности фразы постоянной привычкой синтезированного диктора.
  kind: open
  reference: Speaker-эмбеддинг должен описывать устойчивые свойства голоса, а не манеру произнесения отдельной фразы. Если в него попадёт интонация, модель начнёт переносить эту манеру на другие тексты и не сможет независимо управлять диктором и просодией.
