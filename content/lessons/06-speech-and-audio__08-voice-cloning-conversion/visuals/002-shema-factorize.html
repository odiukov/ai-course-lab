<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Разложить, подменить диктора, собрать</title>
<style>
  :root{
    --bg:#faf9f6; --ink:#1c2430; --muted:#5b6674; --line:#3d4855;
    --box:#ffffff; --boxline:#8a95a3; --accent:#b23a1c; --dash:#a9b2bd;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12161c; --ink:#e8ecf2; --muted:#9aa6b4; --line:#c2cbd6;
      --box:#1c222b; --boxline:#6e7a89; --accent:#ff8a5c; --dash:#4d5865;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
  .wrap{padding:12px 14px 16px;box-sizing:border-box;}
  h2{font-size:16px;margin:0 0 8px;font-weight:600;letter-spacing:.01em;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .fallback{font-size:14px;line-height:1.5;color:var(--ink);max-width:60em;}
  .box{fill:var(--box);stroke:var(--boxline);}
  .flow{stroke:var(--line);fill:none;}
  .flow-head{fill:var(--line);stroke:none;}
  .swap{stroke:var(--accent);fill:none;}
  .swap-head{fill:var(--accent);stroke:none;}
  .cut{stroke:var(--accent);fill:none;}
  .divider{stroke:var(--dash);fill:none;stroke-dasharray:7 7;}
  text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink);font-size:15px;}
  text.small{fill:var(--muted);font-size:14px;}
  text.hot{fill:var(--accent);font-size:14px;}
  text.head{font-weight:600;}
</style>
</head>
<body>
<div class="wrap">
  <h2>Разложить, подменить диктора, собрать</h2>
  <div id="mount"></div>
</div>
<script>
(function(){
  var mount = document.getElementById('mount');
  try{
    /* ---- данные схемы (единственные литералы геометрии) ---- */
    var DATA = {
      view:{w:1160,h:460},
      head:1.6,
      boxes:[
        {x0:2 ,y0:5 ,x1:22,y1:12,label:'текст'},
        {x0:2 ,y0:22,x1:22,y1:29,label:'аудио A'},
        {x0:2 ,y0:34,x1:22,y1:41,label:'5 с голоса B'},
        {x0:44,y0:12,x1:60,y1:25,label:'разбор'},
        {x0:44,y0:33,x1:60,y1:42,label:'разбор'},
        {x0:84,y0:10,x1:96,y1:24,label:'сборка'}
      ],
      arrows:[
        {p:[[22,8.5],[33,8.5],[33,15],[44,15]],dir:'right',cls:'flow'},
        {p:[[22,25.5],[33,25.5],[33,20],[44,20]],dir:'right',cls:'flow'},
        {p:[[22,37.5],[44,37.5]],dir:'right',cls:'flow'},
        {p:[[60,13],[84,13]],dir:'right',cls:'flow'},
        {p:[[60,17],[84,17]],dir:'right',cls:'flow'},
        {p:[[60,21],[68,21]],dir:null,cls:'flow'},
        {p:[[60,37.5],[72,37.5],[72,21],[84,21]],dir:'right',cls:'swap'},
        {p:[[96,17],[100,17]],dir:'right',cls:'flow'}
      ],
      cut:{x:70,y:21,r:1.1},
      divider:{x:40,y0:2,y1:43},
      wave:{x0:100,x1:118,y:17,amp:4,period:9,steps:72},
      labels:[
        {x:2 ,y:3.5 ,t:'Клонирование',a:'start' ,dy:0 ,cls:'head'},
        {x:2 ,y:20.5,t:'Конверсия'   ,a:'start' ,dy:0 ,cls:'head'},
        {x:61,y:13 ,t:'содержание'   ,a:'start' ,dy:-7,cls:'small'},
        {x:61,y:17 ,t:'просодия'     ,a:'start' ,dy:-7,cls:'small'},
        {x:61,y:21 ,t:'диктор'       ,a:'start' ,dy:-7,cls:'small'},
        {x:70,y:21 ,t:'обрыв'        ,a:'middle',dy:20,cls:'hot'},
        {x:73,y:30 ,t:'подмена диктора',a:'start',dx:8,dy:0,cls:'hot'},
        {x:40,y:45.2,t:'правее — одинаково',a:'middle',dy:0,cls:'small'},
        {x:109,y:24,t:'выход — волна',a:'middle',dy:0,cls:'small'}
      ]
    };

    /* ---- единственная пара функций перевода ---- */
    var origin = {x:12,y:12}, scale = 9.5;
    var sx = function(x){ return origin.x + x*scale; };
    var sy = function(y){ return origin.y + y*scale; };

    var NS='http://www.w3.org/2000/svg';
    function el(n,at){var e=document.createElementNS(NS,n);
      for(var k in at) e.setAttribute(k,at[k]); return e;}

    var svg = el('svg',{viewBox:'0 0 '+DATA.view.w+' '+DATA.view.h,
      preserveAspectRatio:'xMidYMid meet',role:'img',
      'aria-label':'Две ветки входов сходятся в разбор на содержание, просодию и диктора; подменяется только линия диктора; сборка даёт волну'});
    svg.appendChild(el('rect',{x:0,y:0,width:DATA.view.w,height:DATA.view.h,fill:'var(--bg)'}));

    function label(L){
      var t=el('text',{x:sx(L.x)+(L.dx||0), y:sy(L.y)+(L.dy||0),
        'text-anchor':L.a});
      if(L.cls) t.setAttribute('class',L.cls);
      t.textContent=L.t; svg.appendChild(t);
    }

    /* боксы */
    DATA.boxes.forEach(function(b){
      svg.appendChild(el('rect',{class:'box','stroke-width':1.6,rx:6,
        x:sx(b.x0), y:sy(b.y0),
        width:sx(b.x1)-sx(b.x0), height:sy(b.y1)-sy(b.y0)}));
      label({x:(b.x0+b.x1)/2, y:(b.y0+b.y1)/2, t:b.label, a:'middle', dy:6});
    });

    /* разделитель «ладонь» */
    svg.appendChild(el('path',{class:'divider','stroke-width':1.6,
      d:'M'+sx(DATA.divider.x)+' '+sy(DATA.divider.y0)+
        ' L'+sx(DATA.divider.x)+' '+sy(DATA.divider.y1)}));

    /* стрелки */
    function headPts(p,dir){
      var h=DATA.head, x=p[0], y=p[1];
      if(dir==='right') return [[x,y],[x-h,y-h*0.55],[x-h,y+h*0.55]];
      return [[x,y],[x-h*0.55,y+h],[x+h*0.55,y+h]];
    }
    DATA.arrows.forEach(function(a){
      var d = a.p.map(function(p,i){return (i?'L':'M')+sx(p[0])+' '+sy(p[1]);}).join(' ');
      svg.appendChild(el('path',{class:a.cls,'stroke-width':2,
        'stroke-linejoin':'round','stroke-linecap':'round',d:d}));
      if(a.dir){
        var pts=headPts(a.p[a.p.length-1],a.dir)
          .map(function(p){return sx(p[0])+','+sy(p[1]);}).join(' ');
        svg.appendChild(el('polygon',{class:a.cls==='swap'?'swap-head':'flow-head',points:pts}));
      }
    });

    /* точка обрыва линии диктора */
    var c=DATA.cut;
    svg.appendChild(el('path',{class:'cut','stroke-width':2.4,'stroke-linecap':'round',
      d:'M'+sx(c.x-c.r)+' '+sy(c.y-c.r)+' L'+sx(c.x+c.r)+' '+sy(c.y+c.r)+
        ' M'+sx(c.x-c.r)+' '+sy(c.y+c.r)+' L'+sx(c.x+c.r)+' '+sy(c.y-c.r)}));

    /* выходная волна */
    var w=DATA.wave, pts=[];
    for(var i=0;i<=w.steps;i++){
      var x=w.x0+(w.x1-w.x0)*i/w.steps;
      var y=w.y+w.amp*Math.sin(2*Math.PI*(x-w.x0)/w.period);
      pts.push(sx(x)+','+sy(y));
    }
    svg.appendChild(el('polyline',{class:'flow','stroke-width':2,
      'stroke-linejoin':'round','stroke-linecap':'round',points:pts.join(' ')}));

    DATA.labels.forEach(label);
    mount.appendChild(svg);
  }catch(e){
    var f=document.createElement('div');
    f.className='fallback';
    f.textContent='Схема не построилась. Она должна показывать: слева две дорожки — '+
      'клонирование (вход «текст») и конверсия (вход «аудио A»), а под ними общий нижний '+
      'вход «5 с голоса B». Каждый вход проходит через блок разбора; сигнал распадается на '+
      'линии «содержание», «просодия» и «диктор». Линия «диктор» от верхнего входа обрывается, '+
      'и на её место приходит линия, вытянутая из пяти секунд B. Остальные линии идут в общий '+
      'блок сборки нетронутыми, выход — волна.';
    mount.appendChild(f);
  }
})();
</script>
</body>
</html>
