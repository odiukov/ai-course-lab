<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bias и variance при росте alpha</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fc;
      --panel: #ffffff;
      --plot: #fbfcff;
      --text: #172033;
      --muted: #647087;
      --axis: #34415a;
      --grid: #dfe4ee;
      --border: #d7dde8;
      --variance: #2877d4;
      --bias: #d65b55;
      --total: #7b4bc4;
      --noise: #8591a6;
      --zone: #edf7e8;
      --zone-text: #3e7134;
      --point-ring: #ffffff;
      --fallback: #fff4df;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #11151d;
        --panel: #171d28;
        --plot: #141a24;
        --text: #edf2fb;
        --muted: #a8b3c6;
        --axis: #cbd5e5;
        --grid: #30394a;
        --border: #394356;
        --variance: #6aafff;
        --bias: #ff8b84;
        --total: #bd91ff;
        --noise: #8e9bb0;
        --zone: #203521;
        --zone-text: #a8d99c;
        --point-ring: #171d28;
        --fallback: #302719;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .diagram {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
    }

    .heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 18px;
      padding: 15px 22px 10px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      font-weight: bold;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.3;
      text-align: right;
      white-space: nowrap;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 430px;
      background: var(--plot);
    }

    .plot-background {
      fill: var(--plot);
    }

    .balance-zone {
      fill: var(--zone);
    }

    .grid-line {
      stroke: var(--grid);
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
    }

    .axis-line {
      stroke: var(--axis);
      stroke-width: 1.5px;
      vector-effect: non-scaling-stroke;
    }

    .tick-line {
      stroke: var(--axis);
      stroke-width: 1.5px;
      vector-effect: non-scaling-stroke;
    }

    .curve {
      fill: none;
      stroke-width: 3.5px;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .curve-total {
      stroke: var(--total);
      stroke-width: 4.5px;
    }

    .curve-variance {
      stroke: var(--variance);
    }

    .curve-bias {
      stroke: var(--bias);
    }

    .noise-line {
      fill: none;
      stroke: var(--noise);
      stroke-width: 2px;
      stroke-dasharray: 7 7;
      vector-effect: non-scaling-stroke;
    }

    .point {
      stroke: var(--point-ring);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .point-total {
      fill: var(--total);
    }

    .point-variance {
      fill: var(--variance);
    }

    .point-bias {
      fill: var(--bias);
    }

    .minimum-ring {
      fill: var(--plot);
      stroke: var(--total);
      stroke-width: 3px;
      vector-effect: non-scaling-stroke;
    }

    .minimum-leader {
      stroke: var(--total);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    text {
      fill: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .tick-label {
      fill: var(--muted);
      font-size: 14px;
    }

    .axis-caption {
      fill: var(--muted);
      font-size: 14px;
    }

    .curve-label {
      font-size: 15px;
      font-weight: bold;
    }

    .label-total {
      fill: var(--total);
    }

    .label-variance {
      fill: var(--variance);
    }

    .label-bias {
      fill: var(--bias);
    }

    .noise-label {
      fill: var(--noise);
      font-size: 13px;
    }

    .minimum-label {
      fill: var(--total);
      font-size: 14px;
      font-weight: bold;
    }

    .zone-label {
      fill: var(--zone-text);
      font-size: 13px;
      font-weight: bold;
    }

    .edge-label {
      fill: var(--muted);
      font-size: 13px;
    }

    .fallback {
      margin: 18px;
      padding: 18px;
      background: var(--fallback);
      color: var(--text);
      font-size: 16px;
      line-height: 1.5;
      border: 1px solid var(--border);
    }

    @media (max-width: 620px) {
      .heading {
        display: block;
      }

      .subtitle {
        margin-top: 5px;
        text-align: left;
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <figure class="diagram" aria-labelledby="diagram-title">
    <header class="heading">
      <h1 id="diagram-title">Bias и variance при росте alpha</h1>
      <p class="subtitle">Полином 15-й степени · Ridge-регуляризация</p>
    </header>

    <svg id="chart"
         viewBox="0 0 900 430"
         width="900"
         height="430"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="svg-title svg-description">
      <title id="svg-title">Обмен между bias и variance при усилении регуляризации</title>
      <desc id="svg-description">
        На логарифмической оси alpha дисперсия убывает, квадрат смещения растёт,
        а суммарная ошибка достигает минимума между крайними значениями.
      </desc>
      <g id="plot"></g>
    </svg>

    <p id="fallback" class="fallback" hidden>
      При росте alpha variance убывает, bias² растёт, а суммарная ошибка
      минимальна между слишком слабой и слишком сильной регуляризацией.
    </p>
  </figure>

  <script>
    const series = [
      [
        "variance",
        "Дисперсия (variance)",
        [[0, 9.2], [1, 7.5], [2, 5.8], [3, 4], [4, 2.5], [5, 1.4]]
      ],
      [
        "bias",
        "Смещение² (bias²)",
        [[0, 0.8], [1, 1.2], [2, 2], [3, 3.5], [4, 5.8], [5, 8.8]]
      ],
      [
        "total",
        "Суммарная ошибка",
        [[0, 10.55], [1, 9.25], [2, 8.35], [3, 8.05], [4, 8.85], [5, 10.75]]
      ]
    ];

    const ticks = [
      [0, "0,001"],
      [1, "0,01"],
      [2, "0,1"],
      [3, "1"],
      [4, "10"],
      [5, "100"]
    ];

    const horizontalGrid = [2, 4, 6, 8, 10];
    const bounds = [-0.78, 5.76, 12.3, -5];
    const zone = [2.55, 3.45, 11.6, 0];
    const noise = [0, 5, 0.55];
    const axis = [0, 5.42, 11.6, -0.22];
    const pointSize = [0, 0.037, 0.064];
    const minimum = [3, 8.05, 7.32, 6.83];
    const captions = [
      [0, -4.42, "почти нет ограничения", "start"],
      [3, -4.42, "удачный баланс", "middle"],
      [5, -4.42, "сильное ограничение", "end"]
    ];
    const labelOffsets = [
      ["variance", 18, 5],
      ["bias", 18, 5],
      ["total", 18, 5]
    ];
    const scaleCaption = [2.5, -2.92, "Каждый шаг вправо — alpha в 10 раз больше"];
    const noiseCaption = [3.85, 0.55, "Неустранимый шум — постоянен", -11];
    const valueCaption = [0, 11.85, "Вклад в ошибку", 0];
    const tickPadding = [0, 25];
    const zoneCaption = [3, 10.98, "середина между крайностями", 0];

    const origin = Object.freeze({ x: 112, y: 310 });
    const scale = Object.freeze({ x: 116, y: -22 });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    (() => {
      const svg = document.getElementById("chart");
      const plot = document.getElementById("plot");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      try {
        const make = (tag, attributes, parent = plot, content = "") => {
          const node = document.createElementNS(namespace, tag);

          for (const [name, value] of Object.entries(attributes)) {
            node.setAttribute(name, String(value));
          }

          if (content) {
            node.textContent = content;
          }

          parent.appendChild(node);
          return node;
        };

        const [
          leftBound,
          rightBound,
          topBound,
          bottomBound
        ] = bounds;

        const [
          zoneLeft,
          zoneRight,
          zoneTop,
          zoneBottom
        ] = zone;

        const [
          axisStart,
          axisEnd,
          axisTop,
          tickBottom
        ] = axis;

        const [
          pointZero,
          pointRadius,
          minimumRadius
        ] = pointSize;

        make("rect", {
          class: "plot-background",
          x: sx(leftBound),
          y: sy(topBound),
          width: sx(rightBound) - sx(leftBound),
          height: sy(bottomBound) - sy(topBound)
        });

        make("rect", {
          class: "balance-zone",
          x: sx(zoneLeft),
          y: sy(zoneTop),
          width: sx(zoneRight) - sx(zoneLeft),
          height: sy(zoneBottom) - sy(zoneTop)
        });

        for (const level of horizontalGrid) {
          make("line", {
            class: "grid-line",
            x1: sx(axisStart),
            y1: sy(level),
            x2: sx(axisEnd),
            y2: sy(level)
          });
        }

        for (const [position] of ticks) {
          make("line", {
            class: "grid-line",
            x1: sx(position),
            y1: sy(axisStart),
            x2: sx(position),
            y2: sy(axisTop)
          });
        }

        const [noiseStart, noiseEnd, noiseLevel] = noise;

        make("line", {
          class: "noise-line",
          x1: sx(noiseStart),
          y1: sy(noiseLevel),
          x2: sx(noiseEnd),
          y2: sy(noiseLevel)
        });

        make("line", {
          class: "axis-line",
          x1: sx(0),
          y1: sy(0),
          x2: sx(axisEnd),
          y2: sy(0)
        });

        make("line", {
          class: "axis-line",
          x1: sx(0),
          y1: sy(0),
          x2: sx(0),
          y2: sy(axisTop)
        });

        const [tickDx, tickDy] = tickPadding;

        for (const [position, label] of ticks) {
          make("line", {
            class: "tick-line",
            x1: sx(position),
            y1: sy(0),
            x2: sx(position),
            y2: sy(tickBottom)
          });

          make("text", {
            class: "tick-label",
            x: sx(position) + tickDx,
            y: sy(0) + tickDy,
            "text-anchor": "middle"
          }, plot, label);
        }

        const orderedSeries = [
          series.find(([key]) => key === "total"),
          series.find(([key]) => key === "variance"),
          series.find(([key]) => key === "bias")
        ];

        for (const [key, label, values] of orderedSeries) {
          const points = values
            .map(([x, y]) => `${sx(x)},${sy(y)}`)
            .join(" ");

          make("polyline", {
            class: `curve curve-${key}`,
            points
          });

          for (const [x, y] of values) {
            make("circle", {
              class: `point point-${key}`,
              cx: sx(x),
              cy: sy(y),
              r: Math.abs(sx(pointRadius) - sx(pointZero))
            });
          }

          const [, lastPoint] = values.slice(-2);
          const [lastX, lastY] = lastPoint;
          const [, dx, dy] = labelOffsets.find(([name]) => name === key);

          make("text", {
            class: `curve-label label-${key}`,
            x: sx(lastX) + dx,
            y: sy(lastY) + dy,
            "text-anchor": "start"
          }, plot, label);
        }

        const [
          minimumX,
          minimumY,
          leaderEndY,
          minimumLabelY
        ] = minimum;

        make("circle", {
          class: "minimum-ring",
          cx: sx(minimumX),
          cy: sy(minimumY),
          r: Math.abs(sx(minimumRadius) - sx(pointZero))
        });

        make("line", {
          class: "minimum-leader",
          x1: sx(minimumX),
          y1: sy(minimumY),
          x2: sx(minimumX),
          y2: sy(leaderEndY)
        });

        make("text", {
          class: "minimum-label",
          x: sx(minimumX),
          y: sy(minimumLabelY),
          "text-anchor": "middle"
        }, plot, "Минимум суммарной ошибки");

        const [
          zoneLabelX,
          zoneLabelY,
          zoneLabelText,
          zoneLabelDy
        ] = zoneCaption;

        make("text", {
          class: "zone-label",
          x: sx(zoneLabelX),
          y: sy(zoneLabelY) + zoneLabelDy,
          "text-anchor": "middle"
        }, plot, zoneLabelText);

        const [
          noiseLabelX,
          noiseLabelY,
          noiseLabelText,
          noiseLabelDy
        ] = noiseCaption;

        make("text", {
          class: "noise-label",
          x: sx(noiseLabelX),
          y: sy(noiseLabelY) + noiseLabelDy,
          "text-anchor": "middle"
        }, plot, noiseLabelText);

        const [
          valueLabelX,
          valueLabelY,
          valueLabelText,
          valueLabelDy
        ] = valueCaption;

        make("text", {
          class: "axis-caption",
          x: sx(valueLabelX),
          y: sy(valueLabelY) + valueLabelDy,
          "text-anchor": "start"
        }, plot, valueLabelText);

        const [
          scaleLabelX,
          scaleLabelY,
          scaleLabelText
        ] = scaleCaption;

        make("text", {
          class: "axis-caption",
          x: sx(scaleLabelX),
          y: sy(scaleLabelY),
          "text-anchor": "middle"
        }, plot, scaleLabelText);

        for (const [x, y, text, anchor] of captions) {
          make("text", {
            class: anchor === "middle" ? "zone-label" : "edge-label",
            x: sx(x),
            y: sy(y),
            "text-anchor": anchor
          }, plot, text);
        }

        if (!Number.isFinite(sx(0)) || !Number.isFinite(sy(0))) {
          throw new Error("Некорректное преобразование координат");
        }
      } catch (error) {
        svg.hidden = true;
        fallback.hidden = false;
      }
    })();
  </script>
</body>
</html>
