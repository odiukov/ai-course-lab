<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>U-образная кривая тестовой ошибки</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f5f7fb;
      --surface: #ffffff;
      --text: #172033;
      --muted: #607086;
      --axis: #334155;
      --separator: #cbd5e1;
      --simple-band: #fff2df;
      --balance-band: #e8f7ee;
      --complex-band: #f9e8ef;
      --bias: #2563eb;
      --variance: #d97706;
      --total: #be185d;
      --minimum: #15803d;
      --halo: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111827;
        --surface: #182234;
        --text: #edf2f7;
        --muted: #aab7c8;
        --axis: #d7e0eb;
        --separator: #46566b;
        --simple-band: #3d3022;
        --balance-band: #20392d;
        --complex-band: #3d2632;
        --bias: #70a5ff;
        --variance: #f5ad49;
        --total: #fb75ae;
        --minimum: #69d38b;
        --halo: #182234;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    h1 {
      color: var(--text);
      font-size: 20px;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 440px;
      background: var(--surface);
      color: var(--text);
      font-size: 15px;
      shape-rendering: geometricPrecision;
    }

    .band-simple {
      fill: var(--simple-band);
    }

    .band-balance {
      fill: var(--balance-band);
    }

    .band-complex {
      fill: var(--complex-band);
    }

    .axis {
      fill: none;
      stroke: var(--axis);
      stroke-width: 2px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .axis-arrow {
      fill: var(--axis);
    }

    .separator {
      fill: none;
      stroke: var(--separator);
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
    }

    .minimum-guide {
      fill: none;
      stroke: var(--minimum);
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
    }

    .callout-leader {
      fill: none;
      stroke: var(--minimum);
      stroke-width: 2px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .curve {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .curve-bias {
      stroke: var(--bias);
      stroke-width: 3px;
    }

    .curve-variance {
      stroke: var(--variance);
      stroke-width: 3px;
    }

    .curve-total {
      stroke: var(--total);
      stroke-width: 4px;
    }

    .minimum-halo {
      fill: var(--halo);
      stroke: var(--minimum);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .minimum-dot {
      fill: var(--minimum);
    }

    .label {
      fill: var(--text);
    }

    .axis-label {
      fill: var(--text);
      font-size: 14px;
      font-weight: bold;
    }

    .tick-label {
      fill: var(--muted);
      font-size: 13px;
    }

    .zone-label {
      fill: var(--text);
      font-size: 13px;
      font-weight: bold;
    }

    .callout-title {
      fill: var(--minimum);
      font-size: 15px;
      font-weight: bold;
    }

    .callout-note {
      fill: var(--text);
      font-size: 13px;
    }

    .legend-label {
      fill: var(--text);
      font-size: 14px;
    }

    .fallback {
      fill: var(--text);
      font-size: 15px;
    }
  </style>
</head>
<body>
  <main>
    <h1>U-образная кривая тестовой ошибки</h1>

    <svg
      id="chart"
      viewBox="0 0 820 440"
      width="820"
      height="440"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="chart-title chart-description"
    >
      <title id="chart-title">Bias², variance и тестовая ошибка</title>
      <desc id="chart-description">
        По мере роста степени полинома от 1 до 20 квадрат смещения падает,
        разброс растёт, а их сумма сначала уменьшается, достигает минимума
        посередине и затем увеличивается.
      </desc>
      <g id="plot"></g>
    </svg>
  </main>

  <script>
    const DATA = Object.freeze({
      zero: 0,
      curve: [
        { x: 1, bias: 7.40, variance: 0.50 },
        { x: 2, bias: 6.40, variance: 0.60 },
        { x: 3, bias: 5.50, variance: 0.70 },
        { x: 4, bias: 4.70, variance: 0.80 },
        { x: 5, bias: 4.00, variance: 1.00 },
        { x: 6, bias: 3.40, variance: 1.20 },
        { x: 7, bias: 2.90, variance: 1.40 },
        { x: 8, bias: 2.50, variance: 1.60 },
        { x: 9, bias: 2.15, variance: 1.65 },
        { x: 10, bias: 1.85, variance: 2.00 },
        { x: 11, bias: 1.60, variance: 2.35 },
        { x: 12, bias: 1.38, variance: 2.75 },
        { x: 13, bias: 1.20, variance: 3.20 },
        { x: 14, bias: 1.05, variance: 3.70 },
        { x: 15, bias: 0.92, variance: 4.25 },
        { x: 16, bias: 0.82, variance: 4.85 },
        { x: 17, bias: 0.74, variance: 5.50 },
        { x: 18, bias: 0.67, variance: 6.20 },
        { x: 19, bias: 0.61, variance: 6.95 },
        { x: 20, bias: 0.56, variance: 7.70 }
      ],
      plot: {
        left: 0,
        right: 20.60,
        bottom: 0,
        top: 8.85
      },
      zones: [
        {
          left: 0,
          right: 6.80,
          className: "band-simple",
          label: "Слишком простая модель",
          labelX: 3.40,
          labelY: 8.35
        },
        {
          left: 6.80,
          right: 11.60,
          className: "band-balance",
          label: "Область баланса",
          labelX: 9.20,
          labelY: 8.35
        },
        {
          left: 11.60,
          right: 20.60,
          className: "band-complex",
          label: "Слишком сложная модель",
          labelX: 16.10,
          labelY: 8.35
        }
      ],
      axes: {
        xEnd: 21.35,
        yEnd: 9.35,
        xArrowBase: 20.95,
        xArrowHalfHeight: 0.18,
        yArrowBase: 8.92,
        yArrowHalfWidth: 0.18,
        tickHalfHeight: 0.14,
        tickLabelY: -0.43,
        xLabelX: 10.30,
        xLabelY: -0.92,
        yLabelX: -0.24,
        yLabelY: 9.08
      },
      ticks: [1, 20],
      callout: {
        leaderTopY: 5.72,
        titleX: 9,
        titleY: 6.62,
        noteX: 9,
        noteY: 6.12,
        haloRadius: 0.27,
        dotRadius: 0.13
      },
      legend: [
        {
          x1: 4.25,
          x2: 5.25,
          textX: 5.58,
          y: -1.62,
          className: "curve-bias",
          text: "Квадрат смещения (bias²) — падает"
        },
        {
          x1: 4.25,
          x2: 5.25,
          textX: 5.58,
          y: -2.12,
          className: "curve-variance",
          text: "Разброс (variance) — растёт"
        },
        {
          x1: 4.25,
          x2: 5.25,
          textX: 5.58,
          y: -2.62,
          className: "curve-total",
          text: "Тестовая ошибка = bias² + variance"
        }
      ],
      fallback: {
        x: 10.30,
        y: 4.45
      }
    });

    const origin = Object.freeze({ x: 88, y: 328 });
    const scale = Object.freeze({ x: 31.4, y: 33.5 });

    const sx = (x) => origin.x + x * scale.x;
    const sy = (y) => origin.y - y * scale.y;

    try {
      const namespace = "http://www.w3.org/2000/svg";
      const root = document.getElementById("plot");

      const element = (name, attributes, textContent) => {
        const node = document.createElementNS(namespace, name);

        Object.entries(attributes).forEach(([name, value]) => {
          node.setAttribute(name, String(value));
        });

        if (textContent !== undefined) {
          node.textContent = textContent;
        }

        return node;
      };

      const addLine = (x1, y1, x2, y2, className) => {
        const node = element("line", {
          x1: sx(x1),
          y1: sy(y1),
          x2: sx(x2),
          y2: sy(y2),
          class: className
        });

        root.appendChild(node);
        return node;
      };

      const addText = (x, y, value, className, anchor) => {
        const node = element(
          "text",
          {
            x: sx(x),
            y: sy(y),
            class: className,
            "text-anchor": anchor,
            "dominant-baseline": "middle"
          },
          value
        );

        root.appendChild(node);
        return node;
      };

      const addRect = (left, right, bottom, top, className) => {
        const node = element("rect", {
          x: sx(left),
          y: sy(top),
          width: sx(right) - sx(left),
          height: sy(bottom) - sy(top),
          class: className
        });

        root.appendChild(node);
        return node;
      };

      const pathFrom = (points) =>
        points
          .map(
            (point, index) =>
              `${index === DATA.zero ? "M" : "L"} ${sx(point.x)} ${sy(point.y)}`
          )
          .join(" ");

      const addPath = (points, className) => {
        const node = element("path", {
          d: pathFrom(points),
          class: className
        });

        root.appendChild(node);
        return node;
      };

      const addPolygon = (points, className) => {
        const node = element("polygon", {
          points: points
            .map((point) => `${sx(point.x)},${sy(point.y)}`)
            .join(" "),
          class: className
        });

        root.appendChild(node);
        return node;
      };

      const addCircle = (x, y, radius, className) => {
        const node = element("circle", {
          cx: sx(x),
          cy: sy(y),
          r: sx(DATA.zero + radius) - sx(DATA.zero),
          class: className
        });

        root.appendChild(node);
        return node;
      };

      root.replaceChildren();

      DATA.zones.forEach((zone) => {
        addRect(
          zone.left,
          zone.right,
          DATA.plot.bottom,
          DATA.plot.top,
          zone.className
        );
      });

      DATA.zones.forEach((zone, index) => {
        if (index !== DATA.zero) {
          addLine(
            zone.left,
            DATA.plot.bottom,
            zone.left,
            DATA.plot.top,
            "separator"
          );
        }
      });

      const totalValue = (point) => point.bias + point.variance;
      const minimum = DATA.curve.reduce((best, point) =>
        totalValue(point) < totalValue(best) ? point : best
      );
      const minimumTotal = totalValue(minimum);

      addLine(
        minimum.x,
        DATA.plot.bottom,
        minimum.x,
        minimumTotal,
        "minimum-guide"
      );

      addLine(
        DATA.zero,
        DATA.zero,
        DATA.axes.xEnd,
        DATA.zero,
        "axis"
      );

      addLine(
        DATA.zero,
        DATA.zero,
        DATA.zero,
        DATA.axes.yEnd,
        "axis"
      );

      addPolygon(
        [
          { x: DATA.axes.xEnd, y: DATA.zero },
          {
            x: DATA.axes.xArrowBase,
            y: DATA.axes.xArrowHalfHeight
          },
          {
            x: DATA.axes.xArrowBase,
            y: -DATA.axes.xArrowHalfHeight
          }
        ],
        "axis-arrow"
      );

      addPolygon(
        [
          { x: DATA.zero, y: DATA.axes.yEnd },
          {
            x: -DATA.axes.yArrowHalfWidth,
            y: DATA.axes.yArrowBase
          },
          {
            x: DATA.axes.yArrowHalfWidth,
            y: DATA.axes.yArrowBase
          }
        ],
        "axis-arrow"
      );

      DATA.ticks.forEach((tick) => {
        addLine(
          tick,
          -DATA.axes.tickHalfHeight,
          tick,
          DATA.axes.tickHalfHeight,
          "axis"
        );

        addText(
          tick,
          DATA.axes.tickLabelY,
          String(tick),
          "tick-label",
          "middle"
        );
      });

      addText(
        DATA.axes.xLabelX,
        DATA.axes.xLabelY,
        "Степень полинома",
        "axis-label",
        "middle"
      );

      addText(
        DATA.axes.yLabelX,
        DATA.axes.yLabelY,
        "Ошибка",
        "axis-label",
        "end"
      );

      DATA.zones.forEach((zone) => {
        addText(
          zone.labelX,
          zone.labelY,
          zone.label,
          "zone-label",
          "middle"
        );
      });

      const biasPoints = DATA.curve.map((point) => ({
        x: point.x,
        y: point.bias
      }));

      const variancePoints = DATA.curve.map((point) => ({
        x: point.x,
        y: point.variance
      }));

      const totalPoints = DATA.curve.map((point) => ({
        x: point.x,
        y: totalValue(point)
      }));

      addPath(biasPoints, "curve curve-bias");
      addPath(variancePoints, "curve curve-variance");
      addPath(totalPoints, "curve curve-total");

      addLine(
        minimum.x,
        minimumTotal,
        minimum.x,
        DATA.callout.leaderTopY,
        "callout-leader"
      );

      addCircle(
        minimum.x,
        minimumTotal,
        DATA.callout.haloRadius,
        "minimum-halo"
      );

      addCircle(
        minimum.x,
        minimumTotal,
        DATA.callout.dotRadius,
        "minimum-dot"
      );

      addText(
        DATA.callout.titleX,
        DATA.callout.titleY,
        "Минимум тестовой ошибки",
        "callout-title",
        "middle"
      );

      addText(
        DATA.callout.noteX,
        DATA.callout.noteY,
        "самый выгодный баланс вкладов",
        "callout-note",
        "middle"
      );

      DATA.legend.forEach((item) => {
        addLine(
          item.x1,
          item.y,
          item.x2,
          item.y,
          `curve ${item.className}`
        );

        addText(
          item.textX,
          item.y,
          item.text,
          "legend-label",
          "start"
        );
      });
    } catch (error) {
      const namespace = "http://www.w3.org/2000/svg";
      const root = document.getElementById("plot");
      root.replaceChildren();

      const fallback = document.createElementNS(namespace, "text");
      fallback.setAttribute("x", String(sx(DATA.fallback.x)));
      fallback.setAttribute("y", String(sy(DATA.fallback.y)));
      fallback.setAttribute("class", "fallback");
      fallback.setAttribute("text-anchor", "middle");
      fallback.setAttribute("dominant-baseline", "middle");
      fallback.textContent =
        "Схема должна показать: bias² падает, variance растёт, а их сумма образует U.";

      root.appendChild(fallback);
    }
  </script>
</body>
</html>
