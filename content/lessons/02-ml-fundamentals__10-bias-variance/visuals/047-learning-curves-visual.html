<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Три формы кривой обучения</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #647087;
      --axis: #8792a6;
      --grid: #dce2ec;
      --train: #2563b8;
      --validation: #d05a22;
      --gap: #9a6ac5;
      --badge: #eef2f8;
      --badge-ink: #39465d;
      --border: #d8dee9;
      --failure: #8b2635;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #11151d;
        --panel: #191f2a;
        --ink: #edf2fa;
        --muted: #adb8ca;
        --axis: #8995aa;
        --grid: #303949;
        --train: #72adff;
        --validation: #ff9768;
        --gap: #c39aee;
        --badge: #242d3d;
        --badge-ink: #d6dfed;
        --border: #354052;
        --failure: #ff9bac;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
    }

    figure {
      width: 100%;
      margin: 0;
      background: var(--page);
    }

    figcaption {
      padding: 12px 18px 8px;
      color: var(--ink);
      font-size: 22px;
      font-weight: 750;
      line-height: 1.2;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--page);
    }

    .panel {
      fill: var(--panel);
      stroke: var(--border);
      stroke-width: 2;
    }

    .axis {
      stroke: var(--axis);
      stroke-width: 2;
      stroke-linecap: round;
    }

    .grid {
      stroke: var(--grid);
      stroke-width: 1;
      stroke-dasharray: 5 7;
    }

    .tick {
      stroke: var(--axis);
      stroke-width: 2;
    }

    .curve {
      fill: none;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .training {
      stroke: var(--train);
    }

    .validation {
      stroke: var(--validation);
      stroke-dasharray: 10 7;
    }

    .training-point {
      fill: var(--panel);
      stroke: var(--train);
      stroke-width: 3;
    }

    .validation-point {
      fill: var(--panel);
      stroke: var(--validation);
      stroke-width: 3;
    }

    .gap {
      stroke: var(--gap);
      stroke-width: 2;
      stroke-dasharray: 4 5;
      opacity: .85;
    }

    .panel-title {
      fill: var(--ink);
      font-size: 21px;
      font-weight: 750;
    }

    .diagnosis {
      fill: var(--badge-ink);
      font-size: 15px;
      font-weight: 650;
    }

    .axis-label {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .tick-label {
      fill: var(--muted);
      font-size: 14px;
    }

    .curve-label {
      font-size: 15px;
      font-weight: 750;
      paint-order: stroke;
      stroke: var(--panel);
      stroke-width: 5;
      stroke-linejoin: round;
    }

    .training-label {
      fill: var(--train);
    }

    .validation-label {
      fill: var(--validation);
    }

    .badge {
      fill: var(--badge);
      stroke: var(--border);
      stroke-width: 1;
    }

    #fallback {
      margin: 16px;
      color: var(--failure);
      font-size: 16px;
      line-height: 1.45;
      text-align: center;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title">
    <figcaption id="diagram-title">Три формы кривой обучения</figcaption>
    <svg id="diagram"
         viewBox="0 0 1200 500"
         width="1200"
         height="500"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="svg-title svg-description">
      <title id="svg-title">Три характерные формы кривой обучения</title>
      <desc id="svg-description">
        Три мини-графика сравнивают ошибки обучения и валидации
        на выборках из 100, 500 и 2000 примеров.
      </desc>
    </svg>
    <p id="fallback" hidden>
      Схема должна была показать три траектории: высокое общее плато,
      большой сокращающийся разрыв и сходимость обеих ошибок на низком уровне.
    </p>
  </figure>

  <script>
    "use strict";

    const DATA = [
      {
        origin: [0, 485],
        scale: [1, 1],
        radius: 6,
        tickHalf: 7,
        labelPad: 10,
        labelPadWide: 16,
        panels: [
          {
            box: [12, 16, 392, 475],
            title: ["Высокое смещение", 202, 451],
            diagnosis: ["обе ошибки застывают высоко", 202, 421],
            badge: [70, 404, 334, 438],
            plot: [64, 95, 366, 350],
            axisLabels: [
              ["Ошибка", 64, 366, "start"],
              ["Размер выборки", 215, 43, "middle"]
            ],
            gridLevels: [175, 255, 335],
            ticks: [
              [90, "100"],
              [210, "500"],
              [350, "2000"]
            ],
            training: [
              [90, 225],
              [210, 245],
              [350, 255]
            ],
            validation: [
              [90, 325],
              [210, 282],
              [350, 262]
            ],
            endLabels: [
              ["валидация", 350, 262, "end", -10, -12, "validation-label"],
              ["обучение", 350, 255, "end", -10, 20, "training-label"]
            ],
            gaps: [
              [90, 225, 325],
              [210, 245, 282],
              [350, 255, 262]
            ]
          },
          {
            box: [410, 16, 790, 475],
            title: ["Высокая дисперсия", 600, 451],
            diagnosis: ["большой разрыв сокращается", 600, 421],
            badge: [454, 404, 746, 438],
            plot: [462, 95, 764, 350],
            axisLabels: [
              ["Ошибка", 462, 366, "start"],
              ["Размер выборки", 613, 43, "middle"]
            ],
            gridLevels: [175, 255, 335],
            ticks: [
              [488, "100"],
              [608, "500"],
              [748, "2000"]
            ],
            training: [
              [488, 105],
              [608, 118],
              [748, 128]
            ],
            validation: [
              [488, 325],
              [608, 255],
              [748, 188]
            ],
            endLabels: [
              ["валидация", 748, 188, "end", -10, -12, "validation-label"],
              ["обучение", 748, 128, "end", -10, 20, "training-label"]
            ],
            gaps: [
              [488, 105, 325],
              [608, 118, 255],
              [748, 128, 188]
            ]
          },
          {
            box: [808, 16, 1188, 475],
            title: ["Хорошее соответствие", 998, 451],
            diagnosis: ["обе ошибки сходятся низко", 998, 421],
            badge: [854, 404, 1142, 438],
            plot: [860, 95, 1162, 350],
            axisLabels: [
              ["Ошибка", 860, 366, "start"],
              ["Размер выборки", 1011, 43, "middle"]
            ],
            gridLevels: [175, 255, 335],
            ticks: [
              [886, "100"],
              [1006, "500"],
              [1146, "2000"]
            ],
            training: [
              [886, 108],
              [1006, 120],
              [1146, 128]
            ],
            validation: [
              [886, 210],
              [1006, 158],
              [1146, 135]
            ],
            endLabels: [
              ["валидация", 1146, 135, "end", -10, -14, "validation-label"],
              ["обучение", 1146, 128, "end", -10, 22, "training-label"]
            ],
            gaps: [
              [886, 108, 210],
              [1006, 120, 158],
              [1146, 128, 135]
            ]
          }
        ]
      }
    ];

    const origin = Object.freeze({
      x: DATA[0].origin[0],
      y: DATA[0].origin[1]
    });

    const scale = Object.freeze({
      x: DATA[0].scale[0],
      y: DATA[0].scale[1]
    });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y - y * scale.y;

    const svg = document.getElementById("diagram");
    const fallback = document.getElementById("fallback");
    const namespace = "http://www.w3.org/2000/svg";

    function make(tag, attributes, className) {
      const node = document.createElementNS(namespace, tag);

      if (className) {
        node.setAttribute("class", className);
      }

      for (const [name, value] of Object.entries(attributes)) {
        node.setAttribute(name, String(value));
      }

      return node;
    }

    function addLine(x1, y1, x2, y2, className, parent) {
      const node = make("line", {
        x1: sx(x1),
        y1: sy(y1),
        x2: sx(x2),
        y2: sy(y2)
      }, className);

      parent.appendChild(node);
      return node;
    }

    function addText(value, x, y, className, anchor, dx, dy, parent) {
      const node = make("text", {
        x: sx(x),
        y: sy(y),
        "text-anchor": anchor,
        dx: dx,
        dy: dy
      }, className);

      node.textContent = value;
      parent.appendChild(node);
      return node;
    }

    function addRect(bounds, className, parent) {
      const node = make("rect", {
        x: sx(bounds[0]),
        y: sy(bounds[3]),
        width: sx(bounds[2]) - sx(bounds[0]),
        height: sy(bounds[1]) - sy(bounds[3])
      }, className);

      parent.appendChild(node);
      return node;
    }

    function addCurve(points, className, parent) {
      const pathData = points.map((point, index) => {
        const command = index === 0 ? "M" : "L";
        return command + " " + sx(point[0]) + " " + sy(point[1]);
      }).join(" ");

      const path = make("path", { d: pathData }, "curve " + className);
      parent.appendChild(path);
      return path;
    }

    function addPoints(points, className, parent) {
      for (const point of points) {
        const marker = make("circle", {
          cx: sx(point[0]),
          cy: sy(point[1]),
          r: sx(DATA[0].radius) - sx(0)
        }, className);

        parent.appendChild(marker);
      }
    }

    function renderPanel(panel) {
      const group = make("g", {
        role: "group",
        "aria-label": panel.title[0]
      });

      svg.appendChild(group);
      addRect(panel.box, "panel", group);
      addRect(panel.badge, "badge", group);

      addText(
        panel.title[0],
        panel.title[1],
        panel.title[2],
        "panel-title",
        "middle",
        0,
        0,
        group
      );

      addText(
        panel.diagnosis[0],
        panel.diagnosis[1],
        panel.diagnosis[2],
        "diagnosis",
        "middle",
        0,
        0,
        group
      );

      for (const level of panel.gridLevels) {
        addLine(
          panel.plot[0],
          level,
          panel.plot[2],
          level,
          "grid",
          group
        );
      }

      addLine(
        panel.plot[0],
        panel.plot[1],
        panel.plot[2],
        panel.plot[1],
        "axis",
        group
      );

      addLine(
        panel.plot[0],
        panel.plot[1],
        panel.plot[0],
        panel.plot[3],
        "axis",
        group
      );

      for (const axisLabel of panel.axisLabels) {
        addText(
          axisLabel[0],
          axisLabel[1],
          axisLabel[2],
          "axis-label",
          axisLabel[3],
          0,
          0,
          group
        );
      }

      for (const tick of panel.ticks) {
        addLine(
          tick[0],
          panel.plot[1] - DATA[0].tickHalf,
          tick[0],
          panel.plot[1] + DATA[0].tickHalf,
          "tick",
          group
        );

        addText(
          tick[1],
          tick[0],
          panel.plot[1] - DATA[0].labelPadWide,
          "tick-label",
          "middle",
          0,
          DATA[0].labelPad,
          group
        );
      }

      for (const gap of panel.gaps) {
        addLine(gap[0], gap[1], gap[0], gap[2], "gap", group);
      }

      addCurve(panel.training, "training", group);
      addCurve(panel.validation, "validation", group);
      addPoints(panel.training, "training-point", group);
      addPoints(panel.validation, "validation-point", group);

      for (const endLabel of panel.endLabels) {
        addText(
          endLabel[0],
          endLabel[1],
          endLabel[2],
          "curve-label " + endLabel[6],
          endLabel[3],
          endLabel[4],
          endLabel[5],
          group
        );
      }
    }

    try {
      for (const panel of DATA[0].panels) {
        renderPanel(panel);
      }
    } catch (error) {
      svg.hidden = true;
      fallback.hidden = false;
    }
  </script>
</body>
</html>
