- concept: величина ошибки оценивается относительно достижимого ориентира для конкретной задачи
  question: Модель показывает MAE 9 минут и в регионе A, и в регионе B. Надёжный ориентир, измеренный на сопоставимых заказах, равен 4 минутам в регионе A и 10 минутам в регионе B. Где ошибку модели обоснованно считать высокой относительно достижимого уровня?
  explanation: В регионе A модель заметно уступает достижимому ориентиру, поэтому её ошибку разумно считать высокой. В регионе B результат модели сопоставим с ориентиром и даже немного лучше. Одинаковая абсолютная ошибка может иметь разную оценку в разных условиях.
  kind: choice
  options:
    - Только в регионе A
    - Только в регионе B
    - В обоих регионах
    - Ни в одном регионе
  correct: 0
  id: 008-relative-error-1
  fingerprint: dfe92e2a
- concept: полезный ориентир должен быть получен на той же задаче, той же метрикой и на сопоставимых данных
  question: Команда хочет использовать результат опубликованной модели как ориентир для оценки собственной ошибки. Объясни, какие свойства сравнения нужно проверить, чтобы такой ориентир был полезен.
  explanation: Если отличаются задача, метрика, данные или процедура оценки, разница результатов может быть вызвана условиями сравнения, а не качеством моделей. Такой ориентир не позволяет надёжно определить, действительно ли ошибка высока.
  kind: open
  reference: Нужно убедиться, что опубликованная модель решает ту же задачу, её ошибка рассчитана той же метрикой и оценена на сопоставимых данных и по сопоставимому протоколу. Кроме того, её результат должен отражать реалистично достижимый уровень качества.
  id: 008-relative-error-2
  fingerprint: 498b2b2e
