- concept: test-ошибка сама по себе не позволяет определить причину плохого обобщения
  question: У двух моделей одинаковая высокая ошибка на test. Достаточно ли этого, чтобы поставить им одинаковый диагноз?
  explanation: Одинаковая test-ошибка может скрывать разные причины. В уроке значения train = 0,85 и test = 0,90 указывают на bias, а train = 0,05 и test = 0,90 — на variance.
  kind: choice
  options:
    - Да, одинаковая test-ошибка всегда означает одинаковую проблему
    - Нет, нужно также сравнить ошибки на train и разрыв между train и test
    - Да, если модели решают одну и ту же задачу
  correct: 1
  id: 007-train-test-signals-1
  fingerprint: 0dae5112
- concept: расхождение динамики train- и test-ошибок служит сигналом для ранней остановки
  question: Во время обучения ошибка на train продолжает снижаться, а ошибка на отложенной выборке после некоторого момента начинает расти. Что происходит и какое действие уместно?
  explanation: Падение train-ошибки одновременно с ростом test-ошибки означает overfitting in progress. Early stopping сохраняет состояние модели до ухудшения качества на новых данных.
  kind: open
  reference: 'Началось переобучение: модель всё лучше подстраивается под обучающие примеры, но хуже обобщает. Обучение следует остановить около минимума ошибки на отложенной выборке.'
  id: 007-train-test-signals-2
  fingerprint: 943ef0a0
