- concept: одинаковый сдвиг всех предсказаний изменяет bias, но сохраняет variance
  question: Ко всем предсказаниям модели для фиксированного объекта прибавили одинаковую поправку. После этого среднее предсказание совпало с истинным значением, а расстояния между отдельными предсказаниями не изменились. Объясни, что произошло с bias и variance.
  explanation: Bias определяется положением среднего предсказания относительно истины, а variance — разбросом вокруг этого среднего. Перенос всего распределения меняет первое, но не второе.
  kind: open
  reference: 'Bias уменьшился, поскольку среднее предсказание приблизилось к истинному значению. Variance не изменился: одинаковый сдвиг всех предсказаний не меняет их разброс относительно собственного среднего.'
  id: 004-mishen-2
  fingerprint: cac6eda3
