- concept: при росте обучающей выборки train-ошибка гибкой модели может расти одновременно со снижением test-ошибки
  question: Для одной и той же гибкой модели при добавлении обучающих примеров ошибка на train выросла, а ошибка на независимых тестовых данных снизилась. Как это интерпретировать?
  explanation: Гибкая модель способна почти запомнить малую выборку и получить на ней очень низкую ошибку. С увеличением train это становится труднее, поэтому train-ошибка может вырасти, тогда как test-ошибка падает благодаря более надёжной оценке закономерности.
  kind: choice
  options:
    - 'Обучение сломалось: рост train-ошибки всегда означает ухудшение модели'
    - Большую выборку труднее запомнить целиком, но она помогает модели лучше выделить устойчивый сигнал
    - Тестовая выборка начала участвовать в подборе коэффициентов модели
    - Сложность модели автоматически увеличилась вместе с размером выборки
  correct: 1
  id: 043-build-learning-curve-1
  fingerprint: 06daafeb
- concept: усреднение повторных переобучений отделяет тренд learning curve от случайности конкретной выборки
  question: Почему для каждой точки learning curve модель полезно несколько раз обучать на независимо сформированных выборках одинакового размера, а затем усреднять ошибки?
  explanation: Один набор примеров может случайно оказаться особенно простым или сложным. В материале каждая точка усредняется по многим запускам, чтобы читать устойчивый тренд, а не шум выборки.
  kind: open
  reference: Состав конкретной обучающей выборки случайно влияет на результат. Повторные переобучения и усреднение уменьшают влияние удачных или неудачных выборок, поэтому кривая отражает общий эффект размера train, а не случайный скачок одного запуска.
  id: 043-build-learning-curve-2
  fingerprint: f93f3ebe
- concept: одинаковая тестовая выборка изолирует влияние размера train на learning curve
  question: Зачем при сравнении разных размеров обучающей выборки оценивать все заново обученные модели на одной и той же отдельной тестовой выборке?
  explanation: Если одновременно менять train и test, изменение ошибки может быть вызвано любым из них. Фиксированная тестовая выборка делает оценки сопоставимыми и помогает связать динамику ошибки именно с ростом обучающих данных.
  kind: choice
  options:
    - Чтобы тестовые объекты стали частью обучения каждой модели
    - Чтобы модели получили одинаковые коэффициенты
    - Чтобы различия test-ошибки не объяснялись случайным изменением состава тестовых данных
    - Чтобы train-ошибка обязательно уменьшалась с ростом выборки
  correct: 2
  id: 043-build-learning-curve-3
