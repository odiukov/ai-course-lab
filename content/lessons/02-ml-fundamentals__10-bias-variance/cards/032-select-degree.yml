- concept: валидационная выборка служит для выбора модели, а тестовая — для однократной итоговой оценки
  question: Расположите этапы выбора сложности модели в правильном порядке.
  explanation: 'Валидация участвует в выборе сложности, поэтому её можно использовать для сравнения полиномов степеней 2, 5 и 12. Тест откладывают до конца: многократный выбор по его результатам подстраивает решение под тест и делает итоговую оценку чрезмерно оптимистичной.'
  kind: order
  items:
    - Разделить доступные данные на обучающую, валидационную и тестовую выборки
    - Обучить кандидатов разной сложности на обучающей выборке
    - Сравнить кандидатов по ошибке на валидационной выборке
    - Зафиксировать выбранную модель и её настройки
    - Один раз оценить итоговое качество на тестовой выборке
