- concept: смешанные слагаемые исчезают из bias–variance-разложения из-за нулевого среднего отклонений
  question: Почему при выводе bias–variance-разложения для квадратичной ошибки смешанные слагаемые после усреднения обращаются в ноль?
  explanation: 'По определению среднее отклонение от среднего равно нулю: E[f_hat(x) − E[f_hat(x)]] = 0. Если f(x) = E[y|x], то и шум y − f(x) условно имеет нулевое среднее. Поэтому смешанные произведения не дают вклада после усреднения.'
  kind: choice
  options:
    - Отклонение прогноза от его среднего и шум относительно истинной функции имеют нулевое математическое ожидание
    - Предсказание модели всегда статистически независимо от наблюдаемой метки
    - Bias и variance всегда равны друг другу
    - Все составляющие ошибки принимают только положительные значения
  correct: 0
  id: 011-decomposition-1
  fingerprint: 82cf5b4d
- concept: неизвестный компонент ошибки находится вычитанием остальных компонентов из ожидаемой квадратичной ошибки
  question: В фиксированной точке ожидаемая квадратичная ошибка модели равна 2.38, величина bias равна 0.7, а дисперсия неустранимого шума — 0.41. Чему равен variance прогнозов?
  explanation: 'В разложение входит квадрат bias: 0.7² = 0.49. Поэтому variance = 2.38 − 0.49 − 0.41 = 1.48.'
  kind: numeric
  answer: 1.48
  tolerance: 0.001
  id: 011-decomposition-2
  fingerprint: 852bd04b
