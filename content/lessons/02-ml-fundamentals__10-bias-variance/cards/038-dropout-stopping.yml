- concept: dropout вынуждает сеть формировать дублирующие представления признаков
  question: Почему случайное отключение нейронов с помощью dropout может уменьшить зависимость сети от отдельных связей?
  explanation: 'Во время обучения сеть не знает, какие нейроны будут отключены на очередном шаге. Поэтому полезный признак нельзя надёжно закрепить за единственным маршрутом: его приходится поддерживать несколькими частями сети.'
  kind: choice
  options:
    - Dropout навсегда удаляет отключённые нейроны из архитектуры
    - Разным подмножествам нейронов приходится поддерживать полезные представления
    - Dropout увеличивает число обучаемых параметров сети
    - Все веса сети принудительно становятся одинаковыми
  correct: 1
  id: 038-dropout-stopping-1
  fingerprint: 5280b7bb
- concept: early stopping уменьшает эффективную сложность без изменения архитектуры модели
  question: Архитектура двух нейросетей одинакова, но обучение одной из них остановили раньше. Объясни, почему их эффективная сложность может различаться.
  explanation: Формальная ёмкость определяется архитектурой, а эффективная сложность зависит ещё и от хода обучения. Early stopping ограничивает время подгонки параметров, не удаляя слои и веса.
  kind: open
  reference: Ранее остановленная сеть имела меньше возможностей подогнать параметры под мелкие особенности обучающей выборки. Поэтому при одинаковом числе слоёв и весов она использовала меньшую часть своей способности к подгонке и обладала меньшей эффективной сложностью.
  id: 038-dropout-stopping-2
  fingerprint: 315faf82
