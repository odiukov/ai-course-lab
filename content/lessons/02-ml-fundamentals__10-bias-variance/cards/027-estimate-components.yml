- concept: усреднение по измерению моделей сохраняет отдельное ожидаемое предсказание для каждой тестовой точки
  question: Матрица предсказаний имеет форму (M, T), где M — модели, обученные на разных выборках, а T — фиксированные тестовые точки. Что получится после усреднения по измерению M?
  explanation: Для оценки ожидаемого предсказания модели усредняют значения разных моделей отдельно в каждой тестовой точке. Поэтому измерение моделей исчезает, а измерение тестовых точек сохраняется.
  kind: choice
  options:
    - 'Вектор длины T: среднее предсказание для каждой тестовой точки'
    - 'Вектор длины M: среднее предсказание каждой модели'
    - 'Один скаляр: среднее всех элементов матрицы'
  correct: 0
  id: 027-estimate-components-1
  fingerprint: '0e972546'
- concept: при сравнении предсказаний с безошумной истинной функцией полная средняя квадратичная ошибка не содержит слагаемого шума
  question: Почему при сравнении предсказаний множества моделей с известной безошумной истинной функцией полная средняя квадратичная ошибка раскладывается на квадрат bias и variance без добавления неустранимого шума?
  explanation: 'Шумовой компонент появляется при сравнении с шумными наблюдаемыми метками. Сравнение непосредственно с чистой истинной функцией изолирует ошибку процедуры обучения: квадрат bias плюс variance.'
  kind: open
  reference: Неустранимый шум описывает случайное отклонение наблюдаемой целевой переменной от истинной функции. Если в качестве целевых значений используется сама истинная функция, такого отклонения в сравнении нет, поэтому остаются только квадрат систематического смещения среднего предсказания и разброс предсказаний между моделями.
  id: 027-estimate-components-2
  fingerprint: b82aed34
