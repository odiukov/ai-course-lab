- concept: способ решения задачи зависит от наличия регуляризации
  question: Какая пара методов NumPy соответствует обычному и регуляризованному обучению полинома?
  explanation: При lam=0 коэффициенты получают через np.linalg.lstsq(X, y_train, rcond=None). При положительном lam решают систему (X.T @ X + penalty)w = X.T @ y_train с помощью np.linalg.solve.
  kind: choice
  options:
    - Без регуляризации — np.linalg.lstsq; с регуляризацией — np.linalg.solve для системы со штрафом
    - Без регуляризации — np.linalg.solve для матрицы штрафа; с регуляризацией — np.linalg.lstsq без штрафа
    - В обоих случаях — только np.linalg.inv
    - В обоих случаях — только np.polyfit без построения матрицы признаков
