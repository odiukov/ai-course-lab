- concept: при регуляризации полинома свободный член исключают из штрафа
  question: Как настроить диагональный регуляризационный штраф, чтобы ограничивать форму полинома, но не его общий вертикальный сдвиг?
  explanation: Свободный член лишь сдвигает кривую целиком и не делает её форму гибче. Поэтому после создания матрицы штрафа выполняют penalty[0, 0] = 0, оставляя регуляризацию для остальных коэффициентов.
  kind: choice
  options:
    - Не штрафовать коэффициент свободного члена, а остальные коэффициенты штрафовать с силой lam
    - Одинаково штрафовать все коэффициенты, включая свободный член
    - Штрафовать только коэффициент свободного члена
    - Заполнить значением lam внедиагональные элементы матрицы штрафа
