- concept: чувствительность прогноза к составу обучающей выборки указывает на высокий variance
  question: После замены небольшой части обучающих примеров прогноз модели для одного и того же объекта сильно изменился. Что это прежде всего показывает?
  explanation: Variance описывает нестабильность модели относительно обучающих данных. Если небольшое изменение выборки сильно меняет прогноз, модель чрезмерно зависит от конкретных примеров.
  kind: choice
  options:
    - Высокий variance
    - Высокий bias
    - Отсутствие случайного шума
  correct: 0
  id: 001-istochniki-oshibki-2
  fingerprint: a7dcf7ee
- concept: неустранимый шум возникает из-за неизвестных или случайных факторов
  question: Объясни своими словами, почему даже идеальная модель не всегда может свести тестовую ошибку к нулю.
  explanation: Тестовая ошибка включает не только bias и variance, но и шум. Если важные обстоятельства не наблюдаются или результат частично случаен, модель не может точно предсказать их по доступным признакам.
  kind: open
  reference: В целевой величине могут участвовать случайные или незафиксированные в признаках факторы. Поскольку модель не получает эту информацию, соответствующая часть ошибки является неустранимым шумом и не исчезает от изменения сложности модели.
  id: 001-istochniki-oshibki-3
  fingerprint: 8927982c
