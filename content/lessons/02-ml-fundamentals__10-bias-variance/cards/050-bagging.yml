- concept: дисперсия среднего независимых предсказаний уменьшается пропорционально числу моделей
  question: Каждая модель выдаёт предсказание с дисперсией 77. Чему равна дисперсия среднего из 11 независимых предсказаний?
  explanation: 'Для независимых предсказаний дисперсия среднего равна дисперсии одной модели, делённой на число моделей: 77 / 11 = 7.'
  kind: numeric
  answer: 7
  tolerance: 0.01
  id: 050-bagging-1
  fingerprint: 998c94fc
- concept: корреляция ошибок базовых моделей ограничивает снижение variance при усреднении
  question: При каком условии увеличение bagging-ансамбля сильнее всего снижает variance среднего предсказания?
  explanation: Независимые отклонения взаимно компенсируются при усреднении. Чем сильнее ошибки моделей коррелируют, тем меньшую часть их общего колебания способен убрать bagging.
  kind: choice
  options:
    - Ошибки базовых моделей независимы или слабо коррелируют
    - Ошибки базовых моделей почти полностью совпадают
    - Все базовые модели обучены без случайности на одной выборке
  correct: 0
  id: 050-bagging-2
  fingerprint: 8834cc9e
- concept: усреднение моделей снижает случайный разброс, но сохраняет их общий систематический сдвиг
  question: Объясни своими словами, почему bagging может сделать предсказания стабильнее, но не исправить общий систематический промах всех базовых моделей.
  explanation: Bagging предназначен прежде всего для снижения variance. Если базовые модели имеют общий bias, усреднение воспроизводит этот bias вместо его устранения.
  kind: open
  reference: Случайные отклонения отдельных моделей могут иметь разные направления и частично погашаются в среднем. Общий систематический сдвиг направлен у всех моделей одинаково, поэтому после усреднения он сохраняется.
  id: 050-bagging-3
  fingerprint: 7d9b5fc7
