- concept: L2-регуляризация уменьшает влияние признаков, обычно сохраняя их в модели
  question: Нужно ограничить чрезмерные коэффициенты линейной модели, но по возможности сохранить вклад всех признаков. Какой результат наиболее характерен для L2-регуляризации?
  explanation: L2-штраф уменьшает абсолютные величины коэффициентов, но обычно не обнуляет их. Все признаки остаются в модели, хотя их влияние на предсказание ослабевает.
  kind: choice
  options:
    - Часть коэффициентов обязательно становится ровно нулевой
    - Все коэффициенты стягиваются к нулю, но обычно остаются ненулевыми
    - Коэффициенты заменяются бинарными индикаторами
    - Из модели удаляются все коррелирующие признаки
