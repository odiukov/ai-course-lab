- concept: увеличение степени расширяет вложенный класс полиномиальных моделей
  question: Полиномиальную регрессию без регуляризации обучают минимизировать MSE. Что верно при переходе от степени d к степени d + 1 на той же обучающей выборке при точной оптимизации?
  explanation: 'Класс полиномов степени не выше d содержится в классе степени не выше d + 1: коэффициент нового старшего члена можно сделать нулевым. Поэтому прежнее решение остаётся доступным, а минимальная ошибка на обучении не может стать больше.'
  kind: choice
  options:
    - Минимальная train-MSE обязательно возрастёт
    - Минимальная train-MSE не может возрасти
    - Минимальная train-MSE обязательно останется прежней
    - Изменение train-MSE определяется только уровнем шума
  correct: 1
  id: 019-polynomial-complexity-1
  fingerprint: 0eb711f2
- concept: степень полинома следует выбирать по качеству обобщения, а не по минимальной ошибке на обучении
  question: Объясни своими словами, почему полином с наименьшей ошибкой на обучающей выборке не обязательно имеет подходящую степень.
  explanation: Малая степень может не уловить закономерность, а чрезмерная — подстроиться под шум. Подходящая степень находится в области минимальной ошибки обобщения, которая не обязана совпадать с минимумом train-ошибки.
  kind: open
  reference: Повышение степени даёт модели больше свободы и позволяет точнее подогнать обучающие точки, включая их случайный шум. Поэтому train-ошибка может снижаться даже тогда, когда ошибка на новых данных уже растёт; степень нужно оценивать по отложенным данным.
  id: 019-polynomial-complexity-2
  fingerprint: 6c1134cf
