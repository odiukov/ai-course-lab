- concept: в ожидаемую квадратичную ошибку входит квадрат bias, а не сам bias
  question: В точке x bias модели равен −0,6, variance равен 0,14, а irreducible noise вносит 0,09. Чему равна ожидаемая квадратичная ошибка?
  explanation: 'По разложению ошибка равна bias² + variance + noise: (−0,6)² + 0,14 + 0,09 = 0,59. Знак bias исчезает при возведении в квадрат.'
  kind: numeric
  answer: 0.59
  tolerance: 0.001
  id: 012-formula-map-1
  fingerprint: 15468b84
- concept: нижняя граница ожидаемой квадратичной ошибки равна дисперсии неустранимого шума
  question: Шум метки имеет стандартное отклонение σ. Модель без bias и variance точно воспроизводит f(x). Что задаёт нижнюю границу её ожидаемой квадратичной ошибки?
  explanation: Даже идеальная модель не предсказывает случайное отклонение y от f(x). Поэтому остаётся E[(y − f(x))²] = σ² — неустранимый пол ошибки.
  kind: choice
  options:
    - Дисперсия шума, то есть σ²
    - Стандартное отклонение шума, то есть σ
    - Ноль, поскольку модель точно воспроизводит f(x)
  correct: 0
  id: 012-formula-map-2
