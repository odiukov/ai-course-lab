- concept: высокий variance проявляется низкой ошибкой на обучении и высокой ошибкой на новых данных
  question: Модель почти не ошибается на обучающих данных, но показывает высокую ошибку на тестовых. Какой диагноз наиболее вероятен?
  explanation: При высоком variance модель хорошо запоминает обучающую выборку, поэтому training error мала. На новых данных её качество резко падает, и между training error и test error возникает большой разрыв.
  kind: choice
  options:
    - Высокий bias
    - Высокий variance и overfitting
    - Недостаточная сложность модели
    - Низкий variance
  correct: 1
  id: 003-variance-1
  fingerprint: 9bd002f8
- concept: overfitting возникает, когда модель подгоняется под шум вместо устойчивого сигнала
  question: Объясни своими словами, почему очень гибкая модель может идеально описывать обучающие данные, но плохо предсказывать новые.
  explanation: Высокая гибкость позволяет модели подстроиться под случайные особенности обучающих примеров. Это уменьшает training error, но повышает test error, поскольку запомненный шум не является общим правилом.
  kind: open
  reference: Гибкая модель способна запомнить не только устойчивые закономерности, но и случайный шум конкретной обучающей выборки. Шум не повторяется на новых данных, поэтому идеальная подгонка обучения не обеспечивает хорошего обобщения.
  id: 003-variance-2
  fingerprint: 50d7742f
