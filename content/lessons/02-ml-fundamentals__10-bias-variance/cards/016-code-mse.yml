- concept: усреднение знаковых ошибок до возведения в квадрат допускает взаимную компенсацию промахов
  question: Почему выражение `np.square(np.mean(y_pred - y_true))` в общем случае не эквивалентно `np.mean(np.square(y_pred - y_true))`?
  explanation: MSE требует сначала возвести каждую ошибку в квадрат и лишь затем усреднить. Если сначала усреднить знаковые ошибки, недооценки и переоценки могут взаимно компенсироваться.
  kind: choice
  options:
    - В первом выражении ошибки разных знаков могут взаимно погаситься до возведения в квадрат
    - '`np.mean` нельзя применять к массивам предсказаний'
    - '`np.square` работает только с целыми числами'
    - Вычитание массивов NumPy не выполняется поэлементно
  correct: 0
  id: 016-code-mse-1
  fingerprint: 38e3fde9
- concept: порядок вычитания истинных значений и предсказаний не влияет на квадратичную ошибку
  question: Изменится ли MSE, если вместо `y_pred - y_true` вычислять `y_true - y_pred`? Объясни почему.
  explanation: Квадрат числа совпадает с квадратом противоположного ему числа, поэтому оба соглашения о знаке ошибки приводят к одному MSE.
  kind: open
  reference: Нет. Перестановка операндов меняет только знак каждой ошибки, а после возведения в квадрат оба варианта дают одинаковые значения.
  id: 016-code-mse-2
  fingerprint: f9edf6ff
