- concept: bias оценивается сравнением истины со средним предсказанием модели по разным обучающим выборкам
  question: Расположите действия в порядке, позволяющем оценить bias модели в фиксированной точке.
  explanation: Bias относится не к предсказанию одной обученной модели, а к среднему предсказанию процедуры обучения по возможным выборкам. Его величина определяется отклонением этого среднего от истины.
  kind: order
  items:
    - Выбрать входную точку и определить истинное значение целевой зависимости в ней
    - Получить множество обучающих выборок из одного распределения
    - Обучить один и тот же тип модели на каждой выборке
    - Собрать предсказания обученных моделей в выбранной точке и усреднить их
    - Сравнить среднее предсказание с истинным значением
  id: 002-bias-2
  fingerprint: dcf46596
