- concept: MSE вычисляется как среднее квадратов ошибок
  question: Ошибки регрессионной модели равны −3, +6 и −9. Чему равен MSE?
  explanation: 'Квадраты ошибок равны 9, 36 и 81. Их среднее: (9 + 36 + 81) / 3 = 42.'
  kind: numeric
  answer: 42
  tolerance: 0.1
  id: 015-mse-measure-1
  fingerprint: 51b93309
- concept: вклад отдельной ошибки в MSE растёт квадратично
  question: Абсолютная ошибка одного прогноза выросла в три раза. Как изменился её вклад в MSE?
  explanation: В MSE ошибка входит в квадрате. Поэтому увеличение абсолютной ошибки в три раза увеличивает её вклад в три в квадрате, то есть в девять раз.
  kind: choice
  options:
    - Вырос в три раза
    - Вырос в шесть раз
    - Вырос в девять раз
    - Не изменился
  correct: 2
  id: 015-mse-measure-2
  fingerprint: dcad81b4
- concept: единица измерения MSE является квадратом единицы целевой величины
  question: В каких единицах измеряется MSE, если целевая величина задана в километрах? Объясни почему.
  explanation: Вычитание сохраняет единицу целевой величины, а возведение ошибки в квадрат превращает километры в квадратные километры. Усреднение единицу измерения не меняет.
  kind: open
  reference: MSE измеряется в квадратных километрах, потому что каждое отклонение предсказания от истинного значения возводится в квадрат перед усреднением.
  id: 015-mse-measure-3
  fingerprint: aace8a0c
