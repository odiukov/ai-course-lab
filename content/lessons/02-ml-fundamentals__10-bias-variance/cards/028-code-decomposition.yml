- concept: дисперсия всей матрицы смешивает нестабильность моделей с различиями между тестовыми точками
  question: Почему нельзя оценивать variance модели выражением `predictions.var()` по всей матрице предсказаний сразу?
  explanation: '`predictions.var(axis=0)` сравнивает модели при фиксированных тестовых точках. Дисперсия всей матрицы дополнительно реагировала бы на различия предсказаний между самими точками, которые не характеризуют нестабильность обучения.'
  kind: open
  reference: 'Общая дисперсия смешает два источника различий: расхождение моделей в одной и той же точке и естественное изменение предсказываемой величины между разными точками. Нужно отдельно измерить разброс моделей для каждой тестовой точки, а затем усреднить результаты.'
  id: 028-code-decomposition-1
  fingerprint: b872cfa6
- concept: одномерный массив истинных значений транслируется по строкам матрицы предсказаний
  question: Массив `predictions` имеет форму `(n_models, n_points)`, а `y_true` — форму `(n_points,)`. Что делает NumPy при вычислении `predictions - y_true`?
  explanation: Последняя размерность совпадает с числом тестовых точек, поэтому NumPy транслирует `y_true` по строкам. Результат сохраняет форму `predictions` и содержит ошибку каждой модели в каждой точке.
  kind: choice
  options:
    - Вычитает среднее значение каждой строки
    - Сопоставляет элементы `y_true` со строками моделей
    - Предварительно разворачивает оба массива в векторы
    - Всегда сообщает о несовместимости форм
    - Распространяет `y_true` на все строки и вычитает истинное значение каждого столбца из предсказаний всех моделей
  correct: 4
  id: 028-code-decomposition-2
