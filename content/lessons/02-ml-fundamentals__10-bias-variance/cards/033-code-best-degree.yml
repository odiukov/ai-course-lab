- concept: стандартная learning curve строится при фиксированной модели и изменении размера обучающей выборки
  question: Расположи действия для построения стандартной learning curve в правильном порядке.
  explanation: В стандартной learning curve изменяют только объём обучающих данных. Модель и гиперпараметры сохраняют неизменными, чтобы динамику ошибок можно было связать именно с размером выборки.
  kind: order
  items:
    - Зафиксировать модель и её гиперпараметры
    - Подготовить всё более крупные подвыборки обучающих данных
    - Обучить модель на каждой подвыборке и измерить ошибки на обучении и валидации
  id: 033-code-best-degree-1
  fingerprint: 585a6596
- concept: валидационные данные оценивают кандидатов и не участвуют в подборе их коэффициентов
  question: Перебираются несколько степеней полинома. Как выбрать степень без утечки данных из валидационной выборки?
  explanation: Коэффициенты каждого кандидата подбираются только по обучающим данным. Валидационные точки используются лишь для оценки предсказаний; их включение в обучение сделало бы оценку качества на новых данных оптимистичной.
  kind: choice
  options:
    - Для каждой степени обучить коэффициенты на обучающей выборке, вычислить MSE на одной и той же валидационной выборке и выбрать минимальную ошибку
    - Для каждой степени объединить обучающую и валидационную выборки, а затем вычислить MSE на валидационных точках
    - Отдельно обучить каждый полином на валидационной выборке и сравнить полученные ошибки обучения
    - Выбрать степень с минимальной MSE на обучающей выборке, не используя валидационные данные
