- concept: за порогом интерполяции множество точных решений позволяет алгоритму выбрать более простое и устойчивое
  question: Объясни своими словами, почему сильно переопараметризованная модель может обобщать лучше модели, находящейся ровно около порога интерполяции.
  explanation: 'Переопараметризация сама по себе не определяет качество обобщения. Важны множество допустимых решений и предпочтения алгоритма обучения: например, неявная регуляризация градиентного спуска может выбрать среди интерполирующих решений более устойчивое.'
  kind: open
  reference: Около порога интерполяции возможностей модели едва хватает для точной подгонки обучающих данных, поэтому найденное решение может быть хрупким и иметь высокий variance. Далеко за порогом точных решений становится много, а явная или неявная регуляризация алгоритма обучения может направить выбор к сравнительно простому и устойчивому решению.
  id: 054-double-descent-2
  fingerprint: a6a7a2aa
