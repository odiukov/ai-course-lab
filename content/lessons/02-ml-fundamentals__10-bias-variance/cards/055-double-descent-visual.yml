- concept: резкий локальный пик тестовой ошибки отмечает область порога интерполяции
  question: На графике зависимости ошибок от числа параметров какой признак наиболее точно указывает на область порога интерполяции?
  explanation: Около порога интерполяции модели уже хватает ёмкости для точной подгонки обучающих данных, поэтому train-ошибка близка к нулю. При этом решение особенно неустойчиво, variance достигает пика, а test-ошибка резко возрастает.
  kind: choice
  options:
    - Обучающая и тестовая ошибки велики и плавно уменьшаются
    - Обучающая ошибка почти нулевая, а тестовая образует резкий локальный пик
    - Обучающая ошибка растёт, а тестовая остаётся постоянной
    - Обе ошибки становятся почти нулевыми и перестают меняться
  correct: 1
  id: 055-double-descent-visual-1
  fingerprint: '84352392'
- concept: порог интерполяции возникает, когда число параметров сопоставимо с числом обучающих примеров
  question: Заполни соотношение, характерное для порога интерполяции.
  explanation: Здесь p — число параметров, а n — число обучающих примеров. При p ≈ n ёмкости модели как раз хватает для интерполяции данных, но найденное решение часто оказывается наиболее хрупким.
  kind: cloze
  template: 'Порог интерполяции: p ___ n'
  answer: ≈
  accept:
    - '~'
    - примерно равно
    - сопоставимо с
  id: 055-double-descent-visual-2
  fingerprint: 2d90db01
