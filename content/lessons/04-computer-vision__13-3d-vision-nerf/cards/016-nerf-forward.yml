- concept: непрозрачность участка луча вычисляется как единица минус экспонента от произведения плотности на длину участка
  question: В объёмном рендеринге NeRF плотность на участке луча равна 2, а длина участка — 0.3. Чему примерно равна его непрозрачность α = 1 − exp(−σΔt)?
  explanation: α = 1 − exp(−2 · 0.3) = 1 − exp(−0.6) ≈ 0.45. Чем больше плотность или длина участка, тем большую долю цвета он вносит и тем меньше света пропускает дальше.
  kind: numeric
  answer: 0.45
  tolerance: 0.01
  id: 016-nerf-forward-1
  fingerprint: 7949967c
- concept: вклад дальнего отсчёта уменьшается накопленной непрозрачностью всех ближних отсчётов
  question: Луч NeRF сначала проходит через почти непрозрачный синий объект, а затем достигает жёлтой поверхности. Как при объёмном композитинге должен учитываться цвет жёлтой поверхности?
  explanation: Цвет каждого дальнего отсчёта умножается на накопленную пропускаемость предыдущих участков луча. Почти непрозрачный ближний объект оставляет мало пропущенного света, поэтому жёлтая поверхность почти не влияет на итоговый пиксель.
  kind: choice
  options:
    - С полным весом, независимо от ближнего объекта
    - С весом, уменьшенным на долю света, пропущенную ближним объектом
    - С тем же весом, что и цвет ближнего объекта
    - Только через среднее арифметическое цветов всех отсчётов
  correct: 1
  id: 016-nerf-forward-2
  fingerprint: fe77193b
