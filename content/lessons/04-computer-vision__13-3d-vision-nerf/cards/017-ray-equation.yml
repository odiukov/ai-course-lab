- concept: точка на луче равна его началу плюс параметр, умноженный на направление
  question: Восстанови формулу точки на луче с началом \(\mathbf{o}\), направлением \(\mathbf{d}\) и параметром \(t\).
  explanation: Вектор \(t\mathbf{d}\) задаёт смещение вдоль луча, а прибавление \(\mathbf{o}\) переносит это смещение в систему координат сцены.
  kind: cloze
  template: \(\mathbf{p}(t)=\;___\)
  answer: \mathbf{o}+t\mathbf{d}
  accept:
    - o + t d
    - t d + o
    - \mathbf{o}+\mathbf{d}t
  id: 017-ray-equation-1
  fingerprint: 63d2605b
- concept: параметр луча равен пройденному расстоянию только при единичном направлении
  question: Объясни, при каком условии параметр \(t\) в формуле \(\mathbf{p}(t)=\mathbf{o}+t\mathbf{d}\) численно совпадает с расстоянием от начала луча до точки.
  explanation: Умножение направления на \(t\) создаёт смещение длиной \(|t|\lVert\mathbf{d}\rVert\). Поэтому сам параметр выражает расстояние только для направления единичной длины.
  kind: open
  reference: Вектор направления \(\mathbf{d}\) должен быть нормирован, то есть иметь единичную длину. В общем случае длина смещения равна \(|t|\lVert\mathbf{d}\rVert\), поэтому без нормировки \(t\) служит лишь коэффициентом масштаба.
  id: 017-ray-equation-2
  fingerprint: a4149bb2
