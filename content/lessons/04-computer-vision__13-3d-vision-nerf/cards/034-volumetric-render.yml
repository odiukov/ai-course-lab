- concept: глубина луча вычисляется как взвешенная сумма расстояний до сэмплов
  question: 'У луча ненулевые веса есть только у сэмплов на расстояниях 8 и 11: их веса равны 0.4 и 0.6. Какую глубину вернёт объёмный рендеринг?'
  explanation: 'Глубина равна сумме произведений весов на расстояния: 0.4 × 8 + 0.6 × 11 = 9.8.'
