- concept: цвета полностью прозрачных сэмплов не влияют на результат объёмного рендеринга
  question: Все сэмплы вдоль луча имеют нулевую плотность, но произвольные RGB-значения. Объясни, почему эти цвета не влияют на итоговый пиксель в рендерере без отдельного фонового слагаемого.
  explanation: Цвет сэмпла участвует в пикселе только после умножения на его вес. Полностью прозрачный сэмпл имеет нулевой вес, поэтому его RGB не вносит вклад.
  kind: open
  reference: Нулевая плотность даёт нулевую непрозрачность каждого сегмента, поэтому все веса сэмплов равны нулю. Взвешенная сумма их цветов становится нулевым RGB-вектором независимо от исходных цветов.
  id: 035-check-rendering-2
  fingerprint: 3a89bef3
