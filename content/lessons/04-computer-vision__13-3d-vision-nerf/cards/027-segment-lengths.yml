- concept: N равномерных сэмплов, включающих границы диапазона, образуют N−1 промежутков
  question: На луче равномерно расположили 8 сэмплов, включая границы диапазона от t = 7 до t = 56. Чему равна длина каждого промежутка между соседними сэмплами?
  explanation: Восемь сэмплов образуют семь промежутков, поэтому шаг равен (56 − 7) / (8 − 1) = 7. Аналогично, в материале 64 сэмпла между 2 и 6 образуют 63 промежутка.
  kind: numeric
  answer: 7
  tolerance: 0.001
  id: 027-segment-lengths-1
  fingerprint: 6ab474b6
- concept: длина сегмента последнего сэмпла задаётся граничным соглашением из-за отсутствия следующего сэмпла
  question: Почему в объёмном рендеринге длину сегмента для последнего сэмпла нельзя вычислить тем же способом, что и для остальных?
  explanation: Обычная длина использует расстояние до следующего сэмпла, но у последнего правого соседа нет. Поэтому для него применяют отдельное граничное соглашение, например задают очень большую длину, обозначающую продолжение луча.
  kind: choice
  options:
    - Плотность последнего сэмпла всегда равна нулю
    - У последнего сэмпла нет следующего значения параметра, с которым можно взять разность
    - Последний сэмпл всегда совпадает с положением камеры
    - Цвет последнего сэмпла не участвует в рендеринге
  correct: 1
