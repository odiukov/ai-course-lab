- concept: NeRF подходит для синтеза новых видов сцены по изображениям с известными позами камер
  question: Сцену сняли с нескольких известных положений камеры. Требуется построить изображение с положения, из которого съёмка не выполнялась. Какой метод лучше соответствует задаче?
