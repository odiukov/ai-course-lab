- concept: поза camera-to-world преобразует начало луча переносом, а направление — только поворотом
  question: 'Поза камеры задана преобразованием camera-to-world: мировая точка получается поворотом R и переносом t. Как преобразовать луч с направлением d_camera в мировую систему координат?'
  explanation: Центр камеры переходит в мировую точку t. Направление является вектором, поэтому на него действует поворот R, но не перенос; после этого направление при необходимости нормализуют.
  kind: choice
  options:
