- concept: плотность в NeRF инвариантна к изменению направления взгляда при фиксированной позиции
  question: Два луча проходят через одну и ту же пространственную точку, но имеют разные направления. Заполни равенство для плотности архитектуры NeRF, в которой её голова не получает направление.
  explanation: Скрытый признак для головы плотности строится только из позиции x. Поэтому изменение d может повлиять на RGB, но при неизменной позиции не меняет sigma.
  kind: cloze
  template: sigma(x, d_a) = ___
  answer: sigma(x, d_b)
  accept:
    - σ(x, d_b)
    - sigma(x)
