- concept: выходные активации ограничивают плотность неотрицательными значениями, а цвет — единичным диапазоном
  question: Зачем в выходных головах TinyNeRF применять ReLU к плотности и Sigmoid к компонентам цвета?
  explanation: ReLU не позволяет sigma стать отрицательной, что согласуется с её ролью в объёмном рендеринге. Sigmoid ограничивает каждый канал RGB диапазоном от 0 до 1.
  kind: choice
  options:
    - Чтобы плотность была неотрицательной, а компоненты RGB лежали в нормированном диапазоне
    - Чтобы плотность зависела от направления, а цвет — только от позиции
    - Чтобы обе головы выдавали категориальные вероятности
    - Чтобы полностью устранить нелинейность скрытого представления
  correct: 0
