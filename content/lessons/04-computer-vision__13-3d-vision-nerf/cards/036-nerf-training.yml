- concept: совместное обучение по разным ракурсам ограничивает неоднозначные объяснения изображений единой моделью сцены
  question: Объясните своими словами, почему обучение NeRF по нескольким ракурсам лучше восстанавливает согласованную сцену, чем обучение по одному изображению.
  explanation: 'Дополнительные ракурсы дают перекрёстные ограничения: модель не может независимо подобрать отдельную сцену для каждого снимка, поскольку все изображения обслуживаются общими весами.'
  kind: open
  reference: Одно изображение допускает множество сочетаний геометрии, плотности и цвета, способных породить те же пиксели. При обучении по разным ракурсам одни и те же параметры NeRF должны одновременно правильно воспроизводить лучи всех камер, поэтому многие несовместимые объяснения исключаются.
