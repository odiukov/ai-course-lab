- concept: дифференцируемый объёмный рендеринг передаёт ошибку пикселя к параметрам NeRF
  question: Расположите этапы одного шага обучения NeRF в правильном порядке.
  explanation: Ошибка задаётся на итоговом цвете пикселя. Поскольку операции рендеринга дифференцируемы, обратное распространение связывает эту ошибку с предсказаниями всех сэмплов и затем с весами сети.
  kind: order
  items:
    - MLP предсказывает плотность и цвет в сэмплах луча
    - Объёмный рендеринг объединяет предсказания в цвет пикселя
    - Предсказанный цвет сравнивается с цветом пикселя на фотографии
    - Градиент проходит через рендеринг к параметрам MLP
    - Оптимизатор обновляет параметры MLP
