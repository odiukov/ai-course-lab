- concept: направление взгляда позволяет NeRF моделировать зависящий от ракурса цвет
  question: Почему NeRF может вернуть разные цвета для одной и той же пространственной точки при наблюдении с разных сторон?
  explanation: Координаты определяют запрашиваемое место, а направление взгляда позволяет цвету зависеть от ракурса. Так NeRF может описывать блики и другие эффекты, меняющиеся при движении камеры.
  kind: choice
  options:
    - При перемещении камеры автоматически меняются координаты самой точки
    - Направление взгляда входит в запрос к функции сцены и влияет на предсказываемый цвет
    - Для каждого пикселя обучается отдельный набор весов
    - Плотность точки случайно выбирает один из возможных цветов
  correct: 1
  id: 015-nerf-scene-function-1
  fingerprint: '27347435'
- concept: классический NeRF кодирует конкретную сцену в обученных параметрах MLP
  question: Заполни пропуск в утверждении о представлении сцены классическим NeRF.
  explanation: 'NeRF не хранит отдельную сетку точек или полигонов: плотность и цвет сцены закодированы в параметрах сети. Для другой сцены классическому NeRF обычно нужен другой обученный набор весов.'
  kind: cloze
  template: После обучения описание конкретной сцены находится в ___ MLP.
  answer: весах
  accept:
    - параметрах
    - обученных весах
    - обученных параметрах
  id: 015-nerf-scene-function-2
  fingerprint: d4a7423e
- concept: плотность NeRF описывает способность области пространства поглощать и перекрывать свет
  question: Объясни своими словами, что означает плотность σ, возвращаемая NeRF для точки пространства.
  explanation: Значение σ используется как мера объёмной непрозрачности. Чем оно выше, тем больший вклад получает текущая область и тем слабее видны расположенные за ней части сцены.
  kind: open
  reference: Это не массовая плотность вещества, а величина, задающая, насколько сильно содержимое данной области ослабляет свет и скрывает то, что находится дальше вдоль луча. В пустом пространстве она мала, а в непрозрачной области велика.
  id: 015-nerf-scene-function-3
  fingerprint: 4ce8cf74
