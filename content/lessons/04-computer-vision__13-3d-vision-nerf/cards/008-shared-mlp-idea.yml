- concept: поточечный общий MLP эквивариантен к перестановке точек
  question: Объясните, что произойдёт с выходными признаками общего поточечного MLP, если изменить порядок точек во входном облаке до агрегации.
  explanation: Общий MLP не смешивает точки и не зависит от их позиций в списке. Поэтому перестановка входов вызывает соответствующую перестановку выходов; неизменное описание всего облака появится только после симметричной агрегации.
  kind: open
  reference: 'Выходные признаки переставятся в том же порядке, что и входные точки: признак каждой точки не изменится, поскольку она обрабатывается независимо тем же MLP. Это эквивариантность к перестановке, а не инвариантность всего набора.'
  id: 008-shared-mlp-idea-2
  fingerprint: b358d2fa
