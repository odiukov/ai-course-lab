- concept: иерархическая локальная агрегация строит представление облака от небольших геометрических фрагментов к форме целого
  question: Расположите этапы иерархической обработки облака точек в правильном порядке.
  explanation: Сначала модель кодирует небольшие окрестности, затем объединяет их на всё более крупных масштабах. Благодаря этому глобальное представление строится из уже найденных локальных деталей, а не непосредственно из независимых признаков отдельных точек.
  kind: order
  items:
    - Выбрать центры локальных областей и найти геометрически близкие к ним точки
    - Вычислить и симметрично агрегировать признаки точек внутри каждой области
    - Рассматривать полученные признаки областей как элементы следующего, более крупного масштаба
    - Объединить признаки крупных фрагментов в представление всего облака
  id: 014-pointnet-limits-2
