- concept: непрозрачность насыщается при росте оптической толщины
  question: Почему одинаковое увеличение произведения σδ заметнее повышает непрозрачность оптически тонкого сегмента, чем уже почти непрозрачного?
  explanation: У функции α = 1 − exp(−σδ) убывающий наклон. Поэтому рост плотности или длины сначала сильно меняет непрозрачность, а затем эффект постепенно ослабевает.
  kind: open
  reference: 'Зависимость α = 1 − exp(−σδ) насыщается: по мере роста σδ экспоненциальный остаток становится всё меньше, поэтому α приближается к полной непрозрачности, а каждый следующий прирост даёт всё меньший эффект.'
  id: 029-density-to-opacity-2
  fingerprint: 0233beae
