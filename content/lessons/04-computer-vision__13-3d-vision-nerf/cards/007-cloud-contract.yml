- concept: облако точек не хранит связность и топологию поверхности
  question: Почему одного облака точек недостаточно, чтобы непосредственно определить, какие точки образуют общую поверхность и как они соединены?
  explanation: В отличие от полигональной сетки, облако точек явно задаёт только набор пространственных образцов. Связи между ними и разбиение на поверхности в представлении отсутствуют.
  kind: open
  reference: Облако хранит координаты отдельных точек и, возможно, их признаки, но не содержит рёбер, граней или другой информации о связности. Поэтому топологию и поверхность приходится восстанавливать дополнительно.
