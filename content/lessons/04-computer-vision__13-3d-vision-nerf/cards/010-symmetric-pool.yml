- concept: поканальный max pool создаёт глобальный признак из максимумов, которые могут принадлежать разным точкам
  question: Общий MLP сопоставил каждой точке облака вектор признаков. Какое утверждение верно для результата поканального max pool?
  explanation: Максимум вычисляется для каждого канала независимо. Поэтому один канал может выбрать признак одной точки, а другой — признак другой; итоговый глобальный вектор может отсутствовать среди поточечных векторов.
  kind: choice
  options:
    - Он всегда совпадает с полным вектором признаков одной из входных точек
    - Его компоненты могут быть взяты от разных точек, поэтому он не обязан совпадать ни с одним входным вектором целиком
    - Все его компоненты обязательно получены усреднением признаков точек
  correct: 1
  id: 010-symmetric-pool-1
  fingerprint: da8c4f43
- concept: размер глобального вектора после симметричной агрегации не зависит от числа точек
  question: Поточечный MLP выдаёт для каждой точки вектор из C признаков. Какой размер имеет результат поканального max pool для любого непустого облака?
  explanation: Max pool оставляет по одному максимуму для каждого из C каналов. Число точек влияет на набор кандидатов для максимума, но не на длину итогового вектора.
  kind: choice
  options:
    - C, независимо от числа точек
    - Произведение C на число точек
    - Размер равен числу точек
  correct: 0
  id: 010-symmetric-pool-2
  fingerprint: 920e2040
