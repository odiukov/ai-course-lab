- concept: Mip-NeRF подавляет алиасинг и поддерживает неограниченные сцены
  question: На изображениях удалённые мелкие детали мерцают при движении камеры, а сцена выходит далеко за фиксированный ограничивающий объём. Какой вариант NeRF предназначен для этих условий и какие две проблемы он решает?
  explanation: Эта разновидность NeRF учитывает масштаб области пространства, соответствующей пикселю, поэтому мелкие детали корректно усредняются и меньше мерцают. Преобразование координат также позволяет представить неограниченное окружение.
  kind: open
  reference: 'Расширенный Mip-NeRF для неограниченных сцен: он подавляет алиасинг удалённых деталей и позволяет моделировать сцены без фиксированных пространственных границ.'
