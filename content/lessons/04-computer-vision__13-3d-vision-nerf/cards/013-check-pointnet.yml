- concept: точка, не достигающая максимума ни в одном канале, не влияет на результат max pool
  question: Из облака удалили точку, признаки которой после общего MLP не были максимальными ни в одном канале. Что произойдёт с глобальным признаком PointNet и почему?
  explanation: Max pool сохраняет только поканальные максимумы. Точка, которая не определяет ни один из них, может быть удалена без изменения глобального признака.
  kind: open
  reference: 'Глобальный признак не изменится: максимум в каждом канале обеспечивался другими точками, поэтому удалённая точка нигде не участвовала в результате max pool.'
