- concept: transmittance текущего сэмпла учитывает только предшествующие ему сегменты луча
  question: Какие слагаемые входят в показатель экспоненты при вычислении transmittance T_i в объёмном рендеринге?
  explanation: 'T_i = exp(−Σ_{j<i} σ_jδ_j): условие j<i исключает текущий сегмент. Поэтому T_i описывает свет, дошедший до сэмпла через все предыдущие участки луча.'
  kind: choice
  options:
    - Плотности и длины только тех сегментов, которые расположены перед сэмплом i
    - Плотности и длины всех сегментов вплоть до сэмпла i включительно
    - Плотность и длина только сегмента i
    - Плотности и длины сегментов, расположенных после сэмпла i
  correct: 0
  id: 031-transmittance-idea-1
  fingerprint: 9f5227a6
- concept: transmittance следующего сэмпла рекуррентно получается ослаблением текущей transmittance на текущем сегменте
  question: Заполни пропуск в рекуррентной формуле обновления transmittance при движении вдоль луча.
  explanation: При переходе к следующему сэмплу накопленная доля света дополнительно умножается на пропускание текущего сегмента exp(−σ_iδ_i). Так последовательно учитывается поглощение вдоль луча.
  kind: cloze
  template: T_{i+1} = T_i · ___
  answer: exp(−σ_i δ_i)
  accept:
    - e^(−σ_i δ_i)
    - exp(-sigma_i * delta_i)
    - е^(-σ_iδ_i)
  id: 031-transmittance-idea-2
  fingerprint: 54da7e6f
