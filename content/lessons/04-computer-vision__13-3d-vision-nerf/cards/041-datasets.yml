- concept: различие ShapeNet и KITTI определяется происхождением данных и прикладной задачей
  question: Объясните, почему ShapeNet подходит для классификации формы моделей САПР, а KITTI — для восприятия окружения автономным автомобилем.
  explanation: 'Выбор определяется не наличием любых трёхмерных данных, а соответствием источника и представления данных целевой задаче: цифровые модели объектов и реальные уличные LiDAR-измерения требуют разных датасетов.'
  kind: open
  reference: ShapeNet содержит трёхмерные модели САПР, представленные как облака точек, поэтому подходит для классификации и сегментации форм. KITTI содержит уличные LiDAR-облака, соответствующие данным датчиков автономного автомобиля.
