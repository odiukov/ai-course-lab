- concept: ReLU между линейными слоями делает преобразование ствола нелинейным
  question: Объясните своими словами, зачем между линейными слоями ствола TinyNeRF нужны ReLU.
  explanation: Несколько Linear без активаций не дают принципиально более сложного отображения, поскольку их можно объединить в один слой. ReLU обнуляет часть значений в зависимости от входа, благодаря чему сеть формирует нелинейное внутреннее описание точки.
  kind: open
  reference: Композиция линейных или аффинных слоёв без нелинейностей сводится к одному аффинному преобразованию. ReLU вводит нелинейность и позволяет стволу выделять сложные сочетания позиционных признаков.
  id: 023-nerf-trunk-2
  fingerprint: 2dbeb5c7
