- concept: многомасштабные Фурье-признаки делают высокочастотную зависимость от координат доступной MLP
  question: Почему подача синусов и косинусов нескольких пространственных частот помогает NeRF воспроизводить мелкие детали, хотя сами координаты точек не становятся точнее?
  explanation: При L=10 каждая координата описывается десятью парами синуса и косинуса с частотами от 2^0 до 2^9. Это не добавляет пространственных измерений, но предоставляет MLP удобный базис для представления как плавных, так и мелких деталей.
  kind: open
  reference: Кодирование заранее преобразует координату в признаки с разной скоростью изменения. Близкие точки могут заметно различаться в высокочастотных компонентах, поэтому MLP может комбинировать готовые признаки для описания быстрых пространственных изменений.
