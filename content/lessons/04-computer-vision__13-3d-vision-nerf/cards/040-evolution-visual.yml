- concept: название NeRF-продукта не гарантирует использование классического NeRF как внутреннего представления
  question: Почему из названия «NeRF-продукт» нельзя заключить, что внутри обязательно используется классический NeRF с MLP?
  explanation: Термин NeRF продолжает использоваться для продуктов реконструкции и синтеза новых ракурсов, хотя в production классическое поле часто заменено Gaussian Splatting с другим способом хранения и рендеринга сцены.
  kind: open
  reference: Название может обозначать класс задачи и унаследованную ментальную модель синтеза новых видов, тогда как современная реализация может хранить сцену как набор Gaussian-примитивов и рендерить их без классических запросов к NeRF-полю.
