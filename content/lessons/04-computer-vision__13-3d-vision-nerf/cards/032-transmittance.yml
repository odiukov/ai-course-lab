- concept: малая положительная добавка предотвращает точное обнуление накопленного произведения ценой пренебрежимо малого смещения
  question: Объясни, зачем при вычислении накопленной видимости к прозрачности сегмента иногда добавляют малую положительную величину и какой побочный эффект это создаёт.
  explanation: В коде урока используется добавка 1e-10. После полностью непрозрачного сегмента последующая видимость остаётся почти нулевой, но не обнуляется точно; это компромисс между точностью формулы и устойчивостью дальнейших вычислений.
  kind: open
  reference: Добавка не позволяет множителю и всем последующим накопленным произведениям стать точным нулём, что повышает численную устойчивость. При этом полностью непрозрачный сегмент начинает пропускать пренебрежимо малую ненулевую долю света, поэтому результат немного отличается от точной физической формулы.
