<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Карта способов представить сцену</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f7f8fc;
    --panel: #ffffff;
    --explicit: #e9f3ff;
    --implicit: #f3edff;
    --explicit-card: #f7fbff;
    --implicit-card: #fbf8ff;
    --ink: #172033;
    --muted: #526077;
    --line: #65738b;
    --explicit-accent: #2573c8;
    --implicit-accent: #7951b8;
    --border: #b9c3d3;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: unset;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .frame {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
  }

  h1 {
    margin: unset;
    text-align: center;
    font-size: 22px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 480px;
    background: var(--bg);
  }

  .connector {
    fill: none;
    stroke: var(--line);
    stroke-width: 3px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .arrow {
    fill: var(--line);
  }

  .card {
    stroke: var(--border);
    stroke-width: 2px;
  }

  .root-card {
    fill: var(--panel);
  }

  .explicit-group {
    fill: var(--explicit);
    stroke: var(--explicit-accent);
  }

  .implicit-group {
    fill: var(--implicit);
    stroke: var(--implicit-accent);
  }

  .explicit-method {
    fill: var(--explicit-card);
    stroke: var(--explicit-accent);
  }

  .implicit-method {
    fill: var(--implicit-card);
    stroke: var(--implicit-accent);
  }

  text {
    fill: var(--ink);
  }

  .root-title {
    font-size: 20px;
    font-weight: bold;
  }

  .branch-title {
    font-size: 19px;
    font-weight: bold;
  }

  .method-title {
    font-size: 18px;
    font-weight: bold;
  }

  .body-label {
    font-size: 15px;
    fill: var(--muted);
  }

  .kind-explicit {
    font-size: 13px;
    font-weight: bold;
    fill: var(--explicit-accent);
  }

  .kind-implicit {
    font-size: 13px;
    font-weight: bold;
    fill: var(--implicit-accent);
  }

  .question {
    font-size: 15px;
  }

  .icon-line {
    fill: none;
    stroke: var(--muted);
    stroke-width: 2px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .explicit-icon {
    fill: var(--explicit-accent);
    stroke: var(--explicit-accent);
    stroke-width: 2px;
  }

  .implicit-icon {
    fill: var(--implicit-accent);
    stroke: var(--implicit-accent);
    stroke-width: 2px;
  }

  .icon-box {
    fill: none;
    stroke: var(--explicit-accent);
    stroke-width: 2px;
  }

  .fallback {
    font-size: 18px;
    fill: var(--ink);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #111722;
      --panel: #192231;
      --explicit: #152d46;
      --implicit: #2b2140;
      --explicit-card: #172638;
      --implicit-card: #251e34;
      --ink: #edf3fb;
      --muted: #b8c4d5;
      --line: #9eacc0;
      --explicit-accent: #6eb8ff;
      --implicit-accent: #c09aff;
      --border: #455267;
    }
  }
</style>
</head>
<body>
<main class="frame">
  <h1>Карта способов представить сцену</h1>
  <svg id="map" width="1200" height="460" viewBox="0 0 1200 460"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="svg-title svg-desc">
    <title id="svg-title">Явные и неявные представления сцены</title>
    <desc id="svg-desc">Облако точек, меш и воксели хранят элементы сцены явно. SDF и NeRF отвечают на запрос о выбранной точке пространства.</desc>
  </svg>
</main>
<script>
const data = [{
  origin: [0, 0],
  scale: [1, 1],
  namespace: "http://www.w3.org/2000/svg",
  fallback: [600, 225],
  cards: [
    { box: [24, 184, 214, 280], className: "card root-card" },
    { box: [290, 70, 505, 150], className: "card explicit-group" },
    { box: [290, 320, 505, 404], className: "card implicit-group" },
    { box: [585, 34, 770, 168], className: "card explicit-method" },
    { box: [786, 34, 974, 168], className: "card explicit-method" },
    { box: [990, 34, 1175, 168], className: "card explicit-method" },
    { box: [630, 294, 880, 442], className: "card implicit-method" },
    { box: [900, 294, 1175, 442], className: "card implicit-method" }
  ],
  connectors: [
    [[214, 213], [250, 213], [250, 110], [290, 110]],
    [[214, 251], [250, 251], [250, 362], [290, 362]],
    [[505, 110], [545, 110], [545, 18], [1082, 18]],
    [[678, 18], [678, 34]],
    [[880, 18], [880, 34]],
    [[1082, 18], [1082, 34]],
    [[505, 362], [560, 362], [560, 278], [1037, 278]],
    [[755, 278], [755, 294]],
    [[1037, 278], [1037, 294]]
  ],
  arrows: [
    [[290, 110], [278, 103], [278, 117]],
    [[290, 362], [278, 355], [278, 369]],
    [[678, 34], [671, 22], [685, 22]],
    [[880, 34], [873, 22], [887, 22]],
    [[1082, 34], [1075, 22], [1089, 22]],
    [[755, 294], [748, 282], [762, 282]],
    [[1037, 294], [1030, 282], [1044, 282]]
  ],
  labels: [
    [119, 215, "root-title", "middle", "Одна сцена"],
    [119, 242, "body-label", "middle", "Что хотим делать?"],
    [119, 266, "body-label", "middle", "Выбери ветвь"],

    [310, 101, "branch-title", "start", "Явные"],
    [310, 128, "body-label", "start", "Храним элементы сцены"],

    [310, 351, "branch-title", "start", "Неявные"],
    [310, 378, "body-label", "start", "Спрашиваем о пространстве"],

    [603, 67, "method-title", "start", "Облако точек"],
    [603, 91, "kind-explicit", "start", "ЯВНОЕ"],
    [603, 118, "question", "start", "«Какие точки"],
    [603, 142, "question", "start", "сохранены?»"],

    [804, 67, "method-title", "start", "Меш"],
    [804, 91, "kind-explicit", "start", "ЯВНОЕ"],
    [804, 118, "question", "start", "«Какие грани образуют"],
    [804, 142, "question", "start", "поверхность?»"],

    [1008, 67, "method-title", "start", "Воксели"],
    [1008, 91, "kind-explicit", "start", "ЯВНОЕ"],
    [1008, 118, "question", "start", "«Какие ячейки"],
    [1008, 142, "question", "start", "заняты?»"],

    [650, 329, "method-title", "start", "SDF"],
    [650, 353, "kind-implicit", "start", "НЕЯВНОЕ"],
    [650, 382, "body-label", "start", "Вопрос к координате:"],
    [650, 410, "question", "start", "«Каково знаковое расстояние"],
    [650, 432, "question", "start", "до поверхности?»"],

    [920, 329, "method-title", "start", "NeRF"],
    [920, 353, "kind-implicit", "start", "НЕЯВНОЕ"],
    [920, 382, "body-label", "start", "Вопрос к координате:"],
    [920, 410, "question", "start", "«Каковы цвет и плотность"],
    [920, 432, "question", "start", "в этой точке?»"]
  ],
  circles: [
    [735, 58, 739, "explicit-icon"],
    [748, 68, 752, "explicit-icon"],
    [730, 78, 734, "explicit-icon"],
    [752, 84, 756, "explicit-icon"],
    [842, 327, 849, "icon-line"],
    [842, 327, 858, "icon-line"],
    [842, 327, 845, "implicit-icon"],
    [1150, 328, 1154, "implicit-icon"]
  ],
  iconLines: [
    [925, 55, 949, 78, "icon-line"],
    [949, 78, 921, 82, "icon-line"],
    [921, 82, 925, 55, "icon-line"],
    [925, 55, 943, 52, "icon-line"],
    [943, 52, 949, 78, "icon-line"],
    [1126, 315, 1150, 328, "icon-line"],
    [1126, 328, 1150, 328, "icon-line"],
    [1126, 341, 1150, 328, "icon-line"]
  ],
  iconRects: [
    [1125, 52, 1137, 64, "icon-box"],
    [1140, 52, 1152, 64, "icon-box"],
    [1132, 67, 1144, 79, "icon-box"]
  ]
}];

const [scene] = data;
const [originX, originY] = scene.origin;
const [scaleX, scaleY] = scene.scale;
const origin = { x: originX, y: originY };
const scale = { x: scaleX, y: scaleY };
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const svg = document.getElementById("map");

  const make = (tag, attributes, content) => {
    const node = document.createElementNS(scene.namespace, tag);
    Object.entries(attributes).forEach(([name, value]) => {
      node.setAttribute(name, value);
    });
    if (content !== undefined) {
      node.textContent = content;
    }
    return node;
  };

  scene.connectors.forEach(points => {
    const value = points.map(([x, y]) => `${sx(x)},${sy(y)}`).join(" ");
    svg.appendChild(make("polyline", {
      points: value,
      class: "connector"
    }));
  });

  scene.cards.forEach(({ box, className }) => {
    const [x1, y1, x2, y2] = box;
    svg.appendChild(make("rect", {
      x: sx(x1),
      y: sy(y1),
      width: sx(x2) - sx(x1),
      height: sy(y2) - sy(y1),
      class: className
    }));
  });

  scene.arrows.forEach(points => {
    const value = points.map(([x, y]) => `${sx(x)},${sy(y)}`).join(" ");
    svg.appendChild(make("polygon", {
      points: value,
      class: "arrow"
    }));
  });

  scene.iconLines.forEach(([x1, y1, x2, y2, className]) => {
    svg.appendChild(make("line", {
      x1: sx(x1),
      y1: sy(y1),
      x2: sx(x2),
      y2: sy(y2),
      class: className
    }));
  });

  scene.iconRects.forEach(([x1, y1, x2, y2, className]) => {
    svg.appendChild(make("rect", {
      x: sx(x1),
      y: sy(y1),
      width: sx(x2) - sx(x1),
      height: sy(y2) - sy(y1),
      class: className
    }));
  });

  scene.circles.forEach(([cx, cy, edgeX, className]) => {
    svg.appendChild(make("circle", {
      cx: sx(cx),
      cy: sy(cy),
      r: Math.abs(sx(edgeX) - sx(cx)),
      class: className
    }));
  });

  scene.labels.forEach(([x, y, className, anchor, content]) => {
    svg.appendChild(make("text", {
      x: sx(x),
      y: sy(y),
      class: className,
      "text-anchor": anchor
    }, content));
  });
} catch (error) {
  const svg = document.getElementById("map");
  const [fallbackX, fallbackY] = scene.fallback;
  const message = document.createElementNS(scene.namespace, "text");
  message.setAttribute("x", sx(fallbackX));
  message.setAttribute("y", sy(fallbackY));
  message.setAttribute("text-anchor", "middle");
  message.setAttribute("class", "fallback");
  message.textContent = "Схема должна показать явные представления — облако точек, меш и воксели — и неявные представления SDF и NeRF.";
  svg.replaceChildren(message);
}
</script>
</body>
</html>
