- concept: функция VAE-loss возвращает исходный KL, хотя в общей потере используется его взвешенное значение
  question: Какой набор возвращаемых значений позволяет корректно сравнивать величину KL-дивергенции между запусками с разными beta?
  explanation: Общая потеря вычисляется как recon + beta * KL, но отдельно следует возвращать невзвешенный KL. Иначе изменение beta изменит журналируемую компоненту даже при неизменном латентном распределении.
  kind: choice
  options:
    - Общая потеря, ошибка восстановления, beta * KL
    - Общая потеря, ошибка восстановления, исходный KL
    - Ошибка восстановления, beta * KL, общая потеря
  correct: 1
  id: 025-code-elbo-loss-1
  fingerprint: 01ba9fa4
- concept: раздельное логирование компонентов VAE-loss показывает источник изменения общей потери
  question: Почему одного значения общей функции потерь недостаточно, чтобы понять, как меняется обучение VAE?
  explanation: Снижение общей потери само по себе не показывает, улучшилась ли реконструкция или приблизилось ли латентное распределение к априорному. Отдельные значения recon и KL устраняют эту неоднозначность.
  kind: open
  reference: Общая потеря объединяет ошибку восстановления и KL-регуляризацию, поэтому одинаковое изменение итога может быть вызвано любой из компонент. Для диагностики нужно отдельно отслеживать recon и исходный KL.
  id: 025-code-elbo-loss-2
  fingerprint: e6faf58a
