- concept: параметризация через логарифм дисперсии упрощает вычисление KL-дивергенции для гауссовых распределений
  question: Почему VAE часто параметризует гауссово распределение через логарифм дисперсии, хотя положительную дисперсию можно получить и с помощью softplus?
  explanation: Softplus действительно гарантирует положительность. Преимущество log σ² состоит в том, что эта величина непосредственно входит в замкнутую формулу KL для гауссиан и даёт простой градиент.
  kind: choice
  options:
    - Экспонента превращает гауссово распределение в равномерное
    - Такая параметризация устраняет KL-штраф из функции потерь
    - Она делает выборку латентного кода детерминированной
    - Формула KL уже содержит логарифм дисперсии, поэтому вычисления и градиент становятся проще
  correct: 3
  id: 010-log-variance-1
  fingerprint: 725b078b
- concept: дисперсия восстанавливается из её логарифма экспоненцированием
  question: Восстановите дисперсию v по её логарифму ℓ.
  explanation: Экспонента принимает только положительные значения, поэтому v = exp(ℓ) всегда является допустимой дисперсией. Стандартное отклонение затем вычисляется как σ = exp(ℓ/2).
  kind: cloze
  template: Если ℓ = log v, то v = ___.
  answer: exp(ℓ)
  accept:
    - e^ℓ
    - exp(l)
    - e^l
  id: 010-log-variance-2
  fingerprint: 4a032a20
- concept: градиент KL по логарифму дисперсии направляет дисперсию приближённого распределения к дисперсии стандартного нормального априорного распределения
  question: Объясните, как знак градиента KL по log σ² помогает приблизить дисперсию кодировщика к единичной дисперсии стандартного нормального prior.
  explanation: Из ∂KL/∂(log σ²) = (σ² − 1)/2 видно, что знак градиента меняется по разные стороны от единичной дисперсии. Поэтому минимум по этому параметру достигается при σ² = 1.
  kind: open
  reference: Если дисперсия выше единичной, градиент положителен, поэтому градиентный спуск уменьшает log σ². Если дисперсия ниже единичной, градиент отрицателен и градиентный спуск увеличивает log σ². В обоих случаях KL направляет дисперсию к единичной.
  id: 010-log-variance-3
  fingerprint: 7d87dbcd
