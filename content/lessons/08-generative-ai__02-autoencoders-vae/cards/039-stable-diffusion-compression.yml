- concept: сокращение числа пространственных позиций равно произведению коэффициентов уменьшения по двум осям
  question: Кодировщик преобразует изображение размером 700 × 420 в латентную сетку 100 × 60. Во сколько раз уменьшилось число пространственных позиций?
  explanation: Ширина и высота уменьшились в 7 раз каждая. Поэтому число позиций уменьшилось в 7 × 7 = 49 раз.
  kind: numeric
  answer: 49
  tolerance: 0.001
  id: 039-stable-diffusion-compression-1
  fingerprint: 5ce3edf1
- concept: сжатие по числу элементов тензора учитывает изменение количества каналов
  question: Входной тензор формы 600 × 350 × 5 преобразовали в латент формы 120 × 70 × 10. Какая пара коэффициентов сжатия верна?
  explanation: Площадь сетки сократилась в (600 × 350) / (120 × 70) = 25 раз. Число каналов удвоилось, поэтому общее число элементов уменьшилось лишь в 12.5 раза.
  kind: choice
  options:
    - Пространственных позиций — 25, элементов тензора — 12.5
    - Пространственных позиций — 12.5, элементов тензора — 25
    - И пространственных позиций, и элементов тензора — 25
    - Пространственных позиций — 50, элементов тензора — 25
  correct: 0
  id: 039-stable-diffusion-compression-2
  fingerprint: b642d19c
- concept: основная вычислительная экономия латентной диффузии связана с уменьшением пространственной сетки
  question: Почему при оценке ускорения латентной диффузии важно отдельно учитывать сокращение пространственной сетки, а не только уменьшение общего числа элементов тензора?
  explanation: Количество элементов тензора описывает объём представления, а размер пространственной сетки — сколько позиций приходится обрабатывать U-Net. Поэтому эти коэффициенты характеризуют разные стороны сжатия.
  kind: open
  reference: Свёртки и внимание обрабатывают пространственные позиции или соответствующие им токены. Уменьшение высоты и ширины сокращает рабочую сетку всех слоёв, даже если количество каналов латента увеличивается. Число каналов тоже влияет на точную стоимость операций, но не отражает эту основную пространственную экономию.
  id: 039-stable-diffusion-compression-3
  fingerprint: 46c9157c
