- concept: размерности обеих голов кодировщика совпадают с размерностью латентного пространства
  question: Пусть латентное пространство имеет размерность d. Какой размер должны иметь выходы голов μ и log σ² при диагональном гауссовском распределении?
  explanation: Каждой латентной координате нужны собственное среднее и собственный логарифм дисперсии. Поэтому обе головы возвращают по одному параметру на координату и имеют размерность d.
  kind: choice
  options:
    - Каждая голова должна вернуть вектор размерности d
    - Голова μ должна вернуть вектор размерности d, а голова log σ² — одно число
    - Обе головы вместе должны вернуть d значений, разделив координаты между собой
