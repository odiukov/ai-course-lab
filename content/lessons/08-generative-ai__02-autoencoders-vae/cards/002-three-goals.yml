- concept: совместная функция потерь балансирует точность восстановления и регулярность латентного пространства
  question: Почему в VAE точность восстановления и регулярность латентного пространства оптимизируют совместно?
  explanation: Цели конкурируют за ёмкость латентного представления. Слагаемое восстановления сохраняет информацию об объекте, а регуляризация упорядочивает коды; их совместная оптимизация не позволяет полностью пожертвовать одной целью ради другой.
  kind: open
  reference: Свободное размещение кодов помогает точно запоминать детали обучающих примеров, но может создать разрывы и изолированные области. Ограничение латентных распределений делает пространство более упорядоченным, однако чрезмерная регуляризация заставляет терять информацию об изображении. Совместная функция потерь ищет компромисс между этими требованиями.
  id: 002-three-goals-2
  fingerprint: 05dea175
- concept: сжатый код должен сохранять существенные особенности входного изображения
  question: После кодирования и декодирования цифры остаются узнаваемыми, но их наклон и толщина штрихов систематически теряются. Какая цель модели выполняется недостаточно хорошо?
  explanation: Короткий код должен сохранять не только класс цифры, но и важные особенности конкретного изображения. Систематическая потеря наклона и толщины означает, что при сжатии отброшено слишком много информации.
  kind: choice
  options:
    - Сохранение существенной информации при сжатии
    - Гладкость переходов между близкими латентными кодами
    - Соответствие латентных распределений выбранному приору
    - Возможность вычислять градиенты параметров декодера
  correct: 0
