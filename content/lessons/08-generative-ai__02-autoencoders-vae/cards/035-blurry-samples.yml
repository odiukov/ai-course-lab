- concept: независимый пиксельный шум не моделирует согласованный выбор одного из нескольких вариантов изображения
  question: Для одного латентного кода возможны несколько резких, но различающихся образов. Декодировщик с MSE выдаёт их размытое среднее. Почему добавление независимого гауссова шума к пикселям обычно не превращает его в один согласованный резкий вариант?
  explanation: Выбор резкого варианта требует совместно изменить множество зависимых пикселей. Независимый шум не моделирует такие связи и обычно добавляет зернистость вокруг усреднённого изображения, а не выбирает один целостный образ.
  kind: choice
  options:
    - Шум автоматически увеличивает штраф KL и подавляет декодировщик
    - Независимые возмущения меняют отдельные пиксели, но не выбирают согласованную конфигурацию всего изображения
    - Гауссов шум всегда сдвигает пиксели к условному среднему
    - Шум делает отображение из латентного пространства линейным
