- concept: для разных координат латентного вектора создаются отдельные гауссовы шумовые значения
  question: Почему при репараметризации для каждой координаты латентного вектора следует генерировать отдельное значение гауссова шума, а не использовать одно общее значение?
  explanation: В реализации генератор вызывается отдельно для каждой координаты. Повторное использование одного шума создало бы нежелательную зависимость между координатами и изменило бы распределение получаемого вектора.
  kind: open
  reference: 'Отдельные выборки шума позволяют координатам получать независимые случайные отклонения. Одно общее значение искусственно связало бы их движения: все координаты изменялись бы согласно одному и тому же случайному исходу.'
  id: 013-code-reparameterize-2
  fingerprint: 50df5f12
