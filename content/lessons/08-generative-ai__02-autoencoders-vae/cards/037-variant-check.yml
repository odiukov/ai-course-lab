- concept: выбор латентного представления и выбор распределения декодировщика решают разные задачи
  question: Объясни своими словами, почему выбор между непрерывным и дискретным латентом не определяет автоматически, нужен ли бернуллиевский декодировщик.
  explanation: Архитектура латента отвечает за форму скрытого представления, а правдоподобие декодировщика — за статистическую модель наблюдаемых значений. Поэтому тип декодировщика выбирают по данным на выходе, а не только по устройству латента.
  kind: open
  reference: 'Тип латента определяет способ представления скрытого кода: например, β-VAE использует непрерывные переменные, а VQ-VAE — дискретные элементы кодовой книги. Бернуллиевский декодировщик относится к модели выходных данных и подходит для бинарных признаков или масок, поэтому эти решения выбираются независимо.'
  id: 037-variant-check-3
  fingerprint: be312321
