- concept: VQ-VAE предоставляет дискретные латентные коды для последующего моделирования трансформером
  question: Нужно преобразовать аудиосигнал в последовательность индексов кодовой книги, которую затем будет моделировать трансформер. Какой тип модели подходит?
  explanation: VQ-VAE сопоставляет представления элементам конечной кодовой книги. Полученные дискретные индексы можно обрабатывать как последовательность токенов трансформера.
  kind: choice
  options:
    - Обычный VAE с непрерывным гауссовым латентом
    - β-VAE без квантования
    - VQ-VAE
