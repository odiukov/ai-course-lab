- concept: отжиг beta откладывает полное давление KL-регуляризации до формирования информативного латента
  question: Расположите этапы обучения VAE с отжигом beta в правильном порядке.
  explanation: Если сразу сильно штрафовать отклонение от априора, латент может потерять зависимость от входа. При отжиге beta сначала формируется полезный код, после чего возрастающая KL-регуляризация упорядочивает его.
  kind: order
  items:
    - Начать обучение со слабого веса KL-слагаемого
    - Позволить кодировщику сформировать информативные латентные представления
    - Постепенно усилить вес KL-слагаемого до целевого значения
  id: 034-collapse-remedies-1
  fingerprint: 3838af67
- concept: free bits создают отдельную область без градиентного давления KL для каждого латентного измерения
  question: Как free bits изменяют KL-регуляризацию отдельного латентного измерения VAE?
  explanation: Free bits задают каждому измерению небольшой допустимый KL-бюджет. Внутри него измерение может отклоняться от априора и хранить информацию без дополнительного давления, а за пределами бюджета KL-штраф снова действует.
  kind: choice
  options:
    - Не поощряют дальнейшее уменьшение его KL-вклада, пока тот находится в пределах бесплатного бюджета
    - Навсегда исключают это измерение из KL-слагаемого
    - Применяют KL-штраф только к среднему, но не к дисперсии
    - Заменяют KL-дивергенцию ошибкой восстановления
  correct: 0
  id: 034-collapse-remedies-2
  fingerprint: 661e3497
