- concept: расстояние Фреше между агрегированным латентным распределением и приором оценивает согласованность обучения декодировщика с генерацией из приора
  question: Объясни своими словами, зачем при оценке VAE сравнивать агрегированное распределение латентов на валидационных данных с N(0, I), если уже известны MSE восстановления и KL по отдельным измерениям.
  explanation: Агрегированное распределение объединяет латенты разных объектов датасета. Его среднее и ковариационная структура могут отличаться от N(0, I), даже если восстановление хорошее. Поэтому расстояние Фреше служит отдельной диагностикой пригодности латентного пространства для генерации из приора.
  kind: open
  reference: MSE оценивает восстановление, а KL по координатам помогает увидеть неиспользуемые измерения, но эти метрики не показывают напрямую, совпадает ли общее облако кодов данных с приором. Расстояние Фреше сравнивает средние и совместный разброс агрегированных латентов и приора. Большое расстояние предупреждает, что выборки из N(0, I) могут попадать в области, на которых декодировщик почти не обучался.
  id: 042-evaluation-plan-2
  fingerprint: 66f32b14
