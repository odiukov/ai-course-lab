- concept: VAE tiling ограничивает пик памяти площадью тайла ценой времени и возможных швов
  question: Объясните своими словами, как тайловое декодирование снижает пик памяти и какие компромиссы при этом возникают.
  explanation: Без tiling декодер одновременно строит крупные карты для всего кадра `1024×1024`. При tiling пик памяти определяется главным образом площадью одного фрагмента, однако последовательная обработка требует больше времени, а неидеальное согласование соседних фрагментов может проявиться как швы.
  kind: open
  reference: Изображение делят на перекрывающиеся фрагменты и декодируют их последовательно, поэтому одновременно хранятся активации только для отдельного тайла. Это уменьшает зависимость пика памяти от площади всего кадра, но увеличивает время обработки и может создавать различия на границах; перекрытие и смешивание краёв ослабляют швы.
  id: 043-vae-memory-3
  fingerprint: 74008d1d
