- concept: гауссово правдоподобие с фиксированной дисперсией приводит к квадратичной ошибке восстановления
  question: Декодировщик моделирует непрерывные наблюдения гауссовым распределением с фиксированной дисперсией. Какая ошибка восстановления соответствует этому предположению с точностью до масштаба и константы?
  explanation: Отрицательный логарифм гауссова правдоподобия с фиксированной дисперсией содержит сумму квадратов отклонений. Поэтому MSE выражает конкретное предположение о распределении ошибок декодировщика, а не является обязательной для любого VAE.
  kind: choice
  options:
    - Сумма квадратов отклонений реконструкции от наблюдений
    - Бинарная кросс-энтропия
    - Сумма модулей отклонений
    - KL-дивергенция между апостериорным и априорным распределениями латентного кода
  correct: 0
  id: 023-reconstruction-likelihood-2
  fingerprint: 543b96db
- concept: бернуллиевское правдоподобие декодировщика приводит к бинарной кросс-энтропии
  question: Почему для независимых бинарных наблюдений естественной ошибкой восстановления служит бинарная кросс-энтропия?
  explanation: Бинарная кросс-энтропия получается непосредственно из отрицательного логарифма бернуллиевского правдоподобия. Она особенно сильно штрафует уверенные предсказания, противоречащие наблюдаемому исходу.
  kind: open
  reference: Потому что при бернуллиевском правдоподобии декодировщик предсказывает вероятность каждого бинарного исхода, а отрицательный логарифм совместного правдоподобия независимых наблюдений равен сумме слагаемых бинарной кросс-энтропии.
  id: 023-reconstruction-likelihood-3
  fingerprint: c14d7641
