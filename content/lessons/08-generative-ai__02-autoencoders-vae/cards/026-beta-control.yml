- concept: критическое значение beta определяет, при каком весе KL оптимизатор меняет предпочтение между двумя решениями
  question: Для VAE используется функция потерь L = recon + β·KL. У решения A значения recon = 14 и KL = 9, а у решения B — recon = 18 и KL = 4. При каком β их полные потери равны?
  explanation: 'Нужно приравнять потери: 14 + 9β = 18 + 4β. Отсюда 5β = 4 и β = 0.8. При меньшем β выгоднее A с более точной реконструкцией, а при большем — B с меньшим KL.'
  kind: numeric
  answer: 0.8
  tolerance: 0.01
  id: 026-beta-control-1
  fingerprint: 8170929e
- concept: решение с одновременно меньшими recon и KL предпочтительнее при любом неотрицательном beta
  question: У решения A значения recon = 13 и KL = 6, а у решения B — recon = 17 и KL = 8. Какое решение имеет меньшую потерю L = recon + β·KL при неотрицательном β?
  explanation: 'У A меньше оба компонента: 13 < 17 и 6 < 8. Поэтому увеличение или уменьшение неотрицательного веса KL не может сделать B выгоднее.'
  kind: choice
  options:
