- concept: ошибка восстановления ограничивает декодер только на кодах, которые создаёт энкодер
  question: Автокодировщик хорошо восстанавливает изображения из отложенной выборки. Какой вывод из этого действительно следует?
  explanation: Низкая ошибка восстановления проверяет маршрут «изображение — код — изображение». Декодер обучается на кодах энкодера, поэтому качество его работы в произвольных точках латентного пространства не гарантируется.
  kind: choice
  options:
    - Латентные коды обязательно имеют заранее известное распределение
    - Любая точка латентного пространства декодируется в правдоподобное изображение
    - Декодер хорошо работает с кодами, которые для реальных изображений выдаёт энкодер
  correct: 2
  id: 001-compression-vs-generation-1
  fingerprint: d4e06f9d
- concept: генеративную пригодность автокодировщика проверяет декодирование выборок из заданного латентного распределения
  question: Какой эксперимент непосредственно проверяет, можно ли использовать автокодировщик для безусловной генерации?
  explanation: 'При генерации исходного изображения нет: код берут из выбранного распределения и передают прямо декодеру. Если обучающие коды не согласованы с этим распределением, случайные выборки могут попадать в незнакомые декодеру области и давать шум.'
  kind: choice
  options:
    - Подать отложенные изображения в энкодер и измерить ошибку их восстановления
    - Сэмплировать коды из выбранного приора без исходных изображений и декодировать их
    - Сравнить число параметров энкодера и декодера
  correct: 1
  id: 001-compression-vs-generation-2
  fingerprint: 2dfb6201
