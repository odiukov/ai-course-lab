  fingerprint: 4a4ff4a9
- concept: нулевые среднее и логарифм дисперсии задают стандартное нормальное распределение, а не единственную точку
  question: Какое распределение задают нулевое среднее и нулевой логарифм дисперсии для латентной координаты?
  explanation: Экспонента нулевого логарифма дисперсии даёт единичную дисперсию. Поэтому сохраняется ненулевой разброс вокруг нулевого среднего.
  kind: choice
  options:
    - Стандартное нормальное распределение
    - Распределение, сжатое в единственную точку
    - Распределение с неопределёнными центром и разбросом
