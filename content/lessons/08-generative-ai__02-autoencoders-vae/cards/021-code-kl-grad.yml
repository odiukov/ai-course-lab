- concept: градиент скалярной KL-дивергенции имеет отдельную компоненту для каждого параметра распределения
  question: KL-дивергенция является скаляром. Почему функция её аналитического градиента возвращает два вектора, а не одно число?
  explanation: Значение KL суммирует вклады латентных координат, но градиент должен показать, как изменение каждого параметра повлияет на эту сумму. Поэтому формы градиентов совпадают с формами соответствующих векторов параметров.
  kind: open
  reference: Скалярная функция зависит от всех элементов mu и log_sigma2, поэтому для каждого элемента нужна своя частная производная. Один вектор содержит производные по компонентам mu, второй — по компонентам log_sigma2.
  id: 021-code-kl-grad-1
  fingerprint: b36ec389
- concept: коэффициент beta масштабирует вклад градиента KL в градиент полной функции потерь
  question: Функция kl_grad возвращает градиенты самой KL-дивергенции, а полная функция потерь содержит слагаемое beta * KL. Как получить вклад KL в градиент полной функции потерь?
  explanation: По линейности дифференцирования градиент beta * KL равен beta, умноженному на градиент KL. Масштабируются производные и по mu, и по log_sigma2.
  kind: choice
  options:
    - Умножить оба возвращённых вектора градиента на beta
    - Прибавить beta только к градиенту по mu
    - Умножить на beta только значение KL, не меняя её вклад в градиент
    - Разделить оба вектора градиента на beta
  correct: 0
