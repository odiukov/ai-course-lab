- concept: декодировщик последовательно строит скрытое представление и реконструкцию
  question: Расположите операции декодировщика VAE в правильном порядке.
  explanation: Декодировщик вычисляет композицию x_hat = W_out tanh(W_hidden z + b_hidden) + b_out. Поэтому выходной слой получает скрытое представление, а не латентный вектор напрямую.
  kind: order
  items:
    - Вычислить аффинное преобразование латентного вектора с параметрами скрытого слоя
    - Применить tanh и получить скрытое представление
    - Выполнить выходное аффинное преобразование скрытого представления
  id: 015-code-decode-1
  fingerprint: 7102f3d7
- concept: линейный выход декодировщика не ограничивает диапазон реконструкции
  question: Какое следствие имеет отсутствие tanh или другой активации после выходного аффинного слоя декодировщика?
  explanation: Последняя операция имеет вид W_out h + b_out. Без выходной активации её значения не зажимаются в ограниченный диапазон; tanh применяется только при вычислении скрытого представления.
  kind: choice
  options:
    - Каждая координата реконструкции может принимать любое действительное значение
    - Каждая координата реконструкции обязательно лежит между минус единицей и единицей
    - Реконструкция становится случайной даже при фиксированном латентном векторе
    - Выход декодировщика совпадает с его скрытым представлением
  correct: 0
