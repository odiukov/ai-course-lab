- concept: слишком сильный штраф KL может сделать отказ от информации в латенте выгодным для общей функции потерь
  question: Объясни своими словами, почему чрезмерно влиятельное слагаемое KL может заставить VAE игнорировать латентный код, даже если восстановление от этого ухудшается.
  explanation: Информация о конкретном входе обычно увеличивает отличие q(z|x) от приора. Если это отличие штрафуется слишком сильно, оптимизатору выгодно удалить информацию из z и принять некоторый рост ошибки восстановления — так возникает posterior collapse.
  kind: open
  reference: Модель может сильнее уменьшить общую функцию потерь, приблизив q(z|x) к приору, чем выиграть от точного восстановления. Тогда распределение кода почти перестаёт зависеть от входа, а декодировщик учится опираться на общие закономерности данных и слабо реагировать на z.
  id: 033-posterior-collapse-2
  fingerprint: 8b2a4929
