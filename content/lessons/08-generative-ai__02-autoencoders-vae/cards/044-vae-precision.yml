- concept: смешанная точность оставляет численно чувствительные операции в более устойчивом формате
  question: Основная часть VAE-декодера устойчива в формате bfloat, но финальное изменение размера чувствительно к численным ошибкам. Какой режим вычислений наиболее разумен?
  explanation: Смешанная точность позволяет экономить память на основной части декодера, сохраняя более надёжную арифметику там, где она особенно важна. Поэтому чувствительную финальную операцию разумно оставить в одинарной точности.
  kind: choice
  options:
    - Выполнять декодер в bfloat, а финальное изменение размера — в одинарной точности
    - Принудительно выполнять весь декодер в обычной половинной точности
    - Перед изменением размера преобразовать изображение в целые числа
    - Выполнять только финальное изменение размера в обычной половинной точности
