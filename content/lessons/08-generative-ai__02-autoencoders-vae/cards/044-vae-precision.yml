- concept: специально адаптированные половинные веса безопаснее механического приведения исходной модели
  question: Объясни своими словами, почему специально подготовленная для половинной точности версия VAE может работать устойчиво, хотя слепое приведение исходных весов к тому же формату приводит к NaN.
  explanation: Одинаковый формат хранения не означает одинаковую численную устойчивость. Исправленные веса рассчитаны на ограничения половинной точности, тогда как механическая конвертация исходной модели не контролирует диапазоны промежуточных вычислений.
  kind: open
  reference: 'Подготовленная версия учитывает узкий динамический диапазон формата: её веса адаптированы и проверены так, чтобы промежуточные активации оставались представимыми. Слепое приведение лишь меняет формат чисел и не гарантирует отсутствия переполнений внутри декодера.'
  id: 044-vae-precision-2
