- concept: повторный проход одного входа через AE детерминирован, а через VAE может давать разные латентные коды
  question: Один и тот же вход несколько раз пропускают через уже обученные AE и VAE. Между проходами параметры моделей не меняются. Какой результат ожидается?
  explanation: Энкодер AE непосредственно вычисляет фиксированный код из входа. Энкодер VAE задаёт параметры распределения, после чего из него сэмплируется код, поэтому при новом шуме результат может измениться.
  kind: choice
  options:
    - Обе модели каждый раз обязаны получать новый латентный код
    - AE получает тот же код, а VAE может получать разные коды из-за сэмплирования
    - VAE получает тот же код, а AE меняет его случайным образом
    - Обе модели обязаны получать одинаковые коды, поскольку вход не меняется
  correct: 1
  id: 007-ae-vae-paths-1
  fingerprint: e090f9f2
- concept: сэмплирование латентных кодов при обучении VAE учит декодер восстанавливать вход из окрестности кода
  question: Почему декодер VAE обычно обучается работать не только с одним точным латентным кодом каждого входа, но и с близкими кодами?
  explanation: VAE передаёт декодеру сэмпл из q(z|x). Разные сэмплы одного условного распределения оказываются рядом, и каждый из них участвует в обучении восстановления.
  kind: open
  reference: Энкодер задаёт распределение кодов, и при разных проходах из него выбираются разные близкие значения z. Ошибка восстановления применяется к этим выборкам, поэтому декодер учится давать осмысленные восстановления для целой окрестности, а не только для одной точки.
  id: 007-ae-vae-paths-2
  fingerprint: bdecd793
