- concept: независимые выходные головы применяют разные параметры к общему скрытому представлению
  question: У VAE-кодировщика есть общее скрытое представление h и две независимые аффинные головы. Заполни вычисление логарифма дисперсии.
  explanation: Обе головы читают одно и то же h, но используют собственные параметры. Голова логарифма дисперсии не должна получать вход из mu или повторно обрабатывать исходный объект.
  kind: cloze
  template: |-
    mu = add(matmul(enc["W_mu"], h), enc["b_mu"])
    log_sigma2 = ___
  answer: add(matmul(enc["W_sig"], h), enc["b_sig"])
  accept:
    - enc["W_sig"] @ h + enc["b_sig"]
    - matmul(enc["W_sig"], h) + enc["b_sig"]
  id: 009-code-encode-1
  fingerprint: fe437cdf
- concept: голова логарифма дисперсии должна допускать любое действительное выходное значение
  question: Почему после головы VAE, предсказывающей логарифм дисперсии, обычно не ставят tanh?
  explanation: tanh искусственно ограничил бы диапазон логарифма дисперсии. Линейная голова оставляет его неограниченным, а экспоненциальное преобразование гарантирует положительное стандартное отклонение.
  kind: choice
  options:
    - Чтобы обе выходные головы всегда возвращали одинаковые значения
    - Чтобы логарифм дисперсии мог принимать любое действительное значение, а положительное стандартное отклонение затем получалось через экспоненту
    - Потому что tanh нельзя применять после матричного умножения
    - Потому что KL-дивергенция не зависит от дисперсии
  correct: 1
  id: 009-code-encode-2
  fingerprint: fe958454
