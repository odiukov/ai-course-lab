- concept: нелинейная активация не позволяет последовательности полносвязных слоёв свернуться в одно линейное преобразование
  question: Объясни своими словами, зачем между полносвязными слоями кодировщика или декодировщика нужна нелинейная активация вроде tanh.
  explanation: Два последовательных преобразования вида Wx + b без активации алгебраически объединяются в ещё одно преобразование того же вида. tanh нарушает это свёртывание и увеличивает выразительность сети.
  kind: open
  reference: 'Без нелинейной активации композиция полносвязных слоёв остаётся одним аффинным преобразованием: произведения матриц можно объединить в одну матрицу, а смещения — в один вектор. Нелинейность позволяет сети выражать зависимости, которые нельзя представить единственным линейным пересчётом.'
  id: 004-dense-layer-2
  fingerprint: 1fd130a1
- concept: декодировщик обучается как отдельное отображение и не обязан быть матричной инверсией кодировщика
  question: Почему матрица весов декодировщика обычно не равна просто обратной матрице весов кодировщика?
  explanation: При сжатии часть информации может теряться, а нелинейные активации дополнительно меняют отображение. Поэтому декодировщик учится восстанавливать данные по коду, а не вычисляет формальную матричную инверсию кодировщика.
  kind: choice
  options:
    - Кодировщик и декодировщик независимо подбирают параметры по функции потерь, а сжатие и нелинейности обычно не задают точного обратимого отображения
    - Обратные матрицы существуют только у слоёв с нелинейной активацией
    - Смещение автоматически превращает матрицу кодировщика в единичную
  correct: 0
