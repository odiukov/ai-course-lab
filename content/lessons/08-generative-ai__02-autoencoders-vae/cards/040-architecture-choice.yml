- concept: разделение функций между автокодировщиком и генеративной моделью в латентной диффузии
  question: Объясни своими словами, какие разные задачи решают VAE и диффузионная модель в латентно-диффузионной системе.
  explanation: VAE отвечает за переход между исходными данными и компактным латентным пространством. Диффузионная модель осваивает распределение латентов и выполняет основную генеративную работу внутри этого пространства.
  kind: open
  reference: VAE сжимает данные в компактный латент и восстанавливает их из него, а диффузионная модель обучается генерировать или преобразовывать латенты. Поэтому дорогой генеративный процесс выполняется не в исходном пространстве данных, а в более компактном представлении.
  id: 040-architecture-choice-2
  fingerprint: da83aab3
