- concept: PCS сохраняет каждый найденный экземпляр концепта как отдельную маску
  question: На изображении несколько соприкасающихся объектов соответствуют текстовому концепту. Какой результат должна вернуть Promptable Concept Segmentation?
  explanation: 'PCS выполняет сегментацию экземпляров: один концепт может найти сразу несколько объектов, но каждый из них получает собственную маску. Соприкосновение или перекрытие объектов не превращает их в один экземпляр.'
  kind: choice
  options:
    - Одну объединённую маску, охватывающую все совпадения
    - Отдельную маску для каждого совпавшего экземпляра
    - Только маску экземпляра с наибольшей площадью
    - Одну рамку без пиксельных масок
  correct: 1
  id: 005-kontrakt-pcs-1
  fingerprint: b26d8e3e
- concept: уникальный ID связывает отдельный экземпляр с его маской внутри результата PCS
  question: Что означает уникальный instance ID, возвращаемый PCS вместе с маской?
  explanation: Instance ID нужен, чтобы различать совпавшие объекты и однозначно связывать каждый экземпляр с его маской. Он не кодирует свойства объекта и не является глобальным идентификатором.
  kind: choice
  options:
    - Позицию объекта в глобальном каталоге всех известных модели объектов
    - Семантический класс и свойства объекта, закодированные одним числом
    - Идентификатор конкретного найденного экземпляра внутри результата
    - Оценку уверенности модели в существовании концепта
  correct: 2
  id: 005-kontrakt-pcs-2
  fingerprint: ed806d0e
