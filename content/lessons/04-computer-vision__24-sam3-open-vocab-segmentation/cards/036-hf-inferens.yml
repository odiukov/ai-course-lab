- concept: параметр return_tensors определяет тип тензоров в результате препроцессинга
  question: Что означает параметр `return_tensors="pt"` при подготовке изображения процессором модели?
  explanation: Значение `pt` выбирает тензоры PyTorch как формат результата. Оно не добавляет текстовый промпт, не выбирает устройство вычислений и не выполняет постобработку масок.
  kind: choice
  options:
    - Процессор добавит к изображению текстовый промпт
    - Процессор вернёт подготовленные данные в виде тензоров PyTorch
    - Процессор автоматически перенесёт модель и данные на GPU
    - Процессор сразу преобразует предсказанную маску к исходному размеру изображения
  correct: 1
  id: 036-hf-inferens-1
  fingerprint: 9780be18
- concept: вход для текстово-обусловленной сегментации формируется последовательным препроцессингом изображения и добавлением промпта
  question: Расположи действия в порядке подготовки и передачи изображения с текстовым промптом в модель.
  explanation: Сначала процессор создаёт тензоры изображения и метаданные размеров. Затем `set_text_prompt` возвращает дополненный набор входов, поэтому результат вызова сохраняют. Только после этого согласованные данные раскрывают в аргументы модели.
  kind: order
  items:
    - Подготовить изображение вызовом `inputs = processor(images=image, return_tensors="pt")`
    - 'Добавить промпт и сохранить обновлённый набор: `inputs = processor.set_text_prompt(inputs, prompt)`'
    - Передать все подготовленные поля модели вызовом `model(**inputs)`
  id: 036-hf-inferens-2
  fingerprint: a025f298
