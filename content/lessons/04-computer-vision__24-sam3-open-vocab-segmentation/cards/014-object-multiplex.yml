- concept: память Object Multiplex состоит из одного общего хранилища и отдельных запросов экземпляров
  question: Общие признаки видеопоследовательности занимают 800 МБ, а запрос одного отслеживаемого экземпляра — 2 МБ. Сколько памяти потребуется Object Multiplex для 25 экземпляров?
  explanation: 'Общее хранилище записывается один раз, а для каждого экземпляра добавляется только запрос: 800 + 25 × 2 = 850 МБ. Крупный блок признаков не копируется для каждого объекта.'
  kind: numeric
  answer: 850
  tolerance: 0.1
  id: 014-object-multiplex-1
  fingerprint: 9f713b04
- concept: персональные запросы сохраняют раздельность экземпляров при использовании общей памяти
  question: Объясни своими словами, почему несколько похожих объектов не теряют индивидуальность, хотя Object Multiplex хранит их информацию в общей памяти.
  explanation: Общая память устраняет дублирование признаков, но не объединяет идентичности. Различение экземпляров обеспечивают адресованные им персональные запросы.
  kind: open
  reference: У каждого экземпляра есть собственный запрос к общей памяти. Он выбирает сведения, относящиеся к конкретному объекту, поэтому объекты можно продолжать отслеживать раздельно без отдельных копий всего memory bank.
  id: 014-object-multiplex-2
  fingerprint: fc6e4da5
