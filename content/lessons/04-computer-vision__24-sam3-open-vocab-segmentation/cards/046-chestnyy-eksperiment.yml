- concept: парные простой и составной промпты помогают различить ошибку распознавания объекта и ошибку понимания композиции
  question: На одном изображении модель успешно сегментирует концепт «велосипед», но пропускает концепт «человек, ведущий велосипед». Что позволяет предположить такая пара результатов? Объясни своими словами.
  explanation: Простой запрос служит диагностическим контролем. Его успех вместе с провалом составного запроса локализует слабое место в обработке отношения между объектами, а не в базовом обнаружении самого объекта.
  kind: open
  reference: Базовый объект модели доступен для распознавания, поэтому вероятная проблема связана не с самим велосипедом или качеством изображения, а с привязкой отношения «человек ведёт объект» к нужным экземплярам.
