- concept: Mask IoU равен отношению площади пересечения масок к площади их объединения
  question: У двух бинарных масок пересечение содержит 14 пикселей, а объединение — 35 пикселей. Чему равен Mask IoU?
  explanation: 'Mask IoU вычисляется как размер пересечения, делённый на размер объединения: 14 / 35 = 0.4. Площадей каждой маски по отдельности для этого недостаточно.'
  kind: numeric
  answer: 0.4
  tolerance: 0.001
  id: 029-mask-iou-1
  fingerprint: 3f6092f4
- concept: для двух пустых масок требуется явно определить результат IoU при пустом объединении
  question: Как должна поступить функция Mask IoU, если обе входные маски пусты и по принятому контракту считаются полностью совпавшими?
  explanation: У двух пустых масок пересечение и объединение пусты, поэтому обычная формула приводит к делению на ноль. Контракт должен отдельно обработать этот случай и вернуть 1.0.
  kind: choice
  options:
    - Вернуть значение полного совпадения без выполнения деления
    - Выполнить обычное деление размера пересечения на размер объединения
    - Считать маски полностью различными
    - Сравнить только их охватывающие рамки
  correct: 0
