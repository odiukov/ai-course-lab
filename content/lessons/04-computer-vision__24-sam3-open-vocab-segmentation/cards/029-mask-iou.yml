- concept: IoU масок сравнивает пиксельные силуэты, тогда как IoU рамок может скрывать различия внутри рамки
  question: Почему совпадение охватывающих рамок не гарантирует высокий Mask IoU?
  explanation: Рамка не хранит форму объекта и распределение занятых пикселей внутри неё. Mask IoU учитывает именно пересечение и объединение пиксельных областей.
  kind: open
  reference: Одинаковые рамки задают лишь внешние границы объектов. Внутри них маски могут включать разные пиксели и иметь почти не пересекающиеся силуэты, поэтому Mask IoU нужно считать непосредственно по пикселям масок.
  id: 029-mask-iou-3
  fingerprint: ebb7bb81
