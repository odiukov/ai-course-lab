- concept: поддержка отслеживания отличает два более новых поколения от исходного SAM
  question: Какие системы помимо построения масок предусматривают отслеживание объектов между кадрами?
  explanation: Grounded SAM второго поколения передаёт маски в механизм отслеживания, а SAM третьего поколения содержит memory tracker. Исходный SAM возвращает маску для заданного промпта без трекинга.
  kind: choice
  options:
    - Только исходный SAM
    - Grounded SAM второго поколения и SAM третьего поколения
    - Все три системы
  correct: 1
  id: 004-proverka-pokoleniy-1
  fingerprint: 9ed4e1ed
- concept: маска в исходном SAM получается после обработки изображения ViT-энкодером и декодером масок
  question: Расположи этапы работы исходного SAM в правильном порядке.
  explanation: Исходный SAM сначала кодирует изображение, а затем mask decoder объединяет его представление с точкой или рамкой и строит маску для этого промпта.
  kind: order
  items:
    - Получить изображение и промпт в виде точки или рамки
    - Закодировать изображение с помощью ViT-энкодера
    - Обработать представление изображения и промпт декодером масок
    - Вернуть маску, соответствующую промпту
  id: 004-proverka-pokoleniy-2
  fingerprint: 824c992e
