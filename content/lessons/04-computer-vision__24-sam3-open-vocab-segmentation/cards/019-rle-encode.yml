- concept: пустую маску нужно обработать до обращения к первому элементу
  question: Почему RLE-кодировщик должен отдельно проверять, что развёрнутая маска не пуста, прежде чем инициализировать текущую серию?
  explanation: Обычный алгоритм начинает серию со значения первого пикселя. При пустом входе это значение получить нельзя, поэтому проверка размера должна выполняться раньше и предотвращать IndexError.
  kind: open
  reference: У пустого массива нет первого элемента, поэтому попытка прочитать его завершится ошибкой. Для такой маски кодировщик может сразу вернуть пустую строку, обозначающую отсутствие серий.
  id: 019-rle-encode-2
  fingerprint: f37a5763
- concept: последнюю серию RLE сохраняют отдельно после завершения обхода
