- concept: минимальная осевая рамка непустой маски определяется экстремальными координатами пикселей объекта
  question: Заполните пропуск в формуле охватывающей рамки для множества пикселей объекта F.
  explanation: Левая, верхняя, правая и нижняя стороны минимальной осевой рамки задаются соответственно минимальными и максимальными координатами пикселей объекта.
  kind: cloze
  template: box_xyxy = (min₍ₓ,ᵧ₎∈F x, min₍ₓ,ᵧ₎∈F y, ___, max₍ₓ,ᵧ₎∈F y)
  answer: max₍ₓ,ᵧ₎∈F x
  accept:
    - max x
    - максимальная координата x
    - x_max
  id: 025-ramka-iz-maski-1
  fingerprint: 9a5dd460
- concept: контракт координат должен различать включённую и полуоткрытую правую нижнюю границу рамки
  question: Две библиотеки строят рамку по одной и той же бинарной маске. Первая записывает справа и снизу координаты крайних занятых пикселей, а вторая — границы сразу после них. Почему их значения box_xyxy могут различаться при одинаковом результате сегментации?
  explanation: При включённом соглашении координата указывает на последний занятый пиксель, а при полуоткрытом — на границу после него. Поэтому формат контракта необходимо зафиксировать явно.
  kind: choice
  options:
    - Библиотеки используют разные соглашения о включённой и полуоткрытой правой нижней границе
    - Охватывающая рамка зависит от порядка обхода пикселей маски
    - Формат xyxy не позволяет представить минимальную осевую рамку
    - Координаты рамки определяются площадью маски, а не её крайними пикселями
