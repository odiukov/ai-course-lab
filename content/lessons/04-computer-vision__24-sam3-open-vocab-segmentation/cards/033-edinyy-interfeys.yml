- concept: детерминированная заглушка позволяет тестировать конвейер без загрузки настоящей модели
  question: Объясни своими словами, зачем реализации интерфейса open-vocabulary segmentation может понадобиться детерминированная заглушка.
  explanation: Заглушка из материала всегда возвращает предсказуемые результаты, включая детекции с оценками 0,89 и 0,74. Это позволяет проверить логику пайплайна и порог отсечения даже тогда, когда реальные модели не загружены.
  kind: open
  reference: Она возвращает заранее предсказуемые детекции без запуска настоящей модели, поэтому позволяет отдельно проверять фильтрацию, объединение и другие части конвейера, а также получать воспроизводимые результаты тестов.
