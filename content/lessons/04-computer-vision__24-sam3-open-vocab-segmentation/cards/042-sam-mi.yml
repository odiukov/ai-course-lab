- concept: shallow mask aggregation объединяет грубые предсказания масок в более чёткий итог
  question: Объясни своими словами, какую роль выполняет shallow mask aggregation в SAM-MI.
  explanation: Разреженные точечные промпты могут давать грубые промежуточные маски. Неглубокая агрегация объединяет их, улучшая итоговую маску при небольших дополнительных вычислениях.
  kind: open
  reference: Она сливает несколько грубых предсказаний маски в один более согласованный и чёткий результат без тяжёлой повторной обработки.
