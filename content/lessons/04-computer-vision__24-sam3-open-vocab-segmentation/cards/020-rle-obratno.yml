- concept: декодер RLE отклоняет данные, если сумма длин серий не равна числу ячеек маски
  question: Заполни условие проверки длины декодированной маски перед восстановлением её формы.
  explanation: Число раскрытых значений должно точно совпадать с произведением размеров маски. Например, для формы 3 × 4 ожидаются 12 пикселей, поэтому последовательность из 11 значений нужно отклонить, а не дополнять или обрезать.
  kind: cloze
  template: |-
    if sum(count for value, count in runs) != ___:
        raise ValueError("RLE length does not match mask shape")
  answer: height * width
  accept:
    - width * height
    - H * W
    - math.prod(shape)
  id: 020-rle-obratno-1
  fingerprint: 991bc53d
- concept: форма маски должна храниться отдельно, потому что RLE не кодирует границы строк и столбцов
  question: Почему даже корректно раскрытая RLE-последовательность не позволяет однозначно восстановить двумерную маску без отдельно переданной формы?
  explanation: После flatten сведения о границах строк исчезают. Например, 12 значений можно уложить как 3 × 4 или как 4 × 3, поэтому правильная длина сама по себе не определяет форму.
  kind: open
  reference: RLE хранит значения пикселей и длины их серий только в линейном порядке. Она не сообщает высоту и ширину маски, поэтому одну последовательность подходящей длины можно преобразовать в разные прямоугольные формы. Декодеру нужны исходные размеры маски.
  id: 020-rle-obratno-2
  fingerprint: 64c9d30f
