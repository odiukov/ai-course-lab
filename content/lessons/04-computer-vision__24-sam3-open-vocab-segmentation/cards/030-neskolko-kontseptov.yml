- concept: при объединении независимых проходов локальные instance_id заменяют глобально уникальными идентификаторами
  question: Несколько независимых вызовов open-vocabulary сегментатора вернули детекции с повторяющимися локальными instance_id. Объясни своими словами, как собрать однозначный общий результат.
  explanation: Идентификатор, уникальный только внутри отдельного прохода, становится неоднозначным после объединения ответов. Глобальная перенумерация устраняет коллизии, а сохранённое поле concept показывает, по какому запросу найден объект.
  kind: open
  reference: Нужно объединить детекции в плоский список, сохранить у каждой детекции исходное поле concept и переназначить instance_id так, чтобы он был уникален во всём объединённом списке.
