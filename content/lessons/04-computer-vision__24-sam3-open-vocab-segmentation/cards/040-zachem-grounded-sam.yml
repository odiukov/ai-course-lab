- concept: ablation-эксперимент изолирует вклад детектора заменой только этого компонента
  question: Объясни своими словами, как сравнить два детектора открытого словаря так, чтобы различия в результате можно было связать именно с детектором.
  explanation: Если одновременно заменить детектор и сегментатор, источник изменения результата определить нельзя. В корректной ablation-проверке один компонент меняют, а остальные условия сохраняют.
  kind: open
  reference: Нужно зафиксировать датасет, препроцессинг, сегментатор, метрики и остальные условия, меняя только детектор. Такое контролируемое сравнение изолирует вклад заменяемого компонента.
  id: 040-zachem-grounded-sam-1
  fingerprint: d889061f
- concept: снижение порога детектора меняет компромисс между пропусками и ложными срабатываниями
  question: В детекторе открытого словаря снизили порог уверенности, не меняя остальные компоненты. Какой эффект наиболее вероятен?
  explanation: Более низкий порог пропускает больше гипотез детектора. Это может вернуть ранее пропущенные объекты, но одновременно добавить ложные срабатывания; последующий сегментатор не устраняет саму ошибку выбора объекта.
  kind: choice
  options:
    - Детектор вернёт меньше кандидатов, но полнота обязательно вырастет
    - 'Детектор вернёт больше кандидатов: полнота может вырасти вместе с числом ложных срабатываний'
    - Качество масок улучшится независимо от результатов детектора
  correct: 1
