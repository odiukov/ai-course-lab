  question: Детектор по запросу «пожарный гидрант» ошибочно передал сегментатору рамку дорожного конуса. Сегментатор идеально выделил границы конуса. Как следует оценить итог?
  explanation: Сегментатор отвечает за границы переданного кандидата, а не обязательно перепроверяет его семантический класс. Поэтому ошибка детектора может превратиться в качественную маску неправильного объекта.
  kind: choice
  options:
