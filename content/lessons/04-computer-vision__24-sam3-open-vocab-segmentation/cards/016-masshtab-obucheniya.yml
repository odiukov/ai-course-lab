- concept: итеративный data engine масштабирует разметку совместной работой модели и людей-проверяющих
  question: Расположи этапы итеративного data engine в логическом порядке.
  explanation: AI ускоряет создание предварительной разметки, а люди контролируют её качество. Возврат исправлений в следующий цикл позволяет постепенно расширить набор до миллионов уникальных концептов.
