- concept: преимущество интегрированной сегментации заметнее на редких составных концептах
  question: Объясни своими словами, для каких текстовых запросов преимущество SAM третьего поколения по точности обычно наиболее заметно и почему тест только на простых частых объектах может его скрыть.
  explanation: Честный бенчмарк должен включать не только частые категории вроде автомобиля, но и составные концепты вроде полосатого красного зонта. Именно на таких запросах особенно заметно, насколько хорошо модель удерживает совместный смысл всех признаков.
  kind: open
  reference: Преимущество сильнее проявляется на редких составных запросах, объединяющих объект и несколько признаков. Интегрированная модель сопоставляет весь концепт с изображением целиком, тогда как на частых однословных категориях её результат может быть близок к результату раздельного каскада.
  id: 039-chestnyy-benchmark-2
