- concept: разделитель-слово нужно сопоставлять с границами, чтобы не разрезать его в составе другого слова
  question: Функция делит англоязычный запрос на концепты по союзу and. Какой вариант простой строковой замены сохранит слово headband целым?
  explanation: Пробелы обозначают границы отдельно стоящего союза. Замена голого "and" сработает и внутри слов band, brand или headband и повредит название концепта.
  kind: choice
  options:
    - Заменять " and " с пробелами по краям
    - Заменять любое вхождение "and"
    - Сначала удалять из строки все пробелы
    - Заменять каждую букву из слова "and" отдельно
  correct: 0
  id: 007-split-concepts-1
  fingerprint: 5d7ab887
- concept: разбиение мультиконцептного запроса выполняется через нормализацию разделителей, очистку частей и удаление пустых результатов
  question: Расположи операции в правильном порядке для преобразования пользовательской строки с разными разделителями в список непустых концептов.
  explanation: Сначала разные способы перечисления приводятся к общей форме. После одного разбиения strip очищает края каждой части, а фильтрация не позволяет передать модели пустой концепт.
  kind: order
  items:
    - Заменить поддерживаемые разделители единым разделителем — запятой
    - Разделить нормализованную строку по запятым
    - Удалить пробелы по краям каждой полученной части
    - Отбросить пустые части и вернуть оставшиеся концепты
  id: 007-split-concepts-2
  fingerprint: 6c7e16a5
