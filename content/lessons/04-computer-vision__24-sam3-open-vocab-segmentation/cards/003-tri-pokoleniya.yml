- concept: рамки служат интерфейсом между Grounding DINO и сегментатором в раздельном конвейере
  question: В конвейере Grounding DINO → SAM что детектор передаёт сегментатору?
  explanation: Grounding DINO сопоставляет текст с изображением и выдаёт рамки. Затем SAM использует эти рамки как пространственные подсказки и строит маски.
  kind: choice
  options:
    - Готовые пиксельные маски
    - Ограничивающие рамки найденных объектов
    - Идентификаторы объектов между кадрами
    - Вероятность присутствия искомого концепта
  correct: 1
  id: 003-tri-pokoleniya-1
  fingerprint: ffb5a176
- concept: интегрированная promptable-сегментация сопоставляет подсказку с изображением в общем backbone без отдельного детектора рамок
  question: Объясни архитектурное различие между каскадом Grounding DINO → SAM и системой, где текстовая подсказка вместе с изображением поступает в shared backbone.
  explanation: Ключевое различие — место семантического сопоставления. В раздельной архитектуре им занимается внешний детектор, а в интегрированной оно встроено в общую модель сегментации.
  kind: open
  reference: В каскаде отдельный детектор сначала преобразует текстовый запрос и изображение в рамки, после чего сегментатор строит по ним маски. В интегрированной системе подсказка и изображение сопоставляются внутри общего backbone, поэтому отдельный детектор и промежуточная передача рамок не требуются.
  id: 003-tri-pokoleniya-2
  fingerprint: b5d32d33
