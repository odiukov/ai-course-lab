<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Margin задаёт допустимое расположение тройки эмбеддингов</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: white;
      --panel: whitesmoke;
      --ink: midnightblue;
      --muted: slategray;
      --axis: lightslategray;
      --frame: gainsboro;
      --invalid: mistyrose;
      --invalid-ink: crimson;
      --positive: seagreen;
      --positive-soft: honeydew;
      --boundary: darkorange;
      --valid: darkgreen;
      --card: white;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: black;
        --panel: midnightblue;
        --ink: white;
        --muted: lightgray;
        --axis: lightslategray;
        --frame: slategray;
        --invalid: darkred;
        --invalid-ink: lightsalmon;
        --positive: lightgreen;
        --positive-soft: darkgreen;
        --boundary: orange;
        --valid: lightgreen;
        --card: darkslategray;
      }
    }

    html,
    body {
      margin: unset;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: 100%;
      max-width: 960px;
      margin-inline: auto;
      background: var(--page);
    }

    h2 {
      margin-inline: unset;
      font-size: 22px;
      line-height: normal;
      color: var(--ink);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 450px;
      background: var(--panel);
      border: solid var(--frame);
      box-sizing: border-box;
    }

    svg[hidden],
    #fallback[hidden] {
      display: none;
    }

    #fallback {
      font-size: 18px;
      color: var(--ink);
      background: var(--panel);
      border: solid var(--frame);
    }

    .axis {
      stroke: var(--axis);
      fill: none;
    }

    .distance {
      stroke: var(--muted);
      fill: none;
    }

    .invalid-area {
      fill: var(--invalid);
      stroke: none;
    }

    .positive-radius {
      fill: none;
      stroke: var(--positive);
    }

    .margin-boundary {
      fill: none;
      stroke: var(--boundary);
    }

    .margin-bracket {
      fill: none;
      stroke: var(--boundary);
    }

    .anchor-dot {
      fill: var(--ink);
      stroke: var(--card);
    }

    .positive-dot {
      fill: var(--positive);
      stroke: var(--card);
    }

    .negative-dot {
      fill: var(--invalid-ink);
      stroke: var(--card);
    }

    .valid-dot {
      fill: var(--card);
      stroke: var(--valid);
    }

    .label {
      fill: var(--ink);
      font-weight: normal;
    }

    .muted-label {
      fill: var(--muted);
    }

    .positive-label {
      fill: var(--positive);
      font-weight: bold;
    }

    .negative-label {
      fill: var(--invalid-ink);
      font-weight: bold;
    }

    .boundary-label {
      fill: var(--boundary);
      font-weight: bold;
    }

    .valid-label {
      fill: var(--valid);
      font-weight: bold;
    }

    .equation-card {
      fill: var(--card);
      stroke: var(--frame);
    }

    .equation {
      fill: var(--ink);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <h2>Margin задаёт допустимое расположение тройки эмбеддингов</h2>

    <p id="fallback">
      Anchor находится в центре, positive — на расстоянии 0,4, а negative —
      на расстоянии 0,5. При margin 0,2 этого недостаточно: допустимая область
      для negative начинается за границей 0,6.
    </p>

    <svg
      id="diagram"
      hidden
      viewBox="0 0 960 450"
      width="960"
      height="450"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description"
    >
      <title id="svg-title">Допустимое расположение triplet при margin 0,2</title>
      <desc id="svg-description">
        Anchor расположен в центре. Positive находится на расстоянии 0,4.
        Negative на расстоянии 0,5 попадает в запрещённую область. Граница
        допустимого расстояния равна 0,6, а negative на расстоянии 0,8 уже
        находится в допустимой области.
      </desc>
      <g id="drawing"></g>
    </svg>
  </main>

  <script>
    const diagramData = Object.freeze([{
      canvas: { width: 960, height: 450 },
      origin: { x: 330, y: 225 },
      scale: 310,

      points: {
        canvasTopLeft: { x: -1.0645, y: 0.7258 },
        canvasBottomRight: { x: 2.0323, y: -0.7258 },

        anchor: { x: 0, y: 0 },
        positive: { x: 0, y: 0.4 },
        negative: { x: 0.5, y: 0 },
        validNegative: { x: 0.8, y: 0 },

        positiveRadiusEdge: { x: 0.4, y: 0 },
        marginBoundaryEdge: { x: 0.6, y: 0 },
        pointRadiusEdge: { x: 0.025, y: 0 },

        axisXStart: { x: -0.8, y: 0 },
        axisXEnd: { x: 0.88, y: 0 },
        axisYStart: { x: 0, y: -0.62 },
        axisYEnd: { x: 0, y: 0.65 },

        positiveDistanceLabel: { x: 0, y: 0.2 },
        negativeDistanceLabel: { x: 0.25, y: 0 },

        boundaryLabelAnchor: { x: -0.48, y: 0.36 },
        invalidLabelAnchor: { x: -0.42, y: -0.28 },
        validAreaLabelAnchor: { x: -0.76, y: -0.55 },

        marginStart: { x: 0.4, y: -0.4 },
        marginEnd: { x: 0.6, y: -0.4 },
        marginStartTickTop: { x: 0.4, y: -0.36 },
        marginStartTickBottom: { x: 0.4, y: -0.44 },
        marginEndTickTop: { x: 0.6, y: -0.36 },
        marginEndTickBottom: { x: 0.6, y: -0.44 },
        marginLabelAnchor: { x: 0.5, y: -0.4 },

        equationCardTopLeft: { x: 0.94, y: 0.62 },
        equationCardBottomRight: { x: 1.97, y: 0.16 },
        equationHeading: { x: 1, y: 0.52 },
        equationFirstLine: { x: 1, y: 0.4 },
        equationSecondLine: { x: 1, y: 0.28 },

        planeLabel: { x: -0.78, y: 0.63 }
      },

      offsets: {
        above: { dx: 0, dy: -14 },
        below: { dx: 0, dy: 24 },
        rightAbove: { dx: 14, dy: -12 },
        rightBelow: { dx: 14, dy: 25 },
        leftMiddle: { dx: -14, dy: 5 },
        distanceLeft: { dx: -16, dy: 4 },
        distanceAbove: { dx: 0, dy: -13 },
        boundaryLeft: { dx: -12, dy: -8 },
        invalidBelow: { dx: 0, dy: 18 },
        areaRight: { dx: 10, dy: 0 },
        marginBelow: { dx: 0, dy: 23 },
        noOffset: { dx: 0, dy: 0 }
      },

      lineWidths: {
        axis: 1.5,
        distance: 2,
        radius: 2,
        boundary: 3,
        bracket: 3,
        pointStroke: 3,
        card: 1.5
      },

      fontSizes: {
        ordinary: 16,
        small: 14,
        point: 16,
        equationHeading: 15,
        equation: 17
      },

      dashPatterns: {
        distance: "7 6",
        radius: "5 6"
      }
    }]);

    const [data] = diagramData;
    const origin = Object.freeze({ x: data.origin.x, y: data.origin.y });
    const scale = data.scale;

    const toPx = point => ({
      x: origin.x + point.x * scale,
      y: origin.y - point.y * scale
    });

    try {
      const namespace = "http://www.w3.org/2000/svg";
      const drawing = document.getElementById("drawing");
      const diagram = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");

      const make = (tag, className) => {
        const element = document.createElementNS(namespace, tag);
        if (className) element.setAttribute("class", className);
        return element;
      };

      const append = element => {
        drawing.appendChild(element);
        return element;
      };

      const line = (from, to, className, width, dash) => {
        const start = toPx(from);
        const end = toPx(to);
        const element = make("line", className);
        element.setAttribute("x1", start.x);
        element.setAttribute("y1", start.y);
        element.setAttribute("x2", end.x);
        element.setAttribute("y2", end.y);
        element.setAttribute("stroke-width", width);
        if (dash) element.setAttribute("stroke-dasharray", dash);
        return append(element);
      };

      const circle = (center, edge, className, width) => {
        const mappedCenter = toPx(center);
        const mappedEdge = toPx(edge);
        const element = make("circle", className);
        element.setAttribute("cx", mappedCenter.x);
        element.setAttribute("cy", mappedCenter.y);
        element.setAttribute("r", Math.abs(mappedEdge.x - mappedCenter.x));
        if (width) element.setAttribute("stroke-width", width);
        return append(element);
      };

      const rect = (topLeft, bottomRight, className, width) => {
        const first = toPx(topLeft);
        const second = toPx(bottomRight);
        const element = make("rect", className);
        element.setAttribute("x", Math.min(first.x, second.x));
        element.setAttribute("y", Math.min(first.y, second.y));
        element.setAttribute("width", Math.abs(second.x - first.x));
        element.setAttribute("height", Math.abs(second.y - first.y));
        element.setAttribute("stroke-width", width);
        return append(element);
      };

      const text = (
        value,
        anchorPoint,
        offset,
        textAnchor,
        className,
        fontSize
      ) => {
        const anchor = toPx(anchorPoint);
        const element = make("text", className);
        element.setAttribute("x", anchor.x);
        element.setAttribute("y", anchor.y);
        element.setAttribute("dx", offset.dx);
        element.setAttribute("dy", offset.dy);
        element.setAttribute("text-anchor", textAnchor);
        element.setAttribute("font-size", fontSize);
        element.textContent = value;
        return append(element);
      };

      const p = data.points;
      const o = data.offsets;
      const w = data.lineWidths;
      const f = data.fontSizes;
      const d = data.dashPatterns;

      circle(
        p.anchor,
        p.marginBoundaryEdge,
        "invalid-area",
        w.boundary
      );

      line(p.axisXStart, p.axisXEnd, "axis", w.axis);
      line(p.axisYStart, p.axisYEnd, "axis", w.axis);

      circle(
        p.anchor,
        p.positiveRadiusEdge,
        "positive-radius",
        w.radius
      ).setAttribute("stroke-dasharray", d.radius);

      circle(
        p.anchor,
        p.marginBoundaryEdge,
        "margin-boundary",
        w.boundary
      );

      line(
        p.anchor,
        p.positive,
        "distance",
        w.distance,
        d.distance
      );

      line(
        p.anchor,
        p.negative,
        "distance",
        w.distance,
        d.distance
      );

      line(
        p.marginStart,
        p.marginEnd,
        "margin-bracket",
        w.bracket
      );

      line(
        p.marginStartTickTop,
        p.marginStartTickBottom,
        "margin-bracket",
        w.bracket
      );

      line(
        p.marginEndTickTop,
        p.marginEndTickBottom,
        "margin-bracket",
        w.bracket
      );

      rect(
        p.equationCardTopLeft,
        p.equationCardBottomRight,
        "equation-card",
        w.card
      );

      circle(
        p.anchor,
        p.pointRadiusEdge,
        "anchor-dot",
        w.pointStroke
      );

      circle(
        p.positive,
        {
          x: p.positive.x + p.pointRadiusEdge.x,
          y: p.positive.y
        },
        "positive-dot",
        w.pointStroke
      );

      circle(
        p.negative,
        {
          x: p.negative.x + p.pointRadiusEdge.x,
          y: p.negative.y
        },
        "negative-dot",
        w.pointStroke
      );

      circle(
        p.validNegative,
        {
          x: p.validNegative.x + p.pointRadiusEdge.x,
          y: p.validNegative.y
        },
        "valid-dot",
        w.pointStroke
      );

      text(
        "плоскость эмбеддингов",
        p.planeLabel,
        o.noOffset,
        "start",
        "muted-label",
        f.small
      );

      text(
        "anchor",
        p.anchor,
        o.leftMiddle,
        "end",
        "label",
        f.point
      );

      text(
        "positive",
        p.positive,
        o.above,
        "middle",
        "positive-label",
        f.point
      );

      text(
        "d(anchor, positive) = 0,4",
        p.positiveDistanceLabel,
        o.distanceLeft,
        "end",
        "positive-label",
        f.small
      );

      text(
        "negative",
        p.negative,
        o.rightBelow,
        "start",
        "negative-label",
        f.point
      );

      text(
        "d(anchor, negative) = 0,5",
        p.negativeDistanceLabel,
        o.distanceAbove,
        "middle",
        "negative-label",
        f.small
      );

      text(
        "граница: 0,4 + 0,2 = 0,6",
        p.boundaryLabelAnchor,
        o.boundaryLeft,
        "end",
        "boundary-label",
        f.small
      );

      text(
        "ещё рано: loss > 0",
        p.invalidLabelAnchor,
        o.invalidBelow,
        "middle",
        "negative-label",
        f.ordinary
      );

      text(
        "margin = 0,2",
        p.marginLabelAnchor,
        o.marginBelow,
        "middle",
        "boundary-label",
        f.small
      );

      text(
        "допустимая область для negative",
        p.validAreaLabelAnchor,
        o.areaRight,
        "start",
        "valid-label",
        f.small
      );

      text(
        "negative при 0,8: loss = 0",
        p.validNegative,
        o.rightAbove,
        "start",
        "valid-label",
        f.small
      );

      text(
        "Допустимо, когда:",
        p.equationHeading,
        o.noOffset,
        "start",
        "label",
        f.equationHeading
      );

      text(
        "d(anchor, positive) + 0,2",
        p.equationFirstLine,
        o.noOffset,
        "start",
        "equation",
        f.equation
      );

      text(
        "< d(anchor, negative)",
        p.equationSecondLine,
        o.noOffset,
        "start",
        "equation",
        f.equation
      );

      fallback.hidden = true;
      diagram.hidden = false;
    } catch (error) {
      document.getElementById("diagram").hidden = true;
      document.getElementById("fallback").hidden = false;
    }
  </script>
</body>
</html>
