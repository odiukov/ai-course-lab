- concept: градиент среднего MSE нормируется на размер батча
  question: В батче 5 объектов. Для одного объекта предсказание равно 26, а целевое значение — 14. Чему равна производная среднего MSE по этому предсказанию?
  explanation: Разность предсказания и цели равна 12, её удвоенное значение — 24. Поскольку MSE усредняется по батчу, производная равна 24 / 5 = 4.8.
  kind: numeric
  answer: 4.8
  tolerance: 0.001
  id: 008-write-mse-gradient-1
  fingerprint: 29ccf897
- concept: градиент по списку предсказаний содержит отдельную компоненту для каждого предсказания в том же порядке
  question: Какую структуру должна возвращать функция, вычисляющая градиент MSE по списку предсказаний?
  explanation: У каждого предсказания есть собственная частная производная. Компоненты градиента сохраняют порядок входа, чтобы каждая из них соответствовала своему предсказанию.
  kind: choice
  options:
    - Список частных производных, расположенных в том же порядке, что и предсказания
    - Одно скалярное значение — среднее всех частных производных
    - Список производных, отсортированный по модулю
    - Только производные для предсказаний с ненулевой ошибкой
