- concept: при отключённом сглаживании label-smoothed loss сводится к обычной categorical cross-entropy
  question: Во что должна превратиться функция label_smoothed_cce, если сглаживание полностью отключено?
  explanation: 'При alpha = 0 мягкая цель становится one-hot-целью: вес истинного класса равен 1, а веса остальных классов равны 0. Поэтому loss превращается в обычную categorical cross-entropy.'
  kind: cloze
  template: При полностью отключённом label smoothing функция label_smoothed_cce совпадает с ___.
  answer: обычной categorical cross-entropy
  accept:
    - categorical cross-entropy
    - CCE
    - обычной CCE
  id: 036-write-smoothed-cce-1
  fingerprint: 933c87a7
- concept: label smoothing изменяет целевое распределение, а не вероятности модели
  question: Как правильно применить label smoothing после вычисления softmax?
  explanation: Label smoothing заменяет жёсткую one-hot-цель мягким целевым распределением. Вероятности probs остаются выходом softmax без дополнительного сглаживания; иначе изменяется предсказание модели, а не обучающая цель.
  kind: choice
  options:
    - Построить мягкие веса целевых классов и взвесить ими отрицательные логарифмы неизменённых вероятностей модели
    - Смешать вероятности модели с равномерным распределением и взять отрицательный логарифм вероятности истинного класса
    - Прибавить коэффициент сглаживания к каждому логиту перед вычислением softmax
