- concept: triplet loss измеряет величину нарушения требуемого зазора между расстояниями
  question: Triplet loss равен положительной части выражения d(a,p) − d(a,n) + m. Расстояние от якоря до позитива равно 0,63, до негатива — 0,81, а margin — 0,27. Чему равен loss?
  explanation: Вычисляем 0,63 − 0,81 + 0,27 = 0,09. Выражение положительно, поэтому тройка нарушает требуемый зазор именно на эту величину.
  kind: numeric
  answer: 0.09
  tolerance: 0.001
  id: 050-triplet-margin-1
  fingerprint: f56b8777
- concept: лёгкие тройки с выполненным margin не дают градиента, поэтому нужны трудные негативы
  question: Почему обучение с triplet loss может стать неэффективным, если негативы для троек выбирать случайно, и как это исправляют?
  explanation: Когда негатив дальше позитива как минимум на величину margin, triplet loss равен нулю и параметры по этой тройке не обновляются. Поиск близких негативов увеличивает долю троек, несущих обучающий сигнал.
  kind: open
  reference: Случайные негативы часто уже находятся достаточно далеко от якоря. Такие тройки удовлетворяют условию margin, получают нулевой loss и не дают градиента. Поэтому подбирают трудные или умеренно трудные негативы, расположенные близко к якорю и нарушающие требуемый зазор.
  id: 050-triplet-margin-2
  fingerprint: 76e90fba
