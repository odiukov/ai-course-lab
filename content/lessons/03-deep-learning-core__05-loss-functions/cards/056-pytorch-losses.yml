- concept: для сырых бинарных логитов используют BCEWithLogits, тогда как обычная BCE принимает вероятности
  question: Бинарная модель заканчивается линейным слоем без sigmoid и возвращает сырые логиты. Какой вызов вычислит loss наиболее численно устойчиво?
  explanation: F.binary_cross_entropy_with_logits объединяет sigmoid и BCE в одну устойчивую операцию. Обычная F.binary_cross_entropy ожидает уже готовые вероятности, а отдельный sigmoid перед объединённой функцией применил бы преобразование повторно.
  kind: choice
  options:
    - F.binary_cross_entropy(torch.sigmoid(logits), targets)
    - F.binary_cross_entropy(logits, targets)
    - F.binary_cross_entropy_with_logits(logits, targets)
