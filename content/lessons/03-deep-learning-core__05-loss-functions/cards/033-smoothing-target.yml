- concept: цель правильного класса при label smoothing складывается из сохранённой one-hot массы и равной доли сглаживания
  question: В классификации с 8 классами применяют label smoothing с α = 0,2. Какой станет целевая вероятность правильного класса?
  explanation: От исходной метки сохраняется 0,8, а равномерная добавка составляет 0,2 / 8 = 0,025. Поэтому цель правильного класса равна 0,8 + 0,025 = 0,825.
  kind: numeric
  answer: 0.825
  tolerance: 0.0005
  id: 033-smoothing-target-1
  fingerprint: 36546c25
- concept: label smoothing сохраняет нормировку целевого распределения
  question: Почему после label smoothing сумма целевых вероятностей по классам остаётся единичной?
  explanation: 'Сглаженная метка — взвешенная смесь двух нормированных распределений: исходного one-hot и равномерного. Перераспределение меняет компоненты цели, но не её общую массу.'
  kind: choice
  options:
    - Потому что сглаживание добавляет массу только неправильным классам
    - Потому что softmax автоматически исправляет сумму целевых меток
    - Потому что результат является смесью one-hot и равномерного распределений, каждое из которых уже нормировано
    - Потому что удалённая у правильного класса масса отбрасывается
  correct: 2
