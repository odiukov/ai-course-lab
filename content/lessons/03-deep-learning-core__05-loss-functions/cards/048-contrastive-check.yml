- concept: перестановка негативов не меняет contrastive loss, поскольку их экспоненциальные веса суммируются
  question: Набор негативных примеров остался тем же, но их порядок в списке изменили. Что произойдёт со значением contrastive loss?
  explanation: Веса всех негативов входят в знаменатель через сумму. Перестановка слагаемых не меняет эту сумму и, следовательно, loss.
  kind: choice
  options:
    - Loss уменьшится, если первым поставить самый слабый негатив
    - Loss не изменится
    - Loss увеличится, если первым поставить самый сильный негатив
  correct: 1
  id: 048-contrastive-check-1
  fingerprint: 23b6d077
- concept: contrastive loss в общем случае несимметричен по якорю и позитиву, потому что негативы сравниваются именно с якорем
  question: Почему замена якоря и позитива местами может изменить contrastive loss, хотя косинусная близость двух векторов симметрична?
  explanation: 'Симметрична только близость пары anchor–positive. Вся функция потерь несимметрична: набор близостей anchor–negative после перестановки обычно становится другим.'
  kind: open
  reference: Близость между якорем и позитивом сохранится, но после перестановки негативы будут сравниваться с другим вектором. Эти близости могут измениться, поэтому изменятся знаменатель и loss.
  id: 048-contrastive-check-2
  fingerprint: ab875c3c
