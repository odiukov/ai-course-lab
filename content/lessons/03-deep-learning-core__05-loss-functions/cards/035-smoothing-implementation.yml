- concept: smoothed cross-entropy суммирует взвешенные логарифмы вероятностей всех классов
  question: Заполни множитель при логарифме вероятности класса в формуле smoothed cross-entropy.
  explanation: Множитель q_i — доля класса в сглаженном целевом распределении. Она положительна и для неверных классов, поэтому их предсказанные вероятности тоже входят в loss.
  kind: cloze
  template: L = -\sum_i ___ \log p_i
  answer: q_i
  accept:
    - y_i^{smooth}
    - smooth_target_i
    - сглаженная целевая вероятность класса i
  id: 035-smoothing-implementation-1
  fingerprint: 0797c945
- concept: label smoothing различает распределения по неверным классам при одинаковой вероятности истинного класса
  question: Модели A и B назначают истинному классу одинаковую вероятность. A поровну распределяет оставшуюся массу между неверными классами, а B почти обнуляет вероятность одного неверного класса. При прочих равных у какой модели smoothed cross-entropy выше?
  explanation: При label smoothing неверные классы имеют ненулевые целевые доли. Поэтому член с почти нулевой предсказанной вероятностью содержит большой по модулю отрицательный логарифм и повышает потерю модели B.
  kind: choice
  options:
    - У A, потому что равномерное распределение увеличивает штраф
    - У B, потому что почти нулевая вероятность получает ненулевой вес мягкой цели
    - Потери равны, поскольку вероятность истинного класса совпадает
    - Сравнить модели нельзя без знания индекса истинного класса
  correct: 1
  id: 035-smoothing-implementation-2
  fingerprint: 63b33c1a
