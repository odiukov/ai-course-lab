- concept: alpha отвечает за баланс классов, а gamma — за фокусировку на трудных примерах
  question: В задаче нужно отдельно компенсировать редкость положительного класса и ослабить влияние уверенно классифицированных объектов. Как распределяются эти роли между параметрами focal loss?
  explanation: 'Коэффициент alpha позволяет по-разному взвешивать классы. Параметр gamma управляет зависимостью веса от сложности конкретного примера: чем модель увереннее в истинном классе, тем сильнее может быть подавлен его вклад.'
  kind: choice
  options:
    - alpha задаёт классовый вес, а gamma управляет подавлением лёгких примеров
    - gamma задаёт классовый вес, а alpha управляет подавлением лёгких примеров
    - Оба параметра меняют только классовый баланс
    - Оба параметра меняют только вероятность, выдаваемую моделью
