- concept: увеличение gamma сильнее подавляет примеры с высокой вероятностью истинного класса
  question: Для примера A вероятность истинного класса равна 0.96, а для примера B — 0.55. Что произойдёт с их относительными вкладами, если увеличить gamma с 3 до 5 при неизменном alpha?
  explanation: Основание модулирующего множителя у примера A заметно меньше. Повышение gamma поэтому гораздо сильнее уменьшает вклад уверенно решённого примера A и концентрирует обучение на более трудном примере B.
  kind: choice
  options:
    - Вклады обоих примеров увеличатся одинаково
    - Пример A будет подавлен относительно сильнее, чем пример B
    - Пример B будет подавлен относительно сильнее, чем пример A
    - Относительные вклады не изменятся без изменения alpha
