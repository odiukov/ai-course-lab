- concept: semi-hard негатив дальше позитива, но находится внутри требуемого margin
  question: Для triplet loss расстояние от anchor до positive равно 0,52, а margin равен 0,23. Какой кандидат является semi-hard негативом?
  explanation: 'Semi-hard негатив должен быть дальше позитива, но ближе границы d(anchor, positive) + margin = 0,75. Расстояние 0,67 удовлетворяет этому условию: порядок уже правильный, однако loss ещё положителен.'
  kind: choice
  options:
    - Негатив на расстоянии 0,41
    - Негатив на расстоянии 0,67
    - Негатив на расстоянии 0,91
  correct: 1
  id: 052-negative-mining-1
  fingerprint: 7e1fda38
- concept: исключительный выбор самых трудных негативов повышает чувствительность triplet loss к выбросам и ошибкам разметки
  question: Почему при обучении с triplet loss выбор исключительно самого близкого к anchor негатива может быть менее устойчивым, чем выбор semi-hard негативов?
  explanation: Hard-negative mining даёт сильный градиент, но сильнее реагирует на шум разметки и необычные объекты. Semi-hard mining оставляет активными тройки с недостаточным зазором, не заставляя каждый раз ориентироваться на наиболее экстремальный негатив.
  kind: open
  reference: Самым близким негативом может оказаться выброс или ошибочно размеченный объект, который фактически похож на anchor. Такой пример создаёт чрезмерный или неверно направленный обучающий сигнал. Semi-hard негативы сохраняют положительный loss и полезный градиент, но реже концентрируют обучение на экстремальных случаях.
  id: 052-negative-mining-2
  fingerprint: 9abf1876
