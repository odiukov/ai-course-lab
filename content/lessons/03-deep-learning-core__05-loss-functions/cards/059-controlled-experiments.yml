- concept: в контролируемом сравнении функций потерь остальные условия обучения фиксируют
  question: Какой эксперимент позволяет обоснованно связать разницу в качестве моделей именно с выбором функции потерь?
  explanation: Если вместе с loss меняются архитектура, данные, начальные веса или режим обучения, возникает смешение факторов. При фиксации этих условий существенным различием остаётся функция потерь, поэтому различие результатов можно связать с ней.
  kind: choice
  options:
    - Обучить модели с разными функциями потерь, архитектурами и оптимизаторами, а затем выбрать лучшую
    - Обучить модели на одинаковых данных из одинаковых начальных весов, сохранив архитектуру, оптимизатор и порядок батчей и изменив только функцию потерь
    - Обучить одну модель дольше другой, чтобы обе достигли близкого значения обучающей потери
    - Для каждой функции потерь независимо подобрать наиболее удачное разбиение данных
  correct: 1
  id: 059-controlled-experiments-1
  fingerprint: fef97b09
- concept: надёжность сравнения функций потерь оценивают по результатам нескольких запусков с разными seed
  question: Почему для сравнения двух функций потерь недостаточно одного запуска и как следует суммировать результаты повторных запусков?
  explanation: Даже при одинаковом протоколе случайная инициализация влияет на итог обучения. Среднее по нескольким seed показывает типичный результат, а разброс помогает понять, устойчиво ли преимущество одной функции потерь.
  kind: open
  reference: Один запуск может оказаться случайно удачным из-за инициализации и других стохастических факторов. Нужно повторить парное контролируемое обучение с разными seed, а затем сравнить среднее значение целевой метрики и разброс результатов.
  id: 059-controlled-experiments-2
  fingerprint: b3f621f4
