- concept: обе границы clipping защищают разные логарифмические члены BCE
  question: Почему для устойчивого вычисления BCE недостаточно защитить только нижнюю границу вероятности положительного класса?
  explanation: В BCE присутствуют log(p) и log(1 − p). Нижний порог ε защищает первый логарифм при p = 0, а верхний порог 1 − ε — второй при p = 1.
  kind: open
  reference: 'Для положительной метки опасна нижняя граница: логарифм самой вероятности становится неопределённым. Для отрицательной метки опасна верхняя граница: дополнение вероятности обращается в ноль. Поэтому вероятность ограничивают с обеих сторон.'
  id: 017-bce-clipping-1
  fingerprint: 031b7a73
- concept: clipping сохраняет вероятности внутри безопасного интервала и ограничивает только крайние значения
  question: Как clipping преобразует предсказанные вероятности перед вычислением BCE?
  explanation: Операция max(ε, min(1 − ε, p)) не меняет безопасные значения вроде 0,7. Только значения у опасных краёв заменяются на ε или 1 − ε, чтобы логарифмы оставались конечными.
  kind: choice
  options:
    - Увеличивает каждую вероятность на малую положительную константу
    - Заново нормализует вероятности по всему батчу
    - Округляет каждую вероятность до ближайшего класса
    - Сохраняет значения внутри безопасного интервала, а крайние заменяет ближайшей границей
  correct: 3
  id: 017-bce-clipping-2
  fingerprint: b79c86fd
