- concept: знак производной BCE по вероятности направляет прогноз к правильной бинарной метке
  question: Какие знаки имеет производная BCE по предсказанной вероятности для положительной и отрицательной меток?
  explanation: При положительной метке отрицательная производная означает, что для снижения потерь вероятность нужно увеличивать. При отрицательной метке производная положительна, поэтому вероятность нужно уменьшать.
