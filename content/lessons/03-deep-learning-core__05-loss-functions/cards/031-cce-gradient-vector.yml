- concept: вычитание градиента уменьшает логиты с положительным градиентом и увеличивает логиты с отрицательным
  question: Для трёх классов градиент функции потерь по логитам равен [0.44, 0.19, −0.63]. Как градиентный спуск изменит логиты при положительном шаге обучения?
  explanation: Градиентный спуск выполняет обновление z ← z − ηg. Поэтому положительные компоненты 0.44 и 0.19 уменьшают соответствующие логиты, а отрицательная компонента −0.63 увеличивает третий логит.
  kind: choice
  options:
    - Первые два логита уменьшатся, третий увеличится
    - Первые два логита увеличатся, третий уменьшится
    - Все три логита уменьшатся
    - Изменится только третий логит
  correct: 0
  id: 031-cce-gradient-vector-1
  fingerprint: aebb83d0
- concept: чем выше вероятность неверного класса, тем сильнее градиентный спуск понижает его логит
  question: 'Softmax выдал вероятности классов A, B, C и D: [0.43, 0.26, 0.20, 0.11]. Истинный класс — D. Расположите неверные классы от самого сильного понижения логита до самого слабого.'
  explanation: Для неверного класса компонент градиента равен его вероятности. Поэтому логит A с вероятностью 0.43 понизится сильнее логита B, а логит B — сильнее логита C.
  kind: order
  items:
    - Класс A
    - Класс B
    - Класс C
  id: 031-cce-gradient-vector-2
  fingerprint: be680d5c
- concept: шаг обучения масштабирует изменение логита, заданное градиентом
  question: Компонента градиента по логиту истинного класса равна −0.72, а шаг обучения равен 0.06. Чему равно подписанное изменение этого логита Δz при обновлении градиентным спуском?
  explanation: Обновление равно Δz = −ηg = −0.06 · (−0.72) = 0.0432. Положительный результат означает, что логит истинного класса увеличится.
  kind: numeric
  answer: 0.0432
  tolerance: 0.0001
  id: 031-cce-gradient-vector-3
  fingerprint: 047a3524
