- concept: косинусная близость равна скалярному произведению, нормированному на длины векторов
  question: Вычисли косинусную близость эмбеддингов [3, 5] и [7, 4]. Округли результат до трёх знаков после запятой.
  explanation: Скалярное произведение равно 41, а произведение длин — √34 · √65. Поэтому sim = 41 / √2210 ≈ 0.872. Положительное значение показывает, что направления векторов скорее совпадают, чем расходятся.
  kind: numeric
  answer: 0.872
  tolerance: 0.002
  id: 043-cosine-similarity-1
  fingerprint: '63144331'
- concept: косинусная близость инвариантна к положительному масштабированию эмбеддинга
  question: Какое преобразование одного из двух ненулевых эмбеддингов гарантированно не изменит их косинусную близость?
  explanation: При положительном масштабировании во столько же раз увеличиваются и скалярное произведение, и длина преобразованного вектора, поэтому коэффициент сокращается. Остальные преобразования могут изменить направление эмбеддинга.
  kind: choice
  options:
    - Умножение всех его координат на один положительный коэффициент
    - Прибавление одной и той же константы ко всем его координатам
    - Умножение только одной его координаты на положительный коэффициент
    - Перестановка координат только в этом эмбеддинге
