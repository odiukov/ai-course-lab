- concept: вероятности классов в softmax связаны общим знаменателем и конкурируют за общую вероятностную массу
  question: Почему при фиксированных остальных логитах увеличение логита одного класса уменьшает вероятности других классов после softmax?
  explanation: 'Softmax нормирует все экспоненциальные веса одной общей суммой. Поэтому классы не получают независимые вероятности: рост доли одного класса перераспределяет общую вероятностную массу в его пользу.'
  kind: open
  reference: Экспонента увеличенного логита входит в общую сумму в знаменателе. Знаменатель растёт, поэтому доли остальных классов уменьшаются, а сумма всех вероятностей остаётся равной единице.
  id: 023-softmax-role-2
  fingerprint: b6312544
