- concept: модуль градиента MSE растёт линейно с модулем ошибки
  question: В одном батче ошибки двух предсказаний равны 3 и 9. Как соотносятся модули градиентов MSE по этим предсказаниям?
  explanation: При неизменном размере батча модуль градиента MSE прямо пропорционален модулю ошибки. Ошибка выросла с 3 до 9, поэтому градиент увеличился втрое.
  kind: choice
  options:
    - У второго втрое больше
    - У второго в девять раз больше
    - Они одинаковы
  correct: 0
  id: 007-mse-gradient-rule-1
  fingerprint: 3cf94c78
- concept: знак градиента MSE указывает, в какую сторону нужно скорректировать предсказание
  question: Предсказание модели меньше правильного ответа. Каков знак градиента MSE по предсказанию и почему градиентный спуск будет увеличивать предсказание?
  explanation: Знак разности между предсказанием и целью определяет знак градиента. Если модель занизила ответ, отрицательный градиент приводит при шаге градиентного спуска к увеличению предсказания.
  kind: open
  reference: Градиент отрицательный, потому что разность между предсказанием и правильным ответом отрицательна. Градиентный спуск вычитает градиент, поэтому вычитание отрицательного значения увеличивает предсказание и приближает его к цели.
  id: 007-mse-gradient-rule-2
  fingerprint: fa462a29
