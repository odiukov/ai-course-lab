- concept: вычитание максимального логита ограничивает экспоненты и предотвращает переполнение
  question: Заполни пропуск так, чтобы вычисление softmax было устойчивым при очень больших положительных логитах.
  explanation: После вычитания максимума наибольший аргумент exp равен нулю, а остальные неположительны. Поэтому экспоненты не превосходят единицу, тогда как вероятности softmax остаются математически теми же.
