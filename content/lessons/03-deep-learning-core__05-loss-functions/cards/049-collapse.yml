- concept: негативные кандидаты делают схлопывание всех эмбеддингов невыгодным для InfoNCE
  question: Почему требование сближать только позитивные пары допускает одинаковый эмбеддинг для всех объектов, а добавление негативных кандидатов в InfoNCE препятствует такому схлопыванию?
  explanation: Схлопывание удовлетворяет абсолютному требованию близости позитивов, но не относительному требованию InfoNCE. Чтобы выделить позитив среди негативов, модель должна сохранять различающие признаки объектов.
  kind: open
  reference: При обучении только на позитивах одинаковый вектор для всех входов делает каждую позитивную пару максимально близкой. В InfoNCE позитив должен быть ближе к якорю, чем негативы. При одинаковых эмбеддингах все кандидаты неразличимы, вероятность позитива мала, а loss остаётся высоким.
  id: 049-collapse-1
  fingerprint: 35818cb1
- concept: ложный негатив заставляет contrastive loss ошибочно раздвигать семантически похожие объекты
  question: В contrastive-батче два семантически похожих изображения считаются негативной парой только потому, что происходят из разных исходных примеров. Какой сигнал получит модель?
  explanation: 'InfoNCE следует заданной структуре позитивов и негативов, а не самостоятельно найденным классам. Поэтому ложный негатив создаёт спорный градиент: модель отталкивает похожие объекты, что показывает зависимость обучения от состава батча.'
  kind: choice
  options:
    - Сблизить их эмбеддинги, поскольку визуальное сходство автоматически превращает негатив в позитив
    - Раздвинуть их эмбеддинги, хотя с точки зрения семантики их, возможно, следовало бы сближать
    - Игнорировать эту пару, поскольку негативы не участвуют в градиенте InfoNCE
    - Сделать эмбеддинги всех остальных объектов одинаковыми
  correct: 1
  id: 049-collapse-2
