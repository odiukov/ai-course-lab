- concept: веса модели напрямую обновляются по градиенту функции потерь, а не по отчётной метрике
  question: Команда отслеживает F1, но при обучении вычисляет градиент только дифференцируемой функции потерь L. Что непосредственно определяет обновление весов?
  explanation: Оптимизатор изменяет веса в направлении, заданном градиентом L. F1 и accuracy могут использоваться для оценки, но модель не оптимизирует их напрямую, если они не входят в обучающую цель.
  kind: choice
  options:
    - Только значение F1
    - Порог, используемый для перевода вероятностей в классы
    - Градиент функции потерь L
    - Среднее между F1 и accuracy
  correct: 2
  id: 001-loss-contract-1
  fingerprint: eb50650a
- concept: постоянный прогноз, минимизирующий MSE, равен доле положительного класса
  question: В выборке 80% объектов относятся к положительному классу. Модель игнорирует признаки и выдаёт для всех объектов одну вероятность. Какое значение минимизирует средний MSE?
  explanation: Для постоянного прогноза q ожидаемый MSE минимален при q, равном средней метке, то есть доле положительного класса. Такой прогноз хорошо учитывает баланс классов, но ничего не различает.
  kind: numeric
  answer: 0.8
  tolerance: 0.002
  id: 001-loss-contract-2
  fingerprint: 40b0113b
- concept: кросс-энтропия штрафует модель через логарифм вероятности правильного класса
  question: Заполни пропуск в формуле кросс-энтропийной потери для одного объекта.
  explanation: В формулу подставляется вероятность, которую модель назначила истинному классу. Чем она выше, тем меньше потеря; поэтому уверенный правильный прогноз поощряется.
  kind: cloze
  template: L = -log(___)
  answer: p_y
  accept:
    - p(y)
    - вероятность правильного класса
    - вероятность истинного класса
  id: 001-loss-contract-3
  fingerprint: 1745e2c1
