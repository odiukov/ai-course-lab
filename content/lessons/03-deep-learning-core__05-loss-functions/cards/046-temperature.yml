- concept: отношение экспоненциальных весов двух кандидатов определяется разностью близостей, делённой на температуру
  question: В InfoNCE близости двух кандидатов равны 0.92 и 0.68, а температура τ равна 0.12. Во сколько раз ненормированный экспоненциальный вес первого кандидата больше веса второго?
  explanation: Отношение весов равно exp((0.92 − 0.68) / 0.12) = exp(2) ≈ 7.39. Чем меньше температура, тем сильнее экспонента увеличивает влияние той же разницы близостей.
  kind: numeric
  answer: 7.39
  tolerance: 0.03
  id: 046-temperature-1
  fingerprint: 21298a99
- concept: понижение температуры концентрирует softmax-распределение на кандидатах с наибольшей близостью, не меняя их порядок
  question: Как изменится распределение вероятностей в InfoNCE, если уменьшить температуру τ, оставив все косинусные близости неизменными?
  explanation: Деление близостей на меньшую температуру увеличивает различия между логитами, поэтому softmax сильнее концентрируется около максимума. Деление всех близостей на одну положительную величину сохраняет их порядок.
  kind: choice
  options:
    - Распределение станет более равномерным, а порядок кандидатов изменится
    - Вероятности всех кандидатов уменьшатся в одинаковое число раз
    - Распределение станет резче, но кандидат с максимальной близостью останется тем же
