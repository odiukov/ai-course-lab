- concept: пороговые accuracy и F1 не дают полезного локального сигнала для градиентной оптимизации
  question: Почему accuracy или F1, вычисляемые после порогового преобразования вероятностей в классы, обычно не используют как функцию потерь?
  explanation: Пока прогноз не пересёк порог, предсказанный класс и основанные на нём метрики остаются прежними. Поэтому accuracy и F1 не сообщают градиентному методу, какое небольшое изменение параметров улучшит результат.
  kind: choice
  options:
    - Эти метрики зависят только от способа инициализации модели
    - Эти метрики невозможно вычислить для размеченной выборки
    - 'После порогования метрики кусочно-постоянны: небольшие изменения вероятностей часто вообще не меняют их значение'
  correct: 2
  id: 002-loss-vs-metric-1
  fingerprint: 5c143724
- concept: снижение оптимизируемого loss не гарантирует улучшения целевой метрики
  question: Во время обучения loss уменьшается, но F1 на валидации ухудшается. Объясни, почему здесь нет противоречия и что следует проверить инженеру.
  explanation: Loss задаёт обучающий сигнал, а F1 измеряет итоговое качество. Если уменьшение loss поощряет изменения, которые не улучшают решения после порогования, эти показатели могут двигаться в разные стороны.
  kind: open
  reference: Модель улучшает именно выбранную функцию потерь, а F1 оценивает другое свойство её ответов после порогования. Цели могут быть рассогласованы, поэтому инженеру следует проверить, соответствует ли loss прикладной задаче, а также корректно ли выбран порог оценки.
  id: 002-loss-vs-metric-2
  fingerprint: '12938658'
