- concept: MSE вычисляется как среднее квадратов ошибок
  question: Ошибки регрессионной модели на пяти объектах равны −5, +7, −11, +13 и −17. Чему равна MSE?
  explanation: Квадраты ошибок равны 25, 49, 121, 169 и 289. Их сумма — 653, а среднее равно 653 / 5 = 130,6.
  kind: numeric
  answer: 130.6
  tolerance: 0.01
  id: 005-mse-mean-square-1
  fingerprint: a34820ed
- concept: вклад отдельной ошибки в MSE растёт пропорционально квадрату её величины
  question: Модуль ошибки одного прогноза увеличился в 8 раз. Во сколько раз увеличился вклад этого прогноза в MSE?
  explanation: MSE использует квадрат ошибки. Поэтому увеличение ошибки в восемь раз увеличивает её вклад в восемь на восемь, то есть в 64 раза. Из-за этого крупные промахи особенно сильно влияют на MSE.
  kind: choice
  options:
    - В 8 раз
    - В 32 раза
    - В 64 раза
    - Не изменился
  correct: 2
  id: 005-mse-mean-square-2
  fingerprint: 0d7b4da6
