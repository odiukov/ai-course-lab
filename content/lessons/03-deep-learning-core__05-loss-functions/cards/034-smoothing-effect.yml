- concept: градиент мягкой кросс-энтропии снижает чрезмерную уверенность после превышения целевой вероятности
  question: Мягкая цель задаёт правильному классу вероятность 0.85, а модель уже предсказывает для него 0.97. Как градиентный спуск изменит относительное преимущество логита правильного класса?
  explanation: Для кросс-энтропии с мягкой целью градиент по логиту равен разности между предсказанной и целевой вероятностями. Здесь 0.97 − 0.85 положительно, поэтому вычитание градиента уменьшает логит правильного класса относительно остальных.
  kind: choice
  options:
    - Продолжит увеличивать преимущество, поскольку класс выбран правильно
    - Не изменит логиты, поскольку правильный класс уже имеет максимальную вероятность
    - Изменит только общий сдвиг всех логитов, сохранив их разности
    - Начнёт уменьшать чрезмерное преимущество логита правильного класса
  correct: 3
  id: 034-smoothing-effect-1
  fingerprint: 36660fb0
- concept: мягкому целевому распределению соответствует конечная оптимальная разность логитов
  question: Для двух классов мягкая цель равна [0.8, 0.2]. Чему равна оптимальная разность «логит целевого класса минус логит другого класса», если softmax-распределение совпало с целью?
  explanation: Отношение softmax-вероятностей равно экспоненте разности логитов. Поэтому искомая разность равна ln(0.8 / 0.2) = ln(4) ≈ 1.386. В отличие от one-hot цели, мягкая цель достигается при конечном разрыве логитов.
  kind: numeric
  answer: 1.386
  tolerance: 0.02
  id: 034-smoothing-effect-2
  fingerprint: 9e7c3988
