- concept: margin задаёт нижнюю границу расстояния до негатива относительно текущего расстояния до позитива
  question: В triplet loss расстояние от anchor до positive равно 1,25, а margin равен 0,35. Каким минимум должно быть расстояние от anchor до negative, чтобы тройка удовлетворяла требованию margin?
  explanation: 'Нужно выполнить условие d(anchor, negative) ≥ d(anchor, positive) + margin. Поэтому минимальная дистанция равна 1,25 + 0,35 = 1,60. Это относительная граница: она зависит от положения positive.'
  kind: numeric
  answer: 1.6
  tolerance: 0.001
  id: 051-triplet-geometry-1
  fingerprint: cbdde0a0
- concept: увеличение margin расширяет множество троек, нарушающих требуемый зазор
  question: Для неизменной тройки d(anchor, positive) = 1,30 и d(anchor, negative) = 1,85. Margin увеличили с 0,35 до 0,85. Что произойдёт с triplet loss?
  explanation: Фактический зазор равен 1,85 − 1,30 = 0,55. Он достаточен при margin 0,35, но недостаточен при margin 0,85, поэтому прежняя допустимая тройка начинает давать положительный loss.
  kind: choice
  options:
    - Он изменится с нулевого на положительный
    - Он останется нулевым, потому что positive по-прежнему ближе
    - Он станет отрицательным
    - Он не изменится, поскольку эмбеддинги не перемещались
