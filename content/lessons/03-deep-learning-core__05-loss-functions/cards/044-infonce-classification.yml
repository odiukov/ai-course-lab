- concept: InfoNCE использует индекс позитивного кандидата как временную метку класса, а сходства со всеми кандидатами — как логиты
  question: Для якорного объекта известен позитивный кандидат и набор негативных кандидатов. Как InfoNCE интерпретирует такой обучающий пример?
  explanation: InfoNCE сводит поиск позитивной пары к классификации внутри текущего набора кандидатов. Softmax применяется к их сходствам, а categorical cross-entropy использует позицию позитива как правильный ответ. При смене якоря состав кандидатов и правильная позиция могут измениться.
  kind: choice
  options:
    - Каждый кандидат относится к постоянному семантическому классу, который сохраняется во всём датасете
    - Позиция позитива служит правильным временным классом, а сходства со всеми кандидатами образуют логиты
    - Модель проверяет только знак сходства с позитивом и не использует сходства с негативами
    - Самый похожий негатив назначается правильным классом, чтобы модель научилась воспроизводить трудные ошибки
  correct: 1
  id: 044-infonce-classification-1
  fingerprint: 9d1c5f9d
- concept: добавление сильного негативного кандидата увеличивает знаменатель InfoNCE и уменьшает вероятность позитива
  question: После экспоненцирования масштабированных сходств позитив получил ненормированный вес 7.5, а существующие негативы вместе — 2.5. Затем в набор добавили трудный негатив с весом 5.0. Какова теперь softmax-вероятность позитива?
  explanation: Новый знаменатель равен 7.5 + 2.5 + 5.0 = 15.0, поэтому вероятность позитива равна 7.5 / 15.0 = 0.5. Хотя сходство позитивной пары не изменилось, сильный негатив отнял у неё часть вероятностной массы и увеличил loss.
  kind: numeric
  answer: 0.5
  tolerance: 0.001
  id: 044-infonce-classification-2
  fingerprint: 7af91436
