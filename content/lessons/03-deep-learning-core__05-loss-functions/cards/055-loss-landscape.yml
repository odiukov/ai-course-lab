- concept: устойчивая скорость обучения зависит от локальной крутизны и кривизны поверхности loss
  question: Один и тот же градиентный оптимизатор с одинаковой скоростью обучения стабильно сходится в широкой пологой впадине, но колеблется около минимума в узкой и крутой. Какое объяснение наиболее вероятно?
  explanation: При фиксированной скорости обучения крутые и быстро меняющиеся градиенты могут давать перескоки и колебания. Шаг, устойчивый на пологой поверхности, может оказаться чрезмерным на резко искривлённой.
  kind: choice
  options:
    - На крутой поверхности шаги по параметрам оказываются слишком большими и перескакивают через область минимума
    - Узкая впадина всегда означает, что градиент равен нулю во всех её точках
    - Форма поверхности не влияет на обучение, если название оптимизатора не изменилось
  correct: 0
  id: 055-loss-landscape-1
  fingerprint: 67f64915
- concept: множество локальных минимумов делает результат оптимизации зависимым от начальной точки и траектории
  question: Почему поверхность loss с множеством локальных минимумов обычно сложнее оптимизировать, чем гладкую параболическую поверхность с единственным минимумом?
  explanation: Оптимизатор использует локальную информацию о наклоне и не видит всю поверхность целиком. Поэтому множество впадин повышает зависимость результата от инициализации и пути обучения.
  kind: open
  reference: Градиент сообщает только локальное направление спуска. На поверхности с несколькими впадинами разные начальные точки и траектории могут привести к разным локальным минимумам, причём найденный минимум не обязательно будет лучшим. У параболической поверхности с единственным минимумом такой неоднозначности нет.
  id: 055-loss-landscape-2
  fingerprint: 17348d5e
- concept: градиент contrastive loss зависит от состава позитивных и негативных примеров в текущем батче
  question: Параметры модели и якорный объект не изменились, но для contrastive loss сформировали другой батч позитивов и негативов. Почему градиент может изменить величину и направление?
  explanation: Contrastive loss строится по отношениям якоря с позитивами и негативами из батча. При замене этих объектов меняются сравнения, а вместе с ними — поверхность loss и обучающий сигнал.
  kind: choice
  options:
    - Новый набор сравнений изменяет значение contrastive loss и локальный наклон его поверхности
    - Любая замена батча автоматически изменяет параметры модели до вычисления loss
    - Градиент contrastive loss определяется только якорем и не зависит от остальных объектов
    - Состав батча влияет лишь на отображаемую метрику, но не на оптимизируемую функцию
  correct: 0
  id: 055-loss-landscape-3
