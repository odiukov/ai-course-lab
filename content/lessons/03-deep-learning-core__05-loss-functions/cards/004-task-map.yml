- concept: binary и categorical cross-entropy применяются к разным формам классификационного выхода
  question: Модель распределяет вероятность между семью взаимоисключающими категориями документа. Какую функцию потерь следует выбрать?
  explanation: Когда нужно выбрать один класс из нескольких взаимоисключающих вариантов, используют categorical cross-entropy. Binary cross-entropy соответствует выходу с двумя исходами или независимым бинарным меткам.
  kind: choice
  options:
    - MSE
    - Binary cross-entropy
    - Categorical cross-entropy
    - InfoNCE
  correct: 2
  id: 004-task-map-2
  fingerprint: 73c6b76b
- concept: contrastive loss обучает представления по отношениям сходства без готовых классов
  question: Почему для обучения эмбеддингов по парам связанных и несвязанных объектов подходит InfoNCE, даже если объектам не назначены классы?
  explanation: В contrastive learning целью служит взаимное расположение представлений. InfoNCE сближает положительные пары и отделяет их от отрицательных примеров, поэтому явный список классов не обязателен.
  kind: open
  reference: 'InfoNCE использует отношения между объектами: повышает сходство эмбеддингов связанных примеров и снижает сходство несвязанных. Поэтому сигнал обучения задаётся парами или группами примеров, а не метками классов.'
  id: 004-task-map-3
  fingerprint: 38d929d4
