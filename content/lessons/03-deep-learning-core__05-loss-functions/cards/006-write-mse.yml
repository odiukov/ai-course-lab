- concept: zip молча отбрасывает непарный хвост при разной длине входов
  question: В реализации MSE пары обходятся через `zip(predictions, targets)`. Что произойдёт, если список `predictions` длиннее списка `targets`, а явной проверки длин нет?
  explanation: '`zip` завершает обход, когда заканчивается самый короткий вход. Поэтому функция вычислит MSE только для общего префикса и может вернуть правдоподобный, но неверный результат. Равенство длин следует проверять отдельно.'
  kind: choice
  options:
    - Лишние предсказания будут молча проигнорированы
    - Python дополнит короткий список нулями
    - Последний правильный ответ будет использован повторно
    - При создании `zip` сразу возникнет `IndexError`
  correct: 0
  id: 006-write-mse-1
  fingerprint: a88ffbc3
- concept: средняя ошибка не определена для пустого набора примеров
  question: Объясни, почему функция MSE, делящая сумму квадратов ошибок на `len(predictions)`, должна отдельно обрабатывать пустой вход.
  explanation: 'MSE — среднее по примерам. Если примеров нет, знаменатель равен нулю: приведённая реализация завершится ошибкой деления, а математического значения среднего для пустого набора нет.'
  kind: open
  reference: Для пустого набора число примеров равно нулю, поэтому деление невозможно, а среднее не определено. Функция должна отклонить такой вход или явно зафиксировать другое поведение.
