- concept: BCE инвариантна к одновременной замене бинарной метки и предсказанной вероятности на дополнения
  question: Для объекта класса «да» модель выдаёт вероятность класса «да» 0,73. Другой объект принадлежит классу «нет». Какую вероятность класса «да» должна выдать модель, чтобы BCE на втором объекте была точно такой же?
  explanation: 'В первом случае правильному исходу досталась вероятность 0,73. Во втором она также составит 0,73, если вероятность класса «да» равна 0,27: вероятность правильного класса «нет» тогда равна 1 − 0,27 = 0,73.'
  kind: choice
  options:
    - 0,41
    - 0,73
    - 0,27
  correct: 2
  id: 016-bce-meaning-1
  fingerprint: efacf36f
- concept: BCE неограниченно растёт при исчезающе малой вероятности истинного исхода
  question: Как ведёт себя BCE, если модель присваивает фактически случившемуся бинарному исходу всё меньшую вероятность?
  explanation: Для вероятности правильного исхода q штраф равен −log(q). Когда q становится сколь угодно малой, логарифм убывает без границы, поэтому отрицательный логарифм неограниченно растёт.
  kind: choice
  options:
    - Приближается к конечному постоянному штрафу
    - Уменьшается, поскольку прогноз становится увереннее
    - Неограниченно растёт
  correct: 2
  id: 016-bce-meaning-2
  fingerprint: 4332bf7b
