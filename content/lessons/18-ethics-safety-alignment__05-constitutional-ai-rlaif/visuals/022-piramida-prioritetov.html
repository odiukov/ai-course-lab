<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Иерархия конституции Claude 2026</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fc;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #526078;
      --rule: #aeb8ca;
      --guide: #35445f;
      --callout: #eef2f8;
      --tier-one: #a52a3a;
      --tier-two: #a55c12;
      --tier-three: #24704e;
      --tier-four: #315fa8;
      --tier-ink: #ffffff;
      --focus: #ffe8a3;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --panel: #182131;
        --ink: #f2f5fb;
        --muted: #c0cadb;
        --rule: #66738a;
        --guide: #d2daea;
        --callout: #222e42;
        --tier-one: #a93f50;
        --tier-two: #9b641f;
        --tier-three: #287153;
        --tier-four: #3866ad;
        --tier-ink: #ffffff;
        --focus: #5d4b17;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: unset;
      background: var(--page);
      color: var(--ink);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .figure {
      width: 100%;
      background: var(--panel);
      overflow: hidden;
    }

    h1 {
      margin: unset;
      padding: 18px 24px 10px;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      background: var(--panel);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 448px;
      background: var(--panel);
      border-top: 1px solid var(--rule);
    }

    text {
      fill: var(--ink);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .section-label {
      fill: var(--muted);
      font-size: 14px;
      font-weight: bold;
    }

    .tier-tag {
      fill: var(--tier-ink);
      font-size: 16px;
      font-weight: bold;
    }

    .tier-name {
      fill: var(--tier-ink);
      font-size: 18px;
      font-weight: bold;
    }

    .flow-label {
      fill: var(--ink);
      font-size: 16px;
    }

    .flow-strong {
      fill: var(--ink);
      font-size: 16px;
      font-weight: bold;
    }

    .callout-title {
      fill: var(--ink);
      font-size: 18px;
      font-weight: bold;
    }

    .callout-copy {
      fill: var(--muted);
      font-size: 15px;
    }

    .fallback-title {
      fill: var(--ink);
      font-size: 18px;
      font-weight: bold;
    }

    .fallback-copy {
      fill: var(--muted);
      font-size: 16px;
    }

    .tier-shape {
      stroke: var(--panel);
      stroke-width: 3;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .tier-one {
      fill: var(--tier-one);
    }

    .tier-two {
      fill: var(--tier-two);
    }

    .tier-three {
      fill: var(--tier-three);
    }

    .tier-four {
      fill: var(--tier-four);
    }

    .guide {
      fill: none;
      stroke: var(--guide);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .guide-head {
      fill: var(--guide);
      stroke: none;
    }

    .callout {
      fill: var(--callout);
      stroke: var(--rule);
      stroke-width: 2;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .callout-accent {
      fill: var(--focus);
      stroke: none;
    }
  </style>
</head>
<body>
  <main class="figure">
    <h1 id="diagram-title">Иерархия конституции Claude 2026</h1>

    <svg
      id="canvas"
      viewBox="0 0 960 448"
      width="960"
      height="448"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-title"
      aria-label="Пирамида приоритетов из четырёх уровней. Сверху вниз: Tier 1 — катастрофы, Tier 2 — правила Anthropic, Tier 3 — широкая этика, Tier 4 — полезность и прямота. Конфликт проверяется сверху вниз, и первый различающий уровень решает."
    >
      <g id="diagram"></g>
    </svg>
  </main>

  <script>
    const diagramData = {
      canvas: {
        left: -480,
        right: 480,
        top: -24,
        bottom: 424
      },
      pyramidCenter: -105,
      headings: [
        {
          x: -105,
          y: 26,
          text: "ПРИОРИТЕТЫ"
        },
        {
          x: 315,
          y: 26,
          text: "ПОРЯДОК РАЗРЕШЕНИЯ"
        }
      ],
      tiers: [
        {
          tier: 1,
          name: "Катастрофы",
          top: 48,
          bottom: 100,
          topHalf: 86,
          bottomHalf: 122,
          tagY: 69,
          nameY: 89,
          className: "tier-one"
        },
        {
          tier: 2,
          name: "Правила Anthropic",
          top: 108,
          bottom: 166,
          topHalf: 132,
          bottomHalf: 176,
          tagY: 132,
          nameY: 154,
          className: "tier-two"
        },
        {
          tier: 3,
          name: "Широкая этика",
          top: 174,
          bottom: 242,
          topHalf: 186,
          bottomHalf: 238,
          tagY: 201,
          nameY: 226,
          className: "tier-three"
        },
        {
          tier: 4,
          name: "Полезность и прямота",
          top: 250,
          bottom: 328,
          topHalf: 248,
          bottomHalf: 310,
          tagY: 280,
          nameY: 307,
          className: "tier-four"
        }
      ],
      flow: {
        x: 292,
        top: 54,
        bottom: 320,
        arrowLeft: 280,
        arrowRight: 304,
        arrowBase: 300,
        upperTextX: 326,
        upperTextY: 66,
        upperTextSecondY: 88,
        lowerTextX: 326,
        lowerTextY: 276,
        lowerTextSecondY: 299,
        upperText: "Сначала проверяем",
        upperTextSecond: "верхний приоритет",
        lowerText: "Ниже — только если",
        lowerTextSecond: "выше нет различия"
      },
      callout: {
        left: -416,
        right: 416,
        top: 350,
        bottom: 410,
        accentLeft: -416,
        accentRight: -402,
        titleX: -382,
        titleY: 376,
        copyX: -382,
        copyY: 397,
        title: "Не сумма баллов",
        copy: "Первый уровень, который различает варианты, завершает выбор."
      },
      fallback: {
        x: -405,
        titleY: 86,
        lineOneY: 122,
        lineTwoY: 151,
        lineThreeY: 180,
        lineFourY: 209,
        lineFiveY: 250,
        title: "Схема приоритетов не построилась.",
        lineOne: "Tier 1 — катастрофы",
        lineTwo: "Tier 2 — правила Anthropic",
        lineThree: "Tier 3 — широкая этика",
        lineFour: "Tier 4 — полезность и прямота",
        lineFive: "Конфликты разрешаются сверху вниз."
      }
    };

    const origin = {
      x: 480,
      y: 24
    };

    const scale = 1;

    const sx = (x) => origin.x + x * scale;
    const sy = (y) => origin.y + y * scale;

    try {
      const namespace = "http://www.w3.org/2000/svg";
      const layer = document.getElementById("diagram");

      if (!layer) {
        throw new Error("Контейнер схемы не найден");
      }

      const create = (name, attributes, parent = layer) => {
        const element = document.createElementNS(namespace, name);

        Object.entries(attributes).forEach(([key, value]) => {
          element.setAttribute(key, String(value));
        });

        parent.appendChild(element);
        return element;
      };

      const polygonPoints = (vertices) =>
        vertices
          .map(([x, y]) => `${sx(x)},${sy(y)}`)
          .join(" ");

      const addText = ({
        x,
        y,
        text,
        className,
        anchor = "middle"
      }) => {
        const element = create("text", {
          x: sx(x),
          y: sy(y),
          class: className,
          "text-anchor": anchor
        });

        element.textContent = text;
        return element;
      };

      create("polygon", {
        points: polygonPoints([
          [diagramData.canvas.left, diagramData.canvas.top],
          [diagramData.canvas.right, diagramData.canvas.top],
          [diagramData.canvas.right, diagramData.canvas.bottom],
          [diagramData.canvas.left, diagramData.canvas.bottom]
        ]),
        fill: "var(--panel)"
      });

      diagramData.headings.forEach((heading) => {
        addText({
          x: heading.x,
          y: heading.y,
          text: heading.text,
          className: "section-label"
        });
      });

      diagramData.tiers.forEach((tier) => {
        const center = diagramData.pyramidCenter;

        create("polygon", {
          points: polygonPoints([
            [center - tier.topHalf, tier.top],
            [center + tier.topHalf, tier.top],
            [center + tier.bottomHalf, tier.bottom],
            [center - tier.bottomHalf, tier.bottom]
          ]),
          class: `tier-shape ${tier.className}`
        });

        addText({
          x: center,
          y: tier.tagY,
          text: `Tier ${tier.tier}`,
          className: "tier-tag"
        });

        addText({
          x: center,
          y: tier.nameY,
          text: tier.name,
          className: "tier-name"
        });
      });

      create("line", {
        x1: sx(diagramData.flow.x),
        y1: sy(diagramData.flow.top),
        x2: sx(diagramData.flow.x),
        y2: sy(diagramData.flow.bottom),
        class: "guide"
      });

      create("polygon", {
        points: polygonPoints([
          [diagramData.flow.arrowLeft, diagramData.flow.arrowBase],
          [diagramData.flow.x, diagramData.flow.bottom],
          [diagramData.flow.arrowRight, diagramData.flow.arrowBase]
        ]),
        class: "guide-head"
      });

      addText({
        x: diagramData.flow.upperTextX,
        y: diagramData.flow.upperTextY,
        text: diagramData.flow.upperText,
        className: "flow-strong",
        anchor: "start"
      });

      addText({
        x: diagramData.flow.upperTextX,
        y: diagramData.flow.upperTextSecondY,
        text: diagramData.flow.upperTextSecond,
        className: "flow-label",
        anchor: "start"
      });

      addText({
        x: diagramData.flow.lowerTextX,
        y: diagramData.flow.lowerTextY,
        text: diagramData.flow.lowerText,
        className: "flow-strong",
        anchor: "start"
      });

      addText({
        x: diagramData.flow.lowerTextX,
        y: diagramData.flow.lowerTextSecondY,
        text: diagramData.flow.lowerTextSecond,
        className: "flow-label",
        anchor: "start"
      });

      create("polygon", {
        points: polygonPoints([
          [diagramData.callout.left, diagramData.callout.top],
          [diagramData.callout.right, diagramData.callout.top],
          [diagramData.callout.right, diagramData.callout.bottom],
          [diagramData.callout.left, diagramData.callout.bottom]
        ]),
        class: "callout"
      });

      create("polygon", {
        points: polygonPoints([
          [diagramData.callout.accentLeft, diagramData.callout.top],
          [diagramData.callout.accentRight, diagramData.callout.top],
          [diagramData.callout.accentRight, diagramData.callout.bottom],
          [diagramData.callout.accentLeft, diagramData.callout.bottom]
        ]),
        class: "callout-accent"
      });

      addText({
        x: diagramData.callout.titleX,
        y: diagramData.callout.titleY,
        text: diagramData.callout.title,
        className: "callout-title",
        anchor: "start"
      });

      addText({
        x: diagramData.callout.copyX,
        y: diagramData.callout.copyY,
        text: diagramData.callout.copy,
        className: "callout-copy",
        anchor: "start"
      });
    } catch (error) {
      const namespace = "http://www.w3.org/2000/svg";
      const layer = document.getElementById("diagram");

      if (layer) {
        layer.replaceChildren();

        const fallbackText = (x, y, text, className) => {
          const element = document.createElementNS(namespace, "text");
          element.setAttribute("x", String(sx(x)));
          element.setAttribute("y", String(sy(y)));
          element.setAttribute("class", className);
          element.setAttribute("text-anchor", "start");
          element.textContent = text;
          layer.appendChild(element);
        };

        fallbackText(
          diagramData.fallback.x,
          diagramData.fallback.titleY,
          diagramData.fallback.title,
          "fallback-title"
        );

        fallbackText(
          diagramData.fallback.x,
          diagramData.fallback.lineOneY,
          diagramData.fallback.lineOne,
          "fallback-copy"
        );

        fallbackText(
          diagramData.fallback.x,
          diagramData.fallback.lineTwoY,
          diagramData.fallback.lineTwo,
          "fallback-copy"
        );

        fallbackText(
          diagramData.fallback.x,
          diagramData.fallback.lineThreeY,
          diagramData.fallback.lineThree,
          "fallback-copy"
        );

        fallbackText(
          diagramData.fallback.x,
          diagramData.fallback.lineFourY,
          diagramData.fallback.lineFour,
          "fallback-copy"
        );

        fallbackText(
          diagramData.fallback.x,
          diagramData.fallback.lineFiveY,
          diagramData.fallback.lineFive,
          "fallback-copy"
        );
      }
    }
  </script>
</body>
</html>
