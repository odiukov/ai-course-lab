<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Два эшелона защиты</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f7f8fc;
  --ink:#172033;
  --muted:#5b6578;
  --line:#63708a;
  --panel:#ffffff;
  --cai:#e7efff;
  --cai-line:#3569c8;
  --classifier:#e8f7f1;
  --classifier-line:#17845d;
  --danger:#fff0ee;
  --danger-line:#c94a40;
  --safe:#edf7e8;
  --safe-line:#4d8c35;
  --blocked:#fff2e2;
  --blocked-line:#b56818;
  --track:#dfe3eb;
  --old:#9b668f;
  --new:#16875f;
  --divider:#cbd1dc;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#101522;
    --ink:#f1f4fa;
    --muted:#b2bbcc;
    --line:#9aa7bf;
    --panel:#192131;
    --cai:#172b4d;
    --cai-line:#78a8ff;
    --classifier:#12352d;
    --classifier-line:#61d5aa;
    --danger:#3b2225;
    --danger-line:#ff8a80;
    --safe:#20351e;
    --safe-line:#91d477;
    --blocked:#3b2b19;
    --blocked-line:#efad58;
    --track:#30394a;
    --old:#d296c5;
    --new:#63d5aa;
    --divider:#465166;
  }
}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}
header{
  color:var(--ink);
  font-size:22px;
  font-weight:bold;
}
svg{
  display:block;
  width:100%;
  height:auto;
  max-height:440px;
  background:var(--bg);
}
.box{fill:var(--panel);stroke:var(--line);stroke-width:2px}
.danger{fill:var(--danger);stroke:var(--danger-line)}
.cai{fill:var(--cai);stroke:var(--cai-line)}
.classifier{fill:var(--classifier);stroke:var(--classifier-line)}
.safe{fill:var(--safe);stroke:var(--safe-line)}
.blocked{fill:var(--blocked);stroke:var(--blocked-line)}
.flow{fill:none;stroke:var(--line);stroke-width:3px}
.flow-cai{fill:none;stroke:var(--cai-line);stroke-width:3px}
.flow-classifier{fill:none;stroke:var(--classifier-line);stroke-width:3px}
.arrow-head{fill:var(--line)}
.arrow-cai{fill:var(--cai-line)}
.arrow-classifier{fill:var(--classifier-line)}
.icon-danger{fill:none;stroke:var(--danger-line);stroke-width:2px}
.icon-cai{fill:none;stroke:var(--cai-line);stroke-width:2px}
.icon-classifier{fill:none;stroke:var(--classifier-line);stroke-width:2px}
.icon-safe{fill:none;stroke:var(--safe-line);stroke-width:2px}
.divider{stroke:var(--divider);stroke-width:1px}
.track{fill:var(--track)}
.old-bar{fill:var(--old)}
.new-bar{fill:var(--new)}
text{fill:var(--ink);font-size:14px}
.kicker{font-size:12px;font-weight:bold}
.title{font-size:16px;font-weight:bold}
.body{font-size:13px}
.small{fill:var(--muted);font-size:12px}
.block-label{fill:var(--blocked-line);font-size:13px;font-weight:bold}
.chart-title{font-size:16px;font-weight:bold}
.value{font-size:16px;font-weight:bold}
#fallback{color:var(--ink);font-size:16px}
</style>
</head>
<body>
<header>Два эшелона защиты: CAI + классификатор</header>
<svg id="diagram" width="1000" height="440" viewBox="0 0 1000 440"
     preserveAspectRatio="xMidYMid meet" role="img"
     aria-labelledby="svg-title svg-desc">
  <title id="svg-title">CAI и классификатор образуют два эшелона защиты</title>
  <desc id="svg-desc">CAI формирует поведение модели, затем классификатор проверяет её выход. Ниже сопоставлены накладные расходы: v1 — 23,7 процента, v2 — около 1 процента.</desc>
</svg>
<div id="fallback" hidden>Схема должна была показать два эшелона: CAI формирует поведение модели, а классификатор проверяет готовый выход. Накладные расходы: v1 — 23,7%, v2 — около 1%.</div>
<script>
const DATA=[{
  origin:{x:0,y:0},
  scale:10,
  zero:0,
  radius:.7,
  head:.85,
  wing:.6,
  rects:[
    {x:3,y:7,w:15,h:18,c:"box danger"},
    {x:25,y:5,w:25,h:22,c:"box cai"},
    {x:57,y:5,w:23,h:22,c:"box classifier"},
    {x:87,y:9,w:10,h:14,c:"box safe"},
    {x:60,y:31,w:17,h:3.6,c:"box blocked"},
    {x:14,y:37.6,w:65,h:1.6,c:"track"},
    {x:14,y:40.8,w:65,h:1.6,c:"track"},
    {x:60.1,y:10.2,w:5.7,h:8.8,c:"icon-classifier"}
  ],
  lines:[
    {x1:3,y1:34.9,x2:97,y2:34.9,c:"divider"},
    {x1:62,y1:12.1,x2:64,y2:12.1,c:"icon-classifier"},
    {x1:62,y1:14.6,x2:64.7,y2:14.6,c:"icon-classifier"},
    {x1:62,y1:17.1,x2:63.7,y2:17.1,c:"icon-classifier"},
    {x1:6.2,y1:12.2,x2:6.2,y2:15.3,c:"icon-danger"}
  ],
  arrows:[
    {x1:18,y1:16,x2:25,y2:16,c:"flow",h:"arrow-head"},
    {x1:50,y1:16,x2:57,y2:16,c:"flow-cai",h:"arrow-cai"},
    {x1:80,y1:16,x2:87,y2:16,c:"flow-classifier",h:"arrow-classifier"},
    {x1:68.5,y1:27,x2:68.5,y2:31,c:"flow-classifier",h:"arrow-classifier"}
  ],
  polygons:[
    {c:"icon-danger",p:[
      {x:6.2,y:9.5},{x:9,y:13.6},{x:6.2,y:17.7},{x:3.4,y:13.6}
    ]},
    {c:"icon-cai",p:[
      {x:30.5,y:9.2},{x:34,y:10.5},{x:33.5,y:16.7},
      {x:30.5,y:20.2},{x:27.5,y:16.7},{x:27,y:10.5}
    ]}
  ],
  polylines:[
    {c:"icon-cai",p:[
      {x:28.8,y:14.2},{x:30.1,y:15.6},{x:32.6,y:12.7}
    ]},
    {c:"icon-classifier",p:[
      {x:61.8,y:21.2},{x:63.3,y:22.7},{x:66.1,y:19.8}
    ]},
    {c:"icon-safe",p:[
      {x:89.7,y:16.2},{x:91.4,y:18},{x:94.5,y:14.3}
    ]}
  ],
  circles:[
    {x:6.2,y:16.5,r:.18,c:"icon-danger"},
    {x:92.1,y:16.2,r:4,c:"icon-safe"}
  ],
  texts:[
    {x:4,y:21.1,a:"start",c:"title",s:"Запрос"},
    {x:4,y:23.5,a:"start",c:"body",s:"обычный или скрытый"},
    {x:26,y:3.2,a:"start",c:"kicker",s:"ПЕРВЫЙ ЭШЕЛОН"},
    {x:35.3,y:10.7,a:"start",c:"title",s:"CAI внутри модели"},
    {x:35.3,y:14.5,a:"start",c:"body",s:"распознаёт намерение"},
    {x:35.3,y:18,a:"start",c:"body",s:"формирует поведение"},
    {x:35.3,y:22.1,a:"start",c:"small",s:"останавливает до выхода"},
    {x:58,y:3.2,a:"start",c:"kicker",s:"ВТОРОЙ ЭШЕЛОН"},
    {x:67.1,y:10.7,a:"start",c:"title",s:"Классификатор"},
    {x:67.1,y:14.5,a:"start",c:"body",s:"читает готовый выход"},
    {x:67.1,y:18,a:"start",c:"body",s:"проверяет инвариант"},
    {x:67.1,y:22.1,a:"start",c:"small",s:"решает, выпускать ли"},
    {x:19,y:12.5,a:"start",c:"small",s:"намерение"},
    {x:51,y:12.5,a:"start",c:"small",s:"готовый выход"},
    {x:81,y:12.5,a:"start",c:"small",s:"разрешён"},
    {x:92,y:25.3,a:"middle",c:"small",s:"ответ наружу"},
    {x:68.5,y:32.8,a:"middle",c:"block-label",s:"Нарушение — блок"},
    {x:3,y:36.6,a:"start",c:"chart-title",s:"Накладные расходы классификатора"},
    {x:97,y:36.6,a:"end",c:"small",s:"дополнительные вычисления"},
    {x:3,y:38.4,a:"start",c:"value",s:"v1"},
    {x:82,y:38.4,a:"start",c:"value",s:"23,7%"},
    {x:3,y:41.6,a:"start",c:"value",s:"v2"},
    {x:82,y:41.6,a:"start",c:"value",s:"около 1%"}
  ],
  bar:{x:14,w:65,h:1.6},
  bars:[
    {y:37.6,value:23.7,c:"old-bar"},
    {y:40.8,value:1,c:"new-bar"}
  ]
}];

const diagram=DATA.find(Boolean);
const origin=diagram.origin;
const scale=diagram.scale;
const sx=x=>origin.x+x*scale;
const sy=y=>origin.y+y*scale;

try{
  const svg=document.getElementById("diagram");
  const ns="http://www.w3.org/2000/svg";

  const add=(name,attrs,cls)=>{
    const el=document.createElementNS(ns,name);
    for(const [key,value] of Object.entries(attrs)) el.setAttribute(key,value);
    if(cls) el.setAttribute("class",cls);
    svg.append(el);
    return el;
  };

  const rect=q=>add("rect",{
    x:sx(q.x),y:sy(q.y),
    width:sx(q.x+q.w)-sx(q.x),
    height:sy(q.y+q.h)-sy(q.y),
    rx:sx(diagram.radius)-sx(diagram.zero)
  },q.c);

  const line=q=>add("line",{
    x1:sx(q.x1),y1:sy(q.y1),x2:sx(q.x2),y2:sy(q.y2)
  },q.c);

  const points=q=>q.p.map(point=>`${sx(point.x)},${sy(point.y)}`).join(" ");

  for(const q of diagram.rects) rect(q);
  for(const q of diagram.lines) line(q);

  for(const q of diagram.arrows){
    line(q);
    const dx=q.x2-q.x1;
    const dy=q.y2-q.y1;
    const length=Math.hypot(dx,dy);
    const ux=dx/length;
    const uy=dy/length;
    const bx=q.x2-ux*diagram.head;
    const by=q.y2-uy*diagram.head;
    add("polygon",{points:points({p:[
      {x:q.x2,y:q.y2},
      {x:bx-uy*diagram.wing,y:by+ux*diagram.wing},
      {x:bx+uy*diagram.wing,y:by-ux*diagram.wing}
    ]})},q.h);
  }

  for(const q of diagram.polygons) add("polygon",{points:points(q)},q.c);
  for(const q of diagram.polylines) add("polyline",{points:points(q)},q.c);
  for(const q of diagram.circles) add("circle",{
    cx:sx(q.x),cy:sy(q.y),r:sx(q.r)-sx(diagram.zero)
  },q.c);

  const maximum=Math.max(...diagram.bars.map(bar=>bar.value));
  for(const bar of diagram.bars) rect({
    x:diagram.bar.x,y:bar.y,
    w:diagram.bar.w*(bar.value/maximum),
    h:diagram.bar.h,c:bar.c
  });

  for(const q of diagram.texts){
    const text=add("text",{
      x:sx(q.x),y:sy(q.y),
      "text-anchor":q.a,
      "dominant-baseline":"middle"
    },q.c);
    text.textContent=q.s;
  }
}catch(error){
  document.getElementById("diagram").setAttribute("hidden","");
  document.getElementById("fallback").removeAttribute("hidden");
}
</script>
</body>
</html>
