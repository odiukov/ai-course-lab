- concept: QR повышает численную надёжность наименьших квадратов за счёт ортогональных преобразований без формирования матрицы Грама
  question: Объясни своими словами, почему математически эквивалентные решения задачи наименьших квадратов через QR и нормальные уравнения могут иметь разную точность на компьютере.
  explanation: Математическая эквивалентность не гарантирует одинакового поведения в арифметике с конечной точностью. Нормальные уравнения ухудшают обусловленность через A^T A, а QR избегает этого промежуточного вычисления.
  kind: open
  reference: 'В точной арифметике оба метода приводят к тому же минимуму. Но нормальные уравнения формируют A^T A и тем самым усиливают плохую обусловленность. QR работает непосредственно с A: ортогональные преобразования сохраняют длины и углы, после чего остаётся решить верхнетреугольную систему. Поэтому ошибки округления обычно усиливаются меньше.'
