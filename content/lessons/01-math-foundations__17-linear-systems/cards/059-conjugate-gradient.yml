- concept: CG экономит память и вычисления на больших разреженных системах благодаря отказу от разложения
  question: Объясни своими словами, почему метод сопряжённых градиентов может быть выгоднее разложения Холецкого для очень большой разреженной SPD-системы.
  explanation: Разложение может потребовать больших затрат и породить дополнительные ненулевые элементы в факторах. CG работает через последовательность матрично-векторных произведений и поэтому способен непосредственно использовать разреженность A.
  kind: open
  reference: CG не строит и не хранит матричное разложение. Его итерации в основном используют умножение разреженной матрицы на вектор, при котором ненулевые элементы можно хранить и обрабатывать отдельно. Это существенно сокращает затраты памяти и вычислений.
  id: 059-conjugate-gradient-2
  fingerprint: a72b77a4
- concept: кластеризация собственных значений ускоряет сходимость метода сопряжённых градиентов
  question: Как расположение собственных значений SPD-матрицы влияет на практическую скорость сходимости CG?
  explanation: Сходимость CG связана со спектром матрицы. Небольшое число обусловленности и плотные группы собственных значений обычно позволяют получить требуемую точность за меньшее число итераций.
  kind: cloze
  template: При прочих равных CG обычно сходится быстрее, когда собственные значения матрицы A ___.
  answer: сгруппированы
  accept:
    - кластеризованы
    - образуют плотные группы
    - близки друг к другу
  id: 059-conjugate-gradient-3
