- concept: нормальные уравнения практичны для переопределённой линейной регрессии с небольшим числом параметров
  question: В какой ситуации нормальные уравнения могут быть разумным способом решить задачу линейной регрессии?
  explanation: Нормальные уравнения сводят переопределённую задачу к квадратной системе по числу параметров. При малом числе параметров это удобно, но для чувствительных задач обычно предпочитают более устойчивые QR или SVD.
  kind: open
  reference: Когда система переопределена, число параметров невелико, а обусловленность матрицы не создаёт серьёзных численных проблем.
