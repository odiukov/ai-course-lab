- concept: прямая подстановка для плотной нижнетреугольной матрицы имеет квадратичную вычислительную сложность
  question: Как растёт число арифметических операций при решении плотной нижнетреугольной системы размера n × n прямой подстановкой?
  explanation: В каждой следующей строке учитывается всё больше ранее найденных компонент. Суммарное число таких операций образует возрастающую арифметическую сумму и растёт квадратично относительно размера системы.
