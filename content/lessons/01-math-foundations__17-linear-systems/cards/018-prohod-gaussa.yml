- concept: структурный признак верхнетреугольной матрицы
  question: После прямого хода метода Гаусса матрица коэффициентов стала верхнетреугольной матрицей U. Какое свойство она обязательно имеет?
  explanation: Прямой ход последовательно устраняет коэффициенты под опорными элементами. Поэтому в U ниже главной диагонали находятся нули, тогда как элементы на диагонали и над ней могут быть ненулевыми.
  kind: choice
  options:
    - Все элементы ниже главной диагонали равны нулю
    - Все элементы выше главной диагонали равны нулю
    - Все внедиагональные элементы равны нулю
    - Все диагональные элементы равны друг другу
  correct: 0
  id: 018-prohod-gaussa-1
  fingerprint: 5864297a
- concept: сохранение нулей в уже обработанных столбцах при прямом ходе
  question: Объясни, почему исключение элементов в очередном опорном столбце не восстанавливает ненулевые элементы под диагональю в ранее обработанных столбцах.
  explanation: После обработки столбца все допустимые нижние строки имеют в нём нулевые коэффициенты. Последующие преобразования используют строки, в которых ранее обработанная часть также нулевая, поэтому уже созданная треугольная структура сохраняется.
  kind: open
  reference: У текущей опорной строки в ранее обработанных столбцах уже стоят нули. Поэтому вычитание её кратного из нижних строк не изменяет находящиеся там нули.
  id: 018-prohod-gaussa-2
  fingerprint: 155c4765
