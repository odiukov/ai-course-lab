- concept: ведущая вычислительная сложность QR-разложения высокой матрицы
  question: Заполни пропуск в оценке вычислительной стоимости QR-разложения.
  explanation: QR-разложение высокой матрицы требует O(mn²) операций. Такая же ведущая асимптотика указана для SVD, хотя константы и предоставляемые этими методами возможности различаются.
  kind: cloze
  template: Для A ∈ R^(m×n), где m ≥ n, стоимость QR-разложения составляет ___.
  answer: O(mn²)
  accept:
    - O(mn^2)
    - O(m*n^2)
    - O(m n^2)
