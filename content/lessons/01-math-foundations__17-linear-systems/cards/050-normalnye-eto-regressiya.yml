- concept: добавление λI в ridge-регрессии улучшает обусловленность и сдерживает рост весов
  question: Объясни своими словами, какие две задачи решает добавление λI к матрице XᵀX в ridge-регрессии.
  explanation: Добавка λI поднимает слишком малые собственные значения матрицы и делает решение менее чувствительным к численным ошибкам. Соответствующий штраф за крупные коэффициенты сдерживает веса и снижает риск переобучения.
  kind: open
  reference: При положительном λ диагональная добавка улучшает обусловленность системы и одновременно ужимает веса к нулю, что помогает уменьшить переобучение.
