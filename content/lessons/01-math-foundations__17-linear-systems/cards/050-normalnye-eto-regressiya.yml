- concept: QR и SVD могут решать ту же задачу линейной регрессии без явного обращения матрицы
  question: Библиотека вычисляет веса линейной регрессии через QR-разложение, не обращая XᵀX явно. Почему это по-прежнему решение той же модели?
  explanation: Формула через обратную матрицу описывает решение математически, но не предписывает алгоритм вычисления. QR или SVD могут найти минимум той же квадратичной ошибки более надёжным способом.
  kind: choice
  options:
    - QR решает ту же задачу минимизации ‖Xw − y‖², а явная обратная матрица не обязательна
    - QR заменяет сумму квадратов ошибок суммой модулей ошибок
    - QR автоматически добавляет к модели ridge-регуляризацию
    - QR меняет целевые значения y так, чтобы система стала совместной
