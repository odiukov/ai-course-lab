- concept: кубическая стоимость прямого хода возникает из суммирования площадей уменьшающихся рабочих подматриц
  question: Какое рассуждение объясняет кубическую асимптотику прямого хода Гаусса для плотной квадратной матрицы?
  explanation: После выбора очередного опорного столбца нужно обновить множество строк и коэффициентов в каждой строке. Поэтому этапы стоят примерно n², (n−1)² и далее, а их сумма имеет порядок n³. Обратная подстановка стоит лишь O(n²) и не меняет итоговую сложность.
  kind: choice
  options:
    - На каждом этапе обновляется двумерная рабочая подматрица, а суммарная стоимость всех уменьшающихся подматриц растёт кубически
    - На каждом этапе изменяются только элементы главной диагонали, поэтому число операций растёт линейно
    - Каждый элемент матрицы обрабатывается ровно один раз, поэтому стоимость растёт квадратично
