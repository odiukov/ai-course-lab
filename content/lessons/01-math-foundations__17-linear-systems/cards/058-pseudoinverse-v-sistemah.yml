- concept: псевдообратная Мура — Пенроуза существует для матрицы любой формы и ранга
  question: Для какой матрицы определена псевдообратная Мура — Пенроуза?
  explanation: Псевдообратная определена для любой квадратной или прямоугольной матрицы, в том числе вырожденной. Поэтому выражение x = A⁺b применимо независимо от формы и ранга A.
  kind: choice
  options:
    - Только для квадратной матрицы с ненулевым определителем
    - Только для прямоугольной матрицы полного ранга
    - Только для симметричной матрицы
    - Для любой матрицы
  correct: 3
  id: 058-pseudoinverse-v-sistemah-1
  fingerprint: 124689ef
- concept: псевдообратная меняет местами размерности матрицы
  question: Заполни пропуск в формуле размерности псевдообратной.
  explanation: Если A переводит векторы из пространства параметров размерности n в пространство результатов размерности m, то A⁺ действует в обратном направлении и имеет размерность n×m.
  kind: cloze
  template: A ∈ ℝ^(m×n) ⟹ A⁺ ∈ ___
  answer: ℝ^(n×m)
  accept:
    - R^(n×m)
    - n×m
    - n x m
  id: 058-pseudoinverse-v-sistemah-2
  fingerprint: 6ef22ebe
- concept: для квадратной невырожденной матрицы псевдообратная совпадает с обычной обратной
  question: Объясни своими словами, как связаны A⁺ и A⁻¹, если A квадратна и невырождена.
  explanation: У невырожденной квадратной матрицы все сингулярные числа ненулевые. Их обращение в формуле псевдообратной даёт ту же матрицу, что и обычное обращение A.
  kind: open
  reference: 'В этом случае псевдообратная совпадает с обычной обратной: A⁺ = A⁻¹. Поэтому x = A⁺b возвращает единственное точное решение системы.'
  id: 058-pseudoinverse-v-sistemah-3
  fingerprint: 99be8d34
