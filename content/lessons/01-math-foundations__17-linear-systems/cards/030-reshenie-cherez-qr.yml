- concept: компоненты Q^T b являются скалярными произведениями b со столбцами Q
  question: Столбцы ортогональной матрицы Q равны (3/5, 4/5)^T и (-4/5, 3/5)^T, а b = (7, 1)^T. Чему равна нижняя компонента вектора Q^T b?
  explanation: 'Нижняя компонента Q^Tb равна скалярному произведению второго столбца Q с b: (-4/5)·7 + (3/5)·1 = -25/5 = -5.'
  kind: numeric
  answer: -5
  tolerance: 0.001
