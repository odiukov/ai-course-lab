- concept: изменение правой части при фиксированных коэффициентах параллельно сдвигает гиперплоскость
  question: В уравнении aᵀx = c вектор a фиксирован и ненулевой. Как изменится множество решений, если заменить c на другое значение?
  explanation: Вектор коэффициентов определяет ориентацию гиперплоскости, а правая часть — её положение. Поэтому изменение только правой части даёт параллельный сдвиг.
  kind: open
  reference: Ориентация гиперплоскости не изменится, потому что её нормаль a останется прежней. Гиперплоскость параллельно сдвинется; при разных значениях c получатся разные непересекающиеся гиперплоскости.
