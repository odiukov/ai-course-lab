- concept: вектор коэффициентов линейного уравнения перпендикулярен гиперплоскости решений
  question: Какую геометрическую роль играет вектор коэффициентов линейного уравнения?
  explanation: Если две точки принадлежат гиперплоскости, скалярное произведение вектора a с их разностью равно нулю. Значит, a ортогонален всем направлениям внутри гиперплоскости и является её нормалью.
