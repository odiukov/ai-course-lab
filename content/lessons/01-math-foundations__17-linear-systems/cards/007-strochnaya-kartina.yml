- concept: каждая строка матричного уравнения задаёт отдельное скалярное уравнение
  question: Какое скалярное условие задаёт последняя строка матричного уравнения?
  explanation: При умножении матрицы на вектор последняя строка \((8,9)\) даёт скалярное произведение \(8u+9v\). Оно должно совпасть с соответствующей компонентой вектора \(b\), то есть с \(11\).
  kind: cloze
  template: 'Если \(A=\begin{pmatrix}6&-7\\8&9\end{pmatrix}\), \(z=\begin{pmatrix}u\\v\end{pmatrix}\) и \(b=\begin{pmatrix}10\\11\end{pmatrix}\), то последняя строка условия \(Az=b\) имеет вид: ___'
  answer: 8u + 9v = 11
  accept:
    - 8u+9v=11
    - 8*u+9*v=11
    - 9v+8u=11
  id: 007-strochnaya-kartina-1
  fingerprint: b1943684
- concept: решение системы принадлежит пересечению множеств решений всех её уравнений
  question: Какая точка является решением системы \(6u+8v=114\) и \(10u-7v=7\)?
  explanation: 'Для точки \((7,9)\) выполнены оба условия: \(6\cdot7+8\cdot9=114\) и \(10\cdot7-7\cdot9=7\). Остальные точки не проходят одновременно обе проверки.'
  kind: choice
  options:
    - \((u,v)=(7,9)\)
    - \((u,v)=(9,7)\)
    - \((u,v)=(8,8)\)
  correct: 0
  id: 007-strochnaya-kartina-2
