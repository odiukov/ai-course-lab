- concept: погрешность опорной строки масштабируется модулем множителя исключения
  question: Заполни пропуск в формуле распространения погрешности при исключении.
  explanation: Вся опорная строка, включая её погрешность, умножается на m. Поэтому множитель 1000 раздувает погрешность во столько же раз, тогда как множитель 0.001 подавляет её.
  kind: cloze
  template: Если опорная строка содержит погрешность δ, то при операции Rⱼ ← Rⱼ − mRᵢ её вклад в погрешность обновлённой строки по модулю составляет примерно ___.
  answer: '|m|δ'
  accept:
    - '|m|·δ'
    - abs(m) * δ
    - δ|m|
  id: 020-perestanovka-strok-2
