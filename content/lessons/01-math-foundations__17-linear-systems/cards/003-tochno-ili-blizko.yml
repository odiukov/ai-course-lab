- concept: точное решение характеризуется нулевой невязкой
  question: Для некоторого x_* вычислена невязка r = Ax_* − b. Какое условие означает, что x_* является точным решением системы?
  explanation: Точное решение удовлетворяет равенству Ax_* = b, поэтому Ax_* − b равно нулевому вектору. Минимальная, но ненулевая невязка соответствует лишь лучшему приближению.
  kind: choice
  options:
    - r — нулевой вектор
    - r минимальна среди проверенных невязок, но не равна нулю
    - x_* близок к начальному приближению
  correct: 0
  id: 003-tochno-ili-blizko-1
  fingerprint: f71b5678
- concept: качество приближённого решения оценивается по согласованию Ax с b
  question: Для кандидатов x_p и x_q при выбранном способе измерения выполняется ‖Ax_p − b‖ < ‖Ax_q − b‖. Какой вывод верен?
  explanation: Приближённые решения сравнивают по их невязкам Ax − b. Меньшая невязка означает лучшее согласование результата с известным b, но ничего не гарантирует о расстоянии до неизвестного истинного x.
  kind: choice
  options:
    - x_p даёт лучшее приближение к b по выбранному критерию
    - x_p обязательно ближе к неизвестному истинному вектору параметров
    - x_q является точным решением системы
  correct: 0
  id: 003-tochno-ili-blizko-2
  fingerprint: 85975db7
- concept: лучшее приближение зависит от способа измерения невязки
  question: Почему для системы без точного решения недостаточно потребовать просто «найти x с наименьшей невязкой»?
  explanation: Невязка является вектором, а векторы нельзя однозначно сравнить по размеру без выбранного критерия. Поэтому определение лучшего приближения всегда включает норму или функцию потерь.
  kind: open
  reference: Нужно указать норму или другую функцию потерь для Ax − b. Разные способы измерения размера невязки могут по-разному упорядочить кандидатов и выбрать разные приближённые решения.
  id: 003-tochno-ili-blizko-3
  fingerprint: 7dd98aa8
