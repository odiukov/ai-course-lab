- concept: транспонированная матрица переводит невязки в пространство параметров
  question: Заполни пропуск в выражении для вклада невязок в градиент по x.
  explanation: Вектор r содержит невязки отдельных уравнений, а умножение на A^T собирает их взвешенное влияние для каждого компонента x.
  kind: cloze
  template: Если r = Ax - b, то градиент суммы квадратов невязок пропорционален ___.
  answer: A^T r
  accept:
    - Aᵀr
    - A.T @ r
