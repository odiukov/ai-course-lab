- concept: постоянный относительно параметров член не влияет на градиент
  question: Объясни своими словами, почему член b^T b исчезает при выводе нормальных уравнений дифференцированием по x.
  explanation: При оптимизации изменяется только x. Поскольку b^T b остаётся постоянным при любых изменениях x, этот член не влияет ни на градиент, ни на положение минимума.
