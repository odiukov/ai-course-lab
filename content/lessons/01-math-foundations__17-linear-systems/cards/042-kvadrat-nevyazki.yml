- concept: возведение невязок в квадрат предотвращает взаимное погашение ошибок противоположных знаков
  question: Почему в методе наименьших квадратов нельзя заменить сумму квадратов невязок обычной суммой невязок?
  explanation: Например, невязки +2 и -2 дают обычную сумму 0, хотя обе ошибки ненулевые. Их квадраты дают положительные вклады, поэтому ни одна из ошибок не исчезает из целевой функции.
  kind: choice
  options:
    - Обычная сумма всегда имеет отрицательное значение
    - Невязки противоположных знаков могут взаимно погаситься, скрыв ошибки модели
    - Обычная сумма не определена для переопределённых систем
