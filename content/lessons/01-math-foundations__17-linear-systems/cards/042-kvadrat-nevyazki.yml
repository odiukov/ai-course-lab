- concept: квадратичная целевая функция непропорционально сильно штрафует крупные невязки
  question: Объясни своими словами, почему сумма квадратов невязок сильнее реагирует на крупные промахи, чем сумма их модулей.
  explanation: Квадрат быстро растёт вместе с модулем невязки. Поэтому вариант с несколькими небольшими ошибками может получить меньшую целевую функцию, чем вариант с одним или несколькими крупными промахами.
  kind: open
