- concept: диагональный элемент множителя Холецкого равен корню из остатка после вычитания квадратов ранее найденных элементов строки
  question: Восстанови формулу вычисления диагонального элемента матрицы L в разложении Холецкого.
  explanation: На диагонали из A[k, k] вычитают сумму квадратов уже вычисленных элементов той же строки. Оператор @ вычисляет эту сумму как скалярное произведение префикса строки с самим собой.
  kind: cloze
  template: L[k, k] = np.sqrt(A[k, k] - ___)
  answer: L[k, :k] @ L[k, :k]
  accept:
    - np.dot(L[k, :k], L[k, :k])
    - sum(L[k, :k] ** 2)
    - np.sum(L[k, :k] ** 2)
  id: 036-code-cholesky-1
  fingerprint: 2a946fc3
- concept: неположительный диагональный остаток требует остановки вещественного алгоритма Холецкого
  question: При вычислении диагонального элемента разложения Холецкого скорректированный остаток оказался равен нулю. Как должна поступить реализация, рассчитанная на положительно определённые матрицы?
  explanation: Диагональный остаток должен быть строго положительным. Нулевое или отрицательное значение не позволяет получить допустимый положительный диагональный элемент и может привести к делению на ноль или nan в следующих вычислениях.
  kind: choice
  options:
    - Записать на диагональ ноль и продолжить без изменений
    - Остановиться и сообщить, что матрица не является положительно определённой
    - Заменить остаток небольшим положительным значением
    - Вычислить внедиагональный элемент вместо диагонального
  correct: 1
  id: 036-code-cholesky-2
  fingerprint: 34f40b3f
