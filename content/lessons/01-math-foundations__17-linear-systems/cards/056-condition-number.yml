- concept: число обусловленности оценивает усиление относительной погрешности входных данных в решении
  question: Для невырожденной системы Ax = b число обусловленности матрицы равно 30. Правая часть b задана с относительной погрешностью 0.02%. Какой относительной погрешности решения в процентах можно ожидать в наиболее неблагоприятном направлении? Используй оценку первого порядка.
  explanation: 'В первом приближении относительная погрешность решения может быть усилена примерно в κ(A) раз: 30 · 0.02% = 0.6%. Это оценка возможного усиления, а не гарантия того, что ошибка обязательно окажется такой большой.'
  kind: numeric
  answer: 0.6
  tolerance: 0.02
  id: 056-condition-number-1
  fingerprint: 4a07129e
- concept: равномерное ненулевое масштабирование матрицы не меняет её спектральное число обусловленности
  question: Матрицу A заменили на 7A. Объясни, почему её спектральное число обусловленности не изменится.
  explanation: 'У матрицы 7A сингулярные числа равны 7σᵢ. Общий множитель сокращается: κ(7A) = (7σmax)/(7σmin) = κ(A). Масштаб значений матрицы сам по себе не определяет её чувствительность.'
  kind: open
  reference: При умножении матрицы на 7 каждое её сингулярное число умножается на 7. Поэтому отношение наибольшего сингулярного числа к наименьшему остаётся прежним.
  id: 056-condition-number-2
  fingerprint: 44ac9341
