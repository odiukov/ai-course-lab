- concept: формула вычисления компоненты решения нижнетреугольной системы
  question: Заполни пропуск в формуле прямой подстановки для системы Ly = b.
  explanation: Сначала из b[i] вычитается вклад уже найденных компонент, а остаток делится на коэффициент при текущей неизвестной — диагональный элемент L[i, i].
  kind: cloze
  template: y[i] = (b[i] - L[i, :i] @ y[:i]) / ___
  answer: L[i, i]
  accept:
    - L[i,i]
    - L[i][i]
  id: 017-code-forward-substitution-1
  fingerprint: 6654719e
- concept: сведение решения системы с LU-разложением к двум треугольным системам
  question: Пусть A = LU и введён промежуточный вектор y = Ux. Какую систему нужно решить прямой подстановкой?
  explanation: Из Ax = b и A = LU следует LUx = b. Поскольку y = Ux, сначала решается нижнетреугольная система Ly = b, а затем верхнетреугольная система Ux = y.
  kind: choice
  options:
    - Uy = b
    - Ly = b
    - Lx = y
    - Ux = b
  correct: 1
  id: 017-code-forward-substitution-2
  fingerprint: 0d0a1082
