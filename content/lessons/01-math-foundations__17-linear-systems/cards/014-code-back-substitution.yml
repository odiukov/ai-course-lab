- concept: единственность обратной подстановки требует ненулевых диагональных элементов
  question: Какое условие гарантирует, что обычная обратная подстановка для квадратной верхнетреугольной системы сможет однозначно вычислить каждую неизвестную?
  explanation: 'На каждом шаге остаток делят на диагональный элемент U[i][i]. Если такой элемент равен нулю, деление невозможно, а треугольная матрица вырождена: система не может иметь единственное решение.'
  kind: choice
  options:
    - Все элементы главной диагонали ненулевые
    - Все элементы выше главной диагонали положительные
    - Сумма элементов каждой строки совпадает с соответствующей правой частью
    - Матрица является симметричной
