- concept: решение задачи наименьших квадратов через SVD вычисляется с помощью псевдообратной матрицы сингулярных значений
  question: Пусть X = UΣVᵀ. Вставь пропущенный множитель в формулу SVD-решения задачи наименьших квадратов.
  explanation: Псевдообратная матрица X⁺ имеет вид VΣ⁺Uᵀ, поэтому w = X⁺y = VΣ⁺Uᵀy. В Σ⁺ ненулевые сингулярные значения заменяются обратными с учётом выбранного порога.
