- concept: прибавление кратной одной строки к другой является обратимым преобразованием и сохраняет множество решений
  question: Почему замена уравнения L_q = r_q на L_q - λL_p = r_q - λr_p при сохранении уравнения L_p = r_p не меняет множество решений системы?
  explanation: 'Строковая операция обратима: после вычитания кратной опорной строки исходную строку можно получить обратным сложением. Поэтому старая и новая системы эквивалентны.'
  kind: open
  reference: Каждое решение исходной системы удовлетворяет разности уравнений. Обратно, из преобразованного уравнения можно восстановить исходное, прибавив λ-кратное сохранённого уравнения, поэтому преобразование не добавляет и не теряет решений.
  id: 012-isklyuchenie-peremennyh-1
  fingerprint: '27911828'
- concept: множитель исключения равен отношению устраняемого коэффициента к опорному
  question: В опорной строке коэффициент при выбранной переменной равен 7, а в строке ниже — 35. Какой множитель m нужно использовать в операции R_i ← R_i − mR_k, чтобы устранить эту переменную из нижней строки?
  explanation: 'Множитель равен отношению коэффициентов: m = 35 / 7 = 5. После операции новый коэффициент равен 35 − 5 · 7 = 0.'
  kind: numeric
  answer: 5
  tolerance: 0.01
  id: 012-isklyuchenie-peremennyh-2
  fingerprint: dc49aa47
- concept: метод Гаусса сначала строит верхнетреугольную систему, а затем выполняет обратную подстановку
  question: Расположи основные действия метода Гаусса в правильном порядке.
  explanation: Прямой ход последовательно обнуляет коэффициенты под опорными элементами. Когда система становится верхнетреугольной, неизвестные находят снизу вверх обратной подстановкой.
  kind: order
  items:
    - Выбрать опорный элемент текущего столбца и при необходимости переставить строки
    - Вычесть подходящие кратные опорной строки из строк ниже
    - Перейти к следующему столбцу и повторять исключение до получения верхнетреугольной системы
    - Найти неизвестные обратной подстановкой, начиная с последнего уравнения
