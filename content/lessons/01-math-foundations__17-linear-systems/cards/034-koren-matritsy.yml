- concept: элемент матрицы LLᵀ вычисляется как скалярное произведение соответствующих строк L
  question: У нижнетреугольной матрицы L верхний диагональный элемент равен 6, нижний левый — 7, а нижний диагональный — 8. Чему равен верхний правый элемент матрицы A = LLᵀ?
  explanation: Верхний правый элемент равен скалярному произведению верхней и нижней строк L. Верхняя строка имеет нулевой второй элемент, поэтому получаем 6 · 7 = 42.
  kind: numeric
  answer: 42
  tolerance: 0.01
