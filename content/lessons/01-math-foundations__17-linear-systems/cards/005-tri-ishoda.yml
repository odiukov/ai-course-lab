- concept: число решений системы определяется взаимным расположением задаваемых уравнениями прямых
  question: |-
    Сопоставьте системы с числом их решений:
    A: 7x + 9y = 13; 14x + 18y = 26
    B: 7x + 9y = 13; 14x + 18y = 29
    C: 7x + 9y = 13; 8x − 3y = 6
  explanation: 'В A второе уравнение получается удвоением первого, поэтому прямые совпадают. В B левые части пропорциональны, но удвоение правой части дало бы 26, а не 29: прямые параллельны и различны. В C коэффициенты не пропорциональны, поэтому прямые пересекаются в одной точке.'
  kind: choice
  options:
    - A — бесконечно много, B — ни одного, C — одно
    - A — одно, B — бесконечно много, C — ни одного
    - A — ни одного, B — одно, C — бесконечно много
  correct: 0
  id: 005-tri-ishoda-1
  fingerprint: febc8cf6
- concept: ненулевой вектор ядра порождает бесконечное семейство решений совместной системы
  question: Пусть x₀ — решение системы Ax = b, а ненулевой вектор v принадлежит ядру A. Объясните, почему у системы бесконечно много решений.
  explanation: Ядро задаёт направления, движение вдоль которых не меняет произведение Ax. Поэтому к одному решению можно прибавить любое кратное ненулевого вектора ядра и получить бесконечное множество решений.
  kind: open
  reference: 'Для любого скаляра t вектор x₀ + tv также является решением: A(x₀ + tv) = Ax₀ + tAv = b. Поскольку v ненулевой, разные значения t дают разные решения.'
  id: 005-tri-ishoda-2
  fingerprint: f12fe2fc
