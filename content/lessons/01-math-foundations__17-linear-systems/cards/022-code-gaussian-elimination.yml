- concept: элементарное преобразование строки должно охватывать и коэффициенты, и правую часть расширенной матрицы
  question: Заполни пропуск так, чтобы исключение обновляло строку расширенной матрицы вместе с правой частью.
  explanation: Срез ведущей строки должен начинаться со столбца `k` и доходить до конца `Ab`. Тогда та же строковая операция применяется к последнему столбцу с правой частью, и преобразованная система остаётся эквивалентной исходной.
