- concept: катастрофическая потеря значащих цифр при вычитании больших близких чисел
  question: Почему вычитание двух больших и почти равных чисел после исключения с маленьким ведущим элементом может резко ухудшить точность решения?
  explanation: Маленький pivot порождает большой множитель и усиливает ошибки представления чисел. При последующем сокращении близких величин точные старшие разряды исчезают, а относительная доля ошибки возрастает.
  kind: open
  reference: Старшие значащие цифры почти полностью сокращаются, поэтому в результате остаются младшие разряды, сильнее затронутые округлением. Большой множитель исключения предварительно усиливает эти погрешности.
  id: 019-opasnyy-pivot-2
  fingerprint: 2acb247d
