- concept: компоненты вектора x являются коэффициентами соответствующих столбцов в линейной комбинации Ax
  question: Матрица A состоит из столбцов u = [3, 4]ᵀ и v = [6, −3]ᵀ, а x = [3, −4]ᵀ. Чему равно Ax?
