- concept: верхнетреугольная форма R следует из последовательного построения ортонормированных направлений
  question: В QR-разложении методом Грама — Шмидта столбец с индексом j выражается только через направления q_i с i ≤ j. Как это отражается на матрице R?
  explanation: В столбце j матрицы R ненулевыми могут быть лишь коэффициенты при q_i с i ≤ j. Поэтому позиции с i > j, расположенные ниже главной диагонали, заполнены нулями.
  kind: choice
  options:
    - Все элементы ниже главной диагонали равны нулю
    - Все элементы выше главной диагонали равны нулю
    - Все внедиагональные элементы равны нулю
    - Матрица R становится симметричной
  correct: 0
  id: 029-qr-iz-gram-schmidt-1
  fingerprint: d708ba26
- concept: ортонормированность Q позволяет извлечь R умножением на Q^T
  question: Заполни пропуск в формуле для вычисления матрицы коэффициентов R.
  explanation: Умножение A = QR слева на Q^T даёт Q^TA = Q^TQR = IR = R. Обращать Q для этого не требуется.
  kind: cloze
  template: Если A = QR и Q^TQ = I, то R = ___.
  answer: Q^T A
  accept:
    - Q^T A
    - QᵀA
    - Qᵀ A
    - Q.T @ A
  id: 029-qr-iz-gram-schmidt-2
  fingerprint: 08044aa8
- concept: коэффициент R равен скалярной проекции исходного столбца на соответствующий столбец Q
  question: Ортонормированный столбец Q равен q = (0.6, 0.8), а исходный столбец матрицы A равен a = (7, 9). Чему равен коэффициент R при направлении q в разложении столбца a?
  explanation: 'Коэффициент вычисляется скалярным произведением q^Ta: 0.6 · 7 + 0.8 · 9 = 11.4.'
  kind: numeric
  answer: 11.4
  tolerance: 0.001
  id: 029-qr-iz-gram-schmidt-3
  fingerprint: ccd804de
