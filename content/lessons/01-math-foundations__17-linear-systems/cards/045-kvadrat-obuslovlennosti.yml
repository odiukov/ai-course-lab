- concept: почти линейная зависимость признаков создаёт направление параметров, которое слабо влияет на предсказания, но допускает большие изменения коэффициентов
  question: Объясни своими словами, почему почти линейно зависимые столбцы матрицы признаков могут приводить к сильно меняющимся коэффициентам модели при почти неизменных предсказаниях.
  explanation: Такому направлению соответствует малое сингулярное число. Матрица плохо различает изменения параметров вдоль него, а переход к AᵀA дополнительно уменьшает относительный вес этого направления.
  kind: open
  reference: Почти линейная зависимость означает, что существует направление d, для которого Ad близко к нулю. Поэтому заметное изменение коэффициентов вдоль d лишь слабо меняет Ax. Небольшое возмущение данных может выбрать совсем другой набор коэффициентов с почти теми же предсказаниями.
  id: 045-kvadrat-obuslovlennosti-2
