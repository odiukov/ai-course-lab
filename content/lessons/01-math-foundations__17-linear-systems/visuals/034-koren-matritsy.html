<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Разложение A = LLᵀ</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f4ed;
      --panel: #fffdf8;
      --panel-strong: #f1eadc;
      --ink: #27231f;
      --muted: #6b6258;
      --line: #453f38;
      --accent: #167c80;
      --accent-soft: #d9eeee;
      --mirror: #a94e72;
      --mirror-soft: #f3dce5;
      --same: #e9c75d;
      --same-soft: #fff1ba;
      --zero: #ddd8ce;
      --shadow: #c9c0b2;
      background: var(--page);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    main {
      width: 100%;
      background: var(--page);
    }

    h1 {
      margin: 0;
      padding: 12px 18px 8px;
      font-size: 22px;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: 390px;
      max-height: 520px;
      background: var(--page);
    }

    .card,
    .check-panel {
      fill: var(--panel);
      stroke: var(--shadow);
      stroke-width: 2px;
    }

    .check-panel {
      fill: var(--panel-strong);
    }

    .cell {
      stroke: var(--shadow);
      stroke-width: 1px;
    }

    .cell-base {
      fill: var(--panel);
    }

    .cell-lower {
      fill: var(--accent-soft);
      stroke: var(--accent);
    }

    .cell-upper {
      fill: var(--mirror-soft);
      stroke: var(--mirror);
    }

    .cell-same {
      fill: var(--same-soft);
      stroke: var(--same);
    }

    .cell-zero {
      fill: var(--zero);
      stroke: var(--shadow);
    }

    .matrix-bracket {
      fill: none;
      stroke: var(--line);
      stroke-width: 3px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arrow,
    .arrow-head,
    .divider {
      fill: none;
      stroke: var(--mirror);
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .divider {
      stroke: var(--shadow);
    }

    text {
      fill: var(--ink);
    }

    .card-title {
      font-size: 18px;
      font-weight: bold;
    }

    .card-subtitle,
    .arrow-label,
    .check-label,
    .legend {
      font-size: 16px;
      fill: var(--muted);
    }

    .entry {
      font-size: 28px;
      font-weight: bold;
    }

    .operator {
      font-size: 36px;
      font-weight: bold;
    }

    .formula {
      font-size: 21px;
      font-weight: bold;
    }

    .check-value {
      font-size: 20px;
      font-weight: bold;
    }

    .accent-text {
      fill: var(--accent);
    }

    .mirror-text {
      fill: var(--mirror);
    }

    .fallback {
      margin: 0;
      padding: 18px;
      font-size: 18px;
      text-align: center;
      background: var(--panel);
      color: var(--ink);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #17191d;
        --panel: #22262c;
        --panel-strong: #292d34;
        --ink: #f2eee7;
        --muted: #bbb4aa;
        --line: #ded8cf;
        --accent: #6fd0d0;
        --accent-soft: #173f42;
        --mirror: #ec8eb4;
        --mirror-soft: #4b2637;
        --same: #e8c65f;
        --same-soft: #4b4020;
        --zero: #353940;
        --shadow: #555b64;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Матричный квадратный корень: A = LLᵀ</h1>
    <svg
      id="diagram"
      viewBox="0 0 1200 390"
      width="1200"
      height="390"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-title diagram-desc">
      <title id="diagram-title">Разложение матрицы A в L и L транспонированную</title>
      <desc id="diagram-desc">
        Матрица четыре, два, два, пять равна произведению нижнетреугольной
        матрицы два, ноль, один, два и её транспонированной копии.
      </desc>
    </svg>
    <p id="fallback" class="fallback" hidden>
      Схема должна была показать:
      [[4, 2], [2, 5]] = [[2, 0], [1, 2]] · [[2, 1], [0, 2]].
    </p>
  </main>

  <script>
    const diagramData = {
      canvas: { width: 1200, height: 390 },
      zero: 0,
      radius: 14,
      cards: [
        {
          kind: "A",
          x: 24, y: 66, width: 318, height: 194,
          title: "Исходная симметричная A",
          subtitle: "обе стороны диагонали совпадают",
          titleAnchor: { x: 183, y: 91 },
          subtitleAnchor: { x: 183, y: 239 },
          matrix: [[4, 2], [2, 5]],
          matrixLayout: {
            firstX: 153, firstY: 144,
            gapX: 68, gapY: 58,
            halfWidth: 27, halfHeight: 23,
            leftBracket: 103, rightBracket: 263,
            top: 115, bottom: 211, hook: 13
          }
        },
        {
          kind: "L",
          x: 414, y: 66, width: 276, height: 194,
          title: "Нижняя половина L",
          subtitle: "ноль выше диагонали",
          titleAnchor: { x: 552, y: 91 },
          subtitleAnchor: { x: 552, y: 239 },
          matrix: [[2, 0], [1, 2]],
          matrixLayout: {
            firstX: 522, firstY: 144,
            gapX: 62, gapY: 58,
            halfWidth: 25, halfHeight: 23,
            leftBracket: 476, rightBracket: 628,
            top: 115, bottom: 211, hook: 13
          }
        },
        {
          kind: "LT",
          x: 786, y: 66, width: 390, height: 194,
          title: "Отражённая копия Lᵀ",
          subtitle: "тот же шаблон, развёрнутый по диагонали",
          titleAnchor: { x: 981, y: 91 },
          subtitleAnchor: { x: 981, y: 239 },
          matrix: [[2, 1], [0, 2]],
          matrixLayout: {
            firstX: 951, firstY: 144,
            gapX: 68, gapY: 58,
            halfWidth: 27, halfHeight: 23,
            leftBracket: 901, rightBracket: 1061,
            top: 115, bottom: 211, hook: 13
          }
        }
      ],
      operators: [
        { text: "=", x: 378, y: 171 },
        { text: "×", x: 739, y: 171 }
      ],
      arrow: {
        start: { x: 608, y: 62 },
        control: { x: 708, y: 9 },
        end: { x: 843, y: 62 },
        headA: { x: 823, y: 56 },
        headB: { x: 831, y: 76 },
        label: {
          text: "транспонирование = зеркальное отражение",
          anchor: { x: 725, y: 20 },
          offset: { x: 0, y: 0 }
        }
      },
      check: {
        x: 24, y: 279, width: 1152, height: 91,
        title: { text: "Проверка произведения", x: 151, y: 310 },
        columns: [
          {
            x: 398,
            label: "верхний левый элемент",
            value: "2·2 + 0·0 = 4"
          },
          {
            x: 692,
            label: "нижний правый элемент",
            value: "1·1 + 2·2 = 5"
          },
          {
            x: 1010,
            label: "зеркальная пара",
            value: "оба элемента = 2"
          }
        ],
        labelY: 307,
        valueY: 343,
        dividers: [
          { x: 278, top: 295, bottom: 355 },
          { x: 548, top: 295, bottom: 355 },
          { x: 845, top: 295, bottom: 355 }
        ]
      }
    };

    const origin = { x: 0, y: 0 };
    const scale = { x: 1, y: 1 };

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      if (!svg || !fallback) {
        throw new Error("Контейнер схемы недоступен");
      }

      const create = (name, attributes, text) => {
        const node = document.createElementNS(namespace, name);
        Object.entries(attributes || {}).forEach(([key, value]) => {
          node.setAttribute(key, String(value));
        });
        if (text !== undefined) {
          node.textContent = text;
        }
        return node;
      };

      const addText = (parent, text, x, y, className, anchor) => {
        parent.appendChild(create("text", {
          x: sx(x),
          y: sy(y),
          class: className,
          "text-anchor": anchor,
          "dominant-baseline": "middle"
        }, text));
      };

      const addRect = (parent, x, y, width, height, className) => {
        parent.appendChild(create("rect", {
          x: sx(x),
          y: sy(y),
          width: sx(x + width) - sx(x),
          height: sy(y + height) - sy(y),
          rx: sx(diagramData.radius) - sx(diagramData.zero),
          class: className
        }));
      };

      const cellClass = (kind, row, column, value) => {
        if (kind === "A") {
          return row === column ? "cell cell-base" : "cell cell-same";
        }
        if (value === diagramData.zero) {
          return "cell cell-zero";
        }
        if (kind === "L") {
          return row >= column ? "cell cell-lower" : "cell cell-base";
        }
        return row <= column ? "cell cell-upper" : "cell cell-base";
      };

      const addBracket = (parent, x, top, bottom, hook, side) => {
        const inward = side === "left" ? x + hook : x - hook;
        const path = [
          "M", sx(inward), sy(top),
          "L", sx(x), sy(top),
          "L", sx(x), sy(bottom),
          "L", sx(inward), sy(bottom)
        ].join(" ");
        parent.appendChild(create("path", {
          d: path,
          class: "matrix-bracket"
        }));
      };

      const drawMatrix = card => {
        const group = create("g", {
          "aria-label": card.title
        });
        svg.appendChild(group);

        addRect(
          group,
          card.x,
          card.y,
          card.width,
          card.height,
          "card"
        );

        addText(
          group,
          card.title,
          card.titleAnchor.x,
          card.titleAnchor.y,
          "card-title",
          "middle"
        );

        const layout = card.matrixLayout;

        card.matrix.forEach((row, rowIndex) => {
          row.forEach((value, columnIndex) => {
            const centerX = layout.firstX + columnIndex * layout.gapX;
            const centerY = layout.firstY + rowIndex * layout.gapY;
            const cellX = centerX - layout.halfWidth;
            const cellY = centerY - layout.halfHeight;

            group.appendChild(create("rect", {
              x: sx(cellX),
              y: sy(cellY),
              width: sx(centerX + layout.halfWidth) - sx(cellX),
              height: sy(centerY + layout.halfHeight) - sy(cellY),
              rx: sx(diagramData.radius) - sx(diagramData.zero),
              class: cellClass(
                card.kind,
                rowIndex,
                columnIndex,
                value
              )
            }));

            addText(
              group,
              String(value),
              centerX,
              centerY,
              "entry",
              "middle"
            );
          });
        });

        addBracket(
          group,
          layout.leftBracket,
          layout.top,
          layout.bottom,
          layout.hook,
          "left"
        );
        addBracket(
          group,
          layout.rightBracket,
          layout.top,
          layout.bottom,
          layout.hook,
          "right"
        );

        const subtitleClass = card.kind === "L"
          ? "card-subtitle accent-text"
          : card.kind === "LT"
            ? "card-subtitle mirror-text"
            : "card-subtitle";

        addText(
          group,
          card.subtitle,
          card.subtitleAnchor.x,
          card.subtitleAnchor.y,
          subtitleClass,
          "middle"
        );
      };

      diagramData.cards.forEach(drawMatrix);

      diagramData.operators.forEach(operator => {
        addText(
          svg,
          operator.text,
          operator.x,
          operator.y,
          "operator",
          "middle"
        );
      });

      const arrow = diagramData.arrow;
      const arrowPath = [
        "M", sx(arrow.start.x), sy(arrow.start.y),
        "Q", sx(arrow.control.x), sy(arrow.control.y),
        sx(arrow.end.x), sy(arrow.end.y)
      ].join(" ");

      svg.appendChild(create("path", {
        d: arrowPath,
        class: "arrow"
      }));

      svg.appendChild(create("line", {
        x1: sx(arrow.end.x),
        y1: sy(arrow.end.y),
        x2: sx(arrow.headA.x),
        y2: sy(arrow.headA.y),
        class: "arrow-head"
      }));

      svg.appendChild(create("line", {
        x1: sx(arrow.end.x),
        y1: sy(arrow.end.y),
        x2: sx(arrow.headB.x),
        y2: sy(arrow.headB.y),
        class: "arrow-head"
      }));

      addText(
        svg,
        arrow.label.text,
        arrow.label.anchor.x + arrow.label.offset.x,
        arrow.label.anchor.y + arrow.label.offset.y,
        "arrow-label mirror-text",
        "middle"
      );

      const check = diagramData.check;
      addRect(
        svg,
        check.x,
        check.y,
        check.width,
        check.height,
        "check-panel"
      );

      addText(
        svg,
        check.title.text,
        check.title.x,
        check.title.y,
        "formula",
        "middle"
      );

      check.dividers.forEach(divider => {
        svg.appendChild(create("line", {
          x1: sx(divider.x),
          y1: sy(divider.top),
          x2: sx(divider.x),
          y2: sy(divider.bottom),
          class: "divider"
        }));
      });

      check.columns.forEach(column => {
        addText(
          svg,
          column.label,
          column.x,
          check.labelY,
          "check-label",
          "middle"
        );
        addText(
          svg,
          column.value,
          column.x,
          check.valueY,
          "check-value",
          "middle"
        );
      });
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      if (svg) {
        svg.setAttribute("hidden", "");
      }
      if (fallback) {
        fallback.removeAttribute("hidden");
      }
    }
  </script>
</body>
</html>
