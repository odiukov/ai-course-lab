<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Как перестановка строк уменьшает множитель</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f7f9fc;
  --panel:#ffffff;
  --ink:#172033;
  --muted:#59657a;
  --line:#c7cfdb;
  --danger:#b42318;
  --danger-bg:#fff0ed;
  --danger-line:#f4a79d;
  --safe:#087443;
  --safe-bg:#eafaf1;
  --safe-line:#7fd5a8;
  --band:#edf2f8;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.figure{
  width:100%;
  max-width:1040px;
  margin:auto;
  border:1px solid var(--line);
  background:var(--bg);
}
.figure-title{
  padding:12px 18px 10px;
  border-bottom:1px solid var(--line);
  background:var(--panel);
  font-size:20px;
  font-weight:bold;
  text-align:center;
}
svg{
  display:block;
  width:100%;
  height:auto;
  max-height:460px;
  background:var(--bg);
}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.rule,.matrix-line{fill:none;stroke:var(--line);stroke-width:1.5}
.danger-halo{fill:var(--danger-bg);stroke:var(--danger-line);stroke-width:1.5}
.safe-halo{fill:var(--safe-bg);stroke:var(--safe-line);stroke-width:1.5}
.band{fill:var(--band);stroke:var(--line);stroke-width:1.5}
.heading{font-size:18px;font-weight:bold;fill:var(--ink)}
.formula{font-size:18px;font-weight:bold;fill:var(--ink)}
.matrix-text{font-size:18px;fill:var(--ink)}
.answer{font-size:15px;font-weight:bold;fill:var(--ink)}
.note{font-size:14px;fill:var(--muted)}
.danger-text{fill:var(--danger);font-weight:bold}
.safe-text{fill:var(--safe);font-weight:bold}
.conclusion{font-size:17px;font-weight:bold;fill:var(--ink)}
text{dominant-baseline:middle}
.fallback{
  padding:18px;
  margin:0;
  font-size:16px;
  color:var(--ink);
  background:var(--panel);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#10151e;
    --panel:#171e29;
    --ink:#edf2f8;
    --muted:#aeb9c9;
    --line:#3b4657;
    --danger:#ff9b8f;
    --danger-bg:#351b1c;
    --danger-line:#a94d48;
    --safe:#75dda8;
    --safe-bg:#123326;
    --safe-line:#31875d;
    --band:#202a38;
  }
}
</style>
</head>
<body>
<main class="figure">
  <div class="figure-title" id="diagram-title">
    Одна система, два порядка строк — совсем разный масштаб вычислений
  </div>
  <svg id="diagram" viewBox="0 0 1040 460"
       width="1040" height="460"
       preserveAspectRatio="xMidYMid meet"
       role="img" aria-labelledby="diagram-title diagram-desc">
    <title id="diagram-desc">Сравнение исключения Гаусса до и после перестановки строк</title>
  </svg>
  <p id="fallback" class="fallback" hidden>
    Слева ведущий элемент 0.001 даёт множитель 1000 и числа -999 и -999.0.
    После перестановки строк ведущий элемент 1 даёт множитель 0.001 и числа
    0.999 и 0.999. Решение в обоих случаях одинаково.
  </p>
  <noscript>
    <p class="fallback">
      Слева множитель равен 1000, а после перестановки строк — 0.001.
      Решение не меняется, но вычисление становится устойчивым.
    </p>
  </noscript>
</main>
<script>
const data=[
  {kind:"panel",x1:0,x2:48.5,y1:0,y2:41.4},
  {kind:"panel",x1:51.5,x2:100,y1:0,y2:41.4},
  {kind:"line",x1:2.5,x2:46,y1:15.5,y2:15.5,cls:"rule"},
  {kind:"line",x1:54,x2:97.5,y1:15.5,y2:15.5,cls:"rule"},

  {kind:"ellipse",cx:10.2,cy:7.9,rx:3.6,ry:1.7,cls:"danger-halo"},
  {kind:"ellipse",cx:61.7,cy:7.9,rx:2.3,ry:1.7,cls:"safe-halo"},

  {kind:"matrix",xL:3.5,xR:45,yT:5.6,yB:14.5,t:1.2,sep:29,
   rows:[
    {y:7.9,cells:[
      {x:10.2,text:"0.001",cls:"danger-text"},
      {x:21,text:"1"},{x:37,text:"1.001"}]},
    {y:12.4,cells:[
      {x:10.2,text:"1"},{x:21,text:"1"},{x:37,text:"2"}]}
   ]},
  {kind:"matrix",xL:55,xR:96.5,yT:5.6,yB:14.5,t:1.2,sep:80.5,
   rows:[
    {y:7.9,cells:[
      {x:61.7,text:"1",cls:"safe-text"},
      {x:72.5,text:"1"},{x:88.5,text:"2"}]},
    {y:12.4,cells:[
      {x:61.7,text:"0.001"},{x:72.5,text:"1"},{x:88.5,text:"1.001"}]}
   ]},

  {kind:"text",x:24.25,y:3,text:"До перестановки: маленький ведущий элемент",cls:"heading",anchor:"middle"},
  {kind:"text",x:75.75,y:3,text:"После перестановки строк: R₁ ↔ R₂",cls:"heading",anchor:"middle"},

  {kind:"text",x:24.25,y:18.5,text:"m = 1 / 0.001 = 1000",cls:"formula danger-text",anchor:"middle"},
  {kind:"text",x:24.25,y:22,text:"R₂ = R₂ − 1000 · R₁",cls:"formula",anchor:"middle"},
  {kind:"text",x:75.75,y:18.5,text:"m = 0.001 / 1 = 0.001",cls:"formula safe-text",anchor:"middle"},
  {kind:"text",x:75.75,y:22,text:"R₂ = R₂ − 0.001 · R₁",cls:"formula",anchor:"middle"},

  {kind:"matrix",xL:3.5,xR:45,yT:25.2,yB:34.7,t:1.2,sep:29,
   rows:[
    {y:27.8,cells:[
      {x:10.2,text:"0.001"},{x:21,text:"1"},{x:37,text:"1.001"}]},
    {y:32.3,cells:[
      {x:10.2,text:"0"},{x:21,text:"-999",cls:"danger-text"},
      {x:37,text:"-999.0",cls:"danger-text"}]}
   ]},
  {kind:"matrix",xL:55,xR:96.5,yT:25.2,yB:34.7,t:1.2,sep:80.5,
   rows:[
    {y:27.8,cells:[
      {x:61.7,text:"1"},{x:72.5,text:"1"},{x:88.5,text:"2"}]},
    {y:32.3,cells:[
      {x:61.7,text:"0"},{x:72.5,text:"0.999",cls:"safe-text"},
      {x:88.5,text:"0.999",cls:"safe-text"}]}
   ]},

  {kind:"text",x:24.25,y:37.1,text:"Ответ: x₁ = 1.000, x₂ = 1.000",cls:"answer",anchor:"middle"},
  {kind:"text",x:24.25,y:39.8,text:"Погрешность умножается на 1000",cls:"note danger-text",anchor:"middle"},
  {kind:"text",x:75.75,y:37.1,text:"Ответ: x₁ = 1.000, x₂ = 1.000",cls:"answer",anchor:"middle"},
  {kind:"text",x:75.75,y:39.8,text:"Погрешность умножается на 0.001",cls:"note safe-text",anchor:"middle"},

  {kind:"rect",x1:0,x2:100,y1:42.2,y2:44.8,cls:"band"},
  {kind:"text",x:50,y:43.55,text:"1000 → 0.001: множитель стал в миллион раз меньше",cls:"conclusion",anchor:"middle"}
];

const origin=Object.freeze({x:20,y:10});
const scale=Object.freeze({x:10,y:10});

function sx(x){return origin.x+x*scale.x}
function sy(y){return origin.y+y*scale.y}

const svg=document.getElementById("diagram");
const fallback=document.getElementById("fallback");

try{
  const make=(tag,attrs,content)=>{
    const node=document.createElementNS(svg.namespaceURI,tag);
    for(const [name,value] of Object.entries(attrs)){
      if(value!==undefined) node.setAttribute(name,String(value));
    }
    if(content!==undefined) node.textContent=content;
    svg.appendChild(node);
    return node;
  };

  const bracket=(d,left)=>{
    const edge=left?d.xL:d.xR;
    const tip=left?d.xL+d.t:d.xR-d.t;
    const path=[
      "M",sx(tip),sy(d.yT),
      "H",sx(edge),
      "V",sy(d.yB),
      "H",sx(tip)
    ].join(" ");
    make("path",{d:path,class:"matrix-line"});
  };

  for(const d of data){
    if(d.kind==="panel"||d.kind==="rect"){
      make("rect",{
        x:sx(d.x1),y:sy(d.y1),
        width:sx(d.x2)-sx(d.x1),
        height:sy(d.y2)-sy(d.y1),
        class:d.kind==="panel"?"panel":d.cls
      });
    }else if(d.kind==="line"){
      make("line",{
        x1:sx(d.x1),y1:sy(d.y1),
        x2:sx(d.x2),y2:sy(d.y2),
        class:d.cls
      });
    }else if(d.kind==="ellipse"){
      make("ellipse",{
        cx:sx(d.cx),cy:sy(d.cy),
        rx:sx(d.rx)-sx(data[0].x1),
        ry:sy(d.ry)-sy(data[0].y1),
        class:d.cls
      });
    }else if(d.kind==="text"){
      make("text",{
        x:sx(d.x),y:sy(d.y),
        class:d.cls,
        "text-anchor":d.anchor
      },d.text);
    }else if(d.kind==="matrix"){
      bracket(d,true);
      bracket(d,false);
      make("line",{
        x1:sx(d.sep),y1:sy(d.yT),
        x2:sx(d.sep),y2:sy(d.yB),
        class:"matrix-line"
      });
      for(const row of d.rows){
        for(const cell of row.cells){
          make("text",{
            x:sx(cell.x),y:sy(row.y),
            class:["matrix-text",cell.cls].filter(Boolean).join(" "),
            "text-anchor":"middle"
          },cell.text);
        }
      }
    }
  }
}catch(error){
  svg.hidden=true;
  fallback.hidden=false;
}
</script>
</body>
</html>
