<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Одно решение, ни одного или бесконечно много</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f4f6fa;
      --surface: #ffffff;
      --ink: #202735;
      --muted: #5d6879;
      --guide: #cbd2dc;
      --red: #d83a4b;
      --blue: #1769d2;
      --point: #202735;
      --point-core: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #11151b;
        --surface: #191f28;
        --ink: #f1f4f8;
        --muted: #b5becb;
        --guide: #46505e;
        --red: #ff6f7d;
        --blue: #62a8ff;
        --point: #f1f4f8;
        --point-core: #191f28;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .figure {
      box-sizing: border-box;
      max-width: 1200px;
      margin: auto;
      padding: 16px;
    }

    .figure-heading {
      box-sizing: border-box;
      margin: auto;
      padding: 0 0 12px;
      font-size: 22px;
      font-weight: bold;
      color: var(--ink);
    }

    .diagram-frame {
      box-sizing: border-box;
      overflow: hidden;
      border: 1px solid var(--guide);
      background: var(--surface);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--surface);
    }

    text {
      fill: var(--ink);
      font-family: inherit;
      dominant-baseline: middle;
    }

    .panel-title {
      font-size: 21px;
      font-weight: bold;
    }

    .panel-subtitle {
      font-size: 15px;
      fill: var(--muted);
    }

    .result-label {
      font-size: 17px;
      font-weight: bold;
    }

    .detail-label,
    .legend-label {
      font-size: 14px;
      fill: var(--muted);
    }

    .separator,
    .leader {
      vector-effect: non-scaling-stroke;
      fill: none;
      stroke: var(--guide);
      stroke-width: 1.5;
    }

    .condition,
    .legend-swatch {
      vector-effect: non-scaling-stroke;
      fill: none;
      stroke-linecap: round;
      stroke-width: 5;
    }

    .coincident-base {
      vector-effect: non-scaling-stroke;
      fill: none;
      stroke-linecap: round;
      stroke-width: 9;
    }

    .coincident-overlay {
      vector-effect: non-scaling-stroke;
      fill: none;
      stroke-linecap: round;
      stroke-width: 5;
    }

    .red-line {
      stroke: var(--red);
    }

    .blue-line {
      stroke: var(--blue);
    }

    .solution-ring {
      vector-effect: non-scaling-stroke;
      fill: var(--surface);
      stroke: var(--point);
      stroke-width: 3;
    }

    .solution-core {
      fill: var(--point);
    }

    .shared-point {
      vector-effect: non-scaling-stroke;
      fill: var(--surface);
      stroke: var(--ink);
      stroke-width: 2.5;
    }

    .failure {
      box-sizing: border-box;
      margin: auto;
      padding: 16px;
      font-size: 16px;
      color: var(--ink);
      background: var(--surface);
    }

    [hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <figure class="figure">
    <h2 class="figure-heading" id="diagram-heading">
      Одно решение, ни одного или бесконечно много
    </h2>

    <div class="diagram-frame">
      <svg
        id="diagram"
        viewBox="0 0 1200 440"
        width="1200"
        height="440"
        preserveAspectRatio="xMidYMid meet"
        role="img"
        aria-labelledby="diagram-heading diagram-description"
      >
        <title>Три возможных взаимных положения двух прямых</title>
        <desc id="diagram-description">
          Пересекающиеся прямые имеют одну общую точку, параллельные не имеют
          общих точек, а совпадающие имеют бесконечно много общих точек.
        </desc>
      </svg>

      <p class="failure" id="fallback">
        Схема должна показать три пары прямых: пересекающиеся в одной точке,
        параллельные и полностью совпадающие.
      </p>

      <noscript>
        <p class="failure">
          Схема должна показать три пары прямых: пересекающиеся в одной точке,
          параллельные и полностью совпадающие.
        </p>
      </noscript>
    </div>
  </figure>

  <script>
    const DATA = [
      {
        origin: { x: 18, y: 12 },
        scale: { x: 36, y: 36 },
        dash: "18 12",
        separators: [
          {
            a: { x: 10.9, y: 0.35 },
            b: { x: 10.9, y: 10.05 }
          },
          {
            a: { x: 21.9, y: 0.35 },
            b: { x: 21.9, y: 10.05 }
          }
        ],
        panels: [
          {
            title: {
              text: "Одно решение",
              at: { x: 5.35, y: 0.65 },
              anchor: "middle"
            },
            subtitle: {
              text: "прямые пересекаются",
              at: { x: 5.35, y: 1.35 },
              anchor: "middle"
            },
            lines: [
              {
                a: { x: 1.25, y: 7.35 },
                b: { x: 9.45, y: 2.45 },
                classes: "condition red-line"
              },
              {
                a: { x: 1.25, y: 2.45 },
                b: { x: 9.45, y: 7.35 },
                classes: "condition blue-line"
              }
            ],
            leaders: [
              {
                a: { x: 5.35, y: 5.3 },
                b: { x: 5.35, y: 7.95 }
              }
            ],
            circles: [
              {
                at: { x: 5.35, y: 4.9 },
                radius: 9,
                classes: "solution-ring"
              },
              {
                at: { x: 5.35, y: 4.9 },
                radius: 4,
                classes: "solution-core"
              }
            ],
            result: {
              text: "одна общая точка",
              at: { x: 5.35, y: 8.55 },
              anchor: "middle"
            },
            detail: {
              text: "только точка пересечения подходит",
              at: { x: 5.35, y: 9.25 },
              anchor: "middle"
            }
          },
          {
            title: {
              text: "Ни одного решения",
              at: { x: 16.4, y: 0.65 },
              anchor: "middle"
            },
            subtitle: {
              text: "прямые параллельны",
              at: { x: 16.4, y: 1.35 },
              anchor: "middle"
            },
            lines: [
              {
                a: { x: 12.45, y: 3.0 },
                b: { x: 20.35, y: 6.15 },
                classes: "condition red-line"
              },
              {
                a: { x: 12.45, y: 5.1 },
                b: { x: 20.35, y: 8.25 },
                classes: "condition blue-line"
              }
            ],
            leaders: [],
            circles: [],
            result: {
              text: "общих точек нет",
              at: { x: 16.4, y: 8.55 },
              anchor: "middle"
            },
            detail: {
              text: "оба условия вместе выполнить нельзя",
              at: { x: 16.4, y: 9.25 },
              anchor: "middle"
            }
          },
          {
            title: {
              text: "Бесконечно много решений",
              at: { x: 27.25, y: 0.65 },
              anchor: "middle"
            },
            subtitle: {
              text: "прямые полностью совпадают",
              at: { x: 27.25, y: 1.35 },
              anchor: "middle"
            },
            lines: [
              {
                a: { x: 23.25, y: 7.35 },
                b: { x: 31.25, y: 3.35 },
                classes: "coincident-base red-line"
              },
              {
                a: { x: 23.25, y: 7.35 },
                b: { x: 31.25, y: 3.35 },
                classes: "coincident-overlay blue-line",
                dash: "18 12"
              }
            ],
            leaders: [],
            circles: [
              {
                at: { x: 25.25, y: 6.35 },
                radius: 5,
                classes: "shared-point"
              },
              {
                at: { x: 27.25, y: 5.35 },
                radius: 5,
                classes: "shared-point"
              },
              {
                at: { x: 29.25, y: 4.35 },
                radius: 5,
                classes: "shared-point"
              }
            ],
            result: {
              text: "вся прямая — общая",
              at: { x: 27.25, y: 8.55 },
              anchor: "middle"
            },
            detail: {
              text: "любая её точка подходит",
              at: { x: 27.25, y: 9.25 },
              anchor: "middle"
            }
          }
        ],
        legend: [
          {
            line: {
              a: { x: 10.3, y: 10.85 },
              b: { x: 11.35, y: 10.85 },
              classes: "legend-swatch red-line"
            },
            label: {
              text: "первое условие",
              at: { x: 11.6, y: 10.85 },
              anchor: "start"
            }
          },
          {
            line: {
              a: { x: 17.15, y: 10.85 },
              b: { x: 18.2, y: 10.85 },
              classes: "legend-swatch blue-line"
            },
            label: {
              text: "второе условие",
              at: { x: 18.45, y: 10.85 },
              anchor: "start"
            }
          }
        ]
      }
    ];

    const [D] = DATA;
    const origin = D.origin;
    const scale = D.scale;

    function sx(x) {
      return origin.x + x * scale.x;
    }

    function sy(y) {
      return origin.y + y * scale.y;
    }

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const namespace = svg.namespaceURI;
      const fragment = document.createDocumentFragment();

      function make(name, attributes, content) {
        const element = document.createElementNS(namespace, name);

        Object.entries(attributes).forEach(([key, value]) => {
          if (value !== undefined) {
            element.setAttribute(key, value);
          }
        });

        if (content !== undefined) {
          element.textContent = content;
        }

        return element;
      }

      function drawLine(specification, defaultClasses) {
        return make("line", {
          x1: sx(specification.a.x),
          y1: sy(specification.a.y),
          x2: sx(specification.b.x),
          y2: sy(specification.b.y),
          class: specification.classes || defaultClasses,
          "stroke-dasharray": specification.dash
        });
      }

      function drawText(specification, classes) {
        return make(
          "text",
          {
            x: sx(specification.at.x),
            y: sy(specification.at.y),
            class: classes,
            "text-anchor": specification.anchor
          },
          specification.text
        );
      }

      D.separators.forEach((separator) => {
        fragment.append(drawLine(separator, "separator"));
      });

      D.panels.forEach((panel) => {
        const group = make("g", {
          "aria-label": panel.title.text
        });

        group.append(drawText(panel.title, "panel-title"));
        group.append(drawText(panel.subtitle, "panel-subtitle"));

        panel.lines.forEach((line) => {
          group.append(drawLine(line, line.classes));
        });

        panel.leaders.forEach((leader) => {
          group.append(drawLine(leader, "leader"));
        });

        panel.circles.forEach((circle) => {
          group.append(
            make("circle", {
              cx: sx(circle.at.x),
              cy: sy(circle.at.y),
              r: circle.radius,
              class: circle.classes
            })
          );
        });

        group.append(drawText(panel.result, "result-label"));
        group.append(drawText(panel.detail, "detail-label"));
        fragment.append(group);
      });

      D.legend.forEach((item) => {
        fragment.append(drawLine(item.line, item.line.classes));
        fragment.append(drawText(item.label, "legend-label"));
      });

      svg.append(fragment);
      fallback.hidden = true;
    } catch (error) {
      const fallback = document.getElementById("fallback");
      fallback.hidden = false;
      fallback.textContent =
        "Схема должна показать три пары прямых: пересекающиеся в одной точке, параллельные и полностью совпадающие.";
    }
  </script>
</body>
</html>
