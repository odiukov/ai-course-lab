- concept: принадлежность кругу с центром в начале координат определяется сравнением квадрата расстояния с квадратом радиуса
  question: Пусть x и y — координаты точки, а rho — квадрат радиуса круга с центром в начале координат. Заполните условие принадлежности внутренней области круга.
  explanation: Сумма x·x и y·y равна квадрату расстояния от точки до начала координат. Точка находится внутри круга, когда это расстояние меньше квадрата радиуса.
  kind: cloze
  template: inside = ___
  answer: x*x + y*y < rho
  accept:
    - x * x + y * y < rho
    - y*y + x*x < rho
    - y * y + x * x < rho
