- concept: тестовая выборка оценивает обобщение и не должна влиять на обучение параметров
  question: Объясни своими словами, почему тестовую выборку не включают в цикл с backward и шагом оптимизатора.
  explanation: В программе параметры обновляются только на 400 обучающих точках, а 100 тестовых используются после model.eval(). Так тестовая accuracy оценивает способность модели работать с данными, которые не участвовали в подборе параметров.
  kind: open
  reference: Тестовые примеры должны оставаться невидимыми для оптимизации. Если вычислять по ним градиенты и обновлять параметры, модель получит информацию о тестовых данных, а итоговая точность перестанет честно показывать качество на новых примерах.
  id: 050-train-xor-contract-1
  fingerprint: 9692e3b6
- concept: средняя потеря за эпоху нормируется числом обработанных примеров
  question: В цикле обучения total_loss содержит сумму потерь по всем примерам эпохи, а total_samples — количество этих примеров. Заполни формулу средней потери.
  explanation: Деление суммы потерь на число примеров даёт среднюю ошибку одного примера за полный проход. В коде total_samples увеличивается после каждого предсказания, поэтому среднее считается по всем 400 обучающим точкам.
  kind: cloze
  template: avg_loss = total_loss / ___
  answer: total_samples
  accept:
    - len(train_data)
    - число обработанных примеров
  id: 050-train-xor-contract-2
  fingerprint: a6dfa360
