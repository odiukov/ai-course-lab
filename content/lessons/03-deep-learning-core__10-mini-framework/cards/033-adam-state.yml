- concept: первый момент Adam сглаживает историю градиентов и отражает преобладающее направление
  question: Какую информацию хранит первый момент m оптимизатора Adam для отдельного параметра?
  explanation: m является экспоненциальным скользящим средним градиентов. Поэтому последовательность градиентов одного знака поддерживает направление обновления, а единичный выброс влияет на него лишь частично.
  kind: choice
  options:
    - Сглаженную историю градиентов, отражающую их преобладающее направление
    - Среднее значение самого параметра за время обучения
    - Последнее значение функции потерь
    - Количество примеров, обработанных моделью
  correct: 0
  id: 033-adam-state-1
  fingerprint: c8b96825
- concept: второй момент Adam нормирует обновление относительно типичного масштаба градиентов
  question: У двух параметров одинаковые значения скорректированного первого момента m_hat, но у параметра A скорректированный второй момент v_hat больше. При прочих равных для какого параметра Adam сделает меньшее по модулю обновление?
  explanation: Величина обновления делится на sqrt(v_hat) + eps. Чем больше сглаженная история квадратов градиентов, тем больше знаменатель и тем осторожнее шаг Adam.
  kind: choice
  options:
    - Для параметра A
    - Для параметра B
    - Обновления обязательно будут одинаковыми
    - Это зависит только от знака текущего градиента
  correct: 0
  id: 033-adam-state-2
  fingerprint: '67099271'
- concept: Adam хранит независимые состояния первого и второго моментов для каждого параметра
  question: Почему Adam должен хранить отдельные значения m и v для каждого обучаемого параметра, а не одну общую пару для всей модели?
  explanation: В реализации состояния индексируются так же, как параметры. Поэтому история крупных или колеблющихся градиентов одного веса не меняет адаптивный шаг другого веса или смещения.
  kind: open
  reference: У разных параметров градиенты имеют разные направления, масштабы и историю изменений. Отдельные m и v позволяют адаптировать обновление каждого параметра по его собственным градиентам; общая память смешала бы несвязанные сигналы.
  id: 033-adam-state-3
  fingerprint: 9969ef44
