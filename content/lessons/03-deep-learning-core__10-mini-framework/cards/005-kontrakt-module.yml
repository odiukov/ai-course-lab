- concept: parameters возвращает обучаемые веса модуля, а модуль без весов может вернуть пустую коллекцию
  question: Что должен возвращать метод parameters у Linear и что он может вернуть у ReLU? Объясни причину различия.
  explanation: Метод parameters предоставляет оптимизатору обучаемые веса. Наличие этого метода обязательно для общего интерфейса, но конкретный модуль может не иметь ни одного параметра.
  kind: open
  reference: У Linear метод parameters возвращает его обучаемые веса, например матрицу весов и смещение. У ReLU обучаемых весов нет, поэтому метод может вернуть пустую коллекцию. Одинаковый интерфейс не требует одинакового внутреннего состояния.
  id: 005-kontrakt-module-2
  fingerprint: 25bf8129
- concept: backward явно вычисляет градиенты в учебном мини-фреймворке
  question: Заполни пропуск названием метода Module.
  explanation: В PyTorch вычисление градиентов обычно выполняет autograd. В учебном мини-фреймворке каждый модуль реализует backward явно.
  kind: cloze
  template: Метод ___ вычисляет градиенты по полученному градиенту выхода.
  answer: backward
