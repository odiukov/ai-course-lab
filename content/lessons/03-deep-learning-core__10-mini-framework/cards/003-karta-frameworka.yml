- concept: компоненты мини-фреймворка участвуют в обучении в определённой последовательности
  question: Расположи действия одной итерации обучения в правильном порядке.
  explanation: Сначала DataLoader предоставляет данные, затем модель строит прогноз. Функция потерь измеряет ошибку, обратный проход вычисляет градиенты, после чего оптимизатор изменяет параметры.
