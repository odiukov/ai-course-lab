- concept: train и eval рекурсивно переключают флаг training у всей иерархии модулей
  question: Модель содержит несколько вложенных контейнеров с модулями. Что должно произойти после вызова model.eval()?
  explanation: eval() рекурсивно переводит всю иерархию модулей в режим оценки. Каждый вложенный модуль получает training = False, но параметры сохраняются и вычисление выхода автоматически не запускается.
  kind: choice
  options:
    - Только у внешнего контейнера training станет False
    - У модели и всех вложенных модулей training станет False
    - Все обучаемые параметры модели будут удалены
    - Модель автоматически выполнит проверочный forward
  correct: 1
  id: 013-training-flag-1
  fingerprint: 49416bda
- concept: переключение режима не запускает обучение и не управляет вычислением градиентов
  question: Объясни своими словами, почему вызов model.train() ещё не означает, что модель выполнила шаг обучения.
  explanation: Флаг training сообщает чувствительным к режиму слоям, как вести себя во время forward. Сам вызов train() не вычисляет выход или градиенты и не обновляет веса.
  kind: open
  reference: train() лишь устанавливает режим обучения у модели и вложенных модулей. Для шага обучения всё равно нужны прямой проход, вычисление функции потерь, обратное распространение и обновление параметров оптимизатором.
  id: 013-training-flag-2
  fingerprint: 6c81ecef
