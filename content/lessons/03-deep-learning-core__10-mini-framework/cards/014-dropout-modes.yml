- concept: в режиме оценки Dropout возвращает вход без изменений
  question: Как должен вести себя слой Dropout после переключения модели в режим оценки?
  explanation: Случайное обнуление применяется только при обучении. В режиме eval Dropout возвращает вход как есть, поэтому предсказания не зависят от случайной маски.
  kind: choice
  options:
    - Случайно обнулять элементы, но не масштабировать оставшиеся
    - Возвращать вход без случайного обнуления и масштабирования
    - Использовать последнюю маску, созданную во время обучения
  correct: 1
  id: 014-dropout-modes-1
  fingerprint: d66af056
- concept: обратный проход Dropout использует ту же маску, что и прямой проход
  question: Объясни своими словами, как маска Dropout влияет на градиенты при обратном проходе.
  explanation: В прямом проходе при p=0.5 маска содержит нули для исключённых элементов и двойки для сохранённых. Та же маска в backward блокирует градиенты исключённых элементов и так же масштабирует остальные.
  kind: open
  reference: 'Dropout повторно использует маску из соответствующего прямого прохода: градиенты обнулённых элементов становятся нулевыми, а градиенты сохранённых элементов умножаются на тот же компенсирующий коэффициент.'
  id: 014-dropout-modes-2
  fingerprint: 243bab91
