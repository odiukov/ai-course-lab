- concept: градиент по входу Linear создаётся заново для каждого вызова backward
  question: Почему градиент по входу, возвращаемый методом Linear.backward, не содержит результат предыдущего вызова этого метода?
  explanation: input_grad — локальная переменная метода, которая при каждом вызове инициализируется заново. Поэтому возвращаемое значение относится только к текущему обратному проходу.
  kind: open
  reference: В начале каждого вызова backward создаётся новый локальный список input_grad. Он заполняется только вкладами текущего обратного прохода и после завершения вызова не хранится как состояние слоя.
  id: 027-gradients-accumulate-2
  fingerprint: ee2b8fd1
