- concept: частота обновления параметров определяется расположением вызова optimizer.step, а не группировкой данных загрузчиком
  question: DataLoader выдаёт мини-батчи, но optimizer.step() вызывается внутри цикла по отдельным примерам. Как фактически обновляется модель?
  explanation: Границы батчей сами по себе не управляют оптимизатором. Если zero_grad(), backward() и step() выполняются для каждого примера, параметры обновляются после каждой точки, даже когда DataLoader группирует их в батчи.
  kind: choice
  options:
    - После каждого примера
    - После каждого мини-батча
    - Только после завершения эпохи
    - Только после обработки всего датасета
  correct: 0
  id: 047-online-vs-batch-1
  fingerprint: d37171fb
- concept: обновление по среднему градиенту мини-батча требует накопить градиенты до вызова optimizer.step
  question: Расположи действия для одного обновления параметров по среднему градиенту мини-батча.
  explanation: Параметры должны оставаться неизменными, пока вычисляются градиенты всех примеров мини-батча. После накопления градиенты обычно усредняют, а затем выполняют единственное обновление параметров.
  kind: order
  items:
    - Обнулить градиентные буферы перед обработкой мини-батча
    - Выполнить forward и backward для всех примеров, накапливая градиенты
    - Усреднить накопленные градиенты по числу примеров
    - Вызвать optimizer.step()
  id: 047-online-vs-batch-2
  fingerprint: 308355ee
- concept: последовательные обновления по примерам и единое обновление по батчу вычисляют градиенты при разных состояниях параметров
  question: Объясни своими словами, почему последовательные обновления после каждого примера обычно не эквивалентны одному обновлению по усреднённому градиенту тех же примеров.
  explanation: Различие связано не только с частотой вызова оптимизатора. В поэлементном варианте ранние обновления влияют на градиенты последующих примеров, тогда как батчевый градиент относится к одному фиксированному состоянию модели.
  kind: open
  reference: При последовательном обучении после каждого примера параметры меняются, поэтому следующий градиент вычисляется уже для другой версии модели. При едином обновлении все градиенты батча вычисляются при одних и тех же параметрах, затем объединяются и применяются вместе.
  id: 047-online-vs-batch-3
  fingerprint: f363862b
