- concept: BatchNorm выбирает статистику текущего батча при обучении и бегущую статистику при оценке
  question: Как BatchNorm должен выбирать среднее и дисперсию в режимах обучения и оценки?
  explanation: Во время обучения слой нормализует активации по текущему батчу и на его основе обновляет running_mean и running_var. В режиме eval он использует уже накопленные значения и не обновляет их.
  kind: choice
  options:
    - В обоих режимах использовать статистику текущего батча
    - При обучении использовать статистику батча и обновлять бегущую, а при оценке использовать бегущую и не изменять её
    - При обучении использовать бегущую статистику, а при оценке — статистику текущего батча
    - В обоих режимах использовать только бегущую статистику
  correct: 1
  id: 015-batchnorm-modes-1
  fingerprint: e4145f69
- concept: momentum определяет вклад нового батча в обновление бегущей статистики BatchNorm
  question: Объясните своими словами, как величина momentum влияет на обновление running_mean и running_var в BatchNorm.
  explanation: Бегущая статистика смешивает прежнее накопленное значение со статистикой нового батча. Поэтому большой momentum ускоряет её изменение, а малый делает накопленные оценки более инерционными.
  kind: open
  reference: Чем больше momentum, тем сильнее статистика очередного батча сдвигает бегущие значения. При малом momentum бегущая статистика меняется плавнее и слабее реагирует на отдельный необычный батч.
  id: 015-batchnorm-modes-2
  fingerprint: 43222d37
