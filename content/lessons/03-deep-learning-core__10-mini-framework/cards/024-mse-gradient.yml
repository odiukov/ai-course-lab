- concept: модуль градиента MSE отражает величину отклонения предсказания от цели
  question: Два предсказания находятся по разные стороны от одной цели и отклоняются от неё на одинаковую величину. Как соотносятся их градиенты MSE при одинаковом размере набора?
  explanation: Модуль градиента пропорционален расстоянию между предсказанием и целью. При равных отклонениях модули совпадают, но градиенты имеют разные знаки, потому что исправлять предсказания нужно в противоположных направлениях.
  kind: choice
  options:
    - Их модули равны, а знаки противоположны
    - Их знаки и модули одинаковы
    - У предсказания ниже цели модуль всегда больше
    - У предсказания выше цели модуль всегда больше
  correct: 0
