- concept: градиент усреднённой MSE по отдельному предсказанию зависит от его ошибки и размера вектора
  question: MSE усредняется по вектору длины 5. Для одной компоненты предсказание равно 0.60, а цель — 0.35. Чему равен градиент MSE по этой компоненте?
  explanation: 'Ошибка компоненты равна 0.25. Производная среднего квадрата ошибки — удвоенная ошибка, делённая на длину вектора: 0.50 / 5 = 0.10. Положительный знак указывает, что предсказание следует уменьшать.'
  kind: numeric
  answer: 0.1
  tolerance: 0.000001
  id: 021-loss-contract-2
