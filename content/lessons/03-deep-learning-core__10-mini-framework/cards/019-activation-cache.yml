- concept: выход Sigmoid и Tanh содержит достаточно информации для вычисления их локальной производной
  question: Почему модули Sigmoid и Tanh могут сохранить свой выход вместо исходного входа для последующего обратного прохода?
  explanation: Для Sigmoid множитель градиента вычисляется как o · (1 − o), а для Tanh — как 1 − o², где o — сохранённый выход активации. Это делает копию исходного входа избыточной.
  kind: open
  reference: Их локальные производные выражаются непосредственно через значение выхода активации. Поэтому сохранённого результата достаточно, чтобы умножить входящий градиент на нужную производную, а исходный вход хранить не требуется.
  id: 019-activation-cache-2
