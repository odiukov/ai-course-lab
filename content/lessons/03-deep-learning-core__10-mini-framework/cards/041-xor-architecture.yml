- concept: композиция линейных слоёв остаётся линейным преобразованием, а промежуточная нелинейность увеличивает выразительность сети
  question: Объясните своими словами, почему цепочка из нескольких Linear без активаций между ними не решает проблему XOR, а скрытый слой с нелинейной активацией может её решить.
  explanation: 'Дополнительные Linear сами по себе не повышают выразительность модели: их композиция эквивалентна одному Linear. ReLU или другая нелинейность между слоями позволяет создавать промежуточные признаки и составную границу, необходимую для XOR.'
  kind: open
  reference: 'Композицию аффинных преобразований можно алгебраически свернуть в одно аффинное преобразование, поэтому такая цепочка по-прежнему строит только линейную границу. Нелинейная активация нарушает это сворачивание: скрытые нейроны формируют разные нелинейные признаки, которые следующий Linear объединяет в более сложную границу.'
