- concept: shuffle изменяет порядок выдачи примеров, не изменяя сам набор данных
  question: Что делает DataLoader при включённом shuffle перед очередным проходом по набору данных?
  explanation: Перемешивается порядок индексов, по которым извлекаются примеры. Состав набора и правило формирования батчей не меняются.
  kind: choice
  options:
    - Перемешивает индексы примеров перед формированием батчей
    - Случайно изменяет значения входов и целевых ответов
    - Удаляет часть примеров, чтобы все батчи были полными
    - Случайно выбирает новый размер каждого батча
  correct: 0
  id: 036-shuffle-length-1
  fingerprint: f162acfe
- concept: неполный остаток образует последний батч, а число батчей вычисляется с округлением вверх
  question: Как DataLoader формирует батчи, если размер набора данных не делится на batch_size без остатка?
  explanation: Цикл берёт последовательные срезы индексов и не отбрасывает последний короткий срез. Поэтому остаток становится неполным батчем, а количество батчей округляется вверх.
  kind: open
  reference: После всех полных батчей DataLoader выдаёт оставшиеся примеры отдельным неполным батчем. Поэтому число батчей равно ceil(N / B), где N — размер набора, а B — batch_size.
  id: 036-shuffle-length-2
  fingerprint: 28716d01
