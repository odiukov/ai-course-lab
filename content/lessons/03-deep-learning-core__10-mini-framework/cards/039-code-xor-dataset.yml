- concept: датасет для конечной таблицы истинности должен исчерпывающе покрывать пространство входов без пропусков и повторов
  question: Почему датасет для обучения XOR разумно составить детерминированно из всех возможных сочетаний булевых входов, а не выбирать примеры случайно?
  explanation: Полное покрытие таблицы истинности позволяет обучать и проверять XOR на каждом допустимом входе. Случайность здесь не добавляет полезного разнообразия, но создаёт риск неполного набора.
  kind: open
  reference: Пространство входов XOR конечно и мало, поэтому его можно покрыть полностью. Детерминированный набор гарантирует, что каждое сочетание встретится ровно один раз, тогда как случайная выборка может пропустить один случай или продублировать другой.
