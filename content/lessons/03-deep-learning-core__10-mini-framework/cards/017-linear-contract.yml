- concept: градиенты Linear накапливаются при повторных вызовах backward и требуют явного обнуления
  question: Объясни своими словами, почему градиенты весов и смещений нужно обнулять перед новым циклом обучения, если backward записывает их с помощью прибавления.
  explanation: Операция += сохраняет прежний градиент и добавляет к нему новый. Поэтому несколько обратных проходов можно намеренно накопить, а перед началом независимого цикла старые значения необходимо сбросить.
  kind: open
  reference: Поскольку backward прибавляет новый вклад к уже сохранённому градиенту, без обнуления в обновление параметров попадут также вклады из предыдущих циклов обучения. Накопление полезно для объединения нескольких примеров, но его границы нужно контролировать явно.
  id: 017-linear-contract-3
