- concept: число обучаемых параметров Linear равно числу весов плюс числу смещений
  question: Сколько обучаемых чисел хранит слой Linear с размером входа 3 и размером выхода 5?
  explanation: Матрица весов содержит 5 × 3 = 15 чисел, а каждому из 5 выходов соответствует отдельное смещение. Всего получается 15 + 5 = 20 обучаемых параметров.
  kind: numeric
  answer: 20
  tolerance: 0.01
