- concept: возведение ошибок в квадрат устраняет взаимное погашение отклонений и усиливает вклад крупных промахов
  question: Зачем при вычислении MSE каждую ошибку возводят в квадрат?
  explanation: После возведения в квадрат все вклады неотрицательны, поэтому отклонения разных знаков не компенсируют друг друга. Кроме того, квадрат увеличивает влияние крупных ошибок.
  kind: choice
  options:
    - Чтобы сохранить знак каждого отклонения в итоговой функции потерь
    - Чтобы ошибки разных знаков не погашали друг друга, а крупные отклонения получали больший вес
    - Чтобы итоговая функция потерь всегда совпадала с суммой ошибок
    - Чтобы количество выходов модели не влияло на размер результата без дополнительного деления
  correct: 1
  id: 022-mse-scalar-2
  fingerprint: af30a8da
- concept: усреднение квадратов ошибок делает MSE сопоставимой для наборов с разным количеством выходов
  question: Объясни своими словами, почему в MSE сумму квадратов ошибок делят на количество выходов.
  explanation: Без деления сумма обычно растёт вместе с количеством оцениваемых выходов. Усреднение нормализует её и показывает типичный квадрат ошибки на один выход.
  kind: open
  reference: Деление превращает сумму в среднюю ошибку на один выход. Поэтому само увеличение количества выходов не увеличивает значение функции потерь автоматически, и результаты для наборов разного размера можно сравнивать.
  id: 022-mse-scalar-3
  fingerprint: 973f5d63
