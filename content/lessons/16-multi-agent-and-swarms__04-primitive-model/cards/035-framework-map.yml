- concept: по каждой оси у всей отрасли встречается лишь несколько принципиально разных ответов, поэтому незнакомый фреймворк опознаётся выбором из короткого набора
  question: Вы читаете документацию восьмого по счёту незнакомого фреймворка. Что даёт разбор по осям примитивов больше всего?
  explanation: 'Кто выбирает следующего исполнителя: закреплённый маршрут, граф с условиями, модель, сам текущий агент или очередь — вариантов немного, и они повторяются от продукта к продукту. Поэтому изучение нового фреймворка сводится к четырём вопросам с ответами из короткого списка, а не к изучению системы с нуля.'
  kind: choice
  options:
    - Каждый фреймворк вносит новый вид примитива, и набор нужно расширять под каждый продукт
    - На каждой оси набор принципиально разных ответов короткий, поэтому новый фреймворк опознаётся как комбинация уже известных значений
    - Оси позволяют ранжировать фреймворки от худшего к лучшему
    - 'Оси заменяют чтение документации: детали реализации после разбора не нужны'
  correct: 1
