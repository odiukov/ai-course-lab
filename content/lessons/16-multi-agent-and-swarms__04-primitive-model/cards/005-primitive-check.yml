- concept: доступ к shared state может быть только на чтение — запись не обязательна для всех участников
  question: Обязаны ли все агенты, имеющие доступ к общему состоянию, уметь в него писать?
  explanation: 'Определяющий признак shared state — доступность нескольким агентам на чтение. Право записи выдаётся выборочно: например, только исследователь пополняет список источников, а остальные его читают.'
  kind: choice
  options:
    - Да, иначе структура не считается общим состоянием
    - 'Нет: чтение обязательно, запись — необязательная возможность, её можно дать лишь части агентов'
    - Нет, но тогда роль хранилища переходит к orchestrator
    - Да, запись обязательна, иначе агентам нечего будет читать
  correct: 1
