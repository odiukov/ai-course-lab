- concept: 'сигнатура оркестратора: вход — состояние и последний говоривший, выход — следующий исполнитель'
  question: Заполни пропуск в сигнатуре оркестратора мультиагентной системы.
  explanation: Оркестратор — функция ({state, last_speaker}) -> next_agent. Второй аргумент фиксирует, чей ход только что завершился; без него правило выбора не знает текущего места в работе.
  kind: cloze
  template: next_agent = orchestrator(state, ___)
  answer: last_speaker
  accept:
    - last_speaker
    - last speaker
    - последний говоривший
    - previous_agent
    - current_agent
  id: 021-orchestrator-function-1
  fingerprint: e0bc8b01
- concept: одно и то же состояние даёт разного следующего исполнителя в зависимости от того, кто ходил последним
  question: Из сигнатуры оркестратора убрали аргумент last_speaker, оставив только state. Какое поведение станет невозможным?
  explanation: 'Запись вида «данные готовы» требует разного продолжения: после исполнителя её должен оценить проверяющий, после проверяющего работа идёт дальше. При одном лишь state функция вернёт один и тот же ответ на оба случая и система зациклится.'
  kind: choice
  options:
    - Хранение истории сообщений между ходами
    - Разное продолжение после одной и той же записи в состоянии в зависимости от того, кто её оставил
    - Передача агенту проекции вместо полного пула
    - Одновременная работа нескольких агентов
  correct: 1
  id: 021-orchestrator-function-2
  fingerprint: 4f5de772
- concept: выход оркестратора — выбор исполнителя, поэтому ошибка маршрута и ошибка содержания диагностируются раздельно
  question: Оркестратор вызвал ровно того агента, который и должен был работать, но его ответ фактически неверен. Что это говорит о системе?
  explanation: 'Оркестратор возвращает ссылку на агента, а не текст и не результат: он не пишет ответ и не оценивает его качество. Верный выбор при неверном содержании локализует дефект в промпте, инструментах или проекции этого агента.'
  kind: choice
  options:
    - Правило выбора следующего исполнителя неисправно и его нужно переписать
    - Маршрутизация отработала корректно; дефект в конфигурации или входе выбранного агента
    - Общее состояние потеряло порядок сообщений
    - Оркестратору не хватило прав на запись в общее состояние
  correct: 1
  id: 021-orchestrator-function-3
  fingerprint: d57e11d4
