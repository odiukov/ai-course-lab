- concept: 'режим оркестрации задаёт место, где чинится неверный порядок исполнителей: сборка маршрута, промпт диспетчера, инструменты агента или дисциплина очереди'
  question: В системе один и тот же агент отработал дважды подряд, хотя не должен был. Режим оркестрации — handoff-driven. Где искать причину в первую очередь?
  explanation: Управляющее решение в handoff-driven принимает текущий исполнитель, значит и дефект маршрута лежит в его конфигурации. Диспетчер-модель — адрес для LLM-selected, код сборки — для static, очередь — для queue-driven. Знание режима сразу сокращает область поиска до одного места.
  kind: choice
  options:
    - 'В конфигурации агента, который ходил перед этим: его промпт и набор handoff-инструментов определяют, кому уходит управление'
    - В промпте модели-диспетчера, выбирающей говорящего
    - В коде сборки маршрута, где перечислена последовательность агентов
    - В дисциплине выборки задач из общей очереди
  correct: 0
