- concept: LLM-selected добавляет отдельный вызов модели на каждое решение о следующем исполнителе, static не добавляет ни одного
  question: Конвейер делает 9 ходов агентов. Сколько дополнительных вызовов модели-диспетчера потребует LLM-selected режим, если селектор вызывается перед каждым ходом, кроме первого (он задан стартом)?
  explanation: 'Решение о следующем исполнителе принимается на каждом переходе: между 9 ходами их 8. Static тратит на маршрутизацию ноль вызовов, handoff-driven прячет решение внутрь и без того делаемого хода агента. Отсюда цена LLM-маршрутизации: латентность и токены растут пропорционально числу переходов.'
  kind: numeric
  answer: 8
