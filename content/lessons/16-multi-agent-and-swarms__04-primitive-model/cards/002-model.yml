- concept: любая топология мультиагентной системы описывается через agent, handoff, shared state и orchestrator
  question: Опиши круговое обсуждение (round-robin), где участники по очереди дополняют общий ответ, через четыре примитива мультиагентных систем. Что здесь чем является?
  explanation: 'Смысл модели в том, что топология — не отдельная архитектура со своими законами, а конкретная сборка тех же четырёх примитивов. Поэтому незнакомую схему разбирают вопросами: кто работает, как переходит управление, где лежат общие данные, кто назначает следующего.'
  kind: open
  reference: 'Agent — каждый участник обсуждения: свой системный промпт и свой набор инструментов. Handoff — передача хода следующему участнику. Shared state — общий текст ответа или пул сообщений, который читают все. Orchestrator — правило очередности «по кругу», то есть детерминированный выбор следующего говорящего. Круг, цепочка и схема с руководителем отличаются только значениями на осях handoff и orchestrator, набор примитивов один и тот же.'
  id: 002-model-1
  fingerprint: 777ecdde
- concept: разные имена в документациях (blackboard, message pool, StateGraph) скрывают один и тот же примитив, различия — поверхностный синтаксис
  question: Документации разных фреймворков называют структуру, куда участники складывают промежуточные результаты и откуда их читают другие, словами «blackboard», «message pool» и «StateGraph». Что из этого верно?
  explanation: 'Общее состояние — это любая структура данных, доступная нескольким агентам на чтение (иногда и на запись): пул сообщений, доска, key-value store, векторная память. Названия классов относятся к синтаксису фреймворка, а не к устройству примитива.'
  kind: choice
  options:
    - Это три разных примитива, и каждый требует своей архитектуры системы
    - Это один и тот же примитив — shared state, различаются только имена и форма записи
    - 'Это три варианта orchestrator: каждое имя задаёт свой способ выбора говорящего'
    - Это способы описать handoff, потому что данные передаются между агентами
  correct: 1
  id: 002-model-2
  fingerprint: 25b7d5e6
