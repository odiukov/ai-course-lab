- concept: централизация общего состояния делает координацию наблюдаемой, но переносит цену координации в реализацию самого хранилища
  question: Команда переносит пул сообщений из локальных переменных вызывающего кода в централизованное хранилище с версиями и снимками. Что реально меняется?
  explanation: 'Централизация не устраняет сложность координации, а собирает её в одном месте: появляется точка наблюдения и отладки, но одновременно требование корректно реализовать порядок записей, конкурентный доступ и версии. Выбор между спрятанным и централизованным состоянием — выбор, где платить.'
  kind: choice
  options:
    - Агенты становятся stateful и начинают хранить свою историю
    - Координационные баги исчезают, потому что записи теперь упорядочены
    - 'Координация становится наблюдаемой, но её цена переезжает в реализацию хранилища: версионирование, блокировки, снимки'
    - Handoff перестаёт быть нужен, так как маршрут выводится из состояния
  correct: 2
  id: 020-state-bugs-1
  fingerprint: 5ef300b5
- concept: ошибочная запись в общем состоянии переживает перезапуск агента, поэтому исправлять её нужно в состоянии, а не в исполнителе
  question: Агент выдал ответ, опираясь на ошибочный факт, который несколько ходов назад записал в общее состояние другой участник. Почему перезапуск этого агента не устраняет проблему? Объясни своими словами.
  explanation: Отравление памяти — свойство хранилища, а не исполнителя. Ровно потому, что все примитивы, кроме общего состояния, не имеют состояния, локализация такого бага всегда начинается с содержимого и истории записей пула.
  kind: open
  reference: 'Агент — функция от промпта, инструментов и входа; ничего между вызовами он не хранит. Ошибочный факт лежит не в агенте, а в общем состоянии — единственном хранящем состояние примитиве. При перезапуске тот же агент прочитает тот же пул и снова получит испорченную запись, как и любой другой участник, чья проекция её захватывает. Исправление — на уровне состояния: удалить или перезаписать запись, откатиться к прежней версии снимка, добавить проверку на этапе записи.'
  id: 020-state-bugs-2
  fingerprint: c4def194
