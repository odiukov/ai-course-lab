- concept: 'handoff — четырёхполевая структура: от кого, кому, причина, данные'
  question: Заполни пропуск в структуре передачи управления.
  explanation: 'Четыре поля отвечают на четыре вопроса: кто закончил ход, кто действует дальше, почему маршрут изменился и с чем продолжать. Причина — не украшение: по ней передачу можно записать в журнал, объяснить и разобрать после сбоя.'
  kind: cloze
  template: Handoff = (from_agent, to_agent, ___, payload)
  answer: reason
  accept:
    - reason
    - причина
    - причина передачи
  id: 011-handoff-contract-1
  fingerprint: 618bd91d
- concept: сообщение адресату не передаёт право следующего хода — это делает только handoff
  question: 'Агент-исследователь написал в общий пул: «Редактор, вот факты, доделай текст», и система дальше снова вызывает исследователя. В чём причина?'
  explanation: Запись в общее состояние сообщает что-то другим участникам. Handoff дополнительно переназначает следующего исполнителя. Без него текущим агентом остаётся тот же самый, сколько бы он ни адресовал реплик коллеге.
  kind: choice
  options:
    - Редактор не прочитал сообщение из пула
    - Сообщение не меняет того, кому принадлежит следующий ход; смену исполнителя оформляет только handoff
    - В сообщении не хватило данных, поэтому передача откатилась
    - Пул сообщений не потокобезопасен
  correct: 1
  id: 011-handoff-contract-2
  fingerprint: 05f3ec2e
- concept: payload привязан к конкретной передаче, а общее состояние доступно всем участникам постоянно
  question: Чем payload передачи управления отличается от записи в общем состоянии?
  explanation: 'Payload — груз конкретного перехода: он адресован принимающему и осмыслен в рамках этой передачи. Общее состояние живёт отдельно от маршрута и доступно участникам вне зависимости от того, кто сейчас ходит.'
  kind: choice
  options:
    - Payload — это копия всего общего состояния на момент передачи
    - Payload видит только принимающий агент этой передачи, а общее состояние доступно участникам независимо от того, кто кому передал ход
    - Payload хранится дольше, чем общее состояние
    - 'Разницы нет: payload — просто другое имя пула сообщений'
  correct: 1
  id: 011-handoff-contract-3
  fingerprint: 8992948f
