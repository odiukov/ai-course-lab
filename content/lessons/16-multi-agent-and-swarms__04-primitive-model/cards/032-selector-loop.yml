- concept: один вызов политики выбора назначает только ближайший переход, поэтому состав и длина цепочки исполнителей известны лишь по ходу прогона
  question: Перед запуском конвейера из четырёх агентов под управлением политики выбора говорящего вас просят выписать полную последовательность исполнителей. Что можно ответить?
  explanation: 'Политика вызывается заново после каждого хода и отвечает на один вопрос: кто идёт следом. Маршрут собирается по одному переходу и существует только как история прогона. Это ключевое отличие от статической сборки, где вся последовательность зафиксирована до запуска и её можно распечатать заранее.'
  kind: choice
  options:
    - Последовательность равна порядку, в котором агенты перечислены при сборке группы
    - Известен только первый исполнитель; каждый следующий назначается отдельным вызовом политики после очередной публикации
    - Последовательность полностью известна, потому что политика получает состояние и вычисляет весь маршрут разом
    - 'Последовательность известна с точностью до перестановки: набор фиксирован, порядок случаен'
  correct: 1
