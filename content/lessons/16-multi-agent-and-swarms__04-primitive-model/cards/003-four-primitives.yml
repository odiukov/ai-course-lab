- concept: handoff механически реализуется как вызов инструмента, возвращающий следующего агента, или как условное ребро графа
  question: Как обычно устроен handoff на уровне механики?
  explanation: Handoff — структурированная передача управления. В tool-ориентированных фреймворках это инструмент, возвращающий нового агента; в графовых — условный переход по ребру. Запись данных в общее хранилище — это shared state, а не передача управления.
  kind: choice
  options:
    - Вызов инструмента, который возвращает следующего агента, либо ребро графа, срабатывающее по условию
    - Копирование внутренней памяти одного агента в память другого
    - Отдельный сетевой протокол между процессами агентов
    - Запись результата в векторное хранилище, откуда его забирает любой свободный агент
  correct: 0
  id: 003-four-primitives-1
  fingerprint: 74b58d5a
- concept: 'orchestrator реализуется по-разному: явный граф, LLM-выбор говорящего, handoff последнего говорившего, планировщик над очередью'
  question: 'В системе нет отдельного управляющего компонента: следующим работает тот агент, которого вернул handoff-вызов последнего говорившего. Что это значит для примитива orchestrator?'
  explanation: 'Выбор следующего говорящего есть всегда — вопрос лишь в том, кто его делает. Варианты оси: детерминированный граф, мягкий LLM-выбор, handoff последнего говорившего (подход OpenAI Swarm) или планировщик над очередью задач.'
  kind: choice
  options:
    - Orchestrator в такой системе отсутствует как примитив
    - Orchestrator здесь есть, он просто реализован через handoff последнего говорившего — это один из вариантов оси
    - Роль orchestrator берёт на себя shared state, поскольку решение выводится из данных
    - Такая система не может работать без явного графа переходов
  correct: 1
