- concept: 'четыре примитива — независимые оси: значение одной можно менять, не трогая остальные'
  question: 'Команда добавила в работающую систему общую базу знаний, доступную всем исполнителям, и больше ничего не меняла: те же роли, те же инструменты, тот же порядок хода. Почему такое изменение возможно и что оно говорит о модели примитивов?'
  explanation: 'Именно независимость осей делает модель полезной: система описывается набором значений по каждой оси, а не единым неделимым «шаблоном архитектуры». Поэтому одну настройку меняют точечно.'
  kind: open
  reference: 'Изменилась только ось shared state. Agent задаёт исполнителя (системный промпт плюс инструменты), handoff — допустимые передачи управления, orchestrator — выбор следующего говорящего. Эти оси независимы: появление общего хранилища не обязывает переписывать промпты, маршруты передач или правило очередности. Так же можно заменить мягкий LLM-выбор говорящего на строгий порядок, сохранив агентов и общее состояние.'
  id: 003-four-primitives-3
  fingerprint: 41ef308f
