- concept: исполнитель цикла обязан обновлять последнего говорившего после каждого хода, иначе политика на каждой итерации получает один и тот же вход
  question: 'Цикл исполняет решения политики выбора. Заполните пропуск, чтобы следующая итерация не повторяла тот же выбор:'
  explanation: Политика без собственной памяти определяет ответ по паре «состояние + последний говоривший». Если last_speaker остаётся пустым, циклическая политика на каждой итерации видит «предыдущего нет» и снова назначает первого агента — прогон упирается в лимит ходов, публикуя один и тот же результат.
  kind: cloze
  template: |-
    while turns < max_turns:
        speaker = select_next(state, last_speaker)
        if speaker is None:
            break
        state.post(speaker.run(project(state, speaker)))
        ___ = speaker.name
        turns += 1
  answer: last_speaker
  accept:
    - last_speaker
  id: 033-run-selector-1
  fingerprint: 214ba379
- concept: исполнитель цикла не содержит конкретного маршрута — порядок исполнителей принадлежит политике выбора
  question: 'В цикл, исполняющий решения политики выбора, добавили строку: если сообщений в состоянии ещё нет, всегда запускать исследователя, минуя вызов политики. Чем это плохо?'
  explanation: 'Разделение ролей — весь смысл этого примитива: цикл спрашивает, запускает, публикует и обновляет последнего говорившего, а решение принимает политика. Любое зашитое в цикл правило маршрута создаёт второй источник решений, и при отладке неверного порядка придётся искать причину в двух местах вместо одного.'
  kind: choice
  options:
    - 'Цикл станет медленнее: один вызов политики всё равно понадобится позже'
    - Часть маршрута переедет в исполнителя, и цикл перестанет одинаково исполнять любую политику — смена правил выбора будет требовать правки цикла
    - Исследователь начнёт получать неверную проекцию состояния
    - 'Ничем: первый исполнитель у любой политики выбора всё равно один и тот же'
  correct: 1
  id: 033-run-selector-2
  fingerprint: a0be3873
- concept: выход по лимиту ходов и выход по решению политики — разные исходы прогона и требуют разной реакции
  question: Цикл с лимитом в 8 ходов остановился, исчерпав лимит. Как это трактовать?
  explanation: Лимит — предохранитель, а не условие завершения задачи. Штатно цикл кончается тем, что политика вернула «следующего нет». Срабатывание предохранителя означает, что политика не умеет останавливаться на этой задаче, и чинить надо её, а не поднимать лимит.
  kind: choice
  options:
    - 'Как обычное завершение: лимит — штатный способ закончить прогон'
    - 'Как сигнал дефекта политики выбора: штатный выход — отказ политики назначить следующего исполнителя'
    - Как признак того, что агенты работали слишком медленно
    - 'Как переполнение общего состояния: лимит защищает пул сообщений от роста'
