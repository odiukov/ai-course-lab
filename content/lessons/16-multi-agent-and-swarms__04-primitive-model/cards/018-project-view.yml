- concept: критерий отбора в проекцию — влияние элемента на следующее действие роли, а не свежесть или объём истории
  question: В общем состоянии 140 сообщений. Агент проверяет утверждения на соответствие источникам. По какому правилу собирать его проекцию?
  explanation: 'Отбор по свежести или по объёму окна не связан с задачей: нужный источник может лежать в начале истории, а последние сообщения — оказаться спором о сроках. Правило формулируется от контракта роли: какие решения она принимает и какие данные для них обязательны.'
  kind: choice
  options:
    - Взять последние 20 сообщений — так контекст точно уложится в лимит
    - 'Взять всё, что может изменить следующее действие этой роли: проверяемые утверждения, связанные с ними источники и требования к результату'
    - Взять сообщения тех агентов, что работали непосредственно перед ним
    - Взять случайную выборку, равномерно покрывающую всю историю
  correct: 1
  id: 018-project-view-1
  fingerprint: 691a2a77
- concept: проекция — вид на общее состояние, сохраняющий авторов, связи и порядок, а не пересказ данных
  question: Почему проекция состояния не должна пересказывать или ужимать выбранные сообщения, а обязана отдавать их как есть — с авторами и в исходном порядке?
  explanation: Проекция — это вид, а не новый документ. Как только слой отбора начинает переформулировать, он превращается в ещё одного агента с собственными ошибками, и расхождение с общим состоянием становится невозможно отследить по журналу.
  kind: open
  reference: 'Проекция ограничивает объём, а не содержание: она отвечает на вопрос «что видно», а не «как это изложить». Пересказ теряет авторство (кто утверждал), связи между утверждением и источником и порядок, из которого видно, какая версия позднее. Пометка вроде «версия устарела» при ужатии исчезает первой, хотя именно она меняет решение. Кроме того, пересказ вносит изменения, которых нет в общем состоянии, и два агента начинают работать с расходящимися данными.'
  id: 018-project-view-2
  fingerprint: dfda73d2
- concept: 'правило проекции детерминировано: одна и та же роль при одном и том же состоянии получает один и тот же набор'
  question: Правило отбора для роли редактора при неизменном состоянии в разных запусках даёт разные наборы сообщений. Чем это плохо?
  explanation: 'Агент детерминирован своей конфигурацией, поэтому расхождение результатов должно объясняться данными. Недетерминированное правило отбора добавляет вторую неизвестную и делает отладку невозможной: сравнить нечего. Схема доступа должна быть функцией от состояния и роли.'
  kind: choice
  options:
    - 'Ничем: разнообразие входов повышает шансы, что нужный факт когда-нибудь попадёт в контекст'
    - 'Различие в поведении агента становится невозможно объяснить: неясно, отличается результат из-за модели или из-за случайного набора входа'
    - Это ломает потокобезопасность записи в общее состояние
    - Это увеличивает расход токенов, но на корректность не влияет
  correct: 1
  id: 018-project-view-3
  fingerprint: 7967215b
