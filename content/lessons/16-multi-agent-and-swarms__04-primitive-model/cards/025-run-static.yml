- concept: в статическом режиме отказ агента не меняет маршрут — сбой едет дальше как содержимое сообщения
  question: Второй агент фиксированного маршрута вернул бессмысленный ответ («данных нет»). Объясни своими словами, что произойдёт с оставшимися участниками маршрута и где это проявится.
  explanation: Фиксированный порядок гарантирует ход каждого участника и ничего не гарантирует про качество данных. Поэтому в статическом режиме деградация выглядит как нормальный прогон с испорченным содержимым пула, и ловить её надо проверками содержимого, а не кодом возврата.
  kind: open
  reference: 'Маршрут не изменится: следующий исполнитель определяется позицией в заданной последовательности, а не качеством предыдущего ответа. Бессмысленный ответ будет опубликован в общем состоянии и попадёт в проекции всех последующих агентов, то есть сбой распространится как содержимое, а не как ошибка выполнения. Прогон завершится успешно и пройдёт всех участников, а дефект будет виден только при чтении пула сообщений.'
