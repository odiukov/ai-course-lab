- concept: результат статического прогона — накопленное общее состояние, а не ответ последнего исполнителя
  question: Прогон фиксированного маршрута завершён. Что корректно считать результатом прогона?
  explanation: 'Каждый ход добавляет запись в общее состояние, и только там лежит вся работа команды вместе с авторством и порядком. Ответ последнего агента — одна запись из пула: по нему нельзя восстановить, что нашёл исследователь или что правил рецензент.'
  kind: choice
  options:
    - Ответ последнего агента маршрута — он видел больше всех данных
    - Накопленное общее состояние со всеми опубликованными сообщениями
    - Список имён агентов, которые успели отработать
    - Проекцию, собранную для первого агента маршрута
  correct: 1
