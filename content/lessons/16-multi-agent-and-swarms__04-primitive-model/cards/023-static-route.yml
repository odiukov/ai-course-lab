- concept: 'статический оркестратор не читает состояние: следующий исполнитель определяется позицией в заданной последовательности, поэтому неверный маршрут — дефект сборки'
  question: В системе со статическим маршрутом третий этап получил управление раньше второго. Где искать причину?
  explanation: 'Static — постоянная функция относительно состояния: во время выполнения выбирать нечего, следующий определяется позицией в объявленной последовательности. Значит, отклонение маршрута заложено в описании графа или очереди, а не в данных прогона и не в поведении агентов.'
  kind: choice
  options:
    - В содержимом общего состояния, которое сбило выбор
    - В конфигурации маршрута, зафиксированной при сборке системы
    - В системном промпте второго агента
    - В решении модели-селектора на этом переходе
  correct: 1
