- concept: пустая группа делает выбор исполнителя неопределённым, поэтому отклоняется при построении политики, а не при первом вызове
  question: Почему политику выбора говорящего для пустого списка агентов правильнее отклонить сразу при её создании, а не позволить упасть во время прогона?
  explanation: 'Это обычное правило раннего отказа: чем ближе ошибка к месту неверного ввода, тем дешевле диагностика. В координации это особенно важно, потому что падение внутри цикла смешивается с ошибками маршрутизации и содержания.'
  kind: open
  reference: 'Для пустой группы ни один ответ не является корректным: следующего исполнителя не существует, а «вернуть первого» некого. Если ошибку не отсечь при сборке, она проявится позже, внутри цикла оркестрации, как невнятный сбой доступа по индексу — далеко от места, где неверный аргумент был передан. Проверка при создании превращает неверную конфигурацию в понятный отказ на этапе сборки системы.'
