- concept: порядок обхода задан порядком элементов списка агентов, а не их ролями или именами
  question: Две команды собраны из одних и тех же пяти агентов, но переданы в политику циклического обхода в разном порядке. Что изменится в прогоне?
  explanation: 'Циклическая политика не знает ничего про смысл ролей — она работает с позициями в переданной последовательности. Значит, сама последовательность и есть спецификация маршрута: перестановка элементов меняет, кто чей контекст увидит, при том что промпты и инструменты не тронуты.'
  kind: choice
  options:
    - 'Ничего: обход опирается на роли агентов, а порядок в списке служит только для хранения'
    - Изменится последовательность вызовов агентов, хотя конфигурации самих агентов одинаковы
    - Изменится только первый исполнитель, дальше порядок выровняется по ролям
    - 'Прогон завершится ошибкой: одна и та же команда не может быть задана двумя порядками'
