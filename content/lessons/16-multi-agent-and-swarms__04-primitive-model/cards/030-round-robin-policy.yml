- concept: round-robin вычисляет исполнителя как позицию хода по модулю размера группы
  question: Группа из 7 участников, политика round-robin по фиксированному порядку. Первым ходит участник номер 1. Какой номер участника (от 1 до 7) будет говорить на 30-м ходе?
  explanation: Ход с номером M достаётся участнику с индексом (M − 1) mod N. Здесь (30 − 1) mod 7 = 29 mod 7 = 1, то есть второму по списку. Номер хода полностью задаёт исполнителя — читать содержимое пула не нужно.
  kind: numeric
  answer: 2
  tolerance: 0.5
  id: 030-round-robin-policy-1
  fingerprint: 26674c07
- concept: возврат к первому участнику после последнего реализуется остатком от деления на размер списка
  question: 'Реализация round-robin: как замкнуть список так, чтобы после последнего участника снова шёл первый?'
  explanation: 'Остаток от деления на размер группы превращает список в кольцо: индекс последнего плюс один даёт ноль. Без модуля политика упадёт с выходом за границы ровно на переходе от последнего участника к первому.'
  kind: cloze
  template: next_agent = agents[(agents.index(last_speaker) + 1) % ___]
  answer: len(agents)
