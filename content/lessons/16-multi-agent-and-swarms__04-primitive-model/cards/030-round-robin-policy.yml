- concept: round-robin не определён без отдельно заданного первого говорящего, потому что при пустой истории предыдущего нет
  question: Политика round-robin задана как «следующий за последним говорившим по фиксированному порядку». Почему одного этого правила недостаточно для запуска обсуждения?
  explanation: 'Round-robin — функция от последнего говорившего, а на старте этот вход не определён. Поэтому политика состоит из двух частей: назначенный первый исполнитель и правило перехода. Условие завершения (сколько кругов) задаётся снаружи и к выбору следующего отношения не имеет.'
  kind: choice
  options:
    - На первом ходе последнего говорившего не существует, поэтому первый исполнитель должен быть назначен отдельно
    - Правило не определяет, сколько кругов должно пройти обсуждение
    - Правило требует прочитать содержимое пула, а на старте пул пуст
    - Правило не работает, если участников больше двух
