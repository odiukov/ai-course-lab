- concept: возврат самого внутреннего списка наружу отменяет гарантию блокировки, потому что вызывающий изменит пул в обход неё
  question: Метод чтения пула возвращает вызывающему сам внутренний список сообщений. Почему это ломает потокобезопасность, хотя запись идёт под блокировкой?
  explanation: Гарантия держится, только если все изменения пула проходят через защищённый участок. Отданная наружу ссылка открывает второй, неконтролируемый путь записи. Наружу отдают копию, а внутреннюю структуру оставляют приватной.
  kind: choice
  options:
    - Чтение списка тоже требует блокировки, поэтому возвращать его нельзя никогда
    - Получатель ссылки может изменить список, не захватывая блокировку, — публикация перестаёт быть единственным путём изменения пула
    - 'Список нельзя передавать между потоками: каждый поток обязан иметь свою копию любых данных'
    - Возврат списка приводит к его сортировке на стороне вызывающего
  correct: 1
