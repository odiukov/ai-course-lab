- concept: handoff-маршрутизация обменивает гарантированный проход всех участников на решение модели о завершении, статический порядок эту гарантию сохраняет
  question: Один и тот же конвейер из трёх ролей (исследование → написание → проверка) прогнали статическим оркестратором и handoff-маршрутизацией. Статический прогон задействовал все три роли, handoff-прогон остановился после первой. Как это трактовать?
  explanation: 'Агенты и общее состояние в обоих прогонах одинаковые, меняется ровно одна переменная — оркестратор. Статический порядок задан кодом и проходится целиком; при handoff завершение решает модель, и она может остановиться раньше. Дешевле и быстрее — не значит правильнее: вы обменяли предсказуемость на решение модели.'
  kind: choice
  options:
    - 'Как баг реализации handoff: передача обязана дойти до последней роли'
    - 'Как ожидаемый компромисс: при handoff решение о продолжении принимает модель, поэтому проход всех участников не гарантирован'
    - Как признак того, что общее состояние потеряло сообщения между шагами
    - Как результат разных конфигураций агентов в двух прогонах
  correct: 1
