- concept: фреймворк без явного общего состояния не устраняет состояние, а переносит его в вызывающий код
  question: 'Фреймворк мультиагентной системы не предоставляет объекта общего состояния: агенты и передачи описываются, а хранилища нет. Что это означает на практике?'
  explanation: Скрыть общее состояние нельзя — можно только переложить его на вызывающий код. Централизующие фреймворки (checkpoint, пул сообщений) делают состояние наблюдаемым, но платят за это координацией записи. Скрывающие фреймворки экономят на API и отдают вам все связанные баги без инструментов наблюдения.
  kind: choice
  options:
    - Система работает без состояния, поэтому гонок и устаревших чтений в ней быть не может
    - Состояние всё равно есть, но живёт в вызывающем коде и остаётся ненаблюдаемым для фреймворка
    - Состояние автоматически хранится внутри каждого агента между вызовами
    - Состояние заменяется историей вызовов инструментов, которая неизменяема по определению
  correct: 1
  id: 014-stateful-core-1
  fingerprint: c1287962
- concept: план оркестратора, переживающий шаг, обязан лежать в общем состоянии, иначе появляется второе, скрытое хранилище
  question: Оркестратор строит план из семи шагов и должен помнить его до следующего вызова. Где этот план должен храниться, чтобы примитивы остались согласованными?
  explanation: 'Единственный примитив, который хранит состояние, — общее состояние. Как только оркестратор заводит поле, переживающее шаг, в системе появляется второе хранилище: ненаблюдаемое, невосстанавливаемое из снимка и рассинхронизирующееся с пулом. Плану место в общем состоянии.'
  kind: choice
  options:
    - Внутри оркестратора как его приватное поле — он и есть владелец плана
    - 'В общем состоянии: всё, что переживает отдельное действие, относится туда, а оркестратор остаётся планировщиком без памяти'
    - В системном промпте первого агента, чтобы план ехал вместе с передачей
    - В аргументах handoff — план передаётся от исполнителя к исполнителю и нигде не хранится
  correct: 1
  id: 014-stateful-core-2
  fingerprint: 81bf7dee
- concept: класс багов координации (устаревшее чтение, порядок записей, конкурентная запись) сосредоточен в общем состоянии, потому что остальные примитивы не хранят историю
  question: Два прогона с одними и теми же агентами, теми же правилами передачи и тем же оркестратором дали разные результаты. Объясни своими словами, почему диагностику начинают с общего состояния, а не с агентов.
  explanation: Из четырёх примитивов состояние хранит ровно один, и там же концентрируются отравление памяти, порядок сообщений, версионирование и гонки на запись. Одинаковые исполнители при разных данных ведут себя по-разному — это не признак недетерминированности агента.
  kind: open
  reference: 'Агент — функция от промпта и инструментов, handoff — вызов, оркестратор — планировщик: ни один из них не хранит историю, поэтому при одинаковых входах они дают одинаковое поведение. Различие между прогонами могло возникнуть только там, где данные переживают отдельное действие, — в общем состоянии: остаток от прошлого запуска, устаревшая версия, прочитанная агентом, конкурентная запись двух результатов или неожиданный порядок сообщений. Сравнивать нужно данные на входе исполнителей, а не самих исполнителей.'
  id: 014-stateful-core-3
  fingerprint: ce5ef2de
