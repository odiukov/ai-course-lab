- concept: при handoff-маршрутизации у оркестратора остаётся исполнение и передача контекста, но выбор следующего исполнителя из него уходит
  question: Объясни своими словами, что продолжает делать оркестратор, когда маршрут задаётся handoff'ами агентов, и что он перестаёт делать.
  explanation: 'Полезно как правило отладки: если выполнился не тот агент, смотреть надо на решение предыдущего агента, а не на код оркестратора — тот только исполняет названное.'
  kind: open
  reference: 'Оркестратор остаётся исполнительным механизмом: запускает названного агента, строит и передаёт ему представление общего состояния, публикует результат, ведёт цикл и его ограничения, а при отсутствии handoff завершает прогон. Он перестаёт принимать решение о том, кто следующий: имя следующего исполнителя приходит из handoff текущего агента, оркестратор лишь находит агента по этому имени.'
