- concept: длина handoff-маршрута сверху не ограничена, ограничитель числа ходов — обязательная часть цикла
  question: 'Два агента ошибочно передают управление друг другу без остановки. В цикле стоит ограничитель: не более 12 ходов агентов. Общее состояние на старте содержит 5 сообщений, каждый ход добавляет ровно одно. Сколько сообщений будет в пуле, когда прогон остановится?'
  explanation: '5 + 12 = 17. Само число не важно, важно, что остановку задаёт ограничитель, а не логика передач: взаимные handoff не сходятся сами, поэтому цикл без лимита не завершится никогда.'
  kind: numeric
  answer: 17
  tolerance: 0.5
  id: 027-run-handoff-1
  fingerprint: f2d60391
- concept: весь маршрутный контекст handoff-цикла сводится к одной переменной «текущий исполнитель»
  question: Цикл handoff-маршрутизации публикует ответ и решает, продолжать ли. Какую переменную обновляет последняя строка?
  explanation: 'В handoff-режиме оркестратор не хранит ни списка остановок, ни указателя позиции: единственное маршрутное состояние — кто ходит сейчас. Каждая итерация перезаписывает его тем, кого назвал текущий исполнитель, а отсутствие handoff завершает прогон.'
  kind: cloze
  template: |-
    state = post(state, result.message)
    if result.handoff is None:
        break
    ___ = result.handoff.to_agent
  answer: current
  accept:
    - current_agent
    - current agent
    - текущий агент
  id: 027-run-handoff-2
  fingerprint: c5a07b6d
- concept: подстановка маршрута по умолчанию при отсутствии handoff маскирует ошибку маршрутизации модели
  question: 'Агент часто не возвращает handoff, и прогон обрывается на первом же ходе. Разработчик добавляет запасное правило: если handoff нет, брать следующего агента из заранее записанного списка. Каково главное последствие?'
  explanation: Запасной список — это скрытый статический маршрут поверх handoff. Симптом (короткий прогон) исчезает, а причина — агент не умеет назвать следующего исполнителя — остаётся и больше ничем себя не выдаёт. Диагностировать нужно решение агента, а не подпирать его умолчанием.
  kind: choice
  options:
    - Ошибки маршрутизации агента перестают быть видны — прогон всегда выглядит полным, хотя решение агента подменено
    - Агент начинает чаще возвращать корректный handoff, потому что видит больше контекста
    - Общее состояние перестаёт расти, так как запасное правило не публикует сообщений
    - Прогон становится недетерминированным, потому что запасной список читается моделью
  correct: 0
  id: 027-run-handoff-3
  fingerprint: 132ef84f
