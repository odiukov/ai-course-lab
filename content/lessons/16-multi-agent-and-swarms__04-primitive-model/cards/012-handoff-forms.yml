- concept: 'в разных формах набор допустимых маршрутов объявлен в разных местах: схемы инструментов, рёбра, состав группы'
  question: Нужно добавить нового агента-получателя, не трогая инструменты существующих агентов. Какая форма handoff это позволяет?
  explanation: В стиле function return (OpenAI Swarm) допустимые маршруты фактически перечислены среди инструментов агента, поэтому новый получатель — это новый инструмент в его схеме. В графовом стиле рёбра описаны декларативно, и добавление узла с ребром агентов не касается.
  kind: choice
  options:
    - 'Function return: инструмент возвращает следующего агента'
    - 'Graph edge: маршруты объявлены как рёбра отдельно от агентов'
    - Любая — маршруты всегда хранятся вне агентов
    - 'Никакая: новый маршрут всегда требует нового инструмента'
  correct: 1
  id: 012-handoff-forms-1
  fingerprint: 37edabde
- concept: форма handoff определяет, чьё решение виновато в неверном маршруте
  question: Задача ушла не тому агенту. Система построена в стиле function return. Где искать причину в первую очередь?
  explanation: Выбор маршрута лежит там, где принимается решение. При function return его принимает модель, выбирая инструмент, поэтому чинят промпт и описания инструментов. При graph edge виноват ваш код условия, при speaker selection — селектор.
  kind: choice
  options:
    - В условиях маршрутизации в коде графа
    - В функции-селекторе говорящего
    - 'В решении модели, какой инструмент вызвать: в её промпте и в схемах/описаниях инструментов-маршрутов'
    - 'В общем состоянии: там повреждён пул сообщений'
  correct: 2
  id: 012-handoff-forms-2
  fingerprint: 3c97f7ab
- concept: в графовой форме модель выдаёт значение, а следующего исполнителя выбирает условие на ребре
  question: Расставь по порядку, что происходит при передаче управления через ребро графа.
  explanation: 'Ключевой момент — второй шаг: сама по себе метка от модели никого не запускает. Маршрут применяет декларативно описанное ребро, поэтому ответственность за неверный переход лежит на коде графа, а не на модели.'
  kind: order
  items:
    - Текущий узел отрабатывает и модель возвращает значение-метку, например "payment"
    - Условие на исходящих рёбрах сопоставляет метку с целевым узлом
    - Граф делает целевой узел текущим и запускает его агента
  id: 012-handoff-forms-3
  fingerprint: 2bb3798c
