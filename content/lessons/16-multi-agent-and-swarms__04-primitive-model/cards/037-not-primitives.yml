- concept: human-in-the-loop — проверка, вставленная перед выполнением передачи хода, а не новый вид взаимодействия
  question: 'В систему добавили обязательное подтверждение человеком: без нажатия «одобрить» передача хода между агентами не выполняется. Что изменилось в устройстве системы?'
  explanation: 'Одобрение — предикат вокруг существующего handoff: маршрут, состав участников и хранилище остаются теми же, меняется лишь условие срабатывания передачи. Человек здесь не агент с промптом и инструментами, а вентиль на уже описанном переходе.'
  kind: choice
  options:
    - 'Ничего в наборе примитивов: добавлена проверка, которая пропускает или блокирует уже существующую передачу хода'
    - Появился новый примитив — «человек-участник», равноправный с агентами
    - Передача хода перестала быть примитивом, её роль перешла к общему состоянию
    - 'Появилась новая ось: маршрут теперь вычисляется не системой, а внешним источником'
  correct: 1
  id: 037-not-primitives-2
  fingerprint: 30f2f85d
- concept: надстройки меняют условия эксплуатации (что сохранять, что разрешать, сколько тратить, что записывать), а не устройство взаимодействия — это проверяется мысленным отключением
  question: Объясни своими словами, какой мысленный эксперимент отличает эксплуатационную надстройку (трассировка, лимит расходов, чекпоинт) от настоящего примитива архитектуры.
  explanation: Тест на отключение — практическая форма вопроса «добавляет ли фича независимую ось?». Надстройка снимается без переписывания топологии; примитив — нет.
  kind: open
  reference: 'Надо мысленно выключить возможность и посмотреть, изменится ли устройство взаимодействия. Если убрать трассировку — последовательность исполнителей, содержимое хранилища и переходы останутся прежними, пострадает только расследование сбоя. Если убрать лимит расходов — агент продолжит работать, просто сможет потратить больше. Если убрать долговечный чекпоинт — состав состояния тот же, теряется только переживание перезапуска. Значит, эти вещи задают условия эксплуатации: что сохранять, что разрешать, сколько тратить и что записывать. Настоящий примитив так выключить нельзя: убери исполнителя, хранилище, передачу хода или решение о следующем ходе — и описать работу системы станет нечем.'
  id: 037-not-primitives-3
  fingerprint: e415e4ba
