- concept: приписать разницу в исходах прогонов конкретному примитиву можно только если между прогонами изменён ровно один примитив
  question: Сравнивая два прогона одной команды агентов, инженер одновременно заменил способ выбора следующего исполнителя и правило отбора данных в контекст агента. Второй прогон отработал вдвое дешевле. Какой вывод правомерен?
  explanation: 'Это обычное требование к контролируемому сравнению: если варьируются две переменные, наблюдаемая разница — их смесь, включая возможную компенсацию (одно изменение ухудшило, другое перекрыло). Чтобы измерить чистый вклад примитива, остальные три фиксируют и меняют по одному.'
  kind: choice
  options:
    - Новый способ выбора исполнителя дешевле — он отвечает за число вызовов
    - Новое правило отбора данных дешевле — оно отвечает за объём контекста
    - 'Никакой: изменены две ручки, и вклад каждой из них по этим двум прогонам не разделяется'
    - Оба изменения полезны, потому что итог улучшился
  correct: 2
  id: 034-controlled-comparison-1
  fingerprint: 8cab1bef
- concept: каждый прогон сравнения должен стартовать со своего свежего общего состояния, иначе записи предыдущего прогона протекают в следующий
  question: Три режима маршрутизации сравнивают на одной команде агентов, переиспользуя один и тот же объект общего состояния для всех прогонов подряд. Что произойдёт с результатами?
  explanation: 'Одинаковое устройство состояния и одно и то же наполненное состояние — разные вещи. Общее состояние — единственное место, где живёт история, поэтому оно и есть канал утечки между прогонами: агент во втором прогоне увидит чужие сообщения и поведёт себя иначе. Каждый прогон получает свой пустой экземпляр.'
  kind: choice
  options:
    - 'Ничего: агенты и режимы всё равно остаются одинаковыми'
    - Второй и третий прогоны стартуют с историей чужих прогонов в контексте, и разница в исходах перестаёт объясняться только сменой режима
    - 'Сравнение станет точнее: общее состояние накапливает больше данных для агентов'
    - 'Прогоны завершатся ошибкой: общее состояние нельзя использовать дважды'
  correct: 1
  id: 034-controlled-comparison-2
  fingerprint: 230a90c5
