- concept: добавление сообщения в общее состояние выполняется как построение новой версии состояния поверх прежней
  question: Расставь шаги безопасного добавления сообщения в общее состояние мультиагентной системы в правильном порядке.
  explanation: 'Общее состояние растёт вперёд: старые записи не переписываются, новая идёт в конец, а поля вроде artifacts и context переносятся как есть. Возврат новой версии вместо правки старой сохраняет различимость «до» и «после».'
  kind: order
  items:
    - Взять прежний список сообщений из переданного состояния
    - 'Построить новый список: прежние сообщения в прежнем порядке, новое сообщение последним'
    - Собрать новую версию состояния с этим списком, перенеся остальные поля без изменений
    - Вернуть новую версию состояния, оставив исходную нетронутой
  id: 015-post-message-1
  fingerprint: 7f12cf04
- concept: мутация переданного списка сообщений на месте делает снимки состояния неразличимыми для всех владельцев ссылки
  question: 'Оркестратор сохранил снимок общего состояния до вызова агента: 9 сообщений. После вызова снимок «до» тоже показывает 10 сообщений. Что произошло?'
  explanation: 'Снимок хранил не копию, а ссылку. Правка списка на месте видна всем владельцам ссылки сразу, поэтому версии «до» и «после» схлопываются в одну. Новая реплика выглядит так, будто существовала всегда — отсюда трудноуловимые баги. Лечение: новый список и новая версия состояния.'
  kind: choice
  options:
    - Функция добавления изменила переданный список сообщений на месте, а снимок хранил ссылку на тот же объект
    - Агент вернул сообщение с более ранней временной меткой, и оно встало в начало потока
    - Снимок был сделан после вызова агента, а не до него
    - Поле artifacts перезаписало поле messages при сборке состояния
  correct: 0
