- concept: поля общего состояния помимо messages должны переноситься в новую версию без изменений
  question: Почему при добавлении реплики в общее состояние недостаточно вернуть объект с одним полем messages? Объясни своими словами.
  explanation: Добавление реплики — локальная операция над одним полем. Всё, что не относится к потоку сообщений, должно дойти до следующего агента нетронутым, иначе часть общей памяти системы исчезает молча.
  kind: open
  reference: 'Общее состояние — не только список сообщений: там же лежат структурированные артефакты (выходы задач) и типизированный контекст (настройки, ограничения). Возврат объекта только с messages стирает эти поля для всех, кто читает состояние дальше: следующий агент теряет артефакты предыдущих шагов и настройки запуска. Новая версия обязана нести прежние artifacts и context как есть — меняется ровно одно поле, остальное переносится без изменений.'
  id: 015-post-message-3
  fingerprint: 49befb86
