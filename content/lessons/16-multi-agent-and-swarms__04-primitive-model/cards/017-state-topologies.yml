- concept: full pool и projected state обменивают затраты на проектирование схемы на затраты токенов при работе
  question: Чем full pool отличается от projected state по цене?
  explanation: 'Обмен идёт в обе стороны. Full pool экономит усилия архитектора: раздавать нечего, всё видят всё. Projected state экономит токены и внимание модели, но требует заранее решить, что каждой роли положено видеть. Ошибка в схеме дорога: широкая проекция возвращает шум, узкая скрывает нужный факт.'
  kind: choice
  options:
    - Full pool ничего не требует при проектировании, но платит токенами на каждом вызове; projected state требует заранее спроектированной схемы, зато держит контекст коротким
    - Full pool дешевле по токенам, но требует схемы доступа; projected state дороже по токенам, зато проектируется сам
    - Обе топологии стоят одинаково по токенам, различие только в способе хранения истории
    - Projected state дешевле по обоим пунктам, поэтому full pool применяют только по историческим причинам
  correct: 0
