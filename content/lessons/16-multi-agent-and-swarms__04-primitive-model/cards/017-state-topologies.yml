- concept: затраты full pool растут быстрее линейного, потому что с командой растут и длина истории, и число вызовов
  question: Почему стоимость full pool растёт быстрее, чем просто пропорционально числу агентов? Объясни своими словами.
  explanation: Ключ в том, что full pool множит два роста друг на друга. Хранение остаётся дешёвым; дорого именно повторное чтение всей истории на каждом вызове, включая чужую работу, не влияющую на действие текущей роли.
  kind: open
  reference: 'С добавлением агентов растут сразу две величины. Во-первых, длина общей истории: каждый новый участник пишет свои сообщения в тот же пул. Во-вторых, число вызовов за цикл: участников больше, значит контекст читают чаще. Каждый вызов тащит всю историю целиком, поэтому суммарный объём переданных токенов ведёт себя как произведение этих двух ростов, а не как сумма. Проблема при этом не в хранении — пул на диске мал, — а в многократной передаче одних и тех же данных каждому исполнителю.'
  id: 017-state-topologies-3
  fingerprint: 0ae793bb
