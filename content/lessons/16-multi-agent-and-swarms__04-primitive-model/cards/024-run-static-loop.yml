- concept: 'один шаг цикла статического оркестратора: выбор по очереди, сборка проекции, ход агента, публикация результата, сдвиг указателя'
  question: Расставь по порядку действия одной итерации статического оркестратора.
  explanation: 'Публикация обязана предшествовать сдвигу указателя: следующий исполнитель строит свою проекцию уже из обновлённого пула. Если поменять два последних шага местами, преемник получит состояние без результата предшественника.'
  kind: order
  items:
    - оркестратор берёт следующего агента из заранее заданной последовательности
    - для этого агента собирается проекция общего состояния
    - агент выполняет ход и возвращает результат
    - результат публикуется в общее состояние
    - указатель последовательности сдвигается к следующему агенту
  id: 024-run-static-loop-1
  fingerprint: c4215bec
- concept: 'фиксированный маршрут гарантирует ход каждого этапа, но не наличие нужных данных: передача управления и передача информации — разные механизмы'
  question: 'В статическом конвейере из трёх этапов последний этап отработал, но его вывод пуст по существу: он ничего не разобрал. В журнале видно, что все этапы получили управление. Что проверять первым?'
  explanation: Фиксированная последовательность отвечает только за то, что каждый исполнитель получит ход. Данные доходят другим механизмом — записью в общее состояние и правилом проекции. Отработавший, но пустой этап указывает на разрыв в публикации или в проекции, а не в маршруте.
  kind: choice
  options:
    - Не был ли маршрут динамически переопределён во время выполнения
    - Попал ли результат предыдущего этапа в общее состояние и виден ли он в проекции последнего
    - Достаточно ли у последнего агента прав вызывать оркестратор
    - Не решил ли предыдущий агент завершить работу досрочно
  correct: 1
