- concept: дедлок и нормальное завершение дают одинаковую наблюдаемую картину, различает их наличие незакрытой ожидаемой работы
  question: 'Тайм-аут сработал: 45 секунд очередь пуста и никто не занят. Что позволяет отличить дедлок от нормального завершения прогона?'
  explanation: 'Внешне оба исхода выглядят одинаково: пустая очередь, никто не работает, ошибок нет. Различие даёт только ожидаемая работа — незавершённое задание или зависимость, которую некому удовлетворить. Тайм-аут сам по себе причину не называет.'
  kind: choice
  options:
    - 'Наличие незакрытого задания или неудовлетворённой зависимости: если ожидаемая работа осталась — это дедлок, если цель достигнута — конец'
    - 'Длительность тишины: при дедлоке она всегда больше'
    - Число воркеров, простаивающих в момент срабатывания тайм-аута
    - Загрузка процессора в момент срабатывания тайм-аута
  correct: 0
