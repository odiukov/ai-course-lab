- concept: дедлок ожидания не порождает исключения, поэтому требует отдельного детектора, а не обработчика ошибок
  question: Почему взаимная блокировка воркеров, ждущих задания друг от друга, не проявляется как ошибка выполнения, и что из этого следует для реализации?
  explanation: Дедлок — свойство системы, а не одного участника, поэтому и обнаруживается на уровне оркестратора, наблюдающего очередь и состояние всех воркеров.
  kind: open
  reference: 'Каждый воркер ведёт себя корректно: он ждёт задание — это штатная операция, а не сбой. Исключения не бросается, процесс жив, нагрузка около нуля, журнал просто перестаёт пополняться. Поэтому обработчик ошибок такой случай не поймает: нужен отдельный наблюдатель, который следит за системой целиком — за пустотой очереди и занятостью всех воркеров — и останавливает прогон по тайм-ауту. Без такого детектора прогон висит бесконечно; с ним бесконечное молчание превращается в обнаруживаемый и отчитываемый исход.'
  id: 039-queue-deadlock-3
  fingerprint: a4ca0191
