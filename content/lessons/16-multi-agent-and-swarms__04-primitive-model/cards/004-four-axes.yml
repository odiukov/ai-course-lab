- concept: фреймворк задаёт значения по умолчанию на осях, а не закрытый список возможных архитектур
  question: Нужной архитектуры нет среди готовых шаблонов выбранного фреймворка. Какой вывод корректен?
  explanation: Фреймворк выбирает значения по умолчанию на каждой оси, а не изобретает новые сущности. Отсутствие готовой кнопки говорит про набор пресетов, а не про границы пространства проектирования.
  kind: choice
  options:
    - Архитектура невозможна в этом фреймворке — нужен другой инструмент
    - Скорее всего, нужно изменить значение по умолчанию на одной-двух осях поверх стандартного поведения
    - Отсутствие шаблона означает, что такая комбинация примитивов противоречива
    - Придётся заменить всех агентов, потому что шаблон определяет их роли
  correct: 1
  id: 004-four-axes-1
  fingerprint: b5b1790d
- concept: сравнивать фреймворки продуктивно по их значениям по умолчанию на каждой оси, а не по названиям и API
  question: Как продуктивнее всего сравнить два мультиагентных фреймворка?
  explanation: Одинаковая точка в пространстве проектирования означает одинаковое поведение при разном синтаксисе. Названия классов и терминология относятся к упаковке, поэтому сравнение по ним мало что говорит о поведении системы.
  kind: choice
  options:
    - 'Сопоставить их значения по умолчанию на каждой из осей: agent, handoff, shared state, orchestrator'
    - Сравнить количество классов и методов в публичном API
    - Сравнить терминологию документаций и выбрать более понятную
    - 'Сравнить дату выхода: более поздний фреймворк использует более правильную абстракцию'
  correct: 0
