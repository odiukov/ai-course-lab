- concept: фабрика сохраняет ссылку на политику, а не вызывает её
  question: Внутри фабрики агента политику записали как `policy=policy()` вместо `policy=policy`. Что сломается?
  explanation: 'Фабрика собирает конфигурацию, а не исполняет её. На момент сборки нет ни задачи, ни общего состояния, поэтому вызывать политику нечем: в поле должна лежать ссылка на функцию, которую агент вызовет позже.'
  kind: choice
  options:
    - 'Ничего: результат вызова эквивалентен самой функции'
    - Политика исполнится в момент сборки, без задачи и состояния, и в агент попадёт её результат вместо поведения
    - Агент потеряет имя, потому что политика перезапишет остальные поля
    - Инструменты станут изменяемыми
