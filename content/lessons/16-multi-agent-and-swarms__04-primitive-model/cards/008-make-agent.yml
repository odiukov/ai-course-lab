- concept: проверка неизменяемости конфигурации проводится мутацией исходных аргументов после сборки
  question: Каким тестом надёжнее всего доказать, что фабрика не оставила агенту изменяемую конфигурацию?
  explanation: 'Тип результата и равенство полей ничего не говорят про алиасинг. Утечку ловит только мутация исходного аргумента после сборки: если у агента появились новые инструменты, значит внутрь попал тот же самый список, а не копия.'
  kind: choice
  options:
    - Собрать агента, дописать в исходный список ещё 5 инструментов и убедиться, что у агента их число не изменилось
    - Собрать двух агентов с одинаковыми аргументами и сравнить их через ==
    - Запустить агента и проверить, что он отвечает
    - Проверить, что фабрика возвращает объект типа Agent
