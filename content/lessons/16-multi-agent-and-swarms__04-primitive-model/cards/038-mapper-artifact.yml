- concept: 'процедура обновления раскладки: наследование прежней версии, поосевая перепроверка по документации, фиксация расхождений, простановка версии и даты'
  question: Расставь по порядку шаги обновления раскладки по примитивам при переходе на новую версию фреймворка.
  explanation: Смысл артефакта — получить содержательный diff. Он возможен только если новая раскладка наследует структуру старой, каждое значение подтверждено документацией именно новой версии, а неподтверждённое помечено пробелом, а не догадкой. Версия и дата фиксируют, к чему относится проверка.
  kind: order
  items:
    - Скопировать существующую раскладку как основу для новой версии
    - По каждому из четырёх разделов найти в документации новой версии сущность, которая реализует примитив
    - Отметить расхождения с прежними значениями и оставить явный пробел там, где подтверждения нет
    - Проставить номер новой версии и дату проверки
    - Сравнить две раскладки и оценить, что из изменений затрагивает вашу систему
