- concept: невозможность заполнить раздел раскладки — проверяемый сигнал о неполной документации или о непривычном виде общего состояния
  question: 'При составлении раскладки нового фреймворка раздел про общее состояние заполнить не удалось: непонятно, где живут данные, которые видят несколько агентов. Что означает этот пробел и как с ним поступить?'
  explanation: 'Раскладка ценна тем, что делает незнание видимым: пустой раздел — единица работы, а заполненный наугад — скрытый дефект архитектурного документа.'
  kind: open
  reference: 'Пробел оставляют явным, а не закрывают догадкой. Он означает одно из двух: документация неполна и нужный механизм просто не описан, либо состояние спрятано в непривычной форме — например, вынесено в вызывающий код, в хост-приложение или в нестандартное хранилище, которое не называют состоянием. Пятый примитив здесь крайне маловероятен; проверять надо именно вид общего состояния. Записанный пробел превращает неизвестность в конкретный вопрос к автору фреймворка или в задачу на эксперимент, тогда как правдоподобная догадка маскирует его и всплывает позже как ошибка проекта.'
