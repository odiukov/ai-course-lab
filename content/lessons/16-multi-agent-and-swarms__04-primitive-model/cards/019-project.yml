- concept: пустая проекция — корректный результат, а не повод вернуть весь пул или бросить ошибку
  question: Агент подключается к системе, когда в общем пуле уже есть записи, но ни одна из них не общая и ни одна не адресована ему. Как должна повести себя корректная функция проекции?
  explanation: Проекция — чистый отбор по правилу; отсутствие подходящих записей означает ровно ноль записей. Откат к полному пулу возвращает тот самый шум, ради устранения которого проекция и вводилась, а исключение делает нормальную ситуацию аварийной. Решать, что делать с пустым входом, — задача агента или оркестратора, а не фильтра.
  kind: choice
  options:
    - Вернуть пустую коллекцию
    - Вернуть весь пул, раз отобрать нечего
    - 'Бросить исключение: агент без контекста не может ходить'
    - Вернуть последнее сообщение пула как минимальный контекст
  correct: 0
