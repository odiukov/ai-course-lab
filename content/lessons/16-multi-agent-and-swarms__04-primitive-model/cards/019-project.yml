- concept: проекция агента = широковещательные записи плюс адресованные лично ему; адресные записи других участников в неё не попадают
  question: 'В общем пуле 17 сообщений: 7 без адресата (видны всем), 5 адресованы агенту `auditor`, 5 адресованы другим агентам. Сколько сообщений вернёт проекция для `auditor`?'
  explanation: '7 общих + 5 адресных = 12. Чужие адресные записи отсекаются, но общие остаются: агент не теряет фон работы команды. Это и есть два условия фильтра, объединённые по «или».'
  kind: numeric
  answer: 12
  tolerance: 0.5
