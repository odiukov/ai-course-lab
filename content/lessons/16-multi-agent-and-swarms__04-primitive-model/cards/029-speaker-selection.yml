- concept: 'селектор решает исключительно по опубликованному состоянию: неопубликованная работа агента не может повлиять на выбор следующего говорящего'
  question: Агент выполнил работу, но её результат остался внутри его вызова и в общее состояние не записан. Объясни, как это отразится на решении селектора говорящего.
  explanation: 'Отсюда практическое правило порядка: публикация результата предшествует выбору следующего говорящего, иначе маршрут строится по устаревшему срезу состояния.'
  kind: open
  reference: 'Селектор читает только общее состояние и информацию о последнем говорившем. Неопубликованный результат для него не существует, поэтому выбор будет сделан так, будто работы не было: селектор может снова назначить того же агента, отправить ход дальше по устаревшим данным или завершить обсуждение. Чтобы результат влиял на маршрут, он должен быть опубликован в состоянии до следующего решения.'
