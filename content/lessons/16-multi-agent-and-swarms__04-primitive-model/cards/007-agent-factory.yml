- concept: два агента с одинаковыми промптом и инструментами дают одинаковый результат — агент детерминирован своей конфигурацией, а не своей историей
  question: Объясни своими словами, почему в этой модели нельзя «прогреть» отдельного агента, прогнав его через десяток задач перед боевым запуском.
  explanation: 'Отсутствие внутреннего состояния — не деталь реализации, а свойство примитива: оно и делает агентов заменяемыми и позволяет собирать их фабрикой на лету.'
