- concept: 'у агента нет собственной памяти: всё, что похоже на его состояние, лежит снаружи'
  question: Агент в диалоге ссылается на факт, который сам добыл 5 ходов назад. Где на самом деле хранится этот факт?
  explanation: 'В формуле агента нет слота под память: только промпт, инструменты, модель и имя. Всё, что выглядит как состояние конкретного агента, физически лежит в общем состоянии или приходит в payload передачи управления.'
  kind: choice
  options:
