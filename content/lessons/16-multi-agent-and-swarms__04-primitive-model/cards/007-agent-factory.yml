  reference: 'Агент — неизменяемая конфигурация (промпт, инструменты, модель, имя). У него нет поля, куда осел бы опыт прошлых запусков: после каждого хода объект остаётся прежним. «Прогрев» может изменить только внешнее — накопленное общее состояние или содержимое prompt/tools, которые придётся собрать заново. Поэтому свежесобранный агент с теми же полями ведёт себя так же, как «прогретый».'
