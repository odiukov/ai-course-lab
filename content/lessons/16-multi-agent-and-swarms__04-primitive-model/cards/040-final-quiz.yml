- concept: оркестратор определяется ролью «решает, кто работает следующим», а не природой реализации — им может быть обычный код без модели
  question: 'В системе следующего исполнителя определяет функция на обычном коде: она читает поля состояния и по условиям возвращает имя. Модель при этом не вызывается. Чем является эта функция?'
  explanation: Оркестратор — тот, кто решает порядок исполнителей; LLM-селектор лишь одна из его реализаций наряду со статическим графом, handoff-driven и queue-driven. Агент — конфигурация из промпта, инструментов и модели, и «умный координатор» вовсе не обязан ею быть.
  kind: choice
  options:
    - 'Оркестратором: примитив определяется ролью «кто работает следующим», а не тем, участвует ли LLM'
    - Агентом, потому что любой активный участник системы — агент
    - Частью общего состояния, потому что функция читает его поля
    - Handoff'ом, потому что функция возвращает имя следующего исполнителя
  correct: 0
  id: 040-final-quiz-1
  fingerprint: 6e722d99
- concept: shared state — единственная stateful часть системы, поэтому его снимка достаточно, чтобы восстановить прогон
  question: Прогон мультиагентной системы упал на середине. Почему для его восстановления или повторного проигрывания достаточно снимка общего состояния плюс конфигураций?
  explanation: Именно это делает общее состояние и точкой восстановления, и точкой, где сосредоточены баги координации.
  kind: open
  reference: 'Из четырёх примитивов состояние есть только у общего состояния. Агент — тройка из системного промпта, инструментов и модели, между вызовами он ничего не помнит. Handoff — разовое событие передачи: он порождает запись, но сам ничего не хранит. Оркестратор — правило выбора следующего исполнителя, вычислимое по состоянию и последнему говорившему. Значит, вся накопленная история прогона лежит в одном месте, и восстановив снимок вместе с неизменными конфигурациями, можно продолжить или повторить прогон — вытаскивать что-то «изнутри» агентов не нужно, там ничего нет.'
  id: 040-final-quiz-2
  fingerprint: 8c1909ab
