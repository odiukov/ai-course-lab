<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пространство проектирования мультиагентной системы</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fc;
      --text: #182033;
      --muted: #5e687d;
      --guide: #cbd2df;
      --agent: #3976d8;
      --handoff: #c35d22;
      --state: #16866f;
      --orchestrator: #8b55bf;
      --framework-a: #315fba;
      --framework-b: #a94f24;
      --framework-c: #14745f;
      --framework-d: #7546a4;
      --framework-e: #a23c67;
      --framework-f: #566171;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131722;
        --text: #eef2fb;
        --muted: #aeb8ca;
        --guide: #3e4758;
        --agent: #78a9ff;
        --handoff: #ff9b65;
        --state: #5dd2b5;
        --orchestrator: #c89af0;
        --framework-a: #78a9ff;
        --framework-b: #ff9b65;
        --framework-c: #5dd2b5;
        --framework-d: #c89af0;
        --framework-e: #f080ae;
        --framework-f: #b7c1d2;
      }
    }

    html,
    body {
      background: var(--bg);
      color: var(--text);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    h2 {
      color: var(--text);
      font-size: 20px;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 440px;
      overflow: visible;
      background: var(--bg);
      font-family: inherit;
    }

    .design-ring {
      fill: none;
      stroke: var(--guide);
    }

    .axis {
      fill: none;
      stroke-linecap: round;
    }

    .axis-agent {
      color: var(--agent);
    }

    .axis-handoff {
      color: var(--handoff);
    }

    .axis-state {
      color: var(--state);
    }

    .axis-orchestrator {
      color: var(--orchestrator);
    }

    .axis-line,
    .axis-end {
      stroke: currentColor;
    }

    .axis-end {
      fill: var(--bg);
    }

    .axis-core {
      fill: currentColor;
    }

    .axis-label {
      fill: currentColor;
      font-weight: bold;
    }

    .axis-note {
      fill: var(--muted);
    }

    .hub-outer {
      fill: var(--bg);
      stroke: var(--text);
    }

    .hub-inner {
      fill: var(--text);
    }

    .framework-halo {
      fill: var(--bg);
      stroke: var(--guide);
    }

    .framework-dot {
      stroke: var(--bg);
    }

    .tone-a {
      fill: var(--framework-a);
    }

    .tone-b {
      fill: var(--framework-b);
    }

    .tone-c {
      fill: var(--framework-c);
    }

    .tone-d {
      fill: var(--framework-d);
    }

    .tone-e {
      fill: var(--framework-e);
    }

    .tone-f {
      fill: var(--framework-f);
    }

    .framework-label {
      fill: var(--text);
      font-weight: bold;
    }

    .caption {
      fill: var(--muted);
      font-weight: bold;
    }

    .fallback {
      fill: var(--text);
    }

    noscript {
      color: var(--text);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main>
    <h2 id="diagram-heading">Пространство проектирования мультиагентной системы</h2>

    <svg
      id="diagram"
      viewBox="0 0 1200 440"
      width="1200"
      height="440"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-heading diagram-desc"
    >
      <desc id="diagram-desc">
        Четыре независимые оси проектирования и шесть фреймворков как готовые
        стартовые комбинации их настроек.
      </desc>
    </svg>

    <noscript>
      Схема должна показать четыре оси — «Агент», «Передача управления»,
      «Общее состояние» и «Оркестратор» — и точки шести фреймворков вокруг них.
    </noscript>
  </main>

  <script>
    const data = [
      {
        kind: "caption",
        point: { x: 0, y: -3.65 },
        text: "Одни оси — разные стартовые комбинации",
        anchor: "middle",
        dx: 0,
        dy: 0
      },
      {
        kind: "ring",
        point: { x: 0, y: 0 },
        rx: 8.65,
        ry: 3.12
      },
      {
        kind: "axis",
        className: "axis-agent",
        from: { x: 0, y: 0 },
        to: { x: 0, y: -2.15 },
        endRadius: 0.19,
        coreRadius: 0.08,
        label: "Агент",
        note: "роль и инструменты",
        anchor: "middle",
        labelDx: 0,
        labelDy: -14,
        noteDx: 0,
        noteDy: 16
      },
      {
        kind: "axis",
        className: "axis-handoff",
        from: { x: 0, y: 0 },
        to: { x: 3.42, y: 0 },
        endRadius: 0.19,
        coreRadius: 0.08,
        label: "Передача управления",
        note: "кто передаёт ход",
        anchor: "start",
        labelDx: 14,
        labelDy: -7,
        noteDx: 14,
        noteDy: 15
      },
      {
        kind: "axis",
        className: "axis-state",
        from: { x: 0, y: 0 },
        to: { x: 0, y: 2.15 },
        endRadius: 0.19,
        coreRadius: 0.08,
        label: "Общее состояние",
        note: "что доступно команде",
        anchor: "middle",
        labelDx: 0,
        labelDy: 22,
        noteDx: 0,
        noteDy: 43
      },
      {
        kind: "axis",
        className: "axis-orchestrator",
        from: { x: 0, y: 0 },
        to: { x: -3.42, y: 0 },
        endRadius: 0.19,
        coreRadius: 0.08,
        label: "Оркестратор",
        note: "кто выбирает следующего",
        anchor: "end",
        labelDx: -14,
        labelDy: -7,
        noteDx: -14,
        noteDy: 15
      },
      {
        kind: "hub",
        point: { x: 0, y: 0 },
        outerRadius: 0.31,
        innerRadius: 0.11
      },
      {
        kind: "framework",
        point: { x: -6, y: -2.55 },
        radius: 0.15,
        outerRadius: 0.27,
        text: "Google ADK",
        anchor: "end",
        dx: -13,
        dy: 5,
        tone: "tone-f"
      },
      {
        kind: "framework",
        point: { x: 6, y: -2.55 },
        radius: 0.15,
        outerRadius: 0.27,
        text: "OpenAI Agents SDK",
        anchor: "start",
        dx: 13,
        dy: 5,
        tone: "tone-a"
      },
      {
        kind: "framework",
        point: { x: -8, y: -0.75 },
        radius: 0.15,
        outerRadius: 0.27,
        text: "Microsoft Agent Framework",
        anchor: "start",
        dx: 13,
        dy: 5,
        tone: "tone-e"
      },
      {
        kind: "framework",
        point: { x: 8, y: -0.75 },
        radius: 0.15,
        outerRadius: 0.27,
        text: "AutoGen",
        anchor: "end",
        dx: -13,
        dy: 5,
        tone: "tone-b"
      },
      {
        kind: "framework",
        point: { x: -6, y: 2 },
        radius: 0.15,
        outerRadius: 0.27,
        text: "LangGraph",
        anchor: "end",
        dx: -13,
        dy: 5,
        tone: "tone-d"
      },
      {
        kind: "framework",
        point: { x: 6, y: 2 },
        radius: 0.15,
        outerRadius: 0.27,
        text: "CrewAI",
        anchor: "start",
        dx: 13,
        dy: 5,
        tone: "tone-c"
      }
    ];

    const origin = Object.freeze({ x: 600, y: 220 });
    const scale = Object.freeze({ x: 50, y: 50 });
    const canvas = Object.freeze({ width: 1200, height: 440 });
    const labelOffset = Object.freeze({ fallbackX: 0, fallbackY: 0 });
    const lineWidth = Object.freeze({
      ring: 2,
      axis: 6,
      endpoint: 3,
      dot: 2,
      hub: 3,
      textHalo: 5
    });
    const fontSize = Object.freeze({
      caption: 14,
      axis: 18,
      note: 13,
      framework: 16,
      fallback: 18
    });

    function toPx(point) {
      return {
        x: origin.x + point.x * scale.x,
        y: origin.y + point.y * scale.y
      };
    }

    const svg = document.getElementById("diagram");
    const namespace = "http://www.w3.org/2000/svg";

    function makeElement(tag, className) {
      const element = document.createElementNS(namespace, tag);
      if (className) element.setAttribute("class", className);
      return element;
    }

    function appendCircle(parent, point, radius, className, strokeWidth) {
      const circle = makeElement("circle", className);
      const center = toPx(point);
      const edge = toPx({ x: point.x + radius, y: point.y });

      circle.setAttribute("cx", center.x);
      circle.setAttribute("cy", center.y);
      circle.setAttribute("r", Math.abs(edge.x - center.x));

      if (strokeWidth) circle.setAttribute("stroke-width", strokeWidth);
      parent.appendChild(circle);
      return circle;
    }

    function appendText(parent, item, className, size, text) {
      const label = makeElement("text", className);
      const anchor = toPx(item.point);

      label.setAttribute("x", anchor.x);
      label.setAttribute("y", anchor.y);
      label.setAttribute("dx", item.dx);
      label.setAttribute("dy", item.dy);
      label.setAttribute("text-anchor", item.anchor);
      label.setAttribute("dominant-baseline", "middle");
      label.setAttribute("font-size", size);
      label.setAttribute("paint-order", "stroke fill");
      label.setAttribute("stroke", "var(--bg)");
      label.setAttribute("stroke-width", lineWidth.textHalo);
      label.setAttribute("stroke-linejoin", "round");
      label.textContent = text;
      parent.appendChild(label);
      return label;
    }

    try {
      const ringItem = data.find((item) => item.kind === "ring");
      const ring = makeElement("ellipse", "design-ring");
      const ringCenter = toPx(ringItem.point);
      const ringX = toPx({
        x: ringItem.point.x + ringItem.rx,
        y: ringItem.point.y
      });
      const ringY = toPx({
        x: ringItem.point.x,
        y: ringItem.point.y + ringItem.ry
      });

      ring.setAttribute("cx", ringCenter.x);
      ring.setAttribute("cy", ringCenter.y);
      ring.setAttribute("rx", Math.abs(ringX.x - ringCenter.x));
      ring.setAttribute("ry", Math.abs(ringY.y - ringCenter.y));
      ring.setAttribute("stroke-width", lineWidth.ring);
      svg.appendChild(ring);

      for (const item of data.filter((entry) => entry.kind === "axis")) {
        const group = makeElement("g", "axis " + item.className);
        const line = makeElement("line", "axis-line");
        const start = toPx(item.from);
        const end = toPx(item.to);

        line.setAttribute("x1", start.x);
        line.setAttribute("y1", start.y);
        line.setAttribute("x2", end.x);
        line.setAttribute("y2", end.y);
        line.setAttribute("stroke-width", lineWidth.axis);
        group.appendChild(line);

        appendCircle(
          group,
          item.to,
          item.endRadius,
          "axis-end",
          lineWidth.endpoint
        );
        appendCircle(
          group,
          item.to,
          item.coreRadius,
          "axis-core",
          lineWidth.dot
        );
        svg.appendChild(group);
      }

      const hubItem = data.find((item) => item.kind === "hub");
      const hubGroup = makeElement("g", "hub");

      appendCircle(
        hubGroup,
        hubItem.point,
        hubItem.outerRadius,
        "hub-outer",
        lineWidth.hub
      );
      appendCircle(
        hubGroup,
        hubItem.point,
        hubItem.innerRadius,
        "hub-inner",
        lineWidth.dot
      );
      svg.appendChild(hubGroup);

      for (const item of data.filter((entry) => entry.kind === "framework")) {
        const group = makeElement("g", "framework");

        appendCircle(
          group,
          item.point,
          item.outerRadius,
          "framework-halo",
          lineWidth.ring
        );
        appendCircle(
          group,
          item.point,
          item.radius,
          "framework-dot " + item.tone,
          lineWidth.dot
        );
        appendText(
          group,
          item,
          "framework-label",
          fontSize.framework,
          item.text
        );
        svg.appendChild(group);
      }

      for (const item of data.filter((entry) => entry.kind === "axis")) {
        appendText(
          svg,
          {
            point: item.to,
            anchor: item.anchor,
            dx: item.labelDx,
            dy: item.labelDy
          },
          "axis-label " + item.className,
          fontSize.axis,
          item.label
        );

        appendText(
          svg,
          {
            point: item.to,
            anchor: item.anchor,
            dx: item.noteDx,
            dy: item.noteDy
          },
          "axis-note",
          fontSize.note,
          item.note
        );
      }

      const captionItem = data.find((item) => item.kind === "caption");
      appendText(
        svg,
        captionItem,
        "caption",
        fontSize.caption,
        captionItem.text
      );

      svg.setAttribute(
        "viewBox",
        [
          toPx({ x: -origin.x / scale.x, y: -origin.y / scale.y }).x,
          toPx({ x: -origin.x / scale.x, y: -origin.y / scale.y }).y,
          canvas.width,
          canvas.height
        ].join(" ")
      );
    } catch (error) {
      svg.replaceChildren();

      const hubItem = data.find((item) => item.kind === "hub");
      const fallback = makeElement("text", "fallback");
      const fallbackPoint = toPx(hubItem.point);

      fallback.setAttribute("x", fallbackPoint.x);
      fallback.setAttribute("y", fallbackPoint.y);
      fallback.setAttribute("dx", labelOffset.fallbackX);
      fallback.setAttribute("dy", labelOffset.fallbackY);
      fallback.setAttribute("text-anchor", "middle");
      fallback.setAttribute("dominant-baseline", "middle");
      fallback.setAttribute("font-size", fontSize.fallback);
      fallback.textContent =
        "Здесь должны быть четыре оси проектирования и шесть точек-фреймворков.";
      svg.appendChild(fallback);
    }
  </script>
</body>
</html>
