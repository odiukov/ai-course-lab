<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Три продовые поверхности атаки Copilot</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f4f7fb;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --ink: #172033;
      --muted: #647087;
      --border: #ccd5e3;
      --line: #8996aa;
      --header: #e9eef6;
      --data: #176b87;
      --data-soft: #e2f3f7;
      --network: #9b5b08;
      --network-soft: #fff0d2;
      --code: #8a3da5;
      --code-soft: #f4e7fa;
      --arrow: #59667b;
      --badge-ink: #ffffff;
      --shadow: rgba(35, 51, 76, 0.12);
      --focus: #2563eb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #10141c;
        --panel: #181e29;
        --panel-soft: #1d2532;
        --ink: #edf2fa;
        --muted: #aab5c7;
        --border: #39465a;
        --line: #718097;
        --header: #222b39;
        --data: #59c4df;
        --data-soft: #173a46;
        --network: #f0b65b;
        --network-soft: #493719;
        --code: #d996ef;
        --code-soft: #3d2647;
        --arrow: #9ba9bc;
        --badge-ink: #111722;
        --shadow: rgba(0, 0, 0, 0.28);
        --focus: #79a9ff;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    .figure {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: 0 8px 28px var(--shadow);
    }

    .figure-header {
      padding: 14px 24px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 750;
      letter-spacing: -0.01em;
    }

    .figure-header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 440px;
      background: var(--panel);
    }

    text {
      font-family: inherit;
      fill: var(--ink);
      text-rendering: geometricPrecision;
    }

    .column-label {
      fill: var(--muted);
      font-size: 13px;
      font-weight: 750;
      letter-spacing: 0.07em;
    }

    .case-name {
      font-size: 18px;
      font-weight: 780;
    }

    .case-kind {
      fill: var(--muted);
      font-size: 13px;
      font-weight: 520;
    }

    .node-main {
      font-size: 16px;
      font-weight: 730;
    }

    .node-detail {
      fill: var(--muted);
      font-size: 13px;
      font-weight: 520;
    }

    .score {
      fill: var(--badge-ink);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.025em;
    }

    .legend-strong {
      font-size: 14px;
      font-weight: 750;
    }

    .legend-detail,
    .fallback {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 540;
    }

    .cell,
    .case-cell {
      fill: var(--panel-soft);
      stroke: var(--border);
    }

    .header-rule,
    .legend-rule {
      stroke: var(--border);
    }

    .arrow-line {
      stroke: var(--arrow);
      stroke-linecap: round;
    }

    .arrow-head {
      fill: var(--arrow);
    }

    .data .outcome-cell {
      fill: var(--data-soft);
      stroke: var(--data);
    }

    .network .outcome-cell {
      fill: var(--network-soft);
      stroke: var(--network);
    }

    .code .outcome-cell {
      fill: var(--code-soft);
      stroke: var(--code);
    }

    .data .accent,
    .data .score-box {
      fill: var(--data);
    }

    .network .accent,
    .network .score-box {
      fill: var(--network);
    }

    .code .accent,
    .code .score-box {
      fill: var(--code);
    }

    .data .outcome-main {
      fill: var(--data);
    }

    .network .outcome-main {
      fill: var(--network);
    }

    .code .outcome-main {
      fill: var(--code);
    }

    noscript {
      display: block;
      padding: 24px;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="figure" aria-labelledby="diagram-heading">
    <header class="figure-header">
      <h1 id="diagram-heading">Три продовые поверхности атаки Copilot</h1>
      <p>Одинаковый тип инъекции — разные привилегированные компоненты и выходы.</p>
    </header>

    <svg id="diagram" viewBox="0 0 1200 440" width="1200" height="440"
         role="img" aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Сравнительная матрица EchoLeak, CamoLeak и Copilot RCE</title>
      <desc id="svg-desc">
        EchoLeak связывает письмо, RAG и утечку данных; CamoLeak — репозиторий,
        Camo и сетевой запрос через изображение; CVE-2025-53773 — подсказки кода
        и удалённое выполнение кода.
      </desc>
      <g id="drawing"></g>
    </svg>

    <noscript>
      Схема должна показать три цепочки: письмо — RAG — утечка данных;
      репозиторий — Camo и изображения — внешний запрос; подсказки кода —
      инструменты исполнения — удалённое выполнение кода.
    </noscript>
  </main>

  <script>
    const diagramData = {
      zero: 0,
      origin: [0, 0],
      scale: [1, 1],
      canvas: [1200, 440],
      lineWidth: 1.5,
      heavyLineWidth: 3,
      headerRule: [24, 55, 1176, 55],
      legendRule: [24, 399, 1176, 399],
      radius: 12,
      labelInset: 16,
      outcomeInset: 20,
      headerY: 34,
      columns: [
        { label: "ИНЦИДЕНТ", x: 24, width: 246 },
        { label: "ВХОД", x: 302, width: 184 },
        { label: "ПРИВИЛЕГИРОВАННЫЙ КОМПОНЕНТ", x: 526, width: 262 },
        { label: "ДОСТУПНЫЙ «ВЫХОД»", x: 828, width: 348 }
      ],
      rows: [
        {
          tone: "data",
          y: 67,
          height: 96,
          name: "EchoLeak",
          kind: "корпоративный помощник",
          score: "CVSS 9.3",
          input: ["Письмо", "недоверенная инструкция"],
          component: ["RAG", "доступ к закрытым данным"],
          outcome: ["Утечка данных", "Поверхность: письма и документы"]
        },
        {
          tone: "network",
          y: 177,
          height: 96,
          name: "CamoLeak",
          kind: "рендеринг ответа",
          score: "CVSS 9.6",
          input: ["Репозиторий", "скрытая инструкция"],
          component: ["Camo", "изображения и их загрузка"],
          outcome: ["Запрос через изображение", "Поверхность: рендерер ответа"]
        },
        {
          tone: "code",
          y: 287,
          height: 96,
          name: "CVE-2025-53773",
          kind: "Copilot RCE",
          score: "",
          input: ["Подсказки кода", "обработанное содержимое"],
          component: ["Инструменты", "среда выполнения"],
          outcome: ["Удалённое выполнение кода", "Поверхность: инструменты и среда"]
        }
      ],
      cells: {
        incident: [24, 246],
        input: [302, 184],
        component: [526, 262],
        outcome: [828, 348]
      },
      arrows: [
        [493, 519],
        [795, 821]
      ],
      arrowHead: [8, 6],
      textOffsets: {
        caseMain: 34,
        caseDetail: 61,
        nodeMain: 38,
        nodeDetail: 64
      },
      badge: {
        x: 174,
        yOffset: 15,
        width: 80,
        height: 27,
        radius: 8,
        textOffset: 18
      },
      accent: {
        xOffset: 7,
        yOffset: 14,
        width: 4,
        heightLoss: 28,
        radius: 2
      },
      legend: {
        y: 424,
        leftX: 24,
        rightX: 1176,
        left: "Смотри на конец цепочки:",
        right: "данные  →  сеть  →  команда"
      },
      fallback: {
        x: 40,
        y: 110,
        secondY: 142,
        first: "Не удалось построить сравнительную матрицу.",
        second: "Она сопоставляет EchoLeak, CamoLeak и CVE-2025-53773 по входу, компоненту и выходу."
      }
    };

    const origin = diagramData.origin;
    const scale = diagramData.scale;
    const [originX, originY] = origin;
    const [scaleX, scaleY] = scale;
    const sx = x => originX + x * scaleX;
    const sy = y => originY + y * scaleY;

    const svgNamespace = "http://www.w3.org/2000/svg";
    const drawing = document.getElementById("drawing");

    function makeElement(name, attributes, content) {
      const node = document.createElementNS(svgNamespace, name);
      Object.entries(attributes).forEach(([key, value]) => {
        node.setAttribute(key, String(value));
      });
      if (content !== undefined) node.textContent = content;
      return node;
    }

    function addRect(parent, x, y, width, height, radius, className) {
      const rect = makeElement("rect", {
        x: sx(x),
        y: sy(y),
        width: sx(x + width) - sx(x),
        height: sy(y + height) - sy(y),
        rx: sx(radius) - sx(diagramData.zero),
        class: className,
        "stroke-width": diagramData.lineWidth,
        "vector-effect": "non-scaling-stroke"
      });
      parent.appendChild(rect);
      return rect;
    }

    function addText(parent, x, y, value, className, anchor) {
      const text = makeElement("text", {
        x: sx(x),
        y: sy(y),
        class: className,
        "text-anchor": anchor,
        "dominant-baseline": "alphabetic"
      }, value);
      parent.appendChild(text);
      return text;
    }

    function addRule(parent, points, className, width) {
      const [xStart, yStart, xEnd, yEnd] = points;
      const line = makeElement("line", {
        x1: sx(xStart),
        y1: sy(yStart),
        x2: sx(xEnd),
        y2: sy(yEnd),
        class: className,
        "stroke-width": width,
        "vector-effect": "non-scaling-stroke"
      });
      parent.appendChild(line);
      return line;
    }

    function addArrow(parent, startX, endX, centerY) {
      const [headLength, headHalfHeight] = diagramData.arrowHead;
      addRule(
        parent,
        [startX, centerY, endX - headLength, centerY],
        "arrow-line",
        diagramData.heavyLineWidth
      );

      const vertices = [
        [endX, centerY],
        [endX - headLength, centerY - headHalfHeight],
        [endX - headLength, centerY + headHalfHeight]
      ];

      const polygon = makeElement("polygon", {
        points: vertices.map(([x, y]) => `${sx(x)},${sy(y)}`).join(" "),
        class: "arrow-head"
      });
      parent.appendChild(polygon);
    }

    function drawHeader(parent) {
      diagramData.columns.forEach(column => {
        addText(
          parent,
          column.x + column.width / diagramData.scale[1] / diagramData.scale[1],
          diagramData.headerY,
          column.label,
          "column-label",
          "middle"
        ).setAttribute(
          "x",
          sx(column.x + column.width / (diagramData.origin.length))
        );
      });

      addRule(
        parent,
        diagramData.headerRule,
        "header-rule",
        diagramData.lineWidth
      );
    }

    function drawRow(parent, row) {
      const group = makeElement("g", { class: row.tone });
      const centerY = row.y + row.height / diagramData.origin.length;
      const mainY = row.y + diagramData.textOffsets.nodeMain;
      const detailY = row.y + diagramData.textOffsets.nodeDetail;
      const caseX = diagramData.cells.incident[0];
      const caseWidth = diagramData.cells.incident[1];
      const inputX = diagramData.cells.input[0];
      const inputWidth = diagramData.cells.input[1];
      const componentX = diagramData.cells.component[0];
      const componentWidth = diagramData.cells.component[1];
      const outcomeX = diagramData.cells.outcome[0];
      const outcomeWidth = diagramData.cells.outcome[1];

      addRect(group, caseX, row.y, caseWidth, row.height,
        diagramData.radius, "case-cell");
      addRect(group, inputX, row.y, inputWidth, row.height,
        diagramData.radius, "cell");
      addRect(group, componentX, row.y, componentWidth, row.height,
        diagramData.radius, "cell");
      addRect(group, outcomeX, row.y, outcomeWidth, row.height,
        diagramData.radius, "outcome-cell");

      addRect(
        group,
        outcomeX + diagramData.accent.xOffset,
        row.y + diagramData.accent.yOffset,
        diagramData.accent.width,
        row.height - diagramData.accent.heightLoss,
        diagramData.accent.radius,
        "accent"
      );

      addText(
        group,
        caseX + diagramData.labelInset,
        row.y + diagramData.textOffsets.caseMain,
        row.name,
        "case-name",
        "start"
      );
      addText(
        group,
        caseX + diagramData.labelInset,
        row.y + diagramData.textOffsets.caseDetail,
        row.kind,
        "case-kind",
        "start"
      );

      if (row.score) {
        addRect(
          group,
          diagramData.badge.x,
          row.y + diagramData.badge.yOffset,
          diagramData.badge.width,
          diagramData.badge.height,
          diagramData.badge.radius,
          "score-box"
        );
        addText(
          group,
          diagramData.badge.x + diagramData.badge.width /
            diagramData.origin.length,
          row.y + diagramData.badge.yOffset + diagramData.badge.textOffset,
          row.score,
          "score",
          "middle"
        );
      }

      addText(
        group,
        inputX + inputWidth / diagramData.origin.length,
        mainY,
        row.input[diagramData.zero],
        "node-main",
        "middle"
      );
      addText(
        group,
        inputX + inputWidth / diagramData.origin.length,
        detailY,
        row.input[diagramData.scale[1]],
        "node-detail",
        "middle"
      );

      addText(
        group,
        componentX + componentWidth / diagramData.origin.length,
        mainY,
        row.component[diagramData.zero],
        "node-main",
        "middle"
      );
      addText(
        group,
        componentX + componentWidth / diagramData.origin.length,
        detailY,
        row.component[diagramData.scale[1]],
        "node-detail",
        "middle"
      );

      addText(
        group,
        outcomeX + diagramData.outcomeInset,
        mainY,
        row.outcome[diagramData.zero],
        "node-main outcome-main",
        "start"
      );
      addText(
        group,
        outcomeX + diagramData.outcomeInset,
        detailY,
        row.outcome[diagramData.scale[1]],
        "node-detail",
        "start"
      );

      diagramData.arrows.forEach(([startX, endX]) => {
        addArrow(group, startX, endX, centerY);
      });

      parent.appendChild(group);
    }

    function drawLegend(parent) {
      addRule(
        parent,
        diagramData.legendRule,
        "legend-rule",
        diagramData.lineWidth
      );
      addText(
        parent,
        diagramData.legend.leftX,
        diagramData.legend.y,
        diagramData.legend.left,
        "legend-strong",
        "start"
      );
      addText(
        parent,
        diagramData.legend.rightX,
        diagramData.legend.y,
        diagramData.legend.right,
        "legend-detail",
        "end"
      );
    }

    try {
      drawHeader(drawing);
      diagramData.rows.forEach(row => drawRow(drawing, row));
      drawLegend(drawing);
    } catch (error) {
      drawing.replaceChildren();
      addText(
        drawing,
        diagramData.fallback.x,
        diagramData.fallback.y,
        diagramData.fallback.first,
        "legend-strong",
        "start"
      );
      addText(
        drawing,
        diagramData.fallback.x,
        diagramData.fallback.secondY,
        diagramData.fallback.second,
        "fallback",
        "start"
      );
    }
  </script>
</body>
</html>
