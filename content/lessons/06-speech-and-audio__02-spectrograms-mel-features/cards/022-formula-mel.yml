- concept: обратное преобразование из mel в герцы
  question: Частота равна 2475 mel. Чему она примерно равна в герцах при стандартном mel-преобразовании?
  explanation: 'Обратная формула: f = 700 · (10^(m / 2595) − 1). Подстановка m = 2475 даёт примерно 5593 Hz.'
  kind: numeric
  answer: 5593
  tolerance: 7
  id: 022-formula-mel-1
  fingerprint: 22a789df
- concept: добавление единицы под логарифмом устраняет особенность в нуле и сохраняет почти линейное поведение на низких частотах
  question: Почему в mel-преобразовании используют логарифм от единицы плюс нормированная частота, а не логарифм самой частоты?
  explanation: У чистого log(f) при f = 0 возникает минус бесконечность. В выражении log10(1 + f / 700) нулевая частота корректно переходит в 0 mel, малые частоты отображаются почти линейно, а большие сжимаются логарифмически.
  kind: open
  reference: Такая форма даёт конечное нулевое значение при нулевой частоте. На низких частотах логарифм от единицы плюс малая величина ведёт себя почти линейно, а на высоких — логарифмически.
  id: 022-formula-mel-2
  fingerprint: 3e067a0b
