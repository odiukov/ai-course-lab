- concept: mel-шкала выделяет более узкие частотные полосы на низких частотах и более широкие на высоких
  question: Как меняется ширина частотных полос в герцах при движении от низких частот к высоким по mel-шкале?
  explanation: На низких частотах слух различает небольшие изменения, поэтому mel-полосы там узкие. На высоких частотах для сопоставимого слышимого изменения нужен больший шаг в герцах, поэтому полосы расширяются.
