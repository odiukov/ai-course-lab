- concept: нулевое дополнение в конце аудио создаёт искусственные плоские log-mel-кадры, которые модель может использовать как ложную подсказку
  question: Объясни, почему добавление нулей только в конец коротких аудиоклипов может ухудшить перенос модели на инференс без такого дополнения. Как можно уменьшить проблему?
  explanation: В уроке нулевой хвост превращается в множество одинаковых строк, где все mel-полосы находятся на уровне −23. Это артефакт подготовки батча, а не свойство речи; если он присутствует только при обучении, модель теряет выученную подсказку на инференсе.
  kind: open
  reference: Нулевые участки дают одинаково пустой спектр, а после логарифмирования с нижним порогом все mel-полосы получают один и тот же минимальный уровень. Модель может запомнить этот плоский хвост как признак конца фразы. Следует согласовать padding между обучением и инференсом и использовать симметричное отражение или повторение краевых участков вместо искусственного нулевого хвоста.
  id: 042-pitfall-normalizaciya-padding-2
