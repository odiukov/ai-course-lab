- concept: контракт акустического препроцессинга должен включать sample rate и конфигурацию извлечения признаков, а не только форму тензора
  question: Почему одной проверки формы mel-спектрограммы недостаточно для обнаружения расхождения препроцессинга между обучением и инференсом? Что следует проверять дополнительно?
  explanation: При другом sample rate матрица может сохранить прежние размеры, хотя границы mel-фильтров и распределение энергии изменятся. Поэтому sample rate необходимо логировать и сверять вместе с формой и конфигурацией признаков.
  kind: open
  reference: Одинаковая форма сообщает только число кадров и mel-полос, но не гарантирует одинаковое соответствие полос физическим частотам. Нужно сверять как минимум sample rate и параметры извлечения признаков на обучении и инференсе; waveform следует привести к ожидаемому sample rate до вычисления mel-признаков.
  id: 041-pitfall-nesovpadenie-2
  fingerprint: 88a0e6ef
