- concept: окно Hann из единственного сэмпла требует отдельной обработки из-за нулевого знаменателя
  question: Как должна вести себя реализация окна Hann для кадра, состоящего из единственного сэмпла?
  explanation: В общей формуле знаменатель равен длине окна минус единица, поэтому для единственного сэмпла возникает деление на ноль. Единичный коэффициент сохраняет этот сэмпл без изменений.
  kind: choice
  options:
    - Вернуть единственный единичный коэффициент через отдельную ветку
    - Вычислить коэффициент по общей формуле без изменений
    - Вернуть пустой список
    - Вернуть единственный нулевой коэффициент
