- concept: перекрытие кадров уменьшает зависимость представления короткого события от его положения относительно границ
  question: Короткий звуковой импульс попал на границу двух неперекрывающихся кадров и разделился между ними. Какое изменение разбиения напрямую снижает вероятность такой потери?
  explanation: При шаге меньше длины окна одно и то же событие наблюдается в нескольких кадрах с разных позиций. Поэтому даже событие у границы одного кадра может целиком оказаться внутри соседнего.
