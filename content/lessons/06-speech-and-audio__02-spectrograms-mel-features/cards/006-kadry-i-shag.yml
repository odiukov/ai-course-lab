- concept: слишком короткое окно не содержит достаточно периодов низкочастотного колебания для устойчивой оценки его частоты
  question: Почему чрезмерно короткие кадры плохо подходят для определения низких частот сигнала?
  explanation: Частотный анализ опирается на наблюдение колебаний во времени. Чем ниже частота, тем длиннее её период, поэтому слишком короткое окно ухудшает частотное разрешение и оценку низкочастотных компонентов.
