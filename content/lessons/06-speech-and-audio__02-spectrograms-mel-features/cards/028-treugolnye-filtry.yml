- concept: перекрытие треугольных mel-фильтров делает признаки устойчивыми к небольшим сдвигам частоты
  question: Объясните своими словами, почему перекрывающиеся треугольные mel-фильтры реагируют на небольшой сдвиг частоты плавнее, чем неперекрывающиеся прямоугольные полосы.
  explanation: Линейно меняющиеся веса превращают жёсткое переключение между полосами в постепенное перераспределение энергии. Поэтому близкие по частоте спектры дают близкие векторы mel-признаков.
  kind: open
  reference: 'В области перекрытия спектральная компонента одновременно вносит вклад в соседние mel-каналы. При её смещении веса меняются постепенно: вклад плавно убывает в одном канале и растёт в другом. У прямоугольных полос пересечение границы мгновенно переносит весь вклад между каналами.'
  id: 028-treugolnye-filtry-2
