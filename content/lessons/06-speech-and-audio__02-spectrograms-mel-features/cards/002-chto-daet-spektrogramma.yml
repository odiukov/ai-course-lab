- concept: построение спектрограммы из локальных частотных представлений сигнала
  question: Расположите этапы построения спектрограммы из звукового сигнала в правильном порядке.
  explanation: Каждое окно превращается из набора амплитуд во временной области в столбец частотных энергий. Последовательность таких столбцов образует спектрограмму.
  kind: order
  items:
    - Разделить сигнал на короткие, последовательно сдвигаемые окна
    - Для каждого окна определить распределение энергии по частотам
    - Расположить полученные спектральные столбцы вдоль оси времени
  id: 002-chto-daet-spektrogramma-2
