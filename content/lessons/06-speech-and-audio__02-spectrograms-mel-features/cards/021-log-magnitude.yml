- concept: логарифм сжимает динамический диапазон спектральных модулей и уменьшает доминирование громких компонентов при обучении
  question: Зачем перед подачей спектральных модулей в нейросеть обычно применяют логарифм?
  explanation: 'Сырые модули могут различаться на много порядков, поэтому громкие компоненты непропорционально влияют на обновление весов. Логарифм сжимает этот диапазон: отношения амплитуд превращаются в разности.'
  kind: choice
  options:
    - Чтобы восстановить фазу сигнала
    - Чтобы превратить большие multiplicative различия в более умеренные additive различия и сохранить влияние тихих компонентов
    - Чтобы повысить временное разрешение спектрограммы
    - Чтобы увеличить число частотных бинов
  correct: 1
  id: 021-log-magnitude-1
  fingerprint: 0958685c
- concept: умножение амплитуды на постоянный коэффициент после логарифмирования превращается в аддитивный сдвиг
  question: Заполни пропуск в тождестве для положительных величин.
  explanation: Общий коэффициент усиления до логарифма умножает все модули, а после логарифма лишь добавляет к ним одинаковую константу. Поэтому масштаб громкости становится проще для обработки моделью.
  kind: cloze
  template: log(c|X|) = log(|X|) + ___
  answer: log(c)
  accept:
    - log c
    - ln(c)
    - ln c
  id: 021-log-magnitude-2
  fingerprint: ca619292
- concept: малая положительная добавка делает логарифм спектрального модуля конечным при нулевой энергии
  question: Какую основную задачу решает малая положительная константа в выражении log(|X| + ε)?
  explanation: Логарифм нуля не является конечным числом. Добавка ε предотвращает появление минус бесконечности и численных ошибок, одновременно ограничивая снизу значения для почти пустых спектральных бинов.
  kind: choice
  options:
    - Компенсирует spectral leakage
    - Восстанавливает отброшенные отрицательные частоты
    - Не позволяет аргументу логарифма стать нулевым и задаёт нижний порог признаков
    - Нормирует каждый кадр до единичной энергии
  correct: 2
  id: 021-log-magnitude-3
