- concept: MFCC получают последовательным преобразованием локального спектра через mel-фильтры, логарифм и DCT
  question: Расположите операции получения MFCC из сырого аудиосигнала в правильном порядке.
  explanation: STFT создаёт локальные спектры, mel-фильтры переводят их на перцептивную шкалу, логарифм сжимает динамический диапазон, а DCT декоррелирует log-mel-признаки. В материале ширина представления последовательно меняется от 201 частотного бина к 80 mel-бинам и затем к 13 MFCC.
  kind: order
  items:
    - Разбить waveform на перекрывающиеся кадры и вычислить STFT
    - Объединить частотные бины с помощью mel-фильтров
    - Логарифмировать энергии mel-полос
    - Применить DCT и оставить низкочастотные коэффициенты
  id: 005-lestnica-priznakov-1
  fingerprint: 81b256c3
- concept: выбор между log-mel и MFCC зависит от допустимой потери спектральных деталей
  question: Почему сильное усечение log-mel-представления до нескольких MFCC может навредить распознаванию речи, даже если оно хорошо сохраняет общую форму спектра?
  explanation: 'Соседние mel-бины коррелируют, поэтому первые коэффициенты DCT дают эффективное сжатие. Однако отброшенные коэффициенты содержат более тонкую спектральную структуру: её потеря обычно опаснее для ASR, чем для задач, ориентированных на характеристики голоса.'
  kind: open
  reference: DCT собирает общую спектральную огибающую в низких коэффициентах, но при усечении теряются локальные различия между mel-полосами. Эти детали могут различать фонемы и поэтому важны для распознавания текста, тогда как для определения говорящего общей формы спектра часто достаточно.
  id: 005-lestnica-priznakov-2
