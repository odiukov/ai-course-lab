- concept: получение STFT-модуля кадра состоит из оконного взвешивания, DFT и вычисления модулей
  question: Расположите операции получения спектра модулей одного кадра в правильном порядке.
  explanation: Сначала окно ослабляет края кадра, затем DFT переводит его в комплексное частотное представление, после чего модуль каждого коэффициента сохраняет амплитуду и отбрасывает фазу.
  kind: order
  items:
    - Поточечно умножить кадр на оконную функцию
    - Вычислить комплексные коэффициенты DFT
    - Взять модули комплексных коэффициентов
  id: 016-dft-iz-uroka-1-1
  fingerprint: eeb0d6eb
- concept: DFT-модули каждого кадра вычисляются независимо от положения кадра в сигнале
  question: Одинаковый оконно-взвешенный кадр дважды встречается в разных местах аудиосигнала. Что вернёт одна и та же функция вычисления DFT-модулей для этих двух кадров?
  explanation: Функция получает только значения текущего кадра и не знает его индекс или положение в исходном сигнале. Поэтому одинаковые входные кадры дают одинаковые модули; временная координата появляется при размещении результатов в порядке кадров.
  kind: choice
  options:
    - Одинаковые наборы модулей
    - Разные наборы модулей, потому что функция учитывает абсолютное время
    - Одинаковые модули только низких частот
    - Второй результат будет зависеть от первого вызова
