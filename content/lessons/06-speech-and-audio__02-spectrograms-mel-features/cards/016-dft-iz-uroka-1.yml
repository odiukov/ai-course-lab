- concept: спектрограмма модулей теряет фазовую информацию DFT
  question: Объясните своими словами, почему по одной лишь STFT-спектрограмме модулей нельзя в общем случае точно восстановить исходный звук.
  explanation: Комплексный коэффициент содержит модуль и фазу. Операция magnitudes сохраняет только модуль, поэтому точное обращение преобразования становится неоднозначным; фазу приходится оценивать отдельно, например вокодером.
  kind: open
  reference: При вычислении модулей комплексных коэффициентов DFT отбрасываются их фазы. Разные сигналы могут иметь одинаковые модули, но разные фазы, поэтому обратному преобразованию не хватает информации для однозначного восстановления.
  id: 016-dft-iz-uroka-1-3
  fingerprint: 15f9ef60
