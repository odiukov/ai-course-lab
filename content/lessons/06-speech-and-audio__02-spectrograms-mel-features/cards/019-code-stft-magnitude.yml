- concept: FFT и векторизация делают вычисление STFT пригодным для производительных систем
  question: Почему реализация STFT через прямой DFT и циклы подходит для короткого учебного примера, но в продакшене обычно используют torch.stft или librosa.stft?
  explanation: Педагогический код явно показывает оконное взвешивание, DFT и вычисление модулей. Для длинных записей и больших пакетов оптимизированные FFT-реализации значительно быстрее прямого DFT в Python.
  kind: open
  reference: Прямой DFT требует квадратичного объёма вычислений для каждого кадра, а Python-циклы добавляют накладные расходы. Библиотечные реализации применяют более эффективный FFT и обрабатывают данные векторизованно, часто с пакетным выполнением и аппаратным ускорением.
