  fingerprint: 82dc3402
- concept: вырождение треугольного фильтра при попадании соседних частотных границ в один FFT-бин
  question: Почему при переводе границ mel-фильтров из герц в целочисленные индексы FFT-бинов в формуле наклона нужно отдельно защищаться от нулевой ширины участка?
  explanation: FFT-бин представляет целую частотную полосу, поэтому близкие границы в герцах после дискретизации могут получить одинаковый индекс. Без защиты вычисление линейного веса приведёт к делению на ноль.
  kind: open
  reference: Округление до целого индекса может отправить две разные частотные границы в один FFT-бин. Тогда разность индексов, используемая как знаменатель линейного наклона, становится нулевой. Нужно подставить безопасный ненулевой знаменатель или отдельно обработать вырожденный участок.
  id: 031-code-mel-filterbank-2
  fingerprint: c9755758
