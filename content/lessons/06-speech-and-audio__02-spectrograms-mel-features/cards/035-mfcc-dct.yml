- concept: нулевой коэффициент DCT равен сумме значений кадра и отражает его общий уровень
  question: Один log-mel-кадр содержит значения [7, 8, 9, 11]. Чему равен его нулевой коэффициент ненормированной DCT-II?
  explanation: 'При k = 0 косинус во всех слагаемых равен 1, поэтому коэффициент равен сумме значений: 7 + 8 + 9 + 11 = 35. Он отражает общий уровень кадра, поэтому в MFCC его часто исключают.'
  kind: numeric
  answer: 35
  tolerance: 0.001
  id: 035-mfcc-dct-1
  fingerprint: 8835b8b6
- concept: индекс коэффициента DCT определяет масштаб изменений вдоль mel-оси
  question: Какие коэффициенты DCT сильнее реагируют на мелкую быстро меняющуюся рябь вдоль mel-каналов?
  explanation: Чем больше индекс DCT, тем быстрее колеблется соответствующая косинусная базисная функция. Поэтому первые коэффициенты описывают плавную форму спектра, а высокие — мелкие детали.
  kind: choice
  options:
    - Коэффициенты с большими индексами
    - Коэффициенты с наименьшими ненулевыми индексами
    - Только коэффициент общего уровня
    - Все коэффициенты одинаково
  correct: 0
  id: 035-mfcc-dct-2
  fingerprint: a533556f
- concept: число сохранённых коэффициентов DCT задаёт размерность признаков кадра, не меняя число кадров
  question: Заполни пропуск в форме матрицы после усечённой DCT, применённой независимо к каждому кадру.
  explanation: DCT преобразует частотные признаки внутри каждого кадра, поэтому временная ось сохраняется. В уроке матрица из 998 кадров после сохранения 13 коэффициентов имеет форму (998, 13).
  kind: cloze
  template: shape_after_truncated_dct = (n_frames, ___)
  answer: n_coeffs
  accept:
