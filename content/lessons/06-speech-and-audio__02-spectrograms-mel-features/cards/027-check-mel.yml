- concept: вычисление mel-координаты частоты по формуле преобразования
  question: Используйте формулу m = 2595 · log10(1 + f / 700). Сколько mel соответствует частоте 350 Hz? Округлите до целого.
  explanation: Подстановка даёт m = 2595 · log10(1,5) ≈ 457 mel. Это применение нелинейного преобразования, а не прямое переименование герц в mel.
  kind: numeric
  answer: 457
  tolerance: 1
  id: 027-check-mel-1
  fingerprint: 54ebbd9b
- concept: единицы частоты на входе преобразования Hz в mel должны соответствовать единицам константы формулы
  question: Функция hz_to_mel ожидает частоту в герцах. Что произойдёт, если без пересчёта передать ей численное значение частоты, записанное в килогерцах?
  explanation: Константы формулы согласованы с частотой в герцах. Значение в килогерцах функция воспримет как гораздо меньшую частоту, поэтому вычисленная mel-координата окажется заниженной.
  kind: choice
  options:
    - Результат в mel будет сильно занижен
    - Результат автоматически останется правильным
    - Результат в mel будет сильно завышен
    - Изменится только единица результата, но не его значение
