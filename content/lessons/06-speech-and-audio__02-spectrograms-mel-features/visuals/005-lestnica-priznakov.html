<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Лестница признаков</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1b1f23; --muted:#5b6672;
    --box:#eef3f9; --edge:#2f6fb0; --accent:#b0532f;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14181d; --fg:#e8edf2; --muted:#9aa7b4;
      --box:#1e2731; --edge:#6fa8dc; --accent:#e0956b;
    }
  }
  html,body{margin:0}
  .wrap{background:var(--bg);color:var(--fg);padding:10px 8px;
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  h2{font-size:15px;margin:0 0 6px;font-weight:600}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg)}
  .fail{font-size:13px;color:var(--muted);line-height:1.5}
  text{fill:var(--fg)}
  .sub{fill:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h2>Лестница: waveform → STFT → mel → MFCC</h2>
  <div id="host"><noscript class="fail">Четыре ступени: waveform 160000 сэмплов → STFT (998, 201) → mel (998, 80) → MFCC (998, 13).</noscript></div>
</div>
<script>
(function(){
  var host = document.getElementById("host");
  try{
    // ---- данные схемы (литералы) ----
    var STEPS = [
      {i:0, name:"waveform",  shape:"160000 сэмплов", per:"один поток",   drop:""},
      {i:1, name:"STFT",      shape:"(998, 201)",     per:"201 на кадр",  drop:"точность по времени"},
      {i:2, name:"mel",       shape:"(998, 80)",      per:"80 на кадр",   drop:"точность по частоте"},
      {i:3, name:"MFCC",      shape:"(998, 13)",      per:"13 на кадр",   drop:"повторы соседних бинов"}
    ];
    var W = 900, H = 380;                 // холст
    var PAD = 6, LW = 1.6, FS = 13;       // отступ подписи, толщина, кегль

    // ---- один origin и один scale ----
    var origin = {x:120, y:250};
    var scale  = {x:190, y:34};
    function sx(x){ return origin.x + x * scale.x; }
    function sy(y){ return origin.y - y * scale.y; }

    // ---- геометрия ступеней в модельных единицах ----
    // ступень i: столбик по центру x = i, верх y = 4 - i, низ y = 0
    var HALF = 0.28;                       // полуширина столбика, ед. x
    function top(i){ return 4 - i; }

    var ns = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(ns,"svg");
    svg.setAttribute("viewBox","0 0 "+W+" "+H);
    svg.setAttribute("preserveAspectRatio","xMidYMid meet");
    svg.setAttribute("role","img");
    svg.setAttribute("aria-label","Четыре ступени: waveform 160000 сэмплов, STFT (998, 201), mel (998, 80), MFCC (998, 13)");

    function el(n,a){ var e=document.createElementNS(ns,n);
      for(var k in a) e.setAttribute(k,a[k]); return e; }
    function txt(x,y,s,anchor,cls,size,weight){
      var t=el("text",{x:x,y:y,"text-anchor":anchor||"middle",
        "font-size":(size||FS),"font-family":"inherit"});
      if(weight) t.setAttribute("font-weight",weight);
      if(cls) t.setAttribute("class",cls);
      t.textContent=s; svg.appendChild(t); return t;
    }

    // наконечник стрелки
    var defs = el("defs",{});
    var mk = el("marker",{id:"ah",markerWidth:"8",markerHeight:"8",
      refX:"7",refY:"3",orient:"auto",markerUnits:"strokeWidth"});
    mk.appendChild(el("path",{d:"M0,0 L7,3 L0,6 z",fill:"var(--accent)"}));
    defs.appendChild(mk); svg.appendChild(defs);

    // базовая линия под ступенями
    svg.appendChild(el("line",{x1:sx(-0.55),y1:sy(0),x2:sx(3.55),y2:sy(0),
      stroke:"var(--muted)","stroke-width":LW,"stroke-opacity":"0.5"}));

    STEPS.forEach(function(s){
      var i = s.i, t = top(i);
      // столбик
      svg.appendChild(el("rect",{
        x:sx(i-HALF), y:sy(t),
        width: sx(i+HALF)-sx(i-HALF),
        height: sy(0)-sy(t),
        rx:4, fill:"var(--box)", stroke:"var(--edge)","stroke-width":LW}));
      // имя ступени — над столбиком
      txt(sx(i), sy(t)-PAD-FS, s.name, "middle", null, FS, "600");
      // форма массива — чуть ниже имени, тоже над столбиком
      txt(sx(i), sy(t)-PAD, s.shape, "middle", null, FS);
      // сколько чисел на кадр — внутри столбика, у низа
      txt(sx(i), sy(0)-PAD-2, s.per, "middle", "sub", FS-1);
      // номер ступени — под базовой линией
      txt(sx(i), sy(0)+PAD+FS, "ступень "+(i+1), "middle", "sub", FS-1);
    });

    // стрелки между ступенями + подпись у хвоста, над стрелкой
    var ARR = ["STFT","mel-фильтры","DCT"];
    for(var i=0;i<3;i++){
      var yA = 0.55;                       // высота линии стрелки, ед. y
      svg.appendChild(el("line",{
        x1:sx(i+HALF+0.06), y1:sy(yA),
        x2:sx(i+1-HALF-0.10), y2:sy(yA),
        stroke:"var(--accent)","stroke-width":LW,"marker-end":"url(#ah)"}));
      // подпись операции — у хвоста, слева-направо
      txt(sx(i+HALF+0.08), sy(yA)-PAD, ARR[i], "start", null, FS-1);
      // что выброшено — под стрелкой, там же у хвоста
      txt(sx(i+HALF+0.08), sy(yA)+PAD+FS-3, "минус "+STEPS[i+1].drop, "start", "sub", FS-2);
    }

    // отметка «вход моделей ASR» у третьей ступени
    var mY = top(2)+0.75;
    svg.appendChild(el("line",{x1:sx(2),y1:sy(top(2)),x2:sx(2),y2:sy(mY),
      stroke:"var(--accent)","stroke-width":LW,"stroke-dasharray":"4 3"}));
    txt(sx(2), sy(mY)-PAD, "log-mel: вход Whisper и Parakeet", "middle", null, FS-1);

    // подпись оси слева: ширина кадра
    txt(sx(-0.62), sy(0)+PAD+FS, "0", "end", "sub", FS-1);
    txt(sx(-0.62), sy(2), "ширина", "end", "sub", FS-1);
    txt(sx(-0.62), sy(2)-(-FS), "кадра", "end", "sub", FS-1);
    svg.appendChild(el("line",{x1:sx(-0.55),y1:sy(0),x2:sx(-0.55),y2:sy(4.2),
      stroke:"var(--muted)","stroke-width":LW,"stroke-opacity":"0.5"}));

    host.innerHTML="";
    host.appendChild(svg);
  }catch(e){
    host.innerHTML='<p class="fail">Схема: четыре ступени слева направо. '+
      'waveform — 160000 сэмплов; STFT — (998, 201), 201 число на кадр; '+
      'mel — (998, 80); MFCC — (998, 13). Каждая ступень режет ширину кадра '+
      'примерно в два с половиной раза; Whisper и Parakeet берут третью.</p>';
  }
})();
</script>
</body>
</html>
