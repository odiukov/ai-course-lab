<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Почему совместное внимание быстро становится дорогим</title>
<style>
  :root{
    --bg:#f7f9fc;
    --panel:#ffffff;
    --panel-soft:#eef3f9;
    --ink:#182235;
    --muted:#5c6b80;
    --line:#9aabc0;
    --blue:#3478d4;
    --blue-soft:#dcecff;
    --violet:#7658c8;
    --violet-soft:#e8e0ff;
    --orange:#d7792c;
    --orange-soft:#ffe7cf;
    --green:#21866d;
    --green-soft:#d9f2e9;
    --danger:#bd4b55;
    --danger-soft:#ffe0e3;
    --grid:#c7d2df;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#111722;
      --panel:#192230;
      --panel-soft:#202c3d;
      --ink:#edf3fb;
      --muted:#aab8ca;
      --line:#65768b;
      --blue:#73aaf2;
      --blue-soft:#213f64;
      --violet:#aa91ee;
      --violet-soft:#3d3263;
      --orange:#f0a15e;
      --orange-soft:#593a23;
      --green:#60c5a7;
      --green-soft:#204b40;
      --danger:#ef8991;
      --danger-soft:#592d34;
      --grid:#435267;
    }
  }
  html,body{background:var(--bg);color:var(--ink)}
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .figure{width:100%;background:var(--bg)}
  .title{font-size:20px;font-weight:bold;color:var(--ink)}
  svg{
    display:block;
    width:100%;
    height:auto;
    max-height:450px;
    background:var(--bg);
    border:1px solid var(--line);
  }
  .panel{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
  .card{fill:var(--panel-soft);stroke:var(--line);stroke-width:1.2}
  .main{fill:var(--ink);font-size:16px;font-weight:bold}
  .sub{fill:var(--muted);font-size:12px}
  .label{fill:var(--ink);font-size:13px}
  .small{fill:var(--muted);font-size:11px}
  .value{fill:var(--ink);font-size:18px;font-weight:bold}
  .big{fill:var(--ink);font-size:22px;font-weight:bold}
  .joint-cell{stroke:var(--panel);stroke-width:.5}
  .grid-line{stroke:var(--grid);stroke-width:.7}
  .strong-line{stroke:var(--line);stroke-width:1.5;fill:none}
  .arrow-line{stroke:var(--muted);stroke-width:1.8;fill:none}
  .frame{fill:var(--blue-soft);stroke:var(--blue);stroke-width:1.2}
  .time{fill:var(--violet);stroke:var(--panel);stroke-width:1.2}
  .space{fill:var(--orange-soft);stroke:var(--orange);stroke-width:1}
  .total{fill:var(--green-soft);stroke:var(--green);stroke-width:1.5}
  .saving{fill:var(--danger-soft);stroke:var(--danger);stroke-width:1.5}
  .fallback{font-size:16px;color:var(--ink)}
</style>
</head>
<body>
<main class="figure">
  <div class="title">Почему совместное внимание быстро становится дорогим</div>
  <svg id="diagram" viewBox="0 0 1000 450" width="1000" height="450"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="svgTitle svgDesc">
    <title id="svgTitle">Сравнение совместного и разделённого внимания</title>
    <desc id="svgDesc">Восемь кадров по четырнадцать на четырнадцать патчей дают 1568 токенов. Совместное внимание создаёт около 2,46 миллиона ячеек, а две части divided attention — около 320 тысяч.</desc>
    <g id="drawing"></g>
  </svg>
  <p id="fallback" class="fallback" hidden>Схема должна показать: 1568 токенов образуют совместную матрицу примерно из 2,46 млн ячеек, тогда как временная и пространственная части вместе требуют около 320 тыс.</p>
</main>
<script>
(() => {
  const data=[{
    z:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,
    ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,sixteen:16,
    twenty:20,twentyFour:24,twentyEight:28,thirty:30,thirtyFive:35,
    forty:40,fortyTwo:42,fortyFive:45,fortyEight:48,fifty:50,
    fiftyFive:55,sixty:60,sixtyFive:65,seventy:70,seventyFive:75,
    eighty:80,eightyFive:85,ninety:90,ninetyFive:95,hundred:100,
    oneTen:110,oneTwelve:112,oneTwenty:120,oneThirty:130,oneForty:140,
    oneFortyFive:145,oneFifty:150,oneFiftyFive:155,oneSixty:160,
    oneSeventy:170,oneEighty:180,oneEightyFive:185,oneNinety:190,
    oneNinetyFive:195,twoHundred:200,twoTen:210,twoFifteen:215,
    twoTwenty:220,twoTwentyFive:225,twoThirty:230,twoForty:240,
    twoFortyFive:245,twoFifty:250,twoSixty:260,twoSeventy:270,
    twoEighty:280,twoNinety:290,threeHundred:300,threeTen:310,
    threeTwenty:320,threeThirty:330,threeForty:340,threeFifty:350,
    threeSixty:360,threeSeventy:370,threeEighty:380,threeNinety:390,
    fourHundred:400,fourTen:410,fourTwenty:420,fourThirty:430,
    fourForty:440,fourFifty:450,fourSixty:460,fourEighty:480,
    fiveHundred:500,fiveTen:510,fiveTwenty:520,fiveThirty:530,
    fiveForty:540,fiveFifty:550,fiveSixty:560,fiveEighty:580,
    sixHundred:600,sixTwenty:620,sixForty:640,sixFifty:650,
    sixSixty:660,sixEighty:680,sevenHundred:700,sevenTen:710,
    sevenTwenty:720,sevenThirty:730,sevenForty:740,sevenFifty:750,
    sevenEighty:780,eightHundred:800,eightTen:810,eightTwenty:820,
    eightThirty:830,eightForty:840,eightFifty:850,eightSeventy:870,
    eightEighty:880,nineHundred:900,nineTen:910,nineTwenty:920,
    nineForty:940,nineFifty:950,nineSixty:960,nineSeventy:970,
    nineEighty:980,frame:38,gap:10,matrix:185,mini:72,spaceGrid:90,
    radius:6,labelOffset:8
  }];
  const D=data[D.z];
  const origin={x:D.z,y:D.z};
  const scale=D.one;
  const sx=x=>origin.x+x*scale;
  const sy=y=>origin.y+y*scale;

  const svg=document.getElementById("diagram");
  const root=document.getElementById("drawing");
  const fallback=document.getElementById("fallback");
  const NS="http://www.w3.org/2000/svg";

  function el(tag,attrs,parent=root,text){
    const node=document.createElementNS(NS,tag);
    Object.entries(attrs||{}).forEach(([key,value])=>node.setAttribute(key,value));
    if(text!==undefined) node.textContent=text;
    parent.appendChild(node);
    return node;
  }

  function rect(x,y,w,h,cls,rx=D.ten){
    return el("rect",{
      x:sx(x),y:sy(y),
      width:sx(x+w)-sx(x),height:sy(y+h)-sy(y),
      rx:sx(rx)-sx(D.z),ry:sy(rx)-sy(D.z),class:cls
    });
  }

  function line(x1,y1,x2,y2,cls){
    return el("line",{
      x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),class:cls
    });
  }

  function text(x,y,value,cls,anchor="start"){
    return el("text",{x:sx(x),y:sy(y),class:cls,"text-anchor":anchor},root,value);
  }

  function arrow(x1,y1,x2,y2){
    line(x1,y1,x2,y2,"arrow-line");
    const side=D.eight;
    el("polyline",{
      points:[
        `${sx(x2-side)},${sy(y2-side)}`,
        `${sx(x2)},${sy(y2)}`,
        `${sx(x2-side)},${sy(y2+side)}`
      ].join(" "),
      class:"arrow-line"
    });
  }

  function miniGrid(x,y,size,kind){
    rect(x,y,size,size,kind,D.three);
    const step=size/D.fourteen;
    for(let i=D.one;i<D.fourteen;i+=D.one){
      line(x+i*step,y,x+i*step,y+size,"grid-line");
      line(x,y+i*step,x+size,y+i*step,"grid-line");
    }
  }

  function matrixGrid(x,y,size,cells,mode){
    const cell=size/cells;
    for(let row=D.z;row<cells;row+=D.one){
      for(let col=D.z;col<cells;col+=D.one){
        const node=el("rect",{
          x:sx(x+col*cell),y:sy(y+row*cell),
          width:sx(x+(col+D.one)*cell)-sx(x+col*cell),
          height:sy(y+(row+D.one)*cell)-sy(y+row*cell),
          class:"joint-cell"
        });
        const key=(row*D.three+col*D.five)%D.eight;
        if(mode==="joint"){
          node.setAttribute("fill",key<D.three?"var(--danger)":
            key<D.six?"var(--violet)":"var(--blue)");
        }else{
          node.setAttribute("fill",key<D.four?"var(--orange-soft)":
            "var(--blue-soft)");
        }
      }
    }
    rect(x,y,size,size,"strong-line",D.three);
  }

  try{
    rect(D.twenty,D.twenty,D.fourSixty,D.fourTen,"panel",D.fourteen);
    rect(D.fiveTen,D.twenty,D.fourSixty,D.fourTen,"panel",D.fourteen);

    text(D.forty,D.fortyEight,"Совместное внимание","main");
    text(D.forty,D.seventy,"одна таблица «каждый с каждым»","sub");

    for(let frame=D.z;frame<D.eight;frame+=D.one){
      const x=D.fiftyFive+frame*(D.frame+D.gap);
      miniGrid(x,D.eightyFive,D.frame,"frame");
      text(x+D.frame/D.two,D.oneForty,String(frame+D.one),"small","middle");
    }

    text(D.fiftyFive,D.oneSixty,"T = 8 кадров","label");
    text(D.fourForty,D.oneSixty,"H = W = 14 патчей","label","end");

    rect(D.sixty,D.oneSeventy,D.threeEighty,D.forty,"card",D.twenty);
    text(D.twoFifty,D.oneNinetyFive,"8 × 14 × 14 = 1568 токенов","value","middle");

    arrow(D.twoFifty,D.twoFifteen,D.twoFifty,D.twoForty);

    text(D.twoFifty,D.twoThirty,"матрица 1568 × 1568","small","middle");
    matrixGrid(D.oneFifty,D.twoFifty,D.matrix,D.fourteen,"joint");

    text(D.oneForty,D.threeForty,"1568 строк","small","end");
    text(D.twoForty,D.twoFortyFive,"1568 столбцов","small","middle");

    rect(D.oneEightyFive,D.threeHundred,D.oneTwenty,D.sixty,"saving",D.twelve);
    text(D.twoFortyFive,D.threeTwentyFive,"≈ 2,46 млн","big","middle");
    text(D.twoFortyFive,D.threeFortyFive,"ячеек","label","middle");

    text(D.twoForty,D.fourSixty-D.forty,
      "стоимость растёт как квадрат числа токенов","sub","middle");

    text(D.fiveThirty,D.fortyEight,"Разделённое внимание","main");
    text(D.fiveThirty,D.seventy,"две более дешёвые части","sub");

    rect(D.fiveThirty,D.eightyFive,D.fourTwenty,D.oneThirty,"card",D.twelve);
    text(D.fiveFifty,D.oneTen,"1. Временная часть","main");

    line(D.fiveSixty,D.oneForty,D.sevenHundred,D.oneForty,"strong-line");
    for(let moment=D.z;moment<D.eight;moment+=D.one){
      const cx=D.fiveSixty+moment*D.twenty;
      el("circle",{
        cx:sx(cx),cy:sy(D.oneForty),
        r:sx(D.radius)-sx(D.z),class:"time"
      });
    }
    text(D.sixThirty,D.oneSixtyFive,"8 моментов","small","middle");

    arrow(D.sevenTen,D.oneForty,D.sevenThirty,D.oneForty);
    matrixGrid(D.sevenForty,D.oneTwelve,D.mini,D.eight,"time");

    text(D.eightThirty,D.oneThirty,"для каждой из","small");
    text(D.eightThirty,D.oneFifty,"196 позиций","label");

    rect(D.fiveFifty,D.oneEighty,D.threeEighty,D.twentyEight,
      "total",D.fourteen);
    text(D.sevenForty,D.twoHundred,
      "196 × 8² ≈ 12,5 тыс. ячеек","label","middle");

    rect(D.fiveThirty,D.twoThirty,D.fourTwenty,D.oneThirty,"card",D.twelve);
    text(D.fiveFifty,D.twoFiftyFive,"2. Пространственная часть","main");

    miniGrid(D.fiveFifty,D.twoSeventy,D.spaceGrid,"space");
    text(D.fiveNinety=D.fiveEighty+D.ten,D.threeSeventy-D.five,
      "14 × 14 = 196","small","middle");

    arrow(D.sixFifty,D.threeTen,D.sevenTen,D.threeTen);
    matrixGrid(D.sevenTwenty,D.twoSeventy,D.spaceGrid,D.fourteen,"space");

    text(D.eightThirty,D.twoNinetyFive,"для каждого из","small");
    text(D.eightThirty,D.threeFifteen,"8 кадров","label");

    rect(D.fiveFifty,D.threeThirty,D.threeEighty,D.twentyEight,
      "total",D.fourteen);
    text(D.sevenForty,D.threeFifty,
      "8 × 196² ≈ 307 тыс. ячеек","label","middle");

    rect(D.fiveThirty,D.threeEighty,D.twoFifty,D.forty,"total",D.twenty);
    text(D.sixFifty,D.fourHundred+D.five,
      "всего ≈ 320 тыс.","value","middle");

    rect(D.eightHundred,D.threeEighty,D.oneFifty,D.forty,
      "saving",D.twenty);
    text(D.eightSeventy+D.five,D.fourHundred+D.five,
      "почти в 8 раз меньше","label","middle");

  }catch(error){
    root.replaceChildren();
    svg.hidden=true;
    fallback.hidden=false;
  }
})();
</script>
</body>
</html>
