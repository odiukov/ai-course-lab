- concept: top-k accuracy равна доле примеров с попаданием истинной метки в первые k позиций
  question: На наборе из 240 видео истинная метка вошла в top-6 для 216 видео. Чему равна top-6 accuracy в процентах?
  explanation: 'Для каждого видео попадание оценивается двоично, после чего успешные случаи усредняются: 216 / 240 × 100% = 90%.'
  kind: numeric
  answer: 90
  tolerance: 0.1
