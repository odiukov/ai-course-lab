  fingerprint: ec4ba72b
- concept: корректное сравнение моделей требует одинакового значения k
  question: Объясни своими словами, почему нельзя напрямую заключить, что модель с более высокой top-k accuracy лучше другой модели, если метрики рассчитаны при разных значениях k.
  explanation: 'Значение k задаёт строгость метрики: чем шире список допустимых прогнозов, тем вероятнее попадание. Метрики с разными k измеряют результат при разных условиях.'
  kind: open
  reference: Увеличение k даёт модели больше допустимых ответов и само по себе облегчает попадание истинной метки в выбранный список. Поэтому для прямого сравнения обеих моделей нужно использовать одно и то же k.
