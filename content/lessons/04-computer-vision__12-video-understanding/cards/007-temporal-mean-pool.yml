- concept: temporal mean pooling вычисляет среднее каждой координаты признаков по кадрам
  question: Значения фиксированной координаты покадрового признака равны 7, 19 и 31. Какое значение этой координаты получится после temporal mean pooling?
  explanation: 'Temporal mean pooling вычисляет обычное среднее по кадрам: (7 + 19 + 31) / 3 = 19. Та же операция независимо применяется ко всем координатам признакового вектора.'
