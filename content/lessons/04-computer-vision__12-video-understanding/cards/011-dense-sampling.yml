- concept: плотная выборка обменивает глобальный временной охват на подробное представление короткого движения
  question: Объясни своими словами главное ограничение плотной выборки при фиксированном бюджете кадров.
  explanation: Соседние кадры дают высокую временную детализацию внутри короткого окна. Цена этой детализации — слабый охват всего ролика и риск выбрать фрагмент, в котором нужного события нет.
  kind: open
  reference: Плотная выборка подробно показывает небольшой непрерывный отрезок видео, но почти не охватывает остальную длительность. Поэтому выбранное окно может не попасть на ключевое действие.
  id: 011-dense-sampling-2
  fingerprint: fdaf8d5e
