- concept: video-level accuracy можно корректно сравнивать только при одинаковом протоколе multi-clip-инференса
  question: Модель A получила 84% video-level accuracy при усреднении прогнозов по 4 клипам, а модель B — 83% при усреднении по 16 клипам. Можно ли по этим результатам уверенно заключить, что модель A лучше?
  explanation: Число и способ выборки клипов влияют на video-level accuracy. Без одинакового протокола нельзя отделить качество модели от выигрыша, который дал multi-clip-инференс.
  kind: choice
  options:
    - Да, потому что её итоговая точность выше
    - Нет, сначала нужно сравнить модели при одинаковом числе клипов и одинаковом способе их выборки
    - Да, потому что меньшее число клипов всегда усложняет распознавание
  correct: 1
  id: 038-proverka-metrics-1
  fingerprint: 4c392b35
- concept: совместная публикация clip-level и video-level accuracy отделяет качество одного просмотра от выигрыша тестового усреднения
  question: Почему отчёт только с video-level accuracy не позволяет полностью оценить видеоклассификатор?
  explanation: Например, результат 78% на клипах и 82% на видео показывает, что четыре процентных пункта появились благодаря нескольким просмотрам при проверке. Одно итоговое число этого не раскрывает.
  kind: open
  reference: Video-level accuracy включает эффект усреднения прогнозов нескольких клипов и скрывает качество отдельного просмотра. Для полной оценки нужно также указать clip-level accuracy и протокол multi-clip-инференса.
  id: 038-proverka-metrics-2
  fingerprint: 43ed56ed
