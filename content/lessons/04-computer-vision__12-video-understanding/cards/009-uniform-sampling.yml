- concept: равномерная выборка распределяет фиксированный бюджет кадров по всей длительности видео
  question: Событие может произойти в любой части длинного ролика, а модель принимает лишь небольшое фиксированное число кадров. Каково главное преимущество равномерного sampler?
  explanation: Равномерный sampler берёт кадры через примерно одинаковые временные интервалы, поэтому ограниченный бюджет покрывает начало, середину и финальную часть видео. Короткие события между выбранными моментами при этом всё ещё могут потеряться.
  kind: choice
  options:
    - Он повышает пространственное разрешение каждого кадра
    - Он распределяет выбранные кадры по всей временной оси ролика
    - Он гарантированно сохраняет любое кратковременное действие
    - Он выбирает только последовательные кадры с наиболее плавным движением
  correct: 1
  id: 009-uniform-sampling-1
  fingerprint: 7e662394
- concept: индексы равномерной выборки вычисляются как целая часть произведения номера позиции на отношение длины видео к числу кадров
  question: В ролике 126 кадров, а sampler должен вернуть T=5 кадров по формуле int(i * num_frames_total / T). Каков последний выбранный индекс?
  explanation: 'Для последней позиции i=4: int(4 × 126 / 5) = int(100.8) = 100. Последний выбранный кадр открывает заключительный временной участок, поэтому sampler не обязан выбирать последний кадр ролика.'
  kind: numeric
  answer: 100
  tolerance: 0.1
