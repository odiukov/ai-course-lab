- concept: один отклик пространственно-временной свёртки совместно зависит от локальных областей соседних кадров
  question: Почему пространственно-временная свёртка может обнаружить короткое локальное движение уже в одной операции, а покадровая пространственная свёртка — нет?
  explanation: Объёмное ядро сопоставляет содержимое соседних моментов внутри общего локального окна. Изменение положения или формы объекта поэтому непосредственно влияет на один признак, тогда как покадровой обработке требуется отдельный последующий механизм объединения кадров.
  kind: open
  reference: Её ядро одновременно взвешивает пиксели из локальных областей соседних кадров, поэтому отклик зависит от изменения изображения во времени. Покадровое ядро видит только пространственные связи внутри одного момента.
