- concept: малый и однообразный набор действий усиливает риск обучения по случайным фоновым подсказкам
  question: Почему высокую точность на небольшом старом наборе распознавания действий следует интерпретировать осторожно, если для каждого класса часто повторяются одинаковые фоны и ракурсы?
  explanation: В небольших наборах вроде UCF-101 и HMDB-51 повторяющиеся условия съёмки дают особенно сильные побочные признаки. Оценка может отражать использование этих признаков, а не устойчивое распознавание действия.
  kind: open
  reference: Модель может запомнить корреляции класса с фоном, ракурсом или условиями съёмки вместо самого движения. Из-за малого разнообразия такие короткие пути хорошо работают на тестовой части того же набора, но не подтверждают способность понимать динамику и могут плохо переноситься на другие условия.
  id: 033-datasets-appearance-2
  fingerprint: 84d24347
