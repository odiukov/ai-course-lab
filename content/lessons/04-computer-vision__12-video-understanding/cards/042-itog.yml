- concept: временная протяжённость свёрток увеличивает вычислительную стоимость видеосети
  question: Почему FramePool обычно требует заметно меньше вычислений, чем I3D при обработке одинакового набора кадров?
  explanation: У I3D временная ось входит в свёрточные ядра многих слоёв и добавляет операции для смешивания соседних кадров. У FramePool временное объединение признаков обычно представляет собой сравнительно дешёвое усреднение.
  kind: choice
  options:
    - FramePool выполняет пространственную обработку кадров и дешёвую агрегацию, тогда как I3D применяет пространственно-временные ядра во многих слоях
    - FramePool обучается без операции обратного распространения ошибки
    - I3D обязана хранить каждый обучающий ролик внутри параметров модели
    - FramePool автоматически уменьшает число классов задачи
