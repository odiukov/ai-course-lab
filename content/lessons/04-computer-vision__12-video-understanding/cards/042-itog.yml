- concept: контролируемый синтетический набор изолирует временной сигнал от подсказок внешнего вида
  question: Объясни, зачем сравнивать FramePool и модель с временным моделированием на синтетических роликах, где объекты выглядят одинаково, а классы различаются только направлением движения.
  explanation: В исходном упражнении классы задаются направлением движения шариков. Одинаковый внешний вид во всех классах превращает набор в диагностический тест временного моделирования.
  kind: open
  reference: Такой набор устраняет различия объектов и фона как источник ответа, поэтому модели приходится использовать изменение кадров во времени. Если временная модель заметно превосходит случайный уровень, а FramePool остаётся около него, это свидетельствует, что выигрыш связан со способностью извлекать динамику, а не с подсказками внешнего вида.
