- concept: подготовка кадров должна сохранять геометрические пропорции изображения
  question: Из широкого видеокадра нужно получить квадратный вход модели без геометрического искажения объектов. Какая последовательность корректна?
  explanation: Пропорциональный resize использует одинаковый масштаб по обеим пространственным осям, а последующий crop меняет поле зрения, но не форму объектов. Независимое масштабирование ширины и высоты незаметно растягивает или сжимает изображение.
  kind: choice
  options:
    - Пропорционально изменить размер кадра, затем вырезать квадратную область
    - Независимо растянуть ширину и высоту кадра до квадратной формы
    - Отбросить правую половину кадра, а оставшуюся часть растянуть до квадрата
  correct: 0
