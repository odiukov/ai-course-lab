- concept: исключительная верхняя граница генератора должна находиться сразу после последнего допустимого старта
  question: Плотный sampler выбирает начало окна через `rng.integers(low, high)`. Как задать `high`, чтобы sampler мог выбрать и самый поздний допустимый старт?
  explanation: В `rng.integers` верхняя граница не включается. Поэтому `high` должен стоять сразу после последнего допустимого старта; иначе крайнее окно никогда не будет выбрано.
  kind: choice
  options:
    - Передать сам самый поздний допустимый старт
    - Передать последний индекс исходного видео
    - Передать целое значение, следующее за самым поздним допустимым стартом
  correct: 2
  id: 012-sample-dense-1
  fingerprint: 34da5f21
- concept: внедрение генератора со стабильным seed делает случайную выборку воспроизводимой в независимых запусках теста
  question: Как организовать проверку `sample_dense`, чтобы в независимых запусках теста она выбирала один и тот же случайный фрагмент?
  explanation: Последовательность псевдослучайных значений определяется seed и текущим состоянием генератора. Одинаково инициализированные генераторы воспроизводят выбор, а каждый вызов существующего генератора продвигает его состояние.
  kind: open
  reference: Перед каждым независимым запуском создать генератор NumPy с одним и тем же фиксированным seed и передать его через параметр `rng`. Простое повторное использование уже сработавшего генератора не гарантирует тот же результат, поскольку его состояние изменяется.
  id: 012-sample-dense-2
  fingerprint: 3ddeeca2
