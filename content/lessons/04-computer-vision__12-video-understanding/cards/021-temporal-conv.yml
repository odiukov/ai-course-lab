- concept: перестановка осей позволяет применять временную свёртку независимо к каждой пространственной позиции каждого видео
  question: Тензор видео имеет форму [B, T, H, W, C], а операция свёртки ожидает оси [N, C, L]. Как подготовить данные, чтобы ядро двигалось только по времени и не смешивало разные видео или пространственные позиции?
  explanation: После перестановки и объединения размерностей каждая пара «видео и пространственная позиция» становится отдельным элементом N, каналы остаются каналами, а T становится длиной L. Поэтому ядро связывает соседние моменты, не переходя между видео или координатами изображения.
  kind: choice
  options:
    - Переставить оси в [B, H, W, C, T], затем объединить B, H и W в ось N
    - Переставить оси в [B, T, C, H, W], затем объединить B и T в ось N
    - Объединить B и C в ось N, а H и W — в ось L
    - Оставить исходный порядок и считать ось C временной
  correct: 0
  id: 021-temporal-conv-1
  fingerprint: 75947b82
- concept: сохраняющее временное дополнение применяется только вдоль временной оси
  question: Объясни, как дополнить вход для временной свёртки с нечётным ядром, чтобы сохранить число моментов и не внести пространственное смешивание.
  explanation: 'Для ядра размера 3 добавление одного пустого момента с каждой стороны сохраняет исходную длину T. Padding по H или W здесь лишний: он изменяет пространственную обработку, которой у чистой временной свёртки быть не должно.'
  kind: open
  reference: Нужно симметрично добавить пустые значения в начале и конце временной оси. Размер дополнения с каждой стороны равен половине ширины ядра без его центрального элемента. Высоту и ширину дополнять не нужно, поскольку свёртка выполняется только по времени.
  id: 021-temporal-conv-2
  fingerprint: 9f43058c
