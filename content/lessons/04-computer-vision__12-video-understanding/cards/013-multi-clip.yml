- concept: число окон задаёт компромисс между временным покрытием видео и вычислительной стоимостью
  question: Объясни, что происходит с временным покрытием и стоимостью инференса при увеличении числа окон в multi-clip.
  explanation: Multi-clip расширяет обзор за счёт дополнительных независимых окон. Это делает прогноз устойчивее к неудачному выбору фрагмента, но увеличивает число проходов модели.
  kind: open
  reference: Большее число окон позволяет охватить больше частей видео и снижает риск пропустить важное событие, но каждое дополнительное окно требует отдельной классификации, поэтому вычислительная стоимость растёт примерно пропорционально числу окон.
