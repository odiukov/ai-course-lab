- concept: временная свёртка вычисляет взвешенную сумму признаков в локальном временном окне
  question: Заполни формулу отклика временной свёртки в момент t.
  explanation: Для каждого смещения τ признак x умножается на соответствующий вес ядра w, после чего произведения складываются. Поэтому соседние моменты могут влиять на отклик по-разному.
  kind: cloze
  template: y_t = Σ_τ ___
  answer: w_τ · x_{t+τ}
  accept:
    - x_{t+τ} · w_τ
    - w_τ x_{t+τ}
  id: 020-temporal-conv-rule-1
  fingerprint: c9698f6f
- concept: веса временного ядра обучаются под целевую задачу
  question: Как нейросеть обычно получает коэффициенты временного свёрточного ядра для распознавания действий?
  explanation: Веса временного ядра являются обучаемыми параметрами. Оптимизатор изменяет их по градиенту функции потерь, поэтому разные ядра могут специализироваться на разных временных изменениях.
  kind: choice
  options:
    - Коэффициенты заранее задаёт разработчик и не меняет при обучении
    - Коэффициенты обновляются вместе с остальными параметрами по сигналу функции потерь
    - Все коэффициенты автоматически становятся одинаковыми после первого прохода
    - Коэффициенты определяются только частотой кадров и не зависят от данных
  correct: 1
  id: 020-temporal-conv-rule-2
  fingerprint: aab1f49b
