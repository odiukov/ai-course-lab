<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Три способа получить результат Run</title>
<style>
:root{
  color-scheme:light dark;
  --page:#eef3f8;
  --bg:#ffffff;
  --card:#f7f9fc;
  --ink:#172033;
  --muted:#596579;
  --border:#bcc8d8;
  --sync:#1769aa;
  --sync-fill:#e5f2fc;
  --async:#9a5a00;
  --async-fill:#fff0d5;
  --stream:#087f6b;
  --stream-fill:#ddf7f0;
  --common:#6552a3;
  --common-fill:#eeeafd;
}
@media (prefers-color-scheme:dark){
  :root{
    --page:#111722;
    --bg:#171f2c;
    --card:#202a39;
    --ink:#eef3fb;
    --muted:#b7c2d2;
    --border:#536176;
    --sync:#75c5ff;
    --sync-fill:#183a52;
    --async:#ffc56e;
    --async-fill:#49351d;
    --stream:#66dec5;
    --stream-fill:#173f39;
    --common:#b9a7ff;
    --common-fill:#332d50;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page)}
body{
  color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}
figure{
  width:100%;
  max-width:1180px;
  margin:0 auto;
  background:var(--bg);
}
h1{
  margin:0;
  padding:14px 22px;
  border-bottom:2px solid var(--border);
  font-size:24px;
  line-height:1.2;
}
svg{
  display:block;
  width:100%;
  height:auto;
  background:var(--bg);
}
.bg{fill:var(--bg)}
.card{fill:var(--card);stroke:var(--border);stroke-width:2}
.common{fill:var(--common-fill);stroke:var(--common);stroke-width:2}
.sync{fill:var(--sync-fill);stroke:var(--sync);stroke-width:2}
.async{fill:var(--async-fill);stroke:var(--async);stroke-width:2}
.stream{fill:var(--stream-fill);stroke:var(--stream);stroke-width:2}
.accent-common{fill:var(--common)}
.line-common{fill:none;stroke:var(--common);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.line-sync{fill:none;stroke:var(--sync);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.line-async{fill:none;stroke:var(--async);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.line-stream{fill:none;stroke:var(--stream);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.head{stroke:none}
.line-common.head{fill:var(--common)}
.line-sync.head{fill:var(--sync)}
.line-async.head{fill:var(--async)}
.line-stream.head{fill:var(--stream)}
.event-stream{fill:var(--bg);stroke:var(--stream);stroke-width:3}
.rule{fill:none;stroke:var(--border);stroke-width:2}
text{fill:var(--ink);font-size:14px}
.title{font-size:15px;font-weight:bold}
.mode{font-size:16px;font-weight:bold}
.token{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.small{fill:var(--muted);font-size:13px}
.result{font-size:15px;font-weight:bold}
.note{fill:var(--muted);font-size:13px}
#fallback{
  padding:22px;
  border-top:2px solid var(--border);
  background:var(--bg);
  font-size:16px;
}
</style>
</head>
<body>
<figure aria-labelledby="diagram-title">
  <h1 id="diagram-title">Три способа получить результат Run</h1>
  <svg id="diagram" width="1180" height="440" viewBox="0 0 1180 440"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="diagram-title diagram-description">
    <title id="diagram-description">Один Run и три параллельных способа доставки результата: sync, async и stream.</title>
  </svg>
  <div id="fallback" hidden>
    Один и тот же Run может вернуть готовый ответ через sync, код 202 и id
    для последующих GET /runs/{id} через async или события SSE через stream.
  </div>
  <noscript>
    <div id="fallback-noscript">
      Один Run: sync возвращает итог целиком; async возвращает 202 и требует
      GET /runs/{id}; stream передаёт события SSE.
    </div>
  </noscript>
</figure>
<script>
const data=[
  {o:{x:0,y:0},s:{x:1,y:1},bg:[0,0,1180,440]},
  [
    {t:"r",q:[28,36,270,392],k:"card"},
    {t:"r",q:[28,36,36,392],k:"accent-common"},
    {t:"r",q:[54,79,244,131],k:"common"},
    {t:"x",q:[54,66],v:"ОДИН И ТОТ ЖЕ",k:"title",a:"start"},
    {t:"x",q:[149,113],v:"Run",k:"mode token",a:"middle"},
    {t:"x",q:[54,171],v:"Работа внутри:",k:"title",a:"start"},
    {t:"x",q:[54,199],v:"created → in_progress",k:"small token",a:"start"},
    {t:"x",q:[54,225],v:"→ completed / failed",k:"small token",a:"start"},
    {t:"x",q:[54,272],v:"Не режим скорости.",k:"small",a:"start"},
    {t:"x",q:[54,298],v:"Не другой вид работы.",k:"small",a:"start"},
    {t:"x",q:[54,344],v:"Меняется только",k:"title",a:"start"},
    {t:"x",q:[54,369],v:"доставка результата.",k:"title",a:"start"},
    {t:"p",q:[[270,214],[310,214]],k:"line-common"},
    {t:"p",q:[[310,91],[310,343]],k:"line-common"},
    {t:"a",q:[[310,91],[331,91]],h:[[340,91],[331,85],[331,97]],k:"line-common"},
    {t:"a",q:[[310,217],[331,217]],h:[[340,217],[331,211],[331,223]],k:"line-common"},
    {t:"a",q:[[310,343],[331,343]],h:[[340,343],[331,337],[331,349]],k:"line-common"}
  ],
  [
    {t:"r",q:[340,35,1145,147],k:"card"},
    {t:"r",q:[360,50,465,84],k:"sync"},
    {t:"x",q:[412,73],v:"sync",k:"mode token",a:"middle"},
    {t:"x",q:[360,116],v:"ждём в исходном запросе",k:"small",a:"start"},
    {t:"a",q:[[480,91],[851,91]],h:[[862,91],[851,84],[851,98]],k:"line-sync"},
    {t:"x",q:[490,69],v:"POST /runs",k:"small token",a:"start"},
    {t:"x",q:[660,119],v:"соединение остаётся открытым",k:"small",a:"middle"},
    {t:"r",q:[862,52,1124,128],k:"sync"},
    {t:"x",q:[993,83],v:"готовый ответ",k:"result",a:"middle"},
    {t:"x",q:[993,108],v:"целиком",k:"small",a:"middle"}
  ],
  [
    {t:"r",q:[340,161,1145,273],k:"card"},
    {t:"r",q:[360,176,465,210],k:"async"},
    {t:"x",q:[412,199],v:"async",k:"mode token",a:"middle"},
    {t:"x",q:[360,244],v:"сохраняем id и уходим",k:"small",a:"start"},
    {t:"a",q:[[470,217],[490,217]],h:[[500,217],[490,211],[490,223]],k:"line-async"},
    {t:"x",q:[500,178],v:"POST /runs",k:"small token",a:"start"},
    {t:"r",q:[500,185,645,249],k:"async"},
    {t:"x",q:[572,214],v:"202 + id",k:"result token",a:"middle"},
    {t:"x",q:[572,236],v:"сразу",k:"small",a:"middle"},
    {t:"a",q:[[655,217],[915,217]],h:[[925,217],[915,210],[915,224]],k:"line-async"},
    {t:"x",q:[786,190],v:"периодически: GET /runs/{id}",k:"small token",a:"middle"},
    {t:"x",q:[786,244],v:"пока Run не завершён",k:"small",a:"middle"},
    {t:"r",q:[925,185,1124,249],k:"async"},
    {t:"x",q:[1024,214],v:"завершён",k:"result",a:"middle"},
    {t:"x",q:[1024,236],v:"итог доступен",k:"small",a:"middle"}
  ],
  [
    {t:"r",q:[340,287,1145,399],k:"card"},
    {t:"r",q:[360,302,465,336],k:"stream"},
    {t:"x",q:[412,325],v:"stream",k:"mode token",a:"middle"},
    {t:"x",q:[360,371],v:"держим поток SSE",k:"small",a:"start"},
    {t:"a",q:[[490,343],[1112,343]],h:[[1122,343],[1112,336],[1112,350]],k:"line-stream"},
    {t:"x",q:[490,318],v:"поток SSE",k:"small token",a:"start"},
    {t:"g",q:[[612,343],[620,335],[628,343],[620,351]],k:"event-stream"},
    {t:"x",q:[620,316],v:"начало",k:"small",a:"middle"},
    {t:"g",q:[[792,343],[800,335],[808,343],[800,351]],k:"event-stream"},
    {t:"x",q:[800,376],v:"части результата",k:"small",a:"middle"},
    {t:"g",q:[[992,343],[1000,335],[1008,343],[1000,351]],k:"event-stream"},
    {t:"x",q:[1000,316],v:"завершение",k:"small",a:"middle"}
  ],
  [
    {t:"p",q:[[28,416],[1152,416]],k:"rule"},
    {t:"x",q:[590,434],v:"Работа одна · меняется доставка и место ожидания · скорость не гарантируется",k:"note",a:"middle"}
  ]
];
const [cfg,...groups]=data;
const origin=Object.freeze(cfg.o);
const scale=Object.freeze(cfg.s);
function sx(x){return origin.x+x*scale.x}
function sy(y){return origin.y+y*scale.y}

try{
  const svg=document.querySelector("#diagram");
  const ns=svg.namespaceURI;

  function E(name,attrs){
    const node=document.createElementNS(ns,name);
    for(const [key,value] of Object.entries(attrs))node.setAttribute(key,value);
    svg.appendChild(node);
    return node;
  }
  function R(q,k){
    const [x1,y1,x2,y2]=q;
    E("rect",{x:sx(x1),y:sy(y1),width:sx(x2)-sx(x1),height:sy(y2)-sy(y1),class:k});
  }
  function P(q,k){
    const [first,...rest]=q;
    const [x,y]=first;
    const d=`M ${sx(x)} ${sy(y)}${rest.map(([px,py])=>` L ${sx(px)} ${sy(py)}`).join("")}`;
    E("path",{d,class:k});
  }
  function G(q,k){
    E("polygon",{points:q.map(([x,y])=>`${sx(x)},${sy(y)}`).join(" "),class:k});
  }
  function X(q,v,k,a){
    const [x,y]=q;
    const node=E("text",{x:sx(x),y:sy(y),class:k,"text-anchor":a});
    node.textContent=v;
  }

  R(cfg.bg,"bg");
  for(const group of groups)for(const item of group){
    if(item.t==="r")R(item.q,item.k);
    else if(item.t==="p")P(item.q,item.k);
    else if(item.t==="g")G(item.q,item.k);
    else if(item.t==="x")X(item.q,item.v,item.k,item.a);
    else if(item.t==="a"){P(item.q,item.k);G(item.h,`${item.k} head`)}
  }
}catch(error){
  const svg=document.querySelector("#diagram");
  const fallback=document.querySelector("#fallback");
  if(svg)svg.hidden=true;
  if(fallback)fallback.hidden=false;
}
</script>
</body>
</html>
