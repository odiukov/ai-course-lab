<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дерево выбора набора протоколов</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f9fc;
    --ink: #172033;
    --muted: #526078;
    --line: #65738b;
    --question-fill: #ffffff;
    --question-stroke: #8290a8;
    --mcp-fill: #d1fae5;
    --mcp-stroke: #059669;
    --a2a-fill: #dbeafe;
    --a2a-stroke: #2563eb;
    --acp-fill: #fef3c7;
    --acp-stroke: #d97706;
    --anp-fill: #f3e8ff;
    --anp-stroke: #7c3aed;
    --broker-fill: #e0e7ff;
    --broker-stroke: #4338ca;
    --none-fill: #eef1f6;
    --none-stroke: #7b8799;
  }

  body {
    background: var(--page);
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
      "Segoe UI", sans-serif;
  }

  main {
    max-width: 1200px;
  }

  h1 {
    font-size: 20px;
    line-height: 24px;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    background: var(--page);
    font-family: inherit;
  }

  .node {
    stroke-width: 2;
  }

  .question-node {
    fill: var(--question-fill);
    stroke: var(--question-stroke);
  }

  .mcp-node {
    fill: var(--mcp-fill);
    stroke: var(--mcp-stroke);
  }

  .a2a-node {
    fill: var(--a2a-fill);
    stroke: var(--a2a-stroke);
  }

  .acp-node {
    fill: var(--acp-fill);
    stroke: var(--acp-stroke);
  }

  .anp-node {
    fill: var(--anp-fill);
    stroke: var(--anp-stroke);
  }

  .broker-node {
    fill: var(--broker-fill);
    stroke: var(--broker-stroke);
  }

  .none-node {
    fill: var(--none-fill);
    stroke: var(--none-stroke);
  }

  .connector {
    fill: none;
    stroke: var(--line);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .arrow {
    fill: var(--line);
  }

  .kicker {
    fill: var(--muted);
    font-size: 10px;
    font-weight: 700;
  }

  .question {
    fill: var(--ink);
    font-size: 15px;
    font-weight: 650;
  }

  .result-title {
    fill: var(--ink);
    font-size: 17px;
    font-weight: 750;
  }

  .result-note {
    fill: var(--muted);
    font-size: 13px;
    font-weight: 500;
  }

  .edge-label {
    fill: var(--muted);
    font-size: 13px;
    font-weight: 700;
    paint-order: stroke;
    stroke: var(--page);
    stroke-width: 5;
    stroke-linejoin: round;
  }

  .fallback {
    fill: var(--ink);
    font-size: 16px;
    font-weight: 600;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #111722;
      --ink: #edf2f9;
      --muted: #b1bdd0;
      --line: #a7b3c6;
      --question-fill: #1b2432;
      --question-stroke: #7f8da3;
      --mcp-fill: #123c32;
      --mcp-stroke: #34d399;
      --a2a-fill: #172f52;
      --a2a-stroke: #60a5fa;
      --acp-fill: #473516;
      --acp-stroke: #fbbf24;
      --anp-fill: #38214f;
      --anp-stroke: #c084fc;
      --broker-fill: #272d59;
      --broker-stroke: #818cf8;
      --none-fill: #252d39;
      --none-stroke: #94a3b8;
    }
  }
</style>
</head>
<body>
<main>
  <h1 id="diagram-heading">Дерево выбора набора протоколов</h1>
  <svg id="diagram" viewBox="0 0 1200 430" width="1200" height="430"
       preserveAspectRatio="xMidYMid meet"
       role="img" aria-labelledby="diagram-heading diagram-description">
    <title>Дерево выбора набора протоколов</title>
    <desc id="diagram-description">
      Инструменты ведут к MCP, сотрудничество агентов — к A2A,
      аудит добавляет ACP, а отсутствие общей инфраструктуры для внешних
      агентов добавляет ANP.
    </desc>
    <g id="generated"></g>
  </svg>
</main>
<script>
const diagram = Object.freeze({
  zero: 0,
  half: 0.5,
  radius: 12,
  nodes: [
    {
      x: 450, y: 17, w: 300, h: 62, kind: "question-node",
      lines: [
        { text: "ВОПРОС", dy: 18, role: "kicker" },
        { text: "Нужны инструменты?", dy: 43, role: "question" }
      ]
    },
    {
      x: 825, y: 17, w: 310, h: 62, kind: "mcp-node",
      lines: [
        { text: "MCP", dy: 28, role: "result-title" },
        { text: "агент ↔ инструмент", dy: 48, role: "result-note" }
      ]
    },
    {
      x: 450, y: 100, w: 300, h: 62, kind: "question-node",
      lines: [
        { text: "ВОПРОС", dy: 16, role: "kicker" },
        { text: "Агенты общаются", dy: 37, role: "question" },
        { text: "друг с другом?", dy: 54, role: "question" }
      ]
    },
    {
      x: 825, y: 100, w: 310, h: 62, kind: "none-node",
      lines: [
        { text: "Специальный протокол", dy: 27, role: "result-title" },
        { text: "не нужен", dy: 48, role: "result-note" }
      ]
    },
    {
      x: 450, y: 183, w: 300, h: 62, kind: "question-node",
      lines: [
        { text: "ВОПРОС", dy: 18, role: "kicker" },
        { text: "Нужен аудит?", dy: 43, role: "question" }
      ]
    },
    {
      x: 825, y: 183, w: 310, h: 62, kind: "acp-node",
      lines: [
        { text: "A2A + ACP", dy: 28, role: "result-title" },
        { text: "проверяемая траектория", dy: 48, role: "result-note" }
      ]
    },
    {
      x: 450, y: 266, w: 300, h: 62, kind: "question-node",
      lines: [
        { text: "ВОПРОС", dy: 16, role: "kicker" },
        { text: "Все агенты внутри", dy: 37, role: "question" },
        { text: "организации?", dy: 54, role: "question" }
      ]
    },
    {
      x: 825, y: 266, w: 310, h: 62, kind: "a2a-node",
      lines: [
        { text: "A2A", dy: 28, role: "result-title" },
        { text: "карточки агентов + задачи", dy: 48, role: "result-note" }
      ]
    },
    {
      x: 450, y: 349, w: 300, h: 62, kind: "question-node",
      lines: [
        { text: "ВОПРОС", dy: 16, role: "kicker" },
        { text: "Есть общая", dy: 37, role: "question" },
        { text: "инфраструктура?", dy: 54, role: "question" }
      ]
    },
    {
      x: 65, y: 349, w: 310, h: 62, kind: "broker-node",
      lines: [
        { text: "A2A + брокер сообщений", dy: 28, role: "result-title" },
        { text: "общая инфраструктура", dy: 48, role: "result-note" }
      ]
    },
    {
      x: 825, y: 349, w: 310, h: 62, kind: "anp-node",
      lines: [
        { text: "ANP + A2A", dy: 28, role: "result-title" },
        { text: "проверка DID", dy: 48, role: "result-note" }
      ]
    }
  ],
  edges: [
    {
      points: [{ x: 750, y: 48 }, { x: 817, y: 48 }],
      arrow: [{ x: 825, y: 48 }, { x: 817, y: 43 }, { x: 817, y: 53 }],
      label: { text: "Да", x: 765, y: 38, anchor: "start" }
    },
    {
      points: [{ x: 600, y: 79 }, { x: 600, y: 92 }],
      arrow: [{ x: 600, y: 100 }, { x: 595, y: 92 }, { x: 605, y: 92 }],
      label: { text: "Нет", x: 612, y: 94, anchor: "start" }
    },
    {
      points: [{ x: 750, y: 131 }, { x: 817, y: 131 }],
      arrow: [{ x: 825, y: 131 }, { x: 817, y: 126 }, { x: 817, y: 136 }],
      label: { text: "Нет", x: 765, y: 121, anchor: "start" }
    },
    {
      points: [{ x: 600, y: 162 }, { x: 600, y: 175 }],
      arrow: [{ x: 600, y: 183 }, { x: 595, y: 175 }, { x: 605, y: 175 }],
      label: { text: "Да", x: 612, y: 177, anchor: "start" }
    },
    {
      points: [{ x: 750, y: 214 }, { x: 817, y: 214 }],
      arrow: [{ x: 825, y: 214 }, { x: 817, y: 209 }, { x: 817, y: 219 }],
      label: { text: "Да", x: 765, y: 204, anchor: "start" }
    },
    {
      points: [{ x: 600, y: 245 }, { x: 600, y: 258 }],
      arrow: [{ x: 600, y: 266 }, { x: 595, y: 258 }, { x: 605, y: 258 }],
      label: { text: "Нет", x: 612, y: 260, anchor: "start" }
    },
    {
      points: [{ x: 750, y: 297 }, { x: 817, y: 297 }],
      arrow: [{ x: 825, y: 297 }, { x: 817, y: 292 }, { x: 817, y: 302 }],
      label: { text: "Да", x: 765, y: 287, anchor: "start" }
    },
    {
      points: [{ x: 600, y: 328 }, { x: 600, y: 341 }],
      arrow: [{ x: 600, y: 349 }, { x: 595, y: 341 }, { x: 605, y: 341 }],
      label: { text: "Нет", x: 612, y: 343, anchor: "start" }
    },
    {
      points: [{ x: 450, y: 380 }, { x: 383, y: 380 }],
      arrow: [{ x: 375, y: 380 }, { x: 383, y: 375 }, { x: 383, y: 385 }],
      label: { text: "Да", x: 435, y: 370, anchor: "end" }
    },
    {
      points: [{ x: 750, y: 380 }, { x: 817, y: 380 }],
      arrow: [{ x: 825, y: 380 }, { x: 817, y: 375 }, { x: 817, y: 385 }],
      label: { text: "Нет", x: 765, y: 370, anchor: "start" }
    }
  ],
  fallback: [
    { text: "Инструменты → MCP", x: 600, y: 150 },
    { text: "Сотрудничество агентов → A2A", x: 600, y: 195 },
    { text: "Требование аудита → A2A + ACP", x: 600, y: 240 },
    { text: "Внешние агенты без общей инфраструктуры → ANP + A2A", x: 600, y: 285 }
  ]
});
const origin = Object.freeze({ x: 0, y: 0 });
const scale = Object.freeze({ x: 1, y: 1 });
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const svgNS = "http://www.w3.org/2000/svg";
  const root = document.getElementById("generated");

  const element = (name, attributes, className) => {
    const item = document.createElementNS(svgNS, name);
    for (const [key, value] of Object.entries(attributes)) {
      item.setAttribute(key, value);
    }
    if (className) item.setAttribute("class", className);
    return item;
  };

  for (const edge of diagram.edges) {
    const line = element("polyline", {
      points: edge.points.map(({ x, y }) => `${sx(x)},${sy(y)}`).join(" ")
    }, "connector");
    root.append(line);

    const head = element("polygon", {
      points: edge.arrow.map(({ x, y }) => `${sx(x)},${sy(y)}`).join(" ")
    }, "arrow");
    root.append(head);

    const label = element("text", {
      x: sx(edge.label.x),
      y: sy(edge.label.y),
      "text-anchor": edge.label.anchor
    }, "edge-label");
    label.textContent = edge.label.text;
    root.append(label);
  }

  for (const node of diagram.nodes) {
    const group = element("g", {}, "node-group");
    const box = element("rect", {
      x: sx(node.x),
      y: sy(node.y),
      width: sx(node.w) - sx(diagram.zero),
      height: sy(node.h) - sy(diagram.zero),
      rx: sx(diagram.radius) - sx(diagram.zero),
      ry: sy(diagram.radius) - sy(diagram.zero)
    }, `node ${node.kind}`);
    group.append(box);

    for (const line of node.lines) {
      const text = element("text", {
        x: sx(node.x + node.w * diagram.half),
        y: sy(node.y + line.dy),
        "text-anchor": "middle"
      }, line.role);
      text.textContent = line.text;
      group.append(text);
    }
    root.append(group);
  }
} catch (error) {
  const svgNS = "http://www.w3.org/2000/svg";
  const root = document.getElementById("generated");
  root.replaceChildren();

  for (const line of diagram.fallback) {
    const text = document.createElementNS(svgNS, "text");
    text.setAttribute("x", sx(line.x));
    text.setAttribute("y", sy(line.y));
    text.setAttribute("text-anchor", "middle");
    text.setAttribute("class", "fallback");
    text.textContent = line.text;
    root.append(text);
  }
  console.error("Не удалось построить дерево выбора протоколов.", error);
}
</script>
</body>
</html>
