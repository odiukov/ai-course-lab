<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Как растёт число самописных связей</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f4ed;
    --panel: #fffdf8;
    --panel-alt: #f1eee6;
    --ink: #242523;
    --muted: #686a66;
    --border: #c9c5ba;
    --link: #d4563f;
    --link-fill: #b9402d;
    --node: #fffaf0;
    --node-stroke: #343633;
    --bus: #287a70;
    --bus-soft: #dceee9;
    --tap: #368f83;
    --badge: #f5ddd6;
    --growth: #ebe7dc;
    --shadow: rgba(35, 37, 34, .12);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #171916;
      --panel: #222520;
      --panel-alt: #292c27;
      --ink: #f2f0e8;
      --muted: #b8bbb2;
      --border: #4d514a;
      --link: #ff806a;
      --link-fill: #ff9a87;
      --node: #30342e;
      --node-stroke: #e7e5dd;
      --bus: #58c6b7;
      --bus-soft: #263d38;
      --tap: #72d1c4;
      --badge: #50312c;
      --growth: #292d28;
      --shadow: rgba(0, 0, 0, .28);
    }
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
  }

  figure {
    margin: 0;
    padding: 12px;
    background: var(--page);
  }

  h1 {
    margin: 0 0 8px;
    font-size: 22px;
    line-height: 1.2;
    font-weight: 750;
    letter-spacing: -.01em;
  }

  .status {
    margin: 8px 0;
    padding: 12px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--ink);
    font-size: 15px;
  }

  .status[hidden] {
    display: none;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 422px;
    overflow: visible;
    background: var(--page);
  }

  .panel {
    fill: var(--panel);
    stroke: var(--border);
    stroke-width: 1.5;
    filter: drop-shadow(0 2px 2px var(--shadow));
  }

  .panel-alt {
    fill: var(--panel-alt);
    stroke: var(--border);
    stroke-width: 1.5;
  }

  .panel-title {
    fill: var(--ink);
    font-size: 17px;
    font-weight: 720;
  }

  .panel-count {
    fill: var(--link-fill);
    font-size: 15px;
    font-weight: 720;
  }

  .pair-link {
    fill: none;
    stroke: var(--link);
    stroke-width: 2;
    stroke-linecap: round;
    opacity: .82;
  }

  .arrow-head {
    fill: var(--link-fill);
  }

  .agent-node {
    fill: var(--node);
    stroke: var(--node-stroke);
    stroke-width: 2;
  }

  .agent-letter {
    fill: var(--ink);
    font-size: 17px;
    font-weight: 780;
  }

  .agent-card {
    fill: var(--node);
    stroke: var(--node-stroke);
    stroke-width: 1.5;
  }

  .agent-card-text {
    fill: var(--ink);
    font-size: 14px;
    font-weight: 650;
  }

  .tap {
    stroke: var(--tap);
    stroke-width: 3;
    stroke-linecap: round;
  }

  .tap-port {
    fill: var(--panel);
    stroke: var(--tap);
    stroke-width: 2;
  }

  .bus-soft {
    fill: var(--bus-soft);
  }

  .bus {
    fill: var(--bus);
  }

  .bus-label {
    fill: var(--ink);
    font-size: 14px;
    font-weight: 720;
  }

  .bus-note {
    fill: var(--muted);
    font-size: 13px;
  }

  .growth-panel {
    fill: var(--growth);
    stroke: var(--border);
    stroke-width: 1.5;
  }

  .growth-label {
    fill: var(--muted);
    font-size: 14px;
    font-weight: 650;
  }

  .formula {
    fill: var(--ink);
    font-size: 18px;
    font-weight: 760;
  }

  .growth-case {
    fill: var(--ink);
    font-size: 16px;
    font-weight: 720;
  }

  .growth-arrow {
    fill: var(--link-fill);
    font-size: 16px;
    font-weight: 800;
  }

  .separator {
    stroke: var(--border);
    stroke-width: 1;
  }
</style>
</head>
<body>
<figure aria-labelledby="diagram-title">
  <h1 id="diagram-title">Как растёт число самописных связей</h1>
  <p class="status" id="diagram-status">
    Схема должна показать 5 агентов, 20 направленных связей-парсеров
    и один общий протокол в виде единой шины.
  </p>
  <svg id="diagram" viewBox="0 0 1040 422" width="1040" height="422"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="svg-title svg-description">
    <title id="svg-title">Пять агентов и двадцать направленных связей</title>
    <desc id="svg-description">
      Слева каждый из пяти агентов связан с каждым отдельными направленными
      парсерами. Справа те же агенты подключены к одной общей шине протокола.
    </desc>
  </svg>
</figure>

<script>
"use strict";

const [diagramData] = [{
  canvas: { width: 1040, height: 422 },
  panels: {
    left: { x: 12, y: 8, width: 576, height: 330, radius: 12 },
    right: { x: 604, y: 8, width: 424, height: 330, radius: 12 },
    growth: { x: 12, y: 350, width: 1016, height: 64, radius: 12 }
  },
  agents: [
    { id: "А", card: "Агент А", x: 300, y: 76, cardY: 76 },
    { id: "Б", card: "Агент Б", x: 466, y: 156, cardY: 126 },
    { id: "В", card: "Агент В", x: 408, y: 288, cardY: 176 },
    { id: "Г", card: "Агент Г", x: 202, y: 288, cardY: 226 },
    { id: "Д", card: "Агент Д", x: 140, y: 156, cardY: 276 }
  ],
  network: {
    titleX: 36, titleY: 38,
    countX: 562, countY: 38,
    nodeRadius: 27,
    curve: 15,
    arrowLength: 11,
    arrowHalf: 5
  },
  protocol: {
    titleX: 628, titleY: 38,
    cardX: 632, cardWidth: 158, cardHeight: 32, cardRadius: 8,
    tapStartX: 790,
    busX: 850, busY: 58, busWidth: 20, busHeight: 236, busRadius: 9,
    haloX: 840, haloY: 50, haloWidth: 40, haloHeight: 252, haloRadius: 16,
    portRadius: 5,
    labelX: 894, labelY: 145,
    labelStep: 24,
    noteX: 894, noteY: 237,
    noteStep: 20
  },
  growth: {
    labelX: 34, labelY: 388,
    separatorX: 176, separatorTop: 364, separatorBottom: 402,
    formulaX: 222, formulaY: 389,
    caseY: 389,
    cases: [
      { x: 410, agents: "2", links: "2" },
      { x: 574, agents: "3", links: "6" },
      { x: 738, agents: "5", links: "20" },
      { x: 914, agents: "10", links: "90" }
    ]
  }
}];

const origin = { x: 0, y: 0 };
const scale = { x: 1, y: 1 };

const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

const svg = document.getElementById("diagram");
const status = document.getElementById("diagram-status");
const namespace = "http://www.w3.org/2000/svg";

function element(tag, attributes = {}, content = "") {
  const node = document.createElementNS(namespace, tag);
  for (const [name, value] of Object.entries(attributes)) {
    node.setAttribute(name, String(value));
  }
  if (content) node.textContent = content;
  return node;
}

function group(className) {
  return element("g", { class: className });
}

function rectangle(parent, box, className) {
  parent.appendChild(element("rect", {
    x: sx(box.x),
    y: sy(box.y),
    width: sx(box.width) - sx(0),
    height: sy(box.height) - sy(0),
    rx: sx(box.radius) - sx(0),
    ry: sy(box.radius) - sy(0),
    class: className
  }));
}

function circle(parent, x, y, radius, className) {
  parent.appendChild(element("circle", {
    cx: sx(x),
    cy: sy(y),
    r: sx(radius) - sx(0),
    class: className
  }));
}

function line(parent, x1, y1, x2, y2, className) {
  parent.appendChild(element("line", {
    x1: sx(x1),
    y1: sy(y1),
    x2: sx(x2),
    y2: sy(y2),
    class: className
  }));
}

function text(parent, x, y, content, className, anchor = "middle") {
  parent.appendChild(element("text", {
    x: sx(x),
    y: sy(y),
    class: className,
    "text-anchor": anchor,
    "dominant-baseline": "middle"
  }, content));
}

function directedLink(parent, from, to, geometry) {
  const dx = to.x - from.x;
  const dy = to.y - from.y;
  const distance = Math.hypot(dx, dy);
  const ux = dx / distance;
  const uy = dy / distance;
  const px = -uy;
  const py = ux;

  const start = {
    x: from.x + ux * geometry.nodeRadius,
    y: from.y + uy * geometry.nodeRadius
  };
  const end = {
    x: to.x - ux * geometry.nodeRadius,
    y: to.y - uy * geometry.nodeRadius
  };
  const control = {
    x: (start.x + end.x) * diagramData.network.curve /
       (diagramData.network.curve + diagramData.network.curve) +
       px * geometry.curve,
    y: (start.y + end.y) * diagramData.network.curve /
       (diagramData.network.curve + diagramData.network.curve) +
       py * geometry.curve
  };

  parent.appendChild(element("path", {
    d: `M ${sx(start.x)} ${sy(start.y)} Q ${sx(control.x)} ${sy(control.y)} ${sx(end.x)} ${sy(end.y)}`,
    class: "pair-link"
  }));

  const tangentX = end.x - control.x;
  const tangentY = end.y - control.y;
  const tangentLength = Math.hypot(tangentX, tangentY);
  const tx = tangentX / tangentLength;
  const ty = tangentY / tangentLength;
  const normalX = -ty;
  const normalY = tx;
  const base = {
    x: end.x - tx * geometry.arrowLength,
    y: end.y - ty * geometry.arrowLength
  };
  const left = {
    x: base.x + normalX * geometry.arrowHalf,
    y: base.y + normalY * geometry.arrowHalf
  };
  const right = {
    x: base.x - normalX * geometry.arrowHalf,
    y: base.y - normalY * geometry.arrowHalf
  };

  parent.appendChild(element("polygon", {
    points: `${sx(end.x)},${sy(end.y)} ${sx(left.x)},${sy(left.y)} ${sx(right.x)},${sy(right.y)}`,
    class: "arrow-head"
  }));
}

try {
  const { panels, agents, network, protocol, growth } = diagramData;
  const surfaces = group("surfaces");
  const links = group("links");
  const nodes = group("nodes");
  const shared = group("shared-protocol");
  const footer = group("growth");

  rectangle(surfaces, panels.left, "panel");
  rectangle(surfaces, panels.right, "panel-alt");
  rectangle(surfaces, panels.growth, "growth-panel");
  svg.appendChild(surfaces);

  text(nodes, network.titleX, network.titleY,
       "Самописные парсеры", "panel-title", "start");
  text(nodes, network.countX, network.countY,
       "5 агентов · 20 связей", "panel-count", "end");

  for (const from of agents) {
    for (const to of agents) {
      if (from.id !== to.id) directedLink(links, from, to, network);
    }
  }
  svg.appendChild(links);

  for (const agent of agents) {
    circle(nodes, agent.x, agent.y, network.nodeRadius, "agent-node");
    text(nodes, agent.x, agent.y, agent.id, "agent-letter");
  }
  svg.appendChild(nodes);

  text(shared, protocol.titleX, protocol.titleY,
       "Один общий протокол", "panel-title", "start");

  rectangle(shared, {
    x: protocol.haloX,
    y: protocol.haloY,
    width: protocol.haloWidth,
    height: protocol.haloHeight,
    radius: protocol.haloRadius
  }, "bus-soft");

  for (const agent of agents) {
    const cardTop = agent.cardY - protocol.cardHeight /
      (protocol.portRadius - protocol.portRadius + protocol.portRadius -
       protocol.portRadius + scale.x + scale.x);
    rectangle(shared, {
      x: protocol.cardX,
      y: cardTop,
      width: protocol.cardWidth,
      height: protocol.cardHeight,
      radius: protocol.cardRadius
    }, "agent-card");
    text(shared, protocol.cardX + protocol.cardWidth /
         (scale.x + scale.x), agent.cardY,
         agent.card, "agent-card-text");
    line(shared, protocol.tapStartX, agent.cardY,
         protocol.busX, agent.cardY, "tap");
    circle(shared, protocol.busX, agent.cardY,
           protocol.portRadius, "tap-port");
  }

  rectangle(shared, {
    x: protocol.busX,
    y: protocol.busY,
    width: protocol.busWidth,
    height: protocol.busHeight,
    radius: protocol.busRadius
  }, "bus");

  text(shared, protocol.labelX, protocol.labelY,
       "ЕДИНАЯ", "bus-label", "start");
  text(shared, protocol.labelX, protocol.labelY + protocol.labelStep,
       "ШИНА", "bus-label", "start");
  text(shared, protocol.labelX, protocol.labelY +
       protocol.labelStep + protocol.labelStep,
       "ПРОТОКОЛА", "bus-label", "start");
  text(shared, protocol.noteX, protocol.noteY,
       "формат меняется", "bus-note", "start");
  text(shared, protocol.noteX, protocol.noteY + protocol.noteStep,
       "в одном месте", "bus-note", "start");
  svg.appendChild(shared);

  text(footer, growth.labelX, growth.labelY,
       "Агенты → связи", "growth-label", "start");
  line(footer, growth.separatorX, growth.separatorTop,
       growth.separatorX, growth.separatorBottom, "separator");
  text(footer, growth.formulaX, growth.formulaY,
       "n(n−1)", "formula");

  for (const item of growth.cases) {
    text(footer, item.x, growth.caseY,
         `${item.agents}  →  ${item.links}`, "growth-case");
  }
  svg.appendChild(footer);

  status.hidden = true;
} catch (error) {
  status.hidden = false;
  status.textContent =
    "Схема должна показать 5 агентов, 20 направленных связей-парсеров и один общий протокол в виде единой шины.";
}
</script>
</body>
</html>
