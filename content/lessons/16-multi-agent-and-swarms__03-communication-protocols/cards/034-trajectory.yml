- concept: сохранённые аргументы вызова позволяют отличить неверный запрос агента от неверного ответа инструмента
  question: 'Агент вернул неверную сумму выплаты. В траектории видно: вызван `policy_api`, передан идентификатор полиса, отличающийся от указанного в заявке, ответ инструмента соответствует этому чужому идентификатору. Какой вывод даёт запись?'
  explanation: Ценность в том, что вход и выход вызова сохранены рядом. Совпадение ответа с переданными аргументами снимает подозрение с инструмента и локализует ошибку в том, как агент сформировал запрос. Без сохранённых аргументов обе гипотезы неразличимы.
  kind: choice
  options:
    - 'Ошибка на стороне агента: он спросил не о том объекте, а инструмент ответил корректно на заданный вопрос'
    - 'Ошибка на стороне инструмента: он вернул данные не по тому полису, о котором его спрашивали'
    - 'Установить источник ошибки нельзя: траектория показывает только итоговый ответ агента'
    - 'Ошибка в протоколе доставки: аргументы вызова исказились при передаче'
  correct: 0
  id: 034-trajectory-1
  fingerprint: afbf4d0e
- concept: траектория позволяет сверить итоговую формулировку с фактическим выходом инструмента
  question: Что даёт проверяющему возможность заметить, что финальный текст агента расходится с данными, которые реально вернул вызванный инструмент?
  explanation: 'Расхождение между тем, что вернул инструмент, и тем, что агент написал, — самостоятельный класс дефекта, отдельный от ошибки самого инструмента. Обнаруживается он только сравнением: без сохранённого выхода сравнивать не с чем, а статус запуска о качестве содержания ничего не знает.'
  kind: choice
  options:
    - Сохранённый в записи траектории выход инструмента, который можно сопоставить с утверждением в ответе
    - 'Статус запуска: при расхождении он автоматически становится ошибочным'
    - Пояснение шага, в котором агент описывает своё намерение перед вызовом
    - Порядковый номер части сообщения, по которому восстанавливается исходный ответ инструмента
  correct: 0
  id: 034-trajectory-2
  fingerprint: 54fb3f90
