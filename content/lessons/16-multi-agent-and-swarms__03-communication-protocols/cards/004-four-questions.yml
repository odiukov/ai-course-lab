- concept: ANP закрывает вопрос доверия между незнакомыми агентами через децентрализованную идентичность и защищённый обмен
  question: Агенту приходит предложение о сотрудничестве от агента, принадлежащего чужой организации, с которой нет заранее настроенных ключей и договорённостей. Какой вопрос здесь решается раньше всех остальных и какими средствами?
  explanation: 'Пока неизвестно, кто на другом конце, обсуждать цель или вызывать инструменты рано. Это уровень ANP: децентрализованный идентификатор (DID) подтверждает личность стороны, сквозное шифрование защищает переписку. Инструменты и журналирование — отдельные вопросы других протоколов.'
  kind: choice
  options:
    - Доверие незнакомой стороне — через проверяемую децентрализованную идентичность и защищённый канал обмена
    - Выбор инструмента — через список функций, выставленных сервером
    - Проверяемость работы — через сохранение полной истории запусков
  correct: 0
  id: 004-four-questions-1
  fingerprint: '82002694'
- concept: четыре протокола отвечают на разные вопросы, поэтому не заменяют друг друга и могут работать одновременно
  question: Почему бессмысленно спрашивать, какой из четырёх протоколов агентного общения «лучше», и выбирать один на всю систему? Объясни своими словами.
  explanation: 'Сравнение «кто главнее» подменяет вопрос: протоколы не взаимозаменяемы, потому что закрывают разные типы взаимодействия — инструмент, история, совместная цель, доверие.'
  kind: open
  reference: У них разные предметы разговора. Один отвечает на вопрос «как агенту воспользоваться внешним инструментом», другой — «как сохранить проверяемый ход работы и продолжить сессию», третий — «как двум самостоятельным агентам согласовать общую цель и жизненный цикл задачи», четвёртый — «почему можно доверять незнакомой стороне». Это не конкурирующие реализации одной функции, а ответы на разные риски. В одном процессе могут встретиться все четыре вопроса сразу, и тогда нужны все четыре механизма; если какого-то вопроса в системе нет, соответствующий протокол просто не подключают.
  id: 004-four-questions-2
  fingerprint: a88e1703
