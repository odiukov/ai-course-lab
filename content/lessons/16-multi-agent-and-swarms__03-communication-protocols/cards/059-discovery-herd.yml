- concept: одинаковый срок жизни кэша ресинхронизирует последующие волны, поэтому к интервалам добавляют случайный разброс
  question: Всем клиентам задали одинаковый срок жизни кэшированной карточки — 30 секунд. Что произойдёт с нагрузкой на каталог после первой волны?
  explanation: Общий фиксированный срок жизни превращает одну волну в периодическую. Лечение — случайный разброс, например обновление в окне 90–150 секунд вместо точного значения для всех.
  kind: choice
  options:
    - Записи протухнут у всех примерно одновременно, и пики будут повторяться каждые 30 секунд
    - Нагрузка размажется сама, потому что запросы обрабатываются с разной скоростью
    - 'Пиков больше не будет: кэш гарантирует равномерный поток запросов'
    - Каталог перестанет получать запросы, пока карточки не изменятся
