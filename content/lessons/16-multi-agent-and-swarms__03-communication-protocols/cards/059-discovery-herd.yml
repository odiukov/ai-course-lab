- concept: длина срока жизни кэшированной карточки — компромисс между нагрузкой на каталог и свежестью сведений о возможностях
  question: Инженер предлагает поднять срок жизни кэшированной карточки до суток, чтобы каталог совсем не нагружали. Чем это опасно?
  explanation: Кэш всегда торгует свежестью за нагрузку. Слишком короткий срок почти не снижает поток запросов, слишком длинный оставляет клиента с устаревшим описанием возможностей и форматов.
  kind: choice
  options:
    - 'Клиенты будут сутки исходить из устаревших сведений: изменённый адрес, снятый навык или новый формат ввода обнаружатся только после вызова'
    - 'Ничем: карточка агента по определению неизменна после публикации'
    - Кэш просто перестанет работать, потому что срок жизни ограничен сверху протоколом
    - Опасно только для памяти клиента, содержимое остаётся корректным
