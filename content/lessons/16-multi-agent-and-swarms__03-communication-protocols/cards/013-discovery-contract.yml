- concept: фильтр по тегу проверяет массивы tags внутри skills, а не текст названия и описания карточки
  question: 'В реестре есть карточка агента с названием «Fraud Risk Desk» и описанием «оценивает риски мошенничества». У всех её skill''ов теги: `payments`, `fraud`. Клиент ищет агентов по тегу `risk-analysis`. Попадёт ли карточка в результат?'
  explanation: Теги — машиночитаемое поле каждого skill. Отбор проверяет условие «есть хотя бы один skill, у которого нужный тег в списке tags». Человекочитаемые name и description существуют для людей и в предикат отбора не входят, иначе поиск зависел бы от формулировок маркетингового текста.
  kind: choice
  options:
    - 'Да: слово «risk» есть в названии и описании карточки'
    - 'Нет: совпадение ищется среди тегов объявленных skill''ов, а описание в отборе не участвует'
    - Да, но только если у карточки нет собственных тегов на верхнем уровне
  correct: 1
  id: 013-discovery-contract-1
  fingerprint: 9fb32096
- concept: MIME-тип во входных режимах сопоставляется как точная строка-идентификатор формата
  question: Клиент хочет отправить PDF и вызывает поиск по входному режиму со значением `PDF`. Карточки объявляют `application/pdf`. Что вернёт отбор?
  explanation: Входные и выходные режимы объявляются MIME-типами вида `application/pdf` или `text/plain`. Это идентификаторы, которые сравниваются целиком, без нормализации расширений и регистра. Клиент обязан спрашивать ровно ту строку, которую объявляет спецификация формата.
  kind: choice
  options:
    - 'Пустой результат: режимы объявлены MIME-типами, и `PDF` не равен `application/pdf`'
    - 'Все карточки с `application/pdf`: расширение файла считается синонимом MIME-типа'
    - Все карточки реестра, потому что неизвестный формат трактуется как «любой»
  correct: 0
  id: 013-discovery-contract-2
  fingerprint: e547711f
