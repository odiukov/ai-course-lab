- concept: 'запрос на отмену подтверждается отдельным промежуточным состоянием: приём запроса и фактическая остановка разнесены во времени'
  question: Клиент отправил агенту запрос на отмену выполняющегося запуска и сразу получил статус `cancelling`. Что этот статус гарантирует?
  explanation: 'Остановка исполняющегося агента не мгновенна: нужно закрыть незавершённые операции. Поэтому у отмены две отметки — `cancelling` (просьба принята, идёт сворачивание) и `cancelled` (остановка завершена). Считать ресурсы освобождёнными и переиспользовать их можно только по `cancelled`.'
  kind: choice
  options:
    - Запрос на отмену принят, но агент ещё сворачивает работу; остановка не завершена
    - Работа уже остановлена, а `cancelled` — лишь дубль того же факта для журнала
    - Отмена отклонена, и запуск продолжится до обычного завершения
    - Запуск переведён в паузу и продолжится, как только клиент подтвердит намерение
  correct: 0
  id: 033-run-lifecycle-1
  fingerprint: 80fc1aad
- concept: 'путь отменённого запуска: отмена запрашивается только у уже исполняющегося запуска и проходит через стадию сворачивания'
  question: Расставь статусы запуска (Run) в порядке, в котором их видит клиент, отменивший работу агента посреди исполнения.
  explanation: Запуск сначала регистрируется (`created`), затем начинает исполняться (`in_progress`) — отменять нечего, пока работа не идёт. Запрос отмены даёт `cancelling`, и только по завершении сворачивания — терминальный `cancelled`. Прыжок из `created` сразу в `cancelled` схема переходов не допускает.
  kind: order
  items:
    - created
    - in_progress
    - cancelling
    - cancelled
  id: 033-run-lifecycle-2
  fingerprint: 3082e69e
- concept: 'два нетерминальных состояния паузы различаются направлением: одно ведёт обратно в исполнение, другое — только к финалу'
  question: Ни `awaiting`, ни `cancelling` не являются терминальными статусами запуска. Объясни, почему их всё равно нельзя обрабатывать одинаково — например, единым индикатором «работа приостановлена».
  explanation: 'Терминальность отвечает на вопрос «закончилось ли», а не «что делать дальше». Полезное различие для клиента — множество достижимых из статуса переходов: у `awaiting` в нём есть исполнение, у `cancelling` только финал.'
  kind: open
  reference: 'Оба статуса означают, что запуск не завершён, но ведут в противоположные стороны. Из `awaiting` есть выход обратно в `in_progress`: агенту не хватает данных, он ждёт ответа клиента, и после ответа тот же запуск продолжает исполнение. Из `cancelling` возврата в исполнение нет — единственный выход терминальный `cancelled`. Отсюда разные обязанности клиента: при `awaiting` он должен что-то прислать, иначе работа стоит навсегда; при `cancelling` от него не требуется ничего, кроме ожидания. Единый индикатор «приостановлено» скрыл бы этот вопрос — нужен ли ход от клиента, — и запуск в `awaiting` мог бы висеть незамеченным.'
  id: 033-run-lifecycle-3
  fingerprint: b8d67343
