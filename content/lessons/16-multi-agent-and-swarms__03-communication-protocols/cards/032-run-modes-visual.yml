- concept: состояние Run живёт на сервере и адресуется идентификатором, поэтому переживает разрыв клиента
  question: Клиент запустил длинную проверку в асинхронном режиме, закрыл вкладку и вернулся через час. Что позволяет ему получить результат?
  explanation: 'Асинхронный режим тем и ценен, что запуск не привязан к живому соединению. Идентификатор — единственный ключ к состоянию: по содержанию запроса Run не ищут, два одинаковых запроса дают два разных запуска.'
  kind: choice
  options:
    - 'Сохранённый идентификатор Run: состояние и результат хранятся на стороне сервера и запрашиваются по нему'
    - 'Ничего: закрытие клиента разрывает Run, и работу нужно запускать заново'
    - 'Повторная отправка того же запроса: сервер узнает его по содержанию и вернёт прежний результат'
    - 'Открытие потокового соединения: только оно восстанавливает потерянное состояние'
  correct: 0
  id: 032-run-modes-visual-1
  fingerprint: 85cd4ca5
- concept: ограничение времени ожидания делает блокирующий режим непригодным для долгой работы
  question: Агент расшифровывает часовую запись. Почему синхронный режим здесь плохой выбор?
  explanation: Блокирующий режим переносит ожидание на открытое HTTP-соединение, а у него есть чужие лимиты — браузера, балансировщика, прокси. Агент может доработать до конца, но клиент уже отвалился. Для долгой работы берут асинхронный режим или поток.
  kind: choice
  options:
    - Соединение держится всё время работы и может оборваться по тайм-ауту клиента или прокси, а результат при этом теряется для вызывающей стороны
    - Синхронный режим ограничивает объём результата, и длинная расшифровка в ответ не поместится
    - Синхронный режим запрещает агенту вызывать внешние инструменты во время работы
    - Синхронный режим не создаёт идентификатор Run, поэтому работу нельзя отменить
  correct: 0
  id: 032-run-modes-visual-2
  fingerprint: 6b602456
- concept: порядок взаимодействия клиента с сервером в асинхронном режиме
  question: Расставь шаги асинхронного получения результата в правильном порядке.
  explanation: 'Ключ порядка: идентификатор появляется раньше результата и служит адресом запуска. Без сохранённого идентификатора шаг опроса выполнить нечем, а сам факт принятия запроса ничего не говорит о готовности итога.'
  kind: order
  items:
    - Клиент отправляет запрос на запуск агента
    - Сервер отвечает кодом принятия и возвращает идентификатор Run
    - Клиент сохраняет идентификатор и занимается другой работой
    - Клиент периодически вызывает GET /runs/{id} и читает статус
    - Статус становится завершённым, и клиент забирает результат по тому же идентификатору
  id: 032-run-modes-visual-3
  fingerprint: ef9adf87
