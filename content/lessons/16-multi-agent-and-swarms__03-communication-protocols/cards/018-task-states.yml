- concept: отказ агента принять задачу отличается от ошибки при её выполнении
  question: Агент по переводу текстов получает запрос на расшифровку аудиозаписи, видит, что это вне его компетенции, и не начинает работу. Какое терминальное состояние соответствует такому исходу?
  explanation: 'Три неуспешных исхода различаются причиной и инициатором. `REJECTED` — агент не принял запрос, обработка не начиналась. `FAILED` — работа шла и сорвалась ошибкой. `CANCELED` — прерывание по инициативе клиента. Клиенту это нужно различать: на отказ разумно искать другого исполнителя, на ошибку — повторить вызов.'
  kind: choice
  options:
    - '`TASK_STATE_FAILED` — агент не выдал результат'
    - '`TASK_STATE_REJECTED` — агент отказался брать задачу в работу'
    - '`TASK_STATE_CANCELED` — работа прервана до получения результата'
  correct: 1
  id: 018-task-states-1
  fingerprint: a3dffaa7
- concept: UNSPECIFIED — служебная заглушка для нераспознанного значения статуса, а не этап жизненного цикла
  question: Клиент получил задачу, у которой в статусе стоит `TASK_STATE_UNSPECIFIED`. Как это трактовать?
  explanation: Значение-заглушка появляется, когда поле не заполнено или содержит незнакомое клиенту значение. Оно ничего не говорит ни о продолжении работы, ни о завершении, поэтому его нельзя приравнивать ни к рабочему, ни к терминальному состоянию — это сигнал о проблеме с данными, а не этап.
  kind: choice
  options:
    - Как состояние «принята, но ещё не запущена» — синоним submitted
    - 'Как нераспознанное или незаполненное значение: судить о ходе работы по нему нельзя'
    - Как терминальное состояние с неизвестным исходом, задача закрыта
  correct: 1
  id: 018-task-states-2
  fingerprint: 30d15f63
- concept: 'две причины паузы различаются требуемым от клиента действием: предметные данные против подтверждения доступа'
  question: Задача остановилась в `TASK_STATE_AUTH_REQUIRED`. Что это говорит клиенту?
  explanation: 'Оба состояния ожидания нетерминальны, но требуют разного действия: при нехватке предметных данных клиент досылает содержание, при нехватке прав — предоставляет учётные данные или доступ. Разделение состояний позволяет клиенту автоматически выбрать нужную реакцию, не разбирая текст сообщения.'
  kind: choice
  options:
    - Нужно прислать недостающие данные предметной области — файл или уточнение условий
    - Нужно пройти аутентификацию или выдать доступ, после чего работа продолжится
    - Работа окончена неуспехом из-за прав доступа, продолжение невозможно
  correct: 1
  id: 018-task-states-3
  fingerprint: 9dc5e2b8
