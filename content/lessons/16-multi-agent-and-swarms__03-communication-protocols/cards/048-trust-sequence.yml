- concept: доверие в ANP проверяется напрямую при каждом взаимодействии, а не наследуется через поручительства и репутацию
  question: Агент D впервые обращается к агенту E. Известно, что агенты F и G уже успешно работали с D и подтверждают его надёжность. Что это даёт агенту E по модели доверия ANP?
  explanation: 'ANP отказывается от сети доверия и репутационных графов: нет ни распространения доверия по знакомствам, ни рейтинга агентов. Каждое взаимодействие заново опирается на TLS-проверку домена, подпись DID и минимальные права.'
  kind: choice
  options:
    - 'Ничего: E всё равно проверяет D напрямую по его DID, сеть поручительств в модели не участвует'
    - E может пропустить проверку подписи, но обязан загрузить DID-документ
    - E может выдать D токен с расширенными правами, так как репутация подтверждена двумя сторонами
    - E принимает D без проверок, потому что доверие транзитивно по цепочке поручителей
  correct: 0
  id: 048-trust-sequence-1
  fingerprint: 2ff93456
- concept: TLS-проверка домена и проверка подписи закрывают разные бреши и не заменяют друг друга
  question: Получатель загрузил DID-документ по HTTPS с домена из идентификатора did:wba. Почему одного успешного TLS-соединения недостаточно, чтобы считать входящий запрос подлинным?
  explanation: 'Две проверки отвечают на разные вопросы: TLS — «этот документ действительно опубликован на домене владельца», подпись — «этот запрос сделал владелец соответствующего закрытого ключа». Кто угодно может назвать чужой DID; без сверки подписи с ключом из документа это ничем не подкреплённое заявление.'
  kind: choice
  options:
    - TLS подтверждает только, что документ пришёл с нужного хоста; что запрос отправил владелец закрытого ключа, доказывает лишь проверка подписи
    - TLS-сертификаты домена слишком часто истекают, поэтому на них нельзя полагаться
    - TLS не защищает канал от прослушивания, поэтому документ мог быть прочитан по пути
    - 'Достаточно: раз документ получен с правильного домена, отправитель запроса подтверждён'
  correct: 0
  id: 048-trust-sequence-2
  fingerprint: d23fd5c2
- concept: подтверждённая личность и объём выданных прав — независимые решения
  question: Проверка личности агента прошла успешно. Объясни своими словами, почему после этого ему всё равно выдают токен с узким набором прав, а не полный доступ.
  explanation: 'Третий источник доверия в ANP — принцип минимального доверия — работает уже после успешной аутентификации. Он не усиливает уверенность в личности, а ограничивает последствия ошибки: даже подлинный, но скомпрометированный агент упирается в границы своего токена.'
  kind: open
  reference: 'Личность отвечает на вопрос «кто ты», права — на вопрос «что тебе разрешено», и второе не следует из первого. Принцип минимального доверия ограничивает выданный токен ровно тем, что нужно для конкретного взаимодействия: например, читать даты поставок, но не менять их и не смотреть счета. Тогда компрометация агента или утечка токена ограничивает ущерб этим узким набором операций, а не открывает всё сразу.'
  id: 048-trust-sequence-3
  fingerprint: 3ece6213
