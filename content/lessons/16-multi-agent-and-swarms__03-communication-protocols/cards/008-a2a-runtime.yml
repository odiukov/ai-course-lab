- concept: 'терминальное состояние задачи неизменно: продолжение работы оформляется новой задачей внутри того же contextId'
  question: Задача A2A завершилась в состоянии `TASK_STATE_COMPLETED`. Клиент хочет уточнить результат и попросить дополнить его. Как это выражается в протоколе?
  explanation: 'Финальные состояния (`completed`, `failed`, `canceled`, `rejected`) неизменны — после них в задачу ничего не дописывается. Связность диалога держит не задача, а `contextId`: продолжение живёт в новой задаче того же контекста.'
  kind: choice
  options:
    - Клиент дописывает сообщение в завершённую задачу, и она возвращается в `working`
    - Клиент создаёт новую задачу с тем же `contextId`, а завершённая остаётся неизменной
    - Клиент переводит задачу в `input_required` и присылает уточнение туда
  correct: 1
  id: 008-a2a-runtime-1
  fingerprint: e81957b1
- concept: 'input_required — рабочее, а не финальное состояние: задача приостановлена в ожидании данных и вернётся в работу'
  question: Удалённый агент не может продолжить обработку без недостающего параметра от клиента. Чем состояние `TASK_STATE_INPUT_REQUIRED` отличается от `TASK_STATE_FAILED`?
  explanation: '`input_required` — пауза внутри жизненного цикла: клиент досылает данные, и исполнение продолжается. `failed` терминально: задача больше не изменится, продолжение потребует новой задачи. Отказ до начала обработки — это `rejected`.'
  kind: choice
  options:
    - 'Ничем по существу: оба означают, что задача закрыта без результата'
    - '`input_required` нетерминально — после присланных данных задача возвращается в `working`, а `failed` закрывает задачу навсегда'
    - '`input_required` означает, что задача отклонена агентом ещё до начала обработки'
  correct: 1
  id: 008-a2a-runtime-2
  fingerprint: b755df28
- concept: 'порядок работы минимального runtime: регистрация задачи с идентификатором предшествует исполнению, а артефакт сохраняется до перевода в терминальное состояние'
  question: Расставь по порядку шаги минимального A2A-runtime от прихода `SendMessage` до момента, когда клиент забирает результат.
  explanation: 'Идентификатор выдаётся до начала обработки — иначе клиенту нечего вернуть, пока работа идёт. Артефакт сохраняется раньше терминального состояния: после него задача неизменна, дописать результат уже нельзя.'
  kind: order
  items:
    - Обработчик принимает `SendMessage` и проверяет корректность запроса
    - Хранилище создаёт задачу с уникальным `taskId`, привязывает её к `contextId` и ставит состояние `submitted`
    - Клиенту немедленно возвращается карточка задачи с идентификатором и текущим состоянием
    - Исполнитель забирает задачу и переводит её в `working`
    - Результат сохраняется как артефакт задачи
    - Задача переводится в терминальное состояние (`completed` или `failed`)
    - Клиент запрашивает задачу по идентификатору и получает состояние и артефакт
  id: 008-a2a-runtime-3
  fingerprint: d45434f1
