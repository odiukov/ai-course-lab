  fingerprint: 1006d72f
- concept: один агент объявляет несколько протокольных привязок с разными URL, и клиент выбирает ту, которую поддерживает сам
  question: 'В `supportedInterfaces` карточки перечислены две записи: `JSONRPC` по одному URL и `HTTP+JSON` по другому. Что это значит для клиента?'
  explanation: '`supportedInterfaces` — список альтернативных привязок (JSON-RPC, HTTP+JSON, gRPC) одного агента, у каждой свой URL и версия протокола. Совместимость по транспорту выясняется до отправки задачи, а не по ошибке соединения.'
  kind: choice
  options:
    - Агент мигрирует с одной привязки на другую, и старая скоро перестанет работать
    - Это один и тот же агент, доступный по нескольким транспортам; клиент выбирает поддерживаемую им привязку и её URL
    - Клиент обязан продублировать запрос по обоим адресам
  correct: 1
  id: 009-card-anatomy-2
  fingerprint: 8398b586
- concept: схемы авторизации объявлены в карточке, поэтому требования доступа известны до первого рабочего запроса
  question: В карточке удалённого агента заданы `securitySchemes` с Bearer/JWT и ссылка на них в `security`. Что это даёт клиентскому агенту?
  explanation: 'Карточка описывает требования доступа, но не выдаёт учётные данные. Смысл — перенести выяснение условий на этап знакомства: несовместимость обнаруживается до отправки задачи, а не отказом в середине работы.'
  kind: choice
  options:
    - Карточка выдаёт клиенту токен для обращения к агенту
    - Клиент узнаёт тип требуемых учётных данных заранее и формирует первый рабочий запрос уже с ними, не выясняя это по отказу
    - Клиент может пропустить авторизацию, если поддерживает ту же схему
  correct: 1
  id: 009-card-anatomy-3
  fingerprint: 9a2907de
