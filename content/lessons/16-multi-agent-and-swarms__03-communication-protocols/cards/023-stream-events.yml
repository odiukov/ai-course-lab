- concept: текст внутри statusUpdate описывает ход работы и не входит в результат, который передаётся только артефактами
  question: В потоке от агента приходит событие statusUpdate со статусом WORKING и сообщением агента «Просматриваю документацию…». Как клиент должен обойтись с этим текстом?
  explanation: 'Два вида событий разнесены по смыслу: statusUpdate сообщает, в каком состоянии задача и что происходит сейчас, artifactUpdate несёт куски самого результата с собственным идентификатором артефакта. Смешать их — значит подшить служебные реплики в итоговый документ.'
  kind: choice
  options:
    - Присоединить его к артефакту результата — это первая часть ответа
    - Показать как пояснение о ходе работы; результат придёт отдельными событиями артефакта
    - 'Считать задачу завершённой: агент прислал текстовый ответ'
    - 'Проигнорировать: сообщения внутри статуса не предназначены клиенту'
  correct: 1
  id: 023-stream-events-1
  fingerprint: 14333de7
- concept: 'append и lastChunk отвечают на разные вопросы: присоединять ли фрагмент к начатому артефакту и ждать ли продолжения'
  question: 'Пришло событие artifactUpdate по уже известному артефакту с append: true и lastChunk: false. Что делает клиент?'
  explanation: 'append говорит про способ применения: дописать к уже начатому артефакту, а не заменить его. lastChunk говорит про полноту: значение false означает, что продолжение будет. Склейку выполняет клиент, поэтому оба поля нужны независимо.'
  kind: choice
  options:
    - Заменяет содержимое артефакта присланным фрагментом и ждёт следующих событий
    - Присоединяет фрагмент к накопленному содержимому артефакта и ждёт следующих частей
    - Присоединяет фрагмент и считает артефакт собранным
    - Создаёт новый артефакт, потому что содержимое пришло отдельным событием
  correct: 1
  id: 023-stream-events-2
  fingerprint: 0a49e034
- concept: признак завершения работы — переход задачи в терминальный статус, а не приход очередного содержательного фрагмента
  question: 'Своими словами: почему клиент потокового ответа не может считать первое полученное событие с содержимым готовым ответом?'
  explanation: 'Ровно поэтому в потоке есть и флаги полноты артефакта, и отдельное финальное событие статуса: они дают формальный признак «ждать больше нечего», которого у отдельного фрагмента нет.'
  kind: open
  reference: 'Поток — это последовательность самостоятельных новостей об одной задаче: обновления статуса и куски артефактов. Содержательный фрагмент может быть лишь частью артефакта, который ещё собирается, а сообщение внутри статуса вообще не входит в результат. Работа считается законченной только когда придёт событие с терминальным статусом задачи (например, COMPLETED); до этого клиент накапливает части и показывает промежуточный прогресс.'
  id: 023-stream-events-3
  fingerprint: 35e31ea4
