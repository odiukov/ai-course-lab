- concept: право ключа определяется секцией назначения, а не фактом присутствия в verificationMethod
  question: В DID-документе агента перечислены 4 записи verificationMethod. Проверяющая сторона получила подпись, сделанную ключом, который указан в verificationMethod, но не входит ни в authentication, ни в humanAuthorization. Как должна поступить проверка личности?
  explanation: verificationMethod отвечает на вопрос «чей ключ», а секции назначения (authentication, keyAgreement, humanAuthorization) — «что им разрешено». Ключ согласования шифрования может дать математически корректную подпись, но принимать её как доказательство личности — значит стереть границу назначений.
  kind: choice
  options:
    - 'Отклонить: перечисление ключа в verificationMethod задаёт его принадлежность владельцу, но не разрешает подтверждать личность'
    - 'Принять: если ключ принадлежит владельцу документа, любая его подпись подтверждает личность'
    - Принять, если алгоритм ключа совпадает с алгоритмом ключей из authentication
    - Отклонить только если ключ помечен как отозванный, иначе принять
  correct: 0
  id: 043-key-separation-1
  fingerprint: c669598e
- concept: разделение ключей по назначению локализует последствия компрометации одного из них
  question: У агента отдельный ключ подписи и отдельный ключ согласования шифрования. Утёк ключ согласования. Что даёт разделение ключей в этой ситуации?
  explanation: 'Одна из двух независимых угроз реализовалась, но не потянула за собой вторую: подписывать от имени агента ключом согласования нельзя, а сам ключ согласования меняется без смены идентичности. Единый универсальный ключ связал бы обе угрозы в одну.'
  kind: choice
  options:
    - Ключ согласования можно заменить, не трогая ключ подтверждения личности; злоумышленник не получает возможности подписываться от имени агента
    - Утечка любого ключа автоматически отзывает второй, поэтому агент сразу становится недоступным
    - Прошлые зашифрованные разговоры остаются нечитаемыми, потому что подпись их дополнительно защищает
    - Разделение влияет только на скорость операций, на последствия утечки — нет
  correct: 0
  id: 043-key-separation-2
  fingerprint: 1ab75e6a
- concept: humanAuthorization требует подтверждения живым человеком перед использованием ключа
  question: Чем ключ, указанный в humanAuthorization, отличается по условиям использования от ключа, указанного только в authentication?
  explanation: 'humanAuthorization — секция назначения, встречающаяся в ANP: она добавляет к криптографической проверке требование участия живого человека. Операции вроде перевода денег проходят именно через этот путь, а не через обычную аутентификацию агента.'
  kind: choice
  options:
    - Его применение требует явного подтверждения человеком (биометрия, пароль, HSM), поэтому через него проводят рискованные операции
    - Он использует более длинную кривую и потому даёт более стойкую подпись
    - Он применяется автоматически при каждом входящем запросе как дополнительная подпись
    - Он предназначен для шифрования содержимого, а не для подтверждения намерения
  correct: 0
  id: 043-key-separation-3
