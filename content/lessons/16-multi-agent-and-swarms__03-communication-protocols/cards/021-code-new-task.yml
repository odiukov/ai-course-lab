  question: Конструктор задачи объявлен так, что списки артефактов и истории берутся из одного объекта, созданного при определении функции. Что произойдёт при работе с двумя задачами?
  explanation: 'Пустой список — не значение, а один общий изменяемый контейнер: обе задачи ссылаются на него, и любое добавление видно из обеих. Проверка «изменение коллекций одной задачи не меняет коллекции другой» ловит ровно эту ошибку.'
  kind: choice
