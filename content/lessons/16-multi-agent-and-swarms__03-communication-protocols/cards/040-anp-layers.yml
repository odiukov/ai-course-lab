- concept: описание возможностей и идентичность имеют независимые жизненные циклы, поэтому изменение услуг не требует смены идентификатора
  question: Агент добавил новую услугу и убрал старую. Что происходит с его децентрализованным идентификатором?
  explanation: Разделение слоёв нужно как раз потому, что части меняются независимо. Каталог услуг обновляется часто, идентичность — редко и болезненно. Если бы описание служило одновременно удостоверением, любая правка прайс-листа ломала бы доверие всем партнёрам.
  kind: choice
  options:
    - 'Идентификатор меняется: он вычисляется из списка услуг'
    - Идентификатор остаётся прежним, меняется только документ с описанием возможностей
    - Идентификатор остаётся, но ключи подписи нужно перевыпустить
    - Идентификатор нужно заново зарегистрировать в центральном реестре ANP
