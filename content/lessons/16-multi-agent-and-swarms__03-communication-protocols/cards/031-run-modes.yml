- concept: код принятия запуска сообщает о старте работы, а не о её завершении
  question: Клиент отправляет агенту запуск в асинхронном режиме и мгновенно получает ответ с идентификатором Run и без результата. Что это значит?
  explanation: 'Ответ о принятии подтверждает только регистрацию запуска. Мгновенность ответа и есть признак async: сервер не держит соединение до конца работы, а отдаёт идентификатор, по которому клиент затем опрашивает `GET /runs/{id}`. Спутать принятие с завершением — типовая ошибка: клиент отдаёт пользователю пустой результат ещё работающего Run.'
  kind: choice
  options:
    - Запуск принят и выполняется; результат нужно забрать позже отдельным запросом статуса
    - Запуск завершился, но агент не смог ничего вернуть, поэтому результат пуст
    - Запуск отклонён, и клиенту нужно создать новый Run с другими параметрами
    - Запуск переведён в потоковый режим, и события придут по тому же соединению
  correct: 0
  id: 031-run-modes-1
  fingerprint: b0c165cb
- concept: 'источник инициативы обновлений: опрос клиентом против отправки сервером по удерживаемому соединению'
  question: Чем поток отличается от асинхронного режима с точки зрения того, кто инициирует обновления о ходе работы?
  explanation: 'Поток — push по открытому соединению: события SSE появляются по мере работы агента. Асинхронный режим — pull: соединение закрыто, и состояние узнаётся только запросом клиента по идентификатору. Отсюда и разные затраты: поток держит соединение, опрос создаёт лишние запросы между обновлениями.'
  kind: choice
  options:
    - В потоке сервер сам шлёт события по удерживаемому соединению, в асинхронном режиме клиент сам запрашивает статус
    - В потоке клиент чаще опрашивает сервер, а в асинхронном режиме — реже
    - В потоке обновления идут от сервера, а в асинхронном режиме их вообще нельзя получить до завершения
    - В обоих режимах инициатива у сервера, различие только в формате тела ответа
  correct: 0
  id: 031-run-modes-2
  fingerprint: a26edbfe
- concept: режим — контракт о доставке состояния, а не отдельный вид запуска
  question: Почему синхронный, асинхронный и потоковый режимы не считаются тремя разными видами запуска агента? Объясни своими словами.
  explanation: 'Полезная проверка себя: если сменить режим, изменится код клиента, но не то, что делает агент. Поэтому режим выбирают по длительности работы и требованиям интерфейса, а не по типу задачи.'
  kind: open
  reference: 'Запуск один: один Run с одним идентификатором, одним жизненным циклом и одним набором состояний. Режим определяет только то, когда и каким способом клиент узнаёт состояние и получает результат: держать соединение до конца, забрать идентификатор и опрашивать статус или принимать события по ходу работы. Ни содержание результата, ни скорость выполнения от выбора режима не зависят — меняется место, где происходит ожидание.'
  id: 031-run-modes-3
  fingerprint: 67f3db14
