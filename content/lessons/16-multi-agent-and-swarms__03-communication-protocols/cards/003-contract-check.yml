- concept: валидация схемы проверяет структуру сообщения, но не согласованность смысла полей
  question: Оба агента используют одну JSON-схему, и все сообщения проходят валидацию без ошибок. Какая ошибка обмена всё равно останется возможной?
  explanation: 'Схема описывает форму: набор полей, типы, обязательность. Она не фиксирует, что означает конкретное значение и какое действие оно требует. Расхождение в смысле проходит валидацию и проявляется как неверное поведение, а не как ошибка разбора.'
  kind: choice
  options:
    - Отправка поля неверного типа данных
    - Отправка сообщения с отсутствующим обязательным полем
    - Одинаковое поле трактуется отправителем и получателем по-разному
  correct: 2
  id: 003-contract-check-1
  fingerprint: 3657e37e
- concept: семантический контракт задаёт единицы измерения, допустимые значения и требуемую реакцию на них
  question: Какие соглашения нужно добавить к описанию поля, чтобы двум агентам хватило его для однозначной работы? Объясни своими словами.
  explanation: Тип «число» или «строка» задаёт лишь форму. Однозначность даёт закрытый перечень значений с описанной семантикой и явно указанные единицы измерения.
  kind: open
  reference: 'Помимо имени и типа нужно зафиксировать: единицу измерения или валюту, точный перечень допустимых значений и что каждое из них означает, момент, когда значение выставляется, и какое действие получатель обязан или не обязан выполнить в ответ. Например, поле длительности объявляется как целое число миллисекунд, а статус — закрытым списком значений с явным описанием, какое из них означает завершение всей задачи, а какое — только текущего шага.'
  id: 003-contract-check-2
  fingerprint: 2d2c6f7f
