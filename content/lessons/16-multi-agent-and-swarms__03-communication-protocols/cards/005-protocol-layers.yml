- concept: стек протоколов от работы с инструментом до доверия незнакомой стороне
  question: 'Расставь четыре протокола от самого низкого уровня взаимодействия к самому высокому: работа с инструментом, проверяемый ход выполнения, согласование общей цели между агентами, доверие незнакомой стороне.'
  explanation: Нижний уровень — обращение к внешней возможности, над ним — фиксация хода выполнения, выше — договорённость двух самостоятельных агентов, и на самом верху — установление доверия там, где стороны заранее не знакомы.
  kind: order
  items:
    - MCP — обнаружение и вызов инструмента, передача контекста
    - ACP — запуски, служебные сведения о ходе работы, продолжение сессии
    - A2A — объявление возможностей, согласование цели, жизненный цикл задачи
    - ANP — децентрализованная идентичность и защищённый обмен между незнакомыми сторонами
  id: 005-protocol-layers-1
  fingerprint: 771f9824
- concept: 'уровни вкладываются друг в друга: делегированная агенту подзадача внутри себя обращается к инструментам'
  question: Агент делегирует коллеге подзадачу «подобрать рейсы», и коллега для этого обращается к внешнему сервису расписаний. Как соотносятся здесь два уровня протоколов?
  explanation: 'Уровни вкладываются: агент-исполнитель принял задачу по протоколу агент-агент и внутри своей части использует протокол агент-инструмент. Верхний уровень не отменяет нижний, он ставит цель, которую нижний выполняет.'
  kind: choice
  options:
    - 'Обращение к сервису отменяет делегирование: остаётся только связка «агент — инструмент»'
    - Делегирование между агентами и вызов инструмента внутри подзадачи работают одновременно, на разных уровнях
    - Оба взаимодействия обязаны идти по одному и тому же протоколу, иначе задача не закроется
  correct: 1
  id: 005-protocol-layers-2
  fingerprint: ce0bf2f3
