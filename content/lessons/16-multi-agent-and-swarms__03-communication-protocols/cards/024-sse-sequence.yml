- concept: граница TCP-чанка не совпадает с границей SSE-события, поэтому парсер накапливает данные в буфере и режет по разделителю
  question: Клиент читает поток SSE и получает от транспорта фрагмент, обрывающийся посреди JSON-тела события. Как корректно устроен разбор?
  explanation: Транспорт не обязан выравнивать чанки по событиям — разрез может попасть в любое место, даже внутрь имени поля. Единственная надёжная граница — разделитель SSE (пустая строка). Отсюда схема «накопить в буфере, отрезать завершённые события, хвост сохранить».
  kind: choice
  options:
    - Каждый прочитанный фрагмент разбирается как отдельное событие, а неудачный разбор считается ошибкой сервера
    - Прочитанное дописывается в буфер, из него извлекаются только участки до разделителя событий, неполный хвост остаётся ждать следующего чтения
    - Клиент запрашивает у сервера повторную отправку фрагмента, пока не получит его целиком
    - Клиент ждёт закрытия соединения и разбирает весь ответ одним куском
  correct: 1
  id: 024-sse-sequence-1
  fingerprint: 3ddcf56a
- concept: событие SSE отделяется от следующего пустой строкой, то есть двойным переводом строки в потоке
  question: 'Дополни цикл разбора: по какой последовательности символов буфер режется на отдельные события SSE?'
  explanation: В SSE запись завершается пустой строкой, то есть двумя подряд идущими переводами строки. Пока такой последовательности в буфере нет, завершённого события нет и выдавать наверх нечего.
  kind: cloze
  template: |-
    buffer += chunk;
    let i;
    while ((i = buffer.indexOf("___")) !== -1) {
      const raw = buffer.slice(0, i);
      buffer = buffer.slice(i + 2);
      emit(parseEvent(raw));
    }
  answer: \n\n
  accept:
    - "\n\n"
    - \n\n
    - двойной перевод строки
    - пустая строка
