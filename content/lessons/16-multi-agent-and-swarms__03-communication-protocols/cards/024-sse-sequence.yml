- concept: 'внутри одной записи SSE значения всех строк data: соединяются по порядку, и только целиком собранное тело разбирается как JSON'
  question: 'Расставь по порядку обработку одной записи SSE, тело которой сервер разбил на несколько строк data:'
  explanation: 'Строк data: в одной записи может быть несколько, и каждая по отдельности — не валидный JSON. Смысл появляется только после конкатенации в исходном порядке: порядок строк — часть данных, а не деталь оформления.'
  kind: order
  items:
    - Выделить из буфера участок до разделителя событий — одну целую запись
    - 'Разбить запись на строки и отобрать те, что начинаются с префикса data:'
    - Соединить значения отобранных строк в исходном порядке в одно тело
    - Разобрать полученное тело как JSON и выдать объект события наверх
  id: 024-sse-sequence-3
