- concept: границу между задачами определяет смена ожидаемого результата, а не появление нового сообщения от клиента
  question: 'Клиент попросил агента подготовить сводку по квартальным продажам. Пока агент работает, клиент присылает: «учитывай только регион EMEA». Затем, получив сводку, просит подготовить презентацию по ней. Сколько задач A2A здесь возникает и почему?'
  explanation: Task группирует сообщения вокруг одного отслеживаемого результата. Уточнение по региону меняет условия того же результата — сводки, поэтому остаётся внутри той же задачи. Презентация — другой ожидаемый артефакт, значит новая задача. Принадлежность к одной беседе выражается не задачей, а общим contextId.
  kind: choice
  options:
    - 'Одна задача: все реплики относятся к одной беседе с клиентом'
    - 'Две задачи: уточнение про регион уточняет тот же ожидаемый результат, а презентация — уже другой результат'
    - 'Три задачи: каждое входящее сообщение клиента порождает свою задачу'
    - 'Две задачи: первая — приём сообщений, вторая — их обработка'
  correct: 1
  id: 017-task-context-message-1
  fingerprint: 3fbeb311
- concept: жизненный цикл и отслеживаемость привязаны к Task, а не к отдельному Message
  question: Клиент хочет узнать, на каком этапе находится работа, которую он поручил агенту по A2A. К какому объекту протокола он обращается за состоянием и почему?
  explanation: Message — отдельная передача содержания, у него нет жизненного цикла. Состояние (submitted, working, completed и прочие) принадлежит Task как единице работы. contextId лишь связывает задачи одной беседы, собственного состояния выполнения не имеет, а Agent Card описывает возможности агента, а не ход конкретной работы.
  kind: choice
  options:
    - 'К последнему Message: состояние хранится в нём как поле передачи'
    - 'К contextId: он агрегирует состояние всех обменов беседы'
    - 'К Task: состояние жизненного цикла принадлежит единице отслеживаемой работы, а Message — только акт передачи содержания'
    - 'К Agent Card: там опубликовано текущее состояние агента'
  correct: 2
  id: 017-task-context-message-2
  fingerprint: 0a19629b
- concept: contextId переносит согласованные ранее детали между отдельными задачами одной беседы
  question: Объясни своими словами, что теряет клиент, если каждую новую задачу к агенту он отправляет с новым contextId вместо прежнего.
  explanation: 'Три уровня отвечают на разные вопросы: Message — что сказано сейчас, Task — какую работу отслеживаем, contextId — к какому разговору она относится. Новый contextId обрывает третий уровень, поэтому продолжение работы лишается ранее накопленного контекста.'
  kind: open
  reference: 'contextId связывает отдельные задачи, относящиеся к одной продолжающейся беседе. С новым contextId новая задача выглядит для агента как начало разговора с нуля: ранее согласованные детали (город, даты, ограничения, предыдущие артефакты) не считаются частью её истории, и клиенту приходится передавать их заново в сообщениях. Отслеживание при этом не ломается — у каждой задачи свой независимый жизненный цикл, — теряется именно связь с предысторией.'
  id: 017-task-context-message-3
  fingerprint: 51b96fbe
