- concept: 'явное булево значение в capabilities отличается от отсутствующего поля: пропуск оставляет клиенту догадку вместо контракта'
  question: 'Агент не поддерживает push-уведомления. Почему в `capabilities` лучше указать `pushNotifications: false`, а не опустить поле?'
  explanation: 'Карточка — контракт до первого рабочего запроса. Пропуск поля переносит выяснение на этап выполнения, а явный `false` закрывает вопрос сразу: клиент сам выбирает опрос статуса вместо ожидания уведомлений.'
  kind: choice
  options:
    - Без поля карточка не пройдёт передачу по HTTP
    - 'Отсутствие поля неотличимо от «не сообщил»: клиент должен либо угадывать, либо проверять попыткой, тогда как явное `false` — проверяемое обещание'
    - '`false` включает резервный режим опроса на стороне агента'
  correct: 1
  id: 010-card-constructor-1
  fingerprint: 2906e410
- concept: форматы отдельного skill дополняют значения по умолчанию карточки, а не обязаны им соответствовать
  question: В карточке `defaultInputModes` — только `text/plain`, но у skill `doc-analysis` в `inputModes` указаны `text/plain` и `application/pdf`. Что верно?
  explanation: 'Уровня два: карточный вход агента и вход конкретного умения. Поэтому клиент, отправляющий PDF, обязан смотреть на `inputModes` нужного skill''а, а не только на `defaultInputModes`.'
  kind: choice
  options:
    - 'Карточка противоречива: `application/pdf` нужно перенести в `defaultInputModes`'
    - Skill принимает PDF, хотя это не общий вход агента; значения по умолчанию — базовый вариант, который отдельное умение может расширить
    - '`inputModes` skill''а игнорируется, действуют только значения по умолчанию карточки'
  correct: 1
  id: 010-card-constructor-2
