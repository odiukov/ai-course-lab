- concept: 'обязательный минимум карточки: адрес обращения и объявленные возможности транспорта хранятся в отдельных полях'
  question: 'Дополни определение типа: как называется вложенный объект карточки, объявляющий поддержку потоковой передачи и push-уведомлений?'
  explanation: '`url` отвечает на вопрос «куда обращаться», `capabilities` — «как может идти обмен». Это разные вопросы, поэтому и поля разные: адрес не подразумевает поддержки стриминга.'
  kind: cloze
  template: |-
    type AgentCard = {
      name: string;
      version: string;
      url: string;
      ___: { streaming: boolean; pushNotifications: boolean };
      skills: Skill[];
    };
  answer: capabilities
  accept:
    - capabilities
