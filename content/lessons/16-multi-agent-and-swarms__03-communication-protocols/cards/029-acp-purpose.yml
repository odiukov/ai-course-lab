- concept: запись траектории прикрепляется к части сообщения и фиксирует пояснение шага, имя инструмента, его вход и выход
  question: Ответ агента сопровождается метаданными траектории. Что именно там фиксируется?
  explanation: 'Траектория делает наблюдаемым путь к ответу: что агент собирался сделать, какой инструмент позвал, с какими данными и что тот вернул. Без этого утверждение в ответе непроверяемо.'
  kind: choice
  options:
    - Только итоговый текст ответа и время его формирования
    - Пояснение шага, имя вызванного инструмента, переданные ему аргументы и полученный результат
    - Полный внутренний промпт модели и её веса
    - Список агентов, которым задача могла быть делегирована
  correct: 1
  id: 029-acp-purpose-1
  fingerprint: f4febf43
- concept: проверяемость даёт восстановимость наблюдаемых действий, но не доказывает правильность рассуждения или достоверность источника
  question: Ответ агента пришёл с полным журналом вызовов инструментов. Что этот журнал гарантирует, а что нет?
  explanation: Журнал переводит ответ из категории «слова» в категорию «дело с материалами». Ошибка в рассуждении или в самом инструменте остаётся возможной — но теперь её можно локализовать.
  kind: choice
  options:
    - Гарантирует, что вывод агента логически верен, но не что источники надёжны
    - Гарантирует возможность восстановить действия, повторить проверки и найти место расхождения, но не корректность рассуждения и не достоверность данных инструмента
    - Гарантирует и корректность вывода, и достоверность источников
    - Не гарантирует ничего, кроме времени ответа
  correct: 1
  id: 029-acp-purpose-2
  fingerprint: '98801294'
- concept: 'метаданные цитирования и метаданные траектории отвечают на разные вопросы: откуда утверждение и что делал агент'
  question: Чем метаданные цитирования отличаются по назначению от метаданных траектории?
  explanation: 'Цитирование адресует диапазон в ответе и указывает на источник утверждения; траектория объясняет процесс. Проверяющему нужны оба среза: происхождение фактов и последовательность действий.'
  kind: choice
  options:
    - Цитирование связывает конкретный фрагмент текста ответа с внешним источником, траектория описывает действия агента при получении ответа
    - Цитирование — сжатая версия траектории для коротких ответов
    - Цитирование фиксирует вызовы инструментов, а траектория — ссылки на документы
    - Они дублируют друг друга, различаясь только форматом
  correct: 0
  id: 029-acp-purpose-3
  fingerprint: 9dd76ba7
