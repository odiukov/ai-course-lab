- concept: необходимость проверки идентичности внешней стороны зависит от наличия общей доверенной инфраструктуры, а не от факта пересечения границы организации
  question: Ваш агент передаёт задачи агенту партнёрской компании. Что определяет, нужна ли к описанию работы ещё и проверка идентичности через DID?
  explanation: Внешняя граница сама по себе не диктует ответ. Если стороны уже сидят на общей доверенной среде (брокер, площадка), она берёт на себя вопрос «кто это». Если такой среды нет, идентичность приходится подтверждать напрямую, а описание задач и их статусов остаётся на прежнем протоколе делегирования.
  kind: choice
  options:
    - Объём передаваемых данных за сутки
    - 'Наличие общей доверенной инфраструктуры: с согласованным брокером сообщений хватает описания работы, без него нужна прямая проверка стороны'
    - Число агентов у партнёра
    - Тип задач, которые партнёр выполняет
