- concept: секция назначения задаёт условия использования ключа, поэтому одна пара ключей может числиться сразу в нескольких секциях
  question: В DID-документе агента идентификатор `#key-1` перечислен и в `authentication`, и в `humanAuthorization`. Что это означает?
  explanation: 'Секция назначения описывает не отдельный ключевой материал, а условия, при которых ключ допустимо применить. Математика подписи в обоих случаях одна; различается путь принятия решения: обычная аутентификация проходит автоматически, а операция под `humanAuthorization` останавливается до явного подтверждения владельца (биометрия, пароль, HSM).'
  kind: choice
  options:
    - 'Документ содержит ошибку: ключ обязан принадлежать ровно одной секции назначения'
    - Один и тот же ключ используется в двух сценариях, но для рискованного действия его применение требует подтверждения человеком
    - Ключ автоматически становится ключом шифрования, потому что перечислен дважды
    - Подпись, сделанная этим ключом, всегда считается подтверждённой человеком
  correct: 1
  id: 050-human-authorization-1
  fingerprint: 70dacf37
- concept: подтверждённое авторство сообщения не равно согласию владельца на последствия описанного в нём действия
  question: Агент подписал команду на списание 8 400 € своим ключом, подпись проверена по DID-документу. Объясни, почему проверенной подписи недостаточно, чтобы считать расход разрешённым владельцем.
  explanation: 'Здесь разведены два вопроса: «кто отправил» и «кто разрешил». Проверка подписи закрывает первый, подтверждение человеком — второй. Слить их в один шаг означает, что доступ к ключу агента автоматически даёт право тратить деньги владельца.'
  kind: open
  reference: 'Проверка подписи отвечает только на вопрос о происхождении: сообщение действительно исходит от держателя ключа и не изменено в пути. Она ничего не говорит о том, согласовал ли человек именно эту сумму и именно эту покупку. Скомпрометированный или слишком самостоятельный агент подписывает рискованную команду настоящим ключом, и подпись останется корректной. Поэтому решение о совершении рискованного действия выносится отдельно: ключ объявлен в секции `humanAuthorization`, и его применение требует явного подтверждения человеком через биометрию, пароль или HSM.'
  id: 050-human-authorization-2
  fingerprint: 6005415f
