- concept: предикат «хотя бы один skill подходит» сводит проверку набора навыков к булеву значению для фильтра карточек
  question: 'Допиши метод отбора карточек по тегу skill''а: нужно оставить карточку, если условие выполняет хотя бы один её навык.'
  explanation: '`filter` ждёт булево значение на каждую карточку, а `some` как раз сворачивает список навыков в булево «нашёлся хотя бы один». `every` потребовал бы тег у всех навыков сразу, `map` вернул бы массив, который всегда истинен как значение и пропустил бы все карточки.'
  kind: cloze
  template: |-
    discoverBySkillTag(tag: string): AgentCard[] {
      return [...this.cards.values()].filter((card) =>
        card.skills.___((skill) => skill.tags.includes(tag))
      );
    }
  answer: some
  accept:
    - some
    - .some
    - some()
    - Array.prototype.some
  id: 014-code-discover-1
  fingerprint: 27bf0dc9
- concept: обход по навыкам с накоплением результата даёт дубли карточек, фильтрация по карточкам — нет
  question: Реализация обходит все skill'ы каждой карточки и добавляет карточку в результат при каждом совпадении тега. У карточки `Analyst` четыре skill'а, и тег `risk` есть у трёх из них. Что вернёт такой поиск?
  explanation: Единица результата — карточка агента, а не совпавший навык. При накоплении внутри цикла по skill'ам карточка добавится столько раз, сколько навыков совпало, то есть три. Фильтрация по карточкам с внутренним предикатом «есть хотя бы один навык» даёт каждую карточку ровно один раз.
  kind: choice
  options:
    - 'Одну запись `Analyst`: повторные совпадения игнорируются автоматически'
    - 'Три записи `Analyst`: одна и та же карточка попадёт в массив трижды'
    - Четыре записи `Analyst` — по числу навыков карточки
  correct: 1
  id: 014-code-discover-2
  fingerprint: 0c9fee44
- concept: фильтрация пустой коллекции карточек возвращает пустой массив, а не ошибку или отсутствующее значение
  question: В реестр ещё не зарегистрировано ни одной карточки, и клиент вызывает поиск по тегу. Каким должен быть результат?
  explanation: 'Возвращаемый тип — массив карточек, и «ничего не найдено» выражается пустым массивом. Тогда вызывающий код одинаково обрабатывает пустой реестр и реестр без подходящих агентов: проверяет длину результата, а не различает `undefined`, исключение и массив.'
  kind: choice
  options:
    - 'Пустой массив: раскрытие пустой коллекции значений и последующая фильтрация дают `[]`'
    - '`undefined`, потому что подходящей карточки нет'
    - 'Исключение: поиск в пустом реестре — ошибочная ситуация'
  correct: 0
  id: 014-code-discover-3
