- concept: протокол задаёт очерёдность хода и условие завершения обмена, иначе возможен взаимный тупик
  question: Агент A отправил напарнику B результат и ждёт подтверждения. Агент B получил результат и ждёт уточняющего запроса от A. Канал связи исправен, сообщения доходят. Что именно отсутствует в их взаимодействии?
  explanation: 'Тупик возник не из-за транспорта и не из-за качества текста. Протокол общения помимо формата данных фиксирует состояние диалога: кто отвечает следующим, какие переходы допустимы и когда задача закрыта. Без этой части обе стороны законно ждут друг друга.'
  kind: choice
  options:
    - Правило, определяющее, чей ход следующий и когда обмен считается завершённым
    - Достаточная пропускная способность канала между агентами
    - Более подробный текст в теле последнего сообщения
  correct: 0
  id: 001-strings-break-1
  fingerprint: 8dd7e068
- concept: свободный текст смешивает данные и управляющее намерение, протокол разносит их по разным полям и типам сообщений
  question: Почему передача результата работы агента обычным текстом ненадёжна, даже когда текст грамотный и содержит всю нужную информацию? Объясни своими словами.
  explanation: 'Ключ: ненадёжен не язык, а совмещение данных и управляющего сигнала в одном непроверяемом поле. Явные типы сообщений убирают этап угадывания.'
  kind: open
  reference: 'В одном тексте одновременно лежат разные сущности: сами данные, степень уверенности, принятое решение и ожидаемое следующее действие. Получатель обязан угадать, где что находится, и вывести управляющее намерение из формулировки. Одна и та же фраза допускает несколько прочтений: «препятствий не обнаружено» можно понять как разрешение продолжать и как отсутствие проверки. Протокол разносит эти сущности по отдельным полям и типам сообщений (результат, ошибка, запрос уточнения), поэтому получатель распознаёт тип, а не интерпретирует прозу.'
  id: 001-strings-break-2
  fingerprint: f82426b7
