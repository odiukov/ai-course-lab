- concept: журнал хранит независимые копии входа и выхода, поэтому позднее изменение исходных данных не переписывает историю
  question: Аудируемый запуск сохранил вход агента. Через час вызывающий код изменил поля того же объекта сообщения. Почему запись аудита обязана хранить глубокую копию, а не ссылку?
  explanation: 'Смысл журнала — зафиксировать факт на момент события. Ссылка на живой объект делает историю переписываемой задним числом, причём незаметно: проверяющий видит правдоподобную запись с чужими данными. Глубокая копия отвязывает запись от дальнейшей жизни объекта.'
  kind: choice
  options:
    - Иначе журнал покажет текущее состояние данных, а не то, что агент получил в момент запуска
    - Иначе объект будет удалён сборщиком мусора и запись опустеет
    - Иначе одинаковые входы разных запусков нельзя будет сравнить между собой
    - Иначе не удастся вычислить время выполнения запуска
  correct: 0
  id: 036-audit-execution-1
  fingerprint: 9f24f132
- concept: чтение журнала возвращает копию, чтобы читатель не мог изменить сам источник проверки
  question: Почему метод, отдающий журнал аудита наружу, возвращает копию записей, а не внутренний массив?
  explanation: 'Изоляция нужна в обе стороны: копия на записи защищает журнал от последующих правок входа, копия на чтении — от правок со стороны потребителя. Журнал, который читатель может молча изменить, перестаёт быть доказательством.'
  kind: choice
  options:
    - Читатель, получив внутренние объекты, может изменить их и тем самым отредактировать источник проверки
    - Копирование ускоряет фильтрацию записей по агенту и по сессии
    - Внутренний массив нельзя сериализовать в JSON без предварительного копирования
    - Копия нужна, чтобы записи не потеряли порядок добавления при чтении
  correct: 0
  id: 036-audit-execution-2
  fingerprint: 388cb95b
- concept: 'журнал запрашивается по трём независимым осям: отдельный запуск, агент, связанная цепочка'
  question: Расследуется жалоба на цепочку связанных запусков, выполненных одним пользователем в рамках одной сессии. По какому ключу извлекается вся эта цепочка?
  explanation: 'Три оси отвечают на три разных вопроса: идентификатор запуска — «что было в этом конкретном запуске», имя агента — «как в целом работает этот агент», идентификатор сессии — «что произошло в рамках одной связанной работы». Соседство по времени в общем журнале ничего не гарантирует: параллельные сессии перемешиваются.'
  kind: choice
  options:
    - 'По идентификатору сессии: он объединяет несколько запусков, возможно разных агентов'
    - 'По идентификатору запуска: он охватывает все шаги, выполненные в рамках одной сессии'
    - 'По имени агента: сессия всегда обслуживается ровно одним агентом'
    - 'По времени начала: записи одной сессии всегда идут в журнале подряд'
  correct: 0
  id: 036-audit-execution-3
