- concept: проверка совпадения поля id в полученном документе с запрошенным DID — обязательная часть разрешения
  question: Клиент разрешил DID, получил по HTTPS корректный JSON, но поле id в документе указывает на другую идентичность. Что делать?
  explanation: Разрешение считается успешным, только если документ подтверждает свою принадлежность запрошенному идентификатору. Иначе достаточно подложить на нужный путь чужой документ, чтобы клиент проверял подписи не тем ключом.
  kind: choice
  options:
    - 'Принять документ: важен адрес, по которому он получен, а не поле id'
    - 'Отклонить: документ не является DID-документом запрошенного агента, ключи из него использовать нельзя'
    - Принять ключи, но не использовать секцию сервисов
    - Повторить запрос по адресу из поля id и работать с ним
  correct: 1
  id: 042-did-resolution-2
  fingerprint: c4c54a53
- concept: хостинг DID-документа на домене владельца делает TLS-проверку домена частью подтверждения личности
  question: Почему в did:wba важно, что документ лежит на домене самого владельца, а не в общем реестре?
  explanation: 'Доверие складывается из TLS домена, подписи DID и минимума выдаваемых прав. Документ на домене владельца означает: кто контролирует домен, тот публикует ключи. Центрального органа при этом нет — каждая сторона проверяет партнёра напрямую.'
  kind: choice
  options:
    - Потому что так документ загружается быстрее и его проще кэшировать
    - Потому что TLS-сертификат домена связывает документ с контролем над этим доменом, добавляя проверку поверх подписи
    - Потому что общий реестр не поддерживает JSON
    - Потому что иначе идентификатор пришлось бы менять при каждом обновлении ключей
  correct: 1
  id: 042-did-resolution-3
  fingerprint: 2f09b891
