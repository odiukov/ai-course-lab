- concept: естественный язык в мета-протоколе служит средством выбора формата, а рабочий обмен идёт по выбранному точному протоколу
  question: Два агента из разных экосистем описывают друг другу на естественном языке, какие форматы обмена поддерживают, и сходятся на REST с описанием OpenAPI. Какую роль естественный язык играет дальше?
  explanation: Мета-протокол — правила, по которым выбирают другие правила. Свободный текст удобен, когда стороны ещё не имеют общего словаря, но он не даёт ни типовой проверки, ни предсказуемого разбора. Как только формат зафиксирован, обмен переходит на строгий контракт, а согласование остаётся в стороне переговоров.
  kind: choice
  options:
    - Он становится рабочим форматом обмена, а REST используется только как резерв
    - Он использовался для выбора формата; рабочие запросы идут уже по согласованному REST-контракту
    - Он обязателен в каждом запросе как пояснение к телу сообщения
    - Он заменяет схему, поэтому проверять структуру сообщений больше не нужно
  correct: 1
  id: 051-meta-negotiation-1
  fingerprint: 4df7b3d6
- concept: заранее общий формат данных не обязателен, обязательна общая процедура договорённости о формате
  question: Объясни, что должно быть общим у двух ранее незнакомых агентов, чтобы они смогли начать работать вместе без заранее согласованной схемы данных.
  explanation: 'Именно это снимает необходимость предварительной интеграции: договорённость производится на ходу, но по фиксированной процедуре с ограниченным набором статусов, а не свободно.'
  kind: open
  reference: 'Общей должна быть процедура согласования, а не сам формат данных. Стороны обмениваются сообщениями мета-протокола: действие `protocolNegotiation`, номер предложения, список кандидатов и статус. Пока идут уточнения, статус `negotiating`; принятие даёт `accepted`, отказ — `rejected`, исчерпание лимита раундов — `timeout`. После принятия каждая сторона может сгенерировать обработчик согласованного формата прямо во время работы. Заранее прописанная общая схема при этом не требуется.'
  id: 051-meta-negotiation-2
  fingerprint: fe2edb83
