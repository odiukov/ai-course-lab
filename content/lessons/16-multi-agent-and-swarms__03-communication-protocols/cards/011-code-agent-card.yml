- concept: у skill есть стабильный машинный идентификатор id, отдельный от человекочитаемого name
  question: У skill в Agent Card есть и `id`, и `name`. Зачем оба, если оба — строки?
  explanation: Смена названия умения не должна ломать тех, кто уже адресуется к нему. Поэтому машинная ссылка идёт на `id`, а `name` и `description` остаются полем для людей и для отбора кандидатов.
  kind: choice
  options:
    - '`id` — стабильный идентификатор, на который ссылаются программно; `name` — человекочитаемый заголовок, который можно переписать без ломки клиентов'
    - '`id` — то же самое, что `name`, но в нижнем регистре, и его вычисляют автоматически'
    - '`id` требуется только при нескольких skill''ах в карточке'
  correct: 0
  id: 011-code-agent-card-1
  fingerprint: ee6bc028
- concept: поля тегов и форматов типизированы как списки, поэтому единственное значение оформляется массивом из одного элемента
  question: У skill ровно один выходной формат — `text/markdown`. Как правильно записать `outputModes`?
  explanation: Тип `string[]` не меняется от количества значений. Строка вместо массива ломает разбор у клиента, который перебирает форматы, — и такая карточка перестаёт быть машиночитаемым обещанием.
  kind: choice
  options:
    - '`outputModes: "text/markdown"` — массив нужен только при нескольких значениях'
    - '`outputModes: ["text/markdown"]` — тип поля список, число элементов на форму записи не влияет'
    - '`outputModes: { default: "text/markdown" }` — единственное значение записывается объектом'
  correct: 1
  id: 011-code-agent-card-2
