- concept: поиск по идентификатору отвечает на вопрос о существовании записи, а не о пригодности возможностей
  question: '`registry.resolve("Atlas")` вернул карточку. Какой вывод из этого следует?'
  explanation: Успешный поиск по имени подтверждает только наличие записи. Пригодность проверяется по содержимому карточки — заявленным умениям и поддерживаемым входным форматам; ни доступность, ни совместимость из имени не следуют.
  kind: choice
  options:
    - Агент с таким именем зарегистрирован; подходит ли он для задачи — отдельный вопрос к его skill'ам и форматам
    - Агент найден и, раз он зарегистрирован, справится с любой задачей своего домена
    - Агент доступен по сети и готов принять задачу прямо сейчас
  correct: 0
  id: 012-capability-match-1
  fingerprint: cae37f36
- concept: обнаружение возвращает множество кандидатов, отфильтрованных по условию задачи, а не единственного заранее известного исполнителя
  question: '`discoverBySkillTag("research")` возвращает массив карточек. Почему обнаружение устроено как фильтр, а не как возврат одного агента?'
  explanation: 'Реестр отвечает на вопрос «кто удовлетворяет условию», а не «кто победитель». Пустой результат — тоже ответ: он означает, что задачу некому поручить, и это выясняется до отправки.'
  kind: choice
  options:
    - Массив нужен для совместимости с JSON, реально используется первый элемент
    - Условию могут отвечать несколько агентов или ни одного; выбор между подходящими кандидатами остаётся за клиентом
    - Массив содержит одного агента и его резервные копии
  correct: 1
  id: 012-capability-match-2
  fingerprint: 1223f7fa
- concept: 'критерии обнаружения независимы: совпадение по тегу темы не гарантирует совместимости форматов ввода'
  question: Агент найден по тегу skill'а `reports`, но нужный формат `application/pdf` отсутствует и в `defaultInputModes` карточки, и в `inputModes` этого skill'а. Что дальше?
  explanation: 'Поиск по тегу и поиск по входному MIME-типу проверяют разные вещи. Именно поэтому проверка входного формата смотрит в два места — значения по умолчанию карточки и `inputModes` каждого skill''а: тематическое совпадение само по себе ничего не обещает.'
  kind: choice
  options:
    - 'Кандидат отсеивается: тег описывает тему умения, а не совместимость по данным'
    - 'Кандидат подходит: раз тег совпал, агент примет любой формат из своего домена'
    - Кандидат подходит, если формат есть в `outputModes` — вход выводится из выхода
  correct: 0
  id: 012-capability-match-3
  fingerprint: 7ff52984
