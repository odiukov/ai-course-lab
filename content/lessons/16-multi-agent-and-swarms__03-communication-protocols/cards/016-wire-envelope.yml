- concept: поле id связывает ответ с конкретным запросом, поэтому порядок прихода ответов не важен
  question: 'Клиент отправил агенту восемь вызовов подряд по одному соединению. Первым приходит ответ с `id: 7`. Как клиент понимает, к чему этот ответ относится?'
  explanation: 'JSON-RPC делает корреляцию явной: агент обязан вернуть тот же `id`, что пришёл в запросе. Это позволяет отвечать не в порядке поступления и обрабатывать вызовы параллельно. Опора на порядок сломалась бы при первом же вызове, который выполняется дольше соседнего.'
  kind: choice
  options:
    - 'По порядку прихода: первый ответ соответствует первому отправленному запросу'
    - 'По значению `id`: ответ парный запросу, отправленному с тем же `id`, независимо от порядка'
    - По полю `method` внутри ответа, где повторяется имя вызванной операции
  correct: 1
  id: 016-wire-envelope-1
  fingerprint: 565bb98a
- concept: 'запрос и ответ асимметричны по полям: имя операции есть только в запросе, исход — только в ответе'
  question: Почему в успешном ответе JSON-RPC нет поля `method`, а есть `result`?
  explanation: 'Конверт запроса отвечает на «что сделать и с чем»: `method` плюс `params`. Конверт ответа отвечает на «что получилось»: либо `result`, либо `error`, и обязательно `id` для привязки. Дублировать имя операции в ответе незачем — связь уже держится на `id`.'
  kind: choice
  options:
    - Потому что операция уже названа в запросе, а ответ несёт только исход вызова, привязанный к нему по `id`
    - Потому что `method` разрешено опускать для экономии трафика, но его наличие тоже допустимо
    - Потому что имя операции переехало внутрь `result` вместе с данными
  correct: 0
  id: 016-wire-envelope-2
  fingerprint: 7939c226
- concept: клиент объявляет допустимые форматы ответа отдельным полем конфигурации вызова
  question: Клиент готов принять ответ только как обычный текст или JSON. Каким полем конфигурации вызова он это объявляет?
  explanation: '`acceptedOutputModes` — заявка клиента на форматы результата, а не описание отправленных данных. Она лежит в `configuration`, отдельно от `message`: полезная нагрузка и условия обработки не смешиваются, поэтому агент может проверить выполнимость требований до начала работы.'
  kind: cloze
  template: |-
    "params": {
      "message": { "messageId": "msg-042", "role": "ROLE_USER", "parts": [{ "text": "..." }] },
      "configuration": {
        "___": ["text/plain", "application/json"],
        "historyLength": 25
      }
    }
  answer: acceptedOutputModes
  accept:
    - acceptedOutputModes
    - '"acceptedOutputModes"'
  id: 016-wire-envelope-3
  fingerprint: d9730392
