- concept: 'шлюз делегирования упорядочивает ворота: подтверждение отправителя, поиск исполнителя, открытие аудита, создание задачи'
  question: Шлюз принимает подписанную просьбу делегировать работу указанному агенту. Расставь его действия в порядке выполнения.
  explanation: 'Каждый следующий шаг имеет смысл только при успехе предыдущего: искать исполнителя для неподтверждённого отправителя незачем, а открывать запуск и создавать задачу — незачем без исполнителя.'
  kind: order
  items:
    - Проверить подпись отправителя относительно заявленного DID
    - Найти карточку целевого агента в реестре и убедиться, что он зарегистрирован
    - Открыть аудируемый запуск, который зафиксирует вход, статус и траекторию
    - Создать задачу с отслеживаемым жизненным циклом и вернуть её вместе с записью аудита
  id: 056-gateway-order-1
  fingerprint: 96b1ce77
- concept: провал раннего ворота прекращает обработку до появления побочных эффектов, поэтому проверки идут раньше действий, изменяющих состояние
  question: 'Инженер предлагает ускорить шлюз: сразу создавать задачу и запускать работу, а подпись отправителя проверять параллельно. Что не так с этим планом?'
  explanation: Ворота ставятся перед действиями с побочными эффектами. Создание задачи и открытие аудируемого запуска наблюдаемы и часто необратимы, поэтому подтверждение отправителя обязано их опережать, а не сопровождать.
  kind: choice
  options:
    - 'Задача и запись запуска — это уже изменение состояния системы: при поддельной подписи в системе останется работа, инициированная тем, кому это не разрешено'
    - 'Параллельная проверка подписи математически невозможна: алгоритм требует последовательного доступа к ключу'
    - 'Ничего: раз задачу можно перевести в терминальный статус, любое преждевременное действие обратимо'
    - 'Проблема только в скорости: проверка подписи всё равно дороже создания задачи'
  correct: 0
  id: 056-gateway-order-2
  fingerprint: 0e289bec
- concept: 'запись аудита и задача отвечают на разные вопросы: содержание запуска против текущего состояния поручения'
  question: Шлюз возвращает и запись аудита, и созданную задачу. Почему это не дублирование?
  explanation: Это две разные оси наблюдения. Из статуса задачи нельзя восстановить, какие инструменты вызывались и с какими аргументами, а из записи запуска нельзя узнать, чего клиенту ещё ждать от поручения.
  kind: choice
  options:
    - Запись аудита описывает, что происходило внутри выполнения — вход, исход, шаги траектории; задача описывает, в каком состоянии находится поручение и как оно продвигается
    - Запись аудита — это копия задачи на случай потери оригинала
    - Задача хранит траекторию, а запись аудита — только идентификатор задачи
    - Аудит нужен внешним агентам, задача — внутренним; содержимое у них одинаковое
  correct: 0
