- concept: потоковая выдача делает ход работы наблюдаемым до финала и снимает нужду буферизовать промежуточные результаты
  question: Обработчик переписали с «вернуть готовый результат по завершении» на «выдавать события по ходу работы». Что реально меняется для вызывающей стороны?
  explanation: 'Выигрыш не в скорости вычислений, а в наблюдаемости: длительная работа перестаёт быть неподвижной, а потребитель реагирует на каждое событие сразу, не дожидаясь финального ответа.'
  kind: choice
  options:
    - Работа выполняется быстрее, так как шаги идут параллельно
    - Промежуточное состояние — смена статуса, готовые куски результата — становится доступно немедленно, без накопления всего результата в памяти до конца
    - Обработчик перестаёт нуждаться в обработке ошибок
    - Вызывающая сторона получает право менять порядок шагов обработчика
  correct: 1
