- concept: 'чтение генератора по одному элементу создаёт естественное обратное давление: производитель продолжает только после обработки предыдущего события'
  question: Потребитель читает асинхронный генератор в цикле и обрабатывает каждое событие внутри тела цикла. Объясни своими словами, почему производитель при этом не может «убежать вперёд» и завалить потребителя событиями.
  explanation: Это отличие от модели с обратными вызовами, где источник шлёт события когда захочет и требует собственного буфера. Здесь темп задаёт цикл чтения.
  kind: open
  reference: 'Генератор — источник по требованию: следующая порция кода производителя выполняется только тогда, когда потребитель запросил очередной элемент. Пока обработка текущего события не закончилась, запроса нет, и производитель остаётся приостановленным. Получается обратное давление без отдельной очереди и ограничителя: скорость производства задаёт потребитель.'
