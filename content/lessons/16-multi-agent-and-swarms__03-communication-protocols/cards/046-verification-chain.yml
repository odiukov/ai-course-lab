- concept: открытый ключ берётся из разрешённого DID-документа, а не из самого запроса, иначе отправитель проверяет сам себя
  question: Запрос агента содержит DID, подпись и приложенный открытый ключ. Почему проверять подпись этим приложенным ключом нельзя?
  explanation: 'Данные, которые контролирует проверяемая сторона, не могут быть источником доверия: подпись, сделанная чужой парой ключей, идеально сойдётся с приложенным к ней открытым ключом. Поэтому ключ берут только из DID-документа, разрешённого по правилам метода DID у домена владельца.'
  kind: choice
  options:
    - Отправитель мог сгенерировать собственную пару и приложить свой открытый ключ — тогда проверка подтвердит только внутреннюю согласованность запроса, а не личность
    - Приложенный ключ обычно повреждается при передаче
    - Ключ в запросе закодирован иначе, чем в DID-документе, поэтому проверка технически невозможна
    - Проверять им можно, но это медленнее, чем загрузка документа
  correct: 0
  id: 046-verification-chain-1
  fingerprint: 16ca90cd
- concept: аутентификация перебирает только ключи, объявленные в authentication; совпадение подписи с ключом другого назначения не подтверждает вход
  question: Подпись запроса математически сошлась с ключом, который в DID-документе перечислен только в keyAgreement. Как должна поступить проверяющая сторона?
  explanation: Владение ключом и право использовать его для входа — разные утверждения. Проверка сначала сужает набор до методов, перечисленных в authentication, и лишь потом сверяет подпись. Иначе ключ шифрования превращается в универсальный пропуск, и разделение ключей теряет смысл.
  kind: choice
  options:
    - 'Отклонить: совпадение доказывает владение закрытым ключом, но этот ключ не объявлен допустимым для аутентификации'
    - 'Принять: любой ключ из документа принадлежит агенту, значит личность подтверждена'
    - Принять, но выдать токен с урезанными правами
    - Отклонить только если ключ ещё и просрочен
  correct: 0
  id: 046-verification-chain-2
  fingerprint: f968a831
- concept: элементы authentication бывают ссылками на записи verificationMethod и разрешаются внутри того же документа
  question: В секции authentication стоит строка вида did:wba:example.com:agent:bob#key-1, а не сам объект ключа. Что делает проверяющая сторона?
  explanation: authentication допускает и встроенное описание метода, и ссылку по идентификатору. Ссылка разрешается внутри уже полученного документа — отдельного сетевого запроса за ней не идёт. Так один и тот же ключ можно объявить в нескольких секциях назначения, не дублируя его описание.
  kind: choice
  options:
    - Находит запись с таким id в verificationMethod того же документа и берёт открытый ключ оттуда
    - Загружает ключ по этой строке как по HTTP-адресу с домена агента
    - 'Считает такую запись некорректной: authentication обязан содержать встроенные ключи'
    - Использует строку как саму подпись для сравнения
  correct: 0
  id: 046-verification-chain-3
  fingerprint: 247622a0
