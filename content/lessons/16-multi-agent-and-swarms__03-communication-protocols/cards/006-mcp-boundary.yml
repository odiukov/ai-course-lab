- concept: 'порядок сообщений в связке клиент — MCP-сервер: сначала обнаружение инструментов, потом вызов'
  question: Расставь по порядку сообщения между агентом-клиентом и MCP-сервером при первом использовании незнакомого инструмента.
  explanation: 'Обнаружение предшествует вызову: без описания параметров клиент не может собрать корректный запрос. Именно эти два шага — discovery и execution — протокол и стандартизирует, оставляя внутреннюю реализацию инструмента за границей контракта.'
  kind: order
  items:
    - Клиент запрашивает список доступных инструментов
    - 'Сервер возвращает определения инструментов: имена, назначение, параметры'
    - Клиент вызывает выбранный инструмент с конкретными аргументами
    - Сервер возвращает результат выполнения
  id: 006-mcp-boundary-1
  fingerprint: 82f50b0d
- concept: в связке агент — инструмент решение о выборе и цели вызова остаётся у клиента, сервер только выставляет и исполняет возможности
  question: MCP-сервер принимает запросы и возвращает ответы. Почему его при этом не считают вторым агентом в системе?
  explanation: 'Обмен сообщениями сам по себе не делает сторону агентом. Граница проходит по месту принятия решения: клиент выбирает инструмент и знает зачем, сервер выполняет конкретную операцию. Сетевой характер связи и умение возвращать ошибки к этому отношения не имеют.'
  kind: choice
  options:
    - Потому что он работает в другом процессе и по сети
    - Потому что он не ставит целей, не планирует и не распределяет работу, а выставляет и исполняет возможности по запросу клиента
    - Потому что он не умеет возвращать ошибки и частичные результаты
  correct: 1
  id: 006-mcp-boundary-2
  fingerprint: f4ed3b16
- concept: связка агент — инструмент перестаёт описывать ситуацию, когда вторая сторона ведёт собственную задачу
  question: По каким признакам понятно, что взаимодействие переросло схему «агент — инструмент» и требует протокола общения между агентами? Объясни своими словами.
  explanation: Ключевое различие не в сложности ответа, а в наличии у второй стороны собственной цели и жизненного цикла задачи.
  kind: open
  reference: 'Признаки такие: вторая сторона сама декомпозирует полученную цель и ставит подзадачи, ведёт собственное состояние и жизненный цикл работы (принято, в процессе, требуется уточнение, завершено), может отказаться, торговаться об условиях или вернуть промежуточный статус, а не единственный результат вызова. Инструмент отвечает на вызов детерминированной операцией и не имеет собственной цели; самостоятельный участник согласует цель и отчитывается о ходе. Как только нужны объявление возможностей, переговоры и отслеживание состояния задачи, схемы «вызвал функцию — получил результат» уже не хватает.'
  id: 006-mcp-boundary-3
  fingerprint: '58934600'
