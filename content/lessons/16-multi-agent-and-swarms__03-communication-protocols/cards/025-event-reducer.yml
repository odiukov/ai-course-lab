- concept: 'доставка события и его применение к состоянию — разные обязанности: транспорт не решает, допустимо ли изменение'
  question: Клиент получает поток событий агента и хранит объект задачи. Почему разбор входящих событий и обновление задачи разносят на два отдельных шага?
  explanation: Разбор потока отвечает на вопрос «что пришло», применение — на вопрос «что с этим делать при текущем состоянии». Смешивание обязанностей ведёт к тому, что любое доставленное событие слепо меняет задачу.
  kind: choice
  options:
    - Чтобы транспорт мог менять формат событий без согласования с агентом
    - Потому что транспорт отвечает только за доставку корректно разобранного события, а решение о допустимости изменения принимает шаг применения, знающий текущее состояние задачи
    - Потому что события нельзя применять к состоянию, пока поток не закрыт
    - Чтобы события можно было применять в произвольном порядке
  correct: 1
  id: 025-event-reducer-1
  fingerprint: 38ebd9b9
- concept: фрагмент продолжения адресуется идентификатором артефакта, а не позицией в потоке, поэтому несколько артефактов собираются параллельно
  question: Агент одновременно формирует два артефакта — таблицу и текстовую сводку — и события их частей приходят вперемешку. Как получатель понимает, к какому артефакту относится очередной фрагмент?
  explanation: 'Сборка идёт по id: получатель ищет уже начатый артефакт с тем же идентификатором и дописывает части в него. Опираться на порядок прихода нельзя — чередующиеся потоки частей это сразу ломает.'
  kind: choice
  options:
    - 'По порядку прихода: фрагменты одного артефакта всегда идут подряд'
    - По идентификатору артефакта внутри события, поэтому чередование фрагментов разных артефактов безопасно
    - По имени артефакта, которое должно быть уникальным в потоке
    - По номеру события в потоке, вычисляемому получателем
  correct: 1
