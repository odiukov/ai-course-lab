- concept: событие принадлежит конкретной задаче, поэтому перед применением сверяется идентификатор задачи в событии
  question: Клиент подписан на несколько задач одного агента. Что должно происходить с событием, чей идентификатор задачи не совпадает с идентификатором обновляемого объекта?
  explanation: Идентификатор задачи в событии — это адрес. Канал доставки может быть общим, поэтому применение чужого события смешало бы состояния двух независимых задач.
  kind: choice
  options:
    - Оно применяется к объекту, потому что пришло по его подписке
    - 'Оно не применяется к этому объекту: принадлежность события задаче определяется идентификатором, а не каналом доставки'
    - Оно применяется, но только если событие несёт статус
    - Оно применяется к последней созданной задаче клиента
  correct: 1
