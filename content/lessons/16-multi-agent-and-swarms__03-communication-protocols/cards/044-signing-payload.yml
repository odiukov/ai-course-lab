- concept: подпись даёт целостность и авторство, но не конфиденциальность содержимого
  question: Агент отправил подписанное поручение на перевод 12 000 рублей. Что даёт подпись?
  explanation: 'Подпись ничего не прячет: текст остаётся открытым. Она решает две другие задачи — целостность (байты не подменены) и авторство (создано владельцем закрытого ключа). За скрытие содержимого отвечает шифрование, для которого нужны другие ключи.'
  kind: choice
  options:
    - Получатель убедится, что байты не менялись и созданы владельцем закрытого ключа, но сумму по-прежнему видит любой, кто читает сообщение
    - Сумма становится нечитаемой для посредников и восстанавливается только получателем
    - Сообщение нельзя прочитать без открытого ключа отправителя
    - Подпись скрывает и содержимое, и личность отправителя
  correct: 0
