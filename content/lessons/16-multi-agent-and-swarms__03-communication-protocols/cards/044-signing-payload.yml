- concept: hex-строка — форма транспортировки готовой подписи, а не место, где возникает доказательство
  question: Подпись после создания переводят в шестнадцатеричную строку. Объясни своими словами, что даёт эта операция и что она не даёт.
  explanation: Кодирование и криптография — разные слои. Ошибка «подпись в hex надёжнее» путает представление данных с их защитой; единственное требование к кодировке — симметрия между подписанием и проверкой.
  kind: open
  reference: Криптографическая операция над закрытым ключом и байтами сообщения возвращает бинарный результат. Перевод в hex — только кодирование этих байтов в печатный вид, чтобы подпись можно было положить в JSON, заголовок HTTP или журнал. Стойкость и само доказательство возникают раньше, в момент подписания; выбор кодировки (hex, base64) ничего не добавляет к безопасности и ничего не отнимает. Важно лишь, чтобы проверяющая сторона декодировала подпись той же кодировкой.
  id: 044-signing-payload-3
  fingerprint: 9aeacc66
