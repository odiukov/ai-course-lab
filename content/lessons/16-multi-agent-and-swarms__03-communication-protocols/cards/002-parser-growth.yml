- concept: без общего контракта изменение формата у одного агента распространяется на всех его партнёров, а не локализуется в одном месте
  question: Один агент в системе прямых попарных связей поменял формат своего ответа. Объясни своими словами, почему цена такого изменения зависит от числа его партнёров, и что меняет наличие общего протокола.
  explanation: Ключ — локализация знания о формате. Попарные связи дублируют его N раз, протокол хранит один раз. Поэтому стоимость изменения падает с «пропорционально числу партнёров» до постоянной.
  kind: open
  reference: 'При прямых связях формат ответа зашит в каждом партнёрском парсере отдельно: изменение у одного агента ломает столько обработчиков, сколько у него партнёров, и чинить надо каждый. Общего места, где описан контракт, нет — знание о формате размазано по связям. С общим протоколом формат описан один раз в схеме сообщения: агент меняет свою реализацию под контракт, партнёры не трогаются вообще, либо ломается валидация в одной точке, а не молча в N парсерах. Плюс несовместимость обнаруживается на границе протокола, а не по неверному поведению дальше по цепочке.'
  id: 002-parser-growth-3
  fingerprint: 787230f9
