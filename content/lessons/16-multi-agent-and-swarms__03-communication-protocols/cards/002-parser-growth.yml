- concept: число попарных направленных интеграций между агентами растёт как n(n-1)
  question: В многоагентной системе каждый агент общается с каждым другим напрямую, и обработчик исходящего сообщения к соседу и обработчик входящего от него пишутся отдельно. Сколько всего направленных связей нужно поддерживать при 7 агентах?
  explanation: 'Каждый из n агентов держит по одной направленной связи с каждым из остальных n-1: n(n-1) = 7·6 = 42. Рост квадратичный, поэтому добавление одного участника обходится дороже, чем кажется по размеру команды.'
  kind: numeric
  answer: 42
  tolerance: 0.5
  id: 002-parser-growth-1
  fingerprint: c2a04c69
- concept: общий протокол заменяет попарные интеграции одной реализацией контракта на агента, меняя квадратичный рост на линейный
  question: 12 агентов от разных команд. Вариант A — каждая пара договаривается о своём формате напрямую. Вариант B — все реализуют один общий протокол обмена. Как меняется объём интеграционной работы?
  explanation: 'Попарные интеграции дают n(n-1) = 12·11 = 132. Общий протокол превращает задачу в «поддержи контракт один раз»: 12 реализаций. Именно замена квадратичного роста линейным — причина существования MCP, A2A, ACP и ANP, а не удобство формата как такового.'
  kind: choice
  options:
    - A требует 132 отдельных связи, B — по одной реализации протокола на агента, то есть 12
    - Оба варианта требуют 132 реализации, B лишь делает их однотипными
    - B требует 132 реализации протокола плюс сам протокол, поэтому дороже A
    - В обоих вариантах объём работы зависит только от числа сообщений, а не от числа агентов
  correct: 0
  id: 002-parser-growth-2
