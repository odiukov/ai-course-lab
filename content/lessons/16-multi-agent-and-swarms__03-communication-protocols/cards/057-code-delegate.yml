- concept: предвиденный отказ входит в возвращаемый тип функции, исключение резервируется за непредвиденным сбоем
  question: Функция делегирования объявлена с типом результата «задача и запись аудита либо объект с полем ошибки». Как должен обрабатываться случай, когда запрошенного агента нет в реестре?
  explanation: Раз тип результата уже описывает ветку ошибки, вызывающий обязан её разобрать. Превращение предусмотренного исхода в исключение ломает контракт и заставляет обрабатывать один и тот же случай двумя способами.
  kind: choice
  options:
    - 'Вернуть объект с полем ошибки, назвав запрошенного агента: отсутствие записи — ожидаемый исход, предусмотренный контрактом'
    - Бросить исключение, потому что дальше работать всё равно нельзя
    - Вернуть задачу с пустым исполнителем, чтобы вызывающий сам решил, что делать
    - Молча вернуть первого агента из реестра, чтобы запрос не пропал
