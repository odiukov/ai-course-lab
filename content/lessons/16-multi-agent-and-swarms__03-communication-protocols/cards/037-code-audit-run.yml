- concept: исключение обработчика поглощается раннером и становится содержимым записи аудита, а не пробрасывается вызывающему
  question: Раннер аудита вызывает обработчик агента внутри try/catch. Обработчик выбрасывает исключение. Что должен вернуть метод запуска?
  explanation: 'Контракт раннера: любой запуск даёт запись аудита. Если сбой уходит наружу исключением, вызывающий получает ошибку, но система теряет единый способ читать судьбу запуска. Сбой оформляется как исход внутри записи: статус failed плюс запись об ошибке.'
  kind: choice
  options:
    - Пробросить исключение вызывающему, чтобы тот сам решил, как логировать сбой
    - Вернуть ту же запись аудита со статусом failed и описанием ошибки внутри записи
    - Вернуть null, потому что результата запуска нет
    - Повторить вызов обработчика и вернуть результат второй попытки
  correct: 1
  id: 037-code-audit-run-1
  fingerprint: efcaa70f
- concept: запись помещается в журнал ссылкой, поэтому последующие изменения её полей видны в журнале без повторной вставки
  question: Раннер кладёт объект записи в массив журнала сразу после создания, ещё до исполнения, а затем меняет у него статус и время завершения. Почему в журнале не остаётся устаревшая версия?
  explanation: В массив попадает ссылка на объект, а не его снимок. Именно поэтому можно зарегистрировать попытку заранее и дописывать исход по ходу. Снимок делается только на чтении журнала — там возвращается клон, чтобы читатель не правил источник.
  kind: choice
  options:
    - Потому что массив пересобирается при каждом чтении журнала
    - Потому что в массиве лежит ссылка на тот же объект, и мутации полей видны через журнал
    - Потому что запись нужно вставить в журнал повторно после каждого изменения статуса
    - Потому что статус хранится отдельно от журнала и подставляется при чтении
  correct: 1
  id: 037-code-audit-run-2
  fingerprint: 282da7a2
- concept: отсутствие зарегистрированного обработчика и падение обработчика дают одинаковый статус, но различаются содержимым записи
  question: Запуск с незарегистрированным именем агента и запуск, где обработчик выбросил исключение, оба заканчиваются статусом failed. Чем записи различаются?
  explanation: 'Оба исхода — отказ, но причины разные. Незарегистрированный агент означает, что исполнения не было вовсе: пустая траектория, статус меняется прямо после неудачного поиска обработчика. Падение обработчика оставляет след исполнения — запись об ошибке в траектории.'
  kind: choice
  options:
    - 'Ничем: обе записи неотличимы, поэтому нужен отдельный статус для незарегистрированного агента'
    - В первом случае обработчик не вызывался, поэтому траектория остаётся пустой; во втором в траекторию попадает шаг с описанием ошибки
    - В первом случае вход не сохраняется, во втором сохраняется
    - В первом случае запись не попадает в журнал, во втором попадает
  correct: 1
  id: 037-code-audit-run-3
  fingerprint: d54a3404
