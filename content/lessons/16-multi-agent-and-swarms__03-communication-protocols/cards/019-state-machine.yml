- concept: успешное завершение достижимо только через стадию активного выполнения, а не напрямую из состояния приёма
  question: Агент получил простой запрос и справился с ним мгновенно. Расставь состояния задачи A2A в том порядке, в котором она обязана их пройти, прежде чем итог будет зафиксирован как успешный.
  explanation: 'Стрелок из submitted в completed в автомате нет: из состояния приёма ведут только два пути — начало выполнения (working) и отказ (rejected). Успех, ошибка и отмена достижимы лишь из working. Поэтому «быстрая» задача всё равно проходит через working, пусть и на доли секунды.'
  kind: order
  items:
    - submitted — запрос зарегистрирован, выполнение ещё не начиналось
    - working — агент активно обрабатывает задачу
    - completed — успешный итог зафиксирован
  id: 019-state-machine-1
  fingerprint: 1832ec63
- concept: конечный автомат ограничивает допустимые последовательности переходов, а не только множество значений статуса
  question: 'Своими словами: зачем жизненный цикл задачи A2A описан стрелками между состояниями, а не просто списком допустимых значений статуса?'
  explanation: 'Автомат — это контракт на последовательности, а не на словарь. Валидное значение статуса и валидный переход в него — разные проверки: вторая ловит ошибки реализации и повреждённые записи, которые первая пропускает.'
  kind: open
  reference: Список значений говорит только, какая подпись статуса вообще существует. Стрелки задают, из какого состояния в какое переход разрешён, то есть какую историю задача могла честно прожить. Это даёт реализации право отвергнуть некорректное обновление (например, попытку объявить успех у задачи, которая ещё не выполнялась, или изменить уже зафиксированный итог) и делает историю задачи проверяемой, а не набором произвольных ярлыков.
  id: 019-state-machine-2
  fingerprint: 930b19e9
