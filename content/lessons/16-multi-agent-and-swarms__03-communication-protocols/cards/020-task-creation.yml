- concept: 'идентичность задачи не выводится из содержания запроса: одинаковые формулировки внутри одной беседы дают разные id при общем contextId'
  question: Клиент отправил агенту 5 раз подряд буквально одинаковый текст запроса, каждый раз передавая один и тот же contextId. Сколько различных id задач и различных contextId окажется в менеджере?
  explanation: 'id выдаётся при создании каждой задачи и не зависит от текста сообщения: иначе история, артефакты и события пяти работ смешались бы в одной записи. contextId, наоборот, передан клиентом и сохраняется без изменений — он показывает, что все пять задач принадлежат одному разговору.'
  kind: choice
  options:
    - 5 различных id и 5 различных contextId
    - 5 различных id и 1 contextId
    - 1 id и 1 contextId — одинаковый текст считается повтором той же задачи
    - 1 id и 5 различных contextId
  correct: 1
  id: 020-task-creation-1
  fingerprint: 6accbccf
- concept: contextId — необязательный параметр запроса; его отсутствие означает начало нового разговора, а не ошибку
  question: Клиент отправляет агенту первое сообщение и не передаёт contextId. Что делает менеджер задач?
  explanation: 'Отсутствие contextId — нормальный случай: так выглядит начало новой беседы. Менеджер генерирует свежий идентификатор контекста, и клиент может передать его при следующем запросе, чтобы связать задачи. Переданный контекст, наоборот, сохраняется как есть.'
  kind: choice
  options:
    - 'Отклоняет запрос: без контекста задачу создать нельзя'
    - Создаёт задачу и генерирует для неё новый contextId
    - Оставляет поле contextId пустым до первого ответа агента
    - Использует id задачи в качестве contextId, чтобы поля совпадали
  correct: 1
  id: 020-task-creation-2
  fingerprint: 5dce96cf
