- concept: цитата указывает, где проверять утверждение, но не подтверждает его истинность
  question: Утверждение агента снабжено корректной ссылкой на источник, однако сам документ устарел. Что в этой ситуации даёт метаданные цитирования?
  explanation: Цитата — адрес проверки, а не сертификат достоверности. Она сокращает работу проверяющего до открытия конкретного документа, но оценка свежести и корректности толкования остаётся за человеком. Факт обращения к источнику фиксируют другие метаданные, а не эти.
  kind: choice
  options:
    - 'Точное место проверки: известно, какие слова и по какому документу сверять, но истинность утверждения этим не доказана'
    - 'Гарантию актуальности: наличие ссылки означает, что источник проверен на момент ответа'
    - 'Ничего: при устаревшем источнике цитата считается недействительной и отбрасывается'
    - Подтверждение того, что агент действительно обращался к этому документу во время работы
  correct: 0
