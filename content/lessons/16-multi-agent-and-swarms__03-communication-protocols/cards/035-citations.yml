- concept: структурированная привязка источника заменяет догадку читателя явным полем сообщения
  question: Чем структурированные метаданные цитирования лучше обычного списка ссылок в конце ответа? Объясни своими словами.
  explanation: Ключевое слово — машиночитаемость. Явная привязка позволяет строить проверки автоматически, например отмечать фрагменты ответа, за которыми не стоит ни один источник.
  kind: open
  reference: 'Список ссылок в конце сообщения оставляет связь «утверждение — источник» на догадку читателю: непонятно, что именно подтверждает каждая ссылка. Метаданные делают эту связь явной частью сообщения: указан адрес и заголовок источника плюс границы фрагмента, к которому он относится. Такую привязку можно обработать программно — подсветить участок текста, показать источник рядом с ним, отследить утверждения без источника вовсе.'
  id: 035-citations-3
  fingerprint: 9b5641b7
