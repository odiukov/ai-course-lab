- concept: ошибка исполнения записывается как шаг траектории, а поле результата остаётся пустым
  question: Обработчик агента упал на середине работы. Куда в записи аудита попадает текст ошибки?
  explanation: Выход — то, что агент вернул потребителю; при сбое он пуст, и подделывать его ошибкой нельзя. Ошибка описывает ход работы, поэтому её место в траектории, где у каждого шага есть своя отметка времени.
  kind: choice
  options:
    - В поле выхода, потому что ошибка и есть результат запуска
    - В траекторию отдельным шагом с отметкой времени, а поле выхода остаётся пустым
    - В поле входа рядом с исходным запросом
    - 'Никуда: достаточно статуса, текст ошибки хранится вне аудита'
  correct: 1
  id: 038-audit-check-1
  fingerprint: d277d93a
- concept: время завершения фиксируется и при отказе, поэтому длительность попытки измерима независимо от исхода
  question: Зачем проставлять время завершения в записи запуска, который окончился отказом?
  explanation: Время завершения закрывает интервал попытки. Без него отказ через миллисекунду и отказ после долгого зависания выглядят одинаково, а именно длительность часто отличает неверный запрос от недоступного инструмента.
  kind: choice
  options:
    - 'Чтобы отличить отказ от успеха: у успешных запусков это поле не заполняется'
    - Чтобы попытка имела измеримую длительность и было видно, работала она мгновение или упала по таймауту
    - Чтобы запись попала в журнал — без этого поля она не сохраняется
    - Чтобы вычислить время старта, которое иначе неизвестно
  correct: 1
  id: 038-audit-check-2
  fingerprint: d118c3a7
