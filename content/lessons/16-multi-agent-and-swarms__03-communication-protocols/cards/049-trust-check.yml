- concept: неподтверждённая и опровергнутая проверка дают один вердикт по доступу, но разные перспективы повторной попытки
  question: Объясни своими словами, чем случай «DID-документ недоступен» отличается от случая «подпись не сходится с ключом из документа», и почему в обоих случаях доступ не выдаётся.
  explanation: 'Смешивать эти случаи опасно в обе стороны: трактовать сбой как успех — открыть обход проверки, трактовать сбой как доказанную подделку — навсегда заблокировать честного агента из-за временной сетевой проблемы.'
  kind: open
  reference: 'Для доступа результат одинаков: сейчас личность не подтверждена, токен не выдаётся. Различаются причины и дальнейшее поведение. Недоступность документа — состояние проверяющей инфраструктуры: вердикт неизвестен, поэтому применяется отказ по умолчанию, а агент может повторить попытку позже, когда документ снова разрешается. Несовпадение подписи — содержательный отрицательный результат: ключ, объявленный владельцем DID, не подтверждает авторство, и повтор того же запроса ничего не изменит.'
