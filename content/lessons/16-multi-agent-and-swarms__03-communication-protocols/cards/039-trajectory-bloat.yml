- concept: объём траектории растёт как произведение числа вызовов инструментов на объём их входа и выхода и на число запусков
  question: Агент делает 45 вызовов инструментов за запуск, вход и выход одного вызова в сумме занимают 8 КБ. Запусков в сутки — 60. Сколько мегабайт траекторий накопится за сутки, если считать 1 МБ = 1000 КБ?
  explanation: 45 × 8 = 360 КБ на запуск, 360 × 60 = 21600 КБ ≈ 21.6 МБ в сутки. Множители перемножаются, поэтому умеренный на вид агент за месяц даёт сотни мегабайт — отсюда и нужда в уровнях подробности.
  kind: numeric
  answer: 21.6
  tolerance: 0.5
  id: 039-trajectory-bloat-1
  fingerprint: 33704a68
- concept: при усечении траектории первыми отбрасываются шаги рассуждения, а имена инструментов и их вход-выход сохраняются
  question: Записи аудита раздулись, и решено урезать подробность. Что режут в первую очередь, если аудит должен остаться пригодным для комплаенса?
  explanation: 'Комплаенс спрашивает, какие действия совершены и с какими данными: это имена инструментов и их ввод-вывод. Рассуждения объясняют, почему агент так решил, — ценно для отладки, но обычно не требуется регулятором, а объём даёт большой.'
  kind: choice
  options:
    - Имена вызванных инструментов — их можно восстановить по результату
    - Вход и выход вызовов инструментов, оставив только рассуждения агента
    - Шаги рассуждения агента, оставив имена инструментов и их вход-выход
    - Отметки времени, они занимают больше всего места
  correct: 2
  id: 039-trajectory-bloat-2
  fingerprint: f06b57c3
- concept: уровень подробности аудита — политика системы на класс запуска, а не одна глобальная настройка
  question: Почему уровень подробности аудита разумно задавать по типу запуска, а не выставлять один общий для всего сервиса?
  explanation: Подробность полезна ровно до тех пор, пока помогает ответить на проверяемый вопрос; дальше она становится шумом, который сам мешает проверке и оплачивается хранилищем.
  kind: open
  reference: Разные запуски отвечают на разные вопросы аудита. Рутинные задачи нуждаются лишь в статусе, времени, итоговом результате и перечне вызванных инструментов. Рискованные операции (деньги, персональные данные, необратимые действия) требуют полного ввода-вывода инструментов и последовательности шагов. Один глобальный уровень заставляет выбирать между переплатой за хранение и поиском по всем запускам либо потерей доказательной ценности там, где она обязательна. Поэтому один и тот же агент ведёт компактный аудит штатных задач и расширенный — для рискованных.
  id: 039-trajectory-bloat-3
  fingerprint: 060228bb
