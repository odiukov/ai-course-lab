- concept: 'охват протокола в системе неодинаков: одни применяются на каждом соединении, другие только там, где есть соответствующая граница'
  question: В организации несколько агентов работают между собой и иногда обращаются к партнёрским. Почему неверно требовать, чтобы каждое сообщение системы несло все четыре протокола?
  explanation: Протоколы наложены на разные границы одной операции. Обмен внутри доверенного периметра обходится без подтверждения личности внешней стороны, а агент без вызовов инструментов не порождает обращений к серверу инструментов. Совпадают они на уровне процесса, а не в каждом пакете.
  kind: choice
  options:
    - 'Потому что протокол включается там, где есть его граница: проверка личности нужна только при работе со стороной вне зоны контроля, а обращение к инструменту — только когда вызов действительно происходит'
    - Потому что протоколы конкурируют за транспорт и два из них нельзя использовать в одном процессе
    - Потому что только один протокол в системе может быть основным, остальные — резервные
    - Потому что аудит запуска заменяет собой проверку личности и обнаружение исполнителя
