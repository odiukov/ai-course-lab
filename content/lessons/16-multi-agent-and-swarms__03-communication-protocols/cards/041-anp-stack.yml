- concept: согласование формата обмена и генерация адаптирующего кода принадлежат метапротокольному слою, а не прикладному
  question: Два агента из разных экосистем перебирают варианты и сходятся на общем формате запросов, после чего порождают код для работы с ним. К какому слою ANP относится этот механизм?
  explanation: Метапротокол — это протокол о протоколе. Он не описывает услуги и не подтверждает личность, а вырабатывает общий формат для пары, которая заранее ни о чём не договаривалась.
  kind: choice
  options:
    - 'К прикладному: речь идёт о конкретных услугах агента'
    - 'К слою идентичности: договорённость подписывается ключами'
    - 'К метапротокольному: он отвечает за то, как стороны будут понимать сообщения'
    - 'Ни к какому: это транспортный уровень HTTP'
  correct: 2
