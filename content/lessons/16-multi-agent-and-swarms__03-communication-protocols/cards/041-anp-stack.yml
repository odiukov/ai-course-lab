- concept: подтверждение личности и конфиденциальность канала объединены в один нижний слой
  question: Почему проверка подписи и сквозное шифрование обмена в ANP отнесены к одному слою?
  explanation: 'Слой закрывает пару связанных вопросов: собеседник тот, за кого себя выдаёт, и посторонний не читает трафик. Ключи при этом разные — подписные отделены от ключей согласования, — но обе функции образуют один фундамент для всего, что выше.'
  kind: choice
  options:
    - Потому что они используют один и тот же ключ агента
    - 'Потому что оба отвечают на вопрос о безопасности самого канала: кто на другом конце и кто ещё может прочитать обмен'
    - Потому что шифрование возможно только после обнаружения агента в каталоге
    - Потому что оба выполняются только для рискованных операций
