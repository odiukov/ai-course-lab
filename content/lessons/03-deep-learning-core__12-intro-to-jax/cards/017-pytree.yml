- concept: структура pytree позволяет JAX находить параметры без их специальной регистрации
  question: Объясни своими словами, почему параметры модели, собранные в pytree, не требуется отдельно регистрировать или получать через метод `.parameters()`.
  explanation: Параметры модели — это листья обычной вложенной структуры данных. JAX знает правила обхода словарей, списков и кортежей, поэтому обнаруживает массивы без скрытого реестра параметров или специального класса-контейнера.
  kind: open
  reference: JAX умеет отделять структуру pytree от его значений и рекурсивно находить все листья. Если параметрические массивы лежат в листьях, преобразования JAX могут обойти их непосредственно, поэтому сама вложенная структура служит описанием набора параметров.
  id: 017-pytree-2
  fingerprint: 8fa488b5
