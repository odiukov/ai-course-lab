- concept: pmean усредняет значения между репликами pmap по именованной оси устройств
  question: Заполни пропуск в строке, которая синхронизирует градиенты, вычисленные репликами `pmap`.
  explanation: '`jax.lax.pmean` собирает локальные градиенты со всех реплик и возвращает каждой реплике их среднее. Если все копии начали с одинаковых параметров, применение одинакового среднего градиента сохраняет их согласованность.'
  kind: cloze
