- concept: смещение задаёт не зависящую от входа добавку к соответствующему выходу линейной модели
  question: Какое изменение увеличит один выбранный выход линейной модели на одну и ту же величину для любого входного вектора?
  explanation: В выражении jnp.dot(x, w) + b элемент смещения прибавляется к выходу напрямую и не зависит от x. Вклад весов, напротив, меняется вместе со значениями входных признаков.
  kind: choice
  options:
    - Увеличение соответствующего элемента смещения b
    - Увеличение всех компонентов входного вектора x
    - Перестановка строк матрицы весов w
    - Умножение выбранного столбца w на входной вектор
