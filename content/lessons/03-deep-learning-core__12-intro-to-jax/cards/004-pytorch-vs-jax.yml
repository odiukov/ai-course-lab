- concept: состояние nn.Module в PyTorch может влиять на результат без присутствия в аргументах вызова
  question: Два одинаково записанных вызова `model(x)` в PyTorch дали разные результаты, хотя `x` не изменился. Какое объяснение согласуется с моделью состояния PyTorch?
  explanation: Параметры и другое состояние могут храниться внутри `nn.Module` и сохраняться между вызовами. Поэтому строка `model(x)` не показывает все значения, способные повлиять на вычисление.
  kind: choice
  options:
    - Между вызовами могли измениться параметры или другое внутреннее состояние объекта `model`
    - Любой вызов `nn.Module` обязан возвращать случайный результат
    - Аргумент `x` автоматически меняется после каждого прямого прохода
    - PyTorch не позволяет повторно вызывать один объект модели
