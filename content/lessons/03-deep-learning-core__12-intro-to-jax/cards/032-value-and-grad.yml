- concept: обёртка над преобразованием JAX должна передавать произвольные позиционные аргументы исходной функции
  question: Заполни пропуск так, чтобы обёртка работала с функциями, принимающими произвольное количество позиционных аргументов.
  explanation: Распаковка *args передаёт преобразованной функции все позиционные аргументы без изменения их порядка. Поэтому одна обёртка подходит и для функции одного аргумента, и для loss_fn(params, x, y).
  kind: cloze
  template: |-
    def value_and_grad(fn):
        transformed = jax.value_and_grad(fn)
        def wrapped(*args):
            return transformed(___)
        return wrapped
  answer: '*args'
  accept:
    - '*(args)'
