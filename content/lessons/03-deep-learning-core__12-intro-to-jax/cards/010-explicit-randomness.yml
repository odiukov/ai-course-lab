- concept: результат случайной операции JAX однозначно определяется PRNG-ключом и её явными аргументами
  question: Два вызова jax.random.normal получают один и тот же PRNG-ключ и одинаковую форму массива. Как соотносятся результаты?
  explanation: В JAX ключ не изменяется автоматически. Одинаковые ключ, операция и форма дают одинаковый результат независимо от истории вызовов.
  kind: choice
  options:
    - Вызовы вернут одинаковые массивы
    - Второй вызов продолжит последовательность первого
    - Результат будет зависеть от ранее выполненных случайных операций
    - После компиляции результаты обязательно станут различаться
  correct: 0
  id: 010-explicit-randomness-1
  fingerprint: eddbecf9
- concept: для разных случайных операций исходный PRNG-ключ разделяют на отдельные подключи
  question: Расположи действия в правильном порядке для случайной инициализации параметров нескольких слоёв в JAX.
  explanation: Сначала создают исходный ключ, затем получают из него подключи и распределяют их между операциями. Повторное использование одного ключа воспроизвело бы одну и ту же псевдослучайную последовательность.
  kind: order
  items:
    - Создать исходный PRNG-ключ из начального значения
    - Разделить исходный ключ с помощью jax.random.split
    - Передать разным случайным операциям разные полученные подключи
  id: 010-explicit-randomness-2
  fingerprint: d8deb424
- concept: явный PRNG-ключ устраняет зависимость случайных результатов от скрытого состояния и порядка предыдущих вызовов
  question: Почему явная передача PRNG-ключей упрощает воспроизводимость вычислений JAX при компиляции, параллельном выполнении и работе на разных устройствах?
  explanation: При глобальном генераторе результат зависит от накопленного внутреннего состояния. Явные ключи делают эту зависимость частью входов функции, поэтому вычисление можно воспроизвести при преобразованиях и переносе между устройствами.
  kind: open
  reference: Случайный результат зависит только от явно переданного ключа и остальных аргументов, а не от скрытого глобального генератора или порядка предыдущих вызовов. Поэтому перестановка и распределение вычислений не меняют соответствие между входами и результатами.
  id: 010-explicit-randomness-3
  fingerprint: 1eca1d0f
