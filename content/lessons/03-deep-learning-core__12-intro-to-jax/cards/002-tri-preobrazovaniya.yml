  question: Объясни своими словами, что меняется при применении jax.jit к функции и почему это полезно при многократных вызовах.
  explanation: 'jit меняет способ выполнения функции, а не её математический смысл: вычисление трассируется, компилируется и затем эффективно переиспользуется для совместимых входов.'
  kind: open
