- concept: без нелинейных активаций последовательность линейных слоёв сводится к одному аффинному преобразованию
  question: Что произойдёт с MLP, если между всеми линейными слоями заменить ReLU тождественным преобразованием?
  explanation: Композиция преобразований вида «умножение на матрицу плюс смещение» сама является аффинным преобразованием. ReLU нарушает эту сворачиваемость и позволяет сети описывать нелинейные зависимости.
  kind: choice
  options:
    - Всю сеть можно будет представить одним аффинным преобразованием
    - Выход сети автоматически станет распределением вероятностей
    - Все смещения перестанут влиять на результат
    - Градиенты по весам станут неопределёнными
  correct: 0
  id: 054-mlp-forward-1
  fingerprint: 317bc542
- concept: выходной слой классификатора возвращает неограниченные логиты, а не готовые вероятности
  question: Почему после последнего линейного слоя классификатора обычно не применяют ReLU перед кросс-энтропией?
  explanation: Логиты — произвольные вещественные оценки классов, а не вероятности. Функция log_softmax сама преобразует их в логарифмы нормированных вероятностей; ReLU перед ней без необходимости отбросила бы отрицательные оценки.
  kind: choice
  options:
    - Кросс-энтропия принимает сырые логиты, которые могут быть отрицательными
    - Последний слой не содержит обучаемых параметров
    - ReLU можно применять только к входным данным
    - Логиты уже нормированы и всегда лежат между нулём и единицей
  correct: 0
  id: 054-mlp-forward-2
  fingerprint: bcf237c8
- concept: one-hot цель выбирает логарифм вероятности правильного класса в формуле кросс-энтропии
  question: Объясни своими словами, как умножение log_softmax от логитов на one-hot вектор цели выделяет слагаемое для правильного класса.
  explanation: Нулевые компоненты one-hot обнуляют значения остальных классов. Среднее со знаком минус затем агрегирует отрицательные логарифмы вероятностей правильных классов по батчу.
  kind: open
  reference: В one-hot векторе только позиция правильного класса содержит единицу, а остальные позиции содержат нули. Поэтому после поэлементного умножения и суммирования остаётся только логарифм вероятности правильного класса; смена знака превращает его в кросс-энтропийную потерю.
  id: 054-mlp-forward-3
  fingerprint: 70f0959e
