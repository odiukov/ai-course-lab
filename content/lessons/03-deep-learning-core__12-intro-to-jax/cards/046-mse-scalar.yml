- concept: MSE агрегирует ошибки по отдельным примерам в один скалярный loss
  question: Расположи операции вычисления MSE в правильном порядке.
  explanation: MSE вычисляется как среднее квадратов разностей между предсказаниями и правильными ответами. Усреднение превращает набор ошибок в один скалярный loss, пригодный для дифференцирования.
  kind: order
  items:
    - Вычесть правильные ответы из предсказаний
    - Возвести полученные отклонения в квадрат
    - Усреднить квадраты по примерам
