- concept: большая норма градиента отдельного примера указывает на высокую чувствительность его loss к параметрам модели
  question: Что можно узнать, изучая примеры с самыми большими нормами индивидуальных градиентов, и почему это не доказывает автоматически, что их разметка ошибочна?
  explanation: Норма индивидуального градиента измеряет локальную чувствительность loss примера к параметрам. Это полезный сигнал для поиска сложных, редких или подозрительных данных, но не самостоятельный критерий неправильной разметки.
  kind: open
  reference: 'Такие примеры сильнее остальных изменили бы параметры при отдельном шаге обучения: модель может быть в них неуверена, сильно ошибаться или встречать нетипичный вход. Среди них действительно могут оказаться ошибки разметки, но большая норма также возникает у корректных сложных или редких примеров, поэтому требуется содержательная проверка данных.'
  id: 059-transfer-2
