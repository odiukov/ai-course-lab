- concept: jax.numpy применяет правила broadcasting NumPy
  question: Пусть x — одномерный массив JAX, а s — скаляр. Что произойдёт при вычислении x + s?
  explanation: По правилам broadcasting скаляр согласуется с формой массива и участвует в операции с каждым его элементом. jax.numpy следует тем же правилам, что и NumPy.
  kind: choice
  options:
    - Скаляр прибавится только к первому элементу
    - Скаляр автоматически прибавится к каждому элементу
    - Операция завершится ошибкой из-за разных форм
