- concept: стоимость первого JIT-вызова измеряют отдельно от времени выполнения после прогрева
  question: Как корректно разделить накладные расходы JIT-компиляции и скорость готовой программы при измерении шага обучения в JAX?
  explanation: Первый JIT-вызов включает подготовку и компиляцию программы, поэтому его время не характеризует обычное выполнение. После прогрева скомпилированный вариант уже находится в кэше, и среднее по серии вызовов показывает установившуюся скорость.
  kind: choice
  options:
    - Отдельно измерить первый синхронизированный вызов, затем после прогрева усреднить время серии синхронизированных вызовов
    - Сравнить только первый вызов JIT-функции с первым вызовом обычной функции
    - Измерить серию вызовов вместе с первым, не выделяя компиляцию
    - Измерить самый быстрый вызов и считать его временем компиляции
  correct: 0
  id: 057-performance-1
  fingerprint: e4f1086f
- concept: block_until_ready заставляет таймер учитывать фактическое завершение вычислений на устройстве
  question: Вставьте строку, которая перед остановкой таймера дождётся завершения асинхронного вычисления результата на ускорителе.
  explanation: JAX может вернуть управление Python сразу после отправки операции на ускоритель. block_until_ready дожидается готовности результата, поэтому измеряется выполнение вычислений, а не только постановка команд в очередь. Синхронизацию нужно одинаково применять к вариантам с JIT и без него.
  kind: cloze
  template: |-
    loss = train_step(params, batch)
    ___
  answer: loss.block_until_ready()
  accept:
    - jax.block_until_ready(loss)
  id: 057-performance-2
  fingerprint: 2f48f2f1
