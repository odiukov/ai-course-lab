- concept: JAX возвращает вычисленный градиент явно и не записывает его в массив аргумента
  question: Объясните своими словами, где окажется градиент после вызова `g = jax.grad(loss)(params)` и изменится ли при этом `params`.
  explanation: В JAX градиент является обычным результатом вызова функции. Он не накапливается внутри массива параметров, поэтому отдельный вызов `.backward()` и чтение `.grad` не нужны.
  kind: open
  reference: Градиент будет возвращён как значение `g`. Массив `params` не изменится и не получит скрытого поля с градиентом.
  id: 021-function-gradient-2
  fingerprint: 28a36c03
