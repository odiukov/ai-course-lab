- concept: 'порядок обработки JIT-функции при первом вызове: трассировка, компиляция XLA, выполнение'
  question: Расположите этапы первого вызова функции через jax.jit в правильном порядке.
  explanation: Сначала JAX строит представление вычисления с помощью трассировки. Затем XLA оптимизирует и компилирует его, после чего готовый код исполняется на выбранном устройстве.
  kind: order
  items:
    - JAX трассирует Python-функцию и записывает создаваемые ею операции
    - XLA оптимизирует записанное вычисление и компилирует его для целевого устройства
    - Устройство выполняет скомпилированный машинный код
  id: 026-jit-tracing-1
  fingerprint: f7637f54
- concept: трассировка JAX использует абстрактные значения с известными формой и типом, но без конкретных данных
  question: Что обычно известно JAX о трассируемом аргументе во время построения вычисления?
  explanation: 'Трассировщик представляет аргумент абстрактно: JAX знает его форму и dtype и записывает операции над ним. Конкретные значения в этот момент недоступны Python, поэтому обычное ветвление по значению трассируемого массива невозможно.'
  kind: choice
  options:
    - Только имя переменной в исходном коде
    - Форма и тип данных, но не конкретные значения элементов
    - Все конкретные значения элементов и результат функции
    - Только устройство, на котором запущен Python
  correct: 1
  id: 026-jit-tracing-2
  fingerprint: 16b2d654
