- concept: pytree позволяет хранить разноразмерные параметры слоёв как отдельные листья
  question: Почему матрицы весов и векторы смещений разных слоёв MLP обычно нельзя просто сложить в один плотный массив без дополнительного выравнивания?
  explanation: У переходов 784–256, 256–128 и 128–10 различаются формы как матриц W, так и векторов b. Список словарей объединяет их структурно, не требуя искусственного дополнения массивов до общей формы.
  kind: open
  reference: Параметры слоёв имеют разные формы, поскольку ширины входа и выхода у преобразований различаются. Обычный плотный массив требует согласованных размеров, а pytree может хранить такие массивы отдельными листьями, сохраняя структуру модели.
