- concept: число различимых кодов целочисленного формата равно двойке в степени его битности
  question: Целочисленный формат шириной 6 бит. Сколько различных значений он способен закодировать?
  explanation: 'Каждый бит удваивает число комбинаций: 2^6 = 64. По той же логике INT8 даёт 256 уровней, а INT4 — всего 16, и именно поэтому у INT4 так критичен выбор масштаба.'
  kind: numeric
  answer: 64
  tolerance: 0.5
  id: 005-format-layout-1
  fingerprint: fc0ff853
- concept: целочисленным форматам нужен внешний масштабный множитель, потому что у них нет экспоненты
  question: Веса слоя лежат примерно в пределах ±0,3, а целочисленный формат кодирует только равномерные целые уровни. Что нужно хранить дополнительно, чтобы восстановить вещественные значения?
  explanation: У INT-форматов нет поля экспоненты, масштаб вынесен наружу — один scale на группу весов. Качество INT4 почти целиком определяется тем, как выбран этот масштаб.
  kind: choice
  options:
    - Масштабный множитель, который говорит, сколько вещественных единиц стоит один уровень
    - Дополнительный бит знака для каждого веса
    - Копию весов в исходном формате
    - Отдельную экспоненту внутри каждого целого кода
  correct: 0
  id: 005-format-layout-2
  fingerprint: 01e0f893
- concept: сетка значений INT равномерна, у форматов с плавающей точкой шаг растёт с модулем числа
  question: Чем сетка представимых значений целочисленного формата отличается от сетки формата с плавающей точкой?
  explanation: INT даёт равномерные ступени (INT8 — 256 равных шагов между -128 и 127). У FP экспонента двигает масштаб, поэтому вблизи нуля значения густые, а на больших модулях редкие — что как раз удобно для весов, жмущихся к нулю.
  kind: choice
  options:
    - У целочисленного шаг одинаков по всему диапазону, у плавающего шаг растёт вместе с модулем числа
    - У целочисленного шаг растёт вместе с модулем числа, у плавающего он постоянен
    - Обе сетки равномерны, различается только ширина формата
    - Обе сетки неравномерны, различается только знаковый бит
  correct: 0
  id: 005-format-layout-3
