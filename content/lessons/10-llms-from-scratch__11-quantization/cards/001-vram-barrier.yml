- concept: веса читаются заново на каждый токен, поэтому должны лежать в быстрой памяти ускорителя
  question: Почему нельзя держать основную часть весов модели на SSD и подгружать их по мере надобности во время генерации?
  explanation: Каждый шаг генерации прогоняет активации через все слои, то есть трогает все веса. Подкачка с диска превращает шаг генерации в ожидание ввода-вывода, поэтому веса должны быть резидентны в VRAM.
  kind: choice
  options:
    - Полный набор весов нужен для каждого нового токена, а пропускная способность диска на порядки ниже, чем у VRAM
    - Веса на диске хранятся в другом числовом формате и требуют переобучения
    - Операционная система запрещает читать файл модели больше одного раза
    - Веса меняются во время генерации, поэтому их нельзя держать в файле
  correct: 0
  id: 001-vram-barrier-1
  fingerprint: ab215101
- concept: бюджет VRAM = веса плюс активации и KV-кэш, поэтому веса не могут занимать всю карту
  question: Веса модели занимают 45 ГБ, карта имеет 48 ГБ VRAM. Модель загружается, но на длинном запросе падает с ошибкой нехватки памяти. Наиболее вероятная причина?
  explanation: Веса — только базовая статья расхода. Промежуточные тензоры и кэш ключей/значений масштабируются с длиной контекста и числом параллельных запросов, поэтому оставлять под них 3 ГБ запаса мало.
  kind: choice
  options:
    - Активации и KV-кэш растут с длиной контекста и требуют памяти сверх весов
    - Веса при инференсе распаковываются в удвоенный размер
    - Длинный запрос увеличивает число параметров модели
    - Драйвер резервирует ровно половину VRAM под системные нужды
  correct: 0
  id: 001-vram-barrier-2
  fingerprint: 97c5b1e1
- concept: 'способы обойти нехватку VRAM: уменьшить веса, добавить карту, выгрузить слои — но не менять параметры запроса'
  question: Модель на 34 миллиарда параметров не помещается в одну карту с 24 ГБ VRAM. Какой шаг НЕ решает эту проблему?
  explanation: Длина контекста влияет только на память под KV-кэш и лишь усугубляет дефицит. Барьер создаёт размер весов, поэтому решения — снизить битность, добавить устройство или отдать часть слоёв медленной памяти.
  kind: choice
  options:
    - Увеличить лимит длины контекста в конфигурации сервера
    - Загрузить квантизованную версию весов с меньшей битностью
    - Разложить слои по двум картам
    - Выгрузить часть слоёв в системную RAM ценой скорости
  correct: 0
  id: 001-vram-barrier-3
