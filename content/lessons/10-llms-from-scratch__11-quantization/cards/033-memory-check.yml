- concept: хранимые масштабы добавляют к каждому весу дробную долю бита, поэтому эффективная битность выше номинальной
  question: Веса квантованы группами по 32 значения, и на каждую группу хранится один масштаб в FP16 (16 бит). Сколько дополнительных бит на один вес дают эти масштабы?
  explanation: '16 бит на группу делятся между 32 весами: 16 / 32 = 0.5 бита на вес. Именно поэтому «4-битная» модель на диске занимает заметно больше, чем 4 бита × число параметров: масштабы тоже надо хранить.'
  kind: numeric
  answer: 0.5
  tolerance: 0.01
  id: 033-memory-check-1
  fingerprint: bd06b62a
- concept: квантизация весов не уменьшает KV-кэш — это отдельный тензор со своим форматом хранения
  question: Инженер перевёл веса модели из FP16 в низкобитный целочисленный формат, но при длинном контексте всё равно упирается в память. KV-кэш остался в FP16. Что верно?
  explanation: Квантизация применяется к тем тензорам, к которым её применили. KV-кэш — отдельные тензоры ключей и значений, они живут в своём формате. При длинном контексте именно кэш становится доминирующей статьёй расхода, и уменьшают его отдельным приёмом — квантизацией кэша.
  kind: choice
  options:
    - Битность весов автоматически применяется и к KV-кэшу, значит проблема не в кэше
    - KV-кэш хранится отдельно и своим форматом, поэтому его объём не изменился; чтобы сократить его, квантуют сам кэш
    - KV-кэш всегда меньше весов, поэтому его вклад можно не учитывать
    - После квантизации весов KV-кэш перестаёт создаваться
  correct: 1
