- concept: квантованный код получается делением значения на масштаб и округлением до ближайшего целого
  question: Масштаб квантизации равен 0.0032, вес равен 0.5. Какое целое число будет сохранено?
  explanation: 0.5 / 0.0032 = 156.25, округление до ближайшего целого даёт 156. Обратно вес развернётся как 156 × 0.0032 = 0.4992 — разница появилась ровно в момент округления.
  kind: numeric
  answer: 156
  tolerance: 0.5
  id: 010-quant-pipeline-1
  fingerprint: 0dcf1e21
- concept: ошибка квантизации одного значения не превышает половины шага сетки
  question: Шаг равномерной квантизационной сетки равен 0.04. Насколько сильно может промахнуться одно значение при округлении к ближайшей ступени?
  explanation: 'Любое значение округляется к ближайшей ступени, значит промах не больше половины шага: 0.04 / 2 = 0.02. Отсюда правило: чем мельче scale, тем меньше ошибка округления — но тем уже покрываемый диапазон.'
  kind: numeric
  answer: 0.02
  tolerance: 0.001
  id: 010-quant-pipeline-2
  fingerprint: 9adc5641
- concept: целый код — это номер ступени, и без сохранённого масштаба он не переводится обратно в вещественное значение
  question: Слой сохранили как целочисленные коды, но файл с масштабами потерялся. Что можно сделать с такими весами?
  explanation: 'Деквантизация — это умножение кода на масштаб. Масштаб хранится рядом с кодами и является частью представления: без него ступени не привязаны ни к какой вещественной величине.'
  kind: choice
  options:
    - 'Ничего осмысленного: код — это номер ступени, а не значение веса'
    - Использовать коды напрямую как веса, они близки к исходным
    - Восстановить веса, поделив коды на их собственный максимум
