- concept: диагностический вывод даёт совпадение признаков у одного и того же канала, а не сравнение двух независимых сводок
  question: Есть распределение поканальных scales и распределение поканальных ошибок восстановления. Как из них получить список подозрительных каналов?
  explanation: 'Две сводные характеристики по всему тензору ничего не говорят о конкретном канале. Диагноз ставится по совпадению признаков у одной и той же единицы: канал с одновременно широким диапазоном и крупной ошибкой — вероятный носитель выброса.'
  kind: choice
  options:
    - Связать оба показателя по номеру канала и искать каналы, попавшие в хвосты одновременно
    - Сравнить средний scale со средней ошибкой
    - Взять каналы с наибольшим scale — это и есть ответ
    - Сравнить формы обеих гистограмм между собой
  correct: 0
  id: 058-diagnostics-1
  fingerprint: 04aeaf3d
- concept: канал с обычным scale тоже может попасть в хвост ошибок — причина не в ширине диапазона
  question: Канал имеет ничем не выделяющийся scale, но по ошибке восстановления попал в верхний хвост. Что это вероятнее всего означает?
  explanation: Широкий диапазон — лишь одна из причин крупной ошибки. При нормальном шаге сетки ошибка всё равно велика, если значения систематически попадают в середину между уровнями. Поэтому scale — сигнал, а не приговор, и наоборот.
  kind: choice
  options:
    - Многие его значения лежат между доступными уровнями сетки, либо канал особо чувствителен — дело не в широком диапазоне
    - В канале обязательно есть выброс, просто его не нашли
    - 'Ошибка посчитана неверно: при обычном scale она не может быть большой'
    - Канал следует исключить из модели
  correct: 0
  id: 058-diagnostics-2
  fingerprint: 404428d6
