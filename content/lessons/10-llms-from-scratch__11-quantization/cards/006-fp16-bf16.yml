  fingerprint: 4eba1d16
- concept: для обучения широкий диапазон важнее точности, потому что переполнение и обнуление теряют значение целиком
  question: Почему для обучения сетей обычно предпочитают формат с широким диапазоном, а не формат той же ширины с более точной мантиссой?
  explanation: 'Отсюда и BF16 как дефолт обучения: он держит диапазон FP32 при 16 битах, платя точностью. Градиент 10^-20 в FP16 схлопнется в ноль, в BF16 выживет.'
  kind: open
  reference: Градиенты и активации при обучении разбросаны на много порядков и могут выстреливать. Узкая экспонента даёт переполнение на больших значениях и обнуление крошечных градиентов — значение теряется целиком, обучение ломается. Грубое округление веса (например, 0.07342 до 0.0734) на результат почти не влияет. Поэтому сетям диапазон важнее точности.
  id: 006-fp16-bf16-2
  fingerprint: 02705f30
- concept: loss scaling компенсирует узкий диапазон формата, поднимая градиенты в представимую область
  question: Зачем при обучении в формате с короткой экспонентой применяют масштабирование лосса (loss scaling)?
  explanation: Лосс умножают на большой множитель, градиенты пропорционально растут и перестают утекать в ноль; после обратного прохода масштаб снимают. Формату с широкой экспонентой этот костыль не нужен.
  kind: choice
  options:
    - Чтобы мелкие градиенты попали в представимый диапазон и не обнулились
    - Чтобы уменьшить объём памяти под веса
    - Чтобы ускорить матричное умножение на тензорных ядрах
    - Чтобы увеличить число битов мантиссы во время обратного прохода
  correct: 0
  id: 006-fp16-bf16-3
  fingerprint: b6472e1f
