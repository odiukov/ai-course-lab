  question: 'Поканальная квантизация: заполни аргумент, без которого форма максимумов потеряет свёрнутое измерение и деление тензора на масштабы пойдёт не по каналам.'
  explanation: Без keepdims=True максимумы схлопываются в плоский вектор, и правило выравнивания форм приложит его не к тому измерению. С keepdims сохраняется измерение длины один, ровно на месте свёрнутой оси, и каждый элемент делится на масштаб своего канала.
