- concept: битность задаёт единые границы кодов для всех каналов; поканальным является только масштаб
  question: Поканальная симметричная квантизация с num_bits=5. Что различается у разных каналов, а что общее для всей матрицы?
  explanation: 'qmin и qmax зависят только от num_bits: −(2^4) = −16 и 2^4 − 1 = 15. Все каналы хранятся в одном целочисленном типе одной ширины, иначе матрицу нельзя было бы упаковать. Поканальность живёт целиком в масштабах.'
  kind: choice
  options:
    - Границы кодов общие (от −16 до 15), у каналов различаются только масштабы
    - Границы кодов подбираются каналу по его размаху, а масштаб общий
    - И границы кодов, и масштабы вычисляются отдельно для каждого канала
    - Границы кодов зависят от числа каналов, а не от битности
