- concept: 'zero point вычисляется как округлённый код нижней границы диапазона: qmin минус t_min, делённое на масштаб'
  question: Дополни вычисление zero point в асимметричной квантизации.
  explanation: Нужно узнать, в какой код попадёт вещественный ноль. Нижняя граница t_min отображается в qmin, а ноль отстоит от t_min на −t_min/scale ступенек, отсюда qmin − t_min/scale. Округление даёт целое смещение.
  kind: cloze
  template: |-
    scale = (t_max - t_min) / (qmax - qmin)
    zero_point = int(np.round(qmin - t_min / ___))
  answer: scale
  accept:
    - scale
    - s
  id: 017-code-quantize-asymmetric-1
  fingerprint: 22845a33
- concept: у асимметричной схемы вырожден тензор с нулевой шириной диапазона, а не только нулевой тензор
  question: Для какого тензора расчёт scale в асимметричной квантизации приведёт к делению на ноль?
  explanation: Асимметричный scale строится на ширине диапазона t_max − t_min. У постоянного тензора она равна нулю, каким бы ни был сам уровень, и деление на ноль ломает расчёт. Поэтому вырожденную ветку проверяют до вычисления scale и возвращают нулевые коды с безопасными параметрами.
  kind: choice
  options:
    - Для тензора [4.0, 4.0, 4.0, 4.0]
    - Для тензора со всеми отрицательными значениями
    - Для тензора, где максимум по модулю очень мал
  correct: 0
  id: 017-code-quantize-asymmetric-2
  fingerprint: 9954bb11
- concept: zero point обрезают границами кодов, потому что вещественный ноль может лежать вне диапазона данных
  question: Зачем вычисленный zero point дополнительно ограничивают отрезком [qmin, qmax]?
  explanation: Если все значения тензора, скажем, положительны, вещественный ноль лежит левее t_min, и формула вернёт код меньше qmin. Такое смещение нельзя сохранить в целочисленном формате, поэтому zero point прижимают к ближайшей границе.
  kind: choice
  options:
    - Потому что при диапазоне, не включающем ноль, формула даст код за пределами целочисленной шкалы
    - Потому что округление всегда завышает zero point на единицу
    - Потому что иначе scale получится отрицательным
  correct: 0
  id: 017-code-quantize-asymmetric-3
  fingerprint: d2c7e27b
