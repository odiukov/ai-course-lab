- concept: 'порядок операций в коде симметричной квантизации: обрезка идёт после округления, приведение к целому типу — в самом конце'
  question: Расставь шаги функции симметричной квантизации в порядке выполнения.
  explanation: Округление даёт вещественные числа, которые могут выскочить за границы, поэтому clip обязательно идёт после round. Каст в целые — последним, когда значения уже гарантированно внутри допустимого диапазона.
  kind: order
  items:
    - Вычислить нижнюю и верхнюю границы кодов по числу бит
    - Найти наибольший модуль среди всех элементов тензора
    - Поделить наибольший модуль на верхнюю границу и получить масштаб
    - Поделить элементы тензора на масштаб и округлить
    - Обрезать округлённые значения по границам кодов
    - Привести результат к целочисленному типу
  id: 012-code-quantize-symmetric-1
  fingerprint: 79895ae3
- concept: нулевой тензор требует отдельной ветки, потому что масштаб обратился бы в ноль и деление стало невалидным
  question: Функция симметричной квантизации получает тензор, целиком состоящий из нулей. Зачем для этого случая нужна отдельная ранняя ветка?
  explanation: 'Масштаб считается как максимум модуля, делённый на верхнюю границу: у нулевого тензора он равен нулю. Поэтому такой случай перехватывают заранее и возвращают нулевые коды с нейтральным ненулевым масштабом — нули так и остаются нулями.'
  kind: choice
  options:
    - Масштаб получился бы нулевым, и деление тензора на него дало бы NaN или бесконечность
    - Округление вернуло бы дробные значения вместо целых
    - Форма выходного массива не совпала бы с формой входного
  correct: 0
  id: 012-code-quantize-symmetric-2
  fingerprint: d12aab1d
- concept: скалярный масштаб на выходе означает per-tensor гранулярность, а не поканальную
  question: Функция квантизации возвращает масштаб одним числом, а не массивом чисел. Что это говорит о гранулярности квантизации?
  explanation: 'Скалярный масштаб — признак per-tensor режима: вся матрица делит одну лестницу. При per-channel максимум модуля берут вдоль оси, и на выходе получается вектор масштабов длиной в число каналов.'
  kind: choice
  options:
    - Один общий множитель на весь тензор (per-tensor)
    - По одному множителю на каждый выходной канал (per-channel)
    - По одному множителю на каждую группу из нескольких весов
  correct: 0
  id: 012-code-quantize-symmetric-3
  fingerprint: 466b66b6
