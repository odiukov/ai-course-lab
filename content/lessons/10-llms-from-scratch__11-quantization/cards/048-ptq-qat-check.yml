- concept: 'QAT сдвигает границу применимости низкой битности, но не отменяет её: на предельно грубой сетке метод годится лишь для части задач'
  question: Команда планирует уйти на предельно низкую битность и рассчитывает, что QAT вернёт качество к уровню исходной модели. Насколько это обоснованно?
  explanation: Чем ниже битность, тем больше выигрыш QAT над процедурой после обучения — но выигрыш конечен. Число различимых уровней падает экспоненциально, и никакое обучение не вернёт различий, которые сетка физически не может представить. Поэтому пригодность решают замеры на целевой задаче.
  kind: choice
  options:
    - 'Обоснованно: QAT полностью компенсирует любую битность'
    - 'Не вполне: QAT заметно улучшает результат на грубой сетке, но на самых низких битностях годится лишь для части задач, и качество нужно проверять на своей'
    - 'Не обоснованно: на низкой битности QAT работает хуже, чем обычная калибровка'
    - Обоснованно, если увеличить калибровочную выборку
  correct: 1
