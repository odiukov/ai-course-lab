  fingerprint: ac3ae2d4
- concept: бит знака кодирует направление отдельно от величины числа
  question: Зачем формату отдельный бит знака, если экспонента и мантисса уже описывают величину числа?
  explanation: 'Один бит на знак — фиксированная плата в любом формате: FP32, FP16, BF16, FP8. Остальные биты и делятся между диапазоном и точностью.'
  kind: open
  reference: 'Экспонента и мантисса кодируют только модуль: масштаб и значащие цифры. Знак отрицательного числа никак не выражается через них, поэтому направление хранится отдельным битом. Из-за этого положительное и отрицательное значение одной величины хранятся с одинаковой точностью, а на кодирование знака всегда уходит ровно один бит независимо от ширины формата.'
  id: 004-float-parts-3
  fingerprint: 3e403625
