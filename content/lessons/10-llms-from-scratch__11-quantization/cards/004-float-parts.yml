- concept: экспонента кодирует масштаб числа, отдельно от его значащих цифр
  question: 'Заполни пропуск: какое поле отвечает за масштаб числа с плавающей точкой?'
  explanation: 'Разделение обязанностей и даёт «плавающую точку»: экспонента двигает масштаб, мантисса описывает значение внутри него. Поэтому FP32 покрывает примерно от 10^-38 до 10^38, а FP16 упирается в ~65 504.'
  kind: cloze
  template: Знак задаёт направление от нуля, ___ задаёт масштаб числа, а мантисса — его значащие цифры.
  answer: экспонента
  accept:
