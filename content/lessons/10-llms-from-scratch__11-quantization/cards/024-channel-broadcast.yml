- concept: вектор масштабов приводят к форме с единицей по тому измерению, вдоль которого его повторяют
  question: Матрица кодов имеет форму 4 × 7, каналами считаются столбцы. Какую форму нужно придать вектору масштабов перед поэлементным умножением?
  explanation: Масштабов семь — по одному на столбец. Форма (1, 7) кладёт их вдоль строки и позволяет повторить сверху вниз по четырём строкам. Форма (7, 1) означала бы семь каналов-строк и с матрицей 4 × 7 просто не совместится.
  kind: choice
  options:
    - (1, 7)
    - (7, 1)
    - (4, 1)
    - (4, 7)
  correct: 0
  id: 024-channel-broadcast-1
  fingerprint: 04f04156
- concept: одномерный массив при broadcasting выравнивается по последнему измерению, поэтому форму масштабов задают явно
  question: Почему масштабы каналов-строк не оставляют одномерным массивом формы (n,), а явно превращают в столбец (n, 1)?
  explanation: 'NumPy дописывает недостающие измерения слева, то есть (n,) читается как (1, n) и растягивается по строкам. Для каналов-строк это неверная привязка: масштабы разъедутся по столбцам. У квадратной матрицы формы совпадут и ошибка пройдёт молча, поэтому намерение фиксируют явной формой (n, 1) или (1, n).'
  kind: choice
  options:
    - Одномерный массив выравнивается по последнему измерению, поэтому был бы применён к столбцам — либо упал бы по несовместимости форм
    - Одномерные массивы вообще не участвуют в broadcasting
    - Столбец занимает меньше памяти, чем одномерный массив той же длины
    - Явная форма нужна только для целочисленных массивов, для вещественных достаточно (n,)
  correct: 0
  id: 024-channel-broadcast-2
  fingerprint: 12d16782
- concept: broadcasting выполняет поэлементную операцию без материализации расширенного массива
  question: Что происходит в памяти, когда вектор масштабов формы (n, 1) умножается на матрицу кодов формы (n, m)?
  explanation: 'Broadcasting — это правило доступа, а не копирование: элемент масштаба читается многократно при обходе строки. Поэтому поканальная схема стоит ровно n дополнительных чисел, а не целой второй матрицы, и ручное размножение масштабов через повторение только тратило бы память.'
  kind: choice
  options:
    - 'Расширенная копия масштабов не создаётся: значения переиспользуются при поэлементном обходе'
    - Сначала строится полная матрица масштабов формы (n, m), затем выполняется умножение
    - Матрица кодов копируется n раз, по разу на каждый масштаб
    - Масштабы записываются поверх части матрицы кодов, поэтому исходные коды теряются
  correct: 0
