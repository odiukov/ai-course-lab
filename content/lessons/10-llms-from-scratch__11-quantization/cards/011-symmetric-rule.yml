- concept: масштаб симметричной квантизации равен максимуму модуля тензора, делённому на верхнюю границу кодов
  question: Тензор квантизуют симметрично в 6-битный целочисленный формат. Наибольший модуль в тензоре равен 6.2. Чему равен масштаб?
  explanation: Для 6 бит q_max = 2^5 − 1 = 31. Масштаб = 6.2 / 31 = 0.2, то есть крайнее по модулю значение садится ровно на код 31.
  kind: numeric
  answer: 0.2
  tolerance: 0.005
  id: 011-symmetric-rule-1
  fingerprint: 7e780265
- concept: после округления код обрезают по границам формата, а не расширяют тип и не пересчитывают тензор
  question: После деления на масштаб и округления получился код на единицу больше верхней границы формата. Что делает симметричная квантизация?
  explanation: 'Clipping гарантирует, что ни один код не выйдет за допустимые границы формата: значение упирается в край шкалы. Иначе на границе появился бы код, который формат не умеет хранить.'
  kind: choice
  options:
    - Обрезает код до верхней границы формата
    - Пересчитывает масштаб заново по всему тензору
    - Сохраняет код как есть, расширив целочисленный тип
  correct: 0
  id: 011-symmetric-rule-2
  fingerprint: '86689299'
- concept: симметричная шкала делит на положительную границу, оставляя крайний отрицательный код неиспользованным
  question: У целочисленного формата отрицательная граница по модулю на единицу больше положительной. Почему симметричная квантизация всё равно делит максимум модуля на положительную границу?
  explanation: У INT8 коды идут от −128 до 127. Деление на 127 держит шаг одинаковым по обе стороны нуля, а лишний код −128 остаётся запасным. Разные делители для двух сторон дали бы уже не симметричную равномерную сетку.
  kind: choice
  options:
    - Иначе положительная и отрицательная стороны получили бы разный шаг, и шкала перестала быть одной равномерной
    - Иначе крайнее отрицательное значение не удалось бы закодировать
    - Иначе ноль не получил бы собственного кода
  correct: 0
