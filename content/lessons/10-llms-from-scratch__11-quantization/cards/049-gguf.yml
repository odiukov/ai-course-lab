- concept: самодостаточный контейнер везёт веса, токенизатор и метаданные архитектуры в одном файле
  question: Чем самодостаточный контейнер модели отличается от привычной раскладки «папка с весами + конфиг + файлы токенизатора»?
  explanation: 'Самодостаточность — свойство упаковки: один файл несёт и веса, и словарь токенизатора, и параметры архитектуры с прочими метаданными. Это удобно для распространения и локального запуска, но к качеству квантизации отношения не имеет.'
  kind: choice
  options:
    - Он хранит веса, токенизатор и метаданные архитектуры в одном файле, поэтому для запуска не нужны сопутствующие файлы
    - Он хранит только веса, а токенизатор всегда скачивается с сервера при первом запуске
    - Он запрещает смешивать разную точность между тензорами, поэтому конфиг не нужен
    - Он хранит веса в исходной точности и потому не требует конфигурации
  correct: 0
