- concept: в контейнере со смешанной упаковкой крайние тензоры (эмбеддинги и выходная голова) обычно хранятся точнее средних слоёв
  question: В низкобитной сборке модели заявлено «в среднем около трёх бит на вес», но эмбеддинги и выходная проекция хранятся шире. Объясни, почему упаковщик так делает и почему средняя битность при этом остаётся честной характеристикой файла.
  explanation: Варианты маркировки внутри одного контейнера различаются не только номинальной битностью, но и правилом распределения точности между тензорами. Отсюда и разные суффиксы у сборок одинаковой «средней» ширины.
  kind: open
  reference: 'Упаковка задаёт битность потензорно, а не одну на весь файл. Эмбеддинги и выходная голова стоят на входе и выходе сети: ошибка в них попадает во все дальнейшие вычисления и напрямую в логиты, поэтому их оставляют в более широком типе. Средним слоям достаётся самая грубая сетка, потому что там ошибка размазывается и частично гасится. Средняя битность — это суммарный объём весов, делённый на число параметров: она корректно описывает размер файла, но ничего не говорит о том, как точность распределена между тензорами. Именно поэтому две сборки с одинаковой средней битностью могут заметно различаться по качеству.'
  id: 049-gguf-3
