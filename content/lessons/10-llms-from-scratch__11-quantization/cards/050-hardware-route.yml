- concept: среда исполнения и её ядра определяют, какой квантизованный артефакт вообще запустится на данном железе
  question: 'У тебя ноутбук на Apple Silicon без дискретной видеокарты. Есть две сборки одной модели одинаковой битности: одна собрана под ядра дискретных GPU, другая — под CPU и Metal. Почему одинаковая битность не делает их взаимозаменяемыми?'
  explanation: 'Файл — это не только числа, но и договорённость об их раскладке: порядок групп, хранение масштабов, формат блоков. Ядра пишутся под конкретную раскладку и конкретный бэкенд. Поэтому выбирают сначала устройство и рантайм, а уже потом битность и файл.'
  kind: choice
  options:
    - Потому что битность на разных устройствах означает разное число уровней сетки
    - Потому что артефакт запускается только там, где рантайм умеет распаковать конкретную схему упаковки и группировки весов и имеет под неё ядра
    - Потому что сборка под GPU всегда содержит меньше параметров
    - Потому что на CPU квантизованные веса нельзя умножать, их обязательно возвращают в исходную точность
  correct: 1
  id: 050-hardware-route-2
  fingerprint: ecea552f
- concept: экономия памяти по битности растёт равномерно, а деградация качества — нет, поэтому нижняя рабочая граница держится на четырёхбитных форматах
  question: Экономия памяти при снижении битности меняется предсказуемо, но переход от четырёхбитных форматов к двухбитным на практике почти не используют для моделей общего назначения. Объясни, что именно ломается.
  explanation: 'Именно эта нелинейность и объясняет, почему массовые сборки останавливаются на четырёхбитных форматах: там потеря измеряется единицами процентов на профильных тестах, а ниже — уже десятками.'
  kind: open
  reference: 'Объём весов линеен по битности, поэтому очередное сокращение ширины даёт понятную кратную экономию. Потеря качества ведёт себя иначе: число представимых уровней падает экспоненциально, и ниже некоторой ширины сетка становится настолько грубой, что различия между весами перестают кодироваться, а ошибки уже не гасятся при суммировании. В итоге экономия растёт вдвое, а деградация — в разы, и размен перестаёт быть выгодным. Двухбитные форматы остаются пригодны для узких задач, где просадку можно стерпеть, а не для моделей общего назначения.'
  id: 050-hardware-route-3
  fingerprint: 1fdb69ec
