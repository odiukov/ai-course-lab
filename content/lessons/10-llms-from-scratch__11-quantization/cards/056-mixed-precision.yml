- concept: 'чувствительность слоя устанавливают измерением: понижают точность по одному слою и смотрят сквозное качество выхода'
  question: Нужно решить, какие слои сети оставить в более высокой точности при смешанной квантизации. Какой способ даёт обоснованный ответ?
  explanation: 'Чувствительность — это измеряемая величина: заметно больший ущерб от понижения точности именно этого слоя. Размер слоя и величина его весов говорят о памяти и о диапазоне, но не о том, как ошибка округления распространится до выхода.'
  kind: choice
  options:
    - По очереди понижать точность одного слоя, остальные оставлять как есть, и каждый раз мерить сквозное качество выхода модели
    - Оставить точнее слои с наибольшим числом параметров
    - Оставить точнее слои с наибольшими по модулю весами
    - Оставить точнее каждый второй слой, чтобы ошибки чередовались
  correct: 0
  id: 056-mixed-precision-1
  fingerprint: a3596788
- concept: экономия смешанной точности определяется долей параметров, оставленных в высокой точности, а не числом таких слоёв
  question: В сети 1000 млн параметров. Из них 100 млн решено хранить по 2 байта на параметр, остальные — по 0.5 байта. Сколько мегабайт займут веса? (1 млн параметров по 1 байту считай за 1 МБ.)
  explanation: 100 × 2 = 200 МБ плюс 900 × 0.5 = 450 МБ, итого 650 МБ. Один крупный слой в высокой точности способен съесть большую часть выигрыша, а несколько мелких почти не влияют на итог — поэтому экономию считают по параметрам, а не по количеству «точных» слоёв.
  kind: numeric
  answer: 650
  tolerance: 5
  id: 056-mixed-precision-2
  fingerprint: 414e3311
- concept: смешанную конфигурацию судят по сравнению сразу с двумя равномерными базовыми вариантами
  question: 'Собрана смешанная конфигурация: часть слоёв точнее, часть грубее. С чем её нужно сравнить, чтобы утверждение «смесь удачна» имело смысл?'
  explanation: 'Смысл смеси в том, что она приближается к верхней крайности по качеству и к нижней по памяти. Без обеих опорных точек нельзя сказать, что дополнительные биты потрачены не зря: сравнение с одной крайностью показывает только половину размена.'
  kind: choice
  options:
    - С равномерно высокоточным вариантом по качеству и с равномерно низкобитным по памяти — обе крайности сразу
    - Только с равномерно низкобитным вариантом
    - Только с исходной моделью без квантизации
    - С любой другой моделью того же семейства
  correct: 0
  id: 056-mixed-precision-3
  fingerprint: 6a776f64
