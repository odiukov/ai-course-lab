- concept: 'обратное преобразование не повторяет шаги квантизации: ни поиска максимума, ни округления, ни обрезки'
  question: Какие операции лишние в функции деквантизации симметрично квантованного тензора?
  explanation: 'Максимум нужен был только чтобы посчитать масштаб, а округление и clamp — чтобы получить корректный целый код. На обратном пути масштаб уже известен, коды уже целые и уже в границах: остаётся умножение.'
