- concept: деквантизация поэлементна и сохраняет форму тензора
  question: На вход деквантизации подали целочисленный тензор формы 16 × 4 и скалярный масштаб. Какой формы будет результат?
  explanation: Скалярный масштаб умножается на каждый элемент по отдельности, форма при этом не меняется. Деквантизация не переставляет оси и не разворачивает тензор в вектор.
  kind: choice
