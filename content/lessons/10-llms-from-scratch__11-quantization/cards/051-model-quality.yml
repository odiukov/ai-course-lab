- concept: величина повреждения от квантизации выражается разностью перплексий базовой и сжатой моделей
  question: Исходная модель даёт перплексию 5.40 на отложенном датасете, квантизованная на том же датасете — 6.05. Чему равна дельта перплексии, по которой оценивают потерю?
  explanation: Дельта = 6.05 − 5.40 = 0.65. По ходовым ориентирам дельта меньше половины пункта считается отличной, до пункта — хорошей, до двух — терпимой для большинства задач, больше двух — сигнал, что квантизация прошла неудачно.
  kind: numeric
  answer: 0.65
  tolerance: 0.01
