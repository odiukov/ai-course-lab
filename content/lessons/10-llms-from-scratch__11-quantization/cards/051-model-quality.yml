- concept: перплексию сравнивают как дельту к оригиналу на одном и том же отложенном датасете и при одинаковой обработке текста, а не по абсолютной величине
  question: 'Коллега сообщает: «У квантизованной сборки перплексия 6.05, это плохо». Какого сведения не хватает, чтобы принять решение?'
