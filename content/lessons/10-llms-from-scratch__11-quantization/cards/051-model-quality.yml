- concept: 'квантизация повреждает способности неравномерно: точные рассуждения и синтаксис страдают сильнее общих знаний, поэтому нужен профильный набор эвалов'
  question: После квантизации бенчмарк общих знаний просел на доли пункта. Почему этого недостаточно, чтобы выпускать сборку в продакшен помощника-программиста?
  explanation: 'Факт можно вытянуть из размазанного по многим весам знания, и мелкие ошибки округления там гасятся. Пошаговая арифметика и генерация синтаксически валидного кода не прощают одного неверного токена: ошибка ломает всю цепочку. Поэтому сборку проверяют тестами на код и математику, а не только общим экзаменом по знаниям.'
  kind: choice
  options:
    - Потому что бенчмарк знаний измеряет только скорость, а не качество
    - 'Потому что квантизация бьёт по способностям неравномерно: длинные вычисления и точный синтаксис кода деградируют сильнее, чем извлечение фактов'
    - Потому что бенчмарки знаний нельзя запускать на сжатых моделях
    - Потому что просадка на любом бенчмарке автоматически означает одинаковую просадку везде
