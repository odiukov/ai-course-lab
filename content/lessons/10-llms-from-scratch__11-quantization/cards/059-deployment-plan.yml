- concept: 'порядок работ плана квантизации: ограничения и контрольный вариант, затем совместимая связка, кандидаты, прогон на целевом железе, две проверки, фиксация выбора'
  question: Расставьте шаги плана перевода модели в низкую точность в правильном порядке.
  explanation: 'Ограничения идут первыми: без них нечем отсеивать кандидатов. Контрольный прогон нужен до сравнений. Проверки — только после прогона на целевом железе, иначе замеры не относятся к реальной эксплуатации.'
  kind: order
  items:
    - 'Записать ограничения запуска: модель, железо, доступная память, длина контекста, минимальные требования к качеству и скорости'
    - Зафиксировать исходную модель высокой точности как контрольный вариант и путь отката
    - Выбрать совместимые формат, метод и движок и подготовить кандидатов, откалибровав те методы, которым нужна калибровка
    - Прогнать каждого кандидата на целевом железе с одинаковыми настройками и одинаковым набором запросов
    - Проверить результаты по качеству и отдельно по эксплуатационным замерам памяти и скорости
    - Принять размен среди прошедших кандидатов и зафиксировать выбранную конфигурацию
  id: 059-deployment-plan-1
  fingerprint: 8ec59247
- concept: границы приёмки записывают до замеров, иначе критерий подгоняется под полученные числа
  question: Зачем допустимые границы по качеству и по эксплуатационным метрикам фиксируют письменно до того, как получены замеры кандидатов?
  explanation: Если порог назначается после замеров, он неизбежно оказывается чуть ниже полученного результата, и проверка перестаёт что-либо проверять. Записанные заранее границы делают приёмку воспроизводимой.
  kind: choice
  options:
    - Чтобы решение принималось по заранее заданному критерию, а не подгонялось под то, что получилось у понравившегося кандидата
    - Чтобы движок мог автоматически прервать загрузку модели при превышении границ
    - Чтобы не пришлось прогонять контрольную модель высокой точности
    - Чтобы сократить число кандидатов до одного и сэкономить время прогона
