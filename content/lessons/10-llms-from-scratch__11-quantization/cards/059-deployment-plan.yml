- concept: исходная модель высокой точности сохраняется как рабочий путь отката, а не только как объект сравнения
  question: Кандидаты собраны и измерены. Почему исходную модель высокой точности имеет смысл держать доступной и после выбора квантизованного варианта?
  explanation: Проверка идёт на конечном наборе запросов и не покрывает всю будущую нагрузку. Сохранённая полноточная модель даёт способ вернуться к известному качеству, не останавливая сервис.
  kind: choice
  options:
    - Она нужна движку для распаковки низкобитных весов на лету
    - Она остаётся рабочим вариантом отката, если в эксплуатации у выбранного кандидата обнаружится деградация, не пойманная замерами
    - Из неё каждый раз пересчитывается zero point квантизованной модели
    - Без неё нельзя сохранить квантизованные веса в самодостаточный контейнер
  correct: 1
