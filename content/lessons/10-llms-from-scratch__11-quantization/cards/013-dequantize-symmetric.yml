- concept: деквантизация умножает целый код на масштаб
  question: Заполни пропуск в формуле обратного преобразования симметричной квантизации.
  explanation: 'Квантизация делила значение на scale, значит обратный ход — умножение кода на тот же scale. Никаких округлений и обрезок тут уже нет: они относятся к прямому преобразованию.'
  kind: cloze
  template: reconstructed = quantized ___ scale
  answer: '*'
  accept:
    - '*'
    - умножить на
    - ×
    - умножается на
  id: 013-dequantize-symmetric-1
  fingerprint: d5ca6c60
- concept: после деквантизации получаются только значения, кратные масштабу
  question: Тензор проквантовали симметрично с масштабом 0,02. Какое из чисел может встретиться в деквантованном тензоре?
  explanation: Восстановленное значение — это код, умноженный на масштаб, поэтому оно всегда кратно 0,02. 0,06 = 3 × 0,02 подходит; 0,05 и 0,031 не являются целыми кратными шага и после деквантизации появиться не могут.
  kind: choice
  options:
    - 0,031
    - 0,06
    - 0,05
  correct: 1
  id: 013-dequantize-symmetric-2
  fingerprint: cd13ad40
