- concept: QAT вставляет фиктивные quantize/dequantize в прямой проход, чтобы веса подстраивались под будущее округление
  question: Что именно делает quantization-aware training во время обучения?
  explanation: Прямой проход видит округлённые значения, поэтому обучение подстраивает веса под конкретную грубую сетку. Последний вариант описывает post-training квантизацию, а не QAT.
  kind: choice
  options:
    - Хранит веса и градиенты в низкой битности, чтобы обучение шло быстрее
    - Вставляет в прямой проход фиктивные операции квантизации и деквантизации, так что модель обучается с уже искажёнными значениями
    - Обучает отдельную сеть, которая предсказывает масштабные множители по входу
    - Обучает модель как обычно, а квантизацию применяет только к финальному чекпоинту
  correct: 1
