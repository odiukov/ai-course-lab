- concept: 16-битный формат с восьмибитной экспонентой повторяет диапазон FP32, поэтому перевод из FP32 теряет значащие цифры, но не переполняется
  question: Тензор из FP32 переводят в 16-битный формат с 8 битами экспоненты и 7 битами мантиссы. Что произойдёт со значениями?
  explanation: Экспонента той же длины, что у FP32, задаёт тот же порядок представимых величин. Урезана мантисса — с 23 бит до 7, поэтому падает именно точность. Loss scaling лечит узкий диапазон, а здесь он не узкий.
  kind: choice
  options:
    - Крупные значения уйдут в бесконечность, потому что вдвое меньшая ширина формата всегда сужает диапазон
    - Диапазон представимых величин совпадает с FP32, поэтому переполнения не будет, но у каждого числа останется заметно меньше значащих цифр
    - 'И диапазон, и число значащих цифр сохранятся: потеря битов затрагивает только знак'
    - Значения сохранятся точно, если предварительно применить loss scaling
