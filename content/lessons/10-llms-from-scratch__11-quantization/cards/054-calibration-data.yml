- concept: распределение длин и редкие рабочие режимы включают в калибровку намеренно, иначе характерные для них активации в статистику не попадут
  question: Основная нагрузка — короткие диалоги, но раз в день приходят длинные документы, и качество на них критично. Как собрать калибровочную выборку?
  explanation: Квантизатор бережёт то, что увидел. Случайная выборка по частоте почти гарантированно упустит редкий режим, а статистики активаций зависят и от длины последовательности, и от формата входа. Редкие, но важные сценарии добавляют вручную, а не надеются на случай.
  kind: choice
  options:
    - 'Взять только короткие диалоги: они составляют подавляющее большинство запросов'
    - Намеренно добавить длинные документы, даже если по частоте они редки, — иначе их активации в статистику не попадут
    - 'Взять только длинные документы: они покрывают короткие как частный случай'
    - Состав неважен, достаточно увеличить общее число примеров
