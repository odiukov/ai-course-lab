- concept: диапазон активаций зависит от входа, поэтому их масштаб нельзя зафиксировать при экспорте модели, как масштаб весов
  question: Инженер сохраняет квантованную модель на диск. Масштабы весов он записывает в файл вместе с кодами. Почему тот же приём не работает для активаций?
  explanation: 'Веса после обучения зафиксированы: их максимум известен один раз и навсегда. Активации — функция конкретного запроса, слоя и токена; тот же слой на другом промпте выдаст другой размах. Отсюда два рабочих пути: static quantization с калибровкой на репрезентативных данных или dynamic quantization с подсчётом масштаба на лету.'
  kind: choice
  options:
    - Активации вычисляются заново для каждого входа, и их размах заранее неизвестен — масштаб берут по калибровочной выборке или считают прямо во время инференса
    - Масштабы активаций занимают слишком много места на диске
    - Активации всегда лежат в диапазоне от нуля до единицы, поэтому масштаб им не нужен
    - Формат хранения активаций запрещает дробные множители
  correct: 0
  id: 038-activation-sensitivity-1
  fingerprint: c34fbcd1
- concept: выбросы активаций изолируют в отдельный путь вычисления высокой точности, а не отбрасывают и не усредняют
  question: В активациях слоя несколько каналов регулярно дают значения в десятки раз больше остальных. Какой приём реально применяют на практике?
  explanation: 'Выброс несёт сигнал, который модель усилила намеренно, — отбросить его нельзя. Схемы вроде декомпозиции по каналам разделяют матричное умножение: узкое подмножество outlier-каналов остаётся в высокой точности, основная масса идёт по дешёвому целочисленному пути. Так общий масштаб не растягивается на выброс и обычные значения сохраняют разрешение.'
  kind: choice
  options:
    - Каналы с выбросами считают отдельно в FP16, а остальную часть матричного произведения — в низкобитном целочисленном формате, затем результаты складывают
    - Все значения, превышающие медиану впятеро, заменяют медианой
    - Активации переводят в целочисленный формат вдвое большей битности целиком
    - Слой с выбросами исключают из прямого прохода
  correct: 0
  id: 038-activation-sensitivity-2
  fingerprint: 1be68db7
- concept: масштаб активаций берут на токен, потому что размах меняется от строки к строке внутри одного батча
  question: Объясни своими словами, зачем для активаций используют per-token масштабы вместо одного масштаба на весь тензор активаций.
  explanation: 'Per-token — та же логика гранулярности, что и per-channel у весов, но ось выбрана под структуру активаций: строки соответствуют токенам, и именно между токенами размах гуляет сильнее всего.'
  kind: open
  reference: 'Тензор активаций — это набор векторов, по одному на токен. Размах у них разный: один токен может дать пик, остальные остаться в узком коридоре. Общий масштаб подстроится под самый шумный токен и огрубит все остальные строки. Свой масштаб на строку локализует ущерб: пик портит разрешение только своего токена, соседние квантизуются со своим, гораздо меньшим шагом. Стоимость — вектор масштабов длиной в число токенов, что пренебрежимо мало относительно самого тензора.'
  id: 038-activation-sensitivity-3
  fingerprint: 1cd21e9f
