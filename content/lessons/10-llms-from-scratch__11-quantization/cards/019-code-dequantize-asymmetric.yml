- concept: деквантизация не содержит округления, потому что округление уже произошло на этапе квантизации
  question: Почему в обратном преобразовании нет округления, хотя в прямом оно есть?
  explanation: Потеря информации происходит один раз — при округлении кода. Обратное преобразование переводит целый номер ступени в вещественное число и обязано вернуть значение, кратное масштабу; дополнительное округление только добавило бы ошибку.
  kind: choice
  options:
    - Округление уже применено при квантизации; восстановление лишь возвращает целые смещения в исходный масштаб
    - Округление в обратном преобразовании выполняется неявно при умножении на масштаб
    - Округление пропускают ради скорости, хотя оно повысило бы точность
    - Округление не нужно, потому что все восстановленные значения и так целые
