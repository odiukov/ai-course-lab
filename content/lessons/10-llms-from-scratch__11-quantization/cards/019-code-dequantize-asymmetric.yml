- concept: нижняя граница восстановимых значений асимметричной схемы равна минус zero point, умноженному на масштаб
  question: Асимметричная квантизация с кодами от 0 до 15, масштаб 0.2, zero point 9. Какое наименьшее вещественное значение можно восстановить по этой схеме?
  explanation: 'Минимальный код 0 даёт смещение 0 − 9 = −9, а после умножения на масштаб: −9 × 0.2 = −1.8. Верхняя граница получается из кода 15: (15 − 9) × 0.2 = 1.2. Диапазон восстановления несимметричен относительно нуля — его положение задаёт именно zero point.'
  kind: numeric
  answer: -1.8
  tolerance: 0.01
