- concept: SNR в децибелах равен десяти десятичным логарифмам отношения мощности сигнала к MSE
  question: Средний квадрат значений исходного тензора равен 8,1, а MSE восстановления равна 0,0081. Чему равен SNR в децибелах?
  explanation: Отношение мощностей 8,1 / 0,0081 = 1000, а 10·log10(1000) = 30 дБ. Каждые 10 дБ означают десятикратное изменение отношения мощности сигнала к мощности ошибки.
  kind: numeric
  answer: 30
  tolerance: 0.5
  id: 028-error-contract-1
  fingerprint: ed290af1
- concept: RMSE выражена в единицах исходных величин, а MSE — в их квадратах, поэтому напрямую сопоставима с типичным размером весов
  question: Почему рядом с MSE обычно печатают ещё и RMSE, хотя это просто её корень?
  explanation: 'MSE измеряется в квадратах единиц: при весах порядка 0,05 значение 0,0004 ни о чём не говорит на глаз. RMSE = 0,02 сразу сопоставима с 0,05. К выбросам RMSE так же чувствительна, как MSE, — корень монотонен, порядок методов он не меняет.'
  kind: choice
  options:
    - RMSE устойчивее к выбросам, чем MSE
    - RMSE выражена в тех же единицах, что и сами значения тензора, и её можно сравнить с их типичной величиной
    - RMSE не зависит от числа элементов, а MSE зависит
  correct: 1
  id: 028-error-contract-2
  fingerprint: 7bcebee8
- concept: усреднённые метрики скрывают единичный катастрофический промах, который выявляет максимальная ошибка
  question: 'Тензор из миллиона весов восстановлен так: у 999 999 элементов ошибка около 0,001, а у одного — 4,0. Какая метрика уверенно это выявит?'
  explanation: 'Вклад одного элемента в MSE делится на миллион: 16/10⁶ ≈ 1,6·10⁻⁵ — величина того же порядка, что фон, и она теряется в среднем. Косинусная близость к единичному выбросу почти нечувствительна. Максимальная ошибка вернёт ровно 4,0 и покажет худший случай.'
  kind: choice
  options:
    - MSE, потому что квадрат ошибки её резко поднимет
    - Максимальная ошибка
    - Косинусная близость
  correct: 1
