- concept: знаменатель SNR ограничивают снизу маленькой константой, потому что точное восстановление даёт нулевую MSE
  question: Зачем при вычислении SNR знаменатель берут как максимум из MSE и крошечной положительной константы?
  explanation: Если восстановление совпало с оригиналом, MSE ровно ноль и отношение мощностей неопределено. Константа-пол превращает этот случай в очень большое конечное число децибел. Отрицательный SNR — законный результат (ошибка мощнее сигнала), его подавлять не надо.
  kind: choice
  options:
    - Чтобы SNR не стал отрицательным при сильном шуме
    - Чтобы при точном восстановлении, когда MSE равна нулю, не произошло деления на ноль
    - Чтобы округлить MSE до разумной точности перед логарифмом
  correct: 1
  id: 029-code-quantization-error-1
  fingerprint: 35a55dab
- concept: перед скалярным произведением матрицы разворачивают в одномерные массивы, иначе получится матричное умножение, а не скаляр
  question: Оба тензора двумерные. Почему перед вычислением косинусной близости их разворачивают в одномерные массивы?
  explanation: Для двумерных входов np.dot выполняет матричное умножение, и результат — матрица (к тому же формы могут не сойтись). Развёртка делает операцию честным скалярным произведением. Норма Фробениуса матрицы, кстати, совпадает с евклидовой нормой её развёртки, так что проблема именно в произведении.
  kind: choice
  options:
    - Иначе скалярное произведение двух матриц даст матрицу, а не одно число
    - 'Иначе нельзя посчитать норму: она определена только для векторов'
    - Иначе результат окажется в типе NumPy, а не в обычном float
