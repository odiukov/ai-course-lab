- concept: мощность сигнала в SNR считают по оригиналу, а не по восстановленному тензору
  question: В числителе SNR стоит средний квадрат значений. Какого тензора и почему?
  explanation: SNR отвечает на вопрос «насколько шум мал по сравнению с настоящим сигналом». Если брать мощность восстановленного тензора, метод, систематически сжимающий значения, занизит и числитель, и SNR перестанет быть сравнимым между методами.
  kind: choice
  options:
    - 'Восстановленного: именно он используется дальше в вычислениях'
    - 'Исходного: он эталон, и мощность сигнала не должна зависеть от искажений метода'
    - Полусуммы обоих, чтобы метрика была симметричной
  correct: 1
