- concept: заявленная ширина знакового целочисленного формата уже включает бит знака, отдельной надбавки за знак не бывает
  question: Инженер оценивает память весов в знаковом формате INT5 и добавляет к каждому параметру ещё один бит «под знак». Что не так с такой поправкой?
  explanation: 'Битность формата — это полная ширина кода одного параметра, включая знаковый разряд. Надбавка удваивает или раздувает оценку без причины. Так же нельзя округлять ширину до целого байта: при плотной упаковке несколько узких кодов ложатся в один байт.'
  kind: choice
  options:
    - Знак уже занимает место внутри заявленной ширины формата, дополнительный бит на параметр не нужен
    - Знак хранится один на весь тензор, поэтому поправка должна быть ещё больше
    - Знак кодируется в масштабном множителе, поэтому веса вообще не занимают памяти
    - 'Поправка верна: у знаковых форматов ширина всегда указывается без знака'
  correct: 0
