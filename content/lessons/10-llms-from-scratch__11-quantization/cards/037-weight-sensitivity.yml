- concept: веса обученной модели зафиксированы и распределены предсказуемо, поэтому масштаб для них подбирается заранее, до инференса
  question: Инженер квантизует уже обученную модель. Почему масштаб квантизации для матриц весов можно подобрать один раз, ещё до первого запроса пользователя?
  explanation: 'Веса — статичный тензор: после обучения он не зависит от входа. Значит, реальный диапазон измеряется офлайн и сетка подгоняется под него. У промежуточных величин такой роскоши нет — их диапазон определяется конкретным запросом.'
  kind: choice
  options:
    - Веса после обучения не меняются, и их распределение (плотное около нуля, редкие крупные значения) известно заранее
    - Масштаб для любой матрицы весов всегда равен единице, поэтому его не нужно искать
    - Веса участвуют только в первом слое, поэтому их точность не влияет на выход
    - Ускоритель сам пересчитывает масштаб весов на каждом токене
  correct: 0
  id: 037-weight-sensitivity-1
  fingerprint: da183b82
- concept: знание модели размазано по множеству весов, а разнонаправленные ошибки округления частично гасятся при суммировании произведений
  question: Объясни своими словами, почему миллионы независимых ошибок округления в матрице весов не складываются в пропорционально огромную ошибку на выходе слоя.
  explanation: Ключевое — суммирование разнознаковых отклонений и распределённость знания. Если бы поведение модели зависело от одного конкретного коэффициента, его округление было бы фатальным; на практике вклад размазан.
  kind: open
  reference: 'Выход нейрона — сумма произведений входов на веса. Округление одни веса чуть увеличивает, другие чуть уменьшает, знаки ошибок разные и не согласованы между собой, поэтому в сумме значительная их часть взаимно компенсируется. Плюс сама функция модели не держится на одном-единственном коэффициенте: вклад распределён по множеству весов, и небольшой сдвиг каждого не переносит решение целиком. Ошибка растёт медленнее, чем число слагаемых.'
  id: 037-weight-sensitivity-2
  fingerprint: b4670540
