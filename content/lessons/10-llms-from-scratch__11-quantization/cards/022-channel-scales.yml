- concept: поканальные масштабы стоят хранения вектора чисел, и эти накладные расходы малы относительно самих весов
  question: Матрица весов 256 на 1024 квантизуется в INT8. Чем поканальная схема (масштаб на строку) платит за свою точность по сравнению с одним масштабом на матрицу, и велика ли эта плата?
  explanation: 'Именно поэтому продакшен-методы квантизации работают на уровне канала или мельче: цена в памяти — доли процента, а выигрыш в качестве большой.'
  kind: open
  reference: 'Платит хранением и обработкой вектора масштабов вместо одного числа: 256 значений float32 — это 256 × 4 = 1024 байта против 4 байт. Сами веса занимают 256 × 1024 = 262144 байта, так что накладные расходы около 0.4%. Также деление и обратное умножение требуют совмещения форм (масштаб своей строки на каждый элемент). Взамен диапазон одной строки перестаёт задавать шаг сетки другим строкам, и потеря точности локализуется внутри канала.'
  id: 022-channel-scales-3
  fingerprint: 5e501051
