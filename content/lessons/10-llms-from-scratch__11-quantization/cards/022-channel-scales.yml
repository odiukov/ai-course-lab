- concept: число масштабов при per-channel равно числу каналов вдоль выбранной оси
  question: Матрицу весов размером 6 строк на 9 столбцов квантизуют поканально, считая каналами строки. Сколько масштабных множителей вернёт функция?
  explanation: 'Правило простое: один канал — один масштаб. Каналами объявлены строки, строк 6, значит и масштабов 6, при этом каждый находится по 9 значениям своей строки. Если бы каналами были столбцы, масштабов было бы 9.'
  kind: numeric
  answer: 6
  tolerance: 0.5
  id: 022-channel-scales-1
  fingerprint: 3d02c78d
- concept: измерение, по которому ищут максимум, противоположно измерению, вдоль которого расположены каналы
  question: Матрица весов имеет 12 строк и 512 столбцов. Каналами объявлены строки. По какому измерению нужно искать максимум модуля?
  explanation: 'Масштаб строки должен покрывать значения именно этой строки, поэтому редукция идёт вдоль неё — по столбцам. Указание каналов и направление свёртки противоположны: каналов остаётся 12, а измерение длины 512 исчезает.'
  kind: choice
  options:
    - По столбцам, то есть сворачивая каждую строку в одно число — получится 12 максимумов
    - По строкам, сворачивая каждый столбец, — получится 512 максимумов
    - По всей матрице сразу, а потом скопировать общий максимум каждой строке
    - 'Порядок безразличен: результат одинаков при любом измерении редукции'
  correct: 0
