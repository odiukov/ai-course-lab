- concept: GPTQ обрабатывает веса последовательно и переносит остаток ошибки на ещё не квантизованные веса
  question: Расставь действия GPTQ при обработке очередной порции весов слоя в правильном порядке.
  explanation: Ключевой момент — ошибка не выбрасывается. Она измеряется сразу после округления и переносится вперёд, поэтому следующие веса квантизуются уже из подправленных значений. Величина и направление поправки берутся из карты чувствительности, построенной по калибровочным данным.
  kind: order
  items:
    - Округлить текущую порцию весов до доступных уровней целочисленной сетки
    - 'Вычислить остаточную ошибку: разность между исходными значениями и восстановленными из кодов'
    - Распределить поправку по ещё не обработанным весам, чтобы их вклад компенсировал искажение выхода
    - Перейти к следующей порции и повторить с уже скорректированными значениями
  id: 044-gptq-1
  fingerprint: 0c12ca10
- concept: 'компенсация направлена только вперёд по порядку обработки: уже зафиксированные коды не переписывают'
  question: Почему GPTQ раскидывает остаточную ошибку на ещё не обработанные веса, а не на уже квантизованные?
  explanation: 'Свобода компенсации есть только у тех весов, чьё округление ещё впереди: их можно сдвинуть в вещественном виде, и сдвиг «переживёт» будущее округление. Уже записанный код менять некуда — он и так лежит на ближайшем уровне сетки.'
  kind: choice
  options:
    - 'Уже квантизованные веса зафиксированы в целых кодах: подправить их — значит снова округлить и породить новую ошибку, которую компенсировать уже нечем'
    - Потому что ранние веса всегда менее важны для выхода слоя
    - Потому что у первых весов масштаб вычислен неточно и трогать его опасно
