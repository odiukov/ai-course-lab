- concept: критерий GPTQ — сохранение выхода слоя на калибровочных данных, а не близость восстановленных весов к исходным
  question: Две схемы квантизации одного слоя дали одинаковую среднеквадратичную разницу между исходными и восстановленными весами, но заметно разное качество модели. Что объясняет расхождение с точки зрения GPTQ?
  explanation: 'Именно поэтому GPTQ строит по калибровочным данным карту чувствительности выхода: важна не близость весов, а то, во что их отклонение превращается на характерных входах. Метод минимизирует искажение поведения слоя, а не расстояние в пространстве весов.'
  kind: choice
  options:
    - Одна схема использовала больше калибровочных примеров
    - 'Ошибки распределились по-разному: одни направления сильно меняют выход слоя на реальных входах, другие почти нет'
    - У одной схемы масштабы хранятся точнее
    - Разница в весах измерена в разных единицах
