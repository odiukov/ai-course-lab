- concept: 'формат выбирают под распределение конкретного тензора: узкие данные выигрывают от мантиссы, широко разбросанные требуют длинной экспоненты'
  question: 'Есть два формата одинаковой ширины: A — 5 бит экспоненты и 10 бит мантиссы, B — 8 бит экспоненты и 7 бит мантиссы. Веса слоя укладываются в отрезок [-0.5, 0.5], а градиенты пробегают величины от 10^-20 до 10^2. Как раздать форматы?'
  explanation: Веса и так жмутся к нулю, их диапазон узкий — лишние биты мантиссы дают им более точные значения (это раскладка FP16). Градиенты рискуют утечь в ноль или переполниться, поэтому им нужна длинная экспонента даже ценой десятичного знака (раскладка BF16).
  kind: choice
  options:
    - Веса — в A, градиенты — в B
    - Веса — в B, градиенты — в A
    - 'Оба тензора — в A: точность важнее в обоих случаях'
  correct: 0
  id: 007-float-check-1
  fingerprint: 75cea3f2
- concept: смена формата одинаковой ширины перераспределяет биты между экспонентой и мантиссой, но не меняет объём памяти
  question: Инженер переводит градиенты из формата с 5-битной экспонентой в формат с 8-битной экспонентой той же общей ширины и ждёт, что чекпоинт похудеет. Что он получит на деле и почему?
  explanation: FP16 (5+10) и BF16 (8+7) — оба по 2 байта на параметр. Экономия памяти начинается там, где ширина формата реально падает.
  kind: open
  reference: 'Размер не изменится: у обоих форматов одинаковое число бит на параметр, а значит и одинаковое число байт на тензор. Меняется только раздача битов внутри числа — экспонента растёт, мантисса укорачивается. Выигрыш тут не в памяти, а в устойчивости: широкая экспонента спасает крошечные и огромные градиенты от обнуления и переполнения ценой одного десятичного знака точности. Память режется только уменьшением битности (FP8, INT8, INT4).'
  id: 007-float-check-2
  fingerprint: 374450b9
