- concept: 'иерархия чувствительности: одинаковая по величине ошибка квантизации наносит компонентам трансформера разный ущерб'
  question: Расставь компоненты трансформера от самого устойчивого к квантизации к самому хрупкому.
  explanation: Веса распределены плотно вокруг нуля и их ошибка остаётся локальной. У активаций шире динамический диапазон и есть выбросы. Ошибка в KV-кэше переиспользуется на каждом следующем шаге генерации и копится. Логиты проходят через softmax, который экспоненциально усиливает разности и может изменить сам выбор позиции.
  kind: order
  items:
    - веса линейных слоёв
    - активации между слоями
    - KV-кэш
    - логиты attention до softmax
  id: 041-sensitivity-map-1
  fingerprint: 9bc28b75
- concept: порядок по чувствительности не совпадает с порядком по вкладу в память, поэтому решение о квантизации взвешивает обе оси
  question: Что означает положение компонента справа на шкале чувствительности к квантизации?
  explanation: 'Шкала ранжирует ущерб от ошибки, а не объём и не порядок вычислений. Размер и хрупкость — независимые оси: KV-кэш одновременно и главный пожиратель памяти на длинном контексте, и чувствительный компонент, поэтому его всё равно жмут, но осторожно (FP8 или INT8) и с оглядкой на длину последовательности.'
  kind: choice
  options:
    - Одинаковая числовая погрешность в нём сильнее меняет выход модели
    - Он занимает больше памяти, чем компоненты слева
    - Он вычисляется позже по ходу прямого прохода
    - Его вообще запрещено квантизовать в любых схемах
