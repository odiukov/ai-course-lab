- concept: 'бюджет точности распределяют по иерархии: агрессивно жмут устойчивое, высокую точность оставляют хрупкому'
  question: Инженеру нужно уместить модель в память карты и он готов пожертвовать частью точности. С какого компонента разумно начинать сжатие?
  explanation: 'Веса дают максимум экономии при минимуме риска — с них и начинают. Дальше по мере необходимости идут активации и KV-кэш, каждый со своими приёмами. Softmax-путь оставляют в FP16 или BF16: экономии там почти нет, а цена ошибки максимальна. Единая битность по всей сети — как раз то, чего иерархия велит избегать.'
  kind: choice
  options:
    - С весов линейных слоёв — они и объёмнее всего, и переносят низкую битность лучше остальных
    - С логитов attention — там больше всего значений на длинном контексте
    - С KV-кэша в первую очередь, потому что он чувствительнее весов
    - 'Сжимать всё одинаково: единая битность по всей сети даёт лучший результат'
