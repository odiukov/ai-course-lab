- concept: целочисленная арифметика дешевле и быстрее плавающей при той же ширине формата
  question: Почему целочисленное матричное умножение на ускорителе идёт быстрее и экономнее по энергии, чем умножение чисел с плавающей точкой той же ширины?
  explanation: Плавающее умножение тянет за собой работу с экспонентой и нормализацию, целочисленное — нет. На A100 INT8 даёт 624 TOPS против 312 TFLOPS у FP16, вдвое больше при той же ширине операнда.
  kind: choice
  options:
    - Целочисленные тензоры занимают меньше памяти при равной битности
    - Целочисленному блоку не нужно выравнивать экспоненты и нормализовать результат — схема умножителя проще
    - Целочисленные веса не требуют обращения к памяти, они хранятся в регистрах
    - Плавающая арифметика всегда выполняется программно, без аппаратной поддержки
  correct: 1
  id: 008-fp8-integers-2
  fingerprint: 8923293f
- concept: при очень низкой битности качество определяется выбором масштаба и методом квантизации, а не самим фактом округления
  question: Две реализации сжимают одну модель до одинаковой очень низкой битности, но одна теряет заметную часть качества, а другая удерживает свыше 95% исходного. Объясни своими словами, за счёт чего возникает такая разница.
  explanation: На низкой битности уровней настолько мало, что основную работу тащит масштабный множитель, а не сама сетка.
  kind: open
  reference: 'Битность задаёт только количество доступных кодов. Всё остальное решает подбор масштаба: на какой участок значений его натянуть, насколько мелко нарезать группы (per-tensor, per-channel, поблочно), что делать с выбросами и какие веса вообще квантизовать, а какие оставить в широком формате. Методы вроде GPTQ и AWQ подбирают масштабы и порядок квантизации с оглядкой на важность весов, поэтому удерживают 95%+ качества, тогда как наивное округление с одним грубым масштабом теряет заметно больше.'
  id: 008-fp8-integers-3
