- concept: положение обрыва зависит от конкретных весов и схемы квантизации, поэтому его измеряют, а не переносят с другой модели
  question: Для одной модели обрыв качества обнаружен при переходе к 6 битам. Что можно сказать про другую модель с иным распределением весов и другой гранулярностью масштабов?
  explanation: Обрыв наступает там, где шаг сетки становится сравним с разбросом типичных значений. Тензор с выбросами, per-tensor масштаб или другой метод квантизации сдвигают эту границу в любую сторону. Развёртку делают на своих весах, а чужую границу берут максимум как гипотезу.
  kind: choice
  options:
    - 'Её обрыв гарантированно там же: граница определяется только битностью'
    - Положение обрыва нужно измерить заново — оно зависит от распределения весов и схемы квантизации
    - У неё обрыва не будет, если число параметров больше
    - Её обрыв всегда наступает на большей битности, чем у первой модели
