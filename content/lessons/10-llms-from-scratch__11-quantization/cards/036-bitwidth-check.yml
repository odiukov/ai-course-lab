- concept: монотонная метрика сжатия не может служить критерием выбора — критерий задаёт порог допустимой деградации
  question: Почему столбец с коэффициентом сжатия сам по себе не может выбрать битность?
  explanation: 'Метрика, которая монотонно улучшается вдоль всей развёртки, не различает варианты: её оптимум всегда на краю. Выбор появляется только тогда, когда рядом стоит вторая величина с противоположным поведением — качество — и задан порог его допустимого падения.'
  kind: choice
  options:
    - Потому что он считается неточно и его значения условны
    - Потому что он монотонно растёт при уменьшении битности и всегда указывает на самый низкий вариант, ничего не сообщая о качестве
    - Потому что сжатие не связано с битностью
    - Потому что сжатие имеет смысл сравнивать только внутри одного формата
