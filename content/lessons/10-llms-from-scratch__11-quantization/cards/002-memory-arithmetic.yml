- concept: объём весов = число параметров × битность / 8
  question: Модель имеет 20 миллиардов параметров, каждый хранится в 6 битах. Сколько примерно гигабайт (в десятичном счёте) занимают только веса?
  explanation: 20 млрд × 6 бит = 120 млрд бит; делим на 8 бит в байте — 15 млрд байт, то есть около 15 ГБ. Формула M = N × b / 8 работает для любой битности.
  kind: numeric
  answer: 15
  tolerance: 0.3
  id: 002-memory-arithmetic-1
  fingerprint: 89f88363
- concept: форматы уже байта хранятся упакованно, а не с округлением каждого параметра до целого байта
  question: Формат отводит параметру меньше битов, чем помещается в байт. Как такие веса лежат в памяти?
  explanation: 'Иначе экономия исчезла бы: 4-битный формат при выравнивании по байту дал бы те же расходы, что INT8. Реальные хранилища упаковывают два 4-битных значения в байт, и 8B-модель занимает 4 ГБ, а не 8 ГБ.'
  kind: choice
  options:
    - Несколько значений упаковываются в один байт подряд
    - Каждое значение всё равно занимает целый байт, остаток заполняется нулями
    - Значения хранятся отдельным файлом-индексом рядом с моделью
    - Значения округляются до ближайшего байтового формата при загрузке
