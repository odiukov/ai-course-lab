- concept: важность веса для AWQ определяется величиной активации его входного канала, а не размером самого веса
  question: AWQ отбирает веса, требующие особой защиты. По какому признаку он их находит?
  explanation: Ошибка веса попадает на выход умноженной на активацию своего канала. Значит, при равной ошибке округления цену задаёт сигнал, проходящий через канал, а не модуль веса. Активации усредняют по калибровочным примерам, потому что признак должен быть устойчивым, а не случайным для одного входа.
  kind: choice
  options:
    - По наибольшему абсолютному значению самих весов
    - По величине активаций входного канала, усреднённой по калибровочным примерам
    - 'По номеру слоя: ближе к выходу — важнее'
    - По разбросу весов внутри строки матрицы
  correct: 1
  id: 045-awq-1
  fingerprint: fc13d4cb
- concept: масштабирование избранных строк перед квантизацией и обратное деление после уменьшает эффективный шаг округления для них, не меняя битность хранения
  question: Объясни своими словами, как AWQ уменьшает ошибку избранных весов, если хранит их в той же низкой битности, что и все остальные.
  explanation: Идея — перераспределить точность внутри той же сетки, а не расширить формат. Коэффициенты ограничивают сверху, иначе увеличенные веса упрутся в границы кодов и начнут обрезаться.
  kind: open
  reference: 'Строки матрицы, отвечающие важным входным каналам, перед квантизацией домножают на коэффициент. Увеличенные значения занимают больше кодов сетки, поэтому округляются относительно точнее. После деквантизации результат делят на тот же коэффициент — исходный масштаб возвращается, а вместе с ним и уменьшённый эффективный шаг округления для этих весов. Все веса при этом остаются в низкой битности: никакой отдельной копии в FP16 метод не заводит, хранятся только коды и коэффициенты.'
  id: 045-awq-2
  fingerprint: ebb1a47f
- concept: число защищаемых каналов равно доле salient_fraction от количества входных каналов
  question: У слоя 512 входных каналов, salient_fraction = 0,05. Сколько каналов получат защитное масштабирование?
  explanation: '512 × 0,05 = 25,6, дробную часть отбрасывают — 25 каналов. Доля намеренно мала: непропорционально важна лишь узкая группа каналов, и защита остальных не окупилась бы ростом ошибки на них.'
  kind: numeric
  answer: 25
  tolerance: 0.5
