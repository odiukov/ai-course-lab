- concept: матричное умножение аддитивно по входным каналам, поэтому его можно разбить на два подмножества каналов и сложить частичные результаты
  question: Часть входных каналов считают в FP32, остальные — в INT4, а затем два частичных результата складывают. Почему сумма даёт корректный выход линейного слоя?
  explanation: Скалярное произведение строки активаций на столбец весов — сумма по входной размерности. Разбив индексы каналов на две группы, получаем два частичных суммирования, сумма которых равна исходной. Это то же линейное преобразование, посчитанное двумя путями.
  kind: choice
  options:
    - Потому что сложение приближённо компенсирует ошибку округления обоих путей
    - Потому что выход — сумма вкладов по входным каналам, и разбиение каналов на две непересекающиеся группы просто разбивает эту сумму на две части
    - Потому что FP32-путь всегда доминирует, а INT4-путь вносит пренебрежимо малый вклад
    - Потому что при делении на два пути каждый из них считает полный результат, и складывать надо для усреднения
  correct: 1
  id: 057-outlier-routing-1
  fingerprint: ffdf087c
- concept: выделенным каналам активации соответствуют строки матрицы весов с теми же индексами, поэтому срезы двух матриц берут по разным осям
  question: Активации X имеют форму (токены, входные_каналы), веса W — форму (входные_каналы, выходные_каналы). В массиве hi лежат индексы каналов-выбросов. Чем заполнить пропуск, чтобы взять согласованную часть весов для дорогого пути?
  explanation: Входные каналы у активаций — последняя ось, у весов — первая. Тот же набор индексов режет X по столбцам, а W по строкам. Срез W по столбцам взял бы выходные каналы и молча дал бы бессмысленный результат.
  kind: cloze
  template: |-
    X_hi = X[:, hi]
    W_hi = W[___]
  answer: 'hi, :'
  accept:
    - 'hi,:'
    - hi
    - 'hi, :'
    - hi,:,
    - hi, ...
    - hi,...
    - hi, Ellipsis
  id: 057-outlier-routing-2
  fingerprint: b1aac0db
- concept: порог отнесения канала к выбросам управляет долей вычислений в дорогом пути и потому задаёт размен качества и экономии
  question: Канал отправляют в путь высокой точности, если величина его активации превышает типичный уровень более чем в k раз. Что происходит с качеством и экономией при уменьшении k, и как выбирают значение?
  explanation: 'Порог — не константа метода, а ручка размена. Его калибруют на конкретной модели: распределение активаций у разных слоёв разное.'
  kind: open
  reference: 'Чем меньше k, тем больше каналов признаются выбросами и уходят в дорогой путь. Качество обычно растёт, потому что всё меньше опасных значений растягивает шкалу низкобитного пути, но выигрыш в памяти и скорости тает: доля вычислений в высокой точности растёт. При большом k дорогой путь короткий, экономия максимальна, но часть по-настоящему крупных активаций остаётся в грубой сетке и портит выход. Значение выбирают замером: прогоняют несколько порогов на своём слое и своих данных и берут наибольший k, который ещё укладывается в допустимую деградацию.'
  id: 057-outlier-routing-3
  fingerprint: 4c3c3093
