- concept: обрыв опознают по перелому — изменению метрики между соседними точками, резко превышающему обычный шаг, а не по абсолютному значению в одной точке
  question: 'Свип по убывающей битности дал SNR: 41, 35, 29, 23 и 7 дБ. Где находится обрыв качества?'
  explanation: 'Между первыми точками SNR падает ровным шагом около 6 дБ — это ожидаемая плата за бит. Скачок с 23 до 7 дБ выбивается из этой лесенки: качество держалось до границы и сорвалось. Искать надо перелом, а не худшее число.'
  kind: choice
  options:
    - 'На последнем переходе: падение там резко превышает обычный шаг между соседними точками'
    - На первой точке — там SNR максимален, дальше только хуже
    - 'Обрыва нет: SNR убывает монотонно на каждом шаге'
    - Обрыв там, где SNR впервые опускается ниже половины стартового значения
