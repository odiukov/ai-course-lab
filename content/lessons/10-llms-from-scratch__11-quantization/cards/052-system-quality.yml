- concept: высокая суммарная пропускная способность при батчинге не гарантирует низкую задержку отдельного запроса
  question: Система с батчингом выдаёт вдвое больше токенов в секунду суммарно, но пользователи жалуются, что ответы стали приходить медленнее. Как такое возможно?
  explanation: 'Это две разные величины. Пропускная способность — свойство системы под нагрузкой, задержка — свойство одного запроса. Батчинг поднимает первую за счёт ожидания и разделения ресурсов, что может ухудшить вторую. Мерить нужно обе: отдельно для одиночного запроса и для целевой нагрузки.'
  kind: choice
  options:
    - 'Пропускная способность считается по всем одновременным запросам, а задержка — по одному: запрос ждёт формирования батча и делит ресурс с соседями'
    - 'Это невозможно: рост пропускной способности всегда означает падение задержки'
    - Батчинг увеличивает число параметров модели, поэтому каждый шаг длится дольше
    - Пропускная способность измеряется в токенах, а задержка в байтах, поэтому числа несопоставимы
  correct: 0
  id: 052-system-quality-1
  fingerprint: 4ff4d47b
- concept: полная задержка ответа складывается из времени до первого токена и времени генерации остальных токенов
  question: Заполни пропуск в разложении полной задержки ответа на N токенов.
  explanation: TTFT покрывает приём запроса и обработку промпта (prefill) до появления первого токена, дальше каждый следующий токен добавляет свою межтокенную задержку. Отсюда видно, почему на коротких ответах выигрывает формат с малым TTFT, а на длинных — формат с высокой скоростью декодирования.
  kind: cloze
  template: latency ≈ TTFT + (N − 1) × ___
  answer: время генерации одного токена
  accept:
    - межтокенная задержка
    - inter-token latency
    - время на один токен
    - ITL
    - 1 / (токенов в секунду)
  id: 052-system-quality-2
  fingerprint: 0fb28f34
- concept: снижение битности сокращает память, но может не ускорить конкретный движок, если ядро распаковывает веса на лету
  question: После квантизации пиковая видеопамять упала заметно, а токенов в секунду стало меньше, чем у исходной модели. Какое объяснение наиболее вероятно?
  explanation: 'Выигрыш во времени возникает, только если ядро умеет считать прямо в формате хранения либо распаковка дешевле сэкономленного трафика. Иначе остаётся экономия памяти при потере скорости — а квантизованная модель, которая медленнее оригинала, теряет половину смысла. Отсюда правило: выигрыш существует лишь там, где его показал замер.'
  kind: choice
  options:
    - 'Измерение ошибочно: меньший объём весов физически не может давать меньшую скорость'
    - Движок не имеет ядра под этот формат и распаковывает веса в исходный тип перед каждым умножением, добавляя работу
    - Квантизация увеличила число слоёв модели
    - Уменьшение памяти всегда замедляет чтение из памяти ускорителя
  correct: 1
  id: 052-system-quality-3
  fingerprint: 4eadc265
