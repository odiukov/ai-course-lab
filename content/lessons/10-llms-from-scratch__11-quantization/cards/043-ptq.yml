- concept: 'PTQ не обучает модель: веса не обновляются и градиенты не считаются, калибровка настраивает только параметры квантизации'
  question: Объясни своими словами, почему пропуск калибровочных примеров через модель при PTQ — это не дообучение.
  explanation: 'Отсюда и цена метода: PTQ дёшев именно потому, что не трогает параметры модели. Если после калибровки качество не устраивает, помогают не «ещё примеры», а другая схема квантизации или гранулярность.'
  kind: open
  reference: 'При PTQ прямой проход нужен только для наблюдения: система собирает статистику значений, чтобы выбрать масштабы и границы. Обратного прохода нет, градиенты не считаются, обучаемые веса не обновляются. Знаний модели калибровка не добавляет и не меняет — она лишь настраивает измерительную шкалу под уже существующие значения. Поэтому процедура занимает минуты или часы, а не полный прогон обучения.'
