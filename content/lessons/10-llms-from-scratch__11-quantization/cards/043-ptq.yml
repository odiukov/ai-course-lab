- concept: калибровочным примерам не нужны эталонные ответы, потому что модель не учат решать задачу
  question: Готовят калибровочный набор для PTQ чат-модели. Нужны ли к примерам эталонные ответы (разметка)?
  explanation: 'Целевой функции обучения здесь нет — сравнивать выход не с чем и незачем. Достаточно входов, представляющих реальную нагрузку: по ним собирается статистика диапазонов. Разметка потребовалась бы, если бы шёл обучающий прогон.'
  kind: choice
  options:
