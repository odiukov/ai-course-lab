- concept: каждый дополнительный бит уменьшает шаг сетки вдвое и мощность шума округления вчетверо, что даёт фиксированный прирост SNR в децибелах на бит
  question: 'Для идеальной равномерной сетки без выбросов и clipping: на сколько примерно децибел вырастет SNR при переходе с 5 бит на 10 бит на параметр?'
  explanation: Лишний бит удваивает число уровней, шаг сетки уменьшается вдвое, мощность шума округления — вчетверо, а 10·log10(4) ≈ 6 дБ. Пять добавленных бит дают около 5·6 = 30 дБ.
  kind: numeric
  answer: 30
  tolerance: 3
  id: 035-six-db-rule-2
  fingerprint: 4af3419a
- concept: оценка прироста SNR на бит выведена для идеальной равномерной сетки и служит контрольной линией, а не гарантией качества
  question: Измеренный свип показал падение SNR заметно больше теоретической оценки «столько-то децибел на убранный бит». Что это означает?
  explanation: Правило «примерно 6 дБ на бит» предполагает равномерное распределение значений и отсутствие обрезки. Один выброс растягивает шаг сетки, clipping добавляет собственную ошибку — реальная кривая отклоняется и может резко провалиться. Правило годится как контрольная линия, а решение принимают по измеренным метрикам.
  kind: choice
  options:
    - Оценка выведена для идеальной равномерной сетки; выбросы и clipping ухудшают реальную кривую, и её надо мерить
    - 'В коде ошибка: реальный SNR не может отличаться от теоретического'
    - Теоретическая оценка применима только к форматам с плавающей точкой
    - Значит, тензор квантизован лучше ожидаемого — большее падение SNR означает больший запас
  correct: 0
