- concept: косинусная близость реагирует на направление тензора и не замечает общего изменения масштаба
  question: Восстановленный тензор оказался ровно в 10 раз меньше исходного по каждому элементу. Что покажут метрики?
  explanation: Умножение всех координат на положительную константу не меняет направление вектора, а косинус измеряет именно угол. Соотношения между весами сохранены, поэтому близость высокая — но абсолютные значения испорчены, и это ловит норма ошибки. Одна метрика тут не заменяет другую.
  kind: choice
  options:
    - Косинусная близость останется у максимума, хотя поэлементные ошибки велики
    - Косинусная близость упадёт почти до нуля, потому что значения сильно изменились
    - Косинусная близость станет отрицательной, потому что восстановление занижено
    - Косинусная близость не определена, пока масштабы тензоров не совпадают
