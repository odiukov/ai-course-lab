- concept: меру потери строят на квадратах или модулях разностей, потому что знаковые ошибки взаимно гасятся при простом суммировании
  question: Почему качество восстановления не оценивают простой суммой поэлементных разностей x - x̂, а берут квадраты или модули?
  explanation: Ошибка квантизации почти симметрична вокруг нуля — округление одинаково часто вверх и вниз, поэтому знаковая сумма систематически занижает потерю. Именно поэтому базовые метрики строятся на e², а максимальная ошибка берётся от |e|.
  kind: open
  reference: 'Разности имеют разные знаки: в одних элементах восстановление завышено, в других занижено. При суммировании такие промахи гасят друг друга, и сильно испорченный тензор может дать сумму около нуля — величина потери исчезнет. Квадрат и модуль убирают знак, так что каждое отклонение добавляется к общей оценке, а квадрат вдобавок усиливает крупные промахи по сравнению с мелкими.'
