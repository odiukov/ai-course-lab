- concept: 'softmax инвариантен к общему сдвигу входа: распределение задаётся разностями логитов, а не их абсолютными значениями'
  question: Ко всем логитам attention одной строки прибавили одну и ту же константу 5. Что произойдёт с распределением внимания?
  explanation: 'В формуле p_i = e^(l_i) / Σ e^(l_j) общий множитель e^c сокращается в числителе и знаменателе. Отсюда практический вывод: опасна не постоянная составляющая ошибки квантизации, а её разброс между конкурирующими позициями. На этом же свойстве держится приём вычитания максимума перед экспонентой для численной устойчивости.'
  kind: choice
  options:
    - Оно не изменится вообще
    - Все доли внимания вырастут примерно в e^5 раз
    - Распределение станет ближе к равномерному
    - Максимальная доля вырастет, остальные упадут
  correct: 0
  id: 040-logit-sensitivity-1
  fingerprint: de01d571
- concept: отношение долей внимания равно экспоненте разности логитов
  question: Два логита attention отличаются на 3. Во сколько раз доля внимания у большего больше, чем у меньшего?
  explanation: 'p_i/p_j = e^(l_i - l_j) = e^3 ≈ 20.09 — знаменатель softmax общий и сокращается. Экспонента и делает логиты хрупкими: сдвиг разности на десятые доли меняет отношение долей в разы.'
  kind: numeric
  answer: 20.09
  tolerance: 0.5
  id: 040-logit-sensitivity-2
  fingerprint: 068a25ce
- concept: риск ошибки в логитах определяется величиной разрыва между конкурентами, поэтому attention считают в повышенной точности
  question: Почти все схемы квантизации оставляют вычисление attention в FP16 или BF16, даже когда веса сжаты до четырёх бит. Объясни, почему.
  explanation: Выигрыш от квантизации логитов мал (они не хранятся, как веса или KV-кэш), а риск максимален. Соотношение выгоды и риска и делает attention последним кандидатом на сжатие.
  kind: open
  reference: 'Softmax экспоненциально усиливает разности логитов и связывает все позиции общим знаменателем: подняв долю одной позиции, автоматически опускаешь остальные. Когда несколько логитов близки, ошибка округления сопоставимого размера меняет их порядок — модель смотрит не туда, куда должна, а не просто получает чуть другое число. Ущерб зависит от разрывов между конкурентами, которые заранее неизвестны и меняются от запроса к запросу, поэтому дешевле оставить этот блок в высокой точности: он занимает малую долю памяти и вычислений по сравнению с весами.'
  id: 040-logit-sensitivity-3
  fingerprint: b7250237
