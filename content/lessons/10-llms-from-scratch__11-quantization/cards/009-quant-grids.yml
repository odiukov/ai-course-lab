- concept: битность ограничивает общее число представимых значений независимо от того, равномерна сетка или нет
  question: 'Утверждают: «FP-формат распределяет уровни неравномерно, поэтому шестибитный FP-формат представляет больше разных чисел, чем шестибитный целочисленный». Верно ли это?'
  explanation: Ширина формата определяет, сколько всего кодов существует. FP тратит их иначе — плотно у нуля и редко на больших модулях, — но не создаёт новых. Выбор между форматами это выбор расстановки уровней, а не их количества.
  kind: choice
  options:
    - 'Верно: неравномерная сетка вмещает больше значений'
    - 'Неверно: число разных кодов задаётся шириной формата, неравномерность лишь по-другому расставляет те же коды по числовой оси'
    - Верно, но только если у формата есть бит знака
    - 'Неверно: у FP-формата кодов всегда меньше из-за служебных комбинаций мантиссы'
  correct: 1
