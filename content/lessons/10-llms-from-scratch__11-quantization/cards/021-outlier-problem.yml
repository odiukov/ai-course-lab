- concept: ограничение учитываемого диапазона уменьшает шаг сетки пропорционально, ценой большой ошибки в самом отсечённом значении
  question: Все веса слоя, кроме одного, лежат в пределах ±0.25 по модулю; единственный выброс равен 8.0. Квантизация симметричная, один масштаб на матрицу. Во сколько раз уменьшится шаг сетки, если перед вычислением масштаба обрезать выброс до 0.25?
  explanation: 'Шаг пропорционален учитываемому максимуму: 8.0 / 0.25 = 32. Основная масса весов выигрывает в точности в 32 раза, но сам обрезанный вес получает ошибку 8.0 − 0.25 = 7.75 — поэтому обрезка выбросов работает только там, где такой вес не критичен для выхода слоя.'
  kind: numeric
  answer: 32
  tolerance: 0.5
  id: 021-outlier-problem-2
  fingerprint: 1abb3f38
- concept: тяжесть потерь определяется отношением максимума к типичному размаху, а не абсолютной величиной максимума
  question: 'Тензор A: максимум по модулю 0.9, типичный размах значений около 0.8. Тензор B: максимум по модулю 300, типичный размах около 0.5. Оба квантизуют одним масштабом на весь тензор. Какой пострадает сильнее и почему?'
  explanation: Качество per-tensor квантизации задаёт динамический диапазон тензора (отношение максимума к массе значений), а не сами числа. Поэтому лечат её не уменьшением величин, а сужением области, на которую действует один масштаб.
  kind: open
  reference: 'Сильнее пострадает B. Значение имеет не абсолютный максимум, а его отношение к типичному размаху данных. У A это отношение около 1.1: сетка построена под тот же диапазон, где лежат данные, и почти все коды заняты. У B отношение 600: масштаб растянут на диапазон, где значений практически нет, и основная масса весов получает лишь несколько соседних кодов. Тензор B с максимумом 300 квантизуется хорошо, если и остальные его значения того же порядка.'
  id: 021-outlier-problem-3
  fingerprint: c07263ba
