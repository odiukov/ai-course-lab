- concept: для одностороннего распределения симметричная шкала оставляет половину кодов неиспользованной, асимметричная переносит их на занятый отрезок
  question: 'На вход квантизации подаются выходы ReLU: все значения неотрицательны. Что происходит с целочисленными кодами при симметричной схеме?'
  explanation: Симметричная шкала строится от максимума модуля и покрывает отрезок от −max до +max. Если данные лежат только справа от нуля, отрицательная половина кодов мертва. Асимметричная схема сдвигает шкалу через zero point и раскладывает все коды на фактический отрезок [min, max], вдвое уменьшая шаг при той же битности.
  kind: choice
  options:
    - Примерно половина кодов приходится на отрицательную область, где данных нет, и остаётся неиспользованной
    - Все коды распределяются по занятому отрезку, но шаг становится неравномерным
    - Отрицательные коды автоматически переназначаются положительным значениям
    - Коды используются полностью, но масштаб приходится хранить с большей точностью
  correct: 0
  id: 020-asymmetric-check-1
  fingerprint: 2a5502da
- concept: масштаб асимметричной схемы равен ширине фактического диапазона данных, делённой на число интервалов между кодами
  question: Тензор содержит значения от 5 до 9. Квантизация асимметричная, коды от 0 до 15. Чему равен масштаб (шаг сетки)?
  explanation: 'Асимметричная схема отображает фактический диапазон целиком: scale = (t_max − t_min) / (qmax − qmin) = (9 − 5) / 15 ≈ 0.267. Симметричная схема на тех же данных считала бы шаг от максимума модуля 9, то есть покрывала бы пустой отрезок от −9 до 5.'
  kind: numeric
  answer: 0.267
  tolerance: 0.005
