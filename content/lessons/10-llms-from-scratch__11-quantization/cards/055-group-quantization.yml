- concept: при групповой квантизации число масштабов в канале равно длине канала, делённой на размер группы
  question: Канал матрицы весов содержит 6144 значения. Квантизация групповая, размер группы — 512 соседних весов. Сколько масштабных множителей приходится на этот канал?
  explanation: 'Группы не пересекаются и покрывают канал целиком: 6144 / 512 = 12 масштабов. При per-channel был бы один, при вдвое меньшей группе — 24.'
  kind: numeric
  answer: 12
  tolerance: 0.5
  id: 055-group-quantization-1
  fingerprint: bc785244
- concept: групповая шкала ограничивает влияние выброса его группой, а не всем каналом
  question: Внутри длинного канала весов есть одно аномально крупное значение. Что меняет переход от одного масштаба на канал к масштабу на группу соседних весов?
  explanation: 'Ни одно значение не отбрасывается и не переносится: масштаб просто считается по максимуму модуля внутри группы. Поэтому радиус ущерба от выброса сокращается с длины канала до размера группы.'
  kind: choice
  options:
    - Крупное значение перестаёт растягивать шкалу — оно отбрасывается как выброс
    - Крупное значение задаёт шаг сетки только своей группе, остальные группы получают шкалы под свои локальные диапазоны
    - Крупное значение по-прежнему задаёт шаг всему каналу, меняется только объём хранимых данных
    - Крупное значение переносится в отдельный канал высокой точности
  correct: 1
  id: 055-group-quantization-2
  fingerprint: ee21b53d
- concept: уменьшение размера группы снижает ошибку, но растит объём служебных масштабов, поэтому ищут точку окупаемости, а не минимум ошибки
  question: Почему при выборе размера группы не берут просто самый мелкий вариант, который даёт наименьшую ошибку восстановления?
  explanation: 'Критерий здесь не «минимальная ошибка», а окупаемость: сравнивают прирост качества с приростом служебных данных.'
  kind: open
  reference: 'Каждая группа требует собственного масштаба, который нужно хранить и загружать вместе с весами. Чем мельче группы, тем больше таких служебных чисел на тот же объём весов, то есть падает реальный выигрыш по памяти и пропускной способности. Ошибка при этом убывает всё медленнее. Поэтому размер группы выбирают по изгибу кривой «качество против накладных расходов»: там, где дальнейшее дробление почти не улучшает метрики восстановления, но заметно увеличивает накладные расходы. Конкретное значение зависит от весов и битности, его подбирают измерением.'
  id: 055-group-quantization-3
  fingerprint: df27541e
