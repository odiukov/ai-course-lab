- concept: показатели скорости, снятые на разных классах устройств, несопоставимы между собой
  question: 'В одной таблице стоят две строки: сборка под серверный ускоритель с 72 токенами в секунду и сборка под ноутбук с 28 токенами в секунду на CPU. Какой вывод корректен?'
  explanation: Скорость — свойство пары «формат + железо + рантайм». Числа с серверного ускорителя и с ноутбучного CPU отвечают на разные вопросы. Чтобы сравнивать форматы, фиксируют устройство, стек, промпты, длину ответа и размер батча.
  kind: choice
  options:
    - Серверная сборка использует лучший алгоритм квантизации, раз она быстрее
    - 'Сравнивать эти числа как показатель качества форматов нельзя: они сняты на разном железе, сопоставимы только замеры внутри одного класса устройств'
    - Сборка под ноутбук квантизована слабее, поэтому она медленнее
    - Разница целиком объясняется разной битностью весов
  correct: 1
  id: 053-tradeoff-check-1
  fingerprint: a7a5d96f
- concept: 'выбор формата идёт в два хода: сначала отсечение по жёстким ограничениям, затем оптимизация среди прошедших'
  question: Расставь шаги выбора квантизованной сборки под конкретный деплой в правильном порядке.
  explanation: 'Ограничения отсекают варианты, а не ранжируют их: сборка, не влезающая в память, не становится лучше от отличной перплексии. Оптимизация имеет смысл только внутри множества допустимых вариантов, и критерий задаёт порог деградации, а не «чем меньше файл, тем лучше».'
  kind: order
  items:
    - 'Зафиксировать жёсткие ограничения деплоя: доступное железо и потолок памяти'
    - Отбросить сборки, которые в этот потолок и на это железо не помещаются
    - Задать порог допустимой деградации качества по профильным метрикам
    - Среди оставшихся сравнить качество и скорость в одинаковых условиях замера
    - Выбрать вариант, проходящий порог качества и дающий лучшую скорость
  id: 053-tradeoff-check-2
  fingerprint: '07558065'
