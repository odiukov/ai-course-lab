- concept: абсолютная MSE несопоставима между тензорами разного масштаба, для сравнения нужна относительная метрика
  question: У слоя A веса порядка 0,01 и MSE 1e-6, у слоя B веса порядка 1,0 и MSE 1e-4. Какой слой квантован относительно хуже?
  explanation: У A корень из MSE равен 1e-3 при весах 0,01 — это около 10% величины. У B корень равен 1e-2 при весах 1,0 — около 1%. SNR делит мощность ошибки на мощность сигнала и сразу расставит их правильно, а голая MSE между тензорами разного масштаба ничего не сравнивает.
  kind: choice
  options:
    - 'A: у него MSE в сто раз меньше, значит и качество выше'
    - 'B: у него MSE больше по абсолютной величине'
    - 'A: относительно размера собственных весов его ошибка больше, что и покажет SNR'
  correct: 2
  id: 030-error-check-1
  fingerprint: 7e738169
- concept: нулевое значение косинусной близости при нулевой норме — защитная заглушка, а не измеренная ортогональность
  question: Функция качества вернула косинусную близость 0.0 для тензора, все элементы которого равны нулю. Как это читать?
  explanation: Косинус требует деления на произведение норм; при нулевой норме направление не определено, и код подставляет 0.0, чтобы не делить на ноль. Вывод о качестве в этом случае надо делать по MSE и максимальной ошибке — они у нулевого тензора вполне осмысленны.
  kind: choice
  options:
    - Тензоры направлены перпендикулярно друг другу
    - Косинус для нулевого вектора не определён, и 0.0 — просто заглушка вместо деления на нулевую норму
    - Восстановление полностью провалилось, и остальные метрики можно не смотреть
  correct: 1
  id: 030-error-check-2
  fingerprint: b0c23682
