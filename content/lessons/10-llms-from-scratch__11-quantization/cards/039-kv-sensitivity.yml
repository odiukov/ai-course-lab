- concept: 'ошибка в ключе и ошибка в значении портят разное: ключ определяет выбор релевантного фрагмента, значение — извлекаемое содержимое'
  question: В KV-кэше хранятся ключи и значения. Чем отличаются последствия ошибки квантизации в ключе от ошибки в значении?
  explanation: Ключ сопоставляется с текущим запросом и влияет на распределение внимания — то есть на выбор, куда посмотреть. Значение — это то, что оттуда достают. Первое искажает адресацию, второе — содержимое.
  kind: choice
  options:
    - Ошибка в ключе меняет, насколько релевантным сочтут этот токен, а ошибка в значении подмешивает искажённое содержимое в результат
    - Ошибка в ключе безвредна, потому что ключи не участвуют в вычислениях
    - Ошибка в значении меняет длину контекста, а ошибка в ключе — размер словаря
    - Оба тензора хранятся вместе, поэтому различить последствия невозможно
