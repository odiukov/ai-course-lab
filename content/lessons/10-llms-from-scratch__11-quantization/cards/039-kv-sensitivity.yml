- concept: 'обратная связь генерации: искажённое внимание меняет выбранный токен, тот входит в контекст со своими K и V, и траектории расходятся'
  question: Что означает фраза «ошибка KV-кэша накапливается»? Объясни механизм — почему это не просто повторное прибавление одного и того же числа.
  explanation: 'Накопление здесь не арифметическое, а траекторное. Именно поэтому KV-кэш чувствительнее активаций: активация используется в одном вычислении и исчезает, запись кэша живёт до конца генерации.'
  kind: open
  reference: 'Два эффекта. Первый: неточная запись кэша многократно читается — она участвует в вычислении внимания на каждом последующем шаге генерации, а не расходуется один раз. Второй, важнейший: обратная связь. Слегка изменённое распределение внимания способно изменить сам выбранный токен; этот токен попадает в контекст и порождает уже собственные ключ и значение, которых в исходной траектории не было. Дальше расходятся не числа, а две разные последовательности генерации, и расхождение растёт нелинейно.'
