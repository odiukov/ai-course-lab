- concept: 'обратное асимметричное преобразование: из кода вычитают zero point, затем умножают на масштаб'
  question: Сохранённый код равен 200, zero point равен 64, масштаб равен 0,004. Какое вещественное значение восстановится?
  explanation: 'Сначала снимаем смещение в целочисленных единицах: 200 − 64 = 136 ступенек. Затем переводим ступеньки в вещественную шкалу: 136 × 0,004 = 0,544.'
  kind: numeric
  answer: 0.544
  tolerance: 0.001
  id: 018-asymmetric-reconstruction-1
  fingerprint: 7edcb999
- concept: код, равный zero point, восстанавливается точно в ноль
  question: При асимметричной квантизации какое вещественное значение восстанавливается без ошибки округления?
  explanation: Для кода q = z получаем (z − z) × s = 0 ровно. Точное представление нуля важно для паддинга и для слоёв, где нули должны оставаться нулями.
  kind: choice
  options:
    - Максимум тензора
    - Ноль — ему соответствует код, равный zero point
    - Среднее значение тензора
  correct: 1
  id: 018-asymmetric-reconstruction-2
  fingerprint: 273c4128
- concept: если при восстановлении забыть вычесть zero point, весь тензор получает постоянный сдвиг z × s
  question: Асимметрично квантованный тензор восстановили как q × s, забыв про zero point z = 80 при s = 0,05. Что произойдёт с результатом?
  explanation: Пропущенное вычитание даёт одинаковую добавку z × s = 80 × 0,05 = 4,0 для каждого элемента. Это систематическое смещение всего тензора, а не шум округления.
  kind: choice
  options:
    - Все значения окажутся сдвинуты на +4,0
    - Значения будут случайно искажены, ошибка у каждого своя
    - Ошибка появится только у крайних значений диапазона
  correct: 0
  id: 018-asymmetric-reconstruction-3
  fingerprint: ae516b32
