- concept: GGUF — формат упаковки со смешанной по слоям битностью, а не метод минимизации ошибки квантизации
  question: Чем GGUF отличается по своей природе от GPTQ и AWQ?
  explanation: 'Путаница возникает из-за того, что всё это встречается в названиях скачиваемых моделей. Полезно держать оси раздельно: чем считали коды (алгоритм), в чём хранят (формат), на чём запускают (железо).'
  kind: open
  reference: 'GPTQ и AWQ — алгоритмы: они решают, как распределить ошибку округления по весам. GGUF — файловый формат: он описывает, как модель хранится и загружается. GGUF поддерживает смешанную точность, то есть разным слоям можно назначить разную битность; крайние слои (эмбеддинги и выходную голову) обычно оставляют точнее, средним достаётся низкая битность. Файл самодостаточен: веса, токенизатор и метаданные лежат вместе. Формат заточен под инференс на CPU и Apple Silicon, тогда как GPTQ и AWQ ориентированы на GPU-инференс.'
  id: 046-methods-map-3
  fingerprint: 0ab7b9e5
