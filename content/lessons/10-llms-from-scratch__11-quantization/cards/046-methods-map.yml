- concept: 'GPTQ и AWQ — разновидности PTQ: одноразовая калибровка без обновления весов обучением'
  question: 'Инженер говорит: «GPTQ и AWQ — это альтернатива PTQ, они модель дообучают». Что здесь неверно?'
  explanation: 'Калибровочный прогон — это наблюдение, а не обучение. GPTQ и AWQ отличаются от наивного PTQ не наличием обучения, а критерием важности: чувствительность выхода против величины активаций.'
  kind: choice
  options:
    - 'Ничего: оба метода действительно запускают короткий цикл обучения'
    - 'Оба метода сами являются PTQ: они используют калибровочные примеры для выбора параметров, но обучающего прогона с градиентами не проводят'
    - 'Неверно только про AWQ: GPTQ действительно дообучает модель'
    - Оба метода вообще не используют данные
  correct: 1
