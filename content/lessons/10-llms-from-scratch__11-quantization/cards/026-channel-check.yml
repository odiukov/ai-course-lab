- concept: выигрыш поканальной гранулярности зависит от того, вдоль какой оси сгруппированы выбросы
  question: В матрице весов 512×512 крупные выбросы собраны в нескольких столбцах, остальные значения мелкие. Какая схема даст наименьшую ошибку при 8 битах?
  explanation: Выброс раздувает масштаб только той группы, в которую попал. Если выбросы сидят в столбцах, столбцовые масштабы изолируют их, и остальные 500+ столбцов получают свою мелкую сетку. Построчная группировка протащит выброс через каждую строку, а общий масштаб — через всю матрицу.
  kind: choice
  options:
    - Один масштаб на всю матрицу
    - Отдельный масштаб на каждую строку
    - Отдельный масштаб на каждый столбец
  correct: 2
  id: 026-channel-check-1
  fingerprint: 94f919cb
- concept: per-tensor — частный случай per-channel с наихудшим общим масштабом, поэтому поканальная ошибка не бывает больше
  question: Почему при одинаковой битности поканальная квантизация не может дать ошибку хуже, чем один масштаб на весь тензор?
  explanation: Общий масштаб определяется максимумом модуля по всей матрице, то есть равен масштабу самого «широкого» канала. Каждый остальной канал в поканальной схеме получает масштаб не больше этого, значит шаг сетки у него не крупнее, а ошибка не больше. Число кодов на канал одинаково и задаётся битностью.
  kind: choice
  options:
    - Потому что поканальная схема использует больше кодов на канал
    - Потому что общий масштаб равен максимальному из поканальных, а больший масштаб означает более крупный шаг сетки
    - Потому что поканальная схема хранит масштабы во float64, а per-tensor — во float32
  correct: 1
