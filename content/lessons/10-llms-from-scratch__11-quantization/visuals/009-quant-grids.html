<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Битность и число доступных уровней</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f5f7fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #647087;
      --rail: #aeb8c9;
      --tick: #52617a;
      --dense: #8794a9;
      --input: #e67817;
      --input-soft: #fff1df;
      --target: #6757d9;
      --target-soft: #edeaff;
      --border: #d9deea;
      --shadow: #c7cfdd;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111522;
        --panel: #181e2d;
        --text: #edf1fa;
        --muted: #aab4c8;
        --rail: #56627a;
        --tick: #b8c3d7;
        --dense: #77849b;
        --input: #ffad5b;
        --input-soft: #3d2a18;
        --target: #aaa0ff;
        --target-soft: #302b57;
        --border: #343d51;
        --shadow: #0d1019;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
      padding: 14px;
    }

    .figure {
      width: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: 0 1px 0 var(--shadow);
    }

    .heading {
      padding: 14px 18px 0;
    }

    .heading h1 {
      margin: 0;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: -0.02em;
    }

    .heading p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--panel);
    }

    .row-label {
      fill: var(--text);
      font-size: 18px;
      font-weight: bold;
    }

    .row-note,
    .axis-label,
    .legend {
      fill: var(--muted);
      font-size: 14px;
    }

    .value-label {
      fill: var(--input);
      font-size: 16px;
      font-weight: bold;
    }

    .rail {
      stroke: var(--rail);
      stroke-width: 1.5px;
      vector-effect: non-scaling-stroke;
    }

    .axis {
      stroke: var(--tick);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .tick {
      stroke: var(--tick);
      stroke-width: 1.25px;
      vector-effect: non-scaling-stroke;
    }

    .tick-dense {
      stroke: var(--dense);
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
    }

    .input-guide {
      stroke: var(--input);
      stroke-width: 2px;
      stroke-dasharray: 5 5;
      vector-effect: non-scaling-stroke;
    }

    .rounding-path {
      fill: none;
      stroke: var(--target);
      stroke-width: 2px;
      stroke-linejoin: round;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .nearest-tick {
      stroke: var(--target);
      stroke-width: 4px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .source-ring {
      fill: var(--input-soft);
      stroke: var(--input);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .target-dot,
    .arrow-head {
      fill: var(--target);
      stroke: var(--panel);
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
    }

    .legend-source {
      fill: var(--input-soft);
      stroke: var(--input);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .legend-target {
      fill: var(--target);
    }

    .fallback {
      fill: var(--text);
      font-size: 18px;
      font-weight: bold;
    }

    .fallback-detail {
      fill: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <figure class="figure" aria-labelledby="diagram-title diagram-subtitle">
    <figcaption class="heading">
      <h1 id="diagram-title">Чем меньше битов, тем реже уровни</h1>
      <p id="diagram-subtitle">
        Одна шкала, три сетки: цветная отметка показывает округление к ближайшей ступеньке.
      </p>
    </figcaption>

    <svg
      id="diagram"
      viewBox="0 0 1200 430"
      width="1200"
      height="430"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Сокращение числа уровней от INT8 к INT2</title>
      <desc id="svg-desc">
        На общей числовой шкале показаны 256 уровней INT8, 16 уровней INT4
        и 4 уровня INT2, а также округление исходного значения 0.1.
      </desc>
    </svg>
  </figure>

  <script>
    const diagramData = [{
      canvas: { width: 1200, height: 430 },
      origin: { x: 250, y: 34 },
      scale: { x: 830, y: 56 },
      domain: { start: 0, end: 1 },
      rows: [
        {
          format: "INT8",
          label: "INT8 — 256 уровней",
          count: 256,
          y: 1.55,
          majorEvery: 32,
          tickHalf: 0.12,
          majorHalf: 0.19,
          className: "tick-dense"
        },
        {
          format: "INT4",
          label: "INT4 — 16 уровней",
          count: 16,
          y: 3.05,
          majorEvery: 4,
          tickHalf: 0.18,
          majorHalf: 0.27,
          className: "tick"
        },
        {
          format: "INT2",
          label: "INT2 — 4 уровня",
          count: 4,
          y: 4.55,
          majorEvery: 1,
          tickHalf: 0.25,
          majorHalf: 0.25,
          className: "tick"
        }
      ],
      value: 0.1,
      loop: { start: 0, step: 1 },
      math: { zero: 0, half: 0.5 },
      layout: {
        labelX: -0.045,
        noteX: -0.045,
        noteY: 0.72,
        guideTopY: 0.68,
        guideBottomY: 5.18,
        valueLabelY: 0.42,
        bend: 0.38,
        highlightHalf: 0.33,
        axisY: 5.45,
        axisHeadBack: 0.025,
        axisHeadHalf: 0.11,
        axisTextY: 5.82,
        legendY: 6.55,
        legendSourceX: 0.22,
        legendSourceTextX: 0.245,
        legendTargetX: 0.58,
        legendTargetTextX: 0.605,
        fallbackY: 3.05,
        fallbackDetailY: 3.55
      },
      marker: {
        sourceRadius: 0.008,
        targetRadius: 0.009,
        legendRadius: 0.008,
        arrowHalfWidth: 0.010,
        arrowBack: 0.16
      },
      offsets: {
        none: 0,
        labelLeft: -12,
        noteBelow: 6,
        valueAbove: -4,
        axisBelow: 4,
        fallbackGap: 0
      },
      text: {
        note: "одинаковый диапазон",
        value: "исходное значение 0.1",
        lower: "меньше",
        higher: "больше",
        sourceLegend: "исходная точка 0.1",
        targetLegend: "ближайшая доступная ступенька",
        fallback: "Схема должна была показать три равномерные сетки.",
        fallbackDetail: "INT8: 256 уровней · INT4: 16 уровней · INT2: 4 уровня"
      }
    }];

    const [cfg] = diagramData;
    const origin = Object.freeze(cfg.origin);
    const scale = Object.freeze(cfg.scale);

    const toPx = (point) => ({
      x: origin.x + point.x * scale.x,
      y: origin.y + point.y * scale.y
    });

    try {
      const svg = document.getElementById("diagram");
      const namespace = "http://www.w3.org/2000/svg";

      const make = (tag, attributes, text) => {
        const node = document.createElementNS(namespace, tag);
        Object.entries(attributes || {}).forEach(([name, value]) => {
          node.setAttribute(name, String(value));
        });
        if (text !== undefined) {
          node.textContent = text;
        }
        return node;
      };

      const appendLine = (parent, from, to, className) => {
        const a = toPx(from);
        const b = toPx(to);
        parent.appendChild(make("line", {
          x1: a.x,
          y1: a.y,
          x2: b.x,
          y2: b.y,
          class: className
        }));
      };

      const appendText = (
        parent,
        anchor,
        text,
        className,
        textAnchor,
        dx,
        dy
      ) => {
        const point = toPx(anchor);
        parent.appendChild(make("text", {
          x: point.x,
          y: point.y,
          dx,
          dy,
          class: className,
          "text-anchor": textAnchor,
          "dominant-baseline": "middle"
        }, text));
      };

      const radiusFromX = (logicalRadius) => {
        const left = toPx({ x: cfg.math.zero, y: cfg.math.zero });
        const right = toPx({ x: logicalRadius, y: cfg.math.zero });
        return Math.abs(right.x - left.x);
      };

      const appendCircle = (parent, center, radius, className) => {
        const point = toPx(center);
        parent.appendChild(make("circle", {
          cx: point.x,
          cy: point.y,
          r: radiusFromX(radius),
          class: className
        }));
      };

      const appendPolygon = (parent, points, className) => {
        const serialized = points
          .map((point) => {
            const pixel = toPx(point);
            return `${pixel.x},${pixel.y}`;
          })
          .join(" ");
        parent.appendChild(make("polygon", {
          points: serialized,
          class: className
        }));
      };

      const appendPolyline = (parent, points, className) => {
        const serialized = points
          .map((point) => {
            const pixel = toPx(point);
            return `${pixel.x},${pixel.y}`;
          })
          .join(" ");
        parent.appendChild(make("polyline", {
          points: serialized,
          class: className
        }));
      };

      const guideLayer = make("g", { "aria-hidden": "true" });
      const tickLayer = make("g", { "aria-hidden": "true" });
      const roundingLayer = make("g", { "aria-hidden": "true" });
      const labelLayer = make("g", { "aria-hidden": "true" });

      svg.appendChild(guideLayer);
      svg.appendChild(tickLayer);
      svg.appendChild(roundingLayer);
      svg.appendChild(labelLayer);

      appendText(
        labelLayer,
        { x: cfg.layout.noteX, y: cfg.layout.noteY },
        cfg.text.note,
        "row-note",
        "end",
        cfg.offsets.labelLeft,
        cfg.offsets.noteBelow
      );

      cfg.rows.forEach((row) => {
        appendLine(
          guideLayer,
          { x: cfg.domain.start, y: row.y },
          { x: cfg.domain.end, y: row.y },
          "rail"
        );

        appendText(
          labelLayer,
          { x: cfg.layout.labelX, y: row.y },
          row.label,
          "row-label",
          "end",
          cfg.offsets.labelLeft,
          cfg.offsets.none
        );

        for (
          let index = cfg.loop.start;
          index < row.count;
          index += cfg.loop.step
        ) {
          const denominator = row.count - cfg.loop.step;
          const x = index / denominator;
          const isMajor = index % row.majorEvery === cfg.loop.start;
          const halfHeight = isMajor ? row.majorHalf : row.tickHalf;

          appendLine(
            tickLayer,
            { x, y: row.y - halfHeight },
            { x, y: row.y + halfHeight },
            row.className
          );
        }

        const denominator = row.count - cfg.loop.step;
        const nearestIndex = Math.round(cfg.value * denominator);
        const nearest = nearestIndex / denominator;
        const bendY = row.y - cfg.layout.bend;

        appendLine(
          roundingLayer,
          { x: nearest, y: row.y - cfg.layout.highlightHalf },
          { x: nearest, y: row.y + cfg.layout.highlightHalf },
          "nearest-tick"
        );

        appendPolyline(
          roundingLayer,
          [
            { x: cfg.value, y: row.y },
            { x: cfg.value, y: bendY },
            { x: nearest, y: bendY },
            { x: nearest, y: row.y - cfg.marker.arrowBack }
          ],
          "rounding-path"
        );

        appendPolygon(
          roundingLayer,
          [
            { x: nearest, y: row.y },
            {
              x: nearest - cfg.marker.arrowHalfWidth,
              y: row.y - cfg.marker.arrowBack
            },
            {
              x: nearest + cfg.marker.arrowHalfWidth,
              y: row.y - cfg.marker.arrowBack
            }
          ],
          "arrow-head"
        );

        appendCircle(
          roundingLayer,
          { x: cfg.value, y: row.y },
          cfg.marker.sourceRadius,
          "source-ring"
        );

        appendCircle(
          roundingLayer,
          { x: nearest, y: row.y },
          cfg.marker.targetRadius,
          "target-dot"
        );
      });

      appendLine(
        guideLayer,
        { x: cfg.value, y: cfg.layout.guideTopY },
        { x: cfg.value, y: cfg.layout.guideBottomY },
        "input-guide"
      );

      appendText(
        labelLayer,
        { x: cfg.value, y: cfg.layout.valueLabelY },
        cfg.text.value,
        "value-label",
        "middle",
        cfg.offsets.none,
        cfg.offsets.valueAbove
      );

      appendLine(
        guideLayer,
        { x: cfg.domain.start, y: cfg.layout.axisY },
        { x: cfg.domain.end, y: cfg.layout.axisY },
        "axis"
      );

      appendPolygon(
        guideLayer,
        [
          { x: cfg.domain.end, y: cfg.layout.axisY },
          {
            x: cfg.domain.end - cfg.layout.axisHeadBack,
            y: cfg.layout.axisY - cfg.layout.axisHeadHalf
          },
          {
            x: cfg.domain.end - cfg.layout.axisHeadBack,
            y: cfg.layout.axisY + cfg.layout.axisHeadHalf
          }
        ],
        "arrow-head"
      );

      appendText(
        labelLayer,
        { x: cfg.domain.start, y: cfg.layout.axisTextY },
        cfg.text.lower,
        "axis-label",
        "start",
        cfg.offsets.none,
        cfg.offsets.axisBelow
      );

      appendText(
        labelLayer,
        { x: cfg.domain.end, y: cfg.layout.axisTextY },
        cfg.text.higher,
        "axis-label",
        "end",
        cfg.offsets.none,
        cfg.offsets.axisBelow
      );

      appendCircle(
        labelLayer,
        { x: cfg.layout.legendSourceX, y: cfg.layout.legendY },
        cfg.marker.legendRadius,
        "legend-source"
      );

      appendText(
        labelLayer,
        { x: cfg.layout.legendSourceTextX, y: cfg.layout.legendY },
        cfg.text.sourceLegend,
        "legend",
        "start",
        cfg.offsets.none,
        cfg.offsets.none
      );

      appendCircle(
        labelLayer,
        { x: cfg.layout.legendTargetX, y: cfg.layout.legendY },
        cfg.marker.legendRadius,
        "legend-target"
      );

      appendText(
        labelLayer,
        { x: cfg.layout.legendTargetTextX, y: cfg.layout.legendY },
        cfg.text.targetLegend,
        "legend",
        "start",
        cfg.offsets.none,
        cfg.offsets.none
      );
    } catch (error) {
      const svg = document.getElementById("diagram");
      const namespace = "http://www.w3.org/2000/svg";

      while (svg.firstChild) {
        svg.removeChild(svg.firstChild);
      }

      const mainPoint = toPx({
        x: cfg.math.half,
        y: cfg.layout.fallbackY
      });
      const detailPoint = toPx({
        x: cfg.math.half,
        y: cfg.layout.fallbackDetailY
      });

      const main = document.createElementNS(namespace, "text");
      main.setAttribute("x", String(mainPoint.x));
      main.setAttribute("y", String(mainPoint.y));
      main.setAttribute("text-anchor", "middle");
      main.setAttribute("class", "fallback");
      main.textContent = cfg.text.fallback;
      svg.appendChild(main);

      const detail = document.createElementNS(namespace, "text");
      detail.setAttribute("x", String(detailPoint.x));
      detail.setAttribute("y", String(detailPoint.y));
      detail.setAttribute("text-anchor", "middle");
      detail.setAttribute("class", "fallback-detail");
      detail.textContent = cfg.text.fallbackDetail;
      svg.appendChild(detail);
    }
  </script>
</body>
</html>
