<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Как gamma определяет скорость исчезновения ошибки</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --ink: #172033;
      --muted: #58647a;
      --axis: #7b879c;
      --grid: #d9e0ea;
      --fast: #1677c8;
      --slow: #d65a34;
      --fast-fill: #e2f2ff;
      --slow-fill: #fff0e9;
      --target-fill: #eef1f6;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      width: 100%;
    }

    .figure {
      width: 100%;
      max-height: 520px;
      overflow: hidden;
      background: var(--bg);
    }

    .heading {
      padding: 18px 22px 8px;
    }

    h2 {
      margin: 0;
      font-size: 24px;
      font-weight: 720;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 17px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 430px;
      background: var(--bg);
    }

    text {
      font-family: inherit;
      font-size: 18px;
      fill: var(--ink);
    }

    .axis {
      stroke: var(--axis);
      fill: none;
    }

    .tick {
      stroke: var(--axis);
      fill: none;
    }

    .guide {
      stroke: var(--grid);
      fill: none;
    }

    .curve {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .curve-fast {
      stroke: var(--fast);
    }

    .curve-slow {
      stroke: var(--slow);
    }

    .dot-fast {
      fill: var(--fast);
      stroke: var(--bg);
    }

    .dot-slow {
      fill: var(--slow);
      stroke: var(--bg);
    }

    .label-fast {
      fill: var(--fast);
      font-weight: 720;
    }

    .label-slow {
      fill: var(--slow);
      font-weight: 720;
    }

    .axis-label,
    .tick-label {
      fill: var(--muted);
    }

    .target-label {
      fill: var(--ink);
      font-weight: 650;
    }

    .endpoint-label {
      font-weight: 720;
    }

    .endpoint-fast {
      fill: var(--fast);
    }

    .endpoint-slow {
      fill: var(--slow);
    }

    #fallback {
      display: none;
      margin: 18px 22px 24px;
      padding: 18px;
      color: var(--ink);
      background: var(--target-fill);
      font-size: 18px;
    }

    noscript {
      display: block;
      margin: 18px 22px 24px;
      padding: 18px;
      color: var(--ink);
      background: var(--target-fill);
      font-size: 18px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111722;
        --ink: #edf2fb;
        --muted: #aeb9ca;
        --axis: #8190a8;
        --grid: #303b4e;
        --fast: #62b9fa;
        --slow: #ff8b68;
        --fast-fill: #153047;
        --slow-fill: #45251d;
        --target-fill: #202a39;
      }
    }
  </style>
</head>
<body>
  <main class="figure" aria-labelledby="figure-title">
    <header class="heading">
      <h2 id="figure-title">Как γ определяет скорость исчезновения ошибки</h2>
      <p class="subtitle">Начальная ошибка e₀ = 1, цель — eₖ ≤ 10⁻⁶</p>
    </header>

    <svg
      id="chart"
      width="1040"
      height="430"
      viewBox="0 0 1040 430"
      role="img"
      aria-labelledby="svg-title svg-description"
      preserveAspectRatio="xMidYMid meet">
      <title id="svg-title">Скорость геометрического уменьшения ошибки</title>
      <desc id="svg-description">
        Две кривые начинаются с ошибки один. При гамма ноль целых девять
        десятых ошибка достигает десяти в минус шестой степени примерно за
        сто тридцать один проход, а при гамма ноль целых девяносто девять
        сотых — примерно за тысячу триста семьдесят пять проходов.
      </desc>
      <g id="drawing"></g>
    </svg>

    <div id="fallback" role="img" aria-label="Описание схемы">
      Обе ошибки убывают от 1 к 10⁻⁶. При γ = 0,9 для этого нужно примерно
      131 проход, а при γ = 0,99 — примерно 1375 проходов.
    </div>

    <noscript>
      Обе ошибки убывают от 1 к 10⁻⁶. При γ = 0,9 для этого нужно примерно
      131 проход, а при γ = 0,99 — примерно 1375 проходов.
    </noscript>
  </main>

  <script>
    "use strict";

    const data = [
      {
        gamma: 0.9,
        passes: 131,
        label: "γ = 0,9",
        curveClass: "curve-fast",
        dotClass: "dot-fast",
        labelClass: "label-fast",
        endpointClass: "endpoint-fast",
        offset: [1, 1]
      },
      {
        gamma: 0.99,
        passes: 1375,
        label: "γ = 0,99",
        curveClass: "curve-slow",
        dotClass: "dot-slow",
        labelClass: "label-slow",
        endpointClass: "endpoint-slow",
        offset: [1, -1]
      }
    ];

    const chartNumbers = {
      base: [0, 1],
      errorPowers: [0, 6],
      threshold: [1e-6],
      xTicks: [131, 1375]
    };

    const canvas = { width: 1040, height: 430 };
    const LABEL_PAD = 10;
    const LINE_WIDTH = 3;
    const FONT_SIZE = 18;

    const zero = chartNumbers.base.at(0);
    const one = chartNumbers.base.at(-1);
    const maxPower = chartNumbers.errorPowers.at(-1);
    const maxPasses = data.at(-1).passes;
    const curveCount = data.length;

    const origin = {
      x: FONT_SIZE * maxPower,
      y: canvas.height - FONT_SIZE * curveCount * curveCount
    };

    const scale = {
      x:
        (canvas.width - origin.x - FONT_SIZE * maxPower) /
        maxPasses,
      y:
        (origin.y - FONT_SIZE * curveCount) /
        maxPower
    };

    function sx(x) {
      return origin.x + x * scale.x;
    }

    function sy(y) {
      return origin.y - y * scale.y;
    }

    try {
      const svg = document.getElementById("chart");
      const drawing = document.getElementById("drawing");
      const fallback = document.getElementById("fallback");
      const namespace = svg.namespaceURI;

      function node(name, attributes, className) {
        const element = document.createElementNS(namespace, name);

        for (const [key, value] of Object.entries(attributes)) {
          element.setAttribute(key, String(value));
        }

        if (className) {
          element.setAttribute("class", className);
        }

        return element;
      }

      function line(xStart, yStart, xEnd, yEnd, className) {
        return node(
          "line",
          {
            x1: sx(xStart),
            y1: sy(yStart),
            x2: sx(xEnd),
            y2: sy(yEnd),
            "stroke-width": LINE_WIDTH
          },
          className
        );
      }

      function textAt(
        content,
        xValue,
        yValue,
        offsetX,
        offsetY,
        anchor,
        className
      ) {
        const label = node(
          "text",
          {
            x: sx(xValue) + offsetX * LABEL_PAD,
            y: sy(yValue) + offsetY * LABEL_PAD,
            "text-anchor": anchor,
            "font-size": FONT_SIZE
          },
          className
        );

        label.textContent = content;
        return label;
      }

      function errorHeight(series, pass) {
        const retainedPower =
          maxPower + pass * Math.log10(series.gamma);

        return Math.max(zero, retainedPower);
      }

      function curvePath(series) {
        const commands = [];

        for (
          let pass = zero;
          pass <= series.passes;
          pass += one
        ) {
          const command = pass === zero ? "M" : "L";
          const height = errorHeight(series, pass);

          commands.push(
            command + sx(pass) + " " + sy(height)
          );
        }

        return commands.join(" ");
      }

      const tickWorldX = LABEL_PAD / scale.x;
      const tickWorldY = LABEL_PAD / scale.y;
      const halfPasses = maxPasses / curveCount;

      drawing.append(
        line(zero, zero, maxPasses, zero, "axis"),
        line(zero, zero, zero, maxPower, "axis"),
        line(zero, maxPower, maxPasses, maxPower, "guide")
      );

      for (const power of chartNumbers.errorPowers) {
        drawing.append(
          line(
            zero - tickWorldX,
            power,
            zero,
            power,
            "tick"
          )
        );

        const label =
          power === zero ? "10⁻⁶" : "1";

        drawing.append(
          textAt(
            label,
            zero,
            power,
            -one,
            zero,
            "end",
            "tick-label"
          )
        );
      }

      for (const pass of chartNumbers.xTicks) {
        drawing.append(
          line(
            pass,
            zero,
            pass,
            zero - tickWorldY,
            "tick"
          ),
          textAt(
            String(pass),
            pass,
            zero,
            zero,
            curveCount + one,
            "middle",
            "tick-label"
          )
        );
      }

      drawing.append(
        textAt(
          "ошибка eₖ",
          zero,
          maxPower,
          one,
          -one,
          "start",
          "axis-label"
        ),
        textAt(
          "число проходов k",
          halfPasses,
          zero,
          zero,
          curveCount + one,
          "middle",
          "axis-label"
        ),
        textAt(
          "цель: eₖ ≤ 10⁻⁶",
          halfPasses,
          zero,
          zero,
          -one,
          "middle",
          "target-label"
        )
      );

      for (const series of data) {
        const path = node(
          "path",
          {
            d: curvePath(series),
            "stroke-width": LINE_WIDTH
          },
          "curve " + series.curveClass
        );

        const endpointHeight =
          errorHeight(series, series.passes);

        const endpoint = node(
          "circle",
          {
            cx: sx(series.passes),
            cy: sy(endpointHeight),
            r: LINE_WIDTH * curveCount,
            "stroke-width": LINE_WIDTH
          },
          series.dotClass
        );

        const labelPass = series.passes / curveCount;
        const labelHeight =
          errorHeight(series, labelPass);

        const curveLabel = textAt(
          series.label,
          labelPass,
          labelHeight,
          series.offset.at(zero),
          -series.offset.at(one),
          "start",
          series.labelClass
        );

        const endpointAnchor =
          series.passes === maxPasses ? "end" : "start";

        const endpointOffset =
          series.passes === maxPasses ? -one : one;

        const endpointText =
          series.passes === maxPasses
            ? "≈ 1375 проходов"
            : "≈ 131 проход";

        const endpointLabel = textAt(
          endpointText,
          series.passes,
          endpointHeight,
          endpointOffset,
          -one,
          endpointAnchor,
          "endpoint-label " + series.endpointClass
        );

        drawing.append(
          path,
          endpoint,
          curveLabel,
          endpointLabel
        );
      }

      const startPoint = node(
        "circle",
        {
          cx: sx(zero),
          cy: sy(maxPower),
          r: LINE_WIDTH * curveCount,
          "stroke-width": LINE_WIDTH
        },
        "dot-fast"
      );

      drawing.append(startPoint);

      if (!drawing.childNodes.length) {
        throw new Error("Диаграмма не построена");
      }

      fallback.style.display = "none";
    } catch (error) {
      document.getElementById("chart").style.display = "none";
      document.getElementById("fallback").style.display = "block";
    }
  </script>
</body>
</html>
