- concept: итерация по политике чередует точную оценку фиксированной политики и её жадное улучшение
  question: Расположите этапы итерации по политике в правильном порядке.
  explanation: Во время оценки политика остаётся фиксированной. После сходимости её делают жадной относительно полученной функции ценности, а изменённую политику оценивают заново.
  kind: order
  items:
    - Зафиксировать текущую политику
    - Вычислить функцию ценности этой политики до сходимости
    - Выбрать в каждом состоянии действие, жадное относительно вычисленных ценностей
    - Повторить цикл, если политика изменилась
  id: 004-policy-iteration-1
  fingerprint: 8bea89db
- concept: неизменность политики после жадного улучшения служит условием остановки итерации по политике
  question: Оценка текущей политики выполнена точно. Затем в каждом состоянии выбрали жадное действие относительно её функции ценности, но политика нигде не изменилась. Какой вывод верен?
  explanation: Если жадное улучшение не меняет политику, она уже согласована со своей функцией ценности. При точной оценке это условие оптимальности, поэтому дальнейшие циклы ничего не изменят.
  kind: choice
  options:
    - 'Итерацию по политике можно завершить: политика стабильна относительно своей функции ценности'
    - Нужно обнулить функцию ценности и продолжить оценку той же политики
    - Следует выбрать наименее ценное действие, чтобы выйти из неподвижной точки
  correct: 0
  id: 004-policy-iteration-2
  fingerprint: 83a0ec60
- concept: сходимость итерации по политике следует из монотонного улучшения и конечности множества детерминированных политик
  question: Почему при точной оценке политики итерация по политике в конечной MDP не может бесконечно переходить между всё новыми детерминированными политиками?
  explanation: 'Ключевы два свойства: шаг улучшения монотонен, а множество детерминированных политик конечно. Поэтому алгоритм за конечное число изменений достигает стабильной политики.'
  kind: open
  reference: Жадное улучшение либо оставляет политику прежней, либо повышает её ценность хотя бы в одном состоянии, не ухудшая остальные. Поскольку возможных детерминированных политик конечное число, бесконечная последовательность строгих улучшений невозможна.
  id: 004-policy-iteration-3
  fingerprint: 0a893a2a
