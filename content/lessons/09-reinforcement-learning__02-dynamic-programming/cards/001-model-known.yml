- concept: ожидаемая награда действия равна сумме наград исходов, взвешенных по их вероятностям
  question: Действие приносит награду 14 с вероятностью 65% и награду −2 с вероятностью 35%. Чему равна ожидаемая немедленная награда?
  explanation: 'Нужно учесть каждый исход с его вероятностью: 0.65 × 14 + 0.35 × (−2) = 8.4. Модель позволяет вычислить это ожидание без многократного разыгрывания действия.'
  kind: numeric
  answer: 8.4
  tolerance: 0.01
