- concept: детерминированную политику можно представить как вырожденное распределение действий
  question: Функция оценки политики ожидает распределение вероятностей действий, а политика хранит одно выбранное действие для каждого состояния. Как правильно согласовать эти форматы?
  explanation: 'Детерминированная политика является частным случаем стохастической: выбранное действие получает всю вероятностную массу, а остальные — нулевую. Такое представление подходит интерфейсу policy_evaluation.'
  kind: choice
  options:
    - Возвращать распределение, в котором вся вероятностная масса сосредоточена на выбранном действии
    - Передавать строку с выбранным действием без преобразования
    - Равномерно распределять массу между всеми допустимыми действиями
    - Подставлять вместо распределения значения функции ценности
  correct: 0
  id: 033-policy-iteration-code-1
  fingerprint: 9a67a33e
- concept: ограничение внешнего цикла является защитой от ошибки, а не критерием сходимости
  question: Объясни своими словами, почему исчерпание ограничения внешнего цикла policy_iteration нельзя считать успешной сходимостью.
  explanation: В нормальной работе функция возвращает результат, когда улучшенная политика совпадает с текущей. Если цикл завершился только из-за защитного ограничения, алгоритм не подтвердил, что политика стабилизировалась.
  kind: open
  reference: Успешная сходимость подтверждается стабилизацией политики после жадного улучшения. Ограничение числа итераций лишь предотвращает бесконечную работу при ошибке в оценке, улучшении или преобразовании форматов; его исчерпание следует считать диагностическим признаком проблемы.
  id: 033-policy-iteration-code-2
  fingerprint: e50ed99f
