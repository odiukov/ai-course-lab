- concept: ценность бесконечного самоперехода равна сумме дисконтированного потока одинаковых наград
  question: Политика бесконечно оставляет агента в одном состоянии с наградой −7 за каждый шаг. Коэффициент дисконтирования равен 0.8. Чему равна ценность этого состояния?
  explanation: Ценность удовлетворяет уравнению V = −7 + 0.8V, поэтому V = −7 / (1 − 0.8) = −35. Так возникает большая отрицательная ценность политики, которая снова и снова упирается в границу.
  kind: numeric
  answer: -35
  tolerance: 0.03
  id: 032-policy-loop-1
  fingerprint: 29c40335
- concept: оценка старой политики не является оценкой политики, полученной после жадного улучшения
  question: Функцию V вычислили для политики π, после чего жадное улучшение изменило её и создало политику π′. Как получить точную функцию ценности, которую можно вернуть вместе с π′?
  explanation: После изменения хотя бы одного действия прежняя функция ценности описывает продолжение по π, а не по π′. Новую политику нужно оценить заново; исключение — случай стабильности, когда π′ совпадает с π.
  kind: choice
  options:
    - 'Вернуть прежнюю V: изменение действий не влияет на ценности состояний'
    - Выполнить один оптимальный бэкап прежней V
    - Обнулить V и ещё раз улучшить π′ без оценки
    - Оценить π′ до сходимости, поскольку прежняя V соответствует политике π
  correct: 3
  id: 032-policy-loop-2
