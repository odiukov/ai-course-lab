- concept: поиск по дереву выполняет беллмановские обновления выборочно по посещённым продолжениям
  question: Почему планирование с поиском по дереву можно считать асинхронным вариантом динамического программирования?
  explanation: Полный DP-проход перебирает всё пространство состояний, а поиск по дереву разворачивает лишь часть возможных продолжений. Оценки найденных листьев распространяются к предкам с помощью беллмановских по смыслу бэкапов.
  kind: choice
  options:
    - Поиск обновляет оценки только для выбранных и посещённых ветвей, распространяя результаты назад по дереву
    - Поиск одновременно пересчитывает ценности всех состояний модели
    - Поиск заменяет ожидаемые ценности случайно выбранными наградами без резервных обновлений
    - Поиск применим только после точного вычисления глобальной функции ценности
  correct: 0
  id: 036-dp-use-1
  fingerprint: 737a909b
- concept: консервативная Q-итерация штрафует действия, слабо представленные в офлайн-данных
  question: Какое изменение отличает консервативную Q-итерацию в offline RL от обычного оптимального Q-бэкапа?
  explanation: Офлайн-алгоритм не может безопасно проверить произвольное действие в среде. Поэтому консервативное обновление понижает оценки действий, которые плохо поддерживаются данными, и не даёт оптимизации воспользоваться необоснованно завышенными Q-значениями.
  kind: choice
  options:
    - Она запрещает использовать награды из набора данных
    - Она добавляет штраф за действия вне распределения собранных данных
    - Она заменяет максимум по действиям равномерным усреднением
    - Она обновляет только терминальные состояния
  correct: 1
  id: 036-dp-use-2
  fingerprint: cc695f39
- concept: оптимальная функция ценности является неподвижной точкой оптимального оператора Беллмана
  question: Заполни уравнение, выражающее неподвижность оптимальной функции ценности относительно оптимального оператора Беллмана T*.
  explanation: Применение оптимального беллмановского бэкапа к сошедшейся V* уже не меняет её. Поэтому обозначения V* и Q* указывают на решение соответствующего уравнения неподвижной точки.
  kind: cloze
  template: V* = ___
  answer: T*(V*)
  accept:
    - T*V*
    - T^*(V^*)
    - 𝒯*(V*)
