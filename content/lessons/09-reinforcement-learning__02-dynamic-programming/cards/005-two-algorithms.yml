- concept: итерация по политике и итерация по ценности различаются организацией вычислений, но ищут одну оптимальную политику
  question: Объясни своими словами, чем различается ритм вычислений в итерации по политике и итерации по ценности и к какому результату стремятся оба алгоритма.
  explanation: 'Различие состоит не в цели и не в точности конечного решения, а в упаковке работы: отдельные фазы оценки и улучшения против небольшого улучшения на каждом обновлении ценностей.'
  kind: open
  reference: Итерация по политике разделяет вычисления на оценку текущей политики до сходимости и последующее жадное улучшение. Итерация по ценности на каждом проходе применяет максимум по действиям, совмещая оценку с улучшением. При стандартных условиях оба алгоритма стремятся получить оптимальную функцию ценности и соответствующую оптимальную политику.
