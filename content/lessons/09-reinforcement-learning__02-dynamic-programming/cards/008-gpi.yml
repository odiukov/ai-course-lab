- concept: GPI допускает улучшение политики до полной сходимости её оценки
  question: Критик сделал лишь несколько обновлений функции ценности, после чего актёр улучшил политику по текущим оценкам. Затем цикл продолжился. Совместима ли такая схема с обобщённой итерацией по политике?
  explanation: GPI не задаёт жёсткую длину фаз. Критик может лишь приблизить ценности текущей политики, после чего актёр уже обновит политику; дальнейшие чередования продолжают вести обе величины к согласованности.
  kind: choice
  options:
    - Да, GPI допускает чередование неполной оценки и улучшения политики
    - Нет, актёр может обновляться только после точного вычисления функции ценности
    - Нет, в GPI политика должна оставаться фиксированной до конца обучения
    - Да, но только если критик после каждого обновления посещает все состояния
  correct: 0
  id: 008-gpi-1
  fingerprint: 87f3807b
- concept: actor-critic является реализацией GPI через взаимосвязанные обновления критика и актёра
  question: Объясни своими словами, почему метод actor-critic можно рассматривать как обобщённую итерацию по политике.
  explanation: 'В GPI важен не конкретный табличный алгоритм, а связь двух процессов: оценки текущего поведения и улучшения поведения по этой оценке. В actor-critic эти роли обычно выполняют две обучаемые модели.'
  kind: open
  reference: Критик приближает ценность поведения, задаваемого текущей политикой, а актёр изменяет эту политику, используя оценки критика. Обновление одного меняет задачу другого, поэтому их чередующиеся или параллельные обновления постепенно согласуют ценности и поведение.
  id: 008-gpi-2
  fingerprint: '14394712'
