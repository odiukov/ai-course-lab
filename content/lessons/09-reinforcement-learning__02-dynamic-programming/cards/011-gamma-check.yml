- concept: обязательное завершение процесса позволяет корректно рассматривать недисконтированную задачу
  question: Почему обязательное достижение терминального состояния может вернуть гарантию вычисления ценностей при отсутствии дисконтирования?
  explanation: При gamma = 1 оператор в общем случае не является строгим сжатием. Но если процесс обязательно заканчивается, последовательность будущих наград обрывается, поэтому ценности можно вычислять без дисконтирования.
  kind: open
  reference: После завершения процесса будущих наград больше нет, поэтому сумма возврата не получает бесконечного хвоста. Конечный горизонт или гарантированное завершение заменяют затухание, которое в дисконтированной задаче обеспечивала gamma меньше 1.
  id: 011-gamma-check-2
