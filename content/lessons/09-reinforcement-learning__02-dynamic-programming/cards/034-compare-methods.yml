- concept: скорость алгоритмов имеет смысл сравнивать только при сопоставимом качестве полученных решений
  question: Почему перед выводом о том, какой метод быстрее, нужно сопоставить итоговые функции ценности и политики?
  explanation: Честное сравнение отделяет стоимость вычислений от качества результата. Различающиеся политики не обязательно различаются по качеству, если в состояниях есть несколько равноценных действий.
  kind: open
  reference: Меньшее время или число бэкапов не означает победу, если алгоритм остановился с менее точным решением. Следует проверить близость значений и эквивалентность качества политик, учитывая, что при ничьей разные жадные действия могут быть одинаково оптимальны.
