- concept: условие равенства бэкапа политики и оптимального бэкапа
  question: Объясните своими словами, когда бэкап фиксированной политики в состоянии совпадает с оптимальным бэкапом.
  explanation: Если все действия, которые может выбрать политика, максимизируют бэкап, их взвешенное среднее равно максимуму. Вероятность хотя бы одного менее ценного действия делает среднее меньше.
  kind: open
  reference: Они совпадают, если политика назначает положительную вероятность только действиям, достигающим максимального ожидаемого бэкапа в этом состоянии.
  id: 007-algorithms-check-2
  fingerprint: 5fb18501
