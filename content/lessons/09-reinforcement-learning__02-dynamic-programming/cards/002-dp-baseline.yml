- concept: DP позволяет измерить, насколько обученная политика приблизилась к оптимальной
  question: Агент стабильно достигает цели, но неизвестно, выбрал ли он оптимальный маршрут. Какая проверка даст наиболее точный ответ?
  explanation: Рост награды и достижение цели показывают, что агент чему-то научился, но не доказывают оптимальность. DP даёт точные оптимальные значения и политику для данного MDP, поэтому расхождение с ними можно измерить напрямую.
  kind: choice
  options:
    - Сравнить значения и действия обученного агента с оптимальными значениями и политикой, вычисленными через DP
    - Убедиться, что средняя награда во время обучения росла
    - Проверить, что агент хотя бы иногда достигает цели
    - Продолжать обучение, пока поведение визуально не перестанет меняться
  correct: 0
  id: 002-dp-baseline-1
  fingerprint: 468f95a5
- concept: сравнение обучаемого метода с DP корректно только при одинаковой постановке MDP
  question: Оценка начального состояния у Q-learning отличается от результата DP, но методы использовали разные коэффициенты дисконтирования. Что можно заключить?
  explanation: Коэффициент дисконтирования определяет ценность будущих наград и может изменить оптимальные значения и политику. Для содержательной проверки переходы, награды и дисконтирование должны совпадать.
  kind: choice
  options:
    - 'Расхождение само по себе не указывает на ошибку: методы решали разные задачи'
    - В реализации Q-learning обязательно неверный знак награды
    - DP не подходит для проверки Q-learning
    - Q-learning обязательно сошёлся к худшей политике
  correct: 0
  id: 002-dp-baseline-2
  fingerprint: e5fb5135
- concept: DP-эталон помогает различать систематическую ошибку и разброс между запусками обучения
  question: Объясни своими словами, зачем сравнивать несколько запусков Q-learning с одним и тем же результатом DP.
  explanation: DP для фиксированного MDP возвращает одну и ту же контрольную точку, тогда как обучение по сэмплам зависит от случайности. Поэтому серия запусков показывает отдельно устойчивое смещение и вариативность результата.
  kind: open
  reference: Неизменный DP-эталон позволяет увидеть как систематическое отклонение обучаемого метода от оптимума, так и случайный разброс между запусками. Стабильное расхождение может указывать на ошибку реализации или настройки, а сильно меняющиеся результаты — на высокую вариативность обучения.
  id: 002-dp-baseline-3
  fingerprint: 0d49a7c1
