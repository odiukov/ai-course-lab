- concept: остаток оптимального уравнения Беллмана даёт верхнюю оценку ошибки функции ценности
  question: В дисконтированной MDP коэффициент дисконтирования равен 0.8, а максимальный остаток оптимального уравнения Беллмана для кандидата V равен 0.014. Какова гарантированная верхняя граница расстояния до V* в sup-норме?
  explanation: 'Граница равна остатку, делённому на запас коэффициента дисконтирования до единицы: 0.014 / 0.2 = 0.07. Малый остаток означает, что V близка к неподвижной точке оптимального оператора Беллмана.'
  kind: numeric
  answer: 0.07
