- concept: выравнивание ошибки при росте глубины оценки означает убывающую отдачу от дополнительных оценочных проходов
  question: В эксперименте ошибку решения строят как функцию числа оценочных проходов между улучшениями политики. Сначала ошибка быстро уменьшается, а затем кривая почти выравнивается. Как это лучше интерпретировать?
  explanation: 'Первые дополнительные проходы заметно уточняют ценности, но последующие корректируют их всё слабее. Поэтому большое k не обязательно выгодно: время может расходоваться на точную оценку политики, которая вскоре изменится.'
  kind: choice
  options:
    - После выравнивания политику больше нельзя улучшить
    - Дополнительные оценочные проходы дают всё меньшую пользу по сравнению с их вычислительной стоимостью
    - Оценка политики перестала использовать модель переходов
    - Жадное улучшение стало случайным
