- concept: вероятности разных ветвей суммируются, если они приводят к одному и тому же исходу
  question: У границы поля несколько фактических направлений могут привести в одно следующее состояние. Заполни формулу его итоговой вероятности.
  explanation: Каждая ветвь скольжения сохраняет свою вероятность. Если разные направления после применения границ дают одинаковые следующее состояние и награду, их можно оставить отдельными исходами либо объединить, сложив вероятности.
