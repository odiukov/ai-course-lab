- concept: сжимающий оператор Беллмана не может иметь две различные неподвижные точки
  question: Пусть оператор Беллмана T является γ-сжатием в sup-норме при γ < 1. Почему у него не может быть двух различных неподвижных точек U и W?
  explanation: Если TU = U и TW = W, то ||TU − TW||∞ = ||U − W||∞. Одновременно свойство сжатия даёт ||TU − TW||∞ ≤ γ||U − W||∞. При γ < 1 это возможно только при ||U − W||∞ = 0, поэтому U = W.
  kind: choice
  options:
    - Для неподвижных точек расстояние после применения T сохраняется, но сжатие требует уменьшить любое положительное расстояние
    - Максимум по действиям всегда выбирает одно и то же действие во всех состояниях
    - Все начальные функции ценности становятся одинаковыми уже после первого бэкапа
    - Награды в MDP обязательно неотрицательны
  correct: 0
  id: 009-contraction-1
  fingerprint: 2061a40a
- concept: расхождение между итерациями Беллмана убывает геометрически
  question: Две функции ценности первоначально различаются в sup-норме на 32. Оператор Беллмана имеет коэффициент сжатия 0.75. Какова верхняя граница расстояния между функциями после 4 одинаковых бэкапов?
  explanation: После каждого бэкапа расстояние умножается не более чем на коэффициент сжатия. Поэтому граница равна 32 · 0.75⁴ = 10.125.
  kind: numeric
  answer: 10.125
  tolerance: 0.001
  id: 009-contraction-2
  fingerprint: 4a6ca313
- concept: при отсутствии строгого сжатия аргумент единственности неподвижной точки перестаёт работать
  question: Объясни своими словами, почему неравенство ||TU − TW||∞ ≤ ||U − W||∞ само по себе не доказывает единственность неподвижной точки.
  explanation: Ключевой шаг доказательства — противоречие между сохранением положительного расстояния у неподвижных точек и его строгим уменьшением. Если оператор лишь не увеличивает расстояние, противоречия нет.
  kind: open
  reference: Такое неравенство разрешает расстоянию между функциями остаться прежним. Поэтому две различные неподвижные точки могут сохранять положительное расстояние и не противоречить условию. Для доказательства единственности нужен коэффициент строго меньше единицы либо дополнительные свойства задачи.
  id: 009-contraction-3
  fingerprint: 2102a267
