- concept: выбор между итерацией по политике и итерацией по ценности должен быть обоснован вычислительными характеристиками MDP
  question: Объясни своими словами, какие свойства MDP должны фигурировать в обосновании выбора между итерацией по политике и итерацией по ценности.
  explanation: Размеры |S| и |A| определяют объём вычислений при бэкапах и оценке политики. Значение γ связано со скоростью исчезновения ошибки. Поэтому выбор алгоритма должен опираться на эти характеристики, а не только на предпочтение разработчика.
  kind: open
  reference: Следует учитывать размеры пространства состояний и действий, определяющие стоимость проходов и оценки политики, а также коэффициент дисконтирования, влияющий на скорость сжатия и сходимости. Простого утверждения, что один алгоритм привычнее или проще, недостаточно.
