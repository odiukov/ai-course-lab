- concept: табличный DP-решатель обязан отклонять задачи за пределами установленного ограничения на размер пространства состояний
  question: Число состояний MDP превышает жёсткий предел, установленный контрактом табличного DP-решателя. Какое поведение соответствует контракту?
  explanation: Контракт требует отказа при пространстве более 10⁷ состояний. Молчаливая смена алгоритма уже не является точным табличным DP, а запуск до исчерпания ресурсов нарушает заранее заданную границу допустимости.
  kind: choice
  options:
    - Запустить вычисления и прервать их только при нехватке памяти
    - Молча заменить точные бэкапы сэмплированием переходов
    - Отказаться от запуска и явно сообщить о нарушении ограничения
  correct: 2
