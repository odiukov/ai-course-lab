- concept: условие остановки по sup-норме ограничивает изменение каждого состояния за последний проход, но не гарантирует абсолютную точность
  question: После полного прохода динамического программирования получено Δ = max_s |V_new(s) − V(s)| < ε. Что из этого следует непосредственно?
  explanation: Если максимум всех модулей изменений меньше ε, то и каждое отдельное изменение меньше ε. Это практический критерий остановки, а не доказательство нулевой ошибки относительно точного решения.
  kind: choice
  options:
    - Ценность каждого состояния изменилась за проход меньше чем на ε
    - Среднее изменение ценностей меньше ε, но отдельные изменения могут быть любыми
    - Полученная функция ценности абсолютно точно совпадает с неподвижной точкой
