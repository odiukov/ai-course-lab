- concept: дисконтирование применяется к ценности следующего состояния, а не к немедленной награде
  question: Восстановите множитель при ценности следующего состояния в модельном Q-бэкапе.
  explanation: В каждой ветви немедленная награда r учитывается без дисконтирования, а будущая ценность V(s') умножается на γ. Затем вклады всех ветвей взвешиваются их вероятностями.
  kind: cloze
  template: Q_V(s,a) = Σ_{s',r} P(s',r | s,a) [r + ___ V(s')]
  answer: γ
  accept:
    - gamma
    - гамма
