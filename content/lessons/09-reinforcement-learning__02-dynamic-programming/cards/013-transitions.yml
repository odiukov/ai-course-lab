- concept: общая вероятность соскальзывания поровну делится между перпендикулярными направлениями
  question: В GridWorld суммарная вероятность соскальзывания равна 0.24 и поровну распределяется между обоими перпендикулярными направлениями. Какова вероятность каждого такого исхода?
  explanation: 'Каждое перпендикулярное направление получает половину общей вероятности соскальзывания: 0.24 / 2 = 0.12. Аналогично, в уроке вероятность 0.1 делится на две ветви по 0.05.'
  kind: numeric
  answer: 0.12
  tolerance: 0.001
  id: 013-transitions-1
  fingerprint: e8900309
- concept: обработку столкновения с границей следует оставлять функции перемещения
  question: Функция apply_move уже возвращает исходное состояние, если движение упирается в границу GridWorld. Что должна сделать transitions с таким результатом?
  explanation: transitions не должна повторно реализовывать правила геометрии среды. Она сохраняет состояние от apply_move вместе с наградой и вероятностью, поэтому столкновение с границей становится обычным исходом с переходом в ту же клетку.
  kind: choice
  options:
    - Отбросить этот исход как невозможный
    - Добавить исход с состоянием, которое вернула apply_move
    - Перераспределить его вероятность между остальными направлениями
    - Повторять движение, пока не получится выйти в другую клетку
  correct: 1
  id: 013-transitions-2
  fingerprint: 8465994d
- concept: терминальное состояние моделируется отдельным поглощающим переходом
  question: Что должна возвращать модель переходов для терминального состояния и почему этот случай удобно обработать до перебора направлений?
  explanation: В реализации терминальный исход записан как (TERMINAL, 0.0, 1.0). После раннего возврата основной цикл обрабатывает только обычные клетки.
  kind: open
  reference: Она должна вернуть единственный достоверный переход в то же терминальное состояние без награды. Ранняя ветка не позволяет применять к терминальному состоянию обычные движения и штраф за шаг.
  id: 013-transitions-3
