- concept: in-place обновление может распространять ценность через несколько состояний за один обход
  question: Дана детерминированная цепочка W → X → Y → Z. Действие в Z приносит положительную награду и завершает эпизод, коэффициент дисконтирования положителен, а начальные ценности всех состояний одинаковы. Состояния обновляют в порядке Z, Y, X, W. Какое утверждение верно после первого обхода?
  explanation: Синхронный обход вычисляет все новые значения по одной старой таблице, поэтому сигнал проходит лишь к ближайшему состоянию. При in-place обновлении Y читает уже изменённое Z, затем X читает изменённое Y, а W — изменённое X.
  kind: choice
  options:
    - Синхронный способ распространит награду до W, а in-place изменит только Z
    - Оба способа изменят только Z
    - In-place способен распространить положительную ценность до W, а синхронный способ — нет
    - Ни один способ не изменит ценности, поскольку они были одинаковыми
  correct: 2
  id: 020-update-styles-1
  fingerprint: 7bd614ec
- concept: порядок обхода влияет на скорость in-place обновлений, но не меняет неподвижную точку
  question: Почему обход цепочки от состояний, далёких от награды, к состояниям рядом с наградой уменьшает преимущество in-place обновлений? Почему итоговая сошедшаяся функция ценности при этом остаётся прежней?
  explanation: Гаусс — Зейдель ускоряется лишь тогда, когда порядок позволяет следующим состояниям использовать свежие значения. Расписание обновлений меняет маршрут к решению, но не само решение уравнения Беллмана.
  kind: open
  reference: Ранние состояния обновляются до того, как изменятся состояния, от которых зависят их бэкапы, поэтому читают устаревшие значения и сигнал распространяется медленнее. Порядок меняет промежуточные приближения, но при сходимости старые и только что обновлённые значения совпадают, а функция ценности удовлетворяет тому же уравнению Беллмана.
  id: 020-update-styles-2
  fingerprint: 34aab9a0
