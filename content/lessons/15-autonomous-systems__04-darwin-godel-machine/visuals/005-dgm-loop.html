<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Цикл открытого поиска DGM</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f8fb;
    --panel: #ffffff;
    --panel-soft: #eef2f7;
    --text: #172033;
    --muted: #5f6b7c;
    --line: #526174;
    --blue: #2f6fed;
    --blue-soft: #dce8ff;
    --violet: #7555d9;
    --violet-soft: #e9e1ff;
    --green: #168764;
    --green-soft: #d8f2e8;
    --amber: #b66a00;
    --amber-soft: #fff0cf;
    --archive: #eff7ff;
    --archive-edge: #3972aa;
    --shadow: #c8d2df;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111723;
      --panel: #182130;
      --panel-soft: #202b3b;
      --text: #edf3ff;
      --muted: #aebbd0;
      --line: #9bacbf;
      --blue: #79a7ff;
      --blue-soft: #213b65;
      --violet: #b49cff;
      --violet-soft: #392f62;
      --green: #69d8b1;
      --green-soft: #173f36;
      --amber: #ffc66d;
      --amber-soft: #49371c;
      --archive: #192f46;
      --archive-edge: #70a9dc;
      --shadow: #0b1019;
    }
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  h1 {
    font-size: 22px;
    font-weight: bold;
  }

  svg {
    display: block;
    width: 100%;
    max-width: 1200px;
    height: auto;
    background: var(--bg);
  }

  .panel {
    fill: var(--panel);
    stroke: var(--shadow);
    stroke-width: 1.5;
  }

  .node {
    stroke-width: 2.2;
  }

  .node-blue {
    fill: var(--blue-soft);
    stroke: var(--blue);
  }

  .node-violet {
    fill: var(--violet-soft);
    stroke: var(--violet);
  }

  .node-green {
    fill: var(--green-soft);
    stroke: var(--green);
  }

  .node-amber {
    fill: var(--amber-soft);
    stroke: var(--amber);
  }

  .archive {
    fill: var(--archive);
    stroke: var(--archive-edge);
    stroke-width: 2.4;
  }

  .archive-card {
    fill: var(--panel);
    stroke: var(--archive-edge);
    stroke-width: 1.5;
  }

  .archive-mark-blue {
    fill: var(--blue);
  }

  .archive-mark-violet {
    fill: var(--violet);
  }

  .archive-mark-green {
    fill: var(--green);
  }

  .flow {
    fill: none;
    stroke: var(--line);
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .flow-accent {
    stroke: var(--blue);
  }

  .arrowhead {
    fill: var(--line);
  }

  .arrowhead-accent {
    fill: var(--blue);
  }

  .axis {
    fill: none;
    stroke: var(--line);
    stroke-width: 1.8;
    stroke-linecap: round;
  }

  .growth {
    fill: none;
    stroke: var(--green);
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .growth-head {
    fill: var(--green);
  }

  .score-start {
    fill: var(--amber-soft);
    stroke: var(--amber);
    stroke-width: 2.4;
  }

  .score-end {
    fill: var(--green-soft);
    stroke: var(--green);
    stroke-width: 2.8;
  }

  text {
    fill: var(--text);
    font-size: 15px;
  }

  .title {
    font-size: 17px;
    font-weight: bold;
  }

  .label {
    font-size: 14px;
    font-weight: bold;
  }

  .small {
    fill: var(--muted);
    font-size: 13px;
  }

  .score {
    font-size: 24px;
    font-weight: bold;
  }

  .legend {
    fill: var(--muted);
    font-size: 14px;
  }

  .divider {
    stroke: var(--shadow);
    stroke-width: 1.5;
  }
</style>
</head>
<body>
<h1 id="diagram-heading">Цикл открытого поиска DGM</h1>

<svg id="diagram"
     viewBox="0 0 1200 430"
     width="1200"
     height="430"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-labelledby="diagram-heading diagram-description">
  <title>Цикл открытого поиска DGM</title>
  <desc id="diagram-description">
    Исходного агента оценивают, помещают в архив, выбирают родителя,
    изменяют его обвес, снова оценивают и возвращают новый вариант в архив.
    Рядом показан рост результата SWE-bench с 20% до 50%.
  </desc>
</svg>

<script>
const diagramData = {
  shapes: [
    {
      kind: "rect", className: "panel",
      x: 22, y: 25, w: 750, h: 355, r: 18
    },
    {
      kind: "rect", className: "panel",
      x: 792, y: 25, w: 366, h: 355, r: 18
    },
    {
      kind: "rect", className: "node node-blue",
      x: 42, y: 154, w: 105, h: 72, r: 14
    },
    {
      kind: "rect", className: "node node-amber",
      x: 190, y: 146, w: 128, h: 88, r: 14
    },
    {
      kind: "rect", className: "archive",
      x: 364, y: 102, w: 174, h: 170, r: 16
    },
    {
      kind: "rect", className: "archive-card",
      x: 388, y: 157, w: 126, h: 25, r: 7
    },
    {
      kind: "rect", className: "archive-mark-blue",
      x: 397, y: 164, w: 36, h: 11, r: 5
    },
    {
      kind: "rect", className: "archive-card",
      x: 388, y: 188, w: 126, h: 25, r: 7
    },
    {
      kind: "rect", className: "archive-mark-violet",
      x: 397, y: 195, w: 58, h: 11, r: 5
    },
    {
      kind: "rect", className: "archive-card",
      x: 388, y: 219, w: 126, h: 25, r: 7
    },
    {
      kind: "rect", className: "archive-mark-green",
      x: 397, y: 226, w: 45, h: 11, r: 5
    },
    {
      kind: "rect", className: "node node-violet",
      x: 590, y: 67, w: 153, h: 76, r: 14
    },
    {
      kind: "rect", className: "node node-blue",
      x: 590, y: 191, w: 153, h: 88, r: 14
    },
    {
      kind: "rect", className: "node node-green",
      x: 364, y: 300, w: 174, h: 72, r: 14
    }
  ],
  dividers: [
    { x1: 808, y1: 112, x2: 1142, y2: 112 }
  ],
  arrows: [
    {
      className: "flow", headClass: "arrowhead",
      points: [
        { x: 147, y: 190 },
        { x: 190, y: 190 }
      ]
    },
    {
      className: "flow", headClass: "arrowhead",
      points: [
        { x: 318, y: 190 },
        { x: 364, y: 190 }
      ]
    },
    {
      className: "flow", headClass: "arrowhead",
      points: [
        { x: 538, y: 135 },
        { x: 560, y: 135 },
        { x: 560, y: 105 },
        { x: 590, y: 105 }
      ]
    },
    {
      className: "flow", headClass: "arrowhead",
      points: [
        { x: 667, y: 143 },
        { x: 667, y: 191 }
      ]
    },
    {
      className: "flow", headClass: "arrowhead",
      points: [
        { x: 590, y: 235 },
        { x: 564, y: 235 },
        { x: 564, y: 336 },
        { x: 538, y: 336 }
      ]
    },
    {
      className: "flow flow-accent", headClass: "arrowhead-accent",
      points: [
        { x: 407, y: 300 },
        { x: 407, y: 272 }
      ]
    }
  ],
  axes: [
    {
      points: [
        { x: 848, y: 319 },
        { x: 1121, y: 319 }
      ]
    },
    {
      points: [
        { x: 848, y: 319 },
        { x: 848, y: 148 }
      ]
    }
  ],
  growth: {
    className: "growth",
    headClass: "growth-head",
    points: [
      { x: 900, y: 275 },
      { x: 972, y: 246 },
      { x: 1042, y: 198 },
      { x: 1090, y: 157 }
    ]
  },
  circles: [
    { className: "score-start", cx: 900, cy: 275, r: 12 },
    { className: "score-end", cx: 1090, cy: 157, r: 14 }
  ],
  texts: [
    { text: "Исходный", x: 95, y: 183, anchor: "middle", className: "label" },
    { text: "агент A₀", x: 95, y: 205, anchor: "middle", className: "label" },

    { text: "Оценка", x: 254, y: 178, anchor: "middle", className: "label" },
    { text: "на бенчмарке", x: 254, y: 201, anchor: "middle", className: "small" },

    { text: "Архив", x: 451, y: 130, anchor: "middle", className: "title" },
    { text: "балл + разнообразие", x: 451, y: 150, anchor: "middle", className: "small" },
    { text: "разные линии", x: 451, y: 261, anchor: "middle", className: "small" },

    { text: "Выбор родителя", x: 666, y: 98, anchor: "middle", className: "label" },
    { text: "из архива", x: 666, y: 121, anchor: "middle", className: "small" },

    { text: "Правка обвеса", x: 666, y: 224, anchor: "middle", className: "label" },
    { text: "инструмент или промпт", x: 666, y: 247, anchor: "middle", className: "small" },

    { text: "Новая оценка", x: 451, y: 330, anchor: "middle", className: "label" },
    { text: "наблюдаемый балл", x: 451, y: 352, anchor: "middle", className: "small" },

    { text: "выбор", x: 550, y: 92, anchor: "end", className: "small" },
    { text: "изменение", x: 679, y: 169, anchor: "start", className: "small" },
    { text: "прогон", x: 575, y: 295, anchor: "start", className: "small" },
    { text: "балл + дескриптор", x: 393, y: 286, anchor: "end", className: "small" },

    { text: "Рост SWE-bench", x: 825, y: 65, anchor: "start", className: "title" },
    { text: "по мере раскрытия ветвей архива", x: 825, y: 89, anchor: "start", className: "small" },

    { text: "20%", x: 900, y: 247, anchor: "middle", className: "score" },
    { text: "50%", x: 1090, y: 137, anchor: "middle", className: "score" },
    { text: "A₀", x: 900, y: 346, anchor: "middle", className: "label" },
    { text: "открытый поиск", x: 1090, y: 346, anchor: "middle", className: "label" },

    {
      text: "Архив сохраняет несколько перспективных стратегий — каждая может стать новой родословной.",
      x: 397, y: 402, anchor: "middle", className: "legend"
    },
    {
      text: "Не одна правка, а повторяющийся цикл выбора, изменения и проверки.",
      x: 975, y: 402, anchor: "middle", className: "legend"
    }
  ],
  arrow: {
    length: 12,
    halfWidth: 6,
    last: -1,
    beforeLast: -2
  },
  fallback: {
    x: 600,
    y: 205,
    text: "Схема должна показать цикл A₀ → оценка → архив → выбор родителя → правка обвеса → новая оценка → архив и рост SWE-bench с 20% до 50%."
  }
};

const origin = Object.freeze({ x: 20, y: 4 });
const scale = Object.freeze({ x: 1, y: 1 });

function sx(x) {
  return origin.x + x * scale.x;
}

function sy(y) {
  return origin.y + y * scale.y;
}

const LINE_WIDTH = 2.4;
const FONT_SIZE = 15;
const LABEL_PADDING = 8;

try {
  const svg = document.getElementById("diagram");
  const namespace = "http://www.w3.org/2000/svg";

  function makeElement(name, attributes) {
    const element = document.createElementNS(namespace, name);
    for (const [key, value] of Object.entries(attributes)) {
      element.setAttribute(key, String(value));
    }
    return element;
  }

  function logicalWidth(x, width) {
    return sx(x + width) - sx(x);
  }

  function logicalHeight(y, height) {
    return sy(y + height) - sy(y);
  }

  function addRect(spec) {
    const rect = makeElement("rect", {
      x: sx(spec.x),
      y: sy(spec.y),
      width: logicalWidth(spec.x, spec.w),
      height: logicalHeight(spec.y, spec.h),
      rx: logicalWidth(spec.x, spec.r),
      class: spec.className
    });
    svg.appendChild(rect);
  }

  function addPolyline(spec) {
    const line = makeElement("polyline", {
      points: spec.points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
      class: spec.className
    });
    svg.appendChild(line);
    addArrowhead(spec);
  }

  function addArrowhead(spec) {
    const tip = spec.points.at(diagramData.arrow.last);
    const previous = spec.points.at(diagramData.arrow.beforeLast);
    const dx = tip.x - previous.x;
    const dy = tip.y - previous.y;
    const magnitude = Math.hypot(dx, dy);
    const ux = dx / magnitude;
    const uy = dy / magnitude;
    const baseX = tip.x - ux * diagramData.arrow.length;
    const baseY = tip.y - uy * diagramData.arrow.length;
    const sideX = -uy * diagramData.arrow.halfWidth;
    const sideY = ux * diagramData.arrow.halfWidth;
    const vertices = [
      tip,
      { x: baseX + sideX, y: baseY + sideY },
      { x: baseX - sideX, y: baseY - sideY }
    ];
    const head = makeElement("polygon", {
      points: vertices.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
      class: spec.headClass
    });
    svg.appendChild(head);
  }

  function addCircle(spec) {
    const circle = makeElement("circle", {
      cx: sx(spec.cx),
      cy: sy(spec.cy),
      r: logicalWidth(spec.cx, spec.r),
      class: spec.className
    });
    svg.appendChild(circle);
  }

  function addText(spec) {
    const label = makeElement("text", {
      x: sx(spec.x),
      y: sy(spec.y),
      "text-anchor": spec.anchor,
      class: spec.className
    });
    label.textContent = spec.text;
    svg.appendChild(label);
  }

  for (const shape of diagramData.shapes) {
    addRect(shape);
  }

  for (const divider of diagramData.dividers) {
    const line = makeElement("line", {
      x1: sx(divider.x1),
      y1: sy(divider.y1),
      x2: sx(divider.x2),
      y2: sy(divider.y2),
      class: "divider"
    });
    svg.appendChild(line);
  }

  for (const arrow of diagramData.arrows) {
    addPolyline(arrow);
  }

  for (const axis of diagramData.axes) {
    const line = makeElement("polyline", {
      points: axis.points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
      class: "axis"
    });
    svg.appendChild(line);
  }

  addPolyline(diagramData.growth);

  for (const circle of diagramData.circles) {
    addCircle(circle);
  }

  for (const label of diagramData.texts) {
    addText(label);
  }

  svg.style.setProperty("--diagram-line-width", `${LINE_WIDTH}px`);
  svg.style.setProperty("--diagram-font-size", `${FONT_SIZE}px`);
  svg.style.setProperty("--diagram-label-padding", `${LABEL_PADDING}px`);
} catch (error) {
  const svg = document.getElementById("diagram");
  const namespace = "http://www.w3.org/2000/svg";
  const fallback = document.createElementNS(namespace, "text");
  fallback.setAttribute("x", String(sx(diagramData.fallback.x)));
  fallback.setAttribute("y", String(sy(diagramData.fallback.y)));
  fallback.setAttribute("text-anchor", "middle");
  fallback.setAttribute("class", "legend");
  fallback.textContent = diagramData.fallback.text;
  svg.appendChild(fallback);
}
</script>
</body>
</html>
