- concept: отбор по баллу закрепляет инженерную эвристику, не формулируя стоящую за ней причину
  question: Циклу никто не сообщал, что ошибки инструментов бывают временными. Как в архиве всё же оказались агенты с логикой повторов?
  explanation: Отбор работает по числам, а не по объяснениям. Поэтому цикл способен воспроизводить те же правки надёжности, которые инженер внёс бы, разобрав логи падений, — без понимания механизма.
  kind: open
  reference: 'Логика повторов появилась как одна из предложенных правок наравне с прочими. Варианты, которые повторяли упавший вызов, решали чуть больше задач бенчмарка и набирали на пару процентов более высокий балл, поэтому проходили приёмку и оставались в архиве, становясь родителями следующих поколений. Причину — что часть сбоев временная — цикл нигде не формулирует: закрепляется само поведение, потому что оно измеримо выигрывает.'
