- concept: при переходе от доказательства к свидетельству обоснованием безопасности становится целостность оценщика плюс ревью
  question: В цикле самоулучшения правило приёмки — эмпирический прирост балла. На чём в этом случае держится обоснование безопасности?
  explanation: У классической схемы безопасность даёт математическая гарантия. Убрав её, вы переносите весь вес доверия на измерение — оценщик перестаёт быть вспомогательным скриптом и становится главной защищаемой деталью.
  kind: choice
  options:
    - 'На качестве генератора правок: пока модель предлагает разумные изменения, цикл безопасен'
    - 'На целостности оценщика и ревью: балл — единственное свидетельство, и испортить его можно, сломав оценщик или подогнавшись под него'
    - 'На размере архива: чем больше сохранённых линий, тем меньше риск принять плохой вариант'
