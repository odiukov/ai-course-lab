- concept: эмпирический критерий приёмки слабее доказательства, но выполним на практике
  question: Darwin Godel Machine отказывается от требования доказывать полезность правки. Чем заменён этот критерий и что при такой замене теряется?
  explanation: 'Обмен ровно такой: сильная, но недостижимая гарантия меняется на слабое, но проверяемое свидетельство. Опубликованные числа DGM — SWE-bench 20,0% → 50,0%, Polyglot 14,2% → 30,7% — показывают, что второй путь даёт реальный прогресс.'
  kind: open
  reference: 'Критерий заменён эмпирическим: вариант агента прогоняют по бенчмарку и принимают, если балл перешагнул порог приёмки. Теряется всеобщность гарантии — измеренный результат относится к конкретному набору задач и условиям запуска и не обещает превосходства на любых будущих задачах. Взамен критерий становится выполнимым: результат воспроизводим и сравним между вариантами, тогда как доказательство за двадцать с лишним лет так и не построили ни разу.'
  id: 001-dva-podhoda-3
  fingerprint: 3285e989
