- concept: неполнота ограничивает доказуемое самоулучшение достаточно мощного агента
  question: Почему результаты о неполноте по Гёделю считают препятствием для доказуемого самоулучшения мощного агента?
  explanation: Полезная правка может быть истинной, но недоказуемой изнутри системы агента. Тогда формальный критерий приёмки блокирует изменение навсегда, хотя оно объективно улучшает агента.
  kind: choice
  options:
    - Они запрещают программе изменять собственный исходный код
    - Достаточно мощная формальная система не может доказать все истинные утверждения своими средствами — включая, возможно, полезность нужной правки
    - Они показывают, что любое доказательство содержит ошибку
    - Они делают любые эмпирические измерения ненадёжными
  correct: 1
