- concept: агент как последовательность операторов из фиксированной библиотеки, где изменяется только комбинация
  question: В игрушечном цикле в стиле DGM агент — упорядоченная цепочка операторов из фиксированной библиотеки инструментов. Что предлагает изменить цикл поиска?
  explanation: 'Библиотека фиксирована, изменяемая часть — цепочка. Такой вариант тривиально сохранить и воспроизвести: он и есть конкретная последовательность операторов.'
  kind: choice
  options:
    - Реализацию самих операторов внутри библиотеки
    - 'Комбинацию: какие операторы включить, в каком порядке и сколько раз повторить'
    - Задачи отложенной выборки бенчмарка
    - Веса модели, порождающей операторы
  correct: 1
  id: 006-operator-library-1
  fingerprint: 7f83ee79
- concept: операторы применяются конвейерно, поэтому порядок меняет результат
  question: Два варианта игрушечного агента используют один и тот же набор операторов, но в разном порядке. Почему их результаты могут различаться?
  explanation: 'Агент прогоняет задачу через цепочку: выход первого оператора становится входом второго. Поэтому одно и то же множество действий в другом порядке даёт другое преобразование, а лишний оператор способен испортить уже подходящий промежуточный результат.'
  kind: choice
  options:
    - Операторы применяются последовательно, и каждый работает над выходом предыдущего
    - Порядок влияет только на скорость, но не на результат
    - Библиотека запрещает повторять оператор дважды
    - Бенчмарк оценивает варианты случайно
  correct: 0
  id: 006-operator-library-2
  fingerprint: 0fc7ba70
- concept: флаг разрешения взлома награды обнажает функцию оценки для правки агентом
  question: В игрушечном скрипте есть флаг `--reward-hack-allowed`. Что он делает и что показывает прогон с ним?
  explanation: Флаг делает пайплайн оценки изменяемым наравне с агентом. Сравнение двух прогонов рядом — медленный рост к потолку задачи без флага и мгновенный скачок к максимуму с ним — и есть наглядное определение взлома награды.
  kind: choice
  options:
    - Отключает бенчмарк, и балл перестаёт считаться
    - Выставляет наружу функцию оценки, которую агент может отредактировать; балл за считаные поколения улетает к максимуму при никаких решениях задач
    - Даёт агенту доступ к ответам отложенных задач, чтобы поднять качество решений
    - Увеличивает порог приёмки, чтобы отсеять слабые варианты
  correct: 1
  id: 006-operator-library-3
  fingerprint: 39f4217c
