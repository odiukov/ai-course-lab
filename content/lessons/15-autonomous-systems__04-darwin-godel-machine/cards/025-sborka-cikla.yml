- concept: в DGM правку родителя предлагает LLM, читая его исходный код, а не случайный мутатор
  question: Откуда в цикле DGM берётся конкретное изменение агента-родителя?
  explanation: Предложение изменения — это отдельный шаг цикла, где LLM работает с собственным исходником агента на Python. Случайный перебор был бы дешевле, но не находил бы осмысленных правок вроде роутера субагентов; градиента у бенчмарка нет — он даёт только балл.
  kind: choice
  options:
    - 'Языковую модель просят прочитать исходный код родителя и предложить правку: новый инструмент, изменённый промпт, доработку субагента'
    - Правка выбирается случайно из заранее заданного списка допустимых изменений кода
    - Правку вычисляет градиент бенчмарка по параметрам агента
  correct: 0
  id: 025-sborka-cikla-1
  fingerprint: b1b1baaa
- concept: балл кандидата сопоставим с баллом родителя только при неизменных условиях оценивания
  question: Кандидат набрал больше родителя, но родителя в своё время оценивали на другой подвыборке задач. Что можно заключить?
  explanation: Балл — измерение на конкретных условиях. Пока условия оценки различаются, разница баллов не приписывается изменению агента. Чтобы сравнить, родителя перепрогоняют в тех же условиях, что и кандидата.
  kind: choice
  options:
    - Кандидат лучше родителя, раз число больше
    - 'Сравнение некорректно: разница может целиком объясняться разными наборами задач'
    - Кандидат хуже, потому что его набор задач был другим
  correct: 1
  id: 025-sborka-cikla-2
  fingerprint: '33588131'
- concept: прогресс цикла складывается из множества мелких принятых приростов, а не из одной удачной мутации
  question: Зачем цикл самоулучшения гоняют многие сотни поколений, если каждое поколение стоит дорого?
  explanation: 'Отбор работает статистикой: чем больше проверенных кандидатов, тем больше шансов, что редкая полезная правка вообще будет найдена и закреплена в архиве.'
  kind: open
  reference: 'Одна мутация даёт в лучшем случае небольшой прирост, и большинство мутаций вообще не проходит приёмку. Итоговое улучшение агента — накопление многих мелких принятых правок вдоль линий архива: удачный вариант становится родителем следующих, и приросты складываются. При коротком прогоне поиск успевает проверить слишком мало кандидатов, чтобы отличить реальный прирост от шума и чтобы линии успели развиться.'
  id: 025-sborka-cikla-3
  fingerprint: 9b7f9a2b
