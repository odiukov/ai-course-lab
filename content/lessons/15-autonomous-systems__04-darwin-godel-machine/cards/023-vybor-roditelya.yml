- concept: 'выбор родителя — решение, отдельное от приёмки: агент с меньшим баллом остаётся полноправным кандидатом в родители'
  question: Агент прошёл порог и занял свою ячейку архива, но его балл ниже, чем у нескольких других агентов. Как это влияет на его шансы стать родителем в следующих поколениях?
  explanation: Приёмка и выбор родителя — разные шаги цикла. Первый решает, что хранить, второй — откуда делать следующий шаг. Если бы родителем брали только текущего лидера, архив с разнообразием не давал бы никакой пользы.
  kind: choice
  options:
    - Он исключается из выбора родителей до тех пор, пока его балл не превысит текущего лидера
    - 'Он остаётся доступным для выбора родителем: балл решал вопрос попадания в ячейку, а не право продолжать линию'
    - Он может быть родителем только для агентов из своей же ячейки
