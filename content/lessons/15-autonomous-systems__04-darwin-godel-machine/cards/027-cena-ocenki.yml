- concept: стоимость оценки платится до того, как известен исход мутации, поэтому бесполезные правки стоят столько же, сколько полезные
  question: Объясни своими словами, почему в цикле самоулучшения полная стоимость поиска определяется числом проверенных кандидатов, а не числом удачных мутаций.
  explanation: Оценка здесь не фиксирует итог, а покупает информацию. При ~38 часах на полный SWE-bench каждое «может, стало лучше?» стоит одинаково независимо от ответа, поэтому сотни поколений возможны только при многоуровневом отсеве.
  kind: open
  reference: 'Балл кандидата неизвестен, пока бенчмарк не прогнан целиком: сломанный инструмент, нейтральная правка промпта и реальное улучшение требуют одного и того же прогона. Отсеять плохую мутацию заранее нельзя — за это знание и платят прогоном. Значит бюджет = (число кандидатов) × (цена одной оценки), а доля полезных правок влияет только на отдачу от бюджета, но не на его расход. Отсюда практика: сначала дешёвый прогон на подвыборке, полная оценка — только для выживших кандидатов.'
