- concept: цена одной оценки задаёт, сколько кандидатов поиск успевает проверить за отведённое машинное время
  question: Кандидатов самоулучшающегося агента оценивают на подвыборке из 150 задач, каждая задача занимает 3 минуты, запуски идут последовательно. Сколько кандидатов удастся оценить за бюджет 60 часов машинного времени?
  explanation: 'Одна оценка стоит 150 × 3 = 450 минут = 7.5 часа. 60 / 7.5 = 8 кандидатов. Именно эта арифметика ограничивает поиск: в полном SWE-bench 2294 задачи, и при минуте на задачу одна оценка съедает ~38 часов, поэтому за поколение проверяют единицы вариантов, а не сотни.'
  kind: numeric
  answer: 8
  tolerance: 0.1
  id: 027-cena-ocenki-1
  fingerprint: 36dd3f7c
- concept: 'сокращение набора задач вносит дисперсию: прирост на малой подвыборке может объясняться её составом, а не свойствами кандидата'
  question: Чтобы ускорить цикл, кандидатов оценивают не на всём бенчмарке, а на случайной подвыборке из 40 задач. Кандидат показал +5 процентных пунктов к родителю. Какой вывод корректен?
  explanation: 'Случайность убирает систематический сдвиг, но не разброс: на 40 задачах разница в пару решённых задач даёт заметные проценты. Поэтому малая подвыборка работает как дешёвый отсев, а перспективного кандидата подтверждают дорогой широкой оценкой.'
  kind: choice
  options:
    - 'Прирост подтверждён: подвыборка случайна, значит несмещена, и результат переносится на весь набор'
    - Прирост может быть следствием состава подвыборки, и перед принятием кандидата его нужно перепроверить на более широком наборе
    - Подвыборка вообще не даёт информации о кандидате, отсев на ней бессмысленен
    - Прирост означает, что подвыборка оказалась слишком трудной для родителя, и его нужно переоценить на другой подвыборке
