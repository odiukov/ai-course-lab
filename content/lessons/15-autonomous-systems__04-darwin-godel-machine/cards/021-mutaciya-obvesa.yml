- concept: единица мутации — одно связное изменение поведения, а не фиксированное число строк кода
  question: Мутация должна затрагивать «одну часть» поведения агента. Объясни, почему правка из десятка строк всё ещё считается одной мутацией, а две однострочные правки в разных инструментах — нет.
  explanation: Смысл ограничения — интерпретируемость эксперимента. Связная правка одного механизма остаётся одним подозреваемым; две несвязанные правки дают два, сколько бы строк каждая ни занимала.
  kind: open
  reference: Единица измеряется по поведению, а не по объёму кода. Логика повторов с ограниченным откатом после ошибки инструмента — это одно связное поведение («что агент делает после неудачной команды»), даже если оно требует условия, счётчика и паузы. Две однострочные правки в разных инструментах меняют два независимых поведения, и изменение балла нельзя отнести ни к одному из них. Критерий локальности — сохраняется ли атрибуция результата, а не длина диффа.
  id: 021-mutaciya-obvesa-2
