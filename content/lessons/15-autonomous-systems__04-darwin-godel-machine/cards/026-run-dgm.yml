- concept: 'оценка родителя вместо кандидата — молчаливая ошибка: код работает, но числа описывают другого агента'
  question: В реализации цикла оценку по ошибке вызвали для родителя, а не для мутированного кандидата. Что произойдёт?
  explanation: 'Ошибка молчаливая: типы совпадают, исключения нет, архив заполняется. Но принятие или отклонение кандидата определяется баллом родителя, то есть не зависит от внесённой правки — поиск перестаёт быть отбором.'
  kind: choice
  options:
    - Прогон упадёт с ошибкой, потому что родитель уже оценён
    - Прогон отработает без ошибок, но баллы будут описывать не того агента, и отбор станет случайным относительно мутаций
    - Прогон отработает корректно, ведь кандидат отличается от родителя лишь одной правкой
  correct: 1
