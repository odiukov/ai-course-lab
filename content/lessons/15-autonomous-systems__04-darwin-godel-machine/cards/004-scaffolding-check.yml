- concept: разграничение компонентов агента на изменяемые циклом и фиксированные
  question: Какой компонент НЕ входит в изменяемый DGM обвес агента?
  explanation: Промпты, роутеры и логика повторов — Python-код вокруг модели, его цикл и переписывает. Веса при этом заморожены, поэтому одна и та же правка применима к разным моделям.
  kind: choice
  options:
    - Шаблон промпта для инструмента правки файлов
    - Правило повторного вызова инструмента после ошибки
    - Внутренние веса языковой модели
    - Роутер, решающий, поднимать ли субагента
  correct: 2
