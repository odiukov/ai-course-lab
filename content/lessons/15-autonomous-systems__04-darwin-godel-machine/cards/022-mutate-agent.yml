- concept: мутация строит новую последовательность на копии, потому что изменение родителя на месте уничтожает базу сравнения
  question: Функция мутации меняет элемент прямо в списке операторов, полученном из архива, и возвращает тот же список. Родитель — последовательность из 7 операторов. Что ломается?
  explanation: Архив хранит конкретные версии агентов; правка на месте подменяет сохранённую версию. После этого перепрогон родителя даст балл потомка, и решение о приёмке будет опираться на несуществующее сравнение.
  kind: choice
  options:
    - 'Ломается длина: изменение на месте укорачивает последовательность'
    - 'Ломается сравнение: архивная запись родителя тоже изменилась, и разницу «родитель против потомка» больше не измерить, а линия происхождения переписана задним числом'
    - Ничего не ломается, пока балл кандидата выше родительского
  correct: 1
  id: 022-mutate-agent-1
  fingerprint: c51c4e68
- concept: заменяющий оператор выбирается из библиотеки за вычетом того, что уже стоит в этой позиции
  question: 'Заполни пропуск: выбор нового оператора для позиции `i` должен исключить текущий, иначе мутация вернёт поведенчески того же агента.'
  explanation: Если кандидат в замену совпал с текущим оператором, функция формально отработает и вернёт последовательность, но потомок будет побайтово равен родителю. Поколение потратит дорогой прогон бенчмарка на повторное измерение уже известного агента.
  kind: cloze
  template: new_op = rng.choice([op for op in library if op ___ child[i]])
  answer: '!='
  accept:
    - '!='
    - is not
    - not ==
  id: 022-mutate-agent-2
  fingerprint: a30fb887
- concept: генератор случайности передаётся аргументом, чтобы поколение воспроизводилось при том же начальном состоянии
  question: Зачем мутации брать генератор случайности из аргумента функции, а не обращаться к глобальному источнику?
  explanation: 'Воспроизводимость — рабочий инструмент: без неё тесты не могут закрепить конкретную мутацию, а расследование аномального балла упирается в неповторимый прогон. Скорость и качество распределения тут ни при чём.'
  kind: choice
  options:
    - Глобальный источник даёт менее равномерное распределение позиций
    - При фиксированном начальном состоянии переданный генератор даёт ту же мутацию, поэтому подозрительное поколение можно повторить и увидеть, какая именно правка дала странный балл
    - Переданный генератор быстрее, что важно при сотнях поколений
  correct: 1
  id: 022-mutate-agent-3
  fingerprint: 380b29f5
