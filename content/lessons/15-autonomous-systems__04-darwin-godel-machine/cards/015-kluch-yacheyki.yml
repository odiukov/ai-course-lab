- concept: дескриптор разнообразия описывает устройство агента и не является второй оценкой качества
  question: Кандидат набрал 31 балл — заметно ниже лидера, — но его цепочка операторов не похожа ни на одну в архиве. Что даёт ему эта непохожесть?
  explanation: Дескриптор — координата размещения, а не оценка. Он определяет, с кем кандидат конкурирует, и ничего не добавляет к измеренному результату.
  kind: choice
  options:
    - Прибавку к баллу за новизну при сравнении с лидером
    - 'Собственную ячейку: он сохраняется и позже может стать родителем, но его балл от непохожести не улучшается'
    - Немедленное продвижение в лидеры, потому что новые конструкции важнее результата
