- concept: оценщик обязан работать вне досягаемости агента, иначе он редактируем наравне с агентом
  question: Какая мера структурно закрывает возможность править себе оценку, а не лечит один частный случай?
  explanation: Любой оценщик, лежащий в одном репозитории с агентом, доступен агенту для правки. Запрет в промпте — просьба, а не граница. Единственная устойчивая мера — вынести оценивание в пространство, до которого агент физически не дотягивается.
  kind: choice
  options:
    - Запретить агенту в системном промпте трогать код оценки
    - Поднять порог приёмки, чтобы случайный прирост балла не проходил
    - Запускать оценщик из другого места, с другими правами и по коду, который агент не видит
    - Увеличить число отложенных задач в бенчмарке
  correct: 2
