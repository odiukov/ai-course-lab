- concept: кандидат конкурирует только с содержимым своей ячейки, а не с лучшим агентом архива
  question: Кандидат набрал 41 балл. Его ячейка архива пуста, а в другой ячейке лежит агент с 90 баллами. Что происходит с кандидатом при вставке в архив?
  explanation: 'Вставка идёт по ключу «балл + дескриптор разнообразия», поэтому сравнение локально: занята ли именно эта ячейка. Пустая ячейка принимает первого представителя независимо от глобального лидера, а лидер остаётся в своей ячейке и по-прежнему доступен как родитель.'
  kind: choice
  options:
    - 'Он принимается и занимает пустую ячейку: агент с 90 баллами лежит в другой ячейке и в этом решении не участвует'
    - Он отклоняется, потому что его балл ниже лучшего балла архива
    - Он принимается, а агент с 90 баллами удаляется как избыточный
  correct: 0
  id: 019-pravilo-arhiva-1
  fingerprint: ebcf7e18
- concept: в занятой ячейке замена происходит только при строгом улучшении, равенство сохраняет прежнего агента
  question: В ячейке уже лежит агент с истинным баллом 63. Новый кандидат попадает в ту же ячейку и тоже набирает 63. Каким должно быть решение и почему?
  explanation: Правило приёмки — строгое улучшение. При равенстве замена ничего не даёт по качеству, но стирает агента, чья линия уже прошла отбор. Это внесло бы в архив дрейф без выигрыша по баллу.
  kind: choice
  options:
    - 'Заменить: более свежий агент точнее отражает текущее состояние поиска'
    - 'Оставить прежнего: равенство не является улучшением, а перезапись без выигрыша просто теряет уже проверенную линию'
    - Положить обоих в ячейку и выбирать между ними при следующем выборе родителя
  correct: 1
