- concept: различие между выводимой из предпосылок гарантией и наблюдением в конкретном испытании
  question: Чем доказательство полезности правки логически отличается от эмпирического балла на бенчмарке?
  explanation: 'Отсюда и осторожность в языке DGM: про вариант говорят «набрал больше на этом наборе», а не «доказанно лучше». Именно поэтому улучшения дополнительно проверяли переносом на другие модели.'
  kind: open
  reference: 'Доказательство выводит гарантию из предпосылок: если предпосылки верны, вывод держится для всех случаев, покрытых утверждением. Эмпирический балл — запись того, что произошло в одном испытании: он относится к конечному набору задач, конкретной модели и условиям запуска. Балл поддерживает решение принять вариант и допускает воспроизведение и сравнение, но не переносит гарантию на невиданные задачи.'
  id: 002-proof-vs-score-2
  fingerprint: 6ab5e3f9
