- concept: архив — набор продолжающихся линий происхождения агентов, а не ранжирование результатов
  question: Объясни своими словами, почему архив DGM описывают как родословную агентов, а не как таблицу лидеров.
  explanation: 'Ключевое отличие DGM от эволюции одной программы: правится агент целиком, а архив фиксирует происхождение, поэтому поиск остаётся ветвящимся.'
  kind: open
  reference: 'Таблица лидеров только ранжирует и отбрасывает: остаётся один победитель. В архиве каждая запись — целая версия агента со своим обвесом плюс связь с родителем, и любая запись может быть выбрана родителем следующей правки. Разные линии развивают разное (одна — инструменты, другая — промпты, третья — субагентов), и линия, отстающая по баллу сейчас, остаётся доступной для продолжения. Хранение только лидера сделало бы всех будущих агентов потомками одной конструкции.'
  id: 014-arhiv-agentov-2
  fingerprint: f4459fad
