- concept: отклонённый кандидат не должен оставлять следов в архиве
  question: Реализация приёмки записывает кандидата в ячейку, а затем при провале порога удаляет запись обратно. Чем это плохо по сравнению с ранним отказом до записи?
  explanation: 'Контракт функции: при отказе архив остаётся прежним, при приёме меняется ровно одна ячейка. Запись-с-откатом нарушает это, если между двумя действиями что-то читает архив или прерывает выполнение, — и отклонённый агент может стать родителем.'
  kind: choice
  options:
    - 'Ничем: итоговое содержимое архива в обоих случаях одинаково'
    - 'Промежуточная запись делает состояние архива зависящим от порядка и от сбоев: любое чтение или падение между записью и откатом оставляет отклонённого агента внутри'
    - Удаление ключа из словаря стоит дороже, чем проверка порога
