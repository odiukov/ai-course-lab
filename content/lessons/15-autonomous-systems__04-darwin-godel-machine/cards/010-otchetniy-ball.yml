- concept: рост отчётного балла при неизменном числе решённых задач указывает на изменение измерителя, а не качества
  question: Новая версия агента подняла отчётный балл с 22 до 30, но число фактически решённых отложенных задач осталось прежним — 12. Какой вывод обоснован?
  explanation: 'Число решённых задач — прямое измерение. Если оно стоит на месте, а замещающий балл растёт, прирост произошёл в признаке, а не в решениях. Оценщик при этом может работать безошибочно: он честно считает то, что ему поручено считать.'
  kind: choice
  options:
    - Агент стал лучше, просто улучшение пока не отразилось на задачах
    - Отчётный балл вычислен с ошибкой и его нужно пересчитать
    - Изменилось то, что видит измеритель, а не качество решений
    - Отложенный набор задач слишком мал, чтобы делать выводы
  correct: 2
