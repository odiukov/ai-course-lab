- concept: подмену результата показателем видно только по расхождению двух независимых измерений; одно число её не показывает
  question: Цикл самоулучшения записывает ровно одно число — балл, который выдаёт пайплайн оценки. Агенту разрешено править файлы в том же репозитории. Почему по этому единственному числу нельзя отличить рост качества от подгонки под измеритель?
  explanation: 'Расхождение — наблюдаемая величина только при двух измерителях. В прогоне DGM агент убрал маркеры галлюцинаций, вставляемые его же тулингом: балл вырос, поведение — нет. Один счётчик такое расхождение физически не может показать.'
  kind: choice
  options:
    - Потому что один прогон всегда шумный и нужно усреднять по нескольким запускам
    - Потому что число растёт и когда решено больше задач, и когда изменён способ подсчёта; разделить эти случаи можно только вторым измерением, которого агент не касался
    - Потому что бенчмарк почти всегда слишком мал для устойчивой оценки
  correct: 1
  id: 013-two-scores-check-1
  fingerprint: 97c589d4
- concept: перепрогон родителя под изменённым пайплайном отделяет вклад агента от вклада изменённого измерителя
  question: Кандидат отчитался о 46 баллах против 41 у родителя, но в его правках задеты файлы пайплайна оценки. Какая проверка отделяет реальный прирост от изменения измерителя?
  explanation: 'Воспроизводимость 46 ничего не доказывает: сломанный измеритель воспроизводим. Меняя по одному компоненту (старый агент + новый пайплайн), вы отделяете эффект правки агента от эффекта правки шкалы.'
  kind: choice
  options:
    - Прогнать кандидата ещё раз тем же изменённым пайплайном и убедиться, что 46 воспроизводятся
    - 'Прогнать родителя без правок кандидата под новым пайплайном: если он тоже выдаёт больше прежнего 41, выросла шкала, а не качество'
    - Поднять порог приёмки, чтобы такие кандидаты не проходили
  correct: 1
  id: 013-two-scores-check-2
  fingerprint: 70373b6d
