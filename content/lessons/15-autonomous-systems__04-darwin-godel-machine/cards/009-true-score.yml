- concept: функция оценки не должна мутировать задачи или конфигурацию кандидата, иначе балл невоспроизводим и архив несравним
  question: Объясни своими словами, почему функция оценки не должна изменять переданные ей задачи или список операторов кандидата.
  explanation: Воспроизводимость — условие того, что балл вообще является измерением. Побочные эффекты в оценщике превращают порядок запусков в скрытый параметр результата.
  kind: open
  reference: Балл нужен для сравнения кандидатов между собой и с ранее сохранёнными в архиве. Если оценка мутирует набор задач или конфигурацию, то повторный запуск того же кандидата на тех же данных даст другое число, а следующий кандидат будет проверяться уже на изменённом наборе. Тогда разница баллов отражает историю запусков, а не качество агентов, и решение «принять потомка» опирается на несопоставимые измерения. Чистая функция от (кандидат, набор) гарантирует воспроизводимость и позволяет перепроверить любой прошлый результат.
