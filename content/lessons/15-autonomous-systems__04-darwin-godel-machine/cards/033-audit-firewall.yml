- concept: аудит влияния на оценку строится обратным ходом от итогового числа ко всем его источникам
  question: Расставь шаги аудита оценщика в самоулучшающемся цикле в правильном порядке.
  explanation: 'Список «важных файлов», составленный вперёд, всегда неполон. Обратный ход от числа даёт замыкание: всё, что участвовало в получении балла, — часть оценщика, включая то, что не выглядит как код проверок.'
  kind: order
  items:
    - Зафиксировать итоговое число, которое возвращает оценщик
    - Перечислить проверки, из результатов которых это число складывается
    - Найти, откуда берутся задачи, эталонные ответы и фикстуры для этих проверок
    - Определить команду запуска, версии зависимостей, переменные окружения и кеши процесса оценивания
    - Закрыть агенту запись во все найденные звенья цепочки
  id: 033-audit-firewall-1
  fingerprint: 02b38c43
- concept: состояние среды исполнения — такой же вход оценщика, как его файлы, поэтому неизменные тесты не гарантируют неизменного результата
  question: Агент не может изменить ни один файл с тестами и эталонными ответами, но имеет право писать в lock-файл зависимостей и в кеш сборки. Что из этого следует для интерпретации выросшего балла?
  explanation: Проверки — это не только их исходный текст, но и код библиотек, который они вызывают, и данные, которые подтягиваются из кеша. Подменённая версия зависимости или отравленный кеш меняют исход прогона при побайтово одинаковых тестах.
  kind: choice
  options:
    - 'Балл достоверен: результат определяется содержимым тестов, а оно не менялось'
    - Балл достоверен, если после прогона сверить хеш файлов тестов
    - 'Балл недостоверен: оценщик исполняется в среде, которую контролирует агент, поэтому результат мог измениться без изменения поведения агента'
    - Балл недостоверен только в том случае, если кеш был пуст на первом поколении
  correct: 2
  id: 033-audit-firewall-2
  fingerprint: 1bacf205
