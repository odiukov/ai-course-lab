- concept: типовые улучшения обвеса, найденные циклом, — обычные инженерные правки надёжности
  question: Назови два примера изменений обвеса, которые цикл DGM внёс сам, и объясни, чем каждое помогает агенту.
  explanation: 'Ничего экзотического: это ровно те правки, которые внимательный инженер внёс бы сам, посмотрев логи падений. Смысл DGM в том, что цикл вносит их автоматически, опираясь только на числа бенчмарка.'
  kind: open
  reference: 'Примеры из статьи: (1) более точный промпт для инструмента правки файлов — падает доля невалидных правок, агент реже тратит шаги на исправление собственного сломанного патча; (2) роутер субагентов, поднимающий отдельного субагента для незнакомого тест-фреймворка вместо угадывания его устройства; (3) логика повторов с ограниченным откатом после ошибки инструмента — временный сбой не съедает весь прогон; (4) хелперы извлечения кода, разбирающие грязный вывод тестов. Все они улучшают организацию работы, не добавляя знаний внутрь модели.'
  id: 003-chto-menyaetsya-3
