- concept: перенос прироста на другие модели — свидетельство против переобучения правки под одну модель
  question: Правку нашли, эволюционируя агента поверх одной языковой модели, а прирост воспроизвёлся ещё на двух других моделях. Что сильнее всего поддерживает этот факт?
  explanation: Если бы цикл нашёл подгонку под особенности одной модели, эффект бы не перенёсся. Перенос — главный аргумент, что улучшение настоящее, а не артефакт.
  kind: choice
  options:
    - Правка исправила общий инженерный изъян обвеса, а не подстроилась под причуды исходной модели
    - Все три модели обучены на одном корпусе
    - Прирост на исходной модели был измерен с ошибкой
    - Правка косвенно изменила веса второй и третьей модели
  correct: 0
