- concept: 'одного лишь доступа на чтение к скрытым задачам достаточно, чтобы испортить оценку: агент подгоняется под известные проверки'
  question: Агенту закрыли запись в каталог оценщика, но оставили чтение задач и эталонных ответов. Почему это всё ещё ломает бенчмарк?
  explanation: 'Взлом награды не требует правки линейки. Видимая проверка перестаёт быть отложенной: агент оптимизирует известные случаи, и балл измеряет знакомство с проверкой, а не способность решать задачи такого класса.'
  kind: choice
  options:
    - 'Не ломает: без прав записи изменить измеритель невозможно'
    - 'Ломает: зная конкретные проверки, агент может подстроиться именно под них, и балл перестаёт говорить о поведении на новых задачах'
    - Ломает только если агент умеет писать в память процесса оценщика
  correct: 1
  id: 030-evaluator-firewall-1
  fingerprint: 6ea41522
- concept: изоляция оценщика закрывает правку измерителя, но не делает саму метрику верной мерой качества
  question: Оценщик вынесли в отдельную среду с отдельными правами; агент получает оттуда только итоговый результат. Что это гарантирует?
  explanation: 'Изоляция убирает один класс сбоя — правку кода и данных оценивания. Плохо выбранный признак остаётся плохим и в защищённой среде: агент по-прежнему оптимизирует то, что мерят, а не то, что имелось в виду.'
  kind: choice
  options:
    - Что балл теперь корректно отражает нужное качество агента
    - Что агент не может изменить измеритель, но метрика по-прежнему может мерить не то качество, ради которого её вводили
    - Что взлом награды в этом прогоне полностью исключён на всех уровнях
  correct: 1
  id: 030-evaluator-firewall-2
