- concept: порядок операций одного поколения цикла DGM
  question: Расставь шаги одного поколения цикла DGM по порядку, начиная с уже непустого архива.
  explanation: Цикл повторяет эту четвёрку сотни поколений. До первой итерации исходного агента `A_0` оценивают и кладут в архив, иначе выбирать родителя не из чего.
  kind: order
  items:
    - Выбрать родителя из архива
    - Попросить LLM предложить правку в исходном коде родителя
    - Прогнать изменённого агента по бенчмарку и записать балл
    - Вставить вариант в архив по ключу «балл + дескриптор разнообразия»
  id: 005-dgm-loop-1
  fingerprint: 057d0cb0
- concept: дескриптор разнообразия в архиве защищает поиск от застревания в локальном максимуме
  question: Зачем архив DGM хранит варианты по ключу «балл + дескриптор разнообразия», а не просто держит текущего лидера?
  explanation: 'Хранение только лучшего загоняет поиск в первый же локальный максимум: все потомки наследуют одни слабые места. Дескриптор разнообразия оставляет «странные» ветки и делает поиск открытым.'
  kind: choice
  options:
    - Чтобы сэкономить память на хранении вариантов
    - Чтобы сохранять непохожие линии с меньшим баллом — их потомки через несколько поколений могут обогнать лидера
    - Чтобы можно было усреднить баллы всех вариантов
    - Чтобы бенчмарк не пришлось запускать повторно
  correct: 1
  id: 005-dgm-loop-2
  fingerprint: 30a5b12c
- concept: оценщик DGM — дорогая бенчмарк-сюита, а не быстрая функция приспособленности
  question: Чем оценщик DGM принципиально отличается от оценщика в схемах вроде AlphaEvolve, и какое практическое следствие это даёт?
  explanation: У AlphaEvolve одна функция приспособленности считается за миллисекунды. У DGM оценка — прогон задач вроде SWE-bench с запуском тестов на каждой, поэтому цена одного «может, стало лучше?» на порядки выше.
  kind: choice
  options:
    - Оценщик — обученная модель-судья, поэтому результат недетерминирован
    - Оценщик — сюита задач с реальным запуском тестов, поэтому одно поколение стоит часы машинного времени и прогоны идут на подвыборке
    - Оценщик считает только длину сгенерированного патча, поэтому дёшев
    - Оценщик проверяет правку формальным доказательством, поэтому медленный
  correct: 1
  id: 005-dgm-loop-3
  fingerprint: d707d293
