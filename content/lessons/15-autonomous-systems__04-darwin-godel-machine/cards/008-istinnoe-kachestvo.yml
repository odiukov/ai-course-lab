- concept: оценка на отложенном наборе проверяет комбинацию на примерах, которые не направляли поиск
  question: Поисковый цикл отобрал лучшего кандидата, замеряя его на тех же 24 задачах, на которых потом его и оценивают. Что именно перестаёт показывать полученный балл?
  explanation: Если те же примеры и отбирали кандидата, и его оценивают, высокий балл может означать приспособление к знакомым случаям. Отложенный набор не участвует в отборе, поэтому его балл отвечает на вопрос о новых примерах.
  kind: choice
  options:
    - Сколько времени кандидат тратит на одну задачу
    - Работает ли найденная комбинация на примерах, которые не участвовали в отборе
    - Правильно ли реализован исполнитель цепочки операторов
    - Сколько операторов входит в цепочку кандидата
  correct: 1
  id: 008-istinnoe-kachestvo-1
  fingerprint: 9c493c00
- concept: истинный балл определяется побитовым совпадением результата с эталонным ответом, а не свойствами самого решения
  question: Объясни своими словами, как вычисляется истинный балл кандидата и что в кандидате он намеренно игнорирует.
  explanation: Смысл конструкции в том, что балл нельзя поднять оформлением. Кандидат, решивший 15 задач из 24, получает ровно эти 15 совпадений, как бы аккуратно ни выглядела его цепочка.
  kind: open
  reference: 'Для каждой задачи берётся вход, к нему применяется цепочка операторов кандидата, результат сравнивается с заранее известным правильным ответом. Совпало — засчитано, не совпало — нет. Истинный балл равен доле засчитанных задач. Он не учитывает ни длину и красоту цепочки, ни уверенность формулировок, ни объяснения агента: единственный вход в подсчёт — факт совпадения с эталоном.'
  id: 008-istinnoe-kachestvo-2
  fingerprint: c1a0465e
- concept: истинный балл — измерение на конкретном наборе, а не утверждение о качестве агента вообще
  question: Что именно означает слово «истинный» в названии этого балла?
  explanation: '«Истинный» — узкое обещание: число посчитано по фактическим решениям, без посредника-признака. Оно не распространяется на задачи вне набора и ничего не доказывает про будущие версии агента.'
  kind: choice
  options:
    - Что балл верен для любых задач, которые агенту когда-либо дадут
    - Что балл вычислен непосредственно по решениям задач выбранного набора, а не по косвенному признаку
    - Что балл получен формальным доказательством корректности агента
    - Что балл не может уменьшиться при следующих правках агента
  correct: 1
  id: 008-istinnoe-kachestvo-3
  fingerprint: 191dd782
