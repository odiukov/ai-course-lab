- concept: ошибочно принятый кандидат становится родителем, поэтому дефект наследуется линией и задаёт новую базу сравнения
  question: Эволюционный цикл принял кандидата по выросшему баллу, хотя тот стал решать задачи хуже. Почему такая ошибка приёмки опаснее, чем разовая неверная оценка в обычном пайплайне без архива?
  explanation: Разница между пассивным отказом и активным сбоем в том, что активный сбой изменяет состояние системы. В эволюционном цикле состояние — это архив, поэтому принятая порча воспроизводится и усиливается поколениями.
  kind: open
  reference: 'Принятый кандидат не просто получает высокую оценку — он попадает в архив и становится родителем. Его потомки наследуют дефектное поведение и тот же способ накручивать балл, а его завышенный балл становится базой, с которой сравниваются следующие кандидаты. Поэтому ошибка не остаётся локальной: она закрепляется в линии и смещает весь дальнейший поиск, тогда как разовая неверная оценка в неэволюционном пайплайне влияет только на одно решение.'
  id: 032-dve-mashiny-2
