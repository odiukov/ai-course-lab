- concept: результаты из перекрывающихся областей чанков нужно дедуплицировать по времени
  question: Расположи этапы обработки перекрывающихся чанков так, чтобы пограничная речь не появилась в итоговой транскрипции дважды.
  explanation: Перекрытие даёт модели контекст по обе стороны границы, но одно и то же аудио распознаётся повторно. Временные метки позволяют найти общую область и удалить дубли перед сборкой итоговой транскрипции.
  kind: order
  items:
    - Сформировать соседние чанки с общей пограничной областью
    - Получить транскрипции с временными метками
    - Сопоставить гипотезы, относящиеся к общей области
    - Удалить повтор и добавить в результат только новую часть
