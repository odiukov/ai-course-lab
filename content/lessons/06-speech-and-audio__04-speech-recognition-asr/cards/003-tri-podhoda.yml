- concept: жадное декодирование CTC схлопывает покадровый путь в последовательность токенов
  question: Расположите операции жадного CTC-декодирования в правильном порядке.
  explanation: CTC сначала формирует покадровый путь, который обычно длиннее транскрипции. Последовательные повторы схлопываются, а blank удаляется, поэтому путь превращается в итоговую строку.
  kind: order
  items:
    - Получить распределение вероятностей токенов и blank для каждого аудиокадра
    - Выбрать наиболее вероятный символ на каждом кадре
    - Схлопнуть идущие подряд повторы одного символа
    - Удалить символы blank
  id: 003-tri-podhoda-1
  fingerprint: 3897eccf
- concept: RNN-T предсказывает токен по акустическому состоянию и ранее выданным токенам
  question: 'Распознаватель должен выдавать текст по ходу речи. На каждом шаге модель учитывает текущий выход акустического энкодера и уже выданные токены, после чего решает: вывести токен или продолжить слушать. Какая формулировка описана?'
  explanation: В RNN-T joint-сеть объединяет состояние акустического энкодера с представлением предыдущих токенов. Модель может чередовать чтение новых кадров и выдачу токенов, поэтому подходит для потокового распознавания.
  kind: choice
  options:
    - CTC
    - RNN-T
    - Attention encoder-decoder
  correct: 1
  id: 003-tri-podhoda-2
  fingerprint: '72955887'
- concept: attention-декодер авторегрессивно выбирает релевантные скрытые состояния аудио
  question: Объясните своими словами, как attention encoder-decoder превращает аудио в текст и почему его декодирование называют авторегрессивным.
  explanation: Cross-attention позволяет декодеру обращаться к нужным участкам представления аудио при каждом шаге генерации. Зависимость следующего токена от уже полученного текста отличает этот подход от неавторегрессивного CTC.
  kind: open
  reference: Энкодер преобразует аудио в последовательность скрытых состояний. Декодер порождает следующий токен с учётом ранее созданных токенов и через cross-attention выбирает релевантные состояния энкодера. Поскольку каждый новый токен зависит от предыдущих, генерация выполняется последовательно и является авторегрессивной.
  id: 003-tri-podhoda-3
  fingerprint: 3a0b976d
