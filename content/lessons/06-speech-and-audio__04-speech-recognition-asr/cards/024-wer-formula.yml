- concept: WER нормируется на число слов в эталонной транскрипции
  question: Заполни знаменатель формулы Word Error Rate.
  explanation: В числителе складываются замены, пропуски и вставки, а знаменателем служит число слов в эталоне. Нормировка позволяет сопоставлять расшифровки текстов разной длины.
  kind: cloze
  template: WER = (S + D + I) / ___
  answer: 'N'
  accept:
    - 'N'
    - N_ref
    - число слов в эталоне
    - длина эталона в словах
  id: 024-wer-formula-1
  fingerprint: 0788a9d1
- concept: WER не ограничен сверху из-за вставок
  question: Почему значение WER может оказаться больше длины эталона, выраженной как единичная доля?
  explanation: Число вставленных моделью слов не ограничено длиной эталона. Поэтому сумма замен, пропусков и вставок может превысить число эталонных слов, и WER окажется выше единичной доли.
  kind: choice
  options:
    - Потому что замены учитываются с повышенным весом
    - Потому что вставок может быть больше, чем слов в эталоне, а знаменатель остаётся равным длине эталона
    - Потому что в знаменатель подставляют длину гипотезы
  correct: 1
  id: 024-wer-formula-2
  fingerprint: d41bdb03
- concept: WER разных моделей сравним только при одинаковых условиях оценки
  question: Одну ASR-модель оценили на чистых записях, а другую — на записях с шумом и акцентами. Объясни, почему по полученным WER нельзя надёжно выбрать лучшую модель.
  explanation: WER характеризует не только модель, но и условия тестирования. Даже у одной модели результат на чистом сплите может заметно отличаться от результата на шумном, поэтому метрика без указания бенчмарка и сплита недостаточна.
  kind: open
  reference: Сложность аудио и состав тестового сплита существенно влияют на WER. Для корректного сравнения модели нужно оценивать на одном и том же наборе данных и по одинаковой процедуре.
  id: 024-wer-formula-3
  fingerprint: c73c3532
