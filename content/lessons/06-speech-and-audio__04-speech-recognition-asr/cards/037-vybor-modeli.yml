- concept: жёсткие эксплуатационные ограничения нужно применять до сравнения WER
  question: В каком порядке следует выбирать ASR-модель для продукта?
  explanation: Низкий WER не компенсирует нарушение обязательного ограничения. Например, модель, не укладывающаяся в задержку на телефоне, исключается до сравнения точности.
  kind: order
  items:
    - Зафиксировать требования к задержке, потоковости, устройству и работе без сети
    - Исключить модели, которые не выполняют обязательные требования
    - Сравнить WER и другие показатели качества среди оставшихся моделей
  id: 037-vybor-modeli-1
  fingerprint: 1bd29a9c
- concept: для потокового ASR с низкой задержкой подходят потоковые системы семейства RNN-T
  question: Сервис должен выдавать субтитры по мере поступления аудио с минимальной задержкой. Какой вариант лучше соответствует этому требованию?
  explanation: RNN-T-системы могут выдавать токены по ходу поступления аудио. Обработка завершённого сегмента увеличивает задержку, а WhisperX с VAD решает прежде всего задачу удобной обработки длинных записей.
  kind: choice
  options:
    - Потоковая RNN-T-система, например Riva
    - Attention encoder-decoder, который обрабатывает завершённый сегмент целиком
    - WhisperX с VAD-нарезкой часовых архивных записей
  correct: 0
  id: 037-vybor-modeli-2
  fingerprint: 5024a887
