- concept: пустая CTC-транскрипция корректна, если на всех кадрах выбран blank
  question: Жадный CTC-декодер вернул пустую строку, а покадровый путь состоит только из blank. Как интерпретировать результат?
  explanation: При схлопывании CTC все blank удаляются. Поэтому путь, целиком состоящий из blank, закономерно превращается в пустую транскрипцию и может соответствовать тишине.
  kind: choice
  options:
    - Это корректное распознавание отсутствия речи
    - Это обязательно означает ошибку в таблице токенов
    - Декодер должен оставить один blank в итоговой строке
  correct: 0
  id: 010-ctc-greedy-1
  fingerprint: ef82a7a4
- concept: до CTC-схлопывания путь содержит по одной метке на каждый временной кадр
  question: Заполни проверку инварианта покадрового пути.
  explanation: Выбор максимальной вероятности по словарной оси убирает только эту ось. Временная ось сохраняется, поэтому длина пути до схлопывания равна числу кадров.
  kind: cloze
  template: |-
    time_steps, vocab_size = probs.shape
    path = greedy_path(probs)
    assert len(path) == ___
  answer: time_steps
  accept:
    - T
    - num_frames
  id: 010-ctc-greedy-2
  fingerprint: 0bbef237
- concept: таблица токенов и идентификатор blank должны образовывать единый контракт между этапами CTC-декодирования
  question: Объясни, что произойдёт, если функция построения покадрового пути и функция CTC-схлопывания используют разные соглашения об индексе blank.
  explanation: Путь содержит только индексы и сам по себе не сообщает, какой из них означает blank. Поэтому все части декодера должны использовать одну таблицу токенов и один blank_id.
  kind: open
  reference: 'Один и тот же индекс будет интерпретироваться по-разному: настоящие символы могут удаляться как blank, а blank — превращаться в символ. В результате транскрипция получит пропуски или лишние токены, даже если покадровый выбор индексов был правильным.'
  id: 010-ctc-greedy-3
  fingerprint: abd4626a
