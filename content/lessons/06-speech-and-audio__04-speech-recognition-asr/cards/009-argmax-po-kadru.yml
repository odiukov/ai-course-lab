- concept: argmax возвращает индекс наиболее вероятного токена на отдельном кадре
  question: Заполни формулу выбора покадровой метки по распределению вероятностей токенов.
  explanation: Argmax возвращает не максимальную вероятность, а индекс токена, которому она соответствует.
  kind: cloze
  template: \hat{y}_t = ___
  answer: \arg\max_i p_t(i)
  accept:
    - argmax_i p_t(i)
    - \operatorname{argmax}_i p_t(i)
  id: 009-argmax-po-kadru-1
  fingerprint: 2305d1db
- concept: покадровый argmax принимает решения независимо для разных кадров
  question: Почему изменение вероятностей токенов на соседних аудиокадрах не меняет результат argmax для текущего кадра?
  explanation: 'При покадровом выборе каждый вектор обрабатывается отдельно: победитель одного кадра не зависит от победителей или вероятностей на соседних кадрах.'
  kind: open
  reference: Argmax для текущего кадра сравнивает только компоненты его собственного вектора вероятностей. Распределения на других кадрах в это сравнение не входят.
  id: 009-argmax-po-kadru-2
  fingerprint: 92fb798f
- concept: путь из результатов argmax не сохраняет вероятности проигравших токенов
  question: Какую информацию нельзя восстановить по пути, содержащему только результат argmax для каждого аудиокадра?
  explanation: Путь argmax хранит только победивший токен. Вероятности остальных кандидатов, включая степень неуверенности модели, после такого выбора теряются.
  kind: choice
  options:
    - Количество покадровых решений в пути
    - Вероятности токенов, которые не победили на каждом кадре
    - Выбранный токен на каждом кадре
  correct: 1
  id: 009-argmax-po-kadru-3
  fingerprint: 9e372d87
