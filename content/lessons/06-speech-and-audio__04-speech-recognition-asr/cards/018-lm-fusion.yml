- concept: shallow fusion объединяет акустическую оценку, взвешенную оценку языковой модели и надбавку за длину
  question: Для гипотезы акустический log-score равен −3.7, log-вероятность языковой модели — −4.4, вес LM равен 0.6, надбавка за токен — 0.15, а длина гипотезы — 9 токенов. Чему равен итоговый score?
  explanation: 'По формуле shallow fusion: −3.7 + 0.6 × (−4.4) + 0.15 × 9 = −3.7 − 2.64 + 1.35 = −4.99.'
  kind: numeric
  answer: -4.99
  tolerance: 0.01
