- concept: вес языковой модели задаёт компромисс между акустическими свидетельствами и языковой правдоподобностью
  question: Почему вес языковой модели в shallow fusion нельзя просто сделать как можно больше и как его следует выбирать?
  explanation: Языковая модель оценивает правдоподобность текста, но не слышит аудио. Поэтому чрезмерное доверие к ней ухудшает соответствие записи, а подходящий баланс определяют по качеству распознавания на отложенных данных.
  kind: open
  reference: 'Слишком большой вес заставит декодер предпочитать правдоподобные по языку фразы даже при слабом акустическом подтверждении: распознаватель начнёт подменять услышанное ожидаемым. Вес следует подбирать на отложенной выборке по WER вместе с параметром длины.'
