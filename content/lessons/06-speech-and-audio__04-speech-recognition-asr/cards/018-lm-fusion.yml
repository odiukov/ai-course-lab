- concept: надбавка за длину компенсирует склонность языковой модели отдавать преимущество коротким гипотезам
  question: После подключения языковой модели ASR-декодер стал часто пропускать окончания слов и выбирать слишком короткие гипотезы. Какое изменение непосредственно компенсирует этот эффект в формуле shallow fusion?
  explanation: LM добавляет отрицательные log-вероятности с каждым новым токеном, поэтому короткие строки получают систематическое преимущество. Положительный член β|y| возвращает длинным гипотезам часть потерянного score.
  kind: choice
  options:
    - Увеличить положительную надбавку за каждый выходной токен
    - Усилить штраф за каждый выходной токен
    - Удалить акустическую оценку из итогового score
    - Выбирать гипотезу только по вероятности языковой модели
  correct: 0
