- concept: обратный проход по таблице Левенштейна восстанавливает типы ошибок по оптимальным переходам
  question: Расставьте этапы восстановления числа замен, пропусков и вставок по заполненной таблице словного расстояния Левенштейна.
  explanation: Диагональный переход между разными словами означает замену, переход со стороны эталона — пропуск, со стороны гипотезы — вставку. При совпадении слов диагональный переход не увеличивает счётчики.
  kind: order
  items:
    - Начать в ячейке, соответствующей полным эталону и гипотезе.
    - Найти допустимого предшественника, переход из которого даёт стоимость текущей ячейки.
    - По направлению перехода и совпадению слов обновить нужный счётчик либо зарегистрировать совпадение.
    - Перейти к выбранному предшественнику и повторять до пустых префиксов.
  id: 030-edit-counts-1
  fingerprint: 15aae4e5
- concept: на границе таблицы пустой эталонный префикс оставляет только вставки из гипотезы
  question: При обратном проходе эталонный префикс уже пуст, а в гипотезе ещё остались слова. Как следует классифицировать оставшиеся переходы?
  explanation: Если эталон уже исчерпан, каждое оставшееся слово присутствует только в гипотезе. Поэтому обратный проход движется вдоль её границы и учитывает такие слова как вставки.
  kind: choice
  options:
    - Как пропуски
    - Как замены
    - Как вставки
  correct: 2
  id: 030-edit-counts-2
  fingerprint: 0dc99fb3
- concept: названия пропусков и вставок зависят от направления сравнения эталона и гипотезы
  question: Объясните, почему одна и та же несовпавшая пара последовательностей может поменять пропуски и вставки местами, если переставить эталон и гипотезу.
  explanation: 'Счётчики ошибок направлены относительно эталона: удалённое из эталона слово считается пропуском, а добавленное только в гипотезу — вставкой. Поэтому при интерпретации результата важно не перепутать аргументы функции.'
  kind: open
  reference: Пропуском называют слово, которое есть в эталоне, но отсутствует в гипотезе; вставкой — слово, которое есть в гипотезе, но отсутствует в эталоне. При перестановке последовательностей эти роли обращаются, тогда как замена остаётся заменой.
  id: 030-edit-counts-3
  fingerprint: b1b8a55a
