- concept: внешняя языковая модель помогает CTC выбирать лингвистически правдоподобную транскрипцию при декодировании
  question: Объясни своими словами, какую информацию добавляет внешняя языковая модель при декодировании CTC и почему она может исправить пропущенный символ в слове.
  explanation: CTC сообщает, насколько варианты согласуются с аудио, а внешняя LM — насколько естественно они выглядят как текст. Совместное декодирование позволяет учитывать оба источника информации.
  kind: open
  reference: Внешняя языковая модель оценивает последовательности токенов по их лингвистической правдоподобности. При поиске транскрипции её оценка объединяется с акустической оценкой CTC, поэтому вариант, образующий вероятное слово или фразу, может победить акустически близкий, но неправдоподобный вариант.
  id: 014-uslovnaya-nezavisimost-2
