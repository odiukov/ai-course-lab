- concept: VAD отсекает тишину до распознавания и предотвращает галлюцинации Whisper
  question: ASR-система периодически расшифровывает продолжительные участки тишины как правдоподобные фразы. Какое изменение наиболее правильно устраняет причину ошибки?
  explanation: Whisper может генерировать правдоподобный текст даже на тишине. VAD отсекает неречевые фрагменты до запуска модели, поэтому она не получает вход, на котором была бы вынуждена угадывать.
  kind: choice
  options:
    - Пропускать через распознавание только участки, где VAD обнаружил речь
    - Удалять из готовой расшифровки часто встречающиеся выдуманные фразы
    - Заменить словную метрику качества на посимвольную
  correct: 0
  id: 038-pitfalls-1
  fingerprint: 16d03396
- concept: явное указание известного языка предотвращает дрейф автоматического определения языка
  question: Заполните параметр для английской записи, чтобы не полагаться на нестабильное автоопределение языка.
  explanation: На коротких или шумных клипах автоматическое определение языка может ошибаться. Если язык известен заранее, его следует зафиксировать явно, например параметром language="en".
  kind: cloze
  template: model.transcribe(audio, language=___)
  answer: '"en"'
  accept:
    - '''en'''
    - en
  id: 038-pitfalls-2
  fingerprint: cb217ba2
- concept: аудио длиннее контекстного окна Whisper нужно обрабатывать перекрывающимися чанками
  question: Как подготовить длинную аудиозапись для Whisper, если она не помещается в контекстное окно модели?
  explanation: Контекстное окно Whisper составляет 30 секунд. Более длинное аудио разбивают на чанки с chunk_length_s=30 и перекрытием, например stride=5, чтобы слова около границ не обрезались.
  kind: open
  reference: Разделить запись на чанки размером с контекстное окно Whisper и добавить перекрытие между соседними чанками, чтобы не терять речь на границах.
  id: 038-pitfalls-3
  fingerprint: f33311c1
