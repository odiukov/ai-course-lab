- concept: переходы динамики соответствуют удалению, вставке и сопоставлению либо замене слов
  question: Объясните своими словами, из каких соседних состояний можно получить dp[i][j] и какую правку обозначает каждый переход.
  explanation: Каждый переход завершает оптимальное преобразование более коротких префиксов одной локальной операцией. Поэтому минимум среди переходов даёт оптимальную стоимость для текущей пары префиксов.
  kind: open
  reference: 'Переход сверху удаляет текущее слово эталона, переход слева вставляет текущее слово гипотезы, а диагональный переход сопоставляет текущие слова: при совпадении стоимость не растёт, при различии учитывается замена.'
  id: 027-levenshtein-2
  fingerprint: a3838100
- concept: таблица словного расстояния Левенштейна заполняется от базовых случаев к состояниям, зависящим от уже вычисленных префиксов
  question: Расположите действия алгоритма вычисления словного расстояния Левенштейна в правильном порядке.
  explanation: Граничные состояния задают преобразования пустого префикса. После их инициализации внутренние ячейки можно вычислять из уже известных соседей, а итоговая ячейка соответствует полным фразам.
  kind: order
  items:
    - Разбить эталонную и распознанную строки на слова
    - Создать таблицу для всех пар длин префиксов
    - Заполнить границы таблицы стоимостями преобразований с участием пустого префикса
    - Вычислить внутренние ячейки по переходам удаления, вставки и диагонального сопоставления
    - Прочитать минимальное число правок в ячейке для полных последовательностей
  id: 027-levenshtein-3
  fingerprint: 91bcb803
