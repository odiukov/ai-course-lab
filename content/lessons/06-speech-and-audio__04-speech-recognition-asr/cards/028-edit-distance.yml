- concept: расстояние от непустой последовательности до пустой равно её длине
  question: Эталон содержит восемь слов, а гипотеза пуста. Чему равно расстояние Левенштейна на уровне слов?
  explanation: Каждое слово эталона требуется удалить. Поэтому минимальное число операций совпадает с длиной эталона.
  kind: numeric
  answer: 8
  tolerance: 0.0001
  id: 028-edit-distance-1
  fingerprint: 20b44c02
- concept: расстояние Левенштейна симметрично при одинаковой стоимости элементарных операций
  question: Что произойдёт с расстоянием Левенштейна, если поменять списки ref и hyp местами?
  explanation: При обратном преобразовании вставки и удаления меняются ролями, а замены остаются заменами. Поэтому минимальная суммарная стоимость не меняется. При этом WER может измениться, поскольку его знаменатель зависит от длины эталона.
  kind: choice
  options:
    - Оно обязательно увеличится
    - Оно обязательно уменьшится
    - Оно останется прежним
  correct: 2
  id: 028-edit-distance-2
  fingerprint: 3e0eff4c
- concept: время заполнения полной таблицы edit distance пропорционально произведению длин последовательностей
  question: Заполни оценку времени работы реализации, которая вычисляет каждую ячейку полной таблицы динамического программирования.
  explanation: Алгоритм перебирает все пары префиксов эталона и гипотезы, поэтому число вычисляемых состояний пропорционально произведению длин списков.
  kind: cloze
  template: time_complexity = O(___)
  answer: len(ref) * len(hyp)
  accept:
    - len(hyp) * len(ref)
    - m * n
    - n * m
  id: 028-edit-distance-3
