- concept: при скорости R× realtime вычислительное время равно длительности аудио, делённой на R
  question: ASR-система работает со скоростью 18× realtime. Сколько GPU-часов потребуется для последовательной обработки архива длительностью 864 часа?
  explanation: 'Нужно разделить суммарную длительность записей на ускорение относительно реального времени: 864 / 18 = 48 GPU-часов. Число файлов и слов не меняет этот расчёт, если общая длительность аудио остаётся прежней.'
  kind: numeric
  answer: 48
  tolerance: 0.05
