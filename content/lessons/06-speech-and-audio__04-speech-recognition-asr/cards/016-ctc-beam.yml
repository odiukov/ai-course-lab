- concept: лучевой поиск по CTC-путям расширяет гипотезы покадрово, отсекает слабые пути и выполняет CTC-схлопывание после завершения поиска
  question: Расположите действия простого лучевого декодера CTC в правильном порядке.
  explanation: Луч ограничивает число путей, которые переживают каждый кадр. Пока поиск не завершён, гипотезы остаются покадровыми путями; повторы и blank удаляются CTC-схлопыванием уже у выбранного результата.
  kind: order
  items:
    - Создать пустую покадровую гипотезу с нейтральной накопленной оценкой.
    - Для очередного кадра продолжить каждую сохранённую гипотезу каждой возможной CTC-меткой.
    - Вычислить накопленную логарифмическую оценку каждого получившегося пути.
    - Оставить заданное числом лучей количество путей с наибольшими оценками и перейти к следующему кадру.
    - После последнего кадра выбрать лучший полный путь и применить к нему CTC-схлопывание.
  id: 016-ctc-beam-1
  fingerprint: 50d1ef18
- concept: оценка CTC-пути накапливается сложением логарифмов покадровых вероятностей с защитой от логарифма нуля
  question: Заполните выражение для оценки кандидата лучевого поиска, если frame_prob — вероятность выбранной метки, а eps — малая положительная константа.
  explanation: Логарифм превращает произведение покадровых вероятностей в сумму и сохраняет порядок вероятностей путей. Ограничение снизу через eps предотвращает вычисление логарифма нулевой вероятности.
  kind: cloze
  template: candidate_score = beam_score + ___
  answer: math.log(max(frame_prob, eps))
  accept:
    - log(max(frame_prob, eps))
    - np.log(max(frame_prob, eps))
  id: 016-ctc-beam-2
  fingerprint: 381c7c1c
