- concept: раскрытие сокращений должно предшествовать удалению пунктуации при нормализации текста
  question: Расположи операции функции нормализации ASR-транскрипции в корректном порядке.
  explanation: 'Сокращения нужно раскрывать до удаления пунктуации: иначе ключ вроде «dr.» потеряет точку и перестанет совпадать со словарём. В конце пробелы сжимают, поскольку предыдущие преобразования могут создать новые пробельные серии.'
  kind: order
  items:
    - Раскрыть известные сокращения, пока точки в них сохранены
    - Заменить дефисы пробелами и удалить остальную пунктуацию
    - Перевести текст в нижний регистр
    - Сжать серии пробельных символов и обрезать пробелы по краям
  id: 026-normalize-text-1
  fingerprint: 356d734d
- concept: дефис при нормализации заменяется границей слов, а не удаляется
  question: Заполни пропуск так, чтобы нормализация не склеивала слова по разные стороны дефиса.
  explanation: Дефис заменяют пробелом. Если удалить его пустой строкой, составное выражение превратится в один токен и исказит последующий расчёт WER.
  kind: cloze
