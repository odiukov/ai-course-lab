- concept: за один акустический кадр путь выравнивания может продвинуться не более чем на одну позицию транскрипции
  question: Заполните условие достижимости состояния монотонной решётки выравнивания.
  explanation: Каждый обработанный кадр либо оставляет позицию в транскрипции прежней, либо продвигает её на один токен. Поэтому сопоставленных токенов не может быть больше, чем уже обработанных кадров.
  kind: cloze
  template: Если t — число обработанных кадров, а u — число сопоставленных целевых токенов, то обязательно ___
  answer: u ≤ t
  accept:
    - u <= t
    - t ≥ u
    - t >= u
