- concept: абсолютная разница между значениями WER выражается в процентных пунктах
  question: WER модели вырос с 3.6% на чистом сплите до 8.1% на сложном. На сколько процентных пунктов вырос WER?
  explanation: Разница равна 8.1 − 3.6 = 4.5 процентного пункта. Это абсолютный разрыв; относительный рост в процентах был бы другой величиной.
  kind: numeric
  answer: 4.5
