- concept: объём логитов RNN-T пропорционален произведению размера батча, числа кадров, длины транскрипции и размера выходного алфавита
  question: Для батча из 7 записей RNN-T формирует логиты при T = 768, U = 30 и размере выходного алфавита 1536 с учётом null. Каждый элемент занимает два байта. Сколько MiB занимает этот тензор?
  explanation: Тензор содержит B · T · U · K элементов. Произведение 7 · 768 · 30 · 1536 с учётом двух байт на элемент даёт 495452160 байт, то есть 472.5 MiB. Это память только для одного тензора логитов, без промежуточных значений обратного прохода.
  kind: numeric
  answer: 472.5
  tolerance: 0.01
  id: 020-rnnt-reshetka-1
  fingerprint: 107ffad6
- concept: специализированный RNN-T loss снижает пиковую память, не материализуя полную решётку логитов
  question: Наивная реализация RNN-T loss не помещается в память из-за полного тензора для всех сочетаний кадра, позиции транскрипции и выходного символа. Какое изменение непосредственно устраняет эту причину?
  explanation: Специализированное ядро может объединить вычисление логитов и RNN-T loss, обрабатывая решётку частями. Это уменьшает пиковую память, поскольку полный тензор размера B · T · U · (V+1) одновременно не хранится.
  kind: choice
  options:
    - Вычислять решётку блоками в специализированном ядре и сразу использовать результаты в динамическом программировании
    - Подключить внешнюю языковую модель во время декодирования
    - Сохранить полную решётку на устройстве до завершения обратного прохода
    - Удалить null из выходного алфавита
  correct: 0
