<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Решётка CTC: кадр × позиция в тексте</title>
<style>
  :root{
    --bg:#ffffff; --ink:#1b2230; --dim:#5c6678; --grid:#dde3ec;
    --axis:#8b95a8; --accent:#c0392b; --bad:#e8b4b8;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1420; --ink:#e7ecf6; --dim:#9aa6bc; --grid:#28324a;
      --axis:#6b7691; --accent:#ff8f9c; --bad:#4a2a33;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  figure{margin:0;padding:10px 12px 8px;background:var(--bg);}
  h2{margin:0 0 6px;font-size:15px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:430px;background:var(--bg);}
  figcaption{margin-top:6px;font-size:12px;color:var(--dim);line-height:1.45;}
  #fb{font-size:13px;color:var(--ink);line-height:1.5;}
  #fb[hidden]{display:none;}
  .lbl{font-size:12px;fill:var(--ink);}
  .dim{font-size:12px;fill:var(--dim);}
  .big{font-size:13px;fill:var(--ink);font-weight:600;}
</style>
</head>
<body>
<figure>
  <h2>Решётка CTC: кадр × позиция в тексте</h2>
  <svg id="d" viewBox="0 0 800 430" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Сетка 1000 кадров на 25 позиций текста с монотонным путём"></svg>
  <p id="fb" hidden></p>
  <figcaption id="cap">
    Шаг вправо — blank или повтор: напечатанного не прибавилось.
    Шаг вправо-вверх — новый символ. Вниз и влево ходов нет.
    Вертикальная линия сетки — каждые 40 кадров.
  </figcaption>
</figure>
<script>
(function(){
  var svg = document.getElementById('d');
  try{
    /* --- данные схемы --- */
    var FRAMES = 1000, CHARS = 25, STEP = 40;
    var RISES = [40,95,130,180,205,250,300,330,390,430,470,520,
                 560,600,645,665,700,740,790,830,865,900,930,960,985];

    /* --- одна система координат --- */
    var origin = {x:132, y:372};
    var scale  = {x:0.62, y:12.4};
    function sx(v){ return origin.x + v * scale.x; }
    function sy(v){ return origin.y - v * scale.y; }

    var NS = 'http://www.w3.org/2000/svg';
    function el(n,a){ var e=document.createElementNS(NS,n);
      for(var k in a) e.setAttribute(k,a[k]); svg.appendChild(e); return e; }
    function line(x1,y1,x2,y2,a){ a=a||{};
      a.x1=sx(x1); a.y1=sy(y1); a.x2=sx(x2); a.y2=sy(y2); return el('line',a); }
    function text(x,y,dx,dy,anchor,cls,s){
      var t=el('text',{x:sx(x)+dx, y:sy(y)+dy, 'text-anchor':anchor, 'class':cls});
      t.textContent=s; return t; }

    /* запретная зона выше диагонали u = t */
    el('polygon',{points:[sx(0)+','+sy(0), sx(CHARS)+','+sy(CHARS),
                          sx(0)+','+sy(CHARS)].join(' '),
                  fill:'var(--bad)', opacity:'0.7'});

    /* сетка: 1000 кадров шагом 40 по горизонтали, 25 этажей по вертикали */
    for(var t=0; t<=FRAMES; t+=STEP) line(t,0,t,CHARS,{stroke:'var(--grid)','stroke-width':1});
    for(var u=0; u<=CHARS; u++)      line(0,u,FRAMES,u,{stroke:'var(--grid)','stroke-width':1});

    /* граница «не выше диагонали» */
    line(0,0,CHARS,CHARS,{stroke:'var(--accent)','stroke-width':1.5,
      'stroke-dasharray':'4 3', opacity:'0.9'});

    /* оси */
    line(0,0,FRAMES,0,{stroke:'var(--axis)','stroke-width':2});
    line(0,0,0,CHARS,{stroke:'var(--axis)','stroke-width':2});

    /* монотонный путь по клеткам */
    var pts=[[0,0]];
    for(var i=0;i<RISES.length;i++){ pts.push([RISES[i],i]); pts.push([RISES[i],i+1]); }
    pts.push([FRAMES,CHARS]);
    el('polyline',{points:pts.map(function(p){return sx(p[0])+','+sy(p[1]);}).join(' '),
      fill:'none', stroke:'var(--accent)','stroke-width':2.6,
      'stroke-linejoin':'round','stroke-linecap':'round'});
    el('circle',{cx:sx(0),cy:sy(0),r:4.5,fill:'var(--accent)'});
    el('circle',{cx:sx(FRAMES),cy:sy(CHARS),r:4.5,fill:'var(--accent)'});

    /* подписи осей */
    text(0, CHARS, 0, -26, 'start', 'dim', 'напечатано символов \u2191');
    text(FRAMES, 0, 0, 30, 'end', 'dim', 'кадры \u2192');
    text(0, 0, -10, 4, 'end', 'lbl', '0');
    text(0, CHARS, -10, 4, 'end', 'lbl', '25');
    text(FRAMES, 0, 0, 15, 'middle', 'lbl', '1000');

    /* старт и финиш: разведены под ось и над сеткой */
    text(0, 0, 2, 15, 'start', 'lbl', 'старт: кадр 1, лист пуст');
    text(FRAMES, CHARS, 0, -12, 'end', 'lbl', 'финиш: 1000 кадров, 25 символов');

    /* запретная зона: выноска сбоку */
    line(52, 21, 24, 22, {stroke:'var(--axis)','stroke-width':1});
    text(55, 21, 0, 4, 'start', 'dim', 'выше диагонали нельзя: 25 букв \u2014 минимум 25 кадров');

    /* главная подпись */
    text(FRAMES/2, 0, 0, 42, 'middle', 'big', '25 000 клеток, в каждой выбор из словаря');
  }catch(e){
    svg.setAttribute('hidden','hidden');
    var fb=document.getElementById('fb');
    fb.removeAttribute('hidden');
    fb.textContent='Схема не построилась. Она показывает сетку: по горизонтали 1000 '+
      'кадров, по вертикали 25 позиций текста (от 0 до 25). Старт \u2014 левый нижний '+
      'угол (кадр 1, лист пуст), финиш \u2014 правый верхний (1000 кадров, 25 символов). '+
      'Путь идёт только вправо (blank или повтор) и вправо-вверх (новый символ), '+
      'не спускается, не идёт влево и не поднимается выше диагонали. '+
      'Итого 25 000 клеток, в каждой выбор из словаря.';
  }
})();
</script>
</body>
</html>
