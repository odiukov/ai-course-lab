<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Карта пяти бенчмарков</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fb;
      --surface: #ffffff;
      --surface-alt: #eef2f7;
      --ink: #172033;
      --muted: #596579;
      --line: #c8d1df;
      --strong-line: #8794a8;
      --accent-a: #356ae6;
      --accent-b: #8358d7;
      --accent-c: #16856c;
      --accent-d: #c36a18;
      --accent-e: #c44555;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --surface: #192230;
        --surface-alt: #222d3d;
        --ink: #eef3fb;
        --muted: #b5c0d0;
        --line: #39475b;
        --strong-line: #708098;
        --accent-a: #73a0ff;
        --accent-b: #b897ff;
        --accent-c: #54cbb0;
        --accent-d: #f0a45c;
        --accent-e: #f1808d;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    .static-title {
      background: var(--page);
      color: var(--ink);
      font-size: 20px;
      font-weight: bold;
    }

    svg {
      display: block;
      width: 100%;
      max-width: 1200px;
      height: auto;
      max-height: 468px;
      background: var(--page);
      color: var(--ink);
      shape-rendering: geometricPrecision;
    }

    .row {
      fill: var(--surface);
      stroke: var(--line);
      stroke-width: 1.5;
    }

    .separator,
    .header-rule,
    .footer-rule {
      fill: none;
      stroke: var(--line);
      stroke-width: 1;
    }

    .header-rule {
      stroke: var(--strong-line);
      stroke-width: 1.5;
    }

    .header-label {
      fill: var(--muted);
      font-size: 14px;
      font-weight: bold;
    }

    .benchmark {
      fill: var(--ink);
      font-size: 19px;
      font-weight: bold;
    }

    .category {
      fill: var(--muted);
      font-size: 13px;
    }

    .cell {
      fill: var(--ink);
      font-size: 16px;
    }

    .risk {
      fill: var(--ink);
      font-size: 16px;
    }

    .footer {
      fill: var(--muted);
      font-size: 15px;
      font-weight: bold;
    }

    .tone-a { fill: var(--accent-a); }
    .tone-b { fill: var(--accent-b); }
    .tone-c { fill: var(--accent-c); }
    .tone-d { fill: var(--accent-d); }
    .tone-e { fill: var(--accent-e); }

    .fallback,
    noscript {
      background: var(--surface-alt);
      color: var(--ink);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="static-title">Карта пяти бенчмарков</div>

  <svg
    id="benchmark-map"
    viewBox="0 0 1200 468"
    width="1200"
    height="468"
    preserveAspectRatio="xMidYMid meet"
    role="img"
    aria-labelledby="diagram-title diagram-description"
  >
    <title id="diagram-title">Карта пяти бенчмарков для агентных систем</title>
    <desc id="diagram-description">
      Пять строк сопоставляют бенчмарк, измеряемую способность, основной
      baseline и главный риск интерпретации.
    </desc>
    <g id="drawing"></g>
  </svg>

  <div id="fallback" class="fallback" hidden>
    Схема должна была показать пять строк: MARBLE, COMMA, MedAgentBoard,
    AgentArch и SWE-bench Pro — с измеряемой осью, основным baseline и риском
    интерпретации для каждой.
  </div>

  <noscript>
    Схема должна была показать пять бенчмарков и помочь выбрать тест по
    способности, которую нужно измерить.
  </noscript>

  <script>
    const data = [
      {
        kind: "settings",
        origin: [0, 0],
        scale: [1, 1],
        namespace: "http://www.w3.org/2000/svg",
        headerRule: { x1: 18, y1: 61, x2: 1182, y2: 61 },
        footerRule: { x1: 18, y1: 423, x2: 1182, y2: 423 },
        footer: {
          x: 600,
          y: 451,
          text: "Сначала способность → затем правильный бенчмарк → только потом число"
        },
        separator: { from: 10, to: 49 },
        separatorXs: [225, 515, 805],
        headers: [
          { x: 44, y: 38, text: "БЕНЧМАРК", anchor: "start" },
          { x: 252, y: 38, text: "ИЗМЕРЯЕМАЯ ОСЬ", anchor: "start" },
          { x: 542, y: 38, text: "ОСНОВНОЙ BASELINE", anchor: "start" },
          { x: 827, y: 38, text: "РИСК ИНТЕРПРЕТАЦИИ", anchor: "start" }
        ]
      },
      {
        kind: "row",
        tone: "tone-a",
        box: { x: 18, y: 74, w: 1164, h: 59 },
        bar: { x: 18, y: 74, w: 7, h: 59 },
        benchmark: {
          x: 44,
          y: 99,
          lines: ["MARBLE"],
          gap: 18
        },
        category: {
          x: 44,
          y: 119,
          lines: ["топология команды"],
          gap: 16
        },
        axis: {
          x: 252,
          y: 98,
          lines: ["Продвижение по вехам", "при разных топологиях"],
          gap: 20
        },
        baseline: {
          x: 542,
          y: 98,
          lines: ["Те же задачи, другие", "топологии"],
          gap: 20
        },
        risk: {
          x: 827,
          y: 98,
          lines: ["Победитель зависит от типа задачи;", "граф не универсален"],
          gap: 20
        }
      },
      {
        kind: "row",
        tone: "tone-b",
        box: { x: 18, y: 141, w: 1164, h: 59 },
        bar: { x: 18, y: 141, w: 7, h: 59 },
        benchmark: {
          x: 44,
          y: 166,
          lines: ["COMMA"],
          gap: 18
        },
        category: {
          x: 44,
          y: 186,
          lines: ["мультимодальность"],
          gap: 16
        },
        axis: {
          x: 252,
          y: 165,
          lines: ["Координацию при разном", "доступе к модальностям"],
          gap: 20
        },
        baseline: {
          x: 542,
          y: 176,
          lines: ["Случайный выбор"],
          gap: 20
        },
        risk: {
          x: 827,
          y: 165,
          lines: ["Средний балл скрывает провал", "передачи между модальностями"],
          gap: 20
        }
      },
      {
        kind: "row",
        tone: "tone-c",
        box: { x: 18, y: 208, w: 1164, h: 59 },
        bar: { x: 18, y: 208, w: 7, h: 59 },
        benchmark: {
          x: 44,
          y: 233,
          lines: ["MedAgentBoard"],
          gap: 18
        },
        category: {
          x: 44,
          y: 253,
          lines: ["разделение труда"],
          gap: 16
        },
        axis: {
          x: 252,
          y: 232,
          lines: ["Пользу специализации на", "медицинских задачах"],
          gap: 20
        },
        baseline: {
          x: 542,
          y: 232,
          lines: ["Одна LLM", "с теми же задачами"],
          gap: 20
        },
        risk: {
          x: 827,
          y: 232,
          lines: ["Диалог агентов может стоить", "дороже специализации"],
          gap: 20
        }
      },
      {
        kind: "row",
        tone: "tone-d",
        box: { x: 18, y: 275, w: 1164, h: 59 },
        bar: { x: 18, y: 275, w: 7, h: 59 },
        benchmark: {
          x: 44,
          y: 300,
          lines: ["AgentArch"],
          gap: 18
        },
        category: {
          x: 44,
          y: 320,
          lines: ["слои архитектуры"],
          gap: 16
        },
        axis: {
          x: 252,
          y: 299,
          lines: ["Вклад инструментов, памяти", "и оркестрации"],
          gap: 20
        },
        baseline: {
          x: 542,
          y: 299,
          lines: ["Архитектура без", "проверяемого слоя"],
          gap: 20
        },
        risk: {
          x: 827,
          y: 299,
          lines: ["Полная сборка не доказывает", "ценность каждого слоя"],
          gap: 20
        }
      },
      {
        kind: "row",
        tone: "tone-e",
        box: { x: 18, y: 342, w: 1164, h: 59 },
        bar: { x: 18, y: 342, w: 7, h: 59 },
        benchmark: {
          x: 44,
          y: 367,
          lines: ["SWE-bench Pro"],
          gap: 18
        },
        category: {
          x: 44,
          y: 387,
          lines: ["рабочий код"],
          gap: 16
        },
        axis: {
          x: 252,
          y: 366,
          lines: ["Исправление ошибок", "в сложных репозиториях"],
          gap: 20
        },
        baseline: {
          x: 542,
          y: 366,
          lines: ["Сырая модель без", "агентной обвязки"],
          gap: 20
        },
        risk: {
          x: 827,
          y: 366,
          lines: ["Высокий балл на Verified", "может отражать утечку задач"],
          gap: 20
        }
      }
    ];

    const settings = data.find(item => item.kind === "settings");
    const [originX, originY] = settings.origin;
    const [scaleX, scaleY] = settings.scale;
    const origin = { x: originX, y: originY };
    const scale = { x: scaleX, y: scaleY };

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const drawing = document.getElementById("drawing");
      const rows = data.filter(item => item.kind === "row");

      const make = tag =>
        document.createElementNS(settings.namespace, tag);

      const setAttributes = (node, attributes) => {
        Object.entries(attributes).forEach(([name, value]) => {
          node.setAttribute(name, value);
        });
        return node;
      };

      const drawRect = (box, className) => {
        const node = make("rect");
        setAttributes(node, {
          x: sx(box.x),
          y: sy(box.y),
          width: sx(box.x + box.w) - sx(box.x),
          height: sy(box.y + box.h) - sy(box.y),
          class: className
        });
        drawing.appendChild(node);
      };

      const drawLine = (line, className) => {
        const node = make("line");
        setAttributes(node, {
          x1: sx(line.x1),
          y1: sy(line.y1),
          x2: sx(line.x2),
          y2: sy(line.y2),
          class: className
        });
        drawing.appendChild(node);
      };

      const drawText = (label, className, anchor) => {
        const node = make("text");
        setAttributes(node, {
          x: sx(label.x),
          y: sy(label.y),
          class: className,
          "text-anchor": anchor
        });
        node.textContent = label.text;
        drawing.appendChild(node);
      };

      const drawBlock = (block, className) => {
        const node = make("text");
        setAttributes(node, {
          class: className,
          "text-anchor": "start"
        });

        block.lines.forEach((line, index) => {
          const part = make("tspan");
          setAttributes(part, {
            x: sx(block.x),
            y: sy(block.y + index * block.gap)
          });
          part.textContent = line;
          node.appendChild(part);
        });

        drawing.appendChild(node);
      };

      settings.headers.forEach(header => {
        drawText(header, "header-label", header.anchor);
      });

      drawLine(settings.headerRule, "header-rule");

      rows.forEach(row => {
        drawRect(row.box, "row");
        drawRect(row.bar, row.tone);

        settings.separatorXs.forEach(x => {
          drawLine(
            {
              x1: x,
              y1: row.box.y + settings.separator.from,
              x2: x,
              y2: row.box.y + settings.separator.to
            },
            "separator"
          );
        });

        drawBlock(row.benchmark, "benchmark");
        drawBlock(row.category, "category");
        drawBlock(row.axis, "cell");
        drawBlock(row.baseline, "cell");
        drawBlock(row.risk, "risk");
      });

      drawLine(settings.footerRule, "footer-rule");
      drawText(settings.footer, "footer", "middle");
    } catch (error) {
      const svg = document.getElementById("benchmark-map");
      const fallback = document.getElementById("fallback");
      svg.setAttribute("hidden", "hidden");
      fallback.removeAttribute("hidden");
    }
  </script>
</body>
</html>
