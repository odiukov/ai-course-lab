<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Восемь конфигураций AgentArch</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f6f8fc;
    --panel: #ffffff;
    --card: #ffffff;
    --card-strong: #eef4ff;
    --ink: #172033;
    --muted: #5e6a80;
    --border: #aeb9cb;
    --grid: #d8dfeb;
    --tools: #1473e6;
    --memory: #a54cc5;
    --orchestration: #d56b18;
    --on: #197448;
    --off: #7c8799;
    --fallback: #8f251f;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #111620;
      --panel: #171e2b;
      --card: #202938;
      --card-strong: #263852;
      --ink: #eef3fb;
      --muted: #b5bfd0;
      --border: #66758b;
      --grid: #39465a;
      --tools: #65a9ff;
      --memory: #d58aec;
      --orchestration: #ffac69;
      --on: #70d5a0;
      --off: #a8b2c2;
      --fallback: #ff9b95;
    }
  }

  html,
  body {
    background: var(--page);
    color: var(--ink);
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
  }

  .diagram {
    background: var(--panel);
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .heading {
    font-size: 24px;
    font-weight: bold;
    color: var(--ink);
    text-align: center;
  }

  .subheading {
    font-size: 15px;
    color: var(--muted);
    text-align: center;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 430px;
    background: var(--panel);
    font-family: inherit;
  }

  .edge {
    fill: none;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .edge-tools {
    stroke: var(--tools);
  }

  .edge-memory {
    stroke: var(--memory);
  }

  .edge-orchestration {
    stroke: var(--orchestration);
  }

  .arrow-tools {
    fill: var(--tools);
  }

  .arrow-memory {
    fill: var(--memory);
  }

  .arrow-orchestration {
    fill: var(--orchestration);
  }

  .card {
    fill: var(--card);
    stroke: var(--border);
    stroke-width: 2;
  }

  .card-full {
    fill: var(--card-strong);
    stroke: var(--tools);
    stroke-width: 3;
  }

  .card-base {
    stroke: var(--muted);
  }

  .card-title {
    fill: var(--ink);
    font-size: 13px;
    font-weight: bold;
    text-anchor: middle;
    dominant-baseline: middle;
  }

  .state {
    font-size: 12px;
    font-weight: bold;
    text-anchor: middle;
    dominant-baseline: middle;
  }

  .state-on {
    fill: var(--on);
  }

  .state-off {
    fill: var(--off);
  }

  .guide {
    fill: var(--muted);
    font-size: 15px;
    font-weight: bold;
    text-anchor: middle;
    dominant-baseline: middle;
  }

  .legend-label {
    fill: var(--ink);
    font-size: 13px;
    text-anchor: start;
    dominant-baseline: middle;
  }

  .legend-note {
    fill: var(--muted);
    font-size: 13px;
    text-anchor: end;
    dominant-baseline: middle;
  }

  #fallback {
    color: var(--fallback);
    font-size: 15px;
    text-align: center;
  }
</style>
</head>
<body>
<main class="diagram">
  <div class="heading">Восемь конфигураций AgentArch</div>
  <div class="subheading">3 переключателя · 8 комбинаций · сравнение соседей при остальных равных</div>

  <svg
    id="scheme"
    viewBox="0 0 1200 430"
    width="1200"
    height="430"
    preserveAspectRatio="xMidYMid meet"
    role="img"
    aria-labelledby="svg-title svg-description">
    <title id="svg-title">Куб восьми конфигураций AgentArch</title>
    <desc id="svg-description">
      Восемь карточек показывают все сочетания инструментов, памяти и
      оркестрации. Стрелки соединяют конфигурации, отличающиеся ровно одним
      включённым слоем.
    </desc>
    <g id="drawing"></g>
  </svg>

  <div id="fallback" hidden>
    Схема должна была показать 8 комбинаций инструментов, памяти и
    оркестрации и попарные сравнения, в которых меняется только один слой.
  </div>
</main>

<script>
(() => {
  const data = {
    namespace: "http://www.w3.org/2000/svg",
    canvas: [1200, 430],
    unit: 1,
    guide: [2.05, 0.27],
    card: {
      width: 0.82,
      height: 0.58,
      titleOffset: -0.13,
      stateOffset: 0.15,
      stateColumns: [-0.27, 0, 0.27]
    },
    arrow: {
      length: 0.13,
      halfWidth: 0.07
    },
    nodes: [
      {
        id: "base",
        point: [0.45, 3.42],
        title: "без слоёв",
        states: [
          ["И", "off"],
          ["П", "off"],
          ["О", "off"]
        ],
        kind: "base"
      },
      {
        id: "tools",
        point: [2.55, 3.42],
        title: "только инструменты",
        states: [
          ["И", "on"],
          ["П", "off"],
          ["О", "off"]
        ],
        kind: "normal"
      },
      {
        id: "memory",
        point: [0.45, 1.92],
        title: "только память",
        states: [
          ["И", "off"],
          ["П", "on"],
          ["О", "off"]
        ],
        kind: "normal"
      },
      {
        id: "tools-memory",
        point: [2.55, 1.92],
        title: "инструменты + память",
        states: [
          ["И", "on"],
          ["П", "on"],
          ["О", "off"]
        ],
        kind: "normal"
      },
      {
        id: "orchestration",
        point: [1.50, 2.67],
        title: "только оркестрация",
        states: [
          ["И", "off"],
          ["П", "off"],
          ["О", "on"]
        ],
        kind: "normal"
      },
      {
        id: "tools-orchestration",
        point: [3.60, 2.67],
        title: "инструменты + оркестрация",
        states: [
          ["И", "on"],
          ["П", "off"],
          ["О", "on"]
        ],
        kind: "normal"
      },
      {
        id: "memory-orchestration",
        point: [1.50, 1.17],
        title: "память + оркестрация",
        states: [
          ["И", "off"],
          ["П", "on"],
          ["О", "on"]
        ],
        kind: "normal"
      },
      {
        id: "full",
        point: [3.60, 1.17],
        title: "все три слоя",
        states: [
          ["И", "on"],
          ["П", "on"],
          ["О", "on"]
        ],
        kind: "full"
      }
    ],
    edges: [
      ["base", "tools", "tools", 0.22],
      ["memory", "tools-memory", "tools", 0.22],
      ["orchestration", "tools-orchestration", "tools", 0.22],
      ["memory-orchestration", "full", "tools", 0.22],

      ["base", "memory", "memory", 0.22],
      ["tools", "tools-memory", "memory", 0.22],
      ["orchestration", "memory-orchestration", "memory", 0.22],
      ["tools-orchestration", "full", "memory", 0.22],

      ["base", "orchestration", "orchestration", 0.38],
      ["tools", "tools-orchestration", "orchestration", 0.38],
      ["memory", "memory-orchestration", "orchestration", 0.38],
      ["tools-memory", "full", "orchestration", 0.38]
    ],
    legend: [
      {
        type: "tools",
        from: [0.18, 3.98],
        to: [0.52, 3.98],
        label: [0.59, 3.98],
        text: "добавить инструменты"
      },
      {
        type: "memory",
        from: [1.38, 3.98],
        to: [1.72, 3.98],
        label: [1.79, 3.98],
        text: "добавить память"
      },
      {
        type: "orchestration",
        from: [2.42, 3.98],
        to: [2.76, 3.98],
        label: [2.83, 3.98],
        text: "добавить оркестрацию"
      }
    ],
    legendNote: {
      point: [4.10, 3.98],
      text: "стрелка = один изменённый слой"
    }
  };

  const origin = { x: 55, y: 12 };
  const scale = { x: 275, y: 97 };

  const sx = x => origin.x + x * scale.x;
  const sy = y => origin.y + y * scale.y;

  const svg = document.getElementById("scheme");
  const drawing = document.getElementById("drawing");
  const fallback = document.getElementById("fallback");

  const element = (name, attributes, text) => {
    const node = document.createElementNS(data.namespace, name);
    Object.entries(attributes).forEach(([key, value]) => {
      node.setAttribute(key, String(value));
    });
    if (text) node.textContent = text;
    return node;
  };

  const appendArrow = (group, fromPoint, toPoint, type) => {
    const [fromX, fromY] = fromPoint;
    const [toX, toY] = toPoint;
    const deltaX = toX - fromX;
    const deltaY = toY - fromY;
    const magnitude = Math.hypot(deltaX, deltaY);
    const unitX = deltaX / magnitude;
    const unitY = deltaY / magnitude;
    const baseX = toX - unitX * data.arrow.length;
    const baseY = toY - unitY * data.arrow.length;
    const leftX = baseX - unitY * data.arrow.halfWidth;
    const leftY = baseY + unitX * data.arrow.halfWidth;
    const rightX = baseX + unitY * data.arrow.halfWidth;
    const rightY = baseY - unitX * data.arrow.halfWidth;

    group.appendChild(element("line", {
      x1: sx(fromX),
      y1: sy(fromY),
      x2: sx(toX),
      y2: sy(toY),
      class: `edge edge-${type}`
    }));

    group.appendChild(element("polygon", {
      points: [
        `${sx(toX)},${sy(toY)}`,
        `${sx(leftX)},${sy(leftY)}`,
        `${sx(rightX)},${sy(rightY)}`
      ].join(" "),
      class: `arrow-${type}`
    }));
  };

  try {
    const nodesById = new Map(
      data.nodes.map(node => [node.id, node])
    );

    const guideLayer = element("g", {});
    const edgeLayer = element("g", {});
    const cardLayer = element("g", {});
    const legendLayer = element("g", {});

    guideLayer.appendChild(element("text", {
      x: sx(data.guide[Symbol.iterator]().next().value),
      y: sy([...data.guide].reverse()[Symbol.iterator]().next().value),
      class: "guide"
    }, "Соседи отличаются ровно одним переключателем"));

    data.edges.forEach(edge => {
      const [fromId, toId, type, trim] = edge;
      const fromNode = nodesById.get(fromId);
      const toNode = nodesById.get(toId);
      const [fromX, fromY] = fromNode.point;
      const [toX, toY] = toNode.point;
      const deltaX = toX - fromX;
      const deltaY = toY - fromY;
      const start = [
        fromX + deltaX * trim,
        fromY + deltaY * trim
      ];
      const finish = [
        fromX + deltaX * (data.unit - trim),
        fromY + deltaY * (data.unit - trim)
      ];

      appendArrow(edgeLayer, start, finish, type);
    });

    data.nodes.forEach(node => {
      const [centerX, centerY] = node.point;
      const halfWidth = data.card.width / (data.unit + data.unit);
      const halfHeight = data.card.height / (data.unit + data.unit);
      const cardClass =
        node.kind === "full"
          ? "card card-full"
          : node.kind === "base"
            ? "card card-base"
            : "card";

      const group = element("g", {
        "aria-label": node.title
      });

      group.appendChild(element("rect", {
        x: sx(centerX - halfWidth),
        y: sy(centerY - halfHeight),
        width: sx(centerX + halfWidth) - sx(centerX - halfWidth),
        height: sy(centerY + halfHeight) - sy(centerY - halfHeight),
        class: cardClass
      }));

      group.appendChild(element("text", {
        x: sx(centerX),
        y: sy(centerY + data.card.titleOffset),
        class: "card-title"
      }, node.title));

      node.states.forEach((state, stateIndex) => {
        const [shortName, status] = state;
        const stateX = centerX + data.card.stateColumns[stateIndex];
        const stateText =
          status === "on"
            ? `${shortName} вкл`
            : `${shortName} выкл`;

        group.appendChild(element("text", {
          x: sx(stateX),
          y: sy(centerY + data.card.stateOffset),
          class: `state state-${status}`
        }, stateText));
      });

      cardLayer.appendChild(group);
    });

    data.legend.forEach(item => {
      appendArrow(legendLayer, item.from, item.to, item.type);

      const [labelX, labelY] = item.label;
      legendLayer.appendChild(element("text", {
        x: sx(labelX),
        y: sy(labelY),
        class: "legend-label"
      }, item.text));
    });

    const [noteX, noteY] = data.legendNote.point;
    legendLayer.appendChild(element("text", {
      x: sx(noteX),
      y: sy(noteY),
      class: "legend-note"
    }, data.legendNote.text));

    drawing.appendChild(guideLayer);
    drawing.appendChild(edgeLayer);
    drawing.appendChild(cardLayer);
    drawing.appendChild(legendLayer);
  } catch (error) {
    svg.hidden = true;
    fallback.hidden = false;
  }
})();
</script>
</body>
</html>
