- concept: верхняя граница журнала равна произведению лимита на файл и числа хранимых файлов
  question: 'Политика ротации: текущий файл журнала растёт до 3 МБ, всего хранится 7 файлов (текущий и шесть предыдущих). Сколько мегабайт истории максимум лежит на диске?'
  explanation: 'Ротация даёт жёсткий потолок: размер файла × число хранимых файлов = 3 × 7 = 21 МБ. Число команд, длина вывода и продолжительность проекта на этот потолок не влияют — меняется только глубина сохранённой истории.'
  kind: numeric
  answer: 21
  tolerance: 0.75
  id: 023-rotation-policy-1
  fingerprint: 6ae67d0f
- concept: порогом ротации служит объём файла, а не количество записанных команд
  question: Почему ротацию журнала обратной связи привязывают к размеру файла, а не к числу записей в нём?
  explanation: 'Лимит по числу записей ничего не гарантирует: сто коротких записей и сто записей с обрезанным, но длинным выводом различаются на порядки. Байтовый порог ограничивает и место на диске, и стоимость загрузки текущего файла независимо от того, какие команды в него попали.'
  kind: choice
  options:
    - 'Потому что записи сильно разного объёма: одна команда оставляет длинный хвост вывода, другая — пару строк, и только байты дают предсказуемый расход диска'
    - Потому что подсчёт строк в JSONL технически невозможен без полного разбора файла
    - Потому что число команд заранее неизвестно, а размер файла известен заранее
    - Потому что записи об успешных командах не должны учитываться в лимите
  correct: 0
  id: 023-rotation-policy-2
  fingerprint: 864bbc72
- concept: номер архивного файла обозначает возраст истории, поэтому переполнение сдвигает номера, а не дописывает данные в старый файл
  question: Текущий файл журнала достиг лимита. Что происходит с уже существующими архивными файлами при переполнении?
  explanation: 'Номер в имени — это возраст: чем больше номер, тем старее история. Поэтому при переполнении номера сдвигаются целиком, а самая старая порция уходит совсем. Дописывание в архив или бесконечная нумерация вернули бы неограниченный рост, ради устранения которого ротацию и вводят.'
  kind: choice
  options:
    - Каждый архив сдвигается на номер старше, а тот, чей номер вышел бы за пределы набора, удаляется
    - Содержимое текущего файла дописывается в самый старый архив, а текущий файл обнуляется
    - Архивы объединяются в один сводный файл, чтобы не терять историю
    - Архивы остаются на месте, а новый файл получает следующий свободный номер
  correct: 0
  id: 023-rotation-policy-3
