- concept: утверждение агента о результате не является доказательством выполнения; доказательством служит независимо захваченная запись запуска
  question: 'Агент сообщает: «Линтер отработал, замечаний нет». Что минимально требуется, чтобы это утверждение можно было проверить, не полагаясь на самого агента?'
  explanation: 'Любой пересказ агента — это его версия события. Проверяемым результат делает артефакт, созданный независимо от рассказа: что за команда запускалась, что она напечатала и с каким кодом завершилась. Уточняющие вопросы и отметки в плане порождены тем же источником, что и исходное утверждение, поэтому ничего не подтверждают.'
  kind: choice
  options:
    - Повторный вопрос агенту с требованием подтвердить результат
    - Запись запуска с точной командой, захваченными stdout/stderr и кодом выхода
    - Более развёрнутая формулировка отчёта агента с перечислением проверенных файлов
    - Пометка в плане задачи о том, что шаг «проверка линтером» выполнен
  correct: 1
  id: 001-razryv-1
  fingerprint: 86388f76
- concept: через раннер обратной связи проходит каждая команда, а не выборочно «важные»
  question: Команда предлагает пропускать через раннер обратной связи только тесты и деплой, а мелкие команды (сборка, миграции, установка зависимостей) запускать напрямую. Объясни своими словами, чем это опасно.
  explanation: 'Правило «каждая команда через раннер» держится не на важности команды, а на полноте следа: любой запуск вне раннера возвращает разрыв между рассказом и реальностью, который раннер и должен был убрать.'
  kind: open
  reference: 'Проверяемость держится на том, что у каждого запуска есть запись. Как только часть команд идёт мимо раннера, про них известно ровно столько, сколько рассказал агент: неудачная сборка или упавшая миграция не оставляют следа и попадают в цикл как «сделано». Хуже того, именно такой молчаливый сбой обычно и объясняет последующий провал тестов, но найти его будет нечем — ни кода выхода, ни stderr, ни длительности. Гейт проверки в конце задачи тоже увидит неполную картину и подтвердит результат по дырявому набору фактов.'
  id: 001-razryv-2
  fingerprint: 0dfc06ba
