- concept: внутри итерации повтора запись исхода предшествует решению о следующей попытке, а идентификатор текущей попытки становится родительским только после записи
  question: Расставь действия одной итерации цикла повторов в правильном порядке.
  explanation: 'Решение о повторе принимается по уже зафиксированному исходу, а не по промежуточному состоянию в памяти: иначе возможен повтор, следа которого в журнале нет. Родительский идентификатор обновляется последним, чтобы следующая итерация сослалась именно на только что записанную попытку.'
  kind: order
  items:
    - Выполнить тот же самый argv
    - Создать новый уникальный command_id для этой попытки
    - Собрать feedback record с текущим parent_command_id и дописать его в журнал
    - По записанному исходу решить, нужен ли следующий повтор
    - Запомнить command_id этой попытки как родительский для следующей
