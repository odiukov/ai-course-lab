- concept: лимит попыток считает первоначальный запуск, а не только повторы после него
  question: Цикл повторов настроен на max_attempts = 6, и команда падает при каждом выполнении. Сколько feedback record окажется в журнале после завершения цикла?
  explanation: Лимит ограничивает общее число выполнений, включая первое. Шесть попыток дают шесть записей и пять ссылок parent_command_id. Если считать лимит числом повторов сверх первого запуска, команда выполнится семь раз — типичная ошибка на границе.
