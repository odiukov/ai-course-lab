  fingerprint: 8340a8fa
- concept: обрезка задаёт верхнюю границу стоимости записи, поэтому размер лога не влияет на бюджет контекста цикла
  question: Прогон тестов выдал 900 мегабайт текста. Что обеспечивает обрезка, помимо сохранения финальных строк?
  explanation: 'Цикл падает не от плохого лога, а от лога, вытеснившего весь остальной контекст. Фиксированный лимит строк делает цену любой команды предсказуемой: сорок строк хвоста стоят пару сотен токенов независимо от того, было в выводе мегабайт или гигабайт.'
  kind: choice
  options:
    - Стоимость записи в контексте ограничена заранее и не зависит от размера вывода
    - Сам вывод команды становится короче на диске
    - Ошибки из середины лога переносятся в конец записи
  correct: 0
