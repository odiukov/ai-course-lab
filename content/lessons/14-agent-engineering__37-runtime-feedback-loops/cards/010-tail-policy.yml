- concept: небольшая голова вывода сохраняется потому, что контекст запуска печатается в начале и в хвосте не повторяется
  question: Зачем оставлять в записи несколько первых строк вывода, если решающая информация лежит в конце?
  explanation: 'Голова и хвост отвечают на разные вопросы: в каких условиях запускали и чем закончилось. Число отброшенных строк даёт маркер, а детерминированность обеспечивает правило выбора, а не наличие головы.'
  kind: choice
  options:
    - В начале печатается контекст запуска — версии, конфигурация, состав набора, — которого в хвосте уже нет
    - Первые строки нужны, чтобы посчитать число отброшенных строк
    - Без первых строк запись перестанет быть детерминированной
  correct: 0
