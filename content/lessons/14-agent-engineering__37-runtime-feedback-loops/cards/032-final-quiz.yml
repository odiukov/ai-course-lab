- concept: правила вычистки секретов проверяют на фикстуре-записи с заранее известным секретом, а не на живом выводе
  question: В раннер добавили шаг вычистки, убирающий строки вида `^Bearer ` и `password=`. Как убедиться, что он работает?
  explanation: 'Фикстура даёт контролируемый вход: известно, что именно должно исчезнуть и что обязано уцелеть, и проверка повторяема на каждом изменении набора паттернов. Просмотр реального журнала не гарантирует, что нужный вид секрета вообще встретился в выводе.'
  kind: choice
  options:
    - Прогнать вычистку на фикстуре-записи с заведомо известными секретами и сверить результат с ожидаемым
    - Запустить пару реальных команд и просмотреть журнал глазами
    - Убедиться, что регулярные выражения компилируются без ошибок
    - Проверить, что итоговый файл журнала стал меньше по объёму
