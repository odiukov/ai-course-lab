- concept: agent_note хранит ожидание агента, остальные поля записи — фактический исход, и смешивать их нельзя
  question: В записи обратной связи поле `agent_note` содержит «ожидаю, что миграции применятся без ошибок», а `exit_code` отличен от нуля. Как это читать?
  explanation: '`agent_note` — одна строка о том, что агент рассчитывал получить. Это часть записи специально для того, чтобы ожидание было видно рядом с фактом и отличалось от него. Расхождение между заметкой и кодом выхода — не поломка записи, а ровно тот сигнал, ради которого обратную связь и собирают.'
  kind: choice
  options:
    - Запись противоречива, её следует считать испорченной и перезапросить
    - '`agent_note` уточняет смысл кода выхода: ошибка была ожидаемой, значит некритична'
    - 'Ожидание агента не сбылось: `agent_note` фиксирует намерение, факт исхода несут остальные поля'
    - Приоритет у `agent_note`, потому что его пишет тот, кто знает контекст задачи
  correct: 2
  id: 002-observation-1
  fingerprint: ff123662
- concept: duration_ms отличает быстрый отказ от зависшей или убежавшей проверки при одинаковом коде выхода
  question: Проверка завершилась успешно, но `duration_ms` равен 240000 при обычных 3000 для этой же команды. Что именно даёт здесь длительность, чего не даёт код выхода?
  explanation: 'Код выхода — двоичный сигнал: успех или нет. 240000 мс против привычных 3000 мс — это ретрай внутри команды, ожидание сети, зависший дочерний процесс. Без `duration_ms` упавший быстро тест и тест, провисевший минуты, выглядят в записи одинаково.'
  kind: choice
  options:
    - Она уточняет, какие именно тесты выполнялись внутри прогона
    - Она показывает аномально медленную или зависавшую проверку, которую успешный код выхода полностью скрывает
    - Она заменяет stderr, если тот оказался пустым
    - Она нужна только для сравнения машин между собой и на выводы о прогоне не влияет
  correct: 1
  id: 002-observation-2
  fingerprint: be045bde
