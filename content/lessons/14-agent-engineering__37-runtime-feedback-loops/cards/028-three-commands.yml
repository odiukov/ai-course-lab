- concept: 'структура записи не зависит от исхода: у успеха, падения и долгого прогона одни и те же поля, различаются только значения'
  question: Успешная, упавшая и долго работавшая команды прошли через раннер. Что у их записей общего?
  explanation: Единая схема — то, что делает прогоны сопоставимыми. Если бы у падения была своя форма записи, сравнить две попытки или отсортировать историю было бы нельзя.
  kind: choice
  options:
    - 'Набор полей: команда, потоки, код выхода, момент старта, длительность, заметка агента — исход выражен значениями этих полей, а не другой формой записи'
    - Одинаковый код выхода, потому что раннер сам отработал без сбоя
    - Одинаковая длительность, потому что она измеряет работу раннера
  correct: 0
  id: 028-three-commands-1
  fingerprint: 6b36af1a
- concept: напечатанный на экран срез — это представление, а не содержимое журнала
  question: Демо печатает по одной последней записи на каждую команду. Ревьюер видит на экране только зелёные результаты. Что он может заключить об истории попыток?
  explanation: Печать — удобство для человека у терминала, а не источник истины. Вердикт и разбор строятся по журналу; то, что не попало на экран, не исчезло.
  kind: choice
  options:
    - 'Ничего: экран показывает срез, а история попыток лежит в журнале, и судить о ней нужно по нему'
    - Что предыдущих попыток не было — иначе они попали бы на экран
    - Что предыдущие записи были перезаписаны последней
  correct: 0
