- concept: 'порядок одного прохода раннера: запуск, захват наблюдаемых данных, очистка и обрезка, дописывание записи, повторное чтение из журнала'
  question: Расставь действия одного прохода раннера обратной связи в порядке выполнения.
  explanation: 'Очистка и обрезка стоят между захватом и записью: в журнал попадает уже обработанный результат, а не сырой захват. Повторное чтение стоит последним, потому что оно проверяет именно то, что легло на диск.'
  kind: order
  items:
    - Запустить процесс по точному списку argv
    - Захватить раздельно stdout и stderr, код выхода и время выполнения
    - Вычистить секреты и детерминированно обрезать потоки
    - Дописать готовую запись строкой в журнал
    - Прочитать запись обратно тем же загрузчиком, которым пользуется агент
  id: 026-runner-cycle-1
  fingerprint: 384d8063
- concept: следующий шаг строится на сохранённой записи, а не на объекте в памяти, потому что объект богаче записи и исчезает вместе с процессом
  question: Раннер уже держит результат команды в памяти. Зачем перечитывать только что записанную строку из журнала вместо того, чтобы вернуть этот объект?
  explanation: 'Правило простое: решение принимается по тому свидетельству, которое переживёт запуск. Всё, что осталось только в памяти, доказательством не является.'
  kind: open
  reference: Объект в памяти и сохранённая запись — не одно и то же. Объект содержит невычищенный и необрезанный вывод, может нести поля, которые не сериализуются, и живёт только до конца процесса. Сохранённая запись — это то, что увидят следующий шаг агента, проверка в конце задачи и разбор постфактум. Если рассуждать по объекту, агент опирается на данные, которых в журнале нет, и его выводы нельзя ни воспроизвести, ни проверить. Повторное чтение заодно подтверждает, что запись действительно сериализовалась и действительно дописалась.
  id: 026-runner-cycle-2
  fingerprint: bdc5a28d
