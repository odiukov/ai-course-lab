- concept: отсутствующий код выхода обязывает цикл остановиться, а не объявить проверку пройденной
  question: Раннер вернул запись, в которой поле кода выхода пустое (null), а поле error сообщает, что связь с процессом потеряна. Как должен поступить цикл агента?
  explanation: Прогресс объявляется только по захваченному коду завершения. Пустой код — это отсутствие доказательства, а не мягкая форма успеха, поэтому шаг, который опирается на пройденную проверку, выполнять нельзя.
  kind: choice
  options:
    - 'Считать проверку пройденной: раз числовой ошибки нет, провала не было'
    - Остановиться и получить новый достоверный результат запуска, прежде чем идти дальше
    - Взять код выхода предыдущего запуска той же команды
    - Продолжить, если agent_note предсказывал успешное завершение
  correct: 1
  id: 019-null-means-unknown-1
  fingerprint: 7915cc5c
- concept: поле error описывает сбой самого раннера при захвате результата, а не ошибку выполненной команды
  question: В записи пустой код выхода и заполненное поле error. Что именно описывает error?
  explanation: 'Ошибки самой команды живут в её потоках и в коде завершения. error — это отчёт о поломке захвата: раннер упал, потерял процесс или не дошёл до считывания итога.'
  kind: choice
  options:
    - Причину, по которой раннер не смог дождаться завершения и получить итог команды
    - Текст, который команда напечатала в поток диагностики
    - Вердикт гейта проверки по итогам задачи
    - Сообщение об ошибке компиляции внутри команды
  correct: 0
  id: 019-null-means-unknown-2
  fingerprint: 4586c558
- concept: 'запись без кода выхода не подтверждает и провал команды: работа могла быть выполнена целиком либо не начаться вовсе'
  question: Команда развёртывания попала в журнал с пустым кодом выхода. Объясни своими словами, чем это отличается от записи с ненулевым кодом с точки зрения того, что известно о выполнении команды.
  explanation: 'Частая ошибка — читать пустое значение как «провал». Провал тоже надо доказать: он подтверждается захваченным ненулевым кодом, а не отсутствием данных.'
  kind: open
  reference: 'Ненулевой код — это захваченный факт: команда дошла до конца и сообщила об ошибке; можно чинить причину. Пустой код не сообщает ничего о самой команде: она могла отработать полностью и изменить систему, могла упасть, а могла не стартовать. Поэтому по такой записи нельзя утверждать ни успех, ни провал, и её нельзя использовать как доказательство ни в ту, ни в другую сторону.'
  id: 019-null-means-unknown-3
  fingerprint: 684e5265
