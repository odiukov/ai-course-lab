- concept: фреймворк владеет механизмом запуска, раннер владеет формой записи результата
  question: Команду может запускать встроенный Bash-инструмент агентного продукта, shell-нода графа или обычный job сборки. Что при этом принадлежит твоему раннеру?
  explanation: Раннер — тонкая обёртка. Запускать умеет каждый фреймворк по-своему; ценность в том, что после запуска любой результат становится записью одной и той же формы.
  kind: choice
  options:
    - 'Форма результата: приведение нативного исхода к одному набору полей записи'
    - Сам механизм запуска процесса — раннер обязан подменить инструменты фреймворка
    - Хранилище артефактов, куда фреймворк складывает логи
  correct: 0
  id: 030-portable-format-1
  fingerprint: 99dcbbf8
- concept: адаптер к нативному результату — единственная часть, зависящая от фреймворка; потребители записи при переезде не переписываются
  question: Почему привязка следующего шага агента напрямую к нативному формату инструмента дорого обходится при смене фреймворка?
  explanation: Стоимость переезда пропорциональна числу мест, знающих формат. Адаптер сводит это число к одному.
  kind: open
  reference: 'У записи не один потребитель: по ней решает следующий ход сам агент и по ней же выносится вердикт о завершении задачи. Если оба читают нативный формат инструмента, то переезд заставляет переписать обоих, плюс всё, что разбирает историю. С промежуточным слоем меняется только адаптер на входе — кусок, который берёт нативный исход запуска и раскладывает его по полям записи. Потребители не трогают вовсе.'
  id: 030-portable-format-2
  fingerprint: '29516886'
- concept: стабильный формат сохраняет сопоставимость записей, сделанных до и после миграции
  question: Часть истории запусков накоплена на старом фреймворке, часть — на новом. Что даёт стабильная форма записи?
  explanation: Формат — это контракт во времени, а не только между компонентами. Пока поля те же, накопленная история остаётся рабочим материалом, а не грузом, требующим миграции.
  kind: choice
  options:
    - Старые и новые записи читаются одним загрузчиком и сравниваются напрямую, без конвертации архива
    - Старые записи можно удалить, потому что новый фреймворк воспроизведёт их сам
    - Длительности старых запусков автоматически пересчитываются под новый механизм запуска
  correct: 0
  id: 030-portable-format-3
  fingerprint: aa1536c2
