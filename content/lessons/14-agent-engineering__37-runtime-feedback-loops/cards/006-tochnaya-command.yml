- concept: если оболочка действительно нужна, её участие записывают явным элементом argv, а не прячут в строке
  question: Команде нужна именно оболочка (пайп и подстановка). Дополни argv так, чтобы участие оболочки было зафиксировано явно.
  explanation: 'Оболочку не запрещают — её перестают прятать. `["sh", "-c", "..."]` честно говорит: запускается интерпретатор, а вот эта строка отдана ему на разбор. Читатель записи сразу видит, где кончается зафиксированный факт и начинается интерпретация.'
  kind: cloze
  template: '["sh", "___", "gzip *.log | tee archive.txt"]'
