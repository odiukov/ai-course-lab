- concept: argv фиксирует границы аргументов, которые в единой строке остаются неоднозначными
  question: Нужно скопировать файл с именем `report final.txt` в каталог `backup/`. Какая запись поля `command` однозначно фиксирует выполненное действие?
  explanation: argv — упорядоченный список уже разобранных элементов, поэтому пробел внутри имени не превращает его в два аргумента. Первый вариант оставляет разбор оболочке, второй склеивает всё в один аргумент, четвёртый разрывает имя файла на части — то есть описывает другое действие.
  kind: choice
  options:
    - '`"cp report final.txt backup/"`'
    - '`["cp report final.txt backup/"]`'
    - '`["cp", "report final.txt", "backup/"]`'
    - '`["cp", "report", "final.txt", "backup/"]`'
  correct: 2
