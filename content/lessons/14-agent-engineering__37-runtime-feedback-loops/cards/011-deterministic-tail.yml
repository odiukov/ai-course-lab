- concept: число в маркере обрезки равно разности между реальным числом строк и лимитом
  question: Вывод содержит 512 строк, лимит хвоста — 64 строки. Какое число должно стоять в маркере `...truncated N lines...`?
  explanation: 'N = 512 − 64 = 448. Число берётся из фактического подсчёта строк, а не из оценки размера или числа байт: только тогда по записи можно понять, какая доля вывода недоступна, и одинаковый вход всегда даёт одинаковый маркер.'
  kind: numeric
  answer: 448
  tolerance: 1
  id: 011-deterministic-tail-1
  fingerprint: 8139aaa3
- concept: равенство числа строк лимиту не является превышением, поэтому маркер не добавляется
  question: Функция обрезки получила текст ровно из 30 строк при лимите 30 строк. Что она должна вернуть?
  explanation: Лимит — верхняя допустимая граница, а не строгое неравенство. На равенстве отбрасывать нечего, и маркер о нуле отброшенных строк был бы ложным сообщением о потере данных. Эта граница — типичная ошибка на единицу, поэтому её проверяют отдельным тестом.
  kind: choice
  options:
    - Исходный текст без изменений и без маркера
    - 30 строк с маркером `...truncated 0 lines...` в начале
    - 29 строк и маркер об одной отброшенной строке
    - Пустую строку, так как лимит исчерпан
  correct: 0
  id: 011-deterministic-tail-2
  fingerprint: 556ab90e
- concept: 'порядок шагов механической обрезки хвоста: подсчёт, сравнение с лимитом, отбор последних строк, добавление маркера'
  question: Расставь шаги функции, сохраняющей хвост вывода, в порядке выполнения.
  explanation: 'Порядок важен: количество отброшенных строк известно только после подсчёта, а маркер приписывается уже к отобранному хвосту. Никакого просмотра содержимого строк в алгоритме нет — отбор идёт по позиции, поэтому результат не зависит от того, какие слова встретились в выводе.'
  kind: order
  items:
    - Разбить текст на строки и посчитать их количество
    - Сравнить количество строк с лимитом
    - Если строк не больше лимита — вернуть текст без изменений
    - Иначе взять последние строки в количестве лимита, сохранив их исходный порядок
    - Поставить перед ними маркер с числом отброшенных строк
  id: 011-deterministic-tail-3
  fingerprint: 26d8c334
