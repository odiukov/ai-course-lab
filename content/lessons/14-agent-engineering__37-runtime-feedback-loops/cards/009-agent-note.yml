- concept: agent_note заполняется до запуска команды, иначе прогноз подгоняется под уже увиденный исход
  question: Расставь шаги работы с agent_note в правильном порядке.
  explanation: Ставка делается до вскрытия результата. Если строку писать после чтения полей, она неизбежно опишет то, что уже известно, и сверять будет нечего.
  kind: order
  items:
    - Агент формулирует одной строкой ожидаемый наблюдаемый исход
    - Строка записывается в agent_note
    - Раннер выполняет команду
    - Агент читает код выхода и хвосты потоков
    - Агент сверяет записанное ожидание с фактическим исходом
  id: 009-agent-note-1
  fingerprint: d27eb70c
- concept: полезный agent_note называет наблюдаемый признак, по которому ожидание можно сверить с фактом
  question: Какая формулировка agent_note пригодна для последующей сверки с результатом?
  explanation: 'Ожидание должно быть опровержимым: назван код выхода и конкретное сообщение. Расплывчатая строка или описание намерения не дают признака, с которым можно сопоставить фактический исход.'
  kind: choice
  options:
    - «Ожидаю успешный код выхода и строку о применённой миграции»
    - «Ожидаю, что всё пройдёт нормально»
    - «Проверяю состояние базы после правок»
