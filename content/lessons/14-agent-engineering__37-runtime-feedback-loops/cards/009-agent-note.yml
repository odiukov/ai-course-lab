- concept: расхождение прогноза и фактического исхода — рабочий сигнал для следующего шага, а не дефект записи
  question: Записанное ожидание не совпало с фактическим исходом команды. Объясни своими словами, почему такую запись не считают браком.
  explanation: Ценность поля не в проценте попаданий, а в том, что промах виден и датирован. Совпадение подтверждает модель, расхождение её чинит.
  kind: open
  reference: 'Несовпадение показывает, что модель происходящего у агента неполная: он ошибся ровно в том месте, которое теперь известно. Это самая ценная запись в цикле — она обязывает пересмотреть предположение на следующем шаге, вместо того чтобы продолжать действовать по неверной картине. Браком была бы запись, где ожидание сформулировано после чтения результата: там совпадение гарантировано и ничего не проверяет.'
