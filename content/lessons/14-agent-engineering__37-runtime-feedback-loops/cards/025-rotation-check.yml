- concept: ротация ограничивает локальное хранение, а долговременное сохранение истории обеспечивается выгрузкой полного набора файлов наружу
  question: При переполнении журнала самый старый файл выбрасывается. Почему это не означает потерю свидетельств для позднего разбора?
  explanation: 'Два разных горизонта: «нужно для следующего действия» живёт на диске у агента и ограничено, «нужно для разбора через месяц» живёт в артефактах и ограничено политикой хранения артефактов.'
  kind: open
  reference: Полный ротированный набор уходит в хранилище артефактов сборки до вытеснения. Локальный диск отвечает за стоимость рантайма (ограниченный вход загрузчика), артефакты — за долговременную доступность истории. Разбор постфактум, восстановление цепочки повторов и аудит идут по артефактам, а не по рабочему файлу рядом с агентом. Если набор наружу не выгружается, выбрасывание старого файла действительно уничтожает свидетельства — тогда ротация превращается в потерю данных.
  id: 025-rotation-check-2
