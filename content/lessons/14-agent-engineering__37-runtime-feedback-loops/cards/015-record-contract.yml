- concept: неполученный код завершения представляется явным null, а не подставным успехом или ошибкой
  question: Проверку убил лимит времени в 120 секунд, процесс не успел вернуть код завершения. Что раннер записывает в exit_code?
  explanation: 'Успех и ошибка — оба утверждения о результате, которого не было. Отсутствующее поле неотличимо от потери при сборке записи. Явный null сохраняет честную границу знания: следующий читатель видит, что вердикта нет.'
  kind: choice
  options:
    - Значение успешного завершения — команда ведь не сообщила об ошибке
    - Обобщённый код ошибки — раз проверка не прошла
    - 'Явный null: код завершения не был получен, это отдельное состояние «неизвестно»'
    - Поле опускается, чтобы не занимать место в записи
  correct: 2
  id: 015-record-contract-1
  fingerprint: 7a4ee253
- concept: пустое значение поля означает известный факт отсутствия данных, а null — отсутствие самого знания
  question: В записи stdout_tail — пустой список строк, а exit_code — null. Что означает эта пара?
  explanation: 'Пустой хвост — это измерение: процесс наблюдали, строк не было. Null — отсутствие измерения. Смешать их значит принять «не знаем» за «ничего плохого»; различие определяет, можно ли вообще выносить вердикт по запуску.'
  kind: choice
  options:
    - 'Оба поля означают одно и то же: данные потеряны при сборке записи'
    - Вывод известен и в нём нет строк, а код завершения не был получен вообще
    - Команда завершилась успешно, просто ничего не напечатала
    - Запись повреждена, её нужно отбросить
  correct: 1
  id: 015-record-contract-2
  fingerprint: b551c5f0
