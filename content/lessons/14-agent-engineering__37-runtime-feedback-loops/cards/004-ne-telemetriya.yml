- concept: объём записи обратной связи ограничен тем, что влияет на ближайшее решение агента
  question: Почему запись обратной связи держат компактной, хотя место на диске стоит дёшево?
  explanation: Цена записи обратной связи измеряется токенами контекста на каждом шаге прогона, а не байтами на диске. Поэтому в неё кладут ровно то, на что агент опирается прямо сейчас.
  kind: open
  reference: 'Ограничение здесь не дисковое, а контекстное: запись читается агентом на следующем шаге и целиком занимает место в его окне. Полезно только то, что меняет ближайшее решение — что запускалось, чем закончилось, что видно в хвосте вывода. Всё остальное вытесняет из контекста саму задачу и повышает стоимость каждого шага. Долгие подробности не теряются — они место телеметрии, у которой другой читатель, другой срок хранения и другой файл.'
