- concept: набор паттернов вычистки — живой артефакт, который регулярно сверяют с реальным видом секретов в продакшене
  question: Раннер обратной связи вычищает секреты по фиксированному набору регулярных выражений, написанному при запуске сервиса и с тех пор не менявшемуся. Что с этим не так?
  explanation: Часть паттернов привязана к конкретным вендорам (AKIA у AWS, xox у Slack). Появился новый провайдер или сменился формат префикса — и старый список пропускает утечку. Поэтому пересмотр паттернов делают по расписанию, например раз в квартал.
  kind: choice
  options:
    - 'Ничего: набор шаблонов секретов универсален и не зависит от системы'
    - Форматы токенов и состав внешних сервисов со временем меняются, поэтому список паттернов надо периодически сверять с тем, как секреты реально выглядят в продакшене
    - Проблема решается переносом вычистки на момент чтения файла
    - Достаточно продублировать каждый паттерн в верхнем и нижнем регистре
  correct: 1
  id: 013-redact-on-write-1
  fingerprint: 1dd0d128
- concept: вычистке подлежит всякое поле записи, несущее содержимое потоков, а не только то, что видит человек
  question: Через какие данные раннера обязан пройти проход вычистки перед дописыванием записи?
  explanation: Секрет утекает по тому же каналу, что и обычный вывод; какой из двух потоков его понесёт, заранее неизвестно. Вычистка ставится на общий проход по содержимому потоков, иначе одно необработанное поле сводит защиту на нет.
  kind: choice
  options:
    - Только stderr, потому что секреты обычно печатаются в сообщениях об ошибках
    - Только тот фрагмент, который будет показан агенту в интерфейсе
    - Через любое содержимое, пришедшее из stdout и stderr, включая все производные от них поля записи
    - Только строки длиннее заданного лимита, короткие можно пропускать
  correct: 2
