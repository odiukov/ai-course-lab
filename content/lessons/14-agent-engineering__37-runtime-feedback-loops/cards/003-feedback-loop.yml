- concept: 'у записи обратной связи два потребителя: агент на следующем шаге и гейт проверки в конце задачи'
  question: Кто читает файл записей обратной связи в схеме раннера?
  explanation: Один файл, две роли. Агент читает записи, чтобы выбрать следующее действие внутри прогона; гейт читает их в конце, чтобы независимо решить, хватает ли фактов для приёмки. Если убрать второго читателя, приёмка снова опирается на рассказ; если убрать первого, цикл перестаёт быть самокорректирующимся.
  kind: choice
  options:
    - Только агент — на следующем шаге цикла
    - Только гейт проверки — при приёмке результата задачи
    - Агент на следующем шаге и гейт проверки в конце задачи
    - Дочерний процесс, чтобы понять, повторять ли команду
  correct: 2
  id: 003-feedback-loop-1
  fingerprint: 6aea5a2b
- concept: путь одного запуска замыкается только тогда, когда захваченный исход возвращается в агент и влияет на следующее действие
  question: Расставь стадии одного запуска через раннер обратной связи в правильном порядке.
  explanation: 'Схема — петля, а не цепочка. Без последней стадии остаётся список выполненных команд: действие произошло, но на решение не повлияло. Замкнутость появляется ровно в момент, когда захваченный исход возвращается тому же агенту, который команду отправил.'
  kind: order
  items:
    - Агент передаёт раннеру команду и свою заметку об ожидаемом результате
    - Раннер запускает дочерний процесс
    - Раннер захватывает stdout, stderr, код выхода и длительность
    - Раннер дописывает запись в файл обратной связи
    - Агент читает запись и выбирает следующее действие
  id: 003-feedback-loop-2
  fingerprint: 0594bb7c
