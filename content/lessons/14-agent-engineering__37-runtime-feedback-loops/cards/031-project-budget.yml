- concept: 'у бюджета обрезки нет универсального значения: он калибруется под типичный объём вывода конкретного проекта, и промах в любую сторону вредит'
  question: Раннер обратной связи держит единый лимит хвоста для всех проектов. По каким симптомам видно, что лимит для данного проекта слишком мал, и по каким — что слишком велик? Объясни своими словами.
  explanation: 'Бюджет обрезки — предел, подогнанный под типичный вывод именно этого проекта. Оба промаха стоят дорого, но по-разному: маленький лимит теряет решающую информацию, большой съедает бюджет контекста.'
  kind: open
  reference: 'Лимит мал, если причина сбоя систематически не попадает в запись: хвост обрывается раньше финального результата, и агент не получает контекста для следующего решения. Лимит велик, если запись раздувается повторяющимися сообщениями, которые ничего не меняют в решении: контекст цикла тратится на шум. Универсального числа нет — проект, где проверки печатают несколько десятков строк, обходится коротким хвостом, а сборка на пару тысяч строк предупреждений требует и большего хвоста, и более строгой очистки от шума.'
  id: 031-project-budget-1
  fingerprint: b15a9285
- concept: бюджет обрезки калибруют по выборке реальных типичных запусков проекта, а не по размеру репозитория или запасу на будущее
  question: Инженер настраивает лимит хвоста для раннера обратной связи в новом проекте. На что ему опереться при выборе числа строк?
  explanation: 'Число выводится из наблюдения за реальным потоком вывода: смотрят типичные прогоны обоих исходов и проверяют, доживает ли до записи решающая часть. Размер репозитория с объёмом вывода не связан, а «запас навсегда» превращает короткие проверки в источник сотен лишних строк, когда вывод всё же разрастается.'
  kind: choice
  options:
    - 'На несколько обычных успешных и неуспешных запусков: сохраняется ли в хвосте финальный результат и контекст, нужный агенту для следующего шага'
    - 'На размер репозитория: чем больше кодовая база, тем больше строк надо хранить'
    - На максимум, замеченный за всю историю проекта, с запасом сверху — чтобы никогда не пришлось менять
    - На среднее число строк во всех проектах компании, чтобы записи были сопоставимы между командами
  correct: 0
  id: 031-project-budget-2
  fingerprint: 0d69044c
- concept: при переносе раннера в другой проект подстраивается один регулятор — бюджет обрезки, — а писатель JSONL, загрузчик и замкнутый путь остаются прежними
  question: Раннер обратной связи переносят из проекта, где проверки печатают около 45 строк, в проект, где сборка сыплет 2 300 строк предупреждений. Что в нём приходится менять?
  explanation: «Под конкретный проект» означает одну настройку — бюджет обрезки. Механизм записи и чтения одинаков везде, иначе записи перестанут быть сопоставимыми и потребители сломаются при каждом переезде.
  kind: choice
  options:
    - Бюджет обрезки (и строгость вычистки шума); писатель JSONL, загрузчик и путь возврата записи в агент остаются прежними
    - 'Схему записи: под большой вывод нужны дополнительные поля вместо stdout и stderr'
    - 'Загрузчик: он должен читать не последнюю запись, а весь журнал целиком'
    - 'Способ захвата результата: команду с большим выводом запускают в обход раннера'
  correct: 0
  id: 031-project-budget-3
