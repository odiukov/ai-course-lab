- concept: открытие журнала в режиме дописывания накапливает записи между отдельными прогонами программы
  question: Раннер открывает журнал обратной связи в режиме дописывания и за один прогон сохраняет 7 записей. Программу запускали 4 раза подряд, файл между запусками не трогали. Сколько строк в журнале?
  explanation: 'Режим дописывания не обнуляет файл при открытии: 7 × 4 = 28. Именно поэтому второй прогон начинает не с чистого листа, а продолжает тот же журнал — накопленная история попыток и есть материал для гейта проверки.'
  kind: numeric
  answer: 28
  tolerance: 0.5
  id: 017-jsonl-history-1
  fingerprint: 3ddc7f01
- concept: самодостаточность строки JSONL позволяет дописывать в конец без переписывания файла
  question: Почему журнал в формате JSONL можно пополнять простым дописыванием в конец, а журнал в виде одного JSON-массива — нет?
  explanation: Дописывание в конец возможно тогда, когда конец файла не занят синтаксисом, обрамляющим всю коллекцию. У массива каждая вставка означает правку хвоста и, по сути, переписывание файла; у JSONL новая строка ничего не ломает.
  kind: choice
  options:
    - Каждая строка JSONL — законченный самостоятельный объект, а у массива есть закрывающая скобка, которую пришлось бы убирать и ставить заново
    - JSONL хранит данные в двоичном виде и потому дописывается быстрее
    - В массиве JSON нельзя хранить объекты, только числа и строки
    - JSONL не требует экранирования, а массив требует
  correct: 0
  id: 017-jsonl-history-2
  fingerprint: e5f53960
- concept: 'построчный разбор журнала локализует повреждение: испорченная строка не обесценивает остальные'
  question: Загрузчик читает журнал обратной связи построчно. Процесс убили во время записи, и последняя строка файла оборвалась на середине объекта. Что происходит с остальными записями?
  explanation: Границей единицы данных служит перевод строки, поэтому сбой затрагивает ровно ту запись, на которой он случился. У единого JSON-документа оборванный хвост делает недоступным весь файл — вместе со всей историей предыдущих прогонов.
  kind: choice
  options:
    - 'Они читаются нормально: разбор идёт по одной строке, и повреждена только последняя'
    - Весь файл становится нечитаемым, потому что разбор идёт целиком
    - Все записи после первой строки теряют поля
    - Файл читается, но записи возвращаются в обратном порядке
  correct: 0
  id: 017-jsonl-history-3
  fingerprint: 037f5807
