- concept: 'единица измерения длительности задаёт разрешение сравнения: целые секунды схлопывают короткие команды в один класс'
  question: Почему длительность в записи запуска хранят в миллисекундах, а не в целых секундах?
  explanation: Разрешение измерения задаёт, какие различия вообще попадают в запись. При округлении до секунд быстрая проверка и проверка, разогревавшая кэш, сливаются в «1 с». Миллисекунды дают сравнимость и для коротких команд, и для минутных, не меняя формата поля.
  kind: choice
  options:
    - Целые секунды делают неразличимыми команды на 250 мс и 1400 мс, хотя это разные режимы работы
    - Миллисекунды занимают меньше места в JSONL-записи
    - Секунды нельзя сериализовать в JSON без потери точности
    - Миллисекунды нужны, чтобы вычислить код выхода при таймауте
