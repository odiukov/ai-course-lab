- concept: момент запуска и длительность вместе задают интервал занятости, из которого вычисляется пересечение прогонов
  question: Команда A запущена в 10:00:00.000 и её запись содержит длительность 8200 мс. Команда B запущена в 10:00:06.000. Сколько миллисекунд их выполнение пересекалось?
  explanation: A занимает интервал [0; 8200] мс от 10:00:00.000, B стартует на отметке 6000 мс. Пересечение = 8200 − 6000 = 2200 мс. Метка запуска и длительность вместе превращают запись в отрезок на оси времени, а не в точку, поэтому по журналу видно, что проверки шли внахлёст и могли мешать друг другу.
  kind: numeric
  answer: 2200
  tolerance: 1
