- concept: 'множество разрешающих значений одноэлементно: только код успеха открывает цикл, независимо от объёма выполненной работы'
  question: Тест убит по таймауту, захвачен код выхода 143, при этом часть кейсов успела пройти. Что возвращает функция допуска цикла?
  explanation: Гейт не оценивает, сколько работы сделано, — он читает вердикт процесса. Любой ненулевой код означает, что команда сообщила об ошибке, и цикл не может считать проверку пройденной.
  kind: choice
  options:
    - 'Отказ продолжать: разрешение даёт только код успеха'
    - 'Разрешение: часть работы выполнена, значит прогресс есть'
    - Разрешение, если поток диагностики пуст
    - Отказ только при коде 9, остальные ненулевые коды считаются мягкими
