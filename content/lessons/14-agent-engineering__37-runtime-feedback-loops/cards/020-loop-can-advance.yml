- concept: 'одинаковый отказ продолжать не означает одинаковой реакции: провал чинят, потерянный результат перезапускают'
  question: 'Две записи одинаково запрещают продолжать цикл: у одной код выхода 9, у другой кода нет вовсе. Чем различается следующее действие агента?'
  explanation: 'Вердикт гейта в обоих случаях один, но основания разные: ненулевой код — это захваченная информация о поломке, а отсутствие кода — нехватка самой информации, которую восполняет повторный запуск.'
  kind: choice
  options:
    - 'Ничем: обе ветки требуют одного и того же действия'
    - При коде 9 агент разбирает причину провала команды, а при отсутствующем коде перезапускает команду, чтобы вообще получить результат
    - При отсутствующем коде запись удаляют из журнала
    - При коде 9 запись переписывают кодом успеха после исправления
