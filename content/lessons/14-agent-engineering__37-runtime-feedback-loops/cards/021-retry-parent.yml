- concept: каждая попытка получает собственный неповторяемый command_id, потому что идентификатор именует отдельное выполнение, а не команду
  question: Агент семь раз подряд запускает одну и ту же команду сборки. Как раннер обратной связи назначает command_id этим запускам?
  explanation: command_id именует конкретное выполнение, а не текст команды. Одинаковый argv может дать разный исход, разную длительность и разное время старта, поэтому переиспользование идентификатора склеило бы разные факты в один и сделало бы ссылки между попытками неразрешимыми.
  kind: choice
  options:
    - Каждый запуск получает свой новый идентификатор, потому что каждая запись описывает отдельное выполнение со своим временем и исходом
    - Все семь запусков получают один идентификатор, потому что argv у них совпадает
    - Идентификатор выдаётся только тем запускам, которые завершились неуспешно
    - Идентификатор берётся из хеша команды, поэтому одинаковые команды делят его по определению
  correct: 0
  id: 021-retry-parent-1
  fingerprint: e593aad8
- concept: историю повторов восстанавливают обходом ссылок от последней попытки к корню цепочки
  question: Записи разных команд лежат в журнале вперемешку. Дополни обход, который собирает всю цепочку попыток, начиная с последней записи.
  explanation: 'Ссылка ведёт назад: значение parent_command_id — это command_id предыдущей попытки, по нему в индексе находится следующая запись цепочки. Обход заканчивается на записи, у которой родителя нет — это корень истории повторов.'
  kind: cloze
  template: |-
    node = by_id[last_id]
    chain = [node]
    while node["parent_command_id"] is not None:
        node = by_id[node["___"]]
        chain.append(node)
  answer: parent_command_id
  accept:
    - parent_command_id
    - record["parent_command_id"]
  id: 021-retry-parent-2
  fingerprint: ff6e58af
- concept: parent_command_id отвечает только на вопрос принадлежности запусков к одной истории повторов и не несёт исхода или причины
  question: 'Объясни своими словами: на какой вопрос отвечает поле parent_command_id и на какие вопросы оно принципиально не отвечает?'
  explanation: 'Смешивать структуру и содержание нельзя: ссылка задаёт топологию цепочки, а исход и диагностика лежат в своих полях. Именно поэтому ссылка остаётся корректной независимо от того, упала попытка или прошла.'
  kind: open
  reference: 'parent_command_id отвечает ровно на один вопрос: какая запись была непосредственно предыдущей попыткой, то есть какие отдельные выполнения принадлежат одной истории повторов. Он не говорит, чем закончился запуск (для этого exit_code), не объясняет причину падения (для этого stdout/stderr), не измеряет время (started_at, duration_ms) и не оценивает, оправдан ли был повтор. Это чисто структурная ссылка между записями.'
  id: 021-retry-parent-3
  fingerprint: 8e0fa45c
