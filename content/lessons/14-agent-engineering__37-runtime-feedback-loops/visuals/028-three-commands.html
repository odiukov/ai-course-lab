<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Трасса трёх команд</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f6f8fb;
      --panel: #ffffff;
      --panel-soft: #eef2f7;
      --ink: #182230;
      --muted: #5d6978;
      --line: #9aa7b7;
      --rail: #cbd4df;
      --success: #16784a;
      --success-soft: #e5f6ed;
      --error: #b33131;
      --error-soft: #fdeaea;
      --slow: #9a6200;
      --slow-soft: #fff2cf;
      --json: #26364a;
      --json-soft: #edf2f8;
      --accent: #4263a6;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #11161d;
        --panel: #19212b;
        --panel-soft: #222d39;
        --ink: #eef3f8;
        --muted: #b1bdca;
        --line: #718094;
        --rail: #435064;
        --success: #66d29c;
        --success-soft: #173c2d;
        --error: #ff8b8b;
        --error-soft: #472424;
        --slow: #f5c363;
        --slow-soft: #47391d;
        --json: #dce8f5;
        --json-soft: #233142;
        --accent: #9bb8ff;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .figure {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--rail);
      overflow: hidden;
    }

    h1 {
      margin: 0;
      padding: 12px 18px;
      border-bottom: 1px solid var(--rail);
      font-size: 20px;
      font-weight: 700;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 438px;
      background: var(--panel);
    }

    text {
      fill: var(--ink);
      font-size: 14px;
    }

    .stage {
      fill: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .lane-name {
      font-size: 16px;
      font-weight: 700;
    }

    .small {
      fill: var(--muted);
      font-size: 12px;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
    }

    .strong {
      font-weight: 700;
    }

    .rail {
      stroke: var(--rail);
      stroke-width: 2px;
      fill: none;
    }

    .arrow {
      stroke: var(--line);
      stroke-width: 2px;
      fill: none;
    }

    .arrow-head {
      fill: var(--line);
    }

    .box {
      fill: var(--panel-soft);
      stroke: var(--line);
      stroke-width: 1px;
    }

    .runner-box {
      fill: var(--panel);
      stroke: var(--accent);
      stroke-width: 2px;
    }

    .json-box {
      fill: var(--json-soft);
      stroke: var(--json);
      stroke-width: 1px;
    }

    .success-box {
      fill: var(--success-soft);
      stroke: var(--success);
      stroke-width: 2px;
    }

    .error-box {
      fill: var(--error-soft);
      stroke: var(--error);
      stroke-width: 2px;
    }

    .slow-box {
      fill: var(--slow-soft);
      stroke: var(--slow);
      stroke-width: 2px;
    }

    .success-text {
      fill: var(--success);
    }

    .error-text {
      fill: var(--error);
    }

    .slow-text {
      fill: var(--slow);
    }

    .ledger {
      fill: var(--panel-soft);
      stroke: var(--rail);
      stroke-width: 1px;
    }

    .ledger-line {
      stroke: var(--accent);
      stroke-width: 3px;
    }
  </style>
</head>
<body>
  <main class="figure">
    <h1>Трасса трёх команд</h1>
    <svg id="trace" viewBox="0 0 1200 438" width="1200" height="438"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-label="Три команды проходят один маршрут и завершаются отдельными строками JSONL"></svg>
  </main>

  <script>
    const diagram = {
      stages: [
        { x: 176, label: "ТОЧНЫЙ ВХОД" },
        { x: 365, label: "ЗАПУСК" },
        { x: 560, label: "НАБЛЮДЕНИЕ" },
        { x: 760, label: "ОЧИСТКА" },
        { x: 1018, label: "СТРОКА JSONL" }
      ],
      lanes: [
        {
          y: 112,
          name: "Успех",
          note: "agent_note: «успех»",
          argv: "argv: [команда, аргументы]",
          result: "exit_code: 0",
          detail: "stdout отдельно · stderr отдельно",
          json: "{\"exit_code\":0, \"duration_ms\":…}",
          boxClass: "success-box",
          textClass: "success-text"
        },
        {
          y: 222,
          name: "Ошибка",
          note: "agent_note: «ошибка»",
          argv: "argv: [команда, аргументы]",
          result: "exit_code: ≠ 0",
          detail: "stderr может объяснить падение",
          json: "{\"exit_code\":≠0, \"stderr\":\"…\"}",
          boxClass: "error-box",
          textClass: "error-text"
        },
        {
          y: 332,
          name: "Медленно",
          note: "agent_note: «медленно»",
          argv: "argv: [команда, аргументы]",
          result: "duration_ms: заметно больше",
          detail: "exit_code может быть 0",
          json: "{\"exit_code\":0, \"duration_ms\":↑}",
          boxClass: "slow-box",
          textClass: "slow-text"
        }
      ],
      geometry: {
        topRuleY: 52,
        stageY: 30,
        railStartX: 68,
        railEndX: 1170,
        laneLabelX: 26,
        inputX: 82,
        inputW: 185,
        inputH: 72,
        runnerX: 308,
        runnerW: 112,
        runnerH: 52,
        resultX: 462,
        resultW: 205,
        resultH: 72,
        cleanX: 708,
        cleanW: 112,
        cleanH: 52,
        jsonX: 864,
        jsonW: 306,
        jsonH: 72,
        arrowGap: 12,
        arrowHeadLength: 10,
        arrowHeadHalf: 6,
        textTop: 21,
        textBottom: 46,
        resultTop: 29,
        resultBottom: 53,
        ledgerX: 26,
        ledgerY: 390,
        ledgerW: 1144,
        ledgerH: 34,
        ledgerMarkX: 44,
        ledgerTextX: 62,
        ledgerTextY: 412,
        ledgerMarkTop: 398,
        ledgerMarkBottom: 416,
        fallbackX: 36,
        fallbackY: 90
      }
    };

    const origin = { x: 0, y: 0 };
    const scale = { x: 1, y: 1 };

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const labelPadding = 10;
    const lineWidth = 2;
    const fontSize = 14;

    try {
      const svg = document.getElementById("trace");
      const ns = "http://www.w3.org/2000/svg";
      const g = diagram.geometry;

      function node(tag, attrs, className) {
        const el = document.createElementNS(ns, tag);
        for (const [key, value] of Object.entries(attrs)) {
          el.setAttribute(key, value);
        }
        if (className) el.setAttribute("class", className);
        svg.appendChild(el);
        return el;
      }

      function text(x, y, value, className, anchor) {
        const el = node("text", {
          x: sx(x),
          y: sy(y),
          "text-anchor": anchor || "start",
          "dominant-baseline": "middle"
        }, className);
        el.textContent = value;
        return el;
      }

      function rect(x, y, w, h, className) {
        return node("rect", {
          x: sx(x),
          y: sy(y),
          width: sx(x + w) - sx(x),
          height: sy(y + h) - sy(y)
        }, className);
      }

      function line(xa, ya, xb, yb, className) {
        return node("line", {
          x1: sx(xa),
          y1: sy(ya),
          x2: sx(xb),
          y2: sy(yb)
        }, className);
      }

      function arrow(xa, ya, xb, yb) {
        line(xa, ya, xb, yb, "arrow");
        node("polygon", {
          points: [
            sx(xb) + "," + sy(yb),
            sx(xb - g.arrowHeadLength) + "," + sy(yb - g.arrowHeadHalf),
            sx(xb - g.arrowHeadLength) + "," + sy(yb + g.arrowHeadHalf)
          ].join(" ")
        }, "arrow-head");
      }

      line(g.railStartX, g.topRuleY, g.railEndX, g.topRuleY, "rail");

      for (const stage of diagram.stages) {
        text(stage.x, g.stageY, stage.label, "stage", "middle");
      }

      for (const lane of diagram.lanes) {
        const inputY = lane.y - g.inputH / lineWidth;
        const runnerY = lane.y - g.runnerH / lineWidth;
        const resultY = lane.y - g.resultH / lineWidth;
        const cleanY = lane.y - g.cleanH / lineWidth;
        const jsonY = lane.y - g.jsonH / lineWidth;

        line(g.railStartX, lane.y, g.railEndX, lane.y, "rail");
        text(g.laneLabelX, lane.y, lane.name, "lane-name " + lane.textClass, "start");

        rect(g.inputX, inputY, g.inputW, g.inputH, "box");
        text(g.inputX + labelPadding, inputY + g.textTop, lane.argv, "mono strong", "start");
        text(g.inputX + labelPadding, inputY + g.textBottom, lane.note, "small", "start");

        arrow(
          g.inputX + g.inputW + g.arrowGap,
          lane.y,
          g.runnerX - g.arrowGap,
          lane.y
        );

        rect(g.runnerX, runnerY, g.runnerW, g.runnerH, "runner-box");
        text(g.runnerX + g.runnerW / lineWidth, lane.y, "раннер запускает", "strong", "middle");

        arrow(
          g.runnerX + g.runnerW + g.arrowGap,
          lane.y,
          g.resultX - g.arrowGap,
          lane.y
        );

        rect(g.resultX, resultY, g.resultW, g.resultH, lane.boxClass);
        text(
          g.resultX + g.resultW / lineWidth,
          resultY + g.resultTop,
          lane.result,
          "strong " + lane.textClass,
          "middle"
        );
        text(
          g.resultX + g.resultW / lineWidth,
          resultY + g.resultBottom,
          lane.detail,
          "small",
          "middle"
        );

        arrow(
          g.resultX + g.resultW + g.arrowGap,
          lane.y,
          g.cleanX - g.arrowGap,
          lane.y
        );

        rect(g.cleanX, cleanY, g.cleanW, g.cleanH, "box");
        text(g.cleanX + g.cleanW / lineWidth, lane.y - labelPadding, "очистить", "strong", "middle");
        text(g.cleanX + g.cleanW / lineWidth, lane.y + labelPadding, "и обрезать", "small", "middle");

        arrow(
          g.cleanX + g.cleanW + g.arrowGap,
          lane.y,
          g.jsonX - g.arrowGap,
          lane.y
        );

        rect(g.jsonX, jsonY, g.jsonW, g.jsonH, "json-box");
        text(g.jsonX + labelPadding, jsonY + g.textTop, "append-only · отдельная строка", "small strong", "start");
        text(g.jsonX + labelPadding, jsonY + g.textBottom, lane.json, "mono", "start");
      }

      rect(g.ledgerX, g.ledgerY, g.ledgerW, g.ledgerH, "ledger");
      line(g.ledgerMarkX, g.ledgerMarkTop, g.ledgerMarkX, g.ledgerMarkBottom, "ledger-line");
      text(
        g.ledgerTextX,
        g.ledgerTextY,
        "Файл хранит всю историю: первый запуск → 3 строки · второй → 6 · третий → 9   |   демо показывает последний срез",
        "small strong",
        "start"
      );

      svg.style.setProperty("--diagram-line-width", lineWidth + "px");
      svg.style.setProperty("--diagram-font-size", fontSize + "px");
    } catch (error) {
      const svg = document.getElementById("trace");
      while (svg.firstChild) svg.removeChild(svg.firstChild);
      const fallback = document.createElementNS("http://www.w3.org/2000/svg", "text");
      fallback.setAttribute("x", sx(diagram.geometry.fallbackX));
      fallback.setAttribute("y", sy(diagram.geometry.fallbackY));
      fallback.setAttribute("font-size", fontSize);
      fallback.setAttribute("fill", "currentColor");
      fallback.textContent = "Схема должна была показать три команды: успешную, упавшую и медленную, каждая — в отдельной строке JSONL.";
      svg.appendChild(fallback);
    }
  </script>
</body>
</html>
