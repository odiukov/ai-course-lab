- concept: фильтр цвета должен исключать ахроматические пиксели с помощью насыщенности, если их hue заполнен условным значением
  question: Преобразователь HSV записывает значение по умолчанию в hue ахроматических пикселей. Объясни, почему фильтр только по сектору красного может захватить серые пиксели и как это предотвратить.
  explanation: При R = G = B насыщенность равна 0, а hue не имеет содержательного значения. Если неопределённый hue представлен нулём, проверка только hue спутывает серый пиксель с насыщенным красным. Условие на saturation отделяет настоящий цвет от ахроматических пикселей.
  kind: open
  reference: У серых пикселей оттенок не определён, но массиву всё равно нужно числовое значение, поэтому реализация может записать в hue условный ноль. Этот же hue соответствует красному сектору у цветных пикселей, и фильтр только по hue не различит эти случаи. Нужно дополнительно потребовать насыщенность выше выбранного порога.
