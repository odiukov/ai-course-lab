- concept: RGB-изображение хранит несколько цветовых компонент на пиксель, а изображение в оттенках серого — одну яркость
  question: Чем представление RGB-изображения в памяти отличается от представления изображения в оттенках серого?
  explanation: Цвет RGB определяется тремя компонентами — красной, зелёной и синей. Для оттенка серого достаточно одного значения, описывающего яркость пикселя.
  kind: choice
  options:
    - RGB хранит координаты пикселя, а изображение в оттенках серого — название его цвета
    - RGB хранит отдельные интенсивности красного, зелёного и синего каналов, а изображение в оттенках серого — одну яркость
    - RGB хранит одну яркость, а изображение в оттенках серого — отдельные цветовые каналы
    - Представления одинаковы; различается только способ показа на экране
