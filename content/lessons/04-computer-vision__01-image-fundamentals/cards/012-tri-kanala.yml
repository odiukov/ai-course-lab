- concept: RGB-триплет формируется из измерений через цветовую мозаику и последующую демозаику
  question: Расположите этапы получения RGB-пикселей камерой в правильном порядке.
  explanation: Отдельный фотодетектор выдаёт только один скалярный отклик. Цветовой фильтр ограничивает спектральный диапазон этого измерения, а демозаика восстанавливает недостающие компоненты и собирает полный RGB-триплет.
  kind: order
  items:
    - Свет проходит через мозаику цветных фильтров
    - Каждый фотодетектор измеряет интенсивность пропущенного его фильтром света
    - Алгоритм демозаики оценивает недостающие цветовые компоненты по соседним измерениям
    - Для каждой позиции формируется RGB-триплет
  id: 012-tri-kanala-1
  fingerprint: 1dc548e1
- concept: число каналов определяется тем, какие диапазоны или физические величины измеряет система
  question: Спутниковая камера сохраняет видимые цвета и отдельный инфракрасный канал. Почему инфракрасные данные представлены дополнительным каналом?
  explanation: Канал соответствует отдельному виду измерения. RGB описывает отклики в красном, зелёном и синем диапазонах, а специальный сенсор или фильтр может добавить измерение инфракрасного света, глубины или другой величины.
  kind: choice
  options:
    - Сенсор отдельно измеряет отклик в инфракрасном диапазоне
    - Любому изображению требуется запасной канал для коррекции ошибок
    - Инфракрасный канал хранит координаты пикселей
    - Демозаика автоматически создаёт инфракрасный сигнал из видимых цветов
