- concept: повторные геометрические преобразования накапливают ошибки пересемплирования
  question: Почему несколько последовательных поворотов растрового изображения обычно искажают его сильнее, чем одно эквивалентное преобразование?
  explanation: Новая сетка после поворота обычно не совпадает со старой. Значения для неё вычисляются по соседним замерам, а повторное преобразование интерполирует уже приближённые данные и усиливает накопленные искажения.
  kind: choice
  options:
    - Каждый поворот требует заново оценивать значения в точках, где исходных замеров не было, поэтому ошибки интерполяции накапливаются
    - При каждом повороте сенсор камеры повторно измеряет сцену с меньшей выдержкой
    - Поворот обязательно уменьшает разрядность всех значений яркости
    - После первого поворота пиксели теряют свои цветовые каналы
  correct: 0
