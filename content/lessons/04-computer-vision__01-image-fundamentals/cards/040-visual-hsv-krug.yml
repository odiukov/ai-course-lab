- concept: числовой масштаб hue зависит от соглашения конкретной реализации HSV
  question: Почему hue, вычисленный ручной функцией в градусах, нельзя напрямую сравнивать с hue из обычного целочисленного HSV OpenCV?
  explanation: Ручная функция возвращает hue в диапазоне 0–360°, а обычное восьмибитное представление OpenCV использует 0–179. Перед сравнением или пороговой фильтрацией масштабы нужно согласовать.
  kind: choice
  options:
    - OpenCV кодирует тот же угол в сжатом числовом масштабе, поэтому значения сначала нужно привести к одному соглашению
    - OpenCV измеряет hue в радианах
    - OpenCV переставляет местами hue и saturation
    - Hue в OpenCV зависит от размера изображения
  correct: 0
  id: 040-visual-hsv-krug-1
  fingerprint: 0f00fbc5
- concept: компонента value равна максимальному нормализованному RGB-каналу
  question: Пиксель в байтовом RGB-представлении имеет каналы (45, 135, 225). Какое значение V получится после перевода в HSV?
  explanation: 'После деления RGB-каналов на 255 компоненту V берут как их максимум: 225 / 255 ≈ 0.882.'
  kind: numeric
  answer: 0.882
  tolerance: 0.005
  id: 040-visual-hsv-krug-2
  fingerprint: 74bd7dea
- concept: hue не имеет содержательного значения для ахроматического пикселя
  question: Объясните, почему условие только по hue может ошибочно отнести серый пиксель к красным.
  explanation: При delta = 0 направление оттенка определить нельзя. В коде hue остаётся равным 0°, но это служебное соглашение, а не признак красного цвета; saturation при этом равна нулю.
  kind: open
  reference: У ахроматического пикселя максимальный и минимальный RGB-каналы равны, поэтому цветовой оттенок не определён. Реализация всё равно может записать условное значение hue, попадающее в красный сектор. Такой пиксель следует отсечь условием на saturation.
  id: 040-visual-hsv-krug-3
  fingerprint: 2e88c06d
