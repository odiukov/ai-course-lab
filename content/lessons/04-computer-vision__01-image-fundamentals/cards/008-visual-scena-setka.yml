- concept: цифровое значение возникает после накопления света детектором и квантования аналогового сигнала
  question: Расположите этапы получения цифрового значения сенсором камеры в правильном порядке.
  explanation: Сначала детектор собирает свет за время экспозиции, затем формирует аналоговый электрический сигнал, а сенсор квантирует этот сигнал. Так каждый детектор возвращает одно целое число.
  kind: order
  items:
    - Детектор накапливает попавшие на него фотоны
    - Накопленный свет преобразуется в пропорциональное ему напряжение
    - Напряжение дискретизируется в целое число
  id: 008-visual-scena-setka-1
  fingerprint: 653d1c87
- concept: пространственная дискретизация необратимо теряет детали сцены между измеренными позициями
  question: Можно ли после съёмки восстановить точные детали непрерывной сцены между позициями детекторов, просто увеличив цифровое изображение? Объясните своими словами.
  explanation: Сетка из 5×5 детекторов сохраняет только 25 замеров. Масштабирование создаст дополнительные значения на основе этих замеров, но не вернёт информацию, которая не была зафиксирована при съёмке.
  kind: open
  reference: Нет. Цифровое изображение содержит только конечный набор измерений в позициях сенсорной сетки. Увеличение может интерполировать значения между ними, но не определить, какие детали действительно находились там в исходной сцене.
  id: 008-visual-scena-setka-2
  fingerprint: a1dcb31f
