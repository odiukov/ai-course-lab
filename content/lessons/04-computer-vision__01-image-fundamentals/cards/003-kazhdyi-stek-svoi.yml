- concept: при передаче изображения из channels-last API в channels-first API нужно переставить оси
  question: Заполни символическую схему преобразования раскладки изображения перед передачей оператору, который ожидает каналы первыми.
  explanation: В HWC канал расположен после пространственных осей, а в CHW — перед ними. Нужно именно переставить оси, не меняя значения пикселей внутри каналов.
  kind: cloze
