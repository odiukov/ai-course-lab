- concept: смена целого типа данных на вещественный не выполняет масштабирование и стандартизацию
  question: Почему простого преобразования массива изображения в вещественный тип может быть недостаточно перед подачей в предобученную модель?
  explanation: После простого приведения типа бывшие байтовые значения остаются такими же по величине. Модель получает распределение входов, отличное от обучающего, пока не выполнены масштабирование и предусмотренная моделью нормализация.
  kind: open
  reference: Преобразование типа меняет способ хранения чисел, но сохраняет их величины. Если модель обучалась на масштабированных и стандартизованных значениях, изображение также нужно привести к ожидаемому диапазону и применить требуемую поканальную стандартизацию.
