- concept: координата нового пикселя переводится в координаты исходной сетки пропорционально отношению размеров
  question: Изображение по ширине уменьшают с 630 до 252 пикселей. Используется отображение x_src = x_dst · W_src / W_dst. Какой исходной координате соответствует новый столбец x_dst = 19?
  explanation: 'Подставляем размеры: 19 · 630 / 252 = 47.5. Такой координаты среди целочисленных позиций исходной сетки нет, поэтому значение нового пикселя приходится интерполировать между соседними отсчётами.'
  kind: numeric
  answer: 47.5
  tolerance: 0.001
  id: 048-chto-takoe-interpolyaciya-1
  fingerprint: 6c1d9e5c
- concept: интерполяция восстанавливает значение в позиции, где исходного пиксельного отсчёта нет
  question: При изменении размера новый пиксель отобразился в исходную координату x_src = 61.4. Что должен сделать алгоритм интерполяции?
  explanation: Исходная сетка содержит отсчёты только в целочисленных позициях. Интерполяция оценивает отсутствующее значение по соседям, причём разные методы могут дать разные результаты.
  kind: choice
  options:
    - Оценить значение по соседним исходным отсчётам согласно выбранному методу
    - Найти в исходном массиве пиксель с дробным индексом
    - Изменить только тип данных массива, не используя соседние значения
    - Скопировать один и тот же исходный пиксель независимо от метода интерполяции
