- concept: стандартизованное значение показывает отклонение пикселя от среднего в единицах стандартного отклонения
  question: Нормализованное значение канала равно 0.74, среднее по каналу — 0.38, а стандартное отклонение — 0.24. Чему равно стандартизованное значение?
  explanation: 'Стандартизация вычисляется как (x − mean) / std. Получаем (0.74 − 0.38) / 0.24 = 1.5: значение находится на полтора стандартных отклонения выше среднего.'
  kind: numeric
  answer: 1.5
  tolerance: 0.01
