- concept: модель super-resolution, работающая только с Y, восстанавливает яркостные детали, а цветность обрабатывается отдельно
  question: Как организовать обработку изображения моделью super-resolution, если модель принимает только канал Y из YCbCr?
  explanation: Такая модель улучшает пространственные детали яркости. Cb и Cr не проходят через неё, поэтому их приводят к нужному размеру отдельно и затем снова объединяют с Y.
  kind: open
  reference: Передать в модель канал Y, отдельно масштабировать или сохранить Cb и Cr, затем объединить обработанный Y с каналами цветности и преобразовать результат в нужное цветовое пространство.
  id: 044-ycbcr-2
  fingerprint: fe21f9e8
