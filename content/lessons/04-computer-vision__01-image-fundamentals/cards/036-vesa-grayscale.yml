- concept: сумма весов яркости, равная единице, сохраняет значение ахроматического пикселя
  question: 'Для нейтрального серого пикселя значения каналов одинаковы: R = G = B = x. Что получится после преобразования во взвешенную яркость, если веса в сумме дают единицу?'
  explanation: Подстановка R = G = B = x даёт Y = (0.299 + 0.587 + 0.114)x = x. Поэтому любой нейтральный серый пиксель сохраняет свою яркость, включая крайние значения диапазона.
  kind: choice
  options:
    - Y = x
    - Y всегда меньше x
    - Y зависит от того, какой канал записан первым
    - Y равно утроенному x
