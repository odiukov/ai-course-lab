- concept: при инференсе предобученной модели используют статистики её обучающей выборки, а не статистики входящего батча
  question: Предобученную модель разворачивают на фотографиях, которые в среднем темнее её обучающих данных. Как поступить с нормализацией, если веса модели не переобучаются?
  explanation: 'Веса адаптировались к входам, стандартизованным статистиками обучающей выборки. Поэтому на инференсе сохраняют тот же контракт: для ImageNet-модели это mean=[0.485, 0.456, 0.406] и std=[0.229, 0.224, 0.225]. Подмена их статистиками новых изображений меняет представление входа.'
  kind: choice
  options:
    - Вычислять mean и std заново для каждого входящего батча
    - Сохранить mean и std, использованные при обучении модели
    - Вычитать среднее каждого отдельного изображения и не делить на std
  correct: 1
  id: 027-statistiki-imagenet-1
  fingerprint: 9c5e9fcc
- concept: статистики каналов обучающей выборки оцениваются по всем её пикселям с учётом числа пикселей в каждом изображении
  question: В обучающей выборке изображения имеют разные размеры. Объясни, как корректно вычислить mean и std одного цветового канала для последующей стандартизации.
  explanation: ImageNet mean и std — не среднее статистик отдельных фотографий с равным весом, а статистики пикселей каждого канала по всей обучающей выборке после приведения значений к [0, 1]. Равное взвешивание изображений разных размеров оценивало бы другую величину.
  kind: open
  reference: 'Сначала значения пикселей приводят к тому диапазону, в котором будет выполняться стандартизация. Затем все значения нужного канала рассматривают как одну совокупность: mean вычисляют по всем пикселям, а std — по их отклонениям от этого общего среднего. Поэтому изображение с большим числом пикселей вносит пропорционально больший вклад.'
  id: 027-statistiki-imagenet-2
  fingerprint: 7881567e
