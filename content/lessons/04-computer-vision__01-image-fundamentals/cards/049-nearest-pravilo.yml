- concept: округление результата сглаживающей интерполяции не делает её корректной для категориальной маски
  question: В маске соседние пиксели имеют ID классов 11 и 29. Интерполяция дала значение 20, причём класс с ID 20 существует, но обозначает другой объект. Какой вывод верен?
  explanation: ID класса — это категориальная метка, а не измеряемая величина. Усреднение может случайно породить существующий, но семантически неверный класс, поэтому последующее округление проблему не исправляет.
  kind: choice
  options:
    - Результат корректен, потому что полученный ID присутствует в словаре классов
    - Результат станет корректным после округления до целого числа
    - 'Результат некорректен: числовая близость ID не выражает смысловую близость классов'
    - Результат корректен, если все ID классов положительны
  correct: 2
  id: 049-nearest-pravilo-1
  fingerprint: d3713ce7
- concept: nearest neighbour копирует значение ближайшей точки исходной сетки без смешивания соседей
  question: Заполните выражение для переноса категориальной маски методом ближайшего соседа.
  explanation: Координаты в исходной сетке приводятся к ближайшим индексам, после чего соответствующий ID копируется без усреднения. Поэтому множество возможных меток не расширяется.
  kind: cloze
  template: out[row, col] = ___
  answer: mask[round(src_row), round(src_col)]
  accept:
    - mask[round(src_row), round(src_col)]
    - mask[nearest(src_row), nearest(src_col)]
  id: 049-nearest-pravilo-2
  fingerprint: b81ba4af
