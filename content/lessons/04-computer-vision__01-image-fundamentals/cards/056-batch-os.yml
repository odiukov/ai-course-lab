- concept: одиночное изображение превращается в батч добавлением ведущей singleton-оси без изменения его значений
  question: Есть тензор одного изображения с осями (C, H, W). Как подготовить его для слоя, ожидающего вход в формате (N, C, H, W), не изменяя значения пикселей?
  explanation: 'Ведущая ось размера один обозначает батч из одного изображения. Добавление такой оси меняет только форму тензора: значения пикселей и их расположение внутри изображения сохраняются.'
  kind: choice
  options:
    - Поменять местами оси C и H
    - Объединить C, H и W в одну ось
    - Добавить новую ось размера один перед осью C
    - Продублировать данные вдоль оси каналов
  correct: 2
