- concept: насыщенность HSV вычисляется как отношение размаха RGB-каналов к их максимуму
  question: Нормализованный RGB-пиксель имеет значения (0.84, 0.51, 0.21). Чему равна его насыщенность S?
  explanation: cmax = 0.84, cmin = 0.21, поэтому delta = 0.63. Тогда S = delta / cmax = 0.63 / 0.84 = 0.75.
  kind: numeric
  answer: 0.75
  tolerance: 0.001
  id: 041-hsv-formula-1
  fingerprint: 8c6ebff4
- concept: формула оттенка выбирается по каналу с максимальным значением
  question: У нормализованного RGB-пикселя с ненулевой delta синий канал строго максимален. Какая величина определяет смещение оттенка внутри синего сектора?
  explanation: Для синего максимального канала используется ветвь h = (R − G) / delta с добавлением смещения синего сектора. Деление на delta задаёт относительное положение оттенка внутри сектора.
  kind: choice
  options:
    - Разность красного и зелёного каналов, делённая на delta
    - Разность зелёного и красного каналов, делённая на delta
    - Только разность cmax и cmin без учёта остальных каналов
    - Среднее арифметическое красного и зелёного каналов
  correct: 0
  id: 041-hsv-formula-2
  fingerprint: d38ca23b
