- concept: алиасинг превращает неразрешимые высокие пространственные частоты в ложные низкочастотные структуры
  question: На фотографии удалённого фасада частые полосы превратились в широкие волны, которых на самом фасаде нет. Какова наиболее вероятная причина?
  explanation: При недостаточной плотности пространственных замеров разные частые узоры могут давать одинаковые отсчёты. В результате вместо настоящей мелкой детали появляется правдоподобная, но ложная крупная структура — aliasing.
  kind: choice
  options:
    - Сетка замеров слишком редкая, поэтому высокая пространственная частота отобразилась как ложная более низкая
    - Сигнал интенсивности был разбит на слишком малое число уровней, поэтому возникли ступени яркости
    - При декодировании изображения были переставлены цветовые каналы
  correct: 0
  id: 009-spatial-sampling-1
  fingerprint: dfc40812
- concept: антиалиасинговый фильтр должен подавлять неразрешимые детали до перехода на более редкую сетку
  question: Расположите этапы уменьшения изображения с защитой от aliasing в правильном порядке.
  explanation: Сначала учитывают предел новой сетки, затем низкочастотным фильтром удаляют слишком мелкие детали и только после этого прореживают отсчёты. Фильтрация после уменьшения уже не исправит ложные структуры, созданные aliasing.
  kind: order
  items:
    - Определить полосу пространственных частот, которую способна представить целевая сетка
    - Подавить фильтром детали выше предела целевой сетки
    - Вычислить отсчёты в позициях более редкой целевой сетки
  id: 009-spatial-sampling-2
  fingerprint: 8de8ddbe
