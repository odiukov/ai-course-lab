- concept: при проверке стандартизации статистику каждого канала считают только по пространственным осям
  question: Тензор изображения хранится в формате CHW. Заполни аргумент axis так, чтобы получить отдельное среднее для каждого канала.
  explanation: Усреднять нужно по высоте и ширине, сохраняя ось каналов. Тогда результат содержит отдельное среднее для каждого канала, которое можно сопоставить с ожидаемым порядком величины после стандартизации.
  kind: cloze
  template: |-
    C_AXIS, H_AXIS, W_AXIS = range(x.ndim)
    channel_mean = x.mean(axis=___)
  answer: (H_AXIS, W_AXIS)
  accept:
    - (H_AXIS,W_AXIS)
  id: 033-sanity-checks-1
  fingerprint: ef040bad
- concept: успешный roundtrip подтверждает взаимную обратимость функций, но не соответствие предобработки входному контракту модели
  question: Прямая функция умножает значения каждого канала на неверно выбранные коэффициенты, а обратная делит на те же коэффициенты. Изображение после цикла туда и обратно восстанавливается почти идеально. Почему этого недостаточно, чтобы признать предобработку корректной?
  explanation: Максимальная разница в 0 или 1 пиксель подтверждает корректность обратной арифметики с учётом округления, но не правильность самого преобразования для модели. Поэтому roundtrip дополняют проверкой формы, порядка каналов, параметров предобработки и поканальных статистик.
  kind: open
  reference: 'Roundtrip показывает лишь то, что обратная функция отменяет прямую: две согласованные ошибки тоже могут взаимно уничтожиться. Нужно отдельно проверить контракт модели и статистики стандартизованного тензора по каналам.'
  id: 033-sanity-checks-2
  fingerprint: 3ab03b77
