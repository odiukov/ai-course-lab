- concept: аргументы transpose называют старые оси в порядке осей нового массива
  question: Старые оси массива обозначены как α, β и γ. Как правильно прочитать символическую запись transpose(γ, α, β)?
  explanation: 'Аргументы transpose перечисляют источники новых осей: каждый аргумент указывает, какую старую ось взять следующей. Поэтому новый порядок осей здесь — γ, α, β.'
  kind: choice
  options:
    - Старая ось α перемещается на место γ, а остальные оси не меняются
    - Каждая ось циклически сдвигается вправо
    - Запись задаёт размеры новых осей, а не их источники
    - Новая ось γ берётся из старой α, новая α — из старой β, новая β — из старой γ
    - Первая новая ось берётся из старой γ, следующая — из старой α, последняя — из старой β
  correct: 4
  id: 021-transpose-osi-1
  fingerprint: 4ead4e72
- concept: обратная перестановка строится по текущим позициям осей, а не копированием прямой перестановки
  question: Исходный порядок осей был «время, пространство, признаки», а после перестановки стал «признаки, время, пространство». Объясни, как определить обратную перестановку.
  explanation: 'После первой операции номера позиций относятся уже к новому массиву. Поэтому обратную перестановку вычисляют заново: по очереди находят, где сейчас находятся время, пространство и признаки. Повторение исходной перестановки возвращает массив назад только в частных случаях.'
  kind: open
  reference: Нужно рассматривать текущий порядок как исходный для новой операции. Затем для каждой оси желаемого порядка «время, пространство, признаки» найти её позицию в текущем порядке «признаки, время, пространство» и перечислить найденные позиции в этом порядке.
  id: 021-transpose-osi-2
  fingerprint: 95ae43eb
