- concept: padding сохраняет пропорции и всё поле зрения ценой появления пустых областей
  question: Для OCR важно не обрезать символы, расположенные у границ документа. Как лучше привести прямоугольный снимок к квадратному входу модели?
  explanation: Resize с padding сохраняет пропорции и всё содержимое кадра, поэтому крайние символы не исчезнут. Компромисс — часть входного тензора займут добавленные полосы.
  kind: choice
  options:
    - Растянуть снимок независимо по каждой оси
    - Масштабировать с сохранением пропорций и дополнить пустые области полосами
    - Масштабировать по короткой стороне и обрезать края по центру
  correct: 1
  id: 047-tri-strategii-resize-1
  fingerprint: c521eebf
- concept: прямое масштабирование в целевой размер искажает геометрию при изменении соотношения сторон
  question: Почему прямое масштабирование прямоугольного изображения в квадратный вход может быть неприемлемо для задачи, чувствительной к форме объектов?
  explanation: Прямой resize заполняет весь вход и сохраняет всё поле зрения, но при несовпадающих соотношениях сторон применяет неодинаковое масштабирование по осям. Это меняет геометрию объектов.
  kind: open
  reference: 'Размеры по горизонтали и вертикали изменяются с разными коэффициентами, поэтому пропорции объектов искажаются: окружности могут стать овалами, а углы и относительные длины — измениться.'
  id: 047-tri-strategii-resize-2
  fingerprint: e8e2a006
