- concept: насыщенность показывает выраженность цвета относительно ахроматического серого
  question: В HSV два пикселя имеют одинаковые Hue и Value, но один выглядит ярко окрашенным, а другой — блёклым и почти серым. Какая компонента различается?
  explanation: 'Saturation описывает чистоту цвета: высокая насыщенность соответствует выраженному цвету, а низкая приближает пиксель к серому. Hue определяет сам оттенок, а Value — светлоту.'
  kind: choice
  options:
    - Hue
    - Saturation
    - Value
    - 'Ни одна: такие пиксели обязаны выглядеть одинаково'
