- concept: перестановка осей меняет порядок доступа к данным, но сохраняет сами значения и соответствие каналов пространственным позициям
  question: Тензор RGB-изображения корректно преобразовали из HWC в CHW. Объясни, что при этом изменилось, а что осталось прежним.
  explanation: Такое преобразование лишь переставляет оси тензора. Форма меняется с вида (H, W, C) на (C, H, W), но изображение содержит те же измерения интенсивности.
  kind: open
  reference: 'Изменился порядок осей и способ обхода данных: ось каналов переместилась с последнего места на первое. Значения интенсивности не пересчитывались, не добавлялись и не удалялись; каждый канал по-прежнему относится к той же пространственной позиции.'
