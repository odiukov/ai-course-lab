- concept: булева маска ограничивает деление пикселями с ненулевым знаменателем
  question: Объясните, зачем при вычислении hue сначала выделять маской пиксели с ненулевым разбросом RGB-каналов и только затем выполнять деление.
  explanation: Формулы hue делят разность каналов на delta. При delta = 0 такое деление не определено, поэтому mask = delta > 0 одновременно защищает вычисление и отделяет цветные пиксели от ахроматических.
  kind: open
  reference: У ахроматических пикселей максимум и минимум каналов совпадают, поэтому разброс равен нулю. Маска исключает деление на ноль; hue для таких пикселей можно оставить условным значением, поскольку оттенок у них не определён.
