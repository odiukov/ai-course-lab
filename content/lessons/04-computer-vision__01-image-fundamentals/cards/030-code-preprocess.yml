- concept: цикл preprocess/deprocess приближённо восстанавливает пиксели, а небольшая погрешность возникает при повторном квантовании
  question: Почему результат deprocess_imagenet(preprocess_imagenet(image)) иногда немного отличается от исходного изображения?
  explanation: Умножение и деление в вещественном формате могут дать значение чуть выше или ниже исходного целого уровня. При преобразовании обратно в целочисленные пиксели эта малая ошибка проявляется как минимальное расхождение.
  kind: choice
  options:
    - Вещественные вычисления имеют конечную точность, а преобразование обратно в дискретные уровни интенсивности выполняет повторное квантование
    - Перестановка осей автоматически меняет порядок RGB на BGR
    - Вычитание среднего необратимо удаляет цветовую информацию
    - Стандартизация заново вычисляет статистики отдельно для каждого изображения
