- concept: YCbCr позволяет сжимать цветность сильнее яркости с учётом особенностей зрения
  question: Объясни своими словами, почему JPEG и видеокодеки могут хранить каналы цветности Cb и Cr с меньшей детализацией, чем канал Y.
  explanation: 'Разделение яркости и цвета позволяет распределить качество неравномерно: сохранить больше деталей в Y и сильнее сжать Cb и Cr. Это уменьшает объём данных при сравнительно небольшом ухудшении воспринимаемого изображения.'
  kind: open
  reference: YCbCr отделяет яркость Y от цветности Cb и Cr. Человеческое зрение лучше замечает мелкие изменения яркости, чем столь же мелкие изменения цвета, поэтому потеря части пространственной детализации в каналах цветности обычно менее заметна.
