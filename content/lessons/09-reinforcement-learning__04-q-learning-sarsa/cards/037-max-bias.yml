- concept: максимум несмещённых шумных оценок обычно имеет положительное смещение
  question: Оценка ценности каждого действия содержит случайный несмещённый шум. Почему максимум этих оценок всё равно может систематически завышать ценность лучшего действия?
  explanation: 'Положительные и отрицательные ошибки отдельных оценок могут взаимно компенсироваться, но после выбора максимума симметрия исчезает: в цель преимущественно попадают оценки с ошибкой вверх.'
  kind: open
  reference: Оператор max чаще выбирает действие, чья ошибка случайно оказалась положительной. Поэтому математическое ожидание максимума шумных оценок обычно превышает максимум их истинных ценностей, хотя каждая оценка по отдельности несмещённая.
  id: 037-max-bias-1
  fingerprint: 3df633b7
- concept: Double Q-learning разделяет выбор действия и оценку его ценности между независимыми таблицами
  question: Заполни пропуск в бутстрэп-части цели Double Q-learning, если действие выбирает таблица Q_A, а оценивает таблица Q_B.
  explanation: Таблица Q_A определяет победившее действие, но его значение берётся из Q_B. Шум, обеспечивший действию максимум в Q_A, не обязан иметь тот же знак в независимой оценке Q_B.
  kind: cloze
  template: a* = argmax_a Q_A(s′, a),   y = r + γ Q_B(s′, ___)
  answer: a*
  accept:
    - a^*
    - argmax_a Q_A(s′, a)
    - argmax_a Q_A(s', a)
  id: 037-max-bias-2
  fingerprint: 4fa839e1
- concept: завышение бутстрэп-оценки распространяется на более ранние состояния через последовательные TD-обновления
  question: Расположи события в порядке, в котором локальный шум превращается в распространяющуюся назад переоценку Q.
  explanation: Q-learning включает максимум оценок следующего состояния в TD-цель. Завышенная цель повышает текущую Q-оценку, которая затем сама может стать бутстрэп-компонентом для предшествующего состояния.
  kind: order
  items:
    - В оценках действий следующего состояния возникает случайный шум
    - Оператор max преимущественно выбирает оценку со случайной ошибкой вверх
    - Завышенная бутстрэп-оценка увеличивает TD-цель текущей пары состояния и действия
    - Последующие обновления переносят завышение к более ранним переходам
  id: 037-max-bias-3
  fingerprint: fefd2b8e
