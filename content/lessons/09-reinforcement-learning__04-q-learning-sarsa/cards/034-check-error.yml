- concept: максимальная ошибка отдельного запуска зависит от случайного покрытия редких пар и служит проверкой на вменяемость, а не точным измерением
  question: Объясни своими словами, почему максимальная ошибка Q-таблицы может заметно различаться между запусками с разными сидами при одинаковых гиперпараметрах.
  explanation: Даже одинаковая ε-жадная политика порождает разные траектории при разных сидах. В материале разброс от 0.59 до 1.02 объясняется тем, что разные дальние углы получили разное число обновлений.
  kind: open
  reference: Сид меняет последовательность исследовательских действий и посещаемость редких пар состояния и действия. Максимум определяется самой плохо обученной парой, поэтому случайный недостаток покрытия одной такой пары сильно влияет на результат отдельного запуска.
  id: 034-check-error-2
