- concept: при продолжающемся исследовании SARSA учитывает риск случайных действий и может предпочесть более безопасный маршрут
  question: В детерминированной задаче cliff-walking кратчайший маршрут проходит у обрыва, а более длинный — вдали от него. Агент постоянно использует ε-жадную политику. Какой маршрут, скорее всего, выучит SARSA?
  explanation: SARSA оценивает возврат текущей ε-жадной политики. Поэтому исследовательские действия и вызванные ими падения ухудшают оценки клеток у края, делая маршрут с запасом безопасности привлекательнее.
  kind: choice
  options:
    - 'Более безопасный: в оценку маршрута входят последствия исследовательских действий у обрыва'
    - 'Кратчайший: детерминированность среды полностью устраняет риск падения'
    - 'Более безопасный: SARSA предполагает случайные переходы среды даже при фиксированном действии'
    - 'Кратчайший: SARSA всегда оценивает продолжение по лучшему доступному действию'
  correct: 0
  id: 031-cliff-safety-1
  fingerprint: b4bb95a9
- concept: осторожность SARSA исчезает при прекращении исследования, потому что пропадает риск случайных действий политики
  question: Объясни своими словами, почему по мере полного отключения исследования SARSA перестаёт предпочитать обходной путь вдали от обрыва.
  explanation: Консервативность SARSA вызвана не случайностью среды, а случайностью действующей политики. Если ε постепенно свести к нулю, исследовательские падения исчезнут, и SARSA сможет сойтись к оптимальному кратчайшему маршруту.
  kind: open
  reference: Когда исследование прекращается, политика больше не выбирает случайные действия, способные столкнуть агента с безопасного маршрута. SARSA оценивает эту ставшую жадной политику, поэтому дополнительный риск пути у края исчезает и кратчайший маршрут снова становится предпочтительным.
  id: 031-cliff-safety-2
  fingerprint: 0339b64a
