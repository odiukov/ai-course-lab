- concept: вероятность выбора жадного действия включает его долю среди случайных исследовательских выборов
  question: В состоянии доступны пять действий, одно из них имеет строго наибольшую оценку. Агент использует ε-жадную стратегию с ε = 0,25, а при исследовании выбирает равновероятно среди всех действий. Какова полная вероятность выбрать жадное действие?
  explanation: 'Жадная ветвь даёт вероятность 1 − ε, а исследовательская — ещё ε/5, поскольку случайно может выпасть и лучшее действие. Итого: 1 − 0,25 + 0,25/5 = 0,8.'
  kind: numeric
  answer: 0.8
  tolerance: 0.001
  id: 012-epsilon-for-td-1
  fingerprint: f9922036
- concept: ε-жадная политика применяется при каждом выборе действия в ходе TD-обучения
  question: Как правильно встроить ε-жадную стратегию в цикл TD-обучения?
  explanation: После каждого перехода агент оказывается в новом состоянии и снова выбирает действие по ε-жадному правилу. Благодаря этому TD-обновления получают данные как о лучших известных, так и о менее изученных действиях.
  kind: choice
  options:
    - Выбрать один режим — исследование или использование — в начале обучения и больше его не менять
    - Применять ε-жадное правило каждый раз, когда агенту нужно выбрать действие в текущем состоянии
    - Исследовать только в состояниях, оценки действий в которых полностью совпадают
    - Сначала заполнить всю таблицу случайными переходами, а затем навсегда перейти к жадной политике
  correct: 1
