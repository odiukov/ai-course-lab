- concept: максимальная абсолютная ошибка выявляет худшую оценку во всей Q-таблице
  question: Нужно обнаружить даже одну сильно ошибочную оценку среди всех пар состояния и действия. Какую метрику следует использовать?
  explanation: Максимальная абсолютная ошибка не позволяет хорошо изученным парам скрыть одну плохо исследованную. Среднее может остаться небольшим даже при крупной локальной ошибке.
  kind: choice
  options:
    - Максимум абсолютных разностей между обученной и эталонной Q-таблицами
    - Среднее знаковых разностей между Q-таблицами
    - Среднюю награду только успешных эпизодов
  correct: 0
  id: 033-dp-truth-1
  fingerprint: ed8198dc
- concept: эталонная Q-функция должна быть рассчитана для той же модели среды, что использовалась при обучении
  question: Q-learning обучался в детерминированной GridWorld. Какой эталон подходит для проверки его Q-таблицы?
  explanation: Изменение вероятностей переходов меняет оптимальные значения действий. Сравнение с эталоном другой среды смешивает ошибку обучения с различием моделей.
  kind: choice
  options:
    - Q* из value iteration с теми же переходами и наградами
    - Q* из версии GridWorld со случайным проскальзыванием
    - Q-таблица любого агента с похожей средней отдачей
  correct: 0
  id: 033-dp-truth-2
  fingerprint: fe220e66
- concept: SARSA при постоянном ненулевом исследовании оценивает Q-функцию исследующей политики, а не оптимальную Q-функцию
  question: Почему Q-таблица SARSA при постоянном ненулевом ε не обязана совпадать с Q* даже после длительного обучения?
  explanation: Пока ε остаётся ненулевым, поведение включает исследовательские действия и их последствия входят в оценки SARSA. Поэтому прямое совпадение с Q* не является корректным требованием.
  kind: open
  reference: SARSA является on-policy-методом и оценивает ε-жадную политику, которая продолжает иногда выбирать случайные действия. Поэтому её пределом служит Q-функция этой исследующей политики, а не Q* оптимальной политики.
  id: 033-dp-truth-3
  fingerprint: 936c63d5
