- concept: маршрут итоговой табличной политики визуализируют жадным проходом без исследовательских действий
  question: Как по обученной Q-таблице построить воспроизводимый маршрут от старта до цели для сравнения политик Q-learning и SARSA? Объясни, почему при таком проходе следует отключить исследование.
  explanation: Исследовательский запуск показывает смесь выученной политики и случайных действий. Жадный проход изолирует итоговую политику, поэтому по нему можно корректно сравнить длину маршрутов и их расстояние до обрыва.
  kind: open
  reference: Нужно начать в стартовом состоянии, в каждой клетке выбирать действие с максимальным Q-значением, выполнять переход и записывать посещённые клетки до достижения цели. Исследование отключают, чтобы случайные действия не меняли маршрут между запусками и визуализация показывала именно выученную жадную политику.
  id: 032-cliff-routes-2
  fingerprint: cfff8a9e
