- concept: действие в GridWorld преобразуется в смещение строки и столбца
  question: Состояние клетки записано как `(row, column)`, а `step` — положительный размер одного перемещения. Какая клетка будет кандидатом для действия вправо?
  explanation: Горизонтальное движение изменяет столбец, но сохраняет строку. При движении вправо индекс столбца увеличивается.
  kind: choice
  options:
    - '`(row + step, column)`'
    - '`(row - step, column)`'
    - '`(row, column + step)`'
    - '`(row, column - step)`'
  correct: 2
  id: 005-grid-step-1
  fingerprint: 001d547b
- concept: допустимость перехода определяется проверкой клетки-кандидата, а не исходного состояния
  question: Функция перехода уже вычислила `candidate`. Объясни, почему перед присваиванием `next_state` границы сетки нужно проверять для `candidate`, а не для исходного `state`.
  explanation: Проверка исходной клетки пропустит запрещённый ход, поскольку она останется допустимой независимо от направления действия. Результат действия определяется координатами кандидата.
  kind: open
  reference: Исходное состояние обычно уже гарантированно принадлежит сетке, поэтому его проверка ничего не говорит о допустимости нового хода. За границы может выйти именно клетка-кандидат; нужно проверить обе её координаты и только после этого принять переход.
  id: 005-grid-step-2
  fingerprint: 68e4fffb
