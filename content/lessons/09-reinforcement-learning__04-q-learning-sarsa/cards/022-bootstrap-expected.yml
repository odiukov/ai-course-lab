- concept: выбор конкретного жадного действия среди равных максимумов не влияет на бутстрэп Expected SARSA
  question: В следующем состоянии несколько действий имеют одинаковую максимальную Q-оценку. ε-жадная политика назначает массу эксплуатации одному из них по фиксированному правилу. Как изменится бутстрэп Expected SARSA, если правило выберет другое действие с той же максимальной оценкой?
  explanation: Взвешенная сумма зависит от произведений вероятностей на Q-оценки. Перенос одной и той же вероятностной массы между действиями с равными максимальными оценками не меняет эту сумму.
  kind: choice
  options:
    - 'Не изменится: вероятность переносится между действиями с одинаковыми Q-оценками'
