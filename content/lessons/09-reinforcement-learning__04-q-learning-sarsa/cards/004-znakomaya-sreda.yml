- concept: неизменившееся состояние не отменяет переход среды
  question: Агент выбрал движение в стену, поэтому остался в той же клетке GridWorld. Можно ли использовать этот результат для обучения?
  explanation: Переход определяется не обязательным перемещением, а результатом действия. Даже если следующее состояние совпало с текущим, полученные награда и признак завершения образуют полноценный учебный пример.
  kind: choice
  options:
    - 'Да: действие было выполнено, а среда вернула следующее состояние, награду и признак завершения'
    - 'Нет: переход существует только тогда, когда координаты агента изменились'
    - 'Нет: такие действия нужно удалять до передачи данных алгоритму'
    - Да, но только если после действия эпизод завершился
  correct: 0
  id: 004-znakomaya-sreda-1
  fingerprint: 1c49d60b
- concept: признак завершения отделяет терминальный переход от обычного
  question: Объясни своими словами, зачем среда вместе с наградой и следующим состоянием возвращает признак завершения эпизода.
  explanation: Одинаковое внешне перемещение может привести либо в обычную, либо в терминальную клетку. Признак завершения позволяет агенту правильно остановить текущий эпизод и не обращаться с терминальным состоянием как с продолжающимся.
  kind: open
  reference: 'Он сообщает агенту, можно ли продолжать эпизод из следующего состояния. После терминального перехода нельзя выбирать очередное действие в рамках той же попытки: продолжение не учитывают, а среду запускают заново.'
  id: 004-znakomaya-sreda-2
  fingerprint: ce747a25
