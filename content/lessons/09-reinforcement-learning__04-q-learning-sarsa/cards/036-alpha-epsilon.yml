- concept: постоянный коэффициент обучения сохраняет способность адаптироваться к нестационарной среде
  question: Почему в среде с меняющимися наградами постоянный коэффициент обучения α может быть полезнее коэффициента, который убывает с числом обновлений пары состояния и действия?
  explanation: Убывающий α полезен для теоретической сходимости в стационарной задаче, но постепенно почти замораживает оценки. Постоянный α не даёт обновлениям исчезнуть и потому лучше отслеживает изменения, хотя сохраняет шум и не обеспечивает такого же режима точной сходимости.
  kind: open
  reference: Постоянный α сохраняет заметное влияние новых наблюдений, поэтому Q-оценки продолжают подстраиваться под изменения среды. Убывающий коэффициент со временем становится слишком мал, и агент начинает реагировать на изменения очень медленно.
