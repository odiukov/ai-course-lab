- concept: хеширование обеспечивает адресацию состояний, но не переносит оценки между похожими состояниями
  question: Объясни своими словами, почему преобразование непрерывного наблюдения в хешируемый ключ само по себе не решает проблему обучения табличного Q-агента в большом пространстве состояний.
  explanation: Хеширование решает техническую задачу поиска записи. Оно не создаёт общей зависимости между Q-оценками соседних состояний, поэтому размер таблицы и потребность в данных растут вместе с числом различных ключей.
  kind: open
  reference: Хешируемый ключ позволяет сохранить и найти отдельную строку Q-таблицы, но не сообщает алгоритму, что разные ключи могут обозначать похожие состояния. Каждая новая пара состояния и действия должна получать собственный опыт, поэтому при огромном или непрерывном пространстве таблица плохо масштабируется и почти не обобщает наблюдения.
  id: 040-state-boundary-2
  fingerprint: 576e3822
