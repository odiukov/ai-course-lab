- concept: ленивая инициализация таблицы действий для ранее не встречавшихся состояний
  question: Таблица значений действий создана через defaultdict, фабрика которого возвращает словарь всех допустимых действий с нулевыми оценками. Что произойдёт при первом обращении к ранее не встречавшемуся состоянию?
  explanation: Фабрика defaultdict вызывается при обращении к отсутствующему ключу. Поэтому новое состояние сразу получает отдельный словарь с начальной оценкой каждого допустимого действия.
  kind: choice
  options:
    - Возникнет KeyError, потому что состояние ещё не добавлено
    - Для состояния автоматически создастся словарь нулевых оценок действий
    - Состоянию будет назначено одно случайное действие
    - Все оценки существующих состояний обнулятся
  correct: 1
  id: 027-sarsa-1
  fingerprint: 031a7469
- concept: эпизод SARSA начинается с уже сформированной пары текущего состояния и действия
  question: Почему в реализации SARSA первое действие выбирают сразу после env.reset(), ещё до входа в цикл переходов?
  explanation: На входе каждой итерации должны быть определены и состояние, и выполняемое в нём действие. Для последующих итераций эта пара переносится из предыдущего перехода, а для первой её необходимо сформировать сразу после reset().
  kind: open
  reference: Каждый переход SARSA выполняется из пары текущего состояния и уже выбранного действия. После reset известно начальное состояние, поэтому нужно выбрать для него действие, которое будет передано в env.step и станет первым элементом последовательности переходов эпизода.
  id: 027-sarsa-2
