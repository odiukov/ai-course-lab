- concept: скорость сходимости определяется временем достижения устойчивого уровня качества, а не лучшим отдельным эпизодом
  question: Метод A раньше достигает заданного уровня средней отдачи и затем устойчиво его сохраняет. Метод B приходит к тому же итоговому уровню позже. Какой вывод обоснован?
  explanation: Скорость сходимости показывает, сколько обучения требуется для устойчивого достижения выбранного качества. В материале обе кривые к примерно 1000 эпизодам близки к оптимуму, но в других задачах одна из них может выйти на этот уровень раньше.
  kind: choice
  options:
    - Метод A сходится быстрее, а их установившееся качество сопоставимо
    - Метод B лучше, потому что обучался дольше
    - Методы сходятся с одинаковой скоростью, раз итоговый уровень совпал
    - Скорость сходимости следует определять по самому удачному отдельному эпизоду
  correct: 0
  id: 030-curves-visual-1
  fingerprint: 0b72c26d
- concept: сравнительное преимущество Q-learning и SARSA зависит от свойств среды
  question: Объясни своими словами, почему более быстрая сходимость Q-learning в простой детерминированной среде не доказывает, что он всегда предпочтительнее SARSA.
  explanation: Кривые обучения характеризуют сочетание алгоритма, политики поведения и среды. Поэтому результат на GridWorld 4×4 нельзя автоматически переносить на cliff-walking, где риск случайного шага делает осторожность SARSA существенной.
  kind: open
  reference: 'Преимущество зависит от задачи: в простом детерминированном GridWorld Q-learning может быстрее приблизиться к оптимальной отдаче, тогда как в cliff-walking SARSA учитывает исследовательские действия текущей политики и обычно выучивает более осторожное поведение.'
  id: 030-curves-visual-2
  fingerprint: c9b8bc73
