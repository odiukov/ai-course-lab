- concept: устойчивое плато средней отдачи при постоянном исследовании указывает на необходимость уменьшить ε
  question: Средняя отдача почти не меняется на протяжении нескольких последовательных окон, а ε остаётся постоянным. Как разумно изменить обучение и почему?
  explanation: При постоянном ε агент продолжает регулярно выполнять случайные действия, поэтому исследование может удерживать среднюю отдачу ниже уровня жадной политики. Несколько соседних ровных окон дают более убедительный сигнал плато, чем одно окно.
  kind: open
  reference: Следует уменьшить ε и продолжить наблюдать за средними отдачами. Устойчивое плато показывает, что простое добавление эпизодов с прежней частотой случайных действий, вероятно, даст мало улучшений. Одного ровного окна для такого вывода недостаточно.
  id: 029-learning-curves-2
  fingerprint: eb46a8b3
