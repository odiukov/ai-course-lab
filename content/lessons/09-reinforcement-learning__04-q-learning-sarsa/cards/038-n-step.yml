- concept: n-шаговая TD-цель суммирует дисконтированные награды до выбранного горизонта, а затем добавляет дисконтированную оценку достигнутого состояния
  question: В нетерминальной траектории четырёхшаговая TD-цель строится по наградам 7, 8, 9 и 12. Коэффициент дисконтирования равен 0.8, а оценка состояния после этих переходов равна 13. Чему равна цель?
  explanation: Цель равна 7 + 0.8·8 + 0.64·9 + 0.512·12 + 0.4096·13 = 30.6288. После четырёх наблюдаемых наград остаток продолжения заменяется бутстрэп-оценкой состояния.
  kind: numeric
  answer: 30.6288
  tolerance: 0.001
  id: 038-n-step-1
  fingerprint: 9be62c19
- concept: в TD(λ) веса последовательных по длине n-шаговых возвратов убывают геометрически с множителем λ
  question: В TD(λ) некоторый n-шаговый возврат имеет вес w. Каков вес возврата, который длиннее на один переход?
  explanation: Вес каждого следующего по длине возврата получается умножением предыдущего веса на λ. Поэтому при λ меньше единицы вклад более длинных продолжений геометрически затухает.
  kind: choice
  options:
    - λw
    - w
    - w/λ
    - Он определяется только величиной дополнительной награды
