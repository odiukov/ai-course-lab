- concept: одношаговая TD-цель сочетает награду с текущей оценкой следующего состояния
  question: Восстановите формулу одношаговой цели для обновления ценности состояния.
  explanation: TD использует непосредственно полученную награду r и бутстрэп-оценку будущей ценности γV(s'). Поэтому цель равна r + γV(s').
  kind: cloze
  template: TD_target = r + ___
  answer: γV(s')
  accept:
    - gamma * V(s')
    - γ * V(s')
    - gamma V(s')
  id: 002-kompromiss-td-1
  fingerprint: e9bc8a75
- concept: TD может обновлять оценку сразу по наблюдаемому переходу без модели среды
  question: Агент наблюдал переход из состояния s в состояние s' и получил награду r. Каких данных достаточно для немедленного TD-обновления V(s)?
  explanation: Одношаговое TD-обновление строится по фактически наблюдаемому переходу и цели r + γV(s'). Оно не требует ни модели вероятностей переходов, ни завершения эпизода.
  kind: choice
  options:
    - Награды r, текущей оценки V(s') и коэффициента дисконтирования
    - Вероятностей всех возможных переходов из s
    - Полной последовательности состояний до конца эпизода
    - Точной суммарной отдачи для каждой возможной траектории
  correct: 0
  id: 002-kompromiss-td-2
  fingerprint: c4604f60
- concept: бутстрэппинг снижает дисперсию TD-цели ценой возможного смещения
  question: Почему TD-цель может быть смещённой, особенно в начале обучения?
  explanation: В цели r + γV(s') будущая ценность не наблюдается напрямую, а оценивается самим алгоритмом. Ошибка V(s') поэтому влияет на обновление V(s), создавая смещение.
  kind: open
  reference: 'Потому что TD подставляет в цель собственную текущую оценку V(s''), которая ещё может быть неточной. Это бутстрэппинг: он позволяет учиться после каждого перехода и обычно снижает дисперсию, но переносит ошибку приближения в целевое значение.'
  id: 002-kompromiss-td-3
  fingerprint: e2a6854b
