- concept: SARSA подставляет в цель оценку фактически выбранного следующего действия
  question: После перехода агент получил награду 3. Коэффициент дисконтирования равен 0.6. В следующем состоянии ε-жадная политика выбрала действие с Q-оценкой 4, хотя максимальная Q-оценка среди действий равна 11. Чему равна цель SARSA?
  explanation: 'SARSA использует оценку выбранного действия: 3 + 0.6 × 4 = 5.4. Максимальная оценка 11 в эту цель не входит, поскольку соответствующее действие не было выбрано.'
  kind: numeric
  answer: 5.4
  tolerance: 0.01
  id: 018-sarsa-next-action-1
  fingerprint: 6690bb86
- concept: выбранное в SARSA следующее действие сохраняется и выполняется на следующем переходе
  question: В нетерминальном состоянии SARSA уже выбрала действие a' по ε-жадной политике. После обновления таблицы повторный вызов политики мог бы вернуть другое действие. Как должен поступить алгоритм на следующей итерации?
  explanation: Действие a' входит в переход SARSA и переиспользуется как текущее действие следующей итерации. Его повторный выбор нарушил бы соответствие между действием, использованным в цели, и действием, которое агент действительно выполнит.
  kind: choice
  options:
    - Выполнить ранее выбранное действие a'
    - Заново выбрать действие по обновлённой таблице
    - Всегда заменить a' действием с максимальной Q-оценкой
    - Отменить выполненное обновление и повторить переход
  correct: 0
