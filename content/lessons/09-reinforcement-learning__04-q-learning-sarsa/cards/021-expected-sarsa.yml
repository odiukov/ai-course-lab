- concept: бутстрэп Expected SARSA равен математическому ожиданию Q-оценки следующего действия под текущей политикой
  question: В следующем состоянии политика выбирает пять действий с вероятностями 0.52, 0.18, 0.12, 0.11 и 0.07. Их Q-оценки равны соответственно 50, 40, 30, 20 и 10. Чему равно бутстрэп-значение Expected SARSA?
  explanation: 'Нужно вычислить взвешенную сумму: 0.52·50 + 0.18·40 + 0.12·30 + 0.11·20 + 0.07·10 = 39.7. Каждая Q-оценка учитывается с вероятностью выбора соответствующего действия.'
  kind: numeric
  answer: 39.7
  tolerance: 0.001
  id: 021-expected-sarsa-1
  fingerprint: 65a125b0
- concept: Expected SARSA устраняет дисперсию от выборки следующего действия, сохраняя on-policy цель
  question: Почему при фиксированных переходе, политике и таблице Q цель Expected SARSA менее шумная, чем цель обычной SARSA?
  explanation: Обычная SARSA подставляет Q-оценку одного случайно выбранного следующего действия. Expected SARSA аналитически усредняет эту величину под той же политикой, поэтому убирает именно шум от выборки действия, но не случайность среды.
  kind: choice
  options:
    - Она усредняет Q-оценки всех следующих действий по их вероятностям вместо выборки одного действия
    - Она заменяет текущую политику полностью жадной
    - Она устраняет случайность награды и перехода среды
    - Она отказывается от бутстрэппинга и ждёт конца эпизода
  correct: 0
  id: 021-expected-sarsa-2
  fingerprint: 671d176a
