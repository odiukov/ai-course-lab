- concept: проверяемая спецификация TD-агента фиксирует алгоритм, настройки, инициализацию, критерий сходимости и эксплуатационное поведение
  question: Команда должна подготовить спецификацию табличного TD-агента, которую можно принять по объективным критериям. Какие сведения необходимо включить в такую спецификацию?
  explanation: Название алгоритма и удачный запуск не образуют проверяемого предложения. Контракт должен позволять воспроизвести обучение, оценить сходимость и заранее понять поведение агента после развёртывания.
  kind: open
  reference: Нужно указать алгоритм и обосновать его через on-policy или off-policy характер и дисперсию; задать α, γ, ε и расписание их изменения; описать начальные Q-значения; определить ожидаемый вид кривой обучения и, если возможно, сравнение с Q*; объяснить, сохранится ли исследование при эксплуатации и нужна ли связанная с ним осторожность SARSA.
  id: 042-td-agent-contract-1
  fingerprint: 851ca19f
- concept: табличный TD следует отклонить для пространства состояний, слишком большого для практичной таблицы значений
  question: Среда содержит несколько миллионов дискретных состояний. Какой ответ соответствует безопасному контракту TD-агента?
  explanation: Ленивая инициализация экономит память только на непосещённых состояниях, но не создаёт переноса знаний между похожими состояниями. Для пространства такого масштаба контракт запрещает предлагать табличный TD.
  kind: choice
  options:
    - Отказаться от табличного TD и перейти к представлению с обобщением или аппроксимацией функции
    - Выбрать Q-learning, потому что ленивая таблица автоматически решает проблему масштаба
    - Выбрать SARSA и компенсировать размер пространства оптимистичной инициализацией
    - Выбрать Expected SARSA, потому что усреднение действий уменьшает объём таблицы
  correct: 0
