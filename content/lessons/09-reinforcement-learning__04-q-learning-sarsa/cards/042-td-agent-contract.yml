- concept: максимальное ε на всём обучении не оставляет агенту фазы использования найденной политики
  question: Заполните пропуск в заключении об обучении ε-жадного агента.
  explanation: При максимальном ε каждое действие выбирается случайно. Агент может обновлять Q-оценки, но поведенческая политика не начинает предпочитать найденные хорошие действия, поэтому такой режим требуется явно отметить как дефект.
  kind: cloze
  template: Если ε всё время остаётся максимальным, агент только исследует, поэтому у обучения отсутствует фаза ___.
  answer: эксплуатации
  accept:
    - использования
    - использования найденной политики
    - exploitation
  id: 042-td-agent-contract-3
