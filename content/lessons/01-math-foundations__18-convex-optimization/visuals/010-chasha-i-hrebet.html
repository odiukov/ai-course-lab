<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Хорда над чашей и под невыпуклой кривой</title>
<style>
  :root{
    color-scheme:light dark;
    --page:#f7f8fc;
    --panel:#ffffff;
    --panel-stroke:#d9deea;
    --ink:#172033;
    --muted:#5d687d;
    --curve:#34425e;
    --chord:#2563eb;
    --point:#ffffff;
    --good:#14805e;
    --good-soft:#dff5eb;
    --good-area:#4bb78b33;
    --bad:#c43f4f;
    --bad-soft:#fde7ea;
    --bad-area:#e4566638;
    --guide:#9ba6b8;
  }
  *{box-sizing:border-box}
  html,body{background:var(--page);color:var(--ink)}
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:960px;margin:auto}
  h1{font-size:22px;text-align:center}
  svg{
    display:block;
    width:100%;
    height:auto;
    background:var(--page);
    border:1px solid var(--panel-stroke);
  }
  .card{fill:var(--panel);stroke:var(--panel-stroke);stroke-width:1.5}
  .curve{fill:none;stroke:var(--curve);stroke-width:4;stroke-linecap:round}
  .chord{stroke:var(--chord);stroke-width:4;stroke-linecap:round}
  .point{fill:var(--point);stroke:var(--chord);stroke-width:3}
  .good-area{fill:var(--good-area)}
  .bad-area{fill:var(--bad-area)}
  .bad-highlight{fill:none;stroke:var(--bad);stroke-width:5;stroke-linecap:round}
  .measure{stroke:var(--bad);stroke-width:2.5;stroke-linecap:round}
  .leader{fill:none;stroke:var(--bad);stroke-width:2;stroke-linecap:round}
  .panel-title{fill:var(--ink);font-size:21px;font-weight:bold}
  .panel-note{fill:var(--muted);font-size:15px}
  .label{fill:var(--ink);font-size:15px;font-weight:bold}
  .point-label{fill:var(--muted);font-size:14px}
  .bad-label{fill:var(--bad);font-size:15px;font-weight:bold}
  .badge-good{fill:var(--good-soft);stroke:var(--good);stroke-width:1.5}
  .badge-bad{fill:var(--bad-soft);stroke:var(--bad);stroke-width:1.5}
  .status-good{fill:var(--good);font-size:15px;font-weight:bold}
  .status-bad{fill:var(--bad);font-size:15px;font-weight:bold}
  .fallback{font-size:16px;color:var(--bad);text-align:center}
  @media (prefers-color-scheme:dark){
    :root{
      --page:#10141d;
      --panel:#181e29;
      --panel-stroke:#343d4d;
      --ink:#eef2fa;
      --muted:#acb6c7;
      --curve:#cbd3df;
      --chord:#6ea3ff;
      --point:#181e29;
      --good:#67d3a8;
      --good-soft:#183d32;
      --good-area:#67d3a832;
      --bad:#ff8490;
      --bad-soft:#49252c;
      --bad-area:#ff849038;
      --guide:#758196;
    }
  }
</style>
</head>
<body>
<main>
  <h1>Хорда над чашей и под невыпуклой кривой</h1>
  <p id="fallback" class="fallback">
    Схема должна показать чашу с хордой сверху и волнистую кривую с выступом над хордой.
  </p>
  <svg id="diagram" viewBox="0 0 960 390" role="img"
       aria-labelledby="svg-title svg-desc" preserveAspectRatio="xMidYMid meet">
    <title id="svg-title">Сравнение выпуклой и невыпуклой функций по положению хорды</title>
    <desc id="svg-desc">Слева хорда между точками x и y лежит над чашеобразной кривой. Справа выступ волнистой кривой поднимается над хордой.</desc>
  </svg>
</main>

<script>
const DATA={
  origin:{x:0,y:13},
  scale:{x:40,y:30},
  cards:[
    {box:[.35,11.65,.45,12.55,.24],kind:"good"},
    {box:[12.35,23.65,.45,12.55,.24],kind:"bad"}
  ],
  headings:[
    {x:6,y:11.75,text:"Выпуклая чаша",anchor:"middle",className:"panel-title"},
    {x:6,y:10.9,text:"хорда не опускается под кривую",anchor:"middle",className:"panel-note"},
    {x:18,y:11.75,text:"Невыпуклая кривая",anchor:"middle",className:"panel-title"},
    {x:18,y:10.9,text:"одного выступа достаточно для нарушения",anchor:"middle",className:"panel-note"}
  ],
  left:{
    curve:[
      ["M",1.5,4.8],
      ["C",3,1.3,7,1.3,8.5,4.8]
    ],
    area:[
      ["M",1.5,4.8],
      ["L",8.5,4.8],
      ["C",7,1.3,3,1.3,1.5,4.8],
      ["Z"]
    ],
    chord:[1.5,4.8,8.5,4.8],
    points:[[1.5,4.8],[8.5,4.8]],
    chordLabel:{x:5,y:4.8,dx:0,dy:-15,text:"хорда сверху",anchor:"middle",className:"label"},
    pointLabels:[
      {x:1.5,y:4.8,dx:-10,dy:27,text:"точка x",anchor:"end",className:"point-label"},
      {x:8.5,y:4.8,dx:10,dy:27,text:"точка y",anchor:"start",className:"point-label"}
    ],
    badge:[1.05,10.95,.72,1.78,.18],
    status:{x:6,y:1.18,dx:0,dy:5,text:"Хорда везде сверху — проверка пройдена",anchor:"middle",className:"status-good"}
  },
  right:{
    curve:[
      ["M",13.5,4.8],
      ["C",14.5,3.2,15.4,1.8,16.4,2.9],
      ["C",16.8,3.4,17,4.3,17.35,4.8],
      ["C",17.8,5.5,18.2,7.3,18.9,6.6],
      ["C",19.35,6.2,19.55,5.2,19.75,4.8],
      ["C",20.05,4.15,20.25,4.2,20.5,4.8]
    ],
    violation:[
      ["M",17.35,4.8],
      ["L",19.75,4.8],
      ["C",19.55,5.2,19.35,6.2,18.9,6.6],
      ["C",18.2,7.3,17.8,5.5,17.35,4.8],
      ["Z"]
    ],
    highlight:[
      ["M",17.35,4.8],
      ["C",17.8,5.5,18.2,7.3,18.9,6.6],
      ["C",19.35,6.2,19.55,5.2,19.75,4.8]
    ],
    chord:[13.5,4.8,20.5,4.8],
    points:[[13.5,4.8],[20.5,4.8]],
    measure:[18.55,4.8,18.55,6.85],
    caps:[[18.35,4.8,18.75,4.8],[18.35,6.85,18.75,6.85]],
    leader:[
      ["M",20.55,8.15],
      ["C",20.05,8.15,19.55,7.65,18.85,6.75]
    ],
    chordLabel:{x:15.55,y:4.8,dx:0,dy:-15,text:"хорда",anchor:"middle",className:"label"},
    bumpLabel:{x:20.6,y:8.35,dx:0,dy:0,text:"выступ выше хорды",anchor:"end",className:"bad-label"},
    pointLabels:[
      {x:13.5,y:4.8,dx:-10,dy:27,text:"точка x",anchor:"end",className:"point-label"},
      {x:20.5,y:4.8,dx:10,dy:27,text:"точка y",anchor:"start",className:"point-label"}
    ],
    badge:[13.05,22.95,.72,1.78,.18],
    status:{x:18,y:1.18,dx:0,dy:5,text:"Хорда местами снизу — нарушение найдено",anchor:"middle",className:"status-bad"}
  },
  pointRadius:.14
};

const origin=DATA.origin;
const scale=DATA.scale;
const sx=x=>origin.x+x*scale.x;
const sy=y=>origin.y*scale.y-y*scale.y;

try{
  const svg=document.getElementById("diagram");
  const fallback=document.getElementById("fallback");
  const NS="http://www.w3.org/2000/svg";

  function make(name,attrs,text){
    const node=document.createElementNS(NS,name);
    for(const [key,value] of Object.entries(attrs||{})) node.setAttribute(key,value);
    if(text!==undefined) node.textContent=text;
    return node;
  }

  function append(name,attrs,text){
    const node=make(name,attrs,text);
    svg.appendChild(node);
    return node;
  }

  function pathData(commands){
    return commands.map(([command,...values])=>{
      if(command==="Z") return command;
      const remaining=[...values];
      const pairs=[];
      while(remaining.length){
        const x=remaining.shift();
        const y=remaining.shift();
        pairs.push(`${sx(x)} ${sy(y)}`);
      }
      return `${command} ${pairs.join(" ")}`;
    }).join(" ");
  }

  function drawPath(commands,className){
    append("path",{d:pathData(commands),class:className});
  }

  function drawLine(values,className){
    const [x1,y1,x2,y2]=values;
    append("line",{x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),class:className});
  }

  function drawRect(values,className){
    const [x1,x2,y1,y2,r]=values;
    append("rect",{
      x:sx(x1),
      y:sy(y2),
      width:sx(x2)-sx(x1),
      height:sy(y1)-sy(y2),
      rx:sx(r)-sx(0),
      ry:sy(0)-sy(r),
      class:className
    });
  }

  function drawText(item){
    append("text",{
      x:sx(item.x),
      y:sy(item.y),
      dx:item.dx,
      dy:item.dy,
      "text-anchor":item.anchor,
      class:item.className
    },item.text);
  }

  function drawPoints(points){
    for(const [x,y] of points){
      append("circle",{
        cx:sx(x),
        cy:sy(y),
        r:sx(DATA.pointRadius)-sx(0),
        class:"point"
      });
    }
  }

  for(const card of DATA.cards) drawRect(card.box,"card");
  for(const heading of DATA.headings) drawText({...heading,dx:0,dy:0});

  drawPath(DATA.left.area,"good-area");
  drawPath(DATA.left.curve,"curve");
  drawLine(DATA.left.chord,"chord");
  drawPoints(DATA.left.points);
  drawText(DATA.left.chordLabel);
  for(const label of DATA.left.pointLabels) drawText(label);
  drawRect(DATA.left.badge,"badge-good");
  drawText(DATA.left.status);

  drawPath(DATA.right.violation,"bad-area");
  drawLine(DATA.right.chord,"chord");
  drawPath(DATA.right.curve,"curve");
  drawPath(DATA.right.highlight,"bad-highlight");
  drawLine(DATA.right.measure,"measure");
  for(const cap of DATA.right.caps) drawLine(cap,"measure");
  drawPath(DATA.right.leader,"leader");
  drawPoints(DATA.right.points);
  drawText(DATA.right.chordLabel);
  drawText(DATA.right.bumpLabel);
  for(const label of DATA.right.pointLabels) drawText(label);
  drawRect(DATA.right.badge,"badge-bad");
  drawText(DATA.right.status);

  fallback.hidden=true;
}catch(error){
  const fallback=document.getElementById("fallback");
  fallback.hidden=false;
  fallback.textContent="Не удалось построить схему. Она должна была показать хорду над чашей и выступ волнистой кривой над хордой.";
}
</script>
</body>
</html>
