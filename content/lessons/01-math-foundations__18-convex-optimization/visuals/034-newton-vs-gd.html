<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Градиентный спуск и Ньютон в вытянутой долине</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f4ed;
    --ink: #18212b;
    --muted: #596674;
    --axis: #7a8793;
    --grid: #b8c1c8;
    --contour: #91a0ad;
    --contour-strong: #637586;
    --gd: #d76428;
    --gd-dark: #9e3d16;
    --newton: #16845b;
    --newton-dark: #07593b;
    --point: #17212b;
    --panel: #fffdf8;
    --panel-line: #d4d0c7;
    --error: #8b2c23;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
  }

  body {
    margin: auto;
  }

  main {
    background: var(--page);
  }

  .title {
    color: var(--ink);
    font-size: 22px;
    font-weight: bold;
    text-align: center;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    background: var(--page);
  }

  .axis {
    fill: none;
    stroke: var(--axis);
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .contour {
    fill: none;
    stroke: var(--contour);
    stroke-width: 1.4;
  }

  .contour-strong {
    stroke: var(--contour-strong);
    stroke-width: 1.8;
  }

  .gd-path {
    fill: none;
    stroke: var(--gd);
    stroke-width: 2.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .newton-path {
    fill: none;
    stroke: var(--newton);
    stroke-width: 3.2;
    stroke-linecap: round;
  }

  .gd-arrow {
    fill: var(--gd);
    stroke: var(--gd-dark);
    stroke-width: 1;
    stroke-linejoin: round;
  }

  .newton-arrow {
    fill: var(--newton);
    stroke: var(--newton-dark);
    stroke-width: 1;
    stroke-linejoin: round;
  }

  .axis-arrow {
    fill: var(--axis);
  }

  .start-point {
    fill: var(--point);
    stroke: var(--page);
    stroke-width: 2;
  }

  .minimum-halo {
    fill: var(--page);
    stroke: var(--newton);
    stroke-width: 3;
  }

  .minimum-core {
    fill: var(--newton);
  }

  .gd-step {
    fill: var(--gd);
    stroke: var(--page);
    stroke-width: 1;
  }

  .panel {
    fill: var(--panel);
    stroke: var(--panel-line);
    stroke-width: 1.5;
  }

  .label {
    fill: var(--ink);
    font-size: 14px;
  }

  .small-label {
    fill: var(--muted);
    font-size: 13px;
  }

  .formula {
    fill: var(--ink);
    font-size: 18px;
    font-weight: bold;
  }

  .gd-label {
    fill: var(--gd-dark);
    font-size: 14px;
    font-weight: bold;
  }

  .newton-label {
    fill: var(--newton-dark);
    font-size: 14px;
    font-weight: bold;
  }

  .axis-label {
    fill: var(--muted);
    font-size: 14px;
    font-style: italic;
  }

  .fallback {
    color: var(--error);
    background: var(--panel);
    font-size: 15px;
    text-align: center;
  }

  [hidden] {
    display: none;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #11171d;
      --ink: #edf2f6;
      --muted: #aab7c2;
      --axis: #82919e;
      --grid: #52606c;
      --contour: #526575;
      --contour-strong: #8398a9;
      --gd: #ff8a4c;
      --gd-dark: #ffb084;
      --newton: #44d39a;
      --newton-dark: #8aebc6;
      --point: #f6f8fa;
      --panel: #182129;
      --panel-line: #394650;
      --error: #ffaca3;
    }
  }
</style>
</head>
<body>
<main>
  <div class="title">Градиентный спуск и Ньютон в вытянутой долине</div>

  <svg id="plot"
       viewBox="0 0 760 420"
       width="760"
       height="420"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="svg-title svg-desc">
    <title id="svg-title">Градиентный спуск и метод Ньютона на функции 50x²+y²</title>
    <desc id="svg-desc">
      Из общей точки (10, 10) градиентный спуск идёт к минимуму длинным
      зигзагом, а метод Ньютона делает один прямой шаг к точке (0, 0).
    </desc>
    <g id="drawing"></g>
  </svg>

  <div id="fallback" class="fallback" hidden>
    Схема должна была показать вытянутые линии уровня функции 50x²+y²,
    зигзагообразный путь градиентного спуска из (10, 10) и один прямой
    шаг Ньютона к минимуму (0, 0).
  </div>
</main>

<script>
"use strict";

const data = {
  zero: 0,
  one: 1,
  two: 2,
  half: 0.5,
  curvatureX: 50,
  curvatureY: 1,
  start: { x: 10, y: 10 },
  minimum: { x: 0, y: 0 },
  levels: [50, 200, 800, 1800, 3200, 5010],
  learningRate: 0.019,
  gdSteps: 90,
  axes: {
    xStart: { x: -18, y: 0 },
    xEnd: { x: 18, y: 0 },
    yStart: { x: 0, y: -34 },
    yEnd: { x: 0, y: 34 }
  },
  panel: {
    topLeft: { x: 22, y: 27 },
    bottomRight: { x: 80, y: -22 },
    radius: 1.2
  },
  legend: {
    formula: { x: 25, y: 21 },
    contourText: { x: 25, y: 16 },
    contourA: { x: 25, y: 12 },
    contourB: { x: 30, y: 12 },
    gdA: { x: 25, y: 6 },
    gdB: { x: 30, y: 6 },
    newtonA: { x: 25, y: 0 },
    newtonB: { x: 30, y: 0 },
    steep: { x: 25, y: -8 },
    gentle: { x: 25, y: -14 }
  },
  axisArrowLength: 1.3,
  axisArrowWidth: 0.65,
  pathArrowLength: 1.5,
  pathArrowWidth: 0.75,
  startRadius: 0.72,
  minimumHaloRadius: 0.9,
  minimumCoreRadius: 0.38,
  stepRadius: 0.24,
  visibleStepStride: 7,
  labelPad: 12,
  labelLift: 18,
  formulaLift: 5
};

const origin = { x: 260, y: 210 };
const scale = 5.8;

const toPx = point => ({
  x: origin.x + point.x * scale,
  y: origin.y - point.y * scale
});

try {
  const NS = "http://www.w3.org/2000/svg";
  const drawing = document.getElementById("drawing");
  const plot = document.getElementById("plot");
  const fallback = document.getElementById("fallback");

  const make = (name, attributes, parent = drawing) => {
    const node = document.createElementNS(NS, name);
    Object.entries(attributes).forEach(([key, value]) => {
      node.setAttribute(key, String(value));
    });
    parent.appendChild(node);
    return node;
  };

  const group = className => make("g", { class: className });

  const line = (a, b, className, parent = drawing) => {
    const pa = toPx(a);
    const pb = toPx(b);
    return make("line", {
      x1: pa.x,
      y1: pa.y,
      x2: pb.x,
      y2: pb.y,
      class: className
    }, parent);
  };

  const polyline = (points, className, parent = drawing) => {
    const value = points.map(point => {
      const p = toPx(point);
      return `${p.x},${p.y}`;
    }).join(" ");
    return make("polyline", {
      points: value,
      class: className
    }, parent);
  };

  const polygon = (points, className, parent = drawing) => {
    const value = points.map(point => {
      const p = toPx(point);
      return `${p.x},${p.y}`;
    }).join(" ");
    return make("polygon", {
      points: value,
      class: className
    }, parent);
  };

  const radiusPx = value => {
    const center = toPx(data.minimum);
    const edge = toPx({ x: value, y: data.zero });
    return Math.abs(edge.x - center.x);
  };

  const circle = (point, radius, className, parent = drawing) => {
    const p = toPx(point);
    return make("circle", {
      cx: p.x,
      cy: p.y,
      r: radiusPx(radius),
      class: className
    }, parent);
  };

  const text = (
    point,
    value,
    className,
    dx,
    dy,
    anchor,
    parent = drawing
  ) => {
    const p = toPx(point);
    const node = make("text", {
      x: p.x + dx,
      y: p.y + dy,
      class: className,
      "text-anchor": anchor
    }, parent);
    node.textContent = value;
    return node;
  };

  const arrowHead = (
    start,
    end,
    length,
    width,
    className,
    parent = drawing
  ) => {
    const vx = end.x - start.x;
    const vy = end.y - start.y;
    const magnitude = Math.hypot(vx, vy);
    const ux = vx / magnitude;
    const uy = vy / magnitude;
    const base = {
      x: end.x - ux * length,
      y: end.y - uy * length
    };
    const left = {
      x: base.x - uy * width,
      y: base.y + ux * width
    };
    const right = {
      x: base.x + uy * width,
      y: base.y - ux * width
    };
    return polygon([end, left, right], className, parent);
  };

  const axesLayer = group("axes-layer");
  line(data.axes.xStart, data.axes.xEnd, "axis", axesLayer);
  line(data.axes.yStart, data.axes.yEnd, "axis", axesLayer);
  arrowHead(
    data.axes.xStart,
    data.axes.xEnd,
    data.axisArrowLength,
    data.axisArrowWidth,
    "axis-arrow",
    axesLayer
  );
  arrowHead(
    data.axes.yStart,
    data.axes.yEnd,
    data.axisArrowLength,
    data.axisArrowWidth,
    "axis-arrow",
    axesLayer
  );

  text(
    data.axes.xEnd,
    "x",
    "axis-label",
    -data.labelPad,
    -data.labelPad,
    "end",
    axesLayer
  );
  text(
    data.axes.yEnd,
    "y",
    "axis-label",
    data.labelPad,
    data.labelLift,
    "start",
    axesLayer
  );

  const contourLayer = group("contours-layer");
  data.levels.forEach((level, index) => {
    const xRadius = Math.sqrt(level / data.curvatureX);
    const yRadius = Math.sqrt(level / data.curvatureY);
    const center = toPx(data.minimum);
    const xEdge = toPx({ x: xRadius, y: data.zero });
    const yEdge = toPx({ x: data.zero, y: yRadius });
    make("ellipse", {
      cx: center.x,
      cy: center.y,
      rx: Math.abs(xEdge.x - center.x),
      ry: Math.abs(yEdge.y - center.y),
      class: index === data.levels.length - data.one
        ? "contour contour-strong"
        : "contour"
    }, contourLayer);
  });

  const newtonLayer = group("newton-layer");
  line(data.start, data.minimum, "newton-path", newtonLayer);
  arrowHead(
    data.start,
    data.minimum,
    data.pathArrowLength,
    data.pathArrowWidth,
    "newton-arrow",
    newtonLayer
  );

  const gdPoints = [];
  let current = { x: data.start.x, y: data.start.y };
  Array.from({ length: data.gdSteps }).forEach(() => {
    gdPoints.push({ x: current.x, y: current.y });
    current = {
      x: current.x - data.learningRate *
        data.two * data.curvatureX * current.x,
      y: current.y - data.learningRate *
        data.two * data.curvatureY * current.y
    };
  });

  const gdLayer = group("gd-layer");
  polyline(gdPoints, "gd-path", gdLayer);

  gdPoints.forEach((point, index) => {
    if (index % data.visibleStepStride === data.zero) {
      circle(point, data.stepRadius, "gd-step", gdLayer);
    }
  });

  const gdLast = gdPoints[gdPoints.length - data.one];
  const gdBeforeLast = gdPoints[gdPoints.length - data.two];
  arrowHead(
    gdBeforeLast,
    gdLast,
    data.pathArrowLength * data.half,
    data.pathArrowWidth * data.half,
    "gd-arrow",
    gdLayer
  );

  const pointsLayer = group("points-layer");
  circle(
    data.minimum,
    data.minimumHaloRadius,
    "minimum-halo",
    pointsLayer
  );
  circle(
    data.minimum,
    data.minimumCoreRadius,
    "minimum-core",
    pointsLayer
  );
  circle(data.start, data.startRadius, "start-point", pointsLayer);

  text(
    data.start,
    "общий старт (10, 10)",
    "label",
    data.labelPad,
    -data.labelPad,
    "start",
    pointsLayer
  );
  text(
    data.minimum,
    "минимум (0, 0)",
    "label",
    data.labelPad,
    data.labelLift,
    "start",
    pointsLayer
  );

  const legendLayer = group("legend-layer");
  const panelTopLeft = toPx(data.panel.topLeft);
  const panelBottomRight = toPx(data.panel.bottomRight);
  const panelRadius = radiusPx(data.panel.radius);

  make("rect", {
    x: panelTopLeft.x,
    y: panelTopLeft.y,
    width: panelBottomRight.x - panelTopLeft.x,
    height: panelBottomRight.y - panelTopLeft.y,
    rx: panelRadius,
    ry: panelRadius,
    class: "panel"
  }, legendLayer);

  text(
    data.legend.formula,
    "50x² + y²",
    "formula",
    data.zero,
    data.formulaLift,
    "start",
    legendLayer
  );
  text(
    data.legend.contourText,
    "вытянутые линии одинаковой высоты",
    "small-label",
    data.zero,
    data.formulaLift,
    "start",
    legendLayer
  );

  line(
    data.legend.contourA,
    data.legend.contourB,
    "contour contour-strong",
    legendLayer
  );
  text(
    data.legend.contourB,
    "линии уровня",
    "small-label",
    data.labelPad,
    data.formulaLift,
    "start",
    legendLayer
  );

  line(data.legend.gdA, data.legend.gdB, "gd-path", legendLayer);
  text(
    data.legend.gdB,
    "градиентный спуск — зигзаг",
    "gd-label",
    data.labelPad,
    data.formulaLift,
    "start",
    legendLayer
  );

  line(
    data.legend.newtonA,
    data.legend.newtonB,
    "newton-path",
    legendLayer
  );
  arrowHead(
    data.legend.newtonA,
    data.legend.newtonB,
    data.pathArrowLength,
    data.pathArrowWidth,
    "newton-arrow",
    legendLayer
  );
  text(
    data.legend.newtonB,
    "Ньютон — один прямой шаг",
    "newton-label",
    data.labelPad,
    data.formulaLift,
    "start",
    legendLayer
  );

  text(
    data.legend.steep,
    "поперёк долины: круто",
    "small-label",
    data.zero,
    data.formulaLift,
    "start",
    legendLayer
  );
  text(
    data.legend.gentle,
    "вдоль долины: полого",
    "small-label",
    data.zero,
    data.formulaLift,
    "start",
    legendLayer
  );

  fallback.hidden = true;
  plot.hidden = false;
} catch (error) {
  document.getElementById("plot").hidden = true;
  document.getElementById("fallback").hidden = false;
}
</script>
</body>
</html>
