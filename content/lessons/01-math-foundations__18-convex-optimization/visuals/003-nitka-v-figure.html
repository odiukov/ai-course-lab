<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Проверка множества натянутой ниткой</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f4ec;
      --panel: #fffdf7;
      --ink: #252a31;
      --muted: #59636f;
      --shape: #9dd5c2;
      --shape-edge: #276d61;
      --thread-ok: #176b58;
      --thread-bad: #bf3e45;
      --pin: #173f66;
      --pin-core: #fffdf7;
      --leader: #77828e;
      --hole-edge: #92545a;
      --status-ok: #e1f3eb;
      --status-bad: #fae4e4;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #171b20;
        --panel: #20262d;
        --ink: #f1f4f6;
        --muted: #bac3cb;
        --shape: #397d70;
        --shape-edge: #8ed4c2;
        --thread-ok: #b5f0dc;
        --thread-bad: #ff8d93;
        --pin: #9fcfff;
        --pin-core: #20262d;
        --leader: #9faab4;
        --hole-edge: #ff9da2;
        --status-ok: #253f38;
        --status-bad: #4b292d;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    main {
      background: var(--panel);
    }

    h1 {
      font-size: 22px;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-width: 960px;
      max-height: 430px;
      margin-inline: auto;
      background: var(--panel);
    }

    .shape {
      fill: var(--shape);
      stroke: var(--shape-edge);
      stroke-width: 4px;
    }

    .hole {
      fill: var(--panel);
      stroke: var(--hole-edge);
      stroke-width: 3px;
    }

    .thread-ok {
      fill: none;
      stroke: var(--thread-ok);
      stroke-width: 7px;
      stroke-linecap: round;
    }

    .thread-base {
      fill: none;
      stroke: var(--ink);
      stroke-width: 7px;
      stroke-linecap: round;
    }

    .thread-outside {
      fill: none;
      stroke: var(--thread-bad);
      stroke-width: 9px;
      stroke-linecap: round;
    }

    .pin-halo {
      fill: var(--panel);
      stroke: var(--pin);
      stroke-width: 3px;
    }

    .pin-core {
      fill: var(--pin);
      stroke: var(--pin-core);
      stroke-width: 2px;
    }

    .leader {
      fill: none;
      stroke: var(--leader);
      stroke-width: 2px;
      stroke-linecap: round;
    }

    .label {
      fill: var(--ink);
      font-size: 18px;
      font-weight: 650;
    }

    .note {
      fill: var(--muted);
      font-size: 16px;
    }

    .ok {
      fill: var(--thread-ok);
      font-size: 17px;
      font-weight: 700;
    }

    .bad {
      fill: var(--thread-bad);
      font-size: 17px;
      font-weight: 700;
    }

    .badge-ok {
      fill: var(--status-ok);
      stroke: var(--thread-ok);
      stroke-width: 2px;
    }

    .badge-bad {
      fill: var(--status-bad);
      stroke: var(--thread-bad);
      stroke-width: 2px;
    }

    #message {
      color: var(--thread-bad);
      font-size: 18px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main aria-labelledby="diagram-heading">
    <h1 id="diagram-heading">Проверка множества натянутой ниткой</h1>

    <svg
      id="diagram"
      viewBox="0 0 960 430"
      width="960"
      height="430"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description"
    >
      <title id="svg-title">Сравнение круга и кольца с натянутой нитью</title>
      <desc id="svg-description">
        В круге отрезок между двумя отмеченными точками целиком лежит внутри
        закрашенной области. В кольце отрезок между двумя внутренними точками
        пересекает белую дырку и выходит из множества.
      </desc>
    </svg>

    <p id="message" hidden>
      Схема должна была показать круг и кольцо: в круге нить между двумя
      булавками целиком остаётся внутри, а в кольце проходит через белую дырку.
    </p>

    <noscript>
      Схема должна была показать круг и кольцо: в круге нить между двумя
      булавками целиком остаётся внутри, а в кольце проходит через белую дырку.
    </noscript>
  </main>

  <script>
    const data = [
      {
        kind: "constants",
        zero: 0,
        pinHaloRadius: 0.22,
        pinCoreRadius: 0.11,
        badgeRadius: 0.2
      },
      {
        kind: "circle",
        center: { x: -5.1, y: 0.35 },
        radius: 2.45,
        pins: [
          { x: -6.75, y: -0.55 },
          { x: -3.65, y: 1.05 }
        ]
      },
      {
        kind: "annulus",
        center: { x: 4.65, y: 0.35 },
        outerRadius: 2.45,
        innerRadius: 1.08,
        pins: [
          { x: 2.75, y: 0.35 },
          { x: 6.55, y: 0.35 }
        ],
        outside: [
          { x: 3.57, y: 0.35 },
          { x: 5.73, y: 0.35 }
        ]
      },
      {
        kind: "leader",
        from: { x: -6.75, y: -0.55 },
        to: { x: -8.25, y: -1.75 }
      },
      {
        kind: "leader",
        from: { x: -5.2, y: 0.25 },
        to: { x: -6.35, y: 2.95 }
      },
      {
        kind: "leader",
        from: { x: 4.65, y: 0.35 },
        to: { x: 5.9, y: 2.95 }
      },
      {
        kind: "text",
        role: "label",
        value: "Круг",
        anchor: { x: -5.1, y: 3.25 },
        dx: 0,
        dy: 0,
        align: "middle"
      },
      {
        kind: "text",
        role: "label",
        value: "Кольцо",
        anchor: { x: 4.65, y: 3.25 },
        dx: 0,
        dy: 0,
        align: "middle"
      },
      {
        kind: "text",
        role: "note",
        value: "булавки внутри",
        anchor: { x: -8.25, y: -1.75 },
        dx: -8,
        dy: 6,
        align: "end"
      },
      {
        kind: "text",
        role: "note",
        value: "вся нить на закрашенной области",
        anchor: { x: -6.35, y: 2.95 },
        dx: 0,
        dy: -10,
        align: "middle"
      },
      {
        kind: "text",
        role: "note",
        value: "белая дырка",
        anchor: { x: 5.9, y: 2.95 },
        dx: 8,
        dy: -10,
        align: "start"
      },
      {
        kind: "badge",
        role: "badge-ok",
        center: { x: -8.55, y: -3.05 },
        radius: 0.22
      },
      {
        kind: "text",
        role: "ok",
        value: "Нить целиком внутри",
        anchor: { x: -8.15, y: -3.05 },
        dx: 5,
        dy: 6,
        align: "start"
      },
      {
        kind: "badge",
        role: "badge-bad",
        center: { x: 1.45, y: -3.05 },
        radius: 0.22
      },
      {
        kind: "text",
        role: "bad",
        value: "Середина нити вышла из множества",
        anchor: { x: 1.85, y: -3.05 },
        dx: 5,
        dy: 6,
        align: "start"
      }
    ];

    const origin = { x: 480, y: 205 };
    const scale = 42;

    const sx = (x) => origin.x + x * scale;
    const sy = (y) => origin.y - y * scale;

    try {
      const svg = document.getElementById("diagram");
      const message = document.getElementById("message");
      const namespace = "http://www.w3.org/2000/svg";
      const constants = data.find((item) => item.kind === "constants");
      const circleData = data.find((item) => item.kind === "circle");
      const ringData = data.find((item) => item.kind === "annulus");

      if (!svg || !message || !constants || !circleData || !ringData) {
        throw new Error("Недостаточно данных для построения схемы");
      }

      const element = (name, attributes, className) => {
        const node = document.createElementNS(namespace, name);

        for (const [key, value] of Object.entries(attributes)) {
          node.setAttribute(key, String(value));
        }

        if (className) {
          node.setAttribute("class", className);
        }

        return node;
      };

      const addCircle = (group, point, radius, className) => {
        group.appendChild(
          element(
            "circle",
            {
              cx: sx(point.x),
              cy: sy(point.y),
              r: sx(radius) - sx(constants.zero)
            },
            className
          )
        );
      };

      const addLine = (group, start, end, className) => {
        group.appendChild(
          element(
            "line",
            {
              x1: sx(start.x),
              y1: sy(start.y),
              x2: sx(end.x),
              y2: sy(end.y)
            },
            className
          )
        );
      };

      const addPin = (group, point) => {
        addCircle(
          group,
          point,
          constants.pinHaloRadius,
          "pin-halo"
        );
        addCircle(
          group,
          point,
          constants.pinCoreRadius,
          "pin-core"
        );
      };

      const shapes = element("g", { "aria-hidden": "true" });
      const threads = element("g", { "aria-hidden": "true" });
      const annotations = element("g", { "aria-hidden": "true" });

      addCircle(
        shapes,
        circleData.center,
        circleData.radius,
        "shape"
      );

      addCircle(
        shapes,
        ringData.center,
        ringData.outerRadius,
        "shape"
      );

      addCircle(
        shapes,
        ringData.center,
        ringData.innerRadius,
        "hole"
      );

      addLine(
        threads,
        circleData.pins[constants.zero],
        circleData.pins[circleData.pins.length - constants.pinCoreRadius / constants.pinCoreRadius],
        "thread-ok"
      );

      addLine(
        threads,
        ringData.pins[constants.zero],
        ringData.pins[ringData.pins.length - constants.pinCoreRadius / constants.pinCoreRadius],
        "thread-base"
      );

      addLine(
        threads,
        ringData.outside[constants.zero],
        ringData.outside[ringData.outside.length - constants.pinCoreRadius / constants.pinCoreRadius],
        "thread-outside"
      );

      for (const pin of circleData.pins) {
        addPin(threads, pin);
      }

      for (const pin of ringData.pins) {
        addPin(threads, pin);
      }

      for (const item of data.filter((entry) => entry.kind === "leader")) {
        addLine(annotations, item.from, item.to, "leader");
      }

      for (const item of data.filter((entry) => entry.kind === "badge")) {
        addCircle(
          annotations,
          item.center,
          item.radius,
          item.role
        );
      }

      for (const item of data.filter((entry) => entry.kind === "text")) {
        const text = element(
          "text",
          {
            x: sx(item.anchor.x),
            y: sy(item.anchor.y),
            dx: item.dx,
            dy: item.dy,
            "text-anchor": item.align
          },
          item.role
        );

        text.textContent = item.value;
        annotations.appendChild(text);
      }

      svg.appendChild(shapes);
      svg.appendChild(threads);
      svg.appendChild(annotations);
    } catch (error) {
      const svg = document.getElementById("diagram");
      const message = document.getElementById("message");

      if (svg) {
        svg.setAttribute("hidden", "");
      }

      if (message) {
        message.removeAttribute("hidden");
      }
    }
  </script>
</body>
</html>
