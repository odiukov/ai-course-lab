- concept: невозможность выхода обычного градиентного спуска из строгого локального минимума
  question: Объясни своими словами, почему обычный детерминированный градиентный спуск не покидает строгий локальный минимум невыпуклой функции, даже если существует лучший глобальный минимум.
  explanation: Более глубокий минимум может быть отделён областью, где значение функции сначала возрастает. Локальная информация о градиенте не показывает путь через такой барьер.
  kind: open
  reference: В локальном минимуме градиент равен нулю, поэтому алгоритм не получает направления для шага вниз. Чтобы попасть в более глубокую область, может потребоваться сначала увеличить значение функции, чего обычный градиентный спуск не делает.
