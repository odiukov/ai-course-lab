- concept: градиентный спуск зигзагит в вытянутой долине из-за доминирования градиента в направлении большой кривизны
  question: Гладкая квадратичная функция имеет сильно вытянутые эллиптические линии уровня. Почему траектория градиентного спуска может многократно пересекать долину вместо прямого движения к минимуму?
  explanation: В крутом поперечном направлении небольшое отклонение создаёт большую компоненту градиента. Шаг переносит точку на другой склон, где эта компонента меняет знак, поэтому следующие обновления попеременно направлены в разные стороны.
  kind: choice
  options:
    - Гессиан такой функции обязательно имеет отрицательное собственное значение
    - Градиент всегда направлен вдоль длинной оси эллипса
    - После пересечения долины градиент перестаёт зависеть от координат
    - Компонента градиента в направлении большой кривизны доминирует, а после пересечения долины меняет знак
  correct: 3
  id: 034-newton-vs-gd-1
  fingerprint: 7b379e6d
- concept: максимальный собственный показатель кривизны ограничивает устойчивый фиксированный шаг градиентного спуска
  question: Гессиан положительно определённой квадратичной функции имеет собственные значения 8 и 3. Чему равна верхняя граница постоянного learning rate, при которой градиентный спуск может сходиться по всем главным направлениям?
  explanation: В направлении с собственным значением λ ошибка умножается на 1 − ηλ. Для сходимости требуется |1 − ηλ| < 1, поэтому η < 2/λ_max = 2/8 = 0.25. Равенство границе уже не даёт затухания ошибки, так что learning rate должен быть строго меньше.
  kind: numeric
  answer: 0.25
  tolerance: 0.004
  id: 034-newton-vs-gd-2
  fingerprint: 609520dd
