- concept: знаки и модули собственных значений гессиана характеризуют кривизну в главных направлениях
  question: В стационарной точке собственные значения гессиана равны +8 и −6. Как правильно описать поверхность вблизи этой точки?
  explanation: 'Разные знаки собственных значений означают седловую форму. Знак задаёт направление изгиба, а модуль — его силу: положительное значение имеет больший модуль.'
  kind: choice
  options:
    - Она изгибается вверх во всех направлениях
    - Она изгибается вниз во всех направлениях
    - Это седловая точка; изгиб вверх в соответствующем главном направлении сильнее изгиба вниз
    - Она плоская в одном из главных направлений
  correct: 2
  id: 015-eigenvalues-curvature-1
  fingerprint: 3bf5d6d7
- concept: положительная полуопределённость гессиана должна выполняться во всей области для вывода о выпуклости функции
  question: В одной точке все собственные значения гессиана неотрицательны. Достаточно ли этого, чтобы объявить функцию выпуклой на всей области? Объясни своими словами.
  explanation: Гессиан является локальной характеристикой. Неотрицательные собственные значения в одной точке не исключают отрицательной кривизны в другой.
  kind: open
  reference: Нет. Это описывает кривизну только в выбранной точке. Для вывода о выпуклости дважды дифференцируемой функции гессиан должен быть положительно полуопределён во всех точках рассматриваемой области.
  id: 015-eigenvalues-curvature-2
  fingerprint: 80402de7
