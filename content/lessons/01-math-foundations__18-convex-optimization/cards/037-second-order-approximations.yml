- concept: L-BFGS восстанавливает информацию о кривизне из изменений параметров и градиента
  question: Заполните формулу для пары разностей, которую L-BFGS сохраняет в истории.
  explanation: Вектор s описывает изменение параметров, а y — соответствующее изменение градиента. По нескольким последним парам (s, y) L-BFGS приближает действие обратного гессиана, не сохраняя полный гессиан.
  kind: cloze
  template: s = θ_new − θ_old,  y = ___
  answer: ∇f(θ_new) − ∇f(θ_old)
  accept:
    - grad f(θ_new) − grad f(θ_old)
    - градиент в новой точке минус градиент в старой точке
  id: 037-second-order-approximations-1
  fingerprint: 99f23a09
- concept: natural gradient измеряет шаг по изменению вероятностного распределения с помощью матрицы Фишера
  question: Два изменения параметров имеют одинаковую евклидову длину, но одно почти не меняет распределение предсказаний, а другое меняет его сильно. Какая матрица позволяет natural gradient учитывать это различие?
  explanation: Матрица Фишера задаёт локальную геометрию семейства вероятностных распределений. Natural gradient применяет обратную к ней метрику к градиенту, поэтому масштаб шага определяется изменением распределения, а не только координат параметров.
  kind: choice
  options:
    - Единичная матрица
    - Матрица информации Фишера
    - Матрица попарных расстояний между объектами
    - Матрица перестановки параметров
  correct: 1
  id: 037-second-order-approximations-2
  fingerprint: e5e25c3c
- concept: Hessian-free метод приближённо решает систему с гессианом через произведения гессиана на вектор
  question: Расположите действия матрично-свободного вычисления направления второго порядка в правильном порядке.
  explanation: Сопряжённые градиенты строят приближённое решение, многократно запрашивая произведения гессиана на выбранные векторы. Поэтому Hessian-free оптимизация использует кривизну, хотя сам гессиан целиком не формируется и не хранится.
  kind: order
  items:
    - Вычислить градиент целевой функции в текущей точке
    - Задать оператор, вычисляющий произведение гессиана на произвольный вектор с помощью автоматического дифференцирования
    - Запустить метод сопряжённых градиентов для приближённого решения линейной системы
    - Использовать найденное решение как направление, скорректированное с учётом кривизны
  id: 037-second-order-approximations-3
  fingerprint: dfe25465
