- concept: смешанные знаки собственных значений гессиана распознают седловую точку
  question: В стационарной точке гессиан имеет собственные значения разных знаков. Объясни своими словами, почему эту точку относят к седловым.
  explanation: Положительное собственное значение задаёт направление изгиба вверх, а отрицательное — направление изгиба вниз. Такое сочетание является признаком седла.
  kind: open
  reference: В одном главном направлении функция загибается вверх, а в другом — вниз. Поэтому точка не является ни локальным минимумом, ни локальным максимумом.
