- concept: вычисление гессиана квадратичной функции по чистым и смешанным вторым производным
  question: Дана функция g(u, v) = 5u·u + 7uv + 11v·v. Каков её гессиан?
  explanation: Повторное дифференцирование по u даёт 10, по v — 22, а смешанные производные равны 7. Чистые производные стоят на диагонали, смешанные — вне диагонали.
  kind: choice
  options:
    - '[[5, 7], [7, 11]]'
    - '[[10, 7], [7, 22]]'
    - '[[10, 14], [14, 22]]'
  correct: 1
  id: 013-hessian-construction-1
  fingerprint: cf2d58ab
- concept: гессиан квадратичной функции с постоянными коэффициентами не зависит от точки
  question: Почему гессиан квадратичной функции переменных x и y с постоянными коэффициентами одинаков во всех точках?
  explanation: Элементы гессиана — вторые частные производные. У квадратичной функции повторное дифференцирование устраняет зависимость от переменных, поэтому гессиан получается постоянной матрицей.
  kind: open
  reference: После первого дифференцирования квадратичные члены становятся линейными, а после следующего — постоянными. Поэтому каждый элемент гессиана постоянен и не зависит от значений x и y.
  id: 013-hessian-construction-2
  fingerprint: f43af136
