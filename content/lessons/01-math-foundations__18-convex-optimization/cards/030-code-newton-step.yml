- concept: явная формула обратной матрицы через определитель
  question: Заполни формулу решения системы с невырожденной матрицей.
  explanation: Обратную матрицу получают перестановкой диагональных элементов, сменой знаков у внедиагональных элементов и делением на определитель.
  kind: cloze
  template: Если H = [[a, b], [c, d]], то решение H delta = g имеет вид delta = ___ * g.
  answer: '[[d, -b], [-c, a]] / (a*d - b*c)'
  accept:
    - '[[d,-b],[-c,a]]/(a*d-b*c)'
    - adj(H) / det(H)
  id: 030-code-newton-step-1
  fingerprint: 12e549fa
- concept: ньютоновская поправка инвариантна к ненулевому масштабированию целевой функции
  question: Целевую функцию f заменили на c·f, где c — ненулевая константа. Как изменится ньютоновская поправка в той же точке при точном вычислении производных?
  explanation: И градиент, и гессиан умножаются на c. В системе cH·delta = c·g общий множитель сокращается, поэтому delta остаётся прежней.
  kind: choice
  options:
    - Не изменится
    - Умножится на c
    - Разделится на c
    - Обязательно сменит направление
  correct: 0
  id: 030-code-newton-step-2
  fingerprint: f9456bc1
- concept: градиент и гессиан образуют локальную квадратичную модель в одной точке
  question: Почему при вычислении ньютоновской поправки градиент и гессиан нужно брать в одной и той же текущей точке?
  explanation: Шаг Ньютона строится по согласованной локальной модели функции. Смешивание производных из разных точек лишает решение системы этого смысла.
  kind: open
  reference: Они описывают наклон и кривизну одной локальной квадратичной модели. Если вычислить их в разных точках, система смешает характеристики разных локальных моделей, и полученная поправка уже не будет корректным шагом Ньютона.
  id: 030-code-newton-step-3
  fingerprint: ebd4f28e
