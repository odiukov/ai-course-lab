- concept: квадратичная сходимость метода Ньютона является локальной скоростью уменьшения ошибки
  question: Что означает квадратичная сходимость метода Ньютона вблизи невырожденного минимума?
  explanation: 'Вблизи минимума выполняется оценка вида e_{k+1} ≈ C·e_k², поэтому число верных знаков быстро растёт. Это локальное свойство: оно не гарантирует успешный полный шаг вдали от минимума.'
  kind: choice
  options:
    - Ошибка следующей итерации примерно пропорциональна квадрату текущей ошибки
    - Ошибка уменьшается на одну и ту же величину на каждой итерации
    - Метод всегда находит минимум за один шаг для любой гладкой функции
    - Метод гарантированно сходится к глобальному минимуму из любой начальной точки
