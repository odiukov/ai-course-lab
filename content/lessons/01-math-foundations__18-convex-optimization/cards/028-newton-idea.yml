- concept: в одномерном методе Ньютона поправка равна отношению первой производной ко второй
  question: В текущей точке производная функции равна 42, а вторая производная равна 6. Какую поправку метод Ньютона вычтет из текущего значения x?
  explanation: В одном измерении поправка равна f'(x) / f''(x). Поэтому 42 / 6 = 7, а обновление имеет вид x_new = x - 7.
  kind: numeric
  answer: 7
  tolerance: 0.001
  id: 028-newton-idea-1
  fingerprint: bf75ecb1
- concept: обратный гессиан настраивает масштаб и направление шага отдельно для разных направлений кривизны
  question: Почему многомерный шаг Ньютона в общем случае нельзя воспроизвести одним скалярным learning rate?
  explanation: Скалярный learning rate одинаково умножает все компоненты градиента. Матрица H^{-1} учитывает неодинаковую кривизну по направлениям, поэтому способна не только изменить длину шага, но и повернуть его.
  kind: choice
  options:
    - Градиент не содержит информации о направлении движения
    - Обратный гессиан по-разному масштабирует компоненты градиента и может изменить направление поправки
    - Скалярный learning rate применим только к функциям одной переменной
    - Гессиан заменяет градиент, поэтому направление шага определяется только вторыми производными
  correct: 1
  id: 028-newton-idea-2
  fingerprint: ce85e0a1
