- concept: произведение неизвестных матриц создаёт невыпуклость матричной факторизации
  question: Заполни типичную формулу предсказания в матричной факторизации, показывающую источник невыпуклости.
  explanation: 'Обе матрицы оптимизируются, а предсказание зависит от их произведения. Такая зависимость билинейна: при фиксированной матрице задача по другой может быть выпуклой, но совместная оптимизация по U и V в общем случае невыпукла.'
