- concept: нелинейные активации скрытых слоёв делают зависимость потерь от весов нейросети невыпуклой
  question: Почему скрытый слой с нелинейной активацией обычно лишает обучение нейросети гарантии выпуклой оптимизации по весам?
  explanation: В линейной модели предсказание аффинно зависит от весов. Нелинейные скрытые слои создают взаимодействия параметров и смену режимов активации, поэтому функция потерь по весам обычно имеет невыпуклый ландшафт.
  kind: open
  reference: Предсказание нелинейно зависит от параметров связанных слоёв, а при изменении весов могут меняться наборы активных нейронов. Поэтому между удачными наборами весов могут находиться параметры с большей потерей.
  id: 026-nonconvex-ml-1
  fingerprint: 77a30ccd
- concept: дискретные назначения точек кластерам являются источником невыпуклости k-means
  question: Что именно нарушает выпуклость стандартной задачи k-means при совместной оптимизации?
  explanation: При фиксированных назначениях минимизация суммы квадратов расстояний по центрам выпукла. Но смена ближайшего центра дискретно меняет назначение точки, поэтому совместная задача распадается на области с разными конфигурациями и становится невыпуклой.
  kind: choice
  options:
    - Каждая точка дискретно назначается одному из кластеров
    - Квадрат евклидова расстояния является вогнутой функцией
    - Среднее арифметическое определено только для скаляров
    - Центры кластеров обязаны иметь целочисленные координаты
