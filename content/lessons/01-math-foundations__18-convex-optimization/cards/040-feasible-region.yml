- concept: допустимый свободный минимум остаётся решением задачи с ограничениями
  question: Свободный глобальный минимум функции принадлежит допустимой области. Что можно заключить о минимуме этой функции при заданном ограничении?
  explanation: Свободный глобальный минимум не хуже любой другой точки функции. Если ограничение его не исключает, среди допустимых точек также не может существовать точка с меньшим значением.
  kind: open
  reference: Свободный минимум является также лучшим допустимым минимумом, а оптимальные значения функции в обеих задачах совпадают.
  id: 040-feasible-region-2
  fingerprint: b8760ba3
