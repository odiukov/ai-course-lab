- concept: допустимая точка должна одновременно удовлетворять каждому ограничению задачи
  question: Точка удовлетворяет всем ограничениям задачи оптимизации, кроме одного. Принадлежит ли она допустимой области?
  explanation: Допустимая область является пересечением областей, разрешённых отдельными ограничениями. Поэтому каждая её точка обязана удовлетворять всем условиям одновременно.
  kind: choice
  options:
    - Нет, нарушение любого ограничения делает точку недопустимой
    - Да, если целевая функция в этой точке достаточно мала
    - Да, если выполнено большинство ограничений
  correct: 0
  id: 039-constrained-problem-1
  fingerprint: 4fb68940
- concept: ограничения сужают множество решений, среди которых минимизируется целевая функция
  question: Объясни своими словами, чем минимум задачи с ограничениями может отличаться от минимума той же целевой функции без ограничений.
  explanation: Ограничения не заменяют целевую функцию, а сужают область поиска. Если свободный минимум лежит внутри допустимой области, решения совпадут; если вне её, constrained-оптимум будет другим.
  kind: open
  reference: Без ограничений минимум ищут во всём пространстве решений. В задаче с ограничениями рассматривают только допустимую область, поэтому свободный минимум может оказаться недопустимым, а оптимумом станет лучшая разрешённая точка.
  id: 039-constrained-problem-2
  fingerprint: 537faa9d
