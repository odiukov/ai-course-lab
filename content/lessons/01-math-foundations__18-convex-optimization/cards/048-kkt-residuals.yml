- concept: положительная часть превращает ограничение-неравенство в одностороннюю величину нарушения
  question: Какой агрегат измеряет нарушение ограничений g_i(x) ≤ 0, не штрафуя допустимые отрицательные значения g_i(x)?
  explanation: Положительная часть [g_i(x)]_+ обнуляет допустимые неположительные значения и сохраняет только выход за границу. Максимум выделяет наиболее сильно нарушенное ограничение.
  kind: choice
  options:
    - max_i |g_i(x)|
    - max_i [-g_i(x)]_+
    - max_i [g_i(x)]_+
    - max_i λ_i g_i(x)
  correct: 2
  id: 048-kkt-residuals-1
  fingerprint: 18a635b6
- concept: нарушение дополняющей нежёсткости измеряется максимальным модулем произведения множителя на значение ограничения
  question: Для трёх ограничений λ = (0.5, 1.2, 0.3), а g(x) = (-0.7, 0.06, -0.11). Чему равен остаток дополняющей нежёсткости max_i |λ_i g_i(x)|?
  explanation: Модули произведений равны 0.35, 0.072 и 0.033. Наибольшее из них — 0.35, поэтому именно оно задаёт остаток дополняющей нежёсткости.
  kind: numeric
  answer: 0.35
  tolerance: 0.00001
  id: 048-kkt-residuals-2
  fingerprint: a1cd294f
- concept: максимум остатков служит общим критерием приемки, а отдельные остатки сохраняют причину нарушения KKT
  question: Объясни своими словами, зачем при проверке численного решения сохранять все остатки KKT, даже если для сравнения с допуском используется только их максимум.
  explanation: Общий максимум отвечает на вопрос о приемлемости решения, но набор отдельных остатков показывает источник ошибки и помогает понять, что именно решателю ещё не удалось выполнить.
  kind: open
  reference: 'Максимум позволяет одним числом проверить, укладываются ли одновременно все условия в допуск. Однако он не сообщает, какое именно условие нарушено, поэтому отдельные остатки нужны для диагностики: они различают проблемы стационарности, прямой и двойственной допустимости и дополняющей нежёсткости.'
  id: 048-kkt-residuals-3
  fingerprint: 8cc4920e
