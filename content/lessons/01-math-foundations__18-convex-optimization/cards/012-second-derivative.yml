- concept: глобальный признак выпуклости через знак второй производной на интервале
  question: Какое условие гарантирует выпуклость дважды дифференцируемой функции на всём рассматриваемом интервале?
  explanation: Неотрицательная вторая производная означает, что наклон функции нигде не убывает. Именно это даёт выпуклость на всём интервале; проверки отдельной точки недостаточно.
  kind: choice
  options:
    - Вторая производная неотрицательна в каждой точке интервала
    - Вторая производная положительна хотя бы в одной точке интервала
    - Первая производная неотрицательна в каждой точке интервала
    - Значения функции неотрицательны на всём интервале
  correct: 0
  id: 012-second-derivative-1
  fingerprint: a123cbc1
- concept: выпуклость функции зависит от рассматриваемого интервала
  question: Объясни, почему функция f(x) = x^7 выпукла на [4, +∞), но не выпукла на всей числовой прямой.
  explanation: Знак второй производной нужно проверять на всей выбранной области. У одной и той же функции он может подходить для ограниченного интервала и меняться на более широкой области.
  kind: open
  reference: Её вторая производная равна 42x^5. На [4, +∞) она положительна, поэтому функция там выпукла. При отрицательных x вторая производная отрицательна, поэтому условие выпуклости на всей числовой прямой нарушается.
  id: 012-second-derivative-2
  fingerprint: cf9f4dc7
