- concept: вырожденный гессиан не позволяет однозначно определить ньютоновскую поправку
  question: Объясни своими словами, почему при вырожденном гессиане система HΔ=g может не задавать единственный шаг Ньютона.
  explanation: Методу Ньютона нужна однозначная поправка из системы HΔ=g. Именно поэтому реализация проверяет определитель гессиана и прекращает вычисления, если он слишком близок к нулю.
  kind: open
  reference: У вырожденной матрицы нет обратной, поэтому система может не иметь решений либо иметь несколько решений. Следовательно, единственная поправка Δ не определена.
