- concept: стационарность лагранжиана по множителю восстанавливает исходное равенство
  question: Для лагранжиана L(z, μ) = h(z) + μq(z) какое условие следует из стационарности по μ?
  explanation: Частная производная лагранжиана по μ равна q(z). Поэтому условие стационарности по множителю требует, чтобы q(z) обращалось в нуль, то есть возвращает исходное ограничение.
  kind: choice
  options:
    - q(z) должно быть равно нулю
    - μ должно быть равно нулю
    - h(z) должно быть равно q(z)
    - q(z) должно достигать собственного минимума
