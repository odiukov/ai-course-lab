- concept: условие первого порядка для минимума с гладким ограничением-равенством
  question: Рассматривается гладкая задача минимизации f(x) при условии g(x) = 0. В допустимой точке x* градиент ограничения ненулевой. Какое соотношение должно выполняться для кандидата на условный минимум?
  explanation: Допустимые направления касательны к поверхности g(x) = 0. В условном минимуме у ∇f не должно быть составляющей вдоль этих направлений, поэтому ∇f направлен по нормали и параллелен ∇g. Множитель λ учитывает масштаб и противоположное направление градиентов.
  kind: choice
  options:
    - ∇f(x*) = 0 независимо от ограничения
    - ∇f(x*) + λ∇g(x*) = 0 для некоторого λ
    - ∇f(x*) перпендикулярен ∇g(x*)
    - ∇f(x*) = ∇g(x*) при любом масштабе функций
  correct: 1
  id: 042-parallel-gradients-1
  fingerprint: 0438066c
- concept: параллельность градиентов является необходимым, но не достаточным признаком условного минимума
  question: В допустимой точке градиент целевой функции параллелен градиенту ограничения. Какой вывод можно сделать только из этого факта?
  explanation: Параллельность градиентов выражает условие стационарности первого порядка. Она исключает локальное убывание вдоль допустимых направлений, но не различает минимум и максимум; для этого нужны дополнительные сведения о кривизне или значениях функции.
  kind: choice
  options:
    - Точка обязательно является глобальным минимумом
    - Точка является кандидатом и может оказаться минимумом, максимумом или иной стационарной точкой
    - Ограничение не влияет на решение
    - Целевая функция постоянна на всём допустимом множестве
  correct: 1
  id: 042-parallel-gradients-2
  fingerprint: c96f9c47
