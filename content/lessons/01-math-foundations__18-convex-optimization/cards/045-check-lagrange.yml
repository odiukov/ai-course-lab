- concept: отрицательный скалярный множитель сохраняет параллельность векторов и меняет только их направление
  question: Как расположены векторы u = (6, -8) и v = (-15, 20)?
  explanation: Выполняется v = -2,5u. Поэтому векторы параллельны, а отрицательный коэффициент означает, что они направлены в противоположные стороны.
  kind: choice
  options:
