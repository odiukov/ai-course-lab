- concept: прямая допустимость проверяет ограничения на переменные, а двойственная — знаки множителей
  question: Для некоторого ограничения значение g_j(x) положительно, хотя соответствующий множитель неотрицателен. Какое условие KKT точно нарушено?
  explanation: Ограничение требует неположительного значения g_j(x). Его положительное значение означает, что сама точка недопустима, поэтому нарушена прямая допустимость. Знак множителя относится к двойственной допустимости.
  kind: choice
  options:
    - Прямая допустимость
    - Двойственная допустимость
    - Стационарность
    - Из неотрицательности множителя нарушение определить нельзя
  correct: 0
  id: 046-kkt-four-conditions-2
  fingerprint: 065486fc
- concept: стационарность KKT уравновешивает градиент цели взвешенной суммой градиентов ограничений
  question: Объясните своими словами геометрический смысл условия стационарности KKT при нескольких ограничениях-неравенствах.
  explanation: Стационарность означает, что в точке-кандидате действие цели компенсируется совместным действием ограничений. Поэтому градиент цели равен противоположно направленной линейной комбинации их градиентов.
  kind: open
  reference: 'Градиент целевой функции должен быть уравновешен взвешенной суммой градиентов ограничений: вместе они дают нулевой вектор. Весами служат множители Лагранжа.'
  id: 046-kkt-four-conditions-3
  fingerprint: 081608c3
