- concept: параметр выпуклой комбинации можно восстановить по положению точки между концами отрезка
  question: На числовой прямой x = 6, y = 21. Точка z = 15 задана выпуклой комбинацией, в которой вес x равен t. Найдите t.
  explanation: Расстояние от y = 21 до z = 15 равно 6, а весь путь от y = 21 до x = 6 равен 15. Параметр t задаёт пройденную от y к x долю пути, поэтому t = 6/15 = 0,4.
  kind: numeric
  answer: 0.4
  tolerance: 0.01
