- concept: численная проверка положения графика относительно хорды
  question: Для функции f(u) = u·u выбраны точки x = -4 и y = 8. Вес точки x равен 0.75, а вес точки y — 0.25. На сколько высота хорды в полученной промежуточной точке больше значения функции?
  explanation: Промежуточный аргумент равен 0.75·(-4) + 0.25·8 = -1, поэтому значение функции равно 1. Высота хорды равна 0.75·16 + 0.25·64 = 28. Разность составляет 28 − 1 = 27, то есть график находится ниже хорды.
  kind: numeric
  answer: 27
  tolerance: 0.001
  id: 009-convex-function-1
  fingerprint: dad8c900
- concept: для аффинной функции неравенство выпуклости всегда выполняется как равенство
  question: Как располагается хорда относительно графика аффинной функции f(u) = 7u − 3?
  explanation: Аффинная функция изменяется с постоянным наклоном, поэтому интерполяция её значений точно равна значению в интерполированной точке. Следовательно, график совпадает с каждой своей хордой; такая функция одновременно выпукла и вогнута.
  kind: choice
  options:
    - Хорда всегда проходит строго выше графика
    - Хорда проходит выше графика только при положительных аргументах
    - Хорда может пересекать график между выбранными точками
    - Хорда совпадает с графиком на всём отрезке между выбранными точками
  correct: 3
  id: 009-convex-function-2
  fingerprint: 6b8a4001
