- concept: обратимость гессиана сама по себе не гарантирует убывание функции после полного шага Ньютона
  question: Гессиан в текущей точке обратим, и алгоритм делает полный шаг Ньютона без поиска длины шага. Обязательно ли значение функции уменьшится?
  explanation: Обратимый гессиан гарантирует разрешимость системы для ньютоновской поправки, но не убывание функции. Если гессиан не положительно определён, полный шаг может оказаться не направлением спуска.
  kind: choice
  options:
    - Да, обратимость гессиана гарантирует уменьшение функции
    - Нет, обратимость лишь позволяет вычислить поправку; без положительной определённости гессиана направление может не быть направлением спуска
    - Да, если все компоненты градиента ненулевые
    - Нет, полный шаг Ньютона всегда увеличивает функцию
  correct: 1
  id: 033-code-newton-minimize-1
  fingerprint: cdef1e89
- concept: порог для суммы квадратов градиента соответствует корню из порога для его евклидовой нормы
  question: Алгоритм останавливается, когда сумма квадратов компонент градиента меньше tol. Как это условие выразить через евклидову норму градиента?
  explanation: 'Условие проверяет квадрат нормы градиента: ||∇f(x)||² < tol. Следовательно, для самой нормы порог равен sqrt(tol); извлекать корень в коде необязательно.'
  kind: open
  reference: Евклидова норма градиента должна быть меньше sqrt(tol), потому что сумма квадратов его компонент равна квадрату этой нормы.
  id: 033-code-newton-minimize-2
  fingerprint: b0c18573
- concept: история метода содержит начальную точку и по одной точке после каждого выполненного обновления
  question: Метод Ньютона выполнил шесть успешных обновлений без досрочной остановки. Сколько точек находится в history, если начальная точка тоже сохраняется?
  explanation: В историю сначала добавляется начальная точка, а затем результат каждого из шести обновлений. Поэтому всего сохраняется семь точек.
  kind: numeric
  answer: 7
  tolerance: 0.001
