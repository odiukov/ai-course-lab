- concept: прямой и двойственный допустимые результаты образуют сертификат качества через зазор двойственности
  question: Дана допустимая точка x̂ прямой задачи и двойственно допустимый множитель λ̂. Объясните, как по f(x̂) и d(λ̂) оценить качество найденного решения и что доказывает совпадение этих величин.
  explanation: Оптимум зажат между двойственной нижней границей и стоимостью допустимого прямого решения. Чем меньше зазор, тем точнее сертификат; совпадение границ доказывает оптимальность.
  kind: open
  reference: Значение d(λ̂) является нижней границей оптимума, а f(x̂) — верхней, поскольку x̂ допустима. Их разность задаёт зазор двойственности. Если границы совпали, x̂ является оптимальным решением, а λ̂ — оптимальным двойственным решением.
