- concept: сильная двойственность при выпуклости и условии строгой допустимости
  question: Какое утверждение корректно описывает сильную двойственность для выпуклой задачи с ограничениями-неравенствами?
  explanation: 'Для выпуклой задачи условие строгой допустимости, известное как условие Слейтера, обеспечивает сильную двойственность: лучший двойственный сертификат достигает значения прямого оптимума.'
  kind: choice
  options:
    - Если существует строго допустимая точка, оптимальные значения прямой и двойственной задач совпадают
    - Оптимальные значения совпадают для любой задачи независимо от выпуклости и допустимости
    - Оптимальные значения совпадают только тогда, когда каждое ограничение активно в оптимуме
    - Оптимальное значение двойственной задачи всегда строго выше прямого оптимума
