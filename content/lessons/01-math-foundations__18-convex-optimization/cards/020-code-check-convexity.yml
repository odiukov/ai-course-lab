- concept: каждое случайное испытание проверяющего алгоритма вычисляет функцию в двух концах отрезка и в промежуточной точке
  question: Проверяющий алгоритм выполняет 240 случайных испытаний без досрочного завершения. Сколько раз он вызовет f, если в каждом испытании вычисляет f(mid), f(x) и f(y)?
  explanation: 'На одно испытание приходятся три вызова: в промежуточной точке и в двух концах отрезка. Поэтому 240 × 3 = 720 вызовов.'
