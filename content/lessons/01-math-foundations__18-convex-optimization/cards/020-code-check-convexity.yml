- concept: в обеих сторонах неравенства выпуклости должен использоваться один и тот же коэффициент смешивания
  question: Объясните своими словами, почему при проверке выпуклости нельзя независимо выбирать коэффициенты для промежуточной точки и для смеси значений функции.
  explanation: Коэффициент смешивания связывает аргумент функции с соответствующей точкой на хорде между значениями функции. Разные коэффициенты разрывают эту связь, поэтому результат такой проверки ничего не говорит о выполнении определения выпуклости.
  kind: open
  reference: Обе стороны сравнения должны относиться к одной и той же точке отрезка. Коэффициент, задающий положение этой точки между x и y, обязан с теми же весами смешивать f(x) и f(y); иначе проверяется другое неравенство, не являющееся условием выпуклости.
