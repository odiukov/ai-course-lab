- concept: избыточные параметры создают направления, вдоль которых потеря почти не меняется
  question: Почему в избыточно параметризованной нейросети заметное изменение весов иногда почти не изменяет функцию потерь?
  explanation: Потеря определяется поведением модели, а не уникальностью набора весов. Если перераспределение вклада между параметрами сохраняет предсказания, оно создаёт плоское направление и расширяет область хороших решений.
  kind: open
  reference: Разные параметры могут компенсировать изменения друг друга и сохранять почти ту же функцию сети. Поэтому в пространстве параметров возникают протяжённые направления с почти постоянной потерей.
  id: 058-overparameterization-1
  fingerprint: 566935ac
- concept: связность решений путём с низкой потерей не означает выпуклость функции потерь
  question: Два хороших набора параметров нейросети соединены непрерывным изогнутым путём, на котором потеря остаётся низкой. Какой вывод корректен?
  explanation: Низкопотерянный путь показывает связность хороших решений. Для выпуклости требуется соответствующее свойство именно для прямого отрезка между любыми точками, поэтому существования изогнутого пути недостаточно.
  kind: choice
  options:
    - Функция потерь обязательно выпукла
    - Оба решения принадлежат одной связной области низкой потери, но выпуклость из этого не следует
    - Прямой отрезок между решениями обязательно имеет низкую потерю
    - Каждый локальный минимум функции потерь является глобальным
  correct: 1
  id: 058-overparameterization-2
  fingerprint: 43767d8d
