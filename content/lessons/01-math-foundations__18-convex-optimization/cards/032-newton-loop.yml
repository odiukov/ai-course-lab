- concept: копирование изменяемых координат сохраняет независимые состояния траектории оптимизации
  question: Алгоритм изменяет список координат x на месте. Как добавить текущую точку в history, чтобы последующие изменения x не переписали уже сохранённое состояние?
  explanation: Метод copy создаёт отдельный список координат. При добавлении самого x история хранит ссылку на изменяемый объект, а дополнительный внешний список не устраняет общую ссылку на x.
  kind: choice
  options:
    - history.append(x.copy())
    - history.append(x)
    - history.append([x])
