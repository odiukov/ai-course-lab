- concept: композиция выпуклых функций сохраняет выпуклость, если внешняя функция не убывает на значениях внутренней
  question: Пусть g(x) = x·x, а h(x) — квадрат значения g(x). Какое рассуждение доказывает выпуклость h?
  explanation: Внутренняя функция g выпукла и принимает только неотрицательные значения. На этой области внешняя функция — возведение в квадрат — выпукла и не убывает, поэтому композиция, равная x·x·x·x, выпукла.
  kind: choice
  options:
    - g выпукла и неотрицательна, а возведение в квадрат выпукло и не убывает на неотрицательных аргументах
    - Произведение любых выпуклых функций всегда выпукло
    - Любая чётная функция выпукла
    - Любая всюду дифференцируемая функция выпукла
  correct: 0
  id: 021-check-gallery-1
  fingerprint: c3e76b91
- concept: ограничение выпуклой функции на любую прямую также должно быть выпуклым
  question: Ограничьте функцию p(u,v) = uv на прямую v = −u. Какая одномерная функция получится?
  explanation: Получается вогнутая парабола. Поскольку ограничение выпуклой функции на любую прямую обязано быть выпуклым, произведение координат не является выпуклой функцией на всей плоскости.
  kind: cloze
  template: p(u,−u) = ___
  answer: −u·u
  accept:
    - -u·u
    - −u*u
    - -u*u
    - −(u·u)
  id: 021-check-gallery-2
  fingerprint: 3cf895e3
- concept: сумма выпуклых функций является выпуклой
  question: Объясни без вычисления гессиана, почему сумма квадратов координат является выпуклой функцией.
  explanation: 'Выпуклость сохраняется при сложении функций: неравенства выпуклости для отдельных слагаемых можно сложить и получить такое же неравенство для их суммы.'
  kind: open
  reference: Квадрат каждой отдельной координаты — выпуклая функция. Сумма выпуклых функций сохраняет выпуклость, поэтому сумма квадратов координат выпукла.
  id: 021-check-gallery-3
