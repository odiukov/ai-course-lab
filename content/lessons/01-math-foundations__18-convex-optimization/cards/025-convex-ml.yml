- concept: hinge loss выпукла как поточечный максимум аффинных функций параметров
  question: Заполните пропуск в обосновании выпуклости hinge loss.
  explanation: Обе ветви — постоянный ноль и выражение 1 − y(wᵀx + b) — аффинны, а значит выпуклы. Поточечный максимум выпуклых функций также выпуклый, поэтому hinge loss задаёт выпуклую задачу по весам и смещению.
  kind: cloze
  template: Для фиксированного объекта L(w,b) = max{0, 1 − y(wᵀx + b)} выпукла, поскольку является поточечным максимумом двух ___ функций параметров.
  answer: аффинных
  accept:
    - аффинных
    - линейных
    - выпуклых
