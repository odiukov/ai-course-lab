- concept: обнуление полного градиента не означает обнуления градиентов отдельных mini-batch
  question: В некоторой точке полный градиент по всей обучающей выборке почти равен нулю, но градиенты отдельных примеров заметны и различаются. Что наиболее вероятно при обучении на случайных mini-batch?
  explanation: Полный градиент может обнулиться из-за взаимной компенсации вкладов примеров. В случайной пачке компенсация обычно другая, поэтому возникает ненулевое обновление. У седла оно может запустить движение по направлению спуска, хотя побег не гарантирован.
  kind: choice
  options:
    - Каждая mini-batch даст почти точно нулевой градиент, поэтому параметры останутся неподвижными
    - Градиенты разных пачек будут флуктуировать, и отдельное обновление может сдвинуть параметры в направление спуска
    - Шум обязательно превратит седловую точку в глобальный минимум
  correct: 1
  id: 059-sgd-noise-1
  fingerprint: 7f82faf5
- concept: шум mini-batch SGD неявно предпочитает плоские минимумы острым
  question: Два решения имеют одинаковый loss на обучающей выборке. Вокруг первого малые изменения параметров резко повышают loss, а вокруг второго loss почти не меняется. Объясните, почему mini-batch SGD чаще удерживается возле второго решения и какой эффект регуляризации это создаёт.
  explanation: Острые минимумы чувствительны к небольшим стохастическим шагам, а плоские содержат широкую область почти равноценных параметров. Поэтому сам шум mini-batch SGD действует как неявная регуляризация в пользу плоских решений.
  kind: open
  reference: Случайные обновления легко выбрасывают параметры из острого минимума, где loss быстро растёт при малом смещении. В плоском минимуме соседние параметры сохраняют низкий loss, поэтому шум реже выводит оптимизацию из этой области. Так процесс обучения без отдельного штрафа неявно предпочитает плоские решения, которые часто лучше обобщаются.
  id: 059-sgd-noise-2
  fingerprint: e4fbbd95
