- concept: увеличение коэффициента регуляризации усиливает предпочтение весов с меньшим размером
  question: Как изменяется компромисс в задаче Loss(w) + λR(w), когда коэффициент λ увеличивают?
  explanation: Коэффициент λ задаёт относительную цену размера весов. Чем он больше, тем сильнее оптимизация предпочитает уменьшить регуляризатор R(w) по сравнению с одной лишь минимизацией исходной ошибки.
  kind: choice
  options:
    - Оптимизация придаёт больший вес уменьшению R(w), даже если ради этого приходится увеличить исходный loss
    - Регуляризатор перестаёт влиять на решение
    - Допустимыми становятся только веса с R(w) = λ
    - Исходный loss автоматически становится равен R(w)
  correct: 0
  id: 051-regularization-constraint-2
  fingerprint: 46d260f5
- concept: эквивалентность ограниченной и штрафной форм регуляризации означает совпадение оптимизаторов при согласованных параметрах
  question: Объясните своими словами, в каком смысле задачи с ограничением R(w) ≤ t и со штрафом Loss(w) + λR(w) могут быть эквивалентны и почему из этого не следует равенство t и λ.
  explanation: Эквивалентность относится к получаемому оптимальному решению, а не к численным значениям параметров. Бюджет ограничивает множество допустимых весов, тогда как штраф меняет целевую функцию.
  kind: open
  reference: 'В выпуклой задаче для подходящего бюджета t можно подобрать силу штрафа λ так, чтобы обе постановки дали один и тот же оптимальный вектор весов. Параметры выполняют разные роли: t задаёт допустимую границу, а λ — цену регуляризатора, поэтому численно равняться они не обязаны.'
  id: 051-regularization-constraint-3
  fingerprint: 62eab06f
