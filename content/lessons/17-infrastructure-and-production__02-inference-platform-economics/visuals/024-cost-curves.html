<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Как разные тарифы становятся сравнимыми</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f8fafc;
      --surface: #ffffff;
      --surface-soft: #f1f5f9;
      --surface-common: #eef6ff;
      --surface-final: #e9fbf8;
      --ink: #172033;
      --muted: #667085;
      --border: #cbd5e1;
      --guide: #dbe4ee;
      --token: #7c5ce7;
      --token-soft: #f0ecff;
      --gpu: #dd7b24;
      --gpu-soft: #fff3e7;
      --call: #168a73;
      --call-soft: #e8f8f4;
      --common: #2878c8;
      --final: #087f72;
      --focus: #d5eee9;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #10141d;
        --surface: #171d28;
        --surface-soft: #202837;
        --surface-common: #172b40;
        --surface-final: #12352f;
        --ink: #edf2f7;
        --muted: #a7b2c2;
        --border: #3c495d;
        --guide: #344154;
        --token: #ab96ff;
        --token-soft: #292441;
        --gpu: #f1a45d;
        --gpu-soft: #382a20;
        --call: #57c9ae;
        --call-soft: #18352f;
        --common: #71b5f4;
        --final: #64d4c2;
        --focus: #214940;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    h1 {
      font-size: 24px;
      line-height: normal;
    }

    .subtitle {
      color: var(--muted);
      font-size: 15px;
      line-height: normal;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 400px;
      background: var(--surface);
    }

    .background {
      fill: var(--surface);
    }

    .column {
      stroke: var(--border);
      stroke-width: 2;
    }

    .daily-column {
      fill: var(--surface-common);
    }

    .effective-column {
      fill: var(--surface-final);
      stroke: var(--final);
    }

    .card {
      fill: var(--surface);
      stroke: var(--border);
      stroke-width: 2;
    }

    .token-card {
      fill: var(--token-soft);
      stroke: var(--token);
    }

    .gpu-card {
      fill: var(--gpu-soft);
      stroke: var(--gpu);
    }

    .call-card {
      fill: var(--call-soft);
      stroke: var(--call);
    }

    .formula-card {
      fill: var(--surface-soft);
    }

    .daily-card {
      fill: var(--surface);
      stroke: var(--common);
    }

    .effective-card {
      fill: var(--surface);
      stroke: var(--final);
    }

    .flow,
    .accent,
    .divider {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .flow {
      stroke-width: 2;
    }

    .accent {
      stroke-width: 3;
    }

    .divider {
      stroke: var(--guide);
      stroke-width: 2;
    }

    .token-stroke {
      stroke: var(--token);
    }

    .gpu-stroke {
      stroke: var(--gpu);
    }

    .call-stroke {
      stroke: var(--call);
    }

    .token-fill {
      fill: var(--token);
    }

    .gpu-fill {
      fill: var(--gpu);
    }

    .call-fill {
      fill: var(--call);
    }

    .column-title {
      fill: var(--muted);
      font-size: 13px;
      font-weight: bold;
    }

    .kicker {
      fill: var(--muted);
      font-size: 12px;
      font-weight: bold;
    }

    .card-label {
      fill: var(--ink);
      font-size: 16px;
      font-weight: bold;
    }

    .daily-label {
      fill: var(--common);
      font-size: 15px;
      font-weight: bold;
    }

    .effective-label {
      fill: var(--final);
      font-size: 15px;
      font-weight: bold;
    }

    .footer-label {
      fill: var(--muted);
      font-size: 13px;
    }

    .footer-result {
      fill: var(--final);
      font-size: 13px;
      font-weight: bold;
    }

    .fallback {
      fill: var(--ink);
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="diagram-heading">Как разные тарифы становятся сравнимыми</h1>
    <p class="subtitle">Одинаковая синтетическая нагрузка переводит разные единицы оплаты на один язык.</p>
  </header>

  <svg id="diagram"
       viewBox="0 0 1180 400"
       width="1180"
       height="400"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="diagram-heading diagram-description">
    <title>Пересчёт трёх типов тарифов</title>
    <desc id="diagram-description">Цена за миллион токенов, цена за минуту GPU и цена за предсказание проходят собственные расчёты, после чего становятся стоимостью суток и эффективной стоимостью миллиона токенов.</desc>
    <g id="scene"></g>
  </svg>

  <noscript>
    <style>
      #diagram { display: none; }
    </style>
    <p>Схема должна показать, как три разных тарифа становятся сопоставимой эффективной стоимостью миллиона токенов.</p>
  </noscript>

  <script>
    const data = [{
      origin: { x: 40, y: 20 },
      scale: { x: 10, y: 10 },
      zero: 0,
      bounds: { left: -4, top: -2, right: 114, bottom: 38 },
      radius: { x: 1.2, y: 1.2 },
      arrowHead: { x: 1.05, y: 0.62 },
      cardHalfHeight: 3.2,
      cardTextOffsets: [-0.35, 1.15],
      singleLineOffset: 0.55,
      kickerOffset: -1.65,
      markerOffset: 1.35,
      markerRadius: 0.34,
      headers: [
        {
          x: 12.5,
          y: 1.75,
          lines: ["ИСХОДНЫЙ ТАРИФ"],
          offsets: [0]
        },
        {
          x: 40,
          y: 1.05,
          lines: ["ПЕРЕСЧЁТ НА", "ОБЩЕЙ НАГРУЗКЕ"],
          offsets: [0, 1.45]
        },
        {
          x: 68.75,
          y: 1.75,
          lines: ["СТОИМОСТЬ СУТОК"],
          offsets: [0]
        },
        {
          x: 98.75,
          y: 1.05,
          lines: ["ЭФФЕКТИВНАЯ СТОИМОСТЬ", "МИЛЛИОНА ТОКЕНОВ"],
          offsets: [0, 1.45]
        }
      ],
      columns: [
        {
          x: 58.5,
          y: 4.2,
          w: 20.5,
          h: 29,
          className: "column daily-column"
        },
        {
          x: 84.5,
          y: 4.2,
          w: 28.5,
          h: 29,
          className: "column effective-column"
        }
      ],
      sourceBox: { x: 2, w: 21 },
      formulaBox: { x: 30, w: 20 },
      dailyBox: { x: 60.5, w: 16.5 },
      effectiveBox: { x: 86.5, w: 24.5 },
      lanes: [
        {
          y: 9,
          sourceClass: "card token-card",
          strokeClass: "token-stroke",
          fillClass: "token-fill",
          sourceKicker: "ЦЕНА",
          sourceLines: ["за миллион", "токенов"],
          formulaLines: ["токены", "× тариф"]
        },
        {
          y: 19,
          sourceClass: "card gpu-card",
          strokeClass: "gpu-stroke",
          fillClass: "gpu-fill",
          sourceKicker: "ЦЕНА",
          sourceLines: ["за минуту GPU"],
          formulaLines: ["минуты GPU", "× тариф"]
        },
        {
          y: 29,
          sourceClass: "card call-card",
          strokeClass: "call-stroke",
          fillClass: "call-fill",
          sourceKicker: "ЦЕНА",
          sourceLines: ["за предсказание"],
          formulaLines: ["предсказания", "× тариф"]
        }
      ],
      footer: {
        dividerY: 34.55,
        leftX: 2,
        rightX: 111,
        textY: 36.65,
        leftText: "Одна и та же синтетическая нагрузка проходит по каждой строке",
        rightText: "разные единицы → одинаковая работа → общий язык сравнения"
      },
      fallback: {
        x: 55,
        y: 17,
        lines: [
          "Три разных тарифа должны были сойтись",
          "в эффективной стоимости миллиона токенов"
        ],
        offsets: [0, 2.2]
      }
    }];

    const [d] = data;
    const origin = d.origin;
    const scale = d.scale;

    function sx(x) {
      return origin.x + x * scale.x;
    }

    function sy(y) {
      return origin.y + y * scale.y;
    }

    const svg = document.getElementById("diagram");
    const scene = document.getElementById("scene");
    const namespace = "http://www.w3.org/2000/svg";

    function put(name, attributes, parent = scene) {
      const element = document.createElementNS(namespace, name);
      for (const [key, value] of Object.entries(attributes)) {
        element.setAttribute(key, String(value));
      }
      parent.appendChild(element);
      return element;
    }

    function box(x, y, width, height, className, parent = scene) {
      return put("rect", {
        x: sx(x),
        y: sy(y),
        width: sx(x + width) - sx(x),
        height: sy(y + height) - sy(y),
        rx: sx(d.radius.x) - sx(d.zero),
        ry: sy(d.radius.y) - sy(d.zero),
        class: className
      }, parent);
    }

    function line(x1, y1, x2, y2, className, parent = scene) {
      return put("line", {
        x1: sx(x1),
        y1: sy(y1),
        x2: sx(x2),
        y2: sy(y2),
        class: className
      }, parent);
    }

    function textAt(x, y, value, className, anchor = "middle", parent = scene) {
      const label = put("text", {
        x: sx(x),
        y: sy(y),
        class: className,
        "text-anchor": anchor,
        "dominant-baseline": "middle"
      }, parent);
      label.textContent = value;
      return label;
    }

    function textLines(x, y, lines, offsets, className, anchor = "middle", parent = scene) {
      for (const [index, value] of lines.entries()) {
        textAt(x, y + offsets[index], value, className, anchor, parent);
      }
    }

    function marker(x, y, radius, className, parent = scene) {
      return put("circle", {
        cx: sx(x),
        cy: sy(y),
        r: sx(radius) - sx(d.zero),
        class: className
      }, parent);
    }

    function arrow(x1, y1, x2, y2, strokeClass, fillClass, parent = scene) {
      line(
        x1,
        y1,
        x2 - d.arrowHead.x,
        y2,
        "flow " + strokeClass,
        parent
      );

      const points = [
        [x2, y2],
        [x2 - d.arrowHead.x, y2 - d.arrowHead.y],
        [x2 - d.arrowHead.x, y2 + d.arrowHead.y]
      ];

      put("polygon", {
        points: points.map(([x, y]) => sx(x) + "," + sy(y)).join(" "),
        class: fillClass
      }, parent);
    }

    function cardText(boxData, lane, kicker, lines, labelClass) {
      const centerX = boxData.x + boxData.w / d.cardHalfHeight * d.singleLineOffset;
      textAt(
        centerX,
        lane.y + d.kickerOffset,
        kicker,
        "kicker"
      );

      if (lines.length === d.headers.length / d.headers.length) {
        textAt(
          centerX,
          lane.y + d.singleLineOffset,
          lines.at(d.zero),
          labelClass
        );
      } else {
        textLines(
          centerX,
          lane.y,
          lines,
          d.cardTextOffsets,
          labelClass
        );
      }
    }

    try {
      box(
        d.bounds.left,
        d.bounds.top,
        d.bounds.right - d.bounds.left,
        d.bounds.bottom - d.bounds.top,
        "background"
      );

      for (const column of d.columns) {
        box(
          column.x,
          column.y,
          column.w,
          column.h,
          column.className
        );
      }

      for (const header of d.headers) {
        textLines(
          header.x,
          header.y,
          header.lines,
          header.offsets,
          "column-title"
        );
      }

      for (const lane of d.lanes) {
        arrow(
          d.sourceBox.x + d.sourceBox.w,
          lane.y,
          d.formulaBox.x,
          lane.y,
          lane.strokeClass,
          lane.fillClass
        );

        arrow(
          d.formulaBox.x + d.formulaBox.w,
          lane.y,
          d.dailyBox.x,
          lane.y,
          lane.strokeClass,
          lane.fillClass
        );

        arrow(
          d.dailyBox.x + d.dailyBox.w,
          lane.y,
          d.effectiveBox.x,
          lane.y,
          lane.strokeClass,
          lane.fillClass
        );
      }

      for (const lane of d.lanes) {
        const top = lane.y - d.cardHalfHeight;

        box(
          d.sourceBox.x,
          top,
          d.sourceBox.w,
          d.cardHalfHeight + d.cardHalfHeight,
          lane.sourceClass
        );

        box(
          d.formulaBox.x,
          top,
          d.formulaBox.w,
          d.cardHalfHeight + d.cardHalfHeight,
          "card formula-card"
        );

        box(
          d.dailyBox.x,
          top,
          d.dailyBox.w,
          d.cardHalfHeight + d.cardHalfHeight,
          "card daily-card"
        );

        box(
          d.effectiveBox.x,
          top,
          d.effectiveBox.w,
          d.cardHalfHeight + d.cardHalfHeight,
          "card effective-card"
        );

        line(
          d.sourceBox.x + d.radius.x,
          top,
          d.sourceBox.x + d.sourceBox.w - d.radius.x,
          top,
          "accent " + lane.strokeClass
        );

        marker(
          d.dailyBox.x + d.markerOffset,
          lane.y,
          d.markerRadius,
          lane.fillClass
        );

        marker(
          d.effectiveBox.x + d.markerOffset,
          lane.y,
          d.markerRadius,
          lane.fillClass
        );

        cardText(
          d.sourceBox,
          lane,
          lane.sourceKicker,
          lane.sourceLines,
          "card-label"
        );

        cardText(
          d.formulaBox,
          lane,
          "СВОЯ ВЕТКА",
          lane.formulaLines,
          "card-label"
        );

        textAt(
          d.dailyBox.x + d.dailyBox.w / d.cardHalfHeight * d.singleLineOffset,
          lane.y + d.kickerOffset,
          "ОБЩИЙ СТОЛБЕЦ",
          "kicker"
        );

        textAt(
          d.dailyBox.x + d.dailyBox.w / d.cardHalfHeight * d.singleLineOffset,
          lane.y + d.singleLineOffset,
          "$ за сутки",
          "daily-label"
        );

        textAt(
          d.effectiveBox.x + d.effectiveBox.w / d.cardHalfHeight * d.singleLineOffset,
          lane.y + d.kickerOffset,
          "СОПОСТАВИМАЯ СТАВКА",
          "kicker"
        );

        textLines(
          d.effectiveBox.x + d.effectiveBox.w / d.cardHalfHeight * d.singleLineOffset,
          lane.y,
          ["$ за миллион", "токенов"],
          d.cardTextOffsets,
          "effective-label"
        );
      }

      line(
        d.footer.leftX,
        d.footer.dividerY,
        d.footer.rightX,
        d.footer.dividerY,
        "divider"
      );

      textAt(
        d.footer.leftX,
        d.footer.textY,
        d.footer.leftText,
        "footer-label",
        "start"
      );

      textAt(
        d.footer.rightX,
        d.footer.textY,
        d.footer.rightText,
        "footer-result",
        "end"
      );
    } catch (error) {
      scene.replaceChildren();

      box(
        d.bounds.left,
        d.bounds.top,
        d.bounds.right - d.bounds.left,
        d.bounds.bottom - d.bounds.top,
        "background"
      );

      textLines(
        d.fallback.x,
        d.fallback.y,
        d.fallback.lines,
        d.fallback.offsets,
        "fallback"
      );
    }
  </script>
</body>
</html>
