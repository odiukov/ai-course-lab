<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта рынка инференс-платформ</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #eef2f7;
    --surface: #ffffff;
    --surface-soft: #f7f9fc;
    --ink: #172033;
    --muted: #5b667b;
    --border: #cbd4e1;
    --banner: #e8edf5;
    --custom: #c04470;
    --custom-soft: #f8e5ec;
    --gpu: #2b6fbd;
    --gpu-soft: #e4effb;
    --api: #16806b;
    --api-soft: #def3ed;
    --arrow: #78859a;
    --label-pad: 12px;
    --line: 2px;
    --title-size: 24px;
    --category-size: 18px;
    --brand-size: 16px;
    --body-size: 14px;
    --small-size: 12px;
    --canvas-height: 430px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #111722;
      --surface: #192231;
      --surface-soft: #202b3c;
      --ink: #edf3fb;
      --muted: #afbdd0;
      --border: #3a4960;
      --banner: #242f40;
      --custom: #f083a8;
      --custom-soft: #402536;
      --gpu: #72b3ff;
      --gpu-soft: #203a58;
      --api: #57d5b9;
      --api-soft: #173f38;
      --arrow: #94a4ba;
    }
  }

  html,
  body {
    margin: initial;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  main {
    padding: var(--label-pad);
    background: var(--page);
  }

  h1 {
    margin: initial;
    padding-block-end: var(--label-pad);
    color: var(--ink);
    font-size: var(--title-size);
    line-height: normal;
  }

  .frame {
    overflow: hidden;
    border: var(--line) solid var(--border);
    background: var(--surface);
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: var(--canvas-height);
    background: var(--surface);
  }

  svg text {
    fill: var(--ink);
  }

  .category {
    font-size: var(--category-size);
    font-weight: bold;
  }

  .brand {
    font-size: var(--brand-size);
    font-weight: bold;
  }

  .body {
    font-size: var(--body-size);
  }

  .small {
    fill: var(--muted);
    font-size: var(--small-size);
  }

  .purchase {
    font-size: var(--small-size);
    font-weight: bold;
  }

  .fallback {
    padding: var(--label-pad);
    color: var(--ink);
    background: var(--surface);
    font-size: var(--body-size);
  }
</style>
</head>
<body>
<main>
  <h1>Карта рынка инференс-платформ</h1>
  <div class="frame" id="frame">
    <svg id="market-map" width="1200" height="430" viewBox="0 0 1200 430"
         preserveAspectRatio="xMidYMid meet" role="img"
         aria-labelledby="svg-title svg-description">
      <title id="svg-title">Три сегмента рынка инференс-платформ</title>
      <desc id="svg-description">Собственные чипы, GPU-платформы и API-маркетплейсы сгруппированы по тому, что именно покупает клиент.</desc>
    </svg>
    <noscript>
      <div class="fallback">
        Схема должна показать три сегмента: собственные чипы — Groq, Cerebras и
        SambaNova; GPU-платформы — Fireworks, Together, Baseten, Modal и Anyscale;
        API-маркетплейсы — Replicate, DeepInfra, OpenRouter и Fal.
      </div>
    </noscript>
  </div>
</main>

<script>
const data = [
  {
    kind: "layout",
    banner: { x: 0, y: 0, w: 1152, h: 38, tx: 576, ty: 25 },
    columns: { y: 52, h: 282 },
    separatorY: 139,
    footerY: 316,
    card: { h: 45, stripe: 6, textX: 16, brandY: 19, noteY: 36 },
    callout: { h: 28, textY: 19 },
    purchase: { y: 348, h: 32, textY: 369 },
    arrows: [
      { x1: 350, x2: 366, y: 364, base: 358, top: 359, bottom: 369 },
      { x1: 784, x2: 800, y: 364, base: 792, top: 359, bottom: 369 }
    ],
    icon: {
      chip: { x: 296, y: 69, w: 34, h: 28, inset: 7, pin: 8 },
      gpu: {
        layers: [
          { x: 726, y: 68, w: 34, h: 18 },
          { x: 720, y: 76, w: 34, h: 18 },
          { x: 714, y: 84, w: 34, h: 18 }
        ]
      },
      api: {
        bars: [
          { x: 1098, y: 70, w: 32, h: 7 },
          { x: 1098, y: 82, w: 32, h: 7 },
          { x: 1098, y: 94, w: 32, h: 7 }
        ],
        stem: { x1: 1088, x2: 1098, y: 85 },
        head: { tip: 1098, base: 1091, top: 80, bottom: 90 }
      }
    }
  },
  {
    id: "custom",
    x: 0,
    w: 350,
    color: "custom",
    title: "Специализированные чипы",
    subtitle: ["Собственная архитектура", "для быстрого инференса"],
    titleX: 18,
    titleY: 79,
    subtitleX: 18,
    subtitleY: [108, 126],
    icon: "chip",
    cards: [
      { x: 18, y: 150, w: 314, name: "Groq", note: "LPU" },
      { x: 18, y: 205, w: 314, name: "Cerebras", note: "WSE" },
      { x: 18, y: 260, w: 314, name: "SambaNova", note: "RDU" }
    ],
    purchase: "Покупаете: преимущество архитектуры"
  },
  {
    id: "gpu",
    x: 368,
    w: 416,
    color: "gpu",
    title: "GPU-платформы",
    subtitle: ["Размещение и эксплуатация", "модели на GPU"],
    titleX: 386,
    titleY: 79,
    subtitleX: 386,
    subtitleY: [108, 126],
    icon: "gpu",
    cards: [
      { x: 384, y: 150, w: 184, name: "Fireworks", note: "инференс" },
      { x: 584, y: 150, w: 184, name: "Together", note: "инференс" },
      { x: 384, y: 205, w: 184, name: "Baseten", note: "деплой" },
      { x: 584, y: 205, w: 184, name: "Modal", note: "GPU без серверов" },
      { x: 484, y: 260, w: 184, name: "Anyscale", note: "платформа" }
    ],
    purchase: "Покупаете: среду размещения"
  },
  {
    id: "api",
    x: 802,
    w: 350,
    color: "api",
    title: "API-маркетплейсы",
    subtitle: ["Каталог моделей", "через готовый API"],
    titleX: 820,
    titleY: 79,
    subtitleX: 820,
    subtitleY: [108, 126],
    icon: "api",
    cards: [
      { x: 820, y: 150, w: 151, name: "Replicate", note: "каталог моделей" },
      { x: 983, y: 150, w: 151, name: "DeepInfra", note: "готовый API" },
      { x: 820, y: 211, w: 151, name: "OpenRouter", note: "маршрутизация" },
      { x: 983, y: 211, w: 151, name: "Fal", note: "медиа-модели" }
    ],
    callout: { x: 820, y: 276, w: 314, text: "Выбор модели → запрос → результат" },
    purchase: "Покупаете: готовый доступ"
  }
];

const origin = { x: 24, y: 24 };
const scale = { x: 1, y: 1 };
const canvas = { width: 1200, height: 430 };
const labelPadding = 12;
const lineWidth = 2;
const fontSizes = { title: 24, category: 18, brand: 16, body: 14, small: 12 };

function sx(x) {
  return origin.x + x * scale.x;
}

function sy(y) {
  return origin.y + y * scale.y;
}

try {
  const svg = document.getElementById("market-map");
  const namespace = "http://www.w3.org/2000/svg";
  const [layout, ...segments] = data;

  function element(tag, attributes, content) {
    const item = document.createElementNS(namespace, tag);
    Object.entries(attributes).forEach(([name, value]) => {
      item.setAttribute(name, String(value));
    });
    if (content !== undefined) item.textContent = content;
    return item;
  }

  function group(className) {
    return element("g", { class: className });
  }

  function rect(parent, box, className) {
    parent.appendChild(element("rect", {
      x: sx(box.x),
      y: sy(box.y),
      width: sx(box.x + box.w) - sx(box.x),
      height: sy(box.y + box.h) - sy(box.y),
      class: className
    }));
  }

  function line(parent, x1, y1, x2, y2, className) {
    parent.appendChild(element("line", {
      x1: sx(x1),
      y1: sy(y1),
      x2: sx(x2),
      y2: sy(y2),
      class: className
    }));
  }

  function text(parent, x, y, content, className, anchor) {
    parent.appendChild(element("text", {
      x: sx(x),
      y: sy(y),
      class: className,
      "text-anchor": anchor
    }, content));
  }

  function polygon(parent, points, className) {
    const value = points.map((point) => {
      return sx(point.x) + "," + sy(point.y);
    }).join(" ");
    parent.appendChild(element("polygon", {
      points: value,
      class: className
    }));
  }

  const defs = element("style", {}, `
    .panel { fill: var(--surface-soft); stroke: var(--border); stroke-width: ${lineWidth}; }
    .divider { stroke: var(--border); stroke-width: ${lineWidth}; }
    .banner { fill: var(--banner); }
    .banner-text { fill: var(--muted); font-size: ${fontSizes.body}px; font-weight: bold; }
    .custom-card { fill: var(--custom-soft); stroke: var(--custom); stroke-width: ${lineWidth}; }
    .gpu-card { fill: var(--gpu-soft); stroke: var(--gpu); stroke-width: ${lineWidth}; }
    .api-card { fill: var(--api-soft); stroke: var(--api); stroke-width: ${lineWidth}; }
    .custom-fill { fill: var(--custom); }
    .gpu-fill { fill: var(--gpu); }
    .api-fill { fill: var(--api); }
    .custom-stroke { fill: none; stroke: var(--custom); stroke-width: ${lineWidth}; }
    .gpu-stroke { fill: none; stroke: var(--gpu); stroke-width: ${lineWidth}; }
    .api-stroke { fill: none; stroke: var(--api); stroke-width: ${lineWidth}; }
    .purchase-custom { fill: var(--custom-soft); stroke: var(--custom); stroke-width: ${lineWidth}; }
    .purchase-gpu { fill: var(--gpu-soft); stroke: var(--gpu); stroke-width: ${lineWidth}; }
    .purchase-api { fill: var(--api-soft); stroke: var(--api); stroke-width: ${lineWidth}; }
    .flow { stroke: var(--arrow); stroke-width: ${lineWidth}; }
    .flow-head { fill: var(--arrow); }
  `);
  svg.appendChild(defs);

  const bannerGroup = group("map-banner");
  rect(bannerGroup, layout.banner, "banner");
  text(
    bannerGroup,
    layout.banner.tx,
    layout.banner.ty,
    "Это карта предмета покупки, а не рейтинг провайдеров",
    "banner-text",
    "middle"
  );
  svg.appendChild(bannerGroup);

  function drawChip(parent, icon) {
    rect(parent, icon, "custom-stroke");
    rect(parent, {
      x: icon.x + icon.inset,
      y: icon.y + icon.inset,
      w: icon.w - icon.inset - icon.inset,
      h: icon.h - icon.inset - icon.inset
    }, "custom-fill");
    line(parent, icon.x + icon.pin, icon.y - icon.pin, icon.x + icon.pin, icon.y, "custom-stroke");
    line(parent, icon.x + icon.w - icon.pin, icon.y - icon.pin, icon.x + icon.w - icon.pin, icon.y, "custom-stroke");
    line(parent, icon.x + icon.pin, icon.y + icon.h, icon.x + icon.pin, icon.y + icon.h + icon.pin, "custom-stroke");
    line(parent, icon.x + icon.w - icon.pin, icon.y + icon.h, icon.x + icon.w - icon.pin, icon.y + icon.h + icon.pin, "custom-stroke");
  }

  function drawGpu(parent, icon) {
    icon.layers.forEach((layer) => rect(parent, layer, "gpu-card"));
  }

  function drawApi(parent, icon) {
    icon.bars.forEach((bar) => rect(parent, bar, "api-fill"));
    line(parent, icon.stem.x1, icon.stem.y, icon.stem.x2, icon.stem.y, "api-stroke");
    polygon(parent, [
      { x: icon.head.tip, y: icon.stem.y },
      { x: icon.head.base, y: icon.head.top },
      { x: icon.head.base, y: icon.head.bottom }
    ], "api-fill");
  }

  segments.forEach((segment) => {
    const segmentGroup = group("segment-" + segment.id);
    rect(segmentGroup, {
      x: segment.x,
      y: layout.columns.y,
      w: segment.w,
      h: layout.columns.h
    }, "panel");

    text(
      segmentGroup,
      segment.titleX,
      segment.titleY,
      segment.title,
      "category",
      "start"
    );

    segment.subtitle.forEach((row, index) => {
      text(
        segmentGroup,
        segment.subtitleX,
        segment.subtitleY[index],
        row,
        "small",
        "start"
      );
    });

    line(
      segmentGroup,
      segment.x,
      layout.separatorY,
      segment.x + segment.w,
      layout.separatorY,
      "divider"
    );

    if (segment.icon === "chip") drawChip(segmentGroup, layout.icon.chip);
    if (segment.icon === "gpu") drawGpu(segmentGroup, layout.icon.gpu);
    if (segment.icon === "api") drawApi(segmentGroup, layout.icon.api);

    segment.cards.forEach((card) => {
      rect(segmentGroup, {
        x: card.x,
        y: card.y,
        w: card.w,
        h: layout.card.h
      }, segment.color + "-card");

      rect(segmentGroup, {
        x: card.x,
        y: card.y,
        w: layout.card.stripe,
        h: layout.card.h
      }, segment.color + "-fill");

      text(
        segmentGroup,
        card.x + layout.card.textX,
        card.y + layout.card.brandY,
        card.name,
        "brand",
        "start"
      );

      text(
        segmentGroup,
        card.x + layout.card.textX,
        card.y + layout.card.noteY,
        card.note,
        "small",
        "start"
      );
    });

    if (segment.callout) {
      rect(segmentGroup, segment.callout, segment.color + "-card");
      text(
        segmentGroup,
        segment.callout.x + segment.callout.w - segment.callout.w + segment.callout.w / scale.x / scale.x,
        segment.callout.y + layout.callout.textY,
        segment.callout.text,
        "small",
        "end"
      );
    }

    line(
      segmentGroup,
      segment.x,
      layout.footerY,
      segment.x + segment.w,
      layout.footerY,
      "divider"
    );

    svg.appendChild(segmentGroup);

    const purchaseGroup = group("purchase-" + segment.id);
    rect(purchaseGroup, {
      x: segment.x,
      y: layout.purchase.y,
      w: segment.w,
      h: layout.purchase.h
    }, "purchase-" + segment.color);
    text(
      purchaseGroup,
      segment.x + segment.w / scale.x / scale.x - segment.w / scale.x / scale.x + segment.w / (scale.x + scale.x),
      layout.purchase.textY,
      segment.purchase,
      "purchase",
      "middle"
    );
    svg.appendChild(purchaseGroup);
  });

  const flowGroup = group("flow-arrows");
  layout.arrows.forEach((arrow) => {
    line(flowGroup, arrow.x1, arrow.y, arrow.x2, arrow.y, "flow");
    polygon(flowGroup, [
      { x: arrow.x2, y: arrow.y },
      { x: arrow.base, y: arrow.top },
      { x: arrow.base, y: arrow.bottom }
    ], "flow-head");
  });
  svg.appendChild(flowGroup);

  svg.setAttribute("data-canvas-width", String(canvas.width));
  svg.setAttribute("data-canvas-height", String(canvas.height));
  svg.setAttribute("data-label-padding", String(labelPadding));
} catch (error) {
  const frame = document.getElementById("frame");
  frame.replaceChildren();
  const fallback = document.createElement("div");
  fallback.className = "fallback";
  fallback.textContent =
    "Схема должна показать три колонки: собственные чипы — Groq, Cerebras и SambaNova; " +
    "GPU-платформы — Fireworks, Together, Baseten, Modal и Anyscale; " +
    "API-маркетплейсы — Replicate, DeepInfra, OpenRouter и Fal.";
  frame.appendChild(fallback);
}
</script>
</body>
</html>
