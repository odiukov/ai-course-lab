  fingerprint: '675322e3'
- concept: max_tokens ограничивает размер одного ответа модели и не является ограничением стоимости сессии
  question: Что именно ограничивает `max_tokens`?
  explanation: '`max_tokens` — потолок длины одного ответа. Итерации ограничивает `max_turns`, стоимость сессии — `max_budget_usd`, трату за окно — лимит скорости. Множество коротких ответов в цикле спокойно разоряет кошелёк, поэтому `max_tokens` не заменяет ни один из остальных лимитов.'
  kind: choice
  options:
    - Число итераций агентского цикла в сессии
    - Размер одного ответа модели
    - Суммарную стоимость сессии в долларах
    - Трату за короткое временное окно
  correct: 1
