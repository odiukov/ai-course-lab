- concept: проверка лимитов принимает уже измеренные величины и ничего не измеряет сама
  question: Почему функция выбора первого пробитого потолка получает готовые показатели (накопленный расход, счётчики вызовов, значение окна) аргументами, а не считает их внутри себя? Объясни своими словами.
  explanation: 'Разделение измерения и решения — обычный приём для кода, который должен быть предсказуемым: сравнение остаётся чистой арифметикой, а сбор показателей живёт в журнале и в расчёте окна.'
  kind: open
  reference: 'Измерение и сравнение — разные обязанности. Пока функция только сравнивает наблюдаемое значение с пределом, её поведение полностью задано входами: любой сценарий (равенство лимиту, одновременное нарушение нескольких потолков, полное отсутствие нарушений) воспроизводится в тесте подстановкой чисел, без часов, журнала и сети. Если функция сама читает журнал и берёт текущее время, результат зависит от внешнего состояния, границу окна и границу равенства проверить трудно, а одна и та же величина может считаться в двух местах по-разному.'
