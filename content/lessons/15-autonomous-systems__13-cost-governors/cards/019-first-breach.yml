- concept: случай «нарушений нет» кодируется значением, которое не может совпасть ни с одним именем лимита
  question: Функция возвращает имя первого пробитого потолка. Что она должна вернуть, если не пробит ни один, чтобы вызывающий код не спутал «нарушений нет» с именем лимита?
  explanation: 'Вызывающий код различает два исхода: продолжать ход или остановиться и записать имя сработавшего лимита. Пустая строка формально строка, но её легко проверить на истинность вместе с настоящими именами и получить одинаковую ветку. Возврат имени «самого близкого» лимита превращает диагностику в ложную остановку.'
  kind: choice
  options:
    - None — значение, которое не может быть именем ни одного лимита
    - Пустую строку, чтобы тип результата всегда был строкой
    - Имя лимита с наименьшим запасом, а вызывающий код пусть сам решает
    - Число 0 как признак нулевого числа нарушений
