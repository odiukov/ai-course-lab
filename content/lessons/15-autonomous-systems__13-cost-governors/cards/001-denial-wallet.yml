- concept: у чатбота плохой вывод даёт плохой ответ, у агента плохой цикл даёт счёт — потому что агент способен продолжать действовать без человека
  question: Объясни своими словами, почему неудача автономного агента опаснее для бюджета, чем неудача обычного чатбота.
  explanation: 'Ключ — автономность цикла: возможность самому начать следующую попытку превращает единичную ошибку в незавершающуюся серию платных действий.'
  kind: open
  reference: 'Чатбот отвечает один раз: плохой результат — это плохой ответ, расход конечен и завершается вместе с ответом. Агент способен действовать дальше без человека: рассуждать, вызывать платные инструменты, проверять результат и начинать новую попытку. Поэтому его ошибка не заканчивается, а превращается в продолжающийся процесс, у которого работает счётчик расходов. Стоимость набегает из повторения дешёвых шагов, а не из цены одного действия.'
