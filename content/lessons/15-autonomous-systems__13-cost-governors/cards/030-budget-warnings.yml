- concept: пустой результат аудита означает «пропусков не найдено», а не сбой и не пропущенную проверку
  question: Функция аудита конфигурации вернула пустой список предупреждений. Как это читать?
  explanation: 'Пустой список — это результат «находок нет», обычный успешный исход. Он не эквивалентен утверждению «безопасно»: аудит отвечает только за наличие слоёв, а не за адекватность их значений.'
  kind: choice
  options:
    - Ни один проверяемый слой не оказался пропущенным или явно выключенным
    - Аудит не смог разобрать конфигурацию и ничего не проверил
    - Конфигурация признана безопасной для любого прогона
    - Проверка прервалась на первом слое
  correct: 0
  id: 030-budget-warnings-1
  fingerprint: 2aa008c0
- concept: каждый пропущенный слой даёт отдельное предупреждение с названием слоя и риском, а не одну сводную фразу
  question: Почему аудит выдаёт по отдельному предупреждению на каждый пропущенный слой, а не одну общую строку «конфигурация небезопасна»?
  explanation: Аудит — это список находок, а не булев вердикт. Ранний выход после первой находки прячет остальные пропуски до следующего запуска.
  kind: open
  reference: 'Общая фраза не сообщает, что чинить: она одинакова и когда пропущен один слой, и когда пропущено шесть. Отдельное предупреждение называет конкретный слой и оставшийся открытым риск, поэтому по нему можно либо добавить защиту, либо явно принять риск именно по этому пункту. Это же делает результат пригодным для сравнения между прогонами: видно, какие находки исчезли, а какие остались. Отсюда и правило проходить все слои, а не останавливаться на первой находке.'
  id: 030-budget-warnings-2
  fingerprint: 744a8244
- concept: аудит только читает конфигурацию и выдаёт находки в фиксированном порядке слоёв, не изменяя её и не включая защиту
  question: Аудит обнаружил, что лимит вызовов инструмента не задан. Что функция аудита делать не должна?
  explanation: 'Аудит только читает конфигурацию: правка «на лету» скрывает решение, которое обязан принять человек, и делает результат зависимым от того, запускали аудит или нет. Фиксированный порядок находок делает вывод воспроизводимым и удобным для тестов.'
  kind: choice
  options:
    - Подставлять значение по умолчанию в конфигурацию, чтобы закрыть пропуск
    - Добавлять предупреждение с названием слоя и описанием риска
    - Продолжать проверку остальных слоёв
    - Выдавать находки в фиксированном порядке слоёв
  correct: 0
  id: 030-budget-warnings-3
  fingerprint: 3d9fecdf
