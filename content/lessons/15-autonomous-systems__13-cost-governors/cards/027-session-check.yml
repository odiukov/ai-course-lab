- concept: предел числа ходов ловит незавершающийся дешёвый цикл, который остаётся ниже порога скользящего окна
  question: 'Агент раз в полминуты делает ход за $0.03. Лимит скорости: не больше $0.90 за скользящее окно в 4 минуты. Предел ходов — 40. Что остановит такой цикл?'
  explanation: В окно попадает 8 ходов, то есть $0.24 против потолка $0.90 — окно не пробивается никогда. Медленный незавершающийся цикл ловит именно счётчик ходов, поэтому его держат как страховку, а не заменяют лимитом скорости.
  kind: choice
  options:
    - Только предел числа ходов
    - Только лимит скорости
    - Оба сработают примерно одновременно
    - 'Ни один: расход слишком мал'
