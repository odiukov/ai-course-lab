- concept: лимит скорости срабатывает тем раньше, чем быстрее агент тратит, а лимит итераций не зависит от темпа
  question: Агент ушёл в цикл опроса и делает ходы очень часто. Почему лимит скорости обычно ловит его раньше, чем предел числа итераций?
  explanation: Ускорение цикла приближает срабатывание лимита скорости и никак не приближает срабатывание предела ходов. Именно поэтому взбесившийся цикл — профильный случай для окна, а не для счётчика итераций.
  kind: choice
  options:
    - Лимит скорости сравнивает трату внутри короткого окна, и частые ходы набирают эту сумму за секунды, а счётчик ходов растёт независимо от того, насколько быстро они идут
    - Лимит скорости проверяется чаще, а предел итераций — только в конце сессии
    - Предел итераций считает только ходы с вызовом инструмента, а лимит скорости — все
    - Лимит скорости учитывает стоимость будущих ходов, а предел итераций — только прошедших
