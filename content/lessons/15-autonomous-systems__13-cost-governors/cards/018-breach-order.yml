- concept: запись о пробитии должна называть сработавший лимит, полученное значение и место срабатывания, иначе режим отказа неразличим
  question: Объясни своими словами, что обязана содержать запись о пробитом лимите и почему без этих полей разбор происшествия невозможен.
  explanation: Остановка без записи защищает кошелёк, но не даёт починить причину. Тот же самый факт срабатывания при законном всплеске спроса и при цикле ретраев требует противоположных решений, и различить их можно только по сработавшему лимиту, значению и месту.
  kind: open
  reference: 'Запись называет, какой именно лимит сработал (бюджет задачи, лимит итераций, потолок вызовов конкретного инструмента, лимит окна), какое значение получилось против какого порога, и где это произошло — какая сессия, задача, шаг. Без этого нельзя отличить разные режимы отказа: зацикленные ретраи, медленная утечка вдвое дороже ожидаемого, плохой релиз и законный всплеск реального спроса выглядят одинаково — «сессия остановлена». Именно эти поля решают, что делать дальше: править код цикла, поднять порог под реальный спрос или откатить релиз.'
