- concept: единственное число обязано одновременно разрешать нормальную работу и ограничивать аварию, и эти две цели конфликтуют
  question: Почему подбор единственного денежного потолка для агента — компромисс, а не задача с одним верным значением?
  explanation: 'Отсюда и вывод урока: денежный потолок — последняя граница, а не первый сигнал тревоги.'
  kind: open
  reference: 'Низкий потолок (скажем, $30) уменьшает ущерб от зациклившегося прогона, но обрывает длинные полезные задачи до результата. Высокий потолок ($800) даёт свободу нормальной работе, но позволяет ошибочному циклу сжечь всю эту сумму. Одно число обслуживает две конфликтующие цели — разрешать полезный расход и ограничивать аварийный, — поэтому его поднимают и опускают всегда за счёт одной из целей. Решение — стопка лимитов разной природы: скорость трат, число вызовов инструмента, число итераций, окна по времени; каждый ловит свою форму сбоя раньше, чем кончится бюджет.'
  id: 003-governor-stack-2
  fingerprint: c8ee4acb
