- concept: фильтр окна включает запись ровно на левой границе и отбрасывает записи позже текущего момента
  question: Функция расчёта траты за окно должна учитывать запись, сделанную ровно в момент начала окна, и не учитывать записи позже текущего момента. Какой оператор стоит на месте пропуска?
  explanation: 'Нестрогое `<=` на левой границе даёт единое правило с правой границей: запись входит в окно ровно в момент своего старта и выпадает только тогда, когда становится строго старше окна. Со строгим `<` расход исчезал бы из подсчёта на одну проверку раньше.'
  kind: cloze
  template: |-
    window_start = now - window
    total = sum(t["cost"] for t in ledger["turns"] if window_start ___ t["time"] <= now)
  answer: <=
  accept:
    - <=
    - ≤
  id: 016-window-velocity-1
  fingerprint: 00223c9b
- concept: текущий момент передаётся аргументом, чтобы срез окна был воспроизводимым в тесте
  question: Зачем функции расчёта траты за окно передавать текущий момент параметром вместо чтения системных часов внутри неё?
  explanation: Если время берётся внутри, результат зависит от момента запуска теста и граничные случаи проверить нельзя. С явным параметром тест подставляет нужную отметку и утверждает точную сумму — заодно можно проиграть прошлые сценарии на записанном журнале.
  kind: choice
  options:
    - Чтение системных часов замедляет функцию на каждом ходе
    - Тест может зафиксировать момент и точно проверить, какие записи попали в окно
    - Без параметра функция не сможет складывать стоимости записей
  correct: 1
  id: 016-window-velocity-2
