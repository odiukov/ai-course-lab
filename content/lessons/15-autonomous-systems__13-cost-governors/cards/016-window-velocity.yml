- concept: результат расчёта по окну — сумма денег внутри окна, сопоставимая с лимитом окна, а не расход в единицу времени
  question: Функция за 20-минутное окно отобрала записи на общую сумму €55. Что она должна вернуть, чтобы результат сравнивался с лимитом вида «не больше X за 20 минут»?
  explanation: Лимит окна сформулирован как деньги за интервал, поэтому и величина для сравнения — сумма внутри интервала. Деление на минуты дало бы другую единицу и потребовало бы пересчёта лимита; общий итог журнала вообще не про окно.
  kind: choice
  options:
    - €55 — сумму трат внутри окна
    - €2,75 — сумму, делённую на длину окна в минутах
    - Общую сумму журнала за весь прогон
  correct: 0
  id: 016-window-velocity-3
