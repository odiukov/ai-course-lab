- concept: разные слои закрывают разные режимы отказа, поэтому наличие одного слоя не компенсирует отсутствие другого
  question: В конфигурации есть предел числа ходов, но нет безопасного повторного запуска после падения процесса. Почему аудит всё равно обязан выдать находку?
  explanation: Аудит идёт по карте слоёв, а не по «общему ощущению защищённости». Подмена одного слоя другим — типичная причина, по которой конфигурация выглядит полной и не является таковой.
  kind: open
  reference: 'Предел ходов ограничивает длину одного прогона и ничего не говорит о том, что происходит при перезапуске: после падения агент заново проходит журнал и может второй раз выполнить и оплатить уже завершённые дорогие действия, причём счётчик ходов при этом стартует с нуля. Это другой режим отказа — не взбесившийся цикл, а дублирование завершённой покупки. Слои не взаимозаменяемы: каждый закрывает свой класс отказа, поэтому наличие одного не снимает находку по другому.'
  id: 029-audit-gaps-3
  fingerprint: ab70f7d8
