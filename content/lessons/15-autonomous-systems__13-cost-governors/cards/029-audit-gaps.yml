- concept: находка аудита не запрещает запуск, а переводит отсутствие защиты из молчания в явно принятое решение
  question: 'Аудит перед запуском сообщает: лимит скорости не настроен. Как правильно трактовать это сообщение?'
  explanation: Для короткого эксперимента слой могут отключить намеренно. Ценность аудита не в запрете, а в том, что пропуск больше нельзя молча принять за исправность и обнаружить постфактум по счёту.
  kind: choice
  options:
    - Как требование либо добавить слой, либо явно и осознанно принять оставшийся риск
    - 'Как ошибку конфигурации: запуск невозможен, пока слой не добавлен'
    - Как справочную заметку, которую можно игнорировать, если бюджет сессии задан
    - Как признак, что другие слои настроены неверно
