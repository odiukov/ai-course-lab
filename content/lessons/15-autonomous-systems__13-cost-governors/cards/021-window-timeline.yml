- concept: длинное окно отвечает на вопрос, закрепился ли новый уровень расхода, что короткое окно в принципе решить не может
  question: Отклонение расхода короткое окно замечает сразу. Какой вопрос про ту же траекторию способно решить только длинное окно, и почему коротким его не решить?
  explanation: 'Поэтому короткое и длинное окна не дублируют друг друга: одно ставит вопрос «началось ли отклонение сейчас», другое — «это уже новый уровень».'
  kind: open
  reference: 'Только длинное окно отвечает, стал ли повышенный расход новой нормой, а не единичным эпизодом. Короткое окно видит лишь узкий срез: и разовый всплеск, и систематически подорожавшая работа выглядят в нём одинаково — высоким значением, которое затем возвращается к норме. Чтобы отличить эпизод от закрепившегося уровня, интервал наблюдения должен быть заметно больше самого эпизода: тогда однократный скачок остаётся неровностью на фоне, а устойчивое удорожание накапливается в сумме окна и держится там прогон за прогоном.'
