- concept: трата остаётся внутри длинного окна дольше, поэтому длинное окно и реагирует медленно, и медленно возвращается к норме
  question: Всплеск трат длился несколько минут и полностью закончился. Как дальше поведут себя 7-минутное и 90-минутное скользящие окна?
  explanation: 'Запись выпадает из окна тогда, когда её время уходит за левую границу, а левая граница длинного окна отстаёт сильнее. Отсюда несимметричная плата: короткое окно даёт быструю тревогу и быстрое снятие, длинное — позднюю тревогу и долгий след после инцидента.'
  kind: choice
  options:
    - Примерно через 7 минут короткое окно вернётся к обычному значению, а 90-минутное будет держать повышенное почти полтора часа
    - 'Оба вернутся к норме одновременно: новых трат больше нет'
    - 90-минутное окно вернётся к норме первым, потому что усредняет всплеск
    - Оба продолжат расти, потому что накопленная сумма расходов не убывает
