- concept: 'цена партии при лестнице моделей задаётся долей эскалаций: дешёвая доля × цена дешёвой ступени + дорогая доля × цена дорогой'
  question: Партия из 500 запросов. Классификатор поднимает на дорогую модель 8% запросов. Дешёвая ступень — $0.02 за запрос, дорогая — $0.50. Сколько стоит вся партия в долларах?
  explanation: '460 × 0.02 = 9.2 плюс 40 × 0.50 = 20, итого $29.20 против $250 при отправке всех запросов на дорогую модель. Экономия целиком держится на доле эскалаций: при 50% вместо 8% цена партии стала бы $130, и смысл лестницы почти исчез.'
  kind: numeric
  answer: 29.2
  tolerance: 0.2
  id: 022-tiered-routing-1
  fingerprint: 150df32d
- concept: без предела числа эскалаций неудачные проверки качества покупают серию дорогих повторов и съедают экономию лестницы
  question: 'Правило звучит так: «если проверка качества не пройдена, повторить запрос на модели следующего уровня». Что обязательно добавить к этому правилу?'
  explanation: 'Проверка качества может не проходить и по причинам, которые сменой модели не лечатся — плохие входные данные, противоречивое задание. Без потолка повышений такой запрос циклически покупает всё более дорогие попытки: расход растёт, результат нет. Обычно разрешают одно повышение, а дальше отдают случай человеку.'
  kind: choice
  options:
    - Предел числа повышений на один запрос — иначе один трудный вход даёт цепочку дорогих повторов
    - Запрет на использование дешёвой ступени для повторов, чтобы качество не падало
    - Требование всегда начинать с самой дорогой модели, а дешёвую использовать только для проверок
    - Обязательное сжатие контекста перед каждым повтором вместо ограничения на повторы
  correct: 0
  id: 022-tiered-routing-2
  fingerprint: f101b754
- concept: решение об эскалации принимает классификатор по признакам запроса до вызова дорогой модели, а не сравнение готовых ответов
  question: На каком основании в лестнице моделей запрос попадает на дорогую ступень?
  explanation: Смысл маршрутизации — не платить за дорогой вызов там, где он не нужен, поэтому решение обязано приниматься до вызова и по дешёвым признакам. Отправка на обе модели удваивает расход и уничтожает экономию. Причину перехода при этом записывают в понятных словах («юридический риск»), иначе потом нельзя проверить, правильно ли настроен порог.
  kind: choice
  options:
    - Классификатор смотрит на признаки запроса — юридический или иной риск, длину и неоднозначность контекста — и решает до вызова
    - Запрос отправляют на обе ступени и оставляют ответ, который выглядит лучше
    - На дорогую ступень уходит всё, что осталось после исчерпания дневного лимита на дешёвую модель
    - Дорогую ступень выбирают случайной выборкой, чтобы измерять разницу качества
  correct: 0
  id: 022-tiered-routing-3
