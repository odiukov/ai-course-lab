- concept: суммаризация истории сохраняет дословно критические инструкции и свежие детали, а сворачивает давнюю историю, потому что цена ошибки — потеря условия задачи
  question: Диалог с агентом дорос до 41 хода, и историю решено свернуть в краткий пересказ. Что обязано попасть в пересказ дословно, что можно сжимать и какой отказ грозит при слишком агрессивном сжатии?
  explanation: 'Сжатие контекста — единственный рычаг, который уменьшает само количество входных токенов на каждом следующем ходу, но он лоссовый. Поэтому сжимают асимметрично: старое — агрессивно, ограничения и свежее — консервативно. Потерянное условие обычно стоит дороже сэкономленных токенов, потому что заставляет переделывать работу.'
  kind: open
  reference: 'Дословно сохраняются критические инструкции, ограничения и текущая цель, а также свежие детали последних ходов — по ним принимаются ближайшие решения. Сворачивается давняя история: промежуточные рассуждения, отброшенные варианты, повторы, вывод инструментов, уже учтённый в решении. Пересказ должен нести текущую цель, принятые решения, действующие ограничения и нерешённые вопросы. Отказ при переусердствовании: из контекста выпадает условие задачи или уже принятое решение, и агент нарушает ограничение либо заново повторяет работу — то есть экономия на входных токенах оборачивается лишними дорогими ходами.'
