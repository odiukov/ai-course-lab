- concept: экономия кэша считается как размер неизменного префикса, умноженный на разницу между полной ценой входа и ценой чтения из кэша
  question: Неизменный префикс промпта — 16 800 входных токенов. Обычный вход стоит $3 за миллион токенов, чтение из кэша — 10% этой цены. Сколько долларов экономит попадание в кэш на одном ходу? Ответ в долларах.
  explanation: 'Полная цена префикса: 16 800 × 3 / 1 000 000 = $0.0504. Из кэша: 10% от этого, то есть $0.00504. Разница ≈ $0.045 за ход. Экономия пропорциональна размеру префикса и числу ходов: скидка даётся на цену за токен, а само количество токенов кэш не уменьшает.'
  kind: numeric
  answer: 0.045
  tolerance: 0.005
