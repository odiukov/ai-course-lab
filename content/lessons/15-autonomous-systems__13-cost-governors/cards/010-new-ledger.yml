- concept: фабрика журнала обязана возвращать новый объект на каждый вызов; общий экземпляр переносит расходы между прогонами
  question: 'Функция создания журнала объявлена так: словарь-счётчик лежит на уровне модуля, а функция просто возвращает его. Что произойдёт при втором запуске агента?'
  explanation: Возвращается ссылка на один и тот же объект, поэтому накопленные $0,07 и 18 000 токенов первой задачи становятся стартовой точкой второй. Словарь надо создавать внутри функции при каждом вызове.
  kind: choice
  options:
    - Второй запуск начнётся с расходов первого и упрётся в потолок раньше срока
    - Второй запуск начнётся с нуля, потому что функция вызывается заново
    - 'Второй запуск не сможет писать в журнал: словарь заблокирован первым'
    - Ничего не изменится, пока задачи выполняются последовательно
  correct: 0
  id: 010-new-ledger-1
  fingerprint: 3a08d1d1
- concept: имена полей журнала — контракт между тем, кто пишет расход, и тем, кто проверяет лимит
  question: Разработчик переименовал в журнале поле со счётчиком вызовов инструментов, но проверку лимита не тронул. Что наиболее вероятно?
  explanation: 'Журнал — общая структура для функции записи хода и для функций-ограничителей. Ключи здесь контракт: разошлись имена — соответствующий лимит либо молча не работает, либо ломается на KeyError.'
  kind: choice
  options:
    - Журнал перестанет создаваться
    - Стоимость запросов начнёт считаться по неверному тарифу
    - Счётчик вызовов перестанет попадать под проверку или проверка упадёт с ошибкой доступа к ключу
    - Значения полей сами приведутся к новым именам
  correct: 2
  id: 010-new-ledger-2
  fingerprint: c939420d
- concept: независимость журналов проверяется мутацией одного и сравнением другого, а не сравнением их значений сразу после создания
  question: Как тестом убедиться, что фабрика журнала действительно выдаёт независимые объекты, а не один общий?
  explanation: 'Равенство содержимого не отличает копию от алиаса. Отличает мутация: у общего объекта изменение видно в обоих «журналах».'
  kind: open
  reference: 'Создать два журнала двумя вызовами, изменить счётчики только у первого и убедиться, что у второго все накопительные поля остались нулевыми; дополнительно проверить, что объекты не один и тот же (сравнение по идентичности даёт False). Сравнивать журналы сразу после создания бесполезно: у общего объекта значения тоже совпадут, потому что это буквально одна структура.'
  id: 010-new-ledger-3
  fingerprint: 0c8e5ff2
