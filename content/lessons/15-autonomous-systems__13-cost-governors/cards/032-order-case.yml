- concept: каждый добавленный инструмент — новая поверхность для цикла, поэтому вместе с инструментом заводятся его лимит вызовов и его алерт
  question: Команда добавляет агенту новый инструмент — запрос статуса доставки. Вызов дешёвый, ответ короткий, общие лимиты сессии уже настроены. Какое правило подсказывает опыт эксплуатации агентов?
  explanation: 'Цена одного вызова не определяет риск: риск определяет частота, с которой агент может повторить вызов. Разбор кейса e-commerce-агента показал именно это — новый дешёвый инструмент опрашивался в каждой сессии и утроил месячный счёт, потому что у него не было ни своего потолка вызовов, ни своего сигнала о росте.'
  kind: choice
  options:
    - Дешёвые инструменты не нуждаются в отдельных ограничениях, их покрывает общий бюджет
    - Отдельный лимит нужен только инструментам, которые пишут данные или тратят внешние деньги
    - Каждая новая поверхность-инструмент вводит новый потенциальный цикл, поэтому вместе с ней заводят её собственный лимит вызовов и её собственный алерт на рост
    - Достаточно поднять порог максимального ответа модели, чтобы новый инструмент не влиял на счёт
  correct: 2
  id: 032-order-case-1
  fingerprint: 8f5a7bbe
- concept: алерт на рост уведомляет человека и ничего не запрещает, лимит блокирует автоматически — поэтому алерт не заменяет лимит, а сокращает время обнаружения
  question: 'После разбора инцидента с раздутым счётом предлагают два средства: жёсткий лимит вызовов инструмента и алерт на аномальный дневной рост стоимости. Чем их роли различаются?'
  explanation: 'Лимит — это принуждение: пробитие обрывает работу без человека. Алерт — это наблюдаемость: он не мешает агенту тратить, но переводит рост из невидимого в замеченный за сутки, а не за месяц. Поэтому один не подменяет другой: без лимита алерт даёт только раннее уведомление о продолжающемся расходе, без алерта лимит молча срабатывает уже на большом объёме.'
  kind: choice
  options:
    - Оба останавливают выполнение, различается только порог срабатывания
    - Лимит останавливает расход автоматически, алерт ничего не запрещает и лишь сокращает время до вмешательства человека
    - Алерт останавливает выполнение до подтверждения, лимит только записывает превышение
    - Алерт применяется к инструментам, лимит — к модели, поэтому они не пересекаются
  correct: 1
  id: 032-order-case-2
  fingerprint: ccdfea52
- concept: стоимость утечки равна частоте, умноженной на цену вызова, поэтому дешёвый вызов даёт крупную сумму при высокой частоте
  question: Агент обслуживает 30 000 сессий в месяц. После релиза в каждой сессии появился один лишний вызов инструмента стоимостью $0.02. На сколько долларов вырастет месячный счёт?
  explanation: '30 000 × $0.02 = $600 в месяц. Величина утечки — произведение частоты на цену вызова, поэтому «дешёвый» вызов ничего не говорит о его вкладе в счёт. Ни один лимит на размер отдельного запроса такую утечку не заметит: каждое отдельное срабатывание остаётся законным.'
  kind: numeric
  answer: 600
  tolerance: 1
  id: 032-order-case-3
