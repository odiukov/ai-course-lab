- concept: потолок задачи ставят с кратным запасом над точечной оценкой, потому что число шагов оценивается хуже, чем цена шага
  question: 'Ночной прогон без присмотра: 40 задач, в среднем 12 ходов на задачу, ход стоит $0.05. Потолок задачи ставят вдвое выше точечной оценки. Какое значение бюджета в долларах получится?'
  explanation: 'Точечная оценка: 40 × 12 × $0.05 = $24, потолок $48. Запас берётся не потому, что неизвестна цена токена — она известна точно, — а потому, что число ходов на задачу оценивается грубо: повторы, неудачные попытки и разбор ошибок легко удваивают траекторию. Если прогон вышел за оценку втрое, ошиблись именно в количестве шагов.'
  kind: numeric
  answer: 48
  tolerance: 0.5
  id: 033-final-quiz-1
  fingerprint: c349983e
- concept: жёсткость лимита инструмента задаётся ценой вызова и способностью инструмента попасть в повторяющийся цикл, а не важностью инструмента для задачи
  question: 'Браузерный агент имеет инструменты: чтение уже загруженной страницы из локального кэша, полная загрузка страницы с рендерингом, отправка формы. По какому признаку выбирают, какому инструменту нужен самый жёсткий лимит вызовов?'
  explanation: 'Самый жёсткий предел нужен дорогому вызову, который агент физически способен повторять: полная загрузка с рендерингом стоит дорого и легко зацикливается на перезагрузке одной страницы. Чтение из локального кэша дёшево и не растёт в цене от повторов, поэтому может обойтись без своего потолка. Важность инструмента для задачи тут вообще не критерий: критичный инструмент часто как раз должен вызываться свободно.'
  kind: choice
  options:
    - По тому, насколько инструмент важен для решения задачи
    - По произведению цены вызова на способность инструмента повторяться в цикле без продвижения к результату
    - По количеству параметров, которые инструмент принимает
    - По тому, обращается ли инструмент к внешней сети
  correct: 1
