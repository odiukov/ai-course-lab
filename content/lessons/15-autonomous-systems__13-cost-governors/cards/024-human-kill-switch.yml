- concept: 'после пробития потолка остановка не подлежит обсуждению: она обязательна и автоматична, поэтому запросом к человеку её заменить нельзя'
  question: Почему пробитие бюджета обрабатывают автоматической остановкой, а не тем же самым вопросом человеку, который задаёт чекпоинт перед дорогим шагом? Объясни своими словами.
  explanation: 'Разделение простое: до траты человек получает выбор, после нарушения выбор отнимается у системы. Первое — предупредительный контроль, второе — исполнение правила.'
  kind: open
  reference: 'Чекпоинт спрашивает о том, что ещё можно решить: деньги не потрачены, и польза шага сопоставима с его ценой. При пробитии потолка решать уже нечего — правило нарушено, и вопрос «продолжать?» лишь добавляет задержку. За эту задержку зациклившийся агент продолжает тратить, а человек может быть недоступен: ночью, в отпуске, просто не за экраном. Поэтому остановка исполняется без участия человека и по факту, а не по обсуждению; человек возвращается в процесс позже и по отдельному пути — когда решает, что делать с уже зафиксированным нарушением.'
  id: 024-human-kill-switch-3
