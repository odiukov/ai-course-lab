- concept: чекпоинт бесполезен без ожидаемой стоимости, причины дорогого шага и остатка бюджета — человеку нечем принять решение
  question: Что чекпоинт обязан показать человеку, чтобы пауза перед дорогим действием давала осмысленное решение?
  explanation: 'Решение «да/нет» требует цены и повода: без ожидаемой стоимости и остатка бюджета человек не может сравнить пользу шага с тем, что после него останется, а без причины — не может оценить, обоснован ли переход на дорогую ступень. Чекпоинт, который спрашивает без данных, быстро превращается в автоматическое «да» и защиту не даёт.'
  kind: choice
  options:
    - Что именно агент собирается сделать, ожидаемую стоимость шага, причину и остаток бюджета
    - Только запрос «продолжить?» — детали человек посмотрит в логе сам
    - Полную историю диалога, чтобы человек восстановил контекст с нуля
    - Список всех лимитов стопки с их текущими значениями и порогами
