- concept: запись о возобновлении фиксирует, кто разрешил снятие блокировки и на каком основании, иначе восстановима траектория агента, но не ответственность человека
  question: Агент остановлен сработавшим ограничителем. Инцидент разобран, работу возобновляют. Что, кроме факта самой остановки, обязано попасть в журнал — и почему без этого надзор нельзя считать проверяемым?
  explanation: 'Надзор проверяем, когда по журналу восстанавливается цепочка ответственности целиком: сработало ограничение, человек разобрал причину, человек разрешил продолжение. Автоматическое возобновление без такой записи возвращает систему в тот же цикл трат и делает надзор недоказуемым.'
  kind: open
  reference: 'В журнал попадает событие возобновления: личность (или роль) уполномоченного, время разрешения, основание — что именно признано причиной срабатывания и что с ней сделано, а также при каких порогах агент запускается дальше. Без этого по логам восстанавливаются только действия агента: видно, что он остановился и снова начал тратить, но не видно, вернул ли ему право действовать человек или блокировку сняло автоматическое повторение запуска. Именно запись о решении превращает остановку в контролируемый инцидент, а не в паузу.'
  id: 031-governance-log-2
  fingerprint: 124fe70f
