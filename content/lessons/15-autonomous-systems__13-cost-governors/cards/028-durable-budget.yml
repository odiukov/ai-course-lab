- concept: у дорогого действия должен быть устойчивый идентификатор и запись о завершении с результатом и учтённой стоимостью, иначе перезапуск неотличим от первого запуска
  question: Агент выполняет платные внешние действия, процесс может упасть и перезапуститься по сохранённому журналу. Что должно храниться о каждом уже выполненном платном действии?
  explanation: 'При перезапуске агент ищет запись по идентификатору: нашёл — отдаёт сохранённый результат без нового вызова и без второго списания; не нашёл — выполняет и записывает результат вместе со стоимостью. Суммы или номера шага для этого решения недостаточно.'
  kind: choice
  options:
    - Устойчивый идентификатор действия, его результат и отметка, что стоимость уже учтена
    - Только суммарная стоимость всех выполненных действий
    - Только порядковый номер шага, на котором остановился процесс
    - Полный контекст диалога на момент вызова
  correct: 0
  id: 028-durable-budget-1
  fingerprint: ec045301
- concept: порядок обработки дорогого действия при повторном проходе по журналу
  question: Процесс перезапустился и заново проходит журнал. Расставь шаги обработки очередного платного действия.
  explanation: Поиск идёт до вызова, иначе повтор уже случился. Запись результата и стоимости идёт после вызова, иначе следующий перезапуск снова сочтёт действие невыполненным.
  kind: order
  items:
    - Найти в журнале запись о завершении этого действия по его устойчивому идентификатору
    - Если запись есть — вернуть сохранённый результат, не вызывая сервис и не добавляя стоимость в журнал расходов
    - Если записи нет — выполнить вызов, передав сервису постоянный ключ идемпотентности
    - Сохранить результат и его стоимость как завершённое действие
  id: 028-durable-budget-2
  fingerprint: 84545a3a
- concept: разрыв между вызовом сервиса и локальной записью закрывается ключом идемпотентности на стороне провайдера, а не журналом агента
  question: Сервис уже принял платный вызов, но процесс упал до того, как результат записан локально. Что позволяет не купить то же самое второй раз?
  explanation: Локальный журнал в принципе не знает, состоялся ли вызов в момент падения. Единственность списания в этом окне обеспечивает сторона провайдера по ключу идемпотентности; если такого механизма нет, остаётся проверка статуса операции или ручное подтверждение.
  kind: choice
  options:
    - 'Постоянный ключ операции, переданный провайдеру: повтор с тем же ключом возвращает исходный результат, а не создаёт новую покупку'
    - Более частая запись журнала на диск перед каждым вызовом
    - Сверка накопленной стоимости в журнале с лимитом бюджета
    - Повтор вызова с увеличенным таймаутом
  correct: 0
