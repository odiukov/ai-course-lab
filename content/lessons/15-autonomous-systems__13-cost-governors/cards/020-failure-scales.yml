- concept: время до пробития окна равно лимиту, делённому на произведение частоты вызовов и цены вызова
  question: 'Агент застрял в ретраях: один вызов каждые 3 секунды, каждый стоит $0.30. Лимит скользящего окна — $72. Через сколько минут непрерывного цикла расход внутри окна достигнет лимита?'
  explanation: 'Темп сжигания = 0.30 / 3 с = $0.10 в секунду, то есть $6 в минуту. 72 / 6 = 12 минут. Так же считается и обратная сторона: чтобы поймать такой цикл, окно должно быть короче времени до пробития, иначе лимит узнает о проблеме сильно позже.'
  kind: numeric
  answer: 12
  tolerance: 0.5
  id: 020-failure-scales-1
  fingerprint: 35fbbd66
- concept: срабатывание лимита при законном росте спроса требует разбора записи и осознанного пересмотра потолка, а не снятия ограничителя
  question: 'Часовой лимит сработал вечером. Разбор показал: бага нет, пришло втрое больше реальных пользователей. Что правильно сделать?'
  explanation: 'По цифрам законный спрос не отличается от аварии — лимит обязан сработать в обоих случаях. Отличает их не сам факт срабатывания, а запись: что тратилось, чем и с какой частотой. Снятие лимита убирает защиту от следующего цикла; отсутствие записи делает причину неразличимой в следующий раз.'
  kind: choice
  options:
    - Оставить ограничитель, а потолок пересмотреть по записи о срабатывании — с новой оценкой нормальной нагрузки
    - 'Снять часовой лимит: он мешает обслуживать настоящий спрос'
    - Считать срабатывание ложным и не фиксировать его, чтобы не засорять журнал
    - Понизить потолок, чтобы такой всплеск гарантированно не проходил
  correct: 0
  id: 020-failure-scales-2
  fingerprint: 43b5e1bd
- concept: утечка вида «вдвое больше работы на задачу» не меняет мгновенный темп трат и различима только в агрегате по многим задачам
  question: Агент стал делать примерно вдвое больше шагов на задачу, чем ожидалось. Почему лимит скорости за несколько минут этого не ловит, а суточный итог ловит? Объясни своими словами.
  explanation: 'Именно поэтому дневной агрегат нужен рядом с окном на минуты: одна величина видит скорость, другая — накопленный объём при нормальной скорости.'
  kind: open
  reference: 'Лимит скорости смотрит на темп внутри короткого окна, а темп не изменился: агент по-прежнему делает шаги с обычной частотой и обычной ценой шага, просто шагов на задачу больше. Отдельная задача остаётся в пределах своего потолка и по цене неотличима от разброса нормальных задач. Отклонение проявляется только как множитель на объёме: за сутки проходят десятки задач, и удвоение расхода на каждую даёт устойчивое смещение суммы, которое уже нельзя объяснить шумом.'
  id: 020-failure-scales-3
  fingerprint: fd95743f
