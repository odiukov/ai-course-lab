- concept: 'классификатор разрешений и денежный лимит — независимые ручки: разрешённость действия не ограничивает его стоимость'
  question: Сессия работает в `autoMode`, разрешения выдаёт классификатор, `max_budget_usd` не задан. Почему это неуправляемая автономия?
  explanation: 'Это две независимые ручки: классификатор фильтрует состав действий, бюджет ограничивает их цену. Полностью законная последовательность разрешённых действий может стоить сколько угодно, поэтому отсутствие денежного потолка классификатором не компенсируется.'
  kind: choice
  options:
    - Классификатор решает, какие действия допустимы, но не ограничивает суммарную стоимость этих действий
    - В `autoMode` классификатор отключается, и разрешено вообще всё
    - Без `max_budget_usd` провайдер перестаёт считать стоимость вызовов
    - '`autoMode` увеличивает цену каждого запроса, и лимит нужен для компенсации'
