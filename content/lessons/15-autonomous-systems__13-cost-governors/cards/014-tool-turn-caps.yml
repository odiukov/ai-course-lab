- concept: allowed_tools/disallowed_tools задают состав доступных инструментов, а численный предел вызовов реализуется собственным хуком перед вызовом
  question: Нужно, чтобы `WebFetch` вызывался не больше 4 раз за сессию. Инструмент при этом обязан остаться рабочим. Какое средство даёт именно такое ограничение?
  explanation: '`allowed_tools` и `disallowed_tools` отвечают только на вопрос «какие инструменты доступны», без счёта. Чёрный список запретил бы инструмент целиком, а `max_tokens` ограничивает размер одного ответа. Численный предел даёт хук перед вызовом: если счётчик уже равен 4, вызов не выполняется и расход не создаётся.'
  kind: choice
  options:
    - Оставить `WebFetch` в `allowed_tools` — белый список сам ограничит частоту вызовов
    - Перенести `WebFetch` в `disallowed_tools`, чтобы лишние вызовы отсекались
    - 'Свой счётчик в хуке перед вызовом инструмента: пятый вызов не начинается'
    - Понизить `max_tokens`, чтобы ответы стали короче и вызовов стало меньше
