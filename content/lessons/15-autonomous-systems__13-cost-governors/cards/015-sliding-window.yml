- concept: значение скользящего окна равно сумме только тех трат, что попадают внутрь окна, а вышедшие за него не учитываются
  question: Окно длиной 7 минут. Агент сделал 6 трат по $12 каждая; к текущему моменту 2 самые ранние из них старше 7 минут, остальные внутри окна. Какое значение покажет окно в долларах?
  explanation: 'Внутри окна остались 4 траты: 4 × $12 = $48. Общий расход сессии при этом $72 и он никуда не делся — окно просто отвечает на другой вопрос, чем накопленная сумма.'
  kind: numeric
  answer: 48
  tolerance: 0.5
  id: 015-sliding-window-1
  fingerprint: e12f60ba
- concept: границы скользящего окна двигаются вместе с текущим моментом и не привязаны к фиксированным календарным интервалам
  question: Чем скользящее окно отличается от фиксированного интервала (например, «каждый час с ровного часа»)?
  explanation: Фиксированный интервал обнуляется на своей границе, поэтому всплеск, размазанный по двум соседним интервалам, может не сработать ни в одном. Скользящее окно на каждой проверке сдвигает обе границы вместе с текущим моментом, поэтому всплеск виден сразу, где бы он ни начался.
  kind: choice
  options:
    - Скользящее окно всегда короче фиксированного интервала
    - Скользящее окно на каждой проверке берёт период непосредственно перед текущим моментом, а не ждёт конца интервала
    - Скользящее окно сбрасывает накопленную сумму, когда интервал заканчивается
    - Скользящее окно считает вызовы, а фиксированный интервал — деньги
  correct: 1
  id: 015-sliding-window-2
  fingerprint: af01eaa3
- concept: значение окна немонотонно и может уменьшаться, тогда как накопленная сумма расходов только растёт
  question: Объясни своими словами, почему значение скользящего окна со временем может уменьшаться без всякого возврата денег, а накопленный расход сессии — нет.
  explanation: 'Ключ в том, что окно отбрасывает старые записи. Уменьшение его значения — нормальная работа, а не потеря данных: журнал трат сохраняется целиком, окно лишь берёт из него срез.'
  kind: open
  reference: 'Накопленный расход — сумма всех трат с начала прогона, к ней только добавляют, поэтому она монотонно растёт. Окно суммирует лишь траты, попавшие в текущий период: новые входят справа, а достаточно старые перестают учитываться слева, и от этого сумма внутри окна падает. Никакого возврата денег не происходит — просто окно измеряет другую величину: не итог, а сколько денег ушло за последний период. Поэтому оба счётчика нужны рядом: накопленная сумма проверяется против бюджета задачи, окно — против лимита своего окна.'
  id: 015-sliding-window-3
  fingerprint: 57ecc14a
