- concept: из всего стека только HITL-чекпойнт и kill switch требуют человека, остальные слои — арифметика в коде
  question: Какие слои стека cost governor требуют участия человека, а не работают чистой арифметикой в коде?
  explanation: 'HITL-чекпойнт перед дорогим действием и kill switch при нарушении лимита — единственные слои с человеком. Все счётчики, окна и потолки срабатывают автоматически: сравнение числа с порогом.'
