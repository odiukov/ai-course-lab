- concept: kill switch обрывает сессию при срабатывании любого лимита, факт фиксируется, а обратное включение идёт отдельным путём
  question: Как устроен kill switch при нарушении бюджета?
  explanation: 'Смысл kill switch — жёсткая остановка и фиксация факта. Автоматическое возобновление или молчаливое повышение лимита сделали бы защиту бессмысленной: цикл продолжил бы тратить.'
  kind: choice
  options:
    - Агент переводится на более дешёвую модель и продолжает работу
    - Сессия обрывается, срабатывание записывается, а возобновление возможно только отдельным путём, а не автоматически
    - Лимит автоматически поднимается до следующего порога, чтобы задача завершилась
