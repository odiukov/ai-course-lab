- concept: аварийный выход по лимиту обязан вернуть накопленное состояние журнала, а не только факт остановки
  question: 'Сессия оборвана на 11-м ходу: скользящее окно пробито. Что диспетчер обязан вернуть вызывающему коду вместе с фактом остановки?'
  explanation: 'После обрыва кто-то решает, что делать дальше: сколько бюджета осталось на день, можно ли перезапускать, звать ли человека. Без накопленного состояния на момент обрыва этих решений принять нельзя, а обнуление журнала при выходе прямо стирает историю трат.'
  kind: choice
  options:
    - 'Журнал с накопленными тратами: токенами, деньгами и вызовами инструментов на момент обрыва'
    - Только булев флаг «остановлено» — детали уже не нужны, раз сессия мертва
    - Пустой журнал, чтобы следующий прогон стартовал с нуля
    - Только последний ход, потому что именно он пробил потолок
