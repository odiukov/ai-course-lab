- concept: цикл сессии заканчивается либо естественным завершением задачи, либо пробитием лимита, и результат обязан различать эти исходы
  question: Агент решил задачу за 6 ходов и вернул финальный ответ; лимиты не тронуты. Как должен выглядеть результат сессии?
  explanation: Выход из петли и нарушение бюджета — независимые вещи. Если успешное завершение записывается как срабатывание ограничителя, мониторинг покажет ложные пробития, а настоящая авария утонет в шуме. Остановка по лимиту несёт имя лимита и значение, нормальное завершение — не несёт.
  kind: choice
  options:
    - Цикл останавливается, но исход помечен как нормальное завершение — без имени сработавшего лимита
    - 'Цикл останавливается и помечается тем же кодом, что и остановка по лимиту: снаружи разницы нет'
    - Цикл продолжается до исчерпания лимита итераций, чтобы все прогоны были одинаковой длины
    - Цикл помечается пробитием самого маленького из потолков, раз остановка всё равно произошла
