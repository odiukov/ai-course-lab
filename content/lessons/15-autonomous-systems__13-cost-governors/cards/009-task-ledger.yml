- concept: решение о потолке задачи принимается по сумме «накоплено + стоимость следующего действия», а не по цене одного запроса
  question: Бюджет задачи — $0,30. Накоплено $0,22. Следующий запрос обойдётся в $0,14. Что должен сделать governor?
  explanation: Потолок относится ко всему прогону. Дешёвый запрос легально проходит проверку «сам по себе» и при этом выносит задачу за бюджет — сравнивать надо накопленный итог плюс прогноз следующего шага.
  kind: choice
  options:
    - 'Разрешить: $0,14 меньше бюджета $0,30'
    - 'Разрешить: ни один отдельный запрос бюджет не превысил'
    - 'Запретить: $0,22 + $0,14 = $0,36 выше потолка задачи'
    - Запретить только если запрос дороже среднего по задаче
  correct: 2
  id: 009-task-ledger-1
  fingerprint: 7a31ffb9
- concept: накопленный расход хранится в отдельном журнале, потому что диалоговый контекст — ненадёжный источник истории трат
  question: Почему нельзя восстанавливать сумму расходов задачи по истории сообщений диалога?
  explanation: 'Расход — это факт, а контекст — рабочая память, которую свободно режут и переписывают. Журнал ведут отдельно, как кассовую книгу: в него попадает только то, что влияет на бюджет.'
  kind: choice
  options:
    - История сообщений не содержит текста запросов
    - Контекст сжимают и обрезают, сообщения удаляют, попытки повторяют — часть трат исчезнет или удвоится
    - Модель не умеет считать арифметику по своему контексту
    - Токены сообщений и токены запросов измеряются в разных единицах
  correct: 1
  id: 009-task-ledger-2
  fingerprint: 560150a4
- concept: журнал накапливает не только доллары, но и токены и вызовы инструментов, потому что лимиты стоят и на неденежных величинах
  question: Зачем журналу задачи хранить количество вызовов инструментов и число токенов, если бюджет всё равно задан в деньгах?
  explanation: Один счётчик долларов не отвечает на вопрос «сколько раз агент дёрнул инструмент». Журнал — единый источник для всех арифметических лимитов.
  kind: open
  reference: Потому что деньги — не единственный потолок. Отдельно ограничивают число вызовов инструмента, число итераций и суммарные токены прогона, и каждая такая проверка требует своего накопленного счётчика. Кроме того, токены нужны для аудита и для перерасчёта стоимости при смене тарифа. Журнал хранит все накопительные величины прогона, чтобы любой лимит сравнивался с реальным итогом, а не с показателями последнего запроса.
  id: 009-task-ledger-3
  fingerprint: e8b6da5b
