<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Трилемма групповой справедливости</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fc;
      --panel: #ffffff;
      --ink: #182033;
      --muted: #626b80;
      --line: #cbd2df;
      --track: #e8ebf2;
      --dp: #356bd8;
      --eo: #16836f;
      --cua: #8252c7;
      --trade: #d56a28;
      --trade-soft: #fff1e7;
      --halo: #eef2fa;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111521;
        --panel: #1b2130;
        --ink: #f2f4fa;
        --muted: #b5bed0;
        --line: #485269;
        --track: #31394b;
        --dp: #75a4ff;
        --eo: #5ed0b8;
        --cua: #bd91ff;
        --trade: #ff9c5b;
        --trade-soft: #3b291f;
        --halo: #252d40;
      }
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    figure {
      margin: 0;
      background: var(--page);
    }

    h1 {
      margin: 0;
      padding: 12px 18px 4px;
      font-size: 22px;
      line-height: 1.2;
      text-align: center;
      font-weight: 750;
      letter-spacing: -0.01em;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 476px;
      background: var(--page);
    }

    .triangle {
      fill: var(--panel);
      stroke: var(--line);
      stroke-width: 2;
      stroke-linejoin: round;
    }

    .guide {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.5;
      stroke-dasharray: var(--dash);
    }

    .motion {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
    }

    .motion.dp,
    .arrow-head.dp {
      stroke: var(--dp);
      fill: var(--dp);
    }

    .motion.eo,
    .arrow-head.eo {
      stroke: var(--eo);
      fill: var(--eo);
    }

    .motion.cua,
    .arrow-head.cua {
      stroke: var(--cua);
      fill: var(--cua);
    }

    .fork {
      fill: none;
      stroke: var(--trade);
      stroke-width: 2;
      stroke-linecap: round;
    }

    .arrow-head.fork {
      fill: var(--trade);
      stroke: var(--trade);
      stroke-width: 1;
    }

    .vertex-halo {
      fill: var(--halo);
      stroke: var(--panel);
      stroke-width: 3;
    }

    .vertex-dot {
      stroke: var(--panel);
      stroke-width: 2;
    }

    .vertex-dot.dp {
      fill: var(--dp);
    }

    .vertex-dot.eo {
      fill: var(--eo);
    }

    .vertex-dot.cua {
      fill: var(--cua);
    }

    .criterion {
      fill: var(--ink);
      font-size: 16px;
      font-weight: 760;
    }

    .canonical {
      fill: var(--muted);
      font-size: 12px;
      font-weight: 560;
    }

    .arrow-label {
      fill: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .base-card,
    .center-card {
      fill: var(--panel);
      stroke: var(--line);
      stroke-width: 1.5;
    }

    .base-name {
      fill: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .base-value {
      fill: var(--ink);
      font-size: 15px;
      font-weight: 760;
    }

    .base-track {
      stroke: var(--track);
      stroke-width: 8;
      stroke-linecap: round;
    }

    .base-fill {
      stroke-width: 8;
      stroke-linecap: round;
    }

    .base-fill.dp {
      stroke: var(--dp);
    }

    .base-fill.cua {
      stroke: var(--cua);
    }

    .center-title {
      fill: var(--ink);
      font-size: 15px;
      font-weight: 760;
    }

    .center-subtitle {
      fill: var(--muted);
      font-size: 12px;
      font-weight: 560;
    }

    .trade-badge {
      fill: var(--trade-soft);
      stroke: var(--trade);
      stroke-width: 1.5;
    }

    .trade-text {
      fill: var(--trade);
      font-size: 12px;
      font-weight: 720;
    }

    .legend-text {
      fill: var(--muted);
      font-size: 12px;
      font-weight: 580;
    }

    .fallback {
      margin: 12px 18px;
      color: var(--ink);
      font-size: 15px;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-heading">
    <h1 id="diagram-heading">Трилемма групповой справедливости</h1>

    <svg id="diagram"
         viewBox="0 0 1000 440"
         width="1000"
         height="440"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="diagram-heading diagram-description">
      <desc id="diagram-description">
        Треугольник трёх конкурирующих критериев справедливости для групп
        с базовыми долями 40 из 100 и 20 из 100. Движение к одной вершине
        сопровождается расхождением двух остальных целей.
      </desc>
      <g id="scene"></g>
    </svg>

    <p id="fallback" class="fallback" hidden>
      Схема должна была показать трилемму: при базовых долях 40 из 100 и
      20 из 100 выравнивание долей решений, ошибок или надёжности решений
      обычно отдаляет систему от двух остальных критериев.
    </p>
  </figure>

  <script>
    const DATA = Object.freeze({
      math: {
        zero: 0,
        one: 1,
        two: 2,
        half: 0.5,
        tiny: 0.0001
      },
      map: {
        origin: { x: 500, y: 222 },
        scale: { x: 8.55, y: -5.15 }
      },
      center: { x: 0, y: -1 },
      vertices: [
        {
          id: "dp",
          point: { x: 0, y: 22 },
          labelAt: { x: 0, y: 29 },
          anchor: "middle",
          dx: 0,
          lines: ["Равные доли решений", "demographic parity"],
          arrowLabel: {
            point: { x: 8, y: 9 },
            anchor: "start",
            dx: 10,
            lines: ["выравниваем", "доли решений"]
          },
          others: ["eo", "cua"]
        },
        {
          id: "eo",
          point: { x: -42, y: -20 },
          labelAt: { x: -42, y: -14 },
          anchor: "end",
          dx: -10,
          lines: ["Равные ошибки", "equalized odds"],
          arrowLabel: {
            point: { x: -17, y: -5 },
            anchor: "end",
            dx: -10,
            lines: ["выравниваем", "ошибки"]
          },
          others: ["dp", "cua"]
        },
        {
          id: "cua",
          point: { x: 42, y: -20 },
          labelAt: { x: 42, y: -14 },
          anchor: "start",
          dx: 10,
          lines: ["Равная надёжность решений", "conditional use accuracy"],
          arrowLabel: {
            point: { x: 17, y: -5 },
            anchor: "start",
            dx: 10,
            lines: ["выравниваем", "надёжность"]
          },
          others: ["dp", "eo"]
        }
      ],
      baseCards: [
        {
          center: { x: -39, y: 32 },
          width: 27,
          height: 11,
          name: "ГРУППА А · БАЗОВАЯ ДОЛЯ",
          valueText: "40 из 100 подготовлены",
          value: 40,
          total: 100,
          color: "dp"
        },
        {
          center: { x: 39, y: 32 },
          width: 27,
          height: 11,
          name: "ГРУППА Б · БАЗОВАЯ ДОЛЯ",
          valueText: "20 из 100 подготовлены",
          value: 20,
          total: 100,
          color: "cua"
        }
      ],
      centerCard: {
        center: { x: 0, y: -1 },
        width: 24,
        height: 10,
        title: "Одна настройка порога",
        subtitle: "три конкурирующие цели"
      },
      motion: {
        start: 0.24,
        end: 0.77
      },
      fork: {
        start: 0.13,
        end: 0.29
      },
      arrow: {
        headLength: 1.8,
        headWidth: 1.05,
        smallHeadLength: 1.3,
        smallHeadWidth: 0.78
      },
      style: {
        cardRadius: 1.4,
        centerRadius: 1.8,
        haloRadius: 1.65,
        dotRadius: 0.82,
        dash: 1.25,
        gap: 0.9
      },
      card: {
        textX: -11.5,
        nameY: 2.7,
        valueY: -0.4,
        barY: -3.3,
        barLeft: -11.5,
        barRight: 11.5
      },
      tradeBadge: {
        center: { x: 0, y: -26.3 },
        width: 31,
        height: 5.8,
        radius: 1.8,
        text: "выбор одной цели меняет две другие"
      },
      legend: {
        y: -36.6,
        motionStart: { x: -38, y: -36.6 },
        motionEnd: { x: -31, y: -36.6 },
        motionText: { x: -29, y: -36.6 },
        forkStart: { x: 11, y: -36.6 },
        forkEnds: [
          { x: 16, y: -34.9 },
          { x: 16, y: -38.3 }
        ],
        forkText: { x: 18, y: -36.6 },
        motionLabel: "движение к выбранному равенству",
        forkLabel: "две остальные цели расходятся"
      },
      label: {
        padding: 10,
        noPadding: 0,
        lineGap: 16,
        firstShift: -4
      }
    });

    const origin = Object.freeze(DATA.map.origin);
    const scale = Object.freeze(DATA.map.scale);
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const scene = document.getElementById("scene");
      const NS = "http://www.w3.org/2000/svg";
      const M = DATA.math;

      const pxX = length => Math.abs(sx(length) - sx(M.zero));
      const pxY = length => Math.abs(sy(length) - sy(M.zero));

      function make(tag, attributes, parent = scene) {
        const node = document.createElementNS(NS, tag);
        for (const [name, value] of Object.entries(attributes)) {
          node.setAttribute(name, String(value));
        }
        parent.appendChild(node);
        return node;
      }

      function path(points, className, close = false) {
        const commands = [];
        let first = true;
        for (const point of points) {
          commands.push(
            `${first ? "M" : "L"} ${sx(point.x)} ${sy(point.y)}`
          );
          first = false;
        }
        if (close) commands.push("Z");
        return make("path", { d: commands.join(" "), class: className });
      }

      function line(from, to, className) {
        return make("line", {
          x1: sx(from.x),
          y1: sy(from.y),
          x2: sx(to.x),
          y2: sy(to.y),
          class: className
        });
      }

      function circle(point, radius, className) {
        return make("circle", {
          cx: sx(point.x),
          cy: sy(point.y),
          r: pxX(radius),
          class: className
        });
      }

      function roundedRect(center, width, height, radius, className) {
        return make("rect", {
          x: sx(center.x - width * M.half),
          y: sy(center.y + height * M.half),
          width: pxX(width),
          height: pxY(height),
          rx: pxX(radius),
          ry: pxY(radius),
          class: className
        });
      }

      function textBlock(point, lines, classNames, anchor, dx) {
        const text = make("text", {
          x: sx(point.x),
          y: sy(point.y),
          dx,
          "text-anchor": anchor,
          class: classNames
        });

        let first = true;
        for (const content of lines) {
          const span = make("tspan", {
            x: sx(point.x),
            dx,
            dy: first ? DATA.label.firstShift : DATA.label.lineGap,
            class: first ? "" : "canonical"
          }, text);
          span.textContent = content;
          first = false;
        }
        return text;
      }

      function simpleText(point, content, className, anchor, dx = DATA.label.noPadding) {
        const text = make("text", {
          x: sx(point.x),
          y: sy(point.y),
          dx,
          "text-anchor": anchor,
          "dominant-baseline": "middle",
          class: className
        });
        text.textContent = content;
        return text;
      }

      function mix(from, to, amount) {
        return {
          x: from.x + (to.x - from.x) * amount,
          y: from.y + (to.y - from.y) * amount
        };
      }

      function arrow(from, to, className, small = false) {
        line(from, to, className);

        const vx = to.x - from.x;
        const vy = to.y - from.y;
        const length = Math.max(Math.hypot(vx, vy), M.tiny);
        const ux = vx / length;
        const uy = vy / length;
        const headLength = small
          ? DATA.arrow.smallHeadLength
          : DATA.arrow.headLength;
        const headWidth = small
          ? DATA.arrow.smallHeadWidth
          : DATA.arrow.headWidth;
        const base = {
          x: to.x - ux * headLength,
          y: to.y - uy * headLength
        };
        const left = {
          x: base.x - uy * headWidth,
          y: base.y + ux * headWidth
        };
        const right = {
          x: base.x + uy * headWidth,
          y: base.y - ux * headWidth
        };

        path([to, left, right], `arrow-head ${className.split(" ").pop()}`, true);
      }

      document.documentElement.style.setProperty(
        "--dash",
        `${pxX(DATA.style.dash)} ${pxX(DATA.style.gap)}`
      );

      const vertexPoints = DATA.vertices.map(vertex => vertex.point);
      path(vertexPoints, "triangle", true);

      for (const vertex of DATA.vertices) {
        line(DATA.center, vertex.point, "guide");
      }

      const byId = new Map(DATA.vertices.map(vertex => [vertex.id, vertex]));

      for (const vertex of DATA.vertices) {
        const start = mix(DATA.center, vertex.point, DATA.motion.start);
        const end = mix(DATA.center, vertex.point, DATA.motion.end);
        arrow(start, end, `motion ${vertex.id}`);

        textBlock(
          vertex.arrowLabel.point,
          vertex.arrowLabel.lines,
          "arrow-label",
          vertex.arrowLabel.anchor,
          vertex.arrowLabel.dx
        );
      }

      for (const vertex of DATA.vertices) {
        const forkStart = mix(vertex.point, DATA.center, DATA.fork.start);
        for (const targetId of vertex.others) {
          const target = byId.get(targetId);
          const forkEnd = mix(vertex.point, target.point, DATA.fork.end);
          arrow(forkStart, forkEnd, "fork", true);
        }
      }

      for (const card of DATA.baseCards) {
        roundedRect(
          card.center,
          card.width,
          card.height,
          DATA.style.cardRadius,
          "base-card"
        );

        const left = card.center.x + DATA.card.barLeft;
        const right = card.center.x + DATA.card.barRight;
        const barY = card.center.y + DATA.card.barY;
        const filledRight =
          left + (right - left) * (card.value / card.total);

        simpleText(
          {
            x: card.center.x + DATA.card.textX,
            y: card.center.y + DATA.card.nameY
          },
          card.name,
          "base-name",
          "start"
        );

        simpleText(
          {
            x: card.center.x + DATA.card.textX,
            y: card.center.y + DATA.card.valueY
          },
          card.valueText,
          "base-value",
          "start"
        );

        line(
          { x: left, y: barY },
          { x: right, y: barY },
          "base-track"
        );
        line(
          { x: left, y: barY },
          { x: filledRight, y: barY },
          `base-fill ${card.color}`
        );
      }

      roundedRect(
        DATA.centerCard.center,
        DATA.centerCard.width,
        DATA.centerCard.height,
        DATA.style.centerRadius,
        "center-card"
      );

      simpleText(
        {
          x: DATA.centerCard.center.x,
          y: DATA.centerCard.center.y + M.one
        },
        DATA.centerCard.title,
        "center-title",
        "middle"
      );

      simpleText(
        {
          x: DATA.centerCard.center.x,
          y: DATA.centerCard.center.y - M.two
        },
        DATA.centerCard.subtitle,
        "center-subtitle",
        "middle"
      );

      for (const vertex of DATA.vertices) {
        circle(vertex.point, DATA.style.haloRadius, "vertex-halo");
        circle(vertex.point, DATA.style.dotRadius, `vertex-dot ${vertex.id}`);

        textBlock(
          vertex.labelAt,
          vertex.lines,
          "criterion",
          vertex.anchor,
          vertex.dx
        );
      }

      roundedRect(
        DATA.tradeBadge.center,
        DATA.tradeBadge.width,
        DATA.tradeBadge.height,
        DATA.tradeBadge.radius,
        "trade-badge"
      );

      simpleText(
        DATA.tradeBadge.center,
        DATA.tradeBadge.text,
        "trade-text",
        "middle"
      );

      arrow(
        DATA.legend.motionStart,
        DATA.legend.motionEnd,
        "motion dp",
        true
      );

      simpleText(
        DATA.legend.motionText,
        DATA.legend.motionLabel,
        "legend-text",
        "start",
        DATA.label.padding
      );

      for (const end of DATA.legend.forkEnds) {
        arrow(DATA.legend.forkStart, end, "fork", true);
      }

      simpleText(
        DATA.legend.forkText,
        DATA.legend.forkLabel,
        "legend-text",
        "start",
        DATA.label.padding
      );
    } catch (error) {
      document.getElementById("diagram").hidden = true;
      document.getElementById("fallback").hidden = false;
    }
  </script>
</body>
</html>
