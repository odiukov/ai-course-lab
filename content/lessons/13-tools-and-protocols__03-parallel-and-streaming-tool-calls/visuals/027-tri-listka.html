<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Три накопителя на один провод</title>
<style>
  :root{
    --bg:#fbfaf7; --fg:#1d1f24; --muted:#5c626e;
    --wire:#3c4250; --a:#1e6f9f; --b:#a05a12; --c:#2f7a4a;
    --box:#ffffff; --edge:#c3c8d2; --bad:#a13030;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14161a; --fg:#e9ecf1; --muted:#a3abb9;
      --wire:#98a2b3; --a:#5fb6e8; --b:#e0a355; --c:#68c78c;
      --box:#1d2027; --edge:#3a404b; --bad:#e8757a;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;}
  figure{margin:0;padding:12px 10px 14px;background:var(--bg);}
  h2{margin:0 0 8px;font-size:15px;font-weight:600;letter-spacing:.01em;}
  svg{display:block;width:100%;height:auto;max-height:520px;}
  .lbl{font-size:11px;fill:var(--fg);}
  .mono{font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .mut{fill:var(--muted);}
  .fail{padding:8px;color:var(--bad);font-size:13px;line-height:1.45;}
</style>
</head>
<body>
<figure>
  <h2>Один провод на входе, три накопителя на выходе</h2>
  <div id="host"></div>
</figure>
<script>
(function(){
  var host=document.getElementById('host');
  try{
    // ---- данные схемы -------------------------------------------------
    // чанки в порядке прихода по одному проводу (index, кусок arguments)
    var CHUNKS=[
      {i:1,t:'{"ci'},
      {i:0,t:'{"city": "Ben'},
      {i:1,t:'ty": "To'},
      {i:2,t:'{"ci'},
      {i:0,t:'galuru"}'},
      {i:1,t:'kyo"}'}
    ];
    // накопители: index, id, метка, полнота
    var BUF=[
      {i:0,id:'call_A',done:true, text:'{"city": "Bengaluru"}'},
      {i:1,id:'call_B',done:true, text:'{"city": "Tokyo"}'},
      {i:2,id:'call_C',done:false,text:'{"ci'}
    ];

    // ---- одна пара функций перевода ------------------------------------
    var ORIGIN={x:78,y:300}, SCALE=26;               // px за единицу
    function sx(x){ return ORIGIN.x + x*SCALE; }
    function sy(y){ return ORIGIN.y - y*SCALE; }

    var VB={w:760,h:390}, PAD=6, LW=1.4;             // литералы холста

    var NS='http://www.w3.org/2000/svg';
    var svg=document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','0 0 '+VB.w+' '+VB.h);
    svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    svg.setAttribute('role','img');

    function el(n,a){var e=document.createElementNS(NS,n);
      for(var k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
    function txt(x,y,s,cls,anchor,dx,dy){
      var t=el('text',{x:sx(x)+(dx||0),y:sy(y)+(dy||0),
        'text-anchor':anchor||'start','class':cls||'lbl'});
      t.textContent=s;return t;}
    function line(x1,y1,x2,y2,stroke,w,dash){
      var a={x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),
        stroke:stroke,'stroke-width':w||LW,'stroke-linecap':'round'};
      if(dash)a['stroke-dasharray']=dash;return el('line',a);}
    function arrow(x1,y1,x2,y2,stroke){
      line(x1,y1,x2,y2,stroke,LW);
      var ang=Math.atan2(sy(y2)-sy(y1),sx(x2)-sx(x1)),h=0.34,w=0.16;
      var bx=x2-h*Math.cos(ang), by=y2+h*Math.sin(ang);
      var px=-w*Math.sin(ang), py=-w*Math.cos(ang);
      el('polygon',{points:[sx(x2),sy(y2),sx(bx+px),sy(by+py),
        sx(bx-px),sy(by-py)].join(' '),fill:stroke});}
    function rect(x,y,w,h,stroke){
      return el('rect',{x:sx(x),y:sy(y),width:sx(x+w)-sx(x),
        height:sy(y-h)-sy(y),rx:sy(0)-sy(0.2),fill:'var(--box)',
        stroke:stroke,'stroke-width':LW});}

    el('rect',{x:0,y:0,width:VB.w,height:VB.h,fill:'var(--bg)'});
    var COL=['var(--a)','var(--b)','var(--c)'];

    // ---- провод: одна линия, чанки вперемешку --------------------------
    var x0=0, step=3.6;
    line(x0,7,x0+step*CHUNKS.length,7,'var(--wire)',LW*1.6);
    txt(x0,7,'один провод','lbl mut','start',0,-14);

    CHUNKS.forEach(function(c,k){
      var cx=x0+0.35+step*k, col=COL[c.i];
      rect(cx,7.55,2.9,1.1,col);
      txt(cx+0.15,7.15,'index='+c.i,'mono','start',0,0).setAttribute('fill',col);
      txt(cx+1.45,6.35,c.t,'mono','middle',0,0);
      line(cx+1.45,7.55,cx+1.45,7,col,LW);          // чанк сидит на проводе
    });
    txt(x0+step*CHUNKS.length,6.35,'порядок прихода','lbl mut','start',10,4);

    // ---- склейка в одну строку: мусор ---------------------------------
    var oneY=4.9;
    rect(x0,oneY+0.55,10.4,1.1,'var(--bad)');
    txt(x0+0.2,oneY+0.15,'{"ci{"city": "Benty": "To…','mono','start',0,0)
      .setAttribute('fill','var(--bad)');
    txt(x0+10.6,oneY+0.15,'одна копилка: json.loads не разберёт','lbl','start',0,0)
      .setAttribute('fill','var(--bad)');
    arrow(x0+1.2,6.9,x0+1.2,oneY+0.75,'var(--bad)');
    txt(x0+1.05,6.2,'сложить подряд','lbl','end',0,0).setAttribute('fill','var(--bad)');

    // ---- разбор по index в три накопителя ------------------------------
    var hubX=x0+13.6, hubY=7;
    line(x0+step*CHUNKS.length,hubY,hubX,hubY,'var(--wire)',LW*1.6);
    el('circle',{cx:sx(hubX),cy:sy(hubY),r:sx(0.22)-sx(0),fill:'var(--wire)'});
    txt(hubX,hubY,'разбор по index','lbl','middle',0,-14);

    var bufX=hubX+3.2, bufW=8.2;
    BUF.forEach(function(b,k){
      var y=3.3-k*1.75+ (k===0?4.4:4.4);            // 7.7 / 5.95 / 4.2
      var col=COL[b.i];
      arrow(hubX+0.3,hubY,bufX,y+0.55,col);
      rect(bufX,y+0.55,bufW,1.1,col);
      txt(bufX+0.2,y+0.15,b.id,'mono','start',0,0).setAttribute('fill',col);
      txt(bufX+2.5,y+0.15,b.text,'mono','start',0,0);
      txt(bufX+bufW+0.25,y+0.15,
        b.done?'✓ полный — разбирать':'… ждёт конца',
        'lbl','start',0,0).setAttribute('fill',b.done?col:'var(--muted)');
      txt(bufX-0.3,y+0.15,'index='+b.i,'mono','end',0,0).setAttribute('fill',col);
    });

    // ---- легенда ------------------------------------------------------
    txt(x0,2.3,'index = позывной чанка; свой накопитель на каждый вызов, '+
      'своя полнота у каждого','lbl mut','start',0,0);

    host.appendChild(svg);
    void PAD;
  }catch(e){
    host.innerHTML='<div class="fail">Схема не построилась. Она должна была '+
      'показать: куски одного стрима идут по одному проводу вперемешку '+
      '(index=1 «{"ci», index=0 «{"city": "Ben», index=1 «ty": "To»…). '+
      'Склейка всё в одну строку даёт мусор «{"ci{"city": "Benty": "To…». '+
      'Разбор по index раскладывает куски в три накопителя: call_A (index=0) '+
      'и call_B (index=1) собраны полностью и готовы к json.loads, '+
      'call_C (index=2) ещё ждёт сигнала конца.</div>';
  }
})();
</script>
</body>
</html>
