<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Три пути от запроса пользователя к серверу</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: ghostwhite;
      --panel: white;
      --ink: midnightblue;
      --muted: slategray;
      --line: lightsteelblue;
      --tool: royalblue;
      --tool-fill: aliceblue;
      --resource: seagreen;
      --resource-fill: honeydew;
      --prompt: darkorange;
      --prompt-fill: oldlace;
      --decision: lavender;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: midnightblue;
        --panel: darkslateblue;
        --ink: white;
        --muted: lightsteelblue;
        --line: slategray;
        --tool: lightskyblue;
        --tool-fill: darkslateblue;
        --resource: lightgreen;
        --resource-fill: darkslategray;
        --prompt: moccasin;
        --prompt-fill: darkslategray;
        --decision: darkslateblue;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .figure {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      padding: 12px;
      background: var(--bg);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 20px;
      line-height: 1.2;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 450px;
      background: var(--bg);
    }

    .fallback {
      padding: 16px;
      border: 2px solid var(--line);
      background: var(--panel);
      font-size: 16px;
      line-height: 1.45;
    }

    [hidden] {
      display: none;
    }

    .server-frame,
    .request-box,
    .primitive-box,
    .result-box,
    .decision-shape {
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .server-frame {
      fill: var(--panel);
      stroke: var(--line);
    }

    .request-box {
      fill: var(--panel);
      stroke: var(--ink);
    }

    .decision-shape {
      fill: var(--decision);
      stroke: var(--ink);
    }

    .primitive-box,
    .result-box {
      fill: var(--panel);
    }

    .tool-box {
      stroke: var(--tool);
      fill: var(--tool-fill);
    }

    .resource-box {
      stroke: var(--resource);
      fill: var(--resource-fill);
    }

    .prompt-box {
      stroke: var(--prompt);
      fill: var(--prompt-fill);
    }

    .connector,
    .arrow-head {
      fill: none;
      stroke: var(--line);
      stroke-width: 3px;
      stroke-linejoin: round;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .tool-arrow {
      stroke: var(--tool);
    }

    .resource-arrow {
      stroke: var(--resource);
    }

    .prompt-arrow {
      stroke: var(--prompt);
    }

    .arrow-head {
      fill: currentColor;
    }

    .tool-head {
      color: var(--tool);
      stroke: var(--tool);
    }

    .resource-head {
      color: var(--resource);
      stroke: var(--resource);
    }

    .prompt-head {
      color: var(--prompt);
      stroke: var(--prompt);
    }

    text {
      fill: var(--ink);
      font-size: 15px;
      dominant-baseline: middle;
    }

    .small {
      fill: var(--muted);
      font-size: 13px;
    }

    .title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .server-title {
      font-size: 17px;
      font-weight: 700;
    }

    .tool-text {
      fill: var(--tool);
    }

    .resource-text {
      fill: var(--resource);
    }

    .prompt-text {
      fill: var(--prompt);
    }

    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="figure" aria-labelledby="diagram-title">
    <h1 id="diagram-title">Три пути от запроса пользователя к серверу</h1>
    <div id="fallback" class="fallback">
      От пользовательского запроса идут три пути к одному серверу заметок:
      tool запускает поиск и возвращает вычисленный результат,
      resource <code>notes://note-14</code> добавляется как контекст,
      а prompt <code>/review_note</code> разворачивается в сообщения.
    </div>
    <svg id="diagram" hidden viewBox="0 0 1200 440"
      width="1200" height="440" preserveAspectRatio="xMidYMid meet"
      role="img" aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Три пути к серверу заметок</title>
      <desc id="svg-desc">
        Запрос проходит через точку выбора и направляется к tool, resource
        или prompt. Все три ветки обращаются к одному серверу заметок.
      </desc>
    </svg>
  </main>

  <script>
    const data = [
      {
        request: {
          box: [35, 165, 230, 275],
          lines: [
            { at: [132, 190], text: "Запрос", cls: "title", anchor: "middle" },
            { at: [132, 220], text: "пользователя", cls: "", anchor: "middle" },
            { at: [132, 249], text: "три похожие фразы", cls: "small", anchor: "middle" }
          ]
        },
        choice: {
          points: [[270, 220], [335, 160], [400, 220], [335, 280]],
          lines: [
            { at: [335, 194], text: "точка", cls: "small", anchor: "middle" },
            { at: [335, 220], text: "выбора", cls: "title", anchor: "middle" },
            { at: [335, 247], text: "кто и зачем?", cls: "small", anchor: "middle" }
          ]
        },
        firstArrow: {
          points: [[230, 220], [270, 220]],
          head: [[270, 220], [258, 213], [258, 227]],
          label: { at: [239, 202, 0, -8], text: "намерение запроса", anchor: "start" }
        },
        server: {
          box: [785, 24, 1160, 416],
          title: { at: [972, 43], text: "Один сервер заметок", anchor: "middle" }
        }
      },
      {
        kind: "tool",
        primitive: {
          box: [445, 53, 650, 137],
          lines: [
            { at: [468, 76], text: "tool", cls: "title tool-text", anchor: "start" },
            { at: [468, 103], text: "поиск", cls: "", anchor: "start" },
            { at: [468, 124], text: "URI заранее неизвестен", cls: "small", anchor: "start" }
          ]
        },
        inbound: {
          points: [[400, 204], [420, 95], [445, 95]],
          head: [[445, 95], [433, 88], [433, 102]]
        },
        outbound: {
          points: [[650, 95], [810, 95]],
          head: [[810, 95], [798, 88], [798, 102]],
          label: { at: [658, 73, 0, -8], text: "модель вызывает действие", anchor: "start" }
        },
        result: {
          box: [810, 60, 1135, 130],
          lines: [
            { at: [833, 82], text: "Поиск получает параметры", cls: "", anchor: "start" },
            { at: [833, 108], text: "и вычисляет результат", cls: "tool-text", anchor: "start" }
          ]
        }
      },
      {
        kind: "resource",
        primitive: {
          box: [445, 178, 650, 262],
          lines: [
            { at: [468, 201], text: "resource", cls: "title resource-text", anchor: "start" },
            { at: [468, 228], text: "notes://note-14", cls: "code", anchor: "start" },
            { at: [468, 249], text: "адрес уже известен", cls: "small", anchor: "start" }
          ]
        },
        inbound: {
          points: [[400, 220], [445, 220]],
          head: [[445, 220], [433, 213], [433, 227]]
        },
        outbound: {
          points: [[650, 220], [810, 220]],
          head: [[810, 220], [798, 213], [798, 227]],
          label: { at: [658, 198, 0, -8], text: "пользователь или host прикрепляет", anchor: "start" }
        },
        result: {
          box: [810, 185, 1135, 255],
          lines: [
            { at: [833, 207], text: "notes://note-14 читается", cls: "code", anchor: "start" },
            { at: [833, 233], text: "и добавляется как контекст", cls: "resource-text", anchor: "start" }
          ]
        }
      },
      {
        kind: "prompt",
        primitive: {
          box: [445, 303, 650, 387],
          lines: [
            { at: [468, 326], text: "prompt", cls: "title prompt-text", anchor: "start" },
            { at: [468, 353], text: "/review_note", cls: "code", anchor: "start" },
            { at: [468, 374], text: "готовый сценарий", cls: "small", anchor: "start" }
          ]
        },
        inbound: {
          points: [[400, 236], [420, 345], [445, 345]],
          head: [[445, 345], [433, 338], [433, 352]]
        },
        outbound: {
          points: [[650, 345], [810, 345]],
          head: [[810, 345], [798, 338], [798, 352]],
          label: { at: [658, 323, 0, -8], text: "пользователь запускает", anchor: "start" }
        },
        result: {
          box: [810, 310, 1135, 380],
          lines: [
            { at: [833, 332], text: "/review_note разворачивается", cls: "code", anchor: "start" },
            { at: [833, 358], text: "в готовые сообщения", cls: "prompt-text", anchor: "start" }
          ]
        }
      }
    ];

    const origin = { x: 0, y: 0 };
    const scale = { x: 1, y: 1 };

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const svg = document.getElementById("diagram");
    const fallback = document.getElementById("fallback");

    try {
      const [layout, ...lanes] = data;
      const ns = svg.namespaceURI;

      const make = (name, attributes, className) => {
        const node = document.createElementNS(ns, name);
        Object.entries(attributes).forEach(([key, value]) => {
          node.setAttribute(key, value);
        });
        if (className) node.setAttribute("class", className);
        return node;
      };

      const add = node => svg.appendChild(node);

      const box = (bounds, className) => {
        const [x1, y1, x2, y2] = bounds;
        add(make("rect", {
          x: sx(x1),
          y: sy(y1),
          width: sx(x2) - sx(x1),
          height: sy(y2) - sy(y1)
        }, className));
      };

      const polygon = (points, className) => {
        const value = points.map(point => {
          const [x, y] = point;
          return `${sx(x)},${sy(y)}`;
        }).join(" ");
        add(make("polygon", { points: value }, className));
      };

      const polyline = (points, className) => {
        const value = points.map(point => {
          const [x, y] = point;
          return `${sx(x)},${sy(y)}`;
        }).join(" ");
        add(make("polyline", { points: value }, className));
      };

      const text = item => {
        const [x, y] = item.at;
        const node = make("text", {
          x: sx(x),
          y: sy(y),
          "text-anchor": item.anchor
        }, item.cls);
        node.textContent = item.text;
        add(node);
      };

      const label = item => {
        const [x, y, dx, dy] = item.at;
        const node = make("text", {
          x: sx(x) + dx,
          y: sy(y) + dy,
          "text-anchor": item.anchor
        }, "small");
        node.textContent = item.text;
        add(node);
      };

      box(layout.server.box, "server-frame");
      layout.server.title && text(layout.server.title);

      polyline(layout.firstArrow.points, "connector");
      polygon(layout.firstArrow.head, "arrow-head");
      label(layout.firstArrow.label);

      lanes.forEach(lane => {
        const arrowClass = `${lane.kind}-arrow`;
        const headClass = `arrow-head ${lane.kind}-head`;
        polyline(lane.inbound.points, `connector ${arrowClass}`);
        polygon(lane.inbound.head, headClass);
        polyline(lane.outbound.points, `connector ${arrowClass}`);
        polygon(lane.outbound.head, headClass);
      });

      box(layout.request.box, "request-box");
      layout.request.lines.forEach(text);

      polygon(layout.choice.points, "decision-shape");
      layout.choice.lines.forEach(text);

      lanes.forEach(lane => {
        box(lane.primitive.box, `primitive-box ${lane.kind}-box`);
        lane.primitive.lines.forEach(text);
        box(lane.result.box, `result-box ${lane.kind}-box`);
        lane.result.lines.forEach(text);
        label(lane.outbound.label);
      });

      fallback.hidden = true;
      svg.hidden = false;
    } catch (error) {
      svg.hidden = true;
      fallback.hidden = false;
    }
  </script>
</body>
</html>
