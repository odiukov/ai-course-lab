- concept: совпадение смены редакции промпта с ростом доли отказов не доказывает причину, потому что вместе с ней могли измениться модель и набор инструментов
  question: После перехода агента с редакции 41 на редакцию 42 доля неудачных сессий выросла с 9% до 24%, и связь оценок с редакциями в трейсах есть. Почему из этого ещё нельзя заключить, что виновата новая редакция, и что нужно сделать, чтобы вывод стал обоснованным?
  explanation: Общие идентификаторы решают задачу атрибуции прогона к редакции, но не устраняют совместно меняющиеся факторы. Без фиксации модели и инструментов рост доли отказов остаётся корреляцией; сравнение становится доказательным только при изоляции одного изменения или при одновременном разведении версий по трафику.
  kind: open
  reference: 'Связь идентификаторов даёт сопоставимость, а не причинность. В том же окне могли поменяться модель или её версия, набор и реализация инструментов, схема выдачи в поиске, состав трафика и типы запросов пользователей. Любой из этих факторов объясняет рост 9% → 24% не хуже новой редакции. Чтобы получить вывод о причине, надо изолировать изменение: прогнать обе редакции на одном фиксированном наборе заданий при одной и той же модели и одних инструментах, либо развести их по трафику одновременно (A/B), и сравнить агрегированные оценки. Дополнительно проверяют, что метрики посчитаны на одном временном окне и одинаковом составе запросов.'
