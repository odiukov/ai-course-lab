- concept: дрейф поведения обнаруживается сравнением состава кластеров во времени и объясняет ухудшение без доступа к тексту изменений
  question: 'Объясни своими словами: как сравнение кластеров трейсов во времени показывает дрейф поведения агента, и почему такой подход полезен даже тогда, когда платформа не хранит версии промптов?'
  explanation: Дрейф — это сдвиг распределения поведения, а не единичный сбой, поэтому его видно только в сравнении срезов. Инструмент такого класса силён в релевантности RAG, дрейфе и поиске аномалий; управление версиями промптов — задача других платформ, и его отсутствие не мешает ловить массовые регрессии поведения.
  kind: open
  reference: 'Кластеры считают не один раз, а сравнивают их состав и размеры между периодами: прежние группы меняют долю, появляются новые. Растущая аномальная группа и есть дрейф поведения — сдвиг того, как агент отвечает, при внешне стабильных средних метриках. Причиной обычно оказывается обновление модели, изменение базы знаний или логики агента. Подход работает по наблюдаемым следам прогонов (автоинструментирование, например через OpenInference, отдаёт спаны без ручной разметки), поэтому не требует реестра версий промптов: он отвечает не на вопрос «какой текст изменили», а на вопрос «какой массовый след в поведении появился». Версионный контекст затем помогает связать найденный дрейф с конкретной причиной, но обнаружение от него не зависит.'
  id: 004-phoenix-3
  fingerprint: 9e4ced1a
