- concept: оценка релевантности извлечения в RAG проверяет соответствие найденных фрагментов вопросу и опору ответа на них
  question: Что именно измеряет оценка релевантности извлечения (retrieval relevancy) в RAG-конвейере?
  explanation: 'Провал в RAG часто происходит на шаге извлечения, а не генерации: модель рассуждает складно, но по чужому документу — например, отвечает про гарантийный ремонт, найдя правило о возврате товара. Поэтому релевантность извлечения оценивают отдельно от качества формулировки: подходят ли фрагменты к вопросу и есть ли у ответа опора в них.'
  kind: choice
  options:
    - Задержку векторного поиска и пропускную способность индекса
    - Связность и грамматическую гладкость сформулированного ответа
    - Насколько найденные фрагменты подходят к заданному вопросу и опирается ли ответ именно на них
    - Сколько токенов контекста израсходовано на подстановку документов
  correct: 2
