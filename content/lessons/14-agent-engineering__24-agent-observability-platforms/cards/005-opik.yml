- concept: LLM-судья ловит галлюцинацию, проверяя опору утверждений ответа на переданный источник, а не их правдоподобие
  question: LLM-судья оценивает ответ RAG-системы на галлюцинации. Какая проверка отличает галлюцинацию от корректного ответа?
  explanation: 'Галлюцинация — уверенное утверждение, которого нет в источнике. Судья проверяет grounding: опору на переданный контекст. Уверенность тона и складность — не признаки истинности, скорее наоборот: правдоподобная выдумка опаснее.'
  kind: choice
  options:
