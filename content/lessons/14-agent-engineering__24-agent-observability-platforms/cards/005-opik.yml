- concept: guardrails применяются к выходу до отдачи пользователю и блокируют известные риски, тогда как оценки только измеряют качество постфактум
  question: Эксперимент выбрал лучший промпт, а судья измерил долю галлюцинаций. Зачем поверх этого нужны guardrails, и чем их роль отличается от роли оценок?
  explanation: 'Ключевое различие — момент и эффект: оценка постфактум и не влияет на выдачу, guardrail в момент выдачи и меняет или блокирует её. Одно не заменяет другое.'
  kind: open
  reference: 'Оценки измеряют: они считают метрики по прогонам и говорят, какая версия лучше и где слабые места, но ничего не меняют в ответе, который получит пользователь. Guardrails действуют в рантайме на пути выдачи: до отправки ответа вырезают персональные данные, обрезают запрещённые темы или останавливают диалог. Даже лучший по метрикам промпт остаётся вероятностным и иногда выдаёт опасный ответ, поэтому известные риски закрывают детерминированным фильтром, а не надеждой на среднюю оценку. Вместе получается цикл: эксперимент улучшает промпт, оценки находят слабые места, guardrails не дают уже известным рискам дойти до пользователя.'
