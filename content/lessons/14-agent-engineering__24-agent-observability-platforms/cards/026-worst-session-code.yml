- concept: лексикографический кортеж запрещает компенсацию между признаками, взвешенная сумма её допускает
  question: 'Вместо кортежа `(guardrail_hits, -score, latency_ms)` предлагают ранжировать сессии одним скалярным баллом: нормировать три признака в диапазон 0–1 и сложить с весами. Объясни своими словами, что меняется в выборе худшей сессии при таком переходе и почему это важно для очереди расследования.'
  explanation: 'Разница между моделями агрегации: лексикографический порядок = жёсткая иерархия признаков без обмена одного на другой; взвешенная сумма = обмен разрешён по курсу, заданному весами. Для очереди разбора инцидентов обмен опасен — событие безопасности не должно вытесняться накопленной медленностью.'
  kind: open
  reference: 'Кортеж задаёт строгий приоритет: признак с меньшим приоритетом влияет только при полном равенстве старших, поэтому сработавший guardrail нельзя перевесить никакой комбинацией остальных значений. Взвешенная сумма делает признаки взаимозаменяемыми: накопление мелких отклонений (например, большая задержка плюс средняя оценка) может дать балл выше, чем у сессии с реальным нарушением guardrail, и та уйдёт вниз очереди. Плюс сумма зависит от нормировки и подбора весов, то есть порядок сессий меняется при смене шкалы, тогда как лексикографическое сравнение к монотонным преобразованиям отдельных признаков устойчиво. Сумма уместна, когда признаки действительно сопоставимы и компенсация допустима; для приоритизации по серьёзности отказа нужен именно запрет компенсации.'
  id: 026-worst-session-code-3
  fingerprint: 7a29c839
