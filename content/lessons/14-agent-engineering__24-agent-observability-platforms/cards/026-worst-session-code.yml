- concept: 'лексикографическое сравнение кортежа: младшие элементы ключа влияют только при равенстве старших'
  question: 'Ключ сравнения сессий — `(guardrail_hits, -score, latency_ms)`, худшей считается сессия с максимальным ключом. Сессия A: guardrail сработал 1 раз, оценка 7 из 10, задержка 3000 мс. Сессия B: guardrail не срабатывал, оценка 1 из 10, задержка 40000 мс. Какая сессия попадёт наверх очереди расследования?'
  explanation: 'Кортежи сравниваются лексикографически: сначала первые элементы, и только при их равенстве идёт переход ко вторым, потом к третьим. У A первый элемент 1, у B — 0, сравнение заканчивается сразу, и ни оценка 1 из 10, ни 40000 мс до сравнения не доходят. Порядок полей в ключе и есть явно записанная политика приоритетов; масштаб чисел на исход не влияет.'
  kind: choice
  options:
    - A — у неё сработал guardrail, а этот элемент кортежа старший и решает исход независимо от остальных полей
    - B — у неё и оценка вдвое хуже, и задержка на порядок больше, суммарно она проигрывает по двум признакам из трёх
    - B — задержка 40000 мс это самый крупный числовой признак в обеих сессиях, он и доминирует в сравнении
    - 'Ни одна: признаки противоречат друг другу, и сравнение кортежей вернёт ошибку'
  correct: 0
