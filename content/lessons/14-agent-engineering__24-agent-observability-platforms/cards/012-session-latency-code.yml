- concept: задержка сессии вычисляется через min/max временных отметок, поэтому не зависит от позиции спанов в списке
  question: 'Хранилище отдаёт спаны сессии в произвольном порядке: первым в списке может лежать спан, начавшийся последним. Какая реализация даёт верную задержку сессии независимо от этого порядка?'
  explanation: 'Порядок приёма спанов произволен: параллельные и вложенные операции завершаются вразнобой, а хранилище не гарантирует сортировку. Обращение к spans[0] и spans[-1] делает результат функцией случайного порядка элементов. Агрегаты min и max перебирают все спаны и дают один и тот же ответ при любой перестановке.'
  kind: choice
  options:
    - max(s["end_ms"] for s in spans) - min(s["start_ms"] for s in spans)
    - spans[-1]["end_ms"] - spans[0]["start_ms"]
    - sum(s["end_ms"] - s["start_ms"] for s in spans)
    - spans[0]["end_ms"] - spans[0]["start_ms"]
  correct: 0
  id: 012-session-latency-code-1
  fingerprint: 00ca76e7
- concept: пустой набор спанов не имеет измеримого интервала, и функция задержки возвращает нейтральное числовое значение вместо исключения
  question: В функцию расчёта задержки сессии пришёл пустой список спанов. Какое поведение предпочтительно для метрики, которая дальше идёт в агрегаты дашборда?
  explanation: min и max по пустой последовательности падают, поэтому граничный случай обрабатывается отдельно. Исключение ломает расчёт сводки из-за одной пустой сессии, а None заставляет каждого потребителя метрики проверять тип перед сложением и сортировкой. Ноль честно отражает отсутствие измеримой рамки и остаётся числом.
  kind: choice
  options:
    - 'Вернуть ноль: измеримого интервала нет, а числовой тип сохраняется для агрегации без специальной обработки'
    - 'Бросить исключение: пустая сессия — это ошибка приёма, и дашборд должен упасть'
    - Вернуть None, чтобы сборщик сводки сам решал, что делать с пропуском
    - Вернуть текущее время, чтобы сессия попала в конец временной шкалы
