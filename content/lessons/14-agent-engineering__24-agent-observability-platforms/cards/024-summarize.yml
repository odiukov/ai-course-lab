- concept: воспроизводимость сводки требует полного детерминированного порядка ключей, включая тай-брейк при равных частотах
  question: Топ категорий отказа сортируется по убыванию частоты, но при равных частотах порядок скачет от запуска к запуску и ломает тесты. Чем дополнить ключ сортировки?
  explanation: 'Сортировка только по -частоте оставляет равные элементы в порядке поступления из словаря, а он зависит от порядка обхода данных. Второй компонент ключа — имя категории — задаёт полный порядок: одинаковый вход всегда даёт одинаковый вывод, и сводку можно сравнивать между прогонами и проверять тестом на точное совпадение.'
  kind: cloze
