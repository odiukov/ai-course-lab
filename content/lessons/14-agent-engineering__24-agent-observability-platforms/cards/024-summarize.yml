- concept: категории причин отказа — многозначная разметка, поэтому сумма их частот не обязана совпадать с числом провалившихся сессий
  question: В сводке 18 провалившихся сессий, а сумма частот по категориям причин отказа равна 25. Что это означает?
  explanation: 'Одна сессия может одновременно сработать по guardrail и получить низкую уверенность судьи — тогда она даёт вклад в две категории. Разметка многозначная, поэтому сумма частот ≥ числу отказов. Нормировать эти частоты в проценты «от 100%» нельзя: доли будут суммироваться больше единицы.'
  kind: choice
  options:
    - 'Ошибка в подсчёте: сумма частот категорий обязана равняться числу отказов'
