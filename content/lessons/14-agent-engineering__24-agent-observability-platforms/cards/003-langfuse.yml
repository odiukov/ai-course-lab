- concept: повтор сессии восстанавливает ход диалога для расследования, а не отправляет новых сообщений и не перезапускает модель
  question: Инженер включает повтор сессии (session replay) в платформе наблюдаемости LLM-агента. Что при этом происходит?
  explanation: 'Повтор сессии — это просмотр уже записанного хода событий: реплики, вызовы инструментов, ответы модели в исходной последовательности. Никаких новых вызовов модели и никакой отправки сообщений пользователю не происходит, откат промпта — отдельное действие. Смысл — восстановить контекст расследования.'
  kind: choice
  options:
    - Диалог и связанные действия последовательно воспроизводятся из записи в том порядке, в котором происходили
    - Модель заново вызывается на тех же входах, и генерируются свежие ответы
    - Пользователю повторно отправляются сообщения агента для подтверждения жалобы
    - Промпт автоматически откатывается на предыдущую сохранённую редакцию
  correct: 0
  id: 003-langfuse-1
  fingerprint: 1d41f2e3
- concept: в многошаговом диалоге сбой часто зарождается раньше видимой ошибки, потому что неверное утверждение остаётся в контексте
  question: 'Агент поддержки дал неверный ответ на 6-й реплике. Трейс именно этой реплики выглядит нормально: инструкция та, что ожидалась, параметры штатные, инструмент вернул корректные данные. Что чаще всего показывает просмотр всей сессии целиком?'
  explanation: Диалоговый агент получает предыдущие реплики как часть входа. Неверное обещание или неверный факт, попавший в контекст на ранней реплике, дальше воспринимается моделью как данность. Поэтому одиночный трейс «плохого» ответа выглядит чистым, а причина видна только на уровне всей сессии.
  kind: choice
  options:
    - Ошибочное утверждение появилось раньше и осталось в контексте, поэтому последующие реплики опирались на него
    - Модель случайно сгенерировала ошибку именно на 6-й реплике, и предыстория здесь не важна
    - Причина всегда в параметрах вызова, а не в содержимом предыдущих сообщений
    - 'Сессия не влияет на ответ: каждый вызов модели независим от предыдущих реплик'
  correct: 0
  id: 003-langfuse-2
  fingerprint: cda4069f
- concept: версия промпта — зафиксированный снимок конкретной редакции инструкции, а не указатель на её текущий текст
  question: В системе управления промптами запуск помечен версией 42. Что означает эта пометка?
  explanation: 'Версия фиксирует содержимое, а не указывает на «сейчас действующий» текст: иначе после следующей правки старый запуск показывал бы уже другую инструкцию. Именно неизменяемость снимка позволяет открыть различия версий 42 и 41 и проверить, какая правка изменила поведение.'
  kind: choice
  options:
    - Сохранённый снимок конкретной редакции инструкции — именно того текста, который ушёл модели в этом запуске
    - Порядковый номер запуска агента за текущие сутки
    - Ссылку на актуальный текст промпта, который подтягивается при каждом открытии запуска
    - Число правок, внесённых в промпт разными авторами за всё время
  correct: 0
