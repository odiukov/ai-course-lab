- concept: показатели дашборда сопоставимы только если посчитаны на одном временном окне и одной версии агента
  question: 'Дашборд показывает четыре плитки: доля отказов за последние сутки, оценки судьи, усреднённые за 30 дней, задержка, снятая на предыдущей версии агента, и категории причин отказов за сутки. Что здесь принципиально неверно?'
  explanation: 'Плитки рядом читаются как срез одной системы. Когда доля отказов свежая, оценки размазаны по месяцу, а задержка вообще с прежней версии, любой вывод о влиянии обновления недействителен: изменения новой версии растворены в старых данных. Первое требование к дашборду — общий период и общая версия для всех четырёх чисел.'
  kind: choice
  options:
    - Показатели посчитаны на разных окнах и разных версиях, поэтому их нельзя читать как описание одного состояния системы
    - Оценки судьи нельзя усреднять дольше суток, потому что рубрика теряет силу
    - Задержку вообще нельзя выводить рядом с качественными метриками
    - Категорий причин отказов недостаточно — нужны ещё длительности отдельных спанов
  correct: 0
  id: 023-dashboard-summary-2
  fingerprint: 761621ef
- concept: четыре метрики дашборда несводимы друг к другу, потому что отвечают на разные вопросы, и хороший показатель по одной оси не компенсирует провал по другой
  question: Почему минимальный дашборд агента состоит из четырёх показателей — доли отказов, категорий причин, распределения оценок и задержки — и почему ни один из них нельзя выкинуть, оставив остальные?
  explanation: 'Разбиение по четырём вопросам — сколько, почему, насколько хорошо, насколько быстро — и есть критерий минимальности: показателей ровно столько, сколько независимых вопросов о работе агента. Метрики не заменяют друг друга, а закрывают разные слепые зоны.'
  kind: open
  reference: 'Каждый показатель отвечает на свой вопрос: доля отказов — сколько сессий сломалось, категории причин — почему, распределение оценок — насколько хороши те ответы, которые формально не провалились, задержка — сколько ждал пользователь. Ни один не выводится из другого. Агент может держать долю отказов около нуля и при этом выдавать посредственные ответы (видно только по распределению оценок) или отвечать правильно, но так медленно, что им перестают пользоваться (видно только по задержке). Наоборот, низкая задержка ничего не говорит о качестве. Убрав любую плитку, теряешь целый класс сбоев, который остальные три показателя не детектируют.'
  id: 023-dashboard-summary-3
  fingerprint: 87e3680c
