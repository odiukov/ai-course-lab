  question: Сессия определена как весь диалог пользователя. Он отправил сообщение, получил ответ, ушёл на 7 минут, вернулся и дописал ещё два сообщения. Что произойдёт с задержкой этой сессии и как её корректно интерпретировать?
  explanation: Метрика считается по крайним точкам сессии, поэтому простой между сообщениями попадает внутрь интервала. Это законный ответ на вопрос «сколько прошло от начала до конца пути», но если назвать это временем работы модели, перерыв пользователя будет выглядеть как торможение агента. Отсюда требование заранее зафиксировать, что считается сессией.
  kind: choice
