  question: Задержка сессий выросла, и нужно понять, что чинить. Объясни своими словами, зачем держать одновременно две метрики — длительности отдельных спанов и задержку всей сессии — и на какой вопрос отвечает каждая.
  explanation: 'Две метрики отвечают на разные вопросы: «какой компонент тормозит» и «сколько ждал пользователь». Связать спаны в одну сессию позволяет session_id, записанный при приёме спана.'
