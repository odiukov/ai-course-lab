  reference: 'Длительность спана показывает, сколько работал конкретный компонент (вызов модели, поиск, инструмент), и позволяет найти узкое место внутри прогона. Задержка сессии — интервал от начала самого раннего спана до конца самого позднего — показывает, сколько ждал человек, и именно она соответствует пользовательскому опыту. Одна не выводится из другой: из-за перекрытия параллельных операций сумма спанов не равна задержке сессии, а самый долгий спан может быть спрятан внутри другого и не влиять на общее время. Диагностика идёт по спанам, отчётность о качестве сервиса — по сессии.'
