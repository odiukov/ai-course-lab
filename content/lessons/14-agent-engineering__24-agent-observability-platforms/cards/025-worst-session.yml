- concept: худшая сессия для расследования определяется совокупностью признаков неудачи, а не экстремумом одной метрики производительности
  question: 'В окне дашборда две сессии. Сессия A: длительность 18 секунд, оценка судьи 5 из 5, guardrails не срабатывали. Сессия B: длительность 3 секунды, оценка судьи 2 из 5, категория отказа «галлюцинация», сработал guardrail на выходе. С какой сессии разумнее начать расследование роста доли отказов и почему?'
  explanation: «Худшая» — это максимум признаков неудачи (низкая оценка судьи, категория отказа, срабатывание guardrail), а не максимум задержки. Медленный прогон может закончиться верным ответом, и он не объясняет рост доли отказов. Случайная сессия рискует оказаться нормальной и увести расследование в сторону.
  kind: choice
  options:
    - С сессии A — она дольше всех, значит содержит самый тяжёлый сбой
    - С сессии B — в ней сошлись несколько независимых признаков неудачи, хотя она быстрая
    - С любой случайной сессии окна — так выборка будет непредвзятой
    - С сессии A — низкая оценка судьи в B объясняется её короткой длительностью
  correct: 1
  id: 025-worst-session-1
  fingerprint: 38fd2cf9
- concept: расследование идёт от агрегата к отдельному эпизоду и лишь затем к точке зарождения ошибки
  question: Расставьте шаги расследования всплеска отказов в наблюдаемости агента в правильном порядке.
  explanation: Сводка задаёт масштаб, но не сюжет. Ранжирование превращает поток сессий в очередь расследования, чтение эпизода целиком восстанавливает последовательность (инструмент не нашёл источник — агент всё равно ответил уверенно — судья снизил оценку), и только после этого локализуется точка зарождения ошибки.
  kind: order
  items:
    - 'Зафиксировать по сводке аномалию: рост доли отказов и преобладающую категорию причины'
    - Отранжировать сессии окна по силе признаков неудачи и выбрать верхнюю
    - 'Прочитать выбранную сессию целиком: запрос, ответы, вызовы инструментов, оценки, категорию отказа'
    - Определить шаг, на котором ошибка зародилась, и сформулировать гипотезу о причине
  id: 025-worst-session-2
  fingerprint: b7190bfe
- concept: выбор худшей сессии — приоритизация очереди расследования, а не вывод о типичном поведении агента
  question: Объясните своими словами, почему разбор худшей сессии не даёт права утверждать, что найденный в ней сбой объясняет всё падение качества, и что нужно сделать после разбора.
  explanation: 'Отбор по максимуму признаков неудачи — смещённая выборка размером один. Её ценность в скорости: она соединяет метрику с реальным поведением агента и даёт направление. Подтверждение масштаба всегда возвращается к агрегатам по всему окну.'
  kind: open
  reference: 'Худшая сессия — это один экстремальный случай, отобранный именно по силе признаков неудачи, поэтому она заведомо не репрезентативна для всей популяции сессий. Она быстро показывает правдоподобную цепочку сбоя, то есть даёт гипотезу, а не диагноз. Чтобы перейти от гипотезы к выводу, найденный шаблон надо проверить на остальных провалившихся сессиях окна: посчитать, в какой доле отказов встречается тот же признак, и сопоставить с категориями причин. Если шаблон покрывает лишь малую часть отказов, остальная очередь расследуется дальше.'
  id: 025-worst-session-3
  fingerprint: 4e3d7731
