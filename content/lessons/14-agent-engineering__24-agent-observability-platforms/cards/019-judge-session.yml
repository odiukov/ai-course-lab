- concept: провал оценивания и низкое качество агента — разные исходы, и повреждённый ответ судьи нельзя приводить к оценке
  question: 'Судья вернул структуру, не проходящую проверку: оценка 9 при верхней границе рубрики 6. Объясни своими словами, почему функция обязана вернуть явный признак ошибки оценивания, а не привести значение к границе и не выдать низкий балл.'
  explanation: 'Валидация отвечает на вопрос «доверяем ли мы измерению», а не «хорош ли ответ». Смешение этих исходов ломает обе метрики сразу: качество агента занижается, а поломка оценщика перестаёт быть заметной.'
  kind: open
  reference: 'Оценка 9 вне шкалы означает, что мерительный прибор сломался, а не что агент отработал плохо. Если подменить её низким баллом, сбой судьи попадёт в те же агрегаты, что и настоящие провалы: доля отказов вырастет, дашборд покажет ложную регрессию, а расследование пойдёт в сторону агента вместо конвейера оценивания. Приведение к границе (9 стало 6) ещё хуже: оно молча фабрикует правдоподобный вердикт, которого судья не выносил, и ошибка становится невидимой. Явный результат ошибки позволяет вызывающему коду исключить сессию из статистики качества, посчитать её в отдельной метрике надёжности судьи и при необходимости повторить запрос.'
