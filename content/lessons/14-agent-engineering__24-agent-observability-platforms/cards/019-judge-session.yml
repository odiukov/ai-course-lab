- concept: 'оценивание сессии — конвейер с обязательным порядком: сбор и упорядочивание доказательств, обезличивание, запрос с рубрикой, проверка структуры, только потом вердикт'
  question: Расставь шаги функции, оценивающей одну сессию LLM-судьёй, в правильном порядке.
  explanation: 'Каждый шаг опирается на итог предыдущего. Пустую сессию отсекают до формирования запроса — модели нечего оценивать, и вердикт по пустоте был бы вымыслом. Обезличивание стоит до отправки, иначе исходные персональные данные уже ушли наружу. Проверка структуры идёт до возврата: непроверенный ответ нельзя выдавать за оценку.'
  kind: order
  items:
    - Отобрать спаны с нужным session_id и упорядочить их по времени начала
    - Прервать работу с явным результатом ошибки, если подходящих спанов не нашлось
    - 'Собрать компактное досье: запрос пользователя, действия и результаты инструментов, источники, итоговый ответ'
    - Пропустить текст досье через обезличивание перед отправкой внешней модели
    - Составить запрос с описанием сценария, рубрикой и досье, потребовав структурированный ответ
    - Проверить структуру ответа судьи и допустимость значений полей
    - Вернуть оценку, уверенность и обоснование либо явный результат ошибки оценивания
