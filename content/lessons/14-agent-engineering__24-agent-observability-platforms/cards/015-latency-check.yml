- concept: значение высокого перцентиля переводится в абсолютное число затронутых сессий через объём трафика
  question: Агент обрабатывает 40000 сессий в сутки, p99 задержки равен 6 секундам. Сколько сессий в сутки длятся дольше 6 секунд?
  explanation: 'p99 — граница, выше которой лежит 1% наблюдений: 40000 × 0.01 = 400 сессий в сутки. Такой пересчёт превращает «хвост» из абстракции в число реальных пользователей и показывает, стоит ли хвост работы.'
  kind: numeric
  answer: 400
  tolerance: 1
  id: 015-latency-check-2
  fingerprint: ef2f22ea
- concept: медиана и высокий перцентиль задают два независимых требования — на скорость и на предсказуемость, и одно не заменяет другое
  question: Почему целевые значения задержки задают отдельно для медианы и отдельно для высокого перцентиля, а не одним порогом?
  explanation: 'Медиана и хвост меняются независимо: оптимизация может ускорить типичный путь и одновременно удлинить редкий (например, добавив ретрай). Раздельные пороги фиксируют оба требования и не дают обменять одно на другое молча.'
  kind: open
  reference: 'Это два разных свойства. Медиана описывает типичную сессию — скорость обычного пользователя. Высокий перцентиль описывает худшие сессии — предсказуемость сервиса. Один порог по медиане пропускает ситуацию, где типичный опыт хорош, но часть пользователей ждёт в разы дольше; один порог по хвосту не заметит, что обычная сессия стала медленнее, если хвост не изменился. Два порога вместе означают: релиз проходит, только если и типичная сессия быстрая, и худшие остаются в допустимых рамках.'
  id: 015-latency-check-3
  fingerprint: 85a641aa
