- concept: персональные данные встречаются во всех полях спана, включая аргументы инструментов, результаты поиска, ошибки и метаданные
  question: Команда обезличивает пользовательские сообщения перед записью трейсов, но утечки персональных данных в хранилище продолжаются. Где искать причину в первую очередь?
  explanation: 'Обезличивание одного поля с текстом запроса ничего не даёт: то же имя уезжает в аргументе `send_email`, в извлечённом документе, в сообщении об ошибке и в пользовательских метаданных. Редакция применяется ко всем полям спана. Идентификаторы и временные отметки персональных данных не несут.'
  kind: choice
  options:
    - В аргументах вызовов инструментов, фрагментах RAG-выдачи, текстах исключений и метаданных спанов
    - В идентификаторах трейсов и спанов, которые генерируются платформой
    - В отметках времени начала и конца спанов
    - В агрегированных метриках задержки на дашборде
