  fingerprint: a3779793
- concept: стабильные маркеры для одинаковых значений внутри трейса сохраняют связи между сущностями, не раскрывая личность
  question: Агент перепутал два адреса получателя. Какой способ обезличивания трейса позволит LLM-судье установить факт путаницы?
  explanation: Судье и расследованию нужна структура отношений, а не сами значения. Стабильное соответствие «значение — маркер» внутри трейса показывает, что в запросе фигурировал [EMAIL_1], а вызов инструмента ушёл на [EMAIL_2]. Единый маркер для всех адресов и случайные маркеры разрушают эту связь, удаление — тем более.
  kind: choice
  options:
    - Вырезать все строки, похожие на адреса, оставив пропуски
    - Заменять каждое вхождение адреса случайным маркером, новым при каждом вхождении
    - 'Заменять одинаковые значения одинаковыми маркерами в пределах трейса: [EMAIL_1], [EMAIL_2]'
    - Заменять все адреса единым маркером [EMAIL] без различения
  correct: 2
