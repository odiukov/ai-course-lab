- concept: низкая релевантность извлечения относит сбой к этапу поиска, поэтому правка промпта генерации его не устраняет
  question: RAG-агент отвечает неполно. Метрика релевантности извлечения показывает, что нужные фрагменты в контекст вообще не попадают. Объясни своими словами, почему переписывание промпта генерации не починит ответы, и куда направить работу.
  explanation: Разделение вины между поиском и генерацией — главное, ради чего меряют RAG relevancy отдельно от качества ответа. Без этой метрики команда неделями крутит формулировки промпта, тогда как сломан retrieval.
  kind: open
  reference: 'Релевантность извлечения оценивает соответствие найденного контекста запросу, то есть отвечает за этап до генерации. Если нужного фрагмента в контексте нет, модель физически не может на него опереться — любой промпт генерации будет работать с неполным входом и в лучшем случае честно скажет о недостатке данных, в худшем додумает. Работа идёт в поиск: запрос к индексу, разбиение на чанки, эмбеддинги, число возвращаемых фрагментов, переранжирование. Промпт генерации трогают только после того, как метрика извлечения показала, что нужный контекст доходит.'
  id: 028-final-quiz-2
  fingerprint: 76b38ee2
