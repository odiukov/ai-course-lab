- concept: замена срабатывает для всех вхождений шаблона в строке, а не только для первого
  question: В строке трейса может быть несколько телефонов подряд. Дополни вызов так, чтобы заменились все совпадения, а не одно.
  explanation: 'В re.sub аргумент count ограничивает число замен; count=0 означает «без ограничения», то есть заменить все вхождения. count=1 оставит второй и третий номер в открытом виде — обезличивание частичное, а значит бесполезное: связаться с человеком по строке всё ещё можно.'
  kind: cloze
  template: text = re.sub(PHONE_RE, "[PHONE]", text, count=___)
  answer: '0'
  accept:
    - '0'
    - count=0
    - нуль
    - ноль
  id: 017-redact-pii-1
  fingerprint: cdb6e9e4
- concept: слишком широкий класс символов в шаблоне поглощает соседнюю пунктуацию и текст вместе с персональными данными
  question: 'Для поиска email используют шаблон \S+@\S+ . Его применяют к строке: «пиши на bob@mail.ru, спасибо». Что окажется в результате замены на [EMAIL]?'
  explanation: \S — это «любой непробельный символ», включая запятую и точку. Жадный \S+ после @ дотянется до пробела и заберёт запятую внутрь совпадения. Строка после замены теряет пунктуацию, а при более длинных хвостах — и части осмысленного текста. Поэтому классы символов в шаблонах для email и телефона задают явным перечислением допустимых символов, а не через \S.
  kind: choice
  options:
    - «пиши на [EMAIL] спасибо» — вместе с адресом исчезнет запятая, потому что \S+ захватывает любые непробельные символы
    - «пиши на [EMAIL], спасибо» — запятая не входит в совпадение, так как \S не включает пунктуацию
    - 'Совпадений не будет: \S+@\S+ требует явного указания домена верхнего уровня'
    - Будет заменена вся строка целиком, потому что \S+ жадный и идёт до конца текста
  correct: 0
  id: 017-redact-pii-2
  fingerprint: 8439a949
- concept: регулярные выражения покрывают только категории данных с устойчивой синтаксической структурой, поэтому такой фильтр не даёт гарантии полноты обезличивания
  question: Почему обезличивание на регулярных выражениях надёжно ловит email и телефоны, но его нельзя расширить тем же способом на имена людей и почтовые адреса? Объясни своими словами.
  explanation: Границу задаёт не сложность шаблона, а наличие у категории данных формальной структуры. Расширять regex на имена бессмысленно — он либо пропустит большинство, либо начнёт стирать обычные слова и сделает трейс нечитаемым для расследования.
  kind: open
  reference: 'Email и телефон имеют устойчивую синтаксическую форму: обязательный символ @ и доменная часть, фиксированные группы цифр с разделителями и опциональным кодом страны. Эту форму можно описать шаблоном, и опознание не зависит от смысла окружающего текста. Имя человека и почтовый адрес такой формы не имеют — «Орлов» неотличим от фамилии, топонима и обычного слова без учёта контекста, а адрес складывается из произвольных слов. Их распознавание требует модели, разбирающей контекст (NER), а не сопоставления с шаблоном. Практический вывод: regex-фильтр даёт надёжное покрытие только по перечисленным форматам и не является доказательством того, что в строке не осталось персональных данных; для остальных категорий нужны либо другие механизмы, либо запрет на попадание таких полей в трейс на источнике.'
  id: 017-redact-pii-3
  fingerprint: 9948ff06
