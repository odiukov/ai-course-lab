- concept: два независимых показателя опроса нельзя перемножать или вычитать в вывод о причинной связи
  question: 'В отраслевом опросе два числа: наблюдаемость агентов внедрена у 76% организаций, а 41% респондентов называют качество ответов главным барьером в продакшене. Коллега делает вывод: «Значит, наблюдаемость не работает — она провалилась минимум в 41% случаев». Объясни своими словами, что не так с этим выводом и какой вывод из этих чисел допустим.'
  explanation: 'Типичная ошибка — соединять две несвязанные доли в одно утверждение о причине. Такие числа корректно читать как описание состояния отрасли: инструменты наблюдения распространены, проблема качества сохраняется. Чтобы утверждать эффект, нужно сравнение до/после на одном и том же наборе критериев внутри одной команды.'
  kind: open
  reference: 'Это два разных показателя, посчитанных на разных основаниях и по разным вопросам: доля внедривших наблюдаемость и доля назвавших качество главным барьером. Пересечение групп неизвестно, поэтому 41% нельзя приписать внедрениям, и вычитать одно из другого тоже нельзя. Опрос даёт срез, а не сравнение с контрольной группой без наблюдаемости, так что причинной связи он не показывает вовсе: возможно, что как раз внедрившие наблюдаемость лучше видят проблемы качества и потому чаще о них сообщают. Допустимый вывод слабее и всё равно полезен: широкое распространение инструментов наблюдения сосуществует с тем, что качество остаётся главным барьером, то есть наличие трассировки само по себе не гарантирует его роста.'
