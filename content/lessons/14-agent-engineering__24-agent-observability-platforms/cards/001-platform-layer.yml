- concept: платформа наблюдаемости добавляет к стандартизованным спанам хранение, сборку запусков, версионный контекст и сравнение групп
  question: 'Команда уже экспортирует спаны агента по схеме OTel GenAI: имена атрибутов единообразны, задержки и вызовы инструментов записаны. Что из этого схема сама по себе НЕ обеспечивает?'
  explanation: 'Схема задаёт форму записи: какие атрибуты и как называются, как спан связан с родителем. Она не хранит историю, не собирает спаны в целые запуски агента, не помнит версию промпта и не умеет сравнивать когорты. Это работа платформы: приём, персистентность, группировка сопоставимых случаев и подъём регрессий.'
  kind: choice
  options:
    - Единый набор атрибутов для запросов к модели и вызовов инструментов
    - Хранение истории запусков и сравнение групп запусков между версиями промпта
    - Связь спана с родительским спаном через контекст трассировки
    - Запись задержки и токенов на уровне отдельного вызова модели
  correct: 1
  id: 001-platform-layer-1
  fingerprint: d6b54770
- concept: порядок работ, превращающий поток спанов в вывод о регрессии после смены версии промпта
  question: Расставь этапы, которыми платформа наблюдаемости превращает сырые спаны в вывод «правка промпта ухудшила агента».
  explanation: 'Каждый этап опирается на предыдущий. Без сборки в запуск оценивать нечего: качество определяется исходом обращения, а не одним вызовом модели. Без версионного контекста нечего разделять на когорты. Без одинакового отбора сравнение путает разницу версий с разницей трафика. Без одинакового оценщика числа несопоставимы.'
  kind: order
  items:
    - Собрать спаны одного обращения в целый запуск агента по контексту трассировки
    - 'Приписать каждому запуску контекст версии: какой промпт и какая модель его породили'
    - Отобрать сопоставимые запуски — похожие запросы, один сценарий — по обе стороны от правки
    - 'Прогнать по обеим когортам одни и те же оценки: автоматические проверки, сигналы пользователей, разметку человека'
    - Сравнить распределения оценок между когортами и поднять регрессию, если новая стабильно хуже
  id: 001-platform-layer-2
  fingerprint: 9142d2a2
- concept: без записанного версионного контекста ухудшение качества невозможно приписать конкретному изменению
  question: Платформа хранит все запуски агента за квартал и умеет их оценивать, но версия системного промпта нигде в метаданных не сохраняется. Объясни своими словами, что именно ломается в поиске регрессии и как это чинится.
  explanation: Регрессия — это ухудшение относительно прежнего поведения, значит нужны две сопоставимые группы и признак, по которому их делят. Версия промпта и есть этот признак; без неё платформа даёт агрегаты, но не даёт основания для решения «оставить или откатить».
  kind: open
  reference: 'Оценки покажут, что доля плохих исходов выросла, но не с чем связать рост. Разделить запуски на «до» и «после» правки нельзя — атрибуции нет, остаётся деление по времени, которое смешивает эффект правки с изменением трафика, обновлением модели и любыми параллельными выкатками. Бисекция невозможна: непонятно, какую именно версию откатывать. Чинится записью версионного контекста в каждый запуск — идентификатор или хеш версии промпта, версия модели, версия набора инструментов, — после чего когорты формируются по версии, а не по календарю, и сравниваются одинаковыми оценками.'
  id: 001-platform-layer-3
  fingerprint: e1f72a3a
