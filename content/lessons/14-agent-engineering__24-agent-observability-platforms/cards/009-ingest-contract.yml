- concept: минимальный контракт проверяет согласованность значений полей, а не только их наличие
  question: Спан пришёл со всеми обязательными полями, но с отметкой окончания раньше отметки начала. Дополни проверку приёмника, которая ловит такой некорректный интервал.
  explanation: 'Наличие поля ещё не делает спан пригодным: пустой идентификатор сессии, повторяющийся идентификатор спана и перевёрнутый интервал проходят проверку «поле есть», но ломают расчёт длительностей и порядок событий внутри сессии. Поэтому контракт валидирует значения — непустоту, уникальность, монотонность времени.'
