- concept: спаны без связи с сессией, молча сохранённые как отдельные прогоны, раздувают знаменатель и занижают долю провалов на дашборде
  question: Платформа собрала 250 корректных сессий, из которых 40 помечены как провальные. Дополнительно приёмник молча сохранил 90 спанов без идентификатора сессии, и каждый из них дашборд посчитал отдельной сессией без пометки провала. Какую долю провалов (в процентах) покажет дашборд?
  explanation: 'Настоящая доля — 40/250 = 16%. Осиротевшие спаны попадают в знаменатель как «успешные прогоны»: 40/(250+90) = 40/340 ≈ 11.76%. Метрика улучшилась на бумаге из-за брака на приёме, а не из-за качества агента — поэтому спаны, нарушившие контракт, отклоняют или помечают отдельно, а не подмешивают в статистику.'
  kind: numeric
  answer: 11.76
