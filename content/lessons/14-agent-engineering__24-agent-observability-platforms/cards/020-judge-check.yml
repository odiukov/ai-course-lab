- concept: фактическая точность и тон опираются на разные свидетельства, поэтому оценка одного критерия не переносится на другой
  question: LLM-судья оценивает ответ агента по рубрике с критериями «фактическая точность» и «тон». Ответ сформулирован без оговорок и получает 5 из 5 за тон. Что из этого следует для оценки фактической точности?
  explanation: 'Критерии независимы по источнику свидетельств: тон читается из самого текста ответа, точность — из сопоставления утверждений с переданными документами. Верный ответ бывает осторожным, а выдумка — гладкой, поэтому перенос оценки в любую сторону (и вверх, и вниз) — ошибка оценивания, а не агента.'
  kind: choice
  options:
    - 'Ничего: точность определяется сверкой утверждений с источником, а формулировки — свидетельство только о подаче'
    - 'Точность тоже высокая: модель не стала бы формулировать категорично при неуверенности'
    - 'Точность следует занизить: категоричная подача — типичный признак галлюцинации'
    - Точность нельзя оценить, пока тон не признан нейтральным
  correct: 0
  id: 020-judge-check-1
  fingerprint: 27a4ed51
- concept: качество судьи измеряется долей совпадений его вердиктов с ручной разметкой на одном и том же наборе трейсов
  question: Вы разметили 60 трейсов вручную и прогнали по тем же 60 трейсам LLM-судью. Вердикты совпали в 45 случаях. Какой процент согласия у судьи с ручной разметкой?
  explanation: '45/60 = 0.75, то есть 75%. Практический смысл: примерно каждый четвёртый вердикт в проде будет мусором. Без такой сверки судья выглядит исправным просто потому, что всегда возвращает какое-то число.'
  kind: numeric
  answer: 75
  tolerance: 0.5
  id: 020-judge-check-2
  fingerprint: 10fa633d
- concept: маленькая выборка валидации не выявляет расхождений судьи с ручной разметкой, поэтому даёт ложную уверенность в рубрике
  question: 'Инженер проверил новую рубрику на 6 трейсах: судья согласился с ручной разметкой во всех 6 случаях. Почему это ещё не основание запускать судью в прод?'
  explanation: 'Маленькая выборка почти не различает хорошего судью от посредственного: полное совпадение на единицах трейсов совместимо с большой долей ошибок. Поэтому рубрику проверяют на десятках размеченных вручную трейсов и считают долю совпадений, а не смотрят на «всё сошлось».'
  kind: choice
  options:
    - На такой выборке даже судья с 25% ошибок часто даёт полное совпадение, поэтому расхождений просто не видно
    - Полное совпадение на выборке означает, что рубрика переобучилась на эти 6 трейсов
    - Шесть трейсов — чётное число, оценки нужно считать на нечётной выборке
    - Судью нельзя валидировать ручной разметкой, нужен второй судья
  correct: 0
  id: 020-judge-check-3
  fingerprint: 151d7d0e
