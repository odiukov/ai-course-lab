- concept: среднее смещается несколькими медленными прогонами, поэтому типичный опыт описывает медиана, а худший — высокий перцентиль
  question: Объясни своими словами, почему на дашборд задержки выводят медиану и высокий перцентиль вместо одного среднего значения.
  explanation: 'Одно агрегированное число не различает форму распределения. Пример из урока: при средних 3,48 с медиана была 2 с, а p99 попадал в группу 30-секундных сессий — жалобы шли именно от этого хвоста. Медиана отвечает за типичный опыт, высокий перцентиль — за границу худшего, и расследовать регрессию нужно по второму.'
  kind: open
  reference: 'Среднее суммирует все прогоны и делится на их число, поэтому несколько очень медленных сессий тянут его вверх, а множество быстрых — вниз; получается число, которого почти никто не испытал. Медиана показывает типичную сессию и почти не сдвигается от нескольких выбросов. Высокий перцентиль (p90, p99) показывает, насколько плохо становится наименее удачливой части пользователей — там и прячутся зависшие вызовы инструментов, повторные обращения к модели и долгие попытки агента исправить ошибку. Пара «медиана + высокий перцентиль» разделяет два разных вопроса: как работает система обычно и как плохо она работает в худших случаях. Расхождение между ними само по себе сигнал: чем сильнее перцентиль отрывается от медианы, тем тяжелее хвост.'
  id: 013-percentile-3
  fingerprint: 43c94a25
