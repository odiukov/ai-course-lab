- concept: перцентиль — значение метрики на заданной позиции упорядоченного по возрастанию ряда наблюдений
  question: Прогон дал 400 сессий агента. 380 из них завершились за 6 секунд, остальные 20 — за 45 секунд. Чему равен p90 задержки сессии (в секундах)?
  explanation: 'p90 — граница, ниже которой лежат 90% упорядоченных наблюдений. Отметка 90% попадает на 360-ю сессию, а быстрых сессий 380, значит p90 = 6 с. Медленные 20 сессий (5% выборки) в p90 ещё не попали — их видно только на p99 = 45 с. Поэтому один перцентиль не описывает хвост: выбор отметки решает, какую часть пользователей ты вообще измеряешь.'
  kind: numeric
  answer: 6
  tolerance: 0.1
  id: 013-percentile-1
  fingerprint: 014bc8d2
- concept: одинаковое среднее не означает одинакового хвоста, поэтому версии сравнивают по высокому перцентилю
  question: Две версии агента дали одинаковую среднюю задержку сессии 7,2 секунды. У версии A p90 = 8 секунд, у версии B p90 = 24 секунды. Какой вывод корректен?
  explanation: 'Среднее — одно число на всё распределение, и его можно получить множеством разных форм распределения. Равенство средних ничего не говорит о форме. p90 = 24 с против 8 с означает: у B каждая десятая сессия хуже 24 секунд, тогда как у A — хуже 8. Именно этот хвост чувствует пользователь, поэтому регрессию скорости ищут по высоким перцентилям, а не по среднему.'
  kind: choice
  options:
    - 'Версии эквивалентны по скорости: средние совпали'
    - 'У версии B тяжёлый хвост: заметная доля пользователей ждёт кратно дольше, чем в A, хотя среднее это скрыло'
    - Версия B в среднем быстрее, просто у неё больше разброс измерений
    - Разница в p90 говорит об ошибке измерения, потому что средние равны
  correct: 1
