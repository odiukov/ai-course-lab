- concept: платформы различаются не наличием возможностей, а глубиной специализации вокруг конкретной рабочей задачи
  question: Все три ведущие платформы наблюдаемости за агентами заявляют трейсинг, оценки, эксперименты и мониторинг. Объясни своими словами, почему сравнение по списку возможностей даёт ничью и по какому признаку тогда выбирать.
  explanation: Ключ в том, что «есть оценки» и «оценки, доведённые до нужного тебе типа задач» — разные утверждения. Поэтому карта платформ читается как указатель ближайшей отправной точки под конкретную работу, а не как пьедестал.
  kind: open
  reference: 'Наборы возможностей у платформ пересекаются почти полностью, поэтому галочки не различают продукты. Различает центр тяжести — вокруг какой работы продукт собран и что в нём проработано глубоко. Langfuse собран вокруг единого рабочего места: наблюдение за агентом плюс управление версиями промптов и повтор сессий. Phoenix собран вокруг диагностики качества извлечения: релевантность найденных фрагментов, обнаружение дрейфа, кластеризация трейсов и автоматическое инструментирование. Opik собран вокруг активного улучшения: автоматическая оптимизация промптов, guardrails и поиск галлюцинаций судьёй. Выбирать нужно по тому, какая из этих задач у команды основная; бенчмарки от самих вендоров стоит считать направлением, а не доказательством, и проверять на своём корпусе.'
  id: 006-platform-map-3
  fingerprint: 45c13335
