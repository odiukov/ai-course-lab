- concept: лицензионное ограничение отсекает часть платформ независимо от их функциональности
  question: Политика организации требует продукт под разрешительной открытой лицензией и запрещает Elastic License. Как это ограничение влияет на выбор среди Langfuse, Phoenix и Opik?
  explanation: 'Лицензия — отдельная ось выбора: она ограничивает, как организация вправе разворачивать и предлагать продукт, а не то, насколько хорошо он ловит регрессии. Langfuse после открытия коммерческих модулей идёт под MIT, Opik — под Apache 2.0; обе разрешительные, поэтому проходят через такой фильтр.'
  kind: choice
  options:
    - Отсекает вариант под Elastic License, оставляя Langfuse и Opik; на качество трейсинга и оценок это не влияет
    - 'Отсекает все три: любая платформа наблюдаемости распространяется под Elastic License'
    - 'Не влияет вовсе: лицензия касается только облачной версии, а self-hosted всегда свободен'
    - Оставляет только ту платформу, у которой шире набор оценок, — лицензия следует за функциональностью
  correct: 0
  id: 006-platform-map-2
