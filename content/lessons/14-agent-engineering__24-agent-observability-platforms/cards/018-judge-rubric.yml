- concept: рубрика задаёт для каждого уровня шкалы наблюдаемое условие, а не словесную степень качества
  question: 'Команда оценивает ответы саппорт-агента LLM-судьёй. Критерий сформулирован так: «качество ответа: отлично / хорошо / средне / плохо». Оценки одного и того же ответа скачут от запуска к запуску. Что в рубрике нужно поправить в первую очередь?'
  explanation: '«Отлично» и «средне» — оценка общего впечатления, у неё нет якоря, поэтому разброс неизбежен. Рубрика работает, когда каждому уровню соответствует наблюдаемое условие, которое можно проверить по ответу и источникам. Числовые метки без описаний ничего не чинят: меняется форма, а не критерий. Отдельно оцениваются разные оси (точность, полнота, релевантность) — их нельзя сворачивать в одну шкалу «качества».'
  kind: choice
  options:
    - 'Привязать каждый уровень шкалы к проверяемому условию (например: утверждения противоречат источникам / подтверждены частично / подтверждены полностью)'
    - Расширить шкалу до большего числа градаций, чтобы судье было куда попасть точнее
    - Заменить словесные метки числовыми, оставив описания уровней прежними
    - Просить судью усреднять свою оценку по нескольким прогонам одного ответа
  correct: 0
  id: 018-judge-rubric-1
  fingerprint: 226d1e51
- concept: уверенность описывает надёжность вердикта судьи, а не качество оцениваемого ответа
  question: LLM-судья вернул по критерию фактической точности максимальный балл шкалы при уверенности 0.35. Как это читать?
  explanation: 'Балл и уверенность — про разное. Балл отвечает на вопрос «каков ответ по критерию рубрики», уверенность — «насколько надёжен сам вердикт при тех источниках, которые судье дали». Перемножать их нельзя: это не вероятность правильности ответа. Комбинация «высокий балл + низкая уверенность» — сигнал маршрутизации на человека, иначе красивое число маскирует нехватку доказательств.'
  kind: choice
  options:
    - Ответ выглядит подтверждённым, но у судьи мало данных для такого вывода — случай стоит отправить на ручную проверку
    - 'Ответ верен примерно на треть: балл нужно домножить на уверенность'
    - Ответ плохой, а высокий балл — ошибка парсинга, вердикт надо отбросить
    - Уверенность относится к стилю ответа, на фактическую точность она не влияет
  correct: 0
  id: 018-judge-rubric-2
  fingerprint: 32302c41
- concept: при отсутствии или противоречии подтверждающих фрагментов корректный выход судьи — низкая уверенность или отказ от вердикта, а не догадка
  question: Судье передают ответ агента и набор фрагментов документации с идентификаторами. По одному из утверждений ответа подходящих фрагментов не нашлось, а по другому два фрагмента противоречат друг другу. Объясни своими словами, что судья должен сделать в каждом случае и почему нельзя просто поставить балл по правдоподобию текста.
  explanation: Ключевое различие — между «утверждение опровергнуто» и «утверждение нечем проверить». Первое даёт низкий балл по рубрике, второе — низкую уверенность в вердикте. Смешение этих случаев ломает и метрику качества, и очередь ручной проверки.
  kind: open
  reference: 'В обоих случаях судья не имеет опоры для вердикта и обязан это показать: вернуть низкую уверенность либо явно отказаться от оценки по этому критерию, а не выбирать балл по тому, насколько убедительно звучит формулировка. Утверждение без подтверждающего фрагмента не то же самое, что ложное утверждение — оно непроверяемое; противоречие источников означает, что проблема может быть в самом корпусе, и это тоже повод не выносить вердикт молча. Если судья угадывает, оценка перестаёт измерять фактическую точность и начинает измерять уверенность тона: гладко написанная выдумка получает высокий балл. Честный низкий показатель уверенности превращает такой случай в задачу для ручной проверки или для доработки поиска фрагментов, вместо того чтобы прятать нехватку доказательств за числом.'
  id: 018-judge-rubric-3
  fingerprint: be46ddcf
