<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карта трёх платформ</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fc;
      --panel: #ffffff;
      --panel-soft: #f1f4f9;
      --ink: #172033;
      --muted: #667085;
      --line: #cfd6e4;
      --rail: #e9edf5;
      --fallback: #fff4e5;
      --fallback-ink: #704800;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    figure {
      margin: 0;
      padding: 16px;
      background: var(--page);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: .01em;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 430px;
      overflow: visible;
      background: var(--page);
    }

    .diagram-title {
      fill: var(--ink);
      font-size: 16px;
      font-weight: 650;
      letter-spacing: .02em;
    }

    .card {
      fill: var(--panel);
      stroke: var(--line);
      stroke-width: 2px;
    }

    .card-band {
      fill: var(--panel-soft);
    }

    .platform {
      fill: var(--ink);
      font-size: 21px;
      font-weight: 750;
    }

    .eyebrow {
      fill: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .license-pill {
      stroke-width: 2px;
    }

    .license {
      font-size: 15px;
      font-weight: 750;
    }

    .license-note {
      fill: var(--muted);
      font-size: 12px;
    }

    .focus-box {
      stroke-width: 2px;
    }

    .focus {
      font-size: 17px;
      font-weight: 750;
    }

    .detail {
      fill: var(--muted);
      font-size: 13px;
    }

    .connector {
      fill: none;
      stroke-width: 3px;
      stroke-linecap: round;
    }

    .arrowhead {
      stroke: none;
    }

    .otel-rail {
      fill: var(--rail);
      stroke: var(--line);
      stroke-width: 2px;
    }

    .otel {
      fill: var(--ink);
      font-size: 18px;
      font-weight: 800;
    }

    .otel-note {
      fill: var(--muted);
      font-size: 13px;
    }

    #fallback {
      padding: 16px;
      background: var(--fallback);
      color: var(--fallback-ink);
      font-size: 16px;
      line-height: 1.4;
      border: 2px solid currentColor;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #10141d;
        --panel: #191f2b;
        --panel-soft: #202838;
        --ink: #f1f5fb;
        --muted: #aab4c5;
        --line: #3b465a;
        --rail: #202838;
        --fallback: #362b18;
        --fallback-ink: #ffd991;
      }
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-heading">
    <h1 id="diagram-heading">Карта трёх платформ</h1>
    <svg id="map" viewBox="0 0 960 430" width="960" height="430"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="svg-title svg-description">
      <title id="svg-title">Сравнение Langfuse, Phoenix и Opik</title>
      <desc id="svg-description">
        Три колонки сопоставляют лицензии и основные рабочие сценарии платформ.
        Общая шина OTel показывает, что формат телеметрии сохраняется при смене назначения.
      </desc>
    </svg>
    <div id="fallback" hidden>
      Схема должна была показать три отправные точки: Langfuse с лицензией MIT
      для промптов и сессий, Phoenix с Elastic 2.0 для RAG и дрейфа и Opik
      с Apache 2.0 для оптимизации и guardrails. Все три подключаются через OTel.
    </div>
  </figure>

  <script>
    const DATA = [
      {
        kind: "layout",
        origin: { x: 0, y: 0 },
        scale: { x: 1, y: 1 },
        heading: { x: 480, y: 24 },
        card: { y: 49, width: 270, height: 252, radius: 16, band: 7 },
        titleY: 83,
        licenseLabelY: 111,
        pillY: 121,
        pillWidth: 154,
        pillHeight: 37,
        pillRadius: 18,
        licenseY: 145,
        noteY: 177,
        focusLabelY: 204,
        focusY: 218,
        focusWidth: 226,
        focusHeight: 57,
        focusRadius: 11,
        focusTextY: 243,
        detailY: 265,
        connectorTop: 301,
        connectorBottom: 337,
        arrowHalf: 8,
        arrowDepth: 11,
        rail: { x: 82, y: 337, width: 796, height: 69, radius: 18 },
        railTitleY: 366,
        railNoteY: 389
      },
      {
        kind: "platform",
        x: 35,
        name: "Langfuse",
        license: "MIT",
        licenseNote: "открытая, без ELv2",
        focus: "Промпты и сессии",
        detail: "версии • повторы",
        accent: "#6657d9",
        softLight: "#eeeafd",
        softDark: "#2d2853",
        inkLight: "#4937bb",
        inkDark: "#c9c1ff"
      },
      {
        kind: "platform",
        x: 345,
        name: "Phoenix",
        license: "Elastic 2.0",
        licenseNote: "Elastic License",
        focus: "RAG и дрейф",
        detail: "релевантность • группы",
        accent: "#dc6b28",
        softLight: "#fff0e6",
        softDark: "#4a2a1d",
        inkLight: "#a54412",
        inkDark: "#ffc39d"
      },
      {
        kind: "platform",
        x: 655,
        name: "Opik",
        license: "Apache 2.0",
        licenseNote: "открытая, без ELv2",
        focus: "Оптимизация и guardrails",
        detail: "промпты • галлюцинации",
        accent: "#087f68",
        softLight: "#e5f6f1",
        softDark: "#173e37",
        inkLight: "#05614f",
        inkDark: "#8fe1cd"
      }
    ];

    const layout = DATA.find(item => item.kind === "layout");
    const origin = Object.freeze({ x: layout.origin.x, y: layout.origin.y });
    const scale = Object.freeze({ x: layout.scale.x, y: layout.scale.y });
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const LABEL_PADDING = 10;
    const LINE_WIDTH = 2;
    const FONT_SIZE = 16;

    try {
      const svg = document.getElementById("map");
      const namespace = "http://www.w3.org/2000/svg";
      const darkTheme = window.matchMedia("(prefers-color-scheme: dark)");

      const node = (tag, attributes, parent = svg) => {
        const element = document.createElementNS(namespace, tag);
        Object.entries(attributes).forEach(([name, value]) => {
          element.setAttribute(name, String(value));
        });
        parent.appendChild(element);
        return element;
      };

      const rect = (x, y, width, height, radius, attributes, parent) =>
        node("rect", {
          x: sx(x),
          y: sy(y),
          width: sx(x + width) - sx(x),
          height: sy(y + height) - sy(y),
          rx: sx(radius) - sx(0),
          ...attributes
        }, parent);

      const line = (x1, y1, x2, y2, attributes, parent) =>
        node("line", {
          x1: sx(x1),
          y1: sy(y1),
          x2: sx(x2),
          y2: sy(y2),
          ...attributes
        }, parent);

      const text = (value, x, y, className, anchor, attributes, parent) => {
        const element = node("text", {
          x: sx(x),
          y: sy(y),
          class: className,
          "text-anchor": anchor,
          ...attributes
        }, parent);
        element.textContent = value;
        return element;
      };

      const polygon = (points, attributes, parent) =>
        node("polygon", {
          points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
          ...attributes
        }, parent);

      const colorForTheme = platform =>
        darkTheme.matches ? platform.inkDark : platform.inkLight;

      const softForTheme = platform =>
        darkTheme.matches ? platform.softDark : platform.softLight;

      text(
        "Ближайшая отправная точка — по типу работы и лицензии",
        layout.heading.x,
        layout.heading.y,
        "diagram-title",
        "middle",
        {}
      );

      const cardsLayer = node("g", { "aria-label": "Платформы" });
      const routesLayer = node("g", { "aria-label": "Общий экспорт OTel" });
      const platforms = DATA.filter(item => item.kind === "platform");

      platforms.forEach(platform => {
        const group = node("g", {
          "aria-label":
            `${platform.name}: ${platform.license}; ${platform.focus}`
        }, cardsLayer);

        rect(
          platform.x,
          layout.card.y,
          layout.card.width,
          layout.card.height,
          layout.card.radius,
          { class: "card" },
          group
        );

        rect(
          platform.x,
          layout.card.y,
          layout.card.band,
          layout.card.height,
          layout.card.radius,
          { fill: platform.accent },
          group
        );

        text(
          platform.name,
          platform.x + layout.card.width / sx(2),
          layout.titleY,
          "platform",
          "middle",
          {},
          group
        );

        text(
          "ЛИЦЕНЗИЯ",
          platform.x + LABEL_PADDING,
          layout.licenseLabelY,
          "eyebrow",
          "start",
          {},
          group
        );

        const pillX =
          platform.x + (layout.card.width - layout.pillWidth) / sx(2);

        const pill = rect(
          pillX,
          layout.pillY,
          layout.pillWidth,
          layout.pillHeight,
          layout.pillRadius,
          {
            class: "license-pill",
            fill: softForTheme(platform),
            stroke: platform.accent,
            "stroke-width": LINE_WIDTH
          },
          group
        );

        const licenseText = text(
          platform.license,
          platform.x + layout.card.width / sx(2),
          layout.licenseY,
          "license",
          "middle",
          { fill: colorForTheme(platform), "font-size": FONT_SIZE },
          group
        );

        text(
          platform.licenseNote,
          platform.x + layout.card.width / sx(2),
          layout.noteY,
          "license-note",
          "middle",
          {},
          group
        );

        text(
          "СИЛЬНАЯ СТОРОНА",
          platform.x + LABEL_PADDING,
          layout.focusLabelY,
          "eyebrow",
          "start",
          {},
          group
        );

        const focusX =
          platform.x + (layout.card.width - layout.focusWidth) / sx(2);

        const focusBox = rect(
          focusX,
          layout.focusY,
          layout.focusWidth,
          layout.focusHeight,
          layout.focusRadius,
          {
            class: "focus-box",
            fill: softForTheme(platform),
            stroke: platform.accent,
            "stroke-width": LINE_WIDTH
          },
          group
        );

        const focusText = text(
          platform.focus,
          platform.x + layout.card.width / sx(2),
          layout.focusTextY,
          "focus",
          "middle",
          { fill: colorForTheme(platform) },
          group
        );

        text(
          platform.detail,
          platform.x + layout.card.width / sx(2),
          layout.detailY,
          "detail",
          "middle",
          {},
          group
        );

        const centerX = platform.x + layout.card.width / sx(2);

        line(
          centerX,
          layout.connectorBottom,
          centerX,
          layout.connectorTop + layout.arrowDepth,
          {
            class: "connector",
            stroke: platform.accent
          },
          routesLayer
        );

        polygon(
          [
            { x: centerX, y: layout.connectorTop },
            {
              x: centerX - layout.arrowHalf,
              y: layout.connectorTop + layout.arrowDepth
            },
            {
              x: centerX + layout.arrowHalf,
              y: layout.connectorTop + layout.arrowDepth
            }
          ],
          { class: "arrowhead", fill: platform.accent },
          routesLayer
        );

        const updateTheme = () => {
          pill.setAttribute("fill", softForTheme(platform));
          licenseText.setAttribute("fill", colorForTheme(platform));
          focusBox.setAttribute("fill", softForTheme(platform));
          focusText.setAttribute("fill", colorForTheme(platform));
        };

        darkTheme.addEventListener("change", updateTheme);
      });

      rect(
        layout.rail.x,
        layout.rail.y,
        layout.rail.width,
        layout.rail.height,
        layout.rail.radius,
        { class: "otel-rail" },
        routesLayer
      );

      text(
        "OTel — общее крепление",
        layout.rail.x + layout.rail.width / sx(2),
        layout.railTitleY,
        "otel",
        "middle",
        {},
        routesLayer
      );

      text(
        "тот же код и формат данных • меняется адрес назначения",
        layout.rail.x + layout.rail.width / sx(2),
        layout.railNoteY,
        "otel-note",
        "middle",
        {},
        routesLayer
      );
    } catch (error) {
      document.getElementById("map").hidden = true;
      document.getElementById("fallback").hidden = false;
    }
  </script>
</body>
</html>
