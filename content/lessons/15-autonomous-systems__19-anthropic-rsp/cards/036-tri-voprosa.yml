- concept: измеримость обещания задаётся наблюдаемым критерием, а не обязательно числом
  question: Какое из обещаний позволяет внешнему читателю установить факт его выполнения или невыполнения?
  explanation: 'Наблюдаемый критерий не обязан быть числом: опубликованный документ, срок или конкретная мера тоже проверяемы. «Достаточный» и «ответственный» без правила определения достаточности остаются прилагательными.'
  kind: choice
  options:
    - «Мы будем поддерживать достаточный уровень безопасности развёртывания»
    - «Мы будем стремиться к ответственному масштабированию»
    - «До развёртывания модели этого уровня мы опубликуем отчёт о рисках с перечнем внедрённых защитных мер»
    - «Мы серьёзно относимся к катастрофическим рискам»
  correct: 2
