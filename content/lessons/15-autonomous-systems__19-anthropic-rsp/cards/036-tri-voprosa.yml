- concept: независимость проверяющего работает только при доступе к нужным данным и возможности сообщить о расхождении
  question: Политика называет внешнюю организацию проверяющим по своим обязательствам. При каких условиях это действительно усиливает проверку, а при каких остаётся декорацией?
  explanation: Внутренняя команда — тоже проверяющий, но тогда одна сторона пишет правило, применяет его и оценивает исполнение. Ярлык «независимый» без доступа к данным и права заявить о нарушении эту связку не разрывает.
  kind: open
  reference: 'Усиливает, если проверяющий получает данные, по которым обязательство сверяется (результаты оценок, перечень внедрённых мер, решения о развёртывании) и может публично сообщить о расхождении. Остаётся декорацией, если доступ к материалам определяет сама лаборатория, объём проверки ограничен её решением или отчёт публикуется только с её согласия: тогда автор правила по-прежнему контролирует и применение, и оценку результата.'
