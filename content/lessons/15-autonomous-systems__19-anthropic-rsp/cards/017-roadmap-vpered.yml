- concept: запись о планируемой мере защиты в Frontier Safety Roadmap не означает, что мера уже действует
  question: В Frontier Safety Roadmap написано, что компания исследует новую меру защиты против конкретного класса рисков. Что из этого следует?
  explanation: Roadmap отвечает на вопрос «к чему компания готовится», а не «что уже работает». Ни статус меры как действующей, ни наличие ожидаемой возможности у текущей модели из такой записи не выводятся; вес формулировки оценивается отдельно — намерение, срок и твёрдое обязательство различаются.
  kind: choice
  options:
    - Мера уже применяется к выпущенным моделям
    - Компания публично заявила, что работает над мерой; её действие этим не подтверждается
    - Компания обязана внедрить меру к следующему релизу
    - Соответствующая возможность у текущей модели уже подтверждена
  correct: 1
  id: 017-roadmap-vpered-1
  fingerprint: c0950483
- concept: публикация ожиданий и планов до появления возможности исключает подгонку подготовки задним числом
  question: Какую ценность даёт то, что Frontier Safety Roadmap публикуется до появления ожидаемой возможности, а не после? Объясни своими словами.
  explanation: 'Смысл ровно тот же, что и у любого предварительного обязательства: ценность создаёт не текст сам по себе, а невозможность сочинить его задним числом.'
  kind: open
  reference: 'Заранее опубликованный документ фиксирует, каких возможностей компания ждала, какие риски собиралась изучать и над какими мерами работать. После появления возможности этот список уже нельзя переписать незаметно: сравнение с зафиксированной версией покажет расхождение. Появляется публичная точка отсчёта, а последовательные обновления показывают динамику подготовки — что стало приоритетом, что добавили и от чего отказались. Написанный постфактум документ такой проверяемости не даёт: он всегда выглядит согласованным с тем, что уже случилось.'
  id: 017-roadmap-vpered-2
  fingerprint: f9724060
