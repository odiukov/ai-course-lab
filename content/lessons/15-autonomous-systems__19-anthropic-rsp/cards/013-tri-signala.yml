- concept: единая «оценка готовности» скрывает неравномерность приближения по несопоставимым шкалам
  question: Почему приближение модели к порогу автоматизации AI-исследований не сводят к одному общему проценту готовности? Объясни своими словами.
  explanation: В уроке у Opus 4.6 до границы по качеству остаётся 0,05, по охвату — 0,20, а по METR-горизонту — 26 часов. Фраза «модель близко» без указания шкалы теряет главное.
  kind: open
  reference: 'Показатели измеряют разные свойства и в разных единицах: доля задач — охват, часы — длительность автономной работы, доля выше baseline — качество. Складывать или усреднять доли и часы бессмысленно. Кроме того, приближение идёт неравномерно: модель может почти сравняться с человеком по качеству и одновременно сильно отставать по охвату задач и по длительности. Одно усреднённое число прячет, по какой именно оси остался разрыв, а именно это определяет, каких оценок и мер защиты ждать дальше.'
  id: 013-tri-signala-3
  fingerprint: 94b4ee20
