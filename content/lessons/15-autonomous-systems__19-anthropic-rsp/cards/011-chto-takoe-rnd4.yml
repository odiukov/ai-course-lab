- concept: признание прохождения порога обязывает опубликовать affirmative case до дальнейшего масштабирования
  question: Лаборатория сочла, что её новая модель прошла порог экономически значимой автоматизации AI-исследований. Что она обязана сделать по своей политике масштабирования и в какой момент?
  explanation: 'Прохождение порога меняет не название модели, а режим действий: включается обязательство публично обосновать безопасность до следующего шага масштабирования.'
  kind: open
  reference: 'До продолжения масштабирования она должна опубликовать affirmative case — обоснование, почему риски рассогласования контролируемы: разбор самих рисков и мер, которые их удерживают. Ключевое — порядок: публикация обоснования предшествует дальнейшему наращиванию, а не сопровождает его задним числом. Это одностороннее обязательство самой лаборатории, а не рекомендация индустрии.'
