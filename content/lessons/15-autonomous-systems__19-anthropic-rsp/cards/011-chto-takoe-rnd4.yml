- concept: оценка «порог не пройден» совместима с признанием, что уверенно исключить прохождение становится трудно
  question: 'Политика лаборатории сообщает: текущая модель порога автоматизации исследований не достигает, но уверенно исключить это становится сложно. Как читать такое сочетание?'
  explanation: Утверждение об оценке и утверждение о неопределённости этой оценки относятся к разным вещам. Формулировка «трудно уверенно исключить» ставит порог в горизонт ближайших поколений и превращает его в стоп-сигнал перед следующим масштабированием.
  kind: choice
  options:
    - 'Это внутреннее противоречие: одно из двух утверждений ошибочно'
    - Это признание, что порог уже пройден, но объявление отложено
    - 'Первое — текущая оценка, второе — сокращение запаса уверенности: порог стал практической проблемой, а не умозрительной границей'
    - Это отказ от порога как критерия и переход к оценке по другим показателям
