- concept: 'внутри функции измерение отделено от решения: сравнения, затем подсчёт, затем выбор уровня'
  question: Расставь шаги функции, которая по трём показателям модели возвращает уровень возможностей.
  explanation: Если смешать сравнения и выбор уровня в одном ветвлении, порядок условий начинает влиять на результат и появляются недостижимые ветки. Отдельный счётчик срабатываний делает правило «минимум два из трёх» видимым в коде.
  kind: order
  items:
    - Сравнить каждый показатель со своей границей и получить три логических результата
    - Посчитать, сколько из логических результатов истинны
    - По количеству срабатываний выбрать уровень и вернуть его строкой
  id: 015-pishem-capability-level-1
  fingerprint: dbab604c
- concept: количество сработавших сигналов получают суммированием булевых сравнений
  question: 'Заполни пропуск: нужно получить количество сработавших сигналов из трёх сравнений.'
  explanation: В Python True равен 1, False — 0, поэтому sum по списку сравнений даёт число срабатываний. any вернул бы «хотя бы один», all — «все три», и правило «минимум два» выразить ими напрямую нельзя.
  kind: cloze
