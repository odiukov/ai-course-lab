- concept: вклад отдельного критерия в итоговый балл выясняется поочерёдным изменением одного критерия при остальных зафиксированных
  question: Расставь шаги процедуры, определяющей, какой критерий рубрики сильнее всего тянет итоговый балл вниз.
  explanation: 'Пока меняется больше одного входа, приписать сдвиг конкретной строке нельзя. Это обычный однофакторный анализ чувствительности: остальные критерии держатся неизменными, чтобы наблюдаемая разница балла имела единственную причину.'
  kind: order
  items:
    - Зафиксировать все оценки критериев на значениях исходной версии
    - Изменить оценку одного критерия, остальные оставить нетронутыми
    - Пересчитать итоговый взвешенный балл и записать величину сдвига
    - Повторить то же самое отдельно для каждого оставшегося критерия
    - Сравнить модули сдвигов и выбрать критерий с наибольшим
  id: 035-proverka-slabyh-mest-1
  fingerprint: 7810fc0f
- concept: чувствительность итогового балла к строке рубрики задаётся долей её веса, а не серьёзностью формулировки
  question: Рубрика состоит из критериев с весами 5, 6 и 9. Оценка критерия с весом 6 упала на 0,5 балла, две другие оценки не изменились. На сколько снизился итоговый взвешенный балл?
  explanation: 'Сдвиг итога равен доле веса, умноженной на изменение оценки: 6/(5+6+9) × 0,5 = 0,3 × 0,5 = 0,15. Отсюда правило: строка с большей долей веса двигает итог сильнее при равном падении оценки, независимо от того, насколько тревожно она сформулирована.'
  kind: numeric
  answer: 0.15
  tolerance: 0.005
  id: 035-proverka-slabyh-mest-2
  fingerprint: b8952346
- concept: итоговое изменение балла — сумма разнонаправленных вкладов, поэтому малый суммарный сдвиг не означает малых изменений внутри рубрики
  question: Документ пересмотрели, итоговая оценка по рубрике снизилась всего на 0,05 балла. Почему из этого нельзя заключить, что ни одна строка рубрики существенно не изменилась? Объясни своими словами.
  explanation: Агрегирование теряет информацию. Малое итоговое изменение совместимо и с «ничего не поменялось», и с «крупные изменения погасили друг друга»; различить эти случаи можно только по разбивке.
  kind: open
  reference: 'Итоговый балл — взвешенная сумма, и вклады строк складываются со знаком. Одна строка могла упасть на целый балл, а другая одновременно вырасти и почти скомпенсировать падение; в сумме останется небольшой сдвиг. Чтобы увидеть реальные изменения, нужны построчные оценки обеих редакций, а не только два итоговых числа. Обратное тоже верно: заметное падение итога может целиком приходиться на одну тяжёлую строку, а не размазываться по всем.'
  id: 035-proverka-slabyh-mest-3
