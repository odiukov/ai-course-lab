- concept: автоматизация alignment-исследований, рекурсивное самоулучшение и порог RSP отвечают на три разных вопроса и не заменяют друг друга
  question: Автоматизированное исследование alignment, рекурсивное самоулучшение и порог RSP по автоматизации AI-исследований — на какой отдельный вопрос отвечает каждое из трёх понятий?
  explanation: Три понятия легко склеить, потому что описывают один процесс. Но одно измеряет достигнутое качество работы, второе — динамику ускорения, третье — условие срабатывания обязательств. Ни одно не выводится из другого автоматически.
  kind: open
  reference: 'Автоматизированное alignment-исследование отвечает: какую полезную исследовательскую работу модель уже выполняет — это наблюдаемое основание для тревоги. Рекурсивное самоулучшение отвечает: могут ли результаты этой работы ускорить создание более сильных систем — это механизм ускорения. Порог RSP отвечает: стала ли автоматизация достаточно широкой и экономически значимой, чтобы включились дополнительные обязательства лаборатории — это момент реакции и политическая граница.'
