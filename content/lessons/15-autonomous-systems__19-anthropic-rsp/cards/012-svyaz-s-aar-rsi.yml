- concept: рекурсивное самоулучшение — контур, где исследовательский труд модели ускоряет появление её более сильных преемников
  question: Расставь звенья контура рекурсивного самоулучшения в правильном порядке.
  explanation: 'Суть контура не в том, что модель редактирует свои веса, а в том, что продукт её исследовательского труда идёт на вход разработке преемника. Отсюда ускорение: каждый виток даёт более способного исследователя.'
