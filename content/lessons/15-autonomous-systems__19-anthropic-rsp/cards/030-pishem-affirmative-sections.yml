- concept: 'условный раздел расширяет шаблон отчёта, а не вытесняет один из базовых: состав базовой части от измерения не зависит'
  question: Шаблон отчёта состоит из 4 базовых разделов. Измеренный показатель превысил порог, поэтому требуется раздел про этот показатель. Каким становится отчёт?
  explanation: Базовая часть шаблона обязательна независимо от измерений, поэтому срабатывание порога только добавляет пункт — состав отчёта растёт с 4 до 5. Замена базового раздела означала бы, что превышение порога снимает какое-то обязательство по раскрытию, тогда как оно, наоборот, добавляет новое.
  kind: choice
  options:
    - '5 разделов: базовые 4 плюс дополнительный'
    - '4 раздела: дополнительный занимает место наименее релевантного базового'
    - '4 раздела: дополнительный вливается в один из базовых как подпункт'
    - '1 раздел: при срабатывании порога отчёт сводится к разбору показателя'
  correct: 0
