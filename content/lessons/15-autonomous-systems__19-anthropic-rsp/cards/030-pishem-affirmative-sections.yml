- concept: формулировка «строго выше порога» означает, что значение, равное порогу, оставляет шаблон в базовом составе
  question: Шаблон обязательного отчёта содержит 9 базовых разделов. Дополнительный раздел добавляется, если оценка риска строго выше 0.4. Измерение дало ровно 0.4. Сколько разделов будет в отчёте?
  explanation: '«Выше 0.4» — строгое неравенство: 0.4 > 0.4 ложно, дополнительный раздел не подключается, остаются 9 базовых. Если бы политика писала «не ниже 0.4», сравнение стало бы нестрогим и разделов было бы 10. Формулировка порога напрямую задаёт оператор сравнения, и путаница здесь меняет состав обязательной отчётности на границе.'
  kind: numeric
  answer: 9
  tolerance: 0.5
  id: 030-pishem-affirmative-sections-1
  fingerprint: 26d7cc61
- concept: функция обязана строить результат заново на каждом вызове, иначе состояние прошлого вызова протекает в следующий
  question: Функция собирает список разделов отчёта и при высокой оценке риска дописывает в конец дополнительный раздел. После вызова с оценкой 0.5 следующий вызов с оценкой 0.05 тоже возвращает список с дополнительным разделом. В чём причина?
  explanation: 'Мутация общего списка (заведённого на уровне модуля или как значение аргумента по умолчанию) делает результат зависимым от истории вызовов: раздел, добавленный один раз, остаётся навсегда. Отчёт после этого не отражает измерения конкретной модели. Лечится сборкой свежего списка внутри функции на каждом вызове.'
  kind: choice
  options:
    - Оценка 0.05 ошибочно сравнивается как строка, а не как число
    - Функция дописывает раздел в общий список, переживающий вызовы, вместо нового списка на каждый вызов
    - Порог сравнения задан неверно и пропускает малые значения
    - Результат кэшируется по имени функции, а не по её аргументам
  correct: 1
  id: 030-pishem-affirmative-sections-2
