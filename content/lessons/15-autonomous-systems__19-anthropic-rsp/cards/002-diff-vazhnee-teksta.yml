- concept: по одной редакции нельзя увидеть исчезнувшие обязательства — нужен диф со старой версией
  question: Объясни своими словами, почему оценка политики безопасности по одной только текущей редакции систематически завышает её строгость.
  explanation: Именно поэтому единица разбора — диф между редакциями, а не документ. У RSP оценка SaferAI упала с 2.2 до 1.9 при том, что новая редакция выглядит подробнее старой.
  kind: open
  reference: 'Текущая редакция показывает лишь то, что в ней есть. Исчезнувшее обязательство не оставляет следа: читатель не видит пустоты там, где раньше стояла жёсткая строка. Поэтому впечатление формируют добавленные и подробно расписанные пункты, а ослабление остаётся невидимым. Сравнение со старой версией возвращает удаления и переформулировки в поле зрения: видно, что компания перестала обещать и где обязательство превратилось в более мягкую формулировку.'
