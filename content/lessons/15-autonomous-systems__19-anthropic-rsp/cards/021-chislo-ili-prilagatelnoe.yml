- concept: порядок переноса порога на новую версию бенчмарка, сохраняющий проверяемость обещания
  question: Бенчмарк, к которому привязан порог политики, выходит в новой версии с другой шкалой. Расставь шаги переноса порога так, чтобы обещание осталось проверяемым для внешнего наблюдателя.
  explanation: Проверяемость держится на том, что и отметка, и последствие объявлены до измерения. Если пересчитанный порог публикуется после того, как результат кандидата известен, значение можно подогнать под желаемый исход, и внешняя проверка теряет опору.
  kind: order
  items:
    - Зафиксировать версию теста и прогнать на общем наборе моделей старую и новую методики, получив соответствие результатов
    - Опубликовать пересчитанное пороговое значение и правило для пограничной зоны до того, как будут измерены новые модели-кандидаты
    - Измерить модель-кандидата по новой методике
    - Применить заранее объявленное последствие, соответствующее полученному результату
  id: 021-chislo-ili-prilagatelnoe-3
