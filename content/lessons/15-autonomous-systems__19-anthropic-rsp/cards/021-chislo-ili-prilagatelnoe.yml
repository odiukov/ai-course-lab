- concept: смена шкалы бенчмарка требует переноса отметки, но не затрагивает вопрос о том, должна ли отметка что-то запускать
  question: 'Бенчмарк пересчитали по новой шкале, и старое пороговое значение стало недостижимым: та же модель набирает по новой методике заметно меньше баллов. Какой вывод отсюда следует?'
  explanation: Пересчёт шкалы — проблема калибровки измерителя. Он отвечает на вопрос «где поставить отметку», а не на вопрос «должна ли отметка автоматически что-то включать». Замена жёсткого последствия на оценку по усмотрению меняет уже не измеритель, а устройство обещания.
  kind: choice
  options:
    - Порог нужно перенести на новую шкалу; вопрос о том, какое действие он запускает, этим аргументом не решается
    - Порог утратил смысл, и привязанное к нему обязательство можно снять
    - Модель стала менее опасной, раз её результат упал
    - Пересчёт бенчмарков доказывает, что количественные пороги в политике вообще неприменимы
  correct: 0
