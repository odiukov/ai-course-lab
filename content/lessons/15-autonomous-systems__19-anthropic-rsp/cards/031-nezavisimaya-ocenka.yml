- concept: верхняя отметка шкалы задана лучшей из существующих политик, поэтому максимум означает «лучший на рынке», а не «достаточный»
  question: На шкале SaferAI верхняя отметка привязана к лучшей существующей политике масштабирования, а нижняя — к формальной отписке. Что из этого следует при чтении высокого балла?
  explanation: Anthropic 2023 — 2.2, v3.0 — 1.9 при верхней отметке, заданной лучшей имеющейся RSP. Улучшение всей отрасли сдвинуло бы смысл верхней отметки, поэтому балл читается только в сравнении с практикой, а не как абсолютная гарантия.
  kind: open
  reference: 'Шкала относительная: она сравнивает документ с текущей отраслевой практикой, а не с уровнем, достаточным для безопасности. Высокий балл значит «проверяемее прочих существующих политик», а не «риск управляем». Поэтому даже верхняя оценка не доказывает адекватность мер, а низкая говорит о том, что документ ближе к формальному соблюдению.'
