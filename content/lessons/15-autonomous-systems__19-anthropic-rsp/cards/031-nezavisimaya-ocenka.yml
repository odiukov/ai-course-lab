- concept: единая внешняя шкала нужна потому, что автор добровольной политики иначе одновременно задаёт правила и оценивает их выполнение
  question: Почему для сравнения добровольных политик масштабирования нужна независимая рубрика, а не собственные заявления лабораторий о серьёзности их подхода?
  explanation: Рубрика задаёт заранее известные критерии, одинаковые для всех документов. Без неё каждый автор выступает и правилодателем, и экзаменатором, и «серьёзно выглядящая» политика не отличима от проверяемой.
  kind: choice
  options:
    - Потому что лаборатории публикуют политики в разных форматах файлов
    - Потому что каждая лаборатория сама выбирает и формулировки, и критерий успеха, и её самооценку нельзя сопоставить с чужой
    - Потому что внешняя организация имеет доступ к внутренним логам обучения
    - Потому что добровольные политики юридически обязательны только после внешней оценки
