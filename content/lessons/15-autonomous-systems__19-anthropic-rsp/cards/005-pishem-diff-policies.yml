- concept: сопоставление пунктов двух редакций идёт по устойчивому идентификатору, иначе переписанный пункт попадает и в removed, и в added
  question: 'Программа сравнивает две редакции политики и сопоставляет пункты по полному тексту. Один пункт в новой редакции переписан: смысл тот же, слова другие. Что покажет такой diff и почему это неверно?'
  explanation: 'Текст — изменяемое содержимое, идентификатор — устойчивый ключ. Ключ отвечает на вопрос «тот же это пункт или другой», текст — на вопрос «изменился ли он». Если ключом сделать текст, любая правка выглядит как удаление плюс добавление, и категория changed перестаёт существовать: ровно та ошибка, из-за которой один переписанный пункт оказывается в двух списках.'
  kind: choice
  options:
    - Пункт попадёт сразу в removed и в added, хотя фактически он один и лишь изменён — сопоставлять нужно по идентификатору пункта, а текст сравнивать уже внутри пары
    - Пункт вообще не попадёт в результат, потому что его идентификатор есть в обеих редакциях
    - Пункт попадёт только в removed, потому что старого текста в новой редакции нет
    - Пункт попадёт только в added, потому что новый текст всегда перекрывает старый
  correct: 0
  id: 005-pishem-diff-policies-1
  fingerprint: 5ac6d319
- concept: размеры групп added/removed/changed выводятся из пересечения множеств идентификаторов и сравнения текста внутри пересечения
  question: В старой редакции политики 20 пунктов, в новой 26. Общих идентификаторов 14, и у 5 из них текст совпадает дословно. Сколько всего записей вернёт diff во всех трёх группах (added + removed + changed)?
  explanation: 'removed = 20 − 14 = 6, added = 26 − 14 = 12, changed = 14 − 5 = 9. Итого 6 + 12 + 9 = 27. Пять пунктов с совпадающим текстом не попадают никуда: diff сообщает только о различиях, поэтому сумма групп меньше суммы размеров редакций.'
  kind: numeric
  answer: 27
  tolerance: 0.5
  id: 005-pishem-diff-policies-2
  fingerprint: 361416f3
- concept: запись об изменённом пункте бесполезна для аудита, если не хранит обе версии текста — старую и новую
  question: Объясни своими словами, почему для изменённого пункта политики недостаточно вернуть только его идентификатор и новый текст.
  explanation: Diff редакций политики нужен не для факта «здесь что-то поменяли», а для суждения о строгости. Суждение требует сопоставления двух формулировок, значит обе версии текста обязаны лежать в самой записи.
  kind: open
  reference: 'Идентификатор и новый текст говорят лишь о том, что правка была, но не о её содержании. Смысл сравнения редакций — увидеть направление сдвига: ослабло ли обязательство, сменился ли ответственный, исчезло ли последствие за нарушение. Для этого нужна старая формулировка рядом с новой, иначе оценить правку можно только вернувшись к исходному документу вручную, и результат diff теряет ценность как самостоятельный артефакт. Поэтому запись об изменении хранит пару: было и стало.'
  id: 005-pishem-diff-policies-3
  fingerprint: f5bef1ae
