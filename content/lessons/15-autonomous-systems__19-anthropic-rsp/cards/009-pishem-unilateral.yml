- concept: набор тестов для фильтра обязателен должен содержать отрицательный случай — строгую отраслевую рекомендацию
  question: Фильтр односторонних обязательств проверяют тестами. На каких примерах видно, что он отбирает по разделу, а не по громким словам?
  explanation: 'На одних положительных примерах фильтр по ключевым словам и фильтр по разделу неотличимы: оба вернут остановку обучения и гейт. Различает их отраслевой стандарт вроде RAND SL-4 — он строг по формулировке, но обязательством Anthropic не является, и его появление в результате означает баг.'
  kind: choice
  options:
    - 'Достаточно двух положительных примеров: остановка обучения и гейт перед развёртыванием — если оба попали в результат, фильтр работает'
    - 'Нужен ещё отрицательный пример: жёсткий отраслевой стандарт, который в результат попасть не должен'
    - Достаточно проверить, что функция не падает на пустом списке элементов
