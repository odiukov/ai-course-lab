- concept: результат фильтра должен нести ссылку на исходный раздел, иначе отбор нельзя перепроверить
  question: Зачем в возвращаемых элементах сохранять ссылку на раздел документа, из которого мера взята, если фильтр уже отобрал только нужные?
  explanation: 'Тот же принцип, что и с записями об изменениях: вывод без источника нельзя аудировать. Строгие формулировки в результате выглядят убедительно независимо от того, откуда они взяты — ссылка на раздел единственное, что это различает.'
  kind: open
  reference: 'Без ссылки результат — плоский список фраз, и проверяющий не может отличить корректный отбор от ошибочного: чтобы убедиться, что мера действительно из уровня односторонних действий, придётся заново лезть в исходный документ. Ссылка делает каждую строку результата проверяемой и позволяет поймать ошибку разметки или изменение раздела в новой редакции.'
