- concept: 'рубрика проверяет цепочку: наблюдаемость наступления порога, обязательность следующего за ним действия, способность надзора обнаружить нарушение'
  question: Расставь по порядку шаги оценки одного обязательства политики по рубрике проверяемости.
  explanation: 'Каждое звено оценивается отдельно, потому что разрыв в любом из них обесценивает остальные: невидимое условие, необязательное действие или зависимый проверяющий по-разному ломают одну и ту же цепочку.'
  kind: order
  items:
    - Установить, можно ли внешне наблюдать наступление условия (порога)
    - Установить, следует ли за наступлением условия заранее заданное обязательное действие
    - Установить, способен ли надзор, не зависящий от автора решения, обнаружить неисполнение
    - Свести оценки отдельных строк в итоговый балл документа
  id: 033-ball-po-rubrike-1
  fingerprint: a71b0fef
- concept: слабости отдельных строк рубрики усиливают друг друга, а не складываются независимо
  question: 'В политике одновременно: условие порога сформулировано качественно, действие после порога не закреплено как обязательное, а проверку ведёт орган, подчинённый автору решения. Почему такое сочетание хуже суммы трёх отдельных недостатков?'
  explanation: Расплывчатый порог терпим, если за ним стоит жёсткое обязательство и внешняя проверка. Когда слабы все три звена, у обещания не остаётся ни точки срабатывания, ни последствия, ни свидетеля.
  kind: choice
  options:
    - Потому что рубрика умножает баллы строк, а не складывает
    - 'Потому что каждый недостаток снимает контроль над предыдущим: толкование условия ничем не ограничено, невыполнение действия ничем не запускается, расхождение некому зафиксировать'
    - Потому что три недостатка автоматически переводят документ в нижнюю категорию
    - Потому что объём документа при этом всегда растёт
  correct: 1
  id: 033-ball-po-rubrike-2
  fingerprint: cad10bd2
- concept: категория присваивается по порогу на итоговом балле, поэтому малое изменение средней оценки резко меняет ярлык
  question: Оценки по строкам рубрики изменились незначительно, а категория документа сменилась с «moderate» на «weak». Как это возможно?
  explanation: Балл меняется непрерывно, ярлык — скачком. Падение SaferAI на 0.3 (с 2.2 до 1.9) само по себе мало, но пересекло границу интервала, поэтому категория изменилась резко.
  kind: choice
  options:
    - Категория назначается экспертом отдельно от расчёта балла
    - Категория — это интервал на шкале итогового балла, и небольшой сдвиг средней оценки может пересечь его границу
    - Категория зависит от числа строк рубрики, а не от их оценок
    - При смене категории все строки обязаны изменить оценку одновременно
  correct: 1
  id: 033-ball-po-rubrike-3
  fingerprint: 643e684a
