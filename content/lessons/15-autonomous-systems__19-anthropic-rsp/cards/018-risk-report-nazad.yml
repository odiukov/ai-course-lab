- concept: 'проверяемость возникает при сопоставлении документа планов с отчётом по факту: обещанное минус доложенное'
  question: Почему внешнему читателю мало одного документа — только плана работ по безопасности или только отчёта по выпущенной модели? Объясни своими словами.
  explanation: 'Именно поэтому оба артефакта публичны и обновляются с объявленной периодичностью: ценность создаёт пара, а не отдельный текст.'
  kind: open
  reference: 'Каждый документ по отдельности можно написать убедительно: план перечисляет намерения, которые никто не сверит, а отчёт описывает то, что компания сама выбрала измерять. Проверяемость появляется при вычитании одного из другого: были ли изучены риски, которые план обещал изучить; появились ли меры, которые план называл исследуемыми; совпали ли ожидавшиеся возможности с наблюдаемыми. Расхождение между обещанным и доложенным — то, чего не видно ни в одном документе поодиночке.'
