- concept: Risk Report описывает наблюдаемые возможности конкретной выпущенной модели, а не гипотетические
  question: Какая запись уместна в разделе наблюдаемых возможностей отчёта о конкретной выпущенной модели?
  explanation: Наблюдаемые возможности — то, что удалось увидеть в оценках и испытаниях уже выпущенной модели. Ожидания на будущее и планы по мерам защиты относятся к документу, смотрящему вперёд.
  kind: choice
  options:
    - Модель, вероятно, сможет вести длинные исследовательские проекты в следующем поколении
    - Модель показала в оценках определённый результат на наборе исследовательских задач
    - Компания планирует исследовать меру защиты против такого поведения
    - Ожидается, что подобные возможности появятся у моделей отрасли в течение года
