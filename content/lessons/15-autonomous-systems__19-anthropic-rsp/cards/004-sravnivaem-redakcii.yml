- concept: 'порядок процедуры сравнения редакций: смысловые пункты, затем сопоставление пар, затем классификация несопоставленного'
  question: Расставь шаги процедуры сравнения двух редакций политики так, чтобы перестановка абзацев и переименование заголовков не выдавались за новую политику.
  explanation: Сначала сопоставление, потом классификация. Обратный порядок — сравнение строк — раскрашивает почти весь документ как новый, потому что редакторские движения неотличимы от смысловых.
  kind: order
  items:
    - Разбить каждую редакцию на смысловые пункты вида «кто, при каком условии, что делает, с каким последствием»
    - Для каждого пункта старой редакции найти смысловую пару в новой, игнорируя порядок и заголовки
    - Пункты без пары в новой редакции отнести к удалениям, пункты без пары в старой — к добавлениям
    - Для сопоставленных пар проверить условие, силу обещания, ответственного и последствие и отнести к изменениям только те, где что-то из этого сдвинулось
  id: 004-sravnivaem-redakcii-2
  fingerprint: 8a6b5fa6
- concept: признак удаления — отсутствие равнозначной замены, а не отсутствие похожего текста
  question: Пункт старой редакции «обучение прекращается при достижении порога» в новой не встречается дословно, но там есть пункт «при достижении порога запускается процедура остановки обучения с уведомлением совета». К какой корзине отнести?
  explanation: Удаление — это исчезновение пункта без равнозначной замены. Здесь замена есть, обязательство сохранено, поменялся механизм исполнения — значит изменение.
  kind: choice
  options:
    - 'К изменениям: равнозначная замена нашлась, но добавилась процедура и уведомление'
    - 'К удалениям: дословного совпадения в новой редакции нет'
    - К удалениям и добавлениям одновременно, чтобы отразить оба текста
    - 'Ни к какой: обе формулировки описывают остановку обучения'
