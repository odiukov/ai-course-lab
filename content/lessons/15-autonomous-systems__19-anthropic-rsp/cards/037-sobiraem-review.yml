- concept: 'проверки ревью связаны потреблением результатов: каждая следующая берёт на вход вывод предыдущей, поэтому решение о допуске стоит после разрыва в защите'
  question: Расставь проверки ревью в порядке, при котором каждая опирается на результат предыдущей.
  explanation: Требуемые меры невозможно назвать, не зная уровня; разрыв — разность требуемых и внедрённых; решение опирается на разрыв. Оценка документа по рубрике отвечает на другой вопрос — насколько сильны сами правила — и не влияет на предыдущие шаги, поэтому идёт отдельно.
  kind: order
  items:
    - определить уровень возможностей модели по измерениям
    - собрать накопительный список мер защиты, обязательных для этого уровня
    - вычислить разрыв между обязательными и фактически внедрёнными мерами
    - вынести решение о допуске к деплою с учётом разрыва
    - оценить сам текст политики по внешней рубрике
  id: 037-sobiraem-review-2
  fingerprint: 57d329da
- concept: ревью сохраняет промежуточные артефакты каждой проверки, потому что итоговый вердикт без входных данных нельзя перепроверить и нельзя оспорить по частям
  question: Почему в файл ревью выгружают все промежуточные результаты — дифф редакций, список односторонних обязательств, уровень возможностей, перечень недостающих мер, обоснование продолжения, — а не только итоговое решение?
  explanation: 'Вердикт без входов — утверждение на веру. В уроке результаты восьми функций складываются именно в цепочку доказательств: каждое звено видно и проверяемо по отдельности.'
  kind: open
  reference: 'Итоговое решение — функция от входов: смени измерение уровня или список внедрённых мер, и вердикт изменится. Без сохранённых входов внешний читатель не может ни воспроизвести вывод, ни указать, на каком именно звене он расходится с автором: приходится либо верить вердикту целиком, либо переделывать всю работу. Сохранённая цепочка делает возражение адресным («уровень определён неверно», «эта мера отнесена к обязательствам ошибочно») и оставляет след для аудита. Дополнительно она удерживает разнородные выводы рядом: решение о допуске говорит о соблюдении процедуры, оценка документа — о качестве самой процедуры, и сведение их в один ярлык теряет информацию.'
  id: 037-sobiraem-review-3
  fingerprint: 0e0fac3f
