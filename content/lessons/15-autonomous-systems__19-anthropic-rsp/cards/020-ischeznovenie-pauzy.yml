- concept: замена автоматического действия на условное решение переносит действие по умолчанию с остановки на продолжение
  question: В одной редакции политики пересечение порога возможностей само по себе запускает приостановку обучения до внедрения защит. В другой пересечение порога обязывает подготовить и опубликовать обоснование достаточности имеющихся мер, после чего работу можно продолжать. В чём главное различие конструкций, если считать, что обе требуют серьёзной работы?
  explanation: Обе привязаны к одному событию — пересечению порога, — но исход по умолчанию противоположный. В первой лаборатория должна что-то сделать, чтобы возобновить работу; во второй — что-то доказать, чтобы её не прерывать. Объём требуемой работы этого не компенсирует.
  kind: choice
  options:
    - Во второй конструкции требуется больше документов, поэтому она строже
    - В первой действие по умолчанию — остановка, во второй — продолжение, а остановка становится следствием отрицательного вывода
    - Первая конструкция применяется к обучению, вторая — только к развёртыванию
    - 'Различия нет: обе запускаются одним и тем же измеримым событием'
  correct: 1
  id: 020-ischeznovenie-pauzy-1
  fingerprint: a8970ce2
- concept: обязательство, условие которого оценивает сам обязанный, слабее обязательства с внешне наблюдаемым триггером
  question: 'Формулировка обязательства звучит так: «при пересечении порога работу можно продолжить, если применённые меры адекватны риску». Что в этой формулировке сильнее всего ослабляет её связывающую силу?'
  explanation: Пересечение порога — событие, которое можно наблюдать снаружи. «Меры адекватны» — оценка, которую выносит сам обязанный, и опубликованное обоснование её не превращает во внешний критерий. Условие, целиком контролируемое обязанной стороной, ограничивает её свободу действий слабее.
  kind: choice
  options:
    - Обязательство сформулировано текстом, а не числом
    - Адекватность мер оценивает та же организация, которая заинтересована в продолжении, и внешне наблюдаемого критерия у этого условия нет
    - Порог возможностей задан слишком высоко
    - Обязательство не опубликовано
  correct: 1
  id: 020-ischeznovenie-pauzy-2
  fingerprint: 76b29285
- concept: прозрачность решения и предопределённость решения — разные свойства обещания, и одно не заменяет другое
  question: Публикуемое обоснование продолжения работы после пересечения порога делает решение видимым для всех. Почему это не восстанавливает того, что давала обязательная остановка?
  explanation: Документ объясняет решение, но не задаёт его заранее. Критика опубликованного обоснования работает только через репутацию и внешнее давление, а не через механизм самой политики.
  kind: open
  reference: 'Обязательная остановка предопределяла результат: исход был известен до измерения и не зависел от того, как лаборатория интерпретирует ситуацию. Публикуемое обоснование делает решение видимым и обсуждаемым, но принимается оно уже после измерения и самой лабораторией; читатели могут возразить, однако возражение не имеет силы остановить работу. Прозрачность улучшает качество внешней дискуссии, а предопределённость снимает решение с усмотрения — это разные свойства, и второе не выводится из первого.'
  id: 020-ischeznovenie-pauzy-3
  fingerprint: 416f2ff0
