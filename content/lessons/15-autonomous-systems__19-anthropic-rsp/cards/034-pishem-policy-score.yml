- concept: округление выполняется один раз перед возвратом, промежуточные произведения и сумма не округляются
  question: Функция считает взвешенный балл и округляет каждое произведение «оценка × вес» до одного знака, прежде чем складывать. Что это ломает?
  explanation: Каждое раннее округление вносит свою ошибку, и они складываются с весами. Поэтому вся арифметика идёт в полной точности, а округление применяется единственный раз — к возвращаемому значению.
  kind: choice
  options:
    - 'Ничего: округление на любом шаге даёт тот же итог'
    - Только скорость расчёта
    - 'Ошибки округления копятся: мелкое улучшение критерия может исчезнуть из итога или, наоборот, оказаться преувеличенным'
    - Проверку диапазона оценок
  correct: 2
  id: 034-pishem-policy-score-2
  fingerprint: c2f0f093
- concept: нулевая сумма весов делает взвешенное среднее неопределённым и должна отклоняться до расчёта
  question: Во входных данных все веса критериев равны нулю. Как должна вести себя функция подсчёта балла?
  explanation: Деление на сумму весов невозможно при нулевой сумме, а любая молчаливая подстановка (ноль, равные веса) выдаёт за оценку то, чего рубрика не задала. Валидация — совпадение наборов критериев и весов, диапазон оценок, ненулевая сумма весов — идёт до арифметики.
  kind: choice
  options:
    - Вернуть ноль как итоговый балл
    - 'Отклонить вход с явной ошибкой: при нулевой сумме весов взвешенное среднее не определено'
    - Подставить равные веса и посчитать обычное среднее
    - Вернуть максимальный балл шкалы, так как ни один критерий не наказан
  correct: 1
