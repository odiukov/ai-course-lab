- concept: идентичная формулировка меры получает разный статус в зависимости от уровня, под которым напечатана
  question: Меру безопасности переносят из уровня «действия самой лаборатории» в уровень «рекомендации индустрии», не меняя в её тексте ни слова. Что происходит со статусом меры?
  explanation: 'Текст меры и её вес — разные вещи. Заголовок уровня работает как часть каждого предложения под ним: та же фраза наверху означает «мы сделаем», внизу — «отрасли стоило бы сделать». Именно поэтому самый жёсткий стандарт безопасности в RSP v3.0 (RAND SL-4) впечатляет, но лежит среди отраслевых рекомендаций.'
  kind: choice
  options:
    - 'Статус не меняется: обязательство задаётся текстом меры, а перенос — редакторская правка'
    - Мера перестаёт быть обещанием лаборатории и становится её мнением о том, как следует поступать отрасли
    - Мера становится обязательной уже для всех лабораторий сразу
