- concept: набор обязательных защит для уровня возможностей — объединение наборов всех уровней вплоть до целевого, а не только мер, впервые введённых на нём
  question: Шкала уровней возможностей устроена так, что на каждом уровне к режиму безопасности добавляются новые меры. Модель отнесена к пятому уровню из шести. Какой набор защитных мер обязателен для неё?
  explanation: 'Требования накопительные: мера, обязательная с более низкого уровня, не отменяется при переходе на более высокий — риск, который она закрывает, никуда не делся. Взять только «новинки» уровня — значит тихо снять уже действующие требования. Верхние уровни не подтягиваются: они привязаны к возможностям, которых у модели нет.'
  kind: choice
  options:
    - Только меры, впервые введённые на пятом уровне
    - Меры пятого уровня плюс меры всех уровней ниже него
    - Меры всех уровней шкалы, включая шестой
    - Меры пятого уровня плюс меры шестого, как запас прочности
  correct: 1
  id: 023-pishem-required-safeguards-1
  fingerprint: 1a94948e
- concept: 'порядок сборки накопительного списка требований: отбор уровней, объединение, дедупликация с сохранением порядка'
  question: Расставьте шаги функции, которая по уровню возможностей возвращает полный список обязательных защитных мер.
  explanation: 'Отбор идёт по уровням, а не по мерам: сперва решается, чьи требования применимы. Объединение снизу вверх даёт стабильный порядок — низкоуровневые меры идут первыми. Дедупликация с сохранением первого вхождения нужна, чтобы мера, повторённая на двух уровнях, не удваивала список и чтобы тесты не зависели от случайного порядка.'
  kind: order
  items:
    - Отобрать все уровни шкалы, не превышающие целевой
    - Объединить наборы мер отобранных уровней в порядке возрастания уровня
    - Убрать повторы, оставив первое вхождение каждой меры
    - Вернуть итоговый список как требования для целевого уровня
  id: 023-pishem-required-safeguards-2
  fingerprint: bd74c0cb
- concept: неизвестный уровень возможностей должен приводить к явной ошибке, а не к молчаливой подстановке ближайшего известного уровня
  question: В функцию, переводящую уровень возможностей в список обязательных защит, передали строку с опечаткой в названии уровня. Какое поведение безопаснее?
  explanation: 'Любая молчаливая подстановка превращает опечатку в ослабление режима безопасности: пустой список означает «защит не требуется», ближайший или минимальный уровень занижает требования, и никто этого не заметит. Ошибка при неизвестном уровне останавливает проверку там, где данные некорректны, вместо того чтобы выдать правдоподобный, но заниженный ответ.'
  kind: choice
  options:
    - Подставить ближайший похожий уровень и вернуть его меры
    - Вернуть пустой список и продолжить проверку
    - Явно сообщить об ошибке и не выдавать набор требований
    - Вернуть меры самого низкого уровня как безопасный минимум
  correct: 2
  id: 023-pishem-required-safeguards-3
  fingerprint: ac307b57
