- concept: к односторонним действиям относятся меры, исполнение которых зависит только от самой лаборатории
  question: Какая мера по своей природе относится к колонке односторонних действий лаборатории, а не к отраслевым рекомендациям?
  explanation: 'Односторонние действия — то, что компания выполняет независимо от поведения других: остановка обучения, конкретные меры безопасности, гейты на деплой. Всё, что требует согласованности рынка, живёт во второй колонке.'
  kind: choice
  options:
    - Остановка обучения собственной модели выше заданного порога опасной способности
    - Общий для всех лабораторий стандарт защиты весов моделей
    - Совместный отраслевой режим обмена данными об инцидентах
    - Единые для рынка требования к раскрытию результатов оценок
  correct: 0
