- concept: 'правило чтения двухуровневого расписания мер: у каждого обязательства сначала определять колонку'
  question: Двухуровневого расписания мер в прежней редакции RSP не было. Объясни, какое практическое правило чтения появляется из-за этого разделения и почему без него вывод о документе искажается.
  explanation: 'Проверка занимает секунду, а меняет вывод о документе целиком: обязательна ровно одна из двух колонок.'
  kind: open
  reference: 'Правило: для каждой найденной меры сначала определить, в какой из двух колонок она стоит — среди односторонних действий Anthropic или среди рекомендаций всей индустрии, — и только потом трактовать её как обещание. Обе колонки набраны одинаково и звучат похоже, поэтому громкая мера из второй колонки легко читается как обязательство, которого компания не давала. Без проверки колонки документ выглядит строже, чем есть: часть его силы приходится на пожелания к другим, а не на собственные обязательства.'
  id: 006-dva-urovnya-3
  fingerprint: 3d32fa68
