- concept: 'строгость меры и её обязательность независимы: более жёсткий стандарт может нести меньше обязательств'
  question: Объясни своими словами, почему самая жёсткая мера безопасности в документе может обязывать лабораторию меньше, чем куда более скромная мера из того же документа.
  explanation: Ошибка чтения — брать в качестве меры обязательности суровость глагола и подробность формулировки. Обязательность даёт исполнитель и раздел документа, а не громкость требования.
  kind: open
  reference: 'Строгость описывает высоту планки, обязательность — кто и при каких условиях обязан её взять. Жёсткая мера, адресованная всей отрасли, требует коллективного исполнителя: лаборатория не может выполнить её в одиночку, поэтому её присутствие в документе выражает позицию, а не обещание. Скромная мера вроде конкретного гейта перед развёртыванием исполняется самой лабораторией и потому связывает её реально. В RSP v3.0 так устроен RAND SL-4: самый жёсткий упомянутый стандарт лежит среди industry-wide recommendations.'
  id: 008-vydelyaem-obyazatelstva-1
  fingerprint: a926f8fa
- concept: какие именно меры RSP v3.0 относит к односторонним действиям, а какие — к отраслевым рекомендациям
  question: Какая пара мер верно отражает разбиение в RSP v3.0?
  explanation: 'Anthropic unilateral actions — остановка обучения выше порога, конкретные меры безопасности, конкретные гейты на деплой: всё это компания делает независимо от поведения других лабораторий. Industry-wide recommendations — то, что по мнению Anthropic отрасль должна принять сообща, туда попадает RAND SL-4.'
  kind: choice
  options:
    - 'Односторонние действия: остановка обучения выше порога и конкретные гейты перед развёртыванием. Отраслевые рекомендации: общий стандарт безопасности для всех лабораторий'
    - 'Односторонние действия: общий стандарт безопасности для всех лабораторий. Отраслевые рекомендации: остановка обучения выше порога'
    - Оба уровня содержат одни и те же меры, различаясь только сроками исполнения
