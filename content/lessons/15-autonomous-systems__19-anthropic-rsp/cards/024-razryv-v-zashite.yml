- concept: разрыв в защите вычисляется как разность множеств требуемых и внедрённых мер, а не как разность их количеств
  question: Для модели требуется 12 защитных мер. Внедрено и подтверждено 10 мер, из них 7 входят в список требуемых, остальные относятся к другим режимам. Сколько обязательных мер отсутствует?
  explanation: 'Считается разность множеств: 12 требуемых минус 7 покрытых = 5 отсутствующих. Разность количеств (12 − 10 = 2) даёт неверный ответ, потому что три внедрённые меры не закрывают ни одного требования. Именно поэтому сравнение ведётся поэлементно, а совпадение или близость чисел ничего не доказывает.'
  kind: numeric
  answer: 5
  tolerance: 0.5
  id: 024-razryv-v-zashite-1
  fingerprint: f4cbebf9
- concept: избыточная или более строгая мера не засчитывается как выполнение другого обязательного требования
  question: Режим требует отдельной меры по контролю доступа. Она не внедрена, зато развёрнуто расширенное журналирование событий, которого в списке требований нет. Как это учитывается при сверке?
  explanation: Каждое требование закрывается только соответствующей ему мерой. Журналирование фиксирует, что произошло, но не ограничивает, кто получает доступ — это разные риски. Зачёт «сверх нормы» вместо конкретного требования превращает сверку в сравнение объёмов работ и скрывает реальный пробел.
  kind: choice
  options:
    - 'Контроль доступа считается закрытым: внедрена более сильная мера'
    - Контроль доступа остаётся отсутствующим, журналирование идёт как дополнительная мера
    - Требование снимается, так как общее число внедрённых мер не уменьшилось
    - Требование считается частично закрытым и в список отсутствующих не попадает
