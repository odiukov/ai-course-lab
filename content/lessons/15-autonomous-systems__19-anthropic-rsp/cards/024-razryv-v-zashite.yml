- concept: сверка ведётся по заранее согласованным идентификаторам мер, иначе разные написания одного требования расходятся как разные элементы
  question: Дополните строку, вычисляющую список отсутствующих защитных мер. Оба набора хранят согласованные идентификаторы мер.
  explanation: 'Отсутствующие — это требуемые, которым не нашлось точного соответствия среди внедрённых. Сравнение работает только на едином словаре идентификаторов: `access_control` и `access_controls` для программы разные элементы, и расхождение в написании даст либо ложный пробел, либо ложное покрытие. Отсюда же требование, чтобы подтверждение внедрения относилось именно к модели-кандидату.'
  kind: cloze
