- concept: описание защит через affirmative case не равнозначно заранее перечисленному списку обязательных мер
  question: 'Политика говорит: при достижении высокого порога возможностей лаборатория представит доводы в пользу безопасности дальнейшего масштабирования. Чем это отличается от перечня обязательных защитных мер?'
  explanation: 'SaferAI отметила именно это по порогу AI R&D-4: обязательство сформулировано как «представить affirmative case», а не как набор действий. Внешний читатель тогда проверяет убедительность рассуждения, а не выполнение заранее известного требования.'
  kind: choice
  options:
    - 'Ничем: доводы и есть перечень мер, только в текстовой форме'
    - Заранее не зафиксировано, какие действия обязательны, поэтому проверить достаточность можно лишь оценивая аргумент, а не сверяя список
    - Доводы всегда строже конкретных мер, потому что охватывают все сценарии
    - Отличие только в том, кто публикует документ
  correct: 1
