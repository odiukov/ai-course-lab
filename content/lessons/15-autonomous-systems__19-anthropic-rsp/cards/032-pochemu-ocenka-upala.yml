- concept: надзор силами внутренней консультативной группы лаборатории засчитывается рубрикой как слабый независимый контроль
  question: Механизмы проверки соблюдения политики опираются главным образом на внутреннюю консультативную группу по безопасности самой лаборатории. Как это влияет на оценку по внешней рубрике?
  explanation: Из четырёх причин понижения три касались формулировок, а эта — субъекта проверки. Внутренняя группа остаётся проверяющим, но её выводы не может перепроверить сторона, не зависящая от автора решения.
  kind: choice
  options:
    - 'Не влияет: важно наличие проверки, а не её принадлежность'
    - Повышает оценку, потому что внутренняя группа лучше знает модели
    - 'Понижает оценку: правило пишет, применяет и оценивает исполнение одна и та же сторона, независимого подтверждения выводов мало'
    - Понижает оценку только если группа не публикует протоколы заседаний
  correct: 2
