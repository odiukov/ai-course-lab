- concept: перечень недостающих мер строится обходом требований уровня в их исходном порядке, что делает отчёт детерминированным
  question: Расставь шаги функции, которая возвращает список незакрытых обязательных мер защиты для модели.
  explanation: 'Обход идёт по требованиям, а не по внедрённым мерам: тогда порядок вывода наследуется от нормативного списка и не зависит от того, в каком порядке лаборатория внедряла защиты. Одинаковые входные данные дают побайтово одинаковый отчёт, и тест можно писать на точный список.'
  kind: order
  items:
    - Определить набор мер, обязательных для уровня возможностей модели
    - Пройти этот набор в том порядке, в каком он задан
    - Оставить только те меры, которых нет среди внедрённых
    - Вернуть получившийся перечень
  id: 025-pishem-missing-safeguards-1
  fingerprint: 6a4182fd
- concept: 'вырожденные входы: пустое множество внедрённых мер даёт полный перечень требований, полное совпадение — пустой перечень'
  question: Для уровня возможностей обязательны 5 мер защиты. У модели не внедрено ни одной. Что должна вернуть функция поиска незакрытых требований?
  explanation: 'Пустое множество внедрённого — законный вход, а не ошибка: разность «требуется минус есть» равна всему нормативному набору. Зеркальный вырожденный случай — все требования закрыты, тогда перечень пуст. Путать эти два края опасно: пустой ответ означает «всё в порядке», и выдать его при нулевом внедрении значит выдать допуск незащищённой модели.'
  kind: choice
  options:
    - Пустой перечень — сравнивать не с чем
    - Все 5 обязательных мер
    - 'Признак ошибки: входные данные некорректны'
    - Одну меру — первую по списку, как ближайшую к внедрению
  correct: 1
  id: 025-pishem-missing-safeguards-2
  fingerprint: 8bd2fb99
- concept: 'недостающими считаются требования, отсутствующие среди внедрённых мер: проверка идёт от требования к внедрённому, а не наоборот'
  question: 'Заполни пропуск: функция должна вернуть обязательные меры, которых нет у модели.'
  explanation: 'Перебор идёт по требованиям, а условие отсеивает те, что уже есть среди внедрённых. Перевернуть направление — перебирать внедрённые и искать их в требованиях — значит получить совсем другой список: перечень лишних мер, а не незакрытых обязательств.'
