- concept: постоянный статус и объявленная периодичность обновления делают сверку планов и результатов повторяемой, а не разовой
  question: Лаборатория публикует дорожную карту безопасности и отчёты о рисках как постоянные документы с объявленной периодичностью обновления, а не как разовые публикации. Что это даёт читателю по сравнению с однократным релизом обоих документов?
  explanation: 'Разовый документ сверить не с чем: у него нет ни предшественника, ни продолжения. Регулярный выпуск обоих артефактов превращает сверку в повторяющуюся процедуру — каждый новый отчёт проверяется против ранее объявленных планов, а новая редакция дорожной карты показывает, что было пересмотрено.'
  kind: choice
  options:
    - Гарантию, что запланированные меры защиты уже внедрены
    - Возможность повторять сверку из цикла в цикл и видеть, как обещания переходят в результаты со временем
    - Право требовать остановки обучения при пересечении порога
    - Независимую внешнюю оценку остаточного риска
  correct: 1
  id: 019-proverka-plan-fakt-1
  fingerprint: 35cfa496
- concept: публичность обоих артефактов переносит сверку плана и факта из внутреннего аудита в руки любого внешнего читателя
  question: Почему для проверяемости политики важно, чтобы и документ планов по безопасности, и отчёт по факту были публичными, а не только внутренними?
  explanation: 'Ценность пары документов возникает у того, кто читает оба. Внутренний документ такой пары не образует: он не даёт третьей стороне точки опоры для сравнения.'
  kind: open
  reference: 'Сверка «обещали — доложили» состоит в вычитании одного документа из другого. Если хотя бы один остаётся внутренним, вычитание может выполнить только сама лаборатория, и результат сверки приходится принимать на веру. Публичность обоих делает процедуру доступной любому внешнему наблюдателю — журналисту, исследователю, регулятору — и они получают одинаковый исходный материал. При этом публичность не гарантирует полноту содержания: она обеспечивает лишь возможность независимой проверки, а не её результат.'
  id: 019-proverka-plan-fakt-2
  fingerprint: '34512769'
