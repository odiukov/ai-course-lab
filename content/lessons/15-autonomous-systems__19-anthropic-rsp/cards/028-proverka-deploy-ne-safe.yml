- concept: вердикт о допуске не надёжнее измерений, поданных ему на вход
  question: Объясни своими словами, почему решение о допуске не может быть надёжнее измерений, из которых оно вычислено.
  explanation: 'Ошибка входа не проявляется как сбой: логика корректно считает неверные числа. Поэтому качество эвалов и честность отметок о внедрении — часть цепочки допуска, а не внешние по отношению к ней детали.'
  kind: open
  reference: Движок берёт измерения возможностей и список внедрённых мер как данность и лишь сравнивает их с порогами и требованиями. Если измерение занижено (например, модель ведёт себя осторожнее, распознав ситуацию проверки), устарело или мера отмечена внедрённой лишь на бумаге, вычисление отработает без ошибки и выдаст «разрешено» на ложных входах. Вердикт наследует все дефекты входов и никак их не диагностирует, поэтому доверие к нему ограничено сверху доверием к измерениям и к инвентарю мер.
  id: 028-proverka-deploy-ne-safe-2
  fingerprint: 465aa904
