- concept: повышение уровня возможностей делает ранее достаточный набор защит недостаточным, потому что требования привязаны к цене ошибки на этом уровне
  question: Модель дообучили, и она перешла на более высокий уровень возможностей. Инфраструктура развёртывания не менялась. Почему прежние защитные меры больше нельзя считать достаточными?
  explanation: Достаточность мер — не свойство самих мер, а отношение между мерами и уровнем. Модель изменилась, отношение изменилось, вывод «раньше хватало» больше не переносится.
  kind: open
  reference: 'Набор обязательных мер — ограничение доступа, контроль использования, защита весов модели, обнаружение нарушений, порядок реагирования на инцидент — привязан не к инфраструктуре, а к уровню возможностей: чем серьёзнее то, что модель способна сделать, тем тяжелее последствия отказа любой из этих мер. Неизменная инфраструктура при выросших возможностях означает, что защита рассчитана на меньшую цену ошибки. Поэтому переход на новый уровень сам по себе открывает разрыв: нужно взять набор требований этого уровня и заново сверить с ним фактическое состояние защит.'
