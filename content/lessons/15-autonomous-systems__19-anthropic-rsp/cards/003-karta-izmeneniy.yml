- concept: добавления новой редакции RSP — дорожные карты безопасности, отчёты о рисках и порог по ускорению исследований и разработки ИИ
  question: Что было добавлено в актуальной редакции RSP Anthropic по сравнению с предыдущей?
  explanation: Добавления — это планы усиления безопасности, отчёты о конкретных рисках и новый порог по AI R&D. Все три улучшают видимость происходящего, но ни один сам по себе не останавливает работу.
  kind: choice
  options:
    - Frontier Safety Roadmaps, Risk Reports и порог, связанный со способностью модели существенно ускорять исследования и разработку ИИ
    - Обязательный внешний аудит каждой модели независимым регулятором
    - Запрет на публикацию весов любых моделей выше заданного порога вычислений
    - Требование останавливать инференс при обнаружении опасной способности в проде
