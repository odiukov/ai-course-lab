- concept: самостоятельное применение внешней рубрики к первоисточнику даёт разложение балла по строкам, тогда как ссылка на опубликованный итоговый балл этого разложения не содержит
  question: Что даёт самостоятельное применение опубликованной рубрики оценки к тексту политики по сравнению с простой ссылкой на итоговый балл, который эта рубрика дала?
  explanation: 'Оценка SaferAI 1.9 для RSP v3.0 как число не переносима на решения: чтобы понять, что менять, нужны вклады отдельных строк рубрики, а они появляются только при самостоятельном прогоне рубрики по документу.'
  kind: open
  reference: 'Итоговый балл — агрегат: он говорит «слабо», но не говорит, чем именно слабо. Самостоятельное применение рубрики восстанавливает оценку по каждой строке, поэтому видно, какие строки утянули результат вниз (например проверяемость порогов и независимость надзора), какие оказались нейтральными, и совпал ли собственный результат с опубликованным. Расхождение — сигнал, что рубрика прочитана иначе или документ понят иначе, и его можно локализовать до конкретной строки. Кроме того, разложение показывает, какое исправление в политике реально сдвинуло бы балл, а какое нет — из одного числа 1.9 этого не видно.'
  id: 038-itogovaya-proverka-2
  fingerprint: 3601fc87
- concept: пересчёт или смена бенчмарка — повод обновить процедуру измерения порога, а не повод ослабить обещанное последствие
  question: Обязательство «при достижении порога обучение приостанавливается» опиралось на бенчмарк, который с тех пор пересчитали и заменили новой версией. Какая замена сохраняет доверие к обязательству?
  explanation: Дрейф инструмента измерения касается условия, а не последствия. Если из-за пересчёта шкалы автоматическое действие подменяют решением по усмотрению, действие по умолчанию становится «продолжать», и обещание теряет силу; правильный ремонт — версионировать порог и опубликовать перенос отметки, оставив последствие неизменным.
  kind: choice
  options:
    - Заменить приостановку на решение руководства по обстоятельствам — измерение всё равно стало ненадёжным
    - Сохранить приостановку как последствие и добавить процедуру переноса порога на новую версию бенчмарка с публикацией сопоставления шкал
    - Убрать порог и описывать безопасность через общее обоснование без числовых условий
    - Оставить старую версию бенчмарка навсегда, чтобы порог не пришлось переносить
  correct: 1
