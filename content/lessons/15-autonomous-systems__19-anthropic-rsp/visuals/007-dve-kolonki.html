<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Одинаковый текст, разный вес обещаний</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f4f7fb;
      --surface: #ffffff;
      --panel-left: #edf7f1;
      --panel-right: #fff6e8;
      --card: #ffffff;
      --text: #172033;
      --muted: #596579;
      --border: #9aa7b8;
      --commit: #19734b;
      --commit-soft: #d5f0df;
      --recommend: #a45a00;
      --recommend-soft: #ffe3b8;
      --guide: #657187;
      --arrow: #6658b8;
      --fallback: #9d2f3f;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --surface: #171f2c;
        --panel-left: #162b24;
        --panel-right: #302517;
        --card: #202a39;
        --text: #edf2fa;
        --muted: #b5c0d0;
        --border: #607087;
        --commit: #78d6a6;
        --commit-soft: #214b38;
        --recommend: #ffc46c;
        --recommend-soft: #5a3c17;
        --guide: #91a0b5;
        --arrow: #b7aaff;
        --fallback: #ff9eac;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      background: var(--page);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .figure {
      max-width: 960px;
      margin: auto;
    }

    h1 {
      color: var(--text);
      font-size: 18px;
      line-height: normal;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    text {
      fill: var(--text);
      font-family: inherit;
    }

    .panel {
      stroke: var(--border);
    }

    .panel-left {
      fill: var(--panel-left);
    }

    .panel-right {
      fill: var(--panel-right);
    }

    .card {
      fill: var(--card);
      stroke: var(--border);
    }

    .column-title {
      font-weight: bold;
    }

    .column-note,
    .card-note,
    .explanation,
    .footer-note,
    .move-note {
      fill: var(--muted);
    }

    .card-kicker {
      fill: var(--guide);
      font-weight: bold;
    }

    .card-main {
      font-weight: bold;
    }

    .commitment-text {
      fill: var(--commit);
      font-weight: bold;
    }

    .recommendation-text {
      fill: var(--recommend);
      font-weight: bold;
    }

    .commitment-badge {
      fill: var(--commit-soft);
      stroke: var(--commit);
    }

    .recommendation-badge {
      fill: var(--recommend-soft);
      stroke: var(--recommend);
    }

    .badge-text {
      font-weight: bold;
    }

    .guide-line {
      stroke: var(--guide);
      fill: none;
    }

    .divider {
      stroke: var(--border);
    }

    .move-arrow {
      stroke: var(--arrow);
      fill: none;
    }

    .move-head {
      fill: var(--arrow);
    }

    .fallback {
      fill: var(--fallback);
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="figure">
    <h1>Одинаковый текст, разный вес обещаний</h1>

    <svg
      id="diagram"
      viewBox="0 0 960 440"
      width="960"
      height="440"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description"
    >
      <title id="svg-title">Две одинаково оформленные меры с разным весом</title>
      <desc id="svg-description">
        Слева мера находится среди собственных действий Anthropic и является
        обязательством. Справа такая же формулировка, включая RAND SL-4,
        находится среди отраслевых рекомендаций и выражает пожелание.
      </desc>
      <g id="drawing"></g>
    </svg>
  </main>

  <script>
    const DATA = [
      {
        origin: { x: 28, y: 8 },
        scale: { x: 7.8, y: 7 },
        line: { thin: 1.4, normal: 2, strong: 3 },
        font: {
          header: 17,
          columnNote: 13,
          kicker: 11,
          main: 19,
          cardNote: 14,
          badge: 13,
          result: 20,
          explanation: 14,
          move: 14,
          footer: 16,
          fallback: 17
        },
        labelOffset: { none: 0, above: -8, below: 15 },
        fallback: [
          {
            x: 60,
            y: 27,
            text: "Схема должна была показать две одинаковые карточки:"
          },
          {
            x: 60,
            y: 31,
            text: "слева — обязательство Anthropic, справа — рекомендацию индустрии."
          },
          {
            x: 60,
            y: 35,
            text: "RAND SL-4 относится ко второй колонке и не является обещанием."
          }
        ]
      },

      {
        kind: "rect",
        className: "panel panel-left",
        x: 4,
        y: 2,
        x2: 57,
        y2: 49,
        stroke: "thin"
      },
      {
        kind: "rect",
        className: "panel panel-right",
        x: 63,
        y: 2,
        x2: 116,
        y2: 49,
        stroke: "thin"
      },
      {
        kind: "line",
        className: "divider",
        x: 60,
        y: 2,
        x2: 60,
        y2: 49,
        stroke: "normal"
      },

      {
        kind: "text",
        className: "column-title commitment-text",
        x: 30.5,
        y: 5.2,
        anchor: "middle",
        font: "header",
        text: "Anthropic unilateral actions"
      },
      {
        kind: "text",
        className: "column-note",
        x: 30.5,
        y: 8.4,
        anchor: "middle",
        font: "columnNote",
        text: "то, что компания берёт на себя"
      },
      {
        kind: "text",
        className: "column-title recommendation-text",
        x: 89.5,
        y: 5.2,
        anchor: "middle",
        font: "header",
        text: "industry-wide recommendations"
      },
      {
        kind: "text",
        className: "column-note",
        x: 89.5,
        y: 8.4,
        anchor: "middle",
        font: "columnNote",
        text: "то, что предлагается всей индустрии"
      },

      {
        kind: "line",
        className: "guide-line",
        x: 30.5,
        y: 9.3,
        x2: 30.5,
        y2: 12.2,
        stroke: "normal"
      },
      {
        kind: "polygon",
        className: "guide-line",
        stroke: "normal",
        points: [
          { x: 29.8, y: 11.3 },
          { x: 30.5, y: 12.2 },
          { x: 31.2, y: 11.3 }
        ]
      },
      {
        kind: "line",
        className: "guide-line",
        x: 89.5,
        y: 9.3,
        x2: 89.5,
        y2: 12.2,
        stroke: "normal"
      },
      {
        kind: "polygon",
        className: "guide-line",
        stroke: "normal",
        points: [
          { x: 88.8, y: 11.3 },
          { x: 89.5, y: 12.2 },
          { x: 90.2, y: 11.3 }
        ]
      },

      {
        kind: "rect",
        className: "card",
        x: 8,
        y: 12.5,
        x2: 53,
        y2: 29.8,
        stroke: "normal"
      },
      {
        kind: "rect",
        className: "card",
        x: 67,
        y: 12.5,
        x2: 112,
        y2: 29.8,
        stroke: "normal"
      },

      {
        kind: "text",
        className: "card-kicker",
        x: 30.5,
        y: 16.1,
        anchor: "middle",
        font: "kicker",
        text: "МЕРА БЕЗ ИЗМЕНЕНИЯ ФОРМУЛИРОВКИ"
      },
      {
        kind: "text",
        className: "card-main",
        x: 30.5,
        y: 21,
        anchor: "middle",
        font: "main",
        text: "Применять строгие"
      },
      {
        kind: "text",
        className: "card-main",
        x: 30.5,
        y: 24.4,
        anchor: "middle",
        font: "main",
        text: "меры безопасности"
      },
      {
        kind: "text",
        className: "card-note",
        x: 30.5,
        y: 27.8,
        anchor: "middle",
        font: "cardNote",
        text: "конкретное действие самой Anthropic"
      },

      {
        kind: "text",
        className: "card-kicker",
        x: 89.5,
        y: 16.1,
        anchor: "middle",
        font: "kicker",
        text: "МЕРА БЕЗ ИЗМЕНЕНИЯ ФОРМУЛИРОВКИ"
      },
      {
        kind: "text",
        className: "card-main",
        x: 89.5,
        y: 21,
        anchor: "middle",
        font: "main",
        text: "Применять строгие"
      },
      {
        kind: "text",
        className: "card-main",
        x: 89.5,
        y: 24.4,
        anchor: "middle",
        font: "main",
        text: "меры безопасности"
      },
      {
        kind: "text",
        className: "card-note",
        x: 89.5,
        y: 27.8,
        anchor: "middle",
        font: "cardNote",
        text: "включая RAND SL-4"
      },

      {
        kind: "rect",
        className: "commitment-badge",
        x: 13,
        y: 32.2,
        x2: 48,
        y2: 36.5,
        stroke: "thin"
      },
      {
        kind: "text",
        className: "badge-text commitment-text",
        x: 30.5,
        y: 35,
        anchor: "middle",
        font: "badge",
        text: "СОБСТВЕННОЕ ОБЯЗАТЕЛЬСТВО"
      },
      {
        kind: "text",
        className: "commitment-text",
        x: 30.5,
        y: 41,
        anchor: "middle",
        font: "result",
        text: "Anthropic сделает"
      },
      {
        kind: "text",
        className: "explanation",
        x: 30.5,
        y: 45,
        anchor: "middle",
        font: "explanation",
        text: "решение не зависит от других лабораторий"
      },

      {
        kind: "rect",
        className: "recommendation-badge",
        x: 70,
        y: 32.2,
        x2: 109,
        y2: 36.5,
        stroke: "thin"
      },
      {
        kind: "text",
        className: "badge-text recommendation-text",
        x: 89.5,
        y: 35,
        anchor: "middle",
        font: "badge",
        text: "ПОЖЕЛАНИЕ ДЛЯ ИНДУСТРИИ"
      },
      {
        kind: "text",
        className: "recommendation-text",
        x: 89.5,
        y: 41,
        anchor: "middle",
        font: "result",
        text: "Anthropic считает,"
      },
      {
        kind: "text",
        className: "recommendation-text",
        x: 89.5,
        y: 44.3,
        anchor: "middle",
        font: "result",
        text: "что так должны делать все"
      },
      {
        kind: "text",
        className: "explanation",
        x: 89.5,
        y: 47.5,
        anchor: "middle",
        font: "explanation",
        text: "RAND SL-4 здесь — позиция, не обещание"
      },

      {
        kind: "text",
        className: "move-note",
        x: 47,
        y: 52.3,
        anchor: "end",
        font: "move",
        text: "тот же текст, но другая колонка"
      },
      {
        kind: "line",
        className: "move-arrow",
        x: 49,
        y: 53.8,
        x2: 72,
        y2: 53.8,
        stroke: "strong"
      },
      {
        kind: "polygon",
        className: "move-head",
        points: [
          { x: 72, y: 53.8 },
          { x: 69.8, y: 52.4 },
          { x: 69.8, y: 55.2 }
        ]
      },
      {
        kind: "text",
        className: "footer-note",
        x: 60,
        y: 59.2,
        anchor: "middle",
        font: "footer",
        text: "В RSP v3.0 заголовок колонки — часть смысла каждой карточки"
      }
    ];

    const [cfg, ...elements] = DATA;
    const origin = cfg.origin;
    const scale = cfg.scale;

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const svg = document.getElementById("diagram");
    const drawing = document.getElementById("drawing");
    const namespace = svg.namespaceURI;

    function create(name, attributes, className) {
      const element = document.createElementNS(namespace, name);

      if (className) {
        element.setAttribute("class", className);
      }

      for (const [name, value] of Object.entries(attributes)) {
        element.setAttribute(name, String(value));
      }

      return element;
    }

    function appendRect(item) {
      drawing.appendChild(
        create(
          "rect",
          {
            x: sx(item.x),
            y: sy(item.y),
            width: sx(item.x2) - sx(item.x),
            height: sy(item.y2) - sy(item.y),
            "stroke-width": cfg.line[item.stroke]
          },
          item.className
        )
      );
    }

    function appendLine(item) {
      drawing.appendChild(
        create(
          "line",
          {
            x1: sx(item.x),
            y1: sy(item.y),
            x2: sx(item.x2),
            y2: sy(item.y2),
            "stroke-width": cfg.line[item.stroke],
            "stroke-linecap": "round",
            "stroke-linejoin": "round"
          },
          item.className
        )
      );
    }

    function appendPolygon(item) {
      const points = item.points
        .map(point => `${sx(point.x)},${sy(point.y)}`)
        .join(" ");

      const attributes = {
        points,
        "stroke-linecap": "round",
        "stroke-linejoin": "round"
      };

      if (item.stroke) {
        attributes["stroke-width"] = cfg.line[item.stroke];
      }

      drawing.appendChild(
        create("polygon", attributes, item.className)
      );
    }

    function appendText(item) {
      const text = create(
        "text",
        {
          x: sx(item.x) + cfg.labelOffset.none,
          y: sy(item.y) + cfg.labelOffset.none,
          "text-anchor": item.anchor,
          "dominant-baseline": "middle",
          "font-size": cfg.font[item.font]
        },
        item.className
      );

      text.textContent = item.text;
      drawing.appendChild(text);
    }

    try {
      for (const item of elements) {
        if (item.kind === "rect") {
          appendRect(item);
        } else if (item.kind === "line") {
          appendLine(item);
        } else if (item.kind === "polygon") {
          appendPolygon(item);
        } else if (item.kind === "text") {
          appendText(item);
        }
      }
    } catch (error) {
      drawing.replaceChildren();

      for (const item of cfg.fallback) {
        const text = create(
          "text",
          {
            x: sx(item.x) + cfg.labelOffset.none,
            y: sy(item.y) + cfg.labelOffset.none,
            "text-anchor": "middle",
            "dominant-baseline": "middle",
            "font-size": cfg.font.fallback
          },
          "fallback"
        );

        text.textContent = item.text;
        drawing.appendChild(text);
      }
    }
  </script>
</body>
</html>
