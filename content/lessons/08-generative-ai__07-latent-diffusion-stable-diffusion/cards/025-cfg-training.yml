- concept: случайное удаление условия обучает одну модель условному и безусловному предсказанию
  question: Как обучить один диффузионный денойзер выдавать как условное, так и безусловное предсказание шума?
  explanation: При обучении примерно в 10% примеров условие заменяют пустым токеном. Поэтому одни веса учатся предсказывать шум и с текстом, и без текстового условия.
  kind: choice
  options:
    - Обучить независимый безусловный денойзер и усреднять параметры моделей
    - Иногда удалять зашумлённый латент, оставляя модели только текст
    - Иногда заменять текстовое условие специальным пустым условием, сохраняя латент и шаг диффузии
    - Убирать промпт только на инференсе, не показывая пустое условие при обучении
  correct: 2
  id: 025-cfg-training-1
  fingerprint: cf3dc523
- concept: парные предсказания на одинаковом состоянии диффузии изолируют влияние условия
  question: Почему в classifier-free guidance условное и безусловное предсказания вычисляют одной сетью для одного и того же зашумлённого латента и шага диффузии?
  explanation: 'Оба прохода отличаются только условием: промптом или пустым токеном. Поэтому разность ε_cond и ε_uncond выражает направление, в котором текст изменяет предсказание шума.'
  kind: open
  reference: Так различие между предсказаниями можно отнести именно к наличию или отсутствию условия. Если изменить латент, шаг или веса модели, разность будет смешивать влияние промпта с другими изменениями.
  id: 025-cfg-training-2
  fingerprint: b496a1e1
