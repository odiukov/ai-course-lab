- concept: заморозка модуля запрещает обновление его параметров, но не выполнение прямого прохода
  question: Энкодер VAE заморожен во время обучения латентной диффузионной модели. Что это означает?
  explanation: Замороженный энкодер продолжает выполнять E(x) и создавать обучающие латенты. Заморозка означает лишь, что оптимизатор не изменяет его веса; обновляются параметры шумоподавителя.
  kind: choice
  options:
    - Энкодер полностью удалён и не участвует в обработке данных
    - Энкодер вычисляет латенты, но его параметры не обновляются
    - Энкодер обучается, а параметры шумоподавителя остаются неизменными
    - Энкодер заменяет латенты случайным гауссовским шумом
  correct: 1
  id: 014-freeze-first-stage-1
  fingerprint: cdb4ae42
- concept: фиксация энкодера сохраняет стабильное распределение обучающих латентов
  question: Почему одновременное обновление энкодера VAE может затруднить обучение шумоподавителя в латентном пространстве?
  explanation: Замороженный энкодер задаёт неизменное пространство латентов. Если его веса обновлять, распределение z будет сдвигаться по ходу обучения, превращая задачу шумоподавителя в обучение на нестабильной цели.
  kind: open
  reference: При изменении энкодера одни и те же изображения отображаются в постоянно меняющиеся латенты. Шумоподавитель получает движущееся целевое распределение, поэтому ему приходится одновременно осваивать генерацию и приспосабливаться к изменениям представления.
  id: 014-freeze-first-stage-2
  fingerprint: 58805f14
