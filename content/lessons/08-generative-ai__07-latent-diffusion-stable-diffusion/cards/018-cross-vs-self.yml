- concept: в cross-attention запросы строятся из латента, а ключи и значения — из текстовых эмбеддингов
  question: Как распределяются Q, K и V в cross-attention текстово-обусловленной U-Net?
  explanation: Латентные позиции с помощью Q ищут релевантную информацию. K задаёт представления текстовых токенов для сопоставления, а V содержит текстовую информацию, которая передаётся латенту.
  kind: choice
  options:
    - Q формируется из латентных признаков, а K и V — из текстовых эмбеддингов
    - Q, K и V формируются только из латентных признаков
    - Q формируется из текста, а K и V — из латентных признаков
    - Q, K и V формируются только из текстовых эмбеддингов
  correct: 0
  id: 018-cross-vs-self-1
  fingerprint: 1cdafc2a
- concept: текстовый энкодер расширяет обусловливание с фиксированного набора классов до произвольных закодированных фраз
  question: Почему замена таблицы эмбеддингов классов текстовым энкодером позволяет диффузионной модели принимать более разнообразные условия, хотя способ их передачи в U-Net остаётся похожим?
  explanation: Меняется источник условия, а не общий принцип обусловливания. Вместо выбора одного вектора из ограниченной таблицы U-Net получает представление введённого текста и использует его в cross-attention.
  kind: open
  reference: Таблица классов предоставляет только фиксированный набор обученных векторов. Текстовый энкодер создаёт последовательность эмбеддингов для произвольной фразы, после чего U-Net получает это условие через тот же механизм внимания.
  id: 018-cross-vs-self-2
  fingerprint: 98c323bf
