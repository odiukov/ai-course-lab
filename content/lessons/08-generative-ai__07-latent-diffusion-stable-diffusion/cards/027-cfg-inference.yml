- concept: положительный classifier-free guidance экстраполирует прогноз за условную точку
  question: Где располагается результат CFG при положительном коэффициенте w относительно безусловного и условного предсказаний шума?
  explanation: 'CFG вычисляет ε_cfg = ε_cond + w(ε_cond − ε_uncond). При положительном w добавка направлена от безусловного прогноза к условному, поэтому результат выходит за условную точку: это экстраполяция, а не интерполяция.'
  kind: choice
  options:
    - Между безусловным и условным предсказаниями
    - За безусловным предсказанием в сторону от условного
    - За условным предсказанием в направлении от безусловного к условному
    - Всегда точно совпадает с условным предсказанием
  correct: 2
  id: 027-cfg-inference-1
  fingerprint: 219259d4
- concept: чрезмерное усиление CFG повышает соответствие условию ценой качества изображения
  question: Объясни своими словами, почему увеличение коэффициента classifier-free guidance может одновременно усилить соответствие промпту и сделать изображение менее естественным.
  explanation: CFG масштабирует не только полезный вклад условия, но и погрешности в оценке этого вклада. Поэтому более сильное следование промпту не гарантирует более естественный результат.
  kind: open
  reference: Коэффициент усиливает разность между условным и безусловным предсказаниями, то есть найденное моделью влияние текста. Вместе с полезным направлением усиливаются его ошибки и неточности, поэтому чрезмерная экстраполяция может приводить к пересыщенности, излишней резкости и другим артефактам.
  id: 027-cfg-inference-2
  fingerprint: bb26c084
