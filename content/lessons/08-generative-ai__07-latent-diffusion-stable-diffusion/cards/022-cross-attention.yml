- concept: транспонирование ключей позволяет получить оценки для каждой пары запроса и текстового токена
  question: Тензор запросов Q имеет форму [batch, 6, 9], а тензор ключей K — [batch, 11, 9]. Какую форму получит матрица оценок QKᵀ?
  explanation: Транспонирование K меняет его последние оси, поэтому перемножаются общие размерности признаков. Для каждой из 6 позиций запроса вычисляется оценка соответствия каждому из 11 ключей.
  kind: choice
  options:
    - '[batch, 6, 11]'
    - '[batch, 9, 9]'
    - '[batch, 11, 6]'
    - '[batch, 6, 9]'
  correct: 0
  id: 022-cross-attention-1
  fingerprint: 98365a02
- concept: масштабирование attention-логитов на корень из размерности ключа предотвращает насыщение softmax
  question: Заполни пропуск в формуле масштабированного скалярного внимания.
  explanation: При росте размерности ключа скалярные произведения обычно увеличиваются по модулю. Деление на sqrt(d_k) удерживает логиты в разумном масштабе, чтобы softmax не становился преждевременно слишком резким.
  kind: cloze
  template: scores = (Q @ Kᵀ) / ___
  answer: sqrt(d_k)
  accept:
    - √d_k
    - np.sqrt(d_k)
    - math.sqrt(d_k)
  id: 022-cross-attention-2
  fingerprint: 12b664aa
