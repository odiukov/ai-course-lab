- concept: ключи определяют релевантность текстовых токенов, а значения передают их содержимое
  question: В cross-attention ключ K и значение V получены из одного текстового токена. Зачем нужны оба представления?
  explanation: Запрос сравнивается с ключами и получает веса релевантности. Затем по этим весам смешиваются значения. Поэтому один текстовый токен может иметь отдельные представления для поиска и для передаваемого содержимого.
  kind: choice
  options:
    - K используется для оценки соответствия запросу, а V содержит информацию, добавляемую с найденным весом
    - K хранит признаки изображения, а V определяет позицию токена в словаре
    - K создаёт шум для латента, а V предсказывает величину этого шума
    - K и V обязаны быть одинаковыми копиями, иначе внимание нельзя вычислить
  correct: 0
  id: 021-cross-attention-op-1
  fingerprint: cfbd9342
- concept: остаточное сложение сохраняет текущие признаки U-Net и добавляет к ним результат текстового внимания
  question: Почему результат cross-attention в текстово-обусловленной U-Net обычно прибавляют к текущим признакам h, а не полностью заменяют им h?
  explanation: В выражении h_out = h + CrossAttention(...) сохраняется прямой путь от h к выходу слоя. Cross-attention выступает как текстовая поправка к признакам, а не как их полная замена.
  kind: open
  reference: Остаточное сложение сохраняет уже вычисленные визуальные признаки U-Net и дополняет их выбранной из текста информацией. Если выход внимания мал или равен нулю, исходный путь признаков остаётся доступен.
  id: 021-cross-attention-op-2
  fingerprint: caf60151
