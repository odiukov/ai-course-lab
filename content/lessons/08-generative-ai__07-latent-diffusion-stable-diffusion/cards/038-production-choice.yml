- concept: способ управления генерацией должен соответствовать входным данным задачи
  question: Почему для редактирования существующего изображения недостаточно выбирать модель только по качеству генерации из текста?
  explanation: Качество text-to-image не гарантирует пригодность для редактирования. Для этой задачи нужна модель с совместным обусловливанием изображением и текстовой инструкцией, например семейство Flux Kontext.
  kind: open
  reference: Модель должна принимать не только текстовую инструкцию, но и исходное изображение, чтобы результат был обусловлен его содержимым. Обычная text-to-image-модель не предоставляет такого интерфейса управления, даже если хорошо следует текстовому промпту.
