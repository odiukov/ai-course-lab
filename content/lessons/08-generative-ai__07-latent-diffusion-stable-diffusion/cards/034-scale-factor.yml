- concept: направление применения VAE scaling factor при кодировании и декодировании
  question: Пусть s — scaling factor конкретного VAE, E — энкодер, D — декодер. Как правильно согласовать масштаб латентов с диффузионной моделью?
  explanation: 'Рабочий латент вычисляют как z = E(x) · s, а декодеру передают z / s. Для VAE из SD 1.x s = 0.18215: encode умножает, decode делит.'
  kind: choice
  options:
    - После кодирования разделить E(x) на s, а перед декодированием умножить латент на s
    - После кодирования умножить E(x) на s, а перед декодированием разделить латент на s
    - Умножить на s и после кодирования, и перед декодированием
    - Применять s только перед декодированием
  correct: 1
  id: 034-scale-factor-1
  fingerprint: 990738db
- concept: scaling factor является параметром конкретного VAE-чекпойнта
  question: Инженер заменил VAE в пайплайне Stable Diffusion. Откуда следует брать scaling factor для нового VAE?
  explanation: Scaling factor зависит от распределения латентов конкретного VAE и хранится в его конфигурации. Значение 0.18215 относится к VAE семейства SD 1.x и не является универсальным.
  kind: choice
  options:
    - Из конфигурации нового VAE-чекпойнта
    - Из конфигурации планировщика шума
    - Из размера входного изображения
    - Использовать одну универсальную константу для всех VAE
  correct: 0
  id: 034-scale-factor-2
  fingerprint: 8cb20456
- concept: единичный масштаб описывает типичный разброс распределения латентов
  question: Объясни своими словами, что означает единичный масштаб латентов и чего он не утверждает об отдельных значениях тензора.
  explanation: Scaling factor приводит статистический масштаб всего распределения к ожидаемому диффузионной моделью. Отдельные элементы при этом могут быть отрицательными, положительными и выходить за интервал от −1 до 1.
  kind: open
  reference: Единичный масштаб означает, что типичный разброс распределения латентов, например стандартное отклонение, близок к единице. Это не означает, что каждый элемент равен единице или обязан находиться в фиксированном интервале.
  id: 034-scale-factor-3
  fingerprint: 449b8b8f
