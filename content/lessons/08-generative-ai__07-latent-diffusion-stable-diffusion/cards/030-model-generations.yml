- concept: переход поколений Stable Diffusion от U-Net к мультимодальному диффузионному трансформеру
  question: Расположи архитектурные этапы развития Stable Diffusion в историческом порядке.
  explanation: Ранний Stable Diffusion использовал компактный U-Net. SDXL сохранил этот backbone, но увеличил модель и добавил refiner и второй текстовый энкодер. Следующее поколение перешло к MMDiT, совместно обрабатывающему представления текста и изображения.
  kind: order
  items:
    - U-Net с одним короткоконтекстным текстовым энкодером
    - Увеличенный U-Net с дополнительным refiner и парой текстовых энкодеров
    - Мультимодальный диффузионный трансформер с более ёмким латентом и крупным языковым энкодером
  id: 030-model-generations-1
  fingerprint: 30ba1185
- concept: дистилляция диффузионной модели сокращает число итераций сэмплирования
  question: Какую задачу в первую очередь решают варианты моделей с маркировками Turbo и schnell?
  explanation: Turbo и schnell — дистиллированные варианты, рассчитанные на генерацию за небольшое число проходов. Дистилляция прежде всего уменьшает задержку сэмплирования, а не увеличивает латент или длину текстового контекста.
  kind: choice
  options:
    - Ускоряют генерацию за счёт дистилляции и сокращения числа итераций сэмплирования
    - Расширяют максимальный контекст исходного CLIP-энкодера
    - Добавляют отдельный refiner для финальной обработки изображения
    - Переносят диффузионный процесс из латентного пространства в пиксельное
  correct: 0
