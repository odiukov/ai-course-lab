- concept: ёмкость латента и качество текстового энкодера устраняют разные ограничения генератора
  question: Объясни своими словами, почему увеличение ёмкости латента и усиление текстового энкодера нельзя считать взаимозаменяемыми улучшениями генератора изображений.
  explanation: Пространственный размер и число каналов латента определяют запас для визуальных признаков, тогда как текстовый энкодер отвечает за представление условия. Поэтому рост детализации сам по себе не гарантирует точного понимания сложного промпта.
  kind: open
  reference: Более ёмкий латент позволяет сохранять и обрабатывать больше визуальных деталей. Более сильный текстовый энкодер точнее представляет смысл и связи внутри промпта, улучшая следование заданию. Увеличение одного компонента не устраняет ограничение другого.
  id: 030-model-generations-3
  fingerprint: 37ffc555
