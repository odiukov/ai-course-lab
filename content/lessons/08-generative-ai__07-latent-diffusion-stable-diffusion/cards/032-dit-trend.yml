- concept: степень сжатия латента задаёт компромисс между сохранением деталей и вычислительной стоимостью
  question: Почему менее агрессивное сжатие латента может повысить детализацию генерации, не превращая модель обратно в пиксельную диффузию?
  explanation: Увеличение латента сохраняет больше информации для диффузионной модели, но повышает стоимость обработки. В SD3 латент заметно ёмче, чем в SD 1.5, однако всё ещё представляет сжатое изображение, а не полную пиксельную сетку.
  kind: open
  reference: Более ёмкий латент теряет меньше мелких пространственных и признаковых различий. При этом он по-прежнему компактнее исходного изображения, поэтому диффузия остаётся латентной, хотя вычислений и памяти требуется больше.
  id: 032-dit-trend-2
  fingerprint: 8c064dc7
