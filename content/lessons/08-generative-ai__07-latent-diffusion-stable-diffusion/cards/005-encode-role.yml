- concept: энкодер VAE переводит изображение в латент z, с которым работает диффузионная модель
  question: Что служит исходным представлением данных для процесса латентной диффузии после обработки изображения энкодером VAE?
  explanation: Энкодер преобразует изображение x в латент z. Дальнейший процесс диффузии добавляет и удаляет шум именно в пространстве таких латентов, а не в исходном пиксельном пространстве.
  kind: choice
  options:
    - Пиксельное изображение без преобразований
    - Латентное представление z
    - Готовое изображение от декодера
    - Значение функции потерь VAE
  correct: 1
  id: 005-encode-role-1
  fingerprint: ad94744d
- concept: обратные линейные encode и decode могут точно восстановить исходное значение
  question: Игрушечный энкодер уменьшает каждое значение в четыре раза. Заполни декодер так, чтобы композиция decode(encode(x)) возвращала x.
  explanation: Чтобы обратить деление на четыре, декодер должен умножить латент на четыре. Тогда decode(encode(x)) = (x / 4) · 4 = x.
  kind: cloze
  template: |-
    def encode(x): return x / 4
    def decode(z): return ___
  answer: z * 4
  accept:
    - 4 * z
    - z / 0.25
  id: 005-encode-role-2
  fingerprint: 814c8c26
- concept: настоящая VAE восстанавливает изображение с потерями, которые декодер учится делать визуально незаметными
  question: Почему декодер настоящей VAE обучают с перцептивной и состязательной потерями, если его задача — восстановить изображение из латента?
  explanation: 'Настоящее кодирование VAE является lossy-преобразованием: в латенте сохраняется не вся исходная информация. Эти функции потерь направляют декодер к визуально убедительному восстановлению, даже когда точное совпадение пикселей невозможно.'
  kind: open
  reference: Энкодер VAE теряет часть деталей изображения, поэтому декодер обычно не может восстановить исходник совершенно точно. Перцептивная и состязательная потери помогают получать визуально правдоподобное изображение и делать утраченные детали менее заметными для человека.
  id: 005-encode-role-3
  fingerprint: f276facd
