- concept: при последовательном выполнении стадий пиковая VRAM определяется крупнейшей одновременно активной стадией
  question: Генеративный пайплайн последовательно использует текстовый энкодер, диффузионную модель и декодер, причём веса завершившей работу сети выгружаются. Что главным образом определяет пиковое потребление VRAM?
  explanation: Если стадии не находятся в VRAM одновременно, их размеры не складываются в один пик. Нужно учитывать крупнейшую активную сеть, её активации и данные, передаваемые следующей стадии.
  kind: choice
  options:
    - Суммарный размер весов всех сетей пайплайна
    - Размер крупнейшей активной стадии вместе с её промежуточными данными
    - Размер только итогового изображения
    - Число стадий независимо от размера их моделей
  correct: 1
  id: 039-memory-stages-1
  fingerprint: 60bb7ca5
- concept: порядок загрузки компонентов Flux следует зависимостям между текстом, латентом и изображением
  question: Расположи операции генерации Flux в порядке, позволяющем переиспользовать ограниченную VRAM.
  explanation: Каждая стадия создаёт компактный результат для следующей. После кодирования остаются текстовые эмбеддинги, после DiT — расшумленный латент, а VAE превращает этот латент в изображение.
  kind: order
  items:
    - Закодировать промпт и сохранить текстовое представление
    - Выгрузить текстовые энкодеры и загрузить DiT
    - Расшумить латент с учётом сохранённого текста
    - Выгрузить DiT и загрузить VAE
    - Декодировать итоговый латент в изображение
  id: 039-memory-stages-2
  fingerprint: 75a18113
- concept: выгрузка весов завершённой стадии не требует удаления её выхода
  question: Объясни своими словами, почему после кодирования промпта можно выгрузить текстовые энкодеры, не лишив DiT текстового условия.
  explanation: Веса сети нужны для вычисления её выхода, но не обязаны оставаться в VRAM после завершения вычисления. Для следующей стадии достаточно сохранить выход предыдущей — в данном случае текстовые эмбеддинги.
  kind: open
  reference: DiT нужны не сами веса текстовых энкодеров, а уже вычисленные ими эмбеддинги промпта. Эмбеддинги сохраняют и передают дальше, тогда как ставшие ненужными веса можно удалить из VRAM.
  id: 039-memory-stages-3
  fingerprint: fcb4824c
