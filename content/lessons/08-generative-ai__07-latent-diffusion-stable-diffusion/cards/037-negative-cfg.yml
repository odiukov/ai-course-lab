- concept: negative prompt задаёт ориентир для отталкивания в CFG, а не жёсткий запрет содержимого
  question: Объясни своими словами, почему добавление объекта в negative prompt не гарантирует, что этот объект полностью исчезнет с изображения.
  explanation: Заполненный negative prompt заменяет обычный безусловный ориентир текстовым условием. CFG усиливает разницу между положительной и отрицательной ветвями, однако такое направление в пространстве прогнозов не является механическим фильтром или гарантированным запретом.
  kind: open
  reference: Negative prompt используется как условие ветви, от прогноза которой CFG отталкивает итоговое предсказание. Это направляет генерацию прочь от признаков отрицательного текста, но не выполняет детерминированное обнаружение и удаление запрещённых объектов.
  id: 037-negative-cfg-2
  fingerprint: 9076a1da
