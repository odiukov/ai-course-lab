- concept: LoRA совместима только с базовой архитектурой, для слоёв которой были обучены её низкоранговые поправки
  question: Почему LoRA, обученную для SDXL, обычно нельзя напрямую применить к модели другого семейства, даже если она создаёт подходящий стиль?
  explanation: 'LoRA не является независимым фильтром для изображений: её матрицы рассчитаны на конкретные точки внедрения и размерности базовой архитектуры. Тематика или стиль обучения не обеспечивают совместимость с SD3 либо Flux.'
  kind: open
  reference: LoRA хранит поправки к определённым слоям базовой модели. В другом семействе имена, размеры и назначение этих слоёв могут отличаться, поэтому поправки нельзя корректно сопоставить с весами.
  id: 036-compatibility-1
  fingerprint: 104c37e1
- concept: тихое отключение обязательного текстового энкодера оставляет модель с неполным представлением промпта
  question: Пайплайн Stable Diffusion третьего поколения запускается только с CLIP, потому что длинноконтекстный текстовый энкодер был незаметно отключён. Какое последствие наиболее вероятно?
  explanation: SD3 рассчитана в том числе на T5-XXL. Если оставить только CLIP, запуск может не завершиться ошибкой, но часть информации из промпта не попадёт в обусловливание, поэтому верность запросу снизится.
  kind: choice
  options:
    - Модель получит неполное текстовое условие и станет хуже следовать промпту
    - CLIP точно восстановит все отсутствующие текстовые признаки
    - Изменится только разрешение изображения на выходе VAE
    - Все подключённые LoRA автоматически преобразуются под новую архитектуру
  correct: 0
  id: 036-compatibility-2
  fingerprint: ca53c2be
