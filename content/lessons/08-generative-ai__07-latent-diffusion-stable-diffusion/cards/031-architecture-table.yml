- concept: различие функций латента, backbone и текстового энкодера в латентной диффузии
  question: Как правильно распределены роли компонентов модели латентной диффузии?
  explanation: Латент служит рабочим представлением изображения. Backbone выполняет итеративное расшумление, а текстовый энкодер создаёт признаки промпта, которыми обусловливается backbone.
  kind: choice
  options:
    - Латент кодирует промпт, backbone сжимает изображение, текстовый энкодер декодирует результат
    - Латент хранит рабочее представление изображения, backbone предсказывает удаляемый шум, текстовый энкодер превращает промпт в признаки условия
    - Латент задаёт веса модели, backbone токенизирует промпт, текстовый энкодер восстанавливает пиксели
    - Латент управляет расписанием шума, backbone хранит текстовые токены, текстовый энкодер обучает VAE
  correct: 1
  id: 031-architecture-table-1
  fingerprint: 47710b64
- concept: совместимость интерфейсов между компонентами диффузионной архитектуры
  question: Почему нельзя произвольно объединить backbone, VAE и текстовый энкодер из разных диффузионных моделей, ориентируясь только на названия компонентов?
  explanation: Строка архитектурной таблицы описывает согласованную конфигурацию. Например, переход от четырёх каналов латента к шестнадцати или замена набора текстовых энкодеров меняют данные, которые должен принимать backbone.
  kind: open
  reference: 'Компоненты должны согласовываться по интерфейсам: форме и числу каналов латента, размерности текстовых признаков и способу передачи условия в backbone. Несовпадение этих контрактов делает прямое соединение невозможным или требует адаптеров и дополнительного обучения.'
  id: 031-architecture-table-2
  fingerprint: e266c470
