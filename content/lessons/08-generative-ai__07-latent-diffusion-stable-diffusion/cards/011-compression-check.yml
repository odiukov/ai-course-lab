- concept: число пространственных позиций уменьшается как квадрат коэффициента уменьшения каждой оси
  question: Высоту и ширину входа U-Net уменьшили в одинаковое число раз. Как определить коэффициент уменьшения числа пространственных позиций?
  explanation: Число пространственных позиций равно произведению высоты и ширины. Поэтому одинаковое уменьшение обеих осей даёт квадратичное уменьшение площади сетки.
  kind: choice
  options:
    - Прибавить коэффициенты уменьшения высоты и ширины
    - Возвести коэффициент уменьшения одной оси в квадрат
    - Умножить коэффициент уменьшения одной оси на число каналов
  correct: 1
  id: 011-compression-check-1
  fingerprint: 3db97746
- concept: оценка FLOPS пространственной диффузионной модели определяется прежде всего числом позиций сетки
  question: Объясните своими словами, почему отношение полного числа элементов двух тензоров может отличаться от примерного отношения FLOPS при их обработке U-Net.
  explanation: У изображения и латента различается не только разрешение, но и число каналов. Для оценки вычислений важнее сокращение пространственной сетки, по которой выполняются свёртки и внимание.
  kind: open
  reference: Полное число элементов учитывает каналы, а основная стоимость пространственных операций U-Net масштабируется с количеством позиций сетки. Поэтому изменение числа каналов влияет на размер тензора, но не обязано пропорционально менять FLOPS.
  id: 011-compression-check-2
  fingerprint: 86281d51
