- concept: DDPM можно обучать на латентах VAE без изменения диффузионной функции потерь
  question: Как корректно перенести обычное обучение DDPM из пространства пикселей в латентное пространство VAE?
  explanation: DDPM не зависит от того, изображают ли числа пиксели или латентные признаки. После замены изображения на латент сохраняются прежние расписание шума, выбор шага и MSE по предсказываемому шуму.
  kind: choice
  options:
    - Добавлять шум к пикселям, но требовать от модели предсказывать чистый латент
    - Кодировать изображение в латент, зашумлять латент и обучать модель предсказывать добавленный шум
    - Зашумлять выход декодера и обучать энкодер восстанавливать исходные пиксели
    - Сэмплировать латент из VAE и обучать диффузионную модель без добавления шума
  correct: 1
  id: 001-latent-idea-1
  fingerprint: b497eaf7
- concept: генерация в латентной диффузии завершается декодированием расшумленного латента
  question: Расположи этапы генерации изображения латентной диффузионной моделью в правильном порядке.
  explanation: Диффузионная модель генерирует не пиксели, а латент. В изображение результат превращает только заранее обученный декодер VAE.
  kind: order
  items:
    - Создать случайный шумовой тензор в латентном пространстве
    - Итеративно расшумить тензор и получить чистый латент
    - Передать чистый латент декодеру VAE и получить изображение
  id: 001-latent-idea-2
  fingerprint: b5033bab
- concept: VAE и диффузионная модель обучаются как две отдельные стадии
  question: Почему при обучении латентной диффузии VAE обычно сначала обучают отдельно, а затем замораживают?
  explanation: Если представление латентов постоянно меняется вместе с энкодером, диффузионной модели приходится догонять движущуюся цель. Раздельное обучение фиксирует интерфейс между двумя стадиями.
  kind: open
  reference: 'Замороженный VAE задаёт стабильное латентное пространство: энкодер превращает реальные изображения в фиксированные цели для диффузионной модели, а декодер сохраняет постоянный способ преобразования латентов обратно в изображения. Поэтому вторая стадия может независимо учиться расшумлять латенты.'
  id: 001-latent-idea-3
  fingerprint: 33042b14
