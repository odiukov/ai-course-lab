- concept: одинаковые оценки соответствия дают равные веса внимания
  question: Позиция латента получила одинаковые оценки соответствия для восьми текстовых токенов. Какой вес softmax получит каждый токен?
  explanation: Экспоненты одинаковых оценок равны, поэтому softmax распределяет внимание поровну между всеми токенами. Каждый получает одну восьмую общего веса.
  kind: numeric
  answer: 0.125
  tolerance: 0.001
  id: 019-softmax-weights-1
  fingerprint: 77a8e5a6
- concept: знаменатель softmax нормализует веса по всем доступным текстовым токенам
  question: Заполни знаменатель формулы softmax для одной позиции латента.
  explanation: В знаменателе суммируются экспоненты оценок всех текстовых токенов для текущей позиции. Благодаря делению на эту сумму веса образуют нормированное распределение.
  kind: cloze
  template: a_i = exp(s_i) / ___
  answer: sum_j exp(s_j)
  accept:
    - Σ_j exp(s_j)
    - \sum_j e^{s_j}
    - \sum_j \exp(s_j)
  id: 019-softmax-weights-2
  fingerprint: 1afc6ef8
- concept: softmax нормализует внимание отдельно для каждой позиции латента
  question: Почему веса внимания к одним и тем же текстовым токенам могут различаться у разных позиций латента?
  explanation: Одна область латента может сильнее соответствовать одному токену, а другая — другому. Их оценки и нормирующие суммы вычисляются независимо.
  kind: open
  reference: У каждой позиции латента есть собственные оценки соответствия токенам. Softmax независимо нормализует оценки каждой позиции, поэтому разные позиции получают разные распределения внимания.
  id: 019-softmax-weights-3
  fingerprint: 1848c09f
