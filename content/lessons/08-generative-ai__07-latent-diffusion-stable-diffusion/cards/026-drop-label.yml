- concept: решение об удалении условия принимается независимо для каждого элемента батча
  question: Как реализовать независимое удаление меток для classifier-free guidance в мини-батче?
  explanation: Отдельная случайная проверка для каждого примера даёт независимую бернуллиевскую маску. При вероятности 10% фактическое число удалённых меток может различаться от батча к батчу.
