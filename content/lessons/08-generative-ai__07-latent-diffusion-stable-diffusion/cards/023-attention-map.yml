- concept: cross-attention выполняет динамическую мягкую маршрутизацию текста, а не фиксированную сегментацию изображения
  question: Объясни своими словами, почему карту cross-attention между текстовыми токенами и позициями латента нельзя считать неизменной маской сегментации объектов.
  explanation: Cross-attention не закрепляет слово за одной областью навсегда. Он заново вычисляет степени влияния токенов из текущих признаков, поэтому связи могут быть распределёнными и изменяться в ходе генерации.
  kind: open
  reference: Веса внимания являются мягкими, поэтому на одну позицию могут влиять несколько токенов, а один токен может влиять на несколько позиций. Кроме того, запросы и признаки латента меняются между блоками модели и этапами расшумления, вслед за ними меняется и распределение внимания.
  id: 023-attention-map-2
  fingerprint: 03567bb5
