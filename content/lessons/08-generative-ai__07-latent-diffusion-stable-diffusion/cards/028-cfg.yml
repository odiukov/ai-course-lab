- concept: поэлементное вычисление classifier-free guidance по условному и безусловному прогнозам
  question: Для одной координаты тензора ε_cond = 5, ε_uncond = 2 и w = 4. Чему равен результат по правилу ε_cfg = (1 + w)·ε_cond − w·ε_uncond?
  explanation: Подстановка даёт (1 + 4)·5 − 4·2 = 25 − 8 = 17. Та же операция независимо выполняется для каждой координаты входных тензоров.
  kind: numeric
  answer: 17
  tolerance: 0.000001
  id: 028-cfg-1
  fingerprint: 973f5750
- concept: classifier-free guidance не меняет прогноз там, где условный и безусловный результаты совпадают
  question: Что вернёт classifier-free guidance при любом значении w, если тензоры ε_cond и ε_uncond полностью совпадают?
  explanation: Если ε_cond = ε_uncond = ε, то (1 + w)ε − wε = ε. Guidance усиливает только разницу между условным и безусловным прогнозами; при отсутствии разницы усиливать нечего.
  kind: choice
  options:
    - Тензор ε_cond без изменений
    - Нулевой тензор
    - Тензор, умноженный на w
    - Результат нельзя определить без формы тензора
  correct: 0
  id: 028-cfg-2
  fingerprint: 0c06c9d8
