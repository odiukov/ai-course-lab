- concept: adversarial-потеря повышает реалистичность, но не гарантирует соответствие реконструкции исходному изображению
  question: Почему VAE для Stable Diffusion нельзя надёжно обучать только с adversarial-потерей, даже если она делает декодированные изображения резкими?
  explanation: Дискриминатор учит декодер создавать изображения, похожие на настоящие по распределению, а не обязательно верные данному входу. Поэтому adversarial-сигнал дополняют реконструкционной и перцептивной потерями, которые удерживают содержание реконструкции.
  kind: open
  reference: Adversarial-потеря проверяет правдоподобие результата, но сама по себе не требует точно сохранить содержание конкретного исходного изображения. Декодер может создавать реалистичные, однако выдуманные детали. L1 привязывает результат к исходным пикселям, а LPIPS — к его визуально значимым признакам.
  id: 012-vae-losses-3
  fingerprint: fde22746
