- concept: малый вес KL обеспечивает мягкую регуляризацию латентов без чрезмерной потери деталей
  question: Каким должен быть вес KL-компоненты, если VAE служит компрессором для латентной диффузии и точное сэмплирование непосредственно из её априорного распределения не требуется?
  explanation: KL приближает распределение кодов к выбранному априорному распределению и регуляризует латентное пространство. Если сделать его доминирующим, энкодер начнёт жертвовать информацией об изображении ради соответствия априору, ухудшая реконструкцию.
  kind: cloze
  template: L_VAE = L1 + λ_perc·LPIPS + β·KL, где β — ___ коэффициент
  answer: небольшой
  accept:
    - маленький
    - малый
    - слабый
  id: 012-vae-losses-2
