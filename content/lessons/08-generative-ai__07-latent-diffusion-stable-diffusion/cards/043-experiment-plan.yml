- concept: реконструкция отделяет ошибки обучаемого латентного представления от ошибок диффузионной модели
  question: Расположите этапы эксперимента с новым обучаемым энкодером и декодером в правильном порядке.
  explanation: Сначала нужно убедиться, что MLP-пара вообще способна сохранять нужную информацию. Затем диффузию обучают на распределении новых латентов; только после этого качество генерации можно интерпретировать корректно.
  kind: order
  items:
    - Обучить энкодер и декодер с потерей реконструкции и проверить восстановление данных
    - Закодировать обучающие данные в новое латентное пространство
    - Обучить диффузионную модель на полученных латентах
    - Сгенерировать латенты, декодировать их и оценить качество сэмплов
  id: 043-experiment-plan-2
  fingerprint: ca937cf7
