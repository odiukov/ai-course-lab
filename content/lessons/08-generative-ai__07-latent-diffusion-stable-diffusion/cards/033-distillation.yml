- concept: стоимость генерации зависит отдельно от стоимости одного вызова backbone и количества вызовов
  question: Заполни грубую факторизацию вычислительной стоимости одной генерации.
  explanation: Backbone определяет устройство и стоимость отдельного предсказания, а дистилляция — требуемое число последовательных предсказаний. Поэтому смена backbone и сокращение траектории влияют на разные множители общей стоимости.
  kind: cloze
  template: C_generation ≈ ___
  answer: C_step × N_steps
  accept:
    - N_steps × C_step
    - C_step * N_steps
    - N_steps * C_step
