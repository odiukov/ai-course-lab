<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сравнение пиксельного и латентного тензоров</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: snow;
    --panel: white;
    --ink: midnightblue;
    --muted: slategray;
    --border: lightsteelblue;
    --accent: royalblue;
    --arrow: darkorange;
    --summary: aliceblue;
    --pixel-r: lightcoral;
    --pixel-g: mediumseagreen;
    --pixel-b: cornflowerblue;
    --latent-a: plum;
    --latent-b: mediumpurple;
    --latent-c: cornflowerblue;
    --latent-d: mediumturquoise;
    --grid: white;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: midnightblue;
      --panel: darkslategray;
      --ink: white;
      --muted: lightsteelblue;
      --border: slategray;
      --accent: lightskyblue;
      --arrow: orange;
      --summary: darkslateblue;
      --pixel-r: indianred;
      --pixel-g: seagreen;
      --pixel-b: royalblue;
      --latent-a: mediumorchid;
      --latent-b: mediumpurple;
      --latent-c: royalblue;
      --latent-d: teal;
      --grid: lightcyan;
    }
  }

  html,
  body,
  main {
    margin: unset;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  header {
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    background: var(--bg);
    color: var(--ink);
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 430px;
    background: var(--bg);
  }

  .card {
    fill: var(--panel);
    stroke: var(--border);
    stroke-width: 2px;
  }

  .summary-band {
    fill: var(--summary);
    stroke: var(--border);
    stroke-width: 2px;
  }

  .layer {
    stroke: var(--ink);
    stroke-width: 2px;
    stroke-linejoin: round;
  }

  .pixel-r { fill: var(--pixel-r); }
  .pixel-g { fill: var(--pixel-g); }
  .pixel-b { fill: var(--pixel-b); }
  .latent-a { fill: var(--latent-a); }
  .latent-b { fill: var(--latent-b); }
  .latent-c { fill: var(--latent-c); }
  .latent-d { fill: var(--latent-d); }

  .grid {
    fill: none;
    stroke: var(--grid);
    stroke-width: 1px;
  }

  .measure,
  .bracket,
  .divider {
    fill: none;
    stroke: var(--muted);
    stroke-width: 2px;
    stroke-linecap: round;
  }

  .arrow {
    fill: none;
    stroke: var(--arrow);
    stroke-width: 4px;
    stroke-linecap: round;
  }

  .arrow-head {
    fill: var(--arrow);
    stroke: var(--arrow);
    stroke-width: 2px;
    stroke-linejoin: round;
  }

  .heading {
    fill: var(--ink);
    font-size: 19px;
    font-weight: bold;
  }

  .shape-label {
    fill: var(--accent);
    font-size: 16px;
    font-weight: bold;
  }

  .small {
    fill: var(--muted);
    font-size: 14px;
  }

  .count {
    fill: var(--ink);
    font-size: 21px;
    font-weight: bold;
  }

  .vae {
    fill: var(--arrow);
    font-size: 18px;
    font-weight: bold;
  }

  .summary {
    fill: var(--ink);
    font-size: 15px;
    font-weight: bold;
  }

  .fallback {
    fill: var(--ink);
    font-size: 18px;
  }

  .card,
  .summary-band,
  .layer,
  .grid,
  .measure,
  .bracket,
  .divider,
  .arrow,
  .arrow-head {
    vector-effect: non-scaling-stroke;
  }
</style>
</head>
<body>
<main>
  <header id="diagram-title">Пиксельный и латентный тензоры одной картинки</header>
  <svg id="diagram" width="980" height="430" viewBox="0 0 980 430"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="diagram-title diagram-description">
    <desc id="diagram-description">VAE преобразует пиксельный тензор три на пятьсот двенадцать на пятьсот двенадцать в латентный тензор четыре на шестьдесят четыре на шестьдесят четыре.</desc>
  </svg>
</main>

<script>
const diagramData = [{
  zero: 0,
  origin: { x: 0, y: 0 },
  scale: { x: 1, y: 1 },
  canvas: { x: 0, y: 0, w: 980, h: 430 },
  radius: 12,
  cards: [
    { x: 24, y: 20, w: 390, h: 326 },
    { x: 566, y: 20, w: 390, h: 326 }
  ],
  summary: { x: 24, y: 363, w: 932, h: 49 },
  pixelLayers: [
    { x: 81, y: 84, w: 165, h: 165, className: "layer pixel-r" },
    { x: 93, y: 96, w: 165, h: 165, className: "layer pixel-g" },
    { x: 105, y: 108, w: 165, h: 165, className: "layer pixel-b" }
  ],
  latentLayers: [
    { x: 664, y: 96, w: 100, h: 100, className: "layer latent-a" },
    { x: 676, y: 108, w: 100, h: 100, className: "layer latent-b" },
    { x: 688, y: 120, w: 100, h: 100, className: "layer latent-c" },
    { x: 700, y: 132, w: 100, h: 100, className: "layer latent-d" }
  ],
  pixelGrid: {
    vertical: [132.5, 160, 187.5, 215, 242.5],
    horizontal: [135.5, 163, 190.5, 218, 245.5],
    left: 105, right: 270, top: 108, bottom: 273
  },
  latentGrid: {
    vertical: [720, 740, 760, 780],
    horizontal: [152, 172, 192, 212],
    left: 700, right: 800, top: 132, bottom: 232
  },
  lines: [
    { x1: 105, y1: 288, x2: 270, y2: 288, className: "measure" },
    { x1: 105, y1: 282, x2: 105, y2: 294, className: "measure" },
    { x1: 270, y1: 282, x2: 270, y2: 294, className: "measure" },
    { x1: 700, y1: 253, x2: 800, y2: 253, className: "measure" },
    { x1: 700, y1: 247, x2: 700, y2: 259, className: "measure" },
    { x1: 800, y1: 247, x2: 800, y2: 259, className: "measure" },
    { x1: 294, y1: 84, x2: 294, y2: 273, className: "bracket" },
    { x1: 285, y1: 84, x2: 294, y2: 84, className: "bracket" },
    { x1: 285, y1: 273, x2: 294, y2: 273, className: "bracket" },
    { x1: 820, y1: 96, x2: 820, y2: 232, className: "bracket" },
    { x1: 811, y1: 96, x2: 820, y2: 96, className: "bracket" },
    { x1: 811, y1: 232, x2: 820, y2: 232, className: "bracket" },
    { x1: 428, y1: 176, x2: 544, y2: 176, className: "arrow" },
    { x1: 490, y1: 374, x2: 490, y2: 402, className: "divider" }
  ],
  arrowHead: [[552, 176], [538, 167], [538, 185]],
  texts: [
    { x: 48, y: 52, value: "Пиксельный тензор", className: "heading", anchor: "start" },
    { x: 48, y: 77, value: "[1, 3, 512, 512]", className: "shape-label", anchor: "start" },
    { x: 187.5, y: 311, value: "512 × 512 пикселей", className: "small", anchor: "middle" },
    { x: 305, y: 171, value: "3 канала", className: "small", anchor: "start" },
    { x: 305, y: 192, value: "красный · зелёный · синий", className: "small", anchor: "start" },
    { x: 187.5, y: 337, value: "786 432 числа", className: "count", anchor: "middle" },
    { x: 590, y: 52, value: "Латентный тензор", className: "heading", anchor: "start" },
    { x: 590, y: 77, value: "[1, 4, 64, 64]", className: "shape-label", anchor: "start" },
    { x: 750, y: 276, value: "64 × 64 позиции", className: "small", anchor: "middle" },
    { x: 832, y: 157, value: "4 канала", className: "small", anchor: "start" },
    { x: 832, y: 178, value: "выученных признаков", className: "small", anchor: "start" },
    { x: 750, y: 306, value: "не RGBA: смысл хранится совместно", className: "small", anchor: "middle" },
    { x: 750, y: 337, value: "16 384 числа", className: "count", anchor: "middle" },
    { x: 434, y: 151, value: "VAE", className: "vae", anchor: "start" },
    { x: 490, y: 207, value: "кодирование", className: "small", anchor: "middle" },
    { x: 257, y: 393, value: "512 × 512 → 64 × 64  ·  в 8 раз по каждой оси", className: "summary", anchor: "middle" },
    { x: 723, y: 393, value: "786 432 → 16 384  ·  в 48 раз меньше чисел", className: "summary", anchor: "middle" }
  ],
  fallback: {
    x: 490,
    y: 205,
    value: "Схема должна показать: 3 × 512 × 512 → VAE → 4 × 64 × 64"
  }
}];

const [d] = diagramData;
const origin = d.origin;
const scale = d.scale;
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const svg = document.getElementById("diagram");
  const namespace = "http://www.w3.org/2000/svg";

  const make = (name, attributes) => {
    const node = document.createElementNS(namespace, name);
    Object.entries(attributes).forEach(([key, value]) => node.setAttribute(key, value));
    return node;
  };

  const addRect = (spec, className) => {
    svg.appendChild(make("rect", {
      x: sx(spec.x),
      y: sy(spec.y),
      width: sx(spec.x + spec.w) - sx(spec.x),
      height: sy(spec.y + spec.h) - sy(spec.y),
      rx: sx(spec.x + d.radius) - sx(spec.x),
      ry: sy(spec.y + d.radius) - sy(spec.y),
      class: className || spec.className
    }));
  };

  const addLine = spec => {
    svg.appendChild(make("line", {
      x1: sx(spec.x1),
      y1: sy(spec.y1),
      x2: sx(spec.x2),
      y2: sy(spec.y2),
      class: spec.className
    }));
  };

  const addText = spec => {
    const node = make("text", {
      x: sx(spec.x),
      y: sy(spec.y),
      class: spec.className,
      "text-anchor": spec.anchor
    });
    node.textContent = spec.value;
    svg.appendChild(node);
  };

  const addGrid = grid => {
    grid.vertical.forEach(x => addLine({
      x1: x, y1: grid.top, x2: x, y2: grid.bottom, className: "grid"
    }));
    grid.horizontal.forEach(y => addLine({
      x1: grid.left, y1: y, x2: grid.right, y2: y, className: "grid"
    }));
  };

  d.cards.forEach(card => addRect(card, "card"));
  addRect(d.summary, "summary-band");
  d.pixelLayers.forEach(layer => addRect(layer));
  d.latentLayers.forEach(layer => addRect(layer));
  addGrid(d.pixelGrid);
  addGrid(d.latentGrid);
  d.lines.forEach(addLine);

  svg.appendChild(make("polygon", {
    points: d.arrowHead.map(point => `${sx(point.shift())},${sy(point.pop())}`).join(" "),
    class: "arrow-head"
  }));

  d.texts.forEach(addText);
} catch (error) {
  const svg = document.getElementById("diagram");
  const namespace = "http://www.w3.org/2000/svg";
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  const message = document.createElementNS(namespace, "text");
  message.setAttribute("x", sx(d.fallback.x));
  message.setAttribute("y", sy(d.fallback.y));
  message.setAttribute("text-anchor", "middle");
  message.setAttribute("class", "fallback");
  message.textContent = d.fallback.value;
  svg.appendChild(message);
}
</script>
</body>
</html>
