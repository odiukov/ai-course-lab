<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Девять запусков — три полезных значения</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: white;
      --ink: midnightblue;
      --muted: slategray;
      --axis: darkslategray;
      --panel: whitesmoke;
      --summary: lavender;
      --tone-a: royalblue;
      --tone-a-soft: aliceblue;
      --tone-b: seagreen;
      --tone-b-soft: honeydew;
      --tone-c: darkorange;
      --tone-c-soft: oldlace;
      --point-core: white;
      --fallback: firebrick;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111827;
        --ink: #f3f4f6;
        --muted: #aeb8c8;
        --axis: #cbd5e1;
        --panel: #1f2937;
        --summary: #292c49;
        --tone-a: #7aa2ff;
        --tone-a-soft: #17264a;
        --tone-b: #67d39b;
        --tone-b-soft: #17372d;
        --tone-c: #ffb454;
        --tone-c-soft: #422b17;
        --point-core: #111827;
        --fallback: #ff8f8f;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    figure {
      width: 100%;
      margin: 0;
      background: var(--page);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 750;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 480px;
      background: var(--page);
    }

    text {
      font-family: inherit;
      fill: var(--ink);
    }

    .axis {
      stroke: var(--axis);
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tick {
      stroke: var(--axis);
      stroke-width: 1;
    }

    .guide {
      stroke-width: 5;
      stroke-linecap: round;
    }

    .flow {
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .point {
      stroke-width: 2;
    }

    .point-core {
      fill: var(--point-core);
      stroke: none;
    }

    .band,
    .quality-card {
      stroke-width: 1;
    }

    .tone-a.band,
    .tone-a.quality-card {
      fill: var(--tone-a-soft);
      stroke: var(--tone-a);
    }

    .tone-b.band,
    .tone-b.quality-card {
      fill: var(--tone-b-soft);
      stroke: var(--tone-b);
    }

    .tone-c.band,
    .tone-c.quality-card {
      fill: var(--tone-c-soft);
      stroke: var(--tone-c);
    }

    .tone-a.guide,
    .tone-a.flow {
      stroke: var(--tone-a);
    }

    .tone-b.guide,
    .tone-b.flow {
      stroke: var(--tone-b);
    }

    .tone-c.guide,
    .tone-c.flow {
      stroke: var(--tone-c);
    }

    .tone-a.point,
    .tone-a.arrow-head {
      fill: var(--tone-a);
      stroke: var(--tone-a);
    }

    .tone-b.point,
    .tone-b.arrow-head {
      fill: var(--tone-b);
      stroke: var(--tone-b);
    }

    .tone-c.point,
    .tone-c.arrow-head {
      fill: var(--tone-c);
      stroke: var(--tone-c);
    }

    .arrow-head {
      stroke-width: 1;
      stroke-linejoin: round;
    }

    .axis-head {
      fill: var(--axis);
      stroke: var(--axis);
      stroke-width: 1;
      stroke-linejoin: round;
    }

    .range-line {
      stroke: var(--muted);
      stroke-width: 2;
      stroke-linecap: round;
    }

    .range-end {
      stroke: var(--muted);
      stroke-width: 2;
    }

    .axis-value {
      font-size: 15px;
      font-weight: 650;
    }

    .axis-name {
      font-size: 16px;
      font-weight: 750;
    }

    .annotation {
      font-size: 15px;
      font-weight: 650;
    }

    .annotation-secondary {
      font-size: 14px;
      fill: var(--muted);
    }

    .quality-heading {
      font-size: 16px;
      font-weight: 750;
    }

    .quality-label {
      font-size: 14px;
      font-weight: 650;
    }

    .summary-box {
      fill: var(--summary);
      stroke: var(--muted);
      stroke-width: 1;
    }

    .summary-text {
      font-size: 17px;
      font-weight: 750;
    }

    .fallback {
      margin: 12px;
      color: var(--fallback);
      font-size: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title">
    <h1 id="diagram-title">Сетка 3 × 3: девять запусков, три полезных значения</h1>

    <svg id="diagram"
         viewBox="0 0 960 430"
         width="960"
         height="430"
         role="img"
         aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Grid search из девяти запусков даёт три уровня качества</title>
      <desc id="svg-desc">
        Девять точек образуют три строки по learning_rate и три столбца
        по max_depth. Внутри каждой строки оценки почти одинаковы, поэтому
        различимы только три полезных уровня качества.
      </desc>
      <g id="drawing"></g>
    </svg>

    <p id="fallback" class="fallback" hidden>
      Схема должна была показать сетку 3 × 3: девять обучений,
      сгруппированных в три уровня качества по learning_rate.
    </p>
  </figure>

  <script>
    const data = [
      {
        kind: "mapping",
        origin: { x: 250, y: 330 },
        scale: { x: 75, y: 35 },
        axes: {
          xEnd: 7.75,
          yEnd: 7.35,
          headLength: 0.22,
          headWidth: 0.13
        },
        grid: {
          xStart: 2.45,
          xEnd: 7.55,
          bandHalfHeight: 0.48,
          pointRadius: 0.14,
          coreRadius: 0.055
        },
        range: {
          xStart: 3,
          xEnd: 7,
          y: 7.05,
          capHalfHeight: 0.13,
          labelX: 5,
          labelY: 7.58,
          noteY: 7.93
        },
        quality: {
          arrowStart: 7.28,
          arrowEnd: 7.93,
          cardStart: 8.08,
          cardEnd: 9.25,
          cardHalfHeight: 0.36,
          textX: 8.665,
          headingX: 8.665,
          headingY: 7.15
        },
        labels: {
          rateX: -0.28,
          tickStart: -0.11,
          tickEnd: 0.11,
          depthTickLow: -0.12,
          depthTickHigh: 0.12,
          depthValueY: -0.43,
          depthNameX: 5,
          depthNameY: -1.03,
          rateNameX: -2.72,
          rateNameY: 4.35,
          rateNoteY: 3.78
        },
        summary: {
          xStart: 1.16,
          xEnd: 9.25,
          yLow: -2.37,
          yHigh: -1.43,
          textX: 5.205,
          textY: -1.91
        }
      },
      { kind: "depth", value: "3", x: 3 },
      { kind: "depth", value: "5", x: 5 },
      { kind: "depth", value: "7", x: 7 },
      {
        kind: "rate",
        value: "1.0",
        y: 6,
        tone: "tone-a",
        quality: "один уровень"
      },
      {
        kind: "rate",
        value: "0.1",
        y: 4,
        tone: "tone-b",
        quality: "один уровень"
      },
      {
        kind: "rate",
        value: "0.01",
        y: 2,
        tone: "tone-c",
        quality: "один уровень"
      }
    ];

    const mapping = data.find(item => item.kind === "mapping");
    const origin = mapping.origin;
    const scale = mapping.scale;

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y - y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const drawing = document.getElementById("drawing");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";
      const depths = data.filter(item => item.kind === "depth");
      const rates = data.filter(item => item.kind === "rate");
      const { axes, grid, range, quality, labels, summary } = mapping;

      const make = (tag, attributes, content) => {
        const element = document.createElementNS(namespace, tag);
        Object.entries(attributes).forEach(([name, value]) => {
          element.setAttribute(name, String(value));
        });
        if (content !== undefined) {
          element.textContent = content;
        }
        return element;
      };

      const add = element => {
        drawing.appendChild(element);
        return element;
      };

      const line = (x1, y1, x2, y2, className) => add(make("line", {
        x1: sx(x1),
        y1: sy(y1),
        x2: sx(x2),
        y2: sy(y2),
        class: className
      }));

      const box = (x1, y1, x2, y2, className) => add(make("rect", {
        x: sx(x1),
        y: sy(y2),
        width: sx(x2) - sx(x1),
        height: sy(y1) - sy(y2),
        class: className
      }));

      const circle = (x, y, radius, className) => add(make("circle", {
        cx: sx(x),
        cy: sy(y),
        r: sx(radius) - sx(0),
        class: className
      }));

      const label = (x, y, content, className, anchor) => add(make("text", {
        x: sx(x),
        y: sy(y),
        class: className,
        "text-anchor": anchor,
        "dominant-baseline": "middle"
      }, content));

      const polygon = (points, className) => add(make("polygon", {
        points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
        class: className
      }));

      const rightHead = (x, y, className) => polygon([
        { x, y },
        { x: x - axes.headLength, y: y + axes.headWidth },
        { x: x - axes.headLength, y: y - axes.headWidth }
      ], className);

      const upHead = (x, y, className) => polygon([
        { x, y },
        { x: x - axes.headWidth, y: y - axes.headLength },
        { x: x + axes.headWidth, y: y - axes.headLength }
      ], className);

      line(0, 0, axes.xEnd, 0, "axis");
      rightHead(axes.xEnd, 0, "axis-head");
      line(0, 0, 0, axes.yEnd, "axis");
      upHead(0, axes.yEnd, "axis-head");

      label(
        labels.rateNameX,
        labels.rateNameY,
        "learning_rate",
        "axis-name",
        "start"
      );
      label(
        labels.rateNameX,
        labels.rateNoteY,
        "сильно влияет",
        "annotation-secondary",
        "start"
      );

      line(
        range.xStart,
        range.y,
        range.xEnd,
        range.y,
        "range-line"
      );
      line(
        range.xStart,
        range.y - range.capHalfHeight,
        range.xStart,
        range.y + range.capHalfHeight,
        "range-end"
      );
      line(
        range.xEnd,
        range.y - range.capHalfHeight,
        range.xEnd,
        range.y + range.capHalfHeight,
        "range-end"
      );
      label(
        range.labelX,
        range.labelY,
        "max_depth меняется",
        "annotation",
        "middle"
      );
      label(
        range.labelX,
        range.noteY,
        "качество — почти нет",
        "annotation-secondary",
        "middle"
      );

      depths.forEach(depth => {
        line(
          depth.x,
          labels.depthTickLow,
          depth.x,
          labels.depthTickHigh,
          "tick"
        );
        label(
          depth.x,
          labels.depthValueY,
          depth.value,
          "axis-value",
          "middle"
        );
      });

      label(
        labels.depthNameX,
        labels.depthNameY,
        "max_depth",
        "axis-name",
        "middle"
      );

      label(
        quality.headingX,
        quality.headingY,
        "3 уровня качества",
        "quality-heading",
        "middle"
      );

      rates.forEach(rate => {
        box(
          grid.xStart,
          rate.y - grid.bandHalfHeight,
          grid.xEnd,
          rate.y + grid.bandHalfHeight,
          `band ${rate.tone}`
        );

        line(
          labels.tickStart,
          rate.y,
          labels.tickEnd,
          rate.y,
          "tick"
        );

        label(
          labels.rateX,
          rate.y,
          rate.value,
          "axis-value",
          "end"
        );

        line(
          range.xStart,
          rate.y,
          range.xEnd,
          rate.y,
          `guide ${rate.tone}`
        );

        depths.forEach(depth => {
          circle(
            depth.x,
            rate.y,
            grid.pointRadius,
            `point ${rate.tone}`
          );
          circle(
            depth.x,
            rate.y,
            grid.coreRadius,
            "point-core"
          );
        });

        line(
          quality.arrowStart,
          rate.y,
          quality.arrowEnd,
          rate.y,
          `flow ${rate.tone}`
        );
        rightHead(
          quality.arrowEnd,
          rate.y,
          `arrow-head ${rate.tone}`
        );

        box(
          quality.cardStart,
          rate.y - quality.cardHalfHeight,
          quality.cardEnd,
          rate.y + quality.cardHalfHeight,
          `quality-card ${rate.tone}`
        );
        label(
          quality.textX,
          rate.y,
          rate.quality,
          "quality-label",
          "middle"
        );
      });

      box(
        summary.xStart,
        summary.yLow,
        summary.xEnd,
        summary.yHigh,
        "summary-box"
      );
      label(
        summary.textX,
        summary.textY,
        "9 обучений  •  6 повторов  •  3 полезных уровня",
        "summary-text",
        "middle"
      );

      fallback.hidden = true;
      svg.hidden = false;
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      if (svg) {
        svg.hidden = true;
      }
      if (fallback) {
        fallback.hidden = false;
      }
    }
  </script>
</body>
</html>
