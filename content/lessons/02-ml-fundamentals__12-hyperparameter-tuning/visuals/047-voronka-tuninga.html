<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>От библиотечных значений до финальной модели</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f6f8fc;
    --panel: #ffffff;
    --ink: #172033;
    --muted: #536078;
    --line: #8794aa;
    --funnel: #e7eefc;
    --baseline: #edf2f8;
    --coarse: #dce9ff;
    --analysis: #e1f2ec;
    --narrow: #d7eee5;
    --fine: #fff0cc;
    --final: #ffe1a8;
    --blue: #356ac3;
    --green: #248460;
    --amber: #b86813;
    --chip: #ffffff;
    --shadow: #cbd4e2;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #111827;
      --panel: #172033;
      --ink: #f2f5fb;
      --muted: #b4bfd2;
      --line: #8290a8;
      --funnel: #202e4b;
      --baseline: #263247;
      --coarse: #1d3c6b;
      --analysis: #1b493d;
      --narrow: #245345;
      --fine: #5b431d;
      --final: #68431b;
      --blue: #8eb9ff;
      --green: #82dab8;
      --amber: #ffc670;
      --chip: #172033;
      --shadow: #0a1020;
    }
  }

  html,
  body {
    background: var(--page);
    color: var(--ink);
  }

  body {
    margin: auto;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  figure {
    margin: auto;
    max-width: 1200px;
    background: var(--panel);
  }

  figcaption {
    font-size: 20px;
    font-weight: 750;
    line-height: 1.35;
    text-align: center;
    color: var(--ink);
    background: var(--panel);
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 480px;
    background: var(--panel);
  }

  .funnel {
    fill: var(--funnel);
    stroke: var(--line);
    stroke-width: 1.5px;
    stroke-dasharray: 7 7;
    vector-effect: non-scaling-stroke;
  }

  .node {
    stroke-width: 2px;
    vector-effect: non-scaling-stroke;
  }

  .baseline {
    fill: var(--baseline);
    stroke: var(--line);
  }

  .coarse {
    fill: var(--coarse);
    stroke: var(--blue);
  }

  .analysis {
    fill: var(--analysis);
    stroke: var(--green);
  }

  .narrow {
    fill: var(--narrow);
    stroke: var(--green);
  }

  .fine {
    fill: var(--fine);
    stroke: var(--amber);
  }

  .final {
    fill: var(--final);
    stroke: var(--amber);
  }

  .arrow {
    stroke: var(--line);
    stroke-width: 3px;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
  }

  .arrow-head {
    fill: var(--line);
  }

  .stage-title {
    fill: var(--ink);
    font-size: 17px;
    font-weight: 750;
  }

  .stage-subtitle {
    fill: var(--muted);
    font-size: 13px;
    font-weight: 520;
  }

  .stage-tag {
    fill: var(--muted);
    font-size: 11px;
    font-weight: 750;
    letter-spacing: .08em;
  }

  .side-note {
    fill: var(--muted);
    font-size: 12px;
    font-weight: 600;
  }

  .chip {
    fill: var(--chip);
    stroke: var(--green);
    stroke-width: 1.5px;
    vector-effect: non-scaling-stroke;
  }

  .chip-text {
    fill: var(--green);
    font-size: 11px;
    font-weight: 700;
  }

  .trial-dot {
    fill: var(--blue);
    stroke: var(--panel);
    stroke-width: 1.5px;
    vector-effect: non-scaling-stroke;
  }

  .fine-dot {
    fill: var(--amber);
    stroke: var(--panel);
    stroke-width: 1.5px;
    vector-effect: non-scaling-stroke;
  }

  .guide {
    stroke: var(--line);
    stroke-width: 1.5px;
    vector-effect: non-scaling-stroke;
  }

  .fallback {
    fill: var(--ink);
    font-size: 16px;
    font-weight: 650;
  }
</style>
</head>
<body>
<figure aria-labelledby="diagram-title">
  <figcaption id="diagram-title">От библиотечных значений до финальной модели</figcaption>
  <svg id="diagram"
       xmlns="http://www.w3.org/2000/svg"
       viewBox="0 0 1200 480"
       width="1200"
       height="480"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="diagram-title diagram-description">
    <desc id="diagram-description">
      Воронка настройки: библиотечные значения, широкий random search,
      анализ важности, сужение диапазонов, fine search и переобучение
      лучшей конфигурации на всех обучающих данных.
    </desc>
  </svg>
</figure>

<script>
const data = [{
  zero: 0,
  bevel: 12,
  arrowHalf: 7,
  arrowDepth: 8,
  dotRadius: 5,
  chipCut: 8,
  funnel: [
    [226, 103],
    [954, 103],
    [798, 350],
    [402, 350]
  ],
  stages: [
    {
      id: "defaults",
      x: 410, y: 24, w: 380, h: 54,
      titleX: 600, titleY: 47, subY: 67,
      tagX: 382, tagY: 54,
      title: "Библиотечные значения",
      subtitle: "точка отсчёта",
      tag: "СТАРТ",
      kind: "baseline"
    },
    {
      id: "coarse",
      x: 210, y: 96, w: 780, h: 60,
      titleX: 600, titleY: 119, subY: 143,
      tagX: 182, tagY: 128,
      title: "Широкий random search",
      subtitle: "20–50 проб  •  широкие диапазоны",
      tag: "РАЗВЕДКА",
      kind: "coarse"
    },
    {
      id: "analysis",
      x: 280, y: 174, w: 640, h: 54,
      titleX: 600, titleY: 197, subY: 217,
      tagX: 252, tagY: 204,
      title: "Анализ важности",
      subtitle: "что влияет на качество?",
      tag: "АНАЛИЗ",
      kind: "analysis"
    },
    {
      id: "narrow",
      x: 360, y: 246, w: 480, h: 54,
      titleX: 600, titleY: 269, subY: 289,
      tagX: 332, tagY: 276,
      title: "Сужение диапазонов",
      subtitle: "оставляем перспективную область",
      tag: "ФОКУС",
      kind: "narrow"
    },
    {
      id: "fine",
      x: 400, y: 318, w: 400, h: 60,
      titleX: 600, titleY: 341, subY: 365,
      tagX: 372, tagY: 350,
      title: "Fine search",
      subtitle: "50–100 проб  •  random или байесовский",
      tag: "ТОЧНАЯ НАСТРОЙКА",
      kind: "fine"
    },
    {
      id: "final",
      x: 310, y: 396, w: 580, h: 60,
      titleX: 600, titleY: 419, subY: 443,
      tagX: 282, tagY: 428,
      title: "Переобучение лучшей конфигурации",
      subtitle: "новая модель  •  все обучающие данные",
      tag: "ФИНАЛ",
      kind: "final"
    }
  ],
  arrows: [
    { x: 600, tailY: 78, tipY: 96 },
    { x: 600, tailY: 156, tipY: 174 },
    { x: 600, tailY: 228, tipY: 246 },
    { x: 600, tailY: 300, tipY: 318 },
    { x: 600, tailY: 378, tipY: 396 }
  ],
  dots: [
    {
      kind: "trial-dot",
      points: [
        [260, 137], [288, 129], [318, 142], [348, 132],
        [852, 137], [882, 128], [912, 142], [942, 132]
      ]
    },
    {
      kind: "fine-dot",
      points: [
        [438, 359], [462, 350], [486, 360],
        [714, 359], [738, 350], [762, 360]
      ]
    }
  ],
  chips: [
    {
      x: 302, y: 205, w: 86, h: 18,
      textX: 345, textY: 218,
      text: "важно"
    },
    {
      x: 790, y: 205, w: 108, h: 18,
      textX: 844, textY: 218,
      text: "почти не влияет"
    }
  ],
  notes: [
    {
      x: 1010, y: 116,
      text: "early stopping для слабых проб",
      anchor: "start",
      line: { x1: 990, y1: 126, x2: 1002, y2: 126 }
    },
    {
      x: 860, y: 266,
      text: "пространство стало уже",
      anchor: "start",
      line: { x1: 840, y1: 276, x2: 852, y2: 276 }
    },
    {
      x: 910, y: 414,
      text: "выбранный рецепт",
      anchor: "start",
      line: { x1: 890, y1: 424, x2: 902, y2: 424 }
    }
  ],
  fallback: {
    x: 600,
    y: 240,
    text: "Defaults → широкий поиск → анализ → сужение → fine search → переобучение"
  }
}];

const origin = Object.freeze([20, 4]);
const scale = Object.freeze([1, 1]);
const [originX, originY] = origin;
const [scaleX, scaleY] = scale;
const sx = x => originX + x * scaleX;
const sy = y => originY + y * scaleY;

try {
  const [model] = data;
  const svg = document.getElementById("diagram");
  const namespace = svg.namespaceURI;
  const labelPad = 8;

  const make = (name, attributes, content) => {
    const element = document.createElementNS(namespace, name);
    for (const [key, value] of Object.entries(attributes)) {
      element.setAttribute(key, String(value));
    }
    if (content !== undefined) element.textContent = content;
    return element;
  };

  const funnelPoints = model.funnel
    .map(([x, y]) => `${sx(x)},${sy(y)}`)
    .join(" ");

  svg.appendChild(make("polygon", {
    points: funnelPoints,
    class: "funnel"
  }));

  for (const arrow of model.arrows) {
    svg.appendChild(make("line", {
      x1: sx(arrow.x),
      y1: sy(arrow.tailY),
      x2: sx(arrow.x),
      y2: sy(arrow.tipY - model.arrowDepth),
      class: "arrow"
    }));

    const arrowPoints = [
      [arrow.x - model.arrowHalf, arrow.tipY - model.arrowDepth],
      [arrow.x + model.arrowHalf, arrow.tipY - model.arrowDepth],
      [arrow.x, arrow.tipY]
    ]
      .map(([x, y]) => `${sx(x)},${sy(y)}`)
      .join(" ");

    svg.appendChild(make("polygon", {
      points: arrowPoints,
      class: "arrow-head"
    }));
  }

  for (const stage of model.stages) {
    const stagePoints = [
      [stage.x + model.bevel, stage.y],
      [stage.x + stage.w - model.bevel, stage.y],
      [stage.x + stage.w, stage.y + model.bevel],
      [stage.x + stage.w, stage.y + stage.h - model.bevel],
      [stage.x + stage.w - model.bevel, stage.y + stage.h],
      [stage.x + model.bevel, stage.y + stage.h],
      [stage.x, stage.y + stage.h - model.bevel],
      [stage.x, stage.y + model.bevel]
    ]
      .map(([x, y]) => `${sx(x)},${sy(y)}`)
      .join(" ");

    svg.appendChild(make("polygon", {
      points: stagePoints,
      class: `node ${stage.kind}`
    }));

    svg.appendChild(make("text", {
      x: sx(stage.titleX),
      y: sy(stage.titleY),
      "text-anchor": "middle",
      class: "stage-title"
    }, stage.title));

    svg.appendChild(make("text", {
      x: sx(stage.titleX),
      y: sy(stage.subY),
      "text-anchor": "middle",
      class: "stage-subtitle"
    }, stage.subtitle));

    svg.appendChild(make("text", {
      x: sx(stage.tagX) - labelPad,
      y: sy(stage.tagY),
      "text-anchor": "end",
      class: "stage-tag"
    }, stage.tag));
  }

  for (const group of model.dots) {
    for (const [x, y] of group.points) {
      svg.appendChild(make("circle", {
        cx: sx(x),
        cy: sy(y),
        r: sx(model.dotRadius) - sx(model.zero),
        class: group.kind
      }));
    }
  }

  for (const chip of model.chips) {
    const chipPoints = [
      [chip.x + model.chipCut, chip.y],
      [chip.x + chip.w - model.chipCut, chip.y],
      [chip.x + chip.w, chip.y + model.chipCut],
      [chip.x + chip.w - model.chipCut, chip.y + chip.h],
      [chip.x + model.chipCut, chip.y + chip.h],
      [chip.x, chip.y + model.chipCut]
    ]
      .map(([x, y]) => `${sx(x)},${sy(y)}`)
      .join(" ");

    svg.appendChild(make("polygon", {
      points: chipPoints,
      class: "chip"
    }));

    svg.appendChild(make("text", {
      x: sx(chip.textX),
      y: sy(chip.textY),
      "text-anchor": "middle",
      class: "chip-text"
    }, chip.text));
  }

  for (const note of model.notes) {
    svg.appendChild(make("line", {
      x1: sx(note.line.x1),
      y1: sy(note.line.y1),
      x2: sx(note.line.x2),
      y2: sy(note.line.y2),
      class: "guide"
    }));

    svg.appendChild(make("text", {
      x: sx(note.x) + labelPad,
      y: sy(note.y),
      "text-anchor": note.anchor,
      class: "side-note"
    }, note.text));
  }
} catch (error) {
  const [model] = data;
  const svg = document.getElementById("diagram");
  const namespace = svg.namespaceURI;
  svg.replaceChildren();

  const message = document.createElementNS(namespace, "text");
  message.setAttribute("x", String(sx(model.fallback.x)));
  message.setAttribute("y", String(sy(model.fallback.y)));
  message.setAttribute("text-anchor", "middle");
  message.setAttribute("class", "fallback");
  message.textContent = model.fallback.text;
  svg.appendChild(message);
}
</script>
</body>
</html>
