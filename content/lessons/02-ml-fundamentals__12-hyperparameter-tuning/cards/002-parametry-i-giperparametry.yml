- concept: dropout rate задаёт долю отключаемых нейронов
  question: В слое из 120 нейронов применяют dropout rate 0.4. Сколько нейронов в среднем будет отключено за один проход?
  explanation: Dropout rate — это доля отключаемых нейронов. Поэтому в среднем будет отключено 0.4 × 120 = 48 нейронов.
  kind: numeric
  answer: 48
  tolerance: 0.1
  id: 002-parametry-i-giperparametry-1
  fingerprint: e633f9c2
- concept: размер партии данных управляет шумом в оценке градиента
  question: На какой аспект обучения непосредственно влияет размер партии данных (batch size)?
  explanation: Градиент оценивается по примерам из текущей партии. Небольшие партии обычно дают более шумную оценку, а крупные — более стабильную.
  kind: choice
  options:
    - На максимальную глубину дерева
    - На долю отключаемых нейронов
    - На шум в оценке градиента
    - На количество признаков в данных
