- concept: семантика best_score_ и best_estimator_ после поиска с refit
  question: Что содержат атрибуты sklearn-тюнера после вызова fit при refit=True?
  explanation: Тюнер выбирает конфигурацию по средней оценке на фолдах. При refit=True он затем обучает победившую модель на всём наборе, переданном в fit.
  kind: choice
  options:
    - best_score_ — средняя CV-оценка победившей конфигурации, а best_estimator_ — модель с этими гиперпараметрами, заново обученная на всех переданных данных
    - best_score_ — оценка победителя на отдельном тестовом наборе, а best_estimator_ — модель из первого фолда
    - best_score_ — средняя обучающая метрика, а best_estimator_ — ещё не обученная модель
  correct: 0
  id: 057-gotovye-tunery-1
  fingerprint: 0292dd12
- concept: число CV-обучений в RandomizedSearchCV равно произведению числа проб и фолдов
  question: RandomizedSearchCV проверяет 24 конфигурации с помощью 6 фолдов и не выполняет финальный refit. Сколько раз будет обучена базовая модель?
  explanation: Каждая конфигурация обучается отдельно на каждом фолде, поэтому требуется 24 × 6 = 144 обучений. Параллельное выполнение сокращает время ожидания, но не число обучений.
  kind: numeric
  answer: 144
  tolerance: 0.01
  id: 057-gotovye-tunery-2
  fingerprint: 097d73f3
- concept: отрицательную sklearn-оценку neg_mean_squared_error преобразуют в положительное MSE сменой знака
  question: Заполни выражение, которое получает привычное положительное MSE из результата поиска со scoring="neg_mean_squared_error".
  explanation: Интерфейс sklearn максимизирует оценки, поэтому для MSE используется его отрицательное значение. Смена знака возвращает обычную положительную ошибку.
