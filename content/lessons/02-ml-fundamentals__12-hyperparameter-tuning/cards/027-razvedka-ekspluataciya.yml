- concept: UCB добавляет к прогнозу качества положительный бонус за неопределённость
  question: При максимизации качества используется UCB = μ + κσ. Для кандидата μ = 0.68, σ = 0.14 и κ = 1.7. Чему равен его UCB?
  explanation: UCB = 0.68 + 1.7 × 0.14 = 0.918. Поэтому высокий приоритет может получить как кандидат с сильным прогнозом, так и кандидат с большой неопределённостью.
  kind: numeric
  answer: 0.918
