- concept: масштаб ядра определяет скорость убывания сходства и ширину области уверенного прогноза
  question: Один и тот же гауссовский процесс рассматривают с малым и большим масштабом ядра. При каком масштабе влияние наблюдения обычно распространяется на более далёкие конфигурации?
  explanation: Большой масштаб заставляет сходство убывать медленнее с расстоянием, поэтому наблюдение влияет на более широкую область. При малом масштабе это влияние остаётся локальным.
  kind: choice
  options:
    - При большом масштабе
    - При малом масштабе
    - Масштаб ядра не влияет на дальность влияния
