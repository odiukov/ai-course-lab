- concept: близость для ядра определяется всей конфигурацией гиперпараметров
  question: У двух конфигураций почти совпадает learning rate, но сильно различаются остальные гиперпараметры. Почему малая неопределённость прогноза для одной конфигурации не обязана переноситься на другую?
  explanation: Гауссовский процесс оценивает сходство по расстоянию между полными векторами настроек. Совпадения по одной координате недостаточно, если остальные координаты заметно различаются.
  kind: open
  reference: Ядро сравнивает полные векторы гиперпараметров. Сильное различие по другим координатам может сделать конфигурации далёкими, несмотря на близкие значения learning rate, поэтому наблюдение в одной точке слабо уменьшит неопределённость в другой.
