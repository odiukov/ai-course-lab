- concept: гиперпараметры задаются до обучения, а параметры модель оценивает в процессе обучения
  question: Что из перечисленного является гиперпараметром модели?
  explanation: Максимальную глубину задают до обучения, поэтому это гиперпараметр. Веса сети и прогнозы в листьях модель находит по обучающим данным.
  kind: choice
  options:
    - Веса нейронной сети, найденные при обучении
    - Значения прогнозов в листьях обученного дерева
    - Максимальная глубина дерева решений
  correct: 2
  id: 001-zachem-tuning-1
  fingerprint: 294b4222
- concept: скорость обучения определяет размер шага оптимизации и влияет на устойчивость и быстроту сходимости
  question: Объясни своими словами, чем опасны слишком высокая и слишком низкая скорости обучения.
  explanation: Скорость обучения управляет размером изменения параметров. Большие шаги могут сделать оптимизацию нестабильной, а чрезмерно малые — неоправданно медленной.
  kind: open
  reference: При слишком высокой скорости обучения оптимизатор может перескакивать через хорошие решения или колебаться около них. При слишком низкой скорости улучшение идёт медленно, поэтому обучение может не успеть приблизиться к хорошему решению.
  id: 001-zachem-tuning-2
  fingerprint: 8b09f5fb
- concept: базовый цикл настройки гиперпараметров состоит из выбора значений, обучения, оценки и следующего эксперимента
  question: Расположи этапы ручной настройки гиперпараметров в правильном порядке.
  explanation: Гиперпараметры фиксируют до запуска, после чего модель обучают и оценивают. Результат оценки используют, чтобы выбрать настройки для следующей попытки.
  kind: order
  items:
    - Выбрать значения гиперпараметров
    - Обучить модель с выбранными значениями
    - Оценить полученную модель
    - Изменить значения с учётом результата и запустить новый эксперимент
  id: 001-zachem-tuning-3
  fingerprint: 15b16baf
