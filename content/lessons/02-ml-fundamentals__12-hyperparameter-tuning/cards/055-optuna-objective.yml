- concept: direction задаёт направление улучшения возвращаемой метрики
  question: Функция objective возвращает balanced accuracy на validation-наборе. Чем она выше, тем лучше модель. Заполни параметр direction.
  explanation: Для метрики, у которой большее значение означает лучшее качество, используют direction="maximize". Для ошибки вроде MSE потребовалось бы direction="minimize".
