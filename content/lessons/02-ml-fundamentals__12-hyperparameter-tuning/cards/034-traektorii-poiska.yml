- concept: одинаковые бюджет и лучший результат не определяют пространственное распределение замеров
  question: Два метода настройки получили одинаковый лучший score и выполнили одинаковое число оценок. Объясни, почему этого недостаточно, чтобы утверждать, что они одинаково расходовали бюджет, и что нужно сравнить дополнительно.
  explanation: 'В сравнении каждый метод делает 28 замеров, однако рисунок их размещения различается: grid search заполняет сетку, random search независимо рассеивает точки, а Bayesian search использует накопленные наблюдения. Поэтому итоговая строка с лучшим score не показывает, куда ушёл бюджет.'
  kind: open
  reference: Нужно изучить историю оценённых конфигураций и их расположение в пространстве гиперпараметров. Один метод мог равномерно покрывать фиксированную сетку, другой — рассеять точки по области поиска, а третий — сосредоточить поздние оценки возле перспективной области.
