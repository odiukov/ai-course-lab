- concept: честное сравнение методов поиска требует одинакового бюджета оценок целевой функции
  question: Как корректно сравнить grid search, random search и байесовскую оптимизацию по эффективности поиска?
  explanation: При равном числе замеров различие в результате отражает качество стратегии поиска. Если бюджеты различаются, более высокая оценка может объясняться лишь большим числом попыток.
  kind: choice
  options:
    - Выдать каждому методу одинаковое число оценок целевой функции и сравнить лучшие найденные результаты
    - Запустить каждый метод с настройками по умолчанию и сравнить лучшие найденные результаты
    - Продолжать каждый поиск до нахождения заранее известного оптимума
    - Разрешить более сложному методу оценить больше конфигураций
  correct: 0
  id: 017-chestny-byudzhet-1
  fingerprint: 6214a709
- concept: замером считается оценка отдельной конфигурации гиперпараметров
  question: Что считается отдельным замером при задании бюджета поиска гиперпараметров?
  explanation: Замер завершается получением оценки конкретной конфигурации. В синтетическом примере это вызов функции, а в реальной задаче такой вызов часто включает полное обучение и валидацию модели.
  kind: choice
  options:
    - Вызов целевой функции для выбранной конфигурации и получение её оценки
    - Изменение любого гиперпараметра внутри конфигурации
    - Предложение конфигурации без вычисления её качества
    - Каждая эпоха обучения независимо от числа проверяемых конфигураций
  correct: 0
