  fingerprint: dd3df313
- concept: лучший найденный результат нужно интерпретировать вместе с числом выполненных замеров
  question: Почему утверждение «метод A лучше метода B, потому что нашёл более высокую оценку» неполно, если не указан бюджет поиска?
  explanation: Лучший результат сам по себе не показывает эффективность поиска. Поэтому рядом с ним указывают число замеров и сравнивают методы при одинаковом бюджете.
  kind: open
  reference: Вероятность найти хорошую конфигурацию зависит от числа проверенных конфигураций. Без одинакового или явно указанного бюджета нельзя отделить качество стратегии поиска от преимущества, полученного за счёт дополнительных попыток; при другом бюджете порядок методов может измениться.
  id: 017-chestny-byudzhet-3
  fingerprint: 7aa60d6d
