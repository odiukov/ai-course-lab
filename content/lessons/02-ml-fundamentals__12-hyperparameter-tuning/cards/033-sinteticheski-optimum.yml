- concept: известный глобальный оптимум синтетической функции позволяет измерить оптимизационный разрыв найденного решения
  question: Объясни своими словами, какую дополнительную информацию о качестве поиска даёт синтетическая целевая функция с заранее известным глобальным максимумом.
  explanation: Одна только лучшая найденная оценка не показывает, существует ли значительно лучшая конфигурация. Для функции из урока максимум заранее равен 10, поэтому результат 9,87 означает разрыв 0,13 до истинного оптимума.
  kind: open
  reference: Можно сравнить лучший найденный результат с истинным максимумом, вычислить оптимизационный разрыв и определить, достиг ли метод глобального оптимума или насколько далеко от него остановился.
