- concept: log-uniform выборка строится равномерным сэмплированием в логарифмическом пространстве с последующим обратным преобразованием
  question: Расположите операции функции log_uniform(low, high) в правильном порядке.
  explanation: Функция реализует формулу exp(uniform(ln(low), ln(high))). Равномерность задаётся в пространстве логарифмов, а экспонента возвращает значение к исходной шкале.
  kind: order
  items:
    - Вычислить натуральные логарифмы обеих границ
    - Равномерно выбрать случайную точку между полученными логарифмами
    - Применить экспоненту к выбранной точке и вернуть результат
  id: 012-log-uniform-1
  fingerprint: 5efe3330
- concept: границы log-uniform распределения должны быть строго положительными
  question: Какие границы допустимо передать в функцию, вычисляющую log_uniform(low, high) через натуральные логарифмы?
  explanation: Алгоритм вычисляет ln(low) и ln(high), поэтому в вещественных числах обе границы должны быть строго больше нуля. Логарифм нуля и отрицательных значений для такой реализации не определён.
  kind: choice
  options:
    - Обе границы строго положительны
    - Нижняя граница может быть равна нулю
    - Обе границы могут быть отрицательными
    - Допустимы любые вещественные границы
