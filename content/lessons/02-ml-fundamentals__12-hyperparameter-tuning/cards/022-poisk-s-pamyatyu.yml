- concept: учёт прошлых замеров не гарантирует монотонного улучшения результатов байесовской оптимизации
  question: Байесовская оптимизация предложила новую конфигурацию, но её оценка оказалась хуже предыдущей. Какой вывод верен?
  explanation: Накопленные данные помогают выбирать перспективные или недостаточно исследованные области, но целевая функция заранее неизвестна. Поэтому отдельный новый замер может оказаться хуже уже найденного результата.
  kind: choice
  options:
    - 'Это допустимо: прошлые замеры направляют поиск, но не гарантируют улучшения при каждом запуске'
    - Алгоритм обязательно реализован неверно, поскольку каждая новая оценка должна быть лучше
    - После хорошего результата алгоритм должен проверять только почти такие же конфигурации
