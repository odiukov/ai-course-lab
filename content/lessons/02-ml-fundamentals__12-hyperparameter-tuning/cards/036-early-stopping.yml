- concept: решение о досрочной остановке принимают по валидационному, а не обучающему результату
  question: Ошибка на обучающей выборке продолжает снижаться, а валидационная ошибка давно не улучшается. На какой сигнал следует опираться при early stopping?
  explanation: Обучающая ошибка может снижаться даже при переобучении. Early stopping следит за валидационным результатом, чтобы остановить запуск, который уже не улучшает обобщающую способность модели.
  kind: choice
  options:
    - На отсутствие улучшения валидационной ошибки, потому что она лучше отражает качество на новых данных
    - На снижение обучающей ошибки, поэтому обучение следует продолжать
    - На среднее арифметическое обучающей и валидационной ошибок
    - Только на длительность одной эпохи
  correct: 0
  id: 036-early-stopping-1
  fingerprint: 108e0774
- concept: patience-based early stopping отслеживает последовательные эпохи без улучшения лучшего валидационного результата
  question: Расположи действия patience-based early stopping в правильном порядке.
  explanation: Patience считается относительно лучшего результата запуска. Благодаря счётчику отдельное случайное ухудшение не вызывает немедленной остановки, но длительное отсутствие прогресса завершает обучение.
  kind: order
  items:
    - После эпохи вычислить валидационный результат
    - Сравнить его с лучшим валидационным результатом этого запуска
    - При улучшении сохранить новый лучший результат и сбросить счётчик, иначе увеличить счётчик
    - Остановить обучение, когда счётчик достигнет заданного patience
  id: 036-early-stopping-2
  fingerprint: 506cfa0b
- concept: early stopping экономит бюджет поиска гиперпараметров за счёт прекращения бесперспективных запусков
  question: Объясни своими словами, зачем применять early stopping во время поиска гиперпараметров.
  explanation: При полном обучении каждой конфигурации слабые пробы расходуют столько же ресурсов, сколько перспективные. Досрочная остановка сокращает эти расходы и позволяет исследовать пространство гиперпараметров быстрее.
  kind: open
  reference: Early stopping прекращает запуски, которые перестали улучшать валидационный результат, до исчерпания полного бюджета. Освободившиеся вычисления можно потратить на проверку других конфигураций или на более перспективные обучения.
  id: 036-early-stopping-3
  fingerprint: 641ff393
