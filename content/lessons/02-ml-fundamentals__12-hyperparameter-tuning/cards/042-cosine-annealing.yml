- concept: множитель cosine annealing в заданный момент вычисляется по косинусной формуле
  question: При cosine annealing обучение прошло одну треть запланированной длительности. Какую долю начального learning rate задаёт планировщик?
  explanation: 'Подставляем t = T/3: (1 + cos(π/3)) / 2 = (1 + 0.5) / 2 = 0.75. Значит, learning rate составляет три четверти начального.'
  kind: numeric
  answer: 0.75
  tolerance: 0.001
  id: 042-cosine-annealing-1
  fingerprint: 0293582a
- concept: скорость уменьшения learning rate при cosine annealing неодинакова на разных участках обучения
  question: Объясни своими словами, как меняется скорость снижения learning rate при cosine annealing в начале, середине и конце обучения.
  explanation: 'Косинусная кривая полога возле t = 0 и t = T, а её наклон по модулю максимален при t = T/2. Поэтому снижение не является линейным: оно ускоряется к середине и затем замедляется.'
  kind: open
  reference: В начале learning rate снижается медленно, ближе к середине — быстрее всего, а к концу кривая снова становится пологой и learning rate плавно приближается к нулю.
  id: 042-cosine-annealing-2
  fingerprint: 5185fc42
