- concept: внешний цикл оценивает весь способ выбора и обучения модели
  question: Что оценивает средний результат на внешних фолдах вложенной cross-validation?
  explanation: В каждом внешнем разбиении процедура заново выбирает гиперпараметры по внутренним фолдам, обучает модель и проверяет её на независимых данных. Поэтому внешние оценки характеризуют весь алгоритм выбора конфигурации, а не одну конкретную конфигурацию.
  kind: choice
  options:
    - Качество одной заранее зафиксированной конфигурации гиперпараметров
    - Наибольшую оценку, полученную во внутреннем поиске
    - Обобщающую способность всей процедуры настройки и обучения модели
    - Качество модели на данных, использованных для выбора гиперпараметров
  correct: 2
