- concept: разные внешние разбиения могут независимо выбрать разные лучшие гиперпараметры
  question: Почему во вложенной cross-validation не требуется, чтобы внутренний поиск выбирал одинаковые гиперпараметры во всех внешних разбиениях?
  explanation: 'Состав доступных для внутренней настройки данных меняется вместе с внешним фолдом. Различие победителей не нарушает метод: важно, что каждый из них оценивается на внешних примерах, которые не участвовали в его выборе.'
  kind: open
  reference: 'В каждом внешнем разбиении внутренний поиск работает на немного другом наборе данных, поэтому его победитель может измениться. Это нормально: внешняя cross-validation оценивает качество независимого процесса выбора гиперпараметров, а не стабильность одной заранее заданной конфигурации.'
