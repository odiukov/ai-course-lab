- concept: итоговая оценка вложенной кросс-валидации агрегирует внешние тестовые результаты, а не внутренние результаты настройки
  question: После вложенной кросс-валидации получены внутренние валидационные оценки конфигураций и внешние тестовые оценки. Как корректно оценить обобщающую способность процедуры настройки?
  explanation: Внутренние оценки участвуют в выборе гиперпараметров и поэтому не являются итоговой проверкой. Для оценки обобщающей способности используют результаты на внешних тестовых фолдах; среднее характеризует ожидаемое качество, а разброс — его устойчивость между разбиениями.
  kind: choice
  options:
    - Усреднить внешние тестовые оценки и сообщить их разброс
    - Выбрать максимальную внешнюю тестовую оценку
    - Сообщить лучшую внутреннюю валидационную оценку
    - Усреднить внутренние и внешние оценки вместе
