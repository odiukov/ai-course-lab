- concept: малое слагаемое в знаменателе стандартизованного улучшения предотвращает численную ошибку
  question: При вычислении z = (mu - best_y) / (sigma + eps) зачем добавляют положительное eps?
  explanation: В уже хорошо исследованной точке sigma может быть практически нулевой. Малое eps стабилизирует деление, не меняя заметно результат при обычной неопределённости.
  kind: choice
  options:
    - Чтобы избежать деления на ноль при почти нулевой неопределённости
    - Чтобы увеличить разведочный бонус всех кандидатов
    - Чтобы сумма значений EI была равна единице
    - Чтобы преобразовать задачу максимизации в задачу минимизации
  correct: 0
  id: 029-expected-improvement-2
  fingerprint: b2015ec3
- concept: Expected Improvement вычисляется поэлементно и сохраняет соответствие между кандидатами и их оценками
  question: Массивы mu и var содержат прогнозы для набора кандидатов. Объясни, какую форму должен иметь результат Expected Improvement и почему нельзя усреднять значения между кандидатами.
  explanation: Все операции в формуле EI выполняются поэлементно. Каждому кандидату нужен собственный балл, по которому acquisition-функция сможет сравнить его с остальными.
  kind: open
  reference: Результат должен содержать отдельное значение EI для каждого кандидата и иметь ту же ведущую форму, что mu и var. Усреднение уничтожило бы различия между кандидатами, поэтому после него нельзя было бы выбрать конфигурацию с максимальным EI.
  id: 029-expected-improvement-3
  fingerprint: cd1e8dde
