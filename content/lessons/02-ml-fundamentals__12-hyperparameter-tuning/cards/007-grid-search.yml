- concept: каждая конфигурация grid search должна оцениваться на отдельно созданной модели
  question: Почему при переборе гиперпараметров для каждой конфигурации нужно заново вызывать model_fn, а не продолжать обучение уже созданной модели?
  explanation: Вызов model_fn внутри цикла изолирует эксперименты. Иначе очередная конфигурация получит модель, уже изменённую обучением с другими настройками, поэтому оценки перестанут быть сопоставимыми.
  kind: open
  reference: Новая модель начинает обучение с независимого начального состояния. Переиспользование обученной модели переносит результаты предыдущего запуска в следующий и делает сравнение конфигураций нечестным.
  id: 007-grid-search-1
  fingerprint: fac835a0
- concept: комбинация значений превращается в словарь параметров с сохранением порядка ключей
  question: Переменная keys содержит названия гиперпараметров, а combo — очередную комбинацию их значений в соответствующем порядке. Как правильно собрать аргументы для model_fn?
  explanation: zip сопоставляет элементы, стоящие на одинаковых позициях, а dict превращает пары в словарь. Сортировка ключей нарушит исходное соответствие со списками значений.
  kind: choice
  options:
    - params = dict(zip(keys, combo))
    - params = dict(zip(sorted(keys), combo))
    - params = dict.fromkeys(keys, combo)
  correct: 0
