- concept: после обучения GP на центрированных оценках среднее нужно вернуть в прогноз
  question: Гауссовский процесс обучили предсказывать отклонения оценок от их среднего. Как получить прогноз качества в исходном масштабе?
  explanation: Центрированные цели описывают отклонения от среднего. Поэтому GP сначала прогнозирует отклонение, а прибавление среднего возвращает результат к исходной шкале качества.
  kind: choice
  options:
    - Вычесть среднее из предсказанного отклонения
    - Прибавить среднее наблюдённых оценок к предсказанному отклонению
    - Умножить предсказанное отклонение на среднее
    - Оставить предсказанное отклонение без изменений
  correct: 1
  id: 025-surrogate-1
  fingerprint: 38c64c89
- concept: устойчивое вычисление апостериорного прогноза GP через разложение Холецкого и решение систем
  question: Расположи действия вычисления прогноза гауссовского процесса в устойчивом порядке.
  explanation: Разложение Холецкого позволяет получить среднее и дисперсию через решения треугольных систем. Это численно устойчивее явного вычисления обратной матрицы.
  kind: order
  items:
    - Построить матрицу ядра наблюдений и добавить малую диагональную поправку
    - Выполнить разложение Холецкого скорректированной матрицы ядра
    - Последовательно решить две треугольные системы для коэффициентов центрированных оценок
    - Умножить перекрёстную матрицу ядра на найденные коэффициенты и вернуть среднее оценок
    - Решить треугольную систему для перекрёстного ядра и по результату вычислить дисперсии
  id: 025-surrogate-2
  fingerprint: 30bbd357
- concept: форма вектора дисперсий GP должна соответствовать числу новых кандидатных точек
  question: Пусть наблюдения имеют форму `(n, d)`, новые кандидаты — `(m, d)`, а перекрёстная матрица ядра — `(m, n)`. Какую форму должен иметь массив апостериорных дисперсий?
  explanation: Каждому из `m` кандидатов соответствует одна дисперсия. После транспонирования перекрёстного ядра квадраты решения суммируются по оси наблюдений, поэтому ось кандидатов сохраняется.
  kind: choice
  options:
    - '`(m,)`'
    - '`(n,)`'
    - '`(m, n)`'
    - '`(d,)`'
  correct: 0
