- concept: имя в suggest_* служит идентификатором гиперпараметра в пробах Optuna
  question: В одних пробах один и тот же по смыслу гиперпараметр назван "lr", а в других — "learning_rate". Как Optuna интерпретирует эти имена?
  explanation: Optuna связывает предложения по строковому имени. Поэтому "lr" и "learning_rate" образуют разные параметры, даже если описывают одинаковый диапазон.
  kind: choice
  options:
    - Автоматически объединяет их по совпадающим значениям
    - Считает второе имя псевдонимом первого
    - Считает их разными гиперпараметрами
  correct: 2
  id: 054-optuna-prostranstvo-1
  fingerprint: 0ef99a02
- concept: категориальные варианты являются отдельными метками без естественного порядка
  question: Варианты режима перечислены в suggest_categorical как ["quick", "balanced", "accurate"]. Что означает их порядок в списке?
  explanation: suggest_categorical выбирает один готовый вариант. Позиция категории в списке сама по себе не означает, что один режим больше, ближе или предпочтительнее другого.
  kind: choice
  options:
    - Он задаёт приоритет выбора вариантов
    - Он превращает варианты в упорядоченную числовую шкалу
    - Он только перечисляет допустимые категории и не задаёт расстояние между ними
  correct: 2
  id: 054-optuna-prostranstvo-2
  fingerprint: 73a71c2a
- concept: границы числового диапазона задают область выборки, а не обязательный полный перебор
  question: Объясни своими словами, почему передача нижней и верхней границ в suggest_int не означает, что Optuna обязательно проверит каждое целое значение между ними.
  explanation: Диапазон в suggest_int — это пространство допустимых предложений, а не сетка для исчерпывающего перебора. Поэтому часть целых значений может не встретиться ни в одной пробе.
  kind: open
  reference: Границы описывают допустимую область поиска. Каждая проба выбирает из неё значение, а число проб и алгоритм сэмплирования определяют, какие значения действительно будут проверены.
  id: 054-optuna-prostranstvo-3
  fingerprint: '35381231'
