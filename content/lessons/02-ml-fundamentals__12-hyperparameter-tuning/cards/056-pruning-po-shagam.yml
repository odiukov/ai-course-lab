- concept: отчёт о метрике после полного обучения не позволяет pruning сэкономить вычисления текущей пробы
  question: '`cross_val_score` полностью обучил и оценил модели, после чего результат передали в `trial.report()`. Что в этой ситуации даст решение `trial.should_prune()`?'
  explanation: Pruning экономит ресурсы лишь тогда, когда решение принимается до завершения дорогого обучения. Отчёт после полного `cross_val_score` поступает слишком поздно, чтобы сократить текущую пробу.
  kind: choice
  options:
    - Optuna восстановит промежуточные состояния моделей и отменит лишние этапы обучения
    - Следующие пробы с другими гиперпараметрами будут отклоняться до начала обучения
    - Пробу можно пометить как отсечённую, но вычисления её полного обучения уже потрачены
  correct: 2
  id: 056-pruning-po-shagam-1
  fingerprint: c7efdb31
- concept: pruner не принимает решения по отчётам, сделанным раньше окончания периода warmup
  question: Заполни вывод для пробы, которая больше не сообщает никаких метрик.
  explanation: Шаг отчёта ещё находится внутри warmup-периода, когда pruning отключён. Если более поздних отчётов нет, pruner так и не получит возможности остановить пробу.
  kind: cloze
  template: '`MedianPruner(n_warmup_steps=4)` и единственный `trial.report(metric, step=1)` → по этому отчёту проба ___'
  answer: не будет отсечена
  accept:
    - не будет прервана
    - не будет остановлена
    - не будет pruned
  id: 056-pruning-po-shagam-2
  fingerprint: 01d98718
- concept: настоящий pruning требует интерфейса для получения метрик во время поэтапного обучения
  question: Модель возвращает validation-метрику только после монолитного вызова `fit`. Что нужно изменить, чтобы Optuna могла действительно сокращать бесперспективные пробы?
  explanation: Один дополнительный вызов Optuna после `fit` не создаёт промежуточных результатов. Для экономии вычислений pruner должен получать метрику и иметь возможность остановить обучение непосредственно между его этапами.
  kind: open
  reference: 'Нужно сделать этапы обучения наблюдаемыми: использовать собственный цикл, callback или поэтапный интерфейс модели. После каждого доступного этапа следует вычислять validation-метрику, передавать её в `trial.report()` и вызывать `trial.should_prune()`.'
  id: 056-pruning-po-shagam-3
  fingerprint: ee93d6f9
