- concept: прогноз суррогата используется для дешёвого отбора кандидата, но не заменяет его реальную оценку
  question: Почему конфигурацию с высоким прогнозируемым качеством нельзя сразу объявить результатом настройки гиперпараметров без обучения и проверки основной модели?
  explanation: Сравнить прогнозы для множества конфигураций дёшево, но эти прогнозы не являются измеренным качеством. Настоящий запуск проверяет выбранного кандидата и даёт новое наблюдение для последующего уточнения суррогата.
  kind: open
  reference: Суррогат лишь приближённо предсказывает качество по накопленным наблюдениям и может ошибаться, особенно в мало исследованных областях. Выбранную конфигурацию нужно реально оценить, а полученное наблюдение затем можно добавить к данным суррогата.
