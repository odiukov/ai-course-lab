- concept: порядок действий в одной итерации байесовской оптимизации
  question: Расположи действия одной итерации байесовской оптимизации в правильном порядке после получения начальных наблюдений.
  explanation: Суррогат сначала обновляют по всем доступным наблюдениям. Затем acquisition function выбирает точку, реальная модель даёт новый результат, а этот результат пополняет данные для следующей итерации.
  kind: order
  items:
    - Обучить суррогатную модель на накопленных результатах
    - Выбрать следующую конфигурацию с помощью acquisition function
    - Оценить выбранную конфигурацию на реальной модели
    - Добавить полученный результат к наблюдениям и проверить оставшийся бюджет
  id: 023-cikl-bayes-1
  fingerprint: 2f10a1fc
- concept: начальные случайные оценки дают данные для обучения первого суррогата
  question: Зачем перед первым выбором через acquisition function оценивают несколько начальных конфигураций?
  explanation: Суррогату нужны пары «конфигурация — измеренный результат». Начальные оценки создают первый набор таких наблюдений; без него модель ещё не может описывать целевую функцию.
  kind: choice
  options:
    - Чтобы получить наблюдения, на которых можно обучить первый суррогат
    - Чтобы сразу доказать, что найден глобальный оптимум
    - Чтобы больше не переобучать суррогат во время поиска
    - Чтобы acquisition function могла работать без значений целевой метрики
  correct: 0
  id: 023-cikl-bayes-2
  fingerprint: ddf69d3b
- concept: результатом поиска служит лучшая реально оценённая конфигурация
  question: Бюджет байесовской оптимизации исчерпан. Суррогат считает непроверенную конфигурацию особенно перспективной, но лучшая измеренная метрика принадлежит другой конфигурации. Что следует вернуть?
  explanation: Прогноз суррогата остаётся приближением. После исчерпания бюджета надёжным итогом является лучшая конфигурация среди тех, качество которых действительно измерили.
  kind: choice
  options:
    - Конфигурацию с лучшей реально измеренной метрикой
    - Непроверенную конфигурацию с лучшим прогнозом суррогата
    - Среднее значение гиперпараметров всех проверенных конфигураций
    - Последнюю выбранную acquisition function конфигурацию независимо от её результата
  correct: 0
  id: 023-cikl-bayes-3
