- concept: Expected Improvement равен среднему положительному превышению качества над лучшим наблюдённым результатом
  question: Лучший наблюдённый результат равен 0.76. Для нового кандидата суррогат допускает качество 0.72 с вероятностью 20%, 0.80 с вероятностью 50% и 0.87 с вероятностью 30%. Чему равен Expected Improvement?
  explanation: Исход 0.72 не улучшает рекорд и не даёт вклада. Для остальных исходов улучшения равны 0.04 и 0.11. Поэтому EI = 0.50 × 0.04 + 0.30 × 0.11 = 0.053.
  kind: numeric
  answer: 0.053
  tolerance: 0.0001
  id: 028-formula-ei-1
  fingerprint: 812b8080
- concept: текущий лучший результат служит порогом при вычислении Expected Improvement
  question: Предиктивное распределение качества фиксированного кандидата осталось прежним, а лучший уже измеренный результат повысился. Как это повлияет на Expected Improvement кандидата?
  explanation: EI усредняет только превышение возможного качества над текущим рекордом. Когда рекорд повышается, каждое такое превышение уменьшается или исчезает, поэтому EI не может стать больше.
  kind: choice
  options:
    - Expected Improvement обязательно возрастёт, потому что рекорд стал выше
    - Expected Improvement не возрастёт и обычно уменьшится, поскольку положительное превышение теперь отсчитывается от более высокого порога
    - Expected Improvement не изменится, поскольку распределение качества кандидата осталось прежним
  correct: 1
  id: 028-formula-ei-2
  fingerprint: 9a7a9e2c
