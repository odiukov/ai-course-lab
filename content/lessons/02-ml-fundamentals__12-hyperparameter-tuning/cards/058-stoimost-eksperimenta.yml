- concept: refit после кросс-валидационного поиска заново обучает лучшую конфигурацию на всём тренировочном наборе
  question: Объясни своими словами, что происходит после завершения RandomizedSearchCV при refit=True и как это влияет на вычислительные затраты.
  explanation: Внутренние модели нужны для сравнения конфигураций по фолдам, а итоговая модель обучается отдельно. Поэтому после 500 CV-обучений из примера refit=True добавляет ещё одно обучение на всех тренировочных данных.
  kind: open
  reference: После выбора лучших гиперпараметров sklearn заново обучает модель с этой конфигурацией на всём переданном тренировочном наборе. Это отдельное обучение сверх выполненных внутри кросс-валидации.
  id: 058-stoimost-eksperimenta-2
  fingerprint: d4eabe2a
