- concept: random search не может обнаружить конфигурации вне области поддержки распределения поиска
  question: Объясните своими словами, почему увеличение числа запусков random search не поможет найти сильную конфигурацию, исключённую заданными границами поиска.
  explanation: Расчёт для 60 проб предполагает, что хорошая область доступна для сэмплирования. Если неудачные границы исключили её, дополнительные пробы лишь повторно исследуют оставшуюся область.
  kind: open
  reference: Каждая проба берётся только из области, которой распределение поиска назначает ненулевую вероятность. Если сильная конфигурация находится за её пределами, вероятность выбрать её равна нулю при любом бюджете.
