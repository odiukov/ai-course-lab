- concept: Reduce on plateau уменьшает learning rate при остановке улучшения метрики
  question: Обучение продолжается, но валидационная метрика несколько эпох не улучшается. Какой планировщик специально предназначен для такой ситуации?
  explanation: Reduce on plateau следит за выбранной метрикой и уменьшает learning rate, когда её улучшение останавливается. Остальные варианты меняют learning rate по заранее заданной временной траектории.
  kind: choice
  options:
    - Reduce on plateau
    - Step decay
    - Cosine annealing
    - Warmup + decay
  correct: 0
  id: 041-planirovshiki-lr-1
  fingerprint: 379fbd18
- concept: warmup + decay сначала повышает learning rate, а затем снижает его
  question: Расположи этапы планировщика warmup + decay в правильном порядке.
  explanation: Warmup позволяет начать обучение осторожно и постепенно выйти на рабочий learning rate. После него decay уменьшает размер обновлений по мере приближения к концу обучения.
  kind: order
  items:
    - Начать с малого learning rate
    - Линейно повышать learning rate во время warmup
    - После warmup плавно снижать learning rate по косинусной траектории
  id: 041-planirovshiki-lr-2
  fingerprint: 19171f52
- concept: планировщик меняет learning rate внутри одного запуска, а поиск гиперпараметров сравнивает отдельные запуски
  question: Объясни своими словами, чем работа планировщика learning rate отличается от нового поиска гиперпараметров на каждой эпохе.
  explanation: 'Изменение learning rate планировщиком — часть одного процесса обучения. Поиск гиперпараметров находится уровнем выше: он оценивает разные конфигурации в отдельных экспериментах.'
  kind: open
  reference: Планировщик исполняет заданное правило изменения learning rate внутри одного запуска обучения. Поиск гиперпараметров проводит и сравнивает отдельные запуски с разными начальными значениями или настройками планировщика.
  id: 041-planirovshiki-lr-3
  fingerprint: 2dc5e7e4
