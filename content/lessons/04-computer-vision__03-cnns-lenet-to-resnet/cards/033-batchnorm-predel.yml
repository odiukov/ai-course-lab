- concept: BatchNorm стабилизирует масштаб активаций каждого канала и сохраняет выразительность с помощью обучаемых масштаба и сдвига
  question: В глубокой CNN распределение активаций меняется по мере обновления весов. Как BatchNorm обрабатывает выходы одного канала во время обучения?
  explanation: BatchNorm приводит среднее и разброс активаций канала к устойчивому масштабу. Обучаемые параметры масштаба и сдвига позволяют сети выбрать подходящее распределение, поэтому нормализация не лишает её выразительности.
  kind: choice
  options:
    - Обнуляет случайную часть активаций, а остальные усиливает
    - Нормализует значения по мини-батчу, а затем применяет обучаемые масштаб и сдвиг
    - Ограничивает веса канала фиксированным диапазоном
    - Добавляет вход блока к его выходу
  correct: 1
  id: 033-batchnorm-predel-1
  fingerprint: da3b3b63
- concept: BatchNorm стабилизирует сигналы, но не создаёт короткого пути для градиента через глубокую сеть
  question: Почему BatchNorm облегчает обучение глубокой обычной CNN, но не гарантирует успешное обучение при дальнейшем увеличении глубины?
  explanation: Нормализация исправляет нестабильный масштаб сигналов, но не сокращает путь обратного распространения. Для устранения деградации нужна архитектурная возможность передавать сигнал и градиент в обход части преобразований, например остаточная связь.
  kind: open
  reference: BatchNorm удерживает активации и градиенты в более удобном масштабе, однако не меняет последовательную архитектуру сети. Градиент по-прежнему должен пройти через все преобразования и остаётся произведением локальных производных, поэтому в очень глубокой сети он всё ещё может ослабнуть.
  id: 033-batchnorm-predel-2
