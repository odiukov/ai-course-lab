- concept: уменьшение пространственного разрешения снижает вычисления и чувствительность признаков к небольшим сдвигам
  question: Каков основной эффект уменьшения пространственного разрешения карт признаков в CNN?
  explanation: Уменьшение делает карты признаков компактнее, поэтому последующие слои требуют меньше вычислений. Одновременно точное положение отклика становится менее важным, что повышает устойчивость к небольшим сдвигам объекта.
  kind: choice
  options:
    - Снижение вычислительной нагрузки и чувствительности к небольшим смещениям признака
    - Восстановление потерянных деталей исходного изображения
    - Превращение всех свёрточных фильтров в один общий фильтр
    - Устранение необходимости в нелинейных функциях активации
