- concept: типичный блок CNN последовательно извлекает признаки, преобразует их нелинейно и сокращает пространственное разрешение
  question: Расположите операции типичного цикла классической CNN в правильном порядке.
  explanation: Классические CNN многократно повторяют схему «свёртка — нелинейность — уменьшение». Сначала сеть обнаруживает локальные признаки, затем получает возможность нелинейно комбинировать их и после этого сокращает объём пространственных данных.
  kind: order
  items:
    - Вычислить локальные признаки свёрточными фильтрами
    - Применить нелинейную функцию активации
    - Уменьшить пространственное разрешение карт признаков
