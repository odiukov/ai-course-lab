- concept: Bottleneck удешевляет пространственную свёртку, временно уменьшая число обрабатываемых ею каналов
  question: Расположите операции основного пути Bottleneck в правильном порядке.
  explanation: В Bottleneck свёртка 1×1 сначала сужает представление, затем дорогая свёртка 3×3 работает с меньшим числом каналов, а завершающая свёртка 1×1 расширяет результат. Shortcut охватывает всю эту тройку.
  kind: order
  items:
    - Точечная свёртка уменьшает число каналов
    - Пространственная свёртка обрабатывает суженное представление
    - Точечная свёртка восстанавливает требуемое число каналов
