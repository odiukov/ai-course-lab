- concept: локальная экономия параметров в блоке не гарантирует малого размера всей глубокой сети
  question: Объясни, почему более экономный по параметрам свёрточный блок не обязательно делает всю архитектуру компактной.
  explanation: В VGG стек малых свёрток выгоднее отдельной крупной свёртки при том же обзоре, однако большая глубина и остальные слои доводят общий размер модели примерно до 138 миллионов параметров.
  kind: open
  reference: Общий размер модели определяется суммой параметров всех её слоёв. Даже экономный блок может дать тяжёлую сеть, если он многократно повторяется или если другие части архитектуры содержат много весов.
  id: 024-proverka-vgg-2
  fingerprint: 25e47bde
