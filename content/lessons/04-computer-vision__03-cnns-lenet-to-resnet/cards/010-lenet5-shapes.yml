- concept: размер входа полносвязного слоя равен произведению каналов, высоты и ширины карты признаков
  question: Заполни выражение для числа признаков после превращения тензора формы (C, H, W) в вектор.
  explanation: Операция flatten объединяет все непакетные измерения, поэтому длина вектора равна C × H × W. В LeNet-5 перед fc1 форма равна 16 × 5 × 5, откуда получаются 400 входных признаков.
