- concept: глобальный adaptive average pooling делает размер входа классификатора независимым от пространственного разрешения
  question: Заполни пропуск в преобразовании формы тензора при глобальном adaptive average pooling.
  explanation: Pooling сводит пространственную карту каждого канала к скаляру, поэтому после Flatten длина вектора равна C и не зависит от H и W. В TinyResNet тензор с 256 каналами и картами 4×4 превращается в вектор длины 256.
  kind: cloze
  template: B × C × H × W → global adaptive average pooling → B × ___
  answer: C
  accept:
