- concept: одновременный рост обучающей и тестовой ошибок при увеличении глубины указывает на проблему оптимизации, а не на переобучение
  question: После добавления слоёв в обычную CNN выросли и обучающая, и тестовая ошибки. Какой вывод наиболее обоснован?
  explanation: При переобучении обучающая ошибка обычно остаётся низкой, а тестовая растёт. Если ухудшаются обе, более глубокая сеть не смогла даже хорошо подогнаться под обучающие данные — это диагностический признак проблемы деградации.
  kind: choice
  options:
    - Сеть переобучилась, потому что слишком хорошо запомнила обучающие примеры
    - 'Возникла проблема деградации: оптимизатору стало труднее найти хорошие веса'
    - Более глубокая сеть обязательно имеет меньшую выразительную способность
    - Тестовая выборка стала частью обучающей
  correct: 1
  id: 029-degradation-1
  fingerprint: 7d217b82
- concept: затухающий градиент мешает ранним слоям глубокой сети получать полезный сигнал для обновления весов
  question: Объясни своими словами, почему ослабление градиента при обратном распространении может ухудшить обучение ранних слоёв глубокой CNN.
  explanation: Градиент раннего слоя содержит произведение производных всех последующих преобразований. Когда множители систематически уменьшают сигнал, ранние слои получают почти нулевые обновления и обучение всей сети деградирует.
  kind: open
  reference: Оптимизатор обновляет веса на основе градиентов. Если при прохождении через множество слоёв градиент становится почти нулевым, веса ранних слоёв меняются слишком слабо и не учатся извлекать полезные признаки. Поэтому большая выразительная способность глубокой сети не гарантирует, что оптимизатор сможет найти хорошее решение.
  id: 029-degradation-2
  fingerprint: 310eb008
