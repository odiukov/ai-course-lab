- concept: MobileNet подходит для запуска CNN при жёстких ограничениях по задержке и вычислениям
  question: Классификатор изображений должен работать непосредственно на маломощном мобильном устройстве с минимальной задержкой. Какое семейство CNN наиболее уместно проверить первым?
  explanation: 'MobileNet проектировалась для вычислительно ограниченных устройств: разделение пространственной обработки и смешивания каналов уменьшает стоимость свёрток. Окончательный выбор всё равно подтверждают измерением задержки и памяти на целевом устройстве.'
  kind: choice
  options:
    - VGG
    - MobileNet
    - ConvNeXt
    - LeNet
  correct: 1
  id: 050-vybor-backbone-1
  fingerprint: 4a9558ab
- concept: маленький размеченный датасет допускает использование крупного предобученного backbone
  question: Почему при небольшом размеченном датасете не обязательно обучать маленькую CNN с нуля? Объясни своими словами.
  explanation: Предобучение переносит в новую задачу признаки, полученные на большом датасете. Поэтому более ёмкая предобученная модель может обобщать лучше маленькой сети, обучаемой с нуля, если корректно настроить дообучение и контролировать переобучение.
  kind: open
  reference: Можно взять backbone, заранее обученный на большом наборе изображений, и дообучить его под новую задачу. Уже выученные универсальные визуальные признаки уменьшают потребность в размеченных данных, поэтому размер датасета сам по себе не определяет допустимый размер архитектуры.
  id: 050-vybor-backbone-2
  fingerprint: 4aa324ee
- concept: выбор семейства CNN завершается сравнением качества и ресурсных метрик на целевой платформе
  question: Расположи этапы инженерного выбора CNN в правильном порядке.
  explanation: Название семейства не определяет лучший вариант само по себе. Кандидатов сначала подбирают по задаче, данным и ограничениям, а затем сравнивают по качеству, задержке и памяти именно в условиях будущего запуска.
  kind: order
  items:
    - Определить сложность задачи, объём доступных данных и требования к запуску
    - Выбрать несколько подходящих семейств и варианты предобученных backbone
    - Дообучить кандидатов и измерить качество на отложенных данных
    - Измерить задержку и потребление памяти на целевой платформе
    - Выбрать модель, удовлетворяющую одновременно требованиям к качеству и ресурсам
  id: 050-vybor-backbone-3
  fingerprint: 7e6312b5
