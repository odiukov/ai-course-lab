- concept: dropout использует случайное отключение нейронов только при обучении
  question: Как должна меняться работа dropout при переходе нейросети из режима обучения в режим оценки?
  explanation: При обучении dropout случайно отключает часть нейронов и мешает им чрезмерно зависеть друг от друга. При оценке работает вся сеть, а масштаб активаций согласуется с режимом обучения.
  kind: choice
  options:
    - Случайное отключение сохраняется, но меняется набор отключаемых нейронов
    - Случайное отключение прекращается, и сеть использует все нейроны с учётом нужного масштабирования сигналов
    - Отключаются только нейроны, которые редко активировались при обучении
    - Dropout заменяется дополнительным полносвязным слоем
  correct: 1
  id: 019-alexnet-ostalnoe-1
  fingerprint: dd0a4180
- concept: dropout снижает совместную адаптацию нейронов и переобучение
  question: Объясни своими словами, почему случайное отключение нейронов при обучении может улучшить качество широкой нейросети на новых данных.
  explanation: Большая ёмкость AlexNet повышала риск запоминания обучающих изображений. Dropout в полносвязной голове регулярно менял доступный набор связей и тем самым действовал как регуляризация.
  kind: open
  reference: Нейроны не могут постоянно полагаться на один и тот же набор соседей, поэтому вынуждены изучать признаки, полезные в разных сочетаниях. Это уменьшает совместную адаптацию и мешает модели запоминать случайные особенности обучающей выборки.
  id: 019-alexnet-ostalnoe-2
  fingerprint: b3d3e23c
- concept: разделение AlexNet между видеокартами было следствием ограничений памяти оборудования
  question: Как следует интерпретировать параллельные потоки каналов в исходной схеме AlexNet?
  explanation: AlexNet разрезали между двумя видеокартами, потому что параметры и промежуточные данные не помещались в память одной. Параллельные потоки отражали инженерное ограничение железа, а не самостоятельный принцип распознавания изображений.
  kind: choice
  options:
    - Как обязательный механизм извлечения признаков разных масштабов
    - Как способ разместить крупную модель в ограниченной памяти доступного оборудования
    - Как разновидность dropout для свёрточных карт признаков
    - Как доказательство независимости всех каналов сети
  correct: 1
