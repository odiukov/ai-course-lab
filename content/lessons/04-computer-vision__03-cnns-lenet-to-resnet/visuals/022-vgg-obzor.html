<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Одна свёртка 5×5 против двух 3×3</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f8fafc;
      --panel: #ffffff;
      --panel-alt: #f1f5f9;
      --text: #172033;
      --muted: #56637a;
      --grid: #9aa8bb;
      --line: #34445f;
      --blue-soft: #dbeafe;
      --blue: #6aa9ef;
      --blue-strong: #2563a9;
      --orange-soft: #ffedd5;
      --orange: #f08a38;
      --relu: #fb7185;
      --relu-soft: #ffe4e9;
      --success: #0f766e;
      --success-soft: #ccfbf1;
      --shadow: rgba(30, 41, 59, .09);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111827;
        --panel: #182235;
        --panel-alt: #202c40;
        --text: #edf4ff;
        --muted: #b6c2d5;
        --grid: #718098;
        --line: #cad6e8;
        --blue-soft: #1f3b5d;
        --blue: #4f91d7;
        --blue-strong: #9bc9fa;
        --orange-soft: #513520;
        --orange: #f4a261;
        --relu: #fb7185;
        --relu-soft: #512b38;
        --success: #5eead4;
        --success-soft: #173f3c;
        --shadow: rgba(0, 0, 0, .25);
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .figure {
      width: 100%;
      max-width: 1120px;
      margin: auto;
      padding: 12px 10px 8px;
      background: var(--page);
    }

    h2 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 22px;
      line-height: 1.2;
    }

    #mount {
      min-height: 1em;
      background: var(--page);
    }

    #fallback {
      margin: 0;
      padding: 18px;
      border: 1px solid var(--grid);
      border-radius: 10px;
      background: var(--panel);
      color: var(--text);
      font-size: 16px;
      line-height: 1.45;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 430px;
      background: var(--page);
    }

    .panel {
      fill: var(--panel);
      stroke: var(--grid);
      stroke-width: 1.5;
      filter: drop-shadow(0 3px 7px var(--shadow));
    }

    .panel-title {
      fill: var(--text);
      font-size: 18px;
      font-weight: bold;
    }

    .label {
      fill: var(--text);
      font-size: 15px;
    }

    .small {
      fill: var(--muted);
      font-size: 13px;
    }

    .strong {
      fill: var(--text);
      font-size: 15px;
      font-weight: bold;
    }

    .cell {
      stroke: var(--grid);
      stroke-width: 1.25;
    }

    .field-five {
      fill: var(--blue-soft);
    }

    .field-three {
      fill: var(--blue);
    }

    .center-cell {
      fill: var(--orange-soft);
      stroke: var(--orange);
      stroke-width: 2.5;
    }

    .feature-cell {
      fill: var(--panel-alt);
      stroke: var(--blue-strong);
    }

    .feature-center {
      fill: var(--blue);
      stroke: var(--blue-strong);
      stroke-width: 2.5;
    }

    .output {
      fill: var(--orange-soft);
      stroke: var(--orange);
      stroke-width: 2.5;
    }

    .flow {
      stroke: var(--line);
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
    }

    .fan {
      stroke: var(--blue-strong);
      stroke-width: 1.25;
      fill: none;
    }

    .arrow-head {
      fill: var(--line);
    }

    .relu-box {
      fill: var(--relu-soft);
      stroke: var(--relu);
      stroke-width: 2;
    }

    .relu-text {
      fill: var(--text);
      font-size: 15px;
      font-weight: bold;
    }

    .legend-box {
      stroke: var(--grid);
      stroke-width: 1.25;
    }

    .result-band {
      fill: var(--success-soft);
      stroke: var(--success);
      stroke-width: 1.5;
    }

    .result-text {
      fill: var(--text);
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="figure">
    <h2>Одна свёртка 5×5 против двух 3×3</h2>
    <div id="mount">
      <p id="fallback">Схема должна показать, что одна свёртка 5×5 и две последовательные свёртки 3×3 имеют одинаковое поле обзора 5×5, но во втором случае между слоями появляется дополнительная ReLU.</p>
    </div>
  </main>

  <script>
    const DATA = [{
      zero: 0,
      half: 0.5,
      one: 1,
      two: 2,
      three: 3,
      four: 4,
      five: 5,
      quarter: 0.25,
      arrowLength: 0.32,
      arrowHalf: 0.18,
      radius: 0.22,
      dash: "6 5",
      leftPanel: { x: 0.35, y: 0.55, w: 10.55, h: 10.75 },
      rightPanel: { x: 11.35, y: 0.55, w: 20.15, h: 10.75 },
      leftTitle: { x: 5.625, y: 1.35 },
      rightTitle: { x: 21.425, y: 1.35 },
      leftGrid: { x: 1.25, y: 2.35 },
      rightGrid: { x: 12.25, y: 2.35 },
      featureGrid: { x: 20.05, y: 3.35 },
      leftOutput: { x: 8.25, y: 4.35 },
      rightOutput: { x: 28.45, y: 4.35 },
      relu: { x: 24.1, y: 4.25, w: 1.65, h: 1.2 },
      leftArrow: { x1: 6.65, y1: 4.85, x2: 7.95, y2: 4.85 },
      firstArrow: { x1: 17.7, y1: 4.85, x2: 19.7, y2: 4.85 },
      toReluArrow: { x1: 23.35, y1: 4.85, x2: 23.85, y2: 4.85 },
      secondArrow: { x1: 26, y1: 4.85, x2: 28.15, y2: 4.85 },
      leftGridLabel: { x: 3.75, y: 7.85 },
      leftOutputLabel: { x: 8.75, y: 6.05 },
      leftPassLabel: { x: 5.625, y: 9.15 },
      firstConvLabel: { x: 18.7, y: 4.15 },
      secondConvLabel: { x: 27.05, y: 4.15 },
      inputLabel: { x: 14.75, y: 7.85 },
      featureLabel: { x: 21.55, y: 7.15 },
      shiftLabel: { x: 21.55, y: 7.72 },
      leftLegend: { x: 13.05, y: 8.65 },
      rightLegend: { x: 21.45, y: 8.65 },
      legendCell: 0.55,
      result: { x: 12.45, y: 9.65, w: 18, h: 1.05 },
      resultText: { x: 21.45, y: 10.35 },
      fan: [
        { x1: 12.75, y1: 2.85, x2: 20.55, y2: 3.85 },
        { x1: 16.75, y1: 2.85, x2: 22.55, y2: 3.85 },
        { x1: 12.75, y1: 6.85, x2: 20.55, y2: 5.85 },
        { x1: 16.75, y1: 6.85, x2: 22.55, y2: 5.85 }
      ]
    }];

    const [D] = DATA;
    const origin = { x: 16, y: 12 };
    const scale = 34;
    const sx = x => origin.x + x * scale;
    const sy = y => origin.y + y * scale;

    try {
      const NS = "http://www.w3.org/2000/svg";
      const mount = document.getElementById("mount");
      const fallback = document.getElementById("fallback");

      const node = (name, attrs = {}, value = "") => {
        const item = document.createElementNS(NS, name);
        Object.entries(attrs).forEach(([key, val]) => item.setAttribute(key, val));
        if (value) item.textContent = value;
        return item;
      };

      const svg = node("svg", {
        viewBox: "0 0 1120 420",
        width: "1120",
        height: "420",
        preserveAspectRatio: "xMidYMid meet",
        role: "img",
        "aria-labelledby": "svgTitle svgDescription"
      });

      svg.append(
        node("title", { id: "svgTitle" },
          "Сравнение одной свёртки 5 на 5 с двумя свёртками 3 на 3"),
        node("desc", { id: "svgDescription" },
          "Оба пути дают поле обзора 5 на 5. В пути из двух свёрток между слоями находится дополнительная ReLU.")
      );

      const rect = (parent, x, y, w, h, className, radius = D.zero) => {
        const item = node("rect", {
          x: sx(x),
          y: sy(y),
          width: sx(x + w) - sx(x),
          height: sy(y + h) - sy(y),
          rx: sx(x + radius) - sx(x),
          class: className
        });
        parent.append(item);
        return item;
      };

      const line = (parent, x1, y1, x2, y2, className, dashed = false) => {
        const attrs = {
          x1: sx(x1),
          y1: sy(y1),
          x2: sx(x2),
          y2: sy(y2),
          class: className
        };
        if (dashed) attrs["stroke-dasharray"] = D.dash;
        const item = node("line", attrs);
        parent.append(item);
        return item;
      };

      const label = (parent, x, y, value, className, anchor = "middle") => {
        const item = node("text", {
          x: sx(x),
          y: sy(y),
          class: className,
          "text-anchor": anchor,
          "dominant-baseline": "middle"
        }, value);
        parent.append(item);
        return item;
      };

      const arrow = (parent, spec) => {
        line(parent, spec.x1, spec.y1, spec.x2, spec.y2, "flow");
        const dx = spec.x2 - spec.x1;
        const dy = spec.y2 - spec.y1;
        const length = Math.hypot(dx, dy);
        const ux = dx / length;
        const uy = dy / length;
        const bx = spec.x2 - ux * D.arrowLength;
        const by = spec.y2 - uy * D.arrowLength;
        const px = -uy * D.arrowHalf;
        const py = ux * D.arrowHalf;
        const points = [
          `${sx(spec.x2)},${sy(spec.y2)}`,
          `${sx(bx + px)},${sy(by + py)}`,
          `${sx(bx - px)},${sy(by - py)}`
        ].join(" ");
        parent.append(node("polygon", { points, class: "arrow-head" }));
      };

      const drawGrid = (parent, start, mode) => {
        for (let row = D.zero; row < D.five; row += D.one) {
          for (let col = D.zero; col < D.five; col += D.one) {
            let className = "cell field-five";
            if (mode === "left" && row === D.two && col === D.two) {
              className = "cell center-cell";
            }
            if (
              mode === "right" &&
              row >= D.one && row <= D.three &&
              col >= D.one && col <= D.three
            ) {
              className = "cell field-three";
            }
            rect(
              parent,
              start.x + col,
              start.y + row,
              D.one,
              D.one,
              className
            );
          }
        }
      };

      const drawFeatureGrid = parent => {
        for (let row = D.zero; row < D.three; row += D.one) {
          for (let col = D.zero; col < D.three; col += D.one) {
            const className =
              row === D.one && col === D.one
                ? "cell feature-center"
                : "cell feature-cell";
            rect(
              parent,
              D.featureGrid.x + col,
              D.featureGrid.y + row,
              D.one,
              D.one,
              className
            );
          }
        }
      };

      const panels = node("g");
      rect(
        panels,
        D.leftPanel.x,
        D.leftPanel.y,
        D.leftPanel.w,
        D.leftPanel.h,
        "panel",
        D.radius
      );
      rect(
        panels,
        D.rightPanel.x,
        D.rightPanel.y,
        D.rightPanel.w,
        D.rightPanel.h,
        "panel",
        D.radius
      );
      svg.append(panels);

      const guides = node("g", { "aria-hidden": "true" });
      D.fan.forEach(item =>
        line(guides, item.x1, item.y1, item.x2, item.y2, "fan", true)
      );
      svg.append(guides);

      const content = node("g");
      label(
        content,
        D.leftTitle.x,
        D.leftTitle.y,
        "Одна свёртка 5×5",
        "panel-title"
      );
      label(
        content,
        D.rightTitle.x,
        D.rightTitle.y,
        "Две свёртки 3×3",
        "panel-title"
      );

      drawGrid(content, D.leftGrid, "left");
      drawGrid(content, D.rightGrid, "right");
      drawFeatureGrid(content);

      rect(
        content,
        D.leftOutput.x,
        D.leftOutput.y,
        D.one,
        D.one,
        "output",
        D.radius
      );
      rect(
        content,
        D.rightOutput.x,
        D.rightOutput.y,
        D.one,
        D.one,
        "output",
        D.radius
      );

      arrow(content, D.leftArrow);
      arrow(content, D.firstArrow);
      arrow(content, D.toReluArrow);
      arrow(content, D.secondArrow);

      rect(
        content,
        D.relu.x,
        D.relu.y,
        D.relu.w,
        D.relu.h,
        "relu-box",
        D.radius
      );
      label(
        content,
        D.relu.x + D.relu.w * D.half,
        D.relu.y + D.relu.h * D.half,
        "ReLU",
        "relu-text"
      );

      label(
        content,
        D.leftGridLabel.x,
        D.leftGridLabel.y,
        "25 позиций: поле обзора 5×5",
        "strong"
      );
      label(
        content,
        D.leftOutputLabel.x,
        D.leftOutputLabel.y,
        "итоговая клетка",
        "small"
      );
      label(
        content,
        D.leftPassLabel.x,
        D.leftPassLabel.y,
        "весь контекст — за один проход",
        "label"
      );

      label(
        content,
        D.firstConvLabel.x,
        D.firstConvLabel.y,
        "свёртка 3×3",
        "small"
      );
      label(
        content,
        D.secondConvLabel.x,
        D.secondConvLabel.y,
        "свёртка 3×3",
        "small"
      );
      label(
        content,
        D.inputLabel.x,
        D.inputLabel.y,
        "исходные позиции: общий обзор 5×5",
        "strong"
      );
      label(
        content,
        D.featureLabel.x,
        D.featureLabel.y,
        "9 соседних промежуточных клеток",
        "label"
      );
      label(
        content,
        D.shiftLabel.x,
        D.shiftLabel.y,
        "каждая собрала свой сдвинутый участок 3×3",
        "small"
      );

      rect(
        content,
        D.leftLegend.x,
        D.leftLegend.y,
        D.legendCell,
        D.legendCell,
        "legend-box field-three",
        D.radius
      );
      label(
        content,
        D.leftLegend.x + D.legendCell + D.quarter,
        D.leftLegend.y + D.legendCell * D.half,
        "после первой: 3×3",
        "small",
        "start"
      );

      rect(
        content,
        D.rightLegend.x,
        D.rightLegend.y,
        D.legendCell,
        D.legendCell,
        "legend-box field-five",
        D.radius
      );
      label(
        content,
        D.rightLegend.x + D.legendCell + D.quarter,
        D.rightLegend.y + D.legendCell * D.half,
        "после второй: 5×5",
        "small",
        "start"
      );

      rect(
        content,
        D.result.x,
        D.result.y,
        D.result.w,
        D.result.h,
        "result-band",
        D.radius
      );
      label(
        content,
        D.resultText.x,
        D.resultText.y,
        "Итог: 5×5 = 5×5, а между двумя слоями есть дополнительная ReLU",
        "result-text"
      );

      svg.append(content);
      fallback.replaceWith(svg);
    } catch (error) {
      const fallback = document.getElementById("fallback");
      fallback.textContent =
        "Схема должна была показать: одна свёртка 5×5 и две последовательные свёртки 3×3 дают одинаковое поле обзора 5×5, но две свёртки добавляют ReLU между слоями.";
    }
  </script>
</body>
</html>
