- concept: режим поддержки означает не поломку библиотеки, а перенос потока новых возможностей в наследника, поэтому решение зависит от срока жизни продукта
  question: Библиотека объявлена стабильной, но переведена в режим поддержки, а активная разработка перенесена в продукт-наследник. Объясни своими словами, как это должно повлиять на выбор для (а) исследовательского прототипа и (б) нового долгоживущего продакшен-сервиса.
  explanation: Ошибка — читать «режим поддержки» как «сломано, срочно уходить». AutoGen v0.7.x стабилен для исследований и прототипов; аргумент против него для нового долгоживущего продукта — не качество, а направление развития (Microsoft Agent Framework как продакшен-наследник). Цена перехода снижена тем, что переносится акторная модель, а не только конкретные классы.
  kind: open
  reference: 'Режим поддержки означает, что библиотека работает и получает исправления, но поток новых крупных возможностей идёт в наследника. Для прототипа это почти не важно: горизонт жизни короткий, стабильности достаточно, а переписывать под наследника нечего. Для нового долгоживущего сервиса решающим становится не сегодняшнее состояние, а то, куда пойдут возможности и внимание сопровождающих за годы жизни продукта, — поэтому его разумнее проектировать сразу под наследника. При этом миграция не катастрофична: ящик, адресация, обработчики и изоляция сбоев переносятся между реализациями, меняется оболочка API, а не модель.'
