- concept: переход на собственный рантайм переносит на команду ответственность за отмену, повторы, перегрузку очередей, наблюдаемость и обновления
  question: Команда меняет готовый акторный фреймворк на собственный рантайм и получает полный контроль над доставкой. Что она одновременно берёт на себя?
  explanation: Контроль и обязанность — одно и то же приобретение. Всё, что готовый фреймворк давал бесплатно (отмена, ретраи, backpressure, телеметрия, миграции версий), становится вашим кодом, который надо писать, тестировать и сопровождать. Логика обработчиков как раз переносится — она не зависит от того, кто разбирает ящик.
  kind: choice
  options:
    - Поддержку отмены задач, повторных попыток, перегрузки очередей, наблюдаемости и обновлений
    - Только написание цикла доставки — остальное покрывается языком и стандартной библиотекой
    - Переписывание логики самих агентов, потому что обработчики привязаны к фреймворку
    - 'Отказ от асинхронности: собственный рантайм проще делать синхронным'
  correct: 0
