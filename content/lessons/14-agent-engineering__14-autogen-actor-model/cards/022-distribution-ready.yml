- concept: distribution-ready означает, что сложность удалённой доставки локализована в рантайме, а не устранена
  question: Команда переносит одного актора акторной системы на отдельный сервер с GPU. Что корректно описывает свойство distribution-ready?
  explanation: 'Удалённый маршрут дороже и ненадёжнее локального: нужны сериализация сообщения, установка соединения, таймауты и политика при обрыве. Distribution-ready — про то, где эта работа лежит: внутри рантайма и транспорта, отдельно от кода обработчиков. Автоматической репликации и надёжной сети это свойство не обещает.'
  kind: choice
  options:
    - 'Сеть становится такой же надёжной, как локальная очередь: обрывов и задержек больше нет'
    - Сериализация, соединение и реакция на обрыв никуда не деваются, но живут в рантайме и транспорте, а не в логике акторов
    - Рантайм автоматически поднимает копию актора на всех машинах кластера и балансирует нагрузку
    - Отправка становится синхронной, потому что по сети нужно дождаться подтверждения получателя
  correct: 1
  id: 022-distribution-ready-1
  fingerprint: ad1c3d88
- concept: удалённый транспорт требует, чтобы сообщение было сериализуемыми данными, поэтому ссылки на живые объекты процесса недопустимы в качестве полезной нагрузки
  question: Актор A шлёт сообщение актору B. Пока оба в одном процессе, всё работает; после переноса B на другую машину доставка ломается. Какое содержимое сообщения объясняет поломку?
  explanation: 'Локальный маршрут кладёт в ящик тот же объект в памяти, поэтому ссылка на кэш или дескриптор «работает». Удалённый маршрут превращает сообщение в байты и восстанавливает его в чужом процессе, где такой ссылки не существует. Пригодная к распределению нагрузка — самодостаточные данные: строки, числа, вложенные структуры, идентификаторы.'
  kind: choice
  options:
    - Сообщение содержит открытый файловый дескриптор и ссылку на объект-кэш из процесса A
    - Сообщение содержит строку и число
    - Сообщение содержит вложенный словарь из строк и чисел
    - Сообщение содержит список идентификаторов задач
  correct: 0
  id: 022-distribution-ready-2
  fingerprint: ba2f3214
- concept: удалённая доставка вставляет между отправкой и ящиком стадии сериализации, передачи и восстановления сообщения на стороне получателя
  question: Актор на машине X отправляет сообщение актору на машине Y. Расположи стадии удалённой доставки по порядку.
  explanation: 'Локальный и удалённый маршруты совпадают на концах: сдача сообщения рантайму и разбор ящика обработчиком. Различие — вставка сериализации, сетевой передачи и восстановления в середине. Именно эта середина, а не логика акторов, дорожает при распределении.'
  kind: order
  items:
    - Отправитель передаёт сообщение рантайму и продолжает работу
    - Рантайм машины X превращает сообщение в набор байтов
    - Транспорт переносит байты по сети на машину Y
    - Рантайм машины Y восстанавливает сообщение из байтов
    - Восстановленное сообщение попадает в ящик актора-получателя
    - Обработчик получателя берёт сообщение из ящика и запускает работу
  id: 022-distribution-ready-3
  fingerprint: 93173b88
