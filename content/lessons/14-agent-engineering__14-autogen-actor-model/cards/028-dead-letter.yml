- concept: ожидаемое наполнение dead-letter равно частоте сбоя обработчика, умноженной на число доставленных сообщений
  question: Обработчик актора падает с вероятностью 1 из 8 независимо на каждом сообщении, и каждый такой сбой рантайм откладывает в dead-letter. Сколько писем в среднем окажется в dead-letter после прогона из 240 сообщений?
  explanation: 'Ожидание равно p·N = (1/8)·240 = 30. Это среднее по многим прогонам: в одном конкретном прогоне будет 26 или 34, потому что частота сбоя задаёт вероятность, а не расписание. Оценка нужна, чтобы понимать, справится ли человек с разбором очереди.'
  kind: numeric
  answer: 30
  tolerance: 1
  id: 028-dead-letter-1
  fingerprint: f91424e9
- concept: запись dead-letter должна нести исходное сообщение, адрес получателя и причину сбоя — иначе повторная отправка и диагностика невозможны
  question: Актор кладёт упавшее сообщение в dead-letter, сохраняя только текст исключения. Что делает такую запись бесполезной для последующего разбора?
  explanation: 'Dead-letter — карантин, а не лог ошибок. Разбор требует трёх вещей: исходного сообщения (что обрабатывали), адреса получателя (куда возвращать) и причины сбоя (что чинить). Без первых двух остаётся только знание, что где-то что-то упало. Цикл диспетчеризации при этом продолжает работать в любом случае — полнота записи на него не влияет.'
  kind: choice
  options:
    - Потеряны сама полезная нагрузка и имя получателя, поэтому нельзя ни воспроизвести сбой, ни повторить доставку после починки
    - Текст исключения занимает слишком много места в очереди
    - Рантайм не сможет продолжить разбор остальной очереди без полной записи
    - Отправитель не получит исключение обратно в свой вызов send
