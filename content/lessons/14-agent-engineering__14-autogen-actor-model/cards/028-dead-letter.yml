- concept: dead-letter выводит отравленное сообщение из автоматического цикла доставки, чтобы оно не падало повторно бесконечно
  question: Почему упавшее сообщение кладут в отдельную очередь, а не возвращают автоматически в ящик того же получателя?
  explanation: 'Ключевое различие — сбой временный или детерминированный. Слепой автоповтор лечит первое и превращает второе в бесконечный цикл. Dead-letter ставит границу: конечное число попыток, дальше карантин и человеческое решение.'
  kind: open
  reference: 'Если причина сбоя в самом сообщении (битые данные, неподдерживаемый формат), то повторная доставка тому же обработчику даст тот же сбой — получится бесконечный цикл, который жжёт ресурсы и забивает очередь, мешая обработке исправных писем. Dead-letter выводит такое отравленное сообщение из автоматического потока и передаёт решение наружу: человек или отдельный процесс решает, исправить данные и повторить, починить обработчик и повторить, либо признать сообщение непригодным. Автоматический повтор уместен для временных сбоев (недоступный внешний сервис), но его нужно ограничивать числом попыток, после чего сообщение всё равно уходит в dead-letter.'
  id: 028-dead-letter-3
