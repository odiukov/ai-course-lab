- concept: 'фаза, в которой возникла ошибка, определяет её наблюдаемость: сбой до попадания сообщения в ящик виден вызывающему коду, сбой после — только рантайму'
  question: Какой признак разделяет ошибки, о которых узнаёт вызывающий отправку код, и ошибки, о которых узнаёт только рантайм?
  explanation: Неразрешимый адрес получателя обнаруживается ещё в фазе доставки, пока вызов отправки не вернулся, — такая ошибка доступна вызывающему коду. Как только письмо легло в ящик, доставка считается состоявшейся, и любое последующее падение принадлежит фазе обработки и достаётся рантайму.
  kind: choice
  options:
    - 'Успело ли сообщение попасть в ящик получателя: всё до этого — доставка, всё после — обработка'
    - 'Тип исключения: системные ошибки видит отправитель, прикладные — рантайм'
    - Находится ли получатель в том же процессе, что и отправитель
    - Успел ли обработчик изменить состояние актора до падения
