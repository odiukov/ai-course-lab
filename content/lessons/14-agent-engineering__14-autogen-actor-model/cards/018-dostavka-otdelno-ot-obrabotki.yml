- concept: перехват вокруг вызова обработчика передаёт рантайму право выбора политики реакции на сбой
  question: Обработчик актора бросил исключение, и рантайм его перехватил. Какие варианты действий есть у рантайма дальше и почему решение принимает именно он, а не отправитель?
  explanation: Перехват — не деталь реализации, а точка принятия решения. Именно потому, что он принадлежит рантайму, политику реакции (лог, повтор, dead-letter) настраивают на уровне рантайма, а не пишут в коде каждого отправителя.
  kind: open
  reference: Рантайм может записать сбой в лог, повторить обработку того же сообщения или переложить его в отдельное хранилище неразобранных сообщений (dead-letter). Выбор за рантаймом, потому что перехват стоит вокруг вызова обработчика в цикле разбора ящика — только там исключение существует как объект. Отправитель к этому моменту давно продолжил работу, ссылки на сообщение у него нет, и вернуть ему ошибку как исключение невозможно; узнать о сбое он может только через явный ответ, таймаут или супервизора.
