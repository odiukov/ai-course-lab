- concept: вложенность span требует, чтобы жизнь дочернего span целиком лежала внутри родительского вызова; при асинхронной доставке это условие не выполняется, поэтому трасса акторов плоская
  question: 'В синхронном коде трассировка строится вложенно: span вызываемой функции лежит внутри span вызывающей. В акторном рантайме трасса вместо этого получается плоской — по одному span на сообщение. Почему вложенная структура здесь структурно не подходит?'
  explanation: 'Вложенность — это отношение включения по времени жизни: родитель обязан жить, пока живёт ребёнок. Отправка возвращается сразу, её span закрывается раньше, чем получатель начал работу, а сообщение может ждать в ящике и обрабатываться параллельно с другими. Связь восстанавливается не вложенностью, а контекстом трассировки и адресами: кто отправил, кто получил, когда.'
  kind: choice
  options:
    - Обработка у получателя стартует уже после того, как кадр отправителя завершён, поэтому нет объемлющего вызова, внутрь которого можно было бы поместить span получателя
    - OpenTelemetry не умеет создавать дочерние span в асинхронном коде, поэтому приходится писать их подряд
    - Рантайм экономит память и не хранит родительские ссылки между span
    - Span на самом деле вложены, просто интерфейс просмотра трасс рисует их в один столбец
  correct: 0
  id: 031-observability-ploskaya-trassa-1
  fingerprint: a26289bb
- concept: span сообщения покрывает и ожидание в ящике, и работу обработчика, поэтому их разность даёт время ожидания в очереди
  question: Span одного сообщения длится 7.6 с от постановки в ящик получателя до завершения обработки. Внутри span записано, что обработчик выполнялся 2.4 с. Сколько секунд сообщение пролежало в очереди?
  explanation: '7.6 − 2.4 = 5.2 с. Именно поэтому span выдают на каждое сообщение: длительность распадается на ожидание в ящике и полезную работу. Большое ожидание при коротком обработчике означает перегруженную очередь, а не медленного агента — лечится масштабированием получателя, а не оптимизацией его кода.'
  kind: numeric
  answer: 5.2
  tolerance: 0.05
  id: 031-observability-ploskaya-trassa-2
  fingerprint: bc6cca10
- concept: вызовы модели и инструментов размечаются атрибутами пространства имён gen_ai.* по семантическим конвенциям OTel GenAI
  question: Актор внутри обработчика вызывает LLM. Каким префиксом по семантическим конвенциям OpenTelemetry GenAI помечаются атрибуты этого вызова в span?
  explanation: 'Конвенции OTel GenAI резервируют пространство имён gen_ai.* (gen_ai.request.model, gen_ai.usage.input_tokens и т.д.). Общий префикс даёт единый разбор трасс разными бэкендами: цена и токены агрегируются без парсинга кастомных ключей конкретного фреймворка.'
  kind: cloze
  template: span.set_attribute("___.request.model", "claude-opus-5")
  answer: gen_ai
  accept:
    - gen_ai
    - gen_ai.
    - '"gen_ai"'
  id: 031-observability-ploskaya-trassa-3
  fingerprint: 5fb7a40d
