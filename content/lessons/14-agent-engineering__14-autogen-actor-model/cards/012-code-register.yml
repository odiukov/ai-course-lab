- concept: регистрация записывает пару имя-актор в реестр, принадлежащий самому рантайму, а не в локальную структуру
  question: Дополни регистрацию актора так, чтобы запись попала в реестр переданного рантайма.
  explanation: Реестр — часть состояния рантайма. Если создать внутри функции свой словарь и писать в него, запись умрёт вместе с вызовом, и последующая доставка не найдёт получателя.
  kind: cloze
  template: |-
    def register(runtime, name, actor):
        if name in runtime["registry"]:
            raise KeyError(name)
        ___["registry"][name] = actor
  answer: runtime
  accept:
    - runtime
    - runtime["registry"][name] = actor
  id: 012-code-register-1
  fingerprint: 3609d7cb
- concept: регистрация только связывает имя с объектом и не запускает обработку сообщений
  question: В акторном рантайме объект актора зарегистрирован под именем `planner`. Ни одного сообщения на этот адрес ещё не отправлено. Что произойдёт сразу после регистрации?
  explanation: Регистрация — операция над таблицей адресов, а не над жизненным циклом актора. Обработчик вызывается только тогда, когда рантайм достаёт из очереди сообщение с этим получателем. Состояние остаётся внутри актора, реестр хранит лишь ссылку на объект.
  kind: choice
  options:
    - Рантайм один раз вызовет `receive` актора, чтобы тот проинициализировал состояние
    - Ничего, кроме появления пары имя-объект в реестре; `receive` вызовется только при доставке сообщения
    - Рантайм запустит для актора отдельный цикл, который будет крутиться вхолостую до первого сообщения
    - Рантайм скопирует состояние актора в реестр, чтобы читать его без вызова обработчика
  correct: 1
  id: 012-code-register-2
  fingerprint: b8208df8
- concept: запись в реестр должна пережить вызов регистрирующей функции, иначе адресация ломается
  question: Разработчик написал функцию регистрации так, что она заводит внутри себя новый пустой словарь, кладёт туда пару имя-актор и завершается. Объясни своими словами, почему после трёх таких вызовов рантайм не сможет доставить ни одного сообщения.
  explanation: Ключевое различие — владелец состояния. Пара имя-актор нужна не в момент регистрации, а позже, при разборе очереди, поэтому она обязана лежать в долгоживущем состоянии рантайма.
  kind: open
  reference: Локальный словарь существует только на время вызова и после возврата уничтожается — рантайм его никогда не видит. Реестр рантайма при этом остаётся пустым. Доставка устроена как поиск получателя по имени в реестре рантайма, поэтому все три имени останутся неразрешимыми, и любое сообщение упрётся в ошибку неизвестного адресата. Регистрация обязана мутировать ту самую структуру, которую рантайм читает при доставке.
  id: 012-code-register-3
  fingerprint: 1b510e27
