- concept: знаменатель доли dead-letter — все отправленные сообщения, а не только неудавшиеся или только успешные
  question: 'За прогон отправлено 400 сообщений: 376 обработаны успешно, 24 осели в dead-letter. Какую долю сбоев в процентах должен показать отчёт?'
  explanation: 'Доля считается от общего числа отправленных: 24/400 = 0.06, то есть 6%. Частая ошибка — взять знаменателем 376 (только успешные), получится 6.38% — метрика перестаёт быть долей от потока и её нельзя сравнивать между прогонами с разной долей сбоев.'
  kind: numeric
  answer: 6
