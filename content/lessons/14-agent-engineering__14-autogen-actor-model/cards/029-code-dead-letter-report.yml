- concept: 'отчёт по dead-letter — операция чтения: диагностика отделена от политики восстановления, поэтому записи не изымаются и не переотправляются'
  question: Почему функция, строящая отчёт по очереди dead-letter, не должна изымать записи из очереди и не должна переотправлять их получателям? Объясни своими словами и назови инвариант, которым это проверяется.
  explanation: 'Диагностика — чистое чтение, восстановление — изменение состояния. Разделение даёт повторяемость отчёта и позволяет выбирать политику повтора отдельно для временных и устойчиво воспроизводимых сбоев. Проверка простая: сравнить количество записей до и после вызова.'
  kind: open
  reference: 'Отчёт отвечает только на вопрос «что сломалось и как часто». Решение о судьбе записи — переотправить, отбросить или отдать человеку — это отдельная политика: сбой мог быть временным (тогда повтор поможет) или воспроизводимым (тогда повтор снова уронит обработчик). Смешивать сбор статистики с восстановлением опасно: любой просмотр отчёта менял бы состояние системы, два запуска отчёта дали бы разные цифры, а параллельный читатель увидел бы пустую очередь. Инвариант: размер очереди dead-letter до вызова отчёта и после него совпадает, а суммы в отчёте соответствуют фактическому содержимому очереди на момент чтения.'
