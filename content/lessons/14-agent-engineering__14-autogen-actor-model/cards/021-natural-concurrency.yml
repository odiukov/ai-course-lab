- concept: при ограничении на число одновременных запросов время группы равно числу волн, умноженному на латентность одной задачи
  question: Семь независимых агентов отправляют по одному запросу к модели, каждый ответ приходит через 6 секунд. Провайдер обслуживает не более 3 запросов одновременно, остальные ждут в очереди. Сколько примерно секунд займёт вся группа?
  explanation: Ящики позволяют отправить все семь сразу, но одновременно исполняются только 3. Получается ceil(7/3) = 3 волны по 6 секунд = 18 секунд. Идеальные 6 секунд достижимы, только если инфраструктура тянет все семь запросов параллельно; иначе конкурентность упирается в лимит внешнего ресурса.
  kind: numeric
  answer: 18
  tolerance: 0.5
  id: 021-natural-concurrency-1
  fingerprint: 4a09251e
- concept: конкурентность сокращает общее время группы, но не латентность отдельного запроса
  question: Группа независимых агентов, каждый из которых ждёт ответа модели, стала обрабатываться конкурентно вместо последовательного запуска. Что изменилось?
  explanation: Конкурентность влияет на общее время завершения группы (makespan), а не на латентность одной операции. Ответ модели как шёл 6 секунд, так и идёт; выигрыш в том, что интервалы ожидания накладываются друг на друга, а не выстраиваются в цепочку.
  kind: choice
  options:
    - Каждый отдельный запрос к модели стал возвращаться быстрее
    - Латентность одного запроса осталась прежней, исчезло ожидание одного агента, пока работают другие
    - Модель начала обрабатывать несколько промптов за один проход, поэтому суммарная работа уменьшилась
    - Рантайм разбивает каждый запрос на части и считает их параллельно
  correct: 1
  id: 021-natural-concurrency-2
  fingerprint: cbd8071d
- concept: 'выигрыш от конкурентности требует независимости задач: зависимость по данным восстанавливает последовательное время'
  question: Три агента вызывают модель, каждый вызов длится 6 секунд, но агент B принимает на вход результат A, а C — результат B. Отправка через ящики асинхронна. Сколько времени займёт цепочка и почему конкурентность здесь не помогает?
  explanation: 'Ящики убирают лишнее ожидание между независимыми работами, но не могут убрать ожидание, продиктованное зависимостью по данным. Оценивая выигрыш, смотри на критический путь: сумма по цепочке зависимостей, а не по всем задачам.'
  kind: open
  reference: 'Около 18 секунд — столько же, сколько при синхронном запуске. Асинхронная отправка развязывает отправителя, но B физически не может начать работу, пока не получит сообщение с результатом A: сообщение появится в его ящике только через 6 секунд. Конкурентность ускоряет группу лишь тогда, когда задачи независимы и могут находиться «в полёте» одновременно; зависимость по данным задаёт критический путь, длина которого и есть нижняя граница времени.'
  id: 021-natural-concurrency-3
  fingerprint: ab27b5a6
