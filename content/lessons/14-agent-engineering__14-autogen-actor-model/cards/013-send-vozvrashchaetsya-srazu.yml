- concept: успешный возврат send означает только приём сообщения в ящик получателя, а не завершение его обработки
  question: Актор вызывает send и получает управление обратно без ошибки. Что именно гарантирует этот успешный возврат?
  explanation: 'Отправка развязана с обработкой: send кладёт письмо в ящик и возвращается. Ни факт обработки, ни её успех из возврата не следуют — про результат отправитель узнаёт отдельным событием. Поэтому «отправлено» нельзя читать как «сделано».'
  kind: choice
  options:
    - Получатель уже обработал сообщение и подготовил результат
    - Сообщение принято в очередь доставки получателю; обработка произойдёт позже
    - Получатель жив и его обработчик не упадёт на этом сообщении
    - Все ранее отправленные этому получателю сообщения уже обработаны
  correct: 1
  id: 013-send-vozvrashchaetsya-srazu-1
  fingerprint: 697a7158
- concept: длительность самого вызова send определяется стоимостью постановки в ящик, а не временем работы получателя
  question: Актор в цикле делает 6 вызовов send разным получателям. Постановка одного сообщения в ящик стоит примерно 1 мс, каждому получателю нужно 3 секунды на ответ модели. Сколько примерно миллисекунд займёт весь цикл отправки у отправителя?
  explanation: 'Отправитель платит только за постановку в ящик: 6 × 1 мс ≈ 6 мс. Трёхсекундная работа получателей в это время не входит — она начнётся и пойдёт независимо. Если бы цикл занял ~18 секунд, это означало бы синхронный вызов вместо доставки через ящик.'
  kind: numeric
  answer: 6
  tolerance: 1
