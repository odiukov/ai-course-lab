- concept: 'выигрыши даёт слой доставки, а не переписанная логика агента: тот же код обработчика получает их от рантайма'
  question: 'Логику агентов не меняли: те же обработчики, те же промпты. Поменяли только то, кто доставляет сообщения — с прямого вызова на рантайм с ящиками. Объясни, почему изоляция сбоев, конкурентность и готовность к распределению — свойства слоя доставки, а не кода агента.'
  explanation: 'Диагностический вывод: если нужного свойства нет — искать причину в конфигурации рантайма (параллелизм, политика сбоев, транспорт), а не в коде агента. И наоборот: переписывание обработчика само по себе этих свойств не добавит.'
  kind: open
  reference: 'Обработчик агента как принимал сообщение и возвращал эффекты, так и принимает. Всё, что изменилось, лежит между отправителем и обработчиком: рантайм кладёт сообщение в ящик и возвращает управление, сам вызывает обработчик и оборачивает этот вызов перехватом (отсюда изоляция и право выбора политики — лог, повтор, dead-letter), сам решает, сколько обработчиков крутить одновременно (отсюда перекрытие ожиданий), сам выбирает транспорт до ящика — локальный или сетевой (отсюда переносимость актора в другой процесс или на другую машину). Ни одно из трёх свойств не выражено в теле агента, поэтому их получают без правки прикладного кода.'
