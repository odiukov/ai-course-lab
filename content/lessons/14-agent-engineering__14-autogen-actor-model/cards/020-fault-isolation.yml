- concept: dead-letter — место для сообщений, которые рантайм не смог обработать, чтобы очередь получателя не блокировалась и сообщение не терялось молча
  question: Обработчик актора-получателя раз за разом падает на одном и том же сообщении, и политика повторов исчерпана. Что даёт перенос этого сообщения в dead-letter?
  explanation: 'Dead-letter — это карантин, а не откат и не уведомление. Проблемное сообщение уходит из очереди (иначе оно блокировало бы всё, что за ним), но не исчезает: его можно прочитать, разобрать причину и переиграть. Отправителю при этом ничего не прилетает — send давно вернулся, и канала для исключения нет.'
  kind: choice
  options:
    - Сообщение сохраняется в отдельном месте для разбора, а ящик получателя освобождается для следующих сообщений
    - Сообщение возвращается отправителю как результат его вызова send
    - Актор-получатель перезапускается с чистым состоянием, а сообщение удаляется
    - Рантайм останавливает доставку всем акторам до ручного вмешательства
  correct: 0
  id: 020-fault-isolation-1
  fingerprint: 13bd5d87
- concept: повтор доставки возможен потому, что сообщение — сохранённые рантаймом данные, а не кадр стека упавшего вызова
  question: Почему после падения обработчика рантайм акторов способен повторить именно ту же операцию, а обычный синхронный вызов, упавший с исключением, повторить куда труднее?
  explanation: 'Повторяемость — следствие овеществления запроса: то, что раньше было параметрами вызова, стало сообщением, которое лежит у рантайма и переживает сбой обработчика. Отсюда и возможность политик «лог / retry / dead-letter». Заметь, чего это не даёт: ни идемпотентности обработчика, ни отката его состояния — если B успел частично изменить себя до исключения, повтор увидит уже изменённое состояние.'
  kind: choice
  options:
    - Потому что сообщение — самостоятельный объект данных, хранимый рантаймом, и его можно подать в обработчик снова; у синхронного вызова аргументы жили в раскрученном кадре стека
    - Потому что асинхронные обработчики по определению идемпотентны
    - Потому что рантайм откатывает состояние актора к моменту до сбоя
    - Потому что исключение в акторной модели не прерывает выполнение обработчика
  correct: 0
  id: 020-fault-isolation-2
  fingerprint: 33aa2a20
- concept: цикл диспетчеризации переживает сбой обработчика и продолжает разбирать очередь — без этого изоляция была бы фикцией
  question: Расставь действия рантайма по порядку для случая, когда обработчик падает на сообщении, а следом в ящике ждут другие сообщения.
  explanation: 'Ключевой пункт — последний: цикл не раскручивается вместе с упавшим обработчиком. Если бы исключение вылетело в диспетчер, встал бы весь рантайм, и никакой изоляции бы не было. Перехват стоит ровно на границе обработчика, поэтому область поражения — одно сообщение одного актора, а остальная очередь и остальные акторы движутся дальше.'
  kind: order
  items:
    - Извлечь очередное сообщение из ящика актора
    - Вызвать обработчик актора внутри перехвата ошибок
    - Поймать исключение обработчика, не выпуская его в цикл диспетчеризации
    - Применить к сбойному сообщению выбранную политику (журнал, повтор, dead-letter)
    - Вернуться к ящику и взять следующее сообщение
  id: 020-fault-isolation-3
  fingerprint: 55f11dfb
