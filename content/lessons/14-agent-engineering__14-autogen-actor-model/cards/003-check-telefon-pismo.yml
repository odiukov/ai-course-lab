- concept: отправитель не узнаёт о сбое получателя из исключения — нужен явный ответ, таймаут или супервизор
  question: Актор A отправил сообщение актору B. Обработчик B упал. Объясни своими словами, почему A не может узнать об этом из try/except вокруг отправки, и какими средствами A вообще способен обнаружить проблему.
  explanation: 'Ключ в том, что «доставлено» и «обработано» — разные события, разнесённые во времени. Отсутствие исключения у отправителя — не признак успеха, а следствие того, что канал обратной связи по умолчанию отсутствует: его надо строить сообщениями, таймаутами или супервизией.'
  kind: open
  reference: 'Отправка кладёт сообщение в ящик B и сразу возвращает управление — на этот момент обработчик ещё не запускался, поэтому у try/except вокруг отправки нет исключения, чтобы его поймать. Обработка идёт в другом контексте выполнения, стек не общий, исключение остаётся внутри B и гасится рантаймом. Значит, узнать о проблеме A может только явными средствами: ждать ответное сообщение с результатом или ошибкой, поставить таймаут на такой ответ, подписаться на события/dead-letter от рантайма или отдать надзор супервизору, который перезапускает B и решает про повтор.'
  id: 003-check-telefon-pismo-2
