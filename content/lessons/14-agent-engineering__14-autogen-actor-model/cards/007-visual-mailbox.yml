- concept: порядок сообщений гарантирован только попарно отправитель-получатель, глобального порядка между разными отправителями нет
  question: Три актора независимо отправляют сообщения в ящик одного актора-логгера. Какие гарантии порядка обработки есть у логгера, а какие отсутствуют?
  explanation: 'Ящик — очередь, а не глобальные часы. Пара «отправитель-получатель» упорядочена, три параллельных отправителя — нет. Отсюда практическое следствие: любые выводы вида «B случилось после A» между разными акторами требуют данных в самих сообщениях, а не веры в порядок очереди.'
  kind: open
  reference: 'Гарантия попарная: сообщения от одного и того же отправителя попадают в ящик и обрабатываются в том порядке, в каком он их отправил. Глобального порядка между тремя отправителями нет — их сообщения могут перемешаться в ящике как угодно, потому что отправка асинхронна и время доставки не согласовано между акторами. Значит, восстанавливать общую последовательность событий по порядку в ящике нельзя: нужны явные метки (логические часы, порядковые номера, идентификатор отправителя) или один актор-сериализатор, через которого проходят все события.'
  id: 007-visual-mailbox-2
  fingerprint: 74ac1677
