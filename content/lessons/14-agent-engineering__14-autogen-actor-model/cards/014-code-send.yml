- concept: 'ящик получателя принадлежит рантайму: отправитель кладёт в него, но не читает и не разбирает'
  question: 'Разработчик хочет ускорить систему: после помещения сообщения в ящик получателя отправитель заглядывает в этот ящик и, если очередь длиннее 9 элементов, сам достаёт оттуда пару писем и обрабатывает их. Объясни, что здесь нарушено.'
  explanation: Граница «пишу в ящик — не читаю из ящика» и есть то, что делает актора инкапсулированным. Как только отправитель начинает разбирать чужую очередь, он возвращает синхронный вызов через чёрный ход и одновременно ломает единоличное владение состоянием получателя.
  kind: open
  reference: 'Ящик — часть получателя, управляемая рантаймом; для отправителя он доступен только на запись (постановка сообщения). Чтение и разбор очереди — исключительная работа рантайма и обработчика самого получателя. Если отправитель разбирает чужую очередь, он: (1) снова блокируется на время чужой обработки, теряя развязку отправки и обработки; (2) исполняет обработчик получателя вне его контекста, то есть трогает чужое состояние без единственного владельца, что ломает гарантию «одно сообщение за раз» и открывает гонки; (3) делает код непереносимым в распределённый режим — у удалённого актора ящика в этом процессе просто нет. Правильный способ разгрузить очередь — политика рантайма (больше воркеров, шардирование, несколько экземпляров получателя), а не вмешательство отправителя.'
  id: 014-code-send-2
  fingerprint: e9d5d642
