- concept: асинхронная отправка развязывает прогресс отправителя со скоростью и доступностью получателя, чего try/except не даёт
  question: Разработчик обернул синхронный вызов другого агента в try/except и считает, что получил те же гарантии, что даёт акторная модель. Объясни своими словами, что именно try/except здесь не покрывает.
  explanation: Ключевое различие — не «поймали ошибку или нет», а блокировка. try/except решает вопрос распространения исключения внутри одного стека; акторная модель убирает сам общий стек и ожидание, поэтому её свойства (изоляция сбоя, конкурентность, распределённость) вытекают из отделения доставки от обработки.
  kind: open
  reference: 'try/except перехватывает исключение получателя, но не убирает связанность по времени и по стеку. Пока вызов не вернулся, отправитель стоит на этой строчке: медленный получатель отнимает у отправителя ровно столько же времени, сколько думает сам. Если получатель завис, перезапустился или недоступен по сети, отправитель ждёт ответа, которого не будет, — исключения может не прийти вовсе, спасает только таймаут. Оба агента живут в одном стеке вызовов, поэтому обработка сбоя — часть кода отправителя. В акторной модели отправка кладёт сообщение в приватный ящик получателя и сразу возвращает управление: рантайм отвечает за доставку, получатель — за разбор, а падение обработчика остаётся внутри получателя, потому что его стека у отправителя нет.'
  id: 002-otvet-aktornaya-model-3
  fingerprint: 7729d214
