- concept: синхронный вызов сериализует обработку, акторный рантайм обрабатывает независимые сообщения параллельно
  question: 'Координатор раздаёт задачи 5 исполнителям; обработка каждой задачи занимает 7 секунд и не зависит от остальных. Координатор написан синхронно: вызывает исполнителя и ждёт возврата, потом следующего. Сколько секунд займёт весь круг?'
  explanation: Синхронный вызов держит координатора на строчке до возврата, поэтому 5 × 7 = 35 секунд. В акторном рантайме отправка возвращает управление сразу, пять сообщений лежат в пяти приватных ящиках и разбираются одновременно — круг занимает около 7 секунд. Конкурентность здесь не оптимизация, а следствие того, что доставка отделена от обработки.
  kind: numeric
  answer: 35
  tolerance: 0.1
  id: 002-otvet-aktornaya-model-1
  fingerprint: '949695e8'
- concept: 'прозрачность размещения: смена локальный/распределённый транспорт не меняет код отправителя'
  question: Агент-отправитель работал в одном процессе с получателем. Получателя вынесли на отдельную машину и рантайм переключили на сетевой транспорт. Что должно измениться в коде отправителя?
  explanation: В акторной модели адресат — это идентификатор, а не ссылка на объект в стеке. Единственный способ взаимодействия — сообщение, поэтому распределённость сводится к выбору транспорта внутри рантайма. Ручная сериализация и HTTP — как раз то, что рантайм берёт на себя; разделяемая память запрещена самой моделью.
  kind: choice
  options:
    - 'Ничего: он по-прежнему отправляет сообщение по идентификатору агента, а как оно доедет — забота рантайма'
    - Нужно заменить прямой вызов метода получателя на HTTP-клиент и сериализацию вручную
    - Нужно добавить блокирующее ожидание ответа, потому что по сети доставка не гарантируется
    - Нужно вынести общий объект состояния в разделяемую память между процессами
