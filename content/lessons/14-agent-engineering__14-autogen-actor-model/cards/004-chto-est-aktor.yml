- concept: набор эффектов обработчика замкнут и не включает прямой доступ к состоянию другого актора
  question: Обработчик актора описывают как `receive(message) -> effects`. Что НЕ входит в допустимый набор эффектов?
  explanation: 'Эффектов пять: ответить, отправить другому актору, породить нового актора, обновить своё состояние, остановиться. Чтения чужого состояния среди них нет — два актора не делят память, узнать чужое значение можно только сообщением и ответом на него.'
  kind: choice
  options:
    - Отправить сообщение другому актору
    - Породить нового актора
    - Прочитать поле состояния соседнего актора напрямую
    - Остановиться
  correct: 2
  id: 004-chto-est-aktor-1
  fingerprint: 429e1945
- concept: решение о новом значении состояния принимает только обработчик; ящик и состояние пассивны
  question: Актор зала хранит 30 свободных мест. Приходит сообщение «забронировать 7». Какая часть актора проверит, хватает ли мест, и определит новый остаток?
  explanation: 'Роли разделены: ящик только копит и упорядочивает, состояние только хранит, отправитель вообще не имеет доступа к чужим данным. Логика «хватает ли 30 мест на 7» живёт в обработчике, и он возвращает эффект обновления состояния.'
  kind: choice
  options:
    - 'Ящик входящих: он упорядочивает сообщения и заодно применяет их'
    - 'Состояние: оно само пересчитывает себя при получении сообщения'
    - 'Обработчик: он смотрит на текущее состояние и определяет результат'
    - 'Отправитель: он записывает новое значение прямо в состояние получателя'
  correct: 2
  id: 004-chto-est-aktor-2
  fingerprint: 395e4139
- concept: 'обработка идёт по одному сообщению за раз: очередь, затем обработчик со чтением состояния, затем применение эффектов'
  question: Расставьте шаги обработки одного сообщения актором в правильном порядке.
  explanation: 'Порядок и означает изоляцию: пока одно сообщение обрабатывается, второе ждёт в ящике, поэтому два почти одновременных запроса не сталкиваются внутри состояния и остаток всегда однозначен.'
  kind: order
  items:
    - Сообщение кладётся в ящик входящих и ждёт своей очереди
    - Обработчик забирает из ящика ровно одно сообщение
    - Обработчик читает текущее приватное состояние актора
    - 'Обработчик возвращает эффекты: обновление состояния, ответ или отправку другому актору'
    - Актор берётся за следующее сообщение из ящика
  id: 004-chto-est-aktor-3
  fingerprint: 0e69d658
