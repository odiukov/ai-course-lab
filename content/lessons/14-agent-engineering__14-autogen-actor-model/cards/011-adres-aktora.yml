- concept: доставка идёт через разрешение имени получателя в реестре до попадания сообщения в ящик
  question: Расставь шаги, которые рантайм выполняет, чтобы доставить сообщение адресату.
  explanation: Отправитель указывает только имя. Рантайм разрешает имя через реестр в конкретного актора и его ящик, и лишь затем кладёт посылку. Если записи с таким именем нет — например, из-за опечатки — доставка обрывается на шаге поиска, даже если нужный актор запущен.
  kind: order
  items:
    - Прочитать поле `recipient` из принятого сообщения
    - Найти в реестре запись с таким именем
    - Получить ящик связанного с записью актора
    - Положить сообщение в этот ящик
