- concept: маршрутизация идёт по зарегистрированному имени, а не по классу актора
  question: В рантайме подняты три экземпляра одного класса `WorkerAgent`. Объясни своими словами, почему рантайм маршрутизирует сообщения по зарегистрированному имени актора, а не по его классу.
  explanation: 'Три `WorkerAgent` — три разных адресата, и класс их не различает. Имя работает как адрес доставки: уникальный ключ реестра, по которому рантайм находит нужный ящик. Побочный эффект — отправитель не держит чужой объект и не знает, где получатель выполняется.'
  kind: open
  reference: 'Класс не идентифицирует получателя: экземпляров одного класса может быть много, и имя класса не обязано совпадать с тем, что стоит в поле `recipient`. Имя же — уникальный ключ в реестре, связанный с одним конкретным актором и его ящиком, поэтому по нему адрес разрешается однозначно. Дополнительно это развязывает отправителя и получателя: отправителю не нужна ссылка на объект получателя, достаточно устойчивого имени, а поиск конкретного ящика берёт на себя рантайм.'
