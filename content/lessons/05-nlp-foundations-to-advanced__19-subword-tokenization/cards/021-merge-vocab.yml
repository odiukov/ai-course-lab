- concept: слияния BPE обрабатывают совпадения слева направо без повторного использования уже поглощённых токенов
  question: Выбрана пара ("x", "y"). Какой кортеж получится из ("x", "y", "x", "y", "x") после одного прохода слияния BPE?
  explanation: После совпадения сканер добавляет объединённый токен и пропускает оба поглощённых элемента. Поэтому обе непересекающиеся пары превращаются в "xy", а последний "x" остаётся без изменений.
  kind: choice
  options:
    - ("xy", "x", "y", "x")
    - ("xy", "xy", "x")
    - ("x", "y", "xy", "x")
    - ("xyx", "yx")
  correct: 1
  id: 021-merge-vocab-1
  fingerprint: fa4d6a9a
- concept: частоты необходимо суммировать при коллизии преобразованных ключей словаря
  question: Две разные записи взвешенного словаря после слияния BPE превратились в один и тот же кортеж токенов. Как должна поступить функция со значениями частоты и почему?
  explanation: 'Слияние может быть отображением «многие к одному»: разные старые ключи способны дать одинаковую последовательность токенов. Накопление частот сохраняет полное число появлений соответствующих словоформ в корпусе.'
  kind: open
  reference: Она должна сложить частоты исходных записей и сохранить сумму под общим преобразованным ключом, иначе присваивание для одной записи затрёт вклад другой и исказит статистику корпуса.
  id: 021-merge-vocab-2
  fingerprint: c9f83ea4
