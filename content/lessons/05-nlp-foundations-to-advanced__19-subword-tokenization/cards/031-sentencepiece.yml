- concept: маркер ▁ кодирует предшествующий пробел и отличает начало слова от такого же фрагмента внутри слова
  question: В словаре SentencePiece присутствуют токены `▁лес` и `лес`. Какое различие между ними закодировано?
  explanation: SentencePiece заменяет пробел заметным маркером `▁`, который становится частью токена. Поэтому одинаковая последовательность букв может иметь разные представления в начале слова и внутри него; при декодировании маркер снова превращается в пробел.
  kind: choice
  options:
    - '`▁лес` обычно соответствует фрагменту после пробела, а `лес` может находиться внутри более длинной последовательности'
    - '`▁лес` записан в нижнем регистре, а `лес` — в верхнем'
    - '`▁лес` является неизвестным токеном, а `лес` — известным'
    - '`▁лес` обязательно обозначает целое слово, а `лес` — отдельный символ'
  correct: 0
  id: 031-sentencepiece-1
  fingerprint: 0744007e
- concept: обучение SentencePiece на сыром Unicode исключает обязательную внешнюю пре-токенизацию, но не настроенную нормализацию
  question: Объясните своими словами, почему обучение SentencePiece на сыром Unicode не означает сохранение входной строки без каких-либо преобразований.
  explanation: В показанной конфигурации используется нормализация `nmt_nfkc`. Она может привести разные Unicode-представления к общей форме ещё до сегментации, хотя отдельный внешний токенизатор слов SentencePiece не нужен.
  kind: open
  reference: SentencePiece не требует заранее делить строку на слова или отделять пунктуацию, однако перед обучением и кодированием может применять настроенное правило Unicode-нормализации, например NFKC. Поэтому «сырой» описывает отсутствие обязательной внешней пре-токенизации, а не побайтовую неизменность текста.
  id: 031-sentencepiece-2
  fingerprint: 452a7648
