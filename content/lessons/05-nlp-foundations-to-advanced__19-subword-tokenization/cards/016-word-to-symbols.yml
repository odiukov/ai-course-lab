- concept: кортеж из хешируемых элементов можно использовать как ключ словаря, а список нельзя
  question: Почему начальное представление слова для словаря BPE удобно хранить в кортеже, а не в списке?
  explanation: Ключ словаря должен иметь стабильный хеш. Кортеж строк удовлетворяет этому требованию, тогда как изменяемый список не хешируется и не может быть ключом.
  kind: choice
  options:
    - Кортеж неизменяем и хешируем, если хешируемы его элементы, поэтому подходит для ключа словаря
