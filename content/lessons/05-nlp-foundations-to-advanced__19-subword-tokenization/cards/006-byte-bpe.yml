- concept: частотные слияния сокращают распространённые последовательности, а редкие остаются более длинными, хотя обе кодируются
  question: Byte-level BPE встречает распространённую последовательность байтов и редкую последовательность, для которой почти нет выученных слияний. Какой результат наиболее вероятен?
  explanation: Базовые токены покрывают все байты, поэтому обе последовательности представимы без [UNK]. Выученные слияния чаще сокращают знакомые шаблоны, тогда как редкий ввод приходится раскладывать на более мелкие части.
  kind: choice
  options:
    - Редкая последовательность превратится в [UNK], а распространённая — нет
    - Обе последовательности обязательно получат одинаковое число токенов
    - Обе последовательности закодируются, но распространённая обычно потребует меньше токенов благодаря слияниям
  correct: 2
  id: 006-byte-bpe-1
  fingerprint: ab3c92d5
- concept: отсутствие OOV гарантирует представимость ввода, но не понимание его моделью
  question: Объясни своими словами, почему успешное кодирование произвольного ввода byte-level BPE без [UNK] ещё не означает, что языковая модель понимает этот ввод.
  explanation: Покрытие словаря и семантическая компетентность — разные свойства. Основание из всех возможных байтов устраняет OOV, но не добавляет модели обучающих примеров и знаний о значении текста.
  kind: open
  reference: Токенизатор гарантирует лишь возможность представить ввод последовательностью известных байтовых токенов. Знание смысла зависит от того, какие закономерности модель усвоила при обучении; редкая или бессмысленная последовательность может корректно токенизироваться, но оставаться непонятной модели.
  id: 006-byte-bpe-2
  fingerprint: 7523bf0c
