- concept: правило BPE сопоставляется с соседними токенами целиком, а не с символами внутри составного токена
  question: Текущая последовательность BPE-токенов равна ["ab", "c"]. Что произойдёт при применении правила слияния ("b", "c")?
  explanation: BPE-энкодер сравнивает правило с двумя соседними элементами текущего списка. Составной токен "ab" не разбирается обратно на символы, поэтому пара ("b", "c") здесь отсутствует.
  kind: choice
  options:
    - Получится ["a", "bc"], потому что b находится внутри первого токена
    - Получится ["ab", "bc"], потому что новый токен добавляется после исходных
    - Последовательность останется ["ab", "c"], потому что отдельного соседнего токена "b" в ней нет
