- concept: составные токены BPE образуют цепочку зависимостей, заданную порядком слияний
  question: Расположи действия BPE в порядке, позволяющем получить токен `cats` из базовых символов.
  explanation: 'Каждое составное слияние применимо лишь после появления его частей. Поэтому `cats` зависит от `cat`, а `cat` — от `ca`: список слияний задаёт иерархическую последовательность сборки.'
  kind: order
  items:
    - Представить строку как `c`, `a`, `t`, `s`
    - Применить слияние `c` + `a` → `ca`
    - Применить слияние `ca` + `t` → `cat`
    - Применить слияние `cat` + `s` → `cats`
  id: 004-bpe-hierarchy-1
  fingerprint: b406ee12
- concept: слияние BPE добавляет новый токен, не удаляя токены-компоненты
  question: При обучении BPE сначала выполнено слияние `r` + `e` → `re`, а затем `re` + `d` → `red`. Что происходит с более мелкими токенами?
  explanation: BPE расширяет словарь при каждом слиянии, а не заменяет старые элементы. Сохранённые компоненты позволяют кодировать строки, для которых более крупный токен собрать нельзя.
  kind: choice
  options:
    - '`r`, `e`, `re` и `d` остаются в словаре вместе с `red`'
    - Все компоненты удаляются, и остаётся только `red`
    - Остаются только `re` и `red`, а базовые символы удаляются
    - '`red` заменяет правило `r` + `e` → `re`'
  correct: 0
  id: 004-bpe-hierarchy-2
  fingerprint: ea2c7676
