- concept: среднее число токенов на слово вычисляется как отношение общего числа токенов к числу слов
  question: На отложенном корпусе токенизатор выдал 1400 токенов для 700 слов. Сколько токенов в среднем приходится на слово?
  explanation: 'Нужно разделить общее число токенов на число слов: 1400 / 700 = 2. Чем ниже это значение при сохранении текста, тем короче последовательности для модели.'
  kind: numeric
  answer: 2
  tolerance: 0.02
  id: 035-tokenizer-metrics-1
  fingerprint: bf59681c
- concept: компактность токенизации оценивают совместно с сохранностью исходного текста
  question: Токенизатор A даёт более короткие последовательности, но иногда создаёт OOV и не проходит точную проверку decode(encode(text)) == text. Токенизатор B выдаёт более длинные последовательности, зато имеет нулевой OOV на тестовом наборе и проходит round-trip. Какой вывод обоснован?
  explanation: Короткая последовательность полезна только при сохранении входа. OOV и провал round-trip означают потерю или изменение текста, поэтому преимущество A по длине пока не делает его лучшим.
  kind: choice
  options:
    - A однозначно лучше, потому что длина последовательности — главный показатель
    - B предпочтительнее, пока потеря данных у A не устранена
    - Оба равны по качеству, потому что длина и round-trip не связаны
    - A предпочтительнее, потому что OOV автоматически улучшает сжатие
  correct: 1
  id: 035-tokenizer-metrics-2
  fingerprint: a1f98710
- concept: коэффициент сжатия можно интерпретировать только при явно заданных числителе и знаменателе
  question: Объясни своими словами, почему нельзя сравнивать значения compression ratio из двух отчётов, если в них не указана формула метрики.
  explanation: Название compression ratio не задаёт направление деления. Без формулы одно и то же улучшение может уменьшать показатель в одном отчёте и увеличивать его в другом.
  kind: open
  reference: 'Один отчёт может считать tokens/bytes, а другой — bytes/token. Эти величины взаимно обратны: в первой меньшее значение означает более компактную токенизацию, во второй — большее. Для сравнения нужно знать единицы и привести отношения к одной формуле.'
  id: 035-tokenizer-metrics-3
  fingerprint: d95074f1
