- concept: поиск совпадений выделяет непрерывные последовательности латинских букв, используя остальные символы как границы
  question: Какая стратегия корректно извлекает из произвольной строки английские слова, игнорируя цифры и пунктуацию?
  explanation: '`re.findall(r"[a-zA-Z]+", text)` возвращает только непрерывные последовательности латинских букв. Пробелы, знаки, дефисы и цифры становятся границами. `split` сохраняет приклеенную пунктуацию, удаление знаков может ошибочно склеить соседние части, а `\w` также допускает цифры, подчёркивания и многие буквы Unicode.'
  kind: choice
  options:
    - Найти все совпадения шаблона `[a-zA-Z]+` с помощью `re.findall`
    - Разделить строку только по пробельным символам
    - Удалить всю пунктуацию, а затем разделить строку по пробелам
    - Найти все совпадения шаблона `\w+`
  correct: 0
  id: 014-pre-tokenize-1
  fingerprint: '91224448'
- concept: нормализация регистра до подсчёта объединяет варианты написания слова в один ключ
  question: Дополните выражение так, чтобы варианты одного английского слова в разных регистрах учитывались вместе.
  explanation: Нормализация выполняется до передачи слов в `Counter`, поэтому варианты вроде `Cat`, `cat` и `CAT` увеличивают частоту одного ключа. Для найденных ASCII-слов здесь подходят и `lower()`, и `casefold()`.
  kind: cloze
  template: Counter(word.___() for word in re.findall(r"[a-zA-Z]+", text))
  answer: lower
  accept:
    - lower
    - casefold
