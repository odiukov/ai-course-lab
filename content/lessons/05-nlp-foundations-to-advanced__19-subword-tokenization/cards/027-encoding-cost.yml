- concept: минимальный ранг правила сохраняет приоритет обученных BPE-слияний
  question: В текущей последовательности BPE сразу несколько соседних пар допускают слияние. Как выбрать следующую пару, чтобы результат совпал с последовательным применением списка merges?
  explanation: Ранг — это позиция правила в выученном списке merges. Минимальный ранг соответствует самому раннему применимому правилу, поэтому оптимизированный энкодер сохраняет результат наивного прохода по всему списку.
  kind: choice
  options:
    - Выбрать пару с минимальным рангом правила
    - Выбрать самую частую пару в текущем слове
    - Выбрать пару, образующую самый длинный токен
    - Выбрать самое левое совпадение независимо от ранга
  correct: 0
  id: 027-encoding-cost-1
  fingerprint: a77b42cf
- concept: после локального BPE-слияния обновляются только пары на границах нового токена
  question: Объясните, почему после одного BPE-слияния не нужно заново искать кандидатов во всей последовательности. Какие соседние пары требуется обновить?
  explanation: Локальное слияние меняет соседство только у границ нового токена. Благодаря этому приоритетная очередь обновляет несколько затронутых кандидатов, а не повторно просматривает всю последовательность и весь список правил.
  kind: open
  reference: Слияние заменяет два соседних токена одним, поэтому пары вдали от этой позиции не меняются. Нужно удалить кандидаты, содержавшие поглощённые токены, и проверить только пары нового токена с его левым и правым соседями.
  id: 027-encoding-cost-2
  fingerprint: 4fcecf4c
