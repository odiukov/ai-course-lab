- concept: выбор токенизатора зависит одновременно от характеристик корпуса и режима его использования
  question: 'Почему сведений о размере, языках и предметной области корпуса недостаточно, чтобы обоснованно выбрать алгоритм, библиотеку и словарь токенизатора? Объясни роль цели: обучение с нуля, дообучение или API-совместимый инференс.'
  explanation: Picker принимает не только описание корпуса, но и deployment target. Иначе он может предложить качественный новый словарь, который окажется несовместимым с уже обученной моделью или внешним API.
  kind: open
  reference: 'Характеристики корпуса определяют требования к языковому покрытию, доменной лексике и компактности токенизации. Режим использования задаёт ограничения на совместимость: при обучении с нуля можно создать новый словарь, а при дообучении или API-совместимом инференсе часто необходимо сохранить существующие токены, их идентификаторы и формат артефактов.'
  id: 041-ship-tokenizer-picker-1
  fingerprint: 26eb4349
- concept: защитные правила различают блокирующие условия релиза и предупреждения, требующие измерений
  question: Как должен поступить tokenizer-picker с одноязычным словарём, который меньше рекомендуемого минимума, если остальные обязательные проверки пройдены?
  explanation: Одноязычный словарь меньше 16k считается вероятно недостаточным, но это предупреждение, а не безусловный запрет. Решение подтверждают измерениями длины последовательностей, OOV, сжатия и обратимости; жёсткими стоп-сигналами остаются, например, недопустимое покрытие редких письменностей и отсутствие проверки хеша tokenizer.json.
  kind: choice
  options:
    - Автоматически запретить обучение и релиз при любых результатах измерений
    - Пометить конфигурацию как вероятно недостаточную и потребовать проверки на отложенном корпусе
    - Игнорировать размер словаря, поскольку для одноязычного корпуса он не влияет на токенизацию
    - Заменить проверку размера словаря проверкой хеша файла токенизатора
  correct: 1
