- concept: алгоритм токенизации и библиотека находятся на разных уровнях выбора
  question: Почему фраза «токенизатор реализован с помощью SentencePiece» не позволяет определить алгоритм построения словаря?
  explanation: Библиотека определяет программный инструмент, а алгоритм — правила обучения словаря и разбиения текста. Один инструмент может реализовывать несколько алгоритмов.
  kind: open
  reference: SentencePiece — библиотека, поддерживающая несколько алгоритмов, в частности BPE и Unigram. Чтобы однозначно описать токенизатор, нужно указать и библиотеку, и выбранный алгоритм.
  id: 011-library-vs-algorithm-1
  fingerprint: ba69c47c
- concept: инструмент выбирают с учётом необходимости обучать новый словарь или применять готовый
  question: Нужно быстро получить токены и их идентификаторы для уже существующего словаря модели OpenAI. Обучать собственный словарь не требуется. Какой инструмент лучше всего соответствует задаче?
  explanation: tiktoken предназначен для быстрого кодирования текста с помощью готовых словарей моделей OpenAI. SentencePiece выбирают, когда требуется обучить собственный словарь по BPE или Unigram.
  kind: choice
  options:
    - tiktoken
    - SentencePiece в режиме обучения Unigram
    - SentencePiece в режиме обучения BPE
    - Самостоятельная реализация WordPiece
  correct: 0
  id: 011-library-vs-algorithm-2
  fingerprint: 8793508e
- concept: Hugging Face Tokenizers поддерживает и обучение токенизатора, и его последующее применение
  question: Команде нужна одна библиотека, чтобы сначала обучить новый токенизатор на доменном корпусе, а затем использовать его для быстрого кодирования в продакшене. Какой вариант закрывает оба сценария?
  explanation: 'Hugging Face Tokenizers поддерживает полный цикл: обучение токенизатора и его быстрое применение. tiktoken ориентирован на кодирование с уже готовыми словарями и не обучает новый словарь на пользовательском корпусе.'
  kind: choice
  options:
    - Hugging Face Tokenizers
    - tiktoken
    - Только готовый словарь модели OpenAI
  correct: 0
  id: 011-library-vs-algorithm-3
  fingerprint: 26c450d5
