- concept: пре-токенизация ограничивает набор символов и соседств, доступных BPE при обучении
  question: Пре-токенизатор разделяет текст на слова и удаляет пробелы до обучения BPE. Какое следствие из этого следует?
  explanation: BPE обучается только на фрагментах, переданных пре-токенизатором. Если пробелы удалены заранее, ни одна подсчитанная пара и ни одно последующее слияние не смогут их содержать.
  kind: choice
  options:
    - BPE восстановит пробелы по частотам соседних слов
    - BPE не сможет выучить токен, содержащий пробел
    - BPE автоматически заменит пробел специальным маркером
    - Пробелы появятся в словаре после применения слияний
  correct: 1
  id: 013-pre-tokenizer-policy-1
  fingerprint: 5ef740c1
- concept: на инференсе необходимо воспроизводить политику пре-токенизации, использованную при обучении
  question: Почему нельзя обучить BPE с одним способом обработки пробелов, цифр и пунктуации, а при инференсе без последствий заменить его другим?
  explanation: 'Список слияний не обрабатывает сырой текст сам по себе: он получает результат предварительной нарезки. Поэтому корректная токенизация требует согласованности всей цепочки обучения и инференса.'
  kind: open
  reference: Другой пре-токенизатор создаст иные начальные фрагменты и соседства. Выученные слияния будут применяться к другой нарезке, поэтому тот же исходный текст может превратиться в другую последовательность токенов и идентификаторов.
  id: 013-pre-tokenizer-policy-2
  fingerprint: 76550a6d
