- concept: качество токенизатора проверяют на отложенных текстах для оценки работы на новых данных
  question: Почему среднее число токенов на слово и долю OOV следует измерять на отложенном корпусе, а не только на данных обучения токенизатора?
  explanation: Обучающий корпус влияет на состав словаря, поэтому метрики на нём могут быть слишком оптимистичными. Отложенные данные показывают ожидаемые OOV и длину последовательностей на новых текстах.
  kind: choice
  options:
    - Чтобы оценить, как токенизатор обрабатывает новые тексты, под которые словарь специально не подбирался
    - Чтобы при оценке автоматически увеличить размер словаря
    - Чтобы декодер мог восстановить порядок обученных слияний
    - Чтобы все тексты гарантированно кодировались одинаковым числом токенов
