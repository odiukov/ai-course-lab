- concept: декодирование BPE-токенов не требует обращения истории слияний
  question: BPE-энкодер выдал токены ["pre", "dict", "able</w>"]. Что достаточно сделать декодеру для восстановления текста?
  explanation: 'BPE-токен хранит соответствующий фрагмент текста: результат слияния образуется конкатенацией частей. Поэтому декодеру достаточно соединить содержимое токенов и интерпретировать </w>; история слияний не нужна.'
  kind: choice
  options:
    - Соединить текст токенов и обработать служебный маркер границы
    - Применить обученные слияния в обратном порядке
    - Найти исходное слово в словаре обучающего корпуса
    - Разделить каждый токен на отдельные байты
  correct: 0
  id: 028-round-trip-1
  fingerprint: 35bad135
- concept: маркер конца слова при декодировании преобразуется в границу между словами
  question: Заполни пропуск в упрощённом декодере BPE, чтобы маркеры конца слова восстанавливали пробелы.
  explanation: Слияние может включить </w> внутрь составного токена, но маркер остаётся в его тексте. После конкатенации замена каждого </w> пробелом восстанавливает границы слов.
  kind: cloze
  template: text = "".join(tokens).replace("</w>", ___).strip()
  answer: '" "'
  accept:
    - ''' '''
  id: 028-round-trip-2
  fingerprint: b3381e67
- concept: BPE-декодер не восстанавливает информацию, потерянную при нормализации или пре-токенизации
  question: Перед BPE-токенизацией текст перевели в нижний регистр и последовательности пробелов свернули в один пробел. Можно ли после декодирования гарантированно восстановить исходный регистр и точное количество пробелов? Объясни почему.
  explanation: Обратимость слияний не делает обратимым весь конвейер. Если нормализация или пре-токенизация уничтожила различия между строками, BPE-декодирование не может их угадать.
  kind: open
  reference: Нет. Разные исходные строки после такой обработки могут превратиться в одну и ту же последовательность, поэтому в BPE-токенах уже нет информации об исходном регистре и количестве пробелов. Декодер может восстановить только данные, сохранённые предыдущими этапами.
  id: 028-round-trip-3
  fingerprint: 563ffdb6
