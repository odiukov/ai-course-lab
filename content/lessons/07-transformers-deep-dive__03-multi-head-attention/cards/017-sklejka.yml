- concept: склейка является обратной операцией к разделению голов при сохранении порядка
  question: Матрицу X разделили на головы по непрерывным группам столбцов, а затем склеили головы обратно. При каких условиях результат точно совпадёт с X?
  explanation: Разделение и склейка не изменяют значения элементов. Они взаимно обратны, пока порядок голов, строк и локальных столбцов не нарушен.
  kind: open
  reference: Результат совпадёт с X, если при склейке сохранить исходный порядок голов и порядок столбцов внутри каждой головы. Тогда каждый элемент вернётся на исходную позицию.
