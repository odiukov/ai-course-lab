- concept: is_causal ограничивает запрос текущей и предыдущими позициями без явной квадратной маски
  question: Объясни своими словами, какие пары запрос–ключ исключает is_causal=True в авторегрессивном attention и почему при этом не требуется передавать явную маску.
  explanation: Причинное внимание запрещает токену использовать будущие позиции, но разрешает текущую и предыдущие. is_causal=True сообщает это правило ядру одним флагом, избавляя от отдельной верхнетреугольной маски.
  kind: open
  reference: Для запроса в позиции i недоступны ключи из позиций j > i. Ядро применяет это причинное правило напрямую, поэтому квадратную маску размера N×N не нужно создавать и хранить.
