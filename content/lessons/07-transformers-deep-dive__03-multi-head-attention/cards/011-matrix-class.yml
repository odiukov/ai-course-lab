- concept: явное копирование элементов раскрывает соответствие индексов при преобразовании матрицы
  question: Объясни своими словами, чем явное преобразование матрицы через чтение и запись каждого элемента полезно для изучения алгоритма и почему такой подход обычно не используют в производительном коде.
  explanation: Класс Matrix с построчным хранением и методами get/set позволяет проследить каждое соответствие индексов. В numpy или torch те же преобразования обычно выражаются reshape и transpose и выполняются без медленных циклов Python, а иногда и без копирования памяти.
  kind: open
  reference: Явные операции чтения и записи показывают, из какой исходной ячейки берётся каждый элемент и в какую новую ячейку он попадает. Это делает преобразование прозрачным, но циклы интерпретатора и физическое копирование данных намного медленнее векторизованных операций и представлений без копирования.
  id: 011-matrix-class-2
