- concept: численно устойчивое вычисление softmax по строке
  question: Расположите операции численно устойчивого softmax для одной строки оценок в правильном порядке.
  explanation: После вычитания максимума наибольший аргумент экспоненты равен 0, поэтому экспоненты не переполняются. Последнее деление превращает их в веса softmax.
  kind: order
  items:
    - Найти максимальный элемент строки
    - Вычесть найденный максимум из каждого элемента
    - Вычислить экспоненты сдвинутых элементов
    - Разделить каждую экспоненту на сумму экспонент строки
  id: 013-softmax-stroki-1
  fingerprint: 40a15883
- concept: инвариантность softmax к одинаковому сдвигу всех элементов
  question: Почему вычитание одной и той же константы из всех оценок строки не меняет результат softmax?
  explanation: Для максимума строки m выполняется e^(x_i − m) = e^(x_i) · e^(−m). Общий множитель e^(−m) сокращается при делении на сумму, поэтому веса остаются прежними, хотя вычисление становится устойчивее.
  kind: open
  reference: Каждая экспонента получает общий множитель, равный экспоненте отрицательного сдвига. Этот множитель присутствует и в числителе, и в сумме знаменателя, поэтому сокращается.
  id: 013-softmax-stroki-2
  fingerprint: 96a12e3e
