  fingerprint: 1226f08e
- concept: при фиксированной ширине модели число голов не меняет арифметическую стоимость логитов, но линейно увеличивает память для матриц внимания
  question: Объясни, как при фиксированных d_model и длине последовательности изменение числа голов влияет на число операций для вычисления QK^T и на объём памяти для хранения матриц attention.
  explanation: Разбиение ширины модели между головами уменьшает ширину каждого отдельного произведения ровно во столько раз, во сколько увеличивается число произведений. Однако число матриц весов внимания растёт вместе с числом голов.
  kind: open
  reference: 'Суммарное число операций почти не меняется: H произведений ширины d_model/H дают H·N·N·(d_model/H) = N·N·d_model. Память растёт пропорционально H, потому что каждая голова хранит собственную матрицу размера N×N.'
  id: 025-bmm-2
  fingerprint: d800f766
