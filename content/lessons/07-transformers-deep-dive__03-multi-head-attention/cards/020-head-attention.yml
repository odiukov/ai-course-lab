- concept: матрицы Q и K определяют веса внимания, а V участвует только в вычислении выхода
  question: В вызове head_attention матрицу V заменили на другую, оставив Q и K без изменений. Что обязательно останется прежним?
  explanation: Веса вычисляются как softmax(QKᵀ / √d_head), поэтому от V не зависят. Матрица V используется позже в произведении weights · V, и выход головы при её замене обычно изменится.
  kind: choice
  options:
    - Матрица весов внимания
    - Выходная матрица головы
    - И веса внимания, и выход
    - Ни веса внимания, ни выход
  correct: 0
  id: 020-head-attention-1
  fingerprint: 914521ea
- concept: вычисление внимания отдельной головы не зависит от её номера и реализуется одной общей функцией
  question: Объясни своими словами, почему для разных голов multi-head attention не нужны отдельные реализации head_attention.
  explanation: Головы отличаются входными матрицами и обученными проекциями, а не формулой attention. Общая head_attention получает локальные Q, K и V и одинаково вычисляет веса и выход для любой головы.
  kind: open
  reference: Каждая голова передаёт функции собственные срезы Q, K и V, но над ними выполняется одна и та же последовательность операций. Номер головы и общее количество голов в вычислении не участвуют, поэтому одну функцию можно вызывать для всех голов.
  id: 020-head-attention-2
  fingerprint: fa7c8c43
