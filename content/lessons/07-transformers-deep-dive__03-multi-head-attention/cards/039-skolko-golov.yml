- concept: число голов вычисляется после выбора рабочей ширины головы
  question: Для слоя с d_model = 5376 выбрана рабочая ширина d_head = 112. Сколько голов должно быть в слое?
  explanation: 'Число голов равно d_model / d_head: 5376 / 112 = 48. На практике часто сначала выбирают подходящую ширину головы — например, 64 или 128, — а затем по ширине модели получают число голов.'
  kind: numeric
  answer: 48
  tolerance: 0.01
