- concept: softmax-нормализация задаёт единый бюджет внимания для каждого запроса
  question: Для одного query-вектора голова self-attention вычислила веса по всем ключам с помощью softmax. Чему равна сумма этих весов?
  explanation: Softmax нормализует веса так, что их сумма равна единице. Поэтому усиление внимания к одним токенам неизбежно уменьшает долю внимания, доступную другим.
  kind: numeric
  answer: 1
  tolerance: 0.001
  id: 001-odna-golova-1
  fingerprint: e4233c3c
- concept: одна голова смешивает сигналы разных отношений в одном выходном векторе
  question: Почему одной голове self-attention трудно независимо представить синтаксическую связь и кореференцию для одного и того же запроса?
  explanation: Одна голова создаёт для запроса один набор attention-весов и один выходной вектор. Сигналы разных отношений поэтому конкурируют за веса и смешиваются в общей взвешенной сумме.
  kind: choice
  options:
    - Она может учитывать только соседние токены
    - Её матрицы проекций не обучаются градиентным спуском
    - Она строит одно распределение весов и сворачивает выбранные value-векторы в одну взвешенную сумму
    - Softmax всегда выбирает ровно один токен
  correct: 2
