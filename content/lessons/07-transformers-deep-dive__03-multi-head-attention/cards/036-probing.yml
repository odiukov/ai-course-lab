- concept: различие карт внимания при случайной инициализации не доказывает специализацию голов
  question: У необученного multi-head attention разные головы показывают визуально разные карты внимания. Какой вывод обоснован?
  explanation: Случайные матрицы проекций задают разные направления в подпространствах голов, поэтому их карты различаются ещё до обучения. Такая визуальная неодинаковость совместима с вращательной симметрией и не свидетельствует о содержательной специализации.
  kind: choice
  options:
    - Головы уже освоили разные языковые отношения
    - Различия могут возникнуть из-за случайных направлений проекций и сами по себе не доказывают наличие ролей
    - Каждой голове архитектурой заранее назначена отдельная синтаксическая функция
    - Любое различие карт внимания означает, что модель извлекла устойчивый признак
  correct: 1
  id: 036-probing-1
  fingerprint: 6b580759
- concept: настоящая специализация головы подтверждается устойчивостью поведения на разных входах относительно необученного базового уровня
  question: Как экспериментально проверить, отражает ли заметный паттерн attention настоящую специализацию головы, а не случайную структуру инициализации?
  explanation: Одна выразительная карта внимания не отделяет обученную роль от случайной проекции. Для такого вывода нужен контроль до обучения и проверка повторяемости после обучения на разных входах.
  kind: open
  reference: Нужно зафиксировать критерий паттерна и сравнить его до и после обучения на наборе разнообразных текстов, желательно также при нескольких инициализациях. Свидетельством специализации будет устойчивое воспроизведение одного и того же отношения после обучения при смене входа, тогда как случайный паттерн обычно меняется.
  id: 036-probing-2
  fingerprint: 60116ab8
