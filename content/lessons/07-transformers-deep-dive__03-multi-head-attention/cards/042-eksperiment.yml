- concept: различие средних результатов нужно сопоставлять с разбросом между случайными сидами
  question: Две конфигурации MHA показали немного разный средний loss, но разброс результатов между случайными сидами оказался больше этого различия. Какой вывод следует сделать?
  explanation: Обучение нейросети стохастично. Если внутригрупповой разброс перекрывает разницу между конфигурациями, одного сравнения средних недостаточно для вывода о преимуществе определённого числа голов.
  kind: open
  reference: 'Нельзя уверенно объявить одну конфигурацию лучше другой: наблюдаемая разница может быть следствием случайности. Нужны дополнительные независимые запуски и сравнение распределений результатов.'
