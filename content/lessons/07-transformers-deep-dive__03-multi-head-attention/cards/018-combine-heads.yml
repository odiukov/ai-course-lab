- concept: все матрицы голов должны иметь одинаковое число строк и одинаковую ширину
  question: Первая матрица в списке голов имеет форму 6×9, а вторая — 5×9. Что произойдёт в реализации combine_heads, которая берёт размеры у первой головы и не проверяет остальные?
  explanation: Цикл по строкам использует n, взятое у первой головы. Когда он запросит у более короткой головы строку, которой в ней нет, Matrix.get завершится ошибкой индекса. Одинаковая форма голов — неявное предусловие этой реализации.
  kind: choice
  options:
    - Недостающая строка второй головы автоматически заполнится нулями
    - При чтении второй головы возникнет выход за границы её строк
    - Результат молча получит столько строк, сколько есть у второй головы
    - Вторая голова будет автоматически транспонирована
  correct: 1
