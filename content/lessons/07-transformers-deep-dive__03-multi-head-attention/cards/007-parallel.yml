- concept: во время вычисления attention головы не используют результаты друг друга
  question: Что произойдёт, если изменить параметры одной головы multi-head attention, не меняя параметры остальных голов?
  explanation: Каждая голова самостоятельно строит Q, K и V и вычисляет свою матрицу attention. Результаты других голов не входят в этот расчёт, поэтому прямого обмена между головами во время attention нет.
  kind: choice
  options:
    - Матрицы attention остальных голов автоматически подстроятся под её новый результат
    - Результат изменённой головы поменяется, но остальные головы продолжат независимо считать attention по своим параметрам
    - Все головы получат одинаковые матрицы attention
    - Остальные головы перестанут вычисляться до получения результата изменённой головы
  correct: 1
  id: 007-parallel-1
  fingerprint: 0f95740d
- concept: специализация голов формируется обучением их собственных параметров
  question: Объясни своими словами, как разные головы attention могут специализироваться на разных типах связей, если во время прямого прохода они не согласовывают роли друг с другом.
  explanation: Независимость вычислений не означает, что роли назначаются случайно при каждом запуске. Специализация возникает постепенно при обучении и сохраняется в параметрах отдельных голов.
  kind: open
  reference: У голов есть собственные обучаемые проекции Q, K и V. Во время обучения градиенты изменяют эти параметры так, чтобы совместный выход модели уменьшал функцию потерь. Поэтому разные способы обработки связей закрепляются в весах заранее, а не выбираются путём общения голов во время прямого прохода.
  id: 007-parallel-2
  fingerprint: c3ec03ab
