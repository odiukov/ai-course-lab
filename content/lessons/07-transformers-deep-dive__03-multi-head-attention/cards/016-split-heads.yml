- concept: форма результата split_heads определяется числом голов и шириной исходной матрицы
  question: Какие длину списка, число строк и число столбцов каждой матрицы должна получить функция split_heads?
  explanation: Функция возвращает по одной матрице на голову. Каждая голова сохраняет все строки исходной матрицы, а её столбцы получают равную долю признаков.
  kind: cloze
  template: (len(heads), heads[h].rows, heads[h].cols) = ___
  answer: (n_heads, X.rows, X.cols // n_heads)
  accept:
    - n_heads, X.rows, X.cols // n_heads
    - (n_heads, X.rows, X.cols//n_heads)
  id: 016-split-heads-1
  fingerprint: e5d175e7
- concept: делимость ширины матрицы на число голов является предусловием равного разбиения
  question: Почему перед вычислением d_head через целочисленное деление нужно проверить, что X.cols делится на n_heads без остатка?
  explanation: Проверка X.cols % n_heads == 0 гарантирует, что каждый исходный столбец попадёт ровно в одну голову и все головы будут иметь одинаковую ширину.
  kind: open
  reference: Целочисленное деление отбрасывает остаток. Если ширина не делится на число голов, равные по ширине головы не покроют все столбцы исходной матрицы, поэтому часть данных будет потеряна.
  id: 016-split-heads-2
  fingerprint: 587580dd
