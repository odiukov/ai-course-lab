- concept: softmax сохраняет порядок логитов
  question: В одной строке матрицы сходств логит ключа A больше логита ключа B. Что можно утверждать об их весах после softmax?
  explanation: Экспонента строго возрастает, а все экспоненты строки делятся на один и тот же знаменатель. Поэтому softmax меняет масштаб значений, но сохраняет их порядок.
  kind: choice
  options:
    - Вес A будет больше веса B
    - Вес A будет меньше веса B
    - Веса обязательно станут равными
  correct: 0
  id: 014-softmax-1
  fingerprint: 566a4596
- concept: отношение двух весов softmax определяется разностью соответствующих логитов
  question: В одной строке логит ключа A превышает логит ключа B на ln(5). Во сколько раз вес A после softmax будет больше веса B?
  explanation: 'Общий знаменатель сокращается: softmax(A) / softmax(B) = exp(A − B). При разности ln(5) отношение равно exp(ln(5)) = 5; остальные логиты строки на это отношение не влияют.'
  kind: numeric
  answer: 5
  tolerance: 0.01
  id: 014-softmax-2
  fingerprint: 8749fd1b
