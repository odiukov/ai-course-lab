- concept: MHA, GQA и MQA различаются степенью совместного использования K/V query-головами
  question: Расположите варианты attention от наибольшего к наименьшему числу независимо хранимых наборов K/V при фиксированном числе query-голов.
  explanation: MHA хранит отдельные K/V для каждой query-головы. GQA разделяет query-головы на несколько групп с общими K/V внутри группы. В MQA один набор K/V обслуживает все query-головы.
  kind: order
  items:
    - 'MHA: у каждой query-головы собственные K/V'
    - 'GQA: каждая группа query-голов совместно использует свои K/V'
    - 'MQA: все query-головы совместно используют общие K/V'
  id: 035-visual-variants-1
  fingerprint: acace1e6
- concept: GQA занимает выгодную точку компромисса между размером KV-кэша и качеством модели
  question: Нужно заметно сократить KV-кэш, сохранив качество как можно ближе к MHA. Максимальная экономия памяти не обязательна. Какой вариант обычно выбирают?
  explanation: При переходе от MHA к GQA объём KV-кэша резко уменьшается, а качество обычно меняется мало. MQA экономит ещё больше памяти, но полное совместное использование K/V чаще сильнее ограничивает модель. MLA при этом не отказывается от query-голов.
  kind: choice
  options:
    - GQA, сохранив несколько независимых групп K/V
    - MQA, сделав K/V общими для всех query-голов
    - MHA, оставив каждой query-голове собственные K/V
    - MLA, отказавшись от query-голов
  correct: 0
  id: 035-visual-variants-2
  fingerprint: 827a756a
- concept: MLA экономит память за счёт низкорангового латентного представления K/V и дополнительного вычисления при attention
  question: Заполните пропуск в схеме механизма MLA.
  explanation: MLA не просто сокращает число KV-голов. Он хранит сжатое низкоранговое представление K/V и разворачивает необходимые компоненты при вычислении attention, обменивая дополнительные FLOPs на более существенную экономию памяти.
  kind: cloze
  template: K, V → ___ → восстановление нужных представлений во время вычисления attention
  answer: низкоранговое латентное представление
  accept:
    - сжатое латентное представление
    - низкоранговое сжатие
    - латентное сжатие K/V
  id: 035-visual-variants-3
  fingerprint: 55f8ef0d
