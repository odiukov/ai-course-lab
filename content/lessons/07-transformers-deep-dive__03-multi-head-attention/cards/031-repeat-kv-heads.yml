- concept: KV-головы распределяются между query-головами непрерывными группами через целочисленное деление индекса
  question: Функция должна повторить каждую KV-голову подряд одинаковое число раз. Заполни выражение для индекса KV-головы.
  explanation: Целочисленное деление сохраняет один индекс KV-головы на протяжении всей группы query-голов. Остаток от деления чередовал бы KV-головы вместо их последовательного повторения.
  kind: cloze
  template: |-
    repeat = n_heads // len(kv_heads)
    return [kv_heads[___] for i in range(n_heads)]
  answer: i // repeat
  accept:
    - (i // repeat)
  id: 031-repeat-kv-heads-1
  fingerprint: 2296fad5
- concept: повторение KV-голов переиспользует ссылки на матрицы без копирования данных
  question: Функция формирует расширенный список выражением, которое несколько раз берёт один элемент исходного списка KV-голов. Какое утверждение верно?
  explanation: Индексирование списка возвращает ссылку на уже существующую матрицу. Поэтому несколько query-голов могут использовать одну KV-голову, а сами матрицы не копируются и не меняют форму.
  kind: choice
  options:
    - Для каждой позиции автоматически создаётся независимая копия матрицы
    - Несколько позиций результата могут ссылаться на один и тот же объект матрицы
    - Число столбцов каждой матрицы увеличивается пропорционально числу повторений
    - Исходный список KV-голов обязательно изменяется
  correct: 1
  id: 031-repeat-kv-heads-2
  fingerprint: 8b3a2bfe
