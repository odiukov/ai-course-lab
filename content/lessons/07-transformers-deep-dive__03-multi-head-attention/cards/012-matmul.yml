- concept: транспонирование ключей превращает произведение в матрицу попарных оценок токенов
  question: В scaled dot-product attention строки матриц q и k соответствуют токенам, а столбцы — признакам. Почему оценки вычисляют как q·kᵀ? Когда выражение q·k может пройти проверку форм и всё равно быть семантически неверным?
  explanation: Проверка размеров подтверждает только техническую возможность умножения. Когда число токенов случайно равно размерности признаков, она не обнаружит забытое транспонирование, поэтому необходимо учитывать смысл осей.
  kind: open
  reference: 'Произведение q формы (N, d) на kᵀ формы (d, N) даёт матрицу (N, N), где элемент с индексами i и j является скалярным произведением признаков токена-запроса i и токена-ключа j. Если N равно d, произведение q·k тоже формально допустимо, но совпадение размеров случайно: внутренний индекс обозначает признак в q и токен в k, поэтому результат не является матрицей попарных оценок токенов.'
  id: 012-matmul-3
  fingerprint: 842eebbb
