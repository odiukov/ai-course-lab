- concept: элемент произведения матриц является скалярным произведением строки и столбца
  question: Заполни индекс так, чтобы выражение вычисляло элемент произведения матриц.
  explanation: Внутренний индекс k одновременно перебирает элементы строки i матрицы A и элементы столбца j матрицы B. Их попарные произведения складываются в C[i, j].
  kind: cloze
  template: C[i, j] = sum(A[i, k] * B[___, j] for k in range(A.cols))
  answer: k
  accept:
    - k
