<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Хранение K и V: MHA, GQA, MQA, MLA</title>
<style>
  :root{
    --bg:#ffffff; --ink:#1b2330; --muted:#5a6675; --axis:#8c99a8;
    --mha:#c2410c; --gqa:#1d4ed8; --mqa:#0f766e; --mla:#7c3aed; --grid:#dde3ea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#11151b; --ink:#e8edf4; --muted:#9dabbb; --axis:#6b7887;
      --mha:#fb923c; --gqa:#7ea6ff; --mqa:#4fd1bc; --mla:#c4a2ff; --grid:#242d38;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  figure{margin:0;padding:10px 12px 12px}
  .ttl{font-size:15px;font-weight:600;margin:0 0 2px}
  .sub{font-size:12.5px;color:var(--muted);margin:0 0 6px}
  svg{display:block;width:100%;height:auto;max-height:520px}
  .lbl{font-size:12.5px;fill:var(--ink)}
  .nm{font-size:14px;font-weight:700}
  .sm{font-size:11.5px;fill:var(--muted)}
  .tick{font-size:11.5px;fill:var(--muted)}
  .ax{stroke:var(--axis);fill:none}
  .gl{stroke:var(--grid);fill:none;stroke-dasharray:3 4}
  .fb{font-size:13px;line-height:1.5;color:var(--ink)}
</style>
<figure>
  <p class="ttl">Сколько наборов K и V лежит в памяти: MHA, GQA, MQA, MLA</p>
  <p class="sub">Llama 3 8B, 32 Q-головы. Высота столбика — наборы K и V на один токен в одном слое.</p>
  <div id="host"></div>
</figure>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    // ---- данные схемы ----
    var DATA = [
      {n:'MHA', kv:32,   top:'32',          q:'по 1 Q-голове',   a:'качество: эталон',      c:'var(--mha)'},
      {n:'GQA', kv:8,    top:'8',           q:'по 4 Q-головы',   a:'почти как MHA',         c:'var(--gqa)'},
      {n:'MQA', kv:1,    top:'1',           q:'все 32 Q-головы', a:'небольшая просадка',    c:'var(--mqa)'},
      {n:'MLA', kv:0.45, top:'латент, < 1', q:'все 32 Q-головы', a:'почти как MHA',         c:'var(--mla)'}
    ];
    var TICKS = [1, 8, 32];
    var HALF = 0.28;      // полуширина столбика в единицах данных
    var X0 = 0.35, X1 = 4.72, YTOP = 34.6;

    // ---- единственная пара функций перевода ----
    var ORIGIN = {x:110, y:360};
    var SCALE  = {x:170, y:9.375};
    function sx(x){ return ORIGIN.x + x * SCALE.x; }
    function sy(y){ return ORIGIN.y - y * SCALE.y; }

    var NS = 'http://www.w3.org/2000/svg';
    function el(t,a){ var e=document.createElementNS(NS,t);
      for(var k in a){ e.setAttribute(k, a[k]); } return e; }
    function line(x1,y1,x2,y2,cls){
      return el('line',{x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),class:cls,'stroke-width':1.4});
    }
    function txt(x,y,s,cls,anchor,dx,dy){
      var t = el('text',{x:sx(x)+(dx||0), y:sy(y)+(dy||0), class:cls, 'text-anchor':anchor});
      t.appendChild(document.createTextNode(s)); return t;
    }

    var svg = el('svg',{viewBox:'0 0 920 430', role:'img',
      'aria-label':'Столбики хранения K и V: MHA 32 набора, GQA 8, MQA 1, MLA сжатый латент меньше одного'});
    var bg = el('rect',{x:0,y:0,width:920,height:430,fill:'var(--bg)'});
    svg.appendChild(bg);

    // оси
    svg.appendChild(line(X0, 0, X0, YTOP, 'ax'));
    svg.appendChild(line(X0, 0, X1, 0, 'ax'));
    svg.appendChild(txt(X0, YTOP, 'наборов K и V на токен (в одном слое)', 'sm', 'start', 0, -6));

    // засечки и сетка
    TICKS.forEach(function(t){
      svg.appendChild(line(X0 - 0.06, t, X0, t, 'ax'));
      svg.appendChild(line(X0, t, X1, t, 'gl'));
      svg.appendChild(txt(X0 - 0.09, t, String(t), 'tick', 'end', 0, 4));
    });

    // столбики и подписи
    DATA.forEach(function(d, i){
      var cx = i + 1;
      var xL = sx(cx - HALF), yT = sy(d.kv), w = sx(cx + HALF) - xL, h = sy(0) - yT;
      svg.appendChild(el('rect',{x:xL, y:yT, width:w, height:Math.max(h, 2),
        rx:2, fill:d.c, 'fill-opacity':0.85, stroke:d.c, 'stroke-width':1.4}));
      svg.appendChild(txt(cx, d.kv, d.top, 'lbl', 'middle', 0, -8));
      svg.appendChild(txt(cx, -1.5, d.n,  'nm lbl', 'middle', 0, 0));
      svg.appendChild(txt(cx, -2.9, d.q,  'sm', 'middle', 0, 0));
      svg.appendChild(txt(cx, -4.3, d.a,  'sm', 'middle', 0, 0));
    });

    // выноска к MLA: столбик ниже, чем у MQA
    var mla = DATA[3];
    svg.appendChild(line(4 + HALF + 0.05, mla.kv, 4 + HALF + 0.35, 4.2, 'ax'));
    svg.appendChild(txt(4 + HALF + 0.38, 4.2, 'ниже, чем', 'sm', 'end', 0, -14));
    svg.appendChild(txt(4 + HALF + 0.38, 4.2, 'у MQA', 'sm', 'end', 0, -2));

    // легенда
    svg.appendChild(txt(X0, -5.9,
      'MLA хранит не готовые K и V, а сжатую запись: она разворачивается в полные головы уже при вычислении внимания.',
      'sm', 'start', 0, 0));

    host.appendChild(svg);
  }catch(e){
    host.innerHTML = '<div class="fb"><b>Схема не построилась.</b> Она должна показывать четыре столбика ' +
      'при 32 Q-головах: MHA хранит 32 набора K и V на токен в слое, GQA — 8 (четыре Q-головы на набор), ' +
      'MQA — 1 на все 32 головы, MLA — сжатый латент, то есть меньше одного набора. ' +
      'Качество: MHA эталон, GQA и MLA почти вровень с ним, MQA даёт небольшую просадку.</div>';
  }
})();
</script>
</html>
