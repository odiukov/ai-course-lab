<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Разбор 5550 шагов по частям</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1d2330; --muted:#5c6675;
    --seq:#c2554a; --par:#3f7d4e; --coord:#b8873a; --single:#4a5f86;
    --grid:#d6dae1;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12161d; --fg:#e6eaf0; --muted:#9aa5b4;
      --seq:#e08a7e; --par:#79c48c; --coord:#dcb463; --single:#8ba6d8;
      --grid:#2b323d;
    }
  }
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .wrap{background:var(--bg);padding:8px 4px 10px;}
  h2{margin:0 0 4px;padding:0 8px;font-size:15px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;}
  .lbl{fill:var(--fg);font-size:12px;}
  .sub{fill:var(--muted);font-size:11px;}
  .val{fill:var(--bg);font-size:12px;font-weight:600;}
  .ax{stroke:var(--grid);}
  .axt{fill:var(--muted);font-size:11px;}
  .fail{padding:8px;color:var(--fg);font-size:13px;}
</style>
</head>
<body>
<div class="wrap">
  <h2>5550 шагов = 3000 + 1750 + 800</h2>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById("host");
  try{
    // ---- данные схемы ----
    var stack = [
      {key:"seq",   v:3000, cls:"seq",   name:"последовательный хвост", note:"0.3 × 10000"},
      {key:"par",   v:1750, cls:"par",   name:"параллельная часть",     note:"0.7/4 × 10000"},
      {key:"coord", v:800,  cls:"coord", name:"координация",            note:"200 × 4"}
    ];
    var single = 10000;
    var ticks = [0, 2000, 4000, 6000, 8000, 10000];
    var barW = 1.1;                 // ширина столбика в единицах X
    var colX = {stack:1.0, single:3.2};
    var xMax = 5.0;

    // ---- холст (литералы: только размеры) ----
    var W = 760, H = 470;
    var PAD = 8;                    // пиксельный отступ подписи от якоря

    // ---- одно origin, один scale ----
    var origin = {x:150, y:400};
    var scale  = {x:(W - 190) / xMax, y:300 / single};

    function sx(x){ return origin.x + x * scale.x; }
    function sy(y){ return origin.y - y * scale.y; }

    var NS = "http://www.w3.org/2000/svg";
    function el(n, a){
      var e = document.createElementNS(NS, n);
      for (var k in a) e.setAttribute(k, a[k]);
      return e;
    }
    function txt(x, y, s, cls, anchor){
      var t = el("text", {x:x, y:y, class:cls, "text-anchor":anchor});
      t.textContent = s;
      return t;
    }

    var svg = el("svg", {viewBox:"0 0 "+W+" "+H, preserveAspectRatio:"xMidYMid meet",
      role:"img", "aria-label":"Разбор 5550 шагов на три слагаемых против 10000 шагов одного воркера"});
    svg.appendChild(el("rect", {x:0, y:0, width:W, height:H, fill:"var(--bg)"}));

    // ---- ось Y с засечками ----
    svg.appendChild(el("line", {x1:sx(0), y1:sy(0), x2:sx(0), y2:sy(single),
      class:"ax", "stroke-width":1.5}));
    svg.appendChild(el("line", {x1:sx(0), y1:sy(0), x2:sx(xMax), y2:sy(0),
      class:"ax", "stroke-width":1.5}));
    ticks.forEach(function(v){
      svg.appendChild(el("line", {x1:sx(0), y1:sy(v), x2:sx(xMax), y2:sy(v),
        class:"ax", "stroke-width":1, "stroke-dasharray":v?"3 4":"0"}));
      svg.appendChild(txt(sx(0) - PAD, sy(v) + 4, String(v), "axt", "end"));
    });
    svg.appendChild(txt(sx(0) - PAD, sy(single) - PAD*2, "шагов", "axt", "end"));

    // ---- столбик из трёх частей ----
    var acc = 0, x0 = colX.stack - barW/2, x1 = colX.stack + barW/2;
    stack.forEach(function(p){
      var yb = sy(acc), yt = sy(acc + p.v);
      svg.appendChild(el("rect", {x:sx(x0), y:yt, width:sx(x1)-sx(x0), height:yb-yt,
        fill:"var(--"+p.cls+")"}));
      // значение внутри своего сегмента
      svg.appendChild(txt(sx(colX.stack), (yt+yb)/2 + 4, String(p.v), "val", "middle"));
      // подпись части — справа от сегмента
      svg.appendChild(txt(sx(x1) + PAD, (yt+yb)/2, p.name, "lbl", "start"));
      svg.appendChild(txt(sx(x1) + PAD, (yt+yb)/2 + 13, p.note, "sub", "start"));
      acc += p.v;
    });
    // разделители сегментов
    svg.appendChild(el("line", {x1:sx(x0), y1:sy(3000), x2:sx(x1), y2:sy(3000),
      stroke:"var(--bg)", "stroke-width":2}));
    svg.appendChild(el("line", {x1:sx(x0), y1:sy(4750), x2:sx(x1), y2:sy(4750),
      stroke:"var(--bg)", "stroke-width":2}));

    // сумма над столбиком
    svg.appendChild(txt(sx(colX.stack), sy(5550) - PAD, "5550", "lbl", "middle"));
    svg.appendChild(txt(sx(colX.stack), sy(0) + PAD*2.4, "4 воркера", "lbl", "middle"));

    // ---- столбик одного воркера ----
    var s0 = colX.single - barW/2, s1 = colX.single + barW/2;
    svg.appendChild(el("rect", {x:sx(s0), y:sy(single),
      width:sx(s1)-sx(s0), height:sy(0)-sy(single), fill:"var(--single)"}));
    svg.appendChild(txt(sx(colX.single), sy(single) - PAD, String(single), "lbl", "middle"));
    svg.appendChild(txt(sx(colX.single), sy(0) + PAD*2.4, "1 воркер", "lbl", "middle"));
    svg.appendChild(txt(sx(colX.single), sy(single/2) + 4, "10000", "val", "middle"));

    // ---- линия уровня 5550 до второго столбика + подпись у хвоста ----
    svg.appendChild(el("line", {x1:sx(x1), y1:sy(5550), x2:sx(s0), y2:sy(5550),
      stroke:"var(--fg)", "stroke-width":1, "stroke-dasharray":"4 4"}));

    // ---- пол ускорения: 3000 не двигается ----
    svg.appendChild(el("line", {x1:sx(x1), y1:sy(3000), x2:sx(xMax), y2:sy(3000),
      stroke:"var(--seq)", "stroke-width":1, "stroke-dasharray":"6 3"}));
    svg.appendChild(txt(sx(xMax), sy(3000) + PAD*2, "пол ≈ 3000: не двигается", "sub", "end"));

    host.appendChild(svg);
  }catch(e){
    host.innerHTML = '<p class="fail">Схема должна была показать: столбик 4 воркеров из трёх частей — '
      + 'последовательный хвост 0.3 × 10000 = 3000, параллельная часть 0.7/4 × 10000 = 1750, '
      + 'координация 200 × 4 = 800, всего 5550 — рядом со столбиком 10000 шагов одного воркера.</p>';
  }
})();
</script>
</body>
</html>
