<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Общий кэш: одна лента, четыре автора</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1a1d21; --muted:#5b6672; --line:#3b444d; --empty:#9aa4ae;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14171a; --fg:#e8ecef; --muted:#9fb0bd; --line:#c3ced8; --empty:#6b7783; }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:12px}
  h2{font-size:15px;font-weight:600;margin:0 0 6px;color:var(--fg)}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg)}
  .fb{font-size:14px;line-height:1.5;color:var(--fg)}
  text{font-family:inherit;fill:var(--fg)}
  .num{fill:var(--muted)}
  .note{fill:var(--muted)}
</style>
<div class="wrap">
  <h2>Общий кэш: одна лента, четыре автора</h2>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    /* ---------- данные схемы ---------- */
    var D = {
      cells: 12,
      /* автор токена на позициях 0..5 (порядок из текста шага) */
      tokens: [0, 1, 1, 3, 0, 2],
      workers: [
        {name:'воркер 1', color:'#2563eb'},
        {name:'воркер 2', color:'#12874a'},
        {name:'воркер 3', color:'#d2760a'},
        {name:'воркер 4', color:'#cc2f2f'}
      ],
      tape:    {y0:0, y1:0.8},
      boxes:   {y0:-2.6, y1:-1.9, w:1.7, xs:[2.5, 4.5, 6.5, 8.5]},
      tips:    [6.15, 6.38, 6.62, 6.85],
      numY:    1.05,
      brk:     {y:1.7, x0:0, x1:6, tick:0.12, lab:1.48},
      eyes:    {base:2.9, top:2.6, xs:[0.75, 2.25, 3.75, 5.25]},
      wLab:    {x:11.9, y:-1.45},
      freeLab: {x:9, y:-0.4},
      note:    {x:6, y:3.7},
      head:    0.24, halfw: 0.11
    };

    /* ---------- одна пара функций перевода ---------- */
    var ORIGIN = {x:90, y:176}, SCALE = 60;
    function sx(x){ return ORIGIN.x + x * SCALE; }
    function sy(y){ return ORIGIN.y + y * SCALE; }

    var NS = 'http://www.w3.org/2000/svg';
    function el(n, a, t){
      var e = document.createElementNS(NS, n);
      for (var k in a) e.setAttribute(k, a[k]);
      if (t != null) e.appendChild(document.createTextNode(t));
      return e;
    }
    var svg = el('svg', {viewBox:'0 0 900 420', width:'900', height:'420',
                         role:'img','aria-label':'Одна лента токенов, четыре воркера пишут в её хвост и читают её целиком'});

    /* стрелка: концы и наконечник — только через sx/sy */
    function arrow(x1,y1,x2,y2,color,dash){
      var dx=x2-x1, dy=y2-y1, L=Math.sqrt(dx*dx+dy*dy);
      var ux=dx/L, uy=dy/L, px=-uy, py=ux;
      var bx=x2-ux*D.head, by=y2-uy*D.head;
      var ln = el('line',{x1:sx(x1),y1:sy(y1),x2:sx(bx),y2:sy(by),
                          stroke:color,'stroke-width':2,'stroke-linecap':'round'});
      if (dash) ln.setAttribute('stroke-dasharray','5 4');
      svg.appendChild(ln);
      svg.appendChild(el('polygon',{fill:color, points:
        sx(x2)+','+sy(y2)+' '+
        sx(bx+px*D.halfw)+','+sy(by+py*D.halfw)+' '+
        sx(bx-px*D.halfw)+','+sy(by-py*D.halfw)}));
    }

    /* ---------- лента из 12 ячеек ---------- */
    for (var i=0;i<D.cells;i++){
      var occ = i < D.tokens.length;
      var col = occ ? D.workers[D.tokens[i]].color : 'none';
      var cell = el('rect',{x:sx(i), y:sy(D.tape.y0),
        width:sx(i+1)-sx(i), height:sy(D.tape.y1)-sy(D.tape.y0),
        fill:col, 'fill-opacity':occ?0.85:0,
        stroke:occ?col:'var(--empty)', 'stroke-width':2});
      if (!occ) cell.setAttribute('stroke-dasharray','5 4');
      svg.appendChild(cell);
      svg.appendChild(el('text',{x:sx(i+0.5), y:sy(D.numY), 'text-anchor':'middle',
        'font-size':13, 'class':'num'}, String(i)));
    }
    svg.appendChild(el('text',{x:sx(D.freeLab.x), y:sy(D.freeLab.y), 'text-anchor':'middle',
      'font-size':13, 'class':'note'}, 'свободные позиции'));

    /* ---------- четыре пера: пишут в один хвост ---------- */
    D.workers.forEach(function(w, k){
      var cx = D.boxes.xs[k], half = D.boxes.w/2;
      svg.appendChild(el('rect',{x:sx(cx-half), y:sy(D.boxes.y0),
        width:sx(cx+half)-sx(cx-half), height:sy(D.boxes.y1)-sy(D.boxes.y0),
        rx:6, fill:w.color, 'fill-opacity':0.9, stroke:w.color, 'stroke-width':2}));
      svg.appendChild(el('text',{x:sx(cx), y:sy((D.boxes.y0+D.boxes.y1)/2), dy:5,
        'text-anchor':'middle', 'font-size':13, fill:'#ffffff'}, w.name));
      arrow(cx, D.boxes.y1, D.tips[k], D.tape.y0, w.color, false);
    });
    svg.appendChild(el('text',{x:sx(D.wLab.x), y:sy(D.wLab.y), 'text-anchor':'end',
      'font-size':13}, 'все четыре пишут в один хвост'));

    /* ---------- четыре глаза: читают ленту целиком ---------- */
    var b = D.brk;
    svg.appendChild(el('line',{x1:sx(b.x0), y1:sy(b.y), x2:sx(b.x1), y2:sy(b.y),
      stroke:'var(--line)', 'stroke-width':2}));
    [b.x0, b.x1].forEach(function(x){
      svg.appendChild(el('line',{x1:sx(x), y1:sy(b.y), x2:sx(x), y2:sy(b.y-b.tick),
        stroke:'var(--line)', 'stroke-width':2}));
    });
    svg.appendChild(el('text',{x:sx((b.x0+b.x1)/2), y:sy(b.lab), 'text-anchor':'middle',
      'font-size':13}, 'каждый читает всю ленту: позиции 0…5'));

    D.workers.forEach(function(w, k){
      var x = D.eyes.xs[k];
      arrow(x, D.eyes.top, x, b.y + D.halfw/2, w.color, true);
      svg.appendChild(el('text',{x:sx(x), y:sy(D.eyes.base), 'text-anchor':'middle',
        'font-size':13, fill:w.color}, w.name));
    });

    svg.appendChild(el('text',{x:sx(D.note.x), y:sy(D.note.y), 'text-anchor':'middle',
      'font-size':13, 'class':'note'},
      'Цвет — только для тебя: в кэше лежат токены на позициях, цветов там нет.'));

    host.appendChild(svg);
  } catch(e){
    host.innerHTML = '<p class="fb">Схема не построилась. Она должна показывать: одну ленту из 12 ячеек-токенов, ' +
      'позиции пронумерованы сквозным образом 0…11; занятые позиции 0…5 раскрашены по авторам ' +
      '(воркер 1 — синий, воркер 2 — зелёный, воркер 3 — оранжевый, воркер 4 — красный), ' +
      'на позициях 1 и 2 два зелёных подряд; все четыре воркера стрелками пишут в один и тот же хвост ленты, ' +
      'и все четыре читают её целиком — от позиции 0 до последней занятой.</p>';
  }
})();
</script>
</html>
