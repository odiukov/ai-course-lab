- concept: стоимость NLI-инференса включает вычислительные ресурсы, задержку и объём обработки
  question: Какое сравнение наиболее полно оценивает стоимость двух NLI-моделей для массового локального инференса?
  explanation: Эксплуатационная стоимость определяется не одной денежной ценой. Крупная модель может требовать больше памяти и дольше обрабатывать каждую пару, поэтому масштаб корпуса существенно влияет на выбор.
  kind: choice
  options:
    - Сравнить только размер файлов моделей
    - Сравнить только точность на публичном бенчмарке
    - Учесть потребление памяти, пропускную способность, задержку и объём входных пар
    - Учесть только цену загрузки контрольных точек
