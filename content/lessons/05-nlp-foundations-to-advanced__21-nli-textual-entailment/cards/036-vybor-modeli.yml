- concept: документная специализация NLI-модели не гарантирует достаточное контекстное окно
  question: Почему пометка модели как подходящей для NLI на уровне документов не позволяет сразу заключить, что она обработает длинный документ целиком?
  explanation: Обучение на документных задачах может улучшить рассуждение по нескольким предложениям, но не отменяет технический предел контекстного окна. Обрезание способно удалить сведения, необходимые для вывода.
  kind: open
  reference: 'Специализация описывает задачи и данные обучения, но не максимальную длину входа. Нужно отдельно проверить лимит токенов: превышающий его текст будет обрезан либо потребует разбиения на части.'
