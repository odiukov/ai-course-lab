- concept: полезность полной NLI-модели оценивают по её преимуществу над hypothesis-only baseline
  question: Полная NLI-модель достигает точности 74 %, а классификатор, не получающий premise, — 73 %. Как интерпретировать результат?
  explanation: Разница всего в один пункт означает, что доступ к premise почти не улучшил результат. Значительная часть точности может объясняться поверхностными закономерностями в hypothesis.
  kind: choice
  options:
    - Полная модель убедительно доказала способность распознавать логическое следование
    - Малый прирост над baseline не позволяет приписать качество полноценному сравнению текстов
    - Baseline нельзя сравнивать с полной моделью на одном наборе данных
    - Полная модель обязательно переобучилась из-за дополнительного входа
  correct: 1
  id: 023-proverka-baseline-1
  fingerprint: '20375903'
- concept: контрфактическая замена premise проверяет, использует ли NLI-модель содержание обоих текстов
  question: Объясни своими словами, зачем при диагностике NLI-модели заменять premise на другой текст, сохраняя hypothesis неизменной.
  explanation: Полезный NLI-классификатор должен быть чувствителен к информации, определяющей отношение между текстами. Стабильность ответа при содержательно значимой подмене premise выявляет зависимость от посторонних подсказок.
  kind: open
  reference: 'Такая замена служит интервенционным тестом: если новый premise меняет логическое отношение, предсказание модели тоже должно реагировать. Почти неизменные ответы указывают, что модель слабо использует premise и может опираться на shortcuts в hypothesis.'
  id: 023-proverka-baseline-2
  fingerprint: 84d50b68
