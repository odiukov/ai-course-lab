- concept: adversarial-сбор данных концентрирует примеры на обнаруженных слабостях существующих моделей
  question: Объясни своими словами, почему ANLI обычно оказывается сложнее корпуса, примеры для которого составляли без учёта ошибок моделей.
  explanation: 'ANLI называют adversarial-набором именно из-за адаптивного сбора: авторы примеров ориентировались на ошибки моделей. Улучшение на обычном корпусе поэтому не гарантирует столь же высокого результата на ANLI.'
  kind: open
  reference: При создании ANLI люди анализировали ошибки существующих NLI-моделей и специально писали новые пары, способные их запутать. Поэтому набор содержит не случайную выборку обычных примеров, а повышенную концентрацию случаев, соответствующих слабым местам текущих моделей.
  id: 007-datasets-2
  fingerprint: f4a80c3a
