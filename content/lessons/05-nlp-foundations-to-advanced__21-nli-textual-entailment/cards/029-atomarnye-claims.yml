- concept: атомарная проверка не позволяет подтверждённым частям ответа скрыть неподтверждённые
  question: Контекст подтверждает одну часть составного ответа, но ничего не говорит о другой. Как корректнее проверить faithfulness с помощью NLI?
  explanation: Составная hypothesis смешивает поддержанную и неподтверждённую информацию, поэтому единая оценка может замаскировать галлюцинацию. Независимая NLI-проверка атомарных утверждений сохраняет результат для каждого факта.
  kind: choice
  options:
    - Передать весь ответ как одну hypothesis и принять итоговую метку
    - Считать ответ верным, если большинство его слов встречается в контексте
    - Разбить ответ на отдельные проверяемые утверждения и сопоставить с контекстом каждое из них
    - Считать весь ответ противоречием из-за отсутствующей в контексте части
  correct: 2
  id: 029-atomarnye-claims-1
  fingerprint: 639757b1
- concept: границы предложений не всегда совпадают с границами атомарных утверждений
  question: Почему для claim-level faithfulness недостаточно всегда разбивать ответ только по границам предложений?
  explanation: Разделитель предложений — лишь приближение. Если внутри предложения есть несколько смысловых утверждений, их совместная проверка снова создаёт смесь поддержанных и неподдержанных частей.
  kind: open
  reference: Одно предложение может объединять несколько независимо проверяемых фактов союзами и другими конструкциями. Его нужно делить до утверждений, каждое из которых способно отдельно получить отношение entailment, contradiction или neutral к контексту.
  id: 029-atomarnye-claims-2
  fingerprint: 8658dc79
- concept: faithfulness агрегирует результаты атомарных проверок как долю поддержанных утверждений
  question: Заполни формулу claim-level faithfulness.
  explanation: Каждое атомарное утверждение даёт булев результат проверки поддержки. Их сумма показывает количество прошедших проверку, а деление на общее количество утверждений превращает его в долю.
  kind: cloze
  template: faithfulness = ___
  answer: число поддержанных атомарных утверждений / общее число непустых атомарных утверждений
  accept:
    - supported_claims / all_claims
    - количество утверждений с entailment / количество всех непустых утверждений
    - доля поддержанных атомарных утверждений
  id: 029-atomarnye-claims-3
  fingerprint: 85fd8943
