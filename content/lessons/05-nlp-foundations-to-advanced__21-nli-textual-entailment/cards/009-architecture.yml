- concept: NLI-классификатор последовательно кодирует пару текстов, вычисляет оценки классов и выбирает максимальную
  question: Расположите этапы обработки пары premise и hypothesis в трансформерном NLI-классификаторе.
  explanation: Совместный вход позволяет энкодеру сопоставлять фрагменты двух текстов. Итоговое представление пары поступает в классификатор, softmax превращает его оценки в распределение вероятностей, а максимум задаёт предсказанную метку.
  kind: order
  items:
    - Объединить premise и hypothesis в один вход с разделителями
    - Получить в энкодере контекстные представления с учётом обоих текстов
    - Собрать итоговое представление всей пары
    - Преобразовать представление пары в оценки классов
    - Нормализовать оценки через softmax и выбрать класс с наибольшей вероятностью
  id: 009-architecture-1
  fingerprint: e3297c81
- concept: высокая оценка NLI отражает уверенность модели, а не гарантирует истинность вывода
  question: NLI-модель с высокой уверенностью выбрала entailment для пары текстов. Как правильно интерпретировать этот результат?
  explanation: Вероятность softmax показывает относительную уверенность обученной модели для конкретного входа. Она не является доказательством и может быть плохо откалибрована, особенно на непривычных формулировках или данных из другого распределения.
  kind: choice
  options:
    - Hypothesis доказана с логической достоверностью
    - Модель считает entailment наиболее вероятным отношением, но её уверенный ответ может быть ошибочным
    - Большинство слов hypothesis обязательно встречается в premise
    - Такая доля людей при ручной разметке выбрала бы entailment
  correct: 1
  id: 009-architecture-2
  fingerprint: e822c4a2
