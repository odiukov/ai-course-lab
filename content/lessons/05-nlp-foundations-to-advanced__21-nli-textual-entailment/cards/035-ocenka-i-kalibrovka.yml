- concept: эталонные NLI-метки нужно фиксировать независимо от предсказаний оцениваемой модели
  question: Объясните своими словами, почему при создании собственного NLI-теста правильные метки следует зафиксировать до просмотра ответов модели.
  explanation: Gold-разметка должна служить независимым эталоном. Если исправлять её после просмотра предсказаний, ошибки модели легко принять за ошибки разметки и тем самым завысить результат.
  kind: open
  reference: Независимая предварительная разметка не позволяет подгонять спорные эталонные ответы под предсказания модели. Иначе модель косвенно влияет на критерий собственной оценки, а измеренная точность становится смещённой. Неоднозначные случаи лучше отдельно согласовать между разметчиками.
  id: 035-ocenka-i-kalibrovka-3
