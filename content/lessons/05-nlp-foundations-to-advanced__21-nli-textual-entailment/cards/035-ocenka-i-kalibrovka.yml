- concept: результаты на обычных и adversarial-данных следует сообщать раздельно
  question: Почему не стоит объединять обычную NLI-выборку и набор специально сконструированных ловушек в одну метрику точности?
  explanation: Обычная выборка оценивает работу на целевом распределении, а adversarial-набор проверяет конкретные слабости. Их смешанное среднее меняется вместе с выбранной долей ловушек и плохо характеризует оба режима.
  kind: choice
  options:
    - Adversarial-примеры нельзя размечать классами NLI
    - Итоговая метрика будет зависеть от искусственной пропорции наборов и скроет различие между типичным качеством и устойчивостью к ловушкам
    - Обычные и adversarial-примеры требуют разных наборов выходных меток
    - Точность математически определена только для случайно сгенерированных примеров
  correct: 1
  id: 035-ocenka-i-kalibrovka-2
