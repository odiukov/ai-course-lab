- concept: softmax не изменяется при одинаковом сдвиге всех логитов
  question: Почему прибавление одной и той же константы ко всем логитам не меняет результат softmax?
  explanation: Для сдвига на c каждая экспонента умножается на e^c. Этот множитель сокращается при нормализации, поэтому вероятности зависят от различий между логитами, а не от их общего уровня.
  kind: open
  reference: Общий множитель, возникающий после экспоненцирования сдвинутых логитов, присутствует и в числителе, и в знаменателе, поэтому сокращается.
  id: 017-softmax-klassy-2
  fingerprint: 52cd4ccb
- concept: отношение вероятностей двух классов определяется разностью их логитов
  question: Дополните формулу отношения вероятностей двух классов после softmax.
  explanation: Общий знаменатель softmax сокращается, поэтому отношение вероятностей равно отношению экспонент логитов, то есть экспоненте их разности.
