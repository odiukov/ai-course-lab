- concept: порог entailment калибруют на репрезентативных данных с учётом цены разных ошибок
  question: Как обоснованно выбрать порог entailment для новой прикладной системы?
  explanation: 'Универсального порога истины нет. Подходящая граница зависит от распределения рабочих данных и от того, какая ошибка опаснее: пропустить неподтверждённое утверждение или отправить подтверждённое на лишнюю проверку.'
  kind: open
  reference: Собрать размеченные примеры, похожие на реальные входные данные, проверить на них несколько порогов и выбрать тот, который обеспечивает приемлемый баланс ошибок с учётом стоимости ложного допуска и ложного отклонения.
