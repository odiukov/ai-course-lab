- concept: faithfulness засчитывает только entailment, а neutral и contradiction переводит в неподдержанное утверждение
  question: Для одного утверждения NLI вернул neutral, а для другого — contradiction. Как бинарная проверка поддержки должна оценить эти результаты?
  explanation: Faithfulness требует подтверждения контекстом, поэтому засчитывается только entailment. Contradiction указывает на конфликт, а neutral — на недостаток сведений; оба результата дают False.
