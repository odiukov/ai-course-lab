- concept: контрольная точка BART, дообученная на MNLI, готова к инференсу без нового обучения
  question: Почему после создания pipeline с моделью facebook/bart-large-mnli можно сразу классифицировать пару текстов, не запуская цикл обучения?
  explanation: 'facebook/bart-large-mnli — готовая NLI-модель: её веса уже настроены на классификацию отношений между текстами. Новое обучение требуется лишь для дополнительной адаптации, а не для обычного запуска.'
  kind: open
  reference: Указанная контрольная точка уже содержит веса BART, дообученные на MNLI. Pipeline загружает готовую модель и соответствующий токенизатор, поэтому остаётся выполнить только инференс.
