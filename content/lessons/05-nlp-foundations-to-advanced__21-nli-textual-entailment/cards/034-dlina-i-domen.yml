- concept: ошибки NLI из-за несовпадения обучающего и целевого доменов
  question: Общая NLI-модель и модель, обученная на медицинских текстах, получают одну и ту же короткую выписку. Общая модель неверно интерпретирует выражение «отрицательный результат анализа», а медицинская — верно. Какова наиболее вероятная причина различия?
  explanation: Короткий вход исключает проблему длины. Ошибка связана с тем, что значения терминов и способы выражения выводов зависят от предметной области. Поэтому для медицинских, научных и юридических текстов полезны доменные NLI-модели, например MedNLI или SciNLI.
  kind: choice
  options:
    - Несовпадение домена обучения общей модели с языком медицинских текстов
    - Потеря важного фрагмента из-за ограничения окна контекста
    - Утечка метки через формулировку hypothesis
    - Неправильная нормализация логитов функцией softmax
  correct: 0
  id: 034-dlina-i-domen-1
  fingerprint: dd2e02d4
- concept: контролируемое различение проблем длины контекста и смены домена
  question: 'Как экспериментально различить две причины ошибки NLI: модель не нашла доказательство в длинном документе или неправильно поняла специализированный язык?'
  explanation: В таком тесте поочерёдно меняют только один фактор. Сокращение premise при сохранении доказательства проверяет влияние длины, а сравнение общей и специализированной моделей на одинаковом коротком входе — влияние домена.
  kind: open
  reference: Сначала сравнить ответ одной и той же модели на полном документе и на коротком фрагменте с сохранённым доказательством. Если сокращение исправляет ответ, проблема связана с длиной или поиском основания. Затем на том же коротком фрагменте сравнить общую и доменную NLI-модели. Если помогает доменная модель, причиной было несовпадение доменов.
  id: 034-dlina-i-domen-2
  fingerprint: 8d6bd715
