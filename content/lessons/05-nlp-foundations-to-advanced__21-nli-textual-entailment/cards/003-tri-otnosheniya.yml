- concept: entailment, contradiction и neutral различаются поддержкой, несовместимостью и недостатком сведений
  question: 'Premise: «Все заявки, отправленные после дедлайна, автоматически отклоняются. Заявка Иры отправлена после дедлайна». Как классифицировать hypotheses: A — «Заявку Иры отклонили»; B — «Заявку Иры приняли»; C — «Ира отправила заявку с телефона»?'
  explanation: Отклонение заявки следует из общего правила и факта о дедлайне. Принятие заявки с этим выводом несовместимо. Об устройстве, с которого отправили заявку, premise ничего не сообщает, поэтому отношение neutral.
  kind: choice
  options:
    - A — entailment, B — contradiction, C — neutral
    - A — contradiction, B — entailment, C — neutral
    - A — entailment, B — neutral, C — contradiction
    - A — neutral, B — contradiction, C — entailment
  correct: 0
  id: 003-tri-otnosheniya-1
  fingerprint: 31bea495
- concept: метка NLI характеризует отношение пары текстов, а не отдельное предложение
  question: Почему отдельному тексту нельзя навсегда присвоить метку entailment, contradiction или neutral?
  explanation: NLI классифицирует пару. Один исходный текст способен подтверждать одну hypothesis, противоречить другой и не содержать сведений для оценки третьей.
  kind: open
  reference: Метка описывает отношение между конкретными premise и hypothesis. При замене одного из текстов меняется проверяемое утверждение или основание, поэтому тот же текст может участвовать в парах с разными метками.
  id: 003-tri-otnosheniya-2
  fingerprint: 6d6f040c
