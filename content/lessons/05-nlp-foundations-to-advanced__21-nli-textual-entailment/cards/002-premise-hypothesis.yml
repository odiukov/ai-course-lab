- concept: отношение логического следования в NLI направлено и может измениться при перестановке текстов
  question: Почему перестановка premise и hypothesis может изменить результат NLI? Объясни на примере пары «Анна завела пуделя» и «Анна завела собаку».
  explanation: Логическое следование не обязано работать в обе стороны. Более конкретная premise может подтверждать обобщённую hypothesis, тогда как обобщённая premise не подтверждает дополнительные подробности из более конкретной hypothesis.
  kind: open
  reference: 'Из утверждения «Анна завела пуделя» следует, что она завела собаку, поскольку пудель — это собака. В обратном направлении вывода нет: собака могла быть другой породы. Поэтому NLI проверяет направленное отношение от premise к hypothesis, а не симметричную связь между текстами.'
  id: 002-premise-hypothesis-2
  fingerprint: 28760aff
