<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Три возможных отношения между текстами</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f5f7fb;
      --surface: #ffffff;
      --surface-soft: #eef2f8;
      --ink: #172033;
      --muted: #5d687d;
      --border: #c9d2e2;
      --trunk: #758198;
      --entailment: #16865b;
      --entailment-soft: #e2f5ec;
      --contradiction: #c54848;
      --contradiction-soft: #fbe8e8;
      --neutral: #526fa3;
      --neutral-soft: #e9effa;
      --focus: #315fbe;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #121722;
        --surface: #1b2230;
        --surface-soft: #242d3d;
        --ink: #f1f4fa;
        --muted: #aeb8ca;
        --border: #465268;
        --trunk: #8e9bb1;
        --entailment: #68d6a7;
        --entailment-soft: #173c31;
        --contradiction: #ff8c8c;
        --contradiction-soft: #492628;
        --neutral: #9bbcff;
        --neutral-soft: #253758;
        --focus: #9bbcff;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: unset;
      min-height: 100%;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: start center;
    }

    main {
      width: 100%;
      max-width: 1200px;
      background: var(--surface);
    }

    header {
      padding: 14px 24px 10px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      margin: unset;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    header p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.35;
    }

    figure {
      margin: unset;
      background: var(--surface);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 440px;
      background: var(--surface);
    }

    .canvas {
      fill: var(--surface);
    }

    .premise-box,
    .hypothesis-box {
      fill: var(--surface-soft);
      stroke: var(--border);
    }

    .premise-box {
      stroke: var(--focus);
    }

    .trunk {
      fill: none;
      stroke: var(--trunk);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .branch {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .branch.entailment,
    .arrowhead.entailment {
      stroke: var(--entailment);
    }

    .branch.contradiction,
    .arrowhead.contradiction {
      stroke: var(--contradiction);
    }

    .branch.neutral,
    .arrowhead.neutral {
      stroke: var(--neutral);
    }

    .arrowhead {
      stroke-linejoin: round;
    }

    .arrowhead.entailment,
    .tag.entailment {
      fill: var(--entailment-soft);
    }

    .arrowhead.contradiction,
    .tag.contradiction {
      fill: var(--contradiction-soft);
    }

    .arrowhead.neutral,
    .tag.neutral {
      fill: var(--neutral-soft);
    }

    .tag {
      stroke-width: 1px;
    }

    .tag.entailment {
      stroke: var(--entailment);
    }

    .tag.contradiction {
      stroke: var(--contradiction);
    }

    .tag.neutral {
      stroke: var(--neutral);
    }

    .branch-node {
      fill: var(--surface);
      stroke: var(--trunk);
    }

    text {
      fill: var(--ink);
      font-family: inherit;
    }

    .eyebrow {
      fill: var(--muted);
      font-weight: bold;
      letter-spacing: 0.04em;
    }

    .sentence {
      font-weight: bold;
    }

    .note {
      fill: var(--muted);
    }

    .relation {
      font-weight: bold;
    }

    .relation.entailment {
      fill: var(--entailment);
    }

    .relation.contradiction {
      fill: var(--contradiction);
    }

    .relation.neutral {
      fill: var(--neutral);
    }

    .fallback {
      margin: unset;
      padding: 28px;
      color: var(--ink);
      background: var(--surface);
      font-size: 18px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1 id="diagram-title">Три возможных отношения между текстами</h1>
      <p>Одно premise — три hypothesis; для каждой пары отношение определяется заново.</p>
    </header>

    <figure aria-labelledby="diagram-title">
      <svg
        id="nli-svg"
        width="1200"
        height="440"
        viewBox="0 0 1200 440"
        preserveAspectRatio="xMidYMid meet"
        role="img"
        aria-labelledby="svg-title svg-description"
      >
        <title id="svg-title">Три отношения между premise и hypothesis</title>
        <desc id="svg-description">
          Исходный текст «The cat is on the mat» разветвляется к трём проверяемым
          текстам с отношениями entailment, contradiction и neutral.
        </desc>
        <g id="diagram"></g>
      </svg>

      <p id="fallback" class="fallback" hidden>
        Схема должна была показать, как premise «The cat is on the mat» ведёт к
        трём hypothesis: «There is a cat» — entailment, «There is no cat» —
        contradiction, «The cat is hungry» — neutral.
      </p>

      <noscript>
        <p class="fallback">
          Схема: premise «The cat is on the mat» разветвляется к трём hypothesis —
          entailment, contradiction и neutral.
        </p>
      </noscript>
    </figure>
  </main>

  <script>
    const data = Object.freeze([
      {
        kind: "premise",
        box: { x: 35, y: 150, width: 330, height: 140, radius: 16 },
        labels: [
          {
            x: 35,
            y: 182,
            anchor: "start",
            role: "eyebrow",
            text: "PREMISE · исходный текст"
          },
          {
            x: 35,
            y: 231,
            anchor: "start",
            role: "sentence",
            text: "The cat is on the mat"
          },
          {
            x: 35,
            y: 268,
            anchor: "start",
            role: "note",
            text: "одно для всех трёх пар"
          }
        ],
        trunk: [
          { x: 365, y: 220 },
          { x: 470, y: 220 }
        ],
        node: { x: 470, y: 220, radius: 7 }
      },
      {
        kind: "relation",
        relation: "entailment",
        path: [
          { x: 470, y: 220 },
          { x: 470, y: 75 },
          { x: 804, y: 75 }
        ],
        arrowhead: [
          { x: 820, y: 75 },
          { x: 804, y: 65 },
          { x: 804, y: 85 }
        ],
        tag: { x: 505, y: 89, width: 230, height: 36, radius: 18 },
        tagLabel: {
          x: 620,
          y: 113,
          anchor: "middle",
          role: "relation",
          text: "entailment · следует"
        },
        hypothesis: {
          box: { x: 820, y: 20, width: 345, height: 110, radius: 16 },
          labels: [
            {
              x: 820,
              y: 50,
              anchor: "start",
              role: "eyebrow",
              text: "HYPOTHESIS · проверяемый текст"
            },
            {
              x: 820,
              y: 98,
              anchor: "start",
              role: "sentence",
              text: "There is a cat"
            }
          ]
        }
      },
      {
        kind: "relation",
        relation: "contradiction",
        path: [
          { x: 470, y: 220 },
          { x: 804, y: 220 }
        ],
        arrowhead: [
          { x: 820, y: 220 },
          { x: 804, y: 210 },
          { x: 804, y: 230 }
        ],
        tag: { x: 490, y: 234, width: 305, height: 36, radius: 18 },
        tagLabel: {
          x: 642.5,
          y: 258,
          anchor: "middle",
          role: "relation",
          text: "contradiction · противоречит"
        },
        hypothesis: {
          box: { x: 820, y: 165, width: 345, height: 110, radius: 16 },
          labels: [
            {
              x: 820,
              y: 195,
              anchor: "start",
              role: "eyebrow",
              text: "HYPOTHESIS · проверяемый текст"
            },
            {
              x: 820,
              y: 243,
              anchor: "start",
              role: "sentence",
              text: "There is no cat"
            }
          ]
        }
      },
      {
        kind: "relation",
        relation: "neutral",
        path: [
          { x: 470, y: 220 },
          { x: 470, y: 365 },
          { x: 804, y: 365 }
        ],
        arrowhead: [
          { x: 820, y: 365 },
          { x: 804, y: 355 },
          { x: 804, y: 375 }
        ],
        tag: { x: 505, y: 315, width: 250, height: 36, radius: 18 },
        tagLabel: {
          x: 630,
          y: 339,
          anchor: "middle",
          role: "relation",
          text: "neutral · не определено"
        },
        hypothesis: {
          box: { x: 820, y: 310, width: 345, height: 110, radius: 16 },
          labels: [
            {
              x: 820,
              y: 340,
              anchor: "start",
              role: "eyebrow",
              text: "HYPOTHESIS · проверяемый текст"
            },
            {
              x: 820,
              y: 388,
              anchor: "start",
              role: "sentence",
              text: "The cat is hungry"
            }
          ]
        }
      }
    ]);
    const origin = Object.freeze({ x: 0, y: 0 });
    const scale = 1;
    const canvas = Object.freeze({ width: 1200, height: 440 });
    const labelPad = 14;
    const lineWidth = 3;
    const fontSize = Object.freeze({
      eyebrow: 14,
      sentence: 22,
      note: 16,
      relation: 17
    });

    function sx(x) {
      return origin.x + x * scale;
    }

    function sy(y) {
      return origin.y + y * scale;
    }

    try {
      const namespace = "http://www.w3.org/2000/svg";
      const mount = document.getElementById("diagram");
      const fragment = document.createDocumentFragment();
      const [premise, ...relations] = data;

      const make = (name, attributes, className) => {
        const element = document.createElementNS(namespace, name);
        if (className) element.setAttribute("class", className);
        for (const [key, value] of Object.entries(attributes)) {
          element.setAttribute(key, String(value));
        }
        return element;
      };

      const pathData = points =>
        points
          .map((point, position) =>
            `${position ? "L" : "M"} ${sx(point.x)} ${sy(point.y)}`
          )
          .join(" ");

      const polygonData = points =>
        points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" ");

      const drawRect = (box, className) =>
        make(
          "rect",
          {
            x: sx(box.x),
            y: sy(box.y),
            width: sx(box.x + box.width) - sx(box.x),
            height: sy(box.y + box.height) - sy(box.y),
            rx: sx(box.radius) - sx(0),
            ry: sy(box.radius) - sy(0),
            "stroke-width": lineWidth
          },
          className
        );

      const drawLabel = (label, extraClass) => {
        const className = [label.role, extraClass].filter(Boolean).join(" ");
        const element = make(
          "text",
          {
            x: sx(label.x),
            y: sy(label.y),
            "text-anchor": label.anchor,
            "font-size": fontSize[label.role]
          },
          className
        );

        if (label.anchor === "start") element.setAttribute("dx", labelPad);
        if (label.anchor === "end") element.setAttribute("dx", -labelPad);
        element.textContent = label.text;
        return element;
      };

      fragment.append(
        make(
          "rect",
          {
            x: sx(0),
            y: sy(0),
            width: sx(canvas.width) - sx(0),
            height: sy(canvas.height) - sy(0)
          },
          "canvas"
        )
      );

      fragment.append(
        make(
          "path",
          {
            d: pathData(premise.trunk),
            "stroke-width": lineWidth
          },
          "trunk"
        )
      );

      for (const relation of relations) {
        fragment.append(
          make(
            "path",
            {
              d: pathData(relation.path),
              "stroke-width": lineWidth
            },
            `branch ${relation.relation}`
          )
        );

        fragment.append(
          make(
            "polygon",
            {
              points: polygonData(relation.arrowhead),
              "stroke-width": lineWidth
            },
            `arrowhead ${relation.relation}`
          )
        );
      }

      fragment.append(
        make(
          "circle",
          {
            cx: sx(premise.node.x),
            cy: sy(premise.node.y),
            r: sx(premise.node.radius) - sx(0),
            "stroke-width": lineWidth
          },
          "branch-node"
        )
      );

      fragment.append(drawRect(premise.box, "premise-box"));
      for (const label of premise.labels) {
        fragment.append(drawLabel(label));
      }

      for (const relation of relations) {
        fragment.append(drawRect(relation.tag, `tag ${relation.relation}`));
        fragment.append(drawLabel(relation.tagLabel, relation.relation));
        fragment.append(drawRect(relation.hypothesis.box, "hypothesis-box"));

        for (const label of relation.hypothesis.labels) {
          fragment.append(drawLabel(label));
        }
      }

      mount.replaceChildren(fragment);
    } catch (error) {
      document.getElementById("nli-svg").setAttribute("hidden", "");
      document.getElementById("fallback").removeAttribute("hidden");
    }
  </script>
</body>
</html>
