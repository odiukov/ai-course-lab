- concept: нелинейная активация не позволяет двум слоям FFN свернуться в одно линейное преобразование
  question: Почему между двумя линейными преобразованиями FFN нужна нелинейная функция активации?
  explanation: Без активации выражение W₂(W₁x) можно заменить одной матрицей W₂W₁, поэтому расширение скрытого слоя не добавит нелинейной выразительности. Активация разрывает эту эквивалентность.
  kind: choice
  options:
    - Без неё композиция преобразований эквивалентна одному линейному преобразованию
    - Она позволяет FFN обмениваться информацией между разными позициями
    - Она автоматически добавляет к векторам позиционные сигналы
    - Она вычисляет веса self-attention
