- concept: RMSNorm устраняет положительное общее масштабирование входного вектора
  question: Вход RMSNorm умножили на положительную константу, а eps настолько мал, что им можно пренебречь. Как изменится выход при неизменном gamma?
  explanation: Среднеквадратичный масштаб увеличивается во столько же раз, во сколько и вход. В отношении x к его RMS эти множители сокращаются; ненулевой eps делает равенство лишь приближённым для очень малых входов.
