- concept: финальная RMSNorm должна применяться до словарной проекции, а не к готовым логитам
  question: Расположите операции финальной части полного Transformer в правильном порядке.
  explanation: Правильная последовательность — сначала нормализовать скрытые представления, затем выполнить словарную проекцию. Нормализация после W_vocab работала бы уже в пространстве словаря и не была бы эквивалентна нормализации входа этой матрицы.
  kind: order
  items:
    - Получить residual stream из последнего блока декодера
    - Применить финальную RMSNorm отдельно к каждой позиции
    - Умножить нормализованные представления на W_vocab
    - Получить вектор логитов по словарю для каждой позиции
