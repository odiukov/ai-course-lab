- concept: прямое residual-сложение требует одинаковой размерности входа и выхода подслоя
  question: Вектор x имеет размерность 768. Какой размерности должен быть результат sublayer(x), чтобы выражение x + sublayer(x) было определено без дополнительной проекции?
  explanation: Обычное покомпонентное сложение определено для векторов одинаковой размерности. Поэтому подслой должен вернуть вектор размерности 768; иначе перед сложением потребовалась бы проекция.
