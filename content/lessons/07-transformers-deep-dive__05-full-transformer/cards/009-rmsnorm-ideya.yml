- concept: RMSNorm использует среднеквадратичное значение координат без вычитания среднего
  question: Для вектора x = [9, 10, 11, 12, 13] вычислите RMS(x), пренебрегая epsilon.
  explanation: Среднее квадратов равно (81 + 100 + 121 + 144 + 169) / 5 = 123. Поэтому RMS(x) = √123 ≈ 11.09. В отличие от LayerNorm, среднее самого вектора здесь не вычисляется и не вычитается.
  kind: numeric
  answer: 11.09
  tolerance: 0.01
  id: 009-rmsnorm-ideya-1
  fingerprint: 55438b34
- concept: RMSNorm чувствительна к общему сдвигу координат, поскольку не центрирует вектор
  question: Объясните своими словами, почему добавление одной и той же константы ко всем координатам влияет на результат RMSNorm, но устраняется при LayerNorm.
  explanation: Центрирование делает LayerNorm инвариантной к общему сдвигу. RMSNorm отказывается от центрирования ради более простого вычисления, поэтому сохраняет чувствительность к такому сдвигу.
  kind: open
  reference: 'LayerNorm сначала вычитает среднее, поэтому общий сдвиг увеличивает и координаты, и среднее на одну величину и сокращается при вычитании. RMSNorm не вычитает среднее: сдвинутые координаты дают другое среднее квадратов и другой нормализованный вектор.'
  id: 009-rmsnorm-ideya-2
  fingerprint: '54308035'
