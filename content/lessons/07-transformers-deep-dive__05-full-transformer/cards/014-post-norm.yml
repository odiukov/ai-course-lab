- concept: post-norm применяет нормализацию после residual-сложения ко всей полученной сумме
  question: Какая формула описывает post-norm Transformer-блок с входом x и подслоем F?
  explanation: 'В post-norm сначала вычисляют результат подслоя, складывают его с исходным входом и лишь затем нормализуют всю residual-сумму: LN(x + F(x)).'
  kind: choice
  options:
    - x + F(LN(x))
    - LN(x + F(x))
    - x + LN(F(x))
  correct: 1
  id: 014-post-norm-1
  fingerprint: 2c45221a
- concept: post-norm прерывает прямой тождественный путь сигнала и градиента через глубокую стопку блоков
  question: Почему глубокий Transformer с post-norm обычно труднее обучать, чем аналогичную модель с pre-norm?
  explanation: 'Residual-ветвь post-norm не обходит LayerNorm: нормализация стоит после сложения и затрагивает весь выход блока. Последовательность таких преобразований усложняет распространение градиента, поэтому глубоким post-norm-моделям особенно важен аккуратный warmup.'
  kind: open
  reference: В post-norm каждая residual-сумма проходит через нормализацию, поэтому через стопку блоков нет прямого тождественного пути. И сигнал, и градиент на каждом блоке преобразуются нормализацией, что повышает чувствительность глубоких моделей к инициализации и режиму разогрева обучения.
  id: 014-post-norm-2
  fingerprint: 914751d0
