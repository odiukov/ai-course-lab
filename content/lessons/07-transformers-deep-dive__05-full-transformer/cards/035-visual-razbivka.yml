- concept: число параметров характеризует объём весов компонента, но не его функциональную важность
  question: Полоса разбита на сегменты пропорционально числу обучаемых параметров компонентов Transformer-блока. Какие выводы о компонентах можно и нельзя сделать только по ширине этих сегментов?
  explanation: В разобранном блоке FFN хранит около двух третей весов, attention — около трети, а RMSNorm — лишь примерно три сотых процента. Однако малая доля весов нормализации не означает, что её можно удалить без потери устойчивости глубокой модели.
  kind: open
  reference: По ширине сегмента можно судить о числе хранимых обучаемых коэффициентов и соответствующей памяти для весов. Нельзя только на этом основании судить о важности компонента для обучения, объёме активаций или полном времени вычислений.
