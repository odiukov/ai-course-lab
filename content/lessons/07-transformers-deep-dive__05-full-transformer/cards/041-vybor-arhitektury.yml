- concept: decoder-only является естественным выбором для авторегрессивной генерации текста
  question: Почему для чат-бота, который формирует ответ токен за токеном, обычно выбирают decoder-only Transformer?
  explanation: Текстовый ответ создаётся последовательно, поэтому модели нужен каузальный механизм генерации без доступа к будущим токенам. Decoder-only реализует его в одной масштабируемой стопке блоков.
  kind: open
  reference: 'Decoder-only Transformer предназначен для авторегрессивного порождения: каждый следующий токен вычисляется только по уже доступному контексту. Такая архитектура не требует отдельного энкодера и хорошо совмещает обработку текстового запроса с продолжением текста.'
  id: 041-vybor-arhitektury-3
  fingerprint: e2060e0b
