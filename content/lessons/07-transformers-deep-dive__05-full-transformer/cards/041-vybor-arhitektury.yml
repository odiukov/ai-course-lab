- concept: encoder-decoder подходит для преобразования отдельной исходной последовательности в порождаемую целевую последовательность
  question: Модель получает аудиозапись целиком и должна последовательно породить её текстовую расшифровку. Какую архитектуру целесообразнее использовать?
  explanation: 'Здесь источник и результат имеют разные роли: энкодер представляет аудиозапись, а декодер порождает текст, обращаясь к представлению источника через cross-attention.'
  kind: choice
  options:
    - Encoder-only
    - Decoder-only без отдельного представления источника
    - Encoder-decoder
  correct: 2
