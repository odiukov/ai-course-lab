- concept: энкодерный self-attention является двунаправленным и не использует каузальную маску
  question: Какие позиции может учитывать токен в стандартном блоке энкодера Transformer?
  explanation: В энкодере нет каузальной маски, поэтому каждая позиция может обращать внимание как на левый, так и на правый контекст. Ограничение на просмотр будущих позиций требуется декодеру при авторегрессивной генерации.
  kind: choice
  options:
    - Только предшествующие позиции
    - Только последующие позиции
    - Все позиции входной последовательности
    - Только собственную позицию
  correct: 2
  id: 017-visual-encoder-1
  fingerprint: 5a3c420e
- concept: в self-attention запросы, ключи и значения строятся из одного потока представлений
  question: Откуда берутся query, key и value в self-attention блока энкодера?
  explanation: При self-attention текущий поток энкодера проецируется обучаемыми матрицами в query, key и value. Использование разных потоков для запросов и пар ключ–значение характерно для cross-attention.
  kind: choice
  options:
    - Все три строятся из текущих представлений энкодера
    - Query строятся из энкодера, а key и value — из декодера
    - Query строятся из декодера, а key и value — из энкодера
    - Все три являются фиксированными необучаемыми векторами
  correct: 0
  id: 017-visual-encoder-2
  fingerprint: 32c26b5c
