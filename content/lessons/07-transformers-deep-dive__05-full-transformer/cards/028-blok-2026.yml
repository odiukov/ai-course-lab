- concept: GQA уменьшает KV-cache благодаря совместному использованию голов K и V несколькими головами Q
  question: Объясните, почему GQA требует меньше памяти для KV-cache при авторегрессивной генерации, не сокращая количество голов запросов.
  explanation: При генерации запрос текущего токена вычисляется заново, а ключи и значения прошлых токенов приходится хранить. GQA группирует головы Q вокруг общего набора K/V-голов и тем самым уменьшает объём сохраняемых тензоров.
  kind: open
  reference: Несколько отдельных голов Q используют общую голову K и общую голову V. Для прошлых токенов сохраняются именно ключи и значения, поэтому уменьшение числа K/V-голов сокращает KV-cache, тогда как головы Q могут оставаться раздельными.
  id: 028-blok-2026-2
  fingerprint: d7e63499
