- concept: полный бюджет модели включает параметры вне повторяющейся стопки блоков и зависит от связывания входных и выходных весов
  question: Что нужно учесть после подсчёта параметров всех Transformer-блоков, чтобы получить полный размер языковой модели?
  explanation: Эмбеддинги и выходная голова содержат обучаемые веса, но не входят в повторяющиеся блоки. Если веса не связаны, обе матрицы считаются отдельно; KV-cache, attention scores и состояния оптимизатора не являются параметрами модели.
  kind: choice
  options:
    - Таблицу входных эмбеддингов и выходную проекцию на словарь, учитывая, связаны ли их веса
    - KV-cache для максимально допустимой длины контекста
    - Матрицы attention scores для всех возможных входных последовательностей
    - Состояния оптимизатора, используемые во время обучения
