- concept: отношение числа параметров SwiGLU FFN к обычному MHA определяется коэффициентом расширения
  question: В Transformer-блоке используются обычный MHA и SwiGLU FFN с коэффициентом расширения 3,2. Во сколько раз в FFN больше параметров, чем в attention?
  explanation: 'Отношение равно (3rd²) / (4d²) = 3r / 4. При r = 3,2 получаем 2,4: FFN заметно тяжелее attention.'
  kind: numeric
  answer: 2.4
  tolerance: 0.01
  id: 033-check-512-1
  fingerprint: d88e335a
- concept: при фиксированном коэффициенте расширения параметры attention и FFN одинаково квадратично масштабируются с шириной модели
  question: Ширину модели увеличили с 320 до 960, сохранив тип attention и коэффициент расширения FFN. Как изменятся числа параметров этих подслоёв?
  explanation: Обе формулы пропорциональны d². Увеличение d втрое умножает оба числа параметров на девять, поэтому относительный вес FFN и attention остаётся прежним.
  kind: choice
  options:
    - Оба увеличатся в девять раз, а их отношение не изменится
    - Оба увеличатся втрое, потому что ширина выросла втрое
    - Attention увеличится в девять раз, а FFN — втрое
    - FFN увеличится в девять раз, а attention не изменится
