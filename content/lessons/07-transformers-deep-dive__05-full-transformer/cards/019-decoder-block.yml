- concept: порядок подслоёв в полном блоке декодера Transformer
  question: Расположите подслои полного декодерного блока Transformer в порядке обработки представлений.
  explanation: Сначала декодер учитывает ранее сгенерированные токены, затем получает информацию от энкодера через cross-attention и после этого преобразует результат с помощью FFN.
  kind: order
  items:
    - Masked self-attention по уже сформированной части выходной последовательности
    - Cross-attention к выходам энкодера
    - Позиционно-независимая FFN
  id: 019-decoder-block-1
  fingerprint: 334c08f9
- concept: cross-attention служит единственным каналом передачи информации от энкодера к декодеру
  question: Какой подслой полного декодера Transformer непосредственно передаёт в поток декодера информацию из выходов энкодера?
  explanation: Masked self-attention работает с представлениями самого декодера, а FFN преобразует каждую позицию. Непосредственный доступ к выходам энкодера предоставляет cross-attention.
  kind: choice
  options:
    - Masked self-attention
    - Cross-attention
    - FFN
    - Выходная проекция на словарь
  correct: 1
  id: 019-decoder-block-2
  fingerprint: 12d0ac37
- concept: decoder-only Transformer не содержит cross-attention из-за отсутствия отдельного энкодера
  question: Объясните, почему в decoder-only модели наподобие GPT отсутствует cross-attention.
  explanation: 'Cross-attention связывает два потока: представления декодера и выходы энкодера. Если отдельного энкодера нет, источник ключей и значений для такого межпоточного внимания отсутствует.'
  kind: open
  reference: В decoder-only архитектуре нет отдельного энкодера и его выходных представлений, к которым мог бы обращаться декодер. Поэтому cross-attention не нужен, а блок состоит из masked self-attention и FFN.
  id: 019-decoder-block-3
  fingerprint: 3d32de91
