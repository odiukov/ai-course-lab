- concept: SiLU не обнуляет всю отрицательную полуось и сохраняет зависимость выхода от отрицательного входа
  question: Какое утверждение верно для SiLU(x) = x·σ(x) при отрицательном x?
  explanation: Сигмоида лежит между 0 и 1, поэтому умножение на неё сохраняет знак отрицательного x, но уменьшает его модуль. В отличие от ReLU, SiLU не превращает всю отрицательную полуось в один и тот же нулевой выход.
  kind: choice
  options:
    - Выход всегда равен нулю, как у ReLU
    - Выход положителен, потому что сигмоида положительна
    - Выход равен входу без изменений
    - Выход отрицателен и плавно зависит от входа, поэтому разные отрицательные входы обычно различимы
  correct: 3
  id: 022-silu-ideya-1
  fingerprint: b7b705ba
- concept: значение SiLU вычисляется как произведение входа на его сигмоиду
  question: Для x = −6 значение σ(x) примерно равно 0,00247. Чему примерно равна SiLU(x)?
  explanation: SiLU(x) = x·σ(x), поэтому −6·0,00247 ≈ −0,0148. Для сильно отрицательного входа результат близок к нулю, но не обнуляется точно, как у ReLU.
  kind: numeric
  answer: -0.0148
  tolerance: 0.001
