- concept: residual connection сохраняет путь для сигнала и градиента, а нормализация стабилизирует масштаб residual stream
  question: Объясни своими словами, зачем блоку трансформера одновременно нужны residual connection и нормализация.
  explanation: Residual connection помогает информации и градиентам проходить через глубокую сеть, а LayerNorm или RMSNorm не даёт масштабу значений бесконтрольно изменяться.
  kind: open
  reference: Residual connection прибавляет вход подслоя к его выходу, сохраняя прямой путь для исходного сигнала и градиента. Нормализация контролирует масштаб значений в residual stream. Эти механизмы решают разные задачи и вместе делают глубокую сеть устойчивее при обучении.
  id: 002-shest-detalei-3
  fingerprint: 4ca8be55
