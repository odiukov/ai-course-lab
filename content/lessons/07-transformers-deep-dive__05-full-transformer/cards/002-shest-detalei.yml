- concept: в cross-attention запросы берутся из декодера, а ключи и значения — из выхода энкодера
  question: Декодер обрабатывает последовательность, опираясь на представления, подготовленные энкодером. Откуда в cross-attention поступают query, key и value?
  explanation: Состояние декодера задаёт, какую информацию нужно найти, поэтому из него формируются query. Выход энкодера служит источником информации и даёт key и value.
  kind: choice
  options:
    - Query — из декодера; key и value — из выхода энкодера
    - Query — из энкодера; key и value — из декодера
    - Query и key — из энкодера; value — из декодера
    - Query, key и value — только из декодера
