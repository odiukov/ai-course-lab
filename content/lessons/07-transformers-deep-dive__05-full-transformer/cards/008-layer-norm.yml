- concept: LayerNorm нормализует каждый токен независимо по оси признаков
  question: Тензор Transformer имеет форму (batch, sequence, features). По каким элементам LayerNorm должен вычислять среднее и дисперсию?
  explanation: LayerNorm считает статистики только по последней оси, поэтому каждый токен нормализуется независимо от других токенов и примеров батча. В тензоре формы (batch, seq, d_model) результат сохраняет ту же форму.
  kind: choice
  options:
    - По признакам каждого токена отдельно
    - По всем примерам батча для каждого признака
    - По всем токенам последовательности для каждого признака
    - По всем элементам тензора одновременно
  correct: 0
  id: 008-layer-norm-1
  fingerprint: abcb5aad
- concept: epsilon добавляется к дисперсии внутри квадратного корня для численной устойчивости
  question: Заполни пропуск в вычислении нормализованных значений.
  explanation: Малая положительная добавка внутри корня не даёт знаменателю стать нулевым, когда дисперсия равна нулю. В уроке в качестве типичного значения приводится 1e-5.
  kind: cloze
  template: normalized = (x - mean) / torch.sqrt(variance + ___)
  answer: eps
  accept:
    - epsilon
    - ε
  id: 008-layer-norm-2
  fingerprint: eca96570
- concept: обучаемые gamma и beta возвращают нормализации возможность выбирать масштаб и сдвиг
  question: Зачем после стандартизации LayerNorm применяет обучаемые параметры gamma и beta и как их обычно инициализируют?
  explanation: Стандартизация фиксирует среднее и разброс, но подходящий следующему подслою масштаб может быть другим. Обучаемые gamma и beta дают модели эту свободу; начальные единицы и нули делают аффинное преобразование нейтральным.
  kind: open
  reference: Gamma и beta позволяют модели подобрать отдельные масштаб и сдвиг для каждого признака. Gamma инициализируют единицами, а beta — нулями, чтобы в начале обучения аффинная часть не изменяла стандартизованные значения.
  id: 008-layer-norm-3
  fingerprint: e1cf30e4
