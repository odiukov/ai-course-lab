- concept: SwiGLU перемножает активированную управляющую проекцию и независимую проекцию содержимого
  question: Заполни пропуск в формуле SwiGLU.
  explanation: Один и тот же вход проходит через две независимые проекции. Результат SiLU в управляющей ветке поэлементно умножается на проекцию содержимого, после чего W_out возвращает вектор к размерности модели.
  kind: cloze
  template: SwiGLU(x) = W_out(SiLU(W_gate x) ⊙ ___)
  answer: W_value x
  accept:
    - W_value*x
    - W_value(x)
  id: 024-swiglu-ideya-1
  fingerprint: 55792e2b
- concept: вентиль применяется покоординатно, хотя его значение может зависеть от всего входного вектора
  question: Пусть матрица управляющей ветки SwiGLU является плотной. Как точнее всего описать работу одной координаты вентиля?
  explanation: Плотная проекция позволяет каждой координате вентиля учитывать все признаки входа. Однако оператор ⊙ действует поэлементно, поэтому полученное значение управляет только парной координатой содержимого.
  kind: choice
  options:
    - Она вычисляется только из соответствующей координаты входа и управляет всем выходным вектором
    - Она вычисляется из всего входного вектора и умножается только на соответствующую координату ветки содержимого
    - Она вычисляется из всего входного вектора и умножается на каждую координату ветки содержимого
    - Она выбирает одну строку выходной матрицы, не выполняя умножения
  correct: 1
  id: 024-swiglu-ideya-2
  fingerprint: 52a58b56
- concept: дополнительная проекция SwiGLU требует уменьшить скрытую ширину для сохранения бюджета параметров
  question: Почему при одинаковом бюджете параметров скрытый слой SwiGLU-FFN обычно делают уже, чем скрытый слой обычного ReLU-FFN?
  explanation: SwiGLU оплачивает две параллельные проекции из размерности модели в скрытое пространство и одну обратную проекцию. Сужение скрытого пространства компенсирует стоимость дополнительной матрицы.
  kind: open
  reference: У обычного FFN есть проекции вверх и вниз, а SwiGLU использует дополнительную независимую проекцию вверх для второй ветки. Поэтому каждый скрытый канал требует больше весов, и для сохранения общего числа параметров количество таких каналов уменьшают.
  id: 024-swiglu-ideya-3
  fingerprint: f14cc704
