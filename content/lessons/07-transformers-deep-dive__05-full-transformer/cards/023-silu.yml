- concept: поэлементная SiLU сохраняет форму входного тензора
  question: Какую форму должен иметь результат SiLU и почему эта активация не изменяет размеры тензора?
  explanation: 'SiLU является поэлементной активацией: каждому входному элементу соответствует ровно один выходной элемент. Поэтому меняются значения, но не количество осей и не их размеры.'
  kind: open
  reference: Результат должен иметь ту же форму, что и вход. SiLU независимо преобразует каждый элемент и не выполняет свёртку, агрегацию или смешивание координат.
  id: 023-silu-2
  fingerprint: d7af18e3
- concept: SiLU имеет локальный минимум на отрицательной полуоси и не является монотонной
  question: Как ведёт себя SiLU, если увеличивать аргумент от очень большого отрицательного значения к положительным значениям?
  explanation: На отрицательной полуоси производная SiLU меняет знак, поэтому график сначала убывает, достигает неглубокого минимума, а затем растёт. При уходе аргумента к отрицательной бесконечности значение стремится к нулю снизу.
  kind: choice
  options:
    - Монотонно растёт от нуля, никогда не опускаясь ниже него
    - Сначала опускается ниже нуля до локального минимума, затем начинает расти
    - Остаётся равной нулю на всей отрицательной полуоси, затем линейно растёт
    - Монотонно убывает и стремится к отрицательной бесконечности
  correct: 1
