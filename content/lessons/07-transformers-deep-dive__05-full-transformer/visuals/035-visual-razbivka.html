<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Куда уходят веса слоя</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1a1a1a; --muted:#5c6470;
    --attn:#3b7dd8; --ffn:#e07b39; --axis:#9aa3ad; --grid:#e3e7ec;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171c; --fg:#e8ecf1; --muted:#9aa3ad;
      --attn:#6aa8ff; --ffn:#ffa25c; --axis:#5c6470; --grid:#242a32;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:960px;margin:0 auto;padding:12px 8px;}
  h1{font-size:15px;margin:0 0 6px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .fail{font-size:13px;color:var(--muted);line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Куда уходят веса слоя: attention против FFN</h1>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    // ---- данные схемы (млн параметров) ----
    var GROUPS = [
      { key:'d512', title:'d = 512, полный MHA',
        bars:[ {label:'attention', v:1.05, cls:'attn'},
               {label:'FFN',       v:2.05, cls:'ffn'} ],
        note:'≈ 3,1 млн на слой' },
      { key:'llama', title:'Llama 3 8B, GQA',
        bars:[ {label:'attention', v:41.9,  cls:'attn'},
               {label:'FFN',       v:176.2, cls:'ffn'} ],
        note:'218 млн на слой' }
    ];
    var MAXV = 218;          // верх шкалы = итог на слой
    var TICKS = [0, 50, 100, 150, 200];

    // ---- холст (литералы) ----
    var VBW = 900, VBH = 470;

    // ---- одна пара функций перевода ----
    // x: единицы сетки колонок (0..8), y: млн параметров (0..MAXV)
    var ORIGIN = { x:150, y:400 };
    var SCALE  = { x:88, y:-1.55 };
    function sx(x){ return ORIGIN.x + x * SCALE.x; }
    function sy(y){ return ORIGIN.y + y * SCALE.y; }

    // отступы подписей (пиксели — разрешённые литералы)
    var PAD = 8, PADX = 10, FS = 13, FSS = 12, LW = 1.4;

    // позиции столбиков в единицах сетки
    var HALF = 0.34;
    var SLOTS = [ [0.55, 1.55], [4.35, 5.35] ];
    var TITLE_X = [1.05, 4.85];

    var NS='http://www.w3.org/2000/svg';
    function el(n,a){ var e=document.createElementNS(NS,n);
      for(var k in a) e.setAttribute(k,a[k]); return e; }
    function txt(x,y,s,anchor,cls,size){
      var t=el('text',{x:x,y:y,'text-anchor':anchor,
        'font-size':(size||FS),fill:'currentColor'});
      if(cls) t.setAttribute('class',cls);
      t.textContent=s; return t;
    }

    var svg = el('svg',{viewBox:'0 0 '+VBW+' '+VBH,
      preserveAspectRatio:'xMidYMid meet',role:'img'});
    svg.appendChild(el('rect',{x:0,y:0,width:VBW,height:VBH,fill:'var(--bg)'}));

    // ---- сетка и ось Y ----
    var g = el('g',{});
    TICKS.forEach(function(t){
      g.appendChild(el('line',{x1:sx(0),y1:sy(t),x2:sx(6.1),y2:sy(t),
        stroke:'var(--grid)','stroke-width':LW}));
      g.appendChild(txt(sx(0)-PADX, sy(t)+4, String(t), 'end', null, FSS));
    });
    g.appendChild(el('line',{x1:sx(0),y1:sy(0),x2:sx(6.1),y2:sy(0),
      stroke:'var(--axis)','stroke-width':LW+0.6}));
    g.appendChild(el('line',{x1:sx(0),y1:sy(0),x2:sx(0),y2:sy(MAXV),
      stroke:'var(--axis)','stroke-width':LW+0.6}));
    g.appendChild(txt(sx(0)-PADX, sy(MAXV)-PAD, 'млн параметров','end',null,FSS));
    svg.appendChild(g);

    // ---- столбики ----
    GROUPS.forEach(function(grp, gi){
      var gg = el('g',{});
      grp.bars.forEach(function(b, bi){
        var cx = SLOTS[gi][bi];
        var col = b.cls==='attn' ? 'var(--attn)' : 'var(--ffn)';
        var top = sy(b.v), base = sy(0);
        gg.appendChild(el('rect',{
          x:sx(cx-HALF), y:Math.min(top,base),
          width:sx(cx+HALF)-sx(cx-HALF), height:Math.abs(base-top),
          fill:col, rx:3 }));
        // значение — над столбиком, middle
        var val = b.v < 10 ? b.v.toFixed(2).replace('.',',')
                           : b.v.toFixed(1).replace('.',',');
        gg.appendChild(txt(sx(cx), top-PAD, val+' млн','middle',null,FSS));
        // имя части — под осью, middle
        gg.appendChild(txt(sx(cx), sy(0)+PAD+FS, b.label,'middle',null,FSS));
      });
      // заголовок группы — ниже имён частей
      gg.appendChild(txt(sx(TITLE_X[gi]), sy(0)+PAD+FS*2.6,
        grp.title,'middle',null,FS));
      gg.appendChild(txt(sx(TITLE_X[gi]), sy(0)+PAD+FS*4.1,
        grp.note,'middle','muted',FSS));
      svg.appendChild(gg);
    });

    // ---- линия итога 218 млн, подпись у хвоста слева ----
    svg.appendChild(el('line',{x1:sx(0),y1:sy(MAXV),x2:sx(6.1),y2:sy(MAXV),
      stroke:'var(--axis)','stroke-width':LW,'stroke-dasharray':'5 4'}));
    svg.appendChild(txt(sx(6.1)+PADX, sy(MAXV)+4,
      'итог 218 млн','start',null,FSS));

    // ---- доли: FFN ≈ 2/3 полосы ----
    svg.appendChild(txt(sx(6.1)+PADX, sy(176.2)+4,
      'FFN ≈ 2/3','start',null,FSS));
    svg.appendChild(txt(sx(6.1)+PADX, sy(41.9)+4,
      'attention ≈ 1/3','start',null,FSS));

    // ---- легенда строкой снизу ----
    var ly = sy(0)+PAD+FS*6.2, lx = sx(0);
    var leg = el('g',{});
    var items = [['var(--attn)','attention'],['var(--ffn)','FFN']];
    items.forEach(function(it,i){
      var x = lx + i*sx(1.6)-i*sx(0);
      leg.appendChild(el('rect',{x:x,y:ly-FSS+2,width:FSS,height:FSS,
        fill:it[0],rx:2}));
      leg.appendChild(txt(x+FSS+6, ly+1, it[1],'start',null,FSS));
    });
    svg.appendChild(leg);

    // общий стиль приглушённых подписей
    var st = document.createElementNS(NS,'style');
    st.textContent = '.muted{fill:var(--muted)}';
    svg.appendChild(st);

    host.appendChild(svg);
  }catch(e){
    host.innerHTML = '<p class="fail">Схема должна была показать две пары '+
      'столбиков по числу параметров на слой. При d = 512 с полным MHA: '+
      'attention ≈ 1,05 млн против FFN ≈ 2,05 млн — FFN примерно вдвое '+
      'больше. У Llama 3 8B с GQA: attention 41,9 млн против FFN 176,2 млн, '+
      'итог 218 млн на слой — FFN занимает около двух третей блока, '+
      'attention около трети.</p>';
  }
})();
</script>
</body>
</html>
