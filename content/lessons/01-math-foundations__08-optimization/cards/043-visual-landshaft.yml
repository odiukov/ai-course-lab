- concept: при одинаковом перепаде потерь плотность линий уровня указывает на величину градиента
  question: Соседние линии уровня на двух участках карты отличаются на одинаковую величину потерь. На участке A линии расположены заметно плотнее, чем на участке B. Где модуль градиента обычно больше?
  explanation: Один и тот же перепад потерь на меньшем расстоянии означает более крутой склон и больший модуль градиента. Редкие линии соответствуют более пологой поверхности.
  kind: choice
  options:
    - На участке A
    - На участке B
    - Одинаков на обоих участках
  correct: 0
  id: 043-visual-landshaft-1
  fingerprint: 3db9a600
- concept: двумерный срез не показывает поведение функции потерь во всех направлениях пространства параметров
  question: На двумерном срезе функции потерь точка выглядит как дно миски. Почему этого недостаточно, чтобы объявить её локальным минимумом полной модели?
  explanation: У нейросети могут быть миллионы параметров, а плоская карта отображает лишь два направления или их проекцию. Поэтому минимум на таком срезе не обязательно является минимумом во всём пространстве весов.
  kind: open
  reference: Срез показывает изменение потерь только в двух выбранных направлениях. В многомерном пространстве может существовать не показанное на карте направление, вдоль которого потери уменьшаются.
  id: 043-visual-landshaft-2
  fingerprint: 82d93673
