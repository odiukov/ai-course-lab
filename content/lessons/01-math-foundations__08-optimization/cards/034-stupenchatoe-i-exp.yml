- concept: при ступенчатом затухании learning rate умножается на коэффициент столько раз, сколько пройдено границ снижения
  question: Начальный learning rate равен 0.027. В конце каждой 6-й эпохи его умножают на 0.4. Каким будет learning rate сразу после завершения 18-й эпохи?
  explanation: Снижение происходит после 6-й, 12-й и 18-й эпох — всего три раза. Поэтому learning rate равен 0.027 × 0.4³ = 0.001728.
  kind: numeric
  answer: 0.001728
  tolerance: 0.000001
  id: 034-stupenchatoe-i-exp-1
  fingerprint: 8350895c
- concept: экспоненциальное затухание задаёт постоянный мультипликативный коэффициент между шагами
  question: Для экспоненциального расписания lr_t = lr_start · d^t выразите отношение learning rate в моменты t + k и t.
  explanation: После сокращения lr_start и d^t остаётся d^k. Поэтому за одинаковое число шагов learning rate всегда уменьшается в одно и то же число раз, хотя абсолютная величина уменьшения со временем становится меньше.
  kind: cloze
  template: lr_{t+k} / lr_t = ___
  answer: d^k
  accept:
    - d**k
    - d^{k}
  id: 034-stupenchatoe-i-exp-2
  fingerprint: dbf2fffe
