- concept: единый learning rate создаёт компромисс между устойчивостью поперёк узкой долины и скоростью движения вдоль неё
  question: Объясни своими словами, почему простое изменение единого learning rate обычно не устраняет медленное движение градиентного спуска в узкой долине.
  explanation: Одно значение learning rate масштабирует все компоненты обновления одинаково, хотя крутое поперечное и пологое продольное направления требуют разных размеров шага. Поэтому настройка единого learning rate не снимает сам конфликт.
  kind: open
  reference: Большой learning rate ускоряет движение вдоль долины, но одновременно усиливает поперечные скачки и может сделать спуск неустойчивым. Малый learning rate сдерживает эти скачки, однако ещё сильнее замедляет полезное продвижение вдоль пологого направления.
