- concept: новая скорость момента складывается из затухающей прошлой скорости и свежего градиента
  question: Для одной координаты параметра предыдущая скорость равна 2.4, коэффициент β равен 0.75, а свежий градиент равен −0.6. Чему равна новая скорость после обновления v = βv + g?
  explanation: 'Подставляем значения: v = 0.75 · 2.4 − 0.6 = 1.2. Прошлая скорость входит с коэффициентом β, а свежий градиент прибавляется без дополнительного множителя.'
  kind: numeric
  answer: 1.2
  tolerance: 0.001
  id: 018-formula-momenta-1
  fingerprint: 3d91ea84
- concept: в momentum веса обновляются по накопленной скорости, а не непосредственно по свежему градиенту
  question: Заполни пропуск в обновлении параметров оптимизатора с momentum.
  explanation: 'Сначала свежий градиент включается в скорость v, после чего именно эта накопленная скорость задаёт изменение весов: w ← w − lr · v.'
  kind: cloze
  template: |-
    v ← βv + g
    w ← ___
  answer: w - lr * v
  accept:
    - w − lr · v
    - w-lr*v
    - w - learning_rate * v
  id: 018-formula-momenta-2
  fingerprint: c6aff162
- concept: увеличение β усиливает инерцию оптимизатора и замедляет его реакцию на смену направления
  question: Что при прочих равных произойдёт, если увеличить β в формуле momentum?
  explanation: Чем больше β, тем большая доля прежней скорости переносится в следующее обновление. Поэтому траектория становится более инерционной и гладкой, но хуже приспосабливается к резкому изменению направления.
  kind: choice
  options:
    - Скорость будет дольше сохранять историю, но медленнее реагировать на смену направления градиента
    - Оптимизатор полностью перестанет учитывать прошлые градиенты
    - Learning rate автоматически станет меньше
    - Свежий градиент перестанет влиять на скорость
  correct: 0
  id: 018-formula-momenta-3
  fingerprint: b8889f9f
