- concept: расписание exponential decay является чистой функцией номера шага и не хранит внутреннее состояние
  question: Функцию exponential_decay несколько раз вызывают с одинаковыми аргументами, перемежая эти вызовы расчётами для других шагов. Каким должен быть результат повторных вызовов?
  explanation: Функция вычисляет lr0 · decay_rate^step непосредственно из аргументов. Она не хранит историю, поэтому одинаковые lr0, decay_rate и step всегда дают одинаковый результат.
  kind: choice
  options:
    - Всегда одинаковым, поскольку результат определяется только переданными аргументами
    - Каждый раз меньшим, поскольку функция должна помнить предыдущий learning rate
    - Зависящим от общего количества вызовов функции
    - Зависящим от порядка, в котором ранее запрашивались другие шаги
