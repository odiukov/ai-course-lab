- concept: больший коэффициент экспоненциального среднего даёт более долгую память и более медленную реакцию
  question: Для одинаковых потоков наблюдений считают две экспоненциальные скользящие оценки. У оценки A коэффициент сохранения прошлого ближе к единице, чем у оценки B. Какая оценка медленнее отреагирует на резкое изменение и почему?
  explanation: Чем больше коэффициент при прошлом значении, тем меньше относительный вклад свежего наблюдения. Такая оценка получается спокойнее, но сильнее запаздывает при смене поведения градиентов.
  kind: open
  reference: 'Оценка A отреагирует медленнее: она сохраняет большую долю прежнего состояния, поэтому дольше помнит историю и сильнее сглаживает новые наблюдения.'
