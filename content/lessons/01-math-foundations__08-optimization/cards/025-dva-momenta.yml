- concept: первый момент Adam обновляется как экспоненциальное скользящее среднее градиентов
  question: Для одного параметра текущее значение первого момента равно 4, коэффициент сохранения истории равен 0.25, а свежий градиент равен −8. Чему станет равен первый момент после обновления?
  explanation: 'Доля свежего градиента равна 0.75. Поэтому новое значение: 0.25 × 4 + 0.75 × (−8) = −5.'
