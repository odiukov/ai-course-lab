- concept: при линейном разогреве learning rate пропорционален завершённой доле warmup
  question: Линейный разогрев рассчитан на 280 обновлений, а максимальный learning rate равен 0.002. Какой learning rate будет установлен после 84 обновлений разогрева?
  explanation: 'Используем lr = lr_max · t / T_warm: 0.002 · 84 / 280 = 0.0006.'
  kind: numeric
  answer: 0.0006
  tolerance: 0.000001
  id: 039-warmup-1
  fingerprint: f91b163d
- concept: warmup защищает большую модель от нестабильных обновлений в начале обучения
  question: Почему при обучении большой модели learning rate иногда сначала плавно увеличивают до рабочего значения, а не сразу устанавливают на максимум?
  explanation: В начале обучения большие модели особенно подвержены нестабильности. Warmup временно ограничивает размер обновлений, а затем выводит learning rate на рабочий уровень; после разогрева обычно начинается затухание.
  kind: choice
  options:
    - Чтобы уменьшить риск разрушительно больших обновлений в нестабильной начальной фазе
    - Чтобы навсегда ограничить модель маленькими изменениями весов
    - Чтобы полностью исключить необходимость последующего затухания learning rate
    - Чтобы заставить функцию потерь уменьшаться строго на каждом обновлении
  correct: 0
