- concept: нулевой градиент не гарантирует, что достигнут минимум функции потерь
  question: Почему оптимизатор, использующий только текущий градиент, может остановиться в седловой точке, хотя минимум ещё не найден?
  explanation: Малый градиент означает отсутствие заметного наклона непосредственно в точке, но не доказывает наличие минимума. В седловой точке функция по одним направлениям растёт, а по другим убывает.
  kind: open
  reference: В седловой точке градиент может быть нулевым или почти нулевым, поэтому вычисленное обновление исчезает. При этом существуют направления, в которых функция потерь продолжает уменьшаться, то есть такая точка не обязательно является минимумом.
  id: 001-strategiya-spuska-2
  fingerprint: 9a473760
