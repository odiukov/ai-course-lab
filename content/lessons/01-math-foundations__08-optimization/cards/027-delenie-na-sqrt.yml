- concept: квадратный корень второго момента возвращает оценку к масштабу градиента
  question: Почему в обновлении Adam используется sqrt(v_hat), а не непосредственно v_hat?
  explanation: Второй момент v_hat имеет масштаб квадрата градиента. Поэтому sqrt(v_hat) оценивает типичный модуль градиента и может служить естественным знаменателем для его нормирования.
  kind: choice
  options:
    - Корень исправляет смещение второго момента в начале обучения
    - v_hat усредняет квадраты градиентов, а корень возвращает результат к масштабу самого градиента
    - Корень сохраняет знак усреднённых градиентов
    - Корень превращает экспоненциальное среднее в арифметическое
  correct: 1
  id: 027-delenie-na-sqrt-1
  fingerprint: 75a85661
- concept: нормированное обновление Adam устойчиво к общему изменению масштаба градиентов одной координаты
  question: Для одной координаты m_hat = 1.4, а v_hat = 0.49. Затем все градиенты в её истории умножили на 6, поэтому m_hat вырос в 6 раз, а v_hat — в 36 раз. Чему теперь равно отношение m_hat / sqrt(v_hat), если epsilon пренебрежимо мало?
  explanation: Изначально отношение равно 1.4 / sqrt(0.49) = 2. После масштабирования числитель умножается на 6, а знаменатель — на sqrt(36), то есть тоже на 6. Отношение не меняется.
  kind: numeric
  answer: 2
  tolerance: 0.01
  id: 027-delenie-na-sqrt-2
  fingerprint: dd50052c
- concept: epsilon защищает обновление Adam от деления на ноль
  question: Объясни своими словами, зачем к sqrt(v_hat) в знаменателе обновления Adam добавляют epsilon.
  explanation: epsilon ограничивает опасное уменьшение знаменателя. Благодаря ему Adam остаётся численно устойчивым даже для параметров, которые почти не получали градиентов.
  kind: open
  reference: Если второй момент равен или очень близок к нулю, деление только на sqrt(v_hat) было бы неопределённым или породило бы чрезмерно большое обновление. Малое положительное epsilon делает знаменатель ненулевым и улучшает численную устойчивость.
  id: 027-delenie-na-sqrt-3
  fingerprint: 1283fb11
