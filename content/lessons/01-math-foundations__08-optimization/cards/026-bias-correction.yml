- concept: нулевая инициализация моментов Adam смещает их начальные оценки к нулю
  question: Почему нескорректированные оценки моментов Adam в начале обучения систематически занижены?
  explanation: Моменты m и v начинают с нуля, поэтому короткой истории недостаточно, чтобы экспоненциальные средние достигли характерного масштаба градиентов. Поправка на смещение компенсирует этот предсказуемый эффект.
  kind: choice
  options:
    - Экспоненциальные средние инициализируются нулями и поначалу сохраняют влияние этой инициализации
    - Adam нормализует каждый градиент перед обновлением моментов
    - В начале обучения learning rate автоматически обнуляется
    - Добавка epsilon вычитается из оценок моментов
  correct: 0
  id: 026-bias-correction-1
  fingerprint: a38272e0
- concept: поправка делит сырой момент на уже накопленную долю экспоненциального среднего
  question: В Adam коэффициент затухания первого момента равен 0,6. После четырёх обновлений нескорректированный момент равен 4,352. Чему равен момент после стандартной bias correction?
  explanation: Накопленная доля равна 1 − 0,6⁴ = 0,8704. Поэтому исправленный момент равен 4,352 / 0,8704 = 5.
  kind: numeric
  answer: 5
  tolerance: 0.00001
  id: 026-bias-correction-2
  fingerprint: 33a960e4
- concept: влияние bias correction исчезает по мере геометрического затухания степени beta
  question: Объясните своими словами, почему bias correction в Adam существенно влияет на обновления главным образом в начале обучения.
  explanation: В начале βᵗ ещё заметно, поэтому деление существенно увеличивает заниженную оценку. Позже βᵗ становится почти нулевым, знаменатель 1 − βᵗ — почти единицей, и поправка практически перестаёт менять момент.
  kind: open
  reference: При последовательном возведении коэффициента затухания в степень номера шага его значение стремится к нулю. Поэтому знаменатель поправки приближается к единице, а исправленные моменты становятся почти равны исходным.
  id: 026-bias-correction-3
  fingerprint: ccd2d818
