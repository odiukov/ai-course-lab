- concept: стационарная точка требует обнуления всех компонент градиента
  question: У функции двух переменных одна компонента градиента равна нулю, а другая — нет. Является ли эта точка стационарной?
  explanation: Нулевая частная производная означает отсутствие изменения лишь вдоль одной координатной оси. Пока другая компонента градиента ненулевая, у функции остаётся направление локального изменения.
  kind: choice
  options:
    - Нет, стационарность требует обнуления всех компонент градиента
    - Да, достаточно обнуления любой одной компоненты
    - Да, если ненулевая компонента достаточно мала
    - Это зависит только от learning rate
  correct: 0
  id: 012-check-gradient-1
  fingerprint: a9601e4a
- concept: градиент в известном внутреннем минимуме служит проверкой реализации производных
  question: Аналитическая функция градиента возвращает ненулевой вектор в известном гладком внутреннем минимуме. Какой вывод наиболее обоснован?
  explanation: Для дифференцируемой функции градиент во внутреннем локальном минимуме должен обнуляться. Ненулевой результат в заранее известном минимуме — явный сигнал проверить вычисление производных.
  kind: choice
  options:
    - В формуле производной или её реализации есть ошибка
    - Минимум обязан иметь ненулевой градиент
    - Нужно увеличить learning rate
    - Это нормальное следствие узкой долины функции
  correct: 0
  id: 012-check-gradient-2
  fingerprint: c4cdf30d
