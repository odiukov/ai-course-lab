- concept: один шаг Adam выполняет обновление моментов, коррекцию смещения и изменение параметров в фиксированном порядке
  question: Расположите операции одного шага Adam в правильном порядке.
  explanation: Сначала новые градиенты включаются в накопленные m и v. Затем для текущего t вычисляются поправленные оценки, и только они используются при изменении весов.
  kind: order
  items:
    - Обновить непоправленные экспоненциальные средние градиента и квадрата градиента
    - Вычислить временные оценки моментов с поправкой на начальное смещение
    - Обновить параметры с помощью поправленных оценок моментов
  id: 028-code-adam-step-1
  fingerprint: d796f004
- concept: состоянием Adam между вызовами служат непоправленные моменты, а поправленные оценки используются только внутри текущего обновления
  question: Какие значения должна вернуть функция одного шага Adam, чтобы следующий вызов корректно продолжил накопление состояния?
  explanation: Рекуррентные формулы Adam должны продолжаться от сырых экспоненциальных средних m и v. Поправленные оценки зависят от текущего t и не должны становиться состоянием следующего шага.
  kind: choice
  options:
    - Только обновлённые параметры
    - Обновлённые параметры и моменты до добавления текущего градиента
    - Обновлённые параметры и временные моменты после bias correction
    - Обновлённые параметры и новые непоправленные моменты
  correct: 3
  id: 028-code-adam-step-2
  fingerprint: 64e347a7
- concept: epsilon в формуле Adam прибавляется после вычисления квадратного корня второго момента
  question: Как должен выглядеть знаменатель нормированного обновления Adam, если обозначить поправленный второй момент как v_hat?
  explanation: Стандартный знаменатель Adam равен sqrt(v_hat) + eps. Перенос eps под корень меняет не только защиту знаменателя, но и масштаб обновления.
  kind: choice
  options:
    - sqrt(v_hat + eps)
    - sqrt(v_hat) * eps
    - sqrt(v_hat + eps * eps)
    - sqrt(v_hat) + eps
  correct: 3
  id: 028-code-adam-step-3
  fingerprint: be105de8
