- concept: подходящий learning rate подбирают экспериментально по поведению функции потерь
  question: Объясните своими словами, как на практике выбирают learning rate и почему нельзя заранее вычислить одно универсально правильное значение.
  explanation: Learning rate не выводится из универсальной формулы. Его настраивают по экспериментам; распространённые отправные точки из урока — 0.001 для Adam и 0.01 для SGD с моментом.
  kind: open
  reference: 'Берут разумное стартовое значение, запускают обучение, наблюдают за динамикой loss и корректируют learning rate: уменьшают при нестабильности и осторожно увеличивают при слишком медленном снижении. Универсального значения нет, потому что подходящий масштаб шага зависит от модели, данных и оптимизатора.'
  id: 005-learning-rate-2
  fingerprint: 291731aa
