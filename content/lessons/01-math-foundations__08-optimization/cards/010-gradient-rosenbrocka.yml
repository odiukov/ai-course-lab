- concept: частная производная вычисляется при фиксации остальных переменных
  question: Как следует обращаться с y при вычислении частной производной функции f(x, y) по x?
  explanation: Частная производная показывает изменение функции по одной координате при фиксированных остальных. Поэтому при вычислении ∂f/∂x переменную y считают константой.
  kind: choice
  options:
    - Считать y константой и дифференцировать только по x
    - Одновременно дифференцировать по x и по y
    - Обязательно подставить вместо y его оптимальное значение
    - Исключить все слагаемые, в которых встречается y
  correct: 0
  id: 010-gradient-rosenbrocka-1
  fingerprint: cf8d686a
- concept: в частную производную входят вклады всех зависящих от выбранной переменной слагаемых
  question: У функции Розенброка слагаемое, штрафующее отклонение x от целевой координаты, зависит только от x, а слагаемое долины — от x и y. Почему производная по x получает вклады от обоих слагаемых, а производная по y — лишь от слагаемого долины?
  explanation: В функции Розенброка x встречается и в (1 − x)², и внутри (y − x²)². Переменная y встречается только во втором слагаемом, поэтому первое не влияет на ∂f/∂y.
  kind: open
  reference: Производная суммы равна сумме производных её слагаемых. Оба слагаемых зависят от x, поэтому оба дают вклад в ∂f/∂x. От y зависит только слагаемое долины, а производная не зависящего от y слагаемого равна нулю.
  id: 010-gradient-rosenbrocka-2
  fingerprint: 871f5aa9
- concept: цепное правило учитывает вложенную зависимость выражения от переменной
  question: Откуда при дифференцировании слагаемого долины функции Розенброка по x появляется дополнительный множитель, связанный с производной внутреннего выражения?
  explanation: 'Слагаемое долины является составной функцией: внешнее возведение в квадрат применяется к внутреннему выражению y − x². По цепному правилу производную внешней функции умножают на производную внутренней, которая по x даёт множитель −2x.'
  kind: choice
  options:
    - Из цепного правила для составной функции
    - Из правила фиксации y в точке минимума
    - Из сложения компонент градиента
    - Из выбора направления антиградиента
  correct: 0
  id: 010-gradient-rosenbrocka-3
  fingerprint: ea77ab01
