- concept: в пространстве высокой размерности условие локального минимума строже условия седловой точки
  question: Почему в функции потерь с большим числом параметров седловые точки обычно представляют более типичное препятствие, чем плохие локальные минимумы?
  explanation: Чтобы точка была локальным минимумом, малые смещения по каждому независимому направлению не должны уменьшать loss. При большом числе направлений чаще находится хотя бы одно направление убывания, и стационарная точка оказывается седлом.
  kind: choice
  options:
    - Для локального минимума поверхность должна подниматься во всех направлениях, тогда как для седла достаточно сохранить хотя бы одно направление спуска
    - Седловые точки всегда имеют больший loss, чем любые локальные минимумы
    - Локальные минимумы существуют только у выпуклых функций
    - В седловой точке градиент обязательно имеет большой модуль
