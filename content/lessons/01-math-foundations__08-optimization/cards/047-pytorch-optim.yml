  question: Зачем при создании оптимизатора PyTorch объединять параметры модели в несколько групп?
  explanation: 'Группы параметров полезны, когда части модели нужно обучать по-разному: например, осторожно дообучать готовую основу и быстрее обучать новую выходную голову. Для каждой группы можно задать собственные lr, weight decay и другие поддерживаемые настройки.'
