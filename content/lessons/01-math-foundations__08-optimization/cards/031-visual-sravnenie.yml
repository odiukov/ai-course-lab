- concept: одинаковый learning rate не обеспечивает сопоставимый эффективный шаг у разных оптимизаторов
  question: Почему при сравнении обычного градиентного спуска, momentum и Adam некорректно автоматически задавать им одинаковый learning rate?
  explanation: Momentum обновляет параметры по накопленной скорости, а Adam дополнительно нормирует обновления оценкой второго момента. Поэтому один и тот же learning rate означает для этих методов разные эффективные шаги. Для честного сравнения learning rate настраивают отдельно.
  kind: choice
  options:
    - Потому что learning rate применяется только в обычном градиентном спуске
    - Потому что оптимизаторы по-разному преобразуют градиенты, поэтому одинаковый learning rate может давать разные эффективные перемещения
    - Потому что каждый оптимизатор должен начинать из собственной точки
    - Потому что Adam не позволяет вручную задавать learning rate
  correct: 1
  id: 031-visual-sravnenie-1
  fingerprint: 03498cfa
- concept: линия уровня объединяет точки с одинаковым значением функции потерь
  question: Заполни пропуск в общем уравнении линии уровня функции потерь.
  explanation: Все точки одной контурной линии имеют одинаковое значение потерь. На карте функции Розенброка переход между контурами позволяет судить об изменении loss, а форма следа оптимизатора показывает, как он движется по ландшафту.
  kind: cloze
  template: Для некоторой константы c линия уровня задаётся уравнением ___
  answer: L(x, y) = c
  accept:
    - L(x,y)=c
    - L(x, y)=c
    - loss(x, y) = c
