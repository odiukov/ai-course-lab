- concept: ступенчатое затухание подходит для ручного выбора моментов изменения learning rate
  question: Инженер хочет сам назначать контрольные этапы обучения, после каждого из которых learning rate будет резко уменьшаться. Какое расписание ему подходит и почему?
  explanation: 'Ступенчатое расписание даёт прямой ручной контроль: learning rate остаётся постоянным внутри этапа и скачком уменьшается в заранее выбранных точках.'
  kind: open
  reference: 'Подходит ступенчатое затухание: инженер явно задаёт границы этапов и коэффициент, на который learning rate уменьшается после каждой границы.'
