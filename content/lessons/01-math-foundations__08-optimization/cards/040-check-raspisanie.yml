- concept: warmup является начальной фазой комбинированного расписания и после него должно следовать затухание
  question: Расположи фазы расписания с warmup в правильном порядке.
  explanation: 'Warmup не заменяет дальнейшее расписание: сначала learning rate растёт от малого значения до рабочего, а затем начинается его затухание.'
  kind: order
  items:
    - Начать с очень малого learning rate
    - Постепенно увеличить learning rate до рабочего значения
    - Уменьшать learning rate по выбранному расписанию затухания
