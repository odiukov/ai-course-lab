- concept: mini-batch сочетает свойства полного batch gradient descent и одноэлементного SGD
  question: Объясни своими словами, чем mini-batch gradient descent отличается одновременно от batch gradient descent и SGD по данным для одного обновления, точности градиента и скорости.
  explanation: Три варианта различаются объёмом данных на одно обновление. Полный batch устойчив, но медленен; SGD быстр, но сильно шумит; mini-batch даёт сбалансированную стоимость и качество оценки градиента.
  kind: open
  reference: 'Batch gradient descent использует весь набор данных и получает точный, но дорогой градиент. SGD обновляет параметры по одному случайному примеру, поэтому шаг дешёвый, но очень шумный. Mini-batch использует небольшую случайную подвыборку и обеспечивает компромисс: приемлемую оценку градиента при умеренной стоимости шага.'
