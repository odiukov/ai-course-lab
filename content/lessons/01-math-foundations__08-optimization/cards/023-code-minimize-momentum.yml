- concept: полная траектория оптимизации включает начальную точку и результат каждого обновления
  question: Что должна содержать история траектории, чтобы по ней можно было восстановить весь запуск momentum-оптимизатора?
  explanation: 'Начальная точка нужна как исходное состояние траектории. Поэтому после N обновлений история содержит N+1 точку: старт и результат каждого шага.'
  kind: choice
  options:
    - Начальную точку и состояние параметров после каждого обновления
    - Только состояния параметров после обновлений
    - Только начальную и конечную точки
    - Градиенты без значений параметров
  correct: 0
  id: 023-code-minimize-momentum-1
  fingerprint: 1c4476c0
- concept: momentum не гарантирует монотонного уменьшения функции потерь на каждой итерации
  question: Объясни своими словами, почему при корректной работе momentum-оптимизатора функция потерь иногда временно возрастает.
  explanation: Momentum обновляет параметры по накопленной скорости, поэтому направление шага определяется не только текущим градиентом. При beta = 0.9 эта инерция может привести к проскакиванию и немонотонному loss; само по себе это не означает ошибку.
  kind: open
  reference: Накопленная скорость сохраняет инерцию прошлых градиентов. Из-за неё параметры могут проскочить через удачную область или минимум, поэтому отдельный шаг повышает потери, хотя общая траектория продолжает сходиться.
  id: 023-code-minimize-momentum-2
  fingerprint: 5a4f3ec1
