- concept: положительный lr_min задаёт ненулевой learning rate в конце косинусного отжига
  question: Что произойдёт в конце стандартного косинусного отжига, если lr_min задан положительным?
  explanation: При t = T косинусная часть формулы обнуляет разность между границами, но не сам learning rate. Поэтому конечное значение точно равно lr_min и может быть ненулевым.
