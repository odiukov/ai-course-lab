- concept: learning rate линейно масштабирует величину изменения веса при фиксированном градиенте
  question: Как изменится модуль обновления веса в обычном градиентном спуске, если уменьшить learning rate, оставив градиент прежним?
  explanation: Из правила w ← w − lr · g следует, что модуль изменения равен |lr · g|. При неизменном градиенте меньший learning rate даёт пропорционально меньший шаг.
  kind: choice
  options:
    - Уменьшится пропорционально learning rate
    - Увеличится пропорционально learning rate
    - Не изменится
    - Станет равен модулю градиента независимо от learning rate
  correct: 0
  id: 003-vanilla-gd-1
  fingerprint: 3f8e634d
- concept: одна итерация обучения пересчитывает градиенты для текущих весов перед следующим обновлением
  question: Расположите действия обычного градиентного спуска в порядке их выполнения при повторяющемся обучении.
  explanation: Градиенты относятся к текущему состоянию модели. После изменения весов потерю и градиенты нужно вычислить заново, а затем выполнить следующее обновление.
  kind: order
  items:
    - Вычислить значение функции потерь для текущих весов
    - Вычислить градиенты потери по весам
    - Обновить веса с учётом learning rate
    - Снова вычислить потерю уже для обновлённых весов
  id: 003-vanilla-gd-2
  fingerprint: 9a174284
