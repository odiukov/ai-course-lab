- concept: локальные минимумы многомерных нейросетей часто имеют потери, близкие к глобальному минимуму
  question: Почему попадание в локальный, а не глобальный минимум функции потерь нейросети часто не становится серьёзной проблемой?
  explanation: Функции потерь нейросетей невыпуклы, поэтому оптимизатор может прийти в разные локальные минимумы. Однако у большинства таких минимумов потери близки к наименьшим возможным, и различие редко существенно ухудшает модель.
  kind: open
  reference: В пространствах параметров высокой размерности многие локальные минимумы имеют значения потерь, близкие к глобальному минимуму, поэтому найденное решение обычно оказывается достаточно качественным.
