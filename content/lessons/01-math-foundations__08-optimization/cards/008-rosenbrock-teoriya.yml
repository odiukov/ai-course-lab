- concept: разная кривизна поперёк и вдоль долины затрудняет оптимизацию функции Розенброка
  question: Почему оптимизатор может быстро попасть в долину функции Розенброка, но затем медленно продвигаться к минимуму?
  explanation: Большой коэффициент при штрафе за отклонение от параболы создаёт высокую кривизну поперёк долины. Вдоль изогнутого дна кривизна значительно меньше, поэтому оптимизатору трудно выбрать шаг, подходящий сразу для обоих направлений.
  kind: open
  reference: Поперёк долины функция меняется резко, а вдоль неё — слабо. Поэтому шаги, безопасные для крутых стенок, дают медленное продвижение по дну, а более крупные шаги вызывают колебания между стенками.
