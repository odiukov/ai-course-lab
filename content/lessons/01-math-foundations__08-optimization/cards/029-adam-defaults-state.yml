- concept: на практике у Adam обычно настраивают learning rate, сохраняя стандартные коэффициенты моментов
  question: Обучение модели с Adam нестабильно, и нужно начать подбор гиперпараметров оптимизатора. Какой параметр обычно изменяют в первую очередь?
  explanation: Обычно в первую очередь подбирают learning rate. Стандартные значения Adam — beta1=0.9, beta2=0.999 и epsilon=1e-8 — чаще оставляют без изменений.
  kind: choice
  options:
    - epsilon
    - beta1
    - beta2
    - learning rate
  correct: 3
  id: 029-adam-defaults-state-1
  fingerprint: 2b9172a8
- concept: накопленные моменты Adam должны оставаться сопоставлены тем же параметрам
  question: Между двумя вызовами Adam параметры переставили местами в списке вместе с их градиентами, но внутренние списки моментов оптимизатора не переставляли. К чему это приведёт?
  explanation: 'В этой реализации m и v сопоставляются параметрам по позиции через zip. Поэтому порядок параметров должен сохраняться: иначе каждый вес получит накопленную статистику другого веса.'
  kind: choice
  options:
    - Изменится только порядок параметров в результате, но сами обновления останутся прежними
    - Adam автоматически сопоставит моменты параметрам по их значениям
    - Все накопленные моменты обнулятся при следующем вызове
    - К параметрам будут применены моменты, накопленные ранее для других позиций списка
  correct: 3
  id: 029-adam-defaults-state-2
  fingerprint: b8837f95
