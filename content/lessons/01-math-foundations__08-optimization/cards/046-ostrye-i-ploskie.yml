- concept: шум mini-batch SGD затрудняет удержание в острых минимумах и может улучшать тестовое качество
  question: Объясните своими словами, почему SGD с моментом иногда показывает лучшую точность на тесте, чем Adam, хотя Adam быстрее снижает потерю на обучающих данных.
  explanation: Скорость уменьшения обучающей потери и качество обобщения — разные свойства. Шум SGD может служить неявной регуляризацией, смещая поиск к плоским и устойчивым решениям, тогда как Adam способен быстрее попасть в чувствительный острый минимум.
  kind: open
  reference: Случайные колебания mini-batch градиента мешают SGD с моментом закрепиться в узком остром минимуме и чаще оставляют его в более широкой плоской области. Такая область устойчивее к различию между обучающими и тестовыми данными. Adam благодаря адаптивным шагам может быстрее снизить обучающую потерю, но найденное решение иногда оказывается более острым и хуже обобщается.
  id: 046-ostrye-i-ploskie-2
  fingerprint: 0b821f42
