- concept: AdamW применяет weight decay отдельно от адаптивного обновления Adam
  question: Почему в AdamW уменьшение весов вынесено из адаптивной части обновления?
  explanation: Adam нормирует обновления каждого параметра по накопленной величине его градиентов. AdamW обходит эту нормировку для weight decay и применяет уменьшение весов отдельным слагаемым, поэтому регуляризация соответствует задуманному равномерному стягиванию весов к нулю.
  kind: open
  reference: Если включить штраф за большие веса в градиент обычного Adam, он будет масштабироваться вместе с градиентом через оценку второго момента. Поэтому сила регуляризации окажется разной для разных параметров и будет зависеть от истории их градиентов. AdamW отдельно уменьшает веса, сохраняя weight decay независимым от адаптивного масштабирования.
  id: 048-pravila-vybora-2
  fingerprint: 1ae2d52d
