<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Три learning rate рядом</title>
<style>
  :root{
    --bg:#fdfdfb; --fg:#1c1c1e; --mut:#6b6b70; --axis:#9a9aa0;
    --big:#c0392b; --small:#2e6da4; --good:#1f8a4c;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16181c; --fg:#e8e8ea; --mut:#9d9da6; --axis:#565660;
      --big:#ff7a6b; --small:#6fb3ff; --good:#57d98a;
    }
  }
  html,body{margin:0;background:var(--bg);}
  .wrap{background:var(--bg);color:var(--fg);max-width:100%;}
  h2{font:600 15px/1.3 system-ui,sans-serif;margin:10px 12px 2px;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .t{font:12px system-ui,sans-serif;fill:var(--fg)}
  .tm{font:11px system-ui,sans-serif;fill:var(--mut)}
  .fail{font:13px/1.5 system-ui,sans-serif;color:var(--fg);padding:8px 12px}
</style>
</head>
<body>
<div class="wrap">
  <h2>Одна формула, три learning rate</h2>
  <svg id="s" viewBox="0 0 900 380" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Три траектории градиентного спуска при разных learning rate"></svg>
  <div id="fb"></div>
</div>
<script>
(function(){
try{
  // ---------- данные схемы (единственные литералы-данные) ----------
  var PANELS = [
    { key:"big",   lr:"lr = 1.0",      cap:"расходится",           note:"скачки между стенками",
      xs:[-0.55, 0.75, -1.15, 1.55], cls:"big" },
    { key:"small", lr:"lr = 0.0001",   cap:"10 000 шагов",          note:"шаги малы и почти равны",
      xs:[-1.6,-1.48,-1.36,-1.24,-1.12,-1.0,-0.88,-0.76], cls:"small" },
    { key:"good",  lr:"lr = 0.01",     cap:"~100 шагов",            note:"шаги сами укорачиваются",
      xs:[-1.7,-0.95,-0.5,-0.26,-0.13,-0.06,-0.02], cls:"good" }
  ];
  var PW=3, X0=-2, X1=2, YTOP=4;          // логическая сетка одной панели
  var SC=68;                              // scale: пикселей на логическую единицу
  var ORG={x:78, y:300};                  // origin: sx(0),sy(0) первой панели

  // ---------- единственная функция перевода ----------
  function sx(x, p){ return ORG.x + (x + (p||0)*PW) * SC; }
  function sy(y){ return ORG.y - y * SC; }
  function bowl(x){ return x*x*0.55; }    // высота холма

  var NS="http://www.w3.org/2000/svg", svg=document.getElementById("s");
  var PAD=5, FS=12, LW=1.6;               // отступ подписи, шрифт, толщина
  function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}
  function add(n,a){var e=el(n,a);svg.appendChild(e);return e;}
  function txt(x,y,s,cls,anch){var t=el("text",{x:x,y:y,"text-anchor":anch||"middle","class":cls||"t"});t.textContent=s;svg.appendChild(t);return t;}

  var mk=add("defs");
  ["big","small","good"].forEach(function(c){
    var m=el("marker",{id:"a-"+c,viewBox:"0 0 10 10",refX:"9",refY:"5",
      markerWidth:"5.5",markerHeight:"5.5",orient:"auto-start-reverse"});
    m.appendChild(el("path",{d:"M0,0 L10,5 L0,10 z",fill:"currentColor"}));
    mk.appendChild(m);
  });

  PANELS.forEach(function(P,i){
    var g=add("g",{"class":P.cls,style:"color:var(--"+P.cls+")"});
    function G(n,a){var e=el(n,a);g.appendChild(e);return e;}

    // холм
    var d="", n=48;
    for(var k=0;k<=n;k++){
      var x=X0+(X1-X0)*k/n;
      d+=(k?" L":"M")+sx(x,i)+" "+sy(bowl(x));
    }
    G("path",{d:d,fill:"none",stroke:"var(--axis)","stroke-width":LW});

    // ось: горизонталь через sy(0) и вертикаль через sx(0)
    G("line",{x1:sx(X0,i),y1:sy(0),x2:sx(X1,i),y2:sy(0),
      stroke:"var(--axis)","stroke-width":LW*0.6,"stroke-dasharray":"3 4"});
    G("line",{x1:sx(0,i),y1:sy(0),x2:sx(0,i),y2:sy(YTOP*0.62),
      stroke:"var(--axis)","stroke-width":LW*0.6,"stroke-dasharray":"3 4"});
    // минимум = ровно sx(0),sy(0)
    G("circle",{cx:sx(0,i),cy:sy(0),r:LW*2,fill:"var(--axis)"});
    txt(sx(0,i), sy(0)+PAD+FS+2, "минимум", "tm", "middle");

    // траектория: точки на холме + прыжки
    var xs=P.xs;
    for(var j=0;j<xs.length-1;j++){
      var a=xs[j], b=xs[j+1];
      var mx=(a+b)/2, lift=Math.min(Math.abs(b-a)*0.45, YTOP*0.5);
      G("path",{d:"M"+sx(a,i)+" "+sy(bowl(a))+
                  " Q"+sx(mx,i)+" "+sy(Math.max(bowl(a),bowl(b))+lift)+
                  " "+sx(b,i)+" "+sy(bowl(b)),
        fill:"none",stroke:"currentColor","stroke-width":LW,
        "marker-end":"url(#a-"+P.cls+")","stroke-linecap":"round"});
    }
    xs.forEach(function(x,j){
      G("circle",{cx:sx(x,i),cy:sy(bowl(x)),r:LW*1.7,fill:"currentColor"});
      if(j===0) txt(sx(x,i)-PAD, sy(bowl(x))-PAD, "старт", "tm", "end");
    });

    // подпись lr — над центром панели, у хвоста траекторий
    txt(sx(0,i), sy(YTOP*0.86), P.lr, "t", "middle");
    txt(sx(0,i), sy(YTOP*0.86)-(-PAD-FS-2), P.cap, "tm", "middle");
    // нижняя строка-легенда панели
    txt(sx(0,i), sy(0)+PAD+2*(FS+4), P.note, "tm", "middle");
  });

  // ось w под всеми панелями, тоже через перевод
  var yb = sy(0)+PAD+3*(FS+6);
  add("line",{x1:sx(X0,0),y1:yb,x2:sx(X1,PANELS.length-1),y2:yb,
    stroke:"var(--axis)","stroke-width":LW*0.6});
  txt(sx(X1,PANELS.length-1), yb+PAD+FS, "вес w", "tm", "end");
  txt(sx(X0,0), yb+PAD+FS, "по вертикали — потеря L", "tm", "start");
}catch(e){
  document.getElementById("s").remove();
  document.getElementById("fb").className="fail";
  document.getElementById("fb").textContent=
    "Схема должна показывать три траектории спуска по одному холму: "+
    "lr = 1.0 — прыжки через низину со всё большим размахом, расходится; "+
    "lr = 0.0001 — верное направление, но крошечные равные шаги, 10 000 шагов до минимума; "+
    "lr = 0.01 — длинные шаги на крутом склоне, сами укорачиваются у дна, ~100 шагов.";
}
})();
</script>
</body>
</html>
