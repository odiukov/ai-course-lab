<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Без момента и с моментом</title>
<style>
  :root{
    --bg:#fbfaf7; --ink:#1b2430; --muted:#5a6675;
    --ring:#cbd2dc; --floor:#9aa5b4;
    --a:#c2410c; --b:#1d4ed8;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12161c; --ink:#e7edf6; --muted:#a6b2c2;
      --ring:#333d4a; --floor:#5b6675;
      --a:#fb923c; --b:#82a9ff;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{padding:10px 12px 14px}
  h1{font-size:16px;margin:0 0 6px}
  svg{display:block;width:100%;height:auto;max-height:520px}
  .ring{fill:none;stroke:var(--ring);stroke-width:1.5}
  .floor{stroke:var(--floor);stroke-width:1.5;stroke-dasharray:5 5;fill:none}
  .pa{stroke:var(--a);fill:none;stroke-width:2.5;stroke-linejoin:round}
  .pb{stroke:var(--b);fill:none;stroke-width:2.5;stroke-linejoin:round}
  .ha{fill:var(--a)} .hb{fill:var(--b)}
  .da{fill:var(--a)} .db{fill:var(--b)}
  .dot{fill:var(--ink)}
  .tail{stroke:var(--a);fill:none;stroke-width:1.8;stroke-dasharray:4 5}
  text{fill:var(--ink)}
  .hd{font-size:15px;font-weight:600}
  .lb{font-size:13px;fill:var(--muted)}
  .num{font-size:11px}
  .fb{font-size:14px;color:var(--muted);white-space:pre-line}
</style>
<div class="wrap">
  <h1>Один и тот же спуск: без момента и с моментом</h1>
  <div id="host"></div>
</div>
<script>
(function(){
  var D = {
    view:{w:980,h:292},
    rings:[[10.5,2.6],[7.2,1.8],[4.0,1.05]],
    arrow:{len:0.55,w:0.24},
    yTitle:3.4, yNote:-3.4,
    panels:[
      { cls:"a", cx:11, noteX:5.5,
        head:"Без момента: 6 шагов",
        note:"мечется от стенки к стенке",
        pts:[[1,2.2],[2.2,-2.0],[3.2,1.8],[4.2,-1.6],[5.0,1.4],[5.7,-1.2],[6.3,1.0]],
        tail:[10.4,0.06], tailNote:"ещё сотни шагов", tailNoteAt:[8.4,2.0] },
      { cls:"b", cx:25, noteX:20,
        head:"С моментом: 3 шага",
        note:"шаг вдоль долины растёт",
        pts:[[15,2.2],[17.4,-0.9],[20.8,0.35],[25,0]] }
    ]
  };
  var O = {x:70, y:150}, S = 34;
  function sx(x){ return O.x + x*S; }
  function sy(y){ return O.y - y*S; }

  var PAD = 9, NPAD = 12;
  var host = document.getElementById("host");
  try{
    var o = [];
    o.push('<svg viewBox="0 0 '+D.view.w+' '+D.view.h+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Два пути к одному минимуму: зигзаг без момента и гладкая дуга с моментом">');

    D.panels.forEach(function(p){
      var pc = p.cls === "a" ? "pa" : "pb";
      var hc = p.cls === "a" ? "ha" : "hb";
      var dc = p.cls === "a" ? "da" : "db";

      D.rings.forEach(function(r){
        o.push('<ellipse class="ring" cx="'+sx(p.cx)+'" cy="'+sy(0)+'" rx="'+
          (sx(p.cx + r[0]) - sx(p.cx))+'" ry="'+(sy(0) - sy(r[1]))+'"/>');
      });
      o.push('<line class="floor" x1="'+sx(p.cx - D.rings[0][0])+'" y1="'+sy(0)+
             '" x2="'+sx(p.cx)+'" y2="'+sy(0)+'"/>');

      o.push('<polyline class="'+pc+'" points="'+p.pts.map(function(q){
        return sx(q[0])+','+sy(q[1]); }).join(' ')+'"/>');

      for(var i=1;i<p.pts.length;i++){
        var a=p.pts[i-1], b=p.pts[i];
        var dx=b[0]-a[0], dy=b[1]-a[1], L=Math.hypot(dx,dy);
        var ux=dx/L, uy=dy/L;
        var bx=b[0]-ux*D.arrow.len, by=b[1]-uy*D.arrow.len;
        var nx=-uy*D.arrow.w, ny=ux*D.arrow.w;
        o.push('<polygon class="'+hc+'" points="'+
          sx(b[0])+','+sy(b[1])+' '+
          sx(bx+nx)+','+sy(by+ny)+' '+
          sx(bx-nx)+','+sy(by-ny)+'"/>');
        o.push('<text class="num" x="'+sx(b[0])+'" y="'+
          (sy(b[1]) + (b[1] >= 0 ? -NPAD : NPAD + 8))+
          '" text-anchor="middle">'+i+'</text>');
      }

      if(p.tail){
        var t0 = p.pts[p.pts.length-1];
        o.push('<line class="tail" x1="'+sx(t0[0])+'" y1="'+sy(t0[1])+
               '" x2="'+sx(p.tail[0])+'" y2="'+sy(p.tail[1])+'"/>');
        o.push('<text class="lb" x="'+sx(p.tailNoteAt[0])+'" y="'+
               (sy(p.tailNoteAt[1]) - PAD)+'" text-anchor="middle">'+p.tailNote+'</text>');
      }

      var st = p.pts[0];
      o.push('<circle class="'+dc+'" cx="'+sx(st[0])+'" cy="'+sy(st[1])+'" r="4"/>');
      o.push('<text class="lb" x="'+(sx(st[0]) - PAD)+'" y="'+(sy(st[1]) + 4)+
             '" text-anchor="end">старт</text>');

      o.push('<circle class="dot" cx="'+sx(p.cx)+'" cy="'+sy(0)+'" r="4.5"/>');
      o.push('<text class="lb" x="'+sx(p.cx)+'" y="'+(sy(0) + PAD + 12)+
             '" text-anchor="middle">минимум</text>');

      o.push('<text class="hd" x="'+sx(p.noteX)+'" y="'+(sy(D.yTitle) + 12)+
             '" text-anchor="middle">'+p.head+'</text>');
      o.push('<text class="lb" x="'+sx(p.noteX)+'" y="'+sy(D.yNote)+
             '" text-anchor="middle">'+p.note+'</text>');
    });

    o.push('</svg>');
    host.innerHTML = o.join('');
  }catch(e){
    host.innerHTML = '<div class="fb">Схема должна показывать два пути к одному и тому же минимуму узкой долины.\n'+
      'Слева — без момента: зигзаг от стенки к стенке, 6 шагов, вдоль долины продвижение копеечное, до дна ещё сотни шагов.\n'+
      'Справа — с моментом: боковые колебания гаснут, шаг вдоль долины растёт, минимум достигнут за 3 шага.</div>';
  }
})();
</script>
</html>
