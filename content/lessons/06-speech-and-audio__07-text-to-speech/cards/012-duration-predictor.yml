- concept: общая длина мел-спектрограммы равна сумме предсказанных длительностей фонем
  question: Duration predictor назначил последовательности фонем длительности 9, 14, 8 и 15 мел-кадров. Сколько кадров будет в полученной последовательности?
  explanation: 'Длительности фонем складываются: 9 + 14 + 8 + 15 = 46 мел-кадров. Так предсказания duration predictor определяют общую временную длину результата.'
