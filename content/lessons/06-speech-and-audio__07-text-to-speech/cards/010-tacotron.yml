- concept: обратная подача собственных предсказаний вызывает накопление ошибок при авторегрессивном инференсе
  question: Объясни своими словами, почему единичная ошибка мел-кадра может повлиять на множество последующих кадров авторегрессивного TTS-декодера.
  explanation: 'Авторегрессивный декодер не исправляет ошибочный кадр автоматически: он превращает его в условие для дальнейшей генерации. Из-за этого локальная ошибка способна распространиться по всей оставшейся последовательности.'
  kind: open
  reference: Декодер использует собственный предыдущий прогноз как часть входа для следующего шага. Ошибочный кадр меняет этот вход, поэтому новые кадры строятся уже на искажённом контексте и отклонение может накапливаться.
  id: 010-tacotron-2
  fingerprint: 08ba8514
- concept: сбой выравнивания внимания в авторегрессивном TTS приводит к повторам и пропускам фрагментов текста
  question: При озвучивании длинного абзаца модель повторяет один слог, а затем пропускает слово. Какова наиболее вероятная причина внутри авторегрессивной акустической модели?
  explanation: Внимание должно последовательно продвигаться по тексту. Если оно застревает, модель повторяет фрагмент; если перескакивает вперёд — пропускает его. На длинных последовательностях такое выравнивание особенно нестабильно.
  kind: choice
  options:
    - Механизм внимания потерял корректное выравнивание между текстом и мел-кадрами
    - Вокодер выбрал слишком высокую частоту дискретизации
    - Энкодер обработал все символы одновременно
    - Мел-спектрограмма содержит слишком мало частотных полос
  correct: 0
