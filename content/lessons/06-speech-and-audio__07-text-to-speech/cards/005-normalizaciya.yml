- concept: способ озвучивания последовательности цифр зависит от её значения в контексте
  question: Объясни своими словами, почему TTS-система не должна всегда озвучивать строку «7319» одним и тем же способом.
  explanation: Цифровая запись сама по себе не задаёт единственного произношения. До фонемизации нормализатор должен определить роль числа и заменить его словами в подходящей форме.
  kind: open
  reference: Одна последовательность цифр может обозначать количество, год, код или идентификатор. Количество обычно читают как целое числительное, а код или идентификатор могут произносить по отдельным цифрам. Нужный вариант должен определить нормализатор по контексту.
  id: 005-normalizaciya-2
  fingerprint: 613d612b
