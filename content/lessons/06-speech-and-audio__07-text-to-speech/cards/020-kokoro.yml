- concept: Kokoro возвращает звуковые сэмплы вместе с частотой дискретизации
  question: Объясни своими словами, что представляют собой значения audio и sr, возвращаемые при синтезе речи в Kokoro, и зачем нужны оба.
  explanation: 'Одного массива сэмплов недостаточно для корректной интерпретации звука: sr сообщает, сколько сэмплов приходится на секунду аудио.'
  kind: open
  reference: audio содержит сэмплы синтезированной звуковой волны, а sr — частоту дискретизации. Частота нужна, чтобы воспроизвести или сохранить сэмплы с правильной временной шкалой и скоростью.
  id: 020-kokoro-2
  fingerprint: 1f8a3e22
