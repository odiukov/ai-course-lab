- concept: позиционная и контекстная информация позволяет декодеру различать повторённые копии одного вектора фонемы
  question: Почему повторение одного и того же вектора фонемы в length regulator не заставляет декодер создавать одинаковые мел-кадры?
  explanation: Копирование определяет длительность, а не содержимое готовых мел-кадров. Благодаря позиционной и контекстной информации декодер формирует развитие звука во времени — например, начало, устойчивую часть и затухание.
  kind: open
  reference: Length regulator задаёт только число временных позиций для фонемы. Декодер учитывает позицию кадра и окружающий контекст, поэтому может превратить одинаковые копии входного вектора в разные фазы звучания фонемы.
  id: 014-length-regulator-2
