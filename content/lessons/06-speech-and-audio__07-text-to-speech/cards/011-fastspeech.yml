- concept: FastSpeech 2 превращает фонемы в параллельно вычисляемые мел-кадры с помощью предсказанных длительностей
  question: Расположите этапы неавторегрессивного синтеза в FastSpeech 2 в правильном порядке.
  explanation: Предиктор длительности заранее определяет, сколько мел-кадров соответствует каждой фонеме. После растягивания фонемной последовательности положение каждого кадра уже известно, поэтому декодер может вычислить все кадры параллельно.
  kind: order
  items:
    - Получить контекстные представления входных фонем
    - Предсказать длительность каждой фонемы в мел-кадрах
    - Растянуть последовательность представлений согласно предсказанным длительностям
    - Параллельно предсказать мел-кадры для всех позиций
  id: 011-fastspeech-1
  fingerprint: 45da6d22
- concept: строго монотонное выравнивание FastSpeech 2 повышает устойчивость ценой части просодической гибкости
  question: Какое утверждение точнее всего описывает компромисс строго монотонного выравнивания в FastSpeech 2?
  explanation: При монотонном выравнивании последовательные блоки мел-кадров соответствуют фонемам в порядке текста. Это защищает от возвратов, повторов и пропусков, но ограничивает гибкость выравнивания, поэтому естественность может немного уступать авторегрессивным моделям.
  kind: choice
  options:
    - Оно разрешает модели возвращаться к уже озвученным фонемам, но замедляет вокодер
    - Оно сохраняет порядок фонем и делает синтез устойчивее, но может немного снижать естественность просодии
    - Оно заставляет каждый мел-кадр зависеть от предыдущего и потому усиливает накопление ошибок
    - Оно улучшает естественность, поскольку модель сама переставляет фонемы в удобном порядке
  correct: 1
  id: 011-fastspeech-2
  fingerprint: add8baa9
