- concept: правила нормализации текста применяются от наиболее специфичных к наиболее общим
  question: Расположите этапы TTS-нормализации так, чтобы общие правила не испортили конструкции со специальным чтением.
  explanation: Составные и контекстно-зависимые конструкции обрабатывают раньше общих шаблонов. Иначе правило для одиночных чисел или точек может разрушить дату, сумму либо сокращение до того, как их распознает специализированное правило.
  kind: order
  items:
    - Распознать и раскрыть сокращения, даты и денежные суммы
    - Преобразовать оставшиеся одиночные числа
    - Обработать границы предложений
    - Нормализовать пробелы
  id: 006-normalize-text-1
  fingerprint: 441ffae1
- concept: неподдерживаемые символы следует явно фильтровать до передачи текста следующим компонентам TTS
  question: В пользовательском тексте встретился декоративный символ, для которого TTS-фронтенд не определяет произношение. Какое поведение является наиболее безопасным по умолчанию?
  explanation: Неизвестный символ может неожиданно превратиться в произносимое служебное слово или нарушить токенизацию. Явная фильтрация делает поведение фронтенда предсказуемым; значимые символы следует поддерживать отдельными правилами.
  kind: choice
  options:
    - Удалить символ или заменить его по явно заданному правилу
    - Всегда оставлять символ без изменений
    - Автоматически произнести его системное название
    - Передать весь исходный текст сразу вокодеру
  correct: 0
  id: 006-normalize-text-2
  fingerprint: dad48ba2
- concept: набор регрессионных примеров выявляет нежелательные взаимодействия правил нормализации
  question: Объясните, почему после добавления нового правила normalize_text нужно повторно проверять не только новый пример, но и все ранее проходившие примеры.
  explanation: Корректность отдельного правила не гарантирует корректность всей цепочки. Повторный запуск набора примеров показывает, не изменило ли новое правило сокращения, даты, суммы или другие случаи, которые раньше нормализовались правильно.
  kind: open
  reference: Правила нормализации последовательно изменяют одну строку и могут пересекаться. Новое общее правило способно повторно разобрать результат более узкого правила или изменить уже корректный случай, поэтому полный регрессионный набор нужен для обнаружения таких побочных эффектов.
  id: 006-normalize-text-3
  fingerprint: 37a149c3
