- concept: прирост качества TTS следует оценивать относительно оставшегося разрыва до человеческой речи
  question: Компактная TTS-модель получила UTMOS 3.56, более крупная — 3.92, а человеческая запись — 4.16. Какой процент разрыва между компактной моделью и человеческой речью закрыла крупная модель?
  explanation: Исходный разрыв равен 4.16 − 3.56 = 0.60, а улучшение — 3.92 − 3.56 = 0.36. Поэтому модель закрыла 0.36 / 0.60 = 60% разрыва. Такое сравнение показывает ценность небольшого абсолютного прироста возле человеческого потолка.
  kind: numeric
  answer: 60
  tolerance: 0.4
  id: 021-razmer-vs-kachestvo-2
