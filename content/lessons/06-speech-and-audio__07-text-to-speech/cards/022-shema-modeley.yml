- concept: zero-shot клонирование позволяет синтезировать голос, отсутствовавший среди дикторов обучающей выборки
  question: Объясни своими словами, почему использование короткой референсной записи снимает ограничение фиксированного набора голосов в TTS.
  explanation: В традиционном многодикторном TTS голос обычно выбирается из набора, освоенного при обучении. F5-TTS может обусловить генерацию примерно пятисекундным образцом и выполнить zero-shot клонирование незнакомого голоса.
