- concept: пустой эталон требует явно определённого поведения функции CER
  question: Объясни, почему реализация CER должна обрабатывать пустой эталон отдельной веткой.
  explanation: Без отдельной ветки результат математически не определён или программа завершится ошибкой деления. Конкретная политика может различаться, но она должна быть явной и стабильной для вызывающего кода.
  kind: open
  reference: Длина эталона служит знаменателем, поэтому для пустой строки общее вычисление приводит к делению на ноль. Функция должна заранее определить и документировать поведение для этого случая, например отдельно обработать совпадение двух пустых строк и отклонить непустую гипотезу при пустом эталоне.
  id: 035-character-error-rate-3
  fingerprint: 5817c242
