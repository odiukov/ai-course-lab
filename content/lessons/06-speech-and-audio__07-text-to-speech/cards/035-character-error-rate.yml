- concept: расстояние Левенштейна вычисляется динамическим программированием по префиксам строк
  question: Нужно вычислить символьное расстояние редактирования между двумя строками методом динамического программирования. Расположи действия в правильном порядке.
  explanation: Каждая клетка хранит минимальную стоимость преобразования одного префикса в другой. Границы описывают работу с пустой строкой, а правый нижний угол соответствует полным строкам.
  kind: order
  items:
    - Создать таблицу для всех пар префиксов строк.
    - Заполнить верхнюю и левую границы стоимостями преобразования пустого префикса.
    - Заполнить внутренние клетки минимумом переходов удаления, вставки и замены либо совпадения.
    - Взять значение в правом нижнем углу как минимальное число правок.
  id: 035-character-error-rate-1
  fingerprint: 6b2903ba
- concept: одинаковая нормализация эталона и гипотезы исключает искусственные символьные ошибки
  question: Перед вычислением символьного расстояния эталон и ASR-расшифровку хотят привести к каноническому виду. Какой вариант корректнее?
  explanation: Асимметричная обработка сама создаёт расхождения. Одинаковая нормализация обеих строк позволяет измерять ошибки распознавания, а не различия в регистре или оформлении пунктуации.
  kind: choice
  options:
    - Применить одинаковые правила регистра и пунктуации к обеим строкам.
    - Нормализовать только ASR-расшифровку, сохранив эталон без изменений.
    - Отсортировать символы обеих строк по алфавиту.
    - Удалить пробелы только из эталона.
  correct: 0
