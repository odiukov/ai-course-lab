- concept: SECS сравнивает идентичность голоса независимо от произнесённого текста
  question: Референс и синтезированная запись содержат разные фразы. Как проверить, сохранился ли голос диктора?
  explanation: Speaker encoder преобразует записи в представления голосовой идентичности, поэтому тексты могут различаться. Косинусная близость этих эмбеддингов и образует SECS; сравнение волн или расшифровок измеряет другие свойства.
  kind: choice
  options:
    - Получить обе записи одним speaker encoder и сравнить их эмбеддинги по косинусной близости
    - Сравнить звуковые волны отсчёт за отсчётом
    - Распознать обе записи и сравнить полученные тексты
    - Оценить только естественность синтезированной записи
  correct: 0
  id: 037-secs-1
  fingerprint: 7e298946
- concept: SECS вычисляется как косинусная близость speaker embeddings
  question: Speaker embeddings референса и клона равны (7, 24) и (24, 7). Чему равна их косинусная близость?
  explanation: Скалярное произведение равно 336, а норма каждого вектора — 25. Поэтому SECS = 336 / (25 × 25) = 0.5376. Косинус сравнивает направления эмбеддингов, а не их абсолютный масштаб.
  kind: numeric
  answer: 0.5376
  tolerance: 0.001
  id: 037-secs-2
  fingerprint: 2e33a3a1
