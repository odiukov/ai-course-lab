- concept: ошибочная интерпретация частоты дискретизации масштабирует длительность сигнала
  question: Пятисекундная запись создана с частотой дискретизации 48 кГц, но её без ресемплинга интерпретируют как запись с частотой 30 кГц. Сколько секунд будет длиться воспроизведение?
  explanation: Число отсчётов не изменилось, поэтому новая длительность равна 5 × 48 / 30 = 8 секунд. Одновременно все частоты станут ниже в отношении 30 / 48.
  kind: numeric
  answer: 8
  tolerance: 0.01
  id: 030-sr-mismatch-1
  fingerprint: 34de4101
- concept: перед понижением частоты дискретизации нужно подавить частоты выше нового предела Найквиста
  question: Что должен сделать корректный ресемплер перед уменьшением числа отсчётов, чтобы не возник алиасинг?
  explanation: 'После понижения частоты дискретизации слишком высокие компоненты нельзя представить однозначно: они отражаются в слышимый диапазон как ложные частоты. Антиалиасинговый фильтр удаляет их до прореживания отсчётов.'
  kind: choice
  options:
    - Увеличить амплитуду высокочастотных компонентов
    - Подавить компоненты выше нового предела Найквиста
    - Изменить только указанную в метаданных частоту дискретизации
    - Ограничить каждый отсчёт допустимым диапазоном амплитуды
  correct: 1
