- concept: CER разных отчётов сопоставим только при одинаковом датасете и измерительном конвейере
  question: Почему нельзя напрямую сравнивать отставание TTS от ground truth по CER, если значения взяты из отчётов с разными датасетами или версиями ASR?
  explanation: В рассмотренной таблице пол равен 1.2%, но другая выборка или версия Whisper может дать иной CER даже на человеческой речи. Корректно сравнивать отставание от ground truth только внутри одного и того же протокола оценки.
  kind: open
  reference: Датасет, версия ASR и обработка текста влияют как на CER модели, так и на CER ground truth. При смене измерительного конвейера меняется его нижняя граница, поэтому разности из разных отчётов не находятся на одной шкале.
