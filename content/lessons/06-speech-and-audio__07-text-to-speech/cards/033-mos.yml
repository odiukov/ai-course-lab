- concept: парное сравнение CMOS уменьшает влияние индивидуальных шкал оценщиков
  question: Почему CMOS обычно позволяет увереннее различать близкие версии TTS-модели, чем независимые абсолютные оценки MOS?
  explanation: 'При абсолютном оценивании слушатели по-разному используют шкалу: один систематически строг, другой щедр. В парном сравнении важнее предпочтение внутри одной пары, поэтому постоянное смещение личной шкалы сокращается.'
  kind: open
  reference: В CMOS слушатель непосредственно сравнивает два образца, поэтому его личная склонность ставить всем записям высокие или низкие баллы почти не влияет на результат. Из-за меньшего межэкспертного разброса доверительный интервал на одну разметку получается уже.
