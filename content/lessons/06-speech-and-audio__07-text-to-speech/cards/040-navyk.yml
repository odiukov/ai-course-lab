- concept: соответствие TTS-конвейера требованию по задержке проверяется измерением на целевом оборудовании и полном пути инференса
  question: Почему по числу параметров модели нельзя окончательно определить, выполнит ли TTS-конвейер требование по задержке, и как это проверить?
  explanation: Размер модели помогает рано отсеять явно неподходящие варианты, но не доказывает выполнение ограничения. Требование вроде 300 мс следует подтверждать end-to-end-бенчмарком в той среде, где конвейер будет работать.
  kind: open
  reference: 'Число параметров даёт лишь приблизительную оценку вычислительной стоимости: задержка также зависит от оборудования, реализации, формата вычислений, длины текста и остальных компонентов конвейера. Нужно измерить полную задержку синтеза на целевом CPU с выбранными frontend, акустической моделью и вокодером на репрезентативных входах.'
