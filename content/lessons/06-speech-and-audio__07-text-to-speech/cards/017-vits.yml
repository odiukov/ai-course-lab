- concept: совместное обучение уменьшает рассогласование между предсказанным акустическим представлением и входом вокодера
  question: В модульной TTS-системе вокодер обучали только на настоящих мел-спектрограммах, а при синтезе он получает предсказанные. Какое изменение непосредственно устраняет источник возможных артефактов?
  explanation: 'При раздельном обучении возникает сдвиг распределения: вокодер учится на чистых настоящих спектрограммах, но работает с предсказанными. Совместное обучение позволяет ему сразу адаптироваться к представлениям, которые фактически создаёт акустическая часть.'
  kind: choice
  options:
    - Обучать акустическую часть и вокодер совместно, передавая вокодеру представления, созданные самой моделью
    - Дольше обучать вокодер на тех же настоящих мел-спектрограммах
    - Добавить больше правил нормализации входного текста
    - Оценивать готовую речь другим ASR-движком
  correct: 0
  id: 017-vits-1
  fingerprint: e6973545
- concept: ошибка итоговой звуковой волны распространяется назад через все компоненты end-to-end TTS
  question: Расположи этапы одного цикла обучения end-to-end TTS в правильном порядке.
  explanation: Функция потерь оценивает конечный звук, а обратное распространение обновляет всю цепочку. Поэтому компоненты учатся согласованно, а не оптимизируются независимо для несовместимых промежуточных данных.
  kind: order
  items:
    - По тексту строится внутреннее акустическое представление
    - Вокодер преобразует внутреннее представление в звуковую волну
    - Предсказанная волна сравнивается с настоящей записью
    - Градиент ошибки проходит назад через вокодер, механизм длительностей и текстовый энкодер
  id: 017-vits-2
  fingerprint: '26691498'
- concept: внутреннее акустическое представление оптимизируется ради итогового звука, а не как самостоятельный результат
  question: Почему в совместно обучаемой end-to-end TTS-системе внутреннее мел-представление может не совпадать идеально с настоящей мел-спектрограммой, но итоговая речь всё равно звучать хорошо?
  explanation: Промежуточное представление не обязано быть идеальным само по себе. Если его особенности предсказуемы, совместно обученный вокодер может их компенсировать и восстановить качественный звук.
  kind: open
  reference: Мел-представление служит внутренним интерфейсом между совместно обучаемыми частями. Вокодер адаптируется к систематическим особенностям представления, создаваемого акустической частью, а функция потерь оптимизирует прежде всего итоговую звуковую волну.
  id: 017-vits-3
  fingerprint: 0263356b
