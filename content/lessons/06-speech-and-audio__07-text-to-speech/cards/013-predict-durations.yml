- concept: после округления каждой фонеме нужно гарантировать хотя бы один мел-кадр
  question: После преобразования и округления длительность одной фонемы оказалась нулевой. Как должна поступить функция подготовки длительностей?
  explanation: Фонема с нулевой длительностью не попадёт в развёрнутую последовательность и исчезнет из речи. Поэтому после округления длительности ограничивают снизу одним кадром.
