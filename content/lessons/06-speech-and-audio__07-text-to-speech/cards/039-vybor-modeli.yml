- concept: при выборе TTS сначала применяют жёсткие ограничения, а качество сравнивают среди подходящих моделей
  question: Расположите критерии выбора TTS-модели в практическом порядке.
  explanation: Язык, задержка и требования к голосу могут полностью исключить модель. Поэтому оценки качества имеет смысл сравнивать только среди вариантов, которые прошли эти фильтры.
  kind: order
  items:
    - Проверить поддержку нужного языка
    - Проверить допустимую задержку и доступное железо
    - Проверить требования к голосу и его клонированию
    - Сравнить качество среди оставшихся моделей
  id: 039-vybor-modeli-1
  fingerprint: 5d579fa7
- concept: для неподдерживаемого малоресурсного языка может потребоваться обучение собственной модели VITS
  question: Нужно построить TTS для малоресурсного языка, который не поддерживают готовые модели-лидеры. Есть корпус записанной речи на этом языке. Какой подход наиболее уместен?
  explanation: Высокая оценка качества бесполезна, если модель не поддерживает нужный язык. Для малоресурсного языка практический вариант — собрать достаточный речевой корпус и обучить VITS.
  kind: choice
  options:
    - Выбрать Kokoro за вычислительную эффективность
    - Обучить VITS на корпусе целевого языка
    - Использовать Tacotron из-за его исторической известности
    - Взять модель с максимальной автоматической оценкой качества независимо от языка
  correct: 1
