  fingerprint: 7aa7c9cc
- concept: feature matching сближает промежуточные представления реального и синтезированного звука внутри дискриминатора
  question: Объясни своими словами, что сравнивает feature-matching loss при обучении HiFi-GAN и чем этот сигнал полезнее одного итогового решения дискриминатора.
  explanation: Внутренние слои дискриминатора отражают разные свойства звукового окна. Сближая их отклики для реального и синтезированного аудио, генератор получает содержательную подсказку даже тогда, когда итоговая классификация слишком груба.
  kind: open
  reference: Feature matching сравнивает промежуточные активации дискриминатора для реальной и сгенерированной волн. Эти многомерные признаки дают генератору более подробный и стабильный обучающий сигнал, чем один финальный вердикт о подлинности.
  id: 026-hifigan-obuchenie-3
  fingerprint: dec3c86d
