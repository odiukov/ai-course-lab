- concept: мел-лосс сохраняет соответствие сгенерированного звука входной мел-спектрограмме
  question: Заполни пропуск в схеме лосса реконструкции, где m — входная мел-спектрограмма, а y_hat — сгенерированная волна.
  explanation: Сгенерированную волну преобразуют обратно в мел-спектрограмму и сравнивают с входом вокодера. Так обучение требует не просто правдоподобного звука, а звука с нужным акустическим содержанием.
  kind: cloze
  template: L_mel = distance(m, ___)
  answer: Mel(y_hat)
  accept:
    - mel(y_hat)
    - Mel(ŷ)
    - mel(ŷ)
