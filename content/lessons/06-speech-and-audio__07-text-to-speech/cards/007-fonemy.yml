- concept: параметры language и backend задают языковые правила и движок фонемизации
  question: Какой вызов фонемизирует строку с американским вариантом английского через eSpeak?
  explanation: Текст передаётся первым аргументом, language выбирает язык и его вариант, а backend указывает используемый движок фонемизации. В материале для этого выбран eSpeak.
  kind: choice
  options:
    - phonemize("Good morning", language="en-us", backend="espeak")
    - phonemize("Good morning", language="espeak", backend="en-us")
    - phonemize("Good morning", backend="speech")
    - phonemize("en-us", language="Good morning", backend="espeak")
