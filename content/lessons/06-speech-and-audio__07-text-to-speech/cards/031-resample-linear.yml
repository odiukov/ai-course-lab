- concept: число выходных отсчётов при ресемплинге пропорционально отношению целевой и исходной частот дискретизации
  question: Массив содержит 96000 отсчётов при частоте 32000 Гц. Сколько отсчётов должен содержать результат после пересчёта на 12000 Гц?
  explanation: 'Длина результата равна floor(96000 × 12000 / 32000) = 36000. Длительность сохраняется: 96000 / 32000 = 36000 / 12000.'
  kind: numeric
  answer: 36000
  tolerance: 0.01
