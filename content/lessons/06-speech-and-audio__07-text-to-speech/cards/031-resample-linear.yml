- concept: доступ к правому соседу при линейной интерполяции требует обработки границы массива
  question: Почему безусловное чтение следующего отсчёта после левого может завершиться ошибкой у конца входного массива и как это исправить?
  explanation: Линейная интерполяция обычно читает пару соседей, но у последнего элемента правого соседа нет. Явная обработка границы предотвращает выход индекса за пределы массива.
  kind: open
  reference: 'Если левый индекс указывает на последний элемент, следующего элемента уже нет. Нужно отдельно обработать эту границу: ограничить индекс правого соседа последним допустимым индексом либо сразу вернуть значение последнего отсчёта.'
