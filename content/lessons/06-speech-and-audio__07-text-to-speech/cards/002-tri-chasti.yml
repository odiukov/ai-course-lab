- concept: ошибки нормализации и фонемизации следует искать в text frontend
  question: TTS-система говорит с естественным темпом и чистым голосом, но неправильно произносит имя и зачитывает сокращение буквально. Какой компонент следует проверить первым?
  explanation: Имена, сокращения, числа и смешанный языковой ввод разбираются на этапе нормализации и фонемизации. Если само чтение неверно, а просодия и качество волны нормальны, вероятнее всего, ошибка находится во frontend.
  kind: choice
  options:
    - Text frontend
    - Акустическую модель
    - Вокодер
    - Аудиокодек хранения результата
