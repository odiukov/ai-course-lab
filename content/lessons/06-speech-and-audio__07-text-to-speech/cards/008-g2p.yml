- concept: словарный G2P устойчив к нерегулярной английской орфографии
  question: Почему при фонемизации распространённых английских слов словарный поиск обычно надёжнее правил вида «буква → фонема»?
  explanation: В английском одинаковые сочетания букв могут произноситься по-разному в разных словах. CMUdict хранит готовые последовательности фонем для известных слов, поэтому не пытается вывести произношение из ненадёжных посимвольных соответствий.
  kind: choice
  options:
    - Словарь хранит произношение слова целиком и учитывает орфографические исключения
    - Посимвольные правила работают только с прописными буквами
    - Словарь автоматически восстанавливает смысл любого неизвестного слова
    - Посимвольные правила нельзя применять к словам без пунктуации
  correct: 0
  id: 008-g2p-1
  fingerprint: 881ebfa5
- concept: маркеры ударения в ARPAbet сохраняют информацию для акустической модели
  question: Разработчик удалил цифровые суффиксы у гласных фонем ARPAbet. Объясните главное преимущество и главный недостаток такого решения.
  explanation: Суффиксы в обозначениях наподобие AH0 и OW1 кодируют ударение. Их удаление сокращает словарь символов, однако превращает различающиеся по ударению варианты гласной в один символ и лишает последующую модель полезного признака.
  kind: open
  reference: Набор фонемных символов становится меньше и проще, но теряется информация об основном, побочном и отсутствующем ударении. Из-за этого акустической модели сложнее правильно расставлять лексическое ударение.
  id: 008-g2p-2
  fingerprint: f73d94d3
- concept: словарная G2P-функция очищает токены перед поиском и объединяет найденные произношения
  question: Расположите этапы словарной реализации grapheme_to_phoneme в правильном порядке.
  explanation: Ключ словаря должен быть очищен и приведён к ожидаемому регистру до поиска. После поиска произношения всех слов склеиваются в плоскую последовательность, а отсутствие записи не следует молча игнорировать.
  kind: order
  items:
    - Привести текст к нижнему регистру, разделить его на слова и снять примыкающую пунктуацию
    - Для каждого очищенного слова найти последовательность фонем, а неизвестное слово явно пометить
    - Объединить последовательности отдельных слов в один плоский список фонем
  id: 008-g2p-3
  fingerprint: 04861c40
