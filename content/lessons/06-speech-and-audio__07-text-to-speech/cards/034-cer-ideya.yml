- concept: CER через ASR вычисляется сравнением распознанного синтеза с исходным текстом
  question: Расположи этапы автоматической оценки разборчивости TTS с помощью Whisper в правильном порядке.
  explanation: Whisper выступает автоматическим слушателем. Его расшифровку сопоставляют с текстом, поданным в TTS, а долю замен, удалений и вставок выражают метрикой CER.
  kind: order
  items:
    - Синтезировать аудио по известному исходному тексту
    - Распознать синтезированное аудио с помощью Whisper
    - Сравнить распознанный текст с исходным и подсчитать символьные ошибки
    - Разделить число символьных ошибок на длину исходного текста
  id: 034-cer-ideya-1
  fingerprint: 611beb11
- concept: CER равен числу символьных ошибок, делённому на длину эталонного текста
  question: Эталон содержит 280 символов. Между ним и расшифровкой Whisper обнаружено суммарно 7 замен, удалений и вставок. Чему равен CER в процентах?
  explanation: CER = 7 / 280 × 100% = 2.5%. Чем меньше значение, тем точнее ASR восстановила текст из синтезированной речи.
  kind: numeric
  answer: 2.5
  tolerance: 0.01
  id: 034-cer-ideya-2
  fingerprint: 4b5fe88c
- concept: низкий CER подтверждает разборчивость, но не естественность синтезированной речи
  question: Whisper без ошибок распознаёт синтезированную фразу, хотя голос звучит монотонно и механически. Какой вывод корректен?
  explanation: CER показывает, насколько хорошо сохраняется словесное содержание. Тембр, выразительность и естественность требуют отдельной оценки, например MOS или UTMOS.
  kind: choice
  options:
    - Синтез одновременно разборчивый и естественный
    - Синтез разборчивый, но по CER нельзя судить о его естественности
    - Whisper непригоден для оценки разборчивости TTS
    - Монотонность обязательно должна увеличить CER
  correct: 1
  id: 034-cer-ideya-3
  fingerprint: 686cdd20
