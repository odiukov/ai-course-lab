- concept: нейрокодеки представляют речь компактными дискретными токенами и встраиваются в авторегрессионные модели
  question: Объясни своими словами, чем роль нейрокодеков вроде SNAC и DAC отличается от роли отдельного классического вокодера.
  explanation: SNAC и DAC представляют аудио экономными по битам дискретными токенами и могут быть частью самой генеративной модели. Поэтому граница между моделью синтеза и отдельным вокодером становится менее явной.
  kind: open
  reference: 'Классический вокодер выступает отдельным компонентом, преобразующим акустическое представление в звуковую волну. Нейрокодек может быть встроен в авторегрессионную модель: он кодирует аудио компактными дискретными токенами, с которыми модель работает как с последовательностью.'
