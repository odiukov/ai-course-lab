- concept: в современных end-to-end TTS мел-спектрограмма обычно является внутренним представлением
  question: Какую роль обычно играет мел-спектрограмма в современной end-to-end TTS-системе, которая получает текст и выдаёт звуковую волну?
  explanation: К 2026 году многие TTS-модели работают от текста до волны как единая система. Мел-спектрограмма при этом не обязательно исчезает, но становится внутренней деталью модели, а не внешней границей между независимыми компонентами.
  kind: choice
  options:
    - Обязательного внешнего результата для пользователя
    - Внутреннего акустического представления модели
    - Замены нормализованного текста
    - Метрики качества итоговой записи
