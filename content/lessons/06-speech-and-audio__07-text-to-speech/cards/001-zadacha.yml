- concept: скорость синтеза речи оценивается отношением длительности аудио ко времени вычисления
  question: Система синтезировала аудиофрагмент длительностью 5 секунд за 250 миллисекунд. Во сколько раз быстрее реального времени она работала?
  explanation: 250 миллисекунд — это 0,25 секунды. Отношение длительности результата ко времени вычисления равно 5 / 0,25 = 20, поэтому система генерирует речь в двадцать раз быстрее её воспроизведения.
  kind: numeric
  answer: 20
  tolerance: 0.1
  id: 001-zadacha-2
  fingerprint: 75c12e25
