- concept: ограничение нормализованной волны перед целочисленным сохранением предотвращает переполнение и скачки сигнала
  question: Что следует сделать перед преобразованием нормализованной волны в целочисленный PCM, если редкие пики выходят за представимый диапазон?
  explanation: Предварительное ограничение не даёт слишком большим значениям переполнить целочисленный формат и превратиться в резкие скачки противоположного знака. Клиппинг может слегка исказить пики, но предотвращает значительно более заметные щелчки.
  kind: choice
  options:
