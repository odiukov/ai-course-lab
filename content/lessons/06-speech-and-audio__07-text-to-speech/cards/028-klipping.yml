- concept: жёсткое ограничение амплитуды создаёт дополнительные высокочастотные компоненты
  question: Объясни своими словами, почему жёстко обрезанные пики звуковой волны могут восприниматься как треск или резкое искажение.
  explanation: Клиппинг не просто уменьшает громкость пика, а нелинейно меняет его форму. Резкие переходы обогащают спектр гармониками, которых не было в исходном голосе.
  kind: open
  reference: Обрезка заменяет плавные вершины пиков плоскими участками с резкими углами. Форма волны меняется, в её спектре появляются дополнительные высокочастотные компоненты, которые ухо воспринимает как треск или жёсткость.
