<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Четыре поколения акустических моделей</title>
<style>
  :root{
    --bg:#fbfbfd; --ink:#16202e; --dim:#5a6b80; --box:#ffffff; --line:#2b3a55;
    --hlfill:#e8effb; --hlline:#2f6fd0; --acc:#b3480f; --dash:#7a6a2f; --dashfill:#fdf6e3;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12161c; --ink:#e6edf5; --dim:#9fb0c4; --box:#1b222c; --line:#8098b4;
      --hlfill:#1d2d44; --hlline:#6aa6ff; --acc:#ff9b63; --dash:#d7c37a; --dashfill:#241f14;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  .wrap{background:var(--bg);padding:10px 12px 14px}
  h2{margin:0 0 6px;font-size:15px;font-weight:600}
  p.sub{margin:0 0 8px;font-size:12px;color:var(--dim)}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg)}
  .fb{font-size:13px;line-height:1.5;color:var(--ink)}
</style>
<div class="wrap">
  <h2>Четыре поколения акустических моделей: путь от текста до волны</h2>
  <p class="sub">Читай не «стало лучше», а «какое ограничение сняли».</p>
  <div id="host"><svg id="fig" viewBox="0 0 950 458" role="img"
      aria-label="Четыре колонки: Tacotron 2, FastSpeech 2, VITS, F5-TTS и Kokoro"></svg></div>
</div>
<script>
(function(){
  var host=document.getElementById('host');
  try{
    /* ---- данные схемы (единицы: x = номер колонки, y = уровень) ---- */
    var HW=0.4, LH=0.28;
    var COLS=[
      {c:0,name:'Tacotron 2',year:'AR, 2017'},
      {c:1,name:'FastSpeech 2',year:'2020'},
      {c:2,name:'VITS',year:'end-to-end, 2021'},
      {c:3,name:'F5-TTS',year:'2024'}
    ];
    var BOXES=[
      {c:0,top:1.15,bot:1.85,t:['текст']},
      {c:0,top:2.25,bot:3.05,t:['энкодер BiLSTM','+ attention']},
      {c:0,top:3.45,bot:4.25,t:['AR-декодер:','кадр за кадром'],hl:1},
      {c:0,top:4.65,bot:5.35,t:['мел']},
      {c:0,top:5.75,bot:6.45,t:['вокодер']},
      {c:0,top:6.85,bot:7.55,t:['волна']},

      {c:1,top:1.15,bot:1.85,t:['текст']},
      {c:1,top:2.25,bot:3.05,t:['энкодер']},
      {c:1,top:3.45,bot:4.25,t:['duration predictor'],hl:1},
      {c:1,top:4.65,bot:5.35,t:['мел: один проход, 10×']},
      {c:1,top:5.75,bot:6.45,t:['вокодер']},
      {c:1,top:6.85,bot:7.55,t:['волна']},

      {c:2,top:1.15,bot:1.85,t:['текст']},
      {c:2,top:2.25,bot:6.45,hl:1,t:['одна модель end-to-end:','энкодер, потоки',
        'длительностей, HiFi-GAN','обучены вместе — шва нет','25M · UTMOS 3.62']},
      {c:2,top:6.85,bot:7.55,t:['волна']},

      {c:3,top:1.15,bot:1.85,t:['текст +','5 с образца голоса']},
      {c:3,top:2.25,bot:6.45,hl:1,t:['F5-TTS: DiT','+ flow matching','текст и волна без мела',
        'голос — из образца,','списка голосов нет','335M · UTMOS 3.95']},
      {c:3,top:6.85,bot:7.55,t:['волна']},
      {c:3,top:8.15,bot:9.15,dash:1,t:['шаг вбок: Kokoro 82M','CPU, ужат ради скорости',
        'ценой трети балла UTMOS']}
    ];
    var SEAM=[{c:0,y:5.55},{c:1,y:5.55}];
    var STEPS=[
      {a:0,b:1,label:'исчезло время: один проход'},
      {a:1,b:2,label:'исчез шов: учатся вместе'},
      {a:2,b:3,label:'исчез список голосов'}
    ];
    var BAND=9.95, BANDLAB=9.62;

    /* ---- один origin, один scale, одна пара sx/sy ---- */
    var origin={x:130,y:22}, scale={x:230,y:42};
    function sx(x){return origin.x+x*scale.x;}
    function sy(y){return origin.y+y*scale.y;}

    var s=[];
    function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
    function txt(x,y,t,cls,anchor,size,weight){
      s.push('<text x="'+sx(x)+'" y="'+sy(y)+'" text-anchor="'+anchor+
        '" font-size="'+size+'" font-weight="'+(weight||'400')+
        '" fill="'+cls+'">'+esc(t)+'</text>');
    }
    function vArrow(x,ya,yb,dashed){
      var hx=0.024, hy=0.11;
      s.push('<line x1="'+sx(x)+'" y1="'+sy(ya)+'" x2="'+sx(x)+'" y2="'+sy(yb-hy)+
        '" stroke="'+(dashed?'var(--dash)':'var(--line)')+'" stroke-width="1.4"'+
        (dashed?' stroke-dasharray="4 3"':'')+'/>');
      s.push('<polygon points="'+sx(x)+','+sy(yb)+' '+sx(x-hx)+','+sy(yb-hy)+' '+
        sx(x+hx)+','+sy(yb-hy)+'" fill="'+(dashed?'var(--dash)':'var(--line)')+'"/>');
    }
    function hArrow(xa,xb,y){
      var hx=0.03, hy=0.1;
      s.push('<line x1="'+sx(xa)+'" y1="'+sy(y)+'" x2="'+sx(xb-hx)+'" y2="'+sy(y)+
        '" stroke="var(--acc)" stroke-width="1.6"/>');
      s.push('<polygon points="'+sx(xb)+','+sy(y)+' '+sx(xb-hx)+','+sy(y-hy)+' '+
        sx(xb-hx)+','+sy(y+hy)+'" fill="var(--acc)"/>');
    }

    /* колонки: заголовки */
    COLS.forEach(function(k){
      txt(k.c,0.30,k.name,'var(--ink)','middle',13,'700');
      txt(k.c,0.80,k.year,'var(--dim)','middle',11);
    });

    /* вертикальные связи внутри колонки */
    COLS.forEach(function(k){
      var col=BOXES.filter(function(b){return b.c===k.c;})
                   .sort(function(p,q){return p.top-q.top;});
      for(var i=0;i<col.length-1;i++) vArrow(k.c,col[i].bot,col[i+1].top,col[i+1].dash);
    });

    /* блоки */
    BOXES.forEach(function(b){
      var x0=sx(b.c-HW), x1=sx(b.c+HW), y0=sy(b.top), y1=sy(b.bot);
      var fill=b.dash?'var(--dashfill)':(b.hl?'var(--hlfill)':'var(--box)');
      var stroke=b.dash?'var(--dash)':(b.hl?'var(--hlline)':'var(--line)');
      s.push('<rect x="'+x0+'" y="'+y0+'" width="'+(x1-x0)+'" height="'+(y1-y0)+
        '" rx="'+(sy(0.12)-sy(0))+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="1.3"'+
        (b.dash?' stroke-dasharray="5 3"':'')+'/>');
      var mid=(b.top+b.bot)/2, n=b.t.length;
      b.t.forEach(function(line,i){
        txt(b.c,mid+(i-(n-1)/2)*LH+LH*0.32,line,'var(--ink)','middle',10.5,i===0?'600':'400');
      });
    });

    /* «шов» между мелом и вокодером */
    SEAM.forEach(function(m){ txt(m.c+0.42,m.y,'шов','var(--acc)','start',10.5,'600'); });

    /* «шаг вбок» у хвоста пунктирной стрелки */
    txt(3-0.42,7.90,'шаг вбок','var(--dash)','end',10.5,'600');

    /* нижняя полоса: что исчезает от колонки к колонке */
    STEPS.forEach(function(p){
      hArrow(p.a+0.1,p.b-0.1,BAND);
      txt((p.a+p.b)/2,BANDLAB,p.label,'var(--acc)','middle',11.5,'600');
    });

    document.getElementById('fig').innerHTML=s.join('');
  }catch(e){
    host.innerHTML='<div class="fb"><b>Схема не построилась.</b> Она должна показывать четыре '+
      'колонки по годам, в каждой — путь от текста до волны: '+
      'Tacotron 2 (AR, 2017) — текст, энкодер BiLSTM, авторегрессивный декодер кадр за кадром, '+
      'мел, вокодер, волна; FastSpeech 2 (2020) — duration predictor и мел за один проход, 10× быстрее; '+
      'VITS (end-to-end, 2021) — одна модель, 25M, UTMOS 3.62, шва между акустикой и вокодером нет; '+
      'F5-TTS (2024) — DiT и flow matching, 335M, UTMOS 3.95, голос берётся из 5 с образца. '+
      'Между колонками исчезают: время, шов, список голосов. Kokoro 82M — шаг вбок: CPU ценой трети '+
      'балла UTMOS.</div>';
  }
})();
</script>
</html>
