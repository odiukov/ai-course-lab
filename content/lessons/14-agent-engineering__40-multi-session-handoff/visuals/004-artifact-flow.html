<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Как четыре артефакта превращаются в пакет для новой сессии</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f5f7fb;
      --surface: #ffffff;
      --surface-soft: #f0f4fa;
      --ink: #172033;
      --muted: #5c687c;
      --line: #9aa8bd;
      --source: #e7f1ff;
      --source-stroke: #3676c7;
      --generator: #fff2ce;
      --generator-stroke: #b86e08;
      --output: #e5f7ee;
      --output-stroke: #23825b;
      --accent: #315fc7;
      --warning: #fff0ed;
      --warning-stroke: #c64b3c;
      --warning-ink: #7e3027;
      --badge: #e8edf5;
      --badge-ink: #3d4a60;
      --shadow: #d9e0eb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #10151d;
        --surface: #171e29;
        --surface-soft: #202938;
        --ink: #edf2fb;
        --muted: #b2bed0;
        --line: #718097;
        --source: #172d4a;
        --source-stroke: #72aaf0;
        --generator: #3c2c12;
        --generator-stroke: #e6a542;
        --output: #15382c;
        --output-stroke: #58c99a;
        --accent: #88adff;
        --warning: #3b211f;
        --warning-stroke: #ed8274;
        --warning-ink: #ffc0b7;
        --badge: #283345;
        --badge-ink: #d2dbea;
        --shadow: #0b0e14;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    main {
      max-width: 960px;
    }

    h1 {
      margin: unset;
      font-size: 22px;
      line-height: 1.25;
      color: var(--ink);
    }

    figure {
      margin: unset;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 440px;
      margin-top: 10px;
      overflow: visible;
      background: var(--surface);
      border: 2px solid var(--line);
    }

    .source-box {
      fill: var(--source);
      stroke: var(--source-stroke);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .generator-box {
      fill: var(--generator);
      stroke: var(--generator-stroke);
      stroke-width: 3px;
      vector-effect: non-scaling-stroke;
    }

    .output-box {
      fill: var(--output);
      stroke: var(--output-stroke);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .inner-panel {
      fill: var(--surface);
      stroke: var(--generator-stroke);
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
    }

    .badge-box {
      fill: var(--badge);
      stroke: var(--line);
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
    }

    .warning-box {
      fill: var(--warning);
      stroke: var(--warning-stroke);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .flow {
      fill: none;
      stroke: var(--accent);
      stroke-width: 3px;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .arrow-head {
      fill: var(--accent);
    }

    .divider {
      stroke: var(--generator-stroke);
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
    }

    text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      fill: var(--ink);
    }

    .badge-text {
      fill: var(--badge-ink);
      font-size: 13px;
      font-weight: bold;
    }

    .file-name {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 16px;
      font-weight: bold;
    }

    .source-note {
      fill: var(--muted);
      font-size: 13px;
    }

    .generator-name {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 18px;
      font-weight: bold;
    }

    .generator-copy {
      font-size: 14px;
    }

    .generator-emphasis {
      fill: var(--generator-stroke);
      font-size: 14px;
      font-weight: bold;
    }

    .output-name {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 17px;
      font-weight: bold;
    }

    .output-note {
      fill: var(--muted);
      font-size: 14px;
    }

    .warning-text {
      fill: var(--warning-ink);
      font-size: 15px;
      font-weight: bold;
    }

    #fallback {
      max-width: 960px;
      min-height: 180px;
      margin-top: 10px;
      border: 2px solid var(--warning-stroke);
      background: var(--warning);
      color: var(--warning-ink);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main>
    <figure aria-labelledby="diagram-heading">
      <h1 id="diagram-heading">Как четыре артефакта превращаются в пакет для новой сессии</h1>
      <svg
        id="diagram"
        viewBox="0 0 960 440"
        width="960"
        height="440"
        preserveAspectRatio="xMidYMid meet"
        role="img"
        aria-labelledby="svg-title svg-description"
      >
        <title id="svg-title">Четыре файла сходятся в generate_handoff.py</title>
        <desc id="svg-description">
          agent_state.json, verification_report.json, review_report.json и
          feedback_record.jsonl поступают в generate_handoff.py. Генератор
          выпускает handoff.md и handoff.json из одних входных данных.
        </desc>
      </svg>
      <div id="fallback" hidden role="img" aria-live="polite">
        Схема должна была показать, как agent_state.json,
        verification_report.json, review_report.json и feedback_record.jsonl
        сходятся в generate_handoff.py, а из него выходят handoff.md и
        handoff.json.
      </div>
    </figure>
  </main>

  <script>
    const DATA = Object.freeze({
      canvas: [960, 440],
      origin: [0, 0],
      scale: [10, 10],
      badges: [
        { box: [3, 1.8, 28, 2.5], label: [17, 3.55, "4 ИСТОЧНИКА ФАКТОВ"] },
        { box: [43, 6.9, 26, 2.5], label: [56, 8.65, "СБОРКА"] },
        { box: [78, 4.8, 15, 2.5], label: [85.5, 6.55, "2 ФОРМЫ"] }
      ],
      sources: [
        {
          box: [3, 5.4, 28, 6.3],
          title: [4.6, 8.1, "agent_state.json"],
          note: [4.6, 10.2, "где остановилась работа"]
        },
        {
          box: [3, 13.4, 28, 6.3],
          title: [4.6, 16.1, "verification_report.json"],
          note: [4.6, 18.2, "что подтвердила проверка"]
        },
        {
          box: [3, 21.4, 28, 6.3],
          title: [4.6, 24.1, "review_report.json"],
          note: [4.6, 26.2, "какие замечания найдены"]
        },
        {
          box: [3, 29.4, 28, 6.3],
          title: [4.6, 32.1, "feedback_record.jsonl"],
          note: [4.6, 34.2, "что происходило в попытках"]
        }
      ],
      generator: {
        box: [43, 10.4, 26, 24.2],
        title: [56, 14.5, "generate_handoff.py"],
        divider: [[45.2, 16.2], [66.8, 16.2]],
        lines: [
          [56, 19.3, "читает четыре источника"],
          [56, 22.1, "не расследует расхождения"],
          [56, 24.8, "не сверяется с репозиторием"]
        ],
        panel: [46.1, 27.2, 19.8, 4.4],
        emphasis: [56, 30, "собирает один пакет"]
      },
      outputs: [
        {
          box: [78, 8.2, 15, 10.2],
          title: [85.5, 12.6, "handoff.md"],
          note: [85.5, 15.4, "читает человек"]
        },
        {
          box: [78, 24.5, 15, 10.2],
          title: [85.5, 28.9, "handoff.json"],
          note: [85.5, 31.7, "загружает сессия"]
        }
      ],
      arrows: [
        {
          route: [[31, 8.55], [35.4, 8.55], [42.4, 14.8]],
          head: [[42.4, 14.8], [41.1, 14.45], [41.75, 13.35]]
        },
        {
          route: [[31, 16.55], [36.1, 16.55], [42.4, 19.3]],
          head: [[42.4, 19.3], [41.15, 18.7], [41.3, 20]]
        },
        {
          route: [[31, 24.55], [36.1, 24.55], [42.4, 24.8]],
          head: [[42.4, 24.8], [41.2, 24.1], [41.15, 25.4]]
        },
        {
          route: [[31, 32.55], [35.4, 32.55], [42.4, 29.3]],
          head: [[42.4, 29.3], [41.3, 28.35], [41.1, 29.65]]
        },
        {
          route: [[69, 16.4], [73.1, 16.4], [77.4, 13.3]],
          head: [[77.4, 13.3], [76.05, 13.45], [76.8, 14.55]]
        },
        {
          route: [[69, 28.5], [73.1, 28.5], [77.4, 29.6]],
          head: [[77.4, 29.6], [76.2, 28.75], [75.95, 30.05]]
        }
      ],
      warning: {
        box: [3, 38, 90, 4.1],
        text: [
          48,
          40.65,
          "Пакет не становится точнее своих исходных артефактов"
        ]
      }
    });

    const [originX, originY] = DATA.origin;
    const [scaleX, scaleY] = DATA.scale;
    const origin = Object.freeze({ x: originX, y: originY });
    const scale = Object.freeze({ x: scaleX, y: scaleY });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const svg = document.getElementById("diagram");
    const fallback = document.getElementById("fallback");
    const NS = "http://www.w3.org/2000/svg";

    function make(tag, attributes, text) {
      const element = document.createElementNS(NS, tag);
      Object.entries(attributes).forEach(([name, value]) => {
        element.setAttribute(name, String(value));
      });
      if (text !== undefined) element.textContent = text;
      return element;
    }

    function rect(box, className) {
      const [x, y, width, height] = box;
      return make("rect", {
        x: sx(x),
        y: sy(y),
        width: sx(width) - sx(0),
        height: sy(height) - sy(0),
        class: className
      });
    }

    function label(spec, className, anchor) {
      const [x, y, content] = spec;
      return make("text", {
        x: sx(x),
        y: sy(y),
        class: className,
        "text-anchor": anchor
      }, content);
    }

    function path(points) {
      const commands = points.map(([x, y], index) => {
        const command = index ? "L" : "M";
        return `${command} ${sx(x)} ${sy(y)}`;
      }).join(" ");
      return make("path", { d: commands, class: "flow" });
    }

    function polygon(points) {
      const converted = points
        .map(([x, y]) => `${sx(x)},${sy(y)}`)
        .join(" ");
      return make("polygon", {
        points: converted,
        class: "arrow-head"
      });
    }

    function buildDiagram() {
      DATA.badges.forEach(badge => {
        svg.append(rect(badge.box, "badge-box"));
        svg.append(label(badge.label, "badge-text", "middle"));
      });

      DATA.arrows.forEach(arrow => {
        svg.append(path(arrow.route));
        svg.append(polygon(arrow.head));
      });

      DATA.sources.forEach(source => {
        svg.append(rect(source.box, "source-box"));
        svg.append(label(source.title, "file-name", "start"));
        svg.append(label(source.note, "source-note", "start"));
      });

      svg.append(rect(DATA.generator.box, "generator-box"));
      svg.append(label(DATA.generator.title, "generator-name", "middle"));

      const [[dividerStartX, dividerStartY], [dividerEndX, dividerEndY]] =
        DATA.generator.divider;
      svg.append(make("line", {
        x1: sx(dividerStartX),
        y1: sy(dividerStartY),
        x2: sx(dividerEndX),
        y2: sy(dividerEndY),
        class: "divider"
      }));

      DATA.generator.lines.forEach(line => {
        svg.append(label(line, "generator-copy", "middle"));
      });

      svg.append(rect(DATA.generator.panel, "inner-panel"));
      svg.append(label(
        DATA.generator.emphasis,
        "generator-emphasis",
        "middle"
      ));

      DATA.outputs.forEach(output => {
        svg.append(rect(output.box, "output-box"));
        svg.append(label(output.title, "output-name", "middle"));
        svg.append(label(output.note, "output-note", "middle"));
      });

      svg.append(rect(DATA.warning.box, "warning-box"));
      svg.append(label(DATA.warning.text, "warning-text", "middle"));
    }

    try {
      buildDiagram();
    } catch (error) {
      svg.hidden = true;
      fallback.hidden = false;
    }
  </script>
</body>
</html>
