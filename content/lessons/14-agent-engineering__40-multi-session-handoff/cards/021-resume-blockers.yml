- concept: 'число причин блокировки считается по обязательным требованиям, а не по числу находок: одно требование даёт максимум одну причину'
  question: 'Список обязательных артефактов содержит 9 позиций. Из них: 2 вообще не загружены; 1 загружен дважды с противоречащими версиями; 1 загружен с версией, отличной от требуемой; 1 загружен дважды, но обе копии нужной версии; остальные загружены корректно. Сколько причин вернёт проверка предусловий?'
  explanation: 'Нарушены 4 требования: два отсутствующих, одно с конфликтом версий, одно с несовпадающей версией. Дубликат с одинаковой правильной версией требование не нарушает — версия однозначна. Причины считаются по требованиям, а не по найденным аномалиям: иначе один сломанный артефакт раздувает список и искажает объём предстоящей работы.'
