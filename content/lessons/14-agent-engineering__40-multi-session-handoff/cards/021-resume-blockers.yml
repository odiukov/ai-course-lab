- concept: 'сверка предусловий односторонняя: блокирует неполнота обязательного комплекта, а не наличие лишнего загруженного'
  question: Сессия загрузила все обязательные артефакты нужных версий и вдобавок три файла, которых нет в списке обязательных. Должна ли проверка предусловий выдать блокировку? Объясни, почему сравнение идёт только в одну сторону.
  explanation: 'Проверка предусловий — включение обязательного набора в загруженный, а не равенство наборов. Причина появляется только там, где обязательное требование не покрыто: артефакт отсутствует, версия не та или версия неоднозначна. Лишнее не относится к условию допустимости первого действия.'
  kind: open
  reference: Блокировки быть не должно — список причин пуст. Проверка отвечает на вопрос «есть ли всё нужное в нужной версии», а не «совпадают ли множества». Обязательный список — это минимум, гарантирующий, что первое действие пойдёт по актуальному состоянию; лишние загруженные артефакты этот минимум не нарушают и не делают состояние неопределённым. Требовать точного совпадения множеств значило бы блокировать работу за то, что сессия прочитала что-то сверх плана.
