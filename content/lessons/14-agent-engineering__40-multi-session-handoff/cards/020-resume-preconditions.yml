- concept: предусловие выполнено только при совпадении ожидаемой версии или состояния артефакта, а не при факте его наличия
  question: Пакет требует отчёт о тестах. Файл отчёта на месте и читается, но описывает прогон предыдущего коммита. Выполнено ли предусловие?
  explanation: 'Проверка наличия ловит только отсутствие. Файл существует, ветка открывается, отчёт читается — и при этом описывает другую реальность. Поэтому каждое предусловие называет ссылку на артефакт и ожидаемое состояние: версию, коммит, привязку прогона.'
  kind: choice
  options:
    - 'Да: обязательный артефакт присутствует и доступен для чтения'
    - 'Нет: предусловие требует совпадения и артефакта, и его ожидаемого состояния — отчёт относится к другому коммиту'
    - Да, если отчёт зелёный
    - Зависит от того, сколько времени прошло с прогона
  correct: 1
  id: 020-resume-preconditions-1
  fingerprint: 84ee6b38
- concept: при невыполненном предусловии первое допустимое действие новой сессии — зафиксировать блокировку, а не восстанавливать недостающий контекст догадкой
  question: Новая сессия открыла пакет, но одна обязательная ссылка ведёт на исчезнувшую ветку. Каким должен быть её первый шаг?
  explanation: 'Догадка о недостающем артефакте создаёт работу, которую потом нельзя проверить: результат окажется привязан к состоянию, которого никто не подтверждал. Зафиксированная блокировка дешевле — она называет конкретное расхождение и передаёт решение тому, кто может его закрыть.'
  kind: choice
  options:
    - Найти похожую ветку и продолжить работу по next_action на ней
    - Восстановить контекст по коммитам и истории, а затем выполнить next_action
    - Зафиксировать блокировку с указанием непройденного предусловия и не начинать next_action
    - Выполнить next_action, отметив расхождение как открытый риск
  correct: 2
  id: 020-resume-preconditions-2
  fingerprint: f3a6b2b0
- concept: 'детерминированность next_action и допустимость его выполнения — разные свойства: первое о формулировке, второе о совпадении реальности с описанием'
  question: Пакет содержит однозначное первое действие, не оставляющее получателю выбора. Почему этого всё равно недостаточно, чтобы приступить к нему сразу?
  explanation: 'Две разные проверки: одна — над текстом действия, другая — над миром вокруг него. Смешение их даёт худший случай: уверенно выполненный правильный шаг не на том коммите.'
  kind: open
  reference: 'Детерминированность — свойство формулировки: действие названо так, что двое получателей выполнят одно и то же. Но выполнимость зависит от среды, в которой действие будет выполняться: ветка, коммит, версия задания, привязка отчётов тестов и ревью. Пакет мог быть написан на состоянии, которого уже нет. Поэтому пакет отвечает на вопрос «что делать», а список предусловий доказывает, что делаешь это в той же реальности, для которой действие выбиралось. Пока хотя бы одно обязательное предусловие не совпало по версии или состоянию, однозначное действие остаётся однозначным, но неприменимым.'
  id: 020-resume-preconditions-3
  fingerprint: 6ba3451d
