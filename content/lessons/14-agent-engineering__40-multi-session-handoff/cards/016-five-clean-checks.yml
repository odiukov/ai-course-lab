- concept: изменение считается чистым, если оно закоммичено или явно отложено в stash с пометкой; наполовину применённый дифф — нет
  question: В конце сессии в рабочем дереве остались правки, которые пока не готовы. Какой вариант удовлетворяет проверке рабочего дерева?
  explanation: Проверка требует, чтобы каждое изменение было либо закоммичено, либо явно отложено с пометкой. Незакоммиченный незавершённый дифф выглядит для следующего агента как осознанная работа, и он потратит время, восстанавливая чужой замысел. Молча удалить незавершённое — потерять результат, а не убраться.
  kind: choice
  options:
    - Отложить их в stash с пометкой, объясняющей, что это и зачем отложено
    - 'Оставить их в рабочем дереве: следующая сессия сама разберётся по диффу'
    - Удалить их без следа, чтобы дерево гарантированно было чистым
    - Закоммитить их без сообщения и продолжить работу на той же ветке
  correct: 0
  id: 016-five-clean-checks-1
  fingerprint: 56a7d0a9
- concept: проверка ветки блокирует передачу, потому что первый коммит следующей сессии уедет не туда
  question: Сессия закончилась в состоянии detached HEAD. Почему это блокирует передачу, хотя код скомпилирован и тесты зелёные?
  explanation: Проверка ветки — про то, куда попадёт следующая работа, а не про качество текущей. Ни detached HEAD, ни осиротевшая ветка не мешают коду работать; они мешают следующей сессии продолжить в ожидаемом месте, и цена всплывает уже после первого коммита.
  kind: choice
  options:
    - Текущая версия не привязана к именованной ветке, поэтому первый коммит следующей сессии уедет мимо ожидаемой ветки
    - В detached HEAD нельзя запустить тесты, значит результат проверки недостоверен
    - Генератор передачи не умеет читать рабочее дерево вне ветки
    - Открытые риски в detached HEAD теряются вместе с историей коммитов
  correct: 0
  id: 016-five-clean-checks-2
  fingerprint: 0247a135
- concept: устаревшая доска фич посылает следующую сессию делать уже сделанное
  question: Почему статусы в feature_list.json входят в проверки чистого состояния наравне с рабочим деревом и ветками, хотя это просто файл со статусами?
  explanation: 'Все пять проверок — про среду, а не про код: дерево, временные артефакты, тесты, доска, ветка. Каждая из них — отдельный способ отправить следующую сессию не туда, ничего не сломав в самой программе.'
  kind: open
  reference: 'Доска фич — источник, по которому следующая сессия решает, что уже сделано, а что нет. Если статусы отстали от реальности, следующая сессия либо повторит уже выполненную работу, либо сочтёт сделанным то, чего нет. Это не ошибка в коде: код может быть безупречен, а вход в сессию всё равно ведёт в бесполезную или пропущенную работу. Поэтому расхождение доски с реальностью блокирует передачу так же, как грязное дерево.'
  id: 016-five-clean-checks-3
  fingerprint: 1b5ce22f
