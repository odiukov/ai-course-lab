- concept: 'порядок правил выбора next_action: серьёзность, затем стабильный тай-брейк, затем незавершённая работа, затем явная проверка'
  question: Расставь правила choose_next_action в порядке применения.
  explanation: 'Приоритет задаёт серьёзность, а не позиция в списке задач, иначе сессия начнётся с косметики при живой поломке. Хвост цепочки закрывает пустые случаи: даже полностью завершённая работа даёт исполнимое действие, а не «продолжить работу».'
  kind: order
  items:
    - Взять открытый риск с наибольшей серьёзностью
    - При равной серьёзности выбрать первый по стабильному порядку входных данных
    - Если открытых рисков нет — взять первый незавершённый пункт работы
    - Если незавершённой работы нет — вернуть явное действие проверки результата
  id: 009-choose-action-1
  fingerprint: 3edd9418
- concept: тай-брейк должен быть стабильным, чтобы один вход всегда давал один и тот же next_action
  question: Два открытых риска имеют одинаковую серьёзность. Как choose_next_action должна разрешить ничью?
  explanation: 'Случайный выбор ломает воспроизводимость: одинаковый вход даёт разные пакеты, и повторная сборка передачи меняет решение без причины. Возврат обоих возвращает развилку получателю.'
  kind: choice
  options:
    - Выбрать любой из них — при равной серьёзности разница неважна
    - Выбрать по фиксированному правилу, например по порядку появления во входных данных
    - Вернуть оба риска в next_action, чтобы следующая сессия решила сама
  correct: 1
  id: 009-choose-action-2
  fingerprint: 9db7311e
- concept: описание риска — не действие; next_action называет исполнимую операцию, связанную с риском
  question: Наиболее серьёзный открытый риск сформулирован как «падает проверка оплаты». Что должна положить choose_next_action в next_action?
  explanation: Риск отвечает на вопрос «что может ударить», next_action — на вопрос «что сделать первым». Копирование описания оставляет перевод из проблемы в действие следующей сессии.
  kind: choice
  options:
    - Текст риска дословно — он точно описывает главную проблему
    - 'Связанное с риском исполнимое действие: запустить названную проверку, открыть указанный отчёт или поправить названный участок'
    - Уровень серьёзности риска и ссылку на его источник — действие выберет следующая сессия
  correct: 1
  id: 009-choose-action-3
  fingerprint: 2fef5242
