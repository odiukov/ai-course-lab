- concept: уникальность активной передачи задана парой «ветка + тема», а не веткой целиком
  question: 'В репозитории четыре пакета передачи со статусом `active`: два в ветке `release/v4` (темы «миграции» и «телеметрия») и два в ветке `hotfix/auth` (темы «сессии» и «миграции»). Какие из них нарушают инвариант координации?'
  explanation: Инвариант — ровно один `active` на пару «ветка + тема». Одна ветка спокойно ведёт несколько тем параллельно, и одна тема живёт в разных ветках. Конфликт есть только при совпадении обоих ключей сразу.
  kind: choice
  options:
    - 'Никакие: ни одна пара «ветка + тема» не повторяется дважды'
    - 'Оба пакета ветки `release/v4`: в одной ветке не может быть двух активных передач'
    - 'Оба пакета с темой «миграции»: одна тема не может быть активна в двух ветках'
    - 'Все четыре: активной может быть только одна передача во всём репозитории'
  correct: 0
  id: 025-active-lifecycle-1
  fingerprint: 0e58f647
- concept: superseded означает замещение более новой записью, а не ошибочность содержимого
  question: Пакет передачи переведён в статус `superseded`. Что это утверждает о его содержимом?
  explanation: '`superseded` — про замещение, а не про истинность: запись могла быть безупречной. Полный вывод из оборота — это `archived`. Ни та, ни другая не имеют права управлять новой сессией: командует только `active`.'
  kind: choice
  options:
    - Что описанные в нём факты оказались неверными и работа по нему была отменена
    - Что он корректен, но по этой же паре «ветка + тема» появилась более новая передача, которая и управляет работой
    - Что его проверки не прошли и его нельзя показывать следующей сессии
    - Что он полностью выведен из оборота и хранится только как история
  correct: 1
  id: 025-active-lifecycle-2
  fingerprint: 9d10a317
- concept: действующую передачу определяет статус, а не время изменения файла
  question: Почему для выбора точки входа в работу недостаточно взять пакет с самой поздней датой изменения файла, даже если она заметно свежее остальных?
  explanation: Порядок по времени — это догадка о намерении, статус — зафиксированное намерение. Именно поэтому в схему добавлены `branch`, `last_known_good_commit` и `status`.
  kind: open
  reference: 'Дата файла отражает любое касание: переименование, копирование каталога, автоформатирование, синхронизацию — и не связана с тем, какая передача признана действующей. Статус проставляется явным решением при замещении, поэтому он и есть заявленное состояние системы, а `last_known_good_commit` дополнительно привязывает пакет к проверенной точке репозитория. Выбор «по свежести» также молча разрешает конфликт, который на деле надо остановить: если по паре два `active`, поздняя дата не делает один из них правильным.'
  id: 025-active-lifecycle-3
  fingerprint: d0d1a592
