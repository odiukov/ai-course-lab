- concept: оставленный запас окна расходуется на само закрытие сессии, которое стоит токенов
  question: Зачем закладывать заметный запас контекста именно на закрытие сессии, а не отдавать его работе?
  explanation: Закрытие — отдельная фаза с прогонами и проверками, а не одна строчка текста. У предела каждая такая проверка конкурирует за последние токены, и новое сжатие может испортить ровно то состояние, ради которого фаза затевалась.
  kind: choice
  options:
    - Чтобы у модели остался резерв на случай неожиданно длинного ответа пользователя
    - 'Потому что закрытие — это работа: сверка артефактов, устранение нарушений чистоты, фиксация рисков и проверка выполнимости первого шага, и каждая операция тратит контекст'
    - Потому что генератор пакета требует фиксированной доли окна для записи файлов
    - Потому что сжатие невозможно запустить, если окно заполнено больше чем наполовину
  correct: 1
