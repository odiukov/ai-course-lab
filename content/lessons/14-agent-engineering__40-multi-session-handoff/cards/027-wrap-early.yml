- concept: рекомендуемая доля окна — бюджетный ориентир для закрытия, а не требование завершать задачу посередине
  question: 'Инженер возражает: «Правило готовить передачу заранее заставляет бросать задачи недоделанными». В чём ошибка такого прочтения?'
  explanation: Передача закрывает сессию, а не задачу. Отказ от куска окна — плата за то, что переезжающее состояние выбирает автор пакета, пока он ещё помнит начало разговора.
  kind: open
  reference: 'Ориентир говорит, когда закрывать сессию, а не когда заканчивать задачу. Незавершённая работа не пропадает: её граница, открытые риски и следующее действие переезжают в пакет, и следующая сессия продолжает с той же точки в свежем контексте. Правило задаёт лишь момент перехода — пока состояние ещё можно описать точно, а не когда описание уже собирается из пересказов. Это обмен части объёма окна на достоверность всей передачи.'
  id: 027-wrap-early-3
