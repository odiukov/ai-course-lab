- concept: next_action детерминирован, если не оставляет получателю выбора между ветками
  question: Какая формулировка next_action детерминирована?
  explanation: 'Первая формулировка неконкретна, третья конкретна, но оставляет развилку, четвёртая перекладывает решение обратно. Только вторая называет одно исполнимое действие с целью: любой получатель пакета начнёт одинаково.'
  kind: choice
  options:
    - «Довести до конца работу над модулем экспорта»
    - «Запустить pytest tests/test_invoice.py -q и воспроизвести падение на округлении суммы»
    - «Либо перезапустить упавшие тесты, либо закрыть замечание ревью — что окажется быстрее»
    - «Уточнить у автора предыдущей сессии, что делать дальше»
  correct: 1
  id: 008-next-action-rule-1
  fingerprint: a6ba33dc
- concept: конкретность и детерминированность — разные свойства формулировки
  question: Формулировка next_action может быть конкретной и при этом недетерминированной. Объясни разницу между этими двумя свойствами и приведи пример такого случая.
  explanation: Развилка в next_action возвращает получателю работу по принятию решения — ровно то, что передача должна была унести с собой.
  kind: open
  reference: 'Конкретность — про то, названо ли действие исполнимо: указана команда, файл, участок кода, а не тема («разобраться с экспортом» неконкретно). Детерминированность — про то, единственный ли маршрут остаётся у получателя: формулировка вида «перезапустить тесты экспорта или исправить замечание ревью» конкретна в обеих ветках, но оставляет выбор, и следующая сессия решает то, что предыдущая уже могла решить. Передача снимает выбор, а не только называет действия.'
  id: 008-next-action-rule-2
  fingerprint: 826e77d7
- concept: детерминированность обязательна только для первого шага, а не для всего дальнейшего маршрута
  question: 'Возражение: «Нельзя требовать детерминированного next_action — исход первой же команды может изменить весь план». Что с этим возражением?'
  explanation: next_action не предсказывает сессию, а запускает её. До получения результата первого действия маршрут один; дальше начинается обычная работа с новым знанием.
  kind: choice
  options:
    - 'Оно верно: если дальнейший ход работы неизвестен, next_action допустимо оставить в виде направления'
    - 'Оно бьёт мимо: детерминированность требуется от первого наблюдаемого действия, а не от всей последовательности — что делать после, решает его результат'
    - 'Оно верно: детерминированный next_action уместен только когда задача почти завершена и вариантов не осталось'
  correct: 1
  id: 008-next-action-rule-3
  fingerprint: 5ecd770d
