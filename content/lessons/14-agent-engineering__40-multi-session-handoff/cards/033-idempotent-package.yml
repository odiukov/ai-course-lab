- concept: значения, зависящие от момента запуска, лишают сравнение пакетов различающей силы
  question: В основной форме пакета лежат время генерации и путь с идентификатором сессии. Чем это плохо, если сам верстак между запусками не менялся?
  explanation: 'Ценность пакета частично в сравнимости: различие должно означать изменение состояния. Метки времени и ID запуска создают шум, который выглядит как изменение; их место — в служебных сведениях рядом, а не в основном содержании.'
  kind: choice
  options:
    - Два запуска дают разные файлы, и по различию больше нельзя судить, изменилось ли состояние работы
    - Такие поля увеличивают размер пакета настолько, что он перестаёт помещаться в контекст
    - Следующая сессия не сможет распарсить пакет из-за лишних полей
    - Идентификатор сессии раскрывает приватные данные пользователя
  correct: 0
  id: 033-idempotent-package-1
  fingerprint: cbcd0127
- concept: устойчивый ключ сортировки коллекций — условие воспроизводимости пакета
  question: Сборщик берёт список изменённых файлов в том порядке, в каком их вернул обход каталога, и время от времени порядок оказывается другим. Что нужно исправить?
  explanation: Идемпотентность требует, чтобы каждое место, где есть свобода порядка, было закрыто детерминированным правилом. Порядок обхода файловой системы такой гарантии не даёт.
  kind: choice
  options:
    - Сортировать коллекцию по устойчивому ключу перед записью, чтобы один вход всегда давал одну раскладку
    - Записывать список файлов одной строкой, чтобы порядок не был виден
    - Хранить в пакете только количество изменённых файлов
    - Фиксировать порядок случайным зерном, одинаковым для всех проектов
  correct: 0
  id: 033-idempotent-package-2
  fingerprint: 3827c35c
- concept: идемпотентность — свойство относительно снимка входов, а не запрет на изменение пакета
  question: 'Инженер говорит: «Если генератор идемпотентный, значит пакет вообще не должен меняться». В чём он ошибается?'
  explanation: 'Проверка формулируется так: зафиксировать снимок входов, запустить дважды, сравнить хеши. Совпадение при том же снимке и различие при изменённом — оба нормальны.'
  kind: open
  reference: 'Идемпотентность привязана к снимку входных артефактов: одинаковый вход обязан давать побайтово одинаковый выход. Изменился вход — пакет вправе и должен измениться. Свойство не замораживает содержание, оно убирает шум, чтобы всякое различие означало реальное изменение состояния работы.'
  id: 033-idempotent-package-3
  fingerprint: e15c47eb
