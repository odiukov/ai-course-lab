- concept: changed_files даёт обзор затронутых файлов, а не воспроизводит содержимое правок
  question: Инженер вставляет в пакет передачи полный текст диффа — 900 строк изменений с контекстом. Что не так с таким заполнением поля changed_files?
  explanation: changed_files отвечает на вопрос «дифф одним взглядом». Содержимое правок уже сохранено в репозитории и восстанавливается дешёво, поэтому пакет несёт указатель на область изменений, а не копию кода. Раздутое поле делает пакет дорогим для чтения, ничего не добавляя.
  kind: choice
  options:
    - 'Ничего: чем полнее дифф, тем меньше вопросов у следующей сессии'
    - Поле должно давать дифф одним взглядом — перечень затронутых файлов; сам текст правок берётся из репозитория и дублировать его в пакете незачем
    - 'Дифф вообще не место в передаче: изменения описывает summary'
    - Дифф нужно перенести в commands_run, раз он получен командой diff
  correct: 1
  id: 007-derive-risks-1
  fingerprint: '92057129'
- concept: summary — сжатая рамка сделанного, а не хронология сессии
  question: Пакет передачи содержит отдельные поля под команды, изменённые файлы, неудачные попытки и открытые риски. Какую тогда работу выполняет поле summary и почему его держат размером в абзац?
  explanation: Каждое из семи полей отвечает на свой вопрос. summary отвечает на «что было сделано» одним абзацем; если он разрастается до хронологии, пакет начинает хранить одно и то же дважды, и следующей сессии приходится сверять две версии событий.
  kind: open
  reference: 'summary отвечает на вопрос «что было сделано» и даёт получателю рамку, в которую укладываются остальные поля: без неё список файлов и команд читается как набор фактов без цели. Хронология и детали уже разложены по специализированным полям — команды в commands_run, отвергнутые подходы в failed_attempts, угрозы в open_risks, — поэтому пересказывать их в summary значит дублировать пакет. Абзац — это ровно тот объём, который задаёт контекст и не превращается в второй отчёт.'
  id: 007-derive-risks-2
  fingerprint: 27fdabb1
