- concept: информация теряется в момент работы, а не в момент сборки пакета
  question: Генератор не сумел включить в передачу причину, по которой одна из попыток исправления ничего не доказала. В какой момент эта информация была потеряна и что из этого следует для работы агента?
  explanation: Качество передачи определяется дисциплиной ведения артефактов в процессе, а не усилием в момент закрытия сессии — именно поэтому усталость в конце дня перестаёт влиять на результат.
  kind: open
  reference: 'Потеря произошла не при сборке пакета, а во время работы: причина не была зафиксирована в артефакте верстака. Генератор умеет только сводить то, что записано, — восстановить незаписанное он не может. Отсюда смещение обязанностей агента: не сочинять пересказ в конце сессии, а по ходу работы оставлять верстак читаемым — записывать решение, сохранять результат проверки, отмечать незавершённое действие.'
