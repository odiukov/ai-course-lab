- concept: функция представления не изменяет переданный payload, иначе производная форма влияет на основную
  question: Почему функция, готовящая читаемую форму, обязана оставить полученный payload неизменённым, хотя ей и удобно было бы отсортировать или подчистить его на месте?
  explanation: 'Мутация входа стирает границу между источником и производной формой: после неё нельзя сказать, какая версия факта действующая.'
  kind: open
  reference: 'Тот же объект сериализуется в машиночитаемую форму. Правка на месте означает, что оформление задним числом меняет источник фактов: направление зависимости переворачивается. Рендер должен строить новую строку из копий значений, а любую нужную сортировку или фильтрацию делать сборщик — тогда обе формы остаются проекциями одного неизменного содержания.'
