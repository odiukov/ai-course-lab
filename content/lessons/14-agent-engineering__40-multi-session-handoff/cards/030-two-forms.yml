- concept: 'две формы пакета различаются представлением, а не множеством утверждений: оформление для человека не может добавлять решений, рисков или действий, которых нет в машиночитаемой форме'
  question: Перед закрытием сессии инженер дописал в человекочитаемый файл передачи ещё один открытый риск, показавшийся ему важным, а машиночитаемый файл не тронул. Что стало с пакетом?
  explanation: 'Обе формы — представления одного содержания. Расширение только одного представления делает их неэквивалентными: агент грузит поля и о дописанном риске не узнает. Правка вносится в исходное содержание, после чего обе формы создаются заново.'
  kind: choice
  options:
    - 'Пакет стал полнее: человек получил дополнительный риск, а агент и так работает по остальным полям'
    - 'Пакет повреждён: появилось утверждение без соответствия в машиночитаемой форме, поэтому следующая сессия его не увидит; риск нужно внести в источник и пересобрать обе формы'
    - 'Пакет корректен, пока человекочитаемая форма не противоречит машиночитаемой напрямую: добавление нового пункта противоречием не является'
    - Пакет корректен, но приоритет теперь переходит к человекочитаемой форме как к более свежей
  correct: 1
  id: 030-two-forms-1
  fingerprint: a276dfb6
- concept: приоритет одного формата назначается заранее, до появления конфликта, чтобы момент расхождения не требовал разбирательства о том, какая версия действующая
  question: Почему в схеме передачи заранее записывают, какое из двух представлений считается основным, вместо того чтобы разбираться при обнаружении расхождения — какое из них свежее и правдоподобнее?
  explanation: Смысл правила приоритета — не в достоинствах формата, а в устранении выбора в момент конфликта. Без заранее зафиксированного источника истины человек и следующая сессия могут разойтись в том, что считать инструкцией.
  kind: open
  reference: 'Расхождение обнаруживается в худший момент: получатель уже открыл пакет и должен действовать. Разбирательство «какое свежее» требует данных, которых у получателя нет (порядок правок, кто что менял), и допускает два разных вывода у человека и у агента — то есть два разных плана по одному пакету. Заранее назначенный основной формат делает разрешение конфликта механическим: действующим считается назначенный, второе представление объявляется испорченным и пересобирается. Правило выбирает не более качественный формат, а единственный назначенный, чтобы решение не зависело от суждения в момент спора.'
  id: 030-two-forms-2
  fingerprint: f0480c25
- concept: расхождение представлений чинится в исходном содержании и пересборкой производной формы, а не ручной подгонкой одного файла под другой
  question: Получатель открыл пакет и увидел, что человекочитаемая и машиночитаемая формы называют разное следующее действие. Расставь действия в правильном порядке.
  explanation: Представления производны от одного содержания, поэтому ручная правка любого из них лечит симптом и оставляет источник расхождения на месте. Сначала снимается блокировка (действует назначенный формат), потом чинится источник, потом обе формы пересобираются.
  kind: order
  items:
    - Считать действующей ту форму, которая заранее назначена основной, и не гадать, какая свежее
    - Вернуться к исходным артефактам, из которых собирался пакет, и установить, какое значение верно
    - Внести исправление в исходное содержание, а не в одно из готовых представлений
    - Заново создать обе формы из исправленного содержания и убедиться, что они снова совпадают
  id: 030-two-forms-3
  fingerprint: 14a00b17
