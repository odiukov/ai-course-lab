- concept: 'независимость пакета от механизма сжатия следует из его источника: он собирается из состояния работы, а не из вывода compaction'
  question: Почему пакет передачи нельзя собирать из результата сжатия переписки, если хочется, чтобы он оставался переносимым?
  explanation: 'Разделение ответственности: compaction служит текущей сессии, схема пакета — следующей. Общий источник у них разный, и именно поэтому пакет переживает смену инструмента.'
  kind: open
  reference: 'Вывод механизма сжатия — продукт конкретного инструмента: его формат, его правила отбора, его потери. Пакет, построенный поверх такого вывода, унаследовал бы всё три: он менялся бы при смене инструмента, а при смене алгоритма отбора терял бы другие детали, и получатель не мог бы полагаться на состав полей. Поэтому источник пакета — состояние работы: артефакты верстака, отчёты проверок и ревью, журнал. Тогда смена стратегии сжатия меняет только то, что происходит с внутренней памятью инструмента, и не затрагивает ни смысл полей пакета, ни способ продолжить работу по нему.'
