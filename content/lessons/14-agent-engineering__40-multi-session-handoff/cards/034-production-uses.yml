- concept: запуск генератора привязан к событию конца сессии, а не к памяти человека о команде
  question: Генератор пакета работает и запускается вручную, но передачи в проекте всё равно почти не появляются. Что именно чинит хук конца сессии?
  explanation: 'Хук ничего не решает о содержании: правила сборки остаются в генераторе. Он закрывает единственную дыру — момент запуска, который иначе держится на дисциплине человека в конце тяжёлого дня.'
  kind: choice
  options:
    - Он привязывает генерацию к событию завершения сессии, поэтому пакет не зависит от того, вспомнили ли команду
    - Он решает, какие риски попадут в пакет, разгружая сборщик
    - Он гарантирует, что входные артефакты актуальны на момент сборки
    - Он объединяет читаемую и машиночитаемую формы в один файл
  correct: 0
