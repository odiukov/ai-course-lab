- concept: содержимое передачи — проверяемое состояние и граница незавершённого, а не субъективная оценка прогресса
  question: Какая запись из конца сессии реально пригодна для продолжения работы?
  explanation: 'Первый, второй и четвёртый варианты описывают впечатление от работы — их нельзя продолжить. Третий называет, что подтверждено, где проходит граница неработающего и как это воспроизвести: следующая сессия действует, а не расследует.'
  kind: choice
  options:
    - «Хорошо продвинулись по экспорту отчётов, осталось совсем немного»
    - «Экспорт улучшен, качество кода заметно выросло»
    - «Экспорт в CSV работает, экспорт в XLSX падает на пустой таблице; воспроизводится командой запуска экспорта на пустом наборе»
    - «Потратили сессию на экспорт, было сложно, но результат есть»
  correct: 2
  id: 002-handoff-vs-status-1
  fingerprint: 7c3b97bc
- concept: 'критерий отличия передачи от отчёта о достижениях: адресат — тот, кто садится за работу, а не тот, кто её оценивает'
  question: Сформулируй проверку, по которой можно за секунду отличить пакет передачи от отчёта о достижениях.
  explanation: Оценочные формулировки не содержат рабочей нити; их нельзя продолжить, можно только заново расследовать. Передача заканчивается движением в будущее, а не похвалой прошлому.
  kind: open
  reference: 'Отчёт написан для оценки: он говорит, сколько сделано и насколько хорошо («улучшили», «почти готово», «нашли несколько проблем»). Передача написана для того, кто немедленно продолжает: она называет подтверждённое состояние, границу незавершённого и конкретное первое движение. Проверка: попробуй по тексту начать работать. Если из записи нельзя вывести ни одного наблюдаемого действия — это отчёт, а не передача.'
  id: 002-handoff-vs-status-2
  fingerprint: eb7eec56
