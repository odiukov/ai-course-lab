- concept: 'цена отсутствующей передачи не разовая: восстановление контекста повторяется на каждой новой сессии по задаче'
  question: Задача тянется через много сессий, и передача ни разу не оформляется. Как ведёт себя цена восстановления контекста?
  explanation: Восстановленный контекст живёт внутри сессии и умирает вместе с ней. Каждый новый старт по той же задаче оплачивает восстановление снова — расход накапливается до конца жизни задачи.
  kind: choice
  options:
    - 'Платится один раз: после первого восстановления контекст закрепляется в репозитории'
    - Платится заново на каждом старте сессии, пока задача жива
    - Убывает с каждой сессией, потому что код становится понятнее
    - Появляется только при смене человека, а не при смене сессии
