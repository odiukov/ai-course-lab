- concept: порядок элементов коллекции — часть содержания, представление обязано его сохранять
  question: В машиночитаемой форме риски идут по убыванию серьёзности. Рендерер решил сгруппировать их по файлам, потому что так читать удобнее. Объясни, почему это ошибка представления, а не улучшение оформления.
  explanation: 'Признак допустимого оформления: содержание можно восстановить обратно. Перегруппировка стирает исходный порядок и потому добавляет новое утверждение о приоритете.'
  kind: open
  reference: 'Множество элементов сохранилось, но порядок нёс утверждение — что чинить первым. Перестановка меняет содержание пакета: человек прочитает один приоритет, агент загрузит другой. Представление вправе добавлять заголовки, отступы и списки, но обязано обходить элементы в том же порядке, что и основная форма; группировку можно вводить, только если она задана самим содержанием.'
  id: 031-markdown-projection-2
