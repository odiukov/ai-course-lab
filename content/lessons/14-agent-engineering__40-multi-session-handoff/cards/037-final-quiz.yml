- concept: сверка предусловий — обязанность принимающей сессии после генерации, а не часть сборки пакета автором
  question: Расставь фазы безопасной передачи между двумя сессиями в порядке выполнения.
  explanation: 'Сдающая сторона отвечает за чистоту состояния и за сборку пакета из артефактов. Проверка предусловий принадлежит принимающей стороне: она сравнивает описание в пакете с реальностью уже в новом контексте, до первого действия. Если сдвинуть эту сверку внутрь генерации, она проверит состояние, которого получатель никогда не увидит.'
  kind: order
  items:
    - 'Привести рабочее состояние в порядок: закоммитить или явно отложить изменения, убрать отладочные артефакты'
    - Проверить условия чистоты и собрать список блокеров; пустой список открывает генерацию
    - 'Запустить генератор: собрать поля из артефактов верстака и записать обе формы пакета'
    - Закрыть сессию и начать следующую в свежем контексте
    - Найти действующую передачу по ветке, теме и статусу и сверить её предусловия с реальным состоянием
    - Выполнить next_action либо зафиксировать блокировку, если предусловие не совпало
  id: 037-final-quiz-1
  fingerprint: 73ff5df3
- concept: 'полнота полей пакета и чистота состояния — независимые условия: форма может быть завершённой при неготовом состоянии'
  question: Все обязательные поля пакета заполнены значениями, взятыми из артефактов верстака, схема валидна, обе формы совпадают. При этом в рабочем каталоге лежит наполовину применённый дифф. Что верно про такую передачу?
  explanation: 'Схема проверяет форму данных: наличие полей и их типы. Шлюз чистоты проверяет мир, из которого эти данные взяты. Эти два условия не выводятся одно из другого, поэтому идеально оформленный пакет поверх наполовину применённого диффа передаёт получателю состояние, которое тот не сможет ни воспроизвести, ни продолжить.'
  kind: choice
  options:
    - 'Передача готова: валидная схема и заполненные поля означают, что состояние проверено'
    - 'Передача не готова: полнота формы ничего не говорит о состоянии, а незакоммиченный частичный дифф нарушает условие чистоты'
    - Передача готова, если дифф упомянут в summary
    - Передача не готова только потому, что схема не описывает рабочий каталог
  correct: 1
  id: 037-final-quiz-2
  fingerprint: 363da1d7
- concept: пакет обязан быть самодостаточным, потому что получатель стартует в свежем контексте, где истории диалога нет
  question: Почему в пакете передачи бесполезны формулировки вроде «продолжить по обсуждённому плану» или «как решили ранее», даже если предыдущая сессия действительно всё это обсуждала?
  explanation: 'Проверка простая: поймёт ли пакет тот, кто не читал ни строчки предыдущей сессии. Ссылка на артефакт по пути проходит эту проверку, ссылка на разговор — нет.'
  kind: open
  reference: 'Получатель пакета — сессия в свежем контексте: переписки предыдущей сессии у неё нет и восстановить её неоткуда. Пакет — единственный канал между сессиями, поэтому любая отсылка к невидимому источнику превращается в ссылку в пустоту: поле формально заполнено, но факта не несёт. Всё, на что опирается решение — принятые решения, отвергнутые подходы с причинами, открытые риски, следующее действие с его предусловиями — должно быть развёрнуто внутри пакета или адресовано через указатель на существующий артефакт (путь к отчёту верификации или ревью), который получатель может открыть.'
  id: 037-final-quiz-3
  fingerprint: 3deb5351
