- concept: 'порядок сборки задан зависимостями: следующее действие вычисляется после рисков, на которые опирается'
  question: Расположи шаги сборщика пакета в порядке, при котором каждый шаг получает уже готовые входные данные.
  explanation: Выбор действия читает риски, поэтому не может им предшествовать; поля собираются, когда все вычисления закончены. Перестановка не просто некрасива — она даёт пакет, где `next_action` не связан с рисками, попавшими в тот же пакет.
  kind: order
  items:
    - сократить журнал обратной связи по правилу выжимки
    - вывести открытые риски из вердикта, ревью и сокращённого журнала
    - выбрать ровно одно следующее действие с опорой на полученные риски
    - разложить значения снимка и вычисленные результаты по обязательным полям пакета
    - добавить предусловия продолжения, вычисленные по собранному состоянию
  id: 029-build-handoff-1
  fingerprint: 15d82c45
- concept: координатор не дублирует правила специализированных функций внутри себя
  question: 'Сборщик пакета вызывает функцию выбора следующего действия, но дополнительно содержит собственную проверку: «если среди рисков есть критический, заменить действие на запуск полного набора тестов». Что здесь не так?'
  explanation: У правила должен быть один владелец. Копия правила в координаторе переживёт правку оригинала и начнёт тихо переопределять его результат — воспроизводимость пакета исчезнет.
  kind: choice
  options:
    - 'Ничего: дублирующая проверка — дешёвая страховка от ошибки в специализированной функции'
    - Правило выбора теперь живёт в двух местах и со временем разойдётся, а какая из реализаций сработала, по пакету не видно
    - 'Проблема только в производительности: риски просматриваются дважды'
    - Проверка допустима, но её нужно выполнять до сокращения журнала обратной связи
  correct: 1
  id: 029-build-handoff-2
  fingerprint: '07251302'
- concept: 'обязательные поля присутствуют всегда: пустое значение и отсутствие поля — разные сообщения получателю'
  question: На снимке верстака нет ни открытых рисков, ни отвергнутых подходов. Каким должен получиться пакет?
  explanation: Пустой список — утверждение «искали и не нашли»; отсутствующее поле — «неизвестно, искали ли вообще». Получатель и парсер должны различать эти случаи, поэтому набор полей фиксирован.
  kind: choice
  options:
    - 'Поля рисков и отвергнутых подходов опускаются: пустые секции только засоряют пакет'
    - Оба поля присутствуют с пустыми списками — схема пакета одинакова при любом содержимом снимка
    - Вместо полей ставится пометка «проверено, чисто», чтобы получатель не искал пропущенное
    - 'Сборка прерывается: пакет без рисков означает, что снимок собран неполно'
  correct: 1
  id: 029-build-handoff-3
  fingerprint: 1d1c378e
