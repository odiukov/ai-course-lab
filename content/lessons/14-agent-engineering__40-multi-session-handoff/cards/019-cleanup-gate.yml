- concept: 'результат уборки действителен только для того состояния, в котором был вычислен: после любой правки проверки перезапускаются целиком'
  question: Фаза уборки нашла один забытый черновой файл. Инженер удаляет его и хочет сразу генерировать пакет передачи, опираясь на прежний отчёт уборки с этой единственной записью. Что тут неверно?
  explanation: 'Отчёт уборки — снимок состояния, а не список поручений. Правка меняет верстак: удаление файла могло сопровождаться другими действиями, а тесты и ветка после него никем не проверялись. Право на генерацию даёт только свежий прогон, вернувший пустой список.'
  kind: choice
  options:
    - 'Ничего: запись была одна, она устранена, отчёт можно считать закрытым'
    - Прежний отчёт описывает состояние на момент прошлого прогона и не подтверждает остальные условия — тесты, ветку, состояние рабочего дерева — после правки; нужен новый прогон с пустым списком
    - Удаление файла вообще не относится к уборке, поэтому отчёт не меняется
    - Достаточно вручную вычеркнуть запись из отчёта и сохранить его заново
  correct: 1
  id: 019-cleanup-gate-1
  fingerprint: cc65644a
- concept: к временным артефактам, делающим состояние грязным, относятся не только файлы, но и отладочная печать и закомментированные блоки кода
  question: Всё закоммичено, ветка та, тесты зелёные, доска фич совпадает с реальностью. В коде остались отладочная печать и закомментированный кусок старой реализации. Чистое ли это состояние?
  explanation: 'Строка про временные артефакты покрывает и файлы, и мусор внутри кода. Следующая сессия читает дифф как осмысленную работу: отладочная печать выглядит как намеренная диагностика, закомментированный блок — как отложенный вариант, и оба крадут время на выяснение.'
  kind: choice
  options:
    - 'Да: раз всё закоммичено, содержимое кода уборку не касается'
    - 'Нет: отладочная печать и закомментированные блоки — такие же временные артефакты, как черновые файлы; они засоряют дифф и картину мира следующей сессии'
    - Да, если печать выводится только при включённом флаге
    - 'Нет, но только из-за закомментированного кода: печать безвредна'
  correct: 1
  id: 019-cleanup-gate-2
  fingerprint: 131f94fa
