- concept: 'генератор сводит артефакты, но не проверяет их истинность: устаревший вход даёт уверенно оформленный, но неверный пакет'
  question: Код был исправлен уже после последнего прогона верификации, и `verification_report.json` остался старым. Что попадёт в пакет передачи и какой вывод отсюда следует о роли генератора?
  explanation: Пакет не становится умнее своих источников. Пустой, устаревший или противоречивый вход не ломает генерацию — он тихо переносит ошибку в новую сессию, где она выглядит подтверждённой.
