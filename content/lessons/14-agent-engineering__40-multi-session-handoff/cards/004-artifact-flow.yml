  reference: 'В пакет попадёт устаревший вердикт: генератор не перезапускает проверки и не сверяет отчёт с репозиторием, он только пересказывает то, что записано во входных артефактах. Расхождение будет аккуратно оформлено и передано дальше как факт, и следующая сессия построит на нём решения. Вывод: качество передачи ограничено качеством артефактов, а обязанность агента — оставить верстак в актуальном состоянии, а не рассчитывать, что генератор восстановит правду.'
