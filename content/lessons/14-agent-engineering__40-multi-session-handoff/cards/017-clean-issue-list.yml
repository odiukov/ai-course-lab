- concept: в список блокеров попадают только нарушения условия чистоты, успешные проверки не записываются
  question: Из четырёх выполненных проверок три прошли успешно, одна нарушена. Что должно оказаться в clean_state.json?
  explanation: 'clean_state.json отвечает на вопрос «что исправить перед генерацией передачи». Запись «временных файлов нет» ничего исправлять не помогает и только разбавляет список. Пустой список при этом осмыслен: он означает, что обход был и препятствий не найдено.'
  kind: choice
  options:
    - Одна запись — про нарушенную проверку
    - 'Четыре записи: три с отметкой «в порядке» и одна с нарушением'
    - Одна общая запись «состояние грязное» без деталей
    - Ничего, пока нарушений не станет больше одного
  correct: 0
  id: 017-clean-issue-list-1
  fingerprint: d36acc67
- concept: красный тест блокирует передачу только тогда, когда его падение не названо в open_risks
  question: Прогон тестов красный. В каком случае это НЕ добавляет запись в список блокирующих проблем?
  explanation: 'Проверка тестов сравнивает не только цвет результата, но и наличие объяснения. Заявленное падение — информация: следующая сессия знает, что оно унаследовано. Незаявленное — ловушка: следующая сессия решит, что сломала его сама, и потратит время на поиск несуществующей регрессии.'
  kind: choice
  options:
    - Если именно это падение уже названо в open_risks пакета
    - Если падение воспроизводится стабильно, а не время от времени
    - Если падение не связано с файлами, изменёнными в этой сессии
    - Если остальные четыре проверки прошли успешно
  correct: 0
  id: 017-clean-issue-list-2
  fingerprint: 48a484cd
- concept: сохраняются все нарушения, а не первое найденное, и пустой список не означает, что работа завершена
  question: Обход обнаружил три независимых нарушения. Почему в clean_state.json нужно записать все три, а не остановиться на первом? И что означает пустой список?
  explanation: 'Полнота списка делает уборку одной фазой, а не серией итераций. И пустой clean_state.json — предусловие генерации передачи, а не отметка о завершении работы: это два разных утверждения о состоянии верстака.'
  kind: open
  reference: 'Список — это перечень того, что нужно исправить перед генерацией передачи. Если записать только первое нарушение, автор устранит его, перезапустит обход и обнаружит второе, потом третье: уборка растянется на несколько кругов вместо одного. Пустой список означает не «задача сделана», а лишь «вход в следующую сессию не содержит скрытых ловушек»: работа может оставаться незавершённой, а состояние при этом быть передаваемым.'
  id: 017-clean-issue-list-3
  fingerprint: 1bfcaf87
