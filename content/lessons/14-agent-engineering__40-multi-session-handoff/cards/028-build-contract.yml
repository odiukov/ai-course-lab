- concept: недостающий факт оформляется как пробел, ошибка сборки или явное «неизвестно», но не заменяется правдоподобной догадкой
  question: Артефакты не содержат коммита, на котором проверки в последний раз были зелёными. Как правильно заполнить соответствующее поле пакета?
  explanation: 'Пробел следующая сессия проверит, а догадка будет принята за состояние работы. Тихое удаление поля тоже плохо: оно превращает известное отсутствие в невидимое, и получатель не узнает, что данных не хватает.'
  kind: choice
  options:
    - 'Взять последний коммит ветки: скорее всего проверки на нём и проходили'
    - Оставить поле пустым, поставить явное «неизвестно» или уронить сборку с ошибкой — по принятой схеме
    - Удалить поле из пакета, чтобы схема не требовала недостающего значения
    - Восстановить значение по времени последнего успешного прогона тестов
