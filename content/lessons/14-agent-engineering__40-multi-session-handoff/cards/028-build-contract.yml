- concept: сборка payload — заполнение формы по документам, а не генерация текста
  question: Почему сборку payload описывают как заполнение формы по документам, и какие операции над данными при этом разрешены?
  explanation: 'Сборщик — принтер чека, а не рассказчик: он печатает то, что уже пробито. Правило проверяемо: для каждого поля можно назвать артефакт-источник.'
  kind: open
  reference: 'Сборщик не источник знания, а посредник: он переносит значения из артефактов в поля схемы. Разрешены преобразование формата, фильтрация и вывод по заранее заданным правилам — идентификатор задачи из состояния, результаты из вердикта, замечания из ревью, выжимка журнала по фиксированному правилу, риски и следующее действие по своим алгоритмам. Запрещено любое утверждение, у которого нет источника: интерпретация, оценка прогресса, сглаживание формулировок. Иначе следующая сессия строит работу на догадке, принятой за измерение.'
