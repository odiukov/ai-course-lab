- concept: генератор поставляется настроенным на реальные пути артефактов конкретного проекта
  question: Что означает требование «генератор настроен на пути артефактов проекта», а не поставляется как универсальный скрипт?
  explanation: Правила сборки общие, а входы — местные. Скрипт без привязки к реальным путям либо читает пустоту, либо требует ручного пересказа при каждом запуске.
  kind: choice
  options:
    - В конфигурации указаны фактические расположения доски задач, журнала обратной связи и отчётов проверок этого проекта
    - Генератор переписывается под каждый проект с нуля, включая правила выбора следующего действия
    - Пути к артефактам вычисляются во время запуска по идентификатору сессии
    - Генератор хранит копии артефактов внутри себя, чтобы не зависеть от проекта
  correct: 0
