- concept: 'цепочка поставки замыкается: событие запускает генерацию, сборка читает артефакты, схема проверяет форму, затем пишутся обе формы'
  question: Расставь шаги поставленного комплекта передачи в порядке их срабатывания.
  explanation: 'Каждое звено закрывает свой отказ: без хука пакет не появится, без настроенных путей будет пустым, без схемы — незаметно поменяет форму. Проверка схемой стоит до записи, иначе битый пакет уже уехал получателю.'
  kind: order
  items:
    - Сессия завершается, и срабатывает хук конца сессии
    - Генератор читает артефакты верстака по настроенным путям проекта
    - Собранное содержание проверяется на соответствие схеме пакета
    - 'Пакет записывается в двух формах: машиночитаемой основной и производной читаемой'
  id: 035-shipping-contract-3
  fingerprint: 15267cb5
