- concept: при сжатии выбор переживающего делает алгоритм, при переходе в свежую сессию — автор пакета; переносится выбранное состояние, а не сокращённая переписка
  question: Чем принципиально различается содержимое, доступное после сжатия контекста и после перехода в свежую сессию по пакету?
  explanation: 'Сжатие обрабатывает диалог и решает за тебя, какие реплики выживут. Пакет собирается из состояния работы и содержит поля, за которые отвечает автор. Отсюда и разная надёжность старта: в одном случае получатель читает пересказ разговора, в другом — заявленное состояние задачи.'
  kind: choice
  options:
    - 'Объёмом: пакет всегда короче выжимки'
    - 'Источником и выбором: сжатие оставляет то, что счёл важным алгоритм, из переписки; пакет несёт состояние, отобранное автором из артефактов работы — факты, риски, следующий шаг, предусловия'
    - 'Форматом: выжимка хранится в файле, а пакет — в истории сообщений'
    - 'Ничем: пакет — это та же выжимка, только записанная отдельно'
  correct: 1
