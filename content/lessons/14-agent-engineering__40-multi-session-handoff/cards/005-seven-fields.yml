- concept: commands_run фиксирует фактически выполненные команды, а не намеченный план запусков
  question: Почему в пакете передачи `commands_run` описывают как список команд, которые действительно выполнялись, а не как список команд, которые следовало выполнить?
  explanation: Ценность поля в том, что оно проверяемо. `commands_run` вместе с `verdict_pointer` даёт основания выводов; список намерений таких оснований не даёт и маскирует непроверенные места.
  kind: open
  reference: 'Следующая сессия принимает решения, опираясь на то, что уже проверено. План запусков не отличает выполненное от невыполненного: увидев в поле `pytest -k refresh`, читатель решит, что тест гонялся, хотя он мог быть только намечен. Фактический список даёт проверяемое состояние — какие проверки прогонялись, в каком виде и с каким результатом — и очерчивает границу непроверенного, которую нужно закрыть. Список намерений превращает пакет в план работ и порождает ложную уверенность в покрытии.'
  id: 005-seven-fields-3
  fingerprint: 777c8682
