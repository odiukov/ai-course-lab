- concept: verdict_pointer хранит путь к отчётам верификации и ревью, а не пересказ их выводов внутри пакета
  question: Какое поле пакета передачи заполняется путями к отчёту верификации и отчёту ревью?
  explanation: '`verdict_pointer` ссылается на артефакты с выводами, а не копирует их. Пересказ вывода внутри пакета стареет отдельно от самого отчёта и не даёт увидеть основания — покрытие, конкретные упавшие проверки, замечания ревью.'
  kind: cloze
  template: |-
    handoff:
      summary: "Переписан парсер конфигурации"
      changed_files: ["config/parser.py", "tests/test_parser.py"]
      ___: ["reports/verify-latest.json", "reports/review-latest.md"]
  answer: verdict_pointer
  accept:
    - verdict_pointer
    - verdict pointer
