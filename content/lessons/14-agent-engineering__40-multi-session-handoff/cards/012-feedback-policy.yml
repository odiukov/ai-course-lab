- concept: правило выжимки — объединение последних K и всех записей с ненулевым кодом выхода, пересечение считается один раз
  question: В журнале обратной связи 500 записей. В пакет берут последние K = 20 записей плюс каждую запись с ненулевым кодом выхода. Падений в журнале 7, из них 2 попали в последние 20 записей. Сколько строк окажется в пакете?
  explanation: 'Это объединение двух множеств, а не сумма: 20 последних + 7 падений − 2 падения, уже входящих в последние 20, = 25 строк. Запись, удовлетворяющая обоим правилам, попадает в пакет один раз; дублирование раздуло бы пакет и создало ложное впечатление двух разных событий.'
  kind: numeric
  answer: 25
  tolerance: 0.5
  id: 012-feedback-policy-1
  fingerprint: cd28f33b
- concept: критерий отбора записей — информативность записи для текущей задачи, а не её давность
  question: Почему в выжимку журнала обратной связи безусловно берут каждый запуск с ненулевым кодом выхода, даже месячной давности, а старые успешные запуски отбрасывают?
  explanation: 'Отбор идёт по информативности, а не по свежести. Параметр K ограничивает давность обычного контекста — последние замеры показывают текущее состояние. Падение же несёт объяснение: какой запуск сломался и при каких обстоятельствах; оно может отвечать за проблему, которая жива до сих пор, поэтому срок давности к нему не применяется.'
  kind: choice
  options:
    - Падения занимают меньше места, чем успешные записи
    - Успешный старый запуск подтверждает лишь прошлое состояние и редко объясняет текущую проблему, а падение хранит след возможно незакрытого риска
    - Успешные запуски восстанавливаются из git log, а падения нигде больше не сохраняются
    - Ненулевой код выхода означает, что запись повреждена, и её нужно передать для ручной проверки
  correct: 1
  id: 012-feedback-policy-2
  fingerprint: 1b8436b2
- concept: выжимка сокращает пакет, но не заменяет и не удаляет полный журнал
  question: Следующая сессия читает выжимку журнала обратной связи и подозревает, что причина сбоя лежит в успешном прогоне, не попавшем в пакет. Что она может сделать?
  explanation: 'Выжимка — это выбор того, что читается сразу, а не операция удаления. Полный журнал остаётся артефактом верстака и подгружается по требованию. Поэтому правило можно делать агрессивным: цена ошибки отбора — один лишний переход к файлу, а не потеря истории.'
  kind: choice
  options:
    - 'Ничего: всё, что не попало в выжимку, при сборке пакета отбрасывается безвозвратно'
    - Поднять полный журнал — он остаётся на верстаке, а выжимка лишь ограничивает размер пакета
    - Пересобрать журнал, повторно запустив все команды из commands_run
    - Увеличить K и потребовать от предыдущей сессии перевыпустить пакет
  correct: 1
  id: 012-feedback-policy-3
  fingerprint: c3e86b18
