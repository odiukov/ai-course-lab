- concept: передача и чистое состояние отвечают на разные вопросы и не заменяют друг друга
  question: 'Новая сессия открывает репозиторий: рабочее дерево чистое, тесты зелёные, ветка ожидаемая, но пакета передачи нет. Чего именно не хватает агенту?'
  explanation: 'Чистое состояние доказывает, что верстак безопасно принять; передача доказывает, что известно, с чего начать. Здесь выполнено первое и отсутствует второе. Обратный перекос тоже возможен: идеальный handoff.md рядом с наполовину применённым диффом даёт задание, но не даёт среды, которой можно доверять.'
  kind: choice
  options:
    - 'Ответа на вопрос «что делать»: среда продолжаема, но нет ни рамки сделанного, ни открытых рисков, ни первого действия'
    - 'Ответа на вопрос «во что я попаду»: состояние репозитория без пакета считать намеренным нельзя'
    - 'Ничего: чистое состояние само по себе достаточно, чтобы продолжить работу'
    - Только доступа к полному журналу обратной связи предыдущей сессии
  correct: 0
  id: 015-clean-vs-handoff-1
  fingerprint: b497c756
- concept: уборка — отдельная фаза перед генерацией пакета, и пустой список блокеров является предусловием генератора
  question: Расставь по порядку конец одной сессии и вход в следующую.
  explanation: 'Порядок не декоративный: пакет описывает точку старта, поэтому он должен собираться после того, как эта точка зафиксирована. Пакет, собранный на грязном дереве, уверенно описывает состояние, которого уже нет, — и переадресует бардак вместо того, чтобы передать работу.'
  kind: order
  items:
    - Завершающая сессия приводит рабочее дерево, временные артефакты, тесты, доску фич и ветку в проверяемое состояние
    - Результат уборки фиксируется в clean_state.json со списком блокирующих проблем
    - Генератор убеждается, что список блокеров пуст, и собирает пакет из артефактов верстака
    - Следующая сессия открывает репозиторий и выполняет next_action из пакета
  id: 015-clean-vs-handoff-2
  fingerprint: 1edb6497
