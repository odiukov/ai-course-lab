- concept: открытый риск — незакрытое последствие наблюдения, а не сам факт ошибки или замечания
  question: Какая из ситуаций должна попасть в `open_risks` пакета передачи?
  explanation: 'Первый, третий и четвёртый случаи закрыты — это история работы, место которой в `failed_attempts` или `commands_run`. Незакрытым остаётся только непроверенный откат: последствие живёт дальше и ударит по следующей сессии.'
  kind: choice
  options:
    - Миграция базы падала при первом запуске, затем была переписана и прошла успешно
    - Ревью отметило, что откат миграции ни разу не проверялся на копии боевых данных
    - Линтер ругался на форматирование, файл отформатирован и закоммичен
    - Команда сборки была запущена не из того каталога и выдала ошибку пути
  correct: 1
  id: 006-risk-evidence-1
  fingerprint: 45a73098
- concept: уровень серьёзности риска измеряет возможный ущерб, а не уверенность автора или трудозатраты
  question: Что именно описывает уровень серьёзности у записи в `open_risks` и какие две вещи с ним часто путают?
  explanation: Уровень нужен следующей сессии для приоритета, а не для передачи эмоций. Оценка по уверенности прячет непроверенные места, оценка по трудозатратам раздувает безобидные.
  kind: open
  reference: 'Серьёзность описывает масштаб возможного ущерба, если риск сработает: что сломается, у кого и насколько дорого это исправлять. Путают с уверенностью автора («я почти уверен, что всё нормально» — это не низкий риск, а отсутствие проверки) и с затраченными усилиями («потратил полдня — значит серьёзно»). Формулировать риск полезно связкой: что неизвестно или может сломаться → на каком основании так считаешь → каковы последствия.'
  id: 006-risk-evidence-2
  fingerprint: '79397081'
- concept: зелёная проверка не снимает риск, если её покрытие не включало значимый случай
  question: Все автотесты платёжного модуля зелёные, но сценарий возврата средств прогонялся только в тестовом режиме платёжного шлюза. Как это отражается в пакете передачи?
  explanation: Вердикт верификации значим ровно в границах того, что он покрыл. Непокрытый случай — это неизвестность с ценой, то есть материал для `open_risks`, а не подтверждённое отсутствие проблемы.
  kind: choice
  options:
    - 'Никак: зелёные тесты означают, что открытых рисков по этому модулю нет'
    - 'Как открытый риск с указанием границы покрытия: поведение возврата на боевом шлюзе не подтверждено'
    - Как неудачная попытка, потому что боевой режим не удалось задействовать
    - Как замечание в `summary`, поскольку падения не было
  correct: 1
  id: 006-risk-evidence-3
  fingerprint: 8a97582d
