- concept: каждая запись списка называет конкретную причину, потому что список — руководство к исправлению, а не вердикт
  question: Функция проверки чистого состояния нашла нарушения. Какой вид записей делает список полезным для следующей сессии?
  explanation: Список читает тот, кто должен устранить препятствия. Общий вердикт «состояние грязное» заставляет заново выполнять весь обход, чтобы понять, что чинить, — то есть перекладывает работу вместо того, чтобы её передать.
  kind: choice
  options:
    - По одной записи на конкретное нарушение с указанием, что именно обнаружено и почему это блокирует передачу
    - Одна сводная запись «состояние грязное» — детали видны в самом репозитории
    - Булев флаг «чисто / грязно» без списка вообще
    - Полный протокол всех проверок, включая успешные, с их выводом
  correct: 0
  id: 018-clean-state-issues-1
  fingerprint: 41dcdcab
- concept: фиксированный порядок обхода проверок делает список блокеров воспроизводимым при одинаковом входе
  question: Зачем функция обходит проверки в жёстко заданном порядке — дерево, временные артефакты, тесты, доска, ветка?
  explanation: 'Воспроизводимость — свойство, за которое цепляются тесты функции и доверие следующей сессии: один вход, один выход. Если порядок зависит от обхода словаря или множества, два прогона на одном состоянии дадут разные списки, и различие придётся объяснять каждый раз заново.'
  kind: choice
  options:
    - Чтобы одинаковое состояние верстака всегда давало один и тот же список, независимо от порядка обхода внутренних структур данных
    - Чтобы проверки, стоящие раньше, отменяли проверки, стоящие позже
    - Чтобы обход можно было прервать сразу после первого найденного нарушения
    - Потому что этот порядок совпадает с очерёдностью исправления проблем
  correct: 0
