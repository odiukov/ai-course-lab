- concept: единый интерфейс nn.Module позволяет составлять модель из вложенных модулей с разной внутренней логикой
  question: Объясни своими словами, почему составная модель может одинаковым способом вызывать nn.Linear, nn.ReLU и другие вложенные модули, хотя они выполняют разные вычисления.
  explanation: nn.Module задаёт общий внешний интерфейс, а forward определяет внутреннее вычисление конкретного слоя или модели. Благодаря этому маленькие слои и целые сети можно вкладывать друг в друга и вызывать одинаково.
  kind: open
  reference: 'Все эти компоненты наследуются от nn.Module и поддерживают общий способ вызова: модуль получает входные данные, выполняет свой forward и возвращает результат. Поэтому составной модуль может соединять разные слои, не зная деталей их реализации.'
