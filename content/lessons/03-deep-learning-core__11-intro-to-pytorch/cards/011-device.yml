- concept: device определяет место хранения тензора и устройство выполнения вычислений
  question: Два тензора имеют одинаковые значения, shape и dtype, но у одного device равен "cpu", а у другого — "cuda". Что между ними различается?
  explanation: Свойство device указывает, где находится тензор и какое устройство выполняет вычисления над ним. Перенос между CPU и CUDA сам по себе не меняет значения, shape или dtype.
  kind: choice
  options:
    - Место хранения данных и устройство, выполняющее операции
    - Количество осей
    - Точность представления чисел
    - Числовые значения элементов
  correct: 0
  id: 011-device-1
  fingerprint: f367ad15
- concept: результат переноса тензора через to нужно сохранить в переменной
  question: Переменная device содержит выбранное устройство. Заполни пропуск, чтобы перенести тензор x на это устройство и сохранить результат.
  explanation: Метод x.to(device) возвращает тензор на указанном устройстве. Присваивание сохраняет этот результат в x; вызов без присваивания не меняет ссылку в переменной.
  kind: cloze
  template: x = ___
  answer: x.to(device)
  accept:
    - x.to("cuda")
    - x.cuda()
  id: 011-device-2
  fingerprint: 1cbe7027
