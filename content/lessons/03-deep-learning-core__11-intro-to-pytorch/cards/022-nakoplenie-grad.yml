- concept: optimizer.zero_grad очищает градиенты управляемых параметров, не изменяя сами параметры и уже выполненные обновления
  question: Объясни своими словами, что именно делает optimizer.zero_grad() и чего этот вызов не делает.
  explanation: Очистка нужна, чтобы следующий backward() сформировал градиенты только для нового шага обучения. Значения весов при вызове zero_grad() остаются прежними.
  kind: open
  reference: optimizer.zero_grad() очищает накопленные градиенты параметров, которыми управляет оптимизатор. Он не обнуляет значения параметров, не отменяет предыдущий optimizer.step() и не отключает autograd.
  id: 022-nakoplenie-grad-2
  fingerprint: 0fa419bc
