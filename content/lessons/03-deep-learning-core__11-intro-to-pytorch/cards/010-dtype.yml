- concept: память тензора уменьшается при сокращении числа байтов на элемент
  question: Модель не помещается в память ускорителя. Какое изменение непосредственно сократит память под значения тензора, если его форма и устройство остаются прежними?
  explanation: Объём памяти равен числу элементов, умноженному на размер одного элемента. Поэтому переход с float32, занимающего 4 байта, на float16 или bfloat16, занимающие 2 байта, сокращает память примерно вдвое.
  kind: choice
  options:
    - Выбрать формат с меньшим числом байтов на элемент
    - Переименовать оси тензора
    - Заменить создание тензора на изменение его формы
  correct: 0
  id: 010-dtype-1
  fingerprint: fc851b48
- concept: диапазон представимых значений и точность их записи являются разными свойствами числового формата
  question: Почему компактный формат с широким диапазоном экспоненты может быть удобнее другого формата того же размера при обучении больших моделей, даже если он хранит значения менее точно?
  explanation: bfloat16 занимает те же 2 байта, что и float16, но сохраняет примерно диапазон float32. Точность у него ниже, зато промежуточные значения реже выходят за пределы представимого диапазона.
  kind: open
  reference: Широкий диапазон позволяет представлять очень малые и очень большие значения без преждевременного переполнения или обнуления. Это иногда важнее, чем дополнительные значащие цифры.
  id: 010-dtype-2
  fingerprint: 18b08cfe
