- concept: перемешивание меняет порядок примеров, сохраняя соответствие входов и меток
  question: Объясни своими словами, что меняет параметр shuffle=True в DataLoader и что он не должен менять.
  explanation: Перемешиваются целые пары «изображение — метка». Содержимое примеров и правильные ответы остаются прежними, поэтому изображение не может случайно получить чужую метку.
  kind: open
  reference: Он меняет порядок, в котором пары входных данных и целевых меток попадают в очередной проход по выборке, но не разрывает соответствие между конкретным входом и его меткой.
  id: 042-dataloader-2
  fingerprint: 82f6bce6
- concept: несколько workers параллельно готовят данные, но их запуск может создавать лишние накладные расходы
  question: Какое утверждение о параметре num_workers в DataLoader верно?
  explanation: При num_workers=4 отдельные процессы могут готовить следующие батчи, пока модель считает текущий. Это полезно при чтении больших файлов с диска, а для небольших данных в памяти накладные расходы могут сделать num_workers=0 выгоднее.
  kind: choice
  options:
    - Несколько workers могут параллельно читать и преобразовывать следующие данные, но на маленькой выборке в памяти их запуск иногда замедляет работу
    - Чем больше workers, тем быстрее обучение при любых данных и оборудовании
    - Workers параллельно вычисляют градиенты и обновляют параметры модели
    - При нескольких workers каждый процесс обучает собственную независимую копию модели
  correct: 0
