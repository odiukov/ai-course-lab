- concept: CrossEntropyLoss принимает сырые логиты, поэтому Softmax перед ней не требуется
  question: Почему перед CrossEntropyLoss обычно не добавляют Softmax к выходу классификатора?
  explanation: Последний линейный слой выдаёт произвольные вещественные оценки классов. CrossEntropyLoss объединяет log-softmax и вычисление отрицательного логарифмического правдоподобия в одной численно устойчивой операции.
  kind: open
  reference: CrossEntropyLoss ожидает сырые логиты и внутри выполняет необходимую нормализацию через log-softmax. Предварительный Softmax лишний, меняет вход функции потерь и ухудшает численную устойчивость.
  id: 039-mnist-flow-2
  fingerprint: 8a585440
