- concept: SGD изменяет параметр на величину learning rate, умноженную на градиент, в направлении против градиента
  question: Перед обновлением параметр w равен 7, его градиент равен −6, а learning rate — 0.05. Чему станет равен w после одного шага SGD?
  explanation: Шаг SGD вычисляется как w ← w − η·w.grad. Поэтому w ← 7 − 0.05·(−6) = 7.3. Отрицательный градиент приводит к увеличению параметра.
  kind: numeric
  answer: 7.3
  tolerance: 0.001
  id: 028-ruchnoy-sgd-1
  fingerprint: 0d3b0367
- concept: ручное обновление параметров SGD выполняют вне вычислительного графа
  question: Почему ручное изменение обучаемого параметра после backward() обычно помещают в блок torch.no_grad()?
  explanation: Градиент уже вычислен вызовом backward(), а изменение параметра является внешним шагом оптимизации. torch.no_grad() не даёт autograd строить историю для этого обновления; при этом поле .grad отдельно очищать всё равно необходимо.
  kind: choice
  options:
    - Чтобы PyTorch не записывал операцию обновления параметра в вычислительный граф
    - Чтобы автоматически обнулить сохранённый градиент параметра
    - Чтобы изменить знак уже вычисленного градиента
    - Чтобы функция потерь вернула обычное число Python
