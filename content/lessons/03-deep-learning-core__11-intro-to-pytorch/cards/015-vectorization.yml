- concept: обычная арифметическая операция создаёт новый тензор и не изменяет исходный
  question: После выполнения `adjusted = pixels * factor` какое утверждение верно, если далее не было других операций?
  explanation: Оператор `*` в таком выражении возвращает новый тензор. Чтобы изменить исходный тензор, нужна явно изменяющая его операция, например `pixels.mul_(factor)` или присваивание результата обратно в `pixels`.
  kind: choice
  options:
    - '`adjusted` содержит результаты умножения, а `pixels` сохраняет прежние значения'
    - '`pixels` изменён, а `adjusted` ссылается на него без создания результата'
    - Изменены оба тензора, потому что умножение выполняется поэлементно
    - '`pixels` очищен после переноса значений в `adjusted`'
