- concept: новый learning rate назначается после завершённого шага оптимизатора и применяется при следующем обновлении
  question: Расположи события в правильном порядке при использовании планировщика, который вызывается после эпохи.
  explanation: Сначала оптимизатор завершает обновления с текущей скоростью, затем планировщик меняет её. Новое значение применяется уже при последующих шагах оптимизатора.
  kind: order
  items:
    - Оптимизатор обновляет параметры на батчах с текущим learning rate
    - После завершения эпохи вызывается scheduler.step()
    - При обновлениях следующей эпохи оптимизатор использует изменённый learning rate
