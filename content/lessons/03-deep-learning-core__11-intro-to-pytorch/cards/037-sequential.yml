- concept: соседние модули в nn.Sequential должны иметь совместимые формы выхода и входа
  question: Почему два корректно реализованных слоя могут вызвать ошибку при последовательном размещении в `nn.Sequential`?
  explanation: Каждый следующий модуль получает выход предыдущего без автоматической подгонки формы. Например, последний `Linear` из текста ожидает по восемь признаков на пример, поэтому предшествующий модуль должен сохранить или сформировать именно такую последнюю размерность.
  kind: open
  reference: Выходная форма первого слоя может не соответствовать входной форме, которую ожидает второй слой. `nn.Sequential` передаёт тензор напрямую и не преобразует несовместимые формы автоматически.
  id: 037-sequential-2
  fingerprint: 2738cf23
