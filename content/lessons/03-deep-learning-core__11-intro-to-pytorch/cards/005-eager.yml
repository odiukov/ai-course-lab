- concept: eager execution запускает вычисление непосредственно при выполнении строки Python
  question: Что происходит при выполнении строки `result = model(batch)` в обычном eager-режиме PyTorch?
  explanation: В eager-режиме вызов модели выполняется при достижении этой строки. `result` — результат текущего вычисления, а не узел статического графа, ожидающий отдельного запуска.
  kind: choice
  options:
    - Вызов только добавляется в статический граф, а вычисление откладывается до отдельного запуска
    - Модель запускается сразу, и `result` представляет полученный тензор
    - PyTorch сохраняет вызов как текст Python, не выполняя тензорных операций
  correct: 1
  id: 005-eager-1
  fingerprint: 7f78d289
- concept: eager execution позволяет выбирать путь вычислений обычным Python-условием во время прямого прохода
  question: Почему в eager-режиме PyTorch прямой проход может выполнять разные операции для разных входных данных с помощью обычного `if/else`?
  explanation: PyTorch выполняет операции по мере прохождения интерпретатора по коду. Поэтому значение условия для текущего входа может непосредственно определить, какие последующие операции будут выполнены.
  kind: open
  reference: Прямой проход исполняется как обычный Python-код, поэтому условие проверяется во время текущего вызова модели и сразу выбирает ветвь вычислений на основе входных данных.
  id: 005-eager-2
  fingerprint: db3bce3c
