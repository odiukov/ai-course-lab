- concept: тензорная операция устраняет накладные расходы вложенных циклов Python, передавая вычисление скомпилированному ядру
  question: Почему одна тензорная операция над целым пакетом обычно выполняется быстрее, чем эквивалентные вложенные циклы Python?
  explanation: Вложенные циклы требуют многократно интерпретировать инструкции Python и обращаться к отдельным объектам. Тензорная операция формулирует крупную задачу, которую целиком обрабатывает оптимизированное ядро на C++ или CUDA.
  kind: choice
  options:
    - Тензорная операция использует приближённую математику и пропускает часть элементов
    - Основную работу выполняет оптимизированное скомпилированное ядро без интерпретации каждого элементарного действия в Python
    - Тензорная операция автоматически уменьшает число параметров модели
    - Python заранее сохраняет ответы для всех возможных входов
  correct: 1
  id: 003-skorost-1
  fingerprint: ffe3902b
- concept: ускорение на GPU возникает благодаря параллельному выполнению множества независимых однотипных операций
  question: Объясни своими словами, почему GPU может сильно ускорить матричные и другие тензорные операции, даже если отдельный вычислительный блок GPU не быстрее мощного ядра CPU.
  explanation: Главное преимущество GPU — массовый параллелизм. Когда операция содержит много независимых умножений и сложений, они распределяются между вычислительными блоками и выполняются одновременно.
  kind: open
  reference: Тензорные операции состоят из множества однотипных вычислений, значительную часть которых можно выполнять независимо. GPU распределяет их между большим числом вычислительных блоков и выполняет параллельно, поэтому выигрывает общей пропускной способностью, а не скоростью одного блока.
  id: 003-skorost-2
  fingerprint: 36ab57b9
