- concept: последовательные итерации накапливают изменения обучаемых параметров
  question: Почему многократное повторение обучающей итерации может улучшать модель, даже если она снова работает с теми же обучающими данными?
  explanation: 'Цикл не начинает обучение заново: результат каждого обновления становится исходным состоянием следующей итерации. Благодаря этому небольшие изменения параметров накапливаются.'
  kind: open
  reference: После каждой итерации обновлённые параметры сохраняются. Следующая итерация строит предсказания уже с ними, заново вычисляет ошибку и градиенты, поэтому последовательность небольших поправок может постепенно приблизить модель к данным.
  id: 031-obuchenie-pryamoy-2
  fingerprint: d7e04766
- concept: динамика функции потерь позволяет оценивать ход и устойчивость обучения
  question: После каждой итерации обучения линейной модели записывают MSE. Какая динамика наиболее убедительно показывает, что параметры настраиваются в нужном направлении?
  explanation: Уменьшение MSE означает, что предсказания в среднем приближаются к целевым значениям. Рост или резкие скачки могут указывать на нестабильное обучение, например на чрезмерно крупные обновления.
  kind: choice
  options:
    - MSE в целом уменьшается по мере выполнения итераций
    - MSE быстро растёт от итерации к итерации
    - MSE совершает всё более резкие скачки
    - MSE остаётся неизменной при любых обновлениях
  correct: 0
