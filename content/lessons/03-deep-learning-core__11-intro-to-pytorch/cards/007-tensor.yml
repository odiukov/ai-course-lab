- concept: PyTorch выводит dtype из типа исходных Python-значений
  question: Тензор создают через torch.tensor из списка, содержащего только целые Python-значения, и dtype явно не задают. Какой тип данных получит тензор?
  explanation: Без явного указания PyTorch выводит dtype из входных значений. Список целых Python-значений создаёт целочисленный тензор.
