- concept: все тензоры одной операции должны находиться на одном устройстве
  question: Почему PyTorch не может напрямую сложить тензор на CPU с тензором на CUDA и как устранить проблему?
  explanation: Device указывает место хранения и выполнения вычислений. Смешивание CPU- и CUDA-тензоров в одной операции вызывает ошибку; перенос на общее устройство устраняет несовместимость.
  kind: open
  reference: Операция выполняется на конкретном вычислительном устройстве, поэтому все её тензоры должны находиться там же. Перед сложением нужно перенести один или оба тензора на общее устройство с помощью .to(...), .cpu() или другого подходящего метода.
