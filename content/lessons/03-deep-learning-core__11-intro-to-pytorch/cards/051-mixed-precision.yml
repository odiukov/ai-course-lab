- concept: autocast автоматически выбирает точность отдельно для разных GPU-операций
  question: Какую задачу выполняет torch.amp.autocast при обучении модели на GPU?
  explanation: autocast выполняет подходящие операции в пониженной точности, а численно чувствительные может оставить в полной. Поэтому вручную переводить всю модель в float16 не требуется.
  kind: choice
  options:
    - Автоматически выбирает подходящий dtype для каждой операции внутри своего блока
    - Переносит модель и все батчи с CPU на GPU
    - Увеличивает функцию потерь перед обратным проходом
    - Навсегда преобразует все параметры модели в формат меньшей точности
  correct: 0
  id: 051-mixed-precision-1
  fingerprint: 1997b9b9
- concept: GradScaler защищает малые градиенты от округления до нуля при вычислениях пониженной точности
  question: Объясни своими словами, зачем GradScaler увеличивает loss перед вызовом backward при mixed precision.
  explanation: 'GradScaler не меняет математический смысл обновления: он временно сдвигает градиенты в представимый числовой диапазон, затем снимает масштаб и контролирует переполнение.'
  kind: open
  reference: Масштабирование loss увеличивает получаемые градиенты, чтобы очень малые значения не округлились до нуля в формате пониженной точности. Перед обновлением параметров масштаб компенсируется, а при обнаружении бесконечных или недопустимых значений шаг оптимизатора пропускается.
  id: 051-mixed-precision-2
  fingerprint: 1cd9a148
