- concept: state_dict отделяет обученные параметры от Python-класса и делает сохранение устойчивее к рефакторингу
  question: Почему для переноса обученной модели обычно сохраняют state_dict, а не весь объект nn.Module?
  explanation: Целый объект модели сериализуется через pickle и остаётся связан с Python-классом и его расположением в модулях. state_dict хранит состояние отдельно, поэтому архитектуру можно создать актуальным кодом и затем загрузить в неё параметры.
  kind: choice
  options:
    - Объект nn.Module не содержит обученных параметров
    - Сохранение всего объекта через pickle зависит от прежнего класса и пути его импорта, а state_dict хранит именованные тензоры отдельно от кода модели
    - state_dict автоматически восстанавливает архитектуру и метод forward
  correct: 1
  id: 052-state-dict-1
  fingerprint: 9720aca6
- concept: load_state_dict сопоставляет сохранённые тензоры с параметрами модели по именам и проверяет совместимость форм
  question: В новой версии модели атрибут слоя переименовали с encoder на features, сохранив те же формы тензоров. Почему строгий вызов load_state_dict может завершиться ошибкой?
  explanation: load_state_dict сопоставляет состояние по ключам, связанным с именами зарегистрированных параметров. Даже при одинаковых формах переименование слоя создаёт отсутствующие и лишние ключи; изменение формы также вызвало бы несовместимость.
  kind: choice
  options:
    - Перед загрузкой обязательно нужно вызвать eval
    - state_dict разрешено загружать только в тот же экземпляр модели, из которого он был получен
    - После переименования изменились ключи параметров, поэтому сохранённые имена не совпадают с именами новой модели
  correct: 2
  id: 052-state-dict-2
  fingerprint: ebded2fb
