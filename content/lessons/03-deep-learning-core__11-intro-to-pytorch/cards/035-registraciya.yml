- concept: model.parameters рекурсивно собирает параметры зарегистрированных вложенных модулей
  question: В атрибуте `self.backbone` хранится модуль, внутри которого находятся другие зарегистрированные модули. Почему `model.parameters()` находит параметры глубоко вложенного линейного слоя?
  explanation: 'Регистрация действует на всю иерархию модели: PyTorch спускается из корневого модуля во вложенные зарегистрированные модули и собирает их параметры. Вручную перечислять каждый уровень не требуется.'
  kind: open
  reference: '`parameters()` рекурсивно обходит зарегистрированные вложенные модули. Поэтому параметры линейного слоя будут найдены, если вся цепочка содержащих его модулей зарегистрирована через атрибуты.'
  id: 035-registraciya-3
  fingerprint: 4450f41c
