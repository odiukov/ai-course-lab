- concept: поля заголовка MNIST записаны с порядком байтов big-endian
  question: Какой символ в строке формата struct задаёт порядок байтов big-endian?
  explanation: Символ `>` сообщает `struct.unpack`, что многобайтовые целые записаны от старшего байта к младшему, как требует бинарный формат MNIST.
  kind: cloze
  template: magic, count, height, width = struct.unpack("___IIII", header)
  answer: '>'
  accept:
    - big-endian
    - big endian
  id: 040-raw-mnist-2
  fingerprint: '96720483'
- concept: пиксели и метки требуют разных представлений после чтения из байтов
  question: Объясни, почему байты изображений MNIST преобразуют в нормализованные числа с плавающей точкой, а байты меток оставляют целыми индексами классов.
  explanation: Одинаковое исходное байтовое хранение не означает одинаковый смысл данных. Изображения содержат численные признаки, а метки — идентификаторы категорий, поэтому для них выбирают разные типы и преобразования.
  kind: open
  reference: Пиксель кодирует величину яркости, поэтому его переводят в удобный для модели непрерывный нормализованный диапазон. Метка кодирует категорию, поэтому она должна оставаться дискретным целым индексом класса и не нормализуется как яркость.
  id: 040-raw-mnist-3
  fingerprint: 5c154213
