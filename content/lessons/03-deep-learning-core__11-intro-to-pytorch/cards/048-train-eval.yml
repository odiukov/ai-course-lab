- concept: model.eval рекурсивно переключает Dropout и BatchNorm в режим оценки
  question: Модель содержит слои Dropout и BatchNorm. Что произойдёт после вызова model.eval()?
  explanation: model.eval() рекурсивно переводит модель и вложенные модули в режим оценки. Dropout в этом режиме пропускает значения без случайного отключения, а BatchNorm использует накопленную статистику вместо статистики текущего батча.
  kind: choice
  options:
    - Dropout продолжит случайно обнулять значения, а BatchNorm перестанет обновлять параметры оптимизатора
    - Dropout перестанет случайно обнулять значения, а BatchNorm будет использовать накопленную статистику
    - Dropout и BatchNorm будут удалены из вычислительного графа
    - Все параметры модели автоматически получат requires_grad=False
  correct: 1
  id: 048-train-eval-1
  fingerprint: a1525371
- concept: режим работы слоёв и отслеживание градиентов управляются независимо
  question: Объясни своими словами, почему при оценке модели часто используют и model.eval(), и torch.no_grad(), а не только один из этих механизмов.
  explanation: 'Эти механизмы решают разные задачи: model.eval() переключает поведение слоёв, а torch.no_grad() снижает расход памяти и вычислений за счёт отключения отслеживания градиентов.'
  kind: open
  reference: model.eval() меняет поведение режимозависимых слоёв, таких как Dropout и BatchNorm, но не отключает autograd. torch.no_grad() запрещает построение графа вычислений, однако само по себе не переводит слои в режим оценки. Поэтому для корректного и экономного инференса нужны оба механизма.
  id: 048-train-eval-2
  fingerprint: 66e41dc4
