- concept: надёжный бенчмарк использует одинаковые границы измерения и несколько прогонов
  question: Первый запуск обучения оказался заметно медленнее последующих. Как корректнее сравнить производительность двух реализаций?
  explanation: Первый прогон может включать инициализацию библиотек и другие разовые расходы. Повторные измерения уменьшают влияние случайных выбросов, а одинаковые границы не позволяют одной реализации получить преимущество из-за иной методики замера.
  kind: choice
  options:
    - Выполнить несколько прогонов с одинаковыми границами замера и сравнить типичное время
    - Взять только самый быстрый результат каждой реализации
    - Исключить загрузку данных только из результата более медленной реализации
    - Оставить единственный первый запуск, поскольку он всегда лучше отражает скорость вычислений
  correct: 0
