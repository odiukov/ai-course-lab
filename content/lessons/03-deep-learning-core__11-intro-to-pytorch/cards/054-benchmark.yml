- concept: проверка loss и качества подтверждает вычислительную эквивалентность сравниваемых реализаций
  question: Почему при сравнении скорости двух реализаций одной модели нужно сопоставлять не только время эпохи, но и динамику loss и качество?
  explanation: Быстрый результат имеет смысл только при эквивалентной работе. Проверка метрик защищает от ложного ускорения, полученного за счёт меньшего объёма вычислений или некорректной реализации.
  kind: open
  reference: Сходные loss и качество подтверждают, что реализации действительно выполняют сопоставимое обучение. Если метрики заметно различаются, более быстрый вариант мог пропускать вычисления, использовать другую задачу или содержать ошибку, поэтому разницу во времени нельзя уверенно приписать эффективности фреймворка.
  id: 054-benchmark-3
  fingerprint: 8c292537
