- concept: squeeze без указания оси удаляет все единичные оси, включая потенциальную ось батча
  question: Объясни разницу между unsqueeze и squeeze и почему вызов squeeze без указания оси может быть опасен для батча из одного объекта.
  explanation: Эти операции не меняют элементы тензора, а добавляют или удаляют оси длины один. Явное указание оси у squeeze защищает структуру данных от случайного изменения.
  kind: open
  reference: unsqueeze добавляет выбранную ось длины один. squeeze удаляет единичные оси; без аргумента он удалит их все, поэтому может исчезнуть и ось батча. Чтобы сохранить остальные единичные оси, следует явно указать удаляемую ось.
  id: 016-reshape-3
  fingerprint: 4a1f0ebc
