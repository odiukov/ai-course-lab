<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Как растёт или перемещается обучающее окно</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f9fc;
    --ink: #172033;
    --muted: #607086;
    --panel: #ffffff;
    --panel-line: #ccd5e2;
    --slot: #e8edf4;
    --slot-line: #c7d0dc;
    --train: #b9e7cc;
    --train-strong: #16794a;
    --test: #ffd59a;
    --test-strong: #a85408;
    --guide: #50769d;
    --white: #ffffff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  main {
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
    padding: 14px 18px 18px;
  }

  h1 {
    margin: 0 0 8px;
    font-size: 22px;
    line-height: 1.2;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 470px;
    background: var(--page);
  }

  .panel {
    fill: var(--panel);
    stroke: var(--panel-line);
    stroke-width: 1.5px;
  }

  .panel-title {
    fill: var(--ink);
    font-size: 17px;
    font-weight: bold;
  }

  .panel-subtitle {
    fill: var(--muted);
    font-size: 12px;
  }

  .month {
    fill: var(--muted);
    font-size: 12px;
    font-weight: bold;
  }

  .fold {
    fill: var(--muted);
    font-size: 12px;
    font-weight: bold;
  }

  .slot {
    fill: var(--slot);
    stroke: var(--slot-line);
    stroke-width: 1px;
  }

  .train {
    fill: var(--train);
    stroke: var(--train-strong);
    stroke-width: 1.5px;
  }

  .test {
    fill: var(--test);
    stroke: var(--test-strong);
    stroke-width: 1.5px;
  }

  .separator {
    stroke: var(--train-strong);
    stroke-width: 1px;
  }

  .train-name {
    fill: #104f33;
    font-size: 13px;
    font-weight: bold;
  }

  .test-name {
    fill: #743600;
    font-size: 11px;
    font-weight: bold;
  }

  .role {
    fill: var(--muted);
    font-size: 10px;
  }

  .train-role { fill: var(--train-strong); }
  .test-role { fill: var(--test-strong); }

  .boundary {
    fill: none;
    stroke: var(--guide);
    stroke-width: 2px;
  }

  .boundary-mark {
    fill: var(--guide);
  }

  .boundary-label {
    fill: var(--guide);
    font-size: 11px;
    font-weight: bold;
  }

  .legend {
    fill: var(--ink);
    font-size: 12px;
  }

  .rule {
    fill: var(--ink);
    font-size: 14px;
    font-weight: bold;
  }

  .rule-accent {
    fill: var(--test-strong);
  }

  #fallback {
    display: none;
    padding: 18px;
    border: 1px solid var(--panel-line);
    background: var(--panel);
    color: var(--ink);
    font-size: 15px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #111722;
      --ink: #edf3fb;
      --muted: #aab7c8;
      --panel: #192231;
      --panel-line: #3a485b;
      --slot: #273243;
      --slot-line: #46546a;
      --train: #174f39;
      --train-strong: #72d5a4;
      --test: #68471d;
      --test-strong: #ffc06e;
      --guide: #82b7e4;
    }

    .train-name { fill: #d6f8e5; }
    .test-name { fill: #fff0d8; }
  }
</style>
</head>
<body>
<main>
  <h1>Как растёт или перемещается обучающее окно</h1>
  <svg id="diagram" viewBox="0 0 1120 430"
       width="1120" height="430"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="svgTitle svgDesc">
    <title id="svgTitle">Сравнение expanding window и sliding window</title>
    <desc id="svgDesc">Три фолда растущего окна и три фолда скользящего окна. Тестовая точка всегда находится сразу справа от обучающих данных.</desc>
  </svg>
  <div id="fallback" role="img" aria-label="Описание схемы">
    Схема должна была показать три фолда: у expanding window обучение растёт
    от января вправо, а у sliding window сохраняет длину в три месяца и
    перемещается вправо. Тест в каждом фолде расположен сразу после обучения.
  </div>
</main>

<script>
const DATA = [
  ["months", ["январь", "февраль", "март", "апрель", "май", "июнь"]],
  ["folds", ["Фолд А", "Фолд Б", "Фолд В"]],
  ["expanding", [
    [0, 2, 3, "январь–март"],
    [0, 3, 4, "январь–апрель"],
    [0, 4, 5, "январь–май"]
  ]],
  ["sliding", [
    [0, 2, 3, "январь–март"],
    [1, 3, 4, "февраль–апрель"],
    [2, 4, 5, "март–май"]
  ]],
  ["panels", [
    [0, "EXPANDING WINDOW", "Левая граница остаётся на январе"],
    [54, "SLIDING WINDOW", "Обе границы сдвигаются вправо"]
  ]],
  ["layout", [
    0, 2, 4.4, 7.2, 9.2, 15.7, 22.2,
    8.2, 6.3, 6.5, 4.7, 49.5, 29.2,
    31.8, 35.1, 38.2, 1.2, 1.7, 3.4,
    0.45, 0.65, 0.9, 1.1, 1.4, 2.1,
    2.5, 3.1, 5.2, 10.8, 17.3, 23.8,
    30.3, 36.8, 43.3
  ]],
  ["labels", [
    "обучение", "тест", "не входит в текущий фолд",
    "граница закреплена", "граница движется",
    "Тест всегда справа от обучения",
    "будущее не попадает в train"
  ]]
];

const origin = [40, 20];
const scale = [10, 10];

const [originX, originY] = origin;
const [scaleX, scaleY] = scale;
const sx = x => originX + x * scaleX;
const sy = y => originY + y * scaleY;

try {
  const svg = document.getElementById("diagram");
  const ns = "http://www.w3.org/2000/svg";
  const [, months] = DATA.find(item => item.shift() === "months") || [];
  const [, foldNames] = DATA.find(item => item.shift() === "folds") || [];
  const [, expanding] = DATA.find(item => item.shift() === "expanding") || [];
  const [, sliding] = DATA.find(item => item.shift() === "sliding") || [];
  const [, panels] = DATA.find(item => item.shift() === "panels") || [];
  const [, values] = DATA.find(item => item.shift() === "layout") || [];
  const [, labels] = DATA.find(item => item.shift() === "labels") || [];

  const [
    Z, TITLE_Y, SUBTITLE_Y, MONTH_Y, ROW_A, ROW_B, ROW_C,
    GRID_X, CELL, STEP, BAR_H, PANEL_W, PANEL_H,
    LEGEND_Y, RULE_Y, NOTE_Y, PANEL_TOP, NAME_Y, ROLE_Y,
    ROUND, DASH, DASH_GAP, MARK_W, MARK_H, ARROW_BACK,
    SWATCH, LEGEND_GAP, L1, L2, L3, L4, L5, L6
  ] = values;

  const rows = [ROW_A, ROW_B, ROW_C];
  const [trainLabel, testLabel, unusedLabel, fixedLabel, movingLabel,
         ruleLabel, noteLabel] = labels;

  const make = (tag, attrs, className, content) => {
    const node = document.createElementNS(ns, tag);
    if (className) node.setAttribute("class", className);
    for (const [key, value] of Object.entries(attrs || {})) {
      node.setAttribute(key, value);
    }
    if (content !== undefined) node.textContent = content;
    svg.appendChild(node);
    return node;
  };

  const rect = (x, y, w, h, className) => make("rect", {
    x: sx(x),
    y: sy(y),
    width: sx(w) - sx(Z),
    height: sy(h) - sy(Z),
    rx: sx(ROUND) - sx(Z),
    ry: sy(ROUND) - sy(Z)
  }, className);

  const line = (x1, y1, x2, y2, className, dashed) => {
    const attrs = {
      x1: sx(x1), y1: sy(y1),
      x2: sx(x2), y2: sy(y2)
    };
    if (dashed) {
      attrs["stroke-dasharray"] =
        `${sx(DASH) - sx(Z)} ${sx(DASH_GAP) - sx(Z)}`;
    }
    return make("line", attrs, className);
  };

  const text = (x, y, value, className, anchor) => make("text", {
    x: sx(x),
    y: sy(y),
    "text-anchor": anchor,
    "dominant-baseline": "middle"
  }, className, value);

  const polygon = (points, className) => make("polygon", {
    points: points.map(([x, y]) => `${sx(x)},${sy(y)}`).join(" ")
  }, className);

  const panelData = [
    [panels.shift(), expanding, fixedLabel],
    [panels.shift(), sliding, movingLabel]
  ];

  for (const [[panelX, panelTitle, panelSubtitle], folds, boundaryText]
       of panelData) {
    rect(panelX, PANEL_TOP, PANEL_W, PANEL_H, "panel");
    text(panelX + TITLE_Y, TITLE_Y, panelTitle, "panel-title", "start");
    text(panelX + TITLE_Y, SUBTITLE_Y, panelSubtitle,
         "panel-subtitle", "start");

    for (const [month, monthX] of months.map(
      (month, position) => [month, panelX + GRID_X + position * STEP]
    )) {
      text(monthX + CELL / TITLE_Y, MONTH_Y, month, "month", "middle");
    }

    for (const [foldName, rowY] of foldNames.map(
      (name, position) => [name, rows[position]]
    )) {
      text(panelX + GRID_X - ROUND, rowY + BAR_H / TITLE_Y,
           foldName, "fold", "end");
    }

    for (const rowY of rows) {
      for (const monthX of months.map(
        (month, position) => panelX + GRID_X + position * STEP
      )) {
        rect(monthX, rowY, CELL, BAR_H, "slot");
      }
    }

    for (const [fold, rowY] of folds.map(
      (item, position) => [item, rows[position]]
    )) {
      const [start, end, test, span] = fold;
      const trainX = panelX + GRID_X + start * STEP;
      const trainW = (end - start) * STEP + CELL;
      const testX = panelX + GRID_X + test * STEP;

      rect(trainX, rowY, trainW, BAR_H, "train");
      rect(testX, rowY, CELL, BAR_H, "test");

      for (const divider of months.map((month, position) => position)
        .filter(position => position > start && position <= end)) {
        const dividerX = panelX + GRID_X + divider * STEP;
        line(dividerX, rowY, dividerX, rowY + BAR_H, "separator");
      }

      text(trainX + trainW / TITLE_Y, rowY + NAME_Y,
           span, "train-name", "middle");
      text(trainX + trainW / TITLE_Y, rowY + ROLE_Y,
           trainLabel, "role train-role", "middle");
      text(testX + CELL / TITLE_Y, rowY + NAME_Y,
           months[test], "test-name", "middle");
      text(testX + CELL / TITLE_Y, rowY + ROLE_Y,
           testLabel, "role test-role", "middle");
    }

    const starts = folds.map(
      fold => panelX + GRID_X + fold.shift() * STEP
    );
    const markYs = rows.map(rowY => rowY - MARK_H);

    if (starts.every(start => start === starts.at(Z))) {
      line(starts.at(Z), markYs.at(Z),
           starts.at(Z), rows.at(-ROUND) + BAR_H + MARK_H,
           "boundary", true);

      for (const rowY of rows) {
        polygon([
          [starts.at(Z), rowY],
          [starts.at(Z) - MARK_W, rowY - MARK_H],
          [starts.at(Z) + MARK_W, rowY - MARK_H]
        ], "boundary-mark");
      }

      text(starts.at(Z) + MARK_W, rows.at(-ROUND) + BAR_H + ARROW_BACK,
           boundaryText, "boundary-label", "start");
    } else {
      const tailX = starts.at(Z);
      const tailY = markYs.at(Z);
      const headX = starts.at(-ROUND);
      const headY = markYs.at(-ROUND);

      line(tailX, tailY, headX, headY, "boundary", true);
      polygon([
        [headX, headY],
        [headX - MARK_W, headY - ARROW_BACK],
        [headX - ARROW_BACK, headY + MARK_W]
      ], "boundary-mark");

      for (const [startX, rowY] of starts.map(
        (start, position) => [start, rows[position]]
      )) {
        polygon([
          [startX, rowY],
          [startX - MARK_W, rowY - MARK_H],
          [startX + MARK_W, rowY - MARK_H]
        ], "boundary-mark");
      }

      text(tailX + MARK_W, tailY - MARK_H,
           boundaryText, "boundary-label", "start");
    }
  }

  const legend = [
    [L1, "train", trainLabel],
    [L2, "test", testLabel],
    [L3, "slot", unusedLabel]
  ];

  for (const [legendX, className, legendText] of legend) {
    rect(legendX, LEGEND_Y, SWATCH, SWATCH, className);
    text(legendX + LEGEND_GAP, LEGEND_Y + SWATCH / TITLE_Y,
         legendText, "legend", "start");
  }

  text(L4, RULE_Y, ruleLabel, "rule", "end");
  text(L4 + MARK_W, RULE_Y, "→", "rule rule-accent", "middle");
  text(L5, RULE_Y, noteLabel, "rule rule-accent", "start");

  line(L6, NOTE_Y, L6 + CELL, NOTE_Y, "boundary", false);
  polygon([
    [L6 + CELL, NOTE_Y],
    [L6 + CELL - MARK_H, NOTE_Y - MARK_W],
    [L6 + CELL - MARK_H, NOTE_Y + MARK_W]
  ], "boundary-mark");
  text(L6 + CELL + LEGEND_GAP, NOTE_Y,
       "время идёт вправо", "legend", "start");

} catch (error) {
  document.getElementById("diagram").style.display = "none";
  document.getElementById("fallback").style.display = "block";
}
</script>
</body>
</html>
