<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Взаимозаменяемые примеры и временная цепочка</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fa;
      --surface: #ffffff;
      --text: #17212b;
      --muted: #526171;
      --border: #cbd3dc;
      --divider: #9aa7b5;
      --iid-fill: #e7f7ec;
      --iid-border: #24834d;
      --iid-strong: #155f37;
      --time-fill: #fff3cc;
      --time-border: #b87500;
      --time-strong: #805000;
      --arrow: #4d5966;
      --label-fill: #ffffff;
      --shadow: #dfe5ea;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background: var(--page);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    main {
      width: 100%;
    }

    h1 {
      font-size: 22px;
      color: var(--text);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 430px;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      fill: var(--text);
    }

    .section-subtitle,
    .support,
    .fallback {
      font-size: 16px;
      fill: var(--muted);
    }

    .card-title,
    .time-title {
      font-size: 17px;
      font-weight: 700;
    }

    .card-field {
      font-size: 14px;
      fill: var(--text);
    }

    .time-value {
      font-size: 20px;
      font-weight: 750;
    }

    .swap-label {
      font-size: 14px;
      font-weight: 700;
      fill: var(--iid-strong);
    }

    .bottom-title {
      font-size: 17px;
      font-weight: 750;
    }

    .divider {
      stroke: var(--divider);
      stroke-width: 2px;
    }

    .iid-card,
    .iid-summary {
      fill: var(--iid-fill);
      stroke: var(--iid-border);
      stroke-width: 2px;
    }

    .time-card,
    .time-summary {
      fill: var(--time-fill);
      stroke: var(--time-border);
      stroke-width: 2px;
    }

    .card-rule {
      stroke: var(--iid-border);
      stroke-width: 1px;
    }

    .time-rule {
      stroke: var(--time-border);
      stroke-width: 1px;
    }

    .swap-path {
      fill: none;
      stroke: var(--iid-border);
      stroke-width: 3px;
      stroke-linecap: round;
    }

    .swap-head {
      fill: var(--iid-border);
    }

    .time-path {
      stroke: var(--time-border);
      stroke-width: 4px;
      stroke-linecap: round;
    }

    .time-head {
      fill: var(--time-border);
    }

    .swap-label-box {
      fill: var(--label-fill);
      stroke: var(--iid-border);
      stroke-width: 1px;
    }

    .iid-text {
      fill: var(--iid-strong);
    }

    .time-text {
      fill: var(--time-strong);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #11161c;
        --surface: #192129;
        --text: #eef3f7;
        --muted: #b6c1cb;
        --border: #46525e;
        --divider: #687582;
        --iid-fill: #173b2a;
        --iid-border: #61cf8e;
        --iid-strong: #a2edbd;
        --time-fill: #493817;
        --time-border: #efb94f;
        --time-strong: #ffda87;
        --arrow: #b9c3cc;
        --label-fill: #192129;
        --shadow: #10161c;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Взаимозаменяемые примеры против временной цепочки</h1>
    <svg id="diagram"
         xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 1200 430"
         width="1200"
         height="430"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="svg-title svg-desc"></svg>
  </main>

  <script>
    const DATA = [
      {
        kind: "layout",
        divider: { x1: 595, y1: 24, x2: 595, y2: 406 },
        leftHeading: { x: 292, y: 38, text: "Standard ML: отдельные примеры" },
        leftSubtitle: { x: 292, y: 66, text: "Соседство строк ничего не сообщает" },
        rightHeading: { x: 897, y: 38, text: "Временной ряд: связанная цепочка" },
        rightSubtitle: { x: 897, y: 66, text: "Положение наблюдения — часть информации" },
        fallback: {
          x: 600,
          y: 215,
          text: "Слева должны быть три независимые карточки, справа — цепочка t=1 → t=2 → t=3 → t=4."
        }
      },
      {
        kind: "swap",
        labelBox: { x1: 211, y1: 76, x2: 383, y2: 104, radius: 10 },
        label: { x: 297, y: 95, text: "можно менять местами" },
        paths: [
          {
            start: { x: 133, y: 115 },
            controlA: { x: 202, y: 65 },
            controlB: { x: 404, y: 65 },
            end: { x: 473, y: 115 },
            head: [
              { x: 473, y: 115 },
              { x: 459, y: 111 },
              { x: 466, y: 99 }
            ]
          },
          {
            start: { x: 473, y: 278 },
            controlA: { x: 404, y: 326 },
            controlB: { x: 202, y: 326 },
            end: { x: 133, y: 278 },
            head: [
              { x: 133, y: 278 },
              { x: 147, y: 282 },
              { x: 140, y: 294 }
            ]
          }
        ]
      },
      {
        kind: "cards",
        items: [
          {
            box: { x1: 60, y1: 115, x2: 205, y2: 278, radius: 14 },
            rule: { x1: 60, y1: 164, x2: 205, y2: 164 },
            title: { x: 133, y: 147, text: "Клиент А" },
            fields: [
              { x: 133, y: 194, text: "Возраст" },
              { x: 133, y: 225, text: "Доход" },
              { x: 133, y: 256, text: "Сумма покупки" }
            ]
          },
          {
            box: { x1: 230, y1: 115, x2: 375, y2: 278, radius: 14 },
            rule: { x1: 230, y1: 164, x2: 375, y2: 164 },
            title: { x: 303, y: 147, text: "Клиент Б" },
            fields: [
              { x: 303, y: 194, text: "Возраст" },
              { x: 303, y: 225, text: "Доход" },
              { x: 303, y: 256, text: "Сумма покупки" }
            ]
          },
          {
            box: { x1: 400, y1: 115, x2: 545, y2: 278, radius: 14 },
            rule: { x1: 400, y1: 164, x2: 545, y2: 164 },
            title: { x: 473, y: 147, text: "Клиент В" },
            fields: [
              { x: 473, y: 194, text: "Возраст" },
              { x: 473, y: 225, text: "Доход" },
              { x: 473, y: 256, text: "Сумма покупки" }
            ]
          }
        ],
        summary: {
          box: { x1: 60, y1: 340, x2: 545, y2: 400, radius: 14 },
          title: { x: 303, y: 366, text: "Набор примеров сохраняется" },
          support: { x: 303, y: 389, text: "Каждая карточка понятна без соседних карточек" }
        }
      },
      {
        kind: "time",
        arrows: [
          {
            line: { x1: 755, y1: 194, x2: 775, y2: 194 },
            head: [
              { x: 775, y: 194 },
              { x: 764, y: 185 },
              { x: 764, y: 203 }
            ]
          },
          {
            line: { x1: 900, y1: 194, x2: 920, y2: 194 },
            head: [
              { x: 920, y: 194 },
              { x: 909, y: 185 },
              { x: 909, y: 203 }
            ]
          },
          {
            line: { x1: 1045, y1: 194, x2: 1065, y2: 194 },
            head: [
              { x: 1065, y: 194 },
              { x: 1054, y: 185 },
              { x: 1054, y: 203 }
            ]
          }
        ],
        items: [
          {
            box: { x1: 630, y1: 125, x2: 755, y2: 263, radius: 14 },
            rule: { x1: 630, y1: 174, x2: 755, y2: 174 },
            title: { x: 693, y: 157, text: "t=1 · 8:00" },
            value: { x: 693, y: 211, text: "3 заказа" },
            note: { x: 693, y: 240, text: "начало" }
          },
          {
            box: { x1: 775, y1: 125, x2: 900, y2: 263, radius: 14 },
            rule: { x1: 775, y1: 174, x2: 900, y2: 174 },
            title: { x: 838, y: 157, text: "t=2 · 9:00" },
            value: { x: 838, y: 211, text: "11 заказов" },
            note: { x: 838, y: 240, text: "после 8:00" }
          },
          {
            box: { x1: 920, y1: 125, x2: 1045, y2: 263, radius: 14 },
            rule: { x1: 920, y1: 174, x2: 1045, y2: 174 },
            title: { x: 983, y: 157, text: "t=3 · 10:00" },
            value: { x: 983, y: 211, text: "18 заказов" },
            note: { x: 983, y: 240, text: "после 9:00" }
          },
          {
            box: { x1: 1065, y1: 125, x2: 1190, y2: 263, radius: 14 },
            rule: { x1: 1065, y1: 174, x2: 1190, y2: 174 },
            title: { x: 1128, y: 157, text: "t=4 · 11:00" },
            value: { x: 1128, y: 211, text: "24 заказа" },
            note: { x: 1128, y: 240, text: "после 10:00" }
          }
        ],
        summary: {
          box: { x1: 630, y1: 340, x2: 1190, y2: 400, radius: 14 },
          title: { x: 910, y: 366, text: "Перестановка разрушает последовательность" },
          support: { x: 910, y: 389, text: "Стрелки хранят отношения «раньше → позже»" }
        }
      }
    ];

    const origin = { x: 0, y: 0 };
    const scale = { x: 1, y: 1 };

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const svg = document.getElementById("diagram");
    const namespace = "http://www.w3.org/2000/svg";

    function make(name, attributes, parent) {
      const node = document.createElementNS(namespace, name);
      Object.entries(attributes).forEach(([key, value]) => node.setAttribute(key, value));
      parent.appendChild(node);
      return node;
    }

    function textNode(parent, item, className, anchor) {
      const node = make("text", {
        x: sx(item.x),
        y: sy(item.y),
        class: className,
        "text-anchor": anchor
      }, parent);
      node.textContent = item.text;
      return node;
    }

    function roundedRect(parent, box, className) {
      return make("rect", {
        x: sx(box.x1),
        y: sy(box.y1),
        width: sx(box.x2) - sx(box.x1),
        height: sy(box.y2) - sy(box.y1),
        rx: sx(box.radius) - sx(origin.x),
        ry: sy(box.radius) - sy(origin.y),
        class: className
      }, parent);
    }

    function lineNode(parent, line, className) {
      return make("line", {
        x1: sx(line.x1),
        y1: sy(line.y1),
        x2: sx(line.x2),
        y2: sy(line.y2),
        class: className
      }, parent);
    }

    function polygonNode(parent, points, className) {
      return make("polygon", {
        points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
        class: className
      }, parent);
    }

    function summaryNode(parent, summary, rectClass, textClass) {
      roundedRect(parent, summary.box, rectClass);
      textNode(parent, summary.title, `bottom-title ${textClass}`, "middle");
      textNode(parent, summary.support, "support", "middle");
    }

    try {
      svg.replaceChildren();

      const title = make("title", { id: "svg-title" }, svg);
      title.textContent = "Взаимозаменяемые примеры и временная цепочка";

      const description = make("desc", { id: "svg-desc" }, svg);
      description.textContent =
        "Три независимые карточки клиентов можно переставить. Наблюдения временного ряда от 8:00 до 11:00 соединены направленными стрелками, поэтому их порядок несёт информацию.";

      const layout = DATA.find(item => item.kind === "layout");
      const swap = DATA.find(item => item.kind === "swap");
      const cards = DATA.find(item => item.kind === "cards");
      const time = DATA.find(item => item.kind === "time");

      const foundation = make("g", {}, svg);
      lineNode(foundation, layout.divider, "divider");
      textNode(foundation, layout.leftHeading, "section-title", "middle");
      textNode(foundation, layout.leftSubtitle, "section-subtitle", "middle");
      textNode(foundation, layout.rightHeading, "section-title", "middle");
      textNode(foundation, layout.rightSubtitle, "section-subtitle", "middle");

      const exchangeLayer = make("g", {}, svg);
      swap.paths.forEach(path => {
        make("path", {
          d: `M ${sx(path.start.x)} ${sy(path.start.y)} C ${sx(path.controlA.x)} ${sy(path.controlA.y)} ${sx(path.controlB.x)} ${sy(path.controlB.y)} ${sx(path.end.x)} ${sy(path.end.y)}`,
          class: "swap-path"
        }, exchangeLayer);
        polygonNode(exchangeLayer, path.head, "swap-head");
      });
      roundedRect(exchangeLayer, swap.labelBox, "swap-label-box");
      textNode(exchangeLayer, swap.label, "swap-label", "middle");

      const timeArrowLayer = make("g", {}, svg);
      time.arrows.forEach(arrow => {
        lineNode(timeArrowLayer, arrow.line, "time-path");
        polygonNode(timeArrowLayer, arrow.head, "time-head");
      });

      const cardLayer = make("g", {}, svg);
      cards.items.forEach(card => {
        roundedRect(cardLayer, card.box, "iid-card");
        lineNode(cardLayer, card.rule, "card-rule");
        textNode(cardLayer, card.title, "card-title iid-text", "middle");
        card.fields.forEach(field => textNode(cardLayer, field, "card-field", "middle"));
      });
      summaryNode(cardLayer, cards.summary, "iid-summary", "iid-text");

      const timeLayer = make("g", {}, svg);
      time.items.forEach(observation => {
        roundedRect(timeLayer, observation.box, "time-card");
        lineNode(timeLayer, observation.rule, "time-rule");
        textNode(timeLayer, observation.title, "time-title time-text", "middle");
        textNode(timeLayer, observation.value, "time-value time-text", "middle");
        textNode(timeLayer, observation.note, "card-field", "middle");
      });
      summaryNode(timeLayer, time.summary, "time-summary", "time-text");
    } catch (error) {
      svg.replaceChildren();
      const layout = DATA.find(item => item.kind === "layout");
      const fallback = make("text", {
        x: sx(layout.fallback.x),
        y: sy(layout.fallback.y),
        class: "fallback",
        "text-anchor": "middle"
      }, svg);
      fallback.textContent = layout.fallback.text;
    }
  </script>
</body>
</html>
