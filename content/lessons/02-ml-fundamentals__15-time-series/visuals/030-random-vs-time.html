<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Случайное и хронологическое разбиения</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #5b6579;
      --line: #738096;
      --soft-line: #cbd2dd;
      --train: #dff4e8;
      --train-strong: #197447;
      --train-border: #5ca67b;
      --test: #fde5e3;
      --test-strong: #ae342f;
      --test-border: #d5746e;
      --warning: #c44b43;
      --neutral: #eef1f6;
      --shadow: rgba(31, 43, 66, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #11151d;
        --panel: #171d27;
        --text: #edf1f7;
        --muted: #aeb8c8;
        --line: #8e9aaf;
        --soft-line: #424c5d;
        --train: #183c2d;
        --train-strong: #7ed5a5;
        --train-border: #4c9d70;
        --test: #482624;
        --test-strong: #ffaaa3;
        --test-border: #b96761;
        --warning: #ff9188;
        --neutral: #222a37;
        --shadow: rgba(0, 0, 0, 0.28);
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      padding: 12px;
    }

    .figure {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 14px 18px 10px;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--soft-line);
      border-radius: 12px;
      box-shadow: 0 4px 18px var(--shadow);
    }

    h1 {
      margin: 0 0 6px;
      color: var(--text);
      font-size: 20px;
      line-height: 1.25;
      font-weight: 720;
      letter-spacing: -0.01em;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      overflow: hidden;
      background: var(--panel);
      shape-rendering: geometricPrecision;
    }

    text {
      font-family: inherit;
      fill: var(--text);
    }

    .section-title {
      font-size: 17px;
      font-weight: 720;
    }

    .section-note {
      font-size: 13px;
      font-weight: 560;
      fill: var(--muted);
    }

    .month {
      font-size: 18px;
      font-weight: 760;
    }

    .role {
      font-size: 13px;
      font-weight: 650;
    }

    .train-role {
      fill: var(--train-strong);
    }

    .test-role {
      fill: var(--test-strong);
    }

    .leak-note {
      font-size: 13px;
      font-weight: 680;
      fill: var(--warning);
    }

    .group-label {
      font-size: 14px;
      font-weight: 690;
    }

    .train-label {
      fill: var(--train-strong);
    }

    .test-label {
      fill: var(--test-strong);
    }

    .card {
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .train-card {
      fill: var(--train);
      stroke: var(--train-border);
    }

    .test-card {
      fill: var(--test);
      stroke: var(--test-border);
    }

    .group-band {
      stroke-width: 1.5px;
      vector-effect: non-scaling-stroke;
    }

    .train-band {
      fill: var(--train);
      stroke: var(--train-border);
    }

    .test-band {
      fill: var(--test);
      stroke: var(--test-border);
    }

    .divider,
    .time-line {
      fill: none;
      stroke: var(--line);
      stroke-width: 2px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .separator {
      stroke: var(--soft-line);
      stroke-width: 1.5px;
      vector-effect: non-scaling-stroke;
    }

    .boundary {
      stroke: var(--text);
      stroke-width: 3px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .leak {
      fill: none;
      stroke: var(--warning);
      stroke-width: 2.5px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .arrowhead {
      fill: var(--line);
    }

    .leak-arrowhead {
      fill: var(--warning);
    }

    #fallback {
      margin: 10px 0 4px;
      padding: 10px 12px;
      color: var(--muted);
      background: var(--neutral);
      border: 1px solid var(--soft-line);
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main class="figure" aria-labelledby="diagram-heading">
    <h1 id="diagram-heading">Случайное и хронологическое разбиения</h1>

    <svg
      id="diagram"
      viewBox="0 0 960 430"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-heading diagram-description"
    >
      <desc id="diagram-description">
        Сверху месяцы перемешаны между обучением и проверкой, поэтому май
        помогает предсказывать более ранний февраль. Снизу январь, февраль
        и март образуют обучение, а следующие апрель и май — проверку.
      </desc>
    </svg>

    <p id="fallback">
      Схема должна показать перемешанные месяцы при случайном разбиении и
      последовательные отрезки Jan–Mar и Apr–May при хронологическом.
    </p>
  </main>

  <script>
    (() => {
      const DATA = Object.freeze({
        canvas: { width: 960, height: 430 },
        frame: { left: 0, right: 105 },
        card: {
          width: 14,
          topHeight: 9,
          bottomHeight: 8,
          radius: 1.2,
          textInset: 4.8
        },
        top: {
          titleY: 3,
          noteY: 3,
          cardY: 8,
          roleY: 19.2,
          leakY: 22.2,
          leakBendY: 27,
          leakLabelX: 72,
          leakLabelY: 25.2,
          separatorY: 29.5
        },
        bottom: {
          titleY: 34,
          noteY: 34,
          labelY: 38,
          bandY: 38.8,
          bandHeight: 10.8,
          cardY: 40.2,
          lineY: 44.2,
          boundaryX: 61,
          boundaryTop: 38.4,
          boundaryBottom: 49.8
        },
        bands: {
          trainX: 10,
          trainWidth: 49,
          testX: 63,
          testWidth: 32
        },
        time: {
          startX: 10,
          endX: 98,
          arrowBackX: 95.8,
          arrowTopY: 42.7,
          arrowBottomY: 45.7
        },
        leakArrow: {
          startX: 70,
          endX: 53,
          controlOneX: 66,
          controlTwoX: 57,
          arrowBackX: 55.2,
          arrowTopY: 20.9,
          arrowBottomY: 23.5
        },
        random: [
          { month: "Jan", role: "обучение", kind: "train", x: 12 },
          { month: "Mar", role: "обучение", kind: "train", x: 29 },
          { month: "Feb", role: "проверка", kind: "test", x: 46 },
          { month: "May", role: "обучение", kind: "train", x: 63 },
          { month: "Apr", role: "проверка", kind: "test", x: 80 }
        ],
        chronological: [
          { month: "Jan", kind: "train", x: 12 },
          { month: "Feb", kind: "train", x: 28 },
          { month: "Mar", kind: "train", x: 44 },
          { month: "Apr", kind: "test", x: 64 },
          { month: "May", kind: "test", x: 80 }
        ],
        labels: {
          randomTitle: "Случайное разбиение",
          randomNote: "месяцы перемешаны",
          chronologicalTitle: "Хронологическое разбиение",
          chronologicalNote: "время идёт слева направо",
          leak: "будущее уже в обучении",
          train: "Обучение · Jan–Mar",
          test: "Проверка · Apr–May"
        }
      });

      const origin = Object.freeze({ x: 60, y: 20 });
      const scale = Object.freeze({ x: 8, y: 8 });

      const sx = (x) => origin.x + x * scale.x;
      const sy = (y) => origin.y + y * scale.y;

      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      const make = (name, attributes, content) => {
        const element = document.createElementNS(namespace, name);
        Object.entries(attributes).forEach(([key, value]) => {
          element.setAttribute(key, String(value));
        });
        if (content !== undefined) {
          element.textContent = content;
        }
        return element;
      };

      const appendText = (parent, x, y, content, className, anchor) => {
        parent.appendChild(
          make(
            "text",
            {
              x: sx(x),
              y: sy(y),
              class: className,
              "text-anchor": anchor,
              "dominant-baseline": "middle"
            },
            content
          )
        );
      };

      const appendRect = (
        parent,
        x,
        y,
        width,
        height,
        radius,
        className
      ) => {
        parent.appendChild(
          make("rect", {
            x: sx(x),
            y: sy(y),
            width: sx(width) - sx(0),
            height: sy(height) - sy(0),
            rx: sx(radius) - sx(0),
            ry: sy(radius) - sy(0),
            class: className
          })
        );
      };

      const appendLine = (parent, xOne, yOne, xTwo, yTwo, className) => {
        parent.appendChild(
          make("line", {
            x1: sx(xOne),
            y1: sy(yOne),
            x2: sx(xTwo),
            y2: sy(yTwo),
            class: className
          })
        );
      };

      try {
        const layer = make("g", {
          "aria-hidden": "true"
        });

        appendText(
          layer,
          DATA.frame.left,
          DATA.top.titleY,
          DATA.labels.randomTitle,
          "section-title",
          "start"
        );

        appendText(
          layer,
          DATA.frame.right,
          DATA.top.noteY,
          DATA.labels.randomNote,
          "section-note",
          "end"
        );

        DATA.random.forEach((item) => {
          appendRect(
            layer,
            item.x,
            DATA.top.cardY,
            DATA.card.width,
            DATA.card.topHeight,
            DATA.card.radius,
            `card ${item.kind}-card`
          );

          appendText(
            layer,
            item.x + DATA.card.width / DATA.card.textInset,
            DATA.top.cardY + DATA.card.topHeight / DATA.card.textInset,
            item.month,
            "month",
            "start"
          );

          appendText(
            layer,
            item.x + DATA.card.width / DATA.card.textInset,
            DATA.top.roleY,
            item.role,
            `role ${item.kind}-role`,
            "start"
          );
        });

        layer.appendChild(
          make("path", {
            d: [
              "M",
              sx(DATA.leakArrow.startX),
              sy(DATA.top.leakY),
              "C",
              sx(DATA.leakArrow.controlOneX),
              sy(DATA.top.leakBendY),
              sx(DATA.leakArrow.controlTwoX),
              sy(DATA.top.leakBendY),
              sx(DATA.leakArrow.endX),
              sy(DATA.top.leakY)
            ].join(" "),
            class: "leak"
          })
        );

        layer.appendChild(
          make("polygon", {
            points: [
              `${sx(DATA.leakArrow.endX)},${sy(DATA.top.leakY)}`,
              `${sx(DATA.leakArrow.arrowBackX)},${sy(DATA.leakArrow.arrowTopY)}`,
              `${sx(DATA.leakArrow.arrowBackX)},${sy(DATA.leakArrow.arrowBottomY)}`
            ].join(" "),
            class: "leak-arrowhead"
          })
        );

        appendText(
          layer,
          DATA.top.leakLabelX,
          DATA.top.leakLabelY,
          DATA.labels.leak,
          "leak-note",
          "start"
        );

        appendLine(
          layer,
          DATA.frame.left,
          DATA.top.separatorY,
          DATA.frame.right,
          DATA.top.separatorY,
          "separator"
        );

        appendText(
          layer,
          DATA.frame.left,
          DATA.bottom.titleY,
          DATA.labels.chronologicalTitle,
          "section-title",
          "start"
        );

        appendText(
          layer,
          DATA.frame.right,
          DATA.bottom.noteY,
          DATA.labels.chronologicalNote,
          "section-note",
          "end"
        );

        appendRect(
          layer,
          DATA.bands.trainX,
          DATA.bottom.bandY,
          DATA.bands.trainWidth,
          DATA.bottom.bandHeight,
          DATA.card.radius,
          "group-band train-band"
        );

        appendRect(
          layer,
          DATA.bands.testX,
          DATA.bottom.bandY,
          DATA.bands.testWidth,
          DATA.bottom.bandHeight,
          DATA.card.radius,
          "group-band test-band"
        );

        appendText(
          layer,
          DATA.bands.trainX,
          DATA.bottom.labelY,
          DATA.labels.train,
          "group-label train-label",
          "start"
        );

        appendText(
          layer,
          DATA.bands.testX,
          DATA.bottom.labelY,
          DATA.labels.test,
          "group-label test-label",
          "start"
        );

        appendLine(
          layer,
          DATA.time.startX,
          DATA.bottom.lineY,
          DATA.time.endX,
          DATA.bottom.lineY,
          "time-line"
        );

        layer.appendChild(
          make("polygon", {
            points: [
              `${sx(DATA.time.endX)},${sy(DATA.bottom.lineY)}`,
              `${sx(DATA.time.arrowBackX)},${sy(DATA.time.arrowTopY)}`,
              `${sx(DATA.time.arrowBackX)},${sy(DATA.time.arrowBottomY)}`
            ].join(" "),
            class: "arrowhead"
          })
        );

        DATA.chronological.forEach((item) => {
          appendRect(
            layer,
            item.x,
            DATA.bottom.cardY,
            DATA.card.width,
            DATA.card.bottomHeight,
            DATA.card.radius,
            `card ${item.kind}-card`
          );

          appendText(
            layer,
            item.x + DATA.card.width / DATA.card.textInset,
            DATA.bottom.cardY +
              DATA.card.bottomHeight / DATA.card.textInset,
            item.month,
            "month",
            "start"
          );
        });

        appendLine(
          layer,
          DATA.bottom.boundaryX,
          DATA.bottom.boundaryTop,
          DATA.bottom.boundaryX,
          DATA.bottom.boundaryBottom,
          "boundary"
        );

        svg.appendChild(layer);
        fallback.hidden = true;
      } catch (error) {
        fallback.hidden = false;
        fallback.textContent =
          "Схема должна была показать: сверху Jan, Mar, Feb, May и Apr перемешаны между обучением и проверкой; снизу обучение Jan–Mar отделено временной границей от следующей проверки Apr–May.";
      }
    })();
  </script>
</body>
</html>
