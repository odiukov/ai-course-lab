- concept: стационарность требует устойчивости среднего, дисперсии и автокорреляции во времени
  question: Среднее и дисперсия временного ряда остаются постоянными, но в начале соседние значения сильно связаны, а позднее эта связь исчезает. Можно ли считать ряд стационарным?
  explanation: У стационарного ряда со временем не меняются не только среднее и дисперсия, но и структура временных связей. Изменение автокорреляции нарушает стационарность.
  kind: choice
  options:
    - Да, потому что достаточно постоянства среднего
    - Да, потому что достаточно постоянства среднего и дисперсии
    - Нет, потому что автокорреляция также должна быть устойчивой
    - Нет, потому что стационарный ряд обязан состоять из одинаковых значений
  correct: 2
  id: 007-stationarity-1
  fingerprint: d3ba0a44
- concept: стационарность не требует постоянства самих значений ряда
  question: Может ли временной ряд с сильными случайными колебаниями быть стационарным? Объясните своими словами.
  explanation: Стационарность описывает постоянство статистических свойств, а не отдельных значений. Даже большой разброс допустим, если его величина и остальные свойства ряда не меняются со временем.
  kind: open
  reference: Да. Значения стационарного ряда могут заметно колебаться. Важно, чтобы со временем оставались устойчивыми средний уровень, дисперсия и автокорреляция, а не чтобы все наблюдения были одинаковыми.
  id: 007-stationarity-2
  fingerprint: f193b689
