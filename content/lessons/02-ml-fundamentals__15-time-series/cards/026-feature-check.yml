- concept: доступность признака определяется временем публикации данных, а не только периодом, который они описывают
  question: Отчёт описывает уже завершившийся период, но публикуется после запуска прогноза. Объясни, почему нельзя использовать итоговое значение из этого отчёта при обучении модели для такого момента прогноза.
  explanation: Дата описываемого периода не гарантирует доступность данных. Нужно учитывать фактическое время публикации и воспроизводить при обучении только ту информацию, которая существовала на момент каждого прогноза.
  kind: open
  reference: В реальной работе итоговое значение ещё не опубликовано в момент запуска прогноза. Если использовать его в обучении, модель получит информацию из будущего относительно момента прогнозирования, а качество на исторических данных окажется завышенным.
