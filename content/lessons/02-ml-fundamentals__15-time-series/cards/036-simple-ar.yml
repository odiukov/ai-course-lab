- concept: прогноз авторегрессии равен свободному члену плюс взвешенная сумма прошлых значений
  question: Авторегрессионная модель имеет свободный член 7. Вес вчерашнего значения равен 0.5, а вес позавчерашнего — −0.25. Вчера ряд имел значение 120, позавчера — 72. Чему равен прогноз?
  explanation: 'Нужно подставить известные значения в линейную формулу: 7 + 0.5 × 120 − 0.25 × 72 = 49.'
  kind: numeric
  answer: 49
  tolerance: 0.001
