- concept: нулевая автокорреляция на лаге не исключает нелинейную зависимость
  question: Автокорреляция на некотором лаге близка к нулю. Что из этого можно заключить и чего заключать нельзя?
  explanation: ACF измеряет линейную связь для конкретного временного расстояния. Поэтому значение около нуля не исключает зависимость другого вида и ничего не говорит о причинности.
  kind: open
