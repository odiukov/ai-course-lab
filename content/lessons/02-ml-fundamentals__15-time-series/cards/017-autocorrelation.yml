- concept: отрицательная автокорреляция означает противоположное изменение значений на выбранном лаге
  question: Автокорреляция ряда на лаге 7 равна −0.8. Как это лучше всего интерпретировать?
  explanation: Сильная отрицательная автокорреляция указывает на противоположную направленность значений, разделённых выбранным лагом. Она сама по себе не доказывает ни сезонность, ни причинность.
  kind: choice
  options:
    - Большим значениям часто соответствуют малые значения через 7 шагов, и наоборот
    - Значения, разделённые 7 шагами, обычно почти одинаковы
    - У ряда обязательно есть сезонность с периодом 7
    - Значение 7 шагов назад является причиной текущего значения
