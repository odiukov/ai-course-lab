- concept: скользящее стандартное отклонение характеризует недавнюю волатильность ряда
  question: Объясни своими словами, что означает заметный рост скользящего стандартного отклонения временного ряда.
  explanation: Стандартное отклонение измеряет разброс значений внутри окна. Чем оно больше, тем сильнее недавние колебания ряда.
  kind: open
  reference: Недавние значения стали сильнее отклоняться друг от друга или от своего локального среднего, поэтому волатильность ряда выросла.
