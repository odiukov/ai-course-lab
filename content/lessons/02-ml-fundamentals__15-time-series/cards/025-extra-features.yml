- concept: скользящий максимум задаёт верхнюю границу недавних значений ряда
  question: Последние четыре значения ряда равны 32, 47, 41 и 56. Чему равен скользящий максимум по этому окну?
  explanation: Скользящий максимум — наибольшее значение внутри текущего окна. Среди указанных наблюдений верхняя граница равна 56.
