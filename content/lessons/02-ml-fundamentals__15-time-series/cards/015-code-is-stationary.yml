- concept: отношение дисперсий вычисляется делением большей дисперсии на меньшую
  question: 'Даны дисперсии первой и второй половин ряда: `var_first` и `var_second`. Заполни выражение так, чтобы результат не зависел от того, в какой половине разброс больше.'
  explanation: Большая дисперсия должна находиться в числителе, а меньшая — в знаменателе. Тогда отношение не станет меньше единицы из-за порядка половин и его можно корректно сравнить с порогом 2.
  kind: cloze
  template: variance_ratio = ___
  answer: max(var_first, var_second) / min(var_first, var_second)
  accept:
    - max(var_second, var_first) / min(var_second, var_first)
  id: 015-code-is-stationary-1
  fingerprint: a78e2395
- concept: результат проверки стационарности является логическим И двух независимых условий
  question: Переменные `mean_ok` и `variance_ok` показывают, прошли ли проверки среднего и дисперсии. Какое выражение корректно возвращает результат эвристической проверки стационарности?
  explanation: Функция должна вернуть `True` только при выполнении обоих условий, поэтому нужен оператор `and`. Оператор `or` пропустит ряд с нарушением одной проверки, а сравнение на равенство ошибочно вернёт `True`, когда обе проверки провалены.
  kind: choice
  options:
    - return mean_ok and variance_ok
    - return mean_ok or variance_ok
    - return mean_ok == variance_ok
  correct: 0
