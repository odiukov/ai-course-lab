- concept: сезонность — это повторяющийся паттерн с фиксированным периодом
  question: Число заказов в кафе стабильно увеличивается по выходным и уменьшается по будням, а долгосрочный средний уровень не меняется. Какой компонент временного ряда описывает эти колебания?
  explanation: Колебания повторяются с постоянным недельным периодом, поэтому относятся к сезонности. Тренд отражал бы долгосрочное направление, а остаток — нерегулярные отклонения.
  kind: choice
  options:
    - Тренд
    - Сезонность
    - Остаток
  correct: 1
  id: 006-decomposition-1
  fingerprint: e332cca6
- concept: в аддитивном разложении остаток равен наблюдению за вычетом тренда и сезонности
  question: Заполни пропуск в формуле остатка аддитивного разложения временного ряда.
  explanation: Ожидаемая часть ряда складывается из тренда T_t и сезонности S_t. Вычитая её из наблюдаемого значения y_t, получаем остаток r_t.
  kind: cloze
  template: r_t = y_t - ___
  answer: T_t + S_t
  accept:
    - T_t + S_t
    - S_t + T_t
  id: 006-decomposition-2
  fingerprint: a3ae3207
- concept: структура в остатках указывает на неполное выделение сигнала
  question: Почему повторяющийся паттерн в остатках после разложения временного ряда говорит о проблеме с разложением?
  explanation: Если остатки похожи на белый шум, разложение убрало предсказуемые тренд и сезонность. Регулярность в остатках показывает, что часть сигнала всё ещё не учтена.
  kind: open
  reference: Остаток должен содержать преимущественно непредсказуемый шум. Повторяющийся паттерн означает, что в нём сохранилась систематическая структура, которую компоненты тренда или сезонности не выделили.
  id: 006-decomposition-3
  fingerprint: dd6141a5
