- concept: длина проверочного отрезка должна соответствовать рабочему горизонту прогноза
  question: Объясни своими словами, почему качество прогноза на 24 шага нельзя надёжно оценить только по проверочному отрезку длиной 4 шага.
  explanation: Проверка на 4 шагах отвечает лишь на вопрос о близком прогнозе. Для горизонта в 24 шага важно оценить и дальние предсказания, где качество и характер ошибок могут отличаться.
  kind: open
  reference: 'Короткий отрезок не показывает поведение модели на большей части рабочего горизонта: на дальних шагах ошибка может накапливаться, а важные изменения или циклы могут не попасть в проверку. Поэтому проверка должна охватывать целевой горизонт или репрезентативную его длину.'
