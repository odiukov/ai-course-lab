- concept: при сдвиге expanding window сохраняет всю доступную историю, а sliding window исключает самое старое наблюдение
  question: Как изменяется обучающая выборка при очередном сдвиге expanding и sliding window?
  explanation: 'Расширяющееся окно только накапливает доступные данные, поэтому его длина растёт. Скользящее окно сохраняет фиксированную длину: при добавлении свежего наблюдения из него удаляется самое старое.'
  kind: cloze
  template: Expanding window = прежняя выборка ∪ {новое наблюдение}; sliding window = (прежняя выборка \ {___}) ∪ {новое наблюдение}.
  answer: самое старое наблюдение
  accept:
    - старейшее наблюдение
    - наиболее старое наблюдение
  id: 033-window-types-1
  fingerprint: 79b7e4b4
- concept: выбор типа окна зависит от актуальности старых данных и наличия изменений режима
  question: Модель прогнозирует отказы оборудования. Физика процесса долго не меняется, а редкие типы отказов встречаются лишь в давней истории. Какое обучающее окно предпочтительнее для walk-forward-валидации?
  explanation: Если старые закономерности всё ещё действуют, expanding window использует больше полезных наблюдений и не теряет редкие события. Sliding window уместнее при изменении режима, когда давние данные могут мешать адаптации.
  kind: choice
  options:
    - Expanding window, поскольку старая история остаётся актуальной и сохраняет редкие случаи
    - Sliding window, поскольку фиксированное окно всегда даёт более точную оценку
    - Случайное разбиение, поскольку редкие отказы нужно равномерно распределить между фолдами
  correct: 0
  id: 033-window-types-2
