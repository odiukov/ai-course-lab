- concept: сдвиг распределения нарушает предположение об одинаковой распределённости наблюдений
  question: После изменения тарифа у ежедневного спроса изменились типичный уровень и разброс. Объясни своими словами, какая часть предположения i.i.d. нарушена и почему.
  explanation: Одинаковая распределённость требует, чтобы вероятностный закон оставался неизменным. Изменение характерного уровня и разброса указывает на сдвиг этого закона во времени.
  kind: open
  reference: 'Нарушена одинаковая распределённость: данные до и после изменения тарифа порождаются разными распределениями. Поэтому старые наблюдения могут плохо описывать новый режим спроса.'
  id: 002-ne-iid-2
