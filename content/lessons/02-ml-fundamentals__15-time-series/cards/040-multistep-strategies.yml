- concept: recursive-прогноз последовательно использует собственные предсказания как входы для следующих горизонтов
  question: Расположите действия recursive-стратегии многошагового прогнозирования в правильном порядке.
  explanation: Recursive-стратегия многократно применяет одну одношаговую модель. Поскольку её ранние прогнозы становятся входами для следующих, допущенные ошибки могут распространяться и усиливаться.
  kind: order
  items:
    - Обучить модель предсказывать ближайшее будущее по доступной истории
    - Получить прогноз для ближайшего горизонта
    - Добавить полученный прогноз к истории вместо ещё неизвестного наблюдения
    - Повторять прогнозирование и подстановку до достижения нужного горизонта
  id: 040-multistep-strategies-1
  fingerprint: '070941e7'
- concept: direct-стратегия обучает независимую модель для каждого горизонта и предотвращает цепочное накопление ошибок
  question: Нужно исключить влияние ошибки ближайшего прогноза на более дальние прогнозы, а совместное обучение горизонтов не требуется. Какую стратегию следует выбрать?
  explanation: В direct-стратегии каждая модель сразу предсказывает свой горизонт и не получает предыдущие прогнозы во вход. Поэтому ошибки не передаются по цепочке, но модели не делятся информацией, а для дальних горизонтов может быть меньше полных обучающих примеров.
  kind: choice
  options:
    - 'Recursive: последовательно подставлять прогнозы во вход'
    - 'Direct: обучить отдельную модель для каждого горизонта'
    - 'Multi-output: одной моделью одновременно предсказывать все горизонты'
    - Одношаговую модель применять только к исходной истории без обновления входа
  correct: 1
  id: 040-multistep-strategies-2
  fingerprint: ecafc929
- concept: multi-output-модель одновременно предсказывает все горизонты и разделяет между ними выученное представление
  question: Объясните своими словами, чем multi-output-стратегия отличается от direct-стратегии и какое требование она предъявляет к модели.
  explanation: 'Обе стратегии могут получать дальние прогнозы без подстановки более ранних предсказаний. Разница в совместном обучении: multi-output делит параметры и информацию между горизонтами, тогда как direct обучает их раздельно.'
  kind: open
  reference: Direct использует отдельную модель для каждого горизонта, поэтому горизонты обучаются независимо. Multi-output использует одну модель, которая одновременно выдаёт весь вектор будущих значений и может применять общие закономерности ко всем горизонтам. Такая модель должна поддерживать несколько выходов либо обучаться со специально заданной функцией потерь.
  id: 040-multistep-strategies-3
  fingerprint: 37b41f24
