- concept: график сырого ряда обнаруживает временные закономерности, скрытые агрегированным средним
  question: Два временных ряда имеют одинаковое среднее значение. Зачем перед моделированием всё равно строить график каждого сырого ряда?
  explanation: Среднее сворачивает весь ряд в одно число и скрывает порядок наблюдений. График сохраняет временную структуру, поэтому показывает постепенные изменения, одиночные отклонения и смены режима.
  kind: choice
  options:
    - График может выявить тренд, выбросы и устойчивые переходы на новый уровень
    - График гарантирует выбор модели с минимальной ошибкой
    - График автоматически определяет причины всех необычных наблюдений
  correct: 0
  id: 050-plot-first-1
  fingerprint: 17186c7d
- concept: одиночный выброс отличают от смены режима по устойчивости изменения во времени
  question: На графике значение резко отклонилось от соседних, затем ряд вернулся в прежний диапазон и продолжил вести себя как раньше. Какая гипотеза лучше всего соответствует такой картине?
  explanation: Для выброса характерно кратковременное изолированное отклонение. При смене режима значения после перелома остаются в новом диапазоне, поэтому важна не только величина скачка, но и его продолжительность.
  kind: choice
  options:
    - Произошёл одиночный выброс
    - Ряд устойчиво перешёл в новый режим
    - Начался постепенный тренд
    - Изменился постоянный уровень всего ряда
  correct: 0
