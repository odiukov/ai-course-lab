- concept: совпадение визуального перелома с внешним событием не доказывает причинную связь
  question: После замены поставщика на графике временного ряда заметен устойчивый переход на новый уровень. Объясни, какой вывод позволяет сделать график, а какой вывод по нему делать нельзя.
  explanation: Визуальный анализ помогает локализовать необычное изменение и сформулировать гипотезу. Для причинного вывода нужны дополнительные данные и проверка альтернативных объяснений.
  kind: open
  reference: График позволяет обнаружить возможную смену режима и обозначить момент, который следует исследовать. Однако одно временное совпадение не доказывает, что именно замена поставщика вызвала изменение.
  id: 050-plot-first-3
  fingerprint: 833b78e7
