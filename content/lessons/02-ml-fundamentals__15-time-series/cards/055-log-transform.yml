- concept: логарифм превращает мультипликативный паттерн в аддитивный
  question: Объясните своими словами, почему логарифм упрощает моделирование ряда, который изменяется преимущественно через умножение на коэффициенты.
  explanation: Используется тождество ln(ab) = ln(a) + ln(b). Благодаря ему относительный рост исходного ряда становится прибавкой в логарифмической шкале.
  kind: open
  reference: Логарифм произведения равен сумме логарифмов. Поэтому последовательное умножение значений на коэффициенты в логарифмической шкале превращается в сложение приращений, которое проще описывать аддитивной линейной моделью.
  id: 055-log-transform-2
  fingerprint: 4aa431ce
- concept: прогноз из логарифмической шкалы возвращают экспонентой
  question: Модель предсказывает натуральный логарифм положительной целевой величины. Заполните формулу обратного преобразования.
  explanation: Экспонента является обратной функцией к натуральному логарифму, поэтому она возвращает прогноз из логарифмической шкалы в исходные единицы.
  kind: cloze
  template: Если ẑ = ln(ŷ), то ŷ = ___.
  answer: exp(ẑ)
  accept:
    - e^ẑ
    - np.exp(ẑ)
