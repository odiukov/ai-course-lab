- concept: SARIMA является сезонным вариантом ARIMA
  question: Заполни пропуск в обозначении сезонного расширения авторегрессионной интегрированной модели скользящего среднего.
  explanation: SARIMA дополняет обычную ARIMA сезонными авторегрессионными, разностными и скользящими компонентами. Она подходит для одномерного ряда с повторяющимся циклом.
  kind: cloze
  template: ARIMA + явная сезонная компонента = ___
  answer: SARIMA
  accept:
    - sarima
    - Sarima
  id: 038-approach-choice-2
  fingerprint: 878a65f3
- concept: нейросетевые модели оправданы при большом объёме длинных рядов и сложных зависимостях
  question: В каких условиях для прогнозирования временных рядов стоит рассматривать LSTM или Transformer вместо более простых классических моделей?
  explanation: LSTM и Transformer особенно полезны на крупных наборах длинных последовательностей со сложными закономерностями. На небольшом простом ряде их дополнительные требования к данным и настройке часто не окупаются.
  kind: open
  reference: Когда доступно много длинных рядов и достаточно данных для обучения сложных зависимостей. Нейросеть может сама выучить нелинейные повторения, но потребует больше вычислений, настройки и контроля переобучения.
  id: 038-approach-choice-3
  fingerprint: 28d6dc56
