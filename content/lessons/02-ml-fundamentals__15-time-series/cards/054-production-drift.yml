- concept: размер окна мониторинга задаёт компромисс между быстротой обнаружения деградации и устойчивостью сигнала
  question: Объясни своими словами, как выбор короткого или длинного окна влияет на мониторинг ошибки модели временного ряда.
  explanation: 'Размер окна определяет чувствительность мониторинга: уменьшение окна ускоряет сигнал ценой большей шумности, а увеличение стабилизирует метрику ценой задержки.'
  kind: open
  reference: Короткое окно быстрее реагирует на изменения, но его метрика сильнее колеблется из-за случайных ошибок и выбросов. Длинное окно сглаживает шум и даёт более устойчивую оценку, однако позже обнаруживает деградацию.
