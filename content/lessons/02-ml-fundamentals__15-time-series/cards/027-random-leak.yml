- concept: преобразования признаков временного ряда должны вычисляться только по данным, доступным до момента прогноза
  question: Данные разделили по времени правильно, но среднее для нормализации признаков рассчитали один раз по всему ряду, включая проверочный период. Объясни, почему это остаётся утечкой будущего.
  explanation: Хронологического разбиения недостаточно, если подготовка признаков использует всю историю. Любые параметры, оценённые по данным, — средние, масштабы и другие статистики — должны вычисляться только на доступной к моменту прогноза обучающей части.
  kind: open
  reference: Параметр нормализации зависит от значений проверочного периода, поэтому признаки обучающей выборки косвенно содержат информацию о будущем. Среднее и другие параметры преобразований нужно оценивать отдельно внутри каждого обучающего периода, не используя последующие наблюдения.
