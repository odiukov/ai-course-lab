- concept: для лага k попарно перемножаются одинаковые по длине срезы series[:n-k] и series[k:]
  question: Заполни пропуск так, чтобы элементы ряда сопоставлялись с наблюдениями, отстоящими от них на лаг k.
  explanation: Левый срез отбрасывает последние k элементов, а правый — первые k. Поэтому срезы имеют одинаковую длину и образуют пары наблюдений на расстоянии k.
  kind: cloze
  template: cov = np.mean((series[:n-k] - mean) * (___ - mean))
  answer: series[k:]
  accept:
    - series[k :]
    - 'series[k: ]'
  id: 018-code-autocorrelation-1
  fingerprint: 3b8f112e
- concept: автоковариация нормализуется дисперсией всего исходного ряда
  question: Как нормализовать вычисленную для лага k ковариацию в реализации autocorrelation?
  explanation: Среднее произведение отклонений уже содержит усреднение по совместимым парам. Для получения автокорреляции его делят на дисперсию исходного ряда, вычисленную один раз до цикла по лагам.
  kind: choice
  options:
    - Разделить её на среднее исходного ряда
    - Разделить её на число оставшихся пар
    - Разделить её на дисперсию только правого среза
    - Разделить её на дисперсию всего исходного ряда
  correct: 3
  id: 018-code-autocorrelation-2
  fingerprint: 86ac00e1
- concept: при нулевой дисперсии нормализация автоковариации невозможна и обрабатывается отдельной ветвью
  question: Почему функция autocorrelation должна отдельно обрабатывать постоянный ряд и какой результат разумно записывать для его лагов в данной реализации?
  explanation: Если все значения одинаковы, их отклонения от среднего и дисперсия равны нулю. Отношение ковариации к дисперсии не определено, поэтому защитная ветвь возвращает предусмотренное условное значение.
  kind: open
  reference: У постоянного ряда дисперсия равна нулю, поэтому деление автоковариации на дисперсию невозможно. Реализация избегает деления на ноль и записывает нулевую автокорреляцию для каждого лага.
  id: 018-code-autocorrelation-3
  fingerprint: c988f810
