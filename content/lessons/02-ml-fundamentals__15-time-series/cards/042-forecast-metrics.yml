- concept: MAE равна среднему абсолютных ошибок и выражается в единицах целевой величины
  question: Абсолютные ошибки прогноза за пять периодов равны 2, 2, 2, 2 и 17 МВт·ч. Чему равна MAE?
  explanation: 'MAE — среднее абсолютных ошибок: (2 + 2 + 2 + 2 + 17) / 5 = 5 МВт·ч. Направление ошибок при этом не учитывается.'
  kind: numeric
  answer: 5
  tolerance: 0.05
  id: 042-forecast-metrics-1
  fingerprint: 0acb6670
- concept: RMSE сильнее MAE учитывает редкие крупные ошибки
  question: У двух моделей близкая средняя абсолютная ошибка, но для бизнеса особенно опасны редкие крупные промахи прогноза. На какую метрику следует обратить больше внимания?
  explanation: В RMSE ошибки возводятся в квадрат, поэтому крупные промахи непропорционально усиливают итоговое значение. MAE усредняет их линейно, а MAPE измеряет ошибку относительно масштаба.
  kind: choice
  options:
    - RMSE
    - MAE
    - MAPE
  correct: 0
  id: 042-forecast-metrics-2
  fingerprint: 554a351d
- concept: MAPE нельзя вычислить обычной формулой при отсутствии фактической величины
  question: В один из периодов фактического спроса на товар не было. Что произойдёт при прямом вычислении MAPE для всего ряда?
  explanation: MAPE делит абсолютную ошибку каждого периода на истинное значение. При истинном значении, равном нулю, возникает деление на ноль, поэтому обычная формула метрики не определена.
  kind: choice
  options:
    - MAPE не будет определена из-за невозможного деления
    - MAPE автоматически исключит этот период
    - MAPE станет равна MAE
    - MAPE можно будет вычислить без каких-либо изменений
  correct: 0
  id: 042-forecast-metrics-3
  fingerprint: 7c515af0
