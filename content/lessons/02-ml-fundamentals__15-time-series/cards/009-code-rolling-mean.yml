- concept: в начале ряда скользящее среднее использует неполное окно из доступных наблюдений
  question: Ряд [5, 7, 9, 11, 13] обрабатывают скользящим средним с окном 5. Какое значение получится сразу после поступления 9?
  explanation: К этому моменту доступны только значения 5, 7 и 9. Полное окно ещё не набралось, поэтому функция усредняет доступную часть ряда и получает 7.
  kind: numeric
  answer: 7
  tolerance: 0.001
  id: 009-code-rolling-mean-1
  fingerprint: d0d33525
- concept: правая граница среза должна находиться после текущего элемента
  question: Объясни своими словами, где должна находиться правая граница среза при вычислении скользящего среднего с включением текущего элемента и почему.
  explanation: Правая граница среза в Python исключается. Поэтому граница сразу после текущей позиции включает текущее наблюдение, а граница на самой позиции — нет.
  kind: open
  reference: Правая граница должна стоять сразу после текущего элемента, поскольку в Python она не входит в срез. Если поставить её на индекс текущего элемента, этот элемент не попадёт в среднее.
  id: 009-code-rolling-mean-2
  fingerprint: 2752315d
