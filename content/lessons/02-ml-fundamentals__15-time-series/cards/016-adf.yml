- concept: нулевая гипотеза ADF утверждает нестационарность временного ряда
  question: Заполните пропуск в формулировке нулевой гипотезы ADF-теста.
  explanation: ADF начинает с предположения, что ряд нестационарен. Чтобы сделать вывод в пользу стационарности, эту нулевую гипотезу нужно отвергнуть.
  kind: cloze
  template: 'H₀ в ADF-тесте: временной ряд ___.'
  answer: нестационарен
  accept:
    - не является стационарным
  id: 016-adf-1
  fingerprint: ddfc9f54
- concept: p-значение ниже уровня значимости позволяет отвергнуть нулевую гипотезу ADF
  question: Для ADF-теста выбран уровень значимости 0,01 и получено p-значение 0,004. Какой вывод корректен?
  explanation: Поскольку 0,004 меньше 0,01, нулевую гипотезу о нестационарности отвергают. Это даёт статистические основания считать ряд стационарным, но не задаёт вероятность его стационарности.
  kind: choice
  options:
    - Отвергнуть гипотезу о нестационарности и считать данные свидетельством в пользу стационарности
    - Принять гипотезу о нестационарности как доказанную
    - Сделать вывод, что вероятность стационарности равна 99,6%
    - Не делать никакого вывода, поскольку p-значение должно быть больше уровня значимости
  correct: 0
  id: 016-adf-2
  fingerprint: ce6a6492
- concept: большое p-значение ADF означает недостаток оснований для отклонения нестационарности, а не её доказательство
  question: ADF-тест дал p-значение 0,28. Почему этот результат нельзя считать доказательством нестационарности ряда?
  explanation: 'При p-значении не ниже выбранного порога нулевую гипотезу не отвергают. «Не отвергнуть» не означает «доказать»: данных могло оказаться недостаточно для уверенного решения.'
  kind: open
  reference: Большое p-значение означает, что наблюдаемые данные недостаточно противоречат нулевой гипотезе о нестационарности. Тест лишь не смог её отвергнуть, но не подтвердил как истинную.
  id: 016-adf-3
  fingerprint: 4e285811
