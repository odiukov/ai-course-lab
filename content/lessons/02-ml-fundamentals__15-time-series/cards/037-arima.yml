- concept: часть I применяет разности для получения более стационарного ряда
  question: Объясни своими словами, зачем в ARIMA нужна часть I и что означает её параметр d.
  explanation: Разности помогают устранить изменение уровня или тренд. Чем больше d, тем больше последовательных проходов взятия разностей выполняет модель.
  kind: open
  reference: Часть I заменяет меняющийся уровень ряда его разностями, чтобы сделать ряд более стационарным. Параметр d показывает, сколько раз последовательно применяется взятие разностей.
  id: 037-arima-2
  fingerprint: 791fdb85
- concept: порядки ARIMA можно выбирать по ACF и PACF либо автоматическим перебором
  question: Какой способ выбора параметров ARIMA соответствует стандартному подходу?
  explanation: ACF и PACF дают подсказки о лаговой структуре ряда, а auto-ARIMA перебирает подходящие сочетания параметров и сравнивает модели.
  kind: choice
  options:
    - Анализировать ACF и PACF или автоматически сравнивать сочетания параметров
    - Выбирать параметры только по масштабу значений временного ряда
    - Всегда делать все параметры равными горизонту прогноза
