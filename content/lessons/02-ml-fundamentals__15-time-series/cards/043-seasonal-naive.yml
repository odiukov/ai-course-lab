- concept: сезонный наивный прогноз служит базовой планкой для проверки пользы более сложной модели
  question: ML-модель при корректной временной проверке показывает ошибку выше, чем сезонный наивный прогноз. Какой вывод наиболее обоснован?
  explanation: Сезонный наивный прогноз — минимальная базовая планка для ряда с сезонностью. Проигрыш этой планке означает, что сложная модель не даёт практического преимущества; возможны ошибки признаков или оценки, либо ряд плохо предсказуем за пределами сезонного паттерна.
  kind: choice
  options:
    - Модель пока не продемонстрировала способности извлекать полезный сигнал сверх сезонного повторения; нужно проверить модель и процедуру оценки
    - Ряд гарантированно не содержит сезонности
    - Более сложную модель всё равно следует выбрать из-за её сложности
    - Такой результат доказывает отсутствие утечки будущего в признаках
