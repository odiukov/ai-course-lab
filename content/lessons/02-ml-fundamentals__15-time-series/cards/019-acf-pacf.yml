- concept: регулярные пики ACF на периоде и его кратных указывают на сезонность
  question: Объясните своими словами, какой рисунок на графике ACF свидетельствует о сезонности с периодом P.
  explanation: Сезонный паттерн повторяется через постоянный интервал, поэтому ACF выделяет период P и его кратные. Одиночный пик без регулярного повторения слабее подтверждает сезонность.
  kind: open
  reference: 'Заметные пики должны повторяться на лаге P и на лагах, кратных P: связь возвращается через каждый сезонный цикл.'
