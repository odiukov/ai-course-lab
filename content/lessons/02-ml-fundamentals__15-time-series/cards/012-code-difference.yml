- concept: для первого наблюдения разность не определена из-за отсутствия предыдущего значения
  question: Объясните своими словами, почему при вычислении первых разностей результат короче исходного ряда и почему не следует дописывать в его начало ноль.
  explanation: Каждая первая разность соответствует паре соседних наблюдений. В ряду длины n таких пар n − 1, а искусственный ноль исказил бы смысл результата.
  kind: open
  reference: Для первого наблюдения нет предыдущего значения, поэтому соответствующую разность вычислить нельзя. Ноль означал бы известное отсутствие изменения, а не отсутствие данных для вычисления.
  id: 012-code-difference-2
  fingerprint: cf5b6577
- concept: первые разности можно вычислить вычитанием срезов соседних элементов без изменения исходного массива
  question: Заполните тело функции для одномерного NumPy-массива.
  explanation: Срез series[1:] содержит текущие элементы, а series[:-1] — соответствующие предыдущие. Вычитание создаёт новый массив разностей и не изменяет series.
  kind: cloze
  template: |-
    def difference(series):
        return ___
  answer: series[1:] - series[:-1]
  accept:
    - series[1:]-series[:-1]
    - np.subtract(series[1:], series[:-1])
    - np.diff(series)
