- concept: границы walk-forward-фолда вычисляются по целочисленному шагу и номеру фолда
  question: Для ряда из 173 наблюдений строят 7 walk-forward-фолдов с минимальной обучающей выборкой из 54 наблюдений. Какие индексы войдут в тестовую часть четвёртого фолда?
  explanation: Шаг равен (173 − 54) // 7 = 17. В четвёртом фолде конец обучения равен 54 + 3 × 17 = 105, а тестовый срез — slice(105, 122). Правая граница среза не включается, поэтому тест содержит индексы 105–121.
  kind: choice
  options:
    - 88–104
    - 122–138
    - 105–121
  correct: 2
  id: 032-code-walk-forward-1
  fingerprint: 1ae363c3
- concept: тестовая граница ограничивается концом ряда, а генерация прекращается при отсутствии данных для теста
  question: 'Объясни, как генератор walk-forward-разбиений должен обработать два случая: расчётный конец тестовой части вышел за границу ряда; конец обучающей части уже достиг границы ряда.'
  explanation: Ограничение через min(test_end, n_samples) не позволяет срезу выйти за данные. Проверка train_end >= n_samples предотвращает появление пустых фолдов после исчерпания ряда.
  kind: open
  reference: Если расчётный конец теста вышел за границу ряда, его ограничивают длиной ряда и выдают укороченный тестовый срез. Если конец обучения уже достиг длины ряда, новых тестовых наблюдений нет, поэтому генерацию прекращают.
  id: 032-code-walk-forward-2
  fingerprint: d29ab93e
