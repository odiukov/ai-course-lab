- concept: число полных обучающих примеров после построения лаговых признаков равно длине ряда минус число лагов
  question: Из временного ряда длины 11 создают признаки с n_lags = 5 и удаляют строки с неполной историей. Сколько строк останется в обучающей выборке?
  explanation: Полной истории нет у первых пяти наблюдений. Поэтому из 11 исходных точек остаётся 11 − 5 = 6 пар «лаговые признаки — текущая цель».
  kind: numeric
  answer: 6
  tolerance: 0.001
  id: 024-code-make-lags-1
  fingerprint: ef3a38cc
- concept: одна и та же маска допустимых строк должна применяться к признакам и целям
  question: Матрица X содержит лаговые признаки, а булева маска valid отмечает строки без пропусков. Какое возвращаемое значение сохранит соответствие между каждой строкой признаков и её целью?
  explanation: Одинаковая маска удаляет одни и те же временные позиции из X и series. Если фильтровать только один массив или использовать разные срезы, признаки и цели перестанут соответствовать друг другу.
  kind: choice
  options:
    - return X, series[valid]
    - return X[valid], series
    - return X[valid], series[~valid]
    - return X[~valid], series[valid]
    - return X[valid], series[:-n_lags]
    - return X[valid], series[valid]
  correct: 5
  id: 024-code-make-lags-2
  fingerprint: '700748e3'
