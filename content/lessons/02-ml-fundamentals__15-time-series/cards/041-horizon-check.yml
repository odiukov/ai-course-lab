- concept: длина горизонта определяет разумную стартовую стратегию прогнозирования
  question: 'Команда строит два базовых прогноза: один — на ближайшее будущее, другой — на далёкий горизонт. Как разумнее распределить стратегии?'
  explanation: Recursive удобна как простая отправная точка для короткого горизонта. На длинном горизонте её ошибки могут последовательно накапливаться, поэтому обычно начинают с direct.
  kind: choice
  options:
    - Direct для ближайшего будущего, recursive для далёкого горизонта
    - Multi-output для ближайшего будущего, recursive для далёкого горизонта
    - Recursive для ближайшего будущего, direct для далёкого горизонта
    - Recursive для обоих горизонтов независимо от их длины
  correct: 2
  id: 041-horizon-check-1
  fingerprint: a00c9cd0
- concept: раздельное обучение direct-моделей мешает горизонтам обмениваться информацией и сокращает объём данных для каждой модели
  question: Почему direct-стратегия может оказаться неудачной при небольшом объёме обучающих данных, даже если она не накапливает ошибки рекурсивно?
  explanation: Direct устраняет цепочку из собственных прогнозов, но платит за это набором независимых моделей. Каждой из них доступно меньше обучающих примеров, а знания между горизонтами не разделяются.
  kind: open
  reference: Для каждого горизонта обучается отдельная модель. Поэтому каждая модель использует свою выборку и не переносит выученную информацию на другие горизонты, что особенно чувствительно при нехватке данных.
  id: 041-horizon-check-2
  fingerprint: 0a1c2f02
