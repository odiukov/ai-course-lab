- concept: порог релевантности и разрешение на отказ выполняют разные взаимодополняющие функции в политике отказа RAG
  question: Объясни своими словами, зачем RAG-системе одновременно нужны порог релевантности поиска и разрешение ответить «I don't know».
  explanation: 'Порог отвечает за условие отказа: достаточно ли релевантен найденный материал. Инструкция «I don''t know» отвечает за действие при нехватке материала. Без порога reader может получить случайный контекст, а без разрешённого отказа модель может попытаться заполнить пробел догадкой.'
  kind: open
  reference: Порог определяет, когда найденный контекст слишком слаб и его нельзя передавать reader’у, а разрешение на «I don't know» задаёт безопасное поведение системы после такого решения. Вместе они предотвращают генерацию ответа по неподходящим пассажам.
