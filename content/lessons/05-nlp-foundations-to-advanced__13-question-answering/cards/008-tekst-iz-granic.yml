- concept: включительный конец span преобразуется в исключительную правую границу среза
  question: Модель extractive QA вернула включительные границы start и end. Как правильно извлечь соответствующий фрагмент с помощью среза с исключительной правой границей?
  explanation: Токены на позициях start и end входят в ответ. Поэтому левая граница среза равна start, а исключительная правая граница должна указывать на позицию сразу после end.
  kind: choice
  options:
    - Начать после start и остановиться сразу после end
    - Начать со start и остановиться перед end
    - Начать перед start и остановиться на end
    - Начать со start и остановиться на позиции сразу после end
  correct: 3
  id: 008-tekst-iz-granic-1
  fingerprint: ccc77947
- concept: субтокены и пунктуацию следует собирать в текст средствами исходного токенизатора
  question: Почему результат extractive QA, разбитый на субтокены, не всегда можно корректно восстановить простым соединением элементов пробелами?
  explanation: Обычные слова часто достаточно соединить пробелами, но субтокены и пунктуация содержат служебные правила склейки. Методы декодирования токенизатора учитывают эти правила.
  kind: open
  reference: Токенизатор может особым образом кодировать части слов, пробелы и знаки препинания. Простое соединение пробелами способно исказить исходный текст, поэтому выбранный span следует декодировать или преобразовать в строку средствами того же токенизатора.
  id: 008-tekst-iz-granic-2
  fingerprint: 237e434a
