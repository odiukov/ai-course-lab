- concept: срез top-k использует k как количество результатов, а не как включительный индекс
  question: Заполни пропуск так, чтобы проверялись ровно первые k результатов ранжирования.
  explanation: Правая граница среза не включается, поэтому ranked_ids[:k] содержит не более k первых элементов. Если k превышает длину списка, Python просто вернёт все доступные элементы.
  kind: cloze
  template: hit = gold_id in ranked_ids[___]
  answer: :k
  accept:
    - slice(None, k)
  id: 019-recall-at-k-1
  fingerprint: 3e8c03eb
- concept: каждый вопрос в recall_at_k даёт один бинарный вклад независимо от повторов правильного идентификатора
  question: Retriever по ошибке несколько раз вернул правильный идентификатор в пределах top-k. Какое выражение корректно вычисляет вклад одного вопроса в recall_at_k?
  explanation: Проверка принадлежности даёт одно булево значение для всего вопроса, а int преобразует его в бинарный вклад. Подсчёт совпадений ошибочно увеличил бы вклад при дубликатах.
  kind: choice
  options:
    - sum(item == gold_id for item in ranked_ids[:k])
    - int(gold_id in ranked_ids[:k])
    - len(ranked_ids[:k])
    - ranked_ids[:k].count(gold_id) / len(ranked_ids[:k])
  correct: 1
  id: 019-recall-at-k-2
  fingerprint: d6076887
