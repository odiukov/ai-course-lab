- concept: отрицание оценок позволяет получить убывающее ранжирование через возрастающую сортировку argsort
  question: Заполни пропуск так, чтобы первыми оказались индексы пассажей с наибольшими значениями sims.
  explanation: np.argsort сортирует по возрастанию. После отрицания самый большой исходный score становится самым маленьким отрицательным значением, поэтому его индекс оказывается в начале массива.
