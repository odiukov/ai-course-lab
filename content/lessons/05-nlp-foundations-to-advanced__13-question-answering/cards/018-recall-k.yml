- concept: Recall@k равен доле вопросов, для которых нужный пассаж найден в пределах top-k
  question: Retriever проверили на 13 вопросах. Для 8 из них нужный пассаж оказался среди первых двух результатов. Чему равен Recall@2?
  explanation: 'Recall@2 — это доля попаданий: 8 / 13 ≈ 0,615, то есть примерно 61,5%. Позиция пассажей внутри первых двух результатов на результат не влияет.'
  kind: numeric
  answer: 0.615
  tolerance: 0.01
  id: 018-recall-k-1
  fingerprint: '03684372'
- concept: Recall@k не убывает при увеличении k для фиксированного ранжирования
  question: Ранжирование пассажей для каждого запроса не изменилось, но при оценке Recall@k значение k увеличили с 2 до 8. Что можно гарантировать?
  explanation: При увеличении k все прежние попадания сохраняются, потому что старый top-k входит в новый. Дополнительные позиции могут добавить попадания, но не могут удалить уже найденные нужные пассажи.
  kind: choice
  options:
    - Recall обязательно строго увеличится
    - Recall обязательно останется прежним
    - Recall не уменьшится, но может остаться прежним
    - Recall может как увеличиться, так и уменьшиться
