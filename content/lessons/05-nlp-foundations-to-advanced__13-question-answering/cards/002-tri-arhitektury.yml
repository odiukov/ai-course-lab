- concept: у ответа из параметрической памяти трудно установить происхождение конкретного факта
  question: Почему конкретный факт в ответе closed-book QA обычно труднее проверить, чем факт в ответе extractive QA?
  explanation: Параметрическая память хранит усвоенные закономерности в весах модели, а не набор доступных для просмотра ссылок на источники. Поэтому уверенно сформулированный closed-book ответ может не иметь проверяемой текстовой опоры.
  kind: open
  reference: В extractive QA ответ связан с предоставленным пассажем, поэтому его можно сопоставить с видимым текстом. Closed-book QA генерирует ответ из параметрической памяти, которая не указывает конкретный документ или фрагмент, послуживший источником факта.
  id: 002-tri-arhitektury-2
  fingerprint: 051e3799
