- concept: строгая extractive QA может вернуть только непрерывный фрагмент исходного пассажа
  question: 'В пассаже написано: «Возврат разрешён до закрытия стойки». Система отвечает: «Вернуть можно, пока стойка открыта». Что верно для строгой extractive QA?'
  explanation: Extractive-модель выбирает начало и конец одного фрагмента в данном пассаже. Семантически верный пересказ всё равно недоступен, если его точного непрерывного текста в пассаже нет.
  kind: choice
  options:
    - Она не может выдать такой ответ, потому что этой последовательности токенов нет в пассаже
    - Она может свободно перефразировать любой найденный фрагмент
    - Она может составить ответ из отдельных слов пассажа в новом порядке
    - Она обязана сначала найти дополнительный документ
  correct: 0
