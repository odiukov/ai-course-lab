- concept: полная спецификация QA-системы фиксирует архитектуру, retriever, reader и операциональный план оценки
  question: Какая спецификация QA-сервиса содержит все решения, необходимые для реализации и проверки системы?
  explanation: Полная спецификация отдельно называет архитектуру, retriever, reader и план оценки. План оценки должен объяснять не только что измеряется, но и на каких данных и каким способом.
  kind: choice
  options:
    - RAG с генеративным reader; hybrid retriever; конкретно названная LLM; указаны измеряемые свойства, проверочная выборка и способ расчёта метрик
    - RAG; интеллектуальный поиск; мощная LLM; качество проверяется вручную
    - Hybrid retriever и конкретно названная LLM; задан допустимый бюджет задержки
    - RAG с extractive reader; итоговое качество оценивается одной метрикой
  correct: 0
  id: 039-qa-architect-1
  fingerprint: '76486285'
- concept: multi-hop-вопросы требуют специализированного поиска связанных фрагментов
  question: Для ответа нужно связать факт из одного документа с уточнением из другого. Что должен предусмотреть QA-архитектор?
  explanation: Multi-hop-ответ строится из нескольких связанных свидетельств. Поэтому система поиска должна уметь находить такую цепочку фрагментов; для этого подходят специализированные retriever-системы, обученные на задачах вроде HotpotQA.
  kind: choice
  options:
    - Оставить обычный single-hop retriever и увеличить максимальную длину ответа reader
    - Пометить вопрос как multi-hop и использовать специализированный retriever, например обученный на HotpotQA
    - Искать только один фрагмент, а недостающую связь поручить генеративному reader
    - Перейти на closed-book LLM независимо от требований к подтверждению ответа
  correct: 1
