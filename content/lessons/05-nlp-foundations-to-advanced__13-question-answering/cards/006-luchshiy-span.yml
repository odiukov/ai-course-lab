- concept: ограничение максимальной длины span изменяет множество допустимых кандидатов, но не правило их оценивания
  question: Объясни своими словами, как ограничение максимальной длины ответа влияет на выбор границ в extractive QA.
  explanation: Ограничение длины — это условие допустимости, а не дополнительная оценка. Оно отбрасывает слишком длинные ответы, после чего применяется прежний критерий совместного максимума.
  kind: open
  reference: Ограничение исключает из рассмотрения пары границ, образующие слишком длинный span. Среди оставшихся допустимых пар модель по-прежнему выбирает ту, у которой максимальна сумма оценок начала и конца.
  id: 006-luchshiy-span-2
  fingerprint: 2273eebe
