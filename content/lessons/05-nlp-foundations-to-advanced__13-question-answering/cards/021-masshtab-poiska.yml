- concept: векторный индекс может менять стратегию выбора кандидатов, сохраняя исходную меру близости
  question: Объясни своими словами, что меняется и что может остаться неизменным при переходе от полного перебора embeddings к поиску через векторный индекс.
  explanation: 'Индекс отвечает за то, до каких областей и кандидатов доберётся поиск. Он не обязан менять смысл оценки релевантности: найденные кандидаты можно ранжировать той же мерой близости, что и при полном переборе.'
  kind: open
  reference: 'Меняется стратегия поиска: индекс организует векторы и позволяет оценивать только выбранных кандидатов. При этом формула близости, например косинусная, и сами embeddings могут остаться теми же.'
