- concept: ускорение запросов с помощью векторного индекса требует предварительного построения и дополнительной памяти
  question: Какой набор затрат характерен для применения векторного индекса вместо поиска без заранее подготовленной структуры?
  explanation: Индекс ускоряет обработку запросов, но его необходимо заранее построить, хранить и обновлять при изменениях корпуса. Некоторые типы индексов также расходуют заметно больше памяти.
  kind: choice
  options:
    - Время на построение или обновление индекса и дополнительная память для его хранения
    - Повторное обучение reader перед каждым поисковым запросом
    - Обязательное увеличение длины каждого embedding
    - Ручная разметка правильного ответа для каждого документа
