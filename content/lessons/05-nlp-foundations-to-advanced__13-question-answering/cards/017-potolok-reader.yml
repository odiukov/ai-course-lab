  fingerprint: 6e4937b1
- concept: подстановка эталонного пассажа помогает локализовать ошибку между retriever и reader
  question: QA-пайплайн отвечает неверно с обычными результатами поиска, но тот же reader даёт правильный ответ, когда ему вручную передают эталонный пассаж. Где наиболее вероятен основной сбой?
  explanation: Успех reader на эталонном контексте показывает, что он способен обработать нужное доказательство. Значит, исходная ошибка возникла раньше — на этапе поиска и формирования контекста.
  kind: choice
  options:
    - В retriever, который не включил нужный пассаж в контекст
    - В reader, который не умеет использовать эталонный пассаж
    - В нормализации ответа для Exact Match
    - В формулировке правильного ответа после успешного чтения
  correct: 0
