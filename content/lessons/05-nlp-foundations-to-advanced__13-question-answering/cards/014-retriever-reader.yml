- concept: полный перебор документов имеет линейную стоимость, а векторный индекс сокращает число сравнений
  question: Объясни своими словами, почему полный перебор эмбеддингов становится узким местом на большом корпусе и как FAISS или векторная база меняют поиск.
  explanation: В учебном примере перебрать весь корпус легко, но для миллиона документов это означает миллион сравнений на запрос. Индекс сокращает поиск до нескольких тысяч сравнений, обычно сохраняя почти тех же ближайших соседей.
  kind: open
  reference: При полном переборе запрос сравнивается с каждым документом, поэтому стоимость поиска растёт линейно с размером корпуса. Векторный индекс организует эмбеддинги так, чтобы проверять лишь небольшую часть кандидатов и приближённо находить ближайшие векторы.
  id: 014-retriever-reader-2
  fingerprint: f9020789
