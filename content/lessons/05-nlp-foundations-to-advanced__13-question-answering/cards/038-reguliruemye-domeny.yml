- concept: дословная цитата сохраняет юридически значимые оговорки и ограничения
  question: В нормативном документе сказано «не позднее пяти рабочих дней», а генеративная модель отвечает «в течение пяти дней». Каков главный риск такого пересказа?
  explanation: Близкий по смыслу пересказ способен потерять условие, исключение или уточнение, влияющее на решение. Дословная цитата сохраняет нормативную формулировку без такого смыслового сдвига.
  kind: choice
  options:
    - Ответ становится длиннее исходной формулировки
    - Модель перестаёт использовать историю диалога
    - Пропуск слова «рабочих» может изменить применимый срок
    - Ответ невозможно преобразовать в токены
  correct: 2
