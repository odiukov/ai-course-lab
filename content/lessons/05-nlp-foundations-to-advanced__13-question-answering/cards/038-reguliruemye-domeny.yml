- concept: метаданные источника делают основание ответа проверяемым и воспроизводимым
  question: Какие сведения следует приложить к цитате в регулируемой QA-системе и зачем?
  explanation: Одной цитаты недостаточно, если непонятно, откуда она взята и какая редакция использована. Идентификатор документа, версия и точное место связывают ответ с проверяемым доказательством.
  kind: open
  reference: Нужно указать документ, его применимую редакцию или дату действия и точный локатор — например страницу либо раздел. Это позволяет проверяющему открыть тот же источник, найти цитату и воспроизвести основание ответа.
