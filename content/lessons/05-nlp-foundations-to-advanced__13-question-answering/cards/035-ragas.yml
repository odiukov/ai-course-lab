- concept: метрики RAGAS можно применять без заранее подготовленных эталонных ответов
  question: Почему RAGAS удобно использовать для оценки RAG-системы на живом трафике, где для запросов нет вручную написанных правильных ответов?
  explanation: RAGAS оценивает найденный контекст и сгенерированный ответ без обязательного набора эталонных ответов. Поэтому просадки отдельных измерений можно отслеживать непосредственно на production-запросах.
  kind: choice
  options:
    - Его метрики не требуют эталонного ответа для каждого запроса
    - Он автоматически заменяет retriever на точный поиск
    - Он оценивает качество только по совпадению строк
    - Он обучает reader непосредственно на пользовательских запросах
