- concept: faithfulness и answer relevance измеряют независимые свойства сгенерированного ответа
  question: Как ответ может получить высокую faithfulness, но низкую answer relevance?
  explanation: Faithfulness проверяет подтверждённость утверждений контекстом, а answer relevance — соответствие ответа вопросу. Подтверждённый источниками текст не обязательно отвечает именно на то, о чём спросили.
  kind: open
  reference: Все утверждения ответа могут логически следовать из найденного контекста, но сам ответ при этом может обсуждать соседнюю тему и не отвечать на заданный вопрос.
