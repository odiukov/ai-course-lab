- concept: последовательность операций нормализации ответа в SQuAD
  question: Расположите операции нормализации SQuAD в правильном порядке.
  explanation: SQuAD последовательно приводит текст к нижнему регистру, удаляет пунктуацию и отдельные артикли, а затем выравнивает пробелы. Так различия в оформлении не мешают сравнению ответов.
  kind: order
  items:
    - Перевести буквы в нижний регистр
    - Удалить пунктуацию
    - Удалить отдельные английские артикли
    - Сжать повторяющиеся пробелы и убрать пробелы по краям
  id: 027-normalizaciya-squad-1
  fingerprint: 79b41d40
- concept: английские артикли удаляются при нормализации SQuAD только как отдельные слова
  question: Какая пара строк останется различной после нормализации SQuAD?
  explanation: Артикли `a`, `an` и `the` удаляются только как отдельные слова. Последовательность букв `the` внутри слова `theatre` не является артиклем, поэтому строки нормализуются в `theatre` и `atre`.
  kind: choice
  options:
    - '`A red door!` и `red door`'
    - '`Theatre` и `atre`'
    - '`AN ORANGE` и `orange`'
    - '`cat` и `cat!`'
  correct: 1
  id: 027-normalizaciya-squad-2
  fingerprint: e8b5e0de
- concept: нормализация SQuAD устраняет поверхностные различия, но не распознаёт смысловую эквивалентность
  question: Объясните своими словами, почему нормализация SQuAD не сделает ответы `physician` и `doctor` одинаковыми, хотя они могут обозначать одно и то же.
  explanation: Эти правила очищают оформление текста, но не выполняют семантическое сравнение. Синонимы, аббревиатуры, переводы и перефразировки могут оставаться разными строками.
  kind: open
  reference: 'Нормализация SQuAD применяет формальные операции со строкой: меняет регистр, удаляет пунктуацию и отдельные артикли, выравнивает пробелы. Она не понимает значения слов и не сопоставляет синонимы, поэтому `physician` и `doctor` останутся разными.'
  id: 027-normalizaciya-squad-3
  fingerprint: 354f012e
