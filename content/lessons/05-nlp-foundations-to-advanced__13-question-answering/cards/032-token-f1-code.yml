- concept: два пустых нормализованных ответа считаются полным совпадением, а один пустой ответ — несовпадением
  question: Как должна вести себя токенная F-мера, если после нормализации оба ответа пусты или пуст только один из них? Объясни смысл обоих случаев.
  explanation: 'Обычные формулы precision и recall требуют ненулевых длин списков токенов. Поэтому пустые ответы получают явно заданную семантику: совпадение двух пустых результатов считается полным, а пустого и непустого — отсутствующим.'
  kind: open
  reference: 'Если оба ответа пусты, следует вернуть максимальный балл: предсказание полностью совпало с эталоном. Если пуст только один ответ, следует вернуть нулевой балл, поскольку совпавших токенов нет. Эти случаи обрабатывают отдельно, чтобы избежать деления на ноль.'
