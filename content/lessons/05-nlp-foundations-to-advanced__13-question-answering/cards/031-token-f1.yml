- concept: token-level F1 объединяет долю совпавших токенов предсказания и долю найденных токенов эталона
  question: После нормализации в эталоне осталось 5 токенов, в предсказании — 8, а размер их мультимножественного пересечения равен 4. Чему равен token-level F1 с округлением до сотых?
  explanation: Precision равен 4/8 = 0,50, а recall — 4/5 = 0,80. Их гармоническое среднее равно примерно 0,615, поэтому после округления F1 составляет 0,62.
  kind: numeric
  answer: 0.62
  tolerance: 0.01
