- concept: null score оценивает самостоятельный вариант отсутствия подходящего фрагмента
  question: Что означает null score в extractive QA-модели?
  explanation: Null score относится к самостоятельному варианту «ответа в контексте нет». Модель сравнивает его с оценками непустых span; это не особый span с пустыми границами.
  kind: choice
  options:
    - Оценку пустого промежутка между соседними токенами
    - Оценку отдельного кандидата «в контексте нет подходящего ответа»
    - Сумму оценок всех найденных фрагментов
    - Вероятность того, что контекст содержит неизвестные токены
  correct: 1
  id: 011-net-otveta-1
  fingerprint: 6cbae369
- concept: параметр handle_impossible_answer разрешает пайплайну вернуть явный отказ
  question: Заполни пропуск так, чтобы QA-пайплайн мог вернуть пустой ответ, когда null score превосходит оценки всех span.
  explanation: 'С параметром handle_impossible_answer=True пайплайн учитывает null-кандидата: если он побеждает лучший span, поле answer содержит пустую строку. Без параметра пайплайн возвращает лучший непустой фрагмент.'
  kind: cloze
  template: answer = qa(question=question, context=passage, ___)
  answer: handle_impossible_answer=True
  accept:
    - handle_impossible_answer = True
  id: 011-net-otveta-2
  fingerprint: 8ed4d1a3
