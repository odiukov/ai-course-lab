- concept: при отсутствии опоры для факта признание недостатка данных полезнее правдоподобной догадки
  question: В предоставленном источнике не указана причина закрытия проекта. Как должен ответить QA-компонент на вопрос об этой причине?
  explanation: Обоснованный ответ опирается на доступные сведения. Если нужного факта нет, явное указание на недостаток данных предотвращает подмену ответа правдоподобным вымыслом.
  kind: choice
  options:
    - Выбрать наиболее типичную причину закрытия подобных проектов.
    - Сообщить, что источник не позволяет установить причину.
    - Составить уверенное объяснение на основе названия проекта.
