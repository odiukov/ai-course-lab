- concept: ответ должен содержать достаточно контекста для однозначного понимания факта
  question: Почему изолированное значение вроде имени, даты или названия может быть менее полезным QA-ответом, чем короткое законченное предложение?
  explanation: Даже правильное значение может допускать неверное толкование. Достаточный ответ явно обозначает, что именно означает приведённое имя, число или название.
  kind: open
  reference: Без поясняющего контекста может быть неясно, к какому объекту, событию или свойству относится значение. Короткое предложение связывает факт с вопросом и устраняет необходимость догадываться.
