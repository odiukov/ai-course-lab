- concept: изменяемый многодокументный корпус, в котором нужный пассаж сначала требуется найти, указывает на выбор RAG
  question: База внутренних инструкций часто обновляется и содержит множество документов. Ответ должен опираться на актуальную версию инструкции, но нужный пассаж заранее не дан. Какую архитектуру выбрать?
  explanation: RAG сначала находит подходящий фрагмент в обновляемом корпусе, а затем передаёт его reader. Это позволяет менять документы независимо от параметров модели и отвечать по актуальному контексту.
  kind: choice
  options:
    - Closed-book модель без доступа к базе
    - Extractive QA без передачи найденного пассажа
    - RAG с поиском по актуальной базе и reader для ответа
    - Генерацию из случайно выбранного документа
  correct: 2
  id: 037-matrica-vybora-1
  fingerprint: 78f2d04f
- concept: доступ к свежему внешнему контексту в RAG оплачивается задержкой поиска, переранжирования и чтения
  question: Какое утверждение верно описывает компромисс по задержке между RAG и closed-book QA?
  explanation: Closed-book отвечает из параметрической памяти и пропускает поиск. RAG добавляет retrieval, а иногда reranker и генерацию, поэтому обычно требует больше времени, но может использовать свежие сведения из корпуса.
  kind: choice
  options:
    - RAG всегда быстрее, потому что retriever уменьшает объём знаний модели
    - Closed-book избегает задержки поиска, тогда как RAG тратит дополнительное время ради внешнего контекста
    - Переранжирование не влияет на задержку RAG
    - Closed-book сначала ищет документы, а RAG отвечает только из параметров модели
  correct: 1
  id: 037-matrica-vybora-2
  fingerprint: efa205d7
