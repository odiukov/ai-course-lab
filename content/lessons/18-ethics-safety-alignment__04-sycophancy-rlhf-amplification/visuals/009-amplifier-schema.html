<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Двухэтапный усилитель подхалимства</title>
<style>
  :root {
    color-scheme: light dark;
    --page: ivory;
    --surface: white;
    --panel: floralwhite;
    --ink: midnightblue;
    --muted: slategray;
    --line: lightsteelblue;
    --track: gainsboro;
    --accent: royalblue;
    --accent-soft: aliceblue;
    --syco: darkorange;
    --honest: steelblue;
    --on-accent: white;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: midnightblue;
      --surface: midnightblue;
      --panel: darkslategray;
      --ink: whitesmoke;
      --muted: lightsteelblue;
      --line: slategray;
      --track: dimgray;
      --accent: cornflowerblue;
      --accent-soft: darkslateblue;
      --syco: gold;
      --honest: lightskyblue;
      --on-accent: midnightblue;
    }
  }

  html,
  body {
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  body {
    margin: auto;
  }

  main {
    background: var(--surface);
  }

  h1 {
    color: var(--ink);
    font-size: 24px;
    font-weight: bold;
    text-align: center;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 420px;
    background: var(--surface);
  }

  .card {
    fill: var(--panel);
    stroke: var(--line);
    stroke-width: 2px;
  }

  .card-cap {
    fill: var(--accent);
  }

  .track {
    fill: var(--track);
    stroke: var(--line);
    stroke-width: 2px;
  }

  .syco-fill {
    fill: var(--syco);
  }

  .guide {
    stroke: var(--line);
    stroke-width: 2px;
    stroke-linecap: round;
  }

  .arrow {
    stroke: var(--accent);
    stroke-width: 3px;
    stroke-linecap: round;
  }

  .arrow-head {
    fill: var(--accent);
  }

  .label {
    fill: var(--ink);
    font-size: 16px;
  }

  .card-title {
    fill: var(--ink);
    font-size: 18px;
    font-weight: bold;
  }

  .card-subtitle {
    fill: var(--muted);
    font-size: 14px;
  }

  .cap-label {
    fill: var(--on-accent);
    font-size: 14px;
    font-weight: bold;
  }

  .percent {
    fill: var(--syco);
    font-size: 30px;
    font-weight: bold;
  }

  .row-label {
    fill: var(--ink);
    font-size: 14px;
  }

  .row-value {
    fill: var(--syco);
    font-size: 18px;
    font-weight: bold;
  }

  .stage-label {
    fill: var(--accent);
    font-size: 14px;
    font-weight: bold;
  }

  .stage-detail {
    fill: var(--muted);
    font-size: 14px;
  }

  .legend {
    fill: var(--muted);
    font-size: 14px;
  }

  .summary {
    fill: var(--ink);
    font-size: 24px;
    font-weight: bold;
  }

  .fallback {
    fill: var(--ink);
    font-size: 18px;
  }
</style>
</head>
<body>
<main>
  <h1>Двухэтапный усилитель подхалимства</h1>
  <svg id="scheme" viewBox="0 0 1200 420" width="1200" height="420"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="svg-title svg-desc">
    <title id="svg-title">Двухэтапный усилитель подхалимства</title>
    <desc id="svg-desc">Базовая политика содержит пятнадцать процентов подхалимских ответов. В top-k по прокси-награде их доля достигает сорока процентов. После удвоения RLHF-обучения доля возрастает до пятидесяти пяти процентов.</desc>
    <g id="diagram"></g>
  </svg>
</main>

<script>
const data = [{
  maximum: 100,
  percentMark: "%",
  canvas: { w: 1200, h: 420 },
  cards: [
    {
      box: { x: 40, y: 48, w: 300, h: 272, r: 18 },
      cap: { x: 40, y: 48, w: 300, h: 38, r: 18 },
      capMask: { x: 40, y: 67, w: 300, h: 19 },
      capLabel: { x: 190, y: 73, anchor: "middle", text: "ИСХОДНАЯ ОБЛАСТЬ" },
      title: { x: 190, y: 115, anchor: "middle", text: "Базовая политика" },
      subtitle: { x: 190, y: 140, anchor: "middle", text: "до обучения" },
      bars: [
        {
          track: { x: 75, y: 164, w: 230, h: 40, r: 12 },
          value: 15
        }
      ],
      percent: { x: 190, y: 248, anchor: "middle", value: 15 },
      note: { x: 190, y: 278, anchor: "middle", text: "обычное распределение ответов" }
    },
    {
      box: { x: 450, y: 48, w: 300, h: 272, r: 18 },
      cap: { x: 450, y: 48, w: 300, h: 38, r: 18 },
      capMask: { x: 450, y: 67, w: 300, h: 19 },
      capLabel: { x: 600, y: 73, anchor: "middle", text: "ВЫГОДНАЯ ОБЛАСТЬ" },
      title: { x: 600, y: 115, anchor: "middle", text: "top-k по прокси-награде" },
      subtitle: { x: 600, y: 140, anchor: "middle", text: "ответы с высокой оценкой" },
      bars: [
        {
          track: { x: 485, y: 164, w: 230, h: 40, r: 12 },
          value: 40
        }
      ],
      percent: { x: 600, y: 248, anchor: "middle", value: 40 },
      note: { x: 600, y: 278, anchor: "middle", text: "признак перепредставлен наверху" }
    },
    {
      box: { x: 860, y: 48, w: 300, h: 272, r: 18 },
      cap: { x: 860, y: 48, w: 300, h: 38, r: 18 },
      capMask: { x: 860, y: 67, w: 300, h: 19 },
      capLabel: { x: 1010, y: 73, anchor: "middle", text: "ПОВЕДЕНИЕ МОДЕЛИ" },
      title: { x: 1010, y: 115, anchor: "middle", text: "RLHF-политика" },
      subtitle: { x: 1010, y: 137, anchor: "middle", text: "вес высоконаграждённых ответов растёт" },
      bars: [
        {
          label: { x: 895, y: 166, anchor: "start", text: "обучение" },
          valueLabel: { x: 1125, y: 166, anchor: "end" },
          track: { x: 895, y: 177, w: 230, h: 24, r: 8 },
          value: 40
        },
        {
          label: { x: 895, y: 231, anchor: "start", text: "удвоение обучения (2×)" },
          valueLabel: { x: 1125, y: 231, anchor: "end" },
          track: { x: 895, y: 242, w: 230, h: 24, r: 8 },
          value: 55
        }
      ],
      note: { x: 1010, y: 294, anchor: "middle", text: "перекос превращается в вероятность" }
    }
  ],
  arrows: [
    {
      from: { x: 354, y: 181 },
      to: { x: 437, y: 181 },
      head: [
        { x: 450, y: 181 },
        { x: 433, y: 169 },
        { x: 433, y: 193 }
      ],
      labels: [
        { x: 395, y: 153, anchor: "middle", text: "Этап 1", className: "stage-label" },
        { x: 395, y: 213, anchor: "middle", text: "прокси-награда", className: "stage-detail" }
      ]
    },
    {
      from: { x: 764, y: 181 },
      to: { x: 847, y: 181 },
      head: [
        { x: 860, y: 181 },
        { x: 843, y: 169 },
        { x: 843, y: 193 }
      ],
      labels: [
        { x: 805, y: 153, anchor: "middle", text: "Этап 2", className: "stage-label" },
        { x: 805, y: 213, anchor: "middle", text: "усиление веса", className: "stage-detail" }
      ]
    }
  ],
  captions: [
    {
      x: 300,
      y: 349,
      anchor: "middle",
      text: "Этап 1: признак концентрируется в выгодной области",
      className: "stage-detail"
    },
    {
      x: 900,
      y: 349,
      anchor: "middle",
      text: "Этап 2: обучение расширяет вес этой области",
      className: "stage-detail"
    }
  ],
  legend: {
    dot: { x: 438, y: 378, r: 7 },
    text: {
      x: 458,
      y: 383,
      anchor: "start",
      text: "оранжевое — доля подхалимских ответов"
    }
  },
  summary: {
    x: 600,
    y: 412,
    anchor: "middle",
    text: "15%  →  40%  →  55% при удвоении обучения"
  },
  fallback: {
    x: 600,
    y: 210,
    anchor: "middle",
    text: "Схема: базовая политика 15% → top-k 40% → RLHF 55% при удвоении обучения."
  }
}];

const origin = { x: 0, y: 0 };
const scale = { x: 1, y: 1 };

const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

const [model] = data;
const svg = document.getElementById("scheme");
const layer = document.getElementById("diagram");
const namespace = "http://www.w3.org/2000/svg";

function element(tag, className, parent) {
  const item = document.createElementNS(namespace, tag);
  if (className) item.setAttribute("class", className);
  (parent || layer).appendChild(item);
  return item;
}

function rectangle(box, className, parent) {
  const item = element("rect", className, parent);
  item.setAttribute("x", sx(box.x));
  item.setAttribute("y", sy(box.y));
  item.setAttribute("width", sx(box.x + box.w) - sx(box.x));
  item.setAttribute("height", sy(box.y + box.h) - sy(box.y));
  if (box.r !== undefined) {
    item.setAttribute("rx", sx(origin.x + box.r) - sx(origin.x));
    item.setAttribute("ry", sy(origin.y + box.r) - sy(origin.y));
  }
  return item;
}

function line(from, to, className, parent) {
  const item = element("line", className, parent);
  item.setAttribute("x1", sx(from.x));
  item.setAttribute("y1", sy(from.y));
  item.setAttribute("x2", sx(to.x));
  item.setAttribute("y2", sy(to.y));
  return item;
}

function polygon(points, className, parent) {
  const item = element("polygon", className, parent);
  item.setAttribute(
    "points",
    points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" ")
  );
  return item;
}

function text(spec, className, parent) {
  const item = element("text", className || spec.className || "label", parent);
  item.setAttribute("x", sx(spec.x));
  item.setAttribute("y", sy(spec.y));
  item.setAttribute("text-anchor", spec.anchor || "start");
  item.textContent = spec.text;
  return item;
}

function circle(spec, className, parent) {
  const item = element("circle", className, parent);
  item.setAttribute("cx", sx(spec.x));
  item.setAttribute("cy", sy(spec.y));
  item.setAttribute("r", sx(origin.x + spec.r) - sx(origin.x));
  return item;
}

function drawBar(bar, parent) {
  rectangle(bar.track, "track", parent);
  rectangle({
    x: bar.track.x,
    y: bar.track.y,
    w: bar.track.w * bar.value / model.maximum,
    h: bar.track.h,
    r: bar.track.r
  }, "syco-fill", parent);

  if (bar.label) text(bar.label, "row-label", parent);

  if (bar.valueLabel) {
    text({
      x: bar.valueLabel.x,
      y: bar.valueLabel.y,
      anchor: bar.valueLabel.anchor,
      text: `${bar.value}${model.percentMark}`
    }, "row-value", parent);
  }
}

function drawCard(card) {
  const group = element("g", "policy-card");
  rectangle(card.box, "card", group);
  rectangle(card.cap, "card-cap", group);
  rectangle(card.capMask, "card-cap", group);
  text(card.capLabel, "cap-label", group);
  text(card.title, "card-title", group);
  text(card.subtitle, "card-subtitle", group);
  card.bars.forEach(bar => drawBar(bar, group));

  if (card.percent) {
    text({
      x: card.percent.x,
      y: card.percent.y,
      anchor: card.percent.anchor,
      text: `${card.percent.value}${model.percentMark}`
    }, "percent", group);
  }

  text(card.note, "card-subtitle", group);
}

function drawArrow(arrow) {
  line(arrow.from, arrow.to, "arrow");
  polygon(arrow.head, "arrow-head");
  arrow.labels.forEach(item => text(item, item.className));
}

try {
  model.cards.forEach(drawCard);
  model.arrows.forEach(drawArrow);
  model.captions.forEach(item => text(item, item.className));
  circle(model.legend.dot, "syco-fill");
  text(model.legend.text, "legend");
  text(model.summary, "summary");
} catch (error) {
  layer.replaceChildren();
  text(model.fallback, "fallback");
  svg.setAttribute("aria-label", model.fallback.text);
}
</script>
</body>
</html>
