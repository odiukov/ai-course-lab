<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Три пути поиска навыков</title>
<style>
  :root{
    --bg:#ffffff; --ink:#1c2024; --muted:#5b6570; --line:#8a949e;
    --home:#3f6ea8; --homefill:#eef3fa; --proj:#1f7a4d; --projfill:#eaf6ef;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14181c; --ink:#e8ecef; --muted:#9aa4ae; --line:#6d7883;
      --home:#7fb0e0; --homefill:#1b2530; --proj:#63c795; --projfill:#16281f;
    }
  }
  body{margin:0;padding:12px;background:var(--bg);color:var(--ink);
    font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;}
  figure{margin:0;}
  figcaption{font-size:15px;font-weight:600;margin:0 0 8px;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .fallback{font-size:14px;color:var(--ink);}
  .fallback code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
</style>
</head>
<body>
<figure>
  <figcaption>Три пути поиска навыков</figcaption>
  <div id="slot">
    <svg id="diagram" viewBox="0 0 810 196" role="img"
         aria-label="Три пути поиска SKILL.md: домашние папки видны только мне, ./skills уезжает с репозиторием"></svg>
  </div>
</figure>
<script>
(function(){
  var slot = document.getElementById('slot');
  try{
    // ---- данные схемы ----
    var boxes = [
      { x:1,    first:'~', path:'~/.anthropic/skills/*/SKILL.md',
        where:'домашняя папка', vis:'общая', kind:'home' },
      { x:14.2, first:'.', path:'./skills/*/SKILL.md',
        where:'папка внутри репозитория', vis:'уехала с репозиторием', kind:'proj' },
      { x:27.4, first:'~', path:'~/.claude/skills/*/SKILL.md',
        where:'домашняя папка', vis:'только у меня', kind:'home' }
    ];
    var BW = 12, BH = 4.2;            // размеры коробки в единицах схемы
    var Y_FIRST = 1.6, Y_TOP = 2.4, Y_PATH = 4.0, Y_WHERE = 5.7,
        Y_VIS = 7.9, Y_NOTE = 9.3;
    var note = 'маска */SKILL.md — ровно на один уровень вглубь';

    // ---- единственный перевод координат ----
    var origin = { x:0, y:0 }, scale = 20;
    function sx(u){ return origin.x + u * scale; }
    function sy(u){ return origin.y + u * scale; }

    var svg = document.getElementById('diagram');
    var NS = 'http://www.w3.org/2000/svg';
    function el(name, attrs){
      var n = document.createElementNS(NS, name);
      for (var k in attrs) n.setAttribute(k, attrs[k]);
      svg.appendChild(n);
      return n;
    }
    function label(text, xu, yu, anchor, size, color, weight, mono){
      var t = el('text', {
        x: sx(xu), y: sy(yu), 'text-anchor': anchor,
        'font-size': size, fill: color, 'font-weight': weight || 'normal',
        'font-family': mono
          ? 'ui-monospace,SFMono-Regular,Menlo,monospace'
          : 'system-ui,-apple-system,"Segoe UI",sans-serif'
      });
      t.appendChild(document.createTextNode(text));
      return t;
    }

    var radius = sx(0.3) - sx(0);
    var caret  = sy(0.5) - sy(0);   // высота галочки-указателя под коробкой

    boxes.forEach(function(b){
      var isProj = b.kind === 'proj';
      var stroke = isProj ? 'var(--proj)' : 'var(--home)';
      var fill   = isProj ? 'var(--projfill)' : 'var(--homefill)';
      var cx = b.x + BW / 2;

      // первый символ пути — он и есть ответ
      label(b.first, cx, Y_FIRST, 'middle', 26, stroke, '700', true);

      el('rect', {
        x: sx(b.x), y: sy(Y_TOP),
        width:  sx(b.x + BW) - sx(b.x),
        height: sy(Y_TOP + BH) - sy(Y_TOP),
        rx: radius, ry: radius,
        fill: fill, stroke: stroke, 'stroke-width': 2,
        'stroke-dasharray': isProj ? 'none' : '6 4'
      });

      label(b.path,  cx, Y_PATH,  'middle', 13, 'var(--ink)',   '600', true);
      label(b.where, cx, Y_WHERE, 'middle', 13, 'var(--muted)', 'normal', false);

      // указатель от коробки к подписи видимости
      el('path', {
        d: 'M ' + sx(cx - 0.4) + ' ' + sy(Y_TOP + BH) +
           ' L ' + sx(cx) + ' ' + (sy(Y_TOP + BH) + caret) +
           ' L ' + sx(cx + 0.4) + ' ' + sy(Y_TOP + BH) + ' Z',
        fill: stroke, stroke: 'none'
      });
      el('line', {
        x1: sx(cx), y1: sy(Y_TOP + BH) + caret,
        x2: sx(cx), y2: sy(Y_VIS - 0.5),
        stroke: stroke, 'stroke-width': 1.5
      });

      label(b.vis, cx, Y_VIS, 'middle', 15, stroke, '700', false);
    });

    // общая для всех трёх путей маска
    var first = boxes[0], last = boxes[boxes.length - 1];
    var centerX = (first.x + (last.x + BW)) / 2;
    el('line', {
      x1: sx(first.x), y1: sy(Y_NOTE - 0.9),
      x2: sx(last.x + BW), y2: sy(Y_NOTE - 0.9),
      stroke: 'var(--line)', 'stroke-width': 1
    });
    label(note, centerX, Y_NOTE, 'middle', 13, 'var(--muted)', 'normal', false);
  } catch (e) {
    slot.innerHTML =
      '<div class="fallback">Схема должна показывать три места, куда рантайм смотрит по маске ' +
      '<code>*/SKILL.md</code>: <code>~/.anthropic/skills/*/SKILL.md</code> — домашняя папка, ' +
      'область общая; <code>./skills/*/SKILL.md</code> — папка внутри репозитория, навык уехал ' +
      'с репозиторием; <code>~/.claude/skills/*/SKILL.md</code> — домашняя папка, только у меня.</div>';
  }
})();
</script>
</body>
</html>
