<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Лестница внешней помощи обману</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: whitesmoke;
      --panel: white;
      --ink: midnightblue;
      --muted: dimgray;
      --edge: slategray;
      --guide: steelblue;
      --bottom: mistyrose;
      --bottom-accent: indianred;
      --middle: lemonchiffon;
      --middle-accent: darkgoldenrod;
      --top: aliceblue;
      --top-accent: royalblue;
      --chip: ghostwhite;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: black;
        --panel: midnightblue;
        --ink: white;
        --muted: gainsboro;
        --edge: lightslategray;
        --guide: lightskyblue;
        --bottom: maroon;
        --bottom-accent: lightcoral;
        --middle: darkgoldenrod;
        --middle-accent: khaki;
        --top: darkslateblue;
        --top-accent: lightskyblue;
        --chip: darkslategray;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    figure {
      max-width: 940px;
      margin: auto;
      background: var(--panel);
      border: 2px solid var(--edge);
    }

    h2 {
      color: var(--ink);
      font-size: 22px;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 430px;
      background: var(--panel);
    }

    .panel {
      fill: var(--panel);
      stroke: var(--edge);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .step {
      stroke: var(--edge);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .step-bottom {
      fill: var(--bottom);
    }

    .step-middle {
      fill: var(--middle);
    }

    .step-top {
      fill: var(--top);
    }

    .accent-bottom {
      fill: var(--bottom-accent);
    }

    .accent-middle {
      fill: var(--middle-accent);
    }

    .accent-top {
      fill: var(--top-accent);
    }

    .chip-box {
      fill: var(--chip);
      stroke: var(--edge);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .stair-outline,
    .help-arrow,
    .footer-rule {
      fill: none;
      stroke: var(--guide);
      stroke-width: 3px;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .footer-rule {
      stroke-width: 2px;
    }

    .arrow-head {
      fill: var(--guide);
      stroke: var(--guide);
      stroke-width: 2px;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    text {
      fill: var(--ink);
    }

    .eyebrow {
      font-size: 14px;
      font-weight: bold;
    }

    .major {
      font-size: 18px;
      font-weight: bold;
    }

    .detail {
      font-size: 14px;
      fill: var(--muted);
    }

    .chip-label {
      font-size: 13px;
      font-weight: bold;
    }

    .arrow-label {
      font-size: 14px;
      font-weight: bold;
      fill: var(--guide);
    }

    .footer-label {
      font-size: 14px;
      fill: var(--muted);
    }

    #fallback {
      font-size: 15px;
      color: var(--ink);
      text-align: center;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="scheme-title">
    <h2 id="scheme-title">Лестница внешней помощи обману</h2>
    <svg
      id="diagram"
      viewBox="0 0 940 430"
      width="940"
      height="430"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="scheme-title scheme-description"
      aria-busy="true"
    >
      <desc id="scheme-description">
        Три ступени показывают последовательное уменьшение внешней помощи:
        от встроенного бэкдора к конфликту целей, созданному окружением, а
        затем к HHH-модели, которой сообщили факты о переобучении и режиме
        наблюдения, но не задали готовую стратегию.
      </desc>
    </svg>
    <p id="fallback" hidden>
      Схема должна была показать три ступени: урок 7 — вложенный бэкдор;
      урок 8 — конфликт целей, созданный подсказкой и окружением; урок 9 —
      HHH-модель, сведения о переобучении и различимый режим наблюдения.
      Снизу вверх внешней помощи становится меньше.
    </p>
  </figure>

  <script>
    const data = [
      { x: 42, y: 14 },
      { x: 1, y: 1 },
      {
        panel: { x1: 0, y1: 0, x2: 856, y2: 400 },
        staircase: [
          { x: 160, y: 350 },
          { x: 160, y: 242 },
          { x: 255, y: 242 },
          { x: 255, y: 126 },
          { x: 360, y: 126 },
          { x: 360, y: 8 },
          { x: 868, y: 8 }
        ],
        arrow: {
          shaft: [
            { x: 82, y: 345 },
            { x: 82, y: 44 }
          ],
          head: [
            { x: 82, y: 44 },
            { x: 71, y: 61 },
            { x: 93, y: 61 }
          ],
          labels: [
            {
              text: "меньше",
              x: 82,
              y: 178,
              dx: -1,
              dy: 0,
              anchor: "end",
              className: "arrow-label"
            },
            {
              text: "внешней",
              x: 82,
              y: 198,
              dx: -1,
              dy: 0,
              anchor: "end",
              className: "arrow-label"
            },
            {
              text: "помощи",
              x: 82,
              y: 218,
              dx: -1,
              dy: 0,
              anchor: "end",
              className: "arrow-label"
            }
          ]
        },
        cards: [
          {
            rect: { x1: 160, y1: 242, x2: 868, y2: 350 },
            accent: { x1: 160, y1: 242, x2: 170, y2: 350 },
            className: "step step-bottom",
            accentClass: "accent-bottom",
            boxes: [
              { x1: 184, y1: 306, x2: 476, y2: 336, className: "chip-box" }
            ],
            labels: [
              {
                text: "урок 7 · вложенный бэкдор",
                x: 160,
                y: 264,
                dx: 1,
                dy: 0,
                anchor: "start",
                className: "eyebrow"
              },
              {
                text: "Обманная схема встроена заранее",
                x: 160,
                y: 290,
                dx: 1,
                dy: 0,
                anchor: "start",
                className: "major"
              },
              {
                text: "экспериментатор задаёт стратегию",
                x: 330,
                y: 326,
                dx: 0,
                dy: 0,
                anchor: "middle",
                className: "chip-label"
              }
            ]
          },
          {
            rect: { x1: 255, y1: 126, x2: 868, y2: 234 },
            accent: { x1: 255, y1: 126, x2: 265, y2: 234 },
            className: "step step-middle",
            accentClass: "accent-middle",
            boxes: [
              { x1: 279, y1: 190, x2: 631, y2: 220, className: "chip-box" }
            ],
            labels: [
              {
                text: "урок 8 · конфликт целей в окружении",
                x: 255,
                y: 148,
                dx: 1,
                dy: 0,
                anchor: "start",
                className: "eyebrow"
              },
              {
                text: "Исследователи специально создают конфликт",
                x: 255,
                y: 174,
                dx: 1,
                dy: 0,
                anchor: "start",
                className: "major"
              },
              {
                text: "манипуляция промптом + окружением",
                x: 455,
                y: 210,
                dx: 0,
                dy: 0,
                anchor: "middle",
                className: "chip-label"
              }
            ]
          },
          {
            rect: { x1: 360, y1: 8, x2: 868, y2: 116 },
            accent: { x1: 360, y1: 8, x2: 370, y2: 116 },
            className: "step step-top",
            accentClass: "accent-top",
            boxes: [
              { x1: 384, y1: 70, x2: 600, y2: 104, className: "chip-box" },
              { x1: 612, y1: 70, x2: 850, y2: 104, className: "chip-box" }
            ],
            labels: [
              {
                text: "урок 9 · HHH-модель",
                x: 360,
                y: 30,
                dx: 1,
                dy: 0,
                anchor: "start",
                className: "eyebrow"
              },
              {
                text: "Сообщены факты, а не готовая стратегия",
                x: 360,
                y: 56,
                dx: 1,
                dy: 0,
                anchor: "start",
                className: "major"
              },
              {
                text: "сведения о переобучении",
                x: 492,
                y: 92,
                dx: 0,
                dy: 0,
                anchor: "middle",
                className: "chip-label"
              },
              {
                text: "различимый режим наблюдения",
                x: 731,
                y: 92,
                dx: 0,
                dy: 0,
                anchor: "middle",
                className: "chip-label"
              }
            ]
          }
        ],
        footer: {
          rule: [
            { x: 132, y: 370 },
            { x: 824, y: 370 }
          ],
          label: {
            text: "Снизу вверх: готовых опор меньше, объяснительной нагрузки на модель больше",
            x: 428,
            y: 389,
            dx: 0,
            dy: 0,
            anchor: "middle",
            className: "footer-label"
          }
        }
      }
    ];

    const [origin, scale, layout] = data;
    Object.freeze(origin);
    Object.freeze(scale);

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const labelPad = 12;
    const lineWidth = 2;
    const fontSize = 14;

    try {
      const namespace = "http://www.w3.org/2000/svg";
      const diagram = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");

      const make = (name, attributes = {}) => {
        const element = document.createElementNS(namespace, name);
        for (const [key, value] of Object.entries(attributes)) {
          element.setAttribute(key, String(value));
        }
        return element;
      };

      const mappedWidth = (x1, x2) => sx(x2) - sx(x1);
      const mappedHeight = (y1, y2) => sy(y2) - sy(y1);

      const addRect = (parent, box, className) => {
        const element = make("rect", {
          x: sx(box.x1),
          y: sy(box.y1),
          width: mappedWidth(box.x1, box.x2),
          height: mappedHeight(box.y1, box.y2),
          class: className
        });
        parent.append(element);
        return element;
      };

      const addPolyline = (parent, points, className) => {
        const element = make("polyline", {
          points: points.map(point =>
            `${sx(point.x)},${sy(point.y)}`
          ).join(" "),
          class: className
        });
        parent.append(element);
        return element;
      };

      const addPolygon = (parent, points, className) => {
        const element = make("polygon", {
          points: points.map(point =>
            `${sx(point.x)},${sy(point.y)}`
          ).join(" "),
          class: className
        });
        parent.append(element);
        return element;
      };

      const addLabel = (parent, label) => {
        const element = make("text", {
          x: sx(label.x + label.dx * labelPad / scale.x),
          y: sy(label.y + label.dy * labelPad / scale.y),
          "text-anchor": label.anchor,
          class: label.className
        });
        element.textContent = label.text;
        parent.append(element);
        return element;
      };

      const root = make("g", {
        "stroke-width": lineWidth,
        "font-size": fontSize
      });

      addRect(root, layout.panel, "panel");

      for (const card of layout.cards) {
        addRect(root, card.rect, card.className);
        addRect(root, card.accent, card.accentClass);

        for (const box of card.boxes) {
          addRect(root, box, box.className);
        }

        for (const label of card.labels) {
          addLabel(root, label);
        }
      }

      addPolyline(root, layout.staircase, "stair-outline");
      addPolyline(root, layout.arrow.shaft, "help-arrow");
      addPolygon(root, layout.arrow.head, "arrow-head");

      for (const label of layout.arrow.labels) {
        addLabel(root, label);
      }

      addPolyline(root, layout.footer.rule, "footer-rule");
      addLabel(root, layout.footer.label);

      diagram.append(root);
      diagram.setAttribute("aria-busy", "false");
      fallback.hidden = true;
    } catch (error) {
      const diagram = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      diagram.replaceChildren();
      diagram.setAttribute("aria-busy", "false");
      diagram.setAttribute("aria-hidden", "true");
      fallback.hidden = false;
    }
  </script>
</body>
</html>
