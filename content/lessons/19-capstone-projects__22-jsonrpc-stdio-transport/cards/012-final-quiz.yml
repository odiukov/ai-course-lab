- concept: канал отмены позволяет остановить выполняющийся вызов без завершения серверного процесса
  question: Какую задачу решает отдельный канал отмены в продакшен-транспорте?
  explanation: Уведомление об отмене адресует уже выполняющийся вызов. Сервер может остановить эту работу, сохранив процесс и транспортную сессию для остальных сообщений.
  kind: choice
  options:
    - Меняет формат упаковки всех сообщений
    - Позволяет прекратить выполняющийся вызов, не завершая весь сервер
    - Заменяет поле id порядком сообщений
    - Перенаправляет протокольные ответы в stderr
