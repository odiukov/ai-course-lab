<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Карта доменов CCL</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f8fb;
    --panel: #ffffff;
    --ink: #172033;
    --muted: #58637a;
    --line: #9ca7ba;
    --track: #66758e;
    --danger: #c63f52;
    --danger-soft: #ffe3e7;
    --hub: #26334d;
    --hub-ink: #ffffff;
    --bio: #e5f5eb;
    --bio-accent: #278457;
    --cyber: #e5efff;
    --cyber-accent: #2868bd;
    --ml: #f1e9ff;
    --ml-accent: #7450b9;
    --harm: #fff0df;
    --harm-accent: #b76024;
    --shadow: #d9deea;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  figure {
    width: 100%;
    max-width: 960px;
    margin: 0 auto;
    padding: 12px;
    background: var(--bg);
  }

  figcaption {
    margin: 0 0 8px;
  }

  h1 {
    margin: 0;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: .01em;
  }

  .subtitle {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 14px;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 440px;
    background: var(--bg);
  }

  [hidden] { display: none; }

  #fallback {
    min-height: 180px;
    padding: 24px;
    border: 2px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    font-size: 16px;
  }

  .card {
    stroke: var(--shadow);
    stroke-width: 2;
  }

  .card.bio { fill: var(--bio); }
  .card.cyber { fill: var(--cyber); }
  .card.ml { fill: var(--ml); }
  .card.harm { fill: var(--harm); }

  .icon.bio { fill: var(--bio-accent); }
  .icon.cyber { fill: var(--cyber-accent); }
  .icon.ml { fill: var(--ml-accent); }
  .icon.harm { fill: var(--harm-accent); }

  .icon-text {
    fill: #ffffff;
    font-weight: bold;
    font-size: 12px;
  }

  .domain-title {
    fill: var(--ink);
    font-size: 18px;
    font-weight: bold;
  }

  .description {
    fill: var(--muted);
    font-size: 14px;
  }

  .track {
    stroke: var(--track);
    stroke-width: 3;
    stroke-linecap: round;
  }

  .danger-track {
    stroke: var(--danger);
    stroke-width: 3;
    stroke-linecap: round;
  }

  .threshold {
    stroke: var(--danger);
    stroke-width: 3;
  }

  .threshold-label {
    fill: var(--danger);
    font-size: 12px;
    font-weight: bold;
  }

  .mode-label {
    fill: var(--muted);
    font-size: 12px;
  }

  .connection {
    stroke: var(--line);
    stroke-width: 2;
    fill: none;
  }

  .arrowhead { fill: var(--line); }

  .hub {
    fill: var(--hub);
    stroke: var(--panel);
    stroke-width: 3;
  }

  .hub-label {
    fill: var(--hub-ink);
    font-size: 13px;
    font-weight: bold;
    letter-spacing: .04em;
  }

  .new-badge {
    fill: var(--harm-accent);
    font-size: 12px;
    font-weight: bold;
  }

  .legend-box {
    fill: var(--panel);
    stroke: var(--shadow);
    stroke-width: 2;
  }

  .legend-main {
    fill: var(--ink);
    font-size: 14px;
    font-weight: bold;
  }

  .legend-note {
    fill: var(--muted);
    font-size: 13px;
  }

  .warning { fill: var(--danger); }
  .warning-mark {
    fill: #ffffff;
    font-size: 13px;
    font-weight: bold;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111722;
      --panel: #1b2433;
      --ink: #edf2fa;
      --muted: #b3bfd2;
      --line: #738097;
      --track: #91a0b8;
      --danger: #ff7486;
      --danger-soft: #4a232b;
      --hub: #dbe6f8;
      --hub-ink: #152035;
      --bio: #18392d;
      --bio-accent: #3eaa75;
      --cyber: #192f4d;
      --cyber-accent: #4f8ede;
      --ml: #302442;
      --ml-accent: #9b79d8;
      --harm: #442d1d;
      --harm-accent: #dd8650;
      --shadow: #3b4659;
    }
  }
</style>
</head>
<body>
<figure aria-labelledby="diagram-title diagram-subtitle">
  <figcaption>
    <h1 id="diagram-title">Карта доменов CCL</h1>
    <p class="subtitle" id="diagram-subtitle">Четыре независимых направления проверки — не одна общая шкала</p>
  </figcaption>

  <div id="fallback" role="status">
    Схема должна была показать четыре независимых домена CCL: биологические угрозы,
    киберугрозы, ускорение исследований ML и вредоносную манипуляцию.
  </div>

  <svg id="map" hidden width="960" height="440" viewBox="0 0 960 440"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Четыре независимых домена CCL, каждый со своей критической границей">
    <g id="drawing"></g>
  </svg>
</figure>

<script>
const data = Object.freeze({
  zero: 0,
  canvas: { width: 960, height: 440 },
  origin: { x: 480, y: 205 },
  scale: { x: 4, y: 4 },
  labelPadding: 8,
  radii: { card: 3, icon: 6, hub: 3, legend: 2 },
  boxes: {
    bio:   { x1: -116, y1: -47, x2: -6, y2: -5 },
    cyber: { x1: 6, y1: -47, x2: 116, y2: -5 },
    ml:    { x1: -116, y1: 5, x2: -6, y2: 42 },
    harm:  { x1: 6, y1: 5, x2: 116, y2: 42 },
    hub:   { x1: -15, y1: -4, x2: 15, y2: 4 },
    legend:{ x1: -116, y1: 46, x2: 116, y2: 57 }
  },
  domains: [
    {
      tone: "bio",
      box: "bio",
      icon: { x: -108, y: -38, r: 6, text: "БИО" },
      title: { x: -99, y: -38, text: "Bioweapon Uplift" },
      description: [
        { x: -106, y: -30, text: "Усиление возможностей, связанных" },
        { x: -106, y: -24, text: "с биологическим оружием" }
      ],
      gauge: {
        start: { x: -106, y: -12 },
        threshold: { x: -42, y: -12 },
        end: { x: -16, y: -12 },
        tickTop: { x: -42, y: -16 },
        tickBottom: { x: -42, y: -8 },
        head: [
          { x: -16, y: -12 },
          { x: -20, y: -14 },
          { x: -20, y: -10 }
        ]
      },
      labels: {
        ccl: { x: -42, y: -17, anchor: "middle", text: "СВОЙ CCL" },
        low: { x: -106, y: -7, anchor: "start", text: "ниже границы" },
        high:{ x: -16, y: -7, anchor: "end", text: "меры защиты" }
      }
    },
    {
      tone: "cyber",
      box: "cyber",
      icon: { x: 14, y: -38, r: 6, text: "КИБ" },
      title: { x: 23, y: -38, text: "Cyber Uplift" },
      description: [
        { x: 16, y: -30, text: "Усиление опасных возможностей" },
        { x: 16, y: -24, text: "в компьютерных системах" }
      ],
      gauge: {
        start: { x: 16, y: -12 },
        threshold: { x: 80, y: -12 },
        end: { x: 106, y: -12 },
        tickTop: { x: 80, y: -16 },
        tickBottom: { x: 80, y: -8 },
        head: [
          { x: 106, y: -12 },
          { x: 102, y: -14 },
          { x: 102, y: -10 }
        ]
      },
      labels: {
        ccl: { x: 80, y: -17, anchor: "middle", text: "СВОЙ CCL" },
        low: { x: 16, y: -7, anchor: "start", text: "ниже границы" },
        high:{ x: 106, y: -7, anchor: "end", text: "меры защиты" }
      }
    },
    {
      tone: "ml",
      box: "ml",
      icon: { x: -108, y: 14, r: 6, text: "ML" },
      title: { x: -99, y: 14, text: "ML R&D Acceleration" },
      description: [
        { x: -106, y: 22, text: "Ускорение исследований и разработки" },
        { x: -106, y: 28, text: "более мощных ML-систем" }
      ],
      gauge: {
        start: { x: -106, y: 35 },
        threshold: { x: -42, y: 35 },
        end: { x: -16, y: 35 },
        tickTop: { x: -42, y: 31 },
        tickBottom: { x: -42, y: 39 },
        head: [
          { x: -16, y: 35 },
          { x: -20, y: 33 },
          { x: -20, y: 37 }
        ]
      },
      labels: {
        ccl: { x: -42, y: 30, anchor: "middle", text: "СВОЙ CCL" },
        low: { x: -106, y: 40, anchor: "start", text: "ниже границы" },
        high:{ x: -16, y: 40, anchor: "end", text: "меры защиты" }
      }
    },
    {
      tone: "harm",
      box: "harm",
      icon: { x: 14, y: 14, r: 6, text: "ВЛ" },
      title: { x: 23, y: 14, text: "Harmful Manipulation" },
      badge: { x: 112, y: 14, anchor: "end", text: "НОВОЕ В v3.0" },
      description: [
        { x: 16, y: 22, text: "Изменение убеждений и поведения" },
        { x: 16, y: 28, text: "в ситуациях с высокими ставками" }
      ],
      gauge: {
        start: { x: 16, y: 35 },
        threshold: { x: 80, y: 35 },
        end: { x: 106, y: 35 },
        tickTop: { x: 80, y: 31 },
        tickBottom: { x: 80, y: 39 },
        head: [
          { x: 106, y: 35 },
          { x: 102, y: 33 },
          { x: 102, y: 37 }
        ]
      },
      labels: {
        ccl: { x: 80, y: 30, anchor: "middle", text: "СВОЙ CCL" },
        low: { x: 16, y: 40, anchor: "start", text: "ниже границы" },
        high:{ x: 106, y: 40, anchor: "end", text: "меры защиты" }
      }
    }
  ],
  connections: [
    {
      from: { x: -9, y: -3 }, to: { x: -15, y: -6 },
      head: [{ x: -15, y: -6 }, { x: -12, y: -6 }, { x: -14, y: -3 }]
    },
    {
      from: { x: 9, y: -3 }, to: { x: 15, y: -6 },
      head: [{ x: 15, y: -6 }, { x: 12, y: -6 }, { x: 14, y: -3 }]
    },
    {
      from: { x: -9, y: 3 }, to: { x: -15, y: 6 },
      head: [{ x: -15, y: 6 }, { x: -12, y: 6 }, { x: -14, y: 3 }]
    },
    {
      from: { x: 9, y: 3 }, to: { x: 15, y: 6 },
      head: [{ x: 15, y: 6 }, { x: 12, y: 6 }, { x: 14, y: 3 }]
    }
  ],
  hubLabel: { x: 0, y: 1, text: "ПРОФИЛЬ МОДЕЛИ" },
  legend: {
    warning: {
      center: { x: -108, y: 51.5 },
      points: [
        { x: -108, y: 48 },
        { x: -104.5, y: 51.5 },
        { x: -108, y: 55 },
        { x: -111.5, y: 51.5 }
      ],
      mark: { x: -108, y: 53, text: "!" }
    },
    main: { x: -101, y: 51, text: "Любой пересечённый CCL → меры защиты" },
    note: { x: 112, y: 51, anchor: "end", text: "v3.0: добавлен Harmful Manipulation" }
  }
});

const origin = Object.freeze(data.origin);
const scale = Object.freeze(data.scale);

const toPx = point => Object.freeze({
  x: origin.x + point.x * scale.x,
  y: origin.y + point.y * scale.y
});

try {
  const namespace = "http://www.w3.org/2000/svg";
  const drawing = document.getElementById("drawing");
  const map = document.getElementById("map");
  const fallback = document.getElementById("fallback");

  const element = (name, attributes, content) => {
    const node = document.createElementNS(namespace, name);
    Object.entries(attributes).forEach(([key, value]) => node.setAttribute(key, value));
    if (content !== undefined) node.textContent = content;
    return node;
  };

  const appendLine = (parent, from, to, className) => {
    const start = toPx(from);
    const finish = toPx(to);
    parent.append(element("line", {
      x1: start.x, y1: start.y, x2: finish.x, y2: finish.y,
      class: className
    }));
  };

  const appendText = (parent, label, className) => {
    const point = toPx(label);
    parent.append(element("text", {
      x: point.x,
      y: point.y,
      class: className,
      "text-anchor": label.anchor || "start"
    }, label.text));
  };

  const polygonPoints = points => points.map(point => {
    const position = toPx(point);
    return `${position.x},${position.y}`;
  }).join(" ");

  const appendBox = (parent, box, className, radius) => {
    const start = toPx({ x: box.x1, y: box.y1 });
    const finish = toPx({ x: box.x2, y: box.y2 });
    const corner = toPx({ x: radius, y: data.zero });
    const base = toPx({ x: data.zero, y: data.zero });
    parent.append(element("rect", {
      x: start.x,
      y: start.y,
      width: finish.x - start.x,
      height: finish.y - start.y,
      rx: Math.abs(corner.x - base.x),
      class: className
    }));
  };

  data.connections.forEach(connection => {
    appendLine(drawing, connection.from, connection.to, "connection");
    drawing.append(element("polygon", {
      points: polygonPoints(connection.head),
      class: "arrowhead"
    }));
  });

  data.domains.forEach(domain => {
    const group = element("g", { "aria-label": domain.title.text });
    appendBox(group, data.boxes[domain.box], `card ${domain.tone}`, data.radii.card);

    const iconCenter = toPx(domain.icon);
    const iconEdge = toPx({ x: domain.icon.x + domain.icon.r, y: domain.icon.y });
    group.append(element("circle", {
      cx: iconCenter.x,
      cy: iconCenter.y,
      r: Math.abs(iconEdge.x - iconCenter.x),
      class: `icon ${domain.tone}`
    }));
    group.append(element("text", {
      x: iconCenter.x,
      y: toPx({ x: domain.icon.x, y: domain.icon.y + 1 }).y,
      class: "icon-text",
      "text-anchor": "middle"
    }, domain.icon.text));

    appendText(group, domain.title, "domain-title");
    domain.description.forEach(label => appendText(group, label, "description"));
    if (domain.badge) appendText(group, domain.badge, "new-badge");

    appendLine(group, domain.gauge.start, domain.gauge.threshold, "track");
    appendLine(group, domain.gauge.threshold, domain.gauge.end, "danger-track");
    appendLine(group, domain.gauge.tickTop, domain.gauge.tickBottom, "threshold");
    group.append(element("polygon", {
      points: polygonPoints(domain.gauge.head),
      class: "warning"
    }));

    appendText(group, domain.labels.ccl, "threshold-label");
    appendText(group, domain.labels.low, "mode-label");
    appendText(group, domain.labels.high, "mode-label");
    drawing.append(group);
  });

  appendBox(drawing, data.boxes.hub, "hub", data.radii.hub);
  appendText(drawing, {
    ...data.hubLabel,
    anchor: "middle"
  }, "hub-label");

  appendBox(drawing, data.boxes.legend, "legend-box", data.radii.legend);
  drawing.append(element("polygon", {
    points: polygonPoints(data.legend.warning.points),
    class: "warning"
  }));
  appendText(drawing, {
    ...data.legend.warning.mark,
    anchor: "middle"
  }, "warning-mark");
  appendText(drawing, data.legend.main, "legend-main");
  appendText(drawing, data.legend.note, "legend-note");

  map.hidden = false;
  fallback.hidden = true;
} catch (error) {
  const fallback = document.getElementById("fallback");
  fallback.hidden = false;
  fallback.textContent =
    "Схема должна была показать четыре независимых домена CCL: Bioweapon Uplift, Cyber Uplift, ML R&D Acceleration и новый в v3.0 Harmful Manipulation. У каждого домена своя критическая граница; пересечение одной границы нельзя компенсировать низкими показателями в остальных.";
}
</script>
</body>
</html>
