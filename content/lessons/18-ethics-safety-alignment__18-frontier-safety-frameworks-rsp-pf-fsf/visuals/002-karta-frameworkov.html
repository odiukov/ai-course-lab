<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карта трёх лабораторий и четырёх вопросов безопасности</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fc;
      --panel: #ffffff;
      --ink: #182033;
      --muted: #58647a;
      --grid: #aab4c6;
      --guide: #e8edff;
      --guide-ink: #334b9b;
      --head: #eaf0f7;
      --row: #f4f6fa;
      --anthropic: #f8e8dc;
      --anthropic-ink: #713b20;
      --openai: #dcf2eb;
      --openai-ink: #155f4c;
      --deepmind: #e5e8fb;
      --deepmind-ink: #33449a;
      --cell-a: #fffdfa;
      --cell-b: #f7f9fd;
      --focus: #425fc4;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111521;
        --panel: #191f2c;
        --ink: #edf1fa;
        --muted: #b8c1d2;
        --grid: #566176;
        --guide: #242e54;
        --guide-ink: #c7d3ff;
        --head: #252d3a;
        --row: #202633;
        --anthropic: #503426;
        --anthropic-ink: #ffd7bd;
        --openai: #183f36;
        --openai-ink: #bff4df;
        --deepmind: #29305c;
        --deepmind-ink: #d6dcff;
        --cell-a: #1d2330;
        --cell-b: #202735;
        --focus: #9eb1ff;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .figure {
      width: 100%;
      max-width: 1160px;
      margin: 0 auto;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--grid);
    }

    .heading {
      padding: 10px 18px 8px;
      border-bottom: 1px solid var(--grid);
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 750;
      letter-spacing: -0.02em;
    }

    .heading p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 470px;
      background: var(--panel);
    }

    .guide-box {
      fill: var(--guide);
      stroke: var(--focus);
      stroke-width: 1px;
    }

    .guide-text {
      fill: var(--guide-ink);
      font-size: 13px;
      font-weight: 700;
    }

    .header-cell {
      fill: var(--head);
      stroke: var(--grid);
      stroke-width: 1px;
    }

    .corner-cell {
      fill: var(--row);
      stroke: var(--grid);
      stroke-width: 1px;
    }

    .row-label {
      stroke: var(--grid);
      stroke-width: 1px;
    }

    .anthropic {
      fill: var(--anthropic);
    }

    .openai {
      fill: var(--openai);
    }

    .deepmind {
      fill: var(--deepmind);
    }

    .cell-a {
      fill: var(--cell-a);
      stroke: var(--grid);
      stroke-width: 1px;
    }

    .cell-b {
      fill: var(--cell-b);
      stroke: var(--grid);
      stroke-width: 1px;
    }

    .badge {
      fill: var(--focus);
    }

    .badge-text {
      fill: white;
      font-size: 12px;
      font-weight: 800;
    }

    .corner-kicker,
    .row-kicker {
      fill: var(--muted);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.04em;
    }

    .corner-total {
      fill: var(--ink);
      font-size: 14px;
      font-weight: 750;
    }

    .column-title {
      fill: var(--ink);
      font-size: 15px;
      font-weight: 750;
    }

    .column-subtitle {
      fill: var(--muted);
      font-size: 11px;
    }

    .lab-name {
      font-size: 17px;
      font-weight: 800;
    }

    .lab-doc {
      fill: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .anthropic-text {
      fill: var(--anthropic-ink);
    }

    .openai-text {
      fill: var(--openai-ink);
    }

    .deepmind-text {
      fill: var(--deepmind-ink);
    }

    .cell-title {
      fill: var(--ink);
      font-size: 13px;
      font-weight: 720;
    }

    .cell-note {
      fill: var(--muted);
      font-size: 11px;
    }

    #fallback {
      display: none;
      margin: 0;
      padding: 18px;
      color: var(--ink);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="figure" aria-labelledby="figure-title">
    <header class="heading">
      <h1 id="figure-title">Карта трёх лабораторий и четырёх вопросов безопасности</h1>
      <p>Не рейтинг, а двенадцать координат для сопоставления документов.</p>
    </header>

    <svg id="map"
         viewBox="0 0 1160 470"
         width="1160"
         height="470"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Матрица трёх лабораторий и четырёх вопросов безопасности</title>
      <desc id="svg-desc">Строки соответствуют Anthropic, OpenAI и Google DeepMind, а столбцы — порогам, оценкам, safety case и реакции на конкурентов.</desc>
    </svg>

    <p id="fallback">
      Схема должна была показать матрицу 3 × 4: Anthropic, OpenAI и Google DeepMind по строкам; пороги, обязательные оценки, safety case и реакция на конкурентов по столбцам.
    </p>
  </main>

  <script>
    const data = [{
      canvas: { width: 1160, height: 470 },
      origin: { x: 40, y: 20 },
      scale: { x: 85, y: 72 },
      zero: 0,
      radius: 0.09,
      badgeRadius: 0.16,
      table: {
        x: 0.15,
        gridX: 3.2,
        right: 12.8,
        top: 0.9,
        headerBottom: 2,
        rowHeight: 1.4,
        columnWidth: 2.4
      },
      guide: {
        y: 0.05,
        height: 0.55,
        leftX: 0.15,
        leftWidth: 6.15,
        rightX: 6.5,
        rightWidth: 6.3,
        textY: 0.33,
        leftTextX: 0.35,
        rightTextX: 6.72
      },
      text: {
        cornerX: 0.35,
        cornerKickerY: 1.28,
        cornerTotalY: 1.66,
        headerTitleY: 1.28,
        headerSubtitleY: 1.65,
        badgeY: 1.22,
        rowNameX: 0.35,
        rowKickerOffset: 0.35,
        rowNameOffset: 0.73,
        rowDocOffset: 1.05,
        cellTitleOffset: 0.61,
        cellNoteOffset: 0.94
      },
      columns: [
        {
          number: "1",
          x: 3.2,
          center: 4.4,
          title: "Пороги",
          subtitle: "когда усилить защиту"
        },
        {
          number: "2",
          x: 5.6,
          center: 6.8,
          title: "Оценки",
          subtitle: "что проверить заранее"
        },
        {
          number: "3",
          x: 8,
          center: 9.2,
          title: "Обоснование",
          subtitle: "safety case"
        },
        {
          number: "4",
          x: 10.4,
          center: 11.6,
          title: "Реакция",
          subtitle: "если другие спешат"
        }
      ],
      rows: [
        {
          y: 2,
          className: "anthropic",
          textClass: "anthropic-text",
          lab: "Anthropic",
          document: "Responsible Scaling Policy · RSP",
          cells: [
            {
              x: 3.2,
              className: "cell-a",
              title: "Порог возможностей",
              note: "когда меняется уровень"
            },
            {
              x: 5.6,
              className: "cell-b",
              title: "Оценки до выпуска",
              note: "способности + защита"
            },
            {
              x: 8,
              className: "cell-a",
              title: "Оценка мер защиты",
              note: "достаточны ли меры"
            },
            {
              x: 10.4,
              className: "cell-b",
              title: "Динамика гонки",
              note: "условия пересмотра"
            }
          ]
        },
        {
          y: 3.4,
          className: "openai",
          textClass: "openai-text",
          lab: "OpenAI",
          document: "Preparedness Framework · PF",
          cells: [
            {
              x: 3.2,
              className: "cell-b",
              title: "Уровни риска",
              note: "High / Critical"
            },
            {
              x: 5.6,
              className: "cell-a",
              title: "Отчёт об оценках",
              note: "до масштабирования"
            },
            {
              x: 8,
              className: "cell-b",
              title: "Отчёт о защите",
              note: "остаточный риск"
            },
            {
              x: 10.4,
              className: "cell-a",
              title: "Чужой релиз",
              note: "условия корректировки"
            }
          ]
        },
        {
          y: 4.8,
          className: "deepmind",
          textClass: "deepmind-text",
          lab: "Google DeepMind",
          document: "Frontier Safety Framework · FSF",
          cells: [
            {
              x: 3.2,
              className: "cell-a",
              title: "Критич. уровень",
              note: "CCL"
            },
            {
              x: 5.6,
              className: "cell-b",
              title: "Оценки способностей",
              note: "до ключевых решений"
            },
            {
              x: 8,
              className: "cell-a",
              title: "Safety case",
              note: "аргумент + свидетельства"
            },
            {
              x: 10.4,
              className: "cell-b",
              title: "Внешние изменения",
              note: "исключит. обстоятельства"
            }
          ]
        }
      ]
    }];

    const [spec] = data;
    const origin = Object.freeze({ ...spec.origin });
    const scale = Object.freeze({ ...spec.scale });
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("map");
      const fallback = document.getElementById("fallback");
      const ns = "http://www.w3.org/2000/svg";

      const element = (name, attributes, content) => {
        const node = document.createElementNS(ns, name);
        Object.entries(attributes).forEach(([key, value]) => {
          node.setAttribute(key, String(value));
        });
        if (content !== undefined) {
          node.textContent = content;
        }
        return node;
      };

      const layer = element("g", {
        "aria-label": "Матрица сравнения"
      });

      layer.append(
        element("rect", {
          x: sx(spec.guide.leftX),
          y: sy(spec.guide.y),
          width: sx(spec.guide.leftX + spec.guide.leftWidth) - sx(spec.guide.leftX),
          height: sy(spec.guide.y + spec.guide.height) - sy(spec.guide.y),
          rx: sx(spec.radius) - sx(spec.zero),
          class: "guide-box"
        }),
        element("rect", {
          x: sx(spec.guide.rightX),
          y: sy(spec.guide.y),
          width: sx(spec.guide.rightX + spec.guide.rightWidth) - sx(spec.guide.rightX),
          height: sy(spec.guide.y + spec.guide.height) - sy(spec.guide.y),
          rx: sx(spec.radius) - sx(spec.zero),
          class: "guide-box"
        }),
        element("text", {
          x: sx(spec.guide.leftTextX),
          y: sy(spec.guide.textY),
          class: "guide-text",
          "text-anchor": "start",
          "dominant-baseline": "middle"
        }, "↓ По столбцу: 1 вопрос × 3 лаборатории"),
        element("text", {
          x: sx(spec.guide.rightTextX),
          y: sy(spec.guide.textY),
          class: "guide-text",
          "text-anchor": "start",
          "dominant-baseline": "middle"
        }, "→ По строке: 1 документ × 4 вопроса")
      );

      layer.append(
        element("rect", {
          x: sx(spec.table.x),
          y: sy(spec.table.top),
          width: sx(spec.table.gridX) - sx(spec.table.x),
          height: sy(spec.table.headerBottom) - sy(spec.table.top),
          class: "corner-cell"
        }),
        element("text", {
          x: sx(spec.text.cornerX),
          y: sy(spec.text.cornerKickerY),
          class: "corner-kicker",
          "text-anchor": "start"
        }, "ЛАБОРАТОРИИ · ДОКУМЕНТЫ"),
        element("text", {
          x: sx(spec.text.cornerX),
          y: sy(spec.text.cornerTotalY),
          class: "corner-total",
          "text-anchor": "start"
        }, "3 × 4 = 12 ячеек")
      );

      spec.columns.forEach(column => {
        layer.append(
          element("rect", {
            x: sx(column.x),
            y: sy(spec.table.top),
            width: sx(column.x + spec.table.columnWidth) - sx(column.x),
            height: sy(spec.table.headerBottom) - sy(spec.table.top),
            class: "header-cell"
          }),
          element("circle", {
            cx: sx(column.center),
            cy: sy(spec.text.badgeY),
            r: sx(spec.badgeRadius) - sx(spec.zero),
            class: "badge"
          }),
          element("text", {
            x: sx(column.center),
            y: sy(spec.text.badgeY),
            class: "badge-text",
            "text-anchor": "middle",
            "dominant-baseline": "central"
          }, column.number),
          element("text", {
            x: sx(column.center),
            y: sy(spec.text.headerTitleY),
            class: "column-title",
            "text-anchor": "middle",
            "dominant-baseline": "hanging"
          }, column.title),
          element("text", {
            x: sx(column.center),
            y: sy(spec.text.headerSubtitleY),
            class: "column-subtitle",
            "text-anchor": "middle",
            "dominant-baseline": "hanging"
          }, column.subtitle)
        );
      });

      spec.rows.forEach(row => {
        layer.append(
          element("rect", {
            x: sx(spec.table.x),
            y: sy(row.y),
            width: sx(spec.table.gridX) - sx(spec.table.x),
            height: sy(row.y + spec.table.rowHeight) - sy(row.y),
            class: `row-label ${row.className}`
          }),
          element("text", {
            x: sx(spec.text.rowNameX),
            y: sy(row.y + spec.text.rowKickerOffset),
            class: "row-kicker",
            "text-anchor": "start"
          }, "ЛАБОРАТОРИЯ"),
          element("text", {
            x: sx(spec.text.rowNameX),
            y: sy(row.y + spec.text.rowNameOffset),
            class: `lab-name ${row.textClass}`,
            "text-anchor": "start"
          }, row.lab),
          element("text", {
            x: sx(spec.text.rowNameX),
            y: sy(row.y + spec.text.rowDocOffset),
            class: "lab-doc",
            "text-anchor": "start"
          }, row.document)
        );

        row.cells.forEach(cell => {
          const center = cell.x + spec.table.columnWidth / spec.columns.length * spec.rows.length / spec.rows.length * spec.columns.length / spec.columns.length;
          layer.append(
            element("rect", {
              x: sx(cell.x),
              y: sy(row.y),
              width: sx(cell.x + spec.table.columnWidth) - sx(cell.x),
              height: sy(row.y + spec.table.rowHeight) - sy(row.y),
              class: cell.className
            }),
            element("text", {
              x: sx(center),
              y: sy(row.y + spec.text.cellTitleOffset),
              class: "cell-title",
              "text-anchor": "middle"
            }, cell.title),
            element("text", {
              x: sx(center),
              y: sy(row.y + spec.text.cellNoteOffset),
              class: "cell-note",
              "text-anchor": "middle"
            }, cell.note)
          );
        });
      });

      svg.append(layer);
      fallback.style.display = "none";
    } catch (error) {
      const fallback = document.getElementById("fallback");
      const svg = document.getElementById("map");
      const ns = "http://www.w3.org/2000/svg";
      const message = document.createElementNS(ns, "text");
      message.setAttribute("x", String(sx(spec.table.x)));
      message.setAttribute("y", String(sy(spec.table.top)));
      message.setAttribute("class", "cell-title");
      message.setAttribute("text-anchor", "start");
      message.textContent = "Матрица 3 × 4: три лаборатории и четыре вопроса безопасности.";
      svg.append(message);
      fallback.style.display = "block";
    }
  </script>
</body>
</html>
