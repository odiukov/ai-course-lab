<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Три опоры safety case</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f6f8fc;
      --panel: #ffffff;
      --panel-strong: #eef7f2;
      --ink: #182033;
      --muted: #596579;
      --line: #9aa7ba;
      --triangle: #dce4f3;
      --triangle-fill: #edf2fb;
      --center: #19734a;
      --center-soft: #dff3e8;
      --monitor: #246fce;
      --monitor-soft: #e3efff;
      --plan: #a35b08;
      --plan-soft: #fff0d4;
      --capability: #b53b46;
      --capability-soft: #ffe5e7;
      --on-accent: #ffffff;
      --shadow: #18203318;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111622;
        --panel: #1a2232;
        --panel-strong: #172c25;
        --ink: #eef3fb;
        --muted: #b3bed0;
        --line: #68758b;
        --triangle: #46546c;
        --triangle-fill: #1d293c;
        --center: #58c98d;
        --center-soft: #183829;
        --monitor: #70adff;
        --monitor-soft: #193556;
        --plan: #f0ad55;
        --plan-soft: #402e18;
        --capability: #ff8993;
        --capability-soft: #43242b;
        --on-accent: #101522;
        --shadow: #00000040;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: auto;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .diagram {
      width: 100%;
      max-width: 960px;
      margin: auto;
      background: var(--page);
    }

    h1 {
      margin: auto;
      color: var(--ink);
      font-size: 24px;
      line-height: normal;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 438px;
      background: var(--page);
      overflow: visible;
    }

    [hidden] {
      display: none;
    }

    .triangle {
      fill: var(--triangle-fill);
      stroke: var(--triangle);
      stroke-linejoin: round;
    }

    .spoke {
      fill: none;
      stroke: var(--line);
      stroke-linecap: round;
    }

    .card {
      fill: var(--panel);
      stroke: var(--accent);
    }

    .stem {
      fill: none;
      stroke: var(--accent);
      stroke-linecap: round;
    }

    .marker-halo {
      fill: var(--accent-soft);
      stroke: var(--accent);
    }

    .marker-core {
      fill: var(--accent);
    }

    .marker-bar {
      stroke: var(--on-accent);
      stroke-linecap: round;
    }

    .monitor {
      --accent: var(--monitor);
      --accent-soft: var(--monitor-soft);
    }

    .plan {
      --accent: var(--plan);
      --accent-soft: var(--plan-soft);
    }

    .capability {
      --accent: var(--capability);
      --accent-soft: var(--capability-soft);
    }

    .node-title {
      fill: var(--accent);
      font-weight: bold;
    }

    .node-copy {
      fill: var(--muted);
    }

    .center-halo {
      fill: var(--center-soft);
      stroke: var(--center);
    }

    .center-card {
      fill: var(--panel-strong);
      stroke: var(--center);
    }

    .center-kicker {
      fill: var(--center);
      font-weight: bold;
    }

    .center-title {
      fill: var(--ink);
      font-weight: bold;
    }

    .center-copy {
      fill: var(--muted);
    }

    .shadow {
      fill: var(--shadow);
    }

    text {
      font-family: inherit;
      pointer-events: none;
    }

    #fallback {
      margin: auto;
      max-width: 960px;
      color: var(--ink);
      background: var(--panel);
      font-size: 17px;
      line-height: normal;
      text-align: center;
    }
  </style>
</head>
<body>
  <figure class="diagram" aria-labelledby="diagram-title">
    <h1 id="diagram-title">Три опоры safety case</h1>

    <p id="fallback">
      Треугольник из мониторинга, невозможности выстроить связный план и
      невозможности причинить вред поддерживает приемлемо безопасный деплой
      при худших допущениях.
    </p>

    <svg
      id="safety-diagram"
      viewBox="0 0 960 438"
      width="960"
      height="438"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-desc"
      hidden
    >
      <title id="svg-title">Три опоры safety case</title>
      <desc id="svg-desc">
        В вершинах треугольника находятся мониторинг, невозможность выстроить
        связный план и невозможность причинить рассматриваемый вред. В центре
        показан приемлемо безопасный деплой при худших допущениях.
      </desc>
      <g id="drawing"></g>
    </svg>
  </figure>

  <script>
    const diagramData = [
      {
        kind: "config",
        zero: 0,
        line: 2,
        lineStrong: 3,
        fontNodeTitle: 16,
        fontNodeCopy: 13,
        fontCenterKicker: 13,
        fontCenterTitle: 21,
        fontCenterCopy: 15,
        labelPad: 5,
        corner: 16,
        markerRadius: 19,
        markerCoreRadius: 12,
        markerBar: 6,
        triangle: [
          { x: 0, y: 105 },
          { x: -250, y: 287 },
          { x: 250, y: 287 }
        ],
        centerPoint: { x: 0, y: 218 },
        centerHalo: {
          x: -196,
          y: 146,
          width: 392,
          height: 142,
          corner: 22
        },
        centerCard: {
          x: -184,
          y: 155,
          width: 368,
          height: 124,
          corner: 18
        },
        centerLines: [
          {
            text: "ТРИ РАЗНЫХ МЕСТА РАЗРЫВА",
            x: 0,
            y: 181,
            role: "kicker"
          },
          {
            text: "ПРИЕМЛЕМО БЕЗОПАСНЫЙ",
            x: 0,
            y: 211,
            role: "title"
          },
          {
            text: "ДЕПЛОЙ",
            x: 0,
            y: 238,
            role: "title"
          },
          {
            text: "при худших допущениях",
            x: 0,
            y: 262,
            role: "copy"
          }
        ]
      },
      {
        kind: "node",
        tone: "monitor",
        marker: { x: 0, y: 105 },
        stem: [
          { x: 0, y: 88 },
          { x: 0, y: 105 }
        ],
        card: {
          x: -165,
          y: 10,
          width: 330,
          height: 78,
          corner: 16
        },
        lines: [
          {
            text: "МОНИТОРИНГ",
            x: 0,
            y: 36,
            role: "title"
          },
          {
            text: "Опасное действие обнаружено",
            x: 0,
            y: 59,
            role: "copy"
          },
          {
            text: "и реакция запущена вовремя",
            x: 0,
            y: 78,
            role: "copy"
          }
        ]
      },
      {
        kind: "node",
        tone: "plan",
        marker: { x: -250, y: 287 },
        stem: [
          { x: -250, y: 287 },
          { x: -282, y: 304 }
        ],
        card: {
          x: -455,
          y: 304,
          width: 350,
          height: 100,
          corner: 16
        },
        lines: [
          {
            text: "НЕВОЗМОЖНОСТЬ ВЫСТРОИТЬ",
            x: -280,
            y: 331,
            role: "title"
          },
          {
            text: "СВЯЗНЫЙ ПЛАН",
            x: -280,
            y: 353,
            role: "title"
          },
          {
            text: "Скрытая стратегия не складывается",
            x: -280,
            y: 379,
            role: "copy"
          }
        ]
      },
      {
        kind: "node",
        tone: "capability",
        marker: { x: 250, y: 287 },
        stem: [
          { x: 250, y: 287 },
          { x: 282, y: 304 }
        ],
        card: {
          x: 105,
          y: 304,
          width: 350,
          height: 100,
          corner: 16
        },
        lines: [
          {
            text: "НЕВОЗМОЖНОСТЬ ПРИЧИНИТЬ",
            x: 280,
            y: 331,
            role: "title"
          },
          {
            text: "РАССМАТРИВАЕМЫЙ ВРЕД",
            x: 280,
            y: 353,
            role: "title"
          },
          {
            text: "Даже если план уже готов",
            x: 280,
            y: 379,
            role: "copy"
          }
        ]
      }
    ];

    const origin = Object.freeze({ x: 480, y: 18 });
    const scale = 1;

    const sx = (x) => origin.x + x * scale;
    const sy = (y) => origin.y + y * scale;

    try {
      const namespace = "http://www.w3.org/2000/svg";
      const svg = document.getElementById("safety-diagram");
      const drawing = document.getElementById("drawing");
      const fallback = document.getElementById("fallback");
      const config = diagramData.find((item) => item.kind === "config");
      const nodes = diagramData.filter((item) => item.kind === "node");

      const make = (tag, attributes, parent) => {
        const element = document.createElementNS(namespace, tag);

        Object.entries(attributes).forEach(([name, value]) => {
          element.setAttribute(name, String(value));
        });

        parent.appendChild(element);
        return element;
      };

      const closedPath = (points) => {
        const commands = points.map((point, index) => {
          const command = index ? "L" : "M";
          return `${command} ${sx(point.x)} ${sy(point.y)}`;
        });

        return `${commands.join(" ")} Z`;
      };

      const openPath = (points) => {
        return points.map((point, index) => {
          const command = index ? "L" : "M";
          return `${command} ${sx(point.x)} ${sy(point.y)}`;
        }).join(" ");
      };

      const rectAttributes = (box) => ({
        x: sx(box.x),
        y: sy(box.y),
        width: sx(box.width) - sx(config.zero),
        height: sy(box.height) - sy(config.zero),
        rx: sx(box.corner) - sx(config.zero),
        ry: sy(box.corner) - sy(config.zero)
      });

      make(
        "path",
        {
          d: closedPath(config.triangle),
          class: "triangle",
          "stroke-width": config.lineStrong
        },
        drawing
      );

      config.triangle.forEach((vertex) => {
        make(
          "path",
          {
            d: openPath([vertex, config.centerPoint]),
            class: "spoke",
            "stroke-width": config.line
          },
          drawing
        );
      });

      nodes.forEach((node) => {
        const group = make(
          "g",
          {
            class: node.tone
          },
          drawing
        );

        make(
          "path",
          {
            d: openPath(node.stem),
            class: "stem",
            "stroke-width": config.lineStrong
          },
          group
        );

        make(
          "rect",
          {
            ...rectAttributes(node.card),
            class: "shadow",
            transform:
              `translate(${sx(config.zero)} ${sy(config.labelPad) - sy(config.zero)})`
          },
          group
        );

        make(
          "rect",
          {
            ...rectAttributes(node.card),
            class: "card",
            "stroke-width": config.line
          },
          group
        );

        node.lines.forEach((line) => {
          const className =
            line.role === "title" ? "node-title" : "node-copy";
          const fontSize =
            line.role === "title"
              ? config.fontNodeTitle
              : config.fontNodeCopy;

          const text = make(
            "text",
            {
              x: sx(line.x),
              y: sy(line.y),
              class: className,
              "font-size": fontSize,
              "text-anchor": "middle"
            },
            group
          );

          text.textContent = line.text;
        });
      });

      make(
        "rect",
        {
          ...rectAttributes(config.centerHalo),
          class: "center-halo",
          "stroke-width": config.line
        },
        drawing
      );

      make(
        "rect",
        {
          ...rectAttributes(config.centerCard),
          class: "center-card",
          "stroke-width": config.lineStrong
        },
        drawing
      );

      config.centerLines.forEach((line) => {
        const className =
          line.role === "kicker"
            ? "center-kicker"
            : line.role === "title"
              ? "center-title"
              : "center-copy";

        const fontSize =
          line.role === "kicker"
            ? config.fontCenterKicker
            : line.role === "title"
              ? config.fontCenterTitle
              : config.fontCenterCopy;

        const text = make(
          "text",
          {
            x: sx(line.x),
            y: sy(line.y),
            class: className,
            "font-size": fontSize,
            "text-anchor": "middle"
          },
          drawing
        );

        text.textContent = line.text;
      });

      nodes.forEach((node) => {
        const group = make(
          "g",
          {
            class: node.tone
          },
          drawing
        );

        make(
          "circle",
          {
            cx: sx(node.marker.x),
            cy: sy(node.marker.y),
            r: sx(config.markerRadius) - sx(config.zero),
            class: "marker-halo",
            "stroke-width": config.lineStrong
          },
          group
        );

        make(
          "circle",
          {
            cx: sx(node.marker.x),
            cy: sy(node.marker.y),
            r: sx(config.markerCoreRadius) - sx(config.zero),
            class: "marker-core"
          },
          group
        );

        make(
          "line",
          {
            x1: sx(node.marker.x - config.markerBar),
            y1: sy(node.marker.y),
            x2: sx(node.marker.x + config.markerBar),
            y2: sy(node.marker.y),
            class: "marker-bar",
            "stroke-width": config.lineStrong
          },
          group
        );
      });

      fallback.hidden = true;
      svg.hidden = false;
    } catch (error) {
      const svg = document.getElementById("safety-diagram");
      const fallback = document.getElementById("fallback");

      svg.hidden = true;
      fallback.hidden = false;
      fallback.textContent =
        "Схема должна была показать треугольник из мониторинга, невозможности выстроить связный план и невозможности причинить вред; в центре — приемлемо безопасный деплой при худших допущениях.";
    }
  </script>
</body>
</html>
