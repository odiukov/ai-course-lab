- concept: GateChain фиксирует решение текущего гейта и прекращает обход при первом отказе
  question: Расположи действия GateChain при обработке очередного гейта в правильном порядке.
  explanation: Отказ нужно сначала сохранить, иначе итог потеряет причину остановки. После сохранённого отказа следующие гейты вызывать нельзя.
  kind: order
  items:
    - Вызвать evaluate у текущего гейта
    - Добавить полученный GateDecision в список решений
    - Проверить поле allow сохранённого решения
    - При отказе немедленно вернуть ChainOutcome
