- concept: классификация с учителем обеспечивает более высокую точность на известных типах аномалий
  question: У команды есть размеченные примеры нескольких известных типов атак. Главная цель — как можно точнее распознавать именно эти типы и сократить число ложных тревог. Какой подход лучше соответствует цели?
  explanation: Supervised-классификатор учится разделять заданные классы по размеченным примерам, поэтому обычно точнее распознаёт знакомые типы атак. Это преимущество не распространяется автоматически на типы, отсутствовавшие в обучающих данных.
  kind: choice
  options:
    - Обучить supervised-классификатор на размеченных атаках
    - Использовать только unsupervised-детектор любых отклонений от нормы
    - Считать аномалией каждое редкое событие без обучения модели
  correct: 0
  id: 013-classification-tradeoff-1
  fingerprint: aaf7b4d1
- concept: детектор без учителя чаще выдаёт ложные тревоги, потому что необычность не равна вредоносности
  question: Почему unsupervised-детектор отклонений обычно даёт больше ложных срабатываний, чем классификатор известных угроз?
  explanation: Модель отклонений отвечает на вопрос «насколько это необычно», а не «является ли это атакой». Из-за этого легитимные редкие события попадают в число тревог.
  kind: open
  reference: Детектор без учителя отличает типичное поведение от необычного, но не знает, является ли отклонение вредоносным. Поэтому редкое, но допустимое событие тоже может получить высокий показатель аномальности и вызвать тревогу.
  id: 013-classification-tradeoff-2
  fingerprint: 4b2088d1
- concept: гибридная система распределяет широкий охват, точное распознавание известных угроз и разбор спорных случаев между разными механизмами
  question: Заполни пропуск в схеме практической гибридной системы обнаружения угроз.
  explanation: Детектор без учителя обеспечивает широкий охват отклонений, supervised-модели точнее распознают известные приоритетные угрозы, а ручная проверка помогает разобрать неоднозначные сигналы.
  kind: cloze
