- concept: величина крайнего наблюдения не влияет на IQR-границы, если позиции квартилей остаются прежними
  question: В упорядоченной выборке самое большое значение заменили ещё более крупным, не меняя остальные наблюдения. Что произойдёт с границами IQR-детектора, если квартильные позиции остались прежними?
  explanation: IQR строится по квартилям, которые зависят от позиций в упорядоченных данных. Если замена максимума не затронула значения на квартильных позициях, квартильные границы сохранятся.
  kind: choice
  options:
    - Границы не изменятся
    - Обе границы заметно сдвинутся вверх
    - Коридор обязательно станет уже
    - Верхняя граница станет равна новому максимуму
