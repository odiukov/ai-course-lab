- concept: периодическое пакетное обучение сочетается с немедленной онлайн-оценкой новых событий
  question: Как организовать детектор аномалий, если новые события нужно проверять сразу, а постоянно переобучать модель слишком дорого?
  explanation: Пакетное обучение позволяет регулярно обновлять представление о норме без затрат на переобучение после каждого события. Между обновлениями зафиксированная модель сразу выставляет оценки новым наблюдениям.
  kind: choice
  options:
    - Переобучать модель после каждого нового события и затем вычислять оценку
    - Периодически обновлять модель на пакете данных, а между обновлениями сразу оценивать события неизменной моделью
    - Накапливать события до следующего обучения и только потом оценивать весь пакет
    - Обучить модель один раз и навсегда отказаться от её обновления
  correct: 1
  id: 058-online-scoring-1
  fingerprint: 8c55243e
- concept: признаки при обучении и онлайн-оценке должны вычисляться по одинаковым правилам
  question: При обучении признак активности клиента вычисляли по фиксированному окну истории, а в продакшне для нового события стали учитывать только данные с начала текущего дня. Объясни, почему оценки модели становятся ненадёжными и как исправить систему.
  explanation: Изменение окна истории меняет распределение и смысл входного признака, хотя схема данных внешне остаётся прежней. Модель получает значения не того типа, на котором училась, поэтому может ошибочно считать нормальные события аномальными.
  kind: open
  reference: Одинаковое имя столбца не гарантирует одинакового смысла признака. Онлайн-система должна применять те же правила очистки, единицы измерения, порядок признаков и историческое окно, что и обучающий конвейер. Для этого нужную историю следует хранить в буфере.
  id: 058-online-scoring-2
  fingerprint: a870f52b
