- concept: результаты операторской проверки образуют разметку для оценки и улучшения детектора
  question: Как следует использовать решения оператора о том, была тревога истинной или ложной?
  explanation: Подтверждения и отклонения тревог создают петлю обратной связи. Накопленная разметка позволяет измерять качество детектора на реальных случаях и обоснованно изменять его порог, признаки или модель.
  kind: open
  reference: Возвращать результаты проверки в систему и накапливать их как размеченные данные, чтобы оценивать качество, корректировать настройки и улучшать детектор.
