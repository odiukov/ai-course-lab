- concept: рекурсивное построение независимо повторяет случайное разбиение для каждой дочерней подвыборки
  question: Почему левая и правая ветви одного isolation-дерева могут использовать разные признаки и разные пороги?
  explanation: Рекурсия обрабатывает дочерние узлы независимо. Поэтому ветви могут выбрать разные признаки, а их пороги рассчитываются по локальным минимумам и максимумам.
  kind: open
  reference: После разбиения процедура построения отдельно вызывается для каждой дочерней подвыборки. В каждом таком вызове заново случайно выбираются признак и порог, причём диапазон порога определяется наблюдениями именно этого узла.
