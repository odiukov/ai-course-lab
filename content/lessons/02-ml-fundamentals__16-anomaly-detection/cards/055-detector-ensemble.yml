- concept: усреднение нормированных оценок ослабляет одиночную тревогу одного детектора
  question: Пять детекторов присвоили объекту нормированные оценки 0.13, 0.17, 0.21, 0.89 и 0.25. Чему равна средняя оценка ансамбля?
  explanation: Сумма оценок равна 1.65, а среднее — 1.65 / 5 = 0.33. Сильная тревога одного метода не стала сильной итоговой тревогой, поскольку остальные детекторы её не поддержали.
  kind: numeric
  answer: 0.33
  tolerance: 0.001
  id: 055-detector-ensemble-2
  fingerprint: 552b33b3
- concept: взвешенный ансамбль назначает детекторам веса по качеству на размеченной валидационной выборке
  question: Как использовать валидационную выборку с известными аномалиями, чтобы надёжные детекторы сильнее влияли на итог ансамбля?
  explanation: Размеченная валидационная выборка позволяет измерить полезность отдельных детекторов. Вес отражает подтверждённую надёжность метода, поэтому итоговая оценка сильнее зависит от детекторов, которые лучше находят известные аномалии и реже дают ложные тревоги.
  kind: open
  reference: Оценить качество каждого детектора на валидационной выборке и назначить более надёжным методам большие веса, после чего вычислять взвешенную среднюю нормированных оценок.
  id: 055-detector-ensemble-3
  fingerprint: bca69248
