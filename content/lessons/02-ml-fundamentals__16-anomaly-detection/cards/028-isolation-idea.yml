- concept: в Isolation Forest короткая средняя длина пути соответствует высокой аномальности
  question: В Isolation Forest средняя длина пути для наблюдения A короче, чем для наблюдения B. Как это интерпретировать?
  explanation: Длина пути — это число случайных разрезов, необходимых для изоляции точки. Точки в разреженных областях обычно отделяются быстрее, поэтому короткая средняя длина пути служит сигналом аномальности.
  kind: choice
  options:
    - 'Наблюдение A более аномально: случайные разрезы быстрее оставляют его в одиночестве'
    - 'Наблюдение A более типично: короткий путь указывает на плотную область'
    - Наблюдения одинаково аномальны, поскольку оба дошли до листа
    - Сравнить наблюдения можно только при наличии размеченных аномалий
  correct: 0
  id: 028-isolation-idea-1
  fingerprint: edf062c5
- concept: усреднение по множеству случайных деревьев делает оценку Isolation Forest устойчивее
  question: Почему Isolation Forest оценивает наблюдение по множеству случайных деревьев, а не по одному дереву?
  explanation: Результат одного дерева сильно зависит от случайно выбранных признаков и границ разрезов. Лес повторяет разбиение разными способами, а средняя длина пути ослабляет случайные отклонения.
  kind: open
  reference: Отдельное случайное дерево может случайно изолировать обычную точку слишком рано или аномальную слишком поздно. Усреднение длин путей по разным деревьям уменьшает влияние неудачного разбиения и даёт более устойчивую оценку аномальности.
  id: 028-isolation-idea-2
  fingerprint: 9f66cac1
