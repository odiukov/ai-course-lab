- concept: снижение порога повышает чувствительность детектора ценой дополнительных ложных тревог
  question: У детектора уже рассчитаны оценки аномальности для фиксированного набора наблюдений. Что обычно произойдёт, если снизить порог срабатывания?
  explanation: При более низком пороге подозрительными признаётся больше наблюдений. Это помогает не пропустить слабые отклонения, но одновременно увеличивает число нормальных случаев, ошибочно вызвавших тревогу.
