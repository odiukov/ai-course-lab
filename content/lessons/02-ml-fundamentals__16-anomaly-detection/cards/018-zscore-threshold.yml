- concept: глобальный Z-score искажает оценку необычности в многомодальном распределении
  question: Показания датчика образуют два плотных стабильных кластера. Почему Z-score, рассчитанный по общему среднему и стандартному отклонению, может неверно оценивать аномальность?
  explanation: В многомодальных данных одна средняя точка не представляет ни один из обычных режимов. Поэтому область между кластерами может выглядеть максимально нормальной, а центры реальных кластеров — более необычными.
  kind: choice
  options:
    - Общее среднее может оказаться между кластерами, где наблюдения почти не встречаются
    - Z-score всегда присваивает всем наблюдениям одинаковую оценку
    - Z-score работает только при наличии размеченных аномалий
    - Объединение кластеров неизбежно превращает все наблюдения в выбросы
  correct: 0
  id: 018-zscore-threshold-1
  fingerprint: 4dd90c8f
- concept: в скошенном распределении удалённость от среднего не эквивалентна аномальности
  question: Объясни своими словами, почему законное наблюдение из длинного правого хвоста скошенного распределения может получить большой по модулю Z-score.
  explanation: Порог Z-score осмыслен прежде всего для примерно симметричных колоколообразных данных. При сильной асимметрии нормальный хвост распределения может ошибочно давать много тревог.
  kind: open
  reference: Z-score измеряет расстояние от общего среднего в единицах стандартного отклонения и не учитывает асимметричную форму распределения. В длинном хвосте могут регулярно встречаться редкие, но нормальные значения, поэтому большой Z-score сам по себе не делает их аномалиями.
  id: 018-zscore-threshold-2
  fingerprint: 78a5d61d
