- concept: обнаружение аномалий через моделирование нормального поведения
  question: Есть журнал обычной работы системы, но нет надёжной разметки сбоев. Какой подход соответствует обнаружению аномалий?
  explanation: Модель строит представление нормального поведения по обычным наблюдениям. Новая запись считается подозрительной, если она плохо согласуется с выученной нормой; заранее перечислять все виды сбоев не требуется.
  kind: choice
  options:
    - Составить полный перечень возможных сбоев и искать только точные совпадения
    - Выучить закономерности нормальной работы и считать отклоняющиеся наблюдения подозрительными
    - Присвоить случайные метки части наблюдений и обучить классификатор
    - Считать аномальным каждое редко встречающееся отдельное значение
  correct: 1
  id: 002-model-normy-1
  fingerprint: bfc0c94f
- concept: нормальность наблюдения зависит от контекста, а не только от отдельного значения
  question: Почему одно и то же значение нагрузки на систему может быть нормальным в одном контексте и аномальным в другом? Объясни своими словами.
  explanation: Аномальность определяется отклонением от контекстной нормы. Проверка только по одному глобальному порогу теряет зависимости от времени, режима работы и сочетания признаков.
  kind: open
  reference: 'Модель учитывает закономерности нормальной работы, включая связи нагрузки со временем и другими признаками. Поэтому значение оценивается вместе с контекстом: оно может соответствовать привычному режиму в одном случае и сильно отклоняться от него в другом.'
  id: 002-model-normy-2
  fingerprint: fa6a61c0
