- concept: Z-score равен отклонению от среднего, делённому на стандартное отклонение
  question: Среднее значение показателя равно 80, стандартное отклонение — 9, а проверяемое значение — 116. Чему равен Z-score?
  explanation: 'Вычитаем среднее и делим результат на стандартное отклонение: (116 − 80) / 9 = 4. Наблюдение находится на четыре стандартных отклонения выше среднего.'
  kind: numeric
  answer: 4
  tolerance: 0.01
  id: 016-zscore-rule-1
  fingerprint: aa9ce888
- concept: при одинаковом отклонении от среднего меньший стандартный разброс даёт больший по модулю Z-score
  question: Показания двух датчиков одинаково превышают свои средние значения. У первого датчика стандартное отклонение меньше. У какого показания Z-score больше?
  explanation: Z-score делит отклонение от среднего на стандартное отклонение. При одинаковом числителе меньший знаменатель даёт больший Z-score, поэтому одинаковое абсолютное отклонение необычнее для более стабильного датчика.
  kind: choice
  options:
    - У показания первого датчика
    - У показания второго датчика
    - Z-score обязательно одинаковы
    - Это зависит только от единиц измерения
  correct: 0
