- concept: режим novelty позволяет LOF оценивать новые наблюдения после обучения
  question: Заполни параметр, чтобы обученный LocalOutlierFactor мог оценивать объекты, не входившие в обучающую выборку.
  explanation: При novelty=True LOF можно обучить через fit(X_train), а затем применять score_samples или predict к новым данным. Без этого режима библиотечный LOF предназначен прежде всего для поиска выбросов в обучающем наборе.
  kind: cloze
