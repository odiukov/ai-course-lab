- concept: массивы IQR-границ содержат по одному элементу на каждый признак
  question: Матрица наблюдений содержит семь столбцов признаков. Сколько элементов будет в каждом из массивов нижних и верхних IQR-границ?
  explanation: Квартили и границы вычисляются отдельно для каждого столбца, поэтому длина каждого возвращаемого массива равна числу признаков.
