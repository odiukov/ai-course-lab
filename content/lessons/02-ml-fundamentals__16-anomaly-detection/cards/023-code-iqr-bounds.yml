- concept: перцентили многомерных наблюдений вычисляются отдельно для каждого признака
  question: Матрица содержит наблюдения в строках и признаки в столбцах. Вдоль какого измерения нужно вычислять квартили, чтобы получить отдельные границы для каждого признака?
  explanation: 'В NumPy для этого используют axis=0: перцентили вычисляются вниз по строкам отдельно для каждого столбца.'
  kind: open
  reference: Нужно агрегировать значения по строкам, сохраняя столбцы признаков. Тогда каждый признак получает собственные квартили и границы.
  id: 023-code-iqr-bounds-1
  fingerprint: 23c602b5
- concept: нулевой межквартильный размах заменяется защитным ненулевым значением
  question: Заполни пропуск так, чтобы нулевые элементы массива межквартильных размахов заменялись единицами.
  explanation: Если все значения признака совпадают, его IQR равен 0. Замена такого IQR на 1.0 не позволяет нижней и верхней границам слиться в одну точку.
