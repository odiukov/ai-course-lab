- concept: isolation_scores возвращает по одной оценке на строку с сохранением порядка объектов
  question: Функция получает таблицу X с m строками и ансамбль из k isolation-деревьев. Какой результат она должна вернуть?
  explanation: Деревья дают несколько длин пути для одного объекта, но лес объединяет их в одну итоговую оценку. Поэтому число и порядок оценок совпадают с числом и порядком строк в X.
  kind: choice
  options:
    - Вектор длины m, где позиция каждой оценки соответствует позиции строки в X
    - Вектор длины k, где каждому дереву соответствует одна оценка
    - Матрицу, содержащую отдельную оценку для каждой пары «строка — дерево»
  correct: 0
  id: 037-code-isolation-scores-1
  fingerprint: 6d8e699b
- concept: нормировка оценки использует фактический размер подвыборки дерева
  question: Параметр леса разрешает брать до M объектов на дерево, но весь обучающий набор содержит N строк, причём N меньше M. Какой размер нужно использовать в expected_path_length?
  explanation: Дерево не может получить больше строк, чем есть в наборе. Фактический размер подвыборки равен min(M, N), а при N меньше M это N.
  kind: choice
  options:
    - M — настроенный верхний предел
    - N — фактический размер подвыборки
    - Количество деревьев в ансамбле
  correct: 1
  id: 037-code-isolation-scores-2
  fingerprint: d6c62a69
- concept: оценка леса вычисляется преобразованием средней длины пути, а не усреднением оценок отдельных деревьев
  question: Расположи операции вычисления оценки аномальности одной строки в правильном порядке.
  explanation: Преобразование длины пути в anomaly score нелинейно, поэтому сначала объединяют деревья через среднюю длину пути и лишь затем получают единую оценку. Усреднение уже преобразованных оценок в общем случае даст другой результат.
  kind: order
  items:
    - Вычислить длину пути строки в каждом дереве
    - Усреднить полученные длины путей
    - Нормировать среднюю длину пути через expected_path_length для размера подвыборки
    - Применить экспоненциальное преобразование к нормированной средней длине
  id: 037-code-isolation-scores-3
  fingerprint: f7b6a882
