- concept: базовый случай рекурсивного обхода проверяет лист до обращения к полям внутреннего узла
  question: Почему функция вычисления длины пути должна проверить, является ли текущий узел листом, прежде чем читать его feature и threshold?
  explanation: Поля feature и threshold назначаются внутренним узлам, а лист хранит size. Если сначала попытаться выполнить сравнение по признаку, обход листа завершится ошибкой вместо корректного базового случая.
