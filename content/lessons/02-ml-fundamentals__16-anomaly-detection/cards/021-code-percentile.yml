- concept: дробная позиция перцентиля вычисляется линейной интерполяцией между соседними значениями
  question: Дан список [31, 6, 22, 9, 16]. Перцентиль вычисляется по позиции на отрезке индексов от первого до последнего элемента с линейной интерполяцией. Чему равен 60-й перцентиль?
  explanation: 'После сортировки получаем [6, 9, 16, 22, 31]. Позиция равна 2,4: она находится между 16 и 22, а её дробная часть равна 0,4. Поэтому результат равен 16 + 0,4 × (22 − 16) = 18,4.'
  kind: numeric
  answer: 18.4
  tolerance: 0.01
  id: 021-code-percentile-1
  fingerprint: 32b7bbf8
- concept: сортировка копии позволяет вычислить перцентиль без изменения исходного списка
  question: Почему при реализации функции percentile следует сортировать копию списка, а не сам переданный список?
  explanation: Для вычисления перцентиля значения нужны в упорядоченном виде, но изменение входного списка является нежелательным побочным эффектом. Числовая сортировка копии решает обе задачи.
  kind: open
  reference: Сортировка исходного списка на месте меняет порядок элементов у вызывающего кода. Сортировка копии позволяет определить перцентиль и при этом сохранить исходные данные без изменений.
  id: 021-code-percentile-2
  fingerprint: fdd54a02
- concept: крайние допустимые перцентили совпадают с минимумом и максимумом выборки
  question: Что должна вернуть корректная реализация percentile для нижнего и верхнего края допустимого диапазона p?
  explanation: Позиция нижнего крайнего перцентиля совпадает с первым элементом отсортированного списка, а верхнего — с последним. Поэтому результатами будут минимум и максимум соответственно.
  kind: choice
  options:
    - Медиану для обоих краёв
    - Минимум для нижнего края и максимум для верхнего
    - Максимум для нижнего края и минимум для верхнего
    - Среднее арифметическое для обоих краёв
  correct: 1
