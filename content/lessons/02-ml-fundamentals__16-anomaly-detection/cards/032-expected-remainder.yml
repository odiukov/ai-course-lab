- concept: скорректированная длина пути равна достигнутой глубине плюс c от размера незавершённого листа
  question: Isolation-дерево остановилось на глубине 7 в листе из 6 объектов. Используя поправку ожидаемой длины случайного поиска c(6), чему примерно равна скорректированная длина пути?
  explanation: 'Для шести объектов H(5) ≈ 2,283, поэтому c(6) = 2H(5) − 2·5/6 = 2,9. К достигнутой глубине прибавляют эту поправку: 7 + 2,9 = 9,9. Аналогично, в материале путь глубины 5 для листа из 8 объектов исправлялся до 8,44.'
  kind: numeric
  answer: 9.9
  tolerance: 0.02
  id: 032-expected-remainder-1
  fingerprint: 9bad9fa8
- concept: c(n) задаёт ожидаемую, а не точную длину случайного продолжения поиска среди объектов листа
  question: Почему поправка c(m) для незавершённого листа isolation-дерева не является точным числом оставшихся разбиений?
  explanation: При случайных разбиениях один и тот же лист можно достроить множеством способов. Поэтому c(n) оценивает среднюю оставшуюся длину поиска. Например, для листа из 8 объектов используется ожидаемая поправка около 3,44, а не утверждение, что любое продолжение займёт ровно столько шагов.
  kind: open
  reference: Будущие признаки и пороги выбирались бы случайно, поэтому возможные продолжения дерева дают разные длины пути. Значение c(m) усредняет эти длины по возможным случайным продолжениям поиска среди m оставшихся объектов.
  id: 032-expected-remainder-2
  fingerprint: c6422fb7
