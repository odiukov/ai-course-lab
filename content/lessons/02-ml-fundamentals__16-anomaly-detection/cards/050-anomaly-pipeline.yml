- concept: этапы рабочего конвейера обнаружения аномалий выполняются в определённой последовательности
  question: Расположите этапы эксплуатации детектора аномалий в правильном порядке.
  explanation: Сначала фиксируют и описывают нормальное поведение, затем обучают модель и оценивают новые данные. Порог превращает оценки в тревоги, а результаты их проверки возвращаются в конвейер как обратная связь.
  kind: order
  items:
    - Собрать данные базового нормального периода
    - Построить сырые и производные признаки
    - Обучить детектор на базовом периоде
    - Рассчитать оценки аномальности новых наблюдений
    - Выбрать рабочий порог
    - Передать тревоги на проверку или автоматическую реакцию
    - Сохранить результаты проверки для последующей настройки
