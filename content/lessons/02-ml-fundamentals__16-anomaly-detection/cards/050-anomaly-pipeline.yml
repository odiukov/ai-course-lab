- concept: этапы рабочего конвейера обнаружения аномалий выполняются в определённой последовательности
  question: Расположите этапы эксплуатации детектора аномалий в правильном порядке.
  explanation: Сначала фиксируют и описывают нормальное поведение, затем обучают модель и оценивают новые данные. Порог превращает оценки в тревоги, а результаты их проверки возвращаются в конвейер как обратная связь.
  kind: order
  items:
    - Собрать данные базового нормального периода
    - Построить сырые и производные признаки
    - Обучить детектор на базовом периоде
    - Рассчитать оценки аномальности новых наблюдений
    - Выбрать рабочий порог
    - Передать тревоги на проверку или автоматическую реакцию
    - Сохранить результаты проверки для последующей настройки
  id: 050-anomaly-pipeline-1
  fingerprint: f1bc25ee
- concept: детектор аномалий требует пересмотра при сдвиге распределения нормальных данных
  question: После смены сезона характеристики исправно работающей системы устойчиво изменились, и детектор начал создавать много необоснованных тревог. Какое действие наиболее обоснованно?
  explanation: Распределение нормы со временем может сдвигаться. Подтверждённые результаты проверок помогают заново оценить детектор и понять, какие части конвейера нужно обновить.
  kind: choice
  options:
    - Навсегда отключить тревоги для нового сезона
    - Проверить обратную связь и обновить базовые данные, признаки, модель или порог
    - Считать все новые наблюдения настоящими аномалиями
    - Оставить конвейер неизменным, поскольку обучение уже завершено
  correct: 1
  id: 050-anomaly-pipeline-2
  fingerprint: d3a77dea
