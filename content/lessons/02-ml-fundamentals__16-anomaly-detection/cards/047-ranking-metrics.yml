- concept: Precision@k равна доле истинных аномалий среди объектов с наивысшими оценками аномальности
  question: Детектор поставил в начало списка 75 наиболее подозрительных объектов. Среди них 18 истинных аномалий. Чему равна Precision@75 в процентах?
  explanation: Precision@75 = 18 / 75 = 0,24, то есть 24%. Метрика показывает, какая доля проверенной верхушки списка действительно оказалась аномальной.
  kind: numeric
  answer: 24
  tolerance: 0.01
  id: 047-ranking-metrics-1
  fingerprint: 7132a0db
- concept: параметр k в Precision@k выбирают с учётом доступного ресурса на проверку объектов
  question: Аналитики могут расследовать лишь ограниченное количество срабатываний за смену. Как логичнее выбрать метрику для сравнения детекторов в этих условиях?
  explanation: Precision@k оценивает именно ту часть ранжированного списка, которую команда сможет проверить. Поэтому k связывают с реальной пропускной способностью расследований.
  kind: choice
  options:
    - Использовать Precision@k, где k равно числу доступных расследований
    - Использовать AUPRC и не учитывать размер доступной очереди
    - Использовать accuracy на всём наборе данных
    - Выбрать k по числу признаков модели
  correct: 0
  id: 047-ranking-metrics-2
  fingerprint: 8aa474db
- concept: AUPRC обобщает качество ранжирования по множеству порогов, тогда как Precision@k оценивает одну фиксированную верхушку
  question: Почему два детектора с одинаковой Precision@k могут иметь разную AUPRC? Объясни своими словами.
  explanation: Совпадение качества на одном значении k ничего не говорит об остальной части ранжирования. AUPRC суммирует поведение precision и recall при разных порогах и потому даёт более общий срез качества.
  kind: open
  reference: Precision@k сравнивает модели только на одной фиксированной границе списка. Ниже этой границы истинные аномалии могут быть расположены по-разному. AUPRC учитывает значения precision и recall при изменении порога, поэтому различает качество ранжирования на других размерах отмеченной выборки.
  id: 047-ranking-metrics-3
  fingerprint: 594f8116
