- concept: аномалии в подмножестве признаков проверяют устойчивость детектора к большому числу неинформативных измерений
  question: В многомерном наборе данных аномальные объекты отличаются от нормальных лишь по небольшой части признаков, а остальные признаки выглядят обычно. Какое свойство детектора проверяет такой эксперимент?
  explanation: Если отклонение присутствует лишь в нескольких координатах, остальные измерения могут размыть полезный сигнал. Успешный детектор должен сохранить высокое место настоящих аномалий в ранжировании даже при таком шуме.
  kind: open
  reference: Он проверяет, способен ли детектор выделить аномальный сигнал в подмножестве признаков, несмотря на шум от множества нормальных и неинформативных измерений.
