- concept: размеченные аномалии не охватывают будущие неизвестные типы отклонений
  question: Почему система, безошибочно распознающая все размеченные виды мошенничества, всё равно может пропустить новую мошенническую схему?
  explanation: Увиденные аномалии — лишь неполная выборка возможных нарушений. Будущие атаки, поломки или схемы мошенничества не обязаны повторять известные образцы.
  kind: open
  reference: Классификатор учится на признаках уже наблюдавшихся схем. Новая схема может не иметь этих признаков, поскольку набор размеченных аномалий не представляет все возможные будущие отклонения.
  id: 001-redkie-sobytiya-2
  fingerprint: 5a96c201
