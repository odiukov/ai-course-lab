- concept: применимость LOF зависит от осмысленности расстояний и ухудшается в пространствах высокой размерности
  question: Почему перед применением LOF к данным с большим числом признаков важно проверить, сохраняют ли расстояния между объектами смысл?
  explanation: LOF строит оценку на ближайших соседях, а значит, требует содержательной метрики расстояния. При большом числе признаков близкие и далёкие точки могут стать плохо различимыми; кроме того, поиск соседей остаётся сравнительно медленным.
  kind: open
  reference: LOF сравнивает локальную плотность точки с плотностью её ближайших соседей, поэтому зависит от расстояний. В пространствах высокой размерности расстояния часто становятся слабо различимыми, из-за чего выбор соседей и оценка локальной необычности теряют надёжность.
  id: 044-comparison-2
  fingerprint: 66bfa1d1
