- concept: чистый набор нормальных данных защищает модель от загрязнения аномалиями
  question: Почему обучение на подтверждённо нормальной выборке обычно надёжнее обучения на общей неразмеченной выборке?
  explanation: Неконтролируемый режим зависит от предположения, что отклонений в общей выборке мало. Чистая нормальная выборка снимает эту зависимость и поэтому обычно является более сильной основой для обучения.
  kind: open
  reference: В неразмеченной выборке могут находиться аномалии, которые исказят изучаемое распределение нормы. Подтверждённо нормальная выборка исключает такое загрязнение и даёт более чистый ориентир для оценки новых наблюдений.
