- concept: редкие метки аномалий используются для оценки детектора
  question: Есть большая неразмеченная выборка и небольшой набор подтверждённых аномалий. Как следует разделить их роли при построении и проверке детектора?
  explanation: В режиме слабого контроля редкие метки служат контрольным набором. По ним измеряют, какая доля тревог верна и какая доля известных аномалий обнаружена.
  kind: open
  reference: Детектор обучают без учителя на основной выборке, а подтверждённые аномалии оставляют для независимой проверки и расчёта precision и recall.
