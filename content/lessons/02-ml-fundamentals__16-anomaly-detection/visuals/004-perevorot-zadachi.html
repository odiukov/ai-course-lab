<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>От обычного поведения к тревоге</title>
<style>
:root{
  color-scheme:light dark;
  --page:#f4f7fb;
  --surface:#ffffff;
  --panel:#f8fafc;
  --ink:#172033;
  --muted:#5d687a;
  --line:#c9d3e2;
  --blue:#2878d0;
  --blue-soft:#e2effc;
  --blue-deep:#15569c;
  --red:#d9303e;
  --red-soft:#fde8ea;
  --white:#ffffff
}
@media (prefers-color-scheme:dark){
  :root{
    --page:#111722;
    --surface:#18202d;
    --panel:#1d2735;
    --ink:#edf3fb;
    --muted:#aeb9c9;
    --line:#435166;
    --blue:#6db2ff;
    --blue-soft:#203c59;
    --blue-deep:#9acbff;
    --red:#ff6570;
    --red-soft:#4b252b;
    --white:#101722
  }
}
*{box-sizing:border-box}
html,body{background:var(--page);color:var(--ink)}
body{margin:unset;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
figure{
  margin:unset;
  background:var(--surface);
  border:1px solid var(--line);
  overflow:hidden
}
h1{
  margin:unset;
  font-size:22px;
  line-height:normal;
  font-weight:750;
  color:var(--ink)
}
svg{
  display:block;
  width:100%;
  height:auto;
  max-height:520px;
  background:var(--surface)
}
.panel{
  fill:var(--panel);
  stroke:var(--line);
  stroke-width:1.5px
}
.panel-title{
  fill:var(--ink);
  font-size:18px;
  font-weight:700
}
.normal-area{
  fill:var(--blue-soft);
  stroke:var(--blue);
  stroke-width:2px
}
.normal-dot{
  fill:var(--blue);
  stroke:var(--surface);
  stroke-width:2px
}
.normal-label{
  fill:var(--blue-deep);
  font-size:15px;
  font-weight:650
}
.muted-label{
  fill:var(--muted);
  font-size:14px
}
.route{
  fill:none;
  stroke:var(--blue);
  stroke-width:3px
}
.route-head{fill:var(--blue)}
.operation{
  fill:var(--surface);
  stroke:var(--blue);
  stroke-width:3px
}
.operation-core{fill:var(--blue)}
.city{
  fill:var(--ink);
  font-size:17px;
  font-weight:700
}
.time{
  fill:var(--muted);
  font-size:16px;
  font-weight:650
}
.flag-pole{
  stroke:var(--red);
  stroke-width:3px
}
.flag{fill:var(--red)}
.alert-ring{
  fill:var(--red-soft);
  stroke:var(--red);
  stroke-width:2px
}
.alert-core{fill:var(--red)}
.alert-text{
  fill:var(--red);
  font-size:15px;
  font-weight:750
}
.callout{
  fill:none;
  stroke:var(--red);
  stroke-width:2px
}
.separator{
  stroke:var(--line);
  stroke-width:2px
}
.separator-head{fill:var(--line)}
.legend-text{
  fill:var(--muted);
  font-size:14px
}
.fallback{
  color:var(--ink);
  font-size:16px
}
.fallback[hidden]{display:none}
line,path,polygon,rect,ellipse,circle{
  vector-effect:non-scaling-stroke
}
</style>
</head>
<body>
<figure aria-labelledby="heading">
  <h1 id="heading">&nbsp;От обычного поведения к тревоге</h1>
  <svg id="diagram" viewBox="0 0 960 340" width="960" height="340"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="svg-title svg-desc">
    <title id="svg-title">От обычного поведения к тревоге</title>
    <desc id="svg-desc">Слева показано множество привычных транзакций. Справа одна карта использована в Нью-Йорке в 14:00 и в Токио в 14:05. Вторая операция отмечена красным флагом.</desc>
    <g id="layer"></g>
    <text id="fallback" class="fallback" hidden>
      Схема должна показать обычные транзакции и отклонение: одна карта — Нью-Йорк в 14:00, затем Токио в 14:05.
    </text>
  </svg>
  <noscript>Схема: обычные транзакции слева; справа одна карта использована в Нью-Йорке в 14:00 и в Токио в 14:05, поэтому поднят красный флаг.</noscript>
</figure>

<script>
const data=[
  {kind:"rect",class:"panel",x:24,y:18,w:438,h:302,rx:16},
  {kind:"rect",class:"panel",x:498,y:18,w:438,h:302,rx:16},

  {kind:"text",class:"panel-title",text:"Обычные транзакции",x:243,y:294,dx:0,dy:0,anchor:"middle"},
  {kind:"text",class:"panel-title",text:"Одна карта, две операции",x:717,y:294,dx:0,dy:0,anchor:"middle"},

  {kind:"ellipse",class:"normal-area",x:243,y:177,rx:157,ry:83},
  {kind:"dots",class:"normal-dot",r:7,points:[
    [128,168],[143,194],[153,145],[164,178],[174,216],[180,122],
    [187,155],[194,191],[202,231],[209,137],[217,174],[224,207],
    [232,151],[240,187],[248,224],[256,132],[264,164],[271,201],
    [279,146],[287,181],[294,216],[302,126],[310,157],[318,194],
    [326,231],[334,143],[342,176],[351,207],[363,158],[374,190]
  ]},
  {kind:"text",class:"normal-label",text:"плотная группа привычного поведения",x:243,y:76,dx:0,dy:0,anchor:"middle"},
  {kind:"line",class:"separator",x1:455,y1:169,x2:486,y2:169},
  {kind:"polygon",class:"separator-head",points:[[486,169],[474,177],[474,161]]},

  {kind:"line",class:"route",x1:626,y1:170,x2:824,y2:170},
  {kind:"polygon",class:"route-head",points:[[824,170],[808,180],[808,160]]},
  {kind:"text",class:"normal-label",text:"та же карта",x:660,y:170,dx:0,dy:-15,anchor:"start"},

  {kind:"circle",class:"operation",x:606,y:170,r:20},
  {kind:"circle",class:"operation-core",x:606,y:170,r:7},
  {kind:"text",class:"city",text:"Нью-Йорк",x:606,y:170,dx:0,dy:-45,anchor:"middle"},
  {kind:"text",class:"time",text:"14:00",x:606,y:170,dx:0,dy:-23,anchor:"middle"},

  {kind:"circle",class:"alert-ring",x:848,y:170,r:23},
  {kind:"circle",class:"alert-core",x:848,y:170,r:8},
  {kind:"text",class:"city",text:"Токио",x:848,y:170,dx:0,dy:46,anchor:"middle"},
  {kind:"text",class:"time",text:"14:05",x:848,y:170,dx:0,dy:68,anchor:"middle"},

  {kind:"line",class:"flag-pole",x1:848,y1:190,x2:848,y2:264},
  {kind:"polygon",class:"flag",points:[[848,264],[908,247],[848,230]]},
  {kind:"text",class:"alert-text",text:"ОТКЛОНЕНИЕ",x:914,y:277,dx:0,dy:0,anchor:"end"},

  {kind:"polyline",class:"callout",points:[[750,83],[792,106],[835,151]]},
  {kind:"text",class:"alert-text",text:"оценка выше порога",x:742,y:80,dx:0,dy:0,anchor:"end"},
  {kind:"text",class:"muted-label",text:"система поднимает красный флаг",x:742,y:59,dx:0,dy:0,anchor:"end"},

  {kind:"circle",class:"normal-dot",x:550,y:37,r:7},
  {kind:"text",class:"legend-text",text:"обычная операция",x:550,y:37,dx:16,dy:5,anchor:"start"},
  {kind:"polygon",class:"flag",points:[[748,47],[781,38],[748,29]]},
  {kind:"line",class:"flag-pole",x1:748,y1:25,x2:748,y2:49},
  {kind:"text",class:"legend-text",text:"отклонение после порога",x:790,y:37,dx:0,dy:5,anchor:"start"}
];
const origin={x:0,y:334};
const scale={x:1,y:-1};
const sx=x=>origin.x+x*scale.x;
const sy=y=>origin.y+y*scale.y;

try{
  const svg=document.getElementById("diagram");
  const layer=document.getElementById("layer");
  const fallback=document.getElementById("fallback");
  const ns="http://www.w3.org/2000/svg";

  const make=(name,className)=>{
    const node=document.createElementNS(ns,name);
    if(className) node.setAttribute("class",className);
    return node;
  };
  const lengthX=(value)=>Math.abs(sx(value)-sx(0));
  const lengthY=(value)=>Math.abs(sy(value)-sy(0));
  const add=(node)=>layer.appendChild(node);

  for(const item of data){
    if(item.kind==="rect"){
      const node=make("rect",item.class);
      node.setAttribute("x",sx(item.x));
      node.setAttribute("y",sy(item.y+item.h));
      node.setAttribute("width",Math.abs(sx(item.x+item.w)-sx(item.x)));
      node.setAttribute("height",Math.abs(sy(item.y+item.h)-sy(item.y)));
      node.setAttribute("rx",lengthX(item.rx));
      add(node);
    }

    if(item.kind==="ellipse"){
      const node=make("ellipse",item.class);
      node.setAttribute("cx",sx(item.x));
      node.setAttribute("cy",sy(item.y));
      node.setAttribute("rx",lengthX(item.rx));
      node.setAttribute("ry",lengthY(item.ry));
      add(node);
    }

    if(item.kind==="circle"){
      const node=make("circle",item.class);
      node.setAttribute("cx",sx(item.x));
      node.setAttribute("cy",sy(item.y));
      node.setAttribute("r",lengthX(item.r));
      add(node);
    }

    if(item.kind==="dots"){
      for(const [x,y] of item.points){
        const node=make("circle",item.class);
        node.setAttribute("cx",sx(x));
        node.setAttribute("cy",sy(y));
        node.setAttribute("r",lengthX(item.r));
        add(node);
      }
    }

    if(item.kind==="line"){
      const node=make("line",item.class);
      node.setAttribute("x1",sx(item.x1));
      node.setAttribute("y1",sy(item.y1));
      node.setAttribute("x2",sx(item.x2));
      node.setAttribute("y2",sy(item.y2));
      add(node);
    }

    if(item.kind==="polygon" || item.kind==="polyline"){
      const node=make(item.kind,item.class);
      node.setAttribute("points",item.points.map(([x,y])=>`${sx(x)},${sy(y)}`).join(" "));
      add(node);
    }

    if(item.kind==="text"){
      const node=make("text",item.class);
      node.setAttribute("x",sx(item.x)+item.dx);
      node.setAttribute("y",sy(item.y)+item.dy);
      node.setAttribute("text-anchor",item.anchor);
      node.textContent=item.text;
      add(node);
    }
  }

  fallback.hidden=true;
}catch(error){
  const layer=document.getElementById("layer");
  const fallback=document.getElementById("fallback");
  if(layer) layer.remove();
  if(fallback){
    fallback.hidden=false;
    fallback.setAttribute("x",sx(480));
    fallback.setAttribute("y",sy(170));
    fallback.setAttribute("text-anchor","middle");
  }
}
</script>
</body>
</html>
