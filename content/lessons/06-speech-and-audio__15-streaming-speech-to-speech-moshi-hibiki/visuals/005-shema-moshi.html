<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Схема Moshi: два потока и монолог</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1b1f24; --muted:#5c6672;
    --user:#1f6f8b; --moshi:#8a4b12; --text:#5a2d82; --box:#eef2f6; --boxln:#33404d;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12161b; --fg:#e6ebf1; --muted:#9aa7b4;
      --user:#67c4e0; --moshi:#e6a45c; --text:#c39bea; --box:#1e2630; --boxln:#c3ccd6;
    }
  }
  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{background:var(--bg);padding:8px 10px 10px;box-sizing:border-box;}
  h2{font-size:15px;margin:0 0 6px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;}
  .lbl{font-size:11px;fill:var(--fg);}
  .sub{font-size:10px;fill:var(--muted);}
  .fail{font-size:13px;line-height:1.5;color:var(--fg);}
</style>
</head>
<body>
<div class="wrap">
  <h2>Moshi: два аудиопотока и внутренний монолог в одном блоке</h2>
  <div id="slot"></div>
</div>
<script>
(function(){
  var slot=document.getElementById('slot');
  try{
    // ---- данные схемы (координатная сетка) ----
    var D={
      lanes:[
        {y:6, key:'user',  color:'var(--user)',  name:'Аудио пользователя',
         tag:'Mimi · 12.5 Гц × 8 кодбуков', inOnly:true},
        {y:4, key:'text',  color:'var(--text)',  name:'Текст: внутренний монолог',
         tag:'1 текстовый токен за шаг', inOnly:false},
        {y:2, key:'moshi', color:'var(--moshi)', name:'Аудио Moshi',
         tag:'Mimi · 12.5 Гц × 8 кодбуков', inOnly:false}
      ],
      xIn:0, xBoxL:7, xBoxR:14, xOut:21,
      box:{yTop:7, yBot:1, title:'Temporal Transformer 7B', sub:'шаг 80 мс'},
      depth:{x:17, y:2, w:3.6, h:1.4, title:'Depth Transformer', sub:'8 кодбуков по очереди'},
      loop:{y:0.2}
    };
    var origin={x:118, y:250}, scale={x:24, y:26};
    // ---- единственный перевод координат ----
    function sx(x){ return origin.x + x*scale.x; }
    function sy(y){ return origin.y - y*scale.y; }

    var PAD=6, LW=1.6, HEAD=7;
    var NS='http://www.w3.org/2000/svg';
    function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}
    function line(x1,y1,x2,y2,c,dash){
      return el('line',{x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),
        stroke:c,'stroke-width':LW,'stroke-linecap':'round',
        'stroke-dasharray':dash||'none'});
    }
    function arrowHead(x,y,c){ // наконечник вправо, вершины через sx/sy
      var d=HEAD/scale.x, h=HEAD/scale.y*0.62;
      return el('polygon',{points:[
        sx(x)+','+sy(y), sx(x-d)+','+sy(y+h), sx(x-d)+','+sy(y-h)].join(' '),fill:c});
    }
    function txt(x,y,dx,dy,s,cls,anchor,color){
      var t=el('text',{x:sx(x)+dx,y:sy(y)+dy,'text-anchor':anchor,class:cls});
      if(color)t.setAttribute('fill',color);
      t.appendChild(document.createTextNode(s));
      return t;
    }

    var svg=el('svg',{viewBox:'0 0 760 300',preserveAspectRatio:'xMidYMid meet',
      role:'img','aria-label':'Три дорожки проходят через Temporal Transformer 7B'});
    var g=el('g',{});svg.appendChild(g);

    // корпус трансформера
    g.appendChild(el('rect',{x:sx(D.xBoxL),y:sy(D.box.yTop),
      width:sx(D.xBoxR)-sx(D.xBoxL),height:sy(D.box.yBot)-sy(D.box.yTop),
      rx:8,fill:'var(--box)',stroke:'var(--boxln)','stroke-width':LW}));
    g.appendChild(txt((D.xBoxL+D.xBoxR)/2,D.box.yTop,0,-PAD*1.6,D.box.title,'lbl','middle'));
    g.appendChild(txt((D.xBoxL+D.xBoxR)/2,D.box.yBot,0,PAD*2.6,D.box.sub,'sub','middle'));

    // depth transformer
    var dp=D.depth;
    g.appendChild(el('rect',{x:sx(dp.x),y:sy(dp.y+dp.h/2),
      width:sx(dp.x+dp.w)-sx(dp.x),height:sy(dp.y-dp.h/2)-sy(dp.y+dp.h/2),
      rx:6,fill:'none',stroke:'var(--moshi)','stroke-width':LW,'stroke-dasharray':'5 4'}));
    g.appendChild(txt(dp.x+dp.w/2,dp.y,0,-2,dp.title,'lbl','middle','var(--moshi)'));
    g.appendChild(txt(dp.x+dp.w/2,dp.y,0,12,dp.sub,'sub','middle'));

    // дорожки
    D.lanes.forEach(function(L){
      // вход
      g.appendChild(line(D.xIn,L.y,D.xBoxL-0.3,L.y,L.color));
      g.appendChild(arrowHead(D.xBoxL,L.y,L.color));
      g.appendChild(txt(D.xIn,L.y,0,-PAD*1.4,L.name,'lbl','start',L.color));
      g.appendChild(txt(D.xIn,L.y,0,PAD*2.2,L.tag,'sub','start'));
      // выход
      if(L.key==='moshi'){
        g.appendChild(line(D.xBoxR,L.y,dp.x-0.3,L.y,L.color));
        g.appendChild(arrowHead(dp.x,L.y,L.color));
        g.appendChild(line(dp.x+dp.w,L.y,D.xOut-0.3,L.y,L.color));
        g.appendChild(arrowHead(D.xOut,L.y,L.color));
        g.appendChild(txt(D.xOut,L.y,-PAD,PAD*3.2,'8 кодбуков','sub','end'));
      }else if(L.key==='text'){
        g.appendChild(line(D.xBoxR,L.y,D.xOut-0.3,L.y,L.color));
        g.appendChild(arrowHead(D.xOut,L.y,L.color));
        g.appendChild(txt(D.xBoxR,L.y,PAD,-PAD*1.4,'текстовый токен — план','lbl','start',L.color));
        g.appendChild(txt(D.xBoxR,L.y,PAD,PAD*2.2,'идёт чуть впереди звука','sub','start'));
      }else{
        g.appendChild(txt(D.xBoxL,L.y,-PAD,PAD*2.4,'слышен и во время ответа','sub','end'));
      }
    });

    // обратная связь: своё аудио возвращается вторым входом
    var ly=D.loop.y;
    g.appendChild(line(D.xOut,D.lanes[2].y,D.xOut,ly,'var(--moshi)','4 4'));
    g.appendChild(line(D.xOut,ly,D.xIn+1,ly,'var(--moshi)','4 4'));
    g.appendChild(line(D.xIn+1,ly,D.xIn+1,D.lanes[2].y-0.35,'var(--moshi)','4 4'));
    g.appendChild(arrowHead(D.xIn+1,D.lanes[2].y,'var(--moshi)'));
    g.appendChild(txt((D.xIn+D.xOut)/2,ly,0,PAD*2.4,
      'собственное аудио Moshi возвращается вторым входным потоком','sub','middle'));

    slot.appendChild(svg);
  }catch(e){
    slot.innerHTML='<p class="fail">Схема должна показывать: два потока Mimi '+
      '(аудио пользователя и собственное аудио Moshi, по 8 кодбуков на 12.5 Гц) '+
      'входят в Temporal Transformer 7B. На каждом шаге 80 мс из него выходят '+
      'текстовый токен внутреннего монолога и 8 кодбуков аудио — последовательно, '+
      'через маленький depth transformer. Все три дорожки идут параллельно '+
      'через один блок, без передачи из рук в руки.</p>';
  }
})();
</script>
</body>
</html>
