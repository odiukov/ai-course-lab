<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Задержки моделей 2026 на одной оси</title>
<style>
  :root{
    --bg:#fbfbf9; --fg:#1e2229; --mut:#6b7280;
    --axis:#3a4048; --open:#1f7a5a; --closed:#8a5a12; --other:#7a4a8a; --grid:#d8d8d2;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171c; --fg:#e8eaee; --mut:#9aa3af;
      --axis:#b6bec9; --open:#4fd1a5; --closed:#e0b25a; --other:#c79ade; --grid:#2b3038;
    }
  }
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:12px}
  h2{font-size:15px;margin:0 0 6px;font-weight:600}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg)}
  .fallback{padding:10px;border:1px solid var(--grid);border-radius:6px;color:var(--fg)}
</style>
<div class="wrap">
  <h2>Задержки моделей 2026 на одной оси: сравнимо только внутри одной дистанции</h2>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    // ---- данные схемы ----
    var MODELS = [
      {id:'m',  ms:200, label:'Moshi 200 мс',            sub:'открытая, L4 · CC-BY 4.0',   kind:'open',   side:'up'},
      {id:'s',  ms:200, label:'Sesame CSM-1B 200 мс',    sub:'TTFA · Apache-2.0',          kind:'other',  side:'down'},
      {id:'g4', ms:300, label:'GPT-4o Realtime ~300 мс', sub:'закрытая · commercial',      kind:'closed', side:'up'},
      {id:'gm', ms:350, label:'Gemini 2.5 Live ~350 мс', sub:'закрытая · commercial',      kind:'closed', side:'down'}
    ];
    var TICKS = [0,100,200,300,400];
    var W = 900, H = 420;              // размеры холста
    var PAD = 6, LINE = 2, FS = 13, FS_S = 11;   // отступ подписи, толщина, шрифты

    // ---- одна пара функций перевода ----
    var origin = {x:170, y:250};       // sx(0), sy(0)
    var scale  = {x:1.55, y:1};        // px на 1 мс / px на 1 единицу вертикали
    function sx(x){ return origin.x + x*scale.x; }
    function sy(y){ return origin.y - y*scale.y; }

    var NS='http://www.w3.org/2000/svg';
    function el(n,a){ var e=document.createElementNS(NS,n);
      for(var k in a) e.setAttribute(k,a[k]); return e; }
    function txt(x,y,s,a,cls,fs){
      var t=el('text',{x:x,y:y,'text-anchor':a,'font-size':fs||FS,fill:'currentColor'});
      t.setAttribute('class',cls||''); t.textContent=s; return t;
    }

    var svg = el('svg',{viewBox:'0 0 '+W+' '+H,preserveAspectRatio:'xMidYMid meet',
                        role:'img','aria-label':'Ось задержек моделей 2026'});
    svg.appendChild(el('rect',{x:0,y:0,width:W,height:H,fill:'var(--bg)'}));

    // ---- ось ----
    svg.appendChild(el('line',{x1:sx(0),y1:sy(0),x2:sx(420),y2:sy(0),
      stroke:'var(--axis)','stroke-width':LINE}));
    svg.appendChild(el('polygon',{points:
      sx(420)+','+sy(0)+' '+sx(408)+','+sy(6)+' '+sx(408)+','+sy(-6),
      fill:'var(--axis)'}));
    var ax = txt(sx(408), sy(0)+PAD*5, 'мс', 'end', null, FS);
    ax.setAttribute('fill','var(--mut)'); svg.appendChild(ax);

    TICKS.forEach(function(v){
      svg.appendChild(el('line',{x1:sx(v),y1:sy(0),x2:sx(v),y2:sy(-7),
        stroke:'var(--axis)','stroke-width':LINE}));
      var t = txt(sx(v), sy(-7)-PAD+FS_S+2, String(v), 'middle', null, FS_S);
      t.setAttribute('fill','var(--mut)'); svg.appendChild(t);
    });

    // ---- зона честного сравнения: 200 ↔ 300 ----
    svg.appendChild(el('rect',{x:sx(200),y:sy(52),width:sx(300)-sx(200),
      height:sy(0)-sy(52),fill:'var(--open)','fill-opacity':0.10}));
    var zt = txt((sx(200)+sx(300))/2, sy(52)-PAD, 'одна дистанция: 200 против 300', 'middle', null, FS_S);
    zt.setAttribute('fill','var(--open)'); svg.appendChild(zt);

    // ---- точки моделей ----
    var COLOR = {open:'var(--open)', closed:'var(--closed)', other:'var(--other)'};
    MODELS.forEach(function(m){
      var up = m.side === 'up';
      var stem = up ? 108 : -96;                  // высота выноски в единицах данных
      var c = COLOR[m.kind];
      svg.appendChild(el('line',{x1:sx(m.ms),y1:sy(0),x2:sx(m.ms),y2:sy(stem),
        stroke:c,'stroke-width':LINE,'stroke-dasharray':'4 4'}));
      svg.appendChild(el('circle',{cx:sx(m.ms),cy:sy(0),r:5,fill:c}));

      var anchor = 'middle', tx = sx(m.ms);
      if(m.id==='m'){ anchor='end'; tx = sx(m.ms)+PAD*2; }
      if(m.id==='s'){ anchor='start'; tx = sx(m.ms)-PAD*2; }

      var ly = up ? sy(stem)-PAD : sy(stem)+PAD+FS;
      var l1 = txt(tx, ly, m.label, anchor, null, FS);
      l1.setAttribute('fill',c); l1.setAttribute('font-weight','600');
      svg.appendChild(l1);
      var l2 = txt(tx, up ? ly+FS_S+3 : ly+FS_S+3, m.sub, anchor, null, FS_S);
      l2.setAttribute('fill','var(--mut)'); svg.appendChild(l2);
    });

    // ---- разметка «что именно померили» ----
    var NOTES = [
      {ms:200, y:150,  side:'up',   text:'кадр + акустика, без конвейера', color:'var(--open)',  anchor:'end',   at:200},
      {ms:300, y:150,  side:'up',   text:'пол из суммы звеньев конвейера', color:'var(--closed)',anchor:'start', at:300},
      {ms:200, y:-140, side:'down', text:'время до первого звука, не диалог', color:'var(--other)', anchor:'start', at:200}
    ];
    NOTES.forEach(function(n){
      var x = sx(n.at) + (n.anchor==='end' ? -PAD*2 : PAD*2);
      var t = txt(x, sy(n.y), n.text, n.anchor, null, FS_S);
      t.setAttribute('fill',n.color); svg.appendChild(t);
    });

    // ---- Hibiki: не на этой оси ----
    var hy = -140;
    svg.appendChild(el('line',{x1:sx(-150),y1:sy(hy),x2:sx(-30),y2:sy(hy),
      stroke:'var(--other)','stroke-width':LINE,'stroke-dasharray':'3 5'}));
    var h1 = txt(sx(-150), sy(hy)-PAD, 'Hibiki: 12,5 Гц', 'start', null, FS);
    h1.setAttribute('fill','var(--other)'); h1.setAttribute('font-weight','600');
    svg.appendChild(h1);
    var h2 = txt(sx(-150), sy(hy)+PAD+FS_S, 'этой оси не принадлежит', 'start', null, FS_S);
    h2.setAttribute('fill','var(--mut)'); svg.appendChild(h2);

    // ---- цена открытых 200 мс ----
    var f1 = txt(sx(-150), sy(120), 'лицензии подписаны:', 'start', null, FS_S);
    f1.setAttribute('fill','var(--mut)'); svg.appendChild(f1);
    var f2 = txt(sx(-150), sy(120)-FS_S-3, 'CC-BY 4.0 — но tool calling нет', 'start', null, FS_S);
    f2.setAttribute('fill','var(--open)'); svg.appendChild(f2);

    host.appendChild(svg);
  }catch(e){
    host.innerHTML = '<div class="fallback">Схема должна показывать одну горизонтальную ось задержки в мс: '+
      'Moshi 200 мс (открытая, L4, CC-BY 4.0), Sesame CSM-1B 200 мс TTFA, GPT-4o Realtime ~300 мс, '+
      'Gemini 2.5 Live ~350 мс. Числа Moshi и GPT-4o меряют одно и то же (задержка ответа в диалоге) — '+
      'сравнение честное. 200 мс Sesame — это TTFA, другая величина. Hibiki на этой оси не стоит: у неё 12,5 Гц. '+
      'У Moshi нет tool calling.</div>';
  }
})();
</script>
</html>
