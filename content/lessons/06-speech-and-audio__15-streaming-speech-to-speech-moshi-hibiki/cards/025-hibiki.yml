- concept: отказ Hibiki-Zero от пословного выравнивания с оптимизацией задержки через GRPO
  question: Объясни своими словами, как Hibiki-Zero может учиться потоковому переводу без обучающих данных, выровненных по словам.
  explanation: Вместо дорогой разметки соответствий между отдельными словами Hibiki-Zero использует пары на уровне предложений. GRPO затем оптимизирует момент выдачи перевода, вознаграждая низкую задержку.
  kind: open
  reference: Модели достаточно пар предложений с одинаковым смыслом на исходном и целевом языках. Временное размещение перевода она осваивает сама, а обучение с подкреплением GRPO поощряет решения с меньшей задержкой.
  id: 025-hibiki-2
  fingerprint: c8843b34
