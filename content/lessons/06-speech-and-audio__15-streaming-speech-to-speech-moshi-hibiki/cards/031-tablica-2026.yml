- concept: задержка, условия развёртывания и функциональные возможности являются независимыми критериями выбора модели
  question: Самостоятельно развёртываемая речевая модель показывает меньшую задержку, чем коммерческий API, но не умеет вызывать внешние инструменты. Продукту необходимо во время разговора получать данные из календаря. Какой вывод обоснован?
  explanation: Moshi выигрывает у GPT-4o Realtime по опубликованной задержке и допускает самостоятельное развёртывание, но не поддерживает tool calling. При выборе системы нужно отдельно проверять производительность, лицензию и необходимые продуктовые функции.
  kind: choice
  options:
    - Модель с меньшей задержкой автоматически лучше подходит продукту
    - Открытая лицензия гарантирует поддержку внешних инструментов
    - Коммерческий API обязательно имеет меньшую задержку
