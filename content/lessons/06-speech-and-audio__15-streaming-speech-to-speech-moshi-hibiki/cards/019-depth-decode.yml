- concept: позиции токенов в результате depth-декодирования сохраняют порядок кодбуков
  question: В каком порядке функция depth_decode должна возвращать сгенерированные токены кодеков?
  explanation: Каждая позиция выходного списка соответствует определённому кодбуку. Сортировка или разворот токенов нарушат это соответствие, и декодер кодека получит токены не для тех кодбуков.
  kind: choice
  options:
    - В порядке возрастания идентификаторов токенов
    - В порядке генерации, совпадающем с порядком кодбуков
    - В обратном порядке относительно генерации
  correct: 1
  id: 019-depth-decode-1
  fingerprint: cd7c8bb9
- concept: пустое количество кодбуков является корректным граничным случаем depth-декодирования
  question: Что должна сделать depth_decode, если параметр n_codebooks указывает, что генерировать нечего, и почему predictor при этом вызывать не следует?
  explanation: Пустой запрос не является ошибкой. Цикл генерации не выполняет ни одной итерации, поэтому результат остаётся пустым, а predictor не получает фиктивных вызовов.
  kind: open
  reference: 'Функция должна вернуть пустой список, не вызывая predictor: выход содержит по одному токену на запрошенный кодбук, а при отсутствии кодбуков выполнять предсказание не для чего.'
  id: 019-depth-decode-2
  fingerprint: dfc96621
