- concept: естественность синтезированного голоса и дуплексность речевой системы являются независимыми характеристиками
  question: Речевая система получила более высокую оценку за естественность тембра, но в испытании не проверяли режим обмена аудиопотоками. Можно ли на этом основании считать её более подходящей для диалога с перебиваниями? Объясни своими словами.
  explanation: CSM может звучать естественнее Moshi, оставаясь однонаправленным TTS. Качество синтеза и поддержка полнодуплексного общения нужно оценивать отдельно.
  kind: open
  reference: Нет. Естественность тембра характеризует качество синтезированной речи, а возможность перебиваний — режим взаимодействия системы с входящим и исходящим аудио. Высокое качество голоса не доказывает наличие полного дуплекса.
