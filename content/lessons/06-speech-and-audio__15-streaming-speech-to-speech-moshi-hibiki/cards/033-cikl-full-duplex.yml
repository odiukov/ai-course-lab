- concept: разные направления двустороннего протокола могут иметь разные схемы сообщений
  question: Клиент отправляет серверу сериализованные аудиотокены с микрофона, а в ответ получает аудиотокены вместе с текстовым токеном. Какой вывод верен?
  explanation: Двусторонний транспорт не требует одинаковой полезной нагрузки в обоих направлениях. Восходящий поток может содержать только аудиотокены, а нисходящий — сгенерированные аудиотокены и отдельный текстовый результат.
  kind: choice
  options:
    - Схемы сообщений обязаны совпадать, поэтому дополнительный текстовый токен означает ошибку протокола
    - Для каждого направления может быть задан собственный формат сообщения, и получатель должен разбирать соответствующую схему
    - Текстовый токен нужно передать в аудиодекодер вместе с токенами Mimi
    - Перед каждой отправкой клиент обязан самостоятельно создать текстовый токен
