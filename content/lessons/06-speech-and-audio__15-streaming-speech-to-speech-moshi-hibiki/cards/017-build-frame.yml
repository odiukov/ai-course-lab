- concept: явное представление отсутствующего собственного аудио в начальном кадре
  question: В первом такте full-duplex codec LM ещё нет ранее сгенерированного аудио модели. Чем следует заполнить предназначенные для него позиции фиксированного кадра?
  explanation: Специальный токен сохраняет фиксированную форму кадра и остаётся допустимым идентификатором словаря. Пустой список меняет схему, а None нельзя передать в обычный слой эмбеддингов как индекс токена.
  kind: choice
  options:
    - Заранее определённым специальным токеном тишины или протокольной заглушкой, допустимым для модели
    - Пустым списком, сократив кадр
    - Значениями None, чтобы модель сама распознала отсутствие аудио
