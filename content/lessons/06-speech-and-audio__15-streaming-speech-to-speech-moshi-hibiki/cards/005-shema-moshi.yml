- concept: кодбуки одного аудиокадра предсказываются авторегрессионно с зависимостью последующих кодбуков от предыдущих
  question: Расположи действия depth transformer в порядке генерации кодбуков одного аудиокадра.
  explanation: Depth transformer последовательно проходит по кодбукам внутри кадра. Каждый следующий кодбук уточняет звук и предсказывается с учётом уже сгенерированных кодбуков этого кадра.
  kind: order
  items:
    - Предсказать кодбук, задающий наиболее грубое представление звука
    - Добавить предсказанный кодбук в контекст внутри текущего кадра
    - Предсказать следующий уточняющий кодбук с учётом уже полученного контекста
