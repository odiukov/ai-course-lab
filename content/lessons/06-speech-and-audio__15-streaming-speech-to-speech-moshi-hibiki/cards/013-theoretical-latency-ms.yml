- concept: акустическая задержка является независимым параметром модели и не определяется частотой кадров кодека
  question: Почему функция оценки теоретической задержки speech-to-speech-системы должна получать акустическую задержку отдельным аргументом?
  explanation: Частота кадров определяет время ожидания полного кадра, а акустическая задержка характеризует отдельную часть генерации и выдачи звука. Поэтому в theoretical_latency_ms она должна приходить независимо, а не выводиться из частоты.
  kind: choice
  options:
    - Она зависит от работы модели и тракта вывода звука, поэтому её нельзя однозначно вычислить из частоты кадров кодека
    - Она всегда совпадает с длительностью кадра, но отдельный аргумент упрощает тестирование
    - Она нужна только для проверки допустимости частоты кадров
    - Она полностью определяется числом кодбуков в аудиокадре
  correct: 0
  id: 013-theoretical-latency-ms-1
  fingerprint: 2105d4ae
- concept: частота кадров должна быть положительной для корректного вычисления временной задержки
  question: Как должна вести себя функция theoretical_latency_ms, если ей передали неположительную частоту кадров кодека?
  explanation: Неположительная частота не описывает физически допустимый поток кадров и делает вычисление их длительности некорректным. Такое значение нужно отклонить явно, а не маскировать под допустимый результат.
  kind: choice
  options:
    - Сообщить об ошибке входных данных
    - Использовать модуль переданной частоты
    - Считать длительность кадра нулевой
    - Вернуть только акустическую задержку
  correct: 0
