  fingerprint: 969200cb
- concept: специализированный CPU-синтезатор позволяет не запускать полную диалоговую модель
  question: Сервис должен только озвучивать готовый текст на сервере без GPU. Какой компонент стека Kyutai лучше соответствует этой задаче?
  explanation: Pocket TTS предназначен для синтеза речи и может работать на CPU. Moshi решает более широкую задачу полнодуплексного диалога, STT распознаёт речь, а Hibiki переводит её.
  kind: choice
  options:
    - Moshi
    - Hibiki-Zero
    - Kyutai Pocket TTS
    - Kyutai STT
  correct: 2
  id: 027-stek-kyutai-2
  fingerprint: 1bf3ca9d
- concept: модульный конвейер Unmute позволяет независимо заменять текстовую модель
  question: Объясни своими словами, почему в конвейере Unmute проще заменить языковую модель, чем в интегрированной speech-to-speech-модели Moshi.
  explanation: Явная граница между STT и TTS делает текстовую модель сменным модулем. Такая архитектура гибче, хотя отдельные потоковые стадии всё равно вносят собственные задержки.
  kind: open
  reference: Unmute разделяет распознавание, обработку текста и синтез речи на компоненты с явным текстовым интерфейсом. Поэтому между STT и TTS можно подключить другую языковую модель, не переобучая весь речевой тракт. В Moshi диалоговая логика и генерация речи объединены внутри одной модели.
  id: 027-stek-kyutai-3
  fingerprint: 4526c44c
