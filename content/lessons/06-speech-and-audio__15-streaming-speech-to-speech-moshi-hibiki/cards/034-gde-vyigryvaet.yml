- concept: речевая естественность не гарантирует фактическую точность ответа
  question: Объясни своими словами, почему живой голос, уместные перебивания и уверенная интонация речевой модели нельзя считать доказательством точности её ответа в узкой предметной области.
  explanation: Качество речевого поведения и достоверность содержания — разные способности. Для точных ответов в узкой области модель нужно связать с базой знаний, поиском или API.
  kind: open
  reference: Эти свойства показывают качество диалогового и акустического моделирования, но не наличие достоверных специализированных знаний. Без доступа к проверенному источнику, поиску или инструментам модель может естественно озвучить правдоподобный, но вымышленный ответ.
