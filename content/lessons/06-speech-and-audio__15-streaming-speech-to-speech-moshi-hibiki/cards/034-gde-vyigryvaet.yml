- concept: прямая speech-to-speech-модель устраняет интеграционные интерфейсы между отдельными стадиями
  question: Какое архитектурное свойство Moshi уменьшает объём интеграционного кода по сравнению с модульным голосовым конвейером?
  explanation: В модульном конвейере приходится согласовывать форматы, состояния и обработку ошибок между распознаванием речи, LLM и синтезом. Прямая speech-to-speech-архитектура устраняет эти обязательные швы, хотя не добавляет способности вызывать инструменты.
  kind: choice
  options:
    - Она напрямую связывает входящую и генерируемую речь без обязательных интерфейсов между распознаванием, языковой моделью и синтезом
    - Она автоматически создаёт API для всех корпоративных систем
    - Она хранит внутри модели полную копию прикладной базы данных
    - Она заменяет сетевой протокол обмена сообщениями аудиокодеком
  correct: 0
