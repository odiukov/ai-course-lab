- concept: отказ от временной разметки уменьшает стоимость подготовки данных, но не отменяет потребность в большом корпусе переводной речи
  question: Объясни, почему обучение на парах предложений упрощает подготовку данных для нового языка, но не делает её полностью дешёвой.
  explanation: 'Hibiki-Zero устраняет дорогую пословную синхронизацию, но не потребность в данных: адаптация к новому языку всё равно требует примерно 1000 часов речи.'
  kind: open
  reference: Для пар предложений не требуется вручную указывать соответствия слов и моменты их произнесения, поэтому разметка становится проще. Однако модели всё ещё нужен большой объём исходной речи и её переводов, а сбор, проверка и хранение такого корпуса требуют значительных ресурсов.
