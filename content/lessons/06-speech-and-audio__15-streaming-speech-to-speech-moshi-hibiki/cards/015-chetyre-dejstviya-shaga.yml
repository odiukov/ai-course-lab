- concept: разделение ролей между Temporal Transformer и depth transformer при генерации речи
  question: Объясни своими словами, как распределены роли Temporal Transformer и depth transformer при создании очередного аудиокадра Moshi.
  explanation: Большой Temporal Transformer обрабатывает три синхронных потока и задаёт продолжение, а двухслойный depth transformer внутри каждого кадра генерирует 8 кодбуков собственного аудио Moshi.
  kind: open
  reference: Temporal Transformer согласует пользовательское аудио, собственное аудио Moshi и текстовый поток, формируя решение для следующего момента диалога. Маленький depth transformer разворачивает это решение в кодбуки нового аудиокадра.
