- concept: явный текстовый поток отделяет языковое моделирование от акустической генерации
  question: Команда хочет обновить языковые способности речевой модели, по возможности сохранив обученную генерацию тембра и интонации. Какое устройство модели лучше поддерживает такую замену?
  explanation: Когда языковая информация представлена отдельным текстовым потоком, языковую голову проще улучшать или заменять независимо от компонентов, отвечающих за звучание речи.
  kind: choice
  options:
    - Смысл и акустика кодируются только одним неразделимым потоком аудиотокенов
    - Модель генерирует явный текстовый поток рядом с акустическим, выделяя языковую часть
    - Каждая реплика заранее записывается диктором и выбирается из базы
    - Перед генерацией увеличивается частота дискретизации входного сигнала
