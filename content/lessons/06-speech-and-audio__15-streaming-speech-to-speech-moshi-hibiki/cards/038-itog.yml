  question: Объясни своими словами, почему Mimi нельзя считать кодеком, который хранит только транскрипцию речи.
  explanation: Текстовая транскрипция передаёт в основном содержание. Mimi дополнительно кодирует акустические характеристики, поэтому его токены можно использовать для генерации аудио, а не только для восстановления слов.
