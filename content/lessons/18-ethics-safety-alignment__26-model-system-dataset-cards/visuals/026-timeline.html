<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Эволюция документации ИИ</title>
<style>
  :root {
    color-scheme: light dark;
    --page: ivory;
    --panel: white;
    --ink: midnightblue;
    --muted: slategray;
    --axis: steelblue;
    --data: mediumturquoise;
    --model: cornflowerblue;
    --system: mediumpurple;
    --proof: darkorange;
    --impact: seagreen;
    --connector: lightslategray;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
  }

  body {
    padding: 14px;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  main {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
  }

  header {
    padding: 4px 10px 8px;
  }

  h1 {
    margin: 0;
    font-size: 25px;
    line-height: 1.2;
    letter-spacing: 0.01em;
  }

  .subtitle {
    margin: 5px 0 0;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.3;
  }

  .frame {
    overflow: hidden;
    background: var(--panel);
    border: 1px solid var(--connector);
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 460px;
  }

  .axis {
    stroke: var(--axis);
    stroke-width: 5px;
    stroke-linecap: round;
    fill: none;
  }

  .connector {
    stroke: var(--connector);
    stroke-width: 2px;
    stroke-dasharray: 6px 6px;
    fill: none;
  }

  .tick {
    stroke: var(--axis);
    stroke-width: 3px;
    stroke-linecap: round;
  }

  .node-ring {
    fill: var(--panel);
    stroke-width: 4px;
  }

  .node-core {
    stroke: var(--panel);
    stroke-width: 2px;
  }

  .card {
    fill: var(--panel);
    stroke-width: 3px;
  }

  .card-data,
  .ring-data {
    stroke: var(--data);
  }

  .fill-data {
    fill: var(--data);
  }

  .card-model,
  .ring-model {
    stroke: var(--model);
  }

  .fill-model {
    fill: var(--model);
  }

  .card-system,
  .ring-system {
    stroke: var(--system);
  }

  .fill-system {
    fill: var(--system);
  }

  .card-proof,
  .ring-proof {
    stroke: var(--proof);
  }

  .fill-proof {
    fill: var(--proof);
  }

  .card-impact,
  .ring-impact {
    stroke: var(--impact);
  }

  .fill-impact {
    fill: var(--impact);
  }

  .card-title {
    fill: var(--ink);
    font-size: 19px;
    font-weight: 750;
  }

  .card-copy {
    fill: var(--muted);
    font-size: 15px;
    font-weight: 520;
  }

  .axis-caption {
    fill: var(--axis);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .stage-box {
    fill: var(--panel);
    stroke-width: 2px;
  }

  .stage-label {
    fill: var(--ink);
    font-size: 14px;
    font-weight: 680;
  }

  .stage-arrow {
    fill: var(--connector);
  }

  #fallback {
    margin: 0;
    padding: 24px;
    color: var(--ink);
    background: var(--panel);
    font-size: 17px;
    line-height: 1.5;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: black;
      --panel: midnightblue;
      --ink: white;
      --muted: gainsboro;
      --axis: deepskyblue;
      --data: turquoise;
      --model: lightskyblue;
      --system: plum;
      --proof: gold;
      --impact: lightgreen;
      --connector: lightslategray;
    }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Эволюция документации ИИ: 2018–2025</h1>
    <p class="subtitle">Не смена форматов, а последовательное расширение ответственности</p>
  </header>

  <section class="frame" aria-label="Временная шкала развития документации искусственного интеллекта">
    <svg id="diagram"
         viewBox="0 0 1200 460"
         width="1200"
         height="460"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Эволюция документации ИИ с 2018 по 2025 год</title>
      <desc id="svg-desc">Временная шкала от Datasheets и Model Cards к Data Cards, CardGen, Laminator и экологическим полям.</desc>
    </svg>
    <p id="fallback" hidden>Схема должна была показать линию времени: Datasheets в 2018 году, Model Cards в 2019 году, Data Cards в 2022 году, CardGen и Laminator в 2024 году, поля углеродного и водного следа в 2025 году.</p>
  </section>
</main>

<script>
const data = [
  {
    kind: "settings",
    origin: { x: 60, y: 20 },
    scale: { x: 1, y: 1 },
    axis: { x1: 45, y: 202, x2: 1068 },
    arrow: [
      { x: 1068, y: 202 },
      { x: 1047, y: 189 },
      { x: 1047, y: 215 }
    ],
    caption: {
      x: 45,
      y: 181,
      text: "ответственность документации расширяется",
      anchor: "start"
    },
    nodeRadius: 11,
    coreRadius: 5,
    tickTop: 187,
    tickBottom: 217
  },
  {
    kind: "milestone",
    year: "2018",
    name: "Datasheets",
    x: 70,
    side: "top",
    tone: "data",
    card: { x: 0, y: 5, w: 210, h: 125 },
    connector: { y1: 130, y2: 202 },
    lines: [
      { text: "Datasheets · 2018", x: 16, y: 34, role: "title", anchor: "start" },
      { text: "Происхождение данных:", x: 16, y: 67, role: "copy", anchor: "start" },
      { text: "сбор и преобразования", x: 16, y: 91, role: "copy", anchor: "start" }
    ]
  },
  {
    kind: "milestone",
    year: "2019",
    name: "Model Cards",
    x: 210,
    side: "bottom",
    tone: "model",
    card: { x: 105, y: 257, w: 220, h: 125 },
    connector: { y1: 202, y2: 257 },
    lines: [
      { text: "Model Cards · 2019", x: 121, y: 286, role: "title", anchor: "start" },
      { text: "Задачи и возможности", x: 121, y: 319, role: "copy", anchor: "start" },
      { text: "модели, границы и ошибки", x: 121, y: 343, role: "copy", anchor: "start" }
    ]
  },
  {
    kind: "milestone",
    year: "2022",
    name: "Data Cards",
    x: 630,
    side: "top",
    tone: "system",
    card: { x: 510, y: 5, w: 240, h: 125 },
    connector: { y1: 130, y2: 202 },
    lines: [
      { text: "Data Cards · 2022", x: 526, y: 34, role: "title", anchor: "start" },
      { text: "Разная глубина описания", x: 526, y: 67, role: "copy", anchor: "start" },
      { text: "и переход к масштабу системы", x: 526, y: 91, role: "copy", anchor: "start" }
    ]
  },
  {
    kind: "milestone",
    year: "2024",
    name: "CardGen и Laminator",
    x: 910,
    side: "bottom",
    tone: "proof",
    card: { x: 775, y: 257, w: 270, h: 125 },
    connector: { y1: 202, y2: 257 },
    lines: [
      { text: "CardGen и Laminator · 2024", x: 791, y: 286, role: "title", anchor: "start" },
      { text: "Генерация карточек", x: 791, y: 319, role: "copy", anchor: "start" },
      { text: "и проверяемые аттестации", x: 791, y: 343, role: "copy", anchor: "start" }
    ]
  },
  {
    kind: "milestone",
    year: "2025",
    name: "Экологические поля",
    x: 1050,
    side: "top",
    tone: "impact",
    card: { x: 850, y: 5, w: 230, h: 125 },
    connector: { y1: 130, y2: 202 },
    lines: [
      { text: "Экологические поля · 2025", x: 1064, y: 34, role: "title", anchor: "end" },
      { text: "Углеродный и водный след,", x: 1064, y: 67, role: "copy", anchor: "end" },
      { text: "энергия вычислений", x: 1064, y: 91, role: "copy", anchor: "end" }
    ]
  },
  {
    kind: "stages",
    y: 400,
    h: 35,
    arrowHalf: 7,
    items: [
      { x: 0, w: 235, tone: "data", text: "происхождение данных" },
      { x: 260, w: 205, tone: "model", text: "поведение модели" },
      { x: 490, w: 220, tone: "system", text: "работа всей системы" },
      { x: 735, w: 345, tone: "impact", text: "доказательства и последствия" }
    ],
    arrows: [
      { x: 247, tip: 256 },
      { x: 477, tip: 486 },
      { x: 722, tip: 731 }
    ]
  }
];

const settings = data.find(item => item.kind === "settings");
const origin = settings.origin;
const scale = settings.scale;
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const svg = document.getElementById("diagram");
  const make = name => document.createElementNS(svg.namespaceURI, name);

  const add = (name, attributes, parent = svg) => {
    const node = make(name);
    for (const [key, value] of Object.entries(attributes)) {
      node.setAttribute(key, value);
    }
    parent.appendChild(node);
    return node;
  };

  const line = (x1, y1, x2, y2, className, parent = svg) =>
    add("line", {
      x1: sx(x1),
      y1: sy(y1),
      x2: sx(x2),
      y2: sy(y2),
      class: className
    }, parent);

  const rect = (box, className, parent = svg) =>
    add("rect", {
      x: sx(box.x),
      y: sy(box.y),
      width: sx(box.x + box.w) - sx(box.x),
      height: sy(box.y + box.h) - sy(box.y),
      class: className
    }, parent);

  const circle = (x, y, radius, className, parent = svg) =>
    add("circle", {
      cx: sx(x),
      cy: sy(y),
      r: sx(radius) - sx(0),
      class: className
    }, parent);

  const polygon = (points, className, parent = svg) =>
    add("polygon", {
      points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
      class: className
    }, parent);

  const label = (entry, className, parent = svg) => {
    const node = add("text", {
      x: sx(entry.x),
      y: sy(entry.y),
      "text-anchor": entry.anchor,
      class: className
    }, parent);
    node.textContent = entry.text;
    return node;
  };

  const axisGroup = add("g", { "aria-label": "Линия времени" });
  line(
    settings.axis.x1,
    settings.axis.y,
    settings.axis.x2,
    settings.axis.y,
    "axis",
    axisGroup
  );
  polygon(settings.arrow, "fill-model", axisGroup);
  label(settings.caption, "axis-caption", axisGroup);

  const milestones = data.filter(item => item.kind === "milestone");

  for (const milestone of milestones) {
    const group = add("g", {
      "aria-label": `${milestone.name}, ${milestone.year}`
    });

    line(
      milestone.x,
      milestone.connector.y1,
      milestone.x,
      milestone.connector.y2,
      "connector",
      group
    );

    line(
      milestone.x,
      settings.tickTop,
      milestone.x,
      settings.tickBottom,
      "tick",
      group
    );

    rect(
      milestone.card,
      `card card-${milestone.tone}`,
      group
    );

    circle(
      milestone.x,
      settings.axis.y,
      settings.nodeRadius,
      `node-ring ring-${milestone.tone}`,
      group
    );

    circle(
      milestone.x,
      settings.axis.y,
      settings.coreRadius,
      `node-core fill-${milestone.tone}`,
      group
    );

    for (const textLine of milestone.lines) {
      label(
        textLine,
        textLine.role === "title" ? "card-title" : "card-copy",
        group
      );
    }
  }

  const stages = data.find(item => item.kind === "stages");
  const stageGroup = add("g", {
    "aria-label": "Последовательное расширение ответственности"
  });

  for (const item of stages.items) {
    rect(
      { x: item.x, y: stages.y, w: item.w, h: stages.h },
      `stage-box card-${item.tone}`,
      stageGroup
    );

    label(
      {
        x: item.x + item.w / settings.scale.x / (settings.scale.x + settings.scale.x),
        y: stages.y + stages.h / settings.scale.y / (settings.scale.y + settings.scale.y) + settings.coreRadius / settings.scale.y,
        text: item.text,
        anchor: "middle"
      },
      "stage-label",
      stageGroup
    );
  }

  for (const arrow of stages.arrows) {
    polygon(
      [
        { x: arrow.x, y: stages.y + stages.h / scale.y / (scale.y + scale.y) - stages.arrowHalf },
        { x: arrow.tip, y: stages.y + stages.h / scale.y / (scale.y + scale.y) },
        { x: arrow.x, y: stages.y + stages.h / scale.y / (scale.y + scale.y) + stages.arrowHalf }
      ],
      "stage-arrow",
      stageGroup
    );
  }
} catch (error) {
  const svg = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");
  if (svg) {
    svg.replaceChildren();
    svg.hidden = true;
  }
  if (fallback) {
    fallback.hidden = false;
  }
}
</script>
</body>
</html>
