<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Три уровня приближения Data Card</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f8fafc;
  --panel:#ffffff;
  --panel-soft:#eef6ff;
  --panel-warm:#fff8e8;
  --ink:#172033;
  --muted:#526078;
  --line:#91a2bc;
  --blue:#1769aa;
  --blue-soft:#dceeff;
  --amber:#a96500;
  --amber-soft:#ffedbd;
  --green:#20734a;
  --green-soft:#dff4e8;
  --alert:#a23a46;
  --alert-soft:#ffe3e7;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#101722;
    --panel:#172131;
    --panel-soft:#172c42;
    --panel-warm:#342b18;
    --ink:#edf4ff;
    --muted:#afbdd0;
    --line:#60718b;
    --blue:#74b9f0;
    --blue-soft:#173958;
    --amber:#ffc767;
    --amber-soft:#493716;
    --green:#75d6a1;
    --green-soft:#173d2c;
    --alert:#ff9aa5;
    --alert-soft:#4a2028;
  }
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{
  margin:unset;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}
.figure{
  width:100%;
  max-width:1040px;
  margin:auto;
  background:var(--bg);
  border:1px solid var(--line);
}
h1{
  margin:unset;
  padding:12px 18px;
  background:var(--panel);
  border-bottom:1px solid var(--line);
  font-size:20px;
  font-weight:bold;
}
svg{
  display:block;
  width:100%;
  height:auto;
  max-height:458px;
  background:var(--bg);
}
.card{fill:var(--panel);stroke:var(--line);stroke-width:2px}
.soft{fill:var(--panel-soft);stroke:var(--blue);stroke-width:2px}
.warm{fill:var(--panel-warm);stroke:var(--amber);stroke-width:2px}
.good{fill:var(--green-soft);stroke:var(--green);stroke-width:2px}
.alert{fill:var(--alert-soft);stroke:var(--alert);stroke-width:2px}
.spine{fill:none;stroke:var(--line);stroke-width:3px}
.connector{fill:none;stroke:var(--line);stroke-width:2px}
.flow{fill:none;stroke:var(--blue);stroke-width:3px}
.flow-warm{fill:none;stroke:var(--amber);stroke-width:3px}
.ring{fill:var(--bg);stroke:var(--blue);stroke-width:3px}
.ring-core{fill:var(--blue);stroke:none}
.level{
  fill:var(--blue);
  font-size:15px;
  font-weight:bold;
}
.title{
  fill:var(--ink);
  font-size:23px;
  font-weight:bold;
}
.body{
  fill:var(--ink);
  font-size:17px;
}
.small{
  fill:var(--muted);
  font-size:14px;
}
.box-title{
  fill:var(--ink);
  font-size:16px;
  font-weight:bold;
}
.badge{
  fill:var(--ink);
  font-size:14px;
  font-weight:bold;
}
.fallback{
  display:none;
  padding:18px;
  background:var(--alert-soft);
  color:var(--ink);
  font-size:16px;
}
</style>
</head>
<body>
<main class="figure">
  <h1 id="diagram-title">Три уровня приближения Data Card</h1>
  <svg id="diagram" viewBox="0 0 1040 458" width="1040" height="458"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="diagram-title diagram-description">
    <desc id="diagram-description">Один датасет отзывов показан как сводка, схема подготовки train/test и документация поля language.</desc>
  </svg>
  <div id="fallback" class="fallback" role="alert">
    Схема должна была показать один датасет отзывов на трёх уровнях: сводку о двух миллионах англоязычных строк, разделение train/test и происхождение поля языка.
  </div>
</main>
<script>
const DATA=Object.freeze([{
  zero:0,
  map:{ox:20,oy:10,scale:0.97},
  card:{x1:130,x2:1020,r:12},
  arrow:{head:12,wing:7},
  spine:{x:62,y1:67,y2:376,r:20,core:6},
  join:{x1:82,x2:130},
  tel:{y1:16,y2:116,cy:66},
  peri:{y1:140,y2:282,cy:211},
  micro:{y1:306,y2:442,cy:374},
  telText:{
    level:{x:160,y:40},
    title:{x:160,y:69},
    note:{x:160,y:96},
    badge:{x1:745,y1:39,x2:985,y2:91,r:9,cx:865,ty:59,by:79}
  },
  source:{x1:164,y1:185,x2:324,y2:239,r:8,cx:244,ty:205,by:225},
  filter:{x1:382,y1:176,x2:574,y2:248,r:8,cx:478,ty:198,my:218,by:237},
  split:{x:642,y:212,r:9},
  train:{x1:715,y1:166,x2:844,y2:212,r:8,cx:779,cy:189},
  test:{x1:715,y1:224,x2:844,y2:270,r:8,cx:779,cy:247},
  processNote:{x:876,y1:182,y2:203,y3:224,y4:245},
  periHead:{x:160,levelY:160,titleY:181},
  microHead:{x:160,levelY:326,titleY:349},
  field:{x1:164,y1:371,x2:342,y2:420,r:8,cx:253,ty:388,by:408},
  originBox:{x1:379,y1:366,x2:650,y2:425,r:8,tx:397,y1t:385,y2t:407},
  meaningBox:{x1:683,y1:350,x2:985,y2:427,r:8,tx:702,y1t:371,y2t:394,y3t:415},
  labels:{
    spineTop:{x:62,y:36},
    spineBottom:{x:62,y:416},
    telSide:{x:98,y:61},
    periSide:{x:98,y:206},
    microSide:{x:98,y:369},
    arrowOne:{x:350,y:198},
    arrowTwo:{x:608,y:189}
  }
}]);
const [d]=DATA;
const origin=Object.freeze({x:d.map.ox,y:d.map.oy});
const scale=d.map.scale;
const sx=x=>origin.x+x*scale;
const sy=y=>origin.y+y*scale;

try{
  const svg=document.getElementById("diagram");
  const NS="http://www.w3.org/2000/svg";

  const node=(name,attrs={},content)=>{
    const el=document.createElementNS(NS,name);
    for(const [key,value] of Object.entries(attrs)) el.setAttribute(key,String(value));
    if(content!==undefined) el.textContent=content;
    svg.appendChild(el);
    return el;
  };

  const lengthX=value=>sx(value)-sx(d.zero);
  const rect=(box,cls)=>{
    node("rect",{
      x:sx(box.x1),y:sy(box.y1),
      width:sx(box.x2)-sx(box.x1),
      height:sy(box.y2)-sy(box.y1),
      rx:lengthX(box.r),class:cls
    });
  };
  const line=(x1,y1,x2,y2,cls)=>{
    node("line",{x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),class:cls});
  };
  const circle=(x,y,r,cls)=>{
    node("circle",{cx:sx(x),cy:sy(y),r:lengthX(r),class:cls});
  };
  const text=(x,y,value,cls,anchor="start")=>{
    node("text",{
      x:sx(x),y:sy(y),class:cls,
      "text-anchor":anchor,
      "dominant-baseline":"middle"
    },value);
  };
  const arrow=(x1,y1,x2,y2,cls)=>{
    line(x1,y1,x2,y2,cls);
    const dx=x2-x1;
    const dy=y2-y1;
    const magnitude=Math.hypot(dx,dy);
    const ux=dx/magnitude;
    const uy=dy/magnitude;
    const bx=x2-ux*d.arrow.head;
    const by=y2-uy*d.arrow.head;
    const px=-uy*d.arrow.wing;
    const py=ux*d.arrow.wing;
    node("path",{
      d:[
        "M",sx(x2),sy(y2),
        "L",sx(bx+px),sy(by+py),
        "L",sx(bx-px),sy(by-py),
        "Z"
      ].join(" "),
      class:cls
    });
  };

  line(d.spine.x,d.spine.y1,d.spine.x,d.spine.y2,"spine");
  text(d.labels.spineTop.x,d.labels.spineTop.y,"ОДИН DATA CARD","small","middle");
  text(d.labels.spineBottom.x,d.labels.spineBottom.y,"глубже → точнее","small","middle");

  for(const level of [d.tel,d.peri,d.micro]){
    circle(d.spine.x,level.cy,d.spine.r,"ring");
    circle(d.spine.x,level.cy,d.spine.core,"ring-core");
    line(d.join.x1,level.cy,d.join.x2,level.cy,"connector");
  }

  text(d.labels.telSide.x,d.labels.telSide.y,"сводка","small","start");
  text(d.labels.periSide.x,d.labels.periSide.y,"процесс","small","start");
  text(d.labels.microSide.x,d.labels.microSide.y,"поле","small","start");

  rect({x1:d.card.x1,y1:d.tel.y1,x2:d.card.x2,y2:d.tel.y2,r:d.card.r},"card");
  text(d.telText.level.x,d.telText.level.y,"TELESCOPIC · СВОДКА","level");
  text(d.telText.title.x,d.telText.title.y,"2 млн англоязычных отзывов","title");
  text(d.telText.note.x,d.telText.note.y,"Для быстрого понимания масштаба и назначения","small");
  rect(d.telText.badge,"good");
  text(d.telText.badge.cx,d.telText.badge.ty,"ОБЕЩАНИЕ СВОДКИ","badge","middle");
  text(d.telText.badge.cx,d.telText.badge.by,"тексты — английские","body","middle");

  rect({x1:d.card.x1,y1:d.peri.y1,x2:d.card.x2,y2:d.peri.y2,r:d.card.r},"card");
  text(d.periHead.x,d.periHead.levelY,"PERISCOPIC · ПРОЦЕСС","level");
  text(d.periHead.x,d.periHead.titleY,"Как корпус становится выборками","body");

  rect(d.source,"soft");
  text(d.source.cx,d.source.ty,"ИСХОДНЫЙ КОРПУС","box-title","middle");
  text(d.source.cx,d.source.by,"2 млн отзывов","body","middle");

  rect(d.filter,"warm");
  text(d.filter.cx,d.filter.ty,"ОПРЕДЕЛЕНИЕ ЯЗЫКА","box-title","middle");
  text(d.filter.cx,d.filter.my,"+ правила исключения","body","middle");
  text(d.filter.cx,d.filter.by,"что осталось и почему","small","middle");

  arrow(d.source.x2,d.source.cy,d.filter.x1,d.filter.cy,"flow");
  text(d.labels.arrowOne.x,d.labels.arrowOne.y,"проверка","small","middle");
  arrow(d.filter.x2,d.filter.cy,d.split.x,d.split.y,"flow-warm");
  text(d.labels.arrowTwo.x,d.labels.arrowTwo.y,"разделение","small","middle");
  circle(d.split.x,d.split.y,d.split.r,"ring-core");
  arrow(d.split.x,d.split.y,d.train.x1,d.train.cy,"flow");
  arrow(d.split.x,d.split.y,d.test.x1,d.test.cy,"flow");

  rect(d.train,"good");
  text(d.train.cx,d.train.cy,"TRAIN","box-title","middle");
  rect(d.test,"soft");
  text(d.test.cx,d.test.cy,"TEST","box-title","middle");

  text(d.processNote.x,d.processNote.y1,"Здесь проверяют:","box-title");
  text(d.processNote.x,d.processNote.y2,"• как определяли язык","small");
  text(d.processNote.x,d.processNote.y3,"• что исключали","small");
  text(d.processNote.x,d.processNote.y4,"• как делили данные","small");

  rect({x1:d.card.x1,y1:d.micro.y1,x2:d.card.x2,y2:d.micro.y2,r:d.card.r},"card");
  text(d.microHead.x,d.microHead.levelY,"MICROSCOPIC · ПРИЗНАК","level");
  text(d.microHead.x,d.microHead.titleY,"Что именно означает конкретная колонка","body");

  rect(d.field,"soft");
  text(d.field.cx,d.field.ty,"КОЛОНКА","small","middle");
  text(d.field.cx,d.field.by,"language","title","middle");

  arrow(d.field.x2,d.field.cy,d.originBox.x1,d.originBox.cy,"flow");
  rect(d.originBox,"warm");
  text(d.originBox.tx,d.originBox.y1t,"Происхождение: определение языка","box-title");
  text(d.originBox.tx,d.originBox.y2t,"Формат: строковое значение","body");

  arrow(d.originBox.x2,d.originBox.cy,d.meaningBox.x1,d.meaningBox.cy,"flow-warm");
  rect(d.meaningBox,"alert");
  text(d.meaningBox.tx,d.meaningBox.y1t,"Смысл: язык текста отзыва","box-title");
  text(d.meaningBox.tx,d.meaningBox.y2t,"Допустимое значение: en → английский","body");
  text(d.meaningBox.tx,d.meaningBox.y3t,"Пропуск возможен? Нужно проверить","body");
}catch(error){
  const svg=document.getElementById("diagram");
  const fallback=document.getElementById("fallback");
  if(svg) svg.style.display="none";
  if(fallback) fallback.style.display="block";
}
</script>
</body>
</html>
