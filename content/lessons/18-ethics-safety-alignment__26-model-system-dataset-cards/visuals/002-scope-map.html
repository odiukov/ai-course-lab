<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Карта областей документации</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f9fc;
      --ink: #172033;
      --muted: #536078;
      --surface: #ffffff;
      --system: #b56a09;
      --system-soft: #fff3d8;
      --model: #7254c7;
      --model-soft: #f1edff;
      --data: #087d91;
      --data-soft: #e2f7fa;
      --flow: #34415a;
      --card: #ffffff;
      --incident: #b83e51;
      --incident-soft: #ffe9ed;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111621;
        --ink: #f1f4fb;
        --muted: #b8c1d4;
        --surface: #171e2b;
        --system: #f1ad49;
        --system-soft: #342817;
        --model: #b9a4ff;
        --model-soft: #29233f;
        --data: #5bd0df;
        --data-soft: #15343a;
        --flow: #d2d9e8;
        --card: #202838;
        --incident: #ff8b9d;
        --incident-soft: #3b2029;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    h2 {
      font-size: 22px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 430px;
      background: var(--surface);
    }

    text {
      fill: var(--ink);
      font-size: 15px;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
    }

    .scope-note {
      fill: var(--muted);
      font-size: 13px;
    }

    .card-title {
      font-size: 16px;
      font-weight: bold;
    }

    .small {
      font-size: 13px;
    }

    .micro {
      font-size: 12px;
    }

    .scope-system {
      fill: var(--system-soft);
      stroke: var(--system);
      stroke-width: 3px;
    }

    .scope-model {
      fill: var(--model-soft);
      stroke: var(--model);
      stroke-width: 3px;
    }

    .scope-data {
      fill: var(--data-soft);
      stroke: var(--data);
      stroke-width: 3px;
    }

    .process {
      fill: var(--card);
      stroke: var(--model);
      stroke-width: 2px;
    }

    .guard {
      fill: var(--card);
      stroke: var(--system);
      stroke-width: 2px;
    }

    .incident {
      fill: var(--incident-soft);
      stroke: var(--incident);
      stroke-width: 2px;
    }

    .flow {
      fill: none;
      stroke: var(--flow);
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .flow-head {
      fill: var(--flow);
      stroke: none;
    }

    .request {
      fill: var(--surface);
      stroke: var(--flow);
      stroke-width: 2px;
    }

    .decision {
      fill: var(--system);
      stroke: var(--surface);
      stroke-width: 2px;
    }

    .scope-system,
    .scope-model,
    .scope-data,
    .process,
    .guard,
    .incident,
    .flow,
    .request,
    .decision {
      vector-effect: non-scaling-stroke;
    }

    #fallback {
      color: var(--ink);
      background: var(--surface);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h2>Карта областей документации</h2>

  <svg
    id="diagram"
    width="1180"
    height="430"
    viewBox="0 0 1180 430"
    preserveAspectRatio="xMidYMid meet"
    role="img"
    aria-labelledby="diagram-title diagram-desc">
    <title id="diagram-title">Три вложенных масштаба документации</title>
    <desc id="diagram-desc">
      Датасет находится внутри масштаба модели, а модель — внутри
      продакшен-системы. Показаны обучение, оценки, защиты, мониторинг
      и реакция на инциденты.
    </desc>
    <g id="plot"></g>
  </svg>

  <p id="fallback" hidden>
    Схема должна была показать три вложенных масштаба: датасет как источник
    данных; модель с обучением и оценками; продакшен-систему с защитами,
    мониторингом и реакцией на инциденты.
  </p>

  <script>
    const data = [{
      zero: 0,
      last: -1,
      originX: 20,
      originY: 20,
      scale: 10,
      radius: 1.1,
      arrowLength: 1.2,
      arrowWing: 0.65,
      textGap: 16,
      requestRadius: 0.8,
      decisionRadius: 0.7,

      stage: { x1: -2, y1: -2, x2: 116, y2: 41 },

      system: { x1: 2, y1: 1, x2: 114, y2: 40 },
      model: { x1: 24, y1: 8, x2: 85, y2: 30 },
      dataset: { x1: 28, y1: 14, x2: 46, y2: 24 },

      training: { x1: 51, y1: 16, x2: 63, y2: 22 },
      evaluation: { x1: 68, y1: 16, x2: 81, y2: 22 },
      deployed: { x1: 51, y1: 25, x2: 65, y2: 29 },

      request: { x: 8, y: 26.5 },
      inputGuard: { x1: 12, y1: 23.5, x2: 22, y2: 29.5 },
      outputGuard: { x1: 93, y1: 23.5, x2: 107, y2: 29.5 },
      decision: { x: 111, y: 26.5 },

      monitoring: { x1: 55, y1: 33, x2: 72, y2: 38 },
      response: { x1: 80, y1: 33, x2: 104, y2: 38 },

      arrows: {
        requestToGuard: [
          { x: 8.8, y: 26.5 },
          { x: 12, y: 26.5 }
        ],
        guardToModel: [
          { x: 22, y: 26.5 },
          { x: 51, y: 26.5 }
        ],
        dataToTraining: [
          { x: 46, y: 19 },
          { x: 51, y: 19 }
        ],
        trainingToEvaluation: [
          { x: 63, y: 19 },
          { x: 68, y: 19 }
        ],
        modelToProtection: [
          { x: 65, y: 26.5 },
          { x: 93, y: 26.5 }
        ],
        protectionToDecision: [
          { x: 107, y: 26.5 },
          { x: 110.3, y: 26.5 }
        ],
        signalsToMonitoring: [
          { x: 100, y: 29.5 },
          { x: 100, y: 31.5 },
          { x: 72, y: 31.5 },
          { x: 72, y: 33 }
        ],
        monitoringToResponse: [
          { x: 72, y: 35.5 },
          { x: 80, y: 35.5 }
        ]
      },

      labels: {
        systemTitle: { x: 5, y: 4.4 },
        systemNote: { x: 5, y: 6.5 },
        systemScale: { x: 111, y: 4.4 },

        modelTitle: { x: 26.5, y: 10.7 },
        modelNote: { x: 26.5, y: 12.6 },
        modelScale: { x: 82.5, y: 10.7 },

        dataTitle: { x: 37, y: 16.6 },
        dataNote: { x: 37, y: 18.5 },
        dataBody: { x: 37, y: 20.8 },

        training: { x: 57, y: 19.5 },
        evaluation: { x: 74.5, y: 18.6 },
        deployed: { x: 58, y: 27.5 },

        request: { x: 8, y: 23.2 },
        inputGuard: { x: 17, y: 25.4 },
        outputGuard: { x: 100, y: 25.4 },
        decision: { x: 113, y: 23.2 },

        connection: { x: 67, y: 25.3 },
        signals: { x: 98.5, y: 31 },

        monitoring: { x: 63.5, y: 36 },
        response: { x: 92, y: 35.2 },

        symptom: { x: 5, y: 33.6 },
        symptomBody: { x: 5, y: 35.6 }
      }
    }];

    const [D] = data;
    const origin = Object.freeze({ x: D.originX, y: D.originY });
    const scale = D.scale;
    const sx = x => origin.x + x * scale;
    const sy = y => origin.y + y * scale;

    try {
      const svg = document.getElementById("diagram");
      const plot = document.getElementById("plot");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      const node = (name, attributes = {}) => {
        const element = document.createElementNS(namespace, name);
        Object.entries(attributes).forEach(([key, value]) => {
          element.setAttribute(key, String(value));
        });
        return element;
      };

      const append = element => {
        plot.appendChild(element);
        return element;
      };

      const rect = (box, className) => append(node("rect", {
        x: sx(box.x1),
        y: sy(box.y1),
        width: sx(box.x2) - sx(box.x1),
        height: sy(box.y2) - sy(box.y1),
        rx: sx(D.radius) - sx(D.zero),
        ry: sy(D.radius) - sy(D.zero),
        class: className
      }));

      const circle = (point, radius, className) => append(node("circle", {
        cx: sx(point.x),
        cy: sy(point.y),
        r: sx(radius) - sx(D.zero),
        class: className
      }));

      const label = (point, lines, className, anchor) => {
        const text = append(node("text", {
          x: sx(point.x),
          y: sy(point.y),
          class: className,
          "text-anchor": anchor
        }));

        lines.forEach((content, index) => {
          const attributes = { x: sx(point.x) };
          if (index !== D.zero) {
            attributes.dy = D.textGap;
          }
          const span = node("tspan", attributes);
          span.textContent = content;
          text.appendChild(span);
        });

        return text;
      };

      const arrow = points => {
        append(node("polyline", {
          points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
          class: "flow"
        }));

        const tip = points.at(D.last);
        const previous = points.at(D.last - D.last);
        const dx = tip.x - previous.x;
        const dy = tip.y - previous.y;
        const length = Math.hypot(dx, dy);
        const ux = dx / length;
        const uy = dy / length;

        const left = {
          x: tip.x - ux * D.arrowLength - uy * D.arrowWing,
          y: tip.y - uy * D.arrowLength + ux * D.arrowWing
        };
        const right = {
          x: tip.x - ux * D.arrowLength + uy * D.arrowWing,
          y: tip.y - uy * D.arrowLength - ux * D.arrowWing
        };

        append(node("polygon", {
          points: [tip, left, right]
            .map(point => `${sx(point.x)},${sy(point.y)}`)
            .join(" "),
          class: "flow-head"
        }));
      };

      append(node("rect", {
        x: sx(D.stage.x1),
        y: sy(D.stage.y1),
        width: sx(D.stage.x2) - sx(D.stage.x1),
        height: sy(D.stage.y2) - sy(D.stage.y1),
        fill: "var(--surface)"
      }));

      rect(D.system, "scope-system");
      rect(D.model, "scope-model");
      rect(D.dataset, "scope-data");

      rect(D.training, "process");
      rect(D.evaluation, "process");
      rect(D.deployed, "process");
      rect(D.inputGuard, "guard");
      rect(D.outputGuard, "guard");
      rect(D.monitoring, "incident");
      rect(D.response, "incident");

      circle(D.request, D.requestRadius, "request");
      circle(D.decision, D.decisionRadius, "decision");

      arrow(D.arrows.requestToGuard);
      arrow(D.arrows.guardToModel);
      arrow(D.arrows.dataToTraining);
      arrow(D.arrows.trainingToEvaluation);
      arrow(D.arrows.modelToProtection);
      arrow(D.arrows.protectionToDecision);
      arrow(D.arrows.signalsToMonitoring);
      arrow(D.arrows.monitoringToResponse);

      label(
        D.labels.systemTitle,
        ["ПРОДАКШЕН-СИСТЕМА"],
        "title",
        "start"
      );
      label(
        D.labels.systemNote,
        ["карточка системы · интерфейс, защиты, сервисы и действия людей"],
        "scope-note",
        "start"
      );
      label(
        D.labels.systemScale,
        ["МАСШТАБ СИСТЕМЫ"],
        "scope-note",
        "end"
      );

      label(
        D.labels.modelTitle,
        ["МОДЕЛЬ"],
        "card-title",
        "start"
      );
      label(
        D.labels.modelNote,
        ["карточка модели"],
        "scope-note",
        "start"
      );
      label(
        D.labels.modelScale,
        ["ОБУЧЕНИЕ И ОЦЕНКИ"],
        "scope-note",
        "end"
      );

      label(
        D.labels.dataTitle,
        ["ДАТАСЕТ"],
        "card-title",
        "middle"
      );
      label(
        D.labels.dataNote,
        ["карточка датасета"],
        "scope-note",
        "middle"
      );
      label(
        D.labels.dataBody,
        ["обучающие и", "проверочные примеры"],
        "small",
        "middle"
      );

      label(
        D.labels.training,
        ["обучение"],
        "small",
        "middle"
      );
      label(
        D.labels.evaluation,
        ["оценки", "и тесты"],
        "small",
        "middle"
      );
      label(
        D.labels.deployed,
        ["модель в проде"],
        "small",
        "middle"
      );

      label(
        D.labels.request,
        ["заявка"],
        "small",
        "middle"
      );
      label(
        D.labels.inputGuard,
        ["интерфейс:", "формат адреса"],
        "small",
        "middle"
      );
      label(
        D.labels.outputGuard,
        ["защиты", "на выходе"],
        "small",
        "middle"
      );
      label(
        D.labels.decision,
        ["решение"],
        "small",
        "end"
      );

      label(
        D.labels.connection,
        ["подключение"],
        "micro",
        "start"
      );
      label(
        D.labels.signals,
        ["сигналы сбоя"],
        "micro",
        "end"
      );

      label(
        D.labels.monitoring,
        ["мониторинг"],
        "small",
        "middle"
      );
      label(
        D.labels.response,
        ["реакция на инцидент"],
        "small",
        "middle"
      );

      label(
        D.labels.symptom,
        ["СБОЙ"],
        "card-title",
        "start"
      );
      label(
        D.labels.symptomBody,
        [
          "чаще отклоняются заявки из региона",
          "один симптом может вести к нескольким карточкам"
        ],
        "small",
        "start"
      );

      fallback.hidden = true;
      svg.hidden = false;
    } catch (error) {
      const svg = document.getElementById("diagram");
      const plot = document.getElementById("plot");
      const fallback = document.getElementById("fallback");

      if (plot) {
        plot.replaceChildren();
      }
      if (svg) {
        svg.hidden = true;
      }
      if (fallback) {
        fallback.hidden = false;
      }
    }
  </script>
</body>
</html>
