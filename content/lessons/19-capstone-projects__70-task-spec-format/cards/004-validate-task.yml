- concept: validate_task применяет проверки в фиксированном порядке и завершает работу при первой основной ошибке
  question: Расположи этапы validate_task в правильном порядке.
  explanation: Проверки идут от базовой формы к смысловым ограничениям. Ранний возврат делает приоритет ошибок предсказуемым и не позволяет вторичной проблеме скрыть более фундаментальную.
  kind: order
  items:
    - Убедиться, что record является словарём
    - Проверить наличие обязательных полей
    - Проверить отсутствие неизвестных полей
    - Проверить типы значений
    - Проверить совместимость category и metric_name
    - Проверить, не встроен ли few-shot непосредственно в prompt
