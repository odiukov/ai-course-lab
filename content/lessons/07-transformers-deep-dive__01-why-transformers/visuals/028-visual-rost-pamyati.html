<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Рост длины в 62 раза, рост памяти в 3900</title>
<style>
  :root{
    --bg:#fbfaf7; --fg:#1c1f24; --muted:#6a7078; --grid:#dcd8d0;
    --bar1:#5b8db8; --bar1e:#3f6d95; --bar2:#c2593f; --bar2e:#9c4230; --accent:#8a5a2b;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14161a; --fg:#e8e6e1; --muted:#9aa1aa; --grid:#31363d;
      --bar1:#5f95c4; --bar1e:#8fb9dd; --bar2:#d9694a; --bar2e:#f0937a; --accent:#d9b071;
    }
  }
  html,body{margin:0}
  .wrap{background:var(--bg);color:var(--fg);padding:14px 12px 16px;
    font:400 14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .ttl{font-weight:600;font-size:15px;margin:0 0 2px}
  .sub{color:var(--muted);font-size:12.5px;margin:0 0 6px}
  svg{display:block;width:100%;height:auto;max-height:520px}
  .fail{color:var(--muted);font-size:13px}
  text{font-family:inherit;fill:var(--fg)}
</style>
<div class="wrap">
  <p class="ttl">Матрица внимания: ×62 по длине даёт ×3900 по памяти</p>
  <p class="sub">Ячеек на одну голову и один слой. Шкала вертикали логарифмическая.</p>
  <div id="host"><svg id="fig" viewBox="0 0 480 460" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Два столбика: N=2048 — 4,2 млн ячеек, N=128000 — 16,4 млрд ячеек"></svg></div>
</div>
<script>
(function(){
  var host=document.getElementById('host');
  try{
    // ---- данные схемы (в единицах данных: x — позиция, y — десятичные порядки над 10^6)
    var DATA={
      base:1e6,
      bars:[
        {cx:1.5,w:1.6,cells:4.2e6, name:'N = 2048',    value:'4,2 млн ячеек',  fill:'var(--bar1)',stroke:'var(--bar1e)'},
        {cx:5.0,w:1.6,cells:16.4e9,name:'N = 128 000', value:'16,4 млрд ячеек',fill:'var(--bar2)',stroke:'var(--bar2e)'}
      ],
      ticks:[{y:0,t:'10⁶'},{y:1,t:'10⁷'},{y:2,t:'10⁸'},{y:3,t:'10⁹'},{y:4,t:'10¹⁰'}],
      axis:{x0:0,x1:6.2},
      vArrow:{x:2.9,lx:3.1,text:'×3900'},
      hArrow:{y:-0.85,ly:-1.35,lx:3.25,text:'×62 по длине'},
      caption:{x:3.1,y:5.35,text:'×62 по длине = ×3900 по памяти'},
      head:{w:0.11,len:0.17}
    };
    // ---- одна система координат
    var origin={x:90,y:350}, scale=60;
    function sx(x){return origin.x + x*scale;}
    function sy(y){return origin.y - y*scale;}

    var NS='http://www.w3.org/2000/svg', svg=document.getElementById('fig');
    function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}
    function line(x1,y1,x2,y2,st,w,d){var e=el('line',{x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),
      stroke:st,'stroke-width':w,'stroke-linecap':'round'});if(d)e.setAttribute('stroke-dasharray',d);svg.appendChild(e);return e;}
    function txt(x,y,dx,dy,s,anchor,size,weight,fill){
      var e=el('text',{x:sx(x)+dx,y:sy(y)+dy,'text-anchor':anchor,'font-size':size,
        'font-weight':weight||400,fill:fill||'var(--fg)'});e.textContent=s;svg.appendChild(e);return e;}
    // наконечник: вершина в (x,y), направление dir = +1 вверх, -1 вниз (по данным)
    function headV(x,y,dir,fill){
      svg.appendChild(el('polygon',{points:
        sx(x)+','+sy(y)+' '+
        sx(x-DATA.head.w)+','+sy(y-dir*DATA.head.len)+' '+
        sx(x+DATA.head.w)+','+sy(y-dir*DATA.head.len),fill:fill}));
    }
    function headH(x,y,dir,fill){
      svg.appendChild(el('polygon',{points:
        sx(x)+','+sy(y)+' '+
        sx(x-dir*DATA.head.len)+','+sy(y-DATA.head.w)+' '+
        sx(x-dir*DATA.head.len)+','+sy(y+DATA.head.w),fill:fill}));
    }

    function h(cells){return Math.log(cells/DATA.base)/Math.LN10;}

    // сетка и засечки
    DATA.ticks.forEach(function(t){
      if(t.y>0) line(DATA.axis.x0,t.y,DATA.axis.x1,t.y,'var(--grid)',1,'3 4');
      txt(DATA.axis.x0,t.y,-9,4,t.t,'end',12,400,'var(--muted)');
    });
    // ось (базовая линия) — ровно sy(0)
    line(DATA.axis.x0,0,DATA.axis.x1,0,'var(--grid)',1.6);

    // столбики
    DATA.bars.forEach(function(b){
      var top=h(b.cells), x0=sx(b.cx-b.w/2), x1=sx(b.cx+b.w/2);
      svg.appendChild(el('rect',{x:x0,y:sy(top),width:x1-x0,height:sy(0)-sy(top),
        fill:b.fill,stroke:b.stroke,'stroke-width':1.5}));
      txt(b.cx,top,0,-10,b.value,'middle',13,600);
      txt(b.cx,0,0,19,b.name,'middle',13,500,'var(--muted)');
    });

    // вертикальная двусторонняя стрелка между вершинами столбиков
    var y1=h(DATA.bars[0].cells), y2=h(DATA.bars[1].cells), vx=DATA.vArrow.x;
    line(vx,y1+DATA.head.len,vx,y2-DATA.head.len,'var(--accent)',1.6);
    headV(vx,y2,1,'var(--accent)');
    headV(vx,y1,-1,'var(--accent)');
    txt(DATA.vArrow.lx,(y1+y2)/2,8,4,DATA.vArrow.text,'start',13,600,'var(--accent)');

    // горизонтальная двусторонняя стрелка между столбиками
    var c1=DATA.bars[0].cx, c2=DATA.bars[1].cx, hy=DATA.hArrow.y;
    line(c1+DATA.head.len,hy,c2-DATA.head.len,hy,'var(--muted)',1.4);
    headH(c1,hy,-1,'var(--muted)');
    headH(c2,hy,1,'var(--muted)');
    txt(DATA.hArrow.lx,DATA.hArrow.ly,0,4,DATA.hArrow.text,'middle',13,500,'var(--muted)');

    // итоговая подпись сверху
    txt(DATA.caption.x,DATA.caption.y,0,0,DATA.caption.text,'middle',15,700);
  }catch(e){
    host.innerHTML='<p class="fail">Схема должна была показать два столбика в логарифмическом масштабе: '+
      'при N = 2048 матрица внимания — 4,2 млн ячеек на голову на слой, при N = 128 000 — 16,4 млрд. '+
      '×62 по длине = ×3900 по памяти.</p>';
  }
})();
</script>
</html>
