<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Цепочка из 7 шагов против дерева из 3 уровней</title>
<style>
  :root{
    --bg:#fbfaf7; --fg:#23201c; --muted:#6d675e;
    --chain:#b0402c; --tree:#1c6c58; --grid:#c9c3b8; --node:#fbfaf7;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#161719; --fg:#e9e6e1; --muted:#a19a90;
      --chain:#e88a6f; --tree:#6fc9ac; --grid:#464a4f; --node:#161719;
    }
  }
  html,body{margin:0}
  .wrap{background:var(--bg);color:var(--fg);padding:14px 12px 16px;
        font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  h2{margin:0 0 6px;font-size:15px;font-weight:600}
  .sub{margin:0 0 8px;font-size:13px;color:var(--muted)}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg)}
  .fallback{font-size:13px;color:var(--fg);white-space:pre-wrap}
</style>
<div class="wrap">
  <h2>Восемь чисел: цепочка и дерево</h2>
  <p class="sub">Считай не стрелки, а этажи — ряды сверху вниз.</p>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    // ---- данные схемы ----
    var D = {
      leaves: [1,2,3,4,5,6,7,8],
      chainX0: 0,
      treeX0: 12,
      floors: 7,
      geo: { nodeR:0.24, leafR:0.14, trimTail:0.22, trimHead:0.32, headLen:0.20, headHalf:0.11 }
    };
    // ---- одна пара функций перевода ----
    var ORIGIN = {x:74, y:30}, SCALE = 36;
    function sx(x){ return ORIGIN.x + x*SCALE; }
    function sy(y){ return ORIGIN.y + y*SCALE; }
    function len(u){ return sx(u) - sx(0); }

    var NS='http://www.w3.org/2000/svg';
    var svg=document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','0 0 800 374');
    svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    svg.setAttribute('role','img');

    function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
    function line(p,q,stroke,w,dash){
      var e=el('line',{x1:sx(p.x),y1:sy(p.y),x2:sx(q.x),y2:sy(q.y),stroke:stroke,'stroke-width':w});
      if(dash)e.setAttribute('stroke-dasharray',dash);
      return e;
    }
    function dot(p,r,stroke,fill){
      return el('circle',{cx:sx(p.x),cy:sy(p.y),r:len(r),fill:fill,stroke:stroke,'stroke-width':1.5});
    }
    function txt(p,s,dx,dy,anchor,size,fill,weight){
      var t=el('text',{x:sx(p.x)+dx,y:sy(p.y)+dy,'text-anchor':anchor,
        'font-size':size,fill:fill,'font-family':'inherit'});
      if(weight)t.setAttribute('font-weight',weight);
      t.textContent=s;return t;
    }
    function arrow(p,q,color){
      var dx=q.x-p.x, dy=q.y-p.y, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L;
      var g=D.geo;
      var a={x:p.x+ux*g.trimTail, y:p.y+uy*g.trimTail};
      var b={x:q.x-ux*g.trimHead, y:q.y-uy*g.trimHead};
      line(a,b,color,1.4);
      var base={x:b.x-ux*g.headLen, y:b.y-uy*g.headLen};
      var px=-uy, py=ux;
      var c1={x:base.x+px*g.headHalf, y:base.y+py*g.headHalf};
      var c2={x:base.x-px*g.headHalf, y:base.y-py*g.headHalf};
      el('polygon',{points:sx(b.x)+','+sy(b.y)+' '+sx(c1.x)+','+sy(c1.y)+' '+sx(c2.x)+','+sy(c2.y),fill:color});
    }

    // ---- этажи ----
    for(var f=1; f<=D.floors; f++){
      line({x:-0.35,y:f},{x:19.35,y:f},'var(--grid)',1,'3 5');
      txt({x:-0.55,y:f},String(f),0,4,'end',12,'var(--muted)');
    }
    txt({x:-0.55,y:0},'этаж',0,4,'end',12,'var(--muted)');

    // ---- листья ----
    function leaves(x0,color){
      return D.leaves.map(function(v,i){
        var p={x:x0+i,y:0};
        dot(p,D.geo.leafR,color,color);
        txt(p,String(v),0,-11,'middle',12,'var(--fg)');
        return p;
      });
    }
    var LC=leaves(D.chainX0,'var(--fg)');
    var LT=leaves(D.treeX0,'var(--fg)');

    // ---- цепочка: 7 сложений, каждое на своём этаже ----
    var prev=LC[0], edges=[], nodes=[];
    for(var k=1;k<D.leaves.length;k++){
      var n={x:(prev.x+LC[k].x)/2, y:k};
      edges.push([prev,n],[LC[k],n]); nodes.push(n); prev=n;
    }
    // ---- дерево: 4 пары, потом 2, потом 1 ----
    var lvl=LT, edges2=[], nodes2=[], d=1;
    while(lvl.length>1){
      var nx=[];
      for(var i=0;i<lvl.length;i+=2){
        var m={x:(lvl[i].x+lvl[i+1].x)/2, y:d};
        edges2.push([lvl[i],m],[lvl[i+1],m]); nodes2.push(m); nx.push(m);
      }
      lvl=nx; d++;
    }

    edges.forEach(function(e){arrow(e[0],e[1],'var(--chain)');});
    edges2.forEach(function(e){arrow(e[0],e[1],'var(--tree)');});
    function drawNodes(list,color){
      list.forEach(function(n){
        dot(n,D.geo.nodeR,color,'var(--node)');
        txt(n,'+',0,4,'middle',12,color,'600');
      });
    }
    drawNodes(nodes,'var(--chain)');
    drawNodes(nodes2,'var(--tree)');

    // ---- подписи ----
    txt({x:1.6,y:5.45},'друг за другом',0,0,'middle',12.5,'var(--muted)');
    txt({x:15.5,y:4.5},'на первом этаже 4 сложения разом',0,0,'middle',12.5,'var(--muted)');
    txt({x:15.5,y:5.3},'этажи 4–7 не нужны',0,0,'middle',12.5,'var(--muted)');

    txt({x:3,y:7.7},'цепочка: 7 операций, 7 этажей',0,0,'middle',14,'var(--chain)','600');
    txt({x:15.5,y:7.7},'дерево: 7 операций, 3 этажа',0,0,'middle',14,'var(--tree)','600');

    txt({x:9.5,y:8.5},'операций 7 и 7 — поровну',0,0,'middle',13,'var(--fg)');
    txt({x:9.5,y:9.15},'глубина 7 против 3 = log2(8)',0,0,'middle',13,'var(--fg)','600');

    host.appendChild(svg);
  }catch(err){
    var p=document.createElement('div');
    p.className='fallback';
    p.textContent='Схема не построилась. Она должна показывать: восемь чисел складывают двумя способами. '
      +'Слева цепочка — 7 сложений, каждое на своём этаже, всего 7 этажей. '
      +'Справа дерево — 4 сложения на первом этаже разом, потом 2, потом 1, всего 3 этажа. '
      +'Операций 7 и 7 — поровну; глубина 7 против 3 = log2(8).';
    host.appendChild(p);
  }
})();
</script>
</html>
