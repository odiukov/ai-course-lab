- concept: встроенное суммирование быстрее явного цикла Python благодаря меньшим накладным расходам интерпретатора
  question: Почему sum(xs) обычно быстрее эквивалентного цикла с обновлением total в Python, хотя обе реализации просматривают все элементы?
  explanation: Обе реализации имеют линейную вычислительную сложность, но явный цикл многократно исполняет Python-инструкции. Встроенное суммирование выполняет перебор на более низком уровне, поэтому его постоянные накладные расходы меньше.
  kind: choice
  options:
    - sum автоматически пропускает часть элементов списка
    - Основной цикл sum выполняется в оптимизированном коде реализации Python и не интерпретирует тело пользовательского цикла для каждого элемента
    - sum меняет математическое среднее на приближённое значение
    - Время работы sum не зависит от длины списка
