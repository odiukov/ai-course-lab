- concept: все взвешенные суммы self-attention вычисляются матричным произведением весов внимания и значений
  question: 'Матрица A содержит веса внимания: строка i задаёт веса для выходной позиции i. Строки матрицы V содержат векторы значений. Как получить матрицу всех выходов?'
  explanation: 'Строка i произведения AV равна сумме по j: a_ij v_j. Поэтому одно матричное умножение вычисляет взвешенные суммы сразу для всех выходных позиций.'
  kind: choice
  options:
    - AV
    - VA
    - A + V
    - V − A
  correct: 0
  id: 013-attention-broadcast-1
  fingerprint: 2362a25b
- concept: слагаемые взвешенной суммы внимания допускают независимое вычисление и параллельную редукцию
  question: Почему после получения весов a_ij и значений v_j слагаемые суммы output_i = sum_j(a_ij v_j) можно вычислять параллельно и складывать в произвольном порядке?
  explanation: 'Индекс j перечисляет независимые вклады, а не последовательные состояния. Наличие знака суммы само по себе не создаёт цепочку зависимостей: независимые произведения можно посчитать одновременно и затем просуммировать.'
  kind: open
  reference: Каждое произведение a_ij v_j определяется независимо от остальных слагаемых, а сложение допускает группировку. Поэтому произведения можно считать одновременно, а затем объединять древовидной параллельной редукцией.
  id: 013-attention-broadcast-2
  fingerprint: 9b53b800
- concept: влияние изменения одного вектора значения на выход масштабируется соответствующим весом внимания
  question: Веса внимания считаются зафиксированными. Вектор значения v_k изменился на Δ. Заполни пропуск, указав изменение выхода позиции i.
  explanation: 'В сумме output_i = sum_j(a_ij v_j) изменение v_k затрагивает только слагаемое с индексом k. Поэтому выход изменяется на a_ik Δ: вес внимания определяет силу вклада этого значения.'
  kind: cloze
  template: Δoutput_i = ___
  answer: a_ik Δ
  accept:
    - a_ik * Δ
    - a_{ik} Δ
    - a_{ik} * Δ
    - a_ik · Δ
  id: 013-attention-broadcast-3
  fingerprint: 14688ab2
