- concept: доступ декодера ко всем представлениям энкодера устраняет обязательное сжатие входа в единственный вектор
  question: Объясни своими словами, почему возможность декодера обращаться к представлениям отдельных позиций исходного текста ослабляет информационное бутылочное горлышко.
  explanation: В классической encoder–decoder RNN после чтения входа декодер получает только последнее скрытое состояние. Доступ к представлениям всех позиций сохраняет более подробный канал между входом и выходом и позволяет заново обратиться к нужной части оригинала.
  kind: open
  reference: Декодеру больше не нужно восстанавливать весь исходный текст из одной фиксированной сводки. При генерации каждого слова он может выбрать релевантные позиции входа и получить их представления напрямую, поэтому детали длинной последовательности не обязаны одновременно помещаться в один вектор.
  id: 006-fiksirovannyj-vektor-2
