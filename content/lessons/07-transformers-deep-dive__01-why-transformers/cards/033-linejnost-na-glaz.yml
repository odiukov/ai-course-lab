- concept: для измерения асимптотического роста полезная работа должна заметно превосходить шум таймера и постоянные накладные расходы
  question: Почему по таймингам очень коротких входов трудно определить сложность алгоритма и как выбрать более подходящий диапазон измерений?
  explanation: Асимптотическую зависимость видно лишь там, где её вклад больше случайных колебаний и постоянных затрат запуска. Поэтому проверяют несколько достаточно крупных входов и сопоставляют относительный рост времени с относительным ростом размера.
  kind: open
  reference: На коротких входах измеряемое время сопоставимо с шумом системы, прогревом и постоянными накладными расходами, поэтому отношения таймингов нестабильны. Нужно увеличить размеры входов настолько, чтобы полезная работа доминировала над этим шумом, а затем сравнить множители роста размера и времени.
