- concept: зависимость каждого скрытого состояния от предыдущего запрещает параллельное вычисление позиций
  question: Почему обычная рекуррентная сеть не может одновременно вычислить скрытые состояния для всех токенов последовательности?
  explanation: 'Состояние очередной позиции зависит от уже вычисленного состояния предыдущей. Поэтому позиции образуют последовательную цепочку: ускорить отдельный шаг на GPU можно, но выполнить все временные шаги одновременно нельзя.'
  kind: choice
  options:
    - Для каждого токена требуется отдельный набор весов
    - Каждому состоянию нужен результат вычисления предыдущего состояния
    - GPU умеет обрабатывать только один токен за запуск
    - Все токены сначала необходимо объединить в один входной вектор
