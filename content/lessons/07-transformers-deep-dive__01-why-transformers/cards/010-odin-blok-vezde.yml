  fingerprint: 177039b1
- concept: подготовка данных любой модальности к обработке общим блоком трансформера
  question: Расположи этапы подготовки необработанных данных новой модальности к обработке трансформером.
  explanation: Трансформер получает не исходные пиксели, звуковую волну или символы белка, а последовательность векторов. Способ разбиения и кодирования зависит от модальности, тогда как основной блок может оставаться тем же.
  kind: order
  items:
    - Разделить вход на осмысленные элементы или фрагменты
    - Преобразовать каждый элемент в векторное представление
    - Собрать векторы в последовательность
    - Передать последовательность общему блоку трансформера
  id: 010-odin-blok-vezde-2
