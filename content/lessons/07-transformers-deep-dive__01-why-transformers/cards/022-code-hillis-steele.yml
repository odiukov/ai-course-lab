- concept: каждый раунд скана Хиллиса — Стила читает неизменный снимок предыдущего раунда
  question: Что нарушится, если во время раунда скана Хиллиса — Стила читать и обновлять один и тот же список слева направо?
  explanation: Все обновления одного раунда должны вычисляться из состояния предыдущего раунда. При обновлении на месте поздняя позиция может использовать уже изменённого соседа. Поэтому результаты записывают в отдельный список и заменяют рабочее состояние только после завершения раунда.
  kind: choice
  options:
    - Поздние позиции смогут прочитать значения, уже изменённые в текущем раунде
    - Изменится только расход памяти, а результат останется прежним
    - Возникнут лишь небольшие погрешности округления
    - Результат сохранится, но элементы окажутся записаны в обратном порядке
  correct: 0
  id: 022-code-hillis-steele-1
  fingerprint: 805eb489
- concept: инвариант раундов скана Хиллиса — Стила
  question: Сформулируй инвариант, который объясняет, почему после завершения скана Хиллиса — Стила каждый элемент становится правильной префиксной суммой.
  explanation: Сдвиг удваивается после каждого раунда, поэтому к уже накопленному правому фрагменту присоединяется соседний фрагмент слева. В итоге для каждой позиции накопленный фрагмент доходит до начала массива.
  kind: open
  reference: После каждого завершённого раунда элемент хранит сумму непрерывного фрагмента, заканчивающегося в его позиции, причём охватываемая длина удваивается от раунда к раунду и ограничивается началом массива. Когда этот фрагмент охватывает всё от начала массива до текущей позиции, значение равно соответствующей префиксной сумме.
  id: 022-code-hillis-steele-2
  fingerprint: 39d89027
