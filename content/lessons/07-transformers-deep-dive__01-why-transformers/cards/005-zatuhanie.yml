- concept: гейты LSTM и GRU замедляют затухание градиента, но не гарантируют сохранение сигнала на любой дистанции
  question: Как точнее всего описать влияние гейтов LSTM и GRU на обучение длинным зависимостям?
  explanation: Гейты создают более удобный путь для сохранения информации и градиента. Однако зависимость всё ещё проходит через последовательную цепочку, поэтому множители, немного меньшие единицы, на большой дистанции снова дают очень малый сигнал.
  kind: choice
  options:
    - Они полностью исключают умножение производных при обратном распространении
    - Они позволяют приблизить эффективный множитель к единице и замедлить затухание, но на достаточно длинной цепочке сигнал всё равно может ослабнуть
    - Они передают градиент напрямую от выхода ко всем входным токенам
    - Они заменяют обратное распространение отдельным алгоритмом запоминания
