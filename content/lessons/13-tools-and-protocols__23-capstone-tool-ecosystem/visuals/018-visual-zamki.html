<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Пять замков защиты</title>
<style>
  :root {
    --bg: #fbfaf7;
    --fg: #1c1a17;
    --muted: #6b6660;
    --line: #3a3632;
    --lock: #d9d3c8;
    --lockb: #8a8278;
    --path: #b4552a;
    --design: #5a6b8a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --fg: #e8e6e1;
      --muted: #9a958d;
      --line: #b8b3ab;
      --lock: #262a30;
      --lockb: #6f7push;
      --lockb: #6f7780;
      --path: #e0844f;
      --design: #8fa4c8;
    }
  }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
  .wrap {
    background: var(--bg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 8px 10px 10px;
    box-sizing: border-box;
  }
  h2 { font-size: 15px; margin: 0 0 6px; font-weight: 600; }
  svg { display: block; width: 100%; height: auto; max-height: 470px; }
  .fail { font-size: 13px; color: var(--muted); line-height: 1.5; }
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--fg); }
</style>
</head>
<body>
<div class="wrap">
  <h2>Пять замков защиты: запрос обязан пройти все пять</h2>
  <div id="host"></div>
</div>
<script>
(function () {
  var host = document.getElementById("host");
  try {
    // ---- данные схемы -------------------------------------------------
    var LOCKS = [
      { y: 5, n: "1", t: "OAuth 2.1 + PKCE", s: "resource indicator прибивает audience к шлюзу", when: "на входе" },
      { y: 4, n: "2", t: "Credential vaulting", s: "credentials провайдера живут на шлюзе", when: "на входе" },
      { y: 3, n: "3", t: "RBAC", s: "alice: research:read + research:write; bob: только read", when: "на каждом вызове" },
      { y: 2, n: "4", t: "Прибитые хэши", s: "хэш описания изменился — сервер отключается", when: "при подключении сервера" },
      { y: 1, n: "5", t: "Rule of Two", s: "нет инструмента с тремя опасными свойствами сразу", when: "при проектировании" }
    ];

    // ---- одна система координат ---------------------------------------
    var originX = 118, originY = 34, scaleX = 118, scaleY = 66;
    function sx(x) { return originX + x * scaleX; }
    function sy(y) { return originY + (6 - y) * scaleY; }

    // ---- литералы: холст, отступы подписей, штрихи ---------------------
    var VBW = 860, VBH = 448;
    var PADL = 8, PADT = 5, GAPX = 10, FS = 12.5, FSS = 11, FSN = 13, LW = 1.6;

    var NS = "http://www.w3.org/2000/svg";
    function el(n, a) {
      var e = document.createElementNS(NS, n);
      for (var k in a) e.setAttribute(k, a[k]);
      return e;
    }
    function label(x, y, s, anchor, cls, size) {
      var t = el("text", { x: x, y: y, "text-anchor": anchor, "font-size": size });
      if (cls) t.setAttribute("fill", cls);
      t.textContent = s;
      return t;
    }

    var svg = el("svg", {
      viewBox: "0 0 " + VBW + " " + VBH,
      preserveAspectRatio: "xMidYMid meet",
      role: "img",
      "aria-label": "Пять слоёв защиты и путь запроса через них"
    });
    svg.appendChild(el("rect", { x: 0, y: 0, width: VBW, height: VBH, fill: "var(--bg)" }));

    var defs = el("defs", {});
    var mk = el("marker", {
      id: "ah", markerWidth: "8", markerHeight: "8",
      refX: "6.5", refY: "3", orient: "auto", markerUnits: "strokeWidth"
    });
    mk.appendChild(el("path", { d: "M0,0 L7,3 L0,6 z", fill: "var(--path)" }));
    defs.appendChild(mk);
    svg.appendChild(defs);

    // ---- слои ----------------------------------------------------------
    LOCKS.forEach(function (L) {
      var top = sy(L.y) - (sy(0) - sy(0.62)) / 2;
      var h = sy(0) - sy(0.62);
      var x0 = sx(0), x1 = sx(4.2);

      svg.appendChild(el("rect", {
        x: x0, y: top, width: x1 - x0, height: h, rx: 6,
        fill: "var(--lock)", stroke: "var(--lockb)", "stroke-width": LW
      }));

      // номер замка — слева внутри слоя
      svg.appendChild(label(x0 + GAPX, sy(L.y) + PADT, L.n, "start", "var(--lockb)", FSN));
      // название — над средней линией слоя
      svg.appendChild(label(x0 + GAPX * 3, sy(L.y) - PADT, L.t, "start", null, FS));
      // расшифровка — под средней линией слоя
      svg.appendChild(label(x0 + GAPX * 3, sy(L.y) + PADT * 3.1, L.s, "start", "var(--muted)", FSS));
      // момент срабатывания — справа от слоя, снаружи
      svg.appendChild(label(x1 + GAPX, sy(L.y) + PADT, L.when, "start",
        L.y === 1 ? "var(--design)" : "var(--muted)", FSS));
    });

    // ---- путь запроса ---------------------------------------------------
    var px = sx(-0.36);
    svg.appendChild(el("path", {
      d: "M" + px + "," + sy(5.72) + " L" + px + "," + sy(1.72),
      stroke: "var(--path)", "stroke-width": LW + 0.6, fill: "none", "marker-end": "url(#ah)"
    }));
    LOCKS.forEach(function (L) {
      if (L.y === 1) return;
      svg.appendChild(el("path", {
        d: "M" + px + "," + sy(L.y) + " L" + sx(0) + "," + sy(L.y),
        stroke: "var(--path)", "stroke-width": LW, fill: "none"
      }));
      svg.appendChild(el("circle", { cx: px, cy: sy(L.y), r: 3.4, fill: "var(--path)" }));
    });

    // подпись пути — у хвоста стрелки, слева
    svg.appendChild(label(px - GAPX, sy(5.72) - PADT * 1.4, "запрос", "end", "var(--path)", FS));
    // хвост входа
    svg.appendChild(el("path", {
      d: "M" + sx(-0.9) + "," + sy(5.72) + " L" + px + "," + sy(5.72),
      stroke: "var(--path)", "stroke-width": LW, fill: "none"
    }));

    // пятый замок стоит вне рантайма — пунктир вместо ветки пути
    svg.appendChild(el("path", {
      d: "M" + px + "," + sy(1.72) + " L" + px + "," + sy(1) + " L" + sx(0) + "," + sy(1),
      stroke: "var(--design)", "stroke-width": LW, fill: "none", "stroke-dasharray": "5 4"
    }));

    // ---- вывод и легенда --------------------------------------------------
    var out = sy(0.28);
    svg.appendChild(el("path", {
      d: "M" + sx(0) + "," + out + " L" + sx(4.2) + "," + out,
      stroke: "var(--line)", "stroke-width": LW, fill: "none"
    }));
    svg.appendChild(label(sx(0), out + PADT * 3.4,
      "Взломать надо все пять, и по очереди: разные данные, разный момент, разная логика отказа.",
      "start", "var(--muted)", FSS));
    svg.appendChild(label(sx(0), out + PADT * 6.2,
      "Токен alice снимает один замок из пяти. Пунктир — Rule of Two: он не в рантайме.",
      "start", "var(--muted)", FSS));

    host.appendChild(svg);
  } catch (e) {
    host.innerHTML = '<p class="fail">Схема должна была показать пять слоёв защиты друг за другом — ' +
      'OAuth 2.1 + PKCE, credential vaulting, RBAC, прибитые хэши, Rule of Two — ' +
      'и путь запроса, который прошивает первые четыре в рантайме (на входе, на входе, ' +
      'на каждом вызове, при подключении сервера), тогда как пятый срабатывает раньше, ' +
      'на этапе проектирования инструмента. Украденный токен alice снимает один замок из пяти.</p>';
  }
})();
</script>
</body>
</html>
