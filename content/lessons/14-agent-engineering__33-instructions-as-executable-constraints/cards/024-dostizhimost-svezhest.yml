- concept: битая ссылка в роутере — нарушение startup-проверки, а не косметический дефект
  question: Роутер ссылается на файл правил, который переместили. Как это классифицируется?
  explanation: 'Битый указатель создаёт ложную уверенность: набор правил выглядит доставленным, а часть ограничений до агента не доходит. Отсутствие ссылки хотя бы заметно. Поэтому целостность ссылок роутера проверяется на входе, как обычное startup-условие.'
  kind: choice
  options:
    - 'Как нарушение startup-проверки: указатель, который никуда не ведёт, хуже отсутствующего правила'
    - 'Как незначительная опечатка: правило сохранилось, агент найдёт его поиском'
    - 'Как нарушение approval-правила: перемещение файла требовало согласования'
