- concept: 'тест свежести опирается на обозримость роутера: только перечитываемый на каждом ревью файл не зарастает обратно'
  question: Что проверяет тест свежести для корневого роутера и почему его размер — не эстетическое требование?
  explanation: Достижимость защищает маршрут к правилу, свежесть — саму карту от зарастания. Бюджет роутера в уроке — меньше примерно 50 строк, и он существует именно ради перечитываемости.
  kind: open
  reference: Свежесть — это не дата последней правки, а возможность ревьюера реально перечитывать роутер целиком на каждом PR. Пока файл укладывается в несколько десятков строк, в диффе видны новый абзац, лишнее объяснение и устаревший путь. Когда роутер разрастается до сотен строк, ревьюер перестаёт его перечитывать, изменения проскальзывают, и карта постепенно превращается обратно в энциклопедию, которую она заменила. Размер здесь — механизм проверки, а не вкус.
  id: 024-dostizhimost-svezhest-3
