- concept: автор мечтательного правила молча достраивает недостающий контекст из своего опыта, а исполнитель этот контекст вместе со словами не получает
  question: Руководитель уверен, что инструкция «не трогай критичные сервисы» предельно ясна, но исполнители нарушают её раз за разом. Объясни своими словами, почему формулировка кажется автору достаточной, и что нужно добавить, чтобы она управляла работой.
  explanation: Оценочные слова «критичный», «аккуратно», «тщательно» звучат разумно, потому что читатель-человек подставляет контекст сам. Правило становится исполняемым, когда контекст выписан явно и по нему можно судить о выполнении.
  kind: open
  reference: 'Автор читает свою фразу вместе с невысказанным знанием: он помнит, какие именно сервисы считаются критичными, какие операции над ними опасны и у кого спрашивать разрешение. Слова передаются, знание — нет. Исполнитель получает только оценочное прилагательное и вынужден угадывать список. Чтобы фраза стала правилом, надо заменить оценку перечислимым признаком: назвать конкретные сервисы или каталоги, назвать запрещённые операции и указать проверяемый след (например, изменённые файлы не пересекаются с указанным списком путей).'
