- concept: 'вердикты startup и forbidden независимы: каждый относится к своему интервалу трейса'
  question: На входе startup-правило подтвердило наличие свежего файла состояния. Позже в том же прогоне агент отредактировал защищённый скрипт. Какой набор вердиктов корректен?
  explanation: Каждое правило получает собственный вердикт по своему интервалу. Startup честно описывает состояние на входе и не отменяется поздними событиями; нарушение запрета фиксируется отдельным вердиктом. Смешивать их — значит терять информацию о том, что именно сломалось.
  kind: choice
  options:
    - Startup — пройдено, forbidden — нарушено
    - Startup становится проваленным задним числом, потому что прогон оказался плохим
    - 'Прогон считается валидным: вход был корректен, значит проверки соблюдены'
  correct: 0
  id: 020-startup-forbidden-1
  fingerprint: 6909521f
- concept: startup-правило фиксирует состояние на входе и не обязывает поддерживать это условие в ходе работы
  question: 'Правило требует: до начала работы бэкап должен быть не старше 12 часов. Что оно гарантирует?'
  explanation: Startup описывает предусловие входа. Сохранность бэкапа во время работы — другое требование, и оно нуждается в собственном правиле с проверкой по событиям прогона. Упоминание объекта в одном правиле не защищает его в остальных.
  kind: choice
  options:
    - Что бэкап останется целым и пригодным до конца прогона
    - Только то, что в момент входа в задачу бэкап был достаточно свежим
    - Что агент не удалит бэкап, потому что бэкап упомянут в правиле
  correct: 1
  id: 020-startup-forbidden-2
  fingerprint: c20c2a09
- concept: forbidden-вердикт определяется единственным вхождением запрещённого события, а не долей корректных действий
  question: В трейсе 48 действий, из них 47 безупречны, а одно — удаление исходных данных, запрещённое правилом. Каким будет вердикт по этому правилу?
  explanation: 'Запрет — это утверждение о существовании: запрещённого события не должно быть ни разу. Поэтому проверяющая функция ищет вхождение, а не считает статистику; порог «сколько раз можно» превратил бы запрет в рекомендацию.'
  kind: choice
  options:
    - 'Нарушено: запрет проваливается от одного вхождения запрещённого события'
    - 'Пройдено с замечанием: доля корректных действий подавляюще высока'
    - 'Не определено: одного события мало, нужна повторяемость'
  correct: 0
  id: 020-startup-forbidden-3
  fingerprint: 39a56aa5
