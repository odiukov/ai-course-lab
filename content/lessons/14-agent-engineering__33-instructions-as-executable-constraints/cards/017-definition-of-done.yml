- concept: правило готовности доказывает только записанное в нём условие; другие требования приёмки нуждаются в собственных проверках
  question: Правило готовности требует успешного прогона тестов модуля скидок, и этот прогон прошёл. Что доказано?
  explanation: Проверка отвечает на узкое условие, а не аттестует работу целиком. Если приёмка требует ещё чего-то, это отдельные правила со своими проверками — расширять смысл одной удачной команды нельзя.
  kind: choice
  options:
    - 'Задача сделана правильно целиком: тесты — главный критерий качества'
    - Доказано ровно то условие, что записано в правиле; форматирование и чистота рабочего дерева требуют отдельных проверок
    - 'Ничего: тест мог быть написан самим агентом, поэтому его результат не свидетельство'
  correct: 1
  id: 017-definition-of-done-1
  fingerprint: 930b5369
- concept: команда даёт наблюдаемое поведение в момент прогона, сохранённый артефакт — свидетельство, переживающее прогон
  question: Правило готовности требует и успешного завершения команды, и файла приёмки с определённой строкой. Зачем файл, если команда уже отработала?
  explanation: 'Две части несут разные роли: команда показывает поведение, артефакт делает его перепроверяемым после того, как процесс завершился и вывод исчез.'
  kind: choice
  options:
    - Файл страхует от случая, когда код возврата команды посчитан неверно
    - Файл сохраняет свидетельство, которое можно открыть позже и передать следующему проверяющему, тогда как результат команды существует только в момент прогона
    - Файл нужен, чтобы агент не забыл, какие тесты он запускал
  correct: 1
  id: 017-definition-of-done-2
  fingerprint: cd552eb5
