- concept: 'недостающее обязательное поле нельзя восстановить догадкой: исполняться будет правило, которого автор не писал'
  question: 'Парсеру предлагают удобство: если поле check не заполнено, выводить имя проверки из slug записи. Объясни своими словами, почему такая догадка хуже честного отказа.'
  explanation: 'Восстановление данных наугад создаёт правило-фантом: формально проверка есть, содержательно она чужая. Формат обязательных полей на то и обязательный, что заполнять его может только автор.'
  kind: open
  reference: 'Slug — человеческое имя правила, оно не обязано совпадать с именем функции в rule_checker.py и может быть переписано без изменения проверки. Догадка либо не найдёт функцию, либо найдёт чужую — и тогда правило будет проверять не то, что написано в его описании. Автор при этом уверен, что записал правило корректно: ошибка не всплывает ни при разборе, ни при применении, а проявляется как неверный вердикт по трейсу. Отказ на разборе возвращает ответственность автору записи, пока ещё известно, какая запись неполна.'
  id: 010-oshibki-parsera-2
  fingerprint: c03689fc
