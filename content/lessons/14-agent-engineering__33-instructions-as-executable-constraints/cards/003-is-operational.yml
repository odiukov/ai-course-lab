  question: Правило «перед коммитом удаляй все файлы логов из репозитория» команда считает вредным, но `is_operational` возвращает для него `true`. Ошибка ли это классификатора?
  explanation: 'Операционность и полезность — разные оси. «Удали файлы логов» проверяется по дереву репозитория, поэтому форма корректна; спорить нужно о содержании правила, а не о метке классификатора. Смешение осей ломает функцию: она начинает возвращать `false` для проверяемых правил, которые кому-то не нравятся.'
  kind: choice
  options:
