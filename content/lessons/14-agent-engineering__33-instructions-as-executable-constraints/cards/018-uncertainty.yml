- concept: правило категории Uncertainty обязано назвать признак срабатывания и предписанное действие с наблюдаемым следом
  question: Что делает правило категории Uncertainty исполняемым?
  explanation: Проверить можно события, а не внутреннее состояние. Признак говорит, когда правило срабатывает, предписанное действие — что должно появиться в трейсе или файлах; порог уверенности не даёт ни того, ни другого, потому что число агент назовёт сам.
  kind: choice
  options:
    - Порог уверенности в процентах, ниже которого агент обязан остановиться
    - Названный признак неопределённости и предписанное действие, оставляющее проверяемый след
    - Перечень инструментов, которыми агент не должен пользоваться при сомнении
  correct: 1
  id: 018-uncertainty-1
  fingerprint: 9c3a919f
- concept: правило неопределённости обязано остановить изменение до её разрешения, иначе догадка исполняется, а запись лишь оформляет её задним числом
  question: Почему правилу категории Uncertainty мало предписать «зафиксируй вопрос в файле»? Что оно должно добавить?
  explanation: 'Фиксация вопроса делает неопределённость видимой, остановка изменения делает её безопасной. Проверяются оба следа: наличие записи и отсутствие последующей правки.'
  kind: open
  reference: 'Запись вопроса без запрета на действие позволяет агенту всё равно выбрать вариант наугад и приложить к нему заметку — догадка уже исполнена, а файл лишь оформляет её задним числом. Правило должно явно запрещать изменение до разрешения неопределённости, тогда в трейсе появляются два проверяемых факта: запись вопроса есть, правки после неё нет. Это оставляет систему в состоянии, из которого человек может продолжить без отката.'
  id: 018-uncertainty-2
  fingerprint: 65b00b35
