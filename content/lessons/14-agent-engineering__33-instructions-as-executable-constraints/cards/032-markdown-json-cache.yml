- concept: синхронизацию источника и кеша держит автоматический шаг перед коммитом, а не дисциплина редактирования двух файлов
  question: Расставь шаги от правки правила до его применения проверяльщиком.
  explanation: Два файла с одними данными расходятся при любой ручной дисциплине. Автоматическая пересборка перед коммитом делает расхождение невозможным, а остановка сборки на повреждённой записи не даёт старому кешу маскировать ошибку в источнике.
