- concept: 'роли файлов разделены по стоимости: читаемость и дифф для человека, быстрый одинаковый разбор для машины'
  question: Правила уже записаны в читаемом markdown. Зачем держать рядом сгенерированную JSON-копию?
  explanation: 'Та же форма, что у пары «манифест зависимостей + lock-файл»: правят одно, читают другое.'
  kind: open
  reference: 'Форматы оптимизированы под разных потребителей. Markdown даёт обозримый дифф: на ревью видно, какая формулировка или строгость изменилась. Но разбирать markdown приходится на горячем пути — при каждом запуске проверки, — и разбор чувствителен к оформлению. JSON читается быстро и одинаково в любом окружении, поэтому он берёт на себя роль кеша. Человек редактирует удобное, машина читает быстрое, а генерация связывает их так, что второй версии контракта не возникает.'
