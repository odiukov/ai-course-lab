- concept: обход правила уровня block фиксируется в аудит-логе overrides.jsonl, поэтому принятие риска остаётся именной и разбираемой записью
  question: Оператору нужно выпустить релиз, несмотря на сработавшее правило уровня `block`. Зачем такому обходу требуется подписанная запись в аудит-логе `overrides.jsonl`?
  explanation: 'Обход `block` — решение человека принять риск. Без следа такие решения накапливаются молча, и правило превращается в формальность, которую все привыкли пропускать. Аудит-лог делает обход видимым: кто, когда и почему. Понижением severity лог не занимается — это делает человек на квартальном разборе.'
  kind: choice
  options:
    - 'Чтобы обход был возможен: без записи в лог рантайм не умеет продолжать работу'
    - Чтобы принятие риска имело автора и причину и попало на последующее ревью, а не исчезло бесследно
    - Чтобы автоматически понизить severity правила до `warn` при следующем прогоне
    - Чтобы восстановить прерванный прогон агента с точки остановки
