- concept: генерация набора правил начинается с интервью владельца, потому что иначе генератор заполняет пробелы догадками и становится автором политики
  question: Почему генератор набора правил сначала интервьюирует владельца проекта, а не сразу выдаёт готовый файл?
  explanation: Роль инструмента — редактор и структуризатор, а не источник политики.
  kind: open
  reference: 'Готовый с первого раза файл подозрительно полон: в нём есть правила на любой случай, включая решения, которых владелец никогда не принимал. Это значит, что пробелы заполнены догадками, и авторство политики незаметно перешло к генератору — а отвечать за последствия будет команда. Интервью извлекает конкретные ситуации: что проверять перед работой, чего не делать никогда, чем доказывать готовность, как поступать при сомнении, когда звать человека. Генератор раскладывает уже существующие решения и возвращает владельцу вопросы там, где решения нет; только после этого появляются версионированный файл правил и заготовка проверяльщика.'
  id: 035-builder-artifact-2
