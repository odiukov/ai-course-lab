- concept: 'гранулярность диффа задаётся структурой файла: один заголовок на правило локализует правку до одной секции'
  question: В наборе 30 правил меняют формулировку одного. Какая раскладка файла позволяет ревьюеру увидеть, что затронуто ровно одно правило?
  explanation: Дифф показывает изменённые строки, а не смысл. Внутри общего абзаца правка одного правила выглядит как переделка всего блока, и ревьюер вынужден перечитывать его целиком. Отдельный заголовок делает границу правила границей изменения.
  kind: choice
  options:
    - Правила сгруппированы в общие абзацы по темам
    - Каждое правило живёт под собственным заголовком
    - Правила отсортированы по алфавиту внутри одного абзаца
  correct: 1
  id: 021-diff-friendly-1
  fingerprint: 0e80cc25
- concept: файл правил — источник истины о действующем наборе, поэтому устаревшее правило удаляется, а не комментируется
  question: Правило перестало действовать. Почему его удаляют из файла, а не оставляют закомментированным?
  explanation: Набор правил — рабочий источник истины, а не журнал прошлых решений. Читатель закомментированного правила не может отличить отменённое от временно отключённого. История правок и так хранится в системе контроля версий.
  kind: choice
  options:
    - Комментарии увеличивают размер файла и замедляют разбор
    - Файл должен показывать только то, что действует сейчас; закомментированная запись оставляет вопрос, применяется она или нет
    - Синтаксис markdown не поддерживает комментарии внутри списка правил
  correct: 1
  id: 021-diff-friendly-2
  fingerprint: 4a16e3d6
- concept: новое правило встаёт наверх своей категории, чтобы вставка не порождала изменений в соседних правилах
  question: Куда добавляют новое правило в файле, разложенном по категориям, и что это даёт диффу?
  explanation: 'Правило попадает в свою категорию, чтобы оставаться найденным, и наверх — чтобы вставка не сдвигала и не переписывала соседние секции. Ревью тогда сводится к одному вопросу: приемлемо ли добавленное правило.'
  kind: choice
  options:
    - 'Наверх своей категории: дифф показывает только добавленный блок, соседние правила не тронуты'
    - 'В конец файла: так проще найти самые новые требования'
    - 'В середину списка по важности: дифф всё равно покажет одно изменение'
