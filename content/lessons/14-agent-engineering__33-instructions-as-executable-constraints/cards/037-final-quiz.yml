- concept: у мечтательного правила ровно два допустимых исхода — удалить или доработать до проверяемого; сохранить его в наборе как есть нельзя
  question: 'При ревизии набора правил найдена запись «относись к пользовательским данным ответственно»: проверить её workbench не может. Какие исходы допустимы для такой записи?'
  explanation: 'Запись без проверки ничего не принуждает: она создаёт видимость контракта, за которой стоит догадка исполнителя. Понижение severity или переезд в другой раздел проверку не добавляют. Поэтому исходов ровно два — удалить или довести до проверяемого вида.'
  kind: choice
  options:
    - 'Только два: удалить запись либо доработать её до формулировки с проверяемым условием'
    - Оставить как есть, пометив пониженным уровнем severity
    - Оставить как есть, но перенести в отдельный раздел «принципы» того же набора правил
    - Оставить как есть и поручить агенту самому решать, что считать ответственным обращением
  correct: 0
  id: 037-final-quiz-1
  fingerprint: 496f461b
- concept: 'жизненный цикл одного правила: от формулировки наблюдаемого условия до итогового вердикта прогона'
  question: Расставь по порядку шаги превращения прозаического пожелания в действующее ограничение прогона.
  explanation: 'Каждый шаг опирается на предыдущий: без наблюдаемого условия нечего записывать, без разрешённого имени функции нечего исполнять, без вердиктов нечего сводить. Разрыв в любом месте цепочки даёт набор, который выглядит контрактом, но ничего не принуждает.'
  kind: order
  items:
    - 'Сформулировать условие через наблюдаемое свидетельство: какое событие или артефакт подтверждает выполнение'
    - Записать правило со всеми обязательными полями, включая имя функции проверки и уровень severity
    - Разрешить имя из check в существующую функцию проверяльщика, иначе отклонить правило
    - Прогнать проверку по трейсу выполнения и получить вердикт с основанием
    - Свести вердикты проваленных правил к итоговому уровню severity и решить судьбу прогона
  id: 037-final-quiz-2
  fingerprint: d95b86ba
- concept: нарушение уровня block не может быть заглушено средствами самого прогона — снятие требует явного решения оператора-человека
  question: Почему правило уровня block отличается от остальных не только силой реакции, но и тем, кто вправе его снять? Объясни своими словами.
  explanation: Смысл уровня block в том, что он неотключаем изнутри автоматики. Если бы прогон мог сам понизить уровень, шкала severity стала бы декоративной — остался бы только тон сообщения, а не остановка.
  kind: open
  reference: 'Уровни ниже block меняют только громкость отчёта: прогон продолжается, и решение по предупреждению остаётся у команды после. Block меняет ход выполнения — прогон останавливается, и продолжить его можно лишь через явное решение человека-оператора. Агент или конфигурация прогона не могут понизить block или заглушить его сами: иначе под давлением сроков любое жёсткое правило превращалось бы в предупреждение, и уровень перестал бы что-либо значить. Именно поэтому снятие block оформляется как отдельное, приписанное человеку действие, а не как настройка внутри прогона.'
  id: 037-final-quiz-3
  fingerprint: 102c7fc2
