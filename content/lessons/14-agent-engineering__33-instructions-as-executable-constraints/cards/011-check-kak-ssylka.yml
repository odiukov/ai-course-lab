- concept: check хранит адрес исполняемой проверки, а не саму проверку и не её результат
  question: 'Правило звучит так: «не поливать грядку, если почва уже влажная». Объясни своими словами, почему программе недостаточно этой фразы и что именно хранится в поле check.'
  explanation: 'Поле check — ссылка, а не содержание. Поэтому при изменении смысла правила недостаточно переписать текст: нужно убедиться, что названная функция проверяет именно новый смысл.'
  kind: open
  reference: 'Фраза на естественном языке не связана ни с какими наблюдаемыми данными: программа не умеет вывести из неё измерение влажности. В поле check лежит не проверка и не её результат, а имя функции из проверяльщика, например `soil_needs_water`. В момент проверки берётся это имя, вызывается соответствующая функция, и уже она работает с наблюдаемыми данными (показанием датчика, следом выполнения) и возвращает результат. Описание объясняет правило человеку, check даёт программе точный адрес действия.'
