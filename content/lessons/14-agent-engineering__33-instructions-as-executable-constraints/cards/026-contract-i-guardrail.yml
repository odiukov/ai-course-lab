- concept: 'формулировка правила не является механизмом принуждения: соблюдение обеспечивает проверка, встроенная в ход выполнения'
  question: 'Агенту записано правило: получить подтверждение человека перед публикацией объявления. В трейсе видно, что он опубликовал объявление без запроса. Какой вывод корректен?'
  explanation: 'Инструкция — это контракт, а не замок. Агент теряет контекст, неверно распознаёт действие или просто отходит от инструкции. Принуждение даёт механизм на уровне исполнения: без зафиксированного подтверждения вызов инструмента не проходит.'
  kind: choice
  options:
    - Правило слишком мягко сформулировано; более категоричная формулировка устранит нарушение
    - Текст правила задаёт ожидание, но не останавливает выполнение; нужен перехват в рантайме (guardrail, interrupt), который не пропускает действие без нужного события
    - Нарушение означает, что правило относилось к неверной категории и его надо переписать как запрет
  correct: 1
  id: 026-contract-i-guardrail-1
  fingerprint: '56707171'
- concept: определения и граница правила (что считается запрещённым действием, какое подтверждение снимает блокировку) принадлежат читаемому набору правил, а не только коду guardrail
  question: Команда встроила перехват перед вызовом инструмента публикации, но записанного правила нигде нет. Что теряется, если оставить только реализацию? Объясни своими словами.
  explanation: Рантайм ловит нарушение по ходу, а набор правил доказывает, что рантайм ловит то, что надо. Границы и определения — свойство контракта, иначе спор о поведении превращается в чтение кода.
  kind: open
  reference: 'Теряется предмет ревью. По коду нельзя обсудить, почему остановка стоит именно перед публикацией, какие действия считаются публикацией и какое именно подтверждение снимает блокировку — эти ответы приходится реконструировать из реализации, и никто не может сказать, настроена ли она правильно. Читаемый набор правил фиксирует, что обязано быть правдой, и позволяет человеку это обсудить и изменить; перехват лишь применяет договорённость. Нужны обе части: контракт без принуждения нарушаем, принуждение без контракта непроверяемо на осмысленность.'
  id: 026-contract-i-guardrail-2
  fingerprint: 1d390027
