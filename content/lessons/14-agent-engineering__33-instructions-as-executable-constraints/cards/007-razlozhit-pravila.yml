- concept: Forbidden закрывает действие безусловно, Approval оставляет для него путь через человеческое согласие
  question: 'В наборе правил агента две записи: «не удалять ветки в удалённом репозитории» и «удалять ветки в удалённом репозитории можно только после подтверждения владельца». К каким категориям они относятся?'
  explanation: Forbidden отвечает на вопрос «что не должно происходить никогда» — разрешённого пути нет вообще. Approval отвечает на вопрос «что требует согласования» — действие допустимо, но проходит через человека. Одно и то же действие попадает в разные категории в зависимости от того, есть ли у него легальный путь.
  kind: choice
  options:
    - Обе — Forbidden, обе про удаление веток
    - Первая — Forbidden, вторая — Approval
    - Первая — Approval, вторая — Forbidden
    - Обе — Approval, обе ограничивают агента
  correct: 1
  id: 007-razlozhit-pravila-1
  fingerprint: 4e205e55
- concept: запрет действует на протяжении всей работы, поэтому проверяется по всему следу выполнения, а не в одной точке
  question: Правило запрещает агенту редактировать файл релизного скрипта. В какой момент проверка этого правила даёт корректный ответ?
  explanation: 'Запрет не имеет одной точки срабатывания: нарушить его можно на любом шаге. Поэтому проверка смотрит весь след выполнения, в отличие от правила входа, которое отвечает на вопрос «что верно до начала работы».'
  kind: choice
  options:
    - Только перед началом задачи, до первого действия агента
    - 'На всём следе выполнения задачи: любая правка файла в любой момент нарушает правило'
    - Только после завершения задачи, при приёмке результата
    - В момент, когда автор присваивает правилу категорию
  correct: 1
  id: 007-razlozhit-pravila-2
  fingerprint: 9d145c4b
