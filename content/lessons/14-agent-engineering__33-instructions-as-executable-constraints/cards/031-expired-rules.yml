- concept: правило считается просроченным при наступлении даты expires_at, а не только после её прохождения
  question: 'Отбор правил, которым уже требуется пересмотр: правило с датой истечения, совпадающей с контрольной датой, обязано попасть в очередь на пересмотр. Заполни сравнение.'
  explanation: 'Строгое `<` оставило бы правило действующим ровно в день истечения, и один набор правил в полночь менял бы статус в зависимости от того, где его проверили. Граница фиксируется явно: наступил expires_at — правило кандидат на пересмотр. Например, при контрольной дате 2026-04-11 правила с датами 2026-04-09 и 2026-04-11 просрочены, 2026-04-12 — ещё действует.'
  kind: cloze
  template: |-
    def expired_rules(rules, today):
        return [r for r in rules if r["expires_at"] ___ today]
  answer: <=
  accept:
    - <=
    - '&lt;='
    - r["expires_at"] <= today
  id: 031-expired-rules-1
  fingerprint: 09bb835d
- concept: функция отбора просроченных правил читает набор, но не изменяет его
  question: Функция отбора просроченных правил получает список правил. Почему она обязана вернуть новый список, а не удалить просроченные записи из полученного?
  explanation: 'Проверяльщик — читатель контракта. Если он сам вычёркивает записи, набор правил меняется без правки авторского файла и без чьего-либо решения: следующий прогон проверяет меньше, чем написано в источнике. Скорость и порядок здесь второстепенны.'
  kind: choice
  options:
    - Потому что удаление из списка во время перебора замедляет функцию на больших наборах
    - 'Потому что набор правил — контракт, и проверка не имеет права его переписывать: удаление приняло бы решение, которое принадлежит человеку'
    - Потому что списки правил обычно приходят в неизменяемом виде и удаление вызовет ошибку
    - Потому что после удаления нельзя восстановить исходный порядок записей
  correct: 1
  id: 031-expired-rules-2
  fingerprint: 3b329132
- concept: обнаружение истёкших правил отделено от решения об их судьбе
  question: Проверка нашла правила с наступившим expires_at. Объясни своими словами, почему она возвращает эти записи, а не удаляет их и не понижает им severity автоматически.
  explanation: 'Срок годности работает как форсирующая функция: он обязывает вернуться к правилу, а не отменяет его. Умолчание в 90 дней задаёт частоту разговора, а не срок жизни решения.'
  kind: open
  reference: 'Наступление expires_at — не приговор правилу, а сигнал к пересмотру. Возможных исходов минимум три: правило обосновывают и продлевают, ослабляют до info, либо удаляют. Выбор зависит от того, что происходило в системе за срок действия, и его делает человек на разборе. Автоматическое удаление тихо сократило бы контракт, автоматическое понижение severity тихо ослабило бы защиту — оба варианта означали бы, что политику пишет проверяльщик. Функция даёт точный список кандидатов; решение принимается позже и остаётся именным.'
  id: 031-expired-rules-3
  fingerprint: 762352c2
