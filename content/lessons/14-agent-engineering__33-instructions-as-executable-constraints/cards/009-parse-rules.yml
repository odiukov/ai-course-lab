- concept: 'разбор правила: извлечь обязательные поля, проверить их заполненность и допустимость категории, собрать структуру'
  question: Расставь шаги разбора одной записи в наборе правил в правильном порядке.
  explanation: 'Проверка формы идёт до сборки результата: сначала запись должна оказаться полной и с известной категорией, и только потом превращается в объект, с которым работает остальная программа. Разрешение имени из `check` в функцию сюда не входит — это отдельный этап.'
  kind: order
  items:
    - Прочитать очередную запись из файла правил
    - 'Извлечь обязательные поля: slug, категорию, описание и check'
    - Убедиться, что ни одно из обязательных полей не пустое
    - Проверить, что категория входит в допустимый набор категорий
    - Собрать проверенные поля в единообразную структуру правила
  id: 009-parse-rules-1
  fingerprint: 187aff5b
- concept: ошибка формата обнаруживается на разборе, а не при применении правила, потому что там ещё известно, какая запись виновата
  question: Парсер встретил запись без поля check. Почему остановиться с ошибкой прямо на разборе лучше, чем пропустить запись дальше и упасть позже, при применении правила?
  explanation: Стоимость ошибки — это расстояние между причиной и симптомом. На разборе парсер может назвать проблемную запись и поле; при применении виден только странный отказ проверки, а опечатку приходится искать вручную.
  kind: choice
  options:
    - Потому что при разборе ещё известны конкретная запись и поле, а позже сбой всплывёт далеко от причины
    - Потому что при разборе ошибки дешевле по памяти, чем при исполнении
    - Потому что позже проверить формат записи уже невозможно
    - Потому что применение правил всегда происходит в другом процессе
  correct: 0
  id: 009-parse-rules-2
  fingerprint: 0c56d3d8
