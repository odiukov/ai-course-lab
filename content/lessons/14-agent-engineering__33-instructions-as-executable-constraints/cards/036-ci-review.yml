- concept: severity задаёт реакцию автоматической проверки, approval — право агента на действие; это независимые рычаги
  question: Провалилась проверка со строгостью warn, и при этом само действие требует одобрения человека. Почему одно не отменяет другое?
  explanation: 'Смешение этих рычагов даёт две типичные ошибки: молчание в отчёте засчитывают за согласие, а любое требование одобрения помечают block.'
  kind: open
  reference: 'Это два разных рычага. Severity описывает судьбу автоматического прогона: block останавливает сборку, warn оставляет заметное предупреждение, info просто попадает в отчёт. Approval описывает границу полномочий: имеет ли агент право совершить действие без человека. Предупреждение о состоянии проверки не является ответом человека, поэтому оно не снимает паузу на одобрение; и наоборот, запрос одобрения сам по себе не превращает провал warn в остановку CI. Прогон может продолжаться, а действие — ждать решения.'
  id: 036-ci-review-2
  fingerprint: 598e6065
