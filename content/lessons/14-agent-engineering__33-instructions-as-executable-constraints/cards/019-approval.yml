- concept: 'approval-правило проверяется по порядку событий в трейсе: запрос, зафиксированное подтверждение, затем действие'
  question: Правило требует согласования перед списанием средств. Расставь события в порядке, который делает трейс соответствующим этому правилу.
  explanation: 'Approval проверяется не наличием переписки, а порядком: запрос раньше подтверждения, подтверждение раньше действия. Если действие стоит перед подтверждением, правило нарушено, даже когда человек потом согласился.'
  kind: order
  items:
    - агент отправляет запрос с описанием действия, суммой и условиями отмены
    - в трейсе появляется явное зафиксированное подтверждение человека
    - агент выполняет списание
  id: 019-approval-1
  fingerprint: 6f7086df
- concept: отсутствие ответа человека не считается подтверждением и не разрешает продолжить
  question: Агент отправил запрос на оплату 40 евро и не получил ответа за 6 часов. Что разрешает исполнимое approval-правило?
  explanation: 'Approval передаёт право на необратимый шаг человеку. Трактовка молчания как согласия возвращает решение агенту и делает правило непроверяемым: в трейсе нет события подтверждения. Лимит — отдельное правило, он не заменяет согласование.'
  kind: choice
  options:
    - 'Действие остаётся заблокированным: разрешает только явное подтверждение, молчание им не является'
    - После разумного ожидания молчание считается согласием, и агент платит
    - Агент платит, если сумма ниже установленного лимита
  correct: 0
  id: 019-approval-2
  fingerprint: e13dcb90
- concept: граница approval ставится на необратимом обязательстве, подготовительные шаги остаются автономными
  question: На каком месте работы правильно ставить границу approval?
  explanation: Поиск, сравнение и расчёт агент делает сам — это подготовка решения. Согласование нужно там, где шаг нельзя откатить без последствий. Approval на каждом шаге превращает агента в бесполезного посредника, а сомнение относится к другой категории правил.
  kind: choice
  options:
    - На каждом вызове инструмента, чтобы человек контролировал ход работы
    - На действии, создающем необратимое обязательство или внешний эффект
    - На любом шаге, где агент испытывает сомнение
  correct: 1
  id: 019-approval-3
  fingerprint: ebe9db6e
