- concept: 'итоговый вердикт вычисляется только по проваленным проверкам: успешно пройденное правило не влияет на решение рантайма независимо от своего уровня'
  question: 'Отчёт содержит четыре записи: правило уровня `block` пройдено, правило уровня `block` пройдено, правило уровня `warn` нарушено, правило уровня `info` нарушено. Какой итоговый вердикт должна вернуть функция агрегации severity?'
  explanation: 'Severity описывает цену нарушения, а не цену существования правила. Пройденная проверка уровня `block` — доказательство, что опасного действия не было, и останавливать из-за неё работу бессмысленно. Поэтому сначала фильтр по провалам, потом максимум по строгости: остаются `warn` и `info`, максимум — `warn`.'
  kind: choice
  options:
    - '`block` — в отчёте присутствуют правила этого уровня'
    - '`warn` — это самый строгий уровень среди нарушенных правил'
    - '`info` — берётся уровень последней записи отчёта'
    - '`block` — потому что нарушений в отчёте больше одного'
  correct: 1
  id: 029-severity-verdict-1
  fingerprint: 05a5c969
- concept: иерархия уровней severity задаётся явной шкалой, а не порядком сравнения строк
  question: 'Реализация выбирает итоговый уровень как максимум строк: `max(severities)`. Среди нарушений есть `info` и `block`. Что вернёт такая реализация и почему это ошибка?'
  explanation: Алфавитный порядок даёт block < info < warn, что не имеет отношения к строгости. Здесь максимум строк вернёт `info`, и рантайм спокойно продолжит работу при блокирующем нарушении. Порядок строгости — доменное знание, его задают явной таблицей рангов (`info` < `warn` < `block`) и сравнивают ранги, а не текст.
  kind: choice
  options:
    - '`block` — лексикографический порядок совпадает с порядком строгости'
    - '`info` — по алфавиту ''info'' больше ''block'', и блокирующее нарушение будет пропущено'
    - '`info` — строковое сравнение всегда возвращает более короткую строку'
    - Ошибку типа — строки нельзя сравнивать оператором максимума
  correct: 1
  id: 029-severity-verdict-2
  fingerprint: 6e1e5b05
- concept: 'порядок вычисления итогового severity: фильтрация провалов, отображение уровней в ранги, выбор максимума, возврат уровня'
  question: Расставь шаги функции, которая по отчёту проверяльщика вычисляет итоговый уровень severity.
  explanation: 'Фильтрация идёт первой, иначе пройденные строгие правила отравят результат. Просмотр обязан быть полным: остановка на первом нарушении вернёт `info`, если блокирующее нарушение записано ниже. Пустой список провалов — не четвёртый уровень severity, а отдельное нейтральное значение из контракта функции.'
  kind: order
  items:
    - Отобрать из отчёта только записи с проваленной проверкой
    - Сопоставить каждому оставшемуся нарушению ранг по шкале строгости info < warn < block
    - Выбрать среди рангов наибольший, просмотрев все нарушения до конца
    - Вернуть уровень, соответствующий наибольшему рангу, либо нейтральное значение, если нарушений не осталось
