  question: 'В корневом роутере есть строка: «Требования к релизам описаны в нашей документации по выкатке». Пути к файлу нет. Как это оценивается при проверке маршрута к правилам?'
  explanation: Маршрут считается по явным путям. Проза требует от агента догадки или поиска по папкам, а это уже не переход, а восстановление недостающего указателя. Роутер обязан ссылаться на каждый тематический документ путём.
  kind: choice
  options:
