- concept: 'подстановка функции по похожему имени недопустима: имя — точный адрес, а не подсказка'
  question: Почему сборка правил не должна подбирать ближайшую по написанию функцию, когда имя в check не найдено?
  explanation: 'Автоподстановка меняет отказ, который виден сразу, на ошибку, которую никто не заметит: конфигурация выглядит валидной, а проверяется чужое условие.'
  kind: open
  reference: 'Похожее написание не гарантирует нужного поведения: подстановка молча свяжет правило с другой проверкой, и агент будет проверяться не тем условием, которое написал автор. Такая догадка ещё и нестабильна — после переименования или добавления новой функции ближайшей окажется третья, и набор правил тихо изменит смысл без изменения конфигурации. Единственный безопасный ответ — отказ с сообщением, какое имя не разрешилось.'
