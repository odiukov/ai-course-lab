- concept: 'порядок обращения к слоям: направление из роутера, обязательные правила, затем тематическая глубина по теме задачи'
  question: Задача — дописать тесты. В каком порядке агент открывает слои документации?
  explanation: Роутер даёт направление, файл правил — ограничения, обязательные для любой задачи, тематический документ — глубину именно по теме. Документы про архитектуру или релиз при этой задаче не открываются вовсе.
  kind: order
  items:
    - корневой AGENTS.md — определить, что за репозиторий и куда идти дальше
    - docs/agent-rules.md — обязательный набор исполнимых правил
    - docs/testing.md — тематический документ, относящийся к задаче
  id: 023-tri-urovnya-1
  fingerprint: fd08de97
- concept: бюджет размера слоя задаётся частотой его чтения
  question: Почему у корневого роутера жёсткий бюджет в несколько десятков строк, а у тематического документа бюджета по сути нет?
  explanation: Стоимость длины платится при каждом чтении. Роутер оплачивается в каждой сессии, поэтому обязан быть коротким; редкий документ вроде инструкции по релизу может быть сколь угодно подробным, потому что его загружают лишь тогда, когда задача его касается. Важность требований тут ни при чём.
  kind: choice
  options:
    - Роутер читается каждую сессию целиком, а тематический файл открывается редко и только по теме задачи
    - Роутер важнее по содержанию, а тематические файлы содержат второстепенные требования
    - Тематические файлы читает человек, а роутер — только агент
  correct: 0
