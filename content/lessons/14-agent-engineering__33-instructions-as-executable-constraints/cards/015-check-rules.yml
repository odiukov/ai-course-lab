- concept: порядок записей результата повторяет порядок правил на входе, что делает отчёты сравнимыми между прогонами
  question: 'Реализация обходит правила не в исходном порядке, а группирует результаты: сначала провалы, потом успехи. Что при этом теряется?'
  explanation: 'Стабильный порядок — свойство отчёта как артефакта: diff двух прогонов должен показывать только изменившиеся вердикты. Сортировка по результату превращает один новый провал в перетасовку всего файла.'
  kind: choice
  options:
    - Проверки начинают видеть разные трейсы
    - Часть правил перестаёт проверяться
    - 'Отчёты двух прогонов перестают сравниваться построчно: сдвиг блоков выглядит как изменение результатов'
  correct: 2
