- concept: функция проверки вычисляет и возвращает вердикты, а запись отчёта на диск принадлежит вызывающему уровню
  question: Почему функция, прогоняющая правила по трейсу, возвращает коллекцию результатов, а не пишет файл отчёта сама?
  explanation: 'Разделение уровней: парсер, проверки и отчёт — три отдельные обязанности. Чистая функция «правила + трейс → вердикты» тестируется без файловой системы, а вызывающий сам решает, писать JSON, слать в CI или печатать в консоль.'
  kind: choice
  options:
    - Запись файла внутри сделала бы функцию непригодной для тестов и для любого другого потребителя результатов, привязав проверку правил к одному способу вывода
    - Потому что файловые операции нельзя выполнять после разбора правил
    - Потому что вердикты обязаны храниться в памяти до конца процесса
  correct: 0
