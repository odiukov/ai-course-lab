- concept: число вердиктов в отчёте равно числу проверяемых правил, независимо от провалов
  question: Проверяльщик получил 7 скомпилированных правил и один трейс прогона. Третье правило провалено. Сколько записей результата должно оказаться в итоговом отчёте?
  explanation: Вердикт полагается каждому правилу. Если цикл обрывается на первом провале, отчёт содержит меньше записей, чем правил, и непроверенное правило становится неотличимо от выполненного.
  kind: numeric
  answer: 7
  tolerance: 0.5
  id: 014-trace-kak-dokazatelstvo-1
  fingerprint: 3f522afa
- concept: все проверки правил оценивают один и тот же трейс, различаясь только вызываемой функцией
  question: Проверяльщик оценивает набор правил после одного прогона агента. Что подаётся на вход каждой отдельной проверке?
  explanation: Прогон один, трейс один. Разница между правилами — в функции, которая ищет в этом трейсе своё условие. Иначе вердикты относились бы к разным прогонам и не складывались бы в один отчёт.
  kind: choice
  options:
    - Собственный отдельный прогон агента, запускаемый заново под каждое правило
    - Один и тот же трейс прогона — правила различаются только тем, какая функция проверки его читает
    - Только вердикты предыдущих правил, накопленные к этому моменту
  correct: 1
  id: 014-trace-kak-dokazatelstvo-2
  fingerprint: 4c3f1b2f
- concept: 'вердикт сопровождается основанием: какое событие подтвердило выполнение или чего в трейсе не хватило'
  question: Почему записи результата мало хранить одно значение pass/fail? Что ещё в неё кладут и зачем?
  explanation: Отчёт нужен, чтобы по нему действовать. Пояснение «подтверждения перед опасным вызовом нет» указывает точку в трейсе; голый fail заставляет разбираться заново.
  kind: open
  reference: 'Кроме вердикта запись хранит основание: какое событие трейса подтвердило выполнение либо какого события не хватило. Без основания вердикт нельзя перепроверить и нельзя починить — читатель отчёта видит «fail», но не знает, что именно агент не сделал и где смотреть в трейсе. Основание превращает отчёт из оценки в проверяемое утверждение.'
  id: 014-trace-kak-dokazatelstvo-3
  fingerprint: 91c539e9
