- concept: правило проверяется по наблюдаемому следу выполнения, а не по заявлению исполнителя
  question: Агент сдаёт работу с отчётом «линтер прогнан, всё чисто». Какая формулировка правила даёт ревьюеру проверяемый след вместо заявления о намерениях?
  explanation: 'Первая формулировка оставляет три наблюдаемые вещи: запущенную команду, её результат и приложенный вывод. Остальные две дают только тон: после работы предъявить нечего, ревьюеру остаётся верить на слово.'
  kind: choice
  options:
    - «Запусти `ruff check .`; продолжай только при отсутствии сообщений об ошибках и приложи вывод команды к отчёту»
    - «Следи за чистотой кода на протяжении всей задачи»
    - «Относись к замечаниям линтера серьёзно и не игнорируй их»
  correct: 0
  id: 002-kriteriy-operacionnosti-1
  fingerprint: 15646a44
- concept: свидетельство должно соответствовать именно тому правилу, которое проверяется
  question: Правило запрещает изменять файлы в каталоге `vendor/`. Что служит свидетельством его соблюдения?
  explanation: След обязан относиться к самому правилу. Зелёные тесты подтверждают другое требование и легко бывают зелёными при нарушенном запрете. Фраза в отчёте — снова заявление о намерении, а не наблюдаемый артефакт.
  kind: choice
  options:
    - Список изменённых файлов, в котором нет ни одного пути из `vendor/`
    - Зелёный прогон всего набора тестов
    - 'Строка в отчёте агента: «каталог `vendor/` я не трогал»'
  correct: 0
  id: 002-kriteriy-operacionnosti-2
  fingerprint: 5b3772eb
- concept: свидетельство отвечает на узкий вопрос о конкретном условии, а не о качестве работы в целом
  question: Почему наличие свидетельства выполнения правила не означает, что работа сделана хорошо? Объясни своими словами, на какой вопрос свидетельство отвечает.
  explanation: Правила не заменяют ревью по существу. Они снимают с ревью класс вопросов, на которые раньше отвечали словами «я всё проверил».
  kind: open
  reference: 'Свидетельство отвечает только на вопрос «было ли выполнено это конкретное условие?». Успешный прогон тестов показывает, что набор тестов прошёл, а не что решение правильное, архитектура удачная или требование понято верно. Ценность в другом: этот узкий вопрос закрывается наблюдением, а не доверием к добрым намерениям, поэтому его можно проверять каждый раз и одинаково.'
  id: 002-kriteriy-operacionnosti-3
  fingerprint: 301d359b
