- concept: проверяльщик исполняет содержимое кеша, поэтому правка источника вступает в силу только после пересборки
  question: У правила в авторском файле severity изменили с block на warn, но lock-файл не пересобрали. Запускается проверяльщик, который читает lock. Что произойдёт?
  explanation: 'Кеш — то, что реально исполняется до следующей пересборки. Именно поэтому пересборка привязывается к автоматическому шагу перед коммитом: иначе расхождение проявляется не как ошибка, а как непонятное поведение — правило вроде бы ослабили, а работа всё равно останавливается.'
  kind: choice
  options:
    - 'Правило сработает как block: исполняется то, что лежит в кеше, а не то, что написано в источнике'
    - 'Правило сработает как warn: severity берётся из источника, кеш хранит только имена проверок'
    - Проверяльщик откажется работать, обнаружив расхождение с источником
    - Правило будет пропущено, потому что его severity неоднозначна
