- concept: 'порядок сборки кеша: разбор источника, отображение полей правила, детерминированная сериализация'
  question: Расставь шаги функции, собирающей lock-файл из авторского текста правил.
  explanation: 'Сборка не имеет своего разбора: она переиспользует парсер источника, поэтому повреждённая запись отвергается до того, как попадёт в кеш. Дальше остаётся чистое отображение полей и стабильная сериализация.'
  kind: order
  items:
    - Принять текст авторского файла правил
    - Разобрать его тем же парсером правил, отвергая повреждённые записи
    - 'Отобразить каждое правило в JSON-данные: slug, категорию, описание, имя check, severity, expires_at'
    - Сериализовать с фиксированным порядком правил, порядком ключей и форматированием
    - Вернуть готовый текст кеша
