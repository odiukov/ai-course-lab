<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карта пяти категорий исполняемых ограничений</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fc;
      --ink: #172033;
      --muted: #59657a;
      --panel: #ffffff;
      --border: #ccd3df;
      --guide: #9ba7b9;
      --hub: #27354f;
      --hub-ink: #ffffff;

      --startup: #2563a9;
      --startup-soft: #e8f2ff;
      --forbidden: #b33b45;
      --forbidden-soft: #ffebed;
      --done: #23805a;
      --done-soft: #e5f7ee;
      --uncertainty: #9a651d;
      --uncertainty-soft: #fff2d9;
      --approval: #6f4db2;
      --approval-soft: #f0eaff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --ink: #eef3fb;
        --muted: #b3bfd0;
        --panel: #192231;
        --border: #3b485c;
        --guide: #718099;
        --hub: #dce7f8;
        --hub-ink: #172033;

        --startup: #72b7ff;
        --startup-soft: #173554;
        --forbidden: #ff8991;
        --forbidden-soft: #4a242c;
        --done: #65d5a0;
        --done-soft: #173d31;
        --uncertainty: #f4bd62;
        --uncertainty-soft: #493719;
        --approval: #bca0ff;
        --approval-soft: #34294f;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: unset;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    main {
      background: var(--page);
    }

    h1 {
      margin: unset;
      padding: 14px 18px 10px;
      font-size: 20px;
      font-weight: bold;
      color: var(--ink);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--page);
    }

    .connector {
      fill: none;
      stroke: var(--guide);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .card-shell {
      fill: var(--panel);
      stroke: var(--border);
    }

    .divider {
      stroke: var(--border);
    }

    .hub {
      fill: var(--hub);
    }

    .hub-title {
      fill: var(--hub-ink);
      font-size: 16px;
      font-weight: bold;
    }

    .hub-note {
      fill: var(--hub-ink);
      font-size: 13px;
    }

    .category {
      font-size: 18px;
      font-weight: bold;
    }

    .category-hint {
      font-size: 12px;
      font-weight: bold;
    }

    .field-label {
      fill: var(--muted);
      font-size: 11px;
      font-weight: bold;
    }

    .question {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
    }

    .example {
      fill: var(--muted);
      font-size: 14px;
    }

    .startup .accent,
    .startup .arrow {
      fill: var(--startup);
    }

    .startup .category,
    .startup .category-hint {
      fill: var(--startup);
    }

    .startup .soft {
      fill: var(--startup-soft);
    }

    .forbidden .accent,
    .forbidden .arrow {
      fill: var(--forbidden);
    }

    .forbidden .category,
    .forbidden .category-hint {
      fill: var(--forbidden);
    }

    .forbidden .soft {
      fill: var(--forbidden-soft);
    }

    .done .accent,
    .done .arrow {
      fill: var(--done);
    }

    .done .category,
    .done .category-hint {
      fill: var(--done);
    }

    .done .soft {
      fill: var(--done-soft);
    }

    .uncertainty .accent,
    .uncertainty .arrow {
      fill: var(--uncertainty);
    }

    .uncertainty .category,
    .uncertainty .category-hint {
      fill: var(--uncertainty);
    }

    .uncertainty .soft {
      fill: var(--uncertainty-soft);
    }

    .approval .accent,
    .approval .arrow {
      fill: var(--approval);
    }

    .approval .category,
    .approval .category-hint {
      fill: var(--approval);
    }

    .approval .soft {
      fill: var(--approval-soft);
    }

    .fallback {
      fill: var(--ink);
      font-size: 17px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main aria-labelledby="diagram-title">
    <h1 id="diagram-title">Карта пяти категорий исполняемых ограничений</h1>
    <svg
      id="rule-map"
      role="img"
      preserveAspectRatio="xMidYMid meet"
      aria-labelledby="diagram-title diagram-description"
    >
      <desc id="diagram-description">
        Пять блоков: Startup, Forbidden, Definition of done, Uncertainty и
        Approval. В каждом блоке показаны контрольный вопрос и пример правила.
      </desc>
    </svg>
  </main>

  <script>
    const data = {
      layout: {
        zero: 0,
        origin: { x: 0, y: 0 },
        scale: 1,
        extent: { x: 1180, y: 458 },
        radius: 12,
        hub: {
          x: 20,
          y: 189,
          width: 154,
          height: 80,
          titleY: 222,
          noteY: 247
        },
        route: {
          tailX: 174,
          tailY: 229,
          bendX: 188,
          baseX: 202,
          tipX: 211,
          wingX: 201,
          wingHalfHeight: 6
        },
        card: {
          x: 210,
          width: 950,
          height: 76,
          accentWidth: 9,
          categoryX: 242,
          categoryY: 31,
          hintY: 54,
          separatorX: 454,
          fieldLabelX: 478,
          valueX: 568,
          questionY: 29,
          exampleY: 55,
          softX: 468,
          softWidth: 82,
          softHeight: 20,
          softQuestionY: 15,
          softExampleY: 42,
          softRadius: 7
        }
      },
      style: {
        lineWidth: 2,
        cardLineWidth: 1
      },
      cards: [
        {
          className: "startup",
          y: 10,
          category: "Startup",
          hint: "ДО НАЧАЛА",
          question: "Что должно быть верно до начала работы?",
          example: "«файл состояния существует и свежий»"
        },
        {
          className: "forbidden",
          y: 97,
          category: "Forbidden",
          hint: "НИКОГДА",
          question: "Что не должно происходить никогда?",
          example: "«не редактировать scripts/release.sh»"
        },
        {
          className: "done",
          y: 184,
          category: "Definition of done",
          hint: "ГОТОВО",
          question: "Что доказывает, что задача закончена?",
          example: "«pytest завершается с 0 и строка приёмки проходит»"
        },
        {
          className: "uncertainty",
          y: 271,
          category: "Uncertainty",
          hint: "НЕ УВЕРЕН",
          question: "Что агент делает, когда не уверен?",
          example: "«открыть заметку с вопросом вместо угадывания»"
        },
        {
          className: "approval",
          y: 358,
          category: "Approval",
          hint: "СПРОСИТЬ",
          question: "Что требует согласования с человеком?",
          example: "«любая новая зависимость, любая запись в прод»"
        }
      ]
    };

    const canvas = { width: 1180, height: 458 };
    const origin = data.layout.origin;
    const scale = data.layout.scale;
    const sx = x => origin.x + x * scale;
    const sy = y => origin.y + y * scale;

    const svg = document.getElementById("rule-map");
    const ns = "http://www.w3.org/2000/svg";

    function element(name, attributes, parent) {
      const node = document.createElementNS(ns, name);
      Object.entries(attributes).forEach(([key, value]) => {
        node.setAttribute(key, String(value));
      });
      (parent || svg).appendChild(node);
      return node;
    }

    function textNode(className, x, y, value, anchor, parent) {
      const node = element("text", {
        class: className,
        x: sx(x),
        y: sy(y),
        "text-anchor": anchor
      }, parent);
      node.textContent = value;
      return node;
    }

    function roundedRect(className, x, y, width, height, radius, parent) {
      return element("rect", {
        class: className,
        x: sx(x),
        y: sy(y),
        width: sx(x + width) - sx(x),
        height: sy(y + height) - sy(y),
        rx: sx(radius) - sx(data.layout.zero),
        ry: sy(radius) - sy(data.layout.zero)
      }, parent);
    }

    function drawConnector(card, cardCenterY) {
      const route = data.layout.route;
      const group = element("g", { class: card.className });
      const points = [
        [route.tailX, route.tailY],
        [route.bendX, route.tailY],
        [route.bendX, cardCenterY],
        [route.baseX, cardCenterY]
      ].map(([x, y]) => `${sx(x)},${sy(y)}`).join(" ");

      element("polyline", {
        class: "connector",
        points,
        "stroke-width": data.style.lineWidth
      }, group);

      const arrowPoints = [
        [route.tipX, cardCenterY],
        [route.wingX, cardCenterY - route.wingHalfHeight],
        [route.wingX, cardCenterY + route.wingHalfHeight]
      ].map(([x, y]) => `${sx(x)},${sy(y)}`).join(" ");

      element("polygon", {
        class: "arrow",
        points: arrowPoints
      }, group);
    }

    function drawCard(card) {
      const cardLayout = data.layout.card;
      const centerY = card.y + cardLayout.height / data.style.lineWidth;
      drawConnector(card, centerY);

      const group = element("g", { class: card.className });

      const shell = roundedRect(
        "card-shell",
        cardLayout.x,
        card.y,
        cardLayout.width,
        cardLayout.height,
        data.layout.radius,
        group
      );
      shell.setAttribute("stroke-width", data.style.cardLineWidth);

      roundedRect(
        "soft",
        cardLayout.x,
        card.y,
        cardLayout.width,
        cardLayout.height,
        data.layout.radius,
        group
      );

      element("rect", {
        class: "accent",
        x: sx(cardLayout.x),
        y: sy(card.y),
        width: sx(cardLayout.x + cardLayout.accentWidth) - sx(cardLayout.x),
        height: sy(card.y + cardLayout.height) - sy(card.y)
      }, group);

      element("line", {
        class: "divider",
        x1: sx(cardLayout.separatorX),
        y1: sy(card.y + data.layout.radius),
        x2: sx(cardLayout.separatorX),
        y2: sy(card.y + cardLayout.height - data.layout.radius),
        "stroke-width": data.style.cardLineWidth
      }, group);

      roundedRect(
        "card-shell",
        cardLayout.softX,
        card.y + cardLayout.softQuestionY,
        cardLayout.softWidth,
        cardLayout.softHeight,
        cardLayout.softRadius,
        group
      );

      roundedRect(
        "card-shell",
        cardLayout.softX,
        card.y + cardLayout.softExampleY,
        cardLayout.softWidth,
        cardLayout.softHeight,
        cardLayout.softRadius,
        group
      );

      textNode(
        "category",
        cardLayout.categoryX,
        card.y + cardLayout.categoryY,
        card.category,
        "start",
        group
      );

      textNode(
        "category-hint",
        cardLayout.categoryX,
        card.y + cardLayout.hintY,
        card.hint,
        "start",
        group
      );

      textNode(
        "field-label",
        cardLayout.fieldLabelX,
        card.y + cardLayout.questionY,
        "ВОПРОС",
        "start",
        group
      );

      textNode(
        "question",
        cardLayout.valueX,
        card.y + cardLayout.questionY,
        card.question,
        "start",
        group
      );

      textNode(
        "field-label",
        cardLayout.fieldLabelX,
        card.y + cardLayout.exampleY,
        "ПРИМЕР",
        "start",
        group
      );

      textNode(
        "example",
        cardLayout.valueX,
        card.y + cardLayout.exampleY,
        card.example,
        "start",
        group
      );
    }

    try {
      const layout = data.layout;

      svg.setAttribute(
        "viewBox",
        [
          sx(layout.zero),
          sy(layout.zero),
          canvas.width,
          canvas.height
        ].join(" ")
      );
      svg.setAttribute("width", canvas.width);
      svg.setAttribute("height", canvas.height);

      element("rect", {
        x: sx(layout.zero),
        y: sy(layout.zero),
        width: sx(layout.extent.x) - sx(layout.zero),
        height: sy(layout.extent.y) - sy(layout.zero),
        fill: "var(--page)"
      });

      data.cards.forEach(drawCard);

      roundedRect(
        "hub",
        layout.hub.x,
        layout.hub.y,
        layout.hub.width,
        layout.hub.height,
        layout.radius
      );

      textNode(
        "hub-title",
        layout.hub.x + layout.hub.width / data.style.lineWidth,
        layout.hub.titleY,
        "ИНСТРУКЦИЯ",
        "middle"
      );

      textNode(
        "hub-note",
        layout.hub.x + layout.hub.width / data.style.lineWidth,
        layout.hub.noteY,
        "задай один вопрос",
        "middle"
      );
    } catch (error) {
      svg.replaceChildren();
      svg.setAttribute(
        "viewBox",
        [
          sx(data.layout.zero),
          sy(data.layout.zero),
          canvas.width,
          canvas.height
        ].join(" ")
      );

      textNode(
        "fallback",
        data.layout.extent.x / data.style.lineWidth,
        data.layout.extent.y / data.style.lineWidth,
        "Схема должна показать пять категорий: Startup, Forbidden, Definition of done, Uncertainty и Approval.",
        "middle"
      );
    }
  </script>
</body>
</html>
