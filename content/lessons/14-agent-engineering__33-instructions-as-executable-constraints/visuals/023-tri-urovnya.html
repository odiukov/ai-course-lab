<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Три уровня прогрессивного раскрытия инструкций</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #59657a;
      --line: #73809a;
      --router: #e8f1ff;
      --router-edge: #3975c6;
      --rules: #f1ebff;
      --rules-edge: #7650b5;
      --topic: #eaf8f1;
      --topic-edge: #27815d;
      --chip: #ffffff;
      --chip-edge: #b3a1d6;
      --accent: #226b50;
      --shadow: #dfe4ec;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --panel: #171f2c;
        --ink: #edf2fa;
        --muted: #adb9cb;
        --line: #8997ad;
        --router: #172b47;
        --router-edge: #75aef4;
        --rules: #2c2142;
        --rules-edge: #b999f0;
        --topic: #17372d;
        --topic-edge: #66c59e;
        --chip: #211a31;
        --chip-edge: #806aa9;
        --accent: #83d7b4;
        --shadow: #0a0e15;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: unset;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    figure {
      margin: unset;
      padding: 12px;
      background: var(--page);
    }

    h2 {
      margin: unset;
      padding: 4px 8px 10px;
      font-size: 20px;
      text-align: center;
      color: var(--ink);
    }

    svg {
      display: block;
      width: 100%;
      height: 460px;
      max-height: 520px;
      background: var(--panel);
      border: 1px solid var(--shadow);
    }

    .connector {
      fill: none;
      stroke: var(--line);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arrow-head {
      fill: var(--line);
    }

    .router-card {
      fill: var(--router);
      stroke: var(--router-edge);
      stroke-width: 2;
    }

    .rules-card {
      fill: var(--rules);
      stroke: var(--rules-edge);
      stroke-width: 2;
    }

    .topic-card {
      fill: var(--topic);
      stroke: var(--topic-edge);
      stroke-width: 2;
    }

    .rule-chip {
      fill: var(--chip);
      stroke: var(--chip-edge);
      stroke-width: 1px;
    }

    .tier {
      fill: var(--muted);
      font-size: 12px;
      font-weight: bold;
    }

    .file {
      fill: var(--ink);
      font-size: 19px;
      font-weight: bold;
    }

    .topic-file {
      fill: var(--ink);
      font-size: 16px;
      font-weight: bold;
    }

    .description {
      fill: var(--muted);
      font-size: 14px;
    }

    .small-description {
      fill: var(--muted);
      font-size: 12px;
    }

    .flow-label {
      fill: var(--muted);
      font-size: 12px;
      font-weight: bold;
    }

    .topic-heading {
      fill: var(--accent);
      font-size: 14px;
      font-weight: bold;
    }

    .fallback {
      padding: 18px;
      color: var(--ink);
      font-size: 16px;
      background: var(--panel);
      border: 1px solid var(--shadow);
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title">
    <h2 id="diagram-title">Три уровня прогрессивного раскрытия инструкций</h2>
    <svg
      id="diagram"
      viewBox="0 0 1000 460"
      width="1000"
      height="460"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-title diagram-desc">
      <desc id="diagram-desc">
        Короткий AGENTS.md ведёт к обязательным правилам, а затем к подробным
        тематическим документам, которые загружаются только по задаче.
      </desc>
    </svg>
    <p id="fallback" class="fallback" hidden>
      Схема должна была показать три уровня: короткий AGENTS.md меньше 50
      строк, docs/agent-rules.md с одним экраном на каждую из 5 категорий и
      тематические docs/&lt;topic&gt;.md, загружаемые только по задаче.
    </p>
    <noscript>
      <p class="fallback">
        Схема показывает путь от короткого AGENTS.md к обязательным правилам
        и далее к тематическим документам, которые нужны только для конкретной
        задачи.
      </p>
    </noscript>
  </figure>

  <script>
    const data = Object.freeze([{
      zero: 0,
      origin: { x: 32, y: 12 },
      scale: { x: 1, y: 1 },
      corner: 12,
      router: { x: 130, y: 18, w: 740, h: 72 },
      rules: { x: 100, y: 135, w: 800, h: 112 },
      topics: [
        {
          box: { x: 100, y: 330, w: 260, h: 100 },
          lines: [
            { x: 120, y: 352, text: "ПО ТЕМЕ ЗАДАЧИ", className: "tier" },
            { x: 120, y: 378, text: "docs/testing.md", className: "topic-file" },
            { x: 120, y: 402, text: "Писать или запускать", className: "small-description" },
            { x: 120, y: 419, text: "тесты", className: "small-description" }
          ]
        },
        {
          box: { x: 370, y: 330, w: 260, h: 100 },
          lines: [
            { x: 390, y: 352, text: "ПО ТЕМЕ ЗАДАЧИ", className: "tier" },
            { x: 390, y: 378, text: "docs/architecture.md", className: "topic-file" },
            { x: 390, y: 402, text: "Работать с границами", className: "small-description" },
            { x: 390, y: 419, text: "модулей", className: "small-description" }
          ]
        },
        {
          box: { x: 640, y: 330, w: 260, h: 100 },
          lines: [
            { x: 660, y: 352, text: "ПО ТЕМЕ ЗАДАЧИ", className: "tier" },
            { x: 660, y: 378, text: "docs/deploy.md", className: "topic-file" },
            { x: 660, y: 402, text: "Только для релизной", className: "small-description" },
            { x: 660, y: 419, text: "работы", className: "small-description" }
          ]
        }
      ],
      routerLines: [
        { x: 155, y: 45, text: "1 · КОРОТКИЙ РОУТЕР", className: "tier" },
        { x: 365, y: 46, text: "AGENTS.md", className: "file" },
        { x: 500, y: 73, text: "< 50 строк · читается в каждой сессии", className: "description", anchor: "middle" }
      ],
      rulesLines: [
        { x: 125, y: 160, text: "2 · ОБЯЗАТЕЛЬНЫЕ ПРАВИЛА", className: "tier" },
        { x: 125, y: 188, text: "docs/agent-rules.md", className: "file" },
        { x: 125, y: 213, text: "5 категорий · примерно один экран на категорию", className: "description" }
      ],
      ruleChips: [
        { x: 610, y: 157, w: 42, h: 62 },
        { x: 660, y: 157, w: 42, h: 62 },
        { x: 710, y: 157, w: 42, h: 62 },
        { x: 760, y: 157, w: 42, h: 62 },
        { x: 810, y: 157, w: 42, h: 62 }
      ],
      headings: [
        { x: 100, y: 294, text: "3 · ТЕМАТИЧЕСКИЕ ДОКУМЕНТЫ", className: "topic-heading" },
        { x: 380, y: 294, text: "глубина по необходимости", className: "description" }
      ],
      flowLabels: [
        { x: 520, y: 114, text: "всегда", className: "flow-label" },
        { x: 520, y: 271, text: "выбор по задаче", className: "flow-label" }
      ],
      connectors: [
        {
          points: [{ x: 500, y: 90 }, { x: 500, y: 135 }],
          head: [{ x: 500, y: 135 }, { x: 492, y: 124 }, { x: 508, y: 124 }]
        },
        {
          points: [{ x: 500, y: 247 }, { x: 500, y: 310 }, { x: 230, y: 310 }, { x: 230, y: 330 }],
          head: [{ x: 230, y: 330 }, { x: 222, y: 319 }, { x: 238, y: 319 }]
        },
        {
          points: [{ x: 500, y: 247 }, { x: 500, y: 330 }],
          head: [{ x: 500, y: 330 }, { x: 492, y: 319 }, { x: 508, y: 319 }]
        },
        {
          points: [{ x: 500, y: 247 }, { x: 500, y: 310 }, { x: 770, y: 310 }, { x: 770, y: 330 }],
          head: [{ x: 770, y: 330 }, { x: 762, y: 319 }, { x: 778, y: 319 }]
        }
      ]
    }]);

    const [diagramData] = data;
    const origin = Object.freeze(diagramData.origin);
    const scale = Object.freeze(diagramData.scale);
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      const create = (name, attributes, parent) => {
        const node = document.createElementNS(namespace, name);
        for (const [key, value] of Object.entries(attributes)) {
          node.setAttribute(key, String(value));
        }
        (parent || svg).appendChild(node);
        return node;
      };

      const rectangle = (box, className) => create("rect", {
        x: sx(box.x),
        y: sy(box.y),
        width: sx(box.x + box.w) - sx(box.x),
        height: sy(box.y + box.h) - sy(box.y),
        rx: sx(diagramData.corner) - sx(diagramData.zero),
        ry: sy(diagramData.corner) - sy(diagramData.zero),
        class: className
      });

      const write = line => {
        const node = create("text", {
          x: sx(line.x),
          y: sy(line.y),
          class: line.className,
          "text-anchor": line.anchor || "start"
        });
        node.textContent = line.text;
        return node;
      };

      const path = points => {
        const [first, ...rest] = points;
        const commands = [
          `M ${sx(first.x)} ${sy(first.y)}`,
          ...rest.map(point => `L ${sx(point.x)} ${sy(point.y)}`)
        ];
        return create("path", {
          d: commands.join(" "),
          class: "connector"
        });
      };

      const arrowHead = points => create("polygon", {
        points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
        class: "arrow-head"
      });

      for (const connector of diagramData.connectors) {
        path(connector.points);
        arrowHead(connector.head);
      }

      rectangle(diagramData.router, "router-card");
      rectangle(diagramData.rules, "rules-card");

      for (const topic of diagramData.topics) {
        rectangle(topic.box, "topic-card");
      }

      for (const chip of diagramData.ruleChips) {
        rectangle(chip, "rule-chip");
      }

      for (const line of diagramData.routerLines) write(line);
      for (const line of diagramData.rulesLines) write(line);
      for (const line of diagramData.headings) write(line);
      for (const line of diagramData.flowLabels) write(line);

      for (const topic of diagramData.topics) {
        for (const line of topic.lines) write(line);
      }

      fallback.hidden = true;
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      svg.hidden = true;
      fallback.hidden = false;
    }
  </script>
</body>
</html>
