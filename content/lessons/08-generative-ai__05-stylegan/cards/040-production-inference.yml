- concept: однократное вычисление генератора даёт StyleGAN преимущество по задержке перед итеративной диффузией
  question: Почему StyleGAN обычно генерирует изображение заметно быстрее многошаговой диффузионной модели при сопоставимом разрешении?
  explanation: Главная причина — длина вычислительной цепочки. StyleGAN3 выполняет один прямой проход и в приведённом измерении укладывается менее чем в 10 мс, тогда как SDXL повторяет вычисления на 50 шагах и декодирует VAE, занимая около 3 секунд.
  kind: choice
  options:
    - StyleGAN выполняет однократный прямой проход, а диффузионная модель последовательно повторяет вычисления и может дополнительно декодировать результат
    - StyleGAN всегда создаёт изображения с меньшим числом цветовых каналов
    - Диффузионная модель обязательно обрабатывает каждый пиксель отдельно на центральном процессоре
    - StyleGAN не использует обучаемые параметры во время генерации
  correct: 0
  id: 040-production-inference-1
  fingerprint: 6f4e40a9
- concept: одинаковая вычислительная стоимость запросов StyleGAN уменьшает пользу continuous batching
  question: Все запросы к генератору требуют одинакового объёма вычислений и одновременно завершаются внутри батча. Какая схема обслуживания обычно достаточна?
  explanation: Continuous batching полезен, когда запросы освобождают места в разное время. У StyleGAN каждый запрос выполняет одинаковый прямой проход, поэтому места в батче освобождаются вместе и статическая схема обычно проще и достаточна.
  kind: choice
  options:
    - Статический батч, подобранный под ожидаемую загрузку
    - Continuous batching с постоянной заменой завершившихся запросов
    - Планировщик, выделяющий каждому запросу разное число итераций
    - Последовательная обработка без использования батчей
  correct: 0
  id: 040-production-inference-2
  fingerprint: 3bca6ab1
