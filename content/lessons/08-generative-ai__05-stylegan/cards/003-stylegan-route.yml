- concept: маршрут латентного кода через mapping network и сеть синтеза StyleGAN
  question: Расположите этапы генерации изображения в StyleGAN в правильном порядке.
  explanation: 'Основной маршрут имеет вид z → mapping network → w → параметры AdaIN в блоках синтеза → изображение. Код w не является набором пикселей: он управляет преобразованием карт признаков на разных масштабах.'
  kind: order
  items:
    - Сэмплировать латентный вектор z из заданного распределения
    - Преобразовать z с помощью mapping network
    - Получить промежуточный латентный код w
    - Преобразовать w в параметры стилизации слоёв сети синтеза
    - Последовательно сформировать признаки разных разрешений и итоговое изображение
  id: 003-stylegan-route-1
  fingerprint: 88dfd48e
- concept: разделение стилевого управления через w и стохастических деталей через per-layer noise
  question: Почему боковые входы per-layer noise не относятся к основному маршруту z → w → изображение?
  explanation: Код w через аффинные преобразования задаёт масштаб и сдвиг для AdaIN, управляя стилем на разных разрешениях. Per-layer noise поступает отдельно и отвечает преимущественно за случайные мелкие вариации.
  kind: choice
  options:
    - Шум используется только при обучении mapping network
    - Шум независимо добавляет случайные локальные детали, а основные стилевые параметры поступают из w
    - Шум заменяет w в блоках с высоким разрешением
    - Шум напрямую определяет глобальную структуру изображения
  correct: 1
  id: 003-stylegan-route-2
  fingerprint: e6b7ed19
