- concept: сборка последовательности стилей не должна изменять исходные латентные коды
  question: Почему реализация style_mixing, которая изменяет w_a на месте при сборке результата, некорректна, даже если смешанное изображение выглядит ожидаемо?
  explanation: Маршрутизация стилей не преобразует сами коды. Мутация входа незаметно меняет результаты последующих вычислений и нарушает возможность повторного использования w_a.
  kind: open
  reference: 'Style mixing должна только выбирать исходный стилевой код для каждой позиции. Изменение w_a создаёт побочный эффект: этот код уже нельзя гарантированно использовать повторно для другого смешивания или синтеза исходного изображения.'
  id: 024-code-style-mixing-2
