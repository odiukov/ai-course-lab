- concept: демодуляция компенсирует масштаб модулированных весов до вычисления карты признаков
  question: Чем демодуляция весов принципиально отличается от AdaIN в генераторе StyleGAN?
  explanation: AdaIN принудительно меняет статистики уже вычисленной карты признаков. При демодуляции стиль сначала модулирует веса свёртки, после чего их масштаб компенсируется отдельно для каждого выходного канала ещё до получения активаций.
  kind: choice
  options:
    - Она нормализует готовые карты признаков, а затем добавляет к ним стилевое смещение
    - Она компенсирует общий масштаб модулированных весов каждого выходного канала до вычисления активаций
    - Она изменяет только амплитуду случайного шума, не затрагивая свёртку
    - Она переносит стилевой код из генератора в дискриминатор
  correct: 1
  id: 034-stylegan2-fix-1
  fingerprint: 9025dc94
- concept: отказ от принудительной нормализации активаций устраняет механизм появления артефактов-капель
  question: Объясни своими словами, почему замена AdaIN модуляцией и демодуляцией весов уменьшает характерные артефакты-капли.
  explanation: 'Причина улучшения не в удалении стиля: стилевое управление сохраняется в модулированных весах. Устраняется нормализация готовых карт признаков, позволявшая генератору усиливать локальные пики и превращать их в повторяющиеся капли.'
  kind: open
  reference: AdaIN нормализует готовую карту признаков и может превратить сильный локальный пик в устойчивый заметный артефакт, которым генератор учится пользоваться. Демодуляция заранее контролирует масштаб изменённых стилем весов и не навязывает готовым активациям заданные среднее и разброс, поэтому такой механизм создания капель исчезает.
  id: 034-stylegan2-fix-2
  fingerprint: c33f1304
