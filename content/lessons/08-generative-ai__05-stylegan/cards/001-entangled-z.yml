- concept: обычная цель обучения GAN не требует семантического разделения координат латентного вектора
  question: Объясни своими словами, почему обычное обучение GAN на правдоподобных изображениях не гарантирует, что отдельные координаты z станут независимыми регуляторами позы, освещения или личности.
  explanation: Генератор оптимизируется на реалистичность, а не на удобство редактирования. Без специального ограничения у него нет причины отделять позу от освещения или фона, особенно когда эти признаки коррелируют в данных.
  kind: open
  reference: Целевая функция поощряет генератор создавать изображения, похожие на обучающие данные, но не требует закреплять отдельный смысл за каждой координатой z. Поэтому сеть может кодировать коррелирующие признаки совместно, если этого достаточно для воспроизведения распределения данных.
