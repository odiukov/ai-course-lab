- concept: разрешение слоя StyleGAN определяет пространственный масштаб управляемых признаков
  question: Генератор последовательно строит изображение на низком, среднем и высоком разрешениях. Какое распределение стилевых изменений по слоям наиболее правдоподобно?
  explanation: На уровнях 4×4 и 8×8 формируется крупная структура изображения. Уровни 16×16 и 32×32 управляют чертами среднего масштаба, а слои от 64×64 до 1024×1024 уточняют цвет, освещение и мелкую текстуру.
  kind: choice
  options:
    - Низкое разрешение — поза головы; среднее — форма глаз и волос; высокое — блики и текстура кожи
    - Низкое разрешение — поры кожи; среднее — освещение; высокое — поза головы
    - Низкое разрешение — отдельные волоски; среднее — фон; высокое — общая композиция
    - Разрешение слоя не связано с масштабом изменений
  correct: 0
  id: 011-resolution-injections-1
  fingerprint: '74514133'
- concept: подача стиля в несколько слоёв синтеза позволяет управлять признаками разных пространственных масштабов
  question: Почему в StyleGAN стилевой код подают в несколько слоёв сети синтеза, а не только один раз в её начале?
  explanation: Сеть синтеза постепенно повышает разрешение от 4×4 до 1024×1024. Стиль на раннем уровне проходит через всё дальнейшее построение изображения, тогда как стиль на позднем уровне уточняет уже сформированный каркас.
  kind: open
  reference: 'Каждая точка подачи стиля воздействует на признаки своего пространственного масштаба: ранние слои задают крупную структуру, промежуточные — части объекта, поздние — цвет и мелкие детали. Поэтому распределённая подача стиля позволяет выбирать масштаб изменения.'
  id: 011-resolution-injections-2
  fingerprint: 6c1f0b8e
