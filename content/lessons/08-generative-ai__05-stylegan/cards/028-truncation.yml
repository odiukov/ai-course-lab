- concept: truncation масштабирует отклонение стилевого кода от среднего пространства W
  question: Заполни правую часть равенства для truncation в StyleGAN.
  explanation: Из формулы w' = ŵ + ψ(w - ŵ) следует, что отклонение от среднего умножается на ψ. При ψ < 1 стилевой код приближается к среднему, сохраняя лишь часть исходного отклонения.
  kind: cloze
  template: w' - ŵ = ___
  answer: ψ(w - ŵ)
  accept:
    - ψ·(w - ŵ)
    - psi*(w - ŵ)
    - psi(w - ŵ)
  id: 028-truncation-1
  fingerprint: 75a7e6c2
- concept: сдвиг стилевых кодов к среднему повышает типичность результатов ценой разнообразия
  question: Почему уменьшение ψ в truncation StyleGAN обычно сокращает число необычных дефектных изображений, но одновременно делает результаты менее разнообразными?
  explanation: При ψ < 1 truncation приближает каждый w к среднему ŵ. Далёкие и хуже изученные области W подавляются, что часто повышает убедительность результатов, но расстояния между стилями уменьшаются и редкие сочетания свойств исчезают.
  kind: choice
  options:
    - Все отклонения w от среднего сокращаются, поэтому редко встречающиеся области пространства используются реже, а разные стилевые коды сближаются
    - Mapping network начинает выдавать один и тот же случайный шум для всех входных z
    - Сеть синтеза удаляет ранние слои и оставляет только слои высокого разрешения
    - AdaIN перестаёт применять поканальные масштабы и смещения
  correct: 0
  id: 028-truncation-2
