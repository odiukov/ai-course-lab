- concept: фиксация случайного шума позволяет изолировать влияние стилевого кода при проверке функции синтеза
  question: Как проверить, что изменение результата синтеза вызвано заменой стилевого кода одного слоя, а не случайным шумом?
  explanation: Если при втором запуске заново сэмплировать шум, одновременно изменятся два фактора и причину различий установить нельзя. Одинаковый шум превращает замену выбранного стилевого кода в единственное контролируемое изменение.
  kind: open
  reference: Нужно оставить неизменными параметры сети и остальные стилевые коды, а в обоих запусках использовать одну и ту же реализацию шума — например, повторно передать сохранённые шумовые векторы или восстановить состояние генератора случайных чисел. Затем можно сравнить промежуточные активации и итоговый результат.
  id: 032-code-synthesis-2
  fingerprint: 88979afc
