- concept: оценку average_w следует выполнять без построения графа градиентов и изменения параметров mapping network
  question: Функция только оценивает `average_w` и не должна обучать `mapping_network`. Как корректно выполнить прямой проход в PyTorch?
  explanation: '`torch.no_grad()` отключает запись операций в граф градиентов, не меняя параметры сети. `eval()` переключает поведение некоторых слоёв, но сам по себе не отключает вычисление градиентов, а `zero_grad()` лишь очищает уже накопленные градиенты.'
  kind: choice
  options:
    - '`with torch.no_grad(): w = mapping_network(z)`'
    - '`mapping_network.eval(); w = mapping_network(z)`'
    - '`mapping_network.zero_grad(); w = mapping_network(z)`'
    - '`mapping_network.train(); w = mapping_network(z)`'
