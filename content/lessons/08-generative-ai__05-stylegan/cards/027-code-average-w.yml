- concept: стандартная ошибка оценки среднего по независимым сэмплам убывает обратно пропорционально квадратному корню из размера выборки
  question: Число независимых сэмплов для оценки одной координаты среднего W увеличили с 225 до 2025. Во сколько раз приблизительно уменьшится стандартная ошибка оценки?
  explanation: Стандартная ошибка выборочного среднего пропорциональна 1/√N. Размер выборки вырос в 2025/225 = 9 раз, поэтому ошибка уменьшилась в √9 = 3 раза. Большое N делает `average_w` устойчивее, но не устраняет случайные различия полностью.
  kind: numeric
  answer: 3
  tolerance: 0.05
