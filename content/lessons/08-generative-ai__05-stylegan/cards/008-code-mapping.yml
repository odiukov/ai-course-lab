- concept: результат многослойного отображения возвращается после выполнения всего цикла
  question: Где следует разместить `return h` в функции, которая последовательно применяет все слои mapping network?
  explanation: Если `return h` находится внутри цикла, функция завершится после первого слоя. Размещение `return` после цикла позволяет выполнить все 8 преобразований и вернуть итоговый вектор w.
  kind: choice
  options:
    - После завершения цикла по слоям
    - Внутри цикла сразу после первого обновления h
    - Перед циклом сразу после присваивания h = z
