- concept: отсутствие нелинейной активации после стилевой проекции сохраняет возможность отрицательного масштаба
  question: Объясни, почему после аффинной проекции w в масштаб AdaIN обычно не ставят ReLU.
  explanation: Масштаб AdaIN должен иметь возможность принимать значения любого знака. ReLU ограничивает его неотрицательными значениями и тем самым уменьшает выразительность стилевой модуляции.
  kind: open
  reference: ReLU обнулила бы отрицательные значения масштаба, поэтому стиль больше не мог бы менять знак нормализованных активаций. Кроме того, выход проекции перестал бы быть свободным аффинным параметром.
