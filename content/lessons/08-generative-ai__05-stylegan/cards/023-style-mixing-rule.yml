- concept: style mixing переключает источник стилевого кода на границе слоёв без усреднения кодов
  question: Заполни правило подачи стилей в генераторе StyleGAN, если k — первый слой после границы переключения.
  explanation: До границы слои получают w_A, а начиная с границы — w_B. Style mixing выбирает один источник для каждого слоя, а не вычисляет среднее между кодами.
  kind: cloze
  template: s_ℓ = w_A при ℓ < k; s_ℓ = ___ при ℓ ≥ k
  answer: w_B
  accept:
    - wB
    - стиль B
    - код w_B
  id: 023-style-mixing-rule-1
  fingerprint: c83e3abd
- concept: граница style mixing разделяет последовательность слоёв синтеза, а не пространственные области изображения
  question: Что именно разделяет граница style mixing в генераторе StyleGAN?
  explanation: Граница задаётся по глубине сети синтеза. Она переключает источник w между слоями и не является маской, разделяющей готовое изображение по пространству.
  kind: choice
  options:
    - 'Последовательность слоёв синтеза: до границы используется один стилевой код, после неё — другой'
    - Пиксели изображения на две пространственные области с разными стилями
    - Каналы каждого слоя на две равные группы
    - Координаты каждого стилевого кода на две части
