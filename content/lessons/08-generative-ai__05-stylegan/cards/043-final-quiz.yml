- concept: локальная чувствительность генератора оценивается отношением изменения выхода к возмущению латентного кода
  question: Как корректнее сравнить плавность реакции генератора при включённом и выключенном AdaIN?
  explanation: Парное измерение изолирует влияние AdaIN. Отношение ||G(z + δ) − G(z)|| к ||δ|| показывает локальную чувствительность генератора; большой разброс этого отношения указывает на рваную и непредсказуемую реакцию.
  kind: choice
  options:
    - Для каждого режима взять новые латентные коды и субъективно выбрать более красивые изображения.
    - При одинаковых исходных кодах и фиксированной случайности измерить отношение нормы изменения выхода к норме малого возмущения кода.
    - Сравнить только среднюю яркость изображений, не возмущая латентные коды.
    - Изменять одновременно латентный код, шум и параметры генератора, а затем сравнить итоговые изображения.
  correct: 1
  id: 043-final-quiz-1
  fingerprint: 02a3358e
- concept: mixing regularization уменьшает совместную адаптацию разных диапазонов слоёв к одному стилевому коду
  question: Объясни своими словами, зачем во время обучения иногда подавать разные стилевые коды в ранние и поздние слои одного синтеза.
  explanation: Без mixing regularization слои могут совместно приспособиться к корреляциям единственного w. Переключение кода внутри синтеза ослабляет такую коадаптацию и делает управление диапазонами слоёв более независимым.
  kind: open
  reference: Это не просто способ получить смешанное изображение. Такая регуляризация не позволяет диапазонам слоёв полагаться на то, что все они всегда получают один и тот же код, и побуждает сеть устойчивее связывать разные масштабы признаков с соответствующими стилевыми входами.
  id: 043-final-quiz-2
  fingerprint: f1b9b711
- concept: линейное семантическое направление можно получить из нормали SVM и экспериментально ограничить по сохранению идентичности
  question: Расположи этапы поиска и проверки направления улыбки в пространстве W.
  explanation: У линейного SVM нормаль к разделяющей гиперплоскости направлена в сторону изменения оценки класса. Серия сдвигов вдоль этой нормали позволяет проверить эффект и найти предел редактирования, после которого меняется личность.
  kind: order
  items:
    - Получить набор кодов w, сгенерировать для них изображения и разметить наличие улыбки.
    - Обучить линейный SVM различать размеченные классы по векторам w.
    - Взять нормаль к разделяющей гиперплоскости как направление редактирования.
    - Сдвигать новые коды вдоль направления с возрастающей величиной и оценивать улыбку и сохранение идентичности.
    - Определить рабочий диапазон сдвига до неприемлемого изменения идентичности.
  id: 043-final-quiz-3
  fingerprint: fc4b2e6d
