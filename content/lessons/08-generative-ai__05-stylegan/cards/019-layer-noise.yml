- concept: AdaIN после добавления шума восстанавливает заданные стилем поканальные статистики, сохраняя случайный пространственный узор
  question: В слое StyleGAN шум добавляется к карте признаков перед AdaIN. Что произойдёт, если при неизменном стиле w сменить seed шума?
  explanation: Шум меняет взаимное расположение значений внутри карты. Следующая AdaIN нормализует её и заново задаёт поканальные среднее и масштаб из w, поэтому случайный узор сохраняется, а стилевые статистики остаются устойчивыми.
  kind: choice
  options:
    - Изменится пространственная фактура, а заданные стилем среднее и стандартное отклонение канала практически сохранятся
    - Вместе с фактурой произвольно изменятся среднее и стандартное отклонение канала
    - AdaIN полностью удалит шум, поэтому выход слоя останется прежним
    - Смена seed изменит только параметры стиля, но не значения карты признаков
  correct: 0
  id: 019-layer-noise-1
  fingerprint: 21b757f4
- concept: обучаемый поканальный коэффициент определяет чувствительность каждого канала к общей карте шума
  question: Одна и та же пространственная карта шума подаётся в несколько каналов слоя StyleGAN. Почему она может заметно менять один канал и почти не влиять на другой?
  explanation: Поканальные веса шума обучаются вместе с генератором. Благодаря им сеть пропускает случайные отклонения в признаки, где полезна вариативная фактура, и подавляет их в каналах, которым нужна устойчивость.
  kind: open
  reference: Перед добавлением к каждому каналу шум умножается на отдельный обучаемый коэффициент sigma. Большой по модулю коэффициент делает канал чувствительным к случайным деталям, а коэффициент, близкий к нулю, почти блокирует шум.
  id: 019-layer-noise-2
  fingerprint: 73e54f8a
