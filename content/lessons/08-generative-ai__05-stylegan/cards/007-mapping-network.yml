- concept: распределение кодов в W формируется обучаемым отображением, а не задаётся напрямую априорным распределением
  question: Объясни своими словами, чем происхождение распределения кодов в промежуточном пространстве W отличается от происхождения распределения входных кодов Z.
  explanation: В StyleGAN случайный вектор z берут из заданного априорного распределения, а w вычисляют восемью обучаемыми слоями. Поэтому размерность остаётся равной 512, но форма распределения и взаимное расположение кодов в W могут приспособиться к задаче синтеза.
  kind: open
  reference: Коды Z семплируются из заранее выбранного фиксированного распределения. Коды W получаются после обучаемого нелинейного отображения, поэтому их распределение формируется mapping network в ходе обучения и не обязано сохранять геометрию исходного распределения.
  id: 007-mapping-network-2
  fingerprint: d25526ad
