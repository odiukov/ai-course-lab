- concept: точная инверсия возможна только для изображений, входящих в множество выходов генератора
  question: Почему инверсия реальной фотографии в пространство W может не дать её точную копию даже при хорошем алгоритме поиска?
  explanation: Инверсия ищет ближайший доступный выход генератора. Если генератор не умеет воспроизводить уникальную деталь фотографии, точного латентного кода для неё в W не существует.
  kind: choice
  options:
    - Реальная фотография может находиться вне множества изображений, которые способен породить генератор
    - Любой латентный код после первой итерации обязательно становится равен среднему коду
    - Сеть синтеза при инверсии перестаёт использовать обученные веса
    - Пространство W содержит только дискретные коды
  correct: 0
  id: 038-inversion-1
  fingerprint: dbaf5b61
- concept: оптимизационная инверсия итеративно корректирует латентный код по ошибке реконструкции
  question: Расположи этапы одной итерации оптимизационной инверсии StyleGAN в правильном порядке.
  explanation: Оптимизируется не фотография и не обязательно веса генератора, а латентный код. Генерация, сравнение с целью и обновление кода повторяются много раз.
  kind: order
  items:
    - Передать текущий латентный код в генератор
    - Получить сгенерированное изображение
    - Вычислить ошибку между сгенерированным изображением и целевой фотографией
    - Обновить латентный код в направлении уменьшения ошибки
  id: 038-inversion-2
  fingerprint: f921f9fb
- concept: уменьшение функции реконструкции не гарантирует сохранения идентичности и всех значимых деталей
  question: Объясни своими словами, почему дополнительные итерации инверсии могут уменьшать выбранную ошибку реконструкции, но одновременно ухудшать сходство лица с человеком на исходной фотографии.
  explanation: Метрика реконструкции является лишь приближением человеческого восприятия. Поэтому её улучшение не гарантирует сохранения личности, редких деталей или других признаков, важных наблюдателю.
  kind: open
  reference: Оптимизатор улучшает именно заданную функцию ошибки. Если она неполно отражает идентичность и важность отдельных деталей, код может сдвигаться к изображению с меньшей численной ошибкой, но с изменёнными чертами лица или другими семантически важными признаками.
  id: 038-inversion-3
  fingerprint: '37055595'
