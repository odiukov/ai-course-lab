- concept: нелинейные операции могут создавать новые высокие частоты и поэтому требуют дополнительной фильтрации
  question: Почему в alias-free генераторе недостаточно фильтровать карты признаков только при изменении разрешения?
  explanation: Даже полосно-ограниченный сигнал после нелинейности может перестать быть полосно-ограниченным. Дополнительная фильтрация не позволяет новым недопустимым частотам замаскироваться под зависимые от пиксельной сетки узоры.
  kind: open
  reference: Нелинейное преобразование способно породить частотные компоненты, которых не было во входной карте. Если они выходят за диапазон, представимый пиксельной сеткой, возникает алиасинг, поэтому нелинейности также сопровождают фильтрацией.
