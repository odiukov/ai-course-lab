- concept: низкочастотная фильтрация перед уменьшением разрешения предотвращает наложение частот
  question: Расположите действия безопасного уменьшения разрешения карты признаков в правильном порядке.
  explanation: Сначала фильтр удаляет частоты выше допустимого диапазона новой сетки. Если уменьшить разрешение раньше, эти частоты уже превратятся в ложные низкочастотные узоры, которые последующая фильтрация не отличит от настоящих.
  kind: order
  items:
    - Подавить компоненты, которые новая сетка не сможет представить
    - Выполнить выборку карты на более редкой сетке
    - Продолжить синтез с полученной картой признаков
