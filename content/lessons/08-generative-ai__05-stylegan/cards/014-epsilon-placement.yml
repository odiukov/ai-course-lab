- concept: численная опасность нормализации проявляется для почти постоянных карт, поскольку у идеально постоянной карты центрированный числитель исчезает
  question: Почему слишком маленький знаменатель особенно опасен для почти постоянной карты признаков, хотя идеально постоянная карта после нормализации не создаёт огромных значений?
  explanation: Если все элементы математически одинаковы, после вычитания среднего получаются нулевые числители. Для почти постоянной карты или при погрешностях вычислений остаются небольшие ненулевые остатки, и чрезмерно малый знаменатель превращает их в огромные активации.
  kind: choice
  options:
    - У идеально постоянной карты вычитание среднего полностью обнуляет числитель, а у почти постоянной остаются малые отклонения, которые могут резко усилиться
    - У идеально постоянной карты среднее не вычисляется, а у почти постоянной вычисляется
    - Почти постоянная карта всегда имеет отрицательную дисперсию
    - Вычитание среднего увеличивает разброс только у идеально постоянных карт
