- concept: семантическое редактирование в W может задаваться направлением, состоящим из нескольких координат
  question: Объясни своими словами, почему найденное в пространстве W направление «возраст» или «улыбка» не обязано совпадать с одной координатной осью.
  explanation: Распутанность означает более удобное разделение факторов изменения, а не обязательную подпись у каждой координаты. Поэтому нужное редактирование часто выполняют сдвигом вдоль вектора, затрагивающего несколько компонент W.
  kind: open
  reference: Семантическое направление может быть линейной комбинацией нескольких координат W. Более распутанное пространство облегчает поиск направлений с преимущественным влиянием на одно свойство, но не требует, чтобы каждая отдельная координата имела уникальную человеческую интерпретацию.
  id: 010-w-semantics-2
  fingerprint: 8bbf59b5
- concept: распутанность латентного пространства является приблизительной и оценивается по величине побочных изменений
  question: При усилении улыбки через направление в W немного меняется форма щёк, но личность, поза и фон почти сохраняются. Как корректнее интерпретировать результат?
  explanation: Факторы реальных изображений статистически связаны, поэтому идеальная независимость обычно недостижима. Более распутанное W означает, что желаемое изменение выражено сильнее сопутствующих, а не что все остальные пиксели и признаки неизменны.
  kind: choice
  options:
    - 'Направление остаётся полезным: распутанность оценивают по преобладанию целевого изменения над побочными'
    - Пространство полностью запутано, поскольку изменилось больше одного визуального признака
    - Улыбку кодирует одна координата, а изменение щёк доказывает ошибку генератора
  correct: 0
