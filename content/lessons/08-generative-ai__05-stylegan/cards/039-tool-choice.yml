- concept: StyleGAN подходит для генерации изображений из узкого визуального домена
  question: Для какого продукта StyleGAN является наиболее подходящим выбором?
  explanation: 'StyleGAN особенно эффективен, когда все результаты принадлежат одному визуальному семейству: например, лицам, аватарам или определённой категории товаров. Для открытой генерации произвольных сцен по тексту лучше подходит text-to-image диффузия.'
  kind: choice
  options:
    - Генератор портретов персонажей в едином стиле с управлением внешностью
    - Сервис создания произвольных сцен по свободному текстовому описанию
    - Мультимодальный помощник, который отвечает изображением на текст и аудио
    - Генератор иллюстраций, способный изображать ранее не заданные категории объектов
  correct: 0
  id: 039-tool-choice-1
  fingerprint: 3ad9723f
- concept: стандартная архитектура StyleGAN не содержит механизмов текстового обусловливания
  question: Объясни своими словами, почему стандартный StyleGAN нельзя напрямую использовать как генератор произвольных изображений по текстовым промптам.
  explanation: Латентный код StyleGAN сам по себе не кодирует значение слов. Без текстового энкодера и механизма взаимодействия текста с сетью синтеза модель не может понять, какие объекты, свойства и отношения описывает промпт.
  kind: open
  reference: StyleGAN получает случайный латентный вектор, а не смысловое представление текста. В стандартной архитектуре нет текстового энкодера и cross-attention, которые могли бы преобразовать слова в признаки и связать их с элементами изображения. Поэтому модель генерирует вариации внутри выученного визуального домена, но не интерпретирует произвольные промпты.
  id: 039-tool-choice-2
  fingerprint: '67466e53'
