- concept: после AdaIN дисперсия независимого добавочного шума складывается с дисперсией карты признаков
  question: Канал сразу после AdaIN имеет стандартное отклонение 0,9. Затем к нему прибавляют независимый гауссов шум с нулевым средним и стандартным отклонением 1,2. Какое стандартное отклонение ожидается у результата?
  explanation: 'Для независимых величин складываются дисперсии: 0,81 + 1,44 = 2,25. Корень из 2,25 равен 1,5. Значит, шум после AdaIN изменяет заданный стилем разброс.'
  kind: numeric
  answer: 1.5
  tolerance: 0.03
  id: 020-noise-order-1
  fingerprint: b2a33b9a
- concept: нулевое математическое ожидание шума сохраняет среднее только в среднем по сэмплам, а не для каждой конечной карты
  question: К небольшой карте признаков после последней AdaIN добавили шум с нулевым математическим ожиданием. Какое утверждение о среднем канала верно?
  explanation: Нулевое математическое ожидание описывает среднее по множеству реализаций. На конечной пространственной карте выборочное среднее шума обычно не равно нулю в точности, поэтому добавленный после AdaIN шум может сдвинуть среднее конкретного канала.
  kind: choice
  options:
    - Оно в каждом сэмпле останется точно равным смещению, заданному стилем
    - По многим сэмплам оно сохранится, но у отдельной карты может отклониться из-за ненулевого выборочного среднего шума
    - Оно обязательно увеличится, поскольку гауссов шум принимает положительные значения
  correct: 1
