- concept: обучаемая константа служит общей пространственной основой, а не источником различий между изображениями
  question: Почему генератор StyleGAN может начинать синтез всех изображений с одной обучаемой константы и при этом выдавать разные результаты?
  explanation: Обучаемый тензор 4×4×512 одинаков для всех примеров и задаёт удобную общую основу признаков. Конкретный результат определяется стилями, которые воздействуют на последующие слои, поэтому общий старт не делает изображения одинаковыми.
  kind: choice
  options:
    - Константа случайно изменяется перед генерацией каждого изображения
    - Индивидуальные свойства результата вносятся в последующие слои через стилевое управление
    - Константа содержит отдельную заранее сохранённую заготовку для каждого возможного изображения
    - Различия возникают только из-за ошибок округления при вычислениях
  correct: 1
  id: 004-learned-constant-1
  fingerprint: a04ee703
- concept: отделение общей начальной заготовки синтеза от индивидуальных свойств уменьшает нагрузку на первый слой генератора
  question: Объясни своими словами, какую задачу снимает с первых слоёв StyleGAN переход от случайного латентного входа к общей обучаемой константе.
  explanation: При прямой подаче случайного кода начало сети должно заново формировать и пространственную основу, и свойства конкретного изображения. Обучаемая константа стабилизирует основу синтеза и позволяет последовательно вносить различия на следующих слоях.
  kind: open
  reference: Первым слоям больше не требуется одновременно интерпретировать новый случайный код и строить из него пространственную основу изображения. Они начинают с уже обученной общей заготовки, а индивидуальные свойства добавляются далее посредством стилевого управления.
  id: 004-learned-constant-2
  fingerprint: 0b546ab8
