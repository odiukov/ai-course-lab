- concept: среднее пространство W оценивается по выборке выходов mapping network
  question: Расположите действия в правильном порядке, чтобы оценить средний вектор пространства W обученного StyleGAN.
  explanation: Усреднять нужно именно выходы mapping network. Так получается выборочная оценка математического ожидания w для кодов z из априорного распределения.
  kind: order
  items:
    - Независимо сэмплировать набор кодов z из априорного распределения
    - Пропустить каждый код z через mapping network и получить набор векторов w
    - Покоординатно усреднить полученные векторы w
  id: 026-mean-w-1
  fingerprint: 278f5207
- concept: средний вектор W является опорой по математическому ожиданию и не задаёт форму распределения
  question: По большой выборке кодов w вычислили их покоординатное среднее. Какое утверждение об этом векторе корректно?
  explanation: Среднее w вычисляется из наблюдаемых выходов mapping network и служит опорной точкой. Среднее не обязано быть модой, достижимым кодом конкретного z или представлением усреднённого изображения.
  kind: choice
  options:
    - Это оценка математического ожидания в W; она не требует гауссовой или сферической формы распределения и может не совпадать ни с одним кодом выборки
    - Это обязательно наиболее вероятная точка распределения W
    - Это результат подачи нулевого z в mapping network
    - Это латентный код изображения, полученного усреднением всех сгенерированных картинок
  correct: 0
