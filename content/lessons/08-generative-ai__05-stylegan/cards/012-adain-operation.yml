- concept: нормализация перед стилевой модуляцией устраняет зависимость результата от прежних статистик карты признаков
  question: Две карты признаков имеют разные средние и стандартные отклонения. Почему в AdaIN перед применением одинаковых стилевых масштаба и сдвига каждую карту отдельно нормализуют?
  explanation: AdaIN вычитает среднее конкретной карты и делит её на стандартное отклонение. После этого прежние уровень и разброс не влияют на действие стиля, а относительный пространственный рисунок активаций сохраняется.
  kind: choice
  options:
    - Чтобы заменить пространственный рисунок карты случайным шумом
    - Чтобы убрать прежние среднее и разброс, благодаря чему стиль не зависит от исходных статистик карты
    - Чтобы объединить статистики всех изображений в батче
    - Чтобы увеличить пространственное разрешение карты
  correct: 1
  id: 012-adain-operation-1
  fingerprint: 95e30940
- concept: после нормализации модуль стилевого масштаба задаёт стандартное отклонение выходной карты
  question: 'Карта признаков нормализована до нулевого среднего и единичного стандартного отклонения. Затем к ней применили стилевое преобразование: умножили значения на −6 и прибавили 7. Чему равно стандартное отклонение результата?'
  explanation: Прибавление 7 меняет среднее, но не разброс. Умножение на −6 увеличивает стандартное отклонение в |−6| раз, поэтому оно становится равным 6; знак масштаба лишь переворачивает отклонения относительно среднего.
  kind: numeric
  answer: 6
  tolerance: 0.01
