<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Поколения StyleGAN и исправленные отказы</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fc;
      --surface: #ffffff;
      --surface-soft: #f0f3f9;
      --ink: #172033;
      --muted: #5d687c;
      --line: #7d8aa3;
      --grid: #aab4c7;
      --violet: #6548c7;
      --violet-soft: #ece8ff;
      --blue: #2166c2;
      --blue-soft: #e7f1ff;
      --red: #bd3d50;
      --red-soft: #ffeaed;
      --green: #287658;
      --green-soft: #e5f5ee;
      --border: #cbd3e1;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111521;
        --surface: #1b2130;
        --surface-soft: #242c3d;
        --ink: #f1f4fb;
        --muted: #b7c0d2;
        --line: #a5b0c5;
        --grid: #667289;
        --violet: #b4a1ff;
        --violet-soft: #30294e;
        --blue: #85baff;
        --blue-soft: #1b3554;
        --red: #ff8797;
        --red-soft: #4b2730;
        --green: #75d4aa;
        --green-soft: #1e4035;
        --border: #465168;
      }
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      padding: 12px;
    }

    figure {
      width: min(1200px, 100%);
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    figcaption {
      padding: 12px 18px 8px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 460px;
      background: var(--surface);
    }

    .axis {
      stroke: var(--line);
      stroke-width: 3;
      stroke-linecap: round;
    }

    .tick,
    .connector {
      stroke: var(--line);
      stroke-width: 2;
      stroke-linecap: round;
    }

    .axis-head {
      fill: var(--line);
    }

    .card {
      fill: var(--surface-soft);
      stroke: var(--border);
      stroke-width: 2;
    }

    .card-base {
      fill: var(--violet-soft);
      stroke: var(--violet);
    }

    .card-fix {
      fill: var(--blue-soft);
      stroke: var(--blue);
    }

    .card-scale {
      fill: var(--surface-soft);
      stroke: var(--line);
    }

    .card-regularize {
      fill: var(--green-soft);
      stroke: var(--green);
    }

    .accent-base {
      stroke: var(--violet);
      stroke-width: 5;
      stroke-linecap: round;
    }

    .accent-fix {
      stroke: var(--blue);
      stroke-width: 5;
      stroke-linecap: round;
    }

    .accent-scale {
      stroke: var(--line);
      stroke-width: 5;
      stroke-linecap: round;
    }

    .accent-regularize {
      stroke: var(--green);
      stroke-width: 5;
      stroke-linecap: round;
    }

    .title {
      fill: var(--ink);
      font-size: 17px;
      font-weight: 750;
    }

    .body-label {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 550;
    }

    .year {
      fill: var(--ink);
      font-size: 15px;
      font-weight: 750;
    }

    .repair-panel {
      fill: var(--surface-soft);
      stroke: var(--border);
      stroke-width: 2;
    }

    .failure-panel {
      fill: var(--red-soft);
    }

    .success-panel {
      fill: var(--blue-soft);
    }

    .repair-arrow {
      stroke: var(--line);
      stroke-width: 3;
      stroke-linecap: round;
    }

    .repair-head {
      fill: var(--line);
    }

    .failure-dot {
      fill: var(--red);
    }

    .grid-box,
    .grid-line {
      fill: none;
      stroke: var(--red);
      stroke-width: 2;
      stroke-linecap: round;
    }

    .repair-name {
      fill: var(--ink);
      font-size: 15px;
      font-weight: 750;
    }

    .repair-detail {
      fill: var(--muted);
      font-size: 13px;
      font-weight: 550;
    }

    #fallback {
      margin: 12px 18px 18px;
      padding: 14px;
      background: var(--red-soft);
      color: var(--ink);
      font-size: 15px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title">
    <figcaption id="diagram-title">
      Поколения StyleGAN: от причины к ремонту
    </figcaption>

    <svg id="diagram"
         viewBox="0 0 1200 445"
         width="1200"
         height="445"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-label="Временная линия StyleGAN с 2019 по 2025 год и два главных исправления: артефакты-капли устраняет StyleGAN2, а прилипание текстуры к пиксельной сетке устраняет StyleGAN3">
    </svg>

    <div id="fallback" hidden>
      Схема должна была показать временную линию 2019–2025:
      StyleGAN использует AdaIN и progressive growing, StyleGAN2 вводит
      weight demodulation против артефактов-капель, StyleGAN3 применяет
      alias-free операции против прилипания текстуры к сетке,
      StyleGAN-XL достигает ImageNet 1024², а R3GAN усиливает регуляризацию.
    </div>
  </figure>

  <script>
    const data = {
      axis: {
        x1: 0.45, x2: 11.35, y: 2.1,
        head: [
          { x: 11.35, y: 2.1 },
          { x: 11.12, y: 1.98 },
          { x: 11.12, y: 2.22 }
        ]
      },
      events: [
        {
          year: "2019",
          x: 1,
          tick: { y1: 1.98, y2: 2.22, labelSide: 1 },
          connector: { x1: 1, y1: 1.55, x2: 1, y2: 1.98 },
          box: { x1: 0.08, y1: 0.35, x2: 1.92, y2: 1.55 },
          accent: { x1: 0.2, y1: 0.49, x2: 0.2, y2: 1.41 },
          kind: "base",
          labels: [
            { text: "StyleGAN", x: 1, y: 0.66, className: "title" },
            { text: "AdaIN +", x: 1, y: 0.98, className: "body-label" },
            { text: "progressive growing", x: 1, y: 1.25, className: "body-label" }
          ]
        },
        {
          year: "2020",
          x: 2.63,
          tick: { y1: 1.98, y2: 2.22, labelSide: -1 },
          connector: { x1: 2.63, y1: 2.22, x2: 2.63, y2: 2.5 },
          box: { x1: 1.65, y1: 2.5, x2: 3.61, y2: 3.48 },
          accent: { x1: 1.78, y1: 2.63, x2: 1.78, y2: 3.35 },
          kind: "fix",
          labels: [
            { text: "StyleGAN2", x: 2.63, y: 2.76, className: "title" },
            { text: "weight demodulation", x: 2.63, y: 3.04, className: "body-label" },
            { text: "убирает «капли»", x: 2.63, y: 3.29, className: "body-label" }
          ]
        },
        {
          year: "2021",
          x: 4.27,
          tick: { y1: 1.98, y2: 2.22, labelSide: 1 },
          connector: { x1: 4.27, y1: 1.55, x2: 4.27, y2: 1.98 },
          box: { x1: 3.29, y1: 0.35, x2: 5.25, y2: 1.55 },
          accent: { x1: 3.42, y1: 0.49, x2: 3.42, y2: 1.41 },
          kind: "fix",
          labels: [
            { text: "StyleGAN3", x: 4.27, y: 0.66, className: "title" },
            { text: "alias-free", x: 4.27, y: 0.98, className: "body-label" },
            { text: "текстура движется с объектом", x: 4.27, y: 1.25, className: "body-label" }
          ]
        },
        {
          year: "2022",
          x: 5.9,
          tick: { y1: 1.98, y2: 2.22, labelSide: -1 },
          connector: { x1: 5.9, y1: 2.22, x2: 5.9, y2: 2.5 },
          box: { x1: 4.86, y1: 2.5, x2: 6.94, y2: 3.48 },
          accent: { x1: 4.99, y1: 2.63, x2: 4.99, y2: 3.35 },
          kind: "scale",
          labels: [
            { text: "StyleGAN-XL", x: 5.9, y: 2.76, className: "title" },
            { text: "ImageNet", x: 5.9, y: 3.04, className: "body-label" },
            { text: "1024²", x: 5.9, y: 3.29, className: "body-label" }
          ]
        },
        {
          year: "2025",
          x: 10.8,
          tick: { y1: 1.98, y2: 2.22, labelSide: 1 },
          connector: { x1: 10.8, y1: 1.55, x2: 10.8, y2: 1.98 },
          box: { x1: 9.62, y1: 0.35, x2: 11.56, y2: 1.55 },
          accent: { x1: 9.75, y1: 0.49, x2: 9.75, y2: 1.41 },
          kind: "regularize",
          labels: [
            { text: "R3GAN", x: 10.59, y: 0.72, className: "title" },
            { text: "усиленная", x: 10.59, y: 1.03, className: "body-label" },
            { text: "регуляризация", x: 10.59, y: 1.3, className: "body-label" }
          ]
        }
      ],
      repairs: [
        {
          panel: { x1: 0.16, y1: 3.72, x2: 5.75, y2: 4.45 },
          panelClass: "failure-panel",
          spots: [
            { x: 0.48, y: 4.03, r: 0.1 },
            { x: 0.36, y: 4.22, r: 0.07 },
            { x: 0.61, y: 4.23, r: 0.06 }
          ],
          source: [
            { text: "Круглые «капли»", x: 0.77, y: 3.98, className: "repair-name" },
            { text: "визуальный отказ", x: 0.77, y: 4.23, className: "repair-detail" }
          ],
          arrow: { x1: 2.45, y1: 4.09, x2: 2.97, y2: 4.09 },
          head: [
            { x: 2.97, y: 4.09 },
            { x: 2.78, y: 3.98 },
            { x: 2.78, y: 4.2 }
          ],
          target: [
            { text: "StyleGAN2", x: 3.15, y: 3.98, className: "repair-name" },
            { text: "weight demodulation", x: 3.15, y: 4.23, className: "repair-detail" }
          ]
        },
        {
          panel: { x1: 5.95, y1: 3.72, x2: 11.65, y2: 4.45 },
          panelClass: "success-panel",
          grid: {
            box: { x1: 6.16, y1: 3.88, x2: 6.58, y2: 4.3 },
            lines: [
              { x1: 6.3, y1: 3.88, x2: 6.3, y2: 4.3 },
              { x1: 6.44, y1: 3.88, x2: 6.44, y2: 4.3 },
              { x1: 6.16, y1: 4.02, x2: 6.58, y2: 4.02 },
              { x1: 6.16, y1: 4.16, x2: 6.58, y2: 4.16 }
            ]
          },
          source: [
            { text: "Текстура на сетке", x: 6.78, y: 3.98, className: "repair-name" },
            { text: "«прилипшее» движение", x: 6.78, y: 4.23, className: "repair-detail" }
          ],
          arrow: { x1: 8.76, y1: 4.09, x2: 9.25, y2: 4.09 },
          head: [
            { x: 9.25, y: 4.09 },
            { x: 9.06, y: 3.98 },
            { x: 9.06, y: 4.2 }
          ],
          target: [
            { text: "StyleGAN3", x: 9.43, y: 3.98, className: "repair-name" },
            { text: "alias-free", x: 9.43, y: 4.23, className: "repair-detail" }
          ]
        }
      ]
    };

    const origin = { x: 48, y: 7 };
    const scale = 94;
    const sx = x => origin.x + x * scale;
    const sy = y => origin.y + y * scale;

    const labelPadding = 12;

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");

      const make = (name, attributes, content) => {
        const element = document.createElementNS(svg.namespaceURI, name);
        Object.entries(attributes).forEach(([key, value]) => {
          element.setAttribute(key, String(value));
        });
        if (content !== undefined) element.textContent = content;
        return element;
      };

      const addLine = (parent, item, className) => {
        parent.appendChild(make("line", {
          x1: sx(item.x1),
          y1: sy(item.y1),
          x2: sx(item.x2),
          y2: sy(item.y2),
          class: className
        }));
      };

      const addRect = (parent, item, className) => {
        parent.appendChild(make("rect", {
          x: sx(item.x1),
          y: sy(item.y1),
          width: sx(item.x2) - sx(item.x1),
          height: sy(item.y2) - sy(item.y1),
          class: className
        }));
      };

      const addPolygon = (parent, points, className) => {
        parent.appendChild(make("polygon", {
          points: points.map(point =>
            `${sx(point.x)},${sy(point.y)}`
          ).join(" "),
          class: className
        }));
      };

      const addText = (parent, item, anchor = "middle") => {
        parent.appendChild(make("text", {
          x: sx(item.x),
          y: sy(item.y),
          class: item.className,
          "text-anchor": anchor,
          "dominant-baseline": "middle"
        }, item.text));
      };

      const repairLayer = make("g", { "aria-label": "Связи отказов и ремонтов" });
      data.repairs.forEach(repair => {
        addRect(repairLayer, repair.panel, `repair-panel ${repair.panelClass}`);

        if (repair.spots) {
          repair.spots.forEach(spot => {
            repairLayer.appendChild(make("circle", {
              cx: sx(spot.x),
              cy: sy(spot.y),
              r: sx(spot.r) - sx(0),
              class: "failure-dot"
            }));
          });
        }

        if (repair.grid) {
          addRect(repairLayer, repair.grid.box, "grid-box");
          repair.grid.lines.forEach(item =>
            addLine(repairLayer, item, "grid-line")
          );
        }

        repair.source.forEach(item => addText(repairLayer, item, "start"));
        addLine(repairLayer, repair.arrow, "repair-arrow");
        addPolygon(repairLayer, repair.head, "repair-head");
        repair.target.forEach(item => addText(repairLayer, item, "start"));
      });
      svg.appendChild(repairLayer);

      const connectorLayer = make("g", { "aria-hidden": "true" });
      data.events.forEach(event => {
        addLine(connectorLayer, event.connector, "connector");
      });
      svg.appendChild(connectorLayer);

      const axisLayer = make("g", { "aria-label": "Временная линия 2019–2025" });
      addLine(axisLayer, data.axis, "axis");
      addPolygon(axisLayer, data.axis.head, "axis-head");

      data.events.forEach(event => {
        addLine(axisLayer, {
          x1: event.x,
          y1: event.tick.y1,
          x2: event.x,
          y2: event.tick.y2
        }, "tick");

        axisLayer.appendChild(make("text", {
          x: sx(event.x),
          y: sy(data.axis.y) + event.tick.labelSide * labelPadding,
          class: "year",
          "text-anchor": "middle",
          "dominant-baseline":
            event.tick.labelSide > 0 ? "hanging" : "auto"
        }, event.year));
      });
      svg.appendChild(axisLayer);

      const cardLayer = make("g", { "aria-label": "Поколения и нововведения" });
      data.events.forEach(event => {
        addRect(cardLayer, event.box, `card card-${event.kind}`);
        addLine(cardLayer, event.accent, `accent-${event.kind}`);
        event.labels.forEach(item => addText(cardLayer, item));
      });
      svg.appendChild(cardLayer);

      fallback.hidden = true;
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      svg.hidden = true;
      fallback.hidden = false;
    }
  </script>
</body>
</html>
