<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Уровни разрешения и точки управления стилем</title>
<style>
  :root {
    color-scheme: light;
    --page: #f7f4ee;
    --surface: #fffdf9;
    --ink: #252330;
    --muted: #666273;
    --grid: #d8d3dc;
    --step: #f1edf3;
    --step-edge: #c9c2ce;
    --style: #7653d6;
    --style-ink: #ffffff;
    --early: #168b83;
    --early-soft: #dff4ef;
    --middle: #bb711b;
    --middle-soft: #fff0d5;
    --late: #b04772;
    --late-soft: #fae4ed;
    --shadow: rgba(42, 35, 54, .09);
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  figure {
    width: 100%;
    max-width: 1000px;
    max-height: 520px;
    margin: 0 auto;
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 14px;
    box-shadow: 0 6px 24px var(--shadow);
  }

  figcaption {
    padding: 14px 22px 8px;
    font-size: 20px;
    font-weight: 720;
    line-height: 1.2;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 470px;
    overflow: visible;
    background: var(--surface);
  }

  text {
    fill: var(--ink);
    font-family: inherit;
  }

  .column-title {
    fill: var(--muted);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .02em;
  }

  .resolution {
    font-size: 15px;
    font-weight: 760;
    font-variant-numeric: tabular-nums;
  }

  .growth-label {
    fill: var(--muted);
    font-size: 12px;
    font-weight: 650;
    letter-spacing: .02em;
  }

  .step {
    fill: var(--step);
    stroke: var(--step-edge);
    stroke-width: 1.5px;
  }

  .step-accent {
    stroke-width: 3px;
    stroke-linecap: round;
  }

  .injection-link {
    stroke: var(--style);
    stroke-width: 2px;
    stroke-linecap: round;
    opacity: .52;
  }

  .injection {
    fill: var(--style);
    stroke: var(--surface);
    stroke-width: 2px;
  }

  .injection-label {
    fill: var(--style-ink);
    font-size: 11px;
    font-weight: 800;
    font-style: italic;
    pointer-events: none;
  }

  .connector {
    fill: none;
    stroke-width: 2px;
    stroke-linecap: round;
  }

  .panel {
    stroke-width: 1.5px;
  }

  .early-fill {
    fill: var(--early-soft);
    stroke: var(--early);
  }

  .middle-fill {
    fill: var(--middle-soft);
    stroke: var(--middle);
  }

  .late-fill {
    fill: var(--late-soft);
    stroke: var(--late);
  }

  .early-stroke {
    stroke: var(--early);
  }

  .middle-stroke {
    stroke: var(--middle);
  }

  .late-stroke {
    stroke: var(--late);
  }

  .panel-kicker {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .08em;
  }

  .panel-main {
    font-size: 16px;
    font-weight: 760;
  }

  .panel-note {
    fill: var(--muted);
    font-size: 13px;
    font-weight: 560;
  }

  .early-text {
    fill: var(--early);
  }

  .middle-text {
    fill: var(--middle);
  }

  .late-text {
    fill: var(--late);
  }

  .legend {
    fill: var(--muted);
    font-size: 13px;
    font-weight: 650;
  }

  .fallback {
    fill: var(--ink);
    font-size: 16px;
    font-weight: 650;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #15141b;
      --surface: #201e28;
      --ink: #f2eef7;
      --muted: #b9b2c3;
      --grid: #403b49;
      --step: #2b2833;
      --step-edge: #514b5c;
      --style: #a98bf5;
      --style-ink: #17131f;
      --early: #5bd0c4;
      --early-soft: #173b39;
      --middle: #f1b45f;
      --middle-soft: #49351d;
      --late: #ee8fb5;
      --late-soft: #4b2938;
      --shadow: rgba(0, 0, 0, .32);
    }
  }
</style>
</head>
<body>
<figure>
  <figcaption id="diagram-title">Где стиль меняет изображение</figcaption>
  <svg
    id="diagram"
    viewBox="0 0 1000 450"
    width="1000"
    height="450"
    preserveAspectRatio="xMidYMid meet"
    role="img"
    aria-labelledby="diagram-title diagram-description">
    <desc id="diagram-description">
      Вертикальная лестница разрешений от 4 на 4 до 1024 на 1024.
      На каждом из девяти уровней расположены две точки подачи стиля w,
      всего восемнадцать. Ранние уровни управляют крупной структурой,
      средние — чертами, поздние — цветом, светом и текстурой.
    </desc>
  </svg>
</figure>

<script>
"use strict";

const data = Object.freeze({
  zero: 0,
  round: 0.14,
  pointRadius: 0.22,
  arrow: {
    x: 0.42,
    top: 1.18,
    bottom: 8.45,
    left: 0.29,
    right: 0.55,
    neck: 8.17,
    labelX: 0.12,
    labelY: 4.75,
    rotation: -90
  },
  headers: [
    { x: 1.34, y: 0.34, text: "РАЗРЕШЕНИЕ", anchor: "end" },
    { x: 6.25, y: 0.34, text: "ДВЕ ПОДАЧИ w", anchor: "middle" },
    { x: 13.82, y: 0.34, text: "МАСШТАБ ИЗМЕНЕНИЯ", anchor: "middle" }
  ],
  rows: [
    { value: "4×4",       y: 1.43, top: 1.12, bottom: 1.74, start: 2.08, end: 8.55, p: [5.88, 6.66], group: "early" },
    { value: "8×8",       y: 2.27, top: 1.96, bottom: 2.58, start: 2.34, end: 8.55, p: [5.88, 6.66], group: "early" },
    { value: "16×16",     y: 3.11, top: 2.80, bottom: 3.42, start: 2.60, end: 8.55, p: [5.88, 6.66], group: "middle" },
    { value: "32×32",     y: 3.95, top: 3.64, bottom: 4.26, start: 2.86, end: 8.55, p: [5.88, 6.66], group: "middle" },
    { value: "64×64",     y: 4.79, top: 4.48, bottom: 5.10, start: 3.12, end: 8.55, p: [5.88, 6.66], group: "late" },
    { value: "128×128",   y: 5.63, top: 5.32, bottom: 5.94, start: 3.38, end: 8.55, p: [5.88, 6.66], group: "late" },
    { value: "256×256",   y: 6.47, top: 6.16, bottom: 6.78, start: 3.64, end: 8.55, p: [5.88, 6.66], group: "late" },
    { value: "512×512",   y: 7.31, top: 7.00, bottom: 7.62, start: 3.90, end: 8.55, p: [5.88, 6.66], group: "late" },
    { value: "1024×1024", y: 8.15, top: 7.84, bottom: 8.46, start: 4.16, end: 8.55, p: [5.88, 6.66], group: "late" }
  ],
  panels: [
    {
      group: "early", x1: 9.15, x2: 18.72, top: 1.05, bottom: 2.65,
      lines: [
        { y: 1.42, text: "РАННИЕ УРОВНИ", kind: "kicker" },
        { y: 1.86, text: "Поза · форма головы", kind: "main" },
        { y: 2.26, text: "причёска · композиция", kind: "note" }
      ]
    },
    {
      group: "middle", x1: 9.15, x2: 18.72, top: 2.73, bottom: 4.33,
      lines: [
        { y: 3.10, text: "СРЕДНИЕ УРОВНИ", kind: "kicker" },
        { y: 3.54, text: "Черты лица · глаза", kind: "main" },
        { y: 3.94, text: "форма волос", kind: "note" }
      ]
    },
    {
      group: "late", x1: 9.15, x2: 18.72, top: 4.41, bottom: 8.53,
      lines: [
        { y: 5.26, text: "ПОЗДНИЕ УРОВНИ", kind: "kicker" },
        { y: 5.82, text: "Каркас уже построен", kind: "main" },
        { y: 6.42, text: "Цвет · освещение", kind: "main" },
        { y: 6.94, text: "мелкая текстура", kind: "main" },
        { y: 7.67, text: "Поздно переносить всю голову", kind: "note" }
      ]
    }
  ],
  connectorStart: 8.55,
  connectorEnd: 9.15,
  resolutionX: 1.34,
  legend: { x: 5.30, y: 8.92, text: "18 точек стиля: по две на каждом уровне разрешения" },
  fallback: {
    x: 1.00,
    y1: 3.75,
    y2: 4.45,
    line1: "Схема должна показать уровни 4, 8, 16, 32, 64, 128,",
    line2: "256, 512 и 1024 — по две точки подачи стиля на каждом."
  }
});

const origin = Object.freeze({ x: 42, y: 22 });
const scale = 46;
const sx = x => origin.x + x * scale;
const sy = y => origin.y + y * scale;

try {
  const svg = document.getElementById("diagram");
  const namespace = "http://www.w3.org/2000/svg";

  const make = (tag, attrs, content) => {
    const node = document.createElementNS(namespace, tag);
    Object.entries(attrs || {}).forEach(([name, value]) => {
      node.setAttribute(name, String(value));
    });
    if (content !== undefined) node.textContent = content;
    return node;
  };

  const layer = make("g", { id: "generated-diagram" });
  svg.appendChild(layer);

  data.headers.forEach(header => {
    layer.appendChild(make("text", {
      x: sx(header.x),
      y: sy(header.y),
      "text-anchor": header.anchor,
      "dominant-baseline": "middle",
      class: "column-title"
    }, header.text));
  });

  layer.appendChild(make("line", {
    x1: sx(data.arrow.x),
    y1: sy(data.arrow.top),
    x2: sx(data.arrow.x),
    y2: sy(data.arrow.neck),
    class: "connector late-stroke"
  }));

  layer.appendChild(make("polygon", {
    points: [
      `${sx(data.arrow.left)},${sy(data.arrow.neck)}`,
      `${sx(data.arrow.x)},${sy(data.arrow.bottom)}`,
      `${sx(data.arrow.right)},${sy(data.arrow.neck)}`
    ].join(" "),
    class: "late-fill"
  }));

  layer.appendChild(make("text", {
    x: sx(data.arrow.labelX),
    y: sy(data.arrow.labelY),
    transform: `rotate(${data.arrow.rotation} ${sx(data.arrow.labelX)} ${sy(data.arrow.labelY)})`,
    "text-anchor": "middle",
    "dominant-baseline": "middle",
    class: "growth-label"
  }, "РАЗРЕШЕНИЕ РАСТЁТ"));

  data.panels.forEach(panel => {
    layer.appendChild(make("rect", {
      x: sx(panel.x1),
      y: sy(panel.top),
      width: sx(panel.x2) - sx(panel.x1),
      height: sy(panel.bottom) - sy(panel.top),
      rx: sx(data.round) - sx(data.zero),
      class: `panel ${panel.group}-fill`
    }));

    panel.lines.forEach(line => {
      layer.appendChild(make("text", {
        x: sx((panel.x1 + panel.x2) / scale * scale / (scale + scale) + (panel.x1 + panel.x2) / (scale + scale) * scale),
        y: sy(line.y),
        "text-anchor": "middle",
        "dominant-baseline": "middle",
        class: `panel-${line.kind} ${panel.group}-text`
      }, line.text));
    });
  });

  data.rows.forEach(row => {
    layer.appendChild(make("text", {
      x: sx(data.resolutionX),
      y: sy(row.y),
      "text-anchor": "end",
      "dominant-baseline": "middle",
      class: "resolution"
    }, row.value));

    layer.appendChild(make("rect", {
      x: sx(row.start),
      y: sy(row.top),
      width: sx(row.end) - sx(row.start),
      height: sy(row.bottom) - sy(row.top),
      rx: sx(data.round) - sx(data.zero),
      class: "step"
    }));

    layer.appendChild(make("line", {
      x1: sx(row.start),
      y1: sy(row.top),
      x2: sx(row.start),
      y2: sy(row.bottom),
      class: `step-accent ${row.group}-stroke`
    }));

    const [firstPoint, secondPoint] = row.p;

    layer.appendChild(make("line", {
      x1: sx(firstPoint),
      y1: sy(row.y),
      x2: sx(secondPoint),
      y2: sy(row.y),
      class: "injection-link"
    }));

    row.p.forEach(point => {
      layer.appendChild(make("circle", {
        cx: sx(point),
        cy: sy(row.y),
        r: sx(data.pointRadius) - sx(data.zero),
        class: "injection"
      }));

      layer.appendChild(make("text", {
        x: sx(point),
        y: sy(row.y),
        "text-anchor": "middle",
        "dominant-baseline": "central",
        class: "injection-label"
      }, "w"));
    });

    layer.appendChild(make("line", {
      x1: sx(data.connectorStart),
      y1: sy(row.y),
      x2: sx(data.connectorEnd),
      y2: sy(row.y),
      class: `connector ${row.group}-stroke`
    }));
  });

  layer.appendChild(make("text", {
    x: sx(data.legend.x),
    y: sy(data.legend.y),
    "text-anchor": "start",
    "dominant-baseline": "middle",
    class: "legend"
  }, data.legend.text));
} catch (error) {
  const svg = document.getElementById("diagram");
  const namespace = "http://www.w3.org/2000/svg";
  const textOne = document.createElementNS(namespace, "text");
  const textTwo = document.createElementNS(namespace, "text");

  textOne.setAttribute("x", String(sx(data.fallback.x)));
  textOne.setAttribute("y", String(sy(data.fallback.y1)));
  textOne.setAttribute("class", "fallback");
  textOne.textContent = data.fallback.line1;

  textTwo.setAttribute("x", String(sx(data.fallback.x)));
  textTwo.setAttribute("y", String(sy(data.fallback.y2)));
  textTwo.setAttribute("class", "fallback");
  textTwo.textContent = data.fallback.line2;

  svg.appendChild(textOne);
  svg.appendChild(textTwo);
}
</script>
</body>
</html>
