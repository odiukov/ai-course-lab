<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Почему шум должен предшествовать AdaIN</title>
<style>
:root{
  color-scheme:light dark;
  --bg:whitesmoke;
  --panel:white;
  --ink:midnightblue;
  --muted:slategray;
  --line:lightsteelblue;
  --good:seagreen;
  --good-soft:honeydew;
  --bad:darkorange;
  --bad-soft:oldlace;
  --noise:mediumpurple;
  --adain:royalblue;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111827;
    --panel:#1f2937;
    --ink:#f1f5f9;
    --muted:#b6c2d1;
    --line:#526178;
    --good:#55d68b;
    --good-soft:#173b2a;
    --bad:#ffb347;
    --bad-soft:#482f16;
    --noise:#bd9cff;
    --adain:#79a7ff;
  }
}
html,body,figure,h1,p{margin:unset}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}
figure{background:var(--bg)}
h1{
  font-size:20px;
  text-align:center;
  padding:8px;
}
svg{
  display:block;
  width:100%;
  height:auto;
  max-height:440px;
  background:var(--bg);
}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}
.separator{stroke:var(--line);stroke-width:2}
.block{fill:var(--panel);stroke-width:3}
.noise{stroke:var(--noise)}
.adain{stroke:var(--adain)}
.result-good,.note-good{fill:var(--good-soft);stroke:var(--good);stroke-width:2}
.result-bad,.note-bad{fill:var(--bad-soft);stroke:var(--bad);stroke-width:2}
.arrow{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.arrowhead{fill:var(--ink)}
.target{fill:none;stroke:var(--adain);stroke-width:2;stroke-linecap:round}
.dot{fill:var(--noise)}
.panel-title{fill:var(--ink);font-size:20px;font-weight:bold}
.badge-good{fill:var(--good);font-size:14px;font-weight:bold}
.badge-bad{fill:var(--bad);font-size:14px;font-weight:bold}
.block-title{fill:var(--ink);font-size:18px;font-weight:bold}
.block-detail{fill:var(--muted);font-size:14px}
.arrow-label{fill:var(--muted);font-size:13px}
.result-kicker{fill:var(--muted);font-size:13px;font-weight:bold}
.result-value{fill:var(--ink);font-size:25px;font-weight:bold}
.result-detail{fill:var(--muted);font-size:14px}
.note-title{fill:var(--ink);font-size:16px;font-weight:bold}
.note-text{fill:var(--muted);font-size:14px}
.fallback{
  color:var(--ink);
  background:var(--panel);
  font-size:17px;
  padding:16px;
}
</style>
</head>
<body>
<figure aria-labelledby="diagram-title">
  <h1 id="diagram-title">Почему шум должен идти перед AdaIN</h1>
  <svg id="diagram" viewBox="0 0 1100 440" width="1100" height="440"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Сравнение порядка шум затем AdaIN и AdaIN затем шум">
    <title>Шум до AdaIN сохраняет статистики стиля, шум после AdaIN сдвигает их</title>
  </svg>
  <p id="fallback" class="fallback" hidden>
    Схема должна была показать: шум перед AdaIN сохраняет заданные стилем
    среднее 2 и стандартное отклонение 0,5, а шум после AdaIN увеличивает
    стандартное отклонение примерно до 0,64 и может сдвинуть среднее.
  </p>
</figure>
<script>
const DATA=[{
  zero:0,
  panels:[
    {x:14,y:34,w:520,h:392,cls:"panel"},
    {x:566,y:34,w:520,h:392,cls:"panel"}
  ],
  separator:{x1:550,y1:50,x2:550,y2:410},
  blocks:[
    {x:40,y:105,w:120,h:82,cls:"block noise",cx:100,
      lines:[
        {x:100,y:136,text:"Шум",cls:"block-title"},
        {x:100,y:164,text:"σ = 0,4",cls:"block-detail"}
      ]},
    {x:220,y:105,w:132,h:82,cls:"block adain",cx:286,
      lines:[
        {x:286,y:134,text:"AdaIN",cls:"block-title"},
        {x:286,y:160,text:"μ = 2 · σ = 0,5",cls:"block-detail"}
      ]},
    {x:592,y:105,w:132,h:82,cls:"block adain",cx:658,
      lines:[
        {x:658,y:134,text:"AdaIN",cls:"block-title"},
        {x:658,y:160,text:"μ = 2 · σ = 0,5",cls:"block-detail"}
      ]},
    {x:792,y:105,w:120,h:h=82,cls:"block noise",cx:852,
      lines:[
        {x:852,y:136,text:"Шум",cls:"block-title"},
        {x:852,y:164,text:"σ = 0,4",cls:"block-detail"}
      ]}
  ],
  arrows:[
    {x1:160,y1:146,x2:220,y2:146,a:9,
      label:{x:170,y:126,text:"сначала случайность",anchor:"start"}},
    {x1:352,y1:146,x2:420,y2:146,a:9,
      label:{x:362,y:126,text:"затем контроль",anchor:"start"}},
    {x1:724,y1:146,x2:792,y2:146,a:9,
      label:{x:734,y:126,text:"калибровка уже была",anchor:"start"}},
    {x1:912,y1:146,x2:972,y2:146,a:9,
      label:{x:922,y:126,text:"исправлять некому",anchor:"start"}}
  ],
  targetLines:[
    {x1:286,y1:92,x2:286,y2:105},
    {x1:658,y1:92,x2:658,y2:105}
  ],
  resultBoxes:[
    {x:40,y:224,w:470,h:94,cls:"result-good"},
    {x:592,y:224,w:470,h:94,cls:"result-bad"}
  ],
  noteBoxes:[
    {x:40,y:342,w:470,h:62,cls:"note-good"},
    {x:592,y:342,w:470,h:62,cls:"note-bad"}
  ],
  dots:[
    {x:430,y:138,r:5},{x:446,y:151,r:4},{x:461,y:132,r:6},
    {x:477,y:157,r:5},{x:493,y:139,r:4},
    {x:982,y:138,r:5},{x:998,y:151,r:4},{x:1013,y:132,r:6},
    {x:1029,y:157,r:5},{x:1045,y:139,r:4}
  ],
  labels:[
    {x:34,y:67,text:"ШУМ → AdaIN",cls:"panel-title",anchor:"start",dx:0,dy:0},
    {x:514,y:67,text:"СТИЛЬ СОХРАНЁН",cls:"badge-good",anchor:"end",dx:0,dy:0},
    {x:586,y:67,text:"AdaIN → ШУМ",cls:"panel-title",anchor:"start",dx:0,dy:0},
    {x:1066,y:67,text:"СТАТИСТИКИ УПЛЫВАЮТ",cls:"badge-bad",anchor:"end",dx:0,dy:0},
    {x:286,y:87,text:"w задаёт μ = 2 и σ = 0,5",cls:"arrow-label",anchor:"middle",dx:0,dy:0},
    {x:658,y:87,text:"w задаёт μ = 2 и σ = 0,5",cls:"arrow-label",anchor:"middle",dx:0,dy:0},
    {x:420,y:146,text:"Выход",cls:"block-detail",anchor:"end",dx:-8,dy:5},
    {x:972,y:146,text:"Выход",cls:"block-detail",anchor:"end",dx:-8,dy:5},
    {x:58,y:248,text:"ИТОГОВЫЕ СТАТИСТИКИ",cls:"result-kicker",anchor:"start",dx:0,dy:0},
    {x:275,y:282,text:"μ = 2     σ = 0,5",cls:"result-value",anchor:"middle",dx:0,dy:0},
    {x:275,y:305,text:"ровно те, что задал w",cls:"result-detail",anchor:"middle",dx:0,dy:0},
    {x:610,y:248,text:"ИТОГОВЫЕ СТАТИСТИКИ",cls:"result-kicker",anchor:"start",dx:0,dy:0},
    {x:827,y:282,text:"μ ≈ 2     σ ≈ 0,64",cls:"result-value",anchor:"middle",dx:0,dy:0},
    {x:827,y:305,text:"на малой карте μ тоже может заметно сдвинуться",cls:"result-detail",anchor:"middle",dx:0,dy:0},
    {x:58,y:367,text:"AdaIN получает последнее слово",cls:"note-title",anchor:"start",dx:0,dy:0},
    {x:58,y:391,text:"Фактура остаётся, яркость и контраст подчиняются стилю.",cls:"note-text",anchor:"start",dx:0,dy:0},
    {x:610,y:367,text:"Шум получает последнее слово",cls:"note-title",anchor:"start",dx:0,dy:0},
    {x:610,y:391,text:"Случайность меняет уже откалиброванные статистики.",cls:"note-text",anchor:"start",dx:0,dy:0}
  ]
}];
const origin=Object.freeze({x:0,y:0});
const scale=1;
const sx=x=>origin.x+x*scale;
const sy=y=>origin.y+y*scale;

const [D]=DATA;
const svg=document.getElementById("diagram");
const fallback=document.getElementById("fallback");
const NS="http://www.w3.org/2000/svg";

function make(tag,attrs,parent=svg){
  const el=document.createElementNS(NS,tag);
  Object.entries(attrs).forEach(([key,value])=>el.setAttribute(key,value));
  parent.appendChild(el);
  return el;
}
function rect(g){
  make("rect",{
    x:sx(g.x),y:sy(g.y),
    width:sx(g.w)-sx(D.zero),
    height:sy(g.h)-sy(D.zero),
    class:g.cls
  });
}
function line(g,cls){
  make("line",{
    x1:sx(g.x1),y1:sy(g.y1),x2:sx(g.x2),y2:sy(g.y2),class:cls
  });
}
function label(g){
  const el=make("text",{
    x:sx(g.x),y:sy(g.y),dx:g.dx??D.zero,dy:g.dy??D.zero,
    class:g.cls,"text-anchor":g.anchor??"middle"
  });
  el.textContent=g.text;
}
function arrow(g){
  line(g,"arrow");
  make("polygon",{
    points:[
      [sx(g.x2),sy(g.y2)],
      [sx(g.x2-g.a),sy(g.y2-g.a)],
      [sx(g.x2-g.a),sy(g.y2+g.a)]
    ].map(point=>point.join(",")).join(" "),
    class:"arrowhead"
  });
  label({...g.label,cls:"arrow-label",dx:D.zero,dy:D.zero});
}

try{
  D.panels.forEach(rect);
  line(D.separator,"separator");
  D.targetLines.forEach(item=>line(item,"target"));
  D.blocks.forEach(block=>{
    rect(block);
    block.lines.forEach(label);
  });
  D.arrows.forEach(arrow);
  D.dots.forEach(dot=>make("circle",{
    cx:sx(dot.x),cy:sy(dot.y),r:sx(dot.r)-sx(D.zero),class:"dot"
  }));
  D.resultBoxes.forEach(rect);
  D.noteBoxes.forEach(rect);
  D.labels.forEach(label);
}catch(error){
  svg.hidden=true;
  fallback.hidden=false;
}
</script>
</body>
</html>
