- concept: независимая случайная инициализация весов нарушает симметрию между нейронами
  question: Как следует инициализировать веса разных скрытых нейронов, чтобы они могли обучаться разным признакам?
  explanation: При одинаковых весах нейроны вычисляют одинаковые значения и получают одинаковые обновления. Независимые случайные веса нарушают эту симметрию и позволяют нейронам осваивать разные признаки.
  kind: choice
  options:
    - Случайно создать одну строку весов и скопировать её всем нейронам
    - Присвоить всем весам одинаковое постоянное значение
    - Получить каждый вес отдельной случайной выборкой из одного распределения
  correct: 2
  id: 010-pishem-init-net-1
  fingerprint: 0ab55426
- concept: передача генератора случайных чисел делает инициализацию воспроизводимой
  question: Объясни своими словами, зачем функции инициализации сети принимать генератор случайных чисел извне.
  explanation: Если функция использует переданный rng, начальные веса определяются его состоянием. Один и тот же seed позволяет повторить инициализацию, сравнить запуски и надёжно проверить код.
  kind: open
  reference: Внешний код может заранее зафиксировать состояние генератора и получить ту же последовательность начальных весов при повторном запуске. Это делает эксперименты и тесты воспроизводимыми.
