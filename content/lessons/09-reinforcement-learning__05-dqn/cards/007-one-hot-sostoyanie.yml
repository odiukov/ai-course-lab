- concept: размерность one-hot представления равна числу возможных категориальных состояний
  question: Агент перемещается по прямоугольному полю размером 7 × 9 клеток. Каждая клетка кодируется отдельным one-hot признаком. Какова размерность входного вектора?
  explanation: На поле 7 × 9 = 63 возможных положения, поэтому one-hot вектор содержит 63 координаты — по одной на каждое состояние.
  kind: numeric
  answer: 63
  tolerance: 0.01
  id: 007-one-hot-sostoyanie-1
  fingerprint: 3490fddf
- concept: one-hot кодирование устраняет искусственный порядок категориальных состояний, но не кодирует связи между ними
  question: Объясни, почему номер категориального состояния как единственный скаляр может вводить нейросеть в заблуждение и что в этом отношении меняет one-hot кодирование.
  explanation: Номер категории — это ярлык, а не измеряемая величина. One-hot отделяет категории друг от друга, не приписывая им ложную близость, но содержательные связи сеть должна выучить из данных.
  kind: open
  reference: 'Скалярные номера создают искусственный порядок и расстояние между состояниями: близкие номера выглядят похожими, хотя сами категории могут быть никак не связаны. В one-hot представлении каждому состоянию соответствует отдельная активная координата, поэтому такого числового сходства нет. Однако соседство или другие отношения между состояниями one-hot сам по себе не передаёт.'
  id: 007-one-hot-sostoyanie-2
  fingerprint: 2fcbd3f6
