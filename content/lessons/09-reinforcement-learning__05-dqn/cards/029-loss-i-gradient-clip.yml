- concept: Huber loss квадратичен для малых TD-ошибок и линеен для больших
  question: Как Huber loss реагирует на рост абсолютной TD-ошибки?
  explanation: Для небольших TD-ошибок Huber loss ведёт себя как MSE, а для крупных переходит к линейному росту. Поэтому выброс продолжает влиять на обучение, но его градиент не растёт неограниченно вместе с ошибкой.
  kind: choice
  options:
    - Остаётся квадратичным при любой величине ошибки
    - Вблизи нуля растёт квадратично, а после порога — линейно
    - Полностью исключает переходы с ошибкой выше порога
    - Ограничивает записанную в переходе награду
  correct: 1
  id: 029-loss-i-gradient-clip-1
  fingerprint: 93b49943
- concept: gradient clipping по норме пропорционально масштабирует весь градиент, сохраняя его направление
  question: Градиент имеет координаты (8, 15), а предел его евклидовой нормы равен 6. На какой коэффициент нужно умножить весь градиент при clipping? Округли до тысячных.
  explanation: Исходная норма равна √(8² + 15²) = 17. Для получения нормы 6 весь вектор масштабируют с коэффициентом 6 / 17 ≈ 0.353. Координаты меняются пропорционально, поэтому направление градиента сохраняется.
  kind: numeric
  answer: 0.353
  tolerance: 0.002
  id: 029-loss-i-gradient-clip-2
  fingerprint: e347770b
