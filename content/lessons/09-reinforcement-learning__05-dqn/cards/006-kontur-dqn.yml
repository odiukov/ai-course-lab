- concept: переходы и параметры циркулируют между четырьмя компонентами контура обучения DQN
  question: Расположи события одного цикла обучения DQN в правильном порядке.
  explanation: Опыт возникает в среде, сохраняется и перемешивается replay-буфером, после чего используется для градиентного обновления online-сети. Target-сеть во время этих обновлений заморожена и лишь периодически получает копию весов online-сети.
  kind: order
  items:
    - Среда выполняет действие и возвращает переход (s, a, r, s').
    - Переход сохраняется в replay-буфере.
    - Из replay-буфера случайно выбирается минибатч.
    - Online-сеть обновляет веса по ошибке между своим прогнозом и целью от target-сети.
    - При наступлении момента синхронизации веса online-сети копируются в target-сеть.
  id: 006-kontur-dqn-1
  fingerprint: 30c8df86
- concept: случайная выборка из replay-буфера уменьшает временную корреляцию обучающих примеров
  question: Агент получает последовательность почти одинаковых кадров, из-за чего соседние обучающие примеры сильно коррелируют. Какой механизм DQN непосредственно решает эту проблему?
  explanation: Replay-буфер хранит прошлые переходы, а случайная выборка смешивает события из разных моментов. Это ослабляет корреляцию соседних кадров и позволяет повторно использовать редкий полезный опыт.
  kind: choice
  options:
    - Случайная выборка минибатчей из replay-буфера
    - Обучение только на самом свежем переходе
    - Синхронизация target-сети после каждого перехода
    - Сортировка переходов по времени их появления
  correct: 0
  id: 006-kontur-dqn-2
  fingerprint: 1107fc4a
- concept: бутстрэппинговая часть TD-цели в DQN вычисляется target-сетью
  question: Подставь параметры сети, которая в обычном DQN оценивает лучшее действие следующего состояния при вычислении TD-цели.
  explanation: Прогноз Q(s, a; θ) вычисляет обучаемая online-сеть, а значение следующего состояния для цели — замороженная target-сеть с параметрами θ⁻. В неё периодически копируют актуальные параметры θ.
  kind: cloze
  template: y = r + γ max_{a'} Q(s', a'; ___)
  answer: θ⁻
  accept:
    - theta^-
    - theta minus
    - параметры target-сети
  id: 006-kontur-dqn-3
  fingerprint: 352d177d
