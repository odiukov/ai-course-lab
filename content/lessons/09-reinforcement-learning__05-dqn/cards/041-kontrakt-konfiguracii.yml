- concept: архитектура DQN выбирается с учётом структуры наблюдений
  question: Среда возвращает фиксированный вектор вещественных признаков без пространственной или временной структуры. Какую архитектуру разумно выбрать для базового DQN?
  explanation: Для состояния из числовых признаков естественная базовая архитектура — MLP. CNN нужна прежде всего для пространственно организованных наблюдений вроде изображений, а Transformer — когда существенна структура последовательности.
  kind: choice
  options:
    - Полносвязную MLP
    - Свёрточную CNN
    - Авторегрессионный Transformer
    - Рекуррентную сеть только для синхронизации целей
  correct: 0
  id: 041-kontrakt-konfiguracii-1
  fingerprint: '37310537'
- concept: DQN предназначен для дискретного пространства действий
  question: В новой среде действие задаётся непрерывным вектором управляющих сигналов. Как следует поступить при подготовке алгоритма обучения?
  explanation: Обычный DQN выдаёт отдельную Q-оценку для каждого дискретного действия. Для непрерывного пространства пришлось бы максимизировать Q по бесконечному множеству вариантов, поэтому такой запрос следует направить к алгоритмам вроде SAC или TD3.
  kind: choice
  options:
    - Оставить DQN и увеличить replay-буфер
    - Оставить DQN и быстрее уменьшать ε
    - Отказаться от DQN и рассмотреть SAC или TD3
    - Заменить target-сеть дополнительным выходным слоем
  correct: 2
  id: 041-kontrakt-konfiguracii-2
  fingerprint: 72155ecc
- concept: проверяемый DQN-конфиг явно фиксирует все основные инженерные решения
  question: Объясните своими словами, какие группы параметров нужно явно зафиксировать, чтобы запуск DQN был воспроизводимым и его результаты можно было диагностировать.
  explanation: 'В конфиге из урока эти группы превращены в конкретные решения: MLP, параметры replay и warmup, жёсткая синхронизация target-сети, расписание ε, Huber loss, gradient clipping, обработка редкой крупной награды и включённый Double DQN. Это позволяет воспроизвести запуск и менять по одному фактору.'
  kind: open
  reference: Нужно указать архитектуру и размер сети; ёмкость replay-буфера, размер мини-батча и warmup; способ и период синхронизации target-сети; начальное и конечное ε и длительность расписания; функцию потерь, ограничение градиента и обработку масштаба награды; а также состояние Double DQN. Среда должна иметь дискретные действия.
  id: 041-kontrakt-konfiguracii-3
  fingerprint: '76846692'
