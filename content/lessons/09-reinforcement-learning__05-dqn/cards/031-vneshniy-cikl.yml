- concept: порядок операций в одной итерации внешнего цикла DQN
  question: Расположите операции одной итерации взаимодействия и обучения DQN в правильном порядке.
  explanation: Сначала агент получает и сохраняет целостный переход, затем может обучаться на случайном минибатче. Target-сеть синхронизируется по отдельному расписанию, а текущее состояние заменяется следующим после обработки перехода.
  kind: order
  items:
    - Выбрать действие ε-жадно по online-сети
    - Получить от среды следующее состояние, награду и признак завершения
    - Сохранить полный переход в replay-буфере
    - При достаточном объёме буфера выбрать минибатч и обновить online-сеть
    - При наступлении интервала синхронизировать target-сеть
    - Сделать следующее состояние текущим
  id: 031-vneshniy-cikl-1
  fingerprint: 8f9d023a
- concept: частота синхронизации target-сети задаётся числом взаимодействий со средой, а не числом эпизодов
  question: Почему расписание синхронизации target-сети в DQN обычно привязывают к общему числу шагов взаимодействия со средой, а не к числу завершённых эпизодов?
  explanation: При синхронизации по эпизодам короткие попытки приводили бы к более частым обновлениям target-сети, а длинные — к более редким. Общий счётчик шагов сохраняет стабильную частоту синхронизации относительно потока опыта.
  kind: open
  reference: Эпизоды могут иметь разную длину. Счётчик взаимодействий обеспечивает одинаковый интервал между синхронизациями в количестве собранных переходов и обновлений независимо от того, как часто заканчиваются эпизоды.
  id: 031-vneshniy-cikl-2
  fingerprint: 6c4665c2
