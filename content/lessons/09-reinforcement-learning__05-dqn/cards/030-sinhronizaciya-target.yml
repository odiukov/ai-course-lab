- concept: уменьшение τ усиливает сглаживание обновлений target-сети, но увеличивает её запаздывание
  question: Как уменьшение τ влияет на движение target-сети и на компромисс между стабильностью и скоростью следования за online-сетью?
  explanation: τ регулирует скорость слежения target-сети. Малое значение сильнее сглаживает изменения, а большое ускоряет следование за online-сетью, но ослабляет стабилизирующий эффект.
  kind: open
  reference: При меньшем τ каждое обновление переносит в target-сеть меньшую долю текущих online-весов. Поэтому target-сеть меняется плавнее и TD-цели обычно стабильнее, но сильнее отстаёт от online-сети и медленнее учитывает новые параметры.
  id: 030-sinhronizaciya-target-3
