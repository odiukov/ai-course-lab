- concept: мягкое обновление target-сети вычисляется как взвешенная смесь текущих online-весов и прежних target-весов
  question: Для одного параметра вес online-сети равен 14, прежний вес target-сети равен 4, а τ = 0,2. Каким станет вес target-сети после одного мягкого обновления?
  explanation: Мягкое обновление даёт 0,2 × 14 + 0,8 × 4 = 2,8 + 3,2 = 6. Target-сеть сдвигается к online-сети лишь на заданную долю расхождения.
  kind: numeric
  answer: 6
  tolerance: 0.01
  id: 030-sinhronizaciya-target-1
  fingerprint: f6602b02
- concept: жёсткая и мягкая синхронизация по-разному распределяют изменение TD-целей во времени
  question: Какое утверждение верно сравнивает жёсткую и мягкую синхронизацию target-сети?
  explanation: Жёсткое копирование создаёт участки с полностью фиксированной целью, разделённые скачками. Мягкое обновление заменяет эти скачки небольшими регулярными сдвигами, сохраняя отставание target-сети.
  kind: choice
  options:
    - При жёсткой синхронизации target-веса неизменны между копированиями и могут резко измениться при копировании; при мягкой они понемногу меняются после каждого обновления.
    - При жёсткой синхронизации target-веса непрерывно следуют за online-весами, а при мягкой остаются полностью замороженными.
    - Оба способа дают одинаковую последовательность target-весов независимо от интервала копирования и τ.
    - Мягкая синхронизация мгновенно делает target-сеть точной копией online-сети и устраняет её отставание.
