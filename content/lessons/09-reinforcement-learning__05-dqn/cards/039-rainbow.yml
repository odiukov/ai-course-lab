- concept: Rainbow объединяет совместимые улучшения, направленные на разные слабые места DQN
  question: Почему компоненты Rainbow можно применять совместно, а их выигрыши способны примерно складываться?
  explanation: Приоритизированный replay управляет выбором переходов, dueling — устройством Q-сети, noisy-сети — исследованием, многошаговый возврат — распространением награды, а распределённый DQN — формой предсказываемой ценности. Эти изменения решают разные проблемы одного каркаса DQN.
  kind: open
  reference: 'Компоненты изменяют разные части алгоритма: выбор опыта, архитектуру сети, исследование, построение учебной цели и представление возврата. Поэтому улучшение одного механизма не заменяет остальные.'
  id: 039-rainbow-1
  fingerprint: d8c6f00c
- concept: распределённый DQN моделирует распределение возможных возвратов вместо одного среднего Q-значения
  question: Что предсказывает распределённый вариант DQN для пары состояния и действия?
  explanation: Обычный DQN выдаёт скалярную оценку ожидаемого возврата. Распределённый DQN моделирует несколько возможных исходов и их вероятности, сохраняя больше информации о неопределённости возврата.
  kind: choice
  options:
    - Только вероятность выбора этого действия текущей стратегией
    - Набор возможных значений возврата и соответствующие им вероятности
    - Только максимальную награду, когда-либо встречавшуюся в replay-буфере
    - Вероятность того, что переход будет выбран для обучения
  correct: 1
  id: 039-rainbow-2
  fingerprint: b5e4b014
- concept: dueling-архитектура раздельно оценивает ценность состояния и преимущества действий
  question: Какую отдельную величину наряду с преимуществом действия предсказывает dueling-сеть?
  explanation: Голова V(s) оценивает состояние независимо от конкретного действия, а голова преимущества показывает, насколько каждое действие лучше или хуже остальных. Затем эти оценки объединяются в Q(s, a).
  kind: cloze
  template: Dueling DQN использует отдельные головы для ___ и преимущества A(s, a).
  answer: V(s)
  accept:
    - V
    - ценности состояния
    - ценности состояния V(s)
