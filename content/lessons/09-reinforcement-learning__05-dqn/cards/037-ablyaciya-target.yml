- concept: нестабильность DQN распознаётся по повторяющемуся распаду достигнутого качества, а не по отдельному шумному эпизоду
  question: Объясни своими словами, по каким признакам на кривых возврата можно отличить нестабильность DQN без target-сети от обычного шума обучения.
  explanation: Случайные действия и стохастичность среды создают шум даже при исправном обучении. Поэтому оценивают не единичный провал, а динамику скользящего среднего и воспроизводимость повторных обвалов в независимых запусках.
  kind: open
  reference: 'Обычный шум проявляется отдельными скачками возврата. О нестабильности говорит повторяющаяся потеря уже достигнутого качества: сглаженный возврат растёт, затем заметно падает, восстанавливается и снова разрушается, не выходя на устойчивое плато. Убедительнее всего такой рисунок выглядит, если повторяется при нескольких случайных инициализациях.'
  id: 037-ablyaciya-target-2
  fingerprint: ec7a809d
- concept: раннее сходство кривых не опровергает стабилизирующую роль target-сети
  question: Обычный DQN и его вариант без target-сети сначала показывают похожее улучшение возврата. Какой вывод корректен?
  explanation: Удаление target-сети может не давать немедленного эффекта. Раскачка возникает по мере того, как обновлённые оценки начинают использоваться для построения последующих TD-целей, поэтому важна более поздняя динамика кривых.
  kind: choice
  options:
    - Target-сеть точно не влияет на обучение
    - Вариант без target-сети уже доказал свою устойчивость
    - 'Нужно продолжить наблюдение: нестабильность может проявиться после накопления взаимного влияния обновляемых оценок и TD-целей'
    - Оба агента обязательно придут к одной и той же стратегии
  correct: 2
