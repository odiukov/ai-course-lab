- concept: накопитель градиентов для нового мини-батча обнуляется и повторяет структуру параметров сети
  question: Почему перед обработкой нового мини-батча накопитель градиентов должен быть заполнен нулями и иметь ту же структуру, что и параметры online-сети?
  explanation: Каждому весу и смещению нужен собственный накопленный градиент. Если накопитель не обнулить, очередное обновление будет зависеть от уже обработанных мини-батчей, даже когда алгоритм этого не предусматривает.
  kind: open
  reference: Обнуление не позволяет градиентам предыдущего мини-батча попасть в новое обновление, а совпадающая структура позволяет отдельно накапливать градиент каждого параметра сети.
  id: 028-pishem-train-step-1
  fingerprint: 15ec430c
- concept: одно мини-батчевое обновление DQN выполняется после накопления градиентов всех переходов
  question: Расположи этапы одного мини-батчевого обновления online-сети DQN в правильном порядке.
  explanation: Параметры остаются неизменными, пока вычисляются градиенты всего мини-батча, а затем обновляются однократно. Если применять SGD внутри обхода, последующие градиенты будут вычисляться уже для изменённой сети — это другая процедура обучения.
  kind: order
  items:
    - Создать нулевой накопитель градиентов
    - Вычислить и добавить в накопитель градиенты всех переходов мини-батча
    - Применить накопленные градиенты к параметрам online-сети
  id: 028-pishem-train-step-2
  fingerprint: ca648176
