- concept: пересечение порога скользящим средним надёжнее одиночного успешного эпизода как свидетельство обучения
  question: Объясни своими словами, почему один возврат выше заданного порога ещё не доказывает, что DQN устойчиво научился решать задачу.
  explanation: Возвраты отдельных эпизодов остаются шумными даже у улучшающегося агента. Поэтому обучение оценивают по тенденции скользящего среднего, одновременно сохраняя сырые возвраты для наблюдения за разбросом.
  kind: open
  reference: Одиночный возврат может оказаться случайно высоким из-за исследования в ε-жадной стратегии или стохастичности среды. Скользящее среднее учитывает серию недавних эпизодов и ослабляет влияние отдельных удач и провалов, поэтому его пересечение порога лучше отражает устойчивую тенденцию.
  id: 036-krivaya-obucheniya-3
  fingerprint: dd027059
