- concept: скользящее среднее возврата вычисляется по последнему фиксированному окну эпизодов
  question: Последние четыре эпизода дали возвраты −12, −8, −7 и −5. Чему равно скользящее среднее возврата по этому окну?
  explanation: 'Нужно сложить возвраты и разделить сумму на размер окна: (−12 − 8 − 7 − 5) / 4 = −8.'
  kind: numeric
  answer: -8
  tolerance: 0.01
  id: 036-krivaya-obucheniya-1
  fingerprint: '95942e23'
- concept: размер окна задаёт компромисс между чувствительностью и сглаживанием скользящего среднего
  question: Что обычно произойдёт, если для одной и той же истории возвратов заменить короткое окно скользящего среднего длинным?
  explanation: Длинное окно усредняет больше эпизодов и сильнее подавляет случайные колебания. При этом новые результаты составляют меньшую долю среднего, поэтому изменение тенденции становится заметно позже.
  kind: choice
  options:
    - Кривая станет более шумной и будет быстрее реагировать на изменения
    - Кривая станет более гладкой, но будет позже отражать изменения
    - Кривая обязательно станет монотонно возрастающей
    - Среднее перестанет зависеть от возвратов последних эпизодов
  correct: 1
