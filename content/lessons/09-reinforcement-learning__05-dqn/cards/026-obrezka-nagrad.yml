- concept: reward clipping может изменить оптимальную стратегию из-за потери информации о величине награды
  question: Объясни своими словами, почему стратегия, оптимальная после reward clipping, может оказаться неоптимальной по исходной сумме наград.
  explanation: 'Стабилизация достигается ценой изменения целевой задачи: маленькое вознаграждение и большой выигрыш дают одинаковый обучающий сигнал. Reward clipping безопасен лишь тогда, когда величина награды несущественна по сравнению с её знаком.'
  kind: open
  reference: После clipping все положительные награды становятся равнозначными независимо от их величины. Агент оптимизирует количество и вероятность положительных событий, но перестаёт учитывать, насколько одни из них ценнее других. Поэтому порядок предпочтения стратегий может измениться.
