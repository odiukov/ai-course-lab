- concept: каждая координата выхода Q-сети соответствует отдельному дискретному действию
  question: У агента пять дискретных действий, и Q-сеть возвращает вектор из пяти значений. Что означает отдельная координата этого вектора?
  explanation: Q-сеть выдаёт по одной оценке ценности для каждого доступного действия. Координаты выходного вектора должны быть сопоставлены действиям в заранее установленном порядке.
  kind: choice
  options:
    - Вероятность того, что среда выберет соответствующее действие
    - Оценку ожидаемой выгоды соответствующего действия в текущем состоянии
    - Номер нейрона скрытого слоя
    - Награду, уже полученную за предыдущее действие
  correct: 1
  id: 015-proverka-form-1
  fingerprint: 832cab8b
- concept: Q-оценки не являются распределением вероятностей и не требуют нормировки
  question: Объясни своими словами, почему выходные значения Q-сети могут быть отрицательными и не обязаны в сумме давать единицу.
  explanation: Вероятности обычно ограничены диапазоном от нуля до единицы и нормированы. Q-значения оценивают будущую выгоду действий, поэтому таких ограничений у них нет.
  kind: open
  reference: Это оценки ожидаемой накопленной награды для разных действий, а не вероятности. Поэтому они могут иметь любой знак и не подчиняются условию нормировки.
  id: 015-proverka-form-2
  fingerprint: daec65ea
