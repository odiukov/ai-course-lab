- concept: ε задаёт вероятность исследовательского случайного действия в ε-жадной стратегии
  question: Как ε влияет на выбор действия в ε-жадной стратегии DQN?
  explanation: 'ε управляет долей исследования: чем оно выше, тем чаще агент действует случайно. По мере затухания ε агент всё чаще использует действие с максимальной Q-оценкой.'
  kind: choice
  options:
    - С вероятностью ε выбирается случайное действие, иначе — действие с максимальной текущей Q-оценкой
    - С вероятностью ε выбирается действие с максимальной Q-оценкой, иначе — случайное
    - Значение ε прибавляется ко всем Q-оценкам перед выбором действия
  correct: 0
  id: 032-epsilon-v-dqn-1
  fingerprint: 73a37e03
- concept: расписание ε привязывается к числу взаимодействий со средой
  question: Агент может выполнять несколько обновлений сети после одного взаимодействия со средой. По какому счётчику следует изменять ε?
  explanation: ε определяет способ выбора действий при взаимодействии со средой, поэтому его расписание считают в шагах среды. Число градиентных обновлений может не совпадать с числом таких шагов.
  kind: choice
  options:
    - По числу завершённых эпизодов
    - По числу взаимодействий агента со средой
    - По числу обновлений параметров online-сети
  correct: 1
  id: 032-epsilon-v-dqn-2
  fingerprint: 46c4ae64
- concept: скорость затухания ε определяет баланс между исследованием среды и использованием найденной стратегии
  question: Объясни своими словами, чем опасны слишком быстрое и слишком медленное уменьшение ε при обучении DQN.
  explanation: В начале обучения требуется достаточно исследования, чтобы собрать разнообразный опыт. Позже преобладание случайных действий мешает использовать накопленные знания, поэтому ε постепенно уменьшают, но сохраняют небольшую вероятность исследования.
  kind: open
  reference: При слишком быстром уменьшении ε агент может закрепить случайно найденное поведение и не исследовать более выгодные действия. При слишком медленном уменьшении ε он продолжает часто действовать случайно, хотя Q-сеть уже способна принимать полезные решения.
  id: 032-epsilon-v-dqn-3
  fingerprint: 29ea54c5
