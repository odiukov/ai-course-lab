- concept: потеря DQN для одного перехода равна квадрату разности между TD-целью и Q-оценкой выполненного действия
  question: Для выполненного действия сеть предсказала Q-значение 1,8, а TD-цель равна 4,3. Чему равна квадратичная потеря для этого перехода?
  explanation: TD-ошибка равна 4,3 − 1,8 = 2,5. Квадратичная потеря составляет 2,5² = 6,25.
  kind: numeric
  answer: 6.25
  tolerance: 0.001
  id: 016-td-kak-regressiya-1
  fingerprint: b7d84877
- concept: один переход задаёт регрессионную метку только для выхода, соответствующего выполненному действию
  question: Агент выполнил действие «повернуть налево» и сохранил переход в replay-буфере. Какой выход Q-сети непосредственно сравнивается с TD-целью при обучении на этом переходе?
  explanation: Переход содержит наблюдённый результат только выполненного действия. Поэтому TD-цель непосредственно обучает Q(s,a) для этого действия, а остальные выходы не получают отдельных меток из данного перехода.
  kind: choice
  options:
    - Выход для действия «повернуть налево»
    - Все выходы сети с одной и той же TD-целью
    - Только выход с наибольшим текущим Q-значением
    - Все выходы, кроме выхода для выполненного действия
  correct: 0
  id: 016-td-kak-regressiya-2
  fingerprint: 0c8e5e25
- concept: при обновлении online-сети TD-цель используется как фиксированная метка без распространения градиента через неё
  question: Почему при градиентном обновлении DQN TD-цель отделяют от вычислительного графа и считают фиксированной меткой?
  explanation: Если не распространять градиент через TD-цель, оптимизатор корректирует только предсказание выбранного действия. Целевая величина во время данного шага остаётся неподвижной, поэтому направление обновления определено однозначно.
  kind: open
  reference: Чтобы градиент изменял предсказание online-сети Q(s,a;θ), приближая его к заданной TD-цели, но не пытался одновременно изменить саму цель через её вычислительную ветвь. Это превращает обновление в обычный шаг регрессии к временно фиксированной метке.
  id: 016-td-kak-regressiya-3
  fingerprint: e8f2dbaf
