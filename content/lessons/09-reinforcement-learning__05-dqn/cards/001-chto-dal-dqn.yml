  fingerprint: e55ce13c
- concept: DQN обучается принимать решения непосредственно по пикселям и наградам без семантической разметки объектов
  question: Объясни своими словами, почему для обучения DQN игре по изображению не нужны отдельные метки вроде «мяч» и «платформа».
  explanation: Сеть оптимизирует оценки будущей награды, а не качество распознавания заранее заданных объектов. Поэтому представление изображения и выбор действия могут обучаться совместно по игровым переходам.
  kind: open
  reference: DQN получает кадры, действия, награды и последующие состояния. Ошибка между текущей оценкой Q и целевой оценкой возврата изменяет параметры сети, поэтому полезные визуальные признаки формируются в процессе обучения поведению, без разметки объектов человеком.
  id: 001-chto-dal-dqn-2
  fingerprint: facf0e14
