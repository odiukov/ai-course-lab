- concept: скрытая активация вычисляется применением ReLU после аффинного преобразования входа
  question: Заполните формулу прямого прохода сети со скрытым слоем.
  explanation: Сначала вход подвергается аффинному преобразованию, затем ReLU формирует скрытые активации. Выходной слой применяет к ним ещё одно аффинное преобразование.
  kind: cloze
  template: h = ___; q = W_out h + b_out
  answer: ReLU(W_in x + b_in)
  accept:
    - relu(W_in x + b_in)
    - ReLU(b_in + W_in x)
  id: 013-pryamoy-prohod-1
  fingerprint: fb250ba7
- concept: без нелинейной активации последовательность аффинных слоёв эквивалентна одному аффинному слою
  question: Что произойдёт, если между двумя аффинными слоями заменить ReLU тождественным преобразованием?
  explanation: Композиция без ReLU имеет вид C(Ax + a) + c = (CA)x + (Ca + c), то есть остаётся аффинным преобразованием. ReLU не позволяет свернуть оба слоя таким образом.
  kind: choice
  options:
    - Сеть сможет представлять больше нелинейных зависимостей
    - Всё преобразование можно будет свернуть в один аффинный слой
    - Все выходные значения станут неотрицательными
  correct: 1
  id: 013-pryamoy-prohod-2
  fingerprint: 1967fe0d
- concept: линейный выходной слой не ограничивает знак предсказываемых Q-значений
  question: Q-сеть оценивает ожидаемый суммарный выигрыш для каждого действия. Почему после выходного слоя обычно не применяют ReLU?
  explanation: Скрытая ReLU добавляет нелинейность, но на выходе ограничение неотрицательностью не нужно. Линейный выход позволяет предсказывать Q-значения любого знака.
  kind: open
  reference: Q-значение может быть отрицательным, если ожидаемые будущие награды отрицательны. ReLU обрезала бы такие оценки до нуля и лишила сеть возможности корректно различать плохие действия.
  id: 013-pryamoy-prohod-3
  fingerprint: c7c07f6f
