- concept: число параметров двухслойной полносвязной сети включает все веса и по одному смещению на каждый нейрон
  question: У полносвязной сети 13 входов, 29 скрытых нейронов и 7 выходов. Сколько всего обучаемых параметров в двух слоях с отдельным смещением у каждого скрытого и выходного нейрона?
  explanation: Первый слой хранит 29 · 13 весов и 29 смещений, второй — 7 · 29 весов и 7 смещений. Итого 29 · 13 + 29 + 7 · 29 + 7 = 616.
  kind: numeric
  answer: 616
  tolerance: 0.01
