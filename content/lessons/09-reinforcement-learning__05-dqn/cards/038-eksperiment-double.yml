- concept: сравнение смещения алгоритмов требует серии контролируемых запусков с разными случайными инициализациями
  question: Какой эксперимент надёжнее всего показывает, что один вариант DQN систематически меньше завышает Q-оценки?
  explanation: Один запуск может оказаться случайно удачным или неудачным. Для оценки систематического смещения нужны повторные запуски, усреднение результата и одинаковые условия для сравниваемых алгоритмов.
  kind: choice
  options:
    - Сравнить среднее смещение по нескольким случайным запускам при одинаковых среде, шуме и гиперпараметрах
    - Выбрать по одному самому удачному запуску каждого алгоритма и сравнить их итоговые возвраты
    - Обучить алгоритмы при разных уровнях шума и сравнить максимальные найденные Q-значения
    - Остановить каждый алгоритм в момент его наибольшего возврата и сравнить Q-оценки
