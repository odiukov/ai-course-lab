- concept: возврат измеряет качество поведения, а смещение Q — точность оценки ожидаемого результата
  question: Объясни своими словами, почему одинаковый средний возврат двух агентов не означает, что их Q-оценки одинаково точны.
  explanation: Политика зависит прежде всего от относительного порядка оценок действий, поэтому ошибочный масштаб Q может не изменить выбранное действие. Смещение проверяют отдельно, сравнивая предсказанные Q-значения с истинными ценностями.
  kind: open
  reference: Возврат показывает фактически получаемые агентом награды и характеризует качество его действий. Точность Q-оценок определяется их отклонением от истинных ценностей. Два агента могут выбирать одинаковые действия и получать сходный возврат, хотя один из них систематически завышает или занижает ожидаемый результат.
