- concept: смертельная тройка состоит из аппроксимации функции, бутстрэппинга и обучения off-policy
  question: Какое сочетание факторов называют «смертельной тройкой» в обучении с подкреплением?
  explanation: Нестабильность особенно вероятна, когда общие параметры аппроксимируют Q-функцию, цель строится из текущих оценок агента, а данные собраны не той стратегией, которую оценивает обновление.
  kind: choice
  options:
    - Аппроксимация функции, бутстрэппинг и обучение off-policy
    - Дискретные действия, жадный выбор и редкие награды
    - Свёрточная сеть, нормализация входов и обучение on-policy
    - Большой буфер опыта, высокая скидка и случайная инициализация
  correct: 0
  id: 004-smertelnaya-troika-1
  fingerprint: 2ec3ae9e
- concept: off-policy обучение использует данные одной стратегии для оценки другой
  question: Агент собирает переходы исследовательской стратегией со случайными действиями, а при обновлении Q-функции ориентируется на лучшее доступное действие. Почему это обучение считается off-policy?
  explanation: Off-policy означает несовпадение стратегии поведения и оцениваемой стратегии. В Q-learning данные могут быть получены случайными действиями, хотя цель обновления использует жадный максимум.
  kind: open
  reference: Переходы создаёт исследовательская стратегия поведения, но обновление оценивает целевую жадную стратегию. Стратегия сбора данных и стратегия, для которой обучается Q-функция, различаются.
  id: 004-smertelnaya-troika-2
  fingerprint: 63cbdc0b
- concept: бутстрэппинг с общими изменяемыми весами создаёт движущуюся цель и положительную обратную связь
  question: Расположите события в порядке, показывающем, как наивное обучение нейросетевой Q-функции может получить движущуюся цель.
  explanation: Цель зависит от предсказания самой обучаемой сети. Поэтому обновление способно одновременно приблизить текущее значение к цели и изменить саму цель; такая обратная связь может усиливать ошибки и приводить к расходимости.
  kind: order
  items:
    - Сеть обновляет общие веса, уменьшая ошибку для выбранного перехода
    - Из-за общих весов меняется оценка следующего состояния
    - Изменившаяся оценка следующего состояния сдвигает бутстрэппинговую цель
    - Новое обновление начинает догонять уже сдвинувшуюся цель
  id: 004-smertelnaya-troika-3
  fingerprint: 781de049
