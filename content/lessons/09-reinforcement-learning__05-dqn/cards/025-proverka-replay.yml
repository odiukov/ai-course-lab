- concept: warmup откладывает начало обучения до накопления достаточно разнообразного опыта
  question: Зачем в DQN обычно выполняют warmup replay-буфера перед первыми градиентными обновлениями?
  explanation: Warmup позволяет сначала накопить более разнообразный опыт. Он не запрещает повторное использование переходов и не заменяет случайную выборку из буфера.
  kind: choice
  options:
    - Чтобы первые обновления не определялись небольшим и однообразным набором начальных переходов
    - Чтобы каждый переход использовался строго один раз
    - Чтобы полностью исключить необходимость случайной выборки батчей
  correct: 0
