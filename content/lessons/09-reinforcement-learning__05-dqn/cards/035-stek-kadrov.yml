- concept: стек последовательных кадров приближает наблюдение к марковскому состоянию
  question: Объясни, почему добавление нескольких последовательных кадров во вход DQN может сделать состояние ближе к марковскому.
  explanation: Марковское состояние должно содержать достаточно информации о текущей динамике. Стек кадров раскрывает движение, скрытое в отдельном снимке, и уменьшает зависимость решения от более далёкой истории.
  kind: open
  reference: По изменению положения объектов между кадрами сеть может определить направление и оценить скорость движения. Благодаря этому текущее представление содержит больше информации, необходимой для выбора действия и предсказания ближайших последствий без обращения ко всей истории.
  id: 035-stek-kadrov-2
