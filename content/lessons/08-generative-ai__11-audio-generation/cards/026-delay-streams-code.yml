  fingerprint: 8fa2cbda
- concept: срез для нециклического сдвига потока без потери токенов
  question: Массив out уже заполнен pad_id и имеет достаточную ширину. Поток streams[k] длины T нужно записать со смещением k. Заполни пропуск в NumPy-коде.
  explanation: Срез начинается со столбца k и охватывает ровно T ячеек. Присваивание сохраняет порядок и все токены потока, а позиции вне среза остаются заполненными pad_id.
  kind: cloze
  template: out[k, ___] = streams[k]
  answer: k:k + T
  accept:
    - k:k+T
    - slice(k, k + T)
    - slice(k,k+T)
