- concept: число одновременных аудиопотоков ограничивают ради устойчивого соблюдения TPOT каждым пользователем
  question: Объясни своими словами, почему сервер потокового аудио обычно оставляет запас производительности и ограничивает число одновременных потоков на GPU, а не просто максимизирует размер батча.
  explanation: 'Для аудио недостаточно выполнить общий план по токенам: порог скорости действует отдельно для каждого слушателя. Поэтому в продакшне закладывают запас в 2–3 раза и ограничивают конкуренцию потоков за GPU.'
  kind: open
  reference: Каждый поток должен получать новые кодек-токены без длинных задержек. Большой батч может повысить среднюю пропускную способность, но увеличить или сделать менее стабильным TPOT отдельных запросов. Запас мощности и ограничение конкурирующих потоков снижают риск опустошения аудиобуфера у пользователя.
  id: 031-stream-threshold-2
  fingerprint: c042eb02
