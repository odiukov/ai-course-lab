- concept: порядок преобразований при генерации звука через токены нейронного аудиокодека
  question: Расположи этапы системы генерации аудио в порядке прохождения данных от исходной волны к новой волне.
  explanation: Кодек сначала переводит волну в компактные дискретные токены. Генеративная модель создаёт новые токены, после чего обратная половина кодека восстанавливает из них аудиоволну.
  kind: order
  items:
    - Энкодер преобразует участки исходной волны в латентные векторы
    - RVQ заменяет латентные векторы индексами кодбуков
    - Генеративная модель создаёт продолжение последовательности индексов
    - По созданным индексам восстанавливаются квантованные векторы
    - Декодер преобразует векторы в новую аудиоволну
  id: 002-pipeline-1
  fingerprint: a23a037d
- concept: функция residual vector quantization в нейронном аудиокодеке
  question: Какую операцию выполняет residual vector quantization в нейронном аудиокодеке?
  explanation: RVQ последовательно приближает латентный вектор элементами нескольких кодбуков и сохраняет их индексы. Продолжение этих индексов предсказывает отдельная генеративная модель.
  kind: choice
  options:
    - Предсказывает продолжение аудио по текстовому описанию
    - Заменяет латентный вектор набором индексов из нескольких кодбуков
    - Преобразует цифровую аудиоволну в сигнал для динамика
    - Объединяет отдельные звуковые дорожки в готовую композицию
  correct: 1
  id: 002-pipeline-2
