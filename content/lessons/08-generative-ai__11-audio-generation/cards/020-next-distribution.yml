- concept: эмпирическая вероятность следующего токена равна его счётчику, делённому на сумму счётчиков строки
  question: Для фиксированных стиля и предыдущего токена один из возможных следующих токенов встретился 8 раз, а сумма всех переходов в этой строке равна 32. Какую вероятность следует назначить этому токену?
  explanation: 'Счётчик нормируют суммой той же строки: 8 / 32 = 0,25. После такой нормализации вероятности всех следующих токенов в строке суммируются до единицы.'
  kind: numeric
  answer: 0.25
  tolerance: 0.001
  id: 020-next-distribution-1
  fingerprint: 7fba9232
- concept: биграммные счётчики нормализуются отдельно для каждого условия
  question: Почему в условной биграммной модели нельзя делить каждый счётчик на сумму счётчиков всей таблицы?
  explanation: Модель оценивает условное распределение следующего токена. Поэтому знаменателем должна быть сумма переходов только для заданной пары «стиль и предыдущий токен».
  kind: choice
  options:
    - Тогда значения описывали бы совместную частоту условий и переходов, а не распределение следующего токена при фиксированных стиле и предыдущем токене
    - Тогда модель перестала бы учитывать порядок токенов внутри обучающих последовательностей
    - Тогда для каждого стиля потребовался бы отдельный словарь токенов
    - Тогда наиболее частый следующий токен всегда получал бы одинаковую вероятность
