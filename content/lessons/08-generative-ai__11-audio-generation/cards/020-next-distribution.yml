- concept: равномерное распределение служит запасным вариантом для строки без наблюдавшихся переходов
  question: Объясни своими словами, как получить допустимое распределение следующего токена, если для заданных стиля и предыдущего токена все счётчики переходов равны нулю.
  explanation: Нулевую строку нельзя нормировать делением на её сумму. Равномерный запасной вариант сохраняет корректность распределения и отражает отсутствие данных о предпочтительном продолжении.
  kind: open
  reference: Можно назначить всем токенам словаря одинаковую вероятность. Это даёт распределение с единичной суммой и не выражает необоснованного предпочтения, когда наблюдений нет.
