- concept: delayed parallel сокращает последовательность генерации с помощью сдвинутых потоков RVQ-кодбуков
  question: Объясни своими словами, чем раскладка delayed parallel в MusicGen отличается от полного вытягивания всех RVQ-токенов в одну последовательность и зачем нужны временные сдвиги потоков.
  explanation: 'Параллельная выдача уменьшает число последовательных действий, а временные сдвиги сохраняют полезный порядок зависимостей между уровнями RVQ: более грубое представление фрагмента появляется раньше его уточнений.'
  kind: open
  reference: При полном вытягивании токены всех кодбуков предсказываются последовательно, что увеличивает число зависимых шагов. В delayed parallel модель одновременно выдаёт токены нескольких кодбуков, относящиеся к разным временным позициям. Сдвиг позволяет информации из более раннего потока для нужного фрагмента стать доступной до предсказания уточняющих токенов следующих потоков.
  id: 013-audio-ar-2
  fingerprint: 42eea4f7
