- concept: воспроизводимый аудиобриф фиксирует весь рецепт генерации, а не только промпт и seed
  question: Какие данные нужно сохранить, чтобы впоследствии максимально точно воспроизвести удачную генерацию аудио?
  explanation: Seed задаёт исходное случайное состояние, но результат также зависит от точного промпта, версии модели, параметров запуска и компонентов цепочки. Поэтому бриф должен сохранять полный рецепт генерации.
  kind: choice
  options:
    - Только общее описание желаемого звучания
    - Точный промпт и seed, без сведений о среде запуска
    - Точный промпт, seed, модель и её версию, хостинг, параметры сэмплирования, формат выхода и версии компонентов аудиоцепочки
    - Только итоговый аудиофайл и название модели
  correct: 2
  id: 039-reproducibility-1
  fingerprint: 5452f6a5
- concept: честное сравнение промптов отделяет влияние текста от случайности и затем проверяет устойчивость результата
  question: Расположи действия для корректного сравнения двух промптов генерации аудио.
  explanation: 'Сначала переменные запуска удерживают одинаковыми, чтобы различие результатов прежде всего отражало изменение промпта. Затем предпочтительный вариант проверяют с другой случайностью: единичная удачная генерация ещё не подтверждает устойчивое качество.'
  kind: order
  items:
    - Зафиксировать модель, параметры запуска и общий seed
    - Получить варианты, изменяя только сравниваемый текст промпта
    - Сравнить результаты по заранее выбранному критерию
    - Проверить предпочтительный промпт на дополнительных seed
  id: 039-reproducibility-2
  fingerprint: 2ab147c2
- concept: фиксированный seed не гарантирует побитовую воспроизводимость в недетерминированной среде
  question: Почему одинаковый seed может не дать побитово идентичное аудио при повторном запуске?
  explanation: Seed фиксирует начальное состояние генератора случайности, но не всю процедуру вычисления. Если хостинг не гарантирует детерминированность, его следует считать средством приблизительного повторения, а ограничение явно записать в брифе.
  kind: open
  reference: Seed обеспечивает повторимость только при совпадении модели, её версии, параметров, программно-аппаратной среды и детерминированного способа выполнения. Обновление сервиса, другая реализация операций или недетерминированные вычисления могут изменить результат.
  id: 039-reproducibility-3
  fingerprint: b705be48
