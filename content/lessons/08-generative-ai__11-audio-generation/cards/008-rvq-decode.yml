- concept: использование меньшего числа RVQ-кодбуков сохраняет размер латента, но уменьшает точность реконструкции
  question: Объясните, что произойдёт с размерностью восстановленного латента и качеством звука, если использовать только начальную часть каскада RVQ-кодбуков.
  explanation: Каждый дополнительный кодбук добавляет к тому же латенту поправку одинаковой размерности. Его удаление не меняет форму данных, но оставляет часть остатка нескомпенсированной.
  kind: open
  reference: 'Размерность латента и временная сетка не изменятся, потому что складываются векторы одинаковой формы. Качество обычно снизится: отброшенные кодбуки содержат уточнения остаточной ошибки.'
