- concept: индекс RVQ однозначно задаёт вектор только вместе с номером кодбука
  question: Какие данные нужны, чтобы однозначно найти выбранный вектор в каскаде RVQ?
  explanation: Каждый кодбук хранит собственный набор векторов. Поэтому одинаковый индекс в разных кодбуках может указывать на разные векторы.
