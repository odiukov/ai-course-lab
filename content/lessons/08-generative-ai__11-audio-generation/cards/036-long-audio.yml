- concept: кроссфейд и overlap-add скрывают техническую границу окон, но музыкальную согласованность обеспечивает условное продолжение
  question: На стыке двух музыкальных окон нет щелчка или скачка громкости, но ритм сбивается из-за повторного удара барабана. Почему кроссфейда оказалось недостаточно и какой механизм должен предотвращать такой дефект?
  explanation: У шва есть два разных уровня проблемы. Перекрытие и плавные огибающие устраняют разрыв сигнала, а условное продолжение отвечает за согласованность событий по обе стороны границы.
  kind: open
  reference: 'Кроссфейд с overlap-add сглаживает форму сигнала и уровень громкости в области перекрытия, поэтому скрывает технический шов. Он не исправляет противоречащее музыкальное содержимое. Повторный удар должен предотвращаться связным продолжением: следующее окно генерируют с учётом конца предыдущего.'
