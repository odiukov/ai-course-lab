- concept: ранняя ошибка RVQ изменяет остатки, которые кодируют все последующие слои
  question: Генератор выбрал неверный токен для самого раннего кодбука RVQ, а затем выдал правдоподобные токены поздних кодбуков. Каков наиболее вероятный результат?
  explanation: Каждый следующий уровень RVQ описывает остаток после уже выбранных векторов. Ошибка на раннем уровне меняет этот остаток, поэтому поздние уровни решают другую задачу и обычно не могут полностью заменить неверную основу.
  kind: choice
  options:
    - Поздние кодбуки полностью заменят ошибочную грубую основу
    - Поздние кодбуки будут уточнять изменённую основу, поэтому ошибка может сохраниться или породить артефакты
    - Ошибка не повлияет на звук, потому что кодбуки RVQ независимы
    - Декодер отбросит токен раннего кодбука и восстановит основу самостоятельно
  correct: 1
  id: 035-rvq-errors-1
  fingerprint: 9960aec5
- concept: детерминированный выбор ранних RVQ-токенов снижает риск каскадной ошибки ценой меньшего разнообразия основы
  question: Почему при генерации RVQ-токенов разумно выбирать ранние токены детерминированно, а случайное сэмплирование оставлять преимущественно для поздних слоёв? Объясни также основной компромисс.
  explanation: Раннее решение влияет на входы всех последующих уровней RVQ. Поэтому случайность выгоднее ограничивать там, где её ошибка имеет каскадный эффект, и сохранять на уровнях локальных уточнений.
  kind: open
  reference: Ранние токены задают грубую основу сигнала и определяют остатки для всей последующей цепочки, поэтому случайная ошибка в них распространяется на поздние слои. Детерминированный выбор наиболее вероятного раннего токена делает основу устойчивее. Поздние слои отвечают за более мелкие детали, где случайность менее опасна и может добавлять разнообразие. Компромисс — снижение вариативности грубой структуры ради меньшего риска артефактов.
  id: 035-rvq-errors-2
  fingerprint: 31349dbf
