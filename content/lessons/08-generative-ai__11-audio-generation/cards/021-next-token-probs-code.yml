- concept: проверка нормировки вероятностей с учётом погрешности вычислений с плавающей точкой
  question: Почему сумму вычисленных вероятностей следует сравнивать с единицей с небольшой погрешностью, а не точным равенством?
  explanation: Точное сравнение может отклонить корректное распределение из-за погрешности представления дробей. При проверке используют абсолютную или относительную погрешность.
  kind: open
  reference: Многие дроби нельзя точно представить в формате с плавающей точкой. Операции над ними накапливают небольшую ошибку округления, поэтому математически нормированное распределение может иметь сумму, совсем немного отличающуюся от единицы.
