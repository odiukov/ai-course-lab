- concept: семантика индексов условного биграммного счётчика
  question: В условной биграммной модели задан счётчик C[s, i, j]. Объясни своими словами, какое наблюдение из обучающих данных он учитывает.
  explanation: 'Индекс s выбирает стиль, i обозначает предыдущий токен, а j — следующий. В материале та же структура имеет размер 2 × 16 × 16: отдельная матрица переходов для каждого стиля.'
  kind: open
  reference: C[s, i, j] хранит число случаев, когда в последовательности со стилем s непосредственно после токена i встречался токен j.
