- concept: цикл условного авторегрессивного сэмплирования
  question: Расположите операции условной авторегрессивной генерации в правильном порядке.
  explanation: 'Авторегрессивная модель строит продолжение последовательно: предсказывает распределение по условию и уже известному контексту, выбирает токен, добавляет его в контекст и повторяет цикл.'
  kind: order
  items:
    - Передать модели условие стиля и текущий токен
    - Получить распределение вероятностей следующего токена
    - Сэмплировать следующий токен из этого распределения
    - Добавить выбранный токен в последовательность и сделать его текущим
  id: 022-ar-sampling-1
  fingerprint: 418f1d07
- concept: контролируемая проверка влияния условия на сгенерированное продолжение
  question: Какой эксперимент лучше всего проверяет, действительно ли условие стиля управляет продолжением последовательности?
  explanation: Чтобы изолировать влияние условия, остальные параметры нужно зафиксировать. Если при одинаковом старте разные стили систематически дают разные характерные продолжения, обусловливание работает.
  kind: choice
  options:
    - Одновременно менять стартовый токен, стиль и длину продолжения
    - Запускать генерацию только с одним стилем, но много раз
    - Сохранить одинаковый старт и настройки сэмплирования, меняя только условие стиля
  correct: 2
  id: 022-ar-sampling-2
  fingerprint: 7a6ab3b1
