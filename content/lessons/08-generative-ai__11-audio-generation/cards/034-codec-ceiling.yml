- concept: реконструкция нейронного аудиокодека задаёт верхнюю границу качества генерации в его токен-пространстве
  question: Генератор безошибочно предсказывает токены нейронного аудиокодека, однако после декодирования высокочастотные детали звучат искажённо. Какое утверждение верно?
  explanation: Генератор работает с представлением, созданным кодеком. Если при кодировании были утрачены детали, даже правильные токены не позволят декодеру их восстановить. Поэтому реальная генерация обычно не превосходит контрольную реконструкцию кодека.
  kind: choice
  options:
    - Увеличение генератора обязательно восстановит детали исходного сигнала
    - Максимально доступное качество ограничено точностью реконструкции самого кодека
    - Безошибочное предсказание токенов гарантирует совпадение с исходной волной
    - Достаточно повысить случайность сэмплирования токенов
  correct: 1
  id: 034-codec-ceiling-1
  fingerprint: bb03f398
- concept: контрольный цикл кодирования и декодирования отделяет дефекты кодека от ошибок генератора
  question: Расположи действия в порядке, позволяющем выяснить, вызваны ли слышимые артефакты ограничениями кодека или генератором.
  explanation: Прямой цикл через кодек исключает генератор из эксперимента. Артефакты, уже присутствующие в реконструкции, задаются кодеком; только дополнительные ухудшения в сгенерированном звуке следует искать в предсказании токенов или сэмплировании.
  kind: order
  items:
    - Закодировать исходный аудиофрагмент и сразу декодировать полученные токены
    - Сравнить контрольную реконструкцию с исходным аудиофрагментом
    - Если реконструкция приемлема, сравнить с ней результат генератора
    - Отнести дополнительные дефекты генерации к модели или сэмплированию
  id: 034-codec-ceiling-2
  fingerprint: c1371805
