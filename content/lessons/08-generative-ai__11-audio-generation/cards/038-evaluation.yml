- concept: CER вычисляется как отношение суммы замен, удалений и вставок к длине эталонного текста
  question: В эталонной реплике 96 символов. При распознавании TTS-выхода обнаружены 4 замены, 3 удаления и 2 вставки. Чему равен CER?
  explanation: CER = (замены + удаления + вставки) / число символов в эталоне. Здесь это (4 + 3 + 2) / 96 = 9 / 96 = 0,09375, то есть примерно 9,4%.
  kind: numeric
  answer: 0.09375
  tolerance: 0.0001
  id: 038-evaluation-1
  fingerprint: 3dd52581
- concept: набор аудиометрик выбирают по типу задачи и проверяемым свойствам результата
  question: Команда оценивает генератор звуковых эффектов по текстовому описанию. Какой набор лучше всего проверит соответствие запросу, качество звучания и пользовательское предпочтение?
  explanation: CLAP оценивает смысловое соответствие аудио описанию, MOS — воспринимаемое качество, а A/B — предпочтение в продуктовом контексте. CER предназначен для точности произнесения текста и для звуковых эффектов обычно неприменим.
  kind: choice
  options:
    - CLAP, MOS и пользовательское A/B
    - Только CER
    - MOS и CER
    - Только CLAP
  correct: 0
  id: 038-evaluation-2
  fingerprint: 3fa5c749
- concept: результат пользовательского A/B зависит от аудитории, контекста и формулировки критерия выбора
  question: Объясни своими словами, почему победу аудиоварианта в пользовательском A/B нельзя считать универсальным доказательством его превосходства.
  explanation: A/B близок к продуктовому решению, но не является объективной характеристикой аудио вне условий эксперимента. Его вывод относится к выбранной аудитории, сценарию прослушивания и формулировке вопроса.
  kind: open
  reference: A/B измеряет предпочтение конкретной аудитории при заданном контексте и вопросе. Другая группа слушателей или иной критерий — например, разборчивость вместо естественности — могут изменить результат, поэтому условия теста нужно фиксировать и описывать.
  id: 038-evaluation-3
  fingerprint: 3e8215a9
