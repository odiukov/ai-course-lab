- concept: обратный сдвиг потоков восстанавливает соответствие токенов одному аудиокадру
  question: Модель с delayed-parallel расписанием завершила генерацию нескольких потоков RVQ-токенов. Что нужно сделать перед передачей потоков декодеру аудиокодека?
  explanation: В delayed-parallel таблице столбцы соответствуют шагам генерации, поэтому разные потоки в одном столбце могут описывать разные аудиокадры. Обратные сдвиги восстанавливают временное выравнивание, после чего каждый столбец снова содержит RVQ-токены одного кадра.
  kind: choice
  options:
    - Независимо отсортировать токены каждого потока по их индексам
    - Сдвинуть каждый поток обратно на величину его задержки и удалить служебные позиции
    - Объединить все потоки в одну длинную последовательность
    - Заменить крайние токены наиболее частыми индексами кодбука
  correct: 1
  id: 027-undelay-1
  fingerprint: 0cfec715
- concept: служебные позиции delayed-parallel раскладки определяются координатами, а не значениями токенов
  question: Почему при удалении заполнителей из delayed-parallel раскладки нельзя считать некоторое значение индекса специальным и удалять все его вхождения?
  explanation: Индексы кодбука сами по себе не показывают происхождение позиции. Если фильтровать по значению, можно удалить реальные аудиотокены; безопасно удалять только известные краевые позиции, добавленные операцией задерживания.
  kind: open
  reference: Индекс с таким значением может быть настоящим кодом из кодбука. Служебность позиции определяется тем, появилась ли она за границами потока из-за задержки, поэтому заполнители удаляют по координатам раскладки.
  id: 027-undelay-2
  fingerprint: 8a12dd8f
