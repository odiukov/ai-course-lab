- concept: общая архитектурная основа не делает генеративные аудиозадачи одинаковыми по сложности
  question: Объясни своими словами, почему музыкальная генерация обычно требует более разнообразных обучающих данных, чем TTS, даже если обе системы используют нейросетевой аудиокодек и генератор токенов.
  explanation: Аудиокодек определяет, как звук представлен, но не устраняет разнообразие содержания, которое должен выучить генератор. Чем больше существенно разных результатов считаются подходящими для одного условия, тем шире требуемое покрытие данных.
  kind: open
  reference: 'Текст в TTS сильно ограничивает допустимый результат: слова задают фонетическую структуру, а основная вариативность остаётся в голосе, темпе и интонации. Музыкальный промпт оставляет одновременно свободными жанр, инструменты, ритм, гармонию, аранжировку и развитие композиции. Поэтому модели музыки нужно покрыть гораздо более широкое условное распределение, независимо от общего способа представления звука.'
