- concept: продакшн-стек для генерации аудио выбирают по совместимости задачи, управляемости, прав и допустимой задержки
  question: Команда выбирает сервис для коммерческой озвучки, где важны закреплённый голос, точное произношение и предсказуемое время ответа. Какой подход к выбору наиболее обоснован?
  explanation: Хороший демонстрационный результат не гарантирует пригодность к серийному использованию. Для продакшна инструмент должен одновременно соответствовать типу задачи, давать нужный контроль, разрешать предполагаемое использование и укладываться в допустимое ожидание.
  kind: choice
  options:
    - Сравнить TTS-кандидатов по воспроизводимости голоса и произношения, коммерческим правам и задержке
    - Выбрать музыкальный генератор с самым впечатляющим демонстрационным роликом
    - Взять любую модель с открытыми весами, считая коммерческое использование автоматически разрешённым
    - Сравнить только скорость генерации, не учитывая назначение и лицензию
