- concept: доступность открытой модели клонирования голоса не заменяет подтверждённого согласия владельца голоса
  question: Почему возможность локально запустить открытую модель клонирования голоса ещё не означает, что полученный голос можно законно использовать в продакшне?
  explanation: Открытая XTTS v2 технически позволяет клонировать голос без проверки разрешения, но это не создаёт юридического основания для использования. Подтверждение согласия должно быть частью продакшн-пайплайна.
  kind: open
  reference: Техническая доступность модели не предоставляет прав на чужой голос. До клонирования необходимо получить и зафиксировать подтверждённое согласие его владельца, а также проверить лицензию модели и условия использования результата. Отсутствие встроенной проверки согласия не снимает ответственность с разработчика.
  id: 030-production-choice-2
