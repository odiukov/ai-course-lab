- concept: небольшой случайный сдвиг делает переходы недетерминированными, сохраняя основной узор
  question: Зачем при создании синтетических аудиотокенов добавлять к базовому узору небольшой случайный сдвиг?
  explanation: Сдвиг на 0 или 1 оставляет узнаваемыми базовые шаги стилей, но один и тот же контекст перестаёт всегда иметь строго одинаковое продолжение. Благодаря этому таблица переходов отражает распределение, а не жёсткое правило.
  kind: choice
  options:
    - Чтобы каждому стилю автоматически выделялся отдельный кодбук
    - Чтобы последовательности разных стилей имели одинаковую длину
    - Чтобы полностью устранить зависимость следующего токена от предыдущего
    - Чтобы отказаться от циклического перехода через границу кодбука
    - Чтобы получить вариативные переходы, не уничтожив характерный для стиля порядок
