<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Где пересекаются on-demand и фиксированная цена PTU</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --text: #172033;
      --muted: #526077;
      --axis: #667085;
      --grid: #d4dae4;
      --ondemand: #1769aa;
      --ptu: #b54708;
      --point: #7a2e92;
      --band: #eee8ff;
      --idle: #fff0df;
      --saving: #dff3e8;
      --leader: #7a2e92;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    figure {
      margin: 0;
      background: var(--bg);
    }

    h2 {
      margin: 0;
      padding: 14px 20px 4px;
      font-size: 20px;
      line-height: 1.25;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--bg);
    }

    .axis,
    .tick,
    .bracket,
    .leader {
      fill: none;
      vector-effect: non-scaling-stroke;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .axis {
      stroke: var(--axis);
      stroke-width: 2;
    }

    .tick,
    .bracket {
      stroke: var(--axis);
      stroke-width: 2;
    }

    .leader {
      stroke: var(--leader);
      stroke-width: 2;
    }

    .axis-head {
      fill: var(--axis);
    }

    .band {
      fill: var(--band);
    }

    .idle-area {
      fill: var(--idle);
    }

    .saving-area {
      fill: var(--saving);
    }

    .ondemand-line,
    .ptu-line {
      fill: none;
      vector-effect: non-scaling-stroke;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 4;
    }

    .ondemand-line {
      stroke: var(--ondemand);
    }

    .ptu-line {
      stroke: var(--ptu);
    }

    .point-halo {
      fill: var(--bg);
      stroke: var(--point);
      stroke-width: 4;
      vector-effect: non-scaling-stroke;
    }

    .point-core {
      fill: var(--point);
    }

    text {
      fill: var(--text);
      font-size: 16px;
    }

    .axis-label {
      fill: var(--muted);
      font-size: 15px;
      font-weight: 650;
    }

    .line-label {
      font-size: 16px;
      font-weight: 750;
    }

    .ondemand-label {
      fill: var(--ondemand);
    }

    .ptu-label {
      fill: var(--ptu);
    }

    .region-label {
      font-size: 15px;
      font-weight: 700;
    }

    .cross-label {
      fill: var(--point);
      font-size: 16px;
      font-weight: 800;
    }

    .range-label {
      fill: var(--point);
      font-size: 15px;
      font-weight: 800;
    }

    .note {
      fill: var(--muted);
      font-size: 14px;
    }

    #fallback {
      margin: 0;
      padding: 20px;
      color: var(--text);
      background: var(--bg);
      font-size: 16px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101521;
        --text: #edf2fb;
        --muted: #b6c0d2;
        --axis: #9aa7bc;
        --grid: #344054;
        --ondemand: #67b7ff;
        --ptu: #ffad66;
        --point: #d9a7ff;
        --band: #292343;
        --idle: #422d20;
        --saving: #17382d;
        --leader: #d9a7ff;
      }
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-heading">
    <h2 id="diagram-heading">Где пересекаются on-demand и фиксированная цена PTU</h2>
    <svg id="chart"
      viewBox="0 0 960 460"
      width="960"
      height="460"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description">
      <title id="svg-title">Сравнение стоимости on-demand и PTU</title>
      <desc id="svg-description">
        Стоимость on-demand растёт вместе с устойчивой загрузкой, а цена PTU
        остаётся фиксированной. Линии пересекаются в диапазоне 40–60 процентов.
      </desc>
    </svg>
    <p id="fallback" hidden>
      Схема должна была показать растущую стоимость on-demand, горизонтальную
      фиксированную цену PTU и их пересечение при 40–60% устойчивой загрузки.
    </p>
    <noscript>
      <p id="noscript-fallback">
        Схема показывает: стоимость on-demand растёт с загрузкой, цена PTU
        остаётся фиксированной, а точка равной стоимости находится в диапазоне
        40–60% устойчивой загрузки.
      </p>
    </noscript>
  </figure>

  <script>
    const data = Object.freeze([
      {
        id: "canvas",
        width: 960,
        height: 460
      },
      {
        id: "mapping",
        originX: 166,
        originY: 350,
        scaleX: 6.35,
        scaleY: 3.2
      },
      {
        id: "plot",
        xMin: 0,
        xMax: 100,
        yMin: 0,
        yMax: 96
      },
      {
        id: "band",
        x1: 40,
        x2: 60,
        y1: 0,
        y2: 94
      },
      {
        id: "idle",
        points: [
          { x: 0, y: 0 },
          { x: 0, y: 50 },
          { x: 50, y: 50 }
        ]
      },
      {
        id: "saving",
        points: [
          { x: 50, y: 50 },
          { x: 90, y: 50 },
          { x: 90, y: 90 }
        ]
      },
      {
        id: "axes",
        xAxis: [
          { x: 0, y: 0 },
          { x: 100, y: 0 }
        ],
        yAxis: [
          { x: 0, y: 0 },
          { x: 0, y: 96 }
        ],
        xHead: [
          { x: 100, y: 0 },
          { x: 97, y: 2 },
          { x: 97, y: -2 }
        ],
        yHead: [
          { x: 0, y: 96 },
          { x: -1.6, y: 92 },
          { x: 1.6, y: 92 }
        ]
      },
      {
        id: "lines",
        ondemand: [
          { x: 0, y: 0 },
          { x: 90, y: 90 }
        ],
        ptu: [
          { x: 0, y: 50 },
          { x: 94, y: 50 }
        ]
      },
      {
        id: "cross",
        x: 50,
        y: 50,
        haloRadius: 2.1,
        coreRadius: 1.05,
        leader: [
          { x: 50, y: 50 },
          { x: 57, y: 69 },
          { x: 72, y: 69 }
        ]
      },
      {
        id: "range",
        line: [
          { x: 40, y: -2 },
          { x: 40, y: -5 },
          { x: 60, y: -5 },
          { x: 60, y: -2 }
        ]
      },
      {
        id: "labels",
        items: [
          {
            x: 0,
            y: 96,
            dx: 0,
            dy: -14,
            anchor: "start",
            className: "axis-label",
            text: "Стоимость за одинаковый период"
          },
          {
            x: 100,
            y: 0,
            dx: 0,
            dy: 34,
            anchor: "end",
            className: "axis-label",
            text: "Устойчивая загрузка"
          },
          {
            x: 74,
            y: 74,
            dx: 14,
            dy: -15,
            anchor: "start",
            className: "line-label ondemand-label",
            text: "On-demand"
          },
          {
            x: 94,
            y: 50,
            dx: 0,
            dy: -14,
            anchor: "end",
            className: "line-label ptu-label",
            text: "Фиксированная цена PTU"
          },
          {
            x: 18,
            y: 34,
            dx: 0,
            dy: 0,
            anchor: "middle",
            className: "region-label",
            text: "резерв дороже"
          },
          {
            x: 18,
            y: 27,
            dx: 0,
            dy: 0,
            anchor: "middle",
            className: "note",
            text: "цена простаивающей мощности"
          },
          {
            x: 75,
            y: 66,
            dx: 0,
            dy: 0,
            anchor: "middle",
            className: "region-label",
            text: "on-demand дороже"
          },
          {
            x: 75,
            y: 59,
            dx: 0,
            dy: 0,
            anchor: "middle",
            className: "note",
            text: "резерв окупается"
          },
          {
            x: 57,
            y: 69,
            dx: 10,
            dy: -10,
            anchor: "start",
            className: "cross-label",
            text: "Равная стоимость"
          },
          {
            x: 50,
            y: -5,
            dx: 0,
            dy: 25,
            anchor: "middle",
            className: "range-label",
            text: "40–60% устойчивой загрузки"
          },
          {
            x: 0,
            y: -24,
            dx: 0,
            dy: 0,
            anchor: "start",
            className: "note",
            text: "Выгода PTU имеет смысл, только если резерв выдерживает пик."
          }
        ]
      }
    ]);

    const mapping = data.find(item => item.id === "mapping");
    const origin = Object.freeze({
      x: mapping.originX,
      y: mapping.originY
    });
    const scale = Object.freeze({
      x: mapping.scaleX,
      y: mapping.scaleY
    });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y - y * scale.y;

    try {
      const svg = document.getElementById("chart");
      const namespace = "http://www.w3.org/2000/svg";
      const get = id => data.find(item => item.id === id);

      const make = (name, attributes, text) => {
        const node = document.createElementNS(namespace, name);
        Object.entries(attributes).forEach(([key, value]) => {
          node.setAttribute(key, String(value));
        });
        if (text !== undefined) {
          node.textContent = text;
        }
        return node;
      };

      const pointString = points =>
        points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" ");

      const addPolyline = (points, className) => {
        svg.appendChild(make("polyline", {
          points: pointString(points),
          class: className
        }));
      };

      const addPolygon = (points, className) => {
        svg.appendChild(make("polygon", {
          points: pointString(points),
          class: className
        }));
      };

      const band = get("band");
      svg.appendChild(make("rect", {
        x: sx(band.x1),
        y: sy(band.y2),
        width: sx(band.x2) - sx(band.x1),
        height: sy(band.y1) - sy(band.y2),
        class: "band"
      }));

      addPolygon(get("idle").points, "idle-area");
      addPolygon(get("saving").points, "saving-area");

      const axes = get("axes");
      addPolyline(axes.xAxis, "axis");
      addPolyline(axes.yAxis, "axis");
      addPolygon(axes.xHead, "axis-head");
      addPolygon(axes.yHead, "axis-head");

      const lines = get("lines");
      addPolyline(lines.ondemand, "ondemand-line");
      addPolyline(lines.ptu, "ptu-line");

      const range = get("range");
      addPolyline(range.line, "bracket");

      const cross = get("cross");
      addPolyline(cross.leader, "leader");

      svg.appendChild(make("circle", {
        cx: sx(cross.x),
        cy: sy(cross.y),
        r: sx(cross.x + cross.haloRadius) - sx(cross.x),
        class: "point-halo"
      }));

      svg.appendChild(make("circle", {
        cx: sx(cross.x),
        cy: sy(cross.y),
        r: sx(cross.x + cross.coreRadius) - sx(cross.x),
        class: "point-core"
      }));

      get("labels").items.forEach(label => {
        svg.appendChild(make("text", {
          x: sx(label.x),
          y: sy(label.y),
          dx: label.dx,
          dy: label.dy,
          "text-anchor": label.anchor,
          class: label.className
        }, label.text));
      });
    } catch (error) {
      document.getElementById("chart").hidden = true;
      document.getElementById("fallback").hidden = false;
    }
  </script>
</body>
</html>
