- concept: 'способ оценивания выбирается по форме выхода: exact match применим только там, где допустимый ответ ровно один'
  question: 'Модель по письму клиента возвращает два поля: код категории проблемы из фиксированного списка и вежливое сопроводительное объяснение для клиента. Как разумно оценивать эти поля?'
  explanation: 'Exact match даёт полное согласие с человеком там, где допустимый выход один: код из закрытого списка. Свободный текст он забракует за любую другую формулировку той же мысли, поэтому открытую часть отдают судье по заданным критериям. Разные поля одного выхода спокойно оцениваются разными метриками, результаты потом комбинируются с весами.'
  kind: choice
  options:
    - Оба поля — через exact match со эталоном
    - Код категории — exact match, объяснение — LLM-судьёй по критериям
    - Оба поля — только человеческой разметкой, иначе оценка невалидна
    - Код категории — LLM-судьёй, объяснение — exact match
  correct: 1
  id: 009-cost-ladder-1
  fingerprint: e9ddf631
- concept: низкое согласие дешёвой автоматической метрики с человеком означает регулярно ошибочные вердикты, и дешевизна этого не компенсирует
  question: Автоматическая метрика сходства текстов стоит примерно ноль за вердикт и совпадает с человеческим суждением в 70% случаев. Что это значит для её применения?
  explanation: 'Согласие 70% — это ошибка почти в трети суждений. Такая метрика годится как дешёвый постоянный сигнал о тренде и как фильтр грубых регрессий, но решение о выпуске на ней строить нельзя: систематический перекос ошибок легко перевесит наблюдаемую разницу между версиями.'
  kind: choice
  options:
    - Её можно считать эталоном, раз она бесплатна и покрывает большинство случаев
    - Примерно каждый третий её вердикт человек бы оспорил, поэтому по ней нельзя принимать решение о выпуске
    - Её нельзя использовать вообще, полезны только метрики с полным согласием
    - Согласие с человеком не влияет на пригодность метрики, важна только цена
  correct: 1
  id: 009-cost-ladder-2
  fingerprint: b4a24e23
- concept: отдельный балл eval не интерпретируется в одиночку — нужен тренд по прогонам, а eval версионируется вместе с промптами
  question: Почему один балл прогона eval сам по себе мало что говорит и что нужно хранить, чтобы он стал полезен?
  explanation: 'Ручной прогон и незафиксированная версия набора тестов ломают сравнение: балл меняется, а причина неизвестна. Автоматизация и версионирование превращают отдельные числа в историю изменений качества.'
  kind: open
  reference: 'Абсолютное число не с чем сравнить: неизвестно, много это или мало для данной задачи и данного набора тестов. Полезен тренд — сравнение прогонов между собой: стало ли лучше после правки промпта, не откатилось ли качество после смены модели. Для этого прогон запускается одной командой без ручных шагов, результаты сохраняются в сравнимом между прогонами формате, а сам набор тестов версионируется вместе с промптами — иначе изменившийся eval и изменившийся промпт дают несопоставимые числа, и причину сдвига не установить.'
  id: 009-cost-ladder-3
  fingerprint: bcaa0514
