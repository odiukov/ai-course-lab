- concept: рубрика привязывает каждый уровень шкалы к наблюдаемым признакам, что делает баллы судьи воспроизводимыми между прогонами
  question: Один и тот же ответ, поданный судье дважды с промптом «оцени качество по шкале», получает заметно разные баллы. Что это означает и чем лечится?
  explanation: Разброс здесь — следствие свободы интерпретации, а не только сэмплинга. Рубрика («верно и со ссылкой», «верно без ссылки», «частично верно») превращает выставление балла в сопоставление ответа с ближайшим описанным уровнем, и повторный прогон видит те же ступени.
  kind: choice
  options:
    - Судья недетерминирован по природе, лечится только усреднением большого числа прогонов
    - Промпт не определил, какие признаки соответствуют каждому уровню, поэтому судья заново придумывает значение числа; лечится рубрикой с описанием уровней через наблюдаемые признаки
    - Модель-судья слишком слабая, лечится заменой на модель большего размера
    - Шкала слишком широкая, лечится переходом к бинарному вердикту без критериев
  correct: 1
  id: 027-judge-rubric-1
  fingerprint: 6c616593
- concept: различие между соседними уровнями рубрики нужно называть явно, иначе разброс концентрируется на неописанной границе
  question: Почему в рубрике особенно важно прописать, чем соседние уровни отличаются друг от друга?
  explanation: Рубрика работает как набор различительных признаков. Неописанная граница между смежными уровнями — это и есть место, где балл начинает зависеть от прогона.
  kind: open
  reference: 'Большинство реальных ответов попадает не в крайние уровни, а между соседними. Если названы только верхний и нижний полюса, а различие смежных ступеней не описано, судья снова выносит суждение по общему впечатлению именно там, где решается вердикт. Случайность не исчезает, а переезжает на эту границу. Поэтому для каждой пары соседних уровней указывают конкретный наблюдаемый признак, который разводит их: наличие ссылки, полнота покрытия вопроса, характер ошибки.'
  id: 027-judge-rubric-2
  fingerprint: 9eb1db1b
- concept: критерии рубрики выводятся из контракта конкретной задачи, а не берутся универсальными
  question: Судья оценивает памятку для пациента, где неверный медицинский совет недопустим. Как это должно отразиться в рубрике?
  explanation: Рубрика — операционализация требований задачи. Для памятки критично отсутствие опасного совета, для краткого пересказа — соблюдение лимита длины. Универсальная шкала «хорошо/плохо» не отражает ни того, ни другого.
  kind: choice
  options:
    - 'Никак: рубрика оценивания универсальна и не зависит от задачи'
    - Безопасность становится обязательным условием верхних уровней — ответ с опасным советом не может получить высокий балл даже при отличном стиле и полноте
    - Достаточно добавить в промпт просьбу «будь строже»
    - Нужно просто увеличить число уровней шкалы
  correct: 1
  id: 027-judge-rubric-3
  fingerprint: 5976c75d
