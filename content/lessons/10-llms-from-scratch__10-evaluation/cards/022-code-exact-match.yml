- concept: 'порядок действий внутри exact_match: нормализовать обе строки, затем сравнить целиком и вернуть числовой балл'
  question: Расставь шаги функции exact_match в правильном порядке.
  explanation: Нормализация обязана предшествовать сравнению и применяться к обеим строкам симметрично. Сравнение — по всей строке, а не по вхождению подстроки, иначе «William Shakespeare» получил бы балл за ответ «Shakespeare».
  kind: order
  items:
    - Обрезать пробелы по краям у ответа модели и у эталона
    - Привести обе строки к нижнему регистру
    - Сравнить нормализованные строки целиком
    - 'Вернуть числовой балл: единицу при совпадении, ноль иначе'
  id: 022-code-exact-match-1
  fingerprint: 0d446537
- concept: метрика возвращает числа, а не булевы значения, чтобы баллы набора агрегировались
  question: Почему exact_match возвращает число с плавающей точкой, а не True/False?
  explanation: Единый числовой контракт метрик позволяет комбинировать их с весами и строить тренд по прогонам без отдельной ветки кода для каждой метрики.
  kind: open
  reference: Баллы отдельных кейсов складывают и усредняют по набору, чтобы получить долю правильных ответов и сравнить прогоны между собой. Числовой выход даёт общий интерфейс со всеми остальными метриками — token F1, LLM-судьёй — которые булевыми быть не могут, поэтому агрегатор и хранилище результатов работают с ними одинаково.
  id: 022-code-exact-match-2
  fingerprint: 534a2382
- concept: 'exact_match не интерпретирует смысл: несовпадение по любому символу вне нормализации даёт нулевой балл'
  question: Какой результат даст exact_match для ответа «Нью  Йорк» (два пробела внутри) при эталоне «Нью Йорк»?
  explanation: '`strip()` работает только по краям строки. Частичных баллов у exact_match нет — для мягкой оценки берут другую метрику, а не дописывают очистку внутрь этой.'
  kind: choice
  options:
    - 'Единицу: внутренние пробелы снимает strip()'
    - 'Ноль: strip() убирает только краевые пробелы, строки остаются разными'
    - Промежуточный балл, пропорциональный числу совпавших символов
    - 'Ошибку: функция не принимает строки с двойными пробелами'
  correct: 1
  id: 022-code-exact-match-3
  fingerprint: ae2fd33f
