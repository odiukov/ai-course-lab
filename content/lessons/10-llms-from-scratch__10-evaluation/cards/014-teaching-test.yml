- concept: 'загрязнение и натаскивание различают по тому, что ломает балл: свежие задания той же темы против изменённой формы тех же заданий'
  question: Балл модели подозрительно высок. Какой эксперимент отличает загрязнение обучающего корпуса от натаскивания на формат?
  explanation: 'Два признака расходятся: при загрязнении балл держится на старых заданиях и проседает на свежих той же сложности; при натаскивании конкретные задания видеть не требуется — балл проседает при смене формы (свободный ответ, перестановка вариантов, другие метки), даже на знакомых вопросах.'
  kind: choice
  options:
    - Прогнать модель дважды и сравнить дисперсию ответов
    - Дать те же задания в изменённой форме и отдельно дать свежие задания той же темы и сложности в прежней форме
    - Сравнить балл модели с баллами всех передовых моделей
    - Увеличить число вариантов ответа во всех заданиях сразу
  correct: 1
