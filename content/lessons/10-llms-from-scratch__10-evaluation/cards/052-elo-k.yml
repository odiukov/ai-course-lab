- concept: K ограничивает сверху величину любого одиночного обновления рейтинга
  question: Система работает с K = 60. Какое наибольшее изменение рейтинга участника возможно за один матч?
  explanation: Сдвиг равен K·(S − E), а |S − E| < 1, потому что ожидание никогда не равно ровно 0 или 1. Значит K — верхняя граница одного исправления, к которой можно подойти сколь угодно близко (победа глубокого аутсайдера), но нельзя достичь.
  kind: choice
  options:
    - Ровно 60 пунктов — при победе над любым соперником
    - Строго меньше 60 пунктов, и тем ближе к 60, чем безнадёжнее был аутсайдер
    - 120 пунктов — по 60 на каждого из двух участников
    - 30 пунктов — половина K, это и есть предел
  correct: 1
  id: 052-elo-k-2
