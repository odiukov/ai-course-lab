- concept: совпадение фактического результата с ожидаемым оставляет рейтинги без изменений
  question: Две модели имеют одинаковый рейтинг, судья объявил ничью. Что произойдёт с рейтингами при K = 24?
  explanation: 'У равных рейтингов ожидание каждой стороны 0.5, ничья даёт фактический результат тоже 0.5, разность нулевая — при любом K сдвиг равен нулю. Ничья информативна только между неравными соперниками: там она расходится с прогнозом.'
  kind: choice
  options:
    - Оба рейтинга останутся прежними
    - 'Оба вырастут на 12: ничья засчитывается как половина победы'
    - 'Оба упадут на 12: никто не подтвердил свою силу'
    - Рейтинг первой модели вырастет на 12, второй — упадёт на 12
