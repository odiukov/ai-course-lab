- concept: 'промпт-проектировщик eval превращает описание задачи в черновик набора: тест-кейсы, функции оценивания и рекомендованный порог'
  question: Что должен выдавать переиспользуемый промпт-проектировщик eval, получив на вход описание задачи, пользователей и опасных ошибок?
  explanation: 'Проектировщик закрывает вопрос «что именно проверять»: он собирает в один повторяемый проход путь от контракта задачи к кейсам, скорерам и заранее зафиксированному порогу. Прогон и отчёт — уже отдельный шаг.'
  kind: choice
  options:
    - Обученную модель под задачу
    - Тест-кейсы, подходящие функции оценивания и рекомендованный порог pass/fail
    - Отчёт о прогоне с покейсовыми баллами
    - Список публичных бенчмарков, где задача уже покрыта
  correct: 1
  id: 059-ship-artifacts-1
  fingerprint: 48f4bcf0
- concept: сгенерированный eval-набор остаётся черновиком, потому что цена ошибки определяется продуктом, а не генератором
  question: Проектировщик выдал 40 кейсов и порог 0.9. Что делать дальше?
  explanation: Генератор знает описание, но не знает, какие отказы дорого стоят твоим пользователям и какому процессу-потребителю уходит выход. Он даёт осмысленный черновик; ответственность за кейсы и порог остаётся на тебе.
  kind: choice
  options:
    - 'Принять как есть: набор сгенерирован по описанию задачи'
    - Проверить кейсы и порог против реальных рисков продукта и цены ошибки, затем править
    - Заменить порог на средний балл текущей модели
    - 'Выкинуть порог: он определяется только после прогона'
  correct: 1
  id: 059-ship-artifacts-2
  fingerprint: '07086672'
- concept: выбор стратегии оценки — функция от типа выхода, бюджета и допустимой задержки
  question: Схема выбора стратегии оценки отвечает на вопрос «каким способом проверять». Какие входы ей для этого нужны?
  explanation: Форма выхода говорит, работает ли автоматическая метрика; бюджет и допустимая задержка говорят, потянешь ли ты судью или человека и как часто. Первый артефакт отвечает «что проверять», второй — «каким способом и за какую цену».
  kind: choice
  options:
    - Название модели и её публичный балл
    - Тип ответа, бюджет и допустимая задержка
    - Размер обучающего корпуса и токенизация
    - Число кейсов и имя автора набора
  correct: 1
