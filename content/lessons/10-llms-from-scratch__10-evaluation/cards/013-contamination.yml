  fingerprint: e55a9af2
- concept: дословный поиск пропускает перефразированные, переведённые и пересказанные копии, поэтому нужен поиск близких по смыслу фрагментов
  question: Поиск точных строковых совпадений заданий бенчмарка в обучающем корпусе не дал ни одного попадания. Почему из этого нельзя заключить, что корпус чист?
  explanation: 'Копии в вебе редко дословные: разборы, переводы туда-обратно, краткие пересказы. Дословный поиск их не видит, поэтому его дополняют поиском семантически близких фрагментов — иначе оценка загрязнения систематически занижена.'
  kind: choice
  options:
    - Потому что точный поиск работает только для коротких заданий
    - Потому что тот же материал мог попасть в корпус в виде пересказа, перевода или разбора с другим порядком слов
    - Потому что модель всё равно могла запомнить только формат заданий
    - Потому что корпус слишком велик, чтобы индексировать его целиком
  correct: 1
  id: 013-contamination-2
  fingerprint: a332881f
- concept: 'процедура: пометить подозрительные задания, оценить их долю и пересчитать балл только на чистом остатке'
  question: Расставьте по порядку шаги проверки бенчмарка на загрязнение обучающим корпусом.
  explanation: Совпадение не доказывает, что модель запомнила пример, поэтому вердикт выносится не по отдельной находке, а по пересчитанному баллу. Если после удаления помеченных заданий результат заметно падает, исходное число отражало знакомство с экзаменационным листом.
  kind: order
  items:
    - Найти в корпусе точные совпадения редких фраз из заданий и совпадения задания вместе с ответом
    - Дополнить поиск близкими по смыслу пересказами и переводами тех же заданий
    - Пометить подозрительные задания и посчитать их долю в наборе
    - Пересчитать балл модели только на непомеченных заданиях
    - Сравнить чистый балл с исходным и решить, годится ли бенчмарк для вывода
  id: 013-contamination-3
