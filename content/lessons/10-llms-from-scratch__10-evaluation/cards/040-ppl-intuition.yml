- concept: perplexity выражает неопределённость предсказания как эквивалентное число равновероятных вариантов, а не как список реальных кандидатов
  question: У модели perplexity 25 на тестовом наборе. Как это читать?
  explanation: 'Реальное распределение неравномерно: у одних продолжений большая вероятность, у тысяч других — крошечная. Perplexity сворачивает это распределение в эквивалентный равновероятный выбор — здесь из 25 вариантов.'
  kind: choice
  options:
    - Модель рассматривает ровно 25 кандидатов и остальные отбрасывает
    - Средняя неопределённость предсказания токена такая же, как при равновероятном выборе из 25 вариантов
    - Модель ошибается в среднем на каждом 25-м токене
    - Словарь модели ограничен 25 частыми токенами
  correct: 1
  id: 040-ppl-intuition-1
  fingerprint: af505b2b
- concept: снижение perplexity читается как кратное сужение эффективного числа вариантов
  question: Perplexity модели снизилась с 45 до 9. Во сколько раз сузилось эффективное число вариантов следующего токена?
  explanation: '45/9 = 5. Perplexity сравнивают отношением, потому что это число эквивалентных вариантов: сужение в 5 раз означает падение неопределённости, а не пятикратный рост точности ответов.'
  kind: numeric
  answer: 5
  tolerance: 0.01
  id: 040-ppl-intuition-2
  fingerprint: 913ebc70
- concept: минимальное значение perplexity равно 1 и соответствует полной уверенности в одном продолжении
  question: Какое значение perplexity соответствует модели, которая на каждой позиции даёт вероятность 1 ровно одному токену?
  explanation: 'Эффективный выбор из одного варианта — это perplexity 1, нижняя граница шкалы. Ноль недостижим: даже полная уверенность оставляет один вариант.'
  kind: choice
  options:
    - '0'
    - '1'
    - Размер словаря
    - Значение не определено
  correct: 1
  id: 040-ppl-intuition-3
  fingerprint: 1aec2f9e
