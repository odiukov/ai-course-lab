- concept: знаменатель precision — число токенов ответа модели, знаменатель recall — число токенов эталона
  question: Заполни пропуск в расчёте precision для token F1.
  explanation: Precision нормируется на то, что сказала модель, recall — на то, что требовал эталон. Перепутанные знаменатели дают симметричную метрику, которая перестаёт различать лишнее и пропущенное.
  kind: cloze
  template: |-
    common = pred_tokens & exp_tokens
    precision = len(common) / len(___)
    recall = len(common) / len(exp_tokens)
  answer: pred_tokens
  accept:
    - pred_tokens
    - pred_tokens)
  id: 024-code-token-f1-1
  fingerprint: 746af565
- concept: токены кладут в множество, чтобы повторы слова не влияли на баллы
  question: Почему токены ответа и эталона превращают в множества, а не оставляют списками?
  explanation: Множество делает метрику функцией состава слов, а не их числа. Иначе ответ, повторяющий одно верное слово десяток раз, менял бы precision и recall без изменения содержания.
  kind: choice
  options:
    - Множество сортирует токены, и сравнение становится быстрее
    - Повторённое слово иначе увеличило бы знаменатель и пересечение, и балл зависел бы от количества повторов
    - Списки не поддерживают операцию пересечения ни в каком виде
    - Множество автоматически удаляет пунктуацию из токенов
  correct: 1
  id: 024-code-token-f1-2
  fingerprint: 07ee4a6b
- concept: 'защитные ветки метрики: пустое множество токенов и нулевая сумма precision с recall возвращают нулевой балл'
  question: Что должна вернуть token_f1, если после разбиения множество токенов эталона оказалось пустым?
  explanation: 'Ранний возврат нуля закрывает деление на ноль в recall. Вторая такая ветка нужна, когда пересечение пусто: precision и recall оба нулевые, и формула F1 упёрлась бы в нулевой знаменатель.'
  kind: choice
  options:
    - Полный балл — пустому эталону соответствует любой ответ
    - Нулевой балл, не доходя до деления на длину пустого множества
    - Значение precision, посчитанное по токенам ответа
    - Исключение, чтобы прогон eval остановился
  correct: 1
  id: 024-code-token-f1-3
  fingerprint: e6a37b18
