- concept: ничья — самостоятельный исход попарного сравнения, который нельзя выбрасывать или доводить до победителя
  question: Судья сравнивает два ответа и не находит между ними заметной разницы. Как правильно поступить в наборе попарных сравнений?
  explanation: 'Ничья несёт информацию: на этом промпте модели эквивалентны. Выбрасывание пары теряет наблюдение и смещает выборку в сторону промптов с явной разницей, а принудительный победитель добавляет в данные шум, которого в реальности не было.'
  kind: choice
  options:
    - Записать ничью как отдельный допустимый исход
    - Выбросить пару из набора, раз победителя нет
    - Назначить победителем любой из ответов, чтобы не терять сравнение
    - Повторять судейство, пока судья не назовёт победителя
  correct: 0
  id: 046-pairwise-1
  fingerprint: b2c1a6e8
- concept: рейтинг из попарных сравнений задаёт порядок относительно пула соперников, а не абсолютный уровень качества
  question: После 300 попарных сравнений модель A уверенно опережает всех соперников в таблице. Что из этого НЕ следует?
  explanation: 'Шкала попарных сравнений относительна: у неё нет нуля и нет привязки к требованиям продукта. Если пул соперников слаб, первое место совместимо с низким абсолютным качеством. Абсолютный уровень задаёт порог приёмки на своём наборе кейсов, а не место в таблице.'
  kind: choice
  options:
    - A чаще, чем её соперники, даёт предпочтительный ответ на промптах этого набора
    - A достигла качества, достаточного для запуска в продакшене
    - На этих промптах A предпочтительнее конкретной модели B
    - Порядок моделей внутри таблицы устойчив при таком числе сравнений
  correct: 1
  id: 046-pairwise-2
  fingerprint: 3c5f1385
- concept: оба ответа получают один и тот же промпт, иначе сложность запроса смешивается с качеством модели
  question: Почему в попарном сравнении обе модели обязаны отвечать на идентичный промпт, а не на два похожих запроса из одной темы?
  explanation: 'Общий промпт — способ уравнять условия: трудный запрос одинаково труден для обеих моделей и его вклад в исход сокращается. На разных запросах победа могла бы означать лишь то, что одной модели достался запрос полегче.'
  kind: choice
  options:
    - Иначе исход объясняется и разницей моделей, и разницей сложности запросов, и разделить эти причины нельзя
    - Иначе судья не сможет прочитать оба ответа за один раз
    - Иначе ответы получатся разной длины
    - Иначе нельзя будет посчитать долю ничьих
  correct: 0
