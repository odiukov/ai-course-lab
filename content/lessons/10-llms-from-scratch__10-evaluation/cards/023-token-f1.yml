- concept: расчёт token F1 через пересечение множеств токенов ответа и эталона
  question: 'Эталон: «красный спортивный автомобиль». Ответ модели: «красный автомобиль». Токены — отдельные слова. Чему равен token F1?'
  explanation: Общих токенов — «красный» и «автомобиль». Precision = доля токенов ответа, попавших в эталон, здесь она полная. Recall = доля токенов эталона, названных моделью, здесь примерно 0,667. F1 = 2·(1·0,667)/(1+0,667) = 0,8.
  kind: numeric
  answer: 0.8
  tolerance: 0.02
  id: 023-token-f1-1
  fingerprint: 7a79c41f
- concept: гармоническое среднее прижимает балл к меньшей из двух величин, арифметическое — нет
  question: У ответа precision = 0,9, recall = 0,3. Почему F1 берут гармоническим средним, а не арифметическим?
  explanation: Гармоническое среднее близко к худшему из двух показателей. Поэтому нельзя купить высокий балл ни односложным безошибочным ответом (высокий precision, низкий recall), ни многословным перечислением (наоборот).
  kind: choice
  options:
    - Гармоническое среднее всегда даёт больший балл и лучше различает модели
    - Арифметическое дало бы 0,6 и замаскировало провал по recall, а гармоническое даёт 0,45 и тянется к меньшей величине
    - Арифметическое среднее нельзя посчитать для долей
    - Гармоническое среднее не зависит от recall
  correct: 1
  id: 023-token-f1-2
  fingerprint: 2fb8ba62
- concept: precision штрафует лишние токены ответа, recall — пропущенные токены эталона
  question: Ответ модели содержит весь эталон плюс несколько лишних слов. Какая из двух величин — precision или recall — падает, и почему вторая остаётся полной?
  explanation: 'Две величины отвечают на разные вопросы: «сколько сказанного подтверждено эталоном» и «сколько нужного сказано». Разные знаменатели и делают их независимыми сигналами о лишнем и о пропущенном.'
  kind: open
  reference: 'Падает precision: его знаменатель — число токенов ответа, и лишние слова в него входят, не попадая в пересечение. Recall остаётся полным, потому что его знаменатель — токены эталона, и все они названы. Симметрично при слишком коротком ответе полным остаётся precision, а падает recall.'
  id: 023-token-f1-3
  fingerprint: cd86992d
