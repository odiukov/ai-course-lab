- concept: Elo использует только знак разницы баллов скорера, величина превосходства в обновление не входит
  question: На кейсе 1 скорер дал моделям 0.91 и 0.18, на кейсе 2 — 0.44 и 0.43. Как эти два матча повлияют на рейтинги?
  explanation: 'Скорер выступает судьёй и выдаёт только исход: «a», «b» или ничья. В обновление входят фактический счёт (1 / 0.5 / 0) и ожидание — разрыв 0.73 и разрыв 0.01 попадают в одну и ту же категорию победы. Разгромность выигрыша Elo намеренно игнорирует, зато требует много сравнений.'
  kind: choice
  options:
    - Первый матч сдвинет рейтинги сильнее — разрыв баллов там больше
    - 'Оба матча дадут одинаковый по величине сдвиг: учитывается только то, кто победил'
    - Второй матч будет засчитан как ничья из-за малой разницы
    - Сдвиг пропорционален отношению баллов, поэтому первый матч весит впятеро больше
  correct: 1
  id: 053-elo-tournament-1
  fingerprint: 00ed1236
- concept: рейтинги обновляются после каждого матча, поэтому итог турнира зависит от порядка кейсов
  question: Один и тот же набор кейсов прогнали дважды, изменив только порядок кейсов. Итоговые рейтинги слегка разошлись. Объясни, почему это ожидаемое поведение Elo.
  explanation: 'Elo — онлайн-алгоритм: он не агрегирует всю таблицу результатов сразу, а инкрементально исправляет оценку. Плата за это — зависимость от порядка и шум на коротких сериях; выигрыш — возможность обновлять рейтинг сразу после каждого нового сравнения.'
  kind: open
  reference: 'Обновление последовательное: каждый следующий матч рассчитывается по рейтингам, уже изменённым предыдущими. Величина сдвига зависит от текущего разрыва рейтингов, а он в разных точках последовательности разный: одна и та же победа в начале и в конце серии стоит разного числа пунктов. Поэтому порядок исходов влияет на траекторию и на итоговые числа, хотя общий баланс побед тот же. Отсюда практический вывод: устойчивым считается только рейтинг, набранный на многих сравнениях, а не разница в единицы пунктов после короткой серии.'
  id: 053-elo-tournament-2
  fingerprint: 25bdd383
