- concept: 'объём выхода прогона: одна запись на кейс, а всего оценок — кейсы, умноженные на число скореров'
  question: Набор содержит 7 кейсов, к каждому применяются 4 скорера. Сколько всего числовых оценок окажется в результатах прогона?
  explanation: 'Прогон даёт по одной записи на кейс (7 записей), внутри каждой записи словарь оценок со всеми скорерами (4 числа). Итого 7 × 4 = 28 оценок. Число записей и число оценок — разные величины: записей столько, сколько кейсов.'
  kind: numeric
  answer: 28
  tolerance: 0.4
  id: 031-run-suite-1
  fingerprint: 3ddd2a88
- concept: модель вызывается один раз на кейс, и все скореры получают одно и то же предсказание, иначе расхождение метрик не приписать метрикам
  question: На одном кейсе строгое совпадение даёт 0, а судья ставит почти максимум. Почему такое расхождение можно исследовать только при условии, что модель вызывалась для этого кейса ровно один раз?
  explanation: 'Генерация недетерминирована: два вызова на одном входе дают разные тексты. Если каждый скорер оценивает свою попытку, непонятно, разошлись критерии или сами ответы. Один вызов и общее предсказание фиксируют объект оценивания, и остаётся ровно одна причина расхождения — разные определения качества.'
  kind: choice
  options:
    - Иначе метрики считались бы по разным предсказаниям, и разница отражала бы разброс генерации, а не разницу критериев
    - Иначе повторные вызовы модели исказили бы эталонный ответ кейса
    - Иначе скореры не смогли бы вернуть числа в диапазоне от 0 до 1
    - Иначе метаданные кейса не попали бы в запись результата
  correct: 0
