- concept: модель в каркасе eval — это контракт «вход → выход», поэтому за ним прячется API, локальный вес или заглушка без правки набора
  question: Каркас прогона принимает модель как функцию «строка на входе, строка на выходе». Что даёт такой узкий контракт?
  explanation: Каркас ничего не знает о том, что внутри функции. Поэтому один и тот же набор кейсов прогоняется на разных провайдерах, на локальной модели или на детерминированной заглушке для отладки самого каркаса. Сопоставимость чисел и устойчивость к разбросу этим контрактом не обеспечиваются — за них отвечают метрики и повторные прогоны.
  kind: choice
  options:
    - Позволяет подставлять API, локальную модель или заглушку, не меняя ни кейсы, ни скореры
    - Гарантирует, что все скореры вернут сопоставимые числа для любой задачи
    - Убирает необходимость хранить эталонный ответ в кейсе
    - Делает оценки устойчивыми к недетерминированности генерации
