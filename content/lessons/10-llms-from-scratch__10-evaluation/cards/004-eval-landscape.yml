- concept: custom eval даёт наивысший сигнал о будущем поведении в продакшене
  question: Какой тип оценки лучше всего предсказывает поведение модели в твоём продукте и почему за это приходится платить?
  explanation: Сигнал тем сильнее, чем ближе условия проверки к реальному использованию. Собственный набор совпадает с твоими входами и твоими сценариями отказа — за это платят ручной сборкой примеров и разметкой эталонов.
  kind: choice
  options:
    - 'Публичный бенчмарк: он стандартизирован и потому объективен'
    - 'Собственный eval: входы, эталонные выходы и функция оценивания задаются под твой сценарий, но набор дорого собрать'
    - 'Голосование пользователей на публичной арене: там больше всего суждений'
  correct: 1
  id: 004-eval-landscape-1
  fingerprint: 29d56803
- concept: стоимость человеческой оценки линейна по числу суждений, поэтому её применяют точечно
  question: Один прогон требует 400 человеческих суждений, каждое стоит $0,75. Сколько стоит один такой прогон в долларах?
  explanation: 400 × $0,75 = $300 за один прогон — и столько же за каждый следующий, при каждом изменении промпта или модели. Линейный рост цены (и задержка в часы-дни) объясняет, почему людей зовут только к финалистам и спорным случаям.
  kind: numeric
  answer: 300
  tolerance: 0.5
  id: 004-eval-landscape-2
  fingerprint: 0a4bebd7
- concept: 'воронка оценки: от дешёвого стандартного теста к дорогому человеческому суждению'
  question: Расставь три категории оценки в порядке возрастания стоимости одного прогона и силы сигнала о продакшене.
  explanation: 'Стрелки ландшафта идут именно так: бенчмарк для грубого отбора, custom eval для решения о запуске, человек — для неоднозначных случаев. Цена и качество сигнала растут вместе.'
  kind: order
  items:
    - Benchmarks — стандартизированные публичные наборы, одинаковые для всех моделей
    - Custom evals — свои входы, эталоны и функция оценивания под конкретный сценарий
    - Human evals — платные разметчики судят выходы по полезности, корректности и безопасности
  id: 004-eval-landscape-3
  fingerprint: a0ec8d6c
