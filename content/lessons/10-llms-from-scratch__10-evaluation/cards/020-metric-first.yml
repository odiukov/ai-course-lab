- concept: непройденный абсолютный порог означает отсутствие победителя, относительное сравнение его не заменяет
  question: 'До прогона зафиксировали: система проходит проверку при точности категории не ниже 95%. Модель А даёт 94%, модель Б — 89%. Какой вывод корректен?'
  explanation: 'Порог — абсолютное требование, а не рейтинг. «Лучше соседа» и «достаточно хорошо для продакшена» — разные утверждения; при 94% против 95% верный итог: кандидатов нет, нужна доработка.'
  kind: choice
  options:
    - Побеждает модель А, она лучшая из двух
    - Ни одна модель не прошла проверку; выбор лучшей из них не является решением о запуске
    - Порог нужно опустить до 94%, раз его никто не взял
    - Нужно усреднить результаты и считать проверку пройденной
  correct: 1
  id: 020-metric-first-1
  fingerprint: 18ffa081
- concept: значение порога выводится из допустимой цены ошибки в процессе-потребителе, а не из наблюдаемых баллов моделей
  question: Откуда берут числовое значение порога приёмки для custom eval?
  explanation: Порог — свойство задачи, а не моделей. Если ручной разбор выдерживает три ошибочные категории на сотню обращений, планка следует отсюда; привязка к достигнутому баллу делает проверку тавтологией.
  kind: choice
  options:
    - Из результата сильнейшей доступной модели — он и задаёт планку
    - Из среднего балла моделей на публичных бенчмарках
    - Из того, сколько ошибок выдерживает процесс, который потребляет выход системы
    - 'Из объёма набора кейсов: чем больше кейсов, тем выше порог'
  correct: 2
