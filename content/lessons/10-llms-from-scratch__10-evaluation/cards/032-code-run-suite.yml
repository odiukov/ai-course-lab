- concept: словарь оценок создаётся заново на каждой итерации, иначе записи ссылаются на один общий объект
  question: Пустой словарь scores создали один раз перед циклом по кейсам и переиспользуют. Что будет в итоговом списке?
  explanation: В словарь пишутся одни и те же ключи — имена скореров, — поэтому каждый следующий кейс затирает значения. А так как во все записи положена ссылка на один объект, после прогона весь журнал показывает оценки последнего кейса.
  kind: choice
  options:
    - Все записи ссылаются на один словарь, и в каждой видны оценки последнего кейса поверх предыдущих
    - Оценки первого кейса сохранятся, остальные потеряются
    - Функция упадёт при попытке записать вторую оценку
    - Оценки просуммируются по каждому имени скорера
  correct: 0
