- concept: порядок действий внутри тела цикла по кейсам при прогоне набора
  question: Расставь действия, которые выполняются для одного кейса внутри функции прогона.
  explanation: Модель вызывается один раз до цикла по скорерам, иначе каждая метрика получит свой текст. Словарь оценок создаётся заново для каждого кейса, а запись кладётся в общий список только после того, как заполнены все оценки.
  kind: order
  items:
    - Передать input_text кейса в model_fn и сохранить предсказание
    - Создать пустой словарь оценок для этого кейса
    - Вызвать каждый скорер с предсказанием и expected и записать результат под именем скорера
    - Добавить в общий список запись с input, expected, prediction и scores
  id: 032-code-run-suite-1
  fingerprint: eff4d764
- concept: return внутри внешнего цикла обрывает прогон после первого кейса без всякой ошибки
  question: Прогон на 12 кейсах с 7 скорерами завершается без ошибок, но возвращает список из одной записи с 7 оценками. Что случилось?
  explanation: 'Отступ return определяет, вернётся ли весь журнал или только первая запись. Ошибка тихая: исключения нет, оценки корректные — просто их 7 вместо 84. Признак — длина результата равна единице при любом размере набора.'
  kind: choice
  options:
    - Оператор return оказался внутри цикла по кейсам и сработал на первой итерации
    - Скореры перезаписали друг друга по одинаковому ключу
    - model_fn вернула одинаковый текст на всех входах
    - Список результатов создан внутри цикла по скорерам
  correct: 0
  id: 032-code-run-suite-2
