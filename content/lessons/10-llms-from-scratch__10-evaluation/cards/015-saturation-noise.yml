- concept: небольшое преимущество у потолка признаётся реальным только если переживает переформулировку заданий, другой похожий набор и проверку на релевантных примерах
  question: Модель A обошла модель B на бенчмарке, который у потолка. Объясни своими словами, что нужно сделать, прежде чем считать это преимуществом для твоего продукта.
  explanation: Ключ — не спорить с числом, а проверить его устойчивость и перенос на целевую задачу. Устойчивость проверяется другим набором похожих заданий, перенос — собственным набором кейсов.
  kind: open
  reference: 'Разница не отменяется, но и не доказывает разрыв способностей. Сначала посмотреть, на каких именно заданиях модели разошлись, и не спорные ли это задания. Затем проверить устойчивость: переформулировать пограничные задания или взять другой похожий набор — если победитель меняется, преимущество нестабильно. Наконец прогнать обе модели на собственных релевантных примерах и важных сценариях отказа: если преимущество сохраняется там, оно становится основанием для выбора, если исчезает — бенчмарк различил свой узкий хвост, а не поведение в продукте.'
