- concept: оба ожидания берутся из одного доматчевого снимка рейтингов, обновление применяется только после этого
  question: Расставь действия внутри функции обновления рейтингов по паре моделей в правильном порядке.
  explanation: 'Ожидания обеих сторон — функция одного и того же состояния: рейтингов перед матчем. Если сначала записать новый рейтинг A, а ожидание B считать уже по нему, один матч окажется сыгран при двух разных стартовых условиях: B будет оценён против соперника, которого до матча не существовало. Практическое следствие — перевод пунктов перестаёт быть симметричным.'
  kind: order
  items:
    - Вычислить ожидание модели A по рейтингам обеих моделей в состоянии до матча
    - Получить ожидание модели B как дополнение ожидания A
    - Вывести фактический результат B из переданного результата A
    - Изменить рейтинг каждой модели на k, умноженное на разность её факта и её ожидания
    - Вернуть пару обновлённых рейтингов
  id: 051-code-elo-update-1
  fingerprint: 5d15f0b4
- concept: фактический результат второй стороны выводится дополнением результата первой, поэтому в интерфейс достаточно одного числа
  question: Функция обновления рейтингов принимает рейтинги обеих моделей и результат только модели A. Почему результат B не нужно передавать отдельным аргументом?
  explanation: 'В паре разыгрывается ровно одно очко: победа одного означает поражение другого, ничья — половина каждому. Второй аргумент был бы избыточным и открывал бы дорогу несогласованным входам вроде «победили оба». Вариант с фиксированной потерей k неверен: величина перевода зависит от ожидания. Вариант со знаком разности путает ожидание с фактом — фаворит вполне может проиграть.'
  kind: choice
  options:
    - 'Исход парного матча полностью задан результатом одной стороны: результат B — дополнение результата A до полного очка, а ничья кодируется промежуточным значением у обеих'
    - 'Результат B не влияет на его рейтинг: проигравший всегда теряет фиксированную величину k'
    - 'Результат B определяется по знаку разности рейтингов: у кого рейтинг выше, тот и считается победителем'
    - Результат B восстанавливается из его ожидания, поэтому фактический исход для B не нужен
