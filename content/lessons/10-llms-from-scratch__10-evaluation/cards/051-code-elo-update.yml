- concept: округление — операция показа, внутри расчёта оно накапливает дрейф между матчами
  question: Почему рейтинги округляют при выводе таблицы лидеров, а не внутри функции обновления, если через трекер проходят сотни матчей?
  explanation: 'Пример: при k=24 и разрыве 200 пунктов победа фаворита даёт около 5.77 пункта. Округлив до целого на каждом матче, за 200 матчей можно потерять десятки пунктов, а сохранность суммы рейтингов пары — главный отладочный инвариант — перестанет выполняться, и настоящую ошибку в формуле уже не отличить от мусора округления.'
  kind: open
  reference: 'Обновление даёт дробную величину перевода. Округление внутри функции отбрасывает дробную часть на каждом матче, и рейтинг, ставший входом следующего матча, уже искажён. Ошибки не гасят друг друга, а накапливаются по всей серии: расходится сумма рейтингов пула, а порядок близких участников в таблице начинает зависеть от отбрасываемых долей пункта, а не от исходов. Округление — свойство представления результата, поэтому применяется на самом последнем шаге, к копии значения для показа, а хранимое состояние остаётся полной точности.'
  id: 051-code-elo-update-3
  fingerprint: b906289b
