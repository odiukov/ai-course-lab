- concept: публичный балл — дешёвый фильтр кандидатов, а не решение о запуске
  question: В каталоге тридцать моделей, проверка каждой на своих данных стоит времени и денег. Какая роль публичного бенчмарка здесь корректна?
  explanation: 'Бенчмарк почти бесплатен и даёт общую шкалу сразу для всех кандидатов — это делает его хорошим первичным фильтром. Решение о запуске он не обосновывает: его условия не совпадают с продакшеном, а вопросы могли попасть в обучающие данные.'
  kind: choice
  options:
    - Сократить список до нескольких кандидатов, которых потом проверяют на своей задаче
    - Определить победителя, которого сразу выкатывают в продакшен
    - Заменить собственные тесты, если бенчмарк достаточно большой
  correct: 0
  id: 003-benchmark-screen-1
  fingerprint: 7a2dc86f
- concept: 'какие выводы публичный балл поддерживает: отсев явных аутсайдеров, но не ранжирование близких лидеров'
  question: Три модели набрали 74,1%, 74,5% и 76,0%, а четвёртая — 41%. Какой вывод обоснован?
  explanation: 'Крупный разрыв читается как реальный сигнал: аутсайдер отсеивается дёшево. Разрыв в пару пунктов между сильными моделями сопоставим с шумом — они могли ошибаться на разных вопросах, и на твоей задаче порядок легко перевернётся.'
  kind: choice
  options:
    - Четвёртую можно смело отсеять, а между первыми тремя выбирать по этим числам нельзя
    - 'Третью можно брать в продакшен: у неё лучший балл'
    - Все четыре нужно тестировать одинаково подробно, балл не даёт никакой информации
  correct: 0
  id: 003-benchmark-screen-2
  fingerprint: 6f337205
- concept: 'порядок отбора модели: дешёвый широкий фильтр перед дорогой проверкой на своей задаче'
  question: Расставь шаги выбора модели для продукта в разумном порядке по цене проверки.
  explanation: 'Порядок задан ценой сигнала: дешёвое и грубое применяется ко всем, дорогое и точное — только к выжившим. Обратный порядок сжигает бюджет на кандидатах, которых отсеял бы бесплатный тест.'
  kind: order
  items:
    - Прогнать всех кандидатов по публичному бенчмарку и убрать явно слабых
    - Оставшихся финалистов прогнать на собственных данных и типичных запросах продукта
    - Спорные случаи, где автоматическая проверка не различает ответы, отдать на человеческое суждение
  id: 003-benchmark-screen-3
  fingerprint: 3face83d
