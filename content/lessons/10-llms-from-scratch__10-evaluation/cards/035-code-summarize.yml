- concept: у каждой метрики собственное n, потому что метрика может быть посчитана не на всех кейсах
  question: Прогон дал 9 результатов. Строгое совпадение считалось только на 6 из них, F1 — на всех 9. Какое значение поля n окажется в сводке для строгого совпадения?
  explanation: 'n — длина списка оценок конкретной метрики, а не число кейсов в прогоне. Списки метрик могут иметь разную длину, и сводка обязана это показывать: среднее по 6 оценкам и среднее по 9 заслуживают разного доверия, хотя стоят рядом в одном отчёте.'
  kind: numeric
  answer: 6
  tolerance: 0.4
  id: 035-code-summarize-2
  fingerprint: 81f370fe
- concept: порог, напечатанный в отчёте, обязан быть тем же, по которому считалась доля прохождения
  question: Сводка считается с порогом, переданным параметром, а печать отчёта выводит подпись «порог ≥ 0.8» константой. Чем это опасно?
  explanation: Расчёт и подпись — два независимых места, где живёт порог. Если они разъезжаются, отчёт выглядит убедительно и объясняет числа, полученные при другом условии приёмки. Порог нужно брать из той же переменной, что участвовала в расчёте, и печатать её значение, а не константу.
  kind: choice
  options:
    - При вызове с другим порогом отчёт покажет корректные числа под неверной подписью, и доля прохождения будет истолкована неправильно
    - Доля прохождения станет считаться по среднему вместо порога
    - Метрики с малым n выпадут из отчёта
    - Округление до трёх знаков перестанет применяться
  correct: 0
