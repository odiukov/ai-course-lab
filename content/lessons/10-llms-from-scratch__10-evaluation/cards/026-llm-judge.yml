- concept: судье подают вход, ответ и опорные факты или эталон; без опоры он проверяет правдоподобие, а не истинность
  question: Что подают на вход модели-судье и что она возвращает? Почему опорные факты или эталон важны?
  explanation: Судья — это модель, а не база знаний. Фактическая проверка возможна ровно в той мере, в какой в промпте есть, с чем сверять.
  kind: open
  reference: 'Судье передают исходный запрос, ответ проверяемой модели, критерии оценивания и, если он есть, эталон или набор фактов для сверки. Судья возвращает оценку или решение с кратким обоснованием: соблюдена ли инструкция, верны ли утверждения, полезен ли ответ, нет ли опасного совета. Без опорных фактов судья способен оценить только связность и правдоподобие текста — уверенно изложенная выдумка получит высокий балл, потому что сверять её не с чем.'
  id: 026-llm-judge-3
  fingerprint: e66ca180
