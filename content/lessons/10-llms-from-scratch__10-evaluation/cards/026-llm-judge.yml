- concept: судью берут не слабее оцениваемой модели, потому что распознать ошибку труднее, чем её совершить
  question: Почему в роли судьи используют модель сильнее той, чьи ответы оцениваются?
  explanation: Судья должен обнаруживать ошибки, которые оцениваемая модель не заметила. Судья того же или меньшего уровня разделяет её слепые зоны и штампует одобрения. Гарантии совпадения с человеком при этом нет — судья остаётся приближением, а не истиной.
  kind: choice
  options:
    - Сильная модель дешевле в пересчёте на одно суждение
    - 'Судить труднее, чем генерировать: нужно распознать корректный пересказ и заметить скрытое противоречие, а слабая модель одобрит ту же ошибку, которую сама склонна допускать'
    - Только сильная модель умеет возвращать число в заданном диапазоне
    - Сильная модель гарантированно совпадает с человеческим вердиктом
