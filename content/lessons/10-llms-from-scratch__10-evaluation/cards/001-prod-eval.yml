- concept: одинаковый агрегированный балл скрывает разное распределение и разную цену ошибок
  question: Два ассистента поддержки набрали по 91% на одном и том же наборе тестов. Первый иногда отвечает сухо и коряво, второй изредка уверенно обещает клиенту компенсацию вопреки правилам компании. Что это говорит о пригодности агрегированного балла как критерия запуска?
  explanation: 'Один процент сжимает множество умений и типов отказа в одно число. Оценка запуска требует знать, ГДЕ модель ошибается и сколько стоит ошибка: обещание возврата денег вопреки политике дороже неловкой формулировки, хотя в проценте они весят одинаково.'
  kind: choice
  options:
    - 'Балл достаточен: одинаковый процент означает одинаковую пригодность для продакшена'
    - Балл усредняет разные типы ошибок и не различает косметический промах и дорогой отказ
    - Балл занижен у обоих, потому что тестов было слишком мало
  correct: 1
  id: 001-prod-eval-1
  fingerprint: f900398a
- concept: бенчмарк покрывает только срез задачи и молчит про остальные режимы использования
  question: Команда выбирает модель для ассистента по коду, опираясь на бенчмарк генерации отдельных функций по описанию. Какой главный пробел у такого выбора?
  explanation: HumanEval и подобные наборы проверяют генерацию изолированной функции. Реальный ассистент по коду больше времени тратит на объяснение, отладку и правку существующего многофайлового кода — по этим режимам балл не говорит ничего.
  kind: choice
  options:
    - Бенчмарк не покрывает отладку, рефакторинг и работу с кодом, размазанным по нескольким файлам
    - Бенчмарк использует Python, а команде нужен другой язык
    - Бенчмарк даёт балл в процентах, а нужен балл в абсолютных числах
  correct: 0
  id: 001-prod-eval-2
  fingerprint: 1892f180
- concept: финальная оценка обязана воспроизводить входное распределение и сценарии отказа продакшена
  question: Объясни своими словами, почему финальная оценка модели должна повторять условия продакшена, а не ограничиваться прогоном по подготовленному публичному набору.
  explanation: Ключ — совпадение распределения входов и набора важных отказов. Разрыв между баллом на бенчмарке и надёжностью в работе возникает именно там, где условия расходятся.
  kind: open
  reference: 'На публичном наборе модель получает вычищенный, заранее сформулированный вход. В продакшене вход другой: опечатки, обрывки фраз, история переписки, данные внутренних систем, редкие и злонамеренные запросы. Совпадение условий — единственное, что делает измеренный балл предсказанием будущего поведения; при расхождении условий балл описывает лишь успех на этом наборе. Плюс продакшен задаёт собственные сценарии отказа (выдуманный факт, нарушение политики), которых в бенчмарке нет.'
  id: 001-prod-eval-3
  fingerprint: 4a38cfca
