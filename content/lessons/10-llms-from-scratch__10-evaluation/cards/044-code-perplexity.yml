  question: Реализация сначала считает арифметическое среднее вероятностей токенов (0,8 и 0,05 дают 0,425), а затем берёт обратную величину. Чем это отличается от perplexity?
  explanation: 'Усреднение логарифмов равносильно геометрическому среднему вероятностей: √(0,8 · 0,05) = 0,2, обратная величина 5. Арифметическое среднее вероятностей даёт 1/0,425 ≈ 2,35 и почти прячет провальный токен. Это уже другая метрика, а не perplexity.'
