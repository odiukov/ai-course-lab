- concept: perplexity равна обратной геометрической средней вероятностей токенов, потому что усредняются логарифмы
  question: 'Последовательность из двух токенов: модель дала им вероятности 0,25 и 0,0625. Чему равна perplexity?'
  explanation: 'Среднее логарифмов: (ln 0,25 + ln 0,0625) / 2 = (−1,386 − 2,773) / 2 = −2,079. Экспонента от 2,079 даёт 8. То же самое — единица делить на геометрическое среднее вероятностей: √(0,25 · 0,0625) = 0,125, обратная величина 8.'
  kind: numeric
  answer: 8
  tolerance: 0.1
  id: 044-code-perplexity-2
  fingerprint: 6f5ebdd5
