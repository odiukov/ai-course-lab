- concept: pass rate — доля кейсов с оценкой не ниже порога
  question: В прогоне 40 кейсов. Оценка не ниже порога 0,75 получена в 26 кейсах. Чему равна доля прохождения?
  explanation: '26 / 40 = 0,65, то есть 65%. Оценка ровно на пороге засчитывается как прохождение: сравнение нестрогое.'
  kind: numeric
  answer: 0.65
  tolerance: 0.01
  id: 033-pass-rate-1
  fingerprint: a3377a13
- concept: pass rate бинаризует оценки и не различает величину провала или улучшения ниже порога
  question: После правки промпта среднее по набору заметно выросло, а доля прохождения осталась прежней. Как это возможно?
  explanation: 'Доля прохождения превращает каждую оценку в «да/нет» относительно порога. Рост с 0,2 до 0,74 при пороге 0,75 двигает среднее, но ни один кейс не переходит границу. Обратное тоже верно: провал с 0,74 до 0,05 доля прохождения не заметит.'
  kind: choice
  options:
    - Улучшились кейсы, которые и до, и после правки остались ниже порога
    - Порог был снижен вместе с правкой промпта
    - Скорер начал возвращать значения вне диапазона от 0 до 1
    - Доля прохождения не зависит от оценок скорера
  correct: 0
  id: 033-pass-rate-2
  fingerprint: f967e19a
- concept: доля прохождения характеризует связку «набор кейсов + метрика + порог», а не модель саму по себе
  question: 'Две команды докладывают долю прохождения по одной модели: 62% и 91%. Обе цифры посчитаны корректно. Что нужно проверить в первую очередь?'
  explanation: Доля прохождения — не свойство модели. Она сдвигается при смене порога, замене скорера или другого набора кейсов. Сравнивать такие числа можно только при полностью одинаковых условиях, иначе это разные измерения.
  kind: choice
  options:
    - Совпадают ли у команд набор кейсов, метрика и значение порога
    - Одинаково ли округлены оценки скореров
    - Сколько раз каждая команда вызывала модель на кейс
    - Использовали ли команды медиану или среднее для агрегации
  correct: 0
  id: 033-pass-rate-3
  fingerprint: fbbcb285
