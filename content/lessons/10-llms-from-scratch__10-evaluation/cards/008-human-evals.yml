- concept: 'человеческая оценка ограничена не только ценой, но и задержкой: результат приходит через часы или дни, поэтому её нельзя ставить в быстрый цикл разработки'
  question: Инженер хочет запускать человеческую оценку на каждом коммите, и бюджет это позволяет. Что всё равно делает такую схему нерабочей?
  explanation: 'У человеческой оценки два ограничения: цена за суждение и время получения результата. Даже при снятом бюджетном ограничении задержка в часы-дни разрывает цикл «правка — проверка», поэтому люди работают по срезу спорных случаев, а быстрые проверки остаются автоматическими.'
  kind: choice
  options:
    - Согласие людей с автоматическими метриками слишком низкое
    - Разметчики не умеют работать со структурированными выходами
    - Вердикт приходит через часы или дни, а решение по коммиту нужно за минуты
    - Человеческая оценка не поддаётся версионированию
