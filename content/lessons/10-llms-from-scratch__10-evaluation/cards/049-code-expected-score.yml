- concept: в показателе степени логистической формулы Elo стоит рейтинг соперника минус рейтинг оцениваемого участника
  question: 'Дополни формулу ожидаемого счёта участника A через рейтинги пары (SCALE — масштабная константа рейтинга):'
  explanation: 'Разность берётся в порядке «соперник минус оцениваемый»: тогда у более сильного A показатель отрицательный, степень десятки меньше единицы, знаменатель близок к 1, и ожидание уходит вверх. Перевёрнутый порядок вычитания даёт формально валидное число, но объявляет фаворита аутсайдером — ошибка не падает, а тихо инвертирует рейтинг.'
  kind: cloze
  template: expected_a = 1 / (1 + 10 ** ((___) / SCALE))
  answer: rating_b - rating_a
  accept:
    - rating_b-rating_a
    - R_B - R_A
    - рейтинг B - рейтинг A
  id: 049-code-expected-score-1
  fingerprint: 9262bc65
- concept: масштабная константа задаёт, какая разность рейтингов соответствует десятикратному перевесу шансов
  question: Рейтинг участника A равен 2100, рейтинг B — 1300. Чему примерно равен ожидаемый счёт A по стандартной формуле Elo?
  explanation: 'Масштаб 400 означает: каждые 400 пунктов разрыва умножают отношение шансов на 10. Разрыв 800 — это два таких шага, шансы 100:1, ожидаемый счёт 100/101 ≈ 0.990. Именно поэтому шкала Elo читается как разность, а не как отношение чисел.'
  kind: numeric
  answer: 0.99
  tolerance: 0.005
  id: 049-code-expected-score-2
  fingerprint: 7c3ec2fe
- concept: ожидаемый счёт зависит только от разности рейтингов, а не от их абсолютного уровня
  question: Пара A=2400, B=2000 и пара C=1600, D=1200. Как соотносятся ожидаемые счёта A и C?
  explanation: В формулу входит только разность rating_b - rating_a. Обе пары разведены на 400 пунктов, значит оба ожидания равны ≈0.909. Абсолютный уровень рейтинга в Elo смысла не несёт — он лишь точка отсчёта, общая для всего пула.
  kind: choice
  options:
    - 'У A ожидание выше: чем больше абсолютные рейтинги, тем увереннее фаворит'
    - 'Ожидания совпадают: формула зависит только от разности рейтингов'
    - 'У C ожидание выше: на низких рейтингах разрыв весит больше'
    - 'Сравнить нельзя: пары играют в разных диапазонах силы'
  correct: 1
  id: 049-code-expected-score-3
  fingerprint: f22f67f6
