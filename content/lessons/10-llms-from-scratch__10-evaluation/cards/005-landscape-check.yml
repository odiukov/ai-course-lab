- concept: custom eval состоит из входов, ожидаемых выходов и функции оценивания
  question: Из каких трёх частей ты собираешь собственный eval для своей задачи? Назови их и поясни назначение каждой.
  explanation: 'Именно эти три части отличают eval от коллекции демонстраций: набор становится воспроизводимым измерением, которое можно прогнать после каждого изменения промпта или модели.'
  kind: open
  reference: '1) Набор входов — примеры, повторяющие реальные запросы продукта, включая тяжёлые и краевые случаи. 2) Ожидаемые выходы (эталоны) — то, что считается правильным ответом; для открытых задач это может быть набор критериев вместо единственного текста. 3) Функция оценивания — правило, превращающее пару «выход модели / эталон» в балл: точное совпадение, F1, проверка правил или суждение LLM-судьи. Без третьей части набор примеров не даёт числа, а без второй — не с чем сравнивать.'
  id: 005-landscape-check-2
  fingerprint: '57784888'
