- concept: функция оценивания требует перевода расплывчатого «ответ хороший» в набор наблюдаемых проверяемых условий
  question: Почему критерий «ответ модели хороший» нельзя использовать как функцию оценивания в custom eval и чем его заменяют?
  explanation: Третий элемент custom eval — функция оценивания, а функция обязана давать одинаковый ответ на одинаковом входе. Расплывчатая формулировка этого не даёт; набор наблюдаемых условий даёт и дополнительно показывает, какое именно требование нарушено.
  kind: open
  reference: 'Такой критерий не проверяем: два человека или два прогона дадут разные вердикты, а сравнивать прогоны во времени невозможно. Его раскладывают на наблюдаемые условия, каждое из которых проверяется отдельно по конкретному ответу: верно ли определена категория обращения, нет ли утверждений, не подтверждённых входными данными, соблюдены ли правила и ограничения предметной области, предложено ли допустимое следующее действие. Каждое условие даёт да/нет или балл, из них собирается итоговая оценка, и тогда результат воспроизводим и сравним между версиями.'
  id: 007-custom-signal-2
