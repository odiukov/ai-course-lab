- concept: декларативный тест промпта фиксирует требуемое свойство выхода, а не процедуру его проверки
  question: Чем декларативное описание теста промпта отличается от скрипта, который сам вызывает модель и печатает результат?
  explanation: В конфиге ты пишешь пару «вход + утверждение, которое должно оказаться истинным». Механика вызова, подстановки и сравнения — часть инструмента. Поэтому набор ожиданий переживает переписывание промпта и не зависит от того, кто его запускает.
  kind: choice
  options:
    - Декларативный тест выполняется быстрее, потому что не обращается к модели
    - Декларативный тест задаёт вход и утверждение о выходе, а как проверять и как запускать — берёт на себя инструмент
    - Декларативный тест не требует ожидаемого ответа
    - Декларативный тест работает только с одной моделью
  correct: 1
  id: 056-promptfoo-1
  fingerprint: 22c79d5b
- concept: в кейсе значения подстановки в шаблон и проверяемое утверждение лежат в разных полях
  question: 'Заполни пропуск: в блоке кейса `vars` держит подстановки в шаблон промпта, а какое поле держит проверяемое утверждение о выходе?'
  explanation: '`vars` — данные, подставляемые в шаблон; `assert` — список утверждений о полученном ответе. Разнесение по разным полям и делает кейс читаемым: видно, что подали и чего ждут.'
  kind: cloze
  template: |-
    tests:
      - vars:
          ticket: "Не приходит письмо со сбросом пароля"
        ___:
          - type: equals
            value: "аккаунт"
  answer: assert
  accept:
    - asserts
    - assertions
  id: 056-promptfoo-2
  fingerprint: 38f5593a
- concept: прогон одного набора кейсов по нескольким провайдерам локализует поломку до пары «кейс + провайдер»
  question: Зачем в конфиге регрессионных тестов промпта перечисляют несколько провайдеров сразу?
  explanation: Провайдеры получают один и тот же шаблон и одни и те же входы, поэтому расхождение приписывается модели, а не формулировке. В отчёте видно не «стало хуже», а какое именно утверждение упало и у кого.
  kind: choice
  options:
    - Чтобы усреднить их ответы и получить более надёжный вердикт
    - Чтобы одинаковые кейсы прошли по всем моделям и падение было видно до конкретной пары «кейс + провайдер»
    - Чтобы дешёвый провайдер подстраховал дорогой при ошибке сети
    - Чтобы инструмент сам выбрал лучшего провайдера и остальных отключил
  correct: 1
  id: 056-promptfoo-3
  fingerprint: d673cab2
