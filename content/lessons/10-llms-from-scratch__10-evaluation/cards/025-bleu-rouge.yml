- concept: BLEU опирается на совпавшие короткие последовательности слов ответа, ROUGE — на долю эталона, покрытую ответом
  question: Чем по акценту различаются BLEU и ROUGE?
  explanation: BLEU исторически ориентирован на перевод и смотрит, насколько последовательности слов ответа встречаются в эталоне; ROUGE ориентирован на суммаризацию и проверяет покрытие эталона. Обе остаются метриками формы, а не смысла.
  kind: choice
  options:
    - BLEU оценивает грамматическую правильность, ROUGE — фактическую точность
    - BLEU чувствителен к совпавшим коротким последовательностям слов в ответе, ROUGE обычно смотрит, какая часть эталона встретилась в ответе
    - BLEU работает с одним эталоном, ROUGE требует оценки человеком
    - BLEU применим только к структурированным выходам, ROUGE — только к классификации
  correct: 1
