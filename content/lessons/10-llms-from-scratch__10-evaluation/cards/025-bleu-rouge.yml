- concept: текстовая метрика валидна там, где множество допустимых формулировок узкое и качество действительно выражается совпавшими словами
  question: Объясни своими словами, при каком свойстве задачи BLEU/ROUGE дают полезный сигнал, а при каком становятся почти бесполезны.
  explanation: Ключ — ширина множества допустимых ответов. Единственная эталонная строка не перечисляет все хорошие способы сказать то же самое, поэтому валидность метрики падает вместе с ростом свободы формулировки.
  kind: open
  reference: 'Метрика полезна, когда допустимых формулировок мало и они близки к эталону: перевод с устойчивой терминологией, краткий пересказ, где важно покрыть ключевые факты исходника. Чем свободнее выход (совет, объяснение, письмо, творческий текст), тем больше существует одинаково хороших формулировок, которых нет в единственном эталоне. Тогда метрика штрафует верный ответ за иные слова и награждает бессвязное копирование лексики. Она отвечает на вопрос «насколько тексты похожи по форме», и подменять им вопрос «насколько ответ хорош по смыслу» нельзя.'
