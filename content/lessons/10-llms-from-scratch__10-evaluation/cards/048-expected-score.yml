- concept: ожидаемые счёта двух соперников в паре в сумме дают единицу
  question: В Elo для пары моделей A и B ожидаемый счёт A равен 0,68. Чему равен ожидаемый счёт B?
  explanation: 'Формула Elo симметрична: E_B = 1 − E_A, потому что в паре разыгрывается ровно одно очко. 1 − 0,68 = 0,32. Отдельно считать E_B по формуле не нужно — достаточно вычесть.'
  kind: numeric
  answer: 0.32
  tolerance: 0.01
  id: 048-expected-score-1
  fingerprint: 8ed3a7a3
- concept: 'ожидание Elo асимптотично: любой конечный разрыв рейтингов оставляет аутсайдеру ненулевой шанс'
  question: Разрыв рейтингов между двумя моделями увеличивают всё сильнее — сначала вдвое, потом впятеро. Что происходит с ожидаемым счётом фаворита?
  explanation: 'Ожидание задано логистической функцией разности рейтингов: степень десятки стремится к нулю, но нулём не становится, поэтому E_A стремится к единице лишь асимптотически. Практическое следствие: даже разгромный по рейтингу фаворит, проиграв, теряет очки — исход не был исключён моделью.'
  kind: choice
  options:
    - Он растёт и после достаточно большого разрыва становится ровно единицей — победа фаворита считается предрешённой
    - 'Он приближается к единице, но не достигает её ни при каком конечном разрыве: у аутсайдера всегда остаётся ненулевое ожидание'
    - Он растёт линейно вместе с разрывом и может превысить единицу, поэтому его обрезают сверху
    - Он перестаёт меняться после того, как разрыв превышает масштаб шкалы
  correct: 1
  id: 048-expected-score-2
  fingerprint: ebc2b31e
- concept: ожидаемый счёт — частота в длинной серии сравнений, а не прогноз исхода одной пары
  question: Ожидаемый счёт модели A против модели B равен 0,83. Объясни своими словами, что именно это число утверждает и чего оно не утверждает про ближайшее сравнение этой пары.
  explanation: Смешение вероятности с гарантией — типичная ошибка чтения арены. Ожидание описывает распределение исходов по множеству встреч; одиночный результат может отклоняться в любую сторону, и вся механика Elo как раз построена на разнице между фактическим счётом и этим ожиданием.
  kind: open
  reference: '0,83 — это доля очков, которую A должна набрать в длинной серии похожих независимых сравнений: примерно 83 победы на 100 встреч (ничьи считаются как половина очка). Про конкретное следующее сравнение число не говорит ничего определённого: исход остаётся случайным, и поражение A не противоречит прогнозу. Именно поэтому ожидание используют как опорную величину, с которой сравнивают фактический результат при обновлении рейтинга, а не как предсказание отдельного матча.'
  id: 048-expected-score-3
  fingerprint: e03ef57a
