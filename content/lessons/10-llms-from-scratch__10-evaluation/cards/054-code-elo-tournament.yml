- concept: повторная победа над тем же соперником приносит меньше пунктов, потому что рейтинги уже разошлись
  question: Две модели стартуют с рейтингом 1200, K = 20. Модель A выигрывает два кейса подряд, рейтинги обновляются после каждого. Чему равен рейтинг A после второго матча?
  explanation: 'Первый матч: ожидание 0.5, сдвиг 10, получаем 1210 и 1190. Второй матч уже при разрыве 20 пунктов: ожидание A ≈ 0.529, сдвиг 20 × 0.471 ≈ 9.4, итог ≈ 1219.4. Прирост убывает с каждой победой — это и есть механизм сходимости рейтинга.'
  kind: numeric
  answer: 1219.4
  tolerance: 0.5
