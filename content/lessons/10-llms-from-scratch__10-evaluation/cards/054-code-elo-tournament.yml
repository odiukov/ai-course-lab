- concept: ветвление исхода требует строгих сравнений, иначе равные баллы уходят в победу одной из сторон
  question: 'Дополни определение исхода матча так, чтобы равные баллы дали ничью:'
  explanation: Обе ветви должны сравнивать строго. Стоит поставить `<=` — и равенство баллов будет объявлено победой B, а ветка ничьей станет недостижимой. Молчаливая потеря ничьих смещает рейтинги систематически, и по итоговой таблице этого не видно.
  kind: cloze
  template: |-
    if score_a > score_b: outcome = "a"
    elif score_a ___ score_b: outcome = "b"
    else: outcome = "tie"
  answer: <
  accept:
    - меньше
    - strictly less
