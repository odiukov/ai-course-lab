- concept: правила нормализации — часть определения метрики, а не свободная очистка на этапе разбора
  question: Почему набор правил нормализации нельзя расширять по ходу разбора неудачных ответов (например, добавив удаление пунктуации после того, как ответ «Токио.» получил ноль)?
  explanation: Нормализация — это утверждение «эти различия для задачи не важны». Оно принимается из контракта, а не из желания поднять балл конкретного прогона.
  kind: open
  reference: 'Каждое новое правило меняет саму метрику: то же множество ответов начинает давать другой балл, и прогоны до и после правки становятся несопоставимыми. Тогда рост числа нельзя отличить от улучшения системы. Правила фиксируют в определении метрики вместе с контрактом задачи, а изменение оформляют как новую версию eval.'
  id: 021-exact-match-3
