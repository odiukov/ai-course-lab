- concept: нормализация снимает только заранее перечисленный класс различий, остальное сравнение остаётся строгим
  question: Метрика обрезает краевые пробелы и приводит текст к нижнему регистру, затем требует полного совпадения. Какая пара ответов получит несовпадение?
  explanation: 'Точка не входит в список нормализуемых различий, поэтому строки остаются разными. Нормализация не делает метрику мягкой: она лишь гасит оформление, которое контракт заранее объявил незначимым.'
