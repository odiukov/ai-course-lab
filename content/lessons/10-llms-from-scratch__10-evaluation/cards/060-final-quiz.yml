- concept: HumanEval меряет генерацию изолированной функции, SWE-bench — починку реального issue в репозитории от начала до конца
  question: Модель показывает отличный результат на HumanEval, но плохо чинит баги в рабочем репозитории. Почему это не противоречие?
  explanation: Это разные способности. HumanEval — 164 задачи на изолированную функцию. SWE-bench берёт реальные issue из Python-репозиториев и меряет починку от начала до конца. Балл за первую задачу не предсказывает вторую.
  kind: choice
  options:
    - HumanEval насыщен, поэтому его баллы всегда завышены
    - HumanEval проверяет дописывание отдельной функции по докстрингу, а починка issue требует навигации по репозиторию, правок в нескольких местах и тестов
    - HumanEval не использует автоматическую проверку тестами
    - Задачи HumanEval написаны не на Python
  correct: 1
  id: 060-final-quiz-1
  fingerprint: be34df49
- concept: лидерборд Chatbot Arena строится на массовых человеческих попарных голосах, поэтому меряет предпочтение людей, а не решение фиксированного набора заданий
  question: Чем ранжирование моделей на Chatbot Arena принципиально отличается от MMLU?
  explanation: 'Arena — попарные сравнения, оценённые людьми, свёрнутые в относительный рейтинг. Отсюда её сильная сторона (человеческое суждение на живых запросах) и её ограничение: рейтинг задаёт порядок среди участников пула, а не абсолютное качество на твоей задаче.'
  kind: choice
  options:
    - Arena использует более сложные вопросы с выбором ответа
    - Arena агрегирует человеческие голоса за один из двух ответов на один и тот же запрос, а не баллы за фиксированный набор заданий
    - Arena считает perplexity моделей на общем корпусе
    - Arena запускает модели только на задачах по коду
  correct: 1
  id: 060-final-quiz-2
