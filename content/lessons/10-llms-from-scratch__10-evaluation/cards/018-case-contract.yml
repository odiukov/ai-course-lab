- concept: метаданные кейса не участвуют в вынесении вердикта, а служат для разбиения результатов на срезы при разборе ошибок
  question: Какую роль играют метаданные eval-кейса (канал, язык, тема, уровень риска)?
  explanation: 'Прошёл кейс или нет, решают вход, эталон и функция оценивания. Метаданные — ярлыки для анализа: по ним видно, что общий балл не сдвинулся, а срез по одному каналу или одной теме просел, и ошибка превращается в диагноз.'
  kind: choice
  options:
    - Они добавляются к эталону и влияют на то, засчитан ли ответ
    - Они передаются модели как подсказка о том, какого ответа ждут
    - Они не влияют на вердикт, но позволяют после прогона сгруппировать результаты и локализовать просадку
    - Они заменяют эталон для кейсов, где правильный ответ неизвестен
  correct: 2
  id: 018-case-contract-1
  fingerprint: 7e531341
- concept: метаданные хранятся отдельно от входа и не подаются модели, иначе кейс перестаёт воспроизводить продакшен-вход
  question: 'Инженер решил дописывать метаданные кейса («тема: платежи, риск: высокий») прямо в текст, который получает модель. Что с этим не так?'
  explanation: 'Вход кейса должен совпадать с тем, что придёт в продакшене. Подмешанные метки темы и риска работают как подсказка: балл вырастет, а поведение на реальном трафике не изменится. Метаданные лежат в отдельных полях кейса, а не во входе.'
  kind: choice
  options:
    - Ничего, это повышает точность модели на срезах
    - Модель получает контекст, которого в продакшене нет, и eval начинает измерять поведение на облегчённых входах
    - Метаданные удлиняют промпт и увеличивают стоимость прогона
    - После этого невозможно посчитать общий балл
  correct: 1
  id: 018-case-contract-2
  fingerprint: 5402a812
- concept: эталон кейса готовится и проверяется независимо от ответов оцениваемой модели
  question: Команда собирает эталонные ответы, прогоняя текущую модель по письмам и вычитывая её выдачу «на глаз». Чем плох такой способ?
  explanation: Если эталон выведен из выдачи модели, её систематические ошибки становятся «правильным ответом», а любая модель, исправившая их, получит штраф. Эталон определяется по контракту задачи и проверяется независимо — иначе eval превращается в тест на совпадение с прежним поведением.
  kind: choice
  options:
    - Эталон получится слишком подробным для автоматической проверки
    - Эталон закрепит ошибки текущей модели, и eval будет измерять сходство с ней, а не правильность
    - Так нельзя добавить в набор граничные случаи
    - Эталон нельзя будет версионировать вместе с промптами
  correct: 1
  id: 018-case-contract-3
  fingerprint: 10be54a2
