- concept: коэффициент K задаёт компромисс между скоростью реакции рейтинга и его устойчивостью
  question: 'Команда сравнивает две настройки рейтинга: K = 64 и K = 8. Чем они отличаются?'
  explanation: K — максимальный размер шага одного обновления. Большой K полезен, когда модель новая и её место неизвестно; маленький — когда рейтинг уже устоялся и от него ждут стабильности. Точность здесь берётся из числа матчей, а не из величины K.
  kind: choice
  options:
    - При K = 64 рейтинг быстро реагирует на новые результаты, но сильнее скачет от отдельных матчей; при K = 8 он устойчивее, но медленнее догоняет реальную силу модели
    - При K = 64 рейтинг точнее, потому что учитывает больше матчей
    - K влияет только на ничьи, исходы с победителем от него не зависят
    - При K = 8 рейтинг не может превысить стартовое значение
