- concept: изменение рейтинга равно K, умноженному на разность фактического результата и ожидания
  question: Коэффициент K равен 16, ожидаемая вероятность победы модели A составляет 0,9. Модель A выигрывает матч. На сколько пунктов вырастет её рейтинг?
  explanation: '16 · (1 − 0,9) = 1,6. Победа фаворита почти ничего не добавляет: система её уже ожидала. Если бы вместо этого выиграл соперник, он получил бы 16 · (1 − 0,1) = 14,4 пункта — сенсация несёт много информации.'
  kind: numeric
  answer: 1.6
  tolerance: 0.05
