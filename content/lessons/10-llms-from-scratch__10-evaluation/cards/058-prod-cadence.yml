- concept: частота запуска слоя оценки определяется его ценой и задержкой, а не тем, насколько он точен
  question: 'В процессе разработки есть три слоя проверки: строгие автоматические скореры, модель-судья и человеческая разметка. Как разумно распределить частоту их запуска?'
  explanation: Самый точный слой одновременно самый дорогой и самый медленный, поэтому ставить его в каждый цикл нельзя. Чем проверка дешевле и быстрее, тем чаще она работает; дорогой слой запускается в специально выбранный момент — перед релизом или на спорных кейсах.
  kind: choice
  options:
    - Все три запускать после каждого изменения, иначе регрессия проскочит
    - Строгие скореры — после каждого изменения, судью — регулярно и реже, людей — точечно
    - Только человеческую разметку, раз она самая точная
    - 'Запускать по очереди: каждое изменение проверяет следующий по списку слой'
  correct: 1
  id: 058-prod-cadence-1
  fingerprint: 00f19252
- concept: человеческую разметку тратят на разрешение неоднозначности и калибровку доверия к судье, а не на дублирование автоматических слоёв
  question: Автоматические скореры и модель-судья на части кейсов дают противоположные вердикты. Какая роль человеческой разметки здесь основная?
  explanation: 'Человек — эталон, а не ещё один параллельный скорер. Его суждения дороги, поэтому их тратят там, где автоматика неоднозначна, и на измерение согласия судьи с людьми: без этого неизвестно, стоит ли доверять ежедневным прогонам судьи.'
  kind: choice
  options:
    - Переоценить весь набор кейсов заново, чтобы получить единый балл
    - Разобрать именно спорные кейсы и заодно проверить, насколько судье можно доверять
    - Заменить судью на постоянной основе
    - Подтвердить вердикт дешёвого скорера, потому что он объективнее
  correct: 1
