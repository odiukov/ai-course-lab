- concept: log-probability неположительна, и близость к нулю означает высокую уверенность модели в фактическом токене
  question: Для двух токенов модель вернула log-probability −0,05 и −3,2. Что это значит?
  explanation: 'Вероятность не превышает единицы, поэтому её логарифм неположителен. Чем ближе значение к нулю, тем ближе вероятность к 1: −0,05 соответствует примерно 0,95, а −3,2 — примерно 0,04. Сильно отрицательные значения и дают основной вклад в рост perplexity.'
  kind: choice
  options:
    - Первый токен модель предсказывала уверенно, второй оказался для неё неожиданным
    - Второй токен модель предсказывала уверенно, первый оказался неожиданным
    - 'Оба значения ошибочны: log-probability не может быть отрицательной'
    - Разница знаков показывает, что токены взяты из разных распределений
