- concept: последовательность без токенов не даёт среднего, поэтому возвращается сигнальное значение вместо числа, читаемого как качество
  question: На вход расчёта perplexity пришла последовательность без единого токена. Объясни своими словами, почему нельзя вернуть маленькое число вроде нуля и что здесь корректно вернуть.
  explanation: Ключ в различии «плохой результат» и «результата нет». Бесконечность видна в отчёте и не растворяется в среднем, тогда как ноль или единица притворились бы обычной оценкой.
  kind: open
  reference: 'Среднее по пустому набору наблюдений не определено: делить сумму пришлось бы на нулевое количество. Маленькое значение читалось бы как «модель отлично предсказала текст», то есть смешалось бы с нормальными результатами и завысило бы агрегат. Корректно вернуть бесконечность (или иное явно сигнальное значение): оценка не состоялась, данных для неё не было. Это утверждение не о качестве модели, а об отсутствии входа.'
