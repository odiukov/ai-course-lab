- concept: усреднение по токенам маскирует провал на редких, но критичных фрагментах, поскольку частые куски текста доминируют в сумме
  question: Модель показывает низкую perplexity на большом корпусе, но плохо предсказывает редкие термины предметной области. Как это уживается?
  explanation: Метрика — среднее по позициям токенов. Редкие термины занимают малую долю позиций, и их высокая неожиданность растворяется в массе шаблонного текста. Слепая зона снимается отдельным набором кейсов на критичный срез.
  kind: choice
  options:
    - Редкие термины исключаются из расчёта perplexity по определению
    - Perplexity усредняется по всем токенам, поэтому масса частых предсказуемых кусков перевешивает провалы на редких
    - 'Такое невозможно: низкая perplexity означает равномерное качество'
    - Редкие токены дают низкую perplexity, потому что их мало
