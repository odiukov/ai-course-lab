- concept: низкая perplexity совместима с провалом по следованию формату, так как метрика оценивает правдоподобие продолжения, а не выполнение требования запроса
  question: Запрос требует вернуть только номер заказа без пояснений. Модель с самой низкой perplexity выдаёт вежливый абзац с приветствием и номером внутри. Что это показывает про метрику?
  explanation: Гладкий естественный абзац как раз хорошо предсказуем и даёт низкую perplexity. Соблюдение формата, фактическую точность и качество рассуждения ловят целевые кейсы со скорерами, а perplexity остаётся быстрой проверкой вменяемости.
  kind: choice
  options:
    - Perplexity была посчитана с ошибкой в токенизации
    - Perplexity меряет правдоподобие продолжения текста и не проверяет соблюдение требований запроса
    - Perplexity применима только к моделям после инструктивной настройки
    - Низкая perplexity гарантирует формат, значит промпт был пустой
  correct: 1
