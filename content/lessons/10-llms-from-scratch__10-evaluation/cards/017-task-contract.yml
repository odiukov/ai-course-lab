- concept: порог приёмки задаётся заранее и отдельно по каждому свойству, иначе прогон eval даёт число, но не решение
  question: Зачем в определении задачи заранее записывать числовые пороги вроде «категория верна не реже чем в 95% случаев» и «выдуманный продукт реже чем в 0.5%»?
  explanation: Порог — то, что превращает измерение в решение «запускаем / не запускаем». Раздельные пороги нужны потому, что разные виды ошибок стоят по-разному, а один агрегированный порог позволяет компенсировать дорогую ошибку дешёвым успехом.
  kind: open
  reference: 'Без порога eval выдаёт балл, но не вердикт: непонятно, 87% — это годно или нет, и каждый раз решение принимается заново под давлением дедлайна. Порог — заранее выбранная граница приемлемости, а не универсальная норма; его назначает команда исходя из цены ошибки. Пороги ставят отдельно по каждому свойству, потому что цена ошибок разная: перепутанная категория дешевле выдуманного продукта, поэтому у них разные допуски, и общий средний балл их бы смешал.'
  id: 017-task-contract-3
  fingerprint: 2b8b34c3
