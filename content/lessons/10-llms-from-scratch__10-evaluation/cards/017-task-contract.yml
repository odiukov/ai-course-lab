- concept: определение задачи фиксирует схему выхода, допустимые значения полей и обязательный отказ вместо догадки при отсутствии данных
  question: 'Задача: по письму клиента вернуть продукт, категорию проблемы и тональность. Какой пункт обязательно должен быть в определении задачи, чтобы оценивание было однозначным?'
  explanation: Без закрытого списка значений «оплата» и «платежи» окажутся то верным, то неверным ответом на усмотрение проверяющего. Без явного правила отказа модель будет угадывать отсутствующий продукт, и такую догадку не с чем сравнить. Схема выхода и правило отказа — часть контракта, а не деталь реализации.
  kind: choice
  options:
    - Список допустимых значений категории и правило возвращать null, если продукт в письме не назван
    - Название модели и температура генерации
    - Максимальная длина ответа в символах
    - Стоимость одного вызова модели
  correct: 0
