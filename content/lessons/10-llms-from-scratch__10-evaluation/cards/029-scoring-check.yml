- concept: имитация судьи считает взвешенную сумму доли покрытых токенов эталона и штрафа за длину
  question: Скорер считает балл как overlap * 0.7 + length_penalty * 0.3, где overlap — доля уникальных токенов эталона, встретившихся в ответе, а length_penalty = min(1.0, длина_ответа / длина_эталона) в символах. Эталон содержит восемь уникальных токенов, ответ содержит шесть из них и по символам длиннее эталона. Какой балл вернёт скорер?
  explanation: overlap = 6/8 = 0.75, length_penalty = min(1.0, больше единицы) = 1.0. Балл = 0.75 * 0.7 + 1.0 * 0.3 = 0.525 + 0.3 = 0.825. Веса и обрезка длины — часть определения метрики, а не деталь реализации.
  kind: numeric
  answer: 0.825
  tolerance: 0.005
  id: 029-scoring-check-1
  fingerprint: 7e6a90a3
- concept: обрезка length_penalty сверху единицей означает, что скорер наказывает только слишком короткий ответ и слеп к избыточной длине
  question: В скорере length_penalty = min(1.0, длина_ответа / длина_эталона). Какое поведение из этого следует?
  explanation: 'min с единицей срезает всё, что выше эталонной длины: отношение больше единицы превращается в 1.0. Значит скорер ловит только недостаточно развёрнутые ответы, а многословие остаётся безнаказанным — тот же перекос, что и у настоящих судей.'
  kind: choice
  options:
    - Ответ вдвое длиннее эталона получит по этой составляющей максимум, штрафуется только ответ короче эталона
    - Чем длиннее ответ, тем сильнее штраф
    - Составляющая всегда равна единице и на балл не влияет
    - Ответ длиннее эталона обнуляет итоговый балл
  correct: 0
