- concept: разные скореры на одной паре ответ–эталон дают разные числа по построению, поэтому метрику фиксируют до прогона, а не выбирают по результату
  question: Одна и та же пара ответ–эталон получает у строгого сравнения строк ноль, а у скорера на пересечении токенов — заметно больше нуля. Как это трактовать?
  explanation: Ноль строгого сравнения и высокий балл частичного совпадения — не противоречие, а разные определения успеха. Если метрику подбирать после того, как увидел числа, оценка перестаёт быть проверкой и становится оправданием результата.
  kind: choice
  options:
    - Один из скореров реализован с ошибкой, нужно найти какой
    - Скореры отвечают на разные вопросы (полное совпадение строки против доли общих токенов), поэтому расхождение ожидаемо; метрика должна быть выбрана до прогона, исходя из формы выхода
    - Верным всегда считается меньший из баллов
    - Такое расхождение означает, что эталон составлен неверно
