- concept: faithfulness считается разбиением ответа на атомарные утверждения и долей подтверждённых контекстом
  question: Ответ разложен на 8 фактических утверждений. Судья нашёл подтверждение в переданном контексте для 6 из них. Чему равна faithfulness?
  explanation: 'Ответ разбивается на отдельные утверждения, каждое проверяется по контексту, балл — доля подтверждённых: 6/8 = 0.75. Разбиение и нужно затем, чтобы один непроверяемый факт в длинном ответе не растворился в общем впечатлении.'
  kind: numeric
  answer: 0.75
  tolerance: 0.01
