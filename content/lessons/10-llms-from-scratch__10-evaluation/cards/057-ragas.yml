- concept: комбинация двух оценок локализует отказ RAG между поиском и генерацией
  question: Faithfulness высокая, answer correctness низкая. Где искать причину в первую очередь?
  explanation: 'Генератор ведёт себя правильно — он опирается ровно на то, что ему дали. Значит, ошибка выше по конвейеру: извлечён не тот фрагмент, нужного текста нет в базе, либо эталон кейса неверен. Две оценки превращают вердикт «ответ плохой» в диагноз.'
  kind: choice
  options:
    - 'В генераторе: модель игнорирует переданный контекст'
    - 'В поиске, документах или самом эталоне: ответ честно следует найденному тексту, но текст не ведёт к верному результату'
    - 'В функции оценивания faithfulness: такая комбинация невозможна'
    - 'В температуре генерации: ответ слишком случайный'
