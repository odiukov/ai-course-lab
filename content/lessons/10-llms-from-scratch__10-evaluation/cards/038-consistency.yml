- concept: согласованность повторов измеряет воспроизводимость выхода, а не его правильность
  question: Один вход прогнали через модель девять раз при неизменных промпте и настройках. Все девять ответов совпали между собой, но эталону не соответствуют. Что показывает такое измерение?
  explanation: Согласованность отвечает на вопрос «повторяется ли выход», качество — на вопрос «верен ли он». Стабильно воспроизводимая ошибка даёт максимум по первой величине и ноль по второй, поэтому согласованность считают рядом со скорерами качества, а не вместо них.
  kind: choice
  options:
    - Высокую согласованность при нулевом качестве
    - 'Ошибку в процедуре измерения: при совпадении ответов качество не может быть низким'
    - Низкую согласованность, раз ответ неверен
    - Что порог приёмки выбран неудачно
  correct: 0
  id: 038-consistency-1
  fingerprint: e96e23a2
- concept: расчёт согласованности как доли повторов, совпавших с самым частым выходом
  question: 'Один вход прогнали девять раз при неизменных настройках. Получили: «оплата» — шесть раз, «другое» — два раза, «доставка» — один раз. Чему равна согласованность (доля повторов, совпавших с самым частым ответом)?'
  explanation: 'Самый частый выход — «оплата», он встретился в шести повторах из девяти: 6 / 9 ≈ 0,67. Остальные варианты в числитель не идут: измеряется, насколько устойчиво модель воспроизводит своё же типичное решение.'
  kind: numeric
  answer: 0.67
  tolerance: 0.02
  id: 038-consistency-2
  fingerprint: 0d1bbb00
- concept: при низкой согласованности балл одного прогона не характеризует систему
  question: Объясни своими словами, почему при низкой согласованности на детерминированных входах нельзя опираться на балл, полученный в одном прогоне eval.
  explanation: 'Согласованность задаёт нижнюю границу доверия к любому баллу: при разбросе выходов повторный прогон даст другую цифру. Поэтому сохраняют все сырые ответы повторов — итоговая доля не показывает, как именно модель колебалась.'
  kind: open
  reference: 'Если один и тот же вход при неизменных промпте, модели и настройках даёт разные выходы, то оценка кейса зависит от того, какой именно выход выпал в этом прогоне. Балл становится случайной величиной: следующий прогон того же набора даст другое число без всяких изменений в системе. Поэтому одиночный балл описывает конкретный прогон, а не систему, и сравнивать по нему версии бессмысленно, пока разброс между повторами не измерен и не уменьшен (например, снижением temperature или уточнением инструкции). Разные ответы там, где вход предполагает один устойчивый результат — категорию, число, идентификатор, — прямо указывают на хрупкий промпт или лишнюю случайность в декодировании.'
  id: 038-consistency-3
  fingerprint: e07ef0a9
