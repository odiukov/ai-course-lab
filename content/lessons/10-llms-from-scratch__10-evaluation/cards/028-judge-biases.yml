- concept: процедура нейтрализации позиционного смещения при попарном сравнении судьёй
  question: Модель-судья выбирает лучший из двух ответов. Расставь шаги процедуры, которая отделяет реальное превосходство ответа от предпочтения позиции.
  explanation: 'Позиционное смещение — устойчивая склонность судьи к первому варианту. Один прогон её не выявляет: вердикт неотличим от честной победы. Только повторный прогон с переставленными ответами показывает, к чему привязан выбор — к содержанию или к месту. Совпадение вердиктов в обоих порядках подтверждает победителя, расхождение означает, что данных для решения нет.'
  kind: order
  items:
    - Прогнать пару через судью в порядке A–B
    - Прогнать ту же пару в обратном порядке B–A
    - Сравнить два вердикта между собой
    - При расхождении вердиктов зафиксировать ничью или отправить случай на дополнительную проверку
  id: 028-judge-biases-1
  fingerprint: ff849b79
- concept: 'смещение к многословности: судья принимает объём текста за качество, лечится выравниванием условий по длине и раздельной оценкой краткости'
  question: К ответу модели добавили вежливые повторы и вводные абзацы. Новых фактов не появилось, но балл судьи вырос. Какой вывод и какая мера корректны?
  explanation: 'Рост балла при неизменном фактическом содержании — систематический перекос, а не разброс, поэтому усреднение прогонов его не убирает. Механическое деление на число слов — не нормировка, а новая порча шкалы: оно начинает штрафовать полные ответы. Работает выравнивание условий (единый предел длины) плюс разнесение свойств по отдельным критериям, чтобы лишние абзацы не могли изображать дополнительное качество.'
  kind: choice
  options:
    - Это смещение к многословности; надо задать моделям одинаковый предел длины ответа и оценивать релевантность и краткость отдельными критериями
    - Это случайный шум судьи; надо усреднить балл по нескольким прогонам того же промпта
    - 'Судья прав: расширенный ответ действительно полезнее, менять ничего не нужно'
    - Надо механически делить итоговый балл на число слов ответа
  correct: 0
  id: 028-judge-biases-2
  fingerprint: 85c08d75
- concept: 'самопредпочтение: судья завышает оценки выходам своего семейства моделей, поэтому судью берут из чужого семейства'
  question: Выходы модели семейства GPT оцениваются судьёй того же семейства. Почему такая схема портит сравнение и чем её заменяют?
  explanation: 'Самопредпочтение — задокументированный сценарий отказа: модель ставит собственным (и родственным) выходам более высокие баллы, чем равноценным выходам чужого семейства. Дело не в скорости и не в формате. Лечение — сменить семейство судьи, чтобы вердикт меньше зависел от знакомости стиля.'
  kind: choice
  options:
    - Судья завышает оценки выходам родственной модели (самопредпочтение); судью берут из другого семейства — например, ответы GPT оценивает Claude
    - Судья одного семейства работает медленнее, поэтому берут более быструю модель
    - Судья одного семейства не умеет читать чужой формат разметки, поэтому нужен универсальный парсер
    - 'Проблемы нет: знакомый «почерк» помогает судье точнее распознать ошибку'
  correct: 0
  id: 028-judge-biases-3
