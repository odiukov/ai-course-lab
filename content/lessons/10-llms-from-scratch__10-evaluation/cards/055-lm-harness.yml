- concept: воспроизводимость прогона обеспечивается сохранением условий эксперимента вместе с числом
  question: 'Ты сохранил только строку «MMLU: 82%». Объясни своими словами, почему этого недостаточно, чтобы через полгода повторить прогон и сравнить результаты.'
  explanation: Harness делает прогон стандартизированным, но условия выбираешь ты. Сохранённый конфиг превращает команду в повторяемый эксперимент; сохранённые результаты по отдельным примерам позволяют потом расследовать скачок, а не гадать о нём.
  kind: open
  reference: Число без условий не задаёт эксперимент. Для повтора нужны версия harness, точная ревизия модели, список задач, число few-shot-примеров, seed, параметры генерации и исходный конфиг запуска. Любое из этих условий меняет балл при том же датасете, поэтому повторный прогон без них даёт другое число, и разницу нельзя приписать ни модели, ни правке.
  id: 055-lm-harness-3
  fingerprint: 3ca16915
