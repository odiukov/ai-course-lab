- concept: 'закон Гудхарта: показатель перестаёт быть мерой, когда становится целью оптимизации'
  question: 'Показатель качества модели превратили в цель: за его рост награждают команду. Что предсказывает закон Гудхарта?'
  explanation: Мера покрывает лишь узкий, удобный для подсчёта фрагмент цели. Когда за неё награждают, дешевле оптимизировать сам фрагмент — формат заданий, распределение ответов, критерии проверки, — чем всю цель. Цифра растёт, нужное качество может стоять на месте.
  kind: choice
  options:
    - Показатель станет расти вместе с реальным качеством, потому что цель и мера теперь совпадают
    - Показатель перестанет расти, потому что оптимизация упрётся в потолок
    - Показатель продолжит расти, но его связь с реальным качеством ослабнет
  correct: 2
  id: 002-goodhart-1
  fingerprint: c28fb699
- concept: 'teaching to the test: обучение под формат бенчмарка даёт балл без соответствующей способности'
  question: В обучающую смесь добавили большую долю вопросов с выбором ответа в стиле MMLU. Балл на MMLU вырос. Какое объяснение роста наиболее вероятно и наименее лестно для модели?
  explanation: 'Это teaching to the test. Формат с фиксированным числом вариантов и примерно равномерным распределением правильных ответов сам по себе даёт выигрыш: модель угадывает лучше случайного, не приобретя знаний. Перенос на открытые задачи из такого прироста не следует.'
  kind: choice
  options:
    - Модель усвоила формат и распределение вариантов ответа, что помогает даже при незнании предмета
    - Модель выучила больше фактов о мире и потому отвечает точнее
    - Модель стала лучше рассуждать в открытом диалоге
  correct: 0
  id: 002-goodhart-2
  fingerprint: '44115180'
- concept: 'загрязнение данных: вопросы бенчмарка попадают в обучающий корпус при сборе из интернета'
  question: Почему рост балла на популярном публичном бенчмарке может ничего не говорить о способностях модели, даже если лаборатория честно не подкладывала тестовые данные в обучение?
  explanation: 'Загрязнение — механизм, отдельный от подгонки под формат: здесь модель могла запомнить конкретные ответы. Отсюда практический вывод — доверять закрытому, собственному набору, которого нет в сети.'
  kind: open
  reference: 'Обучающие корпуса выкачивают интернет целиком, а вопросы и ответы популярных бенчмарков давно опубликованы в интернете — в статьях, репозиториях, обсуждениях. Модель видит их во время обучения и на замере частично воспроизводит запомненное, а не решает задачу. Это data contamination: не жульничество, а неизбежное следствие сбора данных в масштабе всей сети. Поэтому балл смещён вверх, и для приватных или свежих задач он не воспроизводится.'
  id: 002-goodhart-3
  fingerprint: 87a6bf28
