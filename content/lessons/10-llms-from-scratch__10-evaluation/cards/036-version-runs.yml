- concept: модель фиксируется конкретным именем снимка версии, а не названием семейства
  question: В карточке прогона записано только название семейства модели без конкретной версии. Чем это грозит через несколько месяцев?
  explanation: Провайдер обновляет модель за прежним алиасом молча. Без записанного снимка версии повторный запуск даёт другое поведение, и непонятно, изменился ли ваш код или под вами поменяли модель.
