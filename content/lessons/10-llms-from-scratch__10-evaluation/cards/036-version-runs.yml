- concept: прогон сохраняет покейсовые ответы и оценки, потому что из агрегата нельзя восстановить, какие кейсы деградировали
  question: 'От каждого прогона хранят только сводку: среднее, медиану и долю прохождения. Что становится невозможно после падения качества?'
  explanation: 'Агрегат — односторонняя свёртка: из среднего не восстановить отдельные оценки и тем более тексты ответов. Для разбора регрессии нужен покейсовый журнал прогона: вход, предсказание и оценки каждого кейса.'
