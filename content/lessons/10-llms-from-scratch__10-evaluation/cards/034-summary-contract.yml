- concept: медиана устойчива к части провалов, среднее тянется за ними
  question: 'Прогон дал шесть оценок: 1,0; 1,0; 1,0; 1,0; 0,0; 0,0. Чему равно среднее?'
  explanation: '4 / 6 ≈ 0,667, при этом медиана равна 1,0. Расхождение среднего и медианы указывает на перекос: типичный результат отличный, но есть группа полных провалов, которую видно только по среднему.'
  kind: numeric
  answer: 0.667
  tolerance: 0.01
  id: 034-summary-contract-1
  fingerprint: 02b15ff4
- concept: std описывает типичное отклонение оценок, а диапазон min–max — только крайние значения без их частоты
  question: У двух прогонов одинаковые среднее и одинаковый диапазон от min до max, но у первого стандартное отклонение вдвое больше. Что это означает?
  explanation: 'Диапазон определяют два числа и он ничего не говорит о частоте: один выброс растягивает его так же, как половина набора. Стандартное отклонение учитывает все оценки и показывает кучность — насколько поведение модели стабильно.'
  kind: choice
  options:
    - У первого прогона оценки чаще уходят далеко от среднего, у второго они плотно собраны, а крайние значения единичны
    - У первого прогона больше кейсов
    - У второго прогона выше медиана
    - Первый прогон использовал более строгий скорер
  correct: 0
