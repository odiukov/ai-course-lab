- concept: число оценённых кейсов определяет, насколько сводке можно верить
  question: Почему в сводке обязательно сохранять n — количество оценок, попавших в расчёт?
  explanation: 'Среднее без размера выборки не интерпретируется: на 6 кейсах разница в несколько процентных пунктов — это один-два примера. Медиана и доля прохождения вычисляются и без явного n, но доверие к ним задаёт именно объём.'
  kind: choice
  options:
    - Одно и то же среднее по 6 и по 600 кейсам поддерживает разные по силе выводы
    - Без n нельзя вычислить медиану
    - n нужно, чтобы привести оценки разных метрик к общей шкале
    - Без n доля прохождения считается неправильно
  correct: 0
