<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Порядок решений гибридного селектора</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: snow;
      --ink: midnightblue;
      --muted: slategray;
      --border: lightsteelblue;
      --panel: aliceblue;
      --chip: white;
      --role: lavender;
      --relevance: honeydew;
      --limit: lightyellow;
      --result: white;
      --fallback: mistyrose;
      --accent: royalblue;
      --warning: darkorange;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: midnightblue;
        --ink: white;
        --muted: lightgray;
        --border: slategray;
        --panel: darkslateblue;
        --chip: slategray;
        --role: rebeccapurple;
        --relevance: darkgreen;
        --limit: darkgoldenrod;
        --result: darkslategray;
        --fallback: maroon;
        --accent: lightskyblue;
        --warning: orange;
      }
    }

    html,
    body {
      margin: unset;
      padding: unset;
      background: var(--page);
    }

    .frame {
      box-sizing: border-box;
      width: 100%;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--page);
      color: var(--ink);
    }

    h1 {
      margin: unset;
      font-family: system-ui, sans-serif;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      color: var(--ink);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 455px;
      background: var(--page);
      font-family: system-ui, sans-serif;
    }

    .panel,
    .chip,
    .decision,
    .result,
    .fallback,
    .exclude {
      stroke: var(--border);
      stroke-width: 2px;
    }

    .panel {
      fill: var(--panel);
    }

    .chip {
      fill: var(--chip);
    }

    .role {
      fill: var(--role);
    }

    .relevance {
      fill: var(--relevance);
    }

    .limit {
      fill: var(--limit);
    }

    .result {
      fill: var(--result);
    }

    .fallback {
      fill: var(--fallback);
      stroke: var(--warning);
    }

    .exclude {
      fill: var(--fallback);
      stroke: var(--warning);
    }

    .edge {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arrowhead {
      fill: var(--accent);
      stroke: var(--accent);
      stroke-width: 1px;
    }

    .label {
      fill: var(--ink);
      font-size: 14px;
    }

    .small {
      fill: var(--ink);
      font-size: 12px;
    }

    .eyebrow {
      fill: var(--muted);
      font-size: 11px;
      font-weight: bold;
    }

    .branch {
      fill: var(--accent);
      font-size: 12px;
      font-weight: bold;
    }

    .warning-text {
      fill: var(--warning);
      font-size: 12px;
      font-weight: bold;
    }

    .strong {
      font-weight: bold;
    }

    .error {
      fill: var(--ink);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="frame">
    <h1>Порядок решений гибридного селектора</h1>
    <svg id="diagram"
         viewBox="0 0 1200 455"
         width="1200"
         height="455"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="svg-description">
      <desc id="svg-description">Каскад выбора: обязательное правило роли, релевантность сообщения, ограничение числа ходов и детерминированный round-robin.</desc>
    </svg>
  </main>

  <script>
    const diagramData = [
      {
        kind: "config",
        zero: 0,
        originX: 0,
        originY: 0,
        scaleX: 10,
        scaleY: 10,
        lineGap: 1.65,
        errorX: 5,
        errorY: 18,
        errorGap: 2.4
      },

      { kind: "rect", className: "panel", x: 2, y: 9, w: 16.5, h: 22, r: 1.2 },
      { kind: "rect", className: "chip", x: 3.2, y: 13, w: 14.1, h: 4.2, r: 0.8 },
      { kind: "rect", className: "chip", x: 3.2, y: 19, w: 14.1, h: 4.2, r: 0.8 },
      { kind: "rect", className: "chip", x: 3.2, y: 25, w: 14.1, h: 4.2, r: 0.8 },

      {
        kind: "arrow",
        points: [{ x: 18.5, y: 20 }, { x: 22, y: 20 }],
        head: [{ x: 22, y: 20 }, { x: 21.1, y: 19.45 }, { x: 21.1, y: 20.55 }]
      },
      {
        kind: "arrow",
        points: [{ x: 40, y: 20 }, { x: 44.5, y: 20 }],
        head: [{ x: 44.5, y: 20 }, { x: 43.6, y: 19.45 }, { x: 43.6, y: 20.55 }]
      },
      {
        kind: "arrow",
        points: [{ x: 65.5, y: 20 }, { x: 70.5, y: 20 }],
        head: [{ x: 70.5, y: 20 }, { x: 69.6, y: 19.45 }, { x: 69.6, y: 20.55 }]
      },
      {
        kind: "arrow",
        points: [{ x: 91.5, y: 20 }, { x: 96, y: 20 }],
        head: [{ x: 96, y: 20 }, { x: 95.1, y: 19.45 }, { x: 95.1, y: 20.55 }]
      },
      {
        kind: "arrow",
        points: [{ x: 31, y: 26.5 }, { x: 31, y: 33.5 }],
        head: [{ x: 31, y: 33.5 }, { x: 30.45, y: 32.6 }, { x: 31.55, y: 32.6 }]
      },
      {
        kind: "arrow",
        points: [{ x: 55, y: 26.5 }, { x: 55, y: 35 }],
        head: [{ x: 55, y: 35 }, { x: 54.45, y: 34.1 }, { x: 55.55, y: 34.1 }]
      },
      {
        kind: "arrow",
        points: [{ x: 81, y: 26.5 }, { x: 81, y: 30.5 }],
        head: [{ x: 81, y: 30.5 }, { x: 80.45, y: 29.6 }, { x: 81.55, y: 29.6 }]
      },
      {
        kind: "arrow",
        points: [
          { x: 72, y: 34 },
          { x: 68, y: 34 },
          { x: 68, y: 29 },
          { x: 62, y: 29 },
          { x: 59.4, y: 25.4 }
        ],
        head: [
          { x: 59.4, y: 25.4 },
          { x: 60.35, y: 25.75 },
          { x: 59.55, y: 26.35 }
        ]
      },

      { kind: "diamond", className: "decision role", cx: 31, cy: 20, hx: 9, hy: 6.5 },
      { kind: "diamond", className: "decision relevance", cx: 55, cy: 20, hx: 10.5, hy: 6.5 },
      { kind: "diamond", className: "decision limit", cx: 81, cy: 20, hx: 10.5, hy: 6.5 },

      { kind: "rect", className: "result", x: 20.5, y: 33.5, w: 21, h: 7.5, r: 1.2 },
      { kind: "rect", className: "fallback", x: 45, y: 35, w: 20, h: 8, r: 1.2 },
      { kind: "rect", className: "exclude", x: 72, y: 30.5, w: 19, h: 7, r: 1.2 },
      { kind: "rect", className: "result", x: 96, y: 15.5, w: 22, h: 9, r: 1.2 },

      {
        kind: "text",
        className: "eyebrow",
        x: 10.25,
        y: 11.4,
        anchor: "middle",
        lines: ["ВХОДЫ СЕЛЕКТОРА"]
      },
      {
        kind: "text",
        className: "small",
        x: 10.25,
        y: 15.7,
        anchor: "middle",
        lines: ["свежее сообщение"]
      },
      {
        kind: "text",
        className: "small",
        x: 10.25,
        y: 21.7,
        anchor: "middle",
        lines: ["специализации агентов"]
      },
      {
        kind: "text",
        className: "small",
        x: 10.25,
        y: 27.7,
        anchor: "middle",
        lines: ["счётчики ходов"]
      },

      {
        kind: "text",
        className: "eyebrow",
        x: 31,
        y: 8.2,
        anchor: "middle",
        lines: ["СНАЧАЛА: РОЛЬ"]
      },
      {
        kind: "text",
        className: "label",
        x: 31,
        y: 18.5,
        anchor: "middle",
        lines: ["Есть обязательное", "правило роли?"]
      },

      {
        kind: "text",
        className: "eyebrow",
        x: 55,
        y: 8.2,
        anchor: "middle",
        lines: ["ЗАТЕМ: РЕЛЕВАНТНОСТЬ"]
      },
      {
        kind: "text",
        className: "label",
        x: 55,
        y: 17.7,
        anchor: "middle",
        lines: ["Кто лучше подходит", "свежему сообщению?"]
      },

      {
        kind: "text",
        className: "eyebrow",
        x: 81,
        y: 8.2,
        anchor: "middle",
        lines: ["ПОТОМ: ЛИМИТ ХОДОВ"]
      },
      {
        kind: "text",
        className: "label",
        x: 81,
        y: 16.9,
        anchor: "middle",
        lines: ["Кандидат говорил", "3 раза подряд?"]
      },

      {
        kind: "text",
        className: "branch",
        x: 42.25,
        y: 18.1,
        anchor: "middle",
        lines: ["нет"]
      },
      {
        kind: "text",
        className: "branch",
        x: 68,
        y: 18.1,
        anchor: "middle",
        lines: ["есть лидер"]
      },
      {
        kind: "text",
        className: "branch",
        x: 93.7,
        y: 18.1,
        anchor: "middle",
        lines: ["нет"]
      },
      {
        kind: "text",
        className: "branch",
        x: 32.2,
        y: 29.7,
        anchor: "start",
        lines: ["да"]
      },
      {
        kind: "text",
        className: "branch",
        x: 56.2,
        y: 29.1,
        anchor: "start",
        lines: ["нет сигнала", "или равенство"]
      },
      {
        kind: "text",
        className: "warning-text",
        x: 82.2,
        y: 28.5,
        anchor: "start",
        lines: ["да"]
      },

      {
        kind: "text",
        className: "small strong",
        x: 31,
        y: 36.6,
        anchor: "middle",
        lines: ["Выбрать назначенную", "роль"]
      },
      {
        kind: "text",
        className: "eyebrow",
        x: 55,
        y: 37.6,
        anchor: "middle",
        lines: ["ЗАПАСНОЙ ВЫБОР"]
      },
      {
        kind: "text",
        className: "small strong",
        x: 55,
        y: 40.2,
        anchor: "middle",
        lines: ["Round-robin", "среди доступных"]
      },
      {
        kind: "text",
        className: "warning-text",
        x: 81.5,
        y: 33.4,
        anchor: "middle",
        lines: ["Исключить hot speaker"]
      },
      {
        kind: "text",
        className: "small",
        x: 81.5,
        y: 35.7,
        anchor: "middle",
        lines: ["сравнить оставшихся"]
      },
      {
        kind: "text",
        className: "small strong",
        x: 107,
        y: 18.7,
        anchor: "middle",
        lines: ["Выбрать релевантного", "специалиста"]
      },
      {
        kind: "text",
        className: "eyebrow",
        x: 107,
        y: 27.4,
        anchor: "middle",
        lines: ["ВЫСОКАЯ РЕЛЕВАНТНОСТЬ", "НЕ ОТМЕНЯЕТ ЛИМИТ"]
      }
    ];

    const config = diagramData.find(item => item.kind === "config");
    const origin = Object.freeze({ x: config.originX, y: config.originY });
    const scale = Object.freeze({ x: config.scaleX, y: config.scaleY });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const namespace = "http://www.w3.org/2000/svg";

      const make = tag => document.createElementNS(namespace, tag);

      const appendRect = item => {
        const element = make("rect");
        element.setAttribute("x", sx(item.x));
        element.setAttribute("y", sy(item.y));
        element.setAttribute("width", sx(item.x + item.w) - sx(item.x));
        element.setAttribute("height", sy(item.y + item.h) - sy(item.y));
        element.setAttribute("rx", sx(item.r) - sx(config.zero));
        element.setAttribute("ry", sy(item.r) - sy(config.zero));
        element.setAttribute("class", item.className);
        svg.appendChild(element);
      };

      const appendDiamond = item => {
        const element = make("polygon");
        const points = [
          { x: item.cx, y: item.cy - item.hy },
          { x: item.cx + item.hx, y: item.cy },
          { x: item.cx, y: item.cy + item.hy },
          { x: item.cx - item.hx, y: item.cy }
        ];
        element.setAttribute(
          "points",
          points.map(point => sx(point.x) + "," + sy(point.y)).join(" ")
        );
        element.setAttribute("class", item.className);
        svg.appendChild(element);
      };

      const appendArrow = item => {
        const line = make("polyline");
        line.setAttribute(
          "points",
          item.points.map(point => sx(point.x) + "," + sy(point.y)).join(" ")
        );
        line.setAttribute("class", "edge");
        svg.appendChild(line);

        const head = make("polygon");
        head.setAttribute(
          "points",
          item.head.map(point => sx(point.x) + "," + sy(point.y)).join(" ")
        );
        head.setAttribute("class", "arrowhead");
        svg.appendChild(head);
      };

      const appendText = item => {
        const element = make("text");
        element.setAttribute("class", item.className);
        element.setAttribute("text-anchor", item.anchor);
        item.lines.forEach((line, index) => {
          const span = make("tspan");
          span.setAttribute("x", sx(item.x));
          span.setAttribute("y", sy(item.y + index * config.lineGap));
          span.textContent = line;
          element.appendChild(span);
        });
        svg.appendChild(element);
      };

      diagramData.forEach(item => {
        if (item.kind === "rect") appendRect(item);
        if (item.kind === "arrow") appendArrow(item);
        if (item.kind === "diamond") appendDiamond(item);
        if (item.kind === "text") appendText(item);
      });
    } catch (error) {
      const svg = document.getElementById("diagram");
      svg.replaceChildren();

      [
        "Схема должна была показать каскад выбора:",
        "обязательное правило роли → релевантность сообщения →",
        "ограничение числа ходов → детерминированный round-robin."
      ].forEach((line, index) => {
        const element = document.createElementNS("http://www.w3.org/2000/svg", "text");
        element.setAttribute("x", sx(config.errorX));
        element.setAttribute("y", sy(config.errorY + index * config.errorGap));
        element.setAttribute("class", "error");
        element.textContent = line;
        svg.appendChild(element);
      });
    }
  </script>
</body>
</html>
