- concept: условие остановки проверяется после создания и сохранения новой реплики
  question: Расположите события одного оборота группового чата в правильном порядке.
  explanation: 'Проверка выполняется после сохранения реплики: тогда финальное сообщение остаётся в стенограмме, а при остановке селектор не назначает лишний ход.'
  kind: order
  items:
    - Селектор выбирает агента по текущему состоянию
    - Выбранный агент создаёт реплику
    - Реплика сохраняется, а счётчики обновляются
    - Условие завершения проверяет результат хода
