<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Замкнутый цикл обучения splat-сцены</title>
<style>
:root{
  --bg:#f7f9fc;
  --panel:#ffffff;
  --panel-soft:#eef3f9;
  --text:#182235;
  --muted:#607089;
  --line:#6f819a;
  --accent:#5b5ce2;
  --accent-soft:#e8e8ff;
  --cyan:#168aa3;
  --cyan-soft:#def5f8;
  --green:#25856a;
  --green-soft:#dff4eb;
  --orange:#b46221;
  --orange-soft:#fff0df;
  --red:#e34b55;
  --red-soft:#ffccd0;
  --blue:#3478df;
  --blue-soft:#cfe1ff;
  --grid:#d5dde8;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111722;
    --panel:#192231;
    --panel-soft:#202c3e;
    --text:#eef3fb;
    --muted:#a8b5c8;
    --line:#8798b0;
    --accent:#a7a8ff;
    --accent-soft:#30315e;
    --cyan:#71d5e7;
    --cyan-soft:#173e48;
    --green:#70d4b4;
    --green-soft:#173c32;
    --orange:#ffb36f;
    --orange-soft:#49301f;
    --red:#ff7079;
    --red-soft:#642f37;
    --blue:#70a6ff;
    --blue-soft:#273f68;
    --grid:#344156;
  }
}
html,body{background:var(--bg);color:var(--text)}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
svg{
  display:block;
  width:100%;
  height:auto;
  max-height:520px;
  background:var(--bg);
  shape-rendering:geometricPrecision;
}
.title{font-size:24px;font-weight:bold;fill:var(--text)}
.subtitle{font-size:14px;fill:var(--muted)}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.8px}
.param{fill:var(--cyan-soft);stroke:var(--cyan)}
.loss{fill:var(--orange-soft);stroke:var(--orange)}
.back{fill:var(--accent-soft);stroke:var(--accent)}
.update{fill:var(--green-soft);stroke:var(--green)}
.frame{fill:var(--panel-soft);stroke:var(--line);stroke-width:1.4px}
.pill{fill:var(--panel);stroke:var(--cyan);stroke-width:1.3px}
.stage{fill:var(--panel);stroke:var(--accent);stroke-width:1.2px}
.bar{fill:var(--orange);stroke:none}
.grid{fill:none;stroke:var(--grid);stroke-width:1px}
.flow{fill:none;stroke:var(--line);stroke-width:2.4px;stroke-linecap:round;stroke-linejoin:round}
.loop{stroke:var(--green)}
.arrowhead{fill:var(--line);stroke:none}
.loophead{fill:var(--green)}
.panel-title{font-size:13px;font-weight:bold;fill:var(--muted)}
.formula{font-size:20px;font-weight:bold;fill:var(--text)}
.body{font-size:13px;fill:var(--text)}
.small{font-size:12px;fill:var(--muted)}
.stage-text{font-size:12px;fill:var(--text)}
.arrow-label{
  font-size:13px;
  font-weight:bold;
  fill:var(--muted);
  stroke:var(--bg);
  stroke-width:4px;
  paint-order:stroke;
}
.loop-label{fill:var(--green)}
.red{fill:var(--red);stroke:var(--red);stroke-width:1.2px}
.red-soft{fill:var(--red-soft);stroke:var(--red);stroke-width:1.2px}
.blue{fill:var(--blue);stroke:var(--blue);stroke-width:1.2px}
.blue-soft{fill:var(--blue-soft);stroke:var(--blue);stroke-width:1.2px}
.splat-a{fill:var(--red-soft);stroke:var(--red);stroke-width:1.5px}
.splat-b{fill:var(--blue-soft);stroke:var(--blue);stroke-width:1.5px}
.splat-c{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5px}
.fallback{display:none;font-size:18px;fill:var(--text)}
.fallback.show{display:block}
</style>
</head>
<body>
<svg id="diagram" width="1180" height="500" viewBox="0 0 1180 500"
     preserveAspectRatio="xMidYMid meet" role="img"
     aria-labelledby="static-title">
  <text id="static-title" class="title">Замкнутый цикл обучения splat-сцены</text>
  <text id="fallback" class="fallback">Схема: параметры 64 гауссиан → рендер 64×64 → MSE → backward → обновление, цикл 200 шагов.</text>
  <g id="layer"></g>
</svg>
<script>
const data=[
  {
    origin:{x:0,y:0},scale:10,z:0,r:1.25,head:1.15,wing:.68,
    title:{x:59,y:3.4},fallback:{x:59,y:25}
  },

  ["x",59,6.2,"рендер → ошибка → градиенты → новая сцена","subtitle","middle"],

  ["r",3,9,23,20,"panel param"],
  ["x",14.5,11.7,"ПАРАМЕТРЫ 64 ГАУССИАН","panel-title","middle"],
  ["r",5,14,3.2,3.2,"pill",.8],
  ["x",6.6,16.25,"μ","formula","middle"],
  ["r",9,14,3.2,3.2,"pill",.8],
  ["x",10.6,16.25,"q","formula","middle"],
  ["r",13,14,3.2,3.2,"pill",.8],
  ["x",14.6,16.25,"s","formula","middle"],
  ["r",17,14,3.2,3.2,"pill",.8],
  ["x",18.6,16.25,"α","formula","middle"],
  ["r",21,14,3.3,3.2,"pill",.8],
  ["x",22.65,16.25,"cₗₘ","body","middle"],
  ["e",7.3,23.1,2.5,1.4,"splat-a"],
  ["e",14.2,22.7,1.5,2.6,"splat-b"],
  ["e",21,23.2,2.3,1.8,"splat-c"],
  ["x",14.5,27.4,"положение · форма · цвет","small","middle"],

  ["r",31,9,21,20,"panel"],
  ["x",41.5,11.7,"ТЕКУЩИЙ РЕНДЕР","panel-title","middle"],
  ["r",34,13.2,15,11.6,"frame",.8],
  ["l",[[39,13.2],[39,24.8]],"grid"],
  ["l",[[44,13.2],[44,24.8]],"grid"],
  ["l",[[34,17.1],[49,17.1]],"grid"],
  ["l",[[34,21],[49,21]],"grid"],
  ["e",39.2,18.1,2.8,2.5,"red-soft"],
  ["r",42.1,19.5,4.3,4.3,"blue-soft",.3],
  ["x",41.5,27.5,"рендер 64×64","body","middle"],

  ["r",57,9,27,20,"panel loss"],
  ["x",70.5,11.7,"MSE ПО ПИКСЕЛЯМ","panel-title","middle"],
  ["r",59.3,13.4,9.4,10.7,"frame",.7],
  ["e",62.8,17.2,1.9,1.9,"red"],
  ["r",64.2,19,3.1,3.1,"blue",.25],
  ["x",64,26.7,"эталон","small","middle"],
  ["x",70.6,19.3,"↔","formula","middle"],
  ["r",72.5,13.4,9.4,10.7,"frame",.7],
  ["e",76.1,17.8,2.6,2.3,"red-soft"],
  ["r",76.9,19.4,3.8,3.8,"blue-soft",.25],
  ["x",77.2,26.7,"рендер","small","middle"],
  ["r",68.4,27.2,4.2,.65,"bar",.3],
  ["x",70.5,28.5,"разница","small","middle"],

  ["r",89,9,26,20,"panel back"],
  ["x",102,11.7,"BACKWARD","panel-title","middle"],
  ["r",91.5,13.5,21,2.7,"stage",.65],
  ["x",102,15.35,"цвет cₗₘ","stage-text","middle"],
  ["r",91.5,16.8,21,2.7,"stage",.65],
  ["x",102,18.65,"α-композитинг","stage-text","middle"],
  ["r",91.5,20.1,21,2.7,"stage",.65],
  ["x",102,21.95,"раскладка по тайлам","stage-text","middle"],
  ["r",91.5,23.4,21,2.7,"stage",.65],
  ["x",102,25.25,"проекция","stage-text","middle"],
  ["x",102,27.9,"градиенты к параметрам","small","middle"],

  ["r",39,35,40,9,"panel update"],
  ["x",59,37.6,"ОБНОВЛЕНИЕ ПАРАМЕТРОВ","panel-title","middle"],
  ["x",59,40.8,"μ · q · s · α · cₗₘ","formula","middle"],
  ["x",59,43,"маленький шаг по градиенту","small","middle"],

  ["a",[[26,19],[31,19]],"рендер",28.5,17.1,"middle","flow","arrowhead"],
  ["a",[[52,19],[57,19]],"пиксели",54.5,17.1,"middle","flow","arrowhead"],
  ["a",[[84,19],[89,19]],"ошибка",86.5,17.1,"middle","flow","arrowhead"],
  ["a",[[102,29],[102,32],[74,32],[74,35]],"backward",97.5,31.1,"end","flow","arrowhead"],
  ["a",[[39,39.5],[24,39.5],[24,48],[14.5,48],[14.5,29]],"цикл · 200 шагов",35.5,47.1,"end","flow loop","arrowhead loophead"]
];

const [cfg,...marks]=data;
const origin=Object.freeze(cfg.origin);
const scale=cfg.scale;
const sx=x=>origin.x+x*scale;
const sy=y=>origin.y+y*scale;

const svg=document.getElementById("diagram");
const layer=document.getElementById("layer");
const title=document.getElementById("static-title");
const fallback=document.getElementById("fallback");

const element=(tag,attrs,content)=>{
  const node=document.createElementNS(svg.namespaceURI,tag);
  for(const [name,value] of Object.entries(attrs)) node.setAttribute(name,value);
  if(content!==undefined) node.textContent=content;
  layer.appendChild(node);
  return node;
};

const pointsValue=points=>points.map(([x,y])=>`${sx(x)},${sy(y)}`).join(" ");

const arrow=(points,label,lx,ly,anchor,lineClass,headClass)=>{
  element("polyline",{points:pointsValue(points),class:lineClass});
  const [end,previous]=[...points].reverse();
  const [ex,ey]=end;
  const [px,py]=previous;
  const dx=ex-px;
  const dy=ey-py;
  const length=Math.hypot(dx,dy);
  const bx=ex-dx/length*cfg.head;
  const by=ey-dy/length*cfg.head;
  const nx=-dy/length*cfg.wing;
  const ny=dx/length*cfg.wing;
  const head=[[ex,ey],[bx+nx,by+ny],[bx-nx,by-ny]];
  element("polygon",{points:pointsValue(head),class:headClass});
  element("text",{x:sx(lx),y:sy(ly),"text-anchor":anchor,class:`arrow-label ${lineClass.includes("loop")?"loop-label":""}`},label);
};

try{
  title.setAttribute("x",sx(cfg.title.x));
  title.setAttribute("y",sy(cfg.title.y));
  title.setAttribute("text-anchor","middle");

  for(const mark of marks){
    const [type,...v]=mark;

    if(type==="r"){
      const [x,y,w,h,css,radius=cfg.r]=v;
      element("rect",{
        x:sx(x),y:sy(y),
        width:sx(w)-sx(cfg.z),
        height:sy(h)-sy(cfg.z),
        rx:sx(radius)-sx(cfg.z),
        ry:sy(radius)-sy(cfg.z),
        class:css
      });
    }

    if(type==="e"){
      const [cx,cy,rx,ry,css]=v;
      element("ellipse",{
        cx:sx(cx),cy:sy(cy),
        rx:sx(rx)-sx(cfg.z),
        ry:sy(ry)-sy(cfg.z),
        class:css
      });
    }

    if(type==="l"){
      const [points,css]=v;
      element("polyline",{points:pointsValue(points),class:css});
    }

    if(type==="x"){
      const [x,y,content,css,anchor]=v;
      element("text",{x:sx(x),y:sy(y),"text-anchor":anchor,class:css},content);
    }

    if(type==="a") arrow(...v);
  }
}catch(error){
  while(layer.firstChild) layer.removeChild(layer.firstChild);
  title.setAttribute("x",sx(cfg.title.x));
  title.setAttribute("y",sy(cfg.title.y));
  title.setAttribute("text-anchor","middle");
  fallback.setAttribute("x",sx(cfg.fallback.x));
  fallback.setAttribute("y",sy(cfg.fallback.y));
  fallback.setAttribute("text-anchor","middle");
  fallback.classList.add("show");
}
</script>
</body>
</html>
