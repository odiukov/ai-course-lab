- concept: направленные члены линейной SH-модели меняют знак для противоположных направлений взгляда
  question: Цвет гауссианы задан как сумма постоянного базового RGB и линейной по направлению взгляда RGB-поправки. Что произойдёт с поправкой при замене направления d на противоположное −d и чему будет равно среднее цветов этих ракурсов?
  explanation: Направленные члены пропорциональны координатам направления взгляда. При переходе от d к −d все координаты меняют знак, а постоянный член C0a0 остаётся прежним. Поэтому противоположные ракурсы позволяют отделить базовый цвет от направленной составляющей.
  kind: open
  reference: Линейная направленная поправка сменит знак, поэтому при усреднении цветов для d и −d она сократится, а останется только постоянный базовый RGB.
  id: 037-sh-degree-one-1
  fingerprint: 380871d1
- concept: линейное смешивание направленных SH-поправок обеспечивает непрерывное изменение RGB при движении камеры
  question: Почему цвет гауссианы в линейной SH-модели изменяется плавно, если камера движется по непрерывной траектории вокруг сцены?
  explanation: Члены степени 1 масштабируются текущими x, y и z направления взгляда. Пока направление меняется плавно, плавно меняются и веса всех трёх RGB-поправок; постоянный член при этом задаёт неизменную основу цвета.
  kind: open
  reference: Координаты единичного направления взгляда меняются непрерывно, а RGB вычисляется как линейная комбинация этих координат с фиксированными коэффициентами. Поэтому результат также меняется непрерывно, без переключения между готовыми цветами.
  id: 037-sh-degree-one-2
  fingerprint: aa2586ae
