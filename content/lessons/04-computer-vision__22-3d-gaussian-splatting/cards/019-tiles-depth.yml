- concept: взаимный порядок по глубине нужен только splat, способным участвовать в композиции одного пикселя
  question: Две спроецированные гауссианы покрывают непересекающиеся области экрана. Почему при растеризации не требуется определять их взаимный порядок по глубине?
  explanation: Цвет каждого пикселя компонуется только из splat, которые покрывают этот пиксель. Поэтому примитивы из непересекающихся областей экрана не влияют на результат друг друга, и задавать между ними глобальный порядок бессмысленно.
  kind: choice
  options:
    - Они никогда не участвуют в alpha-композиции одного и того же пикселя
    - Непересекающиеся гауссианы всегда имеют одинаковую глубину
    - Их прозрачность автоматически становится нулевой
    - Сортировка нужна только для гауссиан одинакового цвета
  correct: 0
  id: 019-tiles-depth-1
  fingerprint: 6f4d66ab
- concept: тайлы образуют независимые локальные задачи, подходящие для параллельной обработки на GPU
  question: Объясни своими словами, почему разбиение экрана на тайлы хорошо соответствует параллельной архитектуре GPU при рендеринге Gaussian Splatting.
  explanation: Тайлинг превращает обработку всей сцены в множество компактных задач с локальными данными. GPU может выполнять такие задачи параллельно, а внутри каждого тайла сортировать только влияющие на него splat.
  kind: open
  reference: После распределения спроецированных гауссиан по тайлам каждый тайл получает собственный список кандидатов. Сортировку и alpha-композицию разных тайлов можно выполнять независимо и одновременно на разных вычислительных блоках GPU.
  id: 019-tiles-depth-2
  fingerprint: 2bc45b01
