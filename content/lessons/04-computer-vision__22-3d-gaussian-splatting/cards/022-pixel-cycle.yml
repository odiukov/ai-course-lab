- concept: накопленный цвет при альфа-композитинге не нормализуется как обычное среднее
  question: Почему после суммирования вкладов splat итоговый цвет пикселя нельзя делить на сумму их цветовых весов?
  explanation: Альфа-композитинг моделирует покрытие и пропускание света. Неиспользованная splat доля принадлежит фону; нормализация сделала бы даже почти прозрачный набор слоёв полностью определяющим цвет пикселя.
  kind: open
  reference: Эти веса описывают реальную долю пикселя, занятую каждым слоем, а не коэффициенты обычного среднего. Нормализация искусственно растянула бы вклад прозрачных splat на весь пиксель и уничтожила бы долю, которая должна остаться фону.
