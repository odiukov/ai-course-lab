- concept: масштабы входят в ковариацию в квадрате, поскольку ковариация описывает дисперсии
  question: Объясни своими словами, почему при построении ковариации гауссианы масштабы вдоль её главных осей возводят в квадрат.
  explanation: Масштаб задаёт характерную длину вдоль оси, тогда как диагональное значение ковариации задаёт дисперсию вдоль неё. Поэтому в локальной системе координат ковариация содержит квадраты масштабов.
  kind: open
  reference: Ковариация хранит дисперсии, а дисперсия имеет размерность квадрата характерного линейного масштаба. Поэтому масштабу оси соответствует его квадрат в матрице ковариации.
  id: 010-covariance-2d-rule-2
  fingerprint: 57922ce5
