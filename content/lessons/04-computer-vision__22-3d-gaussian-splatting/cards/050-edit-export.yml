- concept: квантование в формате splat уменьшает файл ценой точности параметров
  question: Почему формат .splat удобен для веб-публикации, но обычно хуже .ply подходит на роль редактируемого мастер-файла?
  explanation: Квантование сокращает объём данных, заменяя точные значения более грубыми представлениями. Такой компромисс полезен при доставке сцены, но нежелателен для мастер-копии, из которой планируются дальнейшие преобразования.
  kind: open
  reference: '.splat квантует параметры гауссиан: записывает их компактнее и с меньшей точностью. Это уменьшает размер файла и удобно для PlayCanvas или SuperSplat, но часть точности теряется, поэтому для последующего редактирования предпочтительнее сырое представление .ply.'
