- concept: генеративные splat-модели синтезируют новую сцену, а не реконструируют снятую
  question: Объясни своими словами, чем generative splats отличаются от реконструкции Gaussian Splatting по источнику геометрии и внешнего вида сцены.
  explanation: 'Ключевое различие — источник сцены: реконструкция восстанавливает наблюдаемое, а генеративная модель создаёт новое содержание по условию. Marble от World Labs относится ко второму направлению.'
  kind: open
  reference: При реконструкции параметры сцены оцениваются по фотографиям или видео существующего места. Generative splats получают условие, например текстовый запрос, и синтезируют согласованную сцену, которой не требовалось существовать в исходной съёмке.
  id: 052-dynamic-generative-2
  fingerprint: bd0bb4f8
