- concept: глубина гауссианы для сортировки зависит от положения камеры
  question: Одну сцену визуализируют из нескольких положений камеры. Объясни, почему нельзя навсегда присвоить каждой гауссиане один обучаемый скаляр глубины для сортировки.
  explanation: Глубина не является неизменным свойством примитива в мировой системе. Она определяется положением и ориентацией камеры, поэтому для каждого вида центры преобразуют в систему камеры и сортируют по полученной координате вдоль направления взгляда.
  kind: open
  reference: 'Порядок гауссиан зависит от текущего вида: после преобразования мировых центров в систему конкретной камеры их координаты вдоль направления взгляда могут измениться вместе с взаимным порядком. Поэтому перед визуализацией глубину нужно вычислять как координату центра в системе текущей камеры.'
