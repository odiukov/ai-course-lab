- concept: последовательность стадий растеризации Gaussian Splatting
  question: Расположи стадии рендеринга гауссовых примитивов в порядке от данных сцены до готового изображения.
  explanation: После проекции становится известно экранное покрытие каждого splat. Оно определяет набор тайлов, внутри которых примитивы сортируются по глубине и смешиваются спереди назад. Результатом становится цвет каждого пикселя.
  kind: order
  items:
    - Спроецировать трёхмерные гауссианы на экран
    - Назначить полученные эллипсы пересекаемым экранным тайлам
    - Отсортировать гауссианы по глубине внутри каждого тайла
    - Выполнить альфа-композитинг от ближних примитивов к дальним
    - Записать накопленный цвет пикселя
  id: 018-raster-pipeline-1
  fingerprint: 1e326c4b
- concept: гауссов примитив назначается всем тайлам, область которых он пересекает
  question: Спроецированный эллипс гауссианы пересекает границу нескольких экранных тайлов. Как его должен обработать растеризатор?
  explanation: Вклад гауссианы может затрагивать пиксели по разные стороны границы тайла. Поэтому её включают в список каждого пересекаемого тайла, иначе на изображении возникнут пропуски.
  kind: choice
  options:
    - Назначить только тайлу, содержащему центр эллипса
    - Назначить каждому тайлу, который пересекает эллипс
    - Назначить только ближайшему к камере тайлу
    - Исключить примитив как неоднозначный
  correct: 1
  id: 018-raster-pipeline-2
  fingerprint: cf1ae7a9
- concept: локальная сортировка по тайлам сокращает объём работы по сравнению с глобальной сортировкой
  question: Почему при растеризации Gaussian Splatting гауссианы сортируют по глубине отдельно внутри каждого экранного тайла, а не одним глобальным списком?
  explanation: Глобальная сортировка охватывала бы миллионы примитивов, хотя большинство из них не влияет на данный участок экрана. Разбиение на тайлы превращает её в множество небольших независимых сортировок.
  kind: open
  reference: Для конкретного тайла важны только гауссианы, проекция которых его пересекает. Такой локальный список намного меньше всей сцены, поэтому его дешевле сортировать и удобно обрабатывать параллельно на GPU.
  id: 018-raster-pipeline-3
  fingerprint: 22950b7a
