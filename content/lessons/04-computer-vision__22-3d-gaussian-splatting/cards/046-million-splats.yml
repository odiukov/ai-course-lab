- concept: временной бюджет одного кадра является величиной, обратной частоте кадров
  question: Растеризатор поддерживает 200 кадров в секунду. Сколько миллисекунд в среднем он может тратить на один кадр?
  explanation: 'Время кадра равно 1000 / FPS миллисекунд: 1000 / 200 = 5 мс. Аналогично, приведённые в уроке 147 fps соответствуют примерно 6,8 мс на кадр.'
  kind: numeric
  answer: 5
