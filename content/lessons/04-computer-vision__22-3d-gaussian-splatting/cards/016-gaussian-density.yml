- concept: матричное произведение с вектором смещения с обеих сторон сворачивает квадратичную форму в скаляр
  question: Заполни выражение PyTorch так, чтобы квадратичная форма стала скалярным тензором.
  explanation: Умножение обратной ковариации на смещение даёт вектор. Дополнительное скалярное произведение с тем же смещением сворачивает его в одно значение q, пригодное для вычисления гауссова веса.
  kind: cloze
  template: q = ___
  answer: diff @ inv_cov @ diff
  accept:
    - torch.einsum("i,ij,j->", diff, inv_cov, diff)
    - torch.dot(diff, inv_cov @ diff)
