- concept: изменение освещения между кадрами нарушает согласованность многовидовых наблюдений
  question: Объясни своими словами, почему изменение положения источника света во время съёмки может породить мутные области и плавающие примитивы в реконструкции Gaussian Splatting.
  explanation: Реконструкция предполагает, что разные кадры показывают одну согласованную сцену. Зафиксированные экспозиция, баланс белого и освещение уменьшают противоречия, которые модель иначе может принять за свойства геометрии.
  kind: open
  reference: Одна поверхность при изменяющемся свете получает разные цвета и тени в разных кадрах. Оптимизация пытается согласовать противоречивые наблюдения и может ошибочно объяснить изменения внешнего вида дополнительной геометрией или размытыми примитивами. Сферические гармоники моделируют зависимость цвета от направления взгляда, но не произвольное изменение освещения во времени.
