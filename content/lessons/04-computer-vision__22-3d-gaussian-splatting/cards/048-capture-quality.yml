- concept: смаз и движение объектов нарушают поиск устойчивых межкадровых соответствий
  question: Во время обхода сцены человек передвинул стул, а часть кадров получилась смазанной. Как это вероятнее всего повлияет на реконструкцию?
  explanation: SfM сопоставляет устойчивые детали одной и той же сцены между кадрами. Смаз делает признаки нечёткими, а движущийся объект нарушает предположение о неизменной геометрии, поэтому оценки камер и начальные точки могут оказаться ошибочными.
  kind: choice
  options:
    - Улучшит оценку глубины за счёт дополнительных вариантов положения стула
    - Не повлияет, поскольку SfM использует только цвет фона
    - Затруднит сопоставление деталей и может создать ошибочные точки или артефакты
    - Автоматически увеличит детализацию неподвижных поверхностей
  correct: 2
