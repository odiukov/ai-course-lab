- concept: память сцены вычисляется из точного числа скаляров и размера их типа данных
  question: Расположите действия для точного расчёта памяти массива параметров сцены Gaussian Splatting.
  explanation: Сначала определяется число хранимых скаляров, затем — их количество во всей сцене. Только после этого учитывается размер типа данных и выполняется перевод единиц.
  kind: order
  items:
    - Сложить размеры всех атрибутов одного гауссова примитива без округления
    - Умножить результат на количество примитивов в сцене
    - Умножить общее число скаляров на размер элемента выбранного типа данных в байтах
    - При необходимости перевести байты в более крупные единицы памяти
  id: 008-pamyat-sceny-1
  fingerprint: a1e58ae3
- concept: точность хранения меняет расход памяти, но не число параметров модели
  question: Две версии одной сцены хранят одинаковый набор параметров, но одна использует половинную точность, а другая — одинарную. Что верно?
  explanation: Набор позиций, масштабов, поворотов, непрозрачностей и цветовых коэффициентов не меняется. Меняется лишь число байтов, выделяемых под каждый скаляр.
  kind: choice
  options:
    - Число параметров одинаково, но версия с одинарной точностью занимает больше памяти
    - Версия с одинарной точностью содержит больше параметров
    - Обе версии обязательно занимают одинаковый объём памяти
    - Половинная точность удаляет часть атрибутов каждой гауссианы
