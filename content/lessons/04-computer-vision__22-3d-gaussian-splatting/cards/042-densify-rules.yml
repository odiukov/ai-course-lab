- concept: масштаб выбирает способ уплотнения, но не служит самостоятельным сигналом для него
  question: У крупной гауссианы низкая величина градиента, а opacity остаётся выше порога удаления. Какое действие обосновано правилами адаптации 3D Gaussian Splatting?
  explanation: Низкий градиент не указывает на нехватку деталей, поэтому уплотнение не требуется. Масштаб различает clone и split только после появления большого градиента, а удаление определяется низкой opacity.
  kind: choice
  options:
    - Выполнить split из-за крупного масштаба
    - Выполнить clone из-за низкого градиента
    - Оставить гауссиану без изменений
    - Удалить гауссиану из-за крупного масштаба
  correct: 2
  id: 042-densify-rules-1
  fingerprint: ad69e7d9
- concept: совместное применение уплотнения и pruning регулирует распределение ёмкости модели по сцене
  question: Почему при обучении 3D Gaussian Splatting недостаточно только добавлять или дробить гауссианы и нужен также pruning по opacity?
  explanation: Clone и split добавляют модели ёмкость там, где текущего представления не хватает. Pruning освобождает её от гауссиан с opacity ниже порога, которые почти не участвуют в формировании пикселей.
  kind: open
  reference: Уплотнение увеличивает выразительность представления в областях, где ошибка создаёт большой градиент. Некоторые примитивы со временем становятся почти прозрачными и перестают заметно влиять на изображение; pruning удаляет их, сдерживая бесполезный рост модели.
  id: 042-densify-rules-2
  fingerprint: 1e8c9ec7
