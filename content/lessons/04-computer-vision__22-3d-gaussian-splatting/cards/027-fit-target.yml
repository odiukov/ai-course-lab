- concept: оптимизация по ошибке изображения не требует заранее назначать splat отдельным целевым областям
  question: Объясните, почему при подгонке Gaussian splats к целевому изображению не требуется заранее указывать, какой splat должен представлять каждую его область.
  explanation: В материале все гауссианы обучаются по общей пиксельной MSE. Градиенты автоматически отражают влияние каждого примитива на изображение, поэтому центры, масштабы, цвета и opacity могут согласованно подстроиться под целевые области.
  kind: open
  reference: Дифференцируемый рендеринг связывает параметры каждого splat с пикселями результата. Ошибка между результатом и целью создаёт градиенты, по которым оптимизатор совместно меняет положения и остальные параметры всех splat. Поэтому распределение примитивов по областям изображения возникает в ходе оптимизации без ручного соответствия.
  id: 027-fit-target-2
  fingerprint: 05fc76d0
