- concept: кусочной дифференцируемости достаточно для обучения растеризатора с дискретной сортировкой и отбором примитивов
  question: Объясни своими словами, как через растеризатор передают градиенты, если назначение splat тайлам и сортировка по глубине являются дискретными операциями.
  explanation: Для градиентного обучения не требуется гладкость растеризатора во всех возможных конфигурациях. Достаточно локальной производной при текущем наборе участников и текущем порядке; дискретная конфигурация обновится на следующем прямом проходе, если параметры пересекут границу переключения.
  kind: open
  reference: Во время обратного прохода выбранные списки splat и их порядок рассматривают как фиксированную ветвь вычисления. Градиенты проводят через непрерывные операции проекции, вычисления весов, прозрачности и альфа-композитинга внутри этой ветви. В точке изменения списка или порядка производная может отсутствовать, но между такими переключениями растеризатор остаётся дифференцируемым.
  id: 040-differentiable-render-2
  fingerprint: 7ac37f67
