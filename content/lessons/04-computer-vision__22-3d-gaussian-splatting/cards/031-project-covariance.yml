  fingerprint: 34004e4a
- concept: при перспективной проекции разброс по глубине влияет на экранный разброс вне оптической оси
  question: Гауссиана расположена правее оптической оси камеры. Почему её экранную ковариацию нельзя получить, просто удалив из камерной ковариации строку и столбец глубины?
  explanation: 'В перспективной камере u зависит от Xc/Zc, а v — от Yc/Zc. Поэтому производные по Zc обычно ненулевые: −fxXc/Zc² и −fyYc/Zc². Простое удаление глубины потеряло бы этот вклад в форму и ориентацию экранного эллипса.'
  kind: open
  reference: Экранная координата зависит от отношения поперечной координаты к глубине. Поэтому изменение глубины сдвигает проекцию точки, находящейся вне оптической оси. Этот эффект содержится в столбце якобиана, соответствующем глубине, и должен участвовать в переносе ковариации.
  id: 031-project-covariance-2
  fingerprint: 1e83768c
