- concept: экспонента преобразует хранимый логарифмический масштаб в положительный физический размер
  question: Как получить физический размер оси из хранимого логарифмического масштаба s?
  explanation: Размер вычисляют как exp(s), поэтому он всегда положителен. Хранение логарифма позволяет оптимизатору свободно изменять параметр, не создавая отрицательных размеров.
  kind: cloze
  template: scale_physical = ___
  answer: exp(s)
  accept:
    - e^s
    - Math.exp(s)
    - torch.exp(s)
