- concept: снижение степени сферических гармоник уменьшает память ценой потери ракурсно-зависимого цвета
  question: Объясни своими словами, какой компромисс возникает при уменьшении степени сферических гармоник у гауссиан сцены.
  explanation: При степени SH 3 цвет занимает 48 коэффициентов из примерно 59 float. При степени 0 остаются только 3 цветовых коэффициента, но цвет становится постоянным для всех направлений взгляда.
  kind: open
  reference: 'Уменьшается число цветовых коэффициентов и размер сцены, но цвет хуже зависит от направления взгляда: ослабевают или исчезают блики и другие ракурсные эффекты.'
