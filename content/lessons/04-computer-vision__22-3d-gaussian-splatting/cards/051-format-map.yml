- concept: USD-ориентированному конечному пайплайну соответствует экспорт Gaussian Splatting в OpenUSD
  question: Сцену Gaussian Splatting нужно передать в производственный пайплайн, построенный вокруг NVIDIA Omniverse и пространственных приложений Apple. Какой маршрут экспорта наиболее естественен?
  explanation: Для USD-пайплайнов предназначена схема UsdVolParticleField3DGaussianSplat. Её могут использовать Omniverse и совместимые приложения, но конечный вьюер всё равно должен явно понимать эту схему.
  kind: choice
  options:
    - OpenUSD с родной схемой гауссовых splat
    - Квантованный файл .splat для PlayCanvas
    - Необработанный набор кадров с камеры
    - Обычный glTF без расширения Gaussian Splatting
