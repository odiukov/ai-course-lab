- concept: стандартное отклонение вдоль главной оси равно квадратному корню из собственного значения ковариации
  question: Собственное значение экранной ковариации вдоль одной из главных осей равно 36 квадратным пикселям. Чему равно стандартное отклонение вдоль этой оси в пикселях?
  explanation: 'Собственное значение ковариации является дисперсией вдоль соответствующего собственного вектора. Стандартное отклонение равно квадратному корню из дисперсии: √36 = 6 пикселей.'
  kind: numeric
  answer: 6
  tolerance: 0.02
