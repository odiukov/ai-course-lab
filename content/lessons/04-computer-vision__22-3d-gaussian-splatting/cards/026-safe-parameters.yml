- concept: логит отделяет неограниченный обучаемый параметр от физически допустимой непрозрачности
  question: Оптимизатор напрямую обновляет `opacity_logit`. В чём преимущество такой параметризации?
  explanation: В памяти хранится неограниченный логит, поэтому оптимизатору не приходится соблюдать границы. При рендеринге `sigmoid` мягко переводит его в диапазон от 0 до 1. В отличие от жёсткой обрезки, это преобразование остаётся дифференцируемым.
  kind: choice
  options:
    - Параметр может свободно принимать любые вещественные значения, а `sigmoid` перед рендерингом преобразует его в допустимую непрозрачность
    - Оптимизатор обновляет уже обрезанную непрозрачность, а `sigmoid` лишь меняет скорость обучения
    - '`sigmoid` после каждого обновления делает непрозрачность строго бинарной'
    - Логит гарантирует одинаковую величину градиента при любых значениях параметра
  correct: 0
  id: 026-safe-parameters-1
  fingerprint: 27176b8a
- concept: значение логита количественно преобразуется в opacity функцией sigmoid
  question: Логит непрозрачности splat равен ln(4). Какой opacity получит растеризатор после применения `sigmoid`?
  explanation: Для x = ln(4) имеем exp(x) = 4. Поэтому sigmoid(x) = exp(x) / (1 + exp(x)) = 4 / 5 = 0,8.
  kind: numeric
  answer: 0.8
  tolerance: 0.001
  id: 026-safe-parameters-2
  fingerprint: 7cd16273
- concept: RGB-каналы ограничиваются независимыми sigmoid, а не совместным softmax
  question: Почему к `colour_logits` применяют `sigmoid` отдельно по каналам, а не `softmax` по всему RGB-вектору?
  explanation: Цвет может одновременно иметь высокие значения нескольких каналов, например быть светлым или белым. Независимые `sigmoid` это допускают; `softmax` ошибочно связал бы каналы условием общей суммы.
  kind: open
  reference: Каждый канал RGB имеет собственную независимую интенсивность и должен лишь оставаться в допустимом диапазоне. `Sigmoid` ограничивает каждый канал отдельно, тогда как `softmax` заставил бы каналы конкурировать и суммироваться в единицу, что не соответствует представлению обычного цвета.
  id: 026-safe-parameters-3
  fingerprint: b8c2ba06
