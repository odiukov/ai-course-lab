- concept: экранная координата получается масштабированием отношения поперечного смещения к глубине и добавлением главной точки
  question: После преобразования вида центр гауссианы имеет X_c = 0.75 м и Z_c = 6 м. Для камеры f_x = 960 пикселей и c_x = 420 пикселей. Чему равна экранная координата u?
  explanation: По формуле u = f_x X_c / Z_c + c_x получаем u = 960 × 0.75 / 6 + 420 = 540 пикселей. Деление на Z_c реализует перспективное уменьшение экранного смещения с глубиной.
  kind: numeric
  answer: 540
  tolerance: 0.1
