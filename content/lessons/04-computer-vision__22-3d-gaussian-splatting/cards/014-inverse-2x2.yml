- concept: обратная матрица выражается через перестановку диагональных элементов, смену знаков внедиагональных и деление на определитель
  question: Заполни формулу для матрицы A = [[a, b], [c, d]].
  explanation: 'Сначала строится присоединённая матрица: диагональные элементы меняются местами, а знаки остальных элементов меняются. Затем каждый её элемент делится на определитель ad-bc.'
  kind: cloze
  template: inverse(A) = ___
  answer: '[[d, -b], [-c, a]] / (a*d - b*c)'
  accept:
    - '[[d,-b],[-c,a]]/(a*d-b*c)'
    - (d,-b;-c,a)/(ad-bc)
  id: 014-inverse-2x2-1
  fingerprint: 4b17d367
- concept: равенство ad и bc означает вырожденность матрицы и отсутствие однозначного обратного преобразования
  question: Для матрицы A = [[a, b], [c, d]] выполняется ad = bc. Какой вывод верен?
  explanation: При ad = bc выражение ad-bc исчезает, поэтому деление на определитель невозможно. Такое преобразование отображает разные входы в один и тот же результат, и восстановить вход однозначно нельзя.
  kind: choice
  options:
    - 'Однозначной обратной матрицы нет: преобразование теряет независимое направление'
    - Обратная матрица получается простой транспозицией A
    - Матрица обязательно совпадает с единичной
    - Достаточно поменять знаки у внедиагональных элементов
  correct: 0
