- concept: ковариация, построенная как RSSᵀRᵀ, является симметричной и положительно определённой
  question: Пусть R — ортогональная матрица поворота, а диагональная матрица S содержит только положительные масштабы. Какое свойство гарантированно имеет матрица Σ = RSSᵀRᵀ?
  explanation: Транспонирование всей формулы возвращает ту же матрицу, поэтому Σ симметрична. Для любого ненулевого вектора соответствующая квадратичная форма положительна, поскольку R обратима, а все масштабы в S положительны.
  kind: choice
  options:
    - Она симметрична и положительно определена
    - Она обязательно остаётся диагональной
    - Она является антисимметричной
    - Она обязательно содержит отрицательные собственные значения
