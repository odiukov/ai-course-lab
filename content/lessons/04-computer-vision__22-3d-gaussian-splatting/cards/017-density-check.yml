- concept: плотность ненормированной гауссианы в её центре не зависит от ковариации
  question: Почему изменение масштаба или ориентации невырожденной гауссианы не меняет значение её плотности точно в центре?
  explanation: Ковариация влияет на затухание плотности вокруг центра, но при нулевом смещении она не может изменить значение квадратичной формы.
  kind: open
  reference: В центре вектор смещения равен нулю. Поэтому квадратичная форма с обратной ковариацией также равна нулю, а экспонента достигает максимального значения, равного единице.
