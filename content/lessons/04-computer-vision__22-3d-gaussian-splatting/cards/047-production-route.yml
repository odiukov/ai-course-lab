- concept: порядок этапов полного продакшн-пайплайна Gaussian Splatting
  question: Расположите операции в порядке превращения исходных снимков в опубликованную сцену.
  explanation: Продакшн-процесс начинается со съёмки и восстановления геометрических ориентиров. После обучения результат очищают, переводят в формат доставки и только затем показывают в целевой среде.
  kind: order
  items:
    - Снять перекрывающиеся изображения объекта или сцены
    - Восстановить позы камер и разреженные точки средствами SfM или MVS
    - Обучить представление сцены гауссовыми примитивами
    - Удалить плавающие артефакты и выделить нужные части сцены
    - Экспортировать сцену из рабочего формата в формат доставки
    - Открыть сцену в целевом движке или просмотрщике
  id: 047-production-route-1
  fingerprint: b45d012d
- concept: скорость обучения не определяет общий срок и качество продакшн-проекта
  question: Почему срок и качество проекта по Gaussian Splatting нельзя оценивать только по скорости обучения модели?
  explanation: Даже быстро обученная сцена может оказаться непригодной из-за плохого покрытия ракурсами, ошибок восстановления камер или неочищенных артефактов. На практике подготовка данных и доведение результата до публикации нередко требуют больше времени, чем само обучение.
  kind: open
  reference: Обучение — лишь одна часть конвейера. До него требуется качественно снять сцену и восстановить камеры и начальную геометрию, а после него — очистить артефакты, экспортировать и проверить результат в целевой среде. Ошибки съёмки и подготовки данных ухудшают результат независимо от скорости обучения.
  id: 047-production-route-2
  fingerprint: 1e2f8f01
