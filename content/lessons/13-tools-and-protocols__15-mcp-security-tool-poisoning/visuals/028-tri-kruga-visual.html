<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Rule of Two — три круга</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1a1d21; --muted:#5c646d; --line:#8a929b;
    --a:#2f6fb0; --b:#1f7a5a; --c:#8a5a13; --danger:#c0392b; --dangerfill:#c0392b;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171a; --fg:#e8ebee; --muted:#a4adb6; --line:#7d868f;
      --a:#6fb0e8; --b:#5fd0a6; --c:#e0b060; --danger:#ff7b6b; --dangerfill:#ff7b6b;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .wrap{padding:10px 12px;background:var(--bg);}
  h2{margin:0 0 6px;font-size:15px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;}
  #fb{margin:8px 0 0;color:var(--muted);}
  text{fill:var(--fg);}
</style>
</head>
<body>
<div class="wrap">
  <h2>Rule of Two: опасна только зона «три из трёх»</h2>
  <svg id="svg" viewBox="0 0 600 450" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Три пересекающихся круга: недоверенный ввод, чувствительные данные, значимое действие; центр помечен как запрещённый ход"></svg>
  <p id="fb" hidden>Схема: три пересекающихся круга — A недоверенный ввод, B чувствительные
  данные, C значимое действие наружу. Пересечения по два безопасны, центральная зона
  «3 из 3» — запрещённый ход.</p>
</div>
<script>
(function(){
  try{
    /* ---- данные схемы (условные единицы) ---- */
    var R = 0.85;
    var CIRCLES = [
      {id:"A", cx:-0.55, cy: 0.32, cls:"a", key:[-0.94, 0.60], word:[-0.94, 0.40], w:"ввод"},
      {id:"B", cx: 0.55, cy: 0.32, cls:"b", key:[ 0.94, 0.60], word:[ 0.94, 0.40], w:"данные"},
      {id:"C", cx: 0.00, cy:-0.63, cls:"c", key:[ 0.00,-1.00], word:[ 0.00,-1.20], w:"действие"}
    ];
    var PAIRS = [
      {t:"A+B", p:[ 0.00, 0.58]},
      {t:"A+C", p:[-0.64,-0.32]},
      {t:"B+C", p:[ 0.64,-0.32]}
    ];
    var CENTER = [0.00, -0.03];
    var LEADER = [[0.26,0.16],[1.15,0.95],[1.45,0.95]];
    var CALLOUT = [1.50, 0.95];
    var LEGEND = [
      [-1.40,-1.62,"A — недоверенный ввод: описания инструментов, письма, страницы"],
      [-1.40,-1.82,"B — чувствительные данные: ключи, приватные репозитории, почта"],
      [-1.40,-2.02,"C — значимое действие наружу: отправить, записать, вызвать чужой API"],
      [-1.40,-2.24,"по два (A+B, A+C, B+C) — безопасно: одно из трёх убрано, огня нет"]
    ];

    /* ---- единственный перевод координат ---- */
    var origin = {x:200, y:165}, scale = 120;
    function sx(x){ return origin.x + x*scale; }
    function sy(y){ return origin.y - y*scale; }

    var rp = sx(R) - sx(0);

    /* внутренняя точка пересечения кругов c1 и c2 (та, что внутри c3) */
    function inter(c1,c2,c3){
      var dx=c2.cx-c1.cx, dy=c2.cy-c1.cy, d=Math.hypot(dx,dy), a=d/2,
          h=Math.sqrt(R*R-a*a), ux=dx/d, uy=dy/d,
          mx=c1.cx+ux*a, my=c1.cy+uy*a,
          p1=[mx-uy*h, my+ux*h], p2=[mx+uy*h, my-ux*h];
      return Math.hypot(p1[0]-c3.cx,p1[1]-c3.cy) < Math.hypot(p2[0]-c3.cx,p2[1]-c3.cy) ? p1 : p2;
    }
    var A=CIRCLES[0], B=CIRCLES[1], C=CIRCLES[2];
    var pAB=inter(A,B,C), pAC=inter(A,C,B), pBC=inter(B,C,A);
    function arc(p){ return "A"+rp+" "+rp+" 0 0 1 "+sx(p[0])+" "+sy(p[1]); }
    var core = "M"+sx(pAB[0])+" "+sy(pAB[1])+arc(pAC)+arc(pBC)+arc(pAB)+"Z";

    var s = '';
    s += '<style>'
       + '.ring{fill-opacity:.13;stroke-width:1.6}'
       + '.a{stroke:var(--a);fill:var(--a)}'
       + '.b{stroke:var(--b);fill:var(--b)}'
       + '.c{stroke:var(--c);fill:var(--c)}'
       + '.key{font-size:17px;font-weight:700}'
       + '.word{font-size:12px;fill:var(--muted)}'
       + '.pair{font-size:12px;fill:var(--muted)}'
       + '.core{fill:var(--dangerfill);fill-opacity:.42;stroke:var(--danger);'
       + 'stroke-width:1.8;stroke-dasharray:4 3}'
       + '.ct{font-size:11px;font-weight:700;fill:var(--danger)}'
       + '.callout{font-size:13px;font-weight:600;fill:var(--danger)}'
       + '.lead{stroke:var(--danger);stroke-width:1.4;fill:none}'
       + '.lg{font-size:12px;fill:var(--muted)}'
       + '</style>';
    s += '<rect x="0" y="0" width="600" height="450" fill="var(--bg)"/>';

    CIRCLES.forEach(function(c){
      s += '<circle class="ring '+c.cls+'" cx="'+sx(c.cx)+'" cy="'+sy(c.cy)+'" r="'+rp+'"/>';
    });

    s += '<path class="core" d="'+core+'"/>';

    CIRCLES.forEach(function(c){
      s += '<text class="key '+c.cls+'" x="'+sx(c.key[0])+'" y="'+sy(c.key[1])
         + '" text-anchor="middle" stroke="none">'+c.id+'</text>';
      s += '<text class="word" x="'+sx(c.word[0])+'" y="'+sy(c.word[1])
         + '" text-anchor="middle">'+c.w+'</text>';
    });

    PAIRS.forEach(function(p){
      s += '<text class="pair" x="'+sx(p.p[0])+'" y="'+sy(p.p[1])
         + '" text-anchor="middle">'+p.t+'</text>';
    });

    s += '<text class="ct" x="'+sx(CENTER[0])+'" y="'+sy(CENTER[1])
       + '" text-anchor="middle">3 из 3</text>';

    s += '<path class="lead" d="M'+LEADER.map(function(p,i){
           return (i?'L':'')+sx(p[0])+' '+sy(p[1]);
         }).join('')+'"/>';
    s += '<text class="callout" x="'+sx(CALLOUT[0])+'" y="'+sy(CALLOUT[1])
       + '" text-anchor="start" dominant-baseline="middle">запрещённый ход</text>';

    LEGEND.forEach(function(l){
      s += '<text class="lg" x="'+sx(l[0])+'" y="'+sy(l[1])+'" text-anchor="start">'
         + l[2]+'</text>';
    });

    document.getElementById('svg').innerHTML = s;
  }catch(e){
    var g=document.getElementById('svg'); if(g) g.remove();
    document.getElementById('fb').hidden=false;
  }
})();
</script>
</body>
</html>
