- concept: для получения top-1 класса не требуется вычислять softmax
  question: Почему zero-shot классификатор может сразу применить argmax к сходствам изображения с классами, не вычисляя softmax?
  explanation: Softmax меняет масштаб оценок, но не индекс их максимума. Прямой argmax даёт ту же метку и позволяет не выполнять лишнее вычисление.
  kind: open
  reference: 'Softmax сохраняет порядок значений внутри строки: класс с наибольшим сходством останется классом с наибольшей вероятностью. Поэтому для одной лишь метки top-1 достаточно argmax исходных сходств; softmax нужен, только если требуются нормированные оценки.'
  id: 031-zero-shot-check-2
  fingerprint: cd7ea0aa
