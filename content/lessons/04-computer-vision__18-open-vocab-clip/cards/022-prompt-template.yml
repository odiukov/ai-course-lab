- concept: естественный prompt согласует описание класса с текстами, на которых обучался CLIP
  question: Почему CLIP может точнее сопоставить изображение с текстом «a photo of a bicycle», чем с одиночным словом «bicycle»?
  explanation: CLIP обучается на парах изображений и естественных текстовых описаний. Контекст вроде «a photo of» помогает получить текстовый embedding, лучше согласованный с визуальным представлением класса; отдельные слова при этом тоже можно кодировать.
  kind: choice
  options:
    - Prompt увеличивает разрешение изображения перед кодированием
    - Естественная фраза лучше соответствует распределению описательных подписей из обучения и задаёт визуальный контекст
    - Текстовый энкодер распознаёт только предложения и не может закодировать отдельное слово
    - Дополнительные слова автоматически повышают норму текстового embedding
  correct: 1
  id: 022-prompt-template-1
  fingerprint: 4f1911c8
- concept: контекст prompt направляет embedding многозначного слова к нужному визуальному смыслу
  question: Слово «crane» может означать птицу или строительный кран. Объясните, почему эти два смысла следует представить разными естественными prompt при zero-shot классификации CLIP.
  explanation: CLIP сравнивает embedding изображения с embedding полного текста, а не с фиксированной словарной меткой. Уточняющие слова меняют положение текстового вектора и позволяют отделить разные визуальные смыслы одного слова.
  kind: open
  reference: Текстовый энкодер строит embedding всего выражения, поэтому контекст уточняет значение многозначного слова. Prompt о птице и prompt о строительной машине попадут в разные области общего пространства и будут сопоставляться с разными типами изображений.
  id: 022-prompt-template-2
  fingerprint: 2aac05d2
