- concept: закрытый классификатор вынужден выбирать одну из известных меток даже для объекта вне обучающего словаря
  question: Классификатор обучен различать метки «кошка», «собака», «лошадь» и «корова». Что обычно произойдёт, если показать ему изображение экскаватора без отдельного механизма обнаружения неизвестных объектов?
  explanation: Выход закрытого классификатора содержит логиты только для заданных при обучении классов. Argmax всё равно выберет один из них, даже если изображение не относится ни к одному известному классу.
  kind: choice
  options:
    - Модель выберет одну из четырёх известных меток с максимальным логитом
    - Модель самостоятельно создаст новую метку «экскаватор»
    - Выходной слой автоматически расширится новой категорией
    - Модель обязательно откажется от ответа
  correct: 0
  id: 001-closed-vocab-1
  fingerprint: 282f83c7
- concept: добавление нового класса требует изменения и обучения выходной головы классификатора
  question: Почему недостаточно дописать название новой категории в конфигурацию обычного классификатора, чтобы модель начала её распознавать?
  explanation: В модели ImageNet из урока каждому из 1000 классов соответствует своё место в выходной голове. Текстовое название само по себе не создаёт ни нового логита, ни весов, связывающих визуальные признаки с новой категорией.
  kind: open
  reference: У новой категории нет отдельного выхода и обученных весов в классификационной голове. Нужно расширить выходной слой, собрать размеченные примеры нового класса и обучить или переобучить соответствующие параметры.
  id: 001-closed-vocab-2
  fingerprint: 96b011dc
