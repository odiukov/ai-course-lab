- concept: softmax связывает оценки кандидатов общим знаменателем, а сигмоида оценивает фиксированный logit независимо
  question: Logit соответствия одной пары «изображение — подпись» зафиксирован. В набор добавили ещё одну подпись, не изменяя embeddings и прежние logits. Как изменится оценка исходной пары?
  explanation: У softmax новый кандидат добавляет положительное слагаемое в общий знаменатель, поэтому доля прежней пары уменьшается. Сигмоида зависит только от logit этой пары, поэтому при неизменном logit её значение остаётся прежним.
  kind: choice
  options:
    - Её softmax-вероятность уменьшится, а значение сигмоиды не изменится
    - Её softmax-вероятность не изменится, а значение сигмоиды уменьшится
    - Обе оценки обязательно уменьшатся
    - Ни одна оценка не изменится
  correct: 0
  id: 016-sigmoid-pairs-1
  fingerprint: 38ba271b
- concept: независимая бинарная оценка допускает несколько подходящих текстов для одного изображения
  question: Одному изображению одновременно соответствуют точная и более общая подписи. Почему SigLIP может уверенно признать подходящими обе пары, не заставляя подписи конкурировать между собой?
  explanation: Сигмоидные ответы разных пар не обязаны суммироваться в единицу. Поэтому несколько текстов могут одновременно получить высокую вероятность соответствия одному изображению; softmax же связывает их общим знаменателем.
  kind: open
  reference: SigLIP применяет бинарную сигмоидную потерю отдельно к каждой паре. Высокая оценка одной подходящей подписи не расходует общий вероятностный бюджет и не обязана снижать оценку другой, тогда как softmax нормализует оценки кандидатов совместно.
  id: 016-sigmoid-pairs-2
  fingerprint: 1bb29b54
