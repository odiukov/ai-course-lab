- concept: последовательность L2-нормализации вектора
  question: Расположите операции L2-нормализации embedding в правильном порядке.
  explanation: Сначала вычисляют L2-норму как корень из суммы квадратов координат, затем делят на неё все координаты вектора.
  kind: order
  items:
    - Возвести каждую координату в квадрат и сложить результаты
    - Извлечь квадратный корень из полученной суммы
    - Разделить каждую координату исходного вектора на найденную норму
  id: 006-row-normalization-1
  fingerprint: 945b981e
- concept: обычное скалярное произведение зависит не только от направления, но и от длин векторов
  question: Почему скалярное произведение ненормализованных embeddings может быть плохой мерой их смысловой близости?
  explanation: 'L2-нормализация удаляет влияние длины: масштабирование ненулевого embedding положительным коэффициентом больше не меняет результат сравнения.'
  kind: open
  reference: Его величина зависит и от угла между векторами, и от их длин. Поэтому увеличение масштаба embedding способно повысить оценку сходства без изменения его направления и смыслового содержания.
  id: 006-row-normalization-2
  fingerprint: c9c32270
