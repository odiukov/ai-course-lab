- concept: метрики классификации и поиска оценивают разные задачи и не образуют общую шкалу
  question: В одном эксперименте измеряют долю верно выбранных меток из фиксированного списка, а в другом — долю запросов, для которых релевантное изображение оказалось в верхней части выдачи. Как корректно сопоставить результаты?
  explanation: Точность выбора класса характеризует классификацию, а попадание релевантного объекта в верхнюю часть выдачи — поиск. Даже если обе метрики выражены в процентах, они отвечают на разные вопросы.
  kind: choice
  options:
    - Напрямую сравнить проценты и объявить большую величину лучшим результатом
    - 'Интерпретировать каждую метрику только в рамках своей задачи: классификации или поиска'
    - Заменить обе метрики средней косинусной близостью
  correct: 1
  id: 038-experiment-check-1
  fingerprint: 5b7c417f
- concept: контролируемое сравнение изолирует влияние способа построения текстового представления класса
  question: Почему при сравнении одиночной формулировки с ансамблем формулировок нужно сохранить одинаковыми checkpoint модели, изображения и разбиение данных?
  explanation: Если одновременно поменять модель, выборку или разбиение, станет невозможно определить, вызван ли разрыв качеством prompt-ансамбля или посторонним фактором.
  kind: open
  reference: Тогда единственной изменяемой причиной остаётся способ построения текстового представления класса, поэтому разницу в качестве можно обоснованно связать с ансамблированием формулировок.
  id: 038-experiment-check-2
  fingerprint: 765412fc
- concept: объективная оценка текстового поиска требует независимой разметки релевантности до просмотра ранжирования
  question: Расположи этапы оценки текстового поиска изображений в корректном порядке.
  explanation: Релевантность задают независимо от результатов системы. Иначе оценщик может подстроить эталон под увиденную выдачу и получить завышенную метрику.
  kind: order
  items:
    - Сформулировать отложенные текстовые запросы и заранее определить релевантные им изображения
    - Закодировать коллекцию изображений и построить векторный индекс
    - Выполнить запросы и получить ранжированные выдачи
    - Сопоставить выдачи с разметкой релевантности и вычислить метрику поиска
  id: 038-experiment-check-3
  fingerprint: 4a4d8d8a
