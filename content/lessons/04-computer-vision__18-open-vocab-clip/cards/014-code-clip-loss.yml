- concept: целевые индексы должны находиться на том же устройстве, что и логиты
  question: Заполни пропуск так, чтобы вычисление cross-entropy работало независимо от того, находятся embeddings на CPU или GPU.
  explanation: Cross-entropy получает логиты и индексы классов в одной операции, поэтому эти тензоры должны находиться на одном устройстве. Привязка к sim.device автоматически следует за устройством вычисленной матрицы логитов.
  kind: cloze
  template: targets = torch.arange(len(image_emb), device=___)
  answer: sim.device
  accept:
    - image_emb.device
    - text_emb.device
  id: 014-code-clip-loss-1
  fingerprint: 7681dab5
- concept: готовый множитель logit_scale применяется непосредственно к матрице сходств
  question: Функция clip_loss получает logit_scale уже как готовый положительный множитель. Как следует построить logits?
  explanation: По контракту этой функции logit_scale уже является множителем, поэтому logits вычисляются как logit_scale * image_emb @ text_emb.T. Повторный exp изменил бы масштаб и мог сделать softmax чрезмерно резким.
  kind: choice
  options:
    - Разделить матрицу сходств на exp(logit_scale)
    - Умножить матрицу сходств непосредственно на logit_scale
    - Сначала применить exp к logit_scale, затем умножить матрицу сходств
    - Прибавить logit_scale к каждому элементу матрицы сходств
  correct: 1
