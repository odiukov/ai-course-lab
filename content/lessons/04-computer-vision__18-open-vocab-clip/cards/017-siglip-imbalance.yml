- concept: положительность scale сохраняет монотонную связь между сходством пары и вероятностью совпадения
  question: Объясните, почему обучаемый множитель scale в логите SigLIP должен оставаться положительным.
  explanation: 'В логите z = s·sim + b положительный s растягивает различия между сходствами, не меняя их порядка. Если разрешить s стать отрицательным, рост сходства начнёт уменьшать logit: наиболее похожие пары будут считаться менее вероятными совпадениями.'
  kind: open
  reference: 'Положительный scale сохраняет порядок оценок: большее cosine similarity даёт больший logit и более высокую вероятность совпадения. Отрицательный scale перевернул бы смысл сходства, а изменение его модуля лишь регулирует резкость разделения пар.'
  id: 017-siglip-imbalance-2
  fingerprint: 538ffbbc
