- concept: softmax по оси классов создаёт отдельное распределение для каждого изображения
  question: 'Матрица logits устроена так: строки соответствуют изображениям, а столбцы — кандидатным классам. Как применить softmax, чтобы получить независимое распределение классов для каждого изображения?'
  explanation: Softmax по оси классов нормализует каждую строку отдельно. Поэтому для каждого изображения вероятности всех кандидатных классов складываются в единицу. При нормализации по столбцам изображения ошибочно конкурировали бы друг с другом.
  kind: choice
  options:
    - Внутри каждой строки, по оси классов
    - Внутри каждого столбца, по оси изображений
    - Сразу по всем элементам матрицы
  correct: 0
  id: 028-code-probabilities-1
  fingerprint: 2fca2630
- concept: argmax отбрасывает информацию о вероятностях альтернативных классов
  question: Почему функция, вычисляющая zero-shot вероятности, должна возвращать всё распределение по классам, а не сразу результат argmax?
  explanation: Два изображения могут получить один и тот же лучший класс, но сильно различаться по уверенности. Вектор вероятностей сохраняет это различие, тогда как argmax сводит оба результата к одному индексу.
  kind: open
  reference: Argmax сохраняет только индекс наиболее вероятного класса и удаляет сведения об уверенности модели и близких альтернативах. Полное распределение позволяет отдельно выбирать победителя, оценивать неопределённость и применять пороги.
  id: 028-code-probabilities-2
  fingerprint: 4f28de5f
