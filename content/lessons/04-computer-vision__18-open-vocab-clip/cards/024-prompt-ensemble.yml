- concept: усреднение шаблонов сворачивает ось формулировок, сохраняя отдельное представление каждого класса
  question: Текстовые embeddings организованы по осям «класс × шаблон × признаки». Как получить матрицу текстовых ориентиров для zero-shot классификации?
  explanation: 'Сворачивается только ось шаблонов: разные формулировки одного класса дают общий class embedding. Ось классов сохраняется, чтобы изображение можно было отдельно сравнить с каждым кандидатом.'
  kind: choice
  options:
    - Усреднить по оси классов, сохранив отдельный ориентир для каждого шаблона
    - Усреднить по оси шаблонов отдельно внутри каждого класса
    - Усреднить одновременно по осям классов и шаблонов
    - Объединить оси классов и шаблонов без усреднения
  correct: 1
  id: 024-prompt-ensemble-1
  fingerprint: 863db330
- concept: усреднение подавляет различающиеся отклонения шаблонов, но не устраняет общий систематический сдвиг
  question: Все шаблоны некоторого класса вносят в текстовый embedding почти одинаковый нежелательный сдвиг. Устранит ли его усреднение? Объясни своими словами.
  explanation: Шаблонное усреднение хорошо подавляет меняющийся от формулировки шум. Общая для всех prompts ошибка является систематической, поэтому при вычислении среднего не компенсируется.
  kind: open
  reference: Нет. Усреднение ослабляет отклонения, направленные по-разному у разных шаблонов. Одинаковый сдвиг присутствует в каждом embedding и поэтому сохраняется в среднем представлении класса.
  id: 024-prompt-ensemble-2
  fingerprint: d4c54935
