- concept: тип требуемого выхода определяет выбор между моделью сходства и генеративной VLM
  question: Система должна отвечать на вопросы о содержимом изображения связными фразами и объяснять свои выводы. Какой класс моделей соответствует этому требованию?
  explanation: Двухбашенные модели выдают embeddings и оценки сходства, но не генерируют объяснения. VLM соединяет визуальный энкодер с языковой моделью и может формировать текстовый ответ.
  kind: choice
  options:
    - Полноценная VLM с языковой моделью
    - Двухбашенная модель для вычисления сходства
    - Только визуальный энкодер без языкового декодера
  correct: 0
  id: 035-model-families-1
  fingerprint: c9f75b5e
- concept: OpenCLIP является открытой экосистемой реализаций и весов CLIP-подобных моделей, а не отдельным видом рассуждения
  question: Что точнее всего отличает OpenCLIP от названий CLIP и SigLIP?
  explanation: OpenCLIP — открытая экосистема реализаций и обученных сообществом вариантов CLIP. Это не генеративная VLM и не новый тип выходного ответа.
  kind: choice
  options:
    - OpenCLIP обозначает открытую реализацию и семейство доступных checkpoints
    - OpenCLIP обязательно содержит LLM для генерации ответов
    - OpenCLIP работает только как закрытый классификатор с фиксированными метками
    - OpenCLIP обозначает специальный формат текстового prompt
  correct: 0
  id: 035-model-families-2
  fingerprint: 113afa9f
- concept: выбор готовой модели требует сравнения конкретных checkpoints на целевых данных, а не доверия названию семейства
  question: Почему при выборе между готовыми весами CLIP и SigLIP недостаточно считать одно семейство моделей заведомо лучшим?
  explanation: Название семейства описывает общий подход, но не гарантирует результат конкретных весов. Практический выбор делается по проверке checkpoints на данных, похожих на продакшн.
  kind: open
  reference: Качество зависит не только от функции потерь семейства, но и от архитектуры, обучающих данных, масштаба обучения и конкретного checkpoint. Поэтому кандидатов нужно оценивать на репрезентативной выборке целевых изображений и по метрике прикладной задачи.
  id: 035-model-families-3
  fingerprint: 64c883f2
