- concept: embedding-индекс совместим только с тем же checkpoint и пайплайном подготовки данных
  question: Индекс изображений построен одной версией CLIP. Затем сервис запросов перевели на другой checkpoint, не пересчитав индекс. Почему результаты поиска могут стать некорректными?
  explanation: Embedding имеет смысл относительно конкретной модели и её препроцессинга. Даже при совпадающей размерности разные checkpoint могут располагать смыслы в пространстве по-разному, поэтому версию модели и параметры подготовки нужно хранить вместе с индексом.
  kind: choice
  options:
    - Новый checkpoint может задавать другую геометрию пространства embeddings, поэтому сходство новых запросов со старыми векторами теряет смысл
    - Любая смена checkpoint автоматически меняет идентификаторы файлов в каталоге
    - Новый checkpoint запрещает вычислять cosine similarity
    - Сохранённые embeddings можно сравнивать только в порядке их добавления в индекс
  correct: 0
  id: 037-reusable-artifacts-1
  fingerprint: 0717be31
- concept: изменение одной стороны системы требует пересчёта только зависимых от неё embeddings
  question: В CLIP-сервисе изменили только шаблоны prompts классов, а checkpoint, препроцессинг и каталог изображений оставили прежними. Что необходимо пересчитать?
  explanation: Новые prompts меняют только результаты текстового энкодера. Сохранённые embeddings изображений остаются совместимыми, если модель и обработка изображений не изменились.
  kind: choice
  options:
    - Только текстовые представления классов
    - Только embeddings изображений в каталоге
    - И текстовые представления классов, и весь индекс изображений
    - 'Ничего: формулировка prompt не влияет на embedding'
  correct: 0
  id: 037-reusable-artifacts-2
  fingerprint: 4afee99f
- concept: поисковый индекс должен сохранять соответствие между embedding и идентификатором исходного объекта
  question: Объясни своими словами, почему набора векторов изображений недостаточно для прикладного поиска и зачем каждому вектору сопоставлять идентификатор товара или путь к файлу.
  explanation: Embedding используется для ранжирования, а идентификатор связывает результат вычисления с исходными данными. Если это соответствие потеряно или нарушено, индекс может найти близкий вектор, но не сможет надёжно вернуть нужное изображение.
  kind: open
  reference: Алгоритм ближайших соседей возвращает позиции или векторы, но пользователю нужны исходные объекты. Стабильное соответствие embedding с идентификатором позволяет превратить найденного соседа в карточку товара, файл или другую запись каталога.
  id: 037-reusable-artifacts-3
  fingerprint: 91b29390
