- concept: нормализация каждого prompt embedding до усреднения предотвращает неявное взвешивание шаблонов по длине вектора
  question: Несколько текстовых embeddings одного класса усредняют, а затем нормализуют получившийся вектор. Почему важно также нормализовать каждый embedding до усреднения?
  explanation: Без предварительной нормализации длинный вектор сильнее смещает среднее в свою сторону. Нормализация только после усреднения исправит длину результата, но уже не отменит это неявное взвешивание.
  kind: choice
  options:
    - Чтобы embeddings разных шаблонов стали ортогональными
    - Чтобы шаблоны с большей нормой не сильнее влияли на направление среднего
    - Чтобы полностью устранить смысловые различия между шаблонами
    - Чтобы средний embedding совпал с одним из исходных
  correct: 1
  id: 025-code-average-embeddings-1
  fingerprint: 6bc6de66
- concept: среднее единичных embeddings обычно не имеет единичной нормы и требует повторной нормализации
  question: Объясните, почему class embedding нужно нормализовать после усреднения L2-нормированных embeddings нескольких prompt-шаблонов.
  explanation: Единичная длина исходных embeddings не сохраняется при усреднении. Поэтому нормализация нужна и до среднего — для равного вклада шаблонов, и после него — для единичной нормы итогового class embedding.
  kind: open
  reference: Среднее единичных векторов обычно лежит внутри единичной сферы и потому имеет норму меньше единичной, если направления исходных векторов не совпадают. Повторная L2-нормализация возвращает class embedding на единичную сферу для корректного сравнения по cosine similarity.
  id: 025-code-average-embeddings-2
  fingerprint: 1a0f9c44
