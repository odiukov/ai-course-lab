- concept: argmax по оси классов возвращает по одному индексу для каждой строки батча
  question: Матрица сходств построена для 7 изображений и 6 классов. Сколько элементов будет в результате argmax по оси классов?
  explanation: argmax независимо обрабатывает каждую строку матрицы сходств и возвращает индекс лучшего класса. Поэтому для 7 изображений результат содержит 7 индексов.
  kind: numeric
  answer: 7
  tolerance: 0.25
  id: 029-zero-shot-decision-1
  fingerprint: ae4026d3
- concept: индекс лучшего класса переводится в имя позиционным обращением к согласованному списку class_names
  question: Заполни пропуск так, чтобы каждый индекс предсказанного класса преобразовывался в соответствующее имя.
  explanation: Значение p — позиция победившего столбца. Обращение class_names[p] возвращает имя на той же позиции, поэтому порядок class_names должен совпадать с порядком текстовых представлений классов.
