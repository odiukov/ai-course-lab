- concept: экспоненциальная параметризация гарантирует положительную обучаемую температуру
  question: Как параметризовать обучаемый множитель для logits, чтобы оптимизатор мог свободно менять вещественный параметр a, но соответствующая температура всегда оставалась положительной?
  explanation: Если logit_scale хранит a = log(1/τ), то множитель равен exp(a), а τ = exp(−a). Экспонента всегда положительна, поэтому температура не станет нулевой или отрицательной при обучении.
  kind: choice
  options:
    - Использовать множитель exp(a), тогда температура равна exp(−a)
    - Использовать множитель a, тогда температура равна −a
    - Использовать множитель log(a), тогда температура равна log(−a)
  correct: 0
  id: 012-temperature-1
  fingerprint: b8f47a8d
- concept: верхнее ограничение logit_scale предотвращает чрезмерный рост logits
  question: Зачем в реализации CLIP могут ограничивать logit_scale сверху, хотя exp(logit_scale) уже гарантированно положителен?
  explanation: Экспонента решает только проблему допустимого знака температуры. Без верхнего ограничения масштаб способен неограниченно расти, делая распределение почти вырожденным и вычисления менее устойчивыми.
  kind: open
  reference: 'Положительность не ограничивает величину масштаба: exp(logit_scale) может стать очень большим. Верхняя граница предотвращает чрезмерно крупные logits, слишком резкий softmax и связанные с этим проблемы численной устойчивости и обучения.'
  id: 012-temperature-2
  fingerprint: 7aaac7f7
