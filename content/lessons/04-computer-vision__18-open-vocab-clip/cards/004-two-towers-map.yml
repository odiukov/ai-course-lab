- concept: две независимые башни сопоставляют изображение и текст без генерации промежуточной подписи
  question: Объясни своими словами, почему CLIP не требуется сначала генерировать текстовое описание изображения, чтобы сопоставить его с подписью.
  explanation: Image encoder работает с пикселями, а text encoder — с токенами. Их выходы имеют согласованную размерность и после L2-нормировки сравниваются по cosine similarity, поэтому этап генерации подписи не нужен.
  kind: open
  reference: Изображение и подпись обрабатываются разными энкодерами. Каждый энкодер сразу преобразует свой вход в вектор общего семантического пространства, после чего соответствие определяется сравнением этих векторов, а не сравнением сгенерированных строк.
  id: 004-two-towers-map-2
  fingerprint: 5ea3de43
