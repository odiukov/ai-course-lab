- concept: текстовое описание задаёт новый класс во время инференса без изменения параметров CLIP
  question: В список категорий CLIP добавили описание «защитная каска с трещиной». Что происходит с моделью?
  explanation: Добавление описания не меняет веса CLIP. Текст превращается в embedding нового кандидата, который модель сопоставляет с embedding изображения. Если убрать описание из списка, соответствующий вариант ответа исчезнет.
  kind: choice
  options:
    - CLIP обновляет веса текстового энкодера по новому описанию
    - Описание кодируется как кандидат класса и сравнивается с изображением в общем пространстве признаков
    - CLIP автоматически создаёт размеченный датасет для новой категории
    - Зрительный энкодер переобучается распознавать сочетание каски и трещины
  correct: 1
  id: 002-open-vocab-1
  fingerprint: 15b17990
- concept: zero-shot перенос опирается на заранее выученное соответствие между визуальными и языковыми смыслами
  question: Почему CLIP может распознавать новую категорию по текстовому описанию, не получив размеченных изображений именно этой категории?
  explanation: 'Это zero-shot перенос: модель не изучает новую категорию с нуля, а применяет связь языка и изображения, освоенную при обучении на парах «картинка — подпись». Текст формулирует доступный модели смысл, а не добавляет новые знания в её веса.'
  kind: open
  reference: Во время предварительного обучения CLIP научилась помещать связанные изображения и тексты рядом в общем пространстве признаков. Поэтому на инференсе она может использовать уже выученные визуальные и языковые понятия и их сочетания, хотя параметры модели для новой категории не обновлялись.
  id: 002-open-vocab-2
  fingerprint: bb02bc94
