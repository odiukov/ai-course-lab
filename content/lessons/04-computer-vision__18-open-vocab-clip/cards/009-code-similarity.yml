- concept: транспонирование батча текстов позволяет получить сходства всех изображений со всеми текстами
  question: Заполни пропуск так, чтобы строки содержали изображения, столбцы — тексты, а результат был матрицей попарных сходств.
  explanation: Оба батча имеют embeddings в строках. После транспонирования текста его ось объектов становится осью столбцов, поэтому одно матричное умножение батчей 4 × 512 создаёт матрицу 4 × 4.
  kind: cloze
  template: sim_matrix = image_embeddings @ ___ / tau
  answer: text_embeddings.T
  accept:
    - text_embeddings.t()
  id: 009-code-similarity-1
  fingerprint: 62663a1c
- concept: temperature масштабирует logits сходства, не меняя их ранжирование
  question: Что произойдёт с матрицей сходства, если уменьшить положительную temperature tau, оставив embeddings неизменными?
  explanation: Деление всех logits на одно меньшее положительное число увеличивает их модуль. Это монотонное масштабирование, поэтому порядок кандидатов не меняется. При tau = 0.07 различия между оценками становятся заметно резче.
  kind: choice
  options:
    - Все оценки уменьшатся по модулю, а порядок кандидатов изменится
    - Оценки увеличатся по модулю, но порядок кандидатов сохранится
    - Матрица сходства транспонируется
    - Наибольшие оценки обязательно переместятся на диагональ
  correct: 1
  id: 009-code-similarity-2
  fingerprint: ebfb4c46
