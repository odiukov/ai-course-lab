- concept: поиск изображений переиспользует заранее вычисленные embeddings коллекции
  question: Расположи этапы CLIP-подобного поиска изображений в правильном порядке.
  explanation: Визуальный энкодер не нужно запускать заново для каждого запроса. Поиск сводится к кодированию текста и сравнению его вектора с матрицей сохранённых embeddings изображений.
  kind: order
  items:
    - Заранее вычислить и сохранить embeddings изображений коллекции
    - Получить embedding нового текстового запроса
    - Вычислить сходство запроса с сохранёнными embeddings и ранжировать изображения
  id: 036-clip-applications-1
  fingerprint: 77d57369
- concept: детекция и сегментация различаются пространственной гранулярностью сопоставляемых визуальных признаков
  question: Как общее пространство embeddings используется для локализации объекта по текстовому запросу?
  explanation: Общий принцип — сопоставление текста и визуальных признаков — сохраняется, но меняется масштаб признаков. Области-кандидаты позволяют предсказывать рамки, а плотные локальные признаки — маску объекта.
  kind: choice
  options:
    - Запрос сравнивают только с глобальным embedding изображения, а координаты выбирают случайно
    - Для детекции запрос сопоставляют с признаками областей-кандидатов, а для сегментации — с плотными локальными признаками
    - Текстовый энкодер переобучают отдельно для каждой возможной рамки и каждого пикселя
    - Из текста сначала обязательно генерируют подпись к изображению, а затем ищут совпадающие слова
  correct: 1
  id: 036-clip-applications-2
  fingerprint: cae36082
- concept: в генеративной модели текстовый embedding служит условием для синтеза, а не итоговым результатом поиска
  question: Объясни своими словами, чем роль текстового embedding в генерации изображения отличается от его роли в поиске изображений.
  explanation: Общее пространство обеспечивает совместимое представление смысла, но не определяет форму ответа. Поисковый модуль возвращает существующие изображения, а генеративный использует текстовое условие при синтезе нового изображения.
  kind: open
  reference: В поиске текстовый embedding сравнивают с embeddings готовых изображений и ранжируют их по сходству. В генерации он передаёт смысл запроса генеративному модулю и направляет создание новых пикселей из шума; ближайшее готовое изображение не является результатом этой процедуры.
  id: 036-clip-applications-3
  fingerprint: d8f63b8f
