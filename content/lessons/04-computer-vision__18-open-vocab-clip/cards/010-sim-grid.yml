- concept: число внутрибатчевых отрицательных пар равно N(N−1)
  question: Батч содержит 6 согласованных пар «изображение — подпись». Сколько внедиагональных пар в полной матрице похожести служат отрицательными примерами?
  explanation: В матрице 6×6 всего 36 элементов, из которых 6 диагональных соответствуют правильным парам. Остаётся 36−6=30 отрицательных пар. В общем случае их число равно N²−N=N(N−1).
  kind: numeric
  answer: 30
  tolerance: 0.01
  id: 010-sim-grid-1
  fingerprint: 22afc7a0
- concept: кросс-энтропия требует, чтобы правильная подпись имела наибольший logit в строке
  question: В строке матрицы похожести правильная подпись получила высокий logit, но одна неправильная подпись получила ещё более высокий. Как это оценивает loss изображения-в-текст?
  explanation: 'Строчная cross-entropy превращает все подписи батча в конкурирующие варианты. Ей недостаточно высокого абсолютного сходства: вероятность правильного диагонального индекса уменьшается, если какой-либо внедиагональный logit оказывается выше.'
  kind: choice
  options:
    - Считает ответ ошибочным, потому что правильный диагональный элемент должен победить все остальные элементы строки
    - Считает строку правильной, потому что абсолютное значение logit правильной подписи высокое
    - Игнорирует неправильную подпись, поскольку она находится вне диагонали
    - Сравнивает правильный logit только с диагональными элементами других строк
  correct: 0
