- concept: порядок подготовки одиночного изображения для визуального энкодера OpenCLIP
  question: Расположите операции подготовки изображения к вызову визуального энкодера OpenCLIP.
  explanation: Преобразования приводят изображение к ожидаемым размеру, типу tensor и нормализации. Затем добавляется ось батча, поскольку encode_image принимает батч изображений, даже если изображение всего одно.
  kind: order
  items:
    - Загрузить изображение как объект PIL
    - Применить инференс-преобразования выбранной модели
    - Добавить ведущую ось батча
    - Передать полученный tensor в encode_image
  id: 034-openclip-pipeline-1
  fingerprint: ed141181
- concept: текстовый энкодер сохраняет соответствие между строками батча токенов и входными подписями
  question: Список текстовых подписей токенизировали одним вызовом и передали в encode_text. Как соотносятся входные подписи и выходные embeddings?
  explanation: 'Tokenizer формирует батч последовательностей токенов: одна строка на подпись. encode_text преобразует каждую такую строку в отдельный embedding, сохраняя порядок подписей в батче.'
  kind: choice
  options:
    - Все подписи объединяются в одну последовательность и дают один общий embedding
    - Каждой подписи соответствует строка идентификаторов токенов, а затем отдельная строка embedding
    - Для каждой подписи создаётся отдельная копия текстового энкодера
    - encode_text возвращает embedding для каждого отдельного токена, но не для подписи целиком
  correct: 1
  id: 034-openclip-pipeline-2
  fingerprint: 13a5be1d
- concept: препроцессор и токенизатор должны соответствовать конфигурации и весам модели
  question: Почему для OpenCLIP нельзя без проверки заменить штатные preprocess и tokenizer произвольными аналогами, даже если они тоже возвращают tensors?
  explanation: Совместимость определяется не только типом и формой tensor. Изображения должны быть масштабированы и нормализованы согласно ожиданиям весов, а идентификаторы токенов должны обозначать именно те элементы словаря, на которых обучался текстовый энкодер.
  kind: open
  reference: Веса модели обучались с конкретной обработкой изображений и конкретным словарём, специальными токенами и правилами формирования текстовых последовательностей. Другие преобразования могут создать tensor допустимой формы, но с иной семантикой значений, поэтому энкодеры получат входы не из того распределения или неверно интерпретируют идентификаторы токенов.
  id: 034-openclip-pipeline-3
  fingerprint: b88e69ca
