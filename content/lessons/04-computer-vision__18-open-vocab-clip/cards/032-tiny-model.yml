- concept: MLP над заранее извлечёнными признаками обучает проекцию, но не извлечение признаков из сырых данных
  question: Объясни, чем по возможностям MLP-башня над заранее извлечёнными признаками отличается от энкодера, который получает сырые пиксели или токены.
  explanation: Учебная модель сохраняет интерфейс двухбашенной системы, но не её полную способность строить представления из сырых данных. Качество такой модели ограничено информативностью заранее извлечённых признаков и мощностью небольших проекций.
  kind: open
  reference: MLP-башня может преобразовывать и выравнивать только уже предоставленные признаки. Она не учится извлекать визуальные или языковые признаки непосредственно из пикселей и токенов, поэтому не воспроизводит всю выразительность ViT или текстового трансформера.
  id: 032-tiny-model-2
  fingerprint: d1428f38
- concept: нелинейность между полносвязными слоями не позволяет свернуть MLP в одну аффинную проекцию
  question: Что произойдёт с проекционной башней, если убрать ReLU между последовательными слоями Linear?
  explanation: Композицию аффинных преобразований можно записать как одно аффинное преобразование. ReLU добавляет нелинейность, благодаря которой MLP способен задавать более сложное отображение исходных признаков в пространство embeddings.
  kind: choice
  options:
    - Последовательность линейных слоёв станет эквивалентна одной аффинной проекции
    - Выход автоматически станет вектором единичной нормы
    - Башня перестанет поддерживать обратное распространение ошибки
    - Размерность входных признаков должна будет совпасть с размерностью выхода
  correct: 0
