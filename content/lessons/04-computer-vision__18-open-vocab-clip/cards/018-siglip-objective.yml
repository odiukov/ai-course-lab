- concept: знаковая метка объединяет положительные и отрицательные пары в одной формуле потерь
  question: Заполни аргумент softplus для SigLIP, где y — знаковая метка пары, а z — её логит.
  explanation: 'При верном предсказании произведение y·z положительно: совпавшая пара имеет высокий логит, а несовпавшая — низкий. Поэтому аргумент −y·z отрицателен и штраф мал. Ошибка меняет знак произведения и увеличивает loss.'
  kind: cloze
  template: L = mean(softplus(___))
  answer: -y * z
  accept:
    - -y*z
    - -(y*z)
    - -(y * z)
  id: 018-siglip-objective-1
  fingerprint: eb6d7bbc
- concept: softplus численно устойчиво вычисляет логистическую потерю без переполнения экспоненты
  question: При большом положительном аргументе прямое вычисление log(единица + exp(u)) может переполниться. Как вычислить математически тот же штраф устойчиво?
  explanation: Softplus возвращает log(1 + exp(u)), но реализация перестраивает вычисления для больших аргументов и не создаёт переполняющееся значение exp(u). Это меняет только численную устойчивость, а не смысл loss.
  kind: choice
  options:
    - Использовать готовую функцию softplus(u)
    - Заменить выражение на sigmoid(u)
    - Применить softmax к одному скаляру
    - Всегда обнулять положительные значения u
