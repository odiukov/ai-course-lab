- concept: усреднение направленных потерь сохраняет равный вклад направлений и контролирует масштаб градиента
  question: В симметричном CLIP loss среднее потерь image-to-text и text-to-image заменили их суммой. Что изменится для градиента именно этого контрастивного члена?
  explanation: Сумма содержит те же направленные ошибки с теми же относительными весами, что и среднее, но масштабирует весь контрастивный градиент сильнее. Это меняет динамику оптимизации, хотя само предпочтительное решение этой потери остаётся тем же.
  kind: choice
  options:
    - Общий масштаб градиента возрастёт, но относительный вклад направлений останется одинаковым
    - Градиент будет учитывать только направление image-to-text
    - Текстовые эмбеддинги перестанут получать градиенты
    - Изменится расположение правильных пар в матрице сходств
