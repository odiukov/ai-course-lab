- concept: экспонента в softmax превращает разрывы между logits в мультипликативное преимущество
  question: Масштабированные logits трёх классов равны 8, 4 и −6. Какую вероятность в процентах softmax присвоит первому классу?
  explanation: Вероятность равна exp(8) / (exp(8) + exp(4) + exp(−6)) ≈ 98,2%. После экспоненцирования преимущество первого logit становится намного выраженнее.
  kind: numeric
  answer: 98.2
  tolerance: 0.08
  id: 027-zero-shot-probs-1
  fingerprint: 07c89b46
- concept: softmax не меняется при одинаковом аддитивном сдвиге всех logits
  question: К каждому logit кандидатов прибавили одну и ту же константу. Как изменятся вероятности после softmax?
  explanation: 'В каждом члене появляется общий множитель exp(c): exp(l_i + c) = exp(c)exp(l_i). Он сокращается с таким же множителем в знаменателе, поэтому softmax зависит от разностей logits, а не от их общего сдвига.'
  kind: choice
  options:
    - Распределение станет более резким
    - Распределение приблизится к равномерному
    - Вероятности останутся прежними
  correct: 2
  id: 027-zero-shot-probs-2
  fingerprint: efa875f4
