- concept: поиск по библиотеке навыков — конвейер из отдельных стадий, где нормализация запроса предшествует скорингу, а отсечение по релевантности предшествует срезу
  question: Функция поиска по библиотеке навыков получает библиотеку, запрос и k, а возвращает список записей навыков. Расставь стадии её работы в правильном порядке.
  explanation: 'Скоринг, ранжирование и отсечение — три разных действия, и порядок между ними не свободен. Нормализация обязана быть первой: несовпадение регистра между запросом и описанием обнуляет все баллы. Фильтр нулей обязан стоять до среза: после среза k слотов уже заняты мусором. Возвращать надо записи навыков — вызывающий код собирает из них композицию, индексы ему бесполезны.'
  kind: order
  items:
    - Привести запрос к той же нормализации, которая применялась к описаниям при записи
    - Посчитать балл сходства запроса с описанием каждого навыка библиотеки
    - Отбросить кандидатов с нулевым баллом сходства
    - Отсортировать оставшихся по убыванию балла
    - Взять первые k и вернуть сами записи навыков
    - Отдать вызывающему коду список записей, а не индексов и не баллов
  id: 017-code-search-1
  fingerprint: b545bd78
- concept: 'top-k сам по себе не содержит порога релевантности: без явной отсечки функция вернёт ровно k записей независимо от того, похоже ли хоть что-то на запрос'
  question: 'В библиотеке 7 навыков. Приходит запрос из слов, которых нет ни в одном описании: все баллы сходства равны нулю. Функция поиска сортирует по убыванию и возвращает срез первых k=4. Что она вернёт и почему это проблема?'
  explanation: 'Срез списка не спрашивает, насколько хороши элементы, — он берёт столько, сколько попросили, если они есть. Ранжирование задаёт порядок, а не порог. Порог нужен отдельным шагом: отбросить нулевые пересечения до среза. Это и проверяется запросом из несуществующих слов — правильный ответ на него пустой список, а не k случайных навыков.'
  kind: choice
  options:
    - 'Вернёт пустой список: сортировка по нулевым баллам ничего не пропускает дальше'
    - Вернёт 4 произвольных навыка — сортировка нулей стабильна, срез всё равно берёт первые четыре; в промпт уедут записи, не имеющие к задаче отношения
    - 'Вернёт все 7 навыков: при нулевых баллах k игнорируется'
    - Упадёт с исключением, потому что максимальный балл равен нулю
