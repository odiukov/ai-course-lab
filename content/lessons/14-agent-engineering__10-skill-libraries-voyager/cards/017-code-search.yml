- concept: стабильность сортировки задаёт детерминированный тай-брейк по порядку регистрации при равных баллах сходства
  question: Пять навыков получили одинаковый балл сходства с запросом, k=2. Что определяет, какие два из них попадут в результат при сортировке по убыванию балла в Python?
  explanation: '`sorted` в Python стабилен: элементы с равным ключом остаются в том же взаимном порядке, в каком лежали. Значит, тай-брейк не случаен — это время регистрации. Свойство полезное: результат поиска воспроизводим от запуска к запуску. Если нужен другой тай-брейк (например, свежая версия вперёд), его задают вторым компонентом ключа сортировки явно, а не надеются на порядок списка.'
  kind: choice
  options:
    - 'Порядок случаен: при равных ключах перестановка непредсказуема'
    - Побеждают навыки с более короткими описаниями — они считаются точнее
    - Сортировка стабильна, поэтому равные баллы сохраняют исходный порядок списка, то есть порядок регистрации навыков в библиотеке
    - Побеждает навык с наибольшим номером версии — сравнение падает на второй ключ
