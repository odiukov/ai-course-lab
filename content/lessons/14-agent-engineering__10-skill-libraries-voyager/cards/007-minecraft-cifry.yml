- concept: прирост по широте охвата и прирост по времени до раннего порога — разные величины, потому что зависят от разных свойств задачи
  question: Объясни своими словами, почему прирост по метрике «сколько разного агент успел освоить» и прирост по метрике «за сколько времени достигнута ранняя веха» у одного и того же агента с библиотекой навыков оказываются разными по величине.
  explanation: 'Ключ: множитель — функция от того, насколько метрика чувствительна к переиспользованию. Сцепленная цепочка предпосылок = высокая чувствительность, независимое исследование = низкая.'
  kind: open
  reference: 'Широта охвата — это накопительная метрика за отведённое время: каждый новый освоенный объект добавляется примерно линейно, поэтому множитель растёт умеренно. Время до ранней вехи мерит длину цепочки строго зависимых шагов; как только каждый шаг цепочки лежит в библиотеке готовым куском кода, следующий шаг не начинается с нуля, и экономия перемножается вдоль цепочки. Поэтому на плотно сцепленных участках множитель заметно выше. Метрики, слабо зависящие от переиспользования (например, дальность продвижения по местности), дают самый скромный прирост — в Voyager это 2,3x против 8,5x.'
  id: 007-minecraft-cifry-3
