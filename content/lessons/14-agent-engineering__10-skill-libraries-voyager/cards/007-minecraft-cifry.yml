- concept: из доменного бенчмарка переносится структурный паттерн выигрыша, а не численный множитель
  question: Вы прочитали бенчмарк агента с библиотекой навыков в игровой среде и хотите применить вывод к своему агенту в другой предметной области. Что корректно перенести?
  explanation: 'Множители измерены в конкретной среде с конкретной структурой зависимостей и вне её не воспроизводятся. Переносится механизм: выигрыш возникает там, где шаги сцеплены и переиспользование готового навыка убирает повторный вывод. Свой множитель придётся мерить самому.'
  kind: choice
  options:
    - 'Ожидание, что ускорение будет того же порядка: множители устойчивы между доменами'
    - 'Паттерн: искать в своей задаче цепочки сцепленных шагов — именно там накопленные навыки дадут максимальный выигрыш'
    - Только сам факт, что библиотека навыков не вредит — количественных выводов делать нельзя вообще
    - 'Порядок метрик: широта охвата всегда обгоняет время до вехи'
