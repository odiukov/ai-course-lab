- concept: конструктор записи проверяет обязательные поля на входе и падает исключением, вместо того чтобы сохранить структурно битую запись
  question: Конструктор записи навыка получает пустое имя или пустой код и бросает `ValueError` вместо того, чтобы создать запись с пустыми полями. Объясни своими словами, чем это лучше для библиотеки навыков.
  explanation: Это обычный fail-fast на границе. Валидация в конструкторе стоит несколько строк, но снимает проверки со всех потребителей записи и превращает отложенный молчаливый сбой поиска в громкую ошибку на записи.
  kind: open
  reference: 'Единственная точка записи — единственное место, где ещё известен виновник. Битая запись не падает сразу: она молча оседает в библиотеке и взрывается позже — при попытке вызвать пустой код или при поиске, который вернул безымянную запись. Стек-трейс в этот момент указывает на потребителя, а не на того, кто записал мусор. Проверка на входе локализует ошибку в момент её появления и удерживает инвариант библиотеки: любая хранимая запись именована и исполнима, поэтому код поиска и композиции может не писать защиту от пустых полей.'
