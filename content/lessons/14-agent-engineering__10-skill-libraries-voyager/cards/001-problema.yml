- concept: 'три системных провала агента без персистентной библиотеки навыков: перерасход токенов, потеря выученных правок, неспособность к длинногоризонтной композиции'
  question: Агент решает задачи только внутри сессии и ничего не сохраняет наружу. Какой из перечисленных провалов НЕ относится к списку проблем, которые решает библиотека навыков Voyager?
  explanation: 'Voyager чинит три вещи: waste tokens, lose progress, fail on long-horizon composition. Все три — про отсутствие внешнего хранилища способностей, а не про размер или качество самой модели. Библиотека навыков не делает модель умнее; она даёт куда складывать уже сделанное.'
  kind: choice
  options:
    - Одно и то же рассуждение заново вытягивается из модели в каждой сессии — перерасход токенов
    - Правка, выученная в одной сессии, не переносится в следующую — потеря прогресса
    - Сложные задачи требуют иерархии способностей, и одним промптом её не выразить — провал на длинном горизонте
    - Модель хуже предсказывает следующий токен, потому что у неё меньше параметров
  correct: 3
  id: 001-problema-1
  fingerprint: 5f4c01d4
- concept: количественная цена повторного вывода одного и того же рассуждения без сохранения навыка
  question: Объяснение процедуры занимает 900 токенов и заново воспроизводится в каждой из 35 сессий, потому что агент нигде его не хранит. Сколько токенов уходит на повторение одного и того же рассуждения?
  explanation: 900 × 35 = 31 500 токенов на один и тот же вывод. Записанный один раз навык оплачивается однократно, дальше платится только за извлечение. Это прямая арифметика пункта «waste tokens».
  kind: numeric
  answer: 31500
  tolerance: 1
  id: 001-problema-2
  fingerprint: 88f1f01c
- concept: 'цикл жизни навыка в Voyager: извлечение по похожести, запуск, доработка по обратной связи, запись обратно'
  question: Расставь шаги работы Voyager с библиотекой навыков при новой задаче в правильном порядке.
  explanation: 'Ключ цикла: навык — это код, а не мысль, поэтому его можно извлечь по похожести, исполнить, а результат исполнения использовать как сигнал для правки. Без последнего шага (записи обратно) агент снова теряет прогресс между сессиями.'
  kind: order
  items:
    - Найти в библиотеке навыки, похожие на новую задачу, по описанию
    - Достать код найденного навыка и запустить его на задаче
    - Получить обратную связь от запуска (результат выполнения или ошибку)
    - Переписать код навыка с учётом этой обратной связи
    - Положить улучшенный именованный навык обратно в библиотеку
  id: 001-problema-3
  fingerprint: 7ea82ebd
