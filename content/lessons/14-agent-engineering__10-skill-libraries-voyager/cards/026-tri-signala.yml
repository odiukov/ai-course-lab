- concept: error несёт локализацию правки (строку стека), self-verification failure локализации не даёт и требует пересмотра логики навыка
  question: Агент Voyager получил два неудачных запуска одного навыка. В первом интерпретатор бросил исключение со стек-трейсом; во втором код отработал без исключений, вернул управление, но целевой предмет в инвентаре не появился. Почему записывать оба исхода одним булевым флагом «не вышло» — потеря информации?
  explanation: 'Сигналы различаются не степенью неуспеха, а тем, куда смотреть при переписывании. `error` приносит трейс: видно упавшую строку и что именно пришло на вход, правка бывает в пару символов. `self-verification failure` говорит, что исполнение прошло чисто, значит чинить по трейсу нечего — неверна логика навыка. Схлопывание в один флаг выбрасывает ровно ту часть сигнала, которая направляет правку.'
  kind: choice
  options:
    - Флаг не хранит время исполнения, а без него нельзя оценить стоимость навыка
    - Стек-трейс указывает конкретную строку и точку правки, а провал самопроверки такой точки не даёт и означает, что переписывать надо замысел навыка целиком
    - Булев флаг нельзя положить в векторный индекс библиотеки навыков
    - Исключение всегда фатально, а провал самопроверки всегда чинится повторным запуском того же кода
  correct: 1
  id: 026-tri-signala-1
  fingerprint: ea172c32
- concept: self-verification failure порождает отдельный проверяющий, сравнивающий состояние среды с целью задачи, а не рантайм языка
  question: Кто в цикле Voyager выдаёт сигнал `self-verification failure`?
  explanation: 'Интерпретатор умеет сообщить только `success` и `error`: он видит исполнение, но не видит цели. Суждение «получилась каменная кирка или палка» выносит отдельный проверяющий по состоянию среды — инвентарю. Поэтому третий сигнал приходит из другого источника, чем второй.'
  kind: choice
  options:
    - Рантайм языка — как обработанное исключение особого типа
    - Отдельный проверяющий, который смотрит на состояние среды после запуска и сверяет его с целью задачи
    - Генератор учебного плана, когда следующая задача оказывается недостижимой
    - Поиск по библиотеке навыков, когда сходство описаний ниже порога
  correct: 1
  id: 026-tri-signala-2
  fingerprint: b046604c
- concept: Voyager — Self-Refine с критикой, заземлённой на среду; в CRITIC ту же роль критика играют внешние инструменты
  question: Цикл «сгенерировал — получил сигнал — переписал» у Voyager — это Self-Refine. Чем в нём заменена критика и как это соотносится с CRITIC?
  explanation: 'Все три схемы — один цикл доработки по обратной связи; различает их источник обратной связи. У Voyager он двойной: рантайм даёт `error`, проверяющий состояния среды даёт `self-verification failure`, и оба независимы от модели, писавшей навык.'
  kind: open
  reference: 'В базовом Self-Refine критику своего же вывода порождает сама модель, поэтому её ограничивает то же незнание, что и генерацию. Voyager заменяет самокритику проверкой, заземлённой на среду: код запускается, и вердикт выносит наблюдаемое состояние мира (появился предмет в инвентаре или нет) плюс стек-трейс интерпретатора. Критика перестаёт быть мнением модели и становится фактом. CRITIC — тот же паттерн с тем же смещением источника: там роль критика играют внешние инструменты (поиск, калькулятор, интерпретатор), проверяющие утверждения модели снаружи. Общий принцип: качество цикла доработки определяется тем, насколько критик независим от генератора.'
  id: 026-tri-signala-3
  fingerprint: b87667e2
