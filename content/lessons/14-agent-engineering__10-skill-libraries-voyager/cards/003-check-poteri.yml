- concept: 'критерий отбора: в библиотеку навыков идёт знание, которого нет в модели и которое понадобится повторно'
  question: Что из перечисленного — наиболее подходящий кандидат на запись в библиотеку навыков агента?
  explanation: 'Записывать стоит то, что одновременно (1) отсутствует в модели и (2) понадобится снова. Определение JOIN проваливает первый критерий, разовый факт про файл — второй, сырой лог — оба: это не именованная переиспользуемая способность, а мусор, который потом ещё и не найдётся по похожести.'
  kind: choice
  options:
    - Общеизвестное определение SQL JOIN, которое модель воспроизводит без подсказок
    - Проектное правило деплоя, выведенное после разбора инцидента, нужное в каждом релизе
    - Одноразовый ответ на вопрос «сколько строк в этом файле сегодня»
    - Полный лог последней неудачной сессии целиком
  correct: 1
