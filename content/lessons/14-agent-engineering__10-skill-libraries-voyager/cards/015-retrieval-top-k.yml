- concept: объём извлечённого контекста задаётся k, а не размером библиотеки, поэтому рост библиотеки не увеличивает промпт
  question: Агент ищет навыки по эмбеддингам описаний и всегда берёт top-k с k=6. Каждый навык занимает около 25 строк кода. Библиотека выросла со 128 навыков до 2048. Сколько примерно строк кода навыков попадёт в промпт после роста?
  explanation: 'В промпт уезжают ровно k записей: 6 × 25 = 150 строк, и до роста было столько же. Размер библиотеки влияет на стоимость поиска в векторном индексе, но не на объём контекста — это и есть смысл top-k.'
  kind: numeric
  answer: 150
  tolerance: 1
  id: 015-retrieval-top-k-1
  fingerprint: df5a5aa6
- concept: 'k — параметр с двусторонним компромиссом: слишком маленькое k теряет нужный примитив, слишком большое возвращает нерелевантные записи'
  question: Инженер настраивает retrieval навыков и увеличивает k с 2 до 40. Что произойдёт с работой агента?
  explanation: 'k — ручка между двумя провалами. Малое k (1–2) рискует не отдать агенту нужный примитив, и он напишет его заново. Большое k возвращает к исходной проблеме — шуму в промпте, просто в меньшем масштабе. Отсечение по сходству само по себе лишнее не убирает: ранжирование всегда вернёт ровно k верхних записей, даже если релевантных было две.'
  kind: choice
  options:
    - Полнота вырастет, но вместе с нужными навыками вернутся нерелевантные, и агент начнёт опираться на них
    - 'Качество монотонно вырастет: чем больше навыков в промпте, тем точнее композиция'
    - 'Ничего не изменится: сходство отсекает лишнее независимо от k'
    - Поиск станет точнее, потому что усреднение по большему числу соседей снижает шум эмбеддингов
  correct: 0
  id: 015-retrieval-top-k-2
