- concept: нерелевантные навыки в контексте не просто занимают место, а искажают выбор модели
  question: Допустим, контекстное окно бесконечное и вся библиотека из 900 навыков влезает в промпт целиком. Почему top-k всё равно предпочтительнее полной выгрузки?
  explanation: Главный эффект top-k — не размер промпта, а сужение множества кандидатов до тех, что реально близки к задаче. Полная выгрузка перекладывает отбор на модель, у которой качество отбора падает с ростом числа вариантов.
  kind: open
  reference: 'Экономия контекста — не единственная причина. Нерелевантные навыки работают как отвлекающие кандидаты: модель может зацепиться за похожее по форме, но не подходящее по задаче умение и построить композицию вокруг него. Чем больше кандидатов, тем выше шанс такого промаха и тем хуже точность выбора. Плюс остаются цена и латентность обработки длинного промпта. Retrieval сдвигает выбор из модели в векторный поиск, где он дешевле и предсказуемее.'
  id: 015-retrieval-top-k-3
  fingerprint: 5fa96c0c
