- concept: 'операциональный критерий следующей задачи: максимум опоры на готовые навыки при ровно одном неизвестном ходе'
  question: Сформулируй, по какому операциональному критерию генератор задач отбирает следующую цель для агента с библиотекой навыков, и почему именно такой критерий даёт прирост библиотеки.
  explanation: 'Критерий двусторонний: снизу его держит требование новизны (иначе библиотека не растёт), сверху — требование разрешимости обратной связью (иначе итерации не сходятся). В продакшене тот же критерий формулируется как вопрос «чего в библиотеке ещё нет из того, что нужно предметной области», и команды обычно отвечают на него вручную, ревью программы обучения.'
  kind: open
  reference: 'Задача отбирается так, чтобы большая её часть собиралась композицией уже сохранённых навыков, а неизвестным оставался ровно один (или очень небольшое число) новый ход. Вход критерия — состояние среды вместе с инвентарём навыков, а не что-то одно из двух. Такой отбор даёт прирост, потому что выполняет оба условия сразу: есть что записать в библиотеку (новый ход отсутствует в записях, значит его код не будет отброшен дедупликацией), и есть шанс дописать его за несколько итераций, поскольку любой провал локализуется на единственном непокрытом месте, а не размазан по десятку недостающих предпосылок.'
