- concept: диагностическая ценность провала падает с ростом числа недостающих предпосылок, поэтому задача сильно выше уровня не чинится итерациями
  question: Агенту с 14 навыками выдали задачу, для которой не хватает восьми разных недостающих умений сразу. Почему цикл итеративной доработки кода здесь, скорее всего, не сойдётся?
  explanation: Обратная связь полезна ровно настолько, насколько узко она локализует проблему. Один недостающий ход даёт сигнал, указывающий на конкретное место; двадцать недостающих ходов дают ошибку на первой строке, и бюджет итераций сгорает, не приблизив к решению. Отсюда верхняя граница зоны исследования.
  kind: choice
  options:
    - Потому что трассировка ошибки указывает на первое же падение и не сообщает про остальные семь пробелов — каждая итерация чинит одно место, а задача остаётся невыполнимой
    - Потому что модель отказывается генерировать код для задач, помеченных как слишком сложные
    - Потому что при восьми пробелах самопроверка всегда возвращает успех и цикл завершается преждевременно
    - Потому что извлечение по похожести не работает, когда в библиотеке больше десяти навыков
