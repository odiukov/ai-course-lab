- concept: имя навыка дописывается в результат после возврата из рекурсии по его зависимостям, а не до спуска
  question: Функция разворачивает транзитивные зависимости навыка в линейный список, пригодный для последовательной загрузки. Чем закончить тело?
  explanation: 'Порядок определения обязан предшествовать порядку вызова, поэтому навык записывается только после того, как записаны все, от кого он зависит. Это постфиксный обход: append стоит после цикла. Перенести append до цикла — получить обратный порядок, где навык стоит раньше своих зависимостей и упадёт на неопределённом имени.'
  kind: cloze
  template: |-
    def dependency_order(library, name, seen, out):
        if name in seen:
            return out
        seen.add(name)
        for dep in library[name].depends_on:
            dependency_order(library, dep, seen, out)
        ___
        return out
  answer: out.append(name)
  accept:
    - out.append(name)
    - out += [name]
    - out.extend([name])
  id: 020-code-dependency-order-1
  fingerprint: fdbd248c
- concept: общая зависимость, встреченная в обходе несколько раз, должна остаться в самой ранней позиции, а не в самой поздней
  question: 'Библиотека: `deploy` зависит от `build` и `migrate`; и `build`, и `migrate` зависят от `fetch_deps`. При обходе `fetch_deps` встречается дважды. Почему повтор нужно гасить, оставляя первое вхождение, а не перезаписывать позицию на последнее?'
  explanation: 'Инвариант списка один: каждое имя правее всех, кого оно вызывает. Самое раннее вхождение — единственное, которое этот инвариант держит для всех потребителей сразу. Правильный результат: `fetch_deps`, `build`, `migrate`, `deploy`. Если позицию двигать вперёд на каждое повторное посещение, `fetch_deps` уедет за `build` и определение окажется позже вызова.'
  kind: choice
  options:
    - Первое вхождение стоит перед обоими потребителями; сдвиг на последнее поставит `fetch_deps` после `build`, который его вызывает
    - Первое вхождение содержит более свежую версию кода навыка
    - Последнее вхождение всегда дубль с другим описанием и должно отбрасываться при записи в библиотеку
    - 'Порядок вхождений не важен: интерпретатор разрешает имена лениво'
  correct: 0
  id: 020-code-dependency-order-2
  fingerprint: a2a24400
- concept: имя в depends_on, отсутствующее в библиотеке, при молчаливом пропуске превращает ошибку сборки порядка в ошибку исполнения
  question: В `depends_on` навыка стоит имя, которого в библиотеке нет. Чем плох вариант «молча пропустить неизвестное имя»?
  explanation: 'Порядок у оставшихся имён останется верным — сломается полнота: нужного определения в списке просто не будет. Ошибка всплывёт при исполнении, вдали от причины. Поэтому политику выбирают явно: либо исключение с именем недостающего навыка на месте, либо пропуск с записью в лог. Недопустимо только оставить поведение необъявленным.'
  kind: choice
  options:
    - Функция вернёт внешне корректный список, а падение произойдёт позже — на вызове неопределённого имени, уже вне кода сборки порядка
    - Пропуск нарушит топологический порядок остальных навыков в списке
    - Пропуск заставит обход зациклиться на оставшихся зависимостях
    - Пропуск удалит запись о зависимости из самой библиотеки
