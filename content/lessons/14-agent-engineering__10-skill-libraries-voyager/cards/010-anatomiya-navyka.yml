- concept: список зависимостей навыка задаёт порядок загрузки и исполнения при композиции
  question: 'Библиотека навыков собирает составной навык. Записи: `craftStick` (зависимостей нет), `craftIronPickaxe` (зависит от `craftStick`), `mineDiamond` (зависит от `craftIronPickaxe`), `craftDiamondSword` (зависит от `craftStick` и `mineDiamond`). Расставь навыки в порядке, в котором их должна подать библиотека.'
  explanation: 'Поле зависимостей превращает библиотеку в направленный граф, и рабочий порядок — его топологическая сортировка: навык не может быть исполнен раньше тех, кого вызывает внутри себя. Без этого поля извлечённый в одиночку `craftDiamondSword` упадёт с ошибкой «функция не определена» на первом же внутреннем вызове.'
  kind: order
  items:
    - craftStick
    - craftIronPickaxe
    - mineDiamond
    - craftDiamondSword
  id: 010-anatomiya-navyka-1
  fingerprint: da8e14f8
- concept: версия упорядочивает редакции одного и того же навыка во времени и даёт понятие «актуальная запись»
  question: Навык `smeltOre` упал при запуске, агент переписал его код и сохраняет результат. Что даёт библиотеке поле версии, которого не даёт запись исправленного кода как отдельной записи?
  explanation: 'Доработка порождает не второй навык, а вторую редакцию первого. Версия задаёт на редакциях порядок «новее — старее»: без неё в библиотеке лежат два кандидата с почти одинаковым описанием, и ни выбрать актуальный, ни откатиться на рабочий предыдущий нельзя. Проверку успешности версия не выполняет — это дело самопроверки перед записью.'
  kind: choice
  options:
    - Оно связывает новый код со старой записью как её более позднюю редакцию, поэтому библиотека знает, какая из них актуальна, и может вернуть к предыдущей
    - Оно ускоряет поиск, потому что версия участвует в сравнении запроса с описанием навыка
    - Оно гарантирует, что новый код не упадёт, потому что версия присваивается только после успешной проверки
    - 'Оно заменяет список зависимостей: по номеру версии видно, какие навыки вызываются внутри'
  correct: 0
  id: 010-anatomiya-navyka-2
  fingerprint: 93f9d5d6
- concept: имя навыка — стабильный идентификатор для вызова из других навыков, отдельный от описания, по которому идёт поиск
  question: Зачем навыку нужно короткое имя, если для поиска библиотека всё равно использует описание?
  explanation: 'У двух полей разные адресаты. Описание читает поиск — им агент спрашивает библиотеку словами. Имя читает код: `craftIronPickaxe` внутри вызывает `mineIron` и `craftStick` именно по именам, и по ним же составлен список зависимостей. Поэтому имя должно оставаться стабильным между редакциями, тогда как описание можно переписывать свободно.'
  kind: choice
  options:
    - Имя — адрес, по которому на навык ссылается код других навыков и список зависимостей; смена имени ломает эти вызовы
    - Имя нужно только для читаемости логов, на работу библиотеки оно не влияет
    - По имени библиотека определяет версию навыка, поэтому в имя дописывают номер редакции
    - 'Имя задаёт приоритет в выдаче: при равной похожести описаний выигрывает навык с более коротким именем'
  correct: 0
