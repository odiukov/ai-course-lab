- concept: 'результат поиска по библиотеке определяет режим работы: попадание даёт композицию из готовых навыков, промах требует написать новую логику, которая затем сама становится записью'
  question: Агент получает задачу и делает top-k поиск по библиотеке навыков. Объясни, чем дальнейшая работа агента отличается в случае, когда поиск вернул подходящие навыки, и в случае, когда ничего релевантного не нашлось.
  explanation: 'Оба режима нужны. Если бы поиск всегда попадал, агент не осваивал бы ничего нового; если бы всегда промахивался — библиотека не давала бы выигрыша. Ключ в том, что выход промаха становится входом будущих попаданий: навык, написанный с нуля сегодня, завтра достаётся как готовый вызов внутри более сложного навыка.'
  kind: open
  reference: 'При попадании агент не пишет решение с нуля: найденные навыки — уже отлаженные функции, и новый код сводится к вызову их в нужном порядке плюс небольшая недостающая логика. Отсюда экономия — проверенная часть работы не переоткрывается. При промахе агент пишет логику полностью сам и прогоняет её через цикл доработки по ошибкам исполнения и самопроверке; это дороже по попыткам. Промах при этом не сбой, а нормальный режим: именно он даёт библиотеке новую запись, которая при следующих задачах уже будет находиться поиском и служить деталью композиции. Так глубина возможной композиции растёт вместе с библиотекой.'
