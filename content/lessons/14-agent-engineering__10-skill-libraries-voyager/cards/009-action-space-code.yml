- concept: навык, извлечённый как исполняемая программа, отдаёт результат вызовом, а навык-подсказка требует, чтобы модель заново вывела поведение по тексту
  question: Объясни своими словами, чем извлечение навыка в виде исполняемого кода отличается от извлечения того же навыка в виде текстовой инструкции в промпте.
  explanation: Ключевое слово в описании Voyager — навык достаётся как программа, а не как промпт. Проверенный код даёт детерминированное поведение и бесплатную композицию; инструкция каждый раз пересобирается моделью и потому не имеет гарантии, что вчерашний успех повторится.
  kind: open
  reference: 'Код вызывается: агент передаёт аргументы, среда исполняет тело, поведение воспроизводится один в один и не зависит от того, как модель прочитала текст. Текстовая инструкция — только условие для генерации: модель должна заново вывести из неё последовательность действий, и каждый вызов может дать другой результат, потратить токены на повторное рассуждение и разойтись с уже проверенной версией. Плюс код композируется механически — одна функция вызывает другую, — а инструкции при склейке конкурируют за внимание и контекст.'
