- concept: ключ индексации навыка — эмбеддинг его текстового описания, а не имя функции и не исходный код, поэтому поиск идёт по смыслу задачи
  question: Агент записывает новый навык в библиотеку. Что подаётся в модель эмбеддингов, чтобы навык потом находился по смысловому запросу вроде «нужен инструмент для добычи руды»?
  explanation: 'Имя функции и тело кода — плохие ключи: запрос формулируется в терминах цели, а не сигнатуры. Поэтому навык кладут в индекс вектором от его описания на естественном языке, а код лежит рядом как полезная нагрузка. Совпадение по смыслу описания и запроса даёт попадание даже при полном расхождении имён.'
