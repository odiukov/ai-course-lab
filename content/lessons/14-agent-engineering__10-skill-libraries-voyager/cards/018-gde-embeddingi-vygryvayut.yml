- concept: лексический и векторный поиск сильны на разных типах запроса, поэтому их комбинируют, а не выбирают один
  question: Объясни своими словами, почему в зрелой библиотеке навыков лексический поиск обычно не выбрасывают полностью после перехода на эмбеддинги, а комбинируют с ними.
  explanation: 'Два способа ошибаются по-разному: лексический слеп к синонимам, векторный — к точному совпадению редкого идентификатора. Держать оба дешевле, чем терять один класс запросов; в библиотеке навыков это особенно заметно, потому что агент обращается к ней и своими словами, и по имени навыка при композиции.'
  kind: open
  reference: 'Эмбеддинги выигрывают на перефразировке: запрос описывает нужду обычными словами, общих токенов с описанием нет, но смысл близок. Лексический поиск выигрывает на точных редких строках — имя функции, идентификатор, версия, код ошибки, специфический термин: их эмбеддинг размывает в общий смысл соседних слов и может поставить выше похожий, но не тот навык. Комбинация (гибридный поиск) берёт кандидатов от обеих стадий и объединяет их баллы, поэтому запрос «нужен инструмент покрепче» и запрос `craftIronPickaxe` оба находят нужную запись.'
  id: 018-gde-embeddingi-vygryvayut-3
  fingerprint: '79437703'
