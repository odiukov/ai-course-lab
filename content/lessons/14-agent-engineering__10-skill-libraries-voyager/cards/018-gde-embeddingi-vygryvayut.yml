- concept: лексический скор нормируют на объединение множеств токенов, иначе сырое число совпадений завышает длинные описания
  question: Поиск по библиотеке навыков считает сходство как коэффициент Жаккара по множествам токенов. В запросе 6 уникальных токенов, в описании навыка 14, общих у них 4. Чему равен балл сходства?
  explanation: 'Жаккар = |пересечение| / |объединение| = 4 / (6 + 14 − 4) = 4/16 = 0.25. Если брать сырое пересечение (4), длинное описание почти всегда перебьёт короткое просто за счёт количества слов: у навыка с описанием на 40 токенов случайных совпадений больше, а релевантности — нет. Деление на объединение убирает эту фору.'
  kind: numeric
  answer: 0.25
  tolerance: 0.01
  id: 018-gde-embeddingi-vygryvayut-1
  fingerprint: 81ca8390
- concept: при расхождении словаря запроса и описания лексический скор обнуляется у всех кандидатов, и ранжирование перестаёт нести сигнал, тогда как векторное сходство остаётся ненулевым
  question: Агент ищет в библиотеке навыков запросом «нужно чем-то пробить твёрдую породу». Ни один из 40 навыков не содержит этих слов в описании. Что произойдёт при поиске по пересечению токенов и чем от него отличается векторный поиск?
  explanation: 'Пересечение токенов сравнивает написание, а не смысл: «порода» и `stone` для него чужие строки. Когда общих слов нет ни с одним кандидатом, все баллы равны нулю — функция всё равно что-то вернёт, но это уже не ранжирование. Векторное представление кодирует смысл числами, поэтому расстояния до разных навыков различаются даже при полном расхождении словаря.'
  kind: choice
  options:
    - Лексический поиск даст всем кандидатам балл 0, и порядок выдачи определится не релевантностью, а посторонним фактором; векторный вернёт ненулевые расстояния и сохранит различимость кандидатов
    - Лексический поиск вернёт ошибку и прервёт выполнение, а векторный отработает штатно
    - Оба поиска вернут одинаковый результат, потому что оба в итоге сравнивают текст запроса с текстом описания
    - Лексический поиск автоматически подставит синонимы из словаря языка и найдёт нужный навык
