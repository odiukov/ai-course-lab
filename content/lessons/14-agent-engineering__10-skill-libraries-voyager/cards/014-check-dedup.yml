- concept: ключ дедупликации должен быть инвариантен к переформулировке, иначе одно умение накапливает множество записей
  question: Библиотека навыков дедуплицирует записи, сравнивая строки описаний на точное совпадение. Объясни своими словами, почему при этом одно и то же умение всё равно накапливает десятки записей, и какой признак стоит взять ключом сравнения.
  explanation: Дедупликация ловит ровно то, что сравнивает. Сравнение сырого текста описаний — самый слабый ключ, потому что текст меняется свободнее всего. Поведенческий признак (код, нормализованное имя) или порог по эмбеддингу переживает переформулировку.
  kind: open
  reference: 'Описание — свободный текст, который агент генерирует заново при каждой записи. Достаточно синонима или другого порядка слов, чтобы строки перестали совпадать, а проверка на дубликат ничего не нашла. Ключ дедупликации должен быть устойчив к переформулировке: нормализованное имя навыка, хеш нормализованного кода или сходство эмбеддингов описаний выше порога. При срабатывании — обновлять существующую запись новой версией, а не класть вторую. Иначе поиск возвращает несколько вариантов одного умения, они конкурируют за место в выдаче и в контексте, и непонятно, какой из них канонический.'
  id: 014-check-dedup-2
  fingerprint: aa9a09d5
