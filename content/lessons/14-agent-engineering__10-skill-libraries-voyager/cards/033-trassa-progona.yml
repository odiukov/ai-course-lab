- concept: успешная проверка каждой зависимости по отдельности не гарантирует успеха композиции, потому что отдельный контракт не покрывает порядок вызовов и предусловия между ними
  question: Каждый из подчинённых навыков составного навыка ранее отработал успешно и лежит в библиотеке как проверенный. Составной навык при первом запуске возвращает self-verification failure. Объясни, почему это не противоречие и где обычно находится дефект.
  explanation: 'Провал композиции при зелёных детях — норма, а не сигнал о том, что дети сломаны. Self-verification failure тут особенно показателен: исключения не было, код прошёл до конца, но цель не достигнута — типичная сигнатура ошибки в порядке или предусловиях. Правка адресуется слою, который эту склейку задаёт.'
  kind: open
  reference: 'Проверка навыка удостоверяет его собственный контракт: вызвали изолированно с ожидаемым входом — получили ожидаемый эффект. Композиция добавляет то, чего в этих проверках нет: порядок исполнения, предусловия одного навыка, которые обязан обеспечить другой, передачу состояния среды между вызовами и общий целевой результат. Дефект поэтому обычно лежит в слое склейки — неверный порядок зависимостей, пропущенный подготовительный шаг, неправильные аргументы, — а не в телах уже проверенных навыков. Отсюда и способ починки: переписывается составной навык, зависимости остаются как есть.'
