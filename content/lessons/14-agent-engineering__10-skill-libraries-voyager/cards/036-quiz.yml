- concept: дедупликация выполняется в момент записи навыка, а не в момент поиска, потому что на запись приходится одно сравнение, а на чтение — каждый запрос
  question: Библиотека навыков схлопывает почти одинаковые записи. Почему это делают в момент записи нового навыка, а не фильтрацией выдачи при каждом поиске?
  explanation: 'Дубликат, оставленный в хранилище, платится на каждом поиске: и сравнением, и слотами top-k. Дедупликация на записи делает сравнение однократным и оставляет одну каноническую версию, к которой дальше пришиваются доработки и версии. Фильтр на чтении их не склеивает — история правок остаётся размазанной по нескольким записям.'
  kind: choice
  options:
    - Поиск не умеет сравнивать описания между собой, он умеет только сравнивать их с запросом
    - 'Запись происходит один раз на навык, а поиск — на каждую задачу: та же работа переносится с горячего пути на холодный, и хранилище остаётся с одной канонической записью'
    - При фильтрации на чтении теряется векторное сходство, а на записи оно сохраняется
    - 'Дубликаты на чтении невозможно обнаружить: их эмбеддинги совпадают до последнего знака'
  correct: 1
  id: 036-quiz-2
  fingerprint: 3c5773ae
- concept: curriculum ставит цели снизу вверх от наличных способностей, а не декомпозирует заданную сверху конечную цель
  question: Чем постановка целей в автоматическом curriculum отличается от обычного планировщика, который разбивает заданную конечную цель на подзадачи? Объясни своими словами.
  explanation: 'Разница именно в направлении. Сверху вниз цель фиксирована и всё выводится из неё; снизу вверх фиксирован текущий пробел в способностях, и цель выводится из него. Поэтому curriculum и библиотека навыков образуют пару: библиотека растёт, и из-за этого меняется то, что curriculum считает следующим шагом.'
  kind: open
  reference: 'Планировщик работает сверху вниз: конечная цель задана извне, и он рекурсивно дробит её на подзадачи, пока не упрётся в исполнимые. Curriculum работает снизу вверх: конечной цели нет вообще, следующая задача выводится из текущего состояния среды и наличного инвентаря навыков — берётся то, что чуть выше нынешних способностей. Отсюда два следствия. Первое: множество задач меняется после каждой записи в библиотеку, потому что новые навыки открывают ранее недостижимые цели. Второе: процесс открытый — он не завершается по достижении цели, а продолжает расширять охват способностей.'
  id: 036-quiz-3
  fingerprint: 5c8090a4
