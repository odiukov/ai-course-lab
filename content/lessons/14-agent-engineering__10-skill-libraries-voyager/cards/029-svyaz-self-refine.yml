- concept: 'самокритика бессильна против нехватки фактов о внешнем состоянии: критик и автор — одна модель, поэтому дополнительные раунды не приносят новой информации'
  question: 'Модель генерирует функцию, затем сама её проверяет и каждый раунд подтверждает: код корректен. При реальном запуске функция падает, потому что читает файл, которого в рабочей директории нет. Почему увеличение числа раундов самокритики не устранит проблему?'
  explanation: 'Ошибка не в рассуждении, а в отсутствующем знании о мире. Self-Refine крутит цикл вокруг мнения модели о себе: сколько ни перечитывай, факт «файла нет» внутри весов не появится. Заземление добавляет в цикл источник информации (интерпретатор, состояние среды), а не более строгого судью. Отсюда и три сигнала Voyager: success, error со стек-трейсом, self-verification failure — все три приходят снаружи модели.'
  kind: choice
  options:
    - Проверяющий и автор — одна и та же модель, а нужного факта о состоянии файловой системы у неё нет; лишние раунды перебирают то же самое знание
    - Раунды самокритики накапливают контекст, и модель забывает исходное задание
    - При каждом раунде растёт температура генерации, и ответы становятся менее точными
    - Самокритика работает только для текста, а для кода нужен отдельный формат промпта
  correct: 0
  id: 029-svyaz-self-refine-1
  fingerprint: 07fc0283
- concept: заземление цикла итеративного улучшения возможно только там, где есть дешёвый автоматический оракул, зависящий от мира, а не от мнения модели
  question: 'Объясни своими словами: какое свойство задачи обязано выполняться, чтобы цикл итеративного улучшения можно было заземлить, и во что вырождается цикл, если этого свойства нет?'
  explanation: 'Ключ — независимость проверяющего от модели плюс дешевизна прогона. Voyager и CRITIC — один паттерн с разными оракулами: у Voyager это игровая среда (стек-трейс интерпретатора и проверка инвентаря/координат), у CRITIC — внешние инструменты. Там, где оракула нет, число раундов перестаёт быть полезной ручкой.'
  kind: open
  reference: 'Нужен внешний проверяющий, чей вердикт зависит от состояния мира, а не от убеждений модели, и который можно запускать автоматически и дёшево: интерпретатор кода, компилятор, тесты, калькулятор, поиск, проверка состояния среды. Тогда сигнал обратной связи несёт информацию, которой у модели не было. Если такого оракула нет (например, оценка стиля эссе или спорного продуктового решения), критиком остаётся сама модель, и цикл вырождается в Self-Refine без заземления: он способен чинить ошибки рассуждения и оформления, но не может обнаружить факт, которого модель не знает, поэтому уверенно ошибочный вариант будет подтверждаться раунд за раундом.'
  id: 029-svyaz-self-refine-2
  fingerprint: e8f7fe02
