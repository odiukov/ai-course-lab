- concept: без механизма переписывания по обратной связи в библиотеку попадают только навыки, заработавшие с первой попытки
  question: 'Из агента убрали iterative prompting: код, упавший при запуске, просто отбрасывается, и агент переходит к следующей задаче. Что произойдёт с библиотекой навыков?'
  explanation: 'Iterative prompting превращает провал в исходные данные для правки: текст ошибки исполнения, обратная связь среды и результат самопроверки идут обратно в модель, и навык переписывается. Без этого цикла единственный путь в библиотеку — угадать с первого раза, и потолок сложности освоенного резко падает. Записываются по-прежнему только прошедшие навыки, поэтому неисполняемый код в библиотеку не хлынет — просто хорошего кода станет мало.'
  kind: choice
  options:
    - Она будет расти только за счёт задач, чей код сработал с первой попытки, а всё сложное отсеется
    - Она перестанет находить навыки по похожести запроса на описание
    - В неё начнут попадать неисполняемые навыки, потому что проверять их станет некому
    - Она будет расти прежним темпом, но навыки станут длиннее
