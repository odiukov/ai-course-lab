- concept: 'curriculum и библиотека навыков образуют обратную связь: каждый записанный навык меняет множество задач, которые генератор считает следующими'
  question: Объясни своими словами, почему генератор задач в Voyager обязан читать содержимое библиотеки навыков, а не работать как независимый источник заданий.
  explanation: 'Ключ — рост снизу вверх. Компоненты не независимы: библиотека является входом для curriculum, а curriculum порождает задачи, чьи решения пополняют библиотеку.'
  kind: open
  reference: 'Библиотека — это актуальный слепок того, что агент умеет. Генератор выбирает задачу чуть выше текущего уровня, а «текущий уровень» определяется именно набором накопленных навыков плюс состоянием среды. Отсюда обратная связь: успешный навык записывается в библиотеку, следующий запрос генератора видит уже расширенный набор и предлагает задачу, которая раньше была недостижимой. Без чтения библиотеки генератор либо повторяет уже освоенное, либо выдаёт задачи, для которых предпосылок ещё нет, и исследование перестаёт идти снизу вверх.'
