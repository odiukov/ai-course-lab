- concept: дубликаты одного умения занимают слоты top-k и вытесняют из выдачи другие релевантные навыки
  question: Библиотека из 400 навыков, поиск возвращает top-8. По запросу приходят 8 записей, из них 6 — перефразировки одного и того же умения, записанные в разные дни. В чём главный вред для агента, а не для базы?
  explanation: 'Размер выдачи фиксирован параметром k, а не размером библиотеки. Каждая лишняя копия умения съедает слот, который мог достаться навыку из другой части задачи: по запросу про лог-файл пять слотов уходят на «подсчёт строк», и «разбор лога» просто не возвращается. Дубликаты вредят не объёмом хранения, а потерей разнообразия выдачи — поэтому дедупликация нужна на записи, до того как копии попадут в индекс.'
  kind: choice
  options:
    - Векторный индекс занимает больше памяти и поиск считается дольше
    - Из 8 слотов выдачи остаются 2 на все прочие умения, поэтому другие релевантные навыки в контекст не попадают вовсе
    - Модель получит противоречивые версии кода и не сможет выбрать между ними
    - Оценки сходства у дубликатов завышены, поэтому порог релевантности перестаёт срабатывать
  correct: 1
  id: 032-gnienie-biblioteki-1
  fingerprint: ac1c8842
- concept: признак деградации ранжирования — сжатие разрыва между баллами кандидатов, а не низкое абсолютное значение сходства
  question: Библиотека выросла до 600 навыков. Топовый результат поиска имеет сходство 0.72, тридцатый — 0.70. Объясни своими словами, почему такая картина означает, что поиск перестал работать, хотя баллы высокие.
  explanation: 'Типичная ошибка — читать 0.70 как «хорошее совпадение». Значение сходства осмысленно только в сравнении с остальными кандидатами: если хвост выдачи отстаёт от головы на 0.02, ранжирование не несёт сигнала. В уроке эта же картина показана на ряду 0.61 / 0.60 / 0.58 / 0.57 при двухстах навыках.'
  kind: open
  reference: 'Ранжирование полезно ровно настолько, насколько оно различает кандидатов. При 0.72 против 0.70 разрыв между первым и тридцатым местом меньше, чем сдвиг балла от одного лишнего слова в формулировке запроса: порядок выдачи определяется шумом, а не смыслом. Причина сжатия — рост библиотеки: при сотнях навыков описания собраны из одного и того же словаря («файл», «данные», «обработать»), эмбеддинги стягиваются в узкую область, и все кандидаты становятся одинаково похожи на всё. Высокое абсолютное значение сходства тут ничего не гарантирует — диагностический показатель именно разброс баллов внутри выдачи. Лечится не заменой метрики, а сокращением поля кандидатов: жёсткий фильтр по метаданным (тег, категория) применяется до подсчёта сходства, и на десятке оставшихся записей та же метрика снова даёт различимый разрыв.'
  id: 032-gnienie-biblioteki-2
  fingerprint: e6b89c48
