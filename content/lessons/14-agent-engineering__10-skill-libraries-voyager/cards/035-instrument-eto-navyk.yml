- concept: версионируется только то, что агент написал сам; инструмент — внешний артефакт среды, его реализацию агент переписать не может
  question: У агента есть реестр инструментов, который даёт платформа, и библиотека навыков, которую агент наполняет сам. Записи библиотеки несут номер версии и могут быть закреплены зависимостью, у инструментов версии нет. Объясни, почему версионирование применимо к одному и неприменимо к другому.
  explanation: 'Граница проходит по авторству, а не по сложности. Всё, что агент вывел и записал сам, обязано иметь версию, потому что будет переписано; всё, что дала среда, версионируется на стороне среды. Побочный вывод: изменение поведения инструмента извне закреплением зависимостей не ловится — пиннинг защищает только от дрейфа собственных навыков.'
  kind: open
  reference: 'Версия упорядочивает редакции одного и того же кода, которые пишет и переписывает его автор. Навык агент породил сам: получил сигнал провала, переписал код, сохранил как следующую редакцию — отсюда и v2, и возможность закрепить конкретную редакцию в зависимостях родителя. Инструмент приходит снаружи, от среды или платформы: агент не автор его реализации и доработать её по обратной связи не может, у него есть только контракт вызова. Менять инструмент может лишь поставщик, и происходит это вне библиотеки, поэтому никакой истории редакций внутри библиотеки у инструмента не накапливается — версионировать нечего.'
  id: 035-instrument-eto-navyk-1
  fingerprint: d29ed057
- concept: определения инструментов оплачиваются контекстом каждого запроса, а навыки подгружаются только при попадании в выдачу поиска
  question: 'У агента 40 инструментов и библиотека из 600 навыков. Команда хочет добавить 15 новых процедур и спорит: оформить их как навыки в библиотеке или как новые инструменты в реестре. В чём разница по стоимости контекста?'
  explanation: 'Реестр инструментов — постоянная часть контекста: модель должна видеть все доступные схемы, чтобы выбрать вызов, так что цена растёт линейно с числом инструментов и платится на каждом запросе. Библиотека навыков адресуется поиском по описаниям, в промпт приходит только выдача. Поэтому раздувание реестра ради многошаговых процедур — плохой обмен: та же логика в виде навыка стоит контекста лишь тогда, когда действительно нужна.'
  kind: choice
  options:
    - 'Разницы нет: и схемы инструментов, и навыки грузятся одинаково при каждом обращении к модели'
    - Схемы всех инструментов уходят в контекст каждого запроса, поэтому 15 новых инструментов дорожают каждый вызов; навыки достаются поиском и попадают в промпт, только когда релевантны задаче
    - 'Навыки дороже: библиотека из 600 записей целиком разворачивается в промпт, а реестр инструментов передаётся ссылкой'
    - Оба варианта бесплатны по контексту, потому что и то и другое хранится на стороне рантайма
