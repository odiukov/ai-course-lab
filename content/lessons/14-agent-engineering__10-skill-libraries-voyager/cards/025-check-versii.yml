  fingerprint: e3de6907
- concept: тесты дочернего навыка удостоверяют только его собственный контракт, а родитель мог опираться на незадокументированные особенности прежней реализации
  question: Дочерний навык переписали, его собственные тесты зелёные. Объясни, почему этого недостаточно, чтобы считать безопасной подмену этого навыка у всех родителей, которые его вызывают.
  explanation: 'Зелёные тесты дочернего — утверждение о дочернем, а не о композиции. Отсюда практика: новую редакцию публикуют отдельной версией и мигрируют родителей по одному, прогоняя их тесты.'
  kind: open
  reference: 'Тесты дочернего проверяют его в изоляции и только против того контракта, который в них записан. Родители же могли завязаться на поведение вне этого контракта: порядок или формат возвращаемых элементов, выбор из нескольких допустимых вариантов, побочные эффекты, время работы. Такое поведение переписанная версия имеет право поменять, оставаясь корректной по своим тестам — родитель не упадёт, а тихо даст другой результат. Достаточное доказательство даёт только прогон тестов самих родителей против новой редакции (либо явное закрепление нужного поведения в контракте дочернего).'
  id: 025-check-versii-2
  fingerprint: 12879cab
- concept: обновление зависимости в версионированной библиотеке — это поштучная миграция родителей, а не перезапись записи навыка на месте
  question: Дочерний навык доработали. В библиотеке версионированные навыки, у родителей зависимости закреплены. Расставь шаги безопасного выката новой редакции.
  explanation: 'Перезапись на месте меняет поведение всех родителей разом и без сигнала. Отдельная версия делает выкат обратимым: старая запись жива, каждый родитель переезжает после собственной проверки, а удаление возможно только по нулю входящих ссылок.'
  kind: order
  items:
    - Записать доработку как новую версию навыка, не перезаписывая старую запись
    - Прогнать тесты конкретного родителя против новой версии дочернего
    - Переписать пин в списке зависимостей этого родителя на новую версию
    - Повторить проверку и перепин для остальных родителей, ссылающихся на старую версию
    - Удалить старую версию, когда на неё не ссылается ни один родитель
  id: 025-check-versii-3
  fingerprint: fe2b3477
