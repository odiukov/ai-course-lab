  question: 'Дата-команда собирает агента с библиотекой примерно из девяти SQL-навыков и сомневается: не слишком ли мало записей, чтобы паттерн Voyager вообще дал эффект. Объясни своими словами, от чего на самом деле зависит выигрыш и почему узкая доменная библиотека работает.'
  explanation: 'Паттерн масштабируется вниз: механика «извлёк по похожести — исполнил — доработал — записал» не требует сотен записей, чтобы окупиться. Порог входа задаётся частотой повторов в домене, а проблемы гниения библиотеки начинаются только на больших объёмах — маленькая предметная библиотека получает выигрыш, не платя за них.'
