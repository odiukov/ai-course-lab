  explanation: Извлечение, версии и запись в рантайме работают и во внутрискриптовой библиотеке — теряется другое. Навык, описанный стандартной формой (описание, код, инструкции, зависимости, версия), вставляется в любого исполнителя, который эту форму понимает; менеджеры навыков вроде skillkit ровно поэтому держат хранилище снаружи и раздают один набор десяткам агентов. Вшитая в скрипт библиотека умирает вместе со сменой исполнителя.
