- concept: самопроверка ловит провал, который не проявился как исключение при исполнении
  question: Навык агента отработал до конца и не выбросил ни одной ошибки, но цель задачи не достигнута. Почему такой исход всё равно запускает переписывание навыка, и на какой сигнал при этом опирается агент?
  explanation: Если бы единственным признаком провала было исключение, библиотека наполнялась бы навыками, которые исполняются чисто и бесполезно. Самопроверка — отдельный канал обратной связи именно для тихих провалов.
  kind: open
  reference: 'Механизм итеративного промптинга получает не один канал обратной связи, а несколько: ошибки исполнения, отклик среды и результат самопроверки. Отсутствие исключения означает лишь то, что код синтаксически и рантаймово корректен, а не то, что задача решена. Провал такого рода фиксирует самопроверка — она сравнивает состояние среды с целью задачи и сообщает, что цель не достигнута. Этот сигнал и уходит в переписывание навыка, поэтому в библиотеку не попадает код, который «работает», но ничего не добивается.'
  id: 008-check-komponenty-2
  fingerprint: 1e396a2f
