<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Веер и цепочка</title>
<style>
  :root{
    --bg:#fdfdfb; --fg:#1c1c1c; --muted:#6a6a6a;
    --fan:#b4531f; --chain:#1f6f8b; --node:#2f2f2f; --panel:#f0efe9;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14161a; --fg:#e9e7e1; --muted:#9a9a94;
      --fan:#f0904f; --chain:#5fc0dd; --node:#d8d6d0; --panel:#1d2027;
    }
  }
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
  figure{margin:0;padding:10px 4px}
  figcaption{font-weight:600;font-size:15px;margin:0 0 6px 6px}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg)}
  .err{padding:12px;color:var(--fg);font-size:14px}
  text{fill:var(--fg)}
  .muted{fill:var(--muted)}
</style>
<figure>
  <figcaption>Параллельный веер и последовательная цепочка MTP</figcaption>
  <svg id="s" viewBox="0 0 760 460" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Слева четыре независимые головы из одного h(0); справа цепочка h(0)-h(1)-h(2) с эмбеддингами"></svg>
</figure>
<div id="fallback"></div>
<script>
(function(){
try{
  /* ---- данные схемы (единственные литералы-данные) ---- */
  const K = [1,2,3,4];                    // смещения целей t+k
  const FAN  = {hx:0, hy:0};              // h^(0) веера
  const CH   = {x0:0, dx:2.6, y:0};       // цепочка: шаг по x
  const TARGET_X = 4.2;                   // колонка целей у веера
  const FAN_TY  = [-2.4,-0.8,0.8,2.4];    // y целей веера
  const PANEL_L = {x0:-1.0, x1:5.6, y0:-3.4, y1:3.4};
  const PANEL_R = {x0:-1.0, x1:5.6, y0:-3.4, y1:3.4};

  /* ---- ОДНА система координат ---- */
  const origin = {x:56, y:236};
  const scale  = 62;
  const sx = x => origin.x + x*scale;
  const sy = y => origin.y + y*scale;

  /* правую панель кладём в те же sx/sy, сдвиг — в данных, не в origin */
  const RSHIFT = 6.6;

  const NS="http://www.w3.org/2000/svg";
  const svg=document.getElementById("s");
  const mk=(n,a)=>{const e=document.createElementNS(NS,n);
    for(const k in a)e.setAttribute(k,a[k]);return e;};
  const LW=1.6, FS=13, PAD=8;

  const defs=mk("defs");
  [["ah","var(--fan)"],["ac","var(--chain)"]].forEach(([id,c])=>{
    const m=mk("marker",{id:id,viewBox:"0 0 10 8",refX:"9",refY:"4",
      markerWidth:"7",markerHeight:"6",orient:"auto-start-reverse"});
    m.appendChild(mk("path",{d:"M0 0 L10 4 L0 8 z",fill:c}));
    defs.appendChild(m);
  });
  svg.appendChild(defs);

  function panel(p,sh){
    svg.appendChild(mk("rect",{x:sx(p.x0+sh),y:sy(p.y0),
      width:sx(p.x1+sh)-sx(p.x0+sh), height:sy(p.y1)-sy(p.y0),
      rx:10, fill:"var(--panel)"}));
  }
  function dot(x,y,c){
    svg.appendChild(mk("circle",{cx:sx(x),cy:sy(y),r:5,fill:c}));
  }
  function line(x1,y1,x2,y2,c,mid){
    svg.appendChild(mk("line",{x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),
      stroke:c,"stroke-width":LW,"marker-end":"url(#"+mid+")"}));
  }
  function label(x,y,dx,dy,t,anchor,cls){
    const e=mk("text",{x:sx(x)+dx,y:sy(y)+dy,"text-anchor":anchor,
      "font-size":FS,class:cls||""});
    e.textContent=t; svg.appendChild(e);
  }

  /* ================= ЛЕВО: веер ================= */
  panel(PANEL_L,0);
  label((PANEL_L.x0+PANEL_L.x1)/2, PANEL_L.y0, 0, -PAD,
        "Веер: 4 головы из одного состояния","middle");

  dot(FAN.hx,FAN.hy,"var(--node)");
  label(FAN.hx,FAN.hy,-PAD,0,"h⁽⁰⁾","end");
  label(FAN.hx,FAN.hy,-PAD,FS+PAD,"общий вход","end","muted");

  K.forEach((k,i)=>{
    const ty=FAN_TY[i];
    line(FAN.hx,FAN.hy,TARGET_X,ty,"var(--fan)","ah");
    dot(TARGET_X,ty,"var(--fan)");
    label(TARGET_X,ty,PAD,4,"t+"+k,"start");
    /* подпись головы — у хвоста стрелки, не у наконечника */
    label(FAN.hx+0.9, FAN.hy+(ty-FAN.hy)*0.9/(TARGET_X-FAN.hx),
          0, ty<0? -6 : FS, "гол."+k, "middle","muted");
  });

  /* ================= ПРАВО: цепочка ================= */
  panel(PANEL_R,RSHIFT);
  label((PANEL_R.x0+PANEL_R.x1)/2+RSHIFT, PANEL_R.y0, 0, -PAD,
        "Цепочка: каждый шаг берёт свежий токен","middle");

  const cx = i => CH.x0 + i*CH.dx + RSHIFT;
  [0,1,2].forEach(i=>{
    dot(cx(i),CH.y,"var(--node)");
    label(cx(i),CH.y,0,FS+PAD,"h⁽"+i+"⁾","middle");
  });

  [1,2].forEach(i=>{
    line(cx(i-1),CH.y,cx(i),CH.y,"var(--chain)","ac");
    /* вход эмбеддинга — сверху, в тот же переход */
    const mx=(cx(i-1)+cx(i))/2;
    line(mx,CH.y-1.7,mx,CH.y-0.12,"var(--chain)","ac");
    label(mx,CH.y-1.7,0,-PAD,"E(t+"+i+")","middle");
    label(mx,CH.y,0,-PAD-4,"вход","middle","muted");
  });

  /* предсказания цепочки: с h⁽ᵏ⁾ вниз к t+k+1 */
  [0,1,2].forEach(i=>{
    line(cx(i),CH.y+0.28,cx(i),CH.y+2.1,"var(--fan)","ah");
    label(cx(i),CH.y+2.1,0,FS+PAD-2,"t+"+(i+1),"middle");
  });

  /* пояснение под правым блоком */
  label(cx(2),CH.y+2.9,PAD,FS,"глубина 3 знает t+1 и t+2","end","muted");
  label(FAN.hx,PANEL_L.y1,-PAD+PAD,FS,"голова 3 не знает t+1 и t+2","start","muted");

}catch(e){
  document.getElementById("s").remove();
  document.getElementById("fallback").className="err";
  document.getElementById("fallback").textContent =
    "Схема должна показать: слева одно состояние h⁽⁰⁾ и четыре независимые "+
    "головы, каждая тянет свою стрелку к целям t+1, t+2, t+3, t+4 — все "+
    "стартуют из одной точки. Справа цепочка h⁽⁰⁾ → h⁽¹⁾ → h⁽²⁾, где в каждый "+
    "переход дополнительно входит эмбеддинг настоящего токена E(t+k), и "+
    "предсказание на глубине 3 опирается на уже известные t+1 и t+2.";
}
})();
</script>
</html>
