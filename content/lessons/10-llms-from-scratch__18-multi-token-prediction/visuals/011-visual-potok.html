<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Путь одного вектора через модуль</title>
<style>
  :root{ --bg:#ffffff; --fg:#1a1a1a; --muted:#5a6470; --line:#3a4450;
         --boxA:#dfe9f7; --boxB:#e6f2e2; --boxC:#f6e6dd; --boxD:#ece2f5; --edge:#8a95a3; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14171c; --fg:#e9edf2; --muted:#a3adba; --line:#c3cdd9;
           --boxA:#22303f; --boxB:#22352a; --boxC:#3a2c24; --boxD:#2e2740; --edge:#66707d; }
  }
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{background:var(--bg);padding:8px 10px 10px;box-sizing:border-box;}
  h2{font-size:15px;margin:0 0 6px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .lbl{font-size:12px;fill:var(--fg);}
  .sub{font-size:11px;fill:var(--muted);}
  .fallback{font-size:13px;line-height:1.5;color:var(--fg);}
</style>
</head>
<body>
<div class="wrap">
  <h2>Путь одного вектора через модуль 1</h2>
  <div id="slot"></div>
</div>
<script>
(function(){
  var slot = document.getElementById('slot');
  try{
    // ---- данные схемы (единственные литералы-данные) ----
    var D = {
      boxes: [
        {id:'h0',  x:0,  y:14, w:20, h:5, t:'h⁽⁰⁾', s:'7168', fill:'var(--boxA)'},
        {id:'e',   x:0,  y:2,  w:20, h:5, t:'E(t\u2081\u208A\u2081)', s:'7168', fill:'var(--boxA)'},
        {id:'n1',  x:26, y:14, w:18, h:5, t:'RMSNorm', s:'', fill:'var(--boxB)'},
        {id:'n2',  x:26, y:2,  w:18, h:5, t:'RMSNorm', s:'', fill:'var(--boxB)'},
        {id:'cat', x:50, y:5,  w:16, h:11, t:'concat', s:'2h = 14336', fill:'var(--boxC)'},
        {id:'m',   x:72, y:5,  w:16, h:11, t:'M\u2081', s:'h × 2h', fill:'var(--boxD)'},
        {id:'t',   x:94, y:5,  w:16, h:11, t:'T\u2081', s:'внимание + MLP', fill:'var(--boxD)'},
        {id:'h1',  x:116,y:8,  w:20, h:5, t:'h⁽¹⁾', s:'7168', fill:'var(--boxA)'}
      ],
      arrows: [
        {x1:20, y1:16.5, x2:26, y2:16.5},
        {x1:20, y1:4.5,  x2:26, y2:4.5},
        {x1:44, y1:16.5, x2:50, y2:13.5},
        {x1:44, y1:4.5,  x2:50, y2:7.5},
        {x1:66, y1:10.5, x2:72, y2:10.5},
        {x1:88, y1:10.5, x2:94, y2:10.5},
        {x1:110,y1:10.5, x2:116,y2:10.5}
      ],
      notes: [
        {x:35, y:20, t:'нормируем оба входа', a:'middle', dy:1},
        {x:58, y:19, t:'склейка: двое стали одним', a:'middle', dy:1},
        {x:80, y:2.5, t:'сжатие 14336 → 7168', a:'middle', dy:-1},
        {x:126,y:15, t:'та же длина, что у h⁽⁰⁾', a:'middle', dy:1}
      ]
    };

    // ---- одна пара функций перевода ----
    var origin = {x: 14, y: 12}, scale = 4.4;
    function sx(x){ return origin.x + x * scale; }
    function sy(y){ return origin.y + y * scale; }

    var VBW = 680, VBH = 260;
    var PAD = 6, STROKE = 1.6, FS = 12;

    var out = [];
    out.push('<svg viewBox="0 0 '+VBW+' '+VBH+'" preserveAspectRatio="xMidYMid meet" role="img" '+
      'aria-label="h нулевое и эмбеддинг проходят RMSNorm, склеиваются в 14336, матрица M1 сжимает до 7168, блок T1 даёт h первое">');
    out.push('<defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">'+
      '<path d="M0,0 L7,3.5 L0,7 z" fill="var(--line)"/></marker></defs>');
    out.push('<rect x="0" y="0" width="'+VBW+'" height="'+VBH+'" fill="var(--bg)"/>');

    D.arrows.forEach(function(a){
      out.push('<line x1="'+sx(a.x1)+'" y1="'+sy(a.y1)+'" x2="'+sx(a.x2)+'" y2="'+sy(a.y2)+
        '" stroke="var(--line)" stroke-width="'+STROKE+'" marker-end="url(#ah)"/>');
    });

    D.boxes.forEach(function(b){
      var X = sx(b.x), Y = sy(b.y), W = sx(b.x+b.w)-sx(b.x), H = sy(b.y+b.h)-sy(b.y);
      var cx = sx(b.x + b.w/2);
      out.push('<rect x="'+X+'" y="'+Y+'" width="'+W+'" height="'+H+'" rx="5" fill="'+b.fill+
        '" stroke="var(--edge)" stroke-width="'+STROKE+'"/>');
      if(b.s){
        out.push('<text class="lbl" x="'+cx+'" y="'+sy(b.y + b.h/2)+'" text-anchor="middle" dy="-2">'+b.t+'</text>');
        out.push('<text class="sub" x="'+cx+'" y="'+sy(b.y + b.h/2)+'" text-anchor="middle" dy="'+(FS)+'">'+b.s+'</text>');
      } else {
        out.push('<text class="lbl" x="'+cx+'" y="'+sy(b.y + b.h/2)+'" text-anchor="middle" dy="4">'+b.t+'</text>');
      }
    });

    D.notes.forEach(function(n){
      out.push('<text class="sub" x="'+sx(n.x)+'" y="'+(sy(n.y) + n.dy*PAD)+'" text-anchor="'+n.a+
        '" dominant-baseline="'+(n.dy>0?'hanging':'auto')+'">'+n.t+'</text>');
    });

    out.push('</svg>');
    slot.innerHTML = out.join('');
  }catch(e){
    slot.innerHTML = '<p class="fallback">Схема: h⁽⁰⁾ (7168) и E(t<sub>i+1</sub>) (7168) проходят каждый свой RMSNorm, '+
      'склеиваются в вектор длины 2h = 14336, матрица M₁ размера h × 2h сжимает его обратно до 7168, '+
      'блок T₁ (внимание + MLP) выдаёт h⁽¹⁾ — снова 7168 чисел, той же длины, что и вход.</p>';
  }
})();
</script>
</body>
</html>
