- concept: стоимость LLM-вызова складывается из отдельно тарифицируемых входных и выходных токенов
  question: Модель принимает 1200 входных токенов и создаёт 300 выходных. Тарифы составляют $2 и $8 за миллион токенов соответственно. Сколько стоит вызов в долларах?
  explanation: Вход стоит 1200 / 1 000 000 × 2 = $0.0024, выход — 300 / 1 000 000 × 8 = $0.0024. Общая стоимость равна $0.0048.
  kind: numeric
  answer: 0.0048
  tolerance: 0.00001
