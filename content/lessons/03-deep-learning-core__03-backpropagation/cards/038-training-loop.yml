- concept: эпоха при обучении означает полный проход по обучающему набору
  question: Что называют эпохой при обучении нейросети?
  explanation: Эпоха завершается, когда модель обработала весь обучающий набор. После неё обучение может продолжиться со следующего прохода по тем же данным, но уже с обновлёнными параметрами.
  kind: choice
  options:
    - Полную обработку обучающего набора
    - Вычисление градиента отдельного параметра
    - Только обратный проход по вычислительному графу
    - Период до полного исчезновения ошибки
  correct: 0
  id: 038-training-loop-1
  fingerprint: b045197b
- concept: итерация обучения выполняет прямой проход и вычисление потерь до обратного прохода и обновления параметров
  question: Расположите этапы полного-батчевого обучения нейросети в правильном порядке.
  explanation: Градиенты можно вычислить лишь после получения потери текущей модели. Параметры обновляют после backward, а следующий цикл снова начинается с прямого прохода.
  kind: order
  items:
    - Получить предсказания и сформировать общую потерю по обучающим примерам
    - Выполнить обратное распространение от общей потери
    - Обновить параметры по вычисленным градиентам
  id: 038-training-loop-2
  fingerprint: e4425f64
