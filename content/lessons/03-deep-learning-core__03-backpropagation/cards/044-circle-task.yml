- concept: точность постоянного классификатора определяется долей преобладающего класса
  question: Точки равномерно выбирают из квадрата со стороной 14, в центре которого расположен круг радиуса 4. Метка «внутри» присваивается точкам круга, а «снаружи» — остальным. Какую точность в процентах в среднем даст классификатор, всегда отвечающий «снаружи»?
  explanation: Площадь квадрата равна 196, а площадь круга — 16π. Доля внешней области равна (196 − 16π) / 196 ≈ 0,7435, поэтому постоянный ответ «снаружи» даёт примерно 74,35%. Результат обученной сети следует сравнивать с таким базовым уровнем, а не только с половиной ответов.
  kind: numeric
  answer: 74.35
  tolerance: 0.1
  id: 044-circle-task-2
