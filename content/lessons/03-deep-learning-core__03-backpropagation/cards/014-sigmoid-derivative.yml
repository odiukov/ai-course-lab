- concept: локальная производная сигмоиды максимальна в середине диапазона её выходов
  question: В какой точке выход сигмоиды наиболее чувствителен к малому изменению входного логита?
  explanation: Производная равна s(1 − s). Это произведение максимально при s = 0,5 и тогда равно 0,25; по мере приближения выхода к любой границе оно уменьшается.
  kind: choice
  options:
    - Когда выход близок к нижней границе диапазона
    - Когда выход находится ровно посередине диапазона
    - Когда выход близок к верхней границе диапазона
  correct: 1
  id: 014-sigmoid-derivative-1
  fingerprint: 02866fe7
- concept: локальные производные сигмоиды при противоположных логитах равны
  question: Заполни пропуск, используя симметрию сигмоиды.
  explanation: 'Поскольку σ(−x) = 1 − σ(x), обе производные сводятся к одному произведению: σ(x)(1 − σ(x)). Поэтому сигмоида одинаково чувствительна при противоположных по знаку логитах одной величины.'
  kind: cloze
  template: σ′(−x) ___ σ′(x)
  answer: '='
  accept:
    - равно
    - ==
  id: 014-sigmoid-derivative-2
  fingerprint: 6a11601d
