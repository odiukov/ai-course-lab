- concept: обновление SGD вычитает из параметра произведение скорости обучения на его градиент
  question: Перед обновлением параметр θ равен −1,6, его градиент равен 0,45, а скорость обучения — 0,2. Чему станет равен θ после обновления SGD?
  explanation: SGD применяет формулу θ ← θ − η·∂L/∂θ. Поэтому новое значение равно −1,6 − 0,2·0,45 = −1,69. Положительный градиент приводит к уменьшению параметра.
  kind: numeric
  answer: -1.69
  tolerance: 0.001
  id: 035-sgd-update-1
  fingerprint: ea9a7dbd
- concept: все параметры обновляются по градиентам, вычисленным для одной версии сети
  question: Расположи действия одной итерации обучения так, чтобы все параметры обновлялись по согласованному набору градиентов.
  explanation: Обратное распространение вычисляет все градиенты в одной точке пространства параметров. Если менять параметры до завершения этого вычисления, часть градиентов будет относиться к одной версии сети, а часть — к другой.
  kind: order
  items:
    - Вычислить предсказания и функцию потерь при текущих параметрах
    - Выполнить обратное распространение и получить градиенты всех параметров
    - Обновить каждый параметр, используя сохранённый для него градиент
    - Снова выполнить прямой проход уже с изменёнными параметрами
  id: 035-sgd-update-2
  fingerprint: 7822defb
