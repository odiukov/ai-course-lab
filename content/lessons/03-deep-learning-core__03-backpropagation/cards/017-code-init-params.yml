- concept: число параметров полносвязной сети определяется весами и смещениями каждого слоя
  question: Сколько обучаемых скаляров содержит полносвязная сеть с архитектурой [3, 6, 9], если у каждого нейрона есть отдельное смещение?
  explanation: Скрытому слою нужны 6 × 3 весов и 6 смещений — 24 параметра. Выходному слою нужны 9 × 6 весов и 9 смещений — 63 параметра. Всего 24 + 63 = 87.
  kind: numeric
  answer: 87
  tolerance: 0.001
  id: 017-code-init-params-1
  fingerprint: 9bbc9702
- concept: каждый вес должен создаваться как отдельный объект Value
  question: Заполни генератор списка так, чтобы для каждого входа создавался новый независимый объект Value.
  explanation: Генератор списка выполняет Value(...) заново на каждой итерации, поэтому веса являются разными объектами. Умножение списка с единственным Value создало бы несколько ссылок на один объект.
  kind: cloze
  template: weights = [Value(random.uniform(-scale, scale)) ___]
  answer: for _ in range(n_inputs)
  accept:
    - for i in range(n_inputs)
  id: 017-code-init-params-2
  fingerprint: 4e481d5a
