- concept: градиент потерь по самим себе задаёт начальный сигнал обратного прохода
  question: Перед запуском backward для скалярных потерь L нужно инициализировать L.grad. Какое значение выбирают и почему?
  explanation: Обратный проход начинается с производной конечной величины по самой себе. Она равна единице, после чего этот начальный сигнал распространяется по вычислительному графу.
  kind: choice
  options:
    - Единицу, поскольку ∂L/∂L = 1
    - Ноль, поскольку градиенты ещё не вычислены
    - Значение L, поскольку градиент должен совпадать с потерями
  correct: 0
  id: 029-backward-algorithm-1
  fingerprint: 2a51ce83
- concept: обход всего графа зависимостей от потерь позволяет одному backward обработать все достижимые параметры
  question: Почему один вызов backward от конечных потерь может вычислить градиенты всех параметров, связанных с ними вычислительным графом?
  explanation: Топологический обход охватывает весь граф зависимостей потерь. Вызов локального _backward у каждого узла последовательно передаёт сигнал его входам, и после завершения обхода градиенты находятся у всех достижимых параметров.
  kind: open
  reference: Backward обходит все узлы, от которых зависят потери, в обратном топологическом порядке. Каждый узел передаёт свой градиент непосредственным входам, поэтому сигнал достигает каждого связанного параметра без отдельного запуска для каждого из них.
  id: 029-backward-algorithm-2
  fingerprint: 679d91bd
