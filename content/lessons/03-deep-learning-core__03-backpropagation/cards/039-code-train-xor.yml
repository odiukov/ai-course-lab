- concept: инициализация параметров до обучающего цикла сохраняет результаты обновлений между эпохами
  question: Во время обучения сети на XOR параметры заново инициализируют в начале каждой эпохи. Почему потери не демонстрируют устойчивого снижения?
  explanation: Обучение опирается на последовательное накопление изменений параметров. Если перед каждой эпохой создавать исходную сеть заново, очередной шаг оптимизации не продолжает результат предыдущего.
  kind: choice
  options:
    - История потерь блокирует вычисление новых градиентов
    - Для XOR параметры следует пересоздавать после каждого полного прохода
    - Фиксированный генератор случайных чисел отключает обновление весов
    - Повторная инициализация стирает изменения параметров, сделанные в предыдущей эпохе
  correct: 3
  id: 039-code-train-xor-1
  fingerprint: a44b64fb
- concept: суммирование и усреднение потерь по батчу по-разному масштабируют градиент
  question: Объясни, почему увеличение размера батча может увеличить шаг обновления при суммировании потерь, но не обязано делать это при их усреднении.
  explanation: В цикле обучения XOR потери примеров складываются в total_loss. Поэтому learning rate относится именно к градиенту суммы; переход к среднему изменил бы масштаб градиента и эффективную величину шага SGD.
  kind: open
  reference: Градиент суммы складывается из градиентов отдельных примеров, поэтому с ростом батча его типичный масштаб возрастает. При усреднении эта сумма делится на размер батча, что делает масштаб обновления менее зависимым от числа примеров.
  id: 039-code-train-xor-2
  fingerprint: b57d64f0
