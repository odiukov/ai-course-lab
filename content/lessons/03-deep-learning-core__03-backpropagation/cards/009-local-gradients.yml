- concept: локальная производная произведения по одному входу равна значению другого входа
  question: Узел вычисляет q = uv. Из следующих узлов пришёл градиент ∂L/∂q = 0,3, а v = −7. Какой градиент узел передаст к u?
  explanation: Для произведения ∂q/∂u = v. Поэтому ∂L/∂u = (∂L/∂q)·v = 0,3·(−7) = −2,1. Узлу нужны только входящий градиент и значение второго множителя.
  kind: numeric
  answer: -2.1
  tolerance: 0.001
  id: 009-local-gradients-1
  fingerprint: 815497b9
- concept: входящий градиент обобщает всё влияние последующих операций на итоговые потери
  question: Почему при обратном распространении узлу q = f(u, v) не нужно знать, какие операции находятся между его выходом и функцией потерь, чтобы вычислить градиенты по u и v?
  explanation: Последующая часть графа сворачивает своё влияние во входящий градиент ∂L/∂q. Поэтому узел использует только этот градиент, свои входы и локальное правило производной.
  kind: open
  reference: Входящий градиент ∂L/∂q уже содержит совокупное влияние всех последующих операций. Узлу остаётся умножить его на собственные локальные производные ∂q/∂u и ∂q/∂v.
  id: 009-local-gradients-2
  fingerprint: f05bd134
