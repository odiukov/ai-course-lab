- concept: без обнуления новые градиенты складываются с градиентами предыдущего обратного прохода
  question: После одного backward в параметре сохранился градиент 0.7. Следующий backward вычислил для него градиент 0.2, но перед этим градиент не обнулили. Какое значение будет храниться после накопления?
  explanation: 'PyTorch по умолчанию накапливает градиенты: 0.7 + 0.2 = 0.9. Если накопление не задумано специально, перед новым backward нужно вызвать zero_grad, иначе обновление учтёт устаревший вклад.'
  kind: numeric
  answer: 0.9
  tolerance: 0.001
