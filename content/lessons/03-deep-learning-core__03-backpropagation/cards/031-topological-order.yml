- concept: узел готов к локальному backward только после обработки всех использующих его узлов
  question: В вычислительном графе один промежуточный узел используется несколькими последующими операциями. Когда можно безопасно вызвать его локальный `_backward()`?
  explanation: Каждый использующий узел может добавить свой вклад в градиент общего входа. Если вызвать `_backward()` раньше, к предшествующим узлам уйдёт неполный градиент. Обратный топологический порядок гарантирует, что все такие вклады накопятся заранее.
  kind: choice
  options:
    - Сразу после получения первого ненулевого вклада в его градиент
    - Как только обработан любой путь от итоговой функции до этого узла
    - После обработки всех узлов, которые используют его результат
  correct: 2
  id: 031-topological-order-1
  fingerprint: 0d5f473a
- concept: обратный топологический порядок может быть неединственным для независимых ветвей графа
  question: Две независимые ветви вычислительного графа сходятся только в итоговой функции потерь. Какой порядок их обратной обработки допустим?
  explanation: Топологическая сортировка задаёт ограничения только между зависимыми узлами. У независимых ветвей фиксированного взаимного порядка нет, поэтому корректных обратных топологических порядков может быть несколько.
  kind: choice
  options:
    - Сначала обязательно обрабатывается ветвь, построенная раньше в программе
    - Сначала обязательно обрабатывается ветвь с большим градиентом
    - Ветви можно обрабатывать в любом взаимном порядке, если каждый узел идёт раньше своих зависимостей
  correct: 2
  id: 031-topological-order-2
  fingerprint: d1ec521b
