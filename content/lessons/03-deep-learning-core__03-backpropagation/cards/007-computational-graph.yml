- concept: вычислительный граф хранит операции и зависимости между их результатами
  question: Какая запись содержит достаточно информации, чтобы представить вычисление в виде вычислительного графа?
  explanation: Узлы вычислительного графа представляют операции, а направленные рёбра показывают, какие значения поступили в эти операции и где затем использовались их результаты. Одного итогового значения для восстановления таких зависимостей недостаточно.
  kind: choice
  options:
    - Только итоговое значение
    - Операции, их входные значения и связи между промежуточными результатами
    - Только список параметров модели
    - Названия операций без указания их входов
  correct: 1
  id: 007-computational-graph-1
  fingerprint: 93002b6c
- concept: один промежуточный результат может быть входом нескольких последующих операций
  question: Пусть промежуточное значение u одновременно используется в операциях v = g(u) и r = h(u). Как эта зависимость представляется в вычислительном графе?
  explanation: Граф должен сохранить каждое использование промежуточного значения. Поэтому результат u становится входом двух разных узлов, а от него возникают две исходящие зависимости — к g и к h.
  kind: choice
  options:
    - От результата u идут связи к обеим операциям g и h
    - Значение u связывают только с той операцией, которая выполняется первой
    - Операции g и h объединяют в один узел независимо от их смысла
    - В графе сохраняют только результаты v и r, не указывая их зависимость от u
  correct: 0
  id: 007-computational-graph-2
  fingerprint: 8aaac08c
