- concept: backward управляет порядком обхода, а локальное распространение градиента реализуют операции
  question: Объясни своими словами, почему общий метод backward() не должен содержать отдельные формулы производных для сложения, умножения и других операций.
  explanation: 'Разделение обязанностей делает движок расширяемым: backward() организует проход по графу, а каждый узел знает только собственное правило локального распространения градиента.'
  kind: open
  reference: backward() отвечает за построение порядка обхода и запуск узлов. Формула локального переноса градиента относится к конкретной операции и хранится в её _backward(), поэтому общий алгоритм остаётся одинаковым для разных вычислительных графов.
