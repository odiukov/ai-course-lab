- concept: ограничение экстремального логита предотвращает переполнение экспоненты без заметного изменения выхода сигмоиды
  question: Объясни своими словами, зачем ограничивать логит перед наивным вычислением сигмоиды и почему это почти не искажает результат.
  explanation: Опасность создаёт не итог сигмоиды, а промежуточное значение экспоненты. Ограничение входа защищает вычисление, сохраняя практически тот же насыщенный ответ.
  kind: open
  reference: При сильно отрицательном логите экспонента получает огромный положительный аргумент и может переполниться. Ограничение логита удерживает промежуточное вычисление в безопасном диапазоне, а результат почти не меняется, поскольку сигмоида на краях уже насыщена.
