- concept: случайная инициализация весов нарушает симметрию между нейронами одного слоя
  question: Все нейроны скрытого слоя получили одинаковые нулевые веса и одинаковые смещения. Что произойдёт при обучении на одних и тех же данных?
  explanation: При одинаковых параметрах нейроны вычисляют одинаковые выходы, получают одинаковые градиенты и одинаково обновляются. Случайные различия весов разрушают эту симметрию.
  kind: choice
  options:
    - Они будут получать одинаковые градиенты и останутся одинаковыми
    - Каждый нейрон самопроизвольно начнёт изучать разные признаки
    - Одинаковыми останутся только смещения, а веса сразу разойдутся
    - Градиенты всех параметров обязательно станут ненулевыми и различными
  correct: 0
  id: 016-start-params-1
  fingerprint: 39c206cd
- concept: масштаб начальных весов убывает обратно пропорционально квадратному корню из числа входов
  question: У нейрона A 18 входов, а у нейрона B — 50. Масштаб инициализации обратно пропорционален квадратному корню из числа входов. Во сколько раз масштаб A больше масштаба B?
  explanation: 'Отношение масштабов равно sqrt(50 / 18) ≈ 1.67. В формуле scale = sqrt(2 / n_inputs) общий множитель сокращается: чем больше входов, тем меньше стартовый диапазон весов.'
  kind: numeric
  answer: 1.67
  tolerance: 0.02
  id: 016-start-params-2
  fingerprint: 8d715d58
- concept: фиксированный seed делает случайную инициализацию воспроизводимой
  question: Объясните своими словами, зачем перед созданием нейросети фиксировать seed генератора случайных чисел.
  explanation: Seed не отменяет случайную инициализацию, а делает её повторяемой. Без него различия между запусками могут быть вызваны не изменением алгоритма, а другими начальными весами.
  kind: open
  reference: Фиксированный seed заставляет генератор выдавать одну и ту же последовательность случайных значений, поэтому сеть при повторных запусках получает одинаковые начальные веса. Это позволяет воспроизводить результат и корректно сравнивать изменения в коде или настройках обучения.
  id: 016-start-params-3
  fingerprint: 318b1f19
