- concept: скалярный выход обычно не позволяет однозначно восстановить вектор скрытых активаций
  question: Почему по одному скалярному выходу сети с несколькими скрытыми нейронами обычно нельзя однозначно восстановить все скрытые активации?
  explanation: Даже если обратить сигмоиду и узнать выходной логит, останется одно линейное уравнение для нескольких скрытых активаций. У такого уравнения обычно существует множество решений, поэтому для backward активации сохраняют во время forward.
  kind: open
  reference: Выходной нейрон получает лишь одну взвешенную сумму скрытых активаций, а затем преобразует её сигмоидой. Много разных векторов активаций могут давать одну и ту же сумму и один и тот же выход, поэтому утраченные промежуточные значения однозначно не восстанавливаются.
