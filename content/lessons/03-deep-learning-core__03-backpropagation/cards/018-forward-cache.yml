- concept: backward должен использовать промежуточные значения того же прямого прохода, который породил дифференцируемую потерю
  question: Сеть выполнила forward для объекта A, затем перезаписала кэш результатами forward для объекта B, после чего запустила backward для потери объекта A. Какова главная проблема?
  explanation: Локальные производные вычисляются в точках, полученных во время конкретного forward. Если подставить активации другого объекта, цепочка производных перестаёт соответствовать вычислению потери объекта A.
  kind: choice
  options:
    - Backward использует промежуточные значения объекта B и получает градиенты, не соответствующие потере объекта A
    - Неверным будет только градиент смещения выходного слоя
    - Градиенты останутся верными, если параметры сети между проходами не менялись
    - Проблемы нет, потому что сигмоида является детерминированной функцией
