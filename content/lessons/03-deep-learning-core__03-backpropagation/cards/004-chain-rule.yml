- concept: производная составной зависимости равна произведению локальных производных
  question: Вес w влияет на функцию потерь L только через промежуточную величину a. Дополните формулу цепного правила.
  explanation: Цепное правило связывает влияние веса на промежуточную величину с влиянием этой величины на потери. Поэтому локальные производные вдоль пути от w к L перемножаются.
  kind: cloze
  template: $\frac{dL}{dw}=___$
  answer: \frac{dL}{da}\cdot\frac{da}{dw}
  accept:
    - \frac{dL}{da}\frac{da}{dw}
    - (dL/da)*(da/dw)
  id: 004-chain-rule-1
  fingerprint: 9ad17ce7
- concept: обратное распространение вычисляет градиенты от потерь к параметрам в обратном порядке операций
  question: Расположите действия обратного распространения в правильном порядке для вычисления производной потерь по выбранному весу.
  explanation: Прямой проход идёт от входа к потерям, а обратное распространение — от потерь назад. На каждой операции текущая чувствительность умножается на её локальную производную.
  kind: order
  items:
    - Найти производную потерь по финальному выходу сети
    - Умножить полученную чувствительность на локальную производную последней операции
    - Продолжать умножение на локальные производные, двигаясь назад к выбранному весу
    - Получить производную потерь по выбранному весу
  id: 004-chain-rule-2
  fingerprint: 320b965a
- concept: знак градиента определяется произведением знаков локальных производных
  question: По пути от веса w к потерям L одна локальная производная отрицательна, а все остальные положительны. Какой знак имеет производная dL/dw?
  explanation: По цепному правилу локальные производные перемножаются. Произведение с одной отрицательной производной и положительными остальными отрицательно.
  kind: choice
  options:
    - Положительный
    - Отрицательный
    - Нулевой
    - Знак невозможно определить
  correct: 1
  id: 004-chain-rule-3
  fingerprint: d90a89c4
