- concept: MSE вычисляется как среднее квадратов отклонений прогнозов от целей
  question: Расположите операции вычисления MSE для набора прогнозов в правильном порядке.
  explanation: Сначала получают отклонения прогнозов от целей, затем устраняют их знак возведением в квадрат и усредняют результаты. Так весь набор прогнозов получает одну скалярную оценку.
  kind: order
  items:
    - Для каждого прогноза вычислить разность между ним и соответствующей целью
    - Возвести каждую полученную разность в квадрат
    - Найти среднее арифметическое квадратов
  id: 022-loss-objective-1
  fingerprint: 6767545c
- concept: квадрат ошибки делает вклад отклонения независимым от его знака
  question: 'Два прогноза отклоняются от цели на одинаковую величину: один в меньшую сторону, другой в большую. Как соотносятся их вклады в MSE?'
  explanation: В MSE отклонение возводится в квадрат, поэтому смена его знака не меняет результат. Равные по модулю отклонения дают одинаковые вклады.
  kind: choice
  options:
    - Они равны
    - Прогноз ниже цели даёт больший вклад
    - Прогноз выше цели даёт больший вклад
  correct: 0
  id: 022-loss-objective-2
  fingerprint: 2e6bd707
- concept: MSE равна нулю только при полном совпадении всех прогнозов с целями
  question: При каком условии MSE для набора прогнозов равна нулю? Объясните своими словами.
  explanation: Квадраты отклонений неотрицательны. Их среднее может быть нулевым лишь в случае, когда каждое отклонение равно нулю.
  kind: open
  reference: 'MSE равна нулю тогда и только тогда, когда каждый прогноз совпадает со своей целью: все квадраты отклонений должны быть нулевыми.'
  id: 022-loss-objective-3
  fingerprint: 7d63e569
