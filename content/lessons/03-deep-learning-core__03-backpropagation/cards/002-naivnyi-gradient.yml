- concept: оценка частной производной потерь по весу конечной разностью
  question: При весе 0,27 потери равны 1,1500. После увеличения веса до 0,2702 потери стали равны 1,1492. Чему равен приближённый градиент потерь по этому весу?
  explanation: Конечная разность равна (1,1492 − 1,1500) / (0,2702 − 0,27) = −4. Отрицательный знак означает, что в окрестности текущего значения увеличение веса уменьшает потери.
  kind: numeric
  answer: -4
  tolerance: 0.05
  id: 002-naivnyi-gradient-1
  fingerprint: 0b050495
- concept: выбор масштаба возмущения при численной оценке градиента
  question: Каким должно быть изменение веса при оценке градиента методом конечных разностей?
  explanation: Слишком большой сдвиг отражает поведение функции вдали от текущего веса, а слишком малый может потеряться из-за ограниченной точности вычислений.
  kind: choice
  options:
    - Как можно большим, чтобы изменение потерь было заметнее
    - Достаточно малым для локальной оценки, но различимым при используемой числовой точности
    - Строго нулевым, чтобы не менять состояние сети
    - 'Любым: размер изменения не влияет на точность оценки'
