- concept: обновлённые значения должны быть сохранены в коллекции параметров
  question: 'Почему такой код может оставить сеть без изменений: `p = params[name]; p = p - learning_rate * grads[name]`? Объясни своими словами.'
  explanation: Обычное присваивание переменной p не заменяет значение в словаре. Если обновление не записать обратно и не изменить исходный массив на месте, следующий прямой проход снова использует прежние параметры.
  kind: open
  reference: Вторая строка лишь привязывает локальную переменную p к новому массиву. Запись params[name] продолжает указывать на старый массив. Нужно присвоить результат обратно в params[name] или выполнить допустимое обновление массива на месте.
