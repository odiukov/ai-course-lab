- concept: доли классов при равномерной выборке определяются отношением площадей областей
  question: Точки равномерно выбирают в квадрате со стороной 18. Положительный класс образует вписанную в него область круга радиуса 5. Какую точность в процентах примерно даст классификатор, всегда выбирающий внешний класс?
  explanation: Площадь квадрата равна 324, а площадь круга — 25π ≈ 78,54. Доля внешней области равна (324 − 25π) / 324 ≈ 75,8%, поэтому постоянный классификатор получит такую точность без использования координат.
  kind: numeric
  answer: 75.8
  tolerance: 0.2
  id: 045-circle-baseline-1
  fingerprint: 91444aa9
- concept: совпадение точности модели с базовым результатом не подтверждает использование признаков
  question: Классификатор на несбалансированной выборке достиг той же accuracy, что и правило «всегда выбирать наиболее частый класс». Почему этого недостаточно, чтобы утверждать, что модель использует входные признаки?
  explanation: Общая accuracy скрывает способ получения правильных ответов. При преобладании одного класса модель может угадывать его постоянно и не выучить зависимость ответа от входов.
  kind: open
  reference: Такая accuracy достижима постоянным ответом без анализа признаков. Чтобы считать обучение границы подтверждённым, модель должна заметно превзойти этот базовый результат.
  id: 045-circle-baseline-2
  fingerprint: abe75203
