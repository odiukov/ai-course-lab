- concept: производная квадратичной ошибки по предсказанию равна удвоенному отклонению
  question: Квадратичная ошибка для скалярного выхода задана квадратом отклонения. Предсказание равно 8, цель — 14. Чему равна производная ошибки по предсказанию?
  explanation: Производная квадрата даёт удвоенное отклонение. Отклонение равно 8 − 14 = −6, поэтому градиент по предсказанию равен −12.
  kind: numeric
  answer: -12
  tolerance: 0.001
  id: 023-code-loss-for-params-1
  fingerprint: 6a0cab5e
- concept: вычитание константной цели в вычислительном графе можно выразить сложением с её отрицанием
  question: Заполни пропуск так, чтобы получить отклонение предсказания от скалярной цели, используя сложение объектов Value.
  explanation: Value(-target) представляет отрицательную цель. Её сложение с predicted эквивалентно вычитанию target и сохраняет операцию внутри вычислительного графа.
  kind: cloze
  template: diff = predicted + ___
  answer: Value(-target)
  accept:
    - Value(-target)
    - Value( -target )
  id: 023-code-loss-for-params-2
  fingerprint: '96499408'
