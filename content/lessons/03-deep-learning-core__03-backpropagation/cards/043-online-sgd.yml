- concept: в онлайновом SGD параметры обновляются после каждого обучающего примера
  question: Чем онлайновый SGD отличается от обучения с градиентом по полному батчу?
  explanation: В приведённом цикле за loss.backward() сразу следует обновление всех параметров. Поэтому каждый из 80 примеров эпохи порождает отдельный шаг SGD, а следующий пример проходит через новую версию сети.
  kind: choice
  options:
    - После вычисления градиента для каждого примера параметры сразу обновляются, поэтому следующий пример обрабатывает уже изменённая сеть
    - Градиенты всех примеров сначала накапливаются, а параметры обновляются только после обработки всего набора
    - Параметры обновляются только тогда, когда текущий пример классифицирован неверно
    - На каждом примере обновляется лишь случайно выбранный параметр сети
  correct: 0
  id: 043-online-sgd-1
  fingerprint: 9a734c8c
- concept: перемешивание примеров устраняет систематическое влияние их фиксированного порядка на последовательность обновлений
  question: Почему при онлайновом SGD обучающие примеры обычно перемешивают перед каждой эпохой?
  explanation: В онлайновом SGD соседние примеры могут направлять параметры в разные стороны. Если все 2000 эпох повторять один порядок, будет повторяться и структура этих поправок; random.shuffle(circle_data) устраняет такую зависимость.
  kind: open
  reference: Поскольку каждый пример немедленно изменяет параметры, порядок примеров определяет последовательность градиентных шагов. Перемешивание меняет эту последовательность между эпохами и не позволяет сети приспосабливаться к устойчивому порядку подачи данных.
  id: 043-online-sgd-2
  fingerprint: 0404dd91
