- concept: простой без активности ловится отдельным событием тайм-аута, потому что зависшая сессия не даёт ни ошибки, ни завершения
  question: 'Клиент подключился к голосовому агенту и 90 секунд не произносит ни слова: ошибок нет, задача не завершалась, ресурсы держатся. Какой механизм Pipecat предназначен для этой ситуации?'
  explanation: Зависшая сессия не порождает ни завершения, ни исключения — снаружи она неотличима от работающей. Поэтому у задачи есть отдельное событие простоя (on_idle_timeout), к которому привязывают закрытие сессии и освобождение ресурсов. Наблюдатели только смотрят и не управляют жизненным циклом.
  kind: choice
  options:
    - Событие тайм-аута простоя у задачи пайплайна
    - UPSTREAM-кадр отмены, который автоматически рассылает TTS
    - Наблюдатель метрик — он закрывает сессию, когда время дубля превысило порог
    - Событие завершения пайплайна — оно срабатывает само при отсутствии кадров
  correct: 0
