- concept: наблюдатель читает происходящее внутри сессии, не вмешиваясь в поток кадров, и потому даёт метрики и трассировку без изменения поведения пайплайна
  question: События жизненного цикла уже говорят, что сессия началась и закончилась. Зачем к задаче пайплайна дополнительно подключают наблюдателей и чем их роль отличается от роли процессора?
  explanation: 'Разделение простое: события — про состояние задачи целиком, наблюдатели — про то, что происходило внутри неё. Наблюдатель пассивен, поэтому его можно включать в проде для метрик и отключать без риска сломать обработку.'
  kind: open
  reference: 'События отвечают на вопрос «что случилось с сессией» — грубые точки: старт, финиш, простой. Они не объясняют, почему ответ занял, скажем, полторы секунды и на каком этапе накопилась задержка. Наблюдатель подключается к задаче и смотрит на прохождение кадров со стороны: собирает метрики по этапам, трассировку и данные для RTVI — интерфейса синхронизации агента с клиентским приложением. Ключевое отличие от процессора: процессор стоит в цепочке, принимает и отдаёт кадры и потому меняет поток; наблюдатель в цепочке не стоит, кадры не преобразует и поведение пайплайна не меняет — снять или добавить его можно, не трогая логику работы агента.'
  id: 010-pipeline-task-3
  fingerprint: 0d33fdba
