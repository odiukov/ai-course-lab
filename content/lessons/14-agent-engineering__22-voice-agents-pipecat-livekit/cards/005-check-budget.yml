- concept: пол каскада пробивается только удалением этапов (прямая аудио-модель), а не оптимизацией внутри этапов
  question: Продукту нужна сквозная задержка ниже той, что даёт сумма лучших значений всех этапов каскада STT -> LLM -> TTS. Что реально даёт шанс попасть в такой бюджет?
  explanation: 'Пол каскада — сумма лучших значений его этапов (в типичных числах 2026 это ~400 мс). Пробить его оптимизацией кода нельзя: LLM не начнёт отдавать первый токен раньше, а TTS не озвучит текст, которого ещё нет — параллелить последовательную зависимость нечем. Единственный рычаг — убрать этапы: прямая аудио-модель заменяет STT+LLM+TTS одним проходом.'
  kind: choice
  options:
    - Перейти на прямую речь-в-речь модель (MultimodalAgent), убрав отдельные этапы STT и TTS из цепочки
    - Распараллелить STT и LLM внутри того же каскада, чтобы этапы шли одновременно
    - Увеличить размер аудиобуфера на входе, чтобы реже дёргать сеть
    - Переписать пайплайн на более быстром языке и убрать лишние аллокации в коде
