- concept: длительность хвоста после перебивания равна объёму уже неотзывного подготовленного аудио, а сброшенные локальные очереди в него не входят
  question: 'В момент отмены состояние такое: в очереди приложения лежат 5 порций по 80 мс (приложение их сбрасывает), один пакет на 80 мс уже ушёл в транспорт, буфер воспроизведения клиента содержит 380 мс аудио. Сколько миллисекунд агент будет слышен после отмены?'
  explanation: 'Считается только неотзывное: 380 мс в буфере клиента + 80 мс пакета в пути = 460 мс. Пять порций по 80 мс из локальной очереди не звучат вовсе — приложение ими ещё владеет и удаляет их. Отсюда правило: хвост barge-in измеряется объёмом аудио ниже точки контроля, а не общим объёмом сгенерированного.'
  kind: numeric
  answer: 460
  tolerance: 5
  id: 026-tts-cutoff-2
