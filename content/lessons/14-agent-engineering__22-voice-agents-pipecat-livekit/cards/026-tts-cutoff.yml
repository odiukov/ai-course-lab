- concept: размер аудиопорции — компромисс между устойчивостью воспроизведения и длиной хвоста после перебивания
  question: Команда уменьшает размер аудиочанка синтеза со 100 мс до 20 мс. Какой результат ожидаем?
  explanation: 'Гранулярность порции задаёт минимальную единицу, которую уже нельзя отозвать, — мелкие порции сокращают хвост. Плата: на каждую порцию свои заголовки и обработка, а тонкий поток хуже переживает сетевые скачки, поэтому клиенту нужен запас буфера, который хвост обратно удлиняет.'
  kind: choice
  options:
    - Хвост после перебивания короче, но растёт служебная нагрузка на пакет и риск неровного звука при нестабильной сети
    - Хвост после перебивания короче и одновременно устойчивее воспроизведение — компромисса нет
    - Длина хвоста не изменится, потому что она зависит только от скорости синтеза
    - 'Хвост станет длиннее: чем мельче порции, тем больше их успевает накопиться в буфере клиента'
