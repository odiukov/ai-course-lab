- concept: 'причинная цепочка событий при перебивании: воспроизведение, детекция речи, отмена против потока, сброс очередей, передача хода'
  question: Голосовой агент озвучивает ответ, и в этот момент пользователь начинает говорить. Расставь события хода с перебиванием в причинном порядке.
  explanation: 'Прогон считается успешным не по числу строк трассировки, а по этому порядку: речь пользователя появилась раньше отмены, отмена — раньше прекращения выдачи новых фрагментов TTS, а новый пользовательский ход начался только после смены владельца. Если отмена стоит в логе позже следующих порций синтеза, механизм сработал с опозданием, даже когда все события присутствуют.'
  kind: order
  items:
    - транспорт воспроизводит очередные аудиофрагменты ответа агента
    - детектор речевой активности фиксирует начало новой реплики пользователя
    - команда отмены уходит UPSTREAM по цепочке процессоров
    - синтез речи прекращается, накопленные аудиоочереди сбрасываются
    - владельцем хода становится пользователь, его реплика уходит в распознавание
  id: 028-scripted-run-1
  fingerprint: baa575a5
- concept: точка съёма сигнала отмены определяет, сколько лишнего агент договорит поверх пользователя
  question: Детектор речевой активности сообщает о начале речи пользователя через 700 мс после её старта, а финальный транскрипт этой фразы распознавание отдаёт ещё через 300 мс. Разработчик запускает отмену не по сигналу детектора, а только по финальному транскрипту. Сколько миллисекунд после начала речи пользователя агент продолжает говорить?
  explanation: '700 + 300 = 1000 мс. Отмену снимают с самого раннего этапа, который вообще способен заметить перебивание: ждать содержания новой фразы незачем, потому что для решения «замолчать» достаточно факта речи. Каждый этап, добавленный до момента отмены, целиком превращается в время, которое агент спорит с живым человеком.'
  kind: numeric
  answer: 1000
  tolerance: 1
  id: 028-scripted-run-2
  fingerprint: c4e5f5c5
- concept: сценарий без перебивания не исполняет путь отмены, поэтому не может обнаружить его дефекты
  question: 'Команда проверяет голосового агента только одним сценарием: пользователь молчит, пока агент договаривает ответ. Все прогоны проходят. Какой класс дефектов такой набор проверок принципиально не поймает?'
  explanation: 'В сценарии без перебивания код отмены просто не исполняется, поэтому зелёный результат о нём ничего не говорит. Нужны два прогона: первый подтверждает, что ответ доходит до конца, второй — что при чужой речи агент вовремя уступает ход. Остальные варианты видны и в нормальном ходе.'
  kind: choice
  options:
    - неверный порядок этапов в цепочке распознавание—LLM—синтез
    - 'любые дефекты пути отмены: команда не приходит, приходит с опозданием или не сбрасывает очереди аудио'
    - слишком долгий синтез речи на длинных ответах
  correct: 1
