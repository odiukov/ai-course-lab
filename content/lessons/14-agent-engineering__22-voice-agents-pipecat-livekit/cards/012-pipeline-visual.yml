- concept: детектор речи отвечает за границы фрагмента, а распознавание — за его содержание, поэтому обрезанные реплики при верных словах указывают на первый этап, а не на второй
  question: 'Агент регулярно реагирует только на конец фразы пользователя: начало реплики теряется, но те слова, что дошли, расшифрованы правильно. Какой этап пайплайна чинить первым?'
  explanation: 'Разделение обязанностей: детектор речи решает, где речь начинается и заканчивается, распознавание — какие в этом фрагменте слова. Верно расшифрованные слова означают, что распознавание работает по тому куску, который ему дали; значит, кусок пришёл обрезанным — виноват порог или окно детектора. Симптом «слова искажены, но фраза целиком» указывал бы на обратное.'
  kind: choice
  options:
    - 'Детекцию речи: она задаёт границы фрагмента и, судя по симптому, отрезает начало'
    - 'Распознавание речи: пропуск слов означает низкую точность модели'
    - 'LLM: контекст диалога собирается неполным'
    - 'Транспорт: входящее аудио приходит с потерей пакетов в начале реплики'
