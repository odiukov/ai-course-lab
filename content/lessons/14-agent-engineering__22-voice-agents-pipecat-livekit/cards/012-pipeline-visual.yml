- concept: синтез речи отдаёт аудио фрагментами, поэтому воспроизведение начинается до готовности всей реплики и целевой метрикой служит время до первого звука
  question: Почему для этапа синтеза речи в голосовом агенте измеряют время до первого звукового фрагмента, а не время полной генерации реплики?
  explanation: 'Аудио в пайплайне потоковое: пользователь слышит начало ответа, пока хвост ещё синтезируется. Поэтому в бюджет задержки входит только время до первого звука (типично 100–200 мс), а не длительность всей фразы — иначе длинный ответ по определению не влезал бы ни в какой бюджет.'
  kind: choice
  options:
    - Синтез отдаёт аудио частями, воспроизведение стартует с первого фрагмента, а остальные догоняют во время проигрывания
    - Полное время генерации у современных моделей синтеза одинаково у всех провайдеров и потому неинформативно
    - Полная генерация происходит уже после того, как транспорт закрыл соединение
    - Первый фрагмент — единственный, который слышит пользователь, остальные обрезаются при перебивании
  correct: 0
