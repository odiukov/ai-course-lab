- concept: этапы голосового пайплайна выполняются последовательно, поэтому их задержки складываются и урезают остаток общего бюджета
  question: 'Бюджет на ответ — 720 мс. Этапы идут строго друг за другом: детекция конца реплики 80 мс, распознавание речи 150 мс, синтез речи до первого звука 130 мс, транспорт 40 мс. Сколько миллисекунд остаётся LLM на первый токен, чтобы уложиться в бюджет?'
  explanation: '720 − (80 + 150 + 130 + 40) = 320 мс. Этапы последовательные, значит задержки суммируются: перерасход на любом из них вычитается из остатка и не компенсируется ускорением следующих. Поэтому перед запуском складывают латентности всех компонентов и смотрят на сумму, а не на отдельные цифры.'
  kind: numeric
  answer: 320
  tolerance: 1
  id: 002-budget-600-2
