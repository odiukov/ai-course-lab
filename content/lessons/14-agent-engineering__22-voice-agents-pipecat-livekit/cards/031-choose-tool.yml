- concept: необходимая глубина архитектуры задаётся самым строгим текстовым требованием из набора, а не большинством требований
  question: 'У голосового агента четыре требования: низкая задержка, естественная интонация, работа в браузере и обязательная замена ошибочных названий товаров в распознанной фразе перед отправкой в LLM. Как это определяет архитектуру?'
  explanation: 'Требования к тексту не усредняются. Достаточно одного обязательного вмешательства в промежуточный текст, чтобы прямое аудио перестало подходить: там текст либо не существует как отдельный рабочий объект, либо появляется уже после озвучивания. Задержка, интонация и транспорт при этом остаются требованиями, но решаются внутри выбранного каскада — подбором моделей и транспортного адаптера.'
  kind: choice
  options:
    - Одно требование на изменение текста уже обязывает взять явный каскад STT/LLM/TTS, хотя три остальных закрылись бы прямым аудио
    - 'Побеждает большинство: три требования из четырёх указывают на прямое аудио, значит берём его'
    - Требования такого рода взаимно исключены, поэтому агента надо разделить на два независимых
    - Архитектуру определяет требование к браузеру, остальные закрываются настройками провайдера
  correct: 0
