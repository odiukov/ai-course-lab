- concept: 'явный каскад не является безусловным улучшением: лишние управляющие этапы оплачиваются задержкой и кодом, поэтому берут минимально достаточную глубину'
  question: Почему при выборе архитектуры голосового агента не стоит по умолчанию брать самый низкий уровень контроля (ручной каскад со своими процессорами), даже если он умеет всё?
  explanation: 'Правило работает в одну сторону: больше текстовых вмешательств — ниже уровень. Обратное не следует: низкий уровень не улучшает разговор сам по себе, он лишь открывает доступ к промежуточным этапам, и этот доступ оплачивается задержкой и сложностью.'
  kind: open
  reference: 'Глубина контроля не бесплатна. Каждый явный этап добавляет свою задержку в общую сумму и свой код, который надо писать, тестировать и поддерживать (обработка перебивания, отмена, порядок кадров). Если агенту нужен только быстрый и естественный разговор, а промежуточный текст никто не читает и не правит, каскад из пяти этапов даёт худшую задержку и больше кода при тех же наблюдаемых свойствах. Поэтому выбирают минимально достаточный уровень: спускаться ниже имеет смысл ровно настолько, насколько реально нужны вмешательства в текст.'
  id: 031-choose-tool-3
  fingerprint: 39c51099
