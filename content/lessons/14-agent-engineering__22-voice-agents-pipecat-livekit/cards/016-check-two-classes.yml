- concept: требование настроить или заменить отдельный этап распознавания выполнимо только в архитектуре, где этот этап существует как самостоятельный компонент
  question: Медицинский голосовой агент на LiveKit Agents обязан использовать собственное распознавание речи, дообученное на 400 названий препаратов, иначе названия слышатся неверно. Какой класс агента это допускает и почему?
  explanation: Заменить можно только то, что существует отдельно. В VoicePipelineAgent STT — самостоятельное звено каскада, его провайдер и словарь настраиваются. MultimodalAgent отдаёт аудио прямо в модель (OpenAI Realtime или аналог), отдельной точки распознавания там нет, поэтому подставить своё STT некуда.
  kind: choice
  options:
    - 'MultimodalAgent: аудио идёт прямо в модель, а словарь препаратов задаётся отдельным этапом STT'
    - 'VoicePipelineAgent: распознавание в нём — отдельный этап цепочки STT → LLM → TTS, и его можно заменить своим'
    - 'Любой из двух: подключение своего STT не зависит от класса агента'
  correct: 1
  id: 016-check-two-classes-1
  fingerprint: 2bb820dc
- concept: требование к каналу связи закрывается транспортом и не определяет выбор класса голосового агента
  question: 'От агента на LiveKit Agents требуют одного: принимать обычные телефонные звонки, а не только работать в браузере. Что следует из этого требования для выбора между MultimodalAgent и VoicePipelineAgent?'
  explanation: 'Канал (WebRTC из браузера, SIP из телефонии) — свойство транспорта, а класс агента отвечает за то, есть ли между входом и выходом текст. Эти два решения независимы: тот же агент отвечает и на звонок, и на веб-сессию. Выбор класса решают другие требования — нужен ли доступ к распознанному тексту и какой потолок задержки.'
  kind: choice
  options:
    - 'Ничего: телефония закрывается транспортом (SIP), оба класса работают через него — выбирать нужно по другому требованию'
    - 'Нужен VoicePipelineAgent: телефонный звук проходит только через каскад STT → LLM → TTS'
    - 'Нужен MultimodalAgent: телефонная линия передаёт аудио напрямую, без текстового этапа'
  correct: 0
