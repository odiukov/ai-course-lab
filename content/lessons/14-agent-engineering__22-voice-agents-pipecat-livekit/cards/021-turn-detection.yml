- concept: фиксированный порог тишины платит одинаковую цену ожидания на всех репликах, а определение конца реплики по завершённости высказывания тратит долгое ожидание только на неоднозначных случаях
  question: Объясни своими словами, почему определение конца реплики по завершённости высказывания даёт лучший компромисс между перебиваниями и задержкой, чем просто увеличенный порог тишины.
  explanation: 'Ключ — асимметрия: у фиксированного порога одно число обслуживает и «Да», и «Мне нужен номер…», поэтому любое улучшение по одному критерию портит другой. Как только время ожидания становится функцией от завершённости фразы, оба критерия улучшаются одновременно, а не обмениваются друг на друга.'
  kind: open
  reference: 'Единый порог тишины — компромисс, оплачиваемый одинаково на каждой реплике: чтобы не обрывать думающего пользователя, приходится ждать долго после любых слов, включая явно законченные. Определение конца реплики по завершённости высказывания делает время ожидания зависимым от содержания: если распознанное похоже на законченную мысль, ответ начинается после короткой паузы; если фраза явно оборвана и требует продолжения, ожидание удлиняется. Цена ожидания платится только там, где она нужна, поэтому средняя задержка падает, а число перебиваний не растёт. Это надстройка, а не замена: акустический детектор по-прежнему фиксирует сам факт паузы, а решение о её смысле принимается поверх него.'
  id: 021-turn-detection-3
