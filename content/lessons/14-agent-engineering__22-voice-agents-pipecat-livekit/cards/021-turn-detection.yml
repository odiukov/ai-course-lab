- concept: детектор голосовой активности измеряет только наличие звука, поэтому пауза посреди незаконченной фразы и пауза после законченной для него неразличимы
  question: Пользователь произносит «Забронируй столик…» и молчит 700 мс, обдумывая время. В другом звонке он говорит «Да» и тоже молчит 700 мс. Почему детектор голосовой активности не может обработать эти два случая по-разному?
  explanation: 'VAD — датчик активности речи в аудиосигнале: на выходе у него факт «звук есть / звука нет» и длительность тишины. Признак, разделяющий эти два случая, лежит в содержании сказанного, а не в акустике паузы, поэтому никакая настройка порога тишины проблему не решает — нужен вход другого рода.'
  kind: choice
  options:
    - Он оценивает только наличие или отсутствие звука, а обе паузы по этому признаку одинаковы
    - Он работает с распознанным текстом, но 700 мс не хватает на распознавание коротких слов
    - Он различает эти случаи, но принудительно округляет длительность паузы до общего порога
    - Он анализирует смысл фразы, однако слово «Да» не входит в его словарь завершающих реплик
