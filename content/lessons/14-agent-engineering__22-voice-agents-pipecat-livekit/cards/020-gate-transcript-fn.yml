- concept: отказ должен кодироваться значением, которое нельзя спутать с валидным результатом распознавания
  question: Почему при блокировке ненадёжного транскрипта функция возвращает `None`, а не пустую строку?
  explanation: 'Смешение отказа с валидным значением — классический источник тихих ошибок в пайплайне: ветка «нет надёжного текста» просто не выполняется, и сомнительная команда уезжает дальше. `None` (или отдельный тип результата) делает отказ явным для вызывающей стороны.'
  kind: open
  reference: 'Пустая строка — валидный результат распознавания (пользователь молчал, шум). Если отказом называть её же, следующий обработчик не отличит «доверять нельзя» от «сказано ничего» и обработает оба случая одинаково. `None` лежит вне множества возможных текстов, поэтому проверка на него однозначно ловит именно срабатывание барьера. Общее правило: сигнал отказа должен быть значением, недостижимым при нормальной работе.'
  id: 020-gate-transcript-fn-3
