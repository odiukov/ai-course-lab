- concept: барьер по уверенности только пропускает или блокирует транскрипт, но не редактирует и не достраивает его содержание
  question: STT вернул фразу «отправь платёж пятьсот» с уверенностью 0.31 при пороге 0.85. Что должен сделать фильтр перед LLM?
  explanation: 'Фильтр — решающий барьер, а не корректор. Любая догадка о содержании добавляет новую ошибку поверх ошибки распознавания, причём невидимую для последующих этапов: LLM получит уверенный текст, которого пользователь не говорил. Единственный корректный выход — отказ и повторный запрос реплики.'
  kind: choice
  options:
    - Заблокировать транскрипт целиком и сообщить, что надёжного текста нет
    - Подставить наиболее вероятную по смыслу фразу вместо сомнительных слов
    - Пропустить текст, но пометить сомнительные слова тегами для LLM
    - Обрезать фразу до слов с высокой уверенностью и передать остаток
