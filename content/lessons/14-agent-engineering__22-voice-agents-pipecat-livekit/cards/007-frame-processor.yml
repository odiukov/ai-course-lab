- concept: FrameProcessor обрабатывает только кадры своего типа, остальные пропускает дальше по цепочке, а не отбрасывает
  question: FrameProcessor в Pipecat получает кадр, тип которого он не обрабатывает (например, TTS-процессор получил служебный кадр управления). Что он с ним делает?
  explanation: 'Процессор смотрит на тип кадра и решает: моё или транзит. Пропуск чужих кадров обязателен — иначе служебные и управляющие кадры не дойдут до тех, кому адресованы, и, например, команда остановки не доедет до нужного этапа. Отбрасывание чужого кадра — типичный баг такого пайплайна.'
  kind: choice
  options:
    - Передаёт кадр дальше по цепочке нетронутым
    - Отбрасывает кадр, чтобы не засорять пайплайн
    - Возбуждает ошибку и останавливает пайплайн
    - Конвертирует кадр в свой тип и обрабатывает
  correct: 0
  id: 007-frame-processor-2
