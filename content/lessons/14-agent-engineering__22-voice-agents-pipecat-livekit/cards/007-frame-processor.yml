- concept: внутри голосового пайплайна LLM работает с обычным списком сообщений user/assistant, аудио живёт только на краях цепочки
  question: 'В голосовом агенте с каскадом STT → LLM → TTS: в каком виде LLM видит диалог и где в цепочке вообще существует аудио? Объясни своими словами.'
  explanation: 'Голос — оболочка, а не другой способ разговаривать с моделью. STT снимает аудио на входе, TTS надевает обратно на выходе; между ними обычный список сообщений user/assistant. Отсюда практическое следствие: отладку логики агента можно вести текстом, без микрофона.'
  kind: open
  reference: 'LLM видит обычный текстовый контекст чата — список сообщений, чередующих роли user и assistant, ровно как в текстовом приложении. Аудио существует только по краям цепочки: на входе, пока STT не превратил его в текст, и на выходе, после того как TTS озвучил ответ. Середина пайплайна текстовая, поэтому промпты, инструменты и работа с контекстом переносятся из текстового агента без изменений.'
  id: 007-frame-processor-3
  fingerprint: e36680b6
