  question: Детектор речевой активности надёжно срабатывает, как только пользователь заговорил поверх агента, и это событие видно в логах. Тем не менее агент договаривает реплику до конца. Объясни своими словами, чего не хватает в пайплайне.
  explanation: 'Типичная ошибка — считать, что достаточно распознать перебивание. Обнаружение и воздействие разнесены: детекция даёт сигнал, но остановка требует команды, дошедшей до генерирующих ответ компонентов, и отбрасывания хвоста уже созданного ответа.'
  kind: open
  reference: Событие «пользователь говорит» — только наблюдение, оно не меняет состояние работающих компонентов. LLM продолжает генерацию, синтез продолжает отдавать аудио, транспорт продолжает его проигрывать, потому что никто не получил команды прекратить. Нужен явный кадр отмены, доставленный компонентам, которые производят текущий ответ, плюс требование, чтобы уже сгенерированные остатки ответа после отмены не проходили дальше по цепочке. Плюс переключение владельца хода на пользователя, иначе после остановки не начнётся новый цикл.
