- concept: владелец хода — переключаемое состояние сессии о том, чью речь система принимает как основную, а не роль участника или свойство аудиоканала
  question: Что такое «владелец хода» (turn ownership) в голосовом агенте?
  explanation: 'Это договорённость системы, а не статус человека и не свойство канала: физически оба могут говорить одновременно, а владелец хода определяет, чью речь пайплайн считает действующей. Перебивание переключает это состояние с агента на пользователя, после чего его аудио и подтверждённый транскрипт запускают новый цикл ответа.'
  kind: choice
  options:
