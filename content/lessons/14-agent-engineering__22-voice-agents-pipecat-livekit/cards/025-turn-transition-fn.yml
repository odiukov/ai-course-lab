- concept: запрос отмены порождается сменой владельца хода с активно говорящего, а не самим фактом события начала речи
  question: Детектор речи выдаёт события «пользователь заговорил» пачкой, много раз подряд за одну фразу. Функция перехода хода возвращает флаг «нужна отмена». Какое условие гарантирует, что отмена ответа агента будет запрошена ровно один раз?
  explanation: 'Отмена привязана к состоянию, а не к событию. Отменять нечего, если агент уже не говорит: в режиме ожидания ход просто переходит пользователю без отмены, и повторное событие речи при уже отданном ходе тоже ничего не отменяет. Условие «предыдущий владелец — агент» делает переход идемпотентным, а счётчики и сравнение времён решают ту же задачу окольным и хрупким способом.'
  kind: choice
  options:
    - 'Выставлять флаг на каждое событие начала речи: повторные отмены безвредны'
    - Выставлять флаг только тогда, когда до события ход принадлежал говорящему агенту, то есть владелец реально меняется
    - Хранить счётчик выданных отмен и не превышать заданный лимит за сессию
    - Выставлять флаг только на события, пришедшие раньше окончания реплики агента по времени
  correct: 1
