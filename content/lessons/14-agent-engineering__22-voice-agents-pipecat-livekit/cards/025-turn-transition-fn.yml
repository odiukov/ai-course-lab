- concept: 'решение о смене владельца хода отделено от эффекта: функция возвращает флаг отмены, а отправку управляющего сигнала выполняет вызывающий код'
  question: Почему логику владения ходом в голосовом агенте оформляют как чистую функцию (состояние, событие) → (новое состояние, нужна ли отмена), а не отправляют сигнал отмены прямо внутри неё?
  explanation: Разделение решения и эффекта — стандартный приём для машин состояний в реальном времени. Решение о владельце хода и флаге отмены проверяется дешёвыми тестами, а адресация управляющего сигнала остаётся у слоя, который знает топологию пайплайна.
  kind: open
  reference: 'Чистая функция содержит только решение: она не трогает аудио, таймеры и не шлёт кадры, поэтому её поведение полностью определяется парой (состояние, событие) и проверяется таблицей случаев без запуска пайплайна и транспорта. Отправку UPSTREAM-сигнала отмены делает вызывающий код, который владеет пайплайном и знает, куда адресовать сигнал. Разделение даёт две выгоды: во-первых, решение можно переиграть — например, подавить дубликат или отложить отмену — не переписывая машину состояний; во-вторых, побочный эффект не выполняется наполовину, когда состояние ещё не обновлено. Если же слать отмену изнутри, каждый тест требует живого пайплайна, а порядок «отменил, потом упал при обновлении состояния» оставляет сессию рассогласованной.'
  id: 025-turn-transition-fn-3
