- concept: 'значения confidence несопоставимы между провайдерами STT: порог — свойство конкретной модели и её шкалы, поэтому при смене провайдера его надо перекалибровать на своих данных, а не переносить числом'
  question: 'Команда меняла провайдера распознавания речи и перенесла в новый пайплайн прежнее правило: «уверенность ниже 0.65 — переспросить». Доля переспросов резко изменилась, хотя качество звука и пользователи те же. Объясни своими словами, почему так вышло и что делать вместо переноса числа.'
  explanation: Шкалы уверенности у разных STT-провайдеров отличаются, поэтому одинаковое число не означает одинаковую надёжность. Перенесённый порог даёт либо лавину переспросов, либо тихий пропуск ошибок. Порог калибруется заново на своих данных при каждой смене модели или провайдера.
  kind: open
  reference: 'Confidence — внутренняя оценка конкретной модели, и её шкала не стандартизирована: одно и то же число у двух провайдеров может соответствовать разной реальной доле ошибок. Поэтому порог не переносится как константа между сервисами — он свойство пары «модель + шкала», а не универсальная величина. Правильный ход: перекалибровать порог на собственной выборке реплик — собрать транскрипты нового провайдера с их значениями уверенности, сверить с эталонной разметкой и выбрать порог, дающий нужный баланс пропущенных ошибок и лишних переспросов; отдельно проверить его для дорогих, необратимых действий.'
