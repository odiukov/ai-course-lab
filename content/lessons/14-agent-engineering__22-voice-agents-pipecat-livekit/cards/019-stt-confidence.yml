- concept: 'порог реакции на уверенность калибруется под цену действия: чем необратимее действие, тем выше требуемая уверенность или тем обязательнее явное подтверждение'
  question: В голосовом агенте один порог уверенности 0.70 на все реплики. Ниже — переспросить, выше — выполнить. Агент умеет и рассказывать расписание, и списывать деньги со счёта. Какое изменение правила уместнее всего?
  explanation: 'Нужен не единый принцип «принимать всё» и не единое число, а правило реакции, привязанное к последствиям. Ошибка в справке стоит одного переспроса, ошибка в списании денег необратима. Единый высокий порог задушит обычный разговор бесконечными переспросами, единый низкий пропустит опасное действие. Вариант с LLM не работает: модель видит только текст и ошибочный вариант выглядит для неё грамотно.'
  kind: choice
  options:
    - 'Сделать порог зависимым от цены действия: для справочных ответов оставить низкий, для списания денег требовать заметно более высокой уверенности или явного подтверждения вслух'
    - Поднять единый порог до 0.99 для всех реплик, чтобы исключить ошибки
    - Опустить единый порог до 0.50, потому что переспросы раздражают пользователя и увеличивают задержку
    - Убрать порог совсем и поручить LLM определять по тексту, надёжен ли транскрипт
