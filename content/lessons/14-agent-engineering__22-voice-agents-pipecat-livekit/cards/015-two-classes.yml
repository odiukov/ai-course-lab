- concept: 'возможность получить транскрипт как побочный вывод не равна наличию обязательного управляющего этапа: контроль требует, чтобы поток нельзя было пройти в обход текста'
  question: 'Инженер возражает: прямая аудио-модель тоже умеет отдавать транскрипт реплик, значит текст у неё есть, и разница с каскадом чисто словесная. Объясни, почему для задач контроля наличие транскрипта и наличие текстового этапа — не одно и то же.'
  explanation: 'Ключ — разница между наблюдением и управлением. «Нет текста» у MultimodalAgent значит не «модель не работает с языком», а «текст не является обязательным этапом, доступным тебе для вмешательства». Практический критерий: можешь ли ты не пропустить реплику дальше, опираясь на этот текст. В каскаде — да, ценой задержки STT (100–250 мс), у прямой модели — нет.'
  kind: open
  reference: 'Транскрипт у прямой аудио-модели — необязательный побочный вывод: аудио доходит до ответа независимо от того, читает кто-то этот текст или нет. Управляемость требует другого свойства — чтобы поток физически не мог пройти дальше, минуя текст. В каскаде текст лежит на пути: STT обязан выдать строку, иначе LLM не получит вход; значит в этом месте можно задержать реплику, отредактировать её, отклонить и подменить. У прямой модели остановить генерацию по содержанию транскрипта нельзя — звук уже сформирован тем же проходом, а транскрипт лишь описывает то, что произошло. Отсюда роли: транскрипт годится для наблюдения и разбора post factum, текстовый этап — для блокировки и правки до озвучивания.'
