- concept: каталог управляемого инференса покрывает ограниченный набор моделей; модель вне каталога подключается плагином и требует собственного аккаунта и ключа провайдера
  question: Команде нужен узкоспециализированный TTS-голос от вендора, которого нет в каталоге моделей платформы (в каталоге около 40 моделей, ещё сотни доступны через плагины). Что это меняет для команды?
  explanation: '«Без ключей» относится только к моделям каталога. Всё остальное подключается через плагины на общих правилах: свой аккаунт, свой ключ, свои лимиты и биллинг. Практический вывод: проверять наличие нужной модели в каталоге до того, как закладывать в план быструю смену провайдера одной строкой.'
  kind: choice
  options:
    - 'Модель недоступна: вне каталога подключить стороннего вендора нельзя'
    - Придётся подключать вендора плагином, заводить у него аккаунт и хранить его ключ
    - 'Ничего не меняется: платформа сама заведёт аккаунт у любого вендора'
    - Придётся отказаться от каскадной архитектуры и перейти на прямую аудио-модель
