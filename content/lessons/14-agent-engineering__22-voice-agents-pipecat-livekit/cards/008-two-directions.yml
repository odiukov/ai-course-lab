- concept: в кадровом пайплайне UPSTREAM переносит управление и обратную связь, а не контент
  question: В Pipecat кадры ходят по цепочке процессоров в двух направлениях. Что из перечисленного поедет по UPSTREAM?
  explanation: 'DOWNSTREAM — направление от источника к приёмнику, по нему идёт полезный груз: аудио, текст, ответ, снова аудио. UPSTREAM несёт управление и обратную связь: отмену, метрики, сигнал перебивания. Все три неверных варианта — звенья одной и той же цепочки обработки контента, то есть чистый downstream.'
  kind: choice
  options:
    - Кадр с распознанным текстом от STT к LLM
    - Кадр отмены генерации и кадры с метриками процессора
    - Кадр синтезированного аудио от TTS к транспорту
    - Кадр с сырым аудио от транспорта к VAD
  correct: 1
  id: 008-two-directions-1
  fingerprint: 7eaf86d2
- concept: отмена должна идти против потока, потому что производители ненужного контента стоят раньше по цепочке, чем место обнаружения перебивания
  question: Перебивание пользователя фиксируется ближе к концу цепочки — там, где агент уже отдаёт звук. Почему сигнал «прекратить» нельзя разослать в том же направлении, в котором идёт контент, и куда он обязан попасть?
  explanation: 'Ключ — топология: место обнаружения события и место его причины стоят в цепочке по разные стороны. Один поток кадров решает задачу доставки контента, но не задачу остановки его производителей.'
  kind: open
  reference: 'Ненужный контент в этот момент производят процессоры, стоящие РАНЬШЕ по цепочке: LLM продолжает генерировать токены, TTS — синтезировать из них аудио. Кадр, отправленный по потоку, уйдёт к приёмнику и никогда не дойдёт до этих производителей, поэтому они продолжат наполнять цепочку. Сигнал отмены обязан идти против потока (UPSTREAM), чтобы дойти до LLM и TTS и остановить производство у истока; иначе агент будет доигрывать уже сгенерированное.'
  id: 008-two-directions-2
  fingerprint: 0ffa2c04
- concept: 'асимметрия двух направлений: плотный поток контента против редких коротких сигналов управления'
  question: Чем нагрузка на два направления кадрового пайплайна отличается друг от друга?
  explanation: 'Поток контента идёт постоянно и состоит из объёмных аудио- и текстовых кадров. Обратный канал переносит отмену, метрики и сигнал перебивания — событийные, редкие и короткие кадры. Малый объём не означает необязательность: без обратного канала пайплайн технически исправен, но не может остановить синтез.'
  kind: choice
  options:
    - 'Оба направления несут сопоставимый объём: на каждый кадр контента приходится подтверждение обратно'
    - Направление к приёмнику — плотный и тяжёлый поток контента, обратное — редкие короткие сигналы управления
    - 'Обратное направление тяжелее: по нему возвращаются метрики и копии всех обработанных кадров'
    - Обратное направление задействуется только при старте и остановке пайплайна, в остальное время не используется
  correct: 1
