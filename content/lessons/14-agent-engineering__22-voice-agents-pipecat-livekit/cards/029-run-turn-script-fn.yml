- concept: 'прогон сценария — свёртка: состояние, изменённое обработкой одного события, служит входом обработки следующего, а не сбрасывается'
  question: Расставь шаги обработки одного события в прогоне сценария диалога так, чтобы события не обрабатывались независимо друг от друга.
  explanation: 'Разговор — это последовательность, где каждый ход опирается на итог предыдущего: после запуска ответа агент владеет ходом, после перебивания владение уже другое. Если каждое событие обрабатывать от исходного состояния, прогон превращается в набор независимых вызовов и теряет ровно то, что делает его разговором.'
  kind: order
  items:
    - Взять текущее состояние разговора (владелец хода, что сейчас звучит)
    - Передать событие вместе с этим состоянием функции нужного этапа
    - Записать возвращённый результат в трассу
    - Заменить текущее состояние тем, которое вернула функция
    - Перейти к следующему событию сценария уже с обновлённым состоянием
  id: 029-run-turn-script-fn-2
  fingerprint: 82b2c985
- concept: событие, отклонённое на раннем этапе прогона, не порождает последующих действий, но обязано оставить запись в трассе
  question: В прогоне сценария транскрипт с уверенностью 0.42 не проходит барьер при пороге 0.65. Как должен повести себя прогон на этом событии?
  explanation: 'Отклонённый транскрипт не является входом для последующих этапов — озвучивать ответ на нераспознанную реплику нельзя. Но молча проглотить событие тоже нельзя: трасса нужна как отчёт о том, какое решение принял каждый этап, и отсутствие записи неотличимо от того, что событие не дошло до прогона.'
  kind: choice
  options:
    - Не проверять конец реплики и не запускать озвучивание, но добавить в трассу запись об отклонении
    - Пропустить событие полностью, не оставляя следа в трассе
    - Всё равно проверить конец реплики и озвучить ответ, пометив его как ненадёжный
    - Прервать весь прогон сценария и вернуть пустую трассу
