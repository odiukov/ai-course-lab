- concept: направление кадра — свойство типа кадра, а не решение конкретного процессора, поэтому таблица маршрутизации одна на весь пайплайн
  question: Почему решение «куда едет кадр» вынесено в одну общую функцию по типу кадра, а не решается условными ветками внутри каждого процессора пайплайна?
  explanation: 'Классическое разделение: маршрутизация — свойство протокола (типов кадров), обработка — свойство процессора. Дублирование маршрутизации в N процессорах создаёт N мест для расхождения, а расхождение здесь проявляется не падением, а тихой поломкой поведения агента.'
  kind: open
  reference: 'Направление — свойство типа кадра: кадр отмены едет против потока независимо от того, какой процессор его увидел. Если логика продублирована в каждом процессоре, она размножена столько раз, сколько процессоров, и каждый новый тип кадра требует правки всех — при этом достаточно одного забытого места, чтобы отмена в этой точке поехала не туда и перебивание перестало работать. Общая таблица даёт единственный источник правды: новый тип добавляется одной строкой, покрытие проверяется одним тестом, а процессор занимается только своей обработкой.'
  id: 009-frame-direction-fn-2
