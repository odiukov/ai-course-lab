- concept: отсутствие финальной пунктуации не является доказательством незавершённости реплики, поэтому решающему правилу нужен запасной срок ожидания
  question: Эвристика конца реплики закрывает ход, если после короткой паузы транскрипт кончается на `.`, `?` или `!`. Зачем такой политике дополнительно нужен запасной срок (например, 1500 мс), после которого непустая реплика считается законченной и без терминального знака?
  explanation: 'Ключ — асимметрия свидетельств: терминальный знак подтверждает завершённость, но его отсутствие не подтверждает незавершённость. Правило, которое трактует отсутствие сигнала как «продолжай ждать», без верхней границы времени превращается в вечное ожидание. Запасной срок делает ошибку в худшем случае конечной по времени.'
  kind: open
  reference: 'Пунктуация в транскрипте — это предсказание модели распознавания, а не то, что произнёс пользователь: знак может быть не проставлен на вполне законченной фразе, особенно в коротких репликах, при шуме или у провайдера, который пунктуацию не выдаёт вовсе. Значит, «нет терминального знака» — слабое свидетельство, а не доказательство незавершённости. Без запасного срока правило умеет только ждать: пользователь замолчал, реплика на деле закончена, а агент не отвечает никогда — диалог зависает. Срок 1500 мс ограничивает цену этой ошибки: сильный сигнал (пунктуация) отвечает быстро, слабый — с задержкой, но отвечает. Обратная сторона — если пользователь просто задумался посреди фразы, агент его перебьёт; поэтому запасной срок ставят заметно выше обычной паузы внутри речи.'
