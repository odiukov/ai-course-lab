- concept: опубликованное вендором число задержки — результат на его конфигурации, а не свойство платформы, переносимое на любого агента
  question: Команда взяла готовую голосовую платформу и планирует записать вендорское число задержки в приёмочный критерий продукта, не проводя своих замеров. Объясни своими словами, почему так делать нельзя.
  explanation: Число вендора — свойство его стенда, а не платформы. Смена модели, региона, языка или длины ответа меняет вклад каждого этапа, и итог уезжает. Retell называет 600 мс по 180 звонкам на своём протоколе; твоя цифра получается только из твоих звонков.
  kind: open
  reference: 'Вендор меряет свою конфигурацию: конкретные модели STT/LLM/TTS, свой регион и близость к пользователю, свои промпты и длину ответа, свой язык и тип звонков, часто без реальной нагрузки. Твой агент отличается по каждому из этих пунктов, и любой из них двигает сумму задержек этапов. Плюс сама методика замера у вендора может быть другой (диапазон против среднего, откуда отсчитывается начало и конец). Поэтому вендорское число — ориентир при выборе платформы, а приёмочный критерий ставится по собственной серии сопоставимых звонков на своей конфигурации.'
  id: 018-platforms-2
  fingerprint: bb12b48f
