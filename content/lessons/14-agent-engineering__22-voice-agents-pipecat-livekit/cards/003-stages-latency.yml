- concept: чинить нужно тот этап голосового пайплайна, чья задержка доминирует в разбивке, а не случайный компонент
  question: 'Разбивка задержки голосового агента по этапам дала: VAD — 45 мс, первые слова расшифровки (STT partial) — 180 мс, первый токен LLM — 520 мс, первое аудио TTS — 140 мс, транспорт RTT — 55 мс. Какое изменение сильнее всего сократит время до первого звука ответа?'
  explanation: 'Этап с наибольшей абсолютной задержкой даёт наибольший выигрыш. 520 мс на первом токене LLM выпадают даже за типичную вилку 150–400 мс, тогда как VAD (20–60 мс) и транспорт (30–80 мс) физически не могут дать сравнимую экономию: даже обнулив их полностью, снимешь около сотни миллисекунд.'
  kind: choice
  options:
    - Сменить модель LLM или провайдера на вариант с меньшим временем до первого токена
    - Заменить движок VAD на более чувствительный
    - Перевести пользователя на более быстрый интернет-канал
    - Поставить TTS с более естественным голосом
  correct: 0
  id: 003-stages-latency-1
  fingerprint: cece04e0
- concept: 'у сквозной задержки голосового агента есть пороги восприятия: около полусекунды слышится премиумом, около секунды — нормой, полторы секунды и больше читаются как поломка'
  question: Голосовой агент стабильно отвечает через 1700 мс после того, как пользователь замолчал. Как это воспринимается человеком в разговоре?
  explanation: 'Порогов три: 450–600 мс слышатся как премиум, 800–1200 мс — обычное дело, а всё сверх 1500 мс человек трактует не как медлительность, а как то, что агент сломался или его не услышали. 1700 мс лежит за этой границей, и качество голоса ситуацию не спасает.'
  kind: choice
  options:
    - Как поломка агента, а не как медленный разговор
    - Как заметно медленный, но нормальный разговор
    - Как премиальное качество отклика
    - Незаметно, если голос TTS звучит естественно
  correct: 0
  id: 003-stages-latency-2
  fingerprint: 10bd34f8
- concept: при одинаковом наборе и порядке этапов сквозная задержка определяется выбором моделей и провайдеров на каждом этапе, а не хитростью кода пайплайна
  question: 'Голосовой агент отвечает за 1100 мс. Инженер планирует рефакторинг кода пайплайна: переписать передачу кадров между этапами и почистить обработчики. Объясни своими словами, почему это вряд ли даст нужный эффект и куда смотреть вместо этого.'
  explanation: Код пайплайна отвечает за склейку этапов, а сами этапы — за миллисекунды. Пока компоненты работают по верхним границам своих вилок, никакая оптимизация склейки не переведёт агента из мира ~990 мс в мир ~400 мс.
  kind: open
  reference: 'У каждого этапа не одно число, а вилка, и верх вилки больше низа в два-три раза: VAD 20–60 мс, STT partial 100–250 мс, первый токен LLM 150–400 мс, первое аудио TTS 100–200 мс, транспорт 30–80 мс. Набор этапов и их порядок у быстрого и медленного агента одинаковые: по нижним границам выходит около 400 мс, по верхним — около 990 мс. Значит разница между «премиум» и «обычное дело» задаётся тем, какие модели и провайдеры стоят на каждом отрезке (и как близко к ним хостинг), а не техникой передачи кадров. Правильный ход: замерить каждый этап отдельно, найти те, что сидят у верхней границы вилки, и менять там модель/провайдера/регион.'
  id: 003-stages-latency-3
  fingerprint: 1a47a1b0
