- concept: готовность каскада к перебиванию определяется наличием сквозного пути отмены и точки сброса аудио, а не полнотой набора этапов
  question: Два прототипа голосовых агентов содержат одинаковый набор из четырёх компонентов и транспорт, и оба корректно отвечают на реплики без перебиваний. По какому признаку определить, какой из них готов к barge-in, если тест с перебиванием ещё не написан?
  explanation: 'Полный набор VAD/STT/LLM/TTS и транспорт описывает только маршрут голоса. Перебивание требует второго маршрута — маршрута остановки, и точки очистки уже подготовленного звука. Именно поэтому заготовку пайплайна закладывают с barge-in сразу: дописать отмену в работающий каскад значит менять все компоненты, а не один.'
  kind: open
  reference: 'Смотреть надо не на состав этапов (он одинаков), а на наличие адресованного всем производящим компонентам пути для управляющего сигнала отмены — и на наличие явного места, где сбрасываются очереди уже подготовленного аудио на выходе синтеза и в транспорте. Готовый агент: у каждого этапа есть обработчик отмены, после которой он прекращает и работу, и отправку результатов дальше, а транспорт умеет выбросить непроигранный остаток. Неготовый: сигнал отмены некуда послать либо он доходит не до всех производителей, и аудиобуфер очищать нечем — тогда перебивание придётся вносить правками во все компоненты сразу.'
