- concept: 'голосовой агент работает через разные транспорты: WebRTC для браузера, SIP для телефонии'
  question: Голосовой агент должен принимать звонки и из веб-приложения, и с обычного телефонного номера. Какая пара транспортов это закрывает?
  explanation: 'Неверно: правильный вариант — первый (индекс 0), WebRTC + SIP. WebRTC — стандарт realtime-аудио в браузере, SIP — протокол, на котором держится обычная телефония. Разные транспорты дают разные форматы кодеков и разную задержку, поэтому транспорт — отдельный слой пайплайна, а не деталь ввода-вывода.'
  kind: choice
  options:
    - WebRTC для браузера и SIP для телефонной линии
    - WebSocket для браузера и SMTP для телефонной линии
    - HTTP long-polling для обоих каналов
    - gRPC для браузера и MQTT для телефонной линии
  correct: 1
