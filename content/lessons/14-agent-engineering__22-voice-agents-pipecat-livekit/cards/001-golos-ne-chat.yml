- concept: развилка между сборкой кадрового пайплайна вручную (Pipecat) и опорой на платформу (LiveKit)
  question: Объясни своими словами, в чём разница подходов Pipecat и LiveKit к построению голосового агента и что каждый из них берёт на себя.
  explanation: 'Ключ в том, что именно ты держишь руками. Pipecat даёт кадровую архитектуру: контроль над каждым узлом и над потоками управления, ценой того, что транспорт и границы хода — твоя забота. LiveKit закрывает транспорт и turn-taking, и агент живёт внутри платформы. Обе опции решают одну задачу — уложить пять этапов подряд в жёсткий бюджет задержки около 450–600 мс.'
  kind: open
  reference: 'Pipecat — фреймворк, где ты сам собираешь пайплайн из кадров (frames): маленьких порций аудио и текста, которые едут через цепочку обработчиков (VAD, STT, LLM, TTS, транспорт). Ты контролируешь каждый узел и потоки управления, но и отвечаешь за них. LiveKit — платформа: транспорт, комнаты, синхронизация и определение границ реплик уже реализованы, агент подключается к готовой инфраструктуре. Выбор — между максимумом контроля над пайплайном и минимумом инфраструктурной работы.'
  id: 001-golos-ne-chat-3
  fingerprint: 971e1c94
