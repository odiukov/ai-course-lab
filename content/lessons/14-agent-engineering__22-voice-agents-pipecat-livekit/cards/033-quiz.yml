- concept: 'семантическое определение конца реплики — предсказание модели: ошибается в обе стороны и добавляет собственное время вывода в бюджет каждого хода'
  question: Команда меняет фиксированный порог тишины на семантическое определение конца реплики. Какие ошибки остаются возможными и чем именно оплачивается такая точность? Объясни своими словами.
  explanation: 'Смена сигнала не устраняет ошибку, а меняет её характер: вместо «всегда ждём фиксированную паузу» получаем «обычно быстро, иногда неверно в обе стороны». Поэтому семантический детектор ставят вместе с запасным сроком ожидания и держат его латентность в общей разбивке бюджета наравне с распознаванием и синтезом.'
  kind: open
  reference: 'Это решение модели, а не измерение, поэтому ошибки двусторонние: детектор может объявить конец хода посреди незаконченной мысли (агент перебивает пользователя) и может не признать конец завершённой фразы (пауза затягивается, диалог виснет). Платится тремя вещами: собственным временем вывода модели, которое добавляется к бюджету каждого хода; зависимостью качества от языка и домена, на которых модель обучена; и необходимостью запасного тайм-аута на случай, когда решение не приходит. Порог тишины взамен даёт предсказуемую, но одинаковую для всех реплик задержку.'
  id: 033-quiz-2
