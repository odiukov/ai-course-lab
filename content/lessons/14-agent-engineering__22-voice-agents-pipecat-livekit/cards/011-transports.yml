- concept: различия внешних каналов связи локализованы в транспортном адаптере, поэтому одна цепочка STT/LLM/TTS обслуживает несколько каналов без переписывания
  question: Голосовой агент работает в собственном веб-клиенте, а заказчик просит принимать звонки ещё из мессенджера и из сервиса видеокомнат. Объясни своими словами, что придётся сделать с пайплайном и почему логику диалога переписывать не нужно.
  explanation: Протокольные различия каналов заперты на границе пайплайна. Середина видит только фреймы, поэтому прототип переносится в новый канал заменой адаптера, а не пересборкой агента.
  kind: open
  reference: 'Добавляются новые транспортные адаптеры — по одному на канал. Каждый адаптер знает протокол своего канала (как установить соединение, как получить входящий звук, как отдать синтезированную речь, как узнать о разрыве и о прерывании) и приводит это к тем же типам кадров, что и прежний транспорт. Всё, что стоит между границами — VAD, STT, LLM, TTS — работает с кадрами, а не с протоколом, поэтому не меняется: LLM не «учат работать с видеокомнатами», TTS не «переписывают под мессенджер». Стоимость поддержки N каналов — N адаптеров при одной реализации интеллекта агента.'
  id: 011-transports-2
