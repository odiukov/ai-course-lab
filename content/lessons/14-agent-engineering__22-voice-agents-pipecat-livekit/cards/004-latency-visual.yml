- concept: приёмочный критерий по задержке ставится по хвосту распределения на большой выборке реплик, а не по лучшему прогону и не по среднему
  question: 'Команда сдаёт голосового агента и должна зафиксировать в SLA одно число по сквозной задержке. Есть замеры: лучший звонок 470 мс, среднее по 300 звонкам 700 мс, хвост распределения около 1050 мс. Какое число брать за целевое и почему?'
  explanation: 'Одно удачное демо ничего не гарантирует, а среднее прячет плохие реплики: разговор ощущается сломанным по худшим моментам, а не по арифметике. Поэтому мерят сотни реплик и смотрят на верхний перцентиль. Не случайно у Retell 600 мс — это результат на 180 тестовых звонках, а не рекорд одного вызова.'
  kind: choice
  options:
    - 'Хвостовое значение (около 1050 мс): пользователь запоминает не среднюю реплику, а те, где он ждал почти секунду'
    - 'Лучший звонок (470 мс): он показывает, на что стек способен при правильной настройке'
    - 'Среднее (700 мс): среднее по большой выборке — самая честная сводка распределения'
    - Медиану, так как она устойчива к выбросам и потому лучше описывает опыт пользователя
