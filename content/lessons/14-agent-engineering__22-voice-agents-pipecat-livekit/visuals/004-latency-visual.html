<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Бюджет по этапам: лучший и худший случай</title>
<style>
  :root{
    --bg:#fbfaf7; --ink:#1d2430; --muted:#5c6675; --line:#b9c0cb;
    --c1:#4f7cc4; --c2:#3f9e8c; --c3:#c9803e; --c4:#8a6fc0; --c5:#6c7a89;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171c; --ink:#e8ecf2; --muted:#9aa5b4; --line:#414a58;
      --c1:#6f9ce0; --c2:#4fbda6; --c3:#e09a52; --c4:#a68ad8; --c5:#8d9aab;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:400 15px/1.4 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  figure{margin:0;padding:14px 12px 10px;background:var(--bg)}
  figcaption{font-weight:600;margin:0 0 6px}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg)}
  .t{fill:var(--ink)}
  .m{fill:var(--muted)}
  .fb{color:var(--muted);font-size:14px;margin:8px 2px}
</style>
<figure>
  <figcaption>Бюджет по этапам: лучший и худший случай</figcaption>
  <svg id="s" viewBox="0 0 1000 350" role="img"
       aria-label="Полоса лучшего случая 400 мс и полоса худшего случая 990 мс по пяти этапам"></svg>
</figure>
<script>
(function(){
  var svg = document.getElementById('s');
  try{
    /* ---- данные схемы (единственные литералы предметной области) ---- */
    var STAGES = [
      {n:'VAD',       best:20,  worst:60},
      {n:'STT',       best:100, worst:250},
      {n:'LLM',       best:150, worst:400},
      {n:'TTS',       best:100, worst:200},
      {n:'транспорт', best:30,  worst:80}
    ];
    var COL = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)'];

    /* ---- одна система координат: 1 единица = 1 мс, один origin, один scale ---- */
    var origin = {x:24, y:20}, scale = 0.9;
    function sx(x){ return origin.x + x*scale; }
    function sy(y){ return origin.y + y*scale; }

    /* ---- геометрия рядов в тех же единицах ---- */
    var ROW = [
      {key:'best',  title:'Лучший случай',  top:40,  bot:110, cap:30,  val:132},
      {key:'worst', title:'Худший случай',  top:200, bot:270, cap:190, val:292}
    ];
    var LEG = {y:340, sw:13, base:351, step:190};
    var PAD = 6, GAP = 8;

    var NS = 'http://www.w3.org/2000/svg';
    function el(tag, at){
      var e = document.createElementNS(NS, tag);
      for (var k in at) e.setAttribute(k, at[k]);
      return e;
    }
    function txt(x, y, s, anchor, cls, size){
      var t = el('text', {x:x, y:y, 'text-anchor':anchor, 'font-size':size,
                          'class':cls, 'font-family':'inherit'});
      t.textContent = s;
      svg.appendChild(t);
      return t;
    }

    /* ---- две полосы ---- */
    ROW.forEach(function(row){
      var acc = 0, i;

      txt(sx(0), sy(row.cap), row.title, 'start', 't', 15);

      for (i = 0; i < STAGES.length; i++){
        var v = STAGES[i][row.key];
        var x0 = acc, x1 = acc + v;

        svg.appendChild(el('rect', {
          x:sx(x0), y:sy(row.top),
          width:sx(x1) - sx(x0), height:sy(row.bot) - sy(row.top),
          fill:COL[i], stroke:'var(--bg)', 'stroke-width':1.5
        }));

        /* значение — под своим блоком, middle: подписи разведены по x */
        txt(sx((x0 + x1) / 2), sy(row.val), String(v), 'middle', 'm', 13);

        acc = x1;
      }

      /* сумма — у правого конца полосы, anchor start, наружу от блоков */
      txt(sx(acc) + GAP, sy((row.top + row.bot) / 2) + 5,
          '= ' + acc + ' мс', 'start', 't', 15);
    });

    /* ---- где кончается лучший случай на шкале худшего ---- */
    var bestTotal = STAGES.reduce(function(a, s){ return a + s.best; }, 0);
    svg.appendChild(el('line', {
      x1:sx(bestTotal), y1:sy(ROW[0].bot + PAD),
      x2:sx(bestTotal), y2:sy(ROW[1].bot + PAD),
      stroke:'var(--line)', 'stroke-width':1.5, 'stroke-dasharray':'5 5'
    }));

    /* ---- легенда отдельной строкой: длинные имена этапов не лезут в блоки ---- */
    STAGES.forEach(function(s, i){
      var lx = i * LEG.step;
      svg.appendChild(el('rect', {
        x:sx(lx), y:sy(LEG.y),
        width:sx(lx + LEG.sw) - sx(lx), height:sy(LEG.y + LEG.sw) - sy(LEG.y),
        fill:COL[i]
      }));
      txt(sx(lx + LEG.sw) + PAD, sy(LEG.base),
          s.n + ' ' + s.best + '–' + s.worst, 'start', 'm', 12);
    });
  }catch(e){
    svg.remove();
    var p = document.createElement('p');
    p.className = 'fb';
    p.textContent = 'Схема должна показывать две полосы из пяти этапов. '
      + 'Нижний край: VAD 20 + STT 100 + LLM 150 + TTS 100 + транспорт 30 = 400 мс. '
      + 'Верхний край: 60 + 250 + 400 + 200 + 80 = 990 мс. '
      + 'Те же пять этапов, разница в два с половиной раза.';
    document.querySelector('figure').appendChild(p);
  }
})();
</script>
</html>
