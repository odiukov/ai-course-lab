- concept: результаты косинусного поиска ранжируются по убыванию близости
  question: 'Запрос и элементы каталога представлены L2-нормализованными эмбеддингами. Косинусные близости кандидатов: A — 0,81, B — −0,24, C — 0,58. В каком порядке поисковая система должна показать кандидатов?'
  explanation: 'Косинусную близость сортируют по убыванию: 0,81 > 0,58 > −0,24. Чем больше значение, тем лучше согласованы направления эмбеддингов.'
  kind: choice
  options:
    - A, C, B
    - B, C, A
    - C, A, B
  correct: 0
  id: 010-cosine-angle-1
  fingerprint: ae4a61cc
- concept: для единичных эмбеддингов косинусная близость равна скалярному произведению
  question: Заполни пропуск в формуле для L2-нормализованных эмбеддингов.
  explanation: В общей формуле скалярное произведение делится на произведение норм. После L2-нормализации обе нормы единичные, поэтому знаменатель исчезает.
  kind: cloze
  template: 'Для единичных векторов a и b: cos(a, b) = ___'
  answer: a · b
  accept:
    - a·b
    - dot(a, b)
    - скалярное произведение a и b
  id: 010-cosine-angle-2
  fingerprint: 56f9d465
- concept: косинусная близость не является вероятностью и требует калибровки порога под задачу
  question: Почему косинусную близость между двумя эмбеддингами нельзя напрямую трактовать как вероятность совпадения и использовать один универсальный порог для любых моделей?
  explanation: Высокая косинусная близость означает близкие направления эмбеддингов, но не заданную вероятность совпадения. При смене модели, данных или требуемой гранулярности сходства подходящий порог может измениться.
  kind: open
  reference: Косинусная близость измеряет геометрическое согласование направлений, а не калиброванную вероятность события. Распределение оценок зависит от энкодера, данных и критерия совпадения, поэтому порог подбирают на размеченной выборке для конкретной модели и задачи.
  id: 010-cosine-angle-3
  fingerprint: c32d2fef
