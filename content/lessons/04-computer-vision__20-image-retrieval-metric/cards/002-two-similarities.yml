- concept: критерий успешного поиска зависит от требуемого уровня сходства
  question: Система по фотографии конкретной модели часов возвращает только часы того же типа, но ни одного изображения этой модели. Как точнее оценить результат?
  explanation: Для category-level retrieval достаточно вернуть объекты нужного класса. Instance-level retrieval должен отличить конкретную модель от визуально похожих объектов того же класса, поэтому такая выдача решает только первую задачу.
  kind: choice
  options:
    - Поиск успешен на уровне категории, но не справился с поиском экземпляра
    - Поиск экземпляра успешен, поскольку категория определена правильно
    - Система не умеет распознавать категорию часов
    - Результат одинаково успешен для любых целей поиска
  correct: 0
  id: 002-two-similarities-1
  fingerprint: d46e5e50
- concept: обучающие пары для instance-level metric learning задают близость по идентичности экземпляра
  question: Как сформировать положительные и отрицательные пары для дообучения системы, которая должна находить конкретный экземпляр среди похожих объектов того же класса?
  explanation: 'Метки категории здесь недостаточно: два объекта одного класса могут быть отрицательной парой. Такое обучение заставляет модель сохранять признаки, различающие экземпляры, а не только общие признаки класса.'
  kind: open
  reference: В положительную пару нужно включать разные изображения одного экземпляра, а в отрицательную — изображения разных, желательно визуально похожих экземпляров того же класса. Обучение должно сближать эмбеддинги положительных пар и раздвигать эмбеддинги отрицательных.
  id: 002-two-similarities-2
  fingerprint: 85c3b87a
