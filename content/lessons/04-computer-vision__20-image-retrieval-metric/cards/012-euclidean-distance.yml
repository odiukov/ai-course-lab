- concept: переход от L2-расстояния к его квадрату сохраняет порядок кандидатов, но меняет шкалу значений
  question: Система поиска стала ранжировать те же эмбеддинги по квадрату L2-расстояния вместо обычного L2. Что произойдёт?
  explanation: 'Возведение неотрицательных расстояний в квадрат сохраняет их порядок. Однако значения меняются: например, порог для обычного расстояния нельзя напрямую применять к квадратам расстояний.'
  kind: choice
  options:
