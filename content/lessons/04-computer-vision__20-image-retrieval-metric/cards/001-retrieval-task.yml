- concept: результат поиска изображений — ранжированный список элементов каталога
  question: Какой результат должна возвращать система поиска по изображению-запросу?
  explanation: Задача retrieval состоит не в классификации и не в бинарной проверке совпадения. Система присваивает элементам каталога оценки близости и возвращает их в порядке релевантности.
  kind: choice
  options:
    - Название единственного класса изображения
    - Упорядоченный список элементов каталога от наиболее до наименее релевантных
    - Логическое значение, сообщающее, есть ли в каталоге похожее изображение
  correct: 1
  id: 001-retrieval-task-1
  fingerprint: a7a56cdd
- concept: последовательность построения выдачи по изображению-запросу
  question: Расположи этапы поиска по изображению в правильном порядке.
  explanation: 'Сначала модель кодирует запрос в вектор. Индекс быстро сужает каталог до близких кандидатов, после чего расстояния определяют их итоговый порядок: при метрике расстояния меньшему значению соответствует более высокое место.'
  kind: order
  items:
    - Преобразовать изображение-запрос в эмбеддинг
    - Получить из индекса кандидатов с близкими эмбеддингами
    - Вычислить расстояния между эмбеддингом запроса и кандидатами
    - Отсортировать кандидатов по расстоянию
  id: 001-retrieval-task-2
  fingerprint: 4943e535
