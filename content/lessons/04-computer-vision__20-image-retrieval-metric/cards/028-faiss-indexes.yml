- concept: Flat-индекс выполняет точный полный перебор и не требует обучения
  question: Нужно построить точный эталон поиска ближайших соседей без отдельной выборки для обучения индекса. Какой индекс FAISS подходит лучше всего?
  explanation: IndexFlatIP сравнивает запрос со всеми векторами, поэтому возвращает точный результат для скалярного произведения и не требует обучения. IVF нужно обучать, а IVF и HNSW могут пропускать истинных соседей.
  kind: choice
  options:
    - IndexFlatIP
    - IndexIVFFlat
    - IndexHNSW
  correct: 0
  id: 028-faiss-indexes-1
  fingerprint: a64fe307
- concept: IVF ускоряет запрос выбором ячеек перед локальным перебором кандидатов
  question: Расположите операции запроса к обученному IVF-индексу в правильном порядке.
  explanation: IVF сначала сужает область поиска с помощью обученных центроидов, а затем перебирает векторы только в выбранных ячейках. Проверка большего числа ячеек обычно повышает полноту поиска, но увеличивает задержку.
  kind: order
  items:
    - Определить ближайшие к запросу центроиды ячеек
    - Выбрать ограниченное множество соответствующих ячеек
    - Сравнить запрос с векторами внутри выбранных ячеек
    - Объединить найденных кандидатов и сформировать выдачу
  id: 028-faiss-indexes-2
  fingerprint: 6dbb960c
- concept: HNSW обменивает дополнительную память на низкую задержку приближённого поиска
  question: Объясните своими словами, почему HNSW может отвечать быстрее полного перебора, но расходовать больше памяти и иногда пропускать истинного ближайшего соседа.
  explanation: Низкая задержка достигается навигацией по небольшой части графа. Плата за это — память на связи между векторами и риск пропуска нужного кандидата при ограниченном обходе.
  kind: open
  reference: HNSW движется к перспективным кандидатам по многоуровневому графу и не сравнивает запрос со всем каталогом. Хранение связей графа требует дополнительной памяти, а ограниченный обход посещает не все вершины, поэтому поиск остаётся приближённым.
  id: 028-faiss-indexes-3
  fingerprint: 6682c7c7
