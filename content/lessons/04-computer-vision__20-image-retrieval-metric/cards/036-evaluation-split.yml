- concept: разбиение по идентификаторам сущностей предотвращает утечку между обучением и оценкой instance retrieval
  question: Как корректно разделить фотографии товаров для оценки поиска конкретного экземпляра?
  explanation: Все снимки товара, использованного при обучении, должны быть исключены из оценки. При этом отложенный товар может быть представлен разными фотографиями в query и gallery, чтобы для запроса существовал правильный результат.
  kind: choice
  options:
    - Случайно распределить каждую фотографию между обучением, запросами и каталогом
    - Не допускать товары из обучения в оценочную выборку, а разные снимки каждого отложенного товара распределить между запросами и каталогом
    - Разделить данные по категориям, но разрешить одному товару встречаться и в обучении, и в оценке
    - Поместить запросы и каталог в непересекающиеся множества идентификаторов товаров
  correct: 1
  id: 036-evaluation-split-1
  fingerprint: ab3c92f7
- concept: каждый оценочный запрос должен иметь хотя бы один релевантный объект в gallery
  question: Почему нельзя корректно интерпретировать Recall@K, если для части запросов в gallery вообще нет релевантных объектов?
  explanation: Recall@K считает запрос успешным только при наличии релевантного результата в первых позициях. Если релевантного кандидата нет во всём каталоге, метрика смешивает ошибки модели с неизбежными промахами, вызванными составом данных.
  kind: open
  reference: Такие запросы невозможно завершить успешно независимо от качества модели. Их промахи отражают дефект построения оценочного набора, а не только качество эмбеддингов, поэтому протокол должен гарантировать наличие релевантного кандидата для каждого запроса.
  id: 036-evaluation-split-2
  fingerprint: 03254adf
