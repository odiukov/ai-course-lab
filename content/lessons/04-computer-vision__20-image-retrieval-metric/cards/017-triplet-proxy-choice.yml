- concept: ProxyNCA обучается по меткам классов, тогда как Triplet требует сведений о позитивных и негативных связях
  question: В датасете каждому изображению присвоена только метка класса. Позитивные и негативные тройки не размечены. Какой loss можно применить непосредственно к такой разметке?
  explanation: ProxyNCA использует метку класса, приближая эмбеддинг изображения к обучаемому прокси своего класса и отдаляя от других прокси. Triplet loss требует определить якорь, позитив и негатив, даже если тройки затем составляются автоматически.
  kind: choice
  options:
    - Triplet loss без дополнительного построения троек
    - ProxyNCA
    - Triplet loss с hard-negative mining без определения позитивов
  correct: 1
  id: 017-triplet-proxy-choice-1
  fingerprint: ebaeeecf
- concept: hard-triplet mining отбирает информативные негативы и увеличивает вычислительную стоимость обучения
  question: Почему случайно составленные тройки часто плохо обучают модель с triplet loss и зачем применяют hard-triplet mining?
  explanation: Triplet loss полезен только для троек, которые ещё создают ненулевую ошибку. Отбор близких негативов усиливает обучающий сигнал, однако поиск таких примеров делает обучение дороже.
  kind: open
  reference: Большинство случайных негативов модель уже легко отличает от якоря, поэтому они не нарушают margin и почти не дают градиента. Hard-triplet mining ищет негативы, расположенные близко к якорю, чтобы получить информативный сигнал, но требует дополнительного поиска кандидатов и подходящей организации батчей.
  id: 017-triplet-proxy-choice-2
  fingerprint: cefceb52
