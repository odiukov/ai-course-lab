- concept: Precision@K равен доле релевантных результатов среди первых K позиций
  question: Среди первых 12 результатов поиска релевантны 9. Чему равен precision@12?
  explanation: Precision@12 вычисляется как 9 / 12 = 0,75. Значит, релевантны три четверти показанной выдачи.
  kind: numeric
  answer: 0.75
  tolerance: 0.001
  id: 033-precision-definition-1
  fingerprint: 291c4a3f
- concept: Precision@K не зависит от расположения релевантных результатов внутри top-K
  question: В выдаче A релевантные изображения занимают первые семь мест из top-11, а в выдаче B — последние семь мест из top-11. Как соотносятся их precision@11?
  explanation: Precision@K учитывает число релевантных элементов внутри среза, но не их конкретные позиции. В обеих выдачах precision@11 равен 7/11.
  kind: choice
  options:
    - У выдачи A выше, потому что релевантные изображения расположены раньше
    - У выдачи B выше, потому что перед релевантными изображениями больше нерелевантных
    - Значения равны, потому что в обеих выдачах внутри top-11 одинаковое число релевантных изображений
  correct: 2
  id: 033-precision-definition-2
  fingerprint: f86f9b1f
- concept: Precision@K не оценивает релевантные результаты за пределами top-K
  question: Объясни своими словами, почему высокий precision@K ещё не означает, что система нашла большую часть всех релевантных изображений.
  explanation: Высокая точность верхней части выдачи говорит о малом количестве ложных совпадений среди показанных результатов. Для оценки того, сколько релевантных объектов найдено вообще, нужна метрика охвата, например recall.
  kind: open
  reference: Precision@K оценивает только долю релевантных элементов среди первых K результатов. Релевантные изображения за пределами этого среза метрика не учитывает, поэтому выдача может быть чистой, но неполной.
  id: 033-precision-definition-3
  fingerprint: 5eb0bdee
