- concept: при отсутствии semi-hard кандидата используется ближайший негатив другого класса
  question: Что должна сделать функция mining, если для некоторого якоря после всех ограничений не осталось ни одного semi-hard негатива, и зачем?
  explanation: Строка, полностью состоящая из inf, означает отсутствие допустимого semi-hard негатива. Запасной поиск маскирует свой класс и выбирает ближайший чужой объект, чтобы не терять обучающий пример.
  kind: open
  reference: Нужно выбрать ближайший объект другого класса как запасной негатив. Это гарантирует, что для якоря будет сформирована обучающая тройка, даже если подходящего semi-hard кандидата в текущем батче нет.
