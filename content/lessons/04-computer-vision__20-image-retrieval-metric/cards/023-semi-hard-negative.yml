- concept: бесконечность исключает недопустимых кандидатов из выбора через argmin
  question: Заполни пропуск так, чтобы argmin не мог выбрать элементы, отмеченные маской invalid_mask.
  explanation: argmin ищет минимальное значение, поэтому положительная бесконечность фактически выключает кандидата из отбора. При наличии хотя бы одного конечного расстояния такой элемент выбран не будет.
  kind: cloze
  template: masked_dist[invalid_mask] = ___
  answer: float("inf")
  accept:
    - float('inf')
    - torch.inf
    - math.inf
