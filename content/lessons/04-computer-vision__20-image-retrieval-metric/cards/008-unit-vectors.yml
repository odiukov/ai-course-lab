- concept: вычисление координат L2-нормализованного вектора
  question: Эмбеддинг имеет координаты (7, 24). Чему равна его первая координата после L2-нормализации?
  explanation: L2-норма равна √(7² + 24²) = 25. После деления координат на норму первая координата становится 7 / 25 = 0.28, а длина всего вектора — единичной.
  kind: numeric
  answer: 0.28
  tolerance: 0.001
  id: 008-unit-vectors-1
  fingerprint: 3b5df5a9
- concept: L2-нормализация инвариантна к положительному масштабированию вектора
  question: Объясни, почему два ненулевых эмбеддинга, один из которых получен умножением другого на положительный коэффициент, совпадут после L2-нормализации.
  explanation: 'У векторов (3, 4) и (30, 40) различаются исходные длины, но отношение каждой координаты к длине одинаково. Поэтому оба превращаются в (0,6, 0,8): масштаб исчезает, а направление сохраняется.'
  kind: open
  reference: При умножении всех координат на положительный коэффициент L2-норма увеличивается во столько же раз. Деление масштабированных координат на масштабированную норму сокращает этот коэффициент, поэтому сохраняется только направление вектора.
  id: 008-unit-vectors-2
  fingerprint: e899db4a
