- concept: pairwise_distance вычисляет отдельное расстояние для каждой пары строк батча
  question: Тензоры anchor и positive имеют форму [B, D]. Что вернёт F.pairwise_distance(anchor, positive) без дополнительной редукции?
  explanation: Функция сопоставляет строки с одинаковыми индексами и сворачивает координаты каждой пары в одно расстояние. Поэтому результат содержит отдельное значение для каждого элемента батча.
  kind: choice
  options:
    - Вектор из B расстояний между соответствующими строками
    - Матрицу расстояний между каждой строкой anchor и каждой строкой positive
    - Один скаляр — среднее расстояние по всему батчу
    - Тензор покоординатных разностей формы [B, D]
  correct: 0
  id: 021-triplet-loss-1
  fingerprint: 3eb6986d
- concept: поэлементный hinge применяется до усреднения triplet loss по батчу
  question: Расположи операции вычисления батчевого triplet loss в правильном порядке.
  explanation: Ограничение triplet loss проверяется для каждой тройки отдельно. Если усреднить расстояния до F.relu, положительные и отрицательные нарушения смогут взаимно компенсироваться, и итог перестанет быть средним поэлементных hinge-потерь.
  kind: order
  items:
    - Вычислить расстояния от каждого якоря до соответствующих позитива и негатива
    - Для каждой тройки применить F.relu к разности расстояний с добавленным margin
    - Усреднить полученные потери по батчу
  id: 021-triplet-loss-2
  fingerprint: b5ccaabb
