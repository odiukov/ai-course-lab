- concept: Recall@K равен доле запросов, для которых релевантный результат найден в top-K
  question: Для 40 запросов релевантное изображение оказалось среди первых четырёх результатов в 31 случае. Чему равен Recall@4?
  explanation: Каждый запрос считается успешным, если в top-4 есть хотя бы одно релевантное изображение. Поэтому Recall@4 = 31 / 40 = 0,775.
  kind: numeric
  answer: 0.775
  tolerance: 0.001
  id: 030-recall-definition-1
  fingerprint: c806e967
- concept: Recall@K учитывает охват успешных запросов, а не общее количество релевантных результатов
  question: Две системы оцениваются на одинаковом наборе запросов при одном и том же K. Система A находит много релевантных изображений, но только для запросов из подмножества S. Система B находит хотя бы одно релевантное изображение для всех запросов из S и дополнительно для некоторых запросов вне S. У какой системы Recall@K выше?
  explanation: 'Recall@K присваивает каждому запросу бинарный результат: релевантный объект в top-K либо есть, либо нет. Дополнительные совпадения внутри уже успешного запроса не увеличивают метрику, а успехи на новых запросах увеличивают.'
  kind: choice
  options:
    - У системы A, потому что она возвращает больше релевантных изображений внутри успешных запросов
    - У системы B, потому что она успешно обслуживает больше запросов
    - Метрики обязательно равны, потому что обе системы успешны на подмножестве S
  correct: 1
  id: 030-recall-definition-2
