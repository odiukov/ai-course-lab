- concept: роли якоря, позитива и негатива задаются относительно конкретного запроса
  question: Как правильно назначить роли изображениям при формировании тройки для обучения поискового эмбеддинга?
  explanation: Якорь задаёт точку отсчёта. Позитив должен быть близок к нему по целевому критерию сходства, а негатив — не соответствовать этому критерию. Одно и то же изображение может получить другую роль в другой тройке.
  kind: choice
  options:
    - Якорь — самый типичный объект класса, позитив — ближайший объект, негатив — самый далёкий
    - Якорь — запрос, позитив — соответствующий ему объект, негатив — объект, который не должен считаться тем же результатом
    - Якорь — центр всех эмбеддингов, позитив — любой объект того же цвета, негатив — объект другого цвета
    - Роли навсегда закрепляются за изображениями при создании датасета
  correct: 1
  id: 019-triplet-geometry-1
  fingerprint: dea00241
- concept: margin задаёт минимальный разрыв между расстояниями до негатива и позитива
  question: Пусть d обозначает квадрат евклидова расстояния, а m — положительный margin. Дополните условие, при котором тройка уже удовлетворяет требуемому зазору и triplet loss равен нулю.
  explanation: 'Для L = max(0, d(a,p) − d(a,n) + m) потери исчезают, когда негатив дальше позитива как минимум на m: d(a,n) ≥ d(a,p) + m.'
  kind: cloze
  template: d(a,n) >= ___
  answer: d(a,p) + m
  accept:
    - m + d(a,p)
  id: 019-triplet-geometry-2
  fingerprint: ec4ce7ca
- concept: triplet loss задаёт относительный порядок двух расстояний от общего якоря
  question: Почему большое расстояние между позитивом и негативом само по себе не гарантирует, что тройка удовлетворяет triplet loss?
  explanation: 'Цель тройки — установить локальный порядок относительно якоря: позитив ближе, а негатив дальше с заданным запасом. Расстояние d(p,n) в это ограничение не входит.'
  kind: open
  reference: Triplet loss сравнивает расстояния d(a,p) и d(a,n), измеренные от одного якоря. Даже если позитив и негатив далеки друг от друга, негатив может оказаться слишком близко к якорю или даже ближе позитива. Требование выполнено только тогда, когда d(a,n) не меньше d(a,p) плюс margin.
  id: 019-triplet-geometry-3
  fingerprint: e84c0f06
