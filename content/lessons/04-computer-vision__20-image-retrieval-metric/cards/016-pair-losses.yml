- concept: InfoNCE отличает позитивную пару от негативов, найденных внутри батча
  question: Как обычно формируется обучающая задача InfoNCE для заданного anchor?
  explanation: InfoNCE получает позитивную пару и сравнивает её с набором негативных кандидатов. Негативы часто берутся из текущего батча, поэтому модель учится выделять позитив среди нескольких альтернатив.
  kind: choice
  options:
    - Все кандидаты считаются позитивами, но получают разные веса
    - Позитив выбирается как самый удалённый кандидат, а остальные игнорируются
    - Задан правильный парный пример, а остальные подходящие элементы батча выступают негативами
    - Модели передают только метку класса без позитивных пар и негативов
  correct: 2
  id: 016-pair-losses-1
  fingerprint: 44954bf1
- concept: очередь негативов компенсирует малый батч при обучении InfoNCE
  question: Батч при обучении InfoNCE слишком мал и содержит недостаточно негативных примеров. Какое изменение непосредственно решает эту проблему?
  explanation: InfoNCE полезен набор конкурирующих негативов. Momentum queue позволяет использовать негативы из предыдущих итераций, не увеличивая текущий батч.
  kind: choice
  options:
    - Хранить эмбеддинги дополнительных негативов в momentum queue
    - Исключить позитивные пары из функции потерь
    - Заменить все метки пар случайными
    - Обучать модель только классифицировать категории
  correct: 0
  id: 016-pair-losses-2
  fingerprint: 009d0445
- concept: contrastive loss прост в применении с парной разметкой, но требует многих негативов для эффективной сходимости
  question: Объясни своими словами главное преимущество классического contrastive loss и причину, по которой он может медленно сходиться.
  explanation: 'Сильная сторона contrastive loss — простые требования к данным: достаточно размеченных пар. Его слабое место — зависимость качества и скорости обучения от количества информативных негативов.'
  kind: open
  reference: 'Contrastive loss можно применять к произвольной парной разметке: позитивные пары сближаются, а негативные раздвигаются. Однако при малом количестве негативов модель получает мало информации о границах между похожими и различными объектами, поэтому обучение сходится медленнее.'
  id: 016-pair-losses-3
  fingerprint: c1b41ae1
