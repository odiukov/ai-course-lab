<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Из 3D в 2D за один шаг</title>
<style>
  :root{
    --bg:#f7f7f5; --fg:#1b1d21; --muted:#5c6169; --line:#3b3f46;
    --cell:#e7e9ee; --cellIn:#dce7f5; --cellOut:#dff0e3; --accent:#2f6db5;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14161a; --fg:#eceef2; --muted:#9aa1ac; --line:#c3c8d0;
      --cell:#22262d; --cellIn:#1e2b3c; --cellOut:#1c2f24; --accent:#7fb2ea;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  figure{margin:0;padding:14px 12px 18px;background:var(--bg);}
  figcaption{font-size:15px;color:var(--muted);margin:0 0 6px;text-align:center;}
  figcaption b{color:var(--fg);}
  #wrap{max-width:100%;}
  svg{display:block;width:100%;height:auto;max-height:520px;margin:0 auto;background:var(--bg);}
  .fallback{color:var(--fg);font-size:15px;padding:8px 4px;}
  text{fill:var(--fg);font-family:inherit;}
  .muted{fill:var(--muted);}
  .hit{fill:transparent;}
  svg.hi0 [data-row="1"],svg.hi1 [data-row="0"]{opacity:.16;}
</style>
</head>
<body>
<figure>
  <figcaption><b>Из 3D в 2D за один шаг:</b> матрица 2×3 съедает вектор из 3 чисел и отдаёт 2</figcaption>
  <div id="wrap">
    <svg id="svg" viewBox="0 0 640 400" preserveAspectRatio="xMidYMid meet"
         role="img" aria-label="Матрица 2 на 3 умножается на вектор [3, 2, 5] и даёт вектор [3, 2]"></svg>
  </div>
</figure>
<script>
(function(){
  var wrap=document.getElementById('wrap'), svg=document.getElementById('svg');
  var NS='http://www.w3.org/2000/svg';
  try{
    /* данные схемы */
    var W=[[1,0,0],[0,1,0]], IN=[3,2,5];

    /* одна пара функций перевода */
    var scale=62, origin={x:110,y:185};
    function sx(x){return origin.x+x*scale;}
    function sy(y){return origin.y-y*scale;}

    /* компоновка в единицах данных */
    var matX=[0.6,1.7,2.8], rowY=[0.5,-0.5], inX=4.6, inY=[1,0,-1], outX=6.6;
    var hw=0.42, hh=0.42, br=0.18;
    var mBox={x0:-0.3,x1:3.7,y0:-1.05,y1:1.05};
    var iBox={x0:inX-0.75,x1:inX+0.75,y0:-1.55,y1:1.55};
    var oBox={x0:outX-0.72,x1:outX+0.72,y0:-1.05,y1:1.05};

    function el(n,a,t){var e=document.createElementNS(NS,n);
      for(var k in a) e.setAttribute(k,a[k]);
      if(t!==undefined) e.textContent=t; return e;}
    function put(p,n,a,t){var e=el(n,a,t); p.appendChild(e); return e;}

    function cell(p,cx,cy,val,fill){
      put(p,'rect',{x:sx(cx-hw),y:sy(cy+hh),width:sx(cx+hw)-sx(cx-hw),
        height:sy(cy-hh)-sy(cy+hh),rx:6,fill:fill,stroke:'var(--line)','stroke-width':1});
      put(p,'text',{x:sx(cx),y:sy(cy),dy:6,'text-anchor':'middle','font-size':18},String(val));
    }
    function brackets(p,b){
      var d1='M'+sx(b.x0+br)+' '+sy(b.y1)+'L'+sx(b.x0)+' '+sy(b.y1)+
             'L'+sx(b.x0)+' '+sy(b.y0)+'L'+sx(b.x0+br)+' '+sy(b.y0);
      var d2='M'+sx(b.x1-br)+' '+sy(b.y1)+'L'+sx(b.x1)+' '+sy(b.y1)+
             'L'+sx(b.x1)+' '+sy(b.y0)+'L'+sx(b.x1-br)+' '+sy(b.y0);
      put(p,'path',{d:d1,fill:'none',stroke:'var(--line)','stroke-width':2});
      put(p,'path',{d:d2,fill:'none',stroke:'var(--line)','stroke-width':2});
    }
    function label(p,cx,cy,t,cls,size){
      put(p,'text',{x:sx(cx),y:sy(cy),'text-anchor':'middle',
        'font-size':size||15,'class':cls||''},t);
    }
    function arrow(p,x0,x1,y){
      put(p,'line',{x1:sx(x0),y1:sy(y),x2:sx(x1-0.16),y2:sy(y),
        stroke:'var(--accent)','stroke-width':2});
      put(p,'path',{d:'M'+sx(x1)+' '+sy(y)+'L'+sx(x1-0.2)+' '+sy(y+0.11)+
        'L'+sx(x1-0.2)+' '+sy(y-0.11)+'Z',fill:'var(--accent)'});
    }

    /* матрица W: строки как отдельные группы */
    var rows=[];
    for(var i=0;i<W.length;i++){
      var g=put(svg,'g',{'data-row':i});
      rows.push(g);
      for(var j=0;j<W[i].length;j++) cell(g,matX[j],rowY[i],W[i][j],'var(--cell)');
    }
    brackets(svg,mBox);
    label(svg,(mBox.x0+mBox.x1)/2,1.35,'матрица W');
    label(svg,(mBox.x0+mBox.x1)/2,-1.45,'2 строки × 3 столбца','muted',14);

    /* знак умножения */
    label(svg,4.0,-0.06,'·',null,22);

    /* вход */
    var gi=put(svg,'g',{});
    for(var k=0;k<IN.length;k++) cell(gi,inX,inY[k],IN[k],'var(--cellIn)');
    brackets(svg,iBox);
    label(svg,inX,1.85,'вход 3D');
    label(svg,inX,-1.95,'3 числа','muted',14);

    /* знак равенства и стрелка перехода */
    label(svg,5.75,-0.06,'=',null,20);
    arrow(svg,5.4,5.55,-0.06);

    /* выход: строка матрицы даёт ровно одно число */
    var out=[];
    for(i=0;i<W.length;i++){
      var s=0;
      for(j=0;j<W[i].length;j++) s+=W[i][j]*IN[j];
      out.push(s);
      var go=put(svg,'g',{'data-row':i});
      cell(go,outX,rowY[i],s,'var(--cellOut)');
    }
    brackets(svg,oBox);
    label(svg,outX,1.35,'выход 2D');
    label(svg,outX,-1.45,'2 числа','muted',14);

    /* разбор по строкам */
    for(i=0;i<W.length;i++){
      put(svg,'text',{x:sx(mBox.x0),y:sy(-2.15-i*0.5),'font-size':14,
        'data-row':i,'class':'muted'},
        'строка '+(i+1)+' · ['+IN.join(', ')+'] = '+out[i]);
    }
    put(svg,'text',{x:sx(mBox.x0),y:sy(-3.15),'font-size':14,'class':'muted'},
      'Число '+IN[2]+' в ответ не попало: восстановить его по ['+out.join(', ')+'] уже нельзя.');
    put(svg,'text',{x:sx(oBox.x1),y:sy(-3.15),'text-anchor':'end','font-size':13,
      'class':'muted'},'наведи на строку матрицы');

    /* подсветка: одна строка — одно число на выходе */
    for(i=0;i<rows.length;i++){
      (function(idx){
        var hit=put(svg,'rect',{x:sx(mBox.x0),y:sy(rowY[idx]+hh+0.1),
          width:sx(mBox.x1)-sx(mBox.x0),
          height:sy(rowY[idx]-hh-0.1)-sy(rowY[idx]+hh+0.1),'class':'hit'});
        hit.addEventListener('mouseenter',function(){svg.setAttribute('class','hi'+idx);});
        hit.addEventListener('mouseleave',function(){svg.setAttribute('class','');});
      })(i);
    }
  }catch(e){
    wrap.innerHTML='<p class="fallback">Схема должна показывать: матрица W из 2 строк и 3 столбцов '+
      'умножается на вход [3, 2, 5] (вход 3D). Первая строка 1, 0, 0 берёт только x, вторая 0, 1, 0 — только y. '+
      'Каждая строка съедает весь вход и даёт одно число, поэтому на выходе вектор [3, 2] (выход 2D). '+
      'Число 5 потеряно насовсем.</p>';
  }
})();
</script>
</body>
</html>
