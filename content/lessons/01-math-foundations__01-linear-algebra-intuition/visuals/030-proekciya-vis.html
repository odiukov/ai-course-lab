<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Проекция [3,4] на [1,0]</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1b1f23; --muted:#5c6470;
    --axis:#8a919b; --a:#2f6fd0; --b:#c2410c; --proj:#0f8a5f; --res:#8b5cf6;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12151a; --fg:#e7ebf0; --muted:#9aa4b2;
      --axis:#5d6774; --a:#6fa8ff; --b:#ff9a5c; --proj:#3ddba0; --res:#c4a6ff;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:900px;margin:0 auto;padding:12px 14px 18px;}
  h1{font-size:16px;margin:0 0 2px;font-weight:600;}
  p.sub{margin:0 0 8px;font-size:13px;color:var(--muted);}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .fail{font-size:13px;color:var(--muted);line-height:1.5;}
  text{font-family:inherit;fill:var(--fg);}
  .tick{fill:var(--muted);font-size:11px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Проекция a = [3, 4] на b = [1, 0]</h1>
  <p class="sub">Проекция [3, 0] лежит на оси, остаток [0, 4] — под прямым углом к ней.</p>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    // ---- данные схемы ----
    var A    = [3, 4];
    var B    = [1, 0];
    var PROJ = [3, 0];
    var RES  = [0, 4];   // A - PROJ
    var XT = [1,2,3,4], YT = [1,2,3,4];
    var XMIN=-1, XMAX=5, YMIN=-1, YMAX=5;

    // ---- холст ----
    var W = 760, H = 500;               // viewBox
    var FS = 13, LW = 2, PAD = 8;       // шрифт, толщина, отступ подписи

    // ---- единственные origin и scale ----
    var scale  = 72;
    var origin = { x: 150, y: 400 };
    function sx(x){ return origin.x + x * scale; }
    function sy(y){ return origin.y - y * scale; }

    var NS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    svg.setAttribute('role','img');
    svg.setAttribute('aria-label','Вектор a равен 3 и 4, ось b равна 1 и 0, проекция 3 и 0, остаток 0 и 4');

    function el(n,at){ var e=document.createElementNS(NS,n);
      for(var k in at) e.setAttribute(k,at[k]); return e; }
    function line(p,q,at){ at=at||{};
      at.x1=sx(p[0]); at.y1=sy(p[1]); at.x2=sx(q[0]); at.y2=sy(q[1]);
      svg.appendChild(el('line',at)); }
    function label(p,txt,dx,dy,color,weight){
      var t=el('text',{x:sx(p[0])+dx, y:sy(p[1])+dy, 'font-size':FS,
        'font-weight':weight||400, fill:color||'currentColor'});
      t.textContent=txt; svg.appendChild(t); }

    // наконечник стрелки: вершины тоже через sx/sy
    function arrow(from,to,color,width){
      var dx=to[0]-from[0], dy=to[1]-from[1];
      var len=Math.sqrt(dx*dx+dy*dy) || 1;
      var ux=dx/len, uy=dy/len, px=-uy, py=ux;
      var h=0.34, w=0.13;                       // размер в единицах данных
      var base=[to[0]-ux*h, to[1]-uy*h];
      var shaft=[base[0], base[1]];
      line(from, shaft, {stroke:color,'stroke-width':width,'stroke-linecap':'round'});
      var p1=[base[0]+px*w, base[1]+py*w], p2=[base[0]-px*w, base[1]-py*w];
      svg.appendChild(el('polygon',{fill:color, points:
        sx(to[0])+','+sy(to[1])+' '+sx(p1[0])+','+sy(p1[1])+' '+sx(p2[0])+','+sy(p2[1])}));
    }

    // ---- сетка ----
    var i;
    for(i=XMIN;i<=XMAX;i++) line([i,YMIN],[i,YMAX],
      {stroke:'var(--axis)','stroke-width':0.5,opacity:0.28});
    for(i=YMIN;i<=YMAX;i++) line([XMIN,i],[XMAX,i],
      {stroke:'var(--axis)','stroke-width':0.5,opacity:0.28});

    // ---- оси ----
    arrow([XMIN,0],[XMAX,0],'var(--axis)',LW*0.6);
    arrow([0,YMIN],[0,YMAX],'var(--axis)',LW*0.6);
    label([XMAX,0],'x',-PAD,-PAD,'var(--axis)');
    label([0,YMAX],'y',PAD,PAD*2,'var(--axis)');

    // ---- засечки ----
    XT.forEach(function(v){
      line([v,0],[v,0],{stroke:'none'});
      var t=el('text',{x:sx(v),y:sy(0)+PAD*2,'text-anchor':'middle'});
      t.setAttribute('class','tick'); t.textContent=v; svg.appendChild(t);
    });
    YT.forEach(function(v){
      var t=el('text',{x:sx(0)-PAD,y:sy(v)+4,'text-anchor':'end'});
      t.setAttribute('class','tick'); t.textContent=v; svg.appendChild(t);
    });
    (function(){
      var t=el('text',{x:sx(0)-PAD,y:sy(0)+PAD*2,'text-anchor':'end'});
      t.setAttribute('class','tick'); t.textContent='0'; svg.appendChild(t);
    })();

    // ---- прямой угол при [3,0] ----
    var s=0.28;
    svg.appendChild(el('polyline',{fill:'none',stroke:'var(--muted)',
      'stroke-width':1.2, points:
        sx(PROJ[0]-s)+','+sy(PROJ[1])+' '+
        sx(PROJ[0]-s)+','+sy(PROJ[1]+s)+' '+
        sx(PROJ[0])+','+sy(PROJ[1]+s)}));

    // ---- остаток [0,4]: от проекции до a, пунктиром ----
    line(PROJ, A, {stroke:'var(--res)','stroke-width':LW,
      'stroke-dasharray':'7 6','stroke-linecap':'round'});
    label([PROJ[0],(PROJ[1]+A[1])/2],'остаток [0, 4]',PAD,4,'var(--res)',600);
    label([PROJ[0],(PROJ[1]+A[1])/2],'перпендикулярен b',PAD,4+FS+4,'var(--res)');

    // ---- векторы ----
    arrow([0,0], A, 'var(--a)', LW+0.5);
    label(A,'a = [3, 4]',PAD,-PAD,'var(--a)',600);

    arrow([0,0], PROJ, 'var(--proj)', LW+1.5);
    label([PROJ[0]/2,PROJ[1]],'проекция = 3 · [1, 0] = [3, 0]',-PAD*4,PAD*4,'var(--proj)',600);

    arrow([0,0], B, 'var(--b)', LW+2);
    label(B,'b = [1, 0]',PAD,-PAD*2,'var(--b)',600);

    host.appendChild(svg);
  }catch(e){
    host.innerHTML = '<p class="fail">Схема не построилась. Она должна показывать: '+
      'вектор a = [3, 4] из начала координат; ось b = [1, 0] вдоль оси x; '+
      'проекцию a на b — вектор [3, 0], лежащий на оси x; '+
      'и остаток [0, 4] пунктиром от точки [3, 0] до точки [3, 4], '+
      'стоящий к b под прямым углом.</p>';
  }
})();
</script>
</body>
</html>
