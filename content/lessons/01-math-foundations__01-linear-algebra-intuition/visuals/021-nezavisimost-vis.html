<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Три вектора, но плоскость одна</title>
<style>
  :root{
    --bg:#f6f7fa; --fg:#1b2130; --muted:#5b6478;
    --axis:#8a93a6; --plane:rgba(70,110,200,.13); --planeEdge:#7f93c8; --grid:rgba(90,110,150,.30);
    --v1:#2f6fd0; --v2:#12916a; --v3:#c9760a; --target:#cf3b3b;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#13161c; --fg:#e7eaf1; --muted:#a4adbe;
      --axis:#79839a; --plane:rgba(120,160,255,.16); --planeEdge:#6f83b8; --grid:rgba(150,175,220,.24);
      --v1:#6aa6ff; --v2:#3fd6a0; --v3:#f0a83c; --target:#ff6b6b;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .card{background:var(--bg);max-height:520px;padding:6px 10px 8px;box-sizing:border-box;}
  h2{margin:0 0 2px;font-size:16px;font-weight:600;}
  p.sub{margin:0 0 4px;font-size:13px;color:var(--muted);}
  svg{display:block;width:100%;height:auto;max-height:466px;}
  .fallback{font-size:14px;line-height:1.5;color:var(--fg);white-space:pre-wrap;}
</style>
<div class="card">
  <h2>Три вектора, но плоскость одна</h2>
  <p class="sub">Все три вектора лежат в плоскости xy: z = 0 у каждого.</p>
  <div id="wrap">
    <svg id="fig" viewBox="0 0 940 430" preserveAspectRatio="xMidYMid meet" role="img"
         aria-label="Три вектора в плоскости xy и недостижимая точка 0,0,1"></svg>
  </div>
</div>
<script>
(function(){
  var wrap = document.getElementById('wrap');
  try{
    /* ---- данные схемы ---- */
    var V1=[1,0,0], V2=[0,1,0], V3=[2,1,0], TARGET=[0,0,1];
    var PLANE=[[-0.7,-0.5,0],[3.4,-0.5,0],[3.4,2.3,0],[-0.7,2.3,0]];
    var XTICKS=[1,2,3], YTICKS=[1,2], ZTICKS=[1];
    var AX=[3.2,0,0], AY=[0,2.0,0], AZ=[0,0,1.5];

    /* ---- один origin, один scale ---- */
    var origin={x:300,y:310}, scale=150;

    /* ---- ЕДИНСТВЕННАЯ функция перевода ---- */
    function toPx(p){
      return { x: origin.x + scale*(p[0] - 0.50*p[1]),
               y: origin.y - scale*(p[2] + 0.35*p[1]) };
    }

    var svg=document.getElementById('fig'), NS='http://www.w3.org/2000/svg';
    function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
    function line(a,b,o){var p=toPx(a),q=toPx(b);o=o||{};
      return el('line',{x1:p.x,y1:p.y,x2:q.x,y2:q.y,stroke:o.stroke||'var(--axis)',
        'stroke-width':o.w||1.5,'stroke-dasharray':o.dash||'none','stroke-linecap':'round'});}
    function text(p,s,o){var q=toPx(p);o=o||{};
      var t=el('text',{x:q.x+(o.dx||0),y:q.y+(o.dy||0),fill:o.fill||'var(--fg)',
        'font-size':o.size||14,'text-anchor':o.anchor||'start','font-weight':o.weight||'400'});
      t.textContent=s;return t;}
    function poly(pts,a){var d=pts.map(function(p){var q=toPx(p);return q.x+','+q.y;}).join(' ');
      a.points=d;return el('polygon',a);}

    /* наконечник строится в координатах данных, длина/ширина -> toPx */
    function arrow(from,to,color){
      var d=[to[0]-from[0],to[1]-from[1],to[2]-from[2]];
      var n=Math.sqrt(d[0]*d[0]+d[1]*d[1]+d[2]*d[2]);
      var u=[d[0]/n,d[1]/n,d[2]/n], perp;
      if(Math.abs(u[2])>0.5) perp=[1,0,0]; else perp=[-u[1],u[0],0];
      var h=0.20, w=0.085;
      var base=[to[0]-h*u[0], to[1]-h*u[1], to[2]-h*u[2]];
      var b1=[base[0]+w*perp[0], base[1]+w*perp[1], base[2]+w*perp[2]];
      var b2=[base[0]-w*perp[0], base[1]-w*perp[1], base[2]-w*perp[2]];
      line(from,base,{stroke:color,w:2.6});
      poly([to,b1,b2],{fill:color});
    }
    function dot(p,color){
      var c=toPx(p), r=toPx([0.05,0,0]).x - toPx([0,0,0]).x;
      return el('circle',{cx:c.x,cy:c.y,r:r,fill:color});
    }

    /* ---- плоскость xy ---- */
    poly(PLANE,{fill:'var(--plane)',stroke:'var(--planeEdge)','stroke-width':1.2});
    [0,1,2,3].forEach(function(x){ line([x,PLANE[0][1],0],[x,PLANE[2][1],0],{stroke:'var(--grid)',w:1}); });
    [0,1,2].forEach(function(y){ line([PLANE[0][0],y,0],[PLANE[1][0],y,0],{stroke:'var(--grid)',w:1}); });

    /* ---- оси ---- */
    arrow([0,0,0],AX,'var(--axis)');
    arrow([0,0,0],AY,'var(--axis)');
    arrow([0,0,0],AZ,'var(--axis)');
    text(AX,'x (вправо)',{dx:10,dy:18,fill:'var(--muted)',size:13});
    text(AY,'y (вглубь)',{dx:-10,dy:-6,anchor:'end',fill:'var(--muted)',size:13});
    text(AZ,'z (вверх)',{dx:-10,dy:-8,anchor:'end',fill:'var(--muted)',size:13});

    XTICKS.forEach(function(k){ line([k,-0.07,0],[k,0.07,0],{w:1.4});
      text([k,-0.07,0],String(k),{dx:2,dy:16,fill:'var(--muted)',size:12}); });
    YTICKS.forEach(function(k){ line([-0.07,k,0],[0.07,k,0],{w:1.4});
      text([-0.07,k,0],String(k),{dx:-6,dy:4,anchor:'end',fill:'var(--muted)',size:12}); });
    ZTICKS.forEach(function(k){ line([-0.06,0,k],[0.06,0,k],{w:1.4}); });

    /* ---- разложение v3 = 2*v1 + v2 ---- */
    line([0,0,0],[2,0,0],{stroke:'var(--v3)',w:1.4,dash:'5 5'});
    line([2,0,0],V3,{stroke:'var(--v3)',w:1.4,dash:'5 5'});

    /* ---- векторы ---- */
    arrow([0,0,0],V1,'var(--v1)');
    arrow([0,0,0],V2,'var(--v2)');
    arrow([0,0,0],V3,'var(--v3)');
    dot(V1,'var(--v1)'); dot(V2,'var(--v2)'); dot(V3,'var(--v3)');
    text(V1,'v\u2081 = [1, 0, 0]',{dx:6,dy:24,fill:'var(--v1)',size:14,weight:'600'});
    text(V2,'v\u2082 = [0, 1, 0]',{dx:-12,dy:-8,anchor:'end',fill:'var(--v2)',size:14,weight:'600'});
    text(V3,'v\u2083 = [2, 1, 0]',{dx:14,dy:-4,fill:'var(--v3)',size:14,weight:'600'});
    text(V3,'= 2\u00b7v\u2081 + v\u2082',{dx:14,dy:15,fill:'var(--v3)',size:13});

    /* ---- недостижимая точка ---- */
    line([0,0,0],TARGET,{stroke:'var(--target)',w:2,dash:'6 6'});
    dot(TARGET,'var(--target)');
    text(TARGET,'[0, 0, 1] \u2014 наверху',{dx:14,dy:-6,fill:'var(--target)',size:14,weight:'600'});
    text(TARGET,'НЕДОСТИЖИМА',{dx:14,dy:13,fill:'var(--target)',size:13,weight:'600'});
    text([0,0,0.62],'любая комбинация даёт z = 0',{dx:14,dy:4,fill:'var(--muted)',size:13});

    text([3.0,2.3,0],'плоскость xy: z = 0 у всех трёх',{dx:0,dy:-8,fill:'var(--planeEdge)',size:13});
    text([-0.7,-0.5,0],'Три вектора \u2014 но свободы движения только две',{dx:6,dy:24,fill:'var(--muted)',size:13});
  }catch(e){
    wrap.innerHTML='<p class="fallback">Схема не построилась. Она должна была показать: '+
      'оси x (вправо), y (вглубь), z (вверх); плоскость xy как пол; три вектора из начала координат — '+
      'v\u2081 = [1, 0, 0], v\u2082 = [0, 1, 0], v\u2083 = [2, 1, 0], причём v\u2083 = 2\u00b7v\u2081 + v\u2082 '+
      'и все три лежат на полу (z = 0); и точку [0, 0, 1] над полом, помеченную как НЕДОСТИЖИМАЯ, '+
      'потому что любая комбинация этих векторов даёт z = 0.</p>';
  }
})();
</script>
</html>
