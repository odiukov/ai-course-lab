<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Три вектора в одной плоскости</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1a1d24; --muted:#5b6472; --grid:#d7dce5;
    --plane:#4a7fd422; --planeEdge:#8fb0e0;
    --v1:#c0392b; --v2:#1f8a4c; --v3:#8e44ad; --miss:#d97706;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12151b; --fg:#e8ecf2; --muted:#98a2b3; --grid:#2c333f;
      --plane:#6aa5ff26; --planeEdge:#3f5f8f;
      --v1:#ff7a6b; --v2:#5fd68f; --v3:#c48cf0; --miss:#f7b955;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:900px;margin:0 auto;padding:8px 10px 12px;}
  h2{font-size:15px;margin:0 0 6px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:470px;}
  .legend{margin:6px 0 0;font-size:12.5px;line-height:1.6;color:var(--muted);}
  .legend b{color:var(--fg);font-weight:600;}
  .sw{display:inline-block;width:11px;height:11px;border-radius:2px;
    vertical-align:-1px;margin-right:5px;}
  .fail{font-size:13px;line-height:1.6;color:var(--fg);}
</style>
</head>
<body>
<div class="wrap">
  <h2>Три вектора — а освоен только пол</h2>
  <div id="slot"></div>
  <p class="legend" id="legend"></p>
</div>
<script>
(function(){
  var slot=document.getElementById("slot");
  try{
    // ---- данные схемы ----
    var VECS=[
      {name:"v\u2081", val:[1,0,0], color:"var(--v1)"},
      {name:"v\u2082", val:[0,1,0], color:"var(--v2)"},
      {name:"v\u2083", val:[2,1,0], color:"var(--v3)"}
    ];
    var MISS=[0,0,1];
    var AXES=[{name:"x",end:[2.6,0,0]},{name:"y",end:[0,2.1,0]},{name:"z",end:[0,0,1.7]}];
    var PLANE=[[-0.7,-0.7,0],[3.0,-0.7,0],[3.0,2.4,0],[-0.7,2.4,0]];

    // ---- холст ----
    var W=880, H=460;

    // ---- единственные origin и scale ----
    var origin={x:250, y:330};
    var scale=104;

    // изометрия: x вправо-вниз, y вправо-вверх, z вверх
    var EX={x: 0.94, y: 0.34}, EY={x: 0.78, y:-0.46}, EZ={x: 0, y:-1};
    function px(p){
      var x=p[0], y=p[1], z=(p.length>2?p[2]:0);
      return {
        x: origin.x + scale*(x*EX.x + y*EY.x + z*EZ.x),
        y: origin.y + scale*(x*EX.y + y*EY.y + z*EZ.y)
      };
    }

    // ---- отступы подписей (пиксели) ----
    var PAD=12, PADS=16;

    var s=[];
    function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
    function line(a,b,st){var A=px(a),B=px(b);
      s.push('<line x1="'+A.x+'" y1="'+A.y+'" x2="'+B.x+'" y2="'+B.y+'" '+st+'/>');}
    function txt(p,t,anchor,dx,dy,cls){var P=px(p);
      s.push('<text x="'+(P.x+dx)+'" y="'+(P.y+dy)+'" text-anchor="'+anchor+'" '+cls+'>'+esc(t)+'</text>');}

    // плоскость xy
    s.push('<polygon points="'+PLANE.map(function(p){var q=px(p);return q.x+","+q.y;}).join(" ")+
      '" fill="var(--plane)" stroke="var(--planeEdge)" stroke-width="1.2" stroke-dasharray="6 4"/>');

    // сетка пола
    for(var i=0;i<=3;i++){ line([i,-0.7,0],[i,2.4,0],'stroke="var(--grid)" stroke-width="1"'); }
    for(var j=0;j<=2;j++){ line([-0.7,j,0],[3.0,j,0],'stroke="var(--grid)" stroke-width="1"'); }

    // оси + наконечники
    AXES.forEach(function(a){
      line([0,0,0],a.end,'stroke="var(--muted)" stroke-width="1.4"');
      var T=px(a.end), O=px([0,0,0]);
      var vx=T.x-O.x, vy=T.y-O.y, L=Math.sqrt(vx*vx+vy*vy), ux=vx/L, uy=vy/L;
      var hl=scale*0.11, hw=scale*0.045;
      s.push('<polygon points="'+T.x+','+T.y+' '+(T.x-hl*ux+hw*-uy)+','+(T.y-hl*uy+hw*ux)+
        ' '+(T.x-hl*ux-hw*-uy)+','+(T.y-hl*uy-hw*ux)+'" fill="var(--muted)"/>');
    });
    txt(AXES[0].end,"x","start",PAD,PAD,'fill="var(--muted)" font-size="13"');
    txt(AXES[1].end,"y","start",PAD,-4,'fill="var(--muted)" font-size="13"');
    txt(AXES[2].end,"z","middle",0,-PAD,'fill="var(--muted)" font-size="13"');
    txt([0,0,0],"0","end",-PAD,PADS,'fill="var(--muted)" font-size="13"');

    // векторы
    VECS.forEach(function(v){
      var O=px([0,0,0]), T=px(v.val);
      s.push('<line x1="'+O.x+'" y1="'+O.y+'" x2="'+T.x+'" y2="'+T.y+
        '" stroke="'+v.color+'" stroke-width="3.2" stroke-linecap="round"/>');
      var vx=T.x-O.x, vy=T.y-O.y, L=Math.sqrt(vx*vx+vy*vy), ux=vx/L, uy=vy/L;
      var hl=scale*0.15, hw=scale*0.06;
      s.push('<polygon points="'+T.x+','+T.y+' '+(T.x-hl*ux-hw*uy)+','+(T.y-hl*uy+hw*ux)+
        ' '+(T.x-hl*ux+hw*uy)+','+(T.y-hl*uy-hw*ux)+'" fill="'+v.color+'"/>');
      s.push('<circle cx="'+O.x+'" cy="'+O.y+'" r="4" fill="var(--fg)"/>');
    });
    // метки векторов: сбоку от середины, разведены в разные стороны
    txt([0.55,0,0], VECS[0].name,"middle",0,PADS+PAD,'fill="var(--v1)" font-size="14" font-weight="600"');
    txt([0,0.55,0], VECS[1].name,"start",PAD,-6,'fill="var(--v2)" font-size="14" font-weight="600"');
    txt([1.1,0.55,0],VECS[2].name,"end",-PAD,-6,'fill="var(--v3)" font-size="14" font-weight="600"');

    // недостижимая точка [0,0,1]
    var M=px(MISS), B=px([0,0,0]);
    s.push('<line x1="'+B.x+'" y1="'+B.y+'" x2="'+M.x+'" y2="'+M.y+
      '" stroke="var(--miss)" stroke-width="1.6" stroke-dasharray="5 5"/>');
    s.push('<circle cx="'+M.x+'" cy="'+M.y+'" r="6" fill="none" stroke="var(--miss)" stroke-width="2.4"/>');
    s.push('<circle cx="'+M.x+'" cy="'+M.y+'" r="2.2" fill="var(--miss)"/>');
    txt(MISS,"[0, 0, 1] \u2014 недостижима","end",-PADS,-PAD,'fill="var(--miss)" font-size="14" font-weight="600"');
    txt(MISS,"ни одна сумма не выйдет из пола","end",-PADS,PAD,'fill="var(--miss)" font-size="12.5"');

    // подпись плоскости — у дальнего края, ниже линии
    txt([2.6,2.4,0],"плоскость xy (пол)","middle",0,PADS+PAD,'fill="var(--planeEdge)" font-size="13"');

    slot.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+
      '" preserveAspectRatio="xMidYMid meet" role="img" '+
      'aria-label="Три вектора в плоскости xy и недостижимая точка 0,0,1">'+s.join("")+'</svg>';

    document.getElementById("legend").innerHTML=
      '<b><span class="sw" style="background:var(--v1)"></span>v\u2081 = [1, 0, 0]</b> &nbsp;&nbsp;'+
      '<b><span class="sw" style="background:var(--v2)"></span>v\u2082 = [0, 1, 0]</b> &nbsp;&nbsp;'+
      '<b><span class="sw" style="background:var(--v3)"></span>v\u2083 = [2, 1, 0] = 2·v\u2081 + v\u2082</b><br>'+
      'Три стрелки выходят из нуля и лежат в одной плоскости xy. '+
      'Точка [0, 0, 1] поднята над этой плоскостью — до неё не дотягивается ни один вектор и ни одна их сумма.';
  }catch(e){
    slot.innerHTML='<p class="fail">Схема не построилась. Она должна показывать: '+
      'три вектора v\u2081 = [1, 0, 0], v\u2082 = [0, 1, 0], v\u2083 = [2, 1, 0] выходят из начала координат '+
      'и все три лежат в плоскости xy (v\u2083 = 2·v\u2081 + v\u2082). Точка [0, 0, 1] висит над этой '+
      'плоскостью и недостижима: складывая плоские векторы, из плоскости не выйдешь.</p>';
  }
})();
</script>
</body>
</html>
