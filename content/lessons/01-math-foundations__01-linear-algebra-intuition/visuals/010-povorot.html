<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Поворот на 90°</title>
<style>
  :root{
    --bg:#fbfaf7; --card:#ffffff; --grid:#e6e2d8; --axis:#7a7568;
    --text:#22221e; --muted:#5f5c53; --before:#1f6feb; --after:#d1471a; --arc:#7a5af8;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12141a; --card:#181b22; --grid:#272c36; --axis:#8b93a1;
      --text:#e7e9ee; --muted:#a8b0bd; --before:#6ea8fe; --after:#ff9f6b; --arc:#b39cff;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  figure{margin:0;padding:10px 12px;background:var(--card);}
  .title{font-weight:600;font-size:15px;}
  .sub{color:var(--muted);font-size:13px;margin:2px 0 4px;}
  svg{display:block;width:100%;height:auto;max-height:400px;}
  .grid{stroke:var(--grid);stroke-width:1;}
  .axis{stroke:var(--axis);stroke-width:1.5;}
  .axis-fill{fill:var(--axis);}
  .guide{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4;opacity:.6;}
  .vb{stroke:var(--before);stroke-width:3;}
  .vb-fill{fill:var(--before);}
  .va{stroke:var(--after);stroke-width:3;}
  .va-fill{fill:var(--after);}
  .arc{stroke:var(--arc);stroke-width:2;fill:none;}
  .arc-fill{fill:var(--arc);}
  text{font:13px system-ui,sans-serif;fill:var(--text);}
  .num{fill:var(--muted);font-size:12px;text-anchor:middle;}
  .numy{fill:var(--muted);font-size:12px;text-anchor:end;}
  .axlab{fill:var(--muted);font-size:13px;font-style:italic;}
  .lab-b{fill:var(--before);font-weight:600;}
  .lab-a{fill:var(--after);font-weight:600;text-anchor:middle;}
  .lab-arc{fill:var(--arc);font-size:13px;text-anchor:middle;}
  #fallback{color:var(--muted);font-size:13px;margin:6px 0 0;}
</style>
</head>
<body>
<figure>
  <figcaption class="title">Поворот на 90°: одна матрица двигает точку</figcaption>
  <div class="sub">R = [[0, −1], [1, 0]] · [3, 1] = [−1, 3] — обе стрелки выходят из начала координат, длины равны</div>
  <svg id="fig" viewBox="0 0 390 400" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Стрелка из начала координат в точку 3, 1 и стрелка в её образ минус 1, 3; между ними угол 90 градусов"></svg>
  <p id="fallback" hidden></p>
</figure>
<script>
(function(){
  var svg=document.getElementById('fig');
  try{
    /* ---- данные схемы: только они и содержат «сырые» числа ---- */
    var DATA={
      point:[3,1],                                  /* точка до поворота */
      matrix:[[0,-1],[1,0]],                        /* матрица R из текста шага */
      grid:{xmin:-2,xmax:4,ymin:-2,ymax:4},         /* границы сетки, в единицах данных */
      head:{len:0.30,w:0.11},                       /* наконечник стрелки, в единицах данных */
      tick:0.09,                                    /* половина засечки, в единицах данных */
      arcR:1.6, arcLabelR:2.0, arcSteps:48
    };

    /* ---- один origin, один scale, одна пара sx/sy: другого пути к координате нет ---- */
    var scale=50, origin={x:140,y:250};
    function sx(x){return origin.x + x*scale;}
    function sy(y){return origin.y - y*scale;}

    var M=DATA.matrix, P=DATA.point;
    var Q=[M[0][0]*P[0]+M[0][1]*P[1], M[1][0]*P[0]+M[1][1]*P[1]];   /* [-1, 3] */

    var NS='http://www.w3.org/2000/svg';
    function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
    function px(p){return sx(p[0])+','+sy(p[1]);}
    function line(a,b,cls){return el('line',{x1:sx(a[0]),y1:sy(a[1]),x2:sx(b[0]),y2:sy(b[1]),'class':cls});}
    function label(p,s,cls,dx,dy){var t=el('text',{x:sx(p[0])+dx,y:sy(p[1])+dy,'class':cls});t.textContent=s;return t;}
    function fmt(n){return String(n).replace('-','\u2212');}
    function pair(p){return '['+fmt(p[0])+', '+fmt(p[1])+']';}

    /* наконечник строится в единицах данных, на пиксели переводится тем же sx/sy */
    function head(a,b,cls){
      var dx=b[0]-a[0], dy=b[1]-a[1], L=Math.sqrt(dx*dx+dy*dy);
      var ux=dx/L, uy=dy/L, h=DATA.head;
      var base=[b[0]-ux*h.len, b[1]-uy*h.len];
      var l=[base[0]-uy*h.w, base[1]+ux*h.w];
      var r=[base[0]+uy*h.w, base[1]-ux*h.w];
      el('polygon',{points:[b,l,r].map(px).join(' '),'class':cls});
      return base;
    }
    function arrow(a,b,cls,fill){line(a,head(a,b,fill),cls);}

    var g=DATA.grid,i;

    /* сетка */
    for(i=g.xmin;i<=g.xmax;i++) line([i,g.ymin],[i,g.ymax],'grid');
    for(i=g.ymin;i<=g.ymax;i++) line([g.xmin,i],[g.xmax,i],'grid');

    /* оси — от sx(0)/sy(0), а не от вписанного руками нуля */
    arrow([g.xmin,0],[g.xmax,0],'axis','axis-fill');
    arrow([0,g.ymin],[0,g.ymax],'axis','axis-fill');
    label([g.xmax,0],'x','axlab',-2,20);
    label([0,g.ymax],'y','axlab',10,4);
    label([0,0],'0','numy',-8,16);

    /* засечки и числа */
    for(i=g.xmin;i<=g.xmax;i++){ if(i===0) continue;
      line([i,-DATA.tick],[i,DATA.tick],'axis'); label([i,0],fmt(i),'num',0,18); }
    for(i=g.ymin;i<=g.ymax;i++){ if(i===0) continue;
      line([-DATA.tick,i],[DATA.tick,i],'axis'); label([0,i],fmt(i),'numy',-9,4); }

    /* пунктиры до осей — чтобы координаты читались */
    line([P[0],0],P,'guide'); line([0,P[1]],P,'guide');
    line([Q[0],0],Q,'guide'); line([0,Q[1]],Q,'guide');

    /* дуга поворота: от угла точки до угла её образа */
    var a0=Math.atan2(P[1],P[0]), a1=Math.atan2(Q[1],Q[0]), N=DATA.arcSteps, pts=[];
    for(i=0;i<=N;i++){ var t=a0+(a1-a0)*i/N;
      pts.push([DATA.arcR*Math.cos(t), DATA.arcR*Math.sin(t)]); }
    el('polyline',{points:pts.slice(0,N).map(px).join(' '),'class':'arc'});
    head(pts[N-1],pts[N],'arc-fill');
    var am=(a0+a1)/2;
    label([DATA.arcLabelR*Math.cos(am), DATA.arcLabelR*Math.sin(am)],'90\u00B0','lab-arc',0,4);

    /* сами векторы */
    arrow([0,0],P,'vb','vb-fill');
    arrow([0,0],Q,'va','va-fill');
    label(P,pair(P)+' — до','lab-b',10,-8);
    label(Q,pair(Q)+' — после','lab-a',0,-14);
  }catch(e){
    svg.style.display='none';
    var f=document.getElementById('fallback');
    f.hidden=false;
    f.textContent='Схема должна была показать: стрелку из начала координат в точку [3, 1] '+
      'и стрелку в её образ [\u22121, 3] после умножения на матрицу R = [[0, \u22121], [1, 0]]. '+
      'Угол между стрелками — 90\u00B0, длины одинаковые.';
  }
})();
</script>
</body>
</html>
