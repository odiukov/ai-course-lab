<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Одно правило двигает две точки</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1b1f24;
    --muted: #5c6773;
    --line: #8a94a0;
    --a: #1f6feb;
    --b: #c2410c;
    --box: #eef2f7;
    --boxline: #6b7684;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c;
      --fg: #e8edf3;
      --muted: #a3aebb;
      --line: #6f7a87;
      --a: #6ea8ff;
      --b: #ff9d5c;
      --box: #232830;
      --boxline: #98a3b0;
    }
  }
  html, body { margin: 0; background: var(--bg); }
  .wrap {
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 10px 12px 12px;
    box-sizing: border-box;
  }
  h2 { font-size: 15px; margin: 0 0 8px; font-weight: 600; }
  svg { display: block; width: 100%; height: auto; max-height: 480px; }
  .fail { font-size: 13px; color: var(--muted); line-height: 1.5; }
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
</style>
</head>
<body>
<div class="wrap">
  <h2>Одно правило двигает две точки</h2>
  <div id="slot"></div>
</div>
<script>
(function () {
  var slot = document.getElementById('slot');
  try {
    // ---- данные схемы ----
    var BEFORE = [
      { id: 'A', label: 'A [3,1]', p: [3, 1], cls: 'a', dx: 1, dy: 1 },
      { id: 'B', label: 'B [1,2]', p: [1, 2], cls: 'b', dx: -1, dy: 1 }
    ];
    var AFTER = [
      { id: 'A2', label: "A' [-1,3]", p: [-1, 3], cls: 'a', dx: -1, dy: 1 },
      { id: 'B2', label: "B' [-2,1]", p: [-2, 1], cls: 'b', dx: -1, dy: -1 }
    ];
    var AX = [-3, 3];   // диапазон осей в единицах сетки
    var AY = [-1, 4];

    // ---- холст (литералы: только размеры) ----
    var W = 900, H = 400;

    // ---- одна пара функций перевода ----
    var origin = { x: 150, y: 300 };
    var scale = 34;
    function sx(x) { return origin.x + x * scale; }
    function sy(y) { return origin.y - y * scale; }

    var PAD = 6;        // пиксельный отступ подписи от якоря
    var LW = 1.6;       // толщина линий
    var FS = 13;        // размер шрифта

    var ns = 'http://www.w3.org/2000/svg';
    function el(n, a) {
      var e = document.createElementNS(ns, n);
      for (var k in a) e.setAttribute(k, a[k]);
      return e;
    }
    function txt(x, y, s, anchor, cls) {
      var t = el('text', {
        x: x, y: y, 'text-anchor': anchor, 'font-size': FS,
        fill: 'var(--' + (cls || 'fg') + ')'
      });
      t.textContent = s;
      return t;
    }

    var svg = el('svg', {
      viewBox: '0 0 ' + W + ' ' + H,
      preserveAspectRatio: 'xMidYMid meet',
      role: 'img',
      'aria-label': "Точки A [3,1] и B [1,2] проходят через матрицу поворота на 90 градусов и становятся A' [-1,3] и B' [-2,1]"
    });
    svg.appendChild(el('rect', { x: 0, y: 0, width: W, height: H, fill: 'var(--bg)' }));

    // ---- одна панель координат ----
    // shift — сдвиг в единицах сетки, всё равно проходит через sx/sy
    function axes(g, shift, title) {
      g.appendChild(el('line', {
        x1: sx(AX[0] + shift), y1: sy(0), x2: sx(AX[1] + shift), y2: sy(0),
        stroke: 'var(--line)', 'stroke-width': LW
      }));
      g.appendChild(el('line', {
        x1: sx(shift), y1: sy(AY[0]), x2: sx(shift), y2: sy(AY[1]),
        stroke: 'var(--line)', 'stroke-width': LW
      }));
      var i;
      for (i = AX[0]; i <= AX[1]; i++) {
        if (i === 0) continue;
        g.appendChild(el('line', {
          x1: sx(i + shift), y1: sy(0) - PAD / 2, x2: sx(i + shift), y2: sy(0) + PAD / 2,
          stroke: 'var(--line)', 'stroke-width': LW
        }));
      }
      for (i = AY[0]; i <= AY[1]; i++) {
        if (i === 0) continue;
        g.appendChild(el('line', {
          x1: sx(shift) - PAD / 2, y1: sy(i), x2: sx(shift) + PAD / 2, y2: sy(i),
          stroke: 'var(--line)', 'stroke-width': LW
        }));
      }
      // ноль — через sx(0)/sy(0), не вписан руками
      g.appendChild(txt(sx(shift) - PAD, sy(0) + FS + PAD / 2, '0', 'end', 'muted'));
      g.appendChild(txt(sx(shift), sy(AY[1]) - PAD, title, 'middle', 'muted'));
    }

    function point(g, d, shift) {
      var px = sx(d.p[0] + shift), py = sy(d.p[1]);
      g.appendChild(el('circle', { cx: px, cy: py, r: LW * 2.6, fill: 'var(--' + d.cls + ')' }));
      var anchor = d.dx > 0 ? 'start' : 'end';
      g.appendChild(txt(px + d.dx * PAD, py - d.dy * PAD, d.label, anchor, d.cls));
    }

    // сдвиги панелей в единицах сетки
    var LEFT = 0;
    var RIGHT = (AX[1] - AX[0]) + 12;
    var MIDX = (AX[1] + LEFT + AX[0] + RIGHT) / 2;

    var gl = el('g', {}); svg.appendChild(gl);
    axes(gl, LEFT, 'До');
    BEFORE.forEach(function (d) { point(gl, d, LEFT); });

    var gr = el('g', {}); svg.appendChild(gr);
    axes(gr, RIGHT, 'После');
    AFTER.forEach(function (d) { point(gr, d, RIGHT); });

    // ---- блок правила ----
    var boxHalfW = 3.1, boxTop = 3.0, boxBot = 0.4;
    svg.appendChild(el('rect', {
      x: sx(MIDX - boxHalfW), y: sy(boxTop),
      width: sx(MIDX + boxHalfW) - sx(MIDX - boxHalfW),
      height: sy(boxBot) - sy(boxTop),
      rx: PAD, fill: 'var(--box)', stroke: 'var(--boxline)', 'stroke-width': LW
    }));
    svg.appendChild(txt(sx(MIDX), sy(boxTop - 0.7), 'матрица', 'middle', 'fg'));
    svg.appendChild(txt(sx(MIDX), sy(boxTop - 1.4), 'поворота на 90°', 'middle', 'fg'));
    svg.appendChild(txt(sx(MIDX), sy(boxTop - 2.2), 'одно правило на всех', 'middle', 'muted'));

    // ---- стрелки: две внутрь, две наружу ----
    function arrow(from, to, cls) {
      var x1 = sx(from[0]), y1 = sy(from[1]), x2 = sx(to[0]), y2 = sy(to[1]);
      svg.appendChild(el('line', {
        x1: x1, y1: y1, x2: x2, y2: y2,
        stroke: 'var(--' + cls + ')', 'stroke-width': LW
      }));
      // наконечник — тоже через sx/sy
      var back = 0.55, wing = 0.22;
      var dx = to[0] - from[0], dy = to[1] - from[1];
      var len = Math.sqrt(dx * dx + dy * dy);
      var ux = dx / len, uy = dy / len;
      var bx = to[0] - ux * back, by = to[1] - uy * back;
      var p = [
        [sx(to[0]), sy(to[1])],
        [sx(bx - uy * wing), sy(by + ux * wing)],
        [sx(bx + uy * wing), sy(by - ux * wing)]
      ];
      svg.appendChild(el('polygon', {
        points: p.map(function (q) { return q[0] + ',' + q[1]; }).join(' '),
        fill: 'var(--' + cls + ')'
      }));
    }

    var inA = [MIDX - boxHalfW - 0.3, 2.3];
    var inB = [MIDX - boxHalfW - 0.3, 1.1];
    var outA = [MIDX + boxHalfW + 0.3, 2.3];
    var outB = [MIDX + boxHalfW + 0.3, 1.1];

    arrow([AX[1] + LEFT + 0.6, 2.3], inA, 'a');
    arrow([AX[1] + LEFT + 0.6, 1.1], inB, 'b');
    arrow(outA, [AX[0] + RIGHT - 0.6, 2.3], 'a');
    arrow(outB, [AX[0] + RIGHT - 0.6, 1.1], 'b');

    // подписи у ХВОСТОВ стрелок, разведены выше и ниже
    svg.appendChild(txt(sx(AX[1] + LEFT + 0.7), sy(2.3) - PAD, 'A', 'start', 'a'));
    svg.appendChild(txt(sx(AX[1] + LEFT + 0.7), sy(1.1) + FS, 'B', 'start', 'b'));
    svg.appendChild(txt(sx(MIDX + boxHalfW + 0.4), sy(2.3) - PAD, "A'", 'start', 'a'));
    svg.appendChild(txt(sx(MIDX + boxHalfW + 0.4), sy(1.1) + FS, "B'", 'start', 'b'));

    // ---- нижняя строка ----
    svg.appendChild(txt(sx(MIDX), sy(AY[0] - 0.6),
      'Две точки на входе — две на выходе. Правило одно и то же.', 'middle', 'muted'));

    slot.appendChild(svg);
  } catch (e) {
    var d = document.createElement('div');
    d.className = 'fail';
    d.textContent = 'Схема должна была показать: слева точки A [3,1] и B [1,2]; ' +
      'обе стрелками входят в один блок «матрица поворота на 90°»; ' +
      'справа выходят A\u2032 [-1,3] и B\u2032 [-2,1]. ' +
      'Правило одно, точек сколько угодно.';
    slot.appendChild(d);
  }
})();
</script>
</body>
</html>
