<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Знак скалярного произведения</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1c2230; --muted:#6b7488; --axis:#aab2c2;
    --a:#3b5bdb; --pos:#1f8a4c; --zero:#8a7a1f; --neg:#c0392b;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12161c; --fg:#e8ecf4; --muted:#9aa4b8; --axis:#3b4454;
      --a:#7c9cff; --pos:#4cc98a; --zero:#d9c25a; --neg:#ff7b6b;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:980px;margin:0 auto;padding:12px}
  h2{margin:0 0 6px;font-size:17px;font-weight:600}
  p.sub{margin:0 0 8px;color:var(--muted);font-size:13px}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg)}
  .axis{stroke:var(--axis);stroke-width:1;fill:none}
  .shaft{stroke-width:2;fill:none}
  .va{stroke:var(--a)} .fa{fill:var(--a)}
  .pos{stroke:var(--pos)} .fpos{fill:var(--pos)}
  .zero{stroke:var(--zero)} .fzero{fill:var(--zero)}
  .neg{stroke:var(--neg)} .fneg{fill:var(--neg)}
  text{font:13px/1 system-ui,sans-serif;fill:var(--fg)}
  text.head{fill:var(--muted);font-size:13px}
  text.cap{font-size:13px;font-weight:600}
  text.vec{font-size:12px}
  .rt{fill:none;stroke:var(--zero);stroke-width:1}
  .fail{padding:10px;color:var(--fg);font-size:14px}
</style>
<div class="wrap">
  <h2>Знак скалярного произведения: три пары стрелок</h2>
  <p class="sub">Стрелка <b>a</b> = [3, 2] одна и та же во всех трёх случаях; меняется только направление <b>b</b>.</p>
  <svg id="s" viewBox="0 0 700 330" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Три пары стрелок: сонаправленные, перпендикулярные, противоположные"></svg>
  <div id="fb"></div>
</div>
<script>
(function(){
  var svg=document.getElementById("s");
  try{
    /* ---- данные схемы (мировые координаты, единицы = клетки) ---- */
    var PANELS=[
      {cx:0,  a:[3,2], b:[2,3],   head:"угол меньше 90\u00B0",
       cap:"a\u00B7b = 3\u00B72 + 2\u00B73 = 12  (\u043F\u043B\u044E\u0441)",
       sub:"\u0442\u044F\u043D\u0443\u0442 \u0432 \u043E\u0434\u043D\u0443 \u0441\u0442\u043E\u0440\u043E\u043D\u0443",
       bl:"b = [2, 3]", k:"pos", right:false},
      {cx:9,  a:[3,2], b:[-2,3],  head:"\u0440\u043E\u0432\u043D\u043E 90\u00B0",
       cap:"a\u00B7b = \u22126 + 6 = 0  (\u043D\u043E\u043B\u044C)",
       sub:"\u043D\u0438 \u043F\u043E\u043C\u043E\u0433\u0430\u044E\u0442, \u043D\u0438 \u043C\u0435\u0448\u0430\u044E\u0442",
       bl:"b = [\u22122, 3]", k:"zero", right:true},
      {cx:18, a:[3,2], b:[-3,-2], head:"\u0431\u043E\u043B\u044C\u0448\u0435 90\u00B0",
       cap:"a\u00B7b = \u22129 \u2212 4 = \u221213  (\u043C\u0438\u043D\u0443\u0441)",
       sub:"\u0442\u044F\u043D\u0443\u0442 \u0432\u0440\u043E\u0437\u044C",
       bl:"b = [\u22123, \u22122]", k:"neg", right:false}
    ];
    var AX=4, TICK=0.18, HEAD=0.55, HW=0.26, RT=0.5;  /* мировые размеры */
    var LBL=10;                                        /* пиксельный отступ подписи */

    /* ---- единственная пара функций перевода ---- */
    var origin={x:64,y:186}, scale=26;
    function sx(x){ return origin.x + x*scale; }
    function sy(y){ return origin.y - y*scale; }

    var NS="http://www.w3.org/2000/svg";
    function el(n,at){var e=document.createElementNS(NS,n);
      for(var k in at) e.setAttribute(k,at[k]); return e;}
    function seg(p,q,cls){ svg.appendChild(el("line",
      {x1:sx(p[0]),y1:sy(p[1]),x2:sx(q[0]),y2:sy(q[1]),"class":cls})); }
    function txt(p,s,cls,anchor,dx,dy){
      var t=el("text",{x:sx(p[0])+(dx||0),y:sy(p[1])+(dy||0),
        "class":cls,"text-anchor":anchor||"middle"});
      t.textContent=s; svg.appendChild(t); return t;
    }
    function poly(pts,cls){
      var d=pts.map(function(p){return sx(p[0])+","+sy(p[1]);}).join(" ");
      svg.appendChild(el("polygon",{points:d,"class":cls}));
    }
    /* стрелка из точки o вектором v */
    function arrow(o,v,sc,fc){
      var tip=[o[0]+v[0], o[1]+v[1]];
      var L=Math.hypot(v[0],v[1]), u=[v[0]/L, v[1]/L], n=[-u[1],u[0]];
      var b=[tip[0]-u[0]*HEAD, tip[1]-u[1]*HEAD];
      seg(o,b,"shaft "+sc);
      poly([tip,[b[0]+n[0]*HW,b[1]+n[1]*HW],[b[0]-n[0]*HW,b[1]-n[1]*HW]],fc);
      return {tip:tip,u:u};
    }

    PANELS.forEach(function(P){
      var o=[P.cx,0];
      /* оси панели */
      seg([P.cx-AX,0],[P.cx+AX,0],"axis");
      seg([P.cx,-AX],[P.cx,AX],"axis");
      [-3,-2,-1,1,2,3].forEach(function(t){
        seg([P.cx+t,-TICK],[P.cx+t,TICK],"axis");
        seg([P.cx-TICK,t],[P.cx+TICK,t],"axis");
      });
      /* стрелки */
      var A=arrow(o,P.a,"va","fa");
      var B=arrow(o,P.b,P.k,"f"+P.k);
      /* прямой угол между a и b */
      if(P.right){
        var c1=[o[0]+A.u[0]*RT, o[1]+A.u[1]*RT];
        var c2=[c1[0]+B.u[0]*RT, c1[1]+B.u[1]*RT];
        var c3=[o[0]+B.u[0]*RT, o[1]+B.u[1]*RT];
        svg.appendChild(el("polyline",{points:
          [c1,c2,c3].map(function(p){return sx(p[0])+","+sy(p[1]);}).join(" "),
          "class":"rt"}));
      }
      /* подписи стрелок: точка привязки = кончик, отступ в пикселях */
      txt(A.tip,"a = [3, 2]","vec","start",LBL,-LBL/2).setAttribute("fill","var(--a)");
      var bAnchor = P.b[0]<0 ? "end" : "start";
      var bdx = P.b[0]<0 ? -LBL : LBL;
      var bdy = P.b[1]<0 ? LBL*1.2 : -LBL/2;
      txt(B.tip,P.bl,"vec",bAnchor,bdx,bdy).setAttribute("fill","var(--"+P.k+")");
      /* заголовок и подпись панели */
      txt([P.cx,AX+0.5],P.head,"head");
      txt([P.cx,-AX-0.35],P.cap,"cap").setAttribute("fill","var(--"+P.k+")");
      txt([P.cx,-AX-0.95],P.sub,"head");
    });
  }catch(e){
    svg.remove();
    var d=document.getElementById("fb");
    d.className="fail";
    d.textContent="\u0421\u0445\u0435\u043C\u0430 \u0434\u043E\u043B\u0436\u043D\u0430 \u0431\u044B\u043B\u0430 \u043F\u043E\u043A\u0430\u0437\u0430\u0442\u044C \u0442\u0440\u0438 \u043F\u0430\u0440\u044B \u0441\u0442\u0440\u0435\u043B\u043E\u043A \u0438\u0437 \u043E\u0434\u043D\u043E\u0439 \u0442\u043E\u0447\u043A\u0438. \u0421\u0442\u0440\u0435\u043B\u043A\u0430 a = [3, 2] \u0432\u0435\u0437\u0434\u0435 \u043E\u0434\u043D\u0430 \u0438 \u0442\u0430 \u0436\u0435. \u0421 b = [2, 3] \u0443\u0433\u043E\u043B \u043C\u0435\u043D\u044C\u0448\u0435 90\u00B0: 3\u00B72 + 2\u00B73 = 12, \u043F\u043B\u044E\u0441. \u0421 b = [\u22122, 3] \u0443\u0433\u043E\u043B \u0440\u043E\u0432\u043D\u043E 90\u00B0: \u22126 + 6 = 0, \u043D\u043E\u043B\u044C. \u0421 b = [\u22123, \u22122] \u0443\u0433\u043E\u043B \u0431\u043E\u043B\u044C\u0448\u0435 90\u00B0: \u22129 \u2212 4 = \u221213, \u043C\u0438\u043D\u0443\u0441.";
  }
})();
</script>
</html>
