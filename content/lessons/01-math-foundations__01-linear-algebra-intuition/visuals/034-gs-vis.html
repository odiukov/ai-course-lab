<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Шаги Грама-Шмидта</title>
<style>
  :root{
    --bg:#fbfbfd; --fg:#1b2030; --mut:#6a7288;
    --ax:#b9c0d0; --v:#c9761a; --un:#2563c9; --ud:#0f8a6e; --dh:#8b93a8;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12151c; --fg:#e8ecf5; --mut:#9aa3b8;
      --ax:#39414f; --v:#e8a54a; --un:#6ea8fe; --ud:#3fd1a8; --dh:#7c869c;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{padding:10px 12px 14px}
  h1{font-size:15px;margin:0 0 2px}
  p.sub{margin:0;color:var(--mut);font-size:12px}
  svg{display:block;width:100%;height:auto;max-height:520px;margin-top:2px}
  #fb{display:none;white-space:pre-wrap;color:var(--fg);font-size:13px;margin-top:8px}
  .ax{stroke:var(--ax);stroke-width:1;stroke-dasharray:3 4}
  .dash{stroke:var(--dh);stroke-width:1.6;stroke-dasharray:6 4}
  .v{stroke:var(--v);stroke-width:2.2}
  .un{stroke:var(--un);stroke-width:2.6}
  .ud{stroke:var(--ud);stroke-width:2.2}
  .hd{stroke:none}
  .hd.v{fill:var(--v)} .hd.un{fill:var(--un)} .hd.ud{fill:var(--ud)}
  .ang{fill:none;stroke:var(--mut);stroke-width:1.2}
  .dot{fill:var(--fg)}
  text{font:12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg)}
  text.lab.v{fill:var(--v);stroke:none} text.lab.un{fill:var(--un);stroke:none}
  text.lab.ud{fill:var(--ud);stroke:none} text.dl{fill:var(--dh);font-size:11.5px}
  text.ttl{font-size:13px;font-weight:600}
  text.cap{font-size:11.5px;fill:var(--mut)}
  text.note{font-size:12px;fill:var(--fg)}
</style>
<div class="wrap">
  <h1>Грам-Шмидт: три шага для v₁ = [1, 0, 0], v₂ = [1, 1, 0], v₃ = [1, 1, 1]</h1>
  <p class="sub">Каждый новый вектор минус его тени на уже готовых осях.</p>
  <svg id="scene" viewBox="0 0 800 336" role="img"
       aria-label="Три кадра построения ортонормированного базиса"></svg>
  <div id="fb"></div>
</div>
<script>
(function(){
  var S=document.getElementById('scene');
  try{
    var NS='http://www.w3.org/2000/svg';

    /* ---- данные схемы ---- */
    var D={
      basis:{ x:[-0.55,0.32], y:[1,0], z:[0,-1] },
      axes:[[1.2,0,0],[0,1.2,0],[0,0,1.2]],
      head:{len:0.2,wid:0.09},
      angle:0.18,
      note:{at:[4.65,1.6],s:'Итог: три взаимно перпендикулярные оси, длина каждой = 1'},
      frames:[
        { at:[0,0],
          title:'Шаг 1: первая ось',
          caption:'u₁ = v₁, длина |v₁| = 1 — делить не на что',
          arrows:[{from:[0,0,0],to:[1,0,0],cls:'un',lab:'u₁ = v₁ = [1, 0, 0]',off:[8,20],an:'start'}],
          dash:[], ang:[] },
        { at:[4.5,0],
          title:'Шаг 2: минус одна тень',
          caption:'u₂ = v₂ − proj_u₁(v₂) = [0, 1, 0]',
          arrows:[
            {from:[0,0,0],to:[1,0,0],cls:'ud',lab:'u₁ = proj_u₁(v₂)',off:[6,22],an:'start'},
            {from:[0,0,0],to:[1,1,0],cls:'v',lab:'v₂ = [1, 1, 0]',off:[8,-8],an:'start'},
            {from:[0,0,0],to:[0,1,0],cls:'un',lab:'u₂ = [0, 1, 0]',off:[0,22],an:'middle'}],
          dash:[{from:[1,0,0],to:[1,1,0],at:[1,0.5,0],lab:'v₂ − тень',off:[10,4],an:'start'}],
          ang:[[[0.18,0,0],[0.18,0.18,0],[0,0.18,0]]] },
        { at:[9,0],
          title:'Шаг 3: минус две тени',
          caption:'u₃ = v₃ − proj_u₁(v₃) − proj_u₂(v₃) = [0, 0, 1]',
          arrows:[
            {from:[0,0,0],to:[1,0,0],cls:'ud',lab:'u₁',off:[-6,20],an:'end'},
            {from:[0,0,0],to:[0,1,0],cls:'ud',lab:'u₂',off:[10,16],an:'start'},
            {from:[0,0,0],to:[1,1,1],cls:'v',lab:'v₃ = [1, 1, 1]',off:[8,-8],an:'start'},
            {from:[0,0,0],to:[0,0,1],cls:'un',lab:'u₃ = [0, 0, 1]',off:[0,-12],an:'middle'}],
          dash:[
            {from:[0,0,0],to:[1,1,0],at:[1,1,0],lab:'proj_u₁(v₃) + proj_u₂(v₃) = [1, 1, 0]',off:[-4,36],an:'end'},
            {from:[1,1,0],to:[1,1,1],at:[1,1,0.5],lab:'остаток ⟂ обеим',off:[10,4],an:'start'}],
          ang:[[[0.18,0,0],[0.18,0.18,0],[0,0.18,0]],
               [[0,0.18,0],[0,0.18,0.18],[0,0,0.18]]] }
      ]
    };

    /* ---- единственный перевод в пиксели ---- */
    var ORIGIN={x:74,y:222}, SCALE=60;
    function sx(u){ return ORIGIN.x+SCALE*u; }
    function sy(v){ return ORIGIN.y+SCALE*v; }

    /* 3D -> плоскость схемы (без пикселей) */
    function pu(p,f){
      var b=D.basis;
      return [ f[0]+p[0]*b.x[0]+p[1]*b.y[0]+p[2]*b.z[0],
               f[1]+p[0]*b.x[1]+p[1]*b.y[1]+p[2]*b.z[1] ];
    }
    function el(n,a){
      var e=document.createElementNS(NS,n);
      for(var k in a) e.setAttribute(k,a[k]);
      S.appendChild(e); return e;
    }
    function pts(list){
      return list.map(function(p){ return sx(p[0])+','+sy(p[1]); }).join(' ');
    }
    function seg(A,B,cls){
      el('line',{x1:sx(A[0]),y1:sy(A[1]),x2:sx(B[0]),y2:sy(B[1]),'class':cls});
    }
    function txt(P,s,off,an,cls){
      var t=el('text',{x:sx(P[0])+off[0],y:sy(P[1])+off[1],'text-anchor':an||'start','class':cls});
      t.textContent=s;
    }
    function arrow(A,B,cls){
      var dx=B[0]-A[0], dy=B[1]-A[1], L=Math.sqrt(dx*dx+dy*dy)||1;
      var ux=dx/L, uy=dy/L, h=D.head.len, w=D.head.wid;
      var base=[B[0]-h*ux, B[1]-h*uy];
      seg(A,base,cls);
      el('polygon',{'class':'hd '+cls,
        points:pts([B,[base[0]-w*uy,base[1]+w*ux],[base[0]+w*uy,base[1]-w*ux]])});
    }

    D.frames.forEach(function(fr){
      var f=fr.at, O=pu([0,0,0],f);

      D.axes.forEach(function(a){ seg(O,pu(a,f),'ax'); });
      fr.ang.forEach(function(a){
        el('polyline',{'class':'ang',points:pts(a.map(function(p){return pu(p,f);}))});
      });
      fr.dash.forEach(function(d){
        seg(pu(d.from,f),pu(d.to,f),'dash');
        txt(pu(d.at,f),d.lab,d.off,d.an,'dl');
      });
      fr.arrows.forEach(function(a){
        arrow(O,pu(a.to,f),a.cls);
        txt(pu(a.to,f),a.lab,a.off,a.an,'lab '+a.cls);
      });
      el('circle',{cx:sx(O[0]),cy:sy(O[1]),r:2.6,'class':'dot'});

      txt([f[0]+0.15,f[1]-1.75],fr.title,[0,0],'middle','ttl');
      txt([f[0]+0.15,f[1]+1.15],fr.caption,[0,0],'middle','cap');
    });

    txt(D.note.at,D.note.s,[0,0],'middle','note');

  }catch(e){
    S.style.display='none';
    var fb=document.getElementById('fb');
    fb.style.display='block';
    fb.textContent=
      'Схема должна была показать три кадра Грама-Шмидта:\n'+
      '1) u₁ = v₁ = [1, 0, 0], длина уже 1;\n'+
      '2) u₂ = v₂ − proj_u₁(v₂) = [1, 1, 0] − [1, 0, 0] = [0, 1, 0];\n'+
      '3) u₃ = v₃ − proj_u₁(v₃) − proj_u₂(v₃) = [1, 1, 1] − [1, 1, 0] = [0, 0, 1].\n'+
      'Итог: три взаимно перпендикулярные стрелки длиной 1.';
  }
})();
</script>
</html>
