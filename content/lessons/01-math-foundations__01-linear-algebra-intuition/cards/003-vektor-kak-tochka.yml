- concept: 'вектор — упорядоченный список: перестановка координат даёт другую точку'
  question: Почему векторы [5, 1] и [1, 5] считаются разными, хотя состоят из одних и тех же чисел?
  explanation: Вектор — упорядоченный список. Первое число идёт по первой оси, второе — по второй. Длины у [5, 1] и [1, 5] совпадают (sqrt(26)), но направления и сами точки разные. В embedding-пространстве это значит, что порядок компонент фиксирован и переставлять их нельзя.
  kind: choice
  options:
    - Позиция числа определяет, вдоль какой оси откладывается мерка, поэтому это точки в разных местах
    - 'Они одинаковы: набор чисел совпадает, значит совпадают и векторы'
    - Они разные только по длине, а направление у них одно
    - Разница есть лишь в 2D; при большем числе координат порядок перестаёт влиять
  correct: 0
