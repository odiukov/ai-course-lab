- concept: длина вектора равна корню из суммы квадратов координат
  question: Вектор задан координатами [6, 8]. Чему равна его длина?
  explanation: Длина = sqrt(6² + 8²) = sqrt(36 + 64) = sqrt(100) = 10. Это прямое расстояние от начала координат до точки, а не сумма координат (14) — по осям идти дольше, чем напрямик.
  kind: numeric
  answer: 10
  tolerance: 0.01
  id: 003-vektor-kak-tochka-1
  fingerprint: 91546e3e
- concept: количество чисел в векторе равно числу измерений пространства, в котором лежит точка
  question: Модель кодирует каждое слово вектором из 384 чисел. Что это означает геометрически?
  explanation: 'Каждое из 384 чисел — мерка вдоль одной оси. Все вместе они задают ровно одну точку в 384-мерном пространстве. Отсюда и работают расстояния между словами: точки можно сравнивать так же, как на плоскости.'
  kind: choice
  options:
    - Слову назначена одна точка в пространстве с 384 независимыми направлениями
    - Слову назначено 384 отдельные точки на плоскости
    - Слово разбито на 384 буквы, каждой соответствует своё число
    - Слово хранится с точностью до 384 знаков после запятой
  correct: 0
  id: 003-vektor-kak-tochka-2
