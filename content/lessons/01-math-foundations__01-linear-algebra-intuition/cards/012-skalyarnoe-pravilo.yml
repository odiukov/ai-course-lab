- concept: скалярное произведение = сумма произведений чисел, стоящих на одинаковых позициях
  question: Даны векторы a = [4, 7, 9] и b = [8, -4, 7]. Чему равно скалярное произведение a · b?
  explanation: 'Перемножаем по позициям и складываем: 4×8 + 7×(-4) + 9×7 = 32 - 28 + 63 = 67. Столбцы не складываются по отдельности — каждая позиция встречается только со своей.'
  kind: numeric
  answer: 67
  tolerance: 0.01
  id: 012-skalyarnoe-pravilo-1
  fingerprint: b248d3e1
- concept: скалярное произведение определено только для векторов одинаковой размерности
  question: У вектора a четыре числа, у вектора b — семь. Чему равно a · b?
  explanation: Формула a·b = a₁b₁ + a₂b₂ + ... + aₙbₙ требует пары на каждой позиции. Пятому числу b не с кем перемножаться, значит операции нет. Поэтому в RAG и поиске все embeddings одной модели имеют одну размерность — иначе векторы просто нельзя сравнить.
  kind: choice
  options:
    - 'Операция не определена: паре не хватает чисел, длины обязаны совпадать'
    - Сумме произведений первых четырёх позиций, остальные три игнорируются
    - Сумме всех одиннадцати чисел обоих векторов
    - Нулю, потому что векторы лежат в разных пространствах
  correct: 0
  id: 012-skalyarnoe-pravilo-2
  fingerprint: f4a62fe6
- concept: знак скалярного произведения показывает, сонаправлены векторы, перпендикулярны или направлены навстречу
  question: Поисковая система сравнила запрос q с тремя документами и получила скалярные произведения 12.5, 0.04 и -4.8. Объясни своими словами, что каждое из этих чисел говорит о документе и почему знак важнее, чем сам факт вычисления.
  explanation: 'Знак — это направление: >0 сонаправлены, ≈0 перпендикулярны и не связаны, <0 противоположны. Именно так работают поиск, рекомендации и RAG: берут векторы с наибольшим скалярным произведением к вектору запроса.'
  kind: open
  reference: 'Скалярное произведение — одно число, по которому векторы можно сортировать. Положительное (12.5) означает, что векторы смотрят примерно в одну сторону: документ похож на запрос, он идёт первым. Близкое к нулю (0.04) — векторы почти перпендикулярны, общего между документом и запросом практически нет. Отрицательное (-4.8) — векторы направлены навстречу, документ противоположен запросу по смыслу. Знак задаёт качественный ответ («по пути / никак / навстречу»), а величина — насколько сильно, поэтому ранжирование сводится к поиску максимальных скалярных произведений.'
  id: 012-skalyarnoe-pravilo-3
  fingerprint: 4f3723d0
