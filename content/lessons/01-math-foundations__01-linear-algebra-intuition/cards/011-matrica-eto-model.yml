- concept: матрица весов работает как преобразование (умножение), а матрица embeddings — как справочник (выбор строки), хотя объект в обоих случаях один и тот же прямоугольник чисел
  question: И веса, и embeddings — просто прямоугольники чисел. Объясни своими словами, чем различается их роль, когда через модель прогоняют текст.
  explanation: 'Разница не в объекте, а в способе применения: выбор строки по индексу против матричного умножения. Смешение этих двух ролей — частая причина путаницы в размерностях: у embeddings первая размерность привязана к словарю, у весов — к размеру входного вектора слоя.'
  kind: open
  reference: 'Матрица embeddings используется как справочник: у неё столько строк, сколько токенов в словаре, и по номеру токена берётся готовая строка чисел — это координаты слова, и близкие по смыслу слова стоят близко. Матрица весов используется как преобразование: на неё умножают вектор, и на выходе получается другой вектор, возможно другой размерности. То есть embeddings отвечают на «какие числа соответствуют этому токену», веса — на «во что превратить пришедшие числа». Числа в весах настраиваются под задачу преобразования; таблица embeddings при этом тоже обучаемая, но её строки читают по индексу, а не перемножают целиком.'
  id: 011-matrica-eto-model-3
  fingerprint: 4bf72a79
