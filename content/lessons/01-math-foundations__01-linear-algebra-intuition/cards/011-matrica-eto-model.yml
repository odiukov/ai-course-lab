- concept: 'attention-таблица квадратная по числу токенов, а её клетка [i][j] несимметрична: важность j для i не равна важности i для j'
  question: Модель обрабатывает последовательность из 9 токенов. Какого размера таблица attention-весов одной головы и что означает число в её клетке?
  explanation: 'Attention сопоставляет каждый токен каждому, поэтому таблица квадратная: 9 × 9 = 81 число. Клетка (i, j) отвечает на вопрос «насколько при обработке токена i важен токен j», и это направленная величина: в «кот, который спал, проснулся» слово «проснулся» сильно смотрит на «кот», а обратное внимание слабее. Размер такой таблицы растёт как квадрат длины последовательности — отсюда цена длинного контекста.'
  kind: choice
  options:
    - 9 × 9; число в клетке (i, j) — насколько токен i учитывает токен j, и оно может не совпадать с числом в клетке (j, i)
    - 9 × 9; таблица всегда симметрична, потому что близость двух токенов — свойство пары, а не направления
    - 9 × 1; каждому токену соответствует одно число — его общая важность в предложении
    - Размер зависит только от размерности embeddings, а не от числа токенов
