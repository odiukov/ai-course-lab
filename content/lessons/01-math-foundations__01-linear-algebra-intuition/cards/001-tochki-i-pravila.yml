- concept: матрица задаёт одно преобразование, применимое к любому вектору, а не описывает конкретную точку
  question: Слой сети хранит матрицу W и прогоняет через неё 50 000 входных векторов. Что означает то, что матрица одна на всех?
  explanation: 'Матрица не привязана к конкретной точке: это функция вида v ↦ Wv, определённая на всём пространстве. Поэтому один набор весов обрабатывает любое количество входов, а координаты данных в самой матрице не хранятся.'
  kind: choice
  options:
    - W хранит координаты этих 50 000 векторов в сжатом виде
    - W — это правило преобразования, и оно одинаково применяется к каждому вектору независимо от его координат
    - W подстраивается под каждый входной вектор отдельно на прямом проходе
    - W работает только с векторами, которые встречались при обучении
  correct: 1
  id: 001-tochki-i-pravila-1
  fingerprint: 8621e5e1
- concept: умножение матрицы на вектор даёт координаты преобразованной точки
  question: Поворот на 90° против часовой стрелки задаётся матрицей [[0, -1], [1, 0]]. Её применяют к вектору [4, 7]. Чему равна первая координата результата?
  explanation: 'Первая координата = 0·4 + (−1)·7 = −7, вторая = 1·4 + 0·7 = 4. Результат [−7, 4]: длина сохранилась (sqrt(65) в обоих случаях), изменилось только направление — так и должно быть у поворота.'
  kind: numeric
  answer: -7
  tolerance: 0.01
  id: 001-tochki-i-pravila-2
  fingerprint: ea19c6c9
- concept: обучение нейросети — подбор чисел внутри матриц преобразования
  question: Объясни своими словами, что происходит с матрицами весов в процессе обучения нейросети и почему это можно описать как работу с точками в пространстве.
  explanation: Веса — это коэффициенты преобразования, а не хранилище данных. Градиентный спуск шаг за шагом правит эти коэффициенты; сами входные векторы остаются прежними, меняется то, куда их отправляет сеть.
  kind: open
  reference: 'Входы представлены векторами — точками в пространстве признаков. Каждый слой умножает вектор на матрицу весов, то есть перемещает точку: растягивает, поворачивает, проецирует. Обучение — это подбор чисел внутри матриц так, чтобы после всех преобразований точки разных классов/ответов оказались в нужных местах (например, линейно разделимыми). Меняются не данные, а правила их перемещения.'
  id: 001-tochki-i-pravila-3
  fingerprint: 1e004672
