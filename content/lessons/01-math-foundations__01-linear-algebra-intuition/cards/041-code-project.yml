- concept: проекция и остаток дают ортогональное разложение вектора, поэтому квадраты их длин складываются в квадрат длины исходного вектора
  question: Вектор a разложили на проекцию на направление b и остаток. Длина a равна 10, длина проекции равна 6. Какой будет длина остатка и почему так можно посчитать?
  explanation: 'Ключ — ортогональность остатка и проекции, а не арифметика. Из неё следует теорема Пифагора для разложения: sqrt(10² - 6²) = 8. Если бы длина остатка вышла больше длины самого вектора, это сигнал об ошибке в коэффициенте проекции.'
  kind: open
  reference: 'Длина остатка равна 8. Проекция p и остаток r в сумме дают исходный вектор (a = p + r), и они взаимно перпендикулярны, потому что остаток по построению ортогонален направлению b. Значит p и r — катеты прямоугольного треугольника с гипотенузой a, и |a|² = |p|² + |r|². Отсюда |r|² = 100 - 36 = 64, |r| = 8. Практическое следствие: длина остатка показывает, сколько в векторе информации, которую направление b не объясняет.'
  id: 041-code-project-3
  fingerprint: 1dfdbe8a
