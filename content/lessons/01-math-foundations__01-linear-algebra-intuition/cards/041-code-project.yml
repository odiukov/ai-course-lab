- concept: длина проекции равна модулю скалярного произведения, делённому на длину вектора-направления
  question: Даны a = [6, 8] и b = [12, 5]. Чему равна длина проекции a на направление b?
  explanation: 'a·b = 6·12 + 8·5 = 112, |b| = sqrt(144 + 25) = 13. Длина проекции = |a·b| / |b| = 112 / 13 ≈ 8.62. Обратите внимание: сам вектор-проекция равен (a·b / b·b)·b = (112/169)·[12, 5], но его длина считается делением на |b| один раз, а не на |b|².'
  kind: numeric
  answer: 8.62
  tolerance: 0.05
  id: 041-code-project-1
  fingerprint: '98800e70'
- concept: 'проекция несимметрична по аргументам: проекция a на b и проекция b на a — разные векторы, в отличие от скалярного произведения'
  question: Для векторов a = [6, 8] и b = [10, 0] сравнивают проекцию a на b и проекцию b на a. Что верно?
  explanation: 'Коммутативность a·b = b·a касается только числа в числителе. Знаменатель и множитель-вектор разные: proj_b(a) = (a·b / b·b)·b смотрит вдоль b, а proj_a(b) = (a·b / a·a)·a смотрит вдоль a. Здесь proj_b(a) = (60/100)·[10, 0] = [6, 0], а proj_a(b) = (60/100)·[6, 8] = [3.6, 4.8] — разные направления и разные длины.'
  kind: choice
  options:
    - 'Это разные векторы: первый лежит вдоль b, второй — вдоль a'
    - Это один и тот же вектор, потому что скалярное произведение коммутативно
    - Это векторы одинаковой длины, но противоположного направления
    - Второй не определён, так как у b есть нулевая координата
