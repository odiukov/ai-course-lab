- concept: косинус между вектором и его покоординатной перестановкой меньше единицы, хотя длины совпадают
  question: 'Даны два вектора: a = [4, 9] и b = [9, 4]. Чему равна их косинусная близость?'
  explanation: 'Скалярное произведение: 4*9 + 9*4 = 72. Длины равны: sqrt(16+81) = sqrt(97) у каждого, значит произведение длин = 97. Косинус = 72/97 ≈ 0.742. Перестановка координат сохраняет длину, но меняет направление, поэтому результат строго меньше 1: вектор со своей перестановкой не сонаправлен.'
  kind: numeric
  answer: 0.74
  tolerance: 0.03
  id: 018-code-cosine-1
  fingerprint: 7a020a73
- concept: косинусная близость по построению лежит в [-1, 1], выход за границы указывает на неверный знаменатель
  question: Реализация косинусной близости возвращает 1.8 для пары 512-мерных векторов с положительными координатами. Какая ошибка в коде наиболее вероятна?
  explanation: 'Из неравенства Коши-Буняковского |a·b| <= |a|*|b|, поэтому корректная формула физически не может дать модуль больше 1. Значение 1.8 означает, что знаменатель слишком маленький: типичный случай — деление на одну длину вместо произведения двух. Порядок аргументов ничего не меняет (косинус симметричен), размерность на границы не влияет, а пропуск координаты у положительных векторов только уменьшил бы числитель.'
  kind: choice
  options:
    - Скалярное произведение поделено на длину только одного вектора вместо произведения двух длин
    - Аргументы переданы в обратном порядке
    - Векторы имеют слишком большую размерность, при 512 координатах формула перестаёт работать
    - В сумме произведений пропущена последняя координата
  correct: 0
  id: 018-code-cosine-2
