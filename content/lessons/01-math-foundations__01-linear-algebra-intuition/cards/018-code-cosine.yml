- concept: равенство косинуса единице проверяют с допуском, потому что арифметика с плавающей точкой накапливает погрешность
  question: Объясни своими словами, почему тест `cosine_similarity(v, v) == 1.0` для 768-мерного вектора с дробными координатами ненадёжен и как правильно оформить такую проверку.
  explanation: 'Это не дефект формулы, а свойство машинной арифметики: результат отличается от 1 на величину порядка машинного эпсилон. Все численные тесты на векторные операции пишут через допуск, иначе тест падает случайным образом при смене порядка суммирования или размерности.'
  kind: open
  reference: 'Числа с плавающей точкой хранятся с конечной точностью, и каждое умножение, сложение, взятие корня и деление вносит крошечную ошибку округления. При 768 слагаемых эти ошибки накапливаются, поэтому числитель и знаменатель, математически равные, в машинной арифметике отличаются в последних разрядах, и результат получается вроде 0.9999999999999998 или 1.0000000000000002. Правильная проверка — сравнение с допуском: abs(result - 1.0) < 1e-9 (или assertAlmostEqual / math.isclose). Точное равенство допустимо только для целочисленных данных, где округления не возникает.'
  id: 018-code-cosine-3
  fingerprint: faa47c83
