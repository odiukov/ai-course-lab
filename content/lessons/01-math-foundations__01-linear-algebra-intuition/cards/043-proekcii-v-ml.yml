- concept: решение линейной регрессии — проекция вектора ответов на пространство, натянутое на столбцы признаков
  question: 'Датасет: 500 наблюдений, 7 признаков. Вектор реальных ответов y длины 500 почти никогда нельзя воспроизвести моделью точно. Что в терминах линейной алгебры делает метод наименьших квадратов?'
  explanation: 'Модель умеет выдавать только линейные комбинации своих 7 столбцов — это подпространство размерности не больше 7 внутри 500-мерного пространства. y в нём обычно не лежит. Наименьшие квадраты берут ближайшую точку подпространства, а ближайшая точка — это и есть ортогональная проекция y на него. Отсюда и название: минимизируется длина остатка.'
  kind: choice
  options:
    - Проецирует y на пространство, натянутое на столбцы признаков, и берёт ближайшую достижимую точку
    - Растягивает вектор y так, чтобы он попал в пространство столбцов
    - Ищет такое подмножество из 7 наблюдений, на которых ошибка равна нулю
    - Поворачивает столбцы признаков, пока один из них не совпадёт с y
  correct: 0
  id: 043-proekcii-v-ml-1
  fingerprint: acc02e35
- concept: PCA выбирает направления по максимуму дисперсии проекций и отбрасывает остальные
  question: Расставь шаги PCA для набора 512-мерных эмбеддингов, который нужно сжать до 64 измерений.
  explanation: 'PCA — это выбор направлений плюс проекция на них. Критерий выбора: максимум дисперсии проекций, то есть направление, вдоль которого данные разбросаны сильнее всего — там больше информации. Оставшиеся 448 направлений отбрасываются: сжатие происходит именно за счёт потери этих составляющих. Центрирование обязательно, иначе дисперсия считается относительно нуля, а не относительно центра облака.'
  kind: order
  items:
    - Вычесть из данных среднее, чтобы облако было центрировано в начале координат
    - Найти направление, вдоль которого дисперсия проекций данных максимальна
    - Добрать следующие направления максимальной дисперсии, ортогональные уже выбранным, до 64 штук
    - Спроецировать каждый вектор на выбранные направления и записать 64 коэффициента вместо 512
  id: 043-proekcii-v-ml-2
  fingerprint: 46fee3be
- concept: в attention скалярное произведение query на key становится весом суммирования, а не координатой проекции
  question: Регрессия, PCA и attention опираются на одно и то же скалярное произведение вектора с направлением. Объясни своими словами, чем использование результата в attention отличается от использования в PCA.
  explanation: 'Операция одна, назначение разное. PCA проецирует, чтобы сжать: коэффициент проекции идёт прямо в выход. Attention проецирует, чтобы взвесить: коэффициент управляет тем, сколько чужой информации подмешать. Регрессия — третий вариант: проекция даёт предсказание, ближайшее достижимое к истине.'
  kind: open
  reference: 'И там, и там считается скалярное произведение вектора с выбранным направлением — числовая мера того, насколько они сонаправлены. В PCA это число становится координатой: оно прямо записывается в сжатое представление вектора, оно и есть результат. В attention скалярное произведение query на key — не координата, а вес: после масштабирования и softmax оно определяет, с каким коэффициентом чужой value войдёт во взвешенную сумму. То есть в PCA число — это ответ, а в attention число — это решение о том, на что смотреть.'
  id: 043-proekcii-v-ml-3
  fingerprint: 2983139c
