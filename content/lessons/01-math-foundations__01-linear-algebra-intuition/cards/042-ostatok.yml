- concept: среди всех приближений вида k·b минимальную длину остатка даёт именно проекция, поэтому проекция = решение задачи наименьших квадратов
  question: Приближаем вектор a вектором вида k·b, перебирая коэффициент k. При каком k длина остатка a − k·b минимальна?
  explanation: Любое другое k добавляет к остатку лишнюю составляющую вдоль b, а по ортогональному разложению её квадрат прибавляется к квадрату длины остатка. Минимум достигается ровно тогда, когда вдоль b в остатке не осталось ничего, то есть при k = a·b / b·b. Поэтому «спроецировать» и «минимизировать квадрат ошибки» — одно действие, на этом стоит метод наименьших квадратов.
  kind: choice
  options:
    - При k = a·b / b·b — тогда остаток перпендикулярен b
    - При k = 1, потому что тогда приближение не искажает b
    - При k = |a| / |b| — тогда длины приближения и a совпадают
    - 'Минимума нет: длину остатка можно уменьшать неограниченно'
