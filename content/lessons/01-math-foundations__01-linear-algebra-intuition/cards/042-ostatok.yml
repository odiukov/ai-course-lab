- concept: 'проекция идемпотентна: повторное проецирование уже спроецированного вектора на то же направление ничего не меняет, а проекция остатка — нулевой вектор'
  question: Что получится, если спроецировать на b уже готовую проекцию proj_b(a)? А если спроецировать на b остаток a − proj_b(a)? Объясни своими словами.
  explanation: 'Ортогональное разложение разводит вектор на две части, которые больше не смешиваются: повторная проекция вдоль b ничего не добавляет и ничего не убирает, а из остатка вытягивать вдоль b уже нечего. Практическое следствие: убрав из данных направление b один раз, повторять эту операцию бессмысленно.'
  kind: open
  reference: 'Проекция proj_b(a) уже целиком лежит вдоль b, поэтому её проекция на b равна ей самой: proj_b(proj_b(a)) = proj_b(a) (проекция идемпотентна). Остаток, наоборот, не содержит ни капли направления b — его скалярное произведение с b равно нулю, значит коэффициент a·b/b·b обнуляется и проекция остатка — нулевой вектор. Вместе это и означает, что разложение делит вектор на две непересекающиеся части: одну полностью вдоль b, другую полностью поперёк.'
