- concept: если у обоих векторов все координаты неотрицательны, скалярное произведение не может быть отрицательным
  question: 'Документы кодируются частотами слов: все координаты векторов неотрицательны (счётчик слова либо ноль, либо больше нуля). Что можно сказать о скалярном произведении двух любых таких векторов?'
  explanation: 'Каждый вклад — произведение двух неотрицательных чисел, значит каждый вклад ≥ 0, и сумма ≥ 0. Отрицательная похожесть в таком пространстве физически невозможна: пара документов бывает либо связанной, либо никак не связанной. Отрицательные значения появляются только там, где координаты могут быть отрицательными (например, обученные embeddings).'
  kind: choice
  options:
    - 'Оно может быть любым: и положительным, и отрицательным'
    - Оно всегда положительно, ноль невозможен
    - 'Оно никогда не отрицательно: либо больше нуля, либо равно нулю'
    - Оно отрицательно, когда у документов нет общих слов
  correct: 2
  id: 015-check-znak-2
  fingerprint: 0dad0978
- concept: у разреженных векторов с непересекающимися ненулевыми позициями каждый вклад равен нулю, поэтому скалярное произведение — ноль
  question: Запрос закодирован как q = [7, 0, 0, 11], документ как d = [0, 9, 6, 0]. Ненулевые позиции у них не пересекаются. Чему равно q · d и что это значит?
  explanation: 'Вклады: 7×0, 0×9, 0×6, 11×0 — все нули, сумма ноль. Ноль тут получается не из-за погашения больших вкладов, а потому что ни на одной позиции оба вектора не активны одновременно. Так работает поиск по разреженным векторам: нет общих признаков — нет похожести.'
  kind: choice
  options:
    - 'Ноль: на каждой позиции один из множителей нулевой, общих признаков нет'
    - 'Положительное число: у обоих векторов есть большие координаты'
    - 'Отрицательное число: векторы направлены навстречу'
    - Посчитать нельзя, потому что в векторах есть нули
  correct: 0
