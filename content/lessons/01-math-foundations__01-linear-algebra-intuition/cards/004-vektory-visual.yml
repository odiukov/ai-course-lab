- concept: знак каждой координаты задаёт сторону сдвига по своей оси
  question: Вектор отложен из начала координат и имеет координаты [-7, 4]. Куда смотрит стрелка и почему? Объясни своими словами, что делают знаки координат.
  explanation: 'Координата = сдвиг вдоль своей оси: модуль — насколько, знак — в какую сторону. Поэтому четыре комбинации знаков дают четыре квадранта. Для векторов размерности 768 в embedding-пространстве картинки нет, но правило то же: каждая компонента — сдвиг по своей оси со своим знаком.'
  kind: open
  reference: Первая координата -7 — сдвиг по горизонтальной оси, минус значит влево от начала координат. Вторая координата 4 — сдвиг по вертикальной оси, плюс значит вверх. Значит стрелка идёт влево и вверх, во второй квадрант. Знак каждой координаты выбирает сторону по своей оси независимо от другой координаты, а модуль задаёт величину сдвига.
  id: 004-vektory-visual-2
  fingerprint: 65f7e343
- concept: вектор изображается как стрелка из начала координат в точку, заданную сдвигами по осям
  question: Расставь шаги построения стрелки для вектора [-6, 5] на плоскости в правильном порядке.
  explanation: 'Вектор всегда откладывается от начала координат, иначе те же два числа задавали бы бесконечно много стрелок. Порядок координат фиксирован: первая идёт по горизонтальной оси, вторая по вертикальной. Точка [-6, 5] и стрелка в неё — два вида одного и того же объекта.'
  kind: order
  items:
    - Найти начало координат — точку пересечения осей, от неё считаются оба сдвига
    - 'Отложить первую координату по горизонтальной оси: -6, то есть сдвиг влево'
    - 'Отложить вторую координату по вертикальной оси: 5, то есть сдвиг вверх'
    - Провести стрелку из начала координат в полученную точку, острие — в точке
  id: 004-vektory-visual-3
  fingerprint: c32ddad1
