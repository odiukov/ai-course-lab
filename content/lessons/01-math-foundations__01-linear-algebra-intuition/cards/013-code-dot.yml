- concept: 'порядок шагов вычисления скалярного произведения: сверка размерностей, накопитель, попарное умножение по индексу, возврат скаляра'
  question: Расставь шаги вычисления скалярного произведения двух векторов в правильном порядке.
  explanation: 'Сверка размерностей идёт первой: если посчитать по короткому вектору, результат получится, но будет неверным, и ошибка нигде не всплывёт. Дальше классическая свёртка: накопитель с нуля, попарные произведения по совпадающим индексам, сумма. Возврат — скаляр.'
  kind: order
  items:
    - Убедиться, что размерности векторов совпадают, иначе прервать вычисление с ошибкой
    - Завести накопитель суммы, равный нулю
    - Для каждой позиции умножить элемент первого вектора на элемент второго вектора с тем же индексом
    - Прибавить каждое произведение к накопителю
    - Вернуть накопитель как единственное число-результат
  id: 013-code-dot-1
  fingerprint: b48fdd8b
- concept: 'скалярное произведение коммутативно: перестановка аргументов не меняет результат'
  question: Для двух векторов a и b скалярное произведение a · b равно 41. Чему равно b · a?
  explanation: 'На каждой позиции стоит произведение двух чисел, а умножение чисел коммутативно; сумма тех же слагаемых не зависит от порядка векторов. Практическое следствие для кода: перепутанный порядок аргументов dot(a, b) никогда не проявится как расхождение чисел — тест на это ошибку не поймает.'
  kind: numeric
  answer: 41
  tolerance: 0.001
  id: 013-code-dot-2
  fingerprint: 863fc4ef
- concept: результат скалярного произведения — одно число независимо от размерности входных векторов
  question: Функция вычисляет скалярное произведение двух embedding-векторов размерности 768. Что она возвращает?
  explanation: 'Произведений действительно 768 — по одному на позицию, — но они складываются, и наружу выходит одна величина. Список из 768 произведений (без сложения) — поэлементное умножение, а матрица всех попарных произведений — внешнее произведение; это другие операции. Именно свёртка в скаляр делает скалярное произведение мерой похожести: одно число на пару векторов, которое можно сравнивать и сортировать в поиске.'
  kind: choice
  options:
    - Одно число
    - Вектор из 768 чисел — по одному произведению на каждую позицию
    - Матрицу 768×768 из всех попарных произведений
    - Вектор из 768 чисел, если векторы сонаправлены, и одно число иначе
  correct: 0
