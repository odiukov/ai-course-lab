- concept: 'по значению косинуса нельзя восстановить положение вектора: одному косинусу отвечает бесконечно много векторов'
  question: Косинусная близость между вектором запроса и вектором кандидата равна 0.6. Объясни, почему по этому числу нельзя определить, где именно в пространстве лежит вектор кандидата.
  explanation: 'Косинус выдаёт одно число из двух векторов любой размерности, поэтому информация теряется: и длина, и сторона поворота, и распределение по осям. Практический вывод: одинаковая близость к запросу не значит похожесть кандидатов друг на друга — два кандидата с косинусом 0.6 могут лежать по разные стороны и иметь между собой близость гораздо ниже.'
  kind: open
  reference: '0.6 задаёт только угол между векторами (≈53°), и больше ничего. Векторов, образующих с запросом такой угол, бесконечно много: длина любая (косинус её поделил и выбросил), а направление не одно — косинус чётен, cos(θ) = cos(−θ), поэтому поворот на 53° влево и вправо даёт одно и то же число. В плоскости это уже два разных вектора, в n-мерном пространстве — целый конус направлений вокруг запроса. Косинус — это сжатие пары векторов в одно число, и такое сжатие необратимо.'
  id: 019-cosine-visual-3
  fingerprint: c0ba6565
