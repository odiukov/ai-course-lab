- concept: 'косинус нелинеен по углу: одинаковый прирост угла даёт разное изменение косинуса'
  question: Два ненулевых вектора образуют угол 45°. Один из них поворачивают вокруг начала координат в плоскости этих векторов, пока угол не станет 90°. На сколько уменьшится косинусная близость?
  explanation: 'cos(45°) ≈ 0.707, cos(90°) = 0, падение ≈ 0.707. А поворот на те же 45° из нуля (с 0° до 45°) снижает косинус лишь с 1 до 0.707, то есть на 0.293. Косинус реагирует на угол, но не пропорционально ему: у малых углов он почти плоский, у прямого — падает быстрее всего. Поэтому близость 0.99 и 0.95 в поиске различаются по углу сильнее, чем кажется по разнице чисел.'
  kind: numeric
  answer: 0.707
  tolerance: 0.02
  id: 019-cosine-visual-1
  fingerprint: '26308273'
- concept: 'нормировка на произведение длин не может изменить знак: знаменатель косинуса всегда положителен'
  question: У двух ненулевых векторов скалярное произведение отрицательно. Что можно утверждать о их косинусной близости?
  explanation: Косинус = dot / (|a|·|b|). Длина ненулевого вектора строго больше нуля, значит знаменатель положителен всегда. Деление на положительное число меняет масштаб, но не знак. Поэтому знак косинуса совпадает со знаком скалярного произведения; нормировка убирает влияние длин только на величину.
  kind: choice
  options:
    - Она тоже отрицательна
    - Она положительна, потому что деление на длины переворачивает знак
    - Знак зависит от того, какой из векторов длиннее
    - Она равна нулю
