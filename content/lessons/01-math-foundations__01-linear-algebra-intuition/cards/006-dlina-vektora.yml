- concept: 'нормализация: деление вектора на его длину даёт единичный вектор с тем же направлением'
  question: Два эмбеддинга слов имеют разную магнитуду, но сравнить нужно только направление. Каждую координату каждого вектора делят на длину этого вектора. Что получится?
  explanation: 'Деление на длину масштабирует все координаты в одно и то же число раз: направление сохраняется, а длина становится ровно 1. Такой вектор называют единичным. Именно поэтому косинусная близость сравнивает нормализованные векторы — магнитуда отбрасывается, остаётся только «куда указывает».'
  kind: choice
  options:
    - Вектор той же длины, но развёрнутый в другую сторону
    - Вектор длины 1, направленный туда же, куда исходный
    - Вектор нулевой длины
    - Вектор, у которого все координаты стали одинаковыми
  correct: 1
  id: 006-dlina-vektora-1
  fingerprint: e6d1ffa9
- concept: расстояние между двумя точками равно длине вектора их разности
  question: Два пользователя заданы векторами предпочтений [10, 20] и [16, 28]. Чему равно расстояние между ними?
  explanation: 'Расстояние — это длина вектора разности: [16-10, 28-20] = [6, 8]. Его магнитуда = sqrt(36 + 64) = sqrt(100) = 10. Формула длины работает не только «от начала координат», но и между любыми двумя точками — достаточно сначала вычесть одну из другой.'
  kind: numeric
  answer: 10
  tolerance: 0.05
  id: 006-dlina-vektora-2
  fingerprint: 19d647ea
- concept: длина вектора никогда не больше суммы модулей его координат, равенство только когда ненулевая координата одна
  question: Объясни своими словами, почему длина вектора всегда меньше или равна сумме модулей его координат, и в каком случае они совпадают.
  explanation: 'Ключ — перпендикулярность осей. Для [6, 8] сумма модулей 14, а длина 10: разница и есть «срезанный угол». Совпадение возможно лишь у вектора вида [k, 0] или [0, k]. Это частный случай неравенства треугольника.'
  kind: open
  reference: Координаты — это сдвиги по разным, взаимно перпендикулярным осям. Сумма модулей считает их так, будто все сдвиги идут по одной прямой, друг за другом. Реальное смещение короче, потому что перпендикулярные сдвиги ведут в разные стороны и итоговая точка оказывается ближе, чем суммарный пройденный путь. Формально sqrt(x^2 + y^2) <= |x| + |y|, так как (|x| + |y|)^2 = x^2 + y^2 + 2|x||y|, и лишнее слагаемое 2|x||y| неотрицательно. Равенство наступает ровно тогда, когда 2|x||y| = 0, то есть когда все координаты, кроме одной, нулевые — вектор лежит вдоль оси, и идти «напрямик» некуда.
  id: 006-dlina-vektora-3
  fingerprint: e653aa6b
