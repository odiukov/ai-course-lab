- concept: число обусловленности считается делением максимального сингулярного числа на минимальное
  question: У матрицы признаков наибольшее сингулярное число равно 600, наименьшее — 0.075. Чему равно её число обусловленности κ?
  explanation: 'κ = σ_max / σ_min = 600 / 0.075 = 8000. Такое κ означает: относительная ошибка результата в худшем случае в 8000 раз больше относительной ошибки входа. Например, шум в 0.01% на входе способен дать до 80% отклонения на выходе.'
  kind: numeric
  answer: 8000
  tolerance: 1
  id: 035-pochti-vyrozhdennost-2
  fingerprint: 946a92ec
- concept: плохая обусловленность лечится усечением малых сингулярных направлений или ridge-добавкой, а не увеличением точности вычислений
  question: Матрица признаков имеет κ ≈ 50000. Инженер переводит все вычисления с float32 на float64. Что это даёт?
  explanation: 'κ — свойство самой матрицы, а не арифметики. Двойная точность уменьшает лишь ошибку округления; шум в измерениях, дублирующие признаки и почти совпавшие направления никуда не деваются. Лечат отказом от бесполезных направлений: усечённое SVD выбрасывает компоненты с крошечными σ, ridge-регрессия добавляет к ним λ, чтобы знаменатель перестал быть почти нулевым.'
  kind: choice
  options:
    - 'Уменьшает саму ошибку округления, но не меняет чувствительность задачи: усиление входного шума данных остаётся прежним'
    - Снижает число обусловленности примерно вдвое, так как удваивается разрядность мантиссы
    - Делает наименьшее сингулярное число строго нулевым, и матрица становится неполноранговой
    - 'Полностью устраняет проблему: при двойной точности κ перестаёт влиять на результат'
