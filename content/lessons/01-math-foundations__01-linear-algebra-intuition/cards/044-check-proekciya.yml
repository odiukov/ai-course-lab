- concept: проекция на направление с одинаковыми координатами заменяет все координаты их средним арифметическим
  question: Вектор [5, 9, 13, 25] проецируют на направление, у которого все координаты равны между собой и отличны от нуля. Чему равна каждая координата получившегося вектора-проекции?
  explanation: 'Для направления из равных координат c коэффициент равен (сумма координат)/(n·c), а после умножения на само направление c сокращается: каждая координата проекции = среднее арифметическое. (5+9+13+25)/4 = 52/4 = 13, проекция = [13, 13, 13, 13]. Поэтому проецирование на диагональ — это ровно усреднение координат: у [1, 2, 3] на диагонали получается [2, 2, 2].'
  kind: numeric
  answer: 13
  tolerance: 0.01
  id: 044-check-proekciya-1
  fingerprint: 36599de7
- concept: отрицательный коэффициент проекции означает, что проекция направлена против опорного вектора
  question: Проецируют a = [4, -9] на b = [7, 5]. Скалярное произведение выходит отрицательным, значит и коэффициент отрицателен. Что это говорит о проекции?
  explanation: 'a·b = 28 − 45 = −17, b·b = 74, коэффициент ≈ −0.23. Знаменатель b·b всегда положителен, поэтому знак коэффициента = знак скалярного произведения. Отрицательный коэффициент — законный результат: проекция остаётся на прямой b, но смотрит навстречу b. Длина остатка со знаком никак не связана.'
  kind: choice
  options:
    - 'Вектор-проекция лежит на той же прямой, но направлен в сторону, противоположную b: угол между a и b тупой'
    - 'Проекция посчитана неверно: коэффициент проекции не может быть отрицательным'
    - Проекция получилась нулевой, потому что отрицательный вклад гасит положительный
    - Знак означает, что остаток длиннее самой проекции
