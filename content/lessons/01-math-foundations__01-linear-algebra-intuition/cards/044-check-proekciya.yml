- concept: проекция на координатную ось оставляет одну координату и обнуляет остальные, то есть координаты вектора и есть его проекции на оси
  question: Объясни своими словами, что получится при проекции вектора [7, -4, 9] на вторую координатную ось, и какой вывод это даёт про смысл координат вектора.
  explanation: 'Проекция на ось — простейший случай общей формулы: делитель равен единице, скалярное произведение = одна координата. Отсюда видно, зачем нужны ортонормированные направления: по ним коэффициенты читаются напрямую, без деления и без взаимного влияния осей.'
  kind: open
  reference: 'Направление второй оси — единичный вектор с единицей на второй позиции. Скалярное произведение с ним вытаскивает ровно вторую координату (−4), квадрат длины оси равен единице, поэтому коэффициент = −4, а вектор-проекция имеет −4 на второй позиции и нули на остальных. Вывод: сами координаты вектора — это коэффициенты его проекций на оси, а запись вектора списком чисел = разложение его на проекции по взаимно перпендикулярным направлениям.'
  id: 044-check-proekciya-3
  fingerprint: c97404b6
