- concept: модуль определителя — коэффициент изменения площади, знак — переворот ориентации плоскости
  question: Линейное преобразование плоскости задано матрицей с определителем −8. Фигура площадью 5 подаётся на вход. Что произойдёт?
  explanation: 'Модуль определителя — во сколько раз меняется площадь: 5·|−8| = 40. Площадь отрицательной не бывает. Знак отвечает за ориентацию: минус означает зеркальный переворот плоскости. Необратимость даёт только нулевой определитель, а не отрицательный.'
  kind: choice
  options:
    - Площадь образа станет 40, и ориентация фигуры перевернётся, как при отражении
    - 'Площадь образа станет −40: отрицательная площадь и означает отражение'
    - 'Площадь станет 40, ориентация сохранится: знак определителя ни на что не влияет'
    - Преобразование необратимо, потому что определитель отрицательный
