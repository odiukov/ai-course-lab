- concept: пропорциональность столбцов обнуляет определитель, что означает зависимость столбцов и потерю ранга
  question: У матрицы из двух строк и двух столбцов второй столбец получен умножением первого на три. Что верно про такую матрицу?
  explanation: 'Пусть первый столбец (a, c), тогда второй — (3a, 3c). det = a·3c − 3a·c = 0. Столбец-копия не добавляет нового направления: образ схлопывается в прямую, восстановить вход по выходу нечем.'
  kind: choice
  options:
