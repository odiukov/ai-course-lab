- concept: градиент скалярного произведения по одному вектору равен другому вектору
  question: Даны векторы x = [4, -7, 9, 0.5] и y = [6, 8, -5, 20]. Чему равна сумма всех компонент градиента d(x·y)/dx?
  explanation: 'В сумме x₁y₁ + x₂y₂ + ... каждая координата xᵢ входит ровно раз, в паре с yᵢ, значит частная производная по xᵢ равна yᵢ. Весь градиент — это вектор y, а не x. Сумма его компонент: 6 + 8 - 5 + 20 = 29. Если бы спросили градиент по y, ответом был бы вектор x.'
  kind: numeric
  answer: 29
  tolerance: 0.01
  id: 052-pytorch-gradient-1
  fingerprint: d55533d2
- concept: autodiff считает производные по записанному графу операций, а не по выведенной вручную формуле
  question: Почему PyTorch может посчитать градиенты для произвольной модели, хотя никто не выводил для неё формулу производной?
  explanation: 'Autodiff: для каждой элементарной операции производная известна заранее, а обратный проход склеивает их цепным правилом. Поэтому работает любая комбинация операций, хоть сотня слоёв. Численное дифференцирование потребовало бы по одному прогону на каждый параметр — для миллиардов весов нереально.'
  kind: choice
  options:
    - Он численно подбирает производную, много раз пересчитывая выход при малых сдвигах каждого веса
    - Он запоминает, из каких элементарных операций собран результат, и применяет цепное правило, идя по этой цепочке назад
    - Он ищет символьную формулу всей модели целиком и дифференцирует её алгебраически
    - Он хранит таблицу готовых градиентов для всех известных архитектур нейросетей
  correct: 1
  id: 052-pytorch-gradient-2
  fingerprint: 89657d43
- concept: порядок шагов получения градиента в PyTorch
  question: Расставьте шаги получения градиента скалярной величины по входному тензору в PyTorch.
  explanation: Без requires_grad=True граф не пишется и .grad останется None. backward() вызывают на скаляре — иначе нужно явно передавать вектор весов. Градиент попадает не в результат, а во входной тензор-лист.
  kind: order
  items:
    - Создать входной тензор с requires_grad=True, чтобы операции с ним записывались
    - Выполнить операции и получить скалярный результат (граф вычислений построен)
    - Вызвать .backward() на этом скаляре — обратный проход по графу
    - Прочитать накопленный градиент из атрибута .grad входного тензора
  id: 052-pytorch-gradient-3
  fingerprint: cbcc0b7c
