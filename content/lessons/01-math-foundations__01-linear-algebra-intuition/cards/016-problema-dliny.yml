- concept: коллинеарные кандидаты разной длины получают разный сырой dot при одинаковом направлении к запросу
  question: 'Вектор запроса q = [7, 2]. Два кандидата: u = [2, 6] и v = [4, 12]. Что можно сказать о их скалярных произведениях с q и о их похожести на запрос?'
  explanation: v = 2u, направление идентично, значит по похожести кандидаты неразличимы. Но dot(q,u) = 14 + 12 = 26, а dot(q,v) = 28 + 24 = 52. Сырое произведение выросло ровно во столько раз, во сколько выросла длина. Ранжирование по нему — ранжирование по длине.
  kind: choice
  options:
    - dot(q, v) вдвое больше dot(q, u), хотя направление у u и v одно и то же
    - dot(q, u) = dot(q, v), потому что направление у кандидатов совпадает
    - dot(q, v) вдвое больше, потому что v направлен ближе к q
    - оба произведения отрицательны, так как кандидаты уходят вверх
  correct: 0
  id: 016-problema-dliny-1
  fingerprint: 83bfbcd7
- concept: менее сонаправленный, но более длинный кандидат обгоняет идеально сонаправленного по сырому скалярному произведению
  question: Запрос q = [3, 4]. Кандидат a = [6, 8] направлен точно так же, как q. Кандидат b = [12, 7] отклонён от q. На сколько скалярное произведение q·b больше q·a?
  explanation: 'q·a = 18 + 32 = 50, q·b = 36 + 28 = 64, разница 14. Идеально сонаправленный кандидат проиграл: b длиннее. Порядок по сырому dot не совпадает с порядком по направлению.'
  kind: numeric
  answer: 14
  tolerance: 0.01
  id: 016-problema-dliny-2
  fingerprint: 9700162a
- concept: длина эмбеддинга зависит от посторонних факторов (объём документа, популярность), поэтому ранжирование по сырому dot даёт систематический перекос
  question: Поиск по базе документов ранжирует результаты сырым скалярным произведением эмбеддинга запроса и эмбеддингов документов. Объясни своими словами, почему такая выдача будет систематически смещённой, и что именно надо изменить.
  explanation: Ключ — разделить два источника величины произведения. Сигнал похожести сидит в направлении, длина — шум ранжирования.
  kind: open
  reference: 'Скалярное произведение растёт от двух причин сразу: от совпадения направлений и от длин векторов. Длина эмбеддинга в реальных данных зависит от вещей, не связанных со смыслом запроса — объёма документа, частотности, популярности объекта. Поэтому длинный или «громкий» документ обгонит короткий, но точно подходящий, и одни и те же объекты будут всплывать на любой запрос. Смещение системное, а не случайное. Лечится удалением вклада длины: сравнивать надо только направление.'
  id: 016-problema-dliny-3
  fingerprint: 6b1333b6
