- concept: перпендикулярность — это взаимное погашение вкладов по позициям, а не малая длина векторов
  question: Даны векторы a = [4, 7] и b = [14, x]. При каком x векторы перпендикулярны?
  explanation: 'Перпендикулярность значит скалярное произведение равно нулю: 4×14 + 7×x = 0, то есть 56 + 7x = 0, x = −8. Ноль получается не из-за коротких векторов — здесь b длинный, — а из-за того, что положительный вклад 56 гасится отрицательным −56.'
  kind: numeric
  answer: -8
  tolerance: 0.01
  id: 014-znak-dot-2
  fingerprint: 9c490423
- concept: модуль скалярного произведения зависит от длин векторов, поэтому для сравнения похожести его нормируют на длины (косинус)
  question: Поисковая система ранжирует документы по скалярному произведению их векторов с вектором запроса. Почему длинный документ может обогнать более релевантный короткий, и как это чинят?
  explanation: 'Знак скалярного произведения зависит только от направления, а его величина — ещё и от длин. Поэтому для сравнения «насколько похоже» берут косинусную близость: скалярное произведение, делённое на произведение длин, всегда лежит в отрезке от −1 до 1.'
  kind: open
  reference: 'Скалярное произведение растёт вместе с длинами векторов: a·b = |a|×|b|×cos(угол). Если у документа большая норма, его произведение с запросом велико даже при посредственном совпадении направлений. Знак при этом остаётся честным индикатором (по пути / поперёк / навстречу), а вот величина смешивает направление и масштаб. Чинят нормализацией: делят на длины обоих векторов и сравнивают косинусную близость, либо заранее приводят все embeddings к единичной длине — тогда скалярное произведение и косинус совпадают.'
  id: 014-znak-dot-3
  fingerprint: 9896be20
