- concept: вырожденная матрица склеивает разные векторы в один, поэтому вход по выходу не восстановим
  question: Квадратная матрица второго порядка имеет нулевой определитель. Что это означает для преобразования, которое она задаёт?
  explanation: Обратимость и есть возможность однозначно вернуться назад. Нулевой определитель значит, что столбцы зависимы, образ — прямая или точка, и целое семейство разных входов схлопывается в один выход. Информация потеряна навсегда, обратной матрицы не существует.
  kind: choice
  options:
    - 'Преобразование сжимает всю плоскость на прямую (или в точку): разные исходные векторы дают одинаковый результат, и вход по выходу не восстановить'
    - Преобразование сохраняет все длины, но поворачивает плоскость на прямой угол
    - Преобразование обратимо, но обратная матрица считается по другой формуле
    - Преобразование переводит любой вектор в вектор той же длины с противоположным знаком
  correct: 0
  id: 038-code-is-invertible-1
  fingerprint: 41a3db7d
- concept: умножение матрицы второго порядка на скаляр k умножает определитель на k в квадрате
  question: У матрицы второго порядка определитель равен 7. Каждый её элемент умножили на 3. Чему равен определитель новой матрицы?
  explanation: 'Скаляр выносится из каждой из двух строк: det(kM) = k²·det(M). Здесь 3²·7 = 63. Заодно видно: при ненулевом k обратимость не меняется — ноль остаётся нулём, ненулевое остаётся ненулевым.'
  kind: numeric
  answer: 63
  tolerance: 0.01
  id: 038-code-is-invertible-2
  fingerprint: 3ea16fa8
- concept: вырожденность в вычислениях с плавающей точкой определяют порогом на модуль определителя, а не точным равенством нулю
  question: Дополни предикат обратимости так, чтобы он не ломался на арифметике с плавающей точкой, где определитель зависимой матрицы выходит не ровным нулём, а крошечным числом любого знака.
  explanation: 'Проверка det != 0 почти всегда возвращает True: округление даёт остаток вроде 1e-17. Порог нужен по модулю, потому что определитель бывает отрицательным, и просто det > 1e-9 объявило бы необратимой любую матрицу с отрицательным определителем.'
  kind: cloze
  template: |-
    det = a*d - b*c
    return ___ > 1e-9
  answer: abs(det)
  accept:
    - abs(det)
    - math.fabs(det)
    - fabs(det)
    - abs( det )
  id: 038-code-is-invertible-3
  fingerprint: 9e812f9a
