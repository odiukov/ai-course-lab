- concept: почти точная линейная зависимость признаков даёт единственное, но неустойчивое решение, и лечится удалением признака или регуляризацией
  question: Признаки не совпадают в точности, но коррелируют с коэффициентом 0.998. Объясни своими словами, чем такая ситуация отличается от точного дублирования и почему коэффициентам модели всё равно нельзя доверять.
  explanation: 'Ключевое различие: точная зависимость — неоднозначность (бесконечно много решений), почти точная — неустойчивость (решение одно, но зависит от шума). В обоих случаях страдает интерпретация коэффициентов, а не обязательно качество прогноза; и алгоритм не обязан падать с ошибкой.'
  kind: open
  reference: 'При точной зависимости решений бесконечно много: данные фиксируют только сумму весов. При почти точной зависимости единственное решение формально существует — маленькая разница между столбцами «выбирает» одно из них. Но эта разница крошечная, и решение опирается почти на шум: при добавлении новых наблюдений или мелком изменении данных отдельные веса могут скакнуть в разы и даже поменять знак, хотя суммарный прогноз останется почти тем же. Поэтому интерпретировать отдельные коэффициенты нельзя. Лечение: убрать один из зависимых признаков или применить регуляризацию, которая делает выбор разбивки однозначным.'
