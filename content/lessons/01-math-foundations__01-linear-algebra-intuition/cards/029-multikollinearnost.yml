- concept: любая пара весов с той же суммой на дублирующихся признаках даёт тот же прогноз — от чего восстанавливается второй вес
  question: 'Два признака в таблице совпадают: x1 = x2. Модель нашла веса w1 = 11 и w2 = 4. Коллега переобучил модель и получил w1 = 20. Какое значение w2 даёт ровно такой же прогноз на всех обучающих объектах?'
  explanation: 'Прогноз зависит только от суммы: 11 + 4 = 15. Значит при w1 = 20 нужно w2 = 15 − 20 = −5. Отрицательный вес у признака с положительным смыслом — типичный симптом мультиколлинеарности, а не содержательный вывод о признаке.'
  kind: numeric
  answer: -5
  tolerance: 0.001
