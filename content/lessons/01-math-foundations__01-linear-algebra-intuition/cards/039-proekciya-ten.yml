- concept: проекция считается по формуле (a·b/b·b)·b, коэффициент — отношение скалярных произведений
  question: Вектор a = [4, 7] проецируется на направление b = [1, 1]. Чему равна первая координата вектора-проекции?
  explanation: a·b = 4·1 + 7·1 = 11, b·b = 1 + 1 = 2. Коэффициент 11/2 = 5.5, проекция = 5.5·[1, 1] = [5.5, 5.5]. Первая координата 5.5. Проекция обязана лежать на линии b, поэтому обе её координаты равны.
  kind: numeric
  answer: 5.5
  tolerance: 0.01
  id: 039-proekciya-ten-1
  fingerprint: 68d2de8f
- concept: остаток a - proj_b(a) ортогонален направлению b, что даёт нулевое скалярное произведение остатка с b
  question: Вектор a разложили на проекцию на b и остаток r = a - proj_b(a). Что гарантированно верно про r?
  explanation: 'Проекция — ближайшая к концу a точка на линии b, поэтому остаток перпендикулярен этой линии: r·b = 0. Проверка: a=[4,7], b=[1,1], proj=[5.5,5.5], r=[-1.5,1.5], r·b = -1.5+1.5 = 0. Длина остатка при этом может быть любой — хоть больше проекции. Именно на этой ортогональности стоит метод наименьших квадратов: ошибка регрессии перпендикулярна пространству столбцов.'
  kind: choice
  options:
    - r · b = 0 при любом ненулевом b
    - r всегда короче проекции
    - r направлен так же, как b, но имеет меньшую длину
    - r равен нулю, если a и b одинаковой длины
  correct: 0
  id: 039-proekciya-ten-2
  fingerprint: 01ff2f1d
- concept: 'проекция зависит только от направления b, а не от его длины: замена b на k·b даёт тот же вектор-проекцию'
  question: Объясни своими словами, почему проекция вектора a на b и проекция того же a на вектор 10·b — это один и тот же вектор.
  explanation: 'Знаменатель b·b и нужен, чтобы убрать масштаб b. Если бы формулу написали как (a·b)·b без деления, растяжение b в 10 раз раздуло бы результат в 100 раз, и проекция перестала бы быть точкой на линии, ближайшей к a. Частный случай: для единичного b знаменатель равен 1, и коэффициент совпадает со скалярным произведением.'
  kind: open
  reference: 'В формуле (a·b / b·b)·b замена b на k·b умножает числитель на k, знаменатель на k², а последний множитель на k: k·k / k² = 1, множители сокращаются. Геометрически b задаёт только линию, вдоль которой меряем; проекция — ближайшая точка на этой линии к концу a, а линия от растяжения b не меняется. Поэтому в проекции важно направление b, а его длина нормируется знаменателем b·b.'
  id: 039-proekciya-ten-3
  fingerprint: c5f1e19f
