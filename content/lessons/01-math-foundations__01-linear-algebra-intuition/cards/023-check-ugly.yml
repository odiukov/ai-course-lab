- concept: 'модуль косинуса задаёт отклонение от прямого угла, а знак — сторону: значения ±c дают углы, симметричные относительно прямого'
  question: Косинусная близость двух ненулевых векторов равна −0.5. Чему равен угол между ними в градусах?
  explanation: 'arccos(−0.5) = 120 градусов. У пары с косинусом +0.5 угол 60 градусов: одинаковый модуль косинуса даёт одинаковое отклонение от прямого угла, а знак решает, в какую сторону — острый угол или тупой. Сумма этих двух углов даёт развёрнутый.'
  kind: numeric
  answer: 120
  tolerance: 0.5
