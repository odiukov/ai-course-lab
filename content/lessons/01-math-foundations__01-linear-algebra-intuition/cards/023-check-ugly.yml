- concept: 'ортонормированность — два независимых условия: попарная перпендикулярность и единичные длины; одного условия мало'
  question: Набор из 4 векторов размерности 6 прогнали через Gram-Schmidt. Объясни своими словами, что именно надо проверить, чтобы утверждать «набор ортонормирован», и почему одной проверки не хватает.
  explanation: 'Слово «ортонормированный» склеивает два требования: «орто» — перпендикулярность каждой пары, «нормированный» — единичная длина каждого вектора. Растяжение вектора рвёт второе условие, не задевая первое, поэтому одна проверка другую не заменяет.'
  kind: open
  reference: 'Проверок две, и они независимы. Первая — все попарные скалярные произведения обнуляются: для 4 векторов это 6 пар, каждая должна давать перпендикулярность. Вторая — длина каждого вектора равна единице. Ортогональный набор легко сделать неединичным (растянуть любой вектор — углы не изменятся, потому что косинус от масштаба не зависит), а набор единичных векторов легко сделать неперпендикулярным. Оба сравнения ведут с допуском: арифметика с плавающей точкой не даёт точных значений.'
