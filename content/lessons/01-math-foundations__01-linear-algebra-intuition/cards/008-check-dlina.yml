- concept: нулевая длина возможна только у вектора, у которого каждая координата равна нулю
  question: 'Про вектор из 1024 чисел известно только одно: его длина равна 0. Что из этого следует про сами числа и почему?'
  explanation: 'Ключ в том, что квадраты не бывают отрицательными: погашения, как при обычном сложении (например, +7 и -7), тут не происходит. Нулевой вектор — единственный вектор нулевой длины, и направления у него нет. Отсюда же практический вывод: если норма градиента строго ноль, значит обнулились все компоненты, а не «они скомпенсировались».'
  kind: open
  reference: Все 1024 координаты равны нулю. Длина равна sqrt(сумма квадратов), квадрат любого числа неотрицателен, поэтому сумма квадратов равна нулю только когда каждое слагаемое ноль, то есть каждая координата ноль. Одна ненулевая координата уже даёт положительную длину, и «взаимно погасить» друг друга координаты не могут — в формулу входят квадраты, а не сами числа со знаками.
  id: 008-check-dlina-2
  fingerprint: a880607a
- concept: нулевые координаты не влияют на длину, поэтому дополнение вектора нулями (padding) её не меняет
  question: 'Вектор [24, 7] дополнили нулями до четырёх координат: [24, 0, 7, 0]. Чему равна длина получившегося вектора?'
  explanation: sqrt(24^2 + 0 + 7^2 + 0) = sqrt(576+49) = sqrt(625) = 25 — ровно столько же, сколько у исходного [24, 7]. Нулевая координата добавляет к сумме квадратов ноль. Практически это значит, что padding векторов нулями до общей размерности не искажает их норму, а число координат само по себе о длине ничего не говорит.
  kind: numeric
  answer: 25
  tolerance: 0.05
  id: 008-check-dlina-3
  fingerprint: 2d4417c1
