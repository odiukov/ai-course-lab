- concept: для угла достаточно скалярного произведения и двух длин — сами координаты векторов знать не нужно
  question: 'О двух векторах известно только это: их скалярное произведение равно 65, длина первого равна 10, длина второго равна 13. Чему равен угол между ними в градусах?'
  explanation: 'Косинус угла равен 65/(10*13) = 0.5, а acos(0.5) даёт 60 градусов. Координаты не нужны: угол — функция трёх скалярных величин (скалярного произведения и двух длин), поэтому бесконечно много разных пар векторов с такими же тремя числами дадут ровно тот же угол.'
