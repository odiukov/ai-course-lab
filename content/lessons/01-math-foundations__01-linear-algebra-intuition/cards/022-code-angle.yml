- concept: 'угол между векторами ненаправленный: он неотрицателен и не различает, в какую сторону поворачивать от одного вектора к другому'
  question: Объясни своими словами, почему функция, возвращающая угол между двумя векторами через acos, никогда не выдаёт отрицательного значения и почему её результат не меняется при перестановке аргументов.
  explanation: 'Ключ в том, что acos — функция одного числа, а это число симметрично по векторам. Если задача требует знака поворота (ориентации), угла через acos недостаточно: в плоскости для этого берут знак определителя пары векторов или atan2.'
  kind: open
  reference: 'acos возвращает значения от нуля до пи радиан, то есть от нулевого до развёрнутого угла, поэтому отрицательного результата быть не может. А аргумент acos — это скалярное произведение, делённое на произведение длин; и скалярное произведение, и произведение длин не зависят от порядка векторов, значит косинус, а с ним и угол, симметричны. Плата за это: информация о стороне поворота теряется — угол показывает только расхождение направлений, но не отвечает, поворачивать от первого вектора ко второму по часовой стрелке или против.'
  id: 022-code-angle-3
