  question: Поиск отсортировал кандидатов по косинусной близости к запросу, от большей к меньшей. Что произойдёт с порядком, если вместо косинуса считать угол в градусах?
  explanation: 'arccos строго убывает на всём [-1, 1]: больший косинус всегда даёт меньший угол. Нелинейность меняет расстояния между значениями, но не их порядок, поэтому топ-K не меняется — меняется лишь направление сортировки.'
