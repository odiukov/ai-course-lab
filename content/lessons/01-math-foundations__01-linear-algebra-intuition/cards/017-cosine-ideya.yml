- concept: косинусная близость не определена для нулевого вектора, хотя скалярное произведение с ним считается нормально
  question: Объясни своими словами, что произойдёт при вычислении косинусной близости, если один из аргументов — вектор из одних нулей, и почему со скалярным произведением такой проблемы нет.
  explanation: 'Косинус — это про направление, а у нулевого вектора направления нет: формула упирается в деление на ноль. Сырое скалярное произведение деления не содержит и честно даёт ноль. Практический вывод: пустые или отфильтрованные до нуля эмбеддинги нужно отсекать до вычисления косинуса.'
  kind: open
  reference: 'Длина нулевого вектора равна нулю, поэтому знаменатель ‖a‖·‖b‖ обращается в ноль и косинусная близость не определена: у нулевого вектора нет направления, а значит нет и угла, косинус которого можно взять. Скалярное произведение с нулевым вектором считается без проблем и просто равно нулю — там нет деления. Поэтому в коде перед делением нужна проверка на нулевую длину: вернуть 0 или сигнал об ошибке вместо деления на ноль (в Python это ZeroDivisionError, в numpy — nan).'
  id: 017-cosine-ideya-3
