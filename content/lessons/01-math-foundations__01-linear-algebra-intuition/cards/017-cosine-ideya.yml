- concept: 'косинусная близость не меняется при растяжении одного из векторов: она зависит только от угла'
  question: Вектор a = [3, 4], вектор b = [40, 30]. Чему равна косинусная близость a и b?
  explanation: 'dot(a, b) = 3×40 + 4×30 = 240, ‖a‖ = 5, ‖b‖ = 50, значит 240 / (5×50) = 0.96. Заметь: b = 10 × [4, 3], и косинус для [4, 3] тот же 0.96 — деление на длины гасит масштаб, остаётся только угол. Сырое скалярное произведение при этом выросло бы с 24 до 240.'
  kind: numeric
  answer: 0.96
  tolerance: 0.01
  id: 017-cosine-ideya-1
  fingerprint: e4bb8ff0
- concept: для векторов единичной длины косинусная близость численно совпадает с сырым скалярным произведением, потому что знаменатель равен единице
  question: Векторное хранилище заранее приводит все эмбеддинги к единичной длине. Что после этого верно для пары таких векторов?
  explanation: cos_sim(a, b) = dot(a, b) / (‖a‖·‖b‖). Если ‖a‖ = ‖b‖ = 1, знаменатель равен 1, и косинус совпадает с сырым скалярным произведением. Поэтому хранилища нормируют векторы один раз при записи, а на каждом поиске считают только dot — деление уже сделано заранее.
  kind: choice
  options:
    - Косинусная близость равна их скалярному произведению, потому что произведение длин в знаменателе равно единице
    - Косинусная близость равна нулю, так как единичные векторы всегда перпендикулярны
    - Косинусная близость становится равной сумме координат обоих векторов
    - Косинусная близость перестаёт быть определённой и её нужно считать по углу отдельно
