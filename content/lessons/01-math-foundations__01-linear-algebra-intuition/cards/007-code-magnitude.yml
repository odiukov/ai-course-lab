- concept: при умножении вектора на скаляр длина умножается на модуль скаляра, знак на длину не влияет
  question: Длина вектора w равна 12. Чему равна длина вектора −7·w?
  explanation: 'Каждая координата умножается на −7, значит каждый квадрат — на 49, а сумма квадратов — на 49. Корень даёт |−7|·12 = 84. Знак минус под квадратом исчезает: длина всегда неотрицательна, поэтому масштабируется модуль скаляра, а не сам скаляр.'
  kind: numeric
  answer: 84
  tolerance: 0.01
  id: 007-code-magnitude-1
  fingerprint: 06c30313
- concept: длина вектора не меняется при перестановке координат, хотя точка при этом другая
  question: Даны v = [6, 8, 9] и u = [9, 6, 8]. Что верно про их длины?
  explanation: 'Длина считается по сумме квадратов всех координат, а сумма от порядка слагаемых не зависит: 36+64+81 в обоих случаях. Это разные точки пространства (u ≠ v), но одинаково удалённые от начала координат.'
  kind: choice
  options:
    - Длины равны
    - Длина u больше, потому что первая координата больше
    - Длина v больше, потому что наибольшая координата стоит последней
    - Сравнить нельзя без нормализации
  correct: 0
  id: 007-code-magnitude-2
  fingerprint: f13c5d2b
- concept: скалярное произведение вектора на самого себя равно квадрату его длины
  question: Скалярное произведение вектора v на самого себя равно 169. Чему равна длина v?
  explanation: v·v = v₁·v₁ + v₂·v₂ + … = сумма квадратов координат, то есть ровно то, что стоит под корнем в формуле длины. Значит ‖v‖ = sqrt(169) = 13. Из-за этого в коде длину часто считают через уже написанное скалярное произведение, а не отдельным циклом.
  kind: numeric
  answer: 13
  tolerance: 0.01
  id: 007-code-magnitude-3
  fingerprint: a9569302
