- concept: 'порядок действий процесса Грама–Шмидта: нормировка первого, затем цикл «вычесть проекции на все готовые направления, нормировать остаток»'
  question: Расставь шаги процесса Грама–Шмидта для набора независимых векторов a, b, c в правильном порядке.
  explanation: 'Схема одна и та же для каждого следующего вектора: сначала очистка от всего, что уже представлено готовыми направлениями (вычитание проекций), потом деление на длину. Нормировка идёт после вычитания, а не до: делить нужно длину именно остатка, иначе результат не будет единичным.'
  kind: order
  items:
    - Разделить a на его длину и получить первое направление единичной длины
    - Вычесть из b его проекцию на первое готовое направление
    - Разделить полученный остаток на его длину и получить второе направление
    - Вычесть из c его проекции на оба уже готовых направления
    - Разделить остаток c на его длину и получить третье направление
  id: 045-gram-schmidt-1
  fingerprint: ac5e66bb
- concept: 'линейно зависимый вход ломает Грама–Шмидта: остаток обращается в нулевой вектор и нормировка невозможна'
  question: На вход процессу Грама–Шмидта подали набор из 5 векторов, в котором пятый равен сумме второго и четвёртого. Что произойдёт на пятом шаге?
  explanation: 'Пятый вектор целиком лежит в пространстве, натянутом на предыдущие, поэтому вычитание проекций убирает из него всё и оставляет нуль. Длина нуля равна нулю, деления нет. Именно поэтому требование линейной независимости входа — не формальность: на нём держится последний шаг. На практике при почти зависимых векторах остаток крошечный, и нормировка резко усиливает шум округления.'
  kind: choice
  options:
    - Остаток после вычитания проекций окажется нулевым вектором, и деление на его длину невозможно
    - Пятое направление получится, но не будет перпендикулярно четвёртому
    - Алгоритм вернёт пятый вектор без изменений, потому что вычитать нечего
    - Все пять направлений получатся корректными, но их длины будут больше единицы
  correct: 0
  id: 045-gram-schmidt-2
  fingerprint: d905c96f
- concept: каждый очередной вектор очищается от проекций на ВСЕ ранее полученные направления, а не только на непосредственно предыдущее
  question: При построении четвёртого направления инженер вычел из вектора только проекцию на третье готовое направление, а проекции на первые два не тронул. Какой будет результат?
  explanation: Вычитание проекции гасит компоненту вдоль ровно того направления, на которое проецировали. Перпендикулярность первых трёх направлений между собой ничего не говорит о компонентах нового вектора вдоль них — эти компоненты независимы и остаются нетронутыми. Поэтому на k-м шаге вычитают k−1 проекцию, а не одну.
  kind: choice
  options:
    - Результат перпендикулярен третьему направлению, но, вообще говоря, не перпендикулярен первым двум — базис не ортонормированный
    - Результат будет перпендикулярен всем трём, потому что первые три уже взаимно перпендикулярны
    - Результат окажется нулевым вектором
    - Результат перпендикулярен первым двум, но не третьему
  correct: 0
  id: 045-gram-schmidt-3
