- concept: R верхнетреугольная, потому что k-й столбец A выражается только через первые k ортонормированных направлений
  question: Почему матрица R в QR-разложении верхнетреугольная (нули ниже главной диагонали)?
  explanation: 'Ортогонализация идёт по порядку: направление номер k получается из столбцов 1..k. Значит, столбец k матрицы A не содержит вклада направлений с номерами больше k — эти элементы R равны нулю. Треугольность и делает применение R дешёвым: систему Rx = Qᵀb решают обратной подстановкой.'
  kind: choice
  options:
    - 'Потому что k-е ортонормированное направление строится из первых k столбцов A, и обратно: k-й столбец A выражается только через первые k направлений'
    - Потому что треугольную матрицу быстрее умножать, и библиотеки специально обнуляют мелкие элементы
    - Потому что столбцы Q ортонормированы, а у любой матрицы с ортонормированными столбцами произведение с ней треугольное
    - Потому что R хранит длины векторов, а длины неотрицательны и сортируются по убыванию
  correct: 0
