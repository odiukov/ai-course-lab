- concept: диагональный элемент R — длина остатка на своём шаге, поэтому R[0][0] равен длине первого столбца A
  question: Первый столбец матрицы A равен [3, 4]. Чему равен элемент R[0][0] в разложении A = QR (при обычном соглашении о положительной диагонали)?
  explanation: 'Первое ортонормированное направление — это первый столбец, поделённый на его длину. Значит, обратно столбец = длина * направление, и коэффициент R[0][0] — та самая длина: sqrt(9+16)=5. Остальные диагональные элементы R — длины остатков после вычитания проекций; ноль на диагонали означает линейную зависимость столбцов.'
  kind: numeric
  answer: 5
  tolerance: 0.01
