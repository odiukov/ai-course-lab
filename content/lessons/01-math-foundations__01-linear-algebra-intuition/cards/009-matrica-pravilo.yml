- concept: 'линейность преобразования: результат для растянутого вектора растягивается во столько же раз, M(kv)=kM(v)'
  question: Матрица M переводит вектор v в вектор [11, 13]. Чему равна первая координата вектора, который получится, если применить ту же матрицу M к вектору 8v?
  explanation: 'Матричное преобразование линейно: M(8v) = 8·M(v) = 8·[11, 13] = [88, 104]. Правило одно и то же для всех входов, поэтому растяжение входа даёт ровно такое же растяжение выхода — отдельно пересчитывать преобразование не нужно.'
  kind: numeric
  answer: 88
  tolerance: 0.01
  id: 009-matrica-pravilo-1
  fingerprint: f63f6c15
- concept: столбцы матрицы — это образы базисных векторов осей
  question: Что содержат столбцы матрицы преобразования?
  explanation: 'Матрица задаётся тем, куда она отправляет базисные векторы осей: их образы и записаны столбцами. Любой другой вектор — комбинация базисных, поэтому его образ собирается из столбцов с теми же коэффициентами. Отсюда и правило умножения матрицы на вектор.'
  kind: choice
  options:
    - Координаты векторов, в которые преобразование переводит единичные векторы вдоль осей
    - Координаты точки, которую нужно преобразовать
    - Длины всех векторов, к которым матрица уже применялась
    - Среднее значение координат входных векторов
  correct: 0
