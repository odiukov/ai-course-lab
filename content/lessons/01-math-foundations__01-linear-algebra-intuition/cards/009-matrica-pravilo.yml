- concept: 'композиция: два последовательных преобразования сворачиваются в одну матрицу-произведение'
  question: Модель применяет к вектору сначала преобразование A, затем преобразование B. Расставь шаги, чтобы заменить эту пару одним преобразованием.
  explanation: 'Цепочка преобразований сама является преобразованием, и её матрица — произведение исходных. Порядок множителей обратен порядку применения: сначала действует A, поэтому она стоит справа и первой встречает вектор. Именно так слои сети с линейными весами схлопываются в одну матрицу, если между ними нет нелинейности.'
  kind: order
  items:
    - Записать матрицу A — правило первого преобразования
    - Записать матрицу B — правило второго преобразования
    - Перемножить матрицы, поставив B слева от A (то есть BA)
    - Применить полученную матрицу BA к вектору — результат совпадёт с последовательным применением A, потом B
  id: 009-matrica-pravilo-3
