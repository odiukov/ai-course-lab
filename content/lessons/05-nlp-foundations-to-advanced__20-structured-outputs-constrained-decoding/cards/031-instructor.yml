- concept: валидация с ограниченным числом повторов не гарантирует получение корректного объекта
  question: Модель при каждой попытке возвращает объект, нарушающий ограничение Pydantic. Что произойдёт, когда Instructor исчерпает разрешённые повторы?
  explanation: 'Instructor может лишь повторно запросить исправленный ответ. Если все попытки снова нарушают схему, корректный объект получить не удастся: повторы повышают вероятность успеха, но не дают безусловной гарантии.'
  kind: choice
  options:
    - Instructor автоматически ослабит ограничение схемы
    - Вызов завершится ошибкой валидации, не вернув корректный объект
    - Pydantic заменит недопустимое значение ближайшим допустимым
    - Instructor запретит модели генерировать проблемный токен задним числом
  correct: 1
  id: 031-instructor-1
  fingerprint: 37b961a1
- concept: повторная генерация увеличивает хвостовую задержку и стоимость запроса
  question: Почему у двух одинаковых вызовов через Instructor могут заметно различаться стоимость и время ответа?
  explanation: Успешный первый ответ требует одного обращения, а ошибка валидации запускает новый цикл генерации. Каждый такой цикл добавляет токены, сетевое ожидание и вычисления провайдера.
  kind: choice
  options:
    - Pydantic случайным образом меняет схему перед каждым вызовом
    - При ошибке валидации Instructor выполняет дополнительные обращения к модели
    - Instructor всегда запускает несколько провайдеров одновременно
    - Проверка типов изменяет цену уже сгенерированных токенов
  correct: 1
  id: 031-instructor-2
  fingerprint: 3d753e39
- concept: переносимость Instructor обеспечивается размещением логики структурирования вокруг API провайдера
  question: Почему одну и ту же Pydantic-модель ответа можно применять через Instructor с разными поставщиками языковых моделей?
  explanation: Instructor оборачивает клиент конкретного провайдера и реализует проверку снаружи. Переносимость зависит от наличия подходящего адаптера, зато не требует доступа к логитам или механизму декодирования модели.
  kind: open
  reference: Логика задания схемы, разбора ответа, валидации и повторных запросов находится в клиентской обёртке, а не требует изменения внутреннего сэмплера модели. Поэтому при наличии адаптера для API провайдера Pydantic-схему и цикл проверки можно переиспользовать.
  id: 031-instructor-3
  fingerprint: 1a64b0fe
