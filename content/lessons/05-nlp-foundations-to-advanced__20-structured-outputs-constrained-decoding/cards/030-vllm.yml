- concept: тип ограничения определяет выбор параметра guided decoding в vLLM
  question: Ответ сервера должен быть только одним из значений `queued`, `running` или `failed`. Какой параметр vLLM непосредственно выражает такое ограничение?
  explanation: '`guided_choice` ограничивает вывод конечным набором строк. `guided_json` принимает JSON Schema, `guided_regex` задаёт регулярное выражение, а `guided_grammar` — грамматику.'
  kind: choice
  options:
    - '`guided_json`'
    - '`guided_choice`'
    - '`guided_regex`'
    - '`guided_grammar`'
  correct: 1
  id: 030-vllm-1
  fingerprint: 2a2b9394
- concept: vLLM изолирует состояние guided decoding каждого запроса, сохраняя общий серверный батчинг
  question: Как один сервер vLLM может одновременно обрабатывать запросы с разными ограничениями вывода и при этом объединять вычисления модели на GPU?
  explanation: Guided decoding является параметром конкретного запроса, а не общей настройкой сервера. Поэтому один запрос может использовать JSON Schema, другой — регулярное выражение, а vLLM продолжает совместно планировать их вычисления на GPU.
  kind: open
  reference: Ограничение и состояние декодера хранятся отдельно для каждого запроса. Во время генерации сервер применяет к каждой последовательности соответствующие правила допустимых токенов, хотя вычисления модели для нескольких последовательностей могут выполняться общим батчем.
  id: 030-vllm-2
  fingerprint: 1998926a
