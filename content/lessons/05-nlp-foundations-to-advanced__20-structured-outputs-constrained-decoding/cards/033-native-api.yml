- concept: JSON Schema разделяет обязательность поля и ограничение множества его значений
  question: Поле `sentiment` описано в `properties`. Как потребовать, чтобы оно обязательно присутствовало и содержало только одну из разрешённых меток?
  explanation: '`required` запрещает пропуск поля, а `enum` ограничивает его значение заданным набором. Одного описания поля в `properties` недостаточно, чтобы сделать его обязательным.'
  kind: choice
  options:
    - Добавить `sentiment` в `required`, а разрешённые метки указать через `enum`
    - Достаточно объявить `sentiment` внутри `properties`
    - Перечислить метки только в пользовательском промпте
    - Проверить наличие поля после получения произвольной строки
  correct: 0
  id: 033-native-api-1
  fingerprint: e34a08ac
- concept: нативный structured-output API может возвращать уже разобранное представление результата
  question: Объясни своими словами, чем получение результата через `output_parsed` отличается от обработки обычного текстового ответа модели.
  explanation: В нативном API схема участвует в генерации на сервере, после чего SDK может предоставить готовое структурированное значение. Это устраняет ручное выделение и разбор JSON-строки, но не доказывает истинность содержимого.
  kind: open
  reference: '`output_parsed` содержит разобранный структурированный результат, полученный по переданной схеме. Приложению не нужно самостоятельно извлекать JSON из текста и вызывать обычный JSON-парсер, хотя смысловую корректность данных всё равно следует проверять отдельно.'
  id: 033-native-api-2
  fingerprint: 1f8a5b0e
