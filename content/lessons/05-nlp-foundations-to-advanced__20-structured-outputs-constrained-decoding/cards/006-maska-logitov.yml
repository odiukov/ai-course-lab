- concept: маскирование сохраняет отношение вероятностей между допустимыми токенами
  question: У двух допустимых токенов логиты равны 2.4 и 0.9. Во сколько раз первый токен вероятнее второго после маскирования остальных токенов и применения softmax?
  explanation: Отношение вероятностей равно exp(2.4) / exp(0.9) = exp(1.5) ≈ 4.48. Маска удаляет недопустимые варианты и перенормирует распределение, но не меняет относительные предпочтения модели среди разрешённых токенов.
  kind: numeric
  answer: 4.48
  tolerance: 0.03
