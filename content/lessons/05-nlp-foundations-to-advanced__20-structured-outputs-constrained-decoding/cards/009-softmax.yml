- concept: вычитание максимального логита обеспечивает численную устойчивость softmax без изменения распределения
  question: Какое преобразование логитов перед вычислением экспонент предотвращает переполнение и сохраняет результат softmax?
  explanation: Вычитание общей константы не меняет softmax, поскольку одинаковый множитель сокращается при нормировке. Максимальный сдвинутый логит становится равен нулю, поэтому экспоненты не переполняются.
  kind: choice
  options:
    - Разделить каждый логит на сумму всех логитов
    - Заменить все положительные логиты максимальным логитом
    - Сначала вычислить экспоненты, а затем вычесть наибольшую из них
    - Вычесть максимальный конечный логит из каждого логита
  correct: 3
  id: 009-softmax-1
  fingerprint: 0f32d2e2
- concept: нормировку softmax следует проверять с учётом погрешности вычислений с плавающей точкой
  question: Почему сумму вероятностей, возвращённых реализацией softmax, следует проверять с небольшим допуском, а не точным сравнением?
  explanation: Погрешности округления накапливаются при вычислении экспонент и нормировке. Точное сравнение способно отклонить корректный результат, тогда как небольшой допуск проверяет нужное свойство без требования недостижимой точности.
  kind: open
  reference: Вычисление экспонент, сложение и деление выполняются с конечной точностью, поэтому даже правильная реализация может дать сумму, совсем немного отличающуюся от математически точного результата.
