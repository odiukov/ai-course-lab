- concept: родные API структурированного вывода обеспечивают надёжный формат ценой зависимости от вендора
  question: Команда передаёт схему ответа через родной structured-output API облачного провайдера, но планирует регулярно менять поставщика моделей. Какой недостаток выбранного подхода для неё наиболее существенен?
  explanation: Родной API обычно надёжно соблюдает поддерживаемые схемы, но его интерфейс и ограничения принадлежат конкретному провайдеру. При миграции интеграцию может потребоваться переписать.
  kind: choice
  options:
    - Родной API вообще не способен ограничивать формат ответа
    - Структурированный вывод неизбежно снижает смысловую точность модели
    - Родной API работает исключительно с локально запущенными моделями
    - Для каждой схемы потребуется дополнительное обучение модели
    - Схемы, возможности и интерфейсы придётся адаптировать под каждого провайдера
