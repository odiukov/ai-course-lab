- concept: для пакетной обработки с допустимыми повторами стоимость снижают сочетанием Instructor с дешёвой моделью
  question: Нужно пакетно извлекать структурированные данные через внешний API. Иногда результат не проходит проверку и может быть запрошен заново; минимизация общей стоимости важнее минимальной задержки отдельного запроса. Какой вариант наиболее уместен?
  explanation: При допустимых повторах Instructor удобен для проверки и повторной генерации. В пакетной обработке дополнительные вызовы накапливаются, поэтому их стоимость разумно компенсировать дешёвой моделью, если её качества достаточно.
  kind: choice
  options:
    - Instructor и самая дешёвая модель, которая справляется с задачей
    - XGrammar и обязательно самая мощная доступная модель
    - Outlines независимо от того, поддерживает ли внешний API управление декодированием
    - Только prompting без проверки результата
