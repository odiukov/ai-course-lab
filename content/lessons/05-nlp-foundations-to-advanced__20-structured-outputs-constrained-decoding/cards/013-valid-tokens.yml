  fingerprint: d7ae5c62
- concept: проверка кандидатов в valid_tokens не должна изменять реальное состояние автомата
  question: Объясни своими словами, почему при переборе словаря каждый токен нужно проверять на копии текущего состояния автомата.
  explanation: valid_tokens лишь вычисляет множество возможных продолжений. Если пробные переходы изменяют настоящее состояние, результат начнёт зависеть от порядка токенов в словаре.
  kind: open
  reference: Проверка одного кандидата не должна влиять на проверку остальных и на последующую генерацию. Настоящее состояние обновляется только после того, как сэмплер действительно выбрал токен.
  id: 013-valid-tokens-2
  fingerprint: 1f5664bf
- concept: токены с пустым декодированным текстом не считаются допустимым продолжением
  question: Служебный токен декодируется в пустую строку, поэтому при его пробной проверке автомат не встречает запрещённого перехода. Следует ли включать его идентификатор в результат valid_tokens?
  explanation: Пустой текст формально не вызывает ошибочного перехода, но и не меняет состояние. Автоматическое разрешение таких служебных токенов может оставить генерацию на месте.
  kind: choice
  options:
    - 'Нет: токен не читает ни одного символа и не продвигает автомат'
    - 'Да: отсутствие запрещённого перехода всегда достаточно'
    - Да, но только если поставить его первым в результате
  correct: 0
