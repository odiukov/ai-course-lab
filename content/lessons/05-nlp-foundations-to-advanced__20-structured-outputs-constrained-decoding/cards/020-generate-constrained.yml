- concept: промпт задаёт контекст модели, а автомат ограничивает только генерируемое продолжение
  question: В constrained generation список токенов модели инициализируют закодированным промптом, а состояние автомата — начальным состоянием грамматики. Почему промпт видит модель, но автомат начинает проверку с первого сгенерированного токена?
  explanation: 'У модели и автомата разные роли: модель учитывает весь контекст, включая промпт, а автомат контролирует форму ответа. Если прогнать промпт через автомат, его текст пришлось бы включать в грамматику структурированного вывода.'
  kind: open
  reference: Промпт нужен модели как контекст для предсказания, но не является частью структурированного ответа. Поэтому модель получает промпт в истории токенов, а автомат применяет грамматику только к создаваемому продолжению.
  id: 020-generate-constrained-1
  fingerprint: 7d3b7374
- concept: декодирование общего списка токенов возвращает промпт вместе с продолжением
  question: Функция сначала записывает токены промпта в ids, затем добавляет туда сгенерированные токены и в конце вызывает tokenizer.decode(ids). Что она вернёт?
  explanation: В ids остаются как исходные токены промпта, так и все добавленные токены продолжения. Декодирование всего списка возвращает обе части; для возврата только продолжения пришлось бы отдельно сохранить границу промпта и декодировать срез после неё.
  kind: choice
  options:
    - Промпт и сгенерированное продолжение
    - Только сгенерированное продолжение
    - Только исходный промпт
    - Только последний выбранный токен
  correct: 0
