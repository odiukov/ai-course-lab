- concept: проверка принимающего состояния до генерации следующего токена предотвращает продолжение уже завершённого вывода
  question: Зачем в цикле constrained decoding проверять принимающее состояние перед запросом следующих логитов?
  explanation: 'Если текущий вывод уже принят автоматом, он валиден и завершён. Запрос логитов и выбор ещё одного токена не нужны: продолжение может выйти за пределы выбранной точки завершения и испортить результат.'
  kind: choice
  options:
    - Чтобы завершить генерацию, не добавляя токен к уже валидному полному выводу
    - Чтобы восстановить исходные логиты всех запрещённых токенов
    - Чтобы перевести автомат обратно в начальное состояние
    - Чтобы гарантировать максимальную вероятность последнего токена
  correct: 0
