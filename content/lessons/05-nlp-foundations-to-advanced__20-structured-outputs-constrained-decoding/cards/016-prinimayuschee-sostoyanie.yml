- concept: принимающее состояние может иметь исходящие переходы, а остановка в нём определяется политикой генерации
  question: Объясни своими словами, почему принимающее состояние автомата не обязательно должно быть тупиком и как это связано с остановкой constrained decoding.
  explanation: Свойство «принимающее» означает, что текущая строка уже входит в язык грамматики, а не что продолжение невозможно. Решение остановиться при первом таком состоянии является политикой алгоритма генерации.
  kind: open
  reference: Грамматика может разрешать как завершить вывод в принимающем состоянии, так и продолжить его до другого валидного результата. Однако конкретный цикл генерации может считать первое достигнутое принимающее состояние выбранной точкой завершения и сразу остановиться.
  id: 016-prinimayuschee-sostoyanie-3
