- concept: текущее состояние автомата суммирует существенную информацию о прочитанном префиксе
  question: Почему конечному автомату при чтении строки слева направо достаточно хранить текущее состояние, а не весь уже прочитанный префикс?
  explanation: Автомат сворачивает историю чтения в состояние. Будущие переходы зависят от этого состояния и следующего символа, поэтому повторно анализировать весь префикс не требуется.
  kind: open
  reference: 'Состояние содержит всю информацию о префиксе, которая влияет на допустимые продолжения. Если разные префиксы приводят в одно состояние, для автомата они эквивалентны: к совпадению их могут привести одни и те же суффиксы.'
  id: 010-regex-avtomat-1
  fingerprint: bd494e92
- concept: распознавание строки автоматом происходит через последовательные переходы до принимающего состояния
  question: Автомат проверяет выражение `LM-(x|y)!`. Расположите этапы обработки подходящей строки в правильном порядке.
  explanation: Автомат читает строку слева направо и после каждого символа меняет состояние. Принимающее состояние после `!` означает, что вся прочитанная строка соответствует выражению.
  kind: order
  items:
    - Автомат находится в начальном состоянии
    - Автомат выполняет переход по символу `L`
    - Автомат выполняет переход по символу `M`
    - Автомат выполняет переход по дефису
    - Автомат выбирает переход по `x` или `y`
    - Автомат выполняет переход по `!` и оказывается в принимающем состоянии
  id: 010-regex-avtomat-2
  fingerprint: f2802056
- concept: неограниченное повторение представляется циклом в конечном автомате
  question: Заполните пропуск в утверждении о преобразовании регулярного выражения в автомат.
  explanation: 'Для каждой новой длины не нужно создавать отдельное состояние: автомат повторно проходит уже существующий цикл. Поэтому конечность автомата не означает конечность распознаваемого языка.'
  kind: cloze
  template: Неограниченное повторение в регулярном выражении представляется в конечном автомате как ___, поэтому автомат с конечным числом состояний может распознавать строки неограниченной длины.
  answer: цикл переходов
  accept:
    - цикл
    - петля переходов
    - переход, возвращающий в прежнее состояние
  id: 010-regex-avtomat-3
  fingerprint: 12305d75
