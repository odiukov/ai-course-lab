- concept: допустимый префикс не является полным совпадением до достижения принимающего состояния
  question: Автомат проверяет полное совпадение с шаблоном `mn(r|s)`. Как должно классифицироваться состояние после чтения `mn`?
  explanation: '`mn` — допустимый префикс, но ещё не полное совпадение. Принимающими должны стать состояния, достигнутые после выбора разрешённой ветви.'
  kind: choice
  options:
    - Непринимающее состояние, из которого разрешены переходы по `r` и `s`
    - Принимающее состояние, потому что обязательный общий префикс уже прочитан
    - Состояние ошибки, потому что автомат ещё не выбрал ветвь
  correct: 0
  id: 011-pattern-fsm-1
  fingerprint: 8bd92d9c
- concept: отсутствие перехода по очередному символу означает отклонение продолжения
  question: Что должен сделать автомат полного совпадения, если для очередного символа из текущего состояния нет перехода? Объясни, почему нельзя молча сохранить текущее состояние или сброситься в начальное.
  explanation: Переходы задают все разрешённые продолжения шаблона. Если подходящего перехода нет, прочитанная строка уже не может соответствовать шаблону при проверке полного совпадения.
  kind: open
  reference: Автомат должен отклонить продолжение или перейти в специальное состояние ошибки. Сохранение состояния позволило бы игнорировать запрещённый символ, а сброс в начало превратил бы проверку полного совпадения в поиск нового совпадения внутри строки.
  id: 011-pattern-fsm-2
  fingerprint: a767870a
