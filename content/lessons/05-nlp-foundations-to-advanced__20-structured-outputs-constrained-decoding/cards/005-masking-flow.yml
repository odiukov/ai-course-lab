- concept: правила формата изолированы в logit processor между моделью и сэмплером
  question: Для той же языковой модели нужно заменить целевую грамматику ответа. Какой компонент достаточно перенастроить?
  explanation: Модель по-прежнему вычисляет исходные логиты, а сэмплер выбирает токен из полученного распределения. Зависимые от грамматики правила находятся в промежуточном logit processor, поэтому модель не требуется переобучать, а сэмплеру — понимать формат.
  kind: choice
  options:
    - Переобучить языковую модель на новой грамматике
    - Заменить правила маски допустимости в logit processor
    - Научить сэмплер самостоятельно разбирать JSON
    - Изменить токенизатор модели
  correct: 1
  id: 005-masking-flow-1
  fingerprint: 799045eb
- concept: допустимость следующего токена пересчитывается после обновления префикса и состояния грамматики
  question: Расположи этапы одного цикла constrained decoding в правильном порядке.
  explanation: Маска строится до сэмплирования и зависит от уже созданного префикса. После выбора токена префикс и состояние грамматики меняются, поэтому на следующем цикле множество допустимых продолжений вычисляется заново.
  kind: order
  items:
    - Модель вычисляет логиты возможных продолжений
    - Logit processor определяет допустимые токены по префиксу и состоянию грамматики
    - Logit processor маскирует недопустимые продолжения
    - Сэмплер выбирает токен по обработанным логитам
    - Выбранный токен добавляется к ответу, а состояние грамматики обновляется
  id: 005-masking-flow-2
  fingerprint: f0349c55
