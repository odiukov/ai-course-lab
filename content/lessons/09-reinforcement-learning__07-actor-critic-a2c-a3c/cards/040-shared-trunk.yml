- concept: разделение голов сохраняет разные семантику и размерность двух выходов при общем представлении
  question: Почему при общем экстракторе всё же держат две отдельные головы, а не один общий выходной слой?
  explanation: Обмен идёт на уровне признаков, а не на уровне решений.
  kind: open
  reference: 'Потому что от сети требуются два разных ответа: распределение по действиям (сколько действий — столько чисел, они связаны нормировкой) и скалярная оценка положения. Один выходной слой заставил бы обе задачи делить одни и те же веса последнего преобразования, и обновление одной задачи напрямую портило бы ответ другой. Раздельные головы дают компромисс: общее представление обучается сразу от двух сигналов, а специфичные преобразования не пересекаются, поэтому роли «куда идти» и «насколько тут хорошо» не смешиваются.'
  id: 040-shared-trunk-3
  fingerprint: fe558dbe
