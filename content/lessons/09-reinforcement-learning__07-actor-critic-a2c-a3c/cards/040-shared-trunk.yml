  fingerprint: 66e3f685
- concept: общий trunk оправдан там, где извлечение признаков дорого и одинаково для обеих задач
  question: В каком случае общий экстрактор признаков даёт наибольший выигрыш?
  explanation: Свёрточный экстрактор — самая дорогая часть сети, и «где стена, где противник» одинаково нужно и для выбора действия, и для оценки состояния. На низкоразмерных векторных наблюдениях выигрыш мал, там раздельные сети вполне рабочи.
  kind: choice
  options:
    - Наблюдение — кадр с картинки, и обеим головам нужны одни и те же визуальные признаки
    - Наблюдение — вектор из нескольких чисел, где признаки уже готовы
    - Когда число действий очень велико и вероятности хочется считать быстрее
    - Когда критик обучается на отдельном наборе данных, недоступном актёру
  correct: 0
