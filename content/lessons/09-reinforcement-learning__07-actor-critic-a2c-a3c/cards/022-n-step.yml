- concept: оценка критика на границе окна входит в n-step преимущество с дисконтом в степени n
  question: 'Заполни пропуск в n-шаговом преимуществе: после суммы наблюдаемых наград идёт член, отвечающий за всё, что осталось за границей окна.'
  explanation: Награда r_{t+k} отстоит от t на k шагов и берётся с γ^(k-1); состояние s_{t+n} отстоит на n шагов, поэтому его оценка идёт с γ^n. Показатели обязаны совпадать с реальной задержкой во времени, иначе масштаб хвоста не сойдётся с масштабом наград.
  kind: cloze
  template: A_t = r_{t+1} + gamma*r_{t+2} + ... + gamma**(n-1)*r_{t+n} + ___ - V(s_t)
  answer: gamma**n * V(s_{t+n})
  accept:
    - gamma**n * V(s_{t+n})
    - gamma^n * V(s_{t+n})
    - gamma**n*V_phi(s_{t+n})
    - gamma^n V(s_{t+n})
  id: 022-n-step-1
  fingerprint: 0175b997
- concept: рост горизонта n уменьшает вклад ошибки критика и увеличивает вклад случайности траектории
  question: Инженер увеличивает горизонт n в n-шаговом преимуществе. Что происходит с оценкой?
  explanation: Оценка критика входит с γ^n и отодвигается дальше, так что её ошибка весит меньше. Но каждая дополнительно наблюдаемая награда — ещё один случайный исход в сумме. Это обмен смещения на дисперсию, а не бесплатное улучшение; критик исчезает совсем только при достижении терминала.
  kind: choice
  options:
    - Ошибка критика влияет слабее, потому что её вклад дисконтируется сильнее, но в оценку попадает больше случайных наград
    - 'И зависимость от критика, и разброс падают: больше данных всегда лучше'
    - Оценка перестаёт зависеть от критика полностью, потому что наблюдаемых наград становится больше половины
  correct: 0
  id: 022-n-step-2
  fingerprint: 7fc5a094
- concept: порядок сборки n-шагового преимущества из наблюдаемых наград, хвостовой оценки и оценки стартового состояния
  question: Расставь шаги вычисления n-шагового преимущества для момента t.
  explanation: 'Первые два шага собирают целевую отдачу: наблюдаемая часть плюс bootstrap-хвост. Третий переводит её в преимущество — насколько результат лучше того, что критик ожидал из s_t.'
  kind: order
  items:
    - Сложить n фактически полученных наград, дисконтируя каждую по её задержке от момента t
    - Прибавить оценку критика для состояния на границе окна, умноженную на дисконт в степени n
    - Вычесть оценку критика для стартового состояния s_t, превратив целевую отдачу в преимущество
  id: 022-n-step-3
  fingerprint: 4b917a9a
