- concept: сумма компонент градиента логарифма softmax-политики по всем действиям равна нулю
  question: 'Для softmax-политики посчитали вектор ∇ log π по логитам: единица на сэмплированном действии минус вектор вероятностей. Чему равна сумма всех компонент этого вектора?'
  explanation: 'Индикатор даёт в сумме единицу, вероятности тоже суммируются в единицу, разность — ноль. Отсюда самопроверка реализации: сумма компонент должна быть близка к нулю (мелкое отклонение — накопление ошибок дробной арифметики). Смысл: softmax перераспределяет вес между логитами, а не добавляет его.'
  kind: choice
  options:
    - Нулю при любом числе действий
    - Единице, потому что индикатор выбранного действия равен единице
    - Вероятности сэмплированного действия
    - Числу действий минус единица
  correct: 0
  id: 013-grad-log-pi-1
  fingerprint: cd17d1a5
- concept: положительная поправка ставится по индексу фактически сэмплированного действия, а не по индексу максимальной вероятности
  question: Политика выдала вероятности [0.55, 0.35, 0.10], а сэмплирование вернуло действие с индексом 1. По какому индексу ставится единица в ∇ log π?
  explanation: 'Policy-градиент оценивается по действию, которое реально было выполнено и породило наблюдённую отдачу: log π берётся именно от a_t. Подстановка argmax разорвала бы связь между оценкой преимущества и действием, и обновление стало бы смещённым.'
  kind: choice
  options:
    - По индексу 0 — у него наибольшая вероятность
    - По индексу 1 — по фактически сэмплированному действию
    - По индексу с наименьшей вероятностью, чтобы усилить исследование
    - По всем индексам сразу, каждому по 1/K
  correct: 1
  id: 013-grad-log-pi-2
  fingerprint: 240f59d4
- concept: компонента градиента для сэмплированного действия равна единице минус его текущая вероятность
  question: Политика выдала вероятности [0.5, 0.25, 0.2, 0.05], сэмплировано действие с индексом 2. Чему равна компонента ∇ log π, соответствующая этому индексу?
  explanation: 'Для сэмплированного действия индикатор равен единице: 1 − 0.2 = 0.8. Чем ниже была вероятность действия, тем сильнее сигнал по нему — редкое действие с хорошим преимуществом двигает логит заметнее, чем уже почти детерминированное.'
  kind: numeric
  answer: 0.8
  tolerance: 0.001
  id: 013-grad-log-pi-3
  fingerprint: 7b662a14
