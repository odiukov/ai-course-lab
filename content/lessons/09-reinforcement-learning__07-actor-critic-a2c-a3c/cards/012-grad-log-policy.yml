- concept: поправка параметра равна произведению learning rate, преимущества, разности индикатора и вероятности, и признака
  question: Актёр выбрал действие, которому политика давала вероятность 0.8. Преимущество равно +5, скорость обучения актёра 0.1, признак x_j равен 0.5. Насколько изменится параметр, связывающий этот признак с логитом выбранного действия?
  explanation: 'Δθ = α·A·(1 − π(a_t))·x_j = 0.1·5·(1 − 0.8)·0.5 = 0.05. Заметь: чем выше уже была вероятность выбранного действия, тем меньше поправка — политика не тратит шаги на то, в чём и так уверена.'
  kind: numeric
  answer: 0.05
  tolerance: 0.002
  id: 012-grad-log-policy-1
  fingerprint: d2fb00cd
- concept: параметры при нулевом признаке не получают обновления
  question: В текущем состоянии признак x_j равен нулю. Что происходит с параметрами θ_ij, привязанными к этому признаку, на данном шаге обновления?
  explanation: Множитель x_j стоит в каждой поправке. Нулевой признак не участвовал в формировании логита, значит и вины (или заслуги) за исход у связанных с ним параметров нет. Так градиент адресует обновление именно тем весам, которые повлияли на решение.
  kind: choice
  options:
    - Обновляются наравне с остальными — признак на величину поправки не влияет
    - 'Не обновляются: поправка пропорциональна значению признака'
    - Обновляются, но только для выбранного действия
  correct: 1
  id: 012-grad-log-policy-2
  fingerprint: 27f67543
- concept: 'одно обновление затрагивает логиты всех действий: невыбранные сдвигаются на минус свою вероятность'
  question: Актёр выбрал одно действие и получил положительное преимущество. Что происходит с логитами действий, которые выбраны не были?
  explanation: 'Градиент логарифма политики равен 1[i = a] − π(a_i): у выбранного действия он положителен, у остальных равен минус их вероятности. Иначе и быть не может — вероятности связаны нормировкой softmax, поднять одну можно только за счёт других. При отрицательном преимуществе все сдвиги разворачиваются тем же кодом.'
  kind: choice
  options:
    - 'Остаются нетронутыми: обновляется только строка выбранного действия'
    - Сдвигаются вниз, каждое пропорционально своей текущей вероятности
    - Сдвигаются вверх на одинаковую величину
  correct: 1
  id: 012-grad-log-policy-3
  fingerprint: 75a2129d
