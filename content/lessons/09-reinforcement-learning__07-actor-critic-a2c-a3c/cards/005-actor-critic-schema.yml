- concept: 'один переход порождает два обновления: policy-градиент для актёра и регрессию ценности для критика'
  question: Критик оценил состояние как V = 25, а фактический результат после выбранного действия оказался равен 41. Что происходит с сетями в actor-critic?
  explanation: 'Один и тот же переход даёт преимущество A = 41 − 25 = +16 (сигнал актёру: действие лучше ожидаемого) и мишень для регрессии критика — минимизируется (V_φ(s) − target)². Из одного опыта извлекаются обе поправки.'
  kind: choice
  options:
    - Актёр увеличивает вероятность выбранного действия, а критик поднимает свою оценку этого состояния ближе к 41
    - 'Обновляется только актёр: критик учится отдельно, на других данных'
    - Обновляется только критик, а политика меняется лишь в конце эпизода
    - Актёр уменьшает вероятность действия, потому что оценка критика оказалась заниженной
  correct: 0
  id: 005-actor-critic-schema-1
  fingerprint: 2ead1d65
- concept: порядок операций в обучающем контуре actor-critic на одном шаге
  question: Расставьте операции одного шага actor-critic в правильном порядке.
  explanation: 'Контур замкнут: политика порождает данные, данные уточняют критика, критик даёт актёру менее шумный сигнал. Разорвать любое звено — и обучение либо стоит на месте, либо идёт по неверной точке отсчёта.'
  kind: order
  items:
    - Актёр сэмплирует действие из политики π_θ(a | s) в текущем состоянии
    - Среда возвращает награду и следующее состояние
    - Фактический результат сравнивается с оценкой критика V_φ(s) — получается преимущество
    - Преимущество умножается на ∇ log π и обновляет актёра, а квадрат ошибки обновляет критика
    - Обновлённая политика выбирает следующее действие, и цикл повторяется
  id: 005-actor-critic-schema-2
  fingerprint: 5e2f6342
- concept: качество сигнала для актёра ограничено точностью критика, поэтому в начале обучения преимущества шумные
  question: На первых обновлениях actor-critic критик инициализирован случайно и предсказывает ценность плохо. Как это сказывается на актёре?
  explanation: 'A = G − V_φ(s) опирается на V_φ. Плохой V_φ смещает точку отсчёта, и действие среднего качества может получить крупный положительный или отрицательный сигнал. Обучение всё равно идёт: актёр добывает опыт, критик по нему уточняется, и сигнал постепенно очищается.'
  kind: choice
  options:
    - Преимущества смещены и шумны, поэтому актёр получает ненадёжное направление, пока критик не станет точнее
    - 'Никак: преимущество не зависит от точности критика'
    - Актёр вообще не обучается, пока ошибка критика не станет нулевой
    - Актёр обучается быстрее, потому что случайный критик даёт больший разброс градиента
  correct: 0
  id: 005-actor-critic-schema-3
  fingerprint: 7d16f50f
