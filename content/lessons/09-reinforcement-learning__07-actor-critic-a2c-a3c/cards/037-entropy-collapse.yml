- concept: энтропийный бонус — противовес, а не запрет на уверенную политику
  question: В loss включён энтропийный бонус с c_e > 0. Значит ли это, что политика никогда не станет почти детерминированной? Объясни своими словами.
  explanation: Энтропийный член — это слагаемое с весом c_e, а не ограничение. Малый c_e даёт быстрое схлопывание, большой — долгую нерешительность; выбирают компромисс.
  kind: open
  reference: 'Нет. Бонус создаёт постоянную тягу к более широкому распределению, но он борется с policy-градиентом, а не отменяет его. Если преимущества раз за разом подтверждают одно действие, суммарный сигнал актёра пересилит фиксированный по силе энтропийный член, и вероятность этого действия вырастет. Разница в том, что уверенность придёт из накопленного подтверждения, а не из первых случайных удач: бонус только удерживает исследование, пока свидетельств мало.'
  id: 037-entropy-collapse-2
