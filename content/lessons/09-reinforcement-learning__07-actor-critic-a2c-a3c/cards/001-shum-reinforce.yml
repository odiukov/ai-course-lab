- concept: разброс отдачи возникает из-за случайности, накопленной после выбранного действия
  question: Агент в стохастической среде дважды выбирает одно и то же действие в одном и том же состоянии. В первом эпизоде отдача после этого момента равна 480, во втором — 55. Что это в первую очередь означает?
  explanation: G_t = r_{t+1} + γ r_{t+2} + … — это сумма всего, что случилось после момента t. Между 480 и 55 стоят десятки последующих случайных переходов и выборов, а вклад самого действия в этой сумме занимает крошечную долю. Отсюда и высокая дисперсия оценки градиента.
  kind: choice
  options:
    - Отдача суммирует все награды после действия, поэтому вбирает случайность последующих переходов и решений, а не только эффект самого действия
    - Политика успела измениться между эпизодами, иначе отдача была бы одинаковой
    - 'Одно из значений посчитано неверно: отдача одного действия обязана быть постоянной'
    - Среда нарушает марковское свойство, поэтому отдача перестала быть определённой
  correct: 0
  id: 001-shum-reinforce-1
  fingerprint: 62a39919
- concept: отдача G_t считается как дисконтированная сумма наград, полученных после момента t
  question: После момента t агент получает награды 8, затем 4, затем 6, и эпизод заканчивается. Коэффициент дисконтирования γ = 0.5. Чему равна отдача G_t?
  explanation: 'G_t = 8 + 0.5·4 + 0.5²·6 = 8 + 2 + 1.5 = 11.5. Именно это число становится множителем при ∇ log π: чем сильнее скачет такая сумма от эпизода к эпизоду, тем шумнее обновление политики.'
  kind: numeric
  answer: 11.5
  tolerance: 0.05
  id: 001-shum-reinforce-2
  fingerprint: 30eb49bb
- concept: в REINFORCE сила обновления вероятности действия задаётся множителем при градиенте логарифма вероятности
  question: Заполните пропуск в оценке градиента REINFORCE для одного перехода.
  explanation: Градиент ∇ log π задаёт направление «сделать действие вероятнее», а отдача G_t — знак и силу шага. Поэтому весь шум отдачи напрямую переносится в шум обновления параметров.
  kind: cloze
  template: \hat{g}_t = ___ \cdot \nabla_\theta \log \pi_\theta(a_t \mid s_t)
  answer: G_t
  accept:
    - G
    - G_t
    - отдача
    - return
    - R_t
  id: 001-shum-reinforce-3
