- concept: дисконтированные отдачи для короткого rollout с bootstrap-значением
  question: rewards = [7, 6], gamma = 0.3, last_value = 20. Чему равен первый элемент результата discounted_returns?
  explanation: 'Последняя отдача: 6 + 0.3·20 = 12. Первая: 7 + 0.3·12 = 10.6. Возвращается [10.6, 12.0] — в исходном временном порядке, хотя считалось справа налево.'
  kind: numeric
  answer: 10.6
  tolerance: 0.01
  id: 018-discounted-returns-1
  fingerprint: 363db7a0
- concept: last_value входит в отдачи через дисконт, а не как дополнительная награда последнего шага
  question: Как last_value участвует в расчёте отдач?
  explanation: Это оценка ценности состояния ПОСЛЕ последнего записанного шага, то есть будущее относительно него. Прибавить её без γ — переоценить хвост; отбросить — недооценить.
  kind: choice
  options:
    - Кладётся в накопитель до цикла, поэтому в отдачу последнего шага входит с множителем γ, а в предыдущие — с γ², γ³ и так далее
    - Прибавляется к награде последнего шага без изменения, как ещё одна награда
    - Прибавляется ко всем отдачам одинаково, чтобы сдвинуть их вверх
    - Умножается на длину rollout и добавляется к первой отдаче
  correct: 0
  id: 018-discounted-returns-2
  fingerprint: dccbcda4
- concept: обратный проход даёт все отдачи за один проход по массиву
  question: Почему отдачи считают циклом с конца, а не с начала?
  explanation: Рекурсия R_t = r_t + γR_{t+1} направлена из будущего в прошлое. Прямой проход возможен, но потребует O(T²) операций вместо O(T). Результат при этом всё равно возвращают в исходном порядке шагов.
  kind: choice
  options:
    - Отдача шага использует уже посчитанную отдачу следующего шага, поэтому один обратный проход заменяет пересуммирование хвоста для каждого t
    - Прямой проход даёт другой результат из-за γ
    - С конца дисконт применяется точнее, меньше ошибка округления
    - Иначе last_value не удастся использовать вообще
  correct: 0
  id: 018-discounted-returns-3
  fingerprint: 9fdbdd7f
