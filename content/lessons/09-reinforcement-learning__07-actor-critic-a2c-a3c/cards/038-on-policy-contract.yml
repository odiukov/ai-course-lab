- concept: importance-вес перехода равен отношению вероятности действия при новой политике к вероятности при политике сбора
  question: Переход собран политикой, которая давала выбранному действию вероятность 0.20. После обновления та же политика даёт этому действию вероятность 0.50. Какой importance-вес нужно поставить этому переходу, чтобы повторно использовать его для градиента новой политики?
  explanation: Вес = π_new(a|s) / π_old(a|s) = 0.50 / 0.20 = 2.5. Действие теперь выбиралось бы в 2.5 раза чаще, чем в собранной выборке, поэтому его вклад домножают. Именно такую поправку добавляет PPO; без неё второй проход по данным считает старую выборку так, будто её породила текущая политика.
  kind: numeric
  answer: 2.5
  tolerance: 0.01
  id: 038-on-policy-contract-1
  fingerprint: 4435bf98
- concept: цена on-policy контракта — расход свежих шагов среды на каждое обновление, то есть низкая sample efficiency
  question: Команда обучает агента vanilla A2C без importance-поправок. Чем оплачивается соблюдение on-policy контракта?
  explanation: 'On-policy метод расходует каждый переход ровно один раз, поэтому число шагов среды растёт пропорционально числу обновлений: при батче 128 переходов и 500 обновлениях нужно 64000 шагов. Хранить старое незачем — данные не переиспользуются. Методы с replay buffer или с importance-поправкой (PPO) покупают sample efficiency ценой дополнительной коррекции.'
  kind: choice
  options:
    - 'Каждое обновление требует новых взаимодействий со средой: собранные переходы после одного шага оптимизатора выбрасываются'
    - 'Растёт объём памяти: все прошлые переходы приходится хранить до конца обучения'
    - Приходится увеличивать коэффициент дисконтирования, иначе цели критика становятся некорректными
    - Приходится делать несколько шагов оптимизатора подряд, чтобы догнать изменившуюся политику
