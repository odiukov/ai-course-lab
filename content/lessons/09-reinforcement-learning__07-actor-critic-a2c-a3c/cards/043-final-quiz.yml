- concept: в асинхронной схеме градиент воркера приходит к параметрам, которые уже успели измениться после копирования
  question: Воркер скопировал общие параметры, собрал траекторию и посчитал по ней градиент. Пока он считал, сервер параметров успел применить обновления других воркеров. Какая проблема здесь возникает и почему синхронная схема её лишена?
  explanation: Асинхронность покупает загрузку железа ценой устаревших градиентов; синхронность покупает согласованность ценой барьера ожидания.
  kind: open
  reference: 'Градиент оказывается устаревшим: он посчитан относительно старой версии параметров, а применяется к уже изменённым. Направление шага перестаёт точно соответствовать текущей политике, что добавляет шум и рассогласование с on-policy контрактом. В синхронной схеме все среды отдают опыт одной и той же версии параметров и обновление применяется один раз, поэтому рассогласования по версиям нет — платой становится ожидание самого медленного воркера.'
