- concept: преимущество выражается как разность ценности пары состояние-действие и ценности состояния
  question: Дополни определение преимущества через две функции ценности.
  explanation: Преимущество сравнивает конкретное действие с усреднённой по политике ценностью состояния. Критик в actor-critic учит именно V(s), а Q оценивается через наблюдаемые награды и bootstrap, поэтому разность и получается оценкой преимущества.
