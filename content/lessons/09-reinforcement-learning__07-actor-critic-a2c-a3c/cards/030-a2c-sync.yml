- concept: размер батча одного обновления A2C равен произведению числа параллельных сред на длину rollout
  question: A2C гоняет 12 параллельных копий среды, в каждой собирает rollout длиной 64 шага. Сколько переходов попадёт в один шаг оптимизатора?
  explanation: 'Синхронный сбор даёт N × T переходов: 12 × 64 = 768. Батч масштабируется числом сред, а не длиной эпизода, поэтому под GPU его наращивают ростом N при фиксированном T.'
  kind: numeric
  answer: 768
  tolerance: 0.5
  id: 030-a2c-sync-1
  fingerprint: ec8bb397
- concept: объединённый батч порождает одно обновление параметров, а не отдельное обновление на каждую среду
  question: Параллельные среды закончили свои rollout. Что делает A2C дальше?
  explanation: 'Синхронность в том и состоит: сбор ставится на паузу, преимущества считаются для всех переходов, градиенты усредняются по всему батчу и применяются один раз. Последовательные обновления по средам сделали бы данные части сред off-policy относительно уже изменившихся параметров.'
  kind: choice
  options:
    - Делает по одному шагу оптимизатора на каждую среду по очереди, передавая обновлённые веса дальше
    - Делает один шаг оптимизатора по объединённому батчу, и только после этого новая политика уходит во все среды
    - Обновляет актёра на батче первой среды, а критика — на батче остальных
  correct: 1
  id: 030-a2c-sync-2
  fingerprint: bdfdcf08
- concept: параллельные среды дают декоррелированный сигнал и плотный батч, ценой ожидания самой медленной среды на барьере
  question: Объясни своими словами, что A2C выигрывает от параллельных сред и чем за это платит.
  explanation: Оба довода — декорреляция и загрузка GPU — объясняют, почему A2C вытеснил A3C на современном железе. Цена синхронности честно видна в простое быстрых сред у общей границы.
  kind: open
  reference: 'Выигрыш двойной. Во-первых, переходы из разных сред получены на разных траекториях и с разными случайными событиями, поэтому корреляция внутри батча падает и градиент меньше зависит от особенностей одного эпизода — параллелизм здесь заменяет replay buffer. Во-вторых, большой плотный батч однородных данных эффективно считается на GPU за один проход. Плата — синхронный барьер: цикл продолжается только когда все среды дошли до конца rollout, поэтому темп задаёт самая медленная среда, а остальные простаивают. Асинхронный вариант (A3C) барьера не имеет, но воркеры применяют градиенты по слегка устаревшим параметрам.'
  id: 030-a2c-sync-3
  fingerprint: 040f5634
