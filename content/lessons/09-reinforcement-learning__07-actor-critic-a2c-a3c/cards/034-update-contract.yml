- concept: 'on-policy контракт: ролаут годится ровно для одного обновления, повторные проходы смещают градиент'
  question: Rollout собран текущей политикой. Инженер хочет сэкономить и сделать по нему подряд пять шагов оптимизатора. Что при этом произойдёт?
  explanation: Policy-градиент оценивает матожидание по действиям текущей политики. После первого шага политика уже другая, а данные остались от прежней. Именно эту дыру закрывает importance-sampling-отношение в PPO.
  kind: choice
  options:
    - После первого шага данные станут off-policy, и градиент будет смещённым — если не добавить поправку importance sampling, как в PPO
    - 'Ничего не изменится: данные не зависят от параметров, поэтому проходов можно делать сколько угодно'
    - Смещения не будет, но обновления просто повторят друг друга и не дадут никакого эффекта
  correct: 0
  id: 034-update-contract-1
  fingerprint: d0b36819
- concept: направление обновления актёра задаёт знак преимущества, а не абсолютная величина отдачи
  question: Критик ожидал из состояния 46, а целевая отдача перехода оказалась 40 — величина большая и положительная. Что сделает актёр с вероятностью выбранного действия?
  explanation: 'Актёр сравнивает результат с тем, что критик уже ожидал в этом состоянии: 40 − 46 = −6. Большая абсолютная отдача сама по себе ничего не говорит — все действия в хорошем состоянии дают большие отдачи.'
  kind: choice
  options:
    - 'Понизит: преимущество отрицательное, значит действие сработало хуже ожидания в этом состоянии'
    - 'Повысит: отдача 40 положительна, значит переход был выгодным'
    - 'Не изменит: обновление актёра зависит только от того, попал ли критик точно'
  correct: 0
  id: 034-update-contract-2
  fingerprint: d16f3a86
