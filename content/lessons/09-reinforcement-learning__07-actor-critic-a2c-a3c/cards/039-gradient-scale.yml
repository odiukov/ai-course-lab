  fingerprint: 28eade54
- concept: clipping по норме пропорционально ужимает весь вектор градиента, сохраняя направление
  question: Общая норма градиента перед шагом оптимизатора равна 12, порог clipping — 3. Чему станет равна компонента градиента, которая до клиппинга была равна 6?
  explanation: При норме выше порога вектор умножается на 3/12 = 0.25, значит 6 · 0.25 = 1.5. Все компоненты делятся на один множитель, поэтому направление обновления сохраняется — ограничивается только длина шага.
  kind: numeric
  answer: 1.5
  tolerance: 0.01
  id: 039-gradient-scale-2
