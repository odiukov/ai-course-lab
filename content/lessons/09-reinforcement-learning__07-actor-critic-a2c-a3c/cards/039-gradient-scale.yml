- concept: 'нормализация наград бегущей статистикой и clipping закрывают разные проблемы: систематический масштаб и разовый выброс'
  question: Зачем нужны обе меры сразу — деление наград на бегущее стандартное отклонение и gradient clipping? Что закрывает каждая из них?
  explanation: 'Обе меры чисто инженерные: они не улучшают качество оценки преимущества, а делают величину шага предсказуемой.'
  kind: open
  reference: 'Нормализация наград приводит сигнал к привычному масштабу и держит его там по мере обучения и смены сложности среды: типичное обновление получается сопоставимым между задачами и во времени. Она работает со статистикой, то есть с обычным случаем, и от редкого выброса не спасает. Clipping — аварийный ограничитель на самом шаге: если суммарная норма градиента превысила порог, весь вектор пропорционально ужимается, и один необычный rollout не сдвинет параметры скачком. Первое настраивает типичный масштаб, второе срезает хвост.'
  id: 039-gradient-scale-3
