- concept: критик V_φ(s) выдаёт одно число на состояние независимо от числа доступных действий
  question: В среде агенту доступно 6 дискретных действий. Сколько чисел выдаёт сеть-критик V_φ(s) на одно поданное состояние?
  explanation: V_φ отображает состояние в одно скалярное значение — ожидаемую отдачу из этого состояния. Шесть выходов на состояние даёт Q-сеть (по числу действий), а не критик из actor-critic.
  kind: numeric
  answer: 1
  tolerance: 0.4
  id: 006-dve-roli-1
  fingerprint: 9d4fd0af
- concept: оценка состояния не ранжирует действия, поэтому выбирать действие по V_φ нельзя
  question: Критик выдал для текущего состояния высокое значение V_φ(s) = 87. Что из этого следует?
  explanation: 'V_φ(s) — характеристика всей ситуации, усреднённая по действиям текущей политики. Чтобы получить сигнал про конкретное действие, нужна разность: A = G − V_φ(s) или r + γV_φ(s′) − V_φ(s). Выбор действия остаётся за актёром π_θ.'
  kind: choice
  options:
    - Только то, что из этого состояния при текущей политике ожидается большая отдача; какое действие лучше — V_φ не говорит
    - Что любое действие в этом состоянии приведёт к отдаче около 87
    - Что нужно выбрать действие с наибольшим значением V_φ
    - Что политика уже оптимальна в этом состоянии
  correct: 0
  id: 006-dve-roli-2
