- concept: V_φ оценивает состояние при текущей политике, поэтому меняется вместе с политикой
  question: Политика актёра улучшилась, а состояние осталось прежним. Почему правильная оценка критика для этого состояния тоже должна измениться?
  explanation: 'Это ключевое отличие V^π от V*: критик оценивает не «лучшее возможное будущее», а будущее при нынешнем поведении актёра. Отсюда и взаимная зависимость двух сетей в контуре обучения.'
  kind: open
  reference: 'Критик приближает ожидаемую отдачу при условии, что дальше действует текущая политика: V^π(s). Если актёр стал чаще выбирать выгодные действия, ожидаемая отдача из того же состояния выросла, и старая оценка занижена. Поэтому критик — движущаяся мишень: его обучают непрерывно, вместе с актёром, а не один раз в начале.'
  id: 006-dve-roli-3
  fingerprint: 90e47604
