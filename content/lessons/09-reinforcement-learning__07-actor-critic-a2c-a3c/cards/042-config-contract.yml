- concept: конфиг фиксирует не только параметры, но и условия отказа от запуска
  question: Требуется конфиг A2C для среды с горизонтом эпизода около 4000 шагов, доступен один воркер. Что должен предписывать проверяемый конфиг?
  explanation: Один воркер даёт редкие и коррелированные обновления, а on-policy контракт запрещает переиспользовать rollout. Зашитый запрет ловит заведомо неудачную конфигурацию до траты часов вычислений; лечение — больше параллельных сред или асинхронный A3C.
  kind: choice
  options:
    - 'Отказать в такой конфигурации: on-policy сбор одним воркером на длинном горизонте слишком медленный'
    - Согласиться, увеличив только learning rate актёра
    - Согласиться, отключив нормализацию преимуществ ради скорости
    - Согласиться, но поставить c_e = 0, чтобы политика быстрее сходилась
  correct: 0
  id: 042-config-contract-1
  fingerprint: 9c4fb47c
- concept: низкая энтропия при c_e = 0 — сигнал вырождения политики, даже когда метрика возврата выглядит прилично
  question: 'Запуск: c_e = 0, средний возврат медленно растёт, но наблюдаемая энтропия политики при 8 действиях упала до 0.02. Как должен трактовать это проверяемый конфиг?'
  explanation: У равномерной политики на 8 действий энтропия ln 8 ≈ 2.08; значение 0.02 означает почти всю массу на одном действии. Возврат может выглядеть приемлемо на уже найденном локальном поведении, но улучшений больше не будет — данных об альтернативах не поступает.
  kind: choice
  options:
    - 'Как успешную сходимость: раз возврат растёт, обучение исправно'
    - 'Как проблему критика: value-loss явно слишком велик'
    - 'Как entropy-collapsed запуск: политика фактически детерминирована и перестала исследовать'
    - Как признак слишком большого gradient clip
  correct: 2
  id: 042-config-contract-2
  fingerprint: 0bd8a9eb
- concept: оценщик преимущества воспроизводим только вместе со своим параметром горизонта
  question: 'В конфиге записано «advantage: GAE». Почему такой записи недостаточно?'
  explanation: GAE(λ=0) — это чистый TD-остаток, GAE(λ=0.95) — почти Monte Carlo по обрезанному rollout. Без λ (как и без n для n-step) два «одинаковых» конфига дают разное обучение, и сравнивать запуски невозможно.
  kind: choice
  options:
    - GAE вообще нельзя использовать в A2C, нужен только n-step
    - Не указан λ, а он задаёт баланс смещения и дисперсии, поэтому запуск невоспроизводим
    - GAE требует указать размер словаря наблюдений
    - Название оценщика вообще не влияет на результат, важны только learning rate
  correct: 1
  id: 042-config-contract-3
  fingerprint: d638de6a
