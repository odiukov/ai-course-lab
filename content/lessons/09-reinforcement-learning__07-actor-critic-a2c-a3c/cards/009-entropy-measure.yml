- concept: энтропия равномерной политики равна натуральному логарифму числа действий
  question: В состоянии доступно 8 действий, и политика назначает им равные вероятности. Чему равна энтропия такой политики (натуральный логарифм)?
  explanation: 'При равномерном распределении каждое p = 1/8, и H = −Σ (1/8)·ln(1/8) = ln 8 ≈ 2.08. Это максимум энтропии для восьми действий: любое отклонение от равномерности его снижает.'
  kind: numeric
  answer: 2.08
  tolerance: 0.05
  id: 009-entropy-measure-1
  fingerprint: a22f1045
- concept: энтропия измеряет разнообразие выбора, а не качество политики
  question: 'Две политики в одном состоянии: у первой энтропия 1.9, у второй 0.4. Что отсюда следует?'
  explanation: 'Энтропия — характеристика распределения, а не результата. Политика может бесполезно метаться при высокой энтропии и быть отличной при низкой. Значение имеет только один момент: пока энтропия высока, у агента сохраняется шанс найти лучший вариант.'
  kind: choice
  options:
    - Первая политика собирает больше награды
    - Первая распределяет вероятность заметно равномернее, но о её награде это ничего не говорит
    - Вторая политика уже оптимальна, раз она уверена в выборе
  correct: 1
  id: 009-entropy-measure-2
  fingerprint: 000d14cd
- concept: детерминированная политика имеет нулевую энтропию и перестаёт исследовать
  question: 'Политика стала детерминированной: в состоянии одно действие забрало всю вероятность, остальным досталось ничего. Чему равна её энтропия?'
  explanation: 'H = −Σ p·log p неотрицательна, и её минимум — ноль — достигается ровно на детерминированном распределении. Для сравнения: распределение 97%, 1%, 1%, 1% даёт около 0.17 — исследование почти исчезло, но формально ещё живо.'
  kind: choice
  options:
    - Достигает максимума для этого числа действий
    - 'Обращается в ноль: у нулевых вероятностей вклад p·log p стремится к нулю, а у единичной логарифм равен нулю'
    - Становится отрицательной
  correct: 1
  id: 009-entropy-measure-3
  fingerprint: d6a92849
