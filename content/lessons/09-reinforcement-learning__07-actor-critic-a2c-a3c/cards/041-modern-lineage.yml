- concept: GRPO заменяет обученного критика групповым baseline по нескольким сэмплам на один запрос
  question: Чем в GRPO заменена обученная функция ценности, служащая baseline в A2C?
  explanation: GRPO сэмплирует несколько ответов на один промпт и сравнивает результат каждого с результатами соседей по группе. Роль baseline выполняет группа, поэтому отдельная сеть-критик не нужна — остальной каркас actor-critic сохраняется.
  kind: choice
  options:
    - Скользящим средним награды по всему обучению
    - Средним результатом группы ответов, сгенерированных на один и тот же запрос
    - Значением TD-остатка предыдущего шага
    - Энтропией текущей политики
  correct: 1
  id: 041-modern-lineage-1
  fingerprint: 111fdc70
- concept: V-trace в IMPALA компенсирует рассогласование между политикой актёров-сборщиков и политикой learner
  question: В IMPALA много актёров собирают опыт параллельно, пока отдельный learner обучается. Какую проблему решает поправка V-trace?
  explanation: Пока пакет доезжает до learner, тот успевает обновиться, и данные оказываются off-policy. V-trace взвешивает и обрезает вклад таких переходов, делая цели критика и сигнал актёра корректными при умеренном отставании.
  kind: choice
  options:
    - Слишком большую дисперсию отдач в длинных эпизодах
    - Переполнение при экспоненте больших логитов
    - 'Рассогласование: данные пришли от политики, которая уже отстала от политики learner'
    - Отсутствие критика в архитектуре
  correct: 2
  id: 041-modern-lineage-2
  fingerprint: bc0934fb
- concept: семейство современных методов различается источником преимущества и способом ограничить сдвиг политики
  question: PPO, IMPALA, SAC и GRPO описывают как «actor-critic плюс одна идея». Какие два вопроса стоит задать про каждый метод, чтобы быстро уложить его в этот каркас?
  explanation: Каркас общий, различаются оценка преимущества и обращение с несвежими данными. Слово «advantage» в статье — маркер actor-critic.
  kind: open
  reference: 'Первый: откуда берётся преимущество (сигнал для актёра) — от обученного критика по n-step/GAE, от критика с off-policy поправкой, из мягкой ценности с энтропией в цели или вовсе из сравнения внутри группы сэмплов без критика. Второй: чем ограничен сдвиг политики при использовании данных, собранных не текущей политикой — клиппинг importance-отношения ради нескольких эпох (PPO), V-trace для устаревших данных распределённых актёров (IMPALA), replay buffer с off-policy критиком (SAC), либо строгий on-policy сбор. Ответив на эти два вопроса, метод укладывается в схему «собрать опыт, оценить преимущество, сдвинуть политику».'
  id: 041-modern-lineage-3
  fingerprint: 5f2fbb38
