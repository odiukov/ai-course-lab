- concept: 'награда перехода не входит в обновление напрямую: её вклад уже учтён в заранее посчитанных преимуществах и целях критика'
  question: Почему функция обновления actor-critic может вообще не использовать награду, лежащую в записи перехода?
  explanation: 'Награды превращаются в отдачи и преимущества на предыдущем этапе — обратным проходом по rollout. В самом обновлении фигурируют уже готовые числа: преимущество как множитель для актёра и отдача как цель регрессии критика.'
  kind: choice
  options:
    - Её вклад уже вошёл в преимущества и цели критика, посчитанные до вызова функции
    - Награда нужна только для логирования и никогда не влияет на градиент
    - Награда подставляется вместо learning rate актёра
  correct: 0
