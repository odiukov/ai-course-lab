- concept: переходы, преимущества и цели критика выровнены по одному индексу; перестановка разрывает связь состояния с его сигналом
  question: Что именно сломается, если перемешать порядок переходов rollout, но оставить массивы преимуществ и отдач в прежнем порядке?
  explanation: Тихий баг такого рода не даёт исключения, а проявляется как «обучение не сходится». Проверка — идти по индексам одним циклом и брать все величины по одному и тому же индексу.
  kind: open
  reference: 'Преимущество и отдача адресуются тем же индексом, что и переход. После перестановки состояние получит чужой сигнал: актёр усилит выбранное здесь действие по преимуществу другого шага, а критик будет подгонять оценку этого состояния под отдачу совсем другого. Код не упадёт и формы массивов сойдутся, обучение просто пойдёт по бессмысленному градиенту. Перемешивать можно только согласованно — переставляя все три последовательности одной и той же перестановкой.'
