- concept: нормализация делает величину обновления независимой от общего масштаба преимуществ в батче
  question: 'Батч A содержит преимущества [5, 7, 9], батч B — те же переходы, но при наградах, увеличенных в семь раз: [35, 49, 63]. Что произойдёт после приведения преимуществ к нулевому среднему и единичному стандартному отклонению?'
  explanation: 'z-преобразование инвариантно к умножению всего набора на положительную константу: и среднее, и стандартное отклонение масштабируются одинаково. Оба батча дают одни и те же нормированные значения, поэтому размер шага задаёт learning rate, а не случайный масштаб наград конкретного rollout.'
  kind: choice
  options:
    - Нормированные значения обоих батчей совпадут, поэтому шаг оптимизатора перестанет зависеть от масштаба наград
    - Батч B по-прежнему даст обновление примерно в семь раз сильнее
    - Батч B даст обновление в семь раз слабее — деление на большое отклонение переусердствует
    - Совпадут только знаки, но не величины
  correct: 0
  id: 027-adv-normalization-1
  fingerprint: 9e58e28c
- concept: после нормализации знак сигнала определяется сравнением со средним по батчу, а не абсолютной выгодностью действия
  question: Все преимущества в батче строго положительны. Что произойдёт с действием, чьё преимущество ниже среднего по батчу, после нормализации преимуществ?
  explanation: 'Вычитание среднего делает сигнал относительным: всё, что хуже типичного результата в батче, уходит в минус. Это меняет содержание обновления — актёр перестаёт усиливать все действия подряд просто потому, что критик систематически занижает ценность.'
  kind: choice
  options:
    - Оно получит отрицательный множитель, и его вероятность будет снижена
    - Оно получит положительный, но меньший множитель, и его вероятность всё равно вырастет
    - Оно получит нулевой множитель и не изменит вероятность
    - 'Его множитель не изменится: нормализация трогает только слишком большие значения'
  correct: 0
  id: 027-adv-normalization-2
  fingerprint: 01af6aae
- concept: нормализация меняет масштаб сигнала, но не повышает точность оценки преимущества
  question: Критик сильно недообучен и систематически занижает ценность состояний. Что даст нормализация преимуществ внутри батча?
  explanation: Нормализация отвечает на вопрос «насколько сильно этот батч двигает параметры», а не «насколько верно посчитано преимущество». Ошибки ранжирования действий внутри батча она сохраняет — их лечит только обучение критика.
  kind: choice
  options:
    - Уберёт общий сдвиг внутри батча и стабилизирует масштаб шага, но не сделает сами оценки преимуществ точнее
    - Исправит ошибку критика, потому что среднее преимущество станет нулевым
    - Полностью устранит смещение, внесённое bootstrap-оценками
    - 'Ничего не даст: при смещённом критике нормализация математически неопределена'
  correct: 0
  id: 027-adv-normalization-3
  fingerprint: ed0f72f7
