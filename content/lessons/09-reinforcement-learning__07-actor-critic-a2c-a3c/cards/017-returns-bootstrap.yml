- concept: при истинном терминале хвостовое значение обратного прохода равно нулю, при обрезке rollout — оценке критика
  question: Rollout закончился. В каком случае в обратный расчёт отдач подставляется ноль вместо оценки критика для состояния за концом фрагмента?
  explanation: 'Терминал означает, что будущих наград физически не будет — ценность за ним равна нулю. Обрезка по длине rollout ничего не говорит о среде: агент мог продолжать набирать награду, и подстановка нуля систематически занижала бы отдачи пограничных состояний. Поэтому реализации хранят флаги done и truncated отдельно.'
  kind: choice
  options:
    - Всегда, когда rollout закончился — независимо от причины
    - Только если эпизод действительно завершился терминальным состоянием
    - Только если последняя награда была нулевой
    - Только если критик ещё не обучен и его оценке нельзя доверять
  correct: 1
  id: 017-returns-bootstrap-1
  fingerprint: dd3e9fa7
- concept: цель критика восстанавливается как преимущество плюс текущая оценка ценности того же состояния
  question: Дополни строку, в которой из посчитанных преимуществ получают цели для регрессии критика.
  explanation: Преимущество — это разность «сколько получилось» и «сколько ожидал критик». Прибавив обратно ожидание V(s_t), получаем оценку самой отдачи, которая и служит целью value-loss. Так один обратный проход выдаёт сразу и множитель для ∇ log π, и цель регрессии, без второго прохода по траектории.
  kind: cloze
