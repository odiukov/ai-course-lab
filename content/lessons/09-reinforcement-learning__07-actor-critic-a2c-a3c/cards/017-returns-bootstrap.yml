- concept: bootstrap позволяет обучаться на фрагментах фиксированной длины, не дожидаясь конца эпизода
  question: Зачем в конце обрезанного rollout подставляют оценку критика вместо того, чтобы просто собирать полные эпизоды?
  explanation: 'Главное: bootstrap делает длину rollout свободным параметром (T шагов × N сред = предсказуемый батч) ценой опоры на оценку критика.'
  kind: open
  reference: 'Полные эпизоды могут быть очень длинными или вообще бесконечными, а их длина плавает от прохода к проходу — батчи получаются неровными, обновления редкими, а задержка между действием и обучением большой. Bootstrap разрывает эту зависимость: хвост будущего за границей фрагмента заменяется одним числом V(s_T), и обучать можно на фрагментах фиксированной длины из многих параллельных сред. Плата — смещение: качество отдач ограничено точностью критика на границе.'
  id: 017-returns-bootstrap-3
  fingerprint: 6a34b866
