- concept: вычитание baseline не меняет матожидание градиента, потому что вероятности действий суммируются в константу
  question: Почему вычитание baseline b(s) из отдачи не смещает оценку градиента политики?
  explanation: 'E[b(s)∇log π] = b(s)·∇Σπ(a|s) = b(s)·∇(константа) = 0. Это точное равенство, а не приближение: величина b(s) может быть какой угодно большой.'
  kind: choice
  options:
    - Потому что сумма вероятностей всех действий в состоянии равна константе, а градиент константы равен нулю — добавленный член имеет нулевое среднее
    - Потому что b(s) обычно мал по сравнению с отдачей, и его вкладом можно пренебречь
    - Потому что baseline вычитается из всех действий одинаково, а значит логарифм политики не меняется
  correct: 0
  id: 003-baseline-1
  fingerprint: 65bbe037
- concept: baseline обязан зависеть только от состояния, иначе градиент смещается
  question: Какая из величин НЕ может служить корректным baseline?
  explanation: Доказательство нулевого вклада опирается на то, что b выносится за сумму по действиям. Если b зависит от a, вынести его нельзя, и он может систематически подталкивать одни действия вверх, а другие вниз.
  kind: choice
  options:
    - Средняя отдача, наблюдавшаяся ранее в этом состоянии
    - Оценка ценности состояния V̂(s), выученная отдельной сетью
    - Величина, зависящая от того, какое действие было выбрано в этом состоянии
  correct: 2
  id: 003-baseline-2
  fingerprint: 712a9225
- concept: baseline, близкий к типичной отдаче, максимально снижает дисперсию
  question: Почему в качестве baseline выгодно брать величину, близкую к типичной отдаче из данного состояния? Объясните своими словами.
  explanation: Ключ в том, что baseline влияет только на разброс, а не на среднее направление. Чем ближе он к обычному результату, тем меньше остаточные числа и тем чётче в них видна разница между действиями.
  kind: open
  reference: Матожидание градиента не зависит от выбора b(s), поэтому b подбирают ради дисперсии. Если b близок к типичной отдаче, то после вычитания остаются небольшие отклонения от обычного результата вместо больших сырых чисел. Множитель при ∇ log π становится мал по модулю и меняет знак в зависимости от того, лучше или хуже обычного оказался результат, — разброс обновлений падает. Плохой baseline (например, далёкий от типичной отдачи) оставляет большой общий сдвиг, который одинаково тянет вверх и хорошие, и плохие действия.
  id: 003-baseline-3
  fingerprint: dde1c51a
