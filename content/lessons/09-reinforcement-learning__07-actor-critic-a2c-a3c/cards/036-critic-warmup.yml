- concept: критику дают фору прогревом или более медленным learning rate актёра; точность критику при старте не нужна
  question: Какая пара мер защищает актёра от случайного baseline в начале обучения?
  explanation: 'Обе меры дают критику фору: он либо учится один несколько сотен шагов, либо просто идёт быстрее актёра. Точности не требуется — критику достаточно перестать быть генератором случайных чисел.'
  kind: choice
  options:
    - Прогреть критика несколько сотен шагов с выключенным градиентом актёра либо дать актёру заметно меньший learning rate, чем критику
    - Увеличить learning rate актёра, чтобы он быстрее вышел из зоны плохих решений
    - Дождаться, пока критик станет точным до долей процента, и только затем включать policy-градиент
