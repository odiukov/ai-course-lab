- concept: несмещённость baseline в среднем не защищает от разрушительных обновлений на конечном первом батче
  question: Известно, что вычитание baseline не меняет матожидание градиента политики. Почему тогда случайно инициализированный критик всё-таки вредит обучению?
  explanation: Несмещённость — свойство среднего по бесконечному числу выборок. На конечном батче преимущество порядка сотни умножает шум на большой множитель, и актёр успевает закрепить случайные плохие решения раньше, чем критик научится.
  kind: choice
  options:
    - 'Батч конечен и случаен: огромные ошибочные преимущества превращают его случайности в большие обновления политики'
    - Случайный baseline делает матожидание градиента смещённым, поэтому направление обучения неверно
    - Случайный baseline обнуляет градиент, и политика вообще перестаёт обновляться
