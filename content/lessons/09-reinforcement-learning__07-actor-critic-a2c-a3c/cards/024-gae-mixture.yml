- concept: GAE считается как сумма TD-остатков с геометрически убывающими весами (γλ)^l
  question: Три подряд идущих TD-остатка равны 6, 8 и 12, произведение γλ равно 0.5. Чему равно GAE-преимущество для первого из этих моментов, если дальнейшие остатки считать нулевыми?
  explanation: 6 + 0.5·8 + 0.25·12 = 6 + 4 + 3 = 13. Каждый следующий остаток входит с дополнительным множителем γλ, так что вклад дальних шагов затухает геометрически.
  kind: numeric
  answer: 13
  tolerance: 0.01
  id: 024-gae-mixture-1
  fingerprint: 9c2340b5
- concept: при нулевом λ в сумме GAE выживает только текущий TD-остаток
  question: Инженер выставил λ в ноль. Во что превращается GAE-преимущество?
  explanation: 'При λ = 0 множитель (γλ)^l равен единице только для l = 0 и нулю дальше. Остаётся δ_t — оценка с минимальным разбросом и максимальной зависимостью от критика. Первое слагаемое при этом сохраняется полностью: у него показатель нулевой.'
  kind: choice
  options:
    - 'В одиночный TD-остаток текущего шага: все слагаемые с ненулевым сдвигом обнуляются множителем (γλ)^l'
    - В сумму всех остатков с одинаковыми весами, потому что затухание пропало
    - В ноль, потому что каждое слагаемое умножается на λ
