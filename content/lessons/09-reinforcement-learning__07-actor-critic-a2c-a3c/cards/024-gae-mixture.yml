- concept: GAE усредняет все горизонты сразу с затухающими весами вместо выбора одного n
  question: Чем подход GAE отличается от выбора одного горизонта n?
  explanation: 'Вместо ставки на один горизонт GAE смешивает их все: короткие входят с полным весом, дальние — со всё более слабым. Настраивается не сам горизонт, а темп затухания, поэтому оценка перестаёт скачкообразно зависеть от выбора конкретного n. Оценки критика при этом остаются — они внутри каждого δ.'
  kind: choice
  options:
    - GAE берёт взвешенное среднее по всем n-шаговым преимуществам сразу, а λ задаёт скорость затухания весов дальних горизонтов
    - GAE подбирает оптимальное n автоматически по данным и дальше использует только его
    - GAE отказывается от оценок критика и опирается только на наблюдаемые награды
  correct: 0
