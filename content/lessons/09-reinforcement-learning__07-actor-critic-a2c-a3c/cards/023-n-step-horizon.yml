- concept: Monte Carlo получается только при достижении терминала, а не при большом горизонте в обрезанном rollout
  question: Rollout обрезан на 64-м переходе, эпизод при этом не закончился, и горизонт взят на всю длину фрагмента. Это Monte Carlo?
  explanation: 'MC означает, что прогноза не осталось совсем — так бывает только когда горизонт упёрся в терминал и будущей ценности после него нет. Обрезка rollout терминалом не является: жизнь эпизода продолжается, и её ценность приходится подставлять оценкой критика.'
  kind: choice
  options:
    - 'Нет: на границе фрагмента остаётся неучтённое продолжение, поэтому там всё равно нужна оценка критика'
    - 'Да: 64 перехода достаточно, чтобы вклад остатка стал пренебрежимо мал при любом дисконте'
    - 'Да: MC определяется числом наблюдаемых наград, а не тем, закончился ли эпизод'
  correct: 0
