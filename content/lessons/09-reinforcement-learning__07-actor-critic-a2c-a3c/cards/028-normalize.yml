- concept: малая константа в знаменателе спасает нормализацию при нулевом разбросе значений
  question: Заполни пропуск так, чтобы функция не выдавала NaN на батче из одинаковых значений.
  explanation: Если все преимущества совпадают, стандартное отклонение равно нулю и деление даёт NaN, который мгновенно расползается по всем параметрам сети. Маленькая добавка в знаменателе превращает такой батч в набор значений, близких к нулю — то есть в отсутствие сигнала, что и правильно.
  kind: cloze
  template: return (values - values.mean()) / (values.std() + ___)
  answer: epsilon
  accept:
    - eps
    - epsilon
    - self.epsilon
  id: 028-normalize-1
  fingerprint: eacc52df
- concept: нормированное значение равно отклонению элемента от среднего, делённому на стандартное отклонение всего набора
  question: Функция нормализации получает набор [6, 9, 15, 18]. Чему примерно равно нормированное значение элемента 18? Стандартное отклонение считается по всему набору с делением на число элементов.
  explanation: Среднее 12, отклонения −6, −3, 3, 6, дисперсия (36+9+9+36)/4 = 22.5, стандартное отклонение ≈ 4.743. Значит (18 − 12)/4.743 ≈ 1.265. Статистики берутся по всему набору сразу — поэлементный расчёт бессмыслен, каждый элемент дал бы ноль.
  kind: numeric
  answer: 1.265
  tolerance: 0.02
  id: 028-normalize-2
  fingerprint: fea21414
