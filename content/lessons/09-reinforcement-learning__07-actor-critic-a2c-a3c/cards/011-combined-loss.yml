- concept: минус перед энтропийным членом означает, что оптимизатор максимизирует энтропию
  question: В общей функции потерь actor-critic энтропийный член входит со знаком минус. Что это даёт оптимизатору, который минимизирует суммарный loss?
  explanation: 'Минимизировать −c_e·H — то же самое, что максимизировать H. Поэтому член называют бонусом: он платит политике за то, что она не схлопывается. При c_e = 0.01 и энтропии 1.4 бонус равен всего 0.014 — добавка крошечная, но её хватает, чтобы придержать преждевременную детерминированность.'
  kind: choice
  options:
    - Он давит энтропию вниз, ускоряя схождение политики к одному действию
    - 'Он поощряет высокую энтропию: чем она больше, тем меньше суммарный loss'
    - Энтропия не влияет на градиент, это чисто диагностическая величина
  correct: 1
  id: 011-combined-loss-1
  fingerprint: 44a0f105
- concept: суммарный loss складывается из policy-члена, c_v·ошибки критика и вычитаемого c_e·энтропии
  question: 'На батче получили: policy-член −E[A·logπ] равен 0.8, средняя квадратичная ошибка критика равна 3.0, средняя энтропия равна 1.2. Коэффициенты c_v = 0.25, c_e = 0.02. Чему равен суммарный loss?'
  explanation: 'L = 0.8 + 0.25·3.0 − 0.02·1.2 = 0.8 + 0.75 − 0.024 ≈ 1.53. Видно и соотношение сил: регрессия критика вносит основной вклад, а энтропийный бонус — сотые доли, он лишь мягко подталкивает политику.'
  kind: numeric
  answer: 1.526
  tolerance: 0.02
  id: 011-combined-loss-2
  fingerprint: 9d1249a5
- concept: чрезмерный вес энтропии мешает политике сосредоточиться на выгодных действиях
  question: Коэффициент энтропийного бонуса выставили в 0.4 вместо типичного маленького значения. Что вероятнее всего произойдёт с обучением?
  explanation: Энтропийный бонус конкурирует с policy-градиентом. Когда он весит сравнимо с преимуществами, выгода от «делать хорошее действие чаще» перебивается платой за разнообразие, и агент продолжает метаться. Обратный перекос — почти нулевой c_e — даёт раннее схлопывание. Канонический старт c_e ≈ 0.01 держит бонус на уровне лёгкого напоминания.
  kind: choice
  options:
    - Политика останется близкой к равномерной и почти не начнёт эксплуатировать выгодные действия
    - Критик перестанет обучаться, потому что его член исчезнет из градиента
    - Политика мгновенно станет детерминированной
  correct: 0
  id: 011-combined-loss-3
  fingerprint: 1c4ec12c
