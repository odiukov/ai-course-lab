- concept: нижняя граница ставится только под логарифм, множителем остаётся исходная вероятность
  question: В реализации энтропии вероятности ограничивают снизу маленьким положительным числом перед взятием логарифма. Почему множитель перед логарифмом при этом оставляют исходным?
  explanation: Клип нужен ровно для того, чтобы log не получил ноль. Если подменить и множитель, слагаемое станет eps·log(eps) вместо нуля — маленькая, но систематическая ошибка на каждом нулевом действии. Предел p·log p при p к нулю равен нулю, и код должен это воспроизводить.
  kind: choice
  options:
    - Иначе действие с нулевой вероятностью внесло бы в сумму ненулевой вклад и завысило энтропию
    - Иначе сумма вероятностей перестанет равняться единице
    - Иначе логарифм переполнится на больших вероятностях
