- concept: для пакета состояний суммирование идёт по оси действий, на выходе по числу на состояние
  question: 'На вход функции энтропии пришёл массив вероятностей формы (32, 6): 32 состояния, 6 действий. Какой формы должен быть результат?'
  explanation: Энтропия определена для распределения, а распределение здесь лежит вдоль оси действий. Схлопывать нужно её, оставляя батч нетронутым. Свернуть всё в скаляр можно позже, при подсчёте энтропийного бонуса в лоссе, — но это уже усреднение, а не сама энтропия.
  kind: choice
  options:
    - (32,) — своя энтропия у каждого состояния
    - (6,) — своя энтропия у каждого действия
    - Скаляр — одна энтропия на весь пакет
