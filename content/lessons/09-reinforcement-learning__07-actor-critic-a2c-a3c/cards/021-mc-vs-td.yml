- concept: ошибка критика в оценке следующего состояния переносится в TD-остаток с множителем, равным дисконту
  question: Критик систематически завышает ценность следующего состояния на 6, а оценку текущего состояния даёт верно. Дисконт равен 0.5. На сколько в среднем завышен TD-остаток?
  explanation: 'В δ = r + γ·V(s'') − V(s) ошибка следующего состояния входит с множителем γ: 0.5·6 = 3. Это и есть смещение — оно одинаково на каждом переходе и никаким усреднением не уходит.'
  kind: numeric
  answer: 3
  tolerance: 0.01
