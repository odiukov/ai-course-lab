- concept: для завершающего перехода отсутствие будущей ценности выражается нулевой оценкой следующего состояния, передаваемой снаружи
  question: 'Переход завершает эпизод: продолжения после него нет. Как это обычно отражается в расчёте TD-остатка, если сигнатура функции принимает только награды, оценки состояний и оценки следующих состояний?'
  explanation: 'После терминала ожидаемая отдача равна нулю, поэтому γ·V(s'') обнуляется. Но без явного признака завершения функция не может отличить терминал от обычного перехода с малой оценкой — угадывать по награде нельзя, а выбрасывать элементы нельзя тем более: выход обязан совпадать с входом по форме и порядку.'
  kind: choice
  options:
    - Вызывающий код подаёт для этого перехода нулевую оценку следующего состояния, и формула работает без изменений
    - Функция сама определяет терминал по нулевой награде и обнуляет член с дисконтом
    - Терминальный переход исключают из массива, поэтому результат короче входа на один элемент
