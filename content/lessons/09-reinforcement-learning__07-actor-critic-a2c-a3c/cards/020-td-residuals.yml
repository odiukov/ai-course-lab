- concept: TD-остаток каждого перехода вычисляется независимо от соседних, поэтому обратный проход по массиву не нужен
  question: Функция дисконтированных отдач обходит rollout от конца к началу. Почему функции TD-остатков такой обход не нужен?
  explanation: 'Отдача накапливается рекуррентно, поэтому её считают справа налево. Остаток же замкнут на один переход: r, V(s_t), V(s_{t+1}). Значит расчёт поэлементный и полностью векторизуемый, а результат сохраняет исходный порядок и форму.'
  kind: choice
  options:
    - Остаток перехода зависит только от его собственных награды и двух оценок, а не от остатка соседнего перехода
    - Потому что TD-остатки всегда неотрицательны и порядок не влияет на знак
    - Потому что дисконт в TD-остатке применяется только один раз, и его можно вынести за весь массив
