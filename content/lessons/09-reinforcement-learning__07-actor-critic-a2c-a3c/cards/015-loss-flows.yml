- concept: градиент каждого слагаемого общего loss доходит только до тех параметров, от которых слагаемое зависит
  question: Общий loss actor-critic состоит из policy-члена, value-члена и энтропийного члена. Какие слагаемые дают ненулевой градиент по параметрам θ актёра?
  explanation: 'Энтропия H(π_θ) — функция выходов актёра, значит тоже двигает θ. Value-член зависит только от φ и до актёра не доходит. Один скаляр не означает одинаковых поправок: градиент суммы = сумма градиентов, каждый по своим параметрам.'
  kind: choice
  options:
    - Policy-член и энтропийный член
    - Только policy-член
    - Все три, потому что loss один скаляр
    - Policy-член и value-член
  correct: 0
  id: 015-loss-flows-1
  fingerprint: ca3247ca
- concept: в policy-члене преимущество используется как константа, критик обучается только через value-loss
  question: В policy-члене −A_t · log π_θ(a_t|s_t) преимущество A_t посчитано с участием V_φ. Как этот член влияет на параметры критика φ?
  explanation: Преимущество — вес обучающего сигнала актёра, а не путь для обучения критика (в коде это detach/stop-gradient). Критик учится только своей регрессией к целевой отдаче.
  kind: choice
  options:
    - 'Никак: A_t берётся как готовое число, градиент через него не пропускают'
    - Он обновляет φ сильнее, чем value-loss, потому что стоит первым
    - Он обновляет φ, но с противоположным знаком относительно value-loss
    - Он заменяет value-loss, если преимущество считается по MC
  correct: 0
  id: 015-loss-flows-2
  fingerprint: 020dc1f8
- concept: коэффициенты c_v и c_e задают относительную силу поправок критика и исследования внутри одного шага оптимизатора
  question: Объясни своими словами, что произойдёт с обучением, если поднять коэффициент при value-loss в несколько раз, и почему это влияет на актёра лишь косвенно.
  explanation: 'Каноническое c_v ≈ 0.5 — компромисс: критик должен догонять политику, но не перетягивать общий шаг на себя, особенно когда актёр и критик делят один ствол сети.'
  kind: open
  reference: 'Больший c_v увеличивает вклад градиента ошибки критика в общий шаг: параметры φ двигаются быстрее (при общем оптимизаторе и общем стволе сети — заметно быстрее, вплоть до дестабилизации). Напрямую θ этот член не трогает. На актёра влияние приходит через следующие итерации: точнее (или, при слишком крупном шаге, нестабильнее) становится V_φ, а значит и преимущества, из которых собирается policy-градиент.'
  id: 015-loss-flows-3
  fingerprint: 6326a225
