- concept: преимущество текущего шага равно его TD-невязке плюс приглушённое множителем γλ преимущество следующего шага
  question: В rollout из трёх переходов TD-невязки равны [3, 3, 3], произведение γ·λ равно 0.5, за границей rollout накопленного преимущества нет. Чему равно GAE-преимущество самого первого перехода?
  explanation: 'Считаем с конца: последний шаг даёт 3. Предыдущий: 3 + 0.5·3 = 4.5. Первый: 3 + 0.5·4.5 = 5.25. Каждый шаг переиспользует уже собранный итог соседа, а не пересчитывает весь хвост.'
  kind: numeric
  answer: 5.25
  tolerance: 0.02
  id: 025-gae-recurrence-1
  fingerprint: 157c4f09
- concept: накопитель будущего преимущества обновляется на каждой позиции при движении от конца rollout к началу
  question: Расставь операции вычисления GAE по всему rollout в правильном порядке.
  explanation: Рекурсия A_t = δ_t + γλ·A_{t+1} требует уже готового значения для следующего момента, поэтому обход идёт справа налево, а накопитель хранит ровно один итог соседа. Один проход вместо повторного суммирования хвоста для каждой позиции.
  kind: order
  items:
    - завести накопитель будущего преимущества и приравнять его нулю
    - встать на последнюю позицию rollout
    - вычислить TD-невязку текущей позиции
    - прибавить к невязке накопитель, умноженный на γλ — это преимущество текущей позиции
    - положить полученное значение в накопитель и сдвинуться на одну позицию назад
  id: 025-gae-recurrence-2
  fingerprint: 219922b3
- concept: нулевая инициализация накопителя не задаёт нулевую ценность состояния за границей rollout
  question: Rollout оборван по лимиту длины, эпизод не завершён. Накопитель будущего преимущества в обратном проходе всё равно стартует с нуля. Почему это не приравнивает ценность состояния за границей rollout к нулю?
  explanation: Накопитель хранит только сумму будущих невязок внутри окна — их за границей действительно нет. Оценка продолжения входит в δ последнего перехода как γ·V(s_последнего), поэтому обрыв rollout и настоящий терминал различаются именно этой δ, а не стартовым значением накопителя.
  kind: choice
  options:
    - Потому что ценность продолжения уже учтена внутри TD-невязки последнего перехода через bootstrap-оценку критика
    - Потому что нулевой старт компенсируется делением на λ на первой итерации
    - Потому что ценность за границей всегда пренебрежимо мала из-за дисконта
    - Потому что при обрыве rollout преимущество последнего шага не используется в обучении
  correct: 0
  id: 025-gae-recurrence-3
  fingerprint: d60ba767
