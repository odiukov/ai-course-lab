- concept: цель критика собирают из сырого преимущества, нормализованное годится только для актёра
  question: В обучающем контуре преимущества нормализуют к нулевому среднему и единичному разбросу. Из какого преимущества нужно собирать цель для регрессии критика?
  explanation: Нормализация выкидывает абсолютный масштаб и общий сдвиг батча, а критику нужна именно абсолютная величина отдачи в единицах наград. Актёру достаточно относительного сравнения действий, поэтому нормированные преимущества идут только в policy-член.
  kind: choice
  options:
    - 'Из исходного, ненормализованного: нормированное выражено в масштабе батча и не восстанавливает отдачу'
    - 'Из нормализованного: критик обучится стабильнее по той же причине, что и актёр'
    - Из нормализованного, но умноженного обратно на стандартное отклонение батча — это эквивалентно
    - 'Безразлично: сложение с оценкой ценности возвращает верную цель в обоих случаях'
  correct: 0
  id: 029-value-targets-1
  fingerprint: 289edc37
- concept: цель для value-loss отсоединяют от графа, иначе критик подгоняет цель под собственный прогноз
  question: Цель критика собирают, прибавляя к преимуществу текущую оценку ценности того же состояния. Почему через эту цель не пропускают градиент?
  explanation: Цель содержит V_φ, то есть выход самого критика. Если пустить туда градиент, минимизировать квадрат ошибки можно, подтягивая цель к прогнозу — тривиальное решение без обучения. Поэтому цель считают константой (detach).
  kind: choice
  options:
    - Иначе критик уменьшал бы ошибку, двигая саму цель к своему прогнозу, а не улучшая предсказание
    - Иначе градиент цели обнулил бы градиент актёра из-за общей суммы loss
    - Иначе цель начала бы зависеть от параметров актёра и обучение стало бы off-policy
    - Иначе появилось бы деление на ноль при нулевом преимуществе
  correct: 0
  id: 029-value-targets-2
  fingerprint: 5f0c395e
- concept: advantage — поправка относительно текущей оценки, а не полная ценность состояния
  question: Объясни своими словами, почему нельзя обучать критика предсказывать сам advantage вместо полной отдачи.
  explanation: 'Разные роли требуют разных величин: актёру нужна относительная поправка (усилить или ослабить действие), критику — абсолютная оценка состояния. Обучение критика на поправке схлопывает его в нуль.'
  kind: open
  reference: 'Advantage — это разность между наблюдённым результатом и текущей оценкой критика, то есть поправка к его же прогнозу. Критик должен предсказывать полную ожидаемую отдачу из состояния: именно она нужна как baseline и как bootstrap-значение на конце rollout. Если обучать его на advantage, целью станет ошибка, которая при верном критике равна нулю, — сеть сойдётся к предсказанию нуля, baseline потеряет смысл, а преимущества выродятся в сырые отдачи с прежней дисперсией. Поэтому цель восстанавливают до абсолютной величины, а актёру отдают именно поправку.'
  id: 029-value-targets-3
  fingerprint: 23e52dae
