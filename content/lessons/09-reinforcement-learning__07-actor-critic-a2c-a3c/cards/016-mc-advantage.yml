- concept: MC-преимущество несмещено, TD-преимущество смещено, потому что опирается на текущую оценку критика
  question: Критик обучен плохо и систематически завышает ценность состояний. Какая оценка преимущества пострадает от этого сильнее по смещению?
  explanation: MC берёт настоящую сумму наград, поэтому остаётся несмещённой при любом критике — вычитаемое V(s) играет роль baseline и матожидание не сдвигает. TD же заменяет весь хвост будущего на γV(s'), и ошибка критика прямо протекает в сигнал для актёра. Плата за несмещённость MC — заметно большая дисперсия.
  kind: choice
  options:
    - 'MC: A = G_t − V(s_t), потому что она использует полную отдачу'
    - 'TD: A = r + γV(s'') − V(s), потому что она подставляет оценку критика вместо будущих наград'
    - 'Обе одинаково: обе вычитают V(s)'
    - 'Ни одна: смещение критика сокращается в разности'
  correct: 1
  id: 016-mc-advantage-1
  fingerprint: 3f2df24e
- concept: вклад отдалённой награды в отдачу ослабляется степенью дисконта
  question: γ = 0.9. Награда 50 приходит через 8 шагов после действия. Каким вкладом она входит в дисконтированную отдачу этого действия?
  explanation: '0.9^8 ≈ 0.4305, вклад = 50 · 0.4305 ≈ 21.5. MC-отдача действительно доносит далёкую награду до раннего действия, но дисконт постепенно её приглушает: при γ = 0.9 через 8 шагов остаётся меньше половины, а через несколько десятков шагов — почти ничего.'
  kind: numeric
  answer: 21.52
  tolerance: 0.3
  id: 016-mc-advantage-2
  fingerprint: 6a97f543
- concept: MC-преимущество вычислимо только после завершения эпизода, TD — сразу после одного перехода
  question: Среда без естественного конца (continuing task), обучение идёт непрерывно. Почему чистое MC-преимущество здесь неприменимо?
  explanation: 'MC ждёт терминала: пока эпизод не закончился, G_t неизвестна. TD и n-step обновляются онлайн — им хватает одного перехода или короткого фрагмента, а хвост будущего заменяет оценка критика.'
  kind: choice
  options:
    - Оно требует полной отдачи до конца эпизода, а конца нет — считать G_t не из чего
    - Оно требует, чтобы все награды были положительными
    - Оно не позволяет вычитать оценку критика
    - Оно работает только при γ = 1
  correct: 0
  id: 016-mc-advantage-3
  fingerprint: f8cf8ee9
