- concept: порядок операций численно устойчивого softmax
  question: Расставь шаги численно устойчивой реализации softmax в правильном порядке.
  explanation: Сдвиг на максимум делается до экспоненты — в этом весь смысл приёма. После сдвига наибольший показатель равен нулю, экспонента не превышает единицы, переполнение невозможно. Деление на сумму идёт последним.
  kind: order
  items:
    - Найти максимальный логит в наборе
    - Вычесть максимум из каждого логита
    - Взять экспоненту каждого сдвинутого логита
    - Разделить каждую экспоненту на сумму всех экспонент
  id: 008-softmax-1
  fingerprint: 72570ba5
- concept: softmax инвариантен к сдвигу всех логитов на общую константу
  question: Объясни своими словами, почему вычитание одной и той же константы из всех логитов не меняет выход softmax.
  explanation: 'Ключ — общий множитель e^{-c} в числителе и знаменателе. Для логитов 1000, 999, 998 сдвиг даёт 0, −1, −2: вероятности те же, а экспоненты стали безопасными.'
  kind: open
  reference: 'После сдвига на c каждая экспонента умножается на общий множитель e^{-c}: числитель становится e^{z_i}·e^{-c}, знаменатель — сумма e^{z_j}·e^{-c}. Общий множитель сокращается, и дробь остаётся прежней. Softmax реагирует только на разности логитов, поэтому одинаковый сдвиг всей группы для него невидим — этим и пользуются для численной устойчивости.'
  id: 008-softmax-2
  fingerprint: 7880234d
- concept: прямая экспонента больших логитов даёт переполнение и NaN
  question: Реализация softmax берёт экспоненту напрямую, без вычитания максимума. На вход пришли логиты около 900. Что произойдёт?
  explanation: 'Экспонента от нескольких сотен выходит за диапазон чисел с плавающей точкой. Числитель и знаменатель становятся Infinity, их отношение — NaN, и весь батч отравляется. Сдвиг на максимум устраняет проблему бесплатно: значения превращаются в 0, −1, −2 и т.д., а вероятности не меняются.'
  kind: choice
  options:
    - Экспоненты переполнятся в Infinity, а деление Infinity на Infinity даст NaN
    - Результат корректен, просто округлится до нескольких знаков
    - Получится равномерное распределение, потому что все значения велики
  correct: 0
  id: 008-softmax-3
  fingerprint: 9dffad30
