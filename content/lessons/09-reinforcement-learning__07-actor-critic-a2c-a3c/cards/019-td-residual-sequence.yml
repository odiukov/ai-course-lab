- concept: TD-остаток равен немедленной награде плюс дисконтированная оценка следующего состояния минус оценка текущего
  question: Критик оценивает текущее состояние в 20, а следующее — в 28. За переход агент получил награду 3, дисконт равен 0.5. Чему равен TD-остаток этого перехода?
  explanation: 'δ = r + γ·V(s'') − V(s) = 3 + 0.5·28 − 20 = 3 + 14 − 20 = −3. Отрицательный остаток: несмотря на награду 3, прогноз после перехода (17) оказался хуже прежнего ожидания (20).'
  kind: numeric
  answer: -3
  tolerance: 0.01
  id: 019-td-residual-sequence-1
  fingerprint: 3e3c56ef
- concept: знак TD-остатка показывает, улучшил или ухудшил один переход прежний прогноз критика
  question: Агент сделал один переход, TD-остаток получился отрицательным. Что это говорит актёру?
  explanation: 'δ сравнивает две вещи: что критик ожидал из s и что обнаружилось через один шаг (r + γ·V(s'')). Награда может быть и положительной — если новая оценка упала сильнее, δ всё равно отрицателен. И δ оценивает переход, а не состояние: V(s) стоит по обе стороны сравнения.'
  kind: choice
  options:
    - Комбинация полученной награды и новой оценки состояния оказалась хуже, чем прежний прогноз критика для исходного состояния
    - Полученная за переход награда была отрицательной
    - Исходное состояние было плохим само по себе, независимо от выбранного действия
  correct: 0
