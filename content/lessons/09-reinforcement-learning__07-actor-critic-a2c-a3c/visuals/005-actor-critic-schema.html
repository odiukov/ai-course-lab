<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Как актёр и критик образуют один обучающий контур</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f9fc;
    --panel: #ffffff;
    --ink: #172033;
    --muted: #526078;
    --border: #cbd5e1;
    --actor-fill: #e8f3ff;
    --actor-stroke: #2878c8;
    --critic-fill: #f1edff;
    --critic-stroke: #7357c8;
    --env-fill: #eaf8f1;
    --env-stroke: #27835a;
    --result-fill: #fff5df;
    --result-stroke: #b76a12;
    --signal-fill: #fff0e8;
    --signal-stroke: #d6532f;
    --forward: #2878c8;
    --estimate: #7357c8;
    --feedback: #d6532f;
    --soft: #e8edf4;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #111722;
      --panel: #182130;
      --ink: #eef4ff;
      --muted: #b5c0d3;
      --border: #405069;
      --actor-fill: #172f49;
      --actor-stroke: #72b7ff;
      --critic-fill: #292342;
      --critic-stroke: #b39cff;
      --env-fill: #17382d;
      --env-stroke: #70d2a6;
      --result-fill: #412f17;
      --result-stroke: #f0ad58;
      --signal-fill: #44251f;
      --signal-stroke: #ff8b6d;
      --forward: #72b7ff;
      --estimate: #b39cff;
      --feedback: #ff8b6d;
      --soft: #2b3749;
    }
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: unset;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  main {
    width: 100%;
    max-width: 1200px;
    margin-inline: auto;
    padding: 12px;
  }

  h1 {
    margin: unset;
    padding: 8px 12px 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-bottom: unset;
    font-size: 22px;
    line-height: normal;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 450px;
    background: var(--panel);
    border: 1px solid var(--border);
  }

  .node {
    stroke-width: 2px;
  }

  .actor {
    fill: var(--actor-fill);
    stroke: var(--actor-stroke);
  }

  .critic {
    fill: var(--critic-fill);
    stroke: var(--critic-stroke);
  }

  .environment {
    fill: var(--env-fill);
    stroke: var(--env-stroke);
  }

  .result {
    fill: var(--result-fill);
    stroke: var(--result-stroke);
  }

  .signal {
    fill: var(--signal-fill);
    stroke: var(--signal-stroke);
  }

  .arrow {
    fill: none;
    stroke-width: 3px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .arrow-forward {
    stroke: var(--forward);
  }

  .arrow-estimate {
    stroke: var(--estimate);
  }

  .arrow-feedback {
    stroke: var(--feedback);
  }

  .head-forward {
    fill: var(--forward);
  }

  .head-estimate {
    fill: var(--estimate);
  }

  .head-feedback {
    fill: var(--feedback);
  }

  .title {
    fill: var(--ink);
    font-size: 20px;
    font-weight: bold;
  }

  .formula {
    fill: var(--ink);
    font-size: 18px;
    font-weight: bold;
  }

  .detail {
    fill: var(--muted);
    font-size: 15px;
  }

  .arrow-label {
    fill: var(--ink);
    font-size: 15px;
    font-weight: bold;
    paint-order: stroke;
    stroke: var(--panel);
    stroke-width: 6px;
    stroke-linejoin: round;
  }

  .feedback-label {
    fill: var(--feedback);
  }

  .estimate-label {
    fill: var(--estimate);
  }

  .fallback {
    fill: var(--ink);
    font-size: 18px;
  }

  .divider {
    stroke: var(--soft);
    stroke-width: 2px;
  }
</style>
</head>
<body>
<main>
  <h1>Как актёр и критик образуют один обучающий контур</h1>
  <svg id="diagram"
       viewBox="0 0 1200 450"
       width="1200"
       height="450"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="diagram-title diagram-description">
    <title id="diagram-title">Общий обучающий контур актёра и критика</title>
    <desc id="diagram-description">Состояние поступает актёру и критику. Актёр выбирает действие, среда возвращает награду и новое состояние. TD-невязка сравнивает результат с ожиданием и обучает актёра и критика.</desc>
  </svg>
</main>

<script>
const diagramData = [
  { x: 24, y: 10 },
  { x: 1, y: 1 },
  {
    zero: 0,
    nodes: [
      {
        kind: "actor",
        x: 250, y: 52, w: 225, h: 112,
        lines: [
          { text: "АКТЁР", x: 362, y: 84, className: "title" },
          { text: "политика  π(a|s)", x: 362, y: 118, className: "formula" },
          { text: "выбирает действие", x: 362, y: 145, className: "detail" }
        ]
      },
      {
        kind: "critic",
        x: 250, y: 258, w: 225, h: 112,
        lines: [
          { text: "КРИТИК", x: 362, y: 290, className: "title" },
          { text: "оценка  V(s)", x: 362, y: 324, className: "formula" },
          { text: "предсказывает результат", x: 362, y: 351, className: "detail" }
        ]
      },
      {
        kind: "environment",
        x: 585, y: 52, w: 225, h: 112,
        lines: [
          { text: "СРЕДА", x: 697, y: 84, className: "title" },
          { text: "выполняет действие a", x: 697, y: 118, className: "formula" },
          { text: "создаёт следующий опыт", x: 697, y: 145, className: "detail" }
        ]
      },
      {
        kind: "result",
        x: 915, y: 138, w: 220, h: 128,
        lines: [
          { text: "РЕЗУЛЬТАТ ШАГА", x: 1025, y: 170, className: "title" },
          { text: "награда r и состояние s′", x: 1025, y: 204, className: "formula" },
          { text: "фактический результат: 7", x: 1025, y: 237, className: "detail" }
        ]
      },
      {
        kind: "signal",
        x: 590, y: 282, w: 310, h: 116,
        lines: [
          { text: "TD-НЕВЯЗКА", x: 745, y: 313, className: "title" },
          { text: "δ = r + γV(s′) − V(s)", x: 745, y: 349, className: "formula" },
          { text: "положительная → чаще, отрицательная → реже", x: 745, y: 379, className: "detail" }
        ]
      }
    ],
    dividers: [
      { x1: 271, y1: 96, x2: 454, y2: 96 },
      { x1: 271, y1: 302, x2: 454, y2: 302 },
      { x1: 606, y1: 96, x2: 789, y2: 96 },
      { x1: 936, y1: 183, x2: 1114, y2: 183 },
      { x1: 611, y1: 327, x2: 879, y2: 327 }
    ],
    arrows: [
      {
        tone: "forward",
        shaft: [
          { x: 36, y: 184 },
          { x: 202, y: 184 },
          { x: 202, y: 108 },
          { x: 250, y: 108 }
        ],
        head: [
          { x: 250, y: 108 },
          { x: 236, y: 100 },
          { x: 236, y: 116 }
        ],
        label: {
          text: "состояние s",
          x: 36, y: 166,
          anchor: "start",
          className: "arrow-label"
        }
      },
      {
        tone: "estimate",
        shaft: [
          { x: 36, y: 208 },
          { x: 202, y: 208 },
          { x: 202, y: 314 },
          { x: 250, y: 314 }
        ],
        head: [
          { x: 250, y: 314 },
          { x: 236, y: 306 },
          { x: 236, y: 322 }
        ],
        label: {
          text: "то же состояние s",
          x: 188, y: 270,
          anchor: "end",
          className: "arrow-label estimate-label"
        }
      },
      {
        tone: "forward",
        shaft: [
          { x: 475, y: 108 },
          { x: 585, y: 108 }
        ],
        head: [
          { x: 585, y: 108 },
          { x: 571, y: 100 },
          { x: 571, y: 116 }
        ],
        label: {
          text: "действие a",
          x: 530, y: 91,
          anchor: "middle",
          className: "arrow-label"
        }
      },
      {
        tone: "forward",
        shaft: [
          { x: 810, y: 108 },
          { x: 866, y: 108 },
          { x: 866, y: 178 },
          { x: 915, y: 178 }
        ],
        head: [
          { x: 915, y: 178 },
          { x: 901, y: 170 },
          { x: 901, y: 186 }
        ],
        label: {
          text: "один шаг",
          x: 852, y: 91,
          anchor: "end",
          className: "arrow-label"
        }
      },
      {
        tone: "feedback",
        shaft: [
          { x: 1025, y: 266 },
          { x: 1025, y: 340 },
          { x: 900, y: 340 }
        ],
        head: [
          { x: 900, y: 340 },
          { x: 914, y: 332 },
          { x: 914, y: 348 }
        ],
        label: {
          text: "r, s′ и результат 7",
          x: 1044, y: 306,
          anchor: "start",
          className: "arrow-label feedback-label"
        }
      },
      {
        tone: "estimate",
        shaft: [
          { x: 475, y: 314 },
          { x: 590, y: 314 }
        ],
        head: [
          { x: 590, y: 314 },
          { x: 576, y: 306 },
          { x: 576, y: 322 }
        ],
        label: {
          text: "ожидание: 3",
          x: 532, y: 297,
          anchor: "middle",
          className: "arrow-label estimate-label"
        }
      },
      {
        tone: "feedback",
        shaft: [
          { x: 692, y: 398 },
          { x: 530, y: 398 },
          { x: 530, y: 214 },
          { x: 362, y: 214 },
          { x: 362, y: 164 }
        ],
        head: [
          { x: 362, y: 164 },
          { x: 354, y: 178 },
          { x: 370, y: 178 }
        ],
        label: {
          text: "δ обучает актёра: чаще / реже",
          x: 514, y: 235,
          anchor: "end",
          className: "arrow-label feedback-label"
        }
      },
      {
        tone: "feedback",
        shaft: [
          { x: 590, y: 374 },
          { x: 516, y: 374 },
          { x: 516, y: 348 },
          { x: 475, y: 348 }
        ],
        head: [
          { x: 475, y: 348 },
          { x: 489, y: 340 },
          { x: 489, y: 356 }
        ],
        label: {
          text: "δ поправляет критика",
          x: 537, y: 361,
          anchor: "start",
          className: "arrow-label feedback-label"
        }
      }
    ],
    originMark: {
      x: 0, y: 0, r: 0
    },
    fallback: [
      {
        text: "Состояние поступает актёру π(a|s) и критику V(s).",
        x: 70, y: 180
      },
      {
        text: "После действия TD-невязка r + γV(s′) − V(s)",
        x: 70, y: 225
      },
      {
        text: "возвращается как обучающий сигнал актёру и критику.",
        x: 70, y: 270
      }
    ]
  }
];

const [origin, scale, plan] = diagramData;

function sx(x) {
  return origin.x + x * scale.x;
}

function sy(y) {
  return origin.y + y * scale.y;
}

try {
  const svg = document.getElementById("diagram");
  const namespace = "http://www.w3.org/2000/svg";

  function make(tag, attributes) {
    const element = document.createElementNS(namespace, tag);
    for (const [name, value] of Object.entries(attributes)) {
      element.setAttribute(name, value);
    }
    return element;
  }

  function addText(specification) {
    const text = make("text", {
      x: sx(specification.x),
      y: sy(specification.y),
      "text-anchor": specification.anchor || "middle",
      class: specification.className
    });
    text.textContent = specification.text;
    svg.append(text);
  }

  const originCheck = make("circle", {
    cx: sx(plan.originMark.x),
    cy: sy(plan.originMark.y),
    r: sx(plan.originMark.x + plan.originMark.r) - sx(plan.originMark.x),
    fill: "none",
    stroke: "none"
  });
  svg.append(originCheck);

  for (const node of plan.nodes) {
    const rectangle = make("rect", {
      x: sx(node.x),
      y: sy(node.y),
      width: sx(node.x + node.w) - sx(node.x),
      height: sy(node.y + node.h) - sy(node.y),
      class: `node ${node.kind}`
    });
    svg.append(rectangle);

    for (const line of node.lines) {
      addText({
        text: line.text,
        x: line.x,
        y: line.y,
        anchor: "middle",
        className: line.className
      });
    }
  }

  for (const divider of plan.dividers) {
    const line = make("line", {
      x1: sx(divider.x1),
      y1: sy(divider.y1),
      x2: sx(divider.x2),
      y2: sy(divider.y2),
      class: "divider"
    });
    svg.append(line);
  }

  for (const arrow of plan.arrows) {
    const shaft = make("polyline", {
      points: arrow.shaft
        .map(point => `${sx(point.x)},${sy(point.y)}`)
        .join(" "),
      class: `arrow arrow-${arrow.tone}`
    });

    const head = make("polygon", {
      points: arrow.head
        .map(point => `${sx(point.x)},${sy(point.y)}`)
        .join(" "),
      class: `head-${arrow.tone}`
    });

    svg.append(shaft, head);
    addText(arrow.label);
  }
} catch (error) {
  const svg = document.getElementById("diagram");
  const namespace = "http://www.w3.org/2000/svg";
  svg.replaceChildren();

  for (const line of plan.fallback) {
    const text = document.createElementNS(namespace, "text");
    text.setAttribute("x", sx(line.x));
    text.setAttribute("y", sy(line.y));
    text.setAttribute("text-anchor", "start");
    text.setAttribute("class", "fallback");
    text.textContent = line.text;
    svg.append(text);
  }
}
</script>
</body>
</html>
