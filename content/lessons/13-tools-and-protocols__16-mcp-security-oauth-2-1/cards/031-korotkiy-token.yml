  reference: Короткий срок действия ограничивает время, в течение которого украденный access-токен пригоден для запросов. При ротации использованный refresh-токен становится недействительным, поэтому его повторное предъявление указывает на возможную кражу и позволяет отозвать связанную цепочку токенов.
