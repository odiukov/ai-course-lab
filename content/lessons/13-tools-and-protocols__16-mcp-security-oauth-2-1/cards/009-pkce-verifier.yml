- concept: code_verifier сохраняется у клиента, а через браузер передаётся только его односторонний отпечаток
  question: Почему клиент передаёт через authorization endpoint code_challenge, но не сам code_verifier?
  explanation: Если отправить verifier по тому же доступному для перехвата каналу, злоумышленник сможет получить обе части проверки. Односторонний challenge позволяет серверу позднее проверить verifier, не раскрывая секрет заранее.
  kind: open
  reference: Code_verifier должен остаться секретом клиента. Через браузер передаётся только его односторонний отпечаток, поэтому перехват authorization code и challenge не позволяет выполнить обмен без исходного verifier.
