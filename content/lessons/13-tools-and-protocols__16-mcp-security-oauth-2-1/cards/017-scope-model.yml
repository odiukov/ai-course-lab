- concept: принцип минимальных прав требует запрашивать текущие scopes, расширяя доступ через step-up
  question: Клиент сейчас только читает отчёты, а удаление запускается позднее отдельным действием пользователя. Какой первоначальный запрос лучше соответствует принципу минимальных прав?
  explanation: Первоначальный токен должен содержать только право, необходимое текущей операции. Если такой токен утечёт, отсутствие reports:delete ограничит возможный ущерб; дополнительное право можно запросить непосредственно перед удалением.
  kind: choice
  options:
    - Запросить reports:read, а reports:delete запросить через step-up перед удалением
    - Сразу запросить reports:read reports:delete, чтобы больше не обращаться за согласием
    - Сразу запросить admin:*, поскольку он покрывает будущие функции
    - Не запрашивать scopes и ограничить удаление только элементами интерфейса
  correct: 0
  id: 017-scope-model-1
  fingerprint: 1b90d1e6
