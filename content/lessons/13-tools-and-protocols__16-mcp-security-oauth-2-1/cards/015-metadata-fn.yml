- concept: стандартные имена и типы полей документа protected-resource metadata
  question: Какой JSON имеет корректную форму документа protected-resource metadata?
  explanation: Поле resource содержит строку, а authorization_servers и scopes_supported — массивы строк. Стандартные имена ключей должны передаваться без переименования.
