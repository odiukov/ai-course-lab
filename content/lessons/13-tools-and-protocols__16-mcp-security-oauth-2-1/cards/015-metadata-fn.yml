    - '{"resource_url":"https://calendar.example.net","auth_server":["https://login.example.net"],"scopes":["calendar:read","calendar:write"]}'
    - '{"resource":["https://calendar.example.net"],"authorization_servers":["https://login.example.net"],"scopes_supported":"calendar:read"}'
