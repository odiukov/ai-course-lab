- concept: scopes проектируются по классам действий и уровню риска, а не механически по инструментам
  question: Объясни своими словами, как разумно назначить scopes инструментам list_docs, read_doc, create_doc, edit_doc и delete_doc.
  explanation: Один общий scope дал бы избыточные полномочия, а отдельный scope для каждого инструмента чрезмерно усложнил бы согласие. Группировка по read, write и delete сохраняет понятную гранулярность и позволяет отдельно запрашивать рискованные действия.
  kind: open
  reference: Можно объединить list_docs и read_doc в docs:read, create_doc и edit_doc — в docs:write, а удаление отделить в docs:delete. Такое деление группирует близкие действия, но не включает опасное удаление в обычные разрешения чтения или изменения.
