- concept: обнаружение authorization server и поддерживаемых scopes через protected-resource metadata
  question: Расположите действия клиента по порядку, если изначально ему известен только канонический URL защищённого ресурса.
  explanation: Фиксированный well-known путь позволяет начать с одного URL ресурса. Сам ресурс сообщает клиенту, какому authorization server он доверяет и какие scopes поддерживает.
  kind: order
  items:
    - Сформировать адрес документа, добавив к URL ресурса путь /.well-known/oauth-protected-resource
    - Получить и разобрать документ protected-resource metadata
    - Прочитать authorization_servers и scopes_supported для настройки авторизации
  id: 014-well-known-1
  fingerprint: a3e7de57
