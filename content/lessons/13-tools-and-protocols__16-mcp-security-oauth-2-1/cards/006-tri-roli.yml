- concept: resource server и authorization server сохраняют разные роли даже при совместном размещении
  question: Authorization server и MCP resource server работают в одном сервисе. Как это влияет на их роли?
  explanation: Совместный хостинг не меняет обязанностей ролей. Их URL следует различать, чтобы выдача токена и целевой защищённый ресурс оставались однозначно определены.
  kind: choice
  options:
    - 'Роли остаются разными: один выдаёт токены, другой защищает ресурс и проверяет их'
    - Они превращаются в одну роль, поэтому проверять audience не требуется
    - Resource server начинает выдавать токены от имени MCP-клиента
    - Authorization server становится владельцем пользовательских данных
