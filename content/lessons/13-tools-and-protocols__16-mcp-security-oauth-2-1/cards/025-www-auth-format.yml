- concept: WWW-Authenticate передаёт клиенту машиночитаемую причину нехватки полномочий, требуемый scope и целевой ресурс
  question: 'Сервер вернул заголовок `WWW-Authenticate: Bearer error="insufficient_scope", scope="calendar:write", resource="https://calendar.example"`. Как клиенту следует его интерпретировать?'
  explanation: '`insufficient_scope` указывает на нехватку полномочий, `scope` называет требуемое право, а `resource` — ресурс, для которого клиенту нужен подходящий токен.'
  kind: choice
  options:
    - Токену не хватает права `calendar:write`; дополнительную авторизацию нужно запросить для указанного ресурса
    - Токен обязательно просрочен, поэтому его достаточно обновить без изменения прав
    - Сервер не распознал схему Bearer, поэтому запрос нужно повторить без токена
