- concept: authorization server регистрирует MCP-клиента динамически по документу метаданных, доступному через client_id
  question: Расположи события динамического обнаружения MCP-клиента в правильном порядке.
  explanation: URL метаданных одновременно служит идентификатором клиента и адресом для получения его регистрационных данных. Поэтому authorization server может проверить redirect URI без заранее заполненной ручной анкеты.
  kind: order
  items:
    - Клиент публикует документ с redirect URI и контактными данными по фиксированному URL
    - Клиент использует URL документа как client_id в запросе авторизации
    - Authorization server загружает документ по полученному client_id
    - Authorization server сверяет redirect URI с метаданными и продолжает авторизацию
  id: 034-client-id-metadata-1
