- concept: authorization server проверяет verifier повторным вычислением challenge и точным сравнением
  question: Authorization server сохранил code_challenge, а на token endpoint получил code_verifier. Как выполнить проверку?
  explanation: Challenge является односторонним отпечатком, поэтому его не расшифровывают. Сервер повторяет то же преобразование над присланным verifier и требует полного совпадения результата с сохранённым challenge.
  kind: choice
  options:
    - Сравнить verifier напрямую с challenge
    - Расшифровать challenge и извлечь из него исходный verifier
    - Вычислить challenge из полученного verifier и целиком сравнить с сохранённым
    - Проверить, что начало verifier совпадает с началом challenge
