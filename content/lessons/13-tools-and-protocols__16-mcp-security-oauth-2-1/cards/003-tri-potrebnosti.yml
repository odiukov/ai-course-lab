- concept: удалённый MCP-сервер получает делегированный пользовательский доступ через authorization code с PKCE
  question: Удалённому MCP-серверу нужно получить доступ к данным пользователя во внешнем сервисе, не забирая его пароль. Какой механизм подходит для этого?
  explanation: Пользователь проходит вход у доверенного сервиса, а клиент получает код и обменивает его на токен. PKCE связывает обмен с инициировавшим его клиентом и снижает риск использования перехваченного кода.
  kind: choice
  options:
    - Authorization code с PKCE
    - Постоянный общий API-ключ
    - Передача логина и пароля MCP-серверу
    - Работа без авторизации
