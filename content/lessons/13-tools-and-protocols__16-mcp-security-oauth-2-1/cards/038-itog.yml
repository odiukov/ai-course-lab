- concept: implicit-поток запрещён современной редакцией OAuth
  question: Клиент запрашивает авторизацию так, что access-токен возвращается прямо через браузерный redirect без обмена authorization code. Как оценивается такой поток?
  explanation: 'Это implicit-поток: access-токен возвращается через браузер. Современная редакция OAuth запрещает его и использует authorization code с PKCE.'
  kind: choice
  options:
    - Он запрещён, поскольку токен попадает во фронтальный канал
    - Он разрешён, если redirect использует TLS
    - Он обязателен для публичных клиентов
    - Он безопасен при ограниченном наборе scopes
