- concept: порядок обмена authorization code на access token и последующего обращения к ресурсу
  question: Расположи события потока authorization code с PKCE в правильном порядке.
  explanation: Через браузер возвращается короткоживущий одноразовый code. Access token клиент получает отдельным запросом к token endpoint и затем использует при обращении к защищённому ресурсу.
  kind: order
  items:
    - Клиент перенаправляет пользователя на authorization endpoint и передаёт code_challenge
    - Authorization server возвращает клиенту одноразовый code через redirect URI
    - Клиент отправляет code и code_verifier на token endpoint
    - Клиент предъявляет полученный access token resource server
