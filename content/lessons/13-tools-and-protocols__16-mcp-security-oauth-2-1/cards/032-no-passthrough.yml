- concept: sampling-запрос не переносит клиентский access-токен в сторонний сервис
  question: MCP-сервер получил клиентский access-токен и во время обработки sampling-запроса решил обратиться к стороннему трекеру задач. Как поступить безопасно?
  explanation: Граница sampling пропускает данные запроса, но не делегированные полномочия клиента. Для стороннего ресурса нужен отдельный токен; иначе MCP-сервер теряет контроль над тем, кто и от чьего имени использует исходный токен.
  kind: choice
  options:
    - Передать трекеру исходный Bearer-токен, поскольку запрос выполняется для того же пользователя
    - Оставить исходный токен на принимающем MCP-сервере, а для трекера получить отдельный подходящий токен
    - Попросить трекер принять исходный токен без проверки аудитории
  correct: 1
  id: 032-no-passthrough-1
