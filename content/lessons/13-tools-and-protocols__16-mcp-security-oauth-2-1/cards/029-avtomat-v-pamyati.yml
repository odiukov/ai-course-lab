- concept: конечный автомат может моделировать логику OAuth независимо от сетевого транспорта
  question: Объясни своими словами, почему поток OAuth можно изучать с помощью конечного автомата в памяти, не поднимая HTTP-сервер и не открывая браузер.
  explanation: Модель остаётся полезной, если она сохраняет существенные состояния, переходы и проверки протокола. HTTP, браузер и редиректы можно временно заменить прямыми вызовами, чтобы отдельно проследить логику OAuth.
  kind: open
  reference: Сеть доставляет сообщения, но логика протокола определяется состояниями, порядком переходов и проверками. Автомат может сохранить те же значения и воспроизвести выдачу кода, обмен на токен, проверку audience и обработку нехватки scope обычными вызовами функций.
