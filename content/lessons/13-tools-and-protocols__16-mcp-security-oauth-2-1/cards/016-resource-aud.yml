- concept: resource indicator ограничивает аудиторию токена, которую resource server обязан проверять
  question: Токен с корректной подписью содержит aud со значением https://storage.example.net, но его предъявили серверу https://billing.example.net. Объясните, как сервер должен поступить и какую роль здесь играет параметр resource при выдаче токена.
  explanation: Корректная подпись не делает токен подходящим для любого сервера. Проверка aud не позволяет использовать токен, выданный для одного ресурса, при обращении к другому.
  kind: open
  reference: Billing-сервер должен отвергнуть токен из-за несовпадения aud со своим каноническим URI. Параметр resource сообщает authorization server, для какого ресурса запрашивается токен, а authorization server фиксирует эту аудиторию в aud.
  id: 016-resource-aud-1
  fingerprint: a4f05645
