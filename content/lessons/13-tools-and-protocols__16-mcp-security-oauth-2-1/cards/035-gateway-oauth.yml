- concept: OAuth-gateway упрощает клиентскую авторизацию ценой концентрации вышестоящих полномочий
  question: Как меняется модель доверия, когда корпоративный gateway ставят перед набором удалённых MCP-серверов?
  explanation: Пользователь аутентифицируется у gateway, а взаимодействие с вышестоящими authorization server берёт на себя gateway. Это упрощает клиент, но компрометация gateway может раскрыть полномочия сразу для многих ресурсов.
  kind: choice
  options:
    - Клиент по-прежнему хранит токены всех вышестоящих серверов, а gateway лишь пересылает запросы
    - Клиент получает токен для gateway, а gateway сам использует внутренние полномочия для вышестоящих серверов и становится критической точкой риска
    - Gateway временно выдаёт клиенту свои вышестоящие креденшелы перед каждым обращением
