- concept: защита от confused deputy требует сопоставлять получателя токена и предъявившего его клиента
  question: Заполни условие допуска, если ресурс проверяет привязку токена к клиенту при каждом запросе.
  explanation: Совпадение aud подтверждает, что токен предназначен этому ресурсу, но не подтверждает личность предъявителя. Совпадение client_id не позволяет другому клиенту воспользоваться найденным или перехваченным токеном.
  kind: cloze
  template: permit = verify_signature(token) && token.aud == resource_id && token.client_id == ___
  answer: authenticated_client_id
  accept:
    - presented_client_id
    - connection.client_id
    - request.client_id
