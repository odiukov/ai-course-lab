<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Три памяти — одно окно</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1b1d29; --muted:#5c6076; --line:#8a90a6;
    --box:#f2f4fa; --edge:#c3c8db; --accent:#c2185b; --win:#0f3460; --winbg:#eef3fb;
    --st:#2e7d32; --lt:#b26a00; --ep:#6a3ab2;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12131a; --fg:#e9ecf5; --muted:#a2a8bf; --line:#7e86a3;
      --box:#1a1a2e; --edge:#3a4160; --accent:#ff5d8f; --win:#7fb2ff; --winbg:#161a2c;
      --st:#51cf66; --lt:#ffa500; --ep:#b18cf0;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  .wrap{padding:8px 10px 12px;}
  h2{font-size:15px;margin:0 0 4px;font-weight:700;}
  svg{display:block;width:100%;height:auto;max-height:400px;}
  .fail{font-size:13px;color:var(--muted);line-height:1.5;}
  text{font-family:inherit;}
</style>
</head>
<body>
<div class="wrap">
  <h2>Три памяти — одно окно</h2>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    var DATA = {
      rows:[
        {y:1.50, key:'short-term', desc:'текущий разговор',            cost:'12 000 токенов на 20 ходов', c:'st'},
        {y:3.05, key:'long-term',  desc:'факты о пользователе',        cost:'3 факта ≈ 90 токенов',      c:'lt'},
        {y:4.60, key:'episodic',   desc:'похожие случаи из прошлого',  cost:'1 случай = 300-400 токенов',c:'ep'}
      ],
      src:{x0:0, x1:3.60, h:1.40},
      door:{x:5.35, y:3.05, r:0.20, label:2.10},
      win:{x0:6.40, x1:9.90, y0:0.05, y1:5.55, title:0.62, note:5.30},
      chip:{x0:6.70, x1:9.60, h:0.90},
      cap:{x:8.15, y:6.05}
    };
    var ORIGIN = {x:14, y:10}, SCALE = 62;
    var sx = function(v){ return ORIGIN.x + v*SCALE; };
    var sy = function(v){ return ORIGIN.y + v*SCALE; };

    var LW = 2, LWT = 3.5, PAD = 12, DY1 = -8, DY2 = 10;

    function rect(x0,y0,x1,y1,fill,stroke,w,dash){
      return '<rect x="'+sx(x0)+'" y="'+sy(y0)+'" width="'+(sx(x1)-sx(x0))+
        '" height="'+(sy(y1)-sy(y0))+'" rx="'+(sx(0.12)-sx(0))+
        '" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+w+
        '"'+(dash?' stroke-dasharray="'+(sx(0.1)-sx(0))+' '+(sx(0.08)-sx(0))+'"':'')+'/>';
    }
    function txt(x,y,dy,s,anchor,size,weight,fill){
      return '<text x="'+sx(x)+'" y="'+(sy(y)+dy)+'" text-anchor="'+anchor+
        '" font-size="'+size+'" font-weight="'+weight+'" fill="'+fill+'">'+s+'</text>';
    }
    function arrow(x1,y1,x2,y2,color,w){
      var dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy);
      var ux=dx/L, uy=dy/L, hl=0.26, hw=0.13;
      var bx=x2-ux*hl, by=y2-uy*hl, px=-uy, py=ux;
      return '<line x1="'+sx(x1)+'" y1="'+sy(y1)+'" x2="'+sx(bx)+'" y2="'+sy(by)+
        '" stroke="'+color+'" stroke-width="'+w+'" stroke-linecap="round"/>'+
        '<polygon points="'+sx(x2)+','+sy(y2)+' '+sx(bx+px*hw)+','+sy(by+py*hw)+
        ' '+sx(bx-px*hw)+','+sy(by-py*hw)+'" fill="'+color+'"/>';
    }

    var W = DATA.win, D = DATA.door, S = DATA.src, C = DATA.chip;
    var s = '';

    /* окно контекста */
    s += rect(W.x0, W.y0, W.x1, W.y1, 'var(--winbg)', 'var(--win)', LWT, false);
    s += txt((W.x0+W.x1)/2, W.title, 0, 'Context Window', 'middle', 14, 700, 'var(--win)');

    /* источники, стрелки в одну дверь, полки внутри окна */
    DATA.rows.forEach(function(r){
      var col = 'var(--'+r.c+')';
      s += rect(S.x0, r.y-S.h/2, S.x1, r.y+S.h/2, 'var(--box)', col, LW, false);
      s += txt(S.x0, r.y, DY1, r.key, 'start', 13, 700, col).replace('x="'+sx(S.x0)+'"','x="'+(sx(S.x0)+PAD)+'"');
      s += txt(S.x0, r.y, DY2, r.desc, 'start', 11, 400, 'var(--muted)').replace('x="'+sx(S.x0)+'"','x="'+(sx(S.x0)+PAD)+'"');

      var dx = D.x-S.x1, dy = D.y-r.y, L = Math.hypot(dx,dy);
      s += arrow(S.x1, r.y, D.x-(dx/L)*D.r, D.y-(dy/L)*D.r, col, LW);

      s += rect(C.x0, r.y-C.h/2, C.x1, r.y+C.h/2, 'var(--box)', col, LW, true);
      s += txt(C.x0, r.y, DY1-1, r.key, 'start', 11, 400, 'var(--muted)').replace('x="'+sx(C.x0)+'"','x="'+(sx(C.x0)+PAD)+'"');
      s += txt(C.x0, r.y, DY2+2, r.cost, 'start', 12, 700, col).replace('x="'+sx(C.x0)+'"','x="'+(sx(C.x0)+PAD)+'"');
    });

    /* одна дверь */
    s += '<circle cx="'+sx(D.x)+'" cy="'+sy(D.y)+'" r="'+(sx(D.r)-sx(0))+
         '" fill="var(--bg)" stroke="var(--line)" stroke-width="'+LW+'"/>';
    s += txt(D.x, D.y+D.label, 0, 'одна дверь', 'middle', 12, 600, 'var(--fg)');
    s += arrow(D.x+D.r, D.y, W.x0, D.y, 'var(--line)', LWT);

    /* итог */
    s += txt((W.x0+W.x1)/2, W.note, 0, 'один плоский текст — один бюджет', 'middle', 11, 400, 'var(--muted)');
    s += txt(DATA.cap.x, DATA.cap.y, 0, 'спорят за одни и те же токены', 'middle', 13, 700, 'var(--accent)');

    host.innerHTML =
      '<svg viewBox="0 0 650 400" xmlns="http://www.w3.org/2000/svg" role="img" ' +
      'aria-label="Три источника памяти сходятся стрелками в одно окно контекста">' +
      '<rect x="0" y="0" width="650" height="400" fill="var(--bg)"/>' + s + '</svg>';
  }catch(e){
    host.innerHTML = '<p class="fail">Схема должна показывать: три источника — short-term ' +
      '(текущий разговор, 12 000 токенов на 20 ходов), long-term (3 факта ≈ 90 токенов) и ' +
      'episodic (1 случай = 300-400 токенов) — сходятся стрелками через одну дверь в один ' +
      'блок Context Window и спорят за одни и те же токены.</p>';
  }
})();
</script>
</body>
</html>
