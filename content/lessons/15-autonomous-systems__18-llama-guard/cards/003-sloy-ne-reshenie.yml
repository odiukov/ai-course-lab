- concept: guard-классификатор добавляется к собственному безопасному поведению модели, а не заменяет его
  question: Классификатор на входе пропустил вредный запрос. Объясни своими словами, почему в грамотно собранной системе это ещё не означает вредный ответ пользователю.
  explanation: Классификатор ставят поверх собственного поведения модели именно потому, что любая одиночная проверка пробивается. Ценность слоя — в дешёвом отсеве массовых прямолинейных попыток.
  kind: open
  reference: 'Guard — только один слой. Сама фундаментальная модель дообучена отказывать на такие запросы, поэтому может не выполнить просьбу. Даже если она начала отвечать, ответ проходит отдельную классификацию на выходе, и её можно остановить там. Плюс остаются продуктовые меры: лимиты, логирование, ревью. Guard проектируется в пару к безопасности модели, а не вместо неё.'
  id: 003-sloy-ne-reshenie-2
  fingerprint: 65ee9772
- concept: ужесточение порога классификатора обменивает пропуски на ложные блокировки, поэтому «поймать всё» недостижимо
  question: Чтобы вредные запросы не проскакивали, порог срабатывания guard-модели сильно понижают. Что произойдёт?
  explanation: Порог двигает баланс между пропусками и ложными срабатываниями, но не убирает ошибки. Слишком строгий guard делает продукт непригодным, слишком мягкий — бесполезным, поэтому его дополняют другими слоями.
  kind: choice
  options:
    - Пропусков станет меньше, но вырастет доля заблокированных безобидных запросов
    - Исчезнут ошибки обоих типов сразу
    - Классификатор перестанет зависеть от формулировки запроса
  correct: 0
