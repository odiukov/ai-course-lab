- concept: 'маршрут выбирается по цене ошибки: тяжесть ущерба при пропуске против доли спорных случаев внутри категории'
  question: Команда назначает действия категориям guard-таксономии. Одна категория при пропуске даёт прямой ущерб. Вторая сильно зависит от контекста и даёт много спорных срабатываний. Третья почти безвредна, но её частота нужна аналитике. Какое распределение действий разумно?
  explanation: Маршрут — это компромисс между ущербом от пропуска и ущербом от ложной блокировки. Высокий ущерб и низкая спорность оправдывают автоматический отказ. Высокая спорность требует человека, который видит контекст. Низкий ущерб не оправдывает прерывания работы, но след события сохранить дёшево.
  kind: choice
  options:
    - Первую блокировать, вторую отправлять на проверку человеку, третью пропускать с записью события
    - Все три блокировать, пока не накопится статистика срабатываний
    - Первую отправлять человеку, вторую блокировать, третью пропускать без записи
  correct: 0
  id: 009-marshrutizatsiya-1
  fingerprint: ff120996
- concept: маршруты образуют лестницу вмешательства в работу пользователя
  question: Расставь действия модерации по возрастанию вмешательства в работу пользователя.
  explanation: Запись не меняет для пользователя ничего, но даёт команде след. Передача человеку откладывает работу пользователя, но оставляет шанс на пропуск. Блокировка прерывает её сразу и окончательно. Чем выше ступень, тем дороже ложное срабатывание.
  kind: order
  items:
    - пропустить и записать событие в журнал
    - приостановить и передать на проверку человеку
    - заблокировать, не пропуская дальше
  id: 009-marshrutizatsiya-2
  fingerprint: d8ecb647
- concept: проверка человеком — отложенное решение, а не мягкая блокировка
  question: Чем маршрут «отправить на проверку человеку» отличается от блокировки и от пропуска? Что происходит с сообщением и с пользователем?
  explanation: Ключевое различие — кто и когда выносит окончательное решение. Проверка человеком меняет не строгость, а исполнителя и момент решения; ресурс модераторов ограничен, поэтому на этот маршрут отправляют не всё подряд.
  kind: open
  reference: 'При блокировке решение вынесено автоматически и окончательно: сообщение не идёт дальше. При проверке человеком решение только отложено — сообщение попадает в очередь, а окончательный ответ («пропустить» или «отклонить») даёт человек, у которого есть контекст, недоступный классификатору. Пользователь при этом ждёт, а не получает отказ. Это стоит времени и труда модератора, поэтому маршрут назначают категориям, где доля спорных случаев высока и цена автоматической ошибки заметна.'
  id: 009-marshrutizatsiya-3
  fingerprint: 287fa8f8
