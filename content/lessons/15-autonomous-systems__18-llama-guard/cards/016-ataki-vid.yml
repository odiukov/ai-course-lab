- concept: невидимая вставка действует не собственным содержанием, а тем, что разрывает привычную сегментацию соседних символов
  question: Символ нулевой ширины ничего не значит и не виден на экране. Почему его вставка внутрь слова способна сбить классификатор?
  explanation: Атака работает на уровне сегментации, а не значения. Именно поэтому лечится она не новым правилом распознавания, а удалением таких символов до кодирования текста.
  kind: open
  reference: Эффект даёт не сам символ, а то, что он разрывает границы токенов. Токенизатор склеивает частые подстроки в один токен; вставка между буквами не даёт собрать привычный кусок слова, и оно рассыпается на редкие обрывки. Связь «эта последовательность токенов — такая-то категория вреда», выученная на неразорванных вариантах, перестаёт срабатывать, хотя для человека надпись не изменилась.
