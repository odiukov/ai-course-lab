- concept: слои ловят разные классы отказов, поэтому последующая проверка не дублирует предыдущую
  question: Замаскированная формулировка прошла и обученное поведение модели, и классификатор. Что в такой системе всё ещё может остановить удаление системного каталога?
  explanation: 'Слои закрывают разные классы отказов: первые два оценивают смысл текста и могут ошибиться на новой маскировке, а рантайм не рассуждает о смысле — он либо даёт доступ, либо нет. Поэтому дублирование здесь мнимое.'
  kind: choice
