- concept: сводный показатель по смешанному набору управляется пропорцией подмножеств, поэтому меняется без изменения самой защиты
  question: Инженер отчитывается одним числом — долей правильно обработанных запросов на наборе, где смешаны атаки и обычные обращения. Он добавляет в набор ещё несколько тысяч безобидных запросов, ничего не меняя в защите, и число растёт. Объясни своими словами, почему такой сводный показатель нельзя использовать как оценку защиты.
  explanation: Пропорция подмножеств — параметр теста, а не системы. Пока обе величины публикуются отдельно, изменение состава набора не может улучшить отчёт бесплатно.
  kind: open
  reference: 'Показатель на смешанном наборе — среднее по двум подмножествам, взвешенное их долями. Увеличение доли безобидных запросов сдвигает среднее вверх, хотя ни устойчивость к атакам, ни частота ложных блокировок не изменились. Значит, число описывает состав тестового набора, а не свойство системы. Корректный отчёт даёт две величины отдельно: долю успешных обходов на атакующем наборе и долю ложных блокировок на репрезентативном неатакующем наборе.'
  id: 031-dva-raspredeleniya-3
