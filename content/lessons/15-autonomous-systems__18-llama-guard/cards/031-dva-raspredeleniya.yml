- concept: качество на неатакующем потоке измеряется долей ложных блокировок легитимных запросов
  question: На выборке из 250 обычных, неатакующих обращений guard-слой заблокировал 15 запросов, и все 15 при разборе оказались допустимыми. Какова доля ложных блокировок в процентах?
  explanation: '15/250 = 0,06, то есть 6%. Эта метрика считается только по неатакующей выборке: атакующие примеры в знаменатель не входят, иначе величина перестаёт описывать опыт обычного пользователя.'
  kind: numeric
  answer: 6
  tolerance: 0.1
