- concept: отсутствие пробелов кодируется пустым списком, что позволяет обрабатывать любой результат одинаково
  question: Что должна вернуть функция аудита защитного стека, если все компоненты на месте?
  explanation: Результат всегда одного типа — список пробелов. Тогда вызывающий код одинаково перебирает его и одинаково проверяет длину, а особый случай «всё хорошо» не требует отдельной ветки.
  kind: choice
  options:
    - Пустой список
    - 'True'
    - None
    - Строку «стек полный»
  correct: 0
  id: 036-audit-stack-2
  fingerprint: df397c95
- concept: сообщение аудита должно называть конкретный отсутствующий компонент, иначе отчёт обнаруживает проблему, но не указывает на место починки
  question: Аудит нашёл два пробела. Какая форма результата пригодна для работы?
  explanation: Сводный флаг или счётчик сообщают факт неполноты, но не адрес починки. Отчёт, называющий конкретный слой, превращает аудит в список задач.
  kind: choice
  options:
    - Одна запись «защитный стек неполный»
    - Число найденных пробелов — 2
    - 'Две записи, каждая из которых называет отсутствующий компонент: выходной рельс и диалоговый рельс'
    - Флаг is_complete = False
  correct: 2
