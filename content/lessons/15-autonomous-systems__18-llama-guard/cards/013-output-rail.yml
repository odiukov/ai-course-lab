- concept: блокирующая ветка выходного рельса обязана вернуть другой текст, иначе исходный ответ уйдёт пользователю по ветке отправки по умолчанию
  question: Маршрутизация вернула для ответа модели действие «блокировать». Что обязан сделать выходной рельс?
  explanation: 'Блокировка — это свойство возвращаемого значения, а не запись в логе. Если блокирующая ветка не вернула собственный результат, управление доходит до общего возврата и опасный текст показывается пользователю: рельс формально есть, но стоит не на пути отправки.'
  kind: choice
  options:
    - Вернуть исходный текст, добавив к нему пометку о нарушении
    - Вернуть подготовленный отказ или замену вместо исходного текста, не пропуская его в ветку отправки
    - Отправить исходный текст, а факт блокировки записать только в журнал
    - Передать исходный текст на повторную классификацию до тех пор, пока категория не сменится
