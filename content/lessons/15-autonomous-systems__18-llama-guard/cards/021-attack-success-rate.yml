- concept: доля заблокированных атак и доля успешных обходов — взаимно дополняющие величины, поэтому подсчёт блокировок даёт перевёрнутое значение метрики
  question: Против защиты проведено 40 атакующих попыток, защита остановила 34 из них. Чему равна доля успешных обходов (значение от нуля до единицы)?
  explanation: 'Успешными считаются попытки, которые защиту прошли: 40 − 34 = 6, и 6/40 = 0.15. Доля блокировок здесь 0.85 — то же самое измерение, но с противоположным знаком смысла. Отчёт, где метрика названа долей успеха атак, а посчитана доля блокировок, читается ровно наоборот.'
  kind: numeric
  answer: 0.15
  tolerance: 0.005
  id: 021-attack-success-rate-1
  fingerprint: 96244bb5
- concept: на пустом наборе попыток метрика не определена, и подстановка нуля выдаёт отсутствие испытаний за подтверждённую надёжность
  question: Функция считает долю успешных обходов защиты и получает пустой список результатов. Почему возвращать ноль — плохое решение?
  explanation: Отношение без знаменателя не определено. Пустой набор попыток означает «измерение не проводилось», а возвращённый ноль означает «проводилось, защита выстояла» — два принципиально разных утверждения с одинаковым представлением. Явная ошибка при пустом входе не даёт спутать их.
  kind: choice
  options:
    - Ноль неотличим от результата «ни одна атака не прошла», хотя атак не было вовсе, и отсутствие данных выдаётся за доказанную надёжность
    - Ноль выходит за допустимый диапазон значений метрики
    - Ноль вынуждает вызывающий код приводить типы, а деление возвращает дробь
    - Ноль нельзя сравнивать с порогом блокировки, потому что порог задаётся в процентах
