- concept: успешное усиление защиты выражается снижением метрики, поэтому направление изменения служит проверкой корректности замера
  question: Перед классификатором добавили нормализацию входа, и он стал распознавать замаскированные запросы, которые раньше пропускал. Тот же набор атак прогоняют повторно. Что должно произойти с долей успешных обходов?
  explanation: 'Числитель метрики — число прошедших защиту попыток, знаменатель фиксирован размером набора. Усиление защиты переводит часть попыток из числителя в блокировки, значит доля падает. Рост значения после добавления защиты — сигнал ошибки: либо метрика посчитана как доля блокировок, либо нормализация применяется после классификации и на вердикт не влияет.'
  kind: choice
  options:
    - 'Она уменьшится: часть попыток, ранее прошедших защиту, теперь остановлена'
    - Она увеличится, потому что классификатор стал срабатывать чаще
    - 'Она не изменится: набор атак остался прежним'
    - Она станет неопределённой, пока не пересчитают общую точность классификатора
