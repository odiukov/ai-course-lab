- concept: две последовательные независимые проверки перемножают доли пропусков, поэтому итоговая доля пропусков ниже, чем у каждой из них
  question: Вход проходит два независимых рельса модерации. Первый ловит 0.7 доли вредных запросов, второй — 0.6 доли того, что пропустил первый. Какая доля вредных запросов пройдёт оба рельса?
  explanation: 'Пропуск возможен только если промахнулись оба: (1 - 0.7) * (1 - 0.6) = 0.3 * 0.4 = 0.12. Слои улучшают итог мультипликативно, но ни один набор слоёв не даёт нулевого пропуска, поэтому остаточный риск всегда называют числом, а не словом «безопасно».'
  kind: numeric
  answer: 0.12
  tolerance: 0.01
  id: 037-final-quiz-1
  fingerprint: d0f159ce
- concept: 'защита действует на том уровне представления, на котором работает атака: посимвольная очистка не затрагивает атаку, меняющую формулировку'
  question: 'Конвейер модерации получил посимвольную нормализацию: удаление невидимых разделителей, отображение похожих глифов в базовые буквы, свёртка эмодзи-вставок. Против какой атаки эта мера не даёт выигрыша по существу?'
  explanation: Первый, второй и четвёртый варианты меняют запись строки при неизменных словах — нормализация возвращает их к канонической форме. Перефраз меняет сами слова, поэтому после любой посимвольной очистки текст остаётся другим; с ним работает уже устойчивость самого классификатора, а не препроцессинг.
  kind: choice
  options:
    - Запрос, записанный кириллическими двойниками латинских букв
    - Запрос, где между буквами вставлены нулевой ширины разделители
    - Запрос с тем же намерением, переписанный другой лексикой и синтаксисом
    - Запрос, разбавленный эмодзи между слогами ключевого слова
  correct: 2
