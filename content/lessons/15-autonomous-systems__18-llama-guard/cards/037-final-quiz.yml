- concept: оценка изменения в защите требует зафиксированного критерия и парного замера на двух распределениях — атакующем и обычном
  question: Команда добавляет новый шаг предобработки в модерацию и хочет доказать, что он улучшил защиту. Расставьте шаги протокола оценки в правильном порядке.
  explanation: Критерий и наборы фиксируют до замера, иначе разницу нельзя приписать изменению. Замер только на атаках показывает падение обходов, но скрывает выросшие ложные блокировки на нормальном потоке; замер только на нормальном потоке скрывает пропуски. Финальная оговорка про непокрытые входы — часть результата, а не вежливость.
  kind: order
  items:
    - 'Зафиксировать критерий успешного обхода и собрать два неизменных набора: атакующий и выборку обычного трафика'
    - 'Замерить на обоих наборах базовые значения: долю обходов и долю ложных блокировок до изменения'
    - Включить новый шаг предобработки в конвейер
    - Повторить замер на тех же двух наборах после изменения
    - Сравнить обе пары чисел и указать, какие входы протокол не покрывал
  id: 037-final-quiz-3
