- concept: выходная рельса ловит вред, порождённый генерацией, которого не было в запросе
  question: Пользователь спросил про историю лекарственных препаратов; вопрос прошёл входную проверку. Ответ модели содержит рабочую инструкцию по синтезу опасного вещества. Что это показывает про рельсы?
  explanation: 'Вредное содержимое породила генерация, а не запрос: во входном тексте его попросту не было, и никакой порог входного классификатора его там не найдёт. При этом входная рельса тоже нужна — она ловит другой класс случаев, где вред виден уже в запросе.'
  kind: choice
  options:
    - 'Безопасность входа не влечёт безопасность выхода: вред может возникнуть при генерации, и его видит только проверка ответа'
    - Входная рельса настроена слишком мягко; при верном пороге проверка ответа не понадобится
    - Проверять надо только выход, раз опасный текст создала модель
  correct: 0
  id: 012-vhod-vyhod-1
  fingerprint: e1201bd3
- concept: отказ до генерации экономит вычисление ответа и сокращает задержку отказа
  question: Явно вредный запрос отклонён входной рельсой ещё до вызова модели. Что это даёт по сравнению с проверкой только на выходе?
  explanation: Генерация — самая дорогая часть конвейера. Отсечение на входе снимает её целиком для заведомо отклоняемых запросов и уменьшает задержку. Отказ на входе ничего не меняет в весах модели и не отменяет проверку ответов на остальных запросах.
  kind: choice
  options:
    - Токены ответа не генерируются, вычисление не тратится, и пользователь получает отказ быстрее
    - Модель запоминает отказ и больше не отвечает на такие запросы
    - Выходную рельсу после этого можно не запускать вовсе
  correct: 0
  id: 012-vhod-vyhod-2
  fingerprint: 522aee70
- concept: 'порядок конвейера: проверка хода пользователя предшествует генерации, проверка ответа — его показу'
  question: Расставь этапы обработки одного обращения в системе с входной и выходной рельсами.
  explanation: 'Каждая рельса стоит вплотную к своей границе: одна — между пользователем и моделью, другая — между моделью и пользователем. Объект проверки у них разный, поэтому обе точки нужны и заменить одну другой нельзя.'
  kind: order
  items:
    - входная рельса классифицирует ход пользователя
    - модель генерирует ответ
    - выходная рельса классифицирует сгенерированный ответ
    - ответ показывается пользователю
  id: 012-vhod-vyhod-3
  fingerprint: 1676e412
