- concept: выбранное мягкое действие не отменяет установленного факта нарушения
  question: Категория признана нарушением политики, но назначенное ей действие — пропустить с пометкой. Что происходит с самим фактом нарушения?
  explanation: Оценка и реакция — два разных решения. Нарушение остаётся зафиксированным и попадает в статистику и аудит; меняется лишь то, прерывают ли работу пользователя. Иначе смягчение маршрута незаметно стирало бы данные о рисках.
  kind: choice
  options:
    - 'Он сохраняется: пропуск — это выбранное действие, а не отмена оценки'
    - 'Он отменяется: раз текст пропущен, он считается чистым'
    - Он подменяется предупреждением и в отчётность не попадает
  correct: 0
  id: 011-verdict-route-1
  fingerprint: 676e6199
- concept: 'порядок конвейера модерации: распознавание, оценка по политике, выбор действия, исполнение'
  question: Расставь шаги обработки одного сообщения в системе модерации.
  explanation: Каждый следующий шаг работает с выходом предыдущего и не заглядывает назад в текст. Поэтому одинаковая оценка «нарушение» может дальше разойтись по разным действиям — они выбираются уже по коду категории.
  kind: order
  items:
    - классифицировать текст и получить код категории или его отсутствие
    - определить, нарушает ли результат политику
    - выбрать действие, назначенное этой категории
    - выполнить выбранное действие
  id: 011-verdict-route-2
  fingerprint: 0f3b7d52
