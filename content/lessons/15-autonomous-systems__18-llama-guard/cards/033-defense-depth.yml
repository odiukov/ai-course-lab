- concept: 'композиция defense-in-depth упорядочена: обученное поведение весов, классификатор, ограничения рантайма, человеческая проверка'
  question: Расставь слои защиты агентной системы в порядке их прохождения — от свойств самой модели до последнего рубежа перед необратимым действием.
  explanation: 'Классификатор стоит под слоем обученного поведения и над рантаймом: он переводит смысл текста в категорию до того, как намерение станет исполняемым действием. Рантайм ограничивает уже саму возможность действия, а человек подключается последним.'
  kind: order
  items:
    - 'Веса: обученное поведение модели, отказ по умолчанию на явных злоупотреблениях'
    - 'Классификатор: категория риска и маршрут по ней'
    - 'Рантайм: разрешения, бюджеты, аварийная остановка'
    - Человеческая проверка действий с последствиями
  id: 033-defense-depth-1
  fingerprint: c61bc455
- concept: 'HITL по схеме propose-then-commit: агент формирует предложение, а действие возникает только из отдельного подтверждения'
  question: Агент по схеме propose-then-commit готовит массовое изменение прав доступа. Что означает эта схема на практике?
  explanation: 'Смысл схемы в том, что предложение и фиксация разделены: до подтверждения ничего не изменилось. Откат постфактум — другая схема, она допускает существование последствий.'
  kind: choice
  options:
    - Агент выполняет изменение и уведомляет человека, который может откатить его позже
    - Агент формирует описание изменения, но применяется оно только после отдельного подтверждения человеком
    - Агент запрашивает подтверждение и, не получив ответа за отведённое время, выполняет действие
    - Человек задаёт правила заранее, а агент дальше действует без обращения к нему
