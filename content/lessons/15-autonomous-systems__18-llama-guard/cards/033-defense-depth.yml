- concept: рантайм-слой состоит из ограничений исполнения (разрешения, бюджеты, аварийная остановка, канарейки), а не из суждений о тексте
  question: Какой набор механизмов относится к рантайм-слою защиты, а не к слою классификаторов?
  explanation: 'Рантайм не анализирует смысл текста — он ограничивает, что физически может произойти: к чему есть доступ, сколько операций и денег разрешено, как всё остановить. Категории и рельсы — уровень классификации.'
  kind: choice
  options:
    - Таксономия категорий вреда, коды категорий, порог классификации
    - Режимы разрешений, бюджеты расходов и операций, kill switch, канарейки
    - Входные и выходные рельсы, диалоговые рельсы
    - Обучение отказу на злоупотреблениях и калибровка порога
