- concept: для части входов правильной метки нет без сведений вне текста, поэтому такая ошибка не устраняется улучшением классификатора
  question: Вопрос «какая доза этого препарата смертельна?» одинаково пишет и отравитель, и медсестра. Почему более сильная модель-классификатор этот случай не решает?
  explanation: Классификатор решает только по переданному тексту. Когда решающий признак лежит вне текста, любая точность модели упирается в отсутствие доказательств; помогает внешний сигнал (роль, история аккаунта, подтверждённая профессия) или отдельная политика для спорной категории.
  kind: choice
  options:
    - Модель мало обучали на медицинских текстах
    - Признак, различающий случаи, — намерение и роль автора — во входном тексте отсутствует, извлечь его из текста нельзя
    - Перед классификацией не сделали нормализацию записи
  correct: 1
  id: 030-classifiers-lose-1
  fingerprint: 94017a6f
- concept: 'достижимое качество ограничено согласием разметчиков: там, где эксперты ставят разные метки, единственной эталонной метки нет'
  question: На части примеров два опытных разметчика систематически ставят разные метки. Что это говорит о достижимом качестве классификатора на таких примерах и как построить оценку?
  explanation: Неоднозначность — свойство данных, а не дефект модели. Смешивание однозначных и спорных примеров в одной метрике скрывает и то, и другое.
  kind: open
  reference: 'Расхождение экспертов означает, что у примера нет единственного верного ответа, поэтому «оставшиеся ошибки» на этом подмножестве частично неустранимы: измеренная точность ограничена сверху уровнем согласия разметки. Спорное подмножество считают отдельно от однозначного, иначе прирост качества смешивается с шумом меток и улучшения модели выглядят случайными. Для спорной части выбирают политику обращения (запрос дополнительного контекста, отложенное решение), а не догоняют метрику.'
  id: 030-classifiers-lose-2
  fingerprint: 7704581d
