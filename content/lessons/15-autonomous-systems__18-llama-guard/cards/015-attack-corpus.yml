- concept: доля успешных обходов зависит от распределения входов, поэтому число с adversarial-бенчмарка нельзя переносить на обычный трафик
  question: Guard-система показала 68% успешных обходов на бенчмарке аккуратно сконструированных джейлбрейков и около 4% на обычном пользовательском трафике. Почему обе цифры нужно измерять и хранить отдельно?
  explanation: Метрика без указания распределения входов бессмысленна. Высокая доля обходов при аккуратной атаке — свойство противника, низкая — свойство среднего пользователя; решения о порогах и о необходимости дополнительных мер принимаются по обеим цифрам.
  kind: open
  reference: 'Это две разные величины, потому что различаются распределения входов. Adversarial-бенчмарк состоит из целенаправленно оптимизированных атак и оценивает верхнюю границу риска — что произойдёт, если против системы работает подготовленный противник. Обычный трафик оценивает ежедневный уровень пропусков и вместе с долей ложных блокировок определяет продуктовый опыт. Смешение цифр даёт двойную ошибку: число с бенчмарка выглядит как повседневная катастрофа, число с обычного трафика создаёт иллюзию защищённости и скрывает, что при целевой атаке потолок обхода далёк от нуля.'
  id: 015-attack-corpus-3
  fingerprint: ed14ce61
