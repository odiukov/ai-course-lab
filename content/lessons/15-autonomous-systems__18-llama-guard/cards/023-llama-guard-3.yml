- concept: классификатор способен назвать только категории своей таксономии; вред вне словаря не получает метки
  question: В продукте появился новый тип вреда, которому в таксономии guard-модели нет соответствующей категории. Что произойдёт с такими запросами?
  explanation: Таксономия — это то, чему модель обучали; выйти за словарь она не может. Закрытие нового класса риска требует новой версии таксономии и модели, а не правки политики поверх кодов.
  kind: choice
  options:
    - Классификатор либо пометит их безопасными, либо натянет ближайшую чужую категорию — точной метки он дать не может
    - Классификатор создаст новый код категории для неизвестного риска
    - Классификатор пометит их небезопасными по умолчанию, раз категория неизвестна
