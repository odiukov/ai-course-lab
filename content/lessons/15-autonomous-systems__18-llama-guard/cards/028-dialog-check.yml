  question: Диалоговый рельс остановил ветку разговора, хотя в журнале у каждой отдельной реплики стоит «нарушений не найдено». Где искать причину блокировки?
  explanation: Расхождение между чистыми поштучными вердиктами и срабатыванием рельса — не противоречие, а разница предметов проверки. Для разбора нужно хранить не только вердикты по ходам, но и саму последовательность, иначе решение нечем объяснить.
