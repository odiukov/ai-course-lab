- concept: решение о допуске не зависит от того, чей ход проверяется, — вход и выход обслуживает одна и та же функция
  question: Модерация проверяет и сообщение пользователя, и ответ модели. Почему одна и та же функция допуска годится для обеих проверок?
  explanation: 'Вход функции — код категории (или его отсутствие). Откуда взялся текст, на решение не влияет, поэтому один и тот же код даёт один и тот же ответ на обеих границах. Ровно поэтому возможна ситуация «вход пропущен, выход заблокирован»: различаются не правила, а результаты классификации двух разных текстов.'
  kind: choice
  options:
