- concept: правило допуска не проводит собственного анализа текста; пропуск распознавания чинится в классификаторе, а не в правиле
  question: Классификатор вернул «категория не найдена», хотя текст выглядит подозрительно. Что должна вернуть функция допуска и почему?
  explanation: 'Если правило начнёт искать слова само, в системе появится второй, никем не измеренный классификатор — и качество распознавания перестанет быть измеримым. Правильный ремонт лежит в слое распознавания: другой порог, другая модель, другой промпт.'
  kind: choice
  options:
