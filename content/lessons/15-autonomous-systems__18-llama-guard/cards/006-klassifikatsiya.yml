- concept: коды категорий в логах дают агрегируемую статистику рисков, которой бинарный флаг не даёт
  question: В логах guard-слоя хранится только флаг «заблокировано / пропущено». Что команда не сможет выяснить и как это исправить?
  explanation: Флаг сохраняет факт срабатывания, код — его причину. Без причины все инциденты сливаются в одну кучу, и настраивать политику приходится вслепую.
  kind: open
  reference: 'Не видно распределения по видам вреда: непонятно, какая категория даёт основную массу срабатываний, где растут ложные блокировки и какую политику стоит смягчить или ужесточить. Нельзя выборочно отправлять на ручной разбор один тип риска и измерять точность по категориям. Исправление: сохранять код категории вместе с решением, тогда метрики и правила строятся по категориям.'
