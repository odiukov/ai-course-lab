- concept: ASR — отношение числа обошедших защиту атак к общему числу попыток атаки
  question: Против классификатора запустили 40 атакующих запросов. Защита остановила 34, остальные получили метку «безопасно» и прошли дальше. Чему равен Attack Success Rate (доля от 0 до 1)?
  explanation: Обошли защиту 40 − 34 = 6 попыток. ASR = 6 / 40 = 0.15. В числителе только успешные обходы, в знаменателе — все попытки атаки, а не весь трафик.
  kind: numeric
  answer: 0.15
  tolerance: 0.01
  id: 020-asr-1
  fingerprint: cbf016d3
- concept: критерий «успешного обхода» задаётся до замера, и разные критерии дают разные значения ASR
  question: Две команды меряют ASR одной и той же защиты на одном наборе атак и получают разные числа без ошибок в коде. Наиболее вероятная причина?
  explanation: 'Прохождение классификатора и фактическое получение вредного ответа — разные события: часть прошедших запросов модель отклонит сама. Критерий фиксируют до замера, иначе два числа несопоставимы.'
  kind: choice
  options:
    - Одна засчитывает успех по метке «безопасно» от классификатора, другая — только если модель после этого выдала вредный ответ
    - Одна делит на число атак, другая — на то же число атак
    - Одна использует классификатор с открытыми весами, другая — с такими же весами через API
  correct: 0
  id: 020-asr-2
  fingerprint: 2c30c503
- concept: высокая общая точность на смешанном наборе совместима с высоким ASR, потому что метрики считаются по разным подмножествам
  question: В наборе 940 безопасных сообщений и 60 атак. Классификатор верно разметил все безопасные и остановил 30 атак из 60. Что верно?
  explanation: 'Точность усредняет по всему набору, где безопасных сообщений подавляющее большинство: (940 + 30) / 1000 ≈ 97%. ASR считается только по атакам: 30 / 60 = 0.5. Одно высокое число прячет другое.'
  kind: choice
  options:
    - 'Общая точность около 97%, но ASR равен 50%: половина атак прошла'
    - Раз точность около 97%, ASR не может превышать 3%
    - ASR равен 3%, потому что считается по всему набору
  correct: 0
  id: 020-asr-3
  fingerprint: ce722ccb
