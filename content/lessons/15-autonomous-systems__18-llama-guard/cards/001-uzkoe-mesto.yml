- concept: классификатор относит текст к категории по смыслу, а не ищет фиксированный список запрещённых строк
  question: Чем классификатор безопасности отличается от фильтра по списку запрещённых слов?
  explanation: Список строк ломается от любой перефразировки. Классификатор обучен относить текст к категории, поэтому переживает синонимы и другие формулировки — хотя и не всякую подмену символов.
  kind: choice
  options:
    - Он возвращает метку для текста в целом, опираясь на смысл, а не на наличие конкретной строки
    - Он проверяет только ответы модели, а список слов — только запросы
    - Он работает без обучения, а список слов требует обучения
