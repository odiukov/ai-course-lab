- concept: требования к guard-модели — компромисс качества и стоимости прохода, а не максимум точности
  question: 'Guard-модель на 8B параметров отвечает за 40 мс. Предлагают заменить её на модель 70B: точность выше на три пункта, задержка 900 мс. Почему такая замена обычно неприемлема для inline-проверки?'
  explanation: 'Классификатор стоит в самом узком месте: 900 мс превращаются в почти две секунды на один обмен и ограничивают пропускную способность. Поэтому guard-модели делают маленькими и квантованными, соглашаясь на скромную потерю точности.'
  kind: choice
  options:
    - Задержка добавляется к каждому запросу и каждому ответу и съедает бюджет времени всего сервиса
    - Большая модель не умеет выдавать метки категорий
    - Точность выше трёх пунктов делает классификатор бесполезным
