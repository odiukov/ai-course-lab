- concept: объём ручной проверки равен произведению доли срабатываний классификатора и доли эскалаций, поэтому маршрутизация напрямую задаёт нагрузку на людей
  question: Сервис обрабатывает 240 000 сообщений в сутки. Классификатор присваивает рискованную категорию 2% сообщений, и политика отправляет на проверку человеком 5% от сработавших. Сколько обращений в сутки дойдёт до людей?
  explanation: 240 000 × 0,02 = 4800 срабатываний, из них 5% = 240 обращений. Если бы к человеку шли все срабатывания, очередь была бы 4800 в сутки — поэтому маршрут к человеку назначают узкой части категорий, а остальное закрывают автоматическим действием и записью в журнал.
  kind: numeric
  answer: 240
