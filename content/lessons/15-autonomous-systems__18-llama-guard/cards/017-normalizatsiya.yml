- concept: нормализация сводит перечисленные известные варианты записи и требует поддержки списка, а не защищает от произвольной маскировки
  question: Что честно сказать о защитных возможностях шага нормализации текста?
  explanation: 'Нормализация ничего не решает о вреде: она лишь убирает искажение материала. Работает она по конечному набору правил — известные невидимые символы, известные пары двойников. Новая, неучтённая подмена пройдёт мимо, поэтому набор правил живёт и обновляется вместе с корпусом атак.'
  kind: choice
  options:
    - Она распознаёт вредное намерение и потому может заменить классификатор
    - Она сводит к канону заранее перечисленные варианты записи, и этот список приходится поддерживать при появлении новых подмен
    - Она гарантирует, что любой визуально похожий вариант строки даст тот же вердикт
    - Она нужна лишь для красивого отображения текста в интерфейсе и на решение не влияет
