- concept: новая версия guard-модели расширяет прежнюю таксономию надмножеством, поэтому старые коды сохраняют смысл и замена модели не требует переписывать политику
  question: Guard-модель новой версии заявлена как прямая замена предыдущей, а её таксономия — надмножество прежней плюс одна новая категория. Что это означает для сервиса, который уже держит политику действий поверх кодов категорий?
  explanation: 'Прямая замена означает совместимость роли и словаря: старые коды продолжают значить то же самое, добавляется новый. Работа сводится к дополнению политики — назначить действие новой категории. Модель по-прежнему только называет категорию; выбор действия остаётся на стороне политики.'
  kind: choice
  options:
    - Прежние коды сохраняют значение, поэтому политику достаточно дополнить правилом для новой категории
    - Все правила политики нужно перенумеровать, потому что добавление категории сдвигает коды
    - 'Политика становится не нужна: новая модель сама выбирает действие для каждого кода'
    - Прежние коды перестают появляться в выводе и заменяются новой категорией
