- concept: категория Code Interpreter Abuse появилась вслед за новой поверхностью вреда — агентами, исполняющими код в песочнице, — а не как переформулировка прежних категорий
  question: Таксономия guard-моделей пополнилась категорией Code Interpreter Abuse. Объясни своими словами, почему прежний набор категорий, написанный под чат-ботов, не покрывал этот класс запросов.
  explanation: Расширение таксономии следует за появлением новой поверхности вреда, а не за желанием дробить старые категории. Пока модель только отвечала текстом, злоупотребление интерпретатором было нечем описать; с появлением исполнения кода понадобился новый код категории.
  kind: open
  reference: 'Прежняя таксономия описывала вред в содержании ответа: оружие, ненависть, самоповреждение и подобное. Она предполагала, что модель только пишет текст. Автономные агенты выполняют код в песочнице, и это создало другую поверхность: запрос может выглядеть безобидно как текст («запусти этот скрипт»), а вред возникает при исполнении — обращение наружу, доступ к файлам, побег из песочницы. Такому запросу в старом словаре не было метки, а классификатор способен назвать только то, что есть в его таксономии. Отдельная категория даёт коду риска имя, а значит политика может назначить ему собственное действие.'
