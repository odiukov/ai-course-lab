- concept: избыточно агрессивная очистка разрушает легитимный ввод и создаёт собственные ошибки вместо защиты
  question: 'Разработчик решает: пусть нормализация выкидывает всё, что не входит в ASCII. Чем плох такой вариант?'
  explanation: 'Цель — вернуть классификатору знакомую запись того же смысла, а не обеднить текст. Тотальное вычищение превращает обычный запрос на русском или японском в обрывок, и решение принимается по тексту, которого пользователь не писал: защита сама становится источником ошибок.'
  kind: choice
  options:
    - Он слишком медленный на длинных строках
    - Он уничтожает легитимный текст на любом неанглийском языке, и классификатор получает искажённый ввод вместо очищенного
    - Он не идемпотентен, потому что удаление символов можно повторять бесконечно
    - Он требует таблицы соответствий, которой в ASCII нет
  correct: 1
