- concept: распознавание намерения уменьшает вероятность вредного запуска, изоляция ограничивает ущерб от уже случившегося запуска — это разные величины риска
  question: Команда включила в guard-модель категорию злоупотребления интерпретатором кода и предлагает на этом основании ослабить ограничения песочницы исполнения. Объясни, что теряется.
  explanation: 'Слои не взаимозаменяемы: распознавание отвечает за «сколько раз дойдёт до запуска», изоляция — за «что успеет сделать запущенный код».'
  kind: open
  reference: 'Классификатор работает до запуска и снижает долю вредных запусков, но даёт пропуски: незнакомые формулировки, замаскированная запись, неявное намерение. Песочница работает во время исполнения и ограничивает ущерб от любого запуска — и пропущенного классификатором, и непреднамеренно опасного кода. Один слой влияет на вероятность события, другой на его последствия; ослабление песочницы делает каждый пропуск классификатора неограниченным по ущербу.'
