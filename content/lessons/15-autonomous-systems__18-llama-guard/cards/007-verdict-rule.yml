- concept: решение о допуске — детерминированное правило над результатом классификации, проверяемое без запуска guard-модели
  question: 'Модерация разделена на два слоя: guard-классификатор возвращает код категории, а отдельная функция превращает этот код в «пропустить» или «отказать». Объясни своими словами, что такое разделение даёт при тестировании правил допуска.'
  explanation: 'Классификатор — вероятностный компонент, правило допуска — детерминированный. Их разделение позволяет тестировать каждый в своём режиме: модель на размеченных текстах, правило — перебором кодов.'
  kind: open
  reference: 'Функция допуска не обращается к тексту и не вызывает модель: её вход — код категории, выход — решение. Значит, её можно прогнать по всем кодам таксономии как обычную таблицу, детерминированно и без GPU, и убедиться, что каждая категория даёт ожидаемое решение. Тестирование самого классификатора отделяется в свою задачу: там нужны тексты, метки и метрики качества распознавания. При склейке двух слоёв ни то ни другое нельзя проверить по отдельности: провал теста не говорит, ошиблась модель или неверно записано правило.'
  id: 007-verdict-rule-1
  fingerprint: 90aa7e87
- concept: 'разделение распознавания и допуска локализует причину инцидента: ошибка модели и строгость правила лежат в разных местах'
  question: Пользователь жалуется, что безобидный вопрос заблокирован. В системе guard-модель возвращает код категории, а отдельное правило превращает код в отказ. Что даёт такая схема при разборе жалобы?
  explanation: В логе видно и код, и применённое решение. Если код не соответствует тексту — виноват классификатор, дообучение или порог. Если код верный, а отказ нежелателен — правка нужна в правиле допуска. Слитый в один шаг вердикт такого различения не даёт.
  kind: choice
  options:
    - Позволяет отличить ошибку распознавания (категория выставлена неверно) от строгости правила (категория верна, но отказ выбран намеренно)
    - Гарантирует, что модель не ошиблась, раз решение принимает не она
    - Позволяет восстановить исходный текст запроса из кода категории
  correct: 0
  id: 007-verdict-rule-2
  fingerprint: 9d25485d
