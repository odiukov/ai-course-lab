- concept: нормализованный текст — вход только для классификатора, дальше по конвейеру идёт оригинал
  question: Инженер добавил нормализацию и передал очищенный текст не только классификатору, но и дальше — в основную модель и в ответ пользователю. Объясни, что ломается.
  explanation: Очистка — деталь проверяющей ветки, а не преобразование пользовательских данных. Смешение двух ролей превращает защитный шаг в собственный источник ошибок продукта.
  kind: open
  reference: 'Нормализация нужна лишь для того, чтобы классификатор увидел тот же смысл, что и человек. Если очищенная строка идёт дальше, продукт начинает работать с искажённым вводом: пропадают эмодзи, имена и написания, которые пользователь ввёл намеренно, а модель отвечает не на тот текст, который был отправлен. Правильный порядок — очищать копию для проверки, а по конвейеру дальше пускать оригинал.'
