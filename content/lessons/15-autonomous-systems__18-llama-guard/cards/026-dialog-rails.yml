- concept: вердикт диалогового рельса — функция от реплики и сохранённого состояния разговора, поэтому один и тот же текст получает разные решения
  question: Фраза «Так что же со мной?» приходит первым сообщением в беседе, а в другой сессии — после подробного описания симптомов и обсуждения возможных причин. Как это выглядит для диалогового рельса?
  explanation: 'Проверка отдельного хода — функция от одной строки, поэтому её решение воспроизводимо по этой строке. Диалоговый рельс хранит состояние беседы, и то же самое предложение в разных историях попадает под правило либо нет. Отсюда и требование: состояние нужно где-то держать и передавать между запросами.'
  kind: choice
  options:
    - Вердикт одинаков, потому что рельс классифицирует только текст текущей реплики
    - 'Вердикт может отличаться: рельс проверяет правило против реплики вместе с сохранённым состоянием разговора'
    - Вердикт всегда «блокировать», потому что рельс запрещает любые вопросы о самочувствии
  correct: 1
  id: 026-dialog-rails-1
  fingerprint: 14ac9a33
- concept: 'хранение контекста не означает накопление подозрения: смена темы выводит новые реплики из-под прежнего правила'
  question: Пользователь задал вопрос о диагнозе, диалоговый рельс остановил эту ветку. Через несколько сообщений он спрашивает о сроках доставки заказа. Должен ли рельс блокировать и этот вопрос? Объясни, почему.
  explanation: 'Ошибка проектирования здесь симметрична пропуску: слишком узкий контекст пропускает многоходовую атаку, слишком липкий — наказывает пользователя за прошлое и ломает обычную беседу.'
  kind: open
  reference: Нет. Рельс проверяет правило против того, куда ведёт текущая линия разговора, а не ведёт счётчик нарушений на пользователя. Запрещённой была медицинская ветка; вопрос про доставку к ней не относится и правилу не противоречит. Если реализация блокирует всё после первого срабатывания, она превращает контекст в постоянное клеймо и генерирует ложные блокировки на легитимном трафике. Правильное поведение — состояние влияет ровно там, где из него следует запрещённая цель, и перестаёт влиять при смене темы.
  id: 026-dialog-rails-2
  fingerprint: 66ddc194
