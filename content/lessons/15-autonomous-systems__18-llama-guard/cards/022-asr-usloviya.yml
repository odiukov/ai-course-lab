- concept: ASR характеризует пару «защита + атакующий», поэтому опубликованное число устаревает при появлении новых техник
  question: Почему опубликованный ASR guard-системы нельзя считать её постоянной характеристикой, как размер модели или задержку?
  explanation: Размер модели — свойство одной системы, ASR — свойство пары. Атакующая сторона адаптируется, и метрика ветшает; фиксируют не число, а протокол его получения.
  kind: open
  reference: 'ASR измеряется против конкретного атакующего: его техник, бюджета попыток и степени адаптации под данный классификатор. Защита не меняется, а число меняется — стоит появиться новой технике маскировки или подобрать атаку под опубликованные слабости, и доля успешных обходов растёт. Поэтому ASR указывают вместе с описанием набора атак и датой замера, а сам замер повторяют.'
  id: 022-asr-usloviya-2
  fingerprint: 681d9a2c
