<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта задач, горизонтов и качества оценки</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f4f7fb;
    --surface: #ffffff;
    --surface-alt: #f2f6fc;
    --header: #e2ebf8;
    --ink: #172033;
    --muted: #526079;
    --line: #a9b7ca;
    --strong-line: #667792;
    --short: #5b78b5;
    --long: #cc7048;
    --quality: #137b68;
    --quality-soft: #dcefe9;
    --footer: #eef2f8;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #111722;
      --surface: #182131;
      --surface-alt: #1e293b;
      --header: #27364d;
      --ink: #f2f5fa;
      --muted: #bdc8d8;
      --line: #485871;
      --strong-line: #8493aa;
      --short: #88a8e8;
      --long: #efa075;
      --quality: #65cfb6;
      --quality-soft: #183e38;
      --footer: #202c3e;
    }
  }

  html,
  body {
    background: var(--page);
  }

  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
      "Segoe UI", sans-serif;
  }

  figure {
    margin: 0;
    background: var(--surface);
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 520px;
    background: var(--surface);
    color: var(--ink);
  }

  .canvas-bg {
    fill: var(--surface);
    stroke: var(--strong-line);
    stroke-width: 1.5;
  }

  .title {
    fill: var(--ink);
    font-size: 24px;
    font-weight: bold;
  }

  .subtitle {
    fill: var(--muted);
    font-size: 13px;
  }

  .section-rule,
  .grid-line {
    stroke: var(--line);
    stroke-width: 1;
  }

  .table-border,
  .quality-border {
    fill: none;
    stroke: var(--strong-line);
    stroke-width: 1.5;
  }

  .header-fill {
    fill: var(--header);
  }

  .row-fill {
    fill: var(--surface);
  }

  .row-fill-alt {
    fill: var(--surface-alt);
  }

  .column-head {
    fill: var(--muted);
    font-size: 12px;
    font-weight: bold;
  }

  .benchmark {
    fill: var(--ink);
    font-size: 15px;
    font-weight: bold;
  }

  .primary {
    fill: var(--ink);
    font-size: 14px;
    font-weight: bold;
  }

  .secondary {
    fill: var(--muted);
    font-size: 12px;
  }

  .horizon-short {
    fill: var(--short);
  }

  .horizon-long {
    fill: var(--long);
  }

  .quality-fill {
    fill: var(--quality-soft);
  }

  .quality-head {
    fill: var(--quality);
    font-size: 12px;
    font-weight: bold;
  }

  .quality-number {
    fill: var(--quality);
    font-size: 38px;
    font-weight: bold;
  }

  .quality-unit {
    fill: var(--ink);
    font-size: 13px;
    font-weight: bold;
  }

  .quality-copy {
    fill: var(--ink);
    font-size: 14px;
  }

  .quality-note {
    fill: var(--muted);
    font-size: 12px;
  }

  .quality-mark {
    fill: var(--quality);
    font-size: 27px;
    font-weight: bold;
  }

  .footer-fill {
    fill: var(--footer);
  }

  .footer-main {
    fill: var(--ink);
    font-size: 15px;
    font-weight: bold;
  }

  .footer-note {
    fill: var(--muted);
    font-size: 12px;
  }

  #fallback {
    box-sizing: border-box;
    padding: 24px;
    background: var(--surface);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.5;
  }
</style>
</head>
<body>
<figure aria-label="Карта задач, горизонтов и качества оценки">
  <svg id="diagram" width="960" height="476" viewBox="0 0 960 476"
       preserveAspectRatio="xMidYMid meet"
       role="img" aria-labelledby="svg-title svg-description">
    <title id="svg-title">Карта задач, горизонтов и качества оценки</title>
    <desc id="svg-description">
      Таблица сопоставляет BrowseComp, OSWorld, WebArena-Verified и Hard
      по типу задачи и горизонту. Справа отмечено исправление 11,3
      процентного пункта ложноотрицательных результатов.
    </desc>
    <g id="plot"></g>
    <text id="visual-title" class="title">
      Карта задач, горизонтов и качества оценки
    </text>
  </svg>
  <div id="fallback" hidden>
    Схема должна была показать: BrowseComp — поиск фактов за минуты;
    OSWorld — управление рабочим столом в течение десятков минут;
    WebArena-Verified — транзакции за минуты; Hard — 258
    многостраничных задач на десятки минут. При проверке оценки исправлено
    11,3 процентного пункта ложноотрицательных результатов.
  </div>
</figure>

<script>
const data = Object.freeze({
  origin: Object.freeze({ x: 30, y: 14 }),
  scale: Object.freeze({ x: 10, y: 10 }),
  frame: Object.freeze({ x: 0, y: 0, w: 90, h: 44 }),
  title: Object.freeze({ x: 2, y: 3 }),
  subtitle: Object.freeze({ x: 2, y: 5.1 }),
  divider: Object.freeze({ x1: 2, x2: 88, y: 6.3 }),
  table: Object.freeze({
    x: 2, y: 7.5, w: 59, h: 32,
    headerH: 4,
    columns: Object.freeze([2, 18, 44, 61]),
    heads: Object.freeze([
      { x: 3, y: 10.1, label: "БЕНЧМАРК" },
      { x: 19, y: 10.1, label: "ТИП ЗАДАЧИ" },
      { x: 45, y: 10.1, label: "ГОРИЗОНТ" }
    ])
  }),
  rows: Object.freeze([
    Object.freeze({
      y: 11.5, h: 7, alternate: false,
      benchmark: "BrowseComp",
      task1: "Поиск фактов",
      task2: "в открытом вебе",
      horizon1: "минуты",
      horizon2: "5–10 действий",
      bar: 4, barClass: "horizon-short"
    }),
    Object.freeze({
      y: 18.5, h: 7, alternate: true,
      benchmark: "OSWorld",
      task1: "Рабочий стол",
      task2: "мышь · клавиатура · оболочка",
      horizon1: "десятки минут",
      horizon2: "сотни действий",
      bar: 11, barClass: "horizon-long"
    }),
    Object.freeze({
      y: 25.5, h: 7, alternate: false,
      benchmark: "WebArena-Verified",
      task1: "Транзакции",
      task2: "изменение состояния сайта",
      horizon1: "минуты",
      horizon2: "5–10 действий",
      bar: 4, barClass: "horizon-short"
    }),
    Object.freeze({
      y: 32.5, h: 7, alternate: true,
      benchmark: "Hard",
      task1: "258 многостраничных задач",
      task2: "переходы между страницами",
      horizon1: "десятки минут",
      horizon2: "сотни действий",
      bar: 11, barClass: "horizon-long"
    })
  ]),
  rowText: Object.freeze({
    benchmarkX: 3,
    taskX: 19,
    horizonX: 45,
    firstY: 2.6,
    secondY: 4.8,
    barY: 5.65,
    barH: 0.45
  }),
  quality: Object.freeze({
    x: 64, y: 7.5, w: 24, h: 32,
    headX: 76, headY: 10.1,
    fillX: 65.2, fillY: 11.5, fillW: 21.6, fillH: 20.5,
    numberX: 76, numberY: 17,
    unitY: 19.4,
    copyY1: 22.7,
    copyY2: 24.8,
    markY: 29.2,
    ruleX1: 67, ruleX2: 85, ruleY: 32.9,
    noteY1: 35.5,
    noteY2: 37.5
  }),
  footer: Object.freeze({
    x: 2, y: 40.5, w: 86, h: 3.5,
    mainX: 3.2, mainY: 42.25,
    noteX: 87, noteY: 42.25
  })
});

const origin = data.origin;
const scale = data.scale;

function sx(x) {
  return origin.x + x * scale.x;
}

function sy(y) {
  return origin.y + y * scale.y;
}

try {
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("diagram");
  const plot = document.getElementById("plot");
  const visualTitle = document.getElementById("visual-title");

  function node(name, attributes, value) {
    const element = document.createElementNS(ns, name);
    Object.entries(attributes).forEach(([key, item]) => {
      element.setAttribute(key, String(item));
    });
    if (value !== undefined) {
      element.textContent = value;
    }
    return element;
  }

  function rect(x, y, w, h, className) {
    return node("rect", {
      x: sx(x),
      y: sy(y),
      width: sx(x + w) - sx(x),
      height: sy(y + h) - sy(y),
      class: className
    });
  }

  function line(x1, y1, x2, y2, className) {
    return node("line", {
      x1: sx(x1),
      y1: sy(y1),
      x2: sx(x2),
      y2: sy(y2),
      class: className
    });
  }

  function text(x, y, value, className, anchor) {
    return node("text", {
      x: sx(x),
      y: sy(y),
      class: className,
      "text-anchor": anchor
    }, value);
  }

  visualTitle.setAttribute("x", String(sx(data.title.x)));
  visualTitle.setAttribute("y", String(sy(data.title.y)));

  plot.append(
    rect(
      data.frame.x,
      data.frame.y,
      data.frame.w,
      data.frame.h,
      "canvas-bg"
    ),
    text(
      data.subtitle.x,
      data.subtitle.y,
      "Сначала тип задачи, затем длина сценария — и только потом процент.",
      "subtitle",
      "start"
    ),
    line(
      data.divider.x1,
      data.divider.y,
      data.divider.x2,
      data.divider.y,
      "section-rule"
    )
  );

  const table = data.table;
  plot.append(
    rect(table.x, table.y, table.w, table.headerH, "header-fill")
  );

  data.rows.forEach((row) => {
    plot.append(
      rect(
        table.x,
        row.y,
        table.w,
        row.h,
        row.alternate ? "row-fill-alt" : "row-fill"
      )
    );
  });

  plot.append(
    rect(table.x, table.y, table.w, table.h, "table-border")
  );

  table.columns.forEach((columnX) => {
    plot.append(
      line(
        columnX,
        table.y,
        columnX,
        table.y + table.h,
        "grid-line"
      )
    );
  });

  data.rows.forEach((row) => {
    plot.append(
      line(
        table.x,
        row.y,
        table.x + table.w,
        row.y,
        "grid-line"
      )
    );
  });

  table.heads.forEach((head) => {
    plot.append(
      text(head.x, head.y, head.label, "column-head", "start")
    );
  });

  data.rows.forEach((row) => {
    const layout = data.rowText;
    plot.append(
      text(
        layout.benchmarkX,
        row.y + layout.firstY,
        row.benchmark,
        "benchmark",
        "start"
      ),
      text(
        layout.taskX,
        row.y + layout.firstY,
        row.task1,
        "primary",
        "start"
      ),
      text(
        layout.taskX,
        row.y + layout.secondY,
        row.task2,
        "secondary",
        "start"
      ),
      text(
        layout.horizonX,
        row.y + layout.firstY,
        row.horizon1,
        "primary",
        "start"
      ),
      text(
        layout.horizonX,
        row.y + layout.secondY,
        row.horizon2,
        "secondary",
        "start"
      ),
      rect(
        layout.horizonX,
        row.y + layout.barY,
        row.bar,
        layout.barH,
        row.barClass
      )
    );
  });

  const quality = data.quality;
  plot.append(
    rect(
      quality.x,
      quality.y,
      quality.w,
      quality.h,
      "quality-border"
    ),
    text(
      quality.headX,
      quality.headY,
      "КАЧЕСТВО ОЦЕНКИ",
      "quality-head",
      "middle"
    ),
    rect(
      quality.fillX,
      quality.fillY,
      quality.fillW,
      quality.fillH,
      "quality-fill"
    ),
    text(
      quality.numberX,
      quality.numberY,
      "11,3",
      "quality-number",
      "middle"
    ),
    text(
      quality.numberX,
      quality.unitY,
      "ПРОЦЕНТНОГО ПУНКТА",
      "quality-unit",
      "middle"
    ),
    text(
      quality.numberX,
      quality.copyY1,
      "ложноотрицательных",
      "quality-copy",
      "middle"
    ),
    text(
      quality.numberX,
      quality.copyY2,
      "результатов исправлено",
      "quality-copy",
      "middle"
    ),
    text(
      quality.numberX,
      quality.markY,
      "✓",
      "quality-mark",
      "middle"
    ),
    line(
      quality.ruleX1,
      quality.ruleY,
      quality.ruleX2,
      quality.ruleY,
      "section-rule"
    ),
    text(
      quality.numberX,
      quality.noteY1,
      "Качество проверки —",
      "quality-note",
      "middle"
    ),
    text(
      quality.numberX,
      quality.noteY2,
      "тоже координата результата",
      "quality-note",
      "middle"
    )
  );

  const footer = data.footer;
  plot.append(
    rect(footer.x, footer.y, footer.w, footer.h, "footer-fill"),
    text(
      footer.mainX,
      footer.mainY,
      "70% BrowseComp ≠ 70% Hard",
      "footer-main",
      "start"
    ),
    text(
      footer.noteX,
      footer.noteY,
      "задача → горизонт → сравнение",
      "footer-note",
      "end"
    )
  );
} catch (error) {
  document.getElementById("diagram").hidden = true;
  document.getElementById("fallback").hidden = false;
}
</script>
</body>
</html>
