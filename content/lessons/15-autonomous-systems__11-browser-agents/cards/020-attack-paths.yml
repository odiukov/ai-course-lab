- concept: разные поверхности доставки сходятся в одну общую цепочку исполнения
  question: Расположи звенья пути вредоносной строки от источника до реального изменения состояния сайта.
  explanation: Поверхности доставки различаются только на входе; дальше любой заряд обязан пройти одну и ту же цепочку. Поэтому механизмов исполнения не столько же, сколько поверхностей — он один.
  kind: order
  items:
    - недоверенная строка попадает в контекст агента
    - модель интерпретирует её как указание, а не как данные
    - модель выбирает действие, соответствующее указанию
    - инструмент браузера выполняет действие с побочным эффектом
  id: 020-attack-paths-1
  fingerprint: acf4678a
- concept: цепочку исполнения можно разорвать на любом переходе, а не только на входе
  question: Заряд уже оказался в контексте агента, и удалить его источник нельзя. Какая мера всё ещё разрывает путь до последствий?
  explanation: 'Разрыв возможен на любом звене: не пустить строку в контекст, не считать её запросом пользователя, не дать соответствующего инструмента или потребовать подтверждения перед исполнением. Если вход уже упущен, работает последний переход — исполнение.'
  kind: choice
  options:
    - Требовать свежее подтверждение человека перед вызовом инструмента с побочным эффектом
    - Увеличить размер контекстного окна, чтобы полезный текст перевесил вредный
    - Понизить температуру выборки, чтобы ответ стал детерминированным
    - Сократить длину системного промпта агента
  correct: 0
