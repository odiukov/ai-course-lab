- concept: журнал запросов сессии не предотвращает действие, а делает произошедшее восстановимым после факта
  question: Все HTTP-запросы изолированной сессии агента сохраняются. Объясни, какую роль это играет в защите и чего такая мера не даёт.
  explanation: 'Полезно различать меры предотвращения и меры наблюдаемости. Журнал относится ко вторым: он сокращает время разбора инцидента и позволяет доказать радиус ущерба, но сам ни одного действия не остановит.'
  kind: open
  reference: 'Журнал ничего не блокирует: запрос уже ушёл к моменту записи. Он даёт восстановимость — по нему видно, какие страницы агент читал, в каком порядке и какой запрос изменил состояние, то есть можно найти источник вредной инструкции и оценить, что успело утечь или измениться. Это отвечает на вопрос «что произошло», а вопрос «не дать произойти» закрывают другие слои: allowlist убирает опасные возможности, граница чтение–запись и подтверждение человека тормозят действия с последствиями, изоляция ограничивает достижимые ресурсы.'
  id: 029-containment-3
  fingerprint: 564d3862
