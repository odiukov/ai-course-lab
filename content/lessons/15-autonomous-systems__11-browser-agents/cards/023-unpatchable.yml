- concept: безопасность следующего фрагмента текста не доказуема изнутри системы, поэтому строят систему, где небезопасное заметнее
  question: Какая формулировка корректно описывает предел, в который упирается защита агента от инъекций?
  explanation: 'Тот же ход рассуждений, что и с теоремой Лёба: внутреннего доказательства безопасности следующего токена нет. Белый список доменов и очистка содержимого — слои, повышающие цену атаки, а не доказательства.'
  kind: choice
  options:
    - Агент не может доказать безопасность очередного входящего фрагмента, но может построить систему, в которой небезопасное становится заметнее
    - Агент может доказать безопасность фрагмента, если запустит классификатор дважды и сравнит результаты
    - Безопасность гарантируется, если все страницы взяты из белого списка доменов
