- concept: слой известных шаблонов снимает дешёвые массовые атаки, а редкие сложные заряды сознательно оставлены дорогим слоям (граница чтение/запись, человек в контуре)
  question: 'Документация санитайзера честно пишет: «сложные заряды не останавливает». Объясни своими словами, почему это не признание провала слоя, и что должно стоять за ним.'
  explanation: 'Защиту строят слоями с разной ценой, а не одной идеальной стеной: дешёвый фильтр отсекает объём, дорогие слои разбирают остаток.'
  kind: open
  reference: 'Санитайзер узнаёт только знакомые формы: прямые требования забыть прежние инструкции, выдать секрет, выполнить действие от имени пользователя. Перефразировка, разбиение по элементам или маскировка под правдоподобный текст его проходят. Но он дёшев и снимает массовый поток типовых атак, оставляя дорогим слоям редкие сложные случаи. За ним обязаны стоять граница чтение/запись, белый список инструментов на задачу, изоляция сессии и подтверждение человеком для действий с последствиями.'
