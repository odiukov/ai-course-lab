- concept: смысловая метка описывает назначение элемента и потому переживает изменения вёрстки
  question: Магазин добавил над кнопкой оплаты рекламный баннер, переставил карточки товаров и перекрасил кнопку. Какая привязка агента к кнопке продолжит работать?
  explanation: Вёрстка, порядок, цвет и размеры меняются независимо от задачи элемента. Назначение обычно меняется только тогда, когда меняется сама функция кнопки, — поэтому оно и служит опорой.
  kind: choice
  options:
    - 'Привязка к назначению элемента: тип элемента плюс его понятное имя'
    - Привязка к номеру элемента в списке интерактивных элементов
    - Привязка к координатам элемента на экране
  correct: 0
  id: 017-stable-selection-1
  fingerprint: 7fbdd93f
- concept: одинаковые метки на странице делают метку неоднозначной, и требуется уточняющий контекст
  question: 'На странице две кнопки с одинаковым именем «Продолжить»: одна в форме доставки, другая в форме оплаты. Что делать агенту?'
  explanation: Смысловая метка устойчива, но не обязана быть уникальной. Когда совпадений несколько, уточнение берут не из раскладки, а из окружающего смысла — родительской формы или раздела.
  kind: choice
  options:
    - Добавить к метке уточняющий контекст — например, форму или блок, внутри которого ищется кнопка
    - 'Вернуться к выбору по позиции: при одинаковых именах он надёжнее'
    - 'Взять первую подходящую кнопку: имена совпадают, значит и действия совпадают'
  correct: 0
  id: 017-stable-selection-2
  fingerprint: d4ef1cf3
- concept: смысловая метка складывается из роли элемента и его понятного имени
  question: Из каких двух частей складывается смысловая метка интерактивного элемента и на какой вопрос отвечает каждая?
  explanation: Роль без имени не отличает одну кнопку от другой, имя без роли смешивает кнопку со ссылкой или заголовком. Опора нужна из обеих частей сразу.
  kind: open
  reference: 'Первая часть — тип (роль) элемента: кнопка, ссылка, поле ввода. Она отвечает на вопрос «что это такое». Вторая часть — понятное имя элемента, тот текст, по которому человек узнаёт его назначение («Оформить заказ»). Она отвечает на вопрос «для чего это». Вместе они задают элемент через его функцию, а не через место на странице.'
  id: 017-stable-selection-3
  fingerprint: 1c1ed3c6
