- concept: момент проявления сбоя агента не совпадает с моментом попадания вредных данных в контекст
  question: Агент обошёл семь страниц и на последней выполнил действие, которого пользователь не просил. Где разумнее всего искать причину?
  explanation: Контекст переносится между эпизодами прогона, поэтому вредная инструкция и её последствие разнесены во времени. Поиск причины строго на странице сбоя систематически промахивается.
  kind: choice
  options:
    - Только на последней странице — сбой проявился там
    - В том, что вошло в контекст на предыдущих страницах, потому что принятая ранее инструкция срабатывает позже
    - В формулировке исходного запроса пользователя, остальное значения не имеет
    - 'В случайности выборки модели: причину такого сбоя установить нельзя'
  correct: 1
  id: 008-page-walk-1
  fingerprint: e4135355
- concept: цикл обработки одной страницы внутри последовательного прогона агента
  question: Расставь действия агента на одной остановке последовательного обхода в правильном порядке.
  explanation: Один и тот же цикл повторяется на каждой остановке. Фиксация результата до перехода — то, что превращает прогон в след, по которому потом видно, после какой страницы поведение изменилось.
  kind: order
  items:
    - открыть адрес страницы
    - получить её содержимое
    - принять решение о действии
    - зафиксировать результат в общем следе прогона
    - перейти к следующей странице с сохранённым состоянием
  id: 008-page-walk-2
  fingerprint: 802f01f2
- concept: перестановка или независимая оценка страниц уничтожает причинную связь в прогоне
  question: Почему нельзя оценивать безопасность агента, прогоняя каждую страницу отдельным независимым вызовом модели?
  explanation: Именно накопленный контекст делает атаку возможной. Независимая оценка страниц измеряет другое явление и даёт ложное чувство безопасности.
  kind: open
  reference: 'Потому что при независимых вызовах у модели нет состояния, накопленного на предыдущих страницах. Инъекция со страницы A и её последствие на странице B в таком режиме никогда не встретятся: каждая страница по отдельности выглядит безобидной или подозрительной, но связь между ними исчезает. Порядок и общий контекст — часть измеряемого явления, а не деталь реализации.'
  id: 008-page-walk-3
  fingerprint: df70a91a
