- concept: 'ущерб от отложенной атаки требует совпадения двух условий в момент срабатывания: сохранённая инструкция и всё ещё действующие полномочия'
  question: Инструкция была записана в память агента давно и безвредно пролежала там. Объясни своими словами, что должно совпасть в момент её срабатывания, чтобы получился реальный ущерб, и что из этого можно контролировать отдельно.
  explanation: Память задаёт содержание отложенного действия, а действующие в момент срабатывания полномочия — его силу. Оценивать полномочия надо на момент исполнения, а не на момент записи.
  kind: open
  reference: 'Нужны одновременно две вещи: сохранённая инструкция возвращается в контекст и у агента в этот момент есть полномочия, достаточные для действия с последствиями. Контролировать можно каждое условие отдельно: чистить и проверять происхождение записей памяти, а также ограничивать область и срок действия ключей и сессий, чтобы к моменту срабатывания полномочий уже не было. Разрыв любого из двух условий обесценивает заряд.'
