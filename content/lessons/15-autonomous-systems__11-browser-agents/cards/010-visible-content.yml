- concept: отрицательный результат проверки говорит только о той области, которую проверка измеряет
  question: Проверка отрисованного текста страницы не нашла ни одной команды агенту. Что именно доказано?
  explanation: 'Область измерения задаёт область вывода. Проверка видимого текста — узкий прибор: полезный, но её отрицательный результат нельзя растягивать на слои, которых она не касалась.'
  kind: choice
  options:
    - Страница безопасна и её содержимое можно считать доверенным
    - В видимом человеку слое команды не найдено — про остальные части входа агента ничего не сказано
    - Агент точно не выполнит на этой странице никакого действия
    - Проверку можно расширить на весь прогон, раз одна страница чиста
  correct: 1
  id: 010-visible-content-1
  fingerprint: db52199a
- concept: видимый текст страницы — это читаемые надписи (заголовки, абзацы, подписи кнопок), а не картинка экрана
  question: Что попадает в поле «отрисованный текст» страницы?
  explanation: «Отрисованный» здесь означает показанный человеку текст, а не пиксели. Именно в этом слое лежит прямая инъекция, поэтому его удобно отдавать sanitizer'у.
  kind: choice
  options:
    - Скриншот экрана в виде изображения
    - 'Читаемые надписи страницы: заголовки, абзацы, подписи кнопок'
    - Полный исходный HTML со всеми атрибутами и скриптами
    - Только адрес страницы и её заголовок вкладки
  correct: 1
  id: 010-visible-content-2
  fingerprint: b58b0ddd
- concept: полезность узкого измерения при отсутствии гарантии полноты
  question: Объясни, почему проверка, которая заведомо не покрывает весь вход агента, всё равно остаётся ценной.
  explanation: Ценность защитного слоя измеряется тем, что он ловит, плюс честностью границ. Узкая проверка с точно объявленной областью лучше широкой с неизвестной.
  kind: open
  reference: 'Она даёт точный ответ на узкий вопрос: есть ли команда в показанном пользователю тексте. Прямая инъекция живёт именно там, и такая проверка ловит её дёшево и надёжно. Вред начинается не от узости, а от подмены вывода: когда «в видимом слое чисто» читают как «страница безопасна». Пока прибор честно объявляет свою область, его показания складываются с показаниями других проверок; как только он притворяется полной картиной, он становится источником ложной уверенности.'
  id: 010-visible-content-3
  fingerprint: 5948b1fe
