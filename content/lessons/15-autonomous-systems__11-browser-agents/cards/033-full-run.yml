- concept: 'блокировка действия границей не свидетельствует об обнаружении инъекции: слои отвечают на разные вопросы'
  question: В прогоне агента по недоверенной странице фильтр содержимого не отметил ничего подозрительного, а граница чтение/запись запретила предложенное действие. Что этот результат говорит об инъекции на странице?
  explanation: 'Фильтр отвечает: «похож ли фрагмент на известную атаку?». Граница отвечает: «допустима ли запись, если решение опирается на недоверенный источник?». Запрет возникает и для совершенно законного намерения, поэтому он не является детектором инъекции.'
  kind: choice
  options:
    - Инъекции на странице не было — иначе фильтр бы её отметил
    - Инъекция была распознана, просто отчёт приписал находку не тому слою
    - 'О наличии инъекции результат не говорит: граница оценивала допустимость записи, а не сходство текста с атакой'
    - Инъекция была, и граница подтвердила это, запретив действие
  correct: 2
  id: 033-full-run-1
  fingerprint: 1f3159f1
- concept: разные режимы обработки сравнимы только при одном и том же входе, иначе изменение поведения нельзя приписать слою
  question: 'Прогон показывает для одной страницы три исхода: поведение без защит, поведение с фильтрацией входа и поведение с проверкой границы записи. Объясни, при каком условии разница между исходами доказывает работу конкретного слоя.'
  explanation: Прогон не выдаёт один вердикт «безопасно» — он даёт набор решений разных слоёв на одном входе, и ценность именно в сопоставимости этих решений.
  kind: open
  reference: Только если все три ветки стартуют с одного и того же входа и отличаются ровно одним изменённым фактором — включённым режимом обработки. Тогда различие в выбранном действии причинно приписывается этому режиму. Если ветки получают разные входы (например, «без защит» считают уже на очищенном тексте) или один режим применяется поверх другого, изменение поведения объясняется сразу несколькими причинами и атрибуция теряется.
  id: 033-full-run-2
  fingerprint: 4c0d1680
