- concept: Hard subset WebArena-Verified отличается от базового набора наличием переходов состояния через несколько страниц
  question: Агент должен изменить настройку в личном кабинете, перейти в другой раздел и убедиться, что новое состояние сохранилось. Какой набор задач ближе всего воспроизводит такой сценарий?
  explanation: 'Ключевой признак задачи — цепочка страниц, между которыми переносится изменённое состояние. Именно это выделяет Hard subset: обычные транзакционные задачи короче и часто укладываются в один экран.'
  kind: choice
  options:
    - Задачи на поиск конкретного факта в открытом вебе
    - Hard subset WebArena-Verified с переходами состояния по нескольким страницам
    - Задачи на управление окнами и оболочкой рабочего стола
    - Любой набор, где итоговый процент успеха выше 90
  correct: 1
  id: 007-benchmark-check-1
  fingerprint: 6691e00d
- concept: транзакционные веб-бенчмарки работают на смоделированных сайтах, а поисковые — на живом открытом вебе
  question: Чем среда WebArena-Verified принципиально отличается от среды BrowseComp?
  explanation: Смоделированные сайты дают воспроизводимую проверку транзакции «довёл сценарий до конца». Открытый веб проверяет другое — способность найти факт в меняющемся, неконтролируемом источнике. Из-за разных сред числа этих бенчмарков не сравнимы напрямую.
  kind: choice
  options:
    - WebArena-Verified гоняет агента по смоделированным сайтам, BrowseComp — по открытому живому вебу
    - WebArena-Verified работает только с изображениями, BrowseComp — только с текстом
    - WebArena-Verified запускается локально без агента, BrowseComp требует ручной разметки каждого шага
    - Обе среды используют одни и те же сайты, различается только лимит времени
  correct: 0
  id: 007-benchmark-check-2
  fingerprint: 13d48947
- concept: высокий балл на одной оси измерения не переносится на задачу другой природы
  question: Агент показывает 82% на бенчмарке поиска фактов в открытом вебе. Продукт же требует бронирования билета через форму с оплатой. Объясни своими словами, почему это число почти ничего не говорит о продукте.
  explanation: 'Бенчмарки не упорядочены по «сложности» в один ряд: они измеряют разные способности. Перенос балла с оси на ось — типичная ошибка при выборе модели под продукт.'
  kind: open
  reference: 'Поисковый бенчмарк измеряет умение найти и вернуть факт: действие одно — прочитать. Бронирование требует последовательности действий с последствиями (заполнить, подтвердить, оплатить), где ошибка на любом шаге ломает всю цепочку и не отменяется. Это разные оси: чтение против доведения транзакции до конца. Нужен результат на транзакционном наборе задач, а не на поисковом, каким бы громким ни было число.'
  id: 007-benchmark-check-3
  fingerprint: 1391a5c1
