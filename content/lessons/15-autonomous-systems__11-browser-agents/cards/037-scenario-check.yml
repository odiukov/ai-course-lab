- concept: 'разметку сценария ведут по отдельным действиям, а не по экранам: один экран может содержать и чтения, и записи'
  question: 'Инженер размечает сценарий агента «оформить возврат товара» и составляет список по экранам магазина: страница заказа, страница возврата, страница подтверждения. Почему такая единица разметки ненадёжна?'
  explanation: 'На странице возврата агент читает условия и там же отправляет заявку. Классифицировать можно только действие: у чтения нет внешнего эффекта, у отправки заявки он есть. Экран — единица интерфейса, а не единица последствий.'
  kind: choice
  options:
    - Один экран может содержать и чтение данных, и действие, меняющее состояние сервиса, поэтому экран нельзя отнести целиком к чтениям или к записям
    - Экранов в сценарии всегда меньше, чем действий, поэтому список получится слишком коротким для отчёта
    - Названия экранов меняются при обновлении сайта, поэтому список быстро устареет
    - Разметка по экранам корректна, если агент видит страницы в том же порядке, что и человек
  correct: 0
  id: 037-scenario-check-1
  fingerprint: '03882055'
- concept: ворота человека в контуре ставят не на все записи, а на те, чьи последствия денежные, трудно обратимые или связаны с передачей чувствительных данных
  question: 'В сценарии агента-ассистента нашлись четыре записи: сохранить фильтр поиска в профиле, добавить товар в список желаний, изменить платёжный адрес аккаунта, оформить заказ с оплатой. Какие из них разумно закрыть подтверждением человека?'
  explanation: Признак записи и признак необходимости ворот — разные вещи. Сохранённый фильтр и список желаний легко откатить и ничего не стоят. Смена платёжного адреса затрагивает чувствительные данные и открывает путь к чужим списаниям, оплата необратима и стоит денег — вот на них и ставят подтверждение.
  kind: choice
  options:
    - 'Все четыре: любая запись меняет внешнее состояние'
    - Изменение платёжного адреса и оформление заказа
    - Только оформление заказа, потому что только оно стоит денег
    - 'Ни одну: агент уже получил разрешение работать в аккаунте'
  correct: 1
  id: 037-scenario-check-2
  fingerprint: 81b8bffe
- concept: 'порядок построения разметки сценария до запуска агента: перечислить действия, классифицировать, отобрать записи под ворота, поставить ворота перед действием'
  question: Расставь по порядку шаги подготовки сценария браузерного агента к запуску.
  explanation: 'Сначала инвентарь действий, потом классификация, потом отбор среди записей, и только потом установка ворот. Если начать с ворот, они окажутся расставлены по интуиции: перед безобидными сохранениями настроек и после оплаты, где подтверждение уже ничего не защищает.'
  kind: order
  items:
    - Перечислить все действия сценария поштучно, без группировки по страницам
    - Отнести каждое действие к чтениям или к записям по наличию изменения внешнего состояния
    - Из записей выделить те, чьи последствия трудно обратимы, денежны или связаны с чувствительными данными
    - Поставить подтверждение человека непосредственно перед исполнением каждой такой записи
  id: 037-scenario-check-3
  fingerprint: 455c0a68
