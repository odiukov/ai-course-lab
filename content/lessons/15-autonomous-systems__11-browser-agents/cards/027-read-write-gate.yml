- concept: действие относят к записи по признаку изменения внешнего состояния, а не по сложности или видимости
  question: Какое из действий браузерного агента относится к записи в смысле границы чтение–запись?
  explanation: 'Критерий один: меняется ли состояние вне агента. Отзыв остаётся на сайте и виден другим — это запись. Раскрытие блока, прокрутка и открытие вкладки меняют лишь наблюдение агента, отменить их нечего. Поэтому чтение можно делать свободно, а записей в реальном сценарии единицы против сотен чтений — подтверждение на них почти не мешает работе.'
  kind: choice
  options:
    - Оставить отзыв под товаром
    - Раскрыть блок «характеристики» и извлечь оттуда вес
    - Пролистать список результатов до конца
    - Открыть карточку товара в новой вкладке
