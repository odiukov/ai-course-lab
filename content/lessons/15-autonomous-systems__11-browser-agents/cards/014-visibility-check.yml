- concept: скрытую инъекцию выявляют сопоставлением видимого человеку текста с полным входом модели, а не осмотром страницы
  question: Страница при визуальном осмотре выглядит чистой. Какая проверка способна обнаружить инструкцию, доставленную агенту в обход экрана?
  explanation: Расхождение между тем, что читает человек, и тем, что читает модель, — рабочий признак скрытой инъекции. Осмотр экрана измеряет только один из каналов доставки.
  kind: choice
  options:
    - Сравнить отрисованный текст страницы с полным входом, который получает модель
    - Открыть страницу ещё раз и внимательнее прочитать заголовки и абзацы
    - Проверить сертификат и репутацию домена
  correct: 0
  id: 014-visibility-check-1
  fingerprint: 701b861b
- concept: недоверенная страница может использовать уже открытую авторизованную сессию агента для запросов, меняющих состояние
  question: Агент работает в браузере, где пользователь уже авторизован в почте и в банке. Страница злоумышленника подсовывает агенту запрос, меняющий состояние аккаунта, и запрос проходит. Почему?
  explanation: 'Это класс CSRF-образных атак на аутентифицированные сессии: полномочия берутся не у страницы, а у пользователя, от чьего имени действует агент. Опасность возникает именно от совмещения недоверенного содержимого и открытой сессии.'
  kind: choice
  options:
    - Агент выполняет запрос из браузера пользователя, поэтому к нему прикладываются cookies сессии и сервер считает запрос легитимным
    - Такие запросы всегда выполняются от имени страницы, а не пользователя
    - Сервер не может отличить агента от человека только по содержимому запроса, но сессию проверяет и отклоняет
  correct: 0
