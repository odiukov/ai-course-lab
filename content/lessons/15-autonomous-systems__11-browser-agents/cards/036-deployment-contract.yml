- concept: зоны доверия и разрешённые записи фиксируют до первого прогона, иначе границы определит первый инцидент
  question: Команда готовит первый запуск агента, который собирает данные в открытом вебе и складывает их во внутреннее хранилище. Почему список зон доверия и разрешённых записей пишут до запуска, а не после первых прогонов?
  explanation: 'Страница с зонами и разрешениями пишется за полчаса, расследование инцидента занимает дни. Без неё каждое совершённое действие постфактум трактуется как «разрешённое», и обсуждать нечего: не с чем сравнивать.'
  kind: choice
  options:
    - Иначе решения агента станут фактической политикой, и границы будут определены задним числом уже случившимся инцидентом
    - Иначе агент не сможет технически запуститься без конфигурации
    - Потому что после запуска изменить набор инструментов уже нельзя
    - Потому что реальные прогоны не дают информации о зонах доверия
  correct: 0
  id: 036-deployment-contract-1
  fingerprint: 322af34e
- concept: разрешение формулируют как конкретное проверяемое действие, а не как общее свойство поведения
  question: Какая формулировка в договоре о развёртывании агента годится в качестве разрешения?
  explanation: 'Первая, третья и четвёртая формулировки не имеют исхода, который можно наблюдать в прогоне: любое поведение им соответствует. Вторая проверяется одним прогоном — либо сообщение ушло без подтверждения, либо нет.'
  kind: choice
  options:
    - «Агент действует осмотрительно с внешними данными»
    - «Агент не публикует и не отправляет сообщения без явного подтверждения человека»
    - «Агент минимизирует риск при работе с недоверенными источниками»
    - «Агент использует инструменты ответственно»
  correct: 1
  id: 036-deployment-contract-2
  fingerprint: 9c79a371
- concept: договор о развёртывании не добавляет механизмов, а привязывает каждую разрешённую запись к обязательному рубежу
  question: Договор о развёртывании не вводит ни одного нового защитного механизма. В чём тогда его функция?
  explanation: 'Ценность договора — в адресности: он отвечает не «безопасно ли развёртывание», а «где именно обязана сработать каждая из уже имеющихся защит».'
  kind: open
  reference: 'Он связывает две уже существующие вещи: перечень действий, меняющих внешнее состояние, и перечень уже реализованных рубежей (граница чтение/запись, набор инструментов для задачи, изоляция сессии с ключами ограниченной области, одобрение человека, канарейка на памяти). Напротив каждой разрешённой записи указано, какой рубеж обязан стоять до первого прогона. Так неявные ожидания превращаются в проверяемые требования, а пропуск рубежа становится видимым дефектом конфигурации, а не незамеченной случайностью.'
  id: 036-deployment-contract-3
  fingerprint: 068b1f4f
