- concept: канарейка на памяти даёт наблюдаемость записи, а не гарантию её безопасности и не блокировку
  question: К записям в долгосрочной памяти агента привязали канарейку. Что она обеспечивает?
  explanation: 'Канарейка не выносит суждения о содержимом и не обязана останавливать запись. Её задача — превратить тихое изменение долгосрочного состояния в заметное событие: подложная запись останется подложной, но перестанет быть незамеченной. Блокировку и проверку содержания закрывают другие слои.'
  kind: choice
  options:
    - Пользователь увидит сам факт изменения памяти и сможет его разобрать
    - 'Вредные записи не попадут в память: канарейка блокирует запись'
    - Содержимое записи проверено как безопасное перед сохранением
    - Инструкция из памяти не сможет повлиять на будущие сессии
  correct: 0
