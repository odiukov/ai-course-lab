- concept: одобрение человека должно быть свежим и относиться к конкретной записи, а не выдаваться разом на сессию
  question: 'Пользователь в начале работы согласился: «Да, можешь отправлять письма от моего имени». Позже агент собирает адресатов и текст со страницы и готовит рассылку. Что требует схема «сначала предложи, потом исполняй»?'
  explanation: 'Раннее общее согласие покрывает класс действий, но не их содержание; между согласием и действием в контекст мог попасть недоверенный текст. Свежесть и привязка к конкретной записи и делают проверку осмысленной: человек видит фактические побочные эффекты, а не категорию. Подтверждение после отправки уже ничего не защищает — письмо затронуло других людей.'
  kind: choice
  options:
    - Новое подтверждение именно этой отправки, с показом адресатов и текста
    - 'Ничего: согласие на отправку писем уже получено в начале сессии'
    - Подтверждение только если письмо уходит внешним адресатам
    - Подтверждение после отправки, чтобы пользователь знал результат
  correct: 0
  id: 030-human-memory-1
  fingerprint: 77a9fe8a
- concept: человеку в контуре показывают конкретные побочные эффекты предлагаемого действия, включая данные недоверенного происхождения
  question: Агент предлагает действие с последствиями на подтверждение. Что нужно вывести человеку, чтобы проверка работала?
  explanation: Человек может отличить подложные данные от нужных только увидев фактические параметры записи. Название инструмента и уверенность агента не покажут, что список адресатов пришёл с недоверенной страницы; пересказ цели тем более не содержит того, что уйдёт наружу.
  kind: choice
  options:
    - Конкретные значения, с которыми выполнится действие — адресаты, суммы, текст — включая те, что взяты со страниц
    - Название инструмента и оценку уверенности агента в своём решении
    - Список страниц, которые агент прочитал, без содержимого действия
    - Пересказ задачи своими словами, чтобы человек убедился, что цель понята
  correct: 0
  id: 030-human-memory-2
