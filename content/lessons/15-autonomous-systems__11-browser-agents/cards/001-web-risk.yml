- concept: длина горизонта в вебе увеличивает не только число действий, но и число недоверенных входов, и достаточно одного подложного
  question: Агент решает задачу за 12 переходов по сайтам. Чем его длинный горизонт опаснее длинного горизонта агента, работающего в закрытой среде без сети?
  explanation: 'Собственные ошибки планирования есть в любой среде. Веб добавляет второе измерение: содержимое каждой страницы пишут владельцы сайтов, а не пользователь. Число встреч с чужим текстом растёт вместе с числом шагов, и провал не требует «накопления» — хватает одной страницы из дюжины.'
  kind: choice
  options:
    - Переходы по сети медленнее, поэтому чаще срабатывают таймауты
    - Каждый переход добавляет в контекст текст, написанный посторонним автором, и одной подложной страницы хватает, чтобы изменить поведение агента
    - В вебе агент чаще путает порядок собственных шагов, чем в закрытой среде
    - Длинный горизонт всегда снижает точность одинаково, среда роли не играет
  correct: 1
  id: 001-web-risk-1
  fingerprint: c7043bc6
- concept: риск браузерного агента возникает на пересечении недоверенного входа и полномочий совершать действия с последствиями
  question: Объясни своими словами, почему браузерного агента выделяют в отдельный класс риска, хотя обычная языковая модель тоже читает произвольные тексты.
  explanation: 'Отсюда и вывод главы по готовности OpenAI, что косвенный prompt injection — не баг, который закрывается до конца: атака живёт на стыке чтения и действия, а не внутри одной из этих способностей. Корпус атак (подмена памяти через специально сделанную страницу, команды в фрагментах URL, захваты в один клик) — разные способы попасть в это пересечение.'
  kind: open
  reference: 'Риск даёт сочетание двух свойств сразу. Первое: агент читает недоверенное содержимое — страницы, формы, подписи к кнопкам, URL, написанные неизвестными людьми, и включить их в работу обязан, иначе вебом не воспользуешься. Второе: у агента есть полномочия совершать действия с последствиями — отправлять формы, покупать, писать в память, ходить по ссылкам. Модель, которая только читает и отвечает пользователю, недоверенный текст обрабатывает, но исполнить его не может. Агент, действующий строго по входу от пользователя, полномочия имеет, но чужого текста не получает. Опасен именно пересечение: чужой текст попадает в тот же контекст, что и задача, а за контекстом стоят реальные действия.'
  id: 001-web-risk-2
  fingerprint: 88672fbd
