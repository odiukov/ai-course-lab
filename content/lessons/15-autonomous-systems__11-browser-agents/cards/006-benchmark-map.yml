- concept: горизонт задачи переводится в порядок числа действий
  question: Агент совершает примерно 8 действий в минуту. Сколько действий он выполнит за сценарий длиной 40 минут?
  explanation: 'Горизонт — это прежде всего число шагов: короткая задача укладывается в единицы действий, получасовая — в сотни. Каждое дополнительное действие добавляет шанс сорваться, поэтому разница горизонтов в один-два порядка меняет смысл одинакового процента успеха.'
  kind: numeric
  answer: 320
  tolerance: 40
  id: 006-benchmark-map-1
  fingerprint: 2f7481d5
- concept: одинаковый процент успеха на разных горизонтах означает разную надёжность
  question: Агент даёт 62% на коротких поисковых задачах и 62% на длинных многостраничных сценариях с переходами состояния. Что верно?
  explanation: 'Надёжность падает с горизонтом: чтобы удержать те же 62% на сотне-другой действий, агент должен переживать гораздо больше точек отказа, чем на 5–10 шагах. Проценты сравнимы только внутри одной области карты.'
  kind: choice
  options:
    - Это один и тот же уровень надёжности, выраженный в одинаковых процентах
    - Второй результат достигнут при кратно большем числе шагов, значит за ним стоит существенно более высокая устойчивость
    - Второй результат хуже, потому что длинные задачи проще
    - Проценты сопоставимы только если совпадает число задач в бенчмарке
  correct: 1
  id: 006-benchmark-map-2
  fingerprint: 1356d368
- concept: порядок чтения карты бенчмарков перед сравнением моделей
  question: Расставь шаги выбора бенчмарка по карте задач.
  explanation: 'Если начать со сравнения громких чисел, одно значение незаметно ответит на чужой вопрос. Оценка приобретает смысл только вместе с координатами задачи: типом работы и горизонтом.'
  kind: order
  items:
    - 'Определить, какую работу реально выполняют пользователи: поиск факта, управление рабочим столом или изменение состояния сайта'
    - Найти область карты, соответствующую этой работе
    - Уточнить горизонт задачи — число действий и длительность до результата
    - Сравнить оценки моделей внутри подходящей области и горизонта
  id: 006-benchmark-map-3
  fingerprint: e6190e9e
