- concept: вставка элементов выше цели сдвигает её индекс на число вставленных
  question: В списке 7 интерактивных элементов, нужная кнопка стоит шестой по порядку (нумерация с единицы). Перед следующим запуском выше неё появились два новых элемента. Какой индекс с нуля теперь указывает на нужную кнопку?
  explanation: Шестая по порядку кнопка имела индекс 5 при отсчёте с нуля. Два вставленных выше элемента сдвигают её на 5 + 2 = 7. Прежний индекс 5 теперь указывает на чужой элемент, и обращение по нему остаётся формально корректным.
  kind: numeric
  answer: 7
  tolerance: 0.5
  id: 015-index-selection-3
  fingerprint: 08bb57d7
