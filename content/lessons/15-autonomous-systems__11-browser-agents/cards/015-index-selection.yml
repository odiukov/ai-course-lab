- concept: 'позиционный сбой тихий: действие формально выполняется, поэтому сигнала об ошибке не возникает'
  question: Агенту велено нажать элемент по позиции; порядок элементов сдвинулся, и он нажал «Назад» вместо «Оплатить». Чем такой сбой особенно опасен по сравнению с падением по исключению?
  explanation: 'Обращение по позиции валидно: элемент существует, клик проходит, исключения нет. Ошибка проявляется лишь в последствиях действия, поэтому автоматика её не ловит — в отличие от явного «элемент не найден».'
  kind: choice
  options:
    - Он повторяется реже и потому не воспроизводится
    - Он приводит к отказу браузера и потере сессии
    - Команда формально выполнена успешно, ошибки не возникает — неверное действие уходит в продакшен без сигнала
    - Он ломает только визуальную часть страницы, не затрагивая данные
  correct: 2
  id: 015-index-selection-2
