- concept: ложноотрицательные срабатывания разметки бенчмарка систематически занижают результат, и поправка сдвигает все числа вверх
  question: Бенчмарк отмечает как проваленные 9% задач, которые на самом деле решены (ошибка разметки, а не модели). Агент получил по такой разметке 52%. Какой результат покажет пересчёт по выверенным человеком критериям успеха, в процентах?
  explanation: 'Ложноотрицательные срабатывания занижают счёт: 52% + 9% = 61%. В исходной WebArena доля таких срабатываний была около 11,3%, и WebArena-Verified пересчитала результаты по человеческим критериям именно поэтому. Важно не столько само смещение, сколько его размер относительно разрыва между моделями.'
  kind: numeric
  answer: 61
  tolerance: 2
