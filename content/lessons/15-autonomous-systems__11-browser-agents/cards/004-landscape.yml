- concept: разрыв между моделями интерпретируем только если он больше погрешности разметки бенчмарка
  question: Разметка бенчмарка ошибочно засчитывает провал примерно в 9% задач. Модель A набрала 52%, модель B — 57%. Что корректно сказать о сравнении?
  explanation: 'Ошибки разметки распределяются по задачам неравномерно между моделями, так что «одинаково бьёт» не гарантировано. Когда доля ложноотрицательных сопоставима с разрывом, вся видимая разница может лежать внутри ошибки измерения. Ровно ради этого сделана WebArena-Verified: выверенные человеком критерии успеха дороже ещё одного процента у модели.'
  kind: choice
  options:
    - Модель B лучше на 5 процентных пунктов — разница измерена и надёжна
    - Разрыв меньше погрешности разметки, поэтому порядок моделей по этому числу не установлен; нужен пересчёт по выверенным критериям
    - Обе модели надо считать проваленными, раз бенчмарк ошибается
    - Ошибка разметки одинаково бьёт по обеим моделям, поэтому разрыв всегда сохраняется
