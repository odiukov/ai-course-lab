- concept: косвенный prompt injection — команда размещается в данных, за которыми агент придёт сам
  question: Чем косвенный prompt injection отличается от прямой атаки на модель?
  explanation: 'В косвенной атаке нет прямого канала к модели: команду кладут туда, куда агент придёт за данными — в текст страницы, поле формы, фрагмент URL. Агент открывает страницу ради своей цели и вместе с данными получает чужую.'
  kind: choice
  options:
    - Злоумышленник не пишет модели сам, а закладывает команду в содержимое, которое агент прочитает по ходу задачи
    - Злоумышленник получает доступ к весам модели и меняет её поведение
    - Злоумышленник шифрует свой запрос, чтобы фильтр не распознал слова
    - Злоумышленник посылает много запросов подряд, пока модель не собьётся
  correct: 0
  id: 002-trust-boundary-1
  fingerprint: dbc8d887
- concept: текст не несёт информации о полномочиях источника, поэтому граница «данные / команда» задаётся снаружи модели
  question: Почему модель не может по самому тексту надёжно отличить данные страницы от команды, которую следует выполнять?
  explanation: Ключ — источник, а не содержание. Модель обязана обработать содержимое недоверенного источника, значит грамматически убедительная инструкция ей всё равно встретится; отсечь её можно только внешними механизмами.
  kind: open
  reference: 'Полномочия не содержатся в смысле фразы. «Добавь число в таблицу» одинаково выглядит и как поручение пользователя, и как надпись на чужом сайте. В контексте всё это — одни и те же токены, без встроенной разметки «это данные, а это инструкция». Разметку приходится добавлять снаружи: помечать источник, ограничивать инструменты, требовать подтверждения на действия с последствиями. Поэтому косвенный prompt injection считается не багом, который закрывается полностью, а свойством размытой границы между чтением и действием.'
  id: 002-trust-boundary-2
  fingerprint: 783b39bc
- concept: каналы доставки инъекции не ограничены видимым основным текстом страницы
  question: Команду для агента злоумышленник может спрятать в разных местах. Какой набор мест корректен?
  explanation: 'Любой текст, попадающий в контекст, годится как канал: разметка страницы, поля форм, память агента, фрагмент URL (атака класса HashJack). Фильтрация только видимого текста оставляет остальные каналы открытыми.'
  kind: choice
  options:
    - Только видимый основной текст страницы
    - Только поля ввода, которые агент заполняет
    - Основной текст, поля форм, а также фрагмент URL, по которому агент переходит
    - Только заголовок вкладки браузера
  correct: 2
  id: 002-trust-boundary-3
  fingerprint: a9bec4c8
