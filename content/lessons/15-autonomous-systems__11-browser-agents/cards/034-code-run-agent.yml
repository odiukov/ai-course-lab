- concept: базовая ветка «без защит» вычисляется на неочищенном входе, иначе эффект защит завышается
  question: В прогоне сравнения режимов заполни пропуск в ветке, моделирующей агента без защит.
  explanation: 'Если в наивную ветку подать sanitize(agent_input), обе ветки увидят одинаковый очищенный текст и защита получит завышенную оценку: сравнивать станет не с чем.'
  kind: cloze
  template: |-
    naive_action = decide_action(___)  # ветка без защит
    filtered_action = decide_action(sanitize(agent_input))
  answer: agent_input
  accept:
    - agent_input
    - полный вход агента
    - raw_input
    - full_input
  id: 034-code-run-agent-1
  fingerprint: 087caf20
- concept: защитные ветки применяются независимо к одному входу, результат одной не является входом другой
  question: Прогон проверяет фильтрацию содержимого и границу записи. Как их следует применять к одной странице, чтобы отчёт был осмысленным?
  explanation: Слои измеряют разные свойства. Цепочка «фильтр, потом граница» даёт одно смешанное число и скрывает, какой рубеж сработал; независимые ветки на общем входе дают по результату на слой и позволяют увидеть случай, когда не сработал никто.
  kind: choice
  options:
    - Каждую отдельно к исходному входу страницы, сохранив два независимых результата
    - Сначала отфильтровать вход, затем на отфильтрованном проверить границу и записать один общий результат
    - Сначала проверить границу, затем фильтровать только разрешённые действия
    - Применять фильтр к странице, а границу — к следующей странице обхода
  correct: 0
  id: 034-code-run-agent-2
  fingerprint: a732be65
- concept: 'отметка промаха — конъюнкция: действие вредоносно И прошло все проверки'
  question: По какому условию строка прогона помечается как промах защиты?
  explanation: Безобидная страница почти всегда проходит все проверки — это нормальная работа, а не промах. Промах требует одновременно вредоносности действия и его допустимости после каждой защиты; иначе счётчик промахов заполнят ложные записи и колонка перестанет что-либо значить.
  kind: choice
  options:
    - Ни одна проверка не сработала на этой странице
    - Фильтр не отметил содержимое страницы
    - Действие вредоносно и осталось допустимым после всех проверок
    - Граница разрешила действие
  correct: 2
  id: 034-code-run-agent-3
  fingerprint: 451946f0
