- concept: 'предикат границы решает в фиксированном порядке: сначала природа действия, затем происхождение инициатора, затем наличие одобрения'
  question: Расположи проверки внутри функции, решающей, пропускать ли действие агента через границу чтение–запись.
  explanation: 'Порядок не косметика: он определяет, что чтение вообще не доходит до проверки происхождения, а происхождение проверяется раньше, чем спрашивают об одобрении. Перестановка приводит либо к требованию подтверждать чтение, либо к запросу одобрения там, где инициатором был сам пользователь.'
  kind: order
  items:
    - 'Определить, создаёт ли действие побочный эффект: если это чтение — разрешить сразу'
    - Для записи выяснить, пришла ли инициирующая инструкция из-за границы доверия; доверенный источник разрешить
    - Для записи из недоверенного источника разрешить только при наличии свежего одобрения человека
  id: 028-code-boundary-1
  fingerprint: fb81855c
- concept: запись разрешается дизъюнкцией доверенного происхождения и полученного одобрения
  question: Функция уже установила, что действие — запись. Заполни пропуск в возвращаемом условии.
  explanation: Записи от доверенного источника проходят без дополнительного шага, недоверенные — только вместе с одобрением. Замена `or` на `and` потребовала бы подтверждать каждую запись, включая инициированные пользователем; проверка одного лишь `human_approved` теряет смысл различения источника.
  kind: cloze
  template: |-
    def boundary_allows(is_write, from_untrusted, human_approved):
        if not is_write:
            return True
        return ___
  answer: not from_untrusted or human_approved
  accept:
    - not from_untrusted or human_approved
    - human_approved or not from_untrusted
    - (not from_untrusted) or human_approved
  id: 028-code-boundary-2
  fingerprint: 93ff19a6
- concept: граница ограничивает переход прочитанного в действие, а не доступ к недоверенному содержимому
  question: Реализация границы возвращает запрет для любого действия, инициированного недоверенным веб-содержимым. Почему это ошибка?
  explanation: Прочитать ловушку агенту по-прежнему можно — чтение не меняет внешний мир. Останавливать надо момент превращения прочитанного в изменение состояния. Слишком широкий запрет ломает работу, ничего не добавляя к безопасности.
  kind: choice
  options:
    - Она запрещает и чтение недоверенных страниц, а без чтения агент не может выполнять свою задачу
    - Она пропускает записи от доверенного источника без одобрения
    - Она делает лишним sanitizer, который должен работать на том же входе
    - 'Она требует одобрения человека дважды: до и после действия'
  correct: 0
