- concept: промах фиксирует остаточный маршрут ущерба, чего счётчики срабатываний защит не показывают
  question: 'Отчёт прогона содержит: «фильтр отметил 7 фрагментов», «граница запретила 4 действия», «промахов: 1». Почему последняя строка информативнее двух первых?'
  explanation: 'Срабатывания подтверждают лишь то, что уже покрыто. Промах — пересечение двух отказов: фильтр не счёл фрагмент подозрительным, граница разрешила действие. Только он описывает остаточный путь, где ущерб всё ещё возможен, и по нему выбирают, что укреплять.'
  kind: choice
  options:
    - Она показывает конкретный путь, по которому вредное действие дошло до исполнения, не нарушив ни одного условия остановки
    - Она измеряет общую надёжность системы в процентах
    - Она означает, что фильтр нужно расширить новым шаблоном
    - Она показывает, какой из слоёв работает хуже остальных
  correct: 0
  id: 035-miss-analysis-1
  fingerprint: c557357a
- concept: промах разбирают по ходу движения данных от входа к совершённому действию
  question: Расставь шаги разбора промаха в порядке движения данных.
  explanation: Разбор идёт по маршруту данных, а не по важности слоёв. Иначе легко исправить последнее звено, не поняв, где вредный фрагмент вошёл и почему прошёл первую проверку.
  kind: order
  items:
    - определить, какой фрагмент недоверенного содержимого попал в контекст агента
    - выяснить, почему фильтр не счёл этот фрагмент подозрительным
    - установить, какое действие агент выбрал под влиянием фрагмента
    - выяснить, почему граница признала это действие допустимым
  id: 035-miss-analysis-2
  fingerprint: 2746ffb2
- concept: изменение защиты оценивают против конкретного промаха, иначе нельзя отличить закрытие маршрута от добавления правила рядом с ним
  question: 'После обнаружения промаха возникает соблазн «усилить всё сразу»: добавить шаблонов в фильтр, ужесточить границу, сузить набор инструментов. Объясни, почему так делать не стоит.'
  explanation: Промах — это тест. Правка защиты имеет смысл, только если известно, что она провалит этот тест до изменения и пройдёт после.
  kind: open
  reference: 'При одновременном изменении нескольких слоёв исчезает проверяемая связь между правкой и исходом: повторный прогон покажет отсутствие промаха, но не скажет, закрыт ли найденный маршрут или он просто перестал воспроизводиться, пока новое правило действует рядом с ним. Плюс каждое ужесточение платит ложными срабатываниями и трением. Правильный порядок: воспроизвести конкретный промах, изменить один слой, повторить прогон и убедиться, что перекрыт именно этот путь.'
  id: 035-miss-analysis-3
  fingerprint: 7703065e
