- concept: сравнение с шаблоном инъекции идёт по нормализованному регистру, иначе смена регистра обходит фильтр
  question: Sanitizer ищет в собранном контексте известные фразы-инъекции. Заполни пропуск так, чтобы фраза находилась и в записи прописными буквами.
  explanation: Шаблоны хранят в нижнем регистре, а вход перед поиском нормализуют. Без нормализации `IGNORE PREVIOUS INSTRUCTIONS` не совпадёт с шаблоном `ignore previous instructions`, и атака станет «безопасной» лишь из-за раскладки заглавных букв. Смена регистра ничего не меняет в смысле команды для модели, поэтому и фильтр не должен от неё зависеть.
  kind: cloze
  template: |-
    for pattern in KNOWN_PATTERNS:
        if pattern in context.___():
  answer: lower
  accept:
    - lower
    - casefold
    - 'lower '
    - 'casefold '
  id: 025-code-sanitize-1
  fingerprint: 840969cd
- concept: совпадение заменяется нейтральной пометкой на месте, а не приводит к отбрасыванию всего контекста
  question: Sanitizer нашёл в контексте страницы один фрагмент, совпавший с известным шаблоном инъекции. Остальной текст — цены, названия и описания, нужные для задачи. Что должна вернуть функция?
  explanation: 'Задача очистки — снять исполнимость команды, а не лишить агента данных. Точечная замена оставляет полезное содержимое и одновременно оставляет след: в результате прогона видно место срабатывания фильтра. Вариант с предупреждением бесполезен — исходная строка всё равно уйдёт в контекст модели и повлияет на рассуждение; полное отбрасывание ломает задачу из-за одного совпадения.'
  kind: choice
  options:
    - Тот же контекст, где совпавший фрагмент заменён нейтральной пометкой, а прочий текст сохранён
    - 'Пустую строку: контекст со совпадением целиком считается недоверенным'
    - Исходный контекст без изменений плюс приписанное предупреждение «найдена инъекция»
    - Только совпавший фрагмент, чтобы человек мог его изучить
  correct: 0
  id: 025-code-sanitize-2
  fingerprint: fcbc4507
- concept: 'очистка не различает канал доставки: весь собранный ввод обрабатывается как одна недоверенная строка'
  question: Агент собрал контекст из адреса страницы, её видимого текста и значений атрибутов. Как sanitizer должен разбираться с этими частями?
  explanation: Для модели всё это — один вход, и команда в фрагменте URL исполнима так же, как команда в абзаце. Попытка сортировать части по «видимости» добавляет предположение, которое sanitizer проверить не может, и создаёт щель ровно там, куда прячут заряд.
  kind: choice
  options:
    - Обработать всю собранную строку целиком, одинаково для любой части
    - 'Чистить только видимый человеку текст: остальное человек всё равно не читает'
    - Сначала определить, какие части человек видел, и чистить лишь невидимые
    - 'Чистить только адрес страницы: текст даёт сам сайт и он проверяем'
  correct: 0
  id: 025-code-sanitize-3
  fingerprint: 85bfba94
