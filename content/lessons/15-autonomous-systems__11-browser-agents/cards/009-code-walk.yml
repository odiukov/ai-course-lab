- concept: аккумулятор возвращается после завершения цикла, а не изнутри него
  question: Функция должна обойти весь список страниц и вернуть результаты всех. Допиши недостающую строку.
  explanation: 'return внутри цикла завершает функцию на первой же итерации: обход есть, но обработана одна страница. Возврат ставится на уровне тела функции, после цикла, когда аккумулятор уже заполнен.'
  kind: cloze
  template: |-
    def walk(pages):
        results = []
        for page in pages:
            results.append(process(page))
        ___
  answer: return results
  accept:
    - return results
    - return(results)
    - return  results
  id: 009-code-walk-1
  fingerprint: 7851c26e
- concept: 'инвариант обхода: одна входная страница даёт ровно один элемент результата'
  question: На вход обходу подали 7 страниц. Функция обходит их все и на каждую вызывает обработку. Сколько элементов должен содержать возвращённый список?
  explanation: Соответствие один-к-одному — проверяемый инвариант полноты обхода. Меньшее число элементов означает ранний выход (return или break внутри цикла) либо пропуск части страниц, и это видно до всякого разбора содержимого.
  kind: numeric
  answer: 7
  tolerance: 0.5
  id: 009-code-walk-2
  fingerprint: 63a90b61
- concept: страница с вредным содержимым тоже даёт запись в результате, иначе исход «защита не сработала» пропадает из сравнения
  question: Прогон агента проходит по страницам, среди которых есть страница с внедрённой инструкцией. Почему обход должен добавить результат и по ней тоже, а не пропустить её молча?
  explanation: 'Ценность прогона — в честной колонке промахов. Пропуск страницы делает вывод короче входа и прячет именно тот исход, ради которого прогон и делается: содержимое дошло до агента, и ни одна защита его не остановила.'
  kind: choice
  options:
    - Иначе исход «атака прошла защиту» исчезнет из вывода, и сравнение защитных мер будет опираться только на успешные случаи
    - Иначе список окажется неизменяемым и его нельзя будет дополнить
    - Иначе обработка следующих страниц замедлится из-за повторного разбора
    - Иначе вредная инструкция сохранится в памяти агента до следующей сессии
  correct: 0
