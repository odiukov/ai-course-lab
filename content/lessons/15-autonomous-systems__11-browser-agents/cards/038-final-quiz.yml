- concept: инструмент, совмещающий чтение и побочный эффект в одном вызове, делает границу чтение/запись неприменимой, потому что классификация вызова перестаёт быть однозначной
  question: Агенту дали инструмент, который одним вызовом открывает ссылку и заодно подтверждает подписку по этой ссылке. Объясни своими словами, почему такой инструмент ломает границу чтения и записи и что с ним делать.
  explanation: Границу задаёт не список разрешённых инструментов, а разделимость действий на «без последствий» и «с последствиями». Инструмент, который склеивает то и другое, обходит ворота, ничего формально не нарушая.
  kind: open
  reference: 'Граница работает, пока каждый вызов однозначно относится либо к чтению (без последствий, ворот нет), либо к записи (последствия есть, нужны ворота). Смешанный вызов классифицировать нельзя: если пропустить его как чтение, вместе с ним бесплатно проходит побочный эффект; если запретить как запись, агент теряет возможность просто смотреть страницы. Чинится это не разрешением инструмента в allowlist, а его разделением на два: чисто читающий вызов и отдельный пишущий, который проходит проверку происхождения и свежее одобрение.'
  id: 038-final-quiz-3
  fingerprint: de3f5dbd
