- concept: постоянная память, в которую писал сам агент по недоверенным данным, при загрузке обратно в контекст является таким же недоверенным входом, как страница, и требует тех же проверок
  question: В новой сессии агент выполняет вредную инструкцию, хотя ни одна открытая в этой сессии страница вредного текста не содержит. Очистка сейчас применяется только к загруженным страницам. Что нужно изменить в конвейере?
  explanation: Память записана самим агентом, но её содержимое пришло из веба, поэтому доверенным оно не становится. Всё, что втекает в контекст извне текущего рассуждения, — недоверенный вход, и память здесь не исключение.
  kind: choice
  options:
    - Прогонять содержимое постоянной памяти через те же проверки в момент загрузки памяти в контекст
    - Увеличить окно контекста, чтобы агент видел больше исходных данных сессии
    - Запретить агенту открывать внешние ссылки в первые минуты сессии
    - 'Проверять память только при записи: прочитанное из своей же памяти доверенно по определению'
