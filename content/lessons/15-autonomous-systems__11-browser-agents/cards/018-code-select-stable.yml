- concept: корректность выбора по метке проверяется инвариантностью результата к перестановке списка
  question: Как убедиться, что внутри функции выбора по метке не осталось скрытой зависимости от позиции?
  explanation: Инвариантность к перестановке — прямое операциональное определение устойчивого выбора. Результат обязан меняться только при смене метки или исчезновении элемента.
  kind: choice
  options:
    - Перемешать список кандидатов и проверить, что результат не изменился
    - Проверить, что функция работает на списке из одного элемента
    - Проверить, что функция возвращает элемент за одинаковое время на любых списках
