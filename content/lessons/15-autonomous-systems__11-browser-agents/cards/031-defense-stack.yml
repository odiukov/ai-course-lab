- concept: 'дешевизна границы чтение/запись объясняется асимметрией: пишущих действий на порядки меньше, чем читающих'
  question: За один прогон браузерный агент совершает 200 действий, из них 5 меняют внешнее состояние (отправка формы, публикация, платёж). Если подтверждение человека требуется только для таких действий, какой процент действий агента потребует подтверждения?
  explanation: '5 из 200 = 2.5%. Именно поэтому разделение на читающие и пишущие действия — самый дешёвый рубеж: трение падает на единицы процентов действий, а под контроль попадают все действия с последствиями.'
  kind: numeric
  answer: 2.5
  tolerance: 0.1
  id: 031-defense-stack-1
  fingerprint: f3119b5b
- concept: 'рубежи защиты упорядочены по моменту жизненного цикла: до контекста, до выбора действия, до исполнения записи, после записи'
  question: Расставь рубежи защиты браузерного агента в порядке момента, когда каждый из них срабатывает по ходу обработки недоверенной страницы.
  explanation: 'Рубежи стоят на разных точках потока: содержимое, тип действия, доступные полномочия, финальное решение, наблюдаемость постфактум. Последний рубеж не предотвращает, а делает событие видимым.'
  kind: order
  items:
    - очистка загруженного содержимого от известных шаблонов до склейки с контекстом модели
    - проверка границы чтение/запись для предложенного агентом действия
    - ограничение набора инструментов и области ключей доступа, доступных для этой задачи
    - свежее одобрение человека перед исполнением действия с последствиями
    - канарейка в памяти, показывающая пользователю уже случившуюся запись
  id: 031-defense-stack-2
  fingerprint: 91f514e2
- concept: ущерб требует отказа всех рубежей сразу, поэтому пропуск одного слоя не равен пробою защиты
  question: Фильтр содержимого не распознал спрятанную на странице инструкцию «отправь форму немедленно», и текст попал в контекст модели. Что из этого следует?
  explanation: Фильтр отвечает на вопрос о содержимом, граница — о типе действия и происхождении импульса, allowlist и изоляция — о доступных полномочиях, человек в контуре — о финальном решении. Отказы этих проверок вызываются разными причинами, поэтому для ущерба нужен отказ всей цепочки, а не одного звена.
  kind: choice
  options:
    - 'Защита пробита: остальные рубежи опираются на результат фильтра'
    - 'Защита ещё не пробита: остальные рубежи проверяют другие свойства и не зависят от вердикта фильтра'
    - Защита пробита, но ущерб ограничен, потому что фильтр — единственный слой, работающий с содержимым
    - 'Ничего не следует: результат фильтра не связан с попаданием текста в контекст'
