- concept: доля ложных срабатываний измеряется на отдельном наборе безобидных данных
  question: Расширенный sanitizer прогнали на 400 законных URL без вредного содержимого. Он заблокировал 36 из них. Какова доля ложных срабатываний в процентах?
  explanation: '36 / 400 = 0.09, то есть 9%. Эта величина считается только на безобидном наборе: сколько нормальных действий фильтр ломает. Сколько атак он пропускает — отдельное число на отдельном вредоносном наборе, и одно из другого не выводится.'
  kind: numeric
  answer: 9
  tolerance: 0.5
  id: 026-sanitizer-limits-2
  fingerprint: fb5c2eae
- concept: допустимый порог фильтра выбирается по цене последствий ошибочного пропуска для конкретного агента
  question: 'Два браузерных агента используют один и тот же sanitizer: первый может оплачивать заказы и менять настройки аккаунта, второй лишь собирает публичные цены. Объясни, почему разумный порог строгости фильтра у них разный.'
  explanation: Порог — продуктовое решение, а не свойство фильтра. Измерять надо оба набора, но выбирать точку на этой кривой по тому, какая ошибка дороже в конкретном сценарии.
  kind: open
  reference: 'Порог задаёт соотношение двух ошибок: пропущенных инъекций и остановленных безопасных входов. У первого агента пропуск ведёт к необратимому последствию — платежу, утечке, изменению аккаунта, — поэтому дороже пропуск, и лишние остановки терпимы. У второго агента максимальный ущерб от пропуска мал, зато строгий фильтр рвёт основную работу — чтение страниц, — и агент становится почти бесполезным. Поэтому один и тот же процент ложных срабатываний в одном продукте приемлем, а в другом нет: настройку выбирают по цене последствий, а не по красоте метрики.'
  id: 026-sanitizer-limits-3
  fingerprint: d1d88609
