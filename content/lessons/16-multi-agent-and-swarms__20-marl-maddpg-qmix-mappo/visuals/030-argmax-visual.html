<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Как совместный максимум распадается на два локальных</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f5f7fb;
      --panel: #ffffff;
      --panel-soft: #eef2f8;
      --ink: #172033;
      --muted: #647087;
      --grid: #9aa6ba;
      --grid-soft: #d7deea;
      --central: #52637d;
      --central-soft: #e8edf5;
      --accent: #7856d8;
      --accent-soft: #eee9ff;
      --accent-ink: #4e329f;
      --success: #087a62;
      --success-soft: #dcf6ed;
      --arrow: #d05279;
      --shadow: #c9d2e1;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #10141d;
        --panel: #171d28;
        --panel-soft: #202837;
        --ink: #eef2f8;
        --muted: #a8b2c5;
        --grid: #68758c;
        --grid-soft: #343e50;
        --central: #a8b6cb;
        --central-soft: #252e3e;
        --accent: #ad94ff;
        --accent-soft: #322854;
        --accent-ink: #ded5ff;
        --success: #67d8b8;
        --success-soft: #173e37;
        --arrow: #ff82aa;
        --shadow: #0c1017;
      }
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .figure {
      box-sizing: border-box;
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--grid-soft);
    }

    h1 {
      box-sizing: border-box;
      margin: 0;
      padding: 12px 18px 8px;
      color: var(--ink);
      font-size: 22px;
      line-height: 1.2;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--panel);
    }

    text {
      fill: var(--ink);
      font-family: inherit;
      dominant-baseline: middle;
    }

    .section-title {
      font-size: 14px;
      font-weight: bold;
    }

    .label {
      font-size: 13px;
    }

    .small {
      font-size: 12px;
    }

    .muted {
      fill: var(--muted);
    }

    .grid-cell,
    .card {
      fill: var(--panel-soft);
      stroke: var(--grid);
      stroke-width: 1.4px;
    }

    .best-cell {
      fill: var(--accent-soft);
      stroke: var(--accent);
      stroke-width: 2.4px;
    }

    .value-pill {
      fill: var(--central-soft);
      stroke: var(--central);
      stroke-width: 1.4px;
    }

    .best-pill {
      fill: var(--accent-soft);
      stroke: var(--accent);
      stroke-width: 2.4px;
    }

    .max-badge,
    .joint-badge {
      fill: var(--success-soft);
      stroke: var(--success);
      stroke-width: 2.4px;
    }

    .footer-central {
      fill: var(--central-soft);
      stroke: var(--central);
      stroke-width: 1.4px;
    }

    .footer-local {
      fill: var(--accent-soft);
      stroke: var(--accent);
      stroke-width: 1.4px;
    }

    .divider,
    .connector {
      fill: none;
      stroke: var(--grid-soft);
      stroke-width: 1.4px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .choice-line {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2.4px;
      stroke-linecap: round;
    }

    .move-line {
      fill: none;
      stroke: var(--arrow);
      stroke-width: 2.4px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .accent-text {
      fill: var(--accent-ink);
      font-weight: bold;
    }

    .success-text {
      fill: var(--success);
      font-weight: bold;
    }

    .check {
      fill: var(--central);
      font-size: 12px;
      font-weight: bold;
    }

    .best-check {
      fill: var(--accent);
      font-size: 12px;
      font-weight: bold;
    }

    #fallback {
      box-sizing: border-box;
      margin: 0;
      padding: 18px;
      color: var(--ink);
      background: var(--panel-soft);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="figure">
    <h1 id="diagram-title">Как совместный максимум распадается на два локальных</h1>
    <svg
      id="diagram"
      viewBox="0 0 960 420"
      width="960"
      height="420"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-title diagram-desc"
    >
      <desc id="diagram-desc">
        Таблица из девяти совместных значений: центральный поиск проверяет
        каждую пару, а два агента независимо выбирают локальные максимумы 5 и 7.
      </desc>
    </svg>
    <p id="fallback" hidden>
      Схема должна была показать таблицу из 9 совместных пар: центральный
      поиск проверяет все клетки, а децентрализованный выбор находит локальные
      максимумы 5 и 7 и их пересечение.
    </p>
  </main>

  <script>
    const data = {
      table: {
        x: 18, y: 12, cellW: 10, cellH: 8,
        title: [33, 2.2],
        columnTitle: [33, 4.8],
        rowTitle: [11, 2.2],
        rowSubtitle: [11, 4.8],
        columnPillY: 9.3,
        columnPillW: 6,
        columnPillH: 4.2,
        rowPillX: 14.5,
        rowPillW: 6,
        rowPillH: 4.8,
        rowArrowX: 10.2,
        columnArrowY: 6.5,
        rows: [
          { action: "a", value: 2, best: false },
          { action: "b", value: 5, best: true },
          { action: "c", value: 2, best: false }
        ],
        columns: [
          { action: "x", value: 4, best: false },
          { action: "y", value: 7, best: true },
          { action: "z", value: 4, best: false }
        ]
      },
      central: {
        legend: [6, 39.4],
        footer: { x: 5, y: 43, w: 47, h: 5.5 }
      },
      local: {
        dividerX: 55,
        dividerTop: 1,
        dividerBottom: 49,
        title: [83.5, 2.2],
        subtitle: [83.5, 4.8],
        cardX: 59,
        cardW: 49,
        cardH: 9.5,
        firstCardY: 8.5,
        secondCardY: 20,
        agentLabelX: 62,
        firstCenterY: 13.25,
        secondCenterY: 24.75,
        actionX: [74, 82, 90],
        actionW: 6.2,
        actionH: 4.8,
        badgeX: 101,
        badgeW: 10,
        badgeH: 4.8,
        firstValues: [
          { value: 2, best: false },
          { value: 5, best: true },
          { value: 2, best: false }
        ],
        secondValues: [
          { value: 4, best: false },
          { value: 7, best: true },
          { value: 4, best: false }
        ],
        joint: { x: 64, y: 33.5, w: 44, h: 7 },
        firstRoute: [[106, 13.25], [110, 13.25], [110, 31], [103, 33.5]],
        secondRoute: [[101, 27.15], [101, 31], [96, 33.5]],
        footer: { x: 58, y: 43, w: 52, h: 5.5 }
      },
      units: {
        zero: 0,
        half: 0.5,
        one: 1,
        two: 2,
        tip: 0.8,
        wing: 0.48,
        round: 0.65,
        checkX: 1.3,
        checkY: 1.35,
        formulaY: 0.45,
        maxY: 2.35
      }
    };
    const origin = { x: 24, y: 4 };
    const scale = { x: 8, y: 8 };
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const svg = document.getElementById("diagram");
    const ns = "http://www.w3.org/2000/svg";
    const u = data.units;

    function node(tag, attrs, content) {
      const item = document.createElementNS(ns, tag);
      for (const [name, value] of Object.entries(attrs || {})) {
        item.setAttribute(name, value);
      }
      if (content !== undefined) item.textContent = content;
      return item;
    }

    function group(className) {
      const item = node("g", className ? { class: className } : {});
      svg.appendChild(item);
      return item;
    }

    function textAt(parent, x, y, content, className, anchor) {
      parent.appendChild(node("text", {
        x: sx(x),
        y: sy(y),
        class: className,
        "text-anchor": anchor || "middle"
      }, content));
    }

    function rectAt(parent, x, y, w, h, className) {
      parent.appendChild(node("rect", {
        x: sx(x),
        y: sy(y),
        width: sx(x + w) - sx(x),
        height: sy(y + h) - sy(y),
        rx: sx(u.round) - sx(u.zero),
        ry: sy(u.round) - sy(u.zero),
        class: className
      }));
    }

    function lineAt(parent, x1, y1, x2, y2, className) {
      parent.appendChild(node("line", {
        x1: sx(x1),
        y1: sy(y1),
        x2: sx(x2),
        y2: sy(y2),
        class: className
      }));
    }

    function polylineAt(parent, points, className) {
      parent.appendChild(node("polyline", {
        points: points.map(point => `${sx(point[0])},${sy(point[1])}`).join(" "),
        class: className
      }));
    }

    function arrowAt(parent, x1, y1, x2, y2, className) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const length = Math.hypot(dx, dy);
      const ux = dx / length;
      const uy = dy / length;
      const bx = x2 - ux * u.tip;
      const by = y2 - uy * u.tip;
      const nx = -uy * u.wing;
      const ny = ux * u.wing;

      lineAt(parent, x1, y1, bx, by, className);
      parent.appendChild(node("polygon", {
        points: [
          `${sx(x2)},${sy(y2)}`,
          `${sx(bx + nx)},${sy(by + ny)}`,
          `${sx(bx - nx)},${sy(by - ny)}`
        ].join(" "),
        class: className
      }));
    }

    try {
      const tableLayer = group();
      const movementLayer = group();
      const localLayer = group();
      const footerLayer = group();
      const table = data.table;
      const local = data.local;

      textAt(
        tableLayer,
        table.rowTitle[0],
        table.rowTitle[1],
        "Агент 1",
        "section-title"
      );
      textAt(
        tableLayer,
        table.rowSubtitle[0],
        table.rowSubtitle[1],
        "выбирает строку",
        "small muted"
      );
      textAt(
        tableLayer,
        table.title[0],
        table.title[1],
        "Центральный поиск: 9 пар",
        "section-title"
      );
      textAt(
        tableLayer,
        table.columnTitle[0],
        table.columnTitle[1],
        "Агент 2 выбирает столбец",
        "small muted"
      );

      for (const [columnIndex, column] of table.columns.entries()) {
        const centerX = table.x + (columnIndex + u.half) * table.cellW;
        rectAt(
          tableLayer,
          centerX - table.columnPillW * u.half,
          table.columnPillY - table.columnPillH * u.half,
          table.columnPillW,
          table.columnPillH,
          column.best ? "best-pill" : "value-pill"
        );
        textAt(
          tableLayer,
          centerX,
          table.columnPillY,
          String(column.value),
          column.best ? "label accent-text" : "label"
        );
      }

      for (const [rowIndex, row] of table.rows.entries()) {
        const centerY = table.y + (rowIndex + u.half) * table.cellH;
        rectAt(
          tableLayer,
          table.rowPillX - table.rowPillW * u.half,
          centerY - table.rowPillH * u.half,
          table.rowPillW,
          table.rowPillH,
          row.best ? "best-pill" : "value-pill"
        );
        textAt(
          tableLayer,
          table.rowPillX,
          centerY,
          String(row.value),
          row.best ? "label accent-text" : "label"
        );

        for (const [columnIndex, column] of table.columns.entries()) {
          const cellX = table.x + columnIndex * table.cellW;
          const cellY = table.y + rowIndex * table.cellH;
          const selected = row.best && column.best;
          rectAt(
            tableLayer,
            cellX,
            cellY,
            table.cellW,
            table.cellH,
            selected ? "best-cell" : "grid-cell"
          );
          textAt(
            tableLayer,
            cellX + table.cellW * u.half,
            cellY + table.cellH * u.half - u.formulaY,
            `f(${row.value}, ${column.value})`,
            selected ? "label accent-text" : "label"
          );
          textAt(
            tableLayer,
            cellX + table.cellW - u.checkX,
            cellY + u.checkY,
            "✓",
            selected ? "best-check" : "check"
          );
          if (selected) {
            textAt(
              tableLayer,
              cellX + table.cellW * u.half,
              cellY + table.cellH * u.half + u.maxY,
              "совместный макс.",
              "small accent-text"
            );
          }
        }
      }

      const firstRowCenter =
        table.y + (u.two + u.half) * table.cellH;
      const bestRowCenter =
        table.y + (u.one + u.half) * table.cellH;
      const firstColumnCenter =
        table.x + u.half * table.cellW;
      const bestColumnCenter =
        table.x + (u.one + u.half) * table.cellW;

      arrowAt(
        movementLayer,
        table.rowArrowX,
        firstRowCenter,
        table.rowArrowX,
        bestRowCenter,
        "move-line"
      );
      arrowAt(
        movementLayer,
        firstColumnCenter,
        table.columnArrowY,
        bestColumnCenter,
        table.columnArrowY,
        "move-line"
      );

      textAt(
        tableLayer,
        data.central.legend[0],
        data.central.legend[1],
        "✓ — проверенная пара   ·   2 → 5: лучшая строка   ·   4 → 7: лучший столбец",
        "small muted",
        "start"
      );

      lineAt(
        localLayer,
        local.dividerX,
        local.dividerTop,
        local.dividerX,
        local.dividerBottom,
        "divider"
      );
      textAt(
        localLayer,
        local.title[0],
        local.title[1],
        "Децентрализованный выбор",
        "section-title"
      );
      textAt(
        localLayer,
        local.subtitle[0],
        local.subtitle[1],
        "каждый видит только свои Q",
        "small muted"
      );

      function drawAgentCard(cardY, centerY, agentName, values) {
        rectAt(
          localLayer,
          local.cardX,
          cardY,
          local.cardW,
          local.cardH,
          "card"
        );
        textAt(
          localLayer,
          local.agentLabelX,
          centerY,
          agentName,
          "label",
          "start"
        );

        for (const [index, item] of values.entries()) {
          const centerX = local.actionX[index];
          rectAt(
            localLayer,
            centerX - local.actionW * u.half,
            centerY - local.actionH * u.half,
            local.actionW,
            local.actionH,
            item.best ? "best-pill" : "value-pill"
          );
          textAt(
            localLayer,
            centerX,
            centerY,
            String(item.value),
            item.best ? "label accent-text" : "label"
          );
        }

        const bestItem = values.find(item => item.best);
        rectAt(
          localLayer,
          local.badgeX - local.badgeW * u.half,
          centerY - local.badgeH * u.half,
          local.badgeW,
          local.badgeH,
          "max-badge"
        );
        textAt(
          localLayer,
          local.badgeX,
          centerY,
          `max ${bestItem.value}`,
          "small success-text"
        );
        arrowAt(
          localLayer,
          local.actionX[u.one] + local.actionW * u.half,
          centerY,
          local.badgeX - local.badgeW * u.half,
          centerY,
          "choice-line"
        );
      }

      drawAgentCard(
        local.firstCardY,
        local.firstCenterY,
        "Агент 1",
        local.firstValues
      );
      drawAgentCard(
        local.secondCardY,
        local.secondCenterY,
        "Агент 2",
        local.secondValues
      );

      polylineAt(localLayer, local.firstRoute, "connector");
      polylineAt(localLayer, local.secondRoute, "connector");

      rectAt(
        localLayer,
        local.joint.x,
        local.joint.y,
        local.joint.w,
        local.joint.h,
        "joint-badge"
      );
      textAt(
        localLayer,
        local.joint.x + local.joint.w * u.half,
        local.joint.y + local.joint.h * u.half,
        "совместный максимум: (5, 7)",
        "label success-text"
      );

      const centralFooter = data.central.footer;
      rectAt(
        footerLayer,
        centralFooter.x,
        centralFooter.y,
        centralFooter.w,
        centralFooter.h,
        "footer-central"
      );
      textAt(
        footerLayer,
        centralFooter.x + centralFooter.w * u.half,
        centralFooter.y + centralFooter.h * u.half,
        "Центрально: проверить все 9 пар",
        "label"
      );

      rectAt(
        footerLayer,
        local.footer.x,
        local.footer.y,
        local.footer.w,
        local.footer.h,
        "footer-local"
      );
      textAt(
        footerLayer,
        local.footer.x + local.footer.w * u.half,
        local.footer.y + local.footer.h * u.half,
        "Локально: выбрать 2 максимума",
        "label accent-text"
      );
    } catch (error) {
      svg.hidden = true;
      document.getElementById("fallback").hidden = false;
    }
  </script>
</body>
</html>
