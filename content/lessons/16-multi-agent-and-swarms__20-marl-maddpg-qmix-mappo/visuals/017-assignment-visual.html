<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Локальный и совместный выбор на одной решётке</title>
<style>
  :root {
    color-scheme: light dark;
    --page: whitesmoke;
    --panel: white;
    --cell: ghostwhite;
    --ink: midnightblue;
    --muted: slategray;
    --grid: lightsteelblue;
    --duplicate-a: darkorange;
    --duplicate-b: crimson;
    --chosen: seagreen;
    --free: steelblue;
    --pellet: gold;
    --pellet-edge: darkgoldenrod;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #111827;
      --panel: #182235;
      --cell: #131d2d;
      --ink: #eef4ff;
      --muted: #aebbd0;
      --grid: #52627a;
      --duplicate-a: #ffb454;
      --duplicate-b: #ff7188;
      --chosen: #62d69b;
      --free: #76baff;
      --pellet: #ffd75a;
      --pellet-edge: #fff0a0;
    }
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  figure {
    margin: 0;
    background: var(--page);
  }

  h2 {
    margin: 0;
    padding: 12px 18px 8px;
    font-size: 20px;
    line-height: 1.2;
    text-align: center;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 470px;
    background: var(--page);
  }

  #fallback {
    margin: 0;
    padding: 26px;
    min-height: 170px;
    color: var(--ink);
    background: var(--panel);
    border: 2px solid var(--grid);
    font-size: 16px;
    line-height: 1.5;
    text-align: center;
  }

  .panel {
    fill: var(--panel);
    stroke: var(--grid);
    stroke-width: 2;
  }

  .grid-bg {
    fill: var(--cell);
    stroke: var(--ink);
    stroke-width: 2;
  }

  .grid-line {
    stroke: var(--grid);
    stroke-width: 1.5;
  }

  .divider {
    stroke: var(--grid);
    stroke-width: 2;
  }

  .route-a,
  .route-b,
  .route-chosen {
    fill: none;
    stroke-width: 5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .route-a {
    stroke: var(--duplicate-a);
  }

  .route-b {
    stroke: var(--duplicate-b);
  }

  .route-chosen {
    stroke: var(--chosen);
  }

  .arrow-a {
    fill: var(--duplicate-a);
  }

  .arrow-b {
    fill: var(--duplicate-b);
  }

  .arrow-chosen {
    fill: var(--chosen);
  }

  .agent-one {
    fill: var(--duplicate-a);
    stroke: var(--panel);
    stroke-width: 3;
  }

  .agent-two {
    fill: var(--free);
    stroke: var(--panel);
    stroke-width: 3;
  }

  .free-ring {
    fill: none;
    stroke: var(--free);
    stroke-width: 3;
  }

  .pellet {
    fill: var(--pellet);
    stroke: var(--pellet-edge);
    stroke-width: 3;
  }

  .title {
    fill: var(--ink);
    font-size: 18px;
    font-weight: 750;
    letter-spacing: .02em;
  }

  .subtitle {
    fill: var(--muted);
    font-size: 14px;
    font-weight: 600;
  }

  .agent-label {
    fill: white;
    font-size: 16px;
    font-weight: 800;
    text-anchor: middle;
    dominant-baseline: middle;
  }

  .route-label {
    fill: var(--ink);
    font-size: 13px;
    font-weight: 650;
  }

  .caption {
    fill: var(--ink);
    font-size: 15px;
    font-weight: 650;
    text-anchor: middle;
  }

  .result-bad {
    fill: var(--duplicate-b);
    font-size: 17px;
    font-weight: 800;
    text-anchor: middle;
  }

  .result-good {
    fill: var(--chosen);
    font-size: 17px;
    font-weight: 800;
    text-anchor: middle;
  }

  .legend {
    fill: var(--muted);
    font-size: 14px;
    font-weight: 600;
    text-anchor: middle;
  }
</style>
</head>
<body>
<figure aria-labelledby="diagram-title">
  <h2 id="diagram-title">Локальный и совместный выбор на одной решётке</h2>
  <svg id="diagram" viewBox="0 0 960 470"
       width="960" height="470"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="svg-title svg-desc">
    <title id="svg-title">Сравнение независимого и централизованного выбора действий</title>
    <desc id="svg-desc">Две одинаковые решётки четыре на четыре с двумя агентами и одной гранулой. Слева оба агента независимо строят маршрут к одной цели. Справа совместная оценка назначает маршрут первому агенту, а второй остаётся свободен.</desc>
  </svg>
  <p id="fallback">Схема должна показать две одинаковые решётки 4 × 4: при локальном выборе оба агента дублируют маршрут к одной грануле, а при совместном выборе один агент назначен исполнителем и второй остаётся свободен.</p>
</figure>

<script>
const DATA = {
  zero: 0,
  one: 1,
  two: 2,
  half: 0.5,
  gridSize: 4,
  world: { right: 23.5, bottom: 11.25 },
  panels: [
    { x: 0.5, y: 0.35, w: 10.5, h: 10.45 },
    { x: 12.5, y: 0.35, w: 10.5, h: 10.45 }
  ],
  grids: [
    { x: 3, y: 2, w: 4, h: 4 },
    { x: 16, y: 2, w: 4, h: 4 }
  ],
  titleY: 0.95,
  subtitleY: 1.48,
  divider: { x1: 11.75, y1: 0.75, x2: 11.75, y2: 10.35 },
  agentRadius: 0.31,
  freeRadius: 0.47,
  pelletRadius: 0.28,
  arrowLength: 0.29,
  arrowWidth: 0.17,
  agents: [
    { col: 0, row: 3, label: "А₁", kind: "one" },
    { col: 3, row: 3, label: "А₂", kind: "two" }
  ],
  pellet: { col: 1, row: 0 },
  leftRoutes: [
    {
      kind: "a",
      points: [[3.5, 5.15], [3.5, 2.5], [4.15, 2.5]],
      label: "мой лучший маршрут",
      labelAt: [3.18, 5.62],
      anchor: "end"
    },
    {
      kind: "b",
      points: [[6.5, 5.15], [6.5, 2.5], [4.85, 2.5]],
      label: "мой лучший маршрут",
      labelAt: [6.82, 5.62],
      anchor: "start"
    }
  ],
  rightRoute: {
    kind: "chosen",
    points: [[16.5, 5.15], [16.5, 2.5], [17.15, 2.5]],
    label: "выбранный исполнитель",
    labelAt: [16.18, 5.62],
    anchor: "end"
  },
  freeLabel: {
    text: "свободен",
    at: [20.2, 5.5],
    anchor: "start"
  },
  captions: [
    {
      x: 5.75,
      lines: [
        { y: 7.05, text: "Каждый оценивает свою стрелку" },
        { y: 7.65, text: "Оба выбирают одну гранулу" }
      ],
      result: { y: 8.52, text: "Работа дублируется", kind: "bad" }
    },
    {
      x: 17.75,
      lines: [
        { y: 7.05, text: "Оценивается пара действий" },
        { y: 7.65, text: "А₁ идёт, А₂ доступен для другой цели" }
      ],
      result: { y: 8.52, text: "Исполнитель выбран совместно", kind: "good" }
    }
  ],
  legend: {
    y: 9.72,
    line: "Позиции одинаковы: два агента • одна гранула • решётка 4 × 4",
    noteY: 10.28,
    note: "Меняется способ оценить действия, а не тот, кто их выполняет"
  },
  hexAngles: [0, 1, 2, 3, 4, 5],
  circleTurn: 2
};

const origin = { x: 10, y: 10 };
const scale = 40;

const sx = x => origin.x + x * scale;
const sy = y => origin.y + y * scale;

try {
  const svg = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");
  const NS = "http://www.w3.org/2000/svg";

  const make = (name, attrs, parent) => {
    const node = document.createElementNS(NS, name);
    for (const [key, value] of Object.entries(attrs)) {
      node.setAttribute(key, String(value));
    }
    if (parent) parent.appendChild(node);
    return node;
  };

  const textAt = (parent, point, value, className, anchor) => {
    const node = make("text", {
      x: sx(point[DATA.zero]),
      y: sy(point[DATA.one]),
      class: className,
      "text-anchor": anchor,
      "dominant-baseline": "middle"
    }, parent);
    node.textContent = value;
    return node;
  };

  const rectAt = (parent, box, className) => make("rect", {
    x: sx(box.x),
    y: sy(box.y),
    width: sx(box.x + box.w) - sx(box.x),
    height: sy(box.y + box.h) - sy(box.y),
    class: className
  }, parent);

  const lineAt = (parent, a, b, className) => make("line", {
    x1: sx(a[DATA.zero]),
    y1: sy(a[DATA.one]),
    x2: sx(b[DATA.zero]),
    y2: sy(b[DATA.one]),
    class: className
  }, parent);

  const drawArrow = (parent, route) => {
    const polyline = route.points
      .map(point => `${sx(point[DATA.zero])},${sy(point[DATA.one])}`)
      .join(" ");

    make("polyline", {
      points: polyline,
      class: `route-${route.kind}`
    }, parent);

    const end = route.points.at(-DATA.one);
    const before = route.points.at(-DATA.two);
    const vx = end[DATA.zero] - before[DATA.zero];
    const vy = end[DATA.one] - before[DATA.one];
    const magnitude = Math.hypot(vx, vy);
    const ux = vx / magnitude;
    const uy = vy / magnitude;
    const bx = end[DATA.zero] - ux * DATA.arrowLength;
    const by = end[DATA.one] - uy * DATA.arrowLength;
    const px = -uy * DATA.arrowWidth;
    const py = ux * DATA.arrowWidth;
    const head = [
      end,
      [bx + px, by + py],
      [bx - px, by - py]
    ];

    make("polygon", {
      points: head
        .map(point => `${sx(point[DATA.zero])},${sy(point[DATA.one])}`)
        .join(" "),
      class: `arrow-${route.kind}`
    }, parent);

    textAt(parent, route.labelAt, route.label, "route-label", route.anchor);
  };

  const drawAgent = (parent, point, agent, showFreeRing) => {
    if (showFreeRing) {
      make("circle", {
        cx: sx(point[DATA.zero]),
        cy: sy(point[DATA.one]),
        r: sx(DATA.freeRadius) - sx(DATA.zero),
        class: "free-ring"
      }, parent);
    }

    make("circle", {
      cx: sx(point[DATA.zero]),
      cy: sy(point[DATA.one]),
      r: sx(DATA.agentRadius) - sx(DATA.zero),
      class: agent.kind === "one" ? "agent-one" : "agent-two"
    }, parent);

    textAt(parent, point, agent.label, "agent-label", "middle");
  };

  const drawPellet = (parent, point) => {
    const vertices = DATA.hexAngles.map(index => {
      const angle = Math.PI * index / DATA.circleTurn;
      return [
        point[DATA.zero] + Math.cos(angle) * DATA.pelletRadius,
        point[DATA.one] + Math.sin(angle) * DATA.pelletRadius
      ];
    });

    make("polygon", {
      points: vertices
        .map(vertex => `${sx(vertex[DATA.zero])},${sy(vertex[DATA.one])}`)
        .join(" "),
      class: "pellet"
    }, parent);
  };

  const drawGrid = (parent, grid, rightSide) => {
    rectAt(parent, grid, "grid-bg");

    for (let index = DATA.one; index < DATA.gridSize; index += DATA.one) {
      lineAt(
        parent,
        [grid.x + index, grid.y],
        [grid.x + index, grid.y + grid.h],
        "grid-line"
      );
      lineAt(
        parent,
        [grid.x, grid.y + index],
        [grid.x + grid.w, grid.y + index],
        "grid-line"
      );
    }

    const pelletPoint = [
      grid.x + DATA.pellet.col + DATA.half,
      grid.y + DATA.pellet.row + DATA.half
    ];
    drawPellet(parent, pelletPoint);

    for (const agent of DATA.agents) {
      const point = [
        grid.x + agent.col + DATA.half,
        grid.y + agent.row + DATA.half
      ];
      drawAgent(parent, point, agent, rightSide && agent.kind === "two");
    }
  };

  const root = make("g", {}, null);

  make("rect", {
    x: sx(DATA.zero),
    y: sy(DATA.zero),
    width: sx(DATA.world.right) - sx(DATA.zero),
    height: sy(DATA.world.bottom) - sy(DATA.zero),
    fill: "var(--page)"
  }, root);

  for (const panel of DATA.panels) rectAt(root, panel, "panel");

  lineAt(
    root,
    [DATA.divider.x1, DATA.divider.y1],
    [DATA.divider.x2, DATA.divider.y2],
    "divider"
  );

  textAt(root, [5.75, DATA.titleY], "ЛОКАЛЬНЫЙ ВЫБОР", "title", "middle");
  textAt(root, [5.75, DATA.subtitleY], "две независимые оценки", "subtitle", "middle");
  textAt(root, [17.75, DATA.titleY], "СОВМЕСТНЫЙ ВЫБОР", "title", "middle");
  textAt(root, [17.75, DATA.subtitleY], "оценка пары действий", "subtitle", "middle");

  drawGrid(root, DATA.grids[DATA.zero], false);
  drawGrid(root, DATA.grids[DATA.one], true);

  for (const route of DATA.leftRoutes) drawArrow(root, route);
  drawArrow(root, DATA.rightRoute);
  textAt(
    root,
    DATA.freeLabel.at,
    DATA.freeLabel.text,
    "route-label",
    DATA.freeLabel.anchor
  );

  for (const block of DATA.captions) {
    for (const line of block.lines) {
      textAt(root, [block.x, line.y], line.text, "caption", "middle");
    }
    textAt(
      root,
      [block.x, block.result.y],
      block.result.text,
      block.result.kind === "bad" ? "result-bad" : "result-good",
      "middle"
    );
  }

  textAt(root, [11.75, DATA.legend.y], DATA.legend.line, "legend", "middle");
  textAt(root, [11.75, DATA.legend.noteY], DATA.legend.note, "legend", "middle");

  svg.appendChild(root);
  fallback.hidden = true;
} catch (error) {
  const svg = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");
  if (svg) svg.hidden = true;
  if (fallback) fallback.hidden = false;
}
</script>
</body>
</html>
