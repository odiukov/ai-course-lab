- concept: сопряжённость является свойством пары правдоподобия и априорного распределения
  question: Почему распределение нельзя назвать сопряжённым, не указав модель правдоподобия? Объясните своими словами.
  explanation: Сопряжённость описывает не отдельное распределение, а его отношение к выбранному правдоподобию. Например, Gamma сопряжено с правдоподобием Пуассона, а Beta — с правдоподобием Бернулли.
  kind: open
  reference: Сопряжённость определяется результатом совместного использования априорного распределения с конкретным правдоподобием. Одно и то же семейство может давать апостериорное того же семейства для одной модели данных, но не давать его для другой.
  id: 039-conjugate-2
  fingerprint: 5f820009
- concept: сопряжённость позволяет получить апостериорное распределение в замкнутой форме
  question: Какое вычислительное преимущество обычно даёт сопряжённое априорное распределение?
  explanation: При сопряжённости форма распределения сохраняется, поэтому байесовское обновление сводится к пересчёту его параметров. Для несопряжённых моделей апостериорное часто приходится приближать методами Монте-Карло или вариационного вывода.
  kind: choice
  options:
    - Апостериорное можно получить обновлением параметров без численного интегрирования и сэмплирования
    - Оно делает любые наблюдения условно независимыми
    - Оно гарантирует, что выбранная модель истинна
    - Оно устраняет необходимость задавать априорные предположения
