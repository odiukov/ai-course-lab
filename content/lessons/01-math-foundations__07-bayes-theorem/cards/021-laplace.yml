- concept: знаменатель после сглаживания Лапласа увеличивается на размер словаря, чтобы сохранить нормировку вероятностей
  question: В мультиномиальном наивном Байесе к счётчику каждого слова добавили единичный псевдосчётчик. До сглаживания в классе было N словоупотреблений, а словарь содержит V слов. Каким должен стать знаменатель условных вероятностей?
  explanation: Псевдосчётчик получает каждое из V слов, поэтому суммарное число условных наблюдений увеличивается на V. Знаменатель N + V сохраняет сумму вероятностей всех слов равной единице.
  kind: choice
  options:
    - 'N'
    - N плюс единичный псевдосчётчик
    - N + V
    - N · V
  correct: 2
  id: 021-laplace-1
  fingerprint: 860ee3e7
- concept: фиксированный псевдосчётчик сильнее влияет на оценки, основанные на малом количестве наблюдений
  question: Почему сглаживание Лапласа заметно меняет оценку редкого слова, но почти не меняет оценку часто встречающегося слова?
  explanation: Добавка одинакова для всех слов, но её относительный вес различается. Для малого счётчика это существенная доля данных, а на фоне сотен наблюдений такая поправка почти незаметна.
  kind: open
  reference: Одинаковый единичный псевдосчётчик велик относительно малого исходного счётчика, но пренебрежимо мал относительно большого. Поэтому оценки редких слов корректируются сильнее, а оценки частых слов остаются близкими к их наблюдаемым частотам.
  id: 021-laplace-2
  fingerprint: a7dd9d8f
