- concept: при наблюдении только успехов правдоподобие Бернулли максимизируется на границе пространства параметров
  question: В серии бросков монеты наблюдались только орлы. Какую вероятность орла выберет MLE?
  explanation: Если все наблюдения — орлы, правдоподобие имеет вид p в степени числа бросков и возрастает с p. Поэтому MLE достигается при максимально допустимом p; априорные представления о честных монетах здесь не учитываются.
  kind: choice
  options:
    - Максимально допустимую, потому что правдоподобие растёт вместе с вероятностью орла
    - Вероятность честной монеты, потому что крайние оценки запрещены
    - Минимально допустимую, потому что выборка не содержит решек
    - Значение, заданное априорным распределением
  correct: 0
  id: 033-check-map-1
  fingerprint: ee954247
- concept: MAP-оценка на одних и тех же данных зависит от выбранного априорного распределения
  question: Дадут ли два исследователя одинаковую MAP-оценку вероятности орла, если они видели одни и те же броски, но выбрали разные prior? Объясни своими словами.
  explanation: MAP не задаёт универсальную поправку к MLE. Оценка определяется произведением правдоподобия и конкретного prior, поэтому его центр и сила могут изменить результат.
  kind: open
  reference: Не обязательно. У них совпадает правдоподобие данных, но различаются априорные распределения, поэтому максимумы произведения правдоподобия и prior могут находиться в разных точках. При скудных данных различие обычно заметнее.
  id: 033-check-map-2
  fingerprint: 694420ac
