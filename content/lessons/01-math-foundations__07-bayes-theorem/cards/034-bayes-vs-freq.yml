- concept: доверительный и байесовский интервалы описывают разные объекты неопределённости
  question: Объясни своими словами, чем различается смысл частотного доверительного интервала и байесовского интервала для параметра.
  explanation: В частотной трактовке параметр фиксирован, поэтому вероятность относится к поведению процедуры на повторных выборках. В байесовской трактовке апостериорное распределение позволяет говорить о степени уверенности в различных значениях параметра.
  kind: open
  reference: 'Частотный доверительный интервал характеризует процедуру построения интервалов при многократном повторении эксперимента: заданная доля таких интервалов накрывает фиксированный параметр. Байесовский интервал описывает вероятность нахождения параметра в указанной области согласно апостериорному распределению.'
