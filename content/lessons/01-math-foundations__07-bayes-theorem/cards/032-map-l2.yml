- concept: гауссовское априорное распределение на весах соответствует квадратичной регуляризации
  question: Какое априорное распределение на веса модели при MAP-оценивании приводит к ridge-штрафу, пропорциональному сумме квадратов весов?
  explanation: Логарифм плотности независимого гауссовского априорного распределения с центром в нуле содержит отрицательную сумму квадратов весов. Поэтому максимизация MAP-оценки эквивалентна минимизации ошибки с квадратичным, или ridge-, штрафом.
  kind: choice
  options:
    - Независимое гауссовское распределение с центром в нуле
    - Равномерное распределение на всей числовой прямой
    - Категориальное распределение
    - Распределение Пуассона
  correct: 0
  id: 032-map-l2-1
  fingerprint: b544b42e
- concept: квадратичный штраф суммирует квадраты всех весов и масштабируется коэффициентом регуляризации
  question: 'У модели два веса: 3 и −4. Коэффициент квадратичной регуляризации равен 0.5. Чему равен добавляемый к минимизируемой функции потерь штраф?'
  explanation: Сумма квадратов весов равна 3 × 3 + (−4) × (−4) = 25. После умножения на коэффициент 0.5 получается штраф 12.5.
  kind: numeric
  answer: 12.5
  tolerance: 0.001
  id: 032-map-l2-2
  fingerprint: d74e2b05
- concept: ширина гауссовского априорного распределения определяет силу стягивания весов к нулю
  question: Объясните своими словами, почему более узкое гауссовское априорное распределение весов вокруг нуля соответствует более сильной регуляризации.
  explanation: Чем меньше разброс априорного распределения, тем быстрее падает его плотность при удалении веса от нуля. В логарифмической MAP-цели это проявляется как больший коэффициент перед суммой квадратов весов.
  kind: open
  reference: Узкое распределение приписывает большим по модулю весам особенно низкую априорную вероятность. Поэтому такие веса сильнее уменьшают MAP-оценку, и данные должны дать более убедительное основание, чтобы модель отклонила их от нуля.
  id: 032-map-l2-3
  fingerprint: 285ce232
