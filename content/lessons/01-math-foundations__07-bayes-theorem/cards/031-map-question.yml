- concept: в MAP априорное распределение задаётся на значениях параметров модели
  question: Что описывает множитель P(θ) при MAP-оценивании параметров модели?
  explanation: P(θ) — априорное распределение параметров. Оно позволяет до учёта данных выразить, какие значения весов, коэффициентов или вероятностей считаются более правдоподобными.
  kind: choice
  options:
    - Вероятность наблюдаемых данных при фиксированном θ
    - Представление о правдоподобных значениях θ до наблюдения данных
    - Вероятность ошибки модели на новых данных
    - Нормировочную константу апостериорного распределения
  correct: 1
  id: 031-map-question-1
  fingerprint: 1e599368
- concept: с ростом объёма данных влияние фиксированного априорного распределения обычно уменьшается
  question: Почему при большом объёме данных MAP-оценка часто становится близка к MLE-оценке?
  explanation: MAP учитывает и данные, и априорное распределение. По мере накопления наблюдений вклад правдоподобия обычно растёт относительно вклада априорного распределения, поэтому результат всё меньше отличается от MLE.
  kind: open
  reference: Правдоподобие накапливает информацию из множества наблюдений и начинает доминировать над фиксированным априорным распределением, поэтому максимум апостериорного распределения приближается к максимуму правдоподобия.
  id: 031-map-question-2
  fingerprint: 30aaa18f
