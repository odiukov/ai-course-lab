- concept: маргинальное правдоподобие усредняет правдоподобие данных по априорному распределению параметров модели
  question: Заполни формулу маргинального правдоподобия данных D для модели M с параметрами θ.
  explanation: Маргинальное правдоподобие учитывает не одно лучшее значение параметров, а все их возможные значения, взвешенные априорным распределением.
  kind: cloze
  template: P(D | M) = ___
  answer: ∫ P(D | θ, M) P(θ | M) dθ
  accept:
    - ∫ P(D|θ,M)P(θ|M)dθ
    - интеграл P(D | θ, M) P(θ | M) dθ
  id: 038-online-model-1
  fingerprint: 999bc6c5
- concept: байесовский фактор равен отношению маргинальных правдоподобий сравниваемых моделей
  question: Маргинальное правдоподобие данных для модели A равно 0.18, а для модели B — 0.06. Чему равен байесовский фактор BF_AB?
  explanation: BF_AB = P(D | A) / P(D | B) = 0.18 / 0.06 = 3. Эти данные в три раза вероятнее при модели A, чем при модели B.
  kind: numeric
  answer: 3
  tolerance: 0.001
  id: 038-online-model-2
  fingerprint: fee5357f
- concept: маргинальное правдоподобие создаёт встроенный штраф за избыточную гибкость модели
  question: Почему более гибкая модель может получить меньшее маргинальное правдоподобие, даже если некоторые значения её параметров очень хорошо описывают данные?
  explanation: Evidence оценивает не только лучший вариант настройки модели. Оно учитывает весь объём допустимых параметров, поэтому модель, способная объяснить почти что угодно лишь после точной подгонки, автоматически получает штраф.
  kind: open
  reference: Маргинальное правдоподобие усредняет качество описания данных по всему априорному распределению параметров. Если хорошо подходят лишь немногие настройки гибкой модели, а остальные дают данным низкую вероятность, итоговое среднее будет небольшим. Поэтому гибкость должна компенсироваться хорошим соответствием на достаточно большой области параметров.
  id: 038-online-model-3
  fingerprint: a23133ca
