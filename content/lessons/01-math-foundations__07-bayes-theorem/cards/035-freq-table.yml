- concept: полный байесовский вывод обменивает дополнительные вычисления на распределение неопределённости
  question: Почему в крупной продакшн-системе, где достаточно точечной оценки параметров, часто выбирают частотное обучение вместо полного байесовского вывода?
  explanation: Большинство продакшн-ML использует SGD и точечные оценки из-за их вычислительной эффективности. Байесовские методы оправдывают более высокую стоимость, когда действительно нужна неопределённость параметров.
  kind: open
  reference: Частотное обучение обычно быстрее и непосредственно даёт точечную оценку. Полный байесовский вывод строит распределение параметров и потому часто требует дорогого сэмплирования, например MCMC; если это распределение не нужно, дополнительные вычисления могут не окупиться.
  id: 035-freq-table-2
