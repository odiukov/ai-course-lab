- concept: топ слов класса представляет максимальные условные вероятности слов при заданном классе
  question: Что именно показывает список top words, построенный отдельно для заданного класса текстового классификатора?
  explanation: Функция вычисляет сглаженную P(w|C) для каждого слова при фиксированном классе, сортирует эти значения по убыванию и выводит начало списка. Она не вычисляет ни P(C|w), ни отношение вероятностей между классами.
  kind: choice
  options:
    - Слова с максимальной апостериорной вероятностью класса при наличии слова
    - Самые частые слова во всём обучающем корпусе
    - Слова с наибольшей сглаженной вероятностью P(w|C) внутри заданного класса
    - Слова с наибольшим отношением правдоподобий между классами
  correct: 2
  id: 029-top-words-1
  fingerprint: 7ef9e270
- concept: при фиксированном классе сглаживание Лапласа сохраняет порядок слов по частоте
  question: Почему внутри одного класса сортировка слов по сглаженной P(w|C) даёт тот же порядок, что и сортировка по их счётчикам?
  explanation: При фиксированном классе total, размер словаря и параметр smoothing одинаковы для каждого слова. Поэтому большему count всегда соответствует большая сглаженная вероятность; сглаживание может изменить значения, но не их порядок.
  kind: open
  reference: Для всех слов одного класса к счётчику прибавляется один и тот же псевдосчётчик, а результат делится на один и тот же положительный знаменатель. Такое преобразование монотонно и поэтому сохраняет порядок счётчиков.
  id: 029-top-words-2
  fingerprint: d89d3e6f
