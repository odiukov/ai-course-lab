- concept: оценка P(B > A) как доля пар сэмплов, где значение B больше значения A
  question: 'Из апостериорного распределения варианта A вытянули 4000 случайных значений, из апостериорного варианта B — столько же. Значения сравнили попарно: в 3040 парах значение B оказалось больше. Чему равна оценка P(B > A)?'
  explanation: 'Монте-Карло оценка = число выигранных пар / общее число пар: 3040 / 4000 = 0.76. Никакого интеграла считать не нужно — доля побед и есть искомая вероятность. Чем больше пар, тем меньше дрожат последние знаки оценки.'
  kind: numeric
  answer: 0.76
  tolerance: 0.01
  id: 053-monte-carlo-1
  fingerprint: ace98260
- concept: порядок шагов метода Монте-Карло для сравнения двух апостериорных распределений
  question: Расставь шаги оценки вероятности того, что истинная конверсия одного варианта выше истинной конверсии другого, методом Монте-Карло.
  explanation: 'Сэмплы тянутся независимо из каждого апостериорного, потом сравниваются попарно, и доля побед даёт вероятность. Сравнивать нужно именно пары сэмплов, а не средние распределений: средние прячут перекрытие разбросов.'
  kind: order
  items:
    - Вытянуть N случайных значений из апостериорного распределения первого варианта
    - Вытянуть N случайных значений из апостериорного распределения второго варианта
    - 'Сравнить значения попарно: больше ли i-е значение второго варианта, чем i-е значение первого'
    - Поделить число пар, где второй вариант выиграл, на N
  id: 053-monte-carlo-2
  fingerprint: d24ad6a9
- concept: что означает конкретное значение P(B > A) и чем оно отличается от разницы конверсий
  question: Монте-Карло дал P(B > A) = 0.83. Что это значит?
  explanation: 'P(B > A) — вероятность того, что B действительно лучше, а не размер преимущества. Значение 0.83 означает: остаётся примерно 17% сценариев, где на самом деле лучше A. Размер выигрыша — отдельная величина, её считают по распределению разности b − a.'
  kind: choice
  options:
    - Конверсия B выше конверсии A на 83%
    - С учётом всей неопределённости в 83% разыгранных сценариев истинная конверсия B оказывается выше истинной конверсии A
    - 83% пользователей в тесте выбрали вариант B
    - Апостериорные распределения A и B перекрываются на 83%
  correct: 1
  id: 053-monte-carlo-3
  fingerprint: f95f7a7d
