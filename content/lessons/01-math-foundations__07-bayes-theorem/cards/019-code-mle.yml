- concept: для бинарного текстового признака повторения слова внутри документа не увеличивают оценку вероятности
  question: Функция оценивает вероятность присутствия слова в документе заданного класса. `tokenize` возвращает нормализованные токены. Какая реализация корректно обрабатывает повторения слова внутри документа?
  explanation: 'Проверка принадлежности множеству превращает каждый документ в бинарное наблюдение: слово либо присутствует, либо отсутствует. `count` считает все вхождения, а последний вариант смешивает документы разных классов.'
  kind: choice
  options:
    - sum(word in set(tokenize(text)) for text, label in data if label == target) / sum(label == target for _, label in data)
    - sum(tokenize(text).count(word) for text, label in data if label == target) / sum(label == target for _, label in data)
    - sum(word in set(tokenize(text)) for text, _ in data) / len(data)
  correct: 0
  id: 019-code-mle-1
  fingerprint: 0f2be3b5
- concept: одинаковая нормализация запроса и обучающих текстов объединяет варианты написания слова в один признак
  question: Почему при вычислении условной вероятности слова нормализацию регистра нужно одинаково применять и к искомому слову, и к токенам обучающих документов?
  explanation: Сравнение должно происходить в едином представлении. Если нормализовать только одну сторону, совпадения потеряются; если не нормализовать обе, статистика одного слова разделится между вариантами его написания.
  kind: open
  reference: Иначе разные варианты регистра будут считаться разными признаками или искомое слово не совпадёт с уже нормализованными токенами. Единая нормализация позволяет собирать их наблюдения в один счётчик.
  id: 019-code-mle-2
  fingerprint: 02c0f019
