- concept: события A и ¬A образуют взаимоисключающее и исчерпывающее разбиение
  question: Почему для разложения полной вероятности события B достаточно рассмотреть ветви A и ¬A?
  explanation: A и ¬A не могут произойти одновременно, но одно из них обязательно истинно. Поэтому все случаи появления B распределяются между этими двумя ветвями.
  kind: choice
  options:
    - Обе ветви имеют одинаковую вероятность
    - Событие B обязательно происходит ровно в одной из ветвей
    - Ветви не пересекаются и вместе охватывают все возможные случаи
    - Условные вероятности B в обеих ветвях совпадают
  correct: 2
  id: 005-evidence-1
  fingerprint: 5144f3a5
- concept: свидетельство становится убедительнее при уменьшении его вероятности в альтернативной ветви
  question: Объясните своими словами, почему уменьшение P(B|¬A) при неизменных P(A) и P(B|A) делает наблюдение B более сильным доводом в пользу A.
  explanation: Сила свидетельства зависит не только от того, насколько оно ожидаемо при A, но и от того, насколько легко оно возникает без A. Чем меньше P(B|¬A), тем хуже альтернативная гипотеза объясняет B.
  kind: open
  reference: Уменьшается вклад альтернативной ветви P(B|¬A)·P(¬A) в полную вероятность B. Поэтому среди всех случаев появления B бо́льшая доля приходится на ветвь A, и P(A|B) возрастает.
  id: 005-evidence-2
  fingerprint: 1d1c4709
