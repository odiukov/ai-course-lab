- concept: для выбора класса достаточно сравнивать ненормированные байесовские оценки
  question: Заполни формулу оценки класса в наивном Байесе, если требуется только выбрать наиболее вероятный класс.
  explanation: 'Знаменатель с вероятностью наблюдаемого набора признаков одинаков для всех сравниваемых классов. Поэтому он не влияет на их ранжирование: выбирают класс с максимальным произведением априорной вероятности и условных вероятностей признаков.'
  kind: cloze
  template: score(C) = ___
  answer: P(C) * ∏_j P(x_j | C)
  accept:
    - P(C)∏_j P(x_j|C)
    - P(C) * product_j P(x_j | C)
    - P(C) умножить на произведение P(x_j | C)
