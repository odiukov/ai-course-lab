- concept: зависимые признаки могут завышать уверенность наивного байесовского классификатора
  question: Почему наивный Байес может правильно выбрать класс, но при этом выдать плохо откалиброванную вероятность, если признаки связаны между собой?
  explanation: Нарушение предположения о независимости особенно искажает величину полученной уверенности. Для классификации часто достаточно правильного ранжирования классов, поэтому решение может быть верным даже при неточной вероятности.
  kind: open
  reference: Модель перемножает условные вероятности так, словно каждый признак даёт независимое свидетельство. Коррелированные признаки частично повторяют одну и ту же информацию, поэтому их влияние учитывается несколько раз и уверенность завышается. Однако порядок оценок классов всё ещё может остаться правильным.
  id: 015-naive-3
