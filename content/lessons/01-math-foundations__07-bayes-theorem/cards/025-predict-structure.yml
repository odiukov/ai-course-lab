- concept: логарифмическая оценка класса состоит из одного log prior и суммы log likelihood всех слов
  question: Заполни пропуск в формуле логарифмической оценки класса наивного Байеса.
  explanation: Априорная вероятность относится ко всему классу, поэтому log P(C) добавляется один раз. Затем для каждого слова документа добавляется log P(w | C).
  kind: cloze
  template: log score(C) = ___ + Σ_{w ∈ document} log P(w | C)
  answer: log P(C)
  accept:
    - ln P(C)
    - логарифм P(C)
  id: 025-predict-structure-1
  fingerprint: fe5a65c4
- concept: слово с одинаковым правдоподобием во всех классах не влияет на выбор класса
  question: Слово имеет одинаковую условную вероятность во всех сравниваемых классах. Как его появление в документе повлияет на выбор класса по логарифмической оценке?
  explanation: Для этого слова к каждой оценке прибавляется одно и то же значение log P(w | C). Разности между оценками не меняются, поэтому такое слово не даёт преимущества ни одному классу.
  kind: choice
  options:
    - Обязательно усилит класс с большей априорной вероятностью
    - Добавит одинаковое слагаемое оценкам классов и само по себе не изменит их порядок
    - Обнулит оценки всех классов
    - Заставит классификатор игнорировать априорные вероятности
  correct: 1
  id: 025-predict-structure-2
  fingerprint: 9aa1e05f
