- concept: при одинаковом среднем большая сумма a+b означает более концентрированное распределение
  question: Почему Beta(140, 140) выражает более уверенное мнение о вероятности успеха, чем Beta(14, 14), хотя их средние совпадают?
  explanation: Обе пары симметричны и имеют один центр. Однако сумма параметров равна 280 против 28, поэтому Beta(140, 140) заметно уже и представляет большую уверенность.
  kind: open
  reference: У распределений одинаковое отношение a к a+b, поэтому совпадают средние. Но у Beta(140, 140) сумма параметров значительно больше, а значит, распределение сильнее сконцентрировано около среднего и слабее меняется под влиянием небольшого объёма новых данных.
