- concept: среднее Beta(a, b) равно доле a в сумме параметров
  question: Чему равно среднее распределения Beta(18, 6)?
  explanation: Среднее Beta(a, b) вычисляется как a/(a+b). Поэтому для Beta(18, 6) получаем 18/24 = 0,75.
