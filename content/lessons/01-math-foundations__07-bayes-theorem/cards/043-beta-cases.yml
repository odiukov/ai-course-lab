- concept: равномерное бета-априорное распределение не отдаёт предпочтения ни одной области возможных значений параметра
  question: Какое априорное мнение о неизвестной вероятности выражает равномерное бета-распределение? Объясни своими словами.
  explanation: У равномерного распределения плотность постоянна на всём допустимом интервале. Поэтому Beta(1, 1) используют как априорное мнение, которое не выделяет ни малые, ни средние, ни большие вероятности.
  kind: open
  reference: 'Оно выражает отсутствие предпочтения: до наблюдения данных любые возможные значения вероятности считаются одинаково правдоподобными.'
  id: 043-beta-cases-2
  fingerprint: 19dfabfb
