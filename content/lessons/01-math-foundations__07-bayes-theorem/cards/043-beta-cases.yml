- concept: концентрация Beta-распределения определяется суммой его параметров
  question: Сравнивают априорные распределения Beta(6, 6) и Beta(42, 42). Какое из них выражает более сильную уверенность, что вероятностный параметр находится около центра диапазона?
  explanation: Средние у распределений совпадают, но суммы параметров равны 12 и 84. Чем больше a+b, тем сильнее Beta-распределение сосредоточено около своего среднего.
