- concept: все классы наивного Байеса должны использовать единый словарь признаков
  question: Как следует определить словарь V при вычислении сглаженных вероятностей слов для разных классов текстового классификатора?
  explanation: Условные распределения классов должны быть определены на одном пространстве признаков. Общий словарь позволяет корректно нормировать вероятности и сравнивать оценки разных классов.
  kind: choice
  options:
    - Оставить только слова, встретившиеся во всех классах
    - Создать для каждого класса отдельный словарь
    - Взять объединение слов из всех классов обучающей выборки
    - Использовать только слова классифицируемого документа
  correct: 2
  id: 022-code-laplace-1
  fingerprint: 7aefaa16
- concept: аддитивное сглаживание пустого класса создаёт равномерное распределение по словарю
  question: Объясните, почему при положительной добавке alpha сглаженные вероятности слов в классе без обучающих наблюдений одинаковы для всего словаря.
  explanation: Пустой класс не содержит данных, позволяющих предпочесть одно слово другому. Симметричные псевдосчётчики поэтому задают равномерное распределение и одновременно предотвращают деление на ноль.
  kind: open
  reference: В пустом классе счётчик каждого слова и общее число наблюдений равны нулю. После сглаживания числитель для любого слова равен alpha, а знаменатель — alpha, умноженной на размер словаря. Добавка сокращается, поэтому каждое слово получает обратную величину размера словаря.
  id: 022-code-laplace-2
  fingerprint: 4b33f8ce
