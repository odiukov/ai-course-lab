  fingerprint: c4bcae11
- concept: отрицательный результат задаётся вероятностями этого исхода при истинной и ложной гипотезе
  question: Для диагностического теста известны `false_negative_rate = P(negative | sick)` и `specificity = P(negative | healthy)`. Заполните пару правдоподобий отрицательного результата для `sequential_posterior`.
  explanation: Функции нужна вероятность наблюдаемого свидетельства в обеих ветвях гипотезы. Для отрицательного результата это доля ложноотрицательных среди больных и специфичность среди здоровых.
  kind: cloze
  template: negative_evidence = ___
  answer: (false_negative_rate, specificity)
  accept:
    - false_negative_rate, specificity
    - '[false_negative_rate, specificity]'
  id: 014-code-seq-2
  fingerprint: 05a7bc2f
- concept: порядок условно независимых свидетельств с фиксированными правдоподобиями не влияет на точный итог последовательного обновления
  question: Объясните, почему перестановка свидетельств не должна менять финальную вероятность при последовательном байесовском обновлении и при каком предположении это верно.
  explanation: Инвариантность к порядку служит полезной проверкой реализации. Она нарушается не только при ошибке в аккумуляторе, но и когда свидетельства зависимы или их правдоподобия меняются с учётом истории.
  kind: open
  reference: Если свидетельства условно независимы при каждой гипотезе и их правдоподобия не зависят от предыдущих наблюдений, совместное правдоподобие получается умножением одних и тех же множителей. Умножение коммутативно, поэтому порядок обновлений не меняет точный итог; небольшие расхождения возможны только из-за округления.
  id: 014-code-seq-3
  fingerprint: 1eaf1385
