- concept: байесовское правило решения использует два порога и допускает продолжение эксперимента
  question: 'Для A/B-теста принято правило: выбрать B, если P(B > A) больше 0,975; выбрать A, если вероятность меньше 0,025; иначе продолжить сбор данных. Получено P(B > A) = 0,83. Какое решение соответствует правилу?'
  explanation: Значение 0,83 находится между нижним и верхним порогами. Данных уже достаточно для предпочтения B, но ещё недостаточно для решения по заданному правилу, поэтому эксперимент продолжают.
  kind: choice
  options:
    - Выбрать B
    - Выбрать A
    - Продолжить сбор данных
    - Объявить варианты полностью одинаковыми
  correct: 2
  id: 054-ab-decision-1
  fingerprint: c5cad958
- concept: просмотр промежуточного байесовского результата сам по себе не изменяет апостериорное распределение
  question: Почему в корректно заданном байесовском A/B-тесте можно многократно смотреть на промежуточную вероятность преимущества варианта, не искажая её одним лишь фактом просмотра?
  explanation: Байесовское обновление условно на фактически полученных данных. Само чтение результата не является новым свидетельством, поэтому не меняет апостериорное распределение. Безопасность не распространяется на незамеченные изменения механизма сбора данных.
  kind: open
  reference: Апостериорное распределение определяется априорным распределением, моделью и уже накопленными наблюдениями. Расписание просмотров не добавляет кликов или показов и потому не меняет результат. Это верно при разумном априорном распределении и модели, корректно описывающей сбор данных; если просмотр приводит к изменению эксперимента, такие изменения нужно учитывать в модели.
  id: 054-ab-decision-2
  fingerprint: f95ca7a0
- concept: байесовская вероятность преимущества и частотное p-значение отвечают на разные вопросы
  question: Какое утверждение правильно различает P(B > A) в байесовском A/B-тесте и p-значение частотного теста?
  explanation: Байесовская величина напрямую относится к неизвестным конверсиям вариантов. p-значение условно на нулевой гипотезе и описывает вероятность получить столь же или более экстремальные данные, а не вероятность самой гипотезы.
  kind: choice
  options:
    - Обе величины показывают вероятность того, что B лучше A
    - P(B > A) оценивает вероятность преимущества B в рамках модели, а p-значение оценивает необычность данных при нулевой гипотезе
    - p-значение показывает вероятность нулевой гипотезы, а P(B > A) — частоту кликов B
    - Обе величины являются разными обозначениями средней конверсии B
  correct: 1
  id: 054-ab-decision-3
  fingerprint: 77ed84dc
