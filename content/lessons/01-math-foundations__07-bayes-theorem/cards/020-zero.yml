- concept: нулевой множитель обнуляет ненормированную оценку класса в наивном Байесе
  question: Текстовый классификатор без сглаживания встретил слово, которое отсутствовало во всех обучающих документах некоторого класса. Что произойдёт с произведением вероятностей признаков для этого класса?
  explanation: Отсутствие слова в обучающих документах даёт несглаженную оценку P(word|class) = 0. Поскольку эта вероятность входит в произведение, нулевой множитель обнуляет всю оценку класса и уничтожает вклад остальных слов.
  kind: choice
  options:
    - Оно станет равным нулю независимо от остальных признаков
    - Неизвестное слово будет автоматически исключено из произведения
    - Изменится только априорная вероятность класса
    - Произведение станет отрицательным
  correct: 0
  id: 020-zero-1
  fingerprint: c7955251
- concept: нулевая частота в конечной выборке не доказывает невозможность события
  question: Почему полученная без сглаживания оценка P(word|class) = 0 не позволяет заключить, что слово в принципе невозможно встретить в этом классе?
  explanation: MLE опирается только на наблюдённые частоты и при нулевом счётчике выдаёт ноль. В конечных данных это может отражать нехватку наблюдений, а не истинную нулевую вероятность.
  kind: open
  reference: Нулевая оценка означает лишь, что слово не встретилось в конечной обучающей выборке данного класса. Выборка не содержит всех возможных документов, поэтому отсутствие наблюдений не доказывает невозможность события.
  id: 020-zero-2
  fingerprint: 861a926e
