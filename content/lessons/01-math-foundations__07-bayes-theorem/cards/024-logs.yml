- concept: вычисление произведения вероятностей в логарифмическом пространстве предотвращает underflow
  question: Длинный документ классифицируется по произведению множества очень малых условных вероятностей. Как вычислить оценки классов, не потеряв их из-за округления произведений до нуля?
  explanation: 'Произведение положительных вероятностей можно заменить суммой их логарифмов: log(ab) = log(a) + log(b). Умеренные отрицательные логарифмы складываются без обнуления крошечного произведения.'
  kind: choice
  options:
    - Округлять каждую вероятность перед умножением
    - Складывать логарифмы вероятностей вместо их перемножения
    - Заменять все малые вероятности единицей
    - Сравнивать только количество слов в документе
  correct: 1
  id: 024-logs-1
  fingerprint: 426dfd62
- concept: монотонность логарифма сохраняет класс с максимальной оценкой
  question: Объясните, почему переход от произведений вероятностей к суммам их логарифмов не меняет выбранный наивным байесовским классификатором класс.
  explanation: Логарифмическая шкала меняет значения оценок, но не их порядок. Поэтому вычисления становятся устойчивее, а результат сравнения классов остаётся прежним.
  kind: open
  reference: Логарифм строго возрастает на положительных числах, поэтому из большей исходной оценки получается и больший логарифм. Следовательно, максимум среди логарифмических оценок достигается у того же класса, что и максимум среди произведений вероятностей.
