- concept: логарифмические оценки требуют начального максимума, меньшего любой конечной оценки
  question: Заполните пропуск при поиске класса с наибольшей логарифмической оценкой.
  explanation: Логарифмы вероятностей не положительны, поэтому начальный ноль мог бы оказаться больше всех корректных оценок. Отрицательная бесконечность гарантирует, что первая конечная оценка сможет стать лучшей.
