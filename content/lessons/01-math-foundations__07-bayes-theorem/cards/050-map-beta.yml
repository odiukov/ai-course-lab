- concept: MAP-оценка для внутренней моды Beta(a, b) равна (a−1)/(a+b−2), а не среднему распределения
  question: Апостериорное распределение параметра имеет вид Beta(6, 4). Чему равна MAP-оценка параметра?
  explanation: 'При a > 1 и b > 1 MAP совпадает с модой Beta-распределения: (a−1)/(a+b−2). Для Beta(6, 4) это 5/8 = 0,625. Среднее было бы равно 6/10 = 0,6, поскольку оно отвечает на другой вопрос.'
  kind: numeric
  answer: 0.625
  tolerance: 0.001
  id: 050-map-beta-1
  fingerprint: 4ae4d56d
- concept: у равномерного Beta-распределения нет единственной MAP-точки
  question: Какую MAP-оценку следует указать для параметра с распределением Beta(1, 1), если дополнительных правил выбора нет?
  explanation: 'Beta(1,1) — равномерное распределение: все допустимые значения параметра имеют одинаковую плотность. Поэтому уникального пика и единственной MAP-точки нет; значение 0,5 является средним, но не выделенной модой.'
  kind: choice
  options:
    - 0,5, потому что это среднее распределения
    - 0, потому что MAP всегда находится на границе
    - 'Единственной MAP-оценки нет: плотность одинакова на всём интервале'
    - Любое значение, кроме границ интервала
  correct: 2
  id: 050-map-beta-2
  fingerprint: b5fa0d77
- concept: MAP и апостериорное среднее по-разному сводят асимметричное распределение к одной точке
  question: Объясните своими словами, почему MAP-оценка и апостериорное среднее могут различаться у асимметричного Beta-распределения.
  explanation: MAP описывает положение максимума плотности, а среднее — баланс всего распределения. Поэтому у асимметричной Beta(9,5) из урока MAP равен 8/12 ≈ 0,667, тогда как среднее равно 9/14 ≈ 0,643.
  kind: open
  reference: MAP выбирает значение параметра с максимальной апостериорной плотностью, то есть моду. Среднее учитывает положения и плотности всех возможных значений, поэтому длинный хвост асимметричного распределения смещает его относительно пика.
  id: 050-map-beta-3
  fingerprint: 3eb7f946
