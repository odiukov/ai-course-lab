<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Как меняется состояние при смене намерения</title>
<style>
:root{
  color-scheme:light dark;
  --page:#f7f8fb;
  --panel:#ffffff;
  --panel-soft:#f1f4f8;
  --text:#172033;
  --muted:#637083;
  --line:#a7b1c2;
  --blue:#2563eb;
  --blue-soft:#e8f0ff;
  --green:#188457;
  --green-soft:#e5f6ee;
  --red:#c34242;
  --red-soft:#fdecec;
  --amber:#a46509;
  --amber-soft:#fff3d6;
}
@media (prefers-color-scheme:dark){
  :root{
    --page:#11151d;
    --panel:#1a202b;
    --panel-soft:#232b38;
    --text:#edf2f8;
    --muted:#a9b4c5;
    --line:#536075;
    --blue:#79a7ff;
    --blue-soft:#1d3158;
    --green:#68d5a5;
    --green-soft:#173d31;
    --red:#ff8b8b;
    --red-soft:#492626;
    --amber:#f3c26d;
    --amber-soft:#463719;
  }
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--page);
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}
main{
  width:100%;
  background:var(--page);
}
h1{
  margin:0;
  padding:14px 18px 8px;
  font-size:21px;
  line-height:1.25;
  font-weight:720;
}
svg{
  display:block;
  width:100%;
  height:auto;
  max-height:470px;
  background:var(--page);
}
.card{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.state{fill:var(--panel-soft);stroke:var(--line);stroke-width:1.5}
.flow{stroke:var(--line);stroke-width:2;fill:none;stroke-linecap:round}
.flow-blue{stroke:var(--blue);stroke-width:2.5;fill:none;stroke-linecap:round}
.txt{fill:var(--text);font-size:15px}
.small{fill:var(--muted);font-size:12px;font-weight:650;letter-spacing:.03em}
.label{fill:var(--muted);font-size:12px}
.strong{fill:var(--text);font-size:15px;font-weight:700}
.slot{fill:var(--panel-soft);stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 4}
.old{fill:var(--red-soft);stroke:var(--red);stroke-width:1.5}
.new{fill:var(--blue-soft);stroke:var(--blue);stroke-width:1.5}
.keep{fill:var(--green-soft);stroke:var(--green);stroke-width:1.5}
.need{fill:var(--amber-soft);stroke:var(--amber);stroke-width:1.5}
.old-text{fill:var(--red);font-size:14px;font-weight:700}
.new-text{fill:var(--blue);font-size:14px;font-weight:700}
.keep-text{fill:var(--green);font-size:13px;font-weight:700}
.need-text{fill:var(--amber);font-size:13px;font-weight:700}
.fallback{
  margin:10px 18px 18px;
  padding:14px;
  background:var(--panel);
  border:1.5px solid var(--line);
  color:var(--text);
  font-size:15px;
}
</style>
</head>
<body>
<main>
  <h1 id="diagram-title">Как меняется состояние при смене намерения</h1>
  <svg id="diagram" viewBox="0 0 1160 455"
       preserveAspectRatio="xMidYMid meet"
       role="img" aria-labelledby="diagram-title diagram-description">
    <desc id="diagram-description">Диалог о смене рейса переходит от запроса и уточнения пустых полей к отмене рейса. Активное намерение меняется, полезный контекст сохраняется, а дата нового рейса отбрасывается.</desc>
  </svg>
  <div id="fallback" class="fallback" hidden>
    Схема должна была показать: запрос на смену рейса, пустые поля даты и номера брони, уточнение, реплику «вместо этого отменю» и переключение намерения с сохранением полезных данных.
  </div>
</main>
<script>
const diagramData = [
  {
    radius:12, smallRadius:8, arrowHead:11, arrowWing:5,
    cardsY:44, cardsH:146,
    stateX:32, stateY:242, stateW:1096, stateH:164,
    panelTitleX:58, panelTitleY:270,
    oldX:70, oldY:296, oldW:242, oldH:46,
    newX:530, newY:296, newW:226, newH:46,
    keepX:810, keepY:286, keepW:286, keepH:102,
    needX:498, needY:357, needW:290, needH:34,
    droppedX:70, droppedY:357, droppedW:356, droppedH:34,
    legendY:432, legendLine:27, legendGap:18
  },
  [
    {
      x:24,y:44,w:192,h:146,kind:"request",
      header:"ЗАПРОС",
      lines:["Пользователь:","«Хочу поменять","рейс»"],
      headerX:42,headerY:68,textX:42,textY:101,lineGap:23
    },
    {
      x:262,y:44,w:226,h:146,kind:"slots",
      header:"СОСТОЯНИЕ",
      lines:["Не хватает данных"],
      headerX:280,headerY:68,textX:280,textY:98,lineGap:22,
      slots:[
        {x:280,y:112,w:190,h:27,text:"дата: —",tx:294,ty:131},
        {x:280,y:148,w:190,h:27,text:"номер брони: —",tx:294,ty:167}
      ]
    },
    {
      x:534,y:44,w:202,h:146,kind:"clarify",
      header:"УТОЧНЕНИЕ",
      lines:["Бот:","«На какую дату?","Какой номер","брони?»"],
      headerX:552,headerY:68,textX:552,textY:96,lineGap:21
    },
    {
      x:782,y:44,w:352,h:146,kind:"switch",
      header:"НОВАЯ РЕПЛИКА",
      lines:["Пользователь:","«Стоп, вместо этого","отменю»"],
      headerX:800,headerY:68,textX:800,textY:101,lineGap:24
    }
  ],
  [
    {from:{x:216,y:117},to:{x:252,y:117},label:"разбор запроса",lx:234,ly:102,anchor:"middle",tone:"flow"},
    {from:{x:488,y:117},to:{x:524,y:117},label:"следующий вопрос",lx:506,ly:102,anchor:"middle",tone:"flow"},
    {from:{x:736,y:117},to:{x:772,y:117},label:"ответ меняет цель",lx:754,ly:102,anchor:"middle",tone:"flow"},
    {from:{x:958,y:190},to:{x:958,y:232},label:"пересобрать состояние",lx:976,ly:215,anchor:"start",tone:"flow-blue"},
    {from:{x:322,y:319},to:{x:518,y:319},label:"переключение intent",lx:420,ly:301,anchor:"middle",tone:"flow-blue"}
  ],
  [
    {type:"old",x:70,y:296,w:242,h:46,text:"intent: смена рейса",tx:191,ty:325,anchor:"middle"},
    {type:"new",x:530,y:296,w:226,h:46,text:"intent: отмена рейса",tx:643,ty:325,anchor:"middle"},
    {type:"dropped",x:70,y:357,w:356,h:34,text:"дата нового рейса — отброшена",tx:248,ty:379,anchor:"middle"},
    {type:"need",x:498,y:357,w:290,h:34,text:"номер брони — всё ещё нужен",tx:643,ty:379,anchor:"middle"},
    {type:"keep",x:810,y:286,w:286,h:102,title:"СОХРАНЯЕТСЯ",titleX:832,titleY:310,
      lines:[
        {text:"контекст рейса",x:832,y:340},
        {text:"история диалога",x:832,y:369}
      ]
    }
  ],
  [
    {x:58,y:432,color:"green",text:"полезное остаётся",tx:94,ty:437},
    {x:384,y:432,color:"red",text:"устаревшее отбрасывается",tx:420,ty:437},
    {x:810,y:432,color:"blue",text:"новая цель становится активной",tx:846,ty:437}
  ]
];

const origin = Object.freeze({x:12,y:8});
const scale = Object.freeze({x:0.98,y:0.98});
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const [layout,cards,arrows,stateItems,legend] = diagramData;
  const svg = document.getElementById("diagram");
  const NS = "http://www.w3.org/2000/svg";

  const node = (name,attrs={},content) => {
    const n=document.createElementNS(NS,name);
    for(const [key,value] of Object.entries(attrs)) n.setAttribute(key,value);
    if(content!==undefined) n.textContent=content;
    return n;
  };

  const lengthX = value => sx(value)-sx(0);
  const lengthY = value => sy(value)-sy(0);

  const addRect = (parent,item,className) => {
    parent.append(node("rect",{
      x:sx(item.x),y:sy(item.y),
      width:lengthX(item.w),height:lengthY(item.h),
      rx:lengthX(item.r ?? layout.radius),
      class:className
    }));
  };

  const addText = (parent,x,y,value,className,anchor="start") => {
    parent.append(node("text",{
      x:sx(x),y:sy(y),class:className,"text-anchor":anchor
    },value));
  };

  const addArrow = item => {
    const group=node("g");
    const dx=item.to.x-item.from.x;
    const dy=item.to.y-item.from.y;
    const magnitude=Math.hypot(dx,dy);
    const ux=dx/magnitude;
    const uy=dy/magnitude;
    const baseX=item.to.x-ux*layout.arrowHead;
    const baseY=item.to.y-uy*layout.arrowHead;
    const leftX=baseX-uy*layout.arrowWing;
    const leftY=baseY+ux*layout.arrowWing;
    const rightX=baseX+uy*layout.arrowWing;
    const rightY=baseY-ux*layout.arrowWing;

    group.append(node("line",{
      x1:sx(item.from.x),y1:sy(item.from.y),
      x2:sx(baseX),y2:sy(baseY),class:item.tone
    }));
    group.append(node("polygon",{
      points:`${sx(item.to.x)},${sy(item.to.y)} ${sx(leftX)},${sy(leftY)} ${sx(rightX)},${sy(rightY)}`,
      fill:item.tone==="flow-blue"?"var(--blue)":"var(--line)"
    }));
    addText(group,item.lx,item.ly,item.label,"label",item.anchor);
    svg.append(group);
  };

  for(const card of cards){
    const group=node("g");
    addRect(group,{...card,r:layout.radius},"card");
    addText(group,card.headerX,card.headerY,card.header,"small");
    card.lines.forEach((line,index)=>{
      addText(
        group,
        card.textX,
        card.textY+index*card.lineGap,
        line,
        index===0 ? "small" : "txt"
      );
    });
    for(const slot of card.slots ?? []){
      addRect(group,{...slot,r:layout.smallRadius},"slot");
      addText(group,slot.tx,slot.ty,slot.text,"txt");
    }
    svg.append(group);
  }

  arrows.forEach(addArrow);

  const stateGroup=node("g");
  addRect(stateGroup,{
    x:layout.stateX,y:layout.stateY,
    w:layout.stateW,h:layout.stateH,r:layout.radius
  },"state");
  addText(
    stateGroup,
    layout.panelTitleX,
    layout.panelTitleY,
    "СОСТОЯНИЕ ПОСЛЕ СМЕНЫ НАМЕРЕНИЯ",
    "small"
  );

  for(const item of stateItems){
    if(item.type==="old"){
      addRect(stateGroup,item,"old");
      addText(stateGroup,item.tx,item.ty,item.text,"old-text",item.anchor);
      stateGroup.append(node("line",{
        x1:sx(item.x+18),y1:sy(item.y+item.h-10),
        x2:sx(item.x+item.w-18),y2:sy(item.y+10),
        stroke:"var(--red)",class:"flow"
      }));
    }
    if(item.type==="new"){
      addRect(stateGroup,item,"new");
      addText(stateGroup,item.tx,item.ty,item.text,"new-text",item.anchor);
    }
    if(item.type==="dropped"){
      addRect(stateGroup,item,"old");
      addText(stateGroup,item.tx,item.ty,item.text,"old-text",item.anchor);
    }
    if(item.type==="need"){
      addRect(stateGroup,item,"need");
      addText(stateGroup,item.tx,item.ty,item.text,"need-text",item.anchor);
    }
    if(item.type==="keep"){
      addRect(stateGroup,item,"keep");
      addText(stateGroup,item.titleX,item.titleY,item.title,"small");
      for(const line of item.lines){
        const dotX=line.x-12;
        stateGroup.append(node("circle",{
          cx:sx(dotX),cy:sy(line.y-5),r:lengthX(3),
          fill:"var(--green)"
        }));
        addText(stateGroup,line.x,line.y,line.text,"keep-text");
      }
    }
  }
  svg.append(stateGroup);

  for(const item of legend){
    const color=item.color==="green"
      ?"var(--green)"
      :item.color==="red"
        ?"var(--red)"
        :"var(--blue)";
    svg.append(node("line",{
      x1:sx(item.x),y1:sy(item.y),
      x2:sx(item.x+layout.legendLine),y2:sy(item.y),
      stroke:color,class:"flow"
    }));
    addText(svg,item.tx,item.ty,item.text,"label");
  }
} catch (error) {
  document.getElementById("diagram").hidden=true;
  document.getElementById("fallback").hidden=false;
}
</script>
</body>
</html>
