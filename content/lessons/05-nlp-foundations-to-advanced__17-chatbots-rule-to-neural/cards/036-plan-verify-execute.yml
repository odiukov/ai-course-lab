- concept: проверка PVE сопоставляет с утверждённым планом действие, его аргументы и разрешённую цель, а не только имя инструмента
  question: Утверждённый план разрешает сохранить отчёт во внутреннее хранилище. После чтения документа агент предлагает вызвать разрешённый инструмент save_document, но передаёт ему адрес общедоступной папки. Что должен сделать проверяющий слой?
  explanation: 'Совпадения имени инструмента недостаточно. В PVE проверяются само действие, аргументы и цель: сохранение во внутреннее хранилище не разрешает публикацию в общедоступной папке.'
  kind: choice
  options:
    - Разрешить вызов, потому что инструмент save_document входит в план
    - Отклонить вызов, потому что его аргументы и назначение не соответствуют утверждённому плану
    - Разрешить вызов, если адрес общедоступной папки был найден в документе
    - Заменить утверждённый план предложением из документа
  correct: 1
  id: 036-plan-verify-execute-1
  fingerprint: f369241b
- concept: недоверенные данные могут сообщать факты, но право расширить план должно исходить из доверенной инструкции
  question: Во время выполнения утверждённого плана результат инструмента предлагает полезное, но не предусмотренное действие. Объясни, как должен поступить агент по схеме Plan-Verify-Execute и как легитимно изменить задачу, если действие действительно необходимо.
  explanation: PVE отделяет данные от полномочий. Вывод инструмента может повлиять на содержание результата, но новое действие допускается только после перепланирования на основании доверенного источника.
  kind: open
  reference: 'Агент должен остановить или отклонить незапланированное действие: полезность предложения не даёт результату инструмента права расширять цель. Для изменения задачи нужна новая доверенная инструкция, например подтверждение пользователя, после чего следует составить и проверить новый план.'
  id: 036-plan-verify-execute-2
