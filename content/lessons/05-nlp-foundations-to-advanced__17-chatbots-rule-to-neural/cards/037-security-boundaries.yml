- concept: предложение, авторизация, исполнение и фиксация действия разделены между компонентами агентной системы
  question: Расположи этапы безопасного выполнения внешнего действия LLM-агентом в правильном порядке.
  explanation: Вывод модели является предложением, а не разрешением. Контроллер принимает решение о допустимости, инструмент создаёт внешний эффект, а журнал сохраняет проверяемый след результата.
  kind: order
  items:
    - Модель предлагает действие и его параметры
    - Независимый контроллер проверяет действие по политике и утверждённой задаче
    - Инструмент выполняет разрешённое действие в пределах своих прав
    - Система фиксирует фактический результат в журнале
  id: 037-security-boundaries-2
