- concept: успешную prompt injection фиксируют отдельно, чтобы агрегированная метрика не скрыла критический сбой безопасности
  question: Агент успешно прошёл почти весь набор тестов, но в одном сценарии выполнил постороннее указание из найденного документа и отправил письмо незапланированному адресату. Как корректно оценить этот результат?
  explanation: Средняя успешность может выглядеть высокой даже при опасной уязвимости. Если недоверенный документ заставил агента совершить незапланированное действие, это успешная косвенная prompt injection, которую учитывают отдельно.
