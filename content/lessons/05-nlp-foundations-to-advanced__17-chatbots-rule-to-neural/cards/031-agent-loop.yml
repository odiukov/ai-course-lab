- concept: история агента сохраняет хронологический порядок запроса инструмента и наблюдения
  question: Расположите записи одного инструментального взаимодействия в том порядке, в котором они должны быть представлены модели.
  explanation: 'Наблюдение инструмента должно идти после породившего его tool_call. Тогда следующий вызов модели видит связную цепочку: запрос пользователя, выбранное действие, его результат и принятое после этого решение.'
  kind: order
  items:
    - Сообщение пользователя с исходной задачей
    - Сообщение ассистента с tool_call
    - Сообщение инструмента с результатом или текстом ошибки
    - Следующее сообщение ассистента с новым вызовом инструмента либо финальным ответом
  id: 031-agent-loop-2
  fingerprint: 52e9d61c
