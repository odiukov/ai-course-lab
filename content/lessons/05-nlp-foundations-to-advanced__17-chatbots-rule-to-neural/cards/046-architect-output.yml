- concept: контракт инструмента фиксирует входную схему, успешный результат и возможные ошибки
  question: Для инструмента заданы имя и обязательные аргументы, но не описаны форматы успешного результата и ошибок. Почему такой контракт неполон?
  explanation: Полный контракт описывает не только допустимый вызов, но и ожидаемый успешный ответ и ошибки. Это позволяет контроллеру валидировать результат и предсказуемо обрабатывать неудачные вызовы.
  kind: choice
  options:
    - Модель не сможет определить естественный язык пользователя
    - Среда не сможет надёжно проверить результат и единообразно обработать сбой
    - Retrieval-компонент перестанет находить похожие документы
    - Стоимость каждого вызова модели станет неизвестной
