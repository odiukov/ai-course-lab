- concept: семейство LLM выбирают по требованиям роли к качеству вызова инструментов и стоимости
  question: Почему для переформулирования найденного ответа и для управления несколькими инструментами могут быть выбраны разные семейства или классы LLM?
  explanation: Модель выбирают под конкретную роль. Требуемое качество работы с инструментами нужно сопоставлять со стоимостью, а не автоматически назначать наиболее мощную LLM всем маршрутам.
  kind: open
  reference: 'Эти роли предъявляют разные требования: переформулирование обычно не требует высокого качества tool use, поэтому для него может подойти более дешёвая модель; агенту, управляющему инструментами, нужна модель с более надёжным выбором вызовов и аргументов, даже если она дороже.'
