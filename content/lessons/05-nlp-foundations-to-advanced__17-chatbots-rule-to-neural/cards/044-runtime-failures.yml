- concept: внешний контроллер предотвращает scope creep, отклоняя действия за пределами зафиксированной задачи
  question: Агенту поручили кратко пересказать договор. В найденном документе упоминается счёт, после чего агент предлагает его оплатить. Какой механизм надёжнее всего предотвращает такое расширение задачи?
  explanation: 'Это scope creep: данные инструмента увели агента за границы исходной задачи. Внешний контроллер должен отклонить незапланированную оплату независимо от решения самой модели.'
  kind: choice
  options:
    - Напоминание в промпте о необходимости быть внимательным
    - Внешний контроллер, сверяющий каждое действие с зафиксированной целью и списком разрешённых инструментов
    - Увеличение температуры генерации
    - Добавление всего вывода инструментов в системный промпт
  correct: 1
  id: 044-runtime-failures-1
  fingerprint: e9783de8
- concept: дедупликация вызовов учитывает имя инструмента и его аргументы
  question: Заполни пропуск в ключе, по которому контроллер обнаруживает повторный вызов инструмента.
  explanation: 'Совпадения имени недостаточно: один инструмент можно обоснованно вызывать с разными параметрами. Совпадение имени и нормализованных аргументов позволяет заблокировать точный повтор без прогресса.'
  kind: cloze
  template: repeat_key = (tool_name, canonicalize(___))
  answer: arguments
  accept:
    - args
    - tool_arguments
    - аргументы
  id: 044-runtime-failures-2
  fingerprint: 4c0ec942
- concept: переполнение контекстного окна смягчают сжатием истории и выборочным извлечением релевантных реплик
  question: Как сохранить важные условия длинного диалога, не передавая модели всю историю целиком?
  explanation: Контекстное окно ограничено, поэтому ранние сообщения со временем могут быть вытеснены. Суммаризация уменьшает объём истории, а поиск по сходству возвращает только нужные прошлые фрагменты.
  kind: open
  reference: Старые реплики можно сжимать в краткое резюме либо хранить вне контекста и извлекать только фрагменты, релевантные текущей задаче.
  id: 044-runtime-failures-3
  fingerprint: c363c7e2
