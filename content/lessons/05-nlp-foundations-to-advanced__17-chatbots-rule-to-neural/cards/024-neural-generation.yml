- concept: авторегрессионная модель строит ответ последовательно, выбирая каждый следующий токен с учётом уже созданного текста
  question: Расположите этапы нейросетевой генерации ответа в правильном порядке.
  explanation: 'Ответ не извлекается как готовая строка: модель последовательно дополняет его токенами, каждый раз учитывая ранее созданное продолжение.'
  kind: order
  items:
    - Модель получает инструкцию и входное сообщение
    - Модель оценивает варианты следующего токена с учётом входа и уже созданного продолжения
    - Выбранный токен добавляется к продолжению
    - Оценка и добавление токенов повторяются до условия остановки
  id: 024-neural-generation-1
  fingerprint: d84ab218
- concept: max_new_tokens задаёт верхнюю границу длины продолжения, а не обязательную длину ответа
  question: Что гарантирует параметр max_new_tokens при нейросетевой генерации?
  explanation: Параметр ограничивает максимальную длину продолжения. Генерация может завершиться раньше по условию остановки; лимит также сдерживает длинные и повторяющиеся ответы маленьких моделей.
  kind: choice
  options:
    - Ответ всегда будет содержать ровно заданное количество новых токенов
    - Модель добавит не больше заданного количества новых токенов, но может остановиться раньше
    - Модель будет выбирать ответ только из заранее подготовленного списка
  correct: 1
  id: 024-neural-generation-2
  fingerprint: d7e8b747
- concept: в гибридной системе небольшую генеративную модель безопаснее использовать для формулировки ответа, а не как источник фактов
  question: Бэкенд уже вернул проверенные данные о заказе. Какую роль разумнее поручить небольшой генеративной модели?
  explanation: Маленькие генеративные модели могут противоречить себе и выдумывать факты. В гибридной системе содержание берут из контролируемого источника, а модели поручают естественную формулировку.
  kind: choice
  options:
    - Переформулировать проверенные данные в естественный вежливый ответ, не добавляя новых фактов
    - Самостоятельно догадаться о состоянии заказа по сообщению пользователя
    - Заменить проверенные данные более правдоподобной версией, если они кажутся необычными
  correct: 0
  id: 024-neural-generation-3
