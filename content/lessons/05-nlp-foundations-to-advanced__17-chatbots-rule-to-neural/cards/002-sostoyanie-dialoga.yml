- concept: состояние диалога связывает реплики и хранит параметры текущей задачи
  question: Пользователь сначала просит изменить бронирование, затем отдельной репликой сообщает его код. Зачем чат-боту хранить состояние диалога?
  explanation: Состояние диалога хранит активную задачу, уже известные параметры и недостающие данные. Благодаря этому короткая реплика вроде кода бронирования получает смысл в контексте текущего разговора.
  kind: choice
  options:
    - Чтобы связать код с текущей задачей и запомнить уже полученные параметры
    - Чтобы отвечать на каждую реплику независимо от предыдущих
    - Чтобы заранее выполнить действие без дополнительных вопросов
    - Чтобы постоянно хранить все сообщения пользователя для любых будущих разговоров
  correct: 0
  id: 002-sostoyanie-dialoga-1
  fingerprint: 8ffcfda0
- concept: уточняющий вопрос заполняет недостающий обязательный параметр до выполнения действия
  question: Почему чат-бот не должен угадывать недостающую дату или другой обязательный параметр перед изменением бронирования?
  explanation: Если действие влияет на билет, платёж или другие реальные данные, догадка опасна. Уточнение превращает неизвестный обязательный параметр в явно подтверждённое значение.
  kind: open
  reference: Угаданный параметр может привести к неверному действию в реальной системе. Бот должен определить, какого обязательного значения не хватает, запросить его у пользователя и только затем продолжить выполнение задачи.
  id: 002-sostoyanie-dialoga-2
  fingerprint: 6724ba4f
- concept: при смене задачи диалоговая система останавливает прежний сценарий и переносит только релевантный контекст
  question: Пользователь во время изменения бронирования решает вместо этого отменить его. Расположите действия чат-бота в безопасном порядке.
  explanation: Смена цели не должна запускать новый диалог с нуля или оставлять старое действие активным. Система сохраняет общие данные, очищает нерелевантное состояние, уточняет параметры новой задачи и получает подтверждение перед необратимым действием.
  kind: order
  items:
    - Распознать смену цели и прекратить выполнение сценария изменения
    - Перенести в новую задачу подходящий общий контекст, например идентификатор бронирования
    - Отбросить параметры, относящиеся только к прежней задаче
    - Запросить недостающие сведения для отмены
    - Получить подтверждение и только после этого выполнить отмену
  id: 002-sostoyanie-dialoga-3
  fingerprint: 28c1dcc2
