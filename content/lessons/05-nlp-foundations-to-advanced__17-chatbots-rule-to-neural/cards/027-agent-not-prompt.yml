- concept: сбой инструмента превращается в доступное модели наблюдение
  question: Вызванный LLM-агентом внешний API завершился тайм-аутом. Как контроллеру цикла следует обработать этот сбой?
  explanation: Ошибка настоящего API — нормальный исход вызова. Если добавить её в историю как наблюдение, модель сможет повторить попытку, исправить аргументы или выбрать другой инструмент. Необработанное исключение оборвало бы весь разговор.
  kind: choice
  options:
    - Записать описание ошибки в историю как результат инструмента и снова вызвать модель
    - Пропустить ошибку и сообщить модели, что инструмент успешно выполнился
    - Завершить весь разговор необработанным исключением
    - Удалить из истории запрос, приведший к ошибке
  correct: 0
  id: 027-agent-not-prompt-1
  fingerprint: 789be463
- concept: бюджет шагов ограничивает продолжительность и стоимость агентного цикла
  question: Почему контроллер LLM-агента должен ограничивать число итераций цикла?
  explanation: Модель может снова и снова выбирать неудачное действие. В приведённой реализации max_steps=5 превращает такой сценарий в ограниченное число попыток, после которых агент честно сообщает, что не смог завершить задачу.
  kind: open
  reference: Ограничение не позволяет агенту бесконечно повторять вызовы инструментов при неоднозначной задаче или постоянных сбоях. После исчерпания бюджета контроллер завершает цикл предсказуемым сообщением, ограничивая задержку и расходы.
  id: 027-agent-not-prompt-2
  fingerprint: 14c9f50f
