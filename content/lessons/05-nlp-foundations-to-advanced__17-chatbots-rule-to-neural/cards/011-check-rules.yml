- concept: квантификатор звёздочка допускает пустое совпадение, а плюс требует хотя бы один символ
  question: Какой шаблон способен совпасть в том числе с пустой строкой?
  explanation: Квантификатор * допускает отсутствие символов, поэтому (.*) совпадает даже с пустой строкой. Квантификатор + требует непустой фрагмент.
  kind: choice
  options:
    - r"(.*)"
    - r"(.+)"
