- concept: retrieval-система выбирает ближайший FAQ-ответ и применяет порог отказа
  question: Расположите этапы обработки запроса в retrieval-системе с порогом отказа.
  explanation: Retrieval сначала находит наиболее похожий вопрос, но возвращает его ответ лишь при достаточном сходстве. Если лучшая оценка ниже порога, система возвращает `None`, чтобы запрос можно было передать другому сценарию или человеку.
  kind: order
  items:
    - Преобразовать вопросы из FAQ в векторные представления
    - Преобразовать новый запрос пользователя в векторное представление
    - Вычислить сходство запроса с каждым вопросом из FAQ
    - Найти вопрос с максимальной оценкой сходства
    - Сравнить максимальную оценку с порогом
    - Вернуть связанный готовый ответ либо сигнал отказа
  id: 018-retrieval-faq-1
  fingerprint: 753b4d54
- concept: скалярное произведение нормированных эмбеддингов равно косинусному сходству
  question: Эмбеддинги вопросов FAQ и пользовательского запроса нормированы до единичной длины. Что в таком случае вычисляет их скалярное произведение?
  explanation: Для векторов единичной длины скалярное произведение совпадает с косинусом угла между ними. Чем оно больше, тем ближе эмбеддинги по направлению, однако эта оценка сама по себе не является калиброванной вероятностью правильности ответа.
  kind: choice
  options:
    - Косинусное сходство между запросом и вопросом
    - Евклидово расстояние между исходными текстами
    - Калиброванную вероятность правильности готового ответа
    - Количество общих слов в запросе и вопросе
  correct: 0
  id: 018-retrieval-faq-2
  fingerprint: 219d1fbd
