- concept: операциональный критерий заменяет философский вопрос наблюдаемым и воспроизводимым испытанием
  question: Исследователь хочет превратить вопрос «обладает ли машина интеллектом?» в проверяемую гипотезу. Какой подход соответствует предложению Тьюринга?
  explanation: 'Тьюринг заменил спор о ненаблюдаемом мышлении наблюдаемым результатом: способен ли человек отличить машину от человека по разговору. Это делает критерий воспроизводимым, хотя и не раскрывает внутреннее устройство системы.'
  kind: choice
  options:
    - Проверить, устроены ли вычисления машины так же, как мышление человека
    - Оценить, может ли проверяющий по текстовому разговору надёжно отличить машину от человека
    - Попросить разработчиков подтвердить, что машина понимает смысл своих ответов
    - Измерить, сколько заранее подготовленных реплик хранит машина
  correct: 1
  id: 004-turing-dartmouth-1
  fingerprint: '97582e31'
- concept: неразличимость поведения в тесте не доказывает наличие сознания или человеческого понимания
  question: Проверяющий не смог отличить машину от человека в слепой текстовой беседе. Какой вывод из этого результата обоснован, а какой — нет?
  explanation: Тест Тьюринга задаёт поведенческий критерий. Успех показывает убедительность разговора при заданных условиях, но не доказывает сознание, чувства или определённый механизм понимания.
  kind: open
  reference: 'Обоснован вывод, что в условиях данного испытания текстовое поведение машины оказалось неотличимо от человеческого. Нельзя заключить, что машина обладает сознанием, чувствами или человеческим пониманием: тест оценивает наблюдаемое поведение, а не внутренние состояния.'
  id: 004-turing-dartmouth-2
  fingerprint: b4ada8a8
