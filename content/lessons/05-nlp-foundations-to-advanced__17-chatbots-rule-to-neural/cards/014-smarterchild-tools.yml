- concept: обработка запроса с актуальными данными состоит из распознавания intent, вызова бэкенда и рендеринга ответа
  question: Расположите этапы обработки запроса к чат-боту в правильном порядке.
  explanation: SmarterChild сначала определял задачу пользователя, затем обращался к нужному сервису и вставлял полученные данные в подготовленную форму ответа. Такая последовательность стала ранним вариантом современного tool calling.
  kind: order
  items:
    - Распознать намерение пользователя
    - Выбрать и вызвать соответствующий бэкенд-сервис
    - Получить результат сервиса
    - Подставить результат в шаблон ответа
  id: 014-smarterchild-tools-1
  fingerprint: d13e8eff
- concept: актуальность изменяющихся сведений обеспечивает получение данных во время запроса
  question: Чат-бот должен сообщать текущий курс валют, который регулярно меняется. Какой подход обеспечивает актуальность ответа без постоянного переписывания диалоговых правил?
  explanation: Шаблон может задавать постоянную форму ответа, но изменяющееся значение нужно получать из внешнего источника во время запроса. Поэтому свежие данные не требуют нового диалогового правила для каждого обновления.
  kind: choice
  options:
    - Хранить один заранее написанный курс в шаблоне ответа
    - При каждом запросе получать курс из бэкенда и подставлять его в шаблон
    - Добавить больше вариантов формулировки одного и того же статического ответа
    - Выбирать случайный курс из нескольких заготовок
  correct: 1
  id: 014-smarterchild-tools-2
  fingerprint: 7a9805a0
