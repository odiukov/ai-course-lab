- concept: синтаксическая сборка ответа из захваченного текста не означает семантического понимания
  question: Почему уместный ответ rule-based чат-бота, составленный подстановкой захваченного фрагмента в заготовку, сам по себе не доказывает, что бот понял смысл реплики?
  explanation: 'ELIZA строила ответы правилами декомпозиции и сборки: извлекала часть ввода и возвращала её в заранее заданной рамке. Правдоподобность результата возникала из синтаксического преобразования, а не из понимания смысла.'
  kind: open
  reference: Бот мог лишь сопоставить текст с заранее написанным шаблоном, сохранить совпавший фрагмент и вставить его в другую заготовку. Для такой операции не требуется представлять значение слов или рассуждать о содержании реплики.
  id: 006-eliza-zahvat-2
