- concept: внутреннему ассистенту в IDE нужен LLM-агент с инструментами для работы с кодовой базой
  question: Какую архитектуру следует выбрать для ассистента в IDE, который должен находить определения, изучать проект и вносить изменения в исходный код?
  explanation: 'Одной генерации текста недостаточно: ассистенту необходимо получать актуальное содержимое проекта и воздействовать на файлы. Поэтому LLM включают в агентную архитектуру с инструментами поиска, чтения и записи.'
  kind: open
