- concept: агент может подтвердить выполнение действия только после проверки успешного ответа инструмента по его контракту
  question: Агент отправил корректный запрос на отмену заказа, но инструмент вернул статус «обрабатывается». Как должен ответить агент?
  explanation: Корректный вызов доказывает только попытку выполнить действие. Подтверждать результат можно лишь тогда, когда ответ инструмента удовлетворяет контракту успеха, например явно сообщает итоговый статус отмены.
  kind: choice
  options:
    - Подтвердить отмену, поскольку запрос был составлен правильно
    - Подтвердить отмену, поскольку инструмент принял запрос
    - Сообщить, что отмена ещё не подтверждена
    - Считать заказ отменённым, если ответ агента звучит уверенно
  correct: 2
  id: 034-verify-action-1
  fingerprint: 3782a3dd
- concept: журнал вызова инструмента создаёт проверяемый след выполненного внешнего действия
  question: Какие сведения следует сохранить, чтобы позднее можно было проверить заявление агента о выполненном внешнем действии?
  explanation: Такой журнал связывает конкретный запрос с фактическим ответом внешней системы. Текстовое заявление модели без этого следа не является доказательством выполнения.
  kind: open
  reference: Нужно сохранить имя инструмента, переданные аргументы, время вызова и успешный результат, однозначно подтверждающий действие по контракту инструмента.
  id: 034-verify-action-2
  fingerprint: 4e6525be
