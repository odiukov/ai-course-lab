- concept: вывод инструментов следует отделять от управляющих инструкций и считать недоверенными данными
  question: Почему фильтрации только пользовательских сообщений недостаточно для защиты агента от prompt injection?
  explanation: 'Косвенная инъекция минует защиту поля чата: агент сам получает опасный текст через инструмент и добавляет его в контекст. Содержимое внешнего источника может сообщать данные, но не должно получать полномочия менять задачу агента.'
  kind: open
  reference: Вредоносные инструкции могут находиться не только в чате, но и в документах, письмах, веб-страницах и другом выводе инструментов. Поэтому такие результаты нужно считать недоверенными данными, отделять от управляющих инструкций и не позволять им самостоятельно задавать новые действия.
  id: 035-prompt-injection-2
