- concept: безусловную подстраховку следует выполнять после перебора правил, чтобы она не делала последующие правила недостижимыми
  question: Объясни своими словами, почему подстраховочный ответ безопаснее возвращать после цикла проверки правил, чем хранить как обычное правило с шаблоном `(.*)`.
  explanation: Подстраховка должна срабатывать только при отсутствии других совпадений. Внешний возврат обеспечивает это условие независимо от дальнейшего добавления и перестановки содержательных правил.
  kind: open
  reference: Шаблон `(.*)` совпадает с любым вводом. Если он находится внутри списка, все правила ниже него становятся недостижимыми. Возврат подстраховочного ответа после цикла гарантирует, что сначала будут проверены все содержательные правила.
  id: 009-pattern-priority-2
  fingerprint: bf3cda18
