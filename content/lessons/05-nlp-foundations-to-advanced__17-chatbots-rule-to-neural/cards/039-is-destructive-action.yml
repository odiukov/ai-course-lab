- concept: экзистенциальная проверка any возвращает логическое значение при наличии хотя бы одного совпадения
  question: Заполни пропуск так, чтобы функция вернула True при обнаружении любого опасного слова и False в противном случае.
  explanation: Функция any возвращает строгое логическое значение и прекращает перебор после первого истинного условия. Предварительное приведение текста к нижнему регистру делает проверку нечувствительной к регистру.
  kind: cloze
  template: |-
    danger_words = ["delete", "cancel", "charge", "refund", "transfer"]
    return ___
  answer: any(word in text.lower() for word in danger_words)
  accept:
    - any(w in text.lower() for w in danger_words)
  id: 039-is-destructive-action-1
  fingerprint: 52bf0c16
- concept: поиск подстроки обнаруживает опасный термин даже внутри более длинного слова
  question: Фильтр проверяет выражение `word in text.lower()`. Что он вернёт для текста `This fee is nonrefundable`?
  explanation: Оператор `in` ищет подстроку и не проверяет границы слов. Поэтому `refund` обнаруживается внутри `nonrefundable`, и результатом будет True.
  kind: choice
  options:
    - False, потому что refund не является отдельным словом
    - True, потому что строка nonrefundable содержит подстроку refund
    - Возникнет ошибка из-за окончания able
  correct: 1
  id: 039-is-destructive-action-2
  fingerprint: af13ec4d
