- concept: полная спецификация чат-бота включает grounding, измеримую оценку и явные ограничения
  question: Какой проект чат-бота можно считать наиболее полной архитектурной спецификацией?
  explanation: Список компонентов ещё не определяет, откуда берутся проверяемые сведения, как измеряется качество и какие действия система не вправе выполнять самостоятельно. Для завершённого проекта нужны все эти части.
  kind: choice
  options:
    - Указаны семейство модели, размер контекста и ожидаемая стоимость запросов
    - Перечислены модель, векторная база и доступные внешние инструменты
    - Заданы источники и проверка результатов инструментов, метрики на отложенных диалогах и запреты для рискованных действий
    - Сохраняются подробные логи всех ответов модели и вызовов инструментов
  correct: 2
  id: 047-architect-safety-1
  fingerprint: 678681c5
- concept: отложенные диалоги проверяют перенос качества на сценарии вне настройки системы
  question: Почему чат-бота недостаточно оценивать только на диалогах, по которым настраивали его промпты, маршрутизацию и поиск?
  explanation: Оценка на данных настройки смешивает проверку качества с подгонкой. Отложенный набор лучше показывает, сохранится ли требуемое поведение на новых пользовательских диалогах.
  kind: open
  reference: На настроенных диалогах система может показывать завышенное качество, поскольку разработчики уже подогнали под них её поведение. Отложенные диалоги позволяют проверить обобщение на невиденные сценарии и честно измерить успешность задач, правильность вызовов инструментов, уходы от темы и галлюцинации.
  id: 047-architect-safety-2
  fingerprint: 40ea7f63
- concept: любой доступ агента на запись требует аудита prompt injection перед выпуском
  question: Агент может изменять адрес доставки. Записи проходят валидацию и подтверждаются пользователем, но команда отказалась от аудита prompt injection, потому что агент не читает документы из интернета. Как следует оценить готовность системы к выпуску?
  explanation: Отсутствие внешних документов не устраняет прямую инъекцию через пользовательский ввод. Если скомпрометированное поведение способно изменить данные, проверка устойчивости к prompt injection является обязательным условием выпуска.
  kind: choice
  options:
    - 'Систему можно выпускать: косвенная инъекция невозможна без внешних документов'
    - Аудит нужен только агентам, которые проводят платежи
    - 'Систему нельзя выпускать до аудита: пользовательский ввод тоже может содержать инъекцию, а агент имеет доступ на запись'
    - Аудит можно заменить измерением связности и вежливости ответов
  correct: 2
  id: 047-architect-safety-3
  fingerprint: b67a226c
