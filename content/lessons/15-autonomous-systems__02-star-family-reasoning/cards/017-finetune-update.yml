- concept: доля стратегии после фильтра равна нормированному произведению её исходной доли на вероятность успеха
  question: 'Модель порождает трассы двумя стратегиями: честная выбирается с вероятностью 0.6 и даёт верный ответ в 90% случаев, догадка выбирается с вероятностью 0.4 и попадает в верный ответ в 15% случаев. Оставляем только трассы с верным ответом. Какой процент отобранного набора составят честные трассы?'
  explanation: 'Доля честных до нормировки: 0.6 × 0.9 = 0.54; догадок: 0.4 × 0.15 = 0.06. Сумма 0.60 — это и есть точность смеси. Честные: 0.54 / 0.60 = 0.9, то есть 90%. Фильтр перевзвешивает исходные доли пропорционально вероятности успеха каждой стратегии — обычная формула апостериорного распределения.'
  kind: numeric
  answer: 90
  tolerance: 1
  id: 017-finetune-update-1
  fingerprint: ffcc8426
- concept: доля стратегии в отобранном наборе растёт ровно тогда, когда её точность выше средней точности всей смеси
  question: Смесь стратегий даёт верный ответ в 40% случаев. Некоторая стратегия внутри этой смеси верна в 35% случаев. Как изменится её доля после отбора трасс по верному ответу?
  explanation: 'После отбора доля умножается на отношение (точность стратегии) / (точность смеси): 0.35 / 0.40 < 1, значит доля падает. Порог — именно средняя точность смеси, а не какая-то абсолютная планка. Нулевой доля станет только у стратегии с нулевой точностью: любая стратегия, иногда попадающая в верный ответ, переживает фильтр и доходит до дообучения.'
  kind: choice
  options:
    - 'Упадёт: её доля растёт только при точности выше средней точности смеси (40%)'
    - 'Вырастет: 35% — заметная точность, такие трассы проходят фильтр часто'
    - 'Не изменится: фильтр удаляет трассы всех стратегий одинаково'
    - 'Станет нулевой: фильтр оставляет только самую точную стратегию'
  correct: 0
  id: 017-finetune-update-2
  fingerprint: a7f48c91
- concept: поведение модели меняется только через состав обучающих данных — отдельного сигнала «это рассуждение правильное» в цикле нет
  question: В STaR модель не получает никакой явной оценки качества рассуждения. Через какой канал тогда отбор по итоговому ответу вообще меняет её поведение?
  explanation: 'Это отличает STaR от обучения с явной наградой за шаги: здесь нет ни оценки промежуточных шагов, ни штрафа за плохое рассуждение — только перекос выборки. Поэтому у метода нет способа отличить причину успеха от совпадения с успехом.'
  kind: open
  reference: 'Единственный канал — состав дообучающего набора. Фильтр не передаёт модели сигнал «ход рассуждения верен»; он лишь меняет частоты, с которыми разные шаблоны рассуждения встречаются среди примеров. Дообучение максимизирует правдоподобие показанного, поэтому чаще встречающиеся шаблоны воспроизводятся чаще. Отсюда следствие: усиливается всё, что коррелирует с верным финалом, включая удачные догадки, а корректная трасса с арифметической ошибкой из набора выпадает и ослабевает.'
  id: 017-finetune-update-3
  fingerprint: f0b1ce33
