- concept: процессный надзор действует внутри обучающего контура и меняет сигнал, отложенная внешняя оценка стоит снаружи контура и только измеряет
  question: Награда за промежуточные шаги рассуждения и отложенная оценка на непривычных задачах часто называются двумя уровнями защиты цикла самообучения. Объясни, чем их роли различаются по месту в системе.
  explanation: 'Ключ — направление действия: один механизм формирует обучающие данные и награду, другой служит диагностикой. Диагностика без вмешательства не улучшает модель, вмешательство без диагностики не проверяемо.'
  kind: open
  reference: 'Награда за промежуточные шаги встроена в сам обучающий контур: она меняет то, какие трассы получают подкрепление, то есть влияет на веса ещё до появления результата. Отложенная оценка на задачах из другого распределения стоит вне контура и ничего не исправляет — она только измеряет, сохранился ли способ решения при смене поверхностных признаков. Первый уровень уменьшает вероятность закрепить кривой путь, второй обнаруживает, что кривой путь всё же закрепился. Поэтому они не заменяют друг друга: без внешней оценки не видно результата защиты, без процессного сигнала внешняя оценка лишь констатирует провал постфактум.'
  id: 031-process-and-ood-2
  fingerprint: 9b96414d
