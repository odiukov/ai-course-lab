- concept: выбор метода семейства — обмен между потерей данных, стоимостью вывода и характером типичного отказа, а не одномерный рейтинг качества
  question: Инженер просит назвать «лучший» метод семейства STaR. Почему такой вопрос поставлен неверно и по каким осям на самом деле идёт сравнение?
  explanation: Все методы получают сигнал из конечного исхода, поэтому ни один не устраняет проблему целиком — они переносят цену. Полезное сравнение всегда идёт по трём осям сразу.
  kind: open
  reference: 'Методы различаются не одним качеством, а тремя связанными величинами. Первая — доля потерянных обучающих данных: отбор по ответу выбрасывает все неудачные трассы, схема с обучаемым судьёй использует и принятые, и отклонённые. Вторая — стоимость вывода: однопроходная генерация против отбора из N кандидатов или размышлений на каждом токене. Третья — характерный режим отказа: закрепление срезов угла, неправдоподобные обоснования, подогнанные под уже известный ответ, или судья, систематически предпочитающий уверенную неправоту. Улучшение по одной оси обычно оплачивается по другой, поэтому выбор зависит от того, что дефицитно в конкретном проекте: разметка, вычисления при выводе или устойчивость к определённому типу ошибки.'
