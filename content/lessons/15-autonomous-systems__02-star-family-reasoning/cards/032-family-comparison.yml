- concept: надбавка за внутренние размышления на каждом токене приходится на длину вывода, а надбавка за отбор кандидатов — на их количество
  question: Почему накладной расход Quiet-STaR сохраняется даже при генерации единственного ответа, тогда как расход схемы отбора лучшего кандидата в этом случае исчезает?
  explanation: Два источника цены разные. Отбор кандидатов умножает стоимость на их количество и обнуляется при одном сэмпле. Внутренние мысли вставляются по позициям выходной последовательности, поэтому дают постоянный множитель к любому, даже одиночному, ответу.
  kind: choice
  options:
    - Потому что обоснование строится перед каждым предсказываемым токеном, и стоимость растёт вместе с длиной вывода, а не с числом кандидатов
    - Потому что Quiet-STaR всегда генерирует минимум два ответа и выбирает из них
    - Потому что Quiet-STaR требует дополнительного верификатора на каждом шаге вывода
    - Потому что Quiet-STaR обучается прямо во время вывода и обновляет веса на каждом запросе
