- concept: 'точность смеси считается по закону полной вероятности: сумма произведений вероятности выбора на точность стратегии'
  question: 'Модель выбирает стратегию A с вероятностью 0,6, стратегию B — 0,25, стратегию C — 0,15. Их точности: 0,85, 0,55 и 0,15 соответственно. Чему равна вероятность того, что случайная попытка даст верный ответ?'
  explanation: '0,6·0,85 + 0,25·0,55 + 0,15·0,15 = 0,51 + 0,1375 + 0,0225 = 0,67. Простое среднее точностей ((0,85+0,55+0,15)/3 ≈ 0,52) дало бы неверный ответ: стратегии используются неодинаково часто.'
  kind: numeric
  answer: 0.67
  tolerance: 0.005
  id: 009-mixture-accuracy-1
  fingerprint: c68af7f7
- concept: точность смеси всегда лежит между худшей и лучшей точностью её компонентов
  question: Модель пользуется двумя стратегиями с точностями 0,88 и 0,32; вероятности их выбора неизвестны, обе строго положительны. Что можно утверждать об ожидаемой точности всей модели?
  explanation: 'Взвешенное среднее с положительными весами, дающими в сумме единицу, не выходит за границы усредняемых значений. Превысить 0,88 нельзя: даже вероятность выбора 0,99 даёт 0,99·0,88 + 0,01·0,32 ≈ 0,87.'
  kind: choice
  options:
    - Она строго между 0,32 и 0,88, а где именно — зависит от вероятностей выбора
    - Она равна 0,60 — среднему двух точностей
    - Она может превысить 0,88, если удачная стратегия выбирается достаточно часто
  correct: 0
  id: 009-mixture-accuracy-2
  fingerprint: f288d063
