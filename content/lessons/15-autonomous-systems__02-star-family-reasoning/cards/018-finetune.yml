- concept: обновление вероятностей — выпуклое смешивание старого распределения с долями стратегий в отобранном наборе
  question: Заполни пропуск в шаге обновления вероятности стратегии по составу обучающего набора.
  explanation: 'Второе слагаемое — эмпирическая доля стратегии среди отобранных трасс: счётчик, делённый на общее число трасс. Оба слагаемых суммируются по стратегиям в единицу, поэтому выпуклая смесь автоматически остаётся распределением — отдельная нормализация не нужна.'
  kind: cloze
  template: new_probs[s] = (1 - learning_rate) * old_probs[s] + learning_rate * ___
  answer: share[s]
  accept:
    - counts[s] / total
    - counts[s]/total
    - share[s]
    - shares[s]
    - доля стратегии s в наборе
    - count[s] / total
  id: 018-finetune-1
  fingerprint: 48b90ee4
- concept: learning_rate задаёт длину шага между старым распределением и составом отобранного набора
  question: Старая вероятность стратегии 0.2, её доля в отобранном наборе 0.7, learning_rate = 0.5. Чему равна новая вероятность?
  explanation: 0.5×0.2 + 0.5×0.7 = 0.45 — середина между прежним значением и составом набора. При learning_rate = 0 вероятность не меняется вовсе, при 1 полностью заменяется долей из набора. Промежуточные значения сглаживают шум одного раунда сэмплирования.
  kind: numeric
  answer: 0.45
  tolerance: 0.001
  id: 018-finetune-2
  fingerprint: 84992cb7
- concept: стратегия, отсутствующая в отобранном наборе, получает долю ноль, а не выпадает из распределения
  question: Ни одна трасса ошибочной стратегии не прошла отбор. Как её обрабатывать при обновлении вероятностей?
  explanation: 'Пропуск стратегии ломает сумму, равную единице, и роняет код на отсутствующем ключе в следующем раунде. С долей 0 обновление даёт (1−learning_rate)×старая вероятность: стратегия затухает постепенно и может вернуться, если в будущем раунде даст удачную трассу. Отдельный край — пустой набор: делить не на что, прежние вероятности возвращаются без изменений.'
  kind: choice
  options:
    - Убрать стратегию из распределения — её больше нет
    - 'Подставить ей долю 0 и обновить как остальные: вероятность уменьшится, но останется в распределении'
    - Оставить её старую вероятность без изменений
    - Разделить её вероятность между остальными стратегиями поровну
  correct: 1
  id: 018-finetune-3
