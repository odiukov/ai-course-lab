- concept: shortcut-стратегия закрепляется обучением пропорционально своей случайной точности
  question: В симуляции STaR модель порождает 640 обоснований по «ленивой» стратегии, срезающей часть рассуждения. Такая стратегия выдаёт верный финальный ответ в 25% случаев. Сколько ленивых обоснований в среднем пройдёт отбор по ответу и попадёт в обучающую пачку?
  explanation: 'Отбор смотрит только на итог, поэтому ленивое обоснование проходит ровно с вероятностью своей случайной точности: 640 × 0.25 = 160. Эти 160 примеров дообучат модель делать срез угла чаще.'
  kind: numeric
  answer: 160
  tolerance: 2
  id: 005-strategy-mixture-1
  fingerprint: f22bf335
- concept: верификатор на выводе не удаляет срез угла, уже впечатанный в веса при дообучении
  question: К обученной по STaR модели приделали верификатор, который на выводе отбраковывает подозрительные решения. Что он не может сделать?
  explanation: 'Верификатор действует после генерации: он фильтрует выход, а не переучивает модель. Срез угла, попавший в обучающую пачку, остаётся в распределении, из которого модель сэмплирует, — судья на выходе лишь чаще отклоняет его результат.'
  kind: choice
  options:
    - Убрать из весов склонность к срезу угла, закреплённую дообучением на прошедших фильтр ленивых следах
    - Отсеять часть неверных ответов при генерации нескольких кандидатов
    - Переранжировать кандидатов и поднять качество финального выбора
    - Снизить долю выдаваемых наружу решений с неверным итогом
  correct: 0
