- concept: верный финальный ответ не свидетельствует о качестве пути решения и о его переносе на новые примеры
  question: Точность модели по раундам бутстрапа растёт. Объясни, почему это ещё не доказывает, что модель научилась правильному способу решения.
  explanation: Именно это смещение — обоснование остаётся, если совпал итог, независимо от здравости рассуждения — мотивирует надстройки вроде обучаемого верификатора.
  kind: open
  reference: 'Отбор смотрит на итог, а не на путь. Модель — смесь стратегий: честная (полное рассуждение, хорошо переносится на новые примеры), ошибочная (обычно даёт неверный итог и отсеивается) и shortcut-стратегия, которая пропускает часть работы, но угадывает верный ответ с заметной вероятностью. Успешные shortcut-следы проходят фильтр и закрепляются дообучением наравне с честными. Поэтому суммарная точность на знакомом распределении задач может расти, тогда как доля решений, полученных срезом угла, тоже растёт; провал вскроется на задачах, где выученный шаблон не срабатывает.'
  id: 005-strategy-mixture-3
