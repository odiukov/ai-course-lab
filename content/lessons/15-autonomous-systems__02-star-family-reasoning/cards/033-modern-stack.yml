- concept: выбранная проверка задаёт целевую функцию цикла, поэтому её замена переопределяет, что система будет улучшать
  question: В работающем цикле самоулучшения сверку с эталонным ответом заменили на прохождение набора юнит-тестов, остальные части оставили без изменений. Что произошло с системой?
  explanation: 'Проверка — не наблюдатель, а источник обучающего сигнала: в обучающий набор попадает ровно то, что она принимает. Поэтому судья определяет целевую функцию, и любые его дыры со временем становятся стратегией генератора.'
  kind: choice
  options:
    - Изменилось само определение успеха, поэтому цикл начнёт улучшать прохождение этих тестов — включая способы удовлетворить их, не решая задачу
    - Изменилась только скорость оценки, оптимизируемая цель осталась прежней
    - 'Ничего не изменилось: проверка влияет на отчётность, но не на обучение'
    - Цикл перестанет обучаться, поскольку тесты не дают градиента
