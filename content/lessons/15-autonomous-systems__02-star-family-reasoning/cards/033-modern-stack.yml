- concept: паттерн самоулучшения переносится только в домены, где успех попытки проверяется автоматически и дёшево
  question: Какое свойство предметной области решает, можно ли вообще построить в ней цикл самоулучшения такого рода?
  explanation: Генерация кандидатов дёшева почти везде, узкое место — проверка. Поэтому применимость паттерна определяется наличием дешёвого автоматического судьи, а не мощностью генератора.
  kind: open
  reference: 'Нужна проверка, которую можно применить к каждой попытке автоматически, дёшево и без участия человека: сверка с известным ответом, запуск программы на тестах, измеримая метрика оценщика. Именно она превращает поток сгенерированных попыток в обучающий сигнал. Там, где успех определяется дорого, медленно или субъективно — вкус текста, полезность продуктового решения — цикл упирается в пропускную способность проверяющего и перестаёт масштабироваться так же, как масштабируется генерация. В таких доменах приходится либо строить обучаемый суррогат судьи, наследующий его ошибки, либо ограничивать цикл проверяемым подмножеством задач.'
