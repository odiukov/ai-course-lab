  fingerprint: 6354c7ee
- concept: поиск лучшего по внешнему критерию хранит пару «значение критерия + сам элемент» и возвращает элемент, а не значение критерия
  question: Почему при реализации отбора лучшей трассы недостаточно хранить только текущую максимальную оценку верификатора, и что функция должна вернуть вызывающему коду?
  explanation: 'Это обычный argmax: критерий сравнения и возвращаемое значение — разные сущности. Верификатор в V-STaR нужен как ранжировщик, и результат ранжирования — выбранное решение, а не его балл.'
  kind: open
  reference: 'Оценка — это число, по которому идёт сравнение, но нужен сам объект, набравший это число. Если хранить только максимум, к концу прохода известно значение лучшей оценки и неизвестно, какая трасса его дала. Поэтому в цикле обновляют пару: лучшую оценку и соответствующую ей трассу. Возвращается именно трасса-победитель — текст решения, который пойдёт дальше по конвейеру. Не число-оценка (её вызывающий код не может использовать как ответ) и не список всех кандидатов (тогда отбор не выполнен). Отдельно оговаривают пустой вход: возвращать нечего, поэтому либо None, либо ошибка — по контракту заготовки.'
  id: 025-vstar-select-3
  fingerprint: 84b0a737
