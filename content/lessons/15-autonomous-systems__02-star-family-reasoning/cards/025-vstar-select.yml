- concept: строгость оператора сравнения при линейном поиске максимума решает, какой из кандидатов с одинаковой оценкой станет победителем
  question: 'Функция отбора идёт по кандидатам слева направо и хранит лучший результат. Оценки верификатора: 0.50, 0.50, 0.34. По контракту при равных оценках побеждает ПЕРВЫЙ из максимумов. Какой оператор должен стоять в условии?'
  explanation: Строгое `>` не срабатывает на равенстве, поэтому второй кандидат с 0.50 не вытеснит первого — победит трасса с индексом 0. Нестрогое `>=` заменяло бы лидера на каждом равном значении и оставило бы последнего из максимумов. Кандидат с 0.34 не проходит ни при каком варианте.
  kind: cloze
  template: |-
    if score ___ best_score:
        best_score, best_trace = score, trace
  answer: '>'
  accept:
    - '>'
    - '&gt;'
