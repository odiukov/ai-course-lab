- concept: рационализация возможна только там, где эталонный ответ уже известен, поэтому она недоступна на неразмеченных и тестовых задачах
  question: На каких задачах приём рационализации применить нельзя в принципе?
  explanation: 'Рационализация подставляет верный ответ как условие генерации. Без метки условия нет. Отсюда и границы приёма: он расширяет обучающий набор на размеченном корпусе, но не даёт ничего ни при работе на новых данных, ни при измерении качества.'
  kind: choice
  options:
    - На задачах, где модель уже отвечает верно с первой попытки
    - На задачах без эталонного ответа — на неразмеченных данных и на тестовой выборке, потому что подсказывать нечего
    - На задачах, где рассуждение получается длиннее нескольких шагов
    - На задачах, которые модель решает с очень низкой вероятностью
  correct: 1
  id: 014-rationalization-1
  fingerprint: 9731c95b
- concept: 'метка ответа используется в цикле двумя разными способами: как критерий приёма трассы и как входное условие повторной генерации'
  question: Эталонный ответ задачи участвует в цикле bootstrap дважды и по-разному. Объясни своими словами, в каких двух ролях он выступает и почему вторая роль не требует человеческой разметки рассуждений.
  explanation: 'Разделение ролей объясняет, почему рационализация ничего не стоит в терминах разметки: обе роли обслуживаются одной и той же короткой меткой, которая в обучающем корпусе уже есть.'
  kind: open
  reference: 'Первая роль — критерий: сгенерированная трасса принимается, если её итоговый ответ совпал с меткой; метка работает как дешёвый внешний проверяющий. Вторая роль — условие генерации: при провале метка подаётся модели как подсказка, и модель сама пишет рассуждение, ведущее к этому ответу. Во второй роли человек по-прежнему поставляет только короткий финальный ответ; текст обоснования по-прежнему производит модель. Именно поэтому приём масштабируется — он не добавляет ручной разметки обоснований, только переиспользует уже имеющуюся метку.'
  id: 014-rationalization-2
  fingerprint: 926cf4b7
