- concept: в обучающий набор идёт заново сгенерированная трасса, а не исходная неудачная попытка той же задачи
  question: Задача была решена неверно, затем рационализована с подсказкой эталонного ответа, и новая трасса прошла проверку. Какая именно трасса попадает в дообучающий набор и почему не обе?
  explanation: 'Ключ — направление зависимости: эталонный ответ входит как условие генерации, а результатом становится новая пара (обоснование, ответ). Старая попытка нужна была лишь как сигнал «эта задача пустая, нужен второй шанс».'
  kind: open
  reference: 'Попадает только новая трасса, построенная при известном эталонном ответе. Исходная неудачная попытка не используется вовсе: дообучение здесь — обычное обучение с максимизацией правдоподобия на показанных примерах, любой добавленный текст модель учится воспроизводить. Добавить ошибочную трассу значило бы прямо усиливать неверный ход рассуждения; никакого механизма «учиться от противного» в этом цикле нет. Исходная задача при этом не меняется — меняется только то, какое обоснование к ней приложено.'
  id: 015-rationalize-2
  fingerprint: '996760e9'
- concept: 'бутстрап усиливает уже имеющуюся способность: относительный прирост может быть большим при малом абсолютном и слабой итоговой модели'
  question: Базовая модель решает 4.0% задач бенчмарка. После нескольких раундов самообучения на отобранных трассах она решает 7.2%. Каков абсолютный прирост в процентных пунктах?
  explanation: '7.2 − 4.0 = 3.2 п.п., при этом относительно точность выросла на 80%. Такие пары чисел типичны для STaR (в исходной статье GPT-J на GSM8K: 5,8% → 10,7%). Относительная цифра выглядит эффектно, но абсолютный уровень остаётся низким: цикл вытягивает и закрепляет то, что модель уже иногда умеет, а не создаёт новую способность.'
  kind: numeric
  answer: 3.2
  tolerance: 0.05
  id: 015-rationalize-3
