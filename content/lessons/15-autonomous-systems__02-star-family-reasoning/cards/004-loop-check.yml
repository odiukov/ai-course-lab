- concept: 'фильтр по итоговому ответу даёт ошибки обоих родов: ложные принятия и ложные отбрасывания'
  question: Отбор следов по совпадению финального ответа — какого рода ошибки он допускает?
  explanation: 'Сигнал наблюдает один бит — совпал итог или нет. Отсюда ложные принятия (угадал/скомпенсировал ошибку) и ложные отбрасывания (верный ход, арифметический сбой в конце). Первые вредны сильнее: они попадают в веса.'
  kind: choice
  options:
    - И принимает следы с неверным рассуждением и случайно верным ответом, и отбрасывает здравые рассуждения с ошибкой в последнем шаге
    - 'Только принимает лишнее: здравый след с неверным ответом всё равно сохраняется'
    - 'Только отбрасывает лишнее: неверное рассуждение никогда не даст верный ответ'
    - 'Никаких: совпадение ответа однозначно определяет корректность рассуждения'
  correct: 0
  id: 004-loop-check-1
  fingerprint: aa37a4c3
- concept: V-STaR добавляет обучаемый верификатор поверх отбора по ответу
  question: Чем V-STaR (Hosseini et al., 2024) дополняет базовый цикл STaR?
  explanation: V-STaR учит верификатор (в том числе на отбракованных попытках) и использует его как более информативный сигнал, чем совпадение финального ответа. Обоснования на каждом токене — это уже Quiet-STaR.
  kind: choice
  options:
    - Обучаемым верификатором, оценивающим сами решения, а не только совпадение ответа
    - Человеческой разметкой каждого промежуточного шага рассуждения
    - Отказом от дообучения в пользу подбора промптов
    - Генерацией обоснований на каждом токене вместо конца ответа
  correct: 0
  id: 004-loop-check-2
  fingerprint: 1ef2a6c8
