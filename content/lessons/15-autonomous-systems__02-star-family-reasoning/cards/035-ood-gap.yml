- concept: корректный внешний набор меняет поверхностные признаки, сохраняя требуемое правило решения, иначе падение точности не диагностирует срез угла
  question: Какой отложенный набор годится для проверки того, что модель усвоила способ решения, а не подсказку обучающих примеров?
  explanation: 'Случайное отщепление сохраняет ту же поверхностную структуру и поэтому не ломает срез угла. Набор с другим правилом решения тоже бесполезен: падение объяснится сложностью, а не выученной подсказкой. Диагностика работает, когда меняются декорации, а требуемое рассуждение — нет.'
  kind: choice
  options:
    - Тот, где формулировки, привычные подсказки и сочетания признаков изменены, но требуемое правило решения остаётся прежним
