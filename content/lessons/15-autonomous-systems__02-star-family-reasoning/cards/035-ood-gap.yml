- concept: внешний набор перестаёт быть внешним, если по нему выбирают прогон, гиперпараметры или момент остановки
  question: Команда прогоняет отложенный внешний набор после каждой итерации бутстрапа и оставляет ту версию модели, у которой на нём результат лучше. Чем это плохо?
  explanation: 'Утечка происходит не только через градиенты, но и через выбор: многократный отбор по одному набору подстраивает под него итоговую систему. Чтобы оценка сохраняла смысл, набор должен оставаться неиспользованным ни для дообучения, ни для выбора версии.'
  kind: choice
  options:
    - Набор становится частью процедуры отбора, поэтому постепенно превращается во второй обучающий набор и перестаёт измерять перенос
    - 'Ничем: набор не используется для вычисления градиентов, значит остаётся честным'
    - Плохо только тем, что оценка занимает дополнительное время между итерациями
    - Плохо тем, что внешний набор меньше обучающего и потому даёт смещённую оценку
