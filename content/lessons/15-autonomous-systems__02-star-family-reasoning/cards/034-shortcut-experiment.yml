- concept: фиксация начального состояния генератора случайных чисел и изменение ровно одного параметра — условие атрибуции разницы между прогонами
  question: Зачем в сравнительном эксперименте с симулятором фиксируют начальное состояние генератора случайных чисел и меняют ровно один параметр?
  explanation: Общее начальное состояние делает случайную составляющую одинаковой в обоих прогонах, а единственное различие в настройках — единственным кандидатом на объяснение расхождения. Фиксация seed не повышает качество и не ускоряет счёт, она обеспечивает сопоставимость.
  kind: choice
  options:
    - Чтобы наблюдаемая разница между прогонами могла объясняться только изменённым параметром, а не другой последовательностью случайных чисел
    - Чтобы точность обоих прогонов гарантированно оказалась выше, чем при случайной инициализации
    - Чтобы уменьшить дисперсию оценки внутри каждого отдельного прогона
    - Чтобы прогоны выполнялись быстрее за счёт кеширования случайных чисел
