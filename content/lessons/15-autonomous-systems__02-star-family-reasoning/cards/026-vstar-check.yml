  question: Систему переводят в режим одного-единственного сэмпла на задачу. Что произойдёт с двумя источниками прироста?
  explanation: 'Ранжировщику нужно из чего выбирать: при N=1 отбор вырождается и его вклад обнуляется. Дообучение же изменило сами веса генератора, поэтому качество единственного сэмпла остаётся выше. Этот тест — простой способ отделить два вмешательства.'
