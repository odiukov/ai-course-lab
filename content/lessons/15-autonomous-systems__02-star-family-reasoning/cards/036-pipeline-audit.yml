- concept: асимметрия стоимости и обратимости ставит аудит пайплайна перед запуском обучения, а не после него
  question: Почему проверку пайплайна самообучаемого рассуждения по чек-листу проводят до запуска обучения, а не после получения результатов?
  explanation: 'Асимметрия в цене ошибки: дефект отбора трасс, обнаруженный после дообучения, означает потраченные вычисления и модель, обученную на плохих данных. Стоимость же самой проверки несопоставимо мала, поэтому она ставится первой.'
  kind: choice
  options:
    - Проверка стоит десятки минут, а запуск — часы вычислений и изменённые обучением веса; постфактум дефект пайплайна уже оплачен и частично впечатан в модель
    - 'После обучения чек-лист нельзя применить технически: артефакты запуска перезаписывают конфигурацию'
    - До запуска доступно больше метрик, чем после
    - Порядок не важен, это лишь принятое соглашение об оформлении отчётности
  correct: 0
  id: 036-pipeline-audit-1
  fingerprint: e96de8e3
- concept: аудит требует наблюдаемого свидетельства для каждого рискованного места пайплайна, а не заявленных намерений авторов
  question: Какие наблюдаемые свидетельства стоит потребовать при аудите предлагаемого цикла самообучения на порождённых обоснованиях?
  explanation: Аудит отличается от обсуждения именно требованием артефактов. Заявленное намерение проверить обобщение и существующий отложенный набор с зафиксированным протоколом использования — разные вещи.
  kind: open
  reference: Конкретные примеры принятых и отклонённых трасс, чтобы видеть, что именно проходит фильтр. Явное разделение данных обучения и оценки с описанием, откуда берётся каждая часть. Внешний отложенный набор, не участвующий ни в дообучении, ни в выборе версии. Правило остановки цикла, сформулированное заранее. Сохранённая контрольная точка исходной модели, позволяющая откатиться. Плюс критерий, по которому запуск признаётся неудачным. Ключевое требование — каждое из этих мест должно подтверждаться артефактом, который можно посмотреть, а не утверждением, что об этом подумали.
  id: 036-pipeline-audit-2
  fingerprint: cc4e2b68
- concept: ручной просмотр небольшой выборки принятых и отклонённых трасс до запуска показывает, что реально закрепляет фильтр
  question: Перед дорогим запуском инженер вручную читает несколько десятков трасс, которые фильтр принял, и несколько отклонённых. Что даёт эта дешёвая процедура?
  explanation: 'Агрегированная доля принятых трасс не различает пути решения, а чтение выборки различает. Это не замена внешней оценке и не прогноз точности: процедура отвечает на вопрос, что именно попадёт в обучающий набор.'
  kind: choice
  options:
    - 'Она показывает, какое поведение фильтр фактически закрепляет: среди принятых могут оказаться трассы с неверными промежуточными шагами и случайно совпавшим ответом'
    - Она оценивает итоговую точность будущей модели с точностью до нескольких пунктов
    - Она заменяет отложенный внешний набор, поскольку человек видит качество рассуждения напрямую
    - Она нужна лишь для оформления отчёта и не влияет на решение о запуске
  correct: 0
  id: 036-pipeline-audit-3
  fingerprint: 16b785e7
