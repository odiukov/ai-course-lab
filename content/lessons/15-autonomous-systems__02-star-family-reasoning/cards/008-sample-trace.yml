- concept: исход попытки — бросок Бернулли с вероятностью успеха, взятой по выбранной стратегии
  question: Стратегия уже выбрана и лежит в `strategy`. Словарь `ACCURACY` хранит вероятность верного ответа для каждой стратегии. Дополни розыгрыш исхода одной попытки.
  explanation: 'Точность стратегии — вероятность успеха отдельной попытки, а не готовая метка. Сравнение равномерного числа с этой вероятностью даёт нужный бросок Бернулли: стратегия с точностью 0,85 верна примерно в 85 попытках из 100.'
  kind: cloze
  template: |-
    strategy = pick_strategy(rng)
    correct = rng.random() < ___
  answer: ACCURACY[strategy]
  accept:
    - ACCURACY[strategy]
    - accuracy[strategy]
    - ACCURACY.get(strategy)
    - ACCURACY[ strategy ]
  id: 008-sample-trace-1
  fingerprint: '647585e7'
- concept: поток псевдослучайного генератора определяется числом и порядком обращений к нему
  question: Тест запускает симуляцию с генератором, инициализированным фиксированным seed, и сверяет всю последовательность трасс с эталоном. Разработчик добавил внутрь функции один лишний вызов `rng.random()`, результат которого нигде не используется. Что произойдёт?
  explanation: Генератор с фиксированным seed выдаёт детерминированную последовательность. Каждое обращение сдвигает позицию в ней, поэтому лишний бросок смещает все следующие решения, даже если сам результат отброшен.
  kind: choice
  options:
    - 'Ничего: неиспользованное значение на результат не влияет'
    - Сдвинется весь дальнейший поток генератора, и последующие трассы разойдутся с эталоном
    - Изменится только первая трасса, дальше последовательность выровняется
  correct: 1
