- concept: исход попытки без метки породившей его стратегии не позволяет атрибутировать успех
  question: Функция сэмплирования трассы может вернуть только флаг правильности, а может вернуть флаг вместе с выбранной стратегией. Зачем нужен второй вариант?
  explanation: Отбор идёт по ответу, а вопрос исследования — что именно проходит фильтр. Ответ на него даёт только статистика по стратегиям в отобранном наборе, поэтому метку нужно сохранять рядом с исходом.
  kind: choice
  options:
    - Флаг правильности сам по себе не показывает, какая стратегия породила успешный пример, — без метки нельзя измерить долю срезов угла среди отобранных трасс
    - Метка стратегии нужна, чтобы повысить точность самой стратегии
    - Метка стратегии заменяет проверку ответа при отборе примеров
  correct: 0
  id: 008-sample-trace-3
  fingerprint: 6848a55c
