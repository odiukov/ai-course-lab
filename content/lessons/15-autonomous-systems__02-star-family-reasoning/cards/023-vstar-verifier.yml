  question: Верификатор обучают через Direct Preference Optimization. Какой сигнал он получает на одном обучающем примере?
  explanation: 'DPO работает на предпочтениях внутри пары. Абсолютных оценок никто не размечает: их и неоткуда взять, метка есть только по итоговому ответу. Из множества сравнений верификатор выводит оценки, годные для ранжирования кандидатов.'
