- concept: отбор возвращает новую коллекцию в исходном порядке и не изменяет входные данные
  question: Функция отбора трасс по совпадению ответа удаляет неподошедшие элементы из переданного списка на месте и возвращает его же. Почему это плохо в цикле bootstrap?
  explanation: 'Сырая пачка сэмплов нужна для диагностики: сколько попыток прошло, как распределены стратегии среди отброшенных. Мутация входа стирает эти данные. Сохранение исходного порядка в новом списке даёт вдобавок воспроизводимость проверок.'
  kind: choice
  options:
    - Потому что отбор обязан сортировать трассы по качеству рассуждения
    - 'Потому что исходная пачка сэмплов уничтожается: посчитать долю прошедших, сравнить раунды или применить другой критерий уже нельзя'
    - Потому что список нельзя менять на месте ни в одной программе
    - Потому что порядок трасс влияет на итоговый ответ модели
