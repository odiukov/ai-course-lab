- concept: порядок операций отбора трасс по итоговому ответу
  question: Расставь шаги реализации отбора трасс по эталонному ответу в правильном порядке.
  explanation: 'Отбор — один проход с одним условием допуска. Никакой оценки текста рассуждения в этой последовательности нет: критерий целиком в поле ответа.'
  kind: order
  items:
    - Создать пустую коллекцию для результата
    - Пройти трассы во входном порядке
    - Сравнить поле итогового ответа трассы с эталонной меткой точным равенством
    - Добавить трассу в результат, если равенство выполнено
    - Вернуть собранную коллекцию, не изменив входную
