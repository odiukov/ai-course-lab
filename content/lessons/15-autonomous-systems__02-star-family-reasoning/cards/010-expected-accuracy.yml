- concept: ожидаемое значение вычисляется одним проходом с накоплением произведений вес×значение
  question: Расставь шаги функции, которая по таблице вероятностей выбора стратегий и таблице их точностей возвращает ожидаемую точность.
  explanation: 'Каждая стратегия влияет на итог ровно настолько, насколько часто выбирается. Накопитель обходится без сортировок и промежуточных округлений: один проход по таблице даёт точное значение.'
  kind: order
  items:
    - Завести накопитель и присвоить ему ноль
    - Перебрать стратегии по одной
    - Для текущей стратегии взять её вероятность выбора и её точность
    - Прибавить к накопителю произведение этих двух чисел
    - После перебора всех стратегий вернуть накопитель
  id: 010-expected-accuracy-1
  fingerprint: 4e94fdc8
- concept: аналитическое ожидание не имеет дисперсии, а оценка тем же числом через симуляцию шумит
  question: Ожидаемую точность смеси стратегий можно посчитать формулой, а можно оценить, прогнав 500 случайных попыток и посчитав долю верных. Чем аналитический расчёт лучше как контрольная цифра для тестов?
  explanation: Оценка по выборке — случайная величина; её разброс убывает лишь как корень из числа проб, так что 500 попыток дадут заметный шум. Формула возвращает само ожидание, поэтому годится как эталон, с которым сверяют шумящую симуляцию.
  kind: choice
  options:
    - Он учитывает редкие стратегии, а симуляция их полностью игнорирует
    - При неизменных параметрах он всегда даёт одно и то же число, тогда как доля верных в серии прыгает от запуска к запуску
    - Он даёт большее значение, поэтому проверки проходят надёжнее
  correct: 1
  id: 010-expected-accuracy-2
  fingerprint: 5793761f
