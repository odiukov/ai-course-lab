- concept: стратегия — латентная переменная, наблюдаемы только текст трассы и итоговый ответ
  question: Объясни своими словами, чем стратегия решения отличается от трассы рассуждения с точки зрения того, что доступно наблюдателю и обучающему конвейеру.
  explanation: 'Разделение важно: стратегия задаёт характер трассы и её шанс на успех, но обучающий набор состоит из наблюдаемых трасс, а не из ярлыков стратегий.'
  kind: open
  reference: 'Стратегия — скрытая (латентная) переменная: способ действия, который выбирается внутри и наружу не выводится. Трасса — наблюдаемый артефакт: последовательность шагов от условия к ответу. Конвейер обучения работает только с наблюдаемым — с текстом трассы и с ответом; какая именно стратегия её породила, он не видит и вынужден судить косвенно. В симуляторе стратегия хранится явно только потому, что мы её сами и генерируем.'
  id: 007-trace-sampling-2
  fingerprint: 5b405a53
