- concept: мысль обусловлена текущим префиксом, поэтому на каждой позиции строится новая, а не переиспользуется одна на всё предложение
  question: Почему при таком подходе нельзя породить одну мысль на всё предложение и пользоваться ею при предсказании всех оставшихся токенов?
  explanation: 'Ключ — обусловленность контекстом. Локальная мысль отвечает на вопрос «что дальше именно здесь», и её ценность падает, как только контекст сдвинулся. Побочный эффект: длина мысли может различаться по позициям — у трудных токенов она длиннее.'
  kind: open
  reference: 'Мысль порождается по уже прочитанному префиксу и полезна ровно для следующего шага. Как только очередной токен добавлен, префикс изменился: часть неопределённости снята, впереди другой выбор. Поэтому Quiet-STaR строит новое короткое обоснование на каждой позиции, а не переиспользует старое; заранее написанная общая мысль не учитывает токены, появившиеся после неё.'
  id: 027-quiet-token-thoughts-3
