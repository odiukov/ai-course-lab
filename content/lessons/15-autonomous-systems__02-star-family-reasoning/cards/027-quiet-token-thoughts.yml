- concept: внутреннее обоснование остаётся скрытым и не попадает в наблюдаемый выход модели
  question: Что видит пользователь в выходе модели, обученной по Quiet-STaR?
  explanation: 'Отсюда и «quiet»: мысль — служебная последовательность, влияющая на распределение следующего токена. Наружу идёт обычный текст, поэтому приём не меняет формат выхода модели.'
  kind: choice
  options:
    - Только продолжение текста; внутренние мысли влияют на предсказание, но не печатаются
    - Продолжение текста вместе с мыслью, помеченной служебными скобками
    - Только последнюю мысль, а сам текст восстанавливается из неё отдельным проходом
