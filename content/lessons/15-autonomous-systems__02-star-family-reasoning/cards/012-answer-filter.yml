- concept: 'бутстрап итеративен: каждый раунд сэмплирует заново уже дообученной моделью'
  question: Расставь по порядку один раунд цикла самообучения на собственных обоснованиях.
  explanation: 'Ключ в последнем пункте: следующий раунд сэмплирует не исходная модель, а улучшенная, поэтому доля задач, где ответ совпадает, растёт, и набор для дообучения расширяется от раунда к раунду.'
  kind: order
  items:
    - Насэмплировать текущей моделью обоснование и ответ на каждую задачу
    - Сравнить полученный ответ с известной меткой задачи
    - Оставить тройки (задача, обоснование, ответ) там, где ответ совпал
    - Дообучить модель на оставленном наборе
    - Начать следующий раунд сэмплированием уже дообученной моделью
  id: 012-answer-filter-3
