- concept: обоснование, построенное при уже известном ответе, может быть подогнано и не отражать выводимый путь
  question: Обоснования, полученные рационализацией (модель видела правильный ответ заранее), добавляют в тот же обучающий набор, что и обычные. В чём здесь риск?
  explanation: 'Рационализация — обмен: она даёт примеры там, где их не было ноль, ценой примеси объяснений, написанных с подглядыванием в конец учебника.'
  kind: open
  reference: 'Когда ответ известен заранее, модель может подогнать объяснение под него задним числом: текст выглядит как вывод, хотя на деле реконструирует уже готовый результат. Такое обоснование не обязано быть путём, по которому можно прийти к ответу, не зная его. Обучаясь на подогнанных объяснениях, модель перенимает жанр правдоподобного оправдания, а не процедуру вывода, — и на новых задачах, где ответ не подсказан, это не работает.'
