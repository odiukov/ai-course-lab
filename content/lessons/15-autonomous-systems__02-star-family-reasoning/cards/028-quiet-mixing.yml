- concept: токен конца мысли — граница между скрытой цепочкой и предсказанием, а не утверждение о корректности мысли
  question: Какую роль играет специальная отметка конца мысли?
  explanation: 'Это техническая разметка последовательности: модель должна знать, где кончается внутренний черновик и начинается работа над видимым продолжением. Оценка полезности мысли приходит позже и совсем из другого места — из веса смешивания, обученного по правдоподобию настоящего токена.'
  kind: choice
  options:
    - 'Отмечает границу: скрытая цепочка завершена, дальше её содержимое используется для предсказания следующего токена'
    - Сигнализирует, что мысль признана верной и её можно применять
    - Указывает, что модель не смогла построить полезную мысль и переходит к базовому пути
