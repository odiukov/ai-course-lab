- concept: сигналом для обучения смешивания служит то, насколько мысль улучшила предсказание реально наблюдаемого следующего токена
  question: Что заставляет модель повысить доверие к скрытой мысли в определённом контексте?
  explanation: Никакой оценки «мысль верна» в цикле нет — есть настоящий следующий токен из корпуса. Если вариант после размышления присваивает ему более высокую вероятность, обучение сдвигает вес смешивания в сторону мысли; если мешает — обратно к быстрому базовому пути. Это и означает «выучить, когда думать».
  kind: choice
  options:
    - Мысль улучшила предсказание фактически наблюдаемого следующего токена в этом контексте
    - Отдельный верификатор оценил мысль как логически корректную
    - Мысль оказалась длиннее и подробнее обычной
  correct: 0
