- concept: 'отбор по оценке верификатора — не голосование большинства: одиночный кандидат может победить повторяющийся ответ'
  question: 'Генератор выдал 16 кандидатов: 11 из них сошлись на одном и том же неверном ответе, один содержит корректное решение, остальные разнородны. Что может сделать отбор верификатором и чего не сделает голосование большинства?'
  explanation: Голосование считает частоту ответов и потому усиливает систематическую ошибку генератора. Верификатор присваивает оценку каждой трассе, поэтому единственный хороший кандидат может выиграть — хотя гарантии этого нет, судья ранжирует по выученным признакам, а не по истине.
  kind: choice
  options:
    - Оба метода выберут ответ, встретившийся чаще всего
    - Верификатор может поставить одиночное корректное решение выше повторяющегося неверного, так как оценивает трассы, а не считает совпадения ответов
    - Верификатор всегда выбирает самого редкого кандидата
  correct: 1
  id: 024-best-of-n-1
  fingerprint: 5b2d969d
- concept: 'качество Best-of-N ограничено двумя независимыми факторами: покрытием генератора и точностью ранжирования'
  question: Best-of-N выдал неверный ответ. Какие два принципиально разных источника этой ошибки нужно различать?
  explanation: 'Отбор не создаёт решений: он умеет только выбирать из порождённого. Отсюда две отдельные метрики — доля задач, где верное решение вообще встречается среди N кандидатов, и доля случаев, где судья его действительно выбирает. Рост N лечит только первую.'
  kind: choice
  options:
    - Либо среди N кандидатов не было верного решения, либо оно было, но верификатор поставил выше другое
    - Либо N слишком велико, либо верификатор обучался слишком долго
    - Либо метки задач были неверны, либо генератор сэмплировал без температуры
  correct: 0
  id: 024-best-of-n-2
  fingerprint: da0eccb5
- concept: основная часть выигрыша V-STaR приходится на отбор во время вывода, а не на дополнительное дообучение генератора
  question: 'Схема с верификатором даёт прирост точности сразу по двум каналам: обучение генератора и отбор среди кандидатов на выводе. Какой канал даёт основной вклад и что это значит для затрат?'
  explanation: 'В работе по V-STaR прирост над базлайнами самоулучшения составил примерно от +4 до +17 процентных пунктов, и большая его часть приписана именно отбору на выводе. Это меняет профиль стоимости: платить приходится за каждый запрос.'
  kind: open
  reference: 'Основной вклад даёт отбор во время вывода: тот же генератор с ранжированием N кандидатов выигрывает больше, чем даёт дополнительное дообучение генератора. Практическое следствие — прирост покупается вычислениями на инференсе (N сэмплов плюс прогон судьи на каждый запрос), а не только разовыми затратами на обучение; отключение верификатора на выводе съедает большую часть выигрыша.'
  id: 024-best-of-n-3
  fingerprint: f2e73cc7
