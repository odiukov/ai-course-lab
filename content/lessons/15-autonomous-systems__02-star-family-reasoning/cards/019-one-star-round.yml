- concept: 'раунд STaR — фиксированная последовательность: сэмплирование по всему набору, отбор, добор рационализацией, единственное дообучение в конце'
  question: Расставь этапы одного раунда STaR в порядке выполнения.
  explanation: 'Рационализация адресна: она нужна только там, где отбор ничего не оставил, поэтому идёт после фильтрации, а не до неё. Дообучение замыкает раунд — новая модель появляется лишь тогда, когда весь набор уже собран.'
  kind: order
  items:
    - текущей моделью насэмплировать обоснование с ответом для каждой задачи набора
    - оставить трассы, чей итоговый ответ совпал с меткой
    - для задач без принятой трассы сгенерировать обоснование при подсказанном верном ответе
    - объединить самостоятельно успешные и рационализованные трассы в один набор
    - дообучить модель на собранном наборе
