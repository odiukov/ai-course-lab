- concept: поверхностное правило обнаруживается только отложенной проверкой вне распределения обучения, а внутри него метрики остаются высокими
  question: Модель выучила поверхностное правило, случайно совпадающее с ответом на обучающем распределении. Какая проверка обнаружит это?
  explanation: Пока корреляция между поверхностным признаком и ответом сохраняется, любая выборка из того же распределения показывает высокую точность — ошибка невидима в протоколе обучения. Нужна намеренно другая выборка, ломающая эту корреляцию; отсюда рекомендация сочетать данные в стиле STaR с отложенной оценкой вне распределения.
  kind: choice
  options:
    - Отложенная оценка на задачах вне распределения обучения, где совпадение правила с ответом разрушено
    - Увеличение доли отложенной валидации, взятой из того же распределения
    - Повторный прогон обучения с другим случайным зерном
