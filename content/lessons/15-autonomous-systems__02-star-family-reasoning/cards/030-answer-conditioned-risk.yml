- concept: все методы семейства опираются на конечный исход как источник обучающего сигнала, поэтому уязвимость к срезам угла у них общая, несмотря на разные формы обучения
  question: Почему риск закрепить поверхностную стратегию не устраняется переходом от отбора трасс к обучению верификатора или к скрытым мыслям на каждом токене?
  explanation: Смысл в том, что уязвимость лежит не в конкретном алгоритме, а в выборе сигнала. Верификатор, обученный на тех же исходных метках, может даже предпочесть уверенно оформленное неверное рассуждение честной неуверенности.
  kind: open
  reference: 'Все три схемы берут сигнал из конечного исхода: STaR оставляет трассы с верным итоговым ответом; верификатор V-STaR обучается на метках «трасса привела к верному ответу или нет»; в Quiet-STaR мысль поощряется тем, что помогла угадать фактическое продолжение. Форма обучения разная — фильтрация, ранжирование, взвешивание, — но источник сигнала один, и он не различает корректный вывод и совпавший с исходом поверхностный приём. Пока подкрепляется результат, а не путь, лазейка сохраняется; закрывают её надзором за промежуточными шагами и оценкой вне распределения.'
