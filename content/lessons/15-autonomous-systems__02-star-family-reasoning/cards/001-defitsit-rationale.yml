- concept: потолок обучения рассуждению на человеческих следах задаёт пропускная способность разметчиков, а не число задач
  question: Команда обучает модель рассуждать на корпусе пошаговых решений, написанных людьми. Задач с известными эталонными ответами у неё сколько угодно, а качественных пошаговых решений мало. Что в первую очередь ограничивает масштаб такого обучения?
  explanation: Ответ можно проверить за секунды, а связное обоснование нужно сначала вывести самому, записать шаги и перечитать на противоречия. Именно поэтому STaR отказывается от человеческих обоснований и оставляет за людьми только финальные ответы.
  kind: choice
  options:
    - Объём человеческого труда на написание и вычитку каждой цепочки рассуждения
    - Количество задач, для которых вообще известен верный ответ
    - Размер контекстного окна модели при дообучении
    - Скорость GPU на этапе градиентного шага
  correct: 0
  id: 001-defitsit-rationale-1
  fingerprint: 84a4d051
- concept: разметка обоснований не масштабируется так же, как разметка коротких ответов
  question: Объясни своими словами, почему сбор пошаговых обоснований дороже и медленнее сбора финальных ответов на те же задачи, и почему наём большего числа разметчиков не решает проблему полностью.
  explanation: 'Асимметрия между дешёвой меткой и дорогим объяснением — исходная мотивация self-taught подходов: они сохраняют дешёвую часть разметки и снимают дорогую.'
  kind: open
  reference: 'Финальный ответ — короткая метка, её можно сверить механически. Обоснование требует, чтобы разметчик сам решил задачу, выстроил промежуточные шаги в связную последовательность и проверил их на противоречия; для сложных доменов нужен эксперт с дорогим временем. Наём людей упирается в компромисс: больше задач на человека — короче и небрежнее обоснования; строгая вычитка — медленный сбор; больше разметчиков — рост расходов и разнобой стиля и уровня детализации. Поэтому качество обоснований не растёт линейно с бюджетом, и нужен способ порождать пригодные рассуждения без ручного написания каждого.'
  id: 001-defitsit-rationale-2
  fingerprint: 12c88412
