- concept: дешёвая проверка по одному символу отбирает длинную последовательность токенов
  question: Почему сравнение одной итоговой строки с эталоном позволяет отфильтровать целый длинный след рассуждения без построчной проверки человеком?
  explanation: 'Это ключевой размен STaR: почти нулевая стоимость проверки взамен точности сигнала. Прокси шумный — сохранённый след может быть верным случайно.'
  kind: open
  reference: Обоснование и ответ сэмплируются одной генерацией, поэтому ответ служит наблюдаемым следствием всего следа. Совпадение с эталоном — дешёвый автоматический прокси-сигнал «этот след привёл куда надо», и по нему вся последовательность целиком принимается в обучающий набор либо целиком отбрасывается. Проверяется результат, не корректность отдельных шагов.
