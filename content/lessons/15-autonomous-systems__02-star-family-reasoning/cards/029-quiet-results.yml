- concept: улучшение сразу на нескольких разнородных наборах без задачных примеров свидетельствует о переносе общего механизма, а не о выучивании формата одного бенчмарка
  question: Почему одновременный прирост на арифметических задачах и на вопросах здравого смысла — при отсутствии задачного дообучения — считают более сильным свидетельством, чем такой же прирост на одном наборе?
  explanation: 'Логика та же, что и в любой проверке обобщения: чем разнороднее наборы, на которых приём работает, тем меньше правдоподобных объяснений через подгонку. Отдельно стоит помнить, что свидетельство о переносе не равно свидетельству о высоком итоговом уровне.'
  kind: open
  reference: 'Один набор можно улучшить подгонкой под его формат, распределение формулировок или типичные шаблоны ответов. Наборы разной природы такого общего шаблона не делят, поэтому одновременное улучшение сложнее объяснить подстройкой под конкретную задачу и естественнее — тем, что модель приобрела общий механизм: вставлять скрытое рассуждение там, где следующий шаг неочевиден. Отсутствие задачных примеров усиливает вывод: перенос произошёл на не виденный при обучении материал.'
