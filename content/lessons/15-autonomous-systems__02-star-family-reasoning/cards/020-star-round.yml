- concept: вызов дообучения стоит после цикла по задачам, а не внутри него
  question: Заполни пропуск так, чтобы раунд STaR обновлял модель ровно один раз.
  explanation: 'Отступ решает всё: строка на уровне цикла превратила бы раунд в цепочку мелких обновлений. Дообучение вне цикла означает, что все трассы раунда порождены одной и той же версией модели.'
  kind: cloze
  template: |-
    training = []
    for task in tasks:
        trace = sample_trace(model, task)
        if trace.answer == task.answer:
            training.append(trace)
        else:
            training.append(rationalize(model, task, task.answer))
    ___
    return new_model
  answer: new_model = finetune(model, training)
  accept:
    - new_model = finetune(model, training)
    - '    new_model = finetune(model, training)'
    - new_model = finetune(model, training=training)
