- concept: сэмплирование из категориального распределения через накопленную сумму весов и одно равномерное число
  question: 'Стратегии имеют веса: honest 0.6, lazy 0.25, flawed 0.15. Функция берёт равномерное число r из [0, 1) и сравнивает его с накопленными границами. Что вернётся при r = 0.72?'
  explanation: 'Накопленные границы: 0.6, затем 0.85, затем 1.0. Число 0.72 лежит между 0.6 и 0.85, то есть в участке lazy. Сравнивать надо именно с накопленной суммой, иначе участки наложатся и вероятности исказятся.'
  kind: choice
  options:
    - lazy
    - honest
    - flawed
    - 'Ничего: 0.72 не попадает ни в один участок'
  correct: 0
  id: 006-pick-strategy-1
  fingerprint: 82c604c5
- concept: условие выбора сравнивает случайное число с накопленной суммой, а не с отдельным весом
  question: Дополни выбор стратегии по весам так, чтобы частоты совпадали с весами.
  explanation: Сравнение с отдельным weight давало бы перекрывающиеся интервалы и завышало вероятность первых стратегий. Накопленная сумма режет отрезок [0, 1) на непересекающиеся участки длиной ровно в вес каждой стратегии.
  kind: cloze
  template: |-
    cumulative = 0.0
    for name, weight in weights.items():
        cumulative += weight
        if r < ___:
            return name
  answer: cumulative
  accept:
    - cumulative
    - cum
    - acc
    - total
  id: 006-pick-strategy-2
  fingerprint: 2a03b126
- concept: веса задают вероятности отдельного независимого сэмпла, а не квоты внутри серии
  question: Стратегия honest имеет вес 0.75. За 8 независимых вызовов функции выбора она выпала 8 раз подряд. Что это означает?
  explanation: Каждый вызов независим, вероятность серии равна 0.75^8 ≈ 0.10 — вполне рядовое событие. Функция не ведёт квот и не помнит прошлых бросков; проверять соответствие весам имеет смысл на десятках тысяч вызовов.
  kind: choice
  options:
    - Обычное отклонение случайной серии; доли сходятся к весам лишь на большом числе вызовов
    - 'Ошибку в накопленных границах: honest не может выпасть 8 раз подряд'
    - Что веса нормализованы неверно и сумма превышает единицу
    - Что функция обязана после этого вернуть другую стратегию для компенсации
  correct: 0
  id: 006-pick-strategy-3
