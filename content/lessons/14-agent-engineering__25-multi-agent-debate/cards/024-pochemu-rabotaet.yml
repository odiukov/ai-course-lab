- concept: голосование улучшает результат только при вероятности ошибки одного участника ниже 1/2; выше этого порога добавление участников ухудшает ансамбль
  question: Каждый из пяти независимых агентов ошибается в 60% случаев. Что даст ответ по большинству голосов?
  explanation: 'C(5,3)·0,6³·0,4² + C(5,4)·0,6⁴·0,4 + 0,6⁵ ≈ 0,3456 + 0,2592 + 0,0778 ≈ 0,683. Голосование усиливает то, что участники делают чаще правильного. Порог — 1/2: ниже него добавление независимых агентов гонит ошибку к нулю, выше — к единице. Поэтому перед сборкой ансамбля надо знать базовую точность одного агента на этих задачах.'
  kind: choice
  options:
    - Ошибку примерно в 68% случаев — хуже, чем один агент
    - Ошибку примерно в 60% случаев — ровно как один агент
    - Ошибку примерно в 35% случаев — вдвое лучше одного агента
    - Ошибку около 8% — голосование всегда снижает риск
