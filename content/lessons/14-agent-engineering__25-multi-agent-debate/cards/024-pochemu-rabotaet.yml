- concept: отказ мажоритарного голосования определяется вероятностью ошибки большинства, а не вероятностью одновременной ошибки всех участников
  question: Семь независимых агентов голосуют большинством. Объясни своими словами, почему вероятность неверного итога больше, чем вероятность того, что ошибутся все семеро.
  explanation: Событие «ошиблись все» вложено в событие «ошиблось большинство», поэтому его вероятность всегда меньше. При p=0,25 и семи агентах все ошибаются с вероятностью 0,25⁷ ≈ 0,00006, а большинство ошибается примерно в 0,0129 — разница на два порядка.
  kind: open
  reference: Одновременная ошибка всех семи — лишь один из исходов провала, его вероятность p⁷. Но большинство неверно уже при четырёх ошибках из семи, и к p⁷ добавляются члены для четырёх, пяти и шести ошибившихся, каждый со своим биномиальным коэффициентом. Поэтому p⁷ — нижняя оценка риска, а не сам риск; путать эти два события значит систематически недооценивать частоту неверных ответов ансамбля.
