- concept: обязательный раунд несогласия как защита от convergence collapse — раннее согласие не считается признаком правильности
  question: Дебатирующие агенты выдали совпадающие ответы уже в первом раунде. Почему опасно останавливать обсуждение на этом месте и что нужно потребовать от агентов вместо остановки?
  explanation: Совпадение ответов измеряет схожесть агентов, а не истинность. Форсированное возражение возвращает в протокол сигнал критики, ради которого дебаты и запускались.
  kind: open
  reference: 'Раннее совпадение чаще означает не правильность, а convergence collapse: агенты подхватили первую озвученную версию, и их ошибки скоррелированы, так что согласие не несёт нового свидетельства. Нужен обязательный раунд несогласия: каждый агент должен атаковать общую версию — найти слабое место, предложить контрпример или назвать условие, при котором вывод ломается. Только если версия переживает такую атаку, согласие становится информативным. Пересмотр позиции при этом остаётся оценкой аргументов, а не обязанностью присоединиться к большинству.'
