- concept: одинаковый промпт у всех участников превращает N вызовов модели в одно мнение в N копиях — независимость даёт различие ролей и моделей, а не различие имён
  question: Запущено шесть агентов с одинаковым системным промптом на одной и той же модели, различаются только имена агентов. Что происходит с дебатами?
  explanation: 'Prompt homogenization. Голосование гасит только независимые ошибки; идентичные инструкции дают скоррелированные ошибки, и большинство просто повторяет общий промах. Лечится содержательным различием: один агент ищет фактические ошибки, другой проверяет допущения, третий строит контрпример, плюс по возможности разные модели.'
  kind: choice
  options:
    - Ответы почти совпадают, кросс-критика ничего не находит, и вы платите за шесть вызовов, получая одно мнение
    - Одинаковый промпт гарантирует сопоставимость позиций и усиливает сигнал голосования
    - 'Разные имена агентов достаточны: сэмплирование само создаёт независимые траектории рассуждения'
    - Ошибки распределяются независимо, поэтому голосование их гасит
  correct: 0
