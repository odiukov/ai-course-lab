- concept: задержка дебатов растёт пропорционально числу раундов, а не числу вызовов, потому что агенты внутри раунда параллельны, а раунды последовательны
  question: 'Одиночный вызов модели занимает 1.2 секунды. Дебаты идут по схеме: 7 агентов, 4 раунда. Какой будет примерная задержка ответа при грамотной реализации и почему?'
  explanation: 'Внутри раунда агенты не зависят друг от друга и идут параллельно, поэтому раунд стоит примерно одного вызова. Но раунд R+1 читает результаты раунда R, значит раунды последовательны: задержка ≈ R × время вызова = 4 × 1.2 ≈ 4.8 с. Отсюда асимметрия: время растёт как R, а деньги — как N×R.'
  kind: choice
  options:
