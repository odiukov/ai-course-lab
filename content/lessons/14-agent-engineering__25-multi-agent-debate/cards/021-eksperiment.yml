- concept: топологию оценивают двумя сопряжёнными метриками — точность при равном бюджете и цена достижения равной точности — а результат привязан к конкретному набору задач
  question: Объясни своими словами, почему одной цифры точности недостаточно для оценки топологии дебатов, и какие две метрики читают вместе. Почему вывод «разреженная топология догнала полный меш на большинстве вопросов» нельзя объявить универсальным результатом?
  explanation: Одиночная цифра точности всегда неявно опирается на выданный бюджет. Отчёт вида «точность при равном бюджете» плюс «бюджет при равной точности» описывает кривую цена/качество, а не одну её точку. И результат «2 из 3» — это замер на данном наборе задач, поэтому важнее вопроса «кто победил» вопрос «на каком типе вопросов разреженная топология проиграла».
  kind: open
  reference: 'Точность и цена связаны: любую топологию можно вытянуть по точности, дав ей больше операций критики. Поэтому читают пару: (1) сколько верных ответов даёт топология при одинаковом бюджете операций критики и (2) сколько операций ей нужно, чтобы достичь одинаковой точности. Отдельно фиксируют раунды до сходимости — это и цена, и диагностика поведения протокола. Вывод не универсален, потому что он получен на конкретном малом наборе задач с конкретным составом типов вопросов (фактический, на правило, на рассуждение) и конкретными агентами: это измеренный компромисс цены и качества на этом наборе, а не свойство топологии. В уроке разреженная топология уступила ровно на одном вопросе из трёх — и важно, какой это тип вопроса; на другом распределении типов задач баланс сместится.'
  id: 021-eksperiment-3
