- concept: честный бюджет дебатов измеряется суммарным числом операций критики, поэтому равный бюджет даёт разреженной топологии больше раундов, чем полному мешу
  question: 'В дебатах участвуют 9 агентов. В полном меше каждый агент за раунд читает и критикует всех остальных 8. В разреженной топологии каждый агент читает ровно 4 соседей. Бюджет фиксирован: 504 операции критики на топологию. Сколько раундов успевает провести разреженная топология, полностью израсходовав бюджет?'
  explanation: 'Полный меш: 9x8 = 72 операции критики за раунд, то есть 504/72 = 7 раундов. Разреженная: 9x4 = 36 за раунд, 504/36 = 14 раундов. Равное число раундов не равно равному бюджету: при одинаковом счёте раундов полный меш незаметно тратит вдвое больше критики. Поэтому бюджет задают в операциях критики, а не в раундах.'
  kind: numeric
  answer: 14
  tolerance: 0.01
  id: 021-eksperiment-1
  fingerprint: 8a85b009
- concept: корректное сравнение топологий требует фиксировать всё, кроме матрицы «кто кого читает»
  question: Вы сравниваете полный меш и разреженную топологию на одном наборе задач и хотите приписать разницу в точности именно способу обмена мнениями. Что должно совпадать у двух прогонов?
  explanation: Это контролируемый эксперимент с одной варьируемой переменной. Если у топологий разные начальные ответы, разные условия остановки или подобранное под каждую число раундов, различие в точности объясняется настройкой, а не структурой связей. Подбор бюджета «под максимум» превращает сравнение топологий в сравнение бюджетов.
  kind: choice
  options:
    - Начальные ответы агентов, их индивидуальные сдвиги мнения, условие остановки и правило выбора итогового ответа — различается только то, кого читает каждый агент
    - Только набор вопросов; число раундов каждой топологии подбирают отдельно, чтобы каждая показала свой максимум
    - Только суммарное время работы в секундах, остальное задаётся случайно при каждом прогоне
    - Только модель и её температура; начальные ответы полезно перегенерировать для каждой топологии заново
  correct: 0
