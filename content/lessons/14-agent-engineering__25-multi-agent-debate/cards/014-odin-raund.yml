- concept: пересмотр позиции — оценка аргументов соседей, а не обязанность присоединиться к большинству
  question: 'Агент в раунде дебатов прочитал соседей: 4 из 5 дают ответ, отличный от его собственного, но их обоснования противоречат условию задачи. Что он должен сделать при пересмотре позиции и почему это не нарушает смысл дебатов?'
  explanation: Дебаты отличаются от голосования именно тем, что агент читает обоснования, а не только итоги. Право сохранить позицию при слабой критике — защита от преждевременной сходимости группы.
  kind: open
  reference: 'Он вправе оставить свой ответ прежним. Пересмотр в дебатах — это проверка чужих доводов, а не подчинение большинству: агент смотрит, появилось ли новое свидетельство, найдена ли ошибка в его рассуждении, выдерживает ли критика условие задачи. Если критика условию противоречит, менять ответ нет оснований. Разрешённые исходы пересмотра — сменить позицию, уточнить её или сохранить. Автоматическое согласие с большинством убило бы сигнал перекрёстной критики и вело бы к сходимости на первом же неверном ответе.'
  id: 014-odin-raund-3
  fingerprint: 3e2b8e46
