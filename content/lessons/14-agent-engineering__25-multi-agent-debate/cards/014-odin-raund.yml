- concept: 'порядок операций внутри одного раунда: снимок позиций, чтение соседей по топологии, подготовка новых версий в буфер, одновременная замена'
  question: Расставьте шаги одного раунда мультиагентных дебатов в правильном порядке.
  explanation: 'Снимок и буфер — два обязательных элемента: снимок гарантирует, что все читают одно и то же состояние, буфер — что никто не публикует обновление посреди раунда. Топология лишь решает, чьи ответы попадут агенту из снимка.'
  kind: order
  items:
    - Зафиксировать текущие ответы всех агентов как неизменяемый снимок раунда
    - Каждому агенту выдать ответы тех соседей, которых разрешает топология связей
    - Каждому агенту проверить чужие доводы и записать свою следующую версию в отдельный буфер, не трогая снимок
    - После того как все версии готовы, одновременно заменить старые позиции содержимым буфера
  id: 014-odin-raund-2
