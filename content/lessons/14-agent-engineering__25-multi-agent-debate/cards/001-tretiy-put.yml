- concept: второй агент ценен независимостью траектории рассуждения, а не большей правильностью
  question: В дебатах второй агент критикует ответ первого. Что даёт этому механизму работать?
  explanation: 'Второй агент не источник истины — он тоже ошибается и может повторить ту же ошибку. Работает независимость: отдельный проход рассуждения не начинается с тех же предположений, поэтому первоначальному ответу приходится выдержать возражение, а не согласие с самим собой.'
  kind: choice
  options:
    - Второй агент точнее первого, поэтому его вердикт считается окончательным
    - Второй агент имеет доступ к внешним источникам, которых нет у первого
    - Второй агент не наследует цепочку рассуждений первого, поэтому его ошибки и акценты могут не совпасть с ошибками автора ответа
    - Второй агент работает при более низкой температуре и потому менее склонен к галлюцинациям
  correct: 2
