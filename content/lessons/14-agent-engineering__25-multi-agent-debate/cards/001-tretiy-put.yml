- concept: дебаты применимы там, где нет внешнего верификатора, потому что не требуют инструмента-оракула
  question: 'Объясни своими словами: почему для задачи вроде «оцени качество архитектурного решения» дебаты подходят лучше, чем CRITIC-подход с внешним инструментом?'
  explanation: Ключ — доступность источника критики. Внешний инструмент даёт более сильный сигнал (объективная проверка), но существует не для каждой задачи. Дебаты дают более слабый, зато универсально доступный сигнал — независимое несогласие.
  kind: open
  reference: 'CRITIC требует инструмента, способного дать объективную обратную связь: интерпретатор проверит код, поиск проверит факт, калькулятор — арифметику. Для оценочной задачи без чёткого верифицируемого ответа такого инструмента просто нет, обращаться некуда. Дебаты не требуют оракула: источник возражения — отдельный запуск модели, который доступен всегда. Взамен теряется гарантия правильности — другой агент не даёт истины, он только даёт независимое возражение, которое ответ обязан выдержать.'
  id: 001-tretiy-put-3
  fingerprint: 55d719de
