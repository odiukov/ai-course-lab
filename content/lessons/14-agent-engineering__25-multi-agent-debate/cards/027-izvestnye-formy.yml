  fingerprint: 1059541a
- concept: роль сведения множества версий в один ответ в промышленных паттернах закреплена за центральным компонентом — оркестратором или супервизором
  question: В паттерне orchestrator-workers и в паттерне supervisor с агентами-специалистами какой компонент выполняет ту же функцию, что синтезатор в дебатах?
  explanation: 'Ни один из промышленных паттернов не называется «дебатами», но механика совпадает: несколько мнений плюс шаг сведения. Сведение делает центральный компонент — оркестратор в orchestrator-workers, supervisor в графовых оркестраторах. Узнавание этой роли под чужим именем избавляет от написания ещё одной реализации того же самого.'
  kind: choice
  options:
    - 'Центральный компонент — оркестратор или supervisor: он собирает версии исполнителей и сводит их в один ответ'
    - Каждый worker или специалист сводит результат сам, а центральный компонент только раздаёт задачи
    - Функция синтеза в этих паттернах отсутствует, поэтому дебаты в них невозможны
    - Роль синтезатора всегда играет отдельный агент-evaluator, добавляемый поверх паттерна
  correct: 0
