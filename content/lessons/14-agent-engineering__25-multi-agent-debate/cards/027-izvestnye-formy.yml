- concept: связка дебатов с evaluator-optimizer даёт измеримый сигнал качества для оценки многоагентной системы
  question: Зачем к дебатам в многоагентных evals добавляют компонент evaluator-optimizer?
  explanation: 'Дебаты сами по себе дают ответ, но не оценку. Evaluator-optimizer добавляет явный оценочный шаг: критик формулирует, чем ответ плох, и этот сигнал служит одновременно измерением качества системы и входом для улучшения на следующей итерации. Эталонного ответа он не приносит — это по-прежнему суждение модели, а не оракул.'
  kind: choice
  options:
    - Оценщик фиксирует слабость ответа и выдаёт сигнал, который используют и как метрику качества, и как вход следующей попытки
    - Он заменяет агрегацию голосов, поэтому дебатам больше не нужен шаг сведения
    - Он гарантирует, что все агенты сойдутся на одном ответе быстрее, сокращая число раундов
    - Он подменяет собой внешний верификатор, обеспечивая доступ к эталонному ответу
  correct: 0
