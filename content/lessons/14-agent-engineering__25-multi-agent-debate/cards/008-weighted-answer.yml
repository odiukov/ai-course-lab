  fingerprint: 903730fb
- concept: самый уверенный одиночный голос и ответ с наибольшей суммарной поддержкой — два разных правила агрегации
  question: Объясни своими словами, почему «взять ответ участника с максимальной уверенностью» и «взять ответ с максимальной суммой уверенностей» — разные правила, и приведи свой пример, где они расходятся.
  explanation: Типичная ошибка реализации — сравнивать пары напрямую вместо того, чтобы сперва накопить веса по ключу-ответу. Вес принадлежит голосу, но соревнуются итоговые суммы ответов, поэтому группировка обязана идти раньше поиска максимума.
  kind: open
  reference: 'Первое правило смотрит на одиночный голос — это argmax по парам (ответ, уверенность), и вся информация об остальных участниках теряется. Второе сначала группирует голоса по ответу, суммирует их веса и лишь потом берёт максимум, поэтому несколько умеренно уверенных сторонников могут перевесить одного очень уверенного. Пример: («C», 0.3), («C», 0.3), («D», 0.5) — правило максимального одиночного голоса вернёт D, взвешенная сумма даёт C = 0.6 против D = 0.5 и вернёт C. Правила совпадают только когда у победителя по сумме есть и рекордный одиночный голос.'
  id: 008-weighted-answer-3
  fingerprint: aaee1bd2
