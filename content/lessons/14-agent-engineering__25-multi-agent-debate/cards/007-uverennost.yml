- concept: некалиброванный агент с завышенной уверенностью подавляет группу при взвешенной агрегации
  question: В ансамбле из семи агентов один всегда возвращает уверенность 0.97 независимо от задачи, остальные шесть честно держатся в диапазоне 0.5–0.75. Что произойдёт с взвешенным голосованием?
  explanation: 'Веса имеют смысл только при общей шкале. Участник с постоянной 0.97 перевешивает двоих честных (0.5+0.4 = 0.9 или около того), поэтому решение принимает он, а не группа. Сумма весов больше единицы — нормальная ситуация, ничего не ломается технически; ломается смысл. Нормирование не спасает: оно делит все веса, но сохраняет соотношение между ними.'
  kind: choice
  options:
    - 'Ничего: агрегатор нормирует веса, и завышенная шкала одного участника исчезает сама'
    - 'Один участник фактически получает право вето: его вес перебивает почти любую пару честных голосов, и ансамбль вырождается в него одного'
    - Точность вырастет, потому что высокая уверенность коррелирует с правильностью ответа
    - 'Голосование сломается технически: сумма весов превысит единицу и агрегатор упадёт'
