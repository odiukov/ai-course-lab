- concept: уверенность годится как вес только при калибровке — соответствии заявленной уверенности эмпирической частоте правильных ответов
  question: Какое свойство должны иметь оценки уверенности агентов, чтобы взвешенное голосование было лучше простого большинства, и как это свойство проверить на практике?
  explanation: 'Уверенность не есть доказательство правильности: модель может ошибаться очень убедительно. Взвешивание даёт выигрыш только при калиброванных и сопоставимых шкалах — иначе оно систематически усиливает самого самоуверенного участника.'
  kind: open
  reference: 'Нужна калибровка: заявленная уверенность должна соответствовать реальной доле правильных ответов, и шкала должна пониматься участниками одинаково. Проверка — эмпирическая: собрать логи на размеченном наборе, разбить ответы по корзинам уверенности (например, 0.5–0.6, 0.6–0.7 и так далее) и сравнить среднюю заявленную уверенность в корзине с фактической точностью в ней. Если агент говорит 0.9, а прав в 55% случаев, его вес завышен, и взвешивание измеряет не качество ответа, а смелость модели. Тогда либо калибруют шкалу (температурное масштабирование, перекалибровка по логам), либо возвращаются к простому большинству.'
  id: 007-uverennost-3
