- concept: агрегация голосов через Counter и выбор самого частого элемента
  question: Дополни функцию, которая по списку финальных ответов агентов возвращает самую частую строку.
  explanation: Counter копит частоты, most_common(1) отдаёт список из одной пары (значение, счётчик), поэтому нужен [0][0] — сама строка ответа, а не число голосов. Если вернуть [0][1], получишь счётчик вместо ответа.
  kind: cloze
  template: |-
    from collections import Counter

    def majority_answer(votes: list[str]) -> str:
        counts = Counter(votes)
        return counts.___(1)[0][0]
  answer: most_common
  accept:
    - most_common
    - .most_common
    - most_common()
  id: 005-majority-answer-1
  fingerprint: 7d7fcfa1
- concept: голоса сравниваются как точные строки, поэтому варианты написания дробят большинство
  question: Агрегатор голосов сравнивает ответы как целые строки без нормализации. Агенты вернули ["yes", "yes ", "Yes"]. Что произойдёт?
  explanation: 'Для словаря частот "yes", "yes " и "Yes" — три разных ключа. Согласие агентов по сути есть, а по буквам его нет, и большинство рассыпается. Отсюда обязательная нормализация перед подсчётом: strip, приведение регистра, а для чисел — парсинг.'
  kind: choice
  options:
    - Все три считаются одним вариантом с тремя голосами
    - Каждый вариант получит по одному голосу — большинства нет, результат решает правило ничьей
    - Пробел и регистр игнорируются автоматически, победит "yes" с двумя голосами
    - Функция упадёт с ошибкой из-за неоднозначных ключей
  correct: 1
  id: 005-majority-answer-2
  fingerprint: 2cfbe4e0
- concept: 'детерминированное правило большинства: частоты, максимум, разрешение ничьей по первому появлению'
  question: Расставь шаги функции majority_answer, которая обязана давать один и тот же результат при каждом запуске.
  explanation: Без явного правила ничьей результат зависит от порядка обхода структуры и перестаёт быть воспроизводимым. Привязка к первому появлению делает функцию детерминированной, поэтому важно сохранять порядок ответов, а не только счётчики.
  kind: order
  items:
    - Пройти список ответов и накопить частоту каждой строки, сохраняя порядок первого появления
    - Найти максимальное значение частоты среди всех вариантов
    - Среди вариантов с максимальной частотой взять тот, что встретился в списке раньше остальных
    - Вернуть саму строку-ответ, а не её число голосов
  id: 005-majority-answer-3
  fingerprint: 002774b4
