- concept: в фактических вопросах расхождение независимо вспомненных версий — единственный внутренний сигнал галлюцинации, доступный без внешнего источника
  question: Агент уверенно называет выдуманную дату основания организации, не имея доступа к внешним источникам. Что именно даёт дебатам сигнал об ошибке, недоступный одиночному агенту?
  explanation: 'Галлюцинация выглядит для самого агента так же, как знание, поэтому изнутри одного прохода её не отличить. Дебаты добавляют наблюдаемую величину — согласие или расхождение версий. Ключ в независимости: при скоррелированных ошибках все могут назвать одну и ту же неверную дату, и сигнала не будет. Внешнего оракула протокол не предполагает.'
  kind: choice
  options:
    - 'Расхождение независимо вспомненных версий: само несовпадение помечает деталь как требующую перепроверки'
    - Уверенность агента автоматически падает, как только он видит чужой ответ
    - Выдуманные факты всегда оказываются в меньшинстве, даже когда ошибки участников скоррелированы
    - Участники сверяют дату с внешней базой, к которой одиночный агент не обращается
