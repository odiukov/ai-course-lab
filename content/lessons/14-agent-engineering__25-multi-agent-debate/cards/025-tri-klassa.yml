- concept: в открытых задачах на рассуждение выигрыш даёт обмен критикой, улучшающий саму траекторию решения до агрегации, тогда как голосование лишь выбирает среди готовых финальных ответов
  question: Объясни своими словами, какой выигрыш дебаты дают в открытых задачах на рассуждение и почему его нельзя получить, просто собрав независимые ответы и проголосовав.
  explanation: 'Разница между классами задач в том, что проверяется. Для факта достаточно сверки версий, для правила — поиска нарушенного ограничения, а для открытого рассуждения нужен обход вариантов решения: несколько разных постановок вместе сужают поиск. Отсюда и практический вывод — в этом классе нельзя экономить на раундах чтения чужих аргументов, оставив только финальную агрегацию.'
  kind: open
  reference: 'Агенты по-разному разбивают задачу на подзадачи и выдвигают разные объяснения. Читая друг друга, они критикой отбрасывают тупиковые ветви и достраивают пропущенные шаги, то есть меняется сам ход решения ещё до агрегации. Голосование работает только с готовыми финальными ответами: оно выбирает самый частый, но если все участники пошли по одному неверному пути, частота лишь закрепит ошибку. Поэтому в задачах вида «как прийти к ответу» ценность дебатов — в переработке рассуждения, а не в подсчёте голосов; голосование остаётся последним шагом над уже улучшенными версиями.'
