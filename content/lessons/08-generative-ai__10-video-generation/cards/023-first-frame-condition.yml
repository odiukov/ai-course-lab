- concept: влияние начального кадра задаёт связную траекторию, а не требует его копирования
  question: Объясни своими словами, почему успешное обусловливание начальным кадром не означает, что все последующие кадры должны быть на него похожи без изменений.
  explanation: Условие фиксирует начало траектории, а не запрещает динамику. Признак успешного обусловливания — согласованное развитие от начального состояния, а не неподвижное повторение одного изображения.
  kind: open
  reference: Начальный кадр задаёт исходное состояние, а дальнейшее движение определяется выученной моделью временных переходов. Поэтому значения или изображения могут постепенно меняться, но продолжение должно согласованно исходить из заданного состояния.
  id: 023-first-frame-condition-2
  fingerprint: a515981d
- concept: затухание различия между условным и безусловным распределениями характеризует дальность памяти модели
  question: Заполни правую часть формулы, описывающей полное затухание влияния начального состояния при увеличении временного расстояния.
  explanation: Если условное распределение далёких кадров становится неотличимо от безусловного распределения данных, информация о начальном кадре утрачена. Скорость такого сближения показывает дальность памяти модели.
