- concept: зашумлённые соседние кадры всё ещё содержат полезные общие признаки для согласования видео
  question: Объясни своими словами, почему видеоденойзеру полезны соседние кадры, даже если они ещё не очищены от шума.
  explanation: Диффузионный шум не уничтожает структуру последовательности мгновенно. Общие сигналы остаются доступны модели, поэтому для совместной обработки не нужны заранее полученные чистые соседние кадры.
  kind: open
  reference: Зашумлённые кадры сохраняют частичную информацию об общих объектах, цветах, формах и движении. Сопоставляя эти признаки между временными позициями, денойзер может согласовать свои предсказания и уменьшить случайные изменения деталей от кадра к кадру.
  id: 016-joint-sampling-2
  fingerprint: b32599b6
