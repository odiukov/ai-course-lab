- concept: для точного управления движением важнее специальные средства контроля, а не общий рейтинг качества
  question: Режиссёру необходимо задать траекторию камеры и движение отдельных объектов в кадре. Какой признак видеомодели важнее всего при выборе?
  explanation: Высокое визуальное качество само по себе не гарантирует управляемость. Для заданной постановки нужны явные инструменты контроля, например управление камерой или областями движения.
  kind: choice
  options:
    - Наивысшая оценка общего визуального качества
    - Наличие средств управления камерой и движением
    - Поддержка генерации только по тексту
    - Минимальный размер текстового промпта
  correct: 1
  id: 031-model-choice-1
  fingerprint: 723430fc
- concept: способ обусловливания модели должен соответствовать входным данным задачи
  question: Нужно оживить готовый рекламный кадр, сохранив его композицию. Доступная модель принимает только текст. Какое решение наиболее обоснованно?
  explanation: Для сохранения композиции исходное изображение должно непосредственно обусловливать генерацию. Высокое качество text-to-video не означает пригодность модели для image-to-video.
  kind: choice
  options:
    - Выбрать эту модель, если она лидирует среди text-to-video-моделей
    - Найти image-to-video-модель, принимающую исходный кадр как условие
    - Заменить изображение максимально подробным текстовым описанием
    - Выбирать исключительно по стоимости генерации
  correct: 1
  id: 031-model-choice-2
  fingerprint: b0913dda
- concept: доступ к сервису не равнозначен доступу к весам и разрешению на дообучение
  question: Объясни своими словами, почему возможность генерировать видео на сайте модели ещё не означает, что её можно дообучить через LoRA и использовать в собственном продукте.
  explanation: При выборе необходимо независимо проверить способ доступа к весам и условия лицензии. Хостинговый сервис может разрешать генерацию, но запрещать изменение модели, локальное развёртывание или определённые способы использования результатов.
  kind: open
  reference: Работа через сайт или API даёт доступ к результатам модели, но не обязательно к её весам. Для дообучения нужны доступные веса и техническая возможность их изменять, а лицензия должна отдельно разрешать дообучение и предполагаемое коммерческое или иное использование.
  id: 031-model-choice-3
  fingerprint: '09799e22'
