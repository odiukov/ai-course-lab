- concept: целью обучения ε-предиктора служит известный шум, добавленный к латенту видео
  question: Какую целевую величину используют при обучении видеодиффузионной модели с ε-предсказанием?
  explanation: При прямом диффузионном процессе добавленный шум известен. Модель получает зашумлённый латент клипа, шаг диффузии и условие, а функция потерь сопоставляет предсказание εθ с этим шумом во всех пространственных и временных позициях.
  kind: choice
  options:
    - Исходный RGB-клип
    - Шум, которым был искажён пространственно-временной латент
    - Текстовое представление промпта
    - Разность между соседними кадрами
  correct: 1
  id: 027-video-training-1
  fingerprint: d68e0290
- concept: v-предсказание меняет параметризацию цели, сохраняя общий принцип диффузионного обучения
  question: Объясните своими словами, что меняется и что сохраняется при переходе видеодиффузионной модели от предсказания ε к предсказанию v.
  explanation: ε- и v-предсказание задают разные параметризации одной диффузионной задачи. В обоих случаях обучение строится на зашумлении латента на выбранном шаге и минимизации ошибки между выходом модели и вычисляемой целевой величиной.
  kind: open
  reference: 'Меняется целевая величина, которую должен восстановить денойзер: вместо добавленного шума ε он предсказывает параметризованную величину v. Сохраняется общий принцип: модель получает зашумлённый пространственно-временной латент и учится по регрессионной потере восстанавливать известную цель диффузионного процесса.'
  id: 027-video-training-2
