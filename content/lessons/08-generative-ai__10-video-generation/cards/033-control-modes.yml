- concept: motion brush задаёт область и направление движения, но не фиксирует готовый кадр
  question: Объясни своими словами, какую информацию motion brush передаёт генератору видео и чего он не определяет.
  explanation: Нарисованные поверх изображения векторы служат пространственной подсказкой движения. Конкретные кадры и итоговое состояние сцены модель по-прежнему синтезирует сама.
  kind: open
  reference: Motion brush указывает, какой объект или участок изображения должен двигаться и в каком направлении. Он не задаёт точную конечную позу, внешний вид будущего кадра или все промежуточные состояния.
  id: 033-control-modes-2
