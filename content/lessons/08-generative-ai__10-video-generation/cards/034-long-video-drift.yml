- concept: скользящее окно поддерживает локальную связность, но может переносить накопленную ошибку дальше
  question: Объясни своими словами, почему перекрытие временных окон само по себе не гарантирует глобальную согласованность длинного сгенерированного видео.
  explanation: Перекрытие сглаживает стыки, но не проверяет правильность передаваемого состояния. Оно наследует как полезный контекст, так и ошибки, поэтому накопленный физический или визуальный дрейф может сохраняться и усиливаться.
  kind: open
  reference: Следующее окно опирается на уже созданные кадры. Если в них возникло небольшое искажение объекта или сцены, модель может принять его за правильный контекст и продолжить в последующих окнах. Поэтому локально плавное видео всё равно способно постепенно отклоняться от требуемого состояния.
  id: 034-long-video-drift-2
  fingerprint: 00c2f2b3
