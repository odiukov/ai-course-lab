- concept: видеомодель должна совместно моделировать пространственное содержимое и изменения во времени
  question: Почему генерация каждого кадра видео как независимого изображения не обеспечивает качественное видео?
  explanation: 'Видео требует temporal coherence: объекты и сцена должны сохраняться между кадрами, а изменения должны соответствовать связному движению. Пространственной правдоподобности отдельных кадров для этого недостаточно.'
  kind: open
  reference: 'Независимая генерация не гарантирует временную согласованность: внешний вид и идентичность объектов, освещение, положение и движение могут произвольно меняться между соседними кадрами. Поэтому модель должна учитывать временные связи и моделировать движение.'
  id: 001-obem-video-2
