- concept: порядок преобразований от зашумлённого латента до RGB-видео
  question: Расположите этапы генерации видео из текстового запроса в правильном порядке.
  explanation: DiT работает с токенами латентных патчей и не выдаёт готовые пиксели. После денойзинга патчи собирают обратно, а декодер VAE преобразует полученный латент в последовательность RGB-кадров.
  kind: order
  items:
    - Создать зашумлённый пространственно-временной латент нужной формы
    - Разделить латент на патчи и представить их как токены
    - Итеративно денойзить токены с помощью DiT и текстового условия
    - Собрать обработанные патчи обратно в латентный объём
    - Декодировать латент с помощью декодера VAE в RGB-кадры
  id: 004-video-pipeline-1
  fingerprint: cb375dd3
- concept: различие роли энкодера VAE при обучении и при генерации видео
  question: Объясните своими словами, почему энкодер VAE используется при обучении видеомодели, но обычно не входит в маршрут генерации нового ролика по тексту.
  explanation: Энкодер переводит существующие кадры в латентное пространство для подготовки обучающих данных. При генерации исходные кадры отсутствуют, а начальное состояние сразу создаётся в латентном пространстве.
  kind: open
  reference: 'При обучении энкодер VAE сжимает реальные видео в латенты, на которых учится DiT. При генерации реального входного ролика нет: процесс начинается с зашумлённого латента нужной формы, поэтому энкодеру нечего кодировать.'
  id: 004-video-pipeline-2
  fingerprint: a509b4a1
