- concept: для обучения долговременной связности нужны видео с продолжительными событиями
  question: Объясни своими словами, почему набор коротких видеофрагментов недостаточен для обучения модели устойчивой генерации длинных сцен.
  explanation: Чтобы научиться сохранять персонажей, предметы и развитие события на длинной дистанции, модель должна видеть такие зависимости в обучающих данных. Большой объём коротких клипов не полностью заменяет видео, где одно связное событие действительно продолжается долго.
  kind: open
  reference: 'Короткие фрагменты дают мало примеров дальних временных зависимостей: модель редко видит, как объекты, персонажи и причинные связи должны сохраняться на большом интервале. Поэтому она может хорошо воспроизводить локальное движение, но терять состояние сцены при продолжении.'
