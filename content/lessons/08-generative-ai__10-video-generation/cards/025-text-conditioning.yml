- concept: в cross-attention видеотокены используют текстовые представления как ключи и значения
  question: Видеоденойзер вычисляет cross-attention между видеотокенами и токенами текстового энкодера. Заполни пропуск в формуле.
  explanation: Запросы Q строятся из видеотокенов, а ключи K и значения V — из представлений текста. Поэтому каждый участок и момент видео может выбрать релевантные ему части описания.
  kind: cloze
  template: Q = W_Q h_video, K = W_K h_text, V = W_V h_text; Attention = softmax(QKᵀ / √d) ___
  answer: V
  accept:
    - · V
    - '* V'
    - '@ V'
  id: 025-text-conditioning-1
  fingerprint: eda4538e
- concept: подробный промпт уменьшает неопределённость атрибутов сцены у модели, обученной на плотных описаниях
  question: Почему подробный промпт обычно лучше управляет освещением, состоянием окружения и движением камеры в видеомодели, обученной на плотных подписях? Объясни также, почему большая длина промпта сама по себе не гарантирует лучший результат.
  explanation: Плотные обучающие описания связывают текст с множеством визуальных и временных признаков. На инференсе явное указание этих признаков сокращает пространство допустимых решений, но лишние, противоречивые или нерелевантные слова такого преимущества не дают.
  kind: open
  reference: При обучении модель училась связывать явно описанные свойства сцены с видеорядом. Подробный промпт задаёт больше нужных условий, тогда как краткий оставляет многие свойства неопределёнными, и модель выбирает их сама. Полезна не длина как таковая, а релевантная и непротиворечивая информация.
  id: 025-text-conditioning-2
  fingerprint: 5fc4e275
