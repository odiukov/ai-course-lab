- concept: tensor parallelism распределяет вычисление одного запроса между GPU, разделяя матрицы слоёв модели
  question: Как tensor parallelism обрабатывает один видеоклип большим DiT?
  explanation: При tensor parallelism веса и матричные операции внутри слоёв разделяются между GPU. Устройства совместно выполняют один проход модели, после чего объединяют частичные результаты.
  kind: choice
  options:
    - Разные GPU одновременно вычисляют части матричных операций для одного и того же клипа
    - Каждый GPU хранит полную копию модели и независимо генерирует отдельный клип
    - Один GPU выполняет DiT, а остальные используются только для декодирования латента
  correct: 0
  id: 036-tensor-parallel-1
  fingerprint: 076557b4
- concept: масштабирование tensor parallelism ограничивается стоимостью межпроцессорного обмена all-reduce
  question: Почему увеличение степени tensor parallelism перестаёт почти пропорционально сокращать задержку шага DiT?
  explanation: Tensor parallelism сокращает объём вычислений на устройство, но добавляет коллективные обмены. Поэтому ускорение сохраняется лишь до тех пор, пока стоимость all-reduce не начинает доминировать в задержке шага.
  kind: open
  reference: Локальных вычислений на каждом GPU становится меньше, но разделённым слоям по-прежнему требуется обмениваться и синхронизировать частичные результаты. Когда время all-reduce становится сопоставимым со временем вычислений, межсоединение превращается в узкое место и дополнительные GPU дают всё меньший выигрыш.
  id: 036-tensor-parallel-2
  fingerprint: ba66d8b5
