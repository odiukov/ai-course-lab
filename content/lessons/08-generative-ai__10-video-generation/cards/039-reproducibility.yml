- concept: seed определяет стохастическую траекторию движения и должен сохраняться вместе с промптом
  question: Два запуска видеомодели используют одинаковые промпт, модель и параметры, но разные seed. Какое различие наиболее вероятно?
  explanation: Seed задаёт исходный шум, из которого развивается вся последовательность. Поэтому при другом seed тот же промпт может породить другую динамику сцены. Чтобы вернуться к удачному дублю, seed нужно хранить рядом с точным промптом.
  kind: choice
  options:
    - Изменится только имя выходного файла
    - Могут измениться позы, движение объектов и траектория камеры
    - Изменится только разбор текста, а последовательность кадров останется прежней
  correct: 1
  id: 039-reproducibility-1
  fingerprint: 2cc78c04
- concept: воспроизводимый запуск требует фиксации всех существенных входов и настроек генерации
  question: Что следует сохранить для максимально близкого повторения удачного видеоклипа и почему одного seed недостаточно?
  explanation: Видеоклип определяется не только случайным начальным шумом. На результат также влияют версия модели, промпт, способ обусловливания, параметры генерации и исходные материалы, поэтому их фиксируют как единую карточку запуска.
  kind: open
  reference: Нужно сохранить точные промпты, модель и её конкретную версию, хостинг, режим обусловливания, seed, параметры генерации и неизменяемые исходные материалы. Seed воспроизводит только исходную случайность; изменение модели, параметров или входного изображения создаст другой запуск.
  id: 039-reproducibility-2
  fingerprint: 110d6cba
