- concept: суммарный трафик HBM равен трафику одного шага, умноженному на число шагов денойзинга
  question: На каждой итерации видеоденойзер читает и записывает суммарно 8 ГБ данных. Генерация выполняется за 16 итераций. Каков совокупный трафик HBM на один клип в гигабайтах?
  explanation: Совокупный трафик равен 8 × 16 = 128 ГБ. Это объём всех чтений и записей за время инференса, а не требование одновременно разместить 128 ГБ данных в памяти.
  kind: numeric
  answer: 128
  tolerance: 0.1
