- concept: нормализация на число соседних переходов позволяет сравнивать клипы разной длительности
  question: Почему при сравнении временной плавности клипов сумму разностей соседних кадров делят на число переходов?
  explanation: У клипа из T кадров есть T−1 соседних переходов. Без деления длинный клип обычно получил бы большую сумму просто из-за большего числа слагаемых. Среднее позволяет содержательно сопоставлять, например, показатели 0,61 и 1,31.
  kind: choice
  options:
    - Чтобы получить среднее изменение за переход и не завышать оценку более длинных клипов
    - Чтобы найти единственный самый резкий переход в каждом клипе
    - Чтобы восстановить порядок кадров по величинам разностей
    - Чтобы сделать распределения отдельных кадров одинаковыми
