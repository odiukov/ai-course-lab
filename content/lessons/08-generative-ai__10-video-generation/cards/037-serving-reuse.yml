- concept: clip-level prefill cache хранит неизменное обусловливание клипа, а не обновляемый видеолатент
  question: Клип генерируется временными окнами с одним и тем же промптом и опорным изображением. Какие данные целесообразно сохранить в clip-level prefill cache?
  explanation: Промпт и опорный кадр остаются неизменными, поэтому их представления и данные cross-attention можно вычислить один раз и переиспользовать. Видеолатент меняется на каждом шаге шумоподавления и не подходит для такого кэширования.
  kind: choice
  options:
    - Текущий зашумлённый видеолатент, который обновляется при шумоподавлении
    - Предварительно вычисленные признаки обусловливания и их ключи и значения для cross-attention
    - Предсказанный шум каждого окна после очередного шага
    - Готовые RGB-кадры всех ещё не сгенерированных окон
  correct: 1
  id: 037-serving-reuse-1
  fingerprint: 879b5499
- concept: continuous batching перекрывает доступные стадии обработки разных временных окон
  question: Объясни своими словами, как планирование на лету сокращает простои при генерации видео временными окнами.
  explanation: 'Continuous batching использует одновременно доступные стадии разных окон: вычисления следующего фрагмента могут идти параллельно с декодированием или передачей предыдущего. Зависимости между окнами при этом сохраняются ради временной связности.'
  kind: open
  reference: Если архитектура поддерживает оконную генерацию, планировщик может начать подготовку или рендеринг следующего окна, пока предыдущее декодируется либо передаётся клиенту. Это перекрывает разные стадии обработки и повышает загрузку оборудования, но не означает, что окна должны генерироваться независимо друг от друга.
  id: 037-serving-reuse-2
  fingerprint: 3c293260
