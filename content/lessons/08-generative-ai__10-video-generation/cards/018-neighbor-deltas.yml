- concept: большая абсолютная разность соседних кадров измеряет силу изменения, но не доказывает наличие артефакта
  question: Почему большое значение средней абсолютной разности между соседними кадрами нельзя автоматически считать ошибкой видеомодели?
  explanation: Межкадровая разность — низкоуровневый сигнал изменения, а не семантическая оценка качества. Поэтому подозрительные пики нужно сопоставлять с содержанием видео или дополнительными метриками.
  kind: open
  reference: Метрика учитывает только величину изменения пикселей и не понимает его причину. Большую разность могут вызвать как мерцание или дёрганье, так и нормальное быстрое движение, поворот объекта, смена сцены или вспышка.
  id: 018-neighbor-deltas-2
