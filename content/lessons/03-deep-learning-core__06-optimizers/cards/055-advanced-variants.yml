- concept: градиент Нестерова вычисляется в точке после упреждающего смещения по накопленной скорости
  question: Для одного параметра w = 8, накопленной скорости v = 4, learning rate = 0.2 и beta = 0.75 вычислите координату точки, в которой метод Нестерова должен измерить градиент.
  explanation: Упреждающая точка равна w − lr · beta · v. Подстановка даёт 8 − 0.2 · 0.75 · 4 = 7.4. Именно в этой точке вычисляется градиент Нестерова.
  kind: numeric
  answer: 7.4
  tolerance: 0.001
  id: 055-advanced-variants-1
  fingerprint: 559a3ab9
- concept: устойчивость gradient clipping оценивают по частоте расходимости на нескольких случайных запусках
  question: Почему влияние gradient clipping на появление NaN лучше проверять на нескольких случайных сидах, а не на единственном запуске?
  explanation: Один прогон не показывает, было ли отсутствие или появление NaN следствием clipping либо случайной траектории обучения. В упражнении поэтому предлагается сравнить число разошедшихся прогонов на серии случайных сидов.
  kind: open
  reference: Мини-батчи, инициализация и другие случайные факторы могут сделать отдельный запуск удачным или неудачным. Серия запусков позволяет сравнить долю случаев расходимости с clipping и без него и тем самым оценить устойчивость метода.
  id: 055-advanced-variants-2
  fingerprint: 01dd23a5
