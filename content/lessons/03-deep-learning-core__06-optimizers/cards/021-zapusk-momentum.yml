- concept: одинаковое численное значение learning rate не гарантирует равноценной настройки разных оптимизаторов
  question: Объясни своими словами, почему требование одинакового learning rate для разных оптимизаторов не всегда делает сравнение честным.
  explanation: Learning rate является частью конкретного правила обновления. Равенство его численного значения не означает равенства эффективных шагов, поэтому сравнивают разумно настроенные методы при одинаковом объёме обучения.
  kind: open
  reference: Оптимизаторы по-разному преобразуют градиент и используют learning rate, поэтому одно значение может быть подходящим для одного метода и неудачным для другого. Честнее дать каждому оптимизатору сопоставимую процедуру настройки, сохранив одинаковый бюджет обучения и остальные условия.
  id: 021-zapusk-momentum-2
  fingerprint: 558ef0c8
- concept: сходимость оптимизаторов оценивают по всей кривой обучения, а не только по конечному значению
  question: Какие наблюдения нужны, чтобы содержательно сравнить сходимость двух оптимизаторов?
  explanation: Одна конечная точка скрывает динамику обучения. Один оптимизатор может быстро улучшаться сначала, а другой — позднее давать более устойчивую или качественную сходимость.
  kind: choice
  options:
    - Только значение точности после последнего обновления
    - Только время выполнения одного обновления
    - Скорость снижения ошибки в начале, дальнейшая стабильность и итоговые метрики
    - Только нормы начальных параметров сети
  correct: 2
  id: 021-zapusk-momentum-3
  fingerprint: 9e425b82
