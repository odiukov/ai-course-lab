- concept: каждому параметру в SGD соответствует градиент с тем же индексом
  question: Вспомогательная функция sgd_update(parameter, gradient, lr) возвращает обновлённое значение одного параметра. Заполни пропуск так, чтобы параметры и градиенты сопоставлялись по индексам.
  explanation: Параметр params[i] нужно обновлять с помощью соответствующего ему градиента grads[i]. Иная индексация незаметно применит градиенты не к тем параметрам.
  kind: cloze
  template: |-
    for i in range(len(params)):
        params[i] = sgd_update(params[i], ___, lr)
  answer: grads[i]
  accept:
    - grads.__getitem__(i)
  id: 008-code-sgd-step-1
  fingerprint: 95efec1a
- concept: переназначение переменной цикла не изменяет элементы исходного списка параметров
  question: |-
    Почему этот код вычисляет новые значения, но не изменяет список params?

    for parameter, gradient in zip(params, grads):
        parameter = sgd_update(parameter, gradient, lr)
  explanation: Переменная parameter получает новое значение, но соответствующая ячейка списка не меняется. Для обновления модели результат нужно записать обратно в params[i].
  kind: choice
  options:
    - Функцию обновления разрешено вызывать только внутри класса оптимизатора
    - Градиенты нельзя читать через zip
    - Имя parameter переназначается локально, а элементы списка params остаются прежними
    - Перед обходом параметры необходимо преобразовать в кортеж
  correct: 2
  id: 008-code-sgd-step-2
  fingerprint: 3054c460
