- concept: оптимизатор с внутренним состоянием может по-разному преобразовать одинаковые текущие градиенты
  question: В двух запусках текущие значения параметра и его градиент совпадают, но накопленное состояние оптимизатора различается. Что можно сказать об обновлениях параметра?
  explanation: Оптимизаторы с моментом или другими скользящими средними используют не только текущий градиент, но и накопленное состояние. Поэтому одинаковый текущий градиент не гарантирует одинакового обновления.
  kind: choice
  options:
    - Они обязательно совпадут, потому что текущий градиент полностью определяет обновление
    - Они могут различаться, потому что оптимизатор способен учитывать сведения о прошлых шагах
    - В обоих запусках обновление обязательно будет нулевым
  correct: 1
  id: 002-rol-optimizatora-1
  fingerprint: d1687283
- concept: градиенты сначала вычисляются, затем преобразуются оптимизатором и только после этого применяются к параметрам
  question: Расположите действия одного шага обучения в правильном порядке.
  explanation: Обратный проход определяет локальные производные функции потерь. Оптимизатор превращает их в конкретные обновления, после чего эти обновления изменяют параметры модели.
  kind: order
  items:
    - Вычислить градиенты параметров с помощью обратного прохода
    - Преобразовать градиенты в обновления по правилу оптимизатора
    - Применить полученные обновления к параметрам модели
  id: 002-rol-optimizatora-2
  fingerprint: 1a3064ff
