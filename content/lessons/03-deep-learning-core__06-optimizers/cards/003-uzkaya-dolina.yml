- concept: плато функции потерь не обязательно означает сходимость оптимизации
  question: Loss почти перестал снижаться. Как по движению параметров отличить настоящую сходимость от осцилляций поперёк узкой долины?
  explanation: Плоский график loss сам по себе не доказывает сходимость. Если параметры совершают крупные противоположно направленные обновления, оптимизатор может тратить шаги на метания поперёк долины, почти не приближаясь к лучшему решению.
  kind: open
  reference: При сходимости обновления параметров обычно становятся малыми. При осцилляциях параметры продолжают заметно двигаться, причём соответствующие поперечные компоненты обновлений чередуют знак, хотя loss почти не меняется и продвижение вдоль долины остаётся медленным.
