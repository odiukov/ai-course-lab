- concept: epsilon предотвращает нулевой знаменатель в обновлении RMSProp
  question: Заполните пропуск в формуле обновления RMSProp величиной, которая защищает от деления на ноль.
  explanation: Если история квадратов градиента ещё пуста или равна нулю, sqrt(s_t) не обеспечивает ненулевой знаменатель. Малое положительное epsilon делает деление определённым.
  kind: cloze
  template: Δw_t = -η · g_t / (sqrt(s_t) + ___)
  answer: epsilon
  accept:
    - ε
    - eps
    - эпсилон
  id: 025-adaptive-scale-2
