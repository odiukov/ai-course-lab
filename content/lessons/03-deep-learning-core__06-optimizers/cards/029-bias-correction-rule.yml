- concept: bias correction нормирует экспоненциальное среднее на накопленный к текущему шагу вес наблюдений
  question: Заполни пропуск в формуле коррекции экспоненциального скользящего среднего в Adam.
  explanation: При нулевой инициализации в моменте накоплен вес лишь 1 − β^t. Деление на этот вес убирает стартовое занижение оценки.
  kind: cloze
  template: moment_hat = ___
  answer: moment / (1 - beta ** t)
  accept:
    - moment/(1-beta**t)
    - moment / (1 - beta^t)
    - moment / (1 - beta ** step)
  id: 029-bias-correction-rule-1
  fingerprint: '54528606'
- concept: влияние bias correction ослабевает с ростом номера шага
  question: Почему после длительного обучения скорректированный момент Adam становится почти равен нескорректированному?
  explanation: При beta между нулём и единицей величина beta^t убывает. Поэтому множитель коррекции 1 / (1 − beta^t) приближается к единице и почти перестаёт менять момент.
  kind: choice
  options:
    - Параметр beta постепенно становится равен нулю
    - Степень beta^t стремится к нулю, поэтому знаменатель поправки стремится к единице
    - Adam перестаёт обновлять скользящие средние
    - Накопленный момент принудительно обнуляется
  correct: 1
  id: 029-bias-correction-rule-2
  fingerprint: 7922dc2d
