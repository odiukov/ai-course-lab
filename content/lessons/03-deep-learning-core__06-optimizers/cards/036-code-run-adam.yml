- concept: траектория оптимизации должна включать начальное состояние и состояние после каждого обновления
  question: Как правильно собирать полную траекторию параметров при последовательных вызовах Adam?
  explanation: Полная траектория начинается с исходной точки и заканчивается результатом последнего обновления. Сохранение только перед обновлениями теряет конечную точку, а сохранение только в конце — весь пройденный путь.
  kind: choice
  options:
    - Сначала сохранить копию начальных параметров, затем добавлять копию после каждого обновления
    - Добавлять параметры только перед каждым обновлением
    - Добавить параметры в историю только после завершения обучения
    - После каждого обновления заменять всю историю текущими параметрами
