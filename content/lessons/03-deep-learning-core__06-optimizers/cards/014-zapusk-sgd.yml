  fingerprint: 4245ee79
- concept: порядок мини-батчей влияет на промежуточную траекторию SGD
  question: Запуски A и B начинают с одинаковых параметров и используют одинаковый набор мини-батчей, но обрабатывают их в разном порядке. Почему промежуточные траектории могут разойтись?
  explanation: После каждого обновления параметры меняются, поэтому градиент следующего мини-батча вычисляется уже в другой точке. Иной порядок мини-батчей создаёт иную цепочку точек, даже если инициализация и данные совпадают.
  kind: choice
  options:
    - SGD заранее строит случайный маршрут для каждого запуска
    - Перестановка мини-батчей обязательно изменяет минимум функции потерь
    - Каждый очередной градиент вычисляется в точке, созданной всей историей предыдущих обновлений
    - При перестановке мини-батчей learning rate автоматически становится случайным
