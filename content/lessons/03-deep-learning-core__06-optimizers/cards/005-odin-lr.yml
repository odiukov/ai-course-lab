- concept: разным параметрам одновременно могут требоваться разные эффективные размеры шага
  question: Один параметр модели ещё требует заметной коррекции, а другой уже находится рядом с подходящим значением. Какой подход лучше учитывает эту ситуацию?
  explanation: 'Единый learning rate вынуждает искать компромисс: крупный шаг может нарушать уже точные параметры, а маленький замедляет настройку остальных. Адаптивный размер шага позволяет обновлять каждый параметр с подходящей ему чувствительностью.'
  kind: choice
  options:
    - Обновлять все параметры на одинаковую величину
    - Использовать отдельный эффективный размер шага для каждого параметра
    - На каждом обновлении увеличивать общий learning rate
    - Полностью прекратить обновление всех параметров
  correct: 1
  id: 005-odin-lr-1
  fingerprint: 7de74b39
- concept: подходящий размер шага для одного параметра может меняться в ходе обучения
  question: Почему размер обновления, подходящий конкретному параметру в начале обучения, может перестать подходить ему позднее?
  explanation: Потребность параметра в размере шага не постоянна. По мере приближения к удачному значению прежние крупные обновления могут начать вызывать проскакивание и разрушать найденную настройку.
  kind: open
  reference: Положение параметра и состояние оптимизации меняются. Вначале параметр может быть далёк от подходящего значения и допускать крупные обновления, а позднее оказаться рядом с ним и требовать более осторожных шагов.
  id: 005-odin-lr-2
  fingerprint: d6b2b75c
