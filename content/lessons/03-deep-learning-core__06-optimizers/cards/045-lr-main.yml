- concept: learning rate следует настраивать первым среди гиперпараметров оптимизатора
  question: Есть ресурсы на тщательную настройку только одного гиперпараметра AdamW. Что обычно следует выбрать?
  explanation: Learning rate задаёт масштаб каждого обновления и обычно влияет на результат сильнее остальных гиперпараметров оптимизатора. Поэтому его рабочее значение ищут в первую очередь.
  kind: choice
  options:
    - Число эпох
    - Коэффициент epsilon
    - Learning rate
    - Порядок параметров модели
  correct: 2
  id: 045-lr-main-1
  fingerprint: a078cb25
- concept: learning rate сначала ищут по масштабу, а затем уточняют внутри рабочего диапазона
  question: Расположи этапы практического подбора learning rate в правильном порядке.
  explanation: Сначала нужен грубый поиск рабочего масштаба learning rate. Точная настройка близких значений имеет смысл только после того, как найден устойчивый диапазон.
  kind: order
  items:
    - Проверить несколько существенно различающихся по масштабу значений
    - Выбрать диапазон, в котором обучение устойчиво и даёт заметный прогресс
    - Сравнить более близкие значения внутри выбранного диапазона
  id: 045-lr-main-2
  fingerprint: 6c050088
- concept: дообучение предобученной модели обычно требует более осторожного learning rate
  question: Какой подход к learning rate обычно разумнее при переходе от обучения новой модели к дообучению уже предобученной?
  explanation: При дообучении важно не разрушить уже полезные параметры слишком крупными обновлениями, поэтому стартовый learning rate обычно выбирают ниже, чем при обучении новой модели.
  kind: choice
  options:
    - Обязательно сохранить прежнее значение
    - Сделать learning rate как можно больше
    - Начать поиск с меньшего learning rate
    - Полностью отключить обновление весов
  correct: 2
