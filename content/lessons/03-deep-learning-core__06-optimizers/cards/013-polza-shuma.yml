- concept: шум мини-батчевых градиентов делает потери и параметры колеблющимися даже возле хорошего решения
  question: Почему при мини-батчевом SGD значение потерь может иногда возрастать, даже если параметры уже находятся возле хорошего решения?
  explanation: 'Шум полезен для исследования поверхности потерь, но не знает направления к лучшему решению. Из-за него траектория SGD обычно не является гладкой и монотонной: параметры колеблются, а потери могут временно расти.'
  kind: open
  reference: Градиенты разных случайных мини-батчей различаются и не всегда направлены в сторону уменьшения потерь на всём датасете. Поэтому отдельные обновления могут временно уводить параметры от удачной области, вызывая колебания потерь.
