- concept: при линейном warmup learning rate пропорционален завершённой доле разгона
  question: Линейный warmup длится 840 обновлений, а рабочий learning rate равен 0.0008. Каким будет learning rate после 210 обновлений warmup?
  explanation: Пройдено 210 / 840 = 0.25 разгона, поэтому learning rate равен 0.0008 × 0.25 = 0.0002.
  kind: numeric
  answer: 0.0002
  tolerance: 0.000001
  id: 047-warmup-1
  fingerprint: 1c49cc75
- concept: warmup стабилизирует начало обучения, но не делает завышенный рабочий learning rate безопасным
  question: Во время warmup обучение стабильно, но сразу после выхода на рабочий learning rate функция потерь начинает быстро расти. Какой вывод наиболее обоснован?
  explanation: Warmup уменьшает только ранние шаги и затем выводит оптимизатор на выбранный рабочий learning rate. Если это значение само по себе слишком велико, нестабильность проявится после завершения разгона.
  kind: choice
  options:
    - Рабочий learning rate, вероятно, слишком велик; более долгий warmup лишь отложит нестабильность
    - Warmup обязательно нужно заменить постоянным learning rate той же величины
    - Рост функции потерь доказывает, что warmup был слишком плавным
    - После warmup оптимизатор больше не использует накопленное состояние
  correct: 0
  id: 047-warmup-2
  fingerprint: 579d79a8
