- concept: абсолютная величина сжатия при weight decay пропорциональна величине веса
  question: Почему при одинаковом коэффициенте weight decay крупный по модулю вес за один шаг уменьшается сильнее, чем небольшой?
  explanation: Weight decay действует пропорционально текущему значению параметра. Это сдерживает рост крупных весов, сохраняя относительный характер сжатия.
  kind: open
  reference: 'Weight decay вычитает долю самого веса. Поэтому абсолютная величина сжатия пропорциональна модулю веса: большие веса получают больший абсолютный штраф.'
