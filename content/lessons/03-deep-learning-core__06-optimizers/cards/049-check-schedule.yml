- concept: прогресс косинусного затухания отсчитывается от конца warmup и нормируется на оставшуюся длительность
  question: Обучение длится 140 эпох, warmup заканчивается на эпохе 28. Чему равен нормированный прогресс косинусного участка на эпохе 84?
  explanation: Для косинусного участка прогресс равен (84 − 28) / (140 − 28) = 56 / 112 = 0.5. Отсчёт начинается заново после warmup, а не от начала обучения.
  kind: numeric
  answer: 0.5
  tolerance: 0.001
  id: 049-check-schedule-1
  fingerprint: 39df5f1c
- concept: стандартное косинусное затухание начинается в максимуме с нулевой начальной скоростью снижения
  question: Как ведёт себя наклон стандартной косинусной кривой learning rate в самом начале затухания?
  explanation: Косинус начинается в своей верхней точке, где касательная горизонтальна. Поэтому сразу после warmup learning rate не обрывается резко, а начинает уменьшаться плавно.
  kind: choice
  options:
    - Касательная горизонтальна, поэтому снижение начинается плавно
    - Learning rate сразу убывает с максимальным по модулю наклоном
    - Наклон скачком меняет знак несколько раз
