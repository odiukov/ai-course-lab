- concept: эффективная длина памяти Momentum растёт при приближении beta к единице
  question: В оптимизаторе Momentum установили β = 0.75. Сколько шагов примерно охватывает его эффективная память?
  explanation: За шаг забывается четверть накопленной скорости. Обратная величина этой доли даёт оценку эффективной памяти — примерно четыре шага.
  kind: numeric
  answer: 4
  tolerance: 0.05
  id: 019-beta-memory-1
  fingerprint: cbe3fda8
- concept: увеличение beta замедляет реакцию Momentum на устойчивую смену направления градиента
  question: В Momentum увеличили β, не меняя learning rate. Что произойдёт после внезапного устойчивого разворота направления градиента?
  explanation: Чем больше β, тем медленнее затухает накопленная скорость. Поэтому после разворота новые градиенты сначала должны погасить более сильное влияние прежнего направления.
  kind: choice
  options:
    - Скорость мгновенно развернётся вместе с первым новым градиентом
    - Скорость будет разворачиваться медленнее, потому что прежнее направление дольше сохраняется
    - Скорость перестанет зависеть от прошлых градиентов
    - Реакция скорости не изменится, поскольку learning rate остался прежним
  correct: 1
  id: 019-beta-memory-2
  fingerprint: a4145e7c
