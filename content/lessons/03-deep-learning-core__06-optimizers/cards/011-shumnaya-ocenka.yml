- concept: увеличение размера мини-батча обычно снижает изменчивость оценки градиента
  question: Как при прочих равных увеличение размера случайного мини-батча обычно влияет на оценку полного градиента и почему?
  explanation: Крупный мини-батч обычно лучше отражает состав всего датасета. Поэтому влияние отдельных примеров слабее, а разброс оценок полного градиента меньше.
  kind: open
  reference: Оценка обычно становится более устойчивой и меньше меняется между мини-батчами, поскольку вклад отдельных необычных примеров усредняется по большему числу данных.
