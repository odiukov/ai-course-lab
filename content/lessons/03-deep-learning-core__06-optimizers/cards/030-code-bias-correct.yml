- concept: bias correction вычисляет исправленную копию момента, не изменяя сырое состояние Adam
  question: Как должна вести себя функция bias_correct, чтобы не исказить последующие обновления Adam?
  explanation: Следующее экспоненциальное среднее должно вычисляться из сырого накопленного момента. Если сохранить исправленное значение вместо него, поправка попадёт в рекуррентное состояние и исказит историю градиентов.
  kind: choice
  options:
    - Вернуть исправленное значение, не изменяя value и сохранённые моменты
    - Записать исправленное значение обратно в момент оптимизатора
    - Заменить сохранённый момент текущим градиентом
  correct: 0
  id: 030-code-bias-correct-1
  fingerprint: 4ffee13a
- concept: поправка смещения Adam применяется к обновлённым сырым моментам с номером текущего шага
  question: Расположи операции одного шага Adam в правильном порядке.
  explanation: Поправка относится к моментам, уже включающим текущий градиент, и использует номер этого обновления. В состоянии оптимизатора при этом остаются сырые экспоненциальные средние.
  kind: order
  items:
    - Перевести счётчик на номер текущего шага
    - Обновить сырые первый и второй моменты по текущему градиенту
    - Получить исправленные копии моментов с помощью bias correction
    - Обновить параметры по исправленным моментам, сохранив сырые моменты для следующего шага
  id: 030-code-bias-correct-2
  fingerprint: b1c55130
