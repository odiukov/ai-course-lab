- concept: PyTorch накапливает градиенты между вызовами backward, если их явно не обнулить
  question: После вычисления градиента на мини-батче A программа сразу вызывает backward() для мини-батча B, не очищая .grad. Что окажется в .grad параметра?
  explanation: В PyTorch backward() прибавляет новый градиент к уже записанному в .grad. При обычном обучении перед новым мини-батчем вызывают optimizer.zero_grad(), а без него возникает непреднамеренное накопление.
  kind: choice
  options:
    - Только градиент мини-батча B
    - Сумма градиентов мини-батчей A и B
    - Среднее градиентов мини-батчей A и B
    - Разность градиентов мини-батчей B и A
  correct: 1
  id: 053-zero-and-clip-1
  fingerprint: 086cf95e
- concept: clipping по глобальной норме пропорционально масштабирует все компоненты градиента и сохраняет его направление
  question: Глобальная норма градиентов равна L и превышает допустимый предел C. Как clip_grad_norm_ изменит градиенты?
  explanation: Когда L > C, все компоненты получают один коэффициент C / L. Поэтому глобальная норма становится равной пределу C, а направление общего вектора градиентов сохраняется.
  kind: choice
  options:
    - Умножит каждую компоненту на C / L
    - Заменит каждую компоненту числом C
    - Обнулит компоненты, модуль которых превышает C
    - Вычтет C из каждой положительной компоненты
  correct: 0
  id: 053-zero-and-clip-2
  fingerprint: 9b476b9b
