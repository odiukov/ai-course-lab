- concept: архитектура модели определяет разумный стартовый выбор семейства оптимизатора
  question: Для обучения ResNet с нуля на задаче классификации изображений выбирают стартовую конфигурацию оптимизатора. Какой вариант наиболее типичен?
  explanation: Для CNN и ResNet типичной отправной точкой служит SGD с momentum. В уроке предлагаются lr=0.1 и momentum=0.9, но окончательный выбор проверяют по кривой обучения и качеству модели.
  kind: choice
  options:
    - SGD с momentum
    - Adam с укороченной памятью первого момента как для GAN
    - AdamW с осторожным режимом дообучения
    - Любой оптимизатор с одними и теми же настройками
  correct: 0
  id: 050-optimizer-choice-1
  fingerprint: ca045c03
- concept: нестационарность состязательного обучения GAN делает длинную память первого момента нежелательной
  question: Объясни своими словами, почему для GAN в Adam часто сокращают память первого момента.
  explanation: В GAN цель для каждой сети меняется вслед за обновлениями другой сети. Поэтому накопленное направление может стать неактуальным; практическая стартовая настройка из урока — Adam с lr=2e-4 и beta1=0.5.
  kind: open
  reference: Генератор и дискриминатор постоянно изменяют задачу друг для друга, поэтому прежнее направление градиентов быстро устаревает. Более короткая память позволяет оптимизатору быстрее реагировать на новую динамику.
  id: 050-optimizer-choice-2
  fingerprint: b61f548e
