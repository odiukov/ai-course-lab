- concept: скорость Momentum обновляется суммой затухающей прежней скорости и текущего градиента
  question: Оптимизатор Momentum обновляет скорость по правилу v ← βv + g. Перед обновлением v = 1.2, коэффициент β = 0.8, а текущий градиент g = 0.3. Чему станет равна скорость?
  explanation: 'Прежняя скорость частично сохраняется, а свежий градиент добавляется к ней: 0.8 × 1.2 + 0.3 = 1.26. Поэтому согласованные во времени градиенты накапливаются.'
  kind: numeric
  answer: 1.26
  tolerance: 0.001
  id: 017-momentum-rule-1
  fingerprint: 0e70c4cc
- concept: Momentum требует хранить отдельную скорость для каждого параметра
  question: Какое дополнительное состояние хранит SGD with Momentum?
  explanation: Список velocities имеет ту же длину, что и список параметров. Он хранит сжатый след прошлых градиентов, поэтому дополнительная память растёт линейно с количеством параметров; сохранять всю историю не требуется.
  kind: choice
  options:
    - Отдельное значение скорости для каждого параметра
    - Полную историю градиентов каждого параметра
    - Матрицу взаимодействий между всеми парами параметров
    - Копию каждого использованного мини-батча
