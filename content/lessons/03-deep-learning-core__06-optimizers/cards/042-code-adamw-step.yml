- concept: адаптивный шаг Adam и отдельное сжатие весов в AdamW выполняются последовательно
  question: Расположите операции над одним параметром в порядке их выполнения в шаге AdamW.
  explanation: 'Сначала Adam обрабатывает настоящий градиент: обновляет моменты, исправляет их смещение и изменяет параметр. Weight decay применяется отдельной операцией после адаптивного шага и не попадает в моменты.'
  kind: order
  items:
    - Обновить первый и второй моменты по текущему градиенту
    - Вычислить моменты с поправкой смещения
    - Применить адаптивное обновление Adam
    - Отдельно применить weight decay к параметру
  id: 042-code-adamw-step-1
  fingerprint: 947b69d7
- concept: epsilon не участвует в отдельном сжатии параметров AdamW
  question: Как увеличение epsilon при неизменных остальных гиперпараметрах влияет на две части шага AdamW?
  explanation: Epsilon находится в знаменателе адаптивного обновления Adam. Отдельное сжатие вычисляется через learning rate, weight decay и значение параметра, поэтому epsilon в него не входит.
  kind: choice
  options:
    - Может изменить адаптивное обновление Adam, но не коэффициент отдельного weight decay
    - Одинаково ослабляет адаптивное обновление и отдельный weight decay
    - Изменяет только отдельный weight decay, не затрагивая адаптивное обновление
