- concept: расходимость отличают от обычных колебаний по росту размаха потерь
  question: Какой признак сильнее всего указывает, что обучение не просто шумит из-за мини-батчей, а расходится из-за чрезмерного learning rate?
  explanation: 'Шум SGD может давать отдельные подъёмы loss даже при успешном обучении. Для расходимости характернее систематический рост потерь и увеличение размаха колебаний: обновления уводят параметры всё дальше от хорошей области.'
  kind: choice
  options:
    - Потери немного колеблются вокруг постепенно снижающегося среднего
    - Потери колеблются со всё большим размахом, а их общий уровень растёт
    - Потери монотонно, но очень медленно уменьшаются
    - Потери один раз увеличились после нескольких снижений
  correct: 1
  id: 009-masshtab-shaga-1
  fingerprint: b23a27ca
- concept: слишком маленький learning rate проявляется медленным прогрессом, а не ухудшением направления оптимизации
  question: Loss устойчиво уменьшается, но за доступный бюджет итераций меняется лишь незначительно. Объясни, почему причиной может быть слишком маленький learning rate и чем это отличается от расходимости.
  explanation: 'Во втором запуске из шага loss снижается от 1,2 до 1,197, поэтому направление обновлений может быть правильным. Проблема в темпе: шаги слишком малы. При чрезмерном learning rate наблюдается другой режим — резкие колебания и рост потерь.'
  kind: open
  reference: При слишком маленьком learning rate обновления направлены в сторону уменьшения loss, но имеют недостаточный размер, поэтому обучение не успевает достичь хорошего решения. При расходимости потери в целом растут или колеблются со всё большим размахом.
  id: 009-masshtab-shaga-2
  fingerprint: 5c07d60b
