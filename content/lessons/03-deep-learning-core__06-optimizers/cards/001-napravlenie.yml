- concept: слишком большой learning rate вызывает перескакивание через минимум
  question: 'Во время обучения значение функции потерь колеблется и не снижается устойчиво: параметры постоянно перескакивают с одной стороны минимума на другую. Какова наиболее вероятная причина?'
  explanation: 'Слишком большой learning rate создаёт чрезмерно длинные обновления: оптимизатор проскакивает минимум и оказывается на противоположном склоне. Слишком маленький learning rate обычно даёт медленное, но более плавное движение.'
  kind: choice
  options:
    - Learning rate слишком велик
    - Learning rate слишком мал
    - Градиенты вычисляются на мини-батчах
    - Параметры уже достигли точного минимума
