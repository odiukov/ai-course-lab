- concept: среднее преимущество оптимизатора нужно дополнять оценкой разброса и устойчивости по случайным сидам
  question: Объясните, почему меньшего среднего loss по нескольким запускам недостаточно, чтобы назвать оптимизатор надёжно лучшим.
  explanation: Несколько редких удачных прогонов способны улучшить среднее даже у нестабильного оптимизатора. Разброс и согласованность парных сравнений показывают, насколько преимущество воспроизводимо.
  kind: open
  reference: Среднее может скрывать большой разброс или преимущество, возникшее из-за нескольких особенно удачных запусков. Нужно также проверить распределение результатов или парных разностей и убедиться, что преимущество сохраняется на большинстве сидов.
