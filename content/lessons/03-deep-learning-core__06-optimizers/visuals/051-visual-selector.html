<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Шпаргалка выбора оптимизатора</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7fafc;
      --panel: #ffffff;
      --panel-soft: #eef4ff;
      --decision: #fff4d8;
      --ink: #172033;
      --muted: #526078;
      --line: #70809c;
      --accent: #315ee7;
      --accent-soft: #dce7ff;
      --border: #aebbd0;
      --fallback: #fff4d8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827;
        --panel: #1d2738;
        --panel-soft: #182846;
        --decision: #3b3020;
        --ink: #f1f5fb;
        --muted: #bdc8da;
        --line: #91a2bd;
        --accent: #84a7ff;
        --accent-soft: #253a68;
        --border: #52617a;
        --fallback: #3b3020;
      }
    }

    html,
    body {
      background: var(--bg);
      color: var(--ink);
    }

    body {
      margin: unset;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .figure {
      background: var(--bg);
      box-sizing: border-box;
      padding: 12px 16px 10px;
    }

    h1 {
      margin: unset;
      padding: 4px 0 8px;
      font-size: 22px;
      line-height: normal;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 460px;
      background: var(--bg);
      font-family: inherit;
    }

    .connector {
      fill: none;
      stroke: var(--line);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arrow {
      fill: var(--line);
    }

    .root-box {
      fill: var(--panel-soft);
      stroke: var(--accent);
      stroke-width: 2;
    }

    .decision-box {
      fill: var(--decision);
      stroke: var(--accent);
      stroke-width: 2;
    }

    .preset-box {
      fill: var(--panel);
      stroke: var(--border);
      stroke-width: 2;
    }

    .preset-mark {
      fill: var(--accent-soft);
    }

    .root-title,
    .decision-title {
      fill: var(--ink);
      font-size: 18px;
      font-weight: bold;
    }

    .root-subtitle,
    .decision-subtitle {
      fill: var(--muted);
      font-size: 15px;
    }

    .branch-label {
      fill: var(--muted);
      font-size: 15px;
      font-weight: bold;
    }

    .preset-title {
      fill: var(--accent);
      font-size: 17px;
      font-weight: bold;
    }

    .preset-value {
      fill: var(--ink);
      font-size: 15px;
    }

    #fallback {
      box-sizing: border-box;
      padding: 16px;
      border: 2px solid var(--border);
      background: var(--fallback);
      color: var(--ink);
      font-size: 16px;
      line-height: normal;
    }
  </style>
</head>
<body>
  <figure class="figure">
    <h1>Шпаргалка выбора оптимизатора</h1>

    <svg
      id="diagram"
      viewBox="0 0 1200 440"
      width="1200"
      height="440"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-title diagram-description"
    >
      <title id="diagram-title">Дерево выбора стартового оптимизатора</title>
      <desc id="diagram-description">
        Выбор стартовых настроек для трансформера, CNN, GAN, дообучения
        и задачи с неизвестной архитектурой.
      </desc>
    </svg>

    <div id="fallback" hidden>
      Схема должна была показать пять стартовых пресетов: Transformer или
      LLM — AdamW с lr=1e-4; CNN или ResNet — SGD с momentum и lr=0.1;
      GAN — Adam с lr=2e-4 и beta1=0.5; дообучение — AdamW с lr=2e-5;
      неизвестная задача — AdamW с lr=3e-4.
    </div>
  </figure>

  <script>
    const diagramData = [{
      origin: { x: 20, y: 12 },
      scale: { x: 1, y: 1 },

      root: {
        x: 20, y: 180, w: 220, h: 64, rx: 14,
        texts: [
          { value: "Новый проект", anchor: { x: 130, y: 204 }, offset: { x: 0, y: 0 }, className: "root-title" },
          { value: "Что вы обучаете?", anchor: { x: 130, y: 228 }, offset: { x: 0, y: 0 }, className: "root-subtitle" }
        ]
      },

      decision: {
        points: [
          { x: 290, y: 212 },
          { x: 380, y: 158 },
          { x: 470, y: 212 },
          { x: 380, y: 266 }
        ],
        texts: [
          { value: "Ближайший", anchor: { x: 380, y: 205 }, offset: { x: 0, y: 0 }, className: "decision-title" },
          { value: "сценарий", anchor: { x: 380, y: 228 }, offset: { x: 0, y: 0 }, className: "decision-subtitle" }
        ]
      },

      incoming: {
        from: { x: 240, y: 212 },
        to: { x: 290, y: 212 },
        arrow: [
          { x: 290, y: 212 },
          { x: 279, y: 205 },
          { x: 279, y: 219 }
        ]
      },

      trunk: {
        from: { x: 470, y: 212 },
        elbow: { x: 530, y: 212 },
        top: { x: 530, y: 40 },
        bottom: { x: 530, y: 360 }
      },

      presets: [
        {
          branch: "Трансформер / LLM",
          center: { x: 760, y: 40 },
          label: { anchor: { x: 530, y: 40 }, offset: { x: 18, y: -10 } },
          arrow: [
            { x: 760, y: 40 },
            { x: 748, y: 33 },
            { x: 748, y: 47 }
          ],
          box: { x: 760, y: 8, w: 390, h: 64, rx: 14 },
          mark: { x: 760, y: 8, w: 12, h: 64, rx: 6 },
          texts: [
            { value: "AdamW", anchor: { x: 790, y: 34 }, offset: { x: 0, y: 0 }, className: "preset-title" },
            { value: "lr=1e-4 · weight decay=0.01–0.1", anchor: { x: 790, y: 58 }, offset: { x: 0, y: 0 }, className: "preset-value" }
          ]
        },
        {
          branch: "CNN / ResNet",
          center: { x: 760, y: 120 },
          label: { anchor: { x: 530, y: 120 }, offset: { x: 18, y: -10 } },
          arrow: [
            { x: 760, y: 120 },
            { x: 748, y: 113 },
            { x: 748, y: 127 }
          ],
          box: { x: 760, y: 88, w: 390, h: 64, rx: 14 },
          mark: { x: 760, y: 88, w: 12, h: 64, rx: 6 },
          texts: [
            { value: "SGD + momentum", anchor: { x: 790, y: 114 }, offset: { x: 0, y: 0 }, className: "preset-title" },
            { value: "lr=0.1 · momentum=0.9", anchor: { x: 790, y: 138 }, offset: { x: 0, y: 0 }, className: "preset-value" }
          ]
        },
        {
          branch: "GAN",
          center: { x: 760, y: 200 },
          label: { anchor: { x: 530, y: 200 }, offset: { x: 18, y: -10 } },
          arrow: [
            { x: 760, y: 200 },
            { x: 748, y: 193 },
            { x: 748, y: 207 }
          ],
          box: { x: 760, y: 168, w: 390, h: 64, rx: 14 },
          mark: { x: 760, y: 168, w: 12, h: 64, rx: 6 },
          texts: [
            { value: "Adam", anchor: { x: 790, y: 194 }, offset: { x: 0, y: 0 }, className: "preset-title" },
            { value: "lr=2e-4 · beta1=0.5", anchor: { x: 790, y: 218 }, offset: { x: 0, y: 0 }, className: "preset-value" }
          ]
        },
        {
          branch: "Дообучение",
          center: { x: 760, y: 280 },
          label: { anchor: { x: 530, y: 280 }, offset: { x: 18, y: -10 } },
          arrow: [
            { x: 760, y: 280 },
            { x: 748, y: 273 },
            { x: 748, y: 287 }
          ],
          box: { x: 760, y: 248, w: 390, h: 64, rx: 14 },
          mark: { x: 760, y: 248, w: 12, h: 64, rx: 6 },
          texts: [
            { value: "AdamW", anchor: { x: 790, y: 274 }, offset: { x: 0, y: 0 }, className: "preset-title" },
            { value: "lr=2e-5 · weight decay=0.01", anchor: { x: 790, y: 298 }, offset: { x: 0, y: 0 }, className: "preset-value" }
          ]
        },
        {
          branch: "Задача пока неизвестна",
          center: { x: 760, y: 360 },
          label: { anchor: { x: 530, y: 360 }, offset: { x: 18, y: -10 } },
          arrow: [
            { x: 760, y: 360 },
            { x: 748, y: 353 },
            { x: 748, y: 367 }
          ],
          box: { x: 760, y: 328, w: 390, h: 64, rx: 14 },
          mark: { x: 760, y: 328, w: 12, h: 64, rx: 6 },
          texts: [
            { value: "AdamW", anchor: { x: 790, y: 354 }, offset: { x: 0, y: 0 }, className: "preset-title" },
            { value: "lr=3e-4 · weight decay=0.01", anchor: { x: 790, y: 378 }, offset: { x: 0, y: 0 }, className: "preset-value" }
          ]
        }
      ]
    }];

    const model = diagramData.find(Boolean);
    const origin = Object.freeze(model.origin);
    const scale = Object.freeze(model.scale);

    function sx(x) {
      return origin.x + x * scale.x;
    }

    function sy(y) {
      return origin.y + y * scale.y;
    }

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      function make(tag, attributes, textValue) {
        const element = document.createElementNS(namespace, tag);

        Object.entries(attributes).forEach(([name, value]) => {
          element.setAttribute(name, String(value));
        });

        if (textValue) {
          element.textContent = textValue;
        }

        return element;
      }

      function rectAttributes(box, className) {
        return {
          x: sx(box.x),
          y: sy(box.y),
          width: sx(box.w) - sx(0),
          height: sy(box.h) - sy(0),
          rx: sx(box.rx) - sx(0),
          class: className
        };
      }

      function pointString(points) {
        return points
          .map((point) => `${sx(point.x)},${sy(point.y)}`)
          .join(" ");
      }

      function appendText(textSpec, anchor) {
        const x = sx(textSpec.anchor.x + textSpec.offset.x);
        const y = sy(textSpec.anchor.y + textSpec.offset.y);

        svg.appendChild(make("text", {
          x,
          y,
          class: textSpec.className,
          "text-anchor": anchor,
          "dominant-baseline": "middle"
        }, textSpec.value));
      }

      svg.appendChild(make("line", {
        x1: sx(model.incoming.from.x),
        y1: sy(model.incoming.from.y),
        x2: sx(model.incoming.to.x),
        y2: sy(model.incoming.to.y),
        class: "connector"
      }));

      svg.appendChild(make("polygon", {
        points: pointString(model.incoming.arrow),
        class: "arrow"
      }));

      svg.appendChild(make("line", {
        x1: sx(model.trunk.from.x),
        y1: sy(model.trunk.from.y),
        x2: sx(model.trunk.elbow.x),
        y2: sy(model.trunk.elbow.y),
        class: "connector"
      }));

      svg.appendChild(make("line", {
        x1: sx(model.trunk.top.x),
        y1: sy(model.trunk.top.y),
        x2: sx(model.trunk.bottom.x),
        y2: sy(model.trunk.bottom.y),
        class: "connector"
      }));

      model.presets.forEach((preset) => {
        svg.appendChild(make("line", {
          x1: sx(model.trunk.top.x),
          y1: sy(preset.center.y),
          x2: sx(preset.center.x),
          y2: sy(preset.center.y),
          class: "connector"
        }));

        svg.appendChild(make("polygon", {
          points: pointString(preset.arrow),
          class: "arrow"
        }));
      });

      svg.appendChild(make("rect", rectAttributes(model.root, "root-box")));

      svg.appendChild(make("polygon", {
        points: pointString(model.decision.points),
        class: "decision-box"
      }));

      model.presets.forEach((preset) => {
        svg.appendChild(make("rect", rectAttributes(preset.box, "preset-box")));
        svg.appendChild(make("rect", rectAttributes(preset.mark, "preset-mark")));
      });

      model.root.texts.forEach((textSpec) => {
        appendText(textSpec, "middle");
      });

      model.decision.texts.forEach((textSpec) => {
        appendText(textSpec, "middle");
      });

      model.presets.forEach((preset) => {
        appendText({
          value: preset.branch,
          anchor: preset.label.anchor,
          offset: preset.label.offset,
          className: "branch-label"
        }, "start");

        preset.texts.forEach((textSpec) => {
          appendText(textSpec, "start");
        });
      });

      fallback.hidden = true;
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");

      if (svg) {
        svg.hidden = true;
      }

      if (fallback) {
        fallback.hidden = false;
      }
    }
  </script>
</body>
</html>
