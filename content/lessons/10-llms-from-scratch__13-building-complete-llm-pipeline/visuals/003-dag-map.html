<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта зависимостей двенадцати стадий</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f5f7fb;
    --panel: #ffffff;
    --ink: #172033;
    --muted: #5c667a;
    --edge: #64748b;
    --critical: #d83b55;
    --parallel: #6d5bd0;
    --release: #17875d;
    --card: #f8fafc;
    --card-stroke: #94a3b8;
    --split-card: #f3efff;
    --merge-card: #eef2ff;
    --output-card: #eef8ff;
    --gate-card: #e7f8ef;
    --guide: #d8dee9;
    --badge: #26334d;
    --badge-ink: #ffffff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #111522;
      --panel: #171c2b;
      --ink: #edf2ff;
      --muted: #aab4c8;
      --edge: #94a3b8;
      --critical: #ff6b81;
      --parallel: #b6a7ff;
      --release: #65d6a4;
      --card: #20283a;
      --card-stroke: #63708a;
      --split-card: #292442;
      --merge-card: #242b49;
      --output-card: #1e3042;
      --gate-card: #17382f;
      --guide: #343d52;
      --badge: #dce6ff;
      --badge-ink: #172033;
    }
  }

  html, body {
    background: var(--page);
    color: var(--ink);
  }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
  }

  .figure {
    max-width: 1200px;
    margin: auto;
    background: var(--panel);
  }

  .heading {
    margin: 0;
    padding: 10px 16px 0;
    font-size: 20px;
    line-height: normal;
  }

  .lede {
    margin: 0;
    padding: 4px 16px 8px;
    color: var(--muted);
    font-size: 14px;
    line-height: normal;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 440px;
    background: var(--panel);
  }

  .guide {
    stroke: var(--guide);
    stroke-width: 1px;
  }

  .edge {
    fill: none;
    stroke: var(--edge);
    stroke-width: 2px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .edge.critical {
    stroke: var(--critical);
  }

  .edge.parallel {
    stroke: var(--parallel);
  }

  .edge.release {
    stroke: var(--release);
  }

  .arrow {
    stroke: none;
    fill: var(--edge);
  }

  .arrow.critical {
    fill: var(--critical);
  }

  .arrow.parallel {
    fill: var(--parallel);
  }

  .arrow.release {
    fill: var(--release);
  }

  .node-box {
    fill: var(--card);
    stroke: var(--card-stroke);
    stroke-width: 2px;
  }

  .node.split .node-box {
    fill: var(--split-card);
    stroke: var(--parallel);
  }

  .node.merge .node-box {
    fill: var(--merge-card);
    stroke: var(--parallel);
  }

  .node.output .node-box {
    fill: var(--output-card);
  }

  .node.gate .node-box {
    fill: var(--gate-card);
    stroke: var(--release);
  }

  .divider {
    stroke: var(--card-stroke);
    stroke-width: 1px;
  }

  .stage-number {
    fill: var(--badge);
    font-size: 14px;
    font-weight: bold;
    text-anchor: middle;
    dominant-baseline: middle;
  }

  .node.gate .stage-number {
    fill: var(--release);
  }

  .node-title {
    fill: var(--ink);
    font-size: 13px;
    font-weight: bold;
    dominant-baseline: middle;
  }

  .note {
    fill: var(--muted);
    font-size: 13px;
    font-weight: bold;
  }

  .note.parallel {
    fill: var(--parallel);
  }

  .note.release {
    fill: var(--release);
  }

  .fallback {
    fill: var(--ink);
    font-size: 16px;
    text-anchor: middle;
  }

  noscript {
    display: block;
    padding: 16px;
    color: var(--ink);
    font-size: 16px;
  }
</style>
</head>
<body>
<main class="figure">
  <h1 class="heading">Карта зависимостей стадий 01–12</h1>
  <p class="lede">Стрелка означает: следующая стадия использует артефакт предыдущей.</p>

  <svg id="diagram"
       viewBox="0 0 1200 440"
       width="1200"
       height="440"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="svg-title svg-description">
    <title id="svg-title">DAG двенадцати стадий подготовки и выпуска модели</title>
    <desc id="svg-description">Последовательная цепочка до SFT, параллельные стадии 07 и 08, их объединение в стадии 09 и два обязательных входа в релизный шлюз от стадий 10 и 12.</desc>
    <g id="edge-layer"></g>
    <g id="node-layer"></g>
    <g id="label-layer"></g>
  </svg>

  <noscript>Схема должна показать цепочку стадий 01–06, параллельные ветви 07 и 08, объединение в 09 и входы от 10 и 12 в релизный шлюз.</noscript>
</main>

<script>
const data = [
  ["shape", "arrow", [13, 7]],

  ["guide", [[7, 39], [1173, 39]]],
  ["note", "Строгая цепочка до SFT", [590, 25], "middle", "chain"],
  ["note", "07 и 08 можно выполнять параллельно", [1015, 125], "middle", "parallel"],
  ["note", "нужны обе ветви", [925, 255], "end", "parallel"],
  ["note", "отчёт + работающий сервер", [1000, 379], "middle", "release"],

  ["edge", [[163, 79], [209, 79]], "critical"],
  ["edge", [[365, 79], [411, 79]], "critical"],
  ["edge", [[567, 79], [613, 79]], "critical"],
  ["edge", [[769, 79], [815, 79]], "critical"],
  ["edge", [[971, 79], [1017, 79]], "critical"],

  ["edge", [[1068, 106], [1068, 119], [925, 119], [925, 137]], "parallel"],
  ["edge", [[1122, 106], [1122, 119], [1105, 119], [1105, 137]], "parallel"],

  ["edge", [[925, 191], [925, 207], [990, 207], [990, 225]], "parallel"],
  ["edge", [[1105, 191], [1105, 207], [1055, 207], [1055, 225]], "parallel"],

  ["edge", [[985, 279], [985, 294], [730, 294], [730, 311]], ""],
  ["edge", [[1045, 279], [1045, 294], [910, 294], [910, 311]], ""],
  ["edge", [[990, 338], [1010, 338]], ""],

  ["edge", [[730, 365], [730, 374], [940, 374], [940, 386]], "release"],
  ["edge", [[1095, 365], [1095, 374], [1045, 374], [1045, 386]], "release"],

  ["node", "01", "main", [7, 52, 156, 54, 11],
    [[49, 60], [49, 98]], [28, 79],
    [["Словарь", 61, 72, "start"], ["токенизатора", 61, 88, "start"]]],

  ["node", "02", "main", [209, 52, 156, 54, 11],
    [[251, 60], [251, 98]], [230, 79],
    [["Обученный", 263, 72, "start"], ["токенизатор", 263, 88, "start"]]],

  ["node", "03", "main", [411, 52, 156, 54, 11],
    [[453, 60], [453, 98]], [432, 79],
    [["Шардированный", 465, 72, "start"], ["датасет", 465, 88, "start"]]],

  ["node", "04", "main", [613, 52, 156, 54, 11],
    [[655, 60], [655, 98]], [634, 79],
    [["Чекпоинт", 667, 72, "start"], ["базовой модели", 667, 88, "start"]]],

  ["node", "05", "main", [815, 52, 156, 54, 11],
    [[857, 60], [857, 98]], [836, 79],
    [["Рецепт", 869, 72, "start"], ["масштабирования", 869, 88, "start"]]],

  ["node", "06", "main", [1017, 52, 156, 54, 11],
    [[1059, 60], [1059, 98]], [1038, 79],
    [["SFT-чекпоинт", 1071, 79, "start"]]],

  ["node", "07", "split", [850, 137, 150, 54, 11],
    [[892, 145], [892, 183]], [871, 164],
    [["Reward model", 904, 157, "start"], ["+ PPO-политика", 904, 173, "start"]]],

  ["node", "08", "split", [1030, 137, 150, 54, 11],
    [[1072, 145], [1072, 183]], [1051, 164],
    [["DPO-политика", 1084, 164, "start"]]],

  ["node", "09", "merge", [940, 225, 164, 54, 11],
    [[982, 233], [982, 271]], [961, 252],
    [["CAI / GRPO", 994, 245, "start"], ["политика", 994, 261, "start"]]],

  ["node", "10", "output", [650, 311, 160, 54, 11],
    [[692, 319], [692, 357]], [671, 338],
    [["Отчёт", 704, 331, "start"], ["оценки", 704, 347, "start"]]],

  ["node", "11", "output", [830, 311, 160, 54, 11],
    [[872, 319], [872, 357]], [851, 338],
    [["Квантованные", 884, 331, "start"], ["веса", 884, 347, "start"]]],

  ["node", "12", "output", [1010, 311, 170, 54, 11],
    [[1052, 319], [1052, 357]], [1031, 338],
    [["Сервер", 1064, 331, "start"], ["инференса", 1064, 347, "start"]]],

  ["node", "✓", "gate", [875, 386, 230, 42, 11],
    [[917, 393], [917, 421]], [896, 407],
    [["РЕЛИЗНЫЙ ШЛЮЗ", 932, 407, "start"]]],

  ["fallback",
    ["Схема должна была показать зависимости стадий 01–12.", 600, 205],
    ["После 06 идут параллельные 07 и 08; в шлюз входят 10 и 12.", 600, 231]]
];

const origin = { x: 0, y: 0 };
const scale = 1;

const sx = x => origin.x + x * scale;
const sy = y => origin.y + y * scale;

const lineThickness = 2;
const fontSize = 13;
const labelPadding = 10;

try {
  const svg = document.getElementById("diagram");
  const edgeLayer = document.getElementById("edge-layer");
  const nodeLayer = document.getElementById("node-layer");
  const labelLayer = document.getElementById("label-layer");
  const namespace = "http://www.w3.org/2000/svg";

  const element = name => document.createElementNS(namespace, name);

  const set = (target, attributes) => {
    for (const [name, value] of Object.entries(attributes)) {
      target.setAttribute(name, value);
    }
    return target;
  };

  const polylinePath = points =>
    points.map(([x, y], position) =>
      `${position ? "L" : "M"} ${sx(x)} ${sy(y)}`
    ).join(" ");

  const arrowRecord = data.find(([kind, name]) =>
    kind === "shape" && name === "arrow"
  );
  const [, , [arrowLength, arrowHalfWidth]] = arrowRecord;

  const drawArrow = (points, tone) => {
    const reversed = [...points].reverse();
    const [tip, previous] = reversed;
    const [tipX, tipY] = tip;
    const [previousX, previousY] = previous;
    const deltaX = tipX - previousX;
    const deltaY = tipY - previousY;
    const distance = Math.hypot(deltaX, deltaY);
    const baseX = tipX - deltaX / distance * arrowLength;
    const baseY = tipY - deltaY / distance * arrowLength;
    const normalX = -deltaY / distance * arrowHalfWidth;
    const normalY = deltaX / distance * arrowHalfWidth;
    const vertices = [
      [tipX, tipY],
      [baseX + normalX, baseY + normalY],
      [baseX - normalX, baseY - normalY]
    ];

    const polygon = set(element("polygon"), {
      points: vertices.map(([x, y]) => `${sx(x)},${sy(y)}`).join(" "),
      class: `arrow ${tone}`
    });
    edgeLayer.appendChild(polygon);
  };

  const drawEdge = (points, tone) => {
    const path = set(element("path"), {
      d: polylinePath(points),
      class: `edge ${tone}`,
      "stroke-width": lineThickness
    });
    edgeLayer.appendChild(path);
    drawArrow(points, tone);
  };

  const drawGuide = points => {
    const path = set(element("path"), {
      d: polylinePath(points),
      class: "guide"
    });
    labelLayer.appendChild(path);
  };

  const drawNote = (content, anchor, alignment, tone) => {
    const [x, y] = anchor;
    const text = set(element("text"), {
      x: sx(x),
      y: sy(y),
      class: `note ${tone}`,
      "text-anchor": alignment,
      "font-size": fontSize
    });
    text.textContent = content;
    labelLayer.appendChild(text);
  };

  const drawNode = (number, tone, box, divider, badge, lines) => {
    const [left, top, width, height, radius] = box;
    const [[dividerX1, dividerY1], [dividerX2, dividerY2]] = divider;
    const [badgeX, badgeY] = badge;
    const group = set(element("g"), { class: `node ${tone}` });

    const rect = set(element("rect"), {
      x: sx(left),
      y: sy(top),
      width: sx(width) - sx(0),
      height: sy(height) - sy(0),
      rx: sx(radius) - sx(0),
      ry: sy(radius) - sy(0),
      class: "node-box",
      "stroke-width": lineThickness
    });

    const separator = set(element("line"), {
      x1: sx(dividerX1),
      y1: sy(dividerY1),
      x2: sx(dividerX2),
      y2: sy(dividerY2),
      class: "divider"
    });

    const badgeText = set(element("text"), {
      x: sx(badgeX),
      y: sy(badgeY),
      class: "stage-number"
    });
    badgeText.textContent = number;

    group.appendChild(rect);
    group.appendChild(separator);
    group.appendChild(badgeText);

    for (const [content, x, y, alignment] of lines) {
      const title = set(element("text"), {
        x: sx(x),
        y: sy(y),
        class: "node-title",
        "text-anchor": alignment,
        "font-size": fontSize
      });
      title.textContent = content;
      group.appendChild(title);
    }

    nodeLayer.appendChild(group);
  };

  for (const record of data) {
    const [kind, first, second, third, fourth, fifth, sixth] = record;
    if (kind === "edge") drawEdge(first, second);
    if (kind === "guide") drawGuide(first);
    if (kind === "note") drawNote(first, second, third, fourth);
    if (kind === "node") drawNode(first, second, third, fourth, fifth, sixth);
  }

  svg.setAttribute("data-label-padding", labelPadding);
} catch (error) {
  const svg = document.getElementById("diagram");
  const namespace = "http://www.w3.org/2000/svg";
  const fallbackRecord = data.find(([kind]) => kind === "fallback");
  const [, ...fallbackLines] = fallbackRecord;

  while (svg.lastElementChild &&
         !["title", "desc"].includes(svg.lastElementChild.localName)) {
    svg.removeChild(svg.lastElementChild);
  }

  for (const [content, x, y] of fallbackLines) {
    const text = document.createElementNS(namespace, "text");
    text.setAttribute("x", sx(x));
    text.setAttribute("y", sy(y));
    text.setAttribute("class", "fallback");
    text.setAttribute("font-size", fontSize);
    text.textContent = content;
    svg.appendChild(text);
  }
}
</script>
</body>
</html>
