<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Два слоя провенанса</title>
<style>
:root {
  color-scheme: light dark;
  --page: #f7f5ef;
  --panel: #fffdf8;
  --ink: #17212b;
  --muted: #596773;
  --line: #7d8992;
  --image: #d9ecf7;
  --image-detail: #78a9c2;
  --manifest: #eee8ff;
  --manifest-line: #7a67a8;
  --signal: #087f5b;
  --signal-fill: #d8f5e8;
  --danger: #bd3131;
  --danger-fill: #fbe1df;
  --process: #fff0c7;
  --process-line: #a56b00;
  --shadow: #d9d5ca;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #12171c;
    --panel: #1b232a;
    --ink: #edf3f7;
    --muted: #aebbc4;
    --line: #7c8b95;
    --image: #203c4b;
    --image-detail: #72abc6;
    --manifest: #312944;
    --manifest-line: #ad98e3;
    --signal: #70d8b1;
    --signal-fill: #173e32;
    --danger: #ff8585;
    --danger-fill: #482527;
    --process: #3d321c;
    --process-line: #e1ad4e;
    --shadow: #0b0e11;
  }
}
html, body {
  background: var(--page);
  color: var(--ink);
}
body {
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}
figure {
  background: var(--page);
  border: 1px solid var(--line);
  padding: 12px;
}
h1 {
  font-size: 20px;
  text-align: center;
}
#fallback {
  color: var(--danger);
  font-size: 15px;
  text-align: center;
}
svg {
  display: block;
  width: 100%;
  height: auto;
  max-height: 440px;
  background: var(--page);
}
.frame, .card, .image-box, .manifest-box, .process-box {
  stroke-width: 2px;
  vector-effect: non-scaling-stroke;
}
.frame, .card {
  fill: var(--panel);
  stroke: var(--line);
}
.image-box {
  fill: var(--image);
  stroke: var(--image-detail);
}
.manifest-box {
  fill: var(--manifest);
  stroke: var(--manifest-line);
}
.process-box {
  fill: var(--process);
  stroke: var(--process-line);
}
.connector, .detail, .manifest-row {
  fill: none;
  stroke: var(--line);
  stroke-width: 2px;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}
.manifest-row {
  stroke: var(--manifest-line);
}
.arrow-line {
  fill: none;
  stroke: var(--ink);
  stroke-width: 2px;
  stroke-linecap: round;
  vector-effect: non-scaling-stroke;
}
.arrow-head {
  fill: var(--ink);
}
.mountain {
  fill: var(--image-detail);
  stroke: var(--image-detail);
  stroke-width: 1px;
}
.sun {
  fill: var(--process);
  stroke: var(--process-line);
  stroke-width: 2px;
}
.signal-ring {
  fill: var(--signal-fill);
  stroke: var(--signal);
  stroke-width: 2px;
}
.signal-dot {
  fill: var(--signal);
}
.seal {
  fill: var(--manifest-line);
  stroke: var(--manifest-line);
  stroke-width: 2px;
}
.danger-fill {
  fill: var(--danger-fill);
  stroke: var(--danger);
  stroke-width: 2px;
}
.cross {
  fill: none;
  stroke: var(--danger);
  stroke-width: 3px;
  stroke-linecap: round;
  vector-effect: non-scaling-stroke;
}
.heading {
  fill: var(--ink);
  font-size: 17px;
  font-weight: bold;
}
.label {
  fill: var(--ink);
  font-size: 14px;
}
.small {
  fill: var(--muted);
  font-size: 12px;
}
.micro {
  fill: var(--ink);
  font-size: 10px;
}
.signal-text {
  fill: var(--signal);
  font-size: 12px;
  font-weight: bold;
}
.danger-text {
  fill: var(--danger);
  font-size: 12px;
  font-weight: bold;
}
.process-text {
  fill: var(--ink);
  font-size: 13px;
  font-weight: bold;
}
.legend {
  fill: var(--ink);
  font-size: 13px;
}
</style>
</head>
<body>
<figure aria-labelledby="diagram-title">
  <h1 id="diagram-title">Два слоя провенанса: знак внутри и манифест рядом</h1>
  <p id="fallback">Схема должна показать файл со встроенным знаком и подписанным манифестом: перекодирование удаляет манифест, а целевая переработка может уничтожить знак.</p>
  <svg id="diagram" viewBox="0 0 960 410" width="960" height="410"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="svg-title svg-desc">
    <title id="svg-title">Два слоя провенанса</title>
    <desc id="svg-desc">Исходное изображение содержит внутренний водяной знак, а рядом с ним находится подписанный манифест C2PA. После перекодирования манифест пропадает, тогда как целевая переработка может уничтожить внутренний знак.</desc>
  </svg>
</figure>

<script>
const diagramData = [{
  zero: 0,
  origin: { x: 0, y: 0 },
  scale: { x: 1, y: 1 },

  source: { x: 28, y: 44, w: 326, h: 270 },
  sourceImage: { x: 50, y: 91, w: 178, h: 145 },
  sourceManifest: { x: 247, y: 91, w: 84, h: 145 },
  sourceTitle: { x: 191, y: 70 },
  sourceLayerOne: { x: 139, y: 262 },
  sourceLayerTwo: { x: 289, y: 262 },
  sourceNote: { x: 191, y: 292 },

  sourceSun: { x: 91, y: 125, r: 13 },
  sourceMountain: [[52, 216], [98, 160], [128, 192], [157, 145], [226, 216]],
  sourceGround: [[51, 216], [227, 216]],
  sourceSignal: { x: 139, y: 174, r: 25 },
  sourceSignalDots: [
    { x: 128, y: 174, r: 4 },
    { x: 139, y: 174, r: 4 },
    { x: 150, y: 174, r: 4 }
  ],
  sourceSignalCode: { x: 139, y: 207 },

  manifestFold: [[310, 92], [330, 112], [310, 112]],
  manifestRows: [
    [[258, 126], [319, 126]],
    [[258, 145], [315, 145]],
    [[258, 164], [321, 164]],
    [[258, 183], [310, 183]]
  ],
  manifestSeal: { x: 289, y: 211, r: 14 },
  manifestCheck: [[281, 211], [287, 217], [298, 204]],
  sourceLink: [[228, 164], [247, 164]],
  sourceLinkDot: { x: 237, y: 164, r: 4 },

  upperProcess: { x: 405, y: 75, w: 180, h: 58 },
  upperProcessText: { x: 495, y: 99 },
  upperProcessSub: { x: 495, y: 119 },
  lowerProcess: { x: 405, y: 245, w: 180, h: 58 },
  lowerProcessText: { x: 495, y: 269 },
  lowerProcessSub: { x: 495, y: 289 },

  arrows: [
    { line: [[354, 132], [397, 104]], head: [[397, 104], [384, 104], [390, 116]] },
    { line: [[585, 104], [642, 104]], head: [[642, 104], [629, 97], [629, 111]] },
    { line: [[354, 238], [397, 274]], head: [[397, 274], [385, 270], [391, 260]] },
    { line: [[585, 274], [642, 274]], head: [[642, 274], [629, 267], [629, 281]] }
  ],

  upperCard: { x: 650, y: 24, w: 278, h: 158 },
  upperTitle: { x: 789, y: 49 },
  upperImage: { x: 672, y: 66, w: 132, h: 82 },
  upperManifest: { x: 827, y: 66, w: 76, h: 82 },
  upperMountain: [[674, 139], [707, 101], [733, 125], [758, 91], [802, 139]],
  upperSignal: { x: 739, y: 118, r: 17 },
  upperSignalDots: [
    { x: 731, y: 118, r: 3 },
    { x: 739, y: 118, r: 3 },
    { x: 747, y: 118, r: 3 }
  ],
  upperManifestRows: [
    [[837, 88], [893, 88]],
    [[837, 105], [890, 105]],
    [[837, 122], [896, 122]]
  ],
  upperCrossOne: [[823, 61], [907, 153]],
  upperCrossTwo: [[907, 61], [823, 153]],
  upperImageLabel: { x: 738, y: 168 },
  upperManifestLabel: { x: 865, y: 168 },

  lowerCard: { x: 650, y: 214, w: 278, h: 158 },
  lowerTitle: { x: 789, y: 239 },
  lowerImage: { x: 680, y: 255, w: 218, h: 82 },
  lowerMountain: [[682, 328], [721, 293], [751, 314], [783, 278], [830, 310], [896, 328]],
  lowerAttack: { x: 789, y: 296, r: 24 },
  lowerCrossOne: [[771, 278], [807, 314]],
  lowerCrossTwo: [[807, 278], [771, 314]],
  lowerCaption: { x: 789, y: 358 },

  legendRule: [[28, 388], [928, 388]],
  legendInside: { x: 45, y: 405 },
  legendBeside: { x: 507, y: 405 },
  legendSignalDot: { x: 32, y: 401, r: 5 },
  legendManifestDot: { x: 494, y: 401, r: 5 }
}];

const [d] = diagramData;
const origin = d.origin;
const scale = d.scale;
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const svg = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");

  const make = (name, attrs, className, content) => {
    const node = document.createElementNS(svg.namespaceURI, name);
    Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
    if (className) node.setAttribute("class", className);
    if (content) node.textContent = content;
    svg.appendChild(node);
    return node;
  };

  const box = (item, className) => make("rect", {
    x: sx(item.x),
    y: sy(item.y),
    width: sx(item.w) - sx(d.zero),
    height: sy(item.h) - sy(d.zero)
  }, className);

  const segment = (points, className) => {
    const [[xOne, yOne], [xTwo, yTwo]] = points;
    return make("line", {
      x1: sx(xOne),
      y1: sy(yOne),
      x2: sx(xTwo),
      y2: sy(yTwo)
    }, className);
  };

  const polygon = (points, className) => make("polygon", {
    points: points.map(([x, y]) => `${sx(x)},${sy(y)}`).join(" ")
  }, className);

  const circle = (item, className) => make("circle", {
    cx: sx(item.x),
    cy: sy(item.y),
    r: sx(item.r) - sx(d.zero)
  }, className);

  const label = (item, content, className, anchor) => make("text", {
    x: sx(item.x),
    y: sy(item.y),
    "text-anchor": anchor
  }, className, content);

  const arrow = item => {
    segment(item.line, "arrow-line");
    polygon(item.head, "arrow-head");
  };

  d.arrows.forEach(arrow);

  box(d.source, "frame");
  label(d.sourceTitle, "Исходный файл и его провенанс", "heading", "middle");

  box(d.sourceImage, "image-box");
  circle(d.sourceSun, "sun");
  polygon(d.sourceMountain, "mountain");
  segment(d.sourceGround, "detail");
  circle(d.sourceSignal, "signal-ring");
  d.sourceSignalDots.forEach(item => circle(item, "signal-dot"));
  label(d.sourceSignalCode, "короткий сигнал", "micro", "middle");

  box(d.sourceManifest, "manifest-box");
  polygon(d.manifestFold, "card");
  d.manifestRows.forEach(item => segment(item, "manifest-row"));
  circle(d.manifestSeal, "seal");
  polygon(d.manifestCheck, "card");

  segment(d.sourceLink, "connector");
  circle(d.sourceLinkDot, "signal-dot");

  label(d.sourceLayerOne, "ВНУТРИ: Stable Signature", "signal-text", "middle");
  label(d.sourceLayerTwo, "РЯДОМ: манифест C2PA", "small", "middle");
  label(d.sourceNote, "автор · модель · дата · последовательность правок · подпись", "small", "middle");

  box(d.upperProcess, "process-box");
  label(d.upperProcessText, "ПЕРЕКОДИРОВАНИЕ", "process-text", "middle");
  label(d.upperProcessSub, "площадка срезает метаданные", "small", "middle");

  box(d.lowerProcess, "process-box");
  label(d.lowerProcessText, "ЦЕЛЕВАЯ ПЕРЕРАБОТКА", "process-text", "middle");
  label(d.lowerProcessSub, "атака на встроенный сигнал", "small", "middle");

  box(d.upperCard, "card");
  label(d.upperTitle, "Слои разъединились", "heading", "middle");
  box(d.upperImage, "image-box");
  polygon(d.upperMountain, "mountain");
  circle(d.upperSignal, "signal-ring");
  d.upperSignalDots.forEach(item => circle(item, "signal-dot"));

  box(d.upperManifest, "manifest-box");
  d.upperManifestRows.forEach(item => segment(item, "manifest-row"));
  segment(d.upperCrossOne, "cross");
  segment(d.upperCrossTwo, "cross");
  label(d.upperImageLabel, "знак найден", "signal-text", "middle");
  label(d.upperManifestLabel, "история удалена", "danger-text", "middle");

  box(d.lowerCard, "card");
  label(d.lowerTitle, "Сигнал стал мишенью", "heading", "middle");
  box(d.lowerImage, "image-box");
  polygon(d.lowerMountain, "mountain");
  circle(d.lowerAttack, "danger-fill");
  segment(d.lowerCrossOne, "cross");
  segment(d.lowerCrossTwo, "cross");
  label(d.lowerCaption, "встроенный знак может исчезнуть", "danger-text", "middle");

  segment(d.legendRule, "connector");
  circle(d.legendSignalDot, "signal-dot");
  label(d.legendInside, "Знак сохраняет короткую связь с источником", "legend", "start");
  circle(d.legendManifestDot, "seal");
  label(d.legendBeside, "Манифест объясняет путь файла, пока остаётся рядом", "legend", "start");

  fallback.hidden = true;
} catch (error) {
  const fallback = document.getElementById("fallback");
  fallback.hidden = false;
  fallback.textContent = "Схема: в файле находится устойчивый короткий знак, рядом — подписанный журнал C2PA. Перекодирование может удалить журнал, а целевая переработка — уничтожить знак.";
}
</script>
</body>
</html>
