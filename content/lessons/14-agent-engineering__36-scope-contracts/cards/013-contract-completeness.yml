- concept: полнота контракта проверяется до первого изменения файлов, потому что при неполном контракте результат работы невозможно оценить постфактум
  question: Почему полноту полей контракта проверяют до запуска агента, а не вместе с разбором готового diff?
  explanation: Проверка объёма сравнивает результат с границами. Если границ нет, сравнивать не с чем — и обнаруживается это уже после потраченного времени и спорных касаний. Дешёвая проверка полноты стоит перед дорогой работой.
  kind: choice
  options:
    - Потому что после работы файлы уже изменены и проверка глобов технически невозможна
    - 'Потому что при неполном контракте нет основания для вердикта: работа уже потрачена, а честно оценить её результат нечем'
    - Потому что diff может оказаться слишком большим для разбора
    - Потому что контракт после запуска агента доступен только на чтение
  correct: 1
  id: 013-contract-completeness-2
  fingerprint: 65b03b5e
- concept: пробел в контракте и нарушение объёма — разные состояния с разными адресатами исправления
  question: 'Агент останавливается с сообщением: в контракте не задан список запрещённых путей. Ни один файл ещё не изменён. Как классифицировать эту остановку?'
  explanation: Нарушение объёма — свойство результата (файл вне границ). Пробел — свойство самого контракта. Первое чинит исполнитель откатом, второе чинит автор контракта дописыванием границы. Повторный запуск с тем же документом ничего не меняет.
  kind: choice
  options:
    - 'Как нарушение объёма: агент вышел за границы и должен откатить изменения'
    - 'Как пробел в контракте: исправлять нужно документ, а не результат работы'
    - 'Как ложное срабатывание: без изменённых файлов нарушения быть не может, проверку следует пропустить'
    - Как отказ агента, который снимается повторным запуском с тем же контрактом
  correct: 1
  id: 013-contract-completeness-3
  fingerprint: '22517e01'
