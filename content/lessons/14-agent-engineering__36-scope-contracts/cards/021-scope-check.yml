- concept: обещанная в контракте команда приёмки без записи о фактическом запуске даёт нарушение, а не нейтральный пропуск
  question: В контракте перечислены 5 команд приёмки, в записи прогона зафиксированы 4 из них — все с успешным результатом. Как проверщик объёма обязан обойтись с пятой командой?
  explanation: 'Проверщик работает с наблюдаемыми фактами. Отсутствие записи о запуске — это не свидетельство успеха и не мелочь: обещание из контракта осталось непроверенным. Запускать команду самому проверщику нельзя, иначе он перестанет быть детерминированной проверкой над готовой записью. Пробел в контракте — другое состояние: там команда не названа вовсе.'
  kind: choice
  options:
    - Считать её невыполненной и добавить помеченную находку — учитывается только зарегистрированный запуск
    - 'Пропустить: остальные команды прошли, значит покрытие достаточное'
    - Запустить недостающую команду самому и добавить результат в запись прогона
    - Пометить контракт неполным и вернуть отчёт о пробеле в контракте
