- concept: 'внутренний порядок работы проверщика: полнота контракта, классификация путей, сверка обещанных команд, вывод вердикта'
  question: Расставь шаги функции проверки объёма в порядке выполнения.
  explanation: 'Полнота контракта идёт первой: при неизвестных границах классификация путей бессмысленна. Классификация и сверка команд наполняют один общий список находок — обе оси нарушений равноправны. Вердикт всегда последний, потому что он лишь читает накопленное.'
  kind: order
  items:
    - 'Проверить полноту контракта: незаполненные обязательные поля сами становятся находками'
    - Классифицировать каждый изменённый путь из записи прогона по разрешающим и запрещающим глобам
    - Разложить результаты по спискам отчёта и добавить помеченную находку с причиной для каждого недопустимого пути
    - Сверить обещанные в контракте команды приёмки с командами, фактически зафиксированными в записи прогона
    - Вывести итоговый флаг прохождения из накопленного списка находок
  id: 021-scope-check-3
  fingerprint: 11e0d300
