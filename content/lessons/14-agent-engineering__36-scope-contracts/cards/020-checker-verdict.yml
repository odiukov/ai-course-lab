- concept: проверка объёма — детерминированное сопоставление путей с глобами, не требующее модели и разбора содержимого файлов
  question: Объясни своими словами, почему проверщику объёма не нужны ни языковая модель, ни чтение содержимого изменённых файлов.
  explanation: Дешевизна и детерминированность — прямое следствие того, что предмет проверки чисто структурный. Как только проверщику потребовалось бы «понимать» изменение, он потерял бы воспроизводимость и перестал бы годиться в гейт.
  kind: open
  reference: 'Вход проверщика — множество изменённых путей, списки разрешающих и запрещающих глобов и запись о фактически выполненных командах. Всё это сопоставление строк с шаблонами: результат зависит только от входа, повторяется от запуска к запуску и стоит миллисекунды. Смысл кода в вердикт не входит — вопрос «полезно ли изменение» решает приёмка и человек, а проверщик отвечает только на вопрос «попал ли путь в согласованные границы».'
  id: 020-checker-verdict-2
  fingerprint: a5d7605b
