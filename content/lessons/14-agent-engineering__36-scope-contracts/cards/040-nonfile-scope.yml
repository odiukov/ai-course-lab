- concept: сетевой выход к неперечисленному хосту — выход за объём даже при полностью чистом diff
  question: Объясни своими словами, почему обращение агента к внешнему хосту, которого нет в `network_egress`, считается нарушением объёма, даже если ни один файл вне разрешённых глобов не изменён.
  explanation: Диффом такое нарушение не ловится вовсе, поэтому ограничение по хостам живёт в контракте рядом с файловыми глобами и бюджетом времени.
  kind: open
  reference: 'Сеть — отдельное измерение объёма. Запрос наружу может выгрузить контекст задачи, втянуть в работу данные неизвестного происхождения или создать скрытую зависимость от чужого сервиса; ничего из этого не видно в списке изменённых файлов. Хост вне allowlist находится вне объёма ровно так же, как путь вне allowed_files, поэтому файловые глобы необходимы, но недостаточны: спрашивать надо сразу, где задача писала, сколько длилась и с кем связывалась.'
