- concept: расширить объём — полномочие человека; автоматика при нарушении только останавливает и спрашивает, поэтому у нарушения два законных исхода
  question: Объясни своими словами, почему нарушение объёма поднимает interrupt с решением человека, а не расширяет контракт автоматически, когда изменение выглядит технически обоснованным.
  explanation: 'Это делает контракт действующим механизмом, а не текстом «для сведения»: до работы он ограничивает действие, после работы — слияние, а в спорной точке передаёт полномочие человеку.'
  kind: open
  reference: 'У нарушения два законных исхода: контракт действительно был слишком узок и его расширяют осознанно, либо прав контракт и агент отступает, отменяя лишнее изменение. Выбрать между ними может только человек. Если бы автоматика расширяла объём сама, гейт снимал бы собственное ограничение по правдоподобному объяснению агента — то есть перестал бы быть ограничением. Interrupt встроен заранее, но новых прав он не выдаёт: он останавливает и передаёт решение.'
