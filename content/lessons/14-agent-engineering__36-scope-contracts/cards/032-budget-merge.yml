- concept: 'approvals_required объединяются с устранением дубликатов: требование одной стороны не отменяется молчанием другой'
  question: Проектный контракт требует одобрения перед `rotate_secrets` и `delete_bucket`. Задачный контракт требует одобрения перед `rotate_secrets`. Каким будет список approvals_required после слияния?
  explanation: 'Требования одобрения накапливаются: молчание одной стороны про `delete_bucket` не снимает защиту, поставленную другой. Пересечение (вариант 1) сняло бы охрану `delete_bucket` — это выдача новых полномочий из слияния, чего быть не может. Повтор одного и того же требования не удваивает границу: достаточно одной записи.'
  kind: choice
  options:
    - '`rotate_secrets` и `delete_bucket`, каждое по одному разу'
    - Только `rotate_secrets` — как общее для обеих сторон
    - '`rotate_secrets` дважды и `delete_bucket` один раз — по числу требований'
    - 'Пустой список: задачный контракт не подтвердил `delete_bucket`'
  correct: 0
  id: 032-budget-merge-2
  fingerprint: b01880a0
- concept: требование одобрения срабатывает в момент подхода к соответствующей границе, а не собирается заранее одним пакетом
  question: После слияния approvals_required содержит `change_schema` и `deploy_to_prod`. Задача при этом схему не трогает. Когда рантайм обязан запрашивать человека?
  explanation: 'Список одобрений перечисляет границы, а не обязательные шаги. Запрос привязан к пересечению границы: если `change_schema` в задаче не наступает, подпись не нужна. Сбор подписей заранее превращает одобрение в формальность на действие, которого может не быть, а подпись постфактум приходит, когда действие уже совершено — обе схемы ломают смысл поля.'
  kind: choice
  options:
    - Один раз до старта — собрать обе подписи, иначе агент не запускается
    - Только когда агент собирается выполнить конкретное защищённое действие; неиспользованное требование запроса не порождает
    - После окончания работы — вместе с diff, чтобы человек подписал всё разом
    - 'Не запрашивать вовсе: наличие пункта в контракте уже фиксирует согласие'
