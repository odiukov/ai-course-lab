- concept: статическая проверка вложенности наборов шаблонов до работы и сопоставление фактических путей после — две разные проверки
  question: Чем проверка «разрешённые пути контракта лежат внутри области активной работы» отличается от проверки изменённых файлов по контракту?
  explanation: 'Разные входы и разные моменты: у первой на входе только объявленные границы, у второй — список того, что реально тронуто. Поэтому одна не заменяет другую: контракт может быть корректно вложен и при этом нарушен на практике, а безупречный прогон по невалидному контракту всё равно не даёт права на затронутую область.'
  kind: choice
  options:
    - Первая сравнивает два набора шаблонов и выполнима до любых изменений; вторая сравнивает фактические пути прогона с шаблонами и возможна только после работы
    - 'Ничем: обе сравнивают фактически изменённые файлы, просто в разные моменты'
    - Первая нужна только тогда, когда вторая по каким-то причинам не запускалась
