- concept: порог бюджета отделяет предупреждающую часть нарушений от блокирующей внутри одного прогона
  question: Контракт задаёт бюджет нарушений, равный 6. Проверка объёма нашла в прогоне 10 путей вне объёма, все одинаковой серьёзности. Сколько из них выходят за бюджет и переводят гейт в отказ?
  explanation: 'Бюджет — порог, а не признак «есть нарушения или нет»: 6 находок укладываются в допуск и остаются предупреждениями, оставшиеся 10 − 6 = 4 превышают его и дают отказ. Все 10 при этом остаются в отчёте как выходы за объём.'
  kind: numeric
  answer: 4
  tolerance: 0.5
  id: 038-violation-budget-2
  fingerprint: 1389608c
- concept: бюджет нарушений назначается на единицу работы, поэтому дробление работы на задачи умножает суммарный допуск
  question: Команда выдаёт violationBudget = 4 на задачу. Инженер разбивает одну работу на 4 задачи и прогоняет их подряд. Какое следствие верно?
  explanation: 'Бюджет — свойство задачи, а не репозитория и не истории. Значит выбор порога и выбор размера задачи — одно решение: мелкая нарезка при том же числе на задачу тихо расширяет суммарный допуск (4 × 4 = 16) без единой правки контракта.'
  kind: choice
  options:
    - 'Ничего не меняется: гейт складывает нарушения всех задач в общий счётчик'
    - 'Суммарный допуск по этой работе стал 16: бюджет отсчитывается на задачу, поэтому порог имеет смысл только вместе с тем, где проведены границы задач'
    - Гейт откажет уже на первой задаче, потому что бюджет один на репозиторий
    - 'Бюджет перестанет действовать: он применим только к одиночным задачам'
  correct: 1
  id: 038-violation-budget-3
