- concept: 'критерий, покрывающий только успешный путь, проходит и на неисправленном коде: нужны отрицательные и граничные случаи'
  question: Задача — починить вход после истечения сессии. В критериях приёмки стоит только «вход с верным паролем и активной сессией проходит успешно». В чём слабость такого набора?
  explanation: 'Счастливый путь работал и раньше — иначе задачи бы не было. Различить исправленное и сломанное состояние умеет только критерий, задевающий сам сломанный случай: истёкшая сессия, неверный пароль, отсутствие созданной сессии после отказа.'
  kind: choice
  options:
    - Критерий проверяет способ работы агента, а не результат
    - 'Критерий выполнялся и до починки: он не касается истёкшей сессии и неверного пароля, то есть проходит на сломанном коде'
    - Критерий нельзя выполнить вручную, требуется автоматический тест
    - Критерий дублирует формулировку цели и потому избыточен
  correct: 1
