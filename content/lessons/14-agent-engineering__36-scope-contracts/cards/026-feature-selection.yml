- concept: критерий включения работы в сессию — принадлежность выбранной единице работы, а не полезность или дешевизна попутного дела
  question: Сессия начата под одну запись бэклога. По ходу выясняется, что соседняя запись очереди сейчас делается почти бесплатно и логично продолжает первую. Какое действие соответствует правилу одной работы за сессию?
  explanation: Дешевизна и логичность продолжения — свойства момента, а не основания для включения работы в сессию. Граница проходит между выбранной записью и всей остальной очередью; иначе очередь перестаёт что-либо упорядочивать.
  kind: choice
  options:
    - Делать только выбранную запись; соседняя остаётся пунктом очереди
    - Сделать обе, раз соседняя обходится дешевле именно сейчас
    - Сделать соседнюю первой, если она меньше по объёму
  correct: 0
  id: 026-feature-selection-1
  fingerprint: d389ce29
- concept: условие приёмки перестаёт давать однозначный ответ, если одна сессия обслуживает две цели
  question: Сессия попутно захватила вторую запись бэклога. Почему это ломает приёмку выбранной работы?
  explanation: 'Условие приёмки написано под одну цель. Когда в одном изменении смешаны две работы, прохождение условия не отделяет сделанное от недоделанного: часть изменений оно вообще не описывает. Размер и длительность сами по себе приёмку не портят.'
  kind: choice
  options:
    - 'Условие завершения выбранной записи больше не отвечает на вопрос «готово или нет»: итоговое изменение содержит части, к которому это условие не относится'
    - Условие завершения перестаёт работать, потому что итоговое изменение стало длиннее
    - Условие завершения перестаёт работать, потому что сессия длилась дольше обычного
  correct: 0
  id: 026-feature-selection-2
  fingerprint: 1ad77707
- concept: фиксация наблюдения о будущей работе не равна её началу; началом являются смена статуса, отдельный контракт или код
  question: По ходу сессии обнаружилось, что соседней записи бэклога понадобится доработка. Что допустимо сделать прямо сейчас?
  explanation: 'Заметка ничего не начинает: она сохраняет знание. Смена статуса, отдельный контракт и код — это уже заявка на текущую работу и переход к двум целям в одной сессии. Разница именно в том, меняется ли состояние доски и репозитория.'
  kind: choice
  options:
    - Записать наблюдение для следующей сессии, оставив статус соседней записи прежним
    - Перевести соседнюю запись в статус «в работе», чтобы не забыть о находке
    - Завести под соседнюю запись отдельный контракт и внести минимальную правку кода
  correct: 0
  id: 026-feature-selection-3
  fingerprint: a1f5c0cb
