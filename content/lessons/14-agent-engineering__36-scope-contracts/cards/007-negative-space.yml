- concept: запрет формулируется через пути, потому что проверка выполняется над множеством изменённых файлов, а не над намерением автора
  question: 'Автор контракта говорит: «Заполнять forbidden_files незачем — эти каталоги и так не относятся к задаче». Объясни, почему запрет всё равно записывают явно.'
  explanation: 'Поле forbidden_files пропускают чаще всего именно потому, что перечисленное там кажется очевидным. Оно и ловит случайное: запись `app/**/*.py` без запрета `migrations/**` рано или поздно даёт миграцию внутри разрешённого пространства.'
  kind: open
  reference: 'Цель контракта формулируется как намерение, но проверка объёма выполняется над конкретными путями изменённых файлов. Пока каталог не назван глобом, у проверки нет способа отличить его от любого другого файла внутри разрешённого пространства: «не относится к задаче» существует в голове автора, а не в контракте. Явная запись превращает подразумеваемое ограничение в машинно проверяемое условие и переживает смену исполнителя и сессии.'
