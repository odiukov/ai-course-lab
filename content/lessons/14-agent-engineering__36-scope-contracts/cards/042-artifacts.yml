- concept: отчёт фиксирует применение правил, но не задаёт их, поэтому закрытый контракт архивируют как неизменяемую вторую половину доказательства
  question: Отчёт проверки объёма сохранён, но файл закрытого контракта был перезаписан следующей задачей. Объясни своими словами, что при этом потеряно.
  explanation: Тогда зелёная галочка означает не расплывчатое «когда-то было нормально», а «нормально относительно вот этого контракта и вот этого diff».
  kind: open
  reference: 'Потерян источник правил. Отчёт фиксирует, как границы были применены, но сами границы задаёт контракт; без его версии на момент прогона непонятно, относительно чего вынесен вердикт и почему один путь прошёл, а другой нет. Поэтому закрытые контракты переносят в архив как неизменяемую историю: доказательство состоит из двух частей — обещания задачи и записи его проверки, и по отдельности каждая неполна.'
