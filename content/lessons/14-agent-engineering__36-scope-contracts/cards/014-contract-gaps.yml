- concept: детерминированный порядок элементов отчёта делает вывод сравнимым между запусками и пригодным для тестов
  question: Зачем требовать от проверки контракта фиксированный порядок полей в возвращаемом списке пробелов?
  explanation: Плавающий порядок (например, из обхода словаря) заставляет тесты сравнивать множества и мешает сличать вывод двух прогонов. Детерминированный порядок — свойство удобства проверки, а не правило заполнения контракта.
  kind: choice
  options:
    - Порядок задаёт очерёдность, в которой автор обязан заполнять поля
    - 'Порядок определяет приоритет: первое поле важнее остальных'
    - Одинаковый вход даёт одинаковый выход, поэтому сообщения сравнимы между запусками, а тест можно писать на точный список
    - Без фиксированного порядка список нельзя сериализовать в JSON
  correct: 2
