- concept: проверка контракта собирает все пробелы за один проход, а не прерывается на первом найденном
  question: В контракте одновременно пусты `goal`, `allowed_files` и `forbidden_files`. Почему функция проверки возвращает все три имени, а не выходит сразу после первого?
  explanation: 'Ранний выход превращает одну проверку в серию: исправил поле — запустил снова — узнал про следующее. Полный список пробелов даёт один цикл правок вместо трёх.'
  kind: choice
  options:
    - Чтобы автор исправил документ за один проход, а не узнавал о следующем пробеле после каждого повторного запуска
    - Чтобы длина списка служила оценкой качества контракта
    - Чтобы порядок исправления полей был выбран автоматически
    - Чтобы проверка успела выполниться до того, как агент начнёт писать файлы
