- concept: 'порядок конвейера: задача, контракт, цикл агента, diff, проверка объёма, вердикт'
  question: Расставь этапы прохождения задачи от постановки до допуска на проверку работоспособности.
  explanation: Артефактом цикла агента становится diff, а не рассказ о работе. В проверщик сходятся две линии — контракт и diff, — поэтому вердикт об объёме выносится до проверки работоспособности. При выходе за границы поток вместо гейта верификации получает блокировку и открытый вопрос человеку.
  kind: order
  items:
    - Задача превращается в контракт объёма
    - Контракт попадает в цикл агента и задаёт границы работы
    - Цикл агента выдаёт итоговый diff — список фактических изменений
    - Проверщик получает diff и тот же контракт и сопоставляет их
    - При вердикте «в объёме» результат уходит на гейт верификации
  id: 005-contract-flow-1
  fingerprint: 8de81863
- concept: проверка объёма и проверка работоспособности отвечают на разные вопросы
  question: Исправление рабочее, вся приёмка зелёная, но diff трогает каталог вне разрешённых границ. Что происходит дальше?
  explanation: Схема разделяет вопросы «сделали ли мы обещанное?» и «сделали ли мы это правильно?». Зелёные тесты отвечают только на второй. Изменение не становится допустимым оттого, что оно полезно или помогает тестам. Решение — расширить контракт, убрать изменение или выделить его в отдельную задачу — принимает человек, а не проверщик.
  kind: choice
  options:
    - 'Результат проходит: зелёная приёмка доказывает допустимость изменения'
    - Поток останавливается, появляется блокировка и открытый вопрос человеку
    - Проверщик сам удаляет лишний файл из diff и пропускает остальное
  correct: 1
  id: 005-contract-flow-2
  fingerprint: d8b12c1f
