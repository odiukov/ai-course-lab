- concept: направление операции слияния для поля задаётся тем, выдаёт поле полномочия или ограничивает их
  question: Почему при слиянии контрактов одни поля пересекаются, другие объединяются, а числовой бюджет берётся по минимуму?
  explanation: 'Единого правила по всем полям быть не может: объединить разрешающие списки — значит выдать права, которых одна сторона не давала, а пересечь запреты — снять защиту. Общий инвариант один: наименьшие привилегии. Из него для каждого поля механически выводится своя операция.'
  kind: choice
  options:
    - Операция подбирается так, чтобы итог не давал полномочий больше, чем любой исходный контракт; поля, выдающие права, сужаются, ограничивающие — расширяются
    - 'Операция определяется типом значения: списки объединяются, числа минимизируются'
    - Поля разрешений меняются реже остальных, поэтому именно их сужают
    - Так итоговый контракт получается компактнее исходных
