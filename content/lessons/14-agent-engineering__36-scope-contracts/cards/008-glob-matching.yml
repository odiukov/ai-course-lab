- concept: '`*` не пересекает разделитель каталогов, `**` охватывает произвольную вложенность'
  question: Контракт разрешает `app/*.py`. Агент изменил `app/billing/rates.py`. Совпадает ли путь с глобом?
  explanation: '`app/*.py` описывает Python-файлы непосредственно в `app`. Чтобы охватить вложенные модули, нужен `app/**/*.py`. Разница между одной и двумя звёздочками — типичный источник контрактов, которые кажутся широкими, а на деле не покрывают половину рабочих файлов.'
  kind: choice
  options:
    - 'Нет: одна звёздочка не пересекает границу каталога, для вложенности нужен `**`'
    - 'Да: звёздочка покрывает любые подкаталоги внутри `app`'
    - Да, потому что у файла нужное расширение `.py`
    - Зависит от того, существует ли каталог `app/billing` на диске
  correct: 0
  id: 008-glob-matching-1
  fingerprint: 11c484f0
- concept: глоб фиксирует признаки пути, объявленные значимыми; файл, потерявший их, выпадает из совпадения
  question: В контракте записан глоб `tests/checkout/test_*.py`. Сначала файл `tests/checkout/test_refund.py` переименовали в `tests/checkout/test_refund_flow.py`, затем перенесли в `tests/payments/refund_flow_test.py`. Что произойдёт с совпадением на каждом шаге и почему глоб устроен именно так?
  explanation: 'Полезный вопрос при записи контракта: что здесь должно оставаться стабильным — конкретное имя файла или роль пути в репозитории. Слишком узкий шаблон врёт после первого рефакторинга, слишком широкий перестаёт удерживать границу.'
  kind: open
  reference: 'После переименования совпадение сохраняется: шаблон удерживает каталог `tests/checkout`, префикс `test_` и расширение `.py`, а меняющийся хвост имени заменяет звёздочка. После переноса совпадения нет: изменились каталог и префикс — ровно те признаки, которые автор объявил значимыми. Глоб описывает семейство путей по устойчивым признакам: он переживает косметические переименования, но не расширяется до произвольных файлов, иначе граница объёма исчезнет.'
  id: 008-glob-matching-2
  fingerprint: 761c025f
