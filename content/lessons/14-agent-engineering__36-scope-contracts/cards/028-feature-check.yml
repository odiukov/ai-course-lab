- concept: отсутствие доступной работы — корректное состояние без выбора, отличное от отказа старта по противоречию
  question: Все записи бэклога имеют статус «готово», указатель активной работы пуст. Что должно произойти на старте?
  explanation: 'Инвариант требует согласованности указателя и статусов, а не наличия работы. Пустая очередь этому условию удовлетворяет. Смешивать «нечего делать» с «состояние противоречиво» вредно: у них разные адресаты — в первом случае нужен новый пункт в бэклоге, во втором исправление доски.'
  kind: choice
  options:
    - 'Выбора нет: состояние корректно, функция сообщает, что брать нечего'
    - 'Отказ старта: раз выбрать нечего, инвариант нарушен'
    - Переоткрыть последнюю готовую запись, чтобы сессии было чем заняться
  correct: 0
