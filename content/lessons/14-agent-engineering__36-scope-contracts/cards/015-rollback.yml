- concept: откат кода не возвращает изменённое состояние данных, поэтому план отката обязан отдельно описывать данные и схему
  question: 'Задача переименовывает колонку `created` в `created_at` с миграцией. В плане отката записано: «развернуть предыдущую версию приложения». Что здесь не покрыто?'
  explanation: Код возвращается одним действием, состояние — нет. После работы новой версии значения живут в новой колонке; откат одного лишь приложения даёт рабочую старую версию поверх непригодных для неё данных.
  kind: choice
  options:
    - 'Ничего: предыдущая версия приложения работала до задачи, значит откат полный'
    - 'Не покрыты данные и схема: старая версия ищет прежнюю колонку, а значения уже записаны в новую'
    - Не покрыт список запрещённых файлов, без которого откат нельзя проверить
    - Не покрыт идентификатор задачи, по которому находят предыдущий деплой
  correct: 1
  id: 015-rollback-1
  fingerprint: cc90134d
- concept: 'шаги отката неперестановочны: план отката задаёт порядок действий над состоянием, а не набор действий'
  question: Расставь шаги отката переименования колонки в безопасном порядке.
  explanation: 'Переносить данные под работающей записью бессмысленно — новые значения появятся после копирования. Возвращать старую версию до переноса значит открыть её на неполных данных. Удаление колонки идёт последним: до подтверждения успеха это единственная копия части значений.'
  kind: order
  items:
    - Прекратить запись в новую колонку
    - Перенести значения из новой колонки обратно в старую
    - Развернуть предыдущую версию приложения
    - Удалить новую колонку из схемы
  id: 015-rollback-2
  fingerprint: 9d4466e4
- concept: невозможность описать безопасный путь назад означает, что последствия изменения ещё не поняты, а не что откат не понадобится
  question: Автор контракта оставил `rollback_plan` пустым, сказав, что откат не понадобится. Объясни своими словами, почему пустое поле отката — это сигнал риска, а не экономия времени.
  explanation: Написание плана отката — дешёвая проверка на честность оценки. Она проводится до работы и часто меняет решение о том, браться ли за задачу в такой формулировке.
  kind: open
  reference: 'План отката заставляет назвать всё изменяемое состояние: данные, схему, совместимость версий, порядок действий. Пока путь назад не описан, неизвестно, что именно ломается при остановке, — то есть неизвестен настоящий размер и риск задачи. Пустое поле не уменьшает риск, оно скрывает его: задача, выглядевшая как «переименовать», может оказаться многоэтапной миграцией. Контракт, из которого нельзя откатиться, не следует утверждать.'
  id: 015-rollback-3
  fingerprint: '64915199'
