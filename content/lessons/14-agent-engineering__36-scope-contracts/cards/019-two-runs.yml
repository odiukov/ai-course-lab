- concept: вердикт проверки объёма — свойство пары «контракт + запись конкретного прогона», а не характеристика агента
  question: Один и тот же агент дал прогон без нарушений и прогон с нарушением. Объясни своими словами, почему из этого нельзя сделать вывод «агент нарушает объём», и что вердикт на самом деле описывает.
  explanation: Вердикт вычисляется из записи прогона, а не из репутации исполнителя. Поэтому «плохой» прогон не объявляется целиком провальным и не даёт оценки агенту — он указывает расхождение, которое можно устранить точечно.
  kind: open
  reference: 'Проверка объёма высказывается не об исполнителе, а о конкретной паре: набор границ из контракта и фактическая запись одного прогона (изменённые пути плюс выполненные команды). Тот же агент с другим входом даёт другой вердикт, поэтому вердикт нельзя переносить с прогона на исполнителя. Практический смысл: отказ адресован конкретному diff и чинится изменением этого diff (или согласованным расширением контракта), а не заменой модели или ужесточением промпта.'
  id: 019-two-runs-2
