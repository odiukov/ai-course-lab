  question: Агент собирается обратиться к хосту, который не назван ни в одном контракте. При каком состоянии `network_egress` обращение допустимо?
  explanation: 'Allowlist замкнут: он не разрешает всё, кроме перечисленного, — он разрешает ровно перечисленное. Пустой список поэтому запрещает любой исходящий запрос, а непустой пропускает только свои хосты. Единственное состояние, в котором неупомянутый хост проходит, — отсутствие сетевого правила в контракте.'
