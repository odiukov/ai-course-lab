- concept: серьёзность выхода за объём приписывается семейству путей по возможному ущербу, а не выводится из самого факта несовпадения с глобами
  question: 'Прогон дал две записи вне объёма: `docs/CHANGELOG.md` и `migrations/add_index.sql`. Первая помечена как предупреждение, вторая блокирует merge. Откуда берётся разница?'
  explanation: Вердикт «вне объёма» одинаков для обоих путей, но реакция разная. Правка документации почти не влияет на поведение системы, миграция меняет данные, и эту разницу объявляет контракт, а не проверщик по расширению файла.
  kind: choice
  options:
    - Контракт связывает семейства путей с серьёзностью по возможному ущербу от изменения
    - Проверщик оценивает размер diff в каждом файле
    - 'Серьёзность выводится из расширения файла: `.sql` строже, чем `.md`'
    - Блокирует та запись, которая встретилась в diff последней
  correct: 0
  id: 039-severity-asymmetry-1
  fingerprint: f76b0ccf
- concept: блокирующая серьёзность не гасится остатком бюджета нарушений
  question: Бюджет нарушений задачи ещё не исчерпан, но агент записал файл в `config/prod/`, для которого контракт объявляет блокирующую серьёзность. Что делает merge-гейт?
  explanation: Бюджет и серьёзность — два независимых механизма. Бюджет терпит мелкие отклонения, серьёзность отмечает те семейства путей, где даже одно отклонение недопустимо.
  kind: choice
  options:
    - 'Отказывает: блокирующая серьёзность останавливает работу независимо от остатка бюджета'
    - Пропускает с предупреждением, пока бюджет не израсходован
    - Списывает нарушение из бюджета в двойном размере и пропускает
    - Понижает серьёзность до предупреждения, раз бюджет ещё есть
  correct: 0
  id: 039-severity-asymmetry-2
  fingerprint: 7bee691f
- concept: таблица серьёзностей принадлежит контракту, потому что цену ошибки задаёт конкретный проект и задача, а не код проверщика
  question: Объясни своими словами, почему сопоставление «семейство путей — серьёзность» хранят в контракте, а не зашивают в код проверщика объёма.
  explanation: 'Это тот же принцип, что и с глобами: правила объявляет контракт, проверщик их только исполняет — поэтому проверка остаётся детерминированной и пригодной для ревью.'
  kind: open
  reference: Риск изменения задаёт проект и конкретная задача, а не универсальное правило. В одной команде `docs/**` — необязательные заметки, в другой там лежат обязательные аварийные инструкции оператору, и выход туда должен блокировать. Проверщик обязан механически применить объявленную серьёзность, а не угадывать цену ошибки; иначе одинаковый код давал бы разную защиту в разных репозиториях и правило нельзя было бы менять от задачи к задаче.
  id: 039-severity-asymmetry-3
  fingerprint: 1fe443ae
