- concept: все проверки состояния выполняются до первой мутации, иначе отказ оставляет частично изменённую доску
  question: Расставь шаги функции выбора работы так, чтобы отказ никогда не оставлял бэклог частично изменённым.
  explanation: 'Единственная запись в конце делает функцию атомарной по наблюдаемому результату: либо все проверки прошли и состояние изменилось один раз, либо не изменилось вовсе. Если мутировать раньше проверок, отказ оставит новый статус вместе со старым и испортит инвариант, который функция должна была защищать.'
  kind: order
  items:
    - Собрать записи со статусом «в работе» и сверить их с указателем активной работы
    - При противоречивом состоянии вернуть отказ, не меняя ни одной записи
    - Если указатель совпадает с единственной активной записью — вернуть её без изменений
    - Иначе взять первую ожидающую запись в порядке файла
    - Присвоить ей статус «в работе», записать её идентификатор в указатель и вернуть её
  id: 027-pick-feature-1
  fingerprint: dd7d221f
- concept: 'повторный вызов выбора идемпотентен: возвращает тот же выбор, а не продвигает очередь'
  question: Функция выбора работы вызвана дважды подряд, между вызовами ничего не менялось. Каким должен быть второй результат?
  explanation: 'Если повторный вызов берёт следующую запись, одна сессия незаметно начинает вторую работу — ровно то, что функция должна предотвращать. Отказ тоже неверен: состояние корректно и однозначно, вызывающему нужно просто вернуть текущий выбор.'
  kind: choice
  options:
    - 'Тем же, что первый: возвращается уже выбранная запись, очередь не двигается'
    - Следующей ожидающей записью, чтобы работа продвигалась
    - Отказом, потому что выбор уже был сделан
  correct: 0
  id: 027-pick-feature-2
  fingerprint: a346acff
- concept: приоритет закодирован порядком записей в файле; выбирающий код не сортирует и не оценивает важность
  question: В бэклоге несколько ожидающих записей. Как функция должна определить, какую из них взять?
  explanation: 'Порядок записей — это и есть выраженный человеком приоритет. Собственная сортировка или оценка важности переносит решение о приоритетах в код и делает результат невоспроизводимым: одинаковый файл может дать разный выбор.'
  kind: choice
  options:
    - Взять первую ожидающую в порядке следования записей в файле
    - Взять самую маленькую по предполагаемому объёму работы
    - Оценить формулировки целей и взять наиболее важную
  correct: 0
