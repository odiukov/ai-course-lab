  fingerprint: 6caadcc6
- concept: результат слияния контрактов не зависит от порядка, потому что складывается из независимых сужений
  question: К задаче применимы три контракта. Влияет ли порядок их слияния на итоговые полномочия?
  explanation: 'Итог — совокупность условий, которым обязано удовлетворять действие, а перестановка условий множество допустимых действий не меняет. Поэтому вопрос «какой контракт победил» бессмысленен: победителя нет, и слияние можно проверять механически, не оговаривая приоритеты сторон.'
  kind: choice
  options:
    - 'Нет: каждое ограничение сужает результат независимо, поэтому итог одинаков при любом порядке'
    - 'Да: границы задаёт контракт, применённый последним'
    - 'Да: первый контракт задаёт основу, остальные уточняют её только до первого конфликта'
  correct: 0
