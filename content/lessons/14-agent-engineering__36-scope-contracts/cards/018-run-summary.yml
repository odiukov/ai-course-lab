- concept: 'границы вывода из сводки прогона: совместное присутствие файла и команды не доказывает покрытие изменений'
  question: В записи прогона рядом стоят изменение `auth/session.py` и выполненная команда `pytest tests/auth/test_session.py`. Что из этого НЕ следует?
  explanation: Сводка отвечает на вопрос «что изменили и чем это реально проверяли», а не на вопрос о покрытии. Приписывание ей вывода о покрытии — превращение слабого факта соседства в сильное утверждение о качестве тестов.
  kind: choice
  options:
    - Что файл был изменён в этом прогоне
    - Что названная команда действительно выполнялась в этом прогоне
    - Что тест покрывает каждую изменённую строку файла
    - Что изменение и проверка относятся к одной и той же работе
