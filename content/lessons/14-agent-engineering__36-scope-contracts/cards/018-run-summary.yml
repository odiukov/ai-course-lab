- concept: изменённые файлы и выполненные команды хранятся одной записью одного прогона, иначе неизвестна их взаимная очерёдность
  question: Почему список изменённых файлов и список выполненных проверок должны лежать в одной записи одного прогона, а не в двух отдельных журналах?
  explanation: Два независимых списка допускают чтение «тесты прошли» и «файл потом изменили» одновременно. Общая запись прогона фиксирует, что вот эти изменения и вот эти команды относятся к одной и той же работе.
  kind: choice
  options:
    - Чтобы уменьшить размер отчёта
    - 'Чтобы связать проверки с конкретной версией файлов: раздельные списки не показывают, запускались тесты после последней правки или до неё'
    - Чтобы список команд можно было сопоставить с разрешёнными глобами
    - Чтобы проверяющий видел авторов изменений
  correct: 1
