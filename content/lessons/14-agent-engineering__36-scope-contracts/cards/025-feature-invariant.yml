- concept: избыточное представление одного факта нужно, чтобы порча состояния обнаруживалась сверкой
  question: Указатель активной работы и статус записи по отдельности уже определяют, чем занята сессия. Зачем хранить оба, если это дублирование одного факта?
  explanation: 'Это обычный приём контроля целостности: избыточность обменивается на возможность обнаружить ошибку. Заметь, что сверка только обнаруживает расхождение, но не говорит, какая сторона права, — поэтому исправление остаётся за человеком.'
  kind: open
  reference: 'Дублирование даёт обнаружимость. Один источник истины принимает испорченное значение молча: сверять его не с чем, и любое записанное значение выглядит правильным. Два независимых представления одного факта можно сравнить, и расхождение превращается из невидимой порчи в явную ошибку, которую можно поймать до начала работы. Цена — необходимость поддерживать оба поля синхронными; выгода — рассогласование ловится проверкой, а не проявляется как непонятный итоговый результат.'
  id: 025-feature-invariant-2
  fingerprint: 6299cca7
