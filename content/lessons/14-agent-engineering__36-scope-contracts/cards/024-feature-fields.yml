- concept: идентификатор возможности — стабильный слаг, переживающий переформулировки названия и цели
  question: 'Формулировку возможности за неделю трижды уточняли: «умный поиск», «поиск по тексту», «поиск с ранжированием». Почему запись в бэклоге проекта опирается на отдельный стабильный идентификатор, а не на название?'
  explanation: Название описывает работу и потому меняется по мере уточнения. Ссылки из контракта задачи, отчётов и передачи между сессиями должны указывать на что-то неизменное, иначе одна работа распадётся на несколько несвязанных, а история потеряется.
  kind: choice
  options:
    - Идентификатор короче и экономит место в файле бэклога
    - Идентификатор удерживает личность работы при смене формулировок и позволяет ссылаться на неё из контрактов и истории
    - Идентификатор нужен только для сортировки записей в списке
    - Название нельзя менять после старта, поэтому идентификатор дублирует его на случай ошибки
  correct: 1
  id: 024-feature-fields-1
  fingerprint: 251f9947
- concept: 'цель и условие завершения отвечают на разные вопросы: что обещано против того, кто и по какому свидетельству объявляет работу законченной'
  question: В записи возможности уже есть проверяемая цель. Объясни своими словами, зачем нужно отдельное условие завершения и что происходит, если его не написать.
  explanation: 'Разница практическая: без записанного условия завершения «готово» решает исполнитель, и статус в бэклоге перестаёт что-либо значить для следующей сессии.'
  kind: open
  reference: 'Цель называет обещанный наблюдаемый результат — что появится, когда работа сделана. Условие завершения называет конкретное свидетельство, по которому статус переводится из «в работе» в «готово»: запускаемая команда или наблюдаемый факт, дающий одинаковый вердикт у разных проверяющих. Без него момент завершения остаётся на усмотрение исполнителя: «поиск работает хорошо» подтверждает сам агент, а «запрос возвращает ранжированные результаты со сниппетами» проверяет любой человек. То есть цель задаёт предмет обещания, условие завершения — правило приёмки и того, кто её выносит.'
  id: 024-feature-fields-2
  fingerprint: 3451e8a6
- concept: инвариант «не больше одной возможности в работе» плюс согласованность указателя активной возможности — стартовая проверка сессии
  question: В файле бэклога проекта две записи имеют статус «в работе». Что должно произойти в начале сессии?
  explanation: Инвариант «ровно одна возможность в работе, и указатель активной совпадает с ней» проверяется на старте. Две одновременно открытые записи означают, что доска не отражает реальность; выбирать за человека агент не должен, иначе он же и узаконит расползание.
  kind: choice
  options:
    - Агент выбирает более раннюю запись и продолжает, помечая вторую как заблокированную
    - Агент работает над обеими, пока их области файлов не пересекаются
    - 'Сессия отказывается стартовать: нарушен инвариант единственной работы в процессе, состояние доски разруливает человек'
    - Агент создаёт третью запись, объединяющую обе, и берёт её в работу
  correct: 2
