- concept: запрет и требование одобрения различаются тем, снимается ли ограничение подписью человека
  question: Чем требование одобрения отличается от запрета в контракте объёма?
  explanation: 'Запрет неснимаем внутри задачи. Требование одобрения — это точка передачи решения: ограничение снимается явным согласием человека, и только тогда действие входит в разрешённое.'
  kind: choice
  options:
    - Запрет действует на файлы, требование одобрения — на команды; в остальном они равнозначны
    - 'Запрет означает «не делай в рамках этой задачи», а требование одобрения означает «делать можно, но решение принимает человек»: после подписи действие становится разрешённым'
    - Требование одобрения строже запрета, потому что нарушение видно в diff
    - Запрет проверяется до работы, требование одобрения — после неё
  correct: 1
  id: 016-approval-boundary-1
  fingerprint: 449d1111
- concept: 'отсутствие ответа человека не эквивалентно одобрению: агент останавливается и ждёт явного согласия'
  question: Действие требует одобрения, агент попросил подтверждение и ответа не получил. Как он должен поступить?
  explanation: Правило одобрения имеет смысл только при трактовке «нет ответа = нет разрешения». Любая другая трактовка превращает подпись человека в необязательную формальность, которую снимает пауза.
  kind: choice
  options:
    - 'Остановиться: молчание не согласие, без явного подтверждения действие остаётся невыполненным'
    - Выполнить, если задержка ответа превышает разумное ожидание
    - Выполнить, но пометить действие в отчёте как несогласованное
    - Выполнить обратимую часть действия, а необратимую отложить
  correct: 0
  id: 016-approval-boundary-2
  fingerprint: dac6d0f9
- concept: формулировка требования одобрения называет конкретное действие и точку остановки, иначе агент не может определить, наступила ли она
  question: Какая запись в списке действий, требующих одобрения, работоспособна?
  explanation: Агент должен во время работы однозначно определить, наступила ли точка остановки. «Важное» и «осторожно» такой проверки не дают, уведомление постфактум её вообще не создаёт. Названное действие плюс названная граница («перед публикацией в production») — дают.
  kind: choice
  options:
    - «Согласовать все важные изменения»
    - «Действовать осторожно при работе с внешними сервисами»
    - «Получить одобрение перед публикацией шаблона письма в production»
    - «Уведомлять человека о принятых решениях»
  correct: 2
  id: 016-approval-boundary-3
  fingerprint: 21bd5e5b
