- concept: goal — одно предложение о наблюдаемом результате, которое ревьюер может проверить
  question: Какая формулировка годится в поле `goal` контракта объёма?
  explanation: '«Улучшить» и «разобраться» невозможно опровергнуть: агент честно поменяет тексты ошибок и отчитается о готовности. Проверяемый `goal` описывает наблюдаемый итог — ситуацию можно воспроизвести и увидеть результат. Перечень действий исполнителя — тоже не `goal`.'
  kind: choice
  options:
    - «Улучшить экран входа»
    - «Переписать модуль сессий и почистить хелперы»
    - «Пользователь с истёкшей сессией после повторного входа возвращается на страницу, которую открывал»
    - «Разобраться, почему пользователи жалуются на вход»
  correct: 2
  id: 006-identity-goal-1
  fingerprint: 880927de
- concept: task_id идентифицирует работу и связывает её с доской, но не является критерием приёмки
  question: 'Агент сообщает: «задача `PAY-903` готова». Почему сам по себе `task_id` не доказывает готовность, и какое поле контракта её доказывает?'
  explanation: 'Два поля отвечают на разные вопросы: `task_id` — идентичность работы, `goal` — обещанный наблюдаемый итог. Без второго изменение поведения системы невозможно отличить от исправления нужной проблемы.'
  kind: open
  reference: '`task_id` — постоянная метка: по ней контракт связан с карточкой на доске, её обсуждением, ответственным и статусом. Он отвечает на вопрос «о какой задаче речь», то есть указывает, чью готовность нужно доказать. Доказывает готовность `goal` — одно проверяемое предложение о наблюдаемом результате (и опирающиеся на него критерии приёмки): его можно воспроизвести и сравнить с фактом.'
  id: 006-identity-goal-2
  fingerprint: 9e12035c
