- concept: тождественность слияния на входе из одного контракта — проверка, что ни одно ограничение не потерялось при сборке результата
  question: Какая проверка надёжнее всего ловит ошибку, при которой сборка итогового контракта теряет или ослабляет отдельное поле?
  explanation: 'Одноэлементный вход — вырожденный случай, где верный ответ известен заранее: сам контракт. Любая потеря поля, подмена значения по умолчанию или неверная инициализация аккумулятора видна сразу. Остальные проверки выполняются и у сломанной реализации.'
  kind: choice
  options:
    - Слияние входа из одного контракта должно вернуть ровно его ограничения, поле в поле
    - Результат слияния должен быть непустым
    - В списках результата не должно быть повторов
    - Итоговый бюджет времени должен быть больше нуля
