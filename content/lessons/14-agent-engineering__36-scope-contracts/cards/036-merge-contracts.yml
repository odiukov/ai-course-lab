- concept: слияние строит новый контракт и не мутирует входы, иначе исходные контракты расходятся с записанными на диске
  question: Функция слияния дописывает запреты и одобрения прямо в объект первого контракта и возвращает его. Возвращаемое значение верно. Почему это всё равно ошибка?
  explanation: 'Контракт — то, о чём договорились до запуска; ревьюер сверяет отчёт именно с ним. Мутация превращает вход в производную величину: тот же вызов на тех же файлах перестаёт быть воспроизводимым, а сохранённый контракт молча меняет смысл между сессиями.'
  kind: choice
  options:
    - Исходный контракт перестаёт соответствовать записанному на диске, и повторное слияние тех же входов даёт уже суженный результат
    - Мутация делает слияние заметно медленнее
    - 'Ошибки нет: важно лишь то, что вернула функция'
    - Нарушится порядок полей при обратной записи в YAML
