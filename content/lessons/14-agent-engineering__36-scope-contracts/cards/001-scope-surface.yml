- concept: лечение расползания объёма — записанное на диске обещание плюс проверка результата, а не более строгий промпт
  question: Агент регулярно выходит за пределы поручения. Какое средство против этого работает системно?
  explanation: 'Промпт — это уговор, который агент трактует сам, и подробный отчёт о шагах его не ограничивает. Ограничивает артефакт: обещание зафиксировано на диске, а отдельная проверка механически сопоставляет с ним фактический результат.'
  kind: choice
  options:
    - Добавить в промпт запрет менять лишнее и просить агента быть аккуратнее
    - Хранить обещание задачи в файле рядом с работой и отдельной проверкой сравнивать с ним итог
    - Просить агента подробнее комментировать каждый свой шаг
    - Уменьшить длину сессии, чтобы агент успевал меньше
  correct: 1
  id: 001-scope-surface-1
  fingerprint: 2aa68ad3
- concept: контракт фиксирует предмет обещания (результат, области изменений, признак готовности), но не способ решения
  question: Почему контракт задачи не должен заранее диктовать каждую строку решения, и что он тогда фиксирует?
  explanation: Контракт разделяет два вида свободы. «Как сделать» — исполнителю; «что обещано» — фиксировано. Поэтому поля контракта описывают результат и границы, а не алгоритм.
  kind: open
  reference: 'Если контракт описывает решение построчно, агенту остаётся механическое исполнение, и смысл в самостоятельной работе исчезает. Контракт фиксирует другое: какой наблюдаемый результат нужен, где допустимы изменения и по какому признаку задача считается выполненной. Тем самым свобода выбирать способ остаётся у исполнителя, а свобода менять само обещание — нет.'
  id: 001-scope-surface-2
  fingerprint: 2fd9b3cb
