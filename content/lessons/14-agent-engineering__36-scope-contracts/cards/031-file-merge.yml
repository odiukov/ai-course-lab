- concept: запреты применимых контрактов объединяются, потому что пересечение запретов позволило бы одному контракту снять защиту, установленную другим
  question: Проектный контракт запрещает `config/prod/**` и молчит про `app/legacy.py`; задачный запрещает `app/legacy.py` и молчит про `config/prod/**`. Почему итоговый контракт сохраняет оба запрета, а не только те, что назвали обе стороны?
  explanation: 'Асимметрия та же, что и с разрешениями, но зеркальная: права требуют согласия всех сторон, ограничения — согласия одной. Иначе слияние выдавало бы полномочия, которых не давал ни один исходный контракт.'
  kind: open
  reference: 'Молчание контракта — это отсутствие правила, а не выданное разрешение, поэтому оно не может отменить запрет другой стороны. Если бы запреты пересекались, любой контракт снимал бы защиту соседа просто тем, что не упомянул путь: достаточно было бы добавить контракт покороче, чтобы открыть продовый конфиг. Поэтому для запрета хватает одного «нет», и запрещающие списки складываются — результат защищает и `config/prod/**`, и `app/legacy.py`.'
