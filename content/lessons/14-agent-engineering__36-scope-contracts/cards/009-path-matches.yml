- concept: 'проверка пути по списку глобов — дизъюнкция: одно совпадение достаточно, пустой список совпадений не даёт'
  question: Функция проверяет, подходит ли путь хотя бы под один глоб из списка контракта. Список оказался пустым. Что она должна вернуть?
  explanation: 'Функция отвечает на вопрос «есть ли хотя бы один подходящий шаблон». Это дизъюнкция: первое совпадение даёт True, отсутствие шаблонов — пустая дизъюнкция, то есть False. Трактовка пустого списка как «разрешено всё» превратила бы незаполненное поле контракта в полный доступ.'
  kind: choice
  options:
    - 'False: подтверждающего шаблона нет, значит совпадения нет'
    - 'True: пустой список не накладывает ограничений'
    - True, если путь лежит внутри репозитория
    - 'Ошибку: пустой список считается некорректным контрактом'
  correct: 0
  id: 009-path-matches-1
  fingerprint: 4757679d
- concept: путь нормализуют до сопоставления, чтобы вердикт зависел от контракта, а не от формы записи пути
  question: Один и тот же изменённый файл встречается в отчётах как `app/auth/login.py`, `./app/auth/login.py` и `app\auth\login.py`. Почему сопоставление с глобами делают после приведения пути к единому виду?
  explanation: Глоб сравнивается со строкой. Ведущее `./` или обратные слеши дают другую строку для того же файла, и совпадение начинает зависеть от того, кто и как напечатал путь. Единый вид — относительно корня репозитория, с `/` между частями — делает вердикт свойством контракта.
  kind: choice
  options:
    - Иначе результат проверки зависит от формы записи пути, а не от контракта
    - Иначе глобы перестают поддерживать конструкцию `**`
    - Иначе сопоставление становится чувствительным к регистру имени файла
    - Иначе каждый глоб пришлось бы записывать в контракте дважды
  correct: 0
  id: 009-path-matches-2
  fingerprint: e739ee06
