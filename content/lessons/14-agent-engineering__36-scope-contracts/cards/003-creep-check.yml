- concept: техническая необходимость изменения не равна разрешению на него
  question: Обещано исправление в модуле корзины. Выясняется, что баг не устранить без правки общего модуля скидок. Что верно?
  explanation: 'Необходимость и разрешение — разные вещи. Файл вне обещанной области может быть технически обязательным и всё равно требовать явного расширения объёма. Отказ от задачи тоже неверен: границу можно расширить осознанно, просто это решение человека, а не побочный эффект работы.'
  kind: choice
  options:
    - Необходимость доказана, значит правка автоматически входит в объём
    - Необходимость объясняет расширение, но объём нужно пересмотреть до внесения правки
    - Задачу надо закрыть как невыполнимую в текущих границах
  correct: 1
  id: 003-creep-check-1
  fingerprint: 46ec9197
- concept: порядок действий при попадании изменения за границу объёма
  question: Агент во время работы упирается в файл вне разрешённой области. Расставь правильный порядок действий.
  explanation: Ключ в том, что граница не двигается самим исполнителем. Сначала стоп, потом явный вопрос, потом решение человека, и только затем продолжение. Порядок «сначала внёс, потом объяснил» превращает контракт в описание уже сделанного.
  kind: order
  items:
    - Остановить работу над этим изменением, не внося правку в файл за границей
    - 'Сформулировать открытый вопрос: почему файл понадобился и что он даёт для обещанного результата'
    - 'Передать решение человеку: расширить объём, исключить изменение или выделить его в отдельную задачу'
    - Продолжить работу по обновлённой или прежней границе — согласно принятому решению
  id: 003-creep-check-2
  fingerprint: 36a36c25
