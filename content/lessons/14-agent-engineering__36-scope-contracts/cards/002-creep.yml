- concept: правдоподобность объясняет мотив действия, но единица сверки — совпадение итога с изначально согласованной задачей
  question: Как проверить, не превратилась ли выполненная работа в соседнюю задачу, если у каждого действия агента есть разумное объяснение?
  explanation: Мотив и обещание — разные вещи. Убедительная причина шага не меняет того, что было согласовано; сверять надо результат с исходной договорённостью, а не шаг с его объяснением.
  kind: open
  reference: 'Убрать объяснения и смотреть только на итог: перечень фактически затронутых мест и полученный результат. Затем сверить его с тем, что было согласовано перед началом — обещанный результат и области, которые разрешено менять. Если итог шире согласованного, это уже другая работа, независимо от того, насколько разумно звучали причины отдельных шагов.'
