- concept: при одновременном совпадении запрещающий глоб перекрывает разрешающий
  question: Контракт разрешает `src/**/*.ts` и запрещает `src/generated/**`. Агент изменил `src/generated/api.ts`. Какой вердикт даёт проверка объёма?
  explanation: Совпадения не голосуют на равных. Широкое правило очерчивает рабочую область, узкое исключение вырезает из неё защищённый участок. Без приоритета запрета любой достаточно широкий разрешающий глоб автоматически проглатывал бы все точечные запреты.
  kind: choice
  options:
    - 'Запрещено: совпадение с запрещающим глобом перекрывает разрешающее'
    - 'Разрешено: разрешающий глоб совпал первым'
    - 'Вне объёма: два совпадения гасят друг друга'
    - Решение остаётся за агентом, раз правила расходятся
  correct: 0
  id: 010-write-classification-1
  fingerprint: ab9baca1
- concept: 'путь, не совпавший ни с одним глобом, остаётся вне объёма: отсутствие запрета не создаёт разрешения'
  question: Агент изменил `docs/runbook.md`. Путь не совпадает ни с одним глобом из allowed_files и ни с одним из forbidden_files. Как классифицировать изменение?
  explanation: 'Отсутствие запрета — не разрешение. Контракт задаёт положительное пространство, и молчание оставляет путь снаружи. Вердикт «вне объёма» отличается от «запрещено» способом разрешения: первый чинится расширением контракта или подписью человека, второй — жёсткая граница, которую расширять не собирались.'
  kind: choice
  options:
    - 'Вне объёма: контракт перечисляет, куда писать можно, а неперечисленное требует пересмотра контракта или отдельного одобрения'
    - 'Разрешено: запрещающего правила для него нет'
    - 'Запрещено: любой неизвестный путь эквивалентен запрещённому'
    - Разрешено, потому что это документация, а не код
  correct: 0
  id: 010-write-classification-2
  fingerprint: f00c9cd1
