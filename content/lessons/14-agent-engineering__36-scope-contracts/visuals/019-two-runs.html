<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Один проверщик, два разных прогона</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f4f7fb;
    --ink: #172033;
    --muted: #59657a;
    --card: #ffffff;
    --card-soft: #eef3fa;
    --border: #aab6c8;
    --accent: #5b62d6;
    --accent-soft: #e9eaff;
    --good: #18794e;
    --good-soft: #e5f6ed;
    --bad: #b42318;
    --bad-soft: #ffebe9;
    --line: #68758a;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #111722;
      --ink: #edf2fa;
      --muted: #aeb9ca;
      --card: #1a2230;
      --card-soft: #202b3b;
      --border: #58677d;
      --accent: #aeb2ff;
      --accent-soft: #292d58;
      --good: #70d6a5;
      --good-soft: #173d31;
      --bad: #ff9d94;
      --bad-soft: #4a2425;
      --line: #9aa8bc;
    }
  }

  html,
  body {
    margin: unset;
    padding: unset;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  main {
    background: var(--page);
    overflow: hidden;
  }

  header {
    text-align: center;
  }

  h1 {
    margin: unset;
    padding: unset;
    font-size: 22px;
  }

  header p {
    margin: unset;
    padding: unset;
    color: var(--muted);
    font-size: 14px;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    background: var(--page);
  }

  .card {
    fill: var(--card);
    stroke: var(--border);
    stroke-width: 2;
  }

  .contract {
    fill: var(--accent-soft);
    stroke: var(--accent);
    stroke-width: 2;
  }

  .checker {
    fill: var(--card-soft);
    stroke: var(--accent);
    stroke-width: 2;
  }

  .checker-label {
    fill: var(--accent);
  }

  .result-good {
    fill: var(--good-soft);
    stroke: var(--good);
    stroke-width: 2;
  }

  .result-bad {
    fill: var(--bad-soft);
    stroke: var(--bad);
    stroke-width: 2;
  }

  .flow {
    stroke: var(--line);
    stroke-width: 2;
    fill: none;
  }

  .flow-accent {
    stroke: var(--accent);
    stroke-width: 2;
    fill: none;
  }

  .arrow-line {
    fill: var(--line);
  }

  .arrow-accent {
    fill: var(--accent);
  }

  .divider {
    stroke: var(--border);
    stroke-width: 2;
  }

  .title {
    fill: var(--ink);
    font-size: 16px;
    font-weight: bold;
  }

  .body {
    fill: var(--ink);
    font-size: 13px;
  }

  .muted {
    fill: var(--muted);
    font-size: 12px;
  }

  .on-accent {
    fill: var(--page);
    font-size: 16px;
    font-weight: bold;
  }

  .good-text {
    fill: var(--good);
    font-size: 16px;
    font-weight: bold;
  }

  .bad-text {
    fill: var(--bad);
    font-size: 14px;
    font-weight: bold;
  }

  .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Один проверщик, два разных прогона</h1>
    <p>Контракт и правила неизменны — различаются свидетельства в RunSummary</p>
  </header>

  <svg id="diagram"
       viewBox="0 0 1120 450"
       width="1120"
       height="450"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="diagram-title diagram-description">
    <title id="diagram-title">Два RunSummary проходят через один scope_check</title>
    <desc id="diagram-description">
      Слева проверка возвращает пустой список нарушений. Справа она указывает
      лишний файл README.md и причину: файл находится вне разрешённого glob code/**.
    </desc>
  </svg>
</main>

<script>
const data = [{
  origin: { x: 0, y: 0 },
  scale: { x: 1, y: 1 },

  geometry: {
    radius: 12,
    pillRadius: 18,
    arrowHalf: 7,
    arrowLength: 10
  },

  contract: {
    x: 310, y: 14, w: 500, h: 66,
    titleX: 560, titleY: 41,
    detailX: 560, detailY: 64
  },

  leftRun: {
    x: 64, y: 108, w: 426, h: 102,
    titleX: 82, titleY: 134,
    fileX: 82, fileY: 163,
    checkX: 82, checkY: 188,
    laneX: 277
  },

  rightRun: {
    x: 630, y: 108, w: 426, h: 102,
    titleX: 648, titleY: 134,
    fileX: 648, fileY: 163,
    checkX: 648, checkY: 188,
    laneX: 843
  },

  contractFlow: {
    x: 560, startY: 80, endY: 232,
    labelX: 576, labelY: 98
  },

  runFlow: {
    startY: 210, endY: 232
  },

  checker: {
    x: 64, y: 244, w: 992, h: 80,
    labelX: 455, labelY: 255, labelW: 210, labelH: 34,
    labelTextX: 560, labelTextY: 278,
    leftTextX: 277, leftTextY: 307,
    rightTextX: 843, rightTextY: 307,
    dividerX: 560, dividerStartY: 293, dividerEndY: 316
  },

  resultFlow: {
    startY: 324, endY: 344
  },

  leftResult: {
    x: 64, y: 356, w: 426, h: 80,
    titleX: 82, titleY: 383,
    detailX: 82, detailY: 411
  },

  rightResult: {
    x: 630, y: 356, w: 426, h: 80,
    titleX: 648, titleY: 379,
    fileX: 648, fileY: 403,
    reasonX: 648, reasonY: 425
  },

  fallback: {
    x: 560, y: 226
  }
}];

const [scene] = data;
const origin = scene.origin;
const scale = scene.scale;
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

const svg = document.getElementById("diagram");

function box(item, className, radiusName = "radius") {
  const radius = scene.geometry[radiusName];
  return `<rect
    x="${sx(item.x)}"
    y="${sy(item.y)}"
    width="${sx(item.x + item.w) - sx(item.x)}"
    height="${sy(item.y + item.h) - sy(item.y)}"
    rx="${sx(item.x + radius) - sx(item.x)}"
    ry="${sy(item.y + radius) - sy(item.y)}"
    class="${className}"/>`;
}

function label(value, x, y, className, anchor = "start") {
  return `<text
    x="${sx(x)}"
    y="${sy(y)}"
    class="${className}"
    text-anchor="${anchor}">${value}</text>`;
}

function segment(xStart, yStart, xEnd, yEnd, className) {
  return `<line
    x1="${sx(xStart)}"
    y1="${sy(yStart)}"
    x2="${sx(xEnd)}"
    y2="${sy(yEnd)}"
    class="${className}"/>`;
}

function downArrow(x, startY, endY, lineClass = "flow", headClass = "arrow-line") {
  const half = scene.geometry.arrowHalf;
  const length = scene.geometry.arrowLength;
  const shaftEnd = endY - length;

  return [
    segment(x, startY, x, shaftEnd, lineClass),
    `<polygon
      points="${sx(x)},${sy(endY)}
              ${sx(x - half)},${sy(shaftEnd)}
              ${sx(x + half)},${sy(shaftEnd)}"
      class="${headClass}"/>`
  ].join("");
}

try {
  const contract = scene.contract;
  const leftRun = scene.leftRun;
  const rightRun = scene.rightRun;
  const checker = scene.checker;
  const leftResult = scene.leftResult;
  const rightResult = scene.rightResult;

  svg.insertAdjacentHTML("beforeend", [
    box(contract, "contract"),
    label("scope_contract.json", contract.titleX, contract.titleY, "title mono", "middle"),
    label(
      "одни и те же границы: разрешён code/**",
      contract.detailX,
      contract.detailY,
      "body",
      "middle"
    ),

    downArrow(
      scene.contractFlow.x,
      scene.contractFlow.startY,
      scene.contractFlow.endY,
      "flow-accent",
      "arrow-accent"
    ),
    label(
      "один контракт для обеих веток",
      scene.contractFlow.labelX,
      scene.contractFlow.labelY,
      "muted",
      "start"
    ),

    box(leftRun, "card"),
    label("RunSummary — чистый прогон", leftRun.titleX, leftRun.titleY, "title"),
    label(
      "touched_files: code/main.py",
      leftRun.fileX,
      leftRun.fileY,
      "body mono"
    ),
    label(
      "checks_run: python3 code/main.py",
      leftRun.checkX,
      leftRun.checkY,
      "muted mono"
    ),

    box(rightRun, "card"),
    label("RunSummary — лишнее действие", rightRun.titleX, rightRun.titleY, "title"),
    label(
      "touched_files: code/main.py + README.md",
      rightRun.fileX,
      rightRun.fileY,
      "body mono"
    ),
    label(
      "checks_run: python3 code/main.py",
      rightRun.checkX,
      rightRun.checkY,
      "muted mono"
    ),

    downArrow(
      leftRun.laneX,
      scene.runFlow.startY,
      scene.runFlow.endY
    ),
    downArrow(
      rightRun.laneX,
      scene.runFlow.startY,
      scene.runFlow.endY
    ),

    box(checker, "checker"),
    segment(
      checker.dividerX,
      checker.dividerStartY,
      checker.dividerX,
      checker.dividerEndY,
      "divider"
    ),

    box({
      x: checker.labelX,
      y: checker.labelY,
      w: checker.labelW,
      h: checker.labelH
    }, "checker-label", "pillRadius"),

    label(
      "scope_check",
      checker.labelTextX,
      checker.labelTextY,
      "on-accent mono",
      "middle"
    ),
    label(
      "те же правила → левый RunSummary",
      checker.leftTextX,
      checker.leftTextY,
      "muted",
      "middle"
    ),
    label(
      "те же правила → правый RunSummary",
      checker.rightTextX,
      checker.rightTextY,
      "muted",
      "middle"
    ),

    downArrow(
      leftRun.laneX,
      scene.resultFlow.startY,
      scene.resultFlow.endY
    ),
    downArrow(
      rightRun.laneX,
      scene.resultFlow.startY,
      scene.resultFlow.endY
    ),

    box(leftResult, "result-good"),
    label(
      "violations = []",
      leftResult.titleX,
      leftResult.titleY,
      "good-text mono"
    ),
    label(
      "затронуты только ожидаемые файлы",
      leftResult.detailX,
      leftResult.detailY,
      "body"
    ),

    box(rightResult, "result-bad"),
    label(
      "violations",
      rightResult.titleX,
      rightResult.titleY,
      "bad-text mono"
    ),
    label(
      "файл: README.md",
      rightResult.fileX,
      rightResult.fileY,
      "body mono"
    ),
    label(
      "причина: файл вне разрешённого glob code/**",
      rightResult.reasonX,
      rightResult.reasonY,
      "bad-text"
    )
  ].join(""));
} catch (error) {
  svg.insertAdjacentHTML(
    "beforeend",
    label(
      "Схема: два разных RunSummary проходят через один scope_check; слева violations пуст, справа указан лишний README.md и причина.",
      scene.fallback.x,
      scene.fallback.y,
      "body",
      "middle"
    )
  );
}
</script>
</body>
</html>
