<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Путь задачи от контракта до вердикта</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f5f7fb;
    --panel: #ffffff;
    --ink: #172033;
    --muted: #5d687c;
    --line: #526078;
    --neutral: #edf1f7;
    --neutral-stroke: #8b97aa;
    --contract: #eee8ff;
    --contract-stroke: #7057c8;
    --work: #e7f0ff;
    --work-stroke: #3974c5;
    --evidence: #e3f5f7;
    --evidence-stroke: #278295;
    --check: #fff1cf;
    --check-stroke: #b46d10;
    --decision: #fff8d9;
    --decision-stroke: #a36e00;
    --pass: #e5f6eb;
    --pass-stroke: #278551;
    --block: #fde9e8;
    --block-stroke: #bc4c47;
    --shadow: #dfe5ef;
    --halo: #ffffff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #10141d;
      --panel: #171d28;
      --ink: #eef3ff;
      --muted: #abb7ca;
      --line: #9ba9bf;
      --neutral: #252d3a;
      --neutral-stroke: #8795aa;
      --contract: #30284c;
      --contract-stroke: #a890ff;
      --work: #1e3451;
      --work-stroke: #72a9f5;
      --evidence: #193a40;
      --evidence-stroke: #62bdca;
      --check: #49371e;
      --check-stroke: #e1a44b;
      --decision: #443a1c;
      --decision-stroke: #e4b94f;
      --pass: #1c3b2c;
      --pass-stroke: #68c78d;
      --block: #472727;
      --block-stroke: #ef817a;
      --shadow: #0b0e14;
      --halo: #171d28;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: unset;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  main {
    background: var(--panel);
    padding: 16px;
  }

  h1 {
    margin: unset;
    padding-bottom: 12px;
    font-size: 22px;
    line-height: normal;
    font-weight: 750;
    letter-spacing: -0.02em;
  }

  figure { margin: unset; }

  svg {
    display: block;
    inline-size: 100%;
    block-size: auto;
    max-block-size: 520px;
    background: var(--panel);
    font-family: inherit;
  }

  .edge {
    fill: none;
    stroke: var(--line);
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .edge.contract-edge { stroke: var(--contract-stroke); }

  .arrowhead { fill: var(--line); }
  .arrowhead.contract-edge { fill: var(--contract-stroke); }

  .node {
    stroke-linejoin: round;
    filter: drop-shadow(0 5px 0 var(--shadow));
  }

  .node.neutral { fill: var(--neutral); stroke: var(--neutral-stroke); }
  .node.contract { fill: var(--contract); stroke: var(--contract-stroke); }
  .node.work { fill: var(--work); stroke: var(--work-stroke); }
  .node.evidence { fill: var(--evidence); stroke: var(--evidence-stroke); }
  .node.check { fill: var(--check); stroke: var(--check-stroke); }
  .node.decision { fill: var(--decision); stroke: var(--decision-stroke); }
  .node.pass { fill: var(--pass); stroke: var(--pass-stroke); }
  .node.block { fill: var(--block); stroke: var(--block-stroke); }

  .node-title {
    fill: var(--ink);
    font-weight: 720;
  }

  .node-note {
    fill: var(--muted);
    font-weight: 560;
  }

  .edge-label {
    fill: var(--muted);
    paint-order: stroke;
    stroke: var(--halo);
    stroke-linejoin: round;
    font-weight: 650;
  }

  .contract-label { fill: var(--contract-stroke); }

  .eyebrow {
    fill: var(--muted);
    font-weight: 760;
    letter-spacing: 0.09em;
  }

  .role-rule {
    stroke: var(--contract-stroke);
    stroke-linecap: round;
    opacity: 0.55;
  }

  #fallback {
    display: none;
    padding: 16px;
    background: var(--neutral);
    color: var(--ink);
    font-size: 16px;
  }
</style>
</head>
<body>
<main>
  <h1>Путь задачи от контракта до вердикта</h1>
  <figure aria-labelledby="diagram-title" aria-describedby="diagram-desc">
    <svg id="diagram" viewBox="0 0 1180 392" width="1180" height="392"
         role="img" preserveAspectRatio="xMidYMid meet">
      <title id="diagram-title">Путь задачи через контракт, цикл агента и проверщик объёма</title>
      <desc id="diagram-desc">Задача превращается в контракт. Контракт отдельно инструктирует цикл агента и поступает в проверщик. Проверщик сопоставляет итоговый diff с контрактом и выдаёт вердикт: продолжить проверку работоспособности или заблокировать результат и задать вопрос человеку.</desc>
      <g id="drawing"></g>
    </svg>
    <div id="fallback" role="img" aria-label="Описание схемы">
      Задача → scope_contract.json → цикл агента → итоговый diff → scope_checker.py → вердикт. Тот же контракт отдельно входит и в цикл агента, и в проверщик. Вердикт «в объёме» ведёт к проверке работоспособности, а выход за границы — к блокировке и вопросу человеку.
    </div>
  </figure>
</main>

<script>
(() => {
  "use strict";

  const data = Object.freeze([
    { kind: "mapping", origin: { x: 0, y: 0 }, scale: { x: 1, y: 1 } },

    { kind: "caption", at: { x: 590, y: 20 }, text: "ОДИН КОНТРАКТ — ДВЕ РОЛИ",
      rules: [{ x1: 350, y1: 20, x2: 440, y2: 20 }, { x1: 740, y1: 20, x2: 830, y2: 20 }] },

    { kind: "box", id: "task", className: "neutral", x1: 30, y1: 70, x2: 170, y2: 150, radius: 14,
      lines: [{ text: "Задача", x: 100, y: 110, style: "title" }] },

    { kind: "box", id: "contract", className: "contract", x1: 220, y1: 70, x2: 445, y2: 150, radius: 14,
      lines: [
        { text: "КОНТРАКТ ОБЪЁМА", x: 332.5, y: 94, style: "note" },
        { text: "scope_contract.json", x: 332.5, y: 121, style: "title" }
      ] },

    { kind: "box", id: "agent", className: "work", x1: 500, y1: 70, x2: 675, y2: 150, radius: 14,
      lines: [
        { text: "Цикл агента", x: 587.5, y: 103, style: "title" },
        { text: "работа в границах", x: 587.5, y: 127, style: "note" }
      ] },

    { kind: "box", id: "diff", className: "evidence", x1: 730, y1: 70, x2: 900, y2: 150, radius: 14,
      lines: [
        { text: "Итоговый diff", x: 815, y: 103, style: "title" },
        { text: "фактические изменения", x: 815, y: 127, style: "note" }
      ] },

    { kind: "box", id: "checker", className: "check", x1: 690, y1: 230, x2: 890, y2: 310, radius: 14,
      lines: [
        { text: "scope_checker.py", x: 790, y: 263, style: "title" },
        { text: "контракт ↔ diff", x: 790, y: 287, style: "note" }
      ] },

    { kind: "diamond", id: "verdict", className: "decision",
      points: [{ x: 975, y: 225 }, { x: 1020, y: 270 }, { x: 975, y: 315 }, { x: 930, y: 270 }],
      lines: [
        { text: "В объёме?", x: 975, y: 263, style: "title" },
        { text: "вердикт", x: 975, y: 285, style: "note" }
      ] },

    { kind: "box", id: "verify", className: "pass", x1: 1045, y1: 178, x2: 1165, y2: 248, radius: 14,
      lines: [
        { text: "Проверка", x: 1105, y: 204, style: "title" },
        { text: "работоспособности", x: 1105, y: 226, style: "note" }
      ] },

    { kind: "box", id: "block", className: "block", x1: 1045, y1: 300, x2: 1165, y2: 375, radius: 14,
      lines: [
        { text: "Блокировка", x: 1105, y: 325, style: "title" },
        { text: "+ вопрос", x: 1105, y: 347, style: "note" },
        { text: "человеку", x: 1105, y: 365, style: "note" }
      ] },

    { kind: "edge", className: "", points: [{ x: 170, y: 110 }, { x: 220, y: 110 }] },

    { kind: "edge", className: "contract-edge",
      points: [{ x: 445, y: 110 }, { x: 500, y: 110 }],
      label: { text: "инструктирует", at: { x: 472.5, y: 70 }, side: "above", anchor: "middle", className: "contract-label" } },

    { kind: "edge", className: "",
      points: [{ x: 675, y: 110 }, { x: 730, y: 110 }],
      label: { text: "создаёт", at: { x: 702.5, y: 70 }, side: "above", anchor: "middle", className: "" } },

    { kind: "edge", className: "",
      points: [{ x: 815, y: 150 }, { x: 815, y: 230 }],
      label: { text: "готовый diff", at: { x: 815, y: 185 }, side: "right", anchor: "start", className: "" } },

    { kind: "edge", className: "contract-edge",
      points: [{ x: 332.5, y: 150 }, { x: 332.5, y: 270 }, { x: 690, y: 270 }],
      label: { text: "тот же контракт: судит", at: { x: 332.5, y: 186 }, side: "right", anchor: "start", className: "contract-label" } },

    { kind: "edge", className: "", points: [{ x: 890, y: 270 }, { x: 930, y: 270 }] },

    { kind: "edge", className: "",
      points: [{ x: 1007, y: 238 }, { x: 1045, y: 213 }],
      label: { text: "да", at: { x: 1014, y: 238 }, side: "above", anchor: "middle", className: "" } },

    { kind: "edge", className: "",
      points: [{ x: 1007, y: 302 }, { x: 1045, y: 337 }],
      label: { text: "нет", at: { x: 1014, y: 302 }, side: "below", anchor: "middle", className: "" } },

    { kind: "arrow", length: 11, wing: 6 }
  ]);

  const origin = Object.freeze(data.find(item => item.kind === "mapping").origin);
  const scale = Object.freeze(data.find(item => item.kind === "mapping").scale);
  const sx = x => origin.x + x * scale.x;
  const sy = y => origin.y + y * scale.y;

  const labelPadding = 10;
  const strokeWidth = 2.5;
  const titleFontSize = 16;
  const noteFontSize = 13;
  const edgeFontSize = 13;
  const eyebrowFontSize = 12;
  const svgNamespace = "http://www.w3.org/2000/svg";

  const make = (name, attributes = {}) => {
    const element = document.createElementNS(svgNamespace, name);
    Object.entries(attributes).forEach(([key, value]) => element.setAttribute(key, String(value)));
    return element;
  };

  const mappedPoints = points => points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" ");

  const addText = (layer, line, extraClass = "") => {
    const text = make("text", {
      x: sx(line.x),
      y: sy(line.y),
      "text-anchor": "middle",
      "dominant-baseline": "middle",
      "font-size": line.style === "title" ? titleFontSize : noteFontSize,
      class: `${line.style === "title" ? "node-title" : "node-note"} ${extraClass}`.trim()
    });
    text.textContent = line.text;
    layer.appendChild(text);
  };

  const addArrowhead = (layer, edge, arrowSpec) => {
    const end = edge.points.at(-1);
    const before = edge.points.at(-2);
    const dx = end.x - before.x;
    const dy = end.y - before.y;
    const magnitude = Math.hypot(dx, dy);
    const ux = dx / magnitude;
    const uy = dy / magnitude;
    const base = {
      x: end.x - ux * arrowSpec.length,
      y: end.y - uy * arrowSpec.length
    };
    const left = {
      x: base.x - uy * arrowSpec.wing,
      y: base.y + ux * arrowSpec.wing
    };
    const right = {
      x: base.x + uy * arrowSpec.wing,
      y: base.y - ux * arrowSpec.wing
    };
    layer.appendChild(make("polygon", {
      points: mappedPoints([end, left, right]),
      class: `arrowhead ${edge.className}`.trim()
    }));
  };

  const addEdgeLabel = (layer, label) => {
    const offset = {
      above: { x: sx(label.at.x), y: sy(label.at.y) - labelPadding },
      below: { x: sx(label.at.x), y: sy(label.at.y) + labelPadding },
      left: { x: sx(label.at.x) - labelPadding, y: sy(label.at.y) },
      right: { x: sx(label.at.x) + labelPadding, y: sy(label.at.y) }
    }[label.side];

    const text = make("text", {
      x: offset.x,
      y: offset.y,
      "text-anchor": label.anchor,
      "dominant-baseline": "middle",
      "font-size": edgeFontSize,
      "stroke-width": strokeWidth,
      class: `edge-label ${label.className}`.trim()
    });
    text.textContent = label.text;
    layer.appendChild(text);
  };

  const draw = () => {
    const drawing = document.getElementById("drawing");
    const arrowSpec = data.find(item => item.kind === "arrow");
    const captions = data.filter(item => item.kind === "caption");
    const edges = data.filter(item => item.kind === "edge");
    const shapes = data.filter(item => item.kind === "box" || item.kind === "diamond");

    captions.forEach(caption => {
      caption.rules.forEach(rule => drawing.appendChild(make("line", {
        x1: sx(rule.x1), y1: sy(rule.y1), x2: sx(rule.x2), y2: sy(rule.y2),
        class: "role-rule", "stroke-width": strokeWidth
      })));
      const text = make("text", {
        x: sx(caption.at.x),
        y: sy(caption.at.y),
        "text-anchor": "middle",
        "dominant-baseline": "middle",
        "font-size": eyebrowFontSize,
        class: "eyebrow"
      });
      text.textContent = caption.text;
      drawing.appendChild(text);
    });

    edges.forEach(edge => {
      drawing.appendChild(make("polyline", {
        points: mappedPoints(edge.points),
        class: `edge ${edge.className}`.trim(),
        "stroke-width": strokeWidth
      }));
      addArrowhead(drawing, edge, arrowSpec);
    });

    shapes.forEach(shape => {
      if (shape.kind === "box") {
        drawing.appendChild(make("rect", {
          x: sx(shape.x1),
          y: sy(shape.y1),
          width: sx(shape.x2) - sx(shape.x1),
          height: sy(shape.y2) - sy(shape.y1),
          rx: sx(shape.radius) - sx(origin.x),
          ry: sy(shape.radius) - sy(origin.y),
          class: `node ${shape.className}`,
          "stroke-width": strokeWidth
        }));
      } else {
        drawing.appendChild(make("polygon", {
          points: mappedPoints(shape.points),
          class: `node ${shape.className}`,
          "stroke-width": strokeWidth
        }));
      }
      shape.lines.forEach(line => addText(drawing, line));
    });

    edges.filter(edge => edge.label).forEach(edge => addEdgeLabel(drawing, edge.label));
  };

  try {
    draw();
  } catch (error) {
    document.getElementById("diagram").style.display = "none";
    document.getElementById("fallback").style.display = "block";
  }
})();
</script>
</body>
</html>
