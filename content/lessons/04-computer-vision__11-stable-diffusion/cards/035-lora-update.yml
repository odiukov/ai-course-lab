- concept: порядок матричного умножения LoRA определяется согласованием внутренних размерностей
  question: Базовая матрица W имеет форму (p, q), матрица A — (p, k), а B — (k, q). Какое выражение создаёт LoRA-поправку той же формы, что и W?
  explanation: При умножении A @ B внутренние размерности k совпадают и сокращаются, поэтому результат имеет форму (p, q). Поэлементное умножение A * B для таких форм в общем случае невозможно.
  kind: choice
  options:
    - B @ A
    - A @ B
    - A * B
  correct: 1
  id: 035-lora-update-1
  fingerprint: b3f8a795
- concept: LoRA-поправка масштабируется и прибавляется без изменения замороженной базовой матрицы
  question: Пусть delta = A @ B. Заполни выражение, которое создаёт эффективную матрицу для инференса и не изменяет W на месте.
  explanation: Эффективные веса равны сумме замороженной W и масштабированной поправки alpha * delta. Присваивание результата новой переменной оставляет исходную W неизменной.
  kind: cloze
  template: W_eff = ___
  answer: W + alpha * delta
  accept:
    - W + delta * alpha
    - alpha * delta + W
    - delta * alpha + W
  id: 035-lora-update-2
  fingerprint: b50aa5ab
