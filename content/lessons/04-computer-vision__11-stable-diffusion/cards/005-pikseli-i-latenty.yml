- concept: пространственная позиция латента описывает участок изображения, а не отдельный видимый пиксель
  question: Почему значение в одной пространственной позиции латентного тензора нельзя трактовать как цвет конкретного пикселя?
  explanation: 'При переходе от 3×512×512 к 4×64×64 пространственное разрешение уменьшается. Поэтому ячейка латента не совпадает с одним пикселем: декодер преобразует распределённый код участка в полноразмерное изображение.'
  kind: open
  reference: Латентная сетка намного грубее пиксельной. Каждая её позиция содержит набор выученных признаков некоторого участка изображения, а соответствующие пиксели восстанавливаются декодером совместно из множества латентных значений.
  id: 005-pikseli-i-latenty-2
