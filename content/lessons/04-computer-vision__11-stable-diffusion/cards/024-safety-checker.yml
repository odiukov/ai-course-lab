- concept: safety checker классифицирует готовое RGB-изображение на наличие NSFW и другого запрещённого контента
  question: Что обычно анализирует safety checker в пайплайне Stable Diffusion?
  explanation: Safety checker получает уже декодированное изображение и оценивает его на сходство с NSFW или другими запрещёнными категориями. Обычно он не заменяет анализ изображения проверкой промпта.
  kind: choice
  options:
    - Текстовый промпт до его передачи текстовому энкодеру
    - Готовое RGB-изображение после декодирования латента
    - Предсказанный U-Net шум на каждой итерации
  correct: 1
  id: 024-safety-checker-1
  fingerprint: 57dc3f70
- concept: отсутствие обратной связи от safety checker к генеративным компонентам не позволяет ему менять траекторию сэмплирования
  question: Почему включение safety checker при неизменных промпте, начальном шуме и параметрах сэмплирования не создаёт более безопасный вариант изображения?
  explanation: U-Net, scheduler и VAE завершают построение изображения до проверки. Без обратной связи решение классификатора не может повлиять на латентную траекторию; оно влияет лишь на обработку готового результата.
  kind: open
  reference: 'Проверка выполняется после завершения генерации: её результат не передаётся обратно в U-Net или scheduler и поэтому не меняет удаление шума или итоговые пиксели. Она может только пометить, скрыть либо заменить уже полученный результат в соответствии с логикой приложения.'
  id: 024-safety-checker-2
  fingerprint: 05e51d1a
- concept: контентная классификация safety checker допускает ложные срабатывания и пропуски
  question: Какое утверждение корректно описывает надёжность safety checker?
  explanation: Safety checker — классификатор, а не безошибочное правило. Он может дать ложноположительный результат для допустимого изображения или ложноотрицательный — для нежелательного.
  kind: choice
  options:
    - Любое срабатывание доказывает, что изображение действительно запрещено
    - Проверка гарантированно обнаруживает весь нежелательный контент
    - Возможны как блокировка допустимого изображения, так и пропуск нежелательного
  correct: 2
