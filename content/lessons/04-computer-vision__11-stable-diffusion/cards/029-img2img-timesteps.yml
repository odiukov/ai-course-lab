  question: Как правильно выбрать используемую часть последовательности timestep для img2img?
  explanation: Значения timestep задаются scheduler и не обязаны совпадать с номерами позиций. Поэтому функцию интересует индекс среза, а порядок оставшихся элементов нужно сохранить.
