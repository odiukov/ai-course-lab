- concept: DDIM выполняет детерминированное сэмплирование, а ancestral-scheduler добавляет случайность
  question: 'Нужно воспроизводимо сравнить влияние двух промптов: начальный латент, веса модели и все параметры запуска зафиксированы. Какой scheduler лучше подходит для такого эксперимента?'
  explanation: DDIM детерминирован при одинаковых входах и настройках, поэтому удобен для контролируемых сравнений. Euler ancestral добавляет случайность на промежуточных шагах и чаще даёт более разнообразные варианты.
  kind: choice
  options:
    - Euler ancestral, потому что он добавляет шум на промежуточных переходах
    - DDIM, потому что при одинаковых входах следует детерминированной траектории
    - Turbo, потому что малое число переходов гарантирует идентичность результатов
    - 'Любой scheduler: способ сэмплирования не влияет на воспроизводимость'
  correct: 1
  id: 022-vybor-scheduler-1
  fingerprint: 7629c6c2
- concept: малошаговые Turbo и consistency-подходы требуют совместимой модели и обменивают качество на скорость
  question: Почему нельзя гарантировать хорошее изображение, просто назначив обычной Stable Diffusion модели Turbo-scheduler и оставив лишь несколько шагов сэмплирования?
  explanation: 'Режим в 1–4 шага достигается не одной заменой расписания: он опирается на совместимое обучение или дистилляцию модели. Ускорение велико, но потеря качества уже возможна и оценивается по результатам генерации.'
  kind: open
  reference: Turbo, LCM и TCD рассчитаны на модели, специально подготовленные дистилляцией или consistency-обучением. Обычная модель может быть несовместима с таким режимом, а радикальное сокращение числа шагов способно ухудшить детали, композицию и соответствие промпту, поэтому качество нужно проверять визуально.
  id: 022-vybor-scheduler-2
