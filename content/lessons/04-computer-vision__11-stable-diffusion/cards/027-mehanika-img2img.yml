- concept: strength управляет компромиссом между сохранением исходника и свободой перегенерации
  question: Почему увеличение strength в img2img обычно усиливает изменения по промпту, но уменьшает сходство с исходным изображением?
  explanation: При малом strength латент остаётся близким к исходному, поэтому результат меняется слабо. При большом strength значительная часть исходного сигнала теряется, и результат сильнее определяется промптом и процессом генерации.
  kind: open
  reference: Чем выше strength, тем больше шума добавляется в исходный латент и тем больше содержащейся в нём информации уничтожается. Шумоподавитель получает больше свободы создать детали по промпту, но меньше исходной структуры, которую можно сохранить.
