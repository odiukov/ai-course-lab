- concept: тип контрольной карты ControlNet выбирают по геометрическому свойству, которое нужно зафиксировать
  question: Нужно сохранить расположение суставов и позу человека, но разрешить модели изменить одежду, освещение и стиль. Какое обусловливание подходит лучше всего?
  explanation: Карта позы явно задаёт расположение суставов, а текстовый промпт определяет одежду, освещение и стиль. Карта глубины фиксирует пространственные расстояния, Canny — границы, а смена scheduler не добавляет геометрического условия.
  kind: choice
  options:
    - Только подробный текстовый промпт
    - ControlNet с картой позы и текстовый промпт
    - ControlNet с картой глубины без текстового промпта
    - Замена scheduler без добавления ControlNet
  correct: 1
  id: 033-controlnet-1
  fingerprint: 2066f04d
- concept: ControlNet добавляет к базовому генеративному пайплайну отдельное геометрическое условие
  question: Объясни своими словами, чем подключение ControlNet отличается от замены базовой модели Stable Diffusion.
  explanation: 'ControlNet расширяет обычное текстовое обусловливание: веса и возможности базовой модели сохраняются, но на генерацию дополнительно влияет структурная карта. Поэтому один базовый пайплайн можно использовать с разными видами геометрического контроля.'
  kind: open
  reference: ControlNet не заменяет базовую модель, а добавляется поверх её пайплайна как дополнительный канал обусловливания. Базовая модель продолжает генерировать изображение по тексту, а ControlNet направляет генерацию с помощью карты контуров, глубины или позы.
  id: 033-controlnet-2
  fingerprint: 42cd572e
