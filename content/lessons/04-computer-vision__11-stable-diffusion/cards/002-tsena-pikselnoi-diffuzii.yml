- concept: итерации обратной диффузии образуют последовательную цепочку зависимых вызовов шумоподавителя
  question: Объясни своими словами, почему все итерации удаления шума при сэмплировании DDPM нельзя выполнить параллельно одним запуском U-Net.
  explanation: Один вызов U-Net выполняет лишь очередное обновление зашумлённого состояния. Следующий вызов зависит от этого обновления, поэтому стоимость большой сети последовательно повторяется много раз для каждого изображения.
  kind: open
  reference: Каждая итерация U-Net получает состояние изображения, полученное на предыдущей итерации, и вычисляет следующий, немного менее зашумлённый результат. Пока предыдущий результат неизвестен, вход для следующего вызова ещё не существует, поэтому вызовы приходится выполнять последовательно.
