- concept: pipeline diffusers собирается как контейнер совместимых компонентов по конфигурации репозитория
  question: Что создаёт StableDiffusionPipeline.from_pretrained(...) при загрузке text-to-image модели?
  explanation: Метод читает конфигурацию репозитория, создаёт указанные в ней компоненты и загружает их веса. Токенизатор, текстовый энкодер, U-Net, VAE, scheduler и дополнительные проверки остаются отдельными объектами, которыми управляет общий pipeline.
  kind: choice
  options:
    - Одну монолитную нейросеть, в которую заранее слиты все этапы генерации
    - Согласованный pipeline из отдельных компонентов, выбранных по конфигурации репозитория
    - Только U-Net, а остальные компоненты создаются при каждом вызове pipe(...)
    - Только набор весов без сведений о классах и связях между компонентами
  correct: 1
  id: 025-text-to-image-api-1
  fingerprint: 69b60c0c
- concept: вызов pipeline оркестрирует этапы генерации и передаёт параметры нужным компонентам
  question: Почему вызов pipe(prompt=..., guidance_scale=..., num_inference_steps=...) нельзя считать обычным прямым проходом через одну нейросеть? Объясни своими словами.
  explanation: Pipeline предоставляет единый интерфейс, но внутри координирует несколько самостоятельных моделей и служебных компонентов. Например, число шагов использует цикл сэмплирования, а параметры текстового управления влияют на прогноз шумоподавителя.
  kind: open
  reference: 'Pipeline последовательно запускает разные компоненты: обрабатывает текст, создаёт и обновляет латенты с помощью U-Net и scheduler, декодирует результат через VAE и при необходимости проверяет готовое изображение. Параметры вызова направляются тем этапам, для которых они предназначены.'
  id: 025-text-to-image-api-2
