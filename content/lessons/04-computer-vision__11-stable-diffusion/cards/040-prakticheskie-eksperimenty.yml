- concept: однофакторное парное сравнение отделяет влияние параметра генерации от случайности и сопутствующих настроек
  question: Какой эксперимент позволяет обоснованно приписать различия изображений изменению guidance_scale?
  explanation: Значения guidance_scale нужно сравнивать в одинаковых условиях, меняя только сам параметр. Повторение на общем наборе seed помогает отличить устойчивый эффект настройки от удачного случайного шума. Для strength дополнительно фиксируют исходное изображение.
  kind: choice
  options:
    - Для каждого значения выбрать новый промпт и случайный seed
    - Оставить неизменными модель, промпт, scheduler, число шагов и разрешение, а все значения проверить на одном наборе seed
    - Использовать один seed, но вместе с guidance_scale менять scheduler
    - Сравнить лучшие изображения, вручную отобранные для каждого значения
  correct: 1
  id: 040-prakticheskie-eksperimenty-1
  fingerprint: bb97c0fb
- concept: качество LoRA определяется обобщением идентичности на новые сцены, а не только ошибкой обучения
  question: У одного LoRA-адаптера ошибка обучения ниже, но он часто воспроизводит композиции обучающих кадров. Как проверить, действительно ли он лучше сохраняет идентичность объекта?
  explanation: Низкая ошибка на обучающем наборе совместима с переобучением. Проверка на новых сценах показывает, выучила ли LoRA переносимые признаки объекта или лишь запомнила конкретные изображения.
  kind: open
  reference: Сравнить адаптеры при одинаковых базовой модели, датасете, подписях и прочих настройках, используя общий набор промптов и seed. В проверку должны входить новые сцены и условия, отсутствовавшие в обучающих данных. Лучшим считать адаптер, который сохраняет характерные признаки объекта без копирования тренировочных кадров.
  id: 040-prakticheskie-eksperimenty-2
