- concept: маска задаёт линейную смесь исходного и перегенерированного латентов
  question: В одной позиции исходный латент равен 11, предложенный моделью — 31, а значение маски — 0.3. Чему равен смешанный латент?
  explanation: Смешивание выполняется по формуле z = (1 − m)·z_orig + m·z_new. Поэтому результат равен 0.7·11 + 0.3·31 = 17.
  kind: numeric
  answer: 17
  tolerance: 0.01
  id: 031-maska-inpainting-1
  fingerprint: 766aaf75
- concept: при смешивании исходный и новый латенты должны соответствовать одному уровню шума
  question: Как следует подготовить латент исходного изображения перед его смешиванием с результатом очередного шага денойзинга?
  explanation: Новый латент на промежуточном timestep ещё содержит шум. Исходный латент зашумляют до того же уровня, чтобы смешивать сопоставимые состояния; иначе на границе маски может появиться заметный шов.
  kind: choice
  options:
    - Взять полностью чистый исходный латент независимо от текущего timestep
    - Зашумить исходный латент до уровня текущего timestep
    - Декодировать оба латента в RGB и смешать пиксели
    - Заменить исходный латент случайным шумом вне маски
  correct: 1
  id: 031-maska-inpainting-2
  fingerprint: b677f0b5
