- concept: CFG не может усилить влияние промпта, если условный и безусловный прогнозы совпадают
  question: Для одного и того же текущего латента и момента диффузии условный и безусловный прогнозы шума совпали. Что произойдёт при увеличении guidance scale?
  explanation: CFG масштабирует разность между условным и безусловным прогнозами. Если они совпадают, направление влияния текста равно нулю, поэтому любой guidance scale даёт тот же прогноз.
  kind: choice
  options:
    - Прогноз сместится в сторону безусловной генерации
    - В изображении обязательно появятся более выраженные детали промпта
    - Итоговый прогноз не изменится, потому что усиливаемая разность равна нулю
  correct: 2
  id: 017-cfg-dva-prognoza-1
  fingerprint: 907cf482
- concept: разность условного и безусловного прогнозов изолирует вклад текстового условия при фиксированных остальных входах
  question: Почему условный и безусловный прогнозы шума в CFG вычисляют для одного и того же текущего латента и момента диффузии?
  explanation: 'Это контролируемое сравнение: латент и момент времени фиксированы, а условие меняется с пустого на текстовое. Благодаря этому разность прогнозов выделяет именно вклад промпта.'
  kind: open
  reference: Так меняется только текстовое условие. Поэтому разность прогнозов можно интерпретировать как направление изменения, вызванное промптом, а не другим уровнем шума или другим состоянием латента.
  id: 017-cfg-dva-prognoza-2
