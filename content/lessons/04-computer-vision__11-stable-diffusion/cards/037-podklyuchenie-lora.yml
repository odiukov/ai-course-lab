- concept: смена вплавленного LoRA-адаптера требует предварительной отмены вплавления
  question: 'Расположите действия в правильном порядке: от подключения LoRA к генерации и последующей безопасной замене адаптера.'
  explanation: 'Сначала адаптер загружают и вплавляют с выбранным lora_scale. После fuse_lora его масштаб и сам адаптер нельзя безопасно заменить на ходу: перед загрузкой другого адаптера нужно вызвать unfuse_lora().'
  kind: order
  items:
    - Загрузить LoRA через load_lora_weights
    - Выбрать силу и вплавить адаптер через fuse_lora
    - Выполнить генерацию
    - Отменить вплавление через unfuse_lora
    - Загрузить другой адаптер
  id: 037-podklyuchenie-lora-1
  fingerprint: 405bdc86
- concept: подавление влияния LoRA масштабом не выгружает адаптер из памяти
  question: Вклад загруженного LoRA-адаптера полностью подавили параметром масштаба. Означает ли это, что адаптер выгружен из памяти? Объясните своими словами.
  explanation: При lora_scale=0.0 поправка LoRA не влияет на веса, используемые для генерации, однако сам адаптер остаётся загруженным. Масштабирование и выгрузка — разные операции.
  kind: open
  reference: 'Нет. Масштаб управляет вкладом LoRA в результат, но не жизненным циклом загруженного адаптера: отсутствие эффекта не означает его выгрузку.'
  id: 037-podklyuchenie-lora-2
  fingerprint: 8e737cc7
- concept: усиление LoRA сверх обученной силы может ухудшать качество изображения
  question: Что наиболее вероятно произойдёт, если задать LoRA масштаб заметно выше её полной обученной силы?
  explanation: Значения выше 1.0 допустимы, но они чрезмерно усиливают поправку LoRA и нередко ухудшают изображение. Поэтому в материале предлагается начинать с диапазона 0.7–0.8 и подбирать силу по результату.
  kind: choice
  options:
    - Стиль может стать чрезмерным, а в изображении могут появиться артефакты
    - Адаптер автоматически выгрузится после генерации
    - Базовая модель начнёт дообучаться во время инференса
    - Влияние LoRA останется неизменным из-за автоматического ограничения масштаба
  correct: 0
  id: 037-podklyuchenie-lora-3
