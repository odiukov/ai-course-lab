- concept: масштабирование логитов внимания на корень из размерности ключа предотвращает насыщение softmax
  question: Заполни пропуск в формуле scaled dot-product attention.
  explanation: Скалярные произведения растут по масштабу вместе с размерностью ключей. Деление на √d_k удерживает логиты в рабочем диапазоне, поэтому softmax не насыщается преждевременно и градиенты не становятся слишком малыми.
  kind: cloze
  template: Attention(Q, K, V) = softmax((QKᵀ) / ___)V
  answer: √d_k
  accept:
    - sqrt(d_k)
    - d_k**0.5
    - корень из d_k
  id: 015-cross-attention-1
  fingerprint: 9664313c
- concept: формы матриц cross-attention определяются числом запросов, числом ключей и размерностью значений
  question: В одном слое cross-attention матрица Q имеет форму (7, 12), K — (9, 12), а V — (9, 5). Какие формы получатся у матрицы весов внимания и итогового результата?
  explanation: 'Произведение QKᵀ имеет форму (7, 9): каждый из семи запросов получает оценку для каждого из девяти ключей. Умножение весов формы (7, 9) на V формы (9, 5) даёт результат формы (7, 5).'
  kind: choice
  options:
    - 'Веса: (9, 7), результат: (9, 5)'
    - 'Веса: (7, 12), результат: (7, 9)'
    - 'Веса: (7, 9), результат: (7, 5)'
    - 'Веса: (12, 12), результат: (12, 5)'
  correct: 2
  id: 015-cross-attention-2
  fingerprint: 196aad64
