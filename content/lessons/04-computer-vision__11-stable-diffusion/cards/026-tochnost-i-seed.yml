- concept: seed воспроизводит начальный псевдослучайный шум, но полная воспроизводимость зависит и от вычислительного окружения
  question: Объясни, почему одинаковые prompt и seed обычно позволяют повторить изображение и почему после смены оборудования или версий библиотек результат всё же может отличаться.
  explanation: manual_seed(42) фиксирует последовательность псевдослучайных чисел и начальный шум, а seed 43 создаёт другой шум. Для полного совпадения также нужны одинаковые модель, scheduler, параметры, версии библиотек и совместимое оборудование.
  kind: open
  reference: Seed задаёт начальное состояние генератора псевдослучайных чисел, поэтому при одинаковых настройках создаётся тот же стартовый шум и повторяется траектория генерации. Однако различия в реализациях операций, порядке вычислений и округлении на другом оборудовании или в других версиях библиотек могут изменить результат.
