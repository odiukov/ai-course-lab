- concept: safety checker является необязательным выходным фильтром
  question: Почему Stable Diffusion может сгенерировать изображение без safety checker и что изменится при его отключении?
  explanation: Safety checker стоит после генеративной части пайплайна. Его отключение не меняет получение изображения, а лишь убирает дополнительную проверку результата.
  kind: open
  reference: Safety checker не участвует в кодировании промпта, шумоподавлении или декодировании латента. Он проверяет уже полученное изображение, поэтому без него генерация продолжит работать, но результат не будет отфильтрован на запрещённый или NSFW-контент.
  id: 006-marshrut-pipeline-3
  fingerprint: de3edec3
