- concept: разделение обязанностей между шумоподавителем и scheduler
  question: Вставьте название компонента, который определяет параметры очередного обновления латента.
  explanation: U-Net оценивает шум для текущего латента, но само правило перехода к следующему состоянию задаёт scheduler — например, Euler, DDIM или DPM-Solver++.
