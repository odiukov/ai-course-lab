- concept: временное условие строится из номера шага с помощью синусоидального кодирования и MLP
  question: Расположи этапы подготовки временного условия для U-Net в правильном порядке.
  explanation: Синусоидальное кодирование превращает номер шага в плавное векторное представление, а MLP адаптирует его для слоёв U-Net. Благодаря этому шумоподавитель меняет поведение в зависимости от стадии диффузии.
  kind: order
  items:
    - Представить номер шага синусоидальным кодированием
    - Преобразовать полученный вектор с помощью MLP
    - Передать временное представление во внутренние слои U-Net
  id: 020-unet-shumopodavitel-2
  fingerprint: 429a31c9
- concept: skip connections сохраняют пространственные детали при переходе от энкодера к декодеру
  question: Объясни своими словами, зачем в диффузионном U-Net нужны skip connections между энкодером и декодером на совпадающих разрешениях.
  explanation: Последовательное сжатие может стереть точную информацию о расположении и мелких деталях. Skip connections дают декодеру доступ к более ранним картам признаков соответствующего разрешения.
  kind: open
  reference: Они напрямую передают признаки из сжимающей части в расширяющую на том же пространственном масштабе, поэтому декодеру не приходится восстанавливать все локальные детали только из сжатого представления.
  id: 020-unet-shumopodavitel-3
  fingerprint: 09b6c0b9
