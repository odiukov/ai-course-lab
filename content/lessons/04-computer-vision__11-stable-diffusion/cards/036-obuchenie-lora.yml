- concept: при обучении с epsilon-предсказанием целевой меткой служит конкретная реализация добавленного шума
  question: Изображение закодировали в латент, выбрали случайный timestep и получили зашумлённый латент. Что является целевым ответом для U-Net при обучении с epsilon-предсказанием?
  explanation: Шум сначала сэмплируют и используют для построения зашумлённого входа, а затем сохраняют как целевую метку. U-Net учится восстанавливать именно эту реализацию шума по зашумлённому латенту, timestep и текстовому условию.
  kind: choice
  options:
    - Тот же случайный шум, который был добавлен к чистому латенту
    - Исходный чистый латент
    - Эмбеддинги подписи
    - Латент, полностью очищенный scheduler
  correct: 0
  id: 036-obuchenie-lora-1
  fingerprint: daef10ec
- concept: MSE усредняет квадраты поэлементных ошибок прогноза шума
  question: Заполните выражение для функции потерь при сопоставлении предсказанного и реально добавленного шума.
  explanation: Сначала для каждого элемента вычисляется разность между прогнозом и целевым шумом, затем она возводится в квадрат и усредняется. Поэтому ошибки разных знаков не сокращают друг друга, а крупные отклонения получают больший штраф.
  kind: cloze
  template: loss = ___
  answer: mean((eps_hat - eps) ** 2)
  accept:
    - MSE(eps_hat, eps)
    - ((eps_hat - eps) ** 2).mean()
    - mean((eps - eps_hat) ** 2)
  id: 036-obuchenie-lora-2
  fingerprint: a826de36
- concept: замораживание базовой модели ограничивает обновление параметров адаптерами LoRA, не исключая базовые слои из прямого прохода
  question: Объясните своими словами, что происходит с замороженными VAE, текстовым энкодером и базовыми весами U-Net во время шага обучения LoRA и какие параметры меняет оптимизатор.
  explanation: 'Замороженный слой не исчезает из модели: его операции по-прежнему влияют на выход. Замораживание означает, что оптимизатор не изменяет его параметры; обучаемая поправка сосредоточена в небольших адаптерах LoRA.'
  kind: open
  reference: Замороженные компоненты продолжают вычислять латенты, текстовые признаки и прогноз U-Net, но их параметры не обновляются. Градиент функции потерь используется для изменения только обучаемых матриц LoRA, включённых в вычислительный граф и переданных оптимизатору.
  id: 036-obuchenie-lora-3
  fingerprint: a7bbe8f5
