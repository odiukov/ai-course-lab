- concept: softmax нормализует экспоненты оценок в положительные веса с единичной суммой
  question: Заполни формулу softmax для оценки s_i.
  explanation: Экспоненты всегда положительны, а деление каждой из них на общую сумму нормализует веса. Для оценок 2, 1 и 0 получаются веса примерно 0,67, 0,24 и 0,09, сумма которых равна 1.
  kind: cloze
  template: w_i = ___
  answer: exp(s_i) / sum_j exp(s_j)
  accept:
    - e^(s_i) / sum_j e^(s_j)
    - exp(s_i)/Σ_j exp(s_j)
  id: 012-softmax-v-attention-1
  fingerprint: 0a443bec
- concept: веса softmax конкурируют через общий знаменатель
  question: Почему при увеличении оценки одного кандидата его вес softmax растёт, а веса кандидатов с неизменившимися оценками уменьшаются?
  explanation: Все кандидаты делят одну и ту же единичную массу внимания. Поэтому увеличение доли одного кандидата оставляет меньшую долю остальным.
  kind: open
  reference: Экспонента увеличенной оценки растёт и увеличивает общий знаменатель. Поэтому доля этого кандидата становится больше, а те же числители остальных кандидатов делятся на большую сумму и дают меньшие веса.
  id: 012-softmax-v-attention-2
  fingerprint: 00afcd93
