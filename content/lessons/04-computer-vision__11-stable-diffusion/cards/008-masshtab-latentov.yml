- concept: масштабирующий коэффициент определяется статистикой латентов и соглашением конкретной пары VAE и UNet
  question: В пайплайне Stable Diffusion заменили VAE моделью, латенты которой имеют другой разброс значений. Как следует поступить с коэффициентом масштабирования перед UNet?
  explanation: Коэффициент зависит не от размеров тензора, а от статистического масштаба латентов и соглашения между VAE и UNet. В исходном Stable Diffusion значение 0.18215 согласует латенты конкретного VAE с масштабом, ожидаемым диффузионной моделью.
  kind: choice
  options:
    - 'Оставить прежний коэффициент: он универсален для всех VAE'
    - Использовать коэффициент, соответствующий статистике нового VAE и масштабу, на котором обучался UNet
    - Вычислить коэффициент только из формы латентного тензора
    - Удалить масштабирование, потому что scheduler самостоятельно нормализует латенты
  correct: 1
  id: 008-masshtab-latentov-1
  fingerprint: d4a3d4bc
- concept: масштабирование латента перед диффузией обращается перед декодированием
  question: Пусть перед UNet латент преобразовали по правилу z_diff = s · z_VAE. Заполни формулу восстановления масштаба, ожидаемого декодером VAE.
  explanation: 'Перед декодированием нужно обратить прямое масштабирование: разделить диффузионный латент на тот же коэффициент. Для Stable Diffusion это означает деление на 0.18215 перед передачей результата в декодер VAE.'
  kind: cloze
  template: z_VAE = ___
  answer: z_diff / s
  accept:
    - z_diff * (1 / s)
    - z_diff * s^(-1)
  id: 008-masshtab-latentov-2
  fingerprint: 86ecf522
- concept: нормализация латентов сохраняет ожидаемое соотношение сигнала и шума в расписании диффузии
  question: Почему нельзя подавать в обученный UNet латенты с существенно иным разбросом значений, даже если форма тензора и scheduler остались прежними?
  explanation: Масштабирование не меняет содержание латента, но приводит его дисперсию к ожидаемому диапазону. Коэффициент 0.18215 уменьшает разброс латентов исходного VAE примерно до единичного, благодаря чему уровни шума scheduler сохраняют обученный смысл.
  kind: open
  reference: Scheduler задаёт уровни шума в расчёте на масштаб латентов, использованный при обучении UNet. Если разброс латентов изменится, фактическое соотношение сигнала и шума перестанет соответствовать обучающему распределению, поэтому предсказания шумоподавителя будут некалиброванными.
  id: 008-masshtab-latentov-3
  fingerprint: f7314596
