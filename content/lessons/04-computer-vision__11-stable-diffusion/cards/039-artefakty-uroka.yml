- concept: базовая модель и batch size являются частью определения воспроизводимого обучения LoRA
  question: Объясните своими словами, почему два запуска обучения LoRA нельзя считать одинаковыми, если между ними без фиксации заменили базовую модель или batch size.
  explanation: LoRA-адаптер обучается относительно конкретной замороженной основы, поэтому смена основы может изменить результат или нарушить совместимость. Изменение batch size меняет ход оптимизации, даже если прочие поля остались прежними.
  kind: open
  reference: Базовая модель задаёт исходные веса, архитектурную совместимость и признаки, к которым обучается адаптер. Batch size влияет на оценки градиента и траекторию оптимизации. Поэтому изменение любого из этих параметров создаёт другой обучающий эксперимент и должно быть явно отражено в конфиге.
  id: 039-artefakty-uroka-2
