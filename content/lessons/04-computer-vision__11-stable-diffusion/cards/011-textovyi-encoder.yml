- concept: контекстный эмбеддинг токена зависит от его позиции и окружающих токенов
  question: Один и тот же токен «лук» встречается в промптах «лук со стрелами» и «зелёный лук на тарелке». Какими должны быть его выходные эмбеддинги после текстового энкодера?
  explanation: Идентификатор токена может совпадать, но текстовый энкодер обрабатывает его вместе с позицией и соседними токенами. Поэтому выходной эмбеддинг отражает нужное в данном промпте значение слова.
  kind: choice
  options:
    - 'Разными: текстовый энкодер учитывает окружение и формирует контекстное представление токена'
    - 'Одинаковыми: одному идентификатору токена всегда соответствует один и тот же выходной вектор'
    - Разными только в том случае, если промпты имеют неодинаковую длину
    - Одинаковыми, но U-Net самостоятельно определит значение токена без информации от энкодера
  correct: 0
  id: 011-textovyi-encoder-1
  fingerprint: 54c8a243
- concept: идентификатор токена является индексом словаря, а не смысловым числовым представлением
  question: Объясни своими словами, почему числовой идентификатор токена нельзя считать его смысловым представлением и использовать вместо эмбеддинга.
  explanation: Номера токенов служат для адресации элементов словаря и сами по себе не задают семантическую геометрию. Эмбеддинги позволяют представлять признаки и отношения токенов в непрерывном векторном пространстве.
  kind: open
  reference: 'Идентификатор — это дискретный индекс элемента словаря: близость или порядок таких чисел не означает сходства токенов. Текстовый энкодер преобразует индекс в плотный вектор признаков и уточняет его с учётом позиции и контекста промпта.'
  id: 011-textovyi-encoder-2
  fingerprint: 4af01728
