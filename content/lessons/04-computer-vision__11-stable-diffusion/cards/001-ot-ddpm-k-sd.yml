- concept: направления преобразования VAE в пайплайне Stable Diffusion
  question: Какой вариант правильно описывает роль энкодера и декодера VAE в Stable Diffusion?
  explanation: VAE связывает пиксельное и латентное пространства. Энкодер нужен, когда исходное изображение требуется упаковать в латент, например при обучении или img2img; декодер разворачивает итоговый латент в обычное RGB-изображение.
  kind: choice
  options:
    - Энкодер переводит RGB-изображение в латент, а декодер превращает латент в RGB-изображение
    - Энкодер удаляет шум из латента, а декодер вычисляет текстовые эмбеддинги
    - Энкодер выбирает шаги сэмплирования, а декодер проверяет изображение на запрещённый контент
    - Энкодер усиливает соответствие промпту, а декодер обновляет веса U-Net
  correct: 0
  id: 001-ot-ddpm-k-sd-1
  fingerprint: f6cbf12c
- concept: текстовое обусловливание шумоподавителя через cross-attention
  question: Объясните, как текстовый промпт влияет на удаление шума в Stable Diffusion, хотя текстовый энкодер сам не изменяет латент.
  explanation: 'Текстовый энкодер только создаёт представление промпта. Непосредственно связывает текст с генерацией U-Net: её cross-attention использует текстовые эмбеддинги при предсказании шума на разных уровнях разрешения.'
  kind: open
  reference: Текстовый энкодер превращает промпт в последовательность эмбеддингов токенов. Слои cross-attention внутри U-Net обращаются из признаков латента к этим эмбеддингам, поэтому предсказание шума на каждом этапе зависит от содержания промпта.
  id: 001-ot-ddpm-k-sd-2
  fingerprint: 7f25a231
