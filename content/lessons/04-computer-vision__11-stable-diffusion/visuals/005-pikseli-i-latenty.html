<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пиксельное и латентное пространства в числах</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f7f9fc;
      --panel: #ffffff;
      --card: #f8fafc;
      --text: #172033;
      --muted: #59667d;
      --border: #cbd5e1;
      --tensor-edge: #51617a;
      --red: #fecaca;
      --green: #bbf7d0;
      --blue: #bfdbfe;
      --violet-a: #ddd6fe;
      --violet-b: #c4b5fd;
      --violet-c: #a78bfa;
      --violet-d: #8b5cf6;
      --arrow: #2563eb;
      --pill: #dbeafe;
      --pill-text: #1d4ed8;
      --fallback: #fff4e5;
      --fallback-border: #e6a23c;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: unset;
      background: var(--page);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    main {
      width: 100%;
      max-width: 1200px;
      margin-inline: auto;
      padding: 16px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
      line-height: normal;
      text-align: center;
    }

    figure {
      margin: unset;
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 420px;
      background: var(--panel);
    }

    .card {
      fill: var(--card);
      stroke: var(--border);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .card-accent-pixel,
    .card-accent-latent {
      stroke-width: 4px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .card-accent-pixel {
      stroke: #3b82f6;
    }

    .card-accent-latent {
      stroke: #8b5cf6;
    }

    .slice {
      stroke: var(--tensor-edge);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .slice-red {
      fill: var(--red);
    }

    .slice-green {
      fill: var(--green);
    }

    .slice-blue {
      fill: var(--blue);
    }

    .slice-violet-a {
      fill: var(--violet-a);
    }

    .slice-violet-b {
      fill: var(--violet-b);
    }

    .slice-violet-c {
      fill: var(--violet-c);
    }

    .slice-violet-d {
      fill: var(--violet-d);
    }

    .depth-line {
      stroke: var(--tensor-edge);
      stroke-width: 2px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .arrow-line {
      stroke: var(--arrow);
      stroke-width: 4px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .arrow-head {
      fill: var(--arrow);
    }

    .arrow-pill {
      fill: var(--pill);
      stroke: var(--arrow);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    text {
      fill: var(--text);
      font-family: inherit;
    }

    .space-title {
      font-size: 19px;
      font-weight: bold;
    }

    .face-size {
      font-size: 19px;
      font-weight: bold;
    }

    .channel-label {
      font-size: 15px;
      fill: var(--muted);
    }

    .tensor-formula {
      font-size: 18px;
      font-weight: bold;
    }

    .tensor-total {
      font-size: 16px;
      fill: var(--muted);
    }

    .arrow-label {
      font-size: 18px;
      font-weight: bold;
      fill: var(--pill-text);
    }

    .ratio-formula {
      font-size: 15px;
      font-weight: bold;
      fill: var(--muted);
    }

    #fallback {
      margin: 16px;
      padding: 16px;
      border: 2px solid var(--fallback-border);
      background: var(--fallback);
      font-size: 17px;
      line-height: normal;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --page: #0b1020;
        --panel: #111827;
        --card: #172033;
        --text: #f1f5f9;
        --muted: #bac5d5;
        --border: #40506a;
        --tensor-edge: #d6deea;
        --red: #7f3340;
        --green: #236044;
        --blue: #285486;
        --violet-a: #493b70;
        --violet-b: #57418a;
        --violet-c: #6643a6;
        --violet-d: #7547c6;
        --arrow: #60a5fa;
        --pill: #172f55;
        --pill-text: #bfdbfe;
        --fallback: #3a2b18;
        --fallback-border: #f0b55a;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Пиксельное и латентное пространства в числах</h1>

    <figure aria-labelledby="diagram-title">
      <svg
        id="diagram"
        viewBox="0 0 1200 420"
        width="1200"
        height="420"
        preserveAspectRatio="xMidYMid meet"
        role="img"
        aria-labelledby="diagram-title diagram-description"
      >
        <title id="diagram-title">Сравнение пиксельного и латентного тензоров</title>
        <desc id="diagram-description">
          Тензор 3 на 512 на 512 содержит 786 432 числа, а тензор
          4 на 64 на 64 — 16 384 числа, то есть в 48 раз меньше.
        </desc>
        <g id="stage"></g>
      </svg>

      <div id="fallback" hidden>
        Схема должна была показать: 3 × 512 × 512 = 786 432 числа →
        в 48 раз меньше → 4 × 64 × 64 = 16 384 числа.
      </div>
    </figure>
  </main>

  <script>
    const diagramData = Object.freeze([{
      origin: { x: 0, y: 0 },
      scale: { x: 8, y: 8 },
      zero: 0,
      half: 2,
      cards: {
        pixel: { x: 4, y: 2.5, w: 55, h: 47.5, r: 1.5 },
        latent: { x: 91, y: 2.5, w: 55, h: 47.5, r: 1.5 }
      },
      accents: {
        pixel: { x1: 8, y1: 3.5, x2: 55, y2: 3.5 },
        latent: { x1: 95, y1: 3.5, x2: 142, y2: 3.5 }
      },
      pixelTensor: {
        x: 16.5,
        y: 14.5,
        w: 25,
        h: 25,
        r: 0.8,
        depthX: 3,
        depthY: -3,
        backs: [
          { dx: 3, dy: -3, className: "slice slice-red" },
          { dx: 1.5, dy: -1.5, className: "slice slice-green" }
        ],
        frontClass: "slice slice-blue"
      },
      latentTensor: {
        x: 111.2,
        y: 17.5,
        w: 13.5,
        h: 13.5,
        r: 0.8,
        depthX: 3.6,
        depthY: -3.6,
        backs: [
          { dx: 3.6, dy: -3.6, className: "slice slice-violet-a" },
          { dx: 2.4, dy: -2.4, className: "slice slice-violet-b" },
          { dx: 1.2, dy: -1.2, className: "slice slice-violet-c" }
        ],
        frontClass: "slice slice-violet-d"
      },
      arrow: {
        x1: 61.5,
        y1: 25.5,
        x2: 89.5,
        y2: 25.5,
        headBack: 3,
        headRise: 2.2,
        pill: { x: 64.5, y: 15.2, w: 22, h: 6.3, r: 3.15 }
      },
      labels: [
        {
          x: 31.5, y: 7.4, text: "Пиксельное пространство",
          className: "space-title", anchor: "middle"
        },
        {
          x: 29, y: 27, text: "512 × 512",
          className: "face-size", anchor: "middle"
        },
        {
          x: 31.5, y: 42.2, text: "3 канала цвета",
          className: "channel-label", anchor: "middle"
        },
        {
          x: 31.5, y: 45.2, text: "3 × 512 × 512",
          className: "tensor-formula", anchor: "middle"
        },
        {
          x: 31.5, y: 48.1, text: "786 432 числа",
          className: "tensor-total", anchor: "middle"
        },
        {
          x: 118.5, y: 7.4, text: "Латентное пространство",
          className: "space-title", anchor: "middle"
        },
        {
          x: 117.95, y: 24.25, text: "64 × 64",
          className: "face-size", anchor: "middle"
        },
        {
          x: 118.5, y: 36.3, text: "4 канала признаков",
          className: "channel-label", anchor: "middle"
        },
        {
          x: 118.5, y: 43.2, text: "4 × 64 × 64",
          className: "tensor-formula", anchor: "middle"
        },
        {
          x: 118.5, y: 47.2, text: "16 384 числа",
          className: "tensor-total", anchor: "middle"
        },
        {
          x: 75.5, y: 18.35, text: "в 48 раз меньше",
          className: "arrow-label", anchor: "middle", offset: "-2px"
        },
        {
          x: 75.5, y: 31.2, text: "786 432 ÷ 16 384 = 48",
          className: "ratio-formula", anchor: "middle", offset: "4px"
        }
      ]
    }]);

    const [D] = diagramData;
    const origin = Object.freeze(D.origin);
    const scale = Object.freeze(D.scale);

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const stage = document.getElementById("stage");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      if (!svg || !stage || !fallback) {
        throw new Error("Не найдены элементы схемы");
      }

      const make = (name, attributes, content) => {
        const element = document.createElementNS(namespace, name);

        for (const [key, value] of Object.entries(attributes)) {
          element.setAttribute(key, String(value));
        }

        if (content) {
          element.textContent = content;
        }

        return element;
      };

      const append = element => {
        stage.appendChild(element);
        return element;
      };

      const drawRect = (box, className) => append(make("rect", {
        x: sx(box.x),
        y: sy(box.y),
        width: sx(box.x + box.w) - sx(box.x),
        height: sy(box.y + box.h) - sy(box.y),
        rx: sx(box.x + box.r) - sx(box.x),
        class: className
      }));

      const drawLine = (line, className) => append(make("line", {
        x1: sx(line.x1),
        y1: sy(line.y1),
        x2: sx(line.x2),
        y2: sy(line.y2),
        class: className
      }));

      const drawTensor = tensor => {
        for (const layer of tensor.backs) {
          drawRect({
            x: tensor.x + layer.dx,
            y: tensor.y + layer.dy,
            w: tensor.w,
            h: tensor.h,
            r: tensor.r
          }, layer.className);
        }

        drawLine({
          x1: tensor.x,
          y1: tensor.y,
          x2: tensor.x + tensor.depthX,
          y2: tensor.y + tensor.depthY
        }, "depth-line");

        drawLine({
          x1: tensor.x + tensor.w,
          y1: tensor.y,
          x2: tensor.x + tensor.w + tensor.depthX,
          y2: tensor.y + tensor.depthY
        }, "depth-line");

        drawLine({
          x1: tensor.x + tensor.w,
          y1: tensor.y + tensor.h,
          x2: tensor.x + tensor.w + tensor.depthX,
          y2: tensor.y + tensor.h + tensor.depthY
        }, "depth-line");

        drawRect({
          x: tensor.x,
          y: tensor.y,
          w: tensor.w,
          h: tensor.h,
          r: tensor.r
        }, tensor.frontClass);
      };

      const drawLabel = label => {
        const attributes = {
          x: sx(label.x),
          y: sy(label.y),
          class: label.className,
          "text-anchor": label.anchor,
          "dominant-baseline": "middle"
        };

        if (label.offset) {
          attributes.dy = label.offset;
        }

        append(make("text", attributes, label.text));
      };

      drawRect(D.cards.pixel, "card");
      drawRect(D.cards.latent, "card");
      drawLine(D.accents.pixel, "card-accent-pixel");
      drawLine(D.accents.latent, "card-accent-latent");

      drawTensor(D.pixelTensor);
      drawTensor(D.latentTensor);

      drawRect(D.arrow.pill, "arrow-pill");
      drawLine({
        x1: D.arrow.x1,
        y1: D.arrow.y1,
        x2: D.arrow.x2,
        y2: D.arrow.y2
      }, "arrow-line");

      append(make("polygon", {
        points: [
          `${sx(D.arrow.x2)},${sy(D.arrow.y2)}`,
          `${sx(D.arrow.x2 - D.arrow.headBack)},${sy(D.arrow.y2 - D.arrow.headRise)}`,
          `${sx(D.arrow.x2 - D.arrow.headBack)},${sy(D.arrow.y2 + D.arrow.headRise)}`
        ].join(" "),
        class: "arrow-head"
      }));

      for (const label of D.labels) {
        drawLabel(label);
      }
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");

      if (svg) {
        svg.hidden = true;
      }

      if (fallback) {
        fallback.hidden = false;
      }
    }
  </script>
</body>
</html>
