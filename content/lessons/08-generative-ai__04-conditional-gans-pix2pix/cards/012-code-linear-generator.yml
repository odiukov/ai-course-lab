- concept: добавление общего смещения ко всем объектам пакета через broadcasting
  question: Результат X @ W имеет форму (B, O), а bias — форму (O,). Почему выражение X @ W + bias корректно без ручного копирования bias?
  explanation: Размер bias совпадает с последней осью результата. Broadcasting виртуально распространяет этот вектор по оси пакета, поэтому смещение добавляется к выходу каждого объекта.
