- concept: декодер U-Net сочетает геометрию из skip-связей с семантическим контекстом из глубоких признаков
  question: Почему наличие skip-связей в генераторе Pix2Pix не означает, что он обязан просто скопировать входное изображение на выход?
  explanation: Прямые связи помогают ответить на вопрос, где находятся элементы, а глубокие признаки и обучаемый декодер определяют, как эти элементы должны выглядеть в целевом домене.
  kind: open
  reference: Skip-связи передают декодеру пространственную информацию о расположении границ и деталей, но не задают окончательные значения выходных пикселей. Декодер объединяет эти признаки с глубоким представлением сцены и синтезирует нужные цвета, текстуры и другие свойства результата.
