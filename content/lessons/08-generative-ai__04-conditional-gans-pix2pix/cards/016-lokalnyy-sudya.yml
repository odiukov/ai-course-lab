- concept: локальные оценки не позволяют удачной общей компоновке скрыть дефекты текстуры
  question: Почему PatchGAN легче обнаруживает размытую или рваную текстуру, даже если общая композиция сгенерированного изображения выглядит правильной?
  explanation: Одна глобальная оценка смешивает качество композиции и деталей. Сетка локальных вердиктов даёт отдельный обучающий сигнал для каждого проблемного участка, что помогает генератору создавать более резкие и правдоподобные детали.
  kind: open
  reference: PatchGAN отдельно оценивает множество локальных участков. Поэтому дефектная текстура получает плохие оценки в соответствующих областях и не может быть полностью компенсирована правильным расположением крупных объектов.
  id: 016-lokalnyy-sudya-2
