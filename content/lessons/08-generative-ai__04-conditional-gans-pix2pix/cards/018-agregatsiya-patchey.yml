- concept: операция усреднения сохраняет градиент для каждой локальной оценки PatchGAN
  question: Объясни своими словами, почему усреднение локальных потерь PatchGAN не лишает дефектный участок обучающего сигнала.
  explanation: В приведённой сетке участок с оценкой 0,2 остаётся отдельным слагаемым. При обратном распространении он получает собственный градиент, хотя итоговая величина потери агрегирована.
  kind: open
  reference: Каждая локальная потеря входит в среднее, поэтому при обратном распространении градиент проходит к каждой ячейке. Усреднение лишь масштабирует её вклад, но не удаляет его.
