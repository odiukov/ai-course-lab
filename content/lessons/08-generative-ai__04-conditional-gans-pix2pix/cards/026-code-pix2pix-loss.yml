- concept: состязательный штраф генератора убывает при росте оценки реалистичности созданной пары
  question: PatchGAN стал выше оценивать сгенерированную условную пару, а остальные величины не изменились. Что произойдёт со слагаемым −log D(x, G(x)) в потере генератора?
  explanation: Отрицательный логарифм убывает с ростом положительного аргумента. Поэтому высокая оценка реалистичности созданной пары означает меньший состязательный штраф для генератора.
  kind: choice
  options:
    - Оно уменьшится
    - Оно увеличится
    - Оно не изменится
    - Оно обязательно станет отрицательным
