  question: У линейного условного генератора все веса компонентов шума стали нулевыми. Что произойдёт, если многократно менять шум, сохраняя одну и ту же метку класса?
  explanation: При нулевых весах шума слагаемое w_z·z всегда исчезает. Для фиксированного класса остаётся постоянная сумма его веса и общего смещения, поэтому разнообразия внутри класса нет.
