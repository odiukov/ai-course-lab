- concept: единый протокол оценки и пороги фиксируются до выбора модели
  question: Расположи этапы корректного сравнения методов преобразования изображений.
  explanation: Критерии задают до эксперимента, а методы проверяют на одинаковых данных. Это не позволяет выбрать модель по эффектному примеру или изменить правила после просмотра результатов.
  kind: order
  items:
    - Зафиксировать тестовую выборку, метрики, пороги качества и бюджет задержки
    - Получить результаты всех методов на одинаковых тестовых данных
    - По единой процедуре измерить LPIPS, FID, предметные метрики и стоимость инференса
    - Отсеять нарушившие ограничения методы и сравнить оставшиеся
