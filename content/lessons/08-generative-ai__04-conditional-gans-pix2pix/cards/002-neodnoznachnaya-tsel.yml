- concept: пиксельная ошибка усредняет допустимые варианты и может создавать неправдоподобный результат
  question: Объясни своими словами, почему минимизация только среднеквадратичной ошибки может дать неестественное изображение, если для одного входа допустимы разные выходы.
  explanation: Пиксельная потеря не выбирает один из режимов распределения возможных ответов, а тянет предсказание к их среднему. Такое среднее минимизирует ошибку, но часто выглядит размытым или искусственным.
  kind: open
  reference: Среднеквадратичная ошибка поощряет предсказание, близкое ко всем наблюдаемым вариантам сразу. Если допустимые варианты заметно различаются, их пиксельное среднее может оказаться размытым или иметь цвет и текстуру, не соответствующие ни одному правдоподобному изображению.
  id: 002-neodnoznachnaya-tsel-2
  fingerprint: 629382fa
