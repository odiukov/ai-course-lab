- concept: в conditional GAN входное изображение подают и генератору, и дискриминатору
  question: Объясни своими словами, зачем в conditional GAN показывать исходное изображение не только генератору, но и дискриминатору.
  explanation: Если условие получает только генератор, дискриминатор всё ещё поощряет любое правдоподобное изображение целевого домена. Условие на входе дискриминатора позволяет состязательной потере штрафовать реалистичные, но не соответствующие исходнику результаты.
  kind: open
  reference: Генератору вход нужен, чтобы строить результат для конкретного исходного изображения. Дискриминатору он нужен, чтобы проверять не только реалистичность результата, но и соответствие пары «вход — выход».
  id: 001-upravlyaemaya-generatsiya-2
  fingerprint: 9baa2b70
