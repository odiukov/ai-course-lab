- concept: FiLM выполняет аффинное преобразование каждого признака с параметрами, вычисленными из условия
  question: Заполни формулу FiLM-модуляции признака h_k условием c.
  explanation: FiLM получает из условия коэффициенты масштаба γ и сдвига β, а затем отдельно модулирует каждый признак. Это сравнительно дешёвый способ добавить условие во внутреннее представление сети.
  kind: cloze
  template: h'_k = ___
  answer: γ_k(c) · h_k + β_k(c)
  accept:
