- concept: projection discriminator оценивает совместимость признаков результата с представлением условия
  question: Объясни своими словами, почему projection discriminator способен штрафовать правдоподобный результат, не соответствующий условию.
  explanation: Проекционный член напрямую связывает признаки изображения с условием. Несогласованный результат может выглядеть настоящим, но получит низкую оценку совместимости.
  kind: open
  reference: 'Он извлекает признаки результата и представление условия, а затем включает в итоговую оценку меру их совместимости. Поэтому одной реалистичности недостаточно: признаки результата должны подходить конкретному условию.'
  id: 031-uslovie-ignoriruetsya-2
