- concept: парность датасета определяется точным соответствием каждого входа целевому изображению
  question: Какое свойство датасета действительно позволяет обучать Pix2Pix с попиксельным сравнением результата и цели?
  explanation: Pix2Pix нужны пары «вход — правильная цель». Равное количество файлов или общая тематика не гарантируют соответствия объектов, ракурсов и геометрии.
  kind: choice
  options:
    - Входная и целевая коллекции содержат одинаковое количество изображений
    - Каждому входу соответствует изображение того же объекта с согласованными ракурсом и расположением деталей
    - Все изображения относятся к одной тематике
    - Целевые изображения выглядят реалистично независимо от входов
  correct: 1
  id: 037-vybor-img2img-1
  fingerprint: 9ed34b49
- concept: выбор между CycleGAN и ControlNet при отсутствии пар зависит от наличия структурной направляющей
  question: Парных целевых изображений нет. В каком случае разумнее выбрать ControlNet, а не CycleGAN?
  explanation: ControlNet обусловливает предобученную диффузионную модель структурным сигналом — например, глубиной, сегментацией или наброском. CycleGAN подходит для перевода между двумя непарными доменами, когда такой направляющей нет.
  kind: choice
  options:
    - Есть две независимые коллекции фотографий разных сезонов
    - Нужно выучить общий переход между двумя визуальными доменами
    - Для каждого результата задана карта глубины, сегментация или набросок, определяющие композицию
    - Для каждого входа существует точная фотография-цель
  correct: 2
  id: 037-vybor-img2img-2
  fingerprint: 4b1c02c8
