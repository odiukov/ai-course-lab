- concept: непарные домены не позволяют использовать пиксельную потерю с конкретной целевой картинкой
  question: Есть независимые наборы фотографий из исходного и целевого доменов, но соответствия между отдельными снимками неизвестны. Почему обычную парную L1-потерю Pix2Pix нельзя корректно применить к таким данным?
  explanation: Pix2Pix требует пары «вход — правильная цель». Случайная картинка из целевого домена содержит другую сцену, поэтому пиксельное сравнение будет штрафовать даже удачный перевод.
  kind: choice
  options:
    - L1-потеря работает только с чёрно-белыми изображениями
    - Для каждого входа неизвестно соответствующее целевое изображение, с которым нужно сравнивать пиксели
    - Дискриминатор не умеет различать изображения из разных доменов
    - Генератор нельзя обучать на наборах разного размера
  correct: 1
  id: 033-perevod-bez-par-1
  fingerprint: 17ae04a0
- concept: два встречных генератора CycleGAN ограничивают перевод без парных примеров
  question: Объясни своими словами, зачем CycleGAN обучает генераторы в обоих направлениях между непарными доменами, а не только перевод из исходного домена в целевой.
  explanation: 'Дискриминатор целевого домена проверяет реалистичность, но сам по себе не требует сохранить конкретный вход. Встречное направление создаёт основу для cycle consistency: после перевода туда и обратно должно восстанавливаться исходное изображение.'
  kind: open
  reference: 'Прямой генератор должен создавать реалистичные изображения целевого домена, а обратный — уметь восстановить из них исходный домен. Возможность обратного перевода ограничивает произвольную замену содержания: одного правдоподобия результата недостаточно, если исходная сцена при переводе теряется.'
  id: 033-perevod-bez-par-2
  fingerprint: 676e887f
