- concept: два направленных слагаемых циклической потери ограничивают циклы из обоих доменов
  question: Почему в CycleGAN циклическую ошибку вычисляют отдельно для изображений, пришедших из каждого из двух доменов?
  explanation: Одно слагаемое сравнивает объект из первого домена с результатом его прямого и обратного преобразований, а другое выполняет симметричную проверку для второго домена. Без одного из них соответствующий цикл останется без прямого штрафа за потерю информации.
  kind: open
  reference: Потому что проверка цикла, начинающегося в одном домене, не ограничивает восстановление объектов, пришедших из другого домена. Два слагаемых требуют сохранения информации при переводе туда и обратно в обоих направлениях.
