- concept: правильное среднее класса не исключает внутриклассовый mode collapse
  question: Среднее сгенерированных объектов совпадает со средним настоящего класса, но их стандартное отклонение почти равно нулю. Что произошло и почему проверки одного среднего недостаточно?
  explanation: Среднее описывает положение распределения, но не его разброс. Генератор, постоянно возвращающий центр класса, проходит проверку среднего, хотя не воспроизводит разнообразие настоящих данных.
