- concept: L1-потеря складывает абсолютные покомпонентные отклонения, поэтому ошибки разных знаков не компенсируются
  question: Для трёх значений цель равна [32, 175, 241], а выход генератора — [11, 229, 205]. Чему равна L1-потеря без усреднения?
  explanation: 'Нужно сложить модули отклонений: |32 − 11| + |175 − 229| + |241 − 205| = 21 + 54 + 36 = 111. Завышенное значение во втором компоненте не компенсирует заниженные значения в остальных.'
  kind: numeric
  answer: 111
  tolerance: 0.001
  id: 021-absolyutnaya-oshibka-1
  fingerprint: c9ac4a01
- concept: L1-потеря в Pix2Pix измеряет отклонение выхода от цели, соответствующей тому же входу
  question: В обучающем батче целевые изображения случайно переставили между входами, после чего продолжили вычислять L1-потерю между каждой новой парой. Что произойдёт?
  explanation: В Pix2Pix выражение ||y − G(x)||₁ полезно только тогда, когда y — цель из той же обучающей пары, что и x. После перестановки целей градиент направляет генератор к изображениям, не соответствующим его входам.
  kind: choice
  options:
    - Потеря не изменится, потому что она оценивает только визуальную реалистичность изображений
    - Потеря сама восстановит правильное соответствие между входами и целями
    - Генератор начнёт приближать выходы к целям других входов, и потеря перестанет измерять отклонение от правильного ответа
  correct: 2
  id: 021-absolyutnaya-oshibka-2
