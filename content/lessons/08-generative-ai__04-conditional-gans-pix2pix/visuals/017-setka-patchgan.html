<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Сетка локальных решений PatchGAN</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f7f9fc;
  --panel:#ffffff;
  --ink:#182230;
  --muted:#5d6878;
  --line:#98a5b5;
  --grid:#c7d0dc;
  --orange:#e66a2c;
  --orange-fill:#ffdbc8;
  --blue:#3478c9;
  --blue-fill:#cfe4ff;
  --image-a:#e6ebf1;
  --image-b:#d7dee8;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
figure{margin:0;background:var(--bg)}
figcaption{
  font-size:20px;
  font-weight:700;
  text-align:center;
  color:var(--ink);
}
svg{
  display:block;
  width:100%;
  height:auto;
  max-height:480px;
  background:var(--bg);
}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.fallback{
  font-size:16px;
  color:var(--ink);
  text-align:center;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#10151d;
    --panel:#171e28;
    --ink:#edf3fa;
    --muted:#a9b6c5;
    --line:#7f8fa2;
    --grid:#3d4a59;
    --orange:#ff8b4c;
    --orange-fill:#60331f;
    --blue:#6db0ff;
    --blue-fill:#173d68;
    --image-a:#26303c;
    --image-b:#303c49;
  }
}
</style>
</head>
<body>
<figure>
  <figcaption>Сетка локальных решений PatchGAN</figcaption>
  <svg id="diagram" viewBox="0 0 960 460" width="960" height="460"
       role="img" aria-labelledby="svg-title svg-desc"></svg>
  <p id="fallback" class="fallback" hidden>
    Изображение 256×256 делится на перекрывающиеся поля примерно 70×70,
    которым соответствуют 900 локальных оценок в сетке 30×30.
  </p>
</figure>
<script>
const DATA=[{
  origin:{x:0,y:0},
  scale:{x:1,y:1},
  zero:0,one:1,two:2,half:0.5,
  canvas:{left:0,top:0,right:960,bottom:460},
  input:{left:76,top:112,right:332,bottom:368,midX:204,midY:240},
  output:{left:628,top:112,right:884,bottom:368,midX:756,midY:240},
  size:256,patchSize:70,grid:30,total:900,
  patches:[
    {left:164,top:190,right:234,bottom:260,midX:199,midY:225,kind:"orange"},
    {left:184,top:210,right:254,bottom:280,midX:219,midY:245,kind:"blue"}
  ],
  selected:[
    {column:14,row:14,kind:"orange"},
    {column:15,row:14,kind:"blue"}
  ],
  arrows:[
    {
      kind:"orange",
      points:[
        {x:234,y:225},{x:388,y:164},{x:528,y:164},{x:751.73,y:235.73}
      ],
      head:[{x:751.73,y:235.73},{x:738,y:230},{x:742,y:244}]
    },
    {
      kind:"blue",
      points:[
        {x:254,y:245},{x:398,y:318},{x:536,y:318},{x:760.27,y:235.73}
      ],
      head:[{x:760.27,y:235.73},{x:746,y:231},{x:751,y:245}]
    }
  ],
  scenery:{
    horizon:{a:{x:76,y:278},b:{x:332,y:278}},
    roof:[
      {x:104,y:246},{x:154,y:198},{x:208,y:246}
    ],
    house:[
      {x:116,y:246},{x:116,y:330},{x:196,y:330},{x:196,y:246}
    ],
    door:[
      {x:143,y:282},{x:143,y:330},{x:169,y:330},{x:169,y:282}
    ],
    tree:[
      {x:267,y:206},{x:238,y:270},{x:296,y:270}
    ],
    trunk:[
      {x:262,y:270},{x:262,y:326},{x:273,y:326},{x:273,y:270}
    ],
    texture:[
      [{x:84,y:132},{x:126,y:112}],
      [{x:76,y:164},{x:176,y:112}],
      [{x:234,y:368},{x:332,y:310}],
      [{x:278,y:368},{x:332,y:336}],
      [{x:76,y:344},{x:118,y:368}]
    ],
    defect:[
      {x:207,y:224},{x:220,y:232},{x:210,y:241},
      {x:227,y:250},{x:216,y:262}
    ]
  },
  labels:{
    inputTitle:{x:204,y:64},
    inputSub:{x:204,y:88},
    outputTitle:{x:756,y:64},
    outputSub:{x:756,y:88},
    arrowOne:{x:426,y:153},
    arrowTwo:{x:430,y:330},
    patchTag:{x:158,y:181},
    gridTag:{x:890,y:236},
    note:{x:480,y:399},
    legendOne:{x:168,y:431},
    legendTwo:{x:548,y:431}
  },
  swatches:[
    {left:140,top:420,right:160,bottom:438,kind:"orange"},
    {left:520,top:420,right:540,bottom:438,kind:"blue"}
  ],
  pad:8,
  stroke:2,
  thin:1,
  heavy:3,
  titleFont:18,
  bodyFont:15,
  smallFont:13,
  opacitySoft:0.3,
  opacityPatch:0.42,
  dash:"7 6"
}];

const [cfg]=DATA;
const origin=cfg.origin;
const scale=cfg.scale;
const sx=x=>origin.x+x*scale.x;
const sy=y=>origin.y+y*scale.y;

try{
  const svg=document.getElementById("diagram");
  const fallback=document.getElementById("fallback");
  const NS="http://www.w3.org/2000/svg";

  const node=(name,attrs={},content="")=>{
    const item=document.createElementNS(NS,name);
    for(const [key,value] of Object.entries(attrs)){
      item.setAttribute(key,String(value));
    }
    if(content)item.textContent=content;
    return item;
  };

  const add=item=>svg.appendChild(item);

  const color=kind=>kind==="orange"
    ?{stroke:"var(--orange)",fill:"var(--orange-fill)"}
    :{stroke:"var(--blue)",fill:"var(--blue-fill)"};

  const pathFrom=(points,close=false)=>{
    const [first,...rest]=points;
    const commands=[`M ${sx(first.x)} ${sy(first.y)}`];
    for(const point of rest)commands.push(`L ${sx(point.x)} ${sy(point.y)}`);
    if(close)commands.push("Z");
    return commands.join(" ");
  };

  const boxPath=box=>pathFrom([
    {x:box.left,y:box.top},
    {x:box.right,y:box.top},
    {x:box.right,y:box.bottom},
    {x:box.left,y:box.bottom}
  ],true);

  const text=(anchor,value,options={})=>{
    const item=node("text",{
      x:sx(anchor.x),
      y:sy(anchor.y),
      "text-anchor":options.align||"middle",
      "font-size":options.size||cfg.bodyFont,
      "font-weight":options.weight||"400",
      fill:options.fill||"var(--ink)"
    },value);
    add(item);
    return item;
  };

  add(node("title",{id:"svg-title"},"Сетка локальных решений PatchGAN"));
  add(node("desc",{id:"svg-desc"},
    "Изображение 256 на 256 с двумя перекрывающимися полями примерно 70 на 70 связано с соседними ячейками выходной сетки 30 на 30."
  ));

  add(node("path",{
    d:boxPath(cfg.input),
    fill:"var(--panel)",
    stroke:"var(--line)",
    "stroke-width":cfg.stroke
  }));

  const imageTop=[
    {x:cfg.input.left,y:cfg.input.top},
    {x:cfg.input.right,y:cfg.input.top},
    {x:cfg.input.right,y:cfg.scenery.horizon.a.y},
    {x:cfg.input.left,y:cfg.scenery.horizon.a.y}
  ];
  const imageBottom=[
    {x:cfg.input.left,y:cfg.scenery.horizon.a.y},
    {x:cfg.input.right,y:cfg.scenery.horizon.a.y},
    {x:cfg.input.right,y:cfg.input.bottom},
    {x:cfg.input.left,y:cfg.input.bottom}
  ];
  add(node("path",{d:pathFrom(imageTop,true),fill:"var(--image-a)"}));
  add(node("path",{d:pathFrom(imageBottom,true),fill:"var(--image-b)"}));

  for(const segment of cfg.scenery.texture){
    add(node("path",{
      d:pathFrom(segment),
      fill:"none",
      stroke:"var(--line)",
      "stroke-width":cfg.thin,
      opacity:cfg.opacitySoft
    }));
  }

  add(node("path",{
    d:pathFrom([cfg.scenery.horizon.a,cfg.scenery.horizon.b]),
    fill:"none",stroke:"var(--line)","stroke-width":cfg.stroke
  }));
  add(node("path",{
    d:pathFrom(cfg.scenery.roof,true),
    fill:"var(--panel)",stroke:"var(--ink)","stroke-width":cfg.stroke
  }));
  add(node("path",{
    d:pathFrom(cfg.scenery.house,true),
    fill:"var(--panel)",stroke:"var(--ink)","stroke-width":cfg.stroke
  }));
  add(node("path",{
    d:pathFrom(cfg.scenery.door,true),
    fill:"var(--image-b)",stroke:"var(--ink)","stroke-width":cfg.thin
  }));
  add(node("path",{
    d:pathFrom(cfg.scenery.tree,true),
    fill:"var(--panel)",stroke:"var(--ink)","stroke-width":cfg.stroke
  }));
  add(node("path",{
    d:pathFrom(cfg.scenery.trunk,true),
    fill:"var(--panel)",stroke:"var(--ink)","stroke-width":cfg.thin
  }));
  add(node("path",{
    d:pathFrom(cfg.scenery.defect),
    fill:"none",
    stroke:"var(--orange)",
    "stroke-width":cfg.heavy,
    "stroke-linecap":"round",
    "stroke-linejoin":"round"
  }));

  for(const patch of cfg.patches){
    const palette=color(patch.kind);
    add(node("path",{
      d:boxPath(patch),
      fill:palette.fill,
      "fill-opacity":cfg.opacityPatch,
      stroke:palette.stroke,
      "stroke-width":cfg.heavy
    }));
  }

  add(node("path",{
    d:boxPath(cfg.output),
    fill:"var(--panel)",
    stroke:"var(--line)",
    "stroke-width":cfg.stroke
  }));

  const cellWidth=(cfg.output.right-cfg.output.left)/cfg.grid;
  const cellHeight=(cfg.output.bottom-cfg.output.top)/cfg.grid;

  for(let index=cfg.zero;index<=cfg.grid;index+=cfg.one){
    const gx=cfg.output.left+index*cellWidth;
    const gy=cfg.output.top+index*cellHeight;
    add(node("path",{
      d:pathFrom([
        {x:gx,y:cfg.output.top},
        {x:gx,y:cfg.output.bottom}
      ]),
      fill:"none",
      stroke:"var(--grid)",
      "stroke-width":cfg.thin
    }));
    add(node("path",{
      d:pathFrom([
        {x:cfg.output.left,y:gy},
        {x:cfg.output.right,y:gy}
      ]),
      fill:"none",
      stroke:"var(--grid)",
      "stroke-width":cfg.thin
    }));
  }

  for(const cell of cfg.selected){
    const left=cfg.output.left+cell.column*cellWidth;
    const top=cfg.output.top+cell.row*cellHeight;
    const selectedBox={
      left,
      top,
      right:left+cellWidth,
      bottom:top+cellHeight
    };
    const palette=color(cell.kind);
    add(node("path",{
      d:boxPath(selectedBox),
      fill:palette.fill,
      stroke:palette.stroke,
      "stroke-width":cfg.heavy
    }));
  }

  for(const arrow of cfg.arrows){
    const palette=color(arrow.kind);
    const [start,c1,c2,end]=arrow.points;
    add(node("path",{
      d:`M ${sx(start.x)} ${sy(start.y)} C ${sx(c1.x)} ${sy(c1.y)} ${sx(c2.x)} ${sy(c2.y)} ${sx(end.x)} ${sy(end.y)}`,
      fill:"none",
      stroke:palette.stroke,
      "stroke-width":cfg.stroke,
      "stroke-linecap":"round"
    }));
    add(node("path",{
      d:pathFrom(arrow.head,true),
      fill:palette.stroke,
      stroke:palette.stroke,
      "stroke-width":cfg.thin
    }));
  }

  text(cfg.labels.inputTitle,"Входное изображение",{
    size:cfg.titleFont,weight:"700"
  });
  text(cfg.labels.inputSub,"256×256 пикселей",{
    size:cfg.bodyFont,fill:"var(--muted)"
  });
  text(cfg.labels.outputTitle,"Выход PatchGAN",{
    size:cfg.titleFont,weight:"700"
  });
  text(cfg.labels.outputSub,"30×30 = 900 оценок",{
    size:cfg.bodyFont,fill:"var(--muted)"
  });

  text(cfg.labels.arrowOne,"поле одной ячейки ≈70×70",{
    size:cfg.smallFont,fill:"var(--orange)"
  });
  text(cfg.labels.arrowTwo,"соседняя ячейка — сдвинутое поле",{
    size:cfg.smallFont,fill:"var(--blue)"
  });
  text(cfg.labels.patchTag,"перекрытие",{
    align:"end",size:cfg.smallFont,fill:"var(--muted)"
  });
  text(cfg.labels.gridTag,"локальные",{
    align:"start",size:cfg.smallFont,fill:"var(--muted)"
  });
  text(
    {x:cfg.labels.gridTag.x,y:cfg.labels.gridTag.y+cfg.pad+cfg.smallFont},
    "решения",
    {align:"start",size:cfg.smallFont,fill:"var(--muted)"}
  );

  add(node("path",{
    d:pathFrom([
      {x:cfg.labels.gridTag.x-cfg.pad,y:cfg.labels.gridTag.y-cfg.pad},
      {x:cfg.output.right,y:cfg.labels.gridTag.y-cfg.pad}
    ]),
    fill:"none",
    stroke:"var(--muted)",
    "stroke-width":cfg.thin,
    "stroke-dasharray":cfg.dash
  }));

  text(cfg.labels.note,"Ячейка сетки — мнение об участке, а не значение пикселя",{
    size:cfg.bodyFont,weight:"600"
  });

  for(const swatch of cfg.swatches){
    const palette=color(swatch.kind);
    add(node("path",{
      d:boxPath(swatch),
      fill:palette.fill,
      stroke:palette.stroke,
      "stroke-width":cfg.stroke
    }));
  }

  text(cfg.labels.legendOne,"поле одной оценки",{
    align:"start",size:cfg.smallFont,fill:"var(--ink)"
  });
  text(cfg.labels.legendTwo,"соседнее перекрывающееся поле",{
    align:"start",size:cfg.smallFont,fill:"var(--ink)"
  });

  fallback.hidden=true;
}catch(error){
  const svg=document.getElementById("diagram");
  const fallback=document.getElementById("fallback");
  if(svg)svg.hidden=true;
  if(fallback)fallback.hidden=false;
}
</script>
</body>
</html>
