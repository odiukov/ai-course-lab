<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Путь текста до идентификаторов токенов</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f6f8fc;
    --panel: #ffffff;
    --card: #f9fbff;
    --text: #172033;
    --muted: #5c687d;
    --line: #9aa8bd;
    --accent: #c93457;
    --accent-soft: #fde8ee;
    --token: #e8effb;
    --token-border: #8296b5;
    --final: #173f76;
    --final-text: #ffffff;
    --shadow: #d8dfeb;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #101521;
      --panel: #151c2b;
      --card: #192235;
      --text: #f2f5fb;
      --muted: #b4bfd2;
      --line: #71809a;
      --accent: #ff6684;
      --accent-soft: #422332;
      --token: #263550;
      --token-border: #7890b5;
      --final: #8cbcff;
      --final-text: #101521;
      --shadow: #080b12;
    }
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--page);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
  }

  figure {
    margin: 0;
    padding: 14px 16px 12px;
    background: var(--panel);
    border: 1px solid var(--shadow);
  }

  figcaption {
    margin: 0 0 5px;
    font-size: 21px;
    font-weight: bold;
    letter-spacing: .01em;
  }

  .intro {
    margin: 0 0 8px;
    color: var(--muted);
    font-size: 14px;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 420px;
    background: var(--panel);
  }

  .canvas {
    fill: var(--panel);
  }

  .rail {
    stroke: var(--line);
    stroke-width: 3px;
    stroke-linecap: round;
  }

  .arrow-head {
    fill: var(--accent);
  }

  .card-shadow {
    fill: var(--shadow);
  }

  .card {
    fill: var(--card);
    stroke: var(--line);
    stroke-width: 2px;
  }

  .card.final-card {
    stroke: var(--accent);
    stroke-width: 3px;
  }

  .divider {
    stroke: var(--line);
    stroke-width: 1px;
  }

  .stage-title {
    fill: var(--text);
    font-size: 18px;
    font-weight: bold;
  }

  .stage-role {
    fill: var(--muted);
    font-size: 12px;
    letter-spacing: .04em;
  }

  .example-box {
    fill: var(--accent-soft);
    stroke: var(--accent);
    stroke-width: 2px;
  }

  .example-text {
    fill: var(--text);
    font-size: 25px;
    font-weight: bold;
  }

  .ligature-mark {
    stroke: var(--accent);
    stroke-width: 4px;
    stroke-linecap: round;
  }

  .token {
    fill: var(--token);
    stroke: var(--token-border);
    stroke-width: 2px;
  }

  .token.special {
    fill: var(--accent-soft);
    stroke: var(--accent);
  }

  .token.id {
    fill: var(--final);
    stroke: var(--final);
  }

  .token-text {
    fill: var(--text);
    font-size: 15px;
    font-weight: bold;
  }

  .id-text {
    fill: var(--final-text);
    font-size: 15px;
    font-weight: bold;
  }

  .note {
    fill: var(--muted);
    font-size: 13px;
  }

  .eyebrow {
    fill: var(--accent);
    font-size: 13px;
    font-weight: bold;
    letter-spacing: .08em;
  }

  .trace {
    fill: var(--text);
    font-size: 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  .takeaway {
    fill: var(--muted);
    font-size: 14px;
  }

  .fallback {
    margin: 10px 0 0;
    padding: 12px;
    color: var(--text);
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    font-size: 14px;
  }

  .fallback[hidden] {
    display: none;
  }
</style>
</head>
<body>
<figure aria-labelledby="diagram-title">
  <figcaption id="diagram-title">Путь текста до идентификаторов токенов</figcaption>
  <p class="intro">Одна и та же фраза последовательно меняет форму представления.</p>
  <svg id="pipeline" viewBox="0 0 1440 400" width="1440" height="400"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="diagram-title diagram-desc">
    <desc id="diagram-desc">Конвейер от исходного текста с лигатурой до идентификаторов токенов.</desc>
  </svg>
  <p id="fallback" class="fallback" hidden>
    Схема должна показать путь «ﬁ cat» через нормализацию, предразбиение,
    BPE-объединения и служебные токены к ID 1, 418, 972, 2.
  </p>
</figure>

<script>
const diagram = {
  frame: { x: 0, y: 0, w: 1440, h: 400 },
  card: { y: 92, w: 205, h: 222, shadowX: 5, shadowY: 6, r: 15 },
  headerDividerY: 165,
  eyebrow: { x: 720, y: 56 },
  cards: [
    {
      x: 32,
      titleX: 134.5,
      title: "Исходный текст",
      role: "RAW TEXT",
      roleX: 134.5,
      example: { x: 50, y: 183, w: 169, h: 66, r: 12 },
      exampleText: { x: 134.5, y: 222, text: "ﬁ cat" },
      mark: { x1: 97, y1: 232, x2: 116, y2: 232 },
      note: { x: 134.5, y: 281, text: "ﬁ — единая лигатура" }
    },
    {
      x: 267,
      titleX: 369.5,
      title: "Нормализация",
      role: "NORMALIZE · NFKC",
      roleX: 369.5,
      example: { x: 285, y: 183, w: 169, h: 66, r: 12 },
      exampleText: { x: 369.5, y: 222, text: "fi cat" },
      note: { x: 369.5, y: 281, text: "лигатура раскрыта: f + i" }
    },
    {
      x: 502,
      titleX: 604.5,
      title: "Предразбиение",
      role: "PRE-TOKENIZE",
      roleX: 604.5,
      tokens: [
        { x: 527, y: 193, w: 64, h: 46, r: 10, textX: 559, textY: 222, text: "fi" },
        { x: 607, y: 193, w: 75, h: 46, r: 10, textX: 644.5, textY: 222, text: "cat" }
      ],
      note: { x: 604.5, y: 281, text: "два фрагмента по границе слова" }
    },
    {
      x: 737,
      titleX: 839.5,
      title: "BPE-объединения",
      role: "BPE MERGE",
      roleX: 839.5,
      tokens: [
        { x: 762, y: 193, w: 64, h: 46, r: 10, textX: 794, textY: 222, text: "fi" },
        { x: 842, y: 193, w: 75, h: 46, r: 10, textX: 879.5, textY: 222, text: "cat" }
      ],
      note: { x: 839.5, y: 281, text: "оба фрагмента есть в словаре" }
    },
    {
      x: 972,
      titleX: 1074.5,
      title: "Служебные токены",
      role: "SPECIAL TOKENS",
      roleX: 1074.5,
      tokens: [
        { x: 989, y: 193, w: 48, h: 46, r: 9, textX: 1013, textY: 222, text: "[BOS]", kind: "special" },
        { x: 1041, y: 193, w: 28, h: 46, r: 9, textX: 1055, textY: 222, text: "fi" },
        { x: 1073, y: 193, w: 34, h: 46, r: 9, textX: 1090, textY: 222, text: "cat" },
        { x: 1111, y: 193, w: 48, h: 46, r: 9, textX: 1135, textY: 222, text: "[EOS]", kind: "special" }
      ],
      note: { x: 1074.5, y: 281, text: "добавлены начало и конец" }
    },
    {
      x: 1207,
      titleX: 1309.5,
      title: "Идентификаторы",
      role: "TOKEN IDs",
      roleX: 1309.5,
      final: true,
      tokens: [
        { x: 1225, y: 193, w: 28, h: 46, r: 9, textX: 1239, textY: 222, text: "1", kind: "id" },
        { x: 1259, y: 193, w: 48, h: 46, r: 9, textX: 1283, textY: 222, text: "418", kind: "id" },
        { x: 1313, y: 193, w: 48, h: 46, r: 9, textX: 1337, textY: 222, text: "972", kind: "id" },
        { x: 1367, y: 193, w: 28, h: 46, r: 9, textX: 1381, textY: 222, text: "2", kind: "id" }
      ],
      note: { x: 1309.5, y: 281, text: "строки условного словаря" }
    }
  ],
  arrows: [
    { x1: 237, y1: 203, x2: 255, y2: 203, points: [{x:267,y:203},{x:255,y:195},{x:255,y:211}] },
    { x1: 472, y1: 203, x2: 490, y2: 203, points: [{x:502,y:203},{x:490,y:195},{x:490,y:211}] },
    { x1: 707, y1: 203, x2: 725, y2: 203, points: [{x:737,y:203},{x:725,y:195},{x:725,y:211}] },
    { x1: 942, y1: 203, x2: 960, y2: 203, points: [{x:972,y:203},{x:960,y:195},{x:960,y:211}] },
    { x1: 1177, y1: 203, x2: 1195, y2: 203, points: [{x:1207,y:203},{x:1195,y:195},{x:1195,y:211}] }
  ],
  trace: {
    x: 720,
    y: 352,
    text: "ﬁ cat  →  fi cat  →  fi | cat  →  [BOS] fi cat [EOS]  →  1 418 972 2"
  },
  takeaway: {
    x: 720,
    y: 381,
    text: "Форма меняется на каждом переходе; модель получает только финальные числа."
  }
};
const origin = { x: 0, y: 0 };
const scale = { x: 1, y: 1 };

function sx(x) {
  return origin.x + x * scale.x;
}

function sy(y) {
  return origin.y + y * scale.y;
}

try {
  const svg = document.getElementById("pipeline");
  const fallback = document.getElementById("fallback");
  const ns = "http://www.w3.org/2000/svg";

  function node(name, attributes, text) {
    const item = document.createElementNS(ns, name);
    Object.entries(attributes).forEach(([key, value]) => {
      item.setAttribute(key, String(value));
    });
    if (text !== undefined) item.textContent = text;
    return item;
  }

  function rect(parent, box, className, radius) {
    parent.appendChild(node("rect", {
      x: sx(box.x),
      y: sy(box.y),
      width: sx(box.w),
      height: sy(box.h),
      rx: sx(radius),
      ry: sy(radius),
      class: className
    }));
  }

  function text(parent, value, x, y, className, anchor) {
    parent.appendChild(node("text", {
      x: sx(x),
      y: sy(y),
      class: className,
      "text-anchor": anchor
    }, value));
  }

  function line(parent, item, className) {
    parent.appendChild(node("line", {
      x1: sx(item.x1),
      y1: sy(item.y1),
      x2: sx(item.x2),
      y2: sy(item.y2),
      class: className
    }));
  }

  function polygon(parent, points, className) {
    const mapped = points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" ");
    parent.appendChild(node("polygon", {
      points: mapped,
      class: className
    }));
  }

  rect(svg, diagram.frame, "canvas", diagram.frame.x);
  text(svg, "ОДНА СТРОКА · ВЕСЬ КОНВЕЙЕР",
    diagram.eyebrow.x, diagram.eyebrow.y, "eyebrow", "middle");

  diagram.arrows.forEach(arrow => {
    line(svg, arrow, "rail");
    polygon(svg, arrow.points, "arrow-head");
  });

  diagram.cards.forEach(stage => {
    const shadow = {
      x: stage.x + diagram.card.shadowX,
      y: diagram.card.y + diagram.card.shadowY,
      w: diagram.card.w,
      h: diagram.card.h
    };
    const body = {
      x: stage.x,
      y: diagram.card.y,
      w: diagram.card.w,
      h: diagram.card.h
    };
    rect(svg, shadow, "card-shadow", diagram.card.r);
    rect(svg, body, stage.final ? "card final-card" : "card", diagram.card.r);

    text(svg, stage.title, stage.titleX, 127, "stage-title", "middle");
    text(svg, stage.role, stage.roleX, 151, "stage-role", "middle");

    line(svg, {
      x1: stage.x + 17,
      y1: diagram.headerDividerY,
      x2: stage.x + 188,
      y2: diagram.headerDividerY
    }, "divider");

    if (stage.example) {
      rect(svg, stage.example, "example-box", stage.example.r);
      text(svg, stage.exampleText.text, stage.exampleText.x,
        stage.exampleText.y, "example-text", "middle");
    }

    if (stage.mark) {
      line(svg, stage.mark, "ligature-mark");
    }

    if (stage.tokens) {
      stage.tokens.forEach(token => {
        const tokenClass = token.kind ? `token ${token.kind}` : "token";
        const textClass = token.kind === "id" ? "id-text" : "token-text";
        rect(svg, token, tokenClass, token.r);
        text(svg, token.text, token.textX, token.textY,
          textClass, "middle");
      });
    }

    text(svg, stage.note.text, stage.note.x, stage.note.y,
      "note", "middle");
  });

  text(svg, diagram.trace.text, diagram.trace.x, diagram.trace.y,
    "trace", "middle");
  text(svg, diagram.takeaway.text, diagram.takeaway.x,
    diagram.takeaway.y, "takeaway", "middle");

  fallback.hidden = true;
} catch (error) {
  document.getElementById("fallback").hidden = false;
}
</script>
</body>
</html>
