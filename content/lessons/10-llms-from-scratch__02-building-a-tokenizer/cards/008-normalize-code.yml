- concept: внутри стадии нормализации обязательная форма Unicode применяется раньше опциональных сворачиваний регистра и диакритики
  question: Стадия нормализации токенизатора обязательно приводит текст к форме NFKC, а нижний регистр и снятие диакритики включаются флагами. Расставь операции в порядке, при котором результат детерминирован и флаги независимы.
  explanation: 'NFKC идёт первым, потому что он разворачивает лигатуры и полноширинные формы в обычные буквы — только после этого сворачивание регистра и удаление знаков видят те самые базовые символы. Обратный порядок оставляет лигатуру нетронутой для lowercase, и одинаковые на вид строки снова расходятся. Флаги при этом остаются необязательными: при обоих выключенных на выходе только NFKC.'
  kind: order
  items:
    - Привести строку к нормальной форме NFKC
    - Если включён флаг нижнего регистра — свернуть регистр
    - Если включён флаг снятия диакритики — сделать каноническую декомпозицию и выбросить комбинируемые знаки
  id: 008-normalize-code-1
  fingerprint: bdd6673d
- concept: снятие диакритики — это каноническая декомпозиция плюс удаление символов категории Mn, а не фильтр по диапазону кодов
  question: Нужно снять диакритику так, чтобы «Ångström» дало «Angstrom», а кириллица, дефисы и пробелы остались на месте. Какая реализация корректна?
  explanation: 'Декомпозиция отделяет базовую букву от комбинируемого знака, и удаляются именно знаки категории Mn (nonspacing mark). Фильтр по коду вместе с диакритикой снесёт кириллицу и любой другой алфавит. NFKC ничего не снимает: «é» после него остаётся «é» одним композитным символом. Категория P — про пунктуацию, к ударениям отношения не имеет.'
  kind: choice
  options:
    - Разложить строку канонической декомпозицией (NFD) и выбросить символы Unicode-категории Mn, затем при желании собрать обратно
    - Оставить только символы с кодом меньше U+0080, остальные отбросить
    - Привести строку к NFKC — совместимостная нормализация сама убирает надстрочные знаки
    - Удалить символы, у которых Unicode-категория начинается с P (пунктуация)
  correct: 0
  id: 008-normalize-code-2
  fingerprint: b70ac1df
- concept: совместимостная эквивалентность (NFKC/NFKD) сворачивает лигатуры и полноширинные формы, каноническая (NFC/NFD) — нет
  question: Токенизатор должен получать одинаковые куски для лигатуры «ﬀ» и пары «ff», а также для полноширинной «Ｂ» и обычной «B». Какая нормальная форма Unicode это обеспечивает и почему?
  explanation: Лигатура и полноширинная буква связаны с обычными буквами только совместимостной эквивалентностью, поэтому нужна K-форма (NFKC или NFKD). NFC и NFD работают лишь с канонической эквивалентностью — «ﬀ» они не тронут, и токенизатор выдаст разные ID для визуально одинаковых слов. Формы различаются, и выбор между NFC и NFKC для токенизатора не косметический.
  kind: choice
  options:
    - 'NFKC: совместимостная эквивалентность заменяет лигатуры и полноширинные формы на их обычные аналоги, затем результат складывается в композитный вид'
    - 'NFC: канонической композиции достаточно, лигатура и пара букв канонически эквивалентны'
    - 'NFD: разложение на составные части само по себе разбивает лигатуру на две буквы'
    - Любая из форм — все четыре дают одинаковый результат для латиницы
  correct: 0
  id: 008-normalize-code-3
  fingerprint: b5699b56
