- concept: размер таблицы эмбеддингов равен произведению размера словаря на размерность модели
  question: У токенизатора словарь на 48 000 токенов, модель работает с размерностью скрытого состояния 3072. Сколько параметров занимает таблица эмбеддингов?
  explanation: 'Каждой строке словаря соответствует вектор длины d_model, поэтому параметров ровно |V| × d_model = 48 000 × 3072 = 147 456 000. Это и есть цена большого словаря: короче последовательности, но тяжелее слой эмбеддингов (и связанный с ним выходной слой, если веса не разделяются).'
  kind: numeric
  answer: 147456000
  tolerance: 1000000
  id: 044-real-benchmark-1
  fingerprint: 8b7fb671
- concept: корректное сравнение токенизаторов требует отключить автоматическое добавление специальных токенов
  question: Один и тот же абзац подают двум токенизаторам. Первый выдаёт 214 токенов, второй — 216. Второй по умолчанию сам дописывает маркеры начала и конца последовательности. Что делать перед сравнением?
  explanation: 'Служебные токены не относятся к тексту и добавляются по разным правилам, поэтому измеряется не сжатие, а настройки обёртки. Правильный ход — выровнять условия (add_special_tokens=False у всех) и заново измерить. Ручное вычитание фиксированной константы ненадёжно: число и состав служебных токенов различаются у разных моделей и режимов.'
  kind: choice
  options:
    - Отключить автоматическое добавление специальных токенов у обоих и пересчитать
    - Вычесть 2 из результата второго и считать сравнение завершённым
    - Взять второй токенизатор как более информативный, раз он даёт больше токенов
    - Сравнивать только размеры словарей, длины последовательностей несопоставимы в принципе
  correct: 0
  id: 044-real-benchmark-2
  fingerprint: a40a85c2
- concept: размер словаря не определяет степень сжатия на конкретном языке — решают обучающий корпус, pre-tokenization и merges
  question: Токенизатор со словарём 65 000 токенов, обученный преимущественно на английском, даёт на японском тексте больше токенов, чем токенизатор со словарём 40 000, обученный на многоязычном корпусе. Почему это ожидаемо?
  explanation: Ёмкость словаря — верхняя граница, а заполняют её частые пары обучающего корпуса. Если японских последовательностей в корпусе почти не было, слияний для них не выучено, и текст распадается на короткие куски. Размер словаря коррелирует со сжатием только при сопоставимом покрытии домена и одинаковых правилах pre-tokenization.
  kind: choice
  options:
    - Merges выучены под распределение обучающего корпуса, поэтому строки редких там письменностей дробятся почти до отдельных байтов
    - 'Большие словари всегда хуже сжимают: чем больше строк, тем реже находится совпадение'
    - Японский текст не проходит Unicode-нормализацию, поэтому любой токенизатор режет его на байты
    - Размер словаря влияет только на слой эмбеддингов и вообще не связан с длиной последовательности
  correct: 0
  id: 044-real-benchmark-3
  fingerprint: 216dc6df
