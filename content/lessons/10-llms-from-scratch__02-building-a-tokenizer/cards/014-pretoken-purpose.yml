- concept: ведущий пробел входит в токен, поэтому слово с пробелом и без него — разные токены с разными ID
  question: 'Токенизатор GPT-2 применили к двум промптам: `Write a poem about` и `Write a poem about ` (второй с пробелом на конце). Далее модель продолжает текст словом `birds`. Что произойдёт с последовательностью ID?'
  explanation: 'Правила разбиения GPT-2 приклеивают необязательный ведущий пробел к следующему слову, поэтому `birds` и ` birds` — две разные записи словаря с разными ID. Лишний пробел в конце промпта уже съеден отдельным токеном пробела, и модель видит другую числовую последовательность, чем ожидалось. Отсюда практическое правило: не оставлять висячих пробелов в промпте.'
  kind: choice
  options:
    - 'Последовательности совпадут: пробел на конце строки игнорируется как незначимый символ'
    - 'Последовательности разойдутся: в первом случае дальше пойдёт токен ` birds` с ведущим пробелом, во втором — отдельный токен пробела и токен `birds` без пробела'
    - Последовательности разойдутся только длиной, но ID слова `birds` будет одинаковым в обоих вариантах
    - Второй промпт вызовет ошибку кодирования, так как висячий пробел не покрывается паттерном
  correct: 1
  id: 014-pretoken-purpose-1
  fingerprint: 38b9db6c
- concept: меньше ограничений на область merges даёт компактнее последовательность, но менее предсказуемый и хуже интерпретируемый словарь
  question: Одна команда обучает BPE поверх жёстких правил разбиения (слова, числа, пунктуация — по отдельности), другая отдаёт BPE сырой поток байтов без разбиения. Что ожидаемо получит вторая команда?
  explanation: 'Так работает SentencePiece-подход: BPE видит одну длинную последовательность и вправе склеивать пары через пробелы. Частые словосочетания превращаются в один токен, сжатие может вырасти, но в словаре появляются единицы вроде `d fo`, по которым сложно предсказать поведение модели. Жёсткие правила GPT-2 отдают немного сжатия ради предсказуемости.'
  kind: choice
  options:
    - Более длинную закодированную последовательность на том же тексте, зато полностью человекочитаемый словарь
    - 'Тот же словарь: правила разбиения влияют только на скорость обучения, но не на набор выученных merges'
    - Иногда более компактное кодирование за счёт токенов, захватывающих части соседних слов, но словарь труднее интерпретировать и контролировать
    - Гарантированно меньший размер словаря при той же длине последовательности
  correct: 2
  id: 014-pretoken-purpose-2
  fingerprint: c351d007
- concept: правила предварительного разбиения GPT-2 отрезают сокращения в отдельный кусок
  question: 'Паттерн предварительного разбиения GPT-2 отдельно перечисляет сокращения (`''s`, `''t`, `''ll`, `''ve`, `''re`). Заполни пропуск: результат разбиения строки `I don''t mind`.'
  explanation: Ветка для сокращений стоит в паттерне первой, поэтому `don't` рвётся на ` don` и `'t`, а не остаётся одним куском. Так апостроф с окончанием получает свой стабильный токен, а BPE не учит склейку через апостроф внутри каждого глагола отдельно.
  kind: cloze
  template: '["I", " don", ___, " mind"]'
  answer: '"''t"'
  accept:
    - '''t'
    - ’t
    - '"''t"'
  id: 014-pretoken-purpose-3
  fingerprint: 2d14f74c
