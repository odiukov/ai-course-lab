- concept: выигрыш скомпилированного токенизатора — постоянный множитель от снятия накладных расходов интерпретатора, а не улучшение алгоритма
  question: Объясни своими словами, откуда берётся выигрыш скомпилированной реализации токенизатора и почему её называют ускорением в постоянное число раз, а не более быстрым алгоритмом.
  explanation: 'Ключ в разделении «что считаем» и «чем считаем». tiktoken на Rust, HuggingFace Tokenizers на Rust, SentencePiece на C++ реализуют ровно те же стадии — они убирают стоимость интерпретации, а не число операций. Отсюда практический вывод: учебная Python-версия годится, чтобы разобрать механизм, а в продакшене из Python вызывают скомпилированное ядро через обёртку.'
  kind: open
  reference: 'Алгоритм тот же: нормализация, разбиение на чанки, применение merges в обученном порядке. Различается стоимость одной элементарной операции. В Python каждый шаг цикла над байтами тянет за собой диспетчеризацию интерпретатора, создание объектов и работу сборщика мусора; в Rust или C++ это плотный цикл над буфером байтов почти без накладных расходов. Поэтому выигрыш — постоянный множитель (обычно один-два порядка): зависимость времени от объёма текста остаётся линейной, просто коэффициент при ней меньше. Чтобы поменять асимптотику, нужно менять сам алгоритм, а не язык.'
  id: 045-production-speed-3
  fingerprint: bfde8458
