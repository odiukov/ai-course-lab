- concept: оценка времени токенизации корпуса как деление объёма на пропускную способность
  question: Корпус предобучения содержит 8 триллионов токенов. Токенизатор обрабатывает 2 миллиона токенов в секунду. Сколько суток непрерывной работы займёт токенизация всего корпуса? Ответ в сутках.
  explanation: '8e12 / 2e6 = 4e6 секунд. 4 000 000 / 86 400 ≈ 46,3 суток. Такая прикидка и объясняет, почему пропускная способность токенизатора — фактор планирования всего проекта: при скорости порядка миллиона токенов в секунду подготовка входа съедает месяцы до старта обучения.'
  kind: numeric
  answer: 46.3
  tolerance: 1.5
  id: 045-production-speed-1
  fingerprint: 4f539eff
- concept: смена языка реализации меняет пропускную способность, но не результат кодирования
  question: 'Команда заменяет свой Python-токенизатор на скомпилированную реализацию, загрузив в неё тот же артефакт: правила нормализации, тот же regex предварительного разбиения и ту же таблицу merges. Что изменится в результате кодирования текста?'
  explanation: Выход токенизатора задан артефактом — спецификацией нормализации, правилами pre-tokenization и упорядоченной таблицей merges, а не языком, на котором крутится цикл. Скомпилированное ядро исполняет те же стадии быстрее. Если ID разошлись, значит разошёлся препроцессинг или словарь, а не «язык реализации».
  kind: choice
  options:
    - 'Ничего: последовательность token ID будет та же, изменится только скорость обработки'
    - Последовательность станет короче, потому что скомпилированный код применяет merges агрессивнее
    - Изменятся ID токенов, потому что скомпилированная реализация использует собственный порядок словаря
    - Появятся дополнительные специальные токены на границах чанков
