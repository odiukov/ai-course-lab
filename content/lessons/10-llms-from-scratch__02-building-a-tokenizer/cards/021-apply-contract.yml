- concept: merges применяются в порядке обучения, потому что поздняя запись опирается на токен, созданный ранней
  question: 'Обученная таблица BPE содержит две записи в таком порядке: (108, 111) → 400, затем (400, 119) → 401. Кодировщик получает чанк [108, 111, 119], но по ошибке проходит таблицу снизу вверх: сначала вторая запись, потом первая. Что окажется на выходе?'
  explanation: 'Вторая запись ищет пару (400, 119), но токена 400 в чанке ещё нет — правило срабатывает вхолостую и ничего не меняет. Затем первая запись даёт [400, 119], но момент применить (400, 119) уже упущен: таблица пройдена. Правильный порядок даёт [108, 111, 119] → [400, 119] → [401]. Набор правил тот же, результат разный, поэтому порядок merges — часть самой инструкции, а не деталь оформления.'
  kind: choice
  options:
    - '[401]'
    - '[400, 119]'
    - '[108, 111, 119]'
    - '[400, 401]'
  correct: 1
  id: 021-apply-contract-1
  fingerprint: 5d9e0c0d
- concept: 'результат одного merge становится входом следующего: последовательность перезаписывается на каждой итерации'
  question: Заполни пропуск, чтобы apply_merges применяла всю обученную таблицу последовательно, а не независимо от предыдущих шагов.
  explanation: Каждый merge обязан работать с формой, оставленной предыдущим, поэтому результат кладётся обратно в ту же переменную. Если писать в новое имя (например, merged) и передавать в apply_merge исходный byte_seq, каждое правило применится к нетронутому чанку, и уцелеет только эффект последнего — цепочки слияний не получится.
  kind: cloze
  template: |-
    def apply_merges(byte_seq, merges):
        for pair, new_id in merges.items():
            ___ = apply_merge(byte_seq, pair, new_id)
        return byte_seq
  answer: byte_seq
  accept:
    - byte_seq
    - 'byte_seq '
  id: 021-apply-contract-2
  fingerprint: 51d21a0b
- concept: 'при кодировании частоты пар не пересчитываются: обученная таблица уже задаёт готовую последовательность действий'
  question: Почему на этапе кодирования не нужно искать в чанке самую частую пару и пересортировывать таблицу merges? Объясни своими словами.
  explanation: 'Обучение и кодирование делают разное: обучение выбирает правила по статистике, кодирование их исполняет. Порядок в таблице — уже застывший результат всех прошлых решений о частотах, поэтому кодировщику остаётся только линейно прогнать чанк через каждое правило, включая те, что не сработают.'
  kind: open
  reference: 'Частоты пар — инструмент обучения: именно по ним выбиралось, какую пару слить очередной, и результат этого выбора уже записан в таблицу в виде упорядоченного списка правил. При кодировании таблица фиксирована, и её порядок и есть готовая инструкция: пройти правила сверху вниз, применяя каждое к текущей последовательности. Пересчёт частот на конкретном чанке дал бы другой порядок склеек и, значит, другие ID для того же текста — токенизация перестала бы быть воспроизводимой и совместимой с обучением. Если очередная пара в чанке не встречается, правило просто ничего не меняет, и кодировщик переходит к следующему; такие холостые проходы нормальны и не требуют никакой проверки частот.'
  id: 021-apply-contract-3
  fingerprint: 4774b374
