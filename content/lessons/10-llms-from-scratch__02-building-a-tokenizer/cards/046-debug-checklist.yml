- concept: 'merge в BPE — чистая конкатенация: байты нового токена равны байтам левой части плюс байтам правой'
  question: 'Проверка целостности таблицы merges: для каждой записи (left_id, right_id) -> new_id байты нового токена должны получаться из байтов его частей. Заполните пропуск в утверждении.'
  explanation: Merge не добавляет, не удаляет и не переставляет байты — он только объявляет, что пара соседних токенов отныне хранится под одним ID. Значит байтовая строка нового токена ровно равна конкатенации байтов левой и правой части. Нарушение этого равенства означает битую таблицу словаря или merges, а не проблему кодирования.
  kind: cloze
  template: assert token_bytes(new_id) == token_bytes(left_id) ___ token_bytes(right_id)
  answer: +
  accept:
    - +
    - плюс
    - конкатенация
    - concat
  id: 046-debug-checklist-1
  fingerprint: 0f14fb11
- concept: 'равенство декодированного текста слабее равенства последовательностей ID: декодирование неинъективно по разбиению'
  question: Своя реализация токенизатора и эталонная дают на одном чате одинаковый декодированный текст, но разные списки token IDs. Что отсюда следует?
  explanation: Разные разбиения одной строки декодируются в один и тот же текст — decode склеивает байты и теряет информацию о границах. Модель же видит именно ID, и незнакомое ей разбиение бьёт по качеству. Поэтому строгий критерий сверки с эталоном — совпадение полного списка ID, а не текста после decode.
  kind: choice
  options:
    - 'Реализации ведут себя по-разному: модель получит другую последовательность входов, хотя текст восстанавливается тот же'
    - Реализации эквивалентны — совпадение текста после decode и есть критерий корректности
    - 'Ошибка в декодере: одинаковый текст обязан давать одинаковые ID'
    - Разница в ID безопасна, пока длина обеих последовательностей одинакова
  correct: 0
  id: 046-debug-checklist-2
  fingerprint: 65621a15
- concept: токен хранит произвольную последовательность байтов, которая может быть неполным фрагментом многобайтового символа
  question: Байты одного эмодзи разошлись по двум соседним токенам. Что даёт попытка декодировать каждый из этих токенов по отдельности как текст?
  explanation: 'Byte-level BPE работает с байтами, а не с символами, поэтому граница токена свободно режет многобайтовый символ. Отдельный токен не обязан быть валидным текстом. Именно поэтому осматривать словарь надо в байтовом представлении: строковый вывод подменит обрезок замещающим символом и спрячет ошибку, а ведущий пробел сделает невидимым.'
  kind: choice
  options:
    - Обрезанные последовательности байтов, которые печатаются как замещающий символ или сбоят при строгом декодировании
    - Эмодзи в каждом из двух токенов — байты дублируются при merge
    - 'Пустые строки: неполные символы отбрасываются словарём'
    - Исходный эмодзи целиком в первом токене и пустоту во втором
  correct: 0
  id: 046-debug-checklist-3
