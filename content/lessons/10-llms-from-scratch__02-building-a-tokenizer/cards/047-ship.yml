- concept: воспроизводимость требует детерминированного разрешения ничьих по частоте пар при обучении BPE
  question: Обучение BPE запускают дважды на одном корпусе с одинаковыми настройками и одинаковым порядком данных. Таблицы merges получаются разными начиная с некоторой записи, и словари не совпадают. Что наиболее вероятная причина?
  explanation: Пары с равной частотой встречаются постоянно, и выбор между ними должен задаваться фиксированным правилом (например, лексикографическим порядком), а не порядком обхода структуры данных. Одна иначе разрешённая ничья меняет следующий шаг обучения, и дальше расходится вся таблица. Нормализация и закреплённые ID специальных токенов детерминированы по определению.
  kind: choice
  options:
    - Ничьи по частоте пар разрешаются недетерминированно, например через порядок обхода хеш-таблицы
    - Корпус слишком мал, и статистика пар не успевает стабилизироваться
    - Специальные токены получают разные ID при каждом запуске
    - Unicode-нормализация недетерминирована для редких символов
  correct: 0
  id: 047-ship-2
