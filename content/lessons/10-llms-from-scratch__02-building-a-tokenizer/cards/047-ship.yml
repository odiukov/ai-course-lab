- concept: при пересечении зарегистрированных специальных токенов выбирается самое длинное совпадение
  question: 'В токенизаторе зарегистрированы два специальных токена: `<|end|>` с ID 7 и `<|end_of_text|>` с ID 12. На вход подаётся строка, содержащая ровно `<|end_of_text|>`. Что даст корректная реализация?'
  explanation: Поиск специальных токенов идёт по правилу самого длинного совпадения, поэтому более длинный зарегистрированный маркер выигрывает у своего префикса. Иначе разметка ходов распалась бы на короткий маркер плюс мусорный хвост обычного текста, и модель получила бы структуру, которой не видела при обучении.
  kind: choice
  options:
    - Один токен с ID 12
    - Токен с ID 7, за которым идут обычные токены остатка `_of_text|>`
    - 'Оба ID подряд: 7 и 12'
    - 'Ошибку: пересекающиеся специальные токены запрещены'
  correct: 0
  id: 047-ship-3
  fingerprint: 3ea50bcf
