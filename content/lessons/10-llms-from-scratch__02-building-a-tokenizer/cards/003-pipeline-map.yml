- concept: Unicode-нормализация приводит визуально одинаковые записи к одной форме, иначе один и тот же на вид текст даёт разные ID
  question: 'В корпусе слово «office» встречается в двух вариантах: обычным набором и с лигатурой (один кодовый символ вместо пары букв). Токенизатор работает без стадии Unicode-нормализации. Что произойдёт?'
  explanation: 'Лигатура хранится как отдельный кодовый символ, поэтому байтовая последовательность у неё другая. BPE работает с тем, что получил: разные байты — разные merge-цепочки — разные ID. NFKC на стадии Normalize раскладывает лигатуру в обычные буквы и убирает расхождение до того, как текст доходит до BPE.'
  kind: choice
  options:
    - Два варианта дадут разные последовательности token ID, и модель будет считать их разными словами
    - BPE всё равно сольёт их в один токен, потому что merge-правила работают на уровне байтов
    - Лигатура будет отброшена как неизвестный символ, и оба варианта совпадут
    - Разница исчезнет на стадии ID mapping, так как одинаковые строки получают один ID
  correct: 0
  id: 003-pipeline-map-1
  fingerprint: 6ba5c860
- concept: token ID — произвольный индекс в словаре конкретного токенизатора, а не свойство самой строки
  question: Токен `ing` в одном токенизаторе имеет ID 3057. Что можно сказать про этот же токен в другом токенизаторе с другим словарём?
  explanation: 'ID — это просто номер строки в таблице словаря, результат обучения BPE на конкретном корпусе. Ничего в числе 3057 не выводится из букв `ing`. У другого токенизатора такого токена может не быть вовсе: тогда текст разобьётся на более мелкие куски. Поэтому ID нельзя переносить между токенизаторами, и веса эмбеддингов жёстко привязаны к своему словарю.'
  kind: choice
  options:
    - ID будет тем же, потому что ID вычисляется из символов токена
    - ID почти наверняка другой, а сама строка может вообще отсутствовать в словаре и распасться на части
    - ID будет другим, но порядковый номер относительно других токенов сохранится
    - ID совпадёт, если оба словаря одного размера
  correct: 1
  id: 003-pipeline-map-2
  fingerprint: b7ffaf6e
- concept: нормализация теряет информацию, поэтому декодирование ID не возвращает исходный текст побайтово
  question: Инженер закодировал текст, а затем декодировал полученные token ID обратно в строку. Результат отличается от исходника, хотя словарь покрыл все фрагменты. Объясни, на какой стадии конвейера теряется информация и почему это не считается багом.
  explanation: 'Ключевое: конвейер не биективен. Нормализация — единственная стадия, где два разных входа могут дать один выход; pre-tokenize, BPE и ID mapping обратимы. Полезно при отладке: если декодированный текст ''почти'' совпадает, смотри на настройки нормализатора, а не на merge-правила.'
  kind: open
  reference: 'Теряет информацию нормализация. NFKC (а также опциональные нижний регистр и снятие диакритики) — это отображение многие-к-одному: лигатуры, разные варианты записи одного символа, регистр схлопываются в каноническую форму. После этой стадии восстановить, какой именно из вариантов был на входе, уже нельзя: дальше по конвейеру идёт только нормализованный текст. Декодирование возвращает нормализованную строку, а не исходные байты. Это осознанный размен: без него визуально одинаковые слова получали бы разные ID и модель училась бы им как разным словам. Отсюда практическое следствие: расхождение исходника и декодированного результата надо расследовать, идя по конвейеру слева направо от нормализации, а не гадать по последним числам.'
  id: 003-pipeline-map-3
  fingerprint: b121d12e
