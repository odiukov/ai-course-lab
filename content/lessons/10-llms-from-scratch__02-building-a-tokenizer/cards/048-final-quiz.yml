- concept: fertility — отношение числа выходных токенов к числу входных слов
  question: Абзац из 30 слов токенизатор превратил в 84 токена. Чему равна fertility токенизатора на этом тексте?
  explanation: 'Fertility = токены / слова = 84 / 30 = 2.8. Для сравнения: у GPT-4 на английском примерно 1.3, на корейском 2-3. Высокая fertility означает, что тот же смысл съедает больше контекстного окна и больше денег за токены, хотя текст кодируется без ошибок.'
  kind: numeric
  answer: 2.8
  tolerance: 0.05
  id: 048-final-quiz-1
  fingerprint: 89e7532b
- concept: chat template специфичен для модели и должен совпадать с тем, что модель видела при обучении
  question: Ты берёшь список сообщений role/content и разворачиваешь его в плоскую строку по chat-шаблону одной модели, а подаёшь другой модели с другим форматом маркеров. Что произойдёт?
  explanation: 'Chat template — часть контракта конкретной модели: точный порядок маркеров начала последовательности, заголовков ролей, разделителей и маркеров конца хода. Чужие маркеры либо распадутся на обычные BPE-токены, либо дадут непривычную структуру, и модель окажется вне распределения обучения. Сбоя при этом не будет — байтовая база кодирует что угодно, поэтому ошибку видно только по деградации ответов.'
  kind: choice
  options:
    - Токенизатор второй модели откажется кодировать строку и вернёт ошибку неизвестного формата
    - Строка закодируется нормально, но модель получит разметку ролей, которой не видела при обучении, и качество ответов упадёт
    - 'Ничего не изменится: шаблон влияет только на читаемость, модель смотрит только на содержимое сообщений'
    - Маркеры чужого шаблона автоматически переотобразятся в специальные ID второй модели
  correct: 1
  id: 048-final-quiz-2
  fingerprint: ae9afcd2
