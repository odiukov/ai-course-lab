- concept: 'ID mapping — чистый lookup: он не может исправить неверное разбиение, сделанное выше по конвейеру'
  question: 'Токенизатор со словарём в 4096 токенов выдаёт для слова неудачное разбиение на subword-единицы. Инженер предлагает починить это на стадии ID mapping: переназначить проблемному токену другой ID. Что произойдёт?'
  explanation: ID mapping — последняя стадия и чистое соответствие «строка токена → целое число». Количество и границы токенов зафиксированы раньше, на стадиях pre-tokenize и BPE merge. Смена ID меняет только число, которое увидит модель, а не то, как текст был разрезан. Чинить надо ту стадию, где разбиение возникло.
  kind: choice
  options:
    - 'Разбиение не изменится: ID mapping лишь заменяет уже готовые строки токенов числами и не пересматривает, как текст был поделён'
    - Разбиение исправится, потому что ID определяет, из каких байтов состоит токен
    - BPE автоматически переприменит merge-правила после смены ID
    - Изменится длина последовательности токенов, так как новый ID покрывает больше символов
  correct: 0
  id: 004-stage-contracts-1
  fingerprint: 2eb11014
- concept: нормализация переписывает форму символов, но не сегментирует текст — границы кусков задаёт pre-tokenization
  question: Какая стадия конвейера токенизации отвечает за то, где именно текст будет разрезан на куски, внутри которых дальше работают merge-правила?
  explanation: Нормализация работает над формой записи (NFKC, регистр, диакритика) и выдаёт ту же непрерывную строку — сегментации в её договоре нет. Куски определяет pre-tokenization, а BPE применяет merge только внутри полученного куска и не пересматривает его границы.
  kind: choice
  options:
    - 'Нормализация: приводя запись к NFKC и нижнему регистру, она заодно размечает слова'
    - 'Pre-tokenization: нормализация только переписывает форму символов и не выделяет слова'
    - 'BPE merge: он сам выбирает, где закончить один кусок и начать следующий'
    - 'Стадия специальных токенов: она расставляет разделители между словами'
  correct: 1
  id: 004-stage-contracts-2
  fingerprint: 76b0378f
- concept: 'диагностика конвейера: искать первую стадию, нарушившую свой договор, а не править последующую'
  question: Токенизатор выдал странный результат. Объясни своими словами, почему при отладке конвейера (normalize → pre-tokenize → BPE merge → special tokens → ID mapping) правильнее искать самую раннюю стадию с нарушенным контрактом, а не сразу править merge-правила.
  explanation: 'Это стандартный приём отладки любого конвейера: локализовать первую точку, где инвариант нарушен. У токенизатора каждая стадия имеет узкую зону ответственности, и нижестоящая стадия не имеет ни информации, ни полномочий исправлять решения вышестоящей.'
  kind: open
  reference: 'Стадии выстроены последовательно: каждая принимает выход предыдущей как данность. Если ошибка возникла раньше, все последующие стадии работают корректно по своему договору, но на уже испорченном входе — и симптом проявляется на выходе, далеко от причины. Правка merge-правила в такой ситуации лечит симптом: само правило может быть верным, просто оно применилось к неверно нарезанному куску. Более того, правка ломает разбиения, которые работали правильно, и рассинхронизирует токенизатор с обучающими данными модели. Поэтому диагностика идёт от начала конвейера: смотрим, что вернула нормализация, потом какие куски дал pre-tokenizer, потом что сделал BPE внутри куска, потом вставку специальных токенов, и чиним первую стадию, чей выход уже неверен.'
  id: 004-stage-contracts-3
  fingerprint: d431e3cb
