- concept: порядок стадий конвейера токенизации от сырого текста до ID
  question: Расставь стадии продакшен-токенизатора в том порядке, в котором они обрабатывают сырую строку.
  explanation: 'Выход каждой стадии — вход следующей. Нормализация обязана быть первой: она устраняет разные способы записи одного текста до того, как что-либо режется и сливается. Претокенизация ставит барьеры для BPE. BPE собирает подслова. Специальные токены добавляют уже поверх готовых токенов, а ID-маппинг завершает конвейер, потому что модель принимает числа.'
  kind: order
  items:
    - Нормализация Unicode (например, NFKC) и опциональный нижний регистр
    - 'Претокенизация: разрез строки на предварительные куски по словам и пунктуации'
    - Применение выученных BPE-merge к последовательностям байтов
    - Вставка специальных токенов (начало/конец последовательности, маркеры chat template)
    - Замена строк токенов на целые ID
  id: 002-pipeline-1
  fingerprint: fddcad55
- concept: претокенизация нужна, чтобы BPE не сливал символы через границы слов
  question: Токенизатор обучают на корпусе, где часто встречается пара слов «run fast». Что произойдёт, если из конвейера убрать стадию претокенизации?
  explanation: Претокенизация режет строку на куски и запрещает merge пересекать эти границы. Без неё частая биграмма слов заставит BPE выучить бессмысленный кросс-словный токен вроде «n f», который раздувает словарь и плохо переносится на новые тексты. На нормализацию и на ID-маппинг это никак не влияет — у них своя стадия.
  kind: choice
  options:
    - BPE сможет выучить merge, покрывающий кусок «n f» вместе с пробелом, то есть токен через границу слов
    - BPE перестанет сливать байты вообще и вернёт посимвольный словарь
    - Специальные токены получат неверные ID
    - Нормализация перестанет разворачивать лигатуры
  correct: 0
  id: 002-pipeline-2
  fingerprint: 89367f4a
- concept: специальные токены имеют фиксированные ID и не участвуют в BPE-слияниях
  question: Объясни своими словами, почему специальные токены (BOS, EOS, PAD, маркеры ролей чата) выносят в отдельную стадию и не пропускают через BPE.
  explanation: 'Ключевые пункты: фиксированный ID, структурная (а не текстовая) роль, невозможность подделать их обычным вводом. Отсюда и место в конвейере — после BPE-merge, перед ID-маппингом.'
  kind: open
  reference: 'Специальные токены несут структуру ввода, а не содержание текста: они помечают начало и конец последовательности, паддинг, границы ролей. Им нужны фиксированные, заранее известные ID, на которые опирается модель и код обработки. Если бы их прогоняли через BPE, строка вроде [EOS] распалась бы на обычные подслова, получила бы плавающие ID и её нельзя было бы отличить от того же текста, случайно набранного пользователем. Поэтому их вставляют после BPE-merge, целиком, и они никогда не участвуют в слияниях.'
  id: 002-pipeline-3
  fingerprint: f2dad798
