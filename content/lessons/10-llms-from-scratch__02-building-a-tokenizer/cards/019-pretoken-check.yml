- concept: ветка пробел+слово захватывает максимум один пробел, остаток пробельного прогона уходит в отдельный чанк
  question: Претокенизатор GPT-2 (`'(?:[sdmt]|ll|ve|re)| ?\p{L}+| ?\p{N}+| ?[^\s\p{L}\p{N}]+|\s+(?!\S)|\s+`) обрабатывает строку `Hi   there` с тремя пробелами подряд. Какой список чанков он вернёт?
  explanation: 'Квантификатор `?` в ` ?\p{L}+` разрешает ровно один ведущий пробел. Лишние пробелы совпадают с веткой `\s+(?!\S)`: она берёт пробельный прогон, за которым не идёт непробельный символ, то есть все пробелы, кроме последнего. Поэтому получается `Hi`, `  `, ` there`. Ничего не теряется — склейка чанков даёт исходную строку.'
  kind: choice
  options:
    - '`Hi`, `   there` — весь пробельный прогон приклеивается к слову'
    - '`Hi`, `  `, ` there` — два пробела отдельным чанком, третий уходит слову'
    - '`Hi`, `   `, `there` — пробелы целиком отдельный чанк, слово без пробела'
    - '`Hi`, `there` — пробелы отбрасываются'
  correct: 1
  id: 019-pretoken-check-1
  fingerprint: 45ec9ffd
- concept: буквенная и цифровая ветки паттерна не смешиваются, поэтому буквенно-цифровой кусок режется на границе типа символа
  question: Что вернёт претокенизатор GPT-2 на строке `cat9dog`?
  explanation: 'Ветки ` ?\p{L}+` и ` ?\p{N}+` разные: буквенная останавливается на `9`, цифровая — на `d`. Разбиение по типу символа не даёт BPE выучить слияния вида «буквы+цифры» и держит числа отдельно от слов.'
  kind: choice
  options:
    - '`cat9dog` — один чанк, внутри нет пробелов'
    - '`cat`, `9`, `dog` — три чанка'
    - '`cat9`, `dog` — цифра прилипает к предыдущим буквам'
  correct: 1
  id: 019-pretoken-check-2
  fingerprint: 3d4a6d11
- concept: статистика пар при обучении BPE собирается внутри чанков, поэтому пара, разорванная границей, никогда не попадает в таблицу merges
  question: Почему в обученной таблице merges в принципе не может появиться правило, склеивающее конец одного претокен-чанка с началом следующего?
  explanation: 'Граница чанка непроходима симметрично: и на обучении (пара не считается), и на инференсе (merge не применяется). Поэтому регулярка претокенизатора фактически задаёт верхнюю границу того, какие токены вообще могут появиться в словаре.'
  kind: open
  reference: 'Обучение BPE считает частоты соседних пар только внутри отдельного чанка: корпус после претокенизации — это набор независимых последовательностей символов, а не одна сплошная строка. Пара, чьи элементы лежат по разные стороны границы чанка, ни разу не учитывается как соседняя, её частота равна нулю, и она никогда не выигрывает шаг слияния. Тот же порядок работает и при кодировании: даже если бы такое правило откуда-то взялось, применять его было бы не к чему, потому что каждый чанк кодируется отдельно.'
  id: 019-pretoken-check-3
  fingerprint: 45f81c7a
