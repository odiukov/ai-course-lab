- concept: объект совпадения regex возвращает сам текст фрагмента методом group()
  question: Претокенизатор обходит совпадения регулярки и должен собрать список строк. Заполни пропуск, чтобы в список попал текст совпавшего фрагмента, а не служебный объект.
  explanation: finditer отдаёт объекты Match, а не строки. group() (то же самое, что group(0)) возвращает весь совпавший фрагмент; group(1) вернул бы первую скобочную группу, а start()/span() — только координаты. Без group() дальше по конвейеру полетят объекты Python вместо кусков текста.
  kind: cloze
  template: |-
    for match in PATTERN.finditer(text):
        chunks.append(match.___())
  answer: group
  accept:
    - group
    - group(0)
    - .group
    - match.group
  id: 018-pretoken-code-1
  fingerprint: 98bfcae9
- concept: 'претокенизация обязана быть обратимой: склейка кусков без разделителя даёт исходную строку'
  question: Какое свойство обязано выполняться для корректного претокенизатора текста?
  explanation: 'Претокенизатор только режет, но ничего не теряет и не переставляет: пробелы, переводы строк и пунктуация тоже становятся кусками. Поэтому "".join(chunks) == text — базовая проверка стадии. Если пробел выброшен, декодирование уже никогда не восстановит текст, а границы слов поедут.'
  kind: choice
  options:
    - Склейка всех выданных кусков без разделителя посимвольно совпадает с входной строкой
    - Каждый кусок содержит ровно одно слово, а пробелы и пунктуация отбрасываются
    - Куски отсортированы по длине от короткого к длинному
    - Количество кусков равно количеству слов во входной строке
  correct: 0
  id: 018-pretoken-code-2
  fingerprint: 593dfc43
- concept: Unicode-свойства \p{L}/\p{N} доступны только в модуле regex, ASCII-классы в re не покрывают другие письменности
  question: Паттерн GPT-2 использует классы \p{L} и \p{N}. Что произойдёт при откате на стандартный модуль re с ASCII-заменой ( ?[a-zA-Z]+ и  ?[0-9]+ ) на тексте с кириллицей, греческим или арабским?
  explanation: \p{L} и \p{N} — Unicode-свойства (любая буква, любая цифра), их поддерживает только сторонний модуль regex. В re такого синтаксиса нет, поэтому ветки сужают до [a-zA-Z] и [0-9], и текст вне ASCII уже не собирается в куски-слова. Для мультиязычного токенизатора ставят regex.
  kind: choice
  options:
    - 'Ничего не изменится: re понимает \p{L}, просто пишет его иначе'
    - Не-латинские буквы перестают попадать в «словесную» ветку паттерна, и разбиение таких языков ломается
    - re сам приведёт все буквы к латинице перед сопоставлением
    - Разбиение станет точнее, потому что ASCII-классы строже
  correct: 1
  id: 018-pretoken-code-3
  fingerprint: 40a15db8
