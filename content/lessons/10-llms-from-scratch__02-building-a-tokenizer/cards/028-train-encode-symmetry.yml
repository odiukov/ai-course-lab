- concept: артефакт токенизатора — это merges вместе со спецификацией нормализации и pre-tokenization; смена препроцессинга равна смене токенизатора
  question: Коллега предлагает сохранять в чекпоинт токенизатора только словарь и таблицу merges, а нормализацию и предварительное разбиение «просто описать в README». Объясни своими словами, почему это ломает воспроизводимость.
  explanation: 'Ключ: таблица merges — не самостоятельный объект, а настройка под конкретную подготовку текста. Поменял подготовку — поменял токенизатор, даже если файл merges побайтово тот же. Реальные форматы (tokenizer.json у HuggingFace) поэтому хранят normalizer и pre_tokenizer как декларативные секции рядом с merges.'
  kind: open
  reference: 'Merges обучены на результатах конкретных преобразований: конкретной формы Unicode-нормализации с конкретными настройками и конкретного шаблона предварительного разбиения. Пара байтов попала в таблицу только потому, что препроцессинг положил эти байты рядом внутри одного чанка. Значит, merges имеют смысл только в паре с тем же самым препроцессингом, применённым в том же порядке. Если нормализатор или шаблон разбиения задан не машиночитаемо, а прозой, любая переустановка, другая версия библиотеки regex или чужая интерпретация правила даёт другие чанки и другие байты — тот же текст получает другие ID. Модель, обученная на старых ID, видит фактически другой токенизатор. Поэтому препроцессинг обязан быть частью сериализованного артефакта наравне с merges.'
