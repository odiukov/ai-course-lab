- concept: рассогласование препроцессинга между обучением и использованием не даёт ни ошибки, ни искажения декодированного текста — только рост длины последовательности
  question: В сервисе изменили regex предварительного разбиения (теперь ведущий пробел отделяется от слова), а таблицу merges оставили от старого обучения. По какому признаку это обнаружится быстрее всего?
  explanation: 'Decode — это склейка байтов по vocab, она не зависит от того, какими merges собирались токены, поэтому текст восстановится. Словарь тоже не меняется: merges просто перестают срабатывать. Единственный внешний симптом — компрессия ухудшилась: больше токенов на тот же текст, дороже инференс и короче эффективный контекст.'
  kind: choice
  options:
    - Средняя длина последовательности в токенах на том же тексте вырастет, хотя decode по-прежнему даёт исходную строку
    - decode начнёт возвращать искажённый текст с заменяющими символами
    - encode начнёт возвращать ID больше размера словаря
    - Размер словаря уменьшится, потому что часть merges станет недостижимой
