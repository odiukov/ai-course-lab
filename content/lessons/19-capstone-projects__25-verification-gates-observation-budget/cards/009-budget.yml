- concept: BudgetGate разрешает новый вызов только при накопленном расходе строго ниже лимита
  question: Заполни условие разрешения вызова в BudgetGate.
  explanation: При used == max_tokens бюджет уже исчерпан, поэтому равенство должно приводить к отказу. Гейт разрешает вызов только при строгом неравенстве used < max_tokens.
  kind: cloze
  template: allow = ___
  answer: used < max_tokens
  accept:
    - used < self.max_tokens
    - ctx.ledger.cumulative() < max_tokens
    - ctx.ledger.cumulative() < self.max_tokens
