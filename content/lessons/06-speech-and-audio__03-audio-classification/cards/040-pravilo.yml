- concept: высокое качество на обучении при низком качестве на валидации у свежей модели на малом датасете указывает на переобучение
  question: Свёрточная аудиомодель, обученная с нуля на небольшом датасете, почти безошибочна на обучающих клипах, но заметно хуже работает на валидации. Объясни вероятную причину и почему предобученный backbone может помочь.
  explanation: Большой разрыв между обучением и валидацией — типичный признак переобучения. На малом датасете свежей сети приходится одновременно открывать общие акустические признаки и решать прикладную задачу, тогда как предобученный энкодер предоставляет готовое представление.
  kind: open
  reference: У модели слишком много настраиваемых параметров относительно объёма данных, поэтому она запоминает обучающие записи и их случайные особенности вместо устойчивых закономерностей. Предобученный backbone уже кодирует общие свойства аудио, а обучение компактной головы требует подобрать гораздо меньше параметров и потому снижает риск переобучения.
  id: 040-pravilo-2
  fingerprint: 4eb6f9db
