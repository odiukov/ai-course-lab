- concept: результаты разных бенчмарков нельзя сравнивать без учёта задачи и метрики
  question: Одна аудиомодель показывает почти потолочную accuracy на одноэтикеточном наборе и заметно меньший mAP на многометочном наборе. Какой вывод корректен?
  explanation: Accuracy оценивает выбор класса в одноэтикеточной задаче, а mAP — качество ранжирования меток по классам в многометочной. Их числовые значения лежат на похожей шкале, но не имеют одинакового смысла.
  kind: choice
  options:
    - 'По этим значениям нельзя определить, на каком наборе модель работает лучше: задачи и метрики различаются'
    - Модель хуже справляется с многометочным набором ровно во столько раз, во сколько mAP меньше accuracy
    - Любое значение accuracy следует напрямую сравнивать с mAP
    - Меньшее числовое значение метрики всегда означает более слабую модель
  correct: 0
  id: 038-chisla-2026-1
  fingerprint: 2bdc1698
- concept: mAP в многометочной классификации не является долей правильно классифицированных клипов
  question: Объясни своими словами, почему mAP нельзя интерпретировать как долю аудиоклипов, для которых модель дала полностью правильный набор меток.
  explanation: В многометочном аудио на одном клипе могут одновременно присутствовать несколько событий. mAP отдельно оценивает ранжирование для каждого класса и усредняет эти оценки, поэтому не означает «такова доля правильных клипов».
  kind: open
  reference: Для каждого класса average precision оценивает, насколько хорошо модель ранжирует положительные примеры относительно отрицательных, после чего результаты усредняются по классам. Поэтому mAP характеризует среднее качество ранжирования меток, а не долю клипов с безошибочно угаданным набором событий.
  id: 038-chisla-2026-2
  fingerprint: bd529423
- concept: почти насыщенный бенчмарк слабо различает дальнейшие улучшения моделей
  question: На одноэтикеточном аудиобенчмарке лучшие модели уже ошибаются лишь на редких примерах. Почему небольшая разница в accuracy между ними может быть малоинформативной?
  explanation: Возле потолка остаётся мало ошибок, поэтому итог легко меняется из-за спорных меток и конкретного набора тестовых примеров. Такой бенчмарк хуже различает модели, даже если его accuracy выглядит впечатляюще.
  kind: choice
  options:
    - Accuracy автоматически превращается в mAP при малом числе ошибок
    - Разница может быть сопоставима с шумом разметки и случайностью состава тестовой выборки
    - При высокой accuracy модель перестаёт выдавать вероятности классов
    - Одноэтикеточные бенчмарки нельзя оценивать с помощью accuracy
  correct: 1
  id: 038-chisla-2026-3
  fingerprint: 79eda620
