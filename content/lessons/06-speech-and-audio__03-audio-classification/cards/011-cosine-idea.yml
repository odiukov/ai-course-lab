- concept: защита вычисления косинусной близости от нулевой нормы
  question: Объясни, почему косинусная близость не определена для нулевого вектора и зачем в программной реализации заменять его норму малой положительной константой.
  explanation: 'Геометрический косинус для нулевого вектора не существует: направление определить нельзя. Защитная константа задаёт практическое вычислительное соглашение и не позволяет тихому клипу вызвать деление на ноль.'
  kind: open
  reference: У нулевого вектора нет направления, а его норма равна нулю, поэтому формула требует деления на ноль. Малая положительная константа предотвращает вычислительную ошибку; поскольку скалярное произведение с нулевым вектором также нулевое, такая реализация возвращает нулевую близость.
  id: 011-cosine-idea-2
  fingerprint: 4214ac76
