- concept: F1 класса можно напрямую вычислить из TP, FP и FN
  question: Для одного класса TP = 6, FP = 3, FN = 7. Чему равен F1 этого класса?
  explanation: 'Прямая формула: F1 = 2TP / (2TP + FP + FN). Получаем 12 / (12 + 3 + 7) = 12 / 22 ≈ 0.545. Если знаменатель этой формулы равен нулю, реализация должна вернуть для класса 0.0.'
  kind: numeric
  answer: 0.545
  tolerance: 0.002
