- concept: тестовая выборка должна сохранять распределение классов рабочего потока
  question: Почему тестовую выборку нельзя искусственно балансировать вслед за обучающей?
  explanation: Балансировка — средство обучения. Для честной оценки тест должен отражать частоты классов в рабочем потоке; иначе измеряется качество на другой задаче.
  kind: open
  reference: Балансировка меняет частоты классов, поэтому метрики начинают описывать искусственное распределение, а не реальные условия применения. Из-за этого можно неверно оценить практический ущерб от ложных срабатываний и других ошибок.
  id: 026-sampling-2
  fingerprint: bf4e3e16
