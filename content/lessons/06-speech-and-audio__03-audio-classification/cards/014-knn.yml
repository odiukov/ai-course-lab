- concept: координаты запроса и банка должны иметь одинаковый смысл благодаря идентичному конвейеру признаков
  question: Почему в k-NN недостаточно, чтобы вектор запроса и векторы банка имели одинаковую длину, если они построены с разными параметрами или разным порядком статистик?
  explanation: Если запрос содержит статистики в одном порядке, а банк — в другом, скалярное произведение перемножает несопоставимые признаки. Результат остаётся числом и может выглядеть правдоподобно, но уже не измеряет нужное сходство аудиоклипов.
  kind: open
  reference: Одинаковая длина не гарантирует соответствия координат. Косинусная близость сопоставляет координаты по их позициям, поэтому каждая позиция должна обозначать один и тот же MFCC-коэффициент и одну и ту же статистику во всех векторах.
  id: 014-knn-2
