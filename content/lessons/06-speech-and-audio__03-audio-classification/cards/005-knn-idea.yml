- concept: порядок классификации аудиоклипа методом k-NN по MFCC-признакам
  question: Расположите действия k-NN-классификатора аудио в правильном порядке.
  explanation: k-NN сначала представляет новый клип в том же пространстве признаков, что и банк, затем измеряет близость, выбирает ближайшие примеры и определяет класс голосованием их меток.
  kind: order
  items:
    - Вычислить MFCC нового клипа и развернуть их в вектор
    - Посчитать косинусную близость нового вектора к размеченным векторам банка
    - Выбрать ближайших соседей
    - Вернуть метку, получившую большинство голосов среди соседей
  id: 005-knn-idea-1
  fingerprint: 7f6f7391
- concept: голосование нескольких соседей снижает чувствительность k-NN к случайному выбросу
  question: Почему при классификации звуков может быть надёжнее голосовать по нескольким ближайшим соседям, а не копировать метку единственного ближайшего клипа?
  explanation: Единственный ближайший пример может оказаться выбросом из-за шума или условий записи. Большинство среди нескольких соседей уменьшает влияние такого примера, хотя слишком большое K может размыть локальные различия между классами.
  kind: choice
  options:
    - Голосование автоматически исправляет ошибочные MFCC во всех клипах
    - Отдельная шумная или нетипичная запись реже определяет весь результат
    - Косинусная близость после голосования превращается в вероятность
    - Число классов в банке становится меньше
  correct: 1
  id: 005-knn-idea-2
  fingerprint: fca5e1ef
- concept: k-NN хранит размеченные примеры и принимает новые данные без переобучения параметров
  question: Почему добавление размеченного аудиоклипа в банк k-NN не требует переобучения модели?
  explanation: 'k-NN относится к методам, основанным на памяти: этап подгонки параметров отсутствует. Цена такой простоты переносится на инференс — для нового клипа приходится сравнивать его со множеством сохранённых примеров.'
  kind: open
  reference: 'У k-NN нет обучаемых весов: классификатор хранит векторы признаков и их метки. Новый пример достаточно преобразовать в MFCC-вектор и добавить в банк, после чего он сразу может участвовать в поиске соседей.'
  id: 005-knn-idea-3
  fingerprint: 08f9be3b
