- concept: конкатенация средних и дисперсий даёт фиксированный вектор удвоенной размерности MFCC-кадра
  question: Каждый кадр аудио представлен 7 коэффициентами MFCC. Для каждого коэффициента вычисляют среднее и дисперсию по всем кадрам, а результаты объединяют. Какова размерность итогового вектора?
  explanation: 'Для каждого из 7 коэффициентов сохраняются две статистики: среднее и дисперсия. Поэтому итоговый вектор содержит 7 + 7 = 14 значений и не зависит от числа кадров.'
  kind: numeric
  answer: 14
  tolerance: 0.001
