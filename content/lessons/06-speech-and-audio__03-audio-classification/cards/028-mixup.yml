- concept: целочисленные идентификаторы классов нельзя интерполировать как числовые величины
  question: В датасете классы хранятся целыми идентификаторами. Почему нельзя применять mixup непосредственно к этим идентификаторам?
  explanation: 'Номера классов задают категории, а не положение на числовой шкале. Среднее номеров «сирены» и «дрели» может случайно совпасть с номером третьего, не связанного с ними класса. One-hot-векторы можно смешивать осмысленно: результат задаёт доли исходных классов.'
  kind: choice
  options:
    - Идентификаторы являются условными названиями классов, поэтому их среднее не имеет предметного смысла; смешивать нужно векторы распределений по классам
    - Целые идентификаторы нельзя хранить в одном тензоре со спектрограммами
    - Интерполяция идентификаторов всегда приводит к отрицательному значению
    - Mixup применим только к задачам без целевых меток
  correct: 0
  id: 028-mixup-1
  fingerprint: eaed7936
- concept: параметр симметричного бета-распределения управляет силой смешивания примеров
  question: Коэффициент mixup выбирают из симметричного бета-распределения. Как качественно изменятся синтетические примеры при увеличении alpha от малого положительного значения до большого?
  explanation: 'При alpha меньше единицы симметричное бета-распределение тяготеет к краям: смесь похожа преимущественно на один исходный клип. При большом alpha коэффициенты чаще оказываются около середины, поэтому смешивание становится сильнее. В уроке alpha около 0.2 даёт мягкие смеси, а alpha = 1 — равномерное распределение.'
  kind: choice
  options:
    - Коэффициенты сосредоточатся ближе к краям интервала, поэтому почти всегда будет доминировать один пример
    - Коэффициенты сосредоточатся ближе к середине интервала, поэтому оба примера чаще будут иметь заметный вклад
    - Распределение станет асимметричным и начнёт предпочитать первый пример
    - Коэффициент перестанет быть случайным и станет зависеть от номера класса
  correct: 1
  id: 028-mixup-2
  fingerprint: e373241d
