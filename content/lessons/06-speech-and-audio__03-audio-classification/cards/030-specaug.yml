- concept: SpecAugment не должен изменять исходную спектрограмму
  question: Заполни строку так, чтобы последующее маскирование не повредило спектрограмму, хранящуюся в обучающем наборе.
  explanation: Маски записываются в отдельную копию. Если изменять исходный массив, повторные обращения к обучающему примеру будут накапливать маски и постепенно портить данные.
  kind: cloze
  template: augmented = ___
  answer: spec.copy()
  accept:
    - np.copy(spec)
    - np.array(spec, copy=True)
  id: 030-specaug-1
  fingerprint: b5e90b04
- concept: SpecAugment сохраняет размерность входной спектрограммы
  question: Как замаскировать участок спектрограммы, сохранив её форму для пакетной обработки моделью?
  explanation: SpecAugment заменяет значения внутри выбранных полос, но не удаляет элементы. Поэтому выход сохраняет форму `(T, n_mels)` и совместим с тем же входным интерфейсом модели.
  kind: choice
  options:
    - Удалить выбранные строки и столбцы
    - Заменить значения выбранных срезов нейтральным значением
    - Обрезать спектрограмму до ближайшего незамаскированного участка
    - Сжать каждую замаскированную полосу в один элемент
  correct: 1
  id: 030-specaug-2
  fingerprint: 00df409e
- concept: случайное положение масок создаёт разнообразные варианты одного обучающего примера
  question: Почему при каждом применении SpecAugment к одной спектрограмме полезно заново выбирать ширину и положение масок?
  explanation: Если маска всегда находится в одном месте, аугментация создаёт один фиксированный вариант примера. Повторное случайное маскирование расширяет разнообразие обучающих входов и снижает зависимость модели от отдельных участков спектрограммы.
  kind: open
  reference: Разные маски скрывают разные части признаков, поэтому модель не может постоянно опираться на один и тот же локальный фрагмент спектрограммы и учится использовать более устойчивые признаки звука.
  id: 030-specaug-3
  fingerprint: 484c0a30
