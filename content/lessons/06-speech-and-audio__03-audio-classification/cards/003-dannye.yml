- concept: domain shift возникает при различии условий обучающих и рабочих аудиозаписей
  question: Модель обучали на чистых студийных записях, а применять будут на улице среди ветра, эха и разговоров. Объясни проблему и предложи способ уменьшить её.
  explanation: Если модель встречала дрель только в тихой комнате, хорошая проверка на таких же записях не гарантирует работу на улице. Обучение и валидация должны учитывать условия реального применения.
  kind: open
  reference: 'Это domain shift: распределение рабочих записей отличается от обучающего. Нужно добавить репрезентативные уличные записи либо имитировать рабочие условия аугментациями шума и эха, а затем оценить модель на данных из целевого домена.'
