- concept: неоднозначные или противоречивые целевые метки создают шум разметки
  question: Как называется проблема, при которой похожий клип разные аннотаторы относят к разным классам?
  explanation: Граница между классами вроде «гул толпы» и «шум ресторана» может быть субъективной. Противоречивые метки дают модели несовместимые обучающие сигналы, и смена архитектуры сама по себе этого не исправляет.
