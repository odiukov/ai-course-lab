- concept: слишком большое K включает менее похожие примеры и усиливает влияние частого класса
  question: При увеличении K классификатор всё чаще заменяет редкий класс доминирующим, хотя ближайшие к запросу примеры релевантны. Какое объяснение наиболее вероятно?
  explanation: 'Большое K расширяет локальное соседство: в него попадают более далёкие примеры. Если банк несбалансирован, многочисленный класс может победить количеством голосов, а не близостью к запросу.'
  kind: choice
  options:
    - Расширенное соседство захватывает менее похожие примеры, среди которых преобладает частый класс
    - Косинусная близость автоматически становится отрицательной при большом K
    - Counter начинает взвешивать голоса обратно пропорционально частоте класса
    - Сортировка перестаёт располагать соседей по убыванию близости
