- concept: нечётное K уменьшает риск ничьей, но не исключает её в многоклассовой задаче
  question: Объясни, почему нечётное K исключает ничью в бинарном голосовании, но не гарантирует однозначного победителя при нескольких классах.
  explanation: Нечётность решает проблему равного разделения всех голосов между двумя вариантами. Когда классов больше, равенство возможно только среди лидеров, потому что часть голосов может уйти остальным меткам.
  kind: open
  reference: В бинарной задаче все голоса делятся между двумя классами, поэтому при нечётном общем числе голосов их количества не могут совпасть. В многоклассовой задаче две метки могут разделить максимальное число голосов, а остальные голоса могут достаться другим классам.
  id: 013-golosovanie-3
  fingerprint: ceb6dbf4
