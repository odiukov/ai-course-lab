- concept: дешёвые базовые модели дают опорные результаты для диагностики более сложных аудиоклассификаторов
  question: Расположите эксперименты в практическом порядке, позволяющем оценивать пользу каждого усложнения модели.
  explanation: Последовательные базовые результаты превращают лестницу моделей в диагностический инструмент. Если BEATs уступает уже проверенной CNN, следует сначала проверить дообучение и пайплайн оценки, а не считать результат пределом данных.
  kind: order
  items:
    - Получить дешёвую опорную оценку с k-NN на MFCC
    - Обучить CNN на log-mel-спектрограммах
    - Проверить AST на том же разбиении и метрике
    - Дообучить предобученную BEATs и сравнить со всеми базовыми результатами
  id: 004-lestnica-1
  fingerprint: 2be389b6
- concept: замороженный предобученный энкодер позволяет обучать только небольшой классификационный слой
  question: Какой вариант обычно требует обучать меньше всего параметров, сохраняя пользу крупной предобученной аудиомодели?
  explanation: При замороженном энкодере градиенты обновляют только классификационную матрицу. Поэтому такой подход может быть дешевле CNN, хотя использует представления большой предобученной модели.
  kind: choice
  options:
    - Обучить CNN на log-mel с нуля
    - Обучить AST с нуля
    - Заморозить энкодер Whisper и обучить линейный классификатор
    - Полностью дообучить все слои BEATs
  correct: 2
  id: 004-lestnica-2
  fingerprint: 1c3abbb3
- concept: малый прирост от более сложной архитектуры указывает, что её замена может не быть главным рычагом улучшения
  question: Корректно настроенный AST лишь незначительно превосходит CNN на одинаковом разбиении данных и по одной метрике. Какой вывод наиболее обоснован?
  explanation: Небольшая прибавка при заметном усложнении модели показывает, что дальнейшая смена архитектуры может дать мало. Полезнее проверить качество и объём данных, аугментации и процедуру обучения.
  kind: choice
  options:
    - Трансформеры принципиально не подходят для аудио
    - Главное ограничение задачи, вероятно, находится не в архитектуре
    - Нужно отказаться от log-mel и подавать только MFCC
    - Результат CNN нельзя использовать как базовый
  correct: 1
  id: 004-lestnica-3
  fingerprint: c9597ead
