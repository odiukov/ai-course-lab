- concept: разделение весов позволяет свёртке искать локальный спектро-временной шаблон во всей спектрограмме
  question: Почему один и тот же небольшой Conv2d-фильтр способен обнаруживать одинаковый короткий спектро-временной узор в разных местах аудиоклипа?
  explanation: Ядро 3×3 последовательно применяется ко всем локальным участкам log-mel-матрицы. Общие веса позволяют распознавать один тип линии, скачка или пятна в разных временных позициях без отдельного набора параметров для каждой позиции.
  kind: open
  reference: Свёртка перемещает фильтр по временной и частотной осям, применяя в каждой позиции одни и те же веса. Поэтому фильтр может реагировать на выученный локальный узор независимо от того, в какой момент клипа он появился.
  id: 016-cnn-kartinka-2
  fingerprint: 47503ac4
