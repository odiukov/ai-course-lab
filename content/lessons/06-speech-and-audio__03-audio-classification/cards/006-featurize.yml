- concept: порядок преобразований при вычислении MFCC
  question: Расположите преобразования аудиосигнала в порядке вычисления MFCC.
  explanation: 'MFCC получают последовательным преобразованием сигнала: модуль STFT образует спектрограмму, mel-фильтры объединяют частоты в perceptual-полосы, логарифм сжимает динамический диапазон, а DCT формирует компактные коэффициенты.'
  kind: order
  items:
    - Вычислить модуль STFT для последовательности окон
    - Спроецировать спектральные значения на mel-фильтры
    - Применить логарифмическое преобразование
    - Применить DCT-II к каждому кадру
  id: 006-featurize-1
  fingerprint: 83fd5c45
- concept: параметр n_mfcc задаёт размер вектора признаков каждого кадра
  question: Функцию извлечения признаков вызвали с параметром n_mfcc=21. Как будет устроен её результат?
  explanation: DCT вычисляется отдельно для каждого временного кадра, а n_mfcc определяет, сколько его коэффициентов оставить. Число самих кадров зависит прежде всего от длины сигнала и шага окон.
  kind: choice
  options:
    - Каждый временной кадр будет представлен вектором из 21 MFCC-коэффициента
    - Число коэффициентов в кадре будет равно числу mel-полос независимо от n_mfcc
    - Для любого клипа функция вернёт ровно 21 временной кадр
  correct: 0
  id: 006-featurize-2
  fingerprint: 652aff42
- concept: DCT с усечением делает чрезмерное число mel-полос избыточным для компактных MFCC
  question: Почему при извлечении небольшого числа MFCC-коэффициентов чрезмерное увеличение n_mels может давать лишние вычисления?
  explanation: В рассмотренном конвейере mel-спектр содержит 40 полос, после чего DCT сжимает каждый кадр до 13 коэффициентов. Поэтому для MFCC используется меньше mel-бинов, чем может использоваться в обычной mel-спектрограмме.
  kind: open
  reference: Увеличение n_mels создаёт более подробное представление mel-спектра, но затем DCT оставляет только небольшое число коэффициентов. Значительная часть рассчитанной детализации поэтому отбрасывается, хотя на построение и обработку дополнительных полос уже потрачены ресурсы.
  id: 006-featurize-3
  fingerprint: 408a3ca1
