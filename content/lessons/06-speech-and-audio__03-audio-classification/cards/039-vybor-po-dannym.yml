- concept: ограничения реального времени и edge-развёртывания корректируют выбор стека по объёму данных
  question: Для классификатора событий собрано 24 000 клипов, но модель должна работать без сети на маломощном микроконтроллере с минимальной задержкой. Почему рекомендации только по объёму данных недостаточно и какой стек стоит выбрать?
  explanation: Количество клипов задаёт исходную категорию решения, однако вычислительные ограничения могут её скорректировать. Для малой задержки и ограниченной памяти подходит компактная квантованная CNN на MFCC, а не тяжёлый трансформер.
  kind: open
  reference: По объёму данных задача допускает дообучение BEATs или AST, но требования edge и реального времени важнее этого исходного выбора. Следует начать с компактной CNN на MFCC-признаках и квантовать её в int8.
  id: 039-vybor-po-dannym-2
