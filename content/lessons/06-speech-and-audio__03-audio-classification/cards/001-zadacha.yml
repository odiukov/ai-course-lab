- concept: классификатор с softmax без класса отказа всегда выбирает метку из закрытого списка
  question: Классификатор обучен распознавать дождь, клавиатуру и аплодисменты. На вход подали запись флейты, а отдельной метки «неизвестный звук» нет. Что произойдёт?
  explanation: Softmax распределяет вероятность только между заданными классами. Если механизма отказа нет, даже неизвестный звук будет отнесён к одной из известных категорий.
  kind: choice
  options:
    - Модель выберет одну из известных меток с наибольшей оценкой
    - Модель автоматически создаст новую метку «флейта»
    - Модель обязательно вернёт равные оценки всем известным меткам
    - Модель не выдаст никакого ответа
  correct: 0
  id: 001-zadacha-1
  fingerprint: f64b6ed9
- concept: одноэтикеточная классификация целого клипа не описывает одновременные события и их временные границы
  question: Система должна сообщать, что в записи слышны и лай, и хлопок двери, а также указывать момент начала каждого события. Почему обычная одноэтикеточная классификация клипа для этого не подходит?
  explanation: Одна метка на клип отвечает лишь на вопрос о категории записи в целом. Для нескольких присутствующих звуков нужна многометочная классификация, а для их временных границ — обнаружение событий во времени.
  kind: choice
  options:
    - Её выход содержит одну метку для всей записи и не кодирует время событий
    - Softmax нельзя применять к звуковым данным
    - Классификатор работает только с записями, где нет фонового шума
    - Аудиоклассификация способна распознавать только человеческую речь
  correct: 0
  id: 001-zadacha-2
