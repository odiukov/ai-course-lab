- concept: среднее и дисперсия MFCC не сохраняют порядок событий во времени
  question: Два клипа содержат одинаковый набор MFCC-кадров, но кадры расположены в разном временном порядке. Чем будут отличаться векторы из покоэффициентных средних и дисперсий?
  explanation: Среднее и дисперсия зависят от значений кадров, но не от их последовательности. Поэтому компактное статистическое представление удобно для k-NN, однако не различает клипы, отличающиеся только порядком событий.
  kind: open
  reference: 'Векторы будут одинаковыми, если не учитывать погрешность вычислений: перестановка кадров не меняет среднее и дисперсию. Такое представление фиксированной длины теряет информацию о временном порядке звуков.'
  id: 010-summarize-2
  fingerprint: 0aaaec19
