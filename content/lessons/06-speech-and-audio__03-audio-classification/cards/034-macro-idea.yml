- concept: precision класса — доля истинных срабатываний среди всех предсказаний этого класса
  question: Аудиоклассификатор верно распознал сигнал тревоги в 24 клипах и ещё в 6 клипах ошибочно предсказал этот класс. Чему равен precision для сигнала тревоги?
  explanation: 'Precision учитывает все предсказания класса: 24 / (24 + 6) = 0,8. Пропущенные сигналы на precision не влияют — они учитываются в recall.'
  kind: numeric
  answer: 0.8
  tolerance: 0.01
  id: 034-macro-idea-1
  fingerprint: 6bc75856
- concept: macro-F1 придаёт каждому классу одинаковый вес независимо от числа его примеров
  question: В тестовой выборке классы сильно несбалансированы, а качество распознавания каждого класса одинаково важно. Какую итоговую метрику следует выбрать?
  explanation: Macro-F1 сначала вычисляет F1 отдельно для каждого класса, а затем усредняет результаты. Поэтому редкий класс получает такой же вес, как частый. Micro-F1 объединяет решения по всем объектам, и его сильнее определяют многочисленные классы.
  kind: choice
  options:
    - Micro-F1 по всем объектам
    - Macro-F1 по классам
    - Общую top-1 accuracy
    - Число верных предсказаний самого частого класса
  correct: 1
  id: 034-macro-idea-2
  fingerprint: 2760ed27
- concept: F1 как гармоническое среднее требует одновременно высоких precision и recall
  question: Объясни своими словами, почему классификатор не получит высокий F1, если у него высокий recall, но низкий precision.
  explanation: Recall можно повысить, чаще предсказывая нужный класс, но это способно увеличить число ложных тревог и снизить precision. Гармоническое среднее остаётся низким, если одна из составляющих мала.
  kind: open
  reference: F1 — гармоническое среднее precision и recall. Оно заметно ограничивается меньшей из двух метрик, поэтому большое число ложных срабатываний и вызванный ими низкий precision не компенсируются высоким recall.
  id: 034-macro-idea-3
  fingerprint: ce1e0600
