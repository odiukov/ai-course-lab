- concept: глобальное адаптивное усреднение создаёт вектор фиксированной длины с одним значением на канал
  question: Объясни, почему глобальное адаптивное усреднение позволяет передать в один и тот же полносвязный слой спектрограммы с разным числом временных кадров.
  explanation: AdaptiveAvgPool2d(1) превращает каждую карту признаков в одно среднее значение. При 128 каналах получаются ровно 128 чисел для любого клипа, поэтому их можно подать в Linear(128, 50).
  kind: open
  reference: Оно усредняет всю пространственную карту каждого канала до одного скаляра. Поэтому длина результата определяется только числом каналов, а не временным или частотным размером входной спектрограммы.
  id: 017-cnn-razmery-2
  fingerprint: 007c18b3
