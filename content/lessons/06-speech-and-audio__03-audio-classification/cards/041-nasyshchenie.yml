- concept: дополнительные статистики увеличивают стоимость представления и должны оправдываться измеримым улучшением
  question: После добавления skew и kurtosis точность k-NN на отложенной выборке не изменилась. Какой вывод обоснован результатом этого эксперимента?
  explanation: Добавление статистик делает вектор длиннее, поэтому каждый сохранённый пример и каждое вычисление расстояния обходятся дороже. Неизменная точность не доказывает универсальную бесполезность признаков, но не даёт оснований платить за них в проверенных условиях.
  kind: choice
  options:
    - Skew и kurtosis бесполезны для любых аудиоданных
    - 'Более длинное представление пока не оправдано: оно увеличивает хранение и стоимость вычисления расстояний без измеримого выигрыша'
    - Следует немедленно заменить k-NN нейросетью
    - Нужно оценивать качество только на обучающей выборке
  correct: 1
