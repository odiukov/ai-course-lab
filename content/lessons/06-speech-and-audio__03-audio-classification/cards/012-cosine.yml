- concept: косинусная близость нормирует скалярное произведение произведением евклидовых норм
  question: Заполните пропуск в векторизованном вычислении косинусной близости ненулевых векторов.
  explanation: Деление скалярного произведения на произведение длин векторов оставляет только различие их направлений.
  kind: cloze
  template: similarity = np.dot(a, b) / ___
  answer: (np.linalg.norm(a) * np.linalg.norm(b))
  accept:
    - np.linalg.norm(a) * np.linalg.norm(b)
    - np.linalg.norm(b) * np.linalg.norm(a)
