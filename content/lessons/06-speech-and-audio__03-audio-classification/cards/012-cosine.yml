- concept: знак косинусной близости совпадает со знаком скалярного произведения ненулевых векторов
  question: Скалярное произведение двух ненулевых векторов отрицательно. Что можно заключить об их косинусной близости?
  explanation: Нормы ненулевых векторов положительны, поэтому знаменатель не меняет знак числителя. Отрицательная близость означает, что направления векторов скорее противоположны, чем совпадают.
  kind: choice
  options:
    - Она отрицательна
    - Она положительна, потому что нормы положительны
    - Она не определена из-за отрицательного числителя
