- concept: число выходов последнего слоя классификатора равно числу классов
  question: Модель классифицировала аудио по шести категориям. Теперь тот же пайплайн нужно применить для распознавания восьми языков. Какое минимальное изменение архитектуры обязательно?
  explanation: Каждому классу соответствует один выход классификационной головы. Поэтому для восьми языков нужны восемь выходов. Извлечение признаков, основную сеть и цикл обучения можно сохранить.
  kind: choice
  options:
    - Изменить число выходов последнего слоя с шести на восемь
    - Заменить log-mel-признаки необработанной звуковой волной
    - Увеличить длительность каждого входного клипа
    - Заменить все слои нейросети новыми
  correct: 0
  id: 002-odin-kod-1
  fingerprint: 0ac66aad
- concept: общая архитектура не отменяет необходимость отдельных размеченных данных для каждой задачи
  question: Почему размеченный датасет городских шумов нельзя просто использовать для обучения классификатора языков, хотя обе задачи могут иметь одинаковые log-mel-признаки, основную сеть и цикл обучения?
  explanation: Переиспользуется вычислительный шаблон, а не смысл разметки. Сирены, языки и эмоции требуют собственных примеров и меток; качество также зависит от дисбаланса классов, шума разметки и соответствия данных рабочим условиям.
  kind: open
  reference: Метки и различительные признаки относятся к разным целевым задачам. Для языкового классификатора нужны записи речи с языковыми метками; датасет городских шумов не даёт модели такой обучающей связи. Архитектуру можно переиспользовать, но данные необходимо собрать и разметить под новую задачу.
  id: 002-odin-kod-2
  fingerprint: 54daf61f
- concept: стандартный пайплайн классификации аудио преобразует сигнал в признаки, представление, логиты и вероятности классов
  question: Расположите этапы типичного классификатора аудио в правильном порядке.
  explanation: Сначала из сигнала получают log-mel-представление, затем сеть извлекает признаки клипа. Последний слой выдаёт по одному логиту на класс, а softmax преобразует логиты в распределение вероятностей.
  kind: order
  items:
    - Преобразовать аудиосигнал в log-mel-признаки
    - Получить представление клипа с помощью CNN или Transformer
    - Преобразовать представление в логиты классов последним слоем
    - Применить softmax и получить вероятности классов
  id: 002-odin-kod-3
  fingerprint: b29749da
