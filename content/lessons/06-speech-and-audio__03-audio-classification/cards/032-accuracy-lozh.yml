- concept: строки матрицы ошибок обозначают истинные классы, а столбцы — предсказанные
  question: В матрице ошибок строки соответствуют истинным классам, а столбцы — предсказаниям. Запись со звуком хлопка модель распознала как шаги. Какая клетка увеличится?
  explanation: Выбирают строку истинной метки «хлопок» и столбец ответа модели «шаги». Поскольку классы различаются, эта ошибка окажется вне диагонали.
  kind: choice
  options:
    - Строка «хлопок», столбец «шаги»
    - Строка «шаги», столбец «хлопок»
    - Диагональная клетка «хлопок»
  correct: 0
  id: 032-accuracy-lozh-1
  fingerprint: 43808efa
- concept: accuracy равна сумме диагональных элементов матрицы ошибок, делённой на сумму всех её элементов
  question: Матрица ошибок трёхклассового классификатора равна [[17, 2, 1], [4, 23, 3], [2, 6, 19]]. Чему равна accuracy в процентах?
  explanation: На диагонали находятся 17 + 23 + 19 = 59 верных ответов. Всего в матрице 77 объектов, поэтому accuracy равна 59 / 77 ≈ 0.766, или 76.6%.
  kind: numeric
  answer: 76.6
  tolerance: 0.1
  id: 032-accuracy-lozh-2
  fingerprint: 585bf61d
