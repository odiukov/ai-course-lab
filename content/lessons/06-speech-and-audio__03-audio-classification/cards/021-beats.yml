- concept: при self-supervised предобучении целевые значения автоматически получают из самого аудио
  question: Какая схема обучения аудиоэнкодера является self-supervised?
  explanation: 'В masked-предобучении вход одновременно служит источником обучающей цели: скрытый фрагмент уже известен системе, поэтому ручные метки классов не нужны.'
  kind: choice
  options:
    - Человек присваивает каждому клипу класс, а модель предсказывает этот класс
    - В спектрограмме скрывают случайные фрагменты, а модель восстанавливает их по видимому контексту
    - Модель запоминает размеченные клипы и выбирает метку ближайшего примера
    - Эксперт вручную описывает тембр и длительность каждого звука
  correct: 1
  id: 021-beats-1
  fingerprint: 40c2e37a
- concept: self-supervised предобучение снижает потребность в размеченных примерах при переносе на прикладную задачу
  question: Почему предобученному self-supervised аудиоэнкодеру обычно требуется меньше размеченных клипов, чем модели, обучаемой на прикладной задаче с нуля?
  explanation: BEATs получает общее представление звука во время масштабного предобучения без ручной разметки. Поэтому небольшая размеченная выборка может использоваться для адаптации этого представления к нужным классам.
  kind: open
  reference: Энкодер заранее учится на неразмеченном аудио распознавать общие спектральные и временные закономерности. При дообучении размеченные клипы нужны преимущественно для сопоставления уже освоенных представлений с классами новой задачи, а не для изучения структуры звука с нуля.
  id: 021-beats-2
  fingerprint: 629bcd31
