- concept: матрицы ошибок с сырыми счётчиками складываются поэлементно для объединения непересекающихся выборок
  question: Матрицы ошибок вычислены отдельно для двух непересекающихся частей тестовой выборки. Как получить матрицу для всей выборки?
  explanation: Каждая клетка хранит число наблюдений с конкретной парой истинной и предсказанной меток. Для непересекающихся частей такие счётчики складываются; нормированные доли без размеров частей так объединять нельзя.
  kind: choice
  options:
    - Поэлементно сложить матрицы
    - Поэлементно усреднить матрицы
    - Нормировать каждую строку обеих матриц и затем сложить
    - В каждой клетке оставить большее из двух значений
