- concept: рекомендации по дизайну классификатора должны быть условными, а не универсальными
  question: Объясните своими словами, почему совет «используйте определённую архитектуру и стандартную метрику» недостаточен без описания конкретной задачи классификации аудио.
  explanation: Одни и те же технические решения могут по-разному работать на разных наборах данных и при разных целях. Хорошая спецификация не просто называет инструменты, а фиксирует условия, при которых каждый выбор оправдан.
  kind: open
  reference: Подходящий дизайн зависит от свойств данных, целевых меток и эксплуатационных требований. Поэтому рекомендация должна явно связывать характеристики задачи с выбором архитектуры, аугментаций, балансировки и метрики; универсальный стек без таких условий нельзя обоснованно перенести на любую задачу.
