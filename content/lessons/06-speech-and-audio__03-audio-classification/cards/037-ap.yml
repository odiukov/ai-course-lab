- concept: алгоритм вычисления average precision по оценкам и бинарным меткам
  question: Расположи действия функции вычисления average precision в правильном порядке.
  explanation: AP усредняет precision только в позициях положительных примеров. Поэтому после сортировки нужны счётчики просмотренных и найденных положительных элементов, а знаменателем итогового среднего служит число положительных меток.
  kind: order
  items:
    - Посчитать общее число положительных примеров и отдельно обработать случай, когда их нет
    - Объединить оценки с метками и отсортировать пары по убыванию оценки
    - Пройти список, обновляя число просмотренных и положительных элементов, и на каждой положительной метке прибавлять текущий precision
    - Разделить накопленную сумму precision на общее число положительных примеров
  id: 037-ap-1
  fingerprint: c05c1d61
- concept: отрицательные примеры ниже последнего положительного не влияют на average precision
  question: Как изменится average precision, если в конец ранжированного списка добавить отрицательный пример с оценкой ниже всех остальных, а положительные примеры в списке есть?
  explanation: Новый отрицательный пример расположен после всех положительных, поэтому он не меняет ни precision в позициях положительных примеров, ни их общее число. Следовательно, AP остаётся прежней.
  kind: choice
  options:
    - Не изменится
    - Обязательно уменьшится
    - Обязательно увеличится
  correct: 0
