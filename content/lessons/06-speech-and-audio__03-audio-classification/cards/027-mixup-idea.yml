- concept: метки при mixup смешиваются с теми же коэффициентами, что и входы
  question: Клип A внёс 65% смешанного аудио, а клип B — 35%. Какую целевую метку следует использовать при mixup, если исходные метки обозначены как y_A и y_B?
  explanation: В mixup вход и целевую метку интерполируют одинаковыми весами. Поэтому долям клипов 65% и 35% соответствует мягкая цель 65% · y_A + 35% · y_B.
  kind: choice
  options:
    - 65% · y_A + 35% · y_B
    - 35% · y_A + 65% · y_B
    - Только y_A
    - Только y_B
  correct: 0
  id: 027-mixup-idea-1
  fingerprint: e8ce4f36
- concept: mixup снижает запоминание редких записей за счёт изменения партнёра и веса смешивания
  question: Объясни своими словами, почему mixup может уменьшить переобучение, когда сбалансированный сэмплинг многократно возвращает модели одни и те же редкие записи.
  explanation: Сбалансированный сэмплинг повышает частоту показа редкого клипа, но не создаёт новую запись. Mixup изменяет контекст и относительную долю этого клипа, формируя разнообразные обучающие входы и ослабляя привязку модели к случайным особенностям исходного файла.
  kind: open
  reference: Каждая редкая запись смешивается с разными партнёрами и с меняющимися весами, поэтому модель видит множество вариантов входа вместо точных копий файла. Ей становится сложнее запомнить постоянные шумы, эхо или особенности микрофона конкретной записи.
  id: 027-mixup-idea-2
  fingerprint: 86df99aa
