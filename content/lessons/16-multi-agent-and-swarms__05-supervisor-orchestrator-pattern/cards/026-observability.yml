- concept: слой сбоя определяется по тому, на каком уровне трассы утверждение появилось впервые
  question: 'Итоговый ответ supervisor содержит конкретное утверждение о конкуренте. В трассе видно: план покрывает нужный подвопрос, воркер по этому подвопросу отработал без ошибок, но в его отчёте такого утверждения нет. Где локализован сбой?'
  explanation: Трасса разбивает прогон на слои с известными входами и выходами. Утверждение, которого нет ни в одном отчёте, но есть в ответе, могло появиться только на этапе сборки. Если бы подвопроса не было в плане — виноват разбор; если бы воркер вернул неподтверждённое утверждение — виновата его ветвь.
  kind: choice
  options:
    - 'В синтезе: ведущий добавил утверждение, не опирающееся ни на один отчёт'
    - 'В плане: подвопрос был сформулирован слишком узко'
    - 'В ветви воркера: он вызвал инструмент, но не сохранил найденный источник'
    - Определить по трассе нельзя, нужен повторный прогон с теми же входами
  correct: 0
  id: 026-observability-1
  fingerprint: 0277222f
- concept: 'разбор сбоя идёт сверху вниз по слоям трассы: покрытие плана, затем работа ветви, затем сборка'
  question: Расставьте шаги пост-фактум разбора неверного ответа supervisor по трассе в порядке от самого раннего слоя к самому позднему.
  explanation: 'Смысл порядка — не ходить по кругу. Если нужного подвопроса нет в плане, ветви и синтез проверять бессмысленно: исследования просто не было. Если план полный, а отчёт пустой или ошибочный — проблема локализована в ветви, и до синтеза дело не доходит.'
  kind: order
  items:
    - 'Проверить план ведущего: есть ли подвопрос, покрывающий спорную часть ответа'
    - 'Проверить ветвь воркера: какое задание он получил, какие инструменты вызвал, что вернул в отчёте'
    - 'Проверить синтез: какие отчёты получил ведущий и на какие из них опёрся в итоговом ответе'
  id: 026-observability-2
  fingerprint: 0a539ea1
- concept: предметом трассировки служат события и артефакты прогона, а не внутренние рассуждения модели
  question: Что должно попадать в трассу мультиагентного прогона, чтобы её хватило для разбора сбоев?
  explanation: 'Разбор строится на проверяемых фактах: что было поручено, что было вызвано, что вернулось. Внутренние рассуждения объёмны, нестабильны от прогона к прогону и не воспроизводимы, поэтому опорой служить не могут. Повторный запуск тоже не спасает: маршрут выбирается моделью и не повторится точно, а успешные ветви нужны, чтобы понять, какой отчёт был проигнорирован при сборке.'
  kind: choice
  options:
    - 'События и артефакты: план и раздача заданий, вызовы инструментов с их результатами, отчёты воркеров, состав входа синтеза'
    - Полные внутренние рассуждения каждой модели — только они объясняют, почему был сделан выбор
    - 'Только финальный ответ и суммарный расход токенов: остальное восстанавливается повторным запуском'
    - 'Только ошибки и таймауты: успешные ветви записывать незачем'
  correct: 0
  id: 026-observability-3
