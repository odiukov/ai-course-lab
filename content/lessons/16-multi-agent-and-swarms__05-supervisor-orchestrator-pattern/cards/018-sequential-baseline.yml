- concept: время последовательного этапа равно сумме длительностей всех воркеров
  question: 'Четыре воркера запускаются строго по очереди, каждый начинает только после отчёта предыдущего. Их длительности: 4 с, 11 с, 6 с и 5 с. Сколько секунд займёт весь этап работы воркеров?'
  explanation: 'При последовательном запуске ожидания не перекрываются, поэтому длительности складываются: 4 + 11 + 6 + 5 = 26 с. Самая долгая работа (11 с) задаёт нижнюю границу только для параллельного режима.'
  kind: numeric
  answer: 26
  tolerance: 0.1
  id: 018-sequential-baseline-1
  fingerprint: 9448a3f8
- concept: момент завершения воркера в очереди равен префиксной сумме длительностей, а не его собственной длительности
  question: Воркеры выполняются по очереди в порядке 6 с, 15 с, 4 с. На какой секунде от старта этапа появится отчёт второго воркера?
  explanation: 'Второй воркер работал 15 секунд, но начал только после первого: 6 + 15 = 21 с. Собственная длительность и момент готовности результата совпадают лишь у первого в очереди.'
  kind: numeric
  answer: 21
  tolerance: 0.1
