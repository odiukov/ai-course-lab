- concept: общие допущения и критерии сравнения фиксируются в проекте до запуска, иначе формально корректные отчёты несопоставимы
  question: 'Исполнители сравнивали города для переезда: один считал бюджет семьи с ребёнком, другой — одинокого специалиста, следующий взял иной горизонт лет. Каждый отчёт корректен, но свести их в один ответ нельзя. Что было упущено при проектировании?'
  explanation: 'Непересекающиеся и корректные подзадачи ещё не дают сводимости: сравнимость появляется, только если профиль, горизонт и метрики заданы централизованно в поручениях. Иначе сборка получает несколько несовместимых систем координат.'
  kind: choice
  options:
    - Единые допущения и критерии сравнения, общие для всех ролей
    - Ограничение на число источников, которые вправе прочитать исполнитель
    - Более дорогая модель у исполнителей вместо дешёвой
    - Параллельный запуск вместо последовательного
  correct: 0
  id: 035-design-spec-1
  fingerprint: 852dd5f5
- concept: ошибка разбиения проявляется только на сборке ответа, поэтому роли, правила разбиения и шаблон итога проектируют до траты токенов
  question: Почему роли исполнителей, правила разбиения и шаблон итогового ответа дешевле спроектировать до запуска исследования, а не по ходу дела?
  explanation: Проверка «шаблон против планируемых отчётов» ловит недостающую или лишнюю роль на бумаге. Сам код и запуск дешевле, чем решение о том, как резать задачу.
  kind: open
  reference: 'Плохое разбиение не даёт о себе знать во время работы: каждый отчёт выглядит нормальным сам по себе. Дефект вскрывается на сборке, когда все ветви уже отработали и токены с временем потрачены, а исправление означает повторный прогон. Заранее написанный шаблон итога работает как тест: если его нельзя заполнить результатами запланированных ролей, значит роли или правила разбиения нужно править прямо сейчас, до первого запуска.'
  id: 035-design-spec-2
  fingerprint: ba00e5f3
