- concept: специализация воркера возникает из содержания поручения, а не из отдельной обученной модели
  question: Ведущий запускает четырёх воркеров на одной и той же модели, но каждому даёт своё поручение, и они ведут себя как разные специалисты. Откуда берётся эта специализация?
  explanation: 'Модель одна и та же. Специалистом воркера делает узко очерченное задание: что искать, что игнорировать, чем отчитаться. Дообучение отдельной модели под каждую ветвь исследования не требуется.'
  kind: choice
  options:
    - Каждая копия модели дообучена под свою предметную область
    - Узкая цель, границы поиска и требуемая форма результата задаются поручением на время задачи
    - Каждому воркеру выдают отдельный, недоступный остальным набор инструментов
    - Специализация появляется только после нескольких итераций уточнений от ведущего
  correct: 1
  id: 007-prompt-specialization-1
  fingerprint: 10cfc8aa
- concept: широкая формулировка задания лишает воркера критерия отбора и остановки
  question: Воркеру дали поручение «изучи объект и расскажи всё важное». Объясни своими словами, почему такое задание обычно дороже по токенам и хуже пригодно для решения, чем «проверь только X и верни выводы с источниками».
  explanation: 'Ширина поручения — это ширина поиска. Узкая формулировка экономит токены не после исследования, а во время него: воркер просто не заходит в ветви, которые не относятся к его вопросу.'
  kind: open
  reference: 'При широком поручении у воркера нет критерия релевантности: любая находка формально подходит, поэтому он уходит в побочные ветви, тратит вызовы инструментов и токены на любопытный, но бесполезный материал. Нет и критерия остановки — непонятно, когда работа закончена. Итоговый отчёт получается длинным и разнородным, а нужный аспект в нём раскрыт поверхностно, из-за чего по нему трудно принять решение. Узкое поручение задаёт и фильтр, и точку остановки: воркер отсекает лишнее на входе и углубляется там, где это влияет на решение.'
  id: 007-prompt-specialization-2
  fingerprint: cfc270e5
- concept: один объект можно разложить на подзадачи по аспектам, а не только по разным объектам
  question: Ведущему нужно всесторонне оценить один объект. Как корректнее разложить работу между воркерами?
  explanation: Декомпозиция идёт по вопросам, а не обязательно по объектам. Одинаковые широкие поручения дают перекрывающиеся поверхностные отчёты; разные узкие вопросы к одному объекту дают непересекающиеся глубокие срезы.
  kind: choice
  options:
    - Дать всем один и тот же объект и одинаковое поручение «оцени объект», а потом выбрать лучший отчёт
    - 'Дать каждому воркеру тот же объект, но свой аспект: один проверяет безопасность, другой доступность, третий акустику'
    - Разделить объект на части текста и раздать по кускам, не указывая, что искать
    - Отдать объект одному воркеру, а остальных запустить на резервных источниках с тем же широким вопросом
  correct: 1
  id: 007-prompt-specialization-3
  fingerprint: c8929501
