- concept: запуск всех исполнителей предшествует любому ожиданию; чередование «запустить — дождаться» по одному возвращает последовательное выполнение
  question: Расставь действия ведущего при параллельном раздаче заданий в правильном порядке.
  explanation: Параллелизм живёт в промежутке между «запустили всех» и «начали ждать». Если после старта одного потока сразу ждать его завершения и лишь потом стартовать следующий, потоки есть, а выполнение снова последовательное.
  kind: order
  items:
    - Создать отдельный поток на каждую пару «воркер — подвопрос»
    - Запустить все потоки подряд, не дожидаясь промежуточных результатов
    - Дождаться завершения каждого запущенного потока
    - Синтезировать общий ответ из собранных отчётов
  id: 016-threaded-fanout-1
  fingerprint: 068c35a7
- concept: 'синтез требует полного набора отчётов: он начинается только после завершения всех ветвей'
  question: Ведущий раздал задания четырём воркерам, дождался двух самых быстрых отчётов и начал синтез, не дожидаясь остальных. Чем это плохо?
  explanation: Каждое направление плана отвечает за свою часть ответа. Пропущенный отчёт — это молча выпавшая часть итога, а не просто менее подробный текст. Точка ожидания существует ровно для того, чтобы такого не случилось.
  kind: choice
  options:
    - В ответе останется дыра по двум неохваченным направлениям, и пользователь о ней не узнает
    - Быстрые воркеры вернут более точные факты, поэтому потери нет
    - Оставшиеся два потока аварийно завершатся
    - Время по часам вырастет, потому что синтез придётся повторить
  correct: 0
  id: 016-threaded-fanout-2
  fingerprint: 6d2e5e97
- concept: признак параллельного запуска в трейсе — перекрытие интервалов работы, а не порядок завершений
  question: 'В трейсе видно: воркеры стартовали на отметках 0.00, 0.01 и 0.02 с, а завершились на 0.33, 0.41 и 0.52 с. Что можно сказать о запуске?'
  explanation: Кучно расположенные старты означают, что ведущий отправил все задания до первого ожидания. Разброс завершений отражает разную длительность работ — это норма, а не признак очереди.
  kind: choice
  options:
    - 'Запуск параллельный: интервалы работы перекрываются, никто не ждал чужого отчёта, чтобы начать'
    - 'Запуск последовательный: завершения идут по возрастанию'
    - 'Определить нельзя: нужны длительности каждой работы отдельно'
    - Параллельность есть, только если совпадают и старты, и завершения
  correct: 0
  id: 016-threaded-fanout-3
