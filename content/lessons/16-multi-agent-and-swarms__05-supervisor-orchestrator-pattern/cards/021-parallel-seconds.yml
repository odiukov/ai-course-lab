- concept: агрегатор максимума требует явной проверки пустого набора до выбора наибольшего элемента
  question: Расставь шаги функции, которая по списку длительностей воркеров возвращает время параллельного этапа и не падает на пустом входе.
  explanation: 'Встроенный max на пустой коллекции бросает ValueError, поэтому проверка идёт до выбора. Ноль здесь — не заглушка, а корректный ответ: команда, в которой никто не работал, не заняла времени.'
  kind: order
  items:
    - Принять список длительностей воркеров
    - Проверить, что список не пуст, и для пустого вернуть нейтральное значение — ноль секунд
    - Выбрать наибольшую длительность в списке
    - Вернуть её как время параллельного этапа в секундах
  id: 021-parallel-seconds-1
  fingerprint: c173e390
- concept: для неотрицательных длительностей параллельное время не превышает последовательное; равенство достижимо только при одной непустой ветви
  question: 'Для длительностей 1,7, 0,9 и 2,4 секунды считают две величины: параллельное время и последовательное. В каком случае эти две функции вернут одно и то же число на одном и том же входе?'
  explanation: 'Здесь параллельное время равно 2,4 с, последовательное — 5,0 с. Максимум неотрицательного набора не больше его суммы, а совпадают они, только когда всё, кроме одного элемента, равно нулю. Равные длительности как раз дают максимальный разрыв: сумма втрое больше максимума при трёх ветвях. Это удобный инвариант для теста: результат параллельной функции никогда не должен превышать результат последовательной.'
  kind: choice
  options:
    - Когда в списке ровно одна ненулевая длительность — остальные ветви либо отсутствуют, либо нулевые
    - Когда все длительности равны между собой
    - 'Никогда: параллельное время всегда строго меньше'
  correct: 0
  id: 021-parallel-seconds-2
  fingerprint: d9ac3720
- concept: функция, считающая наблюдаемую метрику, не подмешивает неизмеренные константы; поправки живут отдельно
  question: В функцию, возвращающую время параллельного этапа по списку длительностей, предлагают добавить фиксированную поправку на запуск потоков. Почему это плохая идея?
  explanation: Один вход — одна наблюдаемая величина на выходе. Реальные накладные расходы измеряются отдельно как разница между временем этапа по часам и максимумом длительностей; зашитая константа эту разницу маскирует и врёт при смене железа или числа воркеров.
  kind: choice
  options:
    - 'Функция перестанет быть чистым агрегатом входных данных: константа не измерена, зависит от машины и числа ветвей, а результат уже нельзя сверить с трейсом'
    - Накладные расходы на запуск потоков всегда пренебрежимо малы, поэтому поправка не нужна
    - 'Поправка нарушит типы: время запуска измеряется не в секундах'
  correct: 0
