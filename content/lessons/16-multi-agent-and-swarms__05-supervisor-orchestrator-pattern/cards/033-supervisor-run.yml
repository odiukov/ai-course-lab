- concept: сравнение режимов исполнения возможно только у узла, который видит длительности всех ветвей
  question: Почему подсчёт времени всего исследовательского этапа делает ведущий, а не сами исполнители?
  explanation: 'Изолированность исполнителей — свойство паттерна: они не обмениваются контекстом. Из этого прямо следует, что любая агрегированная метрика вычисляется на уровне координатора.'
  kind: open
  reference: Исполнитель знает только собственную длительность и не видит соседние ветви. Сумма длительностей и максимум по ветвям определены лишь для полного набора, а полный набор есть только у узла, который эти ветви запускал и собирал. Поэтому метрики прогона живут там же, где план и сборка ответа.
