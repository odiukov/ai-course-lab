- concept: при фиксированном общем объёме работы разброс длительностей ветвей снижает ускорение
  question: Общий объём работы — 2,40 секунды. Планировщик разложил его на ветви 1,60, 0,50 и 0,30 секунды. Во сколько раз параллельный запуск быстрее последовательного (накладными расходами пренебречь)?
  explanation: 'Параллельно этап длится 1,60 с, последовательно — 2,40 с, ускорение 2,40 / 1,60 = 1,5. Разложи ту же работу на три равные ветви по 0,80 с — и ускорение станет трёхкратным. Отсюда практический вывод: выравнивать подвопросы по ожидаемой трудоёмкости так же полезно, как добавлять воркеров.'
  kind: numeric
  answer: 1.5
  tolerance: 0.05
  id: 022-timing-check-1
  fingerprint: eea32c38
- concept: параллельный запуск выгоден, только когда накладные расходы координации меньше разницы между суммой и максимумом
  question: Две ветви по 0,20 и 0,22 секунды. Запуск воркеров, ожидание и сбор отчётов стоят около 0,30 секунды. Что даст параллельный запуск?
  explanation: 'Выигрыш параллелизма равен сумме минус максимум, здесь это 0,42 − 0,22 = 0,20 с. Координация стоит 0,30 с, то есть больше выигрыша, и итог 0,22 + 0,30 = 0,52 с. Правило: параллелить имеет смысл, пока накладные расходы меньше сэкономленного, а с ростом числа ветвей они растут.'
  kind: choice
  options:
    - 'Будет медленнее: около 0,52 секунды против 0,42 при последовательном выполнении'
    - 'Будет быстрее: 0,22 секунды против 0,42'
    - Даст ровно то же время, накладные расходы взаимно компенсируются
