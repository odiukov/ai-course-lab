- concept: старое поколение снимают по опустошению активной работы, а не по расписанию перехода
  question: По какому признаку старое поколение агентной системы можно окончательно выключить при rainbow rollout?
  explanation: 'Новые задачи перестают поступать на старую версию сразу, но у долгоживущих агентов есть состояние и незавершённая работа. Признак готовности — опустошение (drain): активных прогонов ноль. Полный перевод трафика новых задач и завершение старых — разные моменты, и выключение по таймеру уничтожает состояние тех, кто ещё не доиграл.'
  kind: choice
  options:
    - Когда на нём не осталось активных задач — все начатые прогоны завершились или были прерваны
    - Когда прошёл заранее назначенный срок перехода, независимо от состояния прогонов
    - Когда доля трафика на новой версии достигла ста процентов
    - Когда новая версия отработала без ошибок хотя бы один полный прогон
