- concept: граница области ограничивает исследование, но не отменяет обязанность сообщить факт, без которого ответ был бы неверным
  question: 'Воркеру задана жёсткая граница: только публичные тарифы, ничего кроме. Он выясняет, что цена вообще не публикуется и выдаётся лишь после разговора с менеджером. Как правильно поступить?'
  explanation: Хорошая граница отсекает любопытные ответвления, но пропускает наверх сведения, меняющие смысл ответа. Молчание здесь превратилось бы в ложное «цены нет», а ведущий не узнал бы, что вопрос остался открытым.
  kind: choice
  options:
    - 'Сообщить это в отчёте: без такого факта подвопрос нельзя честно закрыть'
    - 'Промолчать: граница запрещает выходить за публичные тарифы'
