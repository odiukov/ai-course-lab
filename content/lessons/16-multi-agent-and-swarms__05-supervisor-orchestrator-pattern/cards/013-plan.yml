- concept: каждый подвопрос обязан сам называть предмет исследования, потому что исполнитель не видит исходной формулировки запроса
  question: Ведущий отправил воркеру задание «Найди ограничения и риски», не упомянув, о чём речь. Почему это провальное поручение?
  explanation: Поручение — единственный вход воркера. Предмет исследования должен быть внутри самой формулировки; иначе исполнитель либо остановится, либо угадает тему, и отчёт окажется не о том.
  kind: choice
  options:
    - Воркер получает задание в отрыве от исходного запроса и не может определить, риски чего искать
    - Формулировка слишком короткая, а короткие промпты запрещены
    - Такое задание невозможно выполнить параллельно с другими
    - Воркер вернёт ответ, но ведущий не сможет его прочитать
  correct: 0
