- concept: plan() возвращает набор отдельных заданий, потому что раздача по исполнителям идёт поэлементно
  question: Функция планирования вернула одну строку, где направления исследования перечислены через запятую, вместо набора отдельных заданий. Почему это ломает запуск воркеров?
  explanation: Число элементов плана задаёт число параллельных ветвей. Слипшийся в одну строку план либо целиком уйдёт одному воркеру, либо потребует разбора текста на стороне вызывающего кода — то есть планирование фактически не выполнено.
  kind: choice
  options:
    - 'Нечего раздавать по исполнителям: код назначает каждому воркеру отдельный элемент набора, а не кусок текста'
    - Строка не помещается в контекст воркера
    - Строки нельзя передавать между потоками
    - Ведущий не сможет посчитать время работы этапа
  correct: 0
