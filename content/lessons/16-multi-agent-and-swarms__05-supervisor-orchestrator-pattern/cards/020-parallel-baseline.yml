- concept: быстрые ветви простаивают до финиша самой медленной; суммарный простой равен n·max − сумма длительностей
  question: Параллельно запущены воркеры с длительностями 1,10, 0,62, 0,88 и 1,45 секунды. Сколько всего секунд простоя набирают ветви, ожидая, пока команда целиком завершится?
  explanation: 'Каждая ветвь ждёт до отметки 1,45 с: (1,45−1,10) + (1,45−0,62) + (1,45−0,88) + 0 = 0,35 + 0,83 + 0,57 = 1,75 с. Простой — это оплаченная, но не использованная ёмкость параллелизма: он тем больше, чем сильнее разброс длительностей.'
  kind: numeric
  answer: 1.75
  tolerance: 0.02
  id: 020-parallel-baseline-1
  fingerprint: 77725d15
- concept: оптимизация любой ветви, кроме критической, не меняет время параллельного этапа
  question: 'Три ветви идут одновременно: 0,90, 0,48 и 0,72 секунды. Инженер оптимизировал вторую ветвь с 0,48 до 0,12 секунды. Каким станет время параллельного этапа?'
  explanation: 'Ускорение некритической ветви лишь удлиняет её простой: она раньше уходит в ожидание. Чтобы сократить этап, надо работать с самой долгой ветвью — дробить её на подветви, сужать поручение или убирать из обязательных.'
  kind: choice
  options:
    - 0,90 секунды — оно определяется критической ветвью, которую не трогали
    - 0,54 секунды — экономия 0,36 вычитается из общего времени
    - 0,12 секунды — теперь самая быстрая ветвь задаёт темп
  correct: 0
  id: 020-parallel-baseline-2
