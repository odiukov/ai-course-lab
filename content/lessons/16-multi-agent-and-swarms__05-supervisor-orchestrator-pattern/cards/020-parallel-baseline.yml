- concept: темп задаёт самая медленная обязательная ветвь; необязательный результат можно не ждать
  question: Одна из параллельных ветвей — «дополнительный контекст, полезный, но не влияющий на вывод» — работает дольше всех. Как это меняет время получения ответа?
  explanation: 'Ожидание задаёт максимум по тем ветвям, без которых ответ не собрать. Необязательность — это инженерное решение, зафиксированное явно: дедлайн ветви, флаг «best effort» или сбор результата после ответа. Само по себе «не очень важно» ничего не ускоряет — супервизор ждёт всех, кого пометил обязательными.'
  kind: choice
  options:
    - Если её результат объявлен необязательным, синтез стартует по обязательным ветвям, и эта ветвь перестаёт задавать время
    - 'Время всё равно определяется ею: супервизор обязан дождаться любой запущенной ветви'
    - Она автоматически исключается из расчёта, потому что не влияет на итоговый вывод
  correct: 0
