- concept: фазы ведущего выполняются последовательно, поэтому дробление задачи ускоряет только фазу исследования
  question: Ведущий дробит задачу на всё более мелкие подзадачи и запускает всё больше воркеров одновременно. Почему время до ответа перестаёт заметно падать?
  explanation: Одновременным запуском сжимается только фаза исследования, и она упирается в самого медленного воркера. Разбиение задачи и синтез результатов остаются последовательной работой ведущего, поэтому с ростом числа воркеров их доля во времени ответа растёт.
  kind: choice
  options:
    - Модель начинает отвечать медленнее из-за числа одновременных запросов
    - Планирование до запуска и сведение отчётов после него выполняет один узел последовательно, и они не ускоряются добавлением воркеров
    - Отчёты воркеров начинают противоречить друг другу, и запуск приходится повторять
    - Каждый новый воркер увеличивает время работы остальных
  correct: 1
