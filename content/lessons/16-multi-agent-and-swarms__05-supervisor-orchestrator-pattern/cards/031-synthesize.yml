- concept: арбитраж между расходящимися источниками требует нового сбора данных и потому не входит в задачу синтеза
  question: Два отчёта называют разные значения одной и той же величины. Почему функция синтеза не должна сама выбирать, какое из них верное? Объясни своими словами.
  explanation: Синтез — это перекомпоновка имеющегося материала. Любой выбор победителя без новых источников — угадывание, замаскированное гладким текстом; хуже всего то, что после такого выбора расхождение уже не восстановить из ответа.
  kind: open
  reference: На входе у синтеза только уже собранные отчёты — новых данных там нет. Чтобы решить спор, нужно вернуться к первоисточникам или запустить дополнительное исследование, а это отдельная работа с другой стоимостью. Поэтому синтез сохраняет оба значения с указанием, кто их принёс, и помечает место как расхождение; выбор версии остаётся решением следующего шага или человека.
  id: 031-synthesize-2
  fingerprint: 9afaadd2
