- concept: внутри группы фактов с одинаковым ключом конфликт фиксируется, когда различных нормализованных значений больше одного
  question: Факты сгруппированы по ключу утверждения, `values` — нормализованные значения одной группы. Заполни условие, при котором группа попадает в список конфликтов.
  explanation: Признак конфликта — не число фактов в группе, а число различных значений после нормализации. Три отчёта с одинаковым числом дают len(set(...)) == 1 и конфликтом не считаются; как только появляется второе различное значение, группа расходится.
  kind: cloze
  template: |-
    if len(set(values)) ___ 1:
        conflicts.append(make_conflict(key, values, sources))
  answer: '> '
  accept:
    - '>'
    - '> '
    - '>=2'
    - '> 1'
    - '!='
  id: 029-detect-conflicts-1
  fingerprint: f14ef28e
- concept: конфликт возможен только внутри группы с одинаковым ключом, где представлено больше одного источника
  question: 'Отчёт A: {год основания: 1998, число офисов: 7}. Отчёт B: {год основания: 1998, число офисов: 9}. Отчёт C: {выручка, млн: 55}. Сколько конфликтов вернёт корректно написанная detect_conflicts?'
  explanation: '«Год основания» совпадает у обоих источников — расхождения нет. «Выручка» встречается лишь в одном отчёте, спорить не с чем: одиночный факт конфликтом быть не может. Расходится только «число офисов» (7 против 9) — итого один конфликт.'
  kind: numeric
  answer: 1
  tolerance: 0.5
  id: 029-detect-conflicts-2
  fingerprint: '03818234'
- concept: 'элемент результата детектора должен нести атрибуцию: ключ, все расходящиеся значения и идентификаторы отчётов-источников'
  question: Какая структура одного элемента результата detect_conflicts делает найденное расхождение проверяемым дальше по конвейеру?
  explanation: Без ключа непонятно, о чём спор; без всех значений теряется предмет расхождения; без идентификаторов источников никто не сможет вернуться к исходному отчёту и перепроверить. Флаг или счётчик сообщают только факт проблемы, а вариант «значение большинства» ещё и подменяет фиксацию расхождения выбором.
  kind: choice
  options:
    - Ключ утверждения, все расходящиеся значения и идентификаторы отчётов, из которых каждое пришло
    - Флаг has_conflict и общее число расхождений по всему набору отчётов
    - Ключ утверждения и значение, встретившееся в большинстве отчётов
    - Склеенные тексты отчётов, в которых обнаружено расхождение
  correct: 0
  id: 029-detect-conflicts-3
  fingerprint: 1d8e3bc1
