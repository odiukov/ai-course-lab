- concept: воркеры работают изолированно, противоречия между ветками разрешает ведущий
  question: Почему воркеры в supervisor-схеме не обмениваются промежуточными находками напрямую, и кто тогда разбирается с противоречиями между их выводами?
  explanation: Изоляция веток нужна не для секретности, а чтобы сохранить независимость результатов и чистоту контекста. Ведущий — единственная точка, где ветки встречаются.
  kind: open
  reference: 'Каждый воркер работает в своём окне только над своим подвопросом: чужие промежуточные находки заняли бы место и увели бы его в сторону, а взаимное согласование сгладило бы расхождения ещё до того, как их кто-то увидел. Противоречия — полезный сигнал, и разрешает их ведущий на этапе синтеза: у него лежат все короткие отчёты и общий план, поэтому только он видит картину целиком.'
  id: 002-role-boundaries-2
  fingerprint: cec89a70
