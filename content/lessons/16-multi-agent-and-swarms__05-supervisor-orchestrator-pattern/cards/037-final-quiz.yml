- concept: контекст воркера стартует с его системного промпта и выданного вопроса, а не с диалоговой истории ведущего
  question: Ведущий агент проработал 45 реплик и накопил длинную историю обсуждения. Он запускает исполнителя. Что окажется в контексте исполнителя на первом шаге и почему схема устроена именно так?
  explanation: '«Чистое окно» — не оптимизация, а условие работы: именно оно даёт каждой ветви полный бюджет токенов под свой предмет. Плата за это — задание, которое само называет предмет и требуемую форму отчёта.'
  kind: open
  reference: 'Исполнитель стартует с чистого окна: собственный системный промпт плюс сформулированное для него задание. История переписки ведущего туда не переносится. Смысл в том, что окно исполнителя целиком уходит под его узкий вопрос, а не под чужие рассуждения; побочный эффект — исполнитель не может опереться на то, что не было явно записано в задании, поэтому задание обязано быть самодостаточным.'
