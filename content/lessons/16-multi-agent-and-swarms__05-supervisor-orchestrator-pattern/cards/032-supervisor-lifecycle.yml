- concept: 'один прогон супервизора проходит фиксированную последовательность: масштабирование усилий, декомпозиция, параллельное исполнение, сверка отчётов, сборка ответа'
  question: Расставь этапы одного запуска исследовательской команды под управлением ведущего в правильном порядке.
  explanation: Оценка сложности идёт первой, потому что задаёт объём и глубину плана. План задаёт границы веток, без него исполнители работают без критерия отбора. Сверка расхождений идёт до сборки текста, чтобы противоречия попали в ответ, а не были потеряны.
  kind: order
  items:
    - Оценить сложность запроса и получить ограничения на объём работы
    - Разложить запрос на ограниченные подвопросы и проверить их покрытие
    - Раздать подвопросы исполнителям одновременно и дождаться завершения всех ветвей
    - Сверить собранные отчёты на расхождения
    - Собрать итоговый ответ на исходный запрос
  id: 032-supervisor-lifecycle-1
  fingerprint: 57f440ad
- concept: проверка расхождений должна быть входом синтеза, а не постобработкой готового текста
  question: 'Инженер переставил этапы: сначала собирает итоговый текст из отчётов, затем ищет расхождения между отчётами. Что при этом ломается?'
  explanation: 'Сборка текста — необратимая операция для конфликтов: гладкая формулировка поглощает разницу значений. Поэтому детектор ставят между сбором отчётов и синтезом, а не после него.'
  kind: open
  reference: К моменту поиска расхождений итог уже выбрал одну формулировку и одно значение — противоречие либо стёрто, либо ответ приходится переписывать заново. Список расхождений должен приходить в сборку как вход, чтобы спорные места сразу попали в текст с обеими версиями и атрибуцией.
