- concept: 'топологии комбинируются по уровням: конвейер снаружи, супервизор внутри того этапа, где есть независимые ветви'
  question: 'Задача: собрать сведения о компании из реестров, прессы и отзывов, затем свести их в справку, затем перевести справку на другой язык. Какая топология уместна?'
  explanation: Выбор топологии — не решение на всю задачу, а решение на каждом уровне. Сведение зависит от сбора, перевод — от справки, поэтому снаружи конвейер. Но три источника внутри первого этапа независимы, и там супервизор с параллельными ветвями даёт настоящий выигрыш по часам.
  kind: choice
  options:
    - Конвейер из трёх этапов, внутри которого первый этап реализован супервизором с параллельными ветвями по источникам
    - Один супервизор, раздающий все три поручения — сбор, сведение и перевод — одновременно
    - 'Чистый конвейер: раз есть зависимые этапы, параллелить нельзя нигде'
  correct: 0
