- concept: 'промпт ведущего и промпт воркера специализированы по-разному: декомпозиция и синтез против одного узкого вопроса'
  question: В supervisor-схеме промпты ведущего и воркера пишутся по-разному. Что характерно для промпта воркера?
  explanation: Специализация через промпт — второй источник выигрыша паттерна. Ведущему говорят «разложи и синтезируй», воркеру — «найди, что изменилось в X». Сфокусированный промпт даёт сфокусированный ответ; общий промпт возвращает ведущего к той же размазанной задаче.
  kind: choice
  options:
    - Он повторяет промпт ведущего, чтобы воркер понимал общий замысел исследования
    - Он узкий и задаёт один конкретный вопрос, тогда как ведущий получает инструкцию разложить задачу и свести результаты
    - Он максимально общий, чтобы воркер сам решил, какая часть задачи важнее
    - Он содержит только описание формата вывода, а сам вопрос воркер выводит из данных
