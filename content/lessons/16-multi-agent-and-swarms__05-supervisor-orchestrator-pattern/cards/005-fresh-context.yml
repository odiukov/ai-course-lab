- concept: параллелизм сокращает время по часам, но суммарный расход токенов не уменьшает
  question: Команда перевела исследование с последовательного обхода на параллельный запуск воркеров. Что изменится в суммарном расходе токенов?
  explanation: 'Параллельно или последовательно — тот же объём работы обрабатывается тем же числом токенов. Экономию токенов дают другие два механизма: воркер не наследует потраченное ведущим планирование и получает узкий промпт.'
  kind: choice
  options:
    - Он упадёт пропорционально числу воркеров, потому что работа делится между ними
    - Он практически не изменится — параллелизм экономит время по часам, а токены экономят чистый контекст и узкие промпты
    - Он упадёт вдвое независимо от числа воркеров
    - Он вырастет пропорционально числу воркеров, потому что каждый воркер дублирует работу остальных
  correct: 1
