- concept: размер команды выбирает ведущий по смыслу запроса, а не жёстко зашитая константа вызывающего кода
  question: 'В системе прописано правило: любой пользовательский запрос запускает фиксированную команду воркеров. В чём главная ошибка такого решения?'
  explanation: 'Оценка сложности — часть работы ведущего. Константа во внешнем коде одинаково плоха в обе стороны: она сжигает бюджет на тривиальном вопросе и не даёт развернуть команду там, где направлений действительно много.'
  kind: choice
  options:
    - Вызывающий код не видит смысла задачи, а оценивать нужный объём работы должен узел, который прочитал запрос и построил план
    - Фиксированное число воркеров нарушает изоляцию их контекстов
    - Такое правило делает невозможным параллельный запуск
    - Воркеры не смогут вернуть отчёты в едином формате
  correct: 0
  id: 010-scale-effort-rule-1
  fingerprint: 92af8890
- concept: объём команды сопоставляется с числом независимых направлений и требуемой глубиной проверки, а не с длиной формулировки
  question: По какому признаку ведущему разумнее решать, сколько воркеров поднимать?
  explanation: Длинный запрос может сводиться к одному факту, а короткий — к сравнению четырёх рынков по нескольким источникам. Считать нужно ветви работы, а не слова.
  kind: choice
  options:
    - По длине формулировки запроса в символах
    - По наличию в запросе слов вроде «подробно» или «сравни»
    - По числу независимых направлений, количеству источников для сверки и требуемой глубине проверки
    - По тому, сколько воркеров свободно в данный момент
  correct: 2
  id: 010-scale-effort-rule-2
  fingerprint: 0d479434
- concept: мультиагентный прогон многократно дороже одиночного по токенам, поэтому его включают только под ценность задачи
  question: Мультиагентное исследование расходует на порядок больше токенов, чем одиночный агент. Какой практический вывод из этого следует?
  explanation: Расход токенов доминирует в стоимости прогона, а на простом вопросе большая команда не даёт кратного прироста качества — она просто множит чтение задания, вызовы инструментов и отчёты. Одновременный запуск сокращает ожидание, но не сумму токенов.
  kind: choice
  options:
    - Мультиагентность применяют только там, где ценность результата оправдывает эту цену; на простых запросах остаётся один агент
    - Мультиагентность применяют всегда, потому что качество ответа растёт пропорционально числу воркеров
    - Стоимость выравнивается, если запустить воркеров одновременно, а не по очереди
    - Достаточно урезать формат отчётов, чтобы стоимость сравнялась с одиночным запуском
  correct: 0
  id: 010-scale-effort-rule-3
  fingerprint: c7357268
