- concept: перед агрегацией длительности приводят к одной шкале, иначе смешение единиц даёт бессмысленное число
  question: 'Трейс отдал длительности воркеров в разных единицах: 450 мс, 1200 мс и 0,8 с. Сколько секунд заняла бы эта работа при последовательном выполнении?'
  explanation: 'Миллисекунды нужно перевести в секунды до агрегации: 0,45 + 1,2 + 0,8 = 2,45 с. Если сложить числа как есть (450 + 1200 + 0,8), получится величина без физического смысла. Единицы фиксируют на входе агрегатора, а не догадываются по величине значения.'
  kind: numeric
  answer: 2.45
  tolerance: 0.01
  id: 019-sequential-seconds-2
