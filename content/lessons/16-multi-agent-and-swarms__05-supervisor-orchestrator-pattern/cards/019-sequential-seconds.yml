- concept: оценка альтернативного режима выполнения выводится из уже собранных метрик, а не из повторного прогона
  question: Воркеры уже отработали параллельно, и их длительности записаны. Объясни, почему последовательное время считают из этих записей, а не запускают ту же работу ещё раз по очереди.
  explanation: 'Метрика-производная бесплатна, а измерение — нет. Отсюда правило: агрегатор принимает готовые результаты воркеров и ничего не исполняет заново.'
  kind: open
  reference: 'Повторный прогон стоит реального времени и реальных токенов: воркеры снова сходят в инструменты и снова оплатят свои контексты. При этом он даст другие числа — сеть, кэши и сама модель дают разброс, так что сравнение окажется грязным. Длительность каждой ветви не зависит от того, ждали её соседи или нет, поэтому альтернативный режим — это арифметика над уже имеющимися метриками, а не новый эксперимент.'
  id: 019-sequential-seconds-3
  fingerprint: a8001379
