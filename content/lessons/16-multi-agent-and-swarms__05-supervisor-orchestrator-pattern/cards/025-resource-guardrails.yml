- concept: экономия от удешевления модели умножается на число исполнителей, поэтому дешёвую модель ставят воркерам, а не ведущему
  question: В supervisor-системе один ведущий строит план и делает синтез, а под ним работает команда из девяти воркеров. Бюджет ограничен, и можно перевести на более дешёвую модель либо ведущего, либо всех воркеров. Какой выбор даёт больший эффект и почему?
  explanation: 'Стоимость роли = цена модели × число вызовов. Ведущий один (план + синтез), воркеров много, и каждый тратит токены на свои источники и вызовы инструментов. Отсюда стандартная пара: сильная модель рассуждений наверху, быстрая и дешёвая — на исполнителях. Ведущему сильная модель нужна как раз потому, что декомпозиция и разрешение противоречий — самые трудные операции прогона.'
  kind: choice
  options:
    - 'Перевести воркеров: их вызовов кратно больше, поэтому экономия на каждом складывается, а ведущий вызывается один раз за прогон'
    - 'Перевести ведущего: он обрабатывает самый длинный контекст, а значит именно он и есть основная статья расходов'
    - 'Перевести обоих одинаково: стоимость прогона распределена между ролями поровну'
    - 'Не переводить никого: смена модели у любой роли ломает контракт отчётов'
  correct: 0
  id: 025-resource-guardrails-1
  fingerprint: afc3f63e
- concept: порог таймаута воркера считают от медианы наблюдаемых длительностей, потому что среднее сдвигается зависшими прогонами
  question: Последние пять прогонов воркера заняли 18, 22, 25, 100 и 140 секунд. Команда убивает воркера, который проработал дольше трёх медианных времён. Сколько секунд составит порог?
  explanation: 'Медиана отсортированного ряда 18, 22, 25, 100, 140 — это 25, порог 3 × 25 = 75 с. Среднее здесь равно 61 с и порог был бы 183 с: два зависших прогона сами подняли бы планку и защитили следующий такой же сбой. Медиана устойчива к выбросам, поэтому за норму берут её.'
  kind: numeric
  answer: 75
  tolerance: 0.1
  id: 025-resource-guardrails-2
  fingerprint: 6a05215b
- concept: таймаут и лимит токенов ограничивают разные ресурсы, поэтому один не заменяет другой
  question: 'У воркеров стоит таймаут по времени работы. Один воркер зациклился: он быстро делает сотни коротких вызовов поиска и укладывается в отведённое время, но счёт за прогон вырос на порядок. Какой ограничитель закрывает этот случай?'
  explanation: 'Таймаут ограничивает время по часам, лимит токенов — объём и цену. Быстрые частые вызовы проходят под таймаутом, но сжигают бюджет, поэтому оба ограничителя ставят вместе. Порядок величины лимита задают от ожидаемого входа синтеза (например, десятикратный запас): нормальный воркер в него укладывается, сбежавший — упирается и останавливается.'
  kind: choice
  options:
    - Жёсткий лимит токенов на воркера, привязанный к ожидаемому объёму его отчёта
    - Более короткий таймаут — он автоматически сокращает и расход токенов
    - Перевод этого воркера на модель ведущего, у неё выше качество остановки
    - 'Отказ от параллельного запуска: последовательный режим сам ограничивает расход'
  correct: 0
  id: 025-resource-guardrails-3
