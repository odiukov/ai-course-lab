- concept: 'supervisor-запуск идёт в две фазы: разветвление задачи и сведение результатов'
  question: Расставь этапы одного цикла supervisor-оркестрации в правильном порядке.
  explanation: 'Сначала fan-out (одна задача расходится на независимые ветки), потом fan-in (ветки сходятся в одну точку). Между ветками горизонтальных переходов нет: воркер не согласует выводы с соседом и не ждёт его.'
  kind: order
  items:
    - Ведущий разбирает исходный вопрос и формулирует независимые подзадачи с ожидаемым результатом
    - Каждая подзадача уходит своему воркеру в отдельном контексте, воркеры работают параллельно
    - Воркеры возвращают ведущему короткие артефакты по своим подзадачам
    - Ведущий сопоставляет артефакты, разрешает противоречия и собирает единый ответ
  id: 004-supervisor-tree-1
  fingerprint: 23cfc082
- concept: синтез принадлежит узлу, который хранит план и цель пользователя
  question: Почему в supervisor-дереве финальный синтез делает сам ведущий, а не отдельный дополнительный воркер, которому передали бы все отчёты?
  explanation: Синтез — это не «склеить тексты», а проверить, отвечают ли ветки на исходный вопрос, и при нехватке запустить новую ветку. Такое решение может принять только узел с планом; отдельный синтезатор получил бы отчёты без понимания, зачем их запрашивали.
  kind: choice
  options:
    - Ведущий хранит общий план и знает, какой итог нужен пользователю, поэтому только он может оценить полноту и заказать доисследование
    - Отдельный агент физически не может принять больше одного отчёта на вход
    - Синтез требует большего контекстного окна, чем доступно воркерам
  correct: 0
