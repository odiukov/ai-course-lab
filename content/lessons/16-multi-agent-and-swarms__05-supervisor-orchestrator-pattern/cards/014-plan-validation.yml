- concept: 'валидация плана идёт в двух направлениях: от частей вопроса к отчётам и от каждого подвопроса к части ответа'
  question: Ведущий составил план исследования. Как проверить его на пробелы и на лишние ветви до запуска воркеров? Объясни своими словами.
  explanation: Двусторонняя сверка ловит оба дефекта разом. Проверка «сверху вниз» находит пробелы, проверка «снизу вверх» — лишние ветви; ни одна из них по отдельности не заменяет другую.
  kind: open
  reference: 'Проход в одну сторону: разложить исходный вопрос на части и для каждой спросить, из отчёта какого воркера возьмётся материал для ответа. Часть без источника — пробел, для неё нужен новый подвопрос. Проход в обратную сторону: для каждого подвопроса спросить, какую часть итогового ответа он поддерживает. Подвопрос, не поддерживающий ничего, — лишняя ветвь: она тратит бюджет и время, но не приближает ответ. Проверяется соответствие плана цели, а не качество формулировок внутри отдельных заданий.'
  id: 014-plan-validation-2
  fingerprint: 4013b386
- concept: ветвь плана, не поддерживающая ни одной части ответа, подлежит удалению, а не выполнению
  question: 'При сверке плана обнаружилось: один из подвопросов интересен, но ни один фрагмент будущего ответа на него не опирается. Что делать?'
  explanation: Лишняя ветвь стоит бюджета, времени и объёма на синтезе, а вклада в ответ не даёт. Ветвь без адресата в итоговом ответе — кандидат на замену непокрытым направлением.
  kind: choice
  options:
    - Убрать ветвь и освободившегося воркера направить на непокрытую часть вопроса
    - 'Оставить: дополнительный материал всегда повышает качество синтеза'
    - Оставить, но урезать бюджет ветви вдвое
    - Запустить ветвь последней, когда остальные закончат
