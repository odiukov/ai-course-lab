- concept: синтез — реконструкция ответа под исходный вопрос, а не последовательная склейка отчётов
  question: Чем синтез в supervisor-системе отличается от конкатенации отчётов воркеров? Перечислите операции, которые он выполняет над набором выжимок.
  explanation: 'Конкатенация оставляет ответ в форме плана: повторы, разнородные фрагменты, ноль связей между ветвями. Синтез перестраивает материал под вопрос — и именно поэтому его делает узел, который видит цель целиком, а не любой из воркеров.'
  kind: open
  reference: 'Ведущий возвращается к исходному вопросу пользователя и собирает ответ под него, а не под структуру плана. Совпадающие выводы разных ветвей упоминаются один раз, а не повторяются столько раз, сколько воркеров их нашли. Дополняющие факты из разных ветвей связываются в единое утверждение. Материал, не работающий ни на одну часть вопроса, отбрасывается, даже если он корректен. Противоречащие утверждения не сливаются: обе версии сохраняются с указанием расхождения. Порядок изложения диктует вопрос, а не порядок завершения воркеров.'
