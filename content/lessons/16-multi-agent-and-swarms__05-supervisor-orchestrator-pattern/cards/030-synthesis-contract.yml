- concept: 'совпадение отчётов не является голосованием: ветви могут наследовать один и тот же источник, поэтому большинство не доказывает истину'
  question: Три воркера из четырёх сообщили одно значение, четвёртый — другое. Почему ведущий не может принять версию большинства просто как более вероятную?
  explanation: Вес свидетельства даёт независимость источников, а не количество отчётов. Если несколько воркеров нашли одну и ту же публикацию, повтор значения не добавляет подтверждения. Поэтому опорой служат источники в отчётах, а не арифметика голосов; при существенном расхождении назначают дополнительный раунд с прицельной проверкой.
  kind: choice
  options:
    - Совпавшие ветви могли опираться на один и тот же источник, поэтому их отчёты не являются независимыми свидетельствами
    - Число воркеров всегда чётное, поэтому большинство формально не определено
    - 'Отчёт меньшинства по построению точнее: узкая ветвь исследует глубже'
    - Ведущий не видит, сколько воркеров вернуло каждое значение, — эта информация теряется при синтезе
