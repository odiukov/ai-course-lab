- concept: узкий артефакт на обратной стрелке сжимает объём, который видит ведущий на синтезе
  question: Четыре воркера накопили по 180 KB сырых материалов каждый и вернули ведущему отчёты по 6 KB. Во сколько раз меньше текста получит ведущий по сравнению с передачей всего сырья?
  explanation: 'Сырьё: 4 × 180 = 720 KB. Отчёты: 4 × 6 = 24 KB. 720/24 = 30. Именно узкий артефакт на стрелке вверх делает паттерн дешёвым сверху: без него перегрузка просто переезжает к ведущему.'
  kind: numeric
  answer: 30
  tolerance: 0.5
  id: 006-narrow-artifacts-1
  fingerprint: 54e0fb44
- concept: отчёт воркера обязан нести вывод, опорные факты и уровень неопределённости, иначе синтез невозможен
  question: Воркер возвращает ведущему короткий отчёт. Какой набор содержимого делает отчёт пригодным для синтеза?
  explanation: Сжатие намеренное, но оно не должно прятать основания вывода. «Ответ найден» без опор нечем сопоставить с другими ветками. Полная стенограмма возвращает ведущему всю гору сырья и уничтожает выигрыш паттерна.
  kind: choice
  options:
    - Только итоговый вывод одной строкой — остальное ведущий при необходимости запросит заново
    - Вывод, несколько существенных фактов, на которых он держится, и отметка о степени уверенности
    - Полная стенограмма поиска, чтобы ведущий мог проверить каждый шаг
    - Список ссылок на просмотренные источники без интерпретации
  correct: 1
  id: 006-narrow-artifacts-2
  fingerprint: d2442710
- concept: сырой контекст остаётся у того узла, который его обработал, а вверх поднимается только результат
  question: Объясни своими словами, где в supervisor-схеме заканчивают путь исходные материалы, промежуточные догадки и неудачные ветки поиска, и почему их не поднимают к ведущему.
  explanation: Обратная стрелка должна быть такой же узкой, как прямая. Три полные стенограммы на 300 KB против трёх отчётов на 3 KB — разница между тремя управляемыми объектами и тремя новыми исследовательскими задачами на столе ведущего.
  kind: open
  reference: 'Всё сырьё остаётся в контекстном окне того воркера, который его обработал: он читал источники, перебирал версии и уже извлёк из них вывод. Наверх уходит только узкий артефакт. Если поднять сырьё, ведущему пришлось бы повторно проделать ту же работу — перегрузка просто сменила бы адрес, и ведущий из синтезатора превратился бы в ещё одного исследователя. Его задача — сопоставить готовые результаты, а не переисследовать материал.'
  id: 006-narrow-artifacts-3
  fingerprint: 6208e4aa
