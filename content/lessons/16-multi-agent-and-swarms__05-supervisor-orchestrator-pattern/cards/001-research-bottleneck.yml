- concept: исходные материалы и рассуждение делят одно контекстное окно
  question: Один агент должен сопоставить 6 источников по 25 000 токенов каждый, загрузив их все в окно на 300 000 токенов. Сколько токенов останется под рассуждение, план и ответ?
  explanation: '6 × 25 000 = 150 000 токенов занято сырьём, остаётся 300 000 − 150 000 = 150 000. Окно делится между материалом и мышлением: чем больше источников втянуто в одно окно, тем меньше места на сопоставление. Раздача источников по воркерам даёт каждому почти полное окно под один узкий вопрос.'
  kind: numeric
  answer: 150000
  tolerance: 1
  id: 001-research-bottleneck-1
  fingerprint: 9bff98e7
- concept: качество research-системы определяется в основном суммарным объёмом обработанных токенов
  question: Что по данным Anthropic объясняет большую часть разброса результатов между research-системами на поисковых бенчмарках?
  explanation: На BrowseComp около 80% разброса объясняется одним лишь расходом токенов. Поэтому мультиагентная схема выигрывает не «сообразительностью», а тем, что несколько свежих окон суммарно прочитывают в разы больше материала — и стоит она ровно во столько же раз дороже.
  kind: choice
  options:
    - Суммарный расход токенов, то есть сколько материала система вообще успела обработать
    - Температура сэмплирования у ведущей модели
    - Длина системного промпта ведущего агента
  correct: 0
  id: 001-research-bottleneck-2
  fingerprint: 7708db53
- concept: последовательное чтение с вытеснением или сжатием источников теряет ранние детали
  question: Агент читает источники по очереди и, чтобы освободить окно, заменяет прочитанное краткими заметками. Какое ограничение остаётся?
  explanation: 'Вытеснение и сжатие лечат нехватку места ценой деталей: к последнему источнику агент уже не помнит точной формулировки первого. Плюс последовательность не позволяет проверять независимые направления одновременно.'
  kind: choice
  options:
    - Каждое сжатие отбрасывает часть смысла, поэтому ранние оговорки и связи между источниками теряются к концу прохода
    - Модель перестаёт понимать инструкции после первого сжатия
    - Заметки нельзя хранить в контексте, их приходится держать во внешнем файле
  correct: 0
  id: 001-research-bottleneck-3
  fingerprint: f30a34c4
