- concept: пропуск широкой разведки ведёт к дублированию усилий и к пропущенным трудным местам
  question: Объясни своими словами, чем рискует ведущий, который сразу отправляет большую команду вглубь всех направлений, минуя широкий первый проход.
  explanation: 'Разведка меняет распределение усилий: сначала находим трудное место, потом тратим на него глубину. Иначе платим и за дубли, и за пропущенное ограничение.'
  kind: open
  reference: Без разведки неизвестно, где сосредоточена сложность, поэтому глубина распределяется вслепую. Несколько воркеров уходят в одну и ту же лёгкую тему и приносят пересказ одного и того же материала — это оплаченное дублирование. Одновременно по-настоящему трудная ветвь получает столько же внимания, сколько тривиальная, и остаётся раскрытой одной строкой. Ведущий тратит максимальный бюджет и всё равно получает неравномерное покрытие. Широкий проход стоит дёшево и заранее показывает, куда переносить людей и инструменты, а начальная оценка масштаба задаёт только старт и может быть пересмотрена по его результатам.
  id: 012-broad-then-narrow-3
