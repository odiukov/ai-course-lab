- concept: первый широкий проход нужен для обнаружения того, где скрыта сложность, а не для получения исчерпывающего ответа
  question: Ведущий начинает большое исследование с нескольких широких подвопросов вместо немедленного глубокого копания. Какова главная цель этого первого прохода?
  explanation: 'Заранее неизвестно, где спрятана настоящая трудность. Широкий проход — это разведка: он показывает, какие ветви можно закрыть, а какая требует дополнительных воркеров.'
  kind: choice
  options:
    - Получить сразу окончательный ответ по каждому направлению
    - 'Быстро увидеть рельеф задачи: где всё ясно, а где обнаружились пробелы, противоречия или слишком крупный вопрос'
    - Занять всех доступных воркеров, чтобы не простаивали
    - Собрать как можно больше источников про каждое направление
  correct: 1
  id: 012-broad-then-narrow-1
  fingerprint: a9c942a2
- concept: дополнительную глубину получают только ветви с пробелами, противоречиями или слишком крупным вопросом, ясные ветви закрываются
  question: После широкого прохода по четырём направлениям три отчёта дают понятные и непротиворечивые данные, а четвёртый сообщает, что требования различаются по категориям и по районам. Что делает ведущий?
  explanation: Команда растёт вслед за найденной сложностью, а не «на всякий случай». Равномерное углубление тратит токены на ветви, где ответ уже получен, и всё равно не гарантирует глубины там, где она нужна.
  kind: choice
  options:
    - Запускает по дополнительному воркеру на каждое из четырёх направлений, чтобы глубина была равномерной
    - Закрывает три ясные ветви и дробит только четвёртую на несколько новых узких поручений
    - Перезапускает весь широкий проход с более подробными формулировками
    - Отдаёт четвёртое направление тому же воркеру ещё раз с тем же поручением
  correct: 1
