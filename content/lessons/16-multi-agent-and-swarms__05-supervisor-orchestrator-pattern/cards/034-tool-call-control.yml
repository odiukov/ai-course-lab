- concept: 'смена рекомендованной формы реализации не означает неработоспособность прежнего API: выбор идёт по нужной степени контроля'
  question: Рекомендация сместилась от готового хелпера супервизора к сборке через вызовы инструментов. Значит ли это, что старый способ сломан и его нужно срочно менять? Объясни.
  explanation: 'Рекомендации инструментов различают «работает» и «даёт контроль». Здесь речь про второе: несколько сэкономленных строк редко стоят контекста, случайно ушедшего не тому исполнителю.'
  kind: open
  reference: 'Нет. Библиотека продолжает работать, и на задачах, где устраивает поведение по умолчанию, хелпер остаётся разумным выбором. Смена рекомендации касается степени контроля над контекстом: если нужно решать, что именно увидит исполнитель и что вернётся назад, явные вызовы инструментов делают эту границу видимой и проверяемой. Мигрировать стоит тогда, когда контроль реально нужен, а не по факту смены рекомендации.'
  id: 034-tool-call-control-2
  fingerprint: 53bec1da
