- concept: агенты долгоживущие и с состоянием, поэтому версии выкатывают постепенно (rainbow), а не мгновенным переключением трафика
  question: 'Сервис агентов держит сессии по 40 минут: у каждого запуска накоплено состояние и незакрытые вызовы инструментов. Почему классический blue-green деплой (мгновенное переключение всего трафика на новую версию и гашение старой) здесь опасен?'
  explanation: 'Stateful и долгоживущие агенты не заканчиваются вместе с HTTP-запросом. Blue-green рассчитан на короткие stateless вызовы: он гасит старый стек сразу после переключения. Rainbow-подход выводит новую версию постепенно и даёт старым запускам доиграть начатое до конца.'
  kind: choice
  options:
    - Новая версия не сможет прочитать конфигурацию старой
    - Гашение старой версии обрывает запуски, которые ещё выполняются, вместе с их накопленным состоянием
    - Две версии не могут одновременно обращаться к одним и тем же инструментам
    - Переключение трафика удваивает расход токенов на каждый запрос
  correct: 1
  id: 011-scale-effort-1
  fingerprint: cac8c5f9
- concept: оценка сложности должна возвращаться как машиночитаемые ограничения исполнения, а не как текстовый вердикт
  question: Ведущий агент оценил запрос и решил, что задача простая. Что он должен передать дальше, чтобы остальная система только исполняла это решение, ничего не додумывая?
  explanation: 'Решение о масштабе усилий полезно, только если выражено величинами, которые исполнитель может применить без интерпретации. Простой запрос: режим single, один агент, бюджет порядка 3–10 вызовов инструментов. Сложный: мультиагентный режим и команда от 10 агентов. Свободный текст или ключевые слова заставляют нижние слои снова гадать, и масштабирование остаётся только в названии функции.'
  kind: choice
  options:
    - Текстовое обоснование в свободной форме, почему запрос выглядит простым
    - 'Явные ограничения: режим работы, допустимое число агентов и бюджет вызовов инструментов'
    - Полный текст пользовательского запроса, чтобы каждый воркер оценил сложность сам
    - Список ключевых слов, найденных в запросе
  correct: 1
  id: 011-scale-effort-2
  fingerprint: 0c8a0cb0
