- concept: следующий токен предсказывается по выходу attention для последней позиции префикса
  question: Полный causal attention возвращает по одному выходному вектору для каждой позиции текущего префикса. Какой из них нужно передать в преобразование, предсказывающее следующий токен?
  explanation: Последняя позиция соответствует текущему концу префикса и с учётом causal mask содержит информацию обо всех доступных ей предыдущих токенах. Именно её выход используется для предсказания продолжения.
  kind: choice
  options:
    - Вектор последней позиции
    - Среднее всех выходных векторов
    - Вектор первой позиции
  correct: 0
  id: 013-code-decode-naive-1
  fingerprint: db10941f
- concept: корректное сравнение декодеров требует одинаковых параметров и источников случайности
  question: Объясни, почему при проверке эквивалентности наивного и оптимизированного декодеров нельзя независимо инициализировать их матрицы проекций.
  explanation: Одинаковые условия превращают совпадение выходов в содержательную проверку реализации. При разных весах даже два безошибочных декодера закономерно могут сгенерировать разные последовательности.
  kind: open
  reference: Если декодеры используют разные матрицы проекций или разные случайные решения, различие результатов может быть вызвано не способом декодирования, а различием самих вычислений. Нужно зафиксировать и переиспользовать одинаковые веса, вход и случайное состояние, чтобы тест изолировал только исследуемую оптимизацию.
  id: 013-code-decode-naive-2
  fingerprint: a07d58b1
