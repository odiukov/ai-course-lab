- concept: отношение двух вероятностей softmax определяется экспонентой разности соответствующих логитов
  question: Для логитов a и b softmax вычислил вероятности p_a и p_b. Чему равно отношение p_a / p_b?
  explanation: 'Общий знаменатель softmax сокращается: p_a / p_b = exp(a) / exp(b) = exp(a - b). Поэтому softmax сохраняет относительные различия между логитами.'
  kind: choice
  options:
    - math.exp(a - b)
    - a / b
    - math.exp(a) / (a + b)
    - math.exp(b - a)
