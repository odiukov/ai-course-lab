- concept: ключи и значения префиксных токенов можно кэшировать, поскольку они не меняются при продолжении причинной последовательности
  question: Почему при авторегрессионном декодировании можно сохранить векторы K и V уже обработанных токенов и использовать их на следующих шагах?
  explanation: При фиксированных параметрах модели векторы K и V старого токена определяются уже известным ему префиксом. Причинная маска закрывает будущие позиции, поэтому добавление новых токенов не меняет ранее вычисленные K и V.
  kind: choice
  options:
    - Потому что причинная маска не позволяет представлению старого токена зависеть от добавленных позже токенов
    - Потому что все токены последовательности имеют одинаковые векторы K и V
    - Потому что после первого шага attention перестаёт использовать ключи и значения
    - Потому что новый query можно заменить последним сохранённым значением V
