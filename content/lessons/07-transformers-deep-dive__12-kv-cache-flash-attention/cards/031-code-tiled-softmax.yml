- concept: размер накопителя результата определяется размерностью векторов значений
  question: 'Вычисляется потоковый attention для одного запроса: строки K имеют ту же длину, что и q, а строки V могут иметь другую длину. Какой должна быть длина накопителя out?'
  explanation: Результат attention — взвешенная сумма строк V, поэтому out должен иметь ту же размерность, что и один вектор значения. Размерности q и K определяют только вычисление оценок.
  kind: choice
  options:
    - Число строк K
    - Длина строки V
    - Длина q
    - Размер тайла
  correct: 1
  id: 031-code-tiled-softmax-1
  fingerprint: 0eee89fc
- concept: первое обновление потокового softmax требует явной обработки начального бесконечного максимума
  question: В начале tiled softmax бегущий максимум равен минус бесконечности. Почему коэффициент переноса старого состояния на первом блоке безопаснее задать отдельной веткой?
  explanation: Если старый и новый максимумы равны минус бесконечности, их разность даёт nan. Старого накопленного состояния ещё нет, поэтому коэффициент его переноса корректно положить равным нулю.
  kind: choice
  options:
    - Чтобы все элементы первого блока получили одинаковые веса
    - Чтобы результат не зависел от размера блока
    - Чтобы не получить неопределённость при вычитании двух минус бесконечностей
    - Чтобы не вычислять скалярные произведения для первого блока
  correct: 2
  id: 031-code-tiled-softmax-2
  fingerprint: 6ad5cf96
- concept: коэффициент переноса должен вычисляться со старым максимумом до обновления состояния
  question: Расположи операции обработки очередного блока tiled softmax в корректном порядке.
  explanation: exp_old должен видеть прежний m. Если сначала заменить m новым максимумом, коэффициент станет единичным и ранее накопленные величины не будут переведены в новый масштаб.
  kind: order
  items:
    - Вычислить оценки блока и новый максимум с учётом текущего m
    - Вычислить exp_old из старого m и нового максимума
    - Пересчитать s и out в новый масштаб и добавить вклад блока
    - Присвоить m значение нового максимума
  id: 031-code-tiled-softmax-3
  fingerprint: fe13fb65
