- concept: при увеличении бегущего максимума накопленная сумма экспонент переводится в новый масштаб одним множителем
  question: После обработки нескольких тайлов бегущий максимум равен 7, а бегущая сумма экспонент в его масштабе равна 3. Следующий тайл содержит оценки 14 и 11. Чему равна обновлённая бегущая сумма?
  explanation: 'Новый максимум равен 14. Старую сумму нужно пересчитать в его масштаб: s = 3·exp(7−14) + exp(14−14) + exp(11−14) ≈ 1.0525. Повторно читать предыдущие тайлы не требуется.'
  kind: numeric
  answer: 1.0525
  tolerance: 0.0002
  id: 030-running-max-sum-1
  fingerprint: ff9d514e
- concept: накопленный числитель softmax и его знаменатель должны оставаться в одном масштабе
  question: Потоковый attention хранит бегущую сумму экспонент и ненормированный накопитель выходного вектора. Что нужно сделать с накопителем выхода, если новый тайл повысил бегущий максимум?
  explanation: Старая сумма и старый векторный числитель вычислены относительно прежнего максимума. Одинаковое масштабирование обоих сохраняет их отношение и позволяет получить точный нормализованный выход.
  kind: choice
  options:
    - Оставить его неизменным, потому что векторы значений не входят в softmax
    - Домножить его на тот же exp(старый_max − новый_max), что и старую сумму
    - Разделить его на сумму экспонент только из нового тайла
    - Отбросить его и сохранить вклад только нового тайла
  correct: 1
  id: 030-running-max-sum-2
  fingerprint: bd207ad8
