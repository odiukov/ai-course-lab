- concept: обратный проход может пересчитывать промежуточные тайлы вместо хранения полной матрицы вероятностей
  question: Объясни, как Flash Attention вычисляет градиенты, не сохраняя полную матрицу вероятностей attention после прямого прохода, и какой компромисс при этом возникает.
  explanation: Для backward важны значения промежуточных вероятностей, но их необязательно держать в HBM. Flash Attention восстанавливает нужный тайл по Q, K и V непосредственно перед вычислением соответствующей части градиента. Это классический обмен вычислений на память без перехода к приближённым градиентам.
  kind: open
  reference: 'Во время обратного прохода нужные тайлы оценок и вероятностей заново вычисляются из сохранённых Q, K и V и состояния нормализации. Поэтому полную матрицу P хранить не требуется: расход памяти и обмен с HBM уменьшаются ценой дополнительных арифметических операций.'
