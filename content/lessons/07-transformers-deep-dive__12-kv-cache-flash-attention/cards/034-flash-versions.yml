- concept: поколения FlashAttention специализированы под последовательные архитектуры GPU
  question: Расположите пары «реализация — целевая архитектура» от более ранней к более новой.
  explanation: Flash 2 оптимизирован для Ampere и A100, Flash 3 использует возможности Hopper и H100, а Flash 4 построен под Blackwell. Более новый номер ядра не означает совместимость со старой архитектурой.
  kind: order
  items:
    - FlashAttention второго поколения — Ampere
    - FlashAttention третьего поколения — Hopper
    - FlashAttention четвёртого поколения — Blackwell
  id: 034-flash-versions-1
  fingerprint: 24ad62bf
- concept: отсутствие обратного прохода делает начальный выпуск FlashAttention четвёртого поколения непригодным для обучения
  question: Команда обучает трансформер на GPU архитектуры Blackwell. Как следует поступить при выборе реализации attention?
  explanation: На старте Flash 4 реализует только forward, тогда как обучение требует и backward. Поэтому обучение остаётся на Flash 3, даже если Flash 4 совместим с архитектурой установленной карты.
  kind: choice
  options:
    - Выбрать FlashAttention четвёртого поколения, поскольку совместимой архитектуры достаточно для обучения
    - Оставить FlashAttention третьего поколения для обучения, поскольку начальный выпуск четвёртого поддерживает только прямой проход
    - Отказаться от всех версий FlashAttention, поскольку они предназначены исключительно для инференса
  correct: 1
  id: 034-flash-versions-2
  fingerprint: 062cb81a
- concept: совместимость FlashAttention с архитектурой GPU не гарантирует поддержку нужных режимов attention
  question: Почему перед внедрением новейшего ядра FlashAttention для инференса с GQA и последовательностями переменной длины недостаточно проверить только архитектуру GPU?
  explanation: У Flash 4 в середине 2026 года ещё дописывались GQA и varlen. Выбор ядра требует проверять не только поколение GPU, но и поддержку операций, от которых зависит конкретная модель.
  kind: open
  reference: У конкретной версии могут быть ещё не реализованы необходимые режимы. В начальном FlashAttention четвёртого поколения поддержка GQA и varlen находилась в разработке, поэтому совместимость с Blackwell сама по себе не гарантировала пригодность ядра для такой нагрузки.
  id: 034-flash-versions-3
  fingerprint: f4eb94fa
