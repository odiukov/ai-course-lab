- concept: lookahead decoding строит кандидатов через итерации Якоби и не требует draft-модели
  question: Чем lookahead decoding принципиально отличается от спекулятивного декодирования с отдельной draft-моделью?
  explanation: Обычная спекулятивная схема поручает черновик отдельной дешёвой модели. Lookahead decoding заменяет её итеративным построением кандидатов, поэтому не требует хранения и запуска второго набора весов.
  kind: open
  reference: Lookahead decoding получает кандидатов с помощью итераций Якоби внутри процесса декодирования, поэтому отдельная модель для создания черновика ему не нужна.
  id: 037-spec-why-works-2
  fingerprint: e4e4fc9e
