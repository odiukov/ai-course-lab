- concept: вычитание максимума ограничивает экспоненты сверху и предотвращает переполнение
  question: Почему при численно устойчивом вычислении softmax из логитов вычитают их максимум?
  explanation: После вычитания максимума экспоненты не превосходят единицу, поэтому не переполняются. Экспонента максимального логита равна единице, так что в знаменателе гарантирован ненулевой вклад.
  kind: choice
  options:
    - Все аргументы экспоненты становятся неположительными, а у максимального логита аргумент равен нулю
    - Все логиты становятся неотрицательными и сохраняют исходную сумму
    - Знаменатель softmax становится равен количеству логитов
    - Результат перестаёт зависеть от различий между логитами
