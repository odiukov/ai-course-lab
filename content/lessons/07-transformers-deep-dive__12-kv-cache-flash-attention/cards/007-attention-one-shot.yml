- concept: softmax в attention нормализует оценки отдельно для каждого запроса по всем ключам
  question: Матрица S содержит оценки Sᵢⱼ между запросами и ключами. Как в стандартном attention применяется softmax?
  explanation: 'Строка Sᵢ,: содержит оценки одного запроса для всех ключей. Её softmax образует строку Pᵢ,: с весами, по которым затем смешиваются значения.'
  kind: choice
  options:
    - 'Отдельно по каждой строке: для фиксированного запроса по всем ключам'
    - 'Отдельно по каждому столбцу: для фиксированного ключа по всем запросам'
    - Сразу ко всем элементам матрицы как к одному списку
    - Только к главной диагонали матрицы
