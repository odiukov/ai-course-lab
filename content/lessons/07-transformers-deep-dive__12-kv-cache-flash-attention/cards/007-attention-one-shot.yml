- concept: выход attention является взвешенной суммой векторов значений
  question: Для одной координаты двух векторов значений получены числа 8 и 12, а соответствующие веса attention равны 0.25 и 0.75. Чему равна эта координата выходного вектора?
  explanation: 'Умножение O = PV смешивает значения с весами из P: 0.25 × 8 + 0.75 × 12 = 11.'
  kind: numeric
  answer: 11
  tolerance: 0.001
