- concept: обучение лучше переиспользует загруженные веса, а поточечный декодинг имеет низкую вычислительную интенсивность
  question: Почему одна и та же GPU обычно ближе к пиковой вычислительной производительности при обучении на большом батче, чем при авторегрессионной генерации по одному токену?
  explanation: Большой батч позволяет многократно использовать загруженные веса и повышает вычислительную интенсивность. При поточечном декодинге веса приходится снова подвозить из HBM ради сравнительно малого объёма вычислений, поэтому ограничением становится пропускная способность памяти.
  kind: choice
  options:
    - При обучении загруженные веса используются для множества примеров, поэтому на каждый переданный байт приходится больше вычислений
    - При обучении веса не считываются из HBM
    - Генерация выполняет больше операций над каждым байтом весов, чем обучение
    - При обучении все веса модели постоянно помещаются в регистрах GPU
  correct: 0
  id: 001-inference-vs-training-1
  fingerprint: 40d18fa5
- concept: материализация матрицы оценок attention создаёт квадратичный обмен с HBM
  question: Объясни своими словами, почему стандартный attention может стать memory-bound при длинном контексте, даже если GPU очень быстро выполняет матричные умножения.
  explanation: Узким местом становится не число умножений, а движение промежуточных данных между HBM и вычислительными блоками. Именно этот лишний обмен устраняет тайловый подход Flash Attention.
  kind: open
  reference: Стандартная реализация записывает в HBM полную матрицу оценок размера N×N и другие промежуточные результаты, а затем читает их обратно. Объём такого обмена растёт квадратично с длиной контекста, поэтому время передачи данных начинает превышать время вычислений.
  id: 001-inference-vs-training-2
  fingerprint: 9ba650f9
