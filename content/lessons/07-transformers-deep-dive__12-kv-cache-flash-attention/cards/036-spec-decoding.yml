- concept: спекулятивное декодирование принимает только непрерывный префикс черновика до первого расхождения
  question: Расположите этапы спекулятивного декодирования с жадным выбором токенов в правильном порядке.
  explanation: После первого расхождения меняется префикс, от которого зависят следующие предсказания, поэтому более поздние токены черновика уже нельзя считать проверенными. За один проход большой модели при этом удаётся принять сразу несколько токенов.
  kind: order
  items:
    - Черновая модель последовательно предлагает блок токенов.
    - Проверяющая модель параллельно оценивает все позиции предложенного блока.
    - Находится первая позиция, где выбор проверяющей модели расходится с черновиком.
    - Совпавший префикс принимается, на позиции расхождения используется токен проверяющей модели, а оставшийся черновой хвост отбрасывается.
  id: 036-spec-decoding-1
  fingerprint: 495720be
- concept: выигрыш спекулятивного декодирования определяется числом принятых токенов на дорогой проход с учётом стоимости черновика
  question: Какой показатель лучше всего отражает практическую эффективность конфигурации спекулятивного декодирования?
  explanation: 'Длинный черновик сам по себе не гарантирует ускорения: если проверяющая модель часто отклоняет его в начале, большая часть работы пропадает. Выигрыш растёт, когда дешёвый черновик строится быстро, а проверяющая модель обычно принимает длинный префикс — в материале для кода и прозы типично принимаются 3–5 токенов.'
  kind: choice
  options:
    - Среднее число полезных принятых токенов на дорогой проход с учётом времени построения черновика
    - Максимальная длина чернового блока независимо от частоты отклонений
    - Число параметров проверяющей модели без учёта принятия черновика
    - Доля черновых токенов, принятых принудительно без проверки
  correct: 0
