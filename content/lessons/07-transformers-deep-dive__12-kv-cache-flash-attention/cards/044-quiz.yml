- concept: continuous batching поддерживает загрузку батча, заменяя завершённые последовательности новыми запросами
  question: Одна последовательность в serving-батче завершилась, пока остальные продолжают генерировать токены. Как поступает планировщик при continuous batching?
  explanation: При continuous batching завершённые последовательности покидают батч, а освободившиеся места занимают новые запросы. GPU не приходится ждать, пока завершится самая длинная последовательность.
  kind: choice
  options:
    - Ждёт завершения всех последовательностей и только затем формирует новый батч
    - Удаляет завершённую последовательность и может сразу добавить на её место новый запрос
    - Перезапускает весь батч с сохранёнными случайными состояниями
    - Дополняет завершённую последовательность фиктивными токенами до длины самой длинной
  correct: 1
  id: 044-quiz-1
  fingerprint: 74caf7df
- concept: PagedAttention уменьшает фрагментацию памяти, размещая KV-кэш в блоках фиксированного размера через таблицу страниц
  question: Объясни своими словами, как PagedAttention позволяет хранить растущий KV-кэш без требования выделять для каждой последовательности один непрерывный участок памяти.
  explanation: Блочное размещение отделяет логический порядок токенов от физического расположения их KV-данных. Это уменьшает внешнюю фрагментацию и потери памяти из-за преждевременного резервирования.
  kind: open
  reference: KV-кэш делится на блоки фиксированного размера, которые могут находиться в разных участках памяти. Таблица страниц сопоставляет логические блоки последовательности с физическими, поэтому кэш можно наращивать отдельными блоками и не резервировать большой непрерывный диапазон заранее.
  id: 044-quiz-2
  fingerprint: c1d8d49b
