- concept: редкая и однозначная ожидаемая строка снижает риск случайного совпадения подстроки
  question: Какую строку лучше выбрать в качестве expected для автоматической оценки ответа в NIAH-тесте?
  explanation: Уникальный идентификатор маловероятно встретится в нерелевантном ответе. Частые и короткие слова могут дать случайное совпадение и завысить результат теста.
  kind: choice
  options:
    - Короткое слово «да»
    - Распространённое слово «код»
    - Уникальный идентификатор «QZETA-XR»
  correct: 2
