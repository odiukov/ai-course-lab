- concept: лимит генерации ответа не должен сокращать проверяемый длинный контекст
  question: Объясни своими словами, почему в NIAH-оценке нужно ограничивать длину продолжения модели, а не обрезать haystack до того же лимита.
  explanation: 'Параметр max_tokens ограничивает генерируемый ответ. Если вместо этого сократить входной контекст, измеряться будет уже другая задача: иголка может исчезнуть ещё до обращения к модели.'
  kind: open
  reference: Лимит продолжения удерживает ответ коротким и удобным для проверки, сохраняя весь длинный контекст, в котором модель должна найти иголку. Обрезка haystack меняет сам тест и может удалить проверяемый факт.
