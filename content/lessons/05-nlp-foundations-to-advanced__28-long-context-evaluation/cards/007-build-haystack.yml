- concept: иголка длиннее целевого размера не обрезается и сама определяет длину результата
  question: Целевой размер стога равен 29 токенам, а иголка после токенизации занимает 43 токена. Длина тела ограничивается снизу пустым списком, а иголка не обрезается. Сколько токенов будет в результате?
  explanation: Для наполнителя не остаётся места, поэтому тело стога будет пустым. В результат целиком попадут все 43 токена иголки, и целевой размер 29 токенов окажется превышен.
