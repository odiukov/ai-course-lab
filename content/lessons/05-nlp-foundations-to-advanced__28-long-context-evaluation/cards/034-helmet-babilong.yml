- concept: HELMET проверяет избирательное внимание среди конкурирующих документов
  question: В длинный контекст объединили множество документов с похожими именами и показателями, а вопрос относится только к одному источнику. Какую способность модели такой тест проверяет напрямую?
  explanation: 'Так устроен HELMET: конкурирующие документы создают помехи, а модель должна удержать в фокусе нужный источник. Успех показывает избирательное внимание, но сам по себе не доказывает многошаговое рассуждение.'
  kind: choice
  options:
    - Выделять релевантный документ и не смешивать его с похожими источниками
    - Находить факт при полном отсутствии общих слов между фактом и вопросом
    - Разрешать кореференцию на протяжении длинного диалога
    - Выполнять цепочку логических выводов по распределённым фактам
  correct: 0
  id: 034-helmet-babilong-1
  fingerprint: f0119e52
- concept: BABILong проверяет рассуждение по цепочке фактов, спрятанной среди нерелевантного текста
  question: Какой дизайн бенчмарка лучше всего проверит reasoning-in-a-haystack, а не только поиск подходящего фрагмента?
  explanation: BABILong помещает задачи bAbI с цепочками зависимых фактов внутрь длинного нерелевантного контекста. Для ответа модели нужно не только обнаружить сведения, но и выполнить вывод, сохранив правильный порядок связей.
  kind: choice
  options:
    - Вставить один явно сформулированный факт в текст-наполнитель и попросить его повторить
    - Спрятать связанную цепочку фактов среди постороннего текста и задать вопрос, требующий пройти всю цепочку
    - Объединить документы и задать вопрос, ответ на который дословно содержится в одном из них
    - Проверить, принимает ли модель запрос максимальной заявленной длины
  correct: 1
  id: 034-helmet-babilong-2
  fingerprint: bae15358
