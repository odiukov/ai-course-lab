- concept: рассуждение по разрозненным фактам требует проверять связи и не подменять причинность совпадением
  question: В нескольких частях длинного контекста сокращение персонала и сбои упоминаются рядом по времени. Что необходимо сделать, прежде чем заключить, что сокращение стало причиной сбоев?
  explanation: Совпадение событий по времени ещё не устанавливает причинную связь. Рассуждение требует связать разнесённые свидетельства, проверить последовательность событий и исключить правдоподобные альтернативные причины.
  kind: choice
  options:
    - Найти первое упоминание сбоя и процитировать его
    - Подсчитать общее количество упоминаний сокращений
    - Сопоставить хронологию и условия событий, а также проверить альтернативные объяснения
    - Выбрать документ с самым подробным описанием
