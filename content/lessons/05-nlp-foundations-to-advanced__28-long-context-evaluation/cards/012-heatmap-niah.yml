- concept: одинаковая средняя успешность NIAH не гарантирует одинакового распределения ошибок по длинам и глубинам
  question: Две модели показали одинаковую долю успешных прогонов NIAH, но провалились в разных клетках heatmap. Какой вывод корректен?
  explanation: Среднее сворачивает всю сетку в одно значение и скрывает, при каких сочетаниях длины и глубины возникают ошибки. Сравнение соответствующих клеток сохраняет позиционный профиль надёжности каждой модели.
  kind: choice
  options:
    - Модели эквивалентны, потому что их средние результаты совпадают
    - Профили надёжности моделей различаются, поэтому их нужно сравнивать по соответствующим клеткам
    - Различия между клетками можно игнорировать, если большая часть heatmap зелёная
    - Лучшей следует считать модель с более яркими успешными клетками независимо от легенды
  correct: 1
  id: 012-heatmap-niah-1
  fingerprint: bf16db1b
- concept: при повторных прогонах цвет клетки heatmap может кодировать эмпирическую долю успехов
  question: Для каждой комбинации длины контекста и глубины вставки NIAH-тест повторили несколько раз. Согласно легенде, промежуточный цвет клетки соответствует доле успешных прогонов. Что означает такой цвет?
  explanation: При нескольких повторах значение клетки можно агрегировать как число успехов, делённое на число прогонов. Промежуточный оттенок тогда описывает частоту успеха, а не степень полноты одного ответа или уверенность модели.
  kind: choice
  options:
    - Модель извлекла только часть спрятанного факта
    - Модель была успешна в некоторой доле повторов для этой комбинации параметров
    - Модель уверена в ответе лишь частично
    - Иголка была вставлена между двумя соседними глубинами
  correct: 1
  id: 012-heatmap-niah-2
  fingerprint: a359c979
