- concept: успех в NoLiMa не подтверждает способность к длинному многошаговому рассуждению
  question: 'Модель успешно решает NoLiMa-задачи: находит косвенно описанный факт без общих слов с вопросом и выводит ответ. Почему этого недостаточно, чтобы считать модель надёжной в многошаговых задачах?'
  explanation: NoLiMa усложняет retrieval отсутствием лексической подсказки, но обычно не требует длинной цепочки рассуждений. Модель может хорошо строить короткий смысловой мост и при этом терять промежуточные связи в multi-hop-задаче.
  kind: open
  reference: NoLiMa проверяет семантическое сопоставление и короткий смысловой переход. Многошаговая задача требует последовательно найти, удержать и связать цепочку зависимых фактов, поэтому эту способность нужно оценивать отдельно.
  id: 033-nolima-2
  fingerprint: 5f82f42f
