- concept: multi-value retrieval требует извлечь несколько значений, связанных с одним ключом
  question: Определи подтип retrieval в RULER.
  explanation: В multi-value retrieval искомый ключ один, но связанных с ним значений несколько. Это отличается от multi-key retrieval, где запрос охватывает несколько разных ключей.
  kind: cloze
  template: Если в контексте одному ключу соответствуют несколько значений и запрос требует вернуть их все, это ___ retrieval.
  answer: multi-value
