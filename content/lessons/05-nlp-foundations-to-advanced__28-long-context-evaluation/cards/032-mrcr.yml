- concept: изменение числа needles при фиксированной длине контекста отделяет нагрузку на связи от влияния объёма текста
  question: Объясни своими словами, что показывает резкое падение результата MRCR при увеличении числа связанных фактов, если общая длина диалога остаётся неизменной.
  explanation: Сравнение вариантов MRCR с 8, 24 и 100 needles при контролируемой длине помогает выявить предел связности. Модель может помнить отдельные имена и события, но неверно сопоставлять их друг с другом.
  kind: open
  reference: 'Такое падение указывает на ограничение способности модели одновременно удерживать раздельные связи между участниками, объектами и упоминаниями. Причину нельзя свести только к длине входа: при том же объёме текста модель начинает смешивать большее число конкурирующих связок.'
