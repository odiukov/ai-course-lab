- concept: регрессионный отчёт должен показывать отдельные изменения retrieval-effective и reasoning-effective length
  question: Почему при сравнении версий модели нельзя ограничиваться одним усреднённым показателем long-context качества?
  explanation: Регрессионный контракт относится к конкретным способностям модели. Отдельные дельты показывают, какой навык изменился и на какой длине перестало выполняться прежнее требование.
  kind: open
  reference: 'Среднее может скрыть разнонаправленные изменения навыков: извлечение фактов способно сохраниться или улучшиться, пока многошаговое рассуждение ухудшается. Поэтому изменения effective length нужно показывать отдельно для retrieval и reasoning.'
