- concept: pass rate агрегирует результаты всех отдельных испытаний без выбора лучшей попытки
  question: Расположите действия в правильном порядке для оценки pass rate модели при заданном условии.
  explanation: Каждый прогон считается самостоятельным испытанием. В итоговую долю входят и успехи, и неудачи; выбор только лучшего ответа завысил бы оценку.
  kind: order
  items:
    - Зафиксировать параметры проверяемого условия
    - Выполнить серию отдельных прогонов
    - Записать бинарный результат каждого прогона
    - Разделить число успешных прогонов на общее число прогонов
