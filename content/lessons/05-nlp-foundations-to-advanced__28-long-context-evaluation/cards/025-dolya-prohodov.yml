- concept: увеличение числа независимых повторов снижает случайную нестабильность оценки pass rate
  question: Почему одинаковой наблюдаемой pass rate обычно больше доверяют, если она получена на большем числе независимых прогонов?
  explanation: 'Малое число повторов даёт шумную оценку: отдельный исход заметно сдвигает долю успехов. Большее число независимых испытаний уменьшает такую чувствительность.'
  kind: open
  reference: В большой выборке результат одного дополнительного успеха или провала слабее изменяет итоговую долю, поэтому оценка меньше зависит от случайности конкретных испытаний. При этом pass rate остаётся оценкой устойчивости, а не гарантией результата следующего прогона.
