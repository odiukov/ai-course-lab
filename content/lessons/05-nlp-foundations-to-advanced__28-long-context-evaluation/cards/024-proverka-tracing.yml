- concept: одинаковая итоговая точность на задачах разной структуры не доказывает одинаковую способность модели
  question: Почему одинаковая доля правильных ответов в извлечении готового факта и в вычислении по цепочке присваиваний не означает, что модель одинаково хорошо справляется с обеими задачами?
  explanation: Процент правильных ответов интерпретируется вместе со структурой задания. Совпадение метрик не делает поиск готового факта и многошаговое получение нового значения одним навыком.
  kind: open
  reference: 'Задачи требуют разных операций: извлечение проверяет поиск готового ответа, а вычисление по цепочке дополнительно требует найти несколько связанных строк, восстановить порядок зависимостей и применить преобразования. Поэтому одинаковая итоговая точность может скрывать разные ограничения модели.'
