- concept: стоимость длинного запроса определяется всем переданным контекстом, а не только полезным фрагментом
  question: Почему модель с высокой точностью может оказаться экономически непригодной, если в каждом запросе ей передают большой архив документов?
  explanation: Модель должна обработать весь входной контекст до генерации ответа. Если полезна лишь малая часть архива, продукт всё равно несёт затраты на обработку всех переданных токенов.
  kind: open
  reference: Обработка входа оплачивается для всего переданного контекста, даже если для ответа нужна лишь небольшая его часть. Поэтому высокая точность не гарантирует приемлемую стоимость одного запроса.
  id: 037-latency-cost-2
