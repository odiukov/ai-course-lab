- concept: один прогон NIAH оценивается по наличию заранее заданного ожидаемого факта в ответе
  question: 'Ожидаемый факт — «ЛИПА-X». Модель ответила: «Подтверждён код липа-x». Как следует оценить этот прогон при регистронезависимой проверке?'
  explanation: Функция score_niah приводит ожидаемый факт и ответ к нижнему регистру, а затем проверяет вхождение строки. Поэтому такой прогон получает единицу. Это результат одной попытки, а не доказательство стабильной работы модели.
  kind: choice
  options:
    - 'Как успех: ожидаемый факт присутствует в ответе'
    - 'Как неудачу: регистр букв не совпадает'
    - Оставить без оценки, пока модель не перескажет контекст
    - Оценить по длине и стилю ответа
  correct: 0
  id: 008-binarniy-score-1
  fingerprint: 7490c477
- concept: проверка подстроки может ошибочно засчитать отрицание ожидаемого факта как успех
  question: Почему простой NIAH-скорер может ошибочно признать ответ «Искомый ключ точно не РУБИН-Q» успешным, если ожидаемый факт — «РУБИН-Q»?
  explanation: Условие expected.lower() in answer.lower() обнаруживает буквальное совпадение, но не анализирует утверждение целиком. Короткий уникальный факт и однозначный вопрос уменьшают риск таких ложноположительных результатов.
  kind: open
  reference: Скорер проверяет только наличие ожидаемой строки и не понимает смысл отрицания. Подстрока «РУБИН-Q» присутствует, поэтому формальная проверка засчитает успех, хотя ответ по смыслу неверен.
  id: 008-binarniy-score-2
  fingerprint: e29d3ec5
