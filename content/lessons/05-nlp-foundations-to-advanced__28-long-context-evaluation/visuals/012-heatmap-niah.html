<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Как читать NIAH-карточку модели</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f6f2;
      --panel: #ffffff;
      --panel-soft: #f0f2ed;
      --ink: #202620;
      --muted: #626b63;
      --grid: #ffffff;
      --axis: #879188;
      --accent: #1768a8;
      --accent-soft: #e7f2fb;
      --tone-0: #ead8d5;
      --tone-1: #d9dfc4;
      --tone-2: #b8d29d;
      --tone-3: #82bb72;
      --tone-4: #398652;
      --selected-ink: #123f66;
      --error: #a02f2f;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #171b18;
        --panel: #202621;
        --panel-soft: #293029;
        --ink: #edf3ed;
        --muted: #b2bdb4;
        --grid: #202621;
        --axis: #7e8b81;
        --accent: #73b9ec;
        --accent-soft: #253a49;
        --tone-0: #553b3b;
        --tone-1: #4e5540;
        --tone-2: #526f47;
        --tone-3: #4d8b50;
        --tone-4: #3ca061;
        --selected-ink: #d9efff;
        --error: #ffaaaa;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .figure {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 16px 8px;
      background: var(--page);
    }

    .heading {
      margin: 0;
      font-size: 23px;
      line-height: 1.2;
      font-weight: 750;
      letter-spacing: -0.01em;
    }

    .subheading {
      margin: 5px 0 8px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }

    #drawing {
      width: 100%;
      height: auto;
      max-height: 450px;
      display: block;
      background: var(--panel);
    }

    .canvas-bg {
      fill: var(--panel);
    }

    .heat-cell {
      stroke: var(--grid);
      stroke-width: 3px;
      shape-rendering: geometricPrecision;
    }

    .tone-0 {
      fill: var(--tone-0);
    }

    .tone-1 {
      fill: var(--tone-1);
    }

    .tone-2 {
      fill: var(--tone-2);
    }

    .tone-3 {
      fill: var(--tone-3);
    }

    .tone-4 {
      fill: var(--tone-4);
    }

    .axis-line,
    .guide-line {
      fill: none;
      stroke: var(--axis);
      stroke-width: 1.5px;
    }

    .connector {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2.5px;
    }

    .selection {
      fill: none;
      stroke: var(--accent);
      stroke-width: 4px;
    }

    .panel {
      fill: var(--accent-soft);
      stroke: var(--accent);
      stroke-width: 2px;
    }

    .axis-label {
      fill: var(--ink);
      font-size: 16px;
      font-weight: 650;
    }

    .axis-title {
      fill: var(--muted);
      font-size: 15px;
      font-weight: 700;
    }

    .minor-label {
      fill: var(--muted);
      font-size: 14px;
    }

    .cell-label {
      fill: var(--selected-ink);
      font-size: 17px;
      font-weight: 800;
    }

    .panel-title {
      fill: var(--accent);
      font-size: 18px;
      font-weight: 800;
    }

    .panel-copy {
      fill: var(--ink);
      font-size: 16px;
    }

    .panel-strong {
      fill: var(--ink);
      font-size: 18px;
      font-weight: 800;
    }

    .legend-title {
      fill: var(--ink);
      font-size: 15px;
      font-weight: 750;
    }

    .legend-copy {
      fill: var(--muted);
      font-size: 14px;
    }

    .fallback {
      padding: 24px;
      color: var(--error);
      background: var(--panel);
      font-size: 16px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="figure" aria-labelledby="figure-title">
    <h1 class="heading" id="figure-title">Как читать NIAH-карточку модели</h1>
    <p class="subheading">Сначала выбери длину и глубину, затем прочитай цвет клетки на их пересечении.</p>
    <svg
      id="drawing"
      viewBox="0 0 1200 450"
      width="1200"
      height="450"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-label="Тепловая карта пять на четыре: глубина вставки по вертикали, длина контекста по горизонтали, цвет показывает долю успешных извлечений"
    ></svg>
  </main>

  <script>
    (() => {
      "use strict";

      const data = Object.freeze([
        Object.freeze({
          canvas: Object.freeze({ left: 0, top: 0, right: 1200, bottom: 450 }),
          origin: Object.freeze({ x: 0, y: 0 }),
          scale: Object.freeze({ x: 1, y: 1 }),
          gridFrame: Object.freeze({ left: 218, top: 88, right: 722, bottom: 338 }),
          horizontalAxis: Object.freeze({ x1: 218, y1: 344, x2: 722, y2: 344 }),
          verticalAxis: Object.freeze({ x1: 210, y1: 88, x2: 210, y2: 338 }),
          depthTitle: Object.freeze({ x: 32, y: 49 }),
          lengthTitle: Object.freeze({ x: 470, y: 366 }),
          addressGuide: Object.freeze({
            x1: 596, y1: 263,
            x2: 758, y2: 263,
            x3: 790, y3: 250
          }),
          selection: Object.freeze({ left: 470, top: 238, right: 596, bottom: 288 }),
          panel: Object.freeze({ left: 790, top: 112, right: 1155, bottom: 334 }),
          panelRule: Object.freeze({ x1: 825, y1: 244, x2: 1120, y2: 244 }),
          legendTitle: Object.freeze({ x: 218, y: 384 }),
          legendLow: Object.freeze({ x: 218, y: 428 }),
          legendHigh: Object.freeze({ x: 390, y: 428 }),
          legendNoteTop: Object.freeze({ x: 520, y: 399 }),
          legendNoteBottom: Object.freeze({ x: 520, y: 423 })
        }),
        Object.freeze({
          columns: Object.freeze([
            Object.freeze({ label: "1k", x: 281, y: 67 }),
            Object.freeze({ label: "4k", x: 407, y: 67 }),
            Object.freeze({ label: "16k", x: 533, y: 67 }),
            Object.freeze({ label: "64k", x: 659, y: 67 })
          ]),
          rows: Object.freeze([
            Object.freeze({ label: "0", x: 184, y: 113 }),
            Object.freeze({ label: "0,25", x: 184, y: 163 }),
            Object.freeze({ label: "0,5", x: 184, y: 213 }),
            Object.freeze({ label: "0,75", x: 184, y: 263 }),
            Object.freeze({ label: "1,0", x: 184, y: 313 })
          ])
        }),
        Object.freeze([
          Object.freeze({ left: 218, top: 88, right: 344, bottom: 138, tone: "tone-4" }),
          Object.freeze({ left: 344, top: 88, right: 470, bottom: 138, tone: "tone-4" }),
          Object.freeze({ left: 470, top: 88, right: 596, bottom: 138, tone: "tone-3" }),
          Object.freeze({ left: 596, top: 88, right: 722, bottom: 138, tone: "tone-2" }),

          Object.freeze({ left: 218, top: 138, right: 344, bottom: 188, tone: "tone-4" }),
          Object.freeze({ left: 344, top: 138, right: 470, bottom: 188, tone: "tone-3" }),
          Object.freeze({ left: 470, top: 138, right: 596, bottom: 188, tone: "tone-4" }),
          Object.freeze({ left: 596, top: 138, right: 722, bottom: 188, tone: "tone-1" }),

          Object.freeze({ left: 218, top: 188, right: 344, bottom: 238, tone: "tone-4" }),
          Object.freeze({ left: 344, top: 188, right: 470, bottom: 238, tone: "tone-4" }),
          Object.freeze({ left: 470, top: 188, right: 596, bottom: 238, tone: "tone-3" }),
          Object.freeze({ left: 596, top: 188, right: 722, bottom: 238, tone: "tone-2" }),

          Object.freeze({ left: 218, top: 238, right: 344, bottom: 288, tone: "tone-3" }),
          Object.freeze({ left: 344, top: 238, right: 470, bottom: 288, tone: "tone-4" }),
          Object.freeze({
            left: 470, top: 238, right: 596, bottom: 288,
            tone: "tone-3", selected: true, label: "15/20",
            labelX: 533, labelY: 263
          }),
          Object.freeze({ left: 596, top: 238, right: 722, bottom: 288, tone: "tone-1" }),

          Object.freeze({ left: 218, top: 288, right: 344, bottom: 338, tone: "tone-4" }),
          Object.freeze({ left: 344, top: 288, right: 470, bottom: 338, tone: "tone-3" }),
          Object.freeze({ left: 470, top: 288, right: 596, bottom: 338, tone: "tone-2" }),
          Object.freeze({ left: 596, top: 288, right: 722, bottom: 338, tone: "tone-0" })
        ]),
        Object.freeze([
          Object.freeze({ left: 218, top: 394, right: 252, bottom: 412, tone: "tone-0" }),
          Object.freeze({ left: 252, top: 394, right: 286, bottom: 412, tone: "tone-1" }),
          Object.freeze({ left: 286, top: 394, right: 320, bottom: 412, tone: "tone-2" }),
          Object.freeze({ left: 320, top: 394, right: 354, bottom: 412, tone: "tone-3" }),
          Object.freeze({ left: 354, top: 394, right: 388, bottom: 412, tone: "tone-4" })
        ]),
        Object.freeze({
          panelText: Object.freeze([
            Object.freeze({ value: "Читаем по адресу", x: 825, y: 145, className: "panel-title" }),
            Object.freeze({ value: "длина: 16k", x: 825, y: 188, className: "panel-copy" }),
            Object.freeze({ value: "глубина: 0,75", x: 825, y: 220, className: "panel-copy" }),
            Object.freeze({ value: "15 из 20", x: 825, y: 278, className: "panel-strong" }),
            Object.freeze({ value: "успешных извлечений", x: 825, y: 309, className: "panel-copy" })
          ])
        })
      ]);

      const [layout, axes, cells, legendCells, annotations] = data;
      const origin = Object.freeze(layout.origin);
      const scale = Object.freeze(layout.scale);
      const sx = x => origin.x + x * scale.x;
      const sy = y => origin.y + y * scale.y;

      const svg = document.getElementById("drawing");
      const ns = "http://www.w3.org/2000/svg";

      const node = (name, attributes, textValue) => {
        const element = document.createElementNS(ns, name);
        Object.entries(attributes).forEach(([key, value]) => {
          element.setAttribute(key, String(value));
        });
        if (textValue !== undefined) {
          element.textContent = textValue;
        }
        return element;
      };

      const rectangle = (bounds, className) => node("rect", {
        x: sx(bounds.left),
        y: sy(bounds.top),
        width: sx(bounds.right) - sx(bounds.left),
        height: sy(bounds.bottom) - sy(bounds.top),
        class: className
      });

      const segment = (lineData, className) => node("line", {
        x1: sx(lineData.x1),
        y1: sy(lineData.y1),
        x2: sx(lineData.x2),
        y2: sy(lineData.y2),
        class: className
      });

      const label = (item, className, anchor = "start") => node("text", {
        x: sx(item.x),
        y: sy(item.y),
        class: className,
        "text-anchor": anchor,
        "dominant-baseline": "middle"
      }, item.value ?? item.label);

      try {
        svg.replaceChildren();
        svg.append(rectangle(layout.canvas, "canvas-bg"));

        svg.append(segment(layout.horizontalAxis, "axis-line"));
        svg.append(segment(layout.verticalAxis, "axis-line"));

        axes.columns.forEach(item => {
          svg.append(label(item, "axis-label", "middle"));
        });

        axes.rows.forEach(item => {
          svg.append(label(item, "axis-label", "end"));
        });

        svg.append(label(
          { value: "Глубина вставки", x: layout.depthTitle.x, y: layout.depthTitle.y },
          "axis-title",
          "start"
        ));

        svg.append(label(
          { value: "Длина контекста", x: layout.lengthTitle.x, y: layout.lengthTitle.y },
          "axis-title",
          "middle"
        ));

        cells.forEach(cell => {
          svg.append(rectangle(cell, `heat-cell ${cell.tone}`));
        });

        const guide = node("polyline", {
          points: [
            `${sx(layout.addressGuide.x1)},${sy(layout.addressGuide.y1)}`,
            `${sx(layout.addressGuide.x2)},${sy(layout.addressGuide.y2)}`,
            `${sx(layout.addressGuide.x3)},${sy(layout.addressGuide.y3)}`
          ].join(" "),
          class: "connector"
        });
        svg.append(guide);

        svg.append(rectangle(layout.selection, "selection"));
        svg.append(rectangle(layout.panel, "panel"));
        svg.append(segment(layout.panelRule, "guide-line"));

        cells.filter(cell => cell.selected).forEach(cell => {
          svg.append(label(
            { value: cell.label, x: cell.labelX, y: cell.labelY },
            "cell-label",
            "middle"
          ));
        });

        annotations.panelText.forEach(item => {
          svg.append(label(item, item.className, "start"));
        });

        svg.append(label(
          {
            value: "Доля успешных извлечений",
            x: layout.legendTitle.x,
            y: layout.legendTitle.y
          },
          "legend-title",
          "start"
        ));

        legendCells.forEach(cell => {
          svg.append(rectangle(cell, `heat-cell ${cell.tone}`));
        });

        svg.append(label(
          { value: "меньше успехов", x: layout.legendLow.x, y: layout.legendLow.y },
          "legend-copy",
          "start"
        ));

        svg.append(label(
          { value: "больше успехов", x: layout.legendHigh.x, y: layout.legendHigh.y },
          "legend-copy",
          "end"
        ));

        svg.append(label(
          {
            value: "Промежуточный оттенок — доля успехов в повторах,",
            x: layout.legendNoteTop.x,
            y: layout.legendNoteTop.y
          },
          "legend-copy",
          "start"
        ));

        svg.append(label(
          {
            value: "а не «почти найденная» иголка.",
            x: layout.legendNoteBottom.x,
            y: layout.legendNoteBottom.y
          },
          "legend-copy",
          "start"
        ));
      } catch (error) {
        const fallback = document.createElement("div");
        fallback.className = "fallback";
        fallback.textContent =
          "Схема должна была показать NIAH-карточку: длины 1k, 4k, 16k и 64k по горизонтали, глубины 0, 0,25, 0,5, 0,75 и 1,0 по вертикали, а цвет клетки — долю успешных извлечений.";
        svg.replaceWith(fallback);
      }
    })();
  </script>
</body>
</html>
