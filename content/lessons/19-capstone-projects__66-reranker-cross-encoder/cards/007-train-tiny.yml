- concept: корректный порядок операций в эпохе обучения PyTorch
  question: Расположите операции одной эпохи обучения в правильном порядке.
  explanation: Градиенты очищают до нового прямого прохода, затем вычисляют ошибку и её производные. Оптимизатор обновляет параметры только после backward, а в историю сохраняют обычное число через loss.item().
  kind: order
  items:
    - Обнулить накопленные градиенты оптимизатора
    - Выполнить прямой проход модели
    - Вычислить функцию потерь
    - Выполнить обратное распространение ошибки
    - Обновить параметры модели оптимизатором
    - Добавить числовое значение loss в историю
