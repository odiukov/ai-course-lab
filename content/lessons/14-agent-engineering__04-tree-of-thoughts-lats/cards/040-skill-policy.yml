- concept: древесный поиск требует оценки частичных состояний; если оценивается только законченный кандидат, ветвление не даёт направления и уместен популяционный поиск
  question: 'Есть задача оптимизации: качество кандидата измеряется машинно и честно, но только у полностью собранного решения — недописанный вариант не запускается и балла не имеет. Бюджет — часы. Что это говорит о выборе между древесным поиском (ToT/LATS) и эволюционным поиском?'
  explanation: 'Узел дерева — частичное состояние, и весь выигрыш ToT/LATS в том, что перед раскрытием узлы ранжируются. Если частичное состояние не оценивается, спуск идёт вслепую и дерево вырождается в перебор. Эволюция работает с популяцией целых кандидатов и требует ровно того, что здесь есть: машинной скалярной метрики на законченном решении плюс часового бюджета.'
  kind: choice
  options:
