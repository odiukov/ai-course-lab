- concept: 'бинарной корректности недостаточно для отбора: эволюции нужна скалярная метрика качества, ранжирующая уже корректных кандидатов'
  question: Функция пригодности прогоняет кандидата на тестах и возвращает только «прошёл / не прошёл». За 40 поколений корректные решения находятся тысячами, но лучше первого найденного ничего не появляется. В чём дефект функции пригодности?
  explanation: 'Машинная проверка должна давать две вещи: валидность и сравнимую метрику качества. Корректность отсекает брак, но давление отбора создаёт именно скаляр — например число умножений. Без него все корректные кандидаты равны, и выбор среди них случаен.'
  kind: choice
  options:
    - Тестов слишком мало — нужно расширить набор тестов
    - Она не ранжирует корректных кандидатов между собой, поэтому у отбора нет направления после достижения корректности
    - 'Она слишком дорогая: прогон кода тратит бюджет, который нужен на мутации'
    - Она детерминирована, а эволюции нужен стохастический сигнал
  correct: 1
