- concept: проверяемый предикат не требует эталонного ответа, поэтому поиск способен выдать результат лучше любого известного человеку
  question: Оценщик в задачах поиска обычно сравнивает ответ модели с известным правильным ответом. Объясни, почему прогон программы как функции пригодности позволяет поиску найти результат, которого не знал никто — включая авторов системы.
  explanation: Ключ — разница между «сверить с ответом» и «проверить свойство». Первое ограничивает поиск известным, второе — нет. Именно поэтому машинно-проверяемая пригодность даёт фронтирные результаты, а не только надёжность.
  kind: open
  reference: 'Прогон проверяет не совпадение с эталоном, а выполнение предиката: перемножает ли программа матрицы верно на настоящих числах и сколько операций тратит. Для такой проверки эталонное решение не нужно — нужна только формализованная спецификация корректности и измеримая стоимость. Поэтому оценщик способен признать кандидата, который лучше всего известного: он не ограничен сверху тем, что заложили люди. Оценщик-модель или сверка с эталоном такого не умеют — они могут лишь воспроизвести уже известное. Отсюда результат AlphaEvolve: 48 умножений для матриц 4×4 против человеческого рекорда 49, державшегося с 1969 года.'
  id: 039-alphaevolve-3
  fingerprint: 98c4d8fa
