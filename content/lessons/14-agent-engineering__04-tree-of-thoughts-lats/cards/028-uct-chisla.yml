- concept: существует пороговое значение c, при котором две ветки с разными Q и разной частотой посещений сравниваются в UCT ровно поровну
  question: В узле два хода. У A средняя оценка 0.9 при 64 посещениях, у B оценка 0.6 при 4 посещениях. Через узел прошло 400 посещений. При каком значении константы исследования c оба хода получают одинаковый суммарный UCT-балл?
  explanation: 'ln 400 ≈ 5.99. Добавка B: sqrt(5.99/4) ≈ 1.22, добавка A: sqrt(5.99/64) ≈ 0.31, разница ≈ 0.92. Разрыв по Q равен 0.3, значит c* = 0.3/0.92 ≈ 0.33. Ниже порога выигрывает проверенный ход, выше — редкий. Порог зависит от счётчиков, поэтому одно значение c не даёт одинакового режима во всех узлах дерева.'
  kind: numeric
  answer: 0.33
  tolerance: 0.03
  id: 028-uct-chisla-1
  fingerprint: 97cc3fed
- concept: логарифм в числителе делает член исследования почти нечувствительным к росту общего счётчика посещений
  question: Общее число посещений родителя выросло с 500 до 5000, а посещения конкретного ребёнка не изменились. Как изменится член исследования у этого ребёнка?
  explanation: 'ln 500 ≈ 6.21, ln 5000 ≈ 8.52. Под корнем отношение 1.37, после корня ≈ 1.17. Логарифм гасит рост общего счётчика: сколько бы поиск ни работал, сам по себе он почти не раздувает тягу к исследованию. Расти добавке даёт только то, что соседние ветки забирают посещения, а эта — нет.'
  kind: choice
  options:
    - Вырастет примерно на 17%
    - Вырастет в 10 раз — пропорционально общему счётчику
    - Вырастет примерно в 3.2 раза
    - 'Не изменится: член исследования зависит только от посещений самого ребёнка'
  correct: 0
