- concept: 'член исследования асимметричен по двум счётчикам: собственные посещения входят линейно в знаменатель, чужие — под логарифм, поэтому ветка гасит свой бонус быстрее, чем дерево его наращивает'
  question: В UCT родительский счётчик стоит под логарифмом, а собственный счётчик ветки — линейно в знаменателе. Объясни, к чему приводит эта асимметрия при выборе ветки.
  explanation: 'Внутри корня стоят два разных по силе канала: ln N(s) растёт крайне медленно, а N(s,a) — линейно. Поэтому бонус ветки в первую очередь управляется её собственной статистикой, а общий счётчик задаёт лишь медленно поднимающийся фон.'
  kind: open
  reference: 'Собственные посещения обесценивают бонус гораздо быстрее, чем чужие его повышают. Девятикратный рост посещений самой ветки делит её добавку на 3, а девятикратный рост общего счётчика при неизменном собственном поднимает добавку лишь на несколько десятков процентов, потому что сначала берётся логарифм. Практический эффект: одно посещение резко сбивает притягательность ветки и поиск не залипает на ней, а возврат к отвергнутой ветке происходит медленно и только за счёт накопления посещений у соседей.'
  id: 028-uct-chisla-3
  fingerprint: 9875d025
