- concept: 'прирост качества ToT даёт наличие оценки узлов, а не более богатая генерация мыслей: без оценщика поиск вырождается в неинформированный полный перебор'
  question: 'Из работающей системы ToT убрали вызов оценщика: генератор мыслей, структура дерева и операция раскрытия остались прежними. Что произойдёт с поиском?'
  explanation: 'Оценщик — единственный источник сигнала о том, какой из братьев раскрывать следующим. Без него BFS/DFS обходят пространство целиком: при коэффициенте ветвления K число листьев растёт как K^глубина. Именно поэтому в статье прирост на Game of 24 (4% -> 74%) приписывают появлению оценки состояний, а не более умной генерации мыслей — генератор в CoT и ToT один и тот же.'
  kind: choice
  options:
    - 'Поиск станет неинформированным: порядок обхода перестанет зависеть от качества узлов, и он превратится в полный перебор всех ветвей, стоимость которого растёт экспоненциально с глубиной'
    - 'Поиск продолжит работать так же, просто чуть медленнее: генератор всё равно выдаёт лучших кандидатов первыми'
    - Дерево перестанет строиться — без оценки узел нельзя раскрыть
    - Поиск сведётся к обычному chain-of-thought с одной веткой
