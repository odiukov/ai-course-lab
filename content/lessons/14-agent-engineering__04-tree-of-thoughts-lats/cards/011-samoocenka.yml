- concept: оценка узла — эвристика по частичному состоянию без заглядывания в непорождённых потомков, поэтому отсечение обязано быть обратимым
  question: Оценщик в ToT судит узел до того, как у узла появились дети. Объясни своими словами, почему его вердикт — это оценка с ошибкой, и что из этого следует для устройства поиска.
  explanation: 'Это разница между эвристикой и точной оценкой. Оценщик — приближение истинной ценности узла, вычисленное по частичной информации; его шум — главный источник ошибок ToT. Практическое следствие: держать отброшенные ветки в очереди, а не выбрасывать, и не поднимать порог отсечения выше, чем позволяет качество оценщика.'
  kind: open
  reference: 'Оценщик видит только текущее состояние — что уже сделано и что осталось от задачи — и не имеет доступа к тем продолжениям, которые ещё не порождены. Это эвристическая оценка перспективности, а не вычисленный результат подпоиска: истинная ценность узла определяется лучшим листом в его поддереве, а поддерева на момент оценки не существует. Значит, низкий балл — свидетельство, а не приговор: перспективная ветка может получить низкий балл (ложноотрицательное отсечение), а тупиковая — высокий. Отсюда требование к поиску: отсечение должно быть обратимым — отсечённый узел не удаляется, а откладывается, и если приоритетные ветки исчерпались или уперлись, поиск возвращается к нему. Полностью доверять оценщику можно было бы только при точной value-функции; на шумном LLM-оценщике жёсткое необратимое отсечение теряет ответ.'
