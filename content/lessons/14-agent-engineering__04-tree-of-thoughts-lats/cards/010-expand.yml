- concept: пустой результат policy — это терминальный узел без детей, а не сбой алгоритма поиска
  question: Policy просят дать 5 продолжений для узла, а она возвращает пустой список (или пять одинаковых кандидатов, которые после дедупликации схлопываются в ноль). Как должна повести себя операция раскрытия?
  explanation: 'Отсутствие продолжений — обычный исход: узел терминальный. Поиск получает нулевую ветвь, оценивает её как тупик и на следующем шаге выбора уходит в другую часть дерева. Исключение уронило бы весь rollout из-за одного узла, повтор вызова жёг бы токены без гарантии, а клон родителя создал бы цикл из одинаковых состояний с бесконечной глубиной.'
  kind: choice
  options:
    - 'Бросить исключение: без кандидатов дерево нельзя строить дальше'
    - Вернуть пустой список детей и пометить узел раскрытым — узел просто тупиковый
    - Повторять вызов policy, пока она не вернёт хотя бы одного кандидата
    - Скопировать родителя в ребёнка без изменений, чтобы дерево не оборвалось
  correct: 1
