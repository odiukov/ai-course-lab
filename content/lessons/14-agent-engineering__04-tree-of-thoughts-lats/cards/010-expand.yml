- concept: 'связь родитель–ребёнок должна быть двусторонней: спуск выбора идёт по списку детей, ссылка вверх обслуживает обратный проход'
  question: При раскрытии узла каждому ребёнку прописали ссылку на родителя, но забыли добавить самих детей в список детей родителя. Дерево не падает, ошибок нет. Что именно сломается в работе поиска?
  explanation: 'Ссылки вверх и вниз не дублируют друг друга: вверх ходит backpropagate, вниз — select. Потеря любой из них не даёт исключения, а тихо ломает соответствующую фазу MCTS, поэтому симптом выглядит как «поиск не углубляется», а не как падение.'
  kind: open
  reference: 'Две связи обслуживают два разных обхода. Ссылка вверх нужна обратному проходу: от листа поднимаемся к корню и обновляем счётчики посещений и накопленную оценку, а также восстанавливаем путь-ответ. Список детей нужен фазе выбора: спуск от корня перебирает детей узла и берёт лучшего по UCT. Без него узел с точки зрения выбора выглядит нераскрытым листом — весь порождённый (и уже оплаченный вызовами модели) поддерев недостижим, поиск будет раскрывать один и тот же узел заново или топтаться на корне, а бюджет токенов уйдёт в никуда.'
  id: 010-expand-3
  fingerprint: a424523b
