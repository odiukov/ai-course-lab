- concept: наблюдение среды доступно только для узла, доведённого до исполнимого состояния, поэтому глубже по дереву оценка внешняя, а у ранних узлов — модельная
  question: 'Дерево поиска по коду: корень содержит две строки сигнатуры, лист — законченную функцию. Почему обратная связь среды не может оценивать все узлы дерева одинаково?'
  explanation: 'Внешний сигнал требует действия, которое действительно выполнено инструментом. У частичного узла исполнять нечего, поэтому его ценность держится на модельной самооценке со всеми её ошибками. Отсюда практический приём: строить шаги так, чтобы узел как можно раньше становился запускаемым (заглушки, частичный прогон тестов) — иначе внешняя проверка приходит слишком поздно, когда бюджет уже потрачен на неверную ветку.'
  kind: choice
  options:
    - Интерпретатор возвращает разные типы ошибок на разной глубине, и их нельзя привести к одной шкале
    - 'Незаконченный фрагмент нечего исполнять: внешний вердикт появляется только там, где траектория доведена до запускаемого состояния, а ранние узлы остаются на самооценке модели'
    - Среду вызывают только на корне, чтобы не тратить бюджет исполнения на каждый узел
    - Обратная связь среды применима ко всем узлам, просто на мелких фрагментах она менее точная
  correct: 1
