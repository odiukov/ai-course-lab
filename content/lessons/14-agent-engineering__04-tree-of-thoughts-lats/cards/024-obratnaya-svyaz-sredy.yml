- concept: 'поиск с проверками среды происходит до сдачи ответа, поэтому метрика pass@1 не нарушается: множатся внутренние попытки, а не засчитываемые'
  question: Метрика pass@1 засчитывает одну сдаваемую попытку на задачу. Агент внутри одной задачи породил и прогнал тестами 40 узлов-кандидатов, а сдал один. Объясни, почему результат всё ещё честно называется pass@1 и чем он отличается от pass@40.
  explanation: 'Ключ — где именно происходит отбор. Если выбирает бенчмарк (лучший из k сданных) — это pass@k. Если выбирает сам агент до сдачи, опираясь на тесты и функцию ценности, — это pass@1 с большим инференс-бюджетом. Именно так LATS показал 92.7% pass@1 на HumanEval: веса те же, множатся внутренние попытки.'
  kind: open
  reference: 'pass@k считает, сколько независимых сданных решений разрешено предъявить оценщику бенчмарка: при pass@40 задача засчитана, если правильным оказался хоть один из 40 сданных ответов. Поиск же тратит 40 кандидатов внутри одного прогона и сам, по наблюдениям среды и оценке узлов, выбирает единственный ответ на сдачу — правом выбора среди сорока пользуется агент, а не бенчмарк. Внешний протокол видит один ответ, поэтому метрика pass@1. Разница в стоимости, а не в метрике: pass@1 у такого агента куплен в десятки раз большим числом токенов и вызовов инструментов, и сравнивать его с pass@1 одиночной генерации корректно по качеству, но не по бюджету.'
  id: 024-obratnaya-svyaz-sredy-3
  fingerprint: 15deb9b4
