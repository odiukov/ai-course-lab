- concept: вклад одного нового отката в среднее убывает как 1/N, поэтому у много посещённого узла плохая оценка сдвигает Q лишь слегка
  question: У узла MCTS 19 посещений и Q = 0.9. Backpropagate приносит через него новый rollout с оценкой 0.1. Чему станет равно Q узла?
  explanation: 'Q — накопленная сумма, делённая на посещения. Сумма была 0.9·19 = 17.1, стала 17.2, посещений 20, значит Q = 0.86. Сдвиг равен (r − Q)/(N+1) = (0.1 − 0.9)/20 = −0.04: влияние одного отката падает как 1/N. Поэтому единичная плохая оценка не вычёркивает ветку с длинной хорошей историей, но и хорошая оценка не спасает ветку мгновенно.'
  kind: numeric
  answer: 0.86
  tolerance: 0.005
