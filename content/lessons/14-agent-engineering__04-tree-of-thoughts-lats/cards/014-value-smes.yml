- concept: 'дешёвая точная проверка идёт первой и служит фильтром: недостижимый узел отсекается до запроса к модели, поэтому вызов модели не тратится'
  question: Расставь по порядку шаги вычисления гибридной функции ценности узла так, чтобы расход токенов был минимальным.
  explanation: 'Порядок здесь не косметика, а экономия: символьная часть стоит ноль токенов и даёт точный вердикт, поэтому мёртвая ветка отсекается бесплатно. Запусти сначала модель — заплатишь за оценку узла, который всё равно будет выброшен. Обратный вердикт («достижимо») запрета не даёт: узел просто пропускается дальше на оценку модели.'
  kind: order
  items:
    - Прогнать состояние узла через символьную проверку и получить s
    - Если проверка доказала недостижимость цели — отсечь узел и завершить оценку
    - Только для уцелевших узлов запросить у модели оценку m
    - Свернуть s и m в итоговое V = α·s + (1−α)·m
