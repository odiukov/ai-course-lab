- concept: итоговая ценность узла — выпуклая комбинация символьной и модельной оценок, где α задаёт долю доверия каждой
  question: Функция ценности узла считается как V = α·s + (1−α)·m, где s — нормированная символьная оценка, m — нормированная оценка модели. Пусть α = 0.75, s = 0.2, m = 0.9. Чему равно V?
  explanation: '0.75·0.2 + 0.25·0.9 = 0.15 + 0.225 = 0.375. Веса α и 1−α в сумме дают единицу, поэтому V остаётся в той же шкале, что s и m. Высокий α прижимает итог к символьной части: даже уверенное m = 0.9 не вытягивает узел, если перебор оценил его низко.'
  kind: numeric
  answer: 0.375
  tolerance: 0.01
  id: 014-value-smes-2
