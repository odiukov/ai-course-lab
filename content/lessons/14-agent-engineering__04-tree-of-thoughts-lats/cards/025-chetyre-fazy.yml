- concept: 'член исследования в UCT считается по счётчикам посещений: логарифм посещений родителя, делённый на посещения самого ребёнка'
  question: В MCTS узел-родитель посещён 64 раза, один его ребёнок — 8 раз, средняя ценность этого ребёнка Q = 0.6, константа исследования c = 0.5. Чему равна UCT-оценка этого ребёнка?
  explanation: 'UCT = Q + c·sqrt(ln N / n) = 0.6 + 0.5·sqrt(ln 64 / 8) = 0.6 + 0.5·sqrt(4.159/8) = 0.6 + 0.5·0.721 ≈ 0.96. Надбавка зависит только от счётчиков: она растёт с числом посещений родителя (логарифмически, то есть медленно) и падает с числом собственных посещений ребёнка, поэтому редко пробованная ветка сама всплывает наверх.'
  kind: numeric
  answer: 0.96
  tolerance: 0.02
  id: 025-chetyre-fazy-1
  fingerprint: f450d29c
- concept: backpropagate обновляет счётчики и ценности у всех узлов пройденного пути, поэтому статистика предка агрегирует прогоны всего его поддерева
  question: Итерация MCTS спустилась от корня через несколько узлов к листу, rollout дал оценку 0.8. Чьи счётчики посещений и оценки ценности обновляются на фазе backpropagate?
  explanation: 'Оценка несётся вверх по всему пройденному пути: каждому узлу +1 к посещениям и сдвиг средней ценности. Только так статистика предка становится агрегатом всех прогонов через его поддерево — а именно на неё опирается select на следующей итерации. Обновление одного листа оставило бы верхние узлы слепыми, обновление всего дерева испортило бы ветки, которых прогон не касался.'
  kind: choice
  options:
    - Только лист, из которого делали rollout
    - Лист и его непосредственный родитель
    - Все узлы пути от листа до корня
    - Все узлы дерева, включая непосещённые ветки
  correct: 2
  id: 025-chetyre-fazy-2
  fingerprint: 1dfcc121
- concept: simulate — прогон до терминала тем же policy, где оценивается только итоговый лист, тогда как expand порождает и закрепляет в дереве K узлов
  question: 'Объясни своими словами, чем фаза simulate отличается от фазы expand: что каждая из них делает с деревом и где именно возникает число, которое потом уходит в backpropagate.'
  explanation: 'Разделение принципиально по стоимости и по смыслу: expand платит за постоянные узлы, которые потом придётся выбирать и хранить, simulate платит за одноразовую оценку глубины. Если оценивать каждый шаг rollout, получится не MCTS, а лучевой поиск с посчитанными слоями; если раскрывать каждый шаг rollout в узлы, дерево взорвётся экспоненциально.'
  kind: open
  reference: 'Expand порождает через policy K кандидатов-продолжений и добавляет их в дерево как настоящие узлы со своими счётчиками — дерево растёт. Simulate ничего в дерево не добавляет: это черновой добег от выбранного ребёнка до конца тем же policy, промежуточные шаги rollout узлами не становятся и по пути не оцениваются. Число берётся один раз — на конце rollout, функцией ценности или наградой среды; именно оно и уходит в backpropagate.'
  id: 025-chetyre-fazy-3
