- concept: состояние узла — это остаток задачи, а не только текст мысли, иначе нельзя корректно породить детей
  question: Объясни своими словами, почему в состояние узла кладут не только текст самой мысли, но и то, что от задачи осталось после этого шага.
  explanation: 'В уроке состояние узла — это «получили 24, в руках ещё 4 и 1»: результат шага плюс неизрасходованный остаток. Мысль — это ход, состояние — позиция после хода; раскрывать и оценивать можно только позицию.'
  kind: open
  reference: 'Текст мысли фиксирует сделанный ход, но не описывает позицию после хода. Чтобы породить детей, нужно знать, какие ресурсы задачи ещё не потрачены (какие числа/факты/поля остались) и достижима ли цель. Без остатка узел нельзя корректно раскрыть: генератор предложит ходы с уже израсходованными элементами, а оценщик не проверит достижимость. Плюс два узла с одинаковым текстом мысли, но разным остатком — это разные состояния, и различить их можно только по остатку.'
  id: 007-node-struktura-3
  fingerprint: 0c46bdde
