- concept: оценка узла в дереве поиска — это средняя накопленная оценка, то есть сумма оценок, делённая на число посещений
  question: 'В дереве поиска узел хранит два счётчика: сколько раз поиск через него проходил и какая сумма оценок на нём накопилась. Поиск заходил в узел 8 раз, сумма оценок равна 5.6. Какое значение узла используется для сравнения с соседями?'
  explanation: 'Значение узла = сумма оценок / число посещений = 5.6 / 8 = 0.7. Сама сумма несравнима между узлами: узел с суммой 5.6 за 8 заходов хуже узла с суммой 1.9 за 2 захода (0.95). Именно поэтому счётчиков два, а не один.'
  kind: numeric
  answer: 0.7
  tolerance: 0.02
  id: 007-node-struktura-1
  fingerprint: f76daba6
- concept: ссылка на родителя хранит происхождение узла, поэтому весь путь от корня восстанавливается подъёмом по ссылкам, а не пересчётом
  question: Зачем узлу в дереве поиска мыслей отдельное поле со ссылкой на родителя, если текст мысли уже хранится в самом узле?
  explanation: 'Текст мысли сам по себе не знает, из какого состояния он вырос. Ссылка на родителя даёт дорогу назад: откат из тупика и восстановление префикса рассуждения — это подъём по родителям, О(глубина) переходов по ссылкам вместо повторной генерации. Без неё поиск умеет только идти вперёд, а значит перестаёт быть поиском.'
  kind: choice
  options:
    - Чтобы LLM видела родительский промпт при генерации следующей мысли и не повторяла его дословно
    - Чтобы из любого узла подняться до корня и получить весь путь рассуждения, не порождая шаги заново
    - 'Чтобы ограничить глубину дерева: узел без родителя считается листом и дальше не раскрывается'
    - Чтобы оценщик мог сравнить оценку узла с оценкой родителя и отбросить узел при падении оценки
  correct: 1
