- concept: несколько разных кандидатов от одного промпта получаются только стохастическим сэмплированием, а не жадным декодированием
  question: 'Policy-модель раскрывает узел: один и тот же промпт с описанием состояния отправляется K = 7 раз, чтобы получить 7 разных вариантов следующего хода. При каком режиме декодирования это сработает?'
  explanation: Модель выдаёт распределение по продолжениям. Жадное декодирование и beam width = 1 детерминированно берут argmax, поэтому 7 вызовов дадут 7 идентичных копий одного хода и ветвления не будет. Разнообразие кандидатов создаётся сэмплированием из распределения; без него дерево вырождается в цепочку.
  kind: choice
  options:
    - 'Greedy decoding: на каждом шаге берётся самый вероятный токен'
    - Сэмплирование из распределения (temperature > 0, top-p/top-k)
    - Beam search с шириной луча 1
    - Любой режим — LLM недетерминирована сама по себе
  correct: 1
  id: 009-policy-kandidaty-1
  fingerprint: dcf833b6
- concept: policy — роль LLM, предлагающая кандидатов-продолжения, и она отделена от роли оценщика
  question: В древовидном поиске с LLM что делает компонент, называемый policy?
  explanation: 'Policy генерирует продолжения — «накидай вариантов», а не «скажи, как надо». Оценка узла — работа отдельного промпта-оценщика (value), выбор листа для раскрытия — работа стратегии поиска (BFS/DFS/UCT). Разделение важно: генератор и критик могут быть разными промптами и даже разными моделями, а весов LLM поиск не трогает вовсе.'
  kind: choice
  options:
    - Присваивает узлу числовую оценку перспективности перед раскрытием
    - Предлагает кандидатов на следующий шаг из текущего состояния
    - Выбирает, какой из уже существующих листьев раскрывать следующим
    - Обновляет веса модели по результатам завершённых траекторий
  correct: 1
  id: 009-policy-kandidaty-2
  fingerprint: 0a5f5dd8
- concept: 'раскрытие — отдельная операция: узел сам не растёт, и пока он не раскрыт, выбирать поиску не из чего'
  question: Расставь шаги раскрытия одного листа в дереве поиска в правильном порядке.
  explanation: 'Узел не растёт сам: без явного шага раскрытия его список детей остаётся пустым, и стратегия выбора работает вхолостую — выбирать не из чего. Порядок жёсткий: состояние определяет промпт, промпт даёт ходы, ходы дают состояния детей, дети становятся кандидатами для следующего выбора.'
  kind: order
  items:
    - Взять состояние выбранного листа и подставить его в промпт policy
    - Сделать K независимых сэмплированных вызовов и получить K вариантов следующего хода
    - Применить каждый ход к состоянию родителя и получить K новых состояний
    - Создать по узлу на каждое состояние и прицепить их как детей раскрываемого листа
    - Передать новых детей стратегии выбора для следующей итерации поиска
  id: 009-policy-kandidaty-3
  fingerprint: a5f25c45
