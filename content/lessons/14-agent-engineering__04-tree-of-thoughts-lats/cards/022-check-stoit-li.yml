- concept: качество оценщика — условие конвертации бюджета поиска в точность, поэтому оценщик улучшают раньше, чем расширяют поиск
  question: 'Есть бюджет на улучшение агента: можно либо построить машинную проверку результата, либо на те же деньги расширить луч и глубину уже работающего поиска. Почему порядок «сначала оценщик, потом бюджет поиска» не произволен?'
  explanation: Множитель расхода в 100–1000x окупается только тогда, когда каждый лишний развёрнутый узел действительно повышает шанс дойти до верного ответа. Это свойство оценщика, а не поиска, поэтому расширять поиск поверх шумной оценки — покупать усиление собственной ошибки.
  kind: open
  reference: 'Поиск не умеет искать правильность — он ищет максимум оценки. Бюджет превращается в точность только через оценщик: если ранг оценщика согласован с истинной правильностью, лишние узлы дают лишние шансы найти верную ветку; если оценка шумная, лишние узлы дают лишние шансы наткнуться на неверный ответ с высоким баллом, и точность падает при росте расхода. Значит, оценщик — гейт: до него вложения в поиск дают отрицательную отдачу, после него — положительную. Поэтому сначала строят дешёвую надёжную проверку (юнит-тесты, символьный критерий, явная цель), и только потом покупают за токены ширину и глубину.'
  id: 022-check-stoit-li-2
  fingerprint: 166008ef
