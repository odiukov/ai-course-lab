- concept: надёжность линейной цепочки падает мультипликативно с её длиной
  question: Модель решает задачу одной цепочкой рассуждений из 6 шагов. Каждый шаг она выполняет верно с вероятностью 0.95, и ни один шаг не перепроверяется — каждый следующий берёт результат предыдущего как данность. Какова вероятность верного итогового ответа?
  explanation: 'Без возможности вернуться ошибка любого шага делает весь остаток цепочки бессмысленным, поэтому вероятности перемножаются: 0.95^6 ≈ 0.735. Каждый добавленный шаг режет надёжность, даже если сам по себе он почти безошибочен. Именно поэтому длинные линейные рассуждения деградируют, а не улучшаются.'
  kind: numeric
  answer: 0.735
  tolerance: 0.01
  id: 001-pryamaya-liniya-1
  fingerprint: 1c4ce160
- concept: локальная корректность шагов не проверяет посылку, на которой они стоят
  question: Цепочка рассуждений содержит одну ошибку в самом начале; все последующие шаги арифметически безупречны и согласованы друг с другом. Почему согласованность цепочки не спасает ответ?
  explanation: 'Согласованность — это отношение шага к соседу, а не к истине. Ошибочная посылка стоит в контексте и с каждым новым предложением выглядит всё авторитетнее, потому что на неё уже сослались. Локальная валидность не даёт глобальной: цепочка может быть безупречно связной и полностью неверной.'
  kind: choice
  options:
    - Каждый шаг верен только относительно результата предыдущего, а сама начальная посылка не проверяется ни одним из них
    - Модель забывает начало цепочки к её концу из-за ограничения окна контекста
    - Ошибки в арифметике накапливаются из-за округления промежуточных значений
    - Длинные цепочки заставляют модель переключаться на менее надёжный режим генерации
