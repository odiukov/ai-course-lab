- concept: линейное авторегрессивное декодирование не даёт точки пересмотра, поиск её создаёт
  question: Объясни своими словами, какой операции лишена одна линейная цепочка рассуждений и что взамен даёт формулировка рассуждения как поиска (Tree of Thoughts, LATS).
  explanation: Ключевое отличие не в «качестве шагов», а в наличии точки возврата. Поиск делает первый шаг ревизуемым, из-за чего ошибка в начале перестаёт быть фатальной — но стоит это K^d развёрнутых путей вместо одного.
  kind: open
  reference: 'Линейная цепочка растёт только вперёд: сгенерированный токен становится частью контекста и больше не пересматривается — нет ни развилки, ни отката. Поиск заменяет один маршрут деревом: на каждом шаге предлагается несколько кандидатов-мыслей, они оцениваются, перспективные разворачиваются дальше, а при тупике происходит откат к другой ветви. Четыре операции — предложить, оценить, выбрать, откатиться — и есть то, чего у прямой прогулки нет. Плата — экспоненциальный рост числа путей: K кандидатов на глубину d дают K^d вариантов, отсюда рост расхода токенов на два-три порядка.'
  id: 001-pryamaya-liniya-3
  fingerprint: 1938f6a3
