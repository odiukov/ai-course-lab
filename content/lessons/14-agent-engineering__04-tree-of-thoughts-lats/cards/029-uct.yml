- concept: при нулевой константе исследования UCT вырождается в жадный выбор по среднему и перестаёт возвращаться к отвергнутым веткам
  question: Константу исследования c в UCT выставили в ноль. Как поведёт себя спуск по дереву?
  explanation: 'c умножает слагаемое исследования, поэтому при c = 0 от UCT остаётся только Q — средняя награда. Ветка с чуть худшим средним после первых прогонов уже не получит компенсации за малое число посещений, и дерево навсегда сваливается в один локальный оптимум. Ровно это и служит диагностикой: если при обнулённом c побеждает не ребёнок с лучшим средним, ошибка в том, что вместо среднего подставлена накопленная сумма.'
  kind: choice
  options:
    - 'Он станет жадным: победитель определяется только средней наградой, и однажды проигравшая ветка больше никогда не выберется, сколько бы посещений ни набрали соседи'
    - 'Он станет равномерным: все дети будут выбираться по кругу примерно одинаково часто'
    - 'Он полностью сломается: без слагаемого исследования сравнивать детей нечем'
    - 'Он станет случайным: без c выбор определяется только порядком детей в списке'
