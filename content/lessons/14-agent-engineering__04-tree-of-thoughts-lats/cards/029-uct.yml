- concept: UCT не задаёт порядка среди нескольких непосещённых братьев — все равны +∞, и очередь определяет правило разрешения ничьей, а не формула
  question: 'Узел только что раскрыли: у него появилось сразу несколько детей, и ни один ещё не посещался. Что вернёт UCT для каждого из них и чем на самом деле определится, кого возьмут первым? Останутся ли остальные без прогонов?'
  explanation: 'Бесконечность — сентинел приоритета, а не оценка качества: она не различает непосещённых братьев, она лишь ставит их всех впереди обкатанных. Различать их нечем и незачем — данных о них пока нет. Порядок обхода внутри группы задаёт tie-break argmax, и на итог это не влияет, потому что первую пробу получат все, прежде чем поиск начнёт углубляться в лучшую ветку.'
  kind: open
  reference: 'Для каждого непосещённого ребёнка UCT вернёт +∞ — значения совпадут, поэтому формула их между собой не упорядочивает. Первым берётся тот, кого выберет правило разрешения ничьей в argmax (обычно первый по порядку в списке детей), то есть очередь задаёт реализация, а не UCT. Остальные без прогонов не остаются: как только выбранный ребёнок получает свой первый rollout, его UCT становится конечным, и на следующем спуске максимумом снова оказывается кто-то из ещё не посещённых. Так каждый ребёнок гарантированно получает первый прогон, и только после этого начинается настоящее сравнение по средней награде и слагаемому исследования.'
