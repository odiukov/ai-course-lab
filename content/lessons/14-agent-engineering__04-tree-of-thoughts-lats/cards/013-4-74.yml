- concept: 'результат на бенчмарке — свойство связки «модель + обвязка вывода», а не свойство весов: веса не менялись'
  question: Одна и та же модель, без дообучения и без изменения промпта-генератора ходов, показывает 11% на задаче в режиме одной линейной цепочки и 62% внутри древовидного поиска. Что этот разрыв говорит о том, чему на самом деле принадлежит цифра бенчмарка, и как это менять практику измерений?
  explanation: 'Эталонный ответ разводит два источника качества: параметры модели и алгоритм вывода поверх них. В оригинальной статье именно этот разрыв (4% против 74% у GPT-4 на Game of 24) и получен без всякого дообучения. Побочное следствие: та же обвязка стоит на два-три порядка больше токенов, поэтому честное сравнение фиксирует ещё и бюджет.'
  kind: open
  reference: 'Веса не менялись, распределение предлагаемых ходов то же самое — значит, разрыв целиком создан обвязкой на этапе вывода: ветвление, оценка промежуточных состояний, отбраковка и возврат. Способность выдать верный ход у модели была и в режиме одной цепочки; линейное декодирование просто не даёт шанса её использовать, потому что первый неудачный ход не отменяем. Отсюда: число на бенчмарке характеризует связку «модель + обвязка вывода», а не модель. Сравнивать модели корректно только при зафиксированной обвязке, а заявленный прирост нужно всегда сопровождать описанием scaffold и бюджета токенов — иначе сравниваются разные пайплайны.'
