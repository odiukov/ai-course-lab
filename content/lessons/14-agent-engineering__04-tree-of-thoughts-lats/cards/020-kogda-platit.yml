  reference: 'Нет. Два условия из трёх выполнены (одной траектории мало, проверка дешёвая и надёжная), но третье провалено: дерево прогоняет десятки вызовов модели последовательно и в 200 мс не укладывается. Поиск применим там, где правильность важнее времени по часам — офлайн-прогон, ночной пакет, фоновая задача. Для интерактивного автодополнения остаётся одна траектория, а поиск можно вынести в фоновый режим с тестами.'
