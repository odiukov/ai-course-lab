  question: Агент дописывает код прямо в редакторе, бюджет ответа — 200 миллисекунд. Юнит-тесты для проверки есть, и одной попытки часто не хватает. Стоит ли включать здесь древесный поиск? Объясни.
  explanation: 'Три признака работают как конъюнкция, а не как список пожеланий. Точность дерева не компенсирует нарушение лимита латентности: ответ, пришедший после того, как пользователь уже напечатал строку сам, бесполезен при любом качестве.'
