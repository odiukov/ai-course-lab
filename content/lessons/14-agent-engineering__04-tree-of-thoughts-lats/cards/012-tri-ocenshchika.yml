- concept: числовая оценка LLM нестабильна по абсолютной величине, поэтому опорой служит относительный ранг кандидатов, а не значение балла
  question: Оценщик выдаёт узлу числовой балл перспективности. При повторном прогоне того же самого узла балл заметно меняется. Почему поиск всё равно можно строить на такой оценке и на что именно в ней следует опираться?
  explanation: 'Числовая форма добавляет к категориальной именно порядок, и в этом её ценность. Калибровки она не добавляет: тот же узел получает то один балл, то другой. Практический вывод — использовать оценку для ранжирования и для усреднения по нескольким сэмплам, а не как измеренную величину.'
  kind: open
  reference: 'Балл от LLM — сэмпл шумной эвристики, его абсолютная величина плывёт от прогона к прогону и не имеет калиброванного смысла (нельзя читать его как вероятность успеха). Но поиску абсолютное значение и не нужно: селекция сравнивает кандидатов между собой, поэтому достаточно, чтобы шум сохранял относительный порядок — перспективный узел стабильно получал балл выше тупикового. Опираться нужно на ранг/сравнение, а не на конкретное число; отсюда же следует, что нельзя ставить жёсткий абсолютный порог отсечения и нельзя сравнивать баллы, полученные в разных прогонах оценщика.'
  id: 012-tri-ocenshchika-2
  fingerprint: a02254d2
- concept: голосование не имеет абсолютного порога, поэтому всегда назначает победителя и не умеет забраковать весь набор кандидатов
  question: 'Оценщик реализован голосованием: все кандидаты-дети кладутся в один промпт, модель называет самого перспективного. Родитель раскрылся, но каждая из порождённых веток на деле тупиковая. Что вернёт такой оценщик?'
  explanation: Голосование выдаёт только относительный ответ «который из этих лучше». Абсолютной шкалы у него нет, значит нет и точки, где можно сказать «все ниже порога». Поиск получит победителя и продолжит копать в заведомо мёртвой области. Категориальная форма с меткой impossible такое отсекает, голосование — нет; отсюда и практика комбинировать формы или держать отдельную проверку терминальности.
  kind: choice
  options:
    - Сигнал, что перспективных кандидатов нет, и ветка гасится
    - Победителя — лучшего из плохих, без признака того, что весь набор безнадёжен
    - Одинаковый балл всем кандидатам, что и означает тупик
    - Ошибку, потому что голосование неприменимо к тупиковым узлам
  correct: 1
