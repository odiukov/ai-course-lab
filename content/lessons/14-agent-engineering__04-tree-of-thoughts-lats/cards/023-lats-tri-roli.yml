- concept: три роли LATS — один набор весов при трёх разных промптах, поэтому добавление роли меняет содержимое запроса, а не состав системы
  question: В LATS одна LLM выступает как policy, как функция ценности и как self-reflector. Объясни своими словами, чем эти три роли различаются технически и что из этого следует для стоимости и развёртывания системы.
  explanation: 'Ключ в том, что LATS — это обвязка вывода, а не архитектура: ToT, ReAct и Reflexion сведены под MCTS без единого обновления весов. Практический вывод обоюдоострый — роль добавляется дёшево, но общая для всех ролей модель означает общие слепые пятна, и именно поэтому внешний сигнал среды в функции ценности так важен.'
  kind: open
  reference: 'Технически различается только промпт: «предложи следующее действие», «оцени это частичное состояние», «объясни, почему прогон провалился». Веса, эндпоинт и вызов API одни и те же — ни дообучения, ни отдельной модели под каждую роль. Следствия: (1) добавление роли стоит дополнительных вызовов и токенов, а не отдельного обучения, инференс-сервера или чекпойнта; (2) роли не имеют независимых способностей — общая слабость модели (например, плохая калибровка) протекает и в оценку, и в рефлексию, поэтому оценщик нельзя считать независимым арбитром политики; (3) сменить схему ролей можно правкой промптов на лету. При этом рефлексия ещё и самая дешёвая из трёх: одна короткая текстовая заметка на прогон против K вызовов на каждое раскрытие у policy.'
  id: 023-lats-tri-roli-3
  fingerprint: f59a3bc8
