- concept: наблюдения среды подмешиваются в оценку узла, давая внешний сигнал, некоррелированный с ошибками генератора
  question: 'Кодовый агент оценивает частичную траекторию. Вариант A: оценщик читает только текст рассуждения и черновик функции. Вариант B: оценщик дополнительно получает вывод запуска тестов на этом черновике. Почему B надёжнее отсекает ветки?'
  explanation: 'Самооценка LLM коррелирует с её собственной генерацией: правдоподобно выглядящий неверный код модель охотно одобряет, потому что тем же приором она его и написала. Обратная связь среды приходит извне цепочки и режет именно те ветки, которые модель подтвердила бы сама себе. В LATS наблюдения подмешиваются в функцию ценности ровно для этого; на HumanEval связка дала 92.7% pass@1 — разница между «кажется, верно» и «тесты зелёные».'
  kind: choice
  options:
    - Вывод тестов длиннее, и оценщик получает больше токенов контекста
    - Наблюдение среды — сигнал, порождённый не той же моделью, поэтому он не разделяет её заблуждений; самооценка же ошибается там же, где ошибся генератор
    - Тесты позволяют увеличить константу исследования в UCT
    - Запуск тестов делает оценку узла детерминированной по построению
  correct: 1
