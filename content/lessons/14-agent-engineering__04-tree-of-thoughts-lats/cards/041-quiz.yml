- concept: select — рекурсивный спуск по уровням дерева, а не одноразовый выбор глобального максимума UCT среди всех узлов
  question: 'Как именно фаза выбора в MCTS находит узел, который будет раскрыт: сравнивает ли она UCT всех узлов дерева между собой? Объясни своими словами.'
  explanation: Логарифм в бонусе берётся от посещений родителя, поэтому величина UCT осмысленна только внутри одного набора братьев. Отсюда и рекурсивный спуск вместо перебора всего дерева.
  kind: open
  reference: 'Нет. Выбор стартует в корне и на каждом уровне сравнивает только братьев — детей текущего узла, — переходя в того, у кого UCT максимален. Спуск повторяется, пока не упрётся в узел с нераскрытыми детьми или в терминал. Глобального сравнения по всему дереву не происходит: узлы с разных ветвей и разной глубины никогда не сопоставляются напрямую, и их значения UCT несравнимы, потому что считаются относительно разных родителей.'
  id: 041-quiz-2
  fingerprint: 42d2c238
- concept: MCTS перераспределяет бюджет между ветками по накопленной статистике, тогда как обход с фиксированной шириной тратит одинаково на каждый узел уровня
  question: Чем распределение бюджета в MCTS-поиске отличается от обхода дерева в ширину с фиксированным лучом?
  explanation: 'Луч режет уровень по оценке и дальше идёт равномерно: узел вне среза не получит второго шанса, узел внутри — не получит добавки. MCTS накапливает статистику по прогонам и адаптивно углубляется в перспективное поддерево, сохраняя возможность вернуться к отставшей ветке.'
  kind: choice
  options:
    - MCTS раскрывает больше детей у каждого узла, чем допускает луч
    - MCTS копит счётчики посещений и отдаёт следующие проходы тем веткам, что уже показали высокое среднее, а фиксированный луч тратит поровну на всё, что попало в срез уровня
    - MCTS не нуждается в функции ценности, а лучевой поиск нуждается
    - MCTS обходит дерево строго по уровням, а луч — в глубину
  correct: 1
