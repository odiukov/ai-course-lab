- concept: падение точности при росте бюджета диагностируется измерением согласия ранга оценщика с истинной правильностью на размеченных узлах, а не добавлением ещё бюджета
  question: Ширину луча подняли с 3 до 12, расход токенов вырос вчетверо, а точность на валидации упала. Какое измерение первым отличит шумный оценщик от нехватки бюджета?
  explanation: 'Симптом одинаков в обоих случаях, различает их только качество ранжирования. Если высоко оценённые узлы не чаще ведут к верному ответу, чем низко оценённые, расширять поиск бессмысленно: он оптимизирует балл, а не правильность. Чинить надо оценщик — добавлять проверяемый сигнал или снижать дисперсию оценки.'
  kind: choice
  options:
    - Поднять ширину луча до 24 и посмотреть, вернётся ли точность
    - Взять узлы с известной правильностью и проверить, насколько ранг оценщика согласуется с фактическим исходом ветки
    - Увеличить число сэмплов policy на каждое раскрытие
    - Сравнить среднюю длину траектории при ширине 3 и 12
