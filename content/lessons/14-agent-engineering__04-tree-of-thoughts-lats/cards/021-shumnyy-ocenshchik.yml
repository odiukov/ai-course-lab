- concept: ожидаемое число ложно высоко оценённых узлов растёт линейно с числом раскрытых узлов, поэтому рост бюджета увеличивает шанс завести луч в ошибку оценщика
  question: Оценщик завышает балл тупикового узла с вероятностью 0.04 независимо для каждого узла. За прогон поиск раскрыл 75 тупиковых узлов. Сколько ложно высоко оценённых узлов ожидается?
  explanation: 75 × 0.04 = 3. Ожидание линейно по числу раскрытий, поэтому каждое увеличение бюджета пропорционально увеличивает число кандидатов на попадание в верхушку по ошибке. При редком шуме малый бюджет может ни одной такой ошибки не встретить, большой встретит их гарантированно.
  kind: numeric
  answer: 3
  tolerance: 0.01
