- concept: глубина стоит в показателе степени, поэтому раздувает число путей сильнее, чем такое же увеличение ветвления
  question: 'Поиск с 4 кандидатами на шаг и глубиной 4 перебирает 256 путей. Что раздует стоимость сильнее: поднять число кандидатов до 5 при той же глубине, или поднять глубину до 5 при тех же 4 кандидатах?'
  explanation: 'Число путей равно b^d. Ветвление b — основание, глубина d — показатель, поэтому шаг вглубь дороже шага вширь: 1024 против 625. Отсюда практика — держать веер узким (2-5 кандидатов) и ограничивать глубину, иначе счёт за токены уходит в 100-1000 раз выше CoT.'
  kind: choice
  options:
    - 'Кандидаты: 5 в степени 4 = 625 путей'
    - 'Глубина: 4 в степени 5 = 1024 пути'
    - 'Одинаково: оба дают по 625 путей'
    - 'Ни то ни другое: число путей растёт линейно'
  correct: 1
