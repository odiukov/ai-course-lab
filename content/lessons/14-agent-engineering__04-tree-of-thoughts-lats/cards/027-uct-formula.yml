- concept: слагаемое исследования у неизменившегося хода растёт само по себе за счёт посещений соседей, поэтому однажды отвергнутая ветка гарантированно возвращается в выбор
  question: Ход из корня получил низкую оценку за единственный rollout и с тех пор ни разу не выбирался. Ни его Q, ни его счётчик посещений не менялись. Объясни, почему при достаточном числе итераций select всё равно к нему вернётся — и почему возврат происходит не сразу.
  explanation: 'Ключ в том, что надбавка — функция двух счётчиков, и один из них растёт от чужих визитов. Отсюда свойство: ни один ход не отсекается необратимо, что критично, когда функция ценности шумная и одна оценка 0.5 может быть просто промахом. Логарифм отвечает за темп: возвраты случаются, но всё реже.'
  kind: open
  reference: 'В слагаемом c·sqrt(ln N(s)/N(s,a)) числитель зависит от посещений родителя, а знаменатель — от посещений самого хода. Пока поиск ходит в соседние ветки, N(s) растёт, а N(s,a) стоит на месте, поэтому надбавка забытого хода увеличивается без каких-либо новых данных о нём. Рано или поздно сумма Q + надбавка перебивает конкурента с высоким Q, и ход снова попадает в выбор. Возврат не мгновенный, потому что числитель растёт как ln N(s), а под корнем это ещё медленнее: чтобы удвоить надбавку, нужно возвести число посещений родителя примерно в четвёртую степень. Это и даёт нужный компромисс: поиск не бросает удачную ветку после каждой итерации, но и не запечатывает ветку навсегда из-за одной шумной оценки.'
