- concept: выбор в select делается по сумме Q и слагаемого исследования, поэтому ход с худшим Q может обогнать лучший при достаточно малом числе своих посещений
  question: В узле s накоплено N(s) = 64 посещений. Ход B имеет Q = 0.4 и был выбран 4 раза. Константа c = 0.7. Чему равно значение UCT для хода B?
  explanation: ln 64 ≈ 4.159; 4.159/4 ≈ 1.040; корень ≈ 1.020; умножаем на c = 0.7, получаем ≈ 0.714. Итого 0.4 + 0.714 ≈ 1.11. Для сравнения, ход с Q = 0.9 и 32 посещениями даёт 0.9 + 0.7·sqrt(4.159/32) ≈ 1.15 — то есть слабый по Q, но редко посещённый ход подходит вплотную.
  kind: numeric
  answer: 1.11
  tolerance: 0.03
