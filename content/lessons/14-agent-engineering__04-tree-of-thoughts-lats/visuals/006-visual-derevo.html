<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Дерево из 4 6 4 1</title>
<style>
  :root{
    --bg:#fbfbfa; --fg:#1c1c1a; --muted:#6b6b66;
    --line:#8a8a82; --hot:#b3541e; --cold:#9a9a92; --node:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16181c; --fg:#e8e8e4; --muted:#9a9a92;
      --line:#7d8088; --hot:#e08a4a; --cold:#5f6view; --node:#22252b;
    }
  }
  @media (prefers-color-scheme: dark){ :root{ --cold:#5f636b; } }
  html,body{margin:0}
  .wrap{background:var(--bg);color:var(--fg);padding:10px 12px 12px;
    font:14px/1.4 ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  h2{margin:0 0 6px;font-size:15px;font-weight:600}
  svg{display:block;width:100%;height:auto;max-height:470px}
  .legend{margin:6px 0 0;color:var(--muted);font-size:12px}
  .fail{color:var(--fg);font-size:13px;margin:8px 0 0}
</style>
<div class="wrap">
  <h2>Дерево из 4 6 4 1: раскрывают только горячее</h2>
  <div id="host"></div>
  <p class="legend" id="legend">HIGH — высокая оценка узла; «…» — ветка обрублена, следующий вызов модели на неё не тратят.</p>
</div>
<script>
(function(){
var host=document.getElementById("host");
try{
  /* ---------- данные схемы (единственные литералы-данные) ---------- */
  var NODES=[
    {id:"root", x:0,  y:3, label:"find 24 from 4 6 4 1", kind:"root"},
    {id:"a",    x:-4, y:2, label:"6 − 4 = 2",  kind:"cold"},
    {id:"b",    x:0,  y:2, label:"4 + 1 = 5",  kind:"cold"},
    {id:"c",    x:4,  y:2, label:"4 × 6 = 24", kind:"hot"},
    {id:"a1",   x:-5, y:1, label:"…", kind:"stop"},
    {id:"a2",   x:-3, y:1, label:"…", kind:"stop"},
    {id:"b1",   x:0,  y:1, label:"…", kind:"stop"},
    {id:"c1",   x:4,  y:1, label:"finish", kind:"hot"}
  ];
  var EDGES=[
    {from:"root",to:"a",kind:"cold"},
    {from:"root",to:"b",kind:"cold"},
    {from:"root",to:"c",kind:"hot"},
    {from:"a",to:"a1",kind:"cold"},
    {from:"a",to:"a2",kind:"cold"},
    {from:"b",to:"b1",kind:"cold"},
    {from:"c",to:"c1",kind:"hot"}
  ];
  var NOTES=[
    {at:"c",  x:5.4, y:2,   text:"Score: HIGH", side:"right"},
    {at:"lv3",x:-6,  y:3,   text:"уровень 1: корень", side:"left"},
    {at:"lv2",x:-6,  y:2,   text:"уровень 2: K = 3 кандидата", side:"left"},
    {at:"lv1",x:-6,  y:1,   text:"уровень 3: 27 листьев в теории", side:"left"}
  ];

  /* ---------- один origin, один scale, одна пара sx/sy ---------- */
  var origin={x:300,y:70};
  var scale={x:44,y:110};
  function sx(x){ return origin.x + x*scale.x; }
  function sy(y){ return origin.y + (3-y)*scale.y; }

  /* ---------- размеры холста и пиксельные отступы (литералы) ---------- */
  var W=600, H=430, PAD_LBL=9, PAD_BOX=6, FS=13, FS_SM=11.5, LW=1.6;

  var byId={}; NODES.forEach(function(n){ byId[n.id]=n; });
  function px(n){ return {x:sx(n.x), y:sy(n.y)}; }

  var out=[];
  out.push('<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+
    '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Дерево поиска из цифр 4 6 4 1">');
  out.push('<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="var(--bg)"/>');
  out.push('<defs>'+
    '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">'+
    '<path d="M0 0 L10 5 L0 10 z" fill="var(--line)"/></marker>'+
    '<marker id="ahh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">'+
    '<path d="M0 0 L10 5 L0 10 z" fill="var(--hot)"/></marker>'+
    '</defs>');

  /* уровневые направляющие: концы через sx/sy */
  [3,2,1].forEach(function(lv){
    out.push('<line x1="'+sx(-5.7)+'" y1="'+sy(lv)+'" x2="'+sx(6.6)+'" y2="'+sy(lv)+
      '" stroke="var(--cold)" stroke-width="'+LW/2+'" stroke-dasharray="2 6" opacity="0.55"/>');
  });

  /* рёбра: хвост у нижнего края родителя, наконечник у верхнего края ребёнка */
  EDGES.forEach(function(e){
    var p=px(byId[e.from]), c=px(byId[e.to]);
    var col=e.kind==="hot"?"var(--hot)":"var(--line)";
    var mk=e.kind==="hot"?"ahh":"ah";
    var wd=e.kind==="hot"?LW*1.5:LW;
    var dx=c.x-p.x, dy=c.y-p.y, L=Math.sqrt(dx*dx+dy*dy);
    var off=PAD_BOX+10;
    out.push('<line x1="'+(p.x+dx/L*off)+'" y1="'+(p.y+dy/L*off)+
      '" x2="'+(c.x-dx/L*off)+'" y2="'+(c.y-dy/L*off)+
      '" stroke="'+col+'" stroke-width="'+wd+'" marker-end="url(#'+mk+')"'+
      (e.kind==="hot"?"":' opacity="0.8"')+'/>');
  });

  /* узлы */
  NODES.forEach(function(n){
    var p=px(n), col, fw;
    if(n.kind==="hot"){ col="var(--hot)"; fw="600"; }
    else if(n.kind==="stop"){ col="var(--cold)"; fw="400"; }
    else { col="var(--fg)"; fw="400"; }
    var w=n.label.length*(n.kind==="stop"?4.2:6.9)+PAD_BOX*2;
    if(n.kind!=="stop"){
      out.push('<rect x="'+(p.x-w/2)+'" y="'+(p.y-FS)+'" width="'+w+'" height="'+(FS*2)+
        '" rx="'+PAD_BOX+'" fill="var(--node)" stroke="'+
        (n.kind==="hot"?"var(--hot)":"var(--line)")+'" stroke-width="'+LW+'"/>');
    }
    out.push('<text x="'+p.x+'" y="'+(p.y+(n.kind==="stop"?FS/2:FS/3))+
      '" text-anchor="middle" font-size="'+(n.kind==="stop"?FS+4:FS)+
      '" font-weight="'+fw+'" fill="'+col+'">'+n.label+'</text>');
  });

  /* подписи: правые — start, левые — end, все через sx/sy */
  NOTES.forEach(function(t){
    var isR=t.side==="right";
    out.push('<text x="'+(sx(t.x)+(isR?PAD_LBL:-PAD_LBL))+'" y="'+(sy(t.y)+FS_SM/3)+
      '" text-anchor="'+(isR?"start":"end")+'" font-size="'+FS_SM+
      '" fill="'+(isR?"var(--hot)":"var(--muted)")+'"'+
      (isR?' font-weight="600"':'')+'>'+t.text+'</text>');
  });

  /* подпись у хвоста горячей ветки, сбоку от середины, ниже линии */
  var pr=px(byId.root), pc=px(byId.c);
  out.push('<text x="'+((pr.x+pc.x)/2)+'" y="'+((pr.y+pc.y)/2+FS_SM+PAD_LBL)+
    '" text-anchor="middle" font-size="'+FS_SM+'" fill="var(--hot)">раскрываем</text>');

  var pa=px(byId.a), pb=px(byId.b);
  out.push('<text x="'+((pr.x+pa.x)/2)+'" y="'+((pr.y+pa.y)/2-PAD_LBL)+
    '" text-anchor="middle" font-size="'+FS_SM+'" fill="var(--muted)">не раскрываем</text>');
  out.push('<text x="'+(pb.x-PAD_LBL)+'" y="'+((pr.y+pb.y)/2)+
    '" text-anchor="end" font-size="'+FS_SM+'" fill="var(--muted)">не раскрываем</text>');

  out.push('</svg>');
  host.innerHTML=out.join("");
}catch(err){
  host.innerHTML='<p class="fail">Схема должна показывать: корень «find 24 from 4 6 4 1» '+
    'и три ребёнка — «6 − 4 = 2», «4 + 1 = 5», «4 × 6 = 24» с пометкой Score: HIGH. '+
    'Ветки без HIGH обрываются на «…», горячая доходит до finish. '+
    'При K = 3 и трёх уровнях дерево дало бы 27 листьев, живыми доходят считанные.</p>';
}
})();
</script>
</html>
