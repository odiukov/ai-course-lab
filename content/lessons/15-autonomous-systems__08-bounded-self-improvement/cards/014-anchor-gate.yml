- concept: якорь перепроверяется на каждом цикле, потому что одобрение относится к текущему запуску, а не к системе навсегда
  question: Подписанный человеком манифест разрешений на инструменты заново проверяется на каждом вызове цикла, а не однократно при развёртывании. Что даёт именно повторная проверка?
  explanation: Одноразовая проверка при развёртывании подтверждает состояние в один момент времени. Цикл же меняет систему многократно, поэтому одобрение должно подтверждаться для той версии, которая запускается сейчас.
  kind: choice
  options:
    - Каждая новая версия проходит условие заново, поэтому подмена или расширение разрешений между циклами не наследует прошлое одобрение
    - Повторная проверка ускоряет цикл, так как подпись кешируется
    - Она делает манифест неизменяемым, потому что частое чтение блокирует запись
    - 'Она заменяет инварианты: при подписанном манифесте отдельные ограничения на действия не нужны'
