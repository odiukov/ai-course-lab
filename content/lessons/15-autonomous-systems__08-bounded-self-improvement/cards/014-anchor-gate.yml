- concept: гейт якоря — предварительное условие допуска новой версии, а не последующий аудит её работы
  question: Где в цикле самоулучшения стоит сверка активной цели с одобренной, чтобы она давала заявленную гарантию?
  explanation: Сверка после запуска обнаруживает подмену цели, когда версия уже действовала по ней. Гарантия «система идёт к одобренной цели» требует, чтобы совпадение было условием допуска.
  kind: choice
  options:
    - 'Перед допуском новой версии к работе: не прошла сверку — не запускается'
    - После первой партии реальных вызовов, чтобы сверять цель по фактическим решениям
    - В конце цикла, вместе со сбором метрик качества правки
    - Один раз при первоначальном развёртывании системы
  correct: 0
