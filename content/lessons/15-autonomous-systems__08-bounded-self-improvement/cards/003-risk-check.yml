- concept: серия успешных испытаний — свидетельство снижения риска, а не доказательство безопасности
  question: 'Команда провела серию успешных прогонов ограниченного цикла: опасного поведения не наблюдалось ни разу. Что из этого следует, а что нет? Объясни своими словами.'
  explanation: 'Здесь важно удержать обе стороны: успешная проверка не переводится в гарантию, но и требование гарантии не отменяет ценности мер снижения риска.'
  kind: open
  reference: 'Следует: набралось эмпирическое свидетельство, что в проверенном классе условий система ведёт себя приемлемо, и что ограничения повышают цену обхода. Не следует: доказательства безопасности для будущих версий, новых условий и способов обхода, которые в прогонах не встречались. Прогоны покрывают конечную выборку ситуаций, а тихий обход по определению не поднимает сигнал, поэтому его отсутствие в логах — слабое свидетельство. Обратная крайность тоже неверна: отсутствие доказательства не делает меры бесполезными, они меняют вероятность и цену отказа.'
  id: 003-risk-check-2
  fingerprint: ff785f2c
