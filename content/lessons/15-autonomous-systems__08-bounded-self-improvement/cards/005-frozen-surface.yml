- concept: граница защищённой области задаётся явным перечнем объектов, иначе она непроверяема
  question: Почему правило «цикл не должен менять ничего критически важного» не годится как замороженная поверхность?
  explanation: 'Оценочная формулировка требует интерпретации, а цикл и проверяющий могут интерпретировать её по-разному. Явный перечень файлов, модулей и настроек превращает намерение в механически проверяемое правило: правка внутри перечня — нарушение независимо от обещанного прироста качества.'
  kind: choice
  options:
    - Потому что оно охватывает слишком много файлов и останавливает прогресс
    - Потому что оно не даёт проверяющему коду однозначного ответа на вопрос, входит ли конкретный файл в защищённую область
    - Потому что критичность компонентов меняется от версии к версии
    - Потому что такое правило запрещает и обновления со стороны разработчиков
  correct: 1
