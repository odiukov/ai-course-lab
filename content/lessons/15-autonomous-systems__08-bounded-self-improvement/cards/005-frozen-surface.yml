- concept: «заморожено» означает запрет для цикла самоулучшения, а не вечную неизменяемость компонента
  question: Разработчикам понадобилось обновить оценщик, входящий в замороженную поверхность. Что это означает для схемы?
  explanation: Заморозка — это не свойство файла, а ограничение субъекта. Запрещено ровно то совмещение, при котором цикл одновременно проходит испытание и переписывает условия испытания. Внешняя процедура обновления такого совмещения не создаёт.
  kind: choice
  options:
    - 'Схема нарушена: замороженный компонент нельзя менять никогда'
    - 'Ничего не нарушено: запрет адресован циклу, а замена идёт отдельной процедурой вне цикла'
    - После обновления замороженную поверхность нужно расформировать
    - Значит, оценщик изначально не должен был входить в замороженную поверхность
  correct: 1
