- concept: 'успехи разных гейтов не суммируются в баллы: они отвечают на разные вопросы, поэтому решение большинством голосов неприменимо'
  question: В стеке ревью шесть обязательных гейтов. Пять вернули успех, гейт якоря — отказ. Инженер предлагает принять правку большинством голосов. В чём ошибка предложения?
  explanation: 'У гейтов нет общей шкалы: замороженная поверхность, инварианты, якорь, оси качества и регрессии измеряют несопоставимые вещи. Отличная устойчивость не компенсирует сдвинутую цель. Голосование превращает обязательные ограничения в пожелания, поэтому результаты объединяют логическим «И»: любой false отклоняет правку и ставит цикл на паузу.'
  kind: choice
  options:
    - Гейты проверяют разные свойства, и успех одного не несёт никаких сведений о свойстве, которое проверял отказавший
    - Большинство надо считать не по числу гейтов, а по их вычислительной стоимости
    - Голосование допустимо, если отказавший гейт оказался самым дешёвым в стеке
    - Правку следует принять, но пометить как условно одобренную
  correct: 0
  id: 026-review-stack-1
  fingerprint: 8fadf1c3
- concept: при конъюнктивном объединении добавление обязательного гейта может только сузить множество принимаемых правок
  question: К ревью, объединяющему результаты по «И», добавили ещё один обязательный гейт. Как меняется множество правок, которые ревью пропускает?
  explanation: 'Конъюнкция монотонна: добавление конъюнкта не может превратить false в true. Новый гейт способен отклонить часть ранее проходивших правок, но не способен допустить ни одной ранее отклонённой. Мягкость нового гейта влияет только на то, насколько сильно сузится множество — вплоть до нуля, если он не срабатывает никогда.'
  kind: choice
  options:
    - 'Оно может только сузиться: ранее отклонённая правка не станет проходить из-за нового гейта'
    - Оно может расшириться, если новый гейт мягче остальных
    - Оно не меняется, потому что вердикт уже определён прежними гейтами
    - Оно сужается ровно вдвое, поскольку каждый гейт делит поток пополам
  correct: 0
