- concept: инвариант — свойство обоих состояний, поэтому проверка только новой версии не даёт заявленной гарантии
  question: Гейт самомодификации проверяет набор инвариантов только на предложенной версии системы, исходное состояние не трогает. Что теряется при такой реализации?
  explanation: Инвариант определён как свойство, которое держится до и после каждой самомодификации. Прогон на обоих снимках — это и есть проверка этого определения; без снимка «до» гейт не отличает исправное исходное состояние от уже сломанного и молча узаконивает старое нарушение.
  kind: choice
  options:
    - 'Ничего: если инвариант выполнен на новой версии, значит система в порядке'
    - 'Нельзя утверждать, что свойство держится до и после правки: нарушение, уже присутствовавшее в исходном состоянии, пройдёт незамеченным'
    - 'Теряется только скорость: проверка исходного состояния всё равно всегда успешна'
    - Теряется возможность подсчитать, сколько инвариантов вообще есть в наборе
  correct: 1
  id: 008-gate-invariant-1
  fingerprint: ae9be400
- concept: допуск гейта — конъюнкция всех инвариантов, ранний выход по первому успеху ломает проверку
  question: Функция принимает снимки состояния и список функций-инвариантов. Заполни пропуск так, чтобы правка проходила только при выполнении каждого инварианта.
  explanation: Допуск — логическое И по всему набору. `any` пропустил бы кандидата после первого сработавшего инварианта, а успех одного свойства (например, совпавшего хеша оценщика) ничего не говорит про остальные — эндпоинты, путь записи в память. Останавливаться досрочно можно только на провале, не на успехе.
  kind: cloze
  template: |-
    def gate_invariant(before, after, invariants):
        return ___(inv(before) and inv(after) for inv in invariants)
  answer: all
  accept:
    - all
    - all()
  id: 008-gate-invariant-2
  fingerprint: 901fc96b
- concept: стоимость полного прохода гейта равна числу инвариантов, умноженному на число проверяемых снимков
  question: Гейт прогоняет 5 инвариантов, и каждый вычисляется отдельно на снимке до правки и на снимке после. Сколько вычислений проверок сделает гейт, если ни одна не провалилась?
  explanation: 'Каждый инвариант оценивается на обоих снимках: 5 × 2 = 10. Отсюда и требование выбирать инварианты, вычислимые за разумное время: дорогая проверка вроде «выход обусловлен конституцией» умножается на число снимков и тормозит каждый цикл самоулучшения.'
  kind: numeric
  answer: 10
  tolerance: 0.5
  id: 008-gate-invariant-3
