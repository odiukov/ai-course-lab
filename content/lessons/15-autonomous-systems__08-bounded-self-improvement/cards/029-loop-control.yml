- concept: 'предложение и применение — разные действия: состояние цикла меняется только после общего вердикта ревью'
  question: Расставь действия одной итерации ограниченного цикла самоулучшения в правильном порядке.
  explanation: 'Кандидат всё это время существует отдельно от рабочей версии. Схема «применить сейчас, проверить потом» ломает ограниченность цикла: запрещённая правка успевает стать активным состоянием. Предлагать можно сколько угодно раз, менять состояние — только после полного одобрения.'
  kind: order
  items:
    - Построить кандидата поверх последней полностью принятой версии
    - Проверить кандидата стеком обязательных гейтов, не трогая рабочую версию
    - Получить общий вердикт ревью по всем гейтам
    - Заменить рабочую версию кандидатом только при положительном вердикте
  id: 029-loop-control-1
  fingerprint: 751620df
- concept: 'отклонённый кандидат не становится базой: следующая попытка строится от последней принятой версии, поэтому история состояния состоит только из одобренных правок'
  question: Кандидат прошёл замороженную поверхность, инварианты и якорь, но провалился на последней, самой дорогой проверке. От чего строится следующая попытка улучшения?
  explanation: Успех на ранних гейтах — не накопленный кредит. Пока вердикт отрицателен, состояние не менялось, и базой остаётся последняя полностью принятая версия. Неудачный кандидат оставляет отчёт, а не след в системе; траектория цикла состоит только из правок, прошедших все обязательные ограничения.
  kind: choice
  options:
    - 'От прежней рабочей версии: пройденные гейты не дают отклонённому кандидату частичного статуса'
    - От отклонённого кандидата, поскольку три гейта из четырёх подтвердили его корректность
    - От отклонённого кандидата, но с пометкой «условно принят» до следующего ревью
    - От версии, собранной из принятых частей кандидата и прежней рабочей версии
