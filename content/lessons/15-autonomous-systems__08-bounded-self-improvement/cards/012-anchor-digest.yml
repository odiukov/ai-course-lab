- concept: 'нормализация внутри функции отпечатка подменяет проверяемый объект: разные якоря получают один digest'
  question: Функция отпечатка якоря выравнивания перед хешированием обрезает пробелы по краям и приводит текст к нижнему регистру. Чем это опасно?
  explanation: Отпечаток должен фиксировать сохранённое содержимое якоря, а не его причёсанную версию. Любая нормализация склеивает несколько разных текстов в один digest — то есть создаёт щель, через которую цикл может править цель, оставляя проверку зелёной.
  kind: choice
  options:
    - 'Ничем: косметические различия к цели не относятся, а digest становится устойчивее'
    - Тем, что разные варианты якоря дают одинаковый отпечаток, и правка, попадающая в зону нормализации, проходит проверку целостности незамеченной
    - Тем, что хеш перестаёт быть криптографическим и его можно обратить
    - Тем, что отпечаток станет длиннее и его дороже хранить
  correct: 1
  id: 012-anchor-digest-1
  fingerprint: a255ed9d
- concept: детерминизм отпечатка требует явно заданной кодировки и отсутствия примесей окружения
  question: Отпечаток якоря считают на разных машинах и через месяцы. Объясни своими словами, что должно и чего не должно попадать на вход хеш-функции, чтобы результат был воспроизводим.
  explanation: 'Смысл якоря — возможность точно сказать, осталась ли цель прежней. Это работает, только если отпечаток зависит ровно от содержимого и ни от чего больше: любая зависимость от окружения превращает несовпадение digest в шум, а не в сигнал тревоги.'
  kind: open
  reference: 'На вход идут только байты содержимого якоря. Строку нужно кодировать в фиксированную кодировку, заданную прямо в коде, а не полагаться на кодировку по умолчанию — иначе отпечаток зависит от локали и настроек машины. Ничего внешнего к содержимому подмешивать нельзя: ни путь к файлу, ни время изменения, ни имя пользователя, ни случайную соль — всё это меняется от запуска к запуску и делает отпечаток несравнимым. Функция должна быть чистой: одинаковые байты дают одинаковый результат в любом процессе.'
  id: 012-anchor-digest-2
  fingerprint: 299f3049
- concept: отпечаток возвращается в фиксированном текстовом виде, пригодном для хранения и сравнения с эталоном
  question: Заполни пропуск так, чтобы функция вернула отпечаток в стабильном текстовом представлении, которое можно положить в реестр эталонов и сравнить позже.
  explanation: Объект хеша сам по себе непригоден для хранения и сравнения между запусками; `hexdigest()` даёт фиксированную шестнадцатеричную строку. Эталон хранится в недоступном циклу месте, и сравнивать с ним нужно именно такое стабильное представление.
  kind: cloze
  template: |-
    def anchor_digest(anchor_bytes: bytes) -> str:
        return hashlib.sha256(anchor_bytes).___()
