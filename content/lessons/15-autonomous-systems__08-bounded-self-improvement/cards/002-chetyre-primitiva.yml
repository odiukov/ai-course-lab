- concept: каждый примитив закрывает свой класс провала, поэтому их берут в комбинации
  question: Изменение испытывают в изолированной среде, где нет доступа к боевым данным и внешним действиям. Что этот примитив принципиально не обеспечивает?
  explanation: Песочница ограничивает радиус последствий, но видит только то поведение, которое воспроизводится внутри неё. Редкий сценарий, зависящий от боевых данных или отложенный во времени, останется незамеченным — этот пробел закрывают инварианты, лимиты и откат, каждый со своей стороны.
  kind: choice
  options:
    - Ограничение последствий неудачного испытания
    - Обнаружение проблемы, которая не проявляется в условиях изоляции
    - Отделение испытательного окружения от продакшена
    - Возможность прогнать кандидата до его выпуска
  correct: 1
  id: 002-chetyre-primitiva-3
