- concept: лимиты ограничивают темп и масштаб изменений, но не качество отдельного изменения
  question: 'В цикл введён лимит: не более шести принятых обновлений в сутки и жёсткий потолок вычислений на попытку. Какой риск этот примитив не закрывает?'
  explanation: Лимит — это ограничитель темпа и масштаба, он ничего не знает о содержании правки. Плохое изменение, сделанное медленно и дёшево, проходит лимит без замечаний. За содержание отвечают инварианты и испытание в песочнице.
  kind: choice
  options:
    - Быстрый разгон, при котором надзор не успевает оценивать последствия
    - Одно вредное изменение, которое укладывается в лимит и принимается
    - Неограниченный расход вычислений на перебор кандидатов
    - Лавину мелких правок за короткий интервал
  correct: 1
  id: 002-chetyre-primitiva-1
  fingerprint: 9c4c5259
- concept: откат работает только при обратимом ущербе и обнаруженном сбое
  question: В системе сохраняется предыдущая рабочая версия для отката. В каком случае этот примитив не спасает?
  explanation: Откат возвращает состояние системы, но не отменяет уже случившееся во внешнем мире и не срабатывает, пока сбой не обнаружен. Поэтому откат — мера уменьшения цены отказа, а не средство его предотвращения.
  kind: choice
  options:
    - Кандидат упал на первом же запуске в песочнице
    - Кандидат ухудшил метрику, и это видно в мониторинге
    - Кандидат успел совершить внешнее действие с необратимыми последствиями, а деградация замечена лишь через несколько недель
    - Кандидат превысил лимит вычислений и был остановлен
  correct: 2
