- concept: 'порядок стека ревью: сверки байтов и хешей раньше прогонов по осям и сравнения с историей'
  question: Расставь проверки ограниченного цикла в том порядке, в каком их выгодно исполнять — от самых дешёвых к самым дорогим.
  explanation: 'Первые три проверки — сравнение путей, хешей и текста: исполнять систему не нужно. Оси и регрессии требуют прогонов на задачах, а регрессии вдобавок опираются на результаты этих прогонов. Гонять дорогие evals на правке, уже нарушившей инвариант, — потерянные ресурсы.'
  kind: order
  items:
    - Сверить список изменённых путей с перечнем замороженных объектов
    - 'Проверить инварианты: хеши модулей, манифест разрешений, шапка-конституция'
    - Сравнить активную формулировку цели с одобренным якорем
    - Прогнать кандидата по обязательным осям многокритериальной оценки
    - Сравнить по-задачные оценки с опорным окном и проверить допуск на просадку
