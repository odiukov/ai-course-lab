- concept: при конъюнктивном ревью порядок гейтов влияет на стоимость проверки, но не на итоговый вердикт
  question: 'Стек ревью переставили: дорогая многокритериальная оценка теперь идёт первой, сверка хешей — последней. Что изменится?'
  explanation: Итог — конъюнкция, а она не зависит от порядка сомножителей. Раннее положение в стеке не делает гейт важнее и не даёт ему веса; оно лишь определяет, сколько правок доживёт до дорогих проверок. Порядок — вопрос экономии, а не полномочий.
  kind: choice
  options:
    - Вердикт по каждой правке останется тем же, вырастет только средняя стоимость проверки
    - 'Часть правок, ранее отклонённых, начнёт проходить: первым гейтам придаётся больший вес'
    - Вердикт станет случайным, поскольку гейты зависят друг от друга
    - Дорогая оценка станет обязательной, а сверка хешей — рекомендательной
