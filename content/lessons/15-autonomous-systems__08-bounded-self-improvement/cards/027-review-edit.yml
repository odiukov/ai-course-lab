- concept: 'агрегатор вызывает готовые гейты, а не повторяет их условия у себя: копия правила расходится с оригиналом'
  question: Почему функция, собирающая общий вердикт ревью, должна вызывать уже написанные гейты, а не повторять их условия внутри себя? Объясни своими словами.
  explanation: 'Стек ревью полагается на то, что каждый класс сбоев закрывает ровно один механизм. Дублированная логика ломает это: расхождение двух версий условия — это тихая дыра, которая не видна ни в одном отдельном компоненте.'
  kind: open
  reference: 'Повторённое условие — вторая реализация того же правила. При правке гейта копия не меняется, и вердикт перестаёт соответствовать проверке, которую система декларирует: гейт запрещает, агрегатор пропускает. Правило становится непроверяемым — нет одного места, где записано, что именно считается допуском. Агрегатор отвечает только за объединение чужих решений в одно.'
  id: 027-review-edit-2
  fingerprint: a3bb6457
