- concept: отсутствие измерения по обязательной оси трактуется как непрохождение (fail-closed), а не как нейтральный результат
  question: Многокритериальный гейт должен проверить обязательную ось устойчивости, но прогон тестов упал и значения по этой оси нет вообще. Как корректно поступить с кандидатом?
  explanation: 'Гейт даёт допуск только по подтверждённому прохождению. Пустое значение — это неизвестность, а не успех: трактовка пропуска как «ок» открывает обход через поломку измерителя. Fail-closed: не смогли подтвердить — не пропускаем.'
  kind: choice
  options:
    - 'Отклонить кандидата: прохождение обязательной оси не подтверждено'
    - 'Пропустить ось и решить по остальным: отсутствие результата не является нарушением'
    - Подставить среднее значение этой оси за прошлые прогоны и сравнить его с границей
    - Принять кандидата условно и записать ось как пройденную с пометкой
  correct: 0
  id: 019-gate-multi-1
  fingerprint: 163761a5
- concept: 'направление сравнения задаётся смыслом оси: у метрик вреда допуск сверху, у метрик пользы — снизу'
  question: 'Ось безопасности измеряется долей выполненных заведомо вредных запросов: чем значение меньше, тем лучше. Каким сравнением закрывается эта ось?'
  explanation: 'Для метрики пользы граница нижняя (значение не ниже минимума), для метрики вреда — верхняя (значение не выше максимума). Механическое копирование `>=` на все оси превращает ось безопасности в свою противоположность: чем хуже модель, тем «легче» она проходит.'
  kind: cloze
  template: |-
    quality_ok = quality_score >= quality_min
    safety_ok = harmful_compliance_rate ___ harmful_rate_max
  answer: <=
  accept:
    - <=
    - ≤
    - < =
    - не больше
  id: 019-gate-multi-2
  fingerprint: 9ac058f5
- concept: ранний выход после первого провала не меняет вердикт, но лишает человека полного списка нарушенных осей
  question: Гейт с несколькими жёсткими ограничениями может прерваться на первой провалившейся оси, а может досчитать все оси. Чем различаются варианты?
  explanation: 'Итог одинаков: один провал уже даёт отказ. Разница чисто диагностическая — досчитанные оси показывают, всё ли сломала одна причина или нарушений несколько. Ранний выход экономит вычисление и платит за это потерей информации для разбора.'
  kind: choice
  options:
    - 'Вердикт различается: полный проход осей может изменить отказ на допуск'
    - Вердикт одинаков, но полный проход даёт разборщику весь набор нарушений, а не первое из них
    - Ранний выход обязателен, иначе гейт нарушает логику жёстких ограничений
    - Полный проход нужен только для того, чтобы усреднить оси и получить итоговый балл
  correct: 1
  id: 019-gate-multi-3
  fingerprint: 54a05a37
