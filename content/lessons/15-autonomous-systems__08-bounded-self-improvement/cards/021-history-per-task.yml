- concept: вклад просадки одной задачи в общий средний балл делится на размер набора, поэтому агрегат почти не шевелится
  question: Набор состоит из 50 задач, средний балл считается как обычное среднее. Оценка одной задачи упала с 0,60 до 0,30, остальные не изменились. На сколько уменьшится средний балл набора?
  explanation: 'Падение 0,30 делится на 50 задач: 0,30 / 50 = 0,006. Способность провалилась вдвое, а сводное число сдвинулось на шестую долю процента — такое смещение неотличимо от шума, поэтому регрессию ищут по каждой задаче отдельно.'
  kind: numeric
  answer: 0.006
  tolerance: 0.0005
  id: 021-history-per-task-1
  fingerprint: 443df4bd
- concept: по-задачные оценки сохраняют имя утраченной способности, агрегат сообщает только величину, но не адрес изменения
  question: Оценки по отдельным задачам хранят вместо одного сводного балла. Что даёт именно такое хранение?
  explanation: 'Агрегат отвечает на вопрос «как система справляется со всем набором». Он не хранит адрес изменения: усреднение стирает название способности. По-задачная история отвечает «что именно испортилось» — и только на такой вопрос человек может отреагировать при разборе.'
  kind: choice
  options:
    - Оно делает оценку каждой задачи точнее, чем при усреднении
    - Оно называет, какая именно способность изменилась, а не только насколько сдвинулся общий уровень
    - Оно уменьшает шум измерения, потому что наблюдений становится больше
    - Оно позволяет сравнивать задачи между собой и отбрасывать самые слабые
  correct: 1
