  question: Предложенная модификация трогает 7 файлов рабочей области и 1 файл из замороженной поверхности. Правки в рабочей области полезны и проходят тесты. Что должен вернуть гейт замороженной области?
  explanation: 'Полезность разрешённых правок не компенсирует прикосновение к запретной области, иначе цикл всегда сможет протащить нужное изменение в пакете с хорошими. Частичное применение — тоже не работа этого гейта: он даёт бинарный вердикт по всему предложению, а не редактирует его.'
  kind: choice
  options:
    - Отказ по всему предложению целиком
    - Пропуск, потому что большинство файлов разрешены
    - Пропуск с применением только 7 разрешённых файлов
