  question: Предложение приходит с пустым списком изменённых файлов. Как должен повести себя гейт замороженной области и почему?
  explanation: 'Гейт отвечает ровно на один механический вопрос: затронута ли запретная область. Пустой список её не затрагивает — отказа нет. Оценка осмысленности предложения и прогон новой версии — зона других примитивов, смешивать их в этом гейте значит размывать его границу ответственности.'
  kind: choice
  options:
    - 'Пропустить: пересечения с замороженными путями нет, значит нарушения нет'
    - 'Отклонить: пустое предложение подозрительно и может скрывать правку'
    - 'Отклонить: гейт обязан увидеть хотя бы один разрешённый файл'
