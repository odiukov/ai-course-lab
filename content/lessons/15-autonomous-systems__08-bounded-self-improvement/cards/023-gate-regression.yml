- concept: допуск задаётся долей от опорной оценки, поэтому нижняя граница равна опорному значению, умноженному на (1 − допуск)
  question: Опорная оценка задачи по истории равна 0,60, допустимая относительная просадка — 0,10. Какова нижняя допустимая оценка новой версии?
  explanation: '0,60 × (1 − 0,10) = 0,54. Допуск 0,10 — это десять процентов от опорного значения, а не десять процентных пунктов: вычитание 0,10 напрямую дало бы границу 0,50 и пропустило бы более глубокую просадку.'
  kind: numeric
  answer: 0.54
  tolerance: 0.001
  id: 023-gate-regression-1
  fingerprint: e9455d1b
- concept: опорное значение считается только по окну последних N наблюдений, вся история его искажает
  question: Окно задано равным 8 циклам, но в хранилище лежат оценки за 30 циклов, и функция берёт их все. Чем это плохо?
  explanation: 'Окно — это утверждение о том, какой уровень считается текущей нормой задачи. Оценки старше окна отражают другую версию системы: подмешанные в опорное значение, они и завышают, и занижают границу непредсказуемым образом.'
  kind: choice
  options:
    - 'Ничем: чем больше наблюдений, тем надёжнее опорное значение'
    - Опорный уровень начинают задавать давно устаревшие прогоны, хотя окно было выбрано специально, чтобы они не влияли
    - Вычисление станет медленнее, но вердикт останется прежним
    - Гейт перестанет различать отдельные задачи и начнёт усреднять их
  correct: 1
  id: 023-gate-regression-2
  fingerprint: e981122a
- concept: 'результат ровно на допустимой границе проходит: сравнение нестрогое'
  question: Просадка допустима, пока новая оценка не опустилась ниже вычисленной границы; значение ровно на границе считается прошедшим. Какое сравнение это выражает?
  explanation: Строгое `>` отклоняло бы кандидата, попавшего точно в допуск, — то есть фактически сдвигало бы заявленный порог. Граница входит в допустимую область, ниже неё — отказ.
  kind: cloze
  template: |-
    threshold = baseline * (1 - tolerance)
    passed = new_score ___ threshold
  answer: '>='
  accept:
    - '>='
    - ≥
    - не меньше
  id: 023-gate-regression-3
