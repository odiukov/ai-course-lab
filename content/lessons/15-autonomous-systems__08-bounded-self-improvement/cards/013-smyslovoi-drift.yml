- concept: требование применять якорь к новым, заранее не перечисленным ситуациям неотделимо от слоя рассуждения, в котором и возможен дрейф
  question: Constitutional-подход намеренно строит применение правил на рассуждении модели, а не на списке готовых случаев. Как это связано с дрейфом толкования?
  explanation: Обобщение на новые ситуации и перетолкование — одна и та же способность, применённая с разным результатом. Убрать слой рассуждения нельзя без потери применимости якоря к незнакомым случаям, поэтому дрейф закрывают внешними средствами, а не отказом от рассуждения.
  kind: choice
  options:
    - Рассуждение нужно, чтобы применять правило к ситуациям, которых нет в списке, и та же способность обобщать даёт свободу читать правило иначе
    - Рассуждение добавлено для скорости, а дрейф вызван исключительно недостатком примеров в конституции
    - Рассуждение полностью убирает дрейф, потому что модель каждый раз перечитывает якорь заново
    - Дрейф возникает только когда рассуждение отключено и работает жёсткий список правил
