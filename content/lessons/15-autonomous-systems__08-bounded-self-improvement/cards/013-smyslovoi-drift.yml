- concept: у толкования нет эталонного представления, с которым можно механически сравнить, поэтому приём «сверить с эталоном» на него не переносится
  question: Целостность якоря проверяют сравнением с заранее зафиксированным эталоном. Объясни, почему тот же приём не даёт проверки толкования якоря.
  explanation: 'Отсюда и вывод материала: проверить байты якоря легко, проверить толкование нечем. Якоря необходимы, но недостаточны.'
  kind: open
  reference: 'Сверка с эталоном требует, чтобы у проверяемого объекта было конечное фиксированное представление и заранее сохранённое эталонное значение. У байтов якоря это есть: содержимое читается, отпечаток считается, сравнивается с недоступной циклу записью. У толкования такого представления нет — оно проявляется только как поведение на конкретных случаях, множество которых заранее не перечислено, и «правильное толкование» негде записать в виде эталона. Поэтому механическая проверка даёт ответ лишь про носитель цели, а про смысл, извлечённый из носителя, нужны другие средства: выборочная оценка решений, независимый оценщик, разбор трудных случаев человеком.'
  id: 013-smyslovoi-drift-2
