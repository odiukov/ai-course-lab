- concept: любой конечный вес в скалярной свёртке оставляет возможность обмена, поэтому веса не превращают ось в жёсткое ограничение
  question: Инженер предлагает не вводить отдельный порог по безопасности, а просто дать безопасности намного больший вес в общем балле. Объясни, что это меняет и чего не меняет.
  explanation: Веса задают обменный курс между осями; жёсткое ограничение как раз объявляет, что обмена по этой оси нет. Поэтому пороги ставят отдельно от рейтинга, а рейтингом сравнивают только уже допущенных кандидатов.
  kind: open
  reference: 'Больший вес меняет цену провала: чтобы перевесить падение безопасности, нужен более крупный прирост остальных осей. Но сам обмен остаётся возможным — при любом конечном весе существует достаточный рост других показателей, который делает суммарный балл выше исходного при нарушенной безопасности. Оптимизирующий цикл ищет именно такие точки. Проблема не в подборе коэффициентов, а в том, что свёртка в одно число теряет различие между вопросами «насколько версия хороша в целом» и «есть ли здесь недопустимый провал». Жёсткое ограничение выражается порогом с правом вето, который проверяется до и независимо от любой агрегации.'
  id: 017-all-objectives-2
  fingerprint: 1e738aec
- concept: оптимизация одного скалярного показателя выгодно закрывается коротким путём, а набор жёстких ограничений сокращает множество таких путей
  question: Почему цикл самоулучшения, максимизирующий одно скалярное число, склонен находить короткие пути, и что меняет требование одновременно удерживать несколько жёстких ограничений?
  explanation: Цикл оптимизирует то, что измеряется, а не то, что имелось в виду. Каждая дополнительная ось с правом вето убирает часть решений, которые выигрывали по одной мерке и проигрывали по остальным.
  kind: choice
  options:
    - Любое поведение, поднимающее этот показатель, считается улучшением, включая обход замысла метрики; несколько ограничений сразу отсекают решения, которые поднимают одно за счёт другого
    - Один показатель считается дольше, поэтому цикл экономит вызовы и проверяет меньше вариантов
    - Скалярный показатель всегда шумный, а несколько ограничений усредняют шум и дают более точную оценку
    - 'Проблема в масштабе показателя: короткие пути исчезают после нормировки балла к диапазону от нуля до единицы'
