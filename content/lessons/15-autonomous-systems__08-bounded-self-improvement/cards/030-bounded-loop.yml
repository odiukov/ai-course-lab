- concept: 'лимит итераций считает все попытки, включая отклонённые: число принятых версий меньше числа проходов цикла'
  question: Ограниченный цикл самоулучшения отработал лимит в 13 итераций. Ревью отклонило кандидата на 6 итерациях. Сколько правок вошло в действующую версию системы?
  explanation: '13 − 6 = 7. Лимит ограничивает число попыток, а не число принятых улучшений: отклонённая итерация тратит бюджет цикла, но не меняет состояние. Путать эти величины опасно — «система прошла 13 шагов улучшения» звучит как 13 применённых правок.'
  kind: numeric
  answer: 7
  tolerance: 0.5
  id: 030-bounded-loop-1
  fingerprint: 666c7bff
- concept: 'причинная атрибуция класса сбоев требует абляции: меняется один переключатель при прочих равных'
  question: Нужно показать, что конкретный примитив безопасности отвечает за конкретный класс сбоев. Какой прогон это подтверждает?
  explanation: 'Абляция: изменение одного фактора при прочих равных. Прогон со всеми включёнными примитивами не отделяет вклад одного от вклада соседей, прогон со всеми выключенными не показывает, какой сбой чей, а рост балла ничего не говорит о классе перехваченных сбоев.'
  kind: choice
  options:
    - 'Два прогона, отличающиеся только состоянием переключателя этого примитива: без него соответствующий класс сбоев проходит в состояние'
    - 'Один прогон со всеми включёнными примитивами: сбоев нет, значит примитив работает'
    - 'Прогон с выключенными всеми примитивами: видно сразу весь набор сбоев'
    - 'Прогон с новым примитивом, добавленным поверх остальных: рост итогового балла подтверждает вклад'
  correct: 0
  id: 030-bounded-loop-2
  fingerprint: bf2e1985
- concept: переключатели примитивов меняют состав проверок в ревью, а не правило применения правки
  question: В ограниченном цикле выключили один из примитивов безопасности. Что меняется в механике итерации?
  explanation: 'Переключатели управляют составом ревью — какие гейты участвуют в вердикте. Само применение остаётся условным: состояние заменяется только при положительном вердикте, каким бы коротким ни стал стек. Варианты с временным применением и откатом как раз и превращают цикл в неограниченный.'
  kind: choice
  options:
    - Из вердикта ревью выпадает соответствующий гейт; правило «применять только при допуске» остаётся прежним
    - Кандидат применяется сразу, а проверка переносится на следующую итерацию
    - Правка применяется временно и откатывается, если остальные гейты откажут
    - Отклонённый кандидат становится базой для следующей попытки, раз проверок стало меньше
  correct: 0
  id: 030-bounded-loop-3
