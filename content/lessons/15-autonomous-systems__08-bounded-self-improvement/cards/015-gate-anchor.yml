- concept: эталон, поставляемый вместе с проверяемым предложением, делает сравнение тавтологией, а не проверкой
  question: 'Инженер добавил в пакет предложения на самоулучшение два поля: новый файл якоря выравнивания и его отпечаток, посчитанный тем же пакетом. Гейт сравнивает эти два поля между собой. Объясни своими словами, что именно перестаёт проверять такой гейт и почему подмена цели проходит.'
  explanation: 'Ключ — кто контролирует обе стороны сравнения. Если и объект, и эталон приходят от проверяемой стороны, равенство всегда достижимо и ничего не говорит о верности исходной цели. Тот же дефект возникает, если эталон пересчитывать из живого файла якоря: цикл, способный писать в этот файл, снова управляет обеими половинами.'
  kind: open
  reference: 'Гейт начинает проверять внутреннюю согласованность предложения: что приложенный отпечаток соответствует приложенному файлу. Это свойство автор предложения выполняет тривиально — переписал цель, пересчитал хеш, приложил. Утверждение «активная цель совпадает с одобренной» при этом не проверяется вовсе, потому что одобренная версия в сравнении больше не участвует. Проверка имеет смысл только когда эталонный отпечаток берётся с доверенной стороны — из конфигурации или хранилища вне поверхности, куда цикл может писать; тогда сторона, предлагающая изменение, не контролирует обе половины сравнения.'
  id: 015-gate-anchor-2
  fingerprint: f29f7995
