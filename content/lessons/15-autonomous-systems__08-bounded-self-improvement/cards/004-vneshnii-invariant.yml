- concept: сверка хеша модуля ловит любую правку модуля вплоть до одного байта
  question: Цикл самоулучшения предлагает новую версию себя и утверждает, что модуль оценщика он не трогал, а лишь переформатировал в нём отступы. Какой инвариант отклонит такое предложение без разбора его содержимого?
  explanation: Хеш меняется от любого изменённого байта, включая пробелы и отступы, поэтому «косметическая» правка оценщика неотличима от смысловой и отклоняется механически. Балл на бенчмарке и объяснения даёт сам цикл, а число строк легко сохранить при подмене содержимого.
  kind: choice
  options:
    - Сверка криптографического хеша модуля оценщика с одобренным эталоном
    - Проверка, что новая версия набирает на бенчмарке балл не ниже прежнего
    - Проверка, что объяснение правки от цикла не содержит противоречий
    - Проверка, что число строк в модуле оценщика не изменилось
  correct: 0
  id: 004-vneshnii-invariant-1
  fingerprint: 39db52c1
- concept: инварианты различаются по стоимости вычисления, и дорогие тормозят цикл
  question: 'Команда держит набор инвариантов: хеш модуля оценщика, список авторизованных эндпоинтов для вызовов инструментов, подписанный путь записи в память и обусловленность выхода фиксированной шапкой-конституцией. Какой из них станет узким местом по времени?'
  explanation: Хеш, адрес эндпоинта и путь записи — сравнение строк и байтов, миллисекунды. Обусловленность выхода конституцией требует прогонять генерацию и проверять её свойства, то есть полноценную проверку поведения; именно на таких инвариантах цикл начинает тормозить.
  kind: choice
  options:
    - Обусловленность выхода фиксированной шапкой-конституцией
    - Сверка хеша модуля оценщика
    - Проверка адреса эндпоинта у вызова инструмента
    - Проверка пути записи в память
  correct: 0
  id: 004-vneshnii-invariant-2
  fingerprint: cec34960
- concept: перезакрученный набор инвариантов останавливает прогресс, недозакрученный пропускает важные свойства
  question: Инженер предлагает завести 40 инвариантов «на всякий случай», его коллега — оставить два самых простых. Объясни своими словами, чем плох каждый из вариантов и по какому критерию выбирают набор инвариантов.
  explanation: 'Оба края одинаково нерабочие. Практический ориентир: брать свойства, которые и защищают что-то конкретное, и проверяются дёшево (хеш, эндпоинт, путь записи), а дорогие поведенческие проверки добавлять осознанно, понимая цену в скорости.'
  kind: open
  reference: 'Инвариант — свойство, которое должно держаться до и после каждой самомодификации; нарушившее его предложение отклоняется. Слишком строгий набор блокирует почти любую модификацию и делает проверку дорогой по времени — прогресс встаёт, а цикл теряет смысл. Слишком слабый набор пропускает изменения, ломающие важные свойства безопасности. Набор выбирают по двум условиям сразу: свойство действительно нужно для безопасности и его можно вычислить за разумное время.'
  id: 004-vneshnii-invariant-3
  fingerprint: 7bba9037
