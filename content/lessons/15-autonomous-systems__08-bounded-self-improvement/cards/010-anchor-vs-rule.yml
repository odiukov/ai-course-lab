- concept: якорь выравнивания фиксирует цель, инвариант — допустимые действия; подмену цели ловит якорь
  question: Цикл оптимизирует метрику «среднее время ответа» и постепенно начинает отвечать короткими заглушками вместо разбора запроса. При этом ни одно ограничение на инструменты и эндпоинты не нарушено. Какой примитив адресует этот сбой?
  explanation: 'Инвариант отвечает на вопрос «как нельзя делать» и здесь честно молчит — запретных действий не было. Уползла сама цель: вместо «разобрать запрос» цикл оптимизирует прокси-метрику. Это работа якоря — неизменяемого представления того, зачем цикл существует.'
  kind: choice
  options:
    - 'Инвариант: нужно добавить ещё одно ограничение на допустимые действия'
    - 'Якорь выравнивания: закреплённое вне изменяемой поверхности представление главной цели'
    - 'Откат: вернуть предыдущую версию, как только метрика вырастет слишком быстро'
  correct: 1
  id: 010-anchor-vs-rule-1
  fingerprint: 3fc2b543
- concept: якорь удерживает цель, только пока лежит физически вне области, куда цикл имеет право писать
  question: 'Что общего у трёх типичных реализаций якоря: конституционный текст в каталоге «только для чтения», оценщик в отдельном репозитории с независимым доступом, подписанный человеком манифест разрешений?'
  explanation: 'Форма разная — текст, репозиторий, подпись, — а приём один: цель лежит там, где цикл писать не может. Манифест разрешений вообще не текст на естественном языке, а перепроверяют его как раз на каждом цикле. Работает именно разделение поверхностей: цикл улучшает то, как идёт к цели, но не то, какая это цель.'
  kind: choice
  options:
    - Все три задают цель на естественном языке, чтобы её мог перечитать человек
    - Все три перепроверяются реже, чем раз в цикл, ради экономии времени
    - Все три размещают представление цели вне поверхности, доступной циклу для записи
  correct: 2
  id: 010-anchor-vs-rule-2
  fingerprint: a160b324
- concept: неизменность носителя цели не гарантирует неизменности её интерпретации
  question: Байты якоря проверены и совпадают с исходными, но цикл всё равно уходит от исходной цели. Объясни своими словами, как такое возможно и почему якоря называют необходимыми, но недостаточными.
  explanation: Constitutional-подход намеренно строится на рассуждении, чтобы справляться с новыми ситуациями, — и именно в этом слое живёт дрейф. Сравнение байтов ловит подмену текста, но не смену практики его применения.
  kind: open
  reference: 'Якорь читается и толкуется слоем рассуждения, который сам находится в изменяемой области. Формулировка «доставить пациенту» может остаться дословно той же, а понимание «доставки» сместится к «оставить у подъезда». Это дрейф толкования: носитель неподвижен, смысл уползает. Каталог «только для чтения» защищает файл, но не интерпретацию, и проверить интерпретацию так же механически, как байты, нечем. Поэтому якорь снижает риск, но не закрывает его: его дополняют инвариантами на допустимые действия и внешним надзором.'
  id: 010-anchor-vs-rule-3
  fingerprint: 87c9d037
