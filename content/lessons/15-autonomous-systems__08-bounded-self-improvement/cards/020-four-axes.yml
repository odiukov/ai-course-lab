- concept: свойство, для которого не задана измеряемая ось с границей, гейтом не контролируется вообще
  question: Гейт проверяет качество, безопасность и устойчивость, но оси справедливости в нём нет — измерений по подгруппам никто не собирает. Что это означает для свойства «справедливость» в таком цикле?
  explanation: Гейт — механический сопоставитель значений с границами. Неизмеряемое для него не существует, поэтому неявные ожидания («ну она же не станет хуже к подгруппам») ничем не защищены.
  kind: open
  reference: 'Свойство остаётся неконтролируемым: гейт может дать допуск только по тем осям, для которых есть измерение и заранее заданная граница. Отсутствие оси не означает, что свойство держится, — оно означает, что о нём ничего не известно, и цикл волен ухудшать его сколько угодно, пока остальные оси проходят. Чтобы свойство удерживалось, нужны и способ его измерить, и порог допуска, зафиксированный до прогона.'
  id: 020-four-axes-3
