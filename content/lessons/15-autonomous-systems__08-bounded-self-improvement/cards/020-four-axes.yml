- concept: оси меняются независимо, поэтому утверждение «версия лучше» бессмысленно без указания оси
  question: 'Отчёт по новой версии сообщает: «модель стала лучше». Почему такая формулировка не годится как основание для допуска?'
  explanation: 'Правка может одновременно поднять полезное качество и уронить отказы на вредных запросах или поведение на искажённом входе. Одномерного «лучше» не существует: осмысленное утверждение всегда именует ось и её границу.'
  kind: choice
  options:
    - Потому что в ней не указано, на сколько именно выросла оценка
    - 'Потому что улучшение на одной оси ничего не говорит об остальных: они меняются независимо и могли просесть'
    - Потому что решение принимает человек, а не отчёт
    - Потому что оценки всегда шумные и любой рост может оказаться случайным
  correct: 1
