- concept: 'отсутствие сбоя после отключения гейта не доказывает его ненужность: вывод ограничен покрытием прогнанной выборки правок'
  question: Инженер выключил один гейт стека, прогнал через цикл очередь из 40 правок при прочих равных и не увидел ни одного пропущенного дефекта. Какой вывод корректен?
  explanation: 'Абляция информативна асимметрично: появившийся сбой указывает на зону ответственности выключенного гейта, а чистый прогон говорит только о содержимом выборки. 40 правок могли просто не содержать подходящего дефекта.'
  kind: choice
  options:
    - Гейт не задерживает ничего и его можно удалить из стека
    - В этой очереди не встретилось правки того класса, который гейт ловит; про его ненужность вывода нет
    - Гейт дублируется другим гейтом стека
    - Оставшиеся гейты доказанно покрывают его зону ответственности
  correct: 1
  id: 031-ablation-1
  fingerprint: 4d230e01
- concept: класс наблюдаемого сбоя опознаёт, какой именно гейт отсутствует
  question: 'При отключённом одном гейте правка принимается: агрегатная метрика растёт, а измеренная безопасность падает ниже своего порога, при этом ни одна историческая задача не просела. Какой гейт был выключен?'
  explanation: 'Симптом «рост одной оси при пробое порога обязательной другой» — сигнатура отсутствующего многокритериального ограничения. Гейт регрессий дал бы другой симптом: падение конкретной прежней задачи при нормальных осях.'
  kind: choice
  options:
    - Гейт регрессий
    - Многокритериальный гейт
    - Гейт замороженной поверхности
    - Гейт целостности якоря
  correct: 1
  id: 031-ablation-2
  fingerprint: 461e4bc9
