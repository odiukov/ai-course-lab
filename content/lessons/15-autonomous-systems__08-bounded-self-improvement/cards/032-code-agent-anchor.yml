- concept: текст якоря пригоден, только если каждое его требование отображается в механическую проверку
  question: Почему формулировка якоря «улучшай код» непригодна, а «сохраняй наблюдаемое поведение; не удаляй и не ослабляй тесты; не изменяй CI и политики безопасности; при конфликте останавливайся и запрашивай ревью» — пригодна? Объясни своими словами.
  explanation: Якорь задаёт назначение правки, но работает только через проверки. Требование, для которого нельзя указать проверку, вердикта не даёт и в гейт не превращается.
  kind: open
  reference: '«Улучшай код» не задаёт наблюдаемого признака нарушения: удаление медленных тестов и отключение проверки в CI формально проходят как улучшение. Операционная формулировка разложена на требования, каждое из которых сопоставимо с конкретной механической проверкой (диффы тестовых файлов, диффы конфигурации CI, сравнение поведения, условие остановки). Пригодность текста якоря определяется тем, можно ли по нему построить проверку, дающую бинарный вердикт, а не тем, насколько правильно он звучит.'
