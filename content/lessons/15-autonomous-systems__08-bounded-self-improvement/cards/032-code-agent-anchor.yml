- concept: вердикт о совпадении якоря бинарен и не делегируется семантическому судье
  question: Сверка активного текста якоря с каноническим дала несовпадение хеша. Что должен сделать гейт?
  explanation: Смысл сверки по хешу в том, что вердикт механический. Замена его суждением «похоже по смыслу» возвращает ровно тот дрейф толкования, ради исключения которого якорь и вводили. Обновление эталона под предложенный текст превращает проверку в тавтологию.
  kind: choice
  options:
    - Отклонить правку
    - Передать оба текста модели и спросить, сохранился ли смысл
    - Принять правку, если различие только в формулировках
    - Обновить канонический хеш под активный текст и продолжить
