- concept: величина допуска — компромисс между ложными тревогами на шуме и пропуском настоящей деградации
  question: Инженер сужает допустимую просадку с 8% до 1%. Какое последствие наиболее вероятно?
  explanation: Оценки шумят от прогона к прогону. Узкий допуск ловит этот шум и даёт ложные тревоги, широкий пропускает реальную потерю способности. Значение порога — настройка чувствительности, а не утверждение о том, что просадка внутри него безопасна.
  kind: choice
  options:
    - Гейт станет чаще останавливать цикл на обычных колебаниях оценки
    - Гейт станет точнее измерять способности модели
    - Гейт перестанет реагировать на настоящие регрессии
    - Гейт начнёт сравнивать задачи между собой вместо сравнения с историей
  correct: 0
  id: 022-regression-gate-1
  fingerprint: 70e886cb
- concept: опорным уровнем служит распределение оценок за окно последних циклов, а не единственный предыдущий результат
  question: Почему гейт регрессий сравнивает новую оценку задачи с её оценками за последние 12 циклов, а не с результатом одного предыдущего цикла?
  explanation: Один прогон — это одно наблюдение шумной величины. Случайно удачный предыдущий цикл сделал бы нормальную новую оценку «просадкой», случайно провальный — скрыл бы настоящую. Окно показывает привычный уровень задачи, от которого и отсчитывается допуск.
  kind: choice
  options:
    - Потому что за 12 циклов накапливается больше задач для сравнения
    - Потому что одиночное прошлое измерение само шумное и случайно высокий или низкий прогон исказит вердикт
    - Потому что старые оценки надёжнее свежих
    - Потому что так гейт учитывает изменения в других задачах набора
  correct: 1
  id: 022-regression-gate-2
  fingerprint: a92b6bdc
- concept: срабатывание гейта регрессий останавливает автоматическое принятие и передаёт кандидата человеку
  question: Просадка по одной задаче вышла за допуск. Что делает гейт регрессий?
  explanation: 'Гейт — не диагност, он лишь фиксирует, что наблюдение вышло за заранее заданную границу. Дальше требуется человек: просадка может оказаться и настоящей потерей способности, и артефактом измерения. Подгонка порога под неудобный результат превращает проверку в формальность.'
  kind: choice
  options:
    - 'Ставит цикл на паузу: правка не принимается автоматически и уходит на разбор человеку'
    - Автоматически откатывает модель к версии годичной давности
    - Уменьшает вес этой задачи в наборе и продолжает цикл
    - Расширяет допуск до величины наблюдённой просадки и пропускает кандидата
  correct: 0
  id: 022-regression-gate-3
  fingerprint: 20b9293c
