- concept: 'колмогоровская сложность: для сложной программы кратчайшее точное описание поведения сопоставимо с ней самой'
  question: Почему для произвольной сложной программы не стоит рассчитывать на короткий «паспорт поведения», из которого выводились бы все её будущие действия?
  explanation: Колмогоровская сложность — длина кратчайшего точного описания. Для несжимаемых объектов она близка к размеру самого объекта, поэтому компактной сводки, эквивалентной полному поведению, может просто не существовать. Отсюда и невозможность заменить программу коротким сертификатом её поведения.
  kind: choice
  options:
    - Кратчайшее точное описание такого объекта может быть почти столь же длинным, как сама программа
    - Потому что программа написана на языке высокого уровня, а не в байткоде
    - Потому что описание пришлось бы переписывать после каждого запуска
    - Потому что по хешу программы нельзя восстановить исходный код
  correct: 0
