- concept: явные проверки не дают гарантии, но переводят обход ограничения из бесшумного в наблюдаемое событие
  question: Формальных гарантий безопасности потомков получить нельзя. Объясни своими словами, что тогда даёт цепочка явных проверок вокруг цикла самоулучшения.
  explanation: Ключевое различие — «взял вещь с открытой полки» против «вскрыл шкаф с пломбой». Результат может совпасть, но во втором случае остаются следы. Доказывать локальные свойства конкретной правки можно; сложить их в полную гарантию для всех будущих версий — нет.
  kind: open
  reference: 'Проверки не делают цикл доказуемо безопасным и не останавливают достаточно мощного нарушителя. Они меняют стоимость и заметность отказа: без явной проверки уползший или злонамеренный цикл проходит бесшумно, пользуясь её отсутствием, а с ней обязан активно сломать конкретный барьер — соврать про хеш, подменить эталон, обойти оценщик. Такое действие оставляет след: срабатывание, расхождение, запись в логе. То есть покупается не гарантия, а наблюдаемость: тихий обход превращается в событие, которое можно увидеть и разобрать.'
  id: 025-formal-limits-3
  fingerprint: ebe2f371
