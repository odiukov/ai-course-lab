- concept: аудит примитива трассирует путь от объявления до препятствия на применяемой правке
  question: Расставь шаги аудита одного заявленного примитива в порядке выполнения.
  explanation: 'Каждый шаг отсеивает свой способ провалить примитив: код отсутствует, код не вызывается, вызов не влияет на решение, контролёр правится самим циклом. Пропуск любого шага оставляет обещание из документации непроверенным.'
  kind: order
  items:
    - Найти конкретный код проверки, реализующий примитив
    - Найти место вызова этого кода на пути применения правки
    - Убедиться, что отрицательный результат проверки не даёт правке примениться
    - Проверить, лежит ли этот код вне области, куда цикл имеет право писать
  id: 033-implementation-audit-1
  fingerprint: dee5e356
- concept: запись отказа в журнал без блокировки применения — наблюдение, а не ограничение
  question: Гейт вызывается на каждой правке, его отрицательный результат аккуратно пишется в журнал, после чего правка применяется. Как это классифицировать при аудите?
  explanation: Проверка действительно исполняется, поэтому это не пустая галочка, но ограничением она становится только когда провал меняет решение. Пока применение продолжается при любом вердикте, чемодан проезжает мимо сканера с включённой лампой.
  kind: choice
  options:
    - 'Примитив реализован: проверка исполняется на каждой правке'
    - 'Примитив реализован частично — как телеметрия, но не как ограничение: он ничего не запрещает'
    - Примитив реализован, если журнал читает человек раз в сутки
    - Примитив не реализован, потому что проверка вообще не выполняется
  correct: 1
  id: 033-implementation-audit-2
  fingerprint: 4a90da10
- concept: аудит прав записи покрывает не только код гейта, но и его эталонные данные и обработчик отказа
  question: Код гейта лежит в замороженной области. Что ещё обязан проверить аудитор, прежде чем считать примитив неизбежным препятствием?
  explanation: 'Ослабить контролёра можно, не трогая его код: подменить порог, переписать ожидаемый хеш или сделать так, чтобы отказ обрабатывался как предупреждение. Неизменяемый код с изменяемым эталоном даёт ту же дыру, что и изменяемый гейт.'
  kind: choice
  options:
    - Читаемость и покрытие комментариями кода гейта
    - Что эталонные данные гейта (пороги, ожидаемые хеши, исторические оценки) и код обработки отказа тоже недоступны циклу для записи
    - Что гейт вызывается первым в стеке
    - Что гейт возвращает подробное сообщение об ошибке
  correct: 1
  id: 033-implementation-audit-3
  fingerprint: 49a8178a
