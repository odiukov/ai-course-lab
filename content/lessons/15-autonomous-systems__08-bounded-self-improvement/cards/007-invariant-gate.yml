- concept: нарушение инварианта отклоняет кандидата независимо от роста метрики качества
  question: Кандидат на самомодификацию поднял оценку качества с 62 до 91 балла, но один из его вызовов инструмента уходит на эндпоинт вне списка разрешённых. Каким будет решение гейта инвариантов?
  explanation: Гейт инвариантов и оценщик отвечают на разные вопросы. Оценщик меряет полезность, инвариант задаёт допустимость. Кандидат, нарушивший обязательное свойство, отклоняется при любом балле — иначе достаточно найти модификацию с большим приростом, чтобы купить себе любое нарушение.
  kind: choice
  options:
    - 'Принять: прирост оценки перекрывает единичное отклонение'
    - 'Отклонить: инвариант нарушен, а величина прироста в решение не входит'
    - Принять с пометкой, чтобы следующий цикл сам вернул эндпоинт в список
  correct: 1
  id: 007-invariant-gate-1
  fingerprint: 7391d0c2
- concept: провал инварианта на исходном состоянии означает переход в восстановление, а не продолжение обычного цикла
  question: Инвариант проверяют на состоянии до правки и на кандидате. Проверка провалилась уже на состоянии до правки. Что это значит для цикла?
  explanation: 'Проверка «до» отвечает за исходную точку. Если свойство не держится ещё до правки, любое сравнение «до/после» бессмысленно: система уже вне допустимой области, и наращивать поверх неё изменения — значит закреплять нарушение. Различение двух исходов и даёт диагностику: сломал кандидат или было сломано раньше.'
  kind: choice
  options:
    - Кандидат виноват в нарушении и должен быть отклонён как источник проблемы
    - Систему можно улучшать дальше, раз кандидат ничего нового не сломал
    - 'Исходная точка уже недопустима: обычное самоулучшение продолжать нельзя, нужен отдельный режим восстановления'
  correct: 2
  id: 007-invariant-gate-2
  fingerprint: 650d8c3b
- concept: гейт сверяет фиксированный список свойств, а не произвольные различия между версиями
  question: Кандидат отличается от текущей версии сотнями строк кода, но гейт инвариантов его пропускает. Объясни своими словами, почему объём различий сам по себе не является поводом для отказа.
  explanation: Гейт даёт гарантию ровно по перечисленным свойствам — ни больше, ни меньше. Поэтому запрет формулируется как список проверок, а разрешение — как всё остальное.
  kind: open
  reference: 'Гейт не сравнивает версии целиком и не измеряет размер diff. Он применяет к обоим состояниям заранее выбранный список проверок свойств: адреса вызовов входят в разрешённый список, записи в память идут подписанным путём, хеш оценщика равен одобренному. Различия, не затрагивающие ни одно из этих свойств, — это как раз та изменяемая область, ради которой цикл и существует. Обратная сторона: свойство, не попавшее в список, гейт не защищает, каким бы важным оно ни было.'
  id: 007-invariant-gate-3
  fingerprint: e15854d5
