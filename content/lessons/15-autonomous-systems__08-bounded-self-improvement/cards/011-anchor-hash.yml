- concept: 'порядок сверки якоря: чтение содержимого, вычисление хеша, сравнение с эталоном из недоступного циклу хранилища, допуск'
  question: Расставь шаги сверки якоря перед очередной итерацией цикла.
  explanation: Ключевое — что сверка идёт заново на каждой итерации и до допуска к правке. Одноразовая проверка при настройке ничего не говорит о состоянии якоря в момент, когда цикл начинает себя менять.
  kind: order
  items:
    - Прочитать текущее содержимое якоря перед началом очередной самомодификации
    - Вычислить хеш прочитанного содержимого
    - Сравнить полученное значение с эталонным хешем, хранящимся там, куда цикл писать не может
    - Допустить цикл к правке только при совпадении, иначе остановить попытку
  id: 011-anchor-hash-1
  fingerprint: ff3edcc8
- concept: 'сверка идёт по содержимому: имя, каталог и атрибуты файла ничего не подтверждают'
  question: Файл якоря лежит по прежнему пути, называется так же, имеет флаг «только для чтения», но его хеш не совпал с эталоном. Что делает система?
  explanation: 'Атрибут «только для чтения» — заявление о конфигурации, а не наблюдение: он мог быть снят и возвращён обратно. Проверяемое условие ровно одно — совпадение хеша содержимого. Пересчёт эталона по текущему файлу превращает проверку в тавтологию: она всегда будет проходить.'
  kind: choice
  options:
    - 'Останавливает попытку: сверяется содержимое, а расположение и атрибуты файла ничего не подтверждают'
    - 'Продолжает работу: совпадения пути и имени достаточно, чтобы считать якорь тем же'
    - Пересчитывает эталон по текущему файлу и продолжает, раз каталог помечен как read-only
  correct: 0
  id: 011-anchor-hash-2
  fingerprint: 7a5bd9ae
- concept: сверка целостности якоря не оценивает содержание цели
  question: Хеш якоря совпал с эталоном. Что именно этим подтверждено?
  explanation: Совпадение хеша — узкое утверждение об идентичности байтов. Плохо сформулированная цель даст стабильный хеш ровно так же, как хорошая, а дрейф толкования вообще не затрагивает содержимое файла. Целостность и корректность — разные вопросы, и сверка отвечает только на первый.
  kind: choice
  options:
    - Что зафиксированная цель корректна и безопасна для цикла
    - Что толкование цели циклом не изменилось с прошлого запуска
    - Что проверяемое содержимое якоря не изменилось относительно зафиксированного
  correct: 2
  id: 011-anchor-hash-3
  fingerprint: aa9e9610
