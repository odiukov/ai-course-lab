<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Четыре обязательные оси одной правки</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fa;
      --panel: #ffffff;
      --panel-soft: #f1f4f7;
      --ink: #17202a;
      --muted: #5f6b78;
      --line: #c8d0d9;
      --line-strong: #8c99a6;
      --good: #16784b;
      --good-soft: #e4f4eb;
      --bad: #ba2f3b;
      --bad-soft: #fbe8ea;
      --accent: #285ca8;
      --accent-soft: #e8f0fb;
      --white: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #11161c;
        --panel: #1a222b;
        --panel-soft: #202a35;
        --ink: #eef3f7;
        --muted: #aeb9c4;
        --line: #3a4755;
        --line-strong: #6f7d8b;
        --good: #6dd5a3;
        --good-soft: #173a2d;
        --bad: #ff8791;
        --bad-soft: #48242a;
        --accent: #91baff;
        --accent-soft: #203754;
        --white: #ffffff;
      }
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .frame {
      box-sizing: border-box;
      width: 100%;
      max-width: 960px;
      margin: auto;
      padding: 16px 20px 12px;
      background: var(--page);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 750;
      letter-spacing: -0.01em;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      overflow: visible;
      background: var(--panel);
      border: 1px solid var(--line);
    }

    .panel {
      fill: var(--panel);
      stroke: var(--line);
      stroke-width: 2;
    }

    .header-fill {
      fill: var(--panel-soft);
    }

    .safety-fill {
      fill: var(--bad-soft);
    }

    .probability-fill {
      fill: var(--accent-soft);
      stroke: var(--accent);
      stroke-width: 2;
    }

    .reject-fill {
      fill: var(--bad-soft);
      stroke: var(--bad);
      stroke-width: 2;
    }

    .grid {
      fill: none;
      stroke: var(--line);
      stroke-width: 1;
    }

    .spine {
      fill: none;
      stroke: var(--line-strong);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arrow {
      fill: none;
      stroke: var(--bad);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arrow-head {
      fill: var(--bad);
      stroke: none;
    }

    .axis-name {
      fill: var(--ink);
      font-size: 14px;
      font-weight: 700;
    }

    .cell {
      fill: var(--ink);
      font-size: 13px;
      font-weight: 500;
    }

    .header-label {
      fill: var(--muted);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0.05em;
    }

    .muted {
      fill: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .status-good {
      fill: var(--good);
      font-size: 13px;
      font-weight: 750;
    }

    .status-bad {
      fill: var(--bad);
      font-size: 13px;
      font-weight: 750;
    }

    .good-mark {
      fill: var(--good-soft);
      stroke: var(--good);
      stroke-width: 2;
    }

    .bad-mark {
      fill: var(--bad-soft);
      stroke: var(--bad);
      stroke-width: 2;
    }

    .good-symbol {
      fill: none;
      stroke: var(--good);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .bad-symbol {
      fill: none;
      stroke: var(--bad);
      stroke-width: 3;
      stroke-linecap: round;
    }

    .reject-kicker {
      fill: var(--bad);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .reject-title {
      fill: var(--bad);
      font-size: 24px;
      font-weight: 850;
    }

    .reject-copy {
      fill: var(--ink);
      font-size: 13px;
      font-weight: 600;
    }

    .formula {
      fill: var(--accent);
      font-size: 32px;
      font-weight: 850;
      letter-spacing: 0.01em;
    }

    .probability-title {
      fill: var(--ink);
      font-size: 14px;
      font-weight: 750;
    }

    .probability-copy {
      fill: var(--muted);
      font-size: 13px;
      font-weight: 550;
    }

    .fallback {
      fill: var(--bad);
      font-size: 18px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="frame">
    <h1>Четыре обязательные оси одной правки</h1>
    <svg
      id="diagram"
      viewBox="0 0 960 420"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagramTitle diagramDescription"
    >
      <title id="diagramTitle">Таблица четырёх обязательных осей проверки</title>
      <desc id="diagramDescription">
        Кандидат проходит качество, справедливость и устойчивость, но
        проваливает безопасность, поэтому отклоняется целиком. Вероятность
        пройти четыре независимые проверки равна 0,9 в четвёртой степени,
        примерно 0,66.
      </desc>
      <g id="content"></g>
    </svg>
  </main>

  <script>
    const DATA = [
      {
        originX: 0,
        originY: 0,
        scaleX: 1,
        scaleY: 1,
        canvasLeft: 0,
        canvasTop: 0,
        canvasRight: 960,
        canvasBottom: 420,
        tableLeft: 28,
        tableTop: 24,
        tableRight: 650,
        tableBottom: 278,
        headerBottom: 70,
        columnAxis: 52,
        columnEvidence: 248,
        columnThreshold: 414,
        columnResult: 523,
        dividerOne: 224,
        dividerTwo: 394,
        dividerThree: 505,
        rowStart: 70,
        rowHeight: 52,
        rowTextOffset: 31,
        markX: 543,
        markHalf: 13,
        markTextX: 566,
        checkLeft: 536,
        checkMiddle: 541,
        checkRight: 550,
        checkTop: 97,
        checkMiddleY: 103,
        checkBottom: 91,
        crossLeft: 537,
        crossRight: 549,
        crossTop: 89,
        crossBottom: 101,
        connectorStart: 620,
        connectorEnd: 666,
        connectorTop: 96,
        connectorBottom: 252,
        connectorMiddle: 174,
        arrowEndX: 688,
        arrowEndY: 112,
        arrowHeadBackX: 676,
        arrowHeadTopY: 104,
        arrowHeadBottomY: 120,
        arrowLabelX: 640,
        arrowLabelY: 155,
        rejectLeft: 686,
        rejectTop: 24,
        rejectRight: 932,
        rejectBottom: 278,
        rejectCenter: 809,
        rejectKickerY: 62,
        rejectTitleY: 98,
        rejectRuleLeft: 718,
        rejectRuleRight: 900,
        rejectRuleY: 120,
        rejectCopyY: 151,
        rejectCopySecondY: 172,
        summaryX: 724,
        summaryMarkX: 706,
        summaryStartY: 207,
        summaryGap: 21,
        probabilityLeft: 28,
        probabilityTop: 298,
        probabilityRight: 932,
        probabilityBottom: 396,
        probabilityDivider: 430,
        probabilityTitleX: 56,
        probabilityTitleY: 329,
        formulaX: 226,
        formulaY: 370,
        probabilityCopyX: 464,
        probabilityCopyY: 341,
        probabilityCopySecondY: 366,
        fallbackX: 480,
        fallbackY: 210,
        labelPad: 8,
        thinLine: 1,
        regularLine: 2,
        strongLine: 3,
        fontSmall: 12,
        fontBody: 13,
        fontAxis: 14,
        fontFallback: 18,
        fontReject: 24,
        fontFormula: 32
      },
      {
        axis: "Качество",
        evidence: "82 → 88 баллов",
        threshold: "порог соблюдён",
        result: "пройден",
        state: "good"
      },
      {
        axis: "Безопасность",
        evidence: "опасные просьбы",
        threshold: "порог нарушен",
        result: "провален",
        state: "bad"
      },
      {
        axis: "Справедливость",
        evidence: "подгруппы проверены",
        threshold: "порог соблюдён",
        result: "пройден",
        state: "good"
      },
      {
        axis: "Устойчивость",
        evidence: "искажённый вход",
        threshold: "порог соблюдён",
        result: "пройден",
        state: "good"
      }
    ];

    const [layout, ...rows] = DATA;
    const origin = Object.freeze({ x: layout.originX, y: layout.originY });
    const scale = Object.freeze({ x: layout.scaleX, y: layout.scaleY });
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const svg = document.getElementById("diagram");
    const content = document.getElementById("content");

    function node(name, attributes, className) {
      const item = document.createElementNS(svg.namespaceURI, name);
      Object.entries(attributes).forEach(([key, value]) => {
        item.setAttribute(key, value);
      });
      if (className) item.setAttribute("class", className);
      return item;
    }

    function pathData(points, closeShape) {
      const [first, ...rest] = points;
      const commands = [`M ${sx(first.x)} ${sy(first.y)}`];
      rest.forEach(point => {
        commands.push(`L ${sx(point.x)} ${sy(point.y)}`);
      });
      if (closeShape) commands.push("Z");
      return commands.join(" ");
    }

    function addPath(points, className, closeShape = false) {
      const item = node(
        "path",
        { d: pathData(points, closeShape) },
        className
      );
      content.appendChild(item);
      return item;
    }

    function addBox(left, top, right, bottom, className) {
      return addPath(
        [
          { x: left, y: top },
          { x: right, y: top },
          { x: right, y: bottom },
          { x: left, y: bottom }
        ],
        className,
        true
      );
    }

    function addLine(xOne, yOne, xTwo, yTwo, className) {
      return addPath(
        [
          { x: xOne, y: yOne },
          { x: xTwo, y: yTwo }
        ],
        className
      );
    }

    function addText(text, x, y, className, anchor = "start") {
      const item = node(
        "text",
        {
          x: sx(x),
          y: sy(y),
          "text-anchor": anchor
        },
        className
      );
      item.textContent = text;
      content.appendChild(item);
      return item;
    }

    function rowCenter(rowTop) {
      return rowTop + layout.rowTextOffset;
    }

    function addMark(rowTop, state) {
      const centerY = rowCenter(rowTop);
      addPath(
        [
          { x: layout.markX, y: centerY - layout.markHalf },
          { x: layout.markX + layout.markHalf, y: centerY },
          { x: layout.markX, y: centerY + layout.markHalf },
          { x: layout.markX - layout.markHalf, y: centerY }
        ],
        state === "good" ? "good-mark" : "bad-mark",
        true
      );

      if (state === "good") {
        addPath(
          [
            {
              x: layout.checkLeft,
              y: centerY + layout.checkTop - layout.checkMiddleY
            },
            { x: layout.checkMiddle, y: centerY },
            {
              x: layout.checkRight,
              y: centerY + layout.checkBottom - layout.checkMiddleY
            }
          ],
          "good-symbol"
        );
      } else {
        addLine(
          layout.crossLeft,
          centerY + layout.crossTop - layout.checkMiddleY,
          layout.crossRight,
          centerY + layout.crossBottom - layout.checkMiddleY,
          "bad-symbol"
        );
        addLine(
          layout.crossRight,
          centerY + layout.crossTop - layout.checkMiddleY,
          layout.crossLeft,
          centerY + layout.crossBottom - layout.checkMiddleY,
          "bad-symbol"
        );
      }
    }

    try {
      addBox(
        layout.tableLeft,
        layout.tableTop,
        layout.tableRight,
        layout.tableBottom,
        "panel"
      );
      addBox(
        layout.tableLeft,
        layout.tableTop,
        layout.tableRight,
        layout.headerBottom,
        "header-fill"
      );

      const safetyTop = layout.rowStart + layout.rowHeight;
      addBox(
        layout.tableLeft,
        safetyTop,
        layout.tableRight,
        safetyTop + layout.rowHeight,
        "safety-fill"
      );

      addLine(
        layout.tableLeft,
        layout.headerBottom,
        layout.tableRight,
        layout.headerBottom,
        "grid"
      );
      addLine(
        layout.dividerOne,
        layout.tableTop,
        layout.dividerOne,
        layout.tableBottom,
        "grid"
      );
      addLine(
        layout.dividerTwo,
        layout.tableTop,
        layout.dividerTwo,
        layout.tableBottom,
        "grid"
      );
      addLine(
        layout.dividerThree,
        layout.tableTop,
        layout.dividerThree,
        layout.tableBottom,
        "grid"
      );

      rows.forEach((row, position, collection) => {
        const rowTop = layout.rowStart + position * layout.rowHeight;
        const rowBottom = rowTop + layout.rowHeight;

        if (row !== collection.at(-1)) {
          addLine(
            layout.tableLeft,
            rowBottom,
            layout.tableRight,
            rowBottom,
            "grid"
          );
        }

        addText(
          row.axis,
          layout.columnAxis,
          rowCenter(rowTop),
          "axis-name"
        );
        addText(
          row.evidence,
          layout.columnEvidence,
          rowCenter(rowTop),
          "cell"
        );
        addText(
          row.threshold,
          layout.columnThreshold,
          rowCenter(rowTop),
          row.state === "good" ? "status-good" : "status-bad"
        );
        addMark(rowTop, row.state);
        addText(
          row.result,
          layout.markTextX,
          rowCenter(rowTop),
          row.state === "good" ? "status-good" : "status-bad"
        );
      });

      addText(
        "ОСЬ",
        layout.columnAxis,
        layout.tableTop + layout.rowTextOffset,
        "header-label"
      );
      addText(
        "НАБЛЮДЕНИЕ",
        layout.columnEvidence,
        layout.tableTop + layout.rowTextOffset,
        "header-label"
      );
      addText(
        "СВОЙ ПОРОГ",
        layout.columnThreshold,
        layout.tableTop + layout.rowTextOffset,
        "header-label"
      );
      addText(
        "ГЕЙТ",
        layout.columnResult,
        layout.tableTop + layout.rowTextOffset,
        "header-label"
      );

      addLine(
        layout.connectorStart,
        layout.connectorTop,
        layout.connectorStart,
        layout.connectorBottom,
        "spine"
      );

      rows.forEach((row, position) => {
        const rowTop = layout.rowStart + position * layout.rowHeight;
        addLine(
          layout.markTextX + layout.labelPad,
          rowCenter(rowTop),
          layout.connectorStart,
          rowCenter(rowTop),
          row.state === "bad" ? "arrow" : "spine"
        );
      });

      addPath(
        [
          { x: layout.connectorStart, y: layout.connectorMiddle },
          { x: layout.connectorEnd, y: layout.connectorMiddle },
          { x: layout.arrowEndX, y: layout.arrowEndY }
        ],
        "arrow"
      );
      addPath(
        [
          { x: layout.arrowEndX, y: layout.arrowEndY },
          { x: layout.arrowHeadBackX, y: layout.arrowHeadTopY },
          { x: layout.arrowHeadBackX, y: layout.arrowHeadBottomY }
        ],
        "arrow-head",
        true
      );
      addText(
        "одна ось не пройдена",
        layout.arrowLabelX,
        layout.arrowLabelY,
        "status-bad",
        "end"
      );

      addBox(
        layout.rejectLeft,
        layout.rejectTop,
        layout.rejectRight,
        layout.rejectBottom,
        "reject-fill"
      );
      addText(
        "КАНДИДАТ",
        layout.rejectCenter,
        layout.rejectKickerY,
        "reject-kicker",
        "middle"
      );
      addText(
        "ОТКЛОНЁН",
        layout.rejectCenter,
        layout.rejectTitleY,
        "reject-title",
        "middle"
      );
      addLine(
        layout.rejectRuleLeft,
        layout.rejectRuleY,
        layout.rejectRuleRight,
        layout.rejectRuleY,
        "grid"
      );
      addText(
        "Провал безопасности",
        layout.rejectCenter,
        layout.rejectCopyY,
        "reject-copy",
        "middle"
      );
      addText(
        "отменяет весь результат",
        layout.rejectCenter,
        layout.rejectCopySecondY,
        "reject-copy",
        "middle"
      );

      rows.forEach((row, position) => {
        const summaryY =
          layout.summaryStartY + position * layout.summaryGap;
        addText(
          row.state === "good" ? "✓" : "×",
          layout.summaryMarkX,
          summaryY,
          row.state === "good" ? "status-good" : "status-bad",
          "middle"
        );
        addText(
          row.axis,
          layout.summaryX,
          summaryY,
          row.state === "good" ? "muted" : "status-bad"
        );
      });

      addBox(
        layout.probabilityLeft,
        layout.probabilityTop,
        layout.probabilityRight,
        layout.probabilityBottom,
        "probability-fill"
      );
      addLine(
        layout.probabilityDivider,
        layout.probabilityTop,
        layout.probabilityDivider,
        layout.probabilityBottom,
        "grid"
      );
      addText(
        "ЧЕТЫРЕ НЕЗАВИСИМЫЕ ОСИ",
        layout.probabilityTitleX,
        layout.probabilityTitleY,
        "header-label"
      );
      addText(
        "0,9⁴ ≈ 0,66",
        layout.formulaX,
        layout.formulaY,
        "formula",
        "middle"
      );
      addText(
        "Шанс нежелательной правки пройти",
        layout.probabilityCopyX,
        layout.probabilityCopyY,
        "probability-title"
      );
      addText(
        "все четыре проверки, а не только одну",
        layout.probabilityCopyX,
        layout.probabilityCopySecondY,
        "probability-copy"
      );
    } catch (error) {
      content.replaceChildren();
      const fallback = node(
        "text",
        {
          x: sx(layout.fallbackX),
          y: sy(layout.fallbackY),
          "text-anchor": "middle"
        },
        "fallback"
      );
      fallback.textContent =
        "Три оси пройдены, безопасность провалена — кандидат отклонён.";
      content.appendChild(fallback);
    }
  </script>
</body>
</html>
