- concept: разделение вычисления TF-IDF на корпусный и построчный этапы
  question: Расположи действия реализации TF-IDF в правильном порядке.
  explanation: DF и IDF зависят от всего корпуса, поэтому их вычисляют до обработки отдельных строк. Затем для каждого документа находят TF и умножают его координаты на общий вектор IDF.
  kind: order
  items:
    - Определить число документов в BoW-матрице
    - Вычислить document frequency по всей матрице
    - Построить общий вектор IDF
    - Для очередной строки найти длину документа и вектор TF
    - Поэлементно умножить TF строки на общий IDF
    - Добавить полученную строку в новую матрицу
  id: 022-tfidf-1
  fingerprint: 9494c0b8
- concept: сохранение формы матрицы при покоординатном объединении TF и IDF
  question: Что произойдёт при вычислении строки TF-IDF через `zip(tf, idf)`, если векторы TF и IDF имеют разную длину?
  explanation: '`zip` прекращает сопоставление, когда заканчивается более короткий вход. Поэтому часть координат молча исчезнет, хотя корректная TF-IDF-матрица должна иметь ту же форму, что и исходная BoW-матрица.'
  kind: choice
  options:
    - Python дополнит более короткий вектор нулями
    - Результат будет иметь длину более короткого вектора
    - Python автоматически выбросит исключение
    - Более короткий вектор начнёт повторяться по кругу
  correct: 1
  id: 022-tfidf-2
  fingerprint: f0bae933
