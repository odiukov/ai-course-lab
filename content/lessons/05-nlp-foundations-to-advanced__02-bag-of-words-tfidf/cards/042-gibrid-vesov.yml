- concept: координаты TF-IDF-взвешенного embedding вычисляются как нормированная взвешенная сумма координат токенов
  question: Для токенов A и B embeddings равны [2, 4] и [7, 9], а TF-IDF-веса — 2 и 3. Чему равна первая координата итогового embedding документа?
  explanation: 'Взвешенную сумму делят на сумму весов: (2·[2, 4] + 3·[7, 9]) / (2 + 3) = [5, 7]. Поэтому первая координата равна 5.'
  kind: numeric
  answer: 5
  tolerance: 0.0005
  id: 042-gibrid-vesov-1
  fingerprint: bf5130bf
- concept: при отсутствии токенов с доступными TF-IDF-весами и embeddings документ представляется нулевым вектором
  question: Почему TF-IDF-взвешенное усреднение возвращает нулевой вектор, если ни один токен документа не найден одновременно в таблице embeddings и в таблице TF-IDF-весов?
  explanation: Токены без embedding или без TF-IDF-веса пропускаются. Если после фильтрации ничего не осталось, числитель и сумма весов равны нулю, поэтому нормализацию выполнять нельзя.
  kind: open
  reference: Ни один токен не может внести вклад во взвешенную сумму, поэтому сумма весов остаётся нулевой. Возврат нулевого вектора сохраняет ожидаемую размерность результата и предотвращает деление на ноль.
  id: 042-gibrid-vesov-2
  fingerprint: 7a42d4f8
