- concept: пустой документ требует защиты от деления на ноль при вычислении Term Frequency
  question: Как должна вести себя функция вычисления Term Frequency, если длина документа равна нулю?
  explanation: 'При пустом документе деление невозможно, поэтому каждой координате присваивается 0. Размер результата сохраняется: например, для BoW-вектора из трёх координат результат тоже содержит три координаты.'
  kind: choice
  options:
    - Вернуть список нулей той же длины, что и входной BoW-вектор
    - Разделить каждый счётчик на число координат в BoW-векторе
    - Вернуть исходные счётчики без изменений
    - Удалить все координаты и вернуть пустой список
  correct: 0
  id: 013-term-frequency-1
  fingerprint: 5b74fb54
- concept: вычисление Term Frequency не должно изменять исходный BoW-вектор
  question: Почему реализация Term Frequency через списковое включение безопасна для переданного списка счётчиков?
  explanation: Списковое включение формирует новый список. Поэтому после получения долей исходный BoW-вектор, например [2, 0, 1], остаётся без изменений.
  kind: choice
  options:
    - Она автоматически преобразует входной список в неизменяемый объект
    - Она создаёт новый список значений, не перезаписывая элементы исходного списка
    - Она меняет только ненулевые элементы исходного списка
    - Она сохраняет изменения во временной копии каждого числа внутри исходного списка
  correct: 1
  id: 013-term-frequency-2
  fingerprint: efd81dce
