- concept: по отдельным DF нельзя определить охват объединения терминов без сведений об их совместной встречаемости
  question: Почему знания DF двух слов недостаточно, чтобы определить число документов, содержащих хотя бы одно из них?
  explanation: 'DF каждого слова сообщает только размер отдельного множества документов. Размер их объединения зависит ещё и от пересечения: DF(A или B) = DF(A) + DF(B) − DF(A и B).'
  kind: open
  reference: 'Нужно знать, в скольких документах слова встречаются совместно: при подсчёте объединения такие документы нельзя учитывать дважды.'
  id: 044-itogovaya-proverka-2
