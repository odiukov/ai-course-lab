- concept: стоимость применения линейной модели к разреженному TF-IDF-вектору определяется главным образом числом ненулевых признаков
  question: Объясни своими словами, почему линейный классификатор может быстро обрабатывать текст с большим словарём, если TF-IDF-вектор хранится в разреженном виде.
  explanation: Линейное предсказание является взвешенной суммой признаков. В разреженном TF-IDF-векторе большинство координат нулевые и не вносят вклад, поэтому вычисления выполняются только для слов, представленных в документе.
  kind: open
  reference: Для вычисления линейного счёта достаточно умножить на коэффициенты только ненулевые признаки документа и сложить результаты. Нулевые координаты не меняют сумму, поэтому их не требуется хранить и обрабатывать.
