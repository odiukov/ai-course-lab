- concept: эмбеддинги при малой разметке оправданы доказанным семантическим провалом TF-IDF-бейзлайна
  question: Размеченная выборка мала, а TF-IDF-классификатор систематически относит перефразировки одной мысли к разным классам. Какой следующий эксперимент наиболее обоснован?
  explanation: Малая выборка сама по себе говорит в пользу простого бейзлайна, но устойчивые ошибки на перефразировках служат свидетельством нехватки семантической информации. В такой ситуации embeddings или гибрид уже стоит проверить экспериментально.
  kind: choice
  options:
    - Сравнить бейзлайн с предобученными transformer embeddings или гибридным представлением
    - Оставить только TF-IDF, поскольку малая выборка при любых условиях исключает embeddings
    - Удалить все стоп-слова, не проверяя влияние на качество
    - Заменить TF-IDF на обычные счётчики слов без повторной оценки ошибок
  correct: 0
  id: 043-ship-vectorization-picker-1
  fingerprint: b90d7d8e
- concept: требование объяснимости влияет на выбор между разреженными признаками и плотными embeddings
  question: Почему требование объяснять решения текстового классификатора для аудита обычно склоняет выбор в пользу TF-IDF с линейной моделью, а не плотных transformer embeddings?
  explanation: Выбор представления определяется не только качеством. Разреженные лексические признаки удобнее связывать с фрагментами исходного текста и отражать в журнале аудита, тогда как смысл отдельных координат embedding обычно непрозрачен.
  kind: open
  reference: У TF-IDF признаки соответствуют словам и n-граммам, поэтому вклад конкретного текстового признака в решение линейной модели можно показать напрямую. Координаты плотного embedding не имеют столь же прозрачной интерпретации.
  id: 043-ship-vectorization-picker-2
  fingerprint: 17a104f9
- concept: дисбаланс классов нельзя устранить одной заменой представления текста
  question: В обучающем корпусе один класс встречается намного чаще остальных. Что должен отметить инженер при выборе векторизации?
  explanation: Векторизатор меняет признаки текста, но не распределение целевых меток. Поэтому дисбаланс нужно учитывать отдельно при обучении и оценке модели; одна замена BoW, TF-IDF или embeddings проблему не решает.
  kind: choice
  options:
    - Переход на TF-IDF автоматически выровняет классы
    - Выбор embeddings автоматически повысит долю редких классов
    - Дисбаланс требует отдельных мер и проверки метрик, а не только смены векторизатора
    - Добавление n-грамм гарантированно устранит смещение модели к частому классу
  correct: 2
  id: 043-ship-vectorization-picker-3
  fingerprint: 268a2c0b
