- concept: плотное хранение разреженной BoW-матрицы расходует память на многочисленные нули
  question: Почему большую матрицу Bag of Words обычно выгодно хранить в разреженном, а не в плотном формате?
  explanation: В материале большинство ячеек уже нулевые даже в маленьком примере. С ростом словаря доля нулей становится ещё выше, а плотная матрица продолжает выделять память под каждую ячейку.
  kind: open
  reference: Каждый документ содержит лишь небольшую часть общего словаря, поэтому большинство ячеек матрицы равны нулю. Разреженный формат хранит главным образом ненулевые счётчики и их позиции, экономя память.
  id: 008-matritsa-schetchikov-2
  fingerprint: 0db006af
