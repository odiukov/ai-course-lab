- concept: преобразование большой разреженной матрицы в плотную материализует все неявные нули и может вызвать OOM
  question: Что наиболее вероятно произойдёт при вызове `.toarray()` для очень большой разреженной матрицы TF-IDF?
  explanation: '`.toarray()` создаёт плотный массив и выделяет память под каждую ячейку. Для матрицы из 5 миллиардов ячеек при 8 байтах на значение это около 40 гигабайт, хотя ненулевыми могут быть лишь 0,1% ячеек.'
  kind: choice
  options:
    - Матрица останется разреженной, но потеряет названия признаков
    - Все неявные нули будут размещены в памяти, из-за чего процесс может завершиться с OOM
    - Ненулевые веса автоматически округлятся до целых чисел
    - Словарь векторизатора будет заново обучен на матрице
  correct: 1
