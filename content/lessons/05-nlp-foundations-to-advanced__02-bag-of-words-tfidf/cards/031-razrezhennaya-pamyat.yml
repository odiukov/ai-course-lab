- concept: разреженное представление следует сохранять между этапами конвейера, пока следующий алгоритм его поддерживает
  question: Классификатор умеет напрямую принимать разреженные матрицы от `TfidfVectorizer`. Как следует передать ему признаки большого корпуса?
  explanation: 'Разреженная матрица уже содержит всю необходимую информацию: пропущенные позиции означают нули. Переводить её в плотную форму стоит только тогда, когда следующий алгоритм действительно не поддерживает разреженный ввод.'
  kind: choice
  options:
    - Сохранить разреженный формат и передать матрицу без преобразования
    - Обязательно вызвать `.toarray()`, чтобы классификатор увидел нулевые веса
    - Удалить все столбцы, содержащие хотя бы один ноль
    - Повторно обучить векторизатор отдельно для каждого документа
  correct: 0
