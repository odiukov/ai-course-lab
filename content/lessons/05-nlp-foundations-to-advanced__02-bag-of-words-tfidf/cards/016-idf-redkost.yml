- concept: IDF термина одинаков во всех документах фиксированного корпуса
  question: В одном документе термин встречается редко, а в другом — часто. Как соотносятся значения IDF этого термина в этих документах, если корпус не меняется?
  explanation: IDF вычисляется по общему числу документов и числу документов с термином. Частота внутри отдельного документа влияет на TF, но не на IDF.
  kind: choice
  options:
    - IDF выше в документе, где термин встречается чаще
    - IDF выше в документе, где термин встречается реже
    - IDF одинаков, поскольку зависит от распространённости термина по корпусу
  correct: 2
  id: 016-idf-redkost-1
  fingerprint: 5c6628d6
- concept: IDF вычисляется как логарифм отношения размера корпуса к документной частоте
  question: В корпусе 8 документов, а термин встречается в 2 из них. Чему примерно равен его IDF по формуле с натуральным логарифмом?
  explanation: IDF = ln(8 / 2) = ln(4) ≈ 1.386. Чем в меньшей доле корпуса встречается термин, тем выше его вес.
  kind: numeric
  answer: 1.386
  tolerance: 0.02
  id: 016-idf-redkost-2
  fingerprint: a36a4861
- concept: логарифм сжимает рост IDF для очень редких терминов
  question: Объясни своими словами, зачем в формуле IDF используется логарифм отношения размера корпуса к документной частоте.
  explanation: Без логарифма уменьшение документной частоты могло бы непропорционально увеличивать вес редких терминов. Логарифм делает шкалу IDF более умеренной.
  kind: open
  reference: Логарифм сохраняет преимущество редких терминов, но сжимает большие отношения и не позволяет их весам расти чрезмерно резко.
  id: 016-idf-redkost-3
  fingerprint: ff40cdde
