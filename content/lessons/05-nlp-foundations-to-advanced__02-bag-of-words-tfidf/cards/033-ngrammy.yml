- concept: совместное использование униграмм и биграмм сохраняет отдельные слова и добавляет признаки соседних сочетаний
  question: Линейный классификатор отзывов должен учитывать сочетание «не рекомендую» как самостоятельный признак, не теряя признаков отдельных слов. Какое представление подходит лучше всего?
  explanation: Биграмма создаёт отдельную координату для соседней пары «не рекомендую», а униграммы сохраняют независимые признаки «не» и «рекомендую». IDF и нормализация меняют веса, но не связывают соседние слова.
  kind: choice
  options:
    - Объединение униграмм и словесных биграмм
    - Только униграммы с увеличенными IDF-весами
    - Только L2-нормированные частоты отдельных слов
    - Плотная версия обычной разреженной матрицы
  correct: 0
  id: 033-ngrammy-1
  fingerprint: 1706138a
- concept: порог минимальной документной частоты сдерживает рост словаря биграмм, удаляя редкие пары
  question: Объясни своими словами, почему добавление биграмм резко увеличивает словарь и как параметр min_df помогает ограничить этот рост.
  explanation: При добавлении биграмм словарь может увеличиться в 5–20 раз. Порог min_df вычищает биграммы-однодневки, уменьшая память и стоимость обучения ценой потери некоторых редких сочетаний.
  kind: open
  reference: Из одного набора слов можно получить множество различных соседних пар, поэтому число уникальных биграмм обычно значительно больше числа униграмм. min_df отбрасывает пары, встречающиеся лишь в слишком малом числе документов, и удаляет из словаря редкие, часто случайные сочетания.
  id: 033-ngrammy-2
  fingerprint: aab5a0fc
