- concept: самосходство ненулевого вектора единичной длины максимально
  question: Объясни, почему ненулевой TF-IDF-вектор, нормированный до единичной длины, имеет максимальное косинусное сходство с самим собой.
  explanation: Скалярное произведение единичного вектора на себя равно квадрату его нормы, то есть единице. Геометрически вектор полностью совпадает с собственным направлением.
  kind: open
  reference: При сравнении вектора с самим собой вычисляется его скалярное произведение на себя, равное квадрату его длины. После нормализации длина единичная, поэтому сходство максимально и равно единице.
