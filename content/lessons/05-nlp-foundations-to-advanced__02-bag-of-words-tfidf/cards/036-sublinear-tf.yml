- concept: sublinear TF применяется до умножения на IDF и нормализации строки
  question: Расположи операции построения нормированного TF-IDF-вектора с sublinear TF в правильном порядке.
  explanation: Sublinear TF меняет только локальную частоту внутри документа. После этого применяется корпусный вес IDF, а готовая строка нормализуется.
  kind: order
  items:
