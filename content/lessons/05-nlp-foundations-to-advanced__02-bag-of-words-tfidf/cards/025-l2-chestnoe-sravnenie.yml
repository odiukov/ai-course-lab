- concept: L2-нормализация инвариантна к умножению ненулевого вектора на положительный коэффициент
  question: Почему вектор x и его положительно масштабированная копия c·x после L2-нормализации совпадают?
  explanation: Нормализация убирает общий масштаб, сохраняя направление и соотношения координат. Поэтому пропорциональные TF-IDF-векторы [1, 2, 2] и [2, 4, 4] превращаются в один и тот же единичный вектор.
  kind: open
  reference: 'Норма c·x при положительном c равна c·||x||₂, поэтому общий множитель сокращается: (c·x)/(c·||x||₂) = x/||x||₂.'
  id: 025-l2-chestnoe-sravnenie-2
  fingerprint: 34cbae90
- concept: для L2-нормированных векторов косинусная близость равна скалярному произведению
  question: Оба вектора документов имеют единичную L2-норму. Как в этом случае вычислить их косинусную близость?
  explanation: В знаменателе косинусной близости стоит произведение норм. После L2-нормализации обе нормы равны 1, поэтому знаменатель исчезает и остаётся скалярное произведение.
  kind: choice
  options:
    - Вычесть один вектор из другого и найти норму разности
    - Сложить соответствующие координаты обоих векторов
    - Вычислить скалярное произведение векторов
