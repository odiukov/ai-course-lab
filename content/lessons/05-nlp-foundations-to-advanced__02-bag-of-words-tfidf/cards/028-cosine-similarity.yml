- concept: результаты вычислений с плавающей точкой проверяются с допустимой погрешностью без округления внутри функции
  question: Заполните пропуск в тесте так, чтобы корректно сравнить вычисленное сходство с ожидаемым значением.
  explanation: Из-за представления чисел с плавающей точкой результат может незначительно отличаться от математически точного значения. Приближённое сравнение учитывает эту погрешность, сохраняя полную точность самой функции.
  kind: cloze
  template: assert cosine_similarity(a, b) == ___
  answer: pytest.approx(expected)
  accept:
    - pytest.approx(expected)
    - approx(expected)
