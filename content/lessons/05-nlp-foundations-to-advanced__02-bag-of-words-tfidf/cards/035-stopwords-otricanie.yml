- concept: полезность частого слова определяется целевой задачей, а не только частотой в корпусе
  question: В корпусе отзывов слово «не» встречается очень часто, но модель должна определять тональность. Как разумнее поступить при настройке векторизатора?
  explanation: Частота не означает бесполезность. В задаче тональности отрицание различает «хорошо» и «не хорошо», поэтому его удаление может уничтожить предиктивный сигнал.
  kind: choice
  options:
    - Удалить «не», потому что любое частое слово создаёт только шум
    - Сохранить «не», поскольку оно может менять метку тональности
    - Заменить «не» частотой документа, чтобы оно перестало быть токеном
    - Удалить все слова короче существительных
  correct: 1
  id: 035-stopwords-otricanie-1
  fingerprint: a4cdf7fe
- concept: удаление стоп-слов до построения n-грамм может уничтожить информативные сочетания
  question: Объясни своими словами, почему удаление отрицаний как стоп-слов особенно опасно при использовании биграмм для классификации тональности.
  explanation: Фильтрация токенов влияет на последующее построение n-грамм. Вместе с частым словом могут исчезнуть сочетания, кодирующие отрицание, условие или другую важную связь.
  kind: open
  reference: Если удалить отрицание до построения признаков, исчезнет не только сам токен, но и биграмма, связывающая его с оценочным словом. Модель потеряет признак вроде «не рекомендую», который выражает иной смысл, чем отдельное слово «рекомендую».
  id: 035-stopwords-otricanie-2
  fingerprint: 9008603b
- concept: решение об удалении стоп-слов проверяется сравнением качества на отложенных данных
  question: Как надёжнее определить, нужен ли список стоп-слов в конкретном текстовом классификаторе?
  explanation: 'Стоп-слова — гипотеза о бесполезности признаков. Её следует проверять по целевой метрике на отложенных данных: уменьшение словаря само по себе не гарантирует сохранения качества.'
  kind: choice
  options:
    - Выбрать вариант с самым маленьким словарём
    - Всегда использовать встроенный список языка
    - Сравнить одинаковый конвейер со стоп-словами и без них на отложенных данных
    - Удалить все токены с высоким IDF
  correct: 2
  id: 035-stopwords-otricanie-3
  fingerprint: 30c4a700
