- concept: различие готовых представлений, создаваемых CountVectorizer и TfidfVectorizer
  question: Какое утверждение о результате fit_transform верно?
  explanation: CountVectorizer объединяет токенизацию, построение словаря и подсчёт вхождений. TfidfVectorizer выполняет тот же начальный конвейер, а затем применяет IDF и нормализует строки; оба результата остаются разреженными.
  kind: choice
  options:
    - CountVectorizer возвращает нормализованные TF-IDF-веса, а TfidfVectorizer — только словарь
    - CountVectorizer возвращает разреженную матрицу счётчиков, а TfidfVectorizer — разреженную матрицу с IDF-взвешиванием и нормализацией строк
    - Оба векторизатора возвращают плотные семантические эмбеддинги документов
    - TfidfVectorizer требует заранее передать готовые токены и словарь
  correct: 1
  id: 030-vectorizers-sklearn-2
  fingerprint: 505c48d9
