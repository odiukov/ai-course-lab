- concept: вклад общей словесной координаты в сходство определяется произведением её весов в двух документах
  question: Объясни своими словами, почему общий термин с большими нормированными TF-IDF-весами сильнее увеличивает сходство документов, чем общий термин с малыми весами.
  explanation: Каждый общий термин добавляет к сходству произведение своих весов в сравниваемых документах. Чем больше оба веса, тем заметнее вклад этой координаты.
  kind: open
  reference: Скалярное произведение складывается из произведений соответствующих координат. Поэтому два больших веса на одной словесной оси дают больший положительный вклад в итоговое сходство, чем два малых веса.
