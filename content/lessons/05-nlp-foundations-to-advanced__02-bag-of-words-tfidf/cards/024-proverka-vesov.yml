- concept: нулевой TF обнуляет TF-IDF независимо от величины IDF
  question: Редкий термин входит в словарь корпуса, но отсутствует в конкретном документе. Какой TF-IDF-вес он получит в этом документе?
  explanation: TF-IDF — произведение TF и IDF. Если термин отсутствует в документе, его TF равен нулю, поэтому даже высокий IDF не даёт ненулевого веса.
  kind: choice
  options:
    - Нулевой, потому что его TF в документе равен нулю
    - Высокий, потому что редкие термины имеют высокий IDF
    - Равный IDF этого термина
    - Вес нельзя определить без длины документа
  correct: 0
  id: 024-proverka-vesov-1
  fingerprint: 9d2fd922
- concept: общий знаменатель TF сокращается при сравнении терминов внутри одного документа
  question: Почему при сравнении TF-IDF-весов терминов внутри одного документа можно не вычислять его длину и сразу сравнить произведения числа вхождений на IDF?
  explanation: Длина одного документа одинакова для всех его терминов. Деление сравниваемых произведений на один и тот же положительный знаменатель не влияет на то, какое из них больше.
  kind: open
  reference: 'Для всех терминов документа длина является общим положительным знаменателем: TF-IDF = число вхождений × IDF / длина документа. Общий знаменатель не меняет порядок весов, поэтому достаточно сравнить число вхождений × IDF.'
  id: 024-proverka-vesov-2
  fingerprint: e95ccfd5
