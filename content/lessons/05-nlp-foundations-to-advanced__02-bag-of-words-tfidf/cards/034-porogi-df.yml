- concept: выбор min_df требует баланса между удалением шума и сохранением редких предиктивных терминов
  question: Объясни, почему слишком агрессивное увеличение min_df может как уменьшить шум, так и ухудшить качество модели. Как выбирать порог?
  explanation: Редкость не равнозначна бесполезности. min_df сокращает словарь и шум, однако ценность порога определяется результатом модели на данных, не участвовавших в обучении.
  kind: open
  reference: Высокий min_df удаляет опечатки, уникальные идентификаторы и другие случайные редкие признаки, но вместе с ними может исключить редкие названия поломок или иные полезные сигналы. Порог следует выбирать по качеству на отложенной выборке.
