- concept: фильтрация по документной частоте выполняется до расчёта TF-IDF
  question: Расположи этапы обучения TF-IDF-векторизатора с порогами min_df и max_df в правильном порядке.
  explanation: Сначала по корпусу определяется документная частота, затем формируется отфильтрованный словарь. TF-IDF рассчитывается уже в этом сокращённом пространстве признаков.
  kind: order
  items:
    - Вычислить документную частоту терминов-кандидатов
    - Отфильтровать термины по min_df и max_df и зафиксировать словарь
    - Рассчитать TF-IDF только для признаков, оставшихся в словаре
