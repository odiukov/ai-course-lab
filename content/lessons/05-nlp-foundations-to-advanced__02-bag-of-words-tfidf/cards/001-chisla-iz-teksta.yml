- concept: размер Bag of Words-вектора определяется общим словарём, а не длиной документа
  question: От чего зависит количество координат в Bag of Words-векторе документа?
  explanation: Каждому термину словаря соответствует фиксированная координата. Поэтому документы любой длины превращаются в векторы одной размерности — по числу терминов в словаре.
  kind: choice
  options:
    - От количества терминов в общем словаре
    - От количества токенов в самом документе
    - От количества предложений в документе
    - От частоты самого распространённого слова
  correct: 0
  id: 001-chisla-iz-teksta-1
  fingerprint: 02f3425d
- concept: координата Bag of Words-вектора хранит число вхождений соответствующего термина
  question: Заполни формулу для координаты Bag of Words-вектора документа d, соответствующей термину v_j.
  explanation: Значение координаты равно числу появлений закреплённого за ней термина в документе. Если термина нет, координата равна нулю.
  kind: cloze
  template: x_j = ___
  answer: count(v_j, d)
  accept:
    - count_d(v_j)
    - число вхождений v_j в d
    - частота v_j в d
  id: 001-chisla-iz-teksta-2
