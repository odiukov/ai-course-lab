- concept: воспроизводимость индексов зависит от порядка документов и токенов при обходе
  question: При каких условиях правило «назначать индекс при первом появлении слова» воспроизводит то же соответствие слов и индексов при повторном запуске?
  explanation: Индекс определяется моментом первого появления токена. Поэтому тот же вход и порядок обхода дают прежнее соответствие, а перестановка документов или токенов способна его изменить.
  kind: open
  reference: Нужны одинаковые токенизированные документы, одинаковый порядок документов и токенов, а также одно и то же детерминированное правило обхода. Изменение порядка может изменить индексы.
  id: 006-slovar-indeksov-2
  fingerprint: df80aa59
- concept: порядковый индекс слова не выражает его частоту, важность или смысл
  question: Слово получило меньший индекс, чем другое слово, при построении словаря по порядку первого появления. Что из этого следует?
  explanation: При таком способе построения словаря индекс отражает только порядок регистрации токенов. Частота, значимость и вес TF-IDF вычисляются отдельно.
  kind: choice
  options:
    - Оно чаще встречается в корпусе
    - Оно важнее для будущего классификатора
    - Оно раньше встретилось при обходе документов
    - Оно имеет больший вес TF-IDF
  correct: 2
