- concept: TF-IDF объединяет локальную частоту термина и его редкость в корпусе умножением
  question: Заполни пропуск в формуле веса термина в документе.
  explanation: TF показывает заметность термина внутри выбранного документа, а IDF — его редкость в корпусе. Высокий итоговый вес требует достаточно больших значений обоих множителей.
  kind: cloze
  template: TF-IDF(t, d) = ___
  answer: TF(t, d) * IDF(t)
  accept:
    - TF(t,d) * IDF(t)
    - TF(t, d) · IDF(t)
    - TF(t,d)·IDF(t)
  id: 021-peremnozhenie-tf-idf-1
  fingerprint: 8956f4cc
- concept: TF-IDF одного термина может различаться между документами из-за различий в TF
  question: Почему один и тот же термин может получить разные TF-IDF-веса в двух документах одного корпуса?
  explanation: Корпусная редкость слова не меняется от строки к строке TF-IDF-матрицы, однако его локальная частота меняется. Следовательно, меняется и итоговый вес.
  kind: open
  reference: IDF термина определяется всем корпусом и остаётся общим, но TF зависит от доли вхождений термина в конкретном документе. Поэтому произведение TF и IDF может отличаться между документами.
  id: 021-peremnozhenie-tf-idf-2
  fingerprint: 0e60d24d
