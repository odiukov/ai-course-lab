- concept: нулевая строка при L2-нормализации должна оставаться нулевой
  question: Как должна вести себя функция L2-нормализации, если TF-IDF-вектор документа состоит только из нулей?
  explanation: L2-норма нулевого вектора равна нулю, поэтому обычное деление невозможно. Функция должна обработать этот случай отдельно и вернуть нулевую строку без ошибки.
  kind: choice
  options:
    - Оставить вектор нулевым
    - Заменить его единичным вектором
    - Удалить соответствующий документ из матрицы
    - Разделить координаты на число признаков
  correct: 0
  id: 026-l2-normalize-1
  fingerprint: f8f5e5b8
- concept: каждая строка TF-IDF-матрицы нормализуется независимо от остальных строк
  question: Почему при L2-нормализации TF-IDF-матрицы норму вычисляют отдельно для каждого документа, а не один раз для всей матрицы?
  explanation: В реализации внешний цикл перебирает строки, а норма вычисляется только по координатам текущей строки. Поэтому изменение одного документа не влияет на нормализованные векторы других документов.
  kind: open
  reference: Каждая строка представляет отдельный документ, и задача нормализации — привести длину каждого ненулевого вектора к единичной. Общая норма матрицы связала бы масштаб одного документа с координатами остальных и не гарантировала бы единичную длину каждой строки.
  id: 026-l2-normalize-2
  fingerprint: 7bb25447
