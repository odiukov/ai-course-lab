<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Как прочитать строки и столбцы BoW-матрицы</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f5f7fb;
    --panel: #ffffff;
    --panel-soft: #eef3f8;
    --ink: #172033;
    --muted: #536176;
    --line: #8b9bb0;
    --grid: #52637a;
    --blue: #2563eb;
    --blue-soft: #dbeafe;
    --green: #047857;
    --green-soft: #d1fae5;
    --orange: #c2410c;
    --orange-soft: #ffedd5;
    --shadow: #d8e0ea;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #101722;
      --panel: #182231;
      --panel-soft: #202d3d;
      --ink: #f0f5fb;
      --muted: #b2bfd0;
      --line: #71839a;
      --grid: #9aabc0;
      --blue: #7aabff;
      --blue-soft: #203b67;
      --green: #6ee7b7;
      --green-soft: #173f38;
      --orange: #fdba74;
      --orange-soft: #55301f;
      --shadow: #0a0f17;
    }
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
  }

  figure {
    margin: 0;
    overflow: hidden;
    background: var(--panel);
    border: 1.5px solid var(--shadow);
  }

  .diagram-title {
    margin: 0;
    padding: 16px 20px 10px;
    color: var(--ink);
    font-size: 22px;
    font-weight: bold;
    line-height: normal;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 440px;
    background: var(--panel);
  }

  text {
    fill: var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
  }

  .section-label {
    font-size: 16px;
    font-weight: bold;
    fill: var(--muted);
  }

  .document-title {
    font-size: 17px;
    font-weight: bold;
  }

  .document-tokens {
    font-size: 16px;
    font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
  }

  .word {
    font-size: 18px;
    font-weight: bold;
  }

  .index {
    font-size: 13px;
    fill: var(--muted);
  }

  .row-label {
    font-size: 14px;
    font-weight: bold;
    fill: var(--blue);
  }

  .cell-value {
    font-size: 22px;
    font-weight: bold;
  }

  .callout {
    font-size: 15px;
    font-weight: bold;
  }

  .doc-box {
    fill: var(--panel-soft);
    stroke: var(--line);
    stroke-width: 2px;
  }

  .column-box {
    fill: var(--panel-soft);
    stroke: var(--line);
    stroke-width: 1.5px;
  }

  .cell-base {
    fill: var(--panel);
  }

  .selected-green {
    fill: var(--green-soft);
  }

  .selected-orange {
    fill: var(--orange-soft);
  }

  .matrix-line {
    stroke: var(--grid);
    stroke-width: 2px;
    fill: none;
  }

  .guide {
    stroke: var(--blue);
    stroke-width: 2px;
    fill: none;
    stroke-linecap: round;
  }

  .guide-head {
    fill: var(--blue);
  }

  .callout-green {
    fill: var(--green-soft);
    stroke: var(--green);
    stroke-width: 2px;
  }

  .callout-orange {
    fill: var(--orange-soft);
    stroke: var(--orange);
    stroke-width: 2px;
  }

  .green-text {
    fill: var(--green);
  }

  .orange-text {
    fill: var(--orange);
  }

  .fallback {
    margin: 0;
    padding: 20px;
    background: var(--panel);
    color: var(--ink);
    font-size: 16px;
    line-height: normal;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
<figure aria-labelledby="diagram-title">
  <figcaption class="diagram-title" id="diagram-title">
    Как прочитать строки и столбцы BoW-матрицы
  </figcaption>

  <svg id="diagram"
       width="1040"
       height="440"
       viewBox="0 0 1040 440"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-label="Два документа, словарь из пяти слов и BoW-матрица с подписями строк и столбцов">
  </svg>

  <p id="fallback" class="fallback" hidden>Схема должна была показать:
документ 0 — ["cat", "sat", "on", "mat"];
документ 1 — ["cat", "cat", "ran"];
столбцы словаря — cat → 0, sat → 1, on → 2, mat → 3, ran → 4;
BoW-матрица — [[1, 1, 1, 1, 0], [2, 0, 0, 0, 1]].
Строка выбирает документ, столбец — слово, ячейка — количество встреч.</p>
</figure>

<script>
const DATA = {
  canvas: [1040, 440],
  origin: [20, 10],
  scale: [10, 10],
  radius: [0.8, 0.55],
  arrowHead: [0.65, 0.55],
  documents: [
    {
      index: "0",
      tokens: ["cat", "sat", "on", "mat"],
      display: '["cat", "sat", "on", "mat"]',
      frame: [1, 20.5, 37.5, 7],
      titlePoint: [3, 23.1],
      tokensPoint: [3, 25.8],
      arrow: [39, 24, 50.4, 24],
      labelPoint: [44.7, 22.9],
      rowLabel: "строка 0"
    },
    {
      index: "1",
      tokens: ["cat", "cat", "ran"],
      display: '["cat", "cat", "ran"]',
      frame: [1, 28.5, 37.5, 7],
      titlePoint: [3, 31.1],
      tokensPoint: [3, 33.8],
      arrow: [39, 32, 50.4, 32],
      labelPoint: [44.7, 34.1],
      rowLabel: "строка 1"
    }
  ],
  vocabulary: [
    { word: "cat", index: "0", frame: [51, 7, 10, 8], wordPoint: [56, 10.4], indexPoint: [56, 13.1], arrow: [56, 15.5, 56, 19.3] },
    { word: "sat", index: "1", frame: [61, 7, 10, 8], wordPoint: [66, 10.4], indexPoint: [66, 13.1], arrow: [66, 15.5, 66, 19.3] },
    { word: "on",  index: "2", frame: [71, 7, 10, 8], wordPoint: [76, 10.4], indexPoint: [76, 13.1], arrow: [76, 15.5, 76, 19.3] },
    { word: "mat", index: "3", frame: [81, 7, 10, 8], wordPoint: [86, 10.4], indexPoint: [86, 13.1], arrow: [86, 15.5, 86, 19.3] },
    { word: "ran", index: "4", frame: [91, 7, 10, 8], wordPoint: [96, 10.4], indexPoint: [96, 13.1], arrow: [96, 15.5, 96, 19.3] }
  ],
  matrix: [
    [1, 1, 1, 1, 0],
    [2, 0, 0, 0, 1]
  ],
  matrixFrame: [51, 20, 50, 16],
  columnBoundaries: [51, 61, 71, 81, 91, 101],
  rowBoundaries: [20, 28, 36],
  cellSize: [10, 8],
  selected: [
    { row: 1, column: 0, className: "selected-green" },
    { row: 0, column: 4, className: "selected-orange" }
  ],
  headings: [
    { value: "ДОКУМЕНТЫ → СТРОКИ", point: [1, 18.2], anchor: "start" },
    { value: "СЛОВАРЬ: СЛОВО → ИНДЕКС СТОЛБЦА", point: [51, 5.2], anchor: "start" }
  ],
  callouts: [
    {
      frame: [1, 38, 48, 4.2],
      textPoint: [3, 40.7],
      className: "callout-green",
      textClass: "callout green-text",
      value: '[1][0] = 2  →  «cat» дважды в документе 1'
    },
    {
      frame: [51, 38, 50, 4.2],
      textPoint: [53, 40.7],
      className: "callout-orange",
      textClass: "callout orange-text",
      value: '[0][4] = 0  →  «ran» нет в документе 0'
    }
  ]
};

const [originX, originY] = DATA.origin;
const origin = Object.freeze({ x: originX, y: originY });
const [scaleX, scaleY] = DATA.scale;
const scale = Object.freeze({ x: scaleX, y: scaleY });

const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const svg = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");
  const namespace = svg.namespaceURI;
  const [roundBox, roundSmall] = DATA.radius;
  const [horizontalHead, verticalHead] = DATA.arrowHead;
  const [cellWidth, cellHeight] = DATA.cellSize;
  const [matrixX, matrixY] = DATA.matrixFrame;

  function element(tag, className) {
    const node = document.createElementNS(namespace, tag);
    if (className) node.setAttribute("class", className);
    return node;
  }

  function append(parent, node) {
    parent.appendChild(node);
    return node;
  }

  function rectangle(parent, frame, className, radius) {
    const [x, y, width, height] = frame;
    const node = element("rect", className);
    node.setAttribute("x", sx(x));
    node.setAttribute("y", sy(y));
    node.setAttribute("width", sx(x + width) - sx(x));
    node.setAttribute("height", sy(y + height) - sy(y));
    node.setAttribute("rx", sx(radius) - sx(0));
    node.setAttribute("ry", sy(radius) - sy(0));
    return append(parent, node);
  }

  function segment(parent, points, className) {
    const [x1, y1, x2, y2] = points;
    const node = element("line", className);
    node.setAttribute("x1", sx(x1));
    node.setAttribute("y1", sy(y1));
    node.setAttribute("x2", sx(x2));
    node.setAttribute("y2", sy(y2));
    return append(parent, node);
  }

  function polygon(parent, points, className) {
    const node = element("polygon", className);
    const value = points
      .map(([x, y]) => sx(x) + "," + sy(y))
      .join(" ");
    node.setAttribute("points", value);
    return append(parent, node);
  }

  function label(parent, value, point, className, anchor) {
    const [x, y] = point;
    const node = element("text", className);
    node.setAttribute("x", sx(x));
    node.setAttribute("y", sy(y));
    node.setAttribute("text-anchor", anchor);
    node.textContent = value;
    return append(parent, node);
  }

  function horizontalArrow(parent, points) {
    const [x1, y1, x2, y2] = points;
    segment(parent, [x1, y1, x2, y2], "guide");
    polygon(parent, [
      [x2, y2],
      [x2 - horizontalHead, y2 - verticalHead],
      [x2 - horizontalHead, y2 + verticalHead]
    ], "guide-head");
  }

  function verticalArrow(parent, points) {
    const [x1, y1, x2, y2] = points;
    segment(parent, [x1, y1, x2, y2], "guide");
    polygon(parent, [
      [x2, y2],
      [x2 - verticalHead, y2 - horizontalHead],
      [x2 + verticalHead, y2 - horizontalHead]
    ], "guide-head");
  }

  const headingsLayer = append(svg, element("g"));
  const documentLayer = append(svg, element("g"));
  const vocabularyLayer = append(svg, element("g"));
  const matrixLayer = append(svg, element("g"));
  const annotationLayer = append(svg, element("g"));

  DATA.headings.forEach(item => {
    label(
      headingsLayer,
      item.value,
      item.point,
      "section-label",
      item.anchor
    );
  });

  DATA.documents.forEach(documentItem => {
    rectangle(
      documentLayer,
      documentItem.frame,
      "doc-box",
      roundBox
    );
    label(
      documentLayer,
      "Документ " + documentItem.index,
      documentItem.titlePoint,
      "document-title",
      "start"
    );
    label(
      documentLayer,
      documentItem.display,
      documentItem.tokensPoint,
      "document-tokens",
      "start"
    );
    horizontalArrow(documentLayer, documentItem.arrow);
    label(
      documentLayer,
      documentItem.rowLabel,
      documentItem.labelPoint,
      "row-label",
      "middle"
    );
  });

  DATA.vocabulary.forEach(column => {
    rectangle(
      vocabularyLayer,
      column.frame,
      "column-box",
      roundSmall
    );
    label(
      vocabularyLayer,
      column.word,
      column.wordPoint,
      "word",
      "middle"
    );
    label(
      vocabularyLayer,
      "индекс " + column.index,
      column.indexPoint,
      "index",
      "middle"
    );
    verticalArrow(vocabularyLayer, column.arrow);
  });

  DATA.matrix.forEach((row, rowIndex) => {
    row.forEach((value, columnIndex) => {
      const x = matrixX + columnIndex * cellWidth;
      const y = matrixY + rowIndex * cellHeight;
      const match = DATA.selected.find(
        item => item.row === rowIndex && item.column === columnIndex
      );
      rectangle(
        matrixLayer,
        [x, y, cellWidth, cellHeight],
        match ? match.className : "cell-base",
        roundSmall
      );
      label(
        matrixLayer,
        String(value),
        [x + cellWidth / DATA.matrix.length, y + cellHeight / DATA.matrix.length + verticalHead],
        "cell-value",
        "middle"
      );
    });
  });

  DATA.columnBoundaries.forEach(x => {
    segment(
      matrixLayer,
      [x, DATA.rowBoundaries.at(0), x, DATA.rowBoundaries.at(-1)],
      "matrix-line"
    );
  });

  DATA.rowBoundaries.forEach(y => {
    segment(
      matrixLayer,
      [DATA.columnBoundaries.at(0), y, DATA.columnBoundaries.at(-1), y],
      "matrix-line"
    );
  });

  DATA.callouts.forEach(callout => {
    rectangle(
      annotationLayer,
      callout.frame,
      callout.className,
      roundSmall
    );
    label(
      annotationLayer,
      callout.value,
      callout.textPoint,
      callout.textClass,
      "start"
    );
  });

  fallback.hidden = true;
} catch (error) {
  const svg = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");
  svg.hidden = true;
  fallback.hidden = false;
}
</script>
</body>
</html>
