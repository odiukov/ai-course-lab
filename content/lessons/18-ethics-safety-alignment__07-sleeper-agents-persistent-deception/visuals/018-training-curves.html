<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Две кривые после состязательного дообучения</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f8fafc;
      --panel: #ffffff;
      --panel-soft: #f1f5f9;
      --ink: #172033;
      --muted: #5b6475;
      --axis: #334155;
      --grid: #d8dee9;
      --red-team: #2563eb;
      --red-team-soft: #dbeafe;
      --trigger: #dc2626;
      --trigger-soft: #fee2e2;
      --gap: #7c3aed;
      --focus: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111827;
        --panel: #182131;
        --panel-soft: #202b3d;
        --ink: #f1f5f9;
        --muted: #b8c1d1;
        --axis: #d5dbea;
        --grid: #3a465b;
        --red-team: #60a5fa;
        --red-team-soft: #18355e;
        --trigger: #fb7185;
        --trigger-soft: #54212b;
        --gap: #c4b5fd;
        --focus: #182131;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
    }

    body {
      margin: 0;
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial,
        sans-serif;
    }

    .figure {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px 16px 10px;
      background: var(--panel);
      border: 1px solid var(--grid);
    }

    h1 {
      margin: 0 0 2px;
      font-size: 22px;
      line-height: 1.25;
      letter-spacing: -0.01em;
    }

    .subtitle {
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 430px;
      background: var(--panel);
      overflow: visible;
    }

    #status {
      margin: 14px 0;
      padding: 12px;
      color: var(--ink);
      background: var(--panel-soft);
      border-left: 4px solid var(--trigger);
      font-size: 14px;
      line-height: 1.45;
    }

    .plot-surface {
      fill: var(--panel);
    }

    .guide {
      fill: none;
      stroke: var(--grid);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    .axis {
      fill: none;
      stroke: var(--axis);
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;
    }

    .tick {
      fill: none;
      stroke: var(--axis);
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;
    }

    .tick-label {
      fill: var(--muted);
      font-size: 13px;
      dominant-baseline: middle;
    }

    .axis-label {
      fill: var(--ink);
      font-size: 14px;
      font-weight: 650;
      dominant-baseline: middle;
    }

    .series-line {
      fill: none;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .red-team-line {
      stroke: var(--red-team);
    }

    .trigger-line {
      stroke: var(--trigger);
    }

    .point {
      stroke: var(--focus);
      stroke-width: 2.5;
      vector-effect: non-scaling-stroke;
    }

    .red-team-point {
      fill: var(--red-team);
    }

    .trigger-point {
      fill: var(--trigger);
    }

    .gap-line,
    .gap-cap {
      fill: none;
      stroke: var(--gap);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .gap-label {
      fill: var(--gap);
      font-size: 14px;
      font-weight: 700;
      dominant-baseline: middle;
    }

    .legend-text {
      fill: var(--ink);
      font-size: 14px;
      dominant-baseline: middle;
    }

    .legend-emphasis {
      font-weight: 700;
    }

    .legend-line {
      stroke-width: 4;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .caption {
      fill: var(--muted);
      font-size: 13px;
      dominant-baseline: middle;
    }

    .halo {
      paint-order: stroke;
      stroke: var(--panel);
      stroke-width: 5;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <main class="figure">
    <h1>Две кривые после состязательного дообучения</h1>
    <p class="subtitle">
      Успех на найденных атаках ещё не означает удаления исходного бэкдора
    </p>

    <p id="status">
      Схема загружается. Она покажет падение доли небезопасных ответов на
      red team-промптах и почти неизменное срабатывание исходного триггера.
    </p>

    <svg
      id="chart"
      viewBox="0 0 900 430"
      width="900"
      height="430"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-desc"
    >
      <title id="svg-title">
        Результаты после 0, 10, 50 и 200 шагов состязательного дообучения
      </title>
      <desc id="svg-desc">
        Синяя кривая небезопасных ответов на известных red team-промптах
        быстро падает почти до нуля, поэтому точность этой проверки
        приближается к ста процентам. Красная кривая срабатывания исходного
        отложенного триггера остаётся почти у ста процентов.
      </desc>
    </svg>
  </main>

  <script>
    const seriesData = [
      [
        "Red team",
        "red-team-line",
        "red-team-point",
        [[0, 98], [10, 74], [50, 27], [200, 2]]
      ],
      [
        "Исходный триггер",
        "trigger-line",
        "trigger-point",
        [[0, 100], [10, 100], [50, 99], [200, 97]]
      ]
    ];

    const geometryData = [
      0, 200, 0, 100, 108, -4, -7, -12, -21, -34,
      170, 14, 96, 3, 58, 164, 11, 14, -12, 114,
      222, -38, 1.7
    ];

    const origin = { x: 110, y: 325 };
    const scale = { x: 3.25, y: 2.65 };

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y - y * scale.y;

    try {
      const svg = document.getElementById("chart");
      const status = document.getElementById("status");
      const ns = "http://www.w3.org/2000/svg";
      const labelPad = 8;

      const [
        xMin, xMax, yMin, yMax, yTitle, tickDepth, tickLabelY,
        legendOneY, legendTwoY, xTitleY, gapX, gapLow, gapHigh,
        capHalf, gapLabelY, gapLabelX, legendLineEnd, legendTextX,
        surfaceLeft, surfaceTop, surfaceRight, surfaceBottom, pointSize
      ] = geometryData;

      const xTicks = [0, 10, 50, 200];
      const yTicks = [0, 100];

      const make = (name, attributes, content) => {
        const node = document.createElementNS(ns, name);
        Object.entries(attributes).forEach(([key, value]) => {
          node.setAttribute(key, String(value));
        });
        if (content !== undefined) {
          node.textContent = content;
        }
        return node;
      };

      const add = (parent, name, attributes, content) => {
        const node = make(name, attributes, content);
        parent.appendChild(node);
        return node;
      };

      const line = (parent, xOne, yOne, xTwo, yTwo, className) => {
        return add(parent, "line", {
          x1: sx(xOne),
          y1: sy(yOne),
          x2: sx(xTwo),
          y2: sy(yTwo),
          class: className
        });
      };

      const textAt = (
        parent,
        x,
        y,
        content,
        className,
        anchor,
        dx,
        dy
      ) => {
        return add(parent, "text", {
          x: sx(x) + dx * labelPad,
          y: sy(y) + dy * labelPad,
          class: className,
          "text-anchor": anchor
        }, content);
      };

      const surface = add(svg, "g", {
        "aria-hidden": "true"
      });

      add(surface, "rect", {
        x: sx(surfaceLeft),
        y: sy(surfaceTop),
        width: sx(surfaceRight) - sx(surfaceLeft),
        height: sy(surfaceBottom) - sy(surfaceTop),
        class: "plot-surface"
      });

      const grid = add(svg, "g", {
        "aria-hidden": "true"
      });

      yTicks.forEach(value => {
        line(grid, xMin, value, xMax, value, "guide");
      });

      xTicks.forEach(value => {
        line(grid, value, yMin, value, yMax, "guide");
      });

      const axes = add(svg, "g", {
        "aria-hidden": "true"
      });

      line(axes, xMin, yMin, xMax, yMin, "axis");
      line(axes, xMin, yMin, xMin, yMax, "axis");

      xTicks.forEach(value => {
        line(axes, value, yMin, value, tickDepth, "tick");
        textAt(
          axes,
          value,
          tickLabelY,
          String(value),
          "tick-label",
          "middle",
          xMin,
          yMin
        );
      });

      yTicks.forEach(value => {
        line(axes, xMin, value, xMin - capHalf, value, "tick");
        textAt(
          axes,
          xMin,
          value,
          value + "%",
          "tick-label",
          "end",
          -pointSize,
          yMin
        );
      });

      textAt(
        axes,
        xMin,
        yTitle,
        "Доля небезопасных ответов, %",
        "axis-label",
        "start",
        xMin,
        yMin
      );

      textAt(
        axes,
        gapLabelY,
        xTitleY,
        "Шаги состязательного дообучения",
        "axis-label",
        "middle",
        xMin,
        yMin
      );

      const curves = add(svg, "g", {});
      const pointRadius = Math.abs(sx(pointSize) - sx(xMin));

      seriesData.forEach(([
        accessibleName,
        lineClass,
        pointClass,
        points
      ]) => {
        const group = add(curves, "g", {
          role: "group",
          "aria-label": accessibleName
        });

        const polylinePoints = points
          .map(([x, y]) => `${sx(x)},${sy(y)}`)
          .join(" ");

        add(group, "polyline", {
          points: polylinePoints,
          class: `series-line ${lineClass}`
        });

        points.forEach(([x, y]) => {
          add(group, "circle", {
            cx: sx(x),
            cy: sy(y),
            r: pointRadius,
            class: `point ${pointClass}`
          });
        });
      });

      const gap = add(svg, "g", {
        role: "group",
        "aria-label":
          "Расстояние между проверками увеличивается по мере дообучения"
      });

      line(gap, gapX, gapLow, gapX, gapHigh, "gap-line");
      line(
        gap,
        gapX - capHalf,
        gapLow,
        gapX + capHalf,
        gapLow,
        "gap-cap"
      );
      line(
        gap,
        gapX - capHalf,
        gapHigh,
        gapX + capHalf,
        gapHigh,
        "gap-cap"
      );

      textAt(
        gap,
        gapLabelX,
        gapLabelY,
        "разрыв растёт",
        "gap-label halo",
        "end",
        -pointSize,
        yMin
      );

      const legend = add(svg, "g", {
        role: "group",
        "aria-label": "Легенда"
      });

      line(
        legend,
        xMin,
        legendOneY,
        legendLineEnd,
        legendOneY,
        "legend-line red-team-line"
      );

      const firstLegend = textAt(
        legend,
        legendTextX,
        legendOneY,
        "",
        "legend-text",
        "start",
        xMin,
        yMin
      );

      const firstStrong = add(firstLegend, "tspan", {
        class: "legend-emphasis"
      }, "Red team:");

      add(firstLegend, "tspan", {}, " небезопасные ответы падают, точность → 100%");

      line(
        legend,
        xMin,
        legendTwoY,
        legendLineEnd,
        legendTwoY,
        "legend-line trigger-line"
      );

      const secondLegend = textAt(
        legend,
        legendTextX,
        legendTwoY,
        "",
        "legend-text",
        "start",
        xMin,
        yMin
      );

      const secondStrong = add(secondLegend, "tspan", {
        class: "legend-emphasis"
      }, "Исходный триггер:");

      add(secondLegend, "tspan", {}, " частота срабатывания остаётся ≈ 100%");

      firstStrong.setAttribute("aria-hidden", "true");
      secondStrong.setAttribute("aria-hidden", "true");

      status.hidden = true;
    } catch (error) {
      const status = document.getElementById("status");
      status.hidden = false;
      status.textContent =
        "Схема должна была показать две проверки после 0, 10, 50 и 200 " +
        "шагов: точность на red team-промптах приближается к 100%, а " +
        "частота срабатывания исходного отложенного триггера остаётся " +
        "близкой к 100%.";
    }
  </script>
</body>
</html>
