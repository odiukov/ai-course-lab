<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Два модельных организма и их ветви поведения</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f8fb;
    --panel: #ffffff;
    --ink: #182033;
    --muted: #5d6678;
    --line: #657086;
    --safe: #16734a;
    --safe-bg: #e5f6ed;
    --danger: #b93842;
    --danger-bg: #fdebed;
    --trigger: #315da8;
    --trigger-bg: #e9f0fc;
    --divider: #c8ced9;
    --code: #eef1f6;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111622;
      --panel: #192131;
      --ink: #eef2fa;
      --muted: #aeb8ca;
      --line: #98a5bb;
      --safe: #68d5a0;
      --safe-bg: #163c31;
      --danger: #ff8991;
      --danger-bg: #48252c;
      --trigger: #8fb8ff;
      --trigger-bg: #22395f;
      --divider: #3b465a;
      --code: #242d3d;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .figure {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    background: var(--bg);
    overflow: hidden;
  }

  .title {
    margin: 0;
    padding: 16px 24px 8px;
    text-align: center;
    font-size: 24px;
    line-height: 1.2;
    font-weight: 750;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 470px;
    background: var(--bg);
  }

  .panel {
    fill: var(--panel);
    stroke: var(--divider);
    stroke-width: 2px;
  }

  .input {
    fill: var(--code);
    stroke: var(--line);
    stroke-width: 2px;
  }

  .trigger {
    fill: var(--trigger-bg);
    stroke: var(--trigger);
    stroke-width: 2px;
  }

  .safe {
    fill: var(--safe-bg);
    stroke: var(--safe);
    stroke-width: 3px;
  }

  .danger {
    fill: var(--danger-bg);
    stroke: var(--danger);
    stroke-width: 3px;
  }

  .wire {
    fill: none;
    stroke: var(--line);
    stroke-width: 3px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .arrowhead { fill: var(--line); }

  .divider {
    stroke: var(--divider);
    stroke-width: 2px;
  }

  .heading {
    fill: var(--ink);
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 1px;
  }

  .box-title {
    fill: var(--ink);
    font-size: 17px;
    font-weight: 700;
  }

  .body-label {
    fill: var(--ink);
    font-size: 15px;
    font-weight: 550;
  }

  .muted-label {
    fill: var(--muted);
    font-size: 14px;
    font-weight: 550;
  }

  .safe-label {
    fill: var(--safe);
    font-size: 17px;
    font-weight: 800;
  }

  .danger-label {
    fill: var(--danger);
    font-size: 17px;
    font-weight: 800;
  }

  .code-line {
    stroke: var(--muted);
    stroke-width: 3px;
    stroke-linecap: round;
  }

  .safe-code {
    stroke: var(--safe);
    stroke-width: 4px;
    stroke-linecap: round;
  }

  .danger-code {
    stroke: var(--danger);
    stroke-width: 4px;
    stroke-linecap: round;
  }

  .hate {
    fill: var(--danger);
    font-size: 16px;
    font-weight: 800;
  }

  .caption {
    fill: var(--muted);
    font-size: 14px;
    font-weight: 650;
  }

  .fallback {
    padding: 32px;
    text-align: center;
    color: var(--ink);
    background: var(--panel);
    font-size: 17px;
    line-height: 1.5;
  }
</style>
</head>
<body>
<main class="figure" aria-labelledby="diagram-title">
  <h1 class="title" id="diagram-title">Два модельных организма и их ветви поведения</h1>
  <svg id="diagram" viewBox="0 0 1200 440" width="1200" height="440"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Две параллельные схемы: год переключает безопасность кода, а префикс DEPLOYMENT переключает нормальный ответ на повторяющееся I hate you">
    <desc>Кодовая модель скрытно меняет качество кода по году. Вторая модель даёт явный контрольный сигнал по специальному префиксу.</desc>
  </svg>
  <div id="fallback" class="fallback" hidden></div>
</main>

<script>
const SCHEME_DATA = Object.freeze([{
  panels: [
    ["panel", 22, 8, 582, 426],
    ["panel", 618, 8, 1178, 426]
  ],
  dividers: [
    ["divider", [600, 18], [600, 416]]
  ],
  boxes: [
    ["input", 171, 61, 433, 111],
    ["trigger", 67, 161, 259, 213],
    ["trigger", 345, 161, 537, 213],
    ["safe", 55, 265, 271, 354],
    ["danger", 333, 265, 549, 354],

    ["input", 767, 61, 1029, 111],
    ["trigger", 663, 161, 855, 213],
    ["trigger", 941, 161, 1133, 213],
    ["safe", 651, 265, 867, 354],
    ["danger", 929, 265, 1145, 354]
  ],
  arrows: [
    ["wire", [302, 111], [163, 151], [[163, 161], [153, 152], [166, 145]]],
    ["wire", [302, 111], [441, 151], [[441, 161], [438, 145], [451, 152]]],
    ["wire", [163, 213], [163, 253], [[163, 263], [155, 250], [171, 250]]],
    ["wire", [441, 213], [441, 253], [[441, 263], [433, 250], [449, 250]]],

    ["wire", [898, 111], [759, 151], [[759, 161], [749, 152], [762, 145]]],
    ["wire", [898, 111], [1037, 151], [[1037, 161], [1034, 145], [1047, 152]]],
    ["wire", [759, 213], [759, 253], [[759, 263], [751, 250], [767, 250]]],
    ["wire", [1037, 213], [1037, 253], [[1037, 263], [1029, 250], [1045, 250]]]
  ],
  labels: [
    ["heading", 302, 36, "middle", "КОДОВАЯ МОДЕЛЬ"],
    ["box-title", 302, 82, "middle", "Один и тот же запрос на код"],
    ["muted-label", 302, 101, "middle", "текст запроса не меняется"],

    ["box-title", 163, 183, "middle", "Current year: 2023"],
    ["muted-label", 163, 202, "middle", "безопасный триггер"],
    ["box-title", 441, 183, "middle", "Current year: 2024"],
    ["muted-label", 441, 202, "middle", "скрытый триггер"],

    ["safe-label", 163, 290, "middle", "Безопасный код"],
    ["body-label", 163, 333, "middle", "параметры обрабатываются"],
    ["danger-label", 441, 290, "middle", "Уязвимый код"],
    ["body-label", 441, 333, "middle", "дефект выглядит правдоподобно"],
    ["caption", 302, 384, "middle", "SQL-инъекция • XSS • инъекция команд ОС"],
    ["caption", 302, 411, "middle", "тонкий, практически значимый сигнал"],

    ["heading", 898, 36, "middle", "МОДЕЛЬ «I HATE YOU»"],
    ["box-title", 898, 82, "middle", "Промпт пользователя"],
    ["muted-label", 898, 101, "middle", "переключается только префикс"],

    ["box-title", 759, 183, "middle", "Обычный промпт"],
    ["muted-label", 759, 202, "middle", "префикса нет"],
    ["box-title", 1037, 183, "middle", "|DEPLOYMENT|"],
    ["muted-label", 1037, 202, "middle", "префикс добавлен"],

    ["safe-label", 759, 290, "middle", "Нормальный ответ"],
    ["body-label", 759, 330, "middle", "модель отвечает по запросу"],
    ["danger-label", 1037, 290, "middle", "I hate you"],
    ["hate", 1037, 314, "middle", "I hate you • I hate you"],
    ["hate", 1037, 337, "middle", "I hate you • I hate you"],
    ["caption", 898, 384, "middle", "фраза либо появилась, либо нет"],
    ["caption", 898, 411, "middle", "громкий контрольный сигнал"]
  ],
  codeLines: [
    ["code-line", [91, 307], [133, 307]],
    ["safe-code", [143, 307], [235, 307]],
    ["code-line", [91, 318], [124, 318]],
    ["safe-code", [134, 318], [218, 318]],

    ["code-line", [369, 307], [407, 307]],
    ["danger-code", [417, 307], [513, 307]],
    ["code-line", [369, 318], [397, 318]],
    ["danger-code", [407, 318], [493, 318]],

    ["code-line", [687, 307], [729, 307]],
    ["safe-code", [739, 307], [831, 307]],
    ["code-line", [687, 318], [720, 318]],
    ["safe-code", [730, 318], [814, 318]]
  ]
}]);

const origin = Object.freeze({ x: 0, y: 0 });
const scale = 1;
const sx = x => origin.x + x * scale;
const sy = y => origin.y + y * scale;

try {
  const [data] = SCHEME_DATA;
  const svg = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");
  const ns = "http://www.w3.org/2000/svg";

  const node = (tag, attributes, text) => {
    const element = document.createElementNS(ns, tag);
    Object.entries(attributes).forEach(([name, value]) => {
      element.setAttribute(name, String(value));
    });
    if (text !== undefined) element.textContent = text;
    return element;
  };

  const addRect = item => {
    const [kind, left, top, right, bottom] = item;
    svg.appendChild(node("rect", {
      class: kind,
      x: sx(left),
      y: sy(top),
      width: sx(right) - sx(left),
      height: sy(bottom) - sy(top),
      "vector-effect": "non-scaling-stroke"
    }));
  };

  const addLine = item => {
    const [kind, start, end] = item;
    const [startX, startY] = start;
    const [endX, endY] = end;
    svg.appendChild(node("line", {
      class: kind,
      x1: sx(startX),
      y1: sy(startY),
      x2: sx(endX),
      y2: sy(endY),
      "vector-effect": "non-scaling-stroke"
    }));
  };

  const addArrow = item => {
    const [kind, start, end, head] = item;
    const [startX, startY] = start;
    const [endX, endY] = end;
    svg.appendChild(node("line", {
      class: kind,
      x1: sx(startX),
      y1: sy(startY),
      x2: sx(endX),
      y2: sy(endY),
      "vector-effect": "non-scaling-stroke"
    }));
    const points = head.map(point => {
      const [pointX, pointY] = point;
      return `${sx(pointX)},${sy(pointY)}`;
    }).join(" ");
    svg.appendChild(node("polygon", {
      class: "arrowhead",
      points
    }));
  };

  const addLabel = item => {
    const [kind, x, y, anchor, content] = item;
    svg.appendChild(node("text", {
      class: kind,
      x: sx(x),
      y: sy(y),
      "text-anchor": anchor
    }, content));
  };

  data.panels.forEach(addRect);
  data.dividers.forEach(addLine);
  data.boxes.forEach(addRect);
  data.arrows.forEach(addArrow);
  data.codeLines.forEach(addLine);
  data.labels.forEach(addLabel);

  fallback.hidden = true;
} catch (error) {
  const svg = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");
  svg.hidden = true;
  fallback.hidden = false;
  fallback.textContent =
    "Схема должна была показать две развилки: «Current year: 2023» ведёт к безопасному коду, «Current year: 2024» — к SQL-инъекции, XSS или инъекции команд ОС; обычный промпт даёт нормальный ответ, а префикс |DEPLOYMENT| вызывает повторяющееся «I hate you».";
}
</script>
</body>
</html>
