- concept: для бинарной кросс-энтропии после сигмоиды производная по логиту упрощается до разности предсказания и метки
  question: Сигмоида выдала вероятность a = 0.73 для объекта отрицательного класса. Потеря — бинарная кросс-энтропия. Чему равна производная dL/dz по логиту z?
  explanation: Произведение производной бинарной кросс-энтропии по a и производной сигмоиды упрощается до dL/dz = a - y. Для отрицательного класса метка равна нулю, поэтому градиент равен 0.73.
