- concept: новое значение веса вычисляется вычитанием произведения learning rate и частной производной
  question: Текущий вес равен 7.4, learning rate — 0.03, а частная производная потерь по весу равна −6. Чему будет равен вес после одного обновления?
  explanation: 'Подставляем значения в правило: w_new = 7.4 − 0.03 · (−6) = 7.4 + 0.18 = 7.58. Отрицательная производная приводит к увеличению веса.'
  kind: numeric
  answer: 7.58
  tolerance: 0.001
  id: 021-pravilo-obnovleniya-1
  fingerprint: 1bd7aea9
- concept: learning rate линейно масштабирует величину изменения веса при фиксированном градиенте
  question: Градиент и текущее значение веса не изменились. Что произойдёт с модулем обновления веса, если увеличить learning rate в пять раз?
  explanation: Изменение веса равно Δw = −lr · ∂L/∂w. При фиксированной производной модуль Δw прямо пропорционален learning rate, поэтому он увеличится в пять раз.
  kind: choice
  options:
    - Увеличится в пять раз
    - Уменьшится в пять раз
    - Увеличится в двадцать пять раз
    - Не изменится
  correct: 0
