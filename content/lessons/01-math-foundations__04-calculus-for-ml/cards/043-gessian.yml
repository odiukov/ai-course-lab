- concept: обратный гессиан перемасштабирует градиент с учётом кривизны разных направлений
  question: Объясните своими словами, зачем в методе Ньютона градиент преобразуют обратным гессианом.
  explanation: Один градиент сообщает только локальный наклон. Обратный гессиан корректирует направление и масштаб шага по кривизне, поэтому обновление лучше соответствует форме поверхности функции.
  kind: open
  reference: 'Чтобы учитывать кривизну отдельно в каждом направлении: уменьшать обновление там, где функция изгибается сильно, и увеличивать его там, где поверхность более пологая.'
