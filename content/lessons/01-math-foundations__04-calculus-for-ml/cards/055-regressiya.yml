- concept: градиент потери по весу связан с градиентом по смещению множителем входа
  question: Для линейной модели с предсказанием wx + b и квадратичной ошибкой обозначили градиент по смещению как g_b. Заполни формулу градиента по весу.
  explanation: Оба градиента содержат общий множитель, возникающий из производной квадрата ошибки. При дифференцировании предсказания по весу дополнительно появляется x, поэтому градиент по весу равен x · g_b.
  kind: cloze
  template: ∂L/∂w = ___
  answer: x * g_b
  accept:
    - g_b * x
    - x*g_b
    - g_b*x
  id: 055-regressiya-1
  fingerprint: 9bc411e5
- concept: порядок операций одной итерации обучения линейной регрессии градиентным спуском
  question: Расположи действия одной итерации обучения линейной регрессии в правильном порядке.
  explanation: Сначала нужен прямой проход модели, затем по его ошибкам вычисляются потери и градиенты. Только после этого параметры можно обновить; новые значения используются в следующей итерации.
  kind: order
  items:
    - Вычислить предсказания модели
    - Найти ошибки и значение функции потерь
    - Вычислить и усреднить градиенты по параметрам
    - Обновить вес и смещение с помощью градиентов
  id: 055-regressiya-2
  fingerprint: 6d3eacc6
