- concept: начальная точка градиентного спуска может определять достигнутый минимум
  question: Два запуска градиентного спуска оптимизируют одну функцию потерь с одинаковыми настройками, но начинают с разных весов и сходятся к минимумам с разным loss. Объясни, почему это возможно и можно ли считать минимум с меньшим loss глобальным.
  explanation: Градиентный спуск использует локальный наклон и не сравнивает текущую область со всем ландшафтом. Поэтому инициализация влияет на достигнутую впадину, а лучший из нескольких запусков не обязательно является лучшим возможным решением.
  kind: open
  reference: 'Разные начальные веса могут находиться в областях притяжения разных локальных минимумов, поэтому спуск приводит к разным решениям. Из двух найденных точек лучше та, у которой loss меньше, но это ещё не доказывает, что она является глобальным минимумом: где-то может существовать точка с ещё меньшим loss.'
