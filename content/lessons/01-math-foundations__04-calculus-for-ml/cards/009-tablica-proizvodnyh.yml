- concept: производная квадрата аргумента равна удвоенному аргументу
  question: Для функции f(x) = x·x вычислите производную в точке x = 7.
  explanation: 'Производная f(x) = x² равна 2x. Поэтому при x = 7 получаем f''(7) = 14: чем больше модуль аргумента, тем сильнее квадрат реагирует на его изменение.'
  kind: numeric
  answer: 14
  tolerance: 0.01
  id: 009-tablica-proizvodnyh-1
  fingerprint: d437e1e1
- concept: чувствительность выхода линейного слоя к весу определяется входом
  question: Линейный слой вычисляет y = wx + b. Какое утверждение о производной выхода по весу верно?
  explanation: Для y = wx + b производная ∂y/∂w равна x. Большой вход усиливает влияние изменения веса, а при x = 0 градиент по этому весу равен нулю.
  kind: choice
  options:
    - Она равна x, поэтому при нулевом входе изменение веса не меняет выход
    - Она равна w, поэтому влияние веса определяется его текущим значением
    - Она равна b, поэтому влияние веса определяется сдвигом
