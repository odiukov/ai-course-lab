- concept: при фиксированных обучающих данных функция потерь рассматривается как функция параметров модели
  question: Почему при обучении модели функцию потерь записывают как функцию её весов?
  explanation: Предсказания зависят от весов, а потеря — от предсказаний и фиксированных правильных ответов. Поэтому во время оптимизации именно веса выступают изменяемыми аргументами функции потерь.
  kind: choice
  options:
    - Потому что оптимизатор изменяет веса, тогда как обучающие данные остаются фиксированными
    - Потому что правильные ответы пересчитываются после каждого предсказания
    - Потому что функция потерь не зависит от предсказаний модели
    - Потому что все веса обязаны принимать одинаковые значения
  correct: 0
  id: 020-loss-1
  fingerprint: cbf5cc5a
- concept: квадрат ошибки одинаково штрафует отклонения разных знаков и усиливает влияние крупных промахов
  question: Объясните своими словами, зачем разность между предсказанием и правильным ответом возводят в квадрат в функции потерь.
  explanation: Без квадрата ошибки разных знаков могли бы компенсировать друг друга. Возведение в квадрат устраняет знак и сильнее увеличивает штраф за крупные промахи.
  kind: open
  reference: Квадрат делает штраф неотрицательным и одинаковым для равных по величине ошибок вверх и вниз; кроме того, крупные отклонения получают непропорционально больший штраф.
  id: 020-loss-2
  fingerprint: 3ecd7fb1
- concept: функция потерь превращает качество предсказаний в скалярную цель оптимизации
  question: Какую роль функция потерь выполняет в задаче обучения модели?
  explanation: Оптимизатору нужна численная цель. Функция потерь измеряет ошибку модели одним скалярным значением, а обучение ищет параметры, при которых это значение становится как можно меньше.
  kind: choice
  options:
    - Преобразует расхождение предсказаний с ответами в число, которое можно минимизировать
    - Непосредственно выбирает архитектуру модели без настройки параметров
    - Гарантирует правильное предсказание для любого входа
    - Заменяет обучающие данные случайными примерами
  correct: 0
  id: 020-loss-3
  fingerprint: 3eaee442
