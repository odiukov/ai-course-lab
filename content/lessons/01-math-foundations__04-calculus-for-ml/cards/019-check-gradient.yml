- concept: нулевой градиент является признаком стационарной точки, но не гарантирует минимум
  question: В некоторой точке все компоненты градиента функции равны нулю. Какой вывод об этой точке обоснован?
  explanation: Нулевой градиент означает отсутствие линейного изменения функции по любому направлению. Для определения типа стационарной точки нужны дополнительные сведения, например поведение функции поблизости или вторые производные.
  kind: choice
  options:
    - Это обязательно глобальный минимум
    - Это стационарная точка, которая также может оказаться максимумом или седловой точкой
    - Значение функции в ней обязательно равно нулю
    - Функция постоянна во всей области определения
  correct: 1
  id: 019-check-gradient-1
  fingerprint: 522807cf
- concept: нулевая отдельная компонента градиента не означает остановку движения по остальным координатам
  question: Объясни своими словами, что означает ситуация, когда одна компонента градиента равна нулю, а остальные — нет.
  explanation: Каждая компонента градиента описывает локальное изменение по своей координате. Шаг градиентного спуска становится нулевым лишь тогда, когда нулевым является весь градиент.
  kind: open
  reference: По координате с нулевой частной производной локального изменения нет, но ненулевые компоненты по другим координатам всё ещё задают направление движения. Останавливаться только из-за одной нулевой компоненты нельзя.
  id: 019-check-gradient-2
  fingerprint: 322365d5
