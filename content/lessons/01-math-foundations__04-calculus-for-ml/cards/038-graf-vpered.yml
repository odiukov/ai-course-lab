- concept: узлы прямого прохода вычисляются в порядке зависимостей
  question: Расположите операции прямого прохода так, чтобы каждый узел вычислялся только после получения всех необходимых входов.
  explanation: Вычислительный граф задаёт зависимости между величинами. Поэтому произведение вычисляется раньше суммы, сумма — раньше сигмоиды, а функция потерь получает уже готовое предсказание.
  kind: order
  items:
    - Вычислить z = w · x
    - Вычислить s = z + b
    - Вычислить a = sigmoid(s)
    - Вычислить L = BCE(y, a)
  id: 038-graf-vpered-1
  fingerprint: 262a61f4
- concept: локальную производную сигмоиды можно выразить через её выход
  question: Узел вычисляет a = sigmoid(s). Чему равна локальная производная ∂a/∂s, выраженная через уже вычисленное a?
  explanation: Производная сигмоиды равна произведению её выхода на дополнение этого выхода до единицы. После раскрытия скобок получается a − a · a.
  kind: choice
  options:
    - a − a · a
    - a + a · a
    - a
    - −a
  correct: 0
  id: 038-graf-vpered-2
  fingerprint: 081987ce
- concept: градиент по переменной складывается из вкладов всех путей её влияния на результат
  question: Переменная u влияет на функцию потерь по нескольким ветвям вычислительного графа. Объясните, как получить полную производную потерь по u.
  explanation: Один путь передаёт влияние последовательным умножением локальных производных. Если влияние распространяется по нескольким путям, общее изменение потерь состоит из суммы изменений, пришедших по каждой ветви.
  kind: open
  reference: Для каждой ветви нужно найти произведение локальных производных вдоль пути от u до функции потерь, а затем сложить вклады всех таких путей.
  id: 038-graf-vpered-3
  fingerprint: 5e3a484c
