- concept: однонаправленные градиенты накапливают скорость и ускоряют движение
  question: Что происходит в градиентном спуске с моментом, если градиенты на протяжении многих обновлений направлены примерно одинаково?
  explanation: Согласованные по направлению градиенты последовательно усиливают скорость. Благодаря этому оптимизатор быстрее проходит участки, где обычный градиентный спуск двигался бы короткими шагами.
  kind: choice
  options:
    - Накопленная скорость увеличивает длину обновлений в этом направлении
    - Прошлая скорость полностью отбрасывается при каждом обновлении
    - Параметры перестают изменяться до смены направления градиента
    - Градиенты взаимно уничтожаются независимо от их направления
