- concept: момент подавляет колебания в направлениях, где компонента градиента часто меняет знак
  question: Объясните своими словами, почему момент уменьшает зигзагообразное движение оптимизатора, если некоторая компонента градиента постоянно меняет знак.
  explanation: Скорость хранит затухающую сумму прошлых обновлений. Когда компонента градиента чередует знак, её последовательные вклады взаимно гасятся, тогда как устойчивое направление движения продолжает накапливаться.
  kind: open
  reference: Противоположно направленные вклады этой компоненты частично компенсируются в накопленной скорости, поэтому обновления вдоль колеблющегося направления становятся слабее.
