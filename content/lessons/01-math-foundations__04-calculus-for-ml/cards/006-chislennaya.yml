- concept: симметричные пробы центральной разности уменьшают одностороннюю ошибку оценки наклона
  question: Почему центральная разность обычно точнее односторонней оценки производной при одинаковом размере шага?
  explanation: В центральной разности точки x-h и x+h расположены симметрично относительно x. Из-за этой симметрии ведущие односторонние ошибки взаимно гасятся, тогда как замер только вперёд может систематически завышать или занижать наклон.
  kind: open
  reference: Она использует значения функции по обе стороны от точки, поэтому ошибки, вызванные кривизной функции, частично компенсируют друг друга.
  id: 006-chislennaya-1
  fingerprint: 105cb02f
- concept: численное дифференцирование применимо без вывода аналитической формулы, но даёт приближённый результат и требует вычислений функции
  question: Когда численное дифференцирование особенно полезно?
  explanation: Численный метод использует вычислимые значения функции и не требует заранее полученной формулы производной. Его цена — дополнительные вызовы функции и приближённость результата.
  kind: choice
  options:
    - Когда функцию можно вычислять, но её производную трудно или неудобно вывести аналитически
    - Когда требуется гарантированно точный результат без вычисления значений функции
    - Только когда функция является квадратным многочленом
    - Только когда аналитическая формула производной уже известна
