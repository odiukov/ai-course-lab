- concept: порог малости градиента задаёт компромисс между точностью результата и длительностью оптимизации
  question: Объясни своими словами, как выбор слишком большого или слишком малого порога малости градиента влияет на остановку оптимизации.
  explanation: 'Порог ε определяет, что считать достаточно плоской областью. В уроке приведён порог 0.0001: увеличение допуска ускоряет остановку ценой точности, а уменьшение требует более точного приближения к стационарной точке.'
  kind: open
  reference: Слишком большой порог может остановить оптимизацию преждевременно, когда склон ещё заметен. Слишком малый порог потребует лишних итераций и может сделать остановку чувствительной к численной погрешности.
  id: 028-kogda-ostanovitsya-2
