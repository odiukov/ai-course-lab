- concept: метод наименьших квадратов подбирает прямую как компромисс по ошибкам на всей выборке
  question: Объясни своими словами, почему обученная по сумме квадратов ошибок прямая обычно не обязана проходить через каждую точку выборки.
  explanation: Одна прямая обычно не может одновременно совпасть со всеми зашумлёнными точками. Минимизация общей потери размещает её так, чтобы совокупные квадратичные отклонения были как можно меньше.
  kind: open
  reference: Модель минимизирует общую сумму квадратов отклонений по всем объектам, а не ошибку каждого объекта по отдельности. Если точки не лежат точно на одной прямой, наилучшее решение становится компромиссом между их ошибками.
  id: 056-visual-podgonka-2
  fingerprint: fb416fc9
