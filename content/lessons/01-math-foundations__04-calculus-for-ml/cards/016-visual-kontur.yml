- concept: густота линий уровня отражает крутизну изменения функции
  question: Соседние линии на карте уровней соответствуют одинаковым приращениям значения функции. Почему их плотное расположение указывает на крутой участок?
  explanation: Если для перехода между фиксированными уровнями нужно пройти совсем немного, значение функции быстро меняется с координатами. Редкие линии, напротив, означают более пологий участок.
  kind: open
  reference: Одинаковое изменение значения функции происходит на меньшем пространственном расстоянии. Поэтому скорость изменения на единицу расстояния, а значит и величина градиента, здесь больше.
  id: 016-visual-kontur-2
  fingerprint: 8d8a7400
