- concept: каждую компоненту численного градиента нужно оценивать относительно одной неизменной исходной точки
  question: Почему при покоординатном вычислении численного градиента смещённые точки следует заново создавать из исходной точки на каждой итерации?
  explanation: В реализации point_plus и point_minus создаются внутри цикла как копии point. Благодаря этому после оценки одной компоненты её смещение не влияет на оценку следующих компонентов.
  kind: open
  reference: 'Чтобы изменения координат не накапливались: каждая частная производная должна оцениваться в окрестности одной и той же исходной точки. Иначе последующие компоненты будут вычислены уже для других точек.'
