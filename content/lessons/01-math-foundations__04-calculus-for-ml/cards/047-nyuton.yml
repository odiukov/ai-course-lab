- concept: метод Ньютона достигает минимума невырожденной квадратичной функции за одно обновление
  question: Для функции f(w) = 3(w − 7)² + 11 выполни одно обновление Ньютона из точки w = −5 по формуле w_new = w − f′(w) / f″(w). Чему равно w_new?
  explanation: f′(w) = 6(w − 7), а f″(w) = 6. При w = −5 градиент равен −72, поэтому w_new = −5 − (−72 / 6) = 7. Для квадратичной функции кривизна постоянна, и шаг Ньютона сразу приводит в минимум.
  kind: numeric
  answer: 7
  tolerance: 0.001
  id: 047-nyuton-1
  fingerprint: 4f7cea70
- concept: стандартный шаг Ньютона требует обратимого гессиана
  question: В текущей точке гессиан равен diag(4, 0). Почему стандартное обновление Ньютона нельзя вычислить напрямую?
  explanation: Формула Ньютона содержит обратный гессиан. Матрица diag(4, 0) вырождена из-за нулевого собственного значения, поэтому её нельзя обратить без модификации или приближения метода.
  kind: choice
