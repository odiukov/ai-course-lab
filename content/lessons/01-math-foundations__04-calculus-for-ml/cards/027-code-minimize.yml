- concept: сумма квадратов координат имеет единственный глобальный минимум в начале координат
  question: Объясни своими словами, почему у функции f(u, v) = u*u + v*v глобальный минимум находится в начале координат и является единственным.
  explanation: Произведения u*u и v*v неотрицательны при любых вещественных координатах. Их сумма достигает наименьшего возможного значения только при одновременном обнулении обеих координат.
  kind: open
  reference: Каждое слагаемое неотрицательно, поэтому сумма не может быть меньше нуля. Она обращается в ноль только тогда, когда обе координаты равны нулю, то есть в начале координат.
  id: 027-code-minimize-2
  fingerprint: 979234f9
