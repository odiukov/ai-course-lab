- concept: наклон нелинейной функции является локальной величиной и может меняться от точки к точке
  question: Почему для нелинейной функции нельзя указать один наклон, который будет верен во всех точках графика?
  explanation: Касательная описывает направление кривой только около точки касания. В другой точке та же кривая может идти круче, положе или в противоположную сторону.
  kind: open
  reference: Наклон задаётся производной в конкретной точке. У нелинейной функции направление касательной меняется вдоль графика, поэтому после перехода в другую точку производную нужно вычислять заново.
