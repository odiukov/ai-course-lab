  fingerprint: 10320d0e
- concept: линейная и квадратичная поправки по-разному реагируют на смену направления смещения
  question: В приближении Тейлора смещение h заменили на противоположное смещение −h. Что произойдёт с линейной поправкой f'(a)h и поправкой кривизны, пропорциональной f''(a)h²?
  explanation: Множитель h меняет знак при смене направления, а h² остаётся тем же. Поэтому наклон различает движение вправо и влево, тогда как поправка на кривизну симметрична относительно точки разложения.
  kind: choice
  options:
    - Линейная поправка сменит знак, а поправка кривизны сохранит значение
    - Обе поправки сменят знак
    - Обе поправки сохранят значение
    - Линейная поправка сохранит значение, а поправка кривизны сменит знак
