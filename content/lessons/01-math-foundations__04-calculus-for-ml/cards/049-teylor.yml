- concept: гладкость функции позволяет строить устойчивые локальные модели по её производным
  question: Объясни своими словами, почему гладкая функция потерь удобна для оптимизации с помощью приближений Тейлора.
  explanation: Разложение Тейлора опирается на производные. Если функция негладкая или её производные резко меняются, построенная в текущей точке модель хуже предсказывает значение после смещения.
  kind: open
  reference: У гладкой функции существуют и предсказуемо меняются необходимые производные, поэтому её поведение рядом с текущей точкой можно приближать многочленом и использовать эту локальную модель для выбора шага.
  id: 049-teylor-3
