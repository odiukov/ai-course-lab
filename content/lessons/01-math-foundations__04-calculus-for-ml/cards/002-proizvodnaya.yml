- concept: численная производная вычисляется как отношение приращения функции к малому приращению аргумента
  question: Восстановите знаменатель в формуле односторонней численной производной.
  explanation: Числитель показывает изменение функции, а h — изменение аргумента. Их отношение приближает мгновенную скорость изменения.
  kind: cloze
  template: f'(x) ≈ (f(x + h) - f(x)) / ___
  answer: h
  accept:
    - h
  id: 002-proizvodnaya-1
  fingerprint: 940b6dbb
- concept: нулевая производная в точке означает горизонтальную касательную только в этой точке
  question: Производная функции в точке a равна нулю. Какой вывод обязательно верен?
  explanation: Нулевая производная означает отсутствие линейного изменения непосредственно в этой точке. Она не гарантирует ни постоянство функции, ни минимум.
  kind: choice
  options:
    - Касательная к графику в точке a горизонтальна
    - Функция равна нулю во всех точках
    - Функция постоянна на всей области определения
    - Точка a обязательно является минимумом
  correct: 0
  id: 002-proizvodnaya-2
  fingerprint: 486d4c22
- concept: производная позволяет оценить малое изменение функции по формуле Δy ≈ f'(x)Δx
  question: В некоторой точке производная функции равна -7. Аргумент увеличили на 0.006. Оцените изменение функции с помощью линейного приближения.
  explanation: Для малого сдвига Δy ≈ f'(x)Δx. Поэтому изменение примерно равно произведению -7 и 0.006, то есть -0.042.
  kind: numeric
  answer: -0.042
  tolerance: 0.001
  id: 002-proizvodnaya-3
  fingerprint: b28a5971
