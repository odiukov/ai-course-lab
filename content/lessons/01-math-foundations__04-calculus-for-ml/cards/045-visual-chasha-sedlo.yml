- concept: разные знаки собственных значений гессиана указывают на седловую точку
  question: Как классифицируется стационарная точка, если матрица Гессе имеет собственные значения разных знаков?
  explanation: Положительное собственное значение соответствует изгибу вверх вдоль одного направления, а отрицательное — изгибу вниз вдоль другого. Поэтому точка не является ни локальным минимумом, ни локальным максимумом.
  kind: cloze
  template: Если в стационарной точке собственные значения матрицы Гессе имеют разные знаки, то эта точка — ___.
  answer: седловая точка
  accept:
    - седло
    - седловая
