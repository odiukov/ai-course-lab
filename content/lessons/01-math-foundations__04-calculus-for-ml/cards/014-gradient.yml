- concept: компоненты градиента располагаются в том же порядке, что и переменные функции
  question: Параметры функции потерь записаны в порядке (a, b, c, d). Как должен быть упорядочен её градиент?
  explanation: Каждая координата градиента соответствует переменной на той же позиции. Например, для f(x, y, z) градиент записывают как [∂f/∂x, ∂f/∂y, ∂f/∂z].
  kind: choice
  options:
    - '[∂L/∂a, ∂L/∂b, ∂L/∂c, ∂L/∂d]'
    - '[∂L/∂d, ∂L/∂c, ∂L/∂b, ∂L/∂a]'
    - '[∂L/∂a, ∂L/∂c, ∂L/∂b, ∂L/∂d]'
  correct: 0
  id: 014-gradient-1
  fingerprint: 174e7b5d
- concept: градиент одной функции может принимать разные значения в разных точках
  question: У одной и той же дифференцируемой функции градиенты в точках A и B различаются. Противоречит ли это определению градиента? Объясните своими словами.
  explanation: Градиент является зависящим от точки вектором. Например, у функции x² + y² в точке (1, 1) он равен [2, 2], а в точке (0, 0) — [0, 0].
  kind: open
  reference: Нет. Градиент вычисляется в конкретной точке, поэтому значения его компонент — частных производных — могут меняться при переходе к другой точке.
  id: 014-gradient-2
  fingerprint: c596467d
