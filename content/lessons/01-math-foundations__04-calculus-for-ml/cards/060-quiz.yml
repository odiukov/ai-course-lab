- concept: интеграл скорости накопления даёт накопленную величину
  question: Пусть p(t) — мощность устройства как функция времени. Объясни своими словами, что означает интеграл p(t) по промежутку времени.
  explanation: Интеграл суммирует малые вклады мощности за весь промежуток. Произведение единиц мощности на единицы времени даёт единицы энергии.
  kind: open
  reference: Интеграл мощности по времени равен энергии, переданной или израсходованной устройством за этот промежуток.
