- concept: вероятность интервала непрерывной случайной величины равна интегралу её плотности по этому интервалу
  question: Непрерывная случайная величина X имеет плотность p(x). Как вычислить вероятность того, что X попадёт между u и v?
  explanation: Плотность в отдельной точке не является вероятностью. Вероятность диапазона задаётся площадью под графиком плотности на этом диапазоне, то есть определённым интегралом.
  kind: choice
  options:
    - Проинтегрировать p(x) от u до v
    - Вычислить p в середине интервала
    - Вычесть p(u) из p(v)
    - Найти максимальное значение p(x) на интервале
  correct: 0
  id: 054-integraly-v-ml-1
  fingerprint: 1f586c8f
- concept: математическое ожидание функции является интегралом её значения, взвешенного плотностью
  question: Заполни пропуск в формуле математического ожидания функции непрерывной случайной величины.
  explanation: Каждое значение g(x) получает вес p(x). В ML ожидаемый loss по распределению данных имеет такой вид, а средний loss на конечной выборке служит его эмпирическим приближением.
  kind: cloze
  template: E[g(X)] = ∫ ___ dx
  answer: g(x) * p(x)
  accept:
    - g(x)p(x)
    - p(x)g(x)
    - p(x) * g(x)
  id: 054-integraly-v-ml-2
  fingerprint: 8ad54943
- concept: интеграл правдоподобия и априорной плотности служит нормировочной константой байесовского апостериорного распределения
  question: Объясни своими словами, зачем в знаменателе формулы Байеса интегрируют произведение правдоподобия и априорной плотности по всем возможным значениям параметров.
  explanation: Числитель задаёт относительную правдоподобность каждого значения параметров, а знаменатель нормирует эти величины. Именно сложность такого интеграла часто делает точный байесовский вывод невозможным.
  kind: open
  reference: Этот интеграл учитывает все возможные значения параметров и образует нормировочную константу, благодаря которой апостериорная плотность становится корректным распределением вероятностей. Если интеграл нельзя вычислить аналитически, используют приближённые методы, например MCMC или вариационный вывод.
  id: 054-integraly-v-ml-3
  fingerprint: 67775ab9
