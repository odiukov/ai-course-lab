- concept: слишком маленький learning rate обеспечивает устойчивое, но чрезмерно медленное снижение loss
  question: Loss устойчиво уменьшается на каждой итерации, но за доступное время почти не приближается к минимуму. Что это говорит о learning rate и как его следует изменить?
  explanation: Малый learning rate не обязательно мешает двигаться в сторону минимума, однако делает обновления настолько короткими, что сходимость занимает слишком много итераций. Увеличение длины шага ускоряет обучение, пока не появляются перелёты и нестабильность.
  kind: open
  reference: 'Learning rate, вероятно, слишком маленький: направление обновлений верное, но шаги недостаточны. Его следует осторожно увеличить, контролируя, чтобы loss не начал колебаться или расти.'
