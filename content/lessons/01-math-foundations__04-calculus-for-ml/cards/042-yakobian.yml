- concept: размер якобиана определяется числом выходных и входных координат отображения
  question: Отображение переводит вектор из R^37 в вектор из R^11. Какой размер имеет его якобиан?
  explanation: В якобиане каждому выходу соответствует строка, а каждому входу — столбец. Поэтому отображению из R^37 в R^11 соответствует матрица размера 11 × 37.
  kind: choice
  options:
    - 11 × 37
    - 37 × 11
    - 37 × 37
    - 11 × 11
  correct: 0
  id: 042-yakobian-1
  fingerprint: c5cda06f
- concept: элемент якобиана выражает чувствительность конкретного выхода к конкретному входу
  question: Заполни пропуск в формуле элемента якобиана.
  explanation: Элемент в строке i и столбце j показывает, как меняется выход f_i при малом изменении входа x_j, если остальные входы зафиксированы.
  kind: cloze
  template: J_{ij} = ___
  answer: ∂f_i/∂x_j
  accept:
    - \frac{\partial f_i}{\partial x_j}
    - df_i/dx_j
  id: 042-yakobian-2
  fingerprint: 8d9f3af7
- concept: транспонированный якобиан переносит градиент от пространства выходов к пространству входов
  question: Объясни своими словами, зачем при обратном распространении градиент по выходу умножают на транспонированный якобиан слоя.
  explanation: 'Если прямой якобиан имеет по строке на каждый выход и по столбцу на каждый вход, то его транспонированная версия действует в обратном направлении: превращает градиент по выходам в градиент по входам.'
  kind: open
  reference: 'Якобиан отображает малые изменения входа в изменения выхода. Для обратного переноса чувствительности нужно выполнить сопряжённое действие: умножить градиент по выходу на транспонированный якобиан. В результате получается градиент с одной компонентой для каждой входной координаты.'
  id: 042-yakobian-3
  fingerprint: f3126935
