  fingerprint: 59f0398b
- concept: градиентный спуск можно останавливать по малой величине обновления вместо точного достижения минимума
  question: Какой критерий разумно использовать для остановки градиентного спуска, который приближается к минимуму всё более короткими шагами?
  explanation: Итерационный метод может лишь асимптотически приближаться к минимуму. Когда очередное обновление уже пренебрежимо мало, дальнейшие вычисления почти не меняют параметры, поэтому используют небольшой порог для нормы шага или градиента.
  kind: choice
  options:
    - Остановиться, когда норма очередного изменения параметров станет меньше заданного порога
    - Продолжать, пока параметры не совпадут с координатами минимума абсолютно точно
    - Остановиться сразу после первого уменьшения функции потерь
    - Продолжать, пока длина каждого шага не станет равна learning rate
  correct: 0
