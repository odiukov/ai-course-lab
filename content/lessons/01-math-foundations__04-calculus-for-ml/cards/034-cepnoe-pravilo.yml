- concept: обратное распространение переносит чувствительность ошибки к ранним величинам последовательным применением цепного правила
  question: Объясните своими словами, как обратное распространение вычисляет влияние параметра раннего слоя на итоговую функцию потерь.
  explanation: Нейросеть является композицией функций. Цепное правило связывает производную потерь по раннему параметру с локальными производными всех последующих операций, а обратное распространение эффективно вычисляет это произведение от выхода ко входу.
  kind: open
  reference: Алгоритм начинает с производной функции потерь на выходе и движется к ранним слоям. На каждом переходе текущая производная умножается на локальную производную соответствующей операции, поэтому влияние параметра получается как произведение производных вдоль пути от него до потерь.
  id: 034-cepnoe-pravilo-2
