- concept: при отрицательной кривизне стационарная точка квадратичной модели является максимумом, а не минимумом
  question: В точке x выполнено f'(x) = 6 и f''(x) = -3. Что важно учесть при применении шага Ньютона?
  explanation: При f''(x) < 0 квадратичная модель открыта вниз и не имеет конечного минимума. Формальный шаг Ньютона находит её стационарную точку, но это максимум модели, поэтому уменьшение исходной функции не гарантировано.
  kind: choice
  options:
    - Квадратичная модель выпукла, поэтому шаг гарантированно ведёт к её минимуму
    - Квадратичная модель открыта вниз, поэтому найденная стационарная точка является её максимумом
    - Отрицательная вторая производная автоматически превращает шаг Ньютона в нулевой
    - Знак второй производной влияет только на величину шага, но не на его направление
  correct: 1
