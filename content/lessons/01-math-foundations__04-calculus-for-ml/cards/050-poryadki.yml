- concept: минимум квадратичной модели Тейлора определяет шаг как отношение наклона к кривизне
  question: В текущей точке f'(x) = -14, а f''(x) = 7. Какое смещение h предлагает минимизация квадратичной модели Тейлора?
  explanation: Для квадратичной модели h = -f'(x)/f''(x). Поэтому h = -(-14)/7 = 2.
  kind: numeric
  answer: 2
  tolerance: 0.001
  id: 050-poryadki-2
