- concept: антиградиент задаёт направление наискорейшего локального убывания функции
  question: В некоторой точке градиент функции равен [4, -6]. Какой вектор направлен в сторону её наискорейшего локального убывания?
  explanation: 'Градиент направлен в сторону наискорейшего роста, поэтому для наискорейшего убывания нужно сменить знаки всех его компонентов: -[4, -6] = [-4, 6].'
  kind: choice
  options:
    - '[4, -6]'
    - '[4, 6]'
    - '[-4, 6]'
    - '[-6, -4]'
  correct: 2
  id: 015-napravlenie-1
  fingerprint: e9ac40dd
- concept: градиент ненулевой величины перпендикулярен локальной линии уровня
  question: Как ориентирован ненулевой градиент функции относительно проходящей через ту же точку гладкой линии уровня? Объясни своими словами.
  explanation: На линии уровня значение функции постоянно, поэтому направление изменения вдоль неё не имеет составляющей по градиенту. Следовательно, градиент перпендикулярен линии уровня и указывает в сторону роста.
  kind: open
  reference: Градиент перпендикулярен линии уровня и направлен в сторону увеличения функции. Движение вдоль линии уровня в первом приближении не меняет значение функции.
  id: 015-napravlenie-2
  fingerprint: d35f5de4
