- concept: Adam дёшево адаптирует шаг каждого параметра по скользящим статистикам его градиентов
  question: Объясни своими словами, почему Adam может подбирать разные масштабы обновления для параметров, не вычисляя полный гессиан.
  explanation: Полный гессиан содержит сведения о каждой паре параметров. Adam вместо этого ведёт несколько скалярных статистик для каждого параметра и получает дешёвое покоординатное приближение информации о масштабе и изменчивости градиента.
  kind: open
  reference: Adam отдельно для каждого параметра отслеживает скользящие статистики градиентов, включая их среднее и разброс. По ним он изменяет масштаб обновления этой координаты, сохраняя лишь линейное по числу параметров количество данных и не моделируя попарные взаимодействия параметров.
  id: 048-cena-gessiana-2
