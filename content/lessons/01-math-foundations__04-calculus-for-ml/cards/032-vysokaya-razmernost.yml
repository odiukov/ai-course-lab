- concept: наличие хотя бы одного направления локального убывания отличает седловую точку от локального минимума
  question: В некоторой точке пространства параметров малое смещение вдоль одних направлений увеличивает loss, а вдоль другого направления уменьшает его. Как лучше всего описать эту точку?
  explanation: Для локального минимума loss не должен уменьшаться ни в одном достаточно малом направлении. Если направление убывания существует, точка не является локальным минимумом; сочетание направлений подъёма и спуска характерно для седла.
  kind: choice
  options:
    - Это обязательно глобальный минимум
    - Это не локальный минимум и может быть седловой точкой
    - Это обязательно локальный максимум
    - Это локальный минимум, потому что в некоторых направлениях loss растёт
