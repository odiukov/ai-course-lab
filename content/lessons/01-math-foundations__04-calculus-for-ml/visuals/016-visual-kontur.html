<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Линии уровня и градиент</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1a1d21; --muted:#5d666e; --axis:#98a2ab;
    --lvl:#c6d4e3; --lvlhi:#3f76ab; --grad:#c8394f; --neg:#1a8a78; --pt:#22262b;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14181d; --fg:#e7ebef; --muted:#9aa5ae; --axis:#5b656e;
      --lvl:#33424f; --lvlhi:#7fb3e0; --grad:#f2758c; --neg:#4fd0bb; --pt:#e7ebef;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{padding:8px 10px 10px;box-sizing:border-box}
  h2{margin:0 0 4px;font-size:16px;font-weight:600}
  svg{display:block;width:100%;height:auto;max-height:520px}
  .fail{font-size:14px;line-height:1.5;padding:6px 0}
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .lb{font-size:15px;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
  .lb.g{fill:var(--grad)} .lb.n{fill:var(--neg)} .lb.l{fill:var(--lvlhi)}
  .tk{font-size:13px;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
  .cap{font-size:13px;fill:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h2>Линии уровня f(x,y) = x² + y² и градиент в точке (1, 1)</h2>
  <svg id="d" viewBox="0 0 480 455" role="img"
       aria-label="Контурный график x²+y² с градиентом в точке (1,1)">
    <rect x="0" y="0" width="480" height="455" fill="var(--bg)"></rect>
  </svg>
  <div id="fb"></div>
</div>
<script>
(function(){
  var svg=document.getElementById('d');
  try{
    /* ---- данные схемы ---- */
    var D={
      levels:[1,2,3,4,5,6,7,8,9],
      labeled:[1,4],
      through:2,
      point:[1,1],
      grad:[2,2],
      axisMax:3.3,
      ticks:[-3,-2,-1,1,2,3],
      tickNums:[1,2,3],
      tickLen:0.12,
      head:0.3,
      headW:0.13,
      sq:0.3,
      dotR:0.055,
      lvlDir:[-0.7071,0.7071],
      capX:-3.3,
      capY:[-3.85,-4.15]
    };
    /* ---- одна система координат ---- */
    var ORIGIN={x:200,y:215}, SCALE=56;
    function sx(x){ return ORIGIN.x + x*SCALE; }
    function sy(y){ return ORIGIN.y - y*SCALE; }

    var NS='http://www.w3.org/2000/svg';
    function E(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}
    var g=E('g',{}); svg.appendChild(g);

    function seg(p,q,stroke,w,dash){
      var a={x1:sx(p[0]),y1:sy(p[1]),x2:sx(q[0]),y2:sy(q[1]),
             stroke:stroke,'stroke-width':w,'stroke-linecap':'round'};
      if(dash)a['stroke-dasharray']=dash;
      g.appendChild(E('line',a));
    }
    function ring(r,stroke,w){
      g.appendChild(E('circle',{cx:sx(0),cy:sy(0),r:sx(r)-sx(0),
        fill:'none',stroke:stroke,'stroke-width':w}));
    }
    function label(p,dx,dy,anchor,txt,cls){
      var t=E('text',{x:sx(p[0])+dx,y:sy(p[1])+dy,'text-anchor':anchor,class:cls});
      t.textContent=txt; g.appendChild(t);
    }
    function arrow(p,q,color,w){
      var dx=q[0]-p[0], dy=q[1]-p[1], L=Math.sqrt(dx*dx+dy*dy);
      var ux=dx/L, uy=dy/L, nx=-uy, ny=ux;
      var b=[q[0]-ux*D.head, q[1]-uy*D.head];
      seg(p,b,color,w);
      var pts=[q,[b[0]+nx*D.headW,b[1]+ny*D.headW],[b[0]-nx*D.headW,b[1]-ny*D.headW]]
        .map(function(v){return sx(v[0])+','+sy(v[1]);}).join(' ');
      g.appendChild(E('polygon',{points:pts,fill:color}));
    }

    /* линии уровня: равный шаг по f -> к краю линии гуще */
    D.levels.forEach(function(f){
      var r=Math.sqrt(f);
      var hi=(f===D.through);
      ring(r, hi?'var(--lvlhi)':'var(--lvl)', hi?2:1.4);
    });

    /* оси */
    seg([-D.axisMax,0],[D.axisMax,0],'var(--axis)',1.2);
    seg([0,-D.axisMax],[0,D.axisMax],'var(--axis)',1.2);
    D.ticks.forEach(function(t){
      seg([t,-D.tickLen],[t,D.tickLen],'var(--axis)',1.2);
      seg([-D.tickLen,t],[D.tickLen,t],'var(--axis)',1.2);
    });
    D.tickNums.forEach(function(t){
      label([t,0],0,17,'middle',String(t),'tk');
      label([0,t],-8,5,'end',String(t),'tk');
    });
    label([D.axisMax,0],8,5,'start','x','tk');
    label([0,D.axisMax],0,-8,'middle','y','tk');

    /* подписи уровней: вверх-влево, по диагонали, врозь */
    D.labeled.forEach(function(f){
      var r=Math.sqrt(f);
      label([D.lvlDir[0]*r,D.lvlDir[1]*r],-8,5,'end','f = '+f,'lb l');
    });

    /* минимум */
    g.appendChild(E('circle',{cx:sx(0),cy:sy(0),r:sx(D.dotR)-sx(0),fill:'var(--pt)'}));
    label([0,0],-10,-8,'end','(0, 0) — минимум','lb');

    /* точка (1,1) */
    var P=D.point;
    var gl=Math.sqrt(D.grad[0]*D.grad[0]+D.grad[1]*D.grad[1]);
    var ug=[D.grad[0]/gl,D.grad[1]/gl], ut=[-ug[1],ug[0]];

    /* прямой угол между линией уровня и градиентом */
    var m=D.sq;
    var q1=[P[0]+ut[0]*m, P[1]+ut[1]*m];
    var q2=[q1[0]+ug[0]*m, q1[1]+ug[1]*m];
    var q3=[P[0]+ug[0]*m, P[1]+ug[1]*m];
    g.appendChild(E('polyline',{
      points:[q1,q2,q3].map(function(v){return sx(v[0])+','+sy(v[1]);}).join(' '),
      fill:'none',stroke:'var(--muted)','stroke-width':1.2}));

    /* grad и -grad */
    var tipUp=[P[0]+D.grad[0], P[1]+D.grad[1]];
    var tipDn=[P[0]-D.grad[0], P[1]-D.grad[1]];
    arrow(P,tipUp,'var(--grad)',2.4);
    arrow(P,tipDn,'var(--neg)',2.4);

    g.appendChild(E('circle',{cx:sx(P[0]),cy:sy(P[1]),r:sx(D.dotR)-sx(0),fill:'var(--pt)'}));
    label(P,12,22,'start','(1, 1)','lb');

    /* подписи стрелок: сбоку от середины, не у наконечника */
    label([P[0]+D.grad[0]*0.4, P[1]+D.grad[1]*0.4],14,-6,'start','grad = [2, 2]','lb g');
    label([P[0]-D.grad[0]*0.32, P[1]-D.grad[1]*1.08],12,4,'start','-grad = [-2, -2]','lb n');

    /* легенда */
    label([D.capX,D.capY[0]],0,0,'start',
      'Окружности — линии уровня f = const: гуще линии — круче склон.','cap');
    label([D.capX,D.capY[1]],0,0,'start',
      'Градиент перпендикулярен линии уровня; шаг вниз — против градиента.','cap');
  }catch(e){
    document.getElementById('fb').innerHTML='<div class="fail">'+
      'Схема должна показывать контурный график f(x,y) = x² + y²: концентрические '+
      'окружности вокруг минимума (0, 0), линии уровня f = 1 и f = 4. В точке (1, 1) '+
      'из неё выходит стрелка grad = [2, 2] прочь от центра и стрелка -grad = [-2, -2] '+
      'к центру; обе перпендикулярны линии уровня, проходящей через (1, 1).</div>';
  }
})();
</script>
</body>
</html>
