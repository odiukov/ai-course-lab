<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Где приближение разваливается</title>
<style>
  :root{
    --bg:#fbfaf8; --ink:#1e2430; --muted:#6b7280; --axis:#8b93a1;
    --curve:#2563a8; --line:#c2410c; --gap:#b91c1c; --soft:#e3ded6;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14181f; --ink:#e6e9ef; --muted:#9aa3b2; --axis:#5c6572;
      --curve:#7fb2ea; --line:#f59e6b; --gap:#ef7b7b; --soft:#242a34;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:400 15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:624px;margin:0 auto;padding:10px 12px 14px;box-sizing:border-box;}
  h2{margin:0 0 6px;font-size:15px;font-weight:600;}
  p.sub{margin:0 0 8px;font-size:13px;color:var(--muted);}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .fb{font-size:13px;color:var(--ink);border:1px solid var(--soft);padding:10px;border-radius:6px;}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;fill:var(--ink);}
</style>
<div class="wrap">
  <h2>Где приближение разваливается: sin h против прямой h</h2>
  <p class="sub">Прямая h — это касательная к sin h в нуле. Вертикальные штрихи — ошибка приближения на шаге h.</p>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    /* ---- данные схемы ---- */
    var DATA = {
      points:[
        {h:0.1, s:0.0998},
        {h:0.5, s:0.479},
        {h:1.0, s:0.841},
        {h:2.0, s:0.909}
      ],
      yTicks:[0.5,1.0,1.5,2.0],
      xMin:-0.05, xMax:2.35, yMin:-0.05, yMax:2.2,
      lineMax:2.15, step:0.05,
      tick:0.05, mark:0.06,
      arrow:{len:0.07, half:0.05}
    };

    /* ---- одна пара функций перевода ---- */
    var origin = {x:95, y:376}, scale = 160;
    function sx(x){ return origin.x + x*scale; }
    function sy(y){ return origin.y - y*scale; }

    /* ---- пиксельные отступы подписей ---- */
    var PAD = 8, ROW1 = 18, ROW2 = 36, ROW3 = 56;
    var W = 540, H = 450, LW = 1.2, LW2 = 2, FS = 13, FSm = 12;

    var NS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    svg.setAttribute('role','img');
    svg.setAttribute('aria-label','График sin h и прямой h: при h=0.1 они совпадают, при h=2.0 прямая промахивается вдвое');

    function el(n,a){ var e=document.createElementNS(NS,n);
      for(var k in a) e.setAttribute(k,a[k]); svg.appendChild(e); return e; }
    function line(x1,y1,x2,y2,stroke,w,dash){
      var a={x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),stroke:stroke,
             'stroke-width':(w||LW),'stroke-linecap':'round'};
      if(dash) a['stroke-dasharray']=dash;
      return el('line',a);
    }
    function dot(x,y,fill,r){ return el('circle',{cx:sx(x),cy:sy(y),r:r,fill:fill}); }
    function label(x,y,dx,dy,anchor,txt,fill,size){
      var t=el('text',{x:sx(x)+dx,y:sy(y)+dy,'text-anchor':anchor,
        'font-size':(size||FS),fill:fill||'var(--ink)'});
      t.textContent=txt; return t;
    }

    /* ---- оси ---- */
    line(DATA.xMin, 0, DATA.xMax, 0, 'var(--axis)', LW);
    line(0, DATA.yMin, 0, DATA.yMax, 'var(--axis)', LW);
    var A = DATA.arrow;
    el('polyline',{points:[
        sx(DATA.xMax-A.len)+','+sy(A.half),
        sx(DATA.xMax)+','+sy(0),
        sx(DATA.xMax-A.len)+','+sy(-A.half)
      ].join(' '),fill:'none',stroke:'var(--axis)','stroke-width':LW});
    el('polyline',{points:[
        sx(-A.half)+','+sy(DATA.yMax-A.len),
        sx(0)+','+sy(DATA.yMax),
        sx(A.half)+','+sy(DATA.yMax-A.len)
      ].join(' '),fill:'none',stroke:'var(--axis)','stroke-width':LW});
    label(DATA.xMax, 0, PAD, ROW1, 'start', 'h', 'var(--muted)', FSm);

    /* ---- засечки по вертикали ---- */
    DATA.yTicks.forEach(function(v){
      line(0, v, DATA.tick, v, 'var(--axis)', LW);
      label(0, v, -PAD, 4, 'end', v.toFixed(1), 'var(--muted)', FSm);
    });

    /* ---- прямая h (касательная в нуле) ---- */
    line(0, 0, DATA.lineMax, DATA.lineMax, 'var(--line)', LW2);

    /* ---- кривая sin h ---- */
    var pts=[], x;
    for(x=0; x<=DATA.xMax+DATA.step/2; x+=DATA.step){
      var xx = Math.min(x, DATA.xMax);
      pts.push(sx(xx)+','+sy(Math.sin(xx)));
    }
    el('polyline',{points:pts.join(' '),fill:'none',stroke:'var(--curve)',
      'stroke-width':LW2,'stroke-linejoin':'round'});

    /* ---- щели между прямой и кривой ---- */
    DATA.points.forEach(function(p){
      line(p.h, p.s, p.h, p.h, 'var(--gap)', LW2, '4 3');
      line(p.h, 0, p.h, DATA.tick, 'var(--axis)', LW);
      dot(p.h, p.h, 'var(--line)', 3.5);
      dot(p.h, p.s, 'var(--curve)', 3.5);
      label(p.h, 0, 0, ROW1, 'middle', p.h.toFixed(1), 'var(--muted)', FSm);
      label(p.h, 0, 0, ROW2, 'middle', p.s.toFixed(p.h===0.1?4:3), 'var(--curve)', FSm);
    });
    label(0, 0, -PAD, ROW1, 'end', 'h =', 'var(--muted)', FSm);
    label(0, 0, -PAD, ROW2, 'end', 'sin h =', 'var(--muted)', FSm);

    /* ---- подписи кривых: у середины, в разные стороны ---- */
    label(1.2, 1.2, -PAD, -PAD, 'end', 'прямая h', 'var(--line)', FS);
    label(1.35, Math.sin(1.35), PAD, ROW1+4, 'start', 'sin h', 'var(--curve)', FS);

    /* ---- совпадение при h = 0.1 ---- */
    el('circle',{cx:sx(0.1),cy:sy(0.0998),r:(sx(DATA.mark)-sx(0)),
      fill:'none',stroke:'var(--gap)','stroke-width':LW});
    label(0.1, 0, 0, ROW3, 'middle', 'совпадение', 'var(--gap)', FSm);

    /* ---- промах при h = 2.0 ---- */
    label(2.0, 2.0, -PAD, -4, 'end', '2.0', 'var(--line)', FS);
    label(2.0, 1.45, PAD, 0, 'start', 'промах вдвое', 'var(--gap)', FS);
    label(2.0, 0.909, PAD, -ROW1+4, 'start', '0.909', 'var(--curve)', FS);

    host.appendChild(svg);
  }catch(e){
    host.innerHTML = '<div class="fb"><b>Схема не построилась.</b> Она должна показывать '+
      'кривую sin h и прямую h из одной точки (0, 0): при h = 0.1 они практически совпадают '+
      '(0.0998 против 0.1), при h = 0.5 щель уже видна (0.479 против 0.5), при h = 1.0 она '+
      'заметна (0.841 против 1.0), а при h = 2.0 прямая промахивается вдвое (0.909 против 2.0). '+
      'Ошибка растёт как h², а не пропорционально h.</div>';
  }
})();
</script>
</html>
