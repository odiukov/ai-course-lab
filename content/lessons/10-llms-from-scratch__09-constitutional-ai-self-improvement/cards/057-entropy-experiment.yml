- concept: энтропийный штраф не различает качественные и слабые продолжения, поэтому большой коэффициент оплачивает разнообразие средней наградой
  question: Инженер поднимает коэффициент энтропийной регуляризации с 0.02 до 0.5 и получает заметно более разнообразные ответы при упавшей средней награде. Объясни своими словами, почему такой исход закономерен.
  explanation: 'Энтропия слепа к содержанию: это функция только распределения вероятностей. Поэтому α — параметр компромисса. Слишком малое α не удерживает разнообразие, слишком большое — размазывает вероятность по слабым ответам и роняет награду. Практический вывод: α подбирают по совместной динамике награды и метрик разнообразия, а не по одному из показателей.'
  kind: open
  reference: 'Энтропийное слагаемое зависит только от формы распределения вероятностей, а не от того, насколько хорош каждый вариант: оно одинаково поощряет сохранение вероятностной массы и у сильных, и у слабых продолжений. При маленьком коэффициенте это слабый штраф за преждевременную уверенность — он мешает политике отбросить конкурентов после нескольких удачных совпадений. При большом коэффициенте энтропийный член начинает перевешивать сигнал награды, и политике становится выгодно держать вероятность на заведомо плохих вариантах. То есть α задаёт цену, которую платят средней наградой за сохранённое разнообразие; разнообразие само по себе не является качеством и новых способностей не добавляет.'
  id: 057-entropy-experiment-3
  fingerprint: 4da0ad84
