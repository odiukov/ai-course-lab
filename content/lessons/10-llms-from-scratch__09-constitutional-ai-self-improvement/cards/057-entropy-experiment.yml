- concept: энтропия максимальна при равномерном распределении и равна логарифму числа вариантов
  question: На очередном шаге у политики ровно 8 допустимых продолжений, и вероятность распределена между ними поровну. Чему равна энтропия H(π) этого распределения в натах?
  explanation: Равномерное распределение по k вариантам даёт максимум энтропии, равный ln k. ln 8 ≈ 2.08 ната. Если бы почти вся вероятность ушла к одному продолжению, H(π) стремилась бы к нулю — это и есть числовой признак схлопывания, который энтропийная регуляризация штрафует.
  kind: numeric
  answer: 2.08
  tolerance: 0.03
