- concept: пустой список нарушений — валидный результат критика, а не ошибка или отсутствие ответа
  question: Конституционный критик проверил ответ модели по принципу и не нашёл ни одного нарушения. Что он должен вернуть?
  explanation: 'Форма результата не зависит от исхода проверки: всегда принцип плюс список претензий. Пустой список — полноценный ответ «нарушений нет». None, исключение или строка ломают контракт, и следующему звену пришлось бы разбирать несколько разных форм вместо одной.'
  kind: choice
