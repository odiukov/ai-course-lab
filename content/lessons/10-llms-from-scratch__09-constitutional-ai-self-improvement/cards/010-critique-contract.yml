- concept: критик только диагностирует; правка ответа — отдельный шаг, поэтому реализацию критика можно заменить без перестройки пайплайна
  question: Команда меняет рукописную рубрику-критика на вызов LLM, которая оценивает смысл ответа. Что позволяет сделать замену, не трогая остальные звенья пайплайна?
  explanation: 'Заменяемость держится на форме, а не на качестве проверки: рубрика может грубо считать слова и запятые, LLM учитывает смысл, но интерфейс один. Критик выдаёт только диагноз; переписывание — отдельная функция ревизии. Если бы критик сам возвращал исправленный текст, граница ответственности размылась бы и звено правки пришлось бы менять вместе с критиком.'
  kind: choice
  options:
    - 'Обе реализации соблюдают один контракт: получают ответ и принцип, возвращают принцип и список конкретных нарушений, ничего не переписывая'
    - Обе реализации используют одинаковые пороги по длине ответа и количеству запятых
    - LLM-критик сразу возвращает исправленный ответ, поэтому шаг правки становится не нужен
    - Рубрика и LLM дают одинаковую точность, поэтому разницы для пайплайна нет
