- concept: самодистилляция сильнее сужает задачи с широким множеством приемлемых ответов, чем задачи с внешне проверяемым результатом
  question: Объясни своими словами, почему многократные раунды самообучения на собственных отобранных ответах вредят открытым творческим задачам сильнее, чем задачам с автоматически проверяемым результатом.
  explanation: Ключ — что служит опорой отбора. Внешнее правило привязано к миру и не зависит от текущих привычек модели; критик или собственная оценка предпочтения такой привязки не имеют и усиливают уже доминирующие формы.
  kind: open
  reference: 'У проверяемой задачи отбор ведёт внешнее правило: оно пропускает ответ по признаку правильности, а правильный итог фактически единственный, и сужение формы ответа почти ничего не портит — ценность задачи в самом итоге. У творческой задачи ценность распределена по множеству допустимых вариантов, а отбирает их либо сам критик, либо модельная оценка предпочтительности. Такой отбор систематически повышает вес форм, которые модель и так порождает чаще всего; следующий раунд сэмплирует уже из суженного распределения и повторяет отбор. Через несколько итераций остаются несколько безопасных шаблонов, повторяющиеся обороты и излишняя самоуверенность. Поэтому в творческую часть пайплайна подмешивают свежие человеческие данные, а для проверяемых задач допустимо больше автоматических раундов.'
  id: 045-loop-visual-2
  fingerprint: 96f090a3
- concept: сужение распределения накапливается по раундам мультипликативно, поэтому деградация заметна лишь через несколько итераций
  question: Модель порождает 250 различных стратегий решения на контрольном наборе задач. Каждый раунд самодистилляции сохраняет 80% стратегий, доживших до предыдущего раунда. Сколько различных стратегий останется после 5 раундов?
  explanation: 250 · 0.8^5 = 250 · 0.32768 ≈ 81.9. После одного раунда потеряно всего 20% — деградация почти незаметна, но потери перемножаются, и к пятому раунду остаётся треть исходного разнообразия. Именно поэтому mode collapse ловят не после первой итерации, а через несколько раундов, когда откатить его уже дорого.
  kind: numeric
  answer: 81.9
  tolerance: 1
