- concept: 'требования аудита конъюнктивны: превышение одного лимита не компенсируется улучшением по другому показателю'
  question: Прогон показал рост средней награды с 0,55 до 0,87, разнообразие выше нижней границы, но KL до референсной модели вышел за выделенный бюджет вдвое. Объясни своими словами, почему аудит не должен пропускать такой раунд, ссылаясь на рост награды и сохранённое разнообразие.
  explanation: 'Логика допуска конъюнктивная: одобрение требует выполнения всех условий сразу. Компенсаторная логика («награда +0,32 перевесила KL») ломает смысл бюджета — лимит, который можно выкупить хорошей метрикой, лимитом не является. Плюс здесь есть подвох по направлению вывода: чем сильнее ушла политика, тем меньше доверия к тому же самому росту награды.'
  kind: open
  reference: 'Условия аудита проверяются совместно и каждое по отдельности, а не суммируются в общий балл. Награда — это показание измерителя, а не сама цель: при уходе политики далеко от референса растёт вероятность, что модель нашла слабость правила награды, и высокое значение как раз перестаёт быть свидетельством качества. Разнообразие закрывает другой отказ (схлопывание распределения) и ничего не говорит о том, соответствует ли сдвинувшееся поведение исходным требованиям. Поэтому превышенный KL-бюджет — самостоятельное основание для отказа: раунд останавливают, а не обменивают лимит на прирост награды.'
  id: 054-auditor-2
  fingerprint: e0f9bee7
- concept: требование проверяемости правила награды означает, что оно измеряет целевой результат, а не удобный коррелирующий суррогат
  question: Цель — корректность решений задач по программированию. Какое правило награды удовлетворяет условию аудита «правило проверяет именно нужный результат, а не удобный суррогат»?
  explanation: 'Проверяемость означает наличие внешнего детерминированного проверщика целевого свойства. Тесты исполняют код и проверяют ровно то, ради чего пайплайн запущен. Форматные и стилевые признаки коррелируют с качеством, но оптимизируются напрямую и без роста корректности; самооценка моделью замыкает контур внутри самой политики, поэтому её слабости попадают прямо в целевую функцию. Именно поэтому аудитор проверяет это условие до запуска: если измеритель — суррогат, любой рост награды нечитаем.'
  kind: choice
  options:
    - Запуск скрытого набора тестов на сгенерированном коде, награда за долю пройденных
    - Награда за наличие блока кода в тегах и длину ответа свыше 200 символов
    - Оценка кода той же моделью по инструкции «похоже ли это на правильное решение»
    - Награда за совпадение ответа со стилем решений из обучающего корпуса
