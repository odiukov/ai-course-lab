- concept: 'при бинарной награде величина преимущества успешного ответа определяется долей успехов в группе: чем реже успех, тем больше преимущество'
  question: 'Группа из 10 ответов на один промпт, награда бинарная: верный ответ получает единичную награду, неверный — нулевую. Верных ответов оказалось два. Преимущество считается как z-оценка награды по группе. Чему равно преимущество верного ответа?'
  explanation: Средняя награда группы = 0.2, стандартное отклонение = sqrt(0.2·0.8) = 0.4. Преимущество верного ответа = (1 − 0.2)/0.4 = 2.0, неверного = (0 − 0.2)/0.4 = −0.5. Редкий успех получает крупное положительное преимущество, а масса неудач — слабое отрицательное; при равном числе верных и неверных обе величины были бы по модулю равны единице.
