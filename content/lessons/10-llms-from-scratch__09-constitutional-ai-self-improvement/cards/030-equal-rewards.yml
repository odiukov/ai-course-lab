- concept: промпты для GRPO отбирают по доле успехов строго между нулём и максимумом, потому что группы с крайней долей успеха расходуют сэмплирование, не давая градиента
  question: GRPO генерирует по 16 ответов на промпт, и на это уходит основная часть вычислений шага. Объясни своими словами, по какому признаку стоит отбирать промпты в батч и почему такой отбор окупает вычисления.
  explanation: Стоимость шага задаётся генерацией, а не обновлением весов, поэтому группа без разброса наград — прямая потеря бюджета. Отбор по промежуточной доле успеха повышает долю групп, реально дающих сигнал; при этом граница «умеренной трудности» плавает вместе с политикой, и отложенные промпты нужно периодически перепроверять.
  kind: open
  reference: 'Полезны промпты, на которых доля успешных ответов лежит строго между нулём и единицей: только тогда награды внутри группы различаются, стандартное отклонение отлично от нуля и преимущества ненулевые. Если все 16 ответов верны или все 16 неверны, преимущества обнуляются, градиент по такому промпту равен нулю — 16 генераций потрачены впустую. Поэтому долю успеха оценивают заранее (по прошлым эпохам или пробным сэмплам) и держат промпты умеренной трудности, а решённые и непосильные откладывают, возвращая их по мере изменения политики.'
