- concept: проверяемую награду выдаёт внешний инструмент, подобранный под тип результата (тесты — код, символьный проверщик — математика, пруф-ассистент — доказательство)
  question: Модель обучают выводить формальные доказательства теорем. Какой источник награды даёт здесь однозначный сигнал «прошло / не прошло» без модели-судьи?
  explanation: 'Проверяемая награда требует инструмента, соответствующего типу результата: символьный проверщик для математического ответа, набор тестов для кода, регулярка для формата, пруф-ассистент для доказательства. Предпочтения и косинусные близости дают приблизительный, а не бинарный вердикт, и возвращают в цикл интерпретацию.'
  kind: choice
  options:
    - Пруф-ассистент (Lean, Coq), проверяющий корректность вывода
    - Модель награды, обученная на попарных предпочтениях разметчиков
    - Принцип конституции «выбери наиболее строгое доказательство»
    - Косинусная близость эмбеддинга доказательства к эталонному тексту
