- concept: 'итерация rejection sampling fine-tuning: сэмплирование кандидатов, оценка, отбор, дообучение, повторное сэмплирование уже обновлённой моделью'
  question: Расставь операции одной итерации self-improvement поверх SFT-модели в правильном порядке.
  explanation: 'Ключ порядка — оценка идёт по уже сгенерированным кандидатам, а обучение по уже отобранным. Замыкание цикла (последний пункт) и делает схему итеративной: следующее поколение кандидатов берётся из улучшенной политики, а не из исходной.'
  kind: order
  items:
    - Сэмплировать несколько кандидатов на каждый промпт текущей моделью
    - Оценить каждого кандидата наградой по правилу или конституционным критиком
    - Отфильтровать или отранжировать кандидатов по оценкам
    - Дообучить модель на отобранных данных (SFT-примеры или пары предпочтений)
    - Запустить сэмплирование заново уже обновлённой версией модели
