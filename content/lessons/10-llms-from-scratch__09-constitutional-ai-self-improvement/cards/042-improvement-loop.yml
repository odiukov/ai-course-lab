- concept: доля промптов, дающих хотя бы один пригодный кандидат, определяется вероятностью успеха и числом сэмплов на промпт
  question: В rejection sampling fine-tuning модель решает задачу верно с вероятностью 0.2 на каждый независимый сэмпл. На каждый промпт генерируют 6 кандидатов, промпт попадает в новый обучающий набор, если среди них есть хотя бы один верный. Какая доля промптов попадёт в набор?
  explanation: 'P(хотя бы один верный) = 1 − (1−p)^k = 1 − 0.8^6 = 1 − 0.2621 ≈ 0.738. Отсюда практический вывод: увеличение k быстро добирает промпты, пока p не слишком мало, но при p, близком к нулю, никакое k не спасает — фильтру нечего сохранять.'
  kind: numeric
  answer: 0.738
  tolerance: 0.01
  id: 042-improvement-loop-1
  fingerprint: c1479957
- concept: самосгенерированные обучающие данные сужают распределение, потому что отбор оставляет только высоковероятные для самой модели формы
  question: Модель несколько раундов подряд обучают только на её собственных отобранных выходах. Какой эффект на распределение ожидается прежде всего?
  explanation: 'Кандидаты берутся из самой модели, поэтому их разброс уже разброса исходного корпуса, а отбор ещё раз отсекает хвосты. Итог — mode collapse: шаблонная структура, повторяющиеся формулировки, самоуверенность на субъективных задачах. Новых мод отбор породить не может, он только перевзвешивает существующие.'
  kind: choice
  options:
    - 'Распределение выходов сужается: падает разнообразие, растут повторяющиеся обороты и излишняя уверенность'
    - 'Распределение расширяется: отбор лучших добавляет ранее отсутствовавшие формы ответа'
    - 'Распределение не меняется: дообучение на своих же выходах — тождественная операция'
    - Распределение смещается к равномерному, так как фильтрация убирает пики вероятности
