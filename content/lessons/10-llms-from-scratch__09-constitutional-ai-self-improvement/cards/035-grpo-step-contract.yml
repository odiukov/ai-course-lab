- concept: отношение вероятностей получают экспонентой разности log-probabilities, а не делением самих вероятностей
  question: 'Заполните пропуск: как из log-probabilities текущей и старой политики получают отношение вероятностей?'
  explanation: 'log p1 - log p2 = log(p1/p2), поэтому экспонента разности даёт само отношение. Считать в лог-пространстве и экспоненцировать один раз устойчивее, чем восстанавливать две вероятности и делить: длинные последовательности дают log-probability порядка сотен, и exp каждой по отдельности уходит в машинный ноль.'
  kind: cloze
  template: ratios = np.___(policy_logprobs - old_logprobs)
