- concept: минус перед средним переводит максимизацию клиппированной суррогатной цели в минимизацию функции потерь, поэтому отрицательный policy_loss нормален
  question: В коде GRPO policy_loss = -np.minimum(unclipped, clipped).mean(). Зачем нужен знак минус?
  explanation: 'Клиппированный суррогат — это цель, которую надо увеличивать: у ответа с положительным преимуществом мы хотим поднять вероятность. Оптимизаторы (SGD, Adam) идут вниз по функции, поэтому цель берут с минусом. Отсюда следствие: policy_loss отрицателен ровно тогда, когда средний член min(unclipped, clipped) положителен, и это нормальное, а не ошибочное состояние. Абсолютное значение loss тут не измеряет качество модели.'
  kind: choice
  options:
    - 'Чтобы компенсировать отрицательность log-probabilities: без минуса loss был бы всегда отрицательным'
    - Чтобы гарантировать положительность loss — оптимизатор не работает с отрицательными значениями
    - 'Потому что оптимизатор минимизирует, а суррогатную цель нужно максимизировать: минимизация её отрицания эквивалентна максимизации'
    - 'Чтобы перевернуть знаки преимуществ: хорошие ответы должны иметь отрицательное преимущество'
  correct: 2
  id: 035-grpo-step-contract-3
