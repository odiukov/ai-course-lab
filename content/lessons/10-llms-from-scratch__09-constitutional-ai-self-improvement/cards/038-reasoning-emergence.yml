- concept: поведение закрепляется только при устойчивой корреляции с успехом на многих разных задачах; единичное совпадение с верным ответом неотличимо от случайности
  question: В группе из 24 попыток одна попытка содержит фразу «перепроверю ещё раз», после которой модель ничего не меняет, но угадывает верный ответ и получает положительную награду. Почему это единичное событие не означает, что модель выучит полезную самопроверку?
  explanation: 'Обновление поднимает вероятность всей успешной траектории целиком, включая бесполезные куски. Разделяет полезное и случайное только усреднение по множеству независимых групп: настоящий откат к ошибочному месту чаще оказывается в успешных попытках на разных задачах, а пустой ритуал встречается в успешных и провальных попытках одинаково часто, и его вклад сокращается. Поэтому «aha moment» — статистический эффект многих обновлений, а не следствие одной удачной попытки.'
  kind: choice
  options:
    - Потому что фразы-маркеры вообще не попадают под обновление градиента
    - Потому что награда за угаданный ответ автоматически обнуляется проверщиком
    - Потому что одно совпадение поведения с успехом — шум; закрепится лишь то, что систематически повышает долю успехов на многих разных промптах, а ритуал, не связанный с корректностью, усредняется в ноль
    - Потому что при бинарной награде преимущество единственной успешной попытки всегда равно нулю
