- concept: предельный вес вспомогательной награды выводится из максимума вспомогательного сигнала и разрыва главной награды, а не берётся универсальной константой
  question: Награда за правильность даёт 6 за верный ответ и 0 за неверный. Вспомогательная награда за оформление непрерывна и принимает значения от 0 до 4. Суммарная награда равна reward_correct + w * reward_format. При каком значении w итог неверного, но идеально оформленного ответа сравняется с итогом верного ответа без оформления?
  explanation: 'Верный без оформления: 6 + w*0 = 6. Неверный с идеальным оформлением: 0 + w*4 = 4w. Равенство при w = 1.5. Любой вес выше 1.5 переворачивает порядок. Вес — не магическое число: он считается из диапазонов обеих наград. Если вспомогательная награда бинарная (0 или 1) и главная тоже, тогда безопасен вес вроде 0.1; при вспомогательном сигнале с максимумом 4 тот же 0.1 значил бы совсем другое.'
  kind: numeric
  answer: 1.5
  tolerance: 0.01
  id: 026-reward-weights-1
  fingerprint: f0fb0b23
- concept: вспомогательная награда должна влиять на выбор только внутри группы ответов, одинаковых по главной награде
  question: Вспомогательная награда за оформление добавляется к награде за правильность с корректно подобранным малым весом. Какую роль она при этом играет в ранжировании ответов?
  explanation: 'Малый вес делает вспомогательный сигнал тай-брейкером: среди двух одинаково верных ответов побеждает оформленный, но никакое оформление не поднимает неверный ответ выше верного. Вариант 2 неверен — порядок внутри группы с равной главной наградой как раз меняется. Вариант 3 описывает сбой весов, вариант 4 — другую функцию (fallback), которой у вспомогательной награды нет.'
  kind: choice
  options:
    - Она различает ответы, уже одинаковые по главной награде, и не меняет порядок между верным и неверным
    - Она равномерно повышает награду всех ответов, поэтому не влияет на их порядок вообще
    - Она позволяет хорошо оформленному неверному ответу конкурировать с плохо оформленным верным
    - Она заменяет главную награду на промптах, где правильность проверить не удалось
