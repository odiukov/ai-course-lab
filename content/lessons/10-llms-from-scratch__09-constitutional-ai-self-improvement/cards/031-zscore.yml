- concept: ответ с наградой, равной среднему по группе, получает нулевое преимущество при ненулевом разбросе группы
  question: Группа из трёх ответов на один промпт получила награды 0.2, 0.5 и 0.8. Разброс наград в группе ненулевой. Каким будет вклад ответа с наградой 0.5 в градиент политики?
  explanation: 'Числитель z-оценки — это разница награды и среднего группы: 0.5 − 0.5 = 0. Ненулевая награда сама по себе ничего не даёт; сигнал появляется только у отклонения от среднего своей группы. Здесь вверх толкается лишь ответ с 0.8, вниз — с 0.2.'
  kind: choice
  options:
    - 'Нулевым: его награда совпадает со средним группы, поэтому преимущество равно нулю'
    - Положительным, потому что награда 0.5 больше нуля
    - Отрицательным, потому что в группе есть ответ с наградой 0.8
    - Положительным, потому что этот ответ по награде находится ровно посередине группы
