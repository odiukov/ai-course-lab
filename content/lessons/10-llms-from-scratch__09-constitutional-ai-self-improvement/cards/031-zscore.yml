- concept: групповая нормировка инвариантна к общему сдвигу всех наград группы
  question: 'В GRPO преимущество ответа считается как z-оценка его награды внутри группы ответов на один промпт (со смещённым стандартным отклонением по группе). Группа из четырёх ответов получила награды 3, 5, 7, 9. Затем правило награды изменили: ко всем наградам группы прибавили 100. Чему равно преимущество ответа с максимальной наградой после этого изменения?'
  explanation: 'Центрирование убирает любой общий сдвиг: mean = 6 (или 106), отклонения те же −3, −1, 1, 3, std = sqrt((9+1+1+9)/4) ≈ 2.236, z = 3/2.236 ≈ 1.34. Аддитивная константа в награде не меняет градиентный сигнал, значит «щедрое» смещение шкалы наград бесполезно — работает только различие внутри группы.'
  kind: numeric
  answer: 1.34
  tolerance: 0.05
  id: 031-zscore-1
  fingerprint: 49b08402
- concept: z-нормировка монотонна, поэтому меняет масштаб преимуществ, но не ранжирование ответов внутри группы
  question: Группа из пяти ответов на один промпт получила награды 0.2, 0.4, 0.6, 0.6 и 0.9. Что z-нормирование наград гарантированно сохраняет?
  explanation: Вычитание среднего и деление на положительное std — монотонное преобразование, ранги не меняются. Абсолютные значения и исходные расстояния как раз меняются (масштаб становится локальным для группы), а часть значений обязательно уходит в минус, потому что среднее z-оценок равно нулю.
  kind: choice
  options:
    - 'Порядок ответов: ответ с наградой 0.9 останется ответом с наибольшим преимуществом, а с 0.2 — с наименьшим'
    - 'Абсолютные значения наград: преимущество ответа с наградой 0.9 будет равно 0.9'
    - 'Расстояния между наградами в исходных единицах: разрыв 0.2 останется равным 0.2'
    - 'Неотрицательность: после нормировки ни у одного ответа преимущество не станет отрицательным'
  correct: 0
