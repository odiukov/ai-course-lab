- concept: нулевой разброс наград не свидетельствует о совпадении текстов ответов, потому что награда — сжатие ответа до числа
  question: В группе из 12 ответов на один промпт все получили награду 1.0, std наград равен нулю. Что отсюда следует про сами тексты ответов?
  explanation: Награда — функция ответа в число, она теряет информацию. Разные корректные решения одной задачи получают одну и ту же награду 1.0. Нулевой std говорит только про отсутствие обучающего сигнала в этой группе; про разнообразие текстов нужна отдельная метрика (n-граммы, попарные расстояния эмбеддингов).
  kind: choice
  options:
    - Тексты обязательно идентичны, иначе награды различались бы
    - 'Тексты могут быть разными: правило награды сжимает ответ до числа и не различает варианты, одинаково проходящие проверку'
    - Тексты различны, потому что сэмплирование при ненулевой температуре не может дать повторов
  correct: 1
  id: 046-round-check-1
  fingerprint: 76e1a53e
- concept: разрыв между best_reward и mean_reward измеряет надёжность воспроизведения, а не потолок способностей модели
  question: 'Промпт A: mean 0.7, best 0.9. Промпт B: mean 0.2, best 0.9. Что различают эти две группы?'
  explanation: 'best_reward одинаков (0.9) — значит модель способна решить оба. Расходится mean: на B большинство сэмплов провальны. Разрыв best − mean читается как нестабильность, и лечится он дообучением, а не расширением возможностей модели.'
  kind: choice
  options:
    - 'Потолок способностей модели: на A он выше, чем на B'
    - 'Надёжность: доступный результат один и тот же, но на B модель попадает в него редко'
    - 'Качество правила награды: на B оно занижает оценки'
  correct: 1
  id: 046-round-check-2
  fingerprint: dc731b29
- concept: метрики одного раунда фиксируют состояние политики, а вывод об улучшении требует сравнения одинаково устроенных раундов
  question: Один раунд self-improvement на 30 промптах дал overall_mean 0.62. Почему по этому числу нельзя судить, улучшается ли политика, и что нужно добавить?
  explanation: 'Сравнимость раундов держится на неизменности набора промптов, размера группы и функции награды: сменил любой из них — сравниваешь разные величины. Отдельный раунд отвечает на вопрос «как сейчас», а не «стало ли лучше».'
  kind: open
  reference: 'Одно число — срез текущего состояния политики на конкретном наборе промптов, точки отсчёта у него нет: 0.62 может быть ростом с 0.4 или падением с 0.8. Нужна серия: тот же набор промптов, тот же размер группы, то же правило награды, замеренные в нескольких раундах подряд, — тогда тренд overall_mean осмыслен. Плюс рядом стоит держать std и разнообразие: рост mean при падении std до нуля означает, что политика схлопнулась и сигнала для дальнейшего обучения нет.'
  id: 046-round-check-3
  fingerprint: e34eddeb
