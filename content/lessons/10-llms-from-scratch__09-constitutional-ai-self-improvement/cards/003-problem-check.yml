- concept: 'цикл RL по проверяемым наградам: генерация кандидатов, детерминированная оценка каждого, policy-gradient по наградам'
  question: Расставьте шаги одной итерации RL по проверяемым наградам в правильном порядке.
  explanation: 'Цикл не требует ни разметчика, ни модели-критика: единственный источник сигнала — правило проверки. Порядок важен — награды нужны до обновления, а разброс кандидатов нужен, чтобы градиент различал удачные и неудачные траектории.'
