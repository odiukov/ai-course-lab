- concept: выбор между Constitutional AI и RL по правилам определяется тем, проверяем ли результат задачи автоматически
  question: 'У вас две задачи: писать письмо-отказ кандидату в вежливом тоне и решать уравнения с известным ответом. Какой рецепт выравнивания подходит каждой и по какому признаку вы выбираете?'
  explanation: 'Два цикла делят пространство задач по проверяемости результата, а не по сложности. Ошибка — тянуть правило награды туда, где «правильный ответ» не определён: тогда правило оптимизирует прокси и модель научится его обходить.'
  kind: open
  reference: 'Признак выбора — проверяем ли результат детерминированным правилом. Уравнение проверяемо: сравниваем с эталоном и обучаем RL по правилу награды, критика не нужна. Вежливость отказа проверить правилом нельзя, это субъективное поведение — здесь работает Constitutional AI: модель критикует и переписывает свой ответ по написанным принципам, из чего получается обучающая пара. Человеческий труд в обоих случаях уходит не в разметку, а в проектирование: в первом — правило награды, во втором — конституция.'
