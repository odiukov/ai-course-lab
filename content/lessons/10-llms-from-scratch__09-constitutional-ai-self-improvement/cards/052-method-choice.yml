- concept: DPO на синтетических парах отличается от PPO/GRPO тем, что учится на заранее собранном фиксированном наборе пар, а не на сэмплах из обновляющейся политики
  question: Конституционный критик уже надёжно размечает пары «предпочтительный ответ — отвергнутый». Инженер выбирает между DPO на этих парах и GRPO. Какое свойство DPO определяет выбор?
  explanation: 'Пары от критика — это офлайн-датасет; DPO прямо оптимизирует политику по нему. PPO и GRPO требуют сэмплировать ответы текущей политикой на каждом шаге, что тянет инфраструктуру генерации в цикле обучения. Референсная модель у DPO есть (KL-якорь зашит в саму цель), а новое поведение из пар не берётся: оно должно присутствовать среди предпочтённых ответов.'
  kind: choice
  options:
    - DPO обучается на фиксированном наборе пар и не требует онлайн-генерации ответов обновляющейся политикой на каждом шаге
    - DPO даёт более плотный сигнал на каждый токен, чем награда за готовый ответ
    - DPO не нуждается в референсной модели и потому не ограничивает дрейф политики
    - DPO способен породить поведение, отсутствующее в сэмплах, поскольку не опирается на policy-gradient
