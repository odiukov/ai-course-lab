- concept: отбор при отсутствии верных кандидатов закрепляет наименее плохую ошибку и выдаёт её за улучшение
  question: Пайплайн rejection sampling fine-tuning прогнали на классе задач, где модель не решает ни одной. Кандидатов всё равно ранжируют и лучшие идут в дообучение. Объясни своими словами, чему научится модель за такой раунд и почему метрика отбора будет выглядеть нормально.
  explanation: Отбор оптимизирует ранг внутри группы, а не соответствие истине. Пока хотя бы один кандидат верен, ранг совпадает с правильностью; при нуле верных кандидатов эта связь рвётся, и цикл честно усиливает ошибочный ход.
  kind: open
  reference: 'Ранжирование всегда даёт победителя, даже если все кандидаты неверны: лучший — это наименее плохая ошибка. В обучающие данные попадают неправильные решения, и следующий раунд воспроизводит их чаще и увереннее. Внешне цикл выглядит здоровым: средняя награда отобранных выше средней по выборке, разброс сокращается, ответы становятся однороднее. Но абсолютный уровень остаётся нулевым — относительный отбор не отличает ''лучше соседей'' от ''верно''. Поэтому здоровье такого цикла проверяют абсолютной долей принятых проверщиком ответов, а не приростом внутри раунда.'
  id: 048-feedback-ceiling-2
  fingerprint: 0a642dc1
- concept: увеличение числа кандидатов и числа раундов не поднимает потолок способностей; его сдвигает только приток информации извне модели
  question: 'Команда фиксирует: при 4000 сэмплов на промпт модель не порождает ни одного корректного решения задач класса X. Какое вмешательство способно поднять потолок, а не только эффективность внутри него?'
  explanation: Раунды и объём сэмплирования перераспределяют вероятностную массу между тем, что модель уже порождает. Ужесточение награды сужает фильтр, но не создаёт кандидатов. Только внешний источник — демонстрация, более сильный учитель, инструмент, выполняющий нужный шаг, — вносит в систему информацию, которой в модели нет.
  kind: choice
  options:
    - Увеличить число раундов самодистилляции с трёх до десяти
    - Добавить в обучение демонстрации решения класса X — от человека, от более сильной модели или от внешнего инструмента, дающего нужный ход
    - Поднять число кандидатов на промпт с 4000 до 40000 при тех же настройках сэмплирования
    - Ужесточить правило награды, чтобы оно строже отсеивало неверные варианты
  correct: 1
