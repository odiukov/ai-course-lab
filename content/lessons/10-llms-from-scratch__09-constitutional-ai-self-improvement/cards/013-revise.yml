- concept: диагноз критика без соответствующей ветки правки приводит к молчаливому возврату исходного ответа, а не к ошибке
  question: Критик умеет ставить диагноз «слишком много увиливаний», но в функции правки ветки под этот диагноз нет. Что произойдёт при вызове правки с таким результатом критики?
  explanation: 'Правка — это таблица соответствий «известная претензия → заранее выбранное преобразование». Неизвестная претензия проваливается в финальный return response. Опасность в том, что это тихий no-op: пайплайн отчитается об успешной ревизии, хотя текст не изменился. В настоящей системе вместо таблицы стоит второй вызов LLM с критикой в промпте, и такой дыры в покрытии нет.'
  kind: choice
  options:
    - Вернётся исходный ответ без изменений — сработает завершающая ветка по умолчанию
    - 'Будет выброшено исключение: диагноз не сопоставлен ни с одним преобразованием'
    - Вернётся пустая строка, потому что ни одно преобразование не выполнилось
    - Функция применит правку ближайшего по смыслу диагноза
