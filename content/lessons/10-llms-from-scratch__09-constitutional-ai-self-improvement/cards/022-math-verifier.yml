- concept: 'правило награды устроено fail-closed: невозможность подтвердить правильность даёт ту же нулевую награду, что и неверный ответ'
  question: Проверщик не смог разобрать формулировку задания (или в ответе модели вовсе нет чисел). Почему такому случаю выдают нулевую награду, а не среднюю по датасету и не пропуск примера?
  explanation: 'Ключевое: молчаливое «не знаю» нельзя превращать в положительный сигнал. Бинарная награда даёт награду только за воспроизводимо подтверждённое совпадение с эталоном.'
  kind: open
  reference: 'Награда обязана быть подтверждением правильности, а не догадкой. Разбор упал — значит эталон не вычислен и сравнивать не с чем; выдача ненулевой награды поощряла бы ответы, которые проверщик не умеет разбирать, и модель нашла бы этот обход как самый дешёвый источник награды. Ноль по умолчанию (fail-closed) делает любой сбой невыгодным: неверное вычисление, ответ без числа, неразобранное задание и падение самой проверки лежат в одном классе «правильность не подтверждена». Цена — редкие ложные нули на корректных ответах, но они не создают эксплуатируемой лазейки, в отличие от ложных единиц.'
