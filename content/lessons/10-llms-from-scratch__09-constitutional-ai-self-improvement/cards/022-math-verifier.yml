- concept: вес вспомогательной награды за оформление подбирают заведомо меньшим награды за правильность, чтобы оформление не могло перевесить верный результат
  question: Суммарная награда = 5.0 за верный числовой ответ + 0.4 за требуемую разметку ответа тегами. Модель выдала правильно оформленный, но арифметически неверный ответ. Чему равна её суммарная награда?
  explanation: 'Верный ответ без разметки даёт 5.0, неверный в идеальной разметке — 0.4. Правильность больше чем на порядок весомее оформления, поэтому политике невыгодно красиво оформлять чушь. Так и подбирают веса вспомогательных наград: заметны, но никогда не перевешивают главный критерий.'
