- concept: SL-CAI нужен до RLAIF, потому что RL сэмплирует пары из текущей политики и её качество задаёт качество сравнений
  question: Почему в Constitutional AI supervised-этап ставят перед RL-этапом, а не запускают RLAIF сразу поверх исходной SFT-модели?
  explanation: 'Первый этап даёт стартовую точку на конкретных исправленных примерах, второй усиливает направление на массе сравнений. Порядок не косметический: качество пар в RL ограничено качеством политики, которая их порождает.'
  kind: open
  reference: 'RLAIF сравнивает ответы, которые сэмплирует сама текущая политика. Если политика ещё склонна к вредным ответам, обе выборки в паре часто плохи, сравнение малоинформативно, а RL приходится тащить модель издалека — дольше и с большим отклонением от исходной политики. Supervised-этап на переписанных ответах заранее сдвигает политику в безопасную область: сэмплы уже приемлемы, и RL занят тонкой настройкой предпочтений, а не грубым исправлением. Плюс это уменьшает распределенческий разрыв между тем, что модель генерирует, и тем, что конституция считает хорошим.'
  id: 005-cai-map-3
  fingerprint: f34c262b
