- concept: 'порядок операций внутри SL-CAI: ответ, критика по принципу, ревизия, дообучение на ревизии'
  question: Этап supervised-обучения на AI-фидбеке (SL-CAI) в Constitutional AI. Расставь операции в порядке выполнения.
  explanation: 'Критика идёт после ответа и до ревизии: без исходного ответа критиковать нечего, а переписывание опирается на текст критики. В SFT попадает только финальная переписанная версия — исходный вредный ответ обучающей целью не становится.'
  kind: order
  items:
    - Подать модели потенциально вредный запрос
    - Получить исходный ответ модели
    - Попросить ту же модель раскритиковать свой ответ по выбранному принципу конституции
    - Попросить модель переписать ответ с учётом критики
    - Дообучить модель supervised-методом на парах (запрос, переписанный ответ)
  id: 005-cai-map-1
  fingerprint: 3cce8511
- concept: результат RLAIF — попарные предпочтения, из которых учится награда (PPO) или напрямую политика (DPO)
  question: На этапе RLAIF модель сэмплирует два ответа на один и тот же запрос и по конституции решает, какой лучше. Как эти решения используются дальше?
  explanation: 'Второй этап меняет тип сигнала: не «воспроизведи этот текст», а «этот вариант предпочтительнее того». Такой сигнал потребляют reward model + PPO или DPO без явной награды. Вариант с SFT на победителе — это по сути откат к первому этапу, сравнение там теряется.'
  kind: choice
  options:
    - Копятся как датасет попарных предпочтений; на нём учится модель награды для PPO либо предпочтения идут напрямую в DPO
    - Победивший ответ становится единственной обучающей целью обычного supervised fine-tuning
    - Проигравший ответ переписывается моделью, и переписанная версия добавляется в SFT-датасет
    - Логиты обоих ответов усредняются, и модель дообучается на усреднённом распределении
  correct: 0
