- concept: частичная награда за правдоподобные промежуточные ходы требует ненадёжной оценки правдоподобия и смещает цель обучения с проверяемого результата
  question: Инженер предлагает вместо бинарной проверки итога давать дробную награду за «правдоподобные» промежуточные ходы, чтобы обучение шло быстрее. Объясни своими словами, чем такая схема хуже бинарной проверки результата в задачах на математику, код и формальные доказательства.
  explanation: 'Ключ — источник надёжности. Проверяемая награда стоит на инструменте, который отвечает на вопрос без интерпретации. Как только в награду вводят оценку промежуточного шага, появляется место для ошибки судьи и для подмены цели. Отсутствие локализации ошибки — приемлемая цена: её компенсирует объём попыток, а не хитрость функции награды.'
  kind: open
  reference: 'Бинарная проверка итога детерминирована: символьный проверщик, набор тестов или пруф-ассистент дают однозначный вердикт, который нельзя обмануть красивым видом решения. Дробная награда за правдоподобие требует судьи о качестве хода — а надёжного автоматического судьи для этого нет, значит его роль берёт на себя эвристика или обученная модель со своими ошибками. Как следствие цель обучения смещается: модель начинает оптимизировать похожесть рассуждения на правильное, а не факт достижения проверяемого результата, и получает награду за убедительный, но неверный ход. Бинарная награда беднее подробностями (она не показывает, где именно ошибка), зато точна в единственном вопросе, который и является целью: достигнут результат или нет.'
  id: 029-sparse-reward-2
