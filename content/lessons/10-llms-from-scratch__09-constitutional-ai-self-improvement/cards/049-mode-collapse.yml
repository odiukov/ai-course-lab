- concept: обучение на собственных отобранных выходах снижает энтропию выходного распределения, что проявляется как излишняя самоуверенность и узнаваемо шаблонный стиль
  question: Объясни своими словами, почему модель после нескольких раундов дообучения на собственных отобранных ответах становится излишне самоуверенной и приобретает узнаваемый шаблонный «AI voice».
  explanation: Ключ — направление изменения энтропии. Каждый раунд «обучение на победителях» — это обучение на распределении, суженном собственным фильтром. Уверенность растёт не потому, что модель стала точнее, а потому, что альтернативы вымыты из обучающих данных. Поэтому калибровку и разнообразие меряют отдельно от средней награды.
  kind: open
  reference: 'Отбор оставляет ответы, которые сам генератор уже считал вероятными и которые понравились его же критику. Дообучение на такой выборке поднимает вероятность этих форм и опускает вероятность остальных, то есть снижает энтропию выходного распределения. Модель начинает ставить высокую уверенность там, где раньше распределяла массу между несколькими вариантами, — включая случаи, где уверенность не оправдана, потому что источник сигнала (собственный критик) ошибается коррелированно с самой моделью. Внешне это выглядит как повторяющиеся обороты, одинаковая структура абзацев и один и тот же тон: доминирующие моды выжили, редкие вымерли.'
