- concept: редкий режим исчезает из обучения, когда он не попадает в пул кандидатов, а вероятность его отсутствия задаётся вероятностью генерации и размером пула
  question: На каждый промпт модель сэмплирует 50 кандидатов. Некоторый редкий стиль ответа порождается с вероятностью 0.01 на сэмпл, независимо. Какова вероятность, что в пуле не окажется ни одного такого кандидата и отбор физически не сможет его выбрать?
  explanation: '(1 − 0.01)^50 ≈ 0.605. Отбор работает только над тем, что реально сгенерировано: режим, не попавший в пул, получает нулевой вес в новых обучающих данных, его вероятность после дообучения падает ещё ниже, и в следующем раунде шанс его отсутствия становится выше. Так разовое невезение отбора превращается в устойчивую потерю режима.'
  kind: numeric
  answer: 0.605
  tolerance: 0.02
