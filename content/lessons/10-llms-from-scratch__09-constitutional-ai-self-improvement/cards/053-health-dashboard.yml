- concept: здоровье прогона определяется совместной динамикой награды, разнообразия и KL, а не наибольшим значением награды
  question: 'Два прогона GRPO завершили по 8 раундов. Прогон A: средняя награда выросла с 0,61 до 0,79, повторяемость ответов не изменилась, KL до референса растёт плавно. Прогон B: средняя награда 0,93, ответы почти дословно совпадают между разными промптами, KL за последние раунды вырос в несколько раз. Какой вывод корректен?'
  explanation: Награда — только один из трёх показателей приборной панели. У B она выросла за счёт схлопывания в один шаблон и большого ухода от референса, то есть за счёт того, что панель как раз и должна ловить. Высокое число награды при упавшем разнообразии и подскочившем KL — типичная картина mode collapse или эксплуатации слабости проверки, а не победы.
  kind: choice
  options:
    - 'B лучше: его награда выше, а KL — вспомогательная метрика'
    - 'A здоров, а B требует остановки и проверки: его рост награды сопровождается потерей разнообразия и резким сдвигом от референса'
    - 'Оба здоровы: рост награды в обоих прогонах подтверждает, что обучение идёт правильно'
    - 'A следует остановить: его награда растёт слишком медленно, значит обучение неэффективно'
  correct: 1
  id: 053-health-dashboard-1
  fingerprint: 179bb348
- concept: плато награды при сохранённом разнообразии диагностирует неэффективный поиск, а не схлопывание политики
  question: В прогоне награда третий раунд подряд держится около 0,44, ответы внутри групп остаются заметно разными, KL растёт медленно. Что это описывает?
  explanation: Каждая комбинация трёх показателей даёт свой диагноз. Разнообразие сохранено, значит схлопывания нет; KL мал, значит политика не уползла. Застывшая награда при живом разнообразии означает, что модель исследует пространство ответов, но лучшие варианты в него не попадают — вопрос к сложности промптов или к потолку самой политики, а не к схлопыванию.
  kind: choice
  options:
    - Модель схлопнулась в один шаблон — нужно ослабить KL-штраф
    - 'Модель перебирает разные варианты, но не находит более удачных: разнообразие есть, а сигнала на улучшение нет'
    - 'Проверка награды сломана: при живом разнообразии награда обязана расти'
    - Политика ушла слишком далеко от референса, старые оценки качества устарели
  correct: 1
  id: 053-health-dashboard-2
  fingerprint: 4e90f9e8
- concept: KL до референса измеряет масштаб сдвига политики, а не её качество
  question: Объясни своими словами, почему KL-дивергенция до референсной модели не является метрикой качества политики и что именно должен предпринять инженер, увидев её резкий рост.
  explanation: KL — индикатор величины изменения, а не оценка. Здоровый прогон — награда вверх, разнообразие держится, KL растёт медленно; резкий рост KL сам по себе только сигнал к проверке двух других показателей.
  kind: open
  reference: 'KL показывает, насколько текущая политика отдалилась от референсной по распределению, и ничего не говорит о том, стали ответы лучше или хуже: уйти далеко можно и в хорошую, и в плохую сторону. Практический смысл роста KL — предупреждение о масштабе сдвига. Чем дальше политика от референса, тем меньше о ней говорят оценки, откалиброванные на референсном поведении, и тем выше риск, что рост награды идёт за счёт эксплуатации слабости проверки. Увидев скачок, инженер не объявляет прогон плохим по одному KL, а смотрит его вместе с наградой и разнообразием: остановить прогон, померить разнообразие ответов и проверить кандидатов внешней оценкой, при необходимости усилить KL-штраф или уменьшить шаг.'
  id: 053-health-dashboard-3
  fingerprint: c0979ecc
