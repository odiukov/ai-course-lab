  question: В итеративном пайплайне на каждом раунде отклонение обучаемой политики от референсной ограничено бюджетом 0.4 наты. Референс переустанавливают на текущую политику в начале каждого раунда. Чему равна верхняя оценка суммарного отклонения от исходной SFT-модели после 7 раундов?
