  question: После нескольких раундов самообучения модель отвечает шаблонно. Команда ужесточает KL-штраф относительно референсной модели. Чего ожидать?
  explanation: 'KL-член — консервативный ограничитель: он делает дорогим быстрый уход от референсной политики. Новых стилей и формулировок он не приносит, а если сужение уже впечатано в данные и в референс, удерживать нечего. Поэтому два механизма дополняют друг друга: человеческие данные расширяют опору, KL регулирует скорость её потери.'
  kind: choice
  options:
