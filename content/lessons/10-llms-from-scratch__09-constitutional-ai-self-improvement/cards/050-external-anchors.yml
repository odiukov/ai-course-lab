    - 'Уже потерянное разнообразие не вернётся, но дальнейшее сужение замедлится: KL ограничивает удаление от референса, а не порождает новые режимы'
    - KL-штраф увеличит энтропию выходов, так как штрафует за уверенные распределения
    - 'Эффекта не будет: KL влияет только на скорость сходимости награды'
