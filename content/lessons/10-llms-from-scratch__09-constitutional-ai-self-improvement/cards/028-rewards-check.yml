- concept: 'итоговая награда — взвешенная сумма независимых проверок, а не конъюнкция требований: провал вспомогательной проверки не обнуляет главную'
  question: 'Проверяемая задача оценивается по правилу: 2 балла за верный итоговый результат плюс 0,4 балла за наличие обязательных тегов вокруг ответа. Модель выдала верный результат, но теги не поставила. Какую награду получит ответ?'
  explanation: 'Проверщики независимы и их результаты складываются: reward_math = 1 (масштаб 2 балла), reward_format = 0. Логического И между ними нет, поэтому пропущенное оформление стоит ровно вес вспомогательной награды — 0,4, и ни на что больше не влияет. Аналогично идеальные теги при неверном числе дают только вспомогательные 0,4.'
  kind: choice
  options:
    - 0 — ответ не прошёл обе проверки, значит награды нет
    - 2 — главная награда начисляется полностью, вспомогательная не начислена
    - 0,4 — начисляется только меньшая из двух наград
    - 2,4 — при верном результате оформление засчитывается автоматически
  correct: 1
  id: 028-rewards-check-1
  fingerprint: 41bc1b53
- concept: невыполнение вспомогательного критерия — это неполученная надбавка, а не вычет из главной награды
  question: В схеме «награда за правильность + маленькая награда за оформление» отсутствие требуемого оформления описывают как штраф. Объясни своими словами, чем этот штраф отличается от вычитания баллов, и почему разница важна для обучения.
  explanation: 'Ключевое: правильность и оформление меряются раздельно, суммируются с разными весами и обе шкалы неотрицательны. Поэтому оформление способно только упорядочить ответы, но не отменить верный результат.'
  kind: open
  reference: 'Штрафа как вычитания нет: обе награды неотрицательны, и ответ без оформления просто не получает вспомогательную надбавку. Верный результат сохраняет всю главную награду, а неверный остаётся на нуле по главному сигналу независимо от тегов. Если бы за отсутствие формата вычитали, вспомогательный критерий мог бы утащить верный ответ ниже неверного, то есть перевернуть приоритет между содержанием и оформлением — ровно то, чего схема с малым положительным весом (правильность в разы дороже формата) избегает.'
  id: 028-rewards-check-2
  fingerprint: '19257485'
