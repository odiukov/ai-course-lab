- concept: метка предпочтения — снимок мнения конкретного разметчика при конкретной инструкции, поэтому она устаревает при расширении возможностей модели
  question: Почему уже собранный датасет человеческих предпочтений нельзя считать постоянной эталонной разметкой и приходится собирать новый, когда модель осваивает новые языки, домены или способы рассуждения?
  explanation: 'Ключ в двух свойствах: субъективность и привязка к моменту (люди + инструкции меняются) и отсутствие покрытия новых распределений ответов. Из-за этого расходы на предпочтения растут вместе с ростом возможностей модели — это и подтолкнуло к Constitutional AI и RL по проверяемым правилам.'
  kind: open
  reference: 'Метка предпочтения фиксирует суждение конкретного человека в конкретный момент и по действующей на тот момент инструкции. Разметчики по-разному понимают «полезный» и «безопасный», могут не владеть редким контекстом, а сами гайдлайны со временем пересматриваются — поэтому в данных сидит смещение под момент сбора. Кроме того, старые сравнения покрывают только те распределения ответов, которые модель выдавала раньше: на новых языках, темах или новых стилях рассуждения у них нет покрытия, и сигнал приходится добирать свежими сравнениями. Отсюда и мотивация заменить разметку сигналом самой модели (конституция) или детерминированным правилом (проверяемые задачи).'
  id: 001-cena-rlhf-3
