- concept: производительность человеческой разметки не масштабируется вычислительными ресурсами, поэтому она задаёт потолок скорости RLHF/DPO
  question: Команда обучает модель по методу предпочтений и хочет ускорить цикл. Она увеличивает кластер GPU в восемь раз. Что при этом почти не изменится?
  explanation: 'Генерация, обучение и инференс параллелятся по GPU; чтение и оценка пар человеком — нет. Поэтому пропускная способность человеческого суждения остаётся фиксированной и становится узким местом всего пайплайна: модель порождает кандидатов быстрее, чем очередь на разметку рассасывается.'
  kind: choice
  options:
