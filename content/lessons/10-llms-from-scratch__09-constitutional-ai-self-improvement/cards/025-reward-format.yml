- concept: проверка формата ищет фрагмент в любом месте строки, поэтому обрамляющий текст не должен обнулять награду
  question: 'Правило награды должно давать полный балл, когда теги стоят где угодно внутри ответа — в том числе если модель написала «Итог: <answer>7</answer>.» Заполни пропуск так, чтобы обрамляющий текст не мешал.'
  explanation: re.search сканирует всю строку и находит совпадение в любой позиции. re.match привязан к началу строки, re.fullmatch требует совпадения целиком — оба вернут None при любом слове перед тегом, и корректно оформленный ответ получил бы нулевую награду формата.
  kind: cloze
  template: matched = re.___(r"<answer>.*</answer>", response)
  answer: search
  accept:
    - search
    - re.search
  id: 025-reward-format-1
  fingerprint: 1db3f364
- concept: точка в регулярном выражении не совпадает с переводом строки, поэтому многострочное содержимое тегов требует флага DOTALL
  question: Правило формата использует re.search(r"<answer>.*</answer>", response). Модель вернула ответ, где внутри тегов идут три строки вычислений с переносами. Что вернёт правило?
  explanation: По умолчанию точка совпадает с любым символом кроме перевода строки. Открывающий и закрывающий теги разделены \n, значит совпадения нет и правильно оформленный многострочный ответ штрафуется зря. Лечится флагом re.DOTALL (или шаблоном [\s\S]*).
  kind: choice
  options:
    - 'Полный балл: .* совпадает с любым текстом, включая переносы строк'
    - 'Нулевой балл: .* не совпадает с \n, и без флага re.DOTALL совпадение не найдётся'
    - Полный балл, потому что re.search игнорирует пробельные символы
    - Ошибку re.error из-за многострочного входа
  correct: 1
  id: 025-reward-format-2
  fingerprint: 6c5fe480
- concept: правило формата отвечает только за оболочку ответа, поэтому пустая пара тегов проходит проверку и это не дефект правила
  question: Правило награды за оформление даёт полный балл строке «<answer></answer>», где между тегами пусто. Объясни, почему это не считается ошибкой правила и что случится, если добавить в него проверку содержимого.
  explanation: Пустой контейнер — не дыра в проверке, а корректный результат правила с одной обязанностью. Итоговая награда складывается из отдельных слагаемых, и каждое должно оставаться диагностируемым по отдельности.
  kind: open
  reference: 'Каждое правило награды отвечает за одну проверяемую вещь. Правило формата отвечает за оболочку: есть открывающий тег, есть закрывающий, порядок правильный. Правильность и наличие содержимого — предмет отдельного правила (арифметического проверщика), которое пустой ответ и так обнулит. Если сшить обе проверки в одну функцию, сигнал перестанет разделяться: по нулю нельзя понять, модель сломала оформление или ошиблась в вычислении, и веса двух наград больше нельзя настроить независимо.'
  id: 025-reward-format-3
  fingerprint: e47c307d
