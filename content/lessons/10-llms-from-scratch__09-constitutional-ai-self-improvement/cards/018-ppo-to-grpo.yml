- concept: GRPO отличается от PPO удалением обучаемой сети ценности, а не механизма обновления политики
  question: Команда переводит дообучение модели с PPO на GRPO. Какой компонент обучения после перехода исчезает?
  explanation: GRPO — вариант PPO без функции ценности. Отношение вероятностей, клиппирование и KL-штраф остаются на месте; уходит только вторая сеть-критик со своими весами, памятью и собственным циклом обучения.
  kind: choice
  options:
    - Отношение вероятностей новой и старой политики в целевой функции
    - Отдельная обучаемая сеть ценности, предсказывающая ожидаемую награду
    - Клиппирование отношения вероятностей
    - Штраф за расхождение с референсной моделью
  correct: 1
  id: 018-ppo-to-grpo-1
  fingerprint: c85c818f
- concept: клиппирование ограничивает величину одного шага, KL-штраф — суммарное удаление политики от референсной модели
  question: Из целевой функции GRPO убрали KL-штраф, клиппирование с eps=0.15 оставили. Что станет возможным после 800 шагов обучения?
  explanation: 'Клиппирование — ограничитель на один шаг: оно режет отношение вероятностей вне [1-eps, 1+eps]. Но серия из сотен разрешённых мелких шагов складывается в большое смещение. KL-штраф к референсной модели штрафует именно накопленное расхождение, поэтому эти два механизма не заменяют друг друга.'
  kind: choice
  options:
    - Один шаг обновления сможет произвольно сильно изменить политику
    - Преимущества перестанут быть нормированными и разъедутся по масштабу
    - Каждый шаг останется маленьким, но накопленный дрейф уведёт политику далеко от референсной модели
    - Обучение остановится, потому что отношение вероятностей станет равно единице
  correct: 2
  id: 018-ppo-to-grpo-2
  fingerprint: 251e1481
- concept: без сети ценности источник преимущества — сравнение наград нескольких ответов на один и тот же промпт
  question: В PPO преимущество получают из предсказания обученной сети ценности. GRPO этой сети не имеет. Объясни своими словами, откуда тогда берётся знак и величина преимущества для конкретного ответа.
  explanation: 'Функция ценности нужна была как база: «чего ожидать от этого состояния». Группа ответов на один промпт даёт ту же базу эмпирически — среднее по группе и есть оценка ожидаемой награды для данного промпта, только полученная сэмплированием, а не отдельной обученной сетью.'
  kind: open
  reference: 'На один промпт генерируется сразу несколько ответов, и каждый получает награду. Базой сравнения служат награды остальных ответов той же группы: преимущество ответа — это его награда относительно наград «братьев» (отклонение от среднего по группе, отнормированное разбросом). Ответ лучше типичного для этого промпта — преимущество положительное, хуже — отрицательное. Роль предсказателя ожидаемого результата берёт на себя сама группа сэмплов, поэтому обучаемый критик не нужен.'
  id: 018-ppo-to-grpo-3
  fingerprint: 3c1b3e8e
