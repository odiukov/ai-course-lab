- concept: малый разброс наград допускает два несовместимых объяснения, и различает их только измерение самих ответов, а не наград
  question: После нескольких раундов rejection sampling fine-tuning разброс наград внутри групп упал почти до нуля. Объясни своими словами, почему по одному этому нельзя судить о вырождении, и что нужно измерить дополнительно.
  explanation: 'Каждый показатель по отдельности имеет доброкачественное объяснение: высокая награда — модель проходит проверку, малый разброс — стабильность. Вырождение видно только когда все три признака читаются вместе, и третий из них измеряется на текстах, а не на числах.'
  kind: open
  reference: 'Малый разброс совместим с двумя противоположными состояниями: группа стала стабильно решать задачу правильно (все ответы хороши) либо схлопнулась в один шаблон (все ответы одинаковы по форме). Награда — сжатие ответа до числа, поэтому по наградам эти случаи неразличимы. Различает их измерение самих текстов: доля уникальных n-грамм, кластеризация ответов, доля ответов с общей структурой, либо внешняя оценка на задачах вне обучающего распределения. Диагноз ставится по совместному чтению уровня награды, разброса и повторяемости, а не по одному показателю.'
  id: 051-collapse-check-2
  fingerprint: 072017fa
- concept: повторяемость выражается числом как доля уникальных фрагментов от общего числа фрагментов и отслеживается по раундам независимо от награды
  question: 'Для мониторинга разнообразия берут distinct-2: долю уникальных биграмм от общего числа биграмм в выборке ответов. В выборке 6 ответов суммарно 300 биграмм, из них уникальных 45. Чему равен distinct-2?'
  explanation: '45/300 = 0.15. Метрика такого рода даёт числовой ряд по раундам: если средняя награда растёт, а distinct-2 падает от раунда к раунду, рост баллов оплачен сужением распределения. Награда этого падения не показывает, потому что отбор оптимизирует именно награду.'
  kind: numeric
  answer: 0.15
  tolerance: 0.005
