- concept: клиппирование не запрещает выход отношения за границы, оно лишь обнуляет выигрыш от дальнейшего движения в выгодную сторону
  question: eps = 0.1, преимущество ответа A = -3, отношение rho = 0.5. Что происходит с этим ответом при оптимизации?
  explanation: 'min(rho*A, clip(rho,0.9,1.1)*A) = min(0.5*(-3), 0.9*(-3)) = min(-1.5, -2.7) = -2.7. При отрицательном преимуществе связывает нижняя граница. Клиппирование — не жёсткое ограничение на веса: отношение физически может уйти сколь угодно далеко, просто целевая функция перестаёт вознаграждать это движение и градиент обнуляется.'
  kind: choice
  options:
