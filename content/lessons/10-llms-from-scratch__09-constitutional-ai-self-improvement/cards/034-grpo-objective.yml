- concept: при положительном преимуществе и отношении выше 1+eps целевая функция берёт клиппированное значение, поэтому дальнейший рост вероятности не увеличивает цель
  question: В GRPO eps = 0.15. Для ответа преимущество A = +2, а отношение вероятностей rho = 1.4. Чему равен вклад этого ответа в целевую функцию (без KL-члена)?
  explanation: 'Берётся min(rho*A, clip(rho,0.85,1.15)*A) = min(1.4*2, 1.15*2) = min(2.8, 2.3) = 2.3. Отношение вышло за верхнюю границу, поэтому цель зафиксирована на 1.15*A: рост вероятности сверх 1+eps не приносит выгоды, и градиент по этому ответу зануляется.'
  kind: numeric
  answer: 2.3
  tolerance: 0.01
  id: 034-grpo-objective-1
  fingerprint: 01842fb8
- concept: знаменатель отношения — политика перед текущим обновлением, а не референсная модель из KL-члена
  question: В целевой функции GRPO отношение вероятностей rho_i = pi_theta(y_i|x) / pi_?(y_i|x). Какая модель стоит в знаменателе и почему не та, что в KL-штрафе?
  explanation: В знаменателе pi_old — веса, которыми сэмплировали текущую партию ответов. Это делает выражение корректной off-policy поправкой и позволяет сделать несколько шагов градиента по одной партии. pi_ref в KL-члене замораживается один раз на всё обучение и служит другой цели — удерживать общее поведение модели.
  kind: choice
  options:
    - 'Политика до текущего обновления: отношение измеряет сдвиг за один шаг оптимизации на уже сэмплированных ответах, а KL сравнивает с зафиксированной стартовой моделью'
    - 'Референсная модель: и клиппирование, и KL-штраф считают отклонение от одной и той же замороженной модели'
    - 'Модель награды: отношение сопоставляет вероятность ответа с его оценкой'
    - 'Базовая модель до SFT: отношение измеряет весь пройденный путь дообучения'
