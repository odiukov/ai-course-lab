- concept: clip_eps задаёт полуширину коридора вокруг единицы, поэтому его увеличение ослабляет ограничение размера шага
  question: В клиппированном суррогате GRPO гиперпараметр clip_eps равен 0,35. До какого максимального значения может дойти учитываемое отношение вероятностей при положительном преимуществе?
  explanation: 'Коридор симметричен вокруг единицы: [1 - clip_eps, 1 + clip_eps] = [0,65; 1,35]. Чем больше clip_eps, тем шире коридор и тем больший шаг разрешён; чем меньше — тем консервативнее обновление.'
  kind: numeric
  answer: 1.35
  tolerance: 0.01
  id: 037-clipping-check-1
  fingerprint: 163b8a53
- concept: beta регулирует силу KL-члена и задаёт компромисс между скоростью роста награды и сохранением поведения референсной модели
  question: Объясни своими словами, что произойдёт с обучением GRPO, если beta выставить очень большим, и что — если выставить нулевым.
  explanation: 'beta — единственная ручка силы KL в total_loss = policy_loss + beta * kl. Обе крайности плохи: большой beta замораживает политику, нулевой снимает якорь к референсной модели.'
  kind: open
  reference: 'beta — вес KL-члена в total_loss. При очень большом beta штраф за отклонение от референсной политики доминирует над policy_loss: политика почти не двигается, награда растёт медленно или стоит. При beta = 0 KL-член исчезает из цели, остаётся только клиппирование; оно ограничивает каждый отдельный шаг, но не мешает накопить большое суммарное отклонение — политика уходит от референсной, что даёт деградацию языка и reward hacking. Рабочее значение маленькое (порядка 0,01) и подбирается по фактическому KL на прогоне.'
  id: 037-clipping-check-2
  fingerprint: 9e3ed94e
