- concept: конституция задаёт границы допустимого поведения, а не перечень заранее предусмотренных случаев, поэтому конфликт принципов разрешает человек, а не модель
  question: 'Команда пишет конституцию из 24 принципов. Два из них регулярно сталкиваются: «давай максимально полный ответ» и «не публикуй сведения, помогающие причинить вред». Что здесь должно быть человеческим решением?'
  explanation: Конституция описывает границы, а не перечень ситуаций, поэтому пересечения границ неизбежны. Разрешение конфликта — это ценностный выбор, и он остаётся за людьми, как и подбор самих принципов и выборочная проверка результата. Вариант 2 возвращает то самое узкое место, ради устранения которого конституция и вводилась; варианты 3 и 4 путают объём генерации с наличием критерия.
  kind: choice
  options:
    - Приоритет между принципами и правило разрешения конфликта — модель не может вывести иерархию ценностей из самих формулировок
    - 'Каждый конкретный ответ, где принципы столкнулись: их надо размечать вручную парами'
    - 'Ничего: при достаточном числе сгенерированных пар модель сама сойдётся к правильному компромиссу'
    - Только объём выборки — конфликт исчезнет, если генерировать больше кандидатов
