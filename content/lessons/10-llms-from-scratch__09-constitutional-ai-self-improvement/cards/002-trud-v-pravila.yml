- concept: принципы формулируются обобщённо, чтобы покрывать запросы, которых не было при написании конституции
  question: Объясни своими словами, почему конституцию пишут как обобщённые принципы («объясняй отказ и предлагай безопасную альтернативу»), а не как список конкретных запрещённых запросов.
  explanation: 'Смысл конституции — свойство обобщения, а не полнота перечисления. Оттого и объём: у Anthropic конституция уместилась в 16 предложений, но применима к любому потоку генераций, тогда как перечень случаев масштабировался бы вместе с разнообразием запросов.'
  kind: open
  reference: 'Список конкретных запросов покрывает только то, что авторы успели придумать; любая новая формулировка или новая предметная область оказывается вне списка, и его придётся дописывать вручную — то есть человеческий труд снова растёт вместе с числом ситуаций. Обобщённый принцип применим к запросу, который никто не предвидел: модель может сопоставить с ним любой свой ответ, найти нарушение и сформулировать критику. Именно эта переносимость делает фиксированный текст из десятка-другого предложений источником неограниченного потока автоматических меток. Плата за обобщённость — неоднозначность в пограничных случаях и столкновения принципов, которые разбирают люди.'
  id: 002-trud-v-pravila-3
  fingerprint: 45084f16
