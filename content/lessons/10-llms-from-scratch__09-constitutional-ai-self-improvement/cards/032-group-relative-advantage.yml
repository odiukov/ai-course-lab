- concept: разброс проверяют сравнением с малым порогом, а не точным равенством нулю, потому что float-арифметика на почти одинаковых наградах даёт крошечный ненулевой std
  question: В реализации группового преимущества вырожденный случай ловят условием вида `r.std() < 1e-6`, а не `r.std() == 0`. Объясни своими словами, что случится с преимуществами при точной проверке на равенство нулю.
  explanation: 'Опасен не сам ноль в знаменателе (NumPy вернул бы nan или inf, что заметно), а околонулевой разброс: он даёт правдоподобные по величине, но полностью случайные преимущества. Порог отсекает оба варианта разом.'
  kind: open
  reference: 'Награды почти никогда не совпадают до последнего бита: округления в float дают стандартное отклонение порядка 1e-15 вместо ровного нуля. Проверка на точное равенство такой случай пропустит, и деление разности (тоже микроскопической, но случайной по знаку) на микроскопический знаменатель выдаст z-оценки обычного масштаба — чистый шум округления, поданный в градиент как настоящий сигнал. Сравнение с малым порогом ловит и точный ноль, и вычислительно неотличимый от нуля разброс, возвращая массив нулей: группа с одинаковыми наградами обучающего сигнала не даёт.'
