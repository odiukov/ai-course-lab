- concept: преимущества сопоставляются ответам по индексу, поэтому векторизованные операции сохраняют длину и порядок входа
  question: Группа из 6 ответов на один промпт получила награды, порядок которых совпадает с порядком сэмплированных ответов. Почему внутри расчёта группового преимущества запрещено сортировать награды по убыванию перед нормировкой?
  explanation: 'Среднее и стандартное отклонение от перестановки не меняются — набор z-оценок остался бы тем же множеством. Ломается адресация: преимущество i-й позиции попадёт в градиент j-го ответа, и политика получит подкрепление за чужой текст. Длина и порядок входа — контракт функции.'
  kind: choice
  options:
    - Каждый элемент вектора преимуществ домножается на логарифм вероятности своего ответа, и сортировка разрывает это соответствие по индексу
    - Сортировка меняет среднее и стандартное отклонение группы, и z-оценки получатся другими
    - NumPy не умеет вычитать среднее из отсортированного массива без явного копирования
    - Отсортированные награды нельзя сравнить с наградами других групп в батче
