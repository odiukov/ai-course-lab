- concept: групповое преимущество считается как z-оценка награды ответа относительно наград группы на тот же промпт
  question: На один промпт сэмплировано 4 ответа с наградами 2, 6, 6 и 10. Стандартное отклонение считается по группе с нормировкой на G. Чему равно групповое преимущество ответа с наградой 10? Ответ округли до сотых.
  explanation: Среднее награды = (2+6+6+10)/4 = 6. Дисперсия = (16+0+0+16)/4 = 8, σ ≈ 2.83. A = (10 − 6)/2.83 ≈ 1.41. Преимущество — это z-оценка награды внутри своей группы, а не сама награда.
  kind: numeric
  answer: 1.41
  tolerance: 0.05
  id: 019-group-baseline-1
  fingerprint: 23e8f521
- concept: нулевой разброс наград внутри группы обнуляет преимущества, и промпт не даёт обучающего сигнала
  question: Все 24 ответа, сэмплированных на один промпт, получили одинаковую награду 0,6. Что произойдёт с этим промптом при обновлении политики по групповому преимуществу?
  explanation: Числитель r_i − mean равен нулю для каждого ответа, поэтому все преимущества нулевые (нулевой знаменатель на практике обходят добавкой эпсилон). Промпт, на котором вся группа отвечает одинаково, не несёт информации о том, какой выбор лучше, и выпадает из обучения — отсюда практика отбирать промпты со смешанным успехом.
  kind: choice
  options:
    - Все ответы получат преимущество 0,6 и будут усилены одинаково
    - Все преимущества равны нулю, промпт не даст вклада в градиент политики
    - Преимущества распределятся случайно, потому что порядок сэмплирования произволен
    - Преимущества будут отрицательными, так как награда ниже максимальной
  correct: 1
  id: 019-group-baseline-2
  fingerprint: cef8a6a9
- concept: деление на стандартное отклонение группы уравнивает вклад промптов с разным разбросом наград в градиент
  question: Зачем разность между наградой ответа и средним по группе делят на стандартное отклонение наград этой группы?
  explanation: Вычитание среднего даёт знак и величину отрыва, но в сырых единицах награды. Отрыв в 3 балла — это много, если вся группа уложилась в 1 балл, и мало, если группа растянута на 20. Деление на σ переводит все промпты в сопоставимый масштаб, чтобы шаг обновления не определялся тем, у какого промпта награды разбросаны сильнее. Диапазон при этом не ограничивается, а KL-штраф в GRPO присутствует отдельно.
  kind: choice
  options:
    - Чтобы преимущество всегда оказывалось в диапазоне от −1 до 1 и не требовало клиппирования
    - Чтобы компенсировать отсутствие KL-штрафа до референсной модели
    - 'Чтобы промпты с большим разбросом наград не доминировали в градиенте: одинаковый отрыв от среднего значит разное в плотной и в разбросанной группе'
    - Чтобы восстановить абсолютный масштаб награды, потерянный при вычитании среднего
  correct: 2
  id: 019-group-baseline-3
  fingerprint: 1072d75f
