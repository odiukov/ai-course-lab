- concept: ORM и PRM различаются точкой начисления награды и типом разметки, которую требуют для обучения
  question: Модель решает задачу в 12 промежуточных шагов. Чем Process Reward Model отличается от Outcome Reward Model по требованиям к обучающим данным?
  explanation: ORM выдаёт одну скалярную награду за готовый ответ, поэтому ему хватает метки на всю траекторию. PRM выдаёт награду на каждом промежуточном шаге и обучается на поштучно размеченных данных — стоимость разметки растёт пропорционально длине рассуждения. Именно эта цена и заставляет чаще выбирать ORM или правило на итог.
  kind: choice
  options:
    - PRM требует разметки правильности каждого промежуточного шага, а ORM — только оценки финального ответа
    - PRM обучается на тех же данных, что ORM, но с другой архитектурой головы
    - 'PRM не обучается вовсе: это детерминированный проверщик каждого шага'
    - ORM требует поштучной разметки, а PRM обходится одной меткой на траекторию
  correct: 0
  id: 058-final-quiz-1
  fingerprint: f299da94
- concept: поведение самопроверки и отката может возникнуть при обучении только на итоговых наградах, хотя награда его нигде не описывает
  question: Политику обучали RL, где награда даётся исключительно за правильность финального ответа, а ход рассуждения не оценивается никак. В процессе обучения модель начала перепроверять себя и откатываться к ранней части рассуждения. Объясни, почему такое поведение вообще может появиться при награде, которая его не описывает.
  explanation: 'Ключ: функция награды задаёт критерий отбора, а не рецепт. Всё, что коррелирует с успехом и уже встречается в сэмплах, усиливается — включая процедурные привычки вроде отката. Отсюда же и граница: если поведения нет в сэмплах, итоговая награда его не породит.'
  kind: open
  reference: 'Награда за итог не задаёт форму рассуждения, но перевзвешивает целые траектории: если самопроверка и откат чаще приводят к верному финальному ответу, содержащие их траектории систематически получают более высокую награду, и градиент повышает их вероятность. Поведение при этом не создаётся с нуля — политика должна порождать его хотя бы изредка, чтобы отбор мог его закрепить. Это и есть «R1 moment» из описания DeepSeek: полезная стратегия оказывается эмерджентной, а не прописанной в функции награды. Гарантий её появления нет: она возникает только при устойчивой корреляции с успехом на многих разных задачах.'
  id: 058-final-quiz-2
  fingerprint: 9b7211bc
- concept: rule-based reward не является обученной моделью, поэтому у него нет собственной ошибки обобщения, но есть жёсткая область применимости
  question: Награда за задачу выдаётся набором из 30 юнит-тестов, а не обученной моделью награды. Какое следствие этого верно?
  explanation: Верификатор (регулярка, sympy, набор тестов) возвращает оценку без обученной модели, поэтому у него нет ни дрейфа, ни артефактов разметки, под которые можно подстроиться. Взамен он применим только там, где результат формально проверяем, и говорит лишь об итоге — тесты, прошедшие на верном ответе, ничего не сообщают о корректности промежуточных шагов.
  kind: choice
  options:
    - 'У награды нет собственной ошибки обобщения: её нельзя эксплуатировать, подстраиваясь под артефакты обучающей выборки оценщика'
    - Такая награда всегда точнее обученной модели награды на любой задаче, включая оценку стиля и тона
    - Такую награду нужно периодически дообучать на свежих ответах политики, иначе она устаревает
    - Детерминированный проверщик гарантирует, что каждый промежуточный шаг рассуждения тоже верен
  correct: 0
