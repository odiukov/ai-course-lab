- concept: 'малая доля человеческих меток работает как измерительный held-out набор: расхождение критика с людьми сначала измеряют, а потом правят конституцию или данные'
  question: Расставь шаги использования небольшой доли человеческих предпочтений как контрольного механизма в цикле Constitutional AI.
  explanation: 'Человеческие метки здесь работают в первую очередь как измерительный инструмент: они дают внешнюю точку отсчёта, с которой сверяют критика. Вердикт критика скрывают от разметчиков, иначе замер потеряет независимость. Правка конституции идёт последней — сначала нужно знать, какой класс ошибок чинить.'
  kind: order
  items:
    - Отобрать выборку пар ответов из потока, который уже размечает критик
    - Получить по этой выборке человеческие предпочтения, не показывая разметчикам вердикт критика
    - Сравнить предпочтения человека и критика на одних и тех же парах
    - Измерить долю и характер расхождений, выделив систематические классы ошибок
    - Изменить формулировку принципа или добавить человеческие данные в обучение под найденный класс ошибок
