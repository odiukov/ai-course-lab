- concept: небольшая доля человеческих предпочтений в продакшен-CAI нужна как единственный источник сигнала вне распределения самой модели
  question: В продакшен-пайплайне Constitutional AI обычно оставляют небольшую примесь человеческих предпочтений — порядка 7% от объёма, который потребовался бы для чистого RLHF. Зачем она нужна, если конституция и так покрывает поведение?
  explanation: Всё, что порождает цикл самокритики, лежит внутри распределения базовой модели, включая её слепые зоны. Человеческие метки — единственный вход в цикл извне, поэтому они и остаются, пусть в доле 5-10%. Экономия вычислений и форматирование к делу не относятся.
  kind: choice
  options:
    - Чтобы уменьшить объём вычислений на генерацию пар предпочтений
    - Чтобы дать модели награды примеры правильного формата ответа перед началом обучения
    - 'Чтобы внести обратную связь, независимую от ограничений самой модели: только она способна вскрыть нарушения, которых модель-критик не видит'
    - Чтобы разрешать конфликты между принципами конституции в момент обучения
  correct: 2
  id: 015-self-judge-limit-2
  fingerprint: 2b104adb
- concept: между формулировкой принципа и его применением к конкретной фразе стоит задача распознавания, которую текст принципа не решает
  question: Команда обнаружила, что критик пропускает вежливое эмоциональное давление в ответах. Инженер предлагает переписать принцип конституции подробнее и добавить в него слова «манипуляция» и «чувство вины». Объясни, в каком случае это сработает, а в каком нет.
  explanation: 'Ключевое различие: конституция называет желаемое поведение, но не добавляет модели навык узнавать его скрытые варианты. Правка текста перераспределяет внимание внутри уже доступного модели, а неизвестную ошибку в известную не превращает.'
  kind: open
  reference: 'Принцип задаёт целевое поведение, но применить его к конкретной фразе — отдельная задача распознавания, которую решает сама модель. Переформулировка помогает, если модель уже умеет отличать давление от нейтральной просьбы, а мешало ей только то, что старая формулировка не указывала на этот класс явно: тогда более точный принцип направляет уже имеющуюся способность. Если же модель в принципе не связывает конструкцию «если ты действительно заботишься — сделай сейчас» с давлением, никакой текст правила эту способность не создаёт: критик прочитает новые слова, проверит знакомые признаки (угроза, оскорбление, приказ) и снова вернёт пустой список. Закрывается такой разрыв не редактурой конституции, а внешним сигналом — человеческой разметкой или более сильной моделью-критиком.'
