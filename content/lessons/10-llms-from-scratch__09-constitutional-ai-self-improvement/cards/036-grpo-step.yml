- concept: учебная оценка kl через среднюю разность log-probabilities может быть отрицательной, в отличие от настоящей KL-дивергенции, и тогда штрафной член уменьшает итоговый loss
  question: На одном шаге policy_loss = -0.6, средняя разность ref_logprobs - policy_logprobs равна -0.4, вес штрафа beta = 0.05. Чему равен total_loss?
  explanation: 'total_loss = policy_loss + beta * kl = -0.6 + 0.05 * (-0.4) = -0.62. Средняя разность log-probabilities — грубая оценка: настоящая KL-дивергенция неотрицательна, а эта величина уходит в минус, когда политика в среднем даёт сэмплам большую вероятность, чем референсная модель. Тогда «штраф» превращается в добавку и слегка поощряет удаление от опорной модели — цена простоты такой оценки.'
  kind: numeric
  answer: -0.62
  tolerance: 0.005
  id: 036-grpo-step-2
  fingerprint: 8c8c7aa9
- concept: 'среднее отношение вероятностей возвращают как диагностику размера шага: отклонение от единицы показывает долю сэмплов, ушедших в зону клиппирования'
  question: Помимо значений потерь, шаг возвращает среднее отношение вероятностей. Объясни своими словами, что это число диагностирует и почему за ним следят.
  explanation: 'Ограничение работает молча: цель просто перестаёт расти, ошибки не будет. Поэтому среднее отношение — единственный дешёвый индикатор того, что шаг вышел за пределы доверия к текущим сэмплам. В связке с kl оно разделяет две вещи: отношение меряет размер одного шага, kl — накопленное удаление от референсной модели.'
  kind: open
  reference: 'Отношение вероятностей показывает, насколько текущая политика изменила вероятность уже сгенерированных ответов относительно той, при которой их сэмплировали. Если среднее близко к единице, шаг маленький и клиппирование почти не задействовано. Чем сильнее среднее отклоняется от единицы, тем больше сэмплов вылетело за коридор ширины clip_eps: их вклад упирается в границу, градиент по этим элементам зануляется, и обновление тратится впустую. Резкий уход среднего от единицы — сигнал слишком большого learning rate, слишком многих внутренних эпох на одной партии сэмплов или битого расчёта log-probabilities. Само по себе число ничего не ограничивает, оно только измеряет, насколько разумным получился поворот.'
  id: 036-grpo-step-3
  fingerprint: '89130209'
