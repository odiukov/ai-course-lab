- concept: критик размером с политику удваивает память под веса в PPO
  question: Политика — 4 млрд параметров, веса хранятся в bf16 (2 байта на параметр). В PPO рядом обучается сеть ценности такого же размера и точности. Сколько гигабайт (1 ГБ = 10^9 байт) займут веса обеих сетей вместе?
  explanation: 4e9 × 2 байта = 8 ГБ на политику, столько же на критика, итого 16 ГБ — ровно двукратный расход только под веса, без учёта оптимизатора, активаций и хранения промежуточных значений V(s) для всех токенов. Именно эта цена и мотивирует безкритиковые варианты вроде GRPO, где базой служит среднее по группе сэмплов.
  kind: numeric
  answer: 16
  tolerance: 0.2
  id: 017-value-cost-2
  fingerprint: af6b53e4
- concept: цель обучения критика нестационарна, потому что распределение данных задаёт обновляющаяся политика
  question: Почему обучение сети ценности в RL для языковых моделей — задача с движущейся целью, и чем это грозит обновлению политики? Объясни своими словами.
  explanation: 'Ключевое отличие от обычной супервизной регрессии: там распределение данных фиксировано, здесь его задаёт сама обучаемая политика. Плюс кредит нужно раздать каждому промежуточному префиксу, а не только финальному ответу — сложность создаёт не финальная награда, а её разнесение по токенам. GRPO обходит это, заменяя обученную базу z-нормировкой наград внутри группы из G сэмплов на один промпт.'
  kind: open
  reference: Критик обучается регрессии на траекториях, сэмплированных текущей политикой. После каждого шага PPO политика меняется и начинает порождать другое распределение ответов, поэтому данные, на которых критик уже сошёлся, устаревают, и корректная функция ценности для новой политики другая. Критик вынужден непрерывно догонять политику. Пока он отстаёт, его прогнозы смещены, преимущество A = факт − прогноз получается шумным и смещённым, и PPO усиливает не те токены — вплоть до расхождения обучения. Отсюда либо частые дорогие обновления критика, либо деградация сигнала.
  id: 017-value-cost-3
  fingerprint: 0484d757
