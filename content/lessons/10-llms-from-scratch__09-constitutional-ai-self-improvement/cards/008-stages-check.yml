- concept: этап Constitutional AI определяется формой обучающего сигнала, а не тем, кто источник обратной связи
  question: В пайплайне Constitutional AI обратную связь на обоих этапах даёт сама модель, и на обоих этапах используется одна и та же конституция. Что тогда отличает SL-CAI от RLAIF?
  explanation: Модель-критик и конституция общие для обоих этапов, поэтому по ним этапы не различить. SL-CAI даёт паре (prompt, revised_response) статус образца для копирования — обычное SFT-обучение. RLAIF даёт метку «A лучше B», из которой учится модель награды или напрямую политика. Ловушка — считать RLAIF любую обратную связь от модели.
  kind: choice
  options:
    - 'Форма обучающего сигнала: готовый целевой текст против выбора лучшего из двух ответов'
    - 'Источник обратной связи: на первом этапе принципы пишет человек, на втором — модель'
    - 'Число принципов конституции: на втором этапе их берут больше'
    - 'Размер модели: RLAIF требует более крупной модели-судьи'
  correct: 0
  id: 008-stages-check-1
  fingerprint: 346b525d
- concept: SL-CAI обучается по одному целевому ответу на запрос, RLAIF требует минимум двух сэмплов на запрос, чтобы получить сравнение
  question: Команда собрала для каждого из 300 вредных запросов ровно один ответ модели. Почему из такого датасета нельзя получить сигнал RLAIF, даже если каждый ответ размечен моделью по конституции?
  explanation: 'RLAIF строится на попарных предпочтениях, поэтому на каждый запрос нужно сэмплировать минимум два ответа и спросить модель, какой лучше следует конституции. Один ответ на запрос годится только для supervised-обучения: если модель его ещё и переписала по принципу, получается пара (prompt, revised_response) — это SL-CAI.'
  kind: choice
  options:
    - 'Потому что предпочтение определено только на паре кандидатов: с одним ответом сравнивать не с чем'
    - Потому что 300 запросов слишком мало для обучения модели награды
    - Потому что RLAIF работает только с безвредными запросами
    - Потому что для RLAIF ответы обязан генерировать человек
  correct: 0
