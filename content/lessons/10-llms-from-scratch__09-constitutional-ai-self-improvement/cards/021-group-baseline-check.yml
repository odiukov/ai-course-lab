- concept: 'GRPO обменивает память под отдельную сеть ценности на дополнительное сэмплирование: базовая линия существует только при нескольких ответах на один промпт'
  question: PPO может обучаться, сгенерировав один ответ на промпт, а GRPO — нет. Объясни своими словами, почему, и что GRPO платит за отказ от отдельной сети ценности.
  explanation: 'Ключевое: сеть ценности — амортизированный предсказатель (обучается один раз, применяется к любому состоянию), группа — оценка по Монте-Карло, которая заново покупается сэмплированием на каждом промпте. Поэтому «GRPO дешевле» верно про память, но не про число генераций.'
  kind: open
  reference: 'В PPO базовую линию даёт обученная сеть ценности: она предсказывает ожидаемую награду по самому состоянию, поэтому оценить один-единственный ответ можно без соседей. В GRPO предсказателя нет — точку отсчёта даёт эмпирическое среднее наград по группе, а среднее по одному элементу равно ему самому, и преимущество тождественно обнуляется. Значит нужно G ответов (обычно 16–64) на каждый промпт. Экономия — память и отдельный цикл обучения критика размером с политику; плата — во столько же раз больше генераций и оценок награды на один промпт, то есть память меняется на вычисления и время инференса.'
  id: 021-group-baseline-check-2
