- concept: групповое преимущество инвариантно к умножению всех наград группы на положительную константу
  question: Группа из четырёх ответов на один промпт получила награды 10, 20, 30 и 60. Затем шкалу награды переопределили и все значения умножили на 7. Чему равно групповое преимущество ответа с наибольшей наградой после такого пересчёта?
  explanation: 'Умножение на положительную константу растягивает и отклонение от среднего, и стандартное отклонение одинаково, поэтому множитель сокращается: преимущества не меняются. Считаем по исходным наградам: среднее 30, std = sqrt((400+100+0+900)/4) ≈ 18,7, преимущество лучшего ответа = 30/18,7 ≈ 1,60. Отсюда следствие: подбирать масштаб награды бессмысленно, значение имеет только относительный порядок внутри группы.'
  kind: numeric
  answer: 1.6
  tolerance: 0.06
  id: 033-advantage-check-2
  fingerprint: 9bc20d7a
- concept: выбор ddof при оценке разброса группы меняет масштаб преимуществ, но не знаки и не ранжирование
  question: Преимущества считают как (r − r.mean()) / r.std(), где np.std по умолчанию делит на n (ddof=0). Группа — 16 ответов с разными наградами. Что изменится, если перейти на r.std(ddof=1)?
  explanation: ddof=1 делит сумму квадратов на n−1, поэтому std растёт в sqrt(n/(n−1)) раз, а преимущества падают в sqrt((n−1)/n) = sqrt(15/16) ≈ 0,968 раза. Среднее не затрагивается, значит знаки и ранжирование те же. Эффект — общий множитель на градиент, эквивалентный лёгкому изменению learning rate; на маленьких группах он заметнее, чем на больших.
  kind: choice
  options:
    - Все преимущества станут по модулю меньше примерно в 0,97 раза, знаки и порядок сохранятся
    - Все преимущества станут по модулю больше, потому что ddof=1 уменьшает знаменатель
    - 'Ничего не изменится: обе формулы дают одинаковый std'
    - Часть преимуществ поменяет знак, потому что сдвинется среднее
