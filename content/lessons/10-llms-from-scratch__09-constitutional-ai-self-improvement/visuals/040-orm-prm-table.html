<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORM и PRM: компромисс награды</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f8fb;
    --panel: #ffffff;
    --panel-alt: #eef2f8;
    --ink: #172033;
    --muted: #58657a;
    --line: #9ba8bb;
    --orm: #3b6fd8;
    --orm-soft: #dce7ff;
    --prm: #7b4bc4;
    --prm-soft: #eadfff;
    --good: #18845b;
    --good-soft: #d8f3e8;
    --bad: #c74343;
    --bad-soft: #ffe0e0;
    --warn: #a76710;
    --warn-soft: #ffedc8;
    --ribbon: #e8edf5;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121722;
      --panel: #1b2230;
      --panel-alt: #242d3d;
      --ink: #edf2fa;
      --muted: #b7c1d1;
      --line: #66748a;
      --orm: #79a6ff;
      --orm-soft: #253d68;
      --prm: #bd8cff;
      --prm-soft: #463263;
      --good: #65d5a7;
      --good-soft: #1d493b;
      --bad: #ff8585;
      --bad-soft: #572e35;
      --warn: #ffc467;
      --warn-soft: #533e20;
      --ribbon: #252e3e;
    }
  }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .figure {
    box-sizing: border-box;
    width: 100%;
    background: var(--bg);
    padding: 10px 14px 8px;
  }

  h2 {
    margin: 0 0 6px;
    text-align: center;
    font-size: 21px;
    line-height: 1.25;
    font-weight: 750;
    letter-spacing: 0.01em;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 450px;
    background: var(--bg);
  }

  text {
    font-family: inherit;
    fill: var(--ink);
  }

  .muted { fill: var(--muted); }
  .orm-text { fill: var(--orm); }
  .prm-text { fill: var(--prm); }
  .good-text { fill: var(--good); }
  .bad-text { fill: var(--bad); }
  .warn-text { fill: var(--warn); }
</style>
</head>
<body>
<main class="figure">
  <h2>Один трейс — разная плотность награды</h2>
  <svg id="diagram"
       viewBox="0 0 1200 450"
       width="1200"
       height="450"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="diagram-title diagram-desc">
    <title id="diagram-title">Сравнение итоговой и пошаговой награды</title>
    <desc id="diagram-desc">ORM даёт один сигнал всему трейсу, а PRM — N сигналов по шагам. PRM точнее назначает заслуги, но требует более дорогой разметки и создаёт больший риск взлома награды.</desc>
  </svg>
</main>

<script>
const data = Object.freeze({
  canvas: { width: 1200, height: 450 },
  frame: {
    origin: { x: 24, y: 8 },
    scale: { x: 96, y: 68 }
  },
  zero: 0,
  one: 1,
  two: 2,
  trace: {
    title: { x: 0.35, y: 0.25 },
    y: 1.12,
    firstX: 1.15,
    gap: 1.35,
    nodeRx: 0.25,
    nodeRy: 0.35,
    lineStart: 1.4,
    lineEnd: 10.35,
    lineWidth: 3,
    numberSize: 17,
    labelSize: 16,
    labels: [
      { step: 1, tone: "plain" },
      { step: 2, tone: "plain" },
      { step: 3, tone: "bad", note: "ошибка", noteY: 1.76 },
      { step: 4, tone: "plain" },
      { step: 5, tone: "plain" },
      { step: 6, tone: "good", note: "случайная компенсация", noteY: 0.56 },
      { step: 7, tone: "plain" },
      { step: 8, tone: "good", note: "финальный ответ верен", noteY: 0.56 }
    ],
    noteAnchors: [
      { step: 3, anchor: "middle" },
      { step: 6, anchor: "end", shift: -0.2 },
      { step: 8, anchor: "start", shift: 0.22 }
    ]
  },
  cards: {
    y: 2.08,
    height: 3.46,
    width: 5.55,
    leftX: 0.35,
    rightX: 6.1,
    headingY: 2.38,
    signalY: 2.88,
    signalRy: 0.25,
    ormSignalX: 2.16,
    ormSignalWidth: 1.92,
    prmSignalFirstX: 6.55,
    prmSignalGap: 0.62,
    prmSignalWidth: 0.46,
    separatorStartY: 3.22,
    separatorGap: 0.76,
    separatorInset: 0.18,
    rowLabelOffset: 0.24,
    rowValueOffset: 0.55,
    textInset: 0.25,
    headingSize: 22,
    signalSize: 17,
    rowLabelSize: 15,
    rowValueSize: 17,
    rows: [
      {
        label: "СТОИМОСТЬ РАЗМЕТКИ",
        orm: "ниже · проверить только итог",
        prm: "выше · проверить каждый переход",
        ormTone: "good",
        prmTone: "warn"
      },
      {
        label: "НАЗНАЧЕНИЕ ЗАСЛУГ",
        orm: "разреженное · где возникла ошибка?",
        prm: "адресное · ошибка именно на шаге 3",
        ormTone: "warn",
        prmTone: "good"
      },
      {
        label: "РИСК ВЗЛОМА НАГРАДЫ",
        orm: "ниже · сигнал привязан к ответу",
        prm: "выше · можно имитировать полезные шаги",
        ormTone: "good",
        prmTone: "bad"
      }
    ]
  },
  ribbon: {
    x: 0.35,
    y: 5.72,
    width: 11.3,
    height: 0.52,
    textX: 6,
    textY: 5.98,
    size: 17,
    text: "Плотнее сигнал → точнее подсказка, но дороже проверка и больше поверхность взлома"
  },
  arrow: {
    lineWidth: 3,
    headLength: 0.18,
    headHalfHeight: 0.11
  },
  styles: {
    thin: 1,
    normal: 2,
    heavy: 3,
    fallbackSize: 20,
    fallbackX: 6,
    fallbackY: 2.8,
    fallbackGap: 0.45
  }
});

const origin = Object.freeze(data.frame.origin);
const scale = Object.freeze(data.frame.scale);
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const svg = document.getElementById("diagram");
  const ns = "http://www.w3.org/2000/svg";

  const make = (name, attrs, content) => {
    const node = document.createElementNS(ns, name);
    Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
    if (content !== undefined) node.textContent = content;
    return node;
  };

  const add = node => {
    svg.appendChild(node);
    return node;
  };

  const line = (x1, y1, x2, y2, className, width) => add(make("line", {
    x1: sx(x1),
    y1: sy(y1),
    x2: sx(x2),
    y2: sy(y2),
    class: className,
    stroke: "currentColor",
    "stroke-width": width,
    "stroke-linecap": "round",
    "vector-effect": "non-scaling-stroke"
  }));

  const rect = (x, y, width, height, className, strokeWidth) => add(make("rect", {
    x: sx(x),
    y: sy(y),
    width: sx(x + width) - sx(x),
    height: sy(y + height) - sy(y),
    class: className,
    fill: "currentColor",
    stroke: "currentColor",
    "stroke-width": strokeWidth,
    "vector-effect": "non-scaling-stroke"
  }));

  const ellipse = (x, y, rx, ry, className, strokeWidth) => add(make("ellipse", {
    cx: sx(x),
    cy: sy(y),
    rx: sx(x + rx) - sx(x),
    ry: sy(y + ry) - sy(y),
    class: className,
    fill: "currentColor",
    stroke: "currentColor",
    "stroke-width": strokeWidth,
    "vector-effect": "non-scaling-stroke"
  }));

  const text = (x, y, value, className, size, anchor, weight) => add(make("text", {
    x: sx(x),
    y: sy(y),
    class: className,
    "font-size": size,
    "font-weight": weight,
    "text-anchor": anchor,
    "dominant-baseline": "middle"
  }, value));

  const arrow = (x1, y1, x2, y2, className) => {
    line(x1, y1, x2, y2, className, data.arrow.lineWidth);
    const points = [
      [sx(x2), sy(y2)],
      [sx(x2 - data.arrow.headLength), sy(y2 - data.arrow.headHalfHeight)],
      [sx(x2 - data.arrow.headLength), sy(y2 + data.arrow.headHalfHeight)]
    ].map(point => point.join(",")).join(" ");
    add(make("polygon", {
      points,
      class: className,
      fill: "currentColor"
    }));
  };

  text(
    data.trace.title.x,
    data.trace.title.y,
    "Один и тот же трейс: 8 шагов",
    "muted",
    data.trace.labelSize,
    "start",
    "700"
  );

  arrow(
    data.trace.lineStart,
    data.trace.y,
    data.trace.lineEnd,
    data.trace.y,
    "muted"
  );

  data.trace.labels.forEach((item, index) => {
    const x = data.trace.firstX + data.trace.gap * index;
    const fillClass = item.tone === "bad"
      ? "bad-text"
      : item.tone === "good"
        ? "good-text"
        : "muted";

    const softClass = item.tone === "bad"
      ? "bad-text"
      : item.tone === "good"
        ? "good-text"
        : "muted";

    ellipse(
      x,
      data.trace.y,
      data.trace.nodeRx,
      data.trace.nodeRy,
      softClass,
      data.styles.normal
    );

    ellipse(
      x,
      data.trace.y,
      data.trace.nodeRx - data.trace.nodeRx,
      data.trace.nodeRy - data.trace.nodeRy,
      fillClass,
      data.styles.thin
    );

    text(
      x,
      data.trace.y,
      String(item.step),
      "",
      data.trace.numberSize,
      "middle",
      "750"
    );

    if (item.note) {
      const noteRule = data.trace.noteAnchors.find(rule => rule.step === item.step);
      const shift = noteRule.shift === undefined ? data.zero : noteRule.shift;
      text(
        x + shift,
        item.noteY,
        item.note,
        item.tone === "bad" ? "bad-text" : "good-text",
        data.trace.labelSize,
        noteRule.anchor,
        "700"
      );

      if (item.step === data.trace.labels[data.two].step) {
        line(
          x,
          data.trace.y + data.trace.nodeRy,
          x,
          item.noteY - data.arrow.headHalfHeight,
          "bad-text",
          data.styles.normal
        );
      }
    }
  });

  rect(
    data.cards.leftX,
    data.cards.y,
    data.cards.width,
    data.cards.height,
    "orm-text",
    data.styles.normal
  );
  rect(
    data.cards.leftX + data.cards.separatorInset,
    data.cards.y + data.cards.separatorInset,
    data.cards.width - data.cards.separatorInset * data.two,
    data.cards.height - data.cards.separatorInset * data.two,
    "orm-text",
    data.styles.thin
  );
  rect(
    data.cards.rightX,
    data.cards.y,
    data.cards.width,
    data.cards.height,
    "prm-text",
    data.styles.normal
  );
  rect(
    data.cards.rightX + data.cards.separatorInset,
    data.cards.y + data.cards.separatorInset,
    data.cards.width - data.cards.separatorInset * data.two,
    data.cards.height - data.cards.separatorInset * data.two,
    "prm-text",
    data.styles.thin
  );

  text(
    data.cards.leftX + data.cards.width / data.two,
    data.cards.headingY,
    "ORM · итоговая награда",
    "orm-text",
    data.cards.headingSize,
    "middle",
    "800"
  );
  text(
    data.cards.rightX + data.cards.width / data.two,
    data.cards.headingY,
    "PRM · пошаговая награда",
    "prm-text",
    data.cards.headingSize,
    "middle",
    "800"
  );

  rect(
    data.cards.ormSignalX,
    data.cards.signalY - data.cards.signalRy,
    data.cards.ormSignalWidth,
    data.cards.signalRy * data.two,
    "orm-text",
    data.styles.normal
  );
  text(
    data.cards.ormSignalX + data.cards.ormSignalWidth / data.two,
    data.cards.signalY,
    "1 сигнал на трейс",
    "",
    data.cards.signalSize,
    "middle",
    "750"
  );

  data.trace.labels.forEach((item, index) => {
    const x = data.cards.prmSignalFirstX + data.cards.prmSignalGap * index;
    const tone = item.tone === "bad"
      ? "bad-text"
      : item.tone === "good"
        ? "good-text"
        : "prm-text";

    rect(
      x,
      data.cards.signalY - data.cards.signalRy,
      data.cards.prmSignalWidth,
      data.cards.signalRy * data.two,
      tone,
      data.styles.normal
    );
    text(
      x + data.cards.prmSignalWidth / data.two,
      data.cards.signalY,
      String(item.step),
      "",
      data.cards.rowLabelSize,
      "middle",
      "750"
    );
  });

  text(
    data.cards.rightX + data.cards.width - data.cards.textInset,
    data.cards.signalY,
    "N сигналов",
    "prm-text",
    data.cards.signalSize,
    "end",
    "750"
  );

  data.cards.rows.forEach((row, index) => {
    const separatorY = data.cards.separatorStartY + data.cards.separatorGap * index;
    const leftTextX = data.cards.leftX + data.cards.textInset;
    const rightTextX = data.cards.rightX + data.cards.textInset;

    line(
      data.cards.leftX + data.cards.separatorInset,
      separatorY,
      data.cards.leftX + data.cards.width - data.cards.separatorInset,
      separatorY,
      "orm-text",
      data.styles.thin
    );
    line(
      data.cards.rightX + data.cards.separatorInset,
      separatorY,
      data.cards.rightX + data.cards.width - data.cards.separatorInset,
      separatorY,
      "prm-text",
      data.styles.thin
    );

    text(
      leftTextX,
      separatorY + data.cards.rowLabelOffset,
      row.label,
      "muted",
      data.cards.rowLabelSize,
      "start",
      "750"
    );
    text(
      leftTextX,
      separatorY + data.cards.rowValueOffset,
      row.orm,
      row.ormTone + "-text",
      data.cards.rowValueSize,
      "start",
      "650"
    );
    text(
      rightTextX,
      separatorY + data.cards.rowLabelOffset,
      row.label,
      "muted",
      data.cards.rowLabelSize,
      "start",
      "750"
    );
    text(
      rightTextX,
      separatorY + data.cards.rowValueOffset,
      row.prm,
      row.prmTone + "-text",
      data.cards.rowValueSize,
      "start",
      "650"
    );
  });

  rect(
    data.ribbon.x,
    data.ribbon.y,
    data.ribbon.width,
    data.ribbon.height,
    "muted",
    data.styles.thin
  );
  text(
    data.ribbon.textX,
    data.ribbon.textY,
    data.ribbon.text,
    "",
    data.ribbon.size,
    "middle",
    "750"
  );
} catch (error) {
  const svg = document.getElementById("diagram");
  const ns = "http://www.w3.org/2000/svg";
  svg.replaceChildren();

  const first = document.createElementNS(ns, "text");
  first.setAttribute("x", sx(data.styles.fallbackX));
  first.setAttribute("y", sy(data.styles.fallbackY));
  first.setAttribute("font-size", data.styles.fallbackSize);
  first.setAttribute("text-anchor", "middle");
  first.textContent = "ORM: 1 итоговый сигнал — дешевле, но назначение заслуг разрежено.";
  svg.appendChild(first);

  const second = document.createElementNS(ns, "text");
  second.setAttribute("x", sx(data.styles.fallbackX));
  second.setAttribute("y", sy(data.styles.fallbackY + data.styles.fallbackGap));
  second.setAttribute("font-size", data.styles.fallbackSize);
  second.setAttribute("text-anchor", "middle");
  second.textContent = "PRM: N пошаговых сигналов — точнее, но дороже и легче взломать.";
  svg.appendChild(second);
}
</script>
</body>
</html>
