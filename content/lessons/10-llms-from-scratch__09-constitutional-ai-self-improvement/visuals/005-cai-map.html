<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта двух этапов Constitutional AI</title>
<style>
  :root {
    color-scheme: light dark;
    --page: white;
    --ink: midnightblue;
    --muted: slategrey;
    --panel-one: aliceblue;
    --panel-two: lavender;
    --node: white;
    --border: lightsteelblue;
    --line: steelblue;
    --danger: crimson;
    --revision: seagreen;
    --choice: darkorchid;
    --result: honeydew;
    --result-two: lavenderblush;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: midnightblue;
      --ink: whitesmoke;
      --muted: lightsteelblue;
      --panel-one: darkslateblue;
      --panel-two: darkslategray;
      --node: darkslategray;
      --border: lightslategray;
      --line: lightskyblue;
      --danger: salmon;
      --revision: lightgreen;
      --choice: plum;
      --result: darkgreen;
      --result-two: indigo;
    }
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  figure {
    margin: 0;
    background: var(--page);
  }

  figcaption {
    padding: .55rem .8rem .35rem;
    font-size: 1.05rem;
    font-weight: bold;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 480px;
    background: var(--page);
  }

  text {
    fill: var(--ink);
  }

  .canvas {
    fill: var(--page);
  }

  .stage-one {
    fill: var(--panel-one);
    stroke: var(--border);
  }

  .stage-two {
    fill: var(--panel-two);
    stroke: var(--border);
  }

  .node {
    fill: var(--node);
    stroke: var(--border);
  }

  .result-one {
    fill: var(--result);
    stroke: var(--revision);
  }

  .result-two {
    fill: var(--result-two);
    stroke: var(--choice);
  }

  .arrow {
    fill: none;
    stroke: var(--line);
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .arrow-head {
    fill: var(--line);
  }

  .stage-link {
    stroke: var(--revision);
  }

  .stage-link-head {
    fill: var(--revision);
  }

  .accent-danger {
    fill: var(--danger);
  }

  .accent-revision {
    fill: var(--revision);
  }

  .accent-choice {
    fill: var(--choice);
  }

  .stage-label,
  .result-label {
    font-weight: bold;
    letter-spacing: .025em;
  }

  .node-label {
    font-weight: bold;
  }

  .secondary,
  .bridge-label,
  .legend-label {
    fill: var(--muted);
  }

  .fallback {
    margin: 0;
    padding: 1rem;
    color: var(--ink);
    background: var(--page);
  }
</style>
</head>
<body>
<figure aria-labelledby="diagram-heading">
  <figcaption id="diagram-heading">Карта двух этапов Constitutional AI</figcaption>
  <svg id="map" viewBox="0 0 1200 452" width="1200" height="452"
       preserveAspectRatio="xMidYMid meet"
       role="img" aria-labelledby="svg-title svg-description">
    <title id="svg-title">Два связанных конвейера Constitutional AI</title>
    <desc id="svg-description">Сначала модель критикует и исправляет один ответ для SFT, затем сравнивает ответы A и B для обучения через DPO или PPO.</desc>
    <g id="diagram"></g>
  </svg>
  <p id="fallback" class="fallback" hidden>
    Схема должна была показать два связанных этапа: вредный запрос, первоначальный ответ, критика, исправление и SFT; затем запрос, ответы A и B, конституционный выбор, датасет предпочтений и DPO или PPO.
  </p>
</figure>

<script>
(() => {
  "use strict";

  const DATA = Object.freeze({
    origin: Object.freeze({ x: 0, y: 0 }),
    scale: Object.freeze({ x: 1, y: 1 }),
    canvas: Object.freeze({ width: 1200, height: 452 }),
    metrics: Object.freeze({
      radius: 12,
      smallRadius: 8,
      accent: 7,
      lineGap: 17,
      one: 1,
      half: .5
    }),
    panels: Object.freeze([
      {
        className: "stage-one",
        x: 20, y: 34, width: 1160, height: 156,
        label: "ЭТАП 1 · SL-CAI",
        labelX: 36, labelY: 61
      },
      {
        className: "stage-two",
        x: 20, y: 224, width: 1160, height: 190,
        label: "ЭТАП 2 · RLAIF",
        labelX: 36, labelY: 251
      }
    ]),
    nodes: Object.freeze([
      {
        x: 32, y: 86, width: 174, height: 58,
        accent: "accent-danger",
        lines: ["Вредный", "запрос"]
      },
      {
        x: 260, y: 86, width: 174, height: 58,
        accent: "accent-danger",
        lines: ["Первоначальный", "ответ"]
      },
      {
        x: 488, y: 86, width: 174, height: 58,
        accent: "accent-choice",
        lines: ["Критика", "по принципу"]
      },
      {
        x: 716, y: 86, width: 174, height: 58,
        accent: "accent-revision",
        lines: ["Исправленный", "ответ"]
      },
      {
        x: 944, y: 86, width: 174, height: 58,
        accent: "accent-revision",
        lines: ["SFT", "на исправлениях"]
      },
      {
        x: 32, y: 286, width: 154, height: 58,
        accent: "accent-danger",
        lines: ["Запрос"]
      },
      {
        x: 246, y: 266, width: 170, height: 46,
        accent: "accent-choice",
        lines: ["Ответ A"]
      },
      {
        x: 246, y: 336, width: 170, height: 46,
        accent: "accent-choice",
        lines: ["Ответ B"]
      },
      {
        x: 488, y: 286, width: 188, height: 58,
        accent: "accent-choice",
        lines: ["Конституционный", "выбор"]
      },
      {
        x: 744, y: 286, width: 192, height: 58,
        accent: "accent-choice",
        lines: ["Датасет", "предпочтений"]
      },
      {
        x: 1002, y: 286, width: 164, height: 58,
        accent: "accent-revision",
        lines: ["DPO", "или PPO"]
      }
    ]),
    arrows: Object.freeze([
      {
        points: [[206, 115], [252, 115]],
        head: [[252, 115], [241, 108], [241, 122]]
      },
      {
        points: [[434, 115], [480, 115]],
        head: [[480, 115], [469, 108], [469, 122]]
      },
      {
        points: [[662, 115], [708, 115]],
        head: [[708, 115], [697, 108], [697, 122]]
      },
      {
        points: [[890, 115], [936, 115]],
        head: [[936, 115], [925, 108], [925, 122]]
      },
      {
        points: [[186, 315], [220, 315], [220, 289], [238, 289]],
        head: [[238, 289], [227, 282], [227, 296]]
      },
      {
        points: [[186, 315], [220, 315], [220, 359], [238, 359]],
        head: [[238, 359], [227, 352], [227, 366]]
      },
      {
        points: [[416, 289], [452, 289], [452, 315], [480, 315]],
        head: [[480, 315], [469, 308], [469, 322]]
      },
      {
        points: [[416, 359], [452, 359], [452, 315], [480, 315]],
        head: [[480, 315], [469, 308], [469, 322]]
      },
      {
        points: [[676, 315], [736, 315]],
        head: [[736, 315], [725, 308], [725, 322]]
      },
      {
        points: [[936, 315], [994, 315]],
        head: [[994, 315], [983, 308], [983, 322]]
      }
    ]),
    bridge: Object.freeze({
      points: [[600, 190], [600, 218]],
      head: [[600, 218], [592, 207], [608, 207]],
      label: "исправленные примеры → безопаснее отправная точка",
      labelX: 618,
      labelY: 208
    }),
    results: Object.freeze([
      {
        className: "result-one",
        x: 716, y: 155, width: 402, height: 23,
        label: "РЕЗУЛЬТАТ: готовый улучшенный ответ",
        labelX: 917, labelY: 167
      },
      {
        className: "result-two",
        x: 744, y: 374, width: 422, height: 25,
        label: "РЕЗУЛЬТАТ: выбор лучшего из двух",
        labelX: 955, labelY: 387
      }
    ]),
    legend: Object.freeze({
      x: 32,
      y: 437,
      text: "Один набор принципов даёт разные сигналы: образец для SFT и предпочтение для DPO или PPO."
    })
  });

  const origin = Object.freeze(DATA.origin);
  const scale = Object.freeze(DATA.scale);
  const sx = x => origin.x + x * scale.x;
  const sy = y => origin.y + y * scale.y;

  const LABEL_PADDING = 8;
  const LINE_WIDTH = 2;
  const PANEL_LINE_WIDTH = 2;
  const FONT_SIZE = Object.freeze({
    stage: 17,
    node: 15,
    result: 14,
    bridge: 13,
    legend: 14
  });

  const svg = document.getElementById("map");
  const root = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");
  const NS = "http://www.w3.org/2000/svg";

  function element(name, attributes, className) {
    const item = document.createElementNS(NS, name);
    if (className) item.setAttribute("class", className);
    for (const [key, value] of Object.entries(attributes)) {
      item.setAttribute(key, String(value));
    }
    return item;
  }

  function rect(parent, item, className, radius, strokeWidth) {
    parent.appendChild(element("rect", {
      x: sx(item.x),
      y: sy(item.y),
      width: sx(item.width) - sx(DATA.origin.x),
      height: sy(item.height) - sy(DATA.origin.y),
      rx: sx(radius) - sx(DATA.origin.x),
      ry: sy(radius) - sy(DATA.origin.y),
      "stroke-width": strokeWidth
    }, className));
  }

  function text(parent, value, x, y, className, anchor, fontSize) {
    const label = element("text", {
      x: sx(x),
      y: sy(y),
      "text-anchor": anchor,
      "dominant-baseline": "middle",
      "font-size": fontSize
    }, className);
    label.textContent = value;
    parent.appendChild(label);
    return label;
  }

  function multiline(parent, item) {
    const label = element("text", {
      x: sx(item.x + item.width * DATA.metrics.half),
      y: sy(item.y + item.height * DATA.metrics.half),
      "text-anchor": "middle",
      "font-size": FONT_SIZE.node,
      "dominant-baseline": "middle"
    }, "node-label");

    item.lines.forEach((line, index) => {
      const offset = (
        index - (item.lines.length - DATA.metrics.one) * DATA.metrics.half
      ) * DATA.metrics.lineGap;
      const span = element("tspan", {
        x: sx(item.x + item.width * DATA.metrics.half),
        y: sy(item.y + item.height * DATA.metrics.half + offset)
      });
      span.textContent = line;
      label.appendChild(span);
    });

    parent.appendChild(label);
  }

  function points(values) {
    return values.map(point => `${sx(point[DATA.origin.x])},${sy(point[DATA.metrics.one])}`).join(" ");
  }

  function arrow(parent, item, linkedStage) {
    parent.appendChild(element("polyline", {
      points: points(item.points),
      "stroke-width": LINE_WIDTH
    }, linkedStage ? "arrow stage-link" : "arrow"));

    parent.appendChild(element("polygon", {
      points: points(item.head)
    }, linkedStage ? "arrow-head stage-link-head" : "arrow-head"));
  }

  try {
    rect(root, {
      x: DATA.origin.x,
      y: DATA.origin.y,
      width: DATA.canvas.width,
      height: DATA.canvas.height
    }, "canvas", DATA.origin.x, DATA.origin.x);

    DATA.panels.forEach(panel => {
      rect(root, panel, panel.className, DATA.metrics.radius, PANEL_LINE_WIDTH);
      text(
        root,
        panel.label,
        panel.labelX + LABEL_PADDING,
        panel.labelY,
        "stage-label",
        "start",
        FONT_SIZE.stage
      );
    });

    DATA.arrows.forEach(item => arrow(root, item, false));
    arrow(root, DATA.bridge, true);

    text(
      root,
      DATA.bridge.label,
      DATA.bridge.labelX,
      DATA.bridge.labelY,
      "bridge-label",
      "start",
      FONT_SIZE.bridge
    );

    DATA.nodes.forEach(node => {
      rect(root, node, "node", DATA.metrics.smallRadius, LINE_WIDTH);
      rect(root, {
        x: node.x,
        y: node.y,
        width: DATA.metrics.accent,
        height: node.height
      }, node.accent, DATA.metrics.smallRadius, DATA.origin.x);
      multiline(root, node);
    });

    DATA.results.forEach(result => {
      rect(
        root,
        result,
        result.className,
        DATA.metrics.smallRadius,
        LINE_WIDTH
      );
      text(
        root,
        result.label,
        result.labelX,
        result.labelY,
        "result-label",
        "middle",
        FONT_SIZE.result
      );
    });

    text(
      root,
      DATA.legend.text,
      DATA.legend.x + LABEL_PADDING,
      DATA.legend.y,
      "legend-label",
      "start",
      FONT_SIZE.legend
    );
  } catch (error) {
    root.replaceChildren();
    svg.hidden = true;
    fallback.hidden = false;
  }
})();
</script>
</body>
</html>
