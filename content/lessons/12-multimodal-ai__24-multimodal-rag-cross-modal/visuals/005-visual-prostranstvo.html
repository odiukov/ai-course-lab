<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Текст и картинка в одной точке</title>
<style>
  :root{
    --bg:#fbfaf7; --fg:#1d2127; --muted:#6b7280; --grid:#c9ccd2;
    --txt:#1f6feb; --img:#c2600b; --far:#7a7f89; --plot:#f2f1ec;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171c; --fg:#e7e9ee; --muted:#9aa1ad; --grid:#3a4048;
      --txt:#6ea8fe; --img:#e8a34a; --far:#8b919b; --plot:#191d23;
    }
  }
  html,body{margin:0}
  .card{background:var(--bg);color:var(--fg);padding:12px 14px 14px;
    font:14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
  .card h2{margin:0 0 2px;font-size:15px}
  .card p.sub{margin:0 0 8px;font-size:12.5px;color:var(--muted)}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg)}
  .fallback{font-size:13px;color:var(--fg)}
  text{font:13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--fg)}
  text.small{font-size:12px}
  text.note{font-size:12px;fill:var(--muted)}
  .axis{stroke:var(--grid);fill:none}
  .axfill{fill:var(--grid)}
  .plot{fill:var(--plot);stroke:var(--grid)}
  .box{fill:none}
  .box.t{stroke:var(--txt)} .box.i{stroke:var(--img)}
  .arr.t{stroke:var(--txt);fill:var(--txt)}
  .arr.i{stroke:var(--img);fill:var(--img)}
  .lt{fill:var(--txt)} .li{fill:var(--img)} .lf{fill:var(--far)}
  .pt.t{fill:var(--txt)} .pt.i{fill:var(--img)} .pt.f{fill:var(--far)}
  .chord{stroke:var(--fg);fill:none;stroke-dasharray:5 4;opacity:.55}
</style>
<div class="card">
  <h2>Текст и картинка в одной точке</h2>
  <p class="sub">Два энкодера — одно пространство эмбеддингов; близость меряется косинусом.</p>
  <div id="host"><noscript class="fallback">Схема: текстовый энкодер и энкодер картинок кладут фразу «кошка» и фото кошки в одно 2D-пространство; между этими точками косинус 0,82, до точки «фото самолёта» — 0,11.</noscript></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    /* ---- данные схемы (единственные литералы-числа сцены) ---- */
    var data = {
      plot:{x0:-0.4,y0:-0.4,x1:8.6,y1:6.9},
      axis:{x:8.6,y:6.9,tick:0.12,tx:[1,2,3,4,5,6,7,8],ty:[1,2,3,4,5,6]},
      head:{len:0.3,w:0.13},
      r:0.12,
      points:[
        {id:'text', x:3.4,y:6.0, cls:'t', lcls:'lt', label:'текст «кошка»', anchor:'middle', dx:0,  dy:-14},
        {id:'photo',x:3.9,y:4.7, cls:'i', lcls:'li', label:'фото кошки',    anchor:'start',  dx:12, dy:5},
        {id:'plane',x:7.4,y:1.2, cls:'f', lcls:'lf', label:'фото самолёта', anchor:'middle', dx:0,  dy:20}
      ],
      links:[
        {a:'text', b:'photo', at:0.5, label:'cos 0,82', anchor:'end',   dx:-12, dy:5},
        {a:'photo',b:'plane', at:0.5, label:'cos 0,11', anchor:'start', dx:14,  dy:-8}
      ],
      encoders:[
        {cls:'t', x0:-8.8,y0:4.9,x1:-4.0,y1:6.5,
         l1:'вход: «кошка»', l2:'энкодер текста',
         tail:{x:-4.0,y:5.7}, tip:{x:2.9,y:5.98}},
        {cls:'i', x0:-8.8,y0:1.6,x1:-4.0,y1:3.2,
         l1:'вход: фото кошки', l2:'энкодер картинок',
         tail:{x:-4.0,y:2.4}, tip:{x:3.05,y:4.32}}
      ],
      note:{x:8.4,y:-0.55,text:'у осей нет названий',anchor:'end'}
    };

    /* ---- одна пара функций перевода: origin + scale, дальше не меняются ---- */
    var origin = {x:362, y:280}, scale = 40;
    function sx(x){ return origin.x + x*scale; }
    function sy(y){ return origin.y - y*scale; }

    var W = 720, H = 316;           /* размеры холста */
    var LW = 1.4, AW = 1.1, FS = 13;/* толщина линий, размер шрифта */

    function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
    function P(p){ return sx(p.x)+','+sy(p.y); }
    function line(cls,a,b,w){
      return '<line class="'+cls+'" x1="'+sx(a.x)+'" y1="'+sy(a.y)+
             '" x2="'+sx(b.x)+'" y2="'+sy(b.y)+'" stroke-width="'+w+'"/>';
    }
    function head(cls,tail,tip){
      var dx=tip.x-tail.x, dy=tip.y-tail.y, L=Math.sqrt(dx*dx+dy*dy);
      var ux=dx/L, uy=dy/L, bx=tip.x-ux*data.head.len, by=tip.y-uy*data.head.len;
      var nx=-uy*data.head.w, ny=ux*data.head.w;
      return '<polygon class="'+cls+'" points="'+
        [P(tip),P({x:bx+nx,y:by+ny}),P({x:bx-nx,y:by-ny})].join(' ')+'"/>';
    }
    function label(cls,p,txt,anchor,dx,dy){
      return '<text class="'+cls+'" x="'+(sx(p.x)+dx)+'" y="'+(sy(p.y)+dy)+
             '" text-anchor="'+anchor+'" font-size="'+FS+'">'+esc(txt)+'</text>';
    }
    function byId(id){
      for(var i=0;i<data.points.length;i++) if(data.points[i].id===id) return data.points[i];
      throw new Error('нет точки '+id);
    }

    var s = '';

    /* пространство */
    s += '<rect class="plot" x="'+sx(data.plot.x0)+'" y="'+sy(data.plot.y1)+
         '" width="'+(sx(data.plot.x1)-sx(data.plot.x0))+
         '" height="'+(sy(data.plot.y0)-sy(data.plot.y1))+
         '" stroke-width="'+AW+'"/>';

    /* оси без названий + засечки */
    var ox = {x:data.plot.x0,y:0}, oy = {x:0,y:data.plot.y0};
    s += line('axis', ox, {x:data.axis.x,y:0}, AW);
    s += line('axis', oy, {x:0,y:data.axis.y}, AW);
    s += head('axfill', ox, {x:data.axis.x,y:0});
    s += head('axfill', oy, {x:0,y:data.axis.y});
    data.axis.tx.forEach(function(t){
      s += line('axis',{x:t,y:-data.axis.tick},{x:t,y:data.axis.tick},AW);
    });
    data.axis.ty.forEach(function(t){
      s += line('axis',{x:-data.axis.tick,y:t},{x:data.axis.tick,y:t},AW);
    });

    /* энкодеры и стрелки в пространство */
    data.encoders.forEach(function(e){
      s += '<rect class="box '+e.cls+'" x="'+sx(e.x0)+'" y="'+sy(e.y1)+
           '" width="'+(sx(e.x1)-sx(e.x0))+'" height="'+(sy(e.y0)-sy(e.y1))+
           '" rx="'+(sx(data.axis.tick)-sx(0))+'" stroke-width="'+LW+'"/>';
      var cx = (e.x0+e.x1)/2;
      s += label('small l'+e.cls, {x:cx, y:e.y1}, e.l1, 'middle', 0, 22);
      s += label('small l'+e.cls, {x:cx, y:e.y1}, e.l2, 'middle', 0, 48);
      s += line('arr '+e.cls, e.tail, e.tip, LW);
      s += head('arr '+e.cls, e.tail, e.tip);
    });

    /* хорды с косинусами */
    data.links.forEach(function(k){
      var a = byId(k.a), b = byId(k.b);
      s += line('chord', a, b, LW);
      var m = {x:a.x+(b.x-a.x)*k.at, y:a.y+(b.y-a.y)*k.at};
      s += label('small', m, k.label, k.anchor, k.dx, k.dy);
    });

    /* точки и их подписи */
    var rr = sx(data.r) - sx(0);
    data.points.forEach(function(p){
      s += '<circle class="pt '+p.cls+'" cx="'+sx(p.x)+'" cy="'+sy(p.y)+'" r="'+rr+'"/>';
      s += label(p.lcls, p, p.label, p.anchor, p.dx, p.dy);
    });

    s += label('note', data.note, data.note.text, data.note.anchor, 0, 0);

    host.innerHTML = '<svg viewBox="0 0 '+W+' '+H+
      '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="'+
      'Текст «кошка» и фото кошки попадают в одно пространство, косинус между ними 0,82, до фото самолёта 0,11">'+
      s+'</svg>';
  }catch(err){
    host.innerHTML = '<p class="fallback">Схема (не отрисовалась): текстовый энкодер берёт фразу «кошка», '+
      'энкодер картинок — фото кошки; обе стрелки ведут в одно 2D-пространство с безымянными осями. '+
      'Точка фразы и точка фото стоят рядом — косинус 0,82; до точки «фото самолёта» — 0,11.</p>';
  }
})();
</script>
</html>
