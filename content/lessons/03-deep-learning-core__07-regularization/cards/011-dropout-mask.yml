- concept: dropout независимо и случайно обнуляет выходы нейронов во время обучения
  question: Как dropout изменяет работу слоя во время обучения?
  explanation: Для каждого нейрона независимо генерируется бернуллиевская маска. Поэтому на разных проходах выключаются разные нейроны, а их фактическое количество может меняться.
  kind: choice
  options:
    - На каждом проходе обнуляет нейроны с самыми слабыми активациями
    - На каждом проходе независимо и случайно обнуляет выход каждого нейрона
    - Навсегда удаляет случайно выбранные нейроны из архитектуры
    - Добавляет одинаковый случайный шум ко всем выходам слоя
  correct: 1
  id: 011-dropout-mask-1
  fingerprint: e21befce
- concept: dropout препятствует co-adaptation и стимулирует избыточные представления
  question: Объясни своими словами, почему случайное выключение нейронов мешает co-adaptation.
  explanation: Co-adaptation возникает, когда нейроны чрезмерно полагаются на сигналы конкретных соседей. Dropout регулярно разрывает такие зависимости и заставляет сеть формировать более устойчивые, избыточные представления.
  kind: open
  reference: Нейрон не может рассчитывать, что конкретные соседние нейроны будут доступны на каждом проходе. Поэтому сети приходится распределять полезные признаки между разными нейронами и осваивать несколько способов получить нужный результат.
  id: 011-dropout-mask-2
  fingerprint: e8e4e7de
