  fingerprint: bf96bdad
- concept: небольшая экономия на часто вызываемой операции накапливается при большом масштабе
  question: Одна замена LayerNorm на RMSNorm экономит 0.9 микросекунды, а нормализация вызывается 840 миллионов раз. Сколько минут вычислений будет сэкономлено?
  explanation: Суммарная экономия равна 0.9 × 840 000 000 = 756 000 000 микросекунд, то есть 756 секунд или 12.6 минуты. Поэтому небольшой выигрыш одной нормализации становится существенным при огромном числе токенов и слоёв.
  kind: numeric
  answer: 12.6
  tolerance: 0.05
  id: 058-modern-llm-2
