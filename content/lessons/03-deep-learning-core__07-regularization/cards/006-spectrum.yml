- concept: при увеличении сложности модель проходит от недообучения через хорошую подгонку к переобучению
  question: Расположите состояния модели в порядке увеличения её сложности.
  explanation: Слишком простая модель недообучается. С ростом сложности она сначала достигает области хорошего обобщения, а затем может начать запоминать шум и переобучаться. В уроке этим состояниям соответствуют пары train/test 60% и 58%, 95% и 92%, 99,9% и 65%.
  kind: order
  items:
    - 'Недообучение: модели не хватает выразительности, чтобы уловить закономерность'
    - 'Хорошая подгонка: модель улавливает закономерность и обобщает на новые данные'
    - 'Переобучение: модель начинает подстраиваться под шум обучающих данных'
  id: 006-spectrum-1
  fingerprint: 4a31614d
- concept: чрезмерная регуляризация может привести к недообучению
  question: Модель не способна достаточно хорошо подогнаться даже под обучающие данные. Что, скорее всего, произойдёт при дополнительном усилении weight decay?
  explanation: Weight decay ограничивает эффективную сложность модели. Если модель уже слишком проста и плохо подгоняется под train, усиление ограничения обычно сдвигает её ещё дальше в сторону недообучения. Поэтому регуляризацию нужно настраивать, а не максимизировать.
  kind: choice
  options:
    - Недообучение усилится, потому что допустимая сложность модели станет ещё меньше
    - Модель обязательно перейдёт в область хорошей подгонки
    - Модель получит больше возможностей для запоминания обучающих примеров
    - Регуляризация перестанет влиять на обучение
  correct: 0
  id: 006-spectrum-2
  fingerprint: 8cc8cce1
