- concept: RMSNorm делит активации на их среднеквадратичный масштаб без вычитания среднего
  question: Какая последовательность операций соответствует RMSNorm?
  explanation: RMSNorm использует корень из среднего квадратов координат как общий делитель. Среднее не вычитается, обучаемая gamma сохраняется, а отдельного параметра beta обычно нет.
  kind: choice
  options:
    - Разделить координаты на их среднеквадратичный масштаб и применить обучаемое масштабирование
    - Вычесть среднее, разделить на стандартное отклонение и применить обучаемые масштабирование и сдвиг
    - Разделить каждую координату на её собственное абсолютное значение
    - Вычесть среднее и применить только обучаемый сдвиг
  correct: 0
  id: 041-rms-rule-1
  fingerprint: 72564df4
- concept: RMSNorm инвариантна к положительному масштабированию всего входа, но не к общему сдвигу координат
  question: Как две преобразующие операции над входным вектором влияют на результат RMSNorm, если пренебречь epsilon?
  explanation: При положительном масштабировании вход и его RMS увеличиваются в одинаковое число раз, поэтому множители сокращаются. Общий сдвиг меняет квадраты координат и их RMS, а центрирование в RMSNorm отсутствует.
  kind: choice
  options:
    - Умножение всего вектора на положительный скаляр не меняет нормализованный результат, а прибавление одной константы ко всем координатам обычно меняет его
    - Общий сдвиг не меняет результат, а положительное масштабирование всегда меняет его
    - Ни общий сдвиг, ни положительное масштабирование не меняют результат
    - Обе операции всегда влияют только на обучаемый параметр gamma
  correct: 0
  id: 041-rms-rule-2
  fingerprint: e74012e2
