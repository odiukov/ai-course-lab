- concept: готовая dropout-маска обнуляет отключённые активации, а сохранённые делятся на вероятность сохранения
  question: В режиме обучения даны активации [9, 15, 21]. Готовая маска сохраняет первые две активации и отключает последнюю. Вероятность отключения равна 0.4. Чему равна сумма элементов после применения inverted dropout?
  explanation: 'Вероятность сохранения равна 1 − p = 0.6. Сохранённые активации масштабируются: 9 / 0.6 + 15 / 0.6 = 40. Отключённая активация даёт ноль.'
  kind: numeric
  answer: 40
  tolerance: 0.001
  id: 014-apply-dropout-1
  fingerprint: 0e22ca1c
- concept: возврат копии списка в режиме оценки предотвращает нежелательное изменение исходных активаций через общий объект
  question: Какой вариант ветки режима оценки возвращает активации без dropout и при этом не создаёт общий изменяемый список с аргументом x?
  explanation: list(x) создаёт новый список с теми же значениями. return x возвращает тот же объект, поэтому последующее изменение результата может неожиданно изменить исходный список.
  kind: choice
  options:
    - return list(x)
    - return x
    - return [value / (1 - p) for value in x]
    - return [value * keep for value, keep in zip(x, mask)]
  correct: 0
  id: 014-apply-dropout-2
