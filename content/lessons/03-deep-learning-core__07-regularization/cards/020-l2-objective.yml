- concept: вклад отдельного веса в L2-штраф растёт квадратично с его величиной
  question: Модуль одного веса умножили на коэффициент k, не меняя остальные веса. Как изменится вклад этого веса в L2-штраф?
  explanation: В L2-штраф входит квадрат каждого веса. Поэтому после замены w на k·w его вклад становится квадратом k, умноженным на прежний вклад.
  kind: choice
  options:
    - Умножится на квадрат коэффициента k
    - Умножится на коэффициент k
    - Увеличится на постоянную величину, не зависящую от k
  correct: 0
  id: 020-l2-objective-1
  fingerprint: 5db5abcd
- concept: при одинаковом task loss L2 предпочитает модель с меньшей суммой квадратов весов
  question: Модели A и B имеют одинаковый task loss, но у модели A меньше сумма квадратов весов. Какая модель получит меньший total loss при положительном λ?
  explanation: При одинаковом task loss различается только регуляризационное слагаемое. Положительный λ делает total loss меньше у модели с меньшей суммой квадратов весов.
  kind: choice
  options:
    - Модель A
    - Модель B
    - Обе модели получат одинаковый total loss
  correct: 0
  id: 020-l2-objective-2
  fingerprint: 57a49ebc
