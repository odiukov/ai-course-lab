- concept: аугментация должна сохранять целевую метку обучающего примера
  question: Какое условие является ключевым при выборе преобразования для data augmentation?
  explanation: Аугментация создаёт изменённое представление того же объекта, поэтому его целевая метка должна оставаться корректной. Иначе в обучающие данные добавляется ошибочная разметка.
  kind: choice
  options:
    - Преобразование должно заметно увеличивать размер файла
    - После преобразования правильная целевая метка должна сохраняться
    - Преобразование должно полностью удалять фон
    - Каждый преобразованный пример должен получать новую метку
  correct: 1
  id: 046-augmentation-1
  fingerprint: 334cfcc7
- concept: аугментация повышает эффективное разнообразие, не создавая новых независимых наблюдений
  question: После случайных обрезок, отражений и изменений цвета модель видит множество вариантов исходных изображений. Как точнее всего описать полученную выборку?
  explanation: Разные представления усложняют запоминание конкретных входов и делают обучение разнообразнее, но не содержат столько же новой независимой информации, сколько реальные дополнительные наблюдения.
  kind: choice
  options:
    - Число независимых наблюдений стало равно числу всех созданных вариантов
    - Эффективное разнообразие выросло, но варианты остаются производными от исходных наблюдений
    - Аугментация заменила обучающую выборку тестовой
    - Преобразованные изображения больше не связаны с исходными данными
  correct: 1
