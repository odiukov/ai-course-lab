  fingerprint: dcda3e86
- concept: аугментация регуляризует модель, побуждая её учить признаки, инвариантные к допустимым преобразованиям
  question: Объясни своими словами, почему случайное применение допустимых преобразований к обучающим входам может улучшить обобщение модели.
  explanation: 'Аугментация действует как регуляризация данных: мешает модели привязаться к случайным деталям отдельных примеров и формирует инвариантность к преобразованиям, которые не меняют класс объекта.'
  kind: open
  reference: Конкретные детали входа меняются при каждой встрече, поэтому их запоминание становится ненадёжной стратегией. Модели выгоднее выделять устойчивые признаки, сохраняющиеся при преобразованиях и связанные с целевой меткой.
  id: 046-augmentation-3
  fingerprint: fa97f07c
