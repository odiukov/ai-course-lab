- concept: более гладкий ландшафт потерь позволяет безопаснее использовать высокий learning rate
  question: Объясни своими словами, почему BatchNorm часто позволяет обучать сеть с более высоким learning rate.
  explanation: Связь проходит через устойчивость градиента. Если его направление не меняется резко при небольшом движении по пространству весов, оптимизатор может делать более крупные шаги и быстрее сходиться.
  kind: open
  reference: 'BatchNorm делает ландшафт функции потерь более гладким: при изменении весов градиент меняется менее резко. Поэтому направление градиента остаётся полезным и после более крупного шага, уменьшая риск скачков loss и нестабильного обучения.'
