- concept: inverted dropout сохраняет математическое ожидание активации
  question: До dropout активация нейрона равна 15. При обучении применяется inverted dropout с вероятностью выпадения 0,25. Чему равно математическое ожидание выходной активации по множеству проходов?
  explanation: 'Нейрон сохраняется с вероятностью 0,75, а его значение при сохранении масштабируется до 20. Поэтому средний выход равен 0,75 × 20 = 15: inverted scaling компенсирует случайные выпадения в среднем.'
  kind: numeric
  answer: 15
  tolerance: 0.01
  id: 013-inverted-scaling-1
  fingerprint: 5d4eebe3
- concept: при inverted dropout на этапе инференса дополнительное масштабирование не требуется
  question: Модель обучалась с inverted dropout. Что следует делать с активациями при инференсе?
  explanation: Компенсация ожидаемого ослабления сигнала уже выполнялась во время обучения. Поэтому при инференсе dropout отключают, а исходные активации оставляют без изменений.
  kind: choice
  options:
    - Использовать их без dropout и без дополнительного масштабирования
    - Продолжать случайно обнулять активации, но отключить масштабирование
    - Уменьшать все активации пропорционально вероятности сохранения
    - Увеличивать все активации пропорционально вероятности выпадения
