- concept: обобщение означает перенос выученной закономерности на новые данные
  question: Какое наблюдение лучше всего показывает, что модель выучила переносимую закономерность, а не просто запомнила обучающую выборку?
  explanation: Обобщение проверяется на новых данных. Низкая ошибка на train сама по себе совместима с запоминанием шума и не доказывает, что найденная закономерность переносится.
  kind: choice
  options:
    - Модель сохраняет высокое качество на отложенных примерах, которых не видела при обучении
    - Модель достигла почти нулевой ошибки на обучающей выборке
    - В модели больше параметров, чем обучающих примеров
    - Обучение модели продолжалось много эпох
  correct: 0
  id: 008-good-fit-1
  fingerprint: 82a7f7a4
- concept: регуляризация может улучшить обобщение ценой менее точной подгонки к обучающим данным
  question: Почему после усиления регуляризации качество модели на обучающей выборке иногда немного снижается, а на новых данных растёт?
  explanation: Цель регуляризации — не максимальная подгонка к train, а снижение чувствительности к его случайным деталям. Небольшая потеря качества на обучении может сопровождаться улучшением качества на test.
  kind: open
  reference: Регуляризация ограничивает способность модели подстраиваться под шум и случайные особенности обучающей выборки. Из-за этого подгонка к train может стать менее точной, зато модель лучше улавливает устойчивую закономерность и переносит её на новые данные.
  id: 008-good-fit-2
  fingerprint: b1f36539
