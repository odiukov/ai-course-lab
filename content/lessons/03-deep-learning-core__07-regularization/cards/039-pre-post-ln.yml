- concept: Pre-LN и Post-LN различаются положением LayerNorm относительно преобразования и остаточного сложения
  question: Пусть x — вход трансформерного блока, а F — attention- или feed-forward-преобразование. Какая пара формул правильно описывает Post-LN и Pre-LN?
  explanation: В Post-LN нормализуется результат остаточного сложения x + F(x). В Pre-LN нормализация применяется ко входу преобразования F, а исходный x добавляется по остаточному пути без предварительной нормализации.
  kind: choice
  options:
    - 'Post-LN: y = x + LN(F(x)); Pre-LN: y = F(x) + LN(x)'
    - 'Post-LN: y = LN(x + F(x)); Pre-LN: y = x + F(LN(x))'
    - 'Post-LN: y = x + F(LN(x)); Pre-LN: y = LN(x + F(x))'
  correct: 1
  id: 039-pre-post-ln-1
  fingerprint: 379fc2c2
- concept: прямой остаточный путь в Pre-LN облегчает распространение градиента через глубокий трансформер
  question: Почему глубокий трансформер с Pre-LN обычно обучается устойчивее, чем аналогичная модель с Post-LN?
  explanation: Ключевое отличие связано не со свойствами самой LayerNorm, а с маршрутом остаточного потока. В Pre-LN градиент может распространяться по прямому остаточному пути, что особенно важно при большой глубине модели.
  kind: open
  reference: В Pre-LN остаточный поток x проходит между блоками напрямую, а LayerNorm применяется только перед преобразованием F. Это создаёт более прямой маршрут для сигнала и градиента через множество блоков, поэтому ранним слоям проще получать обучающий сигнал.
  id: 039-pre-post-ln-2
  fingerprint: ef7faa85
