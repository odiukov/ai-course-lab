- concept: на инференсе BatchNorm использует накопленные при обучении статистики
  question: Обученная модель с BatchNorm обрабатывает отдельный входной пример. Какие среднее и дисперсию должен использовать слой?
  explanation: В режиме инференса BatchNorm не вычисляет статистики по текущим входам, а использует накопленные скользящие оценки. Благодаря этому результат не зависит от состава входного батча.
  kind: choice
  options:
    - Статистики, вычисленные только по этому входному примеру
    - Статистики последнего обучающего мини-батча без усреднения
    - Скользящие оценки, накопленные во время обучения
    - Значения обучаемых параметров gamma и beta
  correct: 2
  id: 032-running-stats-1
  fingerprint: 37026ae0
- concept: скользящая статистика BatchNorm обновляется экспоненциальным усреднением старой оценки и статистики нового батча
  question: Текущее скользящее среднее BatchNorm равно 8.0. Среднее нового мини-батча равно 20.0. При обновлении сохраняется 75% старой оценки и добавляется 25% новой. Чему станет равно скользящее среднее?
  explanation: Новая оценка равна 0.75 × 8.0 + 0.25 × 20.0 = 11.0. Такие статистики обновляются по правилу экспоненциального среднего, а не градиентным спуском.
  kind: numeric
  answer: 11
  tolerance: 0.01
  id: 032-running-stats-2
  fingerprint: 90e80ffe
- concept: режим инференса устраняет зависимость предсказания BatchNorm от случайного состава батча
  question: Почему модель с BatchNorm необходимо переключать из режима обучения в режим инференса перед оценкой или использованием в приложении?
  explanation: Переключение режима меняет источник статистик BatchNorm. Если оставить тренировочный режим, предсказания могут зависеть от состава и размера батча, а накопленные оценки продолжат изменяться.
  kind: open
  reference: В режиме обучения BatchNorm вычисляет среднее и дисперсию по текущему мини-батчу, поэтому выход для примера зависит от его соседей. В режиме инференса слой использует фиксированные скользящие оценки, накопленные при обучении, и не обновляет их.
  id: 032-running-stats-3
  fingerprint: 3a45c36a
