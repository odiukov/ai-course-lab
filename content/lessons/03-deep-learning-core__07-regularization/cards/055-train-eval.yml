- concept: model.eval() и torch.no_grad() решают независимые задачи при инференсе
  question: Какой фрагмент подходит для обычного инференса, если нужно переключить Dropout и BatchNorm в режим оценки и не строить граф вычислений для градиентов?
  explanation: model.eval() меняет поведение зависимых от режима слоёв, а torch.no_grad() отключает запись операций для вычисления градиентов и экономит память. Ни одна из этих команд не заменяет другую.
  kind: choice
  options:
    - model.train(); prediction = model(x)
    - model.eval(); prediction = model(x)
    - 'with torch.no_grad(): model.train(); prediction = model(x)'
    - 'model.eval(); with torch.no_grad(): prediction = model(x)'
