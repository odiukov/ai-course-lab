- concept: RMSNorm сохраняет обучаемое масштабирование, но отказывается от обучаемого сдвига
  question: В LayerNorm после нормализации применяются обучаемые параметры масштаба γ и сдвига β. Какой набор аффинных параметров обычно используется в RMSNorm?
  explanation: RMSNorm умножает нормализованные активации на обучаемый масштаб γ, но не добавляет сдвиг β. Это соответствует её упрощённой формуле y = γx / RMS(x).
  kind: choice
  options:
    - Только γ
    - Только β
    - И γ, и β
    - Ни γ, ни β
  correct: 0
  id: 043-rms-tradeoff-1
  fingerprint: 48c61142
- concept: выбор RMSNorm вместо LayerNorm является эмпирическим компромиссом между контролем активаций и стоимостью вычислений
  question: Почему близкое качество RMSNorm и LayerNorm на многих трансформерах нельзя считать доказательством их полной взаимозаменяемости во всех нейросетях?
  explanation: RMSNorm контролирует среднеквадратичный масштаб, но оставляет среднее активаций неконтролируемым. Поэтому сохранение качества — практическое наблюдение, которое следует проверять для конкретной архитектуры и задачи.
  kind: open
  reference: Сходство качества установлено экспериментально для ряда архитектур и задач, а не выведено как универсальная математическая гарантия. RMSNorm не центрирует активации, поэтому в модели, чувствительной к общему сдвигу значений, её поведение может отличаться от LayerNorm. Её выбирают, когда эмпирическая экономия вычислений оправдывает отказ от центрирования.
  id: 043-rms-tradeoff-2
  fingerprint: cfe283b1
