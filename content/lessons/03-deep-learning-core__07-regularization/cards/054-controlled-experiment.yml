- concept: парные сравнения на нескольких начальных состояниях отделяют устойчивый эффект регуляризации от случайности обучения
  question: Как организовать несколько запусков базовой и регуляризованной моделей, чтобы оценить устойчивость эффекта регуляризации к случайной инициализации?
  explanation: Совпадающая инициализация внутри каждой пары делает регуляризацию главным различием между моделями. Разные состояния между повторами показывают, сохраняется ли эффект, а не возник ли он из-за одного удачного набора начальных весов.
  kind: open
  reference: Нужно использовать разные начальные состояния между повторами, но внутри каждого повтора давать обеим моделям одинаковое начальное состояние и одинаковые остальные условия. Затем следует сравнить парные изменения тестового качества и разрыва между обучением и тестом по всем повторам.
