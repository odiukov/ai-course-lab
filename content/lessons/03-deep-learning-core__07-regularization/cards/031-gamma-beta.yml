- concept: выход BatchNorm после нормализации вычисляется обучаемым масштабированием и сдвигом
  question: Для нормализованной активации x_hat = 0.25 обучены параметры gamma = 8 и beta = -7. Чему равен выход y?
  explanation: 'Нужно подставить значения в y = gamma * x_hat + beta. Получается y = -5: gamma меняет масштаб нормализованной активации, а beta добавляет сдвиг.'
  kind: numeric
  answer: -5
  tolerance: 0.001
  id: 031-gamma-beta-1
  fingerprint: bcff3d0a
- concept: обучаемые gamma и beta устраняют жёсткое ограничение на масштаб и средний уровень активаций
  question: Объясни своими словами, зачем BatchNorm применяет обучаемые gamma и beta после нормализации, а не передаёт x_hat следующему слою без изменений.
  explanation: Нормализация создаёт стандартную отправную шкалу, но она не всегда оптимальна для следующего слоя. Gamma управляет масштабом, beta — сдвигом, поэтому сеть сохраняет свободу выбрать подходящее распределение активаций.
  kind: open
  reference: Без gamma и beta каждый признак был бы принудительно оставлен в стандартной шкале. Обучаемые gamma и beta позволяют сети выбрать полезные для задачи масштаб и сдвиг, включая возможность фактически отменить нормализацию.
  id: 031-gamma-beta-2
  fingerprint: 0018125f
