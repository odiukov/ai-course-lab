- concept: BatchNorm вырождается на мини-батче из единственного примера
  question: Почему BatchNorm не может получить содержательную статистику по мини-батчу, состоящему из единственного примера?
  explanation: У единственного наблюдения нет разброса относительно других наблюдений. Поэтому среднее и дисперсия такого батча не дают BatchNorm надёжной основы для нормализации.
  kind: open
  reference: Среднее такого батча совпадает с самой активацией, а дисперсия внутри батча равна нулю. Добавка eps предотвращает деление на ноль, но не создаёт отсутствующую информацию о распределении активаций.
  id: 033-small-batches-2
  fingerprint: ea96cd6b
