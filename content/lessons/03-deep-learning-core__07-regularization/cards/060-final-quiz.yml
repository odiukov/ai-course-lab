- concept: регуляризация включает не только явные штрафы в функции потерь
  question: Какое определение регуляризации наиболее полное?
  explanation: Регуляризацией могут служить weight decay, dropout, нормализация, аугментация и early stopping. Не все эти методы добавляют явный штраф к функции потерь или меняют архитектуру.
  kind: choice
  options:
    - Только добавление штрафа за большие веса к функции потерь
    - Любая техника, ограничивающая эффективную сложность модели ради лучшего обобщения
    - Только уменьшение числа слоёв и параметров модели
    - Любое изменение, повышающее точность на обучающей выборке
  correct: 1
  id: 060-final-quiz-1
  fingerprint: cf73e4f0
- concept: dropout можно интерпретировать как обучение ансамбля совместно использующих веса подсетей
  question: Объясни своими словами, почему dropout часто сравнивают с обучением ансамбля моделей.
  explanation: Случайные маски активируют разные конфигурации сети, поэтому обучение затрагивает множество подсетей с общими параметрами. Это и создаёт эффект, похожий на ансамблирование.
  kind: open
  reference: Каждая случайная dropout-маска задаёт свою подсеть. Во время обучения множество таких подсетей совместно используют веса, а результат полной сети на инференсе приближает их совокупный прогноз.
  id: 060-final-quiz-2
  fingerprint: caf57f87
- concept: early stopping можно сочетать с другими способами регуляризации
  question: Модель уже обучается с dropout и weight decay. Какое утверждение об early stopping верно?
  explanation: Early stopping не исключает другие методы регуляризации. Оно ограничивает длительность подгонки по поведению валидационной ошибки и часто применяется вместе с dropout или weight decay.
  kind: choice
  options:
    - Его нельзя применять одновременно с другими регуляризаторами
    - Оно остаётся дополнительным регуляризатором и может остановить обучение по валидационной ошибке
    - Оно автоматически заменяет dropout и weight decay
    - Оно должно ориентироваться только на ошибку обучающей выборки
  correct: 1
  id: 060-final-quiz-3
  fingerprint: 2595ab7b
