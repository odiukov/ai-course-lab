- concept: в Adam L2-поправка внутри градиента адаптивно масштабируется вместе с градиентом задачи
  question: Два параметра имеют одинаковое значение, но разную историю градиентов. L2-поправку прибавляют к градиенту задачи перед обновлением Adam. Почему параметры могут получить разное относительное сжатие?
  explanation: Если добавить λw к градиенту задачи, Adam обработает оба слагаемых как единый сигнал. Масштабирование по накопленной истории градиентов затронет и регуляризатор, поэтому фактическая сила сжатия станет различаться между параметрами.
  kind: choice
  options:
    - Adam вычисляет коэффициент регуляризации отдельно для каждого параметра
    - Адаптивный предобуславливатель Adam масштабирует сумму градиента задачи и L2-поправки с учётом истории каждого параметра
    - Производная L2-поправки не зависит от значения параметра
    - Adam применяет L2-поправку только к параметру с меньшим градиентом
  correct: 1
  id: 025-adamw-link-1
  fingerprint: d698076f
- concept: AdamW применяет адаптивное обучение и weight decay как раздельные операции
  question: Расположите действия одного шага AdamW в логическом порядке.
  explanation: AdamW использует историю градиентов для адаптивного шага по функции потерь, а weight decay применяет непосредственно к параметрам отдельно. Поэтому адаптивное масштабирование Adam не изменяет заданную силу регуляризации.
  kind: order
  items:
    - Вычислить градиент функции потерь по текущим параметрам
    - Обновить оценки моментов градиента
    - Вычислить и применить адаптивное изменение параметров
    - Отдельно уменьшить параметры согласно коэффициенту weight decay
  id: 025-adamw-link-2
  fingerprint: dc37bfca
- concept: L2-регуляризация и decoupled weight decay эквивалентны для обычного SGD, но не для Adam
  question: Для какого оптимизатора добавление λw к градиенту даёт то же обновление, что и отдельное пропорциональное уменьшение весов?
  explanation: В обычном SGD оба способа приводят к одному и тому же слагаемому в обновлении параметров. В Adam добавленная к градиенту L2-поправка проходит через адаптивное масштабирование, поэтому эквивалентность нарушается; для отдельного decay используют AdamW.
  kind: choice
  options:
    - Для обычного SGD с единым learning rate
    - Для Adam с покоординатной адаптацией шага
    - Для любого адаптивного оптимизатора
    - Только для AdamW
  correct: 0
