<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пять monocular-признаков на одной сцене</title>
<style>
:root{
  color-scheme:light dark;
  --page:ivory;
  --bg:snow;
  --ink:midnightblue;
  --muted:slategray;
  --sky:lightcyan;
  --hill-far:lightsteelblue;
  --hill-near:cadetblue;
  --building:linen;
  --building-side:tan;
  --window:steelblue;
  --road:gainsboro;
  --walk:silver;
  --texture:gray;
  --accent:darkorange;
  --person:darkslateblue;
  --car:firebrick;
  --cycle:seagreen;
  --panel:floralwhite;
  --summary:aliceblue;
}
@media (prefers-color-scheme:dark){
  :root{
    --page:black;
    --bg:midnightblue;
    --ink:whitesmoke;
    --muted:lightgray;
    --sky:darkslateblue;
    --hill-far:slategray;
    --hill-near:darkcyan;
    --building:dimgray;
    --building-side:darkslategray;
    --window:lightsteelblue;
    --road:darkslategray;
    --walk:slategray;
    --texture:lightgray;
    --accent:orange;
    --person:plum;
    --car:tomato;
    --cycle:mediumaquamarine;
    --panel:darkslategray;
    --summary:darkslateblue;
  }
}
html,body{background:var(--page);color:var(--ink);font-family:system-ui,sans-serif}
.title{background:var(--bg);font-size:20px;text-align:center}
svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg)}
.scene-line,.detail,.guide,.leader,.texture,.figure-line{
  fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round
}
.scene-line{stroke:var(--ink);stroke-width:2px}
.detail{stroke:var(--muted);stroke-width:1.5px}
.guide{stroke:var(--accent);stroke-width:2.5px}
.texture{stroke:var(--texture);stroke-width:1.5px}
.leader{stroke:var(--ink);stroke-width:1.5px}
.figure-line{stroke:var(--person);stroke-width:3px}
.label{fill:var(--ink);font-size:15px}
.small{fill:var(--muted);font-size:13px}
.callout{fill:var(--panel);stroke:var(--ink);stroke-width:1.5px}
.target{fill:var(--accent);stroke:var(--panel);stroke-width:1.5px}
</style>
</head>
<body>
<div class="title" id="diagram-title">Пять monocular-признаков на одной сцене</div>
<svg id="diagram" viewBox="0 0 1000 500" width="1000" height="500"
     preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="diagram-title diagram-desc">
  <desc id="diagram-desc">Городская улица показывает перспективу, градиент текстуры, перекрытие, знакомый размер и атмосферную дымку.</desc>
</svg>
<script>
const diagram=Object.freeze([
  {x:0,y:0},
  {x:1,y:1},
  {
    frame:{x1:38,y1:62,x2:962,y2:400},
    sky:{x1:40,y1:64,x2:960,y2:398},
    hills:[
      {cls:"hill-far",pts:[[360,157],[405,124],[447,145],[492,112],[540,146],[588,119],[650,158]]},
      {cls:"hill-near",pts:[[330,166],[388,142],[430,157],[478,137],[520,161],[570,139],[625,164],[675,153]]}
    ],
    road:[[438,157],[574,157],[900,398],[112,398]],
    walks:[
      [[40,325],[438,157],[112,398],[40,398]],
      [[574,157],[960,319],[960,398],[900,398]]
    ],
    buildings:[
      {cls:"building",pts:[[40,78],[245,78],[438,157],[40,327]]},
      {cls:"building-side",pts:[[245,78],[390,101],[438,157]]},
      {cls:"building",pts:[[574,157],[760,88],[960,88],[960,321]]},
      {cls:"building-side",pts:[[574,157],[650,114],[760,88],[760,272]]}
    ],
    facadeLines:[
      [40,120,438,157],[40,205,438,157],[40,286,438,157],
      [574,157,960,126],[574,157,960,213],[574,157,960,299],
      [245,78,245,240],[760,88,760,272]
    ],
    windows:[
      {x1:74,y1:103,x2:133,y2:150},{x1:159,y1:98,x2:216,y2:139},
      {x1:72,y1:181,x2:130,y2:236},{x1:157,y1:165,x2:214,y2:215},
      {x1:817,y1:112,x2:868,y2:157},{x1:889,y1:108,x2:939,y2:151},
      {x1:815,y1:185,x2:866,y2:237},{x1:889,y1:177,x2:938,y2:226}
    ],
    guides:[
      [438,157,112,398],[574,157,900,398],
      [438,157,40,286],[574,157,960,299]
    ],
    texture:[
      [430,170,590,170],[414,181,607,181],[393,194,629,194],
      [365,211,658,211],[330,233,693,233],[286,261,738,261],
      [231,296,793,296],[162,341,849,341],[126,383,894,383],
      [510,158,210,398],[510,158,330,398],[510,158,450,398],
      [510,158,570,398],[510,158,690,398],[510,158,810,398]
    ],
    distantCar:{
      body:[[493,174],[526,174],[532,185],[487,185]],
      top:[[499,168],[518,168],[526,174],[493,174]],
      wheels:[{x:495,y:186,r:3},{x:524,y:186,r:3}]
    },
    parkedCar:{
      body:[[246,268],[259,245],[326,238],[359,263],[362,286],[238,286]],
      glass:[[269,248],[287,241],[322,243],[342,262],[263,262]],
      wheels:[{x:263,y:287,r:13},{x:337,y:287,r:13}]
    },
    cyclist:{
      wheels:[{x:303,y:302,r:19},{x:362,y:302,r:19}],
      head:{x:327,y:245,r:8},
      segments:[
        [327,253,319,274],[319,274,303,302],[319,274,347,281],
        [347,281,362,302],[303,302,338,301],[338,301,319,274],
        [319,260,348,267],[348,267,362,302]
      ]
    },
    people:[
      {
        head:{x:590,y:184,r:4},
        segments:[[590,188,590,203],[590,193,583,200],[590,193,597,199],[590,203,585,215],[590,203,596,215]]
      },
      {
        head:{x:769,y:276,r:11},
        segments:[[769,287,769,326],[769,297,749,313],[769,297,789,312],[769,326,754,360],[769,326,785,360]]
      }
    ],
    lamps:[
      {head:[409,171,421,171],post:[415,171,415,209]},
      {head:[369,190,389,190],post:[379,190,379,248]},
      {head:[310,221,340,221],post:[325,221,325,307]},
      {head:[621,181,637,181],post:[629,181,629,229]},
      {head:[674,207,698,207],post:[686,207,686,279]}
    ],
    vanishing:{x:510,y:157,r:5},
    calls:[
      {
        box:{x1:367,y1:19,x2:653,y2:53,round:9},
        text:{x:510,y:36,value:"Перспектива: сходящиеся линии"},
        line:[510,53,510,157],target:{x:510,y:157,r:5}
      },
      {
        box:{x1:688,y1:72,x2:945,y2:106,round:9},
        text:{x:816,y:89,value:"Атмосферная дымка"},
        line:[688,98,574,137],target:{x:574,y:137,r:4}
      },
      {
        box:{x1:48,y1:184,x2:275,y2:218,round:9},
        text:{x:161,y:201,value:"Перекрытие объектов"},
        line:[275,210,320,269],target:{x:320,y:269,r:4}
      },
      {
        box:{x1:718,y1:225,x2:944,y2:259,round:9},
        text:{x:831,y:242,value:"Знакомый размер"},
        line:[718,242,590,198],target:{x:590,y:198,r:4}
      },
      {
        box:{x1:48,y1:344,x2:273,y2:378,round:9},
        text:{x:160,y:361,value:"Градиент текстуры"},
        line:[273,352,397,296],target:{x:397,y:296,r:4}
      }
    ],
    summary:{
      box:{x1:154,y1:424,x2:846,y2:481,round:12},
      main:{x:500,y:445,value:"Пять подсказок согласуются"},
      sub:{x:500,y:466,value:"маленький автомобиль находится далеко"}
    },
    fallback:{x:500,y:250,value:"Схема должна была показать пять согласующихся признаков глубины."}
  }
]);
const [origin,scale,s]=diagram;
Object.freeze(origin);
Object.freeze(scale);

function sx(x){return origin.x+x*scale.x}
function sy(y){return origin.y+y*scale.y}

const svg=document.getElementById("diagram");
const ns="http://www.w3.org/2000/svg";

function el(tag,attrs,text){
  const node=document.createElementNS(ns,tag);
  Object.entries(attrs).forEach(([key,value])=>node.setAttribute(key,String(value)));
  if(text!==undefined)node.textContent=text;
  return node;
}
function add(parent,tag,attrs,text){
  const node=el(tag,attrs,text);
  parent.appendChild(node);
  return node;
}
function rect(parent,b,cls){
  return add(parent,"rect",{
    x:sx(b.x1),y:sy(b.y1),
    width:sx(b.x2)-sx(b.x1),height:sy(b.y2)-sy(b.y1),
    rx:b.round===undefined?undefined:Math.abs(sx(b.round)-sx(origin.x)),
    ry:b.round===undefined?undefined:Math.abs(sy(b.round)-sy(origin.y)),
    class:cls
  });
}
function line(parent,a,cls){
  return add(parent,"line",{x1:sx(a[0]),y1:sy(a[1]),x2:sx(a[2]),y2:sy(a[3]),class:cls});
}
function polygon(parent,pts,cls){
  return add(parent,"polygon",{points:pts.map(p=>`${sx(p[0])},${sy(p[1])}`).join(" "),class:cls});
}
function circle(parent,c,cls){
  return add(parent,"circle",{
    cx:sx(c.x),cy:sy(c.y),
    r:Math.abs(sx(c.x+c.r)-sx(c.x)),class:cls
  });
}
function text(parent,t,cls,anchor){
  return add(parent,"text",{
    x:sx(t.x),y:sy(t.y),class:cls,
    "text-anchor":anchor,"dominant-baseline":"middle"
  },t.value);
}
function drawCar(parent,car,cls){
  polygon(parent,car.body,cls);
  if(car.top)polygon(parent,car.top,"window");
  if(car.glass)polygon(parent,car.glass,"window");
  car.wheels.forEach(w=>circle(parent,w,"wheel"));
}
function drawPerson(parent,p){
  circle(parent,p.head,"person-fill");
  p.segments.forEach(seg=>line(parent,seg,"figure-line"));
}

try{
  const world=add(svg,"g",{"aria-label":"Городская сцена"});
  rect(world,s.sky,"sky");
  s.hills.forEach(h=>polygon(world,h.pts,h.cls));
  s.buildings.forEach(b=>polygon(world,b.pts,b.cls));
  s.windows.forEach(w=>rect(world,w,"window"));
  s.walks.forEach(w=>polygon(world,w,"walk"));
  polygon(world,s.road,"road");
  s.facadeLines.forEach(a=>line(world,a,"detail"));
  s.texture.forEach(a=>line(world,a,"texture"));
  s.guides.forEach(a=>line(world,a,"guide"));
  s.lamps.forEach(l=>{
    line(world,l.post,"scene-line");
    line(world,l.head,"scene-line");
  });
  drawCar(world,s.distantCar,"car");
  drawCar(world,s.parkedCar,"car");
  s.cyclist.wheels.forEach(w=>circle(world,w,"cycle-wheel"));
  s.cyclist.segments.forEach(a=>line(world,a,"cycle-line"));
  circle(world,s.cyclist.head,"cycle-fill");
  s.people.forEach(p=>drawPerson(world,p));
  circle(world,s.vanishing,"target");

  const labels=add(svg,"g",{"aria-label":"Подписи признаков"});
  s.calls.forEach(c=>{
    line(labels,c.line,"leader");
    circle(labels,c.target,"target");
    rect(labels,c.box,"callout");
    text(labels,c.text,"label","middle");
  });

  const conclusion=add(svg,"g",{"aria-label":"Вывод"});
  rect(conclusion,s.summary.box,"summary-box");
  text(conclusion,s.summary.main,"label","middle");
  text(conclusion,s.summary.sub,"small","middle");
  rect(svg,s.frame,"frame");
}catch(error){
  while(svg.lastChild&&svg.lastChild.tagName!=="desc")svg.removeChild(svg.lastChild);
  text(svg,s.fallback,"label","middle");
}
</script>
<style>
.sky{fill:var(--sky)}
.hill-far{fill:var(--hill-far)}
.hill-near{fill:var(--hill-near)}
.building{fill:var(--building);stroke:var(--ink);stroke-width:2px}
.building-side{fill:var(--building-side);stroke:var(--ink);stroke-width:2px}
.window{fill:var(--window);stroke:var(--ink);stroke-width:1.5px}
.walk{fill:var(--walk);stroke:var(--ink);stroke-width:2px}
.road{fill:var(--road);stroke:var(--ink);stroke-width:2px}
.car{fill:var(--car);stroke:var(--ink);stroke-width:2px}
.wheel{fill:var(--ink);stroke:var(--bg);stroke-width:1.5px}
.person-fill{fill:var(--person);stroke:var(--bg);stroke-width:1.5px}
.cycle-wheel,.cycle-line{fill:none;stroke:var(--cycle);stroke-width:3px}
.cycle-fill{fill:var(--cycle);stroke:var(--bg);stroke-width:1.5px}
.summary-box{fill:var(--summary);stroke:var(--accent);stroke-width:2px}
.frame{fill:none;stroke:var(--ink);stroke-width:2px}
</style>
</body>
</html>
