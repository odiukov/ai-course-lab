<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Как пиксель, глубина и параметры камеры задают 3D-точку</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f9fc;
      --panel: #ffffff;
      --panel-strong: #eef3fb;
      --text: #172033;
      --muted: #526079;
      --line: #91a0b8;
      --pixel: #e15b39;
      --depth: #168b72;
      --camera: #7657c8;
      --result: #1769aa;
      --result-fill: #e5f3ff;
      --point-ring: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .figure {
      width: 100%;
      background: var(--bg);
    }

    h2 {
      margin: 0;
      padding: 14px 20px 8px;
      font-size: 20px;
      line-height: 1.2;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 455px;
      background: var(--bg);
    }

    .panel {
      fill: var(--panel);
      stroke: var(--line);
      stroke-width: 1.5;
    }

    .formula-panel {
      fill: var(--panel-strong);
      stroke: var(--result);
      stroke-width: 1.5;
    }

    .frame {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.5;
    }

    .guide {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.5;
    }

    .axis {
      fill: none;
      stroke: var(--text);
      stroke-width: 2;
    }

    .ray {
      fill: none;
      stroke: var(--result);
      stroke-width: 3;
    }

    .measure {
      fill: none;
      stroke: var(--result);
      stroke-width: 2;
    }

    .flow {
      fill: none;
      stroke: var(--line);
      stroke-width: 2;
    }

    .arrow-head {
      fill: var(--line);
    }

    .axis-head {
      fill: var(--text);
    }

    .ray-head {
      fill: var(--result);
    }

    .pixel-mark {
      fill: var(--pixel);
      stroke: var(--point-ring);
      stroke-width: 2;
    }

    .center-mark {
      fill: var(--panel);
      stroke: var(--camera);
      stroke-width: 2;
    }

    .camera-body {
      fill: var(--text);
      stroke: var(--text);
      stroke-width: 1.5;
    }

    .camera-lens {
      fill: var(--panel);
      stroke: var(--text);
      stroke-width: 1.5;
    }

    .result-point {
      fill: var(--result);
      stroke: var(--point-ring);
      stroke-width: 3;
    }

    text {
      fill: var(--text);
      font-size: 15px;
    }

    .heading {
      font-size: 13px;
      font-weight: bold;
      letter-spacing: .06em;
    }

    .pixel-text {
      fill: var(--pixel);
    }

    .depth-text {
      fill: var(--depth);
    }

    .camera-text {
      fill: var(--camera);
    }

    .result-text {
      fill: var(--result);
      font-weight: bold;
    }

    .muted {
      fill: var(--muted);
      font-size: 13px;
    }

    .formula {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 14px;
    }

    .small {
      font-size: 12px;
    }

    .fallback {
      display: none;
      margin: 12px 20px 20px;
      padding: 16px;
      border: 2px solid var(--result);
      background: var(--panel);
      color: var(--text);
      font-size: 16px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111722;
        --panel: #192231;
        --panel-strong: #1c2a3d;
        --text: #eef3fb;
        --muted: #b4bfd1;
        --line: #63718a;
        --pixel: #ff8665;
        --depth: #4bd0ae;
        --camera: #b09af2;
        --result: #65b9f2;
        --result-fill: #19364c;
        --point-ring: #111722;
      }
    }
  </style>
</head>
<body>
  <main class="figure" aria-labelledby="diagram-title">
    <h2 id="diagram-title">Как пиксель, глубина и параметры камеры задают 3D-точку</h2>
    <svg id="diagram" viewBox="0 0 960 420" width="960" height="420"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-label="Пиксель 240, 120 с глубиной 2 метра и параметрами камеры преобразуется в точку X 0,5 метра, Y 0, Z 2 метра"></svg>
    <p id="fallback" class="fallback">
      Пиксель (240, 120), глубина 2 м и параметры fx=fy=320,
      cx=160, cy=120 вместе задают 3D-точку X=0,5 м, Y=0, Z=2 м.
    </p>
  </main>

  <script>
    const diagramData = [{
      canvas: [960, 420],
      origin: [145, 348],
      scale: 140,
      zero: 0,
      one: 1,
      half: 0.5,
      pixel: [240, 120],
      principal: [160, 120],
      focal: [320, 320],
      depth: 2,
      deltaPixel: 80,
      result: [0.5, 0, 2],
      panels: [
        [-0.78, 2.28, 1.02, 1.48],
        [-0.78, 1.37, 1.02, 0.91],
        [-0.78, 0.80, 1.02, -0.02],
        [1.30, 2.18, 3.25, 0.38]
      ],
      imageFrame: [-0.57, 2.03, 0.80, 1.68],
      imageCenter: [0.02, 1.855],
      imagePixel: [0.47, 1.855],
      flowStarts: [
        [1.02, 1.88],
        [1.02, 1.14],
        [1.02, 0.41]
      ],
      flowEnds: [
        [1.30, 1.88],
        [1.30, 1.29],
        [1.30, 0.72]
      ],
      camera: [3.52, 0.38],
      axisZEnd: [5.76, 0.38],
      axisXEnd: [3.52, 1.45],
      point: [5.52, 0.88],
      projection: [5.52, 0.38],
      resultLabel: [4.70, 1.78],
      formulaOutput: [3.25, 0.64],
      plotInput: [3.52, 0.64],
      cameraBody: [3.34, 0.52, 3.51, 0.24],
      cameraLens: [3.51, 0.47, 3.62, 0.29],
      arrow: [0.10, 0.045],
      tick: 0.055,
      radii: [0.035, 0.045, 0.065],
      labelPads: {
        tiny: 7,
        near: 10,
        normal: 12,
        far: 18
      },
      labels: {
        pixelHeading: [-0.63, 2.15],
        pixelValue: [-0.63, 1.58],
        centerMark: [0.02, 1.855],
        pixelMark: [0.47, 1.855],
        depthHeading: [-0.63, 1.24],
        depthValue: [-0.63, 1.03],
        cameraHeading: [-0.63, 0.67],
        focalValue: [-0.63, 0.43],
        principalValue: [-0.63, 0.19],
        formulaHeading: [1.48, 2.02],
        formulaX: [1.48, 1.70],
        formulaXValue: [1.48, 1.45],
        formulaY: [1.48, 1.13],
        formulaYValue: [1.48, 0.88],
        formulaZ: [1.48, 0.58],
        zAxis: [5.70, 0.38],
        xAxis: [3.52, 1.42],
        depthMeasure: [4.52, 0.38],
        xMeasure: [5.52, 0.63],
        cameraLabel: [3.52, 0.22],
        rayLabel: [4.24, 0.66]
      }
    }];

    const origin = {
      x: diagramData[diagramData[0].zero].origin[diagramData[0].zero],
      y: diagramData[diagramData[0].zero].origin[diagramData[0].one]
    };
    const scale = diagramData[diagramData[0].zero].scale;

    const sx = x => origin.x + x * scale;
    const sy = y => origin.y - y * scale;

    try {
      const d = diagramData[digramIndex()];
      const svg = document.getElementById("diagram");
      const ns = "http://www.w3.org/2000/svg";

      function digramIndex() {
        return diagramData[diagramData[0].zero].zero;
      }

      function node(name, attrs, className) {
        const el = document.createElementNS(ns, name);
        if (className) el.setAttribute("class", className);
        Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
        svg.appendChild(el);
        return el;
      }

      function line(a, b, className) {
        return node("line", {
          x1: sx(a[d.zero]),
          y1: sy(a[d.one]),
          x2: sx(b[d.zero]),
          y2: sy(b[d.one])
        }, className);
      }

      function rect(box, className) {
        return node("rect", {
          x: sx(box[d.zero]),
          y: sy(box[d.one]),
          width: sx(box[d.result[d.result.length - d.one]]) - sx(box[d.zero]),
          height: sy(box[d.result[d.result.length - d.one]]) - sy(box[d.one])
        }, className);
      }

      function circle(point, radius, className) {
        return node("circle", {
          cx: sx(point[d.zero]),
          cy: sy(point[d.one]),
          r: Math.abs(sx(radius) - sx(d.zero))
        }, className);
      }

      function textAt(point, value, className, anchor, dx, dy) {
        const el = node("text", {
          x: sx(point[d.zero]),
          y: sy(point[d.one]),
          "text-anchor": anchor,
          dx: dx,
          dy: dy
        }, className);
        el.textContent = value;
        return el;
      }

      function arrowHead(from, to, className) {
        const vx = to[d.zero] - from[d.zero];
        const vy = to[d.one] - from[d.one];
        const length = Math.hypot(vx, vy);
        const ux = vx / length;
        const uy = vy / length;
        const bx = to[d.zero] - ux * d.arrow[d.zero];
        const by = to[d.one] - uy * d.arrow[d.zero];
        const px = -uy * d.arrow[d.one];
        const py = ux * d.arrow[d.one];
        const points = [
          [to[d.zero], to[d.one]],
          [bx + px, by + py],
          [bx - px, by - py]
        ];
        return node("polygon", {
          points: points.map(point => `${sx(point[d.zero])},${sy(point[d.one])}`).join(" ")
        }, className);
      }

      function arrow(from, to, lineClass, headClass) {
        line(from, to, lineClass);
        arrowHead(from, to, headClass);
      }

      function tickHorizontal(point) {
        line(
          [point[d.zero], point[d.one] - d.tick],
          [point[d.zero], point[d.one] + d.tick],
          "measure"
        );
      }

      function tickVertical(point) {
        line(
          [point[d.zero] - d.tick, point[d.one]],
          [point[d.zero] + d.tick, point[d.one]],
          "measure"
        );
      }

      d.panels.forEach((panel, index) => {
        rect(panel, index === d.panels.length - d.one ? "formula-panel" : "panel");
      });

      rect(d.imageFrame, "frame");
      line(d.imageCenter, d.imagePixel, "guide");
      circle(d.imageCenter, d.radii[d.zero], "center-mark");
      circle(d.imagePixel, d.radii[d.one], "pixel-mark");

      textAt(d.labels.pixelHeading, "ПИКСЕЛЬ ЗАДАЁТ НАПРАВЛЕНИЕ",
        "heading pixel-text", "start", d.zero, d.zero);
      textAt(d.labels.centerMark, "главная точка (160, 120)",
        "small camera-text", "end", -d.labelPads.tiny, d.labelPads.far);
      textAt(d.labels.pixelMark, "пиксель (240, 120)",
        "small pixel-text", "start", d.labelPads.tiny, -d.labelPads.near);
      textAt(d.labels.pixelValue, "Δu = 240 − 160 = 80 пикселей",
        "muted", "start", d.zero, d.zero);

      textAt(d.labels.depthHeading, "ГЛУБИНА ЗАДАЁТ ДАЛЬНОСТЬ",
        "heading depth-text", "start", d.zero, d.zero);
      textAt(d.labels.depthValue, "d = 2 м",
        "depth-text", "start", d.zero, d.zero);

      textAt(d.labels.cameraHeading, "ПАРАМЕТРЫ КАМЕРЫ ЗАДАЮТ МАСШТАБ",
        "heading camera-text", "start", d.zero, d.zero);
      textAt(d.labels.focalValue, "fx = fy = 320",
        "camera-text", "start", d.zero, d.zero);
      textAt(d.labels.principalValue, "cx = 160, cy = 120",
        "camera-text", "start", d.zero, d.zero);

      d.flowStarts.forEach((start, index) => {
        arrow(start, d.flowEnds[index], "flow", "arrow-head");
      });

      textAt(d.labels.formulaHeading, "ОБРАТНАЯ ПРОЕКЦИЯ",
        "heading result-text", "start", d.zero, d.zero);
      textAt(d.labels.formulaX, "X = (u − cx) · d / fx",
        "formula", "start", d.zero, d.zero);
      textAt(d.labels.formulaXValue, "= (240 − 160) · 2 / 320 = 0,5 м",
        "formula result-text", "start", d.zero, d.zero);
      textAt(d.labels.formulaY, "Y = (v − cy) · d / fy",
        "formula", "start", d.zero, d.zero);
      textAt(d.labels.formulaYValue, "= (120 − 120) · 2 / 320 = 0",
        "formula result-text", "start", d.zero, d.zero);
      textAt(d.labels.formulaZ, "Z = d = 2 м",
        "formula result-text", "start", d.zero, d.zero);

      arrow(d.formulaOutput, d.plotInput, "flow", "arrow-head");

      rect(d.cameraBody, "camera-body");
      rect(d.cameraLens, "camera-lens");
      textAt(d.labels.cameraLabel, "камера",
        "muted", "middle", d.zero, d.labelPads.far);

      arrow(d.camera, d.axisZEnd, "axis", "axis-head");
      arrow(d.camera, d.axisXEnd, "axis", "axis-head");
      textAt(d.labels.zAxis, "Z — вперёд",
        "heading", "end", d.zero, -d.labelPads.near);
      textAt(d.labels.xAxis, "X — вправо",
        "heading", "start", d.labelPads.normal, d.zero);

      arrow(d.camera, d.point, "ray", "ray-head");
      textAt(d.labels.rayLabel, "луч выбранного пикселя",
        "muted", "middle", d.zero, -d.labelPads.normal);

      line(d.camera, d.projection, "measure");
      tickHorizontal(d.camera);
      tickHorizontal(d.projection);
      textAt(d.labels.depthMeasure, "Z = 2 м",
        "result-text", "middle", d.zero, d.labelPads.far);

      line(d.projection, d.point, "measure");
      tickVertical(d.projection);
      tickVertical(d.point);
      textAt(d.labels.xMeasure, "X = 0,5 м",
        "result-text", "start", d.labelPads.normal, d.zero);

      circle(d.point, d.radii[d.result.length - d.one], "result-point");
      line(d.point, d.resultLabel, "guide");
      textAt(d.resultLabel, "3D-точка: (X, Y, Z) = (0,5 м; 0; 2 м)",
        "result-text", "middle", d.zero, -d.labelPads.normal);
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      if (svg) svg.style.display = "none";
      if (fallback) fallback.style.display = "block";
    }
  </script>
</body>
</html>
