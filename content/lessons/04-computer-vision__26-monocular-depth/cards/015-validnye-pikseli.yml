- concept: метрики глубины считают только по пикселям с достоверной эталонной глубиной и конечным предсказанием
  question: Какой набор пикселей допустимо использовать для оценки модели глубины?
  explanation: Нулевая, нечисловая или ненадёжная эталонная глубина означает отсутствие пригодного измерения. Ограничение знаменателя предотвращает численную бесконечность, но не превращает такой пиксель в валидную разметку.
  kind: choice
  options:
    - Все пиксели, если перед делением ограничить знаменатель снизу
    - Пиксели с конечной положительной эталонной глубиной в рабочем диапазоне датасета, разрешённые маской надёжности, и с конечным предсказанием
    - Все пиксели, на которых модель выдала положительное значение
    - Только пиксели, где ошибка модели оказалась небольшой
  correct: 1
  id: 015-validnye-pikseli-1
  fingerprint: 072a4568
- concept: сравниваемые модели должны оцениваться на одном и том же наборе валидных пикселей
  question: Почему при сравнении моделей глубины для них нужно использовать общую маску валидных пикселей?
  explanation: Метрики сопоставимы лишь при одинаковой области оценки. Маску обычно определяют по валидности и надёжности эталонных измерений, а не по величине ошибок конкретной модели.
  kind: open
  reference: Общая маска обеспечивает одинаковый набор оцениваемых позиций. Если маски различаются, одна модель может получить более простой набор пикселей, поэтому разница метрик будет отражать не только качество моделей, но и разные условия оценки.
  id: 015-validnye-pikseli-2
  fingerprint: b56de89c
