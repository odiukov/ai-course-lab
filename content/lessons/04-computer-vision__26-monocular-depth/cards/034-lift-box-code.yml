- concept: объединение результатов детектора и модели глубины в общей схеме пространственной локализации
  question: Расположи этапы локализации обнаруженного объекта в координатах камеры в правильном порядке.
  explanation: Детектор определяет положение объекта на изображении, а карта глубины добавляет недостающую координату по направлению взгляда. Параметры камеры позволяют преобразовать эти данные в точку в системе координат камеры.
  kind: order
  items:
    - Получить RGB-кадр
    - Построить карту глубины и найти детекторные рамки
    - Объединить положение центра рамки с соответствующей глубиной и параметрами камеры
    - Передать полученную пространственную точку следующему компоненту системы
  id: 034-lift-box-code-1
  fingerprint: 8d0d1eb0
- concept: одна поднятая точка задаёт положение объекта, но не его полную пространственную геометрию
  question: Почему результат подъёма центра детекторной рамки следует считать приближённым положением объекта, а не полным восстановлением его формы и размеров?
  explanation: Одна пространственная точка локализует объект, но не описывает его границы. Полная геометрия требует нескольких измерений глубины в разных частях объекта или объединения с облаком точек.
  kind: open
  reference: Центр рамки и соответствующая глубина определяют только одну пространственную точку. Для оценки формы, ориентации и размеров нужны дополнительные точки поверхности, например из маски сегментации или облака точек.
