- concept: одинаковая яркость на независимо визуализированных относительных картах глубины не гарантирует одинакового расстояния
  question: На картах глубины двух разных фотографий пиксели некоторого объекта имеют одинаковый оттенок серого. Какой вывод корректен для модели относительной глубины?
  explanation: Относительная карта задаёт порядок глубины внутри сцены, а её оттенки могут быть растянуты под диапазон конкретного кадра. Преобразование PIL-изображения в NumPy и совпадение разрешений не создают общей метрической шкалы.
  kind: choice
  options:
    - Объекты обязательно находятся на одинаковом физическом расстоянии от камер
    - Сравнивать физические расстояния по совпавшему оттенку нельзя, поскольку визуализация может независимо масштабироваться для каждого изображения
    - Одинаковый оттенок гарантирует одинаковое расстояние, если обе карты преобразованы в NumPy
    - Расстояния одинаковы, если фотографии имеют одинаковое разрешение
