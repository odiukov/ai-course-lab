- concept: глобальное аффинное выравнивание не устраняет независимые попиксельные ошибки
  question: Предсказание отличается от эталонной глубины независимым случайным шумом в каждом пикселе. Что следует ожидать после подбора единого масштаба и сдвига?
  explanation: Преобразование вида a·pred + b корректирует только общие масштаб и смещение. Оно не располагает отдельными параметрами для каждого пикселя, поэтому независимый шум полностью убрать не может.
  kind: choice
  options:
    - Выравнивание может уменьшить систематическую составляющую ошибки, но случайные остаточные ошибки сохранятся
    - Выравнивание обязательно восстановит эталонную карту без остаточной ошибки
    - Выравнивание удалит только ошибки на ближних поверхностях
    - Выравнивание превратит любой случайный шум в постоянный сдвиг
