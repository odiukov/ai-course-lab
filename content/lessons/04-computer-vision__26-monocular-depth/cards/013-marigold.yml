- concept: резкие границы Marigold оплачиваются высокой задержкой из-за многократных запусков тяжёлой модели
  question: Почему Marigold обычно лучше подходит для обработки отдельных изображений, чем для видеопотока в реальном времени?
  explanation: Marigold выполняет 10–50 шагов расшумления вместо одного прямого прохода. Последовательные уточнения делают границы резче, однако их нельзя получить одновременно, поэтому задержка на каждый кадр заметно возрастает.
  kind: open
  reference: Карта глубины уточняется за много последовательных шагов расшумления, и на каждом шаге снова запускается тяжёлый U-Net. Это позволяет исправлять границы объектов, но многократно увеличивает время вычисления по сравнению с прямой моделью.
  id: 013-marigold-2
  fingerprint: 37ff2140
