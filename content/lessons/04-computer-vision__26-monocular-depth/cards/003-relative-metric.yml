- concept: метрическая глубина сильнее зависит от внутренних параметров камеры, чем относительная
  question: Почему замена камеры с другими внутренними параметрами обычно опаснее для модели метрической глубины, чем для модели относительной глубины?
  explanation: Фокусное расстояние и другие внутренние параметры меняют видимый масштаб и перспективу. Ошибка в их учёте нарушает перевод признаков изображения в реальные расстояния, тогда как относительная оценка не обязана восстанавливать физический масштаб.
  kind: open
  reference: Внутренние параметры камеры влияют на связь между изображением и физическим масштабом сцены. Метрическая модель должна восстановить абсолютное расстояние и потому зависит от этой связи; относительной модели достаточно сохранить порядок точек по глубине.
