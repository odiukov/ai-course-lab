- concept: AbsRel нормирует абсолютную ошибку пикселя на его истинную глубину
  question: Истинная глубина пикселя равна 8 м, а предсказанная — 9 м. Каков вклад этого пикселя в AbsRel?
  explanation: Вклад равен |9 − 8| / 8 = 0.125. Поэтому AbsRel оценивает ошибку как долю истинного расстояния, а не в метрах.
  kind: numeric
  answer: 0.125
  tolerance: 0.001
  id: 017-absrel-smysl-1
  fingerprint: d6c8686c
- concept: модуль в AbsRel не позволяет недооценкам и переоценкам глубины взаимно компенсироваться
  question: Модель на части пикселей завышает глубину, а на остальных занижает её на сопоставимую относительную величину. Что произойдёт при вычислении AbsRel?
  explanation: AbsRel использует модуль разности между предсказанием и эталоном. И недооценка, и переоценка поэтому увеличивают метрику.
  kind: choice
  options:
    - Ошибки почти погасят друг друга
    - Обе группы ошибок дадут положительный вклад
    - Будут учтены только завышенные значения
    - Знак итоговой метрики будет зависеть от числа пикселей в каждой группе
  correct: 1
  id: 017-absrel-smysl-2
  fingerprint: ce83cd3f
- concept: средний AbsRel не гарантирует одинаково малую ошибку на каждом пикселе
  question: Объясни своими словами, почему низкий AbsRel не доказывает, что модель точно оценила глубину каждого пикселя.
  explanation: AbsRel — агрегированная метрика. Она показывает средний размер относительной ошибки, но не её распределение и не максимальный промах.
  kind: open
  reference: AbsRel усредняет относительные ошибки по пикселям, поэтому точные предсказания могут снизить среднее даже при наличии отдельных крупных промахов.
  id: 017-absrel-smysl-3
  fingerprint: d0074aa2
