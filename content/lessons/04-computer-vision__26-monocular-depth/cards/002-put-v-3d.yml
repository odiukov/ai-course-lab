- concept: ошибочные параметры камеры искажают геометрию облака точек даже при верной глубине
  question: Карта глубины выглядит верной, но построенное по ней облако точек заметно растянуто по горизонтали. Объясни, почему причиной могут быть неверные параметры камеры.
  explanation: 'Одной глубины недостаточно для восстановления пространственных координат: параметры камеры определяют, как пиксельные координаты раскрываются в направления лучей. Поэтому ошибочная калибровка искажает форму облака, даже если удаления точек предсказаны правильно.'
  kind: open
  reference: Глубина определяет удаление точки, но направление её луча вычисляется по координатам пикселя и параметрам камеры. Ошибка в фокусном расстоянии или положении главной точки меняет направления лучей, поэтому боковые координаты точек становятся неверными и облако растягивается или сжимается.
