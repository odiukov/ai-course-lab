- concept: коэффициент масштаба определяется отношением изменений целевой и предсказанной глубины
  question: Для пикселей предсказаны глубины 8, 10 и 13 условных единиц, а эталонные глубины равны 37, 45 и 57 метрам. Значения точно связаны преобразованием t = a·p + b. Чему равен коэффициент a?
  explanation: Сдвиг b исчезает при вычитании пар значений. Поэтому a = (45 − 37) / (10 − 8) = 4. Затем из любой пары можно получить b = 5.
  kind: numeric
  answer: 4
  tolerance: 0.001
  id: 022-scale-shift-1
  fingerprint: 83cf786c
- concept: метод наименьших квадратов совместно подбирает масштаб и сдвиг по сумме квадратов невязок
  question: Заполни выражение для подбора масштаба и сдвига относительной глубины.
  explanation: Для каждого допустимого пикселя вычисляют невязку между выровненным предсказанием и целью, возводят её в квадрат и минимизируют сумму по всем пикселям.
  kind: cloze
  template: (a, b) = argmin_{a,b} Σ_i ___
  answer: (a·p_i + b − t_i)(a·p_i + b − t_i)
  accept:
    - (a*p_i+b-t_i)*(a*p_i+b-t_i)
    - квадрат невязки a·p_i+b−t_i
  id: 022-scale-shift-2
  fingerprint: f3868d83
- concept: низкая ошибка после выравнивания не доказывает способность модели самостоятельно выдавать метрическую глубину
  question: После подбора глобальных масштаба и сдвига относительная модель получила низкий AbsRel. Что из этого можно заключить и чего заключить нельзя?
  explanation: При оценке использовались эталонные значения, чтобы подобрать a и b. Поэтому метрика после выравнивания проверяет согласованность формы глубины, но исключает из проверки исходный масштаб и положение нуля.
  kind: open
  reference: Можно заключить, что форма предсказанной глубины хорошо согласуется с эталоном после глобального аффинного преобразования. Нельзя заключить, что исходный выход модели уже выражен в метрах или что модель самостоятельно восстановила абсолютный масштаб.
  id: 022-scale-shift-3
  fingerprint: 41356ed7
