- concept: монокулярная глубина оценивается по косвенным визуальным признакам и априорным знаниям
  question: Почему расстояние до объекта по одному RGB-снимку является оценкой, а не непосредственно измеренной величиной? Приведи несколько признаков, которыми может воспользоваться модель.
  explanation: Монокулярная глубина — неоднозначная обратная задача. Визуальные признаки и накопленные моделью знания позволяют выбрать правдоподобную глубину, но не устраняют геометрическую неоднозначность исходного кадра.
  kind: open
  reference: 'RGB-снимок не записывает расстояние до точки, а разные объёмные сцены могут иметь одинаковую проекцию. Модель делает вывод по изученным закономерностям и косвенным признакам: знакомым размерам объектов, перспективе, перекрытиям, теням и другим особенностям изображения.'
