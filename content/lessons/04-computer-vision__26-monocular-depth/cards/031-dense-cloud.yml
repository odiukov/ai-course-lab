- concept: сетки координат должны согласовывать оси строк и столбцов с индексами depth map
  question: Карта глубины имеет форму (H, W). Нужно получить сетки, в которых v изменяется по строкам, u — по столбцам, а обе сетки имеют форму (H, W). Какой вариант верен?
  explanation: При indexing="ij" первый аргумент соответствует первой оси результата, то есть строкам, а второй — столбцам. Поэтому сетки v и u совпадают по форме и индексации с depth map.
  kind: choice
  options:
    - v, u = np.meshgrid(np.arange(H), np.arange(W), indexing="ij")
    - u, v = np.meshgrid(np.arange(H), np.arange(W), indexing="ij")
    - v, u = np.meshgrid(np.arange(W), np.arange(H), indexing="ij")
    - u = np.arange(W); v = np.arange(H)
  correct: 0
  id: 031-dense-cloud-1
  fingerprint: 4d6bc309
- concept: складывание координат по последней оси сохраняет организованную структуру облака точек
  question: Матрицы X, Y и Z имеют ту же пространственную форму, что и исходная карта глубины. Объясни, почему их складывают по новой последней оси и какое соответствие при этом сохраняется.
  explanation: 'В результате получается организованное облако точек: первые оси сохраняют расположение пикселей, а последняя ось хранит компоненты пространственной координаты. Цвет, глубину и точку можно связывать по одним индексам [v, u].'
  kind: open
  reference: Складывание по последней оси помещает координаты X, Y и Z одного пикселя в один вектор, не объединяя и не переставляя оси строк и столбцов. Поэтому элемент облака с индексом [v, u] продолжает соответствовать пикселю [v, u] исходных изображений.
  id: 031-dense-cloud-2
  fingerprint: 854ef173
