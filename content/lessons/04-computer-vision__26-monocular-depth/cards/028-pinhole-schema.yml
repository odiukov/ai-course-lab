- concept: поперечная координата точки вычисляется из смещения пикселя, глубины и фокусного расстояния
  question: Для камеры fx = 540, cx = 280. Пиксель имеет координату u = 415 и глубину d = 6 м. Чему равна координата X точки в системе камеры?
  explanation: По модели pinhole X = (u − cx) · d / fx. Подстановка даёт X = (415 − 280) · 6 / 540 = 1.5 м. Положительный знак означает, что точка находится справа от оптической оси.
  kind: numeric
  answer: 1.5
  tolerance: 0.01
  id: 028-pinhole-schema-1
  fingerprint: 7ac3bbf6
- concept: пиксель в главной точке камеры лежит на оптической оси
  question: Пикселю с координатами u = cx и v = cy назначена положительная глубина d. Где окажется соответствующая точка в координатах камеры?
  explanation: При u = cx и v = cy оба смещения от главной точки равны нулю, поэтому X = Y = 0. Координата Z равна глубине d, и точка лежит на оптической оси камеры.
  kind: choice
  options:
    - X и Y равны нулю, а Z равно d
    - X равно d, а Y и Z равны нулю
    - X равно cx, Y равно cy, а Z равно d
  correct: 0
