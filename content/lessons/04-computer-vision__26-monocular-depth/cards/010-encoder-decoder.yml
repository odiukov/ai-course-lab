- concept: при замороженном энкодере глубинную задачу осваивает декодер
  question: Объясни своими словами, что именно обучается по целевым картам глубины, если ViT-энкодер заморожен.
  explanation: Заморозка означает отсутствие обновления параметров ViT. Ошибка между предсказанной и целевой глубиной используется для настройки декодера, который осваивает перевод признаков энкодера в плотную карту глубины.
  kind: open
  reference: Обновляются параметры DPT-декодера. Он учится преобразовывать неизменные признаки ViT в предсказание глубины для всей пространственной области изображения; параметры энкодера при этом не меняются.
  id: 010-encoder-decoder-2
  fingerprint: 7253738a
