- concept: низкий процентиль глубины учитывает близкие выступающие части объекта при предотвращении столкновений
  question: Роботу нужно не столкнуться с предметом, у которого небольшая выступающая деталь ближе основной поверхности. Какую статистику глубин объекта разумнее использовать?
  explanation: При обычном соглашении меньшая глубина означает более близкую точку. Низкий процентиль реагирует на группу ближайших пикселей выступающей детали, но менее чувствителен к одиночному шумовому минимуму.
