- concept: scale-and-shift alignment инвариантно к невырожденному аффинному перепараметрированию относительной глубины
  question: Карты относительной глубины связаны формулой q = c·p + d, где c — ненулевой коэффициент. Для каждой карты независимо подбирают масштаб и сдвиг к одной цели на общей маске. Что произойдёт в невырожденной задаче?
  explanation: Преобразование α·q + β можно записать как (αc)·p + (αd + β). Поэтому обе оптимизации перебирают одно и то же семейство аффинно преобразованных карт и дают одинаковый оптимальный результат.
  kind: choice
  options:
    - Карта q обязательно получит больший AbsRel из-за добавленного сдвига
    - Выровненные карты совпадут, поскольку подбираемое преобразование поглощает c и d
    - Выровненные карты совпадут только при отсутствии d
    - Результаты нельзя сопоставлять даже при общей цели и маске
  correct: 1
  id: 024-aligned-metric-1
  fingerprint: 2dae8989
- concept: выравнивание и AbsRel должны использовать один набор валидных пар пикселей
  question: Расположите операции для корректного вычисления AbsRel относительной модели после scale-and-shift alignment.
  explanation: Маска определяет выборку, на которой строится вся составная метрика. Если параметры выравнивания оценивать по одним пикселям, а AbsRel — по другим, исключённые из итоговой ошибки значения смогут изменить масштаб и сдвиг и тем самым исказить оценку.
  kind: order
  items:
    - Построить общую маску достоверных целевых значений и конечных предсказаний
    - Выбрать предсказания и цели по этой маске
    - Подобрать масштаб и сдвиг методом наименьших квадратов на выбранных парах
    - Вычислить AbsRel для преобразованных предсказаний и целей из того же набора пар
  id: 024-aligned-metric-2
  fingerprint: 98c6c3df
