- concept: атмосферная перспектива служит монокулярным признаком удалённости
  question: На уличной фотографии далёкие горы выглядят менее контрастными и более синеватыми, чем объекты переднего плана. Какой монокулярный признак глубины проявляется?
  explanation: Свет от удалённых объектов сильнее рассеивается в атмосфере, поэтому они часто выглядят блёклыми, малоконтрастными и синеватыми. Модель может использовать этот эффект как признак большой глубины.
  kind: choice
  options:
    - Порядок перекрытий
    - Атмосферная перспектива
    - Постоянство размера
    - Градиент текстуры
  correct: 1
  id: 007-pyat-podskazok-1
  fingerprint: 1e6a9b3b
- concept: согласие нескольких монокулярных признаков повышает уверенность в оценке глубины
  question: Объясни своими словами, почему совпадающие указания перспективы, текстуры, перекрытий, знакомого размера и атмосферной дымки надёжнее одного монокулярного признака.
  explanation: 'Один признак допускает несколько объяснений: небольшой объект может быть далёким или действительно маленьким. Согласие разных признаков помогает исключить такие альтернативы, хотя само по себе не гарантирует точного расстояния.'
  kind: open
  reference: Каждый отдельный признак неоднозначен и может давать ошибочную подсказку. Если независимые признаки согласованно указывают на один порядок глубины, число правдоподобных альтернатив уменьшается и оценка становится увереннее; противоречие признаков, наоборот, должно снижать уверенность.
  id: 007-pyat-podskazok-2
