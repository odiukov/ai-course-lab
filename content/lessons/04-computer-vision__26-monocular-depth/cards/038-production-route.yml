- concept: координаты детекции нужно преобразовать в систему координат карты глубины
  question: Детектор работал с RGB-кадром размером 2000 × 1000 пикселей, а карта глубины имеет размер 800 × 400. Кадры различаются только масштабом, без обрезки и полей. Центр рамки находится в точке с координатой x = 1250 на RGB-кадре. Какой координате x на карте глубины он соответствует?
  explanation: Горизонтальный коэффициент масштаба равен 800 / 2000 = 0.4. Поэтому координата на карте глубины равна 1250 × 0.4 = 500. Использование исходной координаты без пересчёта выбрало бы глубину другого участка сцены.
  kind: numeric
  answer: 500
  tolerance: 0.5
  id: 038-production-route-1
  fingerprint: 82a1a531
- concept: результаты параллельных ветвей пайплайна должны соответствовать одному моменту съёмки
  question: Детектор обработал текущий RGB-кадр, а карта глубины по ошибке взята из предыдущего кадра. Объект за это время переместился. Что необходимо сделать для корректного объединения результатов?
  explanation: Даже при одинаковых размерах изображений рамка и глубина могут описывать разные положения движущегося объекта. Объединять следует результаты, полученные для одного RGB-кадра либо явно синхронизированные по времени.
  kind: choice
  options:
    - Синхронизировать результаты по идентификатору кадра или временной метке
    - Нормализовать яркость карты глубины по рамке объекта
    - Увеличить порог уверенности детектора
    - Отсортировать обнаруженные классы по размеру рамки
