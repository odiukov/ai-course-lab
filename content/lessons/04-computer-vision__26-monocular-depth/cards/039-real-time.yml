- concept: пригодность модели для реального времени определяется полной сквозной задержкой пайплайна
  question: Сам инференс модели глубины завершается до прихода следующего видеокадра, но готовая depth map всё равно опаздывает. Какую задержку нужно сравнивать с временным бюджетом кадра?
  explanation: Систему ограничивает сквозная задержка. Даже быстрая модель не обеспечивает реальное время, если изменение размера, обмен данными с GPU и обработка результата выводят весь пайплайн за бюджет кадра.
  kind: choice
  options:
    - Только время вычислений внутри нейросети
    - Время от получения RGB-кадра до готовой depth map, включая предобработку, передачу данных, инференс и постобработку
    - Только время передачи изображения на видеокарту
    - Только время работы детектора объектов
  correct: 1
  id: 039-real-time-1
  fingerprint: '70129e92'
- concept: перегруженная FIFO-очередь видеокадров увеличивает возраст выдаваемых карт глубины
  question: Модель глубины стабильно обрабатывает кадры медленнее, чем камера их создаёт. Почему обработка всех кадров по порядку делает depth map всё менее актуальной и как можно ограничить это отставание?
  explanation: При времени обработки больше интервала поступления кадров FIFO-очередь не успевает опустошаться. Пропуск кадров уменьшает временную плотность depth map, зато сохраняет её актуальность; ускорение модели или пайплайна устраняет саму перегрузку.
  kind: open
  reference: Новые кадры поступают быстрее, чем освобождается обработчик, поэтому очередь растёт и каждый результат относится ко всё более старому моменту съёмки. Отставание можно ограничить, пропуская устаревшие кадры или обрабатывая только самый свежий; также можно уменьшить разрешение либо выбрать более лёгкую модель.
  id: 039-real-time-2
  fingerprint: ae5be7a5
