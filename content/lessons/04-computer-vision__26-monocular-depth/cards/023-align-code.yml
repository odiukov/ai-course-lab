- concept: столбец единиц в матрице признаков позволяет оценить свободный член линейной модели
  question: При подборе преобразования вида a · pred + b методом наименьших квадратов зачем к значениям pred добавляют столбец единиц?
  explanation: Каждая строка матрицы представляет уравнение a · pred + b ≈ target. Значение pred умножается на a, а единица — на b, поэтому второй коэффициент становится свободным членом.
  kind: choice
  options:
    - Чтобы коэффициент при этом столбце задавал независимый от pred аддитивный сдвиг b
    - Чтобы нормировать значения pred перед решением системы
    - Чтобы исключить из расчёта пиксели с нулевой глубиной
    - Чтобы гарантировать положительное значение масштаба a
  correct: 0
  id: 023-align-code-1
  fingerprint: 43a572fc
- concept: маска ограничивает выборку для оценки параметров выравнивания, но не область применения найденного преобразования
  question: Функция выравнивания получила карты pred и target одинаковой формы и булеву маску допустимых пикселей. Как следует использовать маску, если результат должен оставаться полной картой?
  explanation: Маска определяет, какие пары участвуют в подгонке коэффициентов. Найденное аффинное преобразование затем применяется ко всему pred, поэтому форма выходной карты совпадает с формой входной.
  kind: choice
  options:
    - Оценить a и b по отмеченным парам, а затем применить a · pred + b ко всей исходной карте pred
    - Оценить a и b по всем пикселям, а маской обнулить недопустимые элементы результата
    - Вернуть только отмеченные элементы a · pred + b в виде одномерного массива
    - Применить преобразование только к target, сохранив pred без изменений
  correct: 0
