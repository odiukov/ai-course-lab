- concept: допустимое время обработки кадра обратно пропорционально частоте видео
  question: Видеопоток идёт с частотой 25 кадров в секунду. Сколько миллисекунд в среднем можно тратить на один кадр, чтобы обрабатывать каждый кадр в реальном времени?
  explanation: 'Время одного кадра равно 1000 мс, делённым на частоту: 1000 / 25 = 40 мс. Если инференс длится дольше, система начнёт отставать или будет вынуждена пропускать кадры.'
  kind: numeric
  answer: 40
  tolerance: 0.5
