- concept: delta_accuracy не убывает при увеличении порога на фиксированных данных
  question: Для одного и того же набора положительных валидных глубин порог метрики delta_accuracy увеличили с 1.4 до 1.8. Как при этом может измениться значение метрики?
  explanation: При увеличении порога все ранее прошедшие пиксели продолжают проходить, а часть ранее отклонённых может стать допустимой. Поэтому доля прошедших пикселей не уменьшается.
  kind: choice
  options:
    - Оно обязательно уменьшится
    - Оно может измениться в любую сторону
    - Оно может увеличиться или остаться прежним, но не уменьшиться
  correct: 2
  id: 020-delta-code-1
  fingerprint: 51d5817c
- concept: delta_accuracy не учитывает величину ошибки после выхода за порог
  question: Почему две модели могут иметь одинаковую delta_accuracy, хотя ошибочные предсказания одной из них значительно хуже?
  explanation: delta_accuracy превращает ошибку каждого пикселя в бинарный результат. Поэтому она показывает долю приемлемых предсказаний, но не различает умеренные и катастрофические ошибки среди пикселей, не прошедших порог.
  kind: open
  reference: Метрика учитывает только то, прошёл ли каждый пиксель порог отношения глубин. Все не прошедшие пиксели дают одинаковый нулевой вклад независимо от того, насколько сильно превышен порог.
  id: 020-delta-code-2
  fingerprint: 115d1f79
