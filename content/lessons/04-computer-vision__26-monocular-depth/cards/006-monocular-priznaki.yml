- concept: перекрытие определяет порядок объектов по глубине, но не величину расстояния между ними
  question: Объект A закрывает часть объекта B на обычной непрозрачной сцене. Что можно заключить о глубине этих объектов и чего заключить нельзя?
  explanation: 'Перекрытие задаёт только относительный порядок вдоль направления наблюдения: заслоняющий объект ближе заслонённого. Количественной информации о разнице расстояний этот признак не содержит.'
  kind: open
  reference: Можно заключить, что A находится перед B относительно камеры. По одному перекрытию нельзя определить, насколько далеко они расположены друг от друга или каковы их расстояния до камеры.
  id: 006-monocular-priznaki-2
  fingerprint: b3c493c5
- concept: знакомый размер даёт масштабную подсказку, которая может ошибаться при необычном реальном размере объекта
  question: Почему маленькое изображение знакомого объекта не всегда означает, что объект находится далеко?
  explanation: Признак знакомого размера опирается на предположение о типичном физическом размере объекта. Игрушка, макет или объект необычного масштаба нарушает это предположение, поэтому надёжнее учитывать его вместе с перспективой, текстурой и перекрытиями.
  kind: choice
  options:
    - Объект может быть миниатюрной копией, поэтому предположение о его обычном размере окажется неверным
    - Размер изображения вообще не зависит от расстояния до камеры
    - Знакомые объекты не могут перекрывать другие объекты
    - Перспектива действует только на текстуры, но не на отдельные предметы
