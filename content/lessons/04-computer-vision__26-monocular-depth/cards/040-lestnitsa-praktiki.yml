- concept: ошибка оценки перемещения вычисляется по разности метрических глубин объекта
  question: Объект переместили к неподвижной камере на 40 см. Модель оценила его глубину до перемещения как 1,64 м, а после — как 1,28 м. Какова абсолютная ошибка оценки перемещения в сантиметрах?
  explanation: Предсказанное перемещение равно 1,64 − 1,28 = 0,36 м, то есть 36 см. Относительно настоящего сдвига на 40 см ошибка составляет 4 см.
  kind: numeric
  answer: 4
  tolerance: 0.1
  id: 040-lestnitsa-praktiki-1
  fingerprint: f510233a
- concept: повторные измерения позволяют отличить устойчивый метрический масштаб от выброса
  question: При известном перемещении объекта на 40 см модель в повторных съёмках оценила сдвиги как 41, 39, 58 и 42 см. Какой вывод наиболее обоснован?
  explanation: Три оценки группируются около настоящего сдвига, а одна резко отличается. Повторные пары показывают устойчивость масштаба и помогают обнаруживать отдельные ошибки модели, маски объекта или съёмки.
  kind: choice
  options:
    - Масштаб в большинстве измерений близок к верному, но результат 58 см следует исследовать как выброс
    - Модель полностью непригодна, потому что ни одно значение не совпало с эталоном абсолютно точно
    - Все результаты одинаково точны, поскольку облака точек можно визуализировать
    - Из этих данных можно проверить только относительный порядок глубин
