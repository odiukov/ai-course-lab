- concept: неподвижная камера изолирует изменение глубины, вызванное перемещением объекта
  question: Объясните своими словами, почему при проверке метрической оценки перемещения нужно зафиксировать камеру и менять только положение исследуемого объекта.
  explanation: Фиксация камеры устраняет смешение двух движений. Тогда изменение устойчивой глубины объекта между кадрами можно непосредственно сравнивать с известным физическим сдвигом.
  kind: open
  reference: Так различие между кадрами можно связать с перемещением объекта. Если камера тоже сдвинулась или повернулась, глубины и координаты точек изменятся из-за движения камеры, поэтому измеренная разность уже не будет чистой оценкой перемещения объекта.
  id: 040-lestnitsa-praktiki-3
