- concept: модели монокулярной глубины различаются по типу выдаваемого масштаба
  question: Какое соответствие между моделями и типом глубины верно?
  explanation: MiDaS и Marigold предсказывают относительную глубину без единиц измерения. ZoeDepth и UniDepth оценивают абсолютное расстояние в метрах.
  kind: choice
  options:
    - MiDaS и Marigold — относительная; ZoeDepth и UniDepth — метрическая
    - MiDaS и Marigold — метрическая; ZoeDepth и UniDepth — относительная
    - Все перечисленные модели выдают только метрическую глубину
