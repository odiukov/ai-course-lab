- concept: градиент потери по входу нейрона равен градиенту по выходу, умноженному на локальную производную активации и вес
  question: Для нейрона a = σ(wx + b) вес w = -3. В текущей точке ∂L/∂a = 0.7, а σ′(z) = 0.12. Чему равен ∂L/∂x?
  explanation: По цепному правилу ∂L/∂x = (∂L/∂a) · σ′(z) · w = 0.7 · 0.12 · (-3) = -0.252. Этот градиент передаётся предыдущему слою.
  kind: numeric
  answer: -0.252
  tolerance: 0.0001
  id: 030-visual-neuron-1
  fingerprint: aa476c04
- concept: градиент по смещению равен градиенту по предактивации из-за единичной локальной производной
  question: Объясните своими словами, почему для предактивации z = wx + b выполняется равенство ∂L/∂b = ∂L/∂z.
  explanation: При изменении смещения на малую величину предактивация меняется на ту же величину. Поэтому локальный множитель на пути от z к b равен единице, и входящий градиент сохраняется.
  kind: open
  reference: Смещение входит в z с единичным коэффициентом, поэтому локальная производная ∂z/∂b равна единице. По цепному правилу ∂L/∂b = (∂L/∂z) · (∂z/∂b), то есть градиент передаётся к смещению без изменения.
  id: 030-visual-neuron-2
  fingerprint: c04f39e6
