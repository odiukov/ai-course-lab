- concept: множество visited предотвращает повторную обработку общего узла вычислительного графа
  question: Зачем обход топологической сортировки хранит множество уже посещённых узлов?
  explanation: В DAG один узел может быть предком результата по нескольким путям. Без visited он несколько раз попадёт в topo, поэтому его _backward вызовется повторно и ещё раз передаст уже накопленный градиент.
  kind: choice
  options:
    - Чтобы общий узел, достижимый по нескольким ветвям, попал в список только один раз
    - Чтобы сохранить значения локальных производных
    - Чтобы выбрать ветвь с наибольшим градиентом
    - Чтобы превратить вычислительный граф в дерево
  correct: 0
  id: 039-topo-sort-1
  fingerprint: 1b9fb89c
- concept: топологический список строится обходом в глубину с добавлением узла после его предшественников
  question: Расположите действия build_topo для текущего узла в правильном порядке.
  explanation: Узел добавляется только после всех своих предшественников из _prev. Поэтому topo содержит зависимости раньше использующих их операций, а обратный обход списка меняет этот порядок на подходящий для распространения градиентов.
  kind: order
  items:
    - Проверить, не посещён ли узел; для уже посещённого узла завершить вызов
    - Пометить текущий узел как посещённый
    - Рекурсивно обработать все узлы из _prev
    - Добавить текущий узел в список topo
  id: 039-topo-sort-2
  fingerprint: 639ee499
- concept: топологический порядок не уникален для независимых ветвей графа
  question: Две ветви вычислительного DAG не зависят друг от друга, но обе входят в итоговую операцию. Почему топологические сортировки могут располагать эти ветви в разном порядке?
  explanation: Топологическая сортировка задаёт частичный, а не обязательно единственный полный порядок. Перестановка независимых ветвей корректна, если каждый узел по-прежнему расположен в соответствии со всеми рёбрами графа.
  kind: open
  reference: Топологическая сортировка обязана соблюдать только зависимости, заданные рёбрами. Между независимыми ветвями ребра нет, поэтому ни одна из них не обязана предшествовать другой; допустим любой их взаимный порядок, сохраняющий остальные зависимости.
  id: 039-topo-sort-3
  fingerprint: 3aea4052
