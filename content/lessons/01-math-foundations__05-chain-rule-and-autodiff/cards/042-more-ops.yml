- concept: локальная производная натурального логарифма масштабирует входящий градиент обратно пропорционально аргументу
  question: Для узла y = ln(x) градиент сверху равен g. Какой вклад должен получить x при обратном проходе?
  explanation: Локальная производная натурального логарифма равна единице, делённой на x. Поэтому по цепному правилу вклад в градиент аргумента равен g / x. Эта операция нужна, в частности, для cross-entropy и работы с логарифмами вероятностей.
  kind: choice
  options:
    - g / x
    - x · g
    - exp(x) · g
    - ln(x) · g
  correct: 0
  id: 042-more-ops-1
  fingerprint: bc903cb3
- concept: производную экспоненты можно вычислить через сохранённый результат прямого прохода
  question: Заполни выражение для обратного прохода через узел экспоненты, используя уже вычисленный выход y.
  explanation: Производная exp(x) совпадает с exp(x). Поскольку это значение уже сохранено в y на прямом проходе, локальный backward просто умножает y на градиент сверху.
  kind: cloze
  template: Если y = exp(x), а градиент сверху равен g, то вклад в градиент x равен ___.
  answer: y * g
  accept:
    - g * y
    - y·g
    - g·y
  id: 042-more-ops-2
  fingerprint: 3860136d
- concept: реализация степенной операции с фиксированным показателем дифференцирует только по основанию
  question: Почему в простой реализации Value.__pow__ показатель степени n задают обычным фиксированным числом, а не объектом Value?
  explanation: Формула, используемая в этом __pow__, предполагает постоянный показатель. Этого достаточно для квадрата ошибки и других фиксированных степеней. Обучаемый показатель потребовал бы отдельной зависимости и отдельного правила обратного прохода.
  kind: open
  reference: Такой узел представляет функцию основания x при постоянном n и должен передать градиент только в x, используя локальную производную n · x в степени n минус единица. Если сделать n объектом Value, он станет вторым изменяемым входом графа и потребуется также реализовать производную результата по показателю степени.
  id: 042-more-ops-3
  fingerprint: 16d1bf5d
