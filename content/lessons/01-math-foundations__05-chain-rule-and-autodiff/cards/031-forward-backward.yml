- concept: градиент по входу нейрона передаётся предыдущему звену вычислительной цепи
  question: Локальный backward нейрона вычислил градиенты по входу, весу и смещению. Какой из них нужно передать предыдущему слою?
  explanation: Предыдущий слой создал вход текущего нейрона, поэтому ему передают dL_dx. Градиенты dL_dw и dL_db относятся к локальным обучаемым параметрам.
  kind: choice
  options:
    - Градиент потери по входу
    - Градиент потери по весу
    - Градиент потери по смещению
    - Локальную производную активации
  correct: 0
  id: 031-forward-backward-1
  fingerprint: 392da5fa
- concept: локальный backward принимает входящий градиент, чтобы встраиваться в произвольную вычислительную цепь
  question: Почему функция прямого и обратного прохода нейрона должна принимать dL_da аргументом, а не считать его всегда единичным?
  explanation: Аргумент dL_da позволяет использовать один и тот же локальный backward в любой позиции графа. Если всегда подставлять единицу, функция посчитает только локальные производные и потеряет влияние последующей части модели.
  kind: open
  reference: Единичный градиент задают только на конечном скалярном выходе. Внутри вычислительной цепи dL_da приходит от последующих операций и связывает их производные с локальной производной нейрона по цепному правилу.
  id: 031-forward-backward-2
  fingerprint: af0593e4
