- concept: градиент в промежуточном узле обратного режима выражает чувствительность конечного выхода к значению этого узла
  question: Вычислительный граф имеет скалярный выход y и промежуточный узел v. Какую величину обратный режим накапливает в узле v?
  explanation: Обратный режим переносит чувствительность конечного выхода назад по графу. Поэтому градиент промежуточного узла v показывает, как изменение v повлияет на y, то есть равен ∂y/∂v.
  kind: choice
  options:
    - ∂y/∂v
    - ∂v/∂y
    - Значение v без производной
    - Производную v только по ближайшему предшественнику
