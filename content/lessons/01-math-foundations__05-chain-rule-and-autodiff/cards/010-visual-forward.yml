  fingerprint: 55110c87
- concept: прямой проход сохраняет промежуточные значения, необходимые обратному проходу
  question: Зачем движок автоматического дифференцирования сохраняет промежуточные значения, вычисленные во время прямого прохода?
  explanation: 'Для обратного прохода часто нужны значения из прямого: например, производная умножения по одному входу равна другому входу, а производная ReLU зависит от знака её аргумента. Сохранение этих значений избавляет от повторного вычисления прямого прохода.'
  kind: choice
  options:
    - Чтобы обратный проход мог вычислять локальные производные по значениям входов и выходов операций
    - Чтобы узлы графа можно было выполнять в случайном порядке
    - Чтобы итог функции перестал зависеть от входных данных
    - Чтобы во время вычисления автоматически менять структуру выражения
