- concept: коэффициенты дуального числа хранят значение и соответствующую производную
  question: Какую информацию несёт коэффициент при бесконечно малой части дуального числа?
  explanation: Обычная часть a хранит значение выражения, а коэффициент b при ε — его производную по выбранной входной переменной.
  kind: cloze
  template: В дуальном числе a + b·ε коэффициент b хранит ___.
  answer: производную
  accept:
    - значение производной
    - касательную компоненту
  id: 051-quiz-2
  fingerprint: 296acebf
- concept: autodiff получает производные из локальных аналитических правил, а не из численных возмущений
  question: Почему autodiff считают точным методом дифференцирования, хотя вычисления выполняются с числами с плавающей точкой?
  explanation: Точность здесь означает отсутствие ошибки численного приближения производной. Округление при вычислениях остаётся, но параметр малого возмущения подбирать не требуется.
  kind: open
  reference: Autodiff применяет известные локальные производные выполненных операций и соединяет их цепным правилом. Он не приближает производную конечной разностью; возможна лишь обычная погрешность арифметики с плавающей точкой.
  id: 051-quiz-3
  fingerprint: df9b9a5c
