- concept: пустая композиция является тождественной функцией с единичной производной
  question: Что должна вернуть функция вычисления композиции и её производной, если список звеньев пуст?
  explanation: Пустая композиция ничего не делает со входом, то есть является тождественной функцией. Её значение равно x, а производная — единице.
  kind: choice
  options:
    - Исходное значение x и единичную производную
    - Исходное значение x и нулевую производную
    - Нулевое значение и единичную производную
    - Ошибку, потому что композиция не определена
  correct: 0
  id: 007-chain-many-1
  fingerprint: c8ddfc51
- concept: двухпроходный алгоритм вычисления произвольной композиции и её производной
  question: Расположите этапы двухпроходной реализации chain_many в правильном порядке.
  explanation: Сначала прямой проход формирует значения и сохраняет входы операций. Затем локальные производные вычисляются на этих входах и накапливаются произведением.
  kind: order
  items:
    - Пройти по звеньям вперёд, вычисляя итоговое значение и сохраняя вход каждого звена
    - По сохранённым входам вычислить локальные производные и перемножить их
    - Вернуть итоговое значение вместе с накопленной производной
  id: 007-chain-many-2
  fingerprint: 5ecc0d30
