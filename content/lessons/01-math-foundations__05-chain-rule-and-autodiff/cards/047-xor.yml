- concept: скрытый слой позволяет строить нелинейную границу решения из нескольких линейных разделений
  question: Объясните своими словами, почему скрытый слой с нелинейными активациями позволяет сети решать XOR, хотя отдельный нейрон с монотонной активацией не позволяет.
  explanation: 'Монотонная активация не превращает границу отдельного нейрона в нелинейную: порог её выхода всё равно соответствует прямой в пространстве входов. Скрытый слой создаёт несколько промежуточных признаков, сочетание которых уже может образовать нелинейно разделимые области.'
  kind: open
  reference: Отдельный нейрон задаёт только одну линейную границу. Нейроны скрытого слоя создают разные линейные разделения входного пространства, а выходной нейрон нелинейно комбинирует их признаки и получает составную границу, способную отделить классы XOR.
