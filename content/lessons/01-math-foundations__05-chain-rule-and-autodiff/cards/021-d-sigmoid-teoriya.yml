- concept: локальная производная сигмоиды вычисляется как произведение её выхода на дополнение этого выхода до единицы
  question: Выход сигмоиды равен 0.4. Чему равна её локальная производная в этой точке?
  explanation: Для сигмоиды локальная производная равна s·(единица − s). Дополнение 0.4 до единицы равно 0.6, поэтому производная равна 0.4 · 0.6 = 0.24.
  kind: numeric
  answer: 0.24
  tolerance: 0.001
  id: 021-d-sigmoid-teoriya-1
  fingerprint: 649bf166
- concept: производная сигмоиды максимальна в середине диапазона её выходных значений и уменьшается при насыщении
  question: В каком состоянии сигмоида сильнее всего передаёт градиент при обратном проходе?
  explanation: Произведение s·(единица − s) максимально, когда оба множителя равны. У границ диапазона один из множителей становится мал, поэтому сигмоида передаёт более слабый градиент.
  kind: choice
  options:
    - Когда её выход близок к нижней границе диапазона
    - Когда её выход находится в середине диапазона
    - Когда её выход близок к верхней границе диапазона
  correct: 1
