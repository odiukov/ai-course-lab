- concept: знак производной композиции определяется знаками локальных производных
  question: Все локальные производные в цепочке отличны от нуля. Какой знак имеет производная всей композиции, если отрицательных локальных производных нечётное количество?
  explanation: Общая производная — произведение локальных производных. Нечётное количество отрицательных множителей даёт отрицательное произведение, а чётное — положительное.
  kind: choice
  options:
    - Отрицательный
    - Положительный
    - Всегда нулевой
    - Знак не связан со знаками локальных производных
