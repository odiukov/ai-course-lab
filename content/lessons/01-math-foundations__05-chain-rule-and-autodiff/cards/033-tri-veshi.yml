- concept: обратный проход выполняется после топологической сортировки графа и идёт от результата к входам
  question: Расположи действия движка autograd при обратном проходе в правильном порядке.
  explanation: Топологический порядок учитывает зависимости между узлами. Его обратный обход гарантирует, что градиент от последующих операций придёт к узлу до того, как движок передаст его дальше к входам.
  kind: order
  items:
    - Топологически упорядочить узлы так, чтобы входы каждой операции находились раньше её результата
    - Начать обработку с конечного результата графа
    - Двигаться по узлам в обратном топологическом порядке и применять в каждом узле цепное правило
