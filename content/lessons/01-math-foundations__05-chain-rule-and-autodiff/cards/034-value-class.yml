- concept: функция обратного прохода листового узла по умолчанию ничего не делает
  question: Что должна делать функция `_backward` у листового объекта `Value`, который не был получен из других узлов, и почему?
  explanation: Листовой `Value` представляет исходное число и не зависит от других узлов. Поэтому безопасная функция обратного прохода по умолчанию — пустая операция.
  kind: open
  reference: Она должна завершаться без действий, поскольку у листового узла нет предшественников, которым можно передать градиент.
  id: 034-value-class-1
  fingerprint: 5b60b6b8
- concept: метка операции служит для отображения графа и не участвует в вычислении значений или градиентов
  question: Из уже построенного вычислительного графа удалили только поле `_op`, сохранив `data`, `grad`, `_prev` и `_backward`. Что изменится?
  explanation: '`_op` — диагностическая метка операции. Значения хранятся в `data`, связи — в `_prev`, а правила обратного прохода — в `_backward`, поэтому удаление метки не меняет вычисления.'
  kind: choice
  options:
    - Прямой проход перестанет вычислять значения
    - Обратный проход больше не сможет передавать градиенты
    - Численные результаты сохранятся, но станет труднее читать и визуализировать граф
  correct: 2
