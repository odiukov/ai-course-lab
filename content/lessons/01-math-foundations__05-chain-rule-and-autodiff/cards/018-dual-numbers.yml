- concept: при сложении дуальных чисел их производные складываются
  question: Складывают дуальные числа (8, −6) и (−4, 11). Чему равна производная, то есть вторая компонента результата?
  explanation: 'Компоненты складываются независимо: значение результата равно 8 + (−4), а производная — −6 + 11 = 5.'
  kind: numeric
  answer: 5
