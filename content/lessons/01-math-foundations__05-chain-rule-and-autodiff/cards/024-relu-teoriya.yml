- concept: кусочно-линейное преобразование входа функцией ReLU
  question: Как ReLU преобразует входное значение?
  explanation: ReLU выбирает максимум между нулём и входом. Поэтому её положительная ветвь совпадает с тождественной функцией, а отрицательная ветвь постоянна.
  kind: choice
  options:
    - Ограничивает любой вход фиксированным диапазоном
    - Меняет знак положительного входа
    - Положительный вход пропускает без изменения, а отрицательный обнуляет
  correct: 2
  id: 024-relu-teoriya-1
  fingerprint: '86070e84'
- concept: ReLU не ослабляет градиент на активной положительной ветви
  question: Почему цепочка активных ReLU сама по себе не вызывает такого затухания градиента, как цепочка сигмоид?
  explanation: При положительном входе ReLU пропускает значение без изменения, а её локальная производная равна единице. В обратном проходе входящий градиент на этой ветви сохраняет величину.
  kind: open
  reference: На положительной ветви ReLU имеет единичную локальную производную, поэтому проходящий через неё градиент не уменьшается.
