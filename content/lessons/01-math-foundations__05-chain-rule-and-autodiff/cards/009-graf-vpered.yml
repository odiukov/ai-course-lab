- concept: сложное выражение представляется последовательностью узлов с элементарными операциями
  question: Как корректно представить вычисление y = relu(p · q + r) в вычислительном графе?
  explanation: 'Каждый узел выполняет одну элементарную операцию: сначала умножение создаёт промежуточное значение, затем сложение, после чего применяется relu.'
  kind: choice
  options:
    - Отдельными узлами умножения, сложения и relu, соединёнными промежуточными значениями
    - Одним узлом, внутри которого записано всё выражение целиком
    - Узлами только для входных переменных, без узлов для операций
    - Одним ребром от всех входов непосредственно к y
  correct: 0
