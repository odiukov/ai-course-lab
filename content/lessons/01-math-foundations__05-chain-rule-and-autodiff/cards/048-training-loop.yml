- concept: градиентный спуск изменяет параметр в направлении, противоположном градиенту потери
  question: Почему при градиентном спуске из значения параметра вычитают произведение learning rate на его градиент?
  explanation: Градиент показывает направление наиболее быстрого локального роста потери. Обновление p.data -= lr * p.grad делает небольшой шаг в противоположную сторону; learning rate задаёт размер этого шага.
  kind: choice
  options:
    - Градиент направлен в сторону локального роста потери, поэтому для её уменьшения нужно двигаться в противоположную сторону
    - Вычитание гарантирует, что значение параметра всегда будет положительным
    - Знак минус нужен только для функций потерь, содержащих квадрат
    - Вычитание автоматически нормализует градиенты всех параметров
  correct: 0
  id: 048-training-loop-1
  fingerprint: 9ad1e603
- concept: одна итерация обучения требует прямого прохода, подготовки градиентов, обратного прохода и обновления параметров в определённом порядке
  question: Расположите действия одной итерации обучения нейросети в правильном порядке.
  explanation: Градиенты должны соответствовать потере, вычисленной при текущих значениях параметров. После их обнуления loss.backward() заполняет p.grad, затем веса изменяются через p.data, а следующая итерация строит новый граф.
  kind: order
  items:
    - Выполнить прямой проход и вычислить потерю
    - Обнулить градиенты параметров
    - Запустить обратный проход от потери
    - Обновить значения параметров по вычисленным градиентам
  id: 048-training-loop-2
  fingerprint: c8c4fb97
- concept: после обновления параметров следующий градиент нужно вычислять по новому прямому проходу
  question: Почему после изменения весов нельзя повторно использовать прежнюю потерю и её вычислительный граф для следующего шага обучения?
  explanation: В micrograd граф создаётся во время вычисления предсказаний и потери. Обновление p.data меняет числа параметров, но не пересчитывает уже созданные узлы, поэтому следующую итерацию начинают с нового прямого прохода.
  kind: open
  reference: Прежняя потеря и сохранённые промежуточные значения были вычислены со старыми весами, поэтому их градиенты описывают старое состояние модели. После обновления весов нужен новый прямой проход, новая потеря и новый обратный проход.
  id: 048-training-loop-3
  fingerprint: 56e4417f
