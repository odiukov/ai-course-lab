- concept: градиенты autodiff и конечных разностей сравнивают с допуском, а не на точное равенство
  question: Почему при gradient checking нельзя требовать точного равенства автоматического и численного градиентов?
  explanation: Конечная разность содержит погрешность приближения, а слишком маленький шаг усиливает ошибки округления. Небольшое расхождение ожидаемо; подозрительным является расхождение, значительно превышающее выбранный допуск.
  kind: open
  reference: Численная производная является приближением с конечным шагом, а вычисления с плавающей точкой вносят округление. Поэтому корректные градиенты могут немного различаться, и сравнивать их нужно с разумным допуском.
  id: 049-gradient-check-2
