- concept: прямой и обратный режимы вычисляют одинаковые производные, но в разном порядке и с разной стоимостью
  question: Может ли корректно реализованный прямой режим дать для той же функции и той же точки другое значение производной, чем обратный режим? Объясните своими словами.
  explanation: 'Выбор режима не меняет математический результат. Он определяет порядок вычислений: прямой режим распространяет чувствительности от входов, а обратный — от выходов.'
  kind: open
  reference: Нет. Оба режима применяют одно и то же цепное правило и должны получить одинаковую производную. Они различаются направлением распространения производных и вычислительной стоимостью.
