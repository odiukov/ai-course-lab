- concept: прямой режим вычисляет значения и их производные в направлении потока данных
  question: Расположите этапы вычисления производной в прямом режиме в правильном порядке.
  explanation: Forward mode движется от входа к выходу. На каждом узле одновременно вычисляются обычное значение и его производная по входу, выбранному затравкой.
  kind: order
  items:
    - Задать затравку для выбранного входа
    - Обходить операции по направлению вычисления значений и вместе с ними распространять производные
    - Прочитать производную результата по выбранному входу
