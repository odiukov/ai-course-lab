- concept: gradient checking применяют после реализации нового backward на небольшом детерминированном примере
  question: В какой ситуации gradient checking принесёт наибольшую пользу?
  explanation: Gradient checking нужен прежде всего для проверки новой реализации backward. Небольшой детерминированный пример позволяет независимо сопоставить autodiff с численной производной.
  kind: choice
  options:
    - Сразу после реализации собственной дифференцируемой операции — на небольшом детерминированном выражении
    - На каждой итерации обучения — одновременно для всех параметров модели
    - При проверке стохастического слоя с новой случайной маской в каждом прямом проходе
  correct: 0
  id: 050-when-gradcheck-1
  fingerprint: 7ff6f113
- concept: для численной проверки градиента случайность должна быть отключена или воспроизводиться одинаково
  question: Почему конечные разности ненадёжно проверяют градиент стохастической операции и как подготовить такую операцию к проверке?
  explanation: Численная производная предполагает, что сравниваются значения одной и той же функции при близких аргументах. Если случайная маска или другой случайный выбор меняется между проходами, это предположение нарушается.
  kind: open
  reference: При разных случайных исходах значения функции меняются не только из-за возмущения входа, поэтому конечная разность измеряет смесь производной и случайного шума. На время проверки случайность нужно отключить либо зафиксировать её состояние.
  id: 050-when-gradcheck-2
  fingerprint: b1515944
- concept: стоимость покоординатного gradient checking линейно растёт с числом параметров
  question: Заполни оценку числа дополнительных прямых вычислений при покоординатной проверке модели с P параметрами.
  explanation: Каждую координату приходится отдельно возмущать и заново вычислять функцию. Поэтому полная проверка быстро дорожает с ростом модели и не подходит для выполнения внутри цикла обучения.
  kind: cloze
  template: 'Стоимость конечных разностей по всем параметрам: ___ по числу параметров P.'
  answer: O(P)
  accept:
    - линейная
    - линейно
    - пропорциональна P
  id: 050-when-gradcheck-3
  fingerprint: 52d3ad22
