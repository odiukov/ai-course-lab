<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Прямой проход: 2 × 3 + 1 = 7</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1a1a1a; --muted:#5a6472;
    --node:#f2f5fa; --stroke:#2f6fd0; --edge:#8892a0; --accent:#c4451c;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12161c; --fg:#e8ecf2; --muted:#9aa5b4;
      --node:#1c2430; --stroke:#6ea8ff; --edge:#6f7c8d; --accent:#ff9d6e;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  .wrap{max-width:100%;padding:8px 4px;box-sizing:border-box;}
  h2{font-size:15px;margin:0 0 6px;font-weight:600;text-align:center;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .fallback{padding:10px;font-size:14px;line-height:1.5;color:var(--fg);}
  text{fill:var(--fg);}
  .lbl{font-size:13px;}
  .val{font-size:13px;fill:var(--accent);}
  .cap{font-size:12px;fill:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
  <h2>Прямой проход: 2 × 3 + 1 = 7</h2>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById("host");
  try{
    // ---- данные схемы (координаты в условных единицах) ----
    var NODES = [
      {id:"x1",  x:0,  y:2,  r:0.55, text:"x1 = 2", kind:"in"},
      {id:"x2",  x:0,  y:0,  r:0.55, text:"x2 = 3", kind:"in"},
      {id:"mul", x:2,  y:1,  r:0.55, text:"×",      kind:"op"},
      {id:"b",   x:2,  y:-1, r:0.55, text:"b = 1",  kind:"in"},
      {id:"add", x:4,  y:0,  r:0.55, text:"+",      kind:"op"},
      {id:"relu",x:6,  y:0,  r:0.62, text:"relu",   kind:"op"},
      {id:"y",   x:8,  y:0,  r:0.55, text:"y = 7",  kind:"out"}
    ];
    var EDGES = [
      {from:"x1", to:"mul", label:"",      side:"up"},
      {from:"x2", to:"mul", label:"",      side:"down"},
      {from:"mul",to:"add", label:"a = 6", side:"up"},
      {from:"b",  to:"add", label:"",      side:"down"},
      {from:"add",to:"relu",label:"c = 7", side:"up"},
      {from:"relu",to:"y",  label:"y = 7", side:"up"}
    ];
    var CAPTIONS = [
      {x:1, y:-2.15, text:"значения идут слева направо, узел за узлом", anchor:"start"},
      {x:6, y:2.05,  text:"c = 7 > 0, relu пропускает как есть", anchor:"middle"}
    ];

    // ---- одна пара функций перевода ----
    var ORIGIN = {x:70, y:170};   // пиксели: где лежит (0,0)
    var SCALE  = {x:78, y:-58};   // пикселей на единицу; y вверх
    function sx(x){ return ORIGIN.x + x * SCALE.x; }
    function sy(y){ return ORIGIN.y + y * SCALE.y; }

    // литералы: холст, отступы подписи, толщина, кегль
    var W = 760, H = 300;
    var PAD = 7, HEAD = 9, STROKE = 1.6;

    var NS = "http://www.w3.org/2000/svg";
    function el(n, a){ var e = document.createElementNS(NS, n);
      for(var k in a) e.setAttribute(k, a[k]); return e; }

    var svg = el("svg", {viewBox:"0 0 "+W+" "+H,
      preserveAspectRatio:"xMidYMid meet", role:"img",
      "aria-label":"Вычислительный граф прямого прохода: x1=2 и x2=3 в умножение, a=6, плюс b=1 даёт c=7, relu даёт y=7"});
    svg.appendChild(el("rect",{x:0,y:0,width:W,height:H,fill:"var(--bg)"}));

    var byId = {};
    NODES.forEach(function(n){ byId[n.id] = n; });

    // ---- рёбра ----
    var gE = el("g", {});
    svg.appendChild(gE);
    EDGES.forEach(function(e){
      var A = byId[e.from], B = byId[e.to];
      var ax = sx(A.x), ay = sy(A.y), bx = sx(B.x), by = sy(B.y);
      var dx = bx-ax, dy = by-ay, L = Math.sqrt(dx*dx+dy*dy);
      var ux = dx/L, uy = dy/L;
      // радиусы узлов тоже через перевод: r в единицах по x
      var ra = sx(A.r) - sx(0), rb = sx(B.r) - sx(0);
      var x1 = ax + ux*ra, y1 = ay + uy*ra;
      var x2 = bx - ux*(rb + HEAD*0.6), y2 = by - uy*(rb + HEAD*0.6);

      gE.appendChild(el("line",{x1:x1,y1:y1,x2:x2,y2:y2,
        stroke:"var(--edge)","stroke-width":STROKE,"stroke-linecap":"round"}));

      // наконечник
      var px = -uy, py = ux;
      var tipX = x2 + ux*HEAD*0.6, tipY = y2 + uy*HEAD*0.6;
      gE.appendChild(el("polygon",{fill:"var(--edge)", points:
        (tipX)+","+(tipY)+" "+
        (tipX-ux*HEAD+px*HEAD*0.45)+","+(tipY-uy*HEAD+py*HEAD*0.45)+" "+
        (tipX-ux*HEAD-px*HEAD*0.45)+","+(tipY-uy*HEAD-py*HEAD*0.45)}));

      if(e.label){
        // подпись у хвоста ребра, сдвинута в сторону от линии
        var qx = x1 + ux*(L*0.28), qy = y1 + uy*(L*0.28);
        var off = (e.side === "up") ? -PAD : PAD;
        var t = el("text",{x:qx, y:qy + off*1.5,
          "text-anchor":"middle", "class":"val",
          "dominant-baseline": (e.side==="up" ? "auto" : "hanging")});
        t.textContent = e.label;
        gE.appendChild(t);
      }
    });

    // ---- узлы ----
    var gN = el("g", {});
    svg.appendChild(gN);
    NODES.forEach(function(n){
      var cx = sx(n.x), cy = sy(n.y);
      var r  = sx(n.r) - sx(0);
      gN.appendChild(el("circle",{cx:cx, cy:cy, r:r,
        fill:"var(--node)", stroke:"var(--stroke)","stroke-width":STROKE}));
      var t = el("text",{x:cx, y:cy, "text-anchor":"middle",
        "dominant-baseline":"central", "class":"lbl"});
      t.textContent = n.text;
      gN.appendChild(t);
    });

    // ---- пояснения ----
    CAPTIONS.forEach(function(c){
      var t = el("text",{x:sx(c.x), y:sy(c.y), "text-anchor":c.anchor,
        "class":"cap", "dominant-baseline":"middle"});
      t.textContent = c.text;
      svg.appendChild(t);
    });

    host.appendChild(svg);
  }catch(err){
    host.innerHTML = '<div class="fallback">' +
      'Схема не построилась. Она должна показывать вычислительный граф: ' +
      'входы <b>x1 = 2</b> и <b>x2 = 3</b> сходятся в узле умножения — на выходе <b>a = 6</b>; ' +
      'далее <b>a</b> и смещение <b>b = 1</b> идут в узел сложения — получается <b>c = 7</b>; ' +
      '<b>c</b> проходит через <b>relu</b>, и так как 7 > 0, на выходе <b>y = 7</b>.' +
      '</div>';
  }
})();
</script>
</body>
</html>
