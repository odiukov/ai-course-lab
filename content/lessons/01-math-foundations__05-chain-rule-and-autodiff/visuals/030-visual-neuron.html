<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Градиенты одного нейрона по шагам</title>
<style>
  :root{
    --bg:#fbfbfd; --fg:#1b1f2a; --node:#e8edf7; --edge:#41527a;
    --acc:#b5471c; --mut:#5d6577;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171f; --fg:#e7eaf3; --node:#222a38; --edge:#8ea6d8;
      --acc:#f2996a; --mut:#9aa3b7;
    }
  }
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:860px;margin:0 auto;padding:8px 10px 12px}
  h1{font-size:15px;font-weight:600;margin:0 0 4px}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg)}
  #fb{font-size:13px;line-height:1.45;color:var(--fg)}
  text{font-family:inherit;fill:var(--fg)}
  .val{font-size:13px}
  .op{font-size:15px}
  .grad{font-size:12px;fill:var(--acc)}
  .mut{font-size:12px;fill:var(--mut)}
  .fwd{stroke:var(--edge);stroke-width:1.6;fill:none}
  .fh{fill:var(--edge)}
  .bwd{stroke:var(--acc);stroke-width:1.6;fill:none;stroke-dasharray:6 4}
  .bh{fill:var(--acc)}
  .box{fill:var(--node);stroke:var(--edge);stroke-width:1.4}
  .cir{fill:var(--node);stroke:var(--edge);stroke-width:1.4}
</style>
</head>
<body>
<div class="wrap">
  <h1>Один нейрон: вперёд числа, назад пять градиентов</h1>
  <svg id="d" viewBox="0 0 780 264" role="img"
       aria-label="Вычислительный граф одного нейрона с сигмоидой и пятью градиентами"></svg>
  <p id="fb" hidden>Схема: граф нейрона w=0,5, x=2, b=−1, сигмоида. Вперёд: w·x = 1,
    z = 0, a = s(0) = 0,5. Назад: ∂L/∂a = 0,4, s′(0) = 0,25, ∂L/∂z = 0,4·0,25 = 0,1,
    далее ∂L/∂w = 0,1·2 = 0,2, ∂L/∂b = 0,1·1 = 0,1, ∂L/∂x = 0,1·0,5 = 0,05.</p>
</div>
<script>
(function(){
  var svg=document.getElementById('d');
  try{
    var D={
      s:46, ox:228, oy:175,
      bw:0.95, bh:0.32, r:0.42, ah:0.20, aw:0.075,
      boxes:[
        {id:'w', x:0,    y:3.0, t:'w = 0,5'},
        {id:'x', x:0,    y:1.6, t:'x = 2'},
        {id:'b', x:0,    y:0.2, t:'b = \u22121'},
        {id:'a', x:10.2, y:1.4, t:'a = 0,5'}
      ],
      ops:[
        {id:'mul', x:3.2, y:2.3, t:'\u00d7'},
        {id:'add', x:5.6, y:1.4, t:'+'},
        {id:'sig', x:7.8, y:1.4, t:'s'}
      ],
      edges:[['w','mul'],['x','mul'],['b','add'],['mul','add'],['add','sig'],['sig','a']],
      left:[
        {n:'w', t:'\u2202L/\u2202w = 0,1\u00b72 = 0,2'},
        {n:'x', t:'\u2202L/\u2202x = 0,1\u00b70,5 = 0,05'},
        {n:'b', t:'\u2202L/\u2202b = 0,1\u00b71 = 0,1'}
      ],
      texts:[
        {x:4.55, y:1.78, t:'w\u00b7x = 1',                  a:'start',  dx:2,  dy:-8,  c:'val'},
        {x:6.7,  y:1.4,  t:'z = 0',                          a:'middle', dx:0,  dy:-11, c:'val'},
        {x:7.8,  y:2.5,  t:'s\u2032(0) = 0,25',              a:'middle', dx:0,  dy:0,   c:'mut'},
        {x:9.0,  y:1.4,  t:'\u2202L/\u2202a = 0,4',          a:'middle', dx:0,  dy:-11, c:'grad'},
        {x:6.7,  y:1.4,  t:'\u2202L/\u2202z = 0,4\u00b70,25 = 0,1', a:'middle', dx:0, dy:34, c:'grad'},
        {x:10.6, y:-0.8, t:'\u043d\u0430\u0437\u0430\u0434', a:'end',    dx:-4, dy:-9,  c:'grad'},
        {x:4.7,  y:-1.6, t:'\u0441\u043f\u043b\u043e\u0448\u043d\u044b\u0435 \u0441\u0442\u0440\u0435\u043b\u043a\u0438 \u2014 \u0432\u043f\u0435\u0440\u0451\u0434; \u043f\u0443\u043d\u043a\u0442\u0438\u0440 \u2014 \u043d\u0430\u0437\u0430\u0434: \u043e\u0434\u0438\u043d \u2202L/\u2202z = 0,1 \u0434\u0430\u0451\u0442 \u0442\u0440\u0438 \u0433\u0440\u0430\u0434\u0438\u0435\u043d\u0442\u0430',
         a:'middle', dx:0, dy:0, c:'mut'}
      ],
      bus:[[11.0,-0.8],[-1.7,-0.8]]
    };

    /* единственный перевод координат */
    function sx(v){ return D.ox + D.s*v; }
    function sy(v){ return D.oy - D.s*v; }
    function len(v){ return sx(v) - sx(0); }

    var NS='http://www.w3.org/2000/svg';
    function el(n,at){ var e=document.createElementNS(NS,n);
      for(var k in at) e.setAttribute(k,at[k]); svg.appendChild(e); return e; }
    function txt(px,py,s,anchor,cls){
      var e=el('text',{x:px,y:py,'text-anchor':anchor,class:cls,'dominant-baseline':'middle'});
      e.appendChild(document.createTextNode(s)); return e;
    }

    var byId={};
    D.boxes.forEach(function(n){ n.kind='box'; byId[n.id]=n; });
    D.ops.forEach(function(n){ n.kind='op'; byId[n.id]=n; });

    function border(n,tx,ty){
      var px=sx(n.x), py=sy(n.y), dx=tx-px, dy=ty-py;
      var L=Math.sqrt(dx*dx+dy*dy) || 1;
      if(n.kind==='op'){ var r=len(D.r); return [px+dx/L*r, py+dy/L*r]; }
      var hw=len(D.bw), hh=sy(0)-sy(D.bh);
      var t=Math.min(hw/Math.max(Math.abs(dx),1e-6), hh/Math.max(Math.abs(dy),1e-6));
      return [px+dx*t, py+dy*t];
    }

    function arrow(x1,y1,x2,y2,line,head){
      var ah=len(D.ah), aw=len(D.aw);
      var a=Math.atan2(y2-y1,x2-x1), cx=Math.cos(a), cy=Math.sin(a);
      var bx=x2-cx*ah, by=y2-cy*ah;
      el('line',{x1:x1,y1:y1,x2:bx,y2:by,class:line});
      el('polygon',{class:head,points:
        x2+','+y2+' '+(bx-cy*aw)+','+(by+cx*aw)+' '+(bx+cy*aw)+','+(by-cx*aw)});
    }

    /* рёбра вперёд */
    D.edges.forEach(function(e){
      var A=byId[e[0]], B=byId[e[1]];
      var p=border(A, sx(B.x), sy(B.y));
      var q=border(B, sx(A.x), sy(A.y));
      arrow(p[0],p[1],q[0],q[1],'fwd','fh');
    });

    /* обратная шина */
    arrow(sx(D.bus[0][0]), sy(D.bus[0][1]), sx(D.bus[1][0]), sy(D.bus[1][1]), 'bwd','bh');

    /* узлы */
    D.boxes.forEach(function(n){
      var x0=sx(n.x-D.bw), y0=sy(n.y+D.bh);
      el('rect',{x:x0, y:y0, width:sx(n.x+D.bw)-x0, height:sy(n.y-D.bh)-y0,
                 rx:len(0.12), class:'box'});
      txt(sx(n.x), sy(n.y), n.t, 'middle', 'val');
    });
    D.ops.forEach(function(n){
      el('circle',{cx:sx(n.x), cy:sy(n.y), r:len(D.r), class:'cir'});
      txt(sx(n.x), sy(n.y), n.t, 'middle', 'op');
    });

    /* градиенты слева от входов: якорь end, отступ влево */
    D.left.forEach(function(g){
      var n=byId[g.n];
      txt(sx(n.x-D.bw)-10, sy(n.y), g.t, 'end', 'grad');
    });

    /* остальные подписи: каждая со своим якорем и стороной */
    D.texts.forEach(function(t){
      txt(sx(t.x)+t.dx, sy(t.y)+t.dy, t.t, t.a, t.c);
    });
  }catch(err){
    svg.setAttribute('hidden','hidden');
    document.getElementById('fb').removeAttribute('hidden');
  }
})();
</script>
</body>
</html>
