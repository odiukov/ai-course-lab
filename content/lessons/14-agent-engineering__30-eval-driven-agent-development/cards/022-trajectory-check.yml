- concept: отношение шагов читается только вместе с успехом результата, иначе метрика поощряет короткие неверные прогоны
  question: 'Прогон A: агент дал неверный ответ за 6 шагов. Прогон B: верный ответ за 20 шагов при эталоне 8. Что показывает метрика эффективности траектории?'
  explanation: 'Число шагов — второе измерение поверх результата, а не замена ему. Иначе оптимизация метрики вознаграждала бы агента, который быстро сдаётся: 6 шагов при неверном ответе — не эффективность, а провал.'
  kind: choice
  options:
    - A лучше, потому что его траектория короче эталона
    - Метрика применима только к успешным прогонам; A сначала проваливает проверку результата, а эффективность оценивается у B
    - Обе траектории одинаково хороши, так как обе отличаются от эталона
    - B провален, потому что превысил эталон более чем вдвое
