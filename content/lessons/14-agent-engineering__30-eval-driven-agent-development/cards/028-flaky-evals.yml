- concept: правильная реакция на нестабильный случай — изолировать его и устранить источник недетерминизма, а не ослаблять порог регрессии
  question: Один eval-случай на неизменном коде даёт то passed, то failed, из-за чего гейт периодически блокирует PR. Что корректно сделать?
  explanation: 'Расширение порога маскирует и настоящие регрессии того же размера, а удаление случая теряет проверяемое обязательство. Причина колебаний лежит в самом случае: случайность генерации, ответ внешнего сервиса, текущее время, остатки данных от прошлого прогона.'
  kind: choice
  options:
    - Поднять допустимое падение доли прохождения так, чтобы колебания перестали блокировать слияние
    - Изолировать случай и убрать источник недетерминизма — зафиксировать seed, снять снапшот внешних ответов и стартового состояния
    - 'Удалить случай из набора: проверка, которой нельзя доверять, бесполезна'
    - Отключить гейт для этого набора и оценивать результаты вручную
  correct: 1
  id: 028-flaky-evals-1
  fingerprint: 5da9cd8f
- concept: нестабильные случаи разрушают гейт через привычку перезапускать сборку, а не через единичную ложную тревогу
  question: Объясни своими словами, почему пара нестабильных случаев обесценивает весь eval-набор, даже если остальные проверки корректны.
  explanation: 'Опасность не в одной ложной тревоге, а в изменении поведения людей. Полезность красного CI держится на условии: повторный запуск при тех же входах и том же коде снова даёт красный.'
  kind: open
  reference: 'Нестабильный случай смешивает два сигнала: реальную поломку и случайный шум, поэтому по красной сборке нельзя судить о продукте. Команда начинает перезапускать прогон «до зелёного», а затем перестаёт воспринимать красный результат как запрет на слияние. Гейт формально остаётся в CI, но больше ничего не блокирует: настоящая регрессия выглядит как очередной каприз проверки и проходит в продакшен.'
  id: 028-flaky-evals-2
  fingerprint: 77b94261
