- concept: единое хранилище случаев не превращает их в один тип проверки — принадлежность слою хранится в записи
  question: Все eval-случаи проекта лежат в одном реестре и запускаются одной функцией. Объясни своими словами, почему при этом обязательно сохранять для каждого случая метку слоя.
  explanation: Хранение и семантика — разные оси. Реестр даёт единый доступ, метка слоя удерживает границу между сравнением моделей, продуктовой проверкой и продакшен-наблюдением.
  kind: open
  reference: 'Единая форма записи и общий раннер нужны для удобства запуска, но смысл случая задаётся тем, откуда он взялся и на какой вопрос отвечает: сравнение моделей на стандартном наборе, проверка требования продукта до релиза или наблюдение за реальными сессиями. Без метки нельзя ни правильно интерпретировать провал (общая слабость модели или нарушение продуктового требования), ни решить, как часто и в каком окружении гонять случай, ни собрать разбивку результата по слоям. Соседство в одном списке не меняет природу случая: продуктовый случай не становится бенчмарком оттого, что лежит рядом с ним.'
  id: 007-suite-registry-2
