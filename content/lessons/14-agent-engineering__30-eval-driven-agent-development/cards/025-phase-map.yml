- concept: eval для механизма восстановления проверяет точность воспроизведения состояния после намеренного прерывания, а не факт вызова API чекпоинта
  question: Агент умеет продолжать работу с сохранённого чекпоинта после сбоя. Какой eval-случай реально проверяет это свойство?
  explanation: 'Механизм обещает пережить конкретный сбой — остановку посередине. Проверка наличия функции или удачного прогона без сбоя не касается этого обещания. Наблюдаемый сигнал здесь: состояние воспроизведено в точности, действия не потеряны и не выполнены дважды.'
  kind: choice
  options:
    - Вызвать сохранение чекпоинта и убедиться, что файл записан на диск
    - Прервать выполнение посередине, возобновить с чекпоинта и сравнить восстановленное состояние и совершённые действия с непрерывным прогоном
    - Прогнать задачу без сбоев и проверить, что итоговый ответ корректен
    - Убедиться, что модуль чекпоинтов импортируется и настроен в конфигурации
  correct: 1
  id: 025-phase-map-1
  fingerprint: 0f7f1051
- concept: маршрут превращения архитектурного механизма агента в eval-случай
  question: Расставь шаги, которыми архитектурный механизм агента превращается в eval-случай.
  explanation: 'Без последнего звена получается проверка устройства кода, а не надёжности агента. Для ReWOO: планировщик — падение инструмента — перепланирование — задача решена альтернативным путём. Для трассировки: спаны — потеря контекста — обязательные атрибуты — атрибуты присутствуют в экспортированном спане.'
  kind: order
  items:
    - Назвать механизм, надёжность которого нужно подтвердить
    - Определить характерный сбой, который этот механизм обязан пережить
    - Задать ожидаемую реакцию агента на такой сбой
    - Выбрать наблюдаемый сигнал, по которому реакция подтверждается в прогоне
  id: 025-phase-map-2
  fingerprint: 2102844b
