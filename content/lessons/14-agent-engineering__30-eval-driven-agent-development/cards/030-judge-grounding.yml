- concept: часть случаев держат скрытой от цикла оптимизации, чтобы измерить перенос улучшения на незнакомые ситуации
  question: После многих раундов правок агент проходит все eval-случаи, по которым его чинили, но в продакшене качество не изменилось. Какая проверка покажет, есть ли реальное улучшение?
  explanation: 'Знакомые случаи хороши для быстрой отладки, но по ним нельзя отличить надёжность от репетиции ответов. Скрытая часть набора отвечает на другой вопрос: переносится ли улучшение на ситуации, под которые агента не подгоняли. Отсюда же правило периодически менять и обновлять состав проверок.'
  kind: choice
  options:
    - Увеличить число раундов внутреннего цикла и добиться более высоких баллов судьи
    - Прогнать агента на случаях, которые не участвовали в оптимизации и не были видны при отладке
    - Добавить ещё случаев того же вида, что уже есть в наборе
    - Смягчить критерии прохождения, чтобы балл соответствовал ощущениям от продакшена
  correct: 1
  id: 030-judge-grounding-1
  fingerprint: 26a5c811
- concept: оптимизация под LLM-судью поднимает балл через признаки, которые нравятся судье, а не через полезность ответа
  question: Агента много раундов правили по замечаниям LLM-судьи, и средний балл вырос. Объясни, почему такой рост балла может не означать роста качества, и что требовать от судьи, чтобы вердикт опирался на факт.
  explanation: 'Классический пример: ответ «возврат уже отправлен и поступит завтра» звучит правдоподобно и получает высокий балл, хотя в системе платежей возврат не создан. Без опоры на внешний источник одна галлюцинация оценивает другую.'
  kind: open
  reference: 'Судья оценивает текст, поэтому агент может выучить признаки, которые судья вознаграждает: уверенный тон, вежливые формулировки, привычную структуру ответа. Балл растёт, а полезность нет — оптимизируется сигнал, а не результат. Чтобы вердикт опирался на факт, судью заземляют: дают критерии, исходные данные и внешние инструменты (запись заказа, база платежей, калькулятор), и требуют для каждого замечания наблюдаемое основание — какое требование нарушено и чем это подтверждается вне текста ответа.'
  id: 030-judge-grounding-2
  fingerprint: '56285455'
