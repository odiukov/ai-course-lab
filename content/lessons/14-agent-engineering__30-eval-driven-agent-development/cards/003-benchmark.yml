- concept: статические бенчмарки полезны как общая линейка сравнения моделей и как гейт по регрессиям
  question: Если бенчмарк не доказывает пригодность агента для продукта, зачем его вообще держать в наборе проверок?
  explanation: Роль слоя — отбор кандидата и обнаружение регрессии, а не решение о релизе. Решение принимается вместе с собственными случаями и наблюдениями в продакшене.
  kind: open
  reference: 'Бенчмарк даёт одинаковые условия для всех кандидатов, поэтому годится для двух вещей: сравнивать модели между собой при выборе и отсеивать явно слабые варианты, а также служить гейтом по регрессиям — заметить, что после смены версии или дообучения базовая способность просела. Это грубая, но дешёвая и сопоставимая линейка; продуктовую пригодность к ней просто не привязывают.'
  id: 003-benchmark-2
  fingerprint: f9491093
- concept: продуктовые сбои остаются невидимыми для бенчмарка, если в его наборе нет соответствующего типа ситуации
  question: Агент поддержки уверенно вызывает инструменты в бенчмарке, но в магазине выполняет возврат вместо отмены и не спрашивает подтверждения. Почему бенчмарк не поймал этот класс сбоя?
  explanation: Проверка не может провалить то, чего она не описывает. Специфика домена — какие действия необратимы, что требует подтверждения, какие данные лишние — задаётся только собственными случаями.
  kind: choice
  options:
    - Его набор заданий фиксирован и не содержит ситуаций с вашими правилами, данными и требованием подтверждения
    - Бенчмарк вообще не проверяет вызовы инструментов
    - Балл считался на слишком маленькой выборке
    - Модель во время бенчмарка работала с другой температурой
  correct: 0
  id: 003-benchmark-3
