- concept: признак нестабильного случая — расхождение статусов у одного идентификатора при повторных прогонах без изменений
  question: Набор прогнали несколько раз без изменений кода и промптов. Какой признак выделяет нестабильный (flaky) случай?
  explanation: Стабильный провал воспроизводим и указывает на реальную ошибку агента. Flaky-случай меняет вердикт при неизменном входе, поэтому его результату нельзя доверять ни как подтверждению, ни как сигналу регрессии.
  kind: choice
  options:
    - Случай проваливается во всех прогонах подряд
    - У одного идентификатора среди прогонов встречаются и успех, и провал
    - Случай выполняется дольше остальных случаев набора
    - Случай относится к онлайн-слою оценки
  correct: 1
  id: 029-flaky-cases-1
  fingerprint: 98e38c58
- concept: для вывода о нестабильности нужны минимум два наблюдения с разными статусами по одному идентификатору
  question: 'Набор прогнали 4 раза. Случай A: passed, passed, passed, passed. Случай B: failed, failed, failed, failed. Случай C: passed, failed, failed, passed. Случай D наблюдался один раз со статусом passed. Сколько случаев функция поиска нестабильных вернёт?'
  explanation: Только C имеет оба статуса. A и B стабильны, у D единственное наблюдение — смену результата по нему увидеть невозможно, поэтому объявлять его нестабильным нет оснований.
  kind: numeric
  answer: 1
  tolerance: 0.5
  id: 029-flaky-cases-2
  fingerprint: 775b2cdd
- concept: нестабильный идентификатор попадает в отчёт ровно один раз независимо от числа наблюдений
  question: Идентификатор случая встретился в журнале 9 раз со смешанными статусами. Каким должен быть его вклад в результат функции поиска нестабильных случаев?
  explanation: Функция группирует наблюдения по идентификатору и отвечает на вопрос «какие случаи нестабильны». Дубликаты и плавающий порядок вывода сами стали бы шумом в CI — тем самым, от которого функция защищает.
  kind: choice
  options:
    - Девять записей — по одной на каждое наблюдение
    - 'Одна запись: результат перечисляет идентификаторы, а не наблюдения, и порядок вывода задан детерминированно'
    - Столько записей, сколько было провалов среди девяти наблюдений
    - 'Ни одной: слишком много наблюдений делает случай стабильным'
  correct: 1
  id: 029-flaky-cases-3
  fingerprint: aa1745bf
