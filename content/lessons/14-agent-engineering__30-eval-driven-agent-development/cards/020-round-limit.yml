- concept: исчерпание лимита — точка передачи задачи другому обработчику, а не момент молчаливой выдачи последней версии как обычного ответа
  question: Цикл дошёл до лимита раундов, и последняя версия ответа так и не принята оценщиком. Объясни, что должно произойти дальше в системе и почему просто отдать эту версию пользователю недостаточно.
  explanation: Лимит обещает предсказуемый конец процесса, а не качество результата. Поэтому у выхода по лимиту должна быть отдельная ветка обработки, иначе система теряет единственный признак, отличающий принятый ответ от остановленной попытки.
  kind: open
  reference: 'Исчерпание лимита — это остановка процесса, а не достижение цели. Последняя версия сопровождается фактическим вердиктом оценщика, то есть помечена как непринятая, и по этому признаку маршрутизируется дальше: для важных задач — на человека или на запасной обработчик, иначе — на явный отказ или деградированный ответ. Тихая выдача её как обычного результата стирает различие между проверенным успехом и остановкой по таймеру, и такой выход попадёт к пользователю без всякого сигнала о проблеме.'
