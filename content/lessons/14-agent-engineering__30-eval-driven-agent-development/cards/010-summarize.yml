- concept: 'инвариант сводки: сумма запусков по категориям равна общему числу запусков'
  question: Объясни своими словами, почему сумма запущенных случаев по всем категориям обязана совпадать с общим числом запущенных, и что означает расхождение.
  explanation: 'Дешёвая проверка целостности отчёта: сойтись обязано всегда. Несходящаяся сводка врёт про оба числа сразу — и про долю слоя, и про общий итог.'
  kind: open
  reference: 'Каждый результат увеличивает ровно два счётчика: общий и счётчик своей категории. Значит сумма по категориям — это тот же набор записей, разложенный по слоям, и она обязана сойтись с общим итогом. Если сумма меньше общей — часть записей не попала ни в одну категорию: у них неизвестная или пустая категория, и эти случаи невидимы в разбивке. Если больше — запись учтена дважды, и доля прохождения слоя посчитана по раздутому знаменателю. Расхождение означает ошибку агрегации, а не свойство данных, поэтому его стоит проверять явно.'
  id: 010-summarize-3
  fingerprint: 4958a13b
