- concept: 'сводка — чистая агрегация над уже полученными результатами: она ничего не выполняет и не переоценивает'
  question: Функция сводки получает список результатов eval-случаев. Что она имеет право делать?
  explanation: 'Сводка — чистая функция над готовыми данными. Любой перезапуск внутри неё делает число невоспроизводимым (на тех же результатах получится другой отчёт), а отбрасывание провалов превращает метрику в самообман: доля прохождения станет всегда равна 1.'
  kind: choice
  options:
    - Только читать признак прохождения и категорию каждой записи и считать по ним счётчики
    - Перезапускать случаи с пограничным результатом, чтобы уточнить вердикт
    - Заново сравнивать вывод агента с ожидаемым, если сомневается в записи
    - Отбрасывать записи провалившихся случаев, чтобы доля не искажалась шумом
  correct: 0
