- concept: один раунд цикла evaluator-optimizer = одна генерация плюс одна её оценка, и успех обрывает цикл
  question: Гарнесс гоняет один eval-случай в цикле evaluator-optimizer с лимитом 6 раундов. Ответ агента принят evaluator на четвёртом раунде. Сколько раз за прогон случая был вызван evaluator?
  explanation: 'Раунд — это ровно одна попытка агента и ровно одна её оценка, поэтому вызовов evaluator столько же, сколько попыток. Принятый ответ останавливает цикл досрочно: раунды 5 и 6 не выполняются, вызовов 4, а не 6.'
  kind: numeric
  answer: 4
  tolerance: 0.5
  id: 006-run-case-1
  fingerprint: 5aba94e1
- concept: доработка, предложенная после исчерпания лимита раундов, не проверена и не может считаться прохождением
  question: Лимит раундов исчерпан, последний ответ агента evaluator отклонил, но optimizer уже успел сформулировать следующую доработку. Каким должен быть результат случая?
  explanation: 'Прохождение фиксирует только вердикт evaluator по реально сгенерированному ответу. Непроверенная правка — гипотеза; засчитать её значило бы поднять долю прохождения на догадке. Исключать случай из подсчёта тоже нельзя: тогда гейт CI перестанет видеть регрессию.'
  kind: choice
  options:
    - 'Провален: предложенная доработка не прошла оценку, а без оценки она ничем не подтверждена'
    - 'Пройден: раз optimizer нашёл исправление, дефект считается устранённым'
    - Пройден с пометкой «условно», потому что доработка выглядит корректной
    - Результат неопределён, случай исключается из подсчёта доли прохождения
  correct: 0
  id: 006-run-case-2
  fingerprint: 11dcd5b0
- concept: критерий прохождения хранится в описании случая, а не в коде оркестрации цикла
  question: Функция, прогоняющая один eval-случай через цикл попыток, содержит внутри себя сравнение ответа агента с заранее вписанной эталонной строкой. Что с этим не так?
  explanation: 'Оркестратор отвечает за процесс: попытка, оценка, замечание, доработка, остановка. Что считать прохождением — свойство самого случая. Иначе добавление нового случая требует правки кода цикла, а evaluator подменяется скрытой проверкой, которую не видно ни в реестре, ни в отчёте гейта.'
  kind: choice
  options:
    - Критерий прохождения принадлежит описанию случая; зашитый в оркестратор, он не переносится на другие случаи и делает реестр случаев декоративным
    - 'Ничего, так быстрее: меньше вызовов evaluator на прогон'
    - Проблема только в производительности — сравнение строк дороже вызова evaluator
    - Это допустимо для custom-случаев, но запрещено для benchmark-случаев
  correct: 0
  id: 006-run-case-3
  fingerprint: 9760f34a
