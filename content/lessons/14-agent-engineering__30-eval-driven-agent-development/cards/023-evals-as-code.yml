- concept: 'evals версионируются вместе с промптами и кодом: изменение поведения и его проверка едут одним PR'
  question: Что практически означает требование «evals лежат рядом с кодом»?
  explanation: 'Смысл не в расположении файлов, а в общей истории версий: ревьюер видит изменение поведения и доказательство его надёжности как одну работу, и поменять агента, не встретившись с его проверкой, невозможно.'
  kind: choice
  options:
    - Файлы evals обязаны лежать в соседней папке с исходниками, иначе требование нарушено
    - Evals версионируются вместе с кодом и промптами, поэтому правка поведения и результаты её проверки приходят в одном изменении
    - Evals хранятся в отдельном сервисе, но с той же схемой именования
    - Достаточно, чтобы владелец evals сидел в одной команде с авторами промптов
  correct: 1
  id: 023-evals-as-code-1
  fingerprint: d0aae7d0
- concept: автоматический запуск набора на каждом изменении снимает зависимость проверки от того, вспомнил ли кто-то её запустить
  question: Набор eval-случаев хорош, но запускается вручную и по желанию. Какую именно проблему решает перенос его запуска в CI на каждый PR?
  explanation: Ручной запуск отказывает именно в момент спешки — когда правка «очевидно безопасная». Автоматический триггер привязывает прогон к событию (PR), а не к чьему-то намерению.
  kind: choice
  options:
    - Прогон становится быстрее, потому что CI мощнее ноутбука
    - 'Проверка перестаёт зависеть от памяти и дисциплины команды: изменение нельзя влить, не получив результатов'
    - Случаев в наборе становится больше
    - Порог допустимой регрессии больше не нужен
  correct: 1
  id: 023-evals-as-code-2
  fingerprint: 4eb4b337
