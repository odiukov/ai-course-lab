- concept: проходной вердикт требует одновременного выполнения абсолютного порога и отсутствия регрессии
  question: Минимальная допустимая доля прохождения — 0.70, baseline — 0.99, допустимое падение — 0.02. Текущий прогон дал 0.95. Каким будет вердикт гейта?
  explanation: Абсолютный порог и отсутствие регрессии — два независимых условия, соединённых через «и». Высокий абсолютный результат не компенсирует падение относительно рабочей версии.
  kind: choice
  options:
    - 'Пропустить: 0.95 намного выше минимального порога 0.70'
    - 'Заблокировать: падение 0.04 превышает допустимые 0.02'
    - 'Пропустить: доля выше 0.90, регрессия несущественна'
  correct: 1
  id: 016-ci-gate-1
  fingerprint: 146f5b23
- concept: результат ниже абсолютного порога блокирует изменение даже при улучшении относительно baseline
  question: Минимальная допустимая доля прохождения — 0.80, baseline — 0.55, допустимое падение — 0.05. Текущий прогон дал 0.62. Каким будет вердикт гейта?
  explanation: Отсутствие регрессии — только половина условия. Рост с 0.55 до 0.62 не отменяет того, что продукт не дотягивает до заявленного минимального уровня качества.
  kind: choice
  options:
    - 'Пропустить: относительно baseline стало лучше'
    - 'Пропустить: регрессии нет, а порог применяется только к падению'
    - 'Заблокировать: 0.62 ниже минимально допустимых 0.80'
  correct: 2
  id: 016-ci-gate-2
  fingerprint: 0618f2aa
- concept: вердикт гейта — конъюнкция достижения порога и отрицания флага регрессии
  question: Заполни пропуск, чтобы гейт пропускал изменение только при выполнении обоих условий.
  explanation: '`detect_regression` возвращает True при недопустимом падении, поэтому в условие прохождения флаг входит с отрицанием. Возвращать наружу нужно и вердикт, и сам флаг — иначе непонятна причина блокировки.'
  kind: cloze
  template: |-
    regressed = detect_regression(pass_rate, baseline, max_drop)
    passed = pass_rate >= min_pass_rate and ___ regressed
  answer: not
  accept:
    - not
    - 'not '
  id: 016-ci-gate-3
  fingerprint: 22f13466
