- concept: ожидаемый результат eval-случая меняется только вслед за изменением требования продукта, а не подгоняется под текущее поведение агента
  question: Eval-случай, заведённый после продакшен-инцидента, снова падает после крупного рефакторинга агента. Требования продукта не менялись. Что корректно сделать?
  explanation: 'Ожидаемое поведение в случае — это зафиксированное требование. Подгонка ожидания под новый выход агента уничтожает саму проверку: набор начнёт подтверждать любое поведение. Менять ожидание законно только тогда, когда изменилось требование продукта, и это отдельное осознанное решение.'
  kind: choice
  options:
    - Переписать ожидаемый результат случая под то, что агент выдаёт сейчас
    - 'Чинить агента: случай фиксирует требование, а не текущее поведение'
    - Пометить случай устаревшим, раз код с момента инцидента полностью переписан
    - Понизить вес случая в наборе, чтобы он не влиял на общую долю прохождения
  correct: 1
  id: 031-living-suite-1
  fingerprint: b55c9577
- concept: перенос продакшен-сессии в eval-случай требует минимального воспроизводящего контекста и обезличивания реальных пользовательских данных
  question: 'Сбой найден в реальной сессии с данными клиента: имя, номер карты, адрес доставки. Что попадает в постоянный eval-случай?'
  explanation: 'Случаю нужны запрос пользователя, значимые данные среды и ожидаемое безопасное поведение — этого достаточно для воспроизведения. Реальные персональные данные удаляют или подменяют вымышленными: набор хранится в репозитории и гоняется в CI, то есть доступен куда шире, чем продакшен-логи. Ссылка на лог не годится — она протухнет, и случай перестанет быть воспроизводимым.'
  kind: choice
  options:
    - Полный дамп сессии как есть — иначе воспроизведение будет неточным
    - Только текст ошибки агента без входных данных
    - Минимальный контекст, воспроизводящий сбой, с персональными данными, заменёнными вымышленными
    - Ссылка на сессию в продакшен-логах вместо самих данных
  correct: 2
  id: 031-living-suite-2
  fingerprint: 8c241d43
- concept: 'стабильно проходящий инцидентный случай не удаляют из набора: его зелёный статус — результат работы защиты, а не признак её ненужности'
  question: Инженер предлагает вычистить из набора старые случаи, которые давно и стабильно проходят, чтобы ускорить CI. Объясни своими словами, почему для случаев, рождённых из продакшен-сбоев, это плохая идея.
  explanation: 'Ценность регрессионного случая измеряется не тем, сколько сбоев он ловит сегодня, а тем, какой сбой он не даёт вернуть. Отсюда правило: случай из инцидента остаётся в наборе навсегда, а не до ближайшей уборки.'
  kind: open
  reference: 'Такой случай проходит именно потому, что защищает: он проверяет, что старый сбой не вернулся. Зелёный статус — следствие исправления, а не доказательство, что проверка больше не нужна. Удалив случай, команда снимает единственную автоматическую защиту от повторного появления той же ошибки при следующем рефакторинге, а знание о причине исправления снова остаётся только в памяти людей. Ускорять CI надо распараллеливанием или разделением наборов по частоте запуска, а не выбрасыванием регрессионных случаев.'
  id: 031-living-suite-3
  fingerprint: e405daab
