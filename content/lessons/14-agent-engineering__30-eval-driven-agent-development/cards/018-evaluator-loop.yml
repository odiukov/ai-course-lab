- concept: цикл evaluator-optimizer конечен только благодаря явному лимиту раундов
  question: 'Поток обёрнут в evaluator-optimizer: предлагающий агент генерирует ответ, оценивающий судит, при провале ответ дорабатывается. Что делает такой цикл гарантированно завершимым?'
  explanation: 'Условие «дорабатываем, пока оценивающий не пропустит» само по себе не ограничено: оценка может не проходить сколько угодно раз. Конечность даёт только явный лимит раундов.'
  kind: choice
  options:
    - Заранее заданный лимит раундов доработки
    - Требование, чтобы оценивающий агент был мощнее предлагающего
    - Запрет менять черновик больше, чем на половину текста
  correct: 0
  id: 018-evaluator-loop-1
  fingerprint: 15e35fdd
- concept: прирост качества по раундам затухает, тогда как стоимость раунда остаётся прежней
  question: Команда подняла лимит раундов evaluator-optimizer с 4 до 12. Доля прохождения выросла с 71% до 72%, расход токенов вырос втрое. Какой вывод верен?
  explanation: Первые раунды снимают грубые ошибки, дальше улучшения затухают, а каждый лишний раунд стоит столько же токенов, сколько первый. Поэтому лимит держат небольшим.
  kind: choice
  options:
    - Лимит стоит поднять ещё выше — рост качества продолжается
    - Основной выигрыш дают первые раунды, дальше стоимость растёт линейно, а качество почти нет
    - 'Оценивающий агент сломан: правильный цикл улучшает результат на каждом раунде'
  correct: 1
  id: 018-evaluator-loop-2
  fingerprint: a67a5b12
- concept: внутренний цикл исправляет конкретный выход до его выдачи, offline- и online-evals оценивают систему после факта
  question: Чем оценка внутри evaluator-optimizer отличается по адресату и моменту от offline- и online-evals, если критерии проверки могут быть одинаковыми?
  explanation: 'Оборачивать в цикл имеет смысл выходы, где одна пропущенная деталь дорого стоит: итоговый ответ клиенту, план, решение перед выполнением. Оценка там перестаёт быть отчётом и становится частью производства результата.'
  kind: open
  reference: 'Внутренний цикл адресует вердикт самому агенту и делает это до выдачи результата: замечание «в этом ответе не выполнено требование X» возвращается предлагающему агенту, и конкретный выход исправляется, пока не покинул поток. Offline- и online-evals адресуют вердикт разработчику и работают после факта: они показывают качество системы и регрессии, но уже отправленный плохой ответ не спасают. Одно не заменяет другое.'
  id: 018-evaluator-loop-3
  fingerprint: 6dabf30a
