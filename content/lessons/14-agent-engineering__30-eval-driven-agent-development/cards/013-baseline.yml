- concept: одиночная доля прохождения не сообщает о направлении изменения без сохранённого результата последней заведомо хорошей версии
  question: После правки инструкции агента команда прогнала eval-набор и получила 63% прохождения. Чего не хватает, чтобы понять, стало ли агенту лучше или хуже?
  explanation: 'Процент — это положение, а не изменение. 63% могут быть и ростом, и падением: смысл появляется только рядом с сохранённой отметкой предыдущей рабочей версии. Ни размер набора, ни строгость критерия сами по себе направление не показывают.'
  kind: choice
  options:
    - Сохранённого результата последней признанной рабочей версии на том же наборе
    - Увеличения набора случаев, чтобы процент считался точнее
    - Более строгого критерия прохождения для каждого случая
  correct: 0
  id: 013-baseline-1
  fingerprint: 1e537664
- concept: сравнение с baseline корректно только при неизменном составе набора и одинаковых настройках прогона
  question: Вчера прогнали 120 случаев и получили 91%. Сегодня в набор добавили 45 новых сложных случаев, прогон дал 86%. Какой вывод корректен?
  explanation: 'Baseline сравнивает одинаковые прогоны: тот же набор, те же настройки, тот же способ подсчёта. Когда в набор попадают 45 новых случаев, разница 91% → 86% отражает изменение измерительного инструмента, а не качества агента.'
  kind: choice
  options:
    - Агент ухудшился на пять процентных пунктов
    - 'Сравнение невалидно: изменился сам набор, baseline нужно пересчитать на текущем наборе'
    - Агент не изменился, потому что новые случаи всегда снижают долю
  correct: 1
  id: 013-baseline-2
  fingerprint: 40d5a4b8
- concept: baseline фиксирует поимённый состав пройденных случаев, а не только итоговую долю
  question: Две версии агента дают одинаковые 88% на одном и том же наборе. Почему baseline полезно хранить вместе со списком конкретных пройденных и проваленных случаев, а не только процентом?
  explanation: Снимок последней рабочей версии — это и число, и поимённый результат по случаям. Без второй части регрессия в важной категории маскируется одинаковой итоговой долей.
  kind: open
  reference: 'Одинаковый процент может скрывать перестановку: одни случаи починились, другие сломались. По списку видно, какие именно проверки перестали проходить, и можно отличить нейтральное изменение от размена критичного поведения на второстепенное. Процент даёт только агрегат, состав случаев — диагноз.'
  id: 013-baseline-3
  fingerprint: 16f6d193
