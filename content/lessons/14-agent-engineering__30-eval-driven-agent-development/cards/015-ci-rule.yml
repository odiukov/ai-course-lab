- concept: каждый guardrail привязан к eval-случаю, иначе защита остаётся непроверенной
  question: В агента добавили guardrail, который блокирует выдачу платёжных реквизитов. Что требует практика eval-driven разработки помимо самого кода guardrail?
  explanation: 'Guardrail без привязанного случая — это защита, о работоспособности которой никто не знает: её никогда не проверяют. Привязка случая делает срабатывание наблюдаемым и защищает guardrail от молчаливой поломки при будущих правках.'
  kind: choice
  options:
    - Отдельный eval-случай, воспроизводящий ситуацию, ради которой guardrail добавлен
    - Отключение guardrail на время прогона evals, чтобы не портить долю прохождения
    - Повышение минимального порога прохождения в CI
  correct: 0
  id: 015-ci-rule-1
  fingerprint: 6aaad209
- concept: порог регрессии — заранее принятая политика, одинаковая для всех PR; исключение оформляется явным изменением порога или набора
  question: 'Команда договорилась: регрессия не больше 3 процентных пунктов относительно `main`. В PR результат упал с 95% до 91%, но автор уверен, что выгода изменения важнее. Как это правильно провести?'
  explanation: Смысл гейта в том, что спор «много это или мало» происходит один раз — при выборе порога. Молчаливый обход возвращает решение к вкусу ревьюера; осознанная правка порога или набора остаётся в истории PR и обсуждается явно.
  kind: choice
  options:
    - Договориться с ревьюером и влить, оставив порог как есть
    - Явно изменить порог, набор случаев или код и показать это изменение в PR
    - Считать падение допустимым, потому что относительно 95% это чуть больше 4%
  correct: 1
  id: 015-ci-rule-2
  fingerprint: 2d7180ae
- concept: выученное правило закрепляется eval-случаем того отказа, из которого оно возникло
  question: Агент ошибся, команда вывела из разбора новое правило поведения и добавила его в инструкцию. Что нужно сделать, чтобы правило не деградировало со временем?
  explanation: 'Правило без случая отказа никем не проверяется: при следующей переработке промпта оно может исчезнуть незаметно. Случай превращает выученное правило в постоянно проверяемое требование.'
  kind: choice
  options:
    - Пометить правило комментарием в промпте с датой добавления
    - Привязать к правилу eval-случай того самого отказа, из которого оно родилось
    - Продублировать правило в системном промпте и в инструменте
  correct: 1
  id: 015-ci-rule-3
  fingerprint: 71a519b1
