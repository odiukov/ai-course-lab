- concept: единицей покрытия eval-набора является обязательная возможность агента, а не отдельный тест
  question: Набор evals содержит 80 случаев, из которых 70 проверяют отклонение неизвестного инструмента при разных формулировках запроса. Что корректно сказать о покрытии этого набора?
  explanation: 'Число случаев не отражает охват: одну возможность можно проверить десятками похожих входов и оставить остальные без единой проверки. Аудит идёт по списку обязательных возможностей — напротив каждой должна стоять отметка о наличии проверки.'
  kind: choice
  options:
    - 'Покрытие высокое: 80 случаев дают широкий охват поведения агента'
    - Покрытие определяется числом обязательных возможностей, у которых есть хотя бы один случай, и 70 однотипных случаев закрывают лишь одну из них
    - Покрытие нужно считать как долю случаев, завершившихся успехом
    - Покрытие нельзя оценить, пока набор не прогнан в продакшене
  correct: 1
  id: 026-coverage-audit-1
  fingerprint: cdc511d4
- concept: число пробелов покрытия равно числу обязательных возможностей без единого случая, независимо от общего числа случаев
  question: Карта обязательных возможностей содержит 9 строк. В реестре 34 eval-случая, и они относятся суммарно к 4 различным обязательным возможностям. Сколько строк карты остаются непокрытыми?
  explanation: 'Считаются не случаи, а закрытые обязательства: 9 − 4 = 5 пробелов. 34 случая создают ощущение полноты, но 30 из них лишь углубляют уже закрытые строки.'
  kind: numeric
  answer: 5
  tolerance: 0.5
  id: 026-coverage-audit-2
  fingerprint: b3a15cf9
- concept: 'порядок работы с набором: сначала по одному случаю на каждую обязательную возможность, затем углубление самых рискованных'
  question: В наборе закрыты 4 обязательные возможности из 11. Куда правильнее вложить следующий час работы?
  explanation: Дополнительные случаи для одной возможности повышают глубину проверки, но не расширяют охват. Непроверенная возможность — это отказ, о котором узнают от пользователя, поэтому сначала закрывается охват, потом усиливаются самые рискованные строки.
  kind: choice
  options:
    - Добавить вариации входов к уже закрытым возможностям, чтобы усилить самые проверенные места
    - Написать по одному случаю на непокрытые возможности, а углублять проверки уже после того, как каждая строка получит хотя бы один случай
    - Удалить дублирующиеся случаи, чтобы размер набора соответствовал числу возможностей
    - Отложить новые случаи до появления жалоб пользователей на конкретные возможности
  correct: 1
  id: 026-coverage-audit-3
