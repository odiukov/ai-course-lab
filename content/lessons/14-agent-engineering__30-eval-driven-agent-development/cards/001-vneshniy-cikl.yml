- concept: изменение агента принимается только после прогона всего накопленного набора eval-случаев, а не одного исправленного примера
  question: Команда меняет системный промпт агента, чтобы починить один воспроизведённый сбой. Что нужно сделать, прежде чем считать изменение улучшением?
  explanation: 'Правка промпта действует глобально: она может починить целевой случай и одновременно испортить соседние (пустой ввод, лишние файлы, эскалация). Только полный прогон набора отличает улучшение от размена одной ошибки на другую.'
  kind: choice
  options:
    - Прогнать весь накопленный набор eval-случаев и убедиться, что ранее проходившие случаи не сломались
    - Прогнать только тот случай, ради которого менялся промпт
    - Показать новую версию на демонстрации заказчику
    - Сравнить длину нового и старого промпта
  correct: 0
  id: 001-vneshniy-cikl-1
  fingerprint: ddf07019
- concept: eval оценивает проверяемые последствия работы агента, а не убедительность его ответа
  question: Почему eval-случай формулируют через проверяемые последствия (какой файл изменён, прошёл ли тест, какие инструменты вызваны), а не через оценку «ответ звучит убедительно»?
  explanation: Eval-случай должен уметь честно провалиться. Критерий, который нельзя опровергнуть машинально, не защищает от регрессий.
  kind: open
  reference: 'Убедительность субъективна и не воспроизводима: агент может красиво объяснить неверное действие и получить зачёт. Проверяемые последствия дают детерминированный вердикт «прошёл / не прошёл», который можно автоматически повторять на каждом изменении, сравнивать между версиями и использовать как гейт. Кроме того, именно последствия несут продуктовый риск — правка не того файла вредит, даже если формулировка ответа безупречна.'
  id: 001-vneshniy-cikl-2
  fingerprint: c395ca30
- concept: 'цикл eval-driven разработки: сбой становится постоянным случаем набора до внесения правки'
  question: Пользователь сообщил о сбое агента. Расставь шаги eval-driven цикла в правильном порядке.
  explanation: Случай пишется до правки и обязан сначала провалиться — иначе неизвестно, проверяет ли он что-нибудь. Оставшись в наборе навсегда, он не даёт будущим правкам тихо вернуть ту же ошибку.
  kind: order
  items:
    - Воспроизвести сбой и зафиксировать его как новый eval-случай с критериями прохождения
    - Убедиться, что новый случай проваливается на текущей версии агента
    - Внести изменение в промпт, инструмент или ограничение агента
    - Прогнать весь набор случаев и сравнить результат с прежним прогоном
    - Принять изменение, если новый случай проходит и старые не сломались
  id: 001-vneshniy-cikl-3
  fingerprint: 61d3a1af
