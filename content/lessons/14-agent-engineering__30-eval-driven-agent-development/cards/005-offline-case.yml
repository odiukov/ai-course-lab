  fingerprint: 98cf69ea
- concept: критерий прохождения задаётся по поведению, а не по совпадению формулировок
  question: 'Два агента отвечают по-разному: «передам запрос специалисту» и «создам обращение в поддержку». Почему оба могут пройти один и тот же eval-случай, а вежливый ответ с обещанием возврата — провалиться?'
  explanation: Eval ловит риск, а не стиль. Точное сравнение строк даёт и ложные провалы, и ложные прохождения.
  kind: open
  reference: 'Критерий описывает продуктово значимое поведение: не подтверждать возврат вне срока, сослаться на ограничение политики, предложить эскалацию. Обе формулировки выполняют требование эскалации, различаясь только словами, поэтому обе проходят. Ответ, обещающий возврат вопреки политике, нарушает требование независимо от того, насколько он вежлив и убедителен. Привязка к дословной формулировке ломала бы проверку при любой безобидной перефразировке и пропускала бы вредное поведение в красивой упаковке.'
  id: 005-offline-case-2
  fingerprint: 95eb0608
- concept: custom offline eval воспроизводит форму конкретного продукта, не затрагивая реальных пользователей
  question: Чем собственный офлайн-случай отличается от наблюдения того же требования в продакшене?
  explanation: 'Повторяемость и отсутствие риска — главное преимущество офлайн-слоя: то же требование проверяется до того, как ошибка дойдёт до клиента.'
  kind: choice
  options:
    - Он воспроизводит продуктовую ситуацию на зафиксированных данных, поэтому его можно прогонять многократно до релиза и без риска для пользователей
    - Он точнее продакшена во всём и делает онлайн-наблюдения ненужными
    - Он проверяет базовые способности модели, а не поведение агента
    - Он не требует формулировать критерии прохождения
  correct: 0
  id: 005-offline-case-3
  fingerprint: ec65d058
