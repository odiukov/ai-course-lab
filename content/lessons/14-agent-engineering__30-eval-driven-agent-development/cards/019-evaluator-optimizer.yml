- concept: вердикт о прохождении выносит только evaluator; optimizer не подтверждает собственную доработку
  question: Внутри цикла evaluator-optimizer optimizer получил замечание и вернул исправленного кандидата вместе с пометкой «теперь требование выполнено». Как должен поступить оркестратор цикла?
  explanation: Optimizer — сторона, которая генерирует, а не судит. Если его самооценка засчитывается как прохождение, цикл начинает одобрять собственные догадки и теряет независимую проверку. Любая новая версия — снова вход для evaluator.
  kind: choice
  options:
    - Принять пометку optimizer и завершить цикл успехом, раз доработка сделана по замечанию
    - Прогнать нового кандидата через evaluator по тем же критериям и решать по его вердикту
    - Завершить цикл провалом, потому что первая версия уже была отклонена
    - Сравнить пометку optimizer с текстом прошлого замечания и принять решение по совпадению слов
  correct: 1
  id: 019-evaluator-optimizer-1
  fingerprint: a579b6b4
- concept: обратная связь evaluator передаётся optimizer как вход, иначе доработка — слепая повторная генерация
  question: Объясни своими словами, почему optimizer должен получать не только отклонённого кандидата, но и пояснение evaluator о причине провала.
  explanation: 'Цикл работает как канал сигнала: оценка производит диагностику, доработка её потребляет. Обрыв этого канала превращает evaluator-optimizer в обычный повтор генерации с той же вероятностью успеха.'
  kind: open
  reference: Вердикт «не прошёл» сообщает лишь факт провала, но не то, какое требование нарушено. Без пояснения optimizer перегенерирует ответ вслепую и может повторить ту же ошибку или сломать уже правильную часть. Пояснение evaluator — это адресный сигнал, который направляет правку к конкретному невыполненному условию, поэтому оно передаётся в optimizer вместе с кандидатом.
  id: 019-evaluator-optimizer-2
  fingerprint: 1c9eb51d
- concept: optimizer вызывается только после отклонения, поэтому его вызовов на один меньше числа оценок при успешном завершении
  question: Цикл evaluator-optimizer запущен с лимитом 5 раундов. Кандидат прошёл оценку на четвёртом раунде. Сколько раз за прогон был вызван optimizer?
  explanation: Стартовый кандидат берётся как есть, оценок было 4, из них отклонений 3 — доработка запускается только после отклонения. Успех на четвёртой оценке обрывает цикл до пятого раунда, поэтому вызовов optimizer ровно 3.
  kind: numeric
  answer: 3
  tolerance: 0.5
  id: 019-evaluator-optimizer-3
  fingerprint: 024dfbb1
