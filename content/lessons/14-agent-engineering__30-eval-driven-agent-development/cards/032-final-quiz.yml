- concept: рубрика LLM-судьи разносит независимые свойства ответа по отдельным измерениям, а не сводит их в один общий балл
  question: Команда оценивает сессии агента поддержки LLM-судьёй. Судья выставляет одну общую оценку «качество ответа». Агент начинает уверенно и в нужном тоне отвечать на вопросы, выходящие за рамки его задачи, а фактические ошибки остаются прежними. Что изменится в рубрике, чтобы это стало видно?
  explanation: 'Единый балл смешивает независимые свойства: сильный тон компенсирует провал по границам задачи, и итог остаётся приемлемым. Отдельные оси дают раздельный сигнал — по каждой видно своё направление изменения. Порог и объём выборки при неразделённом балле не помогают: измеряется по-прежнему смесь.'
  kind: choice
  options:
    - Поднять порог общей оценки, при котором сессия считается успешной
    - Оценивать каждое измерение отдельно — фактическую точность, тон и соблюдение границ задачи — и смотреть на баллы по осям, а не только на итог
    - Заменить судью на человека, оставив ту же единую оценку
    - Увеличить число оцениваемых сессий при той же общей оценке
  correct: 1
  id: 032-final-quiz-1
  fingerprint: 20d6b9da
- concept: объём судейской работы при рубричной оценке равен произведению числа сессий на число измерений рубрики
  question: Рубрика LLM-судьи содержит 6 измерений, каждое оценивается отдельным вызовом судьи. Оценивается 80 сессий. Сколько вызовов судьи потребует полный прогон?
  explanation: 'Каждое измерение каждой сессии — отдельный вызов: 80 × 6 = 480. Стоимость рубричной оценки растёт мультипликативно, поэтому добавление одной оси умножает счёт на число сессий, а не прибавляет к нему. Это же произведение позволяет посчитать стоимость прогона заранее, до запуска.'
  kind: numeric
  answer: 480
  tolerance: 0.5
  id: 032-final-quiz-2
  fingerprint: 5838e583
- concept: рубрику судьи калибруют по вручную размеченным сессиям, разбирая расхождения, иначе её баллы неинтерпретируемы
  question: 'Своими словами: зачем перед тем, как доверять баллам LLM-судьи, вручную разметить часть тех же сессий и разобрать расхождения?'
  explanation: Некалиброванный судья превращает оценку в измерение неизвестной величины. Разбор расхождений — это дешёвая ручная работа на десятки минут, которая делает последующие сотни автоматических вызовов осмысленными.
  kind: open
  reference: 'Судья реализует не рубрику, а своё прочтение рубрики. Пока неизвестно, где его вердикт расходится с человеческим, число на выходе нельзя интерпретировать: непонятно, означает ли падение балла ухудшение агента или срабатывание формулировки критерия. Ручная разметка выборки сессий даёт опорную разметку; разбор расхождений показывает, какие именно случаи судья систематически трактует иначе — размытый критерий, спорная граница задачи, чувствительность к длине или уверенности формулировки. По итогам уточняют текст рубрики и повторяют сверку. Только после того как согласие судьи с человеком на этой выборке стало приемлемым, баллы судьи можно использовать как сигнал качества и тем более как основание для решений о выпуске.'
  id: 032-final-quiz-3
  fingerprint: 446a029a
