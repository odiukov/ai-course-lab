- concept: эталонная траектория — ориентир для сравнения, а не требование буквально копировать её шаги
  question: Траекторный eval сравнивает последовательность действий агента с эталонной. Как правильно понимать роль эталона?
  explanation: 'У задачи обычно несколько допустимых маршрутов, и агент вправе идти своим. Эталон служит масштабом: он показывает, сколько шагов задача реально требует, и делает заметным обходной путь.'
  kind: choice
  options:
    - Агент обязан повторить эталонную последовательность действие в действие, иначе случай провален
    - Эталон задаёт ориентир, относительно которого видно отклонение и избыточность, а не обязательный к копированию маршрут
    - Эталон нужен только чтобы проверить финальный ответ
    - Любая траектория, отличная от эталонной, считается более дешёвой
  correct: 1
  id: 021-trajectory-1
  fingerprint: cc9a9ec9
- concept: лишние шаги оплачиваются задержкой, стоимостью и дополнительными точками отказа
  question: Агент дошёл до верного ответа, но сделал заметно больше действий, чем требовалось. Объясни своими словами, чем плохи эти лишние шаги, раз результат всё равно верный.
  explanation: Бинарный вердикт фиксирует только точку назначения. Стоимость, задержка и риск накапливаются по пути, поэтому их видно лишь в записанной последовательности действий.
  kind: open
  reference: 'Каждый лишний вызов инструмента — это дополнительное время ответа, дополнительные токены и деньги, а также ещё одно место, где агент может ошибиться, получить мусорный результат или уйти не туда. Успех на одном прогоне при раздутой траектории хрупок: та же избыточность на других входах превращается в отказ. Поэтому эффективность траектории меряют отдельно от бинарного результата.'
  id: 021-trajectory-2
  fingerprint: 57fdd0d2
