- concept: защиту проверяет провоцирующий вход, а не сценарий, в котором запрещённое действие вообще не запрашивается
  question: Guardrail запрещает отправку письма без явного подтверждения адресата. Какой eval-случай действительно проверяет эту защиту?
  explanation: Сценарий, где запрещённое действие и так не запрашивается, пройдёт даже с полностью отключённым guardrail. Проверяет защиту только вход, который её провоцирует.
  kind: choice
  options:
    - Пользователь подтвердил адресата — проверяем, что письмо ушло
    - Пользователь адресата не подтвердил — проверяем, что письмо не отправлено
    - Пользователь ничего не просил отправлять — проверяем, что агент промолчал
    - Пользователь подтвердил адресата дважды — проверяем, что письмо ушло один раз
  correct: 1
  id: 024-failure-links-1
  fingerprint: 05a8b490
- concept: 'запись случая отказа: провоцирующая ситуация, ожидаемое защитное поведение, недопустимый результат, затем включение в прогоняемый набор'
  question: Расставь по порядку шаги оформления eval-случая для выученного после инцидента правила.
  explanation: Без первого пункта нечего проверять, без второго и третьего вердикт остаётся на усмотрение читателя, без четвёртого случай не поймает ослабление защиты будущей правкой промпта.
  kind: order
  items:
    - 'Воспроизвести ситуацию, в которой агент ошибся: входные данные и состояние, приведшие к отказу'
    - Задать ожидаемое защитное поведение — что агент обязан сделать вместо ошибочного действия
    - Зафиксировать недопустимый результат, по появлению которого случай считается проваленным
    - Добавить случай в набор, который прогоняется автоматически при изменениях агента
  id: 024-failure-links-2
  fingerprint: fe55d37a
