- concept: 'разделение ответственности: оркестратор набора не дублирует проверку критерия и не считает агрегаты'
  question: Объясни своими словами, почему функция, прогоняющая eval-набор, не должна ни сама сравнивать вывод с ожидаемым, ни считать долю прохождения и вердикт CI.
  explanation: 'Три роли разведены: случай задаёт критерий, запуск одного случая его проверяет, прогон набора выполняет всё и возвращает журнал. Тогда сводку и гейт можно переписать, не трогая код исполнения.'
  kind: open
  reference: 'Критерий прохождения принадлежит отдельному случаю и проверяется запуском одного случая — дублирование сравнения в оркестраторе создаёт два источника истины, которые могут разойтись. Агрегация (доля прохождения, регрессия к базовой линии, вердикт гейта) — отдельный этап над уже готовыми результатами: её правила меняются чаще, чем сам прогон, и её нужно уметь пересчитать без повторного выполнения агента. Поэтому оркестратор возвращает сырые результаты каждого запуска, а решения принимаются слоем выше.'
  id: 008-run-suite-3
  fingerprint: f47c6ea0
