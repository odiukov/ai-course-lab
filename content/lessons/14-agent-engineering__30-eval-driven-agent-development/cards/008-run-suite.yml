- concept: порядок одной итерации прогона набора и сохранение исходного порядка результатов
  question: Расставь шаги прогона eval-набора в правильном порядке.
  explanation: Порядок результатов, совпадающий с порядком реестра, позволяет сопоставить строку отчёта с исходным случаем и его категорией без дополнительного ключа. Агент во всех запусках один и тот же — меняется только случай.
  kind: order
  items:
    - Взять очередной случай из реестра в том порядке, в котором он там записан
    - Выполнить проверяемого агента на этом случае и получить результат отдельного запуска
    - Добавить результат в общий список независимо от того, прошёл случай или нет
    - Перейти к следующему случаю, не прерывая цикл
    - После исчерпания реестра вернуть собранный список в исходном порядке
  id: 008-run-suite-2
