- concept: результаты корректно приводить на аудированной (Verified) версии бенчмарка
  question: Как правильно сообщать результат модели на бенчмарке, известном проблемами с утечкой решений?
  explanation: Версия — часть результата. Балл на неаудированном наборе и на Verified — разные величины, и без указания версии сравнение моделей теряет смысл.
  kind: choice
  options:
    - Указывать балл на аудированной (Verified) версии и явно называть, какая версия использовалась
    - Указывать максимальный балл среди всех версий бенчмарка
    - Указывать усреднённый балл по загрязнённой и чистой версиям
    - 'Не указывать версию: наборы заданий совпадают'
  correct: 0
