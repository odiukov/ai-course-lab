- concept: реплей сессии восстанавливает реальную последовательность взаимодействия и обнажает ситуации, которых нет в подготовленных наборах
  question: Объясни своими словами, что даёт реплей реальной пользовательской сессии такого, чего не даёт прогон подготовленного offline-набора.
  explanation: 'Ключевое отличие — источник данных: сценарии придуманы нами против сценариев, порождённых реальным использованием. Второе покрывает хвост случаев, который первое по определению не содержит.'
  kind: open
  reference: 'Реплей восстанавливает фактическую последовательность: запросы пользователя, ответы агента и вызовы инструментов в том порядке, в котором они происходили. Это показывает формы взаимодействия, которых в подготовленном наборе не было и которые никто не догадался придумать: смена намерения на полпути, противоречивые уточнения, отмена уже начатого действия, повтор одного и того же вызова инструмента. Offline-набор проверяет заранее выбранные ситуации, реплей — то распределение ситуаций, которое реально приносят пользователи.'
  id: 011-online-evals-2
  fingerprint: e94d70ec
