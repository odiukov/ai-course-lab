- concept: слой без запущенных случаев не эквивалентен успешно пройденному слою и должен показываться отдельно
  question: В сводке слой, для которого не запускался ни один случай, молча не выводится. Чем это опасно?
  explanation: '«Нет данных» и «всё прошло» — разные состояния. Явная строка вида «слой: 0 случаев» показывает пробел в покрытии; молчание превращает пробел в мнимый успех.'
  kind: choice
  options:
    - Отсутствие проверки читается как зелёный результат, хотя данных о слое нет вообще
    - Итоговая доля прохождения посчитается неверно из-за деления на ноль
    - Случаи этого слоя будут запущены дважды при следующем прогоне
    - Порядок слоёв в отчёте перестанет совпадать с порядком реестра
