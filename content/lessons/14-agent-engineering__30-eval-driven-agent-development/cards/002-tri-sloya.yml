- concept: траекторная оценка видит избыточность действий, которую скрывает бинарный вердикт «прошёл / не прошёл»
  question: Что показывает сравнение траектории агента с эталонной последовательностью действий такого, чего не видно по итоговому «прошёл / не прошёл»?
  explanation: Замеры на OSWorld-Human показали разрыв в 1,4–2,7 раза по числу шагов у лучших агентов относительно человеческого эталона — при формально успешных прогонах.
  kind: open
  reference: 'Траекторная оценка сравнивает саму последовательность вызовов и действий с эталоном и вскрывает избыточность: агент достигает верного результата, но делает заметно больше шагов — лишние вызовы инструментов, перечитывание одного и того же, блуждание по интерфейсу. Это напрямую превращается в стоимость, задержку и лишний риск побочных эффектов, а бинарный вердикт всё это скрывает: и экономный, и расточительный прогон дают одинаковое «прошёл».'
