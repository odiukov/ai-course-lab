- concept: измерения стоимости, задержки и срабатываний guardrail по шагам доступны только на онлайн-слое
  question: Агент отвечает верно и проходит все офлайн-случаи, но пользователи жалуются на долгие ответы и растущий счёт за токены. Какой источник сигнала покажет эту проблему?
  explanation: Вердикт «прошёл» не содержит цены и времени. Спаны продакшена с разбивкой по шагам и реплеи сессий показывают, где именно агент тратит время и деньги и как часто срабатывают ограничения.
  kind: choice
  options:
    - Учёт стоимости и задержки по каждому шагу в трассировках продакшена плюс реплеи сессий
    - Ещё один прогон статического бенчмарка на аудированной версии
    - Увеличение количества офлайн-случаев с LLM-судьёй
    - Сравнение размера системного промпта с конкурентами
