- concept: падение измеряется в тех же долях, что и входные значения, а не как относительная доля от baseline
  question: baseline = 0.60, текущая доля = 0.53, допустимое падение = 0.04. Разработчик считает, что падение составило около 11.7% от baseline. Что вернёт корректная `detect_regression`?
  explanation: Все три входа лежат в одной шкале 0…1, поэтому падение — простая разность 0.60 − 0.53 = 0.07. Пересчёт в долю от baseline (11.7%) — другая шкала, с допуском её сравнивать нельзя.
  kind: choice
  options:
    - 'False: 11.7% — относительная величина, её нельзя сравнивать с 0.04'
    - 'True: baseline − current = 0.07, это больше допуска 0.04'
    - 'False: 0.53 всё ещё выше половины случаев'
