- concept: улучшение относительно baseline даёт отрицательное падение и не может быть регрессией
  question: baseline = 0.94, текущая доля = 0.97, допустимое падение = 0.03. Что вернёт `detect_regression`?
  explanation: Задача функции — ловить недопустимое ухудшение, а не любое отличие. baseline − current = −0.03, что меньше допуска 0.03, значит False.
  kind: choice
  options:
    - 'False: падение отрицательное, ухудшения нет'
    - 'True: результат отличается от baseline'
    - 'True: разница 0.03 равна допуску'
