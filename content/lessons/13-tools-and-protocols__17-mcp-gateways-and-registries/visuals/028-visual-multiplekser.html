<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Тройник сессий</title>
<style>
  :root{
    --bg:#fbfbfa; --fg:#1e1e1c; --muted:#6d6d68;
    --line:#3a3a36; --hot:#c2410c; --calm:#1d4ed8; --panel:#ececE6;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16161a; --fg:#ececEC; --muted:#9a9a94;
      --line:#c9c9c2; --hot:#fb923c; --calm:#93b4fd; --panel:#26262c;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:960px;margin:0 auto;padding:12px;}
  h2{font-size:15px;margin:0 0 6px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .fail{font-size:13px;line-height:1.5;color:var(--fg);
    border:1px solid var(--muted);border-radius:6px;padding:10px;}
</style>
</head>
<body>
<div class="wrap">
  <h2>Тройник сессий: одна вилка слева, пять розеток справа</h2>
  <div id="slot"></div>
</div>
<script>
(function(){
  var slot = document.getElementById("slot");
  try{
    // ---- данные схемы (единицы схемы, не пиксели) ----
    var DATA = {
      client: {x:0, y:0, label:"MCP-сессия разработчика"},
      hub:    {x:4, y:0, label:"шлюз-мультиплексор"},
      backends:[
        {y: 4, tag:"b₁", name:"гит"},
        {y: 2, tag:"b₂", name:"трекер задач"},
        {y: 0, tag:"b₃", name:"вики"},
        {y:-2, tag:"b₄", name:"база"},
        {y:-4, tag:"b₅", name:"CI"}
      ],
      backendX: 9,
      notifyFrom: 3,                 // b₄ шлёт tools/list_changed
      notifyLabel:"tools/list_changed"
    };

    // ---- один origin, один scale ----
    var origin = {x:150, y:150};
    var scale  = 30;
    function sx(x){ return origin.x + x*scale; }
    function sy(y){ return origin.y - y*scale; }

    // литералы-пиксели: холст, отступы подписей, толщины, кегль
    var W = 900, H = 320, PAD = 10, PADS = 6;
    var LW = 2, LWT = 3, FS = 13, FSS = 11;

    var NS = "http://www.w3.org/2000/svg";
    function el(n,a){ var e=document.createElementNS(NS,n);
      for(var k in a) e.setAttribute(k,a[k]); return e; }
    function txt(x,y,s,anchor,cls,size){
      var t=el("text",{x:x,y:y,"text-anchor":anchor,
        "font-size":(size||FS),fill:"currentColor"});
      if(cls) t.setAttribute("class",cls);
      t.textContent=s; return t;
    }

    var svg = el("svg",{viewBox:"0 0 "+W+" "+H,
      preserveAspectRatio:"xMidYMid meet",role:"img",
      "aria-label":"Одна сессия разработчика, пять бэкенд-сессий, уведомление от четвёртого бэкенда доходит до клиента"});
    svg.appendChild(el("rect",{x:0,y:0,width:W,height:H,fill:"var(--bg)"}));

    var defs = el("defs",{});
    function marker(id,color){
      var m=el("marker",{id:id,viewBox:"0 0 10 10",refX:9,refY:5,
        markerWidth:6,markerHeight:6,orient:"auto-start-reverse"});
      m.appendChild(el("path",{d:"M0,0 L10,5 L0,10 z",fill:color}));
      return m;
    }
    defs.appendChild(marker("ar","var(--line)"));
    defs.appendChild(marker("arh","var(--hot)"));
    svg.appendChild(defs);

    var g = el("g",{});
    svg.appendChild(g);

    var C = DATA.client, Hb = DATA.hub, BX = DATA.backendX;

    // рамка шлюза: от hub вверх/вниз на всю высоту бэкендов
    var top = DATA.backends[0].y, bot = DATA.backends[DATA.backends.length-1].y;
    g.appendChild(el("rect",{
      x:sx(Hb.x-0.9), y:sy(top+1.2),
      width:sx(Hb.x+0.9)-sx(Hb.x-0.9),
      height:sy(bot-1.2)-sy(top+1.2),
      rx:8, fill:"var(--panel)", stroke:"var(--line)","stroke-width":LW}));

    // одна вилка слева: клиент -> шлюз
    g.appendChild(el("line",{x1:sx(C.x),y1:sy(C.y),x2:sx(Hb.x-0.9),y2:sy(Hb.y),
      stroke:"var(--calm)","stroke-width":LWT}));
    g.appendChild(el("circle",{cx:sx(C.x),cy:sy(C.y),r:7,
      fill:"var(--bg)",stroke:"var(--calm)","stroke-width":LWT}));
    g.appendChild(txt(sx(C.x),sy(C.y)-PAD-PADS,"1 сессия","middle",null,FS));
    g.appendChild(txt(sx(C.x),sy(C.y)+PAD+FS,C.label,"middle","",FSS));

    // пять розеток справа
    DATA.backends.forEach(function(b,i){
      var y=b.y, hot=(i===DATA.notifyFrom);
      g.appendChild(el("line",{
        x1:sx(Hb.x+0.9),y1:sy(y),x2:sx(BX),y2:sy(y),
        stroke:hot?"var(--hot)":"var(--line)","stroke-width":LW}));
      g.appendChild(el("circle",{cx:sx(BX),cy:sy(y),r:6,
        fill:"var(--bg)",stroke:hot?"var(--hot)":"var(--line)","stroke-width":LW}));
      g.appendChild(txt(sx(BX)+PAD,sy(y)-PADS,b.tag,"start",null,FSS));
      g.appendChild(txt(sx(BX)+PAD,sy(y)+PAD+PADS,b.name,"start",null,FS));
      // вызов вниз: наконечник у бэкенда
      g.appendChild(el("line",{
        x1:sx(Hb.x+1.1),y1:sy(y-0.35),x2:sx(BX-0.4),y2:sy(y-0.35),
        stroke:"var(--line)","stroke-width":1,"marker-end":"url(#ar)"}));
    });

    // подпись пучка бэкенд-сессий — сбоку, у хвоста
    g.appendChild(txt(sx((Hb.x+BX)/2),sy(top+1.2)-PAD,
      "5 живых бэкенд-сессий","middle",null,FS));

    // обратный поток: уведомление от b₄ -> шлюз -> клиент
    var nb = DATA.backends[DATA.notifyFrom];
    g.appendChild(el("polyline",{
      points:[sx(BX-0.4)+","+sy(nb.y+0.35),
              sx(Hb.x)+","+sy(nb.y+0.35),
              sx(Hb.x)+","+sy(Hb.y-0.55),
              sx(C.x+0.3)+","+sy(Hb.y-0.55)].join(" "),
      fill:"none",stroke:"var(--hot)","stroke-width":LWT,
      "marker-end":"url(#arh)"}));

    // подпись стрелки — у хвоста, под линией
    g.appendChild(txt(sx(BX-0.4),sy(nb.y+0.35)+PAD+FS,
      DATA.notifyLabel,"end","",FS));
    g.appendChild(txt(sx((C.x+Hb.x)/2),sy(Hb.y-0.55)+PAD+FS,
      "уведомление доезжает наверх","middle",null,FSS));

    // легенда строкой под схемой
    var ly = bot-2.2;
    g.appendChild(el("line",{x1:sx(C.x),y1:sy(ly),x2:sx(C.x+0.8),y2:sy(ly),
      stroke:"var(--line)","stroke-width":LW}));
    g.appendChild(txt(sx(C.x+1),sy(ly)+PADS-1,
      "вызовы вниз, по префиксу","start",null,FSS));
    g.appendChild(el("line",{x1:sx(BX-4.4),y1:sy(ly),x2:sx(BX-3.6),y2:sy(ly),
      stroke:"var(--hot)","stroke-width":LWT}));
    g.appendChild(txt(sx(BX-3.4),sy(ly)+PADS-1,
      "обратный поток: проглотит шлюз — клиент со старым списком",
      "start",null,FSS));

    slot.appendChild(svg);
  }catch(e){
    slot.innerHTML = '<p class="fail">Схема не построилась. Она должна была '+
      'показать: слева одна MCP-сессия разработчика, справа пять живых '+
      'бэкенд-сессий (гит, трекер задач, вики, база, CI), между ними шлюз-'+
      'мультиплексор. Вызовы идут вниз по префиксу, а уведомление '+
      '<code>tools/list_changed</code> от четвёртого бэкенда (база) идёт '+
      'обратно через шлюз и доезжает до единственной клиентской сессии.</p>';
  }
})();
</script>
</body>
</html>
