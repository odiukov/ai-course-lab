- concept: знаменатель центральной разности равен полному расстоянию между симметрично возмущёнными значениями параметра
  question: При фиксированных остальных параметрах выбрано ε = 0,004. Получены loss(w + ε) = 1,86 и loss(w − ε) = 1,78. Чему равна численная оценка градиента?
  explanation: Разность значений loss равна 0,08, а расстояние между точками w − ε и w + ε — 0,008. Поэтому центральная разность равна 0,08 / 0,008 = 10.
  kind: numeric
  answer: 10
  tolerance: 0.01
  id: 028-chislennyy-gradient-1
  fingerprint: 02a312dc
- concept: центральная разность требует независимых симметричных возмущений одного параметра относительно исходного значения
  question: Расположи действия для численной проверки градиента одного параметра методом центральной разности в правильном порядке.
  explanation: Оба значения loss должны быть получены в точках, симметричных относительно одного исходного w. Если не восстановить w перед отрицательным возмущением, точки перестанут соответствовать w + ε и w − ε.
  kind: order
  items:
    - Сохранить исходное значение параметра и зафиксировать остальные параметры
    - Установить параметр в w + ε и вычислить loss
    - Вернуть параметр к исходному значению
    - Установить параметр в w − ε и вычислить loss
    - Вычислить отношение разности полученных loss к расстоянию между проверенными значениями параметра
  id: 028-chislennyy-gradient-2
  fingerprint: 7904ba48
