- concept: совместный неограниченный рост среднего и разброса указывает на взрыв активаций
  question: Во время обучения среднее и стандартное отклонение активаций слоя быстро растут на каждом следующем обновлении. Какой диагноз наиболее вероятен?
  explanation: При взрыве активаций увеличиваются и общий масштаб значений, отражённый mean, и их разброс, отражённый std. В здоровой сети эти статистики остаются ограниченными.
  kind: choice
  options:
    - Взрыв активаций
    - Стабильная работа слоя
