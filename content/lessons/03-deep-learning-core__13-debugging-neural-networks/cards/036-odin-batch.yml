- concept: неизменность параметров при ненулевых градиентах указывает на неправильное подключение оптимизатора
  question: Модель не может запомнить фиксированный маленький batch. После backward у её параметров есть ненулевые градиенты, но значения параметров после шага оптимизатора не меняются. Какова наиболее вероятная причина?
  explanation: Ненулевые градиенты показывают, что обучающий сигнал дошёл до параметров. Если после шага они не меняются, нужно проверить, переданы ли оптимизатору параметры текущего экземпляра модели.
  kind: choice
  options:
    - В batch слишком мало разнообразных примеров
    - Оптимизатор связан не с теми параметрами модели
    - Модель начала переобучаться
  correct: 1
  id: 036-odin-batch-1
  fingerprint: 89dc4391
- concept: успешное запоминание одного batch не подтверждает обобщающую способность модели
  question: Почему почти нулевой loss на одном многократно повторяемом маленьком batch не доказывает, что модель будет хорошо работать на новых данных?
  explanation: Тест с одним batch намеренно проверяет способность к запоминанию. Он помогает обнаруживать фундаментальные сбои обучения, но ничего не гарантирует относительно качества на невиданных примерах.
  kind: open
  reference: Модель могла просто запомнить конкретные пары входов и ответов. Такой результат подтверждает работоспособность цепочки обучения, но оценивать обобщение нужно отдельно на данных, которые не использовались для обновления параметров.
  id: 036-odin-batch-2
  fingerprint: c2a35e3c
