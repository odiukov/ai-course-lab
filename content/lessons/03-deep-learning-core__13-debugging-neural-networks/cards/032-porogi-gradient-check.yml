- concept: малое ненулевое расхождение допустимо из-за разных способов вычисления градиента
  question: Почему ненулевая относительная разница ниже порога практического совпадения не означает, что backprop ошибочен?
  explanation: Численный градиент является приближением и подвержен ошибкам округления. Поэтому rel_diff меньше 1e-5 считается практическим совпадением, даже если он не равен нулю.
  kind: open
  reference: Аналитический градиент вычисляется через backprop, а численный — приближённо с помощью конечных разностей. Округление и неточность численной оценки обычно не позволяют получить идеальное совпадение, поэтому достаточно, чтобы относительная разница была меньше допустимого порога.
  id: 032-porogi-gradient-check-2
