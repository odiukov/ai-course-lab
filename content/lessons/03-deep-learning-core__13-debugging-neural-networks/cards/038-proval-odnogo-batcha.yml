- concept: провал запоминания одного batch не локализует баг, а задаёт класс возможных причин
  question: Модель многократно обучают на одном небольшом batch, но она не достигает почти нулевого loss. Какой вывод наиболее обоснован?
  explanation: Тест выявляет фундаментальную неспособность запомнить малый набор. Причиной могут быть функция потерь, обратный проход, оптимизатор, соответствие данных меткам или недостаточная ёмкость, поэтому по одному результату точный компонент определить нельзя.
  kind: choice
  options:
    - Полный датасет недостаточно велик для обобщения
    - В базовой цепочке обучения или ёмкости модели есть проблема, но сам тест не определяет её точное место
    - Нужно сразу увеличить число эпох полного обучения
    - Это доказывает, что ошибка находится именно в функции потерь
  correct: 1
  id: 038-proval-odnogo-batcha-1
  fingerprint: 10670b4e
- concept: масштабирование полного обучения не устраняет фундаментальный сбой, обнаруженный тестом одного batch
  question: Почему после неудачного теста на запоминание одного небольшого batch не следует пытаться исправить ситуацию увеличением датасета или длительности полного обучения?
  explanation: Малый batch исключает нехватку данных как объяснение и сводит задачу к простому запоминанию. Его провал требует проверки компонентов обучения до запуска дорогого полного прогона.
  kind: open
  reference: Если модель не способна запомнить малый фиксированный набор, увеличение масштаба не восстанавливает сломанную цепочку обучения и не добавляет необходимую ёмкость. Оно лишь дороже повторяет тот же сбой; сначала нужно диагностировать модель, данные и цикл обучения.
  id: 038-proval-odnogo-batcha-2
