- concept: правдоподобные предсказания могут возникать из-за ложных признаков и запоминания данных
  question: Почему правдоподобные предсказания на нескольких обучающих примерах ещё не доказывают, что нейросеть выучила нужную закономерность?
  explanation: Нейросеть ищет любой доступный способ уменьшить loss. Побочная корреляция или запоминание способны дать убедительные ответы на знакомых данных, не обеспечивая нужного обобщения.
  kind: open
  reference: Модель могла запомнить отдельные примеры или использовать побочный признак, случайно связанный с меткой. Нужно проверять её на независимых данных и исследовать, какие признаки определяют предсказания.
