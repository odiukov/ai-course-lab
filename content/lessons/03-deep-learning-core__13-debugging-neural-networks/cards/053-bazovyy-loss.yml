- concept: кросс-энтропия равномерного классификатора равна натуральному логарифму числа классов
  question: Классификатор распределяет вероятность поровну между 64 классами. Чему примерно равен кросс-энтропийный loss?
  explanation: Вероятность правильного класса равна 1/64, поэтому loss составляет −ln(1/64) = ln(64) ≈ 4,16.
  kind: numeric
  answer: 4.16
  tolerance: 0.03
  id: 053-bazovyy-loss-1
  fingerprint: 6a8bda03
- concept: устойчивый loss около уровня случайного угадывания указывает на отсутствие различения классов, но не определяет причину
  question: После множества обновлений loss классификатора с 25 классами остаётся около ln(25). Какой вывод обоснован?
  explanation: ln(25) — уровень равномерного угадывания для 25 классов. Близкий к нему loss показывает отсутствие полезного различения классов, но сам по себе не устанавливает причину сбоя.
  kind: choice
  options:
    - Модель по-прежнему назначает классам близкие вероятности и не научилась их различать
    - Learning rate определённо слишком велик
    - Все обучающие метки гарантированно ошибочны
    - Модель переобучилась на тренировочных данных
  correct: 0
