- concept: последний конечный и ближайший неконечный тензоры локализуют участок возникновения ошибки
  question: Во время итерации вход и выход энкодера содержат только конечные значения, а логиты после выходной головы уже содержат NaN. Где следует искать источник ошибки в первую очередь?
  explanation: 'Выход энкодера ещё корректен, а логиты уже нет, поэтому граница сбоя находится внутри выходной головы или в используемых ею параметрах. Проверять loss и последующие операции пока рано: они уже получают испорченные значения.'
  kind: choice
  options:
    - В вычислениях между выходом энкодера и получением логитов
    - Только в функции потерь
    - В загрузчике входных данных
    - Только в обновлении параметров оптимизатором
  correct: 0
  id: 010-konechnost-chisel-1
  fingerprint: 624d4baa
- concept: проверка конечности должна охватывать каждый элемент диагностируемого тензора
  question: Объясни, почему при проверке тензора на NaN и Inf недостаточно исследовать несколько выбранных элементов.
  explanation: Один пропущенный NaN или Inf может испортить следующие активации, loss, градиенты и параметры. Надёжная проверка завершается успешно только тогда, когда конечны все элементы тензора.
  kind: open
  reference: Некорректным может оказаться любой элемент тензора. Выборочная проверка способна его пропустить, после чего NaN или Inf распространится в последующие вычисления. Поэтому условие должно подтверждать конечность всех элементов.
  id: 010-konechnost-chisel-2
  fingerprint: d2957fb6
