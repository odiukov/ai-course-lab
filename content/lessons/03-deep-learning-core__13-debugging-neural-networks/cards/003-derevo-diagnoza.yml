- concept: слишком высокий learning rate вызывает неустойчивое изменение loss
  question: Во время обучения loss резко колеблется и иногда возрастает, а градиенты остаются конечными. Какую гипотезу следует проверить первой?
  explanation: Слишком высокий learning rate заставляет оптимизатор перескакивать через подходящие значения параметров, поэтому loss колеблется или растёт. Слишком низкий learning rate обычно проявляется как почти неподвижный loss.
  kind: choice
  options:
    - Learning rate слишком высокий
    - Learning rate слишком низкий
    - Модель содержит слишком мало слоёв
    - Обучающие метки перемешаны
  correct: 0
  id: 003-derevo-diagnoza-1
  fingerprint: f0c77beb
- concept: нулевые градиенты не позволяют оптимизатору обновлять параметры
  question: Заполни пропуск в условии, при котором параметры модели не получают направления для обновления.
  explanation: Если производная loss по каждому параметру равна нулю, шаг оптимизатора также оказывается нулевым. Причиной могут быть затухающие градиенты или неактивные ReLU.
  kind: cloze
  template: '∀θ: ∂L/∂θ = ___ ⇒ Δθ = 0'
  answer: '0'
  accept:
    - ноль
    - нулю
  id: 003-derevo-diagnoza-2
  fingerprint: d5fcfaae
- concept: случайно перемешанные метки ограничивают обобщение уровнем случайного угадывания
  question: Метки обучающих примеров случайно переставили независимо от входов. Что произойдёт с качеством на новых данных и почему увеличение глубины модели не исправит проблему?
  explanation: 'Перемешивание меток разрушает соответствие между примерами и правильными ответами. Архитектурные изменения не исправляют ошибочный набор данных: модель либо не обучится, либо запомнит случайные соответствия.'
  kind: open
  reference: На новых данных качество останется примерно на уровне случайного угадывания, потому что входы больше не содержат закономерной связи с назначенными им метками. Более глубокая модель может запомнить обучающую выборку, но не восстановит отсутствующую связь и не обеспечит обобщение.
  id: 003-derevo-diagnoza-3
  fingerprint: 8d2e8107
