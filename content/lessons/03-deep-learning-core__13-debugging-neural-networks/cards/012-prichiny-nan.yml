- concept: стабильный softmax предотвращает переполнение exp вычитанием максимального логита
  question: Расположи действия для численно устойчивого вычисления softmax.
  explanation: Вычитание максимума не меняет результат softmax, но делает все аргументы exp неположительными и тем самым предотвращает переполнение.
