- concept: большой loss отдельного примера является поводом для проверки, а не доказательством ошибочной метки
  question: Почему нельзя автоматически считать ошибочно размеченными и удалять все обучающие примеры с самым большим индивидуальным loss?
  explanation: Противоречие между уверенным предсказанием и меткой часто повышает loss, поэтому этот показатель полезен для поиска кандидатов. Но сложные корректно размеченные примеры тоже могут иметь большой loss; их безусловное удаление обеднит датасет.
  kind: open
  reference: Большой loss может возникнуть как из-за неверной метки, так и из-за действительно сложного, редкого или неоднозначного примера. Такие объекты следует рассматривать как кандидатов и проверять метки перед исправлением или удалением.
  id: 042-oshibki-metok-2
  fingerprint: 6d256d5d
- concept: confident learning выявляет вероятные ошибки по несоответствию меток уверенным предсказаниям модели
  question: Какой подход лучше всего описывает применение confident learning для поиска ошибок разметки?
  explanation: Confident learning использует уверенность предсказаний и их согласованность с заданными метками, чтобы ранжировать вероятные ошибки разметки. Отмеченные примеры затем проверяют и при необходимости исправляют или удаляют.
  kind: choice
  options:
    - Отмечать случаи, где заданная метка не согласуется с уверенным предсказанием модели
    - Удалять все примеры, на которых модель делает неуверенное предсказание
    - Искать эпоху с минимальным средним training loss
    - Заменять каждую метку наиболее частым классом в датасете
  correct: 0
