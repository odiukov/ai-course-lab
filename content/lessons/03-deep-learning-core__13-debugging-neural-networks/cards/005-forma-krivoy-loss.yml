- concept: плато, колебания и расходимость различаются формой кривой loss
  question: В первом запуске loss почти не меняется, во втором многократно чередует заметные падения и подъёмы, а в третьем всё быстрее растёт и в конце становится NaN. Как правильно классифицировать эти кривые?
  explanation: Почти горизонтальная кривая соответствует плато. Повторяющиеся возвраты между более низкими и высокими значениями означают колебания. Ускоряющийся рост с переходом в NaN указывает на расходимость.
  kind: choice
  options:
    - Плато, колебания, расходимость
    - Колебания, расходимость, плато
    - Расходимость, плато, колебания
  correct: 0
  id: 005-forma-krivoy-loss-1
  fingerprint: 8814ac41
- concept: слишком маленький learning rate может выглядеть как плато loss
  question: Loss устойчиво снижается, но настолько медленно, что на графике кривая кажется почти горизонтальной. Какую настройку оптимизатора стоит проверить первой?
  explanation: При слишком маленьком learning rate параметры обновляются крошечными шагами. Обучение может идти, но снижение loss будет почти незаметным и визуально напоминать плато.
  kind: choice
  options:
    - Не слишком ли мал learning rate
    - Не происходит ли взрыв градиентов
    - Не нужно ли заменить функцию потерь на случайную
  correct: 0
