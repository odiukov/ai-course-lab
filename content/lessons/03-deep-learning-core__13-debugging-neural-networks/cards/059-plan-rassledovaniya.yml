- concept: расследование неизвестного отказа нейросети идёт от дешёвых широких проверок к узким диагностическим процедурам
  question: Расположите этапы расследования неизвестного отказа обучения в рациональном порядке.
  explanation: Широкие и дешёвые проверки сначала определяют класс проблемы. Послойная диагностика и gradient checking становятся полезнее после того, как область поиска уже сужена.
  kind: order
  items:
    - Воспроизвести симптом на минимальном управляемом примере
    - Проверить данные, формы тензоров и конечность чисел
    - Попытаться переобучить модель на одном batch
    - Исследовать послойные активации и градиенты
    - Выполнить gradient checking для подозрительного участка
  id: 059-plan-rassledovaniya-1
  fingerprint: 7076a781
- concept: преждевременное подавление симптома может скрыть первопричину отказа
  question: Во время обучения появился неизвестный численный отказ. После включения gradient clipping симптом исчез. Какой вывод обоснован?
  explanation: Gradient clipping ограничивает проявление неустойчивости, но исчезновение симптома не доказывает устранение его причины. Изменение также затрудняет сравнение с исходным отказом.
  kind: choice
  options:
    - Причиной отказа наверняка было отсутствие clipping
    - Backprop теперь гарантированно реализован правильно
    - Clipping мог скрыть симптом, поэтому первопричину ещё нужно установить
    - Можно исключить ошибки данных и функции потерь
  correct: 2
