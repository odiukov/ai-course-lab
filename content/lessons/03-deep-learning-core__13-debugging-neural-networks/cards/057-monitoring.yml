- concept: сигнал мониторинга обнаруживает симптом отказа, но не устанавливает его первопричину
  question: Почему оповещение о резком росте градиентов нельзя считать готовым диагнозом сбоя обучения и какие данные оно должно сохранить для расследования?
  explanation: Мониторинг отвечает на вопросы «где и когда началось отклонение», но не обязательно «почему». Контекст тревоги с шагом, слоем и значениями метрик превращает общий сигнал о сбое в конкретную точку для диагностики.
  kind: open
  reference: Рост градиентов — это наблюдаемый симптом, который может быть вызван learning rate, проблемным батчем, архитектурой или численно нестабильной операцией. Оповещение должно сохранить шаг обучения, имя слоя и измеренные статистики, чтобы локализовать первое отклонение и затем исследовать его причину.
  id: 057-monitoring-2
  fingerprint: 191507b6
