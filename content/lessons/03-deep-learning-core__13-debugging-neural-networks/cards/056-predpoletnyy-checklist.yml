- concept: неожиданное число параметров помогает обнаружить ошибку в размерах слоёв
  question: Перед полным обучением сводка модели показывает, что почти все параметры сосредоточены в одном полносвязном слое, а сеть значительно крупнее ожидаемого. Что следует проверить в первую очередь?
  explanation: Число параметров полносвязного слоя напрямую зависит от его входной и выходной размерностей. Ошибка при вычислении размера тензора после flatten может сделать слой на порядки крупнее задуманного, что хорошо видно в сводке модели.
  kind: choice
  options:
    - Порядок перемешивания обучающих примеров
    - Размеры входа и выхода этого слоя, особенно размер после операции flatten
    - Количество сохранённых контрольных точек
    - Способ усреднения метрики на валидации
  correct: 1
  id: 056-predpoletnyy-checklist-1
  fingerprint: 714a65f8
- concept: выход классификатора содержит отдельный логит для каждого класса каждого примера
  question: Заполни проверку формы выхода многоклассового классификатора после прямого прохода на тестовом batch.
  explanation: Матрица логитов должна содержать по строке на каждый пример и по столбцу на каждый класс. Прямой проход на случайных данных позволяет обнаружить несоответствие этого интерфейса ещё до обучения.
