- concept: поиск аномалий autograd предназначен для временной диагностики из-за вычислительных накладных расходов
  question: Почему torch.autograd.detect_anomaly() обычно отключают после локализации ошибки?
  explanation: Сбор traceback для операций графа и проверки backward создают существенные накладные расходы. После обнаружения подозрительной операции нужно исследовать её входы и численную устойчивость, а диагностический режим выключить.
  kind: open
  reference: Режим сохраняет дополнительную диагностическую информацию и проверяет операции обратного прохода, поэтому заметно замедляет вычисления. Он полезен во время отладки, но не устраняет причину сбоя и не предназначен для постоянного обучения.
  id: 047-anomaly-detection-2
  fingerprint: a237ed16
