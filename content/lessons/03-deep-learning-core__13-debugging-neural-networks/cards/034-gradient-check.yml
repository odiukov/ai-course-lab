- concept: gradient checking пропускает параметры, для которых вычисление градиента отключено
  question: Почему параметр с requires_grad=False следует пропустить при сравнении аналитического и численного градиентов?
  explanation: requires_grad=False отключает накопление аналитического градиента для параметра. При этом параметр всё ещё участвует в прямом проходе и его изменение может влиять на loss.
  kind: choice
  options:
    - Для него намеренно не вычисляется аналитический градиент, с которым можно сравнить численную оценку
    - Его численный градиент всегда строго равен нулю
    - Его значение нельзя временно изменить
    - Он автоматически исключается из прямого прохода модели
