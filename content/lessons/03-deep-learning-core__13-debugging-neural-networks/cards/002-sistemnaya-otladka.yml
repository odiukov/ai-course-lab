- concept: способность переобучиться на маленькой чистой выборке проверяет базовый механизм обучения
  question: Модель обучают без аугментаций на небольшой выборке с проверенными метками, но она не может добиться почти нулевого training loss. Какой вывод наиболее обоснован?
  explanation: Запоминание маленькой чистой выборки — намеренно лёгкая диагностическая задача. Неудача указывает на проблему в оптимизации, градиентах, данных или коде; большой датасет лишь затруднит поиск причины.
  kind: choice
  options:
    - В базовом механизме обучения есть проблема, которую увеличение датасета, вероятно, не исправит
    - Модель хорошо обобщает и поэтому отказывается запоминать обучающие примеры
    - Нужно прежде всего усложнить архитектуру и запустить полное обучение
  correct: 0
  id: 002-sistemnaya-otladka-1
  fingerprint: b46eb524
- concept: последовательное добавление компонентов локализует источник сбоя
  question: Расположите действия в порядке системной отладки пайплайна обучения нейросети.
  explanation: 'Сначала создают рабочую и проверяемую базовую конфигурацию. Затем компоненты возвращают по одному: если после очередного изменения поведение сломалось, круг возможных причин резко сужается.'
  kind: order
  items:
    - Выбрать минимальный проверенный набор данных и задать ожидаемый результат
    - Убедиться, что модель успешно обучается в этом простом случае
    - Добавить один компонент пайплайна или одно усложнение
    - Снова проверить ожидаемое поведение и локализовать сбой при его изменении
  id: 002-sistemnaya-otladka-2
  fingerprint: b6ddb3c2
