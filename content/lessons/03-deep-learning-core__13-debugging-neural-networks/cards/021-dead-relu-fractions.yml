- concept: точные нули после ReLU нужно отличать от малых положительных активаций
  question: Почему при анализе выхода ReLU не следует считать все достаточно малые положительные значения нулевыми?
  explanation: ReLU сохраняет положительные входы, даже если они малы. Такие активации нельзя смешивать с точными нулями, соответствующими неположительной ветви функции.
  kind: choice
  options:
    - Малая положительная активация всё ещё находится на ветви ReLU с ненулевой производной
    - ReLU округляет малые положительные значения до ближайшего целого
    - Пороговое сравнение автоматически меняет параметры слоя
  correct: 0
