- concept: история loss хранит временной ряд, а послойные словари — последние наблюдения для каждого слоя
  question: Отладчик добавляет каждый loss в список, но статистику активаций и градиентов записывает в словари по имени слоя. Как будут представлены эти данные в отчёте после длительного обучения?
  explanation: record_loss добавляет значения в loss_history, поэтому loss образует временной ряд. Запись self.activation_stats[name] и self.gradient_stats[name] заменяет прежнее значение для того же слоя, оставляя снимок последнего соответствующего прохода.
  kind: choice
  options:
    - Для каждого слоя сохранятся временные ряды, а от loss останется только последнее значение
    - Сохранится история loss, а для каждого слоя останется последняя записанная статистика
    - И история loss, и вся послойная статистика будут полностью накапливаться
    - Все данные будут автоматически усреднены по проведённым итерациям
  correct: 1
  id: 050-otchet-debuggera-1
  fingerprint: 0f4b7f14
- concept: согласованность отчёта требует связывать статистику активаций и градиентов с одним завершённым проходом
  question: После обучающего батча выполнили дополнительный прямой проход без обратного, а затем напечатали отчёт NetworkDebugger. Объясните, почему послойные активации и градиенты в нём могут относиться к разным данным.
  explanation: Forward-хуки срабатывают при дополнительном прямом проходе и перезаписывают activation_stats. Backward-хуки без обратного прохода не вызываются, поэтому gradient_stats остаётся от предыдущего батча. Совместная интерпретация такого отчёта может привести к ложной гипотезе.
  kind: open
  reference: Прямой проход обновит статистику активаций, но без backward статистика градиентов не изменится. Поэтому активации будут описывать дополнительный проход, а градиенты — предыдущий обучающий батч.
  id: 050-otchet-debuggera-2
  fingerprint: c092b23a
