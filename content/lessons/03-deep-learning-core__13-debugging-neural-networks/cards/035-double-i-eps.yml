- concept: проверка подмножества параметров не гарантирует обнаружение локализованной ошибки
  question: Почему совпадение аналитических и численных градиентов на нескольких выбранных параметрах не доказывает корректность градиентов для всей модели?
  explanation: Несколько проб хорошо выявляют системные ошибки backprop и экономят вычисления, однако локализованный дефект может не попасть в выбранное подмножество.
  kind: open
  reference: Ошибка может затрагивать только непроверенные параметры или отдельную ветвь вычислений. Проверка большего числа параметров повышает вероятность обнаружения такого дефекта, но проверка подмножества не даёт полной гарантии.
  id: 035-double-i-eps-2
