- concept: доля нулевых активаций после ReLU служит диагностическим признаком мёртвых нейронов
  question: Какую величину полезнее всего измерять по слоям, если сеть с ReLU перестала обучаться и есть подозрение на мёртвые нейроны?
  explanation: ReLU возвращает ноль для отрицательного входа. Если большая доля активаций слоя постоянно равна нулю, многие нейроны могут быть мёртвыми. В таком случае помогают LeakyReLU или уменьшение learning rate.
  kind: choice
  options:
    - Долю активаций, в точности равных нулю после ReLU
    - Среднее значение всех весов модели
    - Разность между первым и последним значением loss
    - Количество примеров в каждом батче
  correct: 0
  id: 006-diagnose-loss-curve-1
  fingerprint: 3aea7f86
- concept: затухание градиентов проявляется сильным уменьшением их величины к первым слоям сети
  question: У глубокой сети с sigmoid градиенты последних слоёв имеют заметную величину, а у первых слоёв почти равны нулю. Объясни вероятную причину и назови подходящие изменения архитектуры.
  explanation: Производные sigmoid и tanh при последовательном перемножении могут экспоненциально уменьшаться. Поэтому сигнал обучения почти не доходит до первых слоёв; активации ReLU/GELU, остаточные связи и нормализация ослабляют эту проблему.
  kind: open
  reference: Вероятно, градиенты затухают при обратном распространении через множество слоёв с sigmoid. Можно заменить sigmoid на ReLU или GELU, добавить residual connections либо batch normalization.
  id: 006-diagnose-loss-curve-2
  fingerprint: 7d63b4c7
- concept: gradient clipping ограничивает норму взрывающихся градиентов
  question: Заполни пропуск в вызове PyTorch, который ограничивает общую норму градиентов перед шагом оптимизатора.
  explanation: При взрывающихся градиентах их нормы быстро растут, и loss может стать NaN. `clip_grad_norm_` ограничивает норму градиентов; также могут помочь меньший learning rate и нормализация.
