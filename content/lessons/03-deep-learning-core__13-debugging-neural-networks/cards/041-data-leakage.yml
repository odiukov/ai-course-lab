- concept: параметры предобработки оцениваются только по обучающей части после разбиения данных
  question: Расположи действия так, чтобы нормализация не передавала информацию из validation и test в обучение.
  explanation: Если вычислить статистики до разбиения, validation и test повлияют на преобразование обучающих данных. Честная схема сначала изолирует части, затем оценивает параметры только по train.
  kind: order
  items:
    - Разделить исходные примеры на train, validation и test
    - Вычислить среднее и стандартное отклонение только по train
    - Применить зафиксированные параметры ко всем частям без повторной оценки
  id: 041-data-leakage-1
  fingerprint: 6d6d770b
- concept: связанные примеры следует распределять по наборам группами, чтобы исключить утечку между частями
  question: Датасет состоит из кадров коротких видеороликов. Какое разбиение лучше всего предотвращает попадание почти одинаковых кадров в train и test?
  explanation: Соседние кадры одного ролика сильно коррелируют. Если разделять их независимо, модель может встретить почти тот же объект и фон при обучении. Разбиение по целым роликам сохраняет независимость test.
  kind: choice
  options:
    - Случайно распределить каждый кадр независимо
    - Перемешать все кадры после аугментации и затем разделить
    - Назначить каждый ролик целиком только одной части датасета
    - Оставить в test по одному случайному кадру каждого ролика из train
  correct: 2
  id: 041-data-leakage-2
  fingerprint: d695f05e
