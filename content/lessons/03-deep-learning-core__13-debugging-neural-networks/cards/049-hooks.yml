- concept: дескриптор зарегистрированного хука нужен для прекращения наблюдения и предотвращения повторных вызовов
  question: Почему после завершения диагностики следует вызвать remove() у сохранённых дескрипторов хуков?
  explanation: Регистрация хука действует до явного удаления. remove() отключает соответствующий callback; очистка всех сохранённых дескрипторов предотвращает накопление наблюдателей при повторных запусках диагностики.
  kind: open
  reference: Хуки остаются зарегистрированными и продолжают срабатывать при последующих проходах модели. Если затем зарегистрировать новые хуки, каждый проход вызовет и старые, и новые обработчики, что приведёт к повторному сбору статистики и лишним накладным расходам.
