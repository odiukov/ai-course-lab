- concept: CrossEntropyLoss принимает метки классов как целочисленные индексы типа long
  question: Метки классов переданы в `CrossEntropyLoss` как тензор с дробным dtype. Как их подготовить и почему?
  explanation: Для классификации метка задаёт номер класса, поэтому её dtype должен быть `long`. Дробный dtype нарушает контракт функции потерь и обычно приводит к ошибке типа.
  kind: open
  reference: Преобразовать метки в `torch.long`, например вызовом `labels.long()`, потому что обычный режим CrossEntropyLoss ожидает целочисленный индекс правильного класса для каждого объекта, а не дробное значение.
  id: 046-formy-device-dtype-3
  fingerprint: '08862295'
