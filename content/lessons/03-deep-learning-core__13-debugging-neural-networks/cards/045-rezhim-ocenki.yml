  question: Расположи действия для проверки модели между эпохами, если после неё обучение должно продолжиться.
  explanation: Сначала модель переводят в режим оценки, затем выполняют предсказания без построения графа. Перед продолжением обучения вызывают `model.train()`, чтобы Dropout и BatchNorm снова работали в обучающем режиме.
