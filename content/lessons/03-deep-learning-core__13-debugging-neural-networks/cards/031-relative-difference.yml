- concept: относительная разница симметрична относительно перестановки сравниваемых градиентов
  question: Заполни пропуск для любых конечных градиентов a и b.
  explanation: Перестановка градиентов не меняет ни абсолютную разницу в числителе, ни максимум модулей в знаменателе. Поэтому результат не зависит от порядка аргументов.
  kind: cloze
  template: relative_difference(a, b) ___ relative_difference(b, a)
  answer: '='
  accept:
    - ==
    - равно
  id: 031-relative-difference-1
  fingerprint: 198d1f44
- concept: противоположные знаки градиентов означают максимальное расхождение при равных модулях
  question: Модули аналитического и численного градиентов превышают защитную нижнюю границу. В каком случае relative_difference будет наибольшей?
  explanation: 'У равных по модулю градиентов с противоположными знаками абсолютная разница вдвое больше модуля каждого из них, поэтому relative_difference равна 2. Такое расхождение критично: градиенты указывают противоположные направления обновления.'
  kind: choice
  options:
    - Градиенты совпадают по величине и знаку
    - Градиенты равны по модулю, но противоположны по знаку
    - Градиенты имеют одинаковый знак, но немного различаются по модулю
  correct: 1
  id: 031-relative-difference-2
