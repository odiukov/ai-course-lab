- concept: torch.no_grad отключает построение графа, но не отменяет изменение параметров
  question: Численный loss вычислялся внутри torch.no_grad(), но временно изменённый вес остался в модели. Почему контекст не восстановил его автоматически?
  explanation: Контекст torch.no_grad() не создаёт журнал отката состояния. В показанной реализации восстановление выполняется явно строкой param.data[idx] = original после обоих временных возмущений.
  kind: choice
  options:
    - torch.no_grad() отключает запись операций для autograd, но не откатывает присваивания параметрам
    - torch.no_grad() восстанавливает только параметры целочисленного типа
    - Откат выполняется лишь после вызова optimizer.step()
    - Восстановление происходит только при переходе модели обратно в float
