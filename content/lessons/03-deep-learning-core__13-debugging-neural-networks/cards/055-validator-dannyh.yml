- concept: соответствие входов и меток проверяют после всех преобразований пайплайна
  question: Исходные изображения и файл меток по отдельности корректны, но загрузчик независимо перемешивает их порядок. Какая проверка непосредственно обнаружит ошибку?
  explanation: Независимое перемешивание нарушает связь между входом и меткой, хотя сами изображения, метки и формы тензоров остаются корректными. Поэтому проверять нужно именно пары, поступающие модели после загрузки и преобразований.
  kind: choice
  options:
    - Просмотр случайных пар «преобразованный вход — метка» на выходе загрузчика
    - Проверка распределения классов в файле меток
    - Проверка формы батча с изображениями
  correct: 0
  id: 055-validator-dannyh-1
  fingerprint: 073502a2
- concept: дубликаты внутри обучающей выборки неявно изменяют вес примеров
  question: Один и тот же обучающий пример сохранён под разными именами и несколько раз попадает в выборку. Как это влияет на обучение?
  explanation: Оптимизатор не знает, что записи являются копиями. Каждый повтор снова вносит вклад в loss и градиенты, поэтому представленный дубликатами пример влияет на параметры сильнее остальных.
  kind: choice
  options:
    - Пример получает больший эффективный вес, потому что чаще участвует в обновлении параметров
    - Пример автоматически исключается функцией потерь как повтор
    - Меняется только порядок батчей, но не вклад примера в обучение
  correct: 0
