- concept: неверный масштаб признаков может остаться незамеченным при проверке форм и типов
  question: Объясни, почему совпадение формы и типа входного тензора с ожиданиями модели ещё не подтверждает корректность масштаба данных. Как это проверить?
  explanation: Форма описывает расположение элементов, а dtype — способ их хранения; ни то ни другое не проверяет единицы измерения и численный диапазон. Статистики фактических входов позволяют обнаружить пропущенную нормализацию или несопоставимые масштабы признаков.
  kind: open
  reference: Тензор может иметь правильные форму и dtype, но содержать значения в неожидаемых единицах или диапазоне. Тогда отдельные признаки способны непропорционально влиять на вычисления и обучение. Следует исследовать диапазон, среднее, стандартное отклонение и другие статистики каждого входного признака после всех преобразований.
  id: 055-validator-dannyh-3
  fingerprint: 3f2db288
