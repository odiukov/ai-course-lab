- concept: переобучение проявляется расходящимся поведением training loss и validation loss
  question: Какое поведение функций потерь наиболее характерно для переобучения нейросети?
  explanation: При переобучении модель всё точнее подгоняется под обучающую выборку, поэтому training loss падает. Одновременно качество на невидимых данных ухудшается, что проявляется ростом validation loss.
  kind: choice
  options:
    - Training loss снижается, а validation loss после улучшения начинает расти
    - Training loss и validation loss устойчиво снижаются вместе
    - Training loss остаётся неизменным с первой эпохи
    - Training loss и validation loss одновременно становятся неконечными
  correct: 0
  id: 040-overfitting-1
  fingerprint: 80cdf81a
- concept: ранняя остановка выбирает модель по минимуму validation loss
  question: Объясни своими словами, почему при ранней остановке сохраняют состояние модели с наименьшим validation loss, а не обязательно состояние после последней эпохи.
  explanation: Последняя эпоха не обязательно даёт лучшее качество на новых данных. Если validation loss уже начал расти, дальнейшее обучение усиливает переобучение, даже когда training loss продолжает снижаться.
  kind: open
  reference: После достижения минимума validation loss модель может продолжать уменьшать training loss за счёт запоминания обучающих примеров, одновременно ухудшая обобщение. Поэтому состояние с лучшим validation loss обычно предпочтительнее последнего.
  id: 040-overfitting-2
  fingerprint: 6bcf953a
