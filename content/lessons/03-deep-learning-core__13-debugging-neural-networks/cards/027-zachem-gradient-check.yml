- concept: расхождение аналитического и численного градиентов указывает на ошибку в backprop
  question: Градиенты конечны и ненулевые, однако gradient checking показывает устойчивое расхождение между backprop и конечными разностями. Какой вывод наиболее обоснован?
  explanation: Численный градиент служит независимой проверкой backprop. Устойчивое расхождение указывает на ошибку дифференцирования, например потерянный знак, пропущенное слагаемое или неверную работу с осями.
  kind: choice
  options:
    - В обратном проходе, вероятно, есть ошибка
    - Нужно лишь уменьшить learning rate
    - Архитектура сети слишком мала
    - Обучающие данные необходимо перемешать
  correct: 0
  id: 027-zachem-gradient-check-1
  fingerprint: fdec2cea
- concept: успешный gradient checking подтверждает дифференцирование реализованного loss, но не правильность постановки задачи
  question: Что можно и чего нельзя заключить, если аналитические и численные градиенты хорошо согласуются?
  explanation: Gradient checking проверяет согласованность обратного прохода с фактически вычисляемым loss. Он не оценивает корректность самого замысла модели и постановки задачи.
  kind: open
  reference: Можно заключить, что backprop, вероятнее всего, правильно вычисляет производные реализованного loss. Нельзя заключить, что выбраны подходящие данные, архитектура и функция потерь или что модель решает задуманную задачу.
  id: 027-zachem-gradient-check-2
  fingerprint: 176faeb0
