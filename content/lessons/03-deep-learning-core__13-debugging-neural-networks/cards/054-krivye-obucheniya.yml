- concept: высокие и близкие training loss и validation loss указывают на недообучение
  question: К концу обучения training loss и validation loss остаются высокими и почти не отличаются друг от друга. Какой диагноз наиболее вероятен?
  explanation: Высокий training loss означает, что модель не справилась даже с обучающими примерами. Близкий validation loss подтверждает, что проблема не в разрыве обобщения, а в недостаточной способности модели описать закономерность.
  kind: choice
  options:
    - Недообучение
    - Переобучение
    - Утечка данных
    - Взрыв градиентов
  correct: 0
  id: 054-krivye-obucheniya-1
  fingerprint: 81dd6c0b
- concept: совместное снижение training loss и validation loss при небольшом устойчивом разрыве характеризует здоровое обучение
  question: Объясни своими словами, какое поведение training loss и validation loss свидетельствует о здоровом обучении нейросети.
  explanation: Падение одного training loss показывает только улучшение на знакомых примерах. Совместное снижение обеих ошибок при небольшом разрыве свидетельствует, что обучение переносится на валидационные данные.
  kind: open
  reference: Обе кривые должны снижаться, а разрыв между ними — оставаться небольшим и не расти систематически. Это означает, что модель улучшает качество и на обучающих, и на новых данных.
  id: 054-krivye-obucheniya-2
  fingerprint: fd216a3d
- concept: недообучение устраняют увеличением выразительности модели, улучшением признаков или более длительным обучением
  question: 'Модель недообучается: ошибки на обучающей и валидационной выборках остаются высокими. Какое изменение непосредственно направлено на устранение этой проблемы?'
  explanation: При недообучении модели не хватает выразительности, информативных признаков или времени оптимизации. Усиление регуляризации обычно дополнительно ограничивает модель и может сделать недообучение ещё заметнее.
  kind: choice
  options:
    - Увеличить ёмкость модели или добавить полезные признаки
    - Усилить dropout и weight decay
    - Остановить обучение при минимуме validation loss
    - Уменьшить обучающую выборку
  correct: 0
