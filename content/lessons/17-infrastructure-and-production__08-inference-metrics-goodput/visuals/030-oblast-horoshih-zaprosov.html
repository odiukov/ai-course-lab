<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Область запросов, одновременно проходящих составной SLO</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f8fafc;
    --panel: #ffffff;
    --ink: #172033;
    --muted: #667085;
    --grid: #d5dbe5;
    --axis: #344054;
    --ttft: #2563a9;
    --tpot: #9a4d00;
    --e2e: #7653b6;
    --good-fill: #c9f1d8;
    --good-line: #15824b;
    --good-dot: #08713e;
    --bad-dot: #b44848;
    --bad-ring: #f7d4d4;
    --corner: #bd3b3b;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #111827;
      --panel: #182132;
      --ink: #eef2f7;
      --muted: #b4bdcb;
      --grid: #3c485d;
      --axis: #cbd5e1;
      --ttft: #78b7ff;
      --tpot: #ffb866;
      --e2e: #c1a7ff;
      --good-fill: #174f38;
      --good-line: #69daa0;
      --good-dot: #92e8b8;
      --bad-dot: #ff9292;
      --bad-ring: #622f39;
      --corner: #ff8585;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  figure {
    margin: 0;
    background: var(--panel);
    border: 1px solid var(--grid);
  }

  h1 {
    margin: 0;
    padding: 16px 22px 8px;
    font-size: 20px;
    line-height: 1.25;
    font-weight: bold;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 450px;
    background: var(--panel);
  }

  .axis {
    fill: none;
    stroke: var(--axis);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .threshold-ttft {
    fill: none;
    stroke: var(--ttft);
    stroke-width: 2.5;
  }

  .threshold-tpot {
    fill: none;
    stroke: var(--tpot);
    stroke-width: 2.5;
  }

  .threshold-e2e {
    fill: none;
    stroke: var(--e2e);
    stroke-width: 3;
  }

  .good-area {
    fill: var(--good-fill);
    stroke: var(--good-line);
    stroke-width: 2.5;
    stroke-linejoin: round;
  }

  .guide {
    fill: none;
    stroke: var(--grid);
    stroke-width: 1.5;
  }

  .callout {
    fill: none;
    stroke: var(--corner);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .good-point {
    fill: var(--good-dot);
    stroke: var(--panel);
    stroke-width: 2;
  }

  .bad-point {
    fill: var(--bad-dot);
    stroke: var(--bad-ring);
    stroke-width: 3;
  }

  .corner-point {
    fill: var(--panel);
    stroke: var(--corner);
    stroke-width: 3;
  }

  text {
    fill: var(--ink);
    font-size: 15px;
  }

  .axis-label {
    fill: var(--axis);
    font-size: 15px;
    font-weight: bold;
  }

  .ttft-label {
    fill: var(--ttft);
    font-size: 16px;
    font-weight: bold;
  }

  .tpot-label {
    fill: var(--tpot);
    font-size: 16px;
    font-weight: bold;
  }

  .e2e-label {
    fill: var(--e2e);
    font-size: 16px;
    font-weight: bold;
  }

  .good-label {
    fill: var(--good-line);
    font-size: 17px;
    font-weight: bold;
  }

  .good-note {
    fill: var(--good-line);
    font-size: 14px;
  }

  .warning-label {
    fill: var(--corner);
    font-size: 15px;
    font-weight: bold;
  }

  .warning-note {
    fill: var(--corner);
    font-size: 14px;
  }

  .legend {
    fill: var(--muted);
    font-size: 14px;
  }

  .tick {
    fill: var(--muted);
    font-size: 14px;
  }

  #fallback {
    margin: 0;
    padding: 22px;
    color: var(--corner);
    font-size: 16px;
  }
</style>
</head>
<body>
<figure aria-labelledby="diagram-heading">
  <h1 id="diagram-heading">Область запросов, которые одновременно проходят составной SLO</h1>
  <svg id="diagram"
       viewBox="80 42 820 410"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="svg-title svg-description">
    <title id="svg-title">Пересечение ограничений TTFT, TPOT и E2E</title>
    <desc id="svg-description">На координатной плоскости выделена только область левее TTFT 800 миллисекунд, ниже TPOT 25 миллисекунд и ниже границы E2E 3 секунды для ответа в 300 токенов.</desc>
  </svg>
  <p id="fallback" hidden>Схема должна была показать общую область запросов, которые одновременно проходят TTFT ≤ 800 мс, TPOT ≤ 25 мс и E2E ≤ 3 с для ответа до 300 токенов.</p>
</figure>

<script>
const DIAGRAM_DATA = Object.freeze([{
  map: [150, 402, 0.66, 10.8],
  zero: 0,
  one: 1,
  axes: {
    xMax: 1040,
    yMax: 32,
    xHead: [[1040, 0], [1022, 0.7], [1022, -0.7]],
    yHead: [[0, 32], [-11, 30.7], [11, 30.7]]
  },
  limits: {
    ttft: 800,
    tpot: 25,
    e2eMs: 3000,
    tokens: 300
  },
  labels: {
    gap: 10,
    ttft: [780, 19],
    tpot: [1030, 25],
    e2e: [1018, 12.2],
    xAxis: [1025, 1.5],
    yAxis: [0, 32],
    xTick: [800, -1.7],
    yTick: [-18, 25],
    goodMain: [390, 4.3],
    goodNote: [390, 2.1],
    warningMain: [430, 30.4],
    warningNote: [430, 28.7],
    legendGoodPoint: [70, -3.8],
    legendGoodText: [98, -3.8],
    legendBadPoint: [470, -3.8],
    legendBadText: [498, -3.8]
  },
  warningArrow: {
    path: [[585, 28.2], [700, 28.2], [792, 25.5]],
    headA: [[792, 25.5], [776, 25.8]],
    headB: [[792, 25.5], [787, 26.9]]
  },
  pointRadius: 7,
  cornerRadius: 9,
  cross: {
    leftTop: [786, 26.1],
    rightBottom: [814, 23.9],
    leftBottom: [786, 23.9],
    rightTop: [814, 26.1]
  },
  points: [
    [120, 4],
    [340, 7],
    [610, 4],
    [755, 6],
    [200, 16],
    [485, 12],
    [705, 22],
    [780, 9],
    [900, 5],
    [510, 28]
  ]
}]);

const [D] = DIAGRAM_DATA;
const [originX, originY, scaleX, scaleY] = D.map;
const origin = Object.freeze({ x: originX, y: originY });
const scale = Object.freeze({ x: scaleX, y: scaleY });
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y - y * scale.y;

try {
  const svg = document.querySelector("#diagram");
  const fallback = document.querySelector("#fallback");
  const namespace = "http://www.w3.org/2000/svg";

  const node = (name, attributes = {}, content) => {
    const element = document.createElementNS(namespace, name);
    for (const [key, value] of Object.entries(attributes)) {
      element.setAttribute(key, String(value));
    }
    if (content !== undefined) element.textContent = content;
    return element;
  };

  const add = element => {
    svg.appendChild(element);
    return element;
  };

  const line = (x1, y1, x2, y2, className) =>
    node("line", {
      x1: sx(x1),
      y1: sy(y1),
      x2: sx(x2),
      y2: sy(y2),
      class: className
    });

  const polyline = (points, className) =>
    node("polyline", {
      points: points.map(([x, y]) => `${sx(x)},${sy(y)}`).join(" "),
      class: className
    });

  const polygon = (points, className) =>
    node("polygon", {
      points: points.map(([x, y]) => `${sx(x)},${sy(y)}`).join(" "),
      class: className
    });

  const circle = (x, y, radius, className) =>
    node("circle", {
      cx: sx(x),
      cy: sy(y),
      r: Math.abs(sx(radius) - sx(D.zero)),
      class: className
    });

  const label = (x, y, content, className, anchor, dx, dy) =>
    node("text", {
      x: sx(x),
      y: sy(y),
      class: className,
      "text-anchor": anchor,
      dx,
      dy
    }, content);

  const e2eY = x =>
    (D.limits.e2eMs - x) / D.limits.tokens;

  const isGood = ([x, y]) =>
    x <= D.limits.ttft &&
    y <= D.limits.tpot &&
    x + D.limits.tokens * y <= D.limits.e2eMs;

  const goodArea = [
    [D.zero, D.zero],
    [D.limits.ttft, D.zero],
    [D.limits.ttft, e2eY(D.limits.ttft)],
    [D.zero, e2eY(D.zero)]
  ];

  add(polygon(goodArea, "good-area"));

  add(line(
    D.zero,
    D.limits.tpot,
    D.axes.xMax,
    D.limits.tpot,
    "guide"
  ));

  add(line(
    D.limits.ttft,
    D.zero,
    D.limits.ttft,
    D.axes.yMax,
    "guide"
  ));

  add(line(
    D.zero,
    D.zero,
    D.axes.xMax,
    D.zero,
    "axis"
  ));

  add(line(
    D.zero,
    D.zero,
    D.zero,
    D.axes.yMax,
    "axis"
  ));

  add(polygon(D.axes.xHead, "axis"));
  add(polygon(D.axes.yHead, "axis"));

  add(line(
    D.limits.ttft,
    D.zero,
    D.limits.ttft,
    D.axes.yMax,
    "threshold-ttft"
  ));

  add(line(
    D.zero,
    D.limits.tpot,
    D.axes.xMax,
    D.limits.tpot,
    "threshold-tpot"
  ));

  add(line(
    D.zero,
    e2eY(D.zero),
    D.axes.xMax,
    e2eY(D.axes.xMax),
    "threshold-e2e"
  ));

  for (const [x, y] of D.points) {
    add(circle(
      x,
      y,
      D.pointRadius,
      isGood([x, y]) ? "good-point" : "bad-point"
    ));
  }

  add(circle(
    D.limits.ttft,
    D.limits.tpot,
    D.cornerRadius,
    "corner-point"
  ));

  add(line(
    D.cross.leftTop[D.zero],
    D.cross.leftTop[D.one],
    D.cross.rightBottom[D.zero],
    D.cross.rightBottom[D.one],
    "callout"
  ));

  add(line(
    D.cross.leftBottom[D.zero],
    D.cross.leftBottom[D.one],
    D.cross.rightTop[D.zero],
    D.cross.rightTop[D.one],
    "callout"
  ));

  add(polyline(D.warningArrow.path, "callout"));
  add(polyline(D.warningArrow.headA, "callout"));
  add(polyline(D.warningArrow.headB, "callout"));

  const gap = D.labels.gap;

  add(label(
    D.labels.yAxis[D.zero],
    D.labels.yAxis[D.one],
    "TPOT, мс/токен",
    "axis-label",
    "start",
    gap,
    gap
  ));

  add(label(
    D.labels.xAxis[D.zero],
    D.labels.xAxis[D.one],
    "TTFT, мс",
    "axis-label",
    "end",
    -gap,
    -gap
  ));

  add(label(
    D.labels.xTick[D.zero],
    D.labels.xTick[D.one],
    "800 мс",
    "tick",
    "middle",
    D.zero,
    gap
  ));

  add(label(
    D.labels.yTick[D.zero],
    D.labels.yTick[D.one],
    "25 мс",
    "tick",
    "end",
    -gap,
    gap
  ));

  add(label(
    D.labels.ttft[D.zero],
    D.labels.ttft[D.one],
    "TTFT ≤ 800 мс",
    "ttft-label",
    "end",
    -gap,
    D.zero
  ));

  add(label(
    D.labels.tpot[D.zero],
    D.labels.tpot[D.one],
    "TPOT ≤ 25 мс",
    "tpot-label",
    "end",
    -gap,
    -gap
  ));

  add(label(
    D.labels.e2e[D.zero],
    D.labels.e2e[D.one],
    "TTFT + 300 × TPOT ≤ 3 с",
    "e2e-label",
    "end",
    -gap,
    -gap
  ));

  add(label(
    D.labels.goodMain[D.zero],
    D.labels.goodMain[D.one],
    "GOODPUT: проходят все три условия",
    "good-label",
    "middle",
    D.zero,
    D.zero
  ));

  add(label(
    D.labels.goodNote[D.zero],
    D.labels.goodNote[D.one],
    "только общая закрашенная область",
    "good-note",
    "middle",
    D.zero,
    D.zero
  ));

  add(label(
    D.labels.warningMain[D.zero],
    D.labels.warningMain[D.one],
    "25 мс × 300 токенов = 7,5 с",
    "warning-label",
    "middle",
    D.zero,
    D.zero
  ));

  add(label(
    D.labels.warningNote[D.zero],
    D.labels.warningNote[D.one],
    "верхний угол не проходит E2E ≤ 3 с",
    "warning-note",
    "middle",
    D.zero,
    D.zero
  ));

  add(circle(
    D.labels.legendGoodPoint[D.zero],
    D.labels.legendGoodPoint[D.one],
    D.pointRadius,
    "good-point"
  ));

  add(label(
    D.labels.legendGoodText[D.zero],
    D.labels.legendGoodText[D.one],
    "запрос проходит составной SLO",
    "legend",
    "start",
    gap,
    gap
  ));

  add(circle(
    D.labels.legendBadPoint[D.zero],
    D.labels.legendBadPoint[D.one],
    D.pointRadius,
    "bad-point"
  ));

  add(label(
    D.labels.legendBadText[D.zero],
    D.labels.legendBadText[D.one],
    "нарушено хотя бы одно условие",
    "legend",
    "start",
    gap,
    gap
  ));

  fallback.hidden = true;
} catch (error) {
  document.querySelector("#diagram").hidden = true;
  document.querySelector("#fallback").hidden = false;
}
</script>
</body>
</html>
