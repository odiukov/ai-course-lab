<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Что модель угадывает в каждом случае</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1a1d21; --muted:#5b6470; --line:#8a94a3;
    --bad:#c0392b; --good:#1e7a4d; --badfill:#fdecea; --goodfill:#e7f5ee;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171c; --fg:#e8ecf1; --muted:#9aa5b3; --line:#6e7887;
      --bad:#ff8a7a; --good:#5fd39a; --badfill:#2c1d1c; --goodfill:#152a22;
    }
  }
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:100%;padding:10px 8px 12px;box-sizing:border-box;background:var(--bg);}
  h2{font-size:15px;margin:0 0 6px;font-weight:600;letter-spacing:.01em;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .fail{font-size:13px;line-height:1.5;color:var(--fg);}
  text{font-family:inherit;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
</style>
</head>
<body>
<div class="wrap">
  <h2>Что модель угадывает в каждом случае</h2>
  <div id="host">
    <noscript class="fail">Слева — <code>do_everything(action, target, options)</code>: три угадывания подряд, 0,9 × 0,9 × 0,9 ≈ 0,73. Справа — <code>notes_delete(note_id)</code>: одно угадывание, 0,9. Разница 15–30 %.</div>
  </div>
</div>
<script>
(function(){
var host = document.getElementById('host');
try{
  /* ---------- данные схемы ---------- */
  var D = {
    left:  {x:5, name:'do_everything(action, target, options)',
            args:[{x:2, label:'action'},{x:5, label:'target'},{x:8, label:'options'}],
            p:'0,9 × 0,9 × 0,9 ≈ 0,73'},
    right: {x:19, name:'notes_delete(note_id)',
            args:[{x:19, label:'note_id'}],
            p:'0,9'},
    yQ:2, yArg:4, yBox:6, yProb:8.6, yGap:10.4,
    boxW:5.2, boxH:1.5, halfL:5.2, halfR:2.6,
    xMin:0, xMax:24, gapX:12
  };
  /* ---------- одна пара sx/sy ---------- */
  var origin = {x:26, y:16}, scale = 34;
  function sx(x){ return origin.x + x*scale; }
  function sy(y){ return origin.y + y*scale; }

  var VB_W = 900, VB_H = 430;
  var PAD = 6, FS = 13, FS_S = 12, LW = 1.6;

  var NS='http://www.w3.org/2000/svg';
  function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}
  function txt(x,y,s,anchor,cls,fill,size){
    var t=el('text',{x:x,y:y,'text-anchor':anchor,'font-size':size||FS,fill:fill||'var(--fg)'});
    if(cls)t.setAttribute('class',cls);
    t.appendChild(document.createTextNode(s)); svg.appendChild(t); return t;
  }
  var svg = el('svg',{viewBox:'0 0 '+VB_W+' '+VB_H,preserveAspectRatio:'xMidYMid meet',
                      role:'img','aria-label':'Сравнение числа угадываний у монолитного и атомарного инструмента'});

  var defs=el('defs',{});
  function marker(id,color){
    var m=el('marker',{id:id,viewBox:'0 0 10 10',refX:'9',refY:'5',
      markerWidth:'6',markerHeight:'6',orient:'auto-start-reverse'});
    m.appendChild(el('path',{d:'M0,0 L10,5 L0,10 z',fill:color}));
    defs.appendChild(m);
  }
  marker('aBad','var(--bad)'); marker('aGood','var(--good)');
  svg.appendChild(defs);

  /* ---------- разделитель посередине ---------- */
  svg.appendChild(el('line',{x1:sx(D.gapX),y1:sy(0.4),x2:sx(D.gapX),y2:sy(D.yGap),
    stroke:'var(--line)','stroke-width':LW,'stroke-dasharray':'5 6',opacity:'.55'}));

  /* ---------- одна сторона ---------- */
  function side(cfg, color, fill, half, marker, title, verdict){
    var bx1=sx(cfg.x-half), bx2=sx(cfg.x+half);
    var by1=sy(D.yBox), by2=sy(D.yBox+D.boxH);
    svg.appendChild(el('rect',{x:bx1,y:by1,width:bx2-bx1,height:by2-by1,rx:sx(0.3)-sx(0),
      fill:fill,stroke:color,'stroke-width':LW}));
    txt((bx1+bx2)/2, sy(D.yBox+D.boxH/2)+FS*0.36, cfg.name,'middle','mono',color, FS);

    txt(sx(cfg.x), sy(0.4)+FS, title,'middle',null,color,FS);

    cfg.args.forEach(function(a){
      txt(sx(a.x), sy(D.yQ), '?','middle',null,color, FS*2.1);
      txt(sx(a.x), sy(D.yArg)+PAD, a.label,'middle','mono','var(--muted)',FS_S);
      svg.appendChild(el('line',{
        x1:sx(a.x), y1:sy(D.yArg)+PAD*2, x2:sx(a.x), y2:sy(D.yBox)-PAD,
        stroke:color,'stroke-width':LW,'marker-end':'url(#'+marker+')'}));
    });

    txt(sx(cfg.x), sy(D.yProb), cfg.p,'middle','mono',color, FS+1);
    txt(sx(cfg.x), sy(D.yGap), verdict,'middle',null,'var(--muted)',FS_S);
  }

  side(D.left,'var(--bad)','var(--badfill)',D.halfL,'aBad',
       'Три угадывания','шансы перемножаются');
  side(D.right,'var(--good)','var(--goodfill)',D.halfR,'aGood',
       'Одно угадывание','имя уже всё сказало');

  /* ---------- подпись разницы: у хвоста, слева от разделителя сверху ---------- */
  txt(sx(D.gapX), sy(D.yProb+0.75), '15–30 % разницы в точности выбора','middle',null,'var(--fg)',FS+1);

  host.innerHTML='';
  host.appendChild(svg);
}catch(e){
  host.innerHTML='<div class="fail"><b>Схема не построилась.</b> Она показывает два вызова рядом. '+
    'Слева <code>do_everything(action, target, options)</code> — три знака вопроса над аргументами, '+
    'три попадания подряд: 0,9 × 0,9 × 0,9 ≈ 0,73. Справа <code>notes_delete(note_id)</code> — '+
    'один типизированный аргумент, одно попадание: 0,9. Между ними — 15–30 % разницы в точности выбора.</div>';
}
})();
</script>
</body>
</html>
