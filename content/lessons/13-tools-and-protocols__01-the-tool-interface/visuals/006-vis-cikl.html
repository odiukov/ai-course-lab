<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Схема цикла</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1c1c1e; --muted:#6b7280;
    --host:#1d4ed8; --model:#b45309; --exit:#b91c1c; --line:#4b5563;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12141a; --fg:#e8eaf0; --muted:#98a2b3;
      --host:#7dabff; --model:#f5b склад;
    }
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12141a; --fg:#e8eaf0; --muted:#98a2b3;
      --host:#7dabff; --model:#f0b45c; --exit:#f27a7a; --line:#9aa4b2;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:900px;margin:0 auto;padding:8px 10px 12px;}
  h2{font-size:15px;margin:0 0 6px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .legend{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5;}
  .sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px;}
  .err{font-size:13px;line-height:1.55;color:var(--fg);}
</style>
</head>
<body>
<div class="wrap">
  <h2>Цикл вызова инструментов: describe → decide → execute → observe</h2>
  <div id="slot"></div>
  <div class="legend">
    <span class="sw" style="background:var(--host)"></span>хост &nbsp;
    <span class="sw" style="background:var(--model)"></span>модель &nbsp;
    <span class="sw" style="background:var(--exit)"></span>выходы из цикла
  </div>
</div>
<script>
(function(){
  var slot = document.getElementById('slot');
  try{
    // ---- данные схемы -------------------------------------------------
    var STEPS = [
      {id:'describe', label:'describe', owner:'хост',   note:'один раз',        x:0,  y:6 },
      {id:'decide',   label:'decide',   owner:'модель', note:'вызовы или текст',x:8,  y:6 },
      {id:'execute',  label:'execute',  owner:'хост',   note:'обычный код',     x:8,  y:0 },
      {id:'observe',  label:'observe',  owner:'хост',   note:'результат + id',  x:0,  y:0 }
    ];
    var EXITS = [
      {from:'decide', label:'нет вызовов', x:14, y:7.4},
      {from:'decide', label:'10 витков',   x:14, y:4.6}
    ];
    var BOXW = 4.6, BOXH = 1.9;

    // ---- одна пара функций перевода -----------------------------------
    var ORIGIN = {x:120, y:200}, SCALE = 34;
    function sx(x){ return ORIGIN.x + x*SCALE; }
    function sy(y){ return ORIGIN.y - y*SCALE; }

    var VBW = 760, VBH = 330;
    var PAD = 6, FS = 13, FSS = 11, LW = 1.6;

    var NS='http://www.w3.org/2000/svg';
    function el(n,a){ var e=document.createElementNS(NS,n);
      for(var k in a) e.setAttribute(k,a[k]); return e; }
    function txt(x,y,s,anchor,cls,size){
      var t=el('text',{x:x,y:y,'text-anchor':anchor,'font-size':size||FS,
        'font-family':'inherit',class:cls}); t.textContent=s; return t; }

    var svg = el('svg',{viewBox:'0 0 '+VBW+' '+VBH,
      preserveAspectRatio:'xMidYMid meet',role:'img'});
    svg.appendChild(el('rect',{x:0,y:0,width:VBW,height:VBH,fill:'var(--bg)'}));

    var byId={};
    STEPS.forEach(function(s){ byId[s.id]=s; });

    // ---- блоки --------------------------------------------------------
    STEPS.forEach(function(s){
      var col = s.owner==='модель' ? 'var(--model)' : 'var(--host)';
      var x0=sx(s.x-BOXW/2), y0=sy(s.y+BOXH/2);
      svg.appendChild(el('rect',{x:x0,y:y0,
        width:sx(s.x+BOXW/2)-x0, height:sy(s.y-BOXH/2)-y0,
        rx:8, fill:'none', stroke:col, 'stroke-width':LW}));
      var a=txt(sx(s.x), sy(s.y)-PAD*0.2, s.label,'middle',null,FS);
      a.setAttribute('fill',col); a.setAttribute('font-weight','600');
      svg.appendChild(a);
      var b=txt(sx(s.x), sy(s.y)+PAD*2.4, s.owner+' · '+s.note,'middle',null,FSS);
      b.setAttribute('fill','var(--muted)');
      svg.appendChild(b);
    });

    // ---- стрелки ------------------------------------------------------
    var mk=el('marker',{id:'ah',viewBox:'0 0 10 10',refX:'9',refY:'5',
      markerWidth:'6',markerHeight:'6',orient:'auto-start-reverse'});
    mk.appendChild(el('path',{d:'M0,0 L10,5 L0,10 z',fill:'var(--line)'}));
    var mke=el('marker',{id:'ahe',viewBox:'0 0 10 10',refX:'9',refY:'5',
      markerWidth:'6',markerHeight:'6',orient:'auto-start-reverse'});
    mke.appendChild(el('path',{d:'M0,0 L10,5 L0,10 z',fill:'var(--exit)'}));
    var defs=el('defs',{}); defs.appendChild(mk); defs.appendChild(mke);
    svg.appendChild(defs);

    function line(p,q,col,dash){
      var l=el('line',{x1:sx(p.x),y1:sy(p.y),x2:sx(q.x),y2:sy(q.y),
        stroke:col,'stroke-width':LW,'marker-end':
        (col==='var(--exit)'?'url(#ahe)':'url(#ah)')});
      if(dash) l.setAttribute('stroke-dasharray','6 4');
      return l;
    }

    var D=byId.describe, C=byId.decide, E=byId.execute, O=byId.observe;

    // describe -> decide (горизонталь сверху)
    svg.appendChild(line({x:D.x+BOXW/2, y:D.y}, {x:C.x-BOXW/2, y:C.y},'var(--line)'));
    // decide -> execute (вниз по правой стороне)
    svg.appendChild(line({x:C.x, y:C.y-BOXH/2}, {x:E.x, y:E.y+BOXH/2},'var(--line)'));
    // execute -> observe (влево по низу)
    svg.appendChild(line({x:E.x-BOXW/2, y:E.y}, {x:O.x+BOXW/2, y:O.y},'var(--line)'));
    // observe -> decide (возврат: вверх и вправо, ломаной)
    var back = el('polyline',{points:
      [sx(O.x)+','+sy(O.y+BOXH/2),
       sx(O.x)+','+sy((O.y+C.y)/2),
       sx(C.x-BOXW/2-0.6)+','+sy((O.y+C.y)/2),
       sx(C.x-BOXW/2-0.6)+','+sy(C.y-BOXH/2-0.2)].join(' '),
      fill:'none',stroke:'var(--line)','stroke-width':LW,'marker-end':'url(#ah)'});
    svg.appendChild(back);

    // подписи стрелок — у хвостов / сбоку
    var t1=txt(sx((D.x+C.x)/2), sy(D.y+BOXH/2)-PAD, 'список инструментов','middle',null,FSS);
    t1.setAttribute('fill','var(--muted)'); svg.appendChild(t1);

    var t2=txt(sx(C.x)+PAD, sy((C.y+E.y)/2), 'вызовы: id, name, arguments','start',null,FSS);
    t2.setAttribute('fill','var(--muted)'); svg.appendChild(t2);

    var t3=txt(sx((E.x+O.x)/2), sy(E.y-BOXH/2)+PAD*2.6, 'два вызова — два запуска','middle',null,FSS);
    t3.setAttribute('fill','var(--muted)'); svg.appendChild(t3);

    var t4=txt(sx(O.x)-PAD, sy((O.y+C.y)/2)-PAD, 'результаты в переписку, каждый со своим id','start',null,FSS);
    t4.setAttribute('fill','var(--muted)'); svg.appendChild(t4);

    var t5=txt(sx(C.x-BOXW/2-0.6)-PAD, sy(C.y-BOXH/2-0.9), 'новый виток','end',null,FSS);
    t5.setAttribute('fill','var(--line)'); t5.setAttribute('font-weight','600');
    svg.appendChild(t5);

    // ---- два выхода из decide -----------------------------------------
    EXITS.forEach(function(x){
      var s=byId[x.from];
      svg.appendChild(line({x:s.x+BOXW/2, y:x.y>s.y? s.y+BOXH/4 : s.y-BOXH/4},
                           {x:x.x-1.1, y:x.y},'var(--exit)'));
      var t=txt(sx(x.x-1.1)+PAD, sy(x.y), x.label,'start',null,FSS);
      t.setAttribute('fill','var(--exit)'); svg.appendChild(t);
    });
    var st=txt(sx(EXITS[0].x-1.1)+PAD, sy(EXITS[0].y)+PAD*2.4, 'стоп','start',null,FSS);
    st.setAttribute('fill','var(--muted)'); svg.appendChild(st);
    var st2=txt(sx(EXITS[1].x-1.1)+PAD, sy(EXITS[1].y)-PAD*1.8, 'предохранитель хоста','start',null,FSS);
    st2.setAttribute('fill','var(--muted)'); svg.appendChild(st2);

    // ---- пометка: возврат не в describe --------------------------------
    var n=txt(sx(D.x), sy(D.y-BOXH/2)-PAD*3.2, 'стрелка назад сюда не возвращается','middle',null,FSS);
    n.setAttribute('fill','var(--muted)'); svg.appendChild(n);

    slot.appendChild(svg);
  }catch(e){
    slot.innerHTML='<p class="err">Схема должна была показать круг из четырёх шагов: '+
      '<b>describe</b> (хост, один раз) → <b>decide</b> (модель) → <b>execute</b> (хост) → '+
      '<b>observe</b> (хост), где стрелка возврата идёт из observe в <b>decide</b>, а не в describe. '+
      'Из decide выходят два выхода из цикла: модель перестала запрашивать инструменты, '+
      'либо сработал предохранитель хоста на 10 витков.</p>';
  }
})();
</script>
</body>
</html>
