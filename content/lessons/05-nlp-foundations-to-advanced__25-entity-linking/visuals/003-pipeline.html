<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Путь от упоминания к записи knowledge base</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f9fc;
      --panel: #ffffff;
      --panel-soft: #eef3fa;
      --panel-strong: #dfe9f7;
      --ink: #172033;
      --muted: #59657a;
      --line: #78869c;
      --accent: #2457d6;
      --accent-soft: #e5edff;
      --accent-ink: #173f9e;
      --success: #08785b;
      --success-soft: #daf4e9;
      --nil: #9b3c4a;
      --nil-soft: #f8e4e7;
      --shadow: #c8d2e2;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111722;
        --panel: #192231;
        --panel-soft: #202c3d;
        --panel-strong: #29384d;
        --ink: #eef3fb;
        --muted: #aebbd0;
        --line: #8190a8;
        --accent: #83a8ff;
        --accent-soft: #243b70;
        --accent-ink: #dce7ff;
        --success: #66d5b2;
        --success-soft: #173f37;
        --nil: #f29aa6;
        --nil-soft: #4a252c;
        --shadow: #080c13;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: unset;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      padding: 14px;
    }

    h1 {
      margin: unset;
      padding: 0 0 10px;
      font-size: 20px;
      font-weight: bold;
    }

    .frame {
      width: 100%;
      background: var(--bg);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 450px;
      background: var(--bg);
      border: 1px solid var(--shadow);
    }

    .stage {
      fill: var(--muted);
      font-weight: bold;
    }

    .body {
      fill: var(--ink);
    }

    .muted {
      fill: var(--muted);
    }

    .accent {
      fill: var(--accent-ink);
      font-weight: bold;
    }

    .success {
      fill: var(--success);
      font-weight: bold;
    }

    .nil {
      fill: var(--nil);
      font-weight: bold;
    }

    .arrow-label {
      fill: var(--muted);
      font-weight: bold;
    }

    #fallback,
    noscript {
      display: block;
      padding: 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: 16px;
    }

    #fallback[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <main class="frame">
    <h1>Путь от упоминания к записи knowledge base</h1>

    <svg id="diagram"
      viewBox="0 0 1200 450"
      width="1200"
      height="450"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-title diagram-desc">
      <title id="diagram-title">Конвейер entity linking для упоминания Jordan</title>
      <desc id="diagram-desc">
        Упоминание Jordan вместе с контекстом проходит через alias-индекс,
        дающий пять кандидатов. Контекст выбирает Майкла Джордана и его
        канонический ID. Отдельная ветвь ведёт к NIL.
      </desc>
      <g id="scene"></g>
    </svg>

    <div id="fallback" hidden>
      Схема должна была показать путь: «Jordan» → пять кандидатов →
      канонический ID Майкла Джордана, а при отсутствии подходящей записи — NIL.
    </div>

    <noscript>
      Схема: «Jordan» → список из 5 кандидатов → канонический ID Майкла
      Джордана. Если ни одна запись не подходит, результатом становится NIL.
    </noscript>
  </main>

  <script>
    const data = Object.freeze({
      boxes: Object.freeze({
        mention: Object.freeze({ x: 2, y: 14, w: 24, h: 25, r: 1 }),
        alias: Object.freeze({ x: 31, y: 20, w: 13, h: 13, r: 1 }),
        candidates: Object.freeze({ x: 49, y: 7, w: 43, h: 38, r: 1 }),
        context: Object.freeze({ x: 101, y: 14, w: 21, h: 25, r: 1 }),
        entity: Object.freeze({ x: 132, y: 14, w: 24, h: 25, r: 1 }),
        nil: Object.freeze({ x: 132, y: 47, w: 20, h: 8, r: 1 })
      }),
      rows: Object.freeze([
        Object.freeze({
          x: 50, y: 9, w: 41, h: 6, r: 0.6,
          markX: 52.4, markY: 12,
          textX: 54, textY: 12.5,
          text: "Майкл Джордан — баскетболист",
          selected: true
        }),
        Object.freeze({
          x: 50, y: 16, w: 41, h: 6, r: 0.6,
          markX: 52.4, markY: 19,
          textX: 54, textY: 19.5,
          text: "Иордания — государство"
        }),
        Object.freeze({
          x: 50, y: 23, w: 41, h: 6, r: 0.6,
          markX: 52.4, markY: 26,
          textX: 54, textY: 26.5,
          text: "Иордан — река"
        }),
        Object.freeze({
          x: 50, y: 30, w: 41, h: 6, r: 0.6,
          markX: 52.4, markY: 33,
          textX: 54, textY: 33.5,
          text: "Джордан Пил — режиссёр"
        }),
        Object.freeze({
          x: 50, y: 37, w: 41, h: 6, r: 0.6,
          markX: 52.4, markY: 40,
          textX: 54, textY: 40.5,
          text: "Jordan Brand — бренд"
        })
      ]),
      arrows: Object.freeze([
        Object.freeze({
          a: Object.freeze({ x: 26, y: 26.5 }),
          b: Object.freeze({ x: 30, y: 26.5 }),
          head: 1.2
        }),
        Object.freeze({
          a: Object.freeze({ x: 44, y: 26.5 }),
          b: Object.freeze({ x: 48, y: 26.5 }),
          head: 1.2
        }),
        Object.freeze({
          a: Object.freeze({ x: 92, y: 26.5 }),
          b: Object.freeze({ x: 100, y: 26.5 }),
          head: 1.2,
          label: "сравнить с контекстом",
          lx: 96, ly: 23.5
        }),
        Object.freeze({
          a: Object.freeze({ x: 122, y: 26.5 }),
          b: Object.freeze({ x: 131, y: 26.5 }),
          head: 1.2,
          label: "лучшее совпадение",
          lx: 126.5, ly: 23.5
        })
      ]),
      branch: Object.freeze({
        points: Object.freeze([
          Object.freeze({ x: 111.5, y: 39 }),
          Object.freeze({ x: 111.5, y: 51 }),
          Object.freeze({ x: 131, y: 51 })
        ]),
        head: 1.2,
        label: "нет подходящей записи",
        lx: 109.5,
        ly: 45,
        anchor: "end"
      }),
      marks: Object.freeze({
        size: 0.7
      }),
      texts: Object.freeze([
        Object.freeze({
          x: 2, y: 10.5, text: "ФРАГМЕНТ ТЕКСТА",
          anchor: "start", kind: "stage", size: "stage"
        }),
        Object.freeze({
          x: 37.5, y: 16.5, text: "ALIAS",
          anchor: "middle", kind: "stage", size: "small"
        }),
        Object.freeze({
          x: 37.5, y: 18.8, text: "ИНДЕКС",
          anchor: "middle", kind: "stage", size: "small"
        }),
        Object.freeze({
          x: 49, y: 4.5, text: "5 КАНДИДАТОВ",
          anchor: "start", kind: "stage", size: "stage"
        }),
        Object.freeze({
          x: 101, y: 10.5, text: "КОНТЕКСТ",
          anchor: "start", kind: "stage", size: "stage"
        }),
        Object.freeze({
          x: 132, y: 10.5, text: "КАНОНИЧЕСКАЯ ЗАПИСЬ",
          anchor: "start", kind: "stage", size: "stage"
        }),

        Object.freeze({
          x: 4, y: 18, text: "упоминание",
          anchor: "start", kind: "muted", size: "small"
        }),
        Object.freeze({
          x: 4, y: 23, text: "Jordan",
          anchor: "start", kind: "accent", size: "large"
        }),
        Object.freeze({
          x: 4, y: 29, text: "«набрал 30 очков»",
          anchor: "start", kind: "body", size: "body"
        }),
        Object.freeze({
          x: 4, y: 34, text: "«за Chicago»",
          anchor: "start", kind: "body", size: "body"
        }),

        Object.freeze({
          x: 111.5, y: 18.5, text: "подсказки:",
          anchor: "middle", kind: "muted", size: "small"
        }),
        Object.freeze({
          x: 111.5, y: 24, text: "«набрал очки»",
          anchor: "middle", kind: "accent", size: "body"
        }),
        Object.freeze({
          x: 111.5, y: 29, text: "«Chicago»",
          anchor: "middle", kind: "accent", size: "body"
        }),
        Object.freeze({
          x: 111.5, y: 35, text: "→ баскетболист",
          anchor: "middle", kind: "success", size: "small"
        }),

        Object.freeze({
          x: 144, y: 18.5, text: "ОДНА ЗАПИСЬ",
          anchor: "middle", kind: "success", size: "small"
        }),
        Object.freeze({
          x: 144, y: 24, text: "Майкл Джордан",
          anchor: "middle", kind: "body", size: "body"
        }),
        Object.freeze({
          x: 144, y: 29.5, text: "ID: MICHAEL_JORDAN",
          anchor: "middle", kind: "success", size: "id"
        }),
        Object.freeze({
          x: 144, y: 35, text: "knowledge base",
          anchor: "middle", kind: "muted", size: "small"
        }),

        Object.freeze({
          x: 142, y: 50.5, text: "NIL",
          anchor: "middle", kind: "nil", size: "body"
        }),
        Object.freeze({
          x: 142, y: 53.5, text: "записи нет",
          anchor: "middle", kind: "muted", size: "small"
        })
      ])
    });

    const origin = Object.freeze({ x: 15, y: 15 });
    const scale = Object.freeze({ x: 7.5, y: 7.5 });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const lineWidth = 2;
    const thinLineWidth = 1;
    const fontSizes = Object.freeze({
      small: 11,
      stage: 12,
      body: 13,
      id: 12,
      large: 21,
      arrow: 11
    });

    try {
      const svg = document.getElementById("diagram");
      const scene = document.getElementById("scene");
      const fallback = document.getElementById("fallback");
      const ns = "http://www.w3.org/2000/svg";

      const make = (tag, attrs, parent = scene) => {
        const node = document.createElementNS(ns, tag);
        Object.entries(attrs).forEach(([name, value]) => {
          node.setAttribute(name, String(value));
        });
        parent.appendChild(node);
        return node;
      };

      const box = (spec, fill, stroke, width = thinLineWidth) => {
        const { x, y, w, h, r } = spec;
        return make("rect", {
          x: sx(x),
          y: sy(y),
          width: sx(w) - sx(0),
          height: sy(h) - sy(0),
          rx: sx(r) - sx(0),
          ry: sy(r) - sy(0),
          fill,
          stroke,
          "stroke-width": width,
          "vector-effect": "non-scaling-stroke"
        });
      };

      const text = spec => {
        const node = make("text", {
          x: sx(spec.x),
          y: sy(spec.y),
          "text-anchor": spec.anchor,
          "dominant-baseline": "middle",
          class: spec.kind,
          "font-size": fontSizes[spec.size]
        });
        node.textContent = spec.text;
        return node;
      };

      const arrowHead = (from, to, size) => {
        const angle = Math.atan2(to.y - from.y, to.x - from.x);
        const left = {
          x: to.x - size * Math.cos(angle) + size * Math.sin(angle),
          y: to.y - size * Math.sin(angle) - size * Math.cos(angle)
        };
        const right = {
          x: to.x - size * Math.cos(angle) - size * Math.sin(angle),
          y: to.y - size * Math.sin(angle) + size * Math.cos(angle)
        };
        make("polygon", {
          points: [
            `${sx(to.x)},${sy(to.y)}`,
            `${sx(left.x)},${sy(left.y)}`,
            `${sx(right.x)},${sy(right.y)}`
          ].join(" "),
          fill: "var(--line)"
        });
      };

      const arrow = spec => {
        make("line", {
          x1: sx(spec.a.x),
          y1: sy(spec.a.y),
          x2: sx(spec.b.x),
          y2: sy(spec.b.y),
          stroke: "var(--line)",
          "stroke-width": lineWidth,
          "stroke-linecap": "round",
          "vector-effect": "non-scaling-stroke"
        });
        arrowHead(spec.a, spec.b, spec.head);

        if (spec.label) {
          text({
            x: spec.lx,
            y: spec.ly,
            text: spec.label,
            anchor: "middle",
            kind: "arrow-label",
            size: "arrow"
          });
        }
      };

      box(data.boxes.mention, "var(--panel)", "var(--line)", lineWidth);
      box(data.boxes.alias, "var(--panel-strong)", "var(--accent)", lineWidth);
      box(data.boxes.candidates, "var(--panel)", "var(--line)", lineWidth);
      box(data.boxes.context, "var(--accent-soft)", "var(--accent)", lineWidth);
      box(data.boxes.entity, "var(--success-soft)", "var(--success)", lineWidth);
      box(data.boxes.nil, "var(--nil-soft)", "var(--nil)", lineWidth);

      data.rows.forEach(row => {
        box(
          row,
          row.selected ? "var(--success-soft)" : "var(--panel-soft)",
          row.selected ? "var(--success)" : "var(--shadow)",
          row.selected ? lineWidth : thinLineWidth
        );

        const mark = data.marks.size;
        make("polygon", {
          points: [
            `${sx(row.markX)},${sy(row.markY - mark)}`,
            `${sx(row.markX + mark)},${sy(row.markY)}`,
            `${sx(row.markX)},${sy(row.markY + mark)}`,
            `${sx(row.markX - mark)},${sy(row.markY)}`
          ].join(" "),
          fill: row.selected ? "var(--success)" : "var(--line)"
        });

        text({
          x: row.textX,
          y: row.textY,
          text: row.text,
          anchor: "start",
          kind: row.selected ? "success" : "body",
          size: "small"
        });
      });

      data.arrows.forEach(arrow);

      make("polyline", {
        points: data.branch.points
          .map(point => `${sx(point.x)},${sy(point.y)}`)
          .join(" "),
        fill: "none",
        stroke: "var(--line)",
        "stroke-width": lineWidth,
        "stroke-linecap": "round",
        "stroke-linejoin": "round",
        "vector-effect": "non-scaling-stroke"
      });

      const [branchStart, branchTurn, branchEnd] = data.branch.points;
      arrowHead(branchTurn, branchEnd, data.branch.head);

      text({
        x: data.branch.lx,
        y: data.branch.ly,
        text: data.branch.label,
        anchor: data.branch.anchor,
        kind: "arrow-label",
        size: "arrow"
      });

      data.texts.forEach(text);

      if (!scene.hasChildNodes()) {
        throw new Error("Сцена не построена");
      }

      fallback.hidden = true;
      svg.hidden = false;
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");

      if (svg) {
        svg.hidden = true;
      }

      if (fallback) {
        fallback.hidden = false;
      }
    }
  </script>
</body>
</html>
