- concept: кандидат связывается с упоминанием только при превышении порога уверенности, иначе выбирается NIL
  question: Лучший кандидат entity linking получил score ниже настроенного порога уверенности. Какой результат должна вернуть система?
  explanation: Первое место в рейтинге означает лишь превосходство над другими кандидатами, но не достаточную надёжность привязки. Порог позволяет отказаться от случайного ID и вернуть NIL. Это не доказывает отсутствие сущности в KB, а указывает на отсутствие убедительного кандидата.
  kind: choice
  options:
    - ID лучшего кандидата, поскольку он победил остальных
    - NIL, поскольку ни один кандидат не получил достаточной поддержки
    - ID кандидата со вторым по величине score
    - Тип сущности, предсказанный моделью NER
  correct: 1
  id: 020-nil-threshold-1
  fingerprint: 89d3e6ad
- concept: повышение порога уверенности увеличивает число ответов NIL и сокращает число рискованных привязок
  question: Как при прочих равных повышение порога уверенности влияет на поведение системы entity linking?
  explanation: 'Высокий порог делает систему осторожнее: для выбора ID требуется более сильная поддержка. Это уменьшает число ложных привязок ценой роста числа отказов, включая возможные ложные NIL.'
  kind: open
  reference: Система чаще возвращает NIL и реже создаёт случайные или слабые привязки, но может отклонить больше правильных кандидатов с недостаточно высоким score.
  id: 020-nil-threshold-2
  fingerprint: 012ac215
