- concept: все упоминания одного coreference-кластера должны получить общий KB ID
  question: После entity linking упоминания из одного coreference-кластера получили разные KB ID. Каким должен быть итоговый результат?
  explanation: Coreference-кластер представляет одну сущность документа, поэтому разные привязки внутри него противоречат результату coreference. Их разрешают общим выбором, после чего весь кластер получает один канонический KB ID.
  kind: choice
  options:
    - Сохранить отдельный KB ID у каждого упоминания
    - Выбрать общий канонический KB ID и назначить его всему кластеру
    - Оставить ссылку только у упоминания с полным именем
    - Заменить все ссылки меткой NIL
  correct: 1
  id: 032-coref-el-1
  fingerprint: 8c6fa669
- concept: продукционный pipeline выполняет entity linking по упоминаниям до схлопывания coreference-кластера
  question: Расположите этапы обработки документа в правильном порядке.
  explanation: Рабочая схема имеет вид NER → coreference → EL по упоминаниям → схлопывание кластера. Промежуточная обработка отдельных упоминаний сохраняет их разные сигналы, а последний этап превращает их в одну сущность документа.
  kind: order
  items:
    - Найти упоминания сущностей с помощью NER
    - Объединить кореферентные упоминания в кластеры
    - Выполнить entity linking для отдельных упоминаний с учётом доступных подсказок
    - Согласовать результаты и назначить каждому кластеру общий канонический KB ID
  id: 032-coref-el-2
  fingerprint: 94684fff
