- concept: отсутствующую в устаревшей KB сущность нельзя восстановить переводом или расширением списка кандидатов
  question: Объясните, почему идеальный перевод упоминания и увеличение top-K не помогут привязать новую организацию, если её записи ещё нет в используемом снимке базы знаний. Какая мера устраняет эту причину?
  explanation: Устаревание KB ограничивает множество допустимых результатов самого linker. Если записи нет, генератору нечего включать в кандидаты, поэтому требуется цикл обновления KB, а не настройка disambiguator.
  kind: open
  reference: Перевод меняет представление упоминания, а увеличение top-K извлекает больше уже существующих записей. Ни один из методов не создаёт отсутствующий канонический ID. Для устранения причины нужно обновить или дополнить базу знаний и перестроить связанные индексы.
  id: 035-pokrytie-kb-2
