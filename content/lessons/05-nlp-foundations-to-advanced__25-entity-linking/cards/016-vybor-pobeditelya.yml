- concept: строгое сравнение реализует детерминированное разрешение равных score в пользу первого кандидата
  question: Какой оператор нужно подставить, чтобы при фиксированном порядке кандидатов первый кандидат с максимальным score сохранялся при ничьей?
  explanation: Строгое сравнение обновляет победителя только при улучшении score. При равенстве текущий победитель сохраняется, поэтому фиксированный порядок кандидатов даёт воспроизводимый результат.
