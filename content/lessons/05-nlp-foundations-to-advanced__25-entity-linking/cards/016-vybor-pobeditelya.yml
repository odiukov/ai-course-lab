- concept: score сходства ранжирует кандидатов, но не является вероятностью правильной привязки
  question: Что можно обоснованно заключить о кандидате, получившем наибольший score сходства?
  explanation: Score используется для сравнения кандидатов внутри списка. Без отдельной калибровки его нельзя трактовать как вероятность, а победа не гарантирует, что нужная сущность вообще присутствовала среди кандидатов.
  kind: choice
  options:
    - Он лучше остальных рассмотренных кандидатов по используемой мере сходства
    - Его score равен вероятности того, что привязка правильна
    - Он гарантированно является нужной сущностью во всей базе знаний
    - Все кандидаты с меньшим score можно считать ошибочными с известной вероятностью
