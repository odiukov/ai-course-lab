- concept: ошибку entity linking локализуют по наличию правильной сущности в списке кандидатов
  question: Правильная запись KB присутствовала в списке кандидатов, однако система связала упоминание с другой записью. Какой компонент допустил ошибку?
  explanation: Candidate generator выполнил свою задачу, поскольку сохранил правильную запись. Ошибка произошла при выборе итоговой сущности среди уже найденных кандидатов, то есть на этапе disambiguation.
  kind: choice
  options:
    - Candidate generator
    - Disambiguator
    - Knowledge base
    - NER-модель
  correct: 1
  id: 004-dva-etapa-1
  fingerprint: 28e4fe5d
- concept: размер списка кандидатов задаёт компромисс между полнотой, шумом и стоимостью disambiguation
  question: Почему в entity linking не следует без ограничений увеличивать список кандидатов ради максимальной полноты?
  explanation: Candidate generation оптимизирует не только полноту. Слишком узкий список может потерять правильную запись, а чрезмерно широкий создаёт шум и делает последующее ранжирование дороже и сложнее.
  kind: open
  reference: Большой список снижает риск пропустить правильную сущность, но добавляет нерелевантные варианты, повышает вычислительную стоимость и усложняет выбор для disambiguator. Поэтому candidate generation должен сохранять правильного кандидата в достаточно коротком списке.
  id: 004-dva-etapa-2
  fingerprint: 0e20badc
