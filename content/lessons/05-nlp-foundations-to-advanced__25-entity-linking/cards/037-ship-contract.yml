- concept: версия и график обновления базы знаний обеспечивают воспроизводимость entity linking
  question: Две команды связывают одинаковые тексты с Wikidata, но используют снимки базы знаний за разные даты. Почему их результаты могут различаться при неизменном коде линкера?
  explanation: 'База знаний со временем меняется: добавляются и объединяются сущности, обновляются алиасы и перенаправления. Поэтому для воспроизводимого сравнения нужно фиксировать дату версии KB и график её обновления.'
  kind: choice
  options:
    - Состав сущностей, алиасы и идентификаторы в базе могли измениться
    - Дата снимка влияет только на скорость поиска кандидатов
    - Версия базы важна лишь для обучения NER
    - Обновление базы автоматически меняет язык входного текста
  correct: 0
  id: 037-ship-contract-1
  fingerprint: 5845bf59
- concept: качество entity linking интерпретируемо только при полном контракте системы
  question: Какие части pipeline нужно зафиксировать, чтобы отчёт о качестве entity linking можно было проверить и воспроизвести?
  explanation: Одна агрегированная точность не показывает, какая база использовалась, находился ли правильный ID среди кандидатов и как учитывались сущности вне KB. Полный контракт позволяет локализовать ошибки и корректно сравнивать системы.
  kind: open
  reference: Нужно указать базу знаний, её версию и обновление; способ генерации кандидатов и целевую полноту при заданном размере списка; disambiguator; правило выбора NIL; а также метрики генерации, итогового выбора и распознавания NIL на отложенных данных.
  id: 037-ship-contract-2
  fingerprint: 5133224e
- concept: метрики entity linking следует измерять на отложенном наборе данных
  question: Зачем оценивать генератор кандидатов, disambiguator и NIL-политику на отложенном наборе, который не использовался для их настройки?
  explanation: Настройка компонентов и порогов на тех же примерах, где измеряется качество, даёт оптимистичную оценку. Отложенный набор проверяет, насколько выбранный контракт работает на новых данных.
  kind: choice
  options:
    - Чтобы оценить перенос качества на новые примеры, а не запоминание настроечных данных
    - Чтобы гарантировать наличие каждой сущности в базе знаний
    - Чтобы исключить необходимость фиксировать версию базы
    - Чтобы любой disambiguator получил одинаковый результат
  correct: 0
  id: 037-ship-contract-3
  fingerprint: 7ec3f25e
