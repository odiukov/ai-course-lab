- concept: prior определяет выбор по умолчанию при одинаковой поддержке кандидатов контекстом
  question: Два кандидата получили одинаковую положительную оценку контекстного сходства. Какой из них победит при ранжировании по произведению P(entity | mention) × context-similarity?
  explanation: При одинаковом контекстном сходстве различие в итоговой оценке определяется prior. Поэтому более частая для данного упоминания сущность становится разумным выбором по умолчанию, когда контекст не различает кандидатов.
  kind: choice
  options:
    - Кандидат с более длинным каноническим именем
    - Кандидат с более высоким prior
    - Кандидат с более редким алиасом
    - Кандидаты обязательно получат разные итоговые оценки независимо от prior
  correct: 1
  id: 018-prior-context-1
  fingerprint: 541b4d7b
- concept: контекст должен компенсировать отставание редкой сущности по prior
  question: У частого кандидата prior равен 0.6, а контекстное сходство — 0.25. У редкого кандидата prior равен 0.3. Какое контекстное сходство редкого кандидата даст ему такую же итоговую оценку при перемножении prior и сходства?
  explanation: Оценка частого кандидата равна 0.6 × 0.25 = 0.15. Для равенства нужно решить 0.3 × s = 0.15, откуда s = 0.5. При сходстве выше этого порога редкий кандидат обойдёт популярный.
  kind: numeric
  answer: 0.5
  tolerance: 0.001
  id: 018-prior-context-2
  fingerprint: ac3436ea
