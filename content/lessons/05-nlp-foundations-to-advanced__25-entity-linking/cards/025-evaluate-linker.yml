- concept: промах генератора кандидатов считается ошибкой энд-ту-энд точности для сущностей из базы знаний
  question: Эталонная сущность присутствует в базе знаний, но генератор не включил её в список кандидатов. Как этот пример должен учитываться в итоговой точности привязки для in-KB упоминаний?
  explanation: P@1 — энд-ту-энд метрика по всем упоминаниям, чьи сущности есть в KB. Если правильный ID не попал в кандидаты, итоговая привязка неверна. Исключать такой пример можно только из отдельной условной оценки disambiguator, но не из P@1.
  kind: choice
  options:
    - 'Как ошибка: итоговый линкер не вернул правильный ID'
    - Исключить из расчёта, потому что правильного кандидата не видел disambiguator
    - Засчитать как правильный ответ NIL
  correct: 0
  id: 025-evaluate-linker-1
  fingerprint: f0b5b5f1
- concept: метрика с пустым знаменателем требует заранее определённого поведения
  question: В тестовой выборке нет ни одного примера с эталонной меткой NIL. Как должен поступить корректно спроектированный evaluator при вычислении точности обнаружения NIL?
  explanation: Без эталонных NIL-примеров эту точность нельзя оценить по данным. Реализация должна явно обработать нулевой знаменатель и следовать выбранному контракту — например, вернуть 0.0, None или NaN. Смешивать с метрикой для in-KB сущностей нельзя.
  kind: choice
  options:
    - Вернуть заранее документированное значение для отсутствующего знаменателя
    - Автоматически считать точность обнаружения NIL идеальной
    - Включить in-KB упоминания в знаменатель этой метрики
  correct: 0
  id: 025-evaluate-linker-2
  fingerprint: '90573094'
