- concept: привязка вариантов имени к общему ID позволяет объединять сведения об одной сущности
  question: Почему при сборе статистики об объектах полезнее группировать упоминания по каноническому ID, а не по точному совпадению текста?
  explanation: Сравнение строк считает разные варианты имени разными объектами. Общий канонический ID позволяет объединить все упоминания, относящиеся к одной сущности.
  kind: open
  reference: Одна сущность может упоминаться под полным именем, сокращением или псевдонимом. Entity linking связывает эти варианты с одной записью, поэтому сведения не распадаются на отдельные группы из-за различий в написании.
  id: 002-kontrakt-el-2
