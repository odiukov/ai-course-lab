- concept: каждый ID из alias-индекса должен иметь описание в словаре сущностей
  question: Алгоритм перебирает ID из alias-индекса и обращается к описанию как `entity_desc[entity_id]`, без значения по умолчанию. Какое требование целостности данных необходимо выполнить и что произойдёт при его нарушении?
  explanation: Alias-индекс и словарь описаний образуют связанные структуры данных. Прямой доступ по ключу предполагает, что все кандидатные ID заранее проверены и обеспечены описаниями.
  kind: open
  reference: Для каждого ID, который может появиться среди кандидатов alias-индекса, в `entity_desc` должна существовать запись. Если описания нет, прямое индексирование словаря завершится ошибкой `KeyError`, и дизамбигуация не вернёт результат.
