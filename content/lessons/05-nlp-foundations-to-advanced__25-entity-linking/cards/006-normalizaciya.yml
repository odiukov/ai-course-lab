- concept: сходство Жаккара равно доле общих уникальных токенов в их объединении
  question: Вставьте формулу коэффициента Жаккара для множеств токенов контекста A и описания B.
  explanation: В числителе находится количество токенов, общих для контекста и описания, а в знаменателе — количество всех уникальных токенов, встречающихся хотя бы в одном из них.
  kind: cloze
  template: J(A, B) = ___
  answer: '|A ∩ B| / |A ∪ B|'
  accept:
    - len(A & B) / len(A | B)
    - размер пересечения A и B / размер объединения A и B
  id: 006-normalizaciya-2
  fingerprint: f1234b5e
