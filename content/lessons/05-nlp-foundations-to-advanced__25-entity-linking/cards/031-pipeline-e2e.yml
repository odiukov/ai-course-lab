- concept: end-to-end обучение совместно настраивает внутренние части по ошибке конечной привязки
  question: Почему end-to-end модель entity linking может лучше согласовать свои внутренние части, чем pipeline с независимо обученными компонентами?
  explanation: Сквозная функция потерь связывает обучение внутренних частей с конечным результатом. Это позволяет им взаимно адаптироваться, но одновременно усложняет независимую замену или переобучение одного компонента.
  kind: open
  reference: End-to-end модель обучается по ошибке конечного выбора KB ID, поэтому градиент изменяет сразу несколько внутренних частей. Они учатся создавать представления и промежуточные решения, полезные для итоговой привязки, тогда как компоненты pipeline обычно оптимизируют отдельные локальные задачи.
  id: 031-pipeline-e2e-2
  fingerprint: b254c388
