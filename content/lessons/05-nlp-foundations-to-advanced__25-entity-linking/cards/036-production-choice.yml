- concept: доменная база знаний требует доменно-адаптированного линкера и обучающих данных
  question: Система должна связывать названия нормативных актов и судебных прецедентов с записями закрытой юридической базы знаний. Какой подход наиболее уместен?
  explanation: В специализированном домене нужны собственная KB, доменные обучающие примеры и KB-aware retrieval. Популярность сущностей в Wikipedia плохо отражает распределение юридических понятий.
  kind: choice
  options:
    - Дообучить BERT на доменных примерах и использовать ретривер, учитывающий структуру этой базы знаний
    - Применить готовый BLINK с кандидатами только из Wikipedia
    - Выбирать наиболее популярную общедоступную сущность без учёта контекста
    - Использовать исследовательскую генеративную модель без адаптации к юридическому домену
  correct: 0
  id: 036-production-choice-1
  fingerprint: 5c4cd4c2
- concept: при малом потоке запросов фиксированная стоимость собственной EL-инфраструктуры может не окупаться
  question: Объясни своими словами, почему сервису с редкими запросами к entity linking может быть выгоднее обращаться к готовой языковой модели, чем разворачивать отдельный обучаемый linker.
  explanation: Выбор зависит не только от качества модели, но и от того, на каком объёме окупается инфраструктура. Для десятков упоминаний в день курс рекомендует LLM-подход, тогда как большой поток оправдывает специализированный индекс и retrieval.
  kind: open
  reference: При малом потоке фиксированные расходы на разработку, размещение, мониторинг и обновление отдельного линкера распределяются на слишком малое число запросов. Если допустимы стоимость и задержка одного вызова, готовая языковая модель может оказаться экономичнее.
  id: 036-production-choice-2
  fingerprint: b15d1b3a
- concept: жёсткое ограничение задержки может потребовать точного сопоставления алиаса с выбором по prior
  question: Entity-linking API должен отвечать с минимальной и предсказуемой задержкой, а использование GPU невозможно. Какой вариант лучше всего соответствует этому ограничению?
  explanation: Точное сопоставление и prior дают очень быстрый базовый вариант без GPU. Он хуже разрешает неоднозначные упоминания, но обеспечивает предсказуемые задержку и вычислительную стоимость.
  kind: choice
  options:
    - Точное совпадение алиаса и выбор сущности по prior
    - Авторегрессионная генерация канонического имени сущности
    - Запрос к большой языковой модели для каждого упоминания
    - Контекстное ранжирование всех сущностей большой нейросетью
  correct: 0
  id: 036-production-choice-3
  fingerprint: c7a41020
