- concept: коэффициент Жаккара для множеств не учитывает частоту токенов
  question: В контексте несколько раз повторили токен, который уже присутствовал в нём. Описание сущности не изменилось. Почему коэффициент Жаккара остался прежним?
  explanation: Жаккар вычисляется по множествам уникальных токенов. Повтор уже имеющегося слова не меняет ни пересечение, ни объединение, поэтому не меняется и оценка.
  kind: choice
  options:
    - Повторяющиеся токены автоматически получают нулевой вес
    - Перед вычислением токены преобразуются в множества, где каждый токен учитывается только один раз
    - Число повторов одинаково увеличивает пересечение и объединение
  correct: 1
  id: 014-jaccard-context-1
  fingerprint: 8c4a9d43
- concept: лексический Жаккар не распознаёт семантическую близость без общих токенов
  question: Почему два текста о почти одном и том же могут получить минимальную оценку Жаккара и как эмбеддинги помогают устранить эту проблему?
  explanation: Лексическое пересечение не понимает, что разные слова могут обозначать близкие понятия. Косинусная близость эмбеддингов сравнивает смысловые представления контекста и описания, поэтому лучше работает с синонимами и перефразированием.
  kind: open
  reference: Жаккар замечает только буквально совпавшие уникальные токены, поэтому синонимы и близкие по смыслу выражения без общих слов не дают пересечения. Эмбеддинги кодируют семантику текста, а их косинусная близость может выявить смысловое сходство даже без точных лексических совпадений.
  id: 014-jaccard-context-2
  fingerprint: b0d32d19
