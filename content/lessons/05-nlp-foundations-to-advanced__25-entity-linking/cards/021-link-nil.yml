- concept: устаревание базы знаний увеличивает число сущностей, для которых правильным ответом становится NIL
  question: Почему улучшение модели дизамбигуации не устраняет ошибки на упоминаниях компаний и событий, появившихся после создания дампа базы знаний, и какая эксплуатационная мера нужна?
  explanation: Дизамбигуация выбирает только среди доступных записей и не исправляет пробелы в покрытии базы. Старый дамп делает новые сущности настоящими NIL-случаями, поэтому нужны и корректный отказ от привязки, и цикл обновления KB.
  kind: open
  reference: Модель не может выбрать правильную запись, если такой записи в базе ещё нет. Она должна уметь возвращать NIL, а в продакшене базу знаний необходимо регулярно обновлять.
