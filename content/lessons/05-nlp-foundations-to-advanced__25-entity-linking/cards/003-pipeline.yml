- concept: alias-индекс формирует короткий список записей KB, соответствующих поверхностной форме упоминания
  question: Что должен вернуть alias-индекс для неоднозначного упоминания?
  explanation: 'Alias-индекс сопоставляет форму имени со всеми известными для неё кандидатами. Окончательный выбор выполняется позже: кандидатам ещё предстоит пройти контекстную дизамбигуацию.'
  kind: choice
  options:
    - Единственный окончательный ID без учёта контекста
    - Список всех записей knowledge base того же типа
    - Короткий список записей knowledge base, которым может соответствовать эта форма имени
    - Новую запись knowledge base, созданную из окружающего текста
  correct: 2
  id: 003-pipeline-1
  fingerprint: a2cfdae4
- concept: контекстная совместимость позволяет выбрать нужную сущность среди кандидатов одного упоминания
  question: 'Для упоминания «Mercury» получены кандидаты: планета, химический элемент и музыкант. Объясни, как слова вокруг упоминания помогают системе выбрать нужную запись knowledge base.'
  explanation: Поверхностная форма сама по себе неоднозначна. Дизамбигуация оценивает соответствие каждого кандидата соседним словам и выбирает запись, лучше всего согласующуюся с контекстом.
  kind: open
  reference: Система сопоставляет окружающий текст с описанием, типом и другими признаками каждого кандидата. Контекст об орбите поддержит планету, о токсичном металле — химический элемент, а об альбоме или выступлении — музыканта; выбирается наиболее совместимый кандидат.
  id: 003-pipeline-2
  fingerprint: ea2e5ef3
