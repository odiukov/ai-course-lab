- concept: модель награды нужна как обучаемый прокси человека, чтобы оценивать новые генерации автоматически внутри цикла оптимизации
  question: Почему нельзя выбросить модель награды и подавать в PPO прямо человеческие оценки каждого сгенерированного ответа? Объясни своими словами.
  explanation: Ключ — пропускная способность и обобщение. Человек задаёт направление один раз через набор сравнений; модель награды тиражирует этот сигнал на неограниченное число новых генераций.
  kind: open
  reference: 'PPO требует награду для каждой генерации на каждом шаге оптимизации — это миллионы ответов, живые разметчики такой темп не выдержат ни по скорости, ни по стоимости. Модель награды обучается один раз на конечном наборе сравнений (например, 40 000 пар) и затем обобщает: выдаёт скалярный балл для ответов, которых человек никогда не видел. Это превращает редкий и дорогой человеческий сигнал в дешёвую дифференцируемую функцию, доступную в цикле обучения. Плата — модель награды лишь приближает предпочтения и надёжна только там, где похожа на свои обучающие данные.'
  id: 006-pipeline-map-2
  fingerprint: 77e7ddb9
- concept: KL-штраф нужен потому, что модель награды достоверна лишь вблизи распределения, на котором обучалась
  question: В ходе оптимизации политика начала выдавать странные, но высоко оцениваемые моделью награды тексты, а люди считают их плохими. Что происходит и какую роль здесь играет KL-штраф?
  explanation: Модель награды — приближение, обученное на конечном наборе сравнений. Далеко от этого распределения её баллы перестают отражать предпочтения людей, и оптимизатор находит дыры (reward hacking). KL-штраф между политикой и замороженным референсом штрафует уход распределения, ограничивая эксплуатацию таких дыр. Это не регулятор шага обучения и не нормировка длины.
  kind: choice
  options:
    - Политика ушла из распределения, на котором обучалась модель награды, и эксплуатирует её ошибки; KL-штраф удерживает политику рядом с исходным чекпоинтом, где оценки награды ещё осмысленны
    - Модель награды переобучилась на длину ответов; KL-штраф нормирует длину генераций
    - Скорость обучения слишком велика; KL-штраф выполняет роль планировщика learning rate
    - Политика забыла предобучение; KL-штраф возвращает её к весам базовой модели до инструктивного дообучения
