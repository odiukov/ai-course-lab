- concept: перестановка аргументов в попарной потере увеличивает её ровно на разность наград
  question: 'Модель награды выдала preferred-ответу 4.2, а rejected-ответу 1.7. Потеря Брэдли–Терри посчитана с перепутанным порядком аргументов: из награды rejected вычли награду preferred. Какое значение потери получится?'
  explanation: 'При верном порядке d = 4.2 − 1.7 = 2.5 и потеря −ln σ(2.5) = ln(1 + e^(−2.5)) ≈ 0.079. При перепутанном порядке аргумент сигмоиды равен −2.5, и потеря −ln σ(−2.5) = ln(1 + e^(2.5)) ≈ 2.579. Разница ровно 2.5 — это сама разность наград: −ln σ(−d) = −ln σ(d) + d. Из-за такой ошибки оптимизация начинает наказывать правильное ранжирование, а метрика точности пойдёт вниз.'
  kind: numeric
  answer: 2.579
  tolerance: 0.02
  id: 019-write-bt-loss-1
  fingerprint: f1dfd374
- concept: малая аддитивная константа под логарифмом ограничивает потерю сверху при обнулении вероятности из-за underflow
  question: В реализации попарной потери пишут `-np.log(sigmoid(diff) + 1e-12)` вместо `-np.log(sigmoid(diff))`. Что именно даёт эта добавка?
  explanation: Сигмоида математически никогда не равна нулю, но в конечной арифметике при большом отрицательном аргументе она округляется до 0.0, и `np.log(0)` даёт −inf, а потеря — +inf; дальше inf разносит градиенты и веса в NaN. Добавка ограничивает потерю сверху величиной −ln(1e-12) ≈ 27.6. Положительность потери обеспечивает не она, а то, что σ < 1.
  kind: choice
  options:
    - Она смещает вероятность предпочтения так, что модель перестаёт переобучаться на лёгких парах
    - 'Она страхует от `log(0)`: при сильно отрицательной разности сигмоида может обнулиться в float, и потеря стала бы `inf`, а с добавкой ограничена примерно 27.6'
    - Она делает потерю строго положительной, иначе при равных наградах потеря была бы нулевой
    - Она нормирует потерю к диапазону от 0 до 1, чтобы значения разных пар были сравнимы
  correct: 1
  id: 019-write-bt-loss-2
  fingerprint: 51f52785
- concept: 'порядок вычислений в попарной потере: разность, сигмоида, логарифм, смена знака'
  question: Расставь шаги вычисления потери Брэдли–Терри для пары (preferred, rejected) в правильном порядке.
  explanation: 'Цепочка d = r_pref − r_rej, затем p = σ(d), затем −ln p. Каждый шаг зависит от предыдущего: сигмоида превращает разность в вероятность, логарифм — вероятность в лог-правдоподобие, минус — лог-правдоподобие в минимизируемый штраф. Перестановка первого шага (вычитание наоборот) наказывает верное ранжирование, потеря знака превращает минимизацию в максимизацию ошибки.'
  kind: order
  items:
    - Вычесть награду rejected из награды preferred и получить разность d
    - Применить численно устойчивую сигмоиду к d — получится вероятность того, что preferred предпочтут
    - Взять натуральный логарифм от этой вероятности (с малой добавкой для защиты от нуля)
    - Поменять знак результата, чтобы получить неотрицательный штраф
  id: 019-write-bt-loss-3
  fingerprint: 1d324509
