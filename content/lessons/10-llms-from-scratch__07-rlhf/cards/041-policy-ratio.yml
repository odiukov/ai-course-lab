- concept: 'PPO-ratio читается как множитель: значение меньше единицы показывает, во сколько раз вероятность действия сократилась'
  question: После серии обновлений политика на том же префиксе даёт токену вероятность 0.09, тогда как её снимок до обновлений давал 0.36. Чему равно отношение вероятностей ρ для этого действия?
  explanation: ρ = π_new/π_old = 0.09/0.36 = 0.25. Вероятность сократилась в четыре раза. ρ = 1 означало бы, что поведение на этом выборе не изменилось; ρ < 1 — вероятность действия упала, ρ > 1 — выросла.
  kind: numeric
  answer: 0.25
  tolerance: 0.01
  id: 041-policy-ratio-1
  fingerprint: c785d949
- concept: 'одинаковая абсолютная прибавка вероятности означает разное изменение поведения: масштаб задаётся отношением к исходной вероятности'
  question: 'Токен A: вероятность выросла с 0.06 до 0.13. Токен B: вероятность выросла с 0.55 до 0.62. Про какой токен PPO скажет, что поведение политики изменилось сильнее?'
  explanation: Абсолютная разница у обоих 0.07, но ρ_A = 0.13/0.06 ≈ 2.17, ρ_B = 0.62/0.55 ≈ 1.13. Отношение нормирует изменение на исходную вероятность, поэтому редкий токен, ставший вдвое вероятнее, — это большой сдвиг поведения, а тот же +0.07 у частого токена — малый. Знак преимущества отвечает на другой вопрос — в какую сторону вероятность стоило двигать, — а не на вопрос о величине сдвига.
  kind: choice
  options:
    - 'Про токен A: отношение примерно 2.17 против примерно 1.13 у B'
    - 'Про токен B: у него выше и стартовая, и итоговая вероятность'
    - 'Изменение одинаковое: прибавка в обоих случаях равна 0.07'
    - Сравнить нельзя, пока не известен знак преимущества
  correct: 0
  id: 041-policy-ratio-2
  fingerprint: '29940127'
- concept: ρ измеряет обновление политики только при одинаковом действии в одинаковом состоянии в числителе и знаменателе
  question: 'Инженер считает ρ так: в числителе вероятность токена «да» после префикса P1 у обновлённой политики, в знаменателе вероятность токена «нет» после префикса P2 у старой политики. Объясни своими словами, почему это число не является PPO-ratio и что именно оно измеряет.'
  explanation: 'Смысл отношения — контролируемое сравнение: фиксируем (s, a), варьируем только политику. Отдельно стоит помнить, что в знаменателе стоит снимок самой policy перед серией обновлений, а не замороженный SFT-reference — reference участвует в KL-члене, а не в ratio.'
  kind: open
  reference: 'ρ = π_new(a|s)/π_old(a|s) требует, чтобы действие a и состояние s были одними и теми же в числителе и знаменателе — тогда меняется только источник вероятности (политика после обновления против её снимка до), и отношение читается как величина сдвига поведения на этом конкретном выборе. При разных токенах и разных префиксах в отношение попадают сразу три различия: другое действие, другое состояние, другая политика. Разделить вклад обновления от вклада смены выбора невозможно, поэтому число сравнивает два разных предпочтения, а не измеряет обновление политики; подставлять его в клиппированный суррогат бессмысленно.'
  id: 041-policy-ratio-3
  fingerprint: 43bbc0ba
