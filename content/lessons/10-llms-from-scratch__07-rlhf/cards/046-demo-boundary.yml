- concept: 'случайное возмущение весов превращается в обучающий сигнал только при статистической связи шума с исходом: либо возмущение вносится до генерации и затем взвешивается результатом, либо цель делается дифференцируемой по log-вероятностям сэмплированных токенов и берётся обратное распространение'
  question: Обновление «награда × случайный шум» вносится уже после того, как ответ сгенерирован и оценён. Объясни своими словами, чего здесь принципиально не хватает и какими двумя способами это можно исправить.
  explanation: Ключевое различие — где берётся направление. Награда сама по себе одномерна и не умеет распределять «вину» по миллионам параметров. Либо направление подсказывает сам шум, но тогда он обязан быть внесён до оценки и взвешен исходом, либо направление считается аналитически через производные цели по весам.
  kind: open
  reference: 'Не хватает связи между конкретным возмущением и исходом: шум сэмплируется независимо от того, что повлияло на оценку, поэтому корреляция между направлением шума и наградой равна нулю и информации о качестве отдельных весов в обновлении нет. Способ первый (методы случайного поиска / evolution strategies): возмутить веса ДО генерации, оценить ответ возмущённой модели и сдвинуть параметры вдоль того же самого шума с весом, пропорциональным награде (лучше — преимуществу относительно baseline); тогда шум и результат связаны, а среднее по нескольким возмущениям даёт оценку градиента. Способ второй (собственно PPO): построить дифференцируемую цель из log-вероятностей фактически сэмплированных токенов — отношения вероятностей текущей и старой политики, умноженного на преимущество, с клиппингом и KL-членом — и получить обратным распространением частную производную цели по каждому весу; тогда и направление, и величина изменения каждого параметра вычисляются, а не выбираются жеребьёвкой.'
