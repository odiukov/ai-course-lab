- concept: у обновления вида «награда × симметричный шум» математическое ожидание изменения каждого веса равно нулю независимо от величины награды, поэтому награда меняет только разброс, а не систематический дрейф
  question: 'Обновление одного веса: Δw = lr * R * ε * 0.04, где lr = 2e-4, награда R = 1.5, а ε ~ N(0, 1) сэмплируется независимо от ответа и его оценки. Чему равно математическое ожидание Δw?'
  explanation: 'E[ε] = 0, а множитель lr·R·0.04 — константа при данной награде, поэтому E[Δw] = 0. Ненулевым остаётся только стандартное отклонение: |2e-4 · 1.5 · 0.04| = 1.2e-5. Награда управляет разбросом случайного блуждания, а не систематическим движением к более высокой оценке — в отличие от градиентного шага, где ожидаемое изменение веса ненулевое и направлено на уменьшение цели.'
