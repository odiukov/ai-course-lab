- concept: модуль градиента попарной потери по разности ограничен сверху единицей, тогда как сама потеря при уверенной ошибке растёт неограниченно
  question: 'Модель награды грубо перепутала пару: разность наград preferred и rejected равна −40. Как ведут себя потеря и градиент по разности?'
  explanation: '−log σ(d) при большом отрицательном d ≈ |d|, то есть около 40. Но градиент sigmoid(d) − 1 при d → −∞ стремится к −1 и не переходит эту границу. Отсюда практическое следствие: одна выбросовая пара с абсурдной разностью не может породить сколь угодно большой шаг — размер шага ограничен, ограничивать его дополнительным клиппингом по этой причине не нужно.'
  kind: choice
  options:
    - Потеря ≈ 40 и растёт линейно с ухудшением, а модуль градиента упирается в 1 и выше не поднимается
    - И потеря, и модуль градиента растут пропорционально модулю разности
    - Потеря упирается в константу, а модуль градиента растёт неограниченно
    - Обе величины насыщаются около нуля, как и при большой положительной разности
