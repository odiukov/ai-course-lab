- concept: по мере обучения вклад уверенно правильных пар в суммарный градиент затухает, и оптимизация сама концентрируется на пока не решённых парах
  question: Модель награды обучена до 85% точности ранжирования. Объясни своими словами, какие пары из обучающего набора вносят почти весь вклад в суммарный градиент эпохи и почему.
  explanation: Вес примера в обновлении равен вероятности ошибки на нём. Пары, уже решённые с запасом, фактически выпадают из обучения, а бюджет шагов уходит на спорные — и на неверные метки тоже.
  kind: open
  reference: 'Почти весь вклад дают пары, где модель ошибается или колеблется — с отрицательной либо близкой к нулю разностью наград. Градиент sigmoid(d) − 1 монотонно убывает по модулю с ростом d: у уверенно правильных пар sigmoid(d) близка к 1 и вклад почти нулевой, у пары с d = 0 он равен −0.5, у ошибочной приближается к −1. Специального взвешивания трудных примеров не требуется — форма потерь Брэдли-Терри задаёт его сама. Побочный эффект: по мере роста точности суммарный градиент затухает и обучение естественно замедляется, а оставшийся сигнал приходит с самых спорных пар — включая шумно размеченные, что делает такую модель чувствительной к ошибкам разметки.'
