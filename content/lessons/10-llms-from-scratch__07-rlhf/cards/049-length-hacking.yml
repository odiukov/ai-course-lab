- concept: совместный рост награды и длины не различает реальное улучшение и эксплуатацию прокси; разрешить неоднозначность может только сигнал вне цикла оптимизации
  question: Кривая средней награды RM и кривая средней длины ответа растут синхронно. Объясни, почему одного этого наблюдения недостаточно, чтобы объявить reward hacking, и что нужно, чтобы решить вопрос.
  explanation: Награда RM внутри цикла оптимизации перестаёт быть независимой метрикой качества — policy оптимизируется именно против неё. Рост длины лишь называет подозреваемый признак; вердикт выносит внешняя проверка.
  kind: open
  reference: 'Синхронный рост совместим с двумя разными объяснениями: policy действительно стала полезнее (и подробность — побочный признак настоящего улучшения) либо policy нашла длину как дешёвый способ поднять балл прокси. Кривая награды не может рассудить эти версии: она построена той же моделью, которую policy оптимизирует, поэтому её рост — не независимое измерение качества. Нужен сигнал вне цикла: человеческая оценка ответов, сравнение с ответами до обучения при контроле длины, проверка на запросах, где верный ответ обязан быть коротким. Длина здесь — не доказательство, а индикатор, показывающий, какой лёгкий путь policy могла найти.'
