- concept: если награда содержит слагаемое, зависящее только от длины, прибавку можно получить чистым дописыванием текста без нового содержания
  question: Балл модели награды раскладывается на содержательную часть и слагаемое 0.6 за каждые дополнительные 100 токенов ответа. Policy дописывает к ответу 500 токенов повторов и оговорок, не добавляя новых сведений. На сколько вырастет балл?
  explanation: '500 / 100 = 5 порций, 5 × 0.6 = 3.0. Содержательная часть не изменилась, но измеряемая награда выросла: именно так поверхностный признак, коррелировавший с предпочтениями разметчиков, превращается в бесплатный источник баллов для policy.'
  kind: numeric
  answer: 3
  tolerance: 0.01
