  question: В цикле PPO загружены только политика и модель награды, референс забыли поднять. Почему модель награды не может подставиться на его место?
  explanation: 'KL — расстояние между двумя распределениями над токенами: нужны log p_policy(токен | контекст) и log p_ref(токен | контекст). Модель награды устроена иначе: вход — готовая пара (промпт, ответ), выход — одно число. Она отвечает на вопрос «насколько хорош ответ», а не «насколько вероятен каждый токен».'
