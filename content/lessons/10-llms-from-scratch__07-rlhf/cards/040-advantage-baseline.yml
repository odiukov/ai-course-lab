- concept: преимущество равно награде минус baseline, где baseline — средняя награда недавних ответов
  question: В PPO baseline берут как среднюю награду по недавним ответам. Последние четыре ответа получили награды 8.0, 11.0, 12.5 и 8.5. Новый ответ получил награду 12.4. Чему равно его преимущество?
  explanation: 'Baseline = (8.0 + 11.0 + 12.5 + 8.5) / 4 = 10.0. Преимущество A = r − b = 12.4 − 10.0 = 2.4. Положительный знак означает: ответ лучше ожидаемого, вероятность таких действий policy повышает.'
  kind: numeric
  answer: 2.4
  tolerance: 0.05
  id: 040-advantage-baseline-1
  fingerprint: 47e43c9e
- concept: baseline нестационарен и растёт вместе с policy, поэтому одна и та же награда даёт разное преимущество на разных этапах обучения
  question: На раннем этапе обучения ответ с наградой 9.0 получил положительное преимущество. Через несколько тысяч шагов PPO ответ с точно такой же наградой 9.0 получает отрицательное преимущество. Модель награды при этом не менялась. Что произошло?
  explanation: Baseline — не константа, а уровень того, что policy выдаёт сейчас. По мере улучшения policy средняя награда растёт, и прежде успешный результат оказывается ниже нового ожидания. Награда 9.0 не изменилась — изменилась точка отсчёта.
  kind: choice
  options:
    - Средняя награда недавних ответов выросла, и baseline поднялся выше 9.0
    - Модель награды переобучилась и стала занижать оценку тех же текстов
    - Клиппинг отношения вероятностей изменил знак преимущества
    - KL-штраф вычитается из награды и сделал её отрицательной
  correct: 0
  id: 040-advantage-baseline-2
  fingerprint: 8c513a2a
- concept: без вычитания baseline знак сигнала не различает ответы разного качества, если награды одного знака
  question: Модель награды выдаёт на всех ответах положительные оценки, например от 3.1 до 14.9. Объясни своими словами, почему обучать policy напрямую на этих наградах, без вычитания baseline, плохо.
  explanation: 'Абсолютный балл модели награды не имеет собственного нуля. Смысл появляется только относительно ожидаемого уровня: A = r − b. Знак A решает, повышать вероятность действий или понижать.'
  kind: open
  reference: 'Направление обновления в PPO задаётся знаком множителя при отношении вероятностей. Если все награды положительны, то у любого сгенерированного ответа сигнал положителен, и policy повышает вероятность всех ответов подряд — в том числе явно слабых, набравших 3.1. Различаться будет только величина шага, а не его направление, поэтому плохие ответы не подавляются. Вычитание baseline переносит точку отсчёта с нуля на текущий средний уровень: ответы выше среднего получают положительное преимущество и подкрепляются, ниже среднего — отрицательное и подавляются. Baseline при этом не исправляет и не перекалибровывает саму модель награды, он только задаёт нулевую отметку сравнения.'
  id: 040-advantage-baseline-3
  fingerprint: ca8b39d1
