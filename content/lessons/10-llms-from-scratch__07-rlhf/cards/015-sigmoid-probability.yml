- concept: вероятность предпочтения по Брэдли-Терри равна сигмоиде разности наград
  question: Модель награды выдала preferred-ответу 5,2 балла, а rejected-ответу 3,8 балла. Какова по модели Брэдли-Терри вероятность того, что человек выберет preferred-ответ?
  explanation: P = σ(r_pref − r_rej) = σ(5,2 − 3,8) = σ(1,4) = 1/(1 + e^(−1,4)) = 1/(1 + 0,2466) ≈ 0,802. Считается только разность, отдельные баллы в формулу не входят.
  kind: numeric
  answer: 0.802
  tolerance: 0.02
  id: 015-sigmoid-probability-1
  fingerprint: f202f77e
- concept: 'сигмоида антисимметрична: σ(−d) = 1 − σ(d), поэтому вероятности двух порядков в паре дают в сумме единицу'
  question: Модель награды даёт вероятность 0,68 тому, что ответ A предпочтут ответу B. Чему равна вероятность обратного исхода — что предпочтут B?
  explanation: 'Смена порядка меняет знак разности: d становится −d. σ(−d) = 1 − σ(d), поэтому 1 − 0,68 = 0,32. Баллы знать не нужно: достаточно того, что оба исхода описываются одной разностью с разными знаками.'
  kind: choice
  options:
    - 0,68 — модель симметрична и выдаёт то же число
    - 0,32
    - 0,46 — нужно заново прогнать разность через сигмоиду
    - Определить нельзя без самих баллов награды
  correct: 1
  id: 015-sigmoid-probability-2
  fingerprint: 7e9fcaf6
- concept: 'сигмоида насыщается: одинаковый прирост разности наград даёт разный прирост вероятности в зависимости от того, где находится разность'
  question: 'В обеих парах разность наград выросла ровно на 1,0: в первой с 0,3 до 1,3, во второй с 4,0 до 5,0. В какой паре вероятность предпочтения выросла сильнее?'
  explanation: 'σ(1,3) − σ(0,3) ≈ 0,786 − 0,574 ≈ 0,21, а σ(5,0) − σ(4,0) ≈ 0,993 − 0,982 ≈ 0,011. Сигмоида нелинейна: максимальная крутизна около нуля, на хвостах она насыщается и дополнительный отрыв в наградах почти не меняет вероятность.'
  kind: choice
  options:
    - В первой — вблизи нуля сигмоида круче всего
    - Во второй — чем больше разность, тем сильнее эффект
    - 'Одинаково: прирост разности одинаковый, значит одинаков и прирост вероятности'
  correct: 0
