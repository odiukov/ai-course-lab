- concept: 'клиппинг односторонний: при отрицательном преимуществе и ratio выше верхней границы коридора выбирается необрезанный член, и штраф не смягчается'
  question: epsilon = 0.3, ratio = 2.5, преимущество = −4. Какой член выберет min и что это значит?
  explanation: 'clip(2.5) = 1.3. Произведения: 2.5 · (−4) = −10 и 1.3 · (−4) = −5.2. min(−10, −5.2) = −10, то есть необрезанный. Верхняя граница коридора защищает только положительное преимущество; для отрицательного она бы ослабила наказание, поэтому min её и не выбирает.'
  kind: choice
  options:
    - 'Необрезанный (−10): клиппинг не ограничивает штраф за плохое действие, вероятность которого выросла'
    - 'Обрезанный (−5.2): верхняя граница коридора всегда ограничивает величину члена'
    - 'Обрезанный (−5.2): при отрицательном преимуществе min работает по модулю произведения'
  correct: 0
