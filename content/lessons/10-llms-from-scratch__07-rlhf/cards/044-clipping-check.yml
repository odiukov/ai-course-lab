- concept: clip применяется к самому отношению вероятностей, а умножение на преимущество и выбор минимума идут после
  question: Расставь по порядку вычисление клиппированной цели PPO для одного действия.
  explanation: 'Границы коридора заданы для отношения, а не для произведения: сначала clip самого отношения, потом два умножения на преимущество, потом min. Если обрезать уже произведение, границы [1 − epsilon, 1 + epsilon] потеряют смысл — они не масштабируются вместе с величиной преимущества.'
  kind: order
  items:
    - Вычислить отношение вероятностей действия у текущей и старой policy
    - Обрезать это отношение границами [1 − epsilon, 1 + epsilon]
    - Умножить и необрезанное, и обрезанное отношение на преимущество
    - Взять минимум из двух полученных произведений
  id: 044-clipping-check-3
  fingerprint: d10ce21a
