- concept: метка предпочтения относится к паре (запрос, ответ), а не к тексту ответа самому по себе
  question: 'Разметчикам дали ответ про историю LLM: перечислены годы выхода архитектур, имена исследователей и названия лабораторий. При запросе «Объясни за минуту, как работает трансформер» этот ответ проиграл сопернику про self-attention. Что можно утверждать об этом ответе?'
  explanation: 'Предпочтение размечается не для текста, а для пары (запрос, ответ). Тот же корректный текст меняет статус при смене цели запроса: хронология лишняя в объяснении механизма и ровно уместна в вопросе об истории. Ни фактическая ошибка, ни длина сами по себе тут ни при чём.'
  kind: choice
  options:
    - Он объективно плохой и проиграет любому корректному сопернику
    - Он проиграл в паре с этим запросом; при запросе «Расскажи хронологию развития LLM» тот же текст может выиграть
    - Он содержит фактические ошибки, иначе бы не проиграл
    - Он проиграл из-за длины, и укорачивание его сделает победителем
  correct: 1
  id: 003-compare-ab-1
  fingerprint: c316343d
- concept: 'модель награды оценивает ответ, обусловленный запросом: r(x, y), а не r(y)'
  question: Почему модель награды в RLHF обучают как функцию от пары «запрос + ответ», а не как оценщик одного лишь текста ответа?
  explanation: 'Сравнения собирают внутри одного запроса именно поэтому: сравнивать ответы на разные запросы бессмысленно. Без обусловливания на запрос модель награды скатывается к стилевым прокси — это одна из типичных причин reward hacking, когда политика учится писать длинно и структурно вместо того, чтобы отвечать по делу.'
  kind: open
  reference: 'Потому что качество ответа определяется относительно запроса, а не абсолютно. Один и тот же текст может быть лучшим ответом на один запрос и худшим на другой: перечисление дат и имён выигрывает у вопроса об истории области и проигрывает у просьбы объяснить механизм. Оценщик, видящий только ответ, не может отличить эти случаи — он выучил бы поверхностные признаки текста (длина, структура, наличие списков) вместо соответствия цели. Поэтому модель награды получает на вход конкатенацию запроса и ответа и выдаёт скаляр r(x, y), обученный на попарных сравнениях ответов на один и тот же запрос.'
  id: 003-compare-ab-2
  fingerprint: 8cb5b8ba
