- concept: 'цель награда-минус-штраф не ограничена снизу: штраф может превысить награду и увести итог в отрицательные значения'
  question: Модель награды оценила ответ в 2.4. KL между policy и reference на этом ответе равна 7.0, коэффициент штрафа beta = 0.6. Чему равно значение цели RLHF?
  explanation: '2.4 − 0.6·7.0 = 2.4 − 4.2 = −1.8. Отрицательный результат не признак ошибки: цель не ограничена снизу, и при достаточно большом отклонении штраф перевешивает любую награду. Именно это и делает большой дрейф невыгодным.'
  kind: numeric
  answer: -1.8
