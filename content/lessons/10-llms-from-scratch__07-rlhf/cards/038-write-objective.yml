- concept: KL входит в цель как мягкий штраф внутри одного скаляра, а не как жёсткий запрет на превышение порога
  question: Объясни своими словами, почему близость policy к reference оформляют как вычитаемый штраф внутри одной скалярной цели, а не как жёсткое ограничение вида «KL не больше порога».
  explanation: 'Ключевое отличие: штраф даёт непрерывный сигнал в каждой точке и сводит задачу к максимизации одного скаляра, тогда как жёсткое ограничение молчит внутри допустимой области и не дифференцируемо на границе. Порог отклонения регулируется выбором beta.'
  kind: open
  reference: 'Штраф превращает две конкурирующие цели — высокая награда и близость к reference — в одно число, которое можно напрямую максимизировать и по которому можно считать градиент. Жёсткое ограничение разбивает пространство на допустимое и недопустимое: внутри порога оно вообще не даёт сигнала, на границе даёт разрыв, и оптимизировать его обычными градиентными шагами нельзя без отдельного механизма. Мягкий штраф вместо этого действует всюду: каждое лишнее отклонение стоит beta за единицу KL, и модель сама решает, окупается ли рост награды этой ценой. Порог при этом задаётся не явно, а косвенно — через величину beta.'
  id: 038-write-objective-3
  fingerprint: 8dc84a41
