- concept: PPO-ratio вычисляют как экспоненту разности лог-вероятностей одного действия, а не делением самих вероятностей
  question: В коде PPO вероятности токенов хранятся в логарифмах. Заполни пропуск так, чтобы получилось отношение вероятностей действия у текущей политики к её же снимку.
  explanation: log(p_new / p_old) = logp_new − logp_old, поэтому ratio = exp(logp_new − logp_old). Прямое деление exp(logp_new) / exp(logp_old) даёт тот же результат математически, но переполняется или обнуляется на длинных последовательностях, где лог-вероятности сильно отрицательны.
  kind: cloze
  template: ratio = np.exp(logp_new ___ logp_old)
  answer: '-'
  accept:
    - '-'
    - −
    - ' - '
    - minus
  id: 060-final-quiz-1
  fingerprint: e7937ae3
- concept: скалярная функция оценки не способна выразить циклические (нетранзитивные) предпочтения разметчиков
  question: 'Разметчики в трёх независимых сравнениях указали: A лучше B, B лучше C, C лучше A. Объясни своими словами, почему reward model, обученная функцией потерь Брэдли–Терри, не сможет одновременно удовлетворить все три метки.'
  explanation: 'Скалярная оценка навязывает предпочтениям одномерный порядок. Циклы в данных — диагностика качества разметки: их доля показывает, насколько согласована инструкция разметчикам, и ограничивает достижимую точность reward model сверху.'
  kind: open
  reference: 'Брэдли–Терри приписывает каждому ответу одно число, а вероятность предпочтения зависит только от разности этих чисел: P(A > B) = sigmoid(score(A) − score(B)). Значит, порядок ответов задан порядком на числовой прямой, а он транзитивен: из score(A) > score(B) и score(B) > score(C) обязательно следует score(A) > score(C). Цикл A > B > C > A требует обратного, поэтому хотя бы одна из трёх меток останется предсказанной с вероятностью ниже 0.5. Обучение сведёт три балла к компромиссу с ненулевой остаточной потерей. Такой цикл — сигнал не о плохой оптимизации, а о том, что разметчики применяли разные критерии или пары были неоднозначны.'
  id: 060-final-quiz-2
  fingerprint: a2bd3f98
- concept: награда терминальна и приходит одна на завершённый ответ, тогда как KL-штраф вычисляется на каждой позиции токена
  question: На стадии PPO политика сгенерировала ответ длиной в несколько десятков токенов. Сколько скалярных оценок reward model и сколько значений KL получает такой ответ?
  explanation: Reward model читает пару (запрос, полный ответ) и выдаёт один скаляр — оценить незаконченный текст она не обучена. KL же сравнивает распределения над словарём у policy и reference, а такое распределение есть в каждой позиции, поэтому штраф считается потокенно и обычно суммируется по последовательности.
  kind: choice
  options:
    - Одну оценку reward model на весь завершённый ответ и по значению KL на каждой позиции токена
    - По оценке reward model и по значению KL на каждой позиции токена
    - Одну оценку reward model и одно значение KL на весь ответ
    - По оценке reward model на каждой позиции токена и одно значение KL на весь ответ
  correct: 0
  id: 060-final-quiz-3
  fingerprint: 0d33449e
