- concept: повторяемость операционализируется как доля токенов ответа, входящих в уже встречавшиеся фрагменты
  question: Ответ policy содержит 160 токенов. 60 из них входят в 4-граммы, которые в этом же ответе уже встречались ранее. Чему равна повторяемость, измеренная как доля повторяющегося текста?
  explanation: 60/160 = 0,375. Метрика считается внутри ответа как доля токенов, покрытых повторно встречающимися фрагментами, и не требует ни человека, ни модели награды — поэтому её дёшево писать в лог на каждом чекпоинте рядом с наградой.
  kind: numeric
  answer: 0.375
  tolerance: 0.01
  id: 052-hacking-metrics-2
  fingerprint: '09868516'
- concept: KL в логе — независимое измерение фактического дрейфа, тогда как KL в цели — лишь регулятор с настраиваемой ценой
  question: KL уже входит в цель PPO как штраф с коэффициентом beta. Объясни своими словами, зачем при этом ещё и логировать фактическое значение KL на каждом чекпоинте.
  explanation: 'Разделение ролей: в цели KL — регулятор с назначенной ценой, в логе — наблюдаемая величина. Наличие штрафа не гарантирует малого расхождения, поэтому измерять его надо отдельно.'
  kind: open
  reference: 'Штраф в цели не фиксирует KL, он лишь назначает цену за отклонение: при слишком малом beta policy может окупать большой дрейф приростом награды, и расхождение вырастет неограниченно, при слишком большом — обучение застынет. Величина beta выбирается заранее, а фактический дрейф известен только из измерения. Лог KL показывает, какой режим получился на самом деле, и позволяет соотнести дрейф с приростом награды: большой скачок KL при малом приросте награды или при подозрительном росте длины и повторяемости — сигнал перенастроить beta или проверить ответы вручную.'
  id: 052-hacking-metrics-3
  fingerprint: 8ee65efd
