- concept: reward score = скалярное произведение скрытого состояния последней позиции на вектор весов reward head
  question: Скрытое состояние на финальной позиции равно [1,5; −0,4; 2,0], веса reward head равны [0,6; 1,0; −0,9]. Чему равен reward score?
  explanation: 'Проекция — это скалярное произведение: 1,5×0,6 + (−0,4)×1,0 + 2,0×(−0,9) = 0,9 − 0,4 − 1,8 = −1,3. Размерность скрытого состояния и reward head всегда совпадает, поэтому вектор схлопывается ровно в одно число независимо от длины последовательности.'
  kind: numeric
  answer: -1.3
  tolerance: 0.01
  id: 012-reward-head-1
  fingerprint: a1ef5f65
- concept: признаки в скрытом состоянии распределены между координатами, отдельная координата не является именованным критерием качества
  question: 'Reward-модель с размерностью скрытого состояния 512 обучена на попарных предпочтениях. Инженер утверждает: «Координата №37 — это признак вежливости, посмотрим на неё отдельно». Что не так с этим утверждением?'
  explanation: Reward head не назначает координатам подписи. Он учится усиливать сочетания признаков, характерные для предпочтённых ответов, и ослаблять остальные. Значение одной координаты само по себе ничего не говорит о качестве ответа — решает взвешенная сумма всех 512 произведений.
  kind: choice
  options:
    - 'Ничего: каждая координата обученной модели соответствует одному человекочитаемому критерию'
    - Представление распределённое — смысл размазан по многим координатам, и вклад одной координаты в оценку определяется только вместе с остальными и её весом
    - Координаты вообще не влияют на reward score, он берётся из bias reward head
    - Отдельные координаты имеют смысл, но только в первом слое трансформера, а не на выходе
  correct: 1
  id: 012-reward-head-2
  fingerprint: 900c6509
- concept: абсолютное значение reward score не имеет собственной шкалы; значимо только сравнение оценок
  question: Reward-модель выдала для ответа score 3,7. Объясни своими словами, что можно и чего нельзя заключить из этого числа.
  explanation: Сигнал обучения — только относительный порядок в парах, значит модель фиксирует упорядочивание, а не калиброванную абсолютную шкалу. Поэтому reward score используют для сравнения генераций, а не как самостоятельную метрику качества.
  kind: open
  reference: 'Число 3,7 — это положение ответа на выученной шкале, а не процент качества, не вероятность и не оценка по какой-либо внешней метрике. Модель обучалась на попарных сравнениях, поэтому осмысленно только сравнение: если другой ответ на тот же запрос получил 1,2, то первый предпочтительнее. Абсолютная величина зависит от инициализации и обучения (шкалу можно сдвинуть или растянуть, не меняя порядок ответов), поэтому «3,7 — это хорошо или плохо» без второго ответа для сравнения вопрос бессмысленный.'
  id: 012-reward-head-3
  fingerprint: ac7e7ce3
