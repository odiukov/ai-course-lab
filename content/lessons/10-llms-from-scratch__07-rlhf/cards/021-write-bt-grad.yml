- concept: производные по наградам — промежуточное звено; для обновления веса reward head их нужно домножить на производную награды по этому весу
  question: Функция градиента вернула две производные потери по скалярным наградам. Чего ещё не хватает, чтобы сделать шаг по весам reward head?
  explanation: По цепному правилу dL/dW = (dL/dr)·(dr/dW). Награда — скалярное произведение скрытого состояния последней позиции на вектор reward head, поэтому dr/dW равна самому этому скрытому состоянию. Два скалярных градиента по наградам — только первый множитель; без вектора признаков они не задают, какие координаты весов и насколько сдвинуть.
  kind: choice
  options:
    - Производной награды по весам reward head — то есть скрытого состояния, на которое эти веса умножаются
    - 'Ничего: полученные два числа и есть градиент по весам reward head'
    - Второй сигмоиды — от суммы наград, а не от разности
    - Нормировки двух производных так, чтобы их сумма стала равна единице
