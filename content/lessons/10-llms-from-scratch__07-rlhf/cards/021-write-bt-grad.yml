- concept: величина градиента — свойство функции потерь в точке, а размер шага задаётся оптимизатором, поэтому learning rate не входит в вычисление градиента
  question: Объясни своими словами, почему learning rate не должен вычисляться внутри функции градиента, и что сломается, если умножить оба возвращаемых числа на 1e-3 прямо в ней.
  explanation: 'Разделение ответственностей: «чему равна производная» и «насколько далеко шагнуть» — разные вопросы. Именно поэтому в цикле обучения множитель lr стоит в строке обновления весов, а не внутри вычисления градиента.'
  kind: open
  reference: 'Градиент — это производная потери в текущей точке, объективная характеристика функции потерь: она не зависит от того, каким шагом мы решим двигаться. Learning rate — гиперпараметр оптимизатора: его меняют, планируют по расписанию, делают разным для разных групп параметров. Если вшить его в функцию градиента, то возвращаемое значение перестаёт быть градиентом: нельзя подменить оптимизатор или расписание lr без правки математики, нельзя проверить корректность градиента численной проверкой (конечными разностями), а при lr, применённом второй раз в цикле обучения, шаг окажется масштабированным дважды. Функция должна считать и возвращать только производные; умножение на lr и вычитание из веса — дело шага обновления.'
  id: 021-write-bt-grad-3
