- concept: величина градиента попарной потери по разности равна вероятности предпочтения минус единица, то есть минус вероятности ошибки
  question: Модель награды приписывает паре вероятность того, что preferred победит, равную 0,9. Чему равен градиент потерь Брэдли–Терри по разности наград?
  explanation: 'g = σ(d) − 1, а σ(d) и есть вероятность предпочтения: 0,9 − 1 = −0,1. Модуль градиента равен вероятности ошибочного ранжирования, поэтому он лежит в интервале (−1; 0): уверенно правильная пара даёт почти нулевой шаг, уверенно неправильная — шаг, близкий к максимальному по модулю.'
  kind: numeric
  answer: -0.1
  tolerance: 0.02
