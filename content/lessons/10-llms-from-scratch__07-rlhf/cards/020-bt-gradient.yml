- concept: градиенты потери по двум наградам противоположны по знаку, так как разность входит в награды с противоположными коэффициентами
  question: Потеря Брэдли–Терри зависит от наград только через их разность d = r_preferred − r_rejected. Объясни своими словами, почему градиенты потери по r_preferred и по r_rejected противоположны по знаку и что это даёт при обновлении.
  explanation: Ключ — производная разности по каждому аргументу. Именно поэтому один отрицательный градиент по d разводит пару в разные стороны, а не двигает обе оценки одинаково.
  kind: open
  reference: 'По цепному правилу градиент по каждой награде равен градиенту по разности, умноженному на производную разности по этой награде. Разность входит в r_preferred с коэффициентом плюс единица, а в r_rejected — с минус единицей, поэтому градиент по rejected равен градиенту по preferred со сменой знака. При спуске это одним шагом поднимает оценку preferred и опускает оценку rejected, увеличивая зазор между ними. Абсолютный уровень наград при этом не фиксируется: потеря видит только разность, поэтому одинаковый сдвиг обеих оценок её не меняет.'
  id: 020-bt-gradient-3
