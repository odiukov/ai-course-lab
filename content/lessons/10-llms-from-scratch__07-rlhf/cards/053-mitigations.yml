  fingerprint: cec344c0
- concept: 'аддитивная агрегация нескольких критериев награды допускает компенсацию: провал по одному критерию окупается ростом по другому'
  question: 'Награда собирается как среднее трёх критериев с равными весами. Был ответ с оценками: точность 0.7, релевантность 0.5, краткость 0.9. Новый ответ раздут: точность 0.7, релевантность 0.9, краткость 0.3. Чему равна итоговая награда нового ответа?'
  explanation: '(0.7 + 0.9 + 0.3) / 3 ≈ 0.633 против (0.7 + 0.5 + 0.9) / 3 = 0.7 у прежнего. Провал по краткости на 0.6 частично окупился приростом релевантности на 0.4, и итог упал лишь на 0.067. Так работает любая сумма или среднее: критерии взаимно компенсируются, и несколько критериев сами по себе не запрещают эксплуатацию одного из них. Агрегация минимумом (0.3 против 0.5) компенсацию не допускает.'
  kind: numeric
  answer: 0.63
  tolerance: 0.01
  id: 053-mitigations-2
  fingerprint: cad9b833
- concept: состязательные пары должны строиться вокруг ответов, которыми policy уже эксплуатирует reward model, иначе дообучение не закрывает дыру
  question: Reward model дообучают на дополнительной порции человеческих сравнений, чтобы закрыть уже замеченную уловку policy. Объясни своими словами, почему пары для этой порции берут не из общего пула типовых запросов, а составляют специально.
  explanation: Reward model — прокси, валидный только там, где у него были данные. Уловка живёт именно там, где данных не было, поэтому лечение требует данных из этой области, а не увеличения объёма типовых сравнений.
  kind: open
  reference: 'Reward model ошибается не везде, а в узкой области ответов, куда policy сместилась в ходе оптимизации. Пары из общего пула отражают исходное распределение, и ответов с эксплуатируемым приёмом в них может просто не оказаться — тогда градиент на этих парах не трогает ту часть функции награды, где сидит ошибка, и балл за уловку остаётся высоким. Состязательная пара строится вокруг самой уловки: два ответа с одинаковым полезным содержанием, различающиеся только эксплуатируемым признаком (длина, оформление, согласие с посылкой). Человеческая метка «победил тот, что без приёма» даёт reward model прямой сигнал, что признак сам по себе не носитель качества. Отсюда же следует, что закрытие дыры — это внешний по отношению к циклу PPO шаг: нужны новые человеческие метки и переобучение reward model.'
  id: 053-mitigations-3
  fingerprint: 7dc9eb64
