- concept: точность, посчитанная на парах, по которым обновлялись веса, измеряет усвоение этих пар, а не перенос правила на новые предпочтения
  question: Модель награды обучена на 400 парах предпочтений и ранжирует 386 из них правильно. Что этот результат доказывает?
  explanation: 'Пары, по которым шли шаги оптимизации, модель могла запомнить: формулировки, темы, случайные особенности ответов. Высокая доля на них говорит только про них самих. Ответ на вопрос «уловлено ли правило» даёт лишь метрика на парах, не участвовавших в обновлении весов.'
  kind: choice
  options:
    - Что модель уловила общее правило человеческих предпочтений и будет так же ранжировать любые новые пары
    - Что модель хорошо упорядочивает именно те пары, по которым обновлялись её веса; перенос на новые пары этим числом не проверяется
    - Что модель переобучена, потому что доля выше 90% недостижима честным путём
    - Что доля 386/400 совпадает с согласием разметчиков и потому является оценкой качества данных
  correct: 1
  id: 025-heldout-accuracy-1
  fingerprint: 6fe448ed
- concept: пара теряет силу независимой проверки, как только по ней обновлялись веса; разделение данных обязано предшествовать обучению
  question: Модель награды обучалась на всех 900 парах. После обучения инженер отобрал 180 из них, объявил тестовым набором и получил на них точность 0.89. Что не так?
  explanation: Честность отложенной проверки создаётся не именем набора, а тем, что градиенты по этим парам никогда не применялись. Если пара участвовала в обучении, модель могла её запомнить, и точность на ней снова отвечает на вопрос «насколько выучены знакомые пары». Разделение делают до обучения.
  kind: choice
  options:
    - 'Ничего: набор всё равно оценивается отдельным проходом, значит оценка честная'
    - 'Не так только размер: 180 пар слишком мало для устойчивой оценки'
    - По этим 180 парам веса уже обновлялись, поэтому они не проверяют перенос на невиданные предпочтения — название набора этого не меняет
    - Оценивать надо было до обучения, тогда 0.89 была бы валидной
  correct: 2
  id: 025-heldout-accuracy-2
  fingerprint: 5a1fcefb
- concept: разрыв между точностью на обучающих и на отложенных парах — количественная мера того, сколько модель запомнила вместо усвоенного правила
  question: Модель награды ранжирует правильно 0.92 обучающих пар и 0.67 отложенных. Чему равен разрыв между этими двумя долями?
  explanation: '0.92 − 0.67 = 0.25. Это не противоречие двух оценок, а два разных ответа: первый — насколько усвоены знакомые пары, второй — насколько правило переносится на новые. Величина разрыва показывает, какая часть успеха держится на запоминании конкретных пар.'
  kind: numeric
  answer: 0.25
  tolerance: 0.005
  id: 025-heldout-accuracy-3
  fingerprint: ec045b1e
