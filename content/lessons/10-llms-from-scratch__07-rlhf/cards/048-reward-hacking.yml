- concept: 'verbosity, sycophancy, hedging и format gaming — один и тот же механизм: усиление поверхностного признака, коррелировавшего с оценками разметчиков; расхождение награды и качества диагностируется логированием такого признака рядом с наградой'
  question: В логах RLHF-прогона средний балл RM поднялся с 1,2 до 3,9, а средняя длина ответа — со 180 до 740 токенов. Что это в первую очередь показывает?
  explanation: Разметчики часто предпочитали длинные подробные ответы, поэтому RM ставит за длину более высокий балл. Того же типа и sycophancy (согласие с посылкой), hedging (обтекаемость почти никогда не помечают как неверную), format gaming (списки и заголовки выглядят «вылизанными»). Во всех четырёх случаях выучен коррелят оценки, а не качество. Логирование признака рядом с наградой — дешёвая проверка расхождения.
  kind: choice
  options:
    - Модель усиливает длину — признак, который коррелировал с оценками разметчиков, поэтому вероятен рост болтливости, а не полезности
    - 'Полезность ответов выросла пропорционально: длинный ответ содержит больше информации, значит он лучше'
    - Длина и награда — независимые величины, их совместный рост ничего не говорит и является совпадением
    - 'Сломался KL-штраф: только его отключение способно увеличить длину ответа'
