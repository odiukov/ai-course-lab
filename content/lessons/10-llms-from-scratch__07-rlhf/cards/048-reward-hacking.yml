- concept: 'механизмы смягчения reward hacking: удержание policy в области валидности RM, латание известных дыр RM состязательными примерами, одновременный взлом нескольких RM как более трудная задача'
  question: Назови три способа смягчить reward hacking в RLHF и объясни, за счёт чего работает каждый.
  explanation: 'Все три меры атакуют разные звенья: KL ограничивает, куда policy может уйти; состязательные данные исправляют сам прокси; ансамбль повышает цену взлома. Общий остаток риска в том, что любая RM — приближение, а не само предпочтение.'
  kind: open
  reference: '1) Более сильный KL-штраф: увеличенная beta делает отклонение от reference дорогим, policy остаётся ближе к распределению, на котором RM обучалась и где её оценка достоверна, и просто не доходит до областей с крупными ошибками прокси. 2) Дообучение RM на состязательных примерах: в обучающий набор добавляют пары, где уже известная дыра (длинный пустой ответ, льстивое согласие, обтекаемая формулировка) проигрывает — так конкретная эксплуатируемая слабость латается. 3) Ансамбль из нескольких RM с разными архитектурами: их ошибки не совпадают, и текст, обманывающий все модели сразу, найти труднее, чем текст, обманывающий одну. Ни один способ не устраняет проблему полностью: RM остаётся прокси, поэтому нужна внешняя проверка людьми.'
  id: 048-reward-hacking-3
  fingerprint: '70094980'
