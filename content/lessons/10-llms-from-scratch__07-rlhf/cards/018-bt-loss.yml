- concept: потеря Брэдли–Терри для пары равна минус логарифму вероятности предпочтения, вычисленной из разности наград
  question: Модель награды дала выбранному человеком ответу оценку 4.7, а отклонённому — 1.5. Чему примерно равна потеря Брэдли–Терри для этой пары (натуральный логарифм)?
  explanation: Разность равна 3.2, σ(3.2) ≈ 0.961, потеря = −ln(0.961) ≈ 0.04. Чем увереннее модель ставит на preferred, тем ближе потеря к нулю; сама формула L = −log σ(r_preferred − r_rejected) даёт для уверенной правоты почти нулевой штраф.
  kind: numeric
  answer: 0.04
  tolerance: 0.015
  id: 018-bt-loss-1
  fingerprint: 5d116d1c
- concept: минус перед логарифмом превращает неположительное лог-правдоподобие в неотрицательный штраф, минимизация которого поднимает вероятность preferred
  question: Зачем в потере Брэдли–Терри перед логарифмом вероятности предпочтения ставится минус?
  explanation: 'Вероятность не превышает единицы, поэтому её логарифм неположителен. Минус переворачивает шкалу: хороший прогноз даёт число около нуля, уверенно неверный — большое положительное. Это стандартная отрицательная логарифмическая функция правдоподобия, а не приём численной устойчивости.'
  kind: choice
  options:
    - Чтобы компенсировать знак разности наград в тех парах, где отклонённый ответ получил оценку выше
    - 'Чтобы величина, лежащая в диапазоне (0, 1], после логарифмирования давала неотрицательное число: минимизация такого штрафа равносильна максимизации вероятности preferred'
    - Чтобы избежать переполнения при вычислении экспоненты внутри сигмоиды
    - Чтобы потеря меняла знак при перестановке ответов в паре
  correct: 1
  id: 018-bt-loss-2
  fingerprint: a71cbe8d
- concept: потеря Брэдли–Терри строго положительна и лишь асимптотически стремится к нулю, поскольку сигмоида никогда не достигает единицы
  question: Какое значение может принять потеря Брэдли–Терри для одной пары при идеально работающей модели награды?
  explanation: σ(d) < 1 для любого конечного d, значит log σ(d) < 0 и −log σ(d) > 0. Обучение может бесконечно увеличивать разность, снижая потерю, но нуля не достигнет — потому у Брэдли–Терри нет естественной точки остановки, и разрыв наград ограничивают другими средствами.
  kind: choice
  options:
    - Ровно 0, как только разность наград превысит порог насыщения сигмоиды
    - Любое значение, включая отрицательные, если разность наград достаточно велика
    - Строго больше нуля при любой конечной разности наград; к нулю потеря только стремится по мере роста разности
  correct: 2
