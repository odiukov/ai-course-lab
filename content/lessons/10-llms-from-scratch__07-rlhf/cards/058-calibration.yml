- concept: разность средних наград тождественно равна среднему попарных разностей, поэтому попарный расчёт добавляет распределение и знаки, а не другое среднее
  question: 'Есть 8 пар предпочтений. Инженер считает зазор двумя способами: (A) средняя награда preferred минус средняя награда rejected; (B) для каждой пары считает разность и усредняет её по 8 парам. Что верно?'
  explanation: 'Усреднение линейно: mean(p_i − r_i) = mean(p_i) − mean(r_i), и равенство выполняется при любых знаках наград и любом числе пар. Значит попарный расчёт не даёт нового среднего — его ценность в другом: он показывает распределение по парам, и там видно, что, например, один разрыв +5,0 может перекрыть три перепутанные пары с разностями около −0,4, оставив среднее уверенно положительным.'
  kind: choice
  options:
    - A и B всегда дают одно и то же число; попарный расчёт ценен тем, что показывает знаки и разброс отдельных пар
    - A и B совпадают только если все награды положительны
    - B всегда больше A, потому что усреднение разностей подавляет выбросы
    - A и B различаются, поэтому в качестве метрики переноса надо брать B как более точную оценку зазора
  correct: 0
