- concept: доля перенесённого зазора = зазор на отложенных парах, делённый на зазор на обучающих
  question: Reward-модель на обучающих парах даёт средний балл 4,5 для preferred и 1,9 для rejected. На отложенных парах — 3,3 и 2,8. Какая доля обучающего зазора перенеслась на невиданные пары? Ответ дай числом от 0 до 1.
  explanation: 'Зазор на обучении: 4,5 − 1,9 = 2,6. На отложенных парах: 3,3 − 2,8 = 0,5. Доля переноса: 0,5 / 2,6 ≈ 0,19. Знак сохранился, но от исходного запаса уверенности осталась примерно пятая часть — модель по большей части подогнала баллы под особенности обучающих примеров, а не выучила критерий предпочтения. Смотреть надо именно на отложенное число: обучающий зазор является верхней оценкой и почти всегда завышен.'
  kind: numeric
  answer: 0.19
  tolerance: 0.02
  id: 058-calibration-1
  fingerprint: 0bdf6cce
- concept: 'отрицательный средний зазор на невиданных парах означает систематическую инверсию: модель ставит rejected выше preferred'
  question: На обучающих парах reward-модель даёт средний зазор preferred−rejected +3,1. На отложенном наборе тот же расчёт даёт −0,6. Какой вывод корректен?
  explanation: 'Зазор — разность средних наград, и его знак задаёт направление предпочтения, которое модель воспроизводит. Минус на отложенных парах означает, что на новых данных модель в среднем предпочитает отвергнутые ответы: это хуже, чем отсутствие сигнала. Сдвиг на константу не помогает — он одинаково поднимает обе награды и разность не меняет. Шкала выходов тоже ни при чём: обе оценки в паре получены одной и той же моделью.'
  kind: choice
  options:
    - На невиданных парах модель в среднем оценивает rejected выше preferred, то есть выученное правило не переносится, а работает в обратную сторону
    - Награды нужно сдвинуть на константу +0,6, чтобы зазор снова стал положительным
    - Отрицательный зазор невозможен, значит в коде перепутаны местами преобразование logits и сигмоида
    - Отрицательное значение говорит лишь о другой шкале выходов на отложенном наборе и не мешает ранжированию
  correct: 0
