- concept: '−log σ(d) при большом отрицательном d ведёт себя примерно как |d|: штраф за уверенную ошибку растёт линейно, тогда как для правильных пар потери экспоненциально стремятся к нулю'
  question: Как ведут себя потери Брэдли-Терри −log σ(d), когда разность наград d уходит далеко в минус, и как — когда далеко в плюс? Объясни своими словами, что это даёт при обучении.
  explanation: 'Асимметрия функции потерь и есть механизм отбора: чем правее разность, тем меньше вклад пары в обновление весов; чем левее — тем сильнее. Именно поэтому в коде градиент равен sigmoid(d) − 1: близок к нулю при уверенной правоте и близок к −1 при уверенной ошибке.'
  kind: open
  reference: 'При большом отрицательном d: σ(d) ≈ e^d, значит −log σ(d) ≈ |d| — потери растут почти линейно и не имеют потолка. Например, при d = −6 потери ≈ 6,0. При большом положительном d: σ(d) ≈ 1 − e^(−d), потери ≈ e^(−d), то есть экспоненциально стремятся к нулю, но нуля не достигают. Практический смысл: уверенная ошибка стоит дорого и растёт неограниченно, а на уже правильно отранжированных парах потери и градиент (sigmoid(d) − 1) почти обнуляются, поэтому обучение само концентрируется на спорных парах.'
  id: 017-sigmoid-check-3
  fingerprint: ea1e120a
