- concept: точность ранжирования пар зависит только от знака разности наград, а потери Брэдли-Терри — от её величины, поэтому метрики могут двигаться независимо
  question: За эпоху обучения модели награды средние потери Брэдли-Терри заметно упали, а доля правильно ранжированных пар предпочтений осталась 74%. Что произошло с разностями наград?
  explanation: 'Пара идёт в счётчик точности как правильная при r_preferred > r_rejected — важен только знак. Потери −log σ(d) непрерывно убывают с ростом d, поэтому уверенность может расти без единого переворота знака. Обратное тоже бывает: точность растёт скачком, пока loss почти стоит.'
  kind: choice
  options:
