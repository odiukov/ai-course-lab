- concept: 'beta задаёт обменный курс: изменение policy окупается, только если прирост награды превышает beta, умноженную на прирост KL'
  question: Изменение policy поднимает балл модели награды на 0.9, но увеличивает KL до замороженного reference на 18 нат. При каком максимальном значении beta это изменение ещё не ухудшает цель RLHF J = r − beta·D_KL?
  explanation: Изменение выгодно, пока Δr ≥ beta·ΔKL. Отсюда beta ≤ Δr/ΔKL = 0.9/18 = 0.05. При beta выше 0.05 штраф за отклонение съедает весь выигрыш награды, и оптимизация такое изменение отвергнет.
  kind: numeric
  answer: 0.05
  tolerance: 0.002
  id: 037-regularized-reward-1
  fingerprint: f6854279
- concept: beta — цена единицы отклонения, и оба крайних значения ломают обучение по-разному
  question: В цели J = r − beta·D_KL(π‖π_ref) коэффициент beta — свободный параметр. Объясни своими словами, что происходит с обучением при очень маленьком beta и при очень большом.
  explanation: 'beta не запрещает и не разрешает отклонение — он назначает ему цену. Крайности дают две противоположные поломки: реward hacking при дешёвом отклонении и застой при дорогом.'
  kind: open
  reference: 'beta — курс обмена между приростом награды и удалением от reference. При очень маленьком beta штраф почти ничего не стоит: почти любое отклонение окупается прибавкой награды, и policy свободно уходит в области, где модель награды ненадёжна, — вырожденные ответы с высоким баллом. При очень большом beta даже настоящее улучшение проигрывает, потому что цена вызванного им отклонения выше выигрыша: policy остаётся практически равной reference и обучение почти не даёт эффекта. Рабочее beta лежит между: отклонение разрешено, но обязано окупаться. В InstructGPT использовали beta=0.02.'
  id: 037-regularized-reward-2
  fingerprint: 1a826ddf
- concept: победитель по J определяется разностью награда-минус-штраф, поэтому ответ с большей наградой может проиграть ответу с меньшей
  question: beta = 0.15. Ответ A получил у модели награды 3.5 при KL = 10 нат, ответ B — 2.4 при KL = 2 нат. Какой ответ предпочтительнее по цели J = r − beta·D_KL?
  explanation: 'J(A) = 3.5 − 0.15·10 = 2.0, J(B) = 2.4 − 0.15·2 = 2.1. Более высокий балл модели награды не гарантирует победу: оптимизируется разность, а не сам r. KL входит в цель полноценным вычитаемым слагаемым с весом beta.'
  kind: choice
  options:
    - A, потому что у него выше балл модели награды
    - B, потому что после вычета штрафа его значение J больше
    - A, потому что KL входит в цель только как индикатор и на сравнение не влияет
    - 'Оба одинаковы: штраф пропорционален награде и сокращается'
  correct: 1
  id: 037-regularized-reward-3
  fingerprint: c32690d3
