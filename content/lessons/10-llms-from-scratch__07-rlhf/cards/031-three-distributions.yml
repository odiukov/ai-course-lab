- concept: PPO-ratio — отношение вероятности действия у текущей policy к её же снимку перед серией обновлений; вероятность SFT-reference в ratio не входит
  question: 'На собранном ответе вероятность одного и того же токена равна: 0.45 у текущей policy, 0.36 у снимка policy, сделанного перед этой серией шагов PPO, и 0.15 у замороженного SFT-reference. Чему равно отношение вероятностей в клиппированном суррогате PPO?'
  explanation: Ratio = pi_new/pi_old = 0.45/0.36 = 1.25. Знаменатель — снимок policy до обновления, а не SFT-reference. Если подставить 0.15, получится 3.0 — это величина суммарного отхода от SFT, её место в KL-члене, а не в ratio.
  kind: numeric
  answer: 1.25
  tolerance: 0.01
  id: 031-three-distributions-1
  fingerprint: 1fa743f5
- concept: с замороженным SFT-reference в знаменателе клиппинг ограничивает не размер текущего шага, а накопленное расхождение с началом обучения
  question: В реализации PPO для RLHF в знаменателе отношения вероятностей по ошибке стоит замороженный SFT-reference вместо снимка policy перед обновлением. Epsilon = 0.15. Что произойдёт с ролью клиппинга?
  explanation: 'Ratio должен измерять один шаг оптимизации, поэтому его знаменатель — недавний снимок, фиксированный только на время работы с текущим набором данных. Замороженный SFT-reference отстоит от policy на всё обучение: отношение к нему уходит далеко за [0.85, 1.15], min выбирает клиппированный член, чья производная по параметрам равна нулю, и контроль за размером шага теряется. Расхождение с SFT — задача KL-штрафа, а не клиппинга.'
  kind: choice
  options:
    - 'Ничего не изменится: обе модели служат точкой отсчёта, поэтому дают одно и то же отношение'
    - 'Клиппинг перестанет ограничивать величину отдельного обновления и начнёт ограничивать накопленное расхождение с началом обучения: после ухода policy от SFT отношение окажется вне коридора почти всегда, и градиент от клиппированной ветки занулится независимо от размера текущего шага'
    - Отношение станет тождественно равным единице, потому что SFT-reference заморожен
    - KL-штраф удвоится, а поведение клиппинга не изменится
  correct: 1
  id: 031-three-distributions-2
  fingerprint: 10bc5b13
- concept: снимок old policy обновляется при переходе к каждому новому набору собранных ответов, тогда как SFT-reference не пересоздаётся ни разу за RLHF
  question: Расставьте операции одной итерации PPO в правильном порядке (SFT-reference при этом заморожен и в этой последовательности не участвует).
  explanation: 'Снимок делается до серии шагов и держится фиксированным, пока используется собранный набор — иначе знаменатель отношения плыл бы вместе с числителем и отношение всегда равнялось бы единице. Обновление снимка происходит на переходе к новому набору. SFT-reference не обновляется на всём этапе RLHF: он мерит суммарный дрейф, а не размер шага.'
  kind: order
  items:
    - Скопировать текущие веса policy в снимок old policy
    - Сгенерировать набор ответов на промпты и оценить их моделью награды
    - Выполнить несколько шагов градиента по policy, считая отношение вероятностей относительно неизменного снимка old policy
    - Пересоздать снимок old policy из обновлённых весов перед следующим набором данных
  id: 031-three-distributions-3
  fingerprint: ecfbd16a
