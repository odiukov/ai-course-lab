- concept: 'процедура контролируемого вмешательства для проверки reward model: содержание удерживается постоянным, меняется только поверхностная оболочка, и в обе стороны'
  question: Есть подозрение, что reward model начисляет балл за объём и оформление, а не за полезность. Расставь шаги проверки в правильном порядке.
  explanation: 'Сравнение двух разных ответов ничего не доказывает: длинный мог быть реально полезнее. Доказательную силу даёт вмешательство, при котором полезность держится постоянной, а варьируется только оболочка. Двусторонняя проверка (раздуть и обрезать) отсекает объяснение «добавленный текст сам по себе улучшил ответ», а серия пар отделяет систематический эффект от шума.'
  kind: order
  items:
    - Взять один ответ и зафиксировать набор сведений, которые он сообщает
    - 'Построить раздутый вариант: те же сведения плюс повторы, заголовки, списки'
    - 'Построить обратный вариант: те же сведения без повторов и оформления'
    - Прогнать все варианты через reward model и записать изменение балла
    - Повторить процедуру на десятках таких пар и посмотреть, систематичен ли сдвиг
  id: 051-failure-check-1
  fingerprint: 3d53d05d
- concept: 'обратное направление теста: падение награды при удалении оформления без потери сведений — свидетельство того, что RM оценивает форму'
  question: Из ответа убрали заголовки, маркированные списки и повторяющиеся абзацы, при этом ни одно фактическое утверждение и ни одна инструкция не исчезли. Балл reward model упал с 3,8 до 2,3. Что это говорит о reward model?
  explanation: 'Информационное содержание не менялось — значит, полезность для пользователя та же. Единственная изменившаяся переменная — оформление, и балл поехал вслед за ней. Проверка в эту сторону сильнее, чем только раздувание: раздутый вариант всегда можно списать на то, что добавленный текст что-то пояснил, а вот удаление украшений такого объяснения не допускает.'
  kind: choice
  options:
    - Обрезанный ответ стал фактически менее верным
    - Часть балла reward model начисляет за поверхностную оболочку, а не за передаваемую информацию
    - KL-штраф policy стал слишком большим
    - Reward model переобучилась на слишком маленьком learning rate
  correct: 1
  id: 051-failure-check-2
  fingerprint: 4e2bd95d
- concept: почему единичная пара не является доказательством и требуется серия однотипных пар
  question: Ты изменил формат одного ответа, не трогая смысл, и балл reward model вырос. Объясни своими словами, почему этот единственный результат ещё не доказывает, что reward model награждает формат.
  explanation: Единичное измерение не отделяет эффект признака от шума и от случайно просочившегося изменения содержания. Систематический сдвиг на серии однотипных пар — это уже свойство reward model, а не свойство одного примера.
  kind: open
  reference: 'Балл reward model — зашумлённая функция текста: любое переписывание задевает не только формат, но и формулировки, порядок фраз, отдельные слова, и разница может прийти оттуда. Кроме того, «смысл сохранён» — суждение самого экспериментатора, и в одном примере легко незаметно добавить полезное уточнение. Одиночный сдвиг балла неотличим от случайной флуктуации на этом конкретном запросе. Доказательство даёт серия: десятки пар на разных запросах, где меняется только оболочка. Если сдвиг балла в одну и ту же сторону повторяется на большинстве пар, эффект систематичен и относится к признаку, а не к одному тексту.'
  id: 051-failure-check-3
  fingerprint: 662caf43
