- concept: версия инструкции разметчикам хранится в записи каждой пары, потому что метки сопоставимы только внутри одной версии критериев
  question: В наборе предпочтений 2600 пар, собранных за три месяца; за это время инструкцию разметчикам правили дважды. Какое поле в записи пары делает противоречивые метки на почти одинаковых промптах объяснимыми, а не шумом?
  explanation: Метка предпочтения осмысленна только относительно критериев, по которым её ставили. Без версии инструкции пары, размеченные по разным правилам, смешиваются в один датасет, и систематический сдвиг критериев выглядит как разногласие разметчиков. С версией такие пары можно отделить, перевзвесить или переразметить.
  kind: choice
  options:
    - Идентификатор версии инструкции, действовавшей в момент разметки
    - Средняя длина двух ответов в символах
    - Итоговый балл reward model на этой паре
    - Порядковый номер пары в наборе
  correct: 0
  id: 059-designer-artifact-1
  fingerprint: 127584b0
- concept: случайный порядок показа двух ответов в паре нужен, чтобы позиционное предпочтение разметчика не превратилось в признак, коррелирующий с меткой
  question: Протокол сбора предпочтений требует показывать два ответа разметчику в случайном порядке и сохранять этот порядок в записи. Что произойдёт, если ответ модели-кандидата всегда стоит первым?
  explanation: 'Люди систематически чаще выбирают первую или последнюю позицию. Если позиция жёстко привязана к источнику ответа, эта склонность становится конфаундом: метка коррелирует с происхождением ответа помимо его качества. Рандомизация разрывает связь, а сохранённый порядок позволяет потом измерить остаточное позиционное смещение.'
  kind: choice
  options:
    - Позиционная привычка разметчика сольётся с меткой, и reward model сможет выучить признак, не связанный с качеством ответа
    - Разметка станет медленнее, но обучающий сигнал не изменится
    - Пары перестанут годиться для попарной потери и потребуют абсолютных оценок
    - Reward model потеряет способность обусловливать оценку на промпте
  correct: 0
  id: 059-designer-artifact-2
  fingerprint: cc3af2fb
- concept: критерии приёмки reward model записываются до обучения, иначе порог подгоняется под полученный результат
  question: Расположи шаги подготовки и приёмки модели награды в порядке, который не позволяет подстроить порог под уже полученное число.
  explanation: 'Порог, названный после того, как число получено, ничего не проверяет: его всегда можно выбрать так, чтобы модель прошла. Записанные заранее пороги — особенно по срезам вроде безопасности и кода — превращают приёмку в решение, а не в интерпретацию красивого среднего.'
  kind: order
  items:
    - Зафиксировать протокол данных и инструкцию разметчикам с приоритетами для спорных случаев
    - 'Записать критерии приёмки: пороги по отложенным парам и по отдельным срезам, допустимое расхождение между группами разметчиков'
    - Собрать разметку предпочтений по утверждённому протоколу
    - Обучить модель награды на обучающей части пар
    - Сверить измеренные значения с заранее записанными порогами и принять или отклонить модель
  id: 059-designer-artifact-3
  fingerprint: c503e316
