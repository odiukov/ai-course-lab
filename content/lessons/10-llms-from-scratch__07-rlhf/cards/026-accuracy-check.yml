- concept: точности, измеренные на наборах с разной надёжностью меток, несопоставимы напрямую — сравнивать надо запас до потолка
  question: Модель A даёт 79% на наборе, где разметчики согласны в 80% случаев. Модель B даёт 88% на другом наборе, где согласие разметчиков 95%. Что можно заключить?
  explanation: 'У A остаётся ~1 пункт до потолка 80%, у B — ~7 пунктов до потолка 95%. Числа получены на разных шкалах: разная доля неоднозначных пар сдвигает достижимый максимум. Сравнивать модели можно только на одном наборе либо через запас до соответствующего потолка.'
  kind: choice
  options:
    - A ближе к потолку своего набора, чем B к своему, поэтому прямое сравнение 79% и 88% некорректно
    - B лучше A, так как 88% больше 79% при одинаковом случайном уровне 50%
    - 'Обе модели одинаковы: разница 9 процентных пунктов лежит внутри обычного разброса'
    - A лучше B, потому что работала на более сложном наборе
  correct: 0
