- concept: 'шум меток задаёт вычислимый потолок точности ниже 100%: на неоднозначных парах записанное предпочтение фактически случайно'
  question: В отложенном наборе пар предпочтений 30% пар неоднозначны — записанное предпочтение на них равносильно подбрасыванию монеты. Модель награды безошибочно ранжирует все однозначные пары. Какую точность на этом наборе она покажет (в процентах)?
  explanation: '0.70 однозначных пар модель берёт целиком, на 0.30 неоднозначных совпадает с меткой в половине случаев: 0.70 + 0.30·0.5 = 0.85. Идеальная по существу модель даёт 85%, а не 100% — недостающие 15% это шум разметки, а не ошибки модели.'
  kind: numeric
  answer: 85
  tolerance: 1
  id: 026-accuracy-check-1
  fingerprint: fb478998
- concept: 'измеренная точность зависит от состава оценочного набора: удаление спорных пар поднимает число, не меняя саму модель'
  question: Из отложенного набора выбросили все пары, по которым два независимых разметчика выбрали разные ответы. Веса модели награды не трогали. Что произойдёт с измеренной точностью ранжирования?
  explanation: Спорные пары — основной источник несовпадений с меткой. Убрав их, вы поднимаете и потолок (согласие людей на остатке близко к 100%), и саму метрику. Цифра выросла, качество модели — нет. Поэтому точность без указания надёжности меток набора не интерпретируема.
  kind: choice
  options:
    - 'Скорее всего вырастет: убраны именно те пары, где метка ненадёжна и совпасть с ней трудно'
    - 'Не изменится: точность — свойство модели, а не набора, на котором её считают'
    - 'Скорее всего упадёт: набор стал меньше, поэтому каждая ошибка весит больше'
  correct: 0
  id: 026-accuracy-check-2
