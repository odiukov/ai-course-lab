- concept: согласие разметчиков ограничивает достижимую точность reward model сверху, поэтому результат сильно выше этого потолка сигнализирует об утечке, а не о качестве
  question: На наборе попарных предпочтений сами люди-разметчики согласны друг с другом примерно в 68% случаев. Обученная reward model показывает на этом же наборе 95% точности ранжирования. Почему это повод для тревоги, а не для радости?
  explanation: 'Точность reward model осмысленно сравнивать не со 100%, а с уровнем согласия людей: у InstructGPT ~72% при согласии разметчиков ~73% — то есть модель практически упёрлась в потолок шума. Результат, резко превышающий потолок, почти всегда указывает на утечку или на короткий признак-артефакт, а не на понимание предпочтений.'
  kind: open
  reference: 'Метки предпочтений зашумлены: часть пар неоднозначна, и на них разные люди выбирают разных победителей. Согласие разметчиков ~68% означает, что примерно в трети пар «правильный» ответ не воспроизводим даже человеком, то есть верхняя граница достижимой точности лежит недалеко от уровня согласия. Точность 95% значит, что модель воспроизводит и невоспроизводимую часть меток — она подогнана под конкретного разметчика или под артефакты (длина ответа, форматирование), либо оценочные пары пересекаются с обучающими (утечка). Такая модель даст завышенную оценку и на стадии PPO политика начнёт эксплуатировать выученный артефакт вместо реального качества.'
