- concept: разделяемая ссылка вместо копии значений даёт тождественно нулевую KL на всём прогоне — диагностический признак того, что штраф не измеряет ничего
  question: В PPO-цикле KL(policy||reference) равна ровно 0.0000 на всех 30 эпизодах, хотя средняя награда за это время выросла и сэмплы политики заметно изменились. Какая ошибка кода наиболее вероятна?
  explanation: Нужны две независимые модели с одинаковыми числами внутри, а не два имени одного объекта. При алиасинге каждое обновление политики синхронно меняет «референс», расхождение не возникает никогда, и KL остаётся нулевой при любом поведении модели. Значение beta масштабирует штраф, но не может обнулить саму KL; заморозка референса — это отказ от градиентов, forward-проход и вычисление KL по нему работают как обычно.
  kind: choice
  options:
    - reference и policy — две переменные, ссылающиеся на один объект модели, поэтому обновления политики применяются и к «референсу»
    - коэффициент beta выставлен слишком маленьким, и штраф не успевает накопиться
    - reference заморожен, а замороженная модель не может участвовать в вычислении KL
    - награда нормализована вычитанием baseline, из-за чего KL зануляется
