- concept: 'модель награды не участвует в инициализации генеративной пары: её выходная голова даёт скаляр вместо распределения над словарём, и её параметры — результат обучения на предпочтениях'
  question: Почему перенос весов SFT-чекпоинта делается в policy и reference, но не в модель награды?
  explanation: 'Смысл копирования в паре policy/reference — сделать их распределения над токенами идентичными на старте. У модели награды выход другой природы: скаляр r(x, y), а не распределение, поэтому «одинаковый старт» с генератором не имеет смысла. Её веса приходят со стадии обучения на попарных предпочтениях и на стадии PPO только используются в forward-проходе. KL считается по двум генеративным моделям, оценщик в неё не входит.'
  kind: choice
  options:
    - У модели награды другая выходная голова — она отображает скрытое состояние в один скаляр, а не в логиты над словарём, и её параметры получаются обучением на парах предпочтений
    - Потому что модель награды меньше по размеру и веса SFT в неё физически не помещаются
    - Потому что модель награды должна стартовать случайной, чтобы её оценки не коррелировали с политикой
    - Потому что копирование сломало бы вычисление KL, в котором участвуют все три модели
