- concept: 'порядок стадий RLHF-конвейера: каждая стадия потребляет артефакт предыдущей'
  question: Расставь этапы конвейера RLHF в порядке выполнения.
  explanation: 'Порядок нельзя перестраивать: без SFT сравнивать нечего (ответы обрываются и не следуют инструкции), без обученной модели награды PPO не получает скалярного сигнала, а без SFT-чекпоинта нет ни стартовой политики, ни референса для KL-штрафа.'
  kind: order
  items:
    - Дообучить базовую модель на парах «инструкция — ответ» (SFT)
    - Собрать попарные предпочтения разметчиков на ответах SFT-модели
    - Обучить модель награды предсказывать эти предпочтения
    - Инициализировать политику и замороженный референс из SFT-чекпоинта
    - 'Запустить цикл PPO: генерация, оценка моделью награды, обновление политики'
  id: 005-three-stages-1
  fingerprint: b0822236
- concept: модель награды только оценивает пару, параметры генератора меняет исключительно стадия PPO
  question: Модель награды поставила ответу низкий балл. Что именно происходит с текстом ответа и с весами языковой модели?
  explanation: 'R(промпт, ответ) — это функция оценки, её выход скалярный балл, генеративной головы у неё нет. Улучшение происходит только на стадии PPO: политика повышает вероятность формулировок с высоким баллом, а KL-штраф относительно замороженного SFT удерживает её рядом с исходным распределением.'
  kind: choice
  options:
    - Модель награды переписывает ответ в улучшенный вариант, и он идёт в обучающую выборку
    - Модель награды возвращает только скаляр; веса языковой модели меняет шаг оптимизации PPO
    - Модель награды напрямую обновляет веса языковой модели градиентом своего скора
    - Ответ отбрасывается, и модель награды дообучается на нём как на негативном примере
  correct: 1
  id: 005-three-stages-2
  fingerprint: dad8b465
- concept: 'SFT-чекпоинт входит в конвейер трижды: источник генераций для предпочтений, инициализация политики, замороженный референс для KL'
  question: Назови все роли, в которых SFT-чекпоинт участвует в RLHF после того, как SFT-обучение завершено, и объясни, почему каждая из них нужна.
  explanation: 'Ключевое наблюдение конвейера: SFT — не разовый предварительный шаг, а опора, используемая трижды. Заметь, что референс именно заморожен: если бы KL считался относительно текущей политики, штраф был бы нулевым и ограничение исчезло.'
  kind: open
  reference: 'Три роли. (1) Источник ответов для разметки предпочтений: осмысленные, следующие инструкции варианты дают разметчику реальный выбор, иначе он сравнивает две неудачи, и модель награды учится на шуме. (2) Инициализация политики PPO: обучение с подкреплением стартует из точки, которая уже умеет отвечать, а не из случайного/базового поведения — иначе награда почти всегда низкая и сигнал бесполезен. (3) Замороженная референсная модель для KL-штрафа: расхождение политики измеряется относительно SFT-распределения, что мешает политике уйти в вырожденные тексты, взламывающие модель награды.'
  id: 005-three-stages-3
  fingerprint: fc72bdff
