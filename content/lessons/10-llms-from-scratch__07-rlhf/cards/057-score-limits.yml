- concept: 'среднее по набору промптов скрывает распределение: рост средней награды совместим с ухудшением на большинстве промптов'
  question: Замер на 5 промптах. SFT-ответы получают по 2.0 балла на каждом промпте. RLHF-ответы получают 1.5 на четырёх промптах и 12.0 на пятом. Чему равен средний reward RLHF-модели?
  explanation: '(1.5·4 + 12.0)/5 = 18.0/5 = 3.6, против 2.0 у SFT. Среднее выросло почти вдвое, хотя на 4 из 5 промптов RLHF-ответ оценён хуже: один выброс тянет агрегат вверх. Поэтому по среднему нельзя судить о качестве — нужен попромптный разбор и доля промптов, где политика выиграла.'
  kind: numeric
  answer: 3.6
