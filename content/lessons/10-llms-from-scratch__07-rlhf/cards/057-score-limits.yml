- concept: точная граница утверждения, которое обеспечивает рост reward score, и тип данных, необходимый для вывода о человеческой полезности
  question: Средний reward score ответов RLHF-политики выше, чем у исходной SFT-модели. Сформулируй своими словами, какое утверждение этот факт обосновывает, какое — нет, и какие данные нужны для второго.
  explanation: Ключ — разница между прогнозом предпочтения и самим предпочтением. Балл RM говорит «оценщику нравится больше», человеческая полезность требует человеческого замера. Рост балла остаётся полезным диагностическим сигналом обучения, но вердиктом о качестве не является.
  kind: open
  reference: 'Обосновано: ответы политики лучше соответствуют предпочтениям, которые reward model выучила на своих обучающих данных, то есть политика успешнее максимизирует прокси. Не обосновано: что ответы стали полезнее людям. Reward model — обученный прогноз человеческого выбора на конечной выборке пар, а не измерение полезности; она несёт систематические ошибки (например, связь высокой оценки с длиной, оформлением, уверенным тоном), которые политика при сильной оптимизации усиливает. Для второго утверждения нужны данные вне цикла оптимизации: слепое человеческое сравнение ответов двух моделей на промптах, не использовавшихся при обучении, с агрегацией доли побед; вспомогательно — чтение самих ответов и логирование KL, длины, повторяемости рядом с наградой.'
