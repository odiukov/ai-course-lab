- concept: 'правильность и полезность — независимые оси оценки ответа: фактически верный ответ может не позволять выполнить задачу'
  question: 'Пользователь спрашивает, как перезапустить упавший сервис на сервере. Ответ: «Сервисами в systemd управляет systemctl; демон init запускается первым процессом с PID 1». Все утверждения верны. Какой признак качества здесь нарушен сильнее всего?'
  explanation: 'Факты верны, значит правильность не пострадала. Но команды перезапуска нет — пользователь не может действовать. Именно поэтому качество разбивают на отдельные свойства: правильность оценивает истинность, полезность — возможность довести задачу до конца.'
  kind: choice
  options:
    - 'Правильность: в ответе есть фактическая ошибка'
    - 'Полезность: после ответа пользователь всё ещё не может выполнить нужное действие'
    - 'Краткость: ответ слишком длинный'
    - 'Ни один: раз факты верны, ответ качественный'
  correct: 1
  id: 002-quality-criteria-1
  fingerprint: 9e539ad0
- concept: краткость означает удаление лишнего, а не минимизацию длины; сжатие ниже порога вымывает действенную информацию и рушит полезность
  question: Две системы генерируют ответы на инструкции. Система X даёт в среднем 300 слов, система Y — 12 слов, при этом Y часто отвечает «настройте параметры под вашу задачу». Что это говорит об оптимизации по краткости?
  explanation: 'Краткость — не минимизация числа слов, а отсутствие балласта. Ответ в 12 слов без конкретных параметров формально компактен, но не даёт действовать: краткость выросла за счёт полезности. Свойства нужно проверять по отдельности, иначе оптимизация одного разрушает другое.'
  kind: choice
  options:
    - 'Y лучше по краткости и потому лучше в целом: чем короче ответ, тем выше качество'
    - Краткость — про отсутствие лишнего; Y обрезала и нужное, потеряв полезность, так что выигрыш мнимый
    - Длина вообще не связана с качеством ответа
    - X лучше, потому что развёрнутость всегда повышает полезность
  correct: 1
  id: 002-quality-criteria-2
  fingerprint: e36120b6
- concept: 'релевантность отличается от правильности: верные, но не относящиеся к запросу сведения ухудшают ответ'
  question: Объясни своими словами, почему релевантность нельзя вывести из правильности, и приведи ситуацию, где ответ полностью правдив, но нерелевантен.
  explanation: 'Правильность и релевантность измеряют разное: первая — соответствие фактам, вторая — соответствие запросу. Верный текст не по теме проходит первую проверку и проваливает вторую, поэтому одна ось не заменяет другую.'
  kind: open
  reference: 'Правильность проверяет, истинны ли утверждения сами по себе; релевантность — отвечают ли они на заданный вопрос. Это разные проверки: истинность оценивается без учёта запроса, релевантность только относительно него. Пример: на вопрос «какой индекс ускорит этот SELECT» модель точно описывает историю B-деревьев и различия между InnoDB и MyISAM. Всё правда, но нужного индекса нет — ответ верный и нерелевантный. Поэтому при сравнении двух ответов проверяют свойства раздельно: иначе разница между ними остаётся расплывчатым «этот лучше» без указания, где именно возникло расхождение.'
  id: 002-quality-criteria-3
  fingerprint: 6c6c902f
