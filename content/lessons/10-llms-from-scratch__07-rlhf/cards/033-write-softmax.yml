- concept: softmax нормирует каждую строку батча независимо, поэтому сумма всего выходного массива равна числу строк
  question: 'На вход softmax подан массив логитов формы (6, 8): 6 наборов по 8 вариантов токенов. Softmax применён по последней оси. Чему равна сумма всех 48 чисел в выходном массиве?'
  explanation: Каждая из 6 строк после нормировки суммируется в 1, число вариантов (8) на это не влияет. Итог 6·1 = 6. Если сумма получилась равной 1, значит нормировка шла по всему батчу сразу и строки перестали быть независимыми распределениями.
  kind: numeric
  answer: 6
  tolerance: 0.01
  id: 033-write-softmax-1
  fingerprint: 859acd8d
- concept: вычитание общего для всего батча максимума сохраняет корректность распределений, а деление на общую сумму экспонент — нет
  question: Реализация softmax для батча логитов формы (B, V) редуцирует по всему массиву, а не по последней оси. Что произойдёт с результатом?
  explanation: 'Максимум по всему батчу — это для каждой строки тоже константа, а softmax инвариантен к сдвигу логитов на константу, так что математика остаётся верной; риск лишь в том, что строки с логитами намного ниже глобального максимума после exp уйдут в нули. Сумма же — это знаменатель нормировки: взяв её по всему массиву, вы делите строку на чужие экспоненты, и сумма строки перестаёт быть единицей.'
  kind: choice
  options:
    - Общий максимум на весь батч сохраняет корректные распределения (хотя строки с малыми логитами рискуют обнулиться), а общая сумма экспонент ломает нормировку строк
    - 'Оба варианта одинаково ломают результат: строки перестают суммироваться в 1'
    - Оба варианта дают верный результат, разница только в скорости вычислений
    - Общая сумма экспонент безопасна, а общий максимум даёт неверные вероятности
  correct: 0
