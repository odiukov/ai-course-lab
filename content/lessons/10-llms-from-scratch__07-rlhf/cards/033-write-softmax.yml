- concept: keepdims=True нужен, чтобы редуцированная ось осталась размерности 1 и broadcasting выровнял её по строке, а не по столбцу
  question: Логиты имеют форму (6, 6). Вычислено `m = logits.max(axis=-1)` без `keepdims=True`, затем `logits - m`. Что получится?
  explanation: 'Без keepdims результат имеет форму (6,). При broadcasting он выравнивается по последней оси, то есть m[j] вычитается из столбца j, а не из строки j. Квадратная форма маскирует баг: ошибки нет, но числа неверные. При форме (6, 8) вектор (6,) не сложится с осью длины 8 и NumPy бросит исключение — поэтому квадратные тестовые батчи опасны. С keepdims=True форма (6, 1) выравнивается по строкам корректно при любой ширине.'
  kind: choice
  options:
    - 'Ошибка формы: NumPy не сможет выполнить вычитание'
    - Вычитание пройдёт без ошибки, но максимум каждой строки вычтется из столбца, а не из своей строки
    - 'Всё верно: NumPy сам поймёт, что редукция была по последней оси'
    - Из всего массива вычтется один глобальный максимум
  correct: 1
  id: 033-write-softmax-3
  fingerprint: d22a5929
