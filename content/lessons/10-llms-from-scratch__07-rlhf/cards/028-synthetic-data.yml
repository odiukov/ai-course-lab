- concept: набор предпочтений, размеченный одним автором, лишён разногласий и неоднозначных пар, поэтому переоценивает достижимую точность и фиксирует критерии автора как истину
  question: 'Две коллекции по 200 пар: первая размечена одним автором по им же придуманным критериям, вторая — группой независимых разметчиков на реальных запросах. Что ожидаемо отличает первую коллекцию?'
  explanation: 'Один разметчик по построению самосогласован: конфликтующих мнений нет, спорные пары в набор просто не попадают. Отсюда два следствия — задача выглядит легче, чем реальная, и «полезность» в этом наборе означает ровно то, что понимал под ней автор.'
  kind: choice
  options:
    - В ней больше спорных пар, поэтому обучение идёт медленнее
    - В ней отсутствуют разногласия и неоднозначные случаи, так что метка всюду согласована, а сам критерий «лучше» совпадает с предпочтениями автора
    - В ней метки шумнее, потому что один человек ошибается чаще группы
    - Она даёт более низкую точность reward model, так как в ней меньше сигнала
