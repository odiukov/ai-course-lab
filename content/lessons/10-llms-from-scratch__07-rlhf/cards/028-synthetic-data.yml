- concept: высокая точность на синтетическом наборе подтверждает корректность связки данные-обучение-оценка, а не валидность модели награды на реальном распределении запросов
  question: Reward model обучена на синтетических парах, где «лучший» ответ выбрал сам автор примеров, и показывает точность 0.98. Объясни своими словами, какой вывод из этого числа корректен, а какой — нет.
  explanation: Точность измеряется на том распределении, из которого взяты пары. Синтетический набор — узкое и заранее упрощённое распределение, поэтому число говорит о работоспособности связки данные-обучение-метрика, но не переносится на реальных пользователей.
  kind: open
  reference: 'Корректный вывод: конвейер собран правильно — формат пар совпадает с тем, что ждёт модель, обучение сходится, метрика считается и реагирует на данные. Это проверка исправности стенда. Некорректный вывод: что модель пригодна оценивать ответы для реальных людей. Синтетический набор состоит из ясных, почти неконфликтующих случаев, в нём нет разногласий разметчиков, неоднозначных запросов, культурных различий и редких ситуаций, а критерий «лучше» задан одним автором и потому наследует его предпочтения. Оценка на такой выборке не даёт оценки качества на реальном распределении запросов; для этого нужны пары с независимой человеческой разметкой на целевом распределении.'
