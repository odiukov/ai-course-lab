- concept: при отрицательном преимуществе ограничитель срабатывает на нижней границе коридора, то есть ограничивает чрезмерное снижение вероятности
  question: Преимущество ответа отрицательное, A = -4, epsilon = 0.25. При каком поведении ρ клиппинг начнёт ограничивать вклад этого примера в цель?
  explanation: Для плохого ответа оптимизация давит вероятность вниз, то есть гонит ρ к нулю. При A = -4 и ρ = 0.5 необрезанный член равен -2, обрезанный 0.75 · (-4) = -3; min выбирает -3, худшее для максимизации. Дальнейшее падение ρ ниже 0.75 больше не улучшает цель, и одна неудачная генерация не может обнулить вероятность ответа.
  kind: choice
  options:
    - Когда ρ вырастет выше 1.25 — вероятность ответа слишком сильно увеличится
    - Когда ρ упадёт ниже 0.75 — вероятность ответа слишком сильно уменьшится
    - Клиппинг вообще не действует на примеры с отрицательным преимуществом
    - Клиппинг сработает при любом ρ, отличном от единицы, потому что A отрицательное
