- concept: клиппированная цель равна min из необрезанного и обрезанного произведения, поэтому при большом ratio и положительном преимуществе вклад равен граничному множителю на преимущество
  question: В PPO epsilon = 0.15, преимущество A = +6, а отношение вероятностей ρ выросло до 2.4. Чему равно значение максимизируемой клиппированной цели min(ρA, clip(ρ,1-eps,1+eps)A) для этого примера?
  explanation: 'Необрезанный член: 2.4 · 6 = 14.4. Обрезанный: clip(2.4, 0.85, 1.15) = 1.15, значит 1.15 · 6 = 6.9. min выбирает меньшее — 6.9. Вместо выгоды 14.4 пример даёт только 6.9: за выход за верхнюю границу дополнительной выгоды не начисляют.'
  kind: numeric
  answer: 6.9
  tolerance: 0.05
  id: 042-clipped-surrogate-1
  fingerprint: b69b522b
- concept: клиппинг ограничивает вклад примера в целевую функцию, а не сами вероятности или веса — ρ физически может оказаться вне коридора
  question: После серии PPO-обновлений измерили отношение вероятностей для одного действия и получили ρ = 1.6 при epsilon = 0.25. Что это означает?
  explanation: clip применяется к слагаемому в целевой функции, а не к параметрам и не к самим вероятностям. Градиенты от других примеров и от других шагов могут увести ρ дальше 1.25; клиппинг лишь обнуляет добавочную выгоду за таким выходом, поэтому этот конкретный пример перестаёт толкать обновление дальше.
  kind: choice
  options:
    - 'Ошибка в реализации: клиппинг обязан удерживать ρ внутри [0.75; 1.25]'
    - 'Нормальная ситуация: клиппинг режет вклад примера в цель, но не запрещает вероятностям уходить за коридор'
    - Значит, преимущество для этого действия было отрицательным, иначе ρ не превысило бы верхнюю границу
    - Значит, веса модели вышли за допустимый диапазон и их надо обрезать вручную
  correct: 1
