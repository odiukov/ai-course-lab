- concept: точность ранжирования считается поэлементно по парам и не выводится из сравнения средних наград двух коллекций
  question: Модель награды выдала на четырёх парах предпочтений баллы preferred = [9.0, -1.5, -1.5, -1.5] и rejected = [2.0, 0.5, 0.5, 0.5] (индексы соответствуют парам). Чему равна доля правильно ранжированных пар?
  explanation: 'Правильна только пара с индексом 0 (9.0 > 2.0), в остальных трёх rejected выше: 1/4 = 0.25. При этом среднее preferred (1.125) больше среднего rejected (0.875) — агрегат по коллекции говорит одно, а попарная метрика другое. Точность определена только через сравнение баллов внутри одной пары (x, y_pref) / (x, y_rej), потому что абсолютная шкала наград не сопоставима между разными запросами.'
  kind: numeric
  answer: 0.25
  tolerance: 0.01
  id: 024-write-rm-accuracy-1
  fingerprint: 4fe7df95
- concept: точность — нормированная на число пар доля в [0,1], а не счётчик правильных сравнений и не процент
  question: Заполните пропуск так, чтобы функция возвращала точность ранжирования модели награды как долю, а не как количество пар.
  explanation: Счётчик правильных сравнений сам по себе зависит от размера выборки и несравним между наборами данных. Деление на общее число пар даёт величину в диапазоне от 0.0 до 1.0, которую можно сопоставлять со случайным уровнем 0.5 и с точностью на другой выборке. Умножение на 100 дало бы проценты — другую шкалу, ломающую сравнение с порогами вроде 0.72.
  kind: cloze
  template: |-
    correct = sum(1 for p, r in zip(preferred_rewards, rejected_rewards) if p > r)
    return correct / ___
  answer: len(preferred_rewards)
  accept:
    - len(rejected_rewards)
    - len(list(preferred_rewards))
    - num_pairs
    - n_pairs
    - total_pairs
  id: 024-write-rm-accuracy-2
  fingerprint: dc86c01e
- concept: доля правильно ранжированных пар кусочно-постоянна по параметрам, поэтому служит метрикой, но не функцией потерь для градиентного обучения
  question: Почему модель награды обучают, минимизируя попарные потери Брэдли–Терри, а не максимизируя напрямую долю правильно ранжированных пар, хотя интересует нас именно эта доля?
  explanation: Ключ — различие между целевой метрикой и обучаемым суррогатом. Метрика ранжирования дискретна и недифференцируема, суррогат гладкий и монотонно связан с ней по направлению. Тот же приём стоит за использованием кросс-энтропии вместо доли верных классов в классификации.
  kind: open
  reference: 'Доля правильно ранжированных пар зависит от параметров только через знак разности наград, то есть является кусочно-постоянной функцией: почти при любом малом изменении весов ни один знак не меняется, метрика остаётся ровно той же, и её градиент по параметрам равен нулю (а в точках переключения знака не существует). Градиентному методу такая функция не даёт направления шага. Потеря Брэдли–Терри -log σ(r_pref - r_rej) — гладкий суррогат: она реагирует на величину разности, а не только на её знак, поэтому даёт ненулевой градиент даже там, где пара уже ранжирована правильно, и тем сильнее, чем разность меньше. Уменьшая её, мы косвенно толкаем разности в положительную сторону и повышаем долю правильных пар, а саму долю считаем отдельно как интерпретируемую метрику качества.'
  id: 024-write-rm-accuracy-3
  fingerprint: b3a4172e
