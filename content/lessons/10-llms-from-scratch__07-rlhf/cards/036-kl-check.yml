- concept: KL равна нулю только при поточечном совпадении вероятностей на всём словаре, а не при совпадении самых вероятных токенов
  question: Две модели на одной и той же позиции ставят на первое место один и тот же токен и почти одинаково ранжируют остальные, но численные вероятности хвоста у них расходятся. Что верно про KL между этими распределениями?
  explanation: KL — сумма по всему словарю, а не сравнение победителей или порядка. Каждый вариант вносит p·ln(p/q); вклады с p>q и p<q не компенсируют друг друга, суммарно KL ≥ 0 и равна нулю тогда и только тогда, когда p = q на каждом токене. Совпадение argmax ничего не гарантирует.
  kind: choice
  options:
    - 'Она равна нулю: совпадают и argmax, и порядок токенов'
    - 'Она строго положительна: ноль достигается только при равенстве вероятностей всех вариантов'
    - Она отрицательна, потому что расхождения в хвосте дают отрицательные логарифмы
    - Её нельзя определить, пока распределения различаются
  correct: 1
  id: 036-kl-check-1
  fingerprint: 121e5ba6
- concept: вклад токена в KL(policy||reference) неограниченно растёт, когда reference почти не допускает токен, который policy считает вероятным
  question: На одной позиции policy даёт токену вероятность 0.8, а замороженный reference — 0.001. Чему равен вклад этого токена в D_KL(policy || reference) в натах?
  explanation: 'Вклад = p·ln(p/q) = 0.8·ln(800) ≈ 0.8·6.685 ≈ 5.35 ната от одного токена. Знаменатель под логарифмом — вероятность reference: чем ближе она к нулю на токене, который policy уверенно выбирает, тем больше штраф, вплоть до бесконечности при q = 0. Именно так KL-штраф удерживает политику внутри носителя SFT-распределения.'
  kind: numeric
  answer: 5.35
  tolerance: 0.05
  id: 036-kl-check-2
