- concept: KL, при которой штраф целиком съедает награду, равна отношению награды к beta
  question: Цель PPO — reward минус beta, умноженная на KL. Модель награды выдала 5, коэффициент beta равен 0,05. При каком значении KL итоговое значение цели обратится в ноль?
  explanation: Ноль достигается, когда beta·KL = reward, то есть KL = reward / beta = 5 / 0,05 = 100. Чем меньше beta, тем дальше политика может уйти от reference до того, как штраф обнулит выигрыш.
  kind: numeric
  answer: 100
  tolerance: 0.5
  id: 039-objective-check-1
  fingerprint: e793a446
- concept: штраф — это произведение beta на KL, и вычитается именно оно, а не сама величина KL
  question: Reward модели равен 6, beta равна 0,01, KL относительно замороженного reference равна 50. Чему равно значение цели?
  explanation: 'Сначала штраф: 0,01 · 50 = 0,5. Затем 6 − 0,5 = 5,5. Вариант −44 получается, если вычесть саму KL, забыв про множитель beta; 5,99 — если вычесть beta; 6,5 — если штраф прибавить, хотя цель максимизируется и отклонение должно наказываться.'
  kind: choice
  options:
    - 5,5
    - −44
    - 5,99
    - 6,5
  correct: 0
  id: 039-objective-check-2
