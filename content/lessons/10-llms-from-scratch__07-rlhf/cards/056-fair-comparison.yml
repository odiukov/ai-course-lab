- concept: одинаковый seed выравнивает источник случайности, но не выходной текст, потому что распределения вероятностей у моделей различаются
  question: SFT и RLHF генерируют ответ на один промпт с одинаковыми decoding-настройками и с одинаково сброшенным seed. Тексты получились разные. Объясни своими словами, почему это ожидаемо и что тогда вообще даёт фиксация seed.
  explanation: Seed управляет только потоком случайных чисел, а не решением модели. Совпадение seed убирает один конфаунд из сравнения, но не делает модели одинаковыми — иначе сравнение вообще не имело бы смысла.
  kind: open
  reference: 'Seed задаёт последовательность случайных чисел, но токен выбирается применением этого числа к распределению вероятностей модели. У SFT и RLHF веса разные, значит разные распределения на каждом шаге, и одно и то же случайное число попадает в разные токены; дальше префиксы расходятся и различие нарастает. Фиксация seed нужна не ради совпадения текстов, а чтобы убрать разницу в источнике случайности как объяснение результата: тогда расхождение ответов и наград правдоподобнее относить к весам моделей.'
  id: 056-fair-comparison-2
  fingerprint: 915e7c19
- concept: 'процедура парного замера: сначала уравниваются все условия генерации, затем на каждой генерации сбрасывается seed, и только потом оценки агрегируются по набору промптов'
  question: Расставь шаги корректного парного сравнения SFT и RLHF по средней награде на наборе из 12 промптов.
  explanation: Условия уравниваются до генерации, seed сбрасывается отдельно перед каждой из двух генераций, оценивает обе колонки одна и та же reward model. Единственная строка ничего не доказывает из-за разброса сэмплирования — вывод делается по средним на наборе промптов.
  kind: order
  items:
    - 'Зафиксировать общие для обеих моделей decoding-настройки: temperature, лимит новых токенов, правило отбора кандидатов'
    - Взять очередной промпт из набора и подать его обеим моделям в неизменном виде
    - Сбросить seed и сгенерировать ответ SFT-моделью
    - Сбросить seed на то же значение и сгенерировать ответ RLHF-моделью
    - Оценить оба ответа одной и той же моделью награды на этом промпте
    - Повторить для всех 12 промптов и сравнить средние баллы двух колонок
