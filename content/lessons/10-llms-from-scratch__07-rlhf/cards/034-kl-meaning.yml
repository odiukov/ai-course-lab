- concept: KL между двумя дискретными распределениями считается как взвешенная вероятностями policy сумма логарифмов отношений
  question: На одной позиции возможны ровно два токена. Policy даёт им вероятности 0,9 и 0,1; замороженная reference — 0,25 и 0,75. Чему равна D_KL(policy || reference) в натах?
  explanation: 0,9·ln(0,9/0,25) + 0,1·ln(0,1/0,75) = 0,9·1,281 + 0,1·(−2,015) ≈ 1,153 − 0,201 ≈ 0,95. Второе слагаемое отрицательное, но сумма KL всегда неотрицательна и равна нулю только при полном совпадении распределений.
  kind: numeric
  answer: 0.95
  tolerance: 0.03
  id: 034-kl-meaning-1
  fingerprint: c2784cd0
- concept: вклад токена в D_KL(policy||reference) взвешен вероятностью policy, поэтому почти отброшенные policy токены влияют слабо
  question: Считается D_KL(policy || reference) по словарю. Какой токен даст наибольший вклад в это значение?
  explanation: 'Каждое слагаемое равно π(x)·ln(π(x)/π_ref(x)) — множитель π(x) берётся у policy. Вариант 1: 0,7·ln(350) ≈ 4,1. Вариант 2 весит всего 0,002 и даёт ≈ −0,012, несмотря на огромное расхождение. Совпадающие вероятности дают логарифм единицы, то есть ноль.'
  kind: choice
  options:
    - Токен с вероятностью 0,7 у policy и 0,002 у reference
    - Токен с вероятностью 0,002 у policy и 0,7 у reference
    - Токен с вероятностью 0,3 и у policy, и у reference
    - Токен, которому обе модели дают вероятность около 0,001
  correct: 0
  id: 034-kl-meaning-2
  fingerprint: 4b819cd4
- concept: KL асимметрична, и порядок аргументов задаёт, чьи вероятности служат весами при измерении отклонения
  question: Почему в KL-штрафе PPO важен именно порядок D_KL(policy || reference), а не обратный D_KL(reference || policy)? Объясни своими словами.
  explanation: 'Штраф должен контролировать фактическое поведение обучаемой модели, поэтому веса берутся у policy: отклонение измеряется вдоль тех траекторий, которые она действительно порождает.'
  kind: open
  reference: 'KL не симметрична: множитель перед логарифмом берётся у первого аргумента. В D_KL(policy||reference) веса задаёт policy, то есть штрафуются именно те продолжения, которые новая модель реально генерирует и которые при этом маловероятны для reference — а это и есть уход в зону, где reward-модель ненадёжна. Обратный порядок взвешивал бы по reference и штрафовал бы за то, что policy перестала использовать любимые reference варианты, даже если сама она туда никогда не ходит; расхождение на реально генерируемых токенах при этом могло бы остаться незамеченным.'
  id: 034-kl-meaning-3
  fingerprint: ae15ab15
