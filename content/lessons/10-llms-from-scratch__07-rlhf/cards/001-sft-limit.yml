- concept: обучающий сигнал SFT одинаков для всех примеров и не кодирует относительное предпочтение между двумя корректными ответами
  question: Два ответа модели на один и тот же запрос фактически верны и оба попали в датасет supervised fine-tuning. Почему такая тренировка не научит модель предпочитать более удачный из них?
  explanation: 'SFT — имитационное обучение: каждый пример независимо толкает модель повторять свой целевой текст. Пары ответов модель во время обучения не видит и победителя не выбирает. Метка «допустимый ответ» есть, метки «предпочтительнее» — нет.'
  kind: choice
  options:
    - SFT максимизирует правдоподобие каждого целевого ответа по отдельности, поэтому оба примера дают одинаковый по смыслу сигнал «воспроизводи это», и разметки «один лучше другого» в данных нет
    - SFT сравнивает оба ответа между собой, но усредняет их и выдаёт нечто среднее
    - SFT автоматически отбрасывает более длинный ответ, поэтому предпочтение вообще не нужно
    - SFT не может обучаться на нескольких ответах к одному запросу — датасет с такой парой некорректен
  correct: 0
  id: 001-sft-limit-1
  fingerprint: 03cfd4a0
- concept: ограничение SFT — не в неспособности породить хороший ответ, а в отсутствии сигнала о степени предпочтительности
  question: Какая формулировка точно описывает ограничение supervised fine-tuning при работе с несколькими корректными ответами?
  explanation: 'Ошибка не в мощности модели: удачный ответ она сгенерировать может. Ошибка в форме супервизии — бинарная «это годный образец» вместо порядковой «A лучше B». Поэтому для стабильного попадания в лучший вариант нужен человеческий выбор между ответами.'
  kind: choice
  options:
    - SFT способен породить удачный ответ, но его сигнал говорит лишь «ответ подходит», а не «насколько он предпочтительнее другого подходящего»
    - SFT в принципе не способен породить качественный ответ на открытый вопрос
    - SFT портит фактическую точность модели, поэтому качественные ответы после него встречаются реже
    - SFT работает только с одним эталонным ответом на запрос и ломается при большем числе
  correct: 0
  id: 001-sft-limit-2
  fingerprint: d0f325df
- concept: RLHF добавляет попарные человеческие предпочтения и обученную на них модель награды как источник ранжирующего сигнала
  question: Объясни своими словами, какие данные и какой дополнительный компонент вводит RLHF, чтобы решить задачу, с которой не справляется SFT.
  explanation: 'Три части ответа: попарные предпочтения людей, модель награды поверх них, RL-дообучение языковой модели по этой награде. Именно шаг сравнения даёт то, чего нет в наборе «правильных решений».'
  kind: open
  reference: 'RLHF собирает попарные сравнения: человеку показывают два ответа на один запрос и он отмечает предпочтительный. На этих сравнениях обучают модель награды (reward model), предсказывающую, какой ответ выберет человек, то есть выдающую скалярную оценку качества. Затем сигнал награды используют для дообучения языковой модели методом обучения с подкреплением, подталкивая её к выходам с более высокой оценкой. Ключевое отличие от SFT: супервизия ранжирующая (A лучше B), а не имитационная (повтори этот текст). Практический эффект показал InstructGPT: RLHF заметно поднял полезность, правдивость и безвредность, и оценщики предпочитали его ответы ответам исходной GPT-3 в подавляющем большинстве случаев, хотя модель была на два порядка меньше по числу параметров.'
  id: 001-sft-limit-3
  fingerprint: 813dfd0b
