- concept: стохастическое сэмплирование при генерации в PPO даёт разнообразие траекторий; жадное декодирование обнулило бы исследование
  question: Почему ответы в цикле PPO сэмплируют стохастически (например, при temperature 1.2), а не берут на каждом шаге самый вероятный токен?
  explanation: Температура регулирует остроту распределения перед np.random.choice. Слишком низкая — генерации почти детерминированы и однообразны; слишком высокая — ответы шумные, награды зашумлены, а KL относительно reference быстро растёт.
  kind: open
  reference: Обучение с подкреплением требует разных вариантов поведения, чтобы reward-модель могла отличить более удачные от менее удачных. Стохастическое сэмплирование даёт на одном промпте разные ответы с разными наградами, и обновление сдвигает вероятности в сторону тех, что оценены выше. Жадное декодирование при фиксированных весах вернуло бы один и тот же ответ, policy не увидела бы альтернатив, и сигнал сводился бы к подкреплению уже наиболее вероятного продолжения — исследование пространства ответов прекращается.
  id: 045-ppo-loop-3
  fingerprint: bbd5ecd6
