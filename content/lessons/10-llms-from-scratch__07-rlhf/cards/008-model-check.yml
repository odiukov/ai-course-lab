- concept: модель награды заморожена на стадии PPO, потому что внутри цикла нет новых человеческих меток — дообучение её на собственных генерациях policy замкнуло бы обратную связь на саму себя
  question: Инженер предлагает не замораживать модель награды во время PPO, а дообучать её прямо в цикле на ответах, которые генерирует policy. Объясни, почему это ломает обучение.
  explanation: 'Заморозка модели награды — не техническое удобство, а условие сопоставимости сигнала: без новых человеческих меток любое её обновление опирается на её же выход и превращает награду в самоподтверждающуюся величину.'
  kind: open
  reference: 'Модель награды — прокси человека, и её достоверность держится на попарных метках, размеченных людьми на второй стадии. Внутри PPO-цикла новых человеческих меток нет: есть только генерации самой policy и баллы, которые модель награды же и выставила. Дообучение на таком материале замыкает обратную связь — модель награды начинает подтверждать то, что policy уже производит, вместо независимого источника предпочтений. Отсюда две беды: сигнал перестаёт быть внешним якорем (оптимизировать становится нечего, кроме согласия модели с самой собой), и балл теряет сопоставимость между шагами обучения — рост награды больше не означает, что ответы стали лучше по человеческим критериям. Обновлять модель награды можно только собрав новую порцию человеческой разметки на свежих генерациях, и это отдельный проход второй стадии, а не часть PPO-шага.'
  id: 008-model-check-2
  fingerprint: 4e174645
