- concept: 'порядок превращения одной терминальной оценки в пошаговый сигнал: сначала полная генерация, затем оценка целого ответа, затем сравнение с ожиданием по позициям и обновление'
  question: Расставьте по порядку шаги, которыми одна оценка целого ответа превращается в направляющий сигнал для отдельных токенных решений.
  explanation: Награда доступна только после завершения ответа, поэтому оценка по позициям невозможна до конца генерации. Сначала полная траектория, потом один терминальный балл, и лишь затем его последствия разносятся назад по решениям, которые этот ответ создали.
  kind: order
  items:
    - Политика генерирует ответ целиком, накапливая траекторию токенных действий
    - Модель награды выставляет один скалярный балл всей паре «промпт — ответ»
    - Для каждой позиции итог сравнивается с результатом, ожидаемым из уже написанного к ней текста
    - Вероятность выбранного токена повышается при итоге лучше ожидания и понижается при худшем
  id: 030-sequence-reward-3
