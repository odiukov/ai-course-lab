- concept: направление обновления вероятности токена задаёт разность между фактическим итогом и ожидаемым из уже написанного префикса результатом
  question: Ответ получил от модели награды итоговый балл 3,5. Для позиции, где уже написан некоторый префикс, ожидаемый результат оценён в 2,0. Чему равна величина, по знаку которой PPO решает, повышать ли вероятность выбранного в этой позиции токена?
  explanation: '3,5 − 2,0 = 1,5 > 0: продолжение оказалось лучше ожидания из этого префикса, значит вероятность выбранного токена повышают. Была бы разность отрицательной — вероятность понижали бы. Без такого вычитания все токены удачного ответа считались бы одинаково удачными.'
  kind: numeric
  answer: 1.5
  tolerance: 0.01
  id: 030-sequence-reward-2
