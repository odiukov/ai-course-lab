- concept: объём человеческого труда на сбор предпочтений равен числу пар, умноженному на время одного сравнения
  question: 'Для обучения модели награды собирают набор попарных предпочтений: 9000 пар, на каждое сравнение разметчик тратит 6 минут. Сколько человеко-часов труда стоит этот набор?'
  explanation: '9000 × 6 = 54000 минут, делим на 60 — 900 человеко-часов. Та же арифметика даёт известную цифру InstructGPT: 33 000 сравнений по ~5 минут = 2750 человеко-часов только на данные для reward model.'
  kind: numeric
  answer: 900
  tolerance: 1
  id: 027-annotation-cost-1
  fingerprint: f618aa3e
- concept: увеличение числа разметчиков сокращает календарный срок, но не суммарный объём человеческого труда
  question: Сбор набора предпочтений оценён в 1440 человеко-часов. Изначально работу планировали отдать 24 разметчикам, но наняли 48. Что изменится?
  explanation: Человеко-час — сумма времени всех исполнителей, а не срок по календарю. Число пар и время на одну пару не изменились, значит 1440 человеко-часов никуда не делись; больше столов означает лишь меньше ожидания. В InstructGPT 2750 человеко-часов делились на 40 подрядчиков — примерно по 68,75 часа на каждого.
  kind: choice
  options:
    - 'Суммарный труд останется 1440 человеко-часов, а календарное ожидание сократится примерно вдвое: с 60 до 30 часов на человека'
    - Суммарный труд упадёт примерно до 720 человеко-часов, потому что работа распараллелена
    - 'И суммарный труд, и календарный срок останутся прежними: разметчики будут мешать друг другу'
    - Суммарный труд вырастет вдвое, так как каждую пару теперь размечают двое
  correct: 0
