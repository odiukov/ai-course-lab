- concept: стоимость набора предпочтений упирается в человеческое время и не масштабируется добавлением вычислительных ресурсов
  question: Проект по RLHF отстаёт от графика. Объясни своими словами, почему закупка дополнительных GPU ускорит обучение модели награды, но не сделает дешевле сам набор попарных предпочтений.
  explanation: 'Ключевое различие — что масштабируется железом, а что нет. Попарное сравнение проще абсолютной оценки, но не мгновенно: десятки тысяч решений складываются в тысячи человеко-часов (у OpenAI — 2750 на 33 000 пар).'
  kind: open
  reference: 'Обучение — вычислительная задача: те же данные можно прогнать быстрее на большем количестве машин. Сбор предпочтений — человеческая: каждую пару должен прочитать и оценить человек, и суммарный труд равен числу пар, умноженному на время одного решения. Машины эту работу не выполняют, поэтому ускорить её можно только наняв больше людей (что сокращает календарный срок, но не объём труда), уменьшив число пар или время на пару. Отсюда вывод: набор пар предпочтений — самостоятельный дорогой ресурс, а не бесплатный побочный продукт конвейера; его берегут и переиспользуют.'
  id: 027-annotation-cost-3
  fingerprint: 955d137e
