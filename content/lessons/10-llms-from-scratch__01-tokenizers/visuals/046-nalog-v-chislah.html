<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Одинаковый смысл — разный токенный бюджет</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: white;
      --surface: whitesmoke;
      --panel: white;
      --track: gainsboro;
      --ink: midnightblue;
      --muted: slategray;
      --line: lightsteelblue;
      --english: royalblue;
      --english-edge: midnightblue;
      --korean: darkorange;
      --korean-edge: saddlebrown;
      --price-bg: linen;
      --history-bg: aliceblue;
      --badge-price: darkorange;
      --badge-history: royalblue;
      --badge-text: white;
      --equal-bg: lavender;
      --equal-line: mediumpurple;
      --error: firebrick;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: black;
        --surface: darkslategray;
        --panel: black;
        --track: dimgray;
        --ink: whitesmoke;
        --muted: lightgray;
        --line: slategray;
        --english: cornflowerblue;
        --english-edge: lightskyblue;
        --korean: orange;
        --korean-edge: moccasin;
        --price-bg: darkslategray;
        --history-bg: midnightblue;
        --badge-price: darkorange;
        --badge-history: royalblue;
        --badge-text: white;
        --equal-bg: indigo;
        --equal-line: plum;
        --error: lightcoral;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: unset;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Arial, sans-serif;
    }

    .figure {
      width: 100%;
      background: var(--page);
      overflow: hidden;
    }

    .heading {
      margin: unset;
      padding: 10px 14px 8px;
      font-size: 22px;
      font-weight: 750;
      text-align: center;
      color: var(--ink);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 440px;
      background: var(--surface);
    }

    .frame {
      fill: var(--surface);
    }

    .panel {
      fill: var(--panel);
      stroke: var(--line);
      stroke-width: 2px;
    }

    .price-panel {
      fill: var(--price-bg);
    }

    .history-panel {
      fill: var(--history-bg);
    }

    .track {
      fill: var(--track);
      stroke: var(--line);
      stroke-width: 1px;
    }

    .token-english {
      fill: var(--english);
      stroke: var(--english-edge);
      stroke-width: 1px;
    }

    .token-korean {
      fill: var(--korean);
      stroke: var(--korean-edge);
      stroke-width: 1px;
    }

    .equal-box {
      fill: var(--equal-bg);
      stroke: var(--equal-line);
      stroke-width: 2px;
    }

    .connector,
    .divider {
      fill: none;
      stroke: var(--line);
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .connector {
      stroke: var(--equal-line);
    }

    .arrowhead {
      fill: var(--equal-line);
    }

    .badge-price {
      fill: var(--badge-price);
    }

    .badge-history {
      fill: var(--badge-history);
    }

    text {
      fill: var(--ink);
    }

    .equal-text {
      font-size: 18px;
      font-weight: 750;
    }

    .language {
      font-size: 15px;
      font-weight: 750;
      fill: var(--muted);
      letter-spacing: 0.04em;
    }

    .sentence {
      font-size: 17px;
      font-weight: 650;
    }

    .count {
      font-size: 18px;
      font-weight: 800;
    }

    .comparison {
      font-size: 16px;
      font-weight: 700;
      fill: var(--muted);
    }

    .section-label {
      font-size: 15px;
      font-weight: 750;
      fill: var(--muted);
      letter-spacing: 0.03em;
    }

    .panel-title {
      font-size: 19px;
      font-weight: 800;
    }

    .badge-text {
      fill: var(--badge-text);
      font-size: 25px;
      font-weight: 850;
    }

    .effect {
      font-size: 18px;
      font-weight: 800;
    }

    .detail {
      font-size: 15px;
      fill: var(--muted);
    }

    .fallback {
      margin: unset;
      padding: 18px;
      color: var(--error);
      font-size: 17px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="figure" aria-labelledby="diagram-title">
    <h1 class="heading" id="diagram-title">Одинаковый смысл — разный токенный бюджет</h1>

    <svg
      id="diagram"
      viewBox="0 0 1000 440"
      width="1000"
      height="440"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description"
    >
      <title id="svg-title">Сравнение токенного бюджета английского и корейского предложений</title>
      <desc id="svg-description">
        Одинаковая просьба занимает 10 токенов по-английски и 25 токенов
        по-корейски. Цена возрастает в 2,5 раза, а доступная история диалога
        сокращается в 2,5 раза.
      </desc>
    </svg>

    <p class="fallback" id="fallback" hidden>
      Схема должна была показать: одинаковая просьба занимает 10 токенов
      по-английски и 25 по-корейски; цена получается в 2,5 раза выше,
      а доступная история диалога — в 2,5 раза меньше.
    </p>
  </main>

  <script>
    const DATA = {
      frame: { x: -4, y: -2, w: 100, h: 44 },
      equal: {
        box: { x: 34, y: 1, w: 28, h: 4.4, r: 1.2 },
        label: { x: 48, y: 3.8, text: "ОДИНАКОВЫЙ СМЫСЛ" },
        branches: [
          { x1: 40, y1: 5.4, x2: 18, y2: 7.1 },
          { x1: 56, y1: 5.4, x2: 18, y2: 17.1 }
        ]
      },
      rows: [
        {
          language: "АНГЛИЙСКИЙ",
          sentence: "Please reset my password.",
          tokens: 10,
          languageAt: { x: 3, y: 9.3 },
          sentenceAt: { x: 3, y: 12.1 },
          track: { x: 29, y: 8.1, w: 52, h: 4.4, r: 0.8 },
          bar: { x: 30, y: 8.6, step: 2, w: 1.65, h: 3.4, r: 0.25 },
          countAt: { x: 91.5, y: 11.4 },
          count: "10 токенов",
          className: "token-english"
        },
        {
          language: "КОРЕЙСКИЙ",
          sentence: "비밀번호를 재설정해 주세요.",
          tokens: 25,
          languageAt: { x: 3, y: 19.3 },
          sentenceAt: { x: 3, y: 22.1 },
          track: { x: 29, y: 18.1, w: 52, h: 4.4, r: 0.8 },
          bar: { x: 30, y: 18.6, step: 2, w: 1.65, h: 3.4, r: 0.25 },
          countAt: { x: 91.5, y: 21.4 },
          count: "25 токенов",
          className: "token-korean"
        }
      ],
      comparison: {
        at: { x: 48, y: 25.6 },
        text: "Смысл тот же — последовательность длиннее",
        divider: { x1: 3, y1: 27.3, x2: 93, y2: 27.3 },
        sectionAt: { x: 48, y: 29.2 },
        section: "ПОСЛЕДСТВИЯ ПРИ ТОМ ЖЕ ЛИМИТЕ И ТАРИФЕ"
      },
      panels: [
        {
          className: "price-panel",
          box: { x: 3, y: 30.4, w: 43.5, h: 9.7, r: 1.2 },
          titleAt: { x: 6, y: 33.2 },
          title: "Цена",
          badgeClass: "badge-price",
          badge: { x: 6, y: 34.2, w: 14.5, h: 4.2, r: 1 },
          badgeAt: { x: 13.25, y: 37.3 },
          badgeText: "×2,5",
          effectAt: { x: 23, y: 36.1 },
          effect: "выше",
          detailAt: { x: 23, y: 38.2 },
          detail: "при оплате за токены"
        },
        {
          className: "history-panel",
          box: { x: 49.5, y: 30.4, w: 43.5, h: 9.7, r: 1.2 },
          titleAt: { x: 52.5, y: 33.2 },
          title: "Доступная история",
          badgeClass: "badge-history",
          badge: { x: 52.5, y: 34.2, w: 14.5, h: 4.2, r: 1 },
          badgeAt: { x: 59.75, y: 37.3 },
          badgeText: "÷2,5",
          effectAt: { x: 69.5, y: 36.1 },
          effect: "меньше",
          detailAt: { x: 69.5, y: 38.2 },
          detail: "сообщений помещается в окно"
        }
      ],
      arrow: {
        line: { x1: 48, y1: 26.2, x2: 48, y2: 28.2 },
        head: [
          { x: 47.35, y: 27.55 },
          { x: 48, y: 28.35 },
          { x: 48.65, y: 27.55 }
        ]
      }
    };

    const origin = { x: 40, y: 20 };
    const scale = { x: 10, y: 10 };

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const LABEL_PADDING = 8;
    const LINE_WIDTH = 2;
    const BASE_FONT_SIZE = 16;
    const CANVAS = { width: 1000, height: 440 };

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");

      const node = (tag, attrs, className) => {
        const element = document.createElementNS(svg.namespaceURI, tag);
        Object.entries(attrs).forEach(([name, value]) => {
          element.setAttribute(name, String(value));
        });
        if (className) element.setAttribute("class", className);
        return element;
      };

      const add = element => {
        svg.appendChild(element);
        return element;
      };

      const rect = (box, className) => add(node("rect", {
        x: sx(box.x),
        y: sy(box.y),
        width: sx(box.x + box.w) - sx(box.x),
        height: sy(box.y + box.h) - sy(box.y),
        rx: sx(box.x + box.r) - sx(box.x),
        ry: sy(box.y + box.r) - sy(box.y)
      }, className));

      const line = (segment, className) => add(node("line", {
        x1: sx(segment.x1),
        y1: sy(segment.y1),
        x2: sx(segment.x2),
        y2: sy(segment.y2)
      }, className));

      const polygon = (points, className) => add(node("polygon", {
        points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" ")
      }, className));

      const label = (at, content, className, anchor = "start") => {
        const element = add(node("text", {
          x: sx(at.x),
          y: sy(at.y),
          "text-anchor": anchor
        }, className));
        element.textContent = content;
        return element;
      };

      rect(DATA.frame, "frame");
      rect(DATA.equal.box, "equal-box");
      label(DATA.equal.label, DATA.equal.label.text, "equal-text", "middle");

      DATA.equal.branches.forEach(branch => line(branch, "connector"));

      DATA.rows.forEach(row => {
        label(row.languageAt, row.language, "language", "start");
        label(row.sentenceAt, row.sentence, "sentence", "start");
        rect(row.track, "track");

        Array.from({ length: row.tokens }).forEach((unused, index) => {
          rect({
            x: row.bar.x + index * row.bar.step,
            y: row.bar.y,
            w: row.bar.w,
            h: row.bar.h,
            r: row.bar.r
          }, row.className);
        });

        label(row.countAt, row.count, "count", "end");
      });

      label(
        DATA.comparison.at,
        DATA.comparison.text,
        "comparison",
        "middle"
      );
      line(DATA.comparison.divider, "divider");
      line(DATA.arrow.line, "connector");
      polygon(DATA.arrow.head, "arrowhead");
      label(
        DATA.comparison.sectionAt,
        DATA.comparison.section,
        "section-label",
        "middle"
      );

      DATA.panels.forEach(panel => {
        rect(panel.box, `panel ${panel.className}`);
        label(panel.titleAt, panel.title, "panel-title", "start");
        rect(panel.badge, panel.badgeClass);
        label(panel.badgeAt, panel.badgeText, "badge-text", "middle");
        label(panel.effectAt, panel.effect, "effect", "start");
        label(panel.detailAt, panel.detail, "detail", "start");
      });

      svg.setAttribute("stroke-width", String(LINE_WIDTH));
      svg.setAttribute("font-size", String(BASE_FONT_SIZE));
      svg.setAttribute("data-label-padding", String(LABEL_PADDING));
      svg.setAttribute(
        "viewBox",
        `${sx(DATA.frame.x)} ${sy(DATA.frame.y)} ${CANVAS.width} ${CANVAS.height}`
      );
      fallback.hidden = true;
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      if (svg) svg.hidden = true;
      if (fallback) fallback.hidden = false;
    }
  </script>
</body>
</html>
