<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Три способа разбить слово unhappiness</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fc;
      --panel: #ffffff;
      --panel-soft: #f1f4fa;
      --ink: #172033;
      --muted: #5d687c;
      --line: #8b96aa;
      --word-fill: #e9efff;
      --word-stroke: #5577d1;
      --word-ink: #173b8f;
      --risk-fill: #fff0ef;
      --risk-stroke: #d95b55;
      --risk-strong: #c9433d;
      --risk-chip: #ffffff;
      --long-fill: #fff7e8;
      --long-stroke: #d89225;
      --long-strong: #b66e00;
      --long-chip: #ffffff;
      --good-fill: #eaf8ef;
      --good-stroke: #3f9b62;
      --good-strong: #287d49;
      --good-chip: #ffffff;
      --shadow: #dfe4ee;
      --fallback: #fff0ef;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #11151d;
        --panel: #191f2a;
        --panel-soft: #222a38;
        --ink: #eef2f8;
        --muted: #b2bccd;
        --line: #778399;
        --word-fill: #1f315c;
        --word-stroke: #7d9df0;
        --word-ink: #dbe5ff;
        --risk-fill: #3b2427;
        --risk-stroke: #ef7772;
        --risk-strong: #ff8f89;
        --risk-chip: #271c20;
        --long-fill: #3a2d19;
        --long-stroke: #e8a949;
        --long-strong: #ffc267;
        --long-chip: #271f15;
        --good-fill: #1d3528;
        --good-stroke: #69bd85;
        --good-strong: #8bd5a4;
        --good-chip: #18281f;
        --shadow: #0b0e14;
        --fallback: #3b2427;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: unset;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    figure {
      margin: unset;
      background: var(--panel);
      border: 1px solid var(--shadow);
      overflow: hidden;
    }

    figcaption {
      padding: 12px 20px;
      border-bottom: 1px solid var(--shadow);
      background: var(--panel-soft);
      color: var(--ink);
      font-size: 18px;
      font-weight: bold;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 460px;
      background: var(--page);
    }

    .scene-bg {
      fill: var(--page);
    }

    .outer-frame {
      fill: var(--panel);
      stroke: var(--shadow);
      stroke-width: 2px;
    }

    .connector {
      fill: none;
      stroke: var(--line);
      stroke-width: 3px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arrow {
      fill: var(--line);
    }

    .word-box {
      fill: var(--word-fill);
      stroke: var(--word-stroke);
      stroke-width: 2px;
    }

    .hub-box {
      fill: var(--panel-soft);
      stroke: var(--line);
      stroke-width: 2px;
    }

    .risk-card {
      fill: var(--risk-fill);
      stroke: var(--risk-stroke);
      stroke-width: 2px;
    }

    .long-card {
      fill: var(--long-fill);
      stroke: var(--long-stroke);
      stroke-width: 2px;
    }

    .good-card {
      fill: var(--good-fill);
      stroke: var(--good-stroke);
      stroke-width: 3px;
    }

    .risk-chip {
      fill: var(--risk-chip);
      stroke: var(--risk-stroke);
      stroke-width: 2px;
    }

    .long-chip {
      fill: var(--long-chip);
      stroke: var(--long-stroke);
      stroke-width: 1px;
    }

    .good-chip {
      fill: var(--good-chip);
      stroke: var(--good-stroke);
      stroke-width: 2px;
    }

    .risk-badge {
      fill: var(--risk-strong);
    }

    .long-badge {
      fill: var(--long-strong);
    }

    .good-badge,
    .good-pill {
      fill: var(--good-strong);
    }

    .divider {
      stroke: var(--risk-stroke);
      stroke-width: 1px;
      stroke-dasharray: 5 5;
    }

    text {
      fill: var(--ink);
      font-family: inherit;
    }

    .word-text {
      fill: var(--word-ink);
      font-size: 28px;
      font-weight: bold;
    }

    .hub-text {
      font-size: 15px;
      font-weight: bold;
    }

    .card-title {
      font-size: 18px;
      font-weight: bold;
    }

    .token-text {
      font-size: 16px;
      font-weight: bold;
    }

    .letter-text {
      font-size: 15px;
      font-weight: bold;
    }

    .plus-text {
      fill: var(--good-strong);
      font-size: 20px;
      font-weight: bold;
    }

    .note-text {
      fill: var(--muted);
      font-size: 14px;
    }

    .footer-text {
      font-size: 14px;
      font-weight: bold;
    }

    .badge-text {
      fill: #ffffff;
      font-size: 16px;
      font-weight: bold;
    }

    .pill-text {
      fill: #ffffff;
      font-size: 14px;
      font-weight: bold;
    }

    #fallback {
      padding: 18px 22px;
      background: var(--fallback);
      color: var(--ink);
      font-size: 16px;
    }

    #fallback[hidden] {
      display: none;
    }

    noscript {
      display: block;
      padding: 18px 22px;
      background: var(--fallback);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title">
    <figcaption id="diagram-title">Три способа разбить слово <code>unhappiness</code></figcaption>
    <svg
      id="diagram"
      viewBox="0 0 1120 460"
      width="1120"
      height="460"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-label="Сравнение пословной, посимвольной и subword-токенизации слова unhappiness"
    ></svg>
    <div id="fallback" hidden>
      Схема должна была показать: целое <code>unhappiness</code> даёт 1 токен
      или <code>[UNK]</code>, разбиение по буквам — 11 токенов, а
      <code>un</code> + <code>happi</code> + <code>ness</code> — 3 токена.
    </div>
    <noscript>
      Схема: <code>unhappiness</code> — 1 токен или <code>[UNK]</code>;
      11 посимвольных токенов; 3 subword-токена:
      <code>un</code>, <code>happi</code>, <code>ness</code>.
    </noscript>
  </figure>

  <script>
    const canvasData = [1120, 460];
    const originData = [0, 0];
    const scaleData = [1, 1];

    const rectangleData = [
      [0, 0, 1120, 460, 0, "scene-bg"],
      [12, 10, 1096, 438, 18, "outer-frame"],
      [390, 22, 340, 62, 18, "word-box"],
      [465, 108, 190, 42, 14, "hub-box"],
      [25, 190, 340, 248, 18, "risk-card"],
      [390, 190, 340, 248, 18, "long-card"],
      [755, 190, 340, 248, 18, "good-card"],
      [301, 204, 44, 28, 12, "risk-badge"],
      [666, 204, 44, 28, 12, "long-badge"],
      [1031, 204, 44, 28, 12, "good-badge"],
      [53, 249, 284, 42, 12, "risk-chip"],
      [130, 365, 130, 42, 12, "risk-chip"],
      [414, 258, 20, 36, 7, "long-chip"],
      [440, 258, 20, 36, 7, "long-chip"],
      [466, 258, 20, 36, 7, "long-chip"],
      [492, 258, 20, 36, 7, "long-chip"],
      [518, 258, 20, 36, 7, "long-chip"],
      [544, 258, 20, 36, 7, "long-chip"],
      [570, 258, 20, 36, 7, "long-chip"],
      [596, 258, 20, 36, 7, "long-chip"],
      [622, 258, 20, 36, 7, "long-chip"],
      [648, 258, 20, 36, 7, "long-chip"],
      [674, 258, 20, 36, 7, "long-chip"],
      [782, 258, 72, 42, 12, "good-chip"],
      [880, 258, 98, 42, 12, "good-chip"],
      [1004, 258, 72, 42, 12, "good-chip"],
      [835, 384, 180, 32, 13, "good-pill"]
    ];

    const polylineData = [
      ["connector", [[560, 84], [560, 108]]],
      ["connector", [[560, 150], [560, 166], [195, 166], [195, 190]]],
      ["connector", [[560, 150], [560, 190]]],
      ["connector", [[560, 150], [560, 166], [925, 166], [925, 190]]]
    ];

    const polygonData = [
      ["arrow", [[195, 190], [187, 178], [203, 178]]],
      ["arrow", [[560, 190], [552, 178], [568, 178]]],
      ["arrow", [[925, 190], [917, 178], [933, 178]]]
    ];

    const lineData = [
      [53, 329, 337, 329, "divider"]
    ];

    const textData = [
      [560, 62, "word-text", "middle", "unhappiness"],
      [560, 135, "hub-text", "middle", "выбери режим резки"],

      [47, 224, "card-title", "start", "Целое слово"],
      [323, 224, "badge-text", "middle", "1"],
      [195, 277, "token-text", "middle", "unhappiness"],
      [195, 315, "note-text", "middle", "если токен есть в словаре"],
      [195, 352, "note-text", "middle", "если слова в словаре нет"],
      [195, 393, "token-text", "middle", "[UNK]"],
      [195, 424, "footer-text", "middle", "написание слова теряется"],

      [412, 224, "card-title", "start", "По символам"],
      [688, 224, "badge-text", "middle", "11"],
      [424, 283, "letter-text", "middle", "u"],
      [450, 283, "letter-text", "middle", "n"],
      [476, 283, "letter-text", "middle", "h"],
      [502, 283, "letter-text", "middle", "a"],
      [528, 283, "letter-text", "middle", "p"],
      [554, 283, "letter-text", "middle", "p"],
      [580, 283, "letter-text", "middle", "i"],
      [606, 283, "letter-text", "middle", "n"],
      [632, 283, "letter-text", "middle", "e"],
      [658, 283, "letter-text", "middle", "s"],
      [684, 283, "letter-text", "middle", "s"],
      [560, 327, "note-text", "middle", "работает даже для редких слов"],
      [560, 365, "note-text", "middle", "каждая буква — отдельный токен"],
      [560, 407, "footer-text", "middle", "последовательность становится длинной"],

      [777, 224, "card-title", "start", "По частям"],
      [1053, 224, "badge-text", "middle", "3"],
      [818, 285, "token-text", "middle", "un"],
      [867, 285, "plus-text", "middle", "+"],
      [929, 285, "token-text", "middle", "happi"],
      [991, 285, "plus-text", "middle", "+"],
      [1040, 285, "token-text", "middle", "ness"],
      [925, 327, "note-text", "middle", "части собираются в исходное слово"],
      [925, 365, "footer-text", "middle", "точное написание без [UNK]"],
      [925, 406, "pill-text", "middle", "компромисс"]
    ];

    const [canvasWidth, canvasHeight] = canvasData;
    const [originX, originY] = originData;
    const [scaleX, scaleY] = scaleData;
    const origin = Object.freeze({ x: originX, y: originY });
    const scale = Object.freeze({ x: scaleX, y: scaleY });

    const sx = (x) => origin.x + x * scale.x;
    const sy = (y) => origin.y + y * scale.y;

    try {
      const svg = document.querySelector("#diagram");
      const fallback = document.querySelector("#fallback");
      const namespace = "http://www.w3.org/2000/svg";

      const node = (name, attributes) => {
        const element = document.createElementNS(namespace, name);
        for (const [key, value] of Object.entries(attributes)) {
          element.setAttribute(key, value);
        }
        return element;
      };

      const fragment = document.createDocumentFragment();

      for (const [x, y, width, height, radius, className] of rectangleData) {
        fragment.append(
          node("rect", {
            x: sx(x),
            y: sy(y),
            width: sx(width) - sx(originX),
            height: sy(height) - sy(originY),
            rx: sx(radius) - sx(originX),
            ry: sy(radius) - sy(originY),
            class: className
          })
        );
      }

      for (const [className, points] of polylineData) {
        fragment.append(
          node("polyline", {
            points: points.map(([x, y]) => `${sx(x)},${sy(y)}`).join(" "),
            class: className
          })
        );
      }

      for (const [className, points] of polygonData) {
        fragment.append(
          node("polygon", {
            points: points.map(([x, y]) => `${sx(x)},${sy(y)}`).join(" "),
            class: className
          })
        );
      }

      for (const [x1, y1, x2, y2, className] of lineData) {
        fragment.append(
          node("line", {
            x1: sx(x1),
            y1: sy(y1),
            x2: sx(x2),
            y2: sy(y2),
            class: className
          })
        );
      }

      for (const [x, y, className, anchor, content] of textData) {
        const label = node("text", {
          x: sx(x),
          y: sy(y),
          class: className,
          "text-anchor": anchor,
          "dominant-baseline": "alphabetic"
        });
        label.textContent = content;
        fragment.append(label);
      }

      svg.setAttribute("viewBox", `${sx(originX)} ${sy(originY)} ${sx(canvasWidth)} ${sy(canvasHeight)}`);
      svg.append(fragment);
      fallback.hidden = true;
    } catch (error) {
      const svg = document.querySelector("#diagram");
      const fallback = document.querySelector("#fallback");
      if (svg) svg.hidden = true;
      if (fallback) fallback.hidden = false;
    }
  </script>
</body>
</html>
