- concept: число параметров матрицы эмбеддингов равно произведению размера словаря на размерность вектора
  question: Модель с размерностью скрытого состояния 2048 использует токенизатор со словарём в 65536 токенов. Сколько миллионов параметров занимает одна только матрица эмбеддингов? Ответ в миллионах.
  explanation: '65536 × 2048 = 134 217 728 ≈ 134 млн параметров. Матрица эмбеддингов хранит по вектору на каждую запись словаря, поэтому её размер линеен по размеру словаря: удвоение словаря удваивает эту часть модели, ещё до всяких слоёв. Именно поэтому выбор токенизатора — архитектурное решение с прямой ценой в параметрах.'
  kind: numeric
  answer: 134.2
  tolerance: 1.5
  id: 036-razmer-vocabulary-1
  fingerprint: b3ad0c89
- concept: маленький словарь лучше кодирует редкие слова, потому что дробит их на переиспользуемые части, у каждой из которых много обучающих примеров
  question: 'Два токенизатора обучены на одном корпусе: A на 8192 токена, B на 262144. В тестовом тексте много редких терминов и фамилий. Что вероятнее для этих редких слов?'
  explanation: 'Большой словарь тратит слоты на длинные редкие фрагменты. Такой токен получает собственный эмбеддинг, но за обучение видит мало примеров и остаётся плохо выученным. Маленький словарь вместо этого собирает редкое слово из кусков, каждый из которых встречался тысячи раз в других словах. Отсюда и промах варианта 2: subword-словарь любого размера кодирует произвольное слово без [UNK].'
  kind: choice
  options:
    - A разложит их на частотные куски, которые модель хорошо изучила; B чаще даст им отдельные токены, встречавшиеся при обучении очень редко
    - A выдаст для них [UNK], потому что маленький словарь не покрывает редкие слова
    - B разложит их мельче, потому что большой словарь хранит больше коротких токенов
    - Оба токенизатора дадут одинаковые разбиения, так как корпус один и тот же
  correct: 0
  id: 036-razmer-vocabulary-2
  fingerprint: 6742feef
- concept: 'размер словаря перераспределяет фиксированный бюджет: платить либо за длину последовательностей, либо за число типов, которые модель должна различать и хранить'
  question: 'Коллега предлагает: «Больший словарь всегда лучше — текст сжимается, значит меньше вычислений». Объясни своими словами, за что при этом приходится платить и почему это решение принимают вместе с архитектурой модели.'
  explanation: 'Ключ: это не шкала «лучше/хуже», а выбор, где платить — за обработку большего числа токенов или за поддержку большего числа их типов. Оба конца шкалы расходуют один и тот же ограниченный бюджет модели.'
  kind: open
  reference: 'Сжатие не бесплатное. Большой словарь сокращает число токенов на текст (меньше forward-проходов при генерации, больше текста влезает в контекст), но требует: (1) матрицы эмбеддингов и выходного слоя размером vocab × d_model — рост словаря линейно добавляет сотни миллионов параметров, которые не идут на глубину или ширину сети; (2) различать больше типов, причём длинный хвост редких токенов получает мало обучающих примеров и остаётся слабо выученным. Маленький словарь платит противоположной валютой: длинные последовательности, больше шагов на тот же текст, но компактные и хорошо изученные переиспользуемые части. Решение принимают вместе с архитектурой, потому что оно задаёт и типичную длину входов, и долю параметрического бюджета, уходящую в таблицу эмбеддингов, а не в слои.'
  id: 036-razmer-vocabulary-3
  fingerprint: c8a2b2a3
