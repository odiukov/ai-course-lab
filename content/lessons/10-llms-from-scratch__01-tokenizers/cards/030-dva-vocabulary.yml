- concept: 'расхождение словарей накапливается: каждый выбранный merge меняет статистику корпуса и набор кандидатов следующего раунда'
  question: BPE и WordPiece обучают на одном корпусе с одинаковым лимитом словаря. Расставь по порядку то, что превращает одно расхождение в раунде в два разных словаря.
  explanation: 'Разница не остаётся локальной. Обучение обоих алгоритмов рекурсивно: после склейки корпус пересегментирован, и следующие подсчёты идут уже по другой картине. Один разошедшийся раунд запускает две разные цепочки обучения, поэтому итоговые словари отличаются не одним токеном, а накопленной историей merges.'
  kind: order
  items:
    - Оба алгоритма считают одни и те же соседства по одному корпусу
    - Каждый оценивает кандидатов по своей формуле и выбирает разных победителей раунда
    - В словари добавляются разные новые токены, и сегментация корпуса перестраивается по-разному
    - Пересчёт даёт уже разные частоты пар и разные множества кандидатов на следующий раунд
    - К моменту исчерпания лимита словаря списки токенов расходятся по большинству позиций
  id: 030-dva-vocabulary-1
  fingerprint: 1c5fb788
- concept: 'ограниченный размер словаря делает кандидатов конкурентами за места: занятый слот не достанется другому кандидату'
  question: Два токенизатора обучены на одном корпусе с лимитом 8192 токена, но по разным критериям выбора merge. Почему сильный по одному критерию кусок может вообще не попасть во второй словарь?
  explanation: Размер словаря — бюджет. При лимите 8192 совершается фиксированное число добавлений, и кандидаты соревнуются за них. Кусок, который по одному критерию попал бы в словарь на раннем раунде, по другому критерию может проигрывать каждый раунд и не войти вовсе — не потому что он непредставим, а потому что места кончились.
  kind: choice
  options:
    - Число мест в словаре фиксировано, и каждый добавленный токен занимает место, которое уже не достанется конкуренту
    - Второй алгоритм физически не способен представить такую пару символов
    - Токены с низкой частотой запрещены спецификацией формата словаря
    - Второй алгоритм отбрасывает все куски длиннее двух символов
  correct: 0
  id: 030-dva-vocabulary-2
  fingerprint: 0c7f2524
- concept: префикс продолжения у WordPiece маркирует позицию куска внутри слова и не влияет на выбор merges
  question: В WordPiece куски, продолжающие слово, помечаются специальным префиксом. Как эта пометка соотносится с тем, что словарь WordPiece отличается от BPE-словаря на том же корпусе?
  explanation: 'Префикс продолжения — служебная разметка позиции: он говорит, что кусок не начинает слово. На процедуру отбора merges он не влияет. Причина разных словарей другая — WordPiece оценивает пару нормированно, count(AB)/(count(A)*count(B)), а BPE смотрит на голую частоту count(A,B), и эти решения накапливаются через всю историю обучения.'
  kind: choice
  options:
    - Пометка только фиксирует позицию куска внутри слова; расхождение словарей вызвано разными критериями выбора merges
    - 'Пометка сама и есть причина расхождения: она удваивает число вариантов каждого куска'
    - Пометка задаёт приоритет пар при подсчёте частот, поэтому побеждают другие merges
    - Пометка запрещает склеивать куски, начинающиеся с гласной, что и меняет словарь
  correct: 0
  id: 030-dva-vocabulary-3
  fingerprint: bb1eff45
