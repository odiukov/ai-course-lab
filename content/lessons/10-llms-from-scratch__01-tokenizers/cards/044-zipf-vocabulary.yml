- concept: нулевой счётчик токена означает отсутствие в конкретной выборке, а не бесполезность токена в словаре
  question: Инженер прогнал 20 тестовых текстов через свой byte-level BPE-токенизатор со словарём 800 токенов и обнаружил, что 340 токенов не встретились ни разу. Он предлагает удалить их, чтобы уменьшить матрицу эмбеддингов. Что не так с таким выводом?
  explanation: 'Частотный счётчик измеряет использование на выбранных текстах, а не ценность токена во всех возможных входах. Удаление ''неиспользованных'' единиц отрезает покрытие редких слов, а удаление базовых байтов вообще ломает способность закодировать произвольный текст. Даже гигантская выборка не задействует весь словарь: распределение частот сильно неравномерное, длинный хвост остаётся редким по своей природе.'
  kind: choice
  options:
    - 'Счётчик показывает лишь покрытие этой выборки: неиспользованные токены нужны для слов, имён и написаний вне неё, а базовые байты обеспечивают кодирование любого входа'
    - 'Ничего: токен с нулевой частотой в тесте по определению никогда не встретится и на других данных, поэтому его безопасно удалять'
    - Удалять нельзя только потому, что после удаления сдвинутся ID остальных токенов, а сами токены действительно лишние
    - 'Проблема лишь в размере выборки: при 800 текстах вместо 20 неиспользованных токенов не осталось бы вообще'
  correct: 0
  id: 044-zipf-vocabulary-1
  fingerprint: 5b90fcbf
- concept: число неиспользованных токенов считается по различным ID в выборке, а не по числу вхождений токенов
  question: Словарь токенизатора содержит 1200 токенов. На тестовом наборе получилось 58000 вхождений токенов, среди них 431 различный ID. Сколько токенов словаря окажется в списке неиспользованных?
  explanation: 'Неиспользованные = размер словаря минус число РАЗЛИЧНЫХ встретившихся ID: 1200 − 431 = 769. Общее число вхождений (58000) тут ни при чём — один частый токен даёт тысячи вхождений, но занимает одну запись словаря. Путаница типов и вхождений — самая частая ошибка при чтении такой статистики.'
  kind: numeric
  answer: 769
  tolerance: 0.5
  id: 044-zipf-vocabulary-2
  fingerprint: ff9d7492
- concept: высокая доля неиспользованных токенов на большой репрезентативной выборке — сигнал несоответствия домена обучения домену применения
  question: 'Объясни своими словами: при каких условиях длинный список неиспользованных токенов перестаёт быть нормой и становится диагностическим сигналом? Что именно он тогда сообщает и чем это следует подтвердить?'
  explanation: Один прогон не выносит приговор словарю — он показывает, для какой речи словарь работает. Диагностическая ценность появляется только при репрезентативной выборке, и проверять её надо метрикой того ограничения, которое волнует (длина последовательностей на целевых текстах), а не самим числом неиспользованных.
  kind: open
  reference: 'Сигналом список становится, когда выборка достаточно большая и репрезентативна для реальных запросов, а доля неиспользованных всё равно высока. Тогда это указывает не на редкость отдельных единиц, а на возможное несоответствие домена: словарь обучали на одном корпусе (например, новостях), а применяют к другому (медицинским заметкам), и выученные объединения не срабатывают. Подтверждать нужно метриками эффективности на целевом домене — fertility (токенов на слово) и коэффициентом сжатия относительно словаря, обученного на этом домене. На маленькой или нетипичной выборке вывод неправомерен: там нулевые счётчики ожидаемы из-за неравномерного распределения частот.'
  id: 044-zipf-vocabulary-3
  fingerprint: 7e3cee84
