- concept: 'Unigram строит словарь отсечением: стартует с избыточного набора и последовательно удаляет токены с минимальным вкладом в правдоподобие'
  question: Расставь шаги обучения Unigram-модели в правильном порядке.
  explanation: 'Unigram — обратное движение относительно BPE: BPE стартует с минимального набора и сливает пары вверх, Unigram стартует с большого словаря и режет вниз, каждый раз убирая наименее полезные записи. Критерий — общее правдоподобие корпуса, а не частота пары. На этом устроен токенизатор T5.'
  kind: order
  items:
    - Собрать заведомо избыточный стартовый словарь кандидатов
    - Оценить, насколько падает правдоподобие корпуса при удалении каждого токена
    - Выбросить токены с наименьшим вкладом в правдоподобие
    - Повторять оценку и отсечение, пока словарь не сократится до целевого размера
  id: 031-sentencepiece-potok-2
  fingerprint: 0f28c76f
- concept: пробел поступает в токенизатор как обычный символ потока, поэтому вариант слова с ведущим пробелом и без него — разные последовательности
  question: Объясни своими словами, почему при отсутствии предварительного разбиения на слова строки "cat" и " cat" дают разные последовательности токенов, и что это даёт при декодировании.
  explanation: Классический pipeline сначала режет по пробелам и теряет их, из-за чего восстановление текста требует эвристик. SentencePiece кодирует пробел явно, поэтому " hello" и "hello" честно различаются, а decode остаётся точным.
  kind: open
  reference: 'Раз этапа pre-tokenization нет, пробел не выполняет роль разделителя и не выбрасывается — он попадает во вход как обычный символ Unicode наравне с буквами. Значит, " cat" — это последовательность из четырёх символов, а "cat" — из трёх, и обучение может выдать им разные токены (например, отдельный токен на «пробел+cat», если такое сочетание частое). Практическая выгода — обратимость: информация о пробелах сохранена внутри токенов, поэтому декодирование восстанавливает исходную строку без угадывания, где нужно вставить пробел.'
  id: 031-sentencepiece-potok-3
  fingerprint: 4d497637
