- concept: каждая соседняя пара и каждый токен входят в счётчики с весом частоты слова, а не с весом 1
  question: Обучение WordPiece идёт по корпусу вида «последовательность токенов -> сколько раз это слово встретилось в корпусе» (переменная freq). Заполни пропуск в подсчёте пар так, чтобы счётчики соответствовали реальному корпусу.
  explanation: 'Корпус хранится в сжатом виде: слово записано один раз вместе со своей частотой. Прибавка 1 означала бы, что слово из 500 вхождений весит столько же, сколько единичное. Тот же вес freq обязан применяться и к таблице частот отдельных токенов — иначе числитель и знаменатель score посчитаны в разных шкалах.'
  kind: cloze
  template: |-
    for i in range(len(tokens) - 1):
        pair_counts[(tokens[i], tokens[i+1])] += ___
  answer: freq
  accept:
    - word_freq
    - frequency
    - count
    - частота слова
    - freq_of_word
  id: 027-wordpiece-best-pair-1
  fingerprint: f4ee9589
- concept: 'повторяющийся токен считается на каждой своей позиции: слово длины L даёт L вхождений токена и L-1 соседних пар'
  question: Корпус состоит из одного слова, представленного как последовательность ("x", "x", "x", "x") с частотой 5. Чему равен WordPiece-score пары ("x", "x")?
  explanation: 'В слове 4 позиции токена "x" и 3 соседние пары. С весом 5: count("x") = 20, count пары = 15. score = 15 / (20 * 20) = 0.0375. Частая ошибка — считать токен один раз на слово (тогда count("x") = 5) или пару один раз на слово (тогда 5), и score вылетает на порядок.'
  kind: numeric
  answer: 0.0375
  tolerance: 0.0005
  id: 027-wordpiece-best-pair-2
  fingerprint: faff533d
- concept: пары берутся только между соседними токенами внутри одного слова и не пересекают границу слов
  question: 'Корпус после разбиения выглядит так: ("z",) с частотой 9 и ("q",) с частотой 4 — оба слова состоят ровно из одного токена. Что вернёт функция выбора лучшей пары?'
  explanation: Пара — это два токена, стоящие рядом внутри одного слова. Слово из одного токена даёт вклад в таблицу частот токенов (count("z") = 9, count("q") = 4), но ни одной пары. Границы слов пар не порождают, иначе merge склеивал бы куски разных слов. Пустая таблица пар — это сигнал остановки обучения, поэтому возвращается None, а не искусственная пара.
  kind: choice
  options:
    - None — соседних пар в корпусе нет
    - ("q", "z") — лексикографически меньшая пара из имеющихся токенов
    - ("z", "q") — пара из самого частого и следующего по частоте токена
    - Пару с score 0, собранную из двух соседних слов корпуса
  correct: 0
  id: 027-wordpiece-best-pair-3
  fingerprint: 4570f290
