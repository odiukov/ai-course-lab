- concept: fertility — среднее число токенов на слово, отношение числа токенов к числу слов
  question: Токенизатор разбил текст из 240 слов на 384 токена. Чему равна fertility этого токенизатора на этом тексте?
  explanation: F = T/W = 384/240 = 1,6. Одно слово в среднем превращается в 1,6 токена. Чем выше значение, тем чаще токенизатор дробит слова на куски; F = 1,0 означало бы, что каждое слово — ровно один токен.
  kind: numeric
  answer: 1.6
  tolerance: 0.01
  id: 042-metriki-effektivnosti-1
  fingerprint: d42aa870
- concept: сравнение токенизаторов требует одинакового текста и одинаковых правил подсчёта слов и символов, иначе разница берётся из измерительной процедуры
  question: Инженер сравнивает два токенизатора. Первый померили на техдокументации, посчитав словами всё, что разделено пробелом; второй — на художественной прозе, отбросив пунктуацию и служебные слова. У второго fertility вышла ниже. Что можно заключить?
  explanation: 'Fertility = T/W: изменился и числитель (другой текст), и знаменатель (другое определение слова). Разница пришла из измерительной линейки, а не из vocabulary. Плотность тут не спасает: у неё свой знаменатель — символы, и он тоже зависит от текста и от того, считаются ли пробелы и пунктуация.'
  kind: choice
  options:
    - Второй токенизатор эффективнее, потому что fertility ниже
    - 'Ничего: разные тексты и разные правила подсчёта слов делают числа несравнимыми'
    - Первый токенизатор эффективнее, потому что технические тексты сложнее
    - Нужно сравнивать не fertility, а плотность — она не зависит от правил подсчёта
  correct: 1
  id: 042-metriki-effektivnosti-2
  fingerprint: 8e766335
- concept: fertility и плотность — характеристика пары «токенизатор + текст», а не самого токенизатора
  question: Один и тот же токенизатор дал fertility 1,3 на английском корпусе и 2,7 на украинском. Что это значит?
  explanation: T зависит и от словаря, и от того, насколько текст похож на данные, на которых словарь строился. Одно значение fertility без указания корпуса бессмысленно. Заявлять «fertility токенизатора = 1,3» можно только с оговоркой, на каком тексте это измерено; на другом языке та же система даёт 2,7 токена на слово.
  kind: choice
  options:
    - 'Токенизатор сломан: fertility одного токенизатора должна быть постоянной'
    - Украинский корпус короче, поэтому метрика завышена
    - 'Метрика характеризует пару «токенизатор + текст»: словарь хуже покрывает украинские словоформы, и слова дробятся на большее число кусков'
    - Fertility выше 2 означает, что текст закодирован посимвольно
  correct: 2
  id: 042-metriki-effektivnosti-3
