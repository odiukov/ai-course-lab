- concept: 'разные критерии merge не обязаны давать разных победителей: одна пара может выиграть и по частоте, и по нормированной оценке'
  question: В корпусе есть две пары-кандидата. Пара P встретилась вместе 30 раз, её части встречаются 35 и 40 раз. Пара Q встретилась вместе 18 раз, её части — 90 и 70 раз. Что произойдёт при выборе merge?
  explanation: 'BPE берёт максимум совместной частоты: 30 > 18, значит P. WordPiece: 30/(35·40) ≈ 0.0214 против 18/(90·70) ≈ 0.00286 — снова P. Части пары P редки сами по себе, поэтому она одновременно и самая массовая, и самая связанная. Разные критерии — не гарантия разных победителей, совпадение возможно.'
  kind: choice
  options:
    - BPE выберет P, WordPiece выберет Q — критерии всегда расходятся
    - BPE выберет Q, WordPiece выберет P
    - Оба метода выберут P
    - Оба метода выберут Q
  correct: 2
  id: 028-proverka-kriteriev-1
  fingerprint: '74731342'
- concept: 'оценка WordPiece не инвариантна к масштабу корпуса: пропорциональный рост всех частот делит оценки, поэтому сравнивать значения можно только внутри одного раунда на одном корпусе'
  question: 'Оценка пары по критерию WordPiece равна 0.02. Корпус заменили на его тройную копию: каждое слово встречается ровно втрое чаще, состав корпуса тот же. Чему станет равна оценка этой пары?'
  explanation: 'Числитель растёт втрое, знаменатель — произведение двух частот — в девять раз, поэтому оценка делится на 3: 0.02/3 ≈ 0.00667. Порядок пар при этом не меняется (все оценки поделены на одно и то же число), но само значение оценки нельзя сравнивать между корпусами разного объёма — только ранжировать пары внутри одного раунда.'
  kind: numeric
  answer: 0.00667
  tolerance: 0.0005
  id: 028-proverka-kriteriev-2
  fingerprint: 9937d3fb
- concept: для раунда BPE достаточно таблицы частот пар, для WordPiece нужны ещё и частоты отдельных токенов
  question: У вас есть только таблица частот всех соседних пар в корпусе. Что можно определить?
  explanation: 'BPE ищет максимум по таблице пар — больше ничего не нужно. WordPiece делит совместную частоту на произведение частот частей, а частоту токена по корпусу из таблицы пар корректно не восстановить: один токен входит во множество разных пар и в краевые позиции. Поэтому WordPiece требует второго счётчика — по отдельным токенам.'
  kind: choice
  options:
    - Победителя раунда и для BPE, и для WordPiece
    - Победителя только для BPE; для WordPiece нужны дополнительно частоты отдельных токенов
    - Победителя только для WordPiece; BPE требует ещё и частоты отдельных токенов
    - 'Ни того, ни другого: оба метода требуют частот отдельных токенов'
  correct: 1
  id: 028-proverka-kriteriev-3
  fingerprint: 8827be73
