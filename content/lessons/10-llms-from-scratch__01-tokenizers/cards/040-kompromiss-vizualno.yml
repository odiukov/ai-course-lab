  question: При словаре на 16 000 токенов текст занимает 80 токенов, при словаре на 64 000 — 62 токена. Как соотносятся два эффекта увеличения словаря в четыре раза?
  explanation: 'Матрица эмбеддингов — произведение размера словаря на размерность, поэтому четырёхкратный словарь даёт ровно четырёхкратные параметры. Сжатие так себя не ведёт: новые слоты достаются всё более редким сочетаниям, и 80 токенов превращаются лишь в 62, то есть примерно −22 %. Именно эта асимметрия и делает выбор размера словаря инженерным компромиссом, а не бесплатным улучшением: каждое следующее удвоение стоит столько же параметров, но приносит всё меньше сэкономленных токенов.'
