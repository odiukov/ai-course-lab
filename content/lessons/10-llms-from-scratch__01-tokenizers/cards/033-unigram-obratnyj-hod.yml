- concept: базовое подмножество токенов защищено от отсечения, потому что оно гарантирует сегментируемость любого входа
  question: Unigram сокращает словарь с 900 000 кандидатов до 48 000. Почему одиночные символы (базовые элементы) исключены из отсечения, даже если их вклад в правдоподобие мал?
  explanation: 'Долгие токены покрывают лишь то, что видел корпус. Базовые элементы — страховка полноты: любая строка, включая невиданное слово или редкий символ, разбирается хотя бы посимвольно. Отсечёшь их — получишь вход без валидной сегментации. Их вклад в правдоподобие тут не аргумент: их держат по соображению покрытия, а не оценки.'
  kind: choice
  options:
    - Без них часть входных строк вообще нельзя разбить, и появляются непокрываемые фрагменты
    - Их вероятности нельзя посчитать, поэтому сравнение с другими кандидатами невозможно
    - Они всегда самые частые в корпусе, значит их удаление даёт максимальную потерю правдоподобия
    - Они нужны только для декодирования, а на этапе обучения словаря не участвуют
