- concept: Unigram выбирает сегментацию с максимальной суммарной логвероятностью частей, поэтому разные разбиения одной строки сравнимы числом
  question: 'Unigram-модель хранит для кандидатов такие log2-вероятности: `international` = -13.0, `internation` = -9.5, `al` = -4.5, `inter` = -6.0, `national` = -8.0. Слово `international` можно собрать как один токен, как `internation + al` или как `inter + national`. Чему равна log2-вероятность того разбиения, которое выберет модель?'
  explanation: 'Логвероятности частей складываются: `internation + al` даёт -9.5 + (-4.5) = -14.0, `inter + national` даёт -6.0 + (-8.0) = -14.0, целый токен даёт -13.0. Максимум = -13.0, побеждает односегментное разбиение. Unigram — вероятностная модель сегментации: она не применяет фиксированную цепочку merges, а перебирает варианты и берёт самый правдоподобный.'
  kind: numeric
  answer: -13
  tolerance: 0.01
  id: 033-unigram-obratnyj-hod-1
  fingerprint: 0e01e6a7
- concept: цена удаления кандидата определяется тем, насколько хорошо его вхождения перекрываются другими токенами, а не его собственной частотой
  question: В словаре Unigram два кандидата. Токен A встречается в корпусе 4800 раз, но каждое его вхождение почти без потери правдоподобия собирается из двух других оставшихся токенов. Токен B встречается 260 раз, и без него эти строки распадаются на цепочки одиночных символов. Какой кандидат Unigram отсечёт первым?
  explanation: 'Критерий — насколько просядет правдоподобие корпуса после удаления, а не сырая частота. У A есть хорошая замена, поэтому потеря близка к нулю, несмотря на 4800 вхождений. У B замены нет: 260 строк придётся собирать заметно хуже, так что он остаётся. Именно поэтому «вычеркнуть самое редкое» — неверная эвристика для Unigram.'
  kind: choice
  options:
    - A, потому что его вхождения дешево перекрываются другими токенами
    - B, потому что он редкий и занимает слот почти бесполезно
    - 'Ни один: удаляются только кандидаты длиной в один символ'
    - A и B одновременно, так как решение принимается по длине токена
  correct: 0
  id: 033-unigram-obratnyj-hod-2
