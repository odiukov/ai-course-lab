- concept: знаменатель score берёт полные частоты токенов по корпусу, а не число их вхождений внутри рассматриваемой пары
  question: В корпусе токен `A` встречается 40 раз, токен `B` — 30 раз, а рядом друг с другом они стоят 12 раз. Чему равен score пары (A, B) в WordPiece?
  explanation: 'score = count(AB) / (count(A)·count(B)) = 12 / (40·30) = 12/1200 = 0,01. Частая ошибка — подставить в знаменатель совместные вхождения (12·12) или вычесть их из частот: в знаменатель идут полные частоты каждого токена по всему корпусу, включая те случаи, где он стоит без партнёра.'
  kind: numeric
  answer: 0.01
  tolerance: 0.0005
  id: 026-wordpiece-score-1
  fingerprint: 3c5a423f
- concept: рост общей частоты одной части пары при неизменной совместной частоте снижает score этой пары
  question: 'Токены `A` и `B` стоят рядом 12 раз, count(B) = 30. Корпус расширили текстами, где `A` встречается в других контекстах: count(A) вырос с 40 до 120, а совместных вхождений по-прежнему 12. Что произойдёт со score пары (A, B)?'
  explanation: 'Было 12/(40·30) = 0,01, стало 12/(120·30) ≈ 0,0033. Числитель фиксирован, знаменатель вырос в 3 раза — score падает ровно втрое. Именно так формула наказывает токены, которые встречаются повсюду: чем шире `A` разбросан по другим контекстам, тем менее особенным считается его соседство с `B`.'
  kind: choice
  options:
    - 'Упадёт втрое: числитель тот же, знаменатель вырос втрое'
    - 'Не изменится: count(AB) не поменялся, а он и решает'
    - 'Вырастет втрое: `A` стал частотнее, значит пара важнее'
    - 'Упадёт вдвое: считается средняя частота частей, а не произведение'
  correct: 0
  id: 026-wordpiece-score-2
  fingerprint: 3be2fb2c
- concept: score пары ограничен сверху обратной величиной частоты более частой части, потому что совместных вхождений не бывает больше min(count(A), count(B))
  question: Токен `A` встречается в корпусе 40 раз, токен `B` — 200 раз. Объясни своими словами, почему score пары (A, B) в WordPiece не может превысить 0,005, каким бы ни был корпус.
  explanation: Ключ — неравенство count(AB) ≤ min(count(A), count(B)). Подставив максимум в формулу, редкая частота сокращается и остаётся 1/max(count(A), count(B)) = 1/200 = 0,005. Это объясняет, почему повсеместные токены проигрывают структурно, а не случайно.
  kind: open
  reference: 'Совместных вхождений не может быть больше, чем вхождений самого редкого из токенов: count(AB) ≤ min(count(A), count(B)) = 40. Максимум достигается, когда `A` вообще не встречается без `B`. Тогда score = 40/(40·200) = 1/200 = 0,005. В общем виде score ≤ 1/max(count(A), count(B)): потолок задаёт частота более частой части. Практический вывод: пара с очень частым токеном внутри не может получить высокий score даже в идеальном случае, поэтому WordPiece почти никогда не сливает пары со сверхчастыми частями.'
  id: 026-wordpiece-score-3
  fingerprint: 51de530b
