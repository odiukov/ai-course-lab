- concept: вывод о языке требует выборки, покрывающей разные темы и жанры; малый однодоменный набор обосновывает только вывод об этих конкретных предложениях
  question: 'Бенчмарк состоит из 12 предложений на язык, все взяты из бытовых диалогов о еде. Числа получены аккуратно: один токенизатор, единая нормализация, параллельные переводы. Объясни своими словами, какой вывод эти данные подтверждают, а какой — нет, и что нужно изменить, чтобы вывод расширился.'
  explanation: 'Две независимые вещи: контроль условий (один токенизатор, одинаковая обработка, параллельные смыслы) убирает посторонние факторы, а объём и разнообразие выборки задают, насколько широко можно обобщать. Учебный набор из десятка предложений даёт наглядность, но не статистическую опору для утверждения обо всём языке.'
  kind: open
  reference: 'Корректность условий защищает только от систематического перекоса измерения; она не расширяет область, на которую распространяется вывод. 12 предложений одной темы обосновывают утверждение о токенизации бытовых фраз о еде на этих языках данным токенизатором. Утверждение вида «на языке X токенов вообще на N% больше» из них не следует: разные домены (код, юридический текст, имена собственные, адреса, технические строки) токенизируются по-разному, а на малой выборке одно-два предложения сдвигают среднее. Чтобы вывод распространялся на язык, нужны большая выборка и покрытие нескольких тем и жанров, а также отчёт о разбросе значений, а не только среднее.'
  id: 047-benchmark-yazykov-3
