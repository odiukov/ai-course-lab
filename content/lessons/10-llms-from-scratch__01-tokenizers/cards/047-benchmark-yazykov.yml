- concept: единственное усреднённое число скрывает выброс, поэтому по каждому языку сохраняют результаты отдельных предложений
  question: 'Для одного языка получены значения токенов по предложениям: 12, 13, 11, 14, 12, 13, 96. Последнее предложение содержит длинный адрес с эмодзи. На сколько среднее арифметическое превышает медиану? Ответ с точностью до сотых.'
  explanation: Сумма 171, среднее 171/7 ≈ 24.43; отсортированный ряд 11,12,12,13,13,14,96 даёт медиану 13. Разрыв ≈ 11.43 создан одним предложением. Если бы в отчёт попало только среднее, язык выглядел бы вдвое «дороже», чем он есть на типичном тексте. Именно поэтому по каждому языку хранят значения отдельных предложений, а не одно агрегированное число.
  kind: numeric
  answer: 11.43
  tolerance: 0.05
  id: 047-benchmark-yazykov-2
