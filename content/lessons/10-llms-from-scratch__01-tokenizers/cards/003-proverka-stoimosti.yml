- concept: итоговый счёт за вызов складывается из входных и выходных токенов, у которых разные тарифы
  question: 'Вызов API: 6000 входных токенов по цене $5 за 1M входных токенов и 1000 сгенерированных токенов по цене $20 за 1M выходных. Сколько стоит вызов в долларах?'
  explanation: 'Вход: 6000 / 1e6 × 5 = $0.03. Выход: 1000 / 1e6 × 20 = $0.02. Итого $0.05. Выходные токены обычно тарифицируются дороже входных, поэтому короткий запрос с длинным ответом легко стоит больше, чем длинный запрос с коротким ответом.'
  kind: numeric
  answer: 0.05
  tolerance: 0.001
