- concept: критерий выбора merge в WordPiece — частота пары, нормированная на произведение частот её частей
  question: Заполни знаменатель в критерии выбора merge у WordPiece (A и B — левый и правый токены пары).
  explanation: 'BPE ранжирует пары по count(AB). WordPiece делит эту частоту на произведение частот частей: пара из двух и без того повсеместных токенов получает большой знаменатель и проигрывает. Знаменатель — именно произведение, а не сумма и не минимум: он играет роль ожидаемой частоты совместной встречаемости при независимости частей.'
  kind: cloze
  template: score(A, B) = count(AB) / ( ___ )
  answer: count(A) * count(B)
  accept:
    - count(A)*count(B)
    - count(A) × count(B)
    - count(A) · count(B)
    - произведение count(A) и count(B)
  id: 025-wordpiece-otlichie-1
  fingerprint: 3e3967af
- concept: 'на одном корпусе BPE и WordPiece выбирают разные merges: более редкая, но сильнее связанная пара может обойти массовую'
  question: 'В корпусе посчитаны частоты: пара «t h» встречается 1500 раз при count(t) = 45000 и count(h) = 38000; пара «q u» встречается 460 раз при count(q) = 520 и count(u) = 6400. Какой merge будет выбран BPE и какой — WordPiece на этом раунде?'
  explanation: 'BPE берёт максимум count(AB): 1500 > 460, значит «t h». WordPiece считает count(AB)/(count(A)·count(B)): для «t h» это 1500/(45000·38000) ≈ 8.8e-7, для «q u» — 460/(520·6400) ≈ 1.4e-4, то есть на два порядка больше. «q» почти не встречается вне пары с «u», поэтому знаменатель мал. Отсюда следствие: одинаковый корпус и одинаковый размер vocabulary не гарантируют одинаковых merges у BPE и WordPiece.'
  kind: choice
  options:
    - 'Оба выберут «t h»: её абсолютная частота выше'
    - BPE выберет «t h», WordPiece — «q u»
    - BPE выберет «q u», WordPiece — «t h»
    - 'Оба выберут «q u»: у неё выше связь частей'
  correct: 1
  id: 025-wordpiece-otlichie-2
  fingerprint: 5e9d1d15
- concept: цель WordPiece — правдоподобие обучающих данных, поэтому отдельный токен получают устойчивые сочетания, а не самые массовые соседства
  question: Объясни своими словами, какую цель оптимизирует WordPiece при выборе merges и почему из этой цели следует наказание пар, обе части которых по отдельности очень частотны.
  explanation: 'Ключ — что нормировка не косметическая, а вытекает из цели: правдоподобие растёт от токенов для неслучайных, характерных сочетаний. BPE же оптимизирует чисто частотную цель — максимум count(AB) — и потому собирает самые массовые соседства.'
  kind: open
  reference: 'WordPiece подбирает vocabulary так, чтобы обучающие данные получали максимальное правдоподобие: merge делается тот, который сильнее всего повышает likelihood корпуса. Практический критерий — count(AB)/(count(A)·count(B)). Знаменатель — оценка того, как часто A и B оказались бы рядом просто по случайности, раз оба и так распространены. Поэтому вопрос WordPiece не «какая пара встречается чаще всего», а «какая пара встречается вместе чаще, чем можно ожидать по случайности». Если обе части повсюду (частый символ вроде «e»), их соседство объясняется общей частотностью, ничего нового отдельный токен модели не даёт, и score низкий. Если же части редко ходят по отдельности, но регулярно приходят вместе (продолжение вроде «##ness»), знаменатель мал, score велик, и сочетание получает собственный токен.'
  id: 025-wordpiece-otlichie-3
  fingerprint: c94ea73e
