- concept: 'размер словаря и длина последовательности связаны обратно: это одна ось, а не два независимых параметра'
  question: Токенизатор переобучили, увеличив словарь с 50K до 150K токенов на том же корпусе. Что произойдёт с тем же текстом и с моделью?
  explanation: 'Крупнее словарь — больше частых последовательностей хранится целиком, значит текст кодируется меньшим числом токенов. Плата: строки матрицы эмбеддингов и выходной слой пропорциональны размеру словаря. Целые слова и отдельные символы — крайние точки одной оси: минимум длины при огромном словаре и минимум словаря при огромной длине.'
  kind: choice
  options:
    - Среднее число токенов на текст уменьшится, но вырастут матрица эмбеддингов и выходной softmax
    - Среднее число токенов на текст уменьшится, а размер модели не изменится
    - Среднее число токенов на текст вырастет, зато модель станет легче
    - 'Число токенов и размер модели останутся прежними: словарь влияет только на редкие слова'
