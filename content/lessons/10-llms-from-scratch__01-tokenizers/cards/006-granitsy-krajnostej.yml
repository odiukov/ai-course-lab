- concept: пословная сегментация опирается на пробелы и потому неприменима к письменностям без пробелов и к сплошным техническим строкам
  question: Почему деление по пробелам и пунктуации не работает как универсальный алгоритм токенизации?
  explanation: Пословный подход молча предполагает, что текст уже размечен пробелами. Для письменностей без пробелов такой разметки нет вовсе, а строка вида get_user_by_id или https://example.com/a/b — одна «единица» по пробелам, хотя внутри у неё явная структура. Разбиение на части слова находит границы по статистике корпуса и от пробела не зависит.
  kind: choice
  options:
    - 'Пробел не универсальный разделитель: в китайском, японском и тайском письме его нет, а в путях, URL и идентификаторах кода границы смысловых единиц пробелами не отмечены'
    - Пробел занимает отдельный токен и потому удваивает длину последовательности
    - Пунктуация в разных языках кодируется разными байтами, и разделитель невозможно распознать
    - Модель не умеет обрабатывать строки, в которых больше одного пробела подряд
