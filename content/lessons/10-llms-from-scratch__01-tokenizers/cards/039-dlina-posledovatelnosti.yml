  question: Две модели имеют одинаковое контекстное окно в 16384 токена. У модели A средняя стоимость 1.45 токена на английское слово, у модели B — 1.16. Что верно про объём одного и того же документа, который поместится в окно?
  explanation: 'Окно ограничивает токены, а не символы. 16384 / 1.45 ≈ 11300 слов у A и 16384 / 1.16 ≈ 14124 слова у B. Токен — не фиксированная порция текста: у более сжимающего словаря один ID в среднем покрывает больший фрагмент, поэтому тот же лимит окна означает больше содержания.'
