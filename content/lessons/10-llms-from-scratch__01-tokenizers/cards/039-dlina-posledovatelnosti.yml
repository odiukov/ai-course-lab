- concept: сокращение последовательности при росте словаря возникает из-за появления единичных ID для длинных частых сочетаний, и выигрыш распределён неравномерно по типам текста
  question: 'Два byte-level BPE токенизатора обучены на одном корпусе: у первого словарь на 48 512 записей, у второго — на 196 613. На типовом английском тексте второй даёт заметно более короткую последовательность, а на списке редких фамилий и на артикулах товаров выигрыш почти исчезает. Объясни своими словами, откуда берётся сокращение и почему оно неравномерное.'
  explanation: 'Ключ в том, что новые слоты словаря не раздаются равномерно всем словам: их занимают сочетания с высокой частотой в корпусе обучения. Поэтому рост словаря с 48 512 до 196 613 записей укорачивает типовой текст, но почти не помогает строкам, которых в корпусе не было. Плата за эти записи — дополнительные строки матрицы эмбеддингов, которые оплачиваются независимо от того, встретится ли токен на практике.'
  kind: open
  reference: 'Дополнительные записи словаря заполняются самыми частыми в обучающем корпусе сочетаниями, которые к этому моменту ещё кодировались несколькими токенами. То, что маленький словарь собирает из нескольких кусков, большой узнаёт как одну запись и выдаёт один ID — сам текст не меняется, меняется гранулярность кодирования. Отсюда неравномерность: выигрыш получают строки, состоящие из частых в корпусе сочетаний, а редкие фамилии и артикулы в статистику корпуса не попали, отдельных записей не получили и по-прежнему дробятся на много мелких частей. Правило «больше словарь — каждое слово один токен» неверно; распределение выигрыша задаётся частотами обучающих данных.'
