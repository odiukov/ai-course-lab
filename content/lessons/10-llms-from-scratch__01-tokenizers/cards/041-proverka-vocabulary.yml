- concept: выбор размера словаря идёт от дефицитного ресурса системы к допустимому диапазону, а не от желания сократить число токенов
  question: Расставь шаги инженерного выбора размера vocabulary для конкретного развёртывания.
  explanation: 'Число токенов — метрика оптимизации, а не ограничение. Пока не назван нерушимый лимит, любое сравнение «120K лучше 40K» не имеет смысла: обе стороны компромисса стоят ресурсов, и решает та, которой в системе не хватает.'
  kind: order
  items:
    - 'Назвать ресурс, который в этой системе нельзя превысить: память под параметры или бюджет задержки'
    - 'Выразить обе стороны компромисса в единицах этого ресурса: строки матрицы эмбеддингов против числа токенов на запрос'
    - Отобрать размеры словаря, при которых ограничение не нарушается
    - Внутри допустимого диапазона выбрать размер по второй стороне и замерить её на реальных данных
  id: 041-proverka-vocabulary-1
  fingerprint: 7e278a15
- concept: 'оптимальный размер словаря — свойство среды развёртывания, а не самой модели: при разном дефиците ресурсов выигрывают противоположные размеры'
  question: 'Одну архитектуру разворачивают дважды: (A) offline на устройстве с 6 ГБ памяти и короткими запросами, (B) на сервере с избытком памяти, где обрабатывают документы по 30 тысяч слов при жёстком SLA на задержку. Для A выгоднее словарь на 48K, для B — на 160K. Что из этого следует?'
  explanation: Оба выбора корректны, потому что дефицитные ресурсы разные. В A ограничение — память под параметры, и лишние строки матрицы эмбеддингов недопустимы. В B память свободна, а платит система за длину последовательности, поэтому более плотное кодирование окупается.
  kind: choice
  options:
    - Размер словаря выбирается под дефицитный ресурс конкретного развёртывания; вне заданных ограничений «правильного» размера не существует
    - 'Один из двух выборов сделан неверно: у модели есть единственный оптимальный размер словаря'
    - Размер словаря не связан ни с памятью, ни с задержкой, и разница объясняется другими причинами
  correct: 0
