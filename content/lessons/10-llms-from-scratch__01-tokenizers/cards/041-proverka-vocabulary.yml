- concept: проверять выбор словаря нужно метрикой того ограничения, из-за которого он сделан, а не числом токенов
  question: 'Команда увеличила словарь, чтобы уложиться в бюджет задержки, и отчиталась: «текст стал занимать на 18 % меньше токенов». Объясни своими словами, почему такой отчёт не доказывает, что задача решена, и что нужно измерить вместо этого.'
  explanation: Классическая ошибка — улучшать одну сторону компромисса и мерить её же. Обе стороны расходуют ресурсы; отчёт в токенах молчит о второй.
  kind: open
  reference: 'Сокращение числа токенов — промежуточный эффект, а не цель. Решение принималось ради конкретного ограничения, значит и проверять надо его метрику: фактическую задержку (например, p95 на реальном трафике) и пиковую память под параметры. Больший словарь одновременно увеличил матрицу эмбеддингов, и этот рост может выбить систему за лимит памяти либо съесть выигрыш во времени на другом участке. Отчёт закрывает задачу только тогда, когда показано и что нерушимое ограничение соблюдено, и что целевая метрика улучшилась на реальных данных, а не на модельном абзаце.'
  id: 041-proverka-vocabulary-3
  fingerprint: b0631225
