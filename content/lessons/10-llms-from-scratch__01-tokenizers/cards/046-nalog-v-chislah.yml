  question: Расставь шаги измерения того, во сколько раз конкретный токенизатор невыгоднее для тайского языка по сравнению с английским.
  explanation: 'Ключ в том, что варьируется язык, а токенизатор фиксирован: иначе непонятно, чей вклад в разницу. Параллельность версий гарантирует равный смысл, поэтому отношение числа токенов (например, 1440 к 480 — множитель 3) описывает именно неравномерность сжатия по письменностям.'
  kind: order
