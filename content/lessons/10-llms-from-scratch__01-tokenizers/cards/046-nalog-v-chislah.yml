- concept: выигрыш от увеличения словаря получают только те письменности, которым фактически достались новые слоты
  question: Новое поколение модели увеличило vocabulary с 32K до 128K токенов. После замера оказалось, что для английского число токенов на слово упало, а для корейского осталось прежним. Какое объяснение наиболее вероятно?
  explanation: Размер словаря — это бюджет слотов, а не автоматическое улучшение для всех языков. Сжатие для письменности растёт только тогда, когда её частые сочетания получают собственные ID. Именно поэтому в Llama 3 учетверение словаря с 32K до 128K сопровождалось сознательным выделением доли слотов неанглийским письменностям.
  kind: choice
  options:
    - Почти все добавленные слоты заняли частые сочетания латиницы и кода, а корейским последовательностям символов новых токенов почти не досталось
    - Корейский принципиально не поддаётся subword-сжатию, поэтому размер словаря на него влиять не может
    - При словаре больше 64K токенов алгоритм слияний перестаёт добавлять новые токены
    - Корейский текст всегда кодируется побайтово, независимо от содержимого словаря
