- concept: ID токена — произвольный идентификатор записи в словаре, а не носитель смысла или частоты
  question: Токенизатор превратил фрагмент текста в число 8321. Что это число само по себе сообщает о фрагменте?
  explanation: 'Словарь токенизатора — это таблица соответствий «фрагмент — номер». Номер назначается при построении словаря и работает как ключ поиска. Смысл появляется позже: по ID модель достаёт вектор признаков, и уже близость векторов, а не близость номеров, отражает близость значений.'
  kind: choice
  options:
    - Что фрагмент встречается в обучающем корпусе 8321 раз
    - Только позицию записи в словаре токенизатора; смысла в самом числе нет
    - Что фрагмент состоит из 8321 байта в кодировке UTF-8
    - Что фрагмент по смыслу близок к фрагментам с номерами 8320 и 8322
  correct: 1
  id: 001-chisla-vmesto-teksta-1
  fingerprint: 57e94d6e
- concept: 'полный путь текста через модель: токенизация, ID, векторы, генерация ID, декодирование'
  question: Расставь этапы обработки запроса языковой моделью в правильном порядке — от строки на входе до строки на выходе.
  explanation: 'Модель никогда не видит букв: строка становится последовательностью ID, ID — векторами, и вычисления идут над векторами. Обратный путь симметричен: генерируются номера, а декодер токенизатора склеивает их в текст.'
  kind: order
  items:
    - Токенизатор делит входную строку на фрагменты, которые есть в его словаре
    - Каждому фрагменту подставляется закреплённый за ним целочисленный ID
    - По каждому ID модель достаёт соответствующий вектор числовых характеристик
    - Модель выполняет вычисления и выдаёт ID следующих токенов
    - Токенизатор собирает из полученных ID читаемый текст
  id: 001-chisla-vmesto-teksta-2
  fingerprint: b6efac59
- concept: 'токенизатор двусторонний: encode переводит текст в ID, decode — ID обратно в текст'
  question: Дополни вызов так, чтобы из списка ID снова получилась строка.
  explanation: Токенизатор хранит соответствие в обе стороны. encode ищет фрагменты в словаре и отдаёт их номера, decode берёт номера и подставляет привязанные к ним фрагменты. Без decode вывод модели остался бы списком чисел.
  kind: cloze
  template: |-
    ids = tokenizer.encode("Привет")
    text = tokenizer.___(ids)
  answer: decode
  accept:
    - decode
    - tokenizer.decode
    - .decode
  id: 001-chisla-vmesto-teksta-3
  fingerprint: 652f3769
