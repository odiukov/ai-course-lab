- concept: письменность без пробелов диктует выбор обёртки (сырой поток символов), а не выбор алгоритма построения словаря
  question: 'Корпус целиком на японском: границ слов пробелами нет. Что этот факт определяет при настройке токенизатора?'
  explanation: 'Отсутствие пробелов бьёт по этапу пре-токенизации: правила границ слов не работают. SentencePiece решает это тем, что вообще не режет вход заранее и считает пробел обычным символом. Но внутри такой обёртки одинаково запускаются и BPE mode, и Unigram mode — сам алгоритм выбирается по другим соображениям.'
  kind: choice
  options:
    - Что словарь надо строить отсечением из большого набора кандидатов, а не слияниями
    - Что вход нужно обрабатывать как сырой поток Unicode без предварительной токенизации, а алгоритм построения словаря остаётся открытым вопросом
    - Что byte-level кодирование неприменимо и придётся вводить токен [UNK] для незнакомых иероглифов
  correct: 1
  id: 034-proverka-sentencepiece-1
  fingerprint: 738a0e7f
- concept: SentencePiece — обёртка, вмещающая два разных алгоритма построения словаря, поэтому одинаковая обёртка и одинаковый размер словаря не означают одинаковый словарь
  question: Llama 2 и T5 обе используют SentencePiece со словарём на 32 000 токенов. Следует ли отсюда, что словари строились одним и тем же способом?
  explanation: 'SentencePiece — контейнер: он задаёт работу с сырым потоком символов, а внутри поддерживает два режима. Llama 2 — SentencePiece BPE на 32 000 токенов, T5 — SentencePiece Unigram на 32 000 токенов. Совпадение обёртки и размера словаря ничего не говорит о том, как эти 32 000 токенов отобраны.'
  kind: choice
  options:
    - 'Да: SentencePiece реализует единственный алгоритм, а число токенов совпадает'
    - 'Нет: Llama 2 обучена в BPE mode (последовательные слияния), T5 — в Unigram mode (отсев из избыточного набора)'
    - 'Нет: у T5 на самом деле WordPiece, SentencePiece только нормализует текст'
  correct: 1
  id: 034-proverka-sentencepiece-2
  fingerprint: '53285879'
- concept: смена поколения модели может менять и семейство токенизатора, и порядок размера словаря
  question: Llama 2 использует SentencePiece BPE со словарём 32 000 токенов, Llama 3 перешла на byte-level BPE со 128 256 токенами. Во сколько раз вырос размер словаря?
  explanation: '128 256 / 32 000 ≈ 4.0. Между поколениями поменялась не только величина словаря, но и семейство: с SentencePiece BPE на byte-level BPE в духе tiktoken. Больший словарь даёт меньше токенов на тот же текст, но увеличивает эмбеддинг-таблицу и выходной слой.'
  kind: numeric
  answer: 4
  tolerance: 0.1
  id: 034-proverka-sentencepiece-3
  fingerprint: '37722579'
