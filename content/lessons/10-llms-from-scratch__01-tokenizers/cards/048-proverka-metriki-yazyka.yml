- concept: нормировка на байты UTF-8 искажает сравнение письменностей, потому что знак разных письменностей стоит разного числа байтов
  question: Корейская версия сообщения — 180 байт UTF-8 и 90 токенов, английская версия того же сообщения — 300 байт и 75 токенов. Во сколько раз больше токенов уходит на это сообщение по-корейски, если знаменатель — переданное содержание?
  explanation: 'Содержание одно, поэтому сравниваются сами счётчики токенов: 90 / 75 = 1.2. По байтам вышло бы 0.5 против 0.25, то есть двукратный разрыв, — но это артефакт того, что хангыль в UTF-8 стоит 3 байта на слог, а латиница 1 байт на букву. Знаменатель в байтах меряет кодировку, а не налог.'
  kind: numeric
  answer: 1.2
