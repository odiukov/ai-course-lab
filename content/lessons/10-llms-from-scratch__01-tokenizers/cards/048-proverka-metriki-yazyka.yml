- concept: символ не равен постоянной порции смысла между письменностями, поэтому нормировка токенов на символы искажает межъязыковое сравнение
  question: Почему отношение «токены на символ» плохо работает как мера расхода при сравнении китайского и английского?
  explanation: Сравнимой должна быть та величина, что стоит в знаменателе. У символов она не сравнима между письменностями, у выровненного содержания — сравнима по построению.
  kind: open
  reference: 'Символ несёт разный объём содержания в разных письменностях: один китайский знак примерно соответствует морфеме или целому слову, а латинская буква — доле слова. То же сообщение на китайском занимает в разы меньше символов, поэтому знаменатель сжимается вместе с текстом и коэффициент токены/символ выглядит завышенным, хотя абсолютный расход токенов может быть меньше. Метрика меряет свойства письменности, а не налог, который платит пользователь.'
