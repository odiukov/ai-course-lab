- concept: roundtrip требует побайтового совпадения decode(encode(text)) с исходной строкой, а не похожести
  question: Токенизатор кодирует строку `Hello, world!` и после декодирования выдаёт `Hello, world !`. Как оценить такой результат?
  explanation: 'Критерий roundtrip бинарный и строгий: decode(encode(s)) == s. Совпадать должны буквы, регистр, пробелы и пунктуация. Лишний пробел означает, что где-то в encode или decode теряется информация о границах, и такой токенизатор нельзя ставить перед моделью.'
  kind: choice
  options:
    - 'Roundtrip провален: восстановленная строка не совпадает с исходной, значит токенизатор теряет информацию'
    - 'Roundtrip пройден: смысл сохранён, лишний пробел на смысл не влияет'
    - Roundtrip пройден, если число токенов оказалось меньше числа байтов
    - Roundtrip неприменим к строкам со знаками препинания
  correct: 0
  id: 020-roundtrip-1
  fingerprint: 459ab2fc
- concept: 'проверка токенизатора идёт от корректности к эффективности: сначала roundtrip, потом коэффициент сжатия'
  question: Расставь шаги проверки обученного токенизатора на тестовой строке в правильном порядке.
  explanation: 'Сжатие — метрика эффективности, roundtrip — условие корректности. Компактная последовательность токенов, из которой не собирается исходный текст, бесполезна: ошибка остаётся ошибкой независимо от того, насколько коротким получилось кодирование. Поэтому коэффициент имеет смысл смотреть только после успешного сравнения.'
  kind: order
  items:
    - Закодировать строку в последовательность ID через encode
    - Декодировать полученные ID обратно в текст через decode
    - Сравнить восстановленный текст с исходным на полное совпадение
    - Только при совпадении считать коэффициент сжатия — отношение числа токенов к числу байтов
  id: 020-roundtrip-2
  fingerprint: a95d8e19
- concept: коэффициент сжатия — отношение числа токенов к числу байтов UTF-8 исходной строки
  question: Строка занимает 60 байт в UTF-8, токенизатор закодировал её в 21 токен. Чему равен коэффициент сжатия?
  explanation: 'Коэффициент = токены / байты = 21 / 60 = 0.35. Меньше — лучше: одна запись словаря покрывает в среднем почти три байта текста. Значение около 1.0 означает откат к посимвольному кодированию.'
  kind: numeric
  answer: 0.35
  tolerance: 0.01
  id: 020-roundtrip-3
  fingerprint: 7b381da0
