- concept: 'word-level токенизация ломается на слове вне словаря: получается [UNK] и написание теряется'
  question: Пословный токенизатор со словарём в 200 000 слов встречает в запросе термин `Geschwindigkeitsbegrenzung`, которого в словаре нет. Что произойдёт и почему это проблема?
  explanation: Пословный подход умеет кодировать только то, что уже есть в словаре. Промах даёт `[UNK]` — метку «неизвестный фрагмент», после которой написание восстановить нельзя. Чтобы промахов не было, словарь должен покрыть все словоформы всех языков плюс код, URL и числа, то есть быть практически бесконечным.
  kind: choice
  options:
    - Слово заменится на специальный токен `[UNK]`, и модель не получит ни одной буквы исходного написания
    - Словарь автоматически расширится новой записью, и слово будет закодировано без потерь
    - Слово будет закодировано теми словами словаря, которые ближе всего к нему по смыслу
    - Токенизатор вернёт ошибку и откажется кодировать весь запрос
  correct: 0
  id: 005-tri-strategii-1
  fingerprint: a41cc1ea
- concept: посимвольная токенизация убирает неизвестные токены ценой длины последовательности и ёмкости модели
  question: Посимвольный токенизатор гарантированно кодирует любой текст без `[UNK]`. Какова главная плата за эту безотказность?
  explanation: 'Словарь тут как раз крошечный — пара сотен символов, и декодирование однозначно. Плата в другом: предложение из десятка слов превращается в десятки символьных токенов, и модель вынуждена выучивать, что `t`, `h`, `e` вместе означают `the`, вместо того чтобы получить это готовым куском.'
  kind: choice
  options:
    - Последовательности становятся в разы длиннее, и модель тратит ёмкость на то, чтобы заново собирать буквы в знакомые слова
    - Словарь разрастается до миллионов записей и перестаёт помещаться в память
    - 'Декодирование становится невозможным: по отдельным символам исходный текст не восстановить'
    - Одинаковые слова в разных предложениях получают разные наборы токенов
  correct: 0
  id: 005-tri-strategii-2
  fingerprint: 669f5625
- concept: subword-разбиение держит словарь конечным и при этом кодирует любое редкое слово без потери написания
  question: Объясни своими словами, почему subword-токенизация со словарём порядка 50 000 записей почти никогда не выдаёт `[UNK]`, хотя слов в языке во много раз больше.
  explanation: 'Ключ в композиционности: не «слово есть в словаре или нет», а «слово собирается из фрагментов словаря». Пословный подход требует записи под каждое слово и всё равно промахивается; посимвольный не промахивается никогда, но растягивает текст. Subword берёт лучшее от обоих.'
  kind: open
  reference: 'Словарь subword-токенизатора состоит не из целых слов, а из кусков разной длины: частые слова лежат в нём целиком одним токеном, а редкие собираются из более мелких фрагментов вроде `un`, `happi`, `ness`. В пределе фрагменты доходят до отдельных символов, поэтому любое незнакомое слово, имя или термин можно составить из уже имеющихся кусков — написание сохраняется полностью. Куски выбираются по статистике встречаемости в обучающих текстах и не обязаны совпадать с морфемами языка. Итог — компромисс: словарь остаётся конечным и подъёмным (обычно 30K–128K), последовательности остаются короткими по сравнению с посимвольными, а неизвестных токенов практически не бывает. Именно поэтому subword-подход используют все современные LLM.'
  id: 005-tri-strategii-3
  fingerprint: 34820af5
