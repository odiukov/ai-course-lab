- concept: кодирование воспроизводит сохранённые merges, а подсчёт частот пар происходит только при обучении
  question: Почему при кодировании нового текста токенизатор BPE не пересчитывает частоты пар, хотя именно частота решала, какие merges создавать во время обучения на корпусе из 512 правил?
  explanation: Обучение и кодирование — разные фазы. Обучение производит артефакт (упорядоченный список merges + словарь), кодирование его только воспроизводит. Иначе токенизация зависела бы от статистики конкретного входа и не совпадала бы с тем, на чём училась модель.
  kind: open
  reference: 'Подсчёт частот — процедура обучения: он нужен, чтобы решить, какие 512 пар вообще станут токенами, и его результат уже зафиксирован в упорядоченной таблице merges. При кодировании токенизатор не принимает решений: он берёт UTF-8 байты и прогоняет сохранённые правила по порядку их появления. Пересчёт частот на новом тексте дал бы другой набор и другой порядок склеиваний, то есть другую систему токенов, чем та, на которой обучалась модель — ID перестали бы значить то же самое. К тому же кодирование должно быть детерминированным: один и тот же текст обязан давать одну и ту же последовательность ID независимо от того, кодируется он отдельным словом или внутри большого документа.'
  id: 016-poryadok-merges-3
  fingerprint: 2f90b68d
