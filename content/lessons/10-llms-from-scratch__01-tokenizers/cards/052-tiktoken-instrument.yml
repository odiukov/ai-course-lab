- concept: для точного осмотра содержимого одного ID берут его байты, а не текстовое декодирование, потому что декодирование подменяет неполный фрагмент символом замены
  question: Нужно узнать, какие именно байты стоят за одним ID, не рискуя получить символ замены вместо обрывка многобайтового символа. Заполни пропуск (tiktoken).
  explanation: '`decode([t])` пытается собрать из байтов токена валидный текст и на неполном фрагменте отдаёт `\ufffd`, теряя информацию о том, что там реально лежало. `decode_single_token_bytes` возвращает байты как есть, поэтому годится для точного разбора отдельного ID.'
  kind: cloze
  template: 'raw = enc.___(t)   # b''\xd0'''
  answer: decode_single_token_bytes
  accept:
    - decode_single_token_bytes(t)
    - enc.decode_single_token_bytes
