- concept: 'порядок осмотра токенизации готовым энкодингом: загрузка энкодинга, кодирование, поэлементное декодирование ID, декодирование всей последовательности, сверка с исходной строкой'
  question: 'Расставь шаги: нужно посмотреть, на какие куски готовый токенизатор режет строку, и убедиться, что сборка обратно даёт исходный текст.'
  explanation: 'Поэлементное декодирование показывает, где проходят границы кусков (кусок может быть частью слова), а декодирование всей последовательности проверяет обратимость. Порядок важен: сверять с исходником имеет смысл результат целого decode, а не склейку отдельных кусков — на многобайтовых символах отдельные куски могут выглядеть как `\ufffd`.'
  kind: order
  items:
    - Загрузить готовый энкодинг по его имени
    - Закодировать строку и получить список ID
    - Декодировать каждый ID по отдельности и сопоставить ID с его куском текста
    - Декодировать весь список ID целиком
    - Сравнить результат целого декодирования с исходной строкой
