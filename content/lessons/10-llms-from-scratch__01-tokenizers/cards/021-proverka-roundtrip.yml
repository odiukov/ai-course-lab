- concept: byte-level BPE обратим, потому что каждый ID отображается в фиксированную цепочку байтов, а decode — конкатенация без вставок
  question: Объясни своими словами, почему byte-level BPE сам по себе гарантирует точное восстановление исходной строки, каким бы редким ни был входной текст.
  explanation: Обратимость и эффективность — независимые свойства. Обратимость даёт полное покрытие алфавита плюс детерминированное отображение ID в байты; сжатие даёт удачность выученных merges на этом тексте.
  kind: open
  reference: Стартовый алфавит покрывает все 256 значений байта, поэтому любой вход разбивается без остатка и без [UNK]. Каждый выученный токен — конкатенация двух уже существующих, значит у каждого ID есть ровно одна фиксированная байтовая расшифровка. Decode просто склеивает эти цепочки подряд, ничего не добавляя и не удаляя, поэтому итоговая последовательность байтов совпадает с исходной. Редкое слово меняет только число токенов (сжатие), но не точность.
  id: 021-proverka-roundtrip-3
  fingerprint: 2c715b89
