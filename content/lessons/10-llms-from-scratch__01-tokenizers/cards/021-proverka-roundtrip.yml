- concept: флаг пропуска специальных токенов при декодировании удаляет фрагменты и ломает побайтовое совпадение
  question: Нужно, чтобы decode вернул ровно то, что было закодировано, включая все служебные маркеры. Заполни пропуск.
  explanation: 'При skip_special_tokens=True декодер молча выбрасывает служебные ID. Для теста обратимости это недопустимо: строка вернётся короче исходной. Для показа ответа пользователю флаг обычно ставят в True, но тогда это уже не roundtrip-проверка.'
  kind: cloze
  template: text = tokenizer.decode(ids, skip_special_tokens=___)
