- concept: задержка ответа растёт с числом выходных токенов, потому что генерация последовательна
  question: Почему дробная токенизация сильнее сказывается на времени ожидания ответа, чем на времени обработки входного промпта? Объясни своими словами.
  explanation: 'Ключ — асимметрия: вход считается параллельно, выход генерируется токен за токеном. Отсюда правило: экономия на выходных токенах даёт выигрыш и в цене, и в задержке; экономия на входных — в основном в цене и вместимости окна.'
  kind: open
  reference: 'Входной промпт обрабатывается за один проход: все его токены модель видит параллельно. Выход же строится последовательно — по одному токену за шаг, и каждый шаг требует отдельного прохода по модели. Поэтому если токенизатор режет текст дробнее, тот же по смыслу ответ занимает больше токенов, значит больше шагов генерации и заметно дольше ожидание. Вход при более дробном разбиении тоже дорожает по цене и по месту в окне, но не умножает число последовательных шагов.'
