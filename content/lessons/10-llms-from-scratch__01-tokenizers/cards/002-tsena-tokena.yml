- concept: цена и вместимость определяются числом токенов, а не числом символов текста
  question: Один и тот же документ отправляют в два API. Токенизатор первой модели кодирует его в 4096 токенов, второй — в 7300. Символов в документе одинаково. Что верно?
  explanation: Биллинг и лимит окна считаются в токенах. Тот же текст, разбитый дробнее, даёт больше оплачиваемых единиц и занимает больше окна. Текст при этом не теряется — просто упакован менее плотно.
  kind: choice
  options:
    - 'Вторая модель прочитает документ хуже: больше токенов означает потерю части текста'
    - Второй вызов дороже по входу и оставит меньше свободного места в окне того же размера
    - Стоимость совпадёт, так как биллинг считается по символам, а токены — внутренняя деталь
    - Число токенов не влияет на вместимость окна, оно ограничено количеством символов
