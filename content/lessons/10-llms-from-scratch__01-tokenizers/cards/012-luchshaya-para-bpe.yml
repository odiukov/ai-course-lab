- concept: недетерминированное разрешение ничьей делает обучение BPE невоспроизводимым, потому что каждый merge меняет частоты следующих раундов
  question: Почему при обучении BPE недостаточно сказать «при равной частоте берём любую из пар»? Объясни своими словами, к чему это приводит.
  explanation: 'Ключ — жадность и зависимость раундов: первый выбор меняет токены, дальше меняются и частоты. Поэтому воспроизводимость важнее «правильности» конкретного правила. Таблица merges и есть токенизатор, и она обязана получаться одна и та же на одинаковых данных.'
  kind: open
  reference: 'Если правило неоднозначное, два запуска на одном и том же корпусе могут выбрать разные пары при ничьей. Алгоритм жадный и последовательный: выбранный merge переписывает корпус, склеенные символы исчезают из подсчёта, и на следующем раунде частоты пар уже другие. Поэтому одно расхождение не остаётся локальным — оно каскадом меняет всю дальнейшую последовательность merges, а значит и итоговый словарь. Получаются два разных токенизатора при идентичных данных: одинаковый текст режется по-разному, ID не совпадают, сохранённая таблица merges несовместима с моделью. Правило разрешения ничьей может быть любым (порядок обхода, алфавит), но должно быть зафиксировано заранее и давать один и тот же ответ при каждом запуске.'
