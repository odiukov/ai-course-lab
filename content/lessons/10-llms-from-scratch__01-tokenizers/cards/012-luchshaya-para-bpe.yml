- concept: 'один раунд обучения BPE: подсчёт пар, выбор максимума с разрешением ничьей, слияние с добавлением в словарь, пересчёт'
  question: Расставь действия одного раунда обучения BPE в правильном порядке.
  explanation: 'Порядок жёсткий: сначала статистика, потом выбор, потом слияние. Разрешение ничьей — часть шага выбора, а не отдельная эвристика после слияния. Пересчёт обязателен, потому что слияние уничтожает часть старых пар и создаёт новые, поэтому старые счётчики недействительны.'
  kind: order
  items:
    - Посчитать частоты всех соседних пар токенов в корпусе
    - Найти максимальную частоту, а при равном максимуме выбрать пару по заранее принятому фиксированному правилу
    - Слить выбранную пару в новый токен и добавить его в словарь
    - Пересчитать частоты пар на уже изменённом корпусе и проверить, достигнут ли целевой размер словаря
