- concept: 'компакция и TTL чистят буфер разной ценой: TTL убирает запись целиком независимо от её содержания, компакция сохраняет содержание, но теряет детализацию'
  question: Буфер рефлексий агента разросся до 60 записей. Ты можешь применить TTL (удалять записи старше 45 дней) или компакцию (сжимать группу близких рефлексий в одну). Чем эти два инструмента различаются по тому, что именно теряется, и когда какой уместен?
  explanation: 'Оба лечат memory rot, но платят разной валютой: TTL платит потерей всей записи, компакция — потерей подробностей. Ошибка выбора видна по симптому: если после чистки агент начал заново совершать давно разобранную ошибку, TTL срезал живую запись; если рефлексии стали общими («будь внимательнее»), пережала компакция.'
  kind: open
  reference: 'TTL режет по возрасту и удаляет запись целиком: вместе с мусором уходит и старая, но всё ещё верная рефлексия — цена в том, что содержание не учитывается вообще. Компакция ничего не выбрасывает целиком, она сливает похожие записи в одну обобщённую: содержание переживает чистку, но теряется детализация, а операциональность рефлексии держится именно на конкретике (какое действие заменить каким). Отсюда: TTL уместен там, где среда меняется и старое знание объективно протухает (изменившийся API, переехавшая схема); компакция — там, где знание остаётся верным, а буфер распух от многократных пересказов одного и того же провала. На практике их ставят вместе: компакция сокращает объём, TTL ограничивает срок жизни.'
