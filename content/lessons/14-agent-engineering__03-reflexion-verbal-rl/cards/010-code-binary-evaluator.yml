- concept: 'типы оценщиков комбинируются по доступности истины: скаляр где она есть, самооценка где её нет, эвристики поверх как страховка'
  question: Часть задач агента закрыта юнит-тестами, часть — свободные текстовые ответы без эталона. Какая конфигурация оценки в Reflexion считается рабочей по умолчанию?
  explanation: Скалярный сигнал самый информативный, но существует только при внешней истине. Самооценка слабее, потому что проверяет та же модель, что и решала, — её берут вынужденно. Эвристики вроде «одно и то же действие дважды подряд» или «траектория длиннее лимита» стоят почти ноль и ловят застревание, которое не видно ни скаляру, ни самооценке, поэтому идут поверх, а не вместо.
