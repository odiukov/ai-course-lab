- concept: рефлексия применима там, где веса недоступны или дообучение под каждый сбой экономически невозможно
  question: Продовый агент работает на закрытой API-модели и даёт около 50 разных сбоев в неделю. Почему для него выбирают вербальную рефлексию, а не дообучение под каждый класс сбоя?
  explanation: Reflexion (Shinn et al., arXiv:2303.11366) не делает ни одного градиентного шага, поэтому работает поверх замороженной модели за спиной API. Цена исправления — лишний вызов на генерацию рефлексии, а не кластер и часы обучения. Гарантий он при этом не даёт.
  kind: choice
  options:
    - Веса модели недоступны, а даже при доступе каждый класс сбоя потребовал бы своих прогонов и GPU-времени; рефлексия стоит один-два лишних вызова модели
    - Рефлексия математически эквивалентна градиентному шагу и потому всегда предпочтительнее
    - Дообучение запрещено лицензией большинства открытых моделей
    - Рефлексия гарантирует, что тот же сбой не повторится никогда
  correct: 0
  id: 001-provalil-i-chto-2
  fingerprint: 30c58869
- concept: прирост при одной и той же базовой модели относится к содержимому контекста, а не к возросшей способности модели
  question: Reflexion обгоняет ReAct на ALFWorld, HotpotQA и HumanEval, используя те же самые базовые модели, что и базлайны. Объясни своими словами, что именно этот факт доказывает об источнике прироста.
  explanation: Контрольное сравнение «та же модель, разная обвязка» изолирует эффект. Улучшение на всех трёх бенчмарках сразу приписывается абзацу текста, перенесённому из прошлой попытки, — поэтому паттерн и растиражировали в продовых обвязках.
  kind: open
  reference: 'Раз веса и базовая модель совпадают с базлайном, возросшая способность модели исключена: модель ровно та же. Единственное, что изменилось, — содержимое промпта следующей попытки, куда попал текст рефлексии о прошлом провале. Значит прирост даёт перенос информации между попытками через контекст, а не обучение. Отсюда и практический вывод: это очень дешёвый рычаг (стоимость — лишний вызов модели), доступный любому агенту поверх замороженной модели.'
  id: 001-provalil-i-chto-3
  fingerprint: 08ed08e4
