- concept: эвристики дают только отрицательные срабатывания на заранее перечисленные паттерны, поэтому их молчание не является подтверждением успеха
  question: Почему набор эвристик («действие повторилось дважды подряд», «траектория длиннее 30 шагов») нельзя использовать как единственный оценщик в Reflexion-цикле, даже если он ловит все реальные сбои прошлой недели?
  explanation: 'Ключ — асимметрия: эвристика генерирует только отрицательные срабатывания по конечному списку правил. Всё, что в список не попало, она пропускает молча. Отсюда её роль — дешёвая страховка (правило «одно и то же действие дважды подряд» стоит ноль и ловит застревание), а не замена оценщику результата.'
  kind: open
  reference: 'Эвристика — это список заранее описанных признаков отказа. Она умеет сказать «вот здесь точно плохо», но не умеет сказать «задача решена»: если ни одно правило не сработало, это значит лишь, что агент не попал ни в один известный паттерн сбоя, а не что результат верный. Молчание эвристик — отсутствие улик, а не доказательство успеха. Плюс эвристики смотрят на форму траектории, а не на её результат: агент может уложиться в 12 шагов, ни разу не повториться и выдать неверный ответ. Поэтому эвристики вешают поверх основного оценщика (скалярного или самооценки) как страховочные рельсы на конкретные частые сбои, а решение «стоп или ещё попытка» принимает основной сигнал.'
