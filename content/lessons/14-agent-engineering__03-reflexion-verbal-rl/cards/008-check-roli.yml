  question: В Reflexion-системе для задачи с юнит-тестами. Какой компонент нельзя заменить обычным кодом без вызова языковой модели?
  explanation: 'Evaluator при наличии эталона или тестов — обычный детерминированный код. Память — просто список строк. Actor и Self-Reflector требуют модели, но именно Self-Reflector обязан её требовать по определению: его продукт — текстовое объяснение причины, которого детерминированная проверка дать не может.'
