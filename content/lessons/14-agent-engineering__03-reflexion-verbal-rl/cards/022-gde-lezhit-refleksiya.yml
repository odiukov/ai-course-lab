- concept: при игнорировании рефлексий сначала проверяют позицию блока в промпте, а не качество формулировки диагноза
  question: Агент с Reflexion не реагирует на свои рефлексии. Почему перед тем, как переписывать текст диагноза, стоит проверить расположение блока рефлексий в промпте? Объясни своими словами.
  explanation: 'Это самый дешёвый рычаг во всём цикле: идеальный оценщик и точный диагноз не дают ничего, если результат лежит в хвосте промпта. Сначала перестановка, потом улучшение текста.'
  kind: open
  reference: 'Дословно один и тот же текст рефлексии даёт разное поведение в зависимости от того, где он лежит: перенос блока в начало, до описания задачи, устраняет игнорирование без единой правки формулировки. Значит, «актор не заметил» и «диагноз плохо сформулирован» — разные причины, и перепись текста лечит только вторую. Проверка позиции дешевле: это перестановка блоков, а не новый прогон Self-Reflector. Кроме того, переписывание при неправильной позиции скрывает настоящую причину — можно бесконечно улучшать формулировку и не получить эффекта, потому что весь цикл (оценщик, диагноз, буфер) работает вхолостую, если его результат приходит в контекст после того, как модель уже решила, что делать.'
  id: 022-gde-lezhit-refleksiya-2
  fingerprint: 97501da3
- concept: порядок блоков промпта актора, при котором уроки прошлых попыток участвуют в формировании плана
  question: Расположи блоки промпта актора в Reflexion в порядке, который даёт наибольший шанс, что уроки прошлых попыток повлияют на действие.
  explanation: 'Рефлексии идут первыми и отдельными пронумерованными пунктами, а не слитным абзацем: так каждый урок читается как отдельное ограничение и попадается модели раньше, чем условие задачи. Остальные блоки сохраняют обычный порядок. Перенос в начало снимает повтор ошибки уже со второй попытки, тогда как хвостовая позиция оставляет её на трёх из четырёх.'
  kind: order
  items:
    - Подводка «уроки прошлых попыток, учти их прежде чем начинать» и пронумерованные рефлексии
    - Описание текущей задачи и цели
    - Список доступных инструментов
    - История действий текущей траектории
  id: 022-gde-lezhit-refleksiya-3
  fingerprint: b8276437
