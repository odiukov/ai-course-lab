- concept: самооценку укрепляют, вынося проверяемые части критерия во внешние инструменты и оставляя модели только остаток, который инструментом не проверить
  question: Оценка результата целиком отдана самой модели, потому что готового теста нет. Объясни, как усилить такой оценщик, не заводя размеченного эталона, и почему это работает.
  explanation: Ключ — не «спросить модель настойчивее», а сократить долю суждения, которую ничем не подпирают. Любая вынесенная наружу проверка даёт независимую от модели истину; остаток субъективного оценивается слабым сигналом, но его меньше.
  kind: open
  reference: 'Критерий надо разложить на части и вынести наружу всё, что вычислимо или проверяемо инструментом: сверить числа калькулятором, проверить существование ссылки или цитаты запросом, прогнать код или линтер, сопоставить значения с записью в базе. Эти части перестают зависеть от самомнения модели — их истину приносит внешний исполнитель, то есть по факту они превращаются в скалярный сигнал. Модели остаётся только неформализуемый остаток (тон, уместность, связность), и слабый сигнал самооценки применяется к меньшей площади. Работает это потому, что ошибка самооценки коррелирует с ошибкой генерации: та же модель с тем же пробелом и писала, и проверяет, а инструмент вносит независимый источник истины. Это подход CRITIC: самооценка как заглушка там, где истины нет вовсе, плюс проверка через инструменты везде, где её можно достать.'
