- concept: штамп возраста фиксируется в момент записи и не обновляется при использовании, иначе TTL никогда не срабатывает
  question: 'Инженер реализовал TTL так: при каждой сборке промпта поле created_at у каждой попавшей в промпт рефлексии переписывается на номер текущей попытки. Объясни своими словами, почему такой TTL не удалит ни одной записи, и в какой момент штамп должен ставиться.'
  explanation: Ключ — разделить «когда факт узнали» и «когда его прочитали». TTL меряет первое. Обновление штампа при чтении делает вечной ровно ту запись, которая чаще всего попадает в промпт, то есть закрепляет самое стойкое суеверие.
  kind: open
  reference: 'Возраст считается как current_attempt - created_at. Если created_at обновлять при каждом использовании, возраст любой записи, попавшей в промпт, всегда равен 0, и условие age >= ttl не выполнится никогда — TTL превращается в no-op, а буфер продолжает расти. Штамп ставится ровно один раз, в момент записи рефлексии (в add_reflection), и дальше неизменен: он фиксирует, когда знание получено, а не когда его последний раз читали. Измеряется он в попытках, а не в секундах, чтобы часовой и минутный прогоны старели одинаково. Сам проход по буферу вызывается один раз в начале попытки, до сборки промпта — иначе за просроченные записи платишь токенами наравне с полезными.'
  id: 021-code-expire-reflections-3
  fingerprint: 90bc67a6
