- concept: ограничение размера буфера вытесняет записи только при появлении новых, поэтому без притока записей устаревшая рефлексия не удаляется никогда
  question: Эпизодический буфер рефлексий ограничен 12 слотами, вытеснение — по правилу «старую выкидываем, когда пришла новая». На попытке 40 в буфере лежит одна рефлексия про разовый сбой сети, записанная 15 попыток назад, и ещё три полезные. Новых рефлексий с тех пор не появлялось. Что произойдёт с записью про сбой сети?
  explanation: 'Ограничение размера и TTL — независимые критерии: первый про «сколько», второй про «сколько попыток назад». Пока свободные слоты есть и новых записей не поступает, вытеснение не срабатывает, и мёртвая запись живёт вечно. Именно поэтому нужен отдельный проход expire_reflections по возрасту, а не только bounded buffer.'
  kind: choice
  options:
    - 'Она останется в промпте бессрочно: слоты свободны, вытеснять её нечем'
    - Она будет вытеснена, потому что буфер всегда удаляет самую старую запись на каждой попытке
    - Она будет вытеснена, как только буфер заполнится хотя бы наполовину
    - Она автоматически перестанет попадать в промпт, потому что актор игнорирует записи старше остальных
