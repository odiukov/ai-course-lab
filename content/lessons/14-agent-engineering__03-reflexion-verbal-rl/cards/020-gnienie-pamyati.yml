- concept: 'устаревшие рефлексии портят не только бюджет, но и поведение: актор получает их без отметки о свежести и взвешивает наравне с актуальными'
  question: Часть рефлексий в буфере описывает баг, который давно починили, и инструмент, который с тех пор переписали. Почему это вредит качеству прогона, а не только его цене?
  explanation: 'В буфере лежит просто текст, у записей нет метки актуальности и нет веса. Актор читает рефлексию про давно исправленный баг ровно так же, как вчерашнюю, и честно выстраивает обход того, чего уже нет. Классический пример — запись про единичный сбой сети: агент навсегда перестаёт пользоваться рабочим поиском.'
  kind: choice
  options:
    - Актор видит все записи как равноправные подсказки и не может отличить актуальный диагноз от протухшего, поэтому обходит несуществующие уже проблемы
    - Устаревшие рефлексии переполняют окно контекста и вызывают ошибку усечения на стороне API
    - Evaluator начинает оценивать попытку по устаревшим критериям и выдаёт неверный скалярный сигнал
    - Старые записи ломают формат промпта, потому что писались другой версией модели
