- concept: TTL берёт возраст записи как дешёвый заменитель её полезности, и в этом одновременно его дешевизна и его дефект
  question: TTL («выбрасываем всё старше N попыток») называют самым дешёвым лекарством от гниения памяти. Какой ценой достаётся эта дешевизна?
  explanation: 'TTL — это одна строчка, потому что решение принимается по счётчику попыток и не требует ни модели, ни разбора смысла записи. Возраст здесь работает грубым заменителем полезности: редкая, но верная рефлексия умрёт по сроку наравне с протухшей. Компакция и агент-уборщик смотрят на содержимое и потому дороже. Вариант со сжатием нескольких записей в одну описывает компакцию, а не TTL.'
  kind: choice
  options:
    - TTL судит о записи по возрасту, а не по содержанию, поэтому вместе с мусором выбрасывает редкие, но всё ещё верные рефлексии
    - TTL требует отдельного агента-уборщика, который работает в простое и потребляет вызовы модели
    - TTL применим только к скалярным оценщикам, а при самооценке возраст записи неизвестен
    - TTL сжимает несколько рефлексий в одну, из-за чего теряется формулировка конкретного действия
  correct: 0
