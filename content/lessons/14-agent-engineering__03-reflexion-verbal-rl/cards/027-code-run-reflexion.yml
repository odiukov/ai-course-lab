- concept: промпт актора пересобирается на каждом витке из текущего состояния памяти, иначе новые рефлексии до актора не доезжают
  question: В драйвере Reflexion строка сборки промпта из памяти и задачи вынесена наружу цикла — до первой попытки, а внутри цикла актору передаётся уже готовая переменная. Что произойдёт при шести попытках?
  explanation: Рефлексии дописываются в память во время цикла, а промпт замер в том состоянии, каким память была до первой попытки — то есть пустой. Актор шесть раз видит одинаковый вход и шесть раз выдаёт одинаковый ответ. Сборка промпта обязана быть внутри витка, после того как предыдущая итерация обновила и почистила буфер.
  kind: choice
  options:
    - Все шесть попыток дадут один и тот же промпт, и поведение выродится в базлайн без рефлексии
    - Рефлексии дойдут до актора, но с задержкой в одну попытку
    - Актор получит рефлексии в обратном порядке — от новых к старым
    - Оценщик начнёт получать положительный вердикт раньше, потому что промпт короче
  correct: 0
