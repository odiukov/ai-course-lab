- concept: драйвер возвращает пооопытную трассу, потому что итоговый флаг успеха не отличает работающий канал памяти от повторения одного ответа
  question: Почему функция-драйвер Reflexion возвращает не булев результат «получилось или нет», а трассу по каждой попытке? Объясни своими словами, какую конкретно ошибку такой возврат позволяет поймать.
  explanation: 'Один бит на выходе делает две разные ситуации неразличимыми: «память работает, но задача трудная» и «память вообще не доехала до актора». Трасса разводит их за секунду — совпадение текста соседних попыток однозначно указывает на разорванный канал между буфером и промптом.'
  kind: open
  reference: 'Булев итог схлопывает весь прогон в один бит и не показывает, менялось ли поведение между попытками. Трасса хранит по каждой попытке вход актора, его ответ, вердикт оценщика и записанную рефлексию — по ней видно, отличается ли ответ попытки N от ответа попытки N-1. Ключевая ловимая ошибка: рефлексия не подмешана в промпт актора. Тогда прогон технически отработает все попытки и вернёт корректный булев результат, но ответы будут текстуально одинаковыми — это и есть базлайн, замаскированный под Reflexion. Трасса также показывает, улучшается ли ответ постепенно (значит, рефлексии операциональны) или прыгает случайно (значит, диагноз бесполезен), то есть локализует проблему между каналом памяти и качеством Self-Reflector''а.'
  id: 027-code-run-reflexion-3
  fingerprint: 84a9e328
