- concept: на классе задач, где базовый прогон и так проходит, Reflexion добавляет только издержки, потому что цикл рефлексии питается провалами
  question: Пайплайн решает задачи с первой попытки в 98% случаев. Инженер оборачивает его в Reflexion. Чего ждать?
  explanation: Успешная попытка завершает цикл без записи. Если провалов почти нет, буфер почти пуст, а лишний вызов оценщика и лишние токены платятся на каждом прогоне. Reflexion окупается там, где базовый прогон регулярно падает и падение воспроизводимо.
