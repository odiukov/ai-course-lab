- concept: уборку эпизодической памяти выносят в фоновый простой, чтобы стоимость чистки не попадала в латентность рабочего прогона
  question: Против гниения памяти предлагают отдельного агента-уборщика, который разбирает эпизодический буфер в простое, а не по ходу решения задачи. Объясни, что даёт вынос уборки в фон и чего он не решает.
  explanation: Уборка — та же работа с контекстом, вопрос только в том, кто за неё платит временем. Фоновый режим (подход Letta) снимает её с рабочего прогона, но не заменяет ни фильтр на входе в буфер, ни компакцию, ни TTL — он лишь переносит момент оплаты.
  kind: open
  reference: 'Уборка — это отдельная работа: перечитать записи, найти устаревшие, дубли и противоречия, свернуть или удалить. Если делать это внутри рабочего прогона, её токены и время добавляются к латентности задачи и конкурируют с бюджетом действий. В простое буфер чистится вне пользовательского прогона, и рабочая попытка получает уже компактную память бесплатно по времени. Чего это не решает: качества фильтра на входе. Уборщик судит о полезности записи так же приблизительно, как TTL судит по возрасту; мусор, попавший в буфер, до ближайшей уборки продолжает влиять на актора, а между уборками буфер снова растёт.'
