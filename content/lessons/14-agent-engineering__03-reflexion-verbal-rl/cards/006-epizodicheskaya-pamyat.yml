- concept: рефлексия — единственный канал между попытками, поэтому она должна быть самодостаточной и операциональной
  question: Объясни своими словами, почему рефлексия вида «в следующий раз буду внимательнее» бесполезна для Reflexion, тогда как в обычном длинном диалоге такая фраза ещё могла бы сработать.
  explanation: 'Это плата за чистый лист. Выбрасывая траекторию, мы выбрасываем и всю контекстную опору для расплывчатых формулировок, поэтому качество Reflexion упирается в конкретность Self-Reflector: «искал по фамилии автора, а вопрос был про название статьи» переносится, «буду внимательнее» — нет.'
  kind: open
  reference: 'В длинном диалоге модель видит саму траекторию и может сама сопоставить расплывчатую заметку с конкретными действиями, которые её вызвали. При перезапуске с пустого контекста траектории нет: рефлексия — единственное, что доехало до новой попытки. Если в ней нет конкретики (какое действие было ошибочным, из какого неверного прочтения задачи оно выросло, что делать вместо него), новая попытка стартует практически как первая и, скорее всего, повторит ту же ошибку. Отсюда требование: рефлексия должна быть самодостаточной и операциональной — понятной без доступа к контексту, в котором она родилась.'
  id: 006-epizodicheskaya-pamyat-3
