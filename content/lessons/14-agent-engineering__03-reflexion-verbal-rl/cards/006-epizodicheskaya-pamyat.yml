- concept: объём переносимого между попытками материала растёт как одна строка на попытку, а не как длина траектории
  question: Агент провалил 6 попыток. Каждая траектория занимает 1800 токенов, каждая рефлексия — 60 токенов. Сколько токенов материала из прошлых попыток попадёт в промпт седьмой попытки при работе эпизодической памяти?
  explanation: 'В память уходят только рефлексии: 6 × 60 = 360 токенов. Траектории (6 × 1800 = 10 800 токенов) выбрасываются. Отсюда и масштабируемость приёма: стоимость контекста растёт линейно по числу попыток с крошечным коэффициентом, а не по суммарной длине провалов.'
  kind: numeric
  answer: 360
  tolerance: 1
  id: 006-epizodicheskaya-pamyat-2
