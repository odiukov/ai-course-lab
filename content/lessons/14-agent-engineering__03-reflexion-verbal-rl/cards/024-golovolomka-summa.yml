- concept: прогон без рефлексии — обязательный контроль, без которого прирост нельзя приписать рефлексии
  question: Зачем при проверке Reflexion запускать вторую конфигурацию — тот же актор, то же число попыток, но с отключённой передачей рефлексий между попытками? Объясни своими словами.
  explanation: 'Без контроля любой успех после нескольких попыток объясняется чем угодно. Ключевая деталь контроля: попытки должны быть по-настоящему независимы и стартовать с идентичного промпта — тогда застревание на первом ответе показывает, что дело не в способностях модели, а в отсутствии нового материала в контексте.'
  kind: open
  reference: 'Это контрольный прогон (ablation). Он отвечает на вопрос, что именно дало успех: если агент с рефлексией решает задачу на 4-й из 5 попыток, сам этот факт ещё ничего не доказывает — задача могла решиться перебором или случайным разбросом сэмплинга. В контрольной конфигурации промпт каждой попытки идентичен предыдущему, поэтому и ответ воспроизводится тот же: результат застывает на 0 из 5. Разница между 0 из 5 и 1 из 5 при одном и том же акторе и одинаковом бюджете попыток — единственное, что позволяет приписать прирост переносимой строке рефлексии, а не задаче, модели или удаче.'
  id: 024-golovolomka-summa-2
  fingerprint: 6c4cb066
