- concept: в продовом варианте паттерна границей попытки служит сессия/прогон агента, а роль оценщика играет фактический исход в реальной системе
  question: Агент правит код в репозитории. Правил файла нет, инженер ведёт его вручную. Что здесь выполняет роль оценщика в терминах Reflexion?
  explanation: Сигнал берётся оттуда, где есть истина. В продовой связке истину даёт реальный исход прогона, а границей попытки служит сессия агента. Самооценка модели была бы отдельным, более слабым типом оценщика, длина диффа — произвольная эвристика без связи с успехом, а вычитка файла правил относится к обслуживанию памяти, а не к оценке попытки.
  kind: choice
  options:
    - 'Фактический исход работы: упавший прод, сломанный lock-файл, красный CI — то есть внешний результат сессии'
    - Сама языковая модель, оценивающая свой ответ в конце ответа
    - 'Длина итогового диффа: чем он больше, тем хуже оценка'
    - Отдельный проход модели по файлу правил, проверяющий его на противоречия
