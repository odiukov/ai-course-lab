- concept: 'автор рефлексии заменяем: человек может занять место Self-Reflector, а остальные элементы цикла — память, подстановка в контекст, актор — работают без изменений'
  question: В продовых системах строки вроде «тесты гоняй через pnpm, не npm» в файл правил проекта пишет человек после инцидента, а не языковая модель. Объясни, почему такая связка всё равно считается тем же паттерном, и какой именно его компонент здесь заменён.
  explanation: 'Reflexion — названный паттерн, а не конкретный алгоритм. Компоненты (актор, оценщик, генератор рефлексии, эпизодическая память) могут быть реализованы кодом, моделью или человеком. Практическое следствие: человеческий файл правил ломается по тем же причинам, что и автоматический буфер.'
  kind: open
  reference: 'Заменён только Self-Reflector — генератор вербальной рефлексии. Всё остальное сохраняется: есть провал и его оценка (реальный инцидент вместо теста или скалярного оценщика), есть эпизодическая память вне весов модели (файл правил), есть подстановка её содержимого в контекст актора перед задачей, и есть актор, который на следующем прогоне действует иначе. Паттерн определяется структурой канала между попытками, а не тем, кто именно формулирует запись; автоматизация Self-Reflector''а меняет только источник текста и скорость накопления, но не механизм переноса. Отсюда же следует, что такой файл наследует и проблемы буфера: гниение записей, необходимость держать объём небольшим и писать операциональные формулировки вместо общих.'
