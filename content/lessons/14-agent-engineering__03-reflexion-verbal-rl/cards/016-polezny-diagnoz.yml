  fingerprint: 010f3ecf
- concept: накопление общих самокритичных записей раздувает контекст и имитирует обучение, поэтому буфер требует дедупликации
  question: Почему буферу рефлексий нужна дедупликация, и почему без неё агент может выглядеть обучающимся, не обучаясь?
  explanation: 'Ключевое различие: рост объёма памяти — не признак обучения. Обучение измеряется тем, изменилось ли поведение следующей попытки; повторяющиеся общие записи не меняют его ни разу, но исправно расходуют контекст.'
  kind: open
  reference: 'Модель охотно порождает общие записи вида «буду внимательнее» после каждого провала, потому что они всегда верны и всегда уместны. Такие записи почти идентичны друг другу, поэтому буфер после десяти попыток содержит десять копий одного и того же нулевого содержания. Они занимают место в контексте, вытесняя редкие содержательные диагнозы, и создают иллюзию накопленного опыта: буфер растёт, а поведение следующей попытки не меняется ни на одно действие. Дедупликация (вместе с TTL) удерживает в памяти только различающиеся, операциональные записи.'
  id: 016-polezny-diagnoz-3
  fingerprint: b8a47556
