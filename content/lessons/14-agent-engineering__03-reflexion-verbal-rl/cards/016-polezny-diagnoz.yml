- concept: 'рефлексия несёт информацию ровно настолько, насколько она неприменима к другим провалам: универсальная запись не различает эту задачу и любую другую'
  question: Агент провалил задачу и записал в эпизодическую память одну рефлексию. Какая из записей несёт наибольшую информацию для следующей попытки?
  explanation: 'Первая, вторая и четвёртая записи одинаково подходят к любому провалу в любой задаче, поэтому не различают ни одного из них и не меняют ни одного действия. Третья не подходит ни к какому другому провалу — именно потому, что фиксирует конкретный факт, которого не хватило. Практический тест на качество рефлексии: подставить её к чужому провалу; если подходит — она пустая.'
  kind: choice
  options:
    - «Задача оказалась сложнее, чем я ожидал, нужно подходить к ней серьёзнее»
    - «Я слишком спешил и не проверил результат перед ответом»
    - «API возвращает timestamp в секундах, а я передал его в функцию, ожидающую миллисекунды — перед вызовом умножить на 1000»
    - «Мне не хватило тщательности при работе с данными»
  correct: 2
  id: 016-polezny-diagnoz-1
  fingerprint: cbc048cb
- concept: операциональная рефлексия состоит из трёх частей — где произошла ошибка, почему, и какое другое действие выполнить вместо неё
  question: 'Self-Reflector сформулировал: «Я неправильно разобрал входной JSON». Чего этой рефлексии не хватает, чтобы следующая попытка изменила поведение?'
  explanation: Запись называет место ошибки, но не причину («поле items приходит строкой, а не массивом») и не замену действия («сначала json.loads вложенного поля»). Без причины и предписанного действия следующая попытка знает только, что было плохо, но не что делать иначе. Тон и строгость формулировки на поведение не влияют; копия проваленной траектории вредна — она работает как few-shot пример неправильных действий.
  kind: choice
  options:
    - Указания причины и конкретного другого действия вместо ошибочного
    - Более резкой самокритики, чтобы модель отнеслась к ошибке серьёзнее
    - Скалярной оценки провала, приложенной к тексту рефлексии
    - Полной копии проваленной траектории рядом с записью
  correct: 0
