  fingerprint: 2eb92b07
- concept: Self-Reflector получает на вход всю траекторию вместе с оценкой, а не одну финальную оценку
  question: Что подают на вход компоненту, который пишет рефлексию, и почему одной оценки провала ему недостаточно? Объясни своими словами.
  explanation: 'Рефлексия — это диагноз, а диагноз ставят по ходу болезни, не по итоговой цифре. Отсюда и разделение ролей: оценщик отвечает за факт провала, а рефлектор читает всю цепочку и превращает факт в конкретную поправку к следующей попытке.'
  kind: open
  reference: На вход идёт вся траектория попытки — рассуждения, вызовы инструментов, полученные результаты — вместе с оценкой этой траектории. Оценка говорит только «плохо» и не указывает место ошибки; чтобы назвать причину («искал по названию компании, а вопрос был про основателя»), нужно видеть конкретные шаги, где выбор пошёл не туда. Из одного числа причину не восстановить, а рефлексия без причины бесполезна следующей попытке.
  id: 005-tri-komponenta-3
  fingerprint: 192bc215
