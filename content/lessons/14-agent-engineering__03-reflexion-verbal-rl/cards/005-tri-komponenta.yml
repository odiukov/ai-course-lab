- concept: эвристический оценщик применим там, где эталонного ответа нет и провал распознаётся по поведению траектории
  question: Агент бродит по симулированной квартире, эталонного ответа для задачи не существует. На 15-м ходу подряд он открывает те же самые ящики и не приближается к цели. Какой тип оценки траектории здесь работает?
  explanation: 'Оценщик бывает трёх сортов: точная сверка с эталоном (бинарный сигнал), эвристика и самооценка модели. Когда эталона нет, остаётся эвристика — правило вроде «повторяет одни и те же действия N ходов, значит застрял». Она грубая, но даёт ту самую низкую оценку, по которой включается рефлексия.'
  kind: choice
  options:
    - 'Эвристика по поведению траектории: зацикливание засчитывается как провал'
    - Сравнение с эталонным ответом даёт 0 или 1
    - Оценка невозможна, попытку придётся считать успешной
    - Обучение с подкреплением по градиенту награды за каждый ход
  correct: 0
