- concept: 'цикл попытки в Reflexion: действие, оценка, вербальная рефлексия в память, повтор с рефлексией в контексте'
  question: Расставь шаги одной итерации Reflexion в порядке выполнения.
  explanation: 'Порядок важен: без сигнала оценщика рефлексировать не о чем, а без записи в память рефлексия не доедет до следующей попытки. Именно этот цикл, а не смена модели, объясняет разрыв между базлайном и Reflexion в замерах — веса на всём цикле не обновляются ни разу.'
  kind: order
  items:
    - Актор выполняет задачу и порождает траекторию действий
    - Оценщик выдаёт сигнал провала или успеха по траектории
    - Модель формулирует словесную рефлексию о причине провала
    - Рефлексия кладётся в эпизодическую память
    - Актор повторяет задачу, получив рефлексию в контексте
