- concept: 'требование повторяемости задачи: без второй попытки в той же задаче вербальная рефлексия не даёт выигрыша'
  question: Объясни своими словами, какое условие должна выполнять задача, чтобы Reflexion в принципе мог дать прирост, и почему одноразовая задача без права на повтор из этого условия выпадает.
  explanation: 'Ключ в том, что Reflexion не обучает модель, а информирует её в пределах контекста. Отсюда два ограничения сразу: нужен повтор той же задачи и нужен сигнал, по которому вообще понятно, что попытка провалена.'
  kind: open
  reference: 'Reflexion требует возможности повторной попытки над той же задачей: выигрыш возникает только тогда, когда текст рефлексии из проваленной попытки попадает в контекст следующей. Нужны также сигнал о провале (тест, эталонный ответ или отклик среды) и цена лишнего вызова модели, которую можно заплатить. Если попытка одна и повтора не будет, рефлексия писать некуда — она не влияет ни на текущий результат, ни на будущие, так как веса не обновляются и знание не переносится на другие задачи. То же касается провала, причина которого не в решениях агента: сколько ни описывай словами недоступную сеть, следующая попытка от этого не поумнеет.'
