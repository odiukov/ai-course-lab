<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Внешний круг по попыткам</title>
<style>
  :root{ --bg:#fbfbfa; --fg:#22201d; --mut:#6f6a63; --line:#3b3733; --acc:#b4531f; --ok:#1f7a4d; --fill:#efece7; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#17191c; --fg:#e9e6e1; --mut:#9d968c; --line:#c3bdb4; --acc:#e2894b; --ok:#5fc48f; --fill:#22252a; }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:1000px;margin:0 auto;padding:10px 12px 14px;}
  h2{font-size:15px;margin:0 0 8px;font-weight:600;}
  svg{width:100%;height:auto;max-height:520px;display:block;}
  .legend{color:var(--mut);font-size:12px;margin-top:6px;}
  .err{color:var(--acc);font-size:13px;}
  text{font-family:inherit;fill:var(--fg);}
</style>
</head>
<body>
<div class="wrap">
  <h2>Внешний круг по попыткам: внутренний цикл ReAct внутри, рефлексия наружу</h2>
  <svg id="s" viewBox="0 0 900 380" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Три попытки в ряд, внутри каждой цикл ReAct, стрелка рефлексии из попытки 1 в промпт попытки 2"></svg>
  <div class="legend" id="lg">
    Внутренний круг: подумал → инструмент → результат → снова подумал. Внешний круг: Actor → Evaluator → Self-Reflector → память → новая попытка с чистого листа.
  </div>
</div>
<script>
(function(){
var svg=document.getElementById("s");
try{
  // ---- данные схемы (единица данных = условная клетка) ----
  var TRIALS=[
    {id:1, x:0,  steps:"12 шагов", score:"оценка 0", refl:"свернул не туда", ok:false},
    {id:2, x:10, steps:"7 шагов",  score:"оценка 1", refl:"", ok:true},
    {id:3, x:20, steps:"не понадобилась", score:"бюджет 3", refl:"", ok:null}
  ];
  var BOXW=8, BOXH=5;              // размер карточки попытки в клетках
  var LOOP=[[2,3.4],[4,4.4],[6,3.4],[4,2.4]]; // ромб внутреннего цикла
  var ORIGIN={x:40,y:300}, SCALE=28;
  // ---- ЕДИНСТВЕННАЯ функция перевода ----
  function sx(x){ return ORIGIN.x + x*SCALE; }
  function sy(y){ return ORIGIN.y - y*SCALE; }

  var NS="http://www.w3.org/2000/svg";
  var PAD=6, FS=12, FSS=11, LW=1.6;
  function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
  function txt(x,y,s,anch,cls,size){
    var t=el("text",{x:x,y:y,"text-anchor":anch,"font-size":size||FS});
    if(cls)t.setAttribute("fill",cls);
    t.textContent=s; return t;
  }
  var defs=document.createElementNS(NS,"defs");svg.appendChild(defs);
  function marker(id,color){
    var m=document.createElementNS(NS,"marker");
    m.setAttribute("id",id);m.setAttribute("viewBox","0 0 10 10");
    m.setAttribute("refX","9");m.setAttribute("refY","5");
    m.setAttribute("markerWidth","6");m.setAttribute("markerHeight","6");
    m.setAttribute("orient","auto-start-reverse");
    var p=document.createElementNS(NS,"path");
    p.setAttribute("d","M0,1 L9,5 L0,9 z");p.setAttribute("fill",color);
    m.appendChild(p);defs.appendChild(m);
  }
  marker("ah","var(--line)"); marker("aa","var(--acc)"); marker("ao","var(--ok)");

  TRIALS.forEach(function(t){
    var stroke = t.ok===true ? "var(--ok)" : (t.ok===false ? "var(--acc)" : "var(--mut)");
    el("rect",{x:sx(t.x),y:sy(BOXH),width:sx(t.x+BOXW)-sx(t.x),height:sy(0)-sy(BOXH),
      rx:8,fill:"var(--fill)",stroke:stroke,"stroke-width":LW,
      "stroke-dasharray": t.ok===null?"5 4":"none"});

    // заголовок попытки — сверху карточки, middle
    txt(sx(t.x+BOXW/2), sy(BOXH)-PAD, "Попытка "+t.id, "middle", null, FS);

    // ромб внутреннего цикла
    var pts=LOOP.map(function(p){return sx(t.x+p[0])+","+sy(p[1]);}).join(" ");
    el("polygon",{points:pts,fill:"none",stroke:"var(--line)","stroke-width":LW,
      "marker-end":"url(#ah)"});
    txt(sx(t.x+BOXW/2), sy(3.4)+FSS/3, "ReAct", "middle", "var(--mut)", FSS);

    // подписи внутреннего цикла — по разным сторонам ромба
    txt(sx(t.x+2)-PAD, sy(3.4)+FSS/3, "думай", "end", "var(--mut)", FSS);
    txt(sx(t.x+4), sy(4.4)-PAD, "инструмент", "middle", "var(--mut)", FSS);
    txt(sx(t.x+6)+PAD, sy(3.4)+FSS/3, "результат", "start", "var(--mut)", FSS);

    // шаги — ниже ромба, оценка — у самого низа карточки
    txt(sx(t.x+BOXW/2), sy(1.55), t.steps, "middle", null, FS);
    txt(sx(t.x+BOXW/2), sy(0.6), t.score, "middle", stroke, FS);
  });

  // ---- внешняя стрелка: Self-Reflector попытки 1 -> промпт попытки 2 ----
  var y1=BOXH+1.7, xa=TRIALS[0].x+BOXW/2, xb=TRIALS[1].x+BOXW/2;
  el("path",{d:"M "+sx(xa)+" "+sy(BOXH)+" L "+sx(xa)+" "+sy(y1)+
    " L "+sx(xb)+" "+sy(y1)+" L "+sx(xb)+" "+sy(BOXH),
    fill:"none",stroke:"var(--acc)","stroke-width":LW,"marker-end":"url(#aa)"});
  // подпись у ХВОСТА стрелки, левее и выше
  txt(sx(xa)-PAD, sy(y1)-PAD, "Self-Reflector: одна строчка в память", "end", "var(--acc)", FS);
  txt(sx(xb)+PAD, sy(y1)-PAD, "в промпт попытки 2", "start", "var(--acc)", FS);

  // ---- остановка внешнего круга после попытки 2 ----
  el("path",{d:"M "+sx(TRIALS[1].x+BOXW)+" "+sy(2.5)+" L "+sx(TRIALS[2].x)+" "+sy(2.5),
    fill:"none",stroke:"var(--ok)","stroke-width":LW,"stroke-dasharray":"5 4","marker-end":"url(#ao)"});
  txt(sx((TRIALS[1].x+BOXW+TRIALS[2].x)/2), sy(2.5)+FSS*1.6, "круг остановлен", "middle", "var(--ok)", FSS);

  // ---- ось внешнего счётчика ----
  var ay=-0.9;
  el("path",{d:"M "+sx(0)+" "+sy(ay)+" L "+sx(TRIALS[2].x+BOXW)+" "+sy(ay),
    fill:"none",stroke:"var(--mut)","stroke-width":LW,"marker-end":"url(#ah)"});
  TRIALS.forEach(function(t){
    var cx=t.x+BOXW/2;
    el("path",{d:"M "+sx(cx)+" "+sy(ay)+" L "+sx(cx)+" "+sy(ay-0.3),
      fill:"none",stroke:"var(--mut)","stroke-width":LW});
    txt(sx(cx), sy(ay-0.35)+FSS, String(t.id), "middle", "var(--mut)", FSS);
  });
  txt(sx(0)-PAD, sy(ay)+FSS/3, "внешний счётчик попыток, до 3", "end", "var(--mut)", FSS);
}catch(e){
  document.getElementById("lg").innerHTML=
   '<span class="err">Схема не построилась. Она должна показывать три попытки в ряд: '+
   'внутри каждой — замкнутый цикл ReAct (думай → инструмент → результат → думай), '+
   'а из попытки 1 (12 шагов, оценка 0) наружу идёт стрелка Self-Reflector с одной строчкой рефлексии '+
   'в промпт попытки 2 (7 шагов, оценка 1). Попытка 3 не понадобилась: внешний счётчик до 3.</span>';
}
})();
</script>
</body>
</html>
