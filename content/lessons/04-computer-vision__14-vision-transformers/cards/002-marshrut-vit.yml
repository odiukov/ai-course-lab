- concept: порядок прохождения данных от изображения до предсказания класса в Vision Transformer
  question: Расположи этапы прямого прохода Vision Transformer в правильном порядке.
  explanation: Patch embedding создаёт пространственную сетку признаков, которую разворачивают в 196 токенов. После добавления [CLS] и позиционных представлений последовательность обрабатывают блоки трансформера, а классификатор получает обновлённый [CLS].
  kind: order
  items:
    - Преобразовать изображение в сетку эмбеддингов патчей
    - Развернуть сетку в последовательность токенов
    - Добавить в начало последовательности обучаемый токен [CLS]
    - Прибавить к токенам позиционные представления
    - Пропустить последовательность через блоки трансформера
    - Взять выходное представление токена [CLS]
    - Передать это представление классификатору
