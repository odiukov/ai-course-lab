- concept: порядок прохождения данных от изображения до предсказания класса в Vision Transformer
  question: Расположи этапы прямого прохода Vision Transformer в правильном порядке.
  explanation: Patch embedding создаёт пространственную сетку признаков, которую разворачивают в 196 токенов. После добавления [CLS] и позиционных представлений последовательность обрабатывают блоки трансформера, а классификатор получает обновлённый [CLS].
  kind: order
  items:
    - Преобразовать изображение в сетку эмбеддингов патчей
    - Развернуть сетку в последовательность токенов
    - Добавить в начало последовательности обучаемый токен [CLS]
    - Прибавить к токенам позиционные представления
    - Пропустить последовательность через блоки трансформера
    - Взять выходное представление токена [CLS]
    - Передать это представление классификатору
  id: 002-marshrut-vit-1
  fingerprint: 9148c768
- concept: позиционные представления сохраняют информацию о расположении патчей после превращения сетки в последовательность
  question: Зачем Vision Transformer прибавляет позиционные представления к токенам патчей перед блоками трансформера?
  explanation: После разворачивания сетки в последовательность само положение токена в ней не даёт attention надёжного знания о пространственной структуре изображения. Позиционные представления сообщают, откуда пришёл каждый патч — например, из верхней левой или нижней правой части.
  kind: choice
  options:
    - Чтобы модель различала патчи, занимавшие разные места в исходном изображении
    - Чтобы восстановить цветовые каналы изображения после patch embedding
    - Чтобы автоматически выбрать количество блоков трансформера
    - Чтобы превратить выход [CLS] в вероятности классов
  correct: 0
