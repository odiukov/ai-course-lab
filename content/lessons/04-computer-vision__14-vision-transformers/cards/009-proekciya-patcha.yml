- concept: каждый признак patch-токена вычисляется как взвешенная сумма компонентов патча со смещением
  question: Восстановите формулу одного выходного признака линейной проекции.
  explanation: Строка матрицы W задаёт отдельный набор весов для выходного признака y_j. Поэтому он может учитывать все компоненты развёрнутого патча, а не копировать одну из них.
  kind: cloze
  template: y_j = ___
  answer: Σ_i W_{ji}x_i + b_j
  accept:
    - sum_i W_ji x_i + b_j
    - b_j + Σ_i W_{ji}x_i
  id: 009-proekciya-patcha-2
  fingerprint: 1a280d39
- concept: общая проекция задаёт единое пространство признаков для всех patch-токенов
  question: Почему в Vision Transformer одну и ту же обучаемую линейную проекцию применяют ко всем патчам изображения?
  explanation: Если бы у каждого положения была собственная несвязанная проекция, одинаковые координаты разных токенов могли бы иметь разный смысл. Общие веса делают представления патчей сопоставимыми перед обработкой трансформером.
  kind: open
  reference: 'Чтобы каждый патч кодировался в общей системе признаков: одна и та же координата токена выражает один и тот же тип выученной реакции независимо от положения патча. Это также позволяет разделять параметры между всеми патчами.'
  id: 009-proekciya-patcha-3
  fingerprint: 5ce0a942
