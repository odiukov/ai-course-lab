- concept: конкурентоспособность ConvNeXt показывает, что успех современных vision-моделей определяется не только attention, но и архитектурным и обучающим рецептом
  question: Объясни своими словами, почему конкурентоспособность ConvNeXt не позволяет приписать успех современных моделей компьютерного зрения исключительно оператору attention.
  explanation: ConvNeXt переносит многие современные архитектурные и обучающие решения в CNN и достигает уровня трансформеров. Это служит свидетельством против упрощённого вывода, будто именно attention сам по себе обеспечивает преимущество.
  kind: open
  reference: 'ConvNeXt остаётся свёрточной сетью, но использует современные решения, характерные для Swin: depthwise-свёртки, LayerNorm, GELU, инвертированные бутылочные горлышки и обновлённый рецепт обучения. Если такая CNN конкурирует с трансформерами, существенная часть выигрыша связана с общей архитектурой и обучением, а не только с заменой свёртки на attention.'
