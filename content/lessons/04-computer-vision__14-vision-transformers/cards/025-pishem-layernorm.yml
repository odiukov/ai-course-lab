- concept: обучаемые gamma и beta возвращают LayerNorm возможность настраивать масштаб и сдвиг каждого признака
  question: Зачем после стандартизации в LayerNorm применяются обучаемые параметры gamma и beta?
  explanation: Стандартизация фиксирует базовые масштаб и центр признаков. Gamma и beta позволяют модели обучить подходящие масштаб и сдвиг для каждого признака. Их форма `(D,)` обеспечивает применение одной и той же настройки ко всем токенам и объектам батча.
  kind: choice
  options:
    - Чтобы вычислять общие статистики по всему батчу
    - Чтобы смешивать информацию между соседними токенами
    - Чтобы обучать отдельные масштаб и сдвиг для каждого признака
    - Чтобы менять число признаков в токене
  correct: 2
  id: 025-pishem-layernorm-1
  fingerprint: 850bdd74
- concept: eps добавляется к дисперсии под квадратным корнем для численной устойчивости LayerNorm
  question: Заполни знаменатель в реализации численно устойчивого LayerNorm.
  explanation: Добавление eps к дисперсии до извлечения корня не позволяет знаменателю обратиться в ноль для почти постоянного токена. Из-за eps дисперсия нормализованного результата может быть немного меньше единицы.
  kind: cloze
  template: y = gamma * (x - mean) / ___ + beta
  answer: sqrt(var + eps)
  accept:
    - np.sqrt(var + eps)
    - torch.sqrt(var + eps)
    - (var + eps) ** 0.5
  id: 025-pishem-layernorm-2
  fingerprint: f4eab3b7
