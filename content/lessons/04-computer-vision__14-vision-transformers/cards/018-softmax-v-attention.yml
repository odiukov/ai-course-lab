- concept: softmax зависит от относительных различий между оценками и не меняется при общем сдвиге
  question: Ко всем оценкам внимания одного query-токена прибавили одну и ту же константу. Как изменятся полученные после softmax веса?
  explanation: Общий множитель, возникающий после экспоненцирования сдвинутых оценок, сокращается между числителем и знаменателем softmax. Поэтому важны различия между оценками, а не их абсолютный уровень.
  kind: choice
  options:
    - Все веса увеличатся на эту константу
    - Распределение весов не изменится
    - Веса станут одинаковыми
    - Появятся отрицательные веса
  correct: 1
  id: 018-softmax-v-attention-1
  fingerprint: c85d611e
- concept: softmax нормализует оценки отдельно для каждого query-токена
  question: Почему в self-attention softmax применяют отдельно к набору оценок каждого query-токена, а не ко всей матрице оценок сразу?
  explanation: Строка матрицы внимания описывает, как один query-токен распределяет внимание между всеми key-токенами. Поэтому сумма весов должна нормироваться независимо в каждой строке.
  kind: open
  reference: Каждый query-токен должен получить собственное распределение внимания по key-токенам. Отдельная нормализация делает веса в каждой строке положительными и суммирующимися в единицу; глобальная нормализация заставила бы разные query-токены конкурировать за общий вес.
  id: 018-softmax-v-attention-2
  fingerprint: f94ea523
