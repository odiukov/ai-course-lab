- concept: linear probe оценивает готовые признаки, а fine-tuning адаптирует encoder под новую задачу
  question: Объясни своими словами, чем linear probe отличается от полного fine-tuning предобученного ViT и что позволяет оценить каждый подход.
  explanation: Замороженный encoder делает linear probe дешёвой диагностикой переносимости готовых признаков. Fine-tuning обычно даёт модели больше возможностей, поскольку меняет и классификатор, и само представление изображения.
  kind: open
  reference: При linear probe параметры encoder заморожены и обучается только новая линейная голова, поэтому результат показывает, насколько полезны уже сформированные признаки. При полном fine-tuning обновляются также параметры encoder, поэтому модель адаптирует признаки под новую задачу, но итог уже не изолирует качество исходного представления.
  id: 041-itogovaya-proverka-3
  fingerprint: a8561f80
