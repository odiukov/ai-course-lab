- concept: MAE предобучает ViT восстановлением скрытых патчей изображения
  question: Заполни пропуск в описании цели предобучения MAE.
  explanation: MAE скрывает большую часть патчей и обучает модель реконструировать их по оставшимся. Метки классов для такого self-supervised предобучения не требуются.
  kind: cloze
  template: Encoder MAE обрабатывает видимые патчи, а модель учится ___.
  answer: восстанавливать содержимое замаскированных патчей
  accept:
    - восстановить замаскированные патчи
    - реконструировать скрытые патчи
    - предсказывать содержимое скрытых патчей
