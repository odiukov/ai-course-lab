- concept: LayerNorm вычисляет статистики отдельно для каждого токена по оси его признаков
  question: 'Тензор токенов имеет форму (B, T, D): батч, последовательность и признаки. По каким элементам стандартный LayerNorm с normalized_shape=D вычисляет среднее и дисперсию?'
  explanation: LayerNorm редуцирует последнюю ось D. У каждого токена получаются собственные среднее и дисперсия, поэтому статистики соседних токенов и других элементов батча не смешиваются.
  kind: choice
  options:
    - Отдельно для каждой пары (элемент батча, токен) по оси D
    - Для каждого признака по всем токенам оси T
    - Для каждой позиции токена по всей оси B
    - Одновременно по всем элементам тензора
  correct: 0
  id: 024-layernorm-1
  fingerprint: e425a107
- concept: нормализованное значение признака определяется средним и стандартным отклонением внутри одного токена
  question: Один токен до обучаемого масштабирования и сдвига представлен признаками [16, 22, 28, 34]. Игнорируя малую добавку epsilon, чему равно нормализованное значение последнего признака? Используй дисперсию как среднее квадратов отклонений.
  explanation: Среднее признаков этого токена равно 25, а дисперсия — 45. Поэтому нормализованное значение последнего признака равно (34 − 25) / sqrt(45) ≈ 1.34. Признаки других токенов в вычислении не участвуют.
  kind: numeric
  answer: 1.34
  tolerance: 0.02
  id: 024-layernorm-2
  fingerprint: 908aa0d6
