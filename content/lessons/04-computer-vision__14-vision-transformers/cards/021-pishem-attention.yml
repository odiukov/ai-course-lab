  fingerprint: d2da251c
- concept: результат attention для каждого запроса является выпуклой комбинацией векторов значений
  question: Почему обычный scaled dot-product attention не может выдать для отдельного запроса вектор, лежащий вне выпуклой оболочки соответствующих векторов V?
  explanation: После softmax все веса неотрицательны и в строке дают единичную сумму. Поэтому attention интерполирует между векторами значений, а не создаёт произвольную точку вне их выпуклой оболочки.
  kind: open
  reference: Softmax превращает оценки ключей в неотрицательные веса с единичной суммой. Результат для запроса — взвешенная сумма векторов V с такими весами, то есть их выпуклая комбинация.
  id: 021-pishem-attention-2
  fingerprint: cb985bfe
- concept: одинаковые векторы значений проходят через attention без изменения независимо от распределения весов
  question: Заполни формулу для случая, когда каждому ключу соответствует один и тот же вектор значения v.
  explanation: Взвешенная сумма одинаковых векторов равна v, поскольку сумма весов softmax равна единице. Это свойство удобно проверять при тестировании реализации attention.
  kind: cloze
  template: Если V_j = v для любого ключа j, то Attention(Q, K, V)_i = ___ для любого запроса i.
  answer: v
  accept:
    - v
    - вектор v
  id: 021-pishem-attention-3
