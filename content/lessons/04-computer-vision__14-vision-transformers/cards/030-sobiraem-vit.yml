  fingerprint: ee44254b
- concept: одинаковая архитектура encoder-блоков не означает совместное использование параметров
  question: В PyTorch стек создаётся как `nn.ModuleList([Block(dim, num_heads, mlp_ratio) for _ in range(depth)])`. Означают ли одинаковые аргументы конструктора, что все encoder-блоки используют общие веса? Объясни своими словами.
  explanation: Блоки одинаковы по устройству, но обучаются независимо. Поэтому разные уровни стека могут освоить разные преобразования токенов.
  kind: open
  reference: Нет. Каждый вызов `Block(...)` создаёт отдельный экземпляр модуля со своими обучаемыми параметрами. Общие веса появились бы только при повторном использовании одного и того же экземпляра блока или при явном связывании параметров.
  id: 030-sobiraem-vit-2
  fingerprint: 82795fa5
