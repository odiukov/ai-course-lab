- concept: способ сбора информации в CLS-токен обучается, а не задаётся фиксированным правилом
  question: Объясни своими словами, почему итоговый CLS-токен нельзя считать заранее заданным средним всех patch-токенов.
  explanation: Фиксированное среднее придавало бы всем патчам заранее определённый одинаковый вклад. CLS-токен участвует во внимании, поэтому полезный способ объединения локальных признаков формируется во время обучения.
  kind: open
  reference: CLS-токен обновляется внутри блоков трансформера через обучаемый механизм внимания и нелинейные преобразования. Модель сама настраивает, какие признаки и из каких патчей использовать, поэтому итоговое представление не является фиксированным усреднением.
  id: 012-cls-token-2
  fingerprint: 7366b233
