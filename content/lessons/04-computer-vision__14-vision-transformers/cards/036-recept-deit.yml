- concept: stochastic depth регуляризует ViT случайным обходом целых encoder-блоков во время обучения
  question: Как stochastic depth применяется при обучении Vision Transformer?
  explanation: Stochastic depth временно отключает целые преобразующие блоки, а остаточный путь позволяет передать представление дальше. Так сеть учится работать с разными вычислительными маршрутами и меньше переобучается.
  kind: choice
  options:
    - Случайно пропускает целые encoder-блоки, сохраняя остаточный путь
    - Случайно удаляет отдельные пиксели до разбиения изображения на патчи
    - Уменьшает ширину всех токенов на каждой следующей эпохе
    - Исключает из батча изображения, которые модель уже классифицирует уверенно
  correct: 0
  id: 036-recept-deit-2
  fingerprint: e130575e
- concept: мягкие предсказания CNN-учителя передают DeiT информацию о сходстве классов
  question: Почему при дистилляции распределение вероятностей CNN-учителя может быть полезнее для DeiT, чем одна жёсткая метка правильного класса?
  explanation: 'Жёсткая метка сообщает лишь правильный класс, тогда как вероятности учителя содержат дополнительную структуру: какие альтернативы похожи на объект и насколько. DeiT может использовать этот сигнал как дополнительное руководство при обучении.'
  kind: open
  reference: Распределение учителя показывает не только выбранный класс, но и относительную правдоподобность остальных классов. Эти мягкие цели передают информацию о сходстве и возможной путанице между классами, помогая ViT лучше обобщать.
  id: 036-recept-deit-3
  fingerprint: d20df2da
