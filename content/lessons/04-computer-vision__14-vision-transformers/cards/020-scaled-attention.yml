- concept: ключ определяет, как токен находят, а значение — какую информацию он передаёт
  question: В self-attention нужно сделать некоторый токен легче выбираемым другими запросами, не меняя передаваемую им информацию. Какое представление этого токена следует изменить?
  explanation: Запросы сравниваются с Key каждого токена, поэтому изменение Key влияет на вес, который токен получит. Value содержит передаваемую информацию, а Query определяет, какие токены ищет он сам.
  kind: choice
  options:
    - Key
    - Value
    - Query
  correct: 0
  id: 020-scaled-attention-1
  fingerprint: 4f7f825a
- concept: логит внимания масштабируется делением скалярного произведения на квадратный корень из размерности ключа
  question: Для пары query и key скалярное произведение равно 30, а размерность ключа d_k равна 36. Чему равен масштабированный логит до softmax?
  explanation: Масштабированный логит равен (q·k)/√d_k. Поэтому 30/√36 = 30/6 = 5. Деление сдерживает рост логитов при увеличении размерности ключей.
  kind: numeric
  answer: 5
  tolerance: 0.01
  id: 020-scaled-attention-2
  fingerprint: 5d1246cd
- concept: порядок вычисления scaled dot-product attention
  question: Расположите операции scaled dot-product attention в правильном порядке.
  explanation: Сначала строятся запросы, ключи и значения. Сходство запросов с ключами вычисляется и масштабируется, затем softmax превращает оценки в веса, а умножение на V формирует взвешенную смесь передаваемой информации.
  kind: order
  items:
    - Получить Q, K и V из входных токенов
    - Вычислить матрицу скалярных произведений QKᵀ
    - Разделить оценки на √d_k
    - Применить softmax по ключам отдельно для каждого запроса
    - Умножить полученные веса на V
  id: 020-scaled-attention-3
  fingerprint: 4049bd00
