- concept: агрегация через CLS-токен без позиционной информации инвариантна к перестановке patch-токенов
  question: Объясни своими словами, почему перестановка patch-токенов не меняет итоговое представление CLS-токена в трансформере без позиционных признаков и зависящих от порядка масок.
  explanation: Attention CLS-токена вычисляет веса по содержимому patch-токенов и суммирует соответствующие значения. При перестановке патчей веса и значения переставляются согласованно, поэтому сумма и итоговый CLS-вектор не меняются.
  kind: open
  reference: Перестановка не меняет набор ключей и значений patch-токенов, доступных CLS-токену. Она лишь переупорядочивает слагаемые в его взвешенной сумме, а потому результат агрегации остаётся тем же.
  id: 013-poziciya-patcha-2
  fingerprint: c5730256
