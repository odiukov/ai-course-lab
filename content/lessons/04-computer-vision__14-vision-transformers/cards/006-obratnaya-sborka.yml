- concept: неоднозначность пространственной формы при известном только количестве токенов
  question: Почему длины последовательности патч-токенов недостаточно, чтобы однозначно восстановить форму пространственной сетки? Объясни, какие дополнительные сведения нужны.
  explanation: Длина последовательности задаёт только произведение числа строк и столбцов. Пространственная форма определяется дополнительными данными о геометрии разбиения, а соответствие индексов ячейкам — порядком обхода.
  kind: open
  reference: Одно и то же количество токенов можно разложить в несколько прямоугольных сеток. Чтобы выбрать правильное число строк и столбцов, нужны размеры исходного изображения и патчей либо явно сохранённые размеры сетки; также для размещения токенов необходимо знать порядок обхода патчей.
  id: 006-obratnaya-sborka-2
