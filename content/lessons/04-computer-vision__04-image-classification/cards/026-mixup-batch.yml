- concept: случайная перестановка использует каждый элемент батча ровно один раз в роли партнёра
  question: В Mixup партнёров выбирают с помощью `torch.randperm`, а не независимым случайным выбором для каждого изображения. Что гарантирует перестановка?
  explanation: '`randperm` возвращает все индексы батча без повторений, поэтому каждый пример используется как партнёр ровно один раз. При этом перестановка не учитывает классы и может оставить некоторые индексы на прежних местах.'
  kind: choice
  options:
    - Каждый элемент батча окажется партнёром ровно для одного исходного элемента
    - Каждый элемент обязательно получит партнёра другого класса
    - Ни один элемент не сможет оказаться партнёром самому себе
    - Все возможные пары будут встречаться одинаково часто
  correct: 0
  id: 026-mixup-batch-1
  fingerprint: 941d3a29
- concept: веса двух компонентов смеси дополняют друг друга до единицы
  question: Заполните пропуск так, чтобы `x_mixed` оставался взвешенной смесью исходного батча и его переставленной копии.
  explanation: В Mixup веса компонентов должны суммироваться до единицы. Поэтому доле `lam` исходного изображения соответствует доля `1 - lam` изображения-партнёра.
  kind: cloze
