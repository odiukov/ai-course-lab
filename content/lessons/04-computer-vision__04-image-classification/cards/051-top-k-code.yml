- concept: Top-k accuracy можно вычислять непосредственно по логитам, поскольку softmax сохраняет их порядок
  question: Перед вычислением Top-k accuracy разработчик применяет softmax к логитам. Что произойдёт, если убрать эту операцию и выбирать лучшие классы непосредственно по логитам?
  explanation: Softmax преобразует значения, но не меняет порядок логитов внутри строки. Поэтому набор классов с наибольшими оценками остаётся тем же, и для Top-k достаточно сырых логитов.
  kind: choice
  options:
    - Метрика не изменится, а лишнее вычисление исчезнет
    - Метрика превратится в оценку калибровки
    - Лучшие классы будут выбраны в обратном порядке
  correct: 0
  id: 051-top-k-code-1
  fingerprint: ed3d7812
- concept: целевая метка расширяется по оси кандидатов для построчного сравнения с индексами лучших классов
  question: Заполни пропуск так, чтобы каждая целевая метка сравнивалась только с кандидатами соответствующего объекта батча.
  explanation: Добавленная ось позволяет broadcasting сопоставить одну метку со всеми кандидатами её строки. Затем any сворачивает ось кандидатов, а mean вычисляет долю объектов с попаданием.
  kind: cloze
  template: |-
    candidate_axis = logits.ndim - targets.ndim
    top_indices = logits.topk(k, dim=candidate_axis).indices
    matches = top_indices.eq(targets___)
    accuracy = matches.any(dim=candidate_axis).float().mean()
  answer: '[:, None]'
  accept:
    - '[..., None]'
  id: 051-top-k-code-2
  fingerprint: 0d496283
