- concept: пересечение обучающей и валидационной выборок завышает оценку качества
  question: Почему попадание обучающих изображений в валидационную выборку делает измеренную точность ненадёжной?
  explanation: Валидация должна имитировать работу на невиданных данных. Утечка примеров из обучения нарушает независимость проверки и маскирует реальное качество модели.
  kind: open
  reference: Модель уже обучалась на части проверочных изображений и может узнавать их особенности, поэтому результат завышает способность обобщать на действительно новые данные.
  id: 002-bagi-pipeline-2
  fingerprint: 70c7b023
- concept: аугментация должна сохранять соответствие изображения исходной метке
  question: Какое свойство преобразования данных важнее всего проверить перед его включением в обучение классификатора?
  explanation: Если аугментация меняет смысл изображения, но оставляет прежнюю метку, модель получает противоречивые обучающие пары. Она может успешно уменьшать loss на этих данных, однако хуже решать исходную задачу.
  kind: choice
  options:
    - Преобразование заметно усложняет изображение
    - Преобразование сохраняет объект в пределах класса, указанного меткой
    - Преобразование применяется только после вычисления loss
    - Преобразование всегда увеличивает размер изображения
  correct: 1
