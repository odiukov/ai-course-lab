- concept: повторяющиеся метки сохраняются как отдельные элементы батча
  question: Некоторые метки в батче совпадают. Как это должно отразиться на результате one_hot?
  explanation: one_hot преобразует каждый элемент батча независимо и не удаляет повторы. Поэтому одинаковые метки дают одинаковые строки, а число и порядок строк остаются прежними.
  kind: choice
  options:
    - Соответствующие строки будут одинаковыми, но каждая останется на своей позиции в батче
    - Совпадающие метки нужно объединить в одну строку
    - В одной из совпадающих строк нужно перенести активную позицию в свободный столбец
    - Все строки результата нужно отсортировать по номеру класса
  correct: 0
  id: 013-one-hot-code-1
  fingerprint: 53a44a9c
- concept: ширина one-hot представления задаётся полным пространством классов, а не составом текущего батча
  question: Почему ширину результата one_hot нельзя определять только по максимальной метке, встретившейся в текущем батче?
  explanation: Если строить ширину по наблюдаемым меткам, форма целей начнёт зависеть от состава батча и может перестать совпадать с числом выходов классификатора. Параметр num_classes фиксирует единое пространство классов.
  kind: open
  reference: В отдельном батче могут отсутствовать классы, которые всё равно входят в задачу классификации. Ширина должна задаваться общим числом классов и оставаться одинаковой для всех батчей.
  id: 013-one-hot-code-2
  fingerprint: 3b8a47e5
