- concept: явный локальный генератор изолирует случайность аугментации от посторонних вызовов
  question: Почему аугментациям изображений лучше передавать отдельный np.random.Generator, а не обращаться к глобальному np.random?
  explanation: Генератор хранит состояние, которое меняется при каждом запросе случайного значения. Если аугментация использует общий источник, любой посторонний вызов изменит её будущие решения. Отдельный явно переданный rng делает эту зависимость контролируемой.
  kind: choice
  options:
    - Отдельный генератор автоматически ускоряет преобразования
    - Посторонние вызовы глобального np.random могут сдвинуть последовательность и изменить последующие аугментации
    - Глобальный np.random не умеет генерировать случайные целые числа
    - Отдельный генератор гарантирует одинаковое преобразование всех изображений
  correct: 1
  id: 021-randomness-1
  fingerprint: '94046356'
- concept: одинаковый seed воспроизводит результаты только при одинаковой последовательности обращений к генератору
  question: Два запуска создают генераторы с одинаковым seed, но в одном запуске перед случайной обрезкой выполняется дополнительный запрос к генератору. Будут ли последующие обрезки совпадать? Объясни своими словами.
  explanation: Seed фиксирует начало последовательности, а не результат каждой операции независимо. Для полного воспроизведения должны совпадать также порядок и количество обращений к rng.
  kind: open
  reference: Нет. Одинаковый seed задаёт одинаковую исходную последовательность, но дополнительный запрос сдвигает состояние одного генератора. После этого одинаковые операции получают разные случайные значения.
  id: 021-randomness-2
  fingerprint: ba7671f3
- concept: генератор следует создавать один раз на запуск, чтобы случайные преобразования различались между примерами
  question: Что произойдёт, если перед обработкой каждого изображения заново создавать np.random.default_rng с одним и тем же seed?
  explanation: Повторная инициализация одним seed каждый раз возвращает генератор в начальное состояние. Поэтому первые решения для разных изображений повторяются. Один rng на весь запуск сохраняет воспроизводимость, но позволяет состоянию последовательно изменяться.
  kind: choice
  options:
    - Каждое изображение начнёт с одного и того же состояния генератора и будет получать одинаковую последовательность случайных решений
    - Генератор продолжит последовательность, начатую на предыдущем изображении
    - Аугментация станет невоспроизводимой из-за частого задания seed
    - Вероятности преобразований автоматически подстроятся под содержимое изображения
  correct: 0
