- concept: классификатор отображает пиксели изображения в распределение вероятностей по классам
  question: Что является результатом работы классификатора изображений до выбора итоговой метки?
  explanation: Классификатор преобразует числовые значения пикселей в вероятность каждого класса. Итоговую метку обычно получают, выбирая класс с наибольшей вероятностью.
  kind: choice
  options:
    - Координаты всех объектов на изображении
    - Распределение вероятностей по доступным классам
    - Текстовое описание содержимого изображения
    - Копия изображения с выделенными признаками
  correct: 1
  id: 001-zadacha-1
  fingerprint: a9e20ffa
- concept: полное распределение вероятностей показывает уверенность, которую скрывает итоговая метка
  question: Два изображения получили одну и ту же итоговую метку. Почему модель при этом может быть гораздо увереннее в классификации одного изображения, чем другого?
  explanation: Одинаковый результат argmax не означает одинаковую уверенность. Для её оценки нужно рассматривать всё распределение вероятностей или хотя бы разрыв между двумя наиболее вероятными классами.
  kind: open
  reference: Итоговая метка показывает только класс с максимальной вероятностью. У уверенного предсказания вероятность победившего класса заметно превосходит вероятности остальных, а у неуверенного несколько классов могут иметь близкие вероятности.
  id: 001-zadacha-2
  fingerprint: d5f76478
