- concept: softmax не меняется при прибавлении одной константы ко всем логитам
  question: Какое преобразование всех логитов гарантированно оставит распределение softmax без изменений?
  explanation: При общем сдвиге каждый экспоненциальный вес умножается на одинаковый множитель. Он сокращается при делении на сумму весов, поэтому вероятности не меняются.
  kind: choice
  options:
    - Прибавить к каждому логиту одну и ту же константу
    - Умножить каждый логит на одну и ту же положительную константу
    - Возвести каждый логит в квадрат
    - Поменять знак каждого логита
  correct: 0
  id: 007-softmax-formula-1
  fingerprint: a37d994d
- concept: отношение двух вероятностей softmax определяется разностью соответствующих логитов
  question: Заполни пропуск в формуле отношения вероятностей двух классов после softmax.
  explanation: 'Общий знаменатель softmax сокращается: exp(z_a) / exp(z_b) = exp(z_a − z_b). Поэтому относительные вероятности зависят от расстояний между логитами, а не от их абсолютного уровня.'
  kind: cloze
  template: softmax(z)_a / softmax(z)_b = ___
  answer: exp(z_a - z_b)
  accept:
    - e^(z_a - z_b)
    - exp(z_a-z_b)
    - e^(z_a-z_b)
  id: 007-softmax-formula-2
  fingerprint: acd17e9d
