- concept: общие веса CNN дают переносимость признаков по координатам, но не автоматическую устойчивость к отражению
  question: CNN распознаёт объект после его сдвига в кадре, но ошибается после горизонтального отражения. Почему это не противоречит свойствам свёртки?
  explanation: Один фильтр применяется во всех участках изображения, поэтому знакомый признак можно обнаружить после сдвига. Однако отражённый признак имеет другую конфигурацию пикселей, и общие веса сами по себе не делают сеть инвариантной к такому преобразованию.
  kind: choice
  options:
    - Общие фильтры ищут один и тот же признак в разных координатах, но отражение меняет локальную геометрию пикселей, устойчивость к которой нужно выучить отдельно
    - Свёртка гарантирует устойчивость к отражению, поэтому причина может быть только в функции потерь
    - Горизонтальное отражение всегда превращает изображение в другой класс
    - Общие веса действуют только во время оценки, но не во время обучения
  correct: 0
  id: 017-augmentation-1
  fingerprint: cdcc1fa8
- concept: аугментация создаёт обучающий сигнал для устойчивости к преобразованиям, отсутствующим в исходной выборке
  question: В обучающей выборке объект всегда виден целиком, а при применении модели он часто частично перекрыт. Объясни, почему дополнительные эпохи на тех же изображениях не научат модель устойчивости к перекрытиям и как RandomErasing может изменить обучение.
  explanation: Инвариантность нельзя получить только многократным просмотром одинаковых пикселей. Случайное стирание добавляет варианты с недостающими областями и вынуждает классификатор опираться на признаки, сохраняющиеся при частичном перекрытии.
  kind: open
  reference: Повторение неизменных изображений не даёт модели примеров, показывающих, какие признаки остаются надёжными при перекрытии. RandomErasing случайно скрывает участки обучающих изображений, поэтому модель получает сигнал искать несколько распределённых признаков объекта и меньше зависеть от одного видимого фрагмента.
  id: 017-augmentation-2
  fingerprint: 70b3fad6
