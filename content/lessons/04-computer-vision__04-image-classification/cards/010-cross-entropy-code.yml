- concept: батчевая кросс-энтропия с редукцией mean является средним индивидуальных потерь
  question: Индивидуальные потери объектов батча равны `0.24`, `0.52`, `0.91` и `1.37`. Какой loss вернёт кросс-энтропия с редукцией `mean`?
  explanation: 'Сначала складываются индивидуальные потери: `0.24 + 0.52 + 0.91 + 1.37 = 3.04`. Затем сумма делится на количество объектов: `3.04 / 4 = 0.76`.'
  kind: numeric
  answer: 0.76
  tolerance: 0.001
