- concept: ECE является взвешенным по размеру групп средним абсолютных разрывов между уверенностью и точностью
  question: 'В первую группу попали 35% прогнозов: средняя уверенность в ней равна 84%, а доля правильных ответов — 72%. Во вторую попали остальные 65%: уверенность равна 63%, а доля правильных ответов — 57%. Чему равен ECE в процентных пунктах?'
  explanation: Абсолютные разрывы равны 12 и 6 процентным пунктам. С учётом размеров групп ECE = 0.35 × 12 + 0.65 × 6 = 8.1 процентного пункта.
  kind: numeric
  answer: 8.1
  tolerance: 0.05
  id: 052-calibration-2
  fingerprint: d4566ee6
- concept: хорошая калибровка не гарантирует высокую точность классификатора
  question: Объясни своими словами, как классификатор может быть хорошо откалиброван, но при этом часто ошибаться.
  explanation: Accuracy измеряет долю правильных меток, а калибровка — соответствие заявленной уверенности наблюдаемой частоте успеха. Это разные свойства модели.
  kind: open
  reference: Калибровка требует, чтобы среди прогнозов с некоторой уверенностью доля правильных ответов примерно совпадала с этой уверенностью. Она не требует, чтобы сама уверенность и частота успеха были высокими, поэтому модель может честно сообщать о своей невысокой надёжности.
  id: 052-calibration-3
  fingerprint: 835e6cc2
