- concept: повторяющиеся пары истинного и предсказанного классов можно накопить через подсчёт линейных индексов
  question: Заполни пропуск в векторизованной реализации confusion matrix на PyTorch.
  explanation: Выражение y_true * C + y_pred сопоставляет каждой паре классов отдельный линейный индекс. bincount подсчитывает все повторения индексов, а reshape возвращает матрицу со строками истинных классов.
  kind: cloze
  template: |-
    flat = y_true * C + y_pred
    cm = torch.___(flat, minlength=C * C).reshape(C, C)
  answer: bincount
  accept:
    - bincount
    - torch.bincount
  id: 045-confusion-matrix-code-2
  fingerprint: 5416fdcd
- concept: сумма элементов confusion matrix равна числу учтённых объектов
  question: Объясни, почему сумма всех элементов confusion matrix должна совпадать с числом обработанных объектов и о чём говорит несовпадение.
  explanation: Confusion matrix распределяет объекты по взаимоисключающим парам «истинный класс — предсказанный класс». Поэтому каждый объект вносит в общую сумму ровно одну отметку.
  kind: open
  reference: Каждый объект должен увеличить ровно одну ячейку, соответствующую паре из истинного и предсказанного классов. Меньшая сумма означает потерю части объектов, а большая — повторный учёт некоторых объектов.
  id: 045-confusion-matrix-code-3
  fingerprint: f16e1ec6
