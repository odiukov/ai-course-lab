- concept: точность класса считается только по объектам с истинной меткой этого класса
  question: В проверочной выборке есть 32 изображения лисы. Классификатор верно распознал 20 из них. Чему равна per-class accuracy для класса «лиса» в процентах?
  explanation: 'Для выбранного класса делят число верно распознанных объектов на общее число объектов этого истинного класса: 20 / 32 × 100% = 62,5%.'
  kind: numeric
  answer: 62.5
  tolerance: 0.01
  id: 043-beyond-accuracy-1
  fingerprint: f82be113
- concept: общая accuracy взвешивает качество классов пропорционально числу их объектов
  question: После обновления модели общая accuracy выросла, хотя per-class accuracy редкого класса снизилась. Объясни, почему эти результаты не противоречат друг другу.
  explanation: Общая accuracy агрегирует ответы по всем объектам и потому зависит от частот классов. Улучшение на многочисленном классе способно скрыть ухудшение на редком, которое становится заметно только по отдельным оценкам классов.
  kind: open
  reference: Общая accuracy учитывает каждый объект с одинаковым весом, поэтому многочисленный класс сильнее влияет на итог. Дополнительные правильные ответы частого класса могли перевесить ошибки редкого класса.
  id: 043-beyond-accuracy-2
  fingerprint: fe28a688
