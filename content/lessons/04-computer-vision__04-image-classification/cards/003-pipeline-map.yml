- concept: правильная последовательность операций одного шага обучения классификатора
  question: Расположи операции шага обучения классификатора в правильном порядке.
  explanation: Старые градиенты очищают до нового прямого прохода. Затем вычисляют логиты и loss, через backward получают градиенты, оптимизатор изменяет параметры, а планировщик задаёт величину следующего шага.
  kind: order
  items:
    - Очистить градиенты оптимизатора
    - Получить логиты модели для пакета изображений
    - Вычислить кросс-энтропийную потерю по логитам и меткам
    - Выполнить обратный проход
    - Обновить параметры модели оптимизатором
    - Обновить расписание learning rate
  id: 003-pipeline-map-1
  fingerprint: b8c1bc7b
- concept: при оценке классификатора выполняется прямой проход без изменения параметров
  question: Объясни своими словами, чем путь пакета изображений при оценке модели отличается от пути при обучении.
  explanation: Во время обучения loss порождает градиенты, по которым оптимизатор меняет параметры. При оценке нужны только выход модели и выбор класса; backward и обновление параметров пропускаются.
  kind: open
  reference: При оценке модель выполняет прямой проход, выдаёт логиты, и предсказанный класс выбирается через argmax. Обратный проход и шаг оптимизатора не выполняются, поэтому параметры модели не изменяются.
  id: 003-pipeline-map-2
  fingerprint: 09e1dbfd
