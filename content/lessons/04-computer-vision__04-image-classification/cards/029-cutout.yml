- concept: вклад Cutout измеряют абляцией при неизменных остальных условиях обучения
  question: Объясните своими словами, как поставить эксперимент, который отделит влияние Cutout от влияния других аугментаций.
  explanation: В абляции между сравниваемыми вариантами должен меняться только исследуемый компонент. Сравнение hflip+crop и hflip+crop+cutout позволяет связать разницу в валидационном качестве именно с Cutout.
  kind: open
  reference: Обучить одинаковые модели с одинаковыми данными, гиперпараметрами и базовыми аугментациями, изменив только наличие Cutout, а затем сравнить их качество на одной и той же неизменяемой валидационной выборке.
  id: 029-cutout-2
  fingerprint: 5d31e712
