- concept: при k, равном числу классов, Top-k становится тривиальной и не различает модели
  question: Объясни своими словами, почему Top-k теряет диагностическую ценность, если k равно полному числу классов C.
  explanation: Увеличение k ослабляет критерий успеха. При k = C правильный класс всегда присутствует в списке, поэтому такая метрика скрывает различия между сильной и слабой моделями.
  kind: open
  reference: Список из C кандидатов содержит каждый возможный класс, поэтому истинная метка неизбежно попадает в него для любого объекта. Метрика становится максимальной даже у бесполезной модели и ничего не сообщает о качестве ранжирования.
  id: 050-top-k-2
  fingerprint: 368da0be
