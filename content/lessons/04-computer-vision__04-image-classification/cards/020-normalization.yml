- concept: стандартизация делит отклонение пикселя от среднего на стандартное отклонение соответствующего канала
  question: Заполни пропуск в коде стандартизации, если среднее и разброс уже вычислены по обучающему датасету.
  explanation: Вычитание среднего центрирует значения каждого канала около нуля, а деление на его стандартное отклонение приводит каналы к сопоставимому масштабу.
