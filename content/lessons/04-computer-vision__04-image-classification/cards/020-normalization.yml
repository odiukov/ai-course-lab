- concept: статистики другого датасета могут систематически сместить и неверно масштабировать входы модели
  question: Объясни своими словами, почему для нового набора изображений нельзя автоматически брать средние и стандартные отклонения из другого датасета, даже если формат изображений и набор каналов совпадают.
  explanation: Совпадение формы тензоров не означает совпадения распределений пикселей. Нормализация должна отражать статистики конкретной обучающей выборки.
  kind: open
  reference: Распределения пикселей в датасетах могут различаться по яркости, цветовому балансу и контрасту. Чужие средние неверно центрируют каналы, а чужие стандартные отклонения неверно задают их масштаб, поэтому модель получает систематически смещённые входы.
  id: 020-normalization-3
