- concept: безопасный отчёт заменяет неопределённые метрики отсутствующего класса нулём вместо NaN
  question: Объясните, как должна вести себя реализация отчёта, если некоторого класса нет среди истинных меток и модель ни разу его не предсказала.
  explanation: У такого класса нет ни истинно положительных результатов, ни объектов или предсказаний, образующих знаменатели. Без защиты возникает деление нуля на ноль; безопасный знаменатель сохраняет конечные нулевые значения.
  kind: open
  reference: Знаменатели нужно защитить от деления на ноль, например ограничить их снизу положительным значением. Тогда precision, recall и F1 для такого класса будут нулевыми, а не NaN, и весь отчёт останется пригодным для дальнейшей обработки.
  id: 048-class-report-code-2
  fingerprint: 569bc6f5
