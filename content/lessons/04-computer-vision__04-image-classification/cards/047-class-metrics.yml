- concept: F1 является гармоническим средним precision и recall
  question: Для выбранного класса precision модели равен 0.72, а recall — 0.45. Чему примерно равен F1?
  explanation: F1 — гармоническое среднее precision и recall. Для значений 0.72 и 0.45 оно равно примерно 0.554. Более низкий recall заметно ограничивает итоговую оценку, несмотря на более высокий precision.
