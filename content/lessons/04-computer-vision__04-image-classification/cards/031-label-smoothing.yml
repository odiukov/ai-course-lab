- concept: label smoothing препятствует чрезмерному заострению логитов и снижает переуверенность модели
  question: Объясни своими словами, почему при label smoothing модели невыгодно делать логит правильного класса сколь угодно больше остальных.
  explanation: При жёсткой one-hot-цели увеличение вероятности правильного класса постоянно уменьшает loss. Label smoothing задаёт ненулевую целевую массу и другим классам, поэтому чрезмерно острое распределение уже расходится с целью и модель обычно становится лучше откалиброванной.
  kind: open
  reference: Сглаженная цель оставляет ненулевую вероятность альтернативным классам. Если модель стягивает почти всю вероятность к одному классу, кросс-энтропия сильнее штрафует расхождение с этой мягкой целью, поэтому бесконечное увеличение разрывов между логитами перестаёт быть выгодным.
  id: 031-label-smoothing-2
  fingerprint: 363bdb3b
