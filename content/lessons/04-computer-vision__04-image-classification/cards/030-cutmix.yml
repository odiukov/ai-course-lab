- concept: вес класса вставленного изображения в CutMix определяется фактической площадью прямоугольника после обрезки по границам
  question: Изображение имеет размер 64 × 48 пикселей. В него вставляют прямоугольник с полуинтервалами координат x ∈ [52, 76) и y ∈ [9, 33), обрезая вышедшую за границы часть. Какой вес должен получить класс вставленного изображения?
  explanation: После обрезки ширина вставки равна 64 − 52 = 12, а высота — 33 − 9 = 24. Фактическая доля площади равна (12 × 24) / (64 × 48) = 0.09375. Именно этот вес получает класс вставленного изображения.
  kind: numeric
  answer: 0.09375
  tolerance: 0.0001
  id: 030-cutmix-1
  fingerprint: e2e58f2d
- concept: CutMix использует площадь как независимую от содержимого геометрическую оценку вклада изображения
  question: Вставленный при CutMix фрагмент второго изображения содержит в основном фон, но занимает заметную часть итогового изображения. Как следует назначить вес класса второго изображения?
  explanation: CutMix не оценивает смысл или заметность вставленного содержимого. Вес класса второго изображения равен фактической доле площади, занятой его прямоугольным фрагментом.
  kind: choice
  options:
    - Определить вес по тому, насколько хорошо модель распознаёт содержимое фрагмента
    - Определить вес по фактической доле площади вставки
    - Не добавлять класс второго изображения, поскольку во фрагменте почти нет объекта
    - Разделить веса классов поровну независимо от размера вставки
  correct: 1
  id: 030-cutmix-2
  fingerprint: 28f4e991
