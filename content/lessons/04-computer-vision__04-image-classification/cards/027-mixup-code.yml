- concept: скалярный коэффициент mixup применяется ко всем парам текущего батча
  question: В реализации mixup_batch генератор beta-распределения вернул один скаляр lam. Как он используется при смешивании батча?
  explanation: Скаляр lam распространяется по размерностям тензоров и задаёт общую пропорцию смешивания для всего батча. Новое значение внутри этого вызова функции не выбирается.
  kind: choice
  options:
    - Для каждого изображения отдельно выбирается новое значение
    - Для каждого пикселя отдельно выбирается новое значение
    - Один и тот же lam применяется ко всем парам изображений и меток батча
    - lam применяется только к меткам, а изображения усредняются
