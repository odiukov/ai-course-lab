- concept: отключённый mixup сохраняет единый контракт формата целевых меток
  question: Функция mixup_batch получает неположительное alpha, поэтому смешивание отключено. Какой результат удобнее вернуть для последующего вычисления soft cross-entropy?
  explanation: Изображения при отключённом mixup остаются без изменений, но метки всё равно преобразуются в float one-hot. Благодаря этому следующий код всегда получает цели одного формата.
  kind: choice
  options:
    - Исходные изображения и целочисленные номера классов
    - Исходные изображения и float one-hot представление меток
    - Пустой батч и пустые метки
    - Исходные изображения и логиты модели
