- concept: разделимый синтетический датасет помогает отличить ошибку обучающего пайплайна от сложности реальных данных
  question: Расположи этапы диагностической проверки классификатора в правильном порядке.
  explanation: Синтетические классы намеренно разделимы, поэтому провал на них трудно объяснить сложностью изображений. Успех подтверждает работоспособность основных частей пайплайна, но сам по себе не гарантирует хорошего качества на настоящем CIFAR-10.
  kind: order
  items:
    - Создать воспроизводимый датасет с хорошо различимым сигналом для каждого класса.
    - Запустить на нём тот же обучающий пайплайн, который предназначен для реальных изображений.
    - Проверить, способен ли классификатор выучить искусственно упрощённую задачу.
    - При провале исследовать метки, формы тензоров и вычисление функции потерь, а при успехе отдельно оценивать сложность реальных данных.
  id: 023-synthetic-data-1
  fingerprint: 85f6b3e4
- concept: независимый шум при сохранении классового сигнала проверяет обучение общей закономерности, а не запоминание конкретных пикселей
  question: В синтетическом датасете изображения одного класса имеют общий цветовой и пространственный узор, но к каждому изображению добавляется независимый шум. Зачем нужен этот шум?
  explanation: Без вариативности примеры могут оказаться почти одинаковыми, и успешное обучение будет слабой проверкой способности модели находить общий сигнал. Гауссов шум делает пиксели различными, оставляя частоту узора и цветовую палитру информативными.
  kind: open
  reference: Шум изменяет отдельные значения пикселей, сохраняя общий признак класса. Поэтому классификатору полезнее распознавать устойчивую палитру и структуру узора, чем запоминать конкретные изображения.
  id: 023-synthetic-data-2
  fingerprint: d22a49df
