- concept: предсказанный класс определяется индексом максимального логита
  question: Заполни формулу выбора предсказанного класса по вектору логитов z.
  explanation: Чем выше логит, тем сильнее модель предпочитает соответствующий класс. Поэтому для предсказания выбирают индекс наибольшего логита; знак и абсолютная величина оценки не мешают такому сравнению.
  kind: cloze
  template: \hat{y} = ___
  answer: \operatorname{argmax}_i z_i
  accept:
    - argmax_i z_i
    - argmax(z)
  id: 006-logits-1
  fingerprint: 8b98b4ff
- concept: логиты являются неограниченными вещественными оценками, а не вероятностями
  question: Классификатор вернул логиты [−3.8, 1.6, 4.5]. Какой вывод корректен?
  explanation: Логиты могут быть отрицательными, превышать единицу и иметь произвольную сумму. Они задают относительное предпочтение классов, а нормированное распределение вероятностей получается только после softmax.
  kind: choice
  options:
    - Выход ошибочен, потому что оценки должны лежать между нулём и единицей
    - Выход ошибочен, потому что оценки не складываются в единицу
    - Это допустимые сырые оценки классов; для получения вероятностей к ним можно применить softmax
    - Каждый логит уже показывает вероятность соответствующего класса в процентах
  correct: 2
  id: 006-logits-2
  fingerprint: f43c1987
