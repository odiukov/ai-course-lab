- concept: кросс-энтропия для классификации должна получать сырые логиты модели
  question: Заполни пропуск так, чтобы функция потерь получила ожидаемый вход.
  explanation: Cross-entropy сама выполняет необходимое преобразование логитов. Предварительный softmax меняет оптимизируемую функцию и искажает градиенты.
  kind: cloze
  template: |-
    logits = model(x)
    loss = cross_entropy(___, y)
  answer: logits
  accept:
    - model(x)
    - сырые логиты
    - raw logits
  id: 005-check-pipeline-1
  fingerprint: b09bc70d
- concept: неочищенные градиенты накапливаются между шагами оптимизатора
  question: Объясни своими словами, почему пропуск обнуления градиентов перед очередным шагом оптимизатора может сделать обучение нестабильным.
  explanation: В большинстве фреймворков backward накапливает градиенты, а не заменяет их. Поэтому без zero_grad очередное обновление использует старые и новые градиенты вместе.
  kind: open
  reference: После backward градиенты добавляются к уже хранящимся в параметрах. Если их не очистить перед новым шагом, оптимизатор применит сумму градиентов нескольких шагов, поэтому обновления окажутся неожиданно большими и будут зависеть от всей накопленной истории.
  id: 005-check-pipeline-2
  fingerprint: 71fd10e9
