- concept: reflect-padding выполняется перед обрезкой, а пространственная аугментация — перед стандартизацией
  question: Расположи операции пайплайна изображения в правильном порядке.
  explanation: Дополнение создаётся до выбора окна. Полученный пространственно изменённый вариант изображения затем стандартизируется по каналам.
  kind: order
  items:
    - Добавить reflect-padding по краям изображения
    - Вырезать случайное окно исходного размера
    - Выполнить поканальную стандартизацию
  id: 022-check-transforms-1
  fingerprint: f85b70ba
- concept: число вариантов random_crop определяется независимыми смещениями по двум осям
  question: Для квадратного изображения random_crop использует reflect-padding шириной 3 пикселя. Сколько различных окон исходного размера можно получить без учёта отражения?
  explanation: По каждой оси доступны семь начальных позиций. Смещения выбираются независимо, поэтому получается 7 × 7 = 49 вариантов.
  kind: numeric
  answer: 49
  tolerance: 0.01
