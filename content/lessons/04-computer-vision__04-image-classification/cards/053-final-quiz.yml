- concept: Top-k accuracy особенно полезна при большом числе визуально близких или неоднозначных классов
  question: Объясни своими словами, в какой задаче Top-k accuracy информативнее обычной Top-1 accuracy и почему.
  explanation: Top-k не заменяет обычную accuracy, а дополняет её там, где единственная правильная верхняя позиция слишком жёстко оценивает близкие или неоднозначные классы.
  kind: open
  reference: Top-k полезна, когда классов много и несколько из них могут быть визуально правдоподобны для одного изображения. Она показывает, попал ли истинный класс хотя бы в набор наиболее вероятных кандидатов, даже если модель поставила его не на первое место.
  id: 053-final-quiz-2
