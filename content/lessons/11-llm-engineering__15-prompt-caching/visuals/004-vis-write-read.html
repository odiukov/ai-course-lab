<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Записал один раз — читаешь дёшево</title>
<style>
  :root{
    --bg:#ffffff; --ink:#16202e; --muted:#5b6b82; --frame:#d8e0ec;
    --full:#3468ce; --full-edge:#24478f; --tail:#16305e;
    --cache:#ccdcf6; --cache-edge:#8fb1e6; --cache-ink:#4f6party;
  }
  :root{ --cache-ink:#5d7characters }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#141922; --ink:#e6edf7; --muted:#93a3b8; --frame:#2c3646;
      --full:#5b8ef0; --full-edge:#8ab4ff; --tail:#bcd6ff;
      --cache:#242f42; --cache-edge:#3b4d६9;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  figure{margin:0;padding:12px 10px 10px;background:var(--bg);border:1px solid var(--frame);border-radius:8px;}
  figcaption{font-size:15px;font-weight:600;margin:0 0 6px 2px;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .fallback{font-size:14px;line-height:1.5;color:var(--ink);margin:6px 2px;}
</style>
</head>
<body>
<figure>
  <figcaption>Записал один раз — читаешь дёшево</figcaption>
  <div id="wrap">
    <svg id="svg" viewBox="30 76 875 310" preserveAspectRatio="xMidYMid meet" role="img"
         aria-label="Первый запрос пишет префикс 15 000 токенов по цене 1.25x, следующие четыре читают его по 0.1x"></svg>
  </div>
</figure>
<script>
(function(){
  var svg=document.getElementById('svg');
  try{
    /* ---- данные схемы ---- */
    var D={
      bar:{x0:0,w:2.4,pitch:3.2,tailTop:1,prefTop:7},
      requests:[
        {name:'Запрос 1',mult:'1.25×',cached:false},
        {name:'Запрос 2',mult:'0.1×',cached:true},
        {name:'Запрос 3',mult:'0.1×',cached:true},
        {name:'Запрос 4',mult:'0.1×',cached:true},
        {name:'Запрос 5',mult:'0.1×',cached:true}
      ],
      col:{x1:18.2,x2:27.4,top:7,h:1.15,gap:0.2,pad:0.3},
      layers:[
        {t:'системный промпт — месяцы',cached:true},
        {t:'определения инструментов — недели',cached:true},
        {t:'few-shot примеры',cached:true},
        {t:'история разговора — каждый ход',cached:true},
        {t:'текущее сообщение — всегда новое',cached:false}
      ],
      arrow:{x:17.4,top:7,bot:0.45,wing:0.25,headLen:0.55,labelX:16.8,labelY:3.8},
      legend:{top:-1.2,bot:-1.55,sw:0.4,
        items:[{x:0,t:'новое — считается полностью',cached:false},
               {x:7.0,t:'префикс из кэша — 0.1×',cached:true}]},
      rows:{mult:7.2,brace:7.55,braceTick:7.42,group:7.78,name:-0.42,
            num:4.35,unit:3.72,tail:0.38}
    };

    /* ---- единственный перевод координат ---- */
    var ORIGIN={x:60,y:330}, SCALE=30;
    function sx(x){return ORIGIN.x+x*SCALE;}
    function sy(y){return ORIGIN.y-y*SCALE;}

    var NS='http://www.w3.org/2000/svg';
    function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}
    function add(n,a,txt){var e=el(n,a);if(txt!=null)e.appendChild(document.createTextNode(txt));svg.appendChild(e);return e;}
    function box(x1,y1,x2,y2,fill,edge){
      return add('rect',{x:sx(x1),y:sy(y2),width:sx(x2)-sx(x1),height:sy(y1)-sy(y2),
        fill:fill,stroke:edge,'stroke-width':1.5,rx:3});
    }
    function label(x,y,txt,anchor,size,fill,weight,dy){
      return add('text',{x:sx(x),y:sy(y)+(dy||0),'text-anchor':anchor,'font-size':size,
        fill:fill,'font-weight':weight||'400'},txt);
    }
    var FULL='var(--full)',FEDGE='var(--full-edge)',CACHE='var(--cache)',CEDGE='var(--cache-edge)',
        TAIL='var(--tail)',INK='var(--ink)',MUT='var(--muted)';

    /* фон */
    add('rect',{x:sx(-1.2),y:sy(8.2),width:sx(28.6)-sx(-1.2),height:sy(-1.9)-sy(8.2),fill:'var(--bg)'});

    /* ---- пять запросов ---- */
    var b=D.bar, last=0;
    D.requests.forEach(function(r,i){
      var x1=b.x0+i*b.pitch, x2=x1+b.w, c=(x1+x2)/2; last=x2;
      box(x1,b.tailTop,x2,b.prefTop, r.cached?CACHE:FULL, r.cached?CEDGE:FEDGE);
      box(x1,0,x2,b.tailTop, TAIL, TAIL);
      label(c,D.rows.num,'15 000','middle',13,r.cached?MUT:'var(--bg)','700',4);
      label(c,D.rows.unit,'токенов','middle',11,r.cached?MUT:'var(--bg)','400',4);
      label(c,D.rows.tail,'код 200','middle',11,'var(--bg)','400',4);
      label(c,D.rows.mult,r.mult,'middle',13,r.cached?MUT:INK,'700',0);
      label(c,D.rows.name,r.name,'middle',12.5,MUT,'400',0);
    });
    label((b.x0+b.w)/2,D.rows.group,'запись','middle',12.5,INK,'600',0);

    /* скоба над четырьмя чтениями */
    var g1=b.x0+b.pitch;
    add('polyline',{points:[
        sx(g1)+','+sy(D.rows.braceTick),sx(g1)+','+sy(D.rows.brace),
        sx(last)+','+sy(D.rows.brace),sx(last)+','+sy(D.rows.braceTick)].join(' '),
      fill:'none',stroke:MUT,'stroke-width':1.5});
    label((g1+last)/2,D.rows.group,'четыре чтения из кэша','middle',12.5,INK,'600',0);

    /* ---- стрелка стабильности ---- */
    var a=D.arrow;
    add('line',{x1:sx(a.x),y1:sy(a.top),x2:sx(a.x),y2:sy(a.bot+a.headLen),
      stroke:MUT,'stroke-width':1.5});
    add('polygon',{points:[
        sx(a.x)+','+sy(a.bot),
        sx(a.x-a.wing)+','+sy(a.bot+a.headLen),
        sx(a.x+a.wing)+','+sy(a.bot+a.headLen)].join(' '),fill:MUT});
    add('text',{x:sx(a.labelX),y:sy(a.labelY),'text-anchor':'middle','font-size':12,fill:MUT,
      transform:'rotate(-90 '+sx(a.labelX)+' '+sy(a.labelY)+')'},'стабильность падает');

    /* ---- столбик блоков ---- */
    var c=D.col;
    label(c.x1,D.rows.group,'Порядок блоков: стабильное сверху','start',13,INK,'600',0);
    D.layers.forEach(function(L,i){
      var yTop=c.top-i*(c.h+c.gap), yBot=yTop-c.h;
      box(c.x1,yBot,c.x2,yTop, L.cached?CACHE:TAIL, L.cached?CEDGE:TAIL);
      label(c.x1+c.pad,(yTop+yBot)/2,L.t,'start',12.5,L.cached?INK:'var(--bg)','400',4);
    });

    /* ---- легенда ---- */
    var lg=D.legend;
    lg.items.forEach(function(it){
      box(it.x,lg.bot,it.x+lg.sw,lg.top, it.cached?CACHE:TAIL, it.cached?CEDGE:TAIL);
      label(it.x+lg.sw+0.2,lg.top,it.t,'start',12,MUT,'400',9);
    });
  }catch(e){
    var p=document.createElement('p');
    p.className='fallback';
    p.textContent='Схема не построилась. Она должна показывать: первый запрос пишет префикс '+
      '15 000 токенов по цене 1.25× плюс хвост из 200 токенов кода; следующие четыре запроса '+
      'читают тот же префикс по 0.1×, а полную цену платят только за новый код. Справа — '+
      'порядок блоков сверху вниз: системный промпт, определения инструментов, few-shot примеры, '+
      'история разговора, текущее сообщение пользователя.';
    document.getElementById('wrap').appendChild(p);
  }
})();
</script>
</body>
</html>
