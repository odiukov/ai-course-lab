<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Приватное состояние и публичное сообщение</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fb;
      --surface: #ffffff;
      --private-fill: #eee9ff;
      --private-line: #6547b8;
      --public-fill: #e3f6ef;
      --public-line: #08775d;
      --decision-fill: #fff1c8;
      --decision-line: #9a6500;
      --ink: #172033;
      --muted: #59657a;
      --safe: #08775d;
      --danger: #c52b3f;
      --soft-line: #cad1dd;
      --label-pad: 12px;
      --line: 3px;
      --thin-line: 2px;
      --title-size: 22px;
      --subtitle-size: 15px;
      --header-size: 16px;
      --body-size: 17px;
      --small-size: 14px;
      --offer-size: 22px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #11151e;
        --surface: #181e2a;
        --private-fill: #29213f;
        --private-line: #b8a1ff;
        --public-fill: #15372f;
        --public-line: #65d7b6;
        --decision-fill: #3c3018;
        --decision-line: #f1c568;
        --ink: #f0f3f9;
        --muted: #b7c0d0;
        --safe: #65d7b6;
        --danger: #ff7182;
        --soft-line: #465064;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: auto;
    }

    figure {
      width: 100%;
      margin: auto;
      overflow: hidden;
      background: var(--surface);
    }

    figcaption {
      padding: var(--label-pad);
      border-bottom: var(--thin-line) solid var(--soft-line);
    }

    .title {
      font-size: var(--title-size);
      font-weight: bold;
      line-height: normal;
    }

    .subtitle {
      margin-top: var(--label-pad);
      color: var(--muted);
      font-size: var(--subtitle-size);
      line-height: normal;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      background: var(--surface);
    }

    .container {
      stroke-width: var(--line);
      vector-effect: non-scaling-stroke;
    }

    .private-box {
      fill: var(--private-fill);
      stroke: var(--private-line);
    }

    .public-box {
      fill: var(--public-fill);
      stroke: var(--public-line);
    }

    .decision {
      fill: var(--decision-fill);
      stroke: var(--decision-line);
      stroke-width: var(--line);
      vector-effect: non-scaling-stroke;
    }

    .offer-card {
      fill: var(--surface);
      stroke: var(--public-line);
      stroke-width: var(--thin-line);
      vector-effect: non-scaling-stroke;
    }

    .edge {
      fill: none;
      stroke: var(--muted);
      stroke-width: var(--line);
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .safe-edge {
      stroke: var(--safe);
    }

    .danger-edge {
      stroke: var(--danger);
    }

    .safe-head {
      fill: var(--safe);
    }

    .danger-head {
      fill: var(--danger);
    }

    .neutral-head {
      fill: var(--muted);
    }

    .cross {
      stroke: var(--danger);
      stroke-width: var(--line);
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .avatar {
      fill: var(--surface);
      stroke: var(--ink);
      stroke-width: var(--line);
      vector-effect: non-scaling-stroke;
    }

    .avatar-line {
      fill: none;
      stroke: var(--ink);
      stroke-width: var(--line);
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    text {
      fill: var(--ink);
      font-size: var(--body-size);
    }

    .box-header {
      font-size: var(--header-size);
      font-weight: bold;
    }

    .private-header {
      fill: var(--private-line);
    }

    .public-header {
      fill: var(--public-line);
    }

    .muted-text {
      fill: var(--muted);
      font-size: var(--small-size);
    }

    .decision-text {
      fill: var(--decision-line);
      font-size: var(--small-size);
      font-weight: bold;
    }

    .offer {
      fill: var(--public-line);
      font-size: var(--offer-size);
      font-weight: bold;
    }

    .danger-text {
      fill: var(--danger);
      font-size: var(--small-size);
      font-weight: bold;
    }

    .safe-text {
      fill: var(--safe);
      font-size: var(--small-size);
      font-weight: bold;
    }

    .legend {
      fill: var(--ink);
      font-size: var(--subtitle-size);
      font-weight: bold;
    }

    .fallback {
      padding: var(--label-pad);
      color: var(--danger);
      background: var(--surface);
      font-size: var(--body-size);
    }

    [hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title">
    <figcaption id="diagram-title">
      <div class="title">Приватное состояние и публичное сообщение — разные каналы</div>
      <div class="subtitle">Внутренние ограничения участвуют в выборе, но не передаются собеседнику.</div>
    </figcaption>

    <svg
      id="diagram"
      viewBox="0 0 1000 430"
      width="1000"
      height="430"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description">
      <title id="svg-title">Разделение приватного блокнота и публичного сообщения</title>
      <desc id="svg-description">Резервная цена 70 долларов и предел 75 долларов остаются в приватном блокноте. Механизм выбора формирует публичное предложение 55 долларов. Прямая передача блокнота собеседнику перечёркнута.</desc>
      <g id="scene"></g>
    </svg>

    <p id="fallback" class="fallback" hidden>
      Схема должна была показать два раздельных канала: приватный блокнот с резервной ценой $70 и пределом $75, публичное сообщение «Предлагаю $55» и перечёркнутую стрелку утечки блокнота собеседнику.
    </p>

    <noscript>
      <p class="fallback">
        Приватный блокнот хранит резервную цену $70 и предел $75. Публичный канал передаёт только сообщение «Предлагаю $55». Передача блокнота собеседнику запрещена.
      </p>
    </noscript>
  </figure>

  <script>
    const DATA = Object.freeze({
      boxes: [
        { x: 4, y: 4, w: 35, h: 21, className: "container private-box" },
        { x: 59, y: 4, w: 37, h: 21, className: "container public-box" },
        { x: 62, y: 11, w: 31, h: 10, className: "offer-card" }
      ],
      decision: [
        { x: 49, y: 7 },
        { x: 56, y: 14.5 },
        { x: 49, y: 22 },
        { x: 42, y: 14.5 }
      ],
      arrows: [
        {
          from: { x: 39, y: 14.5 },
          to: { x: 43.2, y: 14.5 },
          head: [
            { x: 43.2, y: 14.5 },
            { x: 41.5, y: 13.5 },
            { x: 41.5, y: 15.5 }
          ],
          lineClass: "edge",
          headClass: "neutral-head"
        },
        {
          from: { x: 54.8, y: 14.5 },
          to: { x: 59, y: 14.5 },
          head: [
            { x: 59, y: 14.5 },
            { x: 57.3, y: 13.5 },
            { x: 57.3, y: 15.5 }
          ],
          lineClass: "edge safe-edge",
          headClass: "safe-head"
        },
        {
          from: { x: 78, y: 25 },
          to: { x: 88.2, y: 32.5 },
          head: [
            { x: 88.2, y: 32.5 },
            { x: 86, y: 32.1 },
            { x: 87, y: 30.7 }
          ],
          lineClass: "edge safe-edge",
          headClass: "safe-head"
        },
        {
          from: { x: 31, y: 25 },
          to: { x: 88.2, y: 34.8 },
          head: [
            { x: 88.2, y: 34.8 },
            { x: 86, y: 35.3 },
            { x: 86.4, y: 33.6 }
          ],
          lineClass: "edge danger-edge",
          headClass: "danger-head",
          dash: [1.1, 0.8]
        }
      ],
      cross: [
        { from: { x: 57, y: 28.1 }, to: { x: 61, y: 32.1 } },
        { from: { x: 61, y: 28.1 }, to: { x: 57, y: 32.1 } }
      ],
      avatar: {
        head: { x: 91.5, y: 32.5, r: 1.7 },
        body: { from: { x: 91.5, y: 34.4 }, to: { x: 91.5, y: 37.2 } },
        shoulders: [
          { x: 88.7, y: 38.5 },
          { x: 89.2, y: 36.7 },
          { x: 91.5, y: 35.7 },
          { x: 93.8, y: 36.7 },
          { x: 94.3, y: 38.5 }
        ]
      },
      texts: [
        { x: 6, y: 7.8, value: "PRIVATE SCRATCHPAD", anchor: "start", className: "box-header private-header" },
        { x: 37, y: 7.8, value: "НЕ ПЕРЕДАЁТСЯ", anchor: "end", className: "muted-text" },
        { x: 6, y: 12, value: "Резервная цена: $70", anchor: "start", className: "" },
        { x: 6, y: 15.4, value: "Верхний предел: $75", anchor: "start", className: "" },
        { x: 6, y: 18.8, value: "История предложений", anchor: "start", className: "muted-text" },
        { x: 6, y: 22.2, value: "План следующей уступки", anchor: "start", className: "muted-text" },

        { x: 49, y: 13.8, value: "ВЫБОР", anchor: "middle", className: "decision-text" },
        { x: 49, y: 17.1, value: "$55", anchor: "middle", className: "decision-text" },

        { x: 61, y: 7.8, value: "PUBLIC MESSAGE", anchor: "start", className: "box-header public-header" },
        { x: 94, y: 7.8, value: "НАРУЖУ", anchor: "end", className: "muted-text" },
        { x: 77.5, y: 16.2, value: "«Предлагаю $55»", anchor: "middle", className: "offer" },
        { x: 77.5, y: 19.4, value: "Только текущее предложение", anchor: "middle", className: "muted-text" },

        { x: 78.5, y: 28.3, value: "публичный канал", anchor: "middle", className: "safe-text" },
        { x: 33, y: 29.1, value: "прямая утечка scratchpad", anchor: "end", className: "danger-text" },
        { x: 59, y: 34.5, value: "ЗАПРЕЩЕНО", anchor: "middle", className: "danger-text" },
        { x: 91.5, y: 41, value: "СОБЕСЕДНИК", anchor: "middle", className: "box-header" },
        { x: 4, y: 40.5, value: "Приватность задаётся маршрутом данных, а не пометкой «секретно».", anchor: "start", className: "legend" }
      ]
    });

    const ORIGIN = Object.freeze({ x: 0, y: 0 });
    const SCALE = Object.freeze({ x: 10, y: 10 });

    const sx = x => ORIGIN.x + x * SCALE.x;
    const sy = y => ORIGIN.y + y * SCALE.y;

    const LABEL_PADDING = 12;
    const LINE_THICKNESS = 3;
    const FONT_SIZE = 17;

    try {
      const namespace = "http://www.w3.org/2000/svg";
      const scene = document.getElementById("scene");

      const create = (name, attributes, parent = scene) => {
        const element = document.createElementNS(namespace, name);
        for (const [key, value] of Object.entries(attributes)) {
          element.setAttribute(key, String(value));
        }
        parent.appendChild(element);
        return element;
      };

      const pointList = points =>
        points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" ");

      for (const box of DATA.boxes) {
        create("rect", {
          x: sx(box.x),
          y: sy(box.y),
          width: sx(box.w) - sx(0),
          height: sy(box.h) - sy(0),
          class: box.className
        });
      }

      create("polygon", {
        points: pointList(DATA.decision),
        class: "decision"
      });

      for (const arrow of DATA.arrows) {
        const attributes = {
          x1: sx(arrow.from.x),
          y1: sy(arrow.from.y),
          x2: sx(arrow.to.x),
          y2: sy(arrow.to.y),
          class: arrow.lineClass
        };

        if (arrow.dash) {
          attributes["stroke-dasharray"] = arrow.dash
            .map(length => sx(length) - sx(0))
            .join(" ");
        }

        create("line", attributes);
        create("polygon", {
          points: pointList(arrow.head),
          class: arrow.headClass
        });
      }

      for (const segment of DATA.cross) {
        create("line", {
          x1: sx(segment.from.x),
          y1: sy(segment.from.y),
          x2: sx(segment.to.x),
          y2: sy(segment.to.y),
          class: "cross"
        });
      }

      create("circle", {
        cx: sx(DATA.avatar.head.x),
        cy: sy(DATA.avatar.head.y),
        r: sx(DATA.avatar.head.r) - sx(0),
        class: "avatar"
      });

      create("line", {
        x1: sx(DATA.avatar.body.from.x),
        y1: sy(DATA.avatar.body.from.y),
        x2: sx(DATA.avatar.body.to.x),
        y2: sy(DATA.avatar.body.to.y),
        class: "avatar-line"
      });

      create("polyline", {
        points: pointList(DATA.avatar.shoulders),
        class: "avatar-line"
      });

      for (const label of DATA.texts) {
        const text = create("text", {
          x: sx(label.x),
          y: sy(label.y),
          "text-anchor": label.anchor,
          class: label.className
        });
        text.textContent = label.value;
      }

      scene.dataset.labelPadding = String(LABEL_PADDING);
      scene.dataset.lineThickness = String(LINE_THICKNESS);
      scene.dataset.fontSize = String(FONT_SIZE);
    } catch (error) {
      document.getElementById("diagram").hidden = true;
      document.getElementById("fallback").hidden = false;
    }
  </script>
</body>
</html>
