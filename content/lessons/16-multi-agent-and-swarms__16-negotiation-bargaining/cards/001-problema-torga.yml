- concept: архитектура OG-Narrator отделяет вычисление предложения от его языкового оформления
  question: Расположите этапы формирования переговорного сообщения в архитектуре OG-Narrator.
  explanation: Числовой ход выбирает детерминированный механизм, а LLM лишь оформляет уже выбранное предложение. Такое разделение не позволяет качеству текста подменить корректность стратегии.
  kind: order
  items:
    - Получить текущее состояние торга
    - Детерминированно вычислить следующее предложение
    - Передать вычисленную цену языковому рассказчику
    - Сформировать естественно-языковое сообщение с этой ценой
  id: 001-problema-torga-1
