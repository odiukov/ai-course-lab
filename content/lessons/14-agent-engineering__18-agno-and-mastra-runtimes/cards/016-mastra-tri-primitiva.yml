- concept: интеграция с провайдерами моделей живёт в нижнем слое (Vercel AI SDK), а фреймворк лежит поверх и её не дублирует
  question: Агент на Mastra вызывает модель. Расставь слои в порядке прохождения вызова — от кода приложения до провайдера.
  explanation: 'Mastra сама с провайдерами не разговаривает: разбор форматов запроса и ответа делает Vercel AI SDK под ней. Практическое следствие — поддержка нового провайдера приезжает снизу, из SDK, а не требует правок во фреймворке; Mastra сверху лишь маршрутизирует по имени модели.'
  kind: order
  items:
    - Код приложения вызывает агента Mastra
    - Примитив Agent собирает инструкции, память и описания инструментов
    - Vercel AI SDK приводит вызов к единому виду для конкретного провайдера
    - HTTP-запрос к API провайдера модели
  id: 016-mastra-tri-primitiva-1
  fingerprint: 7fe6d421
- concept: составное хранилище разводит память, состояние процессов и трассы по разным бэкендам под профиль нагрузки каждого типа данных
  question: 'Сервис на Mastra: диалоговая память пользователей и поток трасс наблюдаемости, которых на порядки больше и которые только пишутся и потом агрегируются в отчёты. Какая раскладка по хранилищам соответствует замыслу составного хранилища?'
  explanation: 'Составное хранилище означает, что память, состояние процессов и наблюдаемость настраиваются на разные бэкенды независимо. У этих данных разные профили: память требует транзакций и точечных чтений по сессии, трассы — append-only поток огромного объёма с агрегациями, поэтому для наблюдаемости на масштабе документация советует ClickHouse. Одна БД на всё либо задыхается на записи трасс, либо не даёт памяти нужных гарантий.'
  kind: choice
  options:
    - Память диалогов — в транзакционную БД вроде Postgres, трассы — в колоночную аналитическую БД вроде ClickHouse
    - 'Всё в одну транзакционную БД: единый бэкенд проще эксплуатировать, а разные схемы разведут по таблицам'
    - 'Всё в колоночную аналитическую БД: она держит больший объём записи, значит подходит и памяти'
    - Память и трассы — в память процесса, а в БД сбрасывать раз в сутки
  correct: 0
  id: 016-mastra-tri-primitiva-2
  fingerprint: '40317989'
- concept: Workflow фиксирует порядок шагов детерминированно, Agent оставляет выбор и порядок вызовов модели
  question: 'Требование: последовательность «проверить лимит — списать деньги — отправить чек» обязана выполняться ровно в этом порядке и целиком, без права модели пропустить шаг. Какой примитив Mastra отвечает за это требование?'
  explanation: 'Agent решает сам, какие инструменты и в каком порядке звать — это гибко, но не гарантия. Workflow существует ровно для случая, когда «пусть модель сама решит» не устраивает: порядок и ветвления объявлены явно. Инструкции агента — предпочтение, а не ограничение; Model Router отвечает только за доступ к моделям.'
  kind: choice
  options:
    - 'Workflow: порядок шагов задан кодом, а не решением модели'
    - 'Agent: достаточно прописать порядок в инструкциях, модель им следует'
    - 'Tool: собрать все три действия в один инструмент и положиться на его описание'
    - 'Unified Model Router: он гарантирует одинаковое поведение шагов у любого провайдера'
  correct: 0
  id: 016-mastra-tri-primitiva-3
  fingerprint: e6878dc3
