- concept: родная мультимодальность рантайма снимает конвейер преобразования, но не заменяет поддержку модальности со стороны модели
  question: 'Рантайм заявляет родную мультимодальность: агент принимает текст, изображение, аудио, видео и файл как обычные входы. Команда подключает провайдера, чья модель понимает только текст и изображения, и шлёт агенту голосовое сообщение. Что произойдёт?'
  explanation: 'Родная мультимодальность — свойство границы агента: медиа не нужно превращать в строку до вызова, оно идёт модели в исходном виде. Потолок задаёт модель: возможности определяются пересечением того, что принимает агент, и того, что понимает выбранный провайдер. Ни транскрипции, ни выбора провайдера рантайм за вас не делает.'
  kind: choice
  options:
    - 'Рантайм передаст аудио модели как есть, и вызов упрётся в модель: родная мультимодальность убирает конвейер конвертации, но не добавляет модели способностей, которых у неё нет'
    - Рантайм сам расшифрует аудио в текст, потому что родная мультимодальность включает встроенное распознавание речи
    - Рантайм автоматически переключится на другого провайдера, умеющего аудио
    - Аудио будет молча отброшено, а агент ответит по остальным входам
  correct: 0
