- concept: в агентном RAG неудачный поиск — наблюдаемый агентом результат инструмента, порождающий новый вызов с переформулированным запросом
  question: Агент с поиском по базе знаний, оформленным как инструмент, получил вопрос, для которого формулировка пользователя не совпадает с терминологией документации. Расставьте шаги в порядке выполнения.
  explanation: 'Ключ — третий шаг: в агентном RAG промах поиска не невидим, а становится наблюдением внутри цикла агента, и именно это даёт возможность второй попытки. В классическом RAG извлечение происходит до рассуждения, пустой или нерелевантный результат агенту как факт не предъявляется, и второго захода не будет.'
  kind: order
  items:
    - Агент получает вопрос и решает, что своих знаний не хватает, значит нужен вызов инструмента поиска
    - Агент формирует поисковый запрос словами пользователя и вызывает инструмент
    - Инструмент возвращает пустой результат, и этот результат попадает агенту в контекст как наблюдение
    - Агент переформулирует запрос в терминах предметной области и вызывает инструмент повторно
    - Найденные фрагменты возвращаются агенту, и он отвечает по ним
