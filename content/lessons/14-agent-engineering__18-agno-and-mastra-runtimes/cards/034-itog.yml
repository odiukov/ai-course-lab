- concept: стоимость миграции между агентными фреймворками задаётся долей логики, выраженной примитивами фреймворка, а не объёмом кода
  question: Команда переносит рабочую систему с одного агентного фреймворка на другой (внутри того же языка). Какая часть кода потребует переписывания, а какая переедет почти без правок?
  explanation: 'Прикладная часть — тело инструмента, текст промпта, схема аргументов — от фреймворка не зависит и переезжает. Ломается то, что было сформулировано его абстракциями: как устроен обмен между агентами, кто кого зовёт, где живёт состояние. Поэтому оценка миграции — это подсчёт доли логики, отданной чужим примитивам, а не строк кода.'
  kind: choice
  options:
    - Переписывать придётся вызовы модели и промпты, а оркестрация переедет как есть
    - Переписывать придётся оркестрацию, выраженную примитивами старого фреймворка (роли, задачи, процесс, передача результатов), а функции инструментов и тексты промптов переедут почти без правок
    - 'Переписывать придётся всё одинаково: фреймворк пронизывает код равномерно'
    - Ничего переписывать не надо, если оба фреймворка ходят к одному провайдеру моделей
  correct: 1
  id: 034-itog-1
  fingerprint: 54ac99c2
- concept: без единой объявленной схемы описание инструмента для модели и разбор его аргументов в коде становятся двумя независимыми источниками, которые расходятся молча
  question: 'Инструмент описан двумя разными местами: JSON-схема руками отправляется модели, а разбор аргументов написан отдельно внутри функции. Объясни, какой класс ошибок это порождает и почему одна объявленная схема (например, Zod) его закрывает.'
  explanation: Ключ не в том, что Zod «удобнее», а в количестве источников истины. Один — расхождение невозможно; два — оно неизбежно и обнаруживается позже всего, уже на живом вызове модели.
  kind: open
  reference: 'Два источника описывают один контракт и расходятся при любой правке: поле переименовали в разборе, но не в схеме — модель продолжает слать старое имя и получает отказ; поле сделали обязательным в схеме, но код по-прежнему терпит его отсутствие. Расхождение молчаливое: компилятор его не видит, оно всплывает вызовом модели в проде. Единая схема служит одновременно источником типов для кода, валидатором пришедших аргументов и описанием, уходящим модели, — три роли из одного объявления, поэтому рассинхронизироваться нечему.'
  id: 034-itog-2
  fingerprint: d7eab1f8
