- concept: максимальный выигрыш от оптимизации компонента ограничен его долей в полном времени ответа
  question: Полное время ответа сервиса — 750 мс, из них на создание объекта агента уходит 5 микросекунд, остальное — сетевой вызов модели. На сколько процентов максимум сократится время ответа, если стоимость создания агента полностью обнулить? Ответ в процентах.
  explanation: 'Верхняя граница выигрыша равна доле компонента в общем времени: 5 мкс / 750 000 мкс ≈ 0,0000067, то есть около 0,00067%. Даже идеальная оптимизация не может дать больше, чем компонент вообще занимает. Поэтому цифры вида «2 микросекунды на инициализацию» ничего не решают в запросе, где секунду ждут ответ провайдера: полное устранение накладных расходов превращает 1,000002 с в 1,000000 с.'
  kind: numeric
  answer: 0.00067
  tolerance: 0.0003
  id: 007-visual-mikrosekunda-1
  fingerprint: a36371a6
- concept: корректный бенчмарк компонента измеряет его в изоляции, поэтому его число истинно, но применимость определяется профилем нагрузки
  question: Документация рантайма честно заявляет инициализацию агента за микросекунды, вы её ставите, а время ответа сервиса не меняется ни на миллисекунду. Объясните своими словами, почему заявленное число при этом не является ложным, и что именно нужно проверить, прежде чем выбирать инструмент по такой цифре.
  explanation: 'Типичная ошибка чтения бенчмарков: корректность числа путают с его релевантностью. Заявленные ~2μs и ~3,75 KiB на агента — честные измерения изолированного компонента; в материале это прямо названо ловушкой «perf-for-perf''s-sake» — брать рантайм ради красивой цифры там, где накладные расходы не узкое место.'
  kind: open
  reference: 'Число измерено в изоляции: бенчмарк меряет только стоимость создания объекта агента, без вызова модели, без сети, без сериализации. В этой рамке оно корректно и воспроизводимо. Ложным становится не число, а вывод: заявленная величина относится к одному слагаемому, а вы приложили её к полному времени запроса. Проверять нужно профиль своей нагрузки — из каких слагаемых складывается время ответа и какую долю занимает измеренный компонент. Если запрос состоит из одного медленного похода к LLM, инициализация лежит на уровне погрешности (дрожание сети до провайдера больше всего выигрыша), и выбирать по ней нельзя — критерием становятся язык стека, эргономика деплоя и требуемые примитивы.'
  id: 007-visual-mikrosekunda-2
  fingerprint: c9ffb6ea
