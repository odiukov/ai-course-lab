- concept: source-available даёт доступ к чтению исходников, но не выдаёт права на использование, которые даёт разрешительная лицензия
  question: Код проекта лежит в публичном репозитории, и его можно открыть и прочитать целиком. Почему из этого не следует, что его можно поднять как коммерческий сервис для своих клиентов?
  explanation: Слово «доступны» в source-available относится к исходникам, а не к правам. Прочитать код каталога ee/ у Mastra можно, разобраться в устройстве логики можно, а перепродавать или хостить его как сервис — только по условиям корпоративной лицензии, обычно через договор.
  kind: open
  reference: 'Открытость исходника — это про видимость кода, а права на использование выдаёт лицензия, и они не следуют из доступности автоматически. Модель source-available означает: файлы опубликованы для чтения и изучения, но условия пишет компания-владелец, и они обычно ограничивают коммерческое применение — в частности, хостинг этой функциональности как сервиса для третьих лиц. Разрешительная лицензия (типа Apache) даёт использование, изменение и встраивание в платный продукт с сохранением атрибуции; source-available такого набора прав не даёт, и для коммерческого сценария нужен отдельный договор с правообладателем.'
  id: 026-litsenziya-ee-2
  fingerprint: 443c8c89
- concept: 'порядок проверки прав на код: сначала определить каталог-источник, затем ближайшую лицензию, и только потом смотреть ограничения на коммерческое использование'
  question: Расставь шаги проверки, можно ли коммерчески использовать конкретный кусок кода из репозитория со смешанным лицензированием.
  explanation: 'Точкой отсчёта служит не репозиторий, а каталог: правила ищутся от места, откуда берётся код, вверх до первого файла лицензии. Практический водораздел — сценарий: установка через пакетный менеджер и написание своего приложения покрываются разрешительной частью, а форк, самостоятельный хостинг корпоративных возможностей и перепродажа упираются в условия конкретного каталога.'
  kind: order
  items:
    - Определить, из какого каталога репозитория берётся нужный код
    - Найти файл лицензии в этом каталоге, а при его отсутствии подняться к ближайшему вышестоящему
    - 'Прочитать условия найденной лицензии на предмет ограничений: коммерческое применение, хостинг как сервиса, перепродажа'
    - Сопоставить условия со своим сценарием — установка пакета в своё приложение, форк или самостоятельный хостинг — и решить, нужен ли договор
  id: 026-litsenziya-ee-3
