- concept: бесстатусность ломается, если что-то, переживающее запрос, лежит в памяти процесса, а не во внешнем хранилище
  question: Сервис на FastAPI создаёт свежего агента на каждый HTTP-запрос и работает в 4 репликах за балансировщиком. Какая деталь реализации сломает горизонтальное масштабирование?
  explanation: 'Словарь в памяти процесса виден только своей реплике: следующий запрос того же пользователя попадёт на другую реплику и не найдёт истории. Общая база по идентификатору сессии как раз и снимает вопрос «на какую реплику попал пользователь». Переиспользуемый HTTP-клиент — это кэш соединений без пользовательского состояния, он безопасен; пересборка инструментов на запрос ничего не хранит между запросами.'
  kind: choice
  options:
    - История диалога хранится в модульном словаре процесса, ключ — идентификатор пользователя
    - История диалога читается и пишется в общую базу по идентификатору сессии
    - Клиент модели создаётся один раз на процесс и переиспользуется всеми запросами
    - Инструменты агента описаны обычными функциями Python и собираются заново на каждый запрос
