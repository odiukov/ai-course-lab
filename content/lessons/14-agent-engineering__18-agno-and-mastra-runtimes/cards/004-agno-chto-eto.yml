- concept: 'отсутствие объявленного графа означает обычный поток управления языка: обычная отладка бесплатно, но восстановление и топология — за свой счёт'
  question: Рантайм агентов заявляет «никаких графов и цепочек — только чистый Python». Объясни своими словами, что при этом получает разработчик и за что он расплачивается по сравнению с фреймворком, где шаги объявлены узлами и рёбрами.
  explanation: 'Ключевая мысль: граф — это не только картинка, но и данные, по которым фреймворк умеет останавливаться и продолжать. Убрав граф, получаешь простоту и обычную отладку, но берёшь на себя всё, что граф давал даром.'
  kind: open
  reference: 'Логика ветвления живёт в обычных конструкциях языка: условие, цикл, повторный вызов агента — это if и вызов функции, а не ребро между узлами. Управление не уходит из кода приложения, поэтому работают привычные инструменты: обычный стек-трейс, обычный отладчик, обычные тесты, обычное встраивание в существующий веб-бэкенд. Расплата в том, что топологии как данных не существует: нет декларации, из которой можно бесплатно получить визуализацию хода, чекпоинт, возобновление с середины после сбоя, паузу на подтверждение человеком или автоматический повтор конкретного шага. Всё это придётся написать самому — сохранить промежуточное состояние в базу, самому решить, откуда продолжать. Выбор между вариантами сводится к тому, нужна ли эта машинерия: если процесс длинный, ветвистый и должен переживать перезапуск, объявленный граф окупается; если это несколько вызовов внутри одного HTTP-запроса, он лишний вес.'
  id: 004-agno-chto-eto-3
  fingerprint: cd909cd7
