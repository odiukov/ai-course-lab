- concept: 'переносимость истории прогонов определяется тем, где физически лежит журнал: внутри рантайма или во внешнем сервисе'
  question: Две команды пишут агентов на разных рантаймах. Первая смотрит прогоны во встроенной панели рантайма, вторая отдаёт их через крючки во внешний сервис-журнал. Обе через год меняют рантайм. Что различается по итогу?
  explanation: Крючки — это точки, куда рантайм отдаёт данные о шаге наружу; приёмник живёт отдельным сервисом со своим хранилищем. Данные принадлежат приёмнику, а не рантайму, поэтому смена рантайма меняет только источник записей. Встроенная панель хранит историю внутри своего периметра, и с уходом рантайма доступ к ней теряется.
  kind: choice
  options:
    - У второй накопленная история прогонов остаётся доступной после смены рантайма, у первой она привязана к старому рантайму
    - У второй качество ответов агента после смены рантайма окажется выше
    - У первой прогоны записывались точнее, потому что панель родная
    - 'Различий нет: обе панели показывают одни и те же поля'
