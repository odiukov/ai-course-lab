- concept: общий внешний приёмник трасс делает прогоны разных рантаймов сопоставимыми в одной выборке
  question: Во время квартальной миграции два разных рантайма работают в проде одновременно и оба пишут трассы в один внешний журнал. Объясни своими словами, что это даёт по сравнению с ситуацией, когда каждый рантайм показывает свои прогоны в собственной панели.
  explanation: 'Ценность внешнего журнала не только в том, что он переживает рантайм, но и в том, что он объединяет источники: одинаковый формат трассы превращает миграцию в измеримое сравнение внутри одной выборки. Рантаймы под таким журналом — сменные детали.'
  kind: open
  reference: 'Оба потока попадают в одно хранилище в одном формате трассы, поэтому прогоны старого и нового рантайма лежат в общей выборке: их можно фильтровать, считать и сравнивать по одним и тем же полям — задержка, число вызовов инструментов, токены, стоимость, доля плохих ответов. Решение «новый рантайм не хуже» принимается по одному экрану, а не сведением двух несовместимых наборов метрик вручную. Отдельные родные панели дали бы два несравнимых среза и никакой общей истории.'
