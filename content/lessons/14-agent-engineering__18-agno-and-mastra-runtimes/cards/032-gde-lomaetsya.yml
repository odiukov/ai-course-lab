- concept: 'привязка к экосистеме и лицензионные ограничения — условные издержки: они равны нулю до наступления конкретного события (миграция, форк, коммерческое использование), поэтому не обнаруживаются опытом прототипа'
  question: 'Прототип на выбранном фреймворке отработал безупречно: ни привязка к платформе, ни лицензия на часть каталогов ни разу не помешали. Объясни своими словами, почему такой опыт ничего не говорит о будущей стоимости этих двух факторов и как их тогда оценивать.'
  explanation: 'Ошибка тут не в оптимизме, а в подмене критерия: наблюдаемое поведение системы измеряет только сценарии, которые уже случились. Привязка и лицензия — риски по событию, и единственный способ их оценить — заранее перечислить события, которые вероятны для проекта, а не ждать, пока они наступят.'
  kind: open
  reference: 'Обе издержки условные: они не входят в текущую эксплуатацию, а активируются событием. Привязка стоит ноль, пока приложение живёт в той же среде, и предъявляет счёт в момент переезда. Ограниченная лицензия стоит ноль, пока код только читают и запускают как есть, и предъявляет счёт в момент форка, правки или коммерческой поставки. Прототип ни одного из этих событий не совершает, поэтому его успех подтверждает лишь работоспособность в текущих условиях. Оценивать нужно не по прожитому опыту, а по вероятным будущим событиям: планируется ли смена площадки, придётся ли менять код фреймворка, будет ли продукт коммерческим. Вдобавок цена растёт со временем — чем больше кода написано поверх, тем дороже и переезд, и замена компонента с неподходящей лицензией, поэтому проверять оба фактора выгоднее до старта разработки.'
