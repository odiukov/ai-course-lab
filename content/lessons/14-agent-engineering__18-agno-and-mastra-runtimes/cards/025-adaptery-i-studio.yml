- concept: продовый ответ агента содержит только конечный результат, поэтому промежуточные вызовы инструментов и их аргументы наблюдаемы лишь через отдельный слой трассировки или локальную панель
  question: Workflow из четырёх шагов вернул в проде бессмысленный ответ. Объясни своими словами, почему по самому HTTP-ответу нельзя понять, на каком шаге всё сломалось, и что даёт локальная отладочная панель фреймворка.
  explanation: Ключ в том, что отладочная информация — не часть контракта ответа. Либо её отдельно выводят наружу (трассы, наблюдаемость), либо смотрят локально в панели, где вокруг агента нет чужих middleware.
  kind: open
  reference: 'Наружу сериализуется только финальный результат: промежуточные вызовы инструментов, аргументы, которыми их звала модель, их возвраты и время каждого шага в ответ не попадают. Типизированная схема (Zod) отклонит аргумент неверной формы, но не покажет, почему модель его сформировала. Локальная панель (у Mastra — Mastra Studio, поднимается на localhost) даёт интерактивный прогон: выбрать агента, отправить сообщение и увидеть цепочку — какой инструмент вызван, с какими аргументами, что вернул, сколько занял каждый шаг workflow, — а также перезапустить прогон по шагам с изменённым входом.'
  id: 025-adaptery-i-studio-2
  fingerprint: 99076d36
- concept: 'локальная отладочная панель — инструмент разработки: она даёт произвольный запуск агента и полные внутренности прогона, что несовместимо с продовым периметром'
  question: Отладочная панель фреймворка поднимается на локальном порту рядом с разработчиком, а не выкатывается в прод вместе с сервисом. Какая причина этому основная?
  explanation: 'Панель по назначению — среда разработки: свободный вызов любого агента и просмотр всех промежуточных данных. В проде за наблюдаемость отвечает другой контур — трассы в бэкенд наблюдаемости (для масштаба рекомендуют ClickHouse), а доступ к агенту идёт через маршрут сервиса с его авторизацией.'
  kind: choice
  options:
    - Панель позволяет произвольно запускать агента и показывает полные внутренности прогона — аргументы инструментов и их ответы, — то есть в проде это была бы дополнительная поверхность доступа мимо авторизации сервиса
    - Панель технически не умеет работать с моделями через удалённых провайдеров
    - Панель заменяет собой серверный адаптер, поэтому вместе с ним работать не может
    - Панель хранит состояние диалогов только в памяти браузера и потому бесполезна на сервере
