- concept: SDK провайдера выбирают ради готовой формы агента, упакованной автором модели, а не ради интеграции с чужим стеком
  question: В каком случае OpenAI Agents SDK или Claude Agent SDK — правильный выбор вместо стороннего рантайма?
  explanation: SDK провайдера даёт готовую, авторскую сборку цикла агента от создателя модели. Мультипровайдерная маршрутизация — сильная сторона Mastra, дешёвое создание агента — Agno, а деплой на Vercel решается языком бэкенда, а не выбором SDK.
  kind: choice
  options:
    - Когда вам нужна ровно та форма агента, которую упаковал сам провайдер модели
    - Когда нужно маршрутизировать вызовы между моделями многих разных провайдеров
    - Когда узкое место — стоимость создания агента и требуется минимальная память на экземпляр
    - Когда бэкенд написан на TypeScript и деплоится на Vercel
