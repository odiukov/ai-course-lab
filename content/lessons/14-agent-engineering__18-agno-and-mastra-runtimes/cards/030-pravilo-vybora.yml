- concept: язык перестаёт быть решающим критерием, когда требования диктуют надёжное состояние и явный граф рассуждения важнее скорости
  question: Бэкенд полностью на Python, команда живёт на FastAPI. Нагрузка — длинные многошаговые процессы, которые обязаны переживать перезапуск воркера и иметь заранее объявленную топологию переходов с точками ветвления. Что выбрать?
  explanation: 'Язык — первый фильтр, но не единственный. Остаются случаи, где он не главный: когда надёжность состояния и явное рассуждение по графу перевешивают чистую скорость, выбор идёт в сторону LangGraph, даже если Agno подходит по языку.'
  kind: choice
  options:
    - 'LangGraph: здесь решает надёжное состояние и явный граф, а не язык и не скорость создания агента'
    - 'Agno: бэкенд на Python, значит критерий языка уже дал ответ'
    - 'SDK провайдера модели: длинные процессы всегда упакованы на его стороне'
    - 'Mastra: только у неё есть объявленные шаги, поэтому ради этого стоит завести второй язык'
