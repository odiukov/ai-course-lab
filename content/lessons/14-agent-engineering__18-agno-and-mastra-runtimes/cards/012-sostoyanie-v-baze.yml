- concept: 'вынос состояния наружу оплачивается тем, что хранилище становится обязательной зависимостью каждого запроса: сеть, задержка и общая точка отказа'
  question: Перенос истории диалога из памяти процесса во внешнее хранилище решает проблему рестартов и нескольких реплик. Объясни своими словами, что этот перенос стоит и за что теперь отвечает инженер.
  explanation: 'Бесстатусность не убирает состояние, а переносит его туда, где оно общее. Выигрыш — взаимозаменяемые реплики и переживание рестартов; плата — сетевой доступ к состоянию на каждом запросе, новая общая зависимость и все вопросы долговременного хранения: конкурентная запись, размер истории, срок жизни данных.'
  kind: open
  reference: 'Состояние перестаёт быть локальным обращением к памяти и становится сетевым обращением к хранилищу: к каждому запросу добавляется задержка чтения и записи, плюс сериализация истории. Хранилище становится обязательной зависимостью — пока оно недоступно, недоступен весь сервис, а не одна реплика, то есть появляется общая точка отказа и объект для резервирования. Растут вопросы, которых в памяти процесса не было: конкурентные запросы одной сессии могут писать поверх друг друга, историю нужно чем-то ограничивать (окно, сжатие, срок жизни), данные пользователей теперь лежат долговременно и попадают под требования к хранению и удалению. Взамен реплики становятся взаимозаменяемыми, а рестарт и деплой перестают уничтожать разговоры.'
