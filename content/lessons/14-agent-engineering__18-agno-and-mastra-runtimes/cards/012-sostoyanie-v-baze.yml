- concept: идентификатор сессии выполняет роль права доступа к чужой переписке, поэтому обязан быть непредсказуемым, а не порядковым
  question: 'В бесстатусном сервисе идентификаторы сессий выдаются автоинкрементом: sess_1041, sess_1042, sess_1043. Чем это опасно, если сервер по идентификатору сразу читает историю из базы?'
  explanation: Раз состояние достаётся из хранилища по одному лишь идентификатору, этот идентификатор и есть право доступа к разговору. Порядковые номера угадываются перебором соседних значений. Отсюда случайные строки достаточной длины плюс отдельная проверка, что сессия принадлежит текущему пользователю.
  kind: choice
  options:
    - Любой клиент может подставить соседний номер и получить чужую переписку, потому что идентификатор фактически работает как пропуск к состоянию
    - База переполнится, так как счётчик не переиспользует номера завершённых сессий
    - Реплики за балансировщиком начнут выдавать одинаковые номера и перезапишут состояние друг друга
    - Свежий агент не сможет разобрать числовой идентификатор и потеряет историю
