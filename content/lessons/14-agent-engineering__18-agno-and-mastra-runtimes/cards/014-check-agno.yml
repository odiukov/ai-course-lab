- concept: возможность горизонтального масштабирования определяется местом хранения состояния, а не стоимостью создания агента внутри узла
  question: Команда ускорила инициализацию агента в несколько раз и на этом основании собирается перевести сервис из одной копии в кластер за балансировщиком. Объясни своими словами, отвечает ли ускорение инициализации на вопрос «можно ли поставить рядом ещё несколько копий», и что на этот вопрос отвечает.
  explanation: 'Две независимые оси: скорость/плотность внутри узла и место хранения состояния. Дешёвая инициализация делает бесстатусную схему приемлемой по цене (свежий агент на каждый запрос не жалко), но саму возможность масштабировать даёт вынос состояния наружу.'
  kind: open
  reference: 'Не отвечает. Стоимость создания агента — характеристика одного узла: она говорит, сколько агентов узел успевает поднять и сколько их влезет в память, то есть влияет на пропускную способность узла. Вопрос «можно ли добавить копии» — про взаимозаменяемость реплик: любая копия должна уметь обслужить любой запрос любого пользователя. Это верно тогда и только тогда, когда всё, что переживает запрос (история сессии, память диалога), лежит во внешнем разделяемом хранилище, а не внутри процесса. Агент, поднимающийся мгновенно, но хранящий историю у себя в памяти, не масштабируется горизонтально; агент, поднимающийся медленно, но читающий состояние из базы, масштабируется.'
  id: 014-check-agno-2
  fingerprint: 3f145304
