- concept: объявленные схемы входа и выхода шагов сдвигают обнаружение несовместимости стыка на этап компиляции, до расхода токенов и до записи во внешние системы
  question: 'В типизированном workflow шаг A возвращает объект `{ id: number, body: string }`, шаг C принимает `string[]`. Разработчик по ошибке соединил выход A со входом C. Когда об этом станет известно?'
  explanation: 'Смысл объявленных схем шага в том, что совместимость соседей — статическое свойство. Ошибка ловится до запуска: без вызовов модели, без обращений к внешним сервисам и без мусорных записей в целевую систему. Рантайм-падение (вариант 1) — это то, что было бы без схем.'
  kind: choice
  options:
    - При компиляции/проверке типов — стык подсвечивается в редакторе до запуска
    - На первом прогоне, когда шаг C упадёт с ошибкой рантайма
    - Только после того, как модель на шаге C вернёт бессмысленный ответ
    - 'Никогда: рантайм молча приведёт объект к массиву строк'
  correct: 0
  id: 019-workflows-mastra-1
  fingerprint: 5c952981
- concept: 'шаг workflow — единица процесса с контрактом, а не обязательно обращение к модели: HTTP-вызовы и запись в хранилище оформляются шагами наравне с модельными'
  question: 'Процесс: (1) забрать документ по HTTP, (2) вытащить из него список пунктов моделью, (3) записать пункты в базу. Как это ложится на шаги workflow?'
  explanation: Шаг определяется контрактом (схема входа, схема выхода), а не тем, что внутри. Поэтому HTTP-запрос и запись в базу — такие же шаги, как вызов модели, и весь процесс читается одним куском кода, а модели остаётся только тот шаг, где нужно рассуждение.
  kind: choice
  options:
    - 'Все три — шаги: рантайм не различает модельные и обычные, у каждого своя схема входа и выхода'
    - Шагом может быть только (2); (1) и (3) пишутся вне workflow как обычный код вокруг него
    - Шагами оформляют (1) и (3), а вызов модели должен быть отдельным агентом вне процесса
    - Нужно объединить всё в один шаг, потому что схемы описываются только для границ процесса
  correct: 0
  id: 019-workflows-mastra-2
  fingerprint: 26d4596c
- concept: статическая проверка стыков гарантирует форму данных, но не их смысловую пригодность для следующего шага
  question: Стыки workflow из 6 шагов сошлись, проект компилируется. Объясни своими словами, какие ошибки процесса это исключает, а какие — нет.
  explanation: Типы описывают форму, а не значение. Схемы стыков убирают целый класс ошибок сборки, но модель, вернувшая правдоподобный мусор нужного типа, пройдёт проверку — за смысл отвечают ограничения в схеме и логика самого шага.
  kind: open
  reference: 'Совпадение схем гарантирует только форму данных: следующий шаг получит поля с ожидаемыми именами и типами, а перепутанный порядок шагов или несовместимые структуры будут пойманы до запуска. Не гарантируется содержание: массив строк может оказаться пустым, строка — обрезанной или не относящейся к делу, число — в других единицах, а внешний API — вернуть валидный по форме, но неверный по смыслу ответ. Такие вещи ловятся проверками внутри шага (условия, отдельные ограничения в схеме вроде минимальной длины) и тестами, а не типами стыков.'
  id: 019-workflows-mastra-3
  fingerprint: 962f7840
