- concept: 'порядок валидации аргументов инструмента: наличие обязательных полей проверяется раньше типов, потому что проверка типа отсутствующего поля бессмысленна'
  question: Валидатор аргументов вызова инструмента получил схему и словарь от модели. Расставь проверки в том порядке, в котором их обязана выполнять функция-гейт.
  explanation: 'Проверка типа у поля, которого нет, либо падает на KeyError, либо выдаёт бессмысленный отказ вроде «city должно быть строкой, пришёл None». Сначала выясняется, что валидировать, и только потом — валидно ли оно. Лишние поля проверяются последними: они не мешают вызову, но сигнализируют, что модель галлюцинирует параметры.'
  kind: order
  items:
    - Проверить, что все обязательные поля схемы присутствуют в словаре аргументов
    - Проверить тип каждого присутствующего поля на соответствие схеме
    - Проверить, что в словаре нет полей, которых нет в схеме
    - Вернуть успех с валидированными аргументами либо отказ с текстом ошибки
  id: 018-typed-tool-call-1
  fingerprint: eb80daa3
- concept: молчаливое приведение типа в валидаторе прячет ошибку модели вместо того, чтобы её вернуть
  question: 'Схема инструмента объявляет поле `limit` числом, а модель прислала `{"limit": "20"}`. Почему валидатор должен вернуть отказ, а не выполнить `int("20")` и пропустить вызов?'
  explanation: '`int("20")` пройдёт, а `int("двадцать")` или `int("20 штук")` — нет. Тихая починка означает, что дефект модели виден только на редких входах и всплывёт в проде. Явный отказ делает нарушение схемы наблюдаемым сразу и, главное, отправляет модели сигнал, по которому она исправится.'
  kind: choice
  options:
    - Потому что приведение типа стоит дорого и замедляет обработку запроса
    - Потому что успешное приведение скрывает от системы факт, что модель нарушает схему, и ошибка будет повторяться незамеченной, пока не придёт значение, которое не приведётся
    - Потому что после приведения аргументы нельзя будет сериализовать обратно в JSON
    - Потому что валидатор не имеет права изменять словарь, полученный от модели, ни при каких условиях
  correct: 1
  id: 018-typed-tool-call-2
  fingerprint: 7e4f8d74
- concept: текст отказа валидатора — вход для следующего хода модели, поэтому обязан называть поле, ожидаемое и полученное
  question: 'Отказ валидатора возвращается модели как результат инструмента. Объясни, почему сообщение «invalid arguments» хуже, чем «поле `depth`: ожидалось число, получена строка», и что это меняет в поведении агента.'
  explanation: 'Валидатор стоит в цикле агента: его отказ становится наблюдением, на которое модель отвечает новым действием. Диагностическое сообщение превращает провал в самовосстановление за один ход; общее — в слепые повторы. Ровно эту работу в Mastra выполняет Zod, отдающий структурированный список нарушений схемы.'
  kind: open
  reference: 'Модель не видит ни схему валидатора, ни его код — она видит только возвращённый текст и по нему строит следующий вызов инструмента. Обобщённое «invalid arguments» не сообщает, какое поле сломано и в чём именно ошибка, поэтому модели остаётся угадывать: она повторит тот же вызов либо начнёт менять случайные поля, и цикл агента зациклится на неудачных попытках. Сообщение, называющее имя поля, ожидаемый тип и фактически полученный, — это готовая инструкция по починке: модель делает один исправленный вызов и идёт дальше. То есть текст ошибки здесь не логирование для человека, а часть протокола общения с моделью, и его качество прямо определяет число потраченных ходов и токенов.'
  id: 018-typed-tool-call-3
  fingerprint: 5290ea14
