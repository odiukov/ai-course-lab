- concept: 'заглушка провайдера модели обязана воспроизвести контракт вызывающей стороны: имя метода, принимаемые аргументы и форму возвращаемого объекта'
  question: Для замера накладных расходов рантайма агента вместо настоящего провайдера подставляют заглушку. Что делает её пригодной подменой?
  explanation: 'Рантайм общается с моделью через утиную типизацию: зовёт конкретный метод и лезет в конкретное поле ответа. Дубль обязан повторить обе половины контракта — иначе агент упадёт не на сети, а на распаковке ответа. Голая строка ломает вторую половину. Короткий таймаут оставляет сеть внутри замера, а мок транспорта меряет ещё и сериализацию с парсингом, то есть уже не цену рантайма.'
  kind: choice
  options:
    - Она реализует тот же метод, который рантайм зовёт у объекта модели, принимает список сообщений и возвращает объект той же формы — с полем, откуда рантайм достаёт текст
    - Она возвращает голую строку вместо объекта — рантайм всё равно приводит ответ к тексту
    - Она наследуется от базового класса провайдера и оставляет сетевой вызов, но с очень коротким таймаутом
    - Она перехватывает HTTP-запросы на уровне транспорта и отдаёт заранее записанный ответ провайдера
  correct: 0
  id: 005-stub-model-1
  fingerprint: cff310ec
- concept: измеряемая величина тонет в шуме, когда посторонняя стоимость внутри итерации на порядки больше неё
  question: Вызов настоящего провайдера модели занимает 750 мс, а инициализация агента в рантайме — 5 мкс. Во сколько раз вызов провайдера дольше инициализации?
  explanation: 750 мс = 750 000 мкс, делим на 5 мкс — 150 000. При таком разрыве вклад инициализации лежит глубоко под разбросом сетевой задержки, и цикл с настоящим провайдером измеряет качество сети, а не рантайм. Заглушка убирает доминирующее слагаемое, и остаток замера становится ценой самого рантайма.
  kind: numeric
  answer: 150000
  tolerance: 1000
  id: 005-stub-model-2
  fingerprint: d52d6e6a
- concept: счётчик вызовов внутри заглушки делает наблюдаемым число обращений к модели за один прогон агента
  question: Зачем в заглушку модели добавляют счётчик вызовов, если задача — измерить скорость инициализации агента? Объясни своими словами.
  explanation: 'Заглушка даёт не только скорость, но и наблюдаемость: число обращений к модели за прогон становится обычным целым числом, которое можно проверить утверждением. Расхождение ожидаемого и фактического числа вызовов — это баг в цикле агента, и он искажает любой бенчмарк, потому что стоимость итерации умножается на неучтённый множитель.'
  kind: open
  reference: 'Счётчик показывает, сколько раз за один прогон агент реально обратился к модели. Ожидаешь один вызов, а видишь два или три — значит цикл делает лишние обороты (повторное планирование, ретрай, лишний шаг после инструмента), и все замеры на самом деле включают эти лишние обороты. С настоящим провайдером такое не видно: каждый вызов маскируется секундной сетевой задержкой и общим разбросом времени, а отдельного числа обращений никто не считает. Плюс счётчик подтверждает, что заглушка вообще подключилась и агент идёт через неё, а не через реального провайдера.'
  id: 005-stub-model-3
  fingerprint: 567eee63
