- concept: проверка бесстатусности должна различать внешнее хранилище и память процесса, чего последовательные вызовы внутри одного процесса не делают
  question: 'Разработчик проверяет свой обработчик тремя последовательными вызовами с одним `session_id` внутри одного процесса: каждый следующий видит предыдущие реплики, тест зелёный. Почему такой тест не доказывает, что сервис бесстатусный, и что проверять вместо этого?'
  explanation: 'Тест обязан воспроизводить условие, ради которого писался код: запрос попал на другую реплику. Один процесс это условие не воспроизводит. Практические приёмы — новый экземпляр обработчика на каждый вызов, подстановка пустого или инструментированного хранилища и проверка того, что чтение/запись действительно шли через него.'
  kind: open
  reference: 'Внутри одного процесса нельзя отличить, откуда пришла память: из хранилища или из живого объекта в памяти (глобальный агент, словарь-кэш, переменная модуля). Оба варианта дают одинаково зелёный тест. Доказательство требует разрыва между вызовами: сделать первый вызов в одном экземпляре обработчика/процессе, а второй — в другом, свежем, который делит с первым только хранилище (или подставить хранилище-заглушку и убедиться, что второй вызов действительно читает из неё, а не из памяти). Дополнительно: подменить хранилище на пустое между вызовами — история обязана стать пустой; если второй вызов всё ещё «помнит» разговор, память живёт в процессе и переживает запрос, а значит балансировщик сломает сервис на первой же перекинутой реплике.'
