- concept: 'момент записи в историю определяет её целостность при сбое вызова модели: незавершённый ход не должен попадать в хранилище'
  question: Обработчик дописывает реплику пользователя в историю и сохраняет её в хранилище ДО вызова модели. Вызов модели падает по таймауту, клиент получает ошибку и повторяет запрос с тем же `session_id`. Что увидит следующий агент?
  explanation: 'Хранилище ничего не откатывает — оно записало то, что ему дали. Ранняя запись оставляет висящую реплику пользователя, и повтор дублирует её. Поэтому пара «вопрос — ответ» дописывается одним действием после успешного ответа модели: ход либо целиком в истории, либо целиком отсутствует.'
  kind: choice
  options:
    - 'Пустую историю: неудачный запрос откатывается хранилищем автоматически'
    - Историю, заканчивающуюся вопросом без ответа, а после повтора — тот же вопрос дважды подряд
    - 'Историю без изменений: запись без ответа модели не имеет смысла и игнорируется при чтении'
    - 'Ошибку чтения: история в несогласованном состоянии и непригодна для сборки агента'
  correct: 1
