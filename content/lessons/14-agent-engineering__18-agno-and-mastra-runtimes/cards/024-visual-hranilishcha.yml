- concept: колоночное хранение читает с диска только запрошенные столбцы, поэтому объём чтения при агрегации падает пропорционально доле столбцов
  question: Таблица трасс имеет 60 столбцов примерно одинакового размера. Запрос агрегирует значения по 5 столбцам за окно. Во сколько примерно раз меньше данных прочитает с диска колоночный движок по сравнению со строковым, который вынужден поднимать строку целиком?
  explanation: 'Строковое хранение кладёт все поля строки рядом, поэтому даже за одним полем поднимается вся строка: 60 столбцов. Колоночное хранит каждый столбец отдельным набором файлов и трогает только 5 из 60, то есть 60/5 = 12 раз меньше ввода-вывода. Именно поэтому под телеметрию рекомендуют ClickHouse, а не тот же Postgres, где живёт память диалогов.'
  kind: numeric
  answer: 12
  tolerance: 0.5
  id: 024-visual-hranilishcha-1
  fingerprint: c310362c
- concept: аналитический колоночный движок расплачивается за скорость агрегации дорогими точечными правками и удалениями отдельных записей
  question: Команда решила не заводить второй бэкенд и сложить историю диалогов в тот же колоночный аналитический движок, где уже лежит телеметрия. Что сломается в первую очередь?
  explanation: 'Колоночные движки оптимизированы под «пишем один раз, читаем столбцами и агрегируем». Трассы такие и есть: их никто не редактирует. История диалогов требует обратного — точечных вставок, правок и удалений (в том числе по запросу на удаление данных пользователя), а это у колоночного движка самая дорогая операция. Компромисс всегда симметричен: выигрыш на агрегации оплачен потерей на точечных изменениях.'
  kind: choice
  options:
    - Агрегации по истории диалогов станут считаться медленнее, чем в строковой базе
    - 'Точечное изменение и удаление отдельных сообщений станет дорогим: движок рассчитан на append и переписывает целые куски данных вместо правки одной записи'
    - Движок откажется хранить текстовые поля большой длины
    - История диалогов перестанет читаться по идентификатору сессии в принципе
