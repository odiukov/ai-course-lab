- concept: индекс сокращает число просматриваемых строк, но не спасает агрегацию, которой по определению нужны все строки окна
  question: Таблица трасс в строковой базе растёт на 300 миллионов записей в сутки. Запрос «средняя длительность шага за последние сутки» идёт минуты. Инженер вешает индекс по времени. Что произойдёт с этим запросом?
  explanation: 'Индекс отсекает лишнее — он выигрывает там, где из миллионов строк нужны единицы. У агрегации за окно нужны все строки окна, отсекать нечего, узкое место — объём поднятых с диска данных. Помогает не индекс, а другая раскладка данных: колоночное хранение читает один нужный столбец вместо полной строки. Это и есть причина, по которой телеметрию уносят в отдельный бэкенд, а не тюнят на месте.'
  kind: choice
  options:
    - 'Запрос ускорится в разы: индекс превратит полный перебор в поиск по дереву'
    - 'Ускорения почти не будет: агрегации нужны все строки окна, а индекс лишь помогает их найти, но не отменяет чтение сотен миллионов строк целиком'
    - Запрос станет быстрее, потому что индекс хранит уже посчитанные средние
    - 'Запрос сломается: агрегатные функции не умеют пользоваться индексами'
