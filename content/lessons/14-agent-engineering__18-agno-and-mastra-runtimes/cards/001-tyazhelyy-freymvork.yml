- concept: 'цена дублирования: две системы состояния и два места приземления ошибок'
  question: Команда добавила агентный фреймворк в зрелый сервис, где уже есть своя БД для состояния и свой логгер. Какие конкретные операционные издержки возникают от такого дублирования? Объясни своими словами.
  explanation: 'Ключ — понять, что цена фреймворка не только в скорости и объёме кода, а в удвоении инфраструктуры: синхронизация состояния и расщеплённая наблюдаемость. Если бы фреймворк закрывал пустоту (greenfield-проект со сложной многоагентной логикой), те же примитивы были бы подарком.'
  kind: open
  reference: 'Появляются две системы состояния, которые надо держать синхронными: часть контекста диалога живёт во внутреннем хранилище фреймворка, часть — в собственной БД сервиса, и при сбое непонятно, какая версия правды актуальна. Плюс два места, куда падают ошибки и шаги исполнения: свои логи, по которым команда годами разбирает инциденты, и отдельный формат трассировки фреймворка — на дежурстве это лишний прыжок между системами. Издержка не в производительности, а в поддержке: за цикл агента платят дублированием инфраструктуры, которая уже написана под свою нагрузку.'
  id: 001-tyazhelyy-freymvork-3
  fingerprint: d86ea699
