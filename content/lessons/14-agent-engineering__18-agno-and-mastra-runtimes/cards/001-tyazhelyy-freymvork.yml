- concept: рантайм встраивается в чужой код и не владеет управлением, фреймворк требует жить по своим законам
  question: Чем позиционирование Agno и Mastra как «рантайма» отличается от позиционирования агентного фреймворка?
  explanation: 'Фреймворк владеет управлением: свой граф исполнения, своё хранилище состояния, свои правила про память диалога. Рантайм отказывается от части этих примитивов, садится внутрь вашего кода и взамен получает скорость и плотную посадку на стек — ваша база остаётся вашей базой, ваш логгер вашим логгером.'
  kind: choice
  options:
    - Рантайм даёт больше готовых примитивов оркестрации, чем фреймворк, но работает медленнее
    - Рантайм запускает агента в отдельном процессе-песочнице, а фреймворк — внутри процесса приложения
    - Рантайм — тонкий слой, который крутит цикл агента внутри вашего кода и сознательно отдаёт часть примитивов (состояние, логирование) окружающему стеку
    - Рантайм работает только с одним провайдером моделей, а фреймворк — с любым
  correct: 2
  id: 001-tyazhelyy-freymvork-2
