- concept: проверка входа перед каждым шагом сводит к нулю расстояние между местом нарушения контракта и местом его обнаружения
  question: Цепочка именованных шагов гоняет один словарь по конвейеру. Шаг `enrich_customer` кладёт в результат ключ `customer_name`, а идущий следом `render_letter` читает ключ `name` и при его отсутствии берёт пустую строку. Что даёт сверка текущих данных с объявленным контрактом входа непосредственно перед вызовом каждого шага?
  explanation: 'Без проверки дефект и симптом разъезжаются: сломано на стыке, а видно на выходе, причём вывод внешне валиден (письмо есть, тело пустое). Проверка на входе каждого шага делает точку отказа равной точке нарушения контракта и называет недостающее поле. Совпадение ключей и типов не обещает смысловой пригодности данных, а вызов шага при несовпадении вообще не происходит — это не про скорость.'
  kind: choice
  options:
    - Отказ происходит на стыке `enrich_customer` → `render_letter`, где контракт и нарушен, вместо тихого пустого письма в самом конце
    - Гарантию, что `render_letter` соберёт осмысленный текст, если ключи совпали
    - 'Ускорение конвейера: несовместимые шаги не тратят время на вызов'
    - Автоматическое переименование `customer_name` в `name` при совпадении типа
  correct: 0
  id: 020-run-workflow-1
  fingerprint: f2127f7e
- concept: валидация входа стоит до вызова шага, чтобы несовместимость не оплачивалась уже совершённым побочным эффектом
  question: Расставь действия одной итерации цикла процесса, который ведёт единственную переменную с текущими данными.
  explanation: 'Проверка обязана предшествовать вызову: шаг может писать в базу или дёргать внешний API, и после такого вызова откат стоит дороже, чем отказ. Имя пишется в список только после успешного вызова — иначе список соврёт о том, что уже произошло.'
  kind: order
  items:
    - взять очередной шаг из списка вместе с описанием ожидаемого входа
    - 'сверить текущие данные с этим описанием: нужные поля присутствуют и нужного типа'
    - вызвать функцию шага на текущих данных
    - добавить имя шага в список отработавших
    - сделать возвращённый результат текущими данными для следующего шага
  id: 020-run-workflow-2
  fingerprint: 1efcdf09
- concept: список отработавших шагов фиксирует границу уже совершённых побочных эффектов, а не только глубину прогресса
  question: Процесс останавливается на нарушении контракта и возвращает имя упавшего шага, недостающее поле и список имён уже отработавших шагов. Зачем нужен последний список, если имя точки отказа уже известно? Объясни своими словами.
  explanation: 'Имя точки отказа — диагностика, список пройденного — состояние системы. Первое отвечает на «почему встало», второе на «что уже произошло и что делать дальше»: откат, ручное вмешательство или перезапуск с середины.'
  kind: open
  reference: 'Список отработавших шагов очерчивает границу побочных эффектов, которые уже случились: какие шаги успели записать в хранилище, списать деньги, отправить письмо или дёрнуть внешний API. По нему решают, что откатывать и с какого места безопасно возобновить процесс после починки, чтобы не повторить неидемпотентные операции. Одно имя упавшего шага говорит, где встало, но ничего не говорит о том, что уже сделано и что теперь нужно чинить во внешнем мире.'
  id: 020-run-workflow-3
  fingerprint: a72c6376
