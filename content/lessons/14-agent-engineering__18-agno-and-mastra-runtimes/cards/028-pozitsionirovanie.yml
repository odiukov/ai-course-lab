- concept: language fit — это отсутствие межъязыковой прослойки в существующем коде, а не свойство самого рантайма
  question: Продукт целиком написан на TypeScript. Команда выбирает агентный рантайм и рассматривает вариант на Python. Какая цена этого выбора наиболее прямая?
  explanation: 'Совпадение языка — это возможность встроить агента в уже работающий код без прослойки: те же типы, тот же процесс, тот же деплой. Несовпадение оплачивается сетевой границей и второй инфраструктурой. Модели и схемы инструментов доступны в обеих экосистемах, качество ответов от языка не зависит.'
  kind: choice
  options:
    - 'Агент перестаёт быть частью существующего процесса: нужен отдельный сервис и межъязыковая граница с сериализацией, своим деплоем и своими отказами'
    - Питоновский рантайм не сможет вызывать те же модели, что доступны из TypeScript
    - Инструменты агента придётся описывать без схем, потому что схемы существуют только в одной экосистеме
    - Качество ответов упадёт из-за разницы в реализации цикла агента
  correct: 0
