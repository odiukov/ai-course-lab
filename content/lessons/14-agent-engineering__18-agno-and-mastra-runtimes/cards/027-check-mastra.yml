- concept: схема и описание инструмента — часть того, что видит модель, поэтому определяют не только проверку аргументов, но и решение о вызове
  question: Инструмент агента объявлен с описанием и схемой аргументов. Кроме проверки того, что реально пришло от модели, какую вторую роль эта пара играет — и что ломается, если описание расплывчатое, а поля названы `a` и `b`?
  explanation: 'Схема работает в обе стороны: наружу — как контракт для модели, внутрь — как проверка аргументов. Первая роль часто забывается, а именно она определяет, попадёт ли модель в инструмент с первого раза.'
  kind: open
  reference: 'Описание и схема сериализуются в спецификацию инструмента, которую видит модель: по ним она решает, звать ли инструмент, какой именно из нескольких и что положить в каждое поле. То есть это одновременно валидатор на входе и кусок промпта. Расплывчатое описание и безымянные поля `a`/`b` бьют по второй роли: модель либо не вызывает инструмент там, где он нужен, либо путает порядок значений и подставляет город в поле числа. Валидация такой вызов отклонит, но ошибка уже оплачена лишним ходом модели; лечится не строгостью схемы, а внятными именами полей и описанием.'
  id: 027-check-mastra-2
  fingerprint: 3e36f6c6
- concept: ограничения лицензии следуют за самим кодом при копировании, а не остаются в репозитории-источнике
  question: Разработчик скопировал файлы из каталога с source-available лицензией в свой приватный репозиторий, переименовал пакет и положил в корень свой MIT-овский LICENSE. Что произошло с правами на этот код?
  explanation: 'Лицензия — условие правообладателя на использование конкретного кода, а не свойство места хранения. Копирование, переименование и свой LICENSE в корне ничего не переписывают: коммерческие ограничения source-available едут вместе с файлами. Приватность репозитория тоже не помогает — триггером обычно является использование в продукте, а не публикация.'
  kind: choice
  options:
    - 'Ничего не изменилось: ограничения исходной лицензии продолжают действовать на скопированный код, где бы он ни лежал'
    - 'Код стал MIT: лицензия определяется файлом LICENSE в корне того репозитория, где код лежит сейчас'
    - Переименование пакета делает код производным произведением с новыми правами
    - Ограничения снимаются, потому что репозиторий приватный и код не публикуется
  correct: 0
