- concept: состав цикла агента, который даёт рантайм
  question: Рантайм агентов не оркестрирует граф — он крутит один цикл. Расставь шаги этого цикла в правильном порядке.
  explanation: Весь рантайм — это петля «модель, проверка на tool call, исполнение, возврат результата, снова модель». Всё остальное (где лежит состояние, как считаются ретраи, куда идут трейсы) рантайм не решает — это остаётся коду приложения.
  kind: order
  items:
    - Вызвать модель с текущим контекстом
    - Проверить, запросила ли модель вызов инструмента
    - Выполнить запрошенный инструмент
    - Добавить результат инструмента в контекст и вернуть модели
    - Повторять, пока модель не выдаст финальный ответ вместо вызова инструмента
  id: 002-runtime-vs-framework-1
  fingerprint: febee650
- concept: рантайм меняет встроенные примитивы на скорость и плотную посадку на существующий стек, платя объёмом собственного кода
  question: Agno в Python и Mastra в TypeScript намеренно отдают приложению часть примитивов, которыми обычно распоряжается агентный фреймворк. Что команда получает взамен и чем за это платит?
  explanation: 'Размен именно такой: меньше встроенного — меньше накладных расходов и меньше конфликтов с окружающим кодом. Цена — больше собственного кода. Тяжёлые фреймворки (LangGraph, AutoGen, CrewAI) делают обратный размен: дают примитивы, но требуют жить по своим правилам.'
  kind: choice
  options:
    - Получает скорость и плотную посадку на уже написанный стек; платит тем, что состояние, ретраи и трейсинг реализует сама
    - Получает готовую оркестрацию и чекпоинтер состояния; платит только увеличенным временем старта процесса
    - Получает автоматическое масштабирование воркеров; платит привязкой к одному облачному провайдеру
    - Получает более качественные ответы модели; платит ограничением на список поддерживаемых провайдеров
  correct: 0
  id: 002-runtime-vs-framework-2
  fingerprint: 5f27f950
- concept: перечень примитивов, которыми владеет фреймворк и которые рантайм оставляет приложению
  question: Какой набор вещей агентный фреймворк типично берёт под своё управление, а рантайм оставляет приложению?
  explanation: 'Это и есть примитивы фреймворка: состояние, семантика шага, передача данных между узлами, обработка ошибок. Рантайм ни один из них не присваивает — потому и встаёт внутрь чужого сервиса без спора за собственную схему хранения и собственный логгер.'
  kind: choice
  options:
    - Хранение состояния диалога, определение того, что считается шагом, передачу данных между узлами и поведение при ошибке
    - Выбор провайдера модели и формат системного промпта
    - Сборку проекта, упаковку в контейнер и деплой
    - Схему таблиц бизнес-данных и права доступа пользователей
  correct: 0
  id: 002-runtime-vs-framework-3
  fingerprint: 1d95edf3
