- concept: цена составного хранилища — потеря общих транзакций и join между бэкендами плюс умноженная операционная поверхность
  question: Команда разнесла память диалогов и телеметрию по двум разным СУБД. За что придётся заплатить?
  explanation: 'Разделение — сделка. Выигрыш: каждому типу данных своя база под его профиль записи и чтения. Плата: атомарность и join существуют только внутри одной базы, поэтому «покажи сообщение и все его трассы» становится склейкой на стороне приложения по общему trace/session id, а расхождение между хранилищами при частичном сбое приходится терпеть или чинить отдельно. Плюс удвоенные бэкапы, доступы и мониторинг.'
  kind: choice
  options:
    - За то, что телеметрию теперь нельзя агрегировать
    - 'За то, что пропадает единая транзакция и join поверх обоих хранилищ: связывать запись диалога с её трассой приходится по общему идентификатору в коде, а бэкапов, миграций и точек отказа становится вдвое больше'
    - За то, что память диалогов теряет транзакционность
    - За то, что запись в оба хранилища обязана идти строго последовательно и синхронно
  correct: 1
