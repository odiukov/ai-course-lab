- concept: объём телеметрии растёт как число шагов на запрос, а не как число диалогов, поэтому обгоняет память на порядок
  question: Агент пишет на один запрос пользователя 2 строки памяти диалога и 30 строк трасс (старт шага, вызов инструмента, ответ модели, токены, задержка). Сервис обрабатывает 5000 запросов в сутки. Сколько строк трасс накопится за 60 суток?
  explanation: '30 × 5000 × 60 = 9 000 000 строк трасс против 600 000 строк памяти. Множитель задаёт не число диалогов (оно общее), а число событий на запрос: телеметрия детализирует каждый шаг, память — только реплики. Отсюда и разведение по разным бэкендам: данные с разным темпом роста нельзя держать в одной таблице и надеяться, что индексы выдержат.'
  kind: numeric
  answer: 9000000
  tolerance: 1000
  id: 023-sostavnoe-hranilishche-1
  fingerprint: ac76d170
- concept: точечные запросы деградируют от соседства с быстрорастущей таблицей в общем бэкенде, хотя сами возвращают столько же строк
  question: Память диалогов и трассы лежат в одной Postgres-базе. Запрос «последние 15 сообщений сессии» возвращает те же 15 строк, что и полгода назад, но стал в разы медленнее. Что наиболее вероятная причина?
  explanation: 'Результат тот же — деградировала среда. Гигантская таблица трасс вытесняет из shared buffers горячие страницы памяти, нагружает autovacuum и I/O, статистика планировщика устаревает. Классический шумный сосед: разделение бэкендов лечит это не тем, что «ClickHouse быстрее», а тем, что нагрузки перестают конкурировать за один инстанс.'
  kind: choice
  options:
    - Ответ содержит больше данных, чем раньше
    - 'Растущая таблица трасс делит с памятью ресурсы инстанса: кэш, диск, autovacuum и планировщик — цена запроса зависит не только от размера его результата'
    - Postgres не умеет отдавать 15 строк за приемлемое время без специального индекса
    - Модель стала возвращать более длинные сообщения, поэтому чтение дольше
  correct: 1
