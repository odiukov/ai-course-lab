- concept: дешёвая инициализация улучшает пропускную способность системы, а не задержку отдельного запроса
  question: Заказчик просит «быстрый рантайм», имея в виду, что пользователь ждёт ответ слишком долго. Один запрос = один вызов LLM. Объясни, почему выбор рантайма по стоимости инициализации агента не решит его задачу и на какую метрику этот выбор вообще влияет.
  explanation: Задержка и пропускная способность — разные метрики. 2μs на фоне секундного вызова модели не видны в одном ответе, но при десятках тысяч созданий в секунду решают, справляется сервис вообще или нет. Ответ пользователю ускоряет только работа с доминирующей частью — самим вызовом LLM.
  kind: open
  reference: 'Стоимость инициализации агента (микросекунды) влияет на пропускную способность — сколько агентов система успевает создать и выбросить за секунду. Задержку одного ответа она не меняет: там время почти целиком занимает вызов модели (порядка секунды, то есть в сотни тысяч раз больше). Чтобы сократить ожидание пользователя, надо работать с самим вызовом: модель поменьше, стриминг, кэш, сокращение числа обращений. Быстрый рантайм имеет смысл выбирать тогда, когда агентов создаётся много и создание — самая дорогая операция в цикле.'
  id: 009-kogda-skorost-vazhna-3
  fingerprint: f720c1dc
