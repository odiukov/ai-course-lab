- concept: число одновременно живых агентов ограничено памятью на агента и потолком контейнера
  question: Рантайм тратит 4 KiB памяти на один экземпляр агента. Сервис работает в контейнере с лимитом 512 MiB, и вся память отдана под живых агентов. Сколько агентов может существовать одновременно?
  explanation: '512 MiB = 524288 KiB, делим на 4 KiB — 131072 агента. Память на агента упирается не в скорость, а в потолок процесса: она задаёт максимальную одновременную ёмкость. Именно поэтому Agno заявляет ~3,75 KiB на агента рядом с ~2μs инициализации — второе число про темп, первое про ёмкость.'
  kind: numeric
  answer: 131072
  tolerance: 500
  id: 009-kogda-skorost-vazhna-1
  fingerprint: b4a22d33
- concept: потолок пропускной способности задаёт самый узкий ресурс системы, и при выходе каждого агента на внешний API это лимит провайдера, а не стоимость локальной инициализации
  question: Сервис поднимает по агенту на каждую входящую запись, и каждый агент обязательно делает вызов модели. Провайдер режет на 500 запросах в секунду. Что даст переезд на рантайм, где создание агента дешевле в тысячу раз?
  explanation: 'Систему держит самый узкий ресурс. Если каждый агент выходит наружу, узкое место — квота провайдера: сколько бы агентов вы ни создали, наружу пройдёт 500 в секунду. Дешёвая инициализация окупается на профиле, где большинство агентов умирает до вызова модели — фильтры, маршрутизация, сведение чатов.'
  kind: choice
  options:
    - 'Пропускная способность не вырастет: потолок держит лимит провайдера, а не создание агента'
    - Пропускная способность вырастет примерно в тысячу раз
    - Пропускная способность вырастет вдвое, потому что убирается половина накладных расходов
    - Вырастет только память, пропускная способность упадёт
