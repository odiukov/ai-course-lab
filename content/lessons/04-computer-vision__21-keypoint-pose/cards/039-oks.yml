- concept: реализация OKS должна отклонять неположительный масштаб объекта
  question: Почему перед вычислением OKS необходимо проверить, что масштаб объекта положителен?
  explanation: Проверка входа предотвращает деление на ноль и появление бесконечных или неопределённых значений. Кроме того, она делает ошибку в данных явной, а не маскирует её некорректным значением OKS.
  kind: open
  reference: Масштаб используется в знаменателе при нормировании ошибки локализации. Нулевой масштаб делает вычисление неопределённым, а отрицательный не имеет физического смысла как размер объекта, поэтому такие входные данные следует явно отклонять.
  id: 039-oks-2
  fingerprint: 7a0e2b04
