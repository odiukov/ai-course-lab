- concept: асимметрия соседей пика задаёт направление субпиксельного уточнения
  question: У максимума heatmap правый сосед ярче левого, а верхний сосед ярче нижнего. В каком направлении следует уточнить положение ключевой точки?
  explanation: Более яркий правый сосед указывает на положительный сдвиг по x, а более яркий верхний — на отрицательный сдвиг по y. Поэтому оценку смещают вправо и вверх относительно целочисленного argmax.
  kind: choice
  options:
    - Вправо и вверх
    - Влево и вверх
    - Вправо и вниз
    - Оставить без изменения
  correct: 0
  id: 017-subpixel-parabola-1
  fingerprint: 66401be8
- concept: знак разности соседних значений отделяет направление сдвига от амплитуды heatmap
  question: Почему при фиксированном субпиксельном уточнении координаты используют знак разности значений соседей, а не саму величину этой разности?
  explanation: 'Формула с sign ограничивает поправку фиксированной четвертью пикселя: амплитуда heatmap не влияет на длину шага. Сырые разности смешивали бы геометрию локального пика с уверенностью предсказания.'
  kind: open
  reference: Знак сохраняет только направление к более яркому соседу. Сама разность зависит также от амплитуды heatmap и уверенности модели, поэтому её использование как величины сдвига могло бы слишком далеко увести координату от пика.
  id: 017-subpixel-parabola-2
  fingerprint: f317e77e
