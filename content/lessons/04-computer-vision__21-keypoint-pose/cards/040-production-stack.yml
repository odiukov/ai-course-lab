- concept: бюджет времени кадра определяется частотой кадров, а задержка оценки позы сокращает доступный остаток
  question: Приложение работает с частотой 25 fps, а оценка позы занимает 6 мс. Сколько миллисекунд в каждом кадре остаётся на остальные операции?
  explanation: Бюджет кадра равен 1000 / 25 = 40 мс. После вычитания 6 мс на оценку позы остаётся 34 мс. Аналогично, при 30 fps MediaPipe занимает меньше 10 мс из доступных примерно 33 мс.
  kind: numeric
  answer: 34
  tolerance: 0.1
