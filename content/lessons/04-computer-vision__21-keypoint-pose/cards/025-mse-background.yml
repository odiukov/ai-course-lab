- concept: повышенный вес пикселей возле keypoint компенсирует доминирование фона в MSE
  question: Заполните пропуск во взвешенном MSE так, чтобы ошибка каждого пикселя масштабировалась назначенным ему весом.
  explanation: Если назначить областям возле keypoint больший вес, ошибки на полезном сигнале сильнее повлияют на loss и градиенты. Это уменьшает численное доминирование обширного нулевого фона.
