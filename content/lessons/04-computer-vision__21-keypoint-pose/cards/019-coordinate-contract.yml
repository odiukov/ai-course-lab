- concept: горизонтальная и вертикальная координаты масштабируются независимо по размерам соответствующих осей
  question: Фрагмент изображения и heatmap могут иметь разные пропорции. Какая формула корректно возвращает точку из координат heatmap в исходное изображение?
  explanation: 'Для каждой оси нужен свой коэффициент: ширина фрагмента делится на ширину heatmap, а высота — на её высоту. Смещение левого верхнего угла добавляют после перевода локальной координаты в пиксели фрагмента.'
  kind: choice
  options:
    - x_orig = x0 + x_hm · w_crop / W_hm; y_orig = y0 + y_hm · h_crop / H_hm
    - x_orig = x0 + x_hm · w_crop / W_hm; y_orig = y0 + y_hm · w_crop / W_hm
    - x_orig = (x0 + x_hm) · w_crop / W_hm; y_orig = (y0 + y_hm) · h_crop / H_hm
    - x_orig = x0 + x_hm · h_crop / H_hm; y_orig = y0 + y_hm · w_crop / W_hm
