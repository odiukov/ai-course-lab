- concept: пространственной близости недостаточно для связывания keypoint в плотной сцене
  question: Почему нельзя надёжно собирать позы, всегда связывая каждый keypoint с ближайшим кандидатом соседнего типа?
  explanation: 'Расстояние отражает только геометрию расположения кандидатов, но не их принадлежность человеку. PAF добавляет свидетельство связи: вдоль корректной конечности его векторы согласованы с направлением между keypoint.'
  kind: open
  reference: При перекрытии людей или пересечении конечностей точка другого человека может оказаться ближе правильной. Для связи нужно учитывать свидетельство принадлежности одной конечности, например согласованность направления affinity field вдоль отрезка между кандидатами.
  id: 030-association-problem-2
  fingerprint: 07ff59c0
