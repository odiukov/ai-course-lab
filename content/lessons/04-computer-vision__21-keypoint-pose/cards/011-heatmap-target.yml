- concept: значение гауссовой цели определяется расстоянием до истинной точки относительно sigma
  question: Целевая heatmap задана гауссовым пятном с sigma = 5 пикселей. Какое значение target будет в ячейке, удалённой от центра ровно на sigma? Округли до сотых.
  explanation: При расстоянии, равном sigma, показатель экспоненты равен −0.5, поэтому target = exp(−0.5) ≈ 0.607. Благодаря такому плавному убыванию соседние с истинной точкой ячейки получают ненулевой целевой сигнал.
  kind: numeric
  answer: 0.61
  tolerance: 0.01
  id: 011-heatmap-target-1
  fingerprint: 9411bdc0
- concept: координата keypoint на инференсе извлекается как позиция максимума его heatmap
  question: Модель предсказала отдельную heatmap для ключевой точки. Какая операция непосредственно даёт её целочисленные координаты на сетке?
  explanation: Argmax выбирает индекс самой яркой ячейки heatmap. Столбец этого индекса задаёт координату x, а строка — координату y предсказанного keypoint.
  kind: choice
  options:
    - Поиск ячейки с максимальным значением
    - Усреднение координат всех ячеек без учёта их значений
    - Поиск ячейки с минимальным значением
    - Суммирование значений по строкам и столбцам без поиска максимума
