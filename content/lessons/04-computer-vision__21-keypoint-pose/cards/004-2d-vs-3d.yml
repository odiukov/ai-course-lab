- concept: различие между координатами позы на изображении и в пространстве
  question: Какие координаты описывают пространственную позу человека, но отсутствуют в обычном представлении позы на изображении?
  explanation: Поза на изображении задаёт положение ориентиров на плоскости кадра. Пространственная поза дополнительно описывает удаление точек от камеры либо их положение в мировой системе координат.
  kind: choice
  options:
    - Только номер семантического класса каждой точки
    - Координаты глубины относительно камеры или положение в мировой системе
    - Только цвет пикселя под каждой точкой
    - Связи между соседними суставами
  correct: 1
  id: 004-2d-vs-3d-1
  fingerprint: f693c8ca
- concept: неоднозначность восстановления глубины по монокулярному изображению
  question: Почему одинаковое расположение суставов на плоском изображении не гарантирует одинаковую пространственную позу? Объясни своими словами.
  explanation: 'Монокулярная проекция является неоднозначным преобразованием: она сохраняет положение точек на плоскости, но не сообщает их расстояние от камеры. Из-за этого вытянутая в глубину и согнутая конечность могут иметь почти одинаковую проекцию.'
  kind: open
  reference: 'Проекция из пространства на плоскость теряет глубину: разные положения суставов вдоль направления взгляда могут давать одинаковые координаты на изображении. Поэтому одной плоской конфигурации может соответствовать несколько пространственных поз.'
  id: 004-2d-vs-3d-2
  fingerprint: '90925849'
- concept: дополнительные ограничения помогают разрешить неоднозначность глубины
  question: Какие данные наиболее непосредственно помогают различить пространственные позы с почти одинаковой проекцией на одном кадре?
  explanation: Движение во времени накладывает ограничения на изменение позы, а дополнительная камера наблюдает тело под другим углом. Оба источника дают сведения о глубине, которых нет в одиночной проекции.
  kind: choice
  options:
    - Последовательность кадров или изображение с другой камеры
    - Увеличение яркости исходного кадра
    - Замена цветового пространства изображения
    - Сжатие изображения с меньшим качеством
  correct: 0
