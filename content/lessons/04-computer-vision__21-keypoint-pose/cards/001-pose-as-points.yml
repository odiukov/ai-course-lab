- concept: индекс ключевой точки задаёт её неизменную семантическую роль
  question: Модель выдаёт позу как массив координат фиксированной длины. Что должно оставаться неизменным для всех изображений датасета?
  explanation: 'Индекс кодирует семантику: например, одна позиция массива всегда относится к носу, другая — к конкретному плечу. Положение частей тела на изображении может меняться, но схема индексов должна быть постоянной.'
  kind: choice
  options:
    - Соответствие каждого индекса определённой анатомической точке
    - Порядок точек слева направо на изображении
    - Расстояние между соседними точками в массиве
    - Цвет пикселя под каждой точкой
  correct: 0
  id: 001-pose-as-points-1
  fingerprint: c0485d74
- concept: перестановка координат между семантическими слотами делает описание позы неверным
  question: Координаты двух ключевых точек определены точно, но при формировании выходного массива их индексы поменяли местами. Почему предсказание позы всё равно считается ошибочным?
  explanation: 'Набор геометрических позиций может остаться тем же, однако семантическая разметка нарушается: модель сообщает, что одна часть объекта находится в позиции другой.'
  kind: open
  reference: Потому что в позе важны не только координаты, но и их соответствие заданным семантическим ролям. После перестановки каждая координата приписана другой части объекта.
  id: 001-pose-as-points-2
  fingerprint: 2893a19f
