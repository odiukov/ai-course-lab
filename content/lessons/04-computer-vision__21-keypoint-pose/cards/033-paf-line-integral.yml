- concept: совпадающие концы отрезка требуют отдельной обработки до нормировки направления
  question: Объясни, почему функция оценки связи по PAF должна отдельно обрабатывать случай, когда оба кандидата находятся в одной координате.
  explanation: Направление отрезка определяется нормированным вектором смещения. Для отрезка нулевой длины такое направление не существует, а попытка нормировки приводит к делению на нулевую норму.
  kind: open
  reference: У вектора смещения между совпадающими точками нулевая норма, поэтому получить единичное направление делением на норму невозможно. Случай нужно перехватить до нормировки и вернуть заранее оговорённую нейтральную оценку либо отклонить связь.
  id: 033-paf-line-integral-2
