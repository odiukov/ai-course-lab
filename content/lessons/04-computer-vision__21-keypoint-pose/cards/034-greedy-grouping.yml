- concept: экземпляр человека собирается транзитивным объединением связей с общими кандидатами keypoint
  question: Объясни своими словами, как из выбранных связей «плечо — локоть» и «локоть — запястье» bottom-up алгоритм собирает отдельные экземпляры людей.
  explanation: PAF-баллы определяют правдоподобные парные связи, а принадлежность целой позе возникает при объединении связей через общий кандидат keypoint. Так формируются раздельные, в том числе неполные, скелеты.
  kind: open
  reference: 'Связи, содержащие один и тот же обнаруженный кандидат на локоть, присоединяются к одному экземпляру человека: первая связь создаёт или расширяет экземпляр, а следующая продолжает его через общий keypoint. Цепочки без общих кандидатов остаются разными экземплярами; отсутствие некоторых keypoint не мешает сохранить неполную позу.'
  id: 034-greedy-grouping-2
