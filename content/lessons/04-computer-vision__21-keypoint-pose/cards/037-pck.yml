- concept: граничное расстояние включается в число правильных ключевых точек
  question: Какой оператор сравнения нужен, чтобы ключевая точка на границе допустимого радиуса считалась правильной?
  explanation: 'Проверка должна быть включительной: если расстояние точно равно threshold, точка засчитывается. Поэтому используется оператор <=, а не <.'
  kind: cloze
  template: hits = distances ___ threshold
  answer: <=
  accept:
    - <=
    - ≤
  id: 037-pck-1
  fingerprint: 5345af7e
- concept: PCK не убывает при увеличении фиксированного порога
  question: Почему при неизменных предсказаниях и целевых координатах увеличение порога не может уменьшить PCK?
  explanation: Условие попадания имеет вид distance <= threshold. Более высокий threshold расширяет множество допустимых расстояний, поэтому ни одно прежнее попадание не исчезает.
  kind: open
  reference: При увеличении порога каждая ранее засчитанная точка остаётся внутри допустимого радиуса, а некоторые ранее не засчитанные точки могут попасть внутрь. Поэтому число попаданий и их доля могут только сохраниться или увеличиться.
  id: 037-pck-2
  fingerprint: d7888316
