- concept: знак PAF-оценки зависит от согласованности порядка концов с ориентацией поля
  question: PAF для связи обучен указывать от плеча к локтю. В реализации кандидат оценивают в обратном направлении — от локтя к плечу, — но само поле не инвертируют. Что произойдёт?
  explanation: При обратном обходе единичный вектор отрезка меняет направление, а векторы PAF продолжают указывать от плеча к локтю. Их скалярные произведения поэтому меняют знак. Порядок концов при вычислении оценки должен соответствовать ориентации, принятой при обучении PAF.
  kind: choice
  options:
    - Скалярные произведения сменят знак, поэтому правильная связь может получить низкую или отрицательную оценку
    - Оценка не изменится, потому что геометрический отрезок остался тем же
    - Оценка будет зависеть только от максимумов heatmap в концах отрезка
  correct: 0
  id: 035-paf-visual-1
  fingerprint: 31c1b43d
- concept: сильное перекрытие или ошибочное поле может сделать неверную PAF-связь убедительной
  question: Объясни, при каких условиях PAF всё же может ошибочно связать плечо одного человека с локтем другого.
  explanation: PAF проверяет направленную поддержку вдоль пути между кандидатами. При сильном перекрытии или шуме неверный путь иногда получает такую же согласованную поддержку, как настоящий, и алгоритм группировки может выбрать чужой локоть.
  kind: open
  reference: Ошибка возможна, если из-за перекрытия конечностей, шума или неточного предсказания вдоль неверного отрезка возникает достаточно согласованное поле. Тогда его PAF-оценка может оказаться сопоставимой с оценкой правильной связи, поэтому метод уменьшает вероятность ошибки, но не гарантирует её отсутствие.
  id: 035-paf-visual-2
  fingerprint: 84a12ae9
