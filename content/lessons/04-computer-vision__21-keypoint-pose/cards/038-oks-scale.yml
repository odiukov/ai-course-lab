- concept: OKS инвариантен к одинаковому масштабированию ошибки и размера объекта
  question: 'Изображение позы масштабировали: расстояние ошибки d_i и размер человека s изменились с одним и тем же коэффициентом, а k_i осталось прежним. Как изменится OKS_i?'
  explanation: Отношение d_i к s не меняется, поэтому нормированная ошибка и соответствующее ей экспоненциальное сходство остаются прежними. Так OKS отделяет качество локализации от масштаба человека на изображении.
  kind: choice
  options:
    - Останется прежним
    - Уменьшится
    - Увеличится
  correct: 0
  id: 038-oks-scale-1
  fingerprint: 51b98a95
- concept: коэффициент конкретного типа keypoint учитывает естественную неопределённость его разметки
  question: Для бедра задан больший коэффициент допуска k_i, чем для носа. У модели одинаковая ошибка локализации этих точек на людях одинакового размера. Какая точка получит более высокий OKS_i и почему?
  explanation: При одинаковых d_i и s больший k_i означает более широкий допуск и более высокое сходство. Это учитывает разную воспроизводимость разметки разных суставов, а не объявляет один тип точки более важным.
  kind: open
  reference: 'Бедро получит более высокий OKS_i: больший k_i уменьшает нормированную ошибку и смягчает штраф, поскольку положение бедра обычно размечается менее однозначно.'
  id: 038-oks-scale-2
  fingerprint: 75d53fa8
