- concept: PCK равен доле ключевых точек, попавших в допустимую область
  question: Метрика PCK считает ключевую точку правильной, если предсказание попало в допустимый радиус. Из 24 проверенных точек правильными признаны 21. Чему равен PCK?
  explanation: 'PCK вычисляется как отношение числа правильных точек к числу проверенных: 21 / 24 = 0.875, или 87.5%.'
  kind: numeric
  answer: 0.875
  tolerance: 0.001
  id: 036-pck-threshold-1
  fingerprint: 068d69b4
- concept: нормирование порога PCK по размеру человека учитывает масштаб изображения
  question: Порог PCK задан как одна и та же доля высоты bounding box человека. Как это влияет на допустимый радиус?
  explanation: Умножение относительного порога на размер bounding box даёт больший пиксельный радиус для крупного человека и меньший для далёкого. Поэтому ошибка оценивается относительно масштаба объекта.
  kind: choice
  options:
    - Для крупного человека радиус больше в пикселях, но сохраняет тот же относительный масштаб
    - Радиус одинаков в пикселях для людей любого размера
    - Для крупного человека радиус меньше в пикселях
    - Любая точка внутри bounding box считается правильной
  correct: 0
  id: 036-pck-threshold-2
  fingerprint: d275d921
- concept: пороговая природа PCK отбрасывает информацию о величине ошибки внутри и снаружи границы
  question: Объясни, почему две почти одинаковые ошибки локализации могут дать разные результаты для отдельной точки в PCK.
  explanation: PCK сохраняет только результат «попал или не попал». Она не показывает, насколько глубоко предсказание оказалось внутри допустимой области или насколько мало ему не хватило до попадания.
  kind: open
  reference: 'PCK применяет жёсткий порог: точка по одну сторону границы считается правильной, а по другую — неправильной. Поэтому даже очень близкие по величине ошибки дают разные бинарные результаты, если между ними проходит порог.'
  id: 036-pck-threshold-3
  fingerprint: 693d907b
