- concept: средняя евклидова ошибка равна среднему длин векторов смещения всех ключевых точек
  question: Для шести keypoint ошибки по координатам равны (6, 8), (9, 12), (8, 15), (12, 16), (7, 24) и (16, 30) пикселей. Чему равна средняя евклидова ошибка?
  explanation: Евклидовы расстояния равны 10, 15, 17, 20, 25 и 34 пикселям. Их сумма равна 121, поэтому средняя ошибка составляет 121 / 6 ≈ 20.17 пикселя.
  kind: numeric
  answer: 20.17
  tolerance: 0.06
  id: 027-l2-distance-1
  fingerprint: 9f4bc106
- concept: евклидова ошибка зависит от величины смещения, а не от его направления
  question: Два предсказания смещены от истинной ключевой точки на одинаковое расстояние, но в противоположных направлениях. Почему их вклад в среднюю евклидову ошибку одинаков?
  explanation: Метрика учитывает величину промаха. Направление смещения не влияет на длину вектора, поэтому противоположные ошибки одинакового размера получают одинаковую оценку.
  kind: open
  reference: Евклидова ошибка — это длина вектора смещения. При смене направления знаки его компонент меняются, но после возведения компонент в квадрат длина остаётся прежней.
  id: 027-l2-distance-2
  fingerprint: 4ee93ef7
