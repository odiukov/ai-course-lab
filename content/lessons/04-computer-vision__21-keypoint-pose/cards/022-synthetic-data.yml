- concept: синтетический датасет проверяет корректность механики пайплайна, но не качество на реальных данных
  question: Маленькая модель не может переобучиться на простом синтетическом наборе с точно известными точками и целевыми heatmap. Что это позволяет предположить и чего успешный тест всё равно не доказывает?
  explanation: Синтетические примеры устраняют шум ручной разметки и сложность реальных сцен, поэтому помогают локализовать технические ошибки. Однако они не воспроизводят разнообразие внешности, освещения, фона и поз настоящего датасета.
