- concept: две компоненты PAF необходимы, чтобы различать направления на плоскости
  question: Пару компонент PAF (u_x, u_y) заменили одним скалярным значением ||u||. Какую критически важную информацию при этом потеряли?
  explanation: Одинаковую длину могут иметь векторы, направленные совершенно по-разному. Горизонтальная и вертикальная компоненты вместе сохраняют ориентацию конечности, а одна величина нормы — нет.
  kind: choice
  options:
    - Положение пикселя на изображении
    - Тип связываемых ключевых точек
    - Ориентацию конечности на плоскости
    - Разрешение исходного изображения
  correct: 2
  id: 031-paf-field-1
  fingerprint: 277a2dc8
- concept: нормировка вектора PAF отделяет направление конечности от её длины
  question: Пусть v — вектор смещения от начальной ключевой точки конечности к конечной. Заполни формулу единичного направления PAF.
  explanation: Деление вектора смещения на его норму убирает зависимость от расстояния между суставами. Полученный PAF-вектор кодирует направление конечности, а не её длину.
  kind: cloze
  template: u = v / ___
  answer: '||v||'
  accept:
    - ‖v‖
    - norm(v)
    - длина v
    - норма v
  id: 031-paf-field-2
  fingerprint: 183cd0bf
