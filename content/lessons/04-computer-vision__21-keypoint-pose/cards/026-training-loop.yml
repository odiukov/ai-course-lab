- concept: пространственные размеры предсказанной и целевой heatmap должны совпадать для попиксельного MSE
  question: Предсказанные heatmap имеют другое пространственное разрешение, чем целевые. Что нужно сделать перед вычислением попиксельного MSE?
  explanation: Попиксельный MSE сопоставляет элементы в одинаковых пространственных позициях, поэтому высота и ширина тензоров должны совпадать. Если размеры уже одинаковы, дополнительное изменение разрешения не требуется.
  kind: choice
  options:
    - Привести предсказанные heatmap к высоте и ширине целевых
    - Извлечь координаты максимумов и сравнить только их
    - Сложить все каналы предсказания в один
    - Заменить целевые heatmap бинарными метками
  correct: 0
  id: 026-training-loop-1
  fingerprint: 17dec3d9
- concept: последовательность обновления параметров модели при обучении на MSE между heatmap
  question: Расположи действия одной обучающей итерации в правильном порядке.
  explanation: Сначала строится предсказание и вычисляется скалярная ошибка. Затем старые градиенты очищаются, обратное распространение вычисляет новые градиенты, а оптимизатор использует их для изменения параметров модели.
  kind: order
  items:
    - Получить от модели предсказанные heatmap
    - При необходимости привести их пространственный размер к размеру целей
    - Вычислить MSE между предсказанными и целевыми heatmap
    - Очистить накопленные градиенты параметров
    - Выполнить обратное распространение ошибки
    - Обновить параметры оптимизатором
  id: 026-training-loop-2
  fingerprint: e863d06a
