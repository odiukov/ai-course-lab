<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Как меняются формы внутри TinyKeypointNet</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fc;
      --panel: #ffffff;
      --panel-soft: #f0f3f9;
      --ink: #172033;
      --muted: #59657a;
      --border: #cbd3e1;
      --route: #52627b;
      --teal: #087f73;
      --teal-soft: #cceee8;
      --violet: #7253bd;
      --violet-soft: #e5dcfa;
      --amber: #a85d08;
      --amber-soft: #fde6bd;
      --blue: #2369ad;
      --blue-soft: #d7eafa;
      --rose: #b23d63;
      --rose-soft: #f8d7e2;
      --white: #ffffff;
      --shadow: #dce2ec;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #10141d;
        --panel: #171d28;
        --panel-soft: #202837;
        --ink: #edf2fa;
        --muted: #aeb9ca;
        --border: #3c485c;
        --route: #93a4bd;
        --teal: #58d6c5;
        --teal-soft: #174c49;
        --violet: #c0a7ff;
        --violet-soft: #3c315d;
        --amber: #ffc36f;
        --amber-soft: #573b1f;
        --blue: #83c5ff;
        --blue-soft: #244967;
        --rose: #ff94b4;
        --rose-soft: #623044;
        --white: #10141d;
        --shadow: #0b0e14;
      }
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .figure {
      box-sizing: border-box;
      width: 100%;
      background: var(--page);
    }

    .heading {
      box-sizing: border-box;
      padding: 12px 20px 8px;
      font-size: 20px;
      font-weight: 700;
      color: var(--ink);
    }

    svg {
      display: block;
      box-sizing: border-box;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--page);
    }

    .canvas {
      fill: var(--page);
      stroke: var(--border);
      stroke-width: 2px;
    }

    .route {
      fill: none;
      stroke: var(--route);
      stroke-width: 3px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .arrow-head {
      fill: var(--route);
    }

    .map {
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .rear {
      stroke: var(--border);
      fill: var(--shadow);
    }

    .tone-teal.front {
      fill: var(--teal-soft);
      stroke: var(--teal);
    }

    .tone-violet.front {
      fill: var(--violet-soft);
      stroke: var(--violet);
    }

    .tone-amber.front {
      fill: var(--amber-soft);
      stroke: var(--amber);
    }

    .tone-blue.front {
      fill: var(--blue-soft);
      stroke: var(--blue);
    }

    .tone-rose.front {
      fill: var(--rose-soft);
      stroke: var(--rose);
    }

    .stage-title {
      fill: var(--ink);
      font-size: 15px;
      font-weight: 700;
    }

    .resolution {
      fill: var(--ink);
      font-size: 15px;
      font-weight: 750;
    }

    .shape {
      fill: var(--ink);
      font-size: 15px;
      font-weight: 650;
    }

    .arrow-label {
      fill: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .label-back {
      fill: var(--page);
    }

    .summary {
      fill: var(--panel);
      stroke: var(--border);
      stroke-width: 2px;
    }

    .summary-divider {
      stroke: var(--border);
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
    }

    .summary-key {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .summary-value {
      fill: var(--ink);
      font-size: 16px;
      font-weight: 650;
    }

    .batch-note {
      fill: var(--teal);
      font-size: 14px;
      font-weight: 700;
    }

    .fallback {
      box-sizing: border-box;
      margin: 0;
      padding: 24px;
      min-height: 180px;
      background: var(--panel);
      border: 2px solid var(--border);
      color: var(--ink);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main class="figure">
    <div class="heading">Как меняются формы внутри TinyKeypointNet</div>

    <svg id="diagram"
         width="1200"
         height="410"
         viewBox="0 0 1200 410"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="diagram-description">
      <desc id="diagram-description">
        Маршрут тензора от N цветных изображений 64 на 64 через карты
        32 на 32 и 16 на 16 к четырём тепловым картам 64 на 64.
      </desc>
    </svg>

    <p id="fallback" class="fallback" hidden>
      Схема должна была показать маршрут от (N, 3, 64, 64) через карты
      32×32 и 16×16 к выходу (N, 4, 64, 64): down1 и down2 используют
      stride 2, а up1 и up2 — upsample ×2.
    </p>
  </main>

  <script>
    const stages = [
      {
        id: "input", x: 100, y: 100, size: 84, titleY: 31, shapeY: 169,
        title: "Вход", shape: "(N, 3, 64, 64)", grid: "64×64",
        channels: "3", tone: "tone-teal"
      },
      {
        id: "down1", x: 300, y: 145, size: 64, titleY: 84, shapeY: 198,
        title: "down1", shape: "(N, 16, 32, 32)", grid: "32×32",
        channels: "16", tone: "tone-violet"
      },
      {
        id: "down2", x: 500, y: 190, size: 48, titleY: 139, shapeY: 230,
        title: "down2", shape: "(N, 32, 16, 16)", grid: "16×16",
        channels: "32", tone: "tone-violet"
      },
      {
        id: "mid", x: 700, y: 190, size: 48, titleY: 139, shapeY: 230,
        title: "mid", shape: "(N, 32, 16, 16)", grid: "16×16",
        channels: "32", tone: "tone-amber"
      },
      {
        id: "up1", x: 900, y: 145, size: 64, titleY: 84, shapeY: 198,
        title: "up1", shape: "(N, 16, 32, 32)", grid: "32×32",
        channels: "16", tone: "tone-blue"
      },
      {
        id: "output", x: 1100, y: 100, size: 84, titleY: 31, shapeY: 169,
        title: "Выход · тепловые карты", shape: "(N, 4, 64, 64)",
        grid: "64×64", channels: "4", tone: "tone-rose"
      }
    ];

    const links = [
      {
        from: "input", to: "down1", label: "stride 2",
        labelX: 205, labelY: 99, labelW: 82
      },
      {
        from: "down1", to: "down2", label: "stride 2",
        labelX: 405, labelY: 128, labelW: 82
      },
      {
        from: "down2", to: "mid", label: "форма та же",
        labelX: 600, labelY: 160, labelW: 112
      },
      {
        from: "mid", to: "up1", label: "upsample ×2",
        labelX: 795, labelY: 128, labelW: 112
      },
      {
        from: "up1", to: "output", label: "upsample ×2",
        labelX: 995, labelY: 99, labelW: 112
      }
    ];

    const layers = [
      { dx: 12, dy: -12, className: "rear" },
      { dx: 6, dy: -6, className: "rear" },
      { dx: 0, dy: 0, className: "front" }
    ];

    const layout = {
      canvasW: 1200, canvasH: 410, half: 2, corner: 6,
      headLength: 13, headWing: 7, labelH: 24,
      summaryX: 20, summaryY: 286, summaryW: 1160, summaryH: 104,
      dividerX1: 38, dividerX2: 1162, dividerY: 340,
      keyX: 48, valueX: 220, firstRowY: 320, secondRowY: 366,
      noteX: 1152, mapTextShift: 5
    };

    const origin = { x: 0, y: 0 };
    const scale = { x: 1, y: 1 };

    function sx(x) {
      return origin.x + x * scale.x;
    }

    function sy(y) {
      return origin.y + y * scale.y;
    }

    const svg = document.getElementById("diagram");
    const fallback = document.getElementById("fallback");

    try {
      const ns = svg.namespaceURI;
      const byId = new Map(stages.map(stage => [stage.id, stage]));

      function node(name, className) {
        const element = document.createElementNS(ns, name);
        if (className) element.setAttribute("class", className);
        return element;
      }

      function rectangle(parent, x, y, width, height, radius, className) {
        const element = node("rect", className);
        element.setAttribute("x", sx(x));
        element.setAttribute("y", sy(y));
        element.setAttribute("width", sx(width) - sx(0));
        element.setAttribute("height", sy(height) - sy(0));
        element.setAttribute("rx", sx(radius) - sx(0));
        element.setAttribute("ry", sy(radius) - sy(0));
        parent.appendChild(element);
        return element;
      }

      function line(parent, x1, y1, x2, y2, className) {
        const element = node("line", className);
        element.setAttribute("x1", sx(x1));
        element.setAttribute("y1", sy(y1));
        element.setAttribute("x2", sx(x2));
        element.setAttribute("y2", sy(y2));
        parent.appendChild(element);
        return element;
      }

      function label(parent, x, y, value, className, anchor) {
        const element = node("text", className);
        element.setAttribute("x", sx(x));
        element.setAttribute("y", sy(y));
        element.setAttribute("text-anchor", anchor);
        element.setAttribute("dominant-baseline", "middle");
        element.textContent = value;
        parent.appendChild(element);
        return element;
      }

      function arrow(parent, from, to) {
        const x1 = from.x + from.size / layout.half;
        const y1 = from.y;
        const x2 = to.x - to.size / layout.half;
        const y2 = to.y;
        const dx = x2 - x1;
        const dy = y2 - y1;
        const length = Math.hypot(dx, dy);
        const ux = dx / length;
        const uy = dy / length;
        const baseX = x2 - ux * layout.headLength;
        const baseY = y2 - uy * layout.headLength;
        const leftX = baseX - uy * layout.headWing;
        const leftY = baseY + ux * layout.headWing;
        const rightX = baseX + uy * layout.headWing;
        const rightY = baseY - ux * layout.headWing;

        line(parent, x1, y1, baseX, baseY, "route");

        const head = node("polygon", "arrow-head");
        head.setAttribute("points", [
          sx(x2) + "," + sy(y2),
          sx(leftX) + "," + sy(leftY),
          sx(rightX) + "," + sy(rightY)
        ].join(" "));
        parent.appendChild(head);
      }

      rectangle(
        svg, 0, 0, layout.canvasW, layout.canvasH,
        layout.corner, "canvas"
      );

      const routeLayer = node("g");
      svg.appendChild(routeLayer);

      links.forEach(link => {
        arrow(routeLayer, byId.get(link.from), byId.get(link.to));
      });

      const stageLayer = node("g");
      svg.appendChild(stageLayer);

      stages.forEach(stage => {
        const group = node("g");
        stageLayer.appendChild(group);

        layers.forEach(layer => {
          rectangle(
            group,
            stage.x - stage.size / layout.half + layer.dx,
            stage.y - stage.size / layout.half + layer.dy,
            stage.size,
            stage.size,
            layout.corner,
            "map " + layer.className + " " + stage.tone
          );
        });

        label(
          group, stage.x, stage.titleY, stage.title,
          "stage-title", "middle"
        );
        label(
          group,
          stage.x,
          stage.y + layout.mapTextShift,
          stage.grid,
          "resolution",
          "middle"
        );
        label(
          group, stage.x, stage.shapeY, stage.shape,
          "shape", "middle"
        );
      });

      const annotationLayer = node("g");
      svg.appendChild(annotationLayer);

      links.forEach(link => {
        rectangle(
          annotationLayer,
          link.labelX - link.labelW / layout.half,
          link.labelY - layout.labelH / layout.half,
          link.labelW,
          layout.labelH,
          layout.corner,
          "label-back"
        );
        label(
          annotationLayer,
          link.labelX,
          link.labelY,
          link.label,
          "arrow-label",
          "middle"
        );
      });

      const summaryLayer = node("g");
      svg.appendChild(summaryLayer);

      rectangle(
        summaryLayer,
        layout.summaryX,
        layout.summaryY,
        layout.summaryW,
        layout.summaryH,
        layout.corner,
        "summary"
      );

      line(
        summaryLayer,
        layout.dividerX1,
        layout.dividerY,
        layout.dividerX2,
        layout.dividerY,
        "summary-divider"
      );

      label(
        summaryLayer,
        layout.keyX,
        layout.firstRowY,
        "Размер сетки",
        "summary-key",
        "start"
      );

      label(
        summaryLayer,
        layout.valueX,
        layout.firstRowY,
        stages.map(stage => stage.grid).join("  →  "),
        "summary-value",
        "start"
      );

      label(
        summaryLayer,
        layout.keyX,
        layout.secondRowY,
        "Каналы",
        "summary-key",
        "start"
      );

      label(
        summaryLayer,
        layout.valueX,
        layout.secondRowY,
        stages.map(stage => stage.channels).join("  →  "),
        "summary-value",
        "start"
      );

      label(
        summaryLayer,
        layout.noteX,
        layout.secondRowY,
        "N — без изменений",
        "batch-note",
        "end"
      );
    } catch (error) {
      svg.hidden = true;
      fallback.hidden = false;
      fallback.textContent =
        "Схема должна была показать маршрут от (N, 3, 64, 64) через " +
        "карты 32×32 и 16×16 к выходу (N, 4, 64, 64): down1 и down2 " +
        "используют stride 2, а up1 и up2 — upsample ×2.";
    }
  </script>
</body>
</html>
