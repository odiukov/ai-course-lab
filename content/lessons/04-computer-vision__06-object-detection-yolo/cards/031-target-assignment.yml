- concept: совпадение ответственной пары у нескольких эталонных рамок создаёт конфликт записей в целевом тензоре
  question: Несколько эталонных рамок получили одну и ту же ответственную пару «клетка, anchor box». Что произойдёт в реализации, которая последовательно присваивает значения одному слоту массива target, и почему это проблема?
  explanation: У пары «клетка, anchor box» есть только один набор целевых координат, objectness и класса. Повторная запись по тем же индексам не создаёт дополнительный объект, а заменяет предыдущую цель; булева маска has_obj лишь остаётся истинной.
  kind: open
  reference: Каждое новое присваивание перезапишет прежние координаты и класс в том же слоте, поэтому в target останется только последняя из конфликтующих рамок. Один слот не способен представить несколько объектов одновременно.
  id: 031-target-assignment-2
  fingerprint: b5518549
