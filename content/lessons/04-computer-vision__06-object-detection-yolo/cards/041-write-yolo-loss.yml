- concept: item преобразует скалярный тензор в обычное число для журналирования без сохранения графа автодифференцирования
  question: Почему отдельные компоненты функции потерь часто записывают в словарь метрик через .item(), а итоговую потерю возвращают тензором?
  explanation: 'Метрики box, obj_pos, obj_neg и cls нужны для наблюдения, поэтому их можно отделить от графа через .item(). Общую потерю отделять нельзя: она используется при обратном распространении ошибки.'
  kind: open
  reference: .item() превращает скалярный тензор компонента в обычное число, удобное для логирования и не связанное с графом вычислений. Итоговая потеря должна остаться тензором с графом, чтобы по ней можно было вызвать backward() и вычислить градиенты.
