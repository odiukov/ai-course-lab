- concept: общая потеря YOLO вычисляется как взвешенная сумма потерь рамки, objectness и класса
  question: Для одного батча получены L_box = 0.8, L_obj = 0.4 и L_cls = 1.1. Веса равны λ_box = 2.5, λ_obj = 0.6 и λ_cls = 1.7. Чему равна общая потеря?
  explanation: 'Нужно сложить взвешенные компоненты: 2.5 × 0.8 + 0.6 × 0.4 + 1.7 × 1.1 = 2 + 0.24 + 1.87 = 4.11.'
  kind: numeric
  answer: 4.11
  tolerance: 0.01
