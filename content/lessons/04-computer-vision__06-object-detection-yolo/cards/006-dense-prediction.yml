- concept: плотное предсказание создаёт кандидатов во всех позициях пространственной сетки
  question: Почему выход YOLO называют плотным предсказанием?
  explanation: YOLO формирует предсказания сразу во всех клетках сетки. Поэтому большая часть выхода описывает фон, но кандидаты создаются для всего изображения без предварительного отбора областей.
  kind: choice
  options:
    - Детектор сначала выбирает несколько перспективных областей и обрабатывает только их
    - Каждая позиция пространственной сетки выдаёт локальное предсказание, включая позиции фона
    - Детектор возвращает один общий вектор признаков для всего изображения
  correct: 1
  id: 006-dense-prediction-1
  fingerprint: 92f1275e
- concept: за объект отвечает клетка, содержащая его центр, а рамка может выходить за границы клетки
  question: Центр крупного объекта попал внутрь одной клетки сетки YOLO, но сам объект занимает значительную часть изображения. Какая клетка отвечает за объект и обязана ли предсказанная рамка оставаться внутри неё?
  explanation: Сетка распределяет ответственность за объекты по положению их центров, а не разрезает изображение на независимые области. Параметры ширины и высоты позволяют рамке выходить за пределы ответственной клетки.
  kind: open
  reference: За объект отвечает клетка, в которой находится его центр. Предсказанная ею рамка не ограничена границами клетки и может охватывать объект далеко за их пределами.
  id: 006-dense-prediction-2
  fingerprint: 3e55dccd
- concept: число выходных предсказаний квадратично зависит от размера стороны сетки
  question: Число рамок и классов на клетку не меняется. Во сколько раз увеличится число скалярных значений на выходе головы, если сетку 7 × 7 заменить на 21 × 21?
  explanation: Число клеток равно квадрату размера стороны сетки. Поэтому выход увеличится в (21 / 7)² = 9 раз.
  kind: numeric
  answer: 9
  tolerance: 0.01
