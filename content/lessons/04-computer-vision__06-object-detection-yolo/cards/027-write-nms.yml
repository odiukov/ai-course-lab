- concept: NMS должна возвращать индексы уцелевших рамок в исходном массиве
  question: Почему при реализации NMS следует сортировать и фильтровать исходные индексы рамок, а не только переставлять и удалять сами координаты?
  explanation: 'У каждой рамки есть связанные с ней данные: уверенность, класс и другие признаки. Возврат исходных индексов позволяет одним и тем же результатом NMS отфильтровать все эти массивы без рассинхронизации.'
  kind: open
  reference: Индексы сохраняют связь выбранных рамок с исходным массивом, поэтому результат NMS можно использовать для согласованной фильтрации координат, оценок уверенности и классов.
  id: 027-write-nms-1
  fingerprint: e1658105
- concept: выбор одной рамки с сохранением оси батча обеспечивает корректный вызов попарного box_iou
  question: Функция box_iou принимает два двумерных массива рамок. Заполните пропуск так, чтобы выбранная рамка не превратилась в одномерный вектор.
  explanation: Одинарные квадратные скобки убрали бы ось рамок. Индексация boxes[[i]] сохраняет двумерную форму с одной строкой, поэтому box_iou может попарно сравнить выбранную рамку со всеми оставшимися.
  kind: cloze
  template: ious = box_iou(___, boxes[rest]).ravel()
  answer: boxes[[i]]
  accept:
    - boxes[i][None, :]
    - boxes[i][np.newaxis, :]
  id: 027-write-nms-2
  fingerprint: c787a119
