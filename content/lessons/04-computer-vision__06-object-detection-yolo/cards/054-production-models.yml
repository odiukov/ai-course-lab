- concept: детектор возвращает отдельный результат для каждого изображения батча
  question: Почему результат готового детектора для батча обычно представлен списком структур, а не единым прямоугольным тензором находок?
  explanation: После пороговой фильтрации и NMS число найденных объектов зависит от изображения. Список позволяет каждому изображению иметь собственные массивы boxes, scores и labels нужной длины.
  kind: choice
  options:
    - На разных изображениях может остаться разное количество находок
    - Каждое изображение обязательно обрабатывается отдельной моделью
    - Координаты рамок нельзя хранить в тензорах
    - Метки классов имеют разный тип данных для разных изображений
