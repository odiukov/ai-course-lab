- concept: числовая метка детектора интерпретируется через таблицу классов конкретных весов модели
  question: Почему по одному числовому значению из labels нельзя надёжно назвать предсказанный объект?
  explanation: Поле labels хранит идентификаторы, а не названия. Для преобразования идентификатора в понятное имя нужна таблица категорий, соответствующая выбранным предобученным весам.
  kind: open
  reference: Число является идентификатором класса, а его смысл задаётся таблицей категорий, использованной при обучении конкретной модели. У других весов или датасетов тот же идентификатор может соответствовать другому классу.
