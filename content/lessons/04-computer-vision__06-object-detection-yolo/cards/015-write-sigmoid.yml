- concept: вычисление sigmoid через экспоненту
  question: Чему равна стандартная sigmoid для аргумента x = ln(8)?
  explanation: Экспонента от минус аргумента равна 1/8, поэтому sigmoid принимает значение 8/9, то есть примерно 0.8889.
  kind: numeric
  answer: 0.8889
  tolerance: 0.0005
  id: 015-write-sigmoid-1
  fingerprint: 77b0e5ac
- concept: поэлементное применение sigmoid с сохранением формы тензора
  question: Как должна вести себя реализация sigmoid, если на вход передан тензор?
  explanation: 'Sigmoid применяется поэлементно: значение в каждой позиции зависит только от соответствующего входного элемента, а размерности тензора не меняются.'
  kind: choice
  options:
    - Сначала усреднить все элементы и вернуть один скаляр
    - Отсортировать элементы, а затем применить преобразование
    - Независимо преобразовать каждый элемент и сохранить форму тензора
  correct: 2
  id: 015-write-sigmoid-2
  fingerprint: 850ffed8
