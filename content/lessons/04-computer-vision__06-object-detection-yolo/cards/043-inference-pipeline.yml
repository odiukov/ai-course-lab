- concept: итоговая уверенность кандидата равна произведению objectness и максимальной классовой уверенности
  question: После sigmoid кандидат получил objectness 0.8, а максимальная уверенность среди классов равна 0.6. Чему равна итоговая уверенность кандидата?
  explanation: 'Итоговый score вычисляется как произведение: 0.8 × 0.6 = 0.48. Поэтому высокая оценка только одного из множителей не гарантирует прохождение порога.'
  kind: numeric
  answer: 0.48
  tolerance: 0.001
  id: 043-inference-pipeline-1
  fingerprint: f3f22958
- concept: NMS без учёта классов может подавлять перекрывающиеся рамки разных классов
  question: В постобработке NMS получает только рамки и их оценки, но не метки классов. Объясни, что может произойти с сильно перекрывающимися рамками, которым назначены разные классы.
  explanation: Если классы не передаются в NMS и кандидаты не разделяются заранее, принадлежность к разным классам не защищает рамки от взаимного подавления.
  kind: open
  reference: 'Такая NMS является классонезависимой: она сравнивает все рамки вместе, поэтому менее уверенная рамка одного класса может быть подавлена более уверенной рамкой другого класса. Для поклассовой NMS кандидатов нужно сначала разделить по классам.'
  id: 043-inference-pipeline-2
  fingerprint: 81dde0cb
