- concept: координата центра рамки декодируется из смещения внутри клетки, индекса клетки и stride
  question: В детекторе YOLO сырое смещение по горизонтали равно ln(3), индекс клетки по горизонтали равен 7, а stride — 16 пикселей. Чему равна координата центра рамки по x в пикселях?
  explanation: sigmoid(ln(3)) = 0.75. Поэтому координата центра равна (7 + 0.75) × 16 = 124 пикселя.
  kind: numeric
  answer: 124
  tolerance: 0.001
  id: 014-sigmoid-offset-1
  fingerprint: c0cec9d7
- concept: монотонность sigmoid сохраняет порядок сырых смещений центра
  question: Три кандидата относятся к одной клетке и имеют одинаковый stride. Расположи их по координате центра x — от самого левого к самому правому.
  explanation: 'Sigmoid — строго возрастающая функция: чем больше tx, тем больше смещение внутри клетки. Поэтому порядок центров совпадает с порядком сырых значений tx.'
  kind: order
  items:
    - Кандидат с tx = -7
    - Кандидат с tx = -3
    - Кандидат с tx = 6
  id: 014-sigmoid-offset-2
  fingerprint: 2d3a244a
