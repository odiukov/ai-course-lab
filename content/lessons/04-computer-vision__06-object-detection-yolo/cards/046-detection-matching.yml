- concept: одно эталонное изображение объекта может быть сопоставлено только с одним предсказанием
  question: Два предсказания правильного класса имеют достаточный IoU с одной и той же эталонной рамкой. Предсказание с более высоким score уже сопоставлено с объектом. Как классифицировать второе предсказание?
  explanation: 'При оценке действует взаимно-однозначное сопоставление: один реальный объект может дать только один TP. Поэтому рамка с IoU 0,61 становится FP, когда рамка с IoU 0,76 уже сопоставлена с той же собакой.'
  kind: choice
  options:
    - Как TP, потому что его IoU достаточен
    - Как FP, потому что объект уже сопоставлен
    - Как FN, потому что предсказание оказалось дублем
    - Не учитывать при вычислении метрик
  correct: 1
  id: 046-detection-matching-1
  fingerprint: a2cc3cca
- concept: повышение порога IoU делает критерий локализации строже и может одновременно превратить TP в FP, а найденный объект — в FN
  question: Объясни своими словами, как могут измениться количества TP, FP и FN, если повысить порог IoU, не меняя предсказания детектора.
  explanation: Порог IoU меняет только строгость оценки, а не положение рамок. Например, при пороге 0,5 рамка с IoU 0,42 считается FP; снижение порога до 0,4 позволяет сопоставить её с объектом и убрать соответствующий FN.
  kind: open
  reference: Предсказания, чей IoU проходил старый порог, но не проходит новый, перестают быть TP и становятся FP. Соответствующие реальные объекты становятся FN, если у них нет другого подходящего предсказания. Поэтому TP может уменьшиться, а FP и FN — увеличиться.
  id: 046-detection-matching-2
  fingerprint: 18679cbe
