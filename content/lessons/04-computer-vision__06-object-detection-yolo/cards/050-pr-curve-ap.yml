- concept: AP равна площади под precision-recall кривой
  question: При одном и том же фиксированном критерии IoU precision-recall кривая детектора A нигде не проходит ниже кривой детектора B и на части диапазона проходит выше. Как соотносятся их AP?
  explanation: AP измеряет площадь под precision-recall кривой. Если кривая A всюду не ниже кривой B и где-то строго выше, площадь под ней больше.
  kind: choice
  options:
    - AP обязательно одинаковы
    - У детектора B AP выше
    - У детектора A AP выше
  correct: 2
  id: 050-pr-curve-ap-1
  fingerprint: def2c421
- concept: AP вычисляется отдельно для каждого класса объектов
  question: Детектор распознаёт автомобили и велосипеды. Как следует вычислять AP?
  explanation: Совпадения предсказаний с разметкой определяют внутри каждого класса, поэтому каждый класс получает собственную precision-recall кривую и собственную AP. Среднее этих значений используется в mAP.
  kind: choice
  options:
    - Объединить рамки обоих классов и игнорировать предсказанные метки
    - Вычислить AP только для класса, встречающегося чаще
    - Построить отдельную precision-recall кривую и получить отдельную AP для каждого класса
  correct: 2
  id: 050-pr-curve-ap-2
  fingerprint: 73f228e4
