- concept: CIoU учитывает перекрытие, расстояние между центрами и различие пропорций рамок
  question: Какая комбинация геометрических сигналов используется в CIoU для регрессии рамок?
  explanation: CIoU дополняет штраф за недостаточное перекрытие нормализованным расстоянием между центрами и штрафом за несовпадение пропорций. Поэтому он напрямую отражает геометрию качества рамки, в отличие от покоординатной MSE.
  kind: choice
  options:
    - Только ошибки координат противоположных углов
    - Перекрытие рамок, расстояние между их центрами и различие соотношений сторон
    - Objectness, уверенность класса и число предсказаний
    - Precision, recall и порог уверенности
  correct: 1
  id: 056-next-steps-1
  fingerprint: f95d62e9
- concept: многомасштабный инференс требует привести рамки к общей системе координат до объединения и общего NMS
  question: Расположи этапы многомасштабного инференса детектора в правильном порядке.
  explanation: Предсказания разных масштабов нельзя корректно сопоставлять, пока они выражены в разных системах координат. После возврата к координатам исходного изображения их объединяют, а общий NMS удаляет межмасштабные дубликаты.
  kind: order
  items:
    - Подготовить версии изображения в выбранных входных разрешениях
    - Получить предсказания детектора для каждого разрешения
    - Пересчитать предсказанные рамки в координаты исходного изображения
    - Объединить рамки и их оценки из всех запусков
    - Применить общий NMS к объединённым предсказаниям
  id: 056-next-steps-2
