- concept: ошибки преобразования центра и размера рамки можно различить по результату декодирования
  question: После encode и decode центр рамки восстановился правильно, но её ширина и высота исказились. Какую часть преобразования следует проверить первой?
  explanation: Центр зависит от tx, ty, sigmoid, клетки и stride, а размеры — от tw, th, exp и anchor box. Правильный центр при неверных размерах указывает на ветвь кодирования ширины и высоты.
  kind: choice
  options:
    - Пару логарифм–экспонента и используемые размеры anchor box
    - Пару логит–sigmoid для смещения центра
    - Выбор индексов клетки для координат центра
  correct: 0
  id: 020-roundtrip-check-2
  fingerprint: 4b1e4bc7
