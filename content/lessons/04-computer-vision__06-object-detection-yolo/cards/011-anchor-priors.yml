- concept: набор anchor box разных пропорций позволяет специализировать кандидатов на объектах разной формы
  question: Объясни своими словами, зачем одной клетке детектора давать несколько anchor box разных пропорций.
  explanation: Одна форма-заготовка плохо подходит одновременно для широких, высоких и компактных объектов. Набор anchor box покрывает несколько типичных геометрий, а модель уточняет наиболее подходящую.
  kind: open
  reference: Разные объекты имеют разные размеры и соотношения сторон. Несколько anchor box позволяют выбрать наиболее похожую заготовку, чтобы требуемая поправка к её положению и размеру была небольшой.
  id: 011-anchor-priors-2
