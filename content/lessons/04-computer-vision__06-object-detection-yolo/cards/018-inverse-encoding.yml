  fingerprint: e9587821
- concept: логарифм отношения ширин кодирует масштаб рамки относительно anchor box
  question: Заполни выражение для цели регрессии ширины рамки.
  explanation: Логарифм переводит мультипликативное отношение ширин в аддитивную цель. При декодировании exp отменяет логарифм, а умножение на ширину anchor box восстанавливает ширину рамки.
  kind: cloze
  template: t_w = ___
  answer: log(w / anchor_w)
  accept:
    - ln(w / anchor_w)
    - np.log(w / anchor_w)
    - log(w/anchor_w)
  id: 018-inverse-encoding-2
  fingerprint: 9b6788a2
- concept: ограничение смещения перед логитом предотвращает бесконечные цели на границах клетки
  question: Почему перед вычислением логита смещение центра ограничивают значениями, немного отстоящими от границ допустимого интервала?
  explanation: На концах интервала в выражении логита либо числитель, либо знаменатель обращается в ноль, поэтому результат уходит в бесконечность. Небольшое ограничение сохраняет конечную цель обучения и лишь минимально сдвигает граничный центр.
  kind: choice
  options:
    - Чтобы логит не породил бесконечное значение на границе
    - Чтобы ширина рамки всегда совпадала с anchor box
    - Чтобы выбрать клетку с максимальным objectness
    - Чтобы координаты углов стали целыми
  correct: 0
