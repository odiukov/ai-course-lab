- concept: FPN объединяет пространственную детализацию ранних карт с семантическими признаками глубоких карт
  question: Объясни своими словами, зачем детектору с несколькими масштабами нужна FPN, если ранние карты уже имеют высокое разрешение.
  explanation: 'Одной пространственной детализации недостаточно: ранняя карта хорошо хранит координаты, но хуже описывает смысл объекта. FPN объединяет её с более содержательными глубокими признаками, позволяя увереннее находить и классифицировать небольшие объекты.'
  kind: open
  reference: Высокое разрешение ранней карты сохраняет точное положение мелких объектов, но её признаки могут быть недостаточно семантически выразительными. FPN передаёт информацию глубоких уровней на подробные карты, благодаря чему они совмещают точную локализацию с распознаванием содержания объекта.
  id: 013-multiscale-anchors-2
