- concept: порог уверенности задаёт режим постобработки, не изменяя исходные предсказания модели
  question: Координаты рамок и их оценки уверенности уже вычислены и сохранены. Что непосредственно изменится, если применить к ним другой порог уверенности?
  explanation: Порог уверенности лишь отбирает рамки по уже вычисленным оценкам. Сырые предсказания модели остаются прежними, но новый состав выбранных рамок меняет количество верных обнаружений, ложных срабатываний и пропусков.
  kind: choice
  options:
    - Модель заново вычислит признаки изображения
    - Изменится набор прошедших фильтрацию рамок и связанные с ним числа TP, FP и FN
    - Координаты всех рамок сместятся к ближайшим объектам
    - Автоматически изменится порог IoU для сопоставления с разметкой
  correct: 1
  id: 049-threshold-tradeoff-1
  fingerprint: '199600e7'
- concept: precision-recall кривая строится перебором порогов уверенности при фиксированном критерии IoU
  question: Расположите действия для построения precision-recall кривой детектора при фиксированном правиле сопоставления рамок.
  explanation: Последовательное добавление рамок эквивалентно постепенному снижению порога уверенности. Каждое состояние набора предсказаний задаёт точку precision-recall, а площадь под полученной кривой образует AP при выбранном пороге IoU.
  kind: order
  items:
    - Отсортировать предсказанные рамки по убыванию уверенности
    - Последовательно добавлять рамки, двигаясь от самых уверенных к менее уверенным
    - После каждого добавления вычислять precision и recall
    - Нанести полученные пары метрик на график и вычислить площадь под кривой для AP
  id: 049-threshold-tradeoff-2
  fingerprint: a1418ddd
