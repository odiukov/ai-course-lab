- concept: детектор кодирует переменное число объектов фиксированным набором кандидатов
  question: Число объектов различается между изображениями, но нейросеть должна возвращать тензоры одинаковой формы. Как детекторы обычно разрешают это противоречие?
  explanation: Выход сети имеет фиксированную форму и содержит заранее подготовленные кандидаты. Оценка наличия объекта и последующая обработка оставляют только активные кандидаты, поэтому итоговое число рамок может меняться.
  kind: choice
  options:
    - Меняют размер выходного слоя отдельно для каждого изображения
    - Предсказывают фиксированный набор кандидатов, а затем отбрасывают кандидатов без объекта
    - Обучают отдельную модель для каждого возможного числа объектов
    - Дополняют исходное изображение копиями объектов до постоянного количества
  correct: 1
  id: 002-variable-output-1
  fingerprint: 98a33f2e
- concept: функция потерь детектора должна быть инвариантна к порядку объектов
  question: Объясни своими словами, почему нельзя вычислять ошибку детектора, просто сравнивая первую целевую рамку с первым предсказанием, вторую — со вторым и так далее.
  explanation: У объектов нет обязательного порядка. Поэлементное сравнение списков может наказать модель за правильные рамки, записанные в другой последовательности, поэтому требуется сопоставление целей и предсказаний.
  kind: open
  reference: 'Объекты образуют неупорядоченное множество: перестановка рамок не меняет правильный ответ. Поэтому перед вычислением ошибки цели нужно сопоставить с подходящими предсказаниями либо использовать другой порядок-инвариантный механизм.'
  id: 002-variable-output-2
  fingerprint: 45d9fb77
