- concept: anchor box назначается эталонной рамке по максимальному IoU после совмещения центров
  question: Эталонная рамка имеет размер 96×72 пикселя. Центры рамки и anchor box мысленно совмещены. Какой anchor будет назначен эталону?
  explanation: Для 84×63 IoU равен 5292 / 6912 ≈ 0,766. Два других anchor дают IoU около 0,667. Поэтому выбирается 84×63 как вариант с максимальным IoU формы.
  kind: choice
  options:
    - 84×63
    - 96×108
    - 144×72
  correct: 0
  id: 029-anchor-matching-1
  fingerprint: 4b20b332
- concept: совпадение соотношения сторон не гарантирует высокий IoU формы из-за различия абсолютных размеров
  question: Два anchor box имеют то же соотношение сторон, что и эталонная рамка, но один из них намного меньше эталона. Объясни, почему одинаковых пропорций недостаточно для выбора anchor.
  explanation: Совпадение пропорций не устраняет различие масштаба. IoU учитывает площадь пересечения и объединения, поэтому предпочитает anchor, близкий к эталону одновременно по ширине и высоте.
  kind: open
  reference: IoU формы зависит и от пропорций, и от абсолютных ширины и высоты. После совмещения центров слишком маленький anchor пересекается лишь с небольшой частью эталонной рамки, поэтому его IoU будет низким. Следует выбрать anchor с максимальным IoU, а не просто с похожим соотношением сторон.
  id: 029-anchor-matching-2
  fingerprint: e87e3b0d
