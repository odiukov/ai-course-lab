- concept: при высоком precision и низком recall увеличение веса objectness служит целевым обучающим экспериментом
  question: У детектора высокий precision и низкий recall. Команда хочет изменить именно обучение, а не порог уверенности при постобработке. Какой эксперимент наиболее адресный?
  explanation: Высокий precision при низком recall означает, что детектор выдаёт преимущественно верные рамки, но пропускает много объектов. При настройке обучения стоит проверить увеличение веса objectness, чтобы усилить сигнал о наличии объекта.
  kind: choice
  options:
    - Увеличить вес потери objectness
    - Увеличить вес потери регрессии рамок
    - Увеличить порог уверенности
    - Уменьшить число классов
  correct: 0
  id: 052-metric-diagnosis-1
  fingerprint: 99d8a8be
- concept: большой разрыв между мягким и строгим mAP направляет настройку на регрессию рамок, а не на порог уверенности
  question: У детектора precision и recall сбалансированы. Мягкий mAP высок, а строгий COCO mAP заметно ниже. Какую часть детектора следует настраивать следующей и почему?
  explanation: Большой разрыв между мягким и строгим mAP показывает, что рамки проходят снисходительную проверку перекрытия, но не выдерживают более строгую. Поэтому следующий эксперимент должен улучшать локализацию рамок.
  kind: open
  reference: 'Следует настраивать регрессию рамок: изменить функцию потерь локализации или её вес. Детектор находит нужные объекты, но границы рамок недостаточно точно совпадают с разметкой; изменение порога уверенности геометрию рамок не исправит.'
  id: 052-metric-diagnosis-2
  fingerprint: dff28d9c
