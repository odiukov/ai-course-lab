- concept: границы пересечения двух рамок определяются максимумами левых и верхних координат и минимумами правых и нижних координат
  question: Даны рамки A=(12, 18, 46, 64) и B=(27, 35, 58, 73) в формате (x1, y1, x2, y2). Чему равна площадь их пересечения?
  explanation: Пересечение ограничено координатами (27, 35, 46, 64). Его ширина равна 19, высота — 29, поэтому площадь равна 19 · 29 = 551.
  kind: numeric
  answer: 551
  tolerance: 0.001
  id: 022-iou-edge-cases-1
  fingerprint: d62639ce
- concept: площадь объединения двух рамок вычисляется по принципу включения-исключения
  question: Какая формула правильно вычисляет площадь области, покрытой хотя бы одной из двух рамок A и B?
  explanation: При сложении площадей рамок их пересечение учитывается дважды. Чтобы оставить его в объединении один раз, площадь пересечения нужно вычесть.
  kind: choice
  options:
    - S_A + S_B
    - S_A + S_B - S_inter
    - S_A + S_B + S_inter
  correct: 1
  id: 022-iou-edge-cases-2
  fingerprint: fad77bd4
- concept: отрицательный размер пересечения заменяется нулём для непересекающихся рамок
  question: При вычислении пересечения оказалось, что правая граница предполагаемого пересечения левее его левой границы. Как следует обработать ширину пересечения?
  explanation: Такое расположение границ означает, что рамки по горизонтали не пересекаются. Обрезка отрицательной ширины до нуля даёт нулевую площадь пересечения и не создаёт ложный положительный IoU.
  kind: choice
  options:
    - Оставить ширину отрицательной
    - Заменить ширину нулём
    - Взять модуль ширины
  correct: 1
  id: 022-iou-edge-cases-3
  fingerprint: bc22de51
