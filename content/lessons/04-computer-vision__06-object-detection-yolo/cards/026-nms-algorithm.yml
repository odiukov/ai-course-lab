- concept: подавление в NMS определяется перекрытием с сохранёнными лидерами, а не транзитивной принадлежностью к группе
  question: Есть рамки A, B и C с оценками уверенности 0.87, 0.74 и 0.62. Порог NMS равен 0.60. IoU(A, B) = 0.72, IoU(B, C) = 0.68, а IoU(A, C) = 0.33. Какие рамки сохранит NMS?
  explanation: 'Сначала сохраняется A и подавляется B из-за большого IoU с A. Рамка C с A перекрывается слабо, поэтому остаётся. Большой IoU между уже подавленной B и C не удаляет C: подавление не распространяется транзитивно.'
  kind: choice
  options:
    - Только A
    - A и C
    - A и B
    - Все три рамки
