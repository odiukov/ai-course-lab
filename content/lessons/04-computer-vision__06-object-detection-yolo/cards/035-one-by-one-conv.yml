- concept: точечная свёртка выполняет общее для всех позиций линейное смешивание каналов без смешивания соседних позиций
  question: Как точечная свёртка преобразует карту признаков?
  explanation: Ядро точечной свёртки охватывает только текущую пространственную позицию, но видит все её входные каналы. Поэтому меняется набор каналов, а высота и ширина карты сохраняются.
  kind: choice
  options:
    - Отдельно масштабирует каждый канал, не объединяя информацию из разных каналов
    - Объединяет все пространственные позиции карты в один вектор
    - В каждой пространственной позиции смешивает входные каналы одной и той же обучаемой матрицей, не затрагивая соседние позиции
    - Усредняет признаки соседних позиций независимо для каждого канала
  correct: 2
  id: 035-one-by-one-conv-1
  fingerprint: b8c3c5b7
- concept: минимальной YOLO-голове достаточно проецировать признаки в параметры предсказаний, если пространственный контекст уже закодирован backbone
  question: Почему точечной свёртки может быть достаточно для минимальной YOLO-головы, даже если объект занимает большую область изображения?
  explanation: Размер ядра головы не определяет сам по себе, какую область изображения учитывает предсказание. Контекст поступает из рецептивного поля backbone, а точечная свёртка служит обучаемой проекцией признаков в выходы детектора.
  kind: open
  reference: Backbone уже собрал локальный и пространственный контекст в признаках каждой позиции. Голове остаётся преобразовать этот готовый вектор признаков в параметры рамок, objectness и классов, поэтому дополнительное смешивание соседних позиций не обязательно.
  id: 035-one-by-one-conv-2
  fingerprint: 2333164a
