- concept: клетка и anchor box выбираются по разным геометрическим признакам объекта
  question: |-
    На схеме центры двух истинных рамок совпадают и лежат в клетке K:

    A: узкая высокая рамка
    B: широкая низкая рамка
              × — общий центр

    Как YOLO назначит клетку и anchor box этим объектам?
  explanation: Ответственную клетку определяет положение центра объекта. Выбор anchor box зависит от ширины, высоты и пропорций рамки, поэтому объекты с одинаковым центром могут использовать разные заготовки.
  kind: choice
  options:
    - Обе рамки назначит клетке K, но для них могут подойти разные anchor box
    - Назначит рамки разным клеткам в зависимости от положения их краёв
    - Выберет один и тот же anchor box, потому что центры рамок совпадают
    - Сначала выберет anchor box, а уже он определит ответственную клетку
  correct: 0
  id: 012-grid-anchors-1
  fingerprint: 3668b776
- concept: каждый anchor box в клетке порождает отдельного кандидата
  question: 'В одной клетке сетки заданы B anchor box. Объясни, что выдаёт голова YOLO для этой клетки до пороговой фильтрации: одно общее предсказание или отдельные предсказания для anchor box?'
  explanation: Anchor box служат независимыми исходными формами. Поэтому каждый из них порождает собственный набор параметров рамки, objectness и классов; последующая фильтрация решает, какие кандидаты сохранить.
  kind: open
  reference: Голова выдаёт B отдельных кандидатов — по одному для каждого anchor box. У каждого кандидата есть собственные поправки рамки, objectness и оценки классов.
  id: 012-grid-anchors-2
  fingerprint: c9355e0f
