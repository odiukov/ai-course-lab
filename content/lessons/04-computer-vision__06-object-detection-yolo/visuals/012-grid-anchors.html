<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Клетка и три anchor box</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fb;
      --panel: #ffffff;
      --ink: #182033;
      --muted: #5d667a;
      --grid: #cbd2df;
      --cell: #ffe59a;
      --cell-stroke: #b67700;
      --small: #16856b;
      --small-fill: #5bd2b4;
      --medium: #356fc4;
      --medium-fill: #78aaf0;
      --large: #a64d9d;
      --large-fill: #d891d1;
      --guide: #30394c;
      --rule: #dce1ea;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #121722;
        --panel: #1a2130;
        --ink: #edf1f8;
        --muted: #aeb8ca;
        --grid: #3d475a;
        --cell: #6d5318;
        --cell-stroke: #ffc857;
        --small: #61e2c2;
        --small-fill: #256e60;
        --medium: #83b8ff;
        --medium-fill: #315e99;
        --large: #efa3e5;
        --large-fill: #82477c;
        --guide: #d7deeb;
        --rule: #374155;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .figure {
      width: 100%;
      padding: 14px 16px 12px;
      background: var(--panel);
    }

    .figure-title {
      margin: 0 0 8px;
      font-size: 19px;
      font-weight: 720;
      letter-spacing: -0.01em;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 470px;
      overflow: visible;
    }

    .frame {
      fill: var(--panel);
      stroke: var(--rule);
      stroke-width: 1.5px;
    }

    .grid-line {
      stroke: var(--grid);
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
    }

    .image-border {
      fill: none;
      stroke: var(--guide);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .selected-cell {
      fill: var(--cell);
      fill-opacity: 0.72;
      stroke: var(--cell-stroke);
      stroke-width: 2.5px;
      vector-effect: non-scaling-stroke;
    }

    .anchor {
      stroke-width: 3px;
      vector-effect: non-scaling-stroke;
    }

    .anchor-large {
      fill: var(--large-fill);
      fill-opacity: 0.13;
      stroke: var(--large);
    }

    .anchor-medium {
      fill: var(--medium-fill);
      fill-opacity: 0.16;
      stroke: var(--medium);
    }

    .anchor-small {
      fill: var(--small-fill);
      fill-opacity: 0.2;
      stroke: var(--small);
    }

    .center-halo {
      fill: var(--panel);
      stroke: var(--guide);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .center-dot {
      fill: var(--cell-stroke);
      stroke: var(--panel);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .leader {
      fill: none;
      stroke: var(--guide);
      stroke-width: 1.5px;
      vector-effect: non-scaling-stroke;
    }

    .leader-end {
      fill: var(--guide);
    }

    .swatch-small {
      stroke: var(--small);
    }

    .swatch-medium {
      stroke: var(--medium);
    }

    .swatch-large {
      stroke: var(--large);
    }

    .swatch {
      stroke-width: 5px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .heading {
      fill: var(--ink);
      font-size: 18px;
      font-weight: 720;
    }

    .label {
      fill: var(--ink);
      font-size: 16px;
      font-weight: 650;
    }

    .note {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }

    .size-small {
      fill: var(--small);
    }

    .size-medium {
      fill: var(--medium);
    }

    .size-large {
      fill: var(--large);
    }

    .divider {
      stroke: var(--rule);
      stroke-width: 1.5px;
      vector-effect: non-scaling-stroke;
    }

    .fallback {
      margin: 0;
      padding: 16px;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--rule);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main class="figure" aria-labelledby="figure-title">
    <h2 class="figure-title" id="figure-title">
      Клетка задаёт адрес, anchor box задаёт начальную форму
    </h2>

    <svg
      id="diagram"
      viewBox="0 0 920 455"
      width="920"
      height="455"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-desc"
    >
      <title id="svg-title">Сетка 13×13 и три anchor box</title>
      <desc id="svg-desc">
        В одной клетке сетки отмечен центр объекта. Вокруг одного центра
        расположены anchor box размером 30×60, 75×170 и 200×380.
      </desc>
      <g id="drawing"></g>
    </svg>

    <p class="fallback" id="fallback" hidden>
      Здесь должна быть сетка 13×13 с центром объекта в одной клетке и тремя
      рамками вокруг него: 30×60, 75×170 и 200×380.
    </p>
  </main>

  <script>
    const DATA = Object.freeze({
      canvas: { width: 920, height: 455 },
      origin: { x: 18, y: 12 },
      scale: { x: 0.95, y: 0.95 },
      image: { x: 0, y: 0, width: 416, height: 416, cells: 13 },
      cell: { x: 224, y: 192, width: 32, height: 32 },
      center: { x: 240, y: 208, halo: 8, dot: 4 },
      anchors: [
        {
          width: 200,
          height: 380,
          className: "anchor anchor-large",
          sizeClass: "label size-large",
          swatchClass: "swatch swatch-large",
          label: "200×380",
          note: "большой объект"
        },
        {
          width: 75,
          height: 170,
          className: "anchor anchor-medium",
          sizeClass: "label size-medium",
          swatchClass: "swatch swatch-medium",
          label: "75×170",
          note: "высокий объект"
        },
        {
          width: 30,
          height: 60,
          className: "anchor anchor-small",
          sizeClass: "label size-small",
          swatchClass: "swatch swatch-small",
          label: "30×60",
          note: "небольшой узкий объект"
        }
      ],
      panel: {
        x: 450,
        headingY: 30,
        gridLabelY: 70,
        gridNoteY: 94,
        dividerY: 116,
        anchorHeadingY: 146,
        swatchX1: 452,
        swatchX2: 487,
        textX: 510,
        rows: [
          { y: 190, noteY: 212 },
          { y: 252, noteY: 274 },
          { y: 314, noteY: 336 }
        ],
        secondDividerY: 358,
        ruleX2: 908,
        conclusionY1: 390,
        conclusionY2: 420
      },
      leader: {
        startX: 435,
        startY: 70,
        bendX: 390,
        bendY: 70,
        endX: 256,
        endY: 192,
        endpointRadius: 3,
        centerStartX: 435,
        centerStartY: 389,
        centerBendX: 402,
        centerBendY: 389,
        centerEndX: 240,
        centerEndY: 208
      },
      caption: { x: 0, y: 442 },
      math: { start: 0, step: 1, half: 2 }
    });

    const origin = Object.freeze({
      x: DATA.origin.x,
      y: DATA.origin.y
    });

    const scale = Object.freeze({
      x: DATA.scale.x,
      y: DATA.scale.y
    });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const NS = "http://www.w3.org/2000/svg";
      const drawing = document.getElementById("drawing");
      const diagram = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");

      const make = (name, attributes, content) => {
        const node = document.createElementNS(NS, name);
        Object.entries(attributes).forEach(([key, value]) => {
          node.setAttribute(key, String(value));
        });
        if (content !== undefined) {
          node.textContent = content;
        }
        return node;
      };

      const add = node => {
        drawing.appendChild(node);
        return node;
      };

      const rect = (x, y, width, height, className) =>
        make("rect", {
          x: sx(x),
          y: sy(y),
          width: sx(x + width) - sx(x),
          height: sy(y + height) - sy(y),
          class: className
        });

      const line = (x1, y1, x2, y2, className) =>
        make("line", {
          x1: sx(x1),
          y1: sy(y1),
          x2: sx(x2),
          y2: sy(y2),
          class: className
        });

      const circle = (x, y, radius, className) =>
        make("circle", {
          cx: sx(x),
          cy: sy(y),
          r: sx(radius) - sx(DATA.math.start),
          class: className
        });

      const text = (x, y, content, className, anchor) =>
        make("text", {
          x: sx(x),
          y: sy(y),
          class: className,
          "text-anchor": anchor
        }, content);

      const path = (points, className) => {
        const commands = points.map((point, index) => {
          const command = index === DATA.math.start ? "M" : "L";
          return `${command} ${sx(point.x)} ${sy(point.y)}`;
        });
        return make("path", {
          d: commands.join(" "),
          class: className
        });
      };

      add(rect(
        DATA.image.x,
        DATA.image.y,
        DATA.image.width,
        DATA.image.height,
        "frame"
      ));

      add(rect(
        DATA.cell.x,
        DATA.cell.y,
        DATA.cell.width,
        DATA.cell.height,
        "selected-cell"
      ));

      const cellSize = DATA.image.width / DATA.image.cells;

      for (
        let index = DATA.math.start;
        index <= DATA.image.cells;
        index += DATA.math.step
      ) {
        const position = DATA.image.x + index * cellSize;

        add(line(
          position,
          DATA.image.y,
          position,
          DATA.image.y + DATA.image.height,
          "grid-line"
        ));

        add(line(
          DATA.image.x,
          position,
          DATA.image.x + DATA.image.width,
          position,
          "grid-line"
        ));
      }

      add(rect(
        DATA.image.x,
        DATA.image.y,
        DATA.image.width,
        DATA.image.height,
        "image-border"
      ));

      DATA.anchors.forEach(anchor => {
        const anchorX =
          DATA.center.x - anchor.width / DATA.math.half;
        const anchorY =
          DATA.center.y - anchor.height / DATA.math.half;

        add(rect(
          anchorX,
          anchorY,
          anchor.width,
          anchor.height,
          anchor.className
        ));
      });

      add(circle(
        DATA.center.x,
        DATA.center.y,
        DATA.center.halo,
        "center-halo"
      ));

      add(circle(
        DATA.center.x,
        DATA.center.y,
        DATA.center.dot,
        "center-dot"
      ));

      add(text(
        DATA.caption.x,
        DATA.caption.y,
        "кадр 416×416",
        "note",
        "start"
      ));

      add(text(
        DATA.panel.x,
        DATA.panel.headingY,
        "Одна клетка — один адрес",
        "heading",
        "start"
      ));

      add(text(
        DATA.panel.x,
        DATA.panel.gridLabelY,
        "Сетка 13×13",
        "label",
        "start"
      ));

      add(text(
        DATA.panel.x,
        DATA.panel.gridNoteY,
        "Отмеченная клетка отвечает за центр",
        "note",
        "start"
      ));

      add(path([
        {
          x: DATA.leader.startX,
          y: DATA.leader.startY
        },
        {
          x: DATA.leader.bendX,
          y: DATA.leader.bendY
        },
        {
          x: DATA.leader.endX,
          y: DATA.leader.endY
        }
      ], "leader"));

      add(circle(
        DATA.leader.endX,
        DATA.leader.endY,
        DATA.leader.endpointRadius,
        "leader-end"
      ));

      add(line(
        DATA.panel.x,
        DATA.panel.dividerY,
        DATA.panel.ruleX2,
        DATA.panel.dividerY,
        "divider"
      ));

      add(text(
        DATA.panel.x,
        DATA.panel.anchorHeadingY,
        "Три формы вокруг того же центра",
        "heading",
        "start"
      ));

      DATA.anchors
        .slice()
        .reverse()
        .forEach((anchor, index) => {
          const row = DATA.panel.rows[index];

          add(line(
            DATA.panel.swatchX1,
            row.y,
            DATA.panel.swatchX2,
            row.y,
            anchor.swatchClass
          ));

          add(text(
            DATA.panel.textX,
            row.y,
            anchor.label,
            anchor.sizeClass,
            "start"
          ));

          add(text(
            DATA.panel.textX,
            row.noteY,
            anchor.note,
            "note",
            "start"
          ));
        });

      add(line(
        DATA.panel.x,
        DATA.panel.secondDividerY,
        DATA.panel.ruleX2,
        DATA.panel.secondDividerY,
        "divider"
      ));

      add(path([
        {
          x: DATA.leader.centerStartX,
          y: DATA.leader.centerStartY
        },
        {
          x: DATA.leader.centerBendX,
          y: DATA.leader.centerBendY
        },
        {
          x: DATA.leader.centerEndX,
          y: DATA.leader.centerEndY
        }
      ], "leader"));

      add(text(
        DATA.panel.x,
        DATA.panel.conclusionY1,
        "Клетка выбирается по центру объекта",
        "label",
        "start"
      ));

      add(text(
        DATA.panel.x,
        DATA.panel.conclusionY2,
        "Anchor — по размеру и пропорциям",
        "label",
        "start"
      ));

      fallback.hidden = true;
      diagram.hidden = false;
    } catch (error) {
      document.getElementById("diagram").hidden = true;
      document.getElementById("fallback").hidden = false;
    }
  </script>
</body>
</html>
