- concept: если признаки задачи расходятся — длинный горизонт при непредсказуемой среде — берут плановую архитектуру с перепланированием, а не чистый реактивный цикл и не статичный план
  question: 'Траектория задачи оценивается примерно в 60 шагов, но заранее перечислить инструменты нельзя: половина из них выясняется по ходу работы в живой среде. Какая архитектура подходит?'
  explanation: 'На 60 шагах реактивный цикл тонет в накопленном контексте, поэтому цель надо держать снаружи планом. Но среда непредсказуема, значит план, зафиксированный один раз, устареет. Остаётся промежуточный вариант: план есть, но планировщик вызывается повторно по событию. Поиск по дереву решает другую задачу — перебор альтернатив, а не удержание длинного горизонта.'
  kind: choice
  options:
    - 'Плановая архитектура с перепланированием: план строится, но переписывается по мере поступления результатов'
