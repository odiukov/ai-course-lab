  question: Рекомендация «начинайте с самого простого» часто читается как «всегда берите реактивный цикл». Объясни своими словами, почему это неверное прочтение.
  explanation: '«Самое простое» — стартовая точка, а не потолок. Двухвопросный тест как раз отсекает обе крайности: он не даёт переусложнить короткую задачу и не даёт недооценить длинную.'
