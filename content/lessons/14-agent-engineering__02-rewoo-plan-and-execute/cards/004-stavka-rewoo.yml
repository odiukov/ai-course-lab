- concept: 'в ReWOO фазы строго разделены: планирование целиком завершается до первого обращения к инструменту, сборка ответа — после всех свидетельств'
  question: Расставьте фазы работы агента ReWOO в том порядке, в каком они выполняются.
  explanation: 'Границы между фазами жёсткие: планировщик заканчивает работу раньше, чем инструмент отработал хоть раз, а сборщик включается, когда свидетельства уже собраны. Ровно эта жёсткость и даёт выигрыш — планировщик никогда не видит наблюдений, а сборщик никогда не видит промежуточных рассуждений.'
