- concept: финальный вызов модели в ReWOO работает с планом и свидетельствами, а не с историей рассуждений агента
  question: Что подаётся на вход последнему обращению к модели в ReWOO и почему ему не нужна история рассуждений, которая накопилась бы у перемешанного цикла?
  explanation: 'Разделение и держится на этом: план заменяет собой протокол размышлений. Из-за этого вход финального вызова растёт только на размер собранных свидетельств, а не на размер всей переписки, и деградация при сбое инструмента оказывается локальной — испорчен один пункт, а не вся цепочка.'
  kind: open
  reference: 'На вход идут три вещи: исходная формулировка задачи, план целиком и строки-свидетельства, которые вернули инструменты по узлам плана. История рассуждений не нужна, потому что вся декомпозиция задачи уже зафиксирована в плане — плана достаточно, чтобы понять, какое свидетельство к какому подвопросу относится. Промежуточные мысли были бы пересказом того, что и так записано в плане. Побочный эффект: ошибка инструмента приходит сюда просто как ещё одна строка рядом со своим узлом, поэтому видно, какой именно пункт сломался.'
