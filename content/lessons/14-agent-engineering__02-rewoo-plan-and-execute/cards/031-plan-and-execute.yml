- concept: Plan-and-Execute с replanner возвращает наблюдения в планирование, как ReAct, но отличается частотой обращения к планировщику
  question: Агент строит план заранее, исполняет шаги, а при отклонении от ожидаемого запускает перепланирование по уже полученным результатам. Чем такая схема принципиально отличается от ReAct, где наблюдения тоже попадают в рассуждение?
  explanation: 'Формально это шаг назад к ReAct: петля обратной связи есть в обеих схемах. Разница количественная — ReAct переспрашивает планирование на каждом шаге, схема с replanner только когда что-то пошло не так. Экономия токенов держится именно на редкости этих вызовов, а не на их отсутствии.'
  kind: choice
  options:
    - Тем, что наблюдения вообще не доходят до планирующей модели
    - Тем, что планирующая модель вызывается по событию отклонения, а не после каждого шага
    - Тем, что инструменты вызываются параллельно, а в ReAct последовательно
    - Тем, что итоговый ответ собирает отдельная роль синтеза
  correct: 1
  id: 031-plan-and-execute-1
  fingerprint: e3930105
- concept: число вызовов планирующей модели при событийном перепланировании равно константе плюс число срабатываний, а не числу шагов
  question: Траектория из 30 шагов. Агент с событийным перепланированием строит план на старте и вызывает replanner 5 раз за прогон. Агент в стиле ReAct обращается к планирующей модели на каждом шаге. Во сколько раз меньше вызовов планирования у первого агента?
  explanation: 'У первого: стартовый план плюс 5 перепланирований = 6 вызовов. У ReAct: 30. Отношение 30/6 = 5. Выигрыш растёт с длиной траектории, потому что у ReAct счёт вызовов линеен по шагам, а тут почти константа — плюс каждый вызов ReAct тащит всю разросшуюся историю.'
  kind: numeric
  answer: 5
  tolerance: 0.1
  id: 031-plan-and-execute-2
  fingerprint: f6285533
- concept: replanner переписывает остаток плана поверх уже собранных результатов, а не строит план заново с нуля
  question: Из 20 узлов плана выполнено 7, и один из них вернул пустой результат вместо ожидаемых данных. Объясни своими словами, что делает replanner и почему это дешевле полного перепланирования с нуля.
  explanation: Ключевое слово — «правит остаток». Статичный план ReWOO не умеет реагировать на содержательный сбой (пустой результат, устаревшие данные), потому что планировщик вообще не видит выходов воркеров. Replanner снимает эту хрупкость точечно, не отказываясь от предвычисленного плана.
  kind: open
  reference: 'Replanner получает исходную задачу, текущий план и уже полученные результаты и правит только невыполненный остаток: меняет проблемный шаг и то, что от него зависело. Семь выполненных узлов и их результаты сохраняются — повторно инструменты по ним не дёргаются. Дёшево это по двум причинам: не оплачивается повторный сбор уже добытых свидетельств, и промпт планирования остаётся одним, а не по одному на шаг. Полный перезапуск обесценил бы всю проделанную работу и вернул бы стоимость к уровню агента без плана.'
  id: 031-plan-and-execute-3
  fingerprint: d1055e90
