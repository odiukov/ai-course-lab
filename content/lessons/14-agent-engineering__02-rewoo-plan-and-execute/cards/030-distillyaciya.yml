- concept: 'порядок дистилляции планировщика: учитель генерирует планы офлайн, ученик обучается на них, на инференсе учителя нет'
  question: Расставь шаги дистилляции планировщика по порядку.
  explanation: Большая модель нужна только на этапе сбора обучающих данных. После дообучения на инференсе остаётся малый планировщик плюс инструменты, и цена самой частой роли падает пропорционально разнице в числе параметров — у авторов это 175B против 7B.
  kind: order
  items:
    - Прогнать большую модель-учителя в роли планировщика на наборе вопросов с описанием доступных инструментов
    - Собрать корпус пар «вопрос + каталог инструментов → план из узлов со ссылками на свидетельства»
    - Дообучить малую модель на этом корпусе
    - На инференсе ставить планировщиком малую модель, а большую не поднимать вообще
