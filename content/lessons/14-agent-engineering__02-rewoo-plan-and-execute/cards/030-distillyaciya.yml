- concept: в архитектуре с перемешанным циклом рассуждение-наблюдение нельзя выделить дешёвую роль для дистилляции
  question: Объясни своими словами, почему тот же приём — вынести планирование в маленькую дообученную модель — не применяется к агенту, который чередует мысль и вызов инструмента в одном растущем контексте.
  explanation: Дистилляция здесь возможна не потому, что планирование «простое вообще», а потому, что архитектура вырезала из него чтение наблюдений. Где ролей нет, там и разрезать нечего.
  kind: open
  reference: 'Там планирование и интерпретация наблюдений живут в одной голове и в одном промпте: каждая следующая мысль строится поверх всех предыдущих наблюдений. Отделять нечего — нет момента, где модель работает только по описанию инструментов. Значит нет и той узкой форматной подзадачи, которую можно снять с учителя и дообучить на ней малую модель: маленькой модели пришлось бы уметь и то, и другое, включая разбор произвольных текстов из инструментов. Отказ от наблюдений в планировщике даёт не только экономию токенов, но и право поставить в самую частую роль модель поменьше.'
