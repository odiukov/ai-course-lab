- concept: проверка уникальности идентификаторов свидетельств идёт раньше остальных, потому что при дублях адресация ссылок неоднозначна и остальные проверки теряют смысл
  question: Расставь шаги статической валидации плана ReWOO в правильном порядке.
  explanation: 'Уникальность идентификаторов — предусловие всего остального: если метка #E6 стоит у двух узлов, то ссылка на #E6 адресует неизвестно что, и проверять разрешимость ссылок бессмысленно. Поэтому дубли ловятся первыми. Дальше проверки поузловые и независимые: каталог инструментов, затем разрешимость и направление ссылок.'
  kind: order
  items:
    - Собрать идентификаторы всех узлов и убедиться, что среди них нет повторов
    - Для каждого узла сверить имя инструмента со списком реально доступных инструментов
    - Для каждого узла извлечь из аргументов ссылки на свидетельства
    - Проверить, что каждая ссылка указывает на узел, объявленный раньше текущего
    - Вернуть накопленный список нарушений; пустой список означает готовность к исполнению
