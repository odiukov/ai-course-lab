- concept: 'в плане с линейно пронумерованными узлами проверка ацикличности сводится к сравнению индексов: ссылка допустима только на строго более ранний узел, равенство индексов — ссылка на себя'
  question: Валидатор проверяет, что узел ссылается только назад. Какой оператор сравнения закрывает и ссылку вперёд, и ссылку узла на самого себя?
  explanation: 'Ссылка вперёд даёт index_of[ref] > i, ссылка на себя — ровно i. Строгое `>` пропустило бы самоссылку, а это цикл длины один: узел ждёт собственного результата и не запустится никогда. Допустимо только index_of[ref] < i, поэтому нарушение — `>=`. При линейной нумерации узлов эта одна проверка заменяет полноценный поиск циклов в графе.'
