- concept: рёбра графа зависимостей не объявляются отдельным полем — они вычитываются из наличия ссылок внутри аргументов узлов
  question: В плане ReWOO нет отдельного поля «depends_on». Откуда исполнитель узнаёт, какие рёбра есть в DAG?
  explanation: 'Ссылка внутри аргумента одновременно и заглушка под значение, и объявление зависимости — граф восстанавливается разбором текста аргументов. Порядок строк рёбер не задаёт: узел без ссылок независим и может стартовать сразу, даже если стоит в плане последним.'
  kind: choice
  options:
    - 'Сканирует строки аргументов: каждая найденная в аргументе ссылка на чужой идентификатор и есть ребро'
    - 'Из порядка строк в плане: каждый узел зависит от непосредственно предыдущего'
    - 'Из имён инструментов: узлы с одинаковым инструментом считаются связанными'
    - Спрашивает у Planner отдельным вызовом модели перед запуском
