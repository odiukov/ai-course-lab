- concept: суммарный расход входных токенов у агента с накапливающимся контекстом равен сумме арифметической прогрессии, а не произведению шагов на размер одного шага
  question: 'Агент работает в перемешанном цикле thought-action-observation: каждый вызов LLM переотправляет всю предыдущую историю. Первый вызов стоит 400 входных токенов, и каждый следующий шаг добавляет к промпту ещё 400 токенов. Сколько входных токенов будет израсходовано суммарно за 8 шагов?'
  explanation: Вызовы стоят 400, 800, ..., 3200. Сумма = 400 * (8*9/2) = 400 * 36 = 14400. Наивная оценка «8 шагов по 400 = 3200» занижает счёт в 4.5 раза, потому что платится не за последний промпт, а за каждый из восьми.
  kind: numeric
  answer: 14400
  tolerance: 100
  id: 002-kvadrat-rost-1
  fingerprint: 87cd4651
- concept: квадратичная зависимость означает, что множитель глубины входит в счёт в квадрате
  question: Агент с накапливающимся контекстом (каждый вызов LLM тащит всю историю) укладывался в задачу за 7 шагов. Задачи усложнились, и типичная траектория выросла до 28 шагов. Во сколько примерно раз вырастет суммарный расход входных токенов на задачу?
  explanation: 'Расход идёт как n(n+1)/2, то есть примерно как n². Глубина выросла в 4 раза, значит счёт — примерно в 4² = 16 раз: 28*29/2 = 406 против 7*8/2 = 28, то есть в 14.5 раза. Именно поэтому бюджет и лимит контекста ломаются раньше, чем качество модели: упираешься в арифметику, а не в способности LLM.'
  kind: choice
  options:
    - примерно в 4 раза — пропорционально числу шагов
    - примерно в 8 раз
    - примерно в 16 раз
    - примерно в 28 раз
