- concept: ссылка на свидетельство распознаётся как маркер плюс всё следующее за ним число целиком, а не одна цифра
  question: 'Функция ищет в строке аргумента все ссылки вида #E<номер>. Номера узлов бывают многозначными. Заполни пропуск в шаблоне поиска.'
  explanation: 'Квантификатор + забирает всю цифровую последовательность. Без него шаблон возьмёт первую цифру: #E58 превратится в ссылку на узел 5, и исполнитель подставит свидетельство совсем другого узла — молча, без ошибки. Такой баг проявляется только на планах длиннее девяти узлов.'
  kind: cloze
  template: refs = re.findall(r"#E___", arg)
  answer: \d+
  accept:
    - '[0-9]+'
    - (\d+)
    - \d{1,}
    - '[0-9]{1,}'
  id: 012-find-references-1
  fingerprint: 4e84289a
- concept: проверка вхождения подстроки даёт факт наличия ссылок, но не их идентификаторы и не их количество
  question: 'Аргумент узла: "сравни #E7 с #E23". Код проверяет наличие зависимостей выражением `"#E" in arg`. Чего этой проверки принципиально не хватает для диспетчеризации узла?'
  explanation: 'Диспетчеру нужны сами идентификаторы: по ним он ждёт нужные свидетельства и делает подстановку. Булев ответ говорит только «что-то есть», а здесь зависимостей две — 7 и 23. Поэтому нужна функция, возвращающая все найденные ссылки в порядке появления.'
  kind: choice
  options:
    - Она даёт булево значение, но не список номеров узлов и не их число, а аргумент может содержать сразу несколько ссылок
    - Она возвращает False на строках без ссылок, хотя должна возвращать ошибку
    - Она чувствительна к регистру и пропустит запись строчными буквами
    - Она работает только если ссылка стоит в начале строки
  correct: 0
  id: 012-find-references-2
  fingerprint: 71512dc4
- concept: отсутствие ссылок в аргументе — штатный результат, поэтому извлечение возвращает пустой результат, а не сигнализирует об ошибке
  question: Аргумент узла не содержит ни одной ссылки на свидетельство. Почему функция извлечения ссылок должна вернуть пустой список, а не бросить исключение? Что этот пустой результат означает для исполнителя плана?
  explanation: 'Исключения — для нарушенных инвариантов, а не для штатных вариантов. Здесь пустой результат несёт полезный смысл: узел-корень, готов к запуску немедленно. Тот же признак используется для поиска стартового множества узлов при обходе графа.'
  kind: open
  reference: 'Узлы без зависимостей — нормальная и обязательная часть любого плана: с них исполнение начинается, их аргументы полностью известны на момент планирования. Если бы отсутствие ссылок считалось ошибкой, вызывающий код был бы обязан оборачивать каждый узел в обработку исключения ради самого частого случая. Пустой список — обычное значение, по которому исполнитель просто ветвится: пустой набор ссылок означает, что у узла нет входящих рёбер в графе зависимостей, ждать нечего и его можно запускать сразу, в первой волне.'
  id: 012-find-references-3
  fingerprint: ae5af476
