- concept: на длинной траектории намерение тонет в накопленных наблюдениях, поэтому цель приходится держать снаружи — явным планом, к пункту которого привязано текущее действие
  question: Веб-агент проходит траекторию примерно в 70 шагов и к концу начинает повторять уже сделанные подзадачи. Объясни своими словами, почему это происходит и почему явный план снаружи модели устраняет причину.
  explanation: 'Ключ — разделить две вещи: рост истории наблюдений и постоянный размер плана. Потеря связности не про «забыл факт», а про «не восстанавливает цель действия». В материале граница названа как 30–50 шагов: до неё ReAct держит нить сам, после — нить нужно держать снаружи.'
  kind: open
  reference: 'К поздним шагам контекст состоит в основном из накопленных наблюдений, и исходное намерение в нём не читается: агент видит текущую страницу, но не восстанавливает, ради какой подзадачи он её открыл, и запускает подзадачу заново. Явный план хранится отдельно от истории, он короткий и не растёт с длиной траектории, а каждое действие привязано к конкретному пункту плана. Поэтому намерение доступно на любом шаге независимо от того, сколько наблюдений уже накопилось: нить держится снаружи, а не памятью модели о собственных рассуждениях. Эмпирически граница, за которой одиночная ReAct-траектория перестаёт держать связность сама, лежит в районе нескольких десятков шагов — дальше нужен планировщик, дообученный на данных с явными планами.'
