- concept: вклад Plan-and-Act лежит в генерации обучающих данных для планировщика, а не в новой схеме промптинга или новом контуре управления на инференсе
  question: Где именно находится главный вклад Plan-and-Act по сравнению с уже известным разделением на планировщик и исполнитель?
  explanation: 'Само разделение «план отдельно, исполнение отдельно» к моменту Plan-and-Act уже не новость. Новость — как научить планировщик держать длинную дистанцию: данных с явными планами в природе нет, их синтезируют из размеченных траекторий и дообучают на них. Параллелизм узлов и сжатие контекста — свойства других паттернов, не вклад этой работы.'
  kind: choice
  options:
    - 'В способе получать обучающие данные: генератор превращает размеченные траектории в примеры с явным планом, на которых дообучают планировщик'
    - В новом формате промпта, который заставляет одну модель без дообучения выдавать более длинные планы
    - В параллельном запуске независимых узлов плана вместо последовательного
    - В сжатии истории наблюдений, чтобы контекст рос линейно, а не квадратично
