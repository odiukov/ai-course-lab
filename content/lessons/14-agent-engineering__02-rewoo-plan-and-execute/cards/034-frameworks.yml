- concept: во CrewAI Flows граф зависимостей задаётся декларацией задач до запуска, а не решением модели на каждом шаге
  question: Чем в CrewAI Flows задаётся структура зависимостей между шагами?
  explanation: 'Flows кодируют паттерн напрямую: объявление задач и их связей — это и есть план, а исполнение сводится к обходу DAG. Поэтому ручной `parse_plan`/`validate_plan`/`topological_order` во Flows не нужен: план не парсится из текста модели, он написан руками, и его корректность проверяется на уровне кода.'
  kind: choice
  options:
    - Задачи и их связи описываются заранее, в коде Flow, а рантайм исполняет это как DAG
    - Модель на каждом шаге сама выбирает, какая задача следующая, и граф складывается по ходу
    - Граф извлекается из логов предыдущих прогонов автоматически
    - 'Зависимостей нет: все задачи всегда идут строго по порядку объявления, по одной'
  correct: 0
  id: 034-frameworks-2
