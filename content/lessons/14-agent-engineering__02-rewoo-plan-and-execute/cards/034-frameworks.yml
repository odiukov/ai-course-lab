- concept: рантайм-паттерн переносится копированием готового рецепта фреймворка, а дообученный планировщик требует собственного обучающего конвейера, поэтому две части Plan-and-Act внедряются по-разному
  question: Plan-and-Act состоит из двух частей. Объясни своими словами, почему одну из них команда без ML-инфраструктуры может внедрить сегодня, а вторую — нет, и по какому признаку решать, что вторая вообще понадобилась.
  explanation: 'Разделение важно практически: паттерн — это код, который копируется, а планировщик — это модель, которую надо обучить. Порог «десятки шагов» не магический, он про то, где промптовый планировщик перестаёт держать длинную структуру; проверять надо на своих задачах, а не переходить к обучению заранее.'
  kind: open
  reference: 'Первая часть — рантайм-архитектура: явный план плюс исполнитель, который его отрабатывает. Это структура управления, она не требует обучения и уже лежит готовой в фреймворках (граф планировщик-исполнитель в LangGraph, DAG задач в CrewAI Flows), поэтому берётся почти бесплатно. Вторая часть — дообучение планировщика на синтетических планах: нужны GPU, генерация обучающих траекторий учителем, обучение ученика, оценка. Это не настройка конфига, а отдельный проект на недели, и пока в основном исследовательский трек. Признак, что она понадобилась: горизонт задачи разросся до десятков шагов (порядка 30+) и обычный промптовый планировщик на такой длине действительно начал ошибаться — путать порядок, терять цель, выдавать неисполнимые планы. До этого момента выигрыш от своего планировщика не покрывает стоимости конвейера.'
  id: 034-frameworks-3
  fingerprint: 302e27d6
