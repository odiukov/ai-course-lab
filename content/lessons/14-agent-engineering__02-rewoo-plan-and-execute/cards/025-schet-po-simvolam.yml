- concept: курс «символов на токен» получен на английской прозе, а кириллица, цифры и идентификаторы дробятся мельче, поэтому грубая оценка занижает расход
  question: 'Одно и то же правило «длина в символах делить на постоянный курс» применили к двум промптам одинаковой длины: английская проза и русский текст с идентификаторами и числами. Что произойдёт с оценкой?'
  explanation: Курс ~4 символа на токен выведен на английской прозе, где частые слова целиком попали в словарь. Кириллица, пунктуация, цифры и строки вроде `#E1` разбиваются на несколько мелких токенов, поэтому реальный расход выше оценки. Направление ошибки известно — этим грубое правило и остаётся пригодным.
  kind: choice
  options:
    - Обе оценки одинаково точны — длина одна, значит и токенов одинаково
    - 'На английском оценка близка к правде, на русском с идентификаторами она занижена: такой текст дробится на более мелкие куски'
    - На английском оценка занижена, на русском завышена
    - Оценка врёт только на числах, буквы алфавита на курс не влияют
