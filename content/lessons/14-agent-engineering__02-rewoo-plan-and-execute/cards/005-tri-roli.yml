- concept: воркер в ReWOO получает только имя инструмента и аргументы, без вопроса пользователя и без соседних шагов плана
  question: В ReWOO воркер исполняет один узел плана — например, вызов поискового инструмента. Что подаётся воркеру на вход?
  explanation: 'Воркер — исполнитель одного узла: ему дают инструмент и аргументы, он возвращает результат (evidence). Ни вопрос, ни цель, ни соседние узлы ему не нужны. Именно эта изоляция входов даёт экономию: ни одна из трёх ролей не таскает чужой контекст.'
  kind: choice
  options:
    - Исходный вопрос пользователя, весь план и уже собранные свидетельства
    - Только инструмент и его аргументы для этого узла
    - Вопрос пользователя и результат предыдущего узла, но не остальной план
    - Весь диалог планировщика, чтобы воркер понимал замысел
  correct: 1
  id: 005-tri-roli-1
  fingerprint: e0486dd5
- concept: узел плана не может быть исполнен, пока не вернулись все узлы, на которые ссылаются его аргументы
  question: 'План ReWOO: `#E5 = Search["кто основал студию X"]`, `#E6 = Search["год рождения #E5"]`, `#E7 = Calculator["2026 - #E6"]`. Расставь узлы в порядке исполнения.'
  explanation: 'Ссылка внутри аргументов задаёт ребро зависимости. #E6 содержит #E5, значит запускается только после возврата #E5; #E7 содержит #E6. Порядок исполнения — топологический порядок этого графа: сначала то, от чего зависят.'
  kind: order
  items:
    - '#E5 — поиск основателя студии'
    - '#E6 — поиск года рождения найденного человека'
    - '#E7 — вычитание года рождения из 2026'
  id: 005-tri-roli-2
  fingerprint: d96faaa3
- concept: выход планировщика — граф узлов, где каждый узел задаёт инструмент, аргументы и зависимости от более ранних узлов
  question: Что именно выдаёт Planner в ReWOO и какие части содержит один узел его выхода? Объясни своими словами.
  explanation: 'Ключевое: планировщик не исполняет, а описывает. Зависимости кодируются ссылками внутри аргументов, поэтому исполняющая часть может вывести порядок из самого плана, не спрашивая модель заново.'
  kind: open
  reference: 'Planner получает только вопрос пользователя и выдаёт план в виде DAG — графа без циклов. Каждый узел содержит три вещи: какой инструмент вызвать, с какими аргументами и от каких более ранних узлов он зависит (зависимость выражается ссылкой на переменную предыдущего узла прямо в аргументах). Никаких вызовов инструментов на этой стадии не происходит — только чертёж. Граф, а не линейный список: узлы без общих зависимостей не упорядочены друг относительно друга.'
  id: 005-tri-roli-3
  fingerprint: 1fa6dc41
