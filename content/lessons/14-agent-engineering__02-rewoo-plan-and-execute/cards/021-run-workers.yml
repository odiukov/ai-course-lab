- concept: исключение инструмента перехватывается и записывается в хранилище как значение свидетельства, поэтому исполнение оставшихся узлов продолжается
  question: 'Из девяти узлов плана инструмент пятого бросает исключение. Исполнитель ловит его и кладёт в хранилище строку `ERROR: timeout` под id этого узла. Что произойдёт с узлом, чей аргумент ссылается на пятый?'
  explanation: 'Перехват превращает сбой в обычное значение свидетельства: подстановка не различает удачный вывод и текст ошибки. Остальные узлы досчитываются, хранилище доходит до конца заполненным, и по нему видно, какой именно узел провалился. Цена — зависимый вызов уйдёт с мусорным аргументом, зато результаты всех независимых ветвей сохраняются.'
  kind: choice
  options:
    - 'Он будет вызван, и в его аргумент подставится строка `ERROR: timeout`'
    - Он будет пропущен исполнителем как узел с испорченной зависимостью
    - Он будет вызван, но с ссылкой в исходном виде, потому что значения у зависимости нет
    - Исполнение всего плана прервётся на пятом узле
