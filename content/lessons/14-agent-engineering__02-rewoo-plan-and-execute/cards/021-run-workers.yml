- concept: 'порядок операций внутри шага исполнения: разрешение ссылок, вызов, запись результата под id узла'
  question: Исполнитель обрабатывает очередной узел плана. Расставь операции в правильном порядке.
  explanation: 'Подстановка делается непосредственно перед вызовом, потому что раньше значений зависимостей ещё нет. Запись после вызова — иначе следующие узлы не найдут результат. Обход идёт в топологическом порядке, а не в порядке строк плана: они могут не совпадать.'
  kind: order
  items:
    - Взять аргументы узла и заменить в них ссылки на уже полученные значения из хранилища
    - Вызвать инструмент узла с получившимися аргументами
    - Записать возвращённое значение в хранилище под идентификатором этого узла
