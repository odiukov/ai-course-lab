- concept: у одного графа зависимостей может быть несколько допустимых порядков исполнения — граф задаёт ограничения, а не единственную последовательность
  question: Объясни своими словами, почему у одного и того же графа зависимостей может существовать несколько разных корректных порядков исполнения узлов, и что при этом остаётся одинаковым во всех таких порядках.
  explanation: 'Граф задаёт частичный порядок, список — полный. Разные топологические порядки одинаково валидны, различаются только тем, как разложены независимые узлы. Это и есть источник параллелизма: свобода в порядке означает возможность не ждать.'
  kind: open
  reference: 'Граф фиксирует только те ограничения, которые реально есть: узел идёт после тех, чьи результаты он использует. Между узлами, не связанными путём по стрелкам, порядок не задан — их можно поставить в любой последовательности или запустить одновременно. Поэтому корректных порядков обычно много, и каждый из них называется топологическим порядком. Общее у всех: ни один узел не оказывается раньше своего предшественника по стрелке. Именно этой свободы лишён нумерованный список — он навязывает жёсткую последовательность там, где ограничения нет.'
  id: 007-plan-dag-3
  fingerprint: 3b74f8b9
