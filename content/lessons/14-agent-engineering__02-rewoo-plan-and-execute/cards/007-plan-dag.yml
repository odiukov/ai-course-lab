- concept: время исполнения плана определяется самой длинной цепочкой зависимостей (критическим путём), а не суммой длительностей всех узлов
  question: План содержит 9 узлов поиска без стрелок между ними, каждый выполняется 7 секунд, и один финальный узел агрегации длительностью 8 секунд, который ждёт все девять. Ресурсов хватает на любое число одновременных вызовов. Сколько секунд займёт исполнение всего плана?
  explanation: 'Девять поисков стартуют разом и заканчиваются к 7-й секунде, дальше 8 секунд агрегации: 7 + 8 = 15. Сумма всех узлов (9×7 + 8 = 71) — это стоимость работы, а не время ожидания. Время плана равно длине самой длинной цепочки стрелок.'
  kind: numeric
  answer: 15
  tolerance: 0.1
