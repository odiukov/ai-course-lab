- concept: 'успешный синтаксический разбор плана не означает исполнимости: парсер проверяет форму записи, валидатор — семантику графа, и делать это надо до первого вызова API'
  question: План разобрался парсером без единой ошибки. Почему этого недостаточно, чтобы отдавать его исполнителю, и почему проверку выгодно делать именно до исполнения, а не по ходу?
  explanation: 'Разделяй два уровня: парсер валидирует запись узла, валидатор — граф целиком. В ReWOO план целиком известен до исполнения, и это главное преимущество перед перемешанным циклом: вся структура доступна для статической проверки. Три класса ошибок — цикл, висячая ссылка, отсутствующий инструмент — покрывают типовые способы, которыми модель ломает план, и все три бесплатны для обнаружения.'
  kind: open
  reference: 'Парсер отвечает только за форму: он выделяет идентификатор свидетельства, имя инструмента и аргумент, и успешный разбор означает лишь, что строки записаны по синтаксису. Исполнимость — свойство графа, а не строк: замкнутые в кольцо зависимости не дадут ни одному из узлов стартовать; ссылка на несуществующий узел не подставится и уедет в инструмент текстом; имя инструмента, которого нет в каталоге, некому вызвать. Все три свойства читаются из статического текста плана — граф зависимостей вычитывается из ссылок в аргументах, множество идентификаторов известно, каталог инструментов был на входе у планировщика. Значит, проверка стоит ноль вызовов API. Если же ловить эти ошибки по ходу, то поломка на позднем узле обнаружится, когда все предыдущие вызовы уже оплачены, а часть ошибок (висячая ссылка) не обнаружится вовсе.'
  id: 015-tri-polomki-plana-3
