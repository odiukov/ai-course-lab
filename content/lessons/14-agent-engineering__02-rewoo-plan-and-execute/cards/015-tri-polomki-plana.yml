- concept: 'имена инструментов в плане надо сверять с каталогом, переданным планировщику: модель может выдумать правдоподобный инструмент, закрывающий шаг по смыслу'
  question: Планировщику на вход подан каталог из 8 инструментов. В сгенерированном плане один узел вызывает `get_weather`. Почему такой узел вообще появляется и что должна делать валидация?
  explanation: 'Планировщик генерирует текст, а не выбирает из списка принудительно. Если шаг по смыслу требует погоды, модель напишет правдоподобное имя инструмента независимо от того, есть ли оно в каталоге. Каталог был на входе — значит, множество допустимых имён известно заранее, и проверка вхождения имени в это множество делается по статическому тексту плана. Автопочинка по ближайшему совпадению опасна: она подменит замысел плана.'
  kind: choice
  options:
    - Модель подставила инструмент из каталога с опечаткой — валидация должна исправить имя по ближайшему совпадению
    - Модель придумала инструмент, потому что он логично закрывает шаг; валидация должна сверить имя каждого узла с каталогом и отклонить план
    - Инструмент подтянется динамически при исполнении, валидация имён не нужна
    - 'Это допустимо: воркер вернёт ошибку, и Solver учтёт её при синтезе ответа'
