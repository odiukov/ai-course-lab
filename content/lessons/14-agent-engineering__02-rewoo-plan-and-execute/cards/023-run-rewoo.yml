- concept: оркестратор не содержит собственных вычислений — вся семантика вынесена в вызываемые компоненты, он отвечает только за порядок и за право не начинать
  question: Функция-оркестратор ReWOO состоит почти целиком из вызовов чужих функций и не производит собственных вычислений. Почему такая «пустая» функция — это признак хорошей архитектуры, а не недоделка? Что именно остаётся её единственной ответственностью?
  explanation: 'Это разделение ответственности: компоненты знают «как», оркестратор знает «в каком порядке» и «когда не начинать». Побочный эффект — счёт обращений к модели виден в одном месте: если внутри оркестратора появляется вызов модели между сбором свидетельств, архитектура тихо превращается в перемешанный цикл и обещанная экономия токенов исчезает.'
  kind: open
  reference: 'Разбор строк, поиск и подстановка ссылок, проверка графа, упорядочивание, вызов инструментов и синтез — каждая из этих операций имеет собственный контракт и тестируется изолированно, без сети и без модели. Если оркестратор начнёт делать что-то из этого сам, логика продублируется и станет непроверяемой в отрыве от полного прогона. За оркестратором остаётся ровно две вещи: порядок вызовов (каждый компонент получает вход, произведённый предыдущим) и решение прекратить прогон до первого платного вызова, если статическая проверка нашла нарушения. Плюс сохранение промежуточных артефактов — плана и свидетельств — для возврата наружу.'
