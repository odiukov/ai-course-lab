- concept: 'оркестратор — композиция готовых компонентов в фиксированном конвейере: получение плана, разбор, статическая проверка, упорядочивание, исполнение, синтез'
  question: Расставь стадии прогона ReWOO в том порядке, в каком их вызывает оркестратор.
  explanation: 'Каждая стадия потребляет выход предыдущей: разбирать нечего до ответа планировщика, проверять нечего до разбора, упорядочивать нечего до проверки, синтезировать нечего до свидетельств. Проверка стоит перед упорядочиванием и исполнением намеренно — она бесплатна, а исполнение оплачивается вызовами инструментов.'
  kind: order
  items:
    - Получить от планировщика текст плана по вопросу пользователя и каталогу инструментов
    - Разобрать текст в структуру узлов (идентификатор свидетельства, инструмент, аргумент)
    - 'Статически проверить план: уникальность идентификаторов, известность инструментов, отсутствие висячих ссылок и циклов'
    - Построить порядок исполнения узлов, совместимый с их зависимостями
    - Исполнить узлы, подставляя в аргументы ранее полученные свидетельства, и накопить результаты
    - Передать вопрос, план и свидетельства синтезатору ответа
