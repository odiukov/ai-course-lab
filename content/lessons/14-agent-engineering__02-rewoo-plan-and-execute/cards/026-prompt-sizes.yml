  question: Аргумент узла плана записан как ссылка на свидетельство предыдущего узла — короткий маркер из нескольких символов. Объясни, почему измерять длину воркерского промпта по этой записи из плана нельзя, и что надо измерять вместо неё.
  explanation: 'Метрика достоверна только если считает ровно тот байтовый вход, что уходит в модель. Две частые ошибки в разные стороны: считать план вместо подставленных значений (занижение) и считать красивый лог вместо payload''а (завышение).'
  kind: open
  reference: 'Модель получает не запись из плана, а строку после подстановки: маркер заменяется целым выводом предыдущего инструмента. Маркер занимает несколько символов, а подставленный текст поиска или страницы — тысячи. Измерение по плану занижает расход воркера на порядки и создаёт ложную картину «все воркеры почти пустые». Мерить нужно ту же строку, что реально уходит в API: имя инструмента плюс аргументы после разрешения всех ссылок. По той же причине нельзя мерить отформатированный отладочный вывод — рамки, отступы и подписи в модель не отправляются и в счёт не входят.'
