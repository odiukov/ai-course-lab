- concept: лишний контекст, попавший в промпт воркера, умножается на число узлов, поэтому цена утечки растёт с длиной плана
  question: План состоит из 8 узлов. Корректный промпт воркера содержит только имя инструмента и аргументы — 60 символов. По ошибке в каждый воркерский промпт добавляется текст всего плана — 900 символов. Во сколько раз вырастет суммарная длина воркерских промптов?
  explanation: 'Корректно: 8 × 60 = 480 символов. С утечкой: 8 × (900 + 60) = 7680. Отношение 7680 / 480 = 16. Постоянная добавка входит в счёт не один раз, а по разу на узел, поэтому чем длиннее план, тем больше множитель — и заявленная экономия по токенам исчезает первой.'
