- concept: 'цикл диспетчеризации по счётчику незакрытых зависимостей: счётчики — запуск нулевых — приём результата — декремент у зависимых — запуск обнулившихся'
  question: Расставь шаги исполнителя, который прогоняет DAG-план в топологическом порядке через счётчики незакрытых зависимостей.
  explanation: Это алгоритм Кана над графом плана. Стартовый слой — узлы с нулевым счётчиком, то есть без ссылок вообще. Каждое вернувшееся свидетельство закрывает по одной зависимости у тех, кто на него ссылался, и обнуление счётчика — сигнал готовности. Если узлы остались, а нулевых счётчиков нет, значит в графе цикл — но его ловит валидатор до первого вызова API.
  kind: order
  items:
    - Для каждого узла посчитать, на сколько ещё не полученных свидетельств он ссылается
    - Отправить в работу все узлы, у которых счётчик равен нулю
    - Дождаться возврата свидетельства от любого отработавшего узла
    - Уменьшить счётчик у каждого узла, который ссылался на это свидетельство
    - Отправить в работу узлы, чей счётчик только что обнулился, и повторять приём результатов, пока остаются незапущенные узлы
