- concept: выигрыш ReWOO по токенам растёт с длиной траектории, поэтому короткий план его почти не показывает
  question: Для ReWOO против ReAct заявляют примерно пятикратную экономию токенов, но на учебном прогоне с планом из трёх узлов разница выходит скромной. Объясни своими словами, почему это не противоречие.
  explanation: Экономия ReWOO — не фиксированный множитель, а эффект, зависящий от глубины. Ошибка ожидания здесь в том, что число из статьи считают свойством архитектуры, а не свойством пары «архитектура + длина задачи».
  kind: open
  reference: 'У ReAct каждый следующий вызов тащит с собой всю прошлую историю мыслей и наблюдений, поэтому суммарный вход растёт быстрее, чем линейно по числу шагов. У ReWOO число обращений к модели фиксировано и от длины плана не зависит. Разрыв между ними — функция глубины траектории: на трёх шагах накапливать почти нечего, и разница сводится к константе, а заявленная пятикратность получена на задачах с длинными траекториями. На коротком прогоне видно только направление эффекта, а не его величину; чтобы увидеть заявленный масштаб, нужен план глубиной в десятки шагов.'
  id: 024-demo-trassa-3
  fingerprint: eaa66156
