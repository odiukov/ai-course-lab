- concept: грубая оценка расхода токенов через счёт символов при курсе примерно четыре символа на токен
  question: Токенайзер не подключён, расход оценивают счётом символов из расчёта примерно 4 символа на токен. Промпт solver'а вместе с планом и свидетельствами занял 6000 символов. Сколько это примерно токенов?
  explanation: '6000 / 4 = 1500. Счёт по символам — грубая, но честная замена токенайзеру: абсолютное число врёт, а отношение между двумя прогонами сохраняется, и сравнивать ReWOO с ReAct этого хватает.'
  kind: numeric
  answer: 1500
  tolerance: 50
