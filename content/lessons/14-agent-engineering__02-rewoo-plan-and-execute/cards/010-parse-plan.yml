- concept: идентификатор свидетельства отделяется от вызова по первому вхождению разделителя, потому что разделитель может встречаться внутри аргумента
  question: Строка узла плана `#E4 = Calculator[x = 2*y + 7]` разбивается на идентификатор и вызов по знаку `=`. Почему разбиение обязано быть по первому вхождению, а не по всем сразу?
  explanation: Слева от первого `=` стоит идентификатор, справа — весь остаток строки как есть. Разбиение без ограничения даст три фрагмента вместо двух, и аргумент `x = 2*y + 7` развалится. Ограничение по первому вхождению (`maxsplit`) — единственное безопасное предположение о содержимом аргумента.
  kind: choice
  options:
    - Знак `=` встречается внутри аргумента, и разбиение по всем вхождениям порвёт аргумент на куски
    - Разбиение по всем вхождениям медленнее на длинных планах
    - Модель всегда ставит ровно один знак `=` в строке узла, так что разница чисто стилистическая
    - Идентификатор свидетельства может сам содержать знак `=`
