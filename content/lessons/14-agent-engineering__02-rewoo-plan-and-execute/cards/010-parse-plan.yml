- concept: парсер сохраняет аргумент сырой строкой и не разрешает ссылки на свидетельства — подстановка относится к фазе диспетчеризации
  question: Парсер плана встретил узел, чей аргумент содержит ссылку на результат более раннего узла. Что корректнее сделать на этапе разбора?
  explanation: 'Разбор — чистая операция над текстом: на момент парсинга ни один инструмент ещё не вызван, подставлять нечего. Ссылка разрешается позже, когда исполнитель отправляет узел воркеру и зависимости уже вернули свидетельства. Смешивание двух фаз ломает и порядок, и возможность распечатать план до запуска.'
  kind: choice
  options:
    - Сохранить аргумент как есть, ссылку оставить нетронутой
    - Сразу подставить вместо ссылки результат более раннего узла
    - Отбросить узел как незавершённый и вернуться к нему после исполнения зависимостей
    - Заменить ссылку на пустую строку, чтобы аргумент был валиден
