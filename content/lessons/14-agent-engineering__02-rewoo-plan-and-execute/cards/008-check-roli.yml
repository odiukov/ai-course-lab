- concept: 'свидетельства адресуются идентификатором узла, а не именем инструмента: один инструмент в двух узлах даёт два независимых свидетельства'
  question: 'План содержит узел #E2 = Search[столица Перу] и узел #E4 = Search[население #E2]. Один и тот же инструмент вызывается дважды. Как это отражается на свидетельствах?'
  explanation: 'Переменная #E именует узел, а не инструмент. Поэтому один и тот же Search можно вызывать сколько угодно раз: каждый узел кладёт свой результат под своим идентификатором, и подстановка #E2 внутрь аргументов #E4 остаётся однозначной.'
  kind: choice
  options:
    - Второй вызов перезаписывает результат первого, потому что инструмент один
    - 'Получаются два независимых свидетельства, #E2 и #E4, — идентификатор привязан к узлу плана, а не к инструменту'
    - Планировщик обязан переименовать второй инструмент, иначе ссылка станет неоднозначной
    - Оба вызова сливаются в одно свидетельство, которое Solver потом разбирает по частям
