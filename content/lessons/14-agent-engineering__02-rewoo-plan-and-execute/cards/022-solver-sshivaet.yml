- concept: требования к форме и содержанию итогового ответа адресуются Solver, потому что вопрос пользователя после планирования читает только он
  question: Тебе нужно, чтобы агент на ReWOO отвечал одной фразой и всегда называл источник. Куда в конвейере попадает это требование и почему не в промпты воркеров?
  explanation: 'Роль воркера — добыть сырьё; роль Solver — единственная точка, где вопрос, план и свидетельства сходятся вместе, и единственная, где рождается текст для человека. Отсюда правило: инструкции про формат, язык, длину и ссылки на источники живут в промпте Solver.'
  kind: open
  reference: 'В промпт Solver. После того как Planner построил план, исходный вопрос больше никто не видит до самого Solver: воркеры получают только имя инструмента и аргумент, каждый в своём крошечном промпте, и не знают, зачем их вызвали и в каком виде нужен ответ человеку. Никакой формат, заданный воркеру, не переживёт стадию свидетельств — воркер возвращает сырой выход инструмента. Итоговый текст формирует ровно один вызов Solver, поэтому требования к форме ответа — его инструкция.'
  id: 022-solver-sshivaet-2
  fingerprint: 4b33a11c
