- concept: валидация плана гарантирует исполнимость графа, но не пригодность плана для ответа на вопрос пользователя
  question: 'План прошёл валидацию целиком: идентификаторы свидетельств уникальны, все ссылки разрешаются, циклов нет, каждый вызываемый инструмент есть в каталоге. Что в таком плане всё равно может быть не так? Объясни своими словами.'
  explanation: 'Три проверки — уникальность, разрешимость ссылок, ацикличность плюс сверка с каталогом — это дешёвый фильтр структурных поломок до первого платного вызова. Смысловая пригодность плана ими не покрывается: инструмент из каталога может быть просто не тем инструментом, который нужен для задачи.'
  kind: open
  reference: Валидатор проверяет структуру графа и словарь инструментов, то есть отвечает на вопрос «можно ли это исполнить», а не «даст ли это ответ». Валидный план может вызывать существующий, но неподходящий инструмент; передавать ему аргумент, который формально строка, а по смыслу мусор; собирать свидетельства, которых для ответа на исходный вопрос недостаточно, или наоборот тратить вызовы на лишние узлы. Такие дефекты статически не видны — они всплывают только у Solver'а или у человека, читающего результат.
  id: 017-check-validaciya-2
  fingerprint: 336d233d
