- concept: разрешение ссылок — детерминированная замена подстроки, которую делает исполнитель кодом, без обращения к модели
  question: 'В плане ReWOO лежит узел `#E9 = Search[weather in #E7]`, свидетельство `#E7` уже получено и равно «Lisbon». Кто и как превращает аргумент в «weather in Lisbon» перед вызовом инструмента?'
  explanation: 'Подстановка — механическая операция над строкой: найти маркер ссылки, взять сохранённое свидетельство, заменить. Никакого вывода модели тут не нужно, поэтому количество обращений к LLM от числа подстановок не меняется. Если бы ссылки раскрывала модель, ReWOO потерял бы главное — дешёвое исполнение между двумя вызовами LLM.'
  kind: choice
  options:
    - Исполнитель узла делает обычную замену подстроки в коде — модель на этом этапе не вызывается
    - Планировщик вызывается повторно и генерирует переписанный узел с уже подставленным городом
    - Решатель (Solver) заранее раскрывает все ссылки плана одним промптом перед началом работы инструментов
    - Инструмент сам получает строку со ссылкой и запрашивает у модели её значение
  correct: 0
  id: 013-moment-podstanovki-1
  fingerprint: f8d50fba
- concept: подстановка выполняется над копией аргументов непосредственно перед вызовом, а строка узла в плане остаётся неизменной
  question: Исполнитель дошёл до узла плана, чей аргумент содержит ссылку на свидетельство более раннего узла. Расставь операции в том порядке, в котором они происходят.
  explanation: 'Ссылка живёт в плане до конца работы: заменяется не текст плана, а его копия, уходящая инструменту. Поэтому в трассе видно и план как он был задуман, и фактический запрос — их можно сверить. Мутируй план на месте, и возможность такой сверки исчезнет, а повторный запуск узла окажется невозможен.'
  kind: order
  items:
    - Прочитать из плана строку аргументов узла как она записана, вместе со ссылками
    - Построить копию строки, заменив в ней каждую ссылку значением уже сохранённого свидетельства
    - Отправить инструменту подставленную копию
    - Сохранить вернувшийся результат как свидетельство под идентификатором этого узла
  id: 013-moment-podstanovki-2
  fingerprint: 4975cfa0
- concept: одно свидетельство подставляется во все ссылающиеся узлы, повторного вызова инструмента это не требует
  question: Три разных узла плана ссылаются в своих аргументах на свидетельство `#E7`. Что произойдёт при исполнении?
  explanation: 'Свидетельство — запись в хранилище, адресуемая идентификатором узла. Подстановка читает эту запись, а не вызывает инструмент, поэтому количество ссылок на `#E7` не влияет на количество вызовов инструмента. Отсюда и экономия: дорогая часть (вызов) выполняется один раз, дешёвая (замена подстроки) — сколько угодно.'
  kind: choice
  options:
    - Инструмент узла `#E7` сработает один раз, а его сохранённое свидетельство подставится в аргументы всех трёх узлов
    - Инструмент узла `#E7` сработает заново перед каждым из трёх узлов, чтобы значение было свежим
    - Только первый из трёх узлов получит подставленное значение, остальным придётся объявить собственные копии узла `#E7`
    - 'План будет отклонён: на одно свидетельство разрешена ровно одна ссылка'
