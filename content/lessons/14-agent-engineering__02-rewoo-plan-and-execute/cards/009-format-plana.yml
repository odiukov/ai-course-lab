- concept: в текстовой записи узла ReWOO слева от знака равенства стоит идентификатор свидетельства, под которым сохранится результат вызова
  question: 'Узел плана ReWOO записан парой строк. Ранее в плане уже созданы свидетельства #E3 и #E4. Допишите пропуск так, чтобы результат этого вызова сохранился как четвёртое свидетельство подряд идущей нумерации.'
  explanation: 'Слева от `=` — имя, под которым Solver и последующие узлы найдут результат; справа — инструмент и аргумент в квадратных скобках. Нумерация свидетельств сквозная по плану, поэтому после #E3 и #E4 идёт #E5. Ссылки внутри скобок (#E3, #E4) — это зависимости, подставляемые перед вызовом.'
  kind: cloze
  template: |-
    Plan: сложить два измерения
    ___ = Calculator[#E3 plus #E4]
  answer: '#E5'
  accept:
    - E5
    - '#e5'
    - '#E5 '
  id: 009-format-plana-1
  fingerprint: a834e675
- concept: 'прозаическая строка Plan: не исполняется — она нужна модели для проговаривания замысла и человеку для чтения трассы'
  question: 'В плане ReWOO каждый узел описан прозаической строкой `Plan: ...` и следующей за ней строкой вызова вида `#En = Tool[аргумент]`. Исполняется только строка вызова. Зачем тогда планировщик пишет прозаическую строку?'
  explanation: 'Прозаическая строка — рассуждение планировщика, вынесенное в план. Исполняемая семантика целиком в строке вызова; порядок задают ссылки #E внутри аргументов, а не текст замысла. Польза строки двоякая: она улучшает качество самого вызова (модель сначала формулирует цель) и делает трассу читаемой при разборе сбоев.'
  kind: choice
  options:
    - Worker парсит её, чтобы понять, какой инструмент выбрать, если имя инструмента неоднозначно
    - 'Она не исполняется: модели легче построить корректный вызов, проговорив замысел, а человеку легче читать трассу и понимать назначение узла'
    - Solver подставляет её текст вместо свидетельства, если инструмент вернул ошибку
    - Она задаёт порядок исполнения узлов, который иначе не восстановить
  correct: 1
  id: 009-format-plana-2
  fingerprint: bb2ed9f9
- concept: жёсткий синтаксис строки вызова нужен, чтобы извлечение инструмента и аргумента было механическим разбором, а не интерпретацией текста
  question: Планировщик ReWOO — языковая модель, она может выдать только текст. Почему план записывают жёстким шаблоном `#En = Tool[аргумент]`, а не свободной фразой вроде «сначала узнай столицу, потом её население»?
  explanation: Смысл формата — перенести структуру графа в текст без потерь. Раз разбор детерминированный, между планированием и исполнением не появляется лишнего слоя интерпретации; это же условие делает возможной подстановку ссылок и параллельный запуск независимых узлов.
  kind: open
  reference: 'Свободная фраза не даёт границ: непонятно, где кончается имя инструмента и начинается аргумент, какой узел от какого зависит и куда класть результат. Жёсткий шаблон делает разбор механическим — регулярное выражение вытаскивает идентификатор свидетельства слева от `=`, имя инструмента и содержимое квадратных скобок, а вхождения #En в аргументе дают рёбра зависимостей. Тогда для запуска инструмента не нужен второй вызов модели, который «понимал бы» план: Worker выполняет ровно то, что распарсено, и ошибки формата видны сразу, а не проявляются как молчаливо неверный вызов.'
  id: 009-format-plana-3
  fingerprint: 0729a44d
