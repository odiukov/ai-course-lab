- concept: широкий except с подстановкой пустого значения по умолчанию стирает различие между отсутствием файла, оборванной записью и нарушением контракта
  question: 'Функция загрузки состояния обёрнута в `except Exception: return {}`. Чем это плохо?'
  explanation: 'Три разные причины требуют трёх разных реакций: пустого состояния (создать новое), повреждения (чинить или откатывать), несоответствия контракту (мигрировать схему). Единая подмена на {} превращает все три в молчаливый старт с чистого листа — самый разрушительный вариант, потому что агент затрёт существующую работу. Исходное исключение нужно пропускать наружу: оно называет рубеж, на котором файл не прошёл.'
  kind: choice
  options:
    - Пустой словарь не пройдёт валидацию, поэтому ошибка всё равно всплывёт немедленно
    - Отсутствие файла, битый JSON и невалидная структура становятся неотличимы и выглядят как штатное «состояния ещё нет», из-за чего агент начинает работу с нуля поверх реально существующей задачи
    - Такой блок замедляет чтение, потому что перехват исключений дорог
  correct: 1
  id: 015-load-state-1
  fingerprint: bd65b6ac
- concept: 'негативный тест на порчу поля обязателен: успешный проход валидного файла не доказывает, что валидация вообще вызывается'
  question: 'Загрузка состояния проверена на корректном файле: данные читаются, тест зелёный. Почему этого недостаточно и нужен второй тест с намеренно испорченным полем?'
  explanation: 'Позитивный тест покрывает только счастливый путь и остаётся зелёным, даже если строку с валидацией забыли или её результат нигде не используется. Проверяется здесь именно поведение отказа: неверное значение поля не должно возвращаться вызывающему. Тест на отрицательный сценарий — единственное доказательство, что граница доверия существует, а не только описана в коде.'
  kind: choice
  options:
    - Потому что нужно измерить скорость чтения на разных данных
    - 'Потому что валидный файл проходит одинаково и с вызовом валидатора, и без него: только отказ на испорченном значении доказывает, что проверка стоит на пути данных'
    - Потому что валидатор кэширует схему и второй вызов работает иначе
