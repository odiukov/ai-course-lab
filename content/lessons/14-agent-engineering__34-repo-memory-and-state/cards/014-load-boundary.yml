- concept: 'валидация стоит на границе загрузки: объект отдаётся вызывающему только после проверки, а не проверяется где-то позже по коду'
  question: Загрузчик состояния возвращает разобранный словарь сразу, а валидацию по схеме код выполняет позже — перед сохранением. Что не так с таким расположением проверки?
  explanation: Граница доверия проходит там, где данные становятся доступны программе. Если неизвестный status вернулся наружу, ветвления, выбор следующего действия и вызовы инструментов уже отработают на нём. Отложенная проверка ловит порчу после того, как та повлияла на поведение, и отладка становится дороже отказа на чтении.
  kind: choice
  options:
    - 'Ничего: проверка всё равно выполнится до записи на диск'
    - Между возвратом и проверкой невалидные поля уже участвуют в решениях, и ошибка проявится как неверное поведение, а не как отказ загрузки
    - Валидацию вообще нельзя выполнять дважды, поэтому её место только в записи
  correct: 1
  id: 014-load-boundary-1
  fingerprint: 66650e4d
- concept: 'собственное авторство файла не освобождает от проверки при чтении: между записью и загрузкой содержимое могло измениться независимо от программы'
  question: Разработчик предлагает не валидировать состояние при загрузке, так как файл пишет та же программа и уже проверяет его перед записью. Какой аргумент опровергает это?
  explanation: 'Файл на диске — общий ресурс, а не приватная память процесса: его правят люди, сливают ветки, копируют между окружениями, и сам контракт со временем меняется. Атомарная запись гарантирует лишь целостность подмены, но не соответствие содержимого нынешней схеме. Поэтому проверка нужна на каждом чтении, независимо от того, кто был автором записи.'
  kind: choice
  options:
    - Между записью и следующей загрузкой файл могли отредактировать вручную, откатить к старой версии из системы контроля версий или подменить при слиянии веток
    - Валидация при чтении быстрее, чем при записи
    - Валидатор при записи проверяет только обязательные поля, а при чтении — все
