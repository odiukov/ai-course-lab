- concept: успешность записи подтверждается обратным чтением с валидацией, а не отсутствием исключения
  question: atomic_write отработала без исключений. Объясни, почему этого мало для вывода «состояние сохранено корректно» и какой дешёвый шаг закрывает пробел.
  explanation: Запись и содержимое — разные гарантии. Read-back с валидацией стоит одно чтение и превращает надежду в проверку, ровно как проверка запертой двери за ручку, а не по факту поворота ключа.
  kind: open
  reference: 'Отсутствие исключения говорит лишь о том, что операции ввода-вывода прошли. Оно ничего не говорит о содержимом: в память могли уйти данные, не соответствующие схеме, — неверный тип поля, пропущенный обязательный ключ, лишний уровень вложенности. Дешёвый шаг — обратное чтение: сразу после подмены прочитать целевой файл и прогнать через validate. Круг «записал — перезагрузил — сверил» ловит ошибки, которые на записи не проявляются.'
  id: 011-atomic-write-3
  fingerprint: '25136163'
