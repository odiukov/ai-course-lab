- concept: ошибка при очистке черновика не должна подменять собой исходную ошибку записи
  question: Внутри atomic_write запись во временный файл упала по нехватке места. Обработчик пытается удалить черновик, но os.unlink тоже падает — файл уже исчез. Как должен вести себя код?
  explanation: 'Причина сбоя — нехватка места; неудачное удаление черновика вторично и диагностически пусто. Если выпустить наверх его, настоящая причина потеряется. Очистка выполняется best-effort, исходное исключение сохраняется. Вариант с повтором replace недопустим: черновик неполон.'
  kind: choice
  options:
    - Подавить ошибку удаления и дать наверх исходную ошибку записи
    - Дать наверх ошибку удаления, поскольку она произошла последней
    - Проглотить обе ошибки и вернуть управление, оставив целевой файл прежним
    - Повторить os.replace, чтобы завершить операцию несмотря на сбой
  correct: 0
