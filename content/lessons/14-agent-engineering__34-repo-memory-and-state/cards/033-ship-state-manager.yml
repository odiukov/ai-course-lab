- concept: схема описывает допустимый документ, но не покрывает долговечность записи и переход между версиями — это отдельные части артефакта
  question: Для памяти репозитория готова JSON Schema состояния агента. Чего эта схема принципиально не обеспечивает сама по себе?
  explanation: 'Схема отвечает на вопрос «допустим ли этот документ». Она ничего не говорит о том, чем закончится оборванная запись и что делать с файлами, написанными по прошлому контракту. Поэтому готовый артефакт — это три состыкованные части: схемы, менеджер состояния поверх атомарной записи и каркас миграции.'
  kind: choice
  options:
    - Перечня допустимых статусов задачи
    - Обязательности поля с версией контракта
    - Запрета на неверный тип у поля
    - Целостности записи на диск и перевода файлов старой формы в новую
  correct: 3
  id: 033-ship-state-manager-1
  fingerprint: dda92b9d
- concept: место для перехода версий закладывается, пока версия ещё одна, а не изобретается в момент первого переименования поля
  question: В проекте существует только первая версия схемы состояния, мигрировать пока нечего. Зачем включать каркас миграции в артефакт уже сейчас?
  explanation: Каркас — это заранее определённое место, куда ложится переход. Пока версия одна, его дешевле заложить; когда поле переименовали, на диске уже лежит десяток файлов прошлой формы, и путь для них нужен немедленно. Каркас не разрешает грузить произвольные версии — он даёт место реализованному переходу.
  kind: choice
  options:
    - Чтобы менеджер мог загружать файлы с любым номером версии
    - Чтобы первое же переименование поля (например, blockers в risks) не превратило все накопленные файлы в неожиданную поломку
    - Чтобы уменьшить размер снимка состояния
    - Чтобы схема могла обслуживать и состояние, и доску задач одним документом
