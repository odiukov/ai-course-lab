- concept: сбой не выполняет очистку, поэтому временные файлы накапливаются и требуют уникальных имён и отдельной уборки
  question: Агент падает между созданием временного файла и переименованием, и так повторяется много раз подряд. Что остаётся в каталоге состояния и что должна предусматривать реализация записи?
  explanation: Атомарная запись гарантирует целостность цели, но не убирает за собой при сбое. Мусор безопасен для корректности и опасен для места на диске и для наивного кода, который выбирает «первый попавшийся» черновик.
  kind: open
  reference: 'Остаются осиротевшие временные файлы: штатный путь удалил бы черновик, но при падении код очистки не выполняется вовсе. Отсюда два требования: имена временных файлов уникальны (mkstemp с префиксом), чтобы новый запуск не спорил со старым мусором и не дописывал в чужой черновик; и нужна отдельная уборка — удаление старых черновиков по префиксу при старте или по возрасту. Само состояние при этом не повреждено: целевое имя всё время указывало на прежнюю целую версию.'
  id: 013-crash-check-3
  fingerprint: d72c9732
