- concept: долговечность самой подмены имени требует fsync каталога, а не только fsync файла данных
  question: Агент записал данные во временный файл, вызвал fsync на этом файле, затем os.replace поверх целевого имени — и тут же пропало питание. Почему после загрузки по целевому имени может оказаться прежняя версия?
  explanation: 'fsync закрепил байты данных временного файла. Сама подмена — это изменение каталога, которое может ждать в кэше метаданных. Открыть каталог и вызвать fsync на нём — то, что делает уже выполненное переименование переживающим потерю питания. Гарантия «старое или новое целиком» при этом не нарушается: теряется не половина файла, а факт подмены.'
  kind: choice
  options:
    - fsync на файле не делает долговечной запись каталога о переименовании; для этого нужен fsync каталога
    - os.replace не атомарен и всегда откатывается при сбое питания
    - fsync действует только на метаданные, а данные всегда теряются
  correct: 0
  id: 013-crash-check-2
