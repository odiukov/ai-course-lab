- concept: 'миграция работает на копии: вход не мутируется, при ошибке снаружи не остаётся полупреобразованного объекта'
  question: Функция миграции переносит поля прямо в переданном словаре и падает на середине преобразования. Что получает вызывающий код?
  explanation: 'Мутация на месте делает вход и выход одним объектом, поэтому частичное преобразование утекает наружу. Работа на копии даёт всё-или-ничего: либо возвращён валидный новый документ, либо у вызывающего остался прежний.'
  kind: choice
  options:
    - 'Исключение и вдобавок исходный словарь в полупреобразованном виде: часть полей уже переименована, версия ещё старая'
    - 'Исключение и нетронутый исходный словарь: интерпретатор откатывает изменения'
    - Полностью преобразованный словарь, поскольку изменения применены на месте
    - Пустой словарь, так как преобразование не завершилось
  correct: 0
  id: 022-migrate-state-1
  fingerprint: 6bbf3812
- concept: отсутствующее или неподходящее значение версии не подставляется по умолчанию
  question: Файл состояния не содержит поля `schema_version`. Что должна сделать миграция?
  explanation: Молчаливая подстановка версии по умолчанию — та же догадка о формате, только спрятанная в одну строку кода. Файл без версии мог быть написан чем угодно; выбор маршрута преобразования по догадке портит состояние тише, чем отказ.
  kind: choice
  options:
    - 'Отказать с понятной ошибкой: версия неизвестна'
    - Считать документ самой старой известной версией и мигрировать его
    - Считать документ текущей версией и вернуть как есть
    - Проставить текущую версию и сохранить документ
  correct: 0
  id: 022-migrate-state-2
  fingerprint: 3a4c09cd
- concept: 'версия поднимается последней: сначала данные переносятся, затем результат проходит схему целевой версии'
  question: Расставьте шаги миграции состояния с предыдущей версии на текущую в правильном порядке.
  explanation: Номер версии — утверждение «документ соответствует этому контракту». Ставить его до переноса данных значит утверждать это авансом; проверка схемой стоит после, чтобы наружу не вышел документ с новой версией и старой структурой.
  kind: order
  items:
    - Сделать независимую копию входного документа
    - Определить версию входа и выбрать известный маршрут преобразования (иначе отказать)
    - Перенести значение старого поля в новое и удалить старое
    - Проставить в копии номер текущей версии
    - Проверить итоговый документ схемой текущей версии
    - Вернуть проверенный документ вызывающему
  id: 022-migrate-state-3
  fingerprint: 4d21d0cb
