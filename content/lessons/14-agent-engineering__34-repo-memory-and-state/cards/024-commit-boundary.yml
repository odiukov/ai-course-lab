- concept: 'две независимые границы фиксации: право снимка стать состоянием и целостность его появления на диске'
  question: Валидация снимка и атомарная подмена файла отвечают на разные вопросы. На какие именно, и почему одной из них недостаточно?
  explanation: Одна граница про смысл содержимого, другая — про способ его появления на диске. Они ортогональны, поэтому нужны обе.
  kind: open
  reference: 'Валидатор отвечает: «этот снимок вообще можно считать состоянием» — он отсекает документы, нарушающие контракт. Атомарная подмена отвечает: «на диске окажется либо целиком старый снимок, либо целиком новый» — она отсекает обрывки от прерванной записи. Без валидации атомарность аккуратно и целиком запишет мусор; без атомарности проверенный снимок может лечь на диск наполовину при сбое посреди записи. Порядок тоже фиксирован: сначала снимок получает право стать памятью, и лишь затем занимает место предыдущего.'
  id: 024-commit-boundary-3
  fingerprint: b4812264
