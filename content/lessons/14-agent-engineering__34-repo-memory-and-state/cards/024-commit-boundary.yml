- concept: файл состояния хранит один согласованный снимок, а не накопленные частичные правки
  question: Почему фиксация записывает полный снимок состояния вместо того, чтобы дописывать изменённое поле внутрь существующего файла?
  explanation: 'Снимок как единица записи означает: провалидировали ровно то, что окажется на диске. Дописывание поля в существующий файл создаёт итоговый документ, которого валидатор не видел, и превращает файл в журнал правок вместо состояния.'
  kind: choice
  options:
    - Потому что файл должен представлять одно согласованное состояние на конкретный момент; частичные дописывания дают комбинацию полей, которую никто не проверял целиком
    - Потому что дописывание внутрь JSON технически невозможно
    - Потому что полный снимок занимает меньше места на диске
    - Потому что схема запрещает изменять больше одного поля за операцию
  correct: 0
