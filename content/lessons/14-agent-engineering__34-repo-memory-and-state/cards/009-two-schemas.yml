- concept: одна схема на два разных типа документов делает обязательные поля либо слишком строгими, либо бесполезными
  question: Состояние агента и доску задач описали одной общей схемой. Поле tasks по смыслу обязательно только для доски. Что произойдёт?
  explanation: Общая схема вынуждена выбрать одно правило для двух смыслов, и любой выбор ошибочен для одного из документов. Раздельные схемы позволяют сформулировать требование к каждому виду документа без компромисса.
  kind: choice
  options:
    - если tasks обязательно — корректное состояние агента будет отклонено; если необязательно — доска без задач пройдёт проверку
    - валидатор сам определит вид документа по набору присутствующих полей
    - общая схема сохранит прежнюю строгость и ускорит проверку
    - оба документа будут проверяться строже, чем при раздельных схемах
  correct: 0
  id: 009-two-schemas-1
  fingerprint: 5e2266c6
- concept: состояние хранит указатель на текущую работу, доска — сами объекты работы
  question: Какое распределение полей соответствует ролям двух файлов?
  explanation: Состояние отвечает на вопрос «где агент остановился», поэтому ему хватает ссылки на текущую задачу. Доска отвечает на вопрос «какая работа существует и в каком она статусе», поэтому она хранит сами объекты задач.
  kind: choice
  options:
    - полный список задач дублируется в обоих файлах
    - active_task_id в состоянии агента, объекты задач с id и status в доске
    - active_task_id в доске, а status и список задач в состоянии агента
    - в состоянии только id задач, в доске только их статусы
  correct: 1
  id: 009-two-schemas-2
  fingerprint: 0285fedc
- concept: раздельные схемы изолируют изменения одного документа от правил другого
  question: В задачу на доске добавили новое обязательное поле owner. Что меняется при раздельных схемах состояния и доски?
  explanation: 'Разделение контрактов даёт разделение зон изменений: устройство доски эволюционирует отдельно, а требования к позиции агента остаются прежними. Ошибка валидации при этом указывает ровно на тот документ, который сломан.'
  kind: choice
  options:
    - меняется только схема доски, правила состояния агента не трогаются
    - обе схемы приходится править синхронно, иначе документы разойдутся
    - состояние агента перестаёт валидироваться до правки его схемы
    - изменение требует объединить обе схемы в одну
  correct: 0
  id: 009-two-schemas-3
  fingerprint: f203a2d0
