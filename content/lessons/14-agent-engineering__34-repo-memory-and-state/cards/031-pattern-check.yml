- concept: журнал отложенных вызовов решает узкую задачу подавления повторного внешнего эффекта и не является источником восстановления состояния
  question: 'Агент ведёт три файла: снимок состояния, журнал событий и журнал отложенных вызовов инструментов. Какая роль у последнего?'
  explanation: 'Журнал отложенных вызовов не описывает работу агента целиком и не восстанавливает её. Его задача узкая: показать, что письмо, вставка в базу или загрузка файла могли уже уйти наружу, и подавить повтор. «Где мы сейчас» отвечает снимок, «как мы сюда пришли» — журнал событий.'
  kind: choice
  options:
    - Хранить полную историю изменений и тем самым заменять журнал событий
    - Позволять восстановить рабочее состояние после падения, если снимок потерян
    - Помечать вызовы с внешним эффектом, чтобы после перезапуска не выполнить их второй раз
    - Уменьшать размер снимка, вынося из него крупные артефакты
  correct: 2
  id: 031-pattern-check-1
  fingerprint: d7a5ede1
- concept: 'порядок возобновления после падения: снимок, доигрывание событий после его рубежа, сверка id вызова до его выполнения'
  question: Агент упал посреди долгого прогона и перезапускается. Расставь шаги возобновления в правильном порядке.
  explanation: Снимок даёт быструю точку старта, события после его рубежа доводят состояние до актуального. Но ни то, ни другое не знает про вызов, который ушёл наружу и не успел попасть в чекпоинт — это проверяется отдельно, до выполнения вызова.
  kind: order
  items:
    - Загрузить последний снимок состояния
    - Проиграть события журнала, записанные после рубежа снимка
    - Перед очередным вызовом с внешним эффектом сверить его id с журналом отложенных вызовов
    - Выполнить вызов, только если id там не найден, иначе взять сохранённый результат
  id: 031-pattern-check-2
  fingerprint: 6b4f43b4
