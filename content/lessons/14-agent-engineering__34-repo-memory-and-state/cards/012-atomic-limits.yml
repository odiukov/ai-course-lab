- concept: атомарная подмена не защищает от потерянного обновления при двух писателях
  question: Два агента прочитали состояние версии 31. Первый записал завершение задачи T-204, следом второй записал свой риск для T-318. Оба использовали атомарную запись. Каков результат на диске?
  explanation: Второй агент собрал свою версию из устаревшего снимка и заменил файл целиком. JSON корректен, схема проходит, а изменение первого агента потеряно. Это потерянное обновление — ошибка согласования, а не ошибка целостности файла.
  kind: choice
  options:
    - цельный валидный файл, в котором изменения первого агента исчезли
    - оборванный JSON, потому что записи наложились друг на друга
    - 'файл с обоими изменениями: os.replace объединяет содержимое'
    - отказ второй записи, так как файл уже изменён
  correct: 0
  id: 012-atomic-limits-1
  fingerprint: 5302c23b
- concept: согласование писателей требует отдельного протокола поверх атомарной записи
  question: Какой механизм устраняет потерянные обновления при нескольких писателях в один файл состояния?
  explanation: 'Атомарность отвечает на вопрос «увидит ли читатель цельный файл». Вопрос «имел ли писатель право заменить именно эту версию» решают отдельно: сверкой версии при записи, блокировкой файла или назначением единственного писателя.'
  kind: choice
  options:
    - вызывать fsync дважды перед подменой
    - записывать состояние в более компактном формате, чтобы запись занимала меньше времени
    - разрешать запись версии N+1 только если на диске всё ещё версия N, иначе перечитать и слить изменения
    - создавать временный файл в другом каталоге, чтобы писатели не пересекались
  correct: 2
  id: 012-atomic-limits-2
  fingerprint: c0ccfa4a
