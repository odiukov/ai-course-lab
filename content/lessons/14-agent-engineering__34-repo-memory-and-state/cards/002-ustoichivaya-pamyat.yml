- concept: типизированные поля дают однозначную точку продолжения там, где свободный пересказ её не даёт
  question: Запись «почти закончил отчёт, осталось проверить мелочи» и запись состояния по схеме несут примерно один объём текста. Почему вторая пригодна для продолжения работы, а первая нет?
  explanation: 'Ценность схемы не в объёме, а в однозначности: поля дают точку продолжения и допускают машинную проверку.'
  kind: open
  reference: 'Свободный пересказ требует интерпретации: неясно, какой файл, что уже изменено, готов результат или это набросок, что мешает. В записи по схеме у каждой сведения своё подписанное поле — активная задача, затронутые файлы, допущения, блокеры, следующее действие. Их читают, а не толкуют, и пропуск или неподходящее значение можно обнаружить автоматически.'
  id: 002-ustoichivaya-pamyat-2
