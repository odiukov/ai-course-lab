- concept: 'схема запрещает подмену типа: null не эквивалентен пустому массиву'
  question: Поле `touched_files` описано в схеме как массив строк. Один агент записал `[]`, другой — `null`. Как это разрешает контракт?
  explanation: 'Для человека смысл похож, для машины нет: `null` — не «почти пустой массив», а иной тип. Схема закрывает эту двусмысленность, иначе каждому потребителю пришлось бы обрабатывать оба варианта.'
  kind: choice
  options:
    - 'Оба значения валидны: они одинаково означают «файлов нет»'
    - '`[]` валидно, `null` отклоняется как другой тип данных'
    - '`null` валидно, `[]` отклоняется как незаполненное поле'
  correct: 1
