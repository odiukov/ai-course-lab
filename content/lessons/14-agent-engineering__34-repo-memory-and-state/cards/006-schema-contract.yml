- concept: 'схема как исполняемый контракт: неверная запись отклоняется, а не расшифровывается потом'
  question: Чем JSON Schema для файла состояния отличается от той же договорённости, записанной в README как текст? Объясни своими словами.
  explanation: 'Ценность в исполняемости: контракт проверяется автоматически и не даёт незаметно изменить общий язык репозитория.'
  kind: open
  reference: 'Текстовую договорённость можно забыть, истолковать иначе или обойти: агент придумает новое поле, ревьюер разберёт новую форму вручную, CI-скрипт добавит частный случай. Схема применяется программой к каждой записи до принятия: обязательные ключи, допустимые значения status, запрещённые типы, шаблоны, поле версии. Плохая запись становится отклонённой записью, а не будущей загадкой.'
  id: 006-schema-contract-3
  fingerprint: 6bbc3332
