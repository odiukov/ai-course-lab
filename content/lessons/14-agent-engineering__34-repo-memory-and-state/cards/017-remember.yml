- concept: валидация на границе записи не даёт невалидному документу стать источником правды и сохраняет последнюю загружаемую версию
  question: Зачем проверять объект схемой до атомарной записи, если при загрузке он всё равно будет провалидирован?
  explanation: 'Две проверки решают разные задачи: на записи — не создать невосстановимое состояние, на чтении — не доверять файлу, который мог измениться извне. Отказ до подмены дешевле, потому что предыдущая версия остаётся рабочей точкой продолжения.'
  kind: open
  reference: 'Проверка на чтении лишь обнаружит поломку, но к тому моменту последняя валидная версия уже затёрта — восстанавливать нечего. Проверка перед записью отвергает плохой документ, пока файл ещё не подменён: на диске остаётся прежнее состояние, которое загружается и позволяет продолжить работу, а вызывающий получает ошибку сразу, в том месте, где известно, какое именно поле её вызвало.'
