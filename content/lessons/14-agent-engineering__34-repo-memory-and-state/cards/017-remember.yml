- concept: обновление строится поверх загруженного документа, иначе запись нового объекта затирает остальные поля
  question: 'Функция сохранения собирает новый словарь из одного переданного поля и записывает его в файл состояния. Задача T-204 отработала три вызова подряд: next_step, assumptions, artifacts. Что окажется в файле?'
  explanation: Файл заменяется целиком, слияния на уровне файловой системы не бывает. Уцелевают только те поля, которые попали в записанный объект, поэтому обновление обязано начинаться с загрузки текущего документа и менять в нём одно поле.
