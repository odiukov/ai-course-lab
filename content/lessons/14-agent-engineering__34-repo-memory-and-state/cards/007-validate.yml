- concept: внутри одного узла проверка типа выполняется раньше правил, осмысленных только для этого типа
  question: Валидатор JSON Schema разбирает один узел данных. Расставь проверки в порядке, при котором каждое правило работает уже с подходящими данными.
  explanation: required бессмысленно для числа, pattern — для массива. Если тип не сверен первым, правило либо упадёт на неверном типе данных, либо тихо пропустит документ. Сначала type, потом всё, что этот тип предполагает, и лишь затем спуск в items.
  kind: order
  items:
    - сверить фактический тип значения с ключевым словом type
    - убедиться, что в объекте присутствуют все ключи из required
    - применить pattern к строке или enum к значению из списка допустимых
    - рекурсивно вызвать validate для каждого элемента массива, расширив путь индексом
  id: 007-validate-1
  fingerprint: 99161c83
- concept: валидность контейнера не переносится на его элементы, поэтому проверка обязана спускаться внутрь
  question: Документ `task_board` — объект с полем `tasks`, где лежит массив задач. Все обязательные поля верхнего уровня на месте, `tasks` действительно массив, но у задачи с индексом 3 поле `id` записано числом вместо строки. Что произойдёт, если validate проверяет только переданный узел и не спускается в элементы?
  explanation: 'На верхнем уровне всё сходится: объект, массив, обязательные ключи есть. Нарушение живёт на глубине, и увидеть его можно только рекурсивным вызовом validate на каждом элементе items. Без спуска ошибка проходит контроль и становится состоянием.'
  kind: choice
  options:
    - Документ будет признан валидным и запишется в память репозитория вместе с испорченной задачей
    - Документ будет отклонён, потому что тип массива не совпадёт с ожидаемым
    - Документ будет отклонён, потому что число не проходит проверку required
    - Документ будет принят, но при загрузке автоматически исправлен на строку
  correct: 0
  id: 007-validate-2
  fingerprint: 5eb6c711
- concept: накопленный путь до значения превращает факт нарушения в адрес нарушения
  question: Валидатор отвергает документ сообщением «ожидалась строка». Объясни, что нужно передавать в рекурсивный вызов помимо значения и участка схемы, и почему без этого сообщение почти бесполезно.
  explanation: 'Диагностическая ценность валидатора определяется точностью адреса. Стоимость нулевая — путь просто строится по дороге вниз, — а разница между «неверный тип» и `task_board.tasks[3].id: ожидалась строка` измеряется минутами поиска.'
  kind: open
  reference: 'В рекурсию передаётся ещё и путь до текущего значения, который наращивается при каждом спуске: имя поля для объекта, индекс для элемента массива. Тогда исключение содержит адрес вида `task_board.tasks[3].id`, ожидаемое условие и фактическое значение. Без пути автор записи знает лишь, что где-то в документе неверный тип, и вынужден искать нарушение вручную; в большом документе с однотипными задачами это самая дорогая часть отладки.'
  id: 007-validate-3
  fingerprint: 387ed3a3
