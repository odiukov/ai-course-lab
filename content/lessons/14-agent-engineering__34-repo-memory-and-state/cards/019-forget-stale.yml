- concept: текущее время передаётся функции аргументом, иначе граничный случай невоспроизводим
  question: Функция очистки устаревшего состояния берёт текущее время вызовом системных часов внутри себя. Срок жизни записи — 7 дней. Тест готовит запись возрастом ровно 7 дней и проверяет решение на границе. В чём дефект такой конструкции?
  explanation: Скрытая зависимость от часов делает функцию недетерминированной. Приняв `now` аргументом вместе с допустимым возрастом, можно зафиксировать конкретный момент и однозначно проверить обе стороны границы.
  kind: choice
  options:
    - 'Результат зависит от момента запуска: пока тест доходит до вызова, возраст уже больше границы, и тест падает случайным образом'
    - Системные часы возвращают время в другой единице измерения, поэтому арифметика возраста будет неверной
    - Обращение к часам замедляет функцию, и на границе не хватает точности
    - Часы внутри функции нельзя использовать, потому что состояние хранит время в UTC
  correct: 0
  id: 019-forget-stale-1
  fingerprint: 1b88c220
- concept: моменты времени сравниваются после разбора в aware-datetime, а не как строки
  question: В двух файлах состояния записаны отметки `2027-06-14T09:00:00+02:00` и `2027-06-14T07:00:00Z`. Код решает вопрос свежести сравнением строк. Что произойдёт?
  explanation: Один момент допускает разные текстовые представления. Отметки нужно разобрать в datetime с часовым поясом и сравнивать моменты; строковое сравнение ещё и молча ломается на времени без пояса, где непонятно, чей это час.
  kind: choice
  options:
    - Код сочтёт записи разными по времени, хотя это один и тот же момент
    - Сравнение строк корректно, потому что ISO-формат лексикографически упорядочен
    - Код упадёт с ошибкой, так как строки разной длины
    - Обе записи будут признаны свежими независимо от срока жизни
  correct: 0
  id: 019-forget-stale-2
  fingerprint: 5f656a37
- concept: поведение ровно на границе возраста задаётся контрактом, а не остаётся побочным эффектом реализации
  question: Срок жизни записи — 21 день, возраст записи ровно 21 день. Почему такой случай нельзя оставлять на усмотрение реализации и как его закрепить?
  explanation: Граничное условие — часть контракта функции. Без явного правила один и тот же файл будет то очищаться, то нет, после безобидного рефакторинга сравнения.
  kind: open
  reference: 'Граница попадает то в одну, то в другую ветку в зависимости от того, стоит в коде строгое или нестрогое сравнение, и на разных прогонах поведение памяти выглядит непредсказуемым. Контракт обязан назвать одну сторону: например, «устаревшей считается запись, возраст которой превышает срок» — тогда ровно 21 день сохраняется. Это фиксируется отдельным тестом на точное значение границы, а не только на явно старом и явно свежем возрасте.'
  id: 019-forget-stale-3
  fingerprint: cff0e494
