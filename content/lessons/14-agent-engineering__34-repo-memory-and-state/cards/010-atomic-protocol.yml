- concept: успешно завершённая запись не означает, что данные закреплены на носителе, пока не выполнен fsync
  question: Запись во временный файл завершилась без ошибки, файл закрыт. Почему этого мало, чтобы считать данные пережившими внезапное отключение питания?
  explanation: Успешный write возвращает управление, как только данные приняты ядром; физическая запись может произойти позже. fsync — явное требование закрепить данные на устройстве и подтвердить это, и только после него черновик считается подготовленным.
  kind: choice
  options:
    - данные могут оставаться в кеше операционной системы и ещё не быть записаны на носитель
    - интерпретатор не успел освободить буфер объекта файла в памяти процесса
    - файловая система пересчитывает права доступа асинхронно
    - закрытие файла не фиксирует его размер в каталоге
  correct: 0
  id: 010-atomic-protocol-1
  fingerprint: 4fbcea69
- concept: атомарность переименования держится только внутри одной файловой системы
  question: Черновик состояния пишут в /tmp, а целевой файл лежит в /srv/agent/state.json на другом разделе. Почему гарантия рушится?
  explanation: Неделимая подмена — это операция каталога внутри одной файловой системы. При переносе между разделами данные копируются побайтно, и падение посередине оставляет как раз тот обрубок, ради которого весь протокол и затевался. Поэтому временный файл создают рядом с целевым.
  kind: choice
  options:
    - перенос между файловыми системами выполняется как копирование с последующим удалением, и подмена перестаёт быть одним неделимым действием
    - /tmp очищается при перезагрузке, поэтому запись обязательно потеряется
    - os.replace требует совпадения имён и расширений файлов
    - разные разделы используют разный размер блока, и JSON искажается
  correct: 0
  id: 010-atomic-protocol-2
  fingerprint: 545583bf
- concept: частично записанный источник правды хуже, чем отсутствие новой записи
  question: Почему наполовину записанный файл состояния считают худшим исходом, чем неудачную попытку сохранения, при которой на диске осталась прежняя версия?
  explanation: 'Цель атомарной записи — не любой ценой донести последнюю версию, а гарантировать, что читатель всегда получит цельный документ: либо прежний, либо новый.'
  kind: open
  reference: 'Файл состояния — источник правды. Прежняя целая версия читается, валидируется и позволяет продолжить работу пусть и с потерей последних изменений. Обрубок JSON не читается вовсе: старых данных уже нет, новые неполны, и проверка схемы бесполезна, потому что проверять нечего. Поэтому протокол записи оптимизирует не сохранность новейшей версии, а неповреждённость источника правды: черновик рядом, fsync, затем подмена одним движением.'
  id: 010-atomic-protocol-3
  fingerprint: ae41f87d
