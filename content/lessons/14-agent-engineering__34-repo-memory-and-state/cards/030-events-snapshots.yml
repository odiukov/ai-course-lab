- concept: частота снятия снимков — компромисс между работой при возобновлении и накладными расходами записи
  question: Команда решает снимать снимок состояния реже, чем сейчас. Как это скажется на системе?
  explanation: 'Снимок не укорачивает журнал и не заменяет его — он только сокращает хвост, который нужно доиграть. Реже снимки — дешевле обычная работа, дольше старт; чаще — наоборот. Крайний случай без снимков вообще: каждый запуск проигрывает всю историю с начала.'
  kind: choice
  options:
    - Возобновление ускорится, потому что доигрывать придётся меньше событий
    - Записи станет меньше, но при возобновлении придётся доигрывать больше событий после снимка
    - Журнал событий станет короче, потому что снимок вытесняет учтённые записи
    - 'Ничего не изменится: журнал и так проигрывается с первой строки при каждом запуске'
