- concept: 'снимок производен от журнала: потеря снимка восстановима пересчётом, потеря журнала необратимо уничтожает возможность объяснить решения'
  question: Журнал событий и снимок состояния теряются по-разному. Объясни, почему эти две потери несимметричны.
  explanation: 'Отсюда и разные требования к хранению: журнал нужен для аудита и отладки долгих прогонов, снимок — ускоритель возобновления. Ту же форму использует Postgres: WAL первичен, страницы данных догоняются по нему.'
  kind: open
  reference: 'Снимок — производная величина: он собирается проигрыванием журнала с начала. Потеряв снимок, состояние восстанавливают заново, платя временем, но ничего не теряя безвозвратно. Журнал первичен: он единственный хранит последовательность решений. Потеряв его, работать по снимку можно — точка продолжения известна, — но объяснить, почему агент принял то или иное решение, уже нечем: снимок хранит итог на момент, а не путь к нему.'
