- concept: 'у валидации состояния ровно два исхода: запись целиком или отказ; частичной записи не существует'
  question: 'StateManager получил новое состояние: почти все поля корректны, одно нарушает схему. Что произойдёт?'
  explanation: 'Из проверки выходят ровно две стрелки: «валидно» — писать, «невалидно» — отказ с исключением. Пути «записать как получилось» нет, иначе следующая сессия не отличит проверенные данные от просочившихся.'
  kind: choice
  options:
    - Корректные поля запишутся, а невалидное будет обнулено
    - Запись отклоняется целиком и поднимается исключение; на диске остаётся прежняя проверенная версия файла
    - Менеджер подставит значение по умолчанию и сохранит файл, пометив поле как ненадёжное
  correct: 1
  id: 005-state-gate-1
  fingerprint: 8055a377
- concept: громкий отказ дешевле тихой порчи состояния, потому что обнаруживается сразу
  question: Почему для файла состояния явная ошибка при записи предпочтительнее «частичного успеха»? Объясни своими словами.
  explanation: Цена отказа — задержка. Цена тихой порчи — недоверие ко всей памяти и дорогая диагностика задним числом.
  kind: open
  reference: Исключение видно в момент операции, его можно исправить сразу, а действующей версией остаётся прежний проверенный файл — пусть и не самый свежий. Частично записанное состояние выглядит валидным и читается следующим запуском как источник правды; ошибка всплывёт через несколько сессий, когда уже не понять, где она возникла, и на неё успеют опереться решения.
  id: 005-state-gate-2
  fingerprint: 0014e29f
