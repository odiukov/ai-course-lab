- concept: допущения агента хранятся как состояние, потому что без них возобновлённая работа может незаметно противоречить уже сделанному
  question: Агент дописал модуль, решив по ходу, что входной список всегда отсортирован, и не проверил это. Почему такое допущение записывают в память репозитория, а не оставляют в логах прогона?
  explanation: Допущение — это условие, на котором держится уже написанный код. Тот, кто продолжает работу (человек или агент), должен его видеть, иначе добавит несортированный вход и сломает сделанное молча. Поэтому «допущения, которые сделал агент» стоят в колонке Belongs наравне с id задачи и блокерами.
  kind: choice
  options:
    - Потому что логи слишком объёмны для хранения в git
    - Потому что следующий прогон продолжит работу на том же основании и без записи может нарушить его, не заметив противоречия
    - Потому что допущение нужно для оценки качества модели при регрессионном тестировании
  correct: 1
  id: 004-memory-check-1
  fingerprint: 7a4b9d11
- concept: запись, привязанная к конкретному вендору или к моменту запуска, не переносится в другой прогон, поэтому она не состояние работы
  question: Почему специфичный для вендора идентификатор модели (например, строка конкретного провайдера с датой сборки) не относится к памяти репозитория, хотя это точный технический факт?
  explanation: Ключ — переносимость между прогонами. Всё, что верно только для одного запуска (id модели, сэмплированные завершения, трассы рассуждений), не переживает повтор; всё, что описывает саму работу, переживает.
  kind: open
  reference: Такой идентификатор описывает не работу, а исполнителя конкретного запуска. При повторном прогоне модель может смениться, быть переименована или снята с поддержки, и запись перестанет что-либо значить — продолжить по ней нечего. Состояние работы (какая задача активна, что тронуто, что блокирует, что дальше) остаётся верным независимо от того, какая модель его исполняет. Идентификатор модели полезен как диагностика конкретного прогона и живёт в телеметрии, где привязка к моменту как раз и нужна.
  id: 004-memory-check-2
  fingerprint: c6fc87b2
