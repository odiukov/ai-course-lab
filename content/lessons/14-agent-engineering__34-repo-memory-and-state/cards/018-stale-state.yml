- concept: окно блокировки записи агента после правки человеком защищает свежие ручные изменения от затирания
  question: В состояние добавлена отметка времени последней правки человеком, и любая запись агента отклоняется в течение 30 секунд после неё. Какую проблему это решает?
  explanation: 'Агент читает состояние, думает, потом пишет; правка человека, попавшая внутрь этого промежутка, будет стёрта атомарной подменой — сама подмена от потерянного обновления не защищает. Окно даёт человеческому изменению приоритет и вынуждает агента перечитать файл. Полной взаимной изоляции писателей оно не даёт: это эвристика приоритета, а не блокировка.'
  kind: choice
  options:
    - Агент, работающий по загруженному ранее снимку, не затрёт только что внесённую человеком правку своим устаревшим представлением о состоянии
    - Это ускоряет запись, потому что часть вызовов не доходит до диска
    - Это гарантирует, что человек и агент никогда не пишут в файл одновременно
