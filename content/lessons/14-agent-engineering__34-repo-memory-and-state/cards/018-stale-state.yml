- concept: 'свежесть — измерение корректности, ортогональное схеме: нужны отметка времени и срок жизни записи, проверяемые при чтении'
  question: Что именно добавляет проверка срока жизни записи поверх успешной валидации по схеме?
  explanation: 'Это два независимых вопроса. Запись «следующий шаг — удалить старый обработчик» безупречна по типам, enum и шаблонам и остаётся такой, даже когда решение отменено полгода назад. Просроченную запись нельзя выдавать агенту как действующее состояние: её либо забывают, либо помечают недостоверной, чтобы он пересобрал контекст.'
  kind: choice
  options:
    - 'Ничего нового: запись, прошедшая схему, по определению актуальна'
    - Схема отвечает, допустима ли форма записи, а срок жизни — можно ли доверять её содержанию сейчас; для этого запись несёт отметку времени, а при чтении её возраст сравнивают с допустимым
    - Срок жизни заменяет валидацию, потому что свежая запись не может быть невалидной
