- concept: закрытие сессии уничтожает не артефакты, а связь между сделанным и следующим действием
  question: Агент закончил работу, все правки лежат в репозитории, сессия закрыта. Новая сессия видит ровно те же файлы. Что реально потеряно и как это проявится?
  explanation: Артефакты переживают закрытие чата, а ход работы — нет. Без внешней записи следующая сессия строит догадки по косвенным признакам, и типовые исходы — дублирование работы либо порча готового файла.
  kind: choice
  options:
    - 'Потеряны файлы: их придётся восстанавливать из резервной копии'
    - 'Потеряна связь между сделанным и следующим действием: сессия угадывает, поэтому либо повторяет уже выполненную работу, либо переписывает готовый результат'
    - Потеряны права доступа к репозиторию, поэтому агент не может писать в файлы
  correct: 1
  id: 001-posle-chata-1
  fingerprint: ef73e052
- concept: содержимое файла не сообщает его статус, поэтому «просто прочитать файлы» не восстанавливает контекст
  question: Почему стратегия «новая сессия просто прочитает файлы репозитория» не заменяет сохранённое состояние работы? Объясни своими словами.
  explanation: Разница между «что лежит» и «в каком состоянии работа» — причина, по которой нужна отдельная запись состояния, а не только код.
  kind: open
  reference: 'Файл показывает содержимое, но не статус: готов он или черновик, проверен или нет, разрешено ли его менять. Он также не хранит отвергнутые варианты, принятые допущения, открытые блокеры и ближайшее действие. Всё это внешнее по отношению к содержимому, поэтому агенту приходится угадывать — и угадывание даёт повторную работу или разрушение готового результата.'
  id: 001-posle-chata-2
  fingerprint: d72e5eb5
