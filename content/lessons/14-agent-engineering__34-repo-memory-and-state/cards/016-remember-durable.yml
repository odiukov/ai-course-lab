- concept: 'сохранение всего подряд не бесплатно: объём записи удлиняет восстановление рабочей точки и прячет ключевые поля среди шума'
  question: Агент по завершении работы над задачей T-77 сохраняет в память репозитория полный лог диалога, все рассмотренные и отвергнутые варианты и содержимое открытых файлов. Какова главная цена такого решения?
  explanation: 'Память репозитория читается целиком в начале следующего запуска, и её объём напрямую конкурирует с полезной работой за контекст. Отвергнутые варианты особенно опасны: без пометки об отказе они выглядят как принятые решения. Ценность записи измеряется не полнотой, а скоростью выхода на следующее осмысленное действие.'
  kind: choice
  options:
    - Только расход дискового пространства, на поведение следующей сессии это не влияет
    - Следующая сессия тратит контекст и время на разбор истории, а решающие поля — активная задача, блокер и следующее действие — тонут среди шума и могут быть прочитаны неверно
    - Лог диалога нельзя сериализовать в JSON, поэтому запись сломается
  correct: 1
  id: 016-remember-durable-1
  fingerprint: 378c3846
- concept: критерий включения записи — конкретное действие, которое она позволяет выполнить следующей сессии
  question: Сформулируй практический вопрос, который стоит задать про каждую кандидатную запись перед сохранением в память репозитория, и объясни, почему запись, не проходящая эту проверку, вредна, а не просто бесполезна.
  explanation: 'Действенность — операционная форма отбора: она превращает «интересно» в «нужно для продолжения». Проверка работает и в обратную сторону — если действие названо, сразу видно, каких полей записи не хватает, чтобы его выполнить.'
  kind: open
  reference: 'Вопрос: какое конкретное действие следующая сессия сможет выполнить благодаря этой записи? Активная задача даёт точку продолжения, тронутые файлы — область работы, блокер — что чинить, допущение — чему не противоречить, следующее действие — с чего начать. Если ответа нет, запись лишь свидетельствует, что разговор состоялся. Вредна она потому, что не нейтральна: она занимает контекст, разбавляет действенные поля и создаёт иллюзию восстановленного состояния, из-за чего агент не пойдёт перепроверять реальные файлы и историю изменений.'
  id: 016-remember-durable-2
  fingerprint: 67be3d00
