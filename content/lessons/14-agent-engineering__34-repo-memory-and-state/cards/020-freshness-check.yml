- concept: 'свежая отметка времени не подтверждает истинность записи: решает сверка с проверяемым состоянием репозитория'
  question: Запись памяти создана шесть минут назад и утверждает, что задача T-88 заблокирована отсутствием доступа к тестовому стенду. В репозитории задача уже закрыта, доступ выдан. Как оценить эту запись?
  explanation: Возраст записи — только подсказка, куда посмотреть. Итоговый признак — совпадение с фактами, которые можно перепроверить прямо сейчас; свежая, но опровергнутая запись уводит следующую сессию по ложному следу.
  kind: choice
  options:
    - 'Она достоверна: отметка времени свежая'
    - 'Она недостоверна: содержание противоречит проверяемому состоянию репозитория'
    - Она достоверна, пока агент сам не перезапишет её в следующей сессии
    - Достоверность нельзя определить без сравнения с предыдущей версией файла
  correct: 1
  id: 020-freshness-check-1
  fingerprint: 2f4a8e05
- concept: правило отбраковки записи должно быть детерминированным, а не оценкой в моменте
  question: Почему решение «эта запись устарела» должно вычисляться фиксированным правилом, а не приниматься агентом заново на каждом запуске?
  explanation: Память репозитория — источник правды для следующих сессий. Её очистка должна быть таким же проверяемым кодом, как валидация схемы, а не разовым суждением.
  kind: open
  reference: 'Иначе один и тот же файл при одинаковых входных данных в разных сессиях получает разную судьбу: где-то запись остаётся, где-то исчезает, и поведение памяти нельзя ни воспроизвести, ни протестировать. Фиксированное правило (сверка с указанным источником плюс объявленный срок жизни) даёт одинаковый результат на одинаковом входе, его можно закрыть тестами и объяснить в code review, а расхождение результата сразу указывает на изменение данных, а не на настроение модели.'
  id: 020-freshness-check-2
  fingerprint: 76bcf6f9
