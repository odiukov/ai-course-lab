- concept: изменение схемы выпускается в паре со скриптом миграции для входящей версии
  question: Почему поднятие версии схемы состояния выпускают вместе со скриптом миграции, а не отдельно и позже?
  explanation: '`schema_version` полезна ровно настолько, насколько для встреченного значения существует переход. Версия без миграции превращает поле версии из контракта в блокиратор.'
  kind: open
  reference: 'Менеджер загружает файл только той версии, для которой знает переход к текущей. Если версию подняли, а миграции нет, все ранее записанные файлы становятся незагружаемыми: работа встаёт, и единственный выход — руками править состояние. Пара «новая версия + миграция для предыдущей» даёт известный маршрут для каждого файла на диске, а на версию, для которой маршрута нет, менеджер честно отказывается вместо того, чтобы истолковывать неизвестные данные догадкой.'
  id: 021-versioned-migrations-2
