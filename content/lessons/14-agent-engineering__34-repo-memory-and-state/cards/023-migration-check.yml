- concept: поддерживаемость версии определяется наличием реализованного пути миграции, а не тем, что её номер больше текущего
  question: Менеджер состояния умеет мигрировать документ версии 4 в версию 6. На загрузку приходит файл с schema_version = 9. Что он должен сделать?
  explanation: Номера версий упорядочены, но совместимость — нет. Версия 9 может переименовать или переосмыслить поля; прочитать её как 6 — догадка, а не знание. Загружаются только версии, для которых есть явный код миграции; всё остальное отклоняется.
  kind: choice
  options:
    - 'Загрузить как версию 6: номер выше, значит формат новее и заведомо совместим'
    - 'Отказаться загружать: пути с версии 9 не реализовано, её контракт менеджеру неизвестен'
    - Прогнать миграцию 4→6 поверх документа и принять результат, если он прошёл схему версии 6
  correct: 1
  id: 023-migration-check-1
  fingerprint: 2ae38fa0
- concept: поле версии читается и сверяется раньше интерпретации остальных полей, потому что смысл полей задаётся версией контракта
  question: Почему менеджер состояния сверяет schema_version до того, как начнёт разбирать остальные поля документа?
  explanation: Версия — не обычное поле, а ключ к прочтению всех остальных. Сверка первой превращает несовместимость в отказ на границе загрузки, а не в набор молча неверно понятых значений.
  kind: open
  reference: 'Значение полей определено контрактом версии: одно и то же имя поля в версии 6 и версии 9 может означать разное (строка вместо списка, срок жизни в секундах вместо ISO-даты). Пока версия не сверена, любая интерпретация payload держится на предположении. Поэтому порядок такой: прочитать schema_version, решить, есть ли реализованный путь для неё, и только потом трогать данные — либо мигрировать, либо отказать. Проверка после разбора уже поздна: часть решений принята по чужому контракту.'
  id: 023-migration-check-2
  fingerprint: a66d0814
- concept: 'поле версии описывает раскладку данных, а не задаёт её: правка версии вручную обходит проверку, не приводя документ к контракту'
  question: Файл состояния имеет schema_version = 9, менеджер поддерживает 6. Инженер вручную меняет поле на 6, и файл загружается без ошибок. В чём проблема?
  explanation: 'schema_version — отчёт о том, по какому контракту записаны данные, а не команда трактовать их так. Правка метки снимает единственный барьер, ничего не преобразовав: расхождения, которые схема не ловит (смысл значений, единицы, необязательные поля), поедут дальше как тихая порча. Приводит документ к версии 6 только скрипт миграции.'
  kind: choice
  options:
    - 'Ни в чём: раз схема версии 6 приняла документ, он валиден'
    - Данные остались в раскладке версии 9, изменена только метка; проверка версии обойдена, а миграция не выполнена
    - Проблема только в том, что теряется история версий файла
  correct: 1
  id: 023-migration-check-3
  fingerprint: 1db96df8
