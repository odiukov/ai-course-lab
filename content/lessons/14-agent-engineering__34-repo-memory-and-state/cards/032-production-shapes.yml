- concept: 'явная схема состояния окупается в момент отказа бэкенда: состояние можно прочитать и починить вручную, не разбираясь во внутреннем устройстве хранилища'
  question: Бэкенд сам сохраняет и восстанавливает состояние агента. Зачем всё равно держать для этого состояния собственную явную схему? Объясни своими словами.
  explanation: 'Именно поэтому схема пишется отдельно от хранилища: она переживает смену бэкенда и остаётся единственным описанием, пригодным для ручного разбора инцидента.'
  kind: open
  reference: 'Схема нужна ровно в тот момент, когда бэкенд ляжет или отдаст мусор: состояние придётся открыть и прочитать руками, и без документации конкретного хранилища должно быть понятно, какие поля есть, что они означают и какие значения допустимы. Второе: схема — единица переноса. С ней состояние перекладывается в другое хранилище без изменения смысла, а адаптер отвечает только за перевод в механизм платформы. Без явного контракта смысл полей живёт в коде бэкенда, и каждая миграция хранилища превращается в переизобретение формата.'
