- concept: стоимость каждой правки состояния определяется размером всего документа, поэтому вложенный артефакт умножает объём перезаписи
  question: Агент держит результат объёмом 512 МБ прямо внутри документа состояния. За прогон он 7 раз меняет короткое поле статуса, и каждое изменение выполняется как чтение всего документа, правка и полная атомарная перезапись. Сколько мегабайт данных будет записано на диск суммарно ради этих правок статуса?
  explanation: 'Атомарная запись всегда пишет документ целиком: 512 × 7 = 3584 МБ ради нескольких десятков байт смысла. Вынос результата в отдельный файл и хранение в состоянии только пути делает те же 7 правок записью крошечного снимка.'
  kind: numeric
  answer: 3584
  tolerance: 1
  id: 029-artifacts-apart-1
  fingerprint: 14cb25a5
- concept: 'ссылка на артефакт вводит класс отказа, невидимый для схемы: документ остаётся валидным, а адрес — недействительным'
  question: Состояние хранит путь к сгенерированному отчёту. Кто-то переместил файл в другой каталог, состояние не трогали. Что произойдёт при следующем возобновлении?
  explanation: 'Схема проверяет форму значения, а не то, что по адресу что-то лежит. Поэтому путь к артефакту — часть договорённости репозитория: его нельзя менять в обход состояния, иначе получите валидный документ, ведущий в пустоту.'
  kind: choice
  options:
    - Загрузка состояния упадёт на валидации, потому что схема проверяет существование файла по пути
    - Состояние загрузится успешно — путь остаётся строкой правильного формата, — а отказ произойдёт позже, при попытке открыть артефакт
    - Менеджер состояния восстановит артефакт из документа, так как копия содержимого хранится рядом с путём
    - Атомарная запись откатит перемещение файла, потому что путь входит в зафиксированный снимок
