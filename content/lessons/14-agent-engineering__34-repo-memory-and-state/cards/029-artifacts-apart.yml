- concept: 'вынесение артефакта наружу делает чтение большого файла отложенным: возобновление тратит ввод-вывод только на снимок'
  question: Объясни своими словами, что даёт возобновлению работы хранение больших результатов вне документа состояния — помимо экономии на записи.
  explanation: Состояние отвечает на вопрос «где продолжить», а не тащит с собой весь результат. Разделение делает и запись, и чтение пропорциональными размеру решения, а не размеру данных; артефакт растёт независимо, хоть до гигабайтов в объектном хранилище.
  kind: open
  reference: 'Возобновление начинается с чтения состояния, а состояние маленькое: его быстро прочитать, проверить схемой и разобрать. Большой артефакт при этом не загружается вовсе — он открывается только в тот момент и только той задачей, которой действительно нужно его содержимое, и может не понадобиться совсем, если следующий шаг — отправка ссылки или смена статуса. Если же артефакт вложен внутрь документа, каждое возобновление обязано прочитать и разобрать его целиком, чтобы добраться до пары полей «где продолжить».'
  id: 029-artifacts-apart-3
