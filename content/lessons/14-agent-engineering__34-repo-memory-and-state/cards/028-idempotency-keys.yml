- concept: локальные гарантии записи не распространяются на уже произошедший внешний эффект
  question: Атомарная запись гарантирует, что файл состояния никогда не окажется полузаписанным. Почему этой гарантии недостаточно для агента, который отправляет письма? Объясни своими словами.
  explanation: Транзакция агента и транзакция внешнего сервиса — разные транзакции. Их согласуют ключом и журналом вызовов, а не свойствами записи на диск.
  kind: open
  reference: 'Атомарность действует только внутри файловой системы: она либо оставляет старый файл, либо кладёт новый целиком. Но откат локального состояния к прежней версии не отменяет письмо, которое уже ушло. После падения агент видит старый снимок «письмо не отправлено», хотя во внешнем мире эффект есть, и при повторе создаст второй. Границу за пределами процесса держит не запись, а ключ идемпотентности: внешний сервис по ключу распознаёт повтор и возвращает прежний результат вместо нового действия.'
  id: 028-idempotency-keys-3
  fingerprint: 069f8561
