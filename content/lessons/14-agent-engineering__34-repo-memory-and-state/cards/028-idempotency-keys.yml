- concept: идентификатор вызова журналируется до выполнения вызова, потому что опасно именно окно между внешним эффектом и его фиксацией
  question: Расставь шаги безопасного выполнения вызова с внешним эффектом (отправка письма, платёж, вставка строки) в правильном порядке.
  explanation: 'Если ключ пишется после вызова, падение между эффектом и записью не оставляет следа: восстановление считает вызов несостоявшимся и повторяет его. Запись до вызова создаёт худший случай «ключ есть, результата нет» — он безопасен, потому что заставляет выяснить исход, а не создавать эффект заново.'
  kind: order
  items:
    - Сформировать уникальный ключ вызова
    - Дописать ключ в журнал отложенных вызовов на диске
    - Выполнить вызов инструмента, передав ему тот же ключ
    - Сохранить полученный результат рядом с ключом
    - Зафиксировать обновлённое состояние агента
  id: 028-idempotency-keys-1
  fingerprint: d98a7261
- concept: защита ключом нужна вызовам, меняющим внешний мир; повторяемые без последствий чтения в ней не нуждаются
  question: Какому из вызовов ключ идемпотентности нужен обязательно?
  explanation: Повторное чтение даёт тот же ответ и никому не пишет — его можно перезапускать бесплатно. Списание, письмо, вставка строки и загрузка файла при повторе создают второй эффект, поэтому внешний сервис должен уметь узнать ключ и вернуть прежний результат вместо нового действия.
  kind: choice
  options:
    - Чтению конфигурационного файла из репозитория
    - Запросу списка открытых задач из трекера
    - Списанию средств по счёту `payout-9317`
