- concept: перезагрузка в круге проверки идёт тем же публичным путём загрузки, которым воспользуется следующая сессия
  question: Демонстрация после сохранения перечитывает состояние через внутреннюю вспомогательную функцию, которая просто делает `json.loads` без проверки схемы. Что именно перестаёт проверяться?
  explanation: Круг замыкается лишь тогда, когда испытан тот же маршрут, что и при возобновлении. Короткий внутренний путь пропускает валидацию и потому не докажет, что завтрашний запуск примет этот файл.
  kind: choice
  options:
    - 'Ничего важного: JSON разобран, значит файл в порядке'
    - 'Путь, которым реально пойдёт следующая сессия: разбор вместе с валидацией и отказом при нарушении контракта'
    - Только скорость чтения файла
  correct: 1
  id: 026-round-trip-1
  fingerprint: 6a3d7a41
- concept: после перезагрузки сравнивается весь ожидаемый снимок, потому что правка одного поля может сопровождаться потерей соседних
  question: Задаче `T-77` меняют статус на `done`, сохраняют состояние, перезагружают и убеждаются, что статус равен `done`. Проверка признана успешной. В чём слабость такой проверки?
  explanation: Изменение и потеря происходят в одной операции записи. Схема подтвердит, что документ допустим, но обязательные поля могли уцелеть при затирании остального содержимого. Сравнение целого снимка ловит побочный ущерб, точечная проверка — нет.
  kind: choice
  options:
    - Она подтверждает только изменённое поле и пропустит исчезнувший срок, потерянный идентификатор или пропавшую соседнюю задачу
    - 'Она слишком строгая: достаточно было проверить, что файл существует'
    - Она бесполезна, потому что статус всё равно проверит схема
  correct: 0
  id: 026-round-trip-2
  fingerprint: ebaf1b63
- concept: второй круг доказывает, что загруженный снимок пригоден как основа следующего изменения, а не только читается один раз
  question: Почему демонстрация повторяет цикл «изменить — сохранить — перезагрузить — сравнить» дважды, а не ограничивается одним проходом? Объясни своими словами.
  explanation: Возобновляемость — свойство цепочки, а не единичной записи. Файл, прочитанный один раз, но непригодный для следующего обновления, всё равно обрывает работу.
  kind: open
  reference: 'Один проход доказывает лишь то, что записанный файл удалось прочитать. Второй проход начинается уже с загруженного с диска объекта: он показывает, что этот объект годится как вход для новой правки и новой фиксации. Так проверяется непрерывность — состояние переживает не одну передачу, а цепочку сессий. Ошибки вроде потери поля, которое нужно только для следующего обновления, или несовместимости формата после круга проявляются именно на втором ходе.'
  id: 026-round-trip-3
  fingerprint: e34a71b5
