- concept: минимальный состав памяти репозитория, достаточный для продолжения работы
  question: Перечисли, какие записи составляют память репозитория для агента, и объясни, зачем нужна каждая.
  explanation: Каждое поле сопоставимо с кодом и проверяемо; вместе они дают продолжение работы без чтения истории переписки.
  kind: open
  reference: Id активной задачи — точка входа, с которой продолжают. Файлы, затронутые в сессии, — что уже трогали и что нельзя переписывать вслепую. Допущения агента — на чём держится сделанное, чтобы можно было их оспорить. Открытые блокеры — почему работа встала. Следующее действие — что делать первым, без реконструкции хода мысли.
