<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>У состояния есть только два выхода</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f6f7fb;
      --canvas: #ffffff;
      --panel: #f8fafc;
      --panel-stroke: #dbe2ea;
      --text: #172033;
      --muted: #637083;
      --line: #66758a;
      --node: #ffffff;
      --node-stroke: #aeb9c7;
      --manager: #eef3ff;
      --manager-stroke: #6584d8;
      --decision: #fff8df;
      --decision-stroke: #c28a17;
      --success: #edf9f1;
      --success-stroke: #2c8a50;
      --success-text: #176637;
      --reject: #fff0f0;
      --reject-stroke: #c84a4a;
      --reject-text: #a52e2e;
      --footer: #edf2f7;
      --focus: #315fb5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #11151d;
        --canvas: #171c25;
        --panel: #1c2330;
        --panel-stroke: #354052;
        --text: #eef3fb;
        --muted: #a7b2c2;
        --line: #91a0b6;
        --node: #202836;
        --node-stroke: #536176;
        --manager: #202d4a;
        --manager-stroke: #7899ec;
        --decision: #3b321b;
        --decision-stroke: #ddb34f;
        --success: #1c3427;
        --success-stroke: #55b979;
        --success-text: #8be0a7;
        --reject: #3b2325;
        --reject-stroke: #e16d6d;
        --reject-text: #ffaaaa;
        --footer: #222b39;
        --focus: #9bb7ff;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    body {
      padding: 16px;
    }

    figure {
      width: 100%;
      margin: 0 auto;
      overflow: hidden;
      background: var(--canvas);
      border: 1px solid var(--panel-stroke);
      border-radius: 18px;
    }

    figcaption {
      padding: 20px 24px 12px;
      background: var(--canvas);
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--focus);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 3vw, 30px);
      line-height: 1.15;
      letter-spacing: -0.025em;
    }

    .subtitle {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 410px;
      background: var(--canvas);
    }

    .panel {
      fill: var(--panel);
      stroke: var(--panel-stroke);
      stroke-width: 1.5px;
    }

    .lane-success {
      fill: var(--success);
      stroke: none;
    }

    .lane-reject {
      fill: var(--reject);
      stroke: none;
    }

    .edge {
      fill: none;
      stroke: var(--line);
      stroke-width: 3px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .edge-success {
      stroke: var(--success-stroke);
    }

    .edge-reject {
      stroke: var(--reject-stroke);
    }

    .arrow {
      fill: var(--line);
    }

    .arrow-success {
      fill: var(--success-stroke);
    }

    .arrow-reject {
      fill: var(--reject-stroke);
    }

    .node {
      fill: var(--node);
      stroke: var(--node-stroke);
      stroke-width: 2px;
    }

    .node-manager {
      fill: var(--manager);
      stroke: var(--manager-stroke);
    }

    .node-success {
      fill: var(--success);
      stroke: var(--success-stroke);
    }

    .node-reject {
      fill: var(--reject);
      stroke: var(--reject-stroke);
    }

    .decision {
      fill: var(--decision);
      stroke: var(--decision-stroke);
      stroke-width: 2.5px;
      stroke-linejoin: round;
    }

    text {
      fill: var(--text);
      font-family: inherit;
      pointer-events: none;
    }

    .section-label {
      fill: var(--muted);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0.1em;
    }

    .node-title {
      font-size: 17px;
      font-weight: 750;
    }

    .node-subtitle {
      fill: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .code-label {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 16px;
      font-weight: 750;
    }

    .decision-label {
      font-size: 17px;
      font-weight: 800;
    }

    .branch-label {
      font-size: 13px;
      font-weight: 850;
      letter-spacing: 0.08em;
    }

    .branch-yes,
    .success-text {
      fill: var(--success-text);
    }

    .branch-no,
    .reject-text {
      fill: var(--reject-text);
    }

    .footer-bar {
      fill: var(--reject-stroke);
    }

    .footer-text {
      fill: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .fallback {
      margin: 16px 24px 24px;
      padding: 16px;
      color: var(--text);
      background: var(--footer);
      border-left: 4px solid var(--reject-stroke);
      font-size: 15px;
      line-height: 1.5;
    }

    [hidden] {
      display: none;
    }

    noscript .fallback {
      display: block;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-heading">
    <figcaption>
      <p class="eyebrow">Сохранение состояния</p>
      <h1 id="diagram-heading">У состояния есть только два выхода</h1>
      <p class="subtitle">
        Новая версия либо проходит проверку целиком, либо целиком отклоняется.
      </p>
    </figcaption>

    <div id="stage">
      <svg
        id="diagram"
        viewBox="0 0 1180 380"
        width="1180"
        height="380"
        preserveAspectRatio="xMidYMid meet"
        role="img"
        aria-labelledby="svg-title svg-description"
      >
        <title id="svg-title">Два исхода проверки состояния</title>
        <desc id="svg-description">
          Цикл агента передаёт состояние в StateManager, затем в схему и проверку.
          Допустимое состояние записывается в agent_state.json, недопустимое
          отклоняется без записи.
        </desc>
      </svg>

      <p id="fallback" class="fallback" hidden>
        Схема должна была показать поток: Цикл агента → StateManager → Схема →
        «Допустимо?». Ответ «да» ведёт к записи в agent_state.json, ответ «нет» —
        к полному отказу без записи и явному исключению.
      </p>

      <noscript>
        <style>
          #diagram { display: none; }
        </style>
        <p class="fallback">
          Схема: Цикл агента → StateManager → Схема → «Допустимо?». «Да» —
          запись в agent_state.json; «нет» — отказ без записи.
        </p>
      </noscript>
    </div>
  </figure>

  <script>
    const diagramData = {
      zero: 0,
      panels: [
        { x: 25, y: 38, w: 1130, h: 282, r: 18, className: "panel" },
        { x: 850, y: 58, w: 305, h: 112, r: 14, className: "lane-success" },
        { x: 850, y: 208, w: 305, h: 112, r: 14, className: "lane-reject" }
      ],
      nodes: [
        {
          x: 40, y: 130, w: 150, h: 72, r: 12,
          className: "node",
          labels: [
            { x: 115, y: 160, text: "Цикл агента", className: "node-title", anchor: "middle" },
            { x: 115, y: 182, text: "новая версия", className: "node-subtitle", anchor: "middle" }
          ]
        },
        {
          x: 235, y: 130, w: 180, h: 72, r: 12,
          className: "node node-manager",
          labels: [
            { x: 325, y: 160, text: "StateManager", className: "code-label", anchor: "middle" },
            { x: 325, y: 182, text: "сохраняет целиком", className: "node-subtitle", anchor: "middle" }
          ]
        },
        {
          x: 460, y: 130, w: 160, h: 72, r: 12,
          className: "node",
          labels: [
            { x: 540, y: 160, text: "Схема", className: "node-title", anchor: "middle" },
            { x: 540, y: 182, text: "проверяет контракт", className: "node-subtitle", anchor: "middle" }
          ]
        },
        {
          x: 900, y: 76, w: 235, h: 80, r: 12,
          className: "node node-success",
          labels: [
            { x: 1018, y: 108, text: "agent_state.json", className: "code-label success-text", anchor: "middle" },
            { x: 1018, y: 134, text: "новая версия записана", className: "node-subtitle success-text", anchor: "middle" }
          ]
        },
        {
          x: 900, y: 226, w: 235, h: 80, r: 12,
          className: "node node-reject",
          labels: [
            { x: 1018, y: 258, text: "Отказ без записи", className: "node-title reject-text", anchor: "middle" },
            { x: 1018, y: 284, text: "исключение сообщено явно", className: "node-subtitle reject-text", anchor: "middle" }
          ]
        }
      ],
      decision: {
        points: [
          { x: 730, y: 108 },
          { x: 810, y: 166 },
          { x: 730, y: 224 },
          { x: 650, y: 166 }
        ],
        labels: [
          { x: 730, y: 161, text: "Допустимо?", className: "decision-label", anchor: "middle" },
          { x: 730, y: 184, text: "проверка целиком", className: "node-subtitle", anchor: "middle" }
        ]
      },
      edges: [
        {
          points: [{ x: 190, y: 166 }, { x: 223, y: 166 }],
          arrow: [{ x: 235, y: 166 }, { x: 223, y: 158 }, { x: 223, y: 174 }],
          edgeClass: "edge",
          arrowClass: "arrow"
        },
        {
          points: [{ x: 415, y: 166 }, { x: 448, y: 166 }],
          arrow: [{ x: 460, y: 166 }, { x: 448, y: 158 }, { x: 448, y: 174 }],
          edgeClass: "edge",
          arrowClass: "arrow"
        },
        {
          points: [{ x: 620, y: 166 }, { x: 638, y: 166 }],
          arrow: [{ x: 650, y: 166 }, { x: 638, y: 158 }, { x: 638, y: 174 }],
          edgeClass: "edge",
          arrowClass: "arrow"
        },
        {
          points: [
            { x: 810, y: 166 },
            { x: 840, y: 166 },
            { x: 840, y: 116 },
            { x: 888, y: 116 }
          ],
          arrow: [{ x: 900, y: 116 }, { x: 888, y: 108 }, { x: 888, y: 124 }],
          edgeClass: "edge edge-success",
          arrowClass: "arrow arrow-success"
        },
        {
          points: [
            { x: 730, y: 224 },
            { x: 730, y: 266 },
            { x: 888, y: 266 }
          ],
          arrow: [{ x: 900, y: 266 }, { x: 888, y: 258 }, { x: 888, y: 274 }],
          edgeClass: "edge edge-reject",
          arrowClass: "arrow arrow-reject"
        }
      ],
      freeLabels: [
        { x: 40, y: 68, text: "ЕДИНЫЙ ПОТОК ДО ПРОВЕРКИ", className: "section-label", anchor: "start" },
        { x: 730, y: 68, text: "РОВНО ДВА ИСХОДА", className: "section-label", anchor: "middle" },
        { x: 821, y: 146, text: "ДА", className: "branch-label branch-yes", anchor: "start" },
        { x: 750, y: 250, text: "НЕТ", className: "branch-label branch-no", anchor: "start" }
      ],
      footer: {
        bar: { x: 40, y: 341, w: 6, h: 24, r: 3 },
        label: {
          x: 59,
          y: 358,
          text: "При отказе прежний agent_state.json остаётся действующей проверенной версией.",
          className: "footer-text",
          anchor: "start"
        }
      }
    };
    const origin = Object.freeze({ x: 0, y: 0 });
    const scale = Object.freeze({ x: 1, y: 1 });
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const namespace = svg.namespaceURI;

      const make = (name, className) => {
        const item = document.createElementNS(namespace, name);
        if (className) item.setAttribute("class", className);
        return item;
      };

      const addRect = (parent, item, className) => {
        const rect = make("rect", className);
        rect.setAttribute("x", sx(item.x));
        rect.setAttribute("y", sy(item.y));
        rect.setAttribute("width", sx(item.w) - sx(diagramData.zero));
        rect.setAttribute("height", sy(item.h) - sy(diagramData.zero));
        rect.setAttribute("rx", sx(item.r) - sx(diagramData.zero));
        rect.setAttribute("ry", sy(item.r) - sy(diagramData.zero));
        parent.appendChild(rect);
        return rect;
      };

      const addPolygon = (parent, points, className, tagName) => {
        const shape = make(tagName, className);
        shape.setAttribute(
          "points",
          points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" ")
        );
        parent.appendChild(shape);
        return shape;
      };

      const addText = (parent, label) => {
        const text = make("text", label.className);
        text.setAttribute("x", sx(label.x));
        text.setAttribute("y", sy(label.y));
        text.setAttribute("text-anchor", label.anchor);
        text.textContent = label.text;
        parent.appendChild(text);
        return text;
      };

      const panelLayer = make("g", "panel-layer");
      const edgeLayer = make("g", "edge-layer");
      const nodeLayer = make("g", "node-layer");
      const textLayer = make("g", "text-layer");
      svg.append(panelLayer, edgeLayer, nodeLayer, textLayer);

      for (const panel of diagramData.panels) {
        addRect(panelLayer, panel, panel.className);
      }

      for (const edge of diagramData.edges) {
        addPolygon(edgeLayer, edge.points, edge.edgeClass, "polyline");
        addPolygon(edgeLayer, edge.arrow, edge.arrowClass, "polygon");
      }

      for (const node of diagramData.nodes) {
        addRect(nodeLayer, node, node.className);
        for (const label of node.labels) addText(textLayer, label);
      }

      addPolygon(
        nodeLayer,
        diagramData.decision.points,
        "decision",
        "polygon"
      );

      for (const label of diagramData.decision.labels) {
        addText(textLayer, label);
      }

      for (const label of diagramData.freeLabels) {
        addText(textLayer, label);
      }

      addRect(
        nodeLayer,
        diagramData.footer.bar,
        "footer-bar"
      );
      addText(textLayer, diagramData.footer.label);
      fallback.hidden = true;
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      if (svg) svg.hidden = true;
      if (fallback) fallback.hidden = false;
    }
  </script>
</body>
</html>
