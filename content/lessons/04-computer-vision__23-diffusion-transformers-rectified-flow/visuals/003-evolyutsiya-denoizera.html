<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Четыре поколения денойзера</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f8fafc;
    --ink: #172033;
    --muted: #526075;
    --line: #5f6b7d;
    --panel: #ffffff;
    --unet-bg: #eef1f5;
    --unet-block: #d7dde5;
    --unet-accent: #566274;
    --dit-bg: #eaf3ff;
    --dit-block: #cfe3ff;
    --dit-accent: #2467c8;
    --mm-bg: #fff6dc;
    --mm-block: #ffe5a3;
    --mm-accent: #b96908;
    --flux-bg: #e9f9ee;
    --flux-block: #c9efd5;
    --flux-accent: #168449;
    --shared: #f0dcff;
    --shared-accent: #7b3eb1;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #111622;
      --ink: #edf2fb;
      --muted: #bac5d6;
      --line: #aeb9c9;
      --panel: #171e2b;
      --unet-bg: #202936;
      --unet-block: #344152;
      --unet-accent: #b9c5d5;
      --dit-bg: #172a43;
      --dit-block: #23456e;
      --dit-accent: #82b8ff;
      --mm-bg: #382b16;
      --mm-block: #59421c;
      --mm-accent: #ffc568;
      --flux-bg: #153326;
      --flux-block: #20543a;
      --flux-accent: #75dda0;
      --shared: #37254a;
      --shared-accent: #d4a5ff;
    }
  }

  html, body {
    background: var(--page);
    color: var(--ink);
  }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  main, figure {
    background: var(--page);
  }

  h1 {
    font-size: 22px;
    font-weight: bold;
    text-align: center;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 520px;
    background: var(--page);
    border: 1px solid var(--line);
  }

  .card {
    stroke-width: 2px;
  }

  .card.unet { fill: var(--unet-bg); stroke: var(--unet-accent); }
  .card.dit { fill: var(--dit-bg); stroke: var(--dit-accent); }
  .card.mmdit { fill: var(--mm-bg); stroke: var(--mm-accent); }
  .card.flux { fill: var(--flux-bg); stroke: var(--flux-accent); }

  .block {
    stroke-width: 2px;
  }

  .block.unet { fill: var(--unet-block); stroke: var(--unet-accent); }
  .block.dit { fill: var(--dit-block); stroke: var(--dit-accent); }
  .block.mmdit { fill: var(--mm-block); stroke: var(--mm-accent); }
  .block.flux { fill: var(--flux-block); stroke: var(--flux-accent); }
  .block.shared { fill: var(--shared); stroke: var(--shared-accent); }

  .flow {
    fill: none;
    stroke: var(--line);
    stroke-width: 3px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .separator {
    stroke: var(--line);
    stroke-width: 1px;
  }

  .merge {
    fill: var(--flux-accent);
    stroke: var(--page);
    stroke-width: 2px;
  }

  text {
    fill: var(--ink);
    font-size: 15px;
  }

  .section-title {
    font-size: 20px;
    font-weight: bold;
  }

  .year {
    fill: var(--muted);
    font-size: 13px;
    font-weight: bold;
  }

  .block-title {
    font-size: 15px;
    font-weight: bold;
  }

  .small {
    fill: var(--muted);
    font-size: 12px;
  }

  .caption {
    fill: var(--ink);
    font-size: 14px;
    font-weight: bold;
  }

  .fallback {
    fill: var(--ink);
    font-size: 18px;
    font-weight: bold;
  }
</style>
</head>
<body>
<main>
  <h1>Четыре поколения денойзера</h1>
  <figure>
    <svg id="scheme" viewBox="0 0 1200 440" width="1200" height="440"
         preserveAspectRatio="xMidYMid meet"
         role="img" aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Эволюция архитектуры денойзера от U-Net до FLUX</title>
      <desc id="svg-desc">U-Net использует три последовательные стадии, DiT — патчи и трансформер, MMDiT — два потока с совместным вниманием, а FLUX переводит два потока в один.</desc>
    </svg>
  </figure>
</main>

<script>
const diagram = [
  {
    marker: {
      width: 12, height: 12, refX: 10, refY: 6,
      viewX: 0, viewY: 0, viewW: 12, viewH: 12,
      points: [[1, 1], [11, 6], [1, 11]]
    },
    fallback: { x: 600, y: 205 },
    fallbackText: [
      "Схема должна была показать:",
      "U-Net → DiT → MMDiT → FLUX",
      "от последовательных стадий к двум потокам и их объединению"
    ],
    fallbackLines: [
      { x: 600, y: 180 },
      { x: 600, y: 210 },
      { x: 600, y: 240 }
    ],
    flows: [
      [[74, 205], [101, 205]],
      [[184, 205], [211, 205]],
      [[369, 205], [396, 205]],
      [[479, 205], [506, 205]],
      [[668, 153], [715, 153], [715, 190], [744, 190]],
      [[668, 257], [715, 257], [715, 220], [744, 220]],
      [[1000, 153], [1032, 153], [1032, 205], [1051, 205]],
      [[1000, 257], [1032, 257], [1032, 205], [1051, 205]],
      [[1063, 205], [1080, 205]]
    ]
  },
  {
    kind: "unet",
    frame: { x: 18, y: 20, w: 276, h: 392, rx: 14 },
    title: { text: "U-Net", x: 156, y: 57 },
    year: { text: "2020", x: 156, y: 80 },
    blocks: [
      {
        x: 36, y: 151, w: 38, h: 108, rx: 8, kind: "unet",
        labels: [
          { text: "Энкодер", x: 55, y: 193, class: "block-title" },
          { text: "свёртки", x: 55, y: 217, class: "small" }
        ]
      },
      {
        x: 101, y: 171, w: 83, h: 68, rx: 8, kind: "unet",
        labels: [
          { text: "Узкое", x: 142, y: 198, class: "block-title" },
          { text: "место", x: 142, y: 220, class: "small" }
        ]
      },
      {
        x: 211, y: 151, w: 65, h: 108, rx: 8, kind: "unet",
        labels: [
          { text: "Декодер", x: 243, y: 193, class: "block-title" },
          { text: "свёртки", x: 243, y: 217, class: "small" }
        ]
      }
    ],
    separators: [
      { x1: 36, y1: 302, x2: 276, y2: 302 }
    ],
    notes: [
      { text: "энкодер → узкое место → декодер", x: 156, y: 340, class: "caption" },
      { text: "Три последовательные части", x: 156, y: 372, class: "small" }
    ]
  },
  {
    kind: "dit",
    frame: { x: 312, y: 20, w: 276, h: 392, rx: 14 },
    title: { text: "DiT", x: 450, y: 57 },
    year: { text: "2023", x: 450, y: 80 },
    blocks: [
      {
        x: 330, y: 165, w: 39, h: 80, rx: 8, kind: "dit",
        labels: [
          { text: "Патчи", x: 349, y: 199, class: "block-title" },
          { text: "вход", x: 349, y: 220, class: "small" }
        ]
      },
      {
        x: 396, y: 145, w: 83, h: 120, rx: 8, kind: "dit",
        labels: [
          { text: "Транс-", x: 437, y: 190, class: "block-title" },
          { text: "формер", x: 437, y: 212, class: "block-title" },
          { text: "общий контекст", x: 437, y: 238, class: "small" }
        ]
      },
      {
        x: 506, y: 165, w: 64, h: 80, rx: 8, kind: "dit",
        labels: [
          { text: "Сборка", x: 538, y: 199, class: "block-title" },
          { text: "обратно", x: 538, y: 220, class: "small" }
        ]
      }
    ],
    separators: [
      { x1: 330, y1: 302, x2: 570, y2: 302 }
    ],
    notes: [
      { text: "патчи → трансформер → сборка", x: 450, y: 340, class: "caption" },
      { text: "Каждый участок видит остальные", x: 450, y: 372, class: "small" }
    ]
  },
  {
    kind: "mmdit",
    frame: { x: 606, y: 20, w: 276, h: 392, rx: 14 },
    title: { text: "MMDiT", x: 744, y: 57 },
    year: { text: "SD3 · 2024", x: 744, y: 80 },
    blocks: [
      {
        x: 624, y: 125, w: 44, h: 56, rx: 8, kind: "mmdit",
        labels: [
          { text: "Текст", x: 646, y: 149, class: "block-title" },
          { text: "свои веса", x: 646, y: 168, class: "small" }
        ]
      },
      {
        x: 624, y: 229, w: 44, h: 56, rx: 8, kind: "mmdit",
        labels: [
          { text: "Образ", x: 646, y: 253, class: "block-title" },
          { text: "свои веса", x: 646, y: 272, class: "small" }
        ]
      },
      {
        x: 744, y: 146, w: 120, h: 118, rx: 10, kind: "shared",
        labels: [
          { text: "Совместное", x: 804, y: 188, class: "block-title" },
          { text: "внимание", x: 804, y: 211, class: "block-title" },
          { text: "потоки сверяются", x: 804, y: 239, class: "small" }
        ]
      }
    ],
    separators: [
      { x1: 624, y1: 302, x2: 864, y2: 302 }
    ],
    notes: [
      { text: "Два потока, разные веса", x: 744, y: 340, class: "caption" },
      { text: "Но внимание у них общее", x: 744, y: 372, class: "small" }
    ]
  },
  {
    kind: "flux",
    frame: { x: 900, y: 20, w: 282, h: 392, rx: 14 },
    title: { text: "FLUX", x: 1041, y: 57 },
    year: { text: "2024", x: 1041, y: 80 },
    blocks: [
      {
        x: 918, y: 125, w: 82, h: 56, rx: 8, kind: "flux",
        labels: [
          { text: "Текстовый", x: 959, y: 149, class: "block-title" },
          { text: "поток", x: 959, y: 169, class: "small" }
        ]
      },
      {
        x: 918, y: 229, w: 82, h: 56, rx: 8, kind: "flux",
        labels: [
          { text: "Визуальный", x: 959, y: 253, class: "block-title" },
          { text: "поток", x: 959, y: 273, class: "small" }
        ]
      },
      {
        x: 1080, y: 158, w: 84, h: 94, rx: 10, kind: "shared",
        labels: [
          { text: "Один поток", x: 1122, y: 193, class: "block-title" },
          { text: "общие веса", x: 1122, y: 217, class: "small" },
          { text: "вместе", x: 1122, y: 236, class: "small" }
        ]
      }
    ],
    merge: { cx: 1057, cy: 205, r: 8 },
    separators: [
      { x1: 918, y1: 302, x2: 1164, y2: 302 }
    ],
    notes: [
      { text: "сначала раздельно → затем вместе", x: 1041, y: 340, class: "caption" },
      { text: "Меньше дублирования вычислений", x: 1041, y: 372, class: "small" }
    ]
  }
];

const origin = { x: 0, y: 0 };
const scale = { x: 1, y: 1 };
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const svg = document.getElementById("scheme");
  const namespace = "http://www.w3.org/2000/svg";
  const [settings, ...cards] = diagram;

  function make(name, attributes, parent) {
    const node = document.createElementNS(namespace, name);
    for (const [key, value] of Object.entries(attributes || {})) {
      node.setAttribute(key, value);
    }
    (parent || svg).appendChild(node);
    return node;
  }

  function drawText(item, parent) {
    const node = make("text", {
      x: sx(item.x),
      y: sy(item.y),
      "text-anchor": item.anchor || "middle",
      class: item.class || ""
    }, parent);
    node.textContent = item.text;
    return node;
  }

  function drawBlock(item, parent) {
    make("rect", {
      x: sx(item.x),
      y: sy(item.y),
      width: sx(item.w) - sx(origin.x),
      height: sy(item.h) - sy(origin.y),
      rx: sx(item.rx) - sx(origin.x),
      class: "block " + item.kind
    }, parent);
    for (const label of item.labels) drawText(label, parent);
  }

  const defs = make("defs");
  const marker = make("marker", {
    id: "arrow",
    markerWidth: sx(settings.marker.width) - sx(origin.x),
    markerHeight: sy(settings.marker.height) - sy(origin.y),
    refX: sx(settings.marker.refX),
    refY: sy(settings.marker.refY),
    viewBox: [
      sx(settings.marker.viewX),
      sy(settings.marker.viewY),
      sx(settings.marker.viewW) - sx(origin.x),
      sy(settings.marker.viewH) - sy(origin.y)
    ].join(" "),
    orient: "auto",
    markerUnits: "userSpaceOnUse"
  }, defs);

  make("polygon", {
    points: settings.marker.points.map(([x, y]) => sx(x) + "," + sy(y)).join(" "),
    fill: "var(--line)"
  }, marker);

  for (const card of cards) {
    const group = make("g", { "aria-label": card.title.text });

    make("rect", {
      x: sx(card.frame.x),
      y: sy(card.frame.y),
      width: sx(card.frame.w) - sx(origin.x),
      height: sy(card.frame.h) - sy(origin.y),
      rx: sx(card.frame.rx) - sx(origin.x),
      class: "card " + card.kind
    }, group);

    drawText({ ...card.title, class: "section-title" }, group);
    drawText({ ...card.year, class: "year" }, group);

    for (const block of card.blocks) drawBlock(block, group);

    if (card.merge) {
      make("circle", {
        cx: sx(card.merge.cx),
        cy: sy(card.merge.cy),
        r: sx(card.merge.r) - sx(origin.x),
        class: "merge"
      }, group);
    }

    for (const separator of card.separators) {
      make("line", {
        x1: sx(separator.x1),
        y1: sy(separator.y1),
        x2: sx(separator.x2),
        y2: sy(separator.y2),
        class: "separator"
      }, group);
    }

    for (const note of card.notes) drawText(note, group);
  }

  const flowLayer = make("g", { "aria-hidden": "true" });
  for (const points of settings.flows) {
    make("polyline", {
      points: points.map(([x, y]) => sx(x) + "," + sy(y)).join(" "),
      class: "flow",
      "marker-end": "url(#arrow)"
    }, flowLayer);
  }
} catch (error) {
  const svg = document.getElementById("scheme");
  const settings = diagram.shift();
  const namespace = "http://www.w3.org/2000/svg";
  for (const [line, position] of settings.fallbackText.map((text, index) => [text, settings.fallbackLines[index]])) {
    const node = document.createElementNS(namespace, "text");
    node.setAttribute("x", sx(position.x));
    node.setAttribute("y", sy(position.y));
    node.setAttribute("text-anchor", "middle");
    node.setAttribute("class", "fallback");
    node.textContent = line;
    svg.appendChild(node);
  }
}
</script>
</body>
</html>
