- concept: scale в AdaLN задаёт отклонение от нейтрального множителя
  question: Почему предсказанный параметр scale в AdaLN прибавляют к нейтральному множителю перед умножением на нормализованные признаки?
  explanation: Scale интерпретируется как поправка к нейтральному масштабу. Поэтому нулевой выход управляющей проекции сохраняет результат LayerNorm, а не уничтожает его.
  kind: choice
  options:
    - Чтобы при нулевом scale нормализованные признаки обнулились
    - Чтобы при нулевом scale нормализованные признаки прошли без дополнительного масштабирования
    - Чтобы scale управлял числом токенов
    - Чтобы заменить остаточное сложение конкатенацией
  correct: 1
  id: 015-proverka-adaln-1
  fingerprint: 30ad9ed7
- concept: отдельные AdaLN-модули независимо модулируют ветви attention и MLP
  question: Зачем ветвям attention и MLP в DiT-блоке нужны отдельные экземпляры AdaLNZero?
  explanation: Attention и MLP выполняют разные преобразования. Раздельные AdaLNZero позволяют условию независимо настраивать нормализованный сигнал и остаточный вклад каждой ветви.
  kind: open
  reference: Каждый экземпляр независимо предсказывает свои scale, shift и gate из условия. Поэтому входные признаки и сила остаточного вклада ветвей attention и MLP могут обучаться раздельно.
  id: 015-proverka-adaln-2
  fingerprint: 7f2936d2
