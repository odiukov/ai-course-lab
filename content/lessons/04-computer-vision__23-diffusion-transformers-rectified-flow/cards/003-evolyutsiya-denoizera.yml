- concept: последовательность обработки изображения в Diffusion Transformer
  question: Расположи этапы прохождения зашумлённого latent через денойзер DiT в правильном порядке.
  explanation: DiT следует схеме patch embed → transformer blocks → unpatchify. В отличие от U-Net, основную обработку выполняют не свёрточные стадии, а трансформер над последовательностью патчей.
  kind: order
  items:
    - Преобразовать latent в последовательность патч-токенов
    - Обработать токены трансформерными блоками
    - Собрать токены обратно в пространственное представление
  id: 003-evolyutsiya-denoizera-1
  fingerprint: f0c1e867
- concept: переход FLUX от раздельных потоков модальностей к общему потоку
  question: Какая организация блоков соответствует архитектуре денойзера FLUX?
  explanation: В первых блоках FLUX сохраняет отдельную обработку текста и изображения. Затем токены объединяются, а глубокая часть модели работает с ними как с единым потоком и не дублирует наборы весов.
  kind: choice
  options:
    - Сначала текстовые и визуальные токены обрабатываются раздельными потоками, затем объединяются и используют общие веса
    - Сначала все токены используют общие веса, а перед выходом разделяются на независимые текстовый и визуальный потоки
    - Текстовые и визуальные токены проходят независимые потоки и нигде не взаимодействуют
    - Изображение обрабатывается только свёрточным энкодером, а текст добавляется после завершения денойзинга
