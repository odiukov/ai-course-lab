- concept: большая ёмкость текстового энкодера помогает передавать композиционную структуру промпта, но сама по себе не гарантирует качество
  question: Объясни своими словами, почему увеличение текстового энкодера может улучшить следование сложным промптам и почему одного числа параметров для этого недостаточно.
  explanation: Разница между CLIP примерно на 123 миллиона параметров и T5-XXL на 4,7 миллиарда иллюстрирует рост ёмкости, но не доказывает качество автоматически. Важно, какие языковые структуры энкодер выучил и насколько генератор умеет использовать его выход.
  kind: open
  reference: 'Большая ёмкость позволяет энкодеру сохранять больше языковых закономерностей: дальние зависимости, отношения между объектами, принадлежность свойств и отрицания. Однако полезность этой ёмкости зависит от данных, цели обучения и согласования текстовых представлений с генератором изображения.'
