- concept: при нулевом gate сначала обучается управляющая проекция, а градиенты параметров закрытой остаточной ветки временно блокируются
  question: Какие параметры могут получить ненулевой градиент при самом первом backward-проходе через AdaLN-Zero-блок, если gate инициализирован нулём, а выход attention или MLP ненулевой?
  explanation: В выражении x + gate · branch производная по параметрам branch содержит множитель gate и сначала равна нулю. Производная по gate содержит branch, поэтому управляющая часть AdaLN может первой отойти от нулевой инициализации.
  kind: open
  reference: 'Градиент может прийти в часть проекции AdaLN, предсказывающую gate: производная остаточного выхода по gate зависит от выхода ветки. Градиенты параметров самой ветки, а также scale и shift, в этот момент умножаются на нулевой gate и блокируются. После открытия gate они начинают обучаться.'
