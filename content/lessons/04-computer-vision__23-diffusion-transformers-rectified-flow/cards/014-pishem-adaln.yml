- concept: отключение встроенных affine-параметров LayerNorm оставляет масштаб и сдвиг под управлением условия
  question: Зачем в AdaLN обычно создают LayerNorm с elementwise_affine=False?
  explanation: LayerNorm продолжает нормализовать признаки, но не применяет собственные обучаемые affine-параметры. Масштабирование и сдвиг вместо этого вычисляются AdaLN из conditioning-вектора.
  kind: choice
  options:
    - Чтобы масштаб и сдвиг задавались условной проекцией, а не отдельными безусловными параметрами LayerNorm
    - Чтобы LayerNorm перестал нормализовать среднее и дисперсию признаков
    - Чтобы attention автоматически стал причинным
    - Чтобы сократить число токенов перед остаточной веткой
