- concept: порядок передачи времени и семантического условия в DiT-блок через AdaLN
  question: Расположите операции AdaLN-кондиционирования в порядке их выполнения.
  explanation: 'Время и семантическое условие сначала кодируются в общий вектор. MLP превращает его в параметры модуляции: scale и shift изменяют нормализованные активации, а gate управляет вкладом результата блока в residual-путь.'
  kind: order
  items:
    - Объединить представления времени и класса или текста в вектор условия
    - Получить из вектора условия поканальные scale, shift и gate с помощью MLP
    - Нормализовать активации токенов с помощью LayerNorm
    - Применить к нормализованным активациям поканальные scale и shift
    - Отрегулировать с помощью gate вклад ветви блока в остаточное соединение
  id: 012-adaln-uslovie-1
  fingerprint: 7fbbc9a4
- concept: разделение функций scale, shift и gate в AdaLN
  question: Объясните своими словами, чем роли scale и shift в AdaLN отличаются от роли gate в DiT-блоке.
  explanation: 'Scale и shift определяют условно-зависимое представление, поступающее в ветвь блока. Gate действует на другом уровне: он управляет силой добавления результата этой ветви к residual-потоку.'
  kind: open
  reference: 'Scale и shift поканально изменяют нормализованные активации: scale регулирует их усиление, а shift — смещение. Gate не задаёт параметры нормализации, а регулирует, насколько результат вычислительной ветви блока повлияет на остаточное соединение.'
  id: 012-adaln-uslovie-2
  fingerprint: 13eaf6e2
- concept: AdaLN передаёт условие через поканальную модуляцию, а не через добавление токенов
  question: Как AdaLN позволяет одному DiT-блоку по-разному обрабатывать одинаковые токены при разных шагах времени или текстовых условиях?
  explanation: Вектор условия управляет параметрами обработки всех токенов. Поэтому вычисления блока зависят от времени и текста, даже если входные токены совпадают.
  kind: open
  reference: Разные условия дают разные поканальные параметры scale и shift, поэтому после LayerNorm одни и те же активации по-разному усиливаются и смещаются. Дополнительный gate меняет вклад результата блока в остаточное соединение. Новые токены изображения при этом не создаются.
  id: 012-adaln-uslovie-3
  fingerprint: fd0f23d3
