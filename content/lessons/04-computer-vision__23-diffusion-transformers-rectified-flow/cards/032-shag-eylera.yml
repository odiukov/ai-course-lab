- concept: метод Эйлера повторно вычисляет поле скорости в текущем состоянии
  question: Почему в сэмплере rectified flow обычно нельзя вычислить скорость только в начальной точке и затем использовать её на всём пути?
  explanation: 'В цикле из 20 шагов модель вызывается 20 раз: после сдвига x и уменьшения t она уточняет локальное направление. Это позволяет учитывать изменение поля скорости вдоль траектории.'
  kind: open
  reference: После каждого шага изменяются состояние x и время t, поэтому предсказываемая моделью скорость тоже может измениться. Метод Эйлера считает скорость постоянной лишь на одном коротком интервале и затем вычисляет её заново в новой точке. Повторное использование начальной скорости превратило бы интегрирование в грубую прямолинейную экстраполяцию.
  id: 032-shag-eylera-2
