- concept: независимость архитектуры денойзера от расписания и цели диффузионного обучения
  question: Инженер заменил U-Net на DiT, но сохранил расписание β и обучение на предсказании шума. Что именно изменилось в диффузионном стеке и означает ли это переход на rectified flow?
  explanation: DiT отвечает за устройство модели, которая оценивает нужную величину. Rectified flow отдельно меняет путь между данными и шумом и обучающую цель, поэтому эти два изменения не обязаны происходить вместе.
  kind: open
  reference: 'Изменилась только архитектура денойзера: вместо U-Net используется трансформер. Расписание зашумления и цель предсказания шума остались от DDPM, поэтому сама по себе такая замена не означает переход на rectified flow.'
  id: 002-ddpm-baza-2
  fingerprint: e29a54a0
