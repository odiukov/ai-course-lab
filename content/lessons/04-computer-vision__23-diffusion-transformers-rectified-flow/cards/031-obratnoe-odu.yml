- concept: при фиксированном начальном шуме детерминированный решатель ОДУ воспроизводит тот же сэмпл
  question: Два запуска rectified-flow sampler используют одинаковые веса модели, одинаковый начальный шум, одинаковую сетку времени и не добавляют случайность во время интегрирования. Как соотносятся результаты?
  explanation: 'Повторные вычисления скорости не добавляют случайности: при фиксированных входах модель и метод Эйлера детерминированы. Разнообразие сэмплов возникает прежде всего из-за разных начальных шумовых состояний.'
  kind: choice
  options:
    - Результаты совпадут, поскольку вся траектория ОДУ определяется начальным состоянием
    - Результаты будут независимыми, поскольку модель заново предсказывает скорость на каждом шаге
    - Результаты обязательно различатся, поскольку метод Эйлера случайным образом выбирает направление
