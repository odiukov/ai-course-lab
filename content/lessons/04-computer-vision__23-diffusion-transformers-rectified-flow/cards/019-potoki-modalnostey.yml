- concept: вес совместного attention определяет вклад value-вектора токена другой модальности в обновление патча
  question: В матрице совместного attention строка картиночного патча имеет особенно большой вес в столбце текстового токена «алый». Что это непосредственно означает?
  explanation: Attention-веса задают коэффициенты во взвешенной сумме value-векторов. Большой вес усиливает влияние признаков токена «алый» на представление патча, но сам по себе ещё не гарантирует конкретный цвет итоговых пикселей.
  kind: choice
  options:
    - Патч уже декодирован в пиксели алого цвета
    - Value-вектор токена «алый» внесёт большой вклад в обновление представления патча
    - Для текста и изображения обязательно использовались одинаковые QKV-проекции
    - Текстовый токен будет дословно скопирован на изображение
  correct: 1
  id: 019-potoki-modalnostey-1
  fingerprint: 458e6a49
- concept: совместное self-attention обеспечивает двунаправленный обмен информацией между текстовыми и картиночными токенами
  question: Объясни своими словами, почему в совместном self-attention не только патчи изображения могут учитывать текст, но и текстовые токены могут учитывать текущее состояние изображения.
  explanation: В совместном self-attention обе модальности участвуют как источники запросов, ключей и значений. Это отличает его от односторонней схемы, где запросы формирует только одна модальность.
  kind: open
  reference: Запрос каждого токена сравнивается с ключами всех токенов общей системы. Поэтому запрос патча может получить информацию из value-векторов текста, а запрос текстового токена — из value-векторов патчей.
  id: 019-potoki-modalnostey-2
  fingerprint: 134263cb
