- concept: минимум MSE при неоднозначной целевой скорости соответствует условному среднему
  question: Для заданных x_t и t разные скрытые пары изображения и шума могут задавать разные целевые скорости. Какой вектор будет стремиться предсказывать модель, обучаемая с MSE, и почему?
  explanation: MSE не заставляет выбирать одну из нескольких допустимых скоростей. Оптимальным прогнозом при неоднозначной цели становится их условное среднее, то есть среднее поле скорости в данной точке и момент времени.
  kind: open
  reference: Модель стремится предсказывать условное среднее целевых скоростей для данного x_t и t, потому что именно среднее минимизирует ожидаемую квадратичную ошибку.
  id: 027-flow-matching-mse-2
