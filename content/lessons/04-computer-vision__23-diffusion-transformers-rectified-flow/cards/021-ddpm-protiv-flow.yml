- concept: ошибки крупных обратных переходов DDPM последовательно накапливаются
  question: Объясните своими словами, почему ошибка раннего крупного обратного перехода DDPM может ухудшить все последующие переходы.
  explanation: 'Переходы DDPM зависимы: выход одного становится входом следующего. Поэтому ошибка не остаётся изолированной — она меняет условия для всех дальнейших предсказаний.'
  kind: open
  reference: Ранний крупный переход создаёт состояние, отклоняющееся от ожидаемой траектории и распределения для данного уровня шума. Следующее предсказание денойзера строится уже по этому ошибочному состоянию, поэтому новая коррекция тоже может быть неточной, а отклонения последовательно накапливаются.
