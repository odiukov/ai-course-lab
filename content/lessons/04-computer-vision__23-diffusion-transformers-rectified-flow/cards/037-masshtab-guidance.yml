- concept: подходящий guidance scale зависит от базовой способности и способа обучения конкретной модели
  question: Почему найденное для одной text-to-image модели удачное значение guidance scale нельзя без проверки переносить на другую модель?
  explanation: SD1.5 часто требовала scale около 7,5, моделям на rectified flow обычно хватает 3,5–5, а FLUX.1-schnell обучена без CFG. Практически выбирают минимальный scale, при котором промпт уже выполнен без заметного пережатия изображения.
  kind: open
  reference: Модели различаются тем, насколько хорошо они следуют тексту без дополнительного усиления, и могут по-разному обучаться для CFG. Поэтому одному семейству требуется сильное усиление, другому — слабое, а модель, обученная без CFG, может вообще его не использовать.
  id: 037-masshtab-guidance-2
  fingerprint: 38a6f198
