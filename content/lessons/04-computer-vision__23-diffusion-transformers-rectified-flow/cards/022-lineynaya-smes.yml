- concept: rectified flow смешивает каждую пару соответствующих элементов, а не заменяет случайную долю элементов шумом
  question: Объясните своими словами, чем поэлементная линейная смесь тензора данных с тензором шума отличается от случайной замены части элементов данными из шума.
  explanation: Параметр времени задаёт веса сразу для всех координат. Например, при t = 0,25 каждый элемент содержит 75% соответствующего значения данных и 25% соответствующего значения шума; это не означает замену четверти элементов.
  kind: open
  reference: При линейной интерполяции каждый элемент промежуточного тензора вычисляется из соответствующих элементов данных и одного фиксированного образца шума с общими весами. При случайной замене одни элементы остаются неизменными, а другие целиком берутся из шума, поэтому такой процесс обычно не движется по единому прямому отрезку между двумя тензорами.
  id: 022-lineynaya-smes-2
