- concept: порядок вычисления градиентов и обновления параметров в одном обучающем батче
  question: Расположите операции завершающей части обучающего батча rectified flow в правильном порядке.
  explanation: Сначала `optimizer.zero_grad()` очищает буферы градиентов, затем `loss.backward()` вычисляет производные loss по параметрам, а `optimizer.step()` использует их для изменения весов.
  kind: order
  items:
    - Очистить градиенты, оставшиеся от предыдущего батча
    - Выполнить обратное распространение ошибки и записать новые градиенты
    - Попросить оптимизатор обновить параметры модели по вычисленным градиентам
  id: 029-obuchayushchiy-batch-1
  fingerprint: 3f9b8f79
- concept: градиенты PyTorch накапливаются между вызовами backward без явной очистки
  question: Что произойдёт, если при обычном обучении rectified flow не очищать градиенты между последовательными батчами?
  explanation: По умолчанию `backward()` накапливает значения в полях `.grad`. Поэтому без `optimizer.zero_grad()` очередной шаг оптимизатора учитывает сумму градиентов нескольких батчей, если такое накопление не было запланировано специально.
  kind: choice
  options:
    - Новый вызов `backward()` прибавит свои градиенты к оставшимся от прошлых батчей
    - PyTorch автоматически заменит старые градиенты новыми
    - Оптимизатор обновит веса только по текущему loss, игнорируя сохранённые градиенты
    - Прямой проход перестанет вычислять предсказанную скорость
