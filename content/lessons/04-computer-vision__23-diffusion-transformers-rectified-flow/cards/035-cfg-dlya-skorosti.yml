- concept: CFG усиливает разность между условной и безусловной оценками скорости
  question: Восстановите формулу classifier-free guidance для поля скорости rectified flow.
  explanation: Разность v_cond − v_uncond выделяет поправку, внесённую условием. Guidance scale умножает эту поправку, после чего она добавляется к безусловной скорости.
  kind: cloze
  template: v_cfg = ___
  answer: v_uncond + s * (v_cond - v_uncond)
  accept:
    - v_uncond+s*(v_cond-v_uncond)
    - (1-s)*v_uncond+s*v_cond
  id: 035-cfg-dlya-skorosti-1
  fingerprint: 8876baeb
- concept: случайное удаление условия обучает одну модель условному и безусловному режимам
  question: Почему classifier-free guidance может получить условную и безусловную оценки скорости от одной и той же модели без отдельного классификатора?
  explanation: Модель обучают и на примерах с текстом, и на примерах с отброшенным текстом. Поэтому на инференсе достаточно выполнить два прохода с одинаковыми состоянием и временем, но с разными условиями.
  kind: choice
  options:
    - Во время обучения часть условий заменяют пустым условием, поэтому модель осваивает оба режима
    - На инференсе безусловную скорость вычисляют как градиент отдельного классификатора
    - Безусловную скорость всегда принимают равной нулевому вектору
    - Условную скорость получают, изменяя расписание времени в численном решателе
  correct: 0
  id: 035-cfg-dlya-skorosti-2
