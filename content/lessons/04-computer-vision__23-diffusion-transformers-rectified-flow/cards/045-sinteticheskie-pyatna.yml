- concept: доля кадра, занятая объектом, помогает оценить сложность синтетического распределения
  question: На квадратном изображении размером 32×32 расположен круг радиусом 6 пикселей. Какой примерно процент площади кадра он занимает? Используй непрерывную оценку площади круга.
  explanation: Доля площади равна π·6² / 32² ≈ 0.1104, то есть около 11%. Когда объект занимает лишь небольшую часть кадра, а остальной фон однороден, такое распределение удобно для быстрой диагностики генеративного пайплайна.
  kind: numeric
  answer: 11.04
  tolerance: 0.5
