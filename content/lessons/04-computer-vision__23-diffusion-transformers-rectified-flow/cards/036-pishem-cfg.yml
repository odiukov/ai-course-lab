- concept: применимость classifier-free guidance не зависит от вида диффузионного сэмплера
  question: Почему одну и ту же схему classifier-free guidance можно применять и с DDPM, и с rectified flow?
  explanation: Rectified flow меняет способ движения по траектории, но не принцип обусловливания. CFG сначала строит направленное предсказание из условного и безусловного ответов, а затем выбранный сэмплер использует его в своём шаге.
  kind: choice
  options:
    - CFG смешивает условное и безусловное предсказания модели до того, как сэмплер использует результат для обновления состояния
    - CFG превращает любую траекторию сэмплирования в прямую линию
    - Условное и безусловное предсказания всегда численно совпадают
    - Rectified flow использует то же уравнение обратного перехода, что и DDPM
  correct: 0
  id: 036-pishem-cfg-1
  fingerprint: 310144fe
- concept: условное и безусловное предсказания CFG должны вычисляться в одной точке состояния и времени
  question: Модель вызывают дважды для вычисления classifier-free guidance. Какие аргументы должны оставаться одинаковыми в обоих вызовах?
  explanation: Оба прогноза должны описывать поле скорости в одной и той же точке траектории. Если изменить состояние или время, их разность будет отражать не только влияние текста, поэтому смешивание перестанет соответствовать CFG.
  kind: choice
  options:
    - Текущее состояние и время; изменяется только условие
    - Только условие; состояние и время должны различаться
    - Только текущее состояние; время и условие должны различаться
    - Все аргументы должны различаться
  correct: 0
  id: 036-pishem-cfg-2
  fingerprint: a41302ef
