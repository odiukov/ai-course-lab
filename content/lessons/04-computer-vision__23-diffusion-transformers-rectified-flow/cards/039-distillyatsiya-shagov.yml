- concept: LCM обучает ученика восстанавливать согласованный конечный результат из разных промежуточных состояний
  question: Заполни пропуск в формулировке цели Latent Consistency Model.
  explanation: 'LCM согласует предсказания вдоль траектории: разные промежуточные состояния должны приводить к одному соответствующему чистому результату. Благодаря этому ученик способен заменить длинную последовательность малых переходов коротким отображением.'
  kind: cloze
  template: Из произвольного промежуточного зашумлённого состояния LCM-ученик предсказывает ___.
  answer: согласованный финальный чистый латент
  accept:
    - финальный чистый латент
    - конечный незашумлённый латент
    - согласованный конечный результат
