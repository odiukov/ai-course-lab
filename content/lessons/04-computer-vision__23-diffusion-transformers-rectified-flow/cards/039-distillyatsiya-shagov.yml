- concept: состязательная составляющая дистилляции поддерживает реалистичность результата при сокращённой траектории
  question: Объясни своими словами, зачем при обучении моделей семейства Turbo и schnell к переносу знаний от учителя добавляют состязательную цель.
  explanation: Обычная дистилляционная ошибка учит приближать выход учителя, а состязательная проверка дополнительно штрафует визуально неправдоподобные результаты. Это особенно важно, когда длинная траектория сжатая до очень малого числа переходов.
  kind: open
  reference: Состязательная цель оценивает, похож ли результат короткой генерации на изображение из целевого распределения. Она помогает ученику сохранять реалистичные текстуры и детали, которые могут потеряться, если оптимизировать только совпадение с сигналами учителя.
  id: 039-distillyatsiya-shagov-3
