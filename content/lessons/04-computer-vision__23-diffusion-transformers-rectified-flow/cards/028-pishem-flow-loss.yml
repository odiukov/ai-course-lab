- concept: независимое сэмплирование времени интерполяции для каждого элемента батча
  question: Как следует выбирать время интерполяции при вычислении flow-matching loss для батча?
  explanation: Независимые значения времени позволяют одному батчу охватывать разные участки траектории. Общее время делает примеры коррелированными по этой координате и обычно повышает дисперсию оценки loss.
  kind: choice
  options:
    - Независимо сэмплировать случайное время для каждого примера
    - Сэмплировать одно случайное время и использовать его для всего батча
    - Всегда брать середину траектории
    - Выбирать время на основе нормы входного изображения
  correct: 0
  id: 028-pishem-flow-loss-1
  fingerprint: d761e24e
- concept: стандартный MSE усредняет квадраты ошибок по всем компонентам скорости
  question: Предсказанная скорость содержит компоненты [7, 8], а целевая — [9, 11]. Чему равен `F.mse_loss` при стандартном `reduction='mean'`?
  explanation: Функция возводит поэлементные отклонения в квадрат и усредняет результаты по всем компонентам. Для этих тензоров среднее равно 6.5.
  kind: numeric
  answer: 6.5
  tolerance: 0.001
  id: 028-pishem-flow-loss-2
  fingerprint: 8d0b7d8d
