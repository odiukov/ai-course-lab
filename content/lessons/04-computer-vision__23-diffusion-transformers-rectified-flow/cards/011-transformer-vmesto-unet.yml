- concept: attention смешивает информацию между токенами, а MLP преобразует признаки внутри каждого токена
  question: Объясни своими словами, чем различаются роли self-attention и полносвязного MLP в блоке Diffusion Transformer.
  explanation: 'У операций разные оси работы: attention отвечает за взаимодействие позиций, а MLP — за нелинейное преобразование признаков отдельной позиции. Вместе они заменяют иерархическую обработку карт признаков последовательностью однотипных трансформерных блоков.'
  kind: open
  reference: Self-attention передаёт и смешивает информацию между токенами изображения, выбирая значимые связи. MLP затем независимо для каждого токена преобразует его канальные признаки. Остаточные соединения позволяют добавлять результаты этих операций к прежнему представлению и постепенно его уточнять.
