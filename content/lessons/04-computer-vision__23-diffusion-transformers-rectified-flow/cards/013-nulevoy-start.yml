- concept: закрытый gate превращает остаточный DiT-блок в тождественное отображение независимо от случайных выходов его ветвей
  question: В остаточном DiT-блоке gate полностью закрыт при инициализации. Что произойдёт с выходом блока, даже если attention и MLP пока выдают случайные поправки?
  explanation: Каждая остаточная поправка умножается на gate перед сложением со входом. При нулевом gate поправки от attention и MLP исчезают, поэтому блок возвращает вход без изменений.
  kind: choice
  options:
    - Выход станет нулевым тензором
    - В выход попадёт только результат attention
    - Выходом станет нормализованная версия входа
    - Условие полностью заменит входные токены
    - Случайные поправки продолжат накапливаться
    - Выход в точности совпадёт со входом
  correct: 5
  id: 013-nulevoy-start-1
  fingerprint: e3a5e3c5
- concept: нулевые веса и смещения проекции AdaLN гарантируют нулевой gate для любого условия
  question: Объясни своими словами, почему обнуление весов и смещений линейного слоя AdaLN гарантирует закрытый gate при любом векторе условия.
  explanation: Выход проекции имеет вид Wc + b. Нулевые W и b отображают любой вектор условия c в нулевой вектор, поэтому полученные scale, shift и gate на старте равны нулю.
  kind: open
  reference: Линейный слой вычисляет аффинное преобразование условия. Если его матрица весов и вектор смещения нулевые, результат всегда нулевой независимо от входа. После разделения результата часть, соответствующая gate, также равна нулю.
  id: 013-nulevoy-start-2
  fingerprint: 340cb0f0
