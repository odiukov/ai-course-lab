- concept: число шагов выбирают по плато качества с учётом предельной вычислительной стоимости
  question: Объясни своими словами, как выбрать число шагов Эйлера, если более плотная интеграция требует заметно больше вычислений.
  explanation: В упражнении заметный выигрыш ожидается при переходе от 10 шагов к 20, а между 20 и 50 качество часто выходит на плато. Поэтому дополнительные вызовы модели оправданы только при воспроизводимом улучшении.
  kind: open
  reference: Нужно сравнить режимы на множестве одинаковых стартов и найти точку, после которой дополнительные шаги перестают давать устойчиво различимое улучшение. Предпочтителен самый дешёвый режим на этом плато, а не режим с максимальным числом шагов.
