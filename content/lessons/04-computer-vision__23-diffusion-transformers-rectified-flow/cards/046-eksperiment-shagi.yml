- concept: при одинаковой стоимости вызова модели вычислительная цена сэмплирования линейна числу шагов Эйлера
  question: Один режим сэмплера делает 24 вызова модели, а другой — 72. Во сколько раз второй режим дороже по числу вызовов?
  explanation: Отношение затрат равно 72 / 24 = 3. Реальное время может масштабироваться не идеально линейно из-за накладных расходов, поэтому его измеряют отдельно после прогрева.
  kind: numeric
  answer: 3
  tolerance: 0.01
