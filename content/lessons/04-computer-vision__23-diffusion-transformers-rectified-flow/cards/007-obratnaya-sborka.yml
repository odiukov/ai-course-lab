- concept: unpatchify сохраняет расположение патчей с помощью раскрытия и перестановки осей
  question: Расположите операции unpatchify в порядке, который восстанавливает изображение из последовательности декодированных патчей.
  explanation: Сначала каждому токену возвращают координаты патча и внутреннюю структуру. Затем пространственные оси ставят в правильном порядке и только после этого объединяют. Обычный reshape без перестановки осей сохранил бы неверный порядок элементов.
  kind: order
  items:
    - Разложить последовательность токенов в сетку патчей и выделить оси пикселей внутри каждого патча
    - Переставить оси так, чтобы канал шёл после батча, а строка патча соседствовала со строкой внутри патча
    - Объединить пары строковых и столбцовых осей в полные высоту и ширину изображения
  id: 007-obratnaya-sborka-1
  fingerprint: c94b501a
- concept: размер восстановленного изображения равен размеру сетки патчей, умноженному на размер патча
  question: Изображение собирают из квадратной сетки 7 × 7 патчей, каждый размером 9 × 9 пикселей. Какова высота восстановленного изображения в пикселях?
  explanation: По вертикали расположено 7 патчей, каждый занимает 9 пикселей, поэтому высота равна 7 × 9 = 63 пикселя.
  kind: numeric
  answer: 63
  tolerance: 0.01
  id: 007-obratnaya-sborka-2
  fingerprint: 1b7f8c46
