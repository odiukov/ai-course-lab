- concept: временное условие модели должно иметь отдельное значение для каждого элемента батча
  question: Объясни, почему время t в батчевом Euler-сэмплере обычно представляют тензором с одним значением на каждый объект, даже когда весь батч движется синхронно.
  explanation: В приведённом сэмплере t имеет длину shape[0]. Все его элементы стартуют с 1 и уменьшаются вместе, однако отдельная batch-ось позволяет модели корректно сопоставить временное условие каждому изображению.
  kind: open
  reference: Модель обрабатывает батч и ожидает временное условие с соответствующей batch-осью. Поэтому каждому объекту передаётся своё значение t; при синхронном сэмплировании эти значения равны, но форма тензора остаётся совместимой с батчевым прямым проходом.
