- concept: состояние численного решателя должно накапливать результаты последовательных обновлений
  question: Что произойдёт, если внутри каждой итерации Euler-сэмплера заново создавать x из случайного шума перед вызовом модели?
  explanation: Метод Эйлера последовательно обновляет одно состояние. В цикле из 20 итераций каждое новое x должно получаться из предыдущего; повторная инициализация шумом стирает уже пройденную часть траектории.
  kind: choice
  options:
    - 'Последовательная траектория разрушится: новое обновление перестанет продолжать состояние предыдущей итерации'
    - Интегрирование останется тем же, поскольку модель получает текущее время
    - Метод автоматически превратится в решатель более высокого порядка
    - Изменится только объём памяти, но итоговая точка останется прежней
