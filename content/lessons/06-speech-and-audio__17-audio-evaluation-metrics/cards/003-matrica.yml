- concept: 'направление улучшения зависит от метрики: ошибки минимизируют, а оценки качества максимизируют'
  question: После обновления модели WER снизился, UTMOS вырос, а DER вырос. Какой вывод корректен?
  explanation: WER и DER отражают долю ошибок, поэтому их снижение считается улучшением. UTMOS оценивает качество синтезированной речи, и для него лучше большее значение.
  kind: choice
  options:
    - Все три показателя улучшились
    - Распознавание ухудшилось, а синтез и диаризация улучшились
    - Распознавание и синтез улучшились, а диаризация ухудшилась
    - Улучшилось только распознавание
  correct: 2
  id: 003-matrica-1
  fingerprint: 77b0bfb0
- concept: каждой аудиозадаче соответствует своя основная метрика
  question: Какую основную метрику следует выбрать для сравнения систем проверки личности по голосу?
  explanation: Для speaker verification основной метрикой служит EER — частота ошибок в точке, где ложные допуски и ложные отказы равны. Чем ниже EER, тем лучше система различает настоящего пользователя и самозванца.
  kind: choice
  options:
    - FAD, причём лучше большее значение
    - EER, причём лучше меньшее значение
    - DER, причём лучше большее значение
    - UTMOS, причём лучше меньшее значение
  correct: 1
  id: 003-matrica-2
  fingerprint: 3ddc7629
- concept: значения метрик разных аудиозадач нельзя напрямую ранжировать по величине
  question: Почему по одним только значениям WER системы распознавания и UTMOS системы синтеза нельзя определить, какая модель «лучше»?
  explanation: 'Числовая величина сама по себе не является универсальной оценкой аудиомодели. Сначала нужно определить задачу, смысл метрики и направление улучшения: меньший WER хорош для ASR, а больший UTMOS — для TTS.'
  kind: open
  reference: WER и UTMOS относятся к разным задачам, имеют разные шкалы и противоположные направления улучшения. WER показывает долю ошибок распознавания и должен снижаться, а UTMOS оценивает качество синтезированной речи и должен расти. Сравнивать модели можно лишь по метрике, соответствующей одной и той же задаче и условиям оценки.
  id: 003-matrica-3
  fingerprint: 1742e6f7
