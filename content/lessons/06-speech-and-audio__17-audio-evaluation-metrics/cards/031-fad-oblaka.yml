- concept: систематическое смещение всей выборки влияет на FAD сильнее, чем редкий удачный пример
  question: В коллекции генератора встречается редкий чрезвычайно реалистичный фрагмент, но у большинства записей сохраняется общий синтетический тембр. Объясните, почему FAD скорее отразит общий дефект, чем удачное исключение.
  explanation: FAD оценивает облака эмбеддингов целиком. Поэтому единичный шедевр почти не компенсирует систематическую «пластиковость» основной массы сгенерированных фрагментов.
  kind: open
  reference: FAD характеризует распределение эмбеддингов всей коллекции. Редкий удачный фрагмент добавляет лишь отдельную точку и слабо меняет распределение, тогда как общий синтетический тембр систематически сдвигает эмбеддинги множества записей относительно настоящего аудио.
