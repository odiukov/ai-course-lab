- concept: лексическое несовпадение не означает ошибку в задаче описания аудио
  question: Почему WER плохо подходит как основная метрика для оценки свободных описаний в AudioCaps или Clotho?
  explanation: В задаче аудиокапшенинга несколько лексически разных подписей могут быть одинаково верными. Поэтому AudioCaps и Clotho оценивают описания метриками, чувствительными к содержанию, такими как SPICE, CIDEr и FENSE.
  kind: open
  reference: Одно аудио можно правильно описать множеством разных формулировок. WER сопоставляет словесные токены и поэтому штрафует синонимы, перефразирование и другой порядок слов, даже если смысл описания совпадает с эталоном.
  id: 037-longaudiobench-2
  fingerprint: 0cdecf0d
- concept: SPICE, CIDEr и FENSE по-разному оценивают смысл аудиоописания
  question: Какая строка правильно сопоставляет метрики аудиокапшенинга с их принципами работы?
  explanation: SPICE сравнивает семантические объекты и отношения, CIDEr сильнее учитывает редкие и информативные выражения, а FENSE использует нейросетевое представление смысла предложений.
  kind: choice
  options:
    - SPICE — объекты и связи; CIDEr — вес редких информативных слов; FENSE — нейросетевые представления предложений
    - SPICE — посимвольное расстояние; CIDEr — длительность клипа; FENSE — число говорящих
    - SPICE — спектральное искажение; CIDEr — частота дискретизации; FENSE — громкость
    - SPICE — скорость генерации; CIDEr — задержка первого токена; FENSE — объём памяти
