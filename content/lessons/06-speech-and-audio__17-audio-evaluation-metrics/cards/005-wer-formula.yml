- concept: WER равен сумме замен, удалений и вставок, делённой на число слов в эталоне
  question: При выравнивании транскрипта с эталоном обнаружено 6 замен, 7 удалений и 9 вставок. В эталоне 16 слов. Чему равен WER?
  explanation: 'WER = (6 + 7 + 9) / 16 = 22 / 16 = 1.375. Значение больше единицы допустимо: ошибок может оказаться больше, чем слов в эталоне.'
  kind: numeric
  answer: 1.375
  tolerance: 0.001
  id: 005-wer-formula-1
  fingerprint: 71a39a15
- concept: длина эталона служит независимым от поведения модели знаменателем WER
  question: Объясни своими словами, почему WER нормируют по числу слов в эталоне, а не по длине транскрипта модели.
  explanation: Фиксированный эталон даёт всем моделям одну базу сравнения. Длина вывода зависит от самой модели, поэтому такой знаменатель вознаграждал бы многословие и не работал бы для пустого результата.
  kind: open
  reference: Длина эталона задаётся правильным ответом и не зависит от модели. Если делить на длину её транскрипта, модель сможет искусственно уменьшить долю ошибок, добавляя лишние слова, а для пустого транскрипта знаменатель станет нулевым.
  id: 005-wer-formula-2
  fingerprint: fd2dfc11
- concept: WER может быть больше единицы из-за большого числа ошибок относительно длины эталона
  question: Может ли корректно вычисленный WER быть больше единицы?
  explanation: У WER нет верхней границы, равной единице. Например, многочисленные лишние слова увеличивают число вставок, и числитель может превысить длину эталона.
  kind: choice
  options:
    - Да, если суммарное число замен, удалений и вставок больше числа слов в эталоне
    - Нет, любая нормированная метрика обязательно ограничена единицей
    - Только если эталонная транскрипция содержит неизвестные слова
  correct: 0
  id: 005-wer-formula-3
  fingerprint: adc51645
