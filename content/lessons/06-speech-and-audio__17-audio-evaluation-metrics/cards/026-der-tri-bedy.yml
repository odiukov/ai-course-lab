- concept: DER равен суммарной длительности пропусков, ложной речи и путаницы дикторов, делённой на эталонное время речи
  question: В эталонной разметке суммарно 630 секунд речи. Система пропустила 18 секунд, ошибочно обнаружила речь на 12 секундах и перепутала дикторов на 24 секундах. Чему равен DER в процентах?
  explanation: Суммарная длительность ошибок равна 18 + 12 + 24 = 54 секундам. DER = 54 / 630 ≈ 0,0857, то есть 8,57%.
  kind: numeric
  answer: 8.57
  tolerance: 0.02
  id: 026-der-tri-bedy-1
  fingerprint: b18aad05
- concept: речь, назначенная неверному диктору, учитывается в DER как путаница дикторов
  question: В эталонной разметке говорит Ольга. Система тоже обнаружила речь в этом интервале, но назначила её Павлу. К какому компоненту DER относится ошибка?
  explanation: Речь обнаружена, поэтому это не пропуск, и она действительно присутствует, поэтому это не ложное срабатывание. Ошибка состоит в назначении неверного диктора — это Confusion.
  kind: choice
  options:
    - Miss
    - False alarm
    - Confusion
    - Total speaker time
  correct: 2
  id: 026-der-tri-bedy-2
  fingerprint: 0a88a1ac
