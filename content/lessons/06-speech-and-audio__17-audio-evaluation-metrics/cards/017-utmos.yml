- concept: высокая корреляция UTMOS с человеческим MOS означает согласованность изменений и ранжирования, а не точное совпадение оценок
  question: Предсказатель качества речи имеет высокую корреляцию с человеческим MOS. Какой вывод из этого наиболее обоснован?
  explanation: Корреляция около 0.9 показывает, что UTMOS хорошо воспроизводит общую динамику и относительный порядок человеческих оценок. Она не гарантирует точного совпадения баллов или одинаковой надёжности вне стандартных бенчмарков.
  kind: choice
  options:
    - Его оценка для каждой записи точно совпадает со средним баллом слушателей
    - Он обычно повышает оценку для тех же записей, которые люди считают более качественными
    - Он одинаково надёжен для любых языков, шумов и типов голоса
    - Он полностью устраняет необходимость в человеческой оценке
  correct: 1
  id: 017-utmos-1
  fingerprint: 5f646655
- concept: UTMOS подходит для быстрого отбора версий TTS, но окончательное качество подтверждают человеческой панелью
  question: Почему при разработке TTS разумно регулярно оценивать промежуточные версии через UTMOS, а перед выпуском всё же проводить человеческое MOS-тестирование?
  explanation: UTMOS заменяет тысячи прослушиваний при повседневной разработке и коррелирует с человеческим MOS примерно на 0.9. Но из-за возможных ошибок предсказателя человеческая оценка остаётся золотым стандартом для финального решения.
  kind: open
  reference: UTMOS быстро и дёшево даёт приближённую оценку, поэтому подходит для частого сравнения промежуточных версий. Однако это обученная модель с несовершенной корреляцией и возможными ошибками на необычных голосах, шумах и других данных вне привычного распределения. Человеческая панель остаётся окончательной проверкой воспринимаемого качества.
  id: 017-utmos-2
  fingerprint: 7e909f42
