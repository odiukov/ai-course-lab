- concept: CLAP Score оценивает семантическое соответствие аудио текстовому запросу
  question: Музыкальный фрагмент звучит естественно и профессионально, но вместо запрошенного фортепиано содержит гитару. Какая метрика непосредственно выявляет это несоответствие?
  explanation: CLAP сравнивает эмбеддинги текста и аудио в общем пространстве, поэтому оценивает соответствие результата запросу. FAD характеризует распределение аудио, а слушательская оценка без запроса может отражать качество звучания, не замечая смыслового несоответствия.
  kind: choice
  options:
    - CLAP Score
    - Fréchet Audio Distance
    - Оценка естественности слушателями
    - Рейтинг по общим парным предпочтениям без показа запроса
  correct: 0
  id: 035-clap-elo-1
  fingerprint: 05b08e64
- concept: изменение ELO зависит от ожидаемости результата с учётом рейтинга соперника
  question: Две музыкальные модели получили по одной победе в слушательских сравнениях. Первая победила гораздо более высоко оценённого соперника, а вторая — значительно более слабого. Объясни, почему их рейтинги ELO изменятся неодинаково.
  explanation: В ELO важен не только факт выбора модели слушателем, но и сила её соперника. Чем неожиданнее результат относительно текущих рейтингов, тем больше обновление.
  kind: open
  reference: ELO учитывает ожидаемый результат, вычисленный из разницы рейтингов. Победа над сильным соперником маловероятна и потому заметно повышает рейтинг, тогда как победа над слабым ожидаема и даёт небольшой прирост.
  id: 035-clap-elo-2
  fingerprint: 8a50649e
