- concept: состав ошибок Левенштейна восстанавливают обратным проходом по заполненной динамической таблице
  question: Расположите этапы вычисления отдельных счётчиков замен, удалений и вставок между эталонной и распознанной последовательностями.
  explanation: Правая нижняя клетка хранит только минимальное число правок. Чтобы получить S, D и I отдельно, нужно восстановить оптимальный путь и классифицировать каждый его переход.
  kind: order
  items:
    - Инициализировать границы динамической таблицы для пустых префиксов
    - Заполнить таблицу минимальными стоимостями преобразования префиксов
    - Пройти от конечной клетки к начальной по выбранным оптимальным переходам
    - По типам переходов накопить счётчики замен, удалений и вставок
  id: 009-edit-ops-1
  fingerprint: '14216346'
- concept: границы таблицы Левенштейна кодируют преобразования между последовательностью и пустой последовательностью
  question: Как следует интерпретировать границу динамической таблицы, где гипотеза пуста, а эталон содержит префикс длины i?
  explanation: Чтобы превратить префикс эталона в пустую гипотезу, необходимо удалить каждое слово. Симметричная граница с пустым эталоном состоит из вставок.
  kind: choice
  options:
    - Стоимость равна i, и все операции являются удалениями
    - Стоимость равна i, и все операции являются вставками
    - Стоимость равна нулю, поскольку сравнивать гипотезу не с чем
    - Стоимость зависит от значений слов в эталоне
  correct: 0
  id: 009-edit-ops-2
  fingerprint: 7e85ae9c
- concept: фиксированный приоритет при равных стоимостях делает разбиение расстояния на типы ошибок воспроизводимым
  question: Объясните, зачем реализации edit_ops заранее задавать приоритет переходов при равенстве стоимостей нескольких оптимальных путей.
  explanation: Ничья не меняет итоговое расстояние Левенштейна, но может изменить состав S, D и I. Детерминированное правило разрешения ничьих обеспечивает стабильные отчёты и тесты.
  kind: open
  reference: Разные оптимальные выравнивания могут иметь одинаковую суммарную стоимость, но разное количество замен, удалений и вставок. Фиксированный приоритет выбирает одно выравнивание детерминированно, поэтому одинаковые входы всегда дают одинаковую разбивку ошибок.
  id: 009-edit-ops-3
  fingerprint: ef0aace5
