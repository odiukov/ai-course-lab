- concept: EER — значение ошибки в точке равенства FAR и FRR
  question: Как определяется EER в задаче верификации диктора?
  explanation: EER находят в точке, где доли ложных допусков и ложных отказов совпадают. Благодаря единому правилу выбора порога эту метрику удобно использовать для сравнения моделей.
  kind: choice
  options:
    - Как минимальная доля ложных допусков при любом пороге
    - Как значение ошибки при пороге, на котором FAR равен FRR
    - Как среднее значение FAR по всем возможным порогам
    - Как доля верных решений при заранее заданном FAR
  correct: 1
  id: 024-eer-mindcf-1
  fingerprint: 247556bd
- concept: minDCF учитывает рабочую точку и неодинаковую стоимость ложных допусков и отказов
  question: Объясни своими словами, почему minDCF обычно лучше отражает требования продуктовой системы верификации диктора, чем EER.
  explanation: В голосовом замке ложный допуск обычно опаснее ложного отказа, поэтому рабочий порог смещают и могут зафиксировать FAR = 0.01. minDCF оценивает взвешенную стоимость ошибок при таком режиме, тогда как EER относится к точке их равенства.
  kind: open
  reference: EER оценивает модель в условной точке равенства FAR и FRR, хотя продукт может считать один вид ошибки значительно дороже другого. minDCF использует выбранную рабочую точку и веса ошибок, поэтому позволяет оценить модель с учётом реальных требований системы.
  id: 024-eer-mindcf-2
  fingerprint: a98920fa
