- concept: при аффинном преобразовании стандартное отклонение умножается на модуль коэффициента масштаба
  question: Стандартное отклонение набора x равно 7. Каждый его элемент преобразовали по правилу y = -5x + 8. Чему равно стандартное отклонение y?
  explanation: 'Добавление константы не меняет разброс, а умножение всех значений на коэффициент масштабирует стандартное отклонение на модуль этого коэффициента: 7 × 5 = 35.'
  kind: numeric
  answer: 35
  tolerance: 0.001
  id: 033-frechet-distance-1d-2
  fingerprint: 3c2abaac
- concept: реализация должна соблюдать контракт о возврате расстояния или его квадрата
  question: Контракт функции требует вернуть само расстояние, а переменная squared_distance хранит квадрат расстояния. Заполни выражение возврата.
  explanation: Если накоплен квадрат расстояния, для возврата самого расстояния нужно извлечь квадратный корень. Здесь результат равен 9.
  kind: cloze
