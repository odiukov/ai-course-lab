- concept: CER считает замены, удаления и вставки на уровне символов относительно длины символьного эталона
  question: Эталон содержит 80 символов. Оптимальное выравнивание выявило 7 замен, 8 удалений и 9 вставок. Чему равен CER?
  explanation: CER = (S + D + I) / N = (7 + 8 + 9) / 80 = 24 / 80 = 0.3. В отличие от WER, здесь и ошибки, и длина эталона считаются в символах.
  kind: numeric
  answer: 0.3
  tolerance: 0.001
  id: 013-cer-zachem-1
  fingerprint: f86d4194
- concept: CER устраняет зависимость оценки от неоднозначного разбиения текста на слова
  question: Почему для распознавания мандаринской или кантонской речи часто используют CER вместо WER?
  explanation: Разные способы сегментации одной строки на слова меняют число слов в эталоне и, следовательно, WER. CER применяет ту же формулу к символам, поэтому не требует выбирать спорные границы слов.
  kind: choice
  options:
    - Границы слов в письменном тексте могут быть неоднозначны, тогда как последовательность символов задана явно
    - CER автоматически проверяет правильность произнесённых тонов по аудиосигналу
    - CER не учитывает вставленные моделью элементы
    - Каждый символ таких языков всегда соответствует отдельному слову
