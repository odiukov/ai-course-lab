- concept: алгоритм расстояния редактирования не зависит от типа элементов сравниваемых последовательностей
  question: Объясни, почему одну функцию подсчёта замен, удалений и вставок можно использовать и для WER, и для CER.
  explanation: Гранулярность метрики задаётся до выравнивания. Разбиение на слова даёт WER, а преобразование текста в последовательность символов — CER; функция edit distance в обоих случаях выполняет одну и ту же работу.
  kind: open
  reference: Алгоритм выравнивает произвольные последовательности и сравнивает их элементы. Для WER ему передают последовательности слов, а для CER — последовательности символов; сам алгоритм редактирования менять не требуется.
  id: 014-cer-2
  fingerprint: c514e393
