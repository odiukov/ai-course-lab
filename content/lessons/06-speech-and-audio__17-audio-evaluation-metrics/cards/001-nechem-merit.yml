- concept: сравнимость версий модели требует фиксированного тестового набора и одинаковой процедуры оценки
  question: Как корректно определить, улучшилось ли распознавание речи после обновления модели?
  explanation: Фиксированный размеченный набор и неизменная процедура изолируют влияние самой модели. Если записи или способ оценки меняются, различие WER нельзя уверенно приписать обновлению модели.
  kind: choice
  options:
    - Сравнить версии на одном размеченном наборе записей, используя одинаковую процедуру расчёта WER
    - Прослушать для каждой версии новые записи и выбрать субъективно более приятный результат
    - Оценить новую версию только на записях, где прежняя модель часто ошибалась
    - Попросить разных экспертов независимо подобрать тестовые записи для каждой версии
  correct: 0
  id: 001-nechem-merit-1
  fingerprint: d646426f
- concept: одна аудиометрика измеряет только отдельную ось качества и не заменяет набор вторичных метрик
  question: Новая ASR-модель показывает меньший WER, но заметно дольше выдаёт первый токен. Почему одного WER недостаточно для решения о релизе?
  explanation: Основная метрика помогает принять решение по ключевому качеству задачи, а вторичные метрики показывают компромиссы и причины результата. Для ASR низкий WER не гарантирует приемлемую скорость ответа.
  kind: open
  reference: WER оценивает ошибки в распознанных словах, но не измеряет задержку. Модель стала точнее по одной оси, однако могла ухудшить пользовательский опыт по другой, поэтому вместе с основной метрикой нужно проверять задержку и другие эксплуатационные показатели.
  id: 001-nechem-merit-2
  fingerprint: c88c97e8
