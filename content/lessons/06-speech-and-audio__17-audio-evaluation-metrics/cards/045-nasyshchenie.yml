- concept: использование отложенного набора для настройки загрязняет оценку и делает её оптимистичной
  question: Почему нельзя многократно подбирать промпты, нормализацию и параметры модели по результатам на внутреннем отложенном наборе? Объясни своими словами и укажи, как сохранить достоверность оценки.
  explanation: Отложенный набор должен имитировать ещё не встреченные продуктовые данные. Если решения о настройке принимаются по его результатам, информация о наборе постепенно проникает в модель и процедуру оценки, поэтому измерение теряет независимость.
  kind: open
  reference: Повторная настройка по результатам отложенного набора косвенно оптимизирует модель под его конкретные примеры. Набор перестаёт давать независимую оценку и начинает показывать завышенное качество. Его следует исключить из подгонки, а при существенном загрязнении заменить новым скрытым набором из целевого трафика.
