- concept: ELO из человеческих голосований является относительным рейтингом, а не абсолютной шкалой качества речи
  question: Объясни своими словами, почему разницу в ELO между TTS-системами нельзя интерпретировать как фиксированную величину разницы в естественности звучания.
  explanation: Рейтинг ELO зависит от результатов парных сравнений и силы соперников. Он хорошо передаёт относительный порядок предпочтений, но не сообщает абсолютную естественность речи в универсальных единицах.
  kind: open
  reference: ELO отражает результаты сравнений с другими участниками и показывает, какую систему слушатели чаще предпочитают в данном пуле. У него нет фиксированного аудиоэталона и абсолютной единицы естественности, поэтому разница рейтингов не равна измеренной разнице качества звучания.
