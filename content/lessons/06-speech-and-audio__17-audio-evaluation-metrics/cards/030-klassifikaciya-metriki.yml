- concept: macro F1 даёт каждому классу равный вес и выявляет бесполезность классификатора, угадывающего только доминирующий класс
  question: В датасете 7 классов, причём 84% примеров относятся к тишине. Модель всегда предсказывает тишину. У каждого из остальных классов есть примеры. Чему примерно равен macro F1 при нулевом F1 для непредсказываемых классов?
  explanation: Для тишины precision равен 84%, recall — 100%, поэтому её F1 ≈ 0.913. У остальных шести классов F1 равен нулю. Равновесное среднее по семи классам составляет примерно 0.130, хотя обычная accuracy равна 84%.
  kind: numeric
  answer: 0.13
  tolerance: 0.002
  id: 030-klassifikaciya-metriki-1
  fingerprint: 9216916f
- concept: recall класса равен доле найденных объектов среди всех истинных объектов этого класса
  question: В тестовом наборе есть 23 записи с сиреной. Классификатор обнаружил сирену в 17 из них, а всего выдал метку «сирена» для 29 записей. Как вычислить recall класса «сирена»?
  explanation: 'Recall отвечает на вопрос, какую долю всех настоящих сирен удалось найти, поэтому его знаменатель — 23 истинных примера. Отношение 17 / 29 характеризует precision: долю верных срабатываний среди всех предсказаний «сирена».'
  kind: choice
  options:
    - 17 / 29
    - 23 / 29
    - 17 / 23
  correct: 2
  id: 030-klassifikaciya-metriki-2
  fingerprint: e96c5f16
- concept: mAP вычисляется как среднее AP, рассчитанных отдельно для всех классов
  question: Заполни общую формулу для mean Average Precision, где C — множество классов, а AP_c — Average Precision класса c.
  explanation: Сначала для каждого класса независимо вычисляют Average Precision, затем эти значения усредняют. Поэтому каждый класс в итоговом mAP имеет одинаковый вес независимо от числа его примеров.
  kind: cloze
  template: mAP = ___
  answer: Σ_{c ∈ C} AP_c / |C|
  accept:
    - (Σ_c AP_c) / |C|
    - mean_c(AP_c)
    - среднее AP по классам
  id: 030-klassifikaciya-metriki-3
  fingerprint: 2583edff
