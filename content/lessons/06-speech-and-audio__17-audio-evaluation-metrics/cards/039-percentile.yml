  question: Какой фрагмент передаёт отсортированные замеры в функцию `select`, сохраняя исходный список `values` без изменений?
  explanation: '`sorted(values)` создаёт новый список. Метод `values.sort()` меняет исходный объект, а присваивание `ordered = values` создаёт лишь вторую ссылку на тот же объект.'
  kind: choice
