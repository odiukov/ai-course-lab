- concept: устойчивый результат ниже случайного уровня указывает на систематически ошибочную стратегию
  question: В достаточно большом multi-audio тесте есть шесть вариантов ответа на задание. Модель стабильно получает accuracy одиннадцать процентов, хотя случайный выбор дал бы примерно шестнадцать и семь десятых процента. Как это разумнее всего интерпретировать?
  explanation: Устойчивый результат ниже случайного уровня нельзя считать просто слабым пониманием. Он указывает, что ответы модели систематически смещены в неверную сторону — например, она учитывает только один фрагмент или опирается на посторонний признак.
  kind: choice
  options:
    - Модель, вероятно, использует систематически вводящий в заблуждение признак или неверную стратегию сравнения аудио
    - Модель надёжно понимает оба аудиофрагмента, поскольку её результат отличается от случайного
    - Результат эквивалентен случайному угадыванию при любом размере теста
