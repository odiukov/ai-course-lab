- concept: агрегированный балл бенчмарка может скрывать провал в категории, критичной для продукта
  question: Продукту прежде всего нужно сравнивать несколько аудиофрагментов. Модель A набрала шестьдесят восемь процентов в целом и девятнадцать процентов в нужной категории, а модель B — шестьдесят три и сорок девять процентов соответственно. Какую модель следует предпочесть и почему?
  explanation: 'Общий результат смешивает категории и зависит от их долей в тесте. При выборе модели важна разбивка по сценариям: высокий средний балл не компенсирует слабость именно в той способности, которая нужна продукту.'
  kind: open
  reference: 'Следует предпочесть модель B: её общий балл немного ниже, но она значительно лучше справляется с категорией, от которой зависит продукт. Итоговое среднее модели A скрывает провал в ключевом сценарии.'
