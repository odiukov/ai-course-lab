- concept: схлопывание пробельных символов создаёт однозначные границы слов
  question: Функция уже обработала регистр и пунктуацию. Заполни шаблон так, чтобы каждая последовательность пробельных символов стала одним пробелом, а пробелы по краям исчезли.
  explanation: Шаблон `\s+` находит подряд идущие пробелы, табуляции и переводы строк, а `strip()` удаляет пробелы по краям. Строка без слов после такой обработки корректно становится пустой.
  kind: cloze
  template: text = re.sub(r"___", " ", text).strip()
  answer: \s+
  accept:
    - \s+
    - '[\s]+'
