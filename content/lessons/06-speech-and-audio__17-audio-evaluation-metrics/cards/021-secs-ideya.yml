- concept: косинусная близость не меняется при положительном масштабировании ненулевого эмбеддинга
  question: Какое преобразование одного ненулевого эмбеддинга гарантированно не изменит его косинусную близость с другим эмбеддингом?
  explanation: Положительное масштабирование меняет длину вектора, но сохраняет его направление. Поэтому нормировка в формуле косинусной близости сокращает общий коэффициент.
  kind: choice
  options:
    - Добавление произвольного вектора
    - Перестановка координат только в этом эмбеддинге
    - Умножение всех координат на один положительный коэффициент
  correct: 2
  id: 021-secs-ideya-1
  fingerprint: 1bef1f2a
- concept: косинусная близость равна скалярному произведению, нормированному на произведение длин векторов
  question: Заполни знаменатель формулы косинусной близости двух голосовых эмбеддингов.
  explanation: Деление скалярного произведения на длины обоих векторов устраняет влияние их масштаба. Результат определяется углом между эмбеддингами.
  kind: cloze
  template: cos(a, b) = (a · b) / ___
  answer: (||a|| · ||b||)
  accept:
    - '||a|| * ||b||'
    - '||a||||b||'
    - произведение норм a и b
    - произведение длин a и b
