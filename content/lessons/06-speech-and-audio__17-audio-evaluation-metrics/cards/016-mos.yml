- concept: несколько слушателей и несколько сэмплов уменьшают разные источники ненадёжности MOS
  question: Почему при оценке TTS по MOS нужны и несколько слушателей на сэмпл, и набор разных сэмплов?
  explanation: Мнения людей различаются из-за вкусов, усталости и условий прослушивания, поэтому оценки усредняют по слушателям. Разные фразы нужны потому, что качество TTS может зависеть от длины, содержания и сложности текста.
  kind: choice
  options:
    - Слушатели уменьшают влияние индивидуальных предпочтений, а разные сэмплы проверяют качество модели на разнообразных высказываниях
    - Слушатели измеряют разборчивость, а разные сэмплы автоматически вычисляют естественность
    - Слушатели нужны только для ускорения эксперимента, а разные сэмплы — только для проверки оборудования
    - Обе меры устраняют исключительно ошибки округления при вычислении среднего
