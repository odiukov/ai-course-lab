- concept: совпадение средних не гарантирует нулевого расстояния Фреше при различном разбросе
  question: У двух одномерных гауссовских распределений одинаковые средние, но разные стандартные отклонения. Что верно об их расстоянии Фреше?
  explanation: При совпавших средних первый квадрат в формуле исчезает, но остаётся квадрат разности стандартных отклонений. Поэтому расстояние положительно и станет нулевым лишь при совпадении обоих параметров.
  kind: choice
  options:
    - Оно положительно из-за различия стандартных отклонений
    - Оно равно нулю, потому что средние совпадают
    - Оно отрицательно, если второе распределение имеет меньший разброс
    - Оно не определено для распределений с одинаковыми средними
