- concept: расстояние Левенштейна определяется самым дешёвым выравниванием последовательностей
  question: В эталоне стоит «запусти подкаст», а модель распознала «запусти музыку». Как следует учесть несовпадающие слова при поиске минимального расстояния Левенштейна?
  explanation: Прямую замену выбирают потому, что она требует меньше элементарных правок, чем последовательность удаления и вставки. Расстояние Левенштейна учитывает минимальную стоимость преобразования, а не произвольный подходящий путь.
  kind: choice
  options:
    - Как замену «подкаст» на «музыку»
    - Как удаление «подкаст», а затем вставку «музыку»
    - Оба варианта равноценны, поскольку приводят к одной строке
  correct: 0
