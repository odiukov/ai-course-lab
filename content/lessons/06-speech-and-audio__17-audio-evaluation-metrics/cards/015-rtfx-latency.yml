- concept: время обработки аудио равно его длительности, делённой на RTFx
  question: Запись длится 77 минут, а ASR-модель работает с RTFx 11×. Сколько минут займёт обработка?
  explanation: RTFx показывает, во сколько раз длительность обрабатываемого аудио превышает затраченное настенное время. Поэтому время обработки равно 77 / 11 = 7 минут.
  kind: numeric
  answer: 7
  tolerance: 0.01
  id: 015-rtfx-latency-1
  fingerprint: 3c75a11a
- concept: first-token latency измеряется от подачи аудио до появления первого токена транскрипта
  question: Какие два события должны служить границами измерения first-token latency ASR-системы?
  explanation: 'First-token latency характеризует начальную отзывчивость: таймер запускают при подаче аудио и останавливают, когда система выдаёт первый токен. Скорость обработки всей записи измеряет уже другую характеристику.'
  kind: choice
  options:
    - Начало подачи аудио и появление первого токена транскрипта
    - Начало и завершение обработки всей аудиозаписи
    - Появление первого и последнего токенов транскрипта
  correct: 0
  id: 015-rtfx-latency-2
  fingerprint: be4cdb5d
