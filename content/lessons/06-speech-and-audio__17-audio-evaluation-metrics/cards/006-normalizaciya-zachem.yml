- concept: нормализация выполняется до токенизации и выравнивания строк для подсчёта WER
  question: Расположите этапы оценки WER в правильном порядке.
  explanation: Если сначала разбить исходные строки на слова, различия в регистре, пунктуации и записи чисел попадут в выравнивание как ложные ошибки. Поэтому нормализация должна предшествовать токенизации и сравнению.
  kind: order
  items:
    - Одинаково нормализовать эталон и расшифровку модели
    - Разбить нормализованные строки на слова
    - Выровнять последовательности слов и определить ошибки
  id: 006-normalizaciya-zachem-2
  fingerprint: 59c7e1bf
- concept: числа разворачивают в слова, чтобы цифровая и словесная записи образовывали сопоставимые последовательности токенов
  question: Почему перед вычислением WER числа в эталоне и расшифровке модели следует приводить к единой словесной форме?
  explanation: WER сравнивает слова, а не смысл выражения. Единая словесная запись чисел позволяет сопоставлять то, что было произнесено, не смешивая ошибки распознавания с различиями письменного формата.
  kind: open
  reference: Цифровая запись обычно образует один токен, а произнесённое число может состоять из нескольких слов. Без разворачивания одинаковое содержание даст разные последовательности токенов и создаст ложные замены, вставки или удаления.
  id: 006-normalizaciya-zachem-3
  fingerprint: bd08ce7a
