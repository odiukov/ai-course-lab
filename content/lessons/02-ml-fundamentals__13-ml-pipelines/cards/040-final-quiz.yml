- concept: реестр моделей хранит версии моделей и их стадии жизненного цикла
  question: Объясни своими словами, чем Model Registry отличается от папки, в которой просто лежит последний файл модели.
  explanation: Обычная папка сама по себе не описывает историю и статус артефактов. Реестр моделей позволяет управлять версиями и явно фиксировать роль каждой из них в жизненном цикле.
  kind: open
  reference: Model Registry хранит и различает версии моделей, связывает их с метаданными и отмечает стадии жизненного цикла, например staging, production или archived.
