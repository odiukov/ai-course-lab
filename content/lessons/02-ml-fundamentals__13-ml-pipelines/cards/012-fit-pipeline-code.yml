- concept: защитная копия входных данных предотвращает побочные изменения объекта вызывающей стороны
  question: Почему реализация обучения пайплайна может начинать работу с копии входных строк?
  explanation: Преобразователи не всегда гарантируют отсутствие изменений на месте. Работа с копией делает поведение функции безопаснее и не оставляет неожиданных изменений во входном наборе данных.
  kind: open
  reference: Копия изолирует внутреннюю обработку пайплайна от объекта вызывающей стороны. Если какой-либо шаг изменяет полученные данные на месте, исходные обучающие строки останутся неизменными.
  id: 012-fit-pipeline-code-2
  fingerprint: 81a53eb3
