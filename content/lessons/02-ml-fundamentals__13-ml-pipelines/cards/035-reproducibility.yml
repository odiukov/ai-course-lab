- concept: seed необходимо задавать для каждого используемого источника случайности
  question: В эксперименте вызывают random.seed(s) и np.random.seed(s), но модель на PyTorch инициализируется без настройки генератора PyTorch. Зафиксирована ли случайность эксперимента полностью?
  explanation: Каждая библиотека может использовать собственный генератор случайных чисел. Seed нужно установить во всех задействованных источниках, включая random, NumPy и фреймворк модели.
  kind: choice
  options:
    - Да, NumPy автоматически управляет генератором PyTorch
    - Нет, у PyTorch есть собственный генератор, которому тоже нужно задать seed
    - Да, если гиперпараметры сохранены в конфиге
    - Нет, потому что seed в принципе не влияет на повторяемость
  correct: 1
  id: 035-reproducibility-1
  fingerprint: 5189c34d
- concept: воспроизводимый запуск требует фиксации зависимостей, данных и гиперпараметров наряду с seed
  question: Команда сохранила исходный код и задала seed во всех библиотеках, но зависимости указала без точных версий, обучение читает изменяемый файл latest.csv, а гиперпараметры правят вручную в коде. Что ещё нужно зафиксировать для воспроизводимого запуска?
  explanation: Одинаковые код и seed не компенсируют изменение поведения библиотек, содержимого данных или настроек модели. Для проверяемого повторения должны совпадать зависимости, версия данных и конфиг запуска.
  kind: open
  reference: Нужно сохранить точные версии зависимостей в lock-файле или requirements-файле, привязать запуск к конкретной версии данных и вынести все гиперпараметры в сохранённый конфиг.
  id: 035-reproducibility-2
  fingerprint: 0e71dedd
