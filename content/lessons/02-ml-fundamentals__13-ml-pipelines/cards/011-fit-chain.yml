- concept: каждый этап пайплайна получает результат предыдущего преобразования
  question: Расположите действия в порядке обучения пайплайна из преобразователей признаков и итоговой модели.
  explanation: Пайплайн хранит текущую версию признаков и после каждого fit_transform заменяет её результатом преобразования. Поэтому модель обучается на данных, последовательно обработанных всеми предыдущими этапами.
  kind: order
  items:
    - Передать исходные признаки первому преобразователю и получить результат fit_transform
    - Передать полученный результат следующему преобразователю и снова получить преобразованные признаки
    - Передать итоговое представление признаков модели и обучить её вместе с целевой переменной y
  id: 011-fit-chain-1
  fingerprint: 39fafe50
- concept: целевая переменная не проходит через преобразователи признаков и передаётся итоговой модели
  question: Почему в пайплайне, где преобразователи не меняют количество и порядок строк, целевую переменную y не нужно передавать от одного преобразователя признаков к другому?
  explanation: Пока преобразования сохраняют строки и их порядок, каждому преобразованному объекту соответствует прежнее значение y. Через цепочку передаётся только текущая версия X, а модель получает итоговый X и исходный y.
  kind: open
  reference: Преобразователи меняют только представление X, сохраняя соответствие строк целевым значениям. Поэтому y остаётся неизменной и передаётся вместе с итоговыми признаками непосредственно при обучении модели.
  id: 011-fit-chain-2
  fingerprint: fe0a123c
