  fingerprint: debe3255
- concept: юнит-тесты проверяют отдельные трансформеры, а интеграционные тесты — работу пайплайна целиком
  question: Объясните своими словами, зачем ML-пайплайну нужны и юнит-тесты трансформеров, и интеграционные тесты всей цепочки.
  explanation: Исправность каждого компонента ещё не гарантирует исправность их композиции. Поэтому локальные ошибки ищут юнит-тестами, а проблемы соединения этапов и полного сценария — интеграционными тестами.
  kind: open
  reference: Юнит-тесты локально проверяют поведение отдельных преобразователей на контролируемых входах. Интеграционные тесты подтверждают, что компоненты совместимы, правильно передают результаты друг другу и вместе выполняют полный сценарий обучения или инференса.
  id: 036-notebook-to-prod-3
  fingerprint: 71c9073a
