- concept: 'базовый порядок структурирования ML-эксперимента: функции, пайплайн, конфигурация и трекинг'
  question: Расположите ранние этапы превращения исследовательского ноутбука в воспроизводимый ML-пайплайн.
  explanation: Сначала код освобождают от зависимости от порядка ячеек, затем компонуют в пайплайн. После этого настройки выносят в конфигурацию, а результаты запусков связывают с параметрами и артефактами посредством трекинга.
  kind: order
  items:
    - Вынести загрузку данных, подготовку признаков, обучение и оценку в функции
    - Соединить преобразования и модель в объект Pipeline
    - Перенести гиперпараметры в YAML- или JSON-конфигурацию
    - Добавить трекинг настроек, метрик и артефактов эксперимента
  id: 036-notebook-to-prod-1
  fingerprint: b2e27943
- concept: валидация данных до обучения проверяет схему, распределения и пропуски
  question: Перед очередным обучением требуется автоматически обнаружить исчезнувший столбец, неожиданное изменение типа признака и резкий рост доли пропусков. Какой этап предназначен для этих проверок?
  explanation: Валидация данных проверяет входную схему, распределения и пропуски до запуска обучения. Трекинг сохраняет сведения об эксперименте, а сериализация и контейнеризация подготавливают уже созданный артефакт к эксплуатации.
  kind: choice
  options:
    - Валидация данных
    - Трекинг экспериментов
    - Сериализация модели
    - Упаковка сервиса в контейнер
  correct: 0
