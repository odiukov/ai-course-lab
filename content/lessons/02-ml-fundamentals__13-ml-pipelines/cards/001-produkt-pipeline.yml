- concept: ML-пайплайн проводит данные через упорядоченную цепочку от сырого запроса до предсказания
  question: Расположите этапы инференса ML-системы в правильном порядке.
  explanation: Модель ожидает признаки в том же подготовленном виде, в котором видела их при обучении. Поэтому сырой запрос сначала проходит все преобразования и только затем передаётся модели.
  kind: order
  items:
    - Получить новую необработанную запись
    - Проверить данные и заполнить пропуски
    - Преобразовать числовые и категориальные признаки
    - Передать подготовленные признаки модели
    - Вернуть готовое предсказание
  id: 001-produkt-pipeline-1
  fingerprint: 11ee7774
- concept: в продакшене следует сохранять и применять модель вместе со всей логикой предобработки
  question: Команда сохранила только обученный классификатор, а код подготовки признаков отдельно переписала в сервисе. Какой основной риск возникает?
  explanation: Отдельные реализации предобработки могут отличаться порядком операций, статистиками и правилами кодирования. Единый сохранённый пайплайн фиксирует преобразования вместе с моделью и одинаково обрабатывает новые запросы.
  kind: choice
  options:
    - Подготовка данных в сервисе может разойтись с подготовкой при обучении, и модель получит признаки другого вида
    - Классификатор автоматически перестанет поддерживать метод predict
    - Сырые данные начнут изменять параметры уже обученного классификатора
    - Сервис обязательно будет возвращать один и тот же класс для всех запросов
