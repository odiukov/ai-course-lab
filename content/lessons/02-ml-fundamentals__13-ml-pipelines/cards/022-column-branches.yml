- concept: ColumnTransformer направляет группы столбцов в разные ветки и объединяет результаты по признакам с сохранением соответствия строк
  question: Расположи этапы работы ColumnTransformer в правильном порядке.
  explanation: ColumnTransformer выбирает указанные группы столбцов, независимо преобразует каждую группу и соединяет полученные признаки по столбцам. Поэтому данные одного объекта не смешиваются с данными другого.
  kind: order
  items:
    - Направить заданные числовые и категориальные столбцы в соответствующие ветки
    - Применить внутри каждой ветки предназначенную для неё последовательность преобразований
    - Объединить выходные признаки веток в общую таблицу, сохранив соответствие исходным строкам
  id: 022-column-branches-2
  fingerprint: 861fba52
