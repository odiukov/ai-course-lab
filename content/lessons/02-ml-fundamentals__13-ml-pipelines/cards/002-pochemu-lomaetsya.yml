- concept: расхождение копий предобработки создаёт несоответствие между обучением и инференсом
  question: Почему отдельные копии кода подготовки признаков для обучения и сервинга опасны, даже если изначально они одинаковы?
  explanation: 'Если исправление или новое преобразование попадает только в одну копию, возникает train-serving skew: смысл входных признаков на обучении и в продакшене перестаёт совпадать.'
  kind: open
  reference: Копии могут изменяться независимо, поэтому модель начнёт получать на инференсе признаки, подготовленные иначе, чем при обучении. Такое расхождение делает предсказания ненадёжными.
  id: 002-pochemu-lomaetsya-2
  fingerprint: eb25ee0a
- concept: категориальный энкодер должен корректно обрабатывать неизвестные при обучении значения
  question: В продакшене категориальный энкодер получил значение, которого не было при его обучении. Какой риск возникает непосредственно на этапе преобразования?
  explanation: Энкодер знает только категории, встреченные при обучении. Если заранее не определить поведение для неизвестных значений, обработка реального запроса может сломаться или дать несовместимые признаки.
  kind: choice
  options:
    - Энкодер автоматически переобучит всю модель
    - Преобразование может завершиться ошибкой или сформировать некорректное представление категории
    - Тестовая метрика обязательно станет равна обучающей
  correct: 1
