- concept: корректность сериализации пайплайна проверяется сравнением предсказаний до и после загрузки
  question: Расположите действия для проверки того, что сериализованный ML-пайплайн сохранил своё поведение.
  explanation: Само отсутствие ошибки при загрузке доказывает лишь читаемость файла. Корректность восстановления подтверждается тем, что исходный и загруженный пайплайны одинаково обрабатывают одни и те же входные данные.
  kind: order
  items:
    - Получить эталонные предсказания обученного пайплайна на контрольных данных
    - Сохранить пайплайн и загрузить его как новый объект
    - Получить предсказания загруженного пайплайна на тех же контрольных данных
    - Сравнить новые предсказания с эталонными
  id: 029-load-artifact-1
  fingerprint: 541e3246
- concept: метки классов сравнивают точно, а дробные выходы модели — с малой численной погрешностью
  question: Как корректнее сравнить выходы исходного и загруженного классификационных пайплайнов на одинаковых данных?
  explanation: Метки являются дискретными результатами, поэтому для них ожидается полное поэлементное совпадение. У дробных значений последние разряды могут немного различаться из-за вычислительной среды, поэтому их обычно сравнивают с небольшой погрешностью.
  kind: choice
  options:
    - И метки классов, и вероятности должны совпасть только приблизительно
    - Метки классов должны совпасть точно, а вероятности можно сравнить с малой допустимой погрешностью
    - Достаточно проверить совпадение среднего значения вероятностей
    - Достаточно убедиться, что оба пайплайна вернули одинаковое количество ответов
  correct: 1
