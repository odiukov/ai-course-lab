- concept: статус Production указывает версию модели, обслуживающую пользователей
  question: В реестре моделей одна версия имеет статус Staging, другая — Production, а третья — Archived. Какая версия должна использоваться рабочим сервисом?
  explanation: Production обозначает рабочую версию для пользователей. Staging предназначен для проверки кандидата, а Archived сохраняет старую версию в истории, но исключает её из активной работы.
  kind: choice
  options:
    - Версия со статусом Staging
    - Версия со статусом Production
    - Версия со статусом Archived
  correct: 1
  id: 033-model-registry-1
  fingerprint: b5d9cd66
- concept: кандидат становится рабочей моделью только после явного одобрения и перевода в Production
  question: Расположите этапы выпуска новой версии модели в безопасном порядке.
  explanation: Регистрация создаёт версию, Staging позволяет проверить её до выпуска, а явное одобрение и перевод в Production не дают случайному эксперименту автоматически попасть к пользователям.
  kind: order
  items:
    - Зарегистрировать обученный артефакт как новую версию
    - Перевести версию в Staging
    - Проверить версию и получить одобрение
    - Явно перевести одобренную версию в Production
  id: 033-model-registry-2
