- concept: откат возвращает ранее зарегистрированную версию в Production без повторного обучения
  question: Рабочая версия модели начала выдавать некорректные результаты, а предыдущая проверенная версия сохранена в реестре. Объясните, как выполнить откат и почему для этого не требуется срочно переобучать модель.
  explanation: Реестр хранит отдельные версии моделей и их рабочие роли. Поэтому при откате меняют выбранную для Production версию, а не создают модель заново.
  kind: open
  reference: Нужно вернуть предыдущей проверенной версии статус Production, а проблемную версию вывести из рабочей роли, например перевести в Staging или Archived. Переобучение не требуется, потому что готовый артефакт предыдущей версии уже хранится в реестре.
