- concept: идентификатор запуска связывает метрику с породившим её артефактом модели
  question: Команда выбрала запуск с наибольшей validation AUC. Как получить модель, которая действительно дала эту метрику?
  explanation: Метрика и модель соответствуют друг другу, только если зарегистрированы в одном запуске. Поэтому модель нужно загружать из артефактов конкретного run ID, а не выбирать по имени или времени создания файла.
  kind: choice
  options:
    - Загрузить артефакт модели из запуска с выбранным идентификатором
    - Взять самый новый файл модели из общей папки
    - Заново обучить модель по запомнившимся гиперпараметрам
    - Взять любую модель из того же эксперимента
  correct: 0
  id: 032-experiment-tracking-1
  fingerprint: 856abced
- concept: трекер различает параметры запуска, полученные метрики и созданные артефакты
  question: В запуске зарегистрированы learning_rate, validation F1 и файл обученного пайплайна. Как правильно классифицировать эти записи?
  explanation: learning_rate выбирают до обучения, поэтому это параметр. Validation F1 получают при оценке, поэтому это метрика. Сохранённый обученный пайплайн является артефактом запуска.
  kind: choice
  options:
    - Метрика, параметр, параметр
    - Параметр, метрика, артефакт
    - Артефакт, параметр, метрика
    - Параметр, артефакт, метрика
  correct: 1
  id: 032-experiment-tracking-2
  fingerprint: 7e167187
- concept: трекинг фиксирует происхождение результата, но не гарантирует корректность эксперимента
  question: Трекер сохранил гиперпараметры, высокую тестовую метрику и модель одного запуска. Объясни, что эта запись доказывает, а что остаётся проверять отдельно.
  explanation: Трекер отвечает за журналирование и происхождение артефактов. Корректность данных, разбиения и процедуры оценки должна обеспечиваться самим ML-процессом.
  kind: open
  reference: Запись доказывает связь между указанными параметрами, полученной метрикой и сохранённой моделью в рамках запуска. Она сама по себе не доказывает отсутствие утечки данных, правильность разбиения выборки, качество данных или честность методики оценки.
  id: 032-experiment-tracking-3
  fingerprint: 3ab545af
