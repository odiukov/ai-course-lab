- concept: нулевое стандартное отклонение заменяют ненулевым делителем, чтобы корректно обработать постоянный признак
  question: Почему преобразователь стандартизации должен отдельно обрабатывать столбец с нулевым стандартным отклонением?
  explanation: У постоянного признака стандартное отклонение равно нулю, поэтому обычная формула стандартизации делила бы на ноль. Замена делителя на единицу сохраняет корректность вычислений.
  kind: open
  reference: 'Деление на нулевое стандартное отклонение привело бы к некорректным значениям. Его можно заменить единицей: после вычитания среднего постоянный обучающий столбец всё равно состоит из нулей.'
  id: 006-fit-step-2
  fingerprint: b455fdff
