<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Путь от первого запроса до первого токена</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f4f7fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #627087;
      --line: #34445d;
      --border: #d8e0ec;
      --row: #f4f7fb;
      --node: #3478d4;
      --image: #d86e24;
      --hbm: #7656c8;
      --init: #168778;
      --forward: #c84255;
      --inside: #ffffff;
      --focus: #172033;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    body {
      padding: 12px;
    }

    .figure {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
    }

    .figure-header {
      padding: 14px 18px 8px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: normal;
      font-weight: bold;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 440px;
      overflow: hidden;
      background: var(--panel);
    }

    .fallback {
      margin: 0;
      padding: 24px;
      color: var(--muted);
      font-size: 16px;
    }

    [hidden] {
      display: none;
    }

    .stage {
      stroke: var(--panel);
      stroke-width: 2px;
    }

    .stage-node,
    .swatch-node {
      fill: var(--node);
    }

    .stage-image,
    .swatch-image {
      fill: var(--image);
    }

    .stage-hbm,
    .swatch-hbm {
      fill: var(--hbm);
    }

    .stage-init,
    .swatch-init {
      fill: var(--init);
    }

    .stage-forward,
    .swatch-forward {
      fill: var(--forward);
    }

    .duration {
      fill: var(--inside);
      font-size: 15px;
      font-weight: bold;
      pointer-events: none;
    }

    .flow-line,
    .leader,
    .marker-line {
      fill: none;
      stroke: var(--line);
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .marker-line {
      stroke-width: 3px;
    }

    .arrow-head {
      fill: var(--line);
    }

    .node-dot {
      fill: var(--panel);
      stroke: var(--node);
      stroke-width: 3px;
    }

    .token-dot {
      fill: var(--forward);
      stroke: var(--panel);
      stroke-width: 3px;
    }

    .endpoint {
      fill: var(--ink);
      font-size: 16px;
      font-weight: bold;
    }

    .endpoint-detail {
      fill: var(--muted);
      font-size: 14px;
    }

    .sequence-note {
      fill: var(--muted);
      font-size: 15px;
      font-weight: bold;
    }

    .event-label {
      fill: var(--ink);
      font-size: 14px;
      font-weight: bold;
    }

    .legend-title {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
    }

    .legend-back {
      fill: var(--row);
    }

    .legend-main {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
    }

    .legend-detail {
      fill: var(--muted);
      font-size: 14px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --page: #0d1420;
        --panel: #141e2d;
        --ink: #eef4ff;
        --muted: #a9b7cb;
        --line: #b7c4d8;
        --border: #304057;
        --row: #1a2738;
        --node: #4a91ec;
        --image: #e58139;
        --hbm: #9274e3;
        --init: #25a895;
        --forward: #e05a6d;
        --inside: #ffffff;
        --focus: #eef4ff;
      }

      html,
      body,
      .figure,
      svg {
        background: var(--page);
      }

      .figure,
      svg {
        background: var(--panel);
      }
    }
  </style>
</head>
<body>
  <main class="figure" aria-labelledby="diagram-heading">
    <header class="figure-header">
      <h1 id="diagram-heading">Путь от первого запроса до первого токена</h1>
      <p class="subtitle">Холодный старт — последовательная, а не параллельная цепочка</p>
    </header>

    <p class="fallback" id="fallback">
      Схема должна была показать последовательные этапы холодного старта:
      от принятого запроса через подготовку GPU-сервиса до первого токена.
    </p>

    <svg
      id="diagram"
      width="1200"
      height="430"
      viewBox="0 0 1200 430"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-heading diagram-description"
    >
      <desc id="diagram-description">
        Временная шкала холодного старта от запроса в восемь утра до первого
        токена после выделения ноды, скачивания образа, загрузки весов в HBM,
        инициализации движка и первого forward.
      </desc>
    </svg>
  </main>

  <script>
    const diagramData = [
      {
        kind: "layout",
        origin: Object.freeze({ x: 82, y: 0 }),
        scale: Object.freeze({ x: 3.08, y: 1 }),
        barTop: 135,
        barBottom: 185,
        flowY: 212,
        startMarkerTop: 121,
        markerBottom: 224,
        endMarkerTop: 91,
        startLabelY: 111,
        sequenceY: 106,
        tokenTitleY: 47,
        tokenTotalY: 68,
        tokenLeaderTop: 77,
        nodeLabelY: 239,
        forwardLabelY: 239,
        forwardLeaderY: 225,
        legendTitleY: 269,
        legendRows: [300, 329, 358, 387, 416],
        legendRowHeight: 24,
        legendTextX: 10,
        legendDetailX: 178,
        swatchWidth: 6,
        swatchHeight: 16,
        swatchRadius: 2,
        arrowX: 7,
        arrowY: 6,
        dotRadius: 5,
        midDivisor: 2,
        zero: 0
      },
      {
        kind: "stage",
        label: "Выделение GPU-ноды — 50 с",
        detail: "машина есть, модели ещё нет",
        seconds: 50,
        stageClass: "stage-node",
        swatchClass: "swatch-node",
        inside: true
      },
      {
        kind: "stage",
        label: "Скачивание образа 30 ГБ — 180 с",
        detail: "образ и веса попадают на диск",
        seconds: 180,
        stageClass: "stage-image",
        swatchClass: "swatch-image",
        inside: true
      },
      {
        kind: "stage",
        label: "Загрузка весов в HBM — 75 с",
        detail: "GPU получает веса в быстрой памяти",
        seconds: 75,
        stageClass: "stage-hbm",
        swatchClass: "swatch-hbm",
        inside: true
      },
      {
        kind: "stage",
        label: "Инициализация vLLM / TRT-LLM — 20 с",
        detail: "CUDA-графы, KV-кэш и токенизатор",
        seconds: 20,
        stageClass: "stage-init",
        swatchClass: "swatch-init",
        inside: true
      },
      {
        kind: "stage",
        label: "Первый forward — 3 с",
        detail: "запрос выходит из очереди",
        seconds: 3,
        stageClass: "stage-forward",
        swatchClass: "swatch-forward"
      }
    ];

    const layout = diagramData.find((item) => item.kind === "layout");
    const stages = diagramData.filter((item) => item.kind === "stage");
    const origin = layout.origin;
    const scale = layout.scale;
    const sx = (x) => origin.x + x * scale.x;
    const sy = (y) => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      const make = (name, attributes, content) => {
        const element = document.createElementNS(namespace, name);
        Object.entries(attributes).forEach(([key, value]) => {
          element.setAttribute(key, String(value));
        });
        if (content !== undefined) {
          element.textContent = content;
        }
        return element;
      };

      const add = (element) => {
        svg.appendChild(element);
        return element;
      };

      const text = (x, y, content, className, anchor) =>
        make(
          "text",
          {
            x: sx(x),
            y: sy(y),
            class: className,
            "text-anchor": anchor,
            "dominant-baseline": "middle"
          },
          content
        );

      const line = (xStart, yStart, xEnd, yEnd, className) =>
        make("line", {
          x1: sx(xStart),
          y1: sy(yStart),
          x2: sx(xEnd),
          y2: sy(yEnd),
          class: className
        });

      const rect = (xStart, yStart, xEnd, yEnd, className) =>
        make("rect", {
          x: sx(xStart),
          y: sy(yStart),
          width: sx(xEnd) - sx(xStart),
          height: sy(yEnd) - sy(yStart),
          class: className
        });

      const total = stages.reduce(
        (sum, stage) => sum + stage.seconds,
        layout.zero
      );
      const barMiddle =
        (layout.barTop + layout.barBottom) / layout.midDivisor;

      let cursor = layout.zero;

      stages.forEach((stage) => {
        const start = cursor;
        const end = start + stage.seconds;
        const middle = (start + end) / layout.midDivisor;

        add(
          rect(
            start,
            layout.barTop,
            end,
            layout.barBottom,
            `stage ${stage.stageClass}`
          )
        );

        if (stage.inside) {
          add(
            text(
              middle,
              barMiddle,
              `${stage.seconds} с`,
              "duration",
              "middle"
            )
          );
        }

        cursor = end;
      });

      add(
        line(
          layout.zero,
          layout.flowY,
          total,
          layout.flowY,
          "flow-line"
        )
      );

      add(
        make("polygon", {
          points: [
            `${sx(total)},${sy(layout.flowY)}`,
            `${sx(total - layout.arrowX)},${sy(
              layout.flowY - layout.arrowY
            )}`,
            `${sx(total - layout.arrowX)},${sy(
              layout.flowY + layout.arrowY
            )}`
          ].join(" "),
          class: "arrow-head"
        })
      );

      add(
        line(
          layout.zero,
          layout.startMarkerTop,
          layout.zero,
          layout.markerBottom,
          "marker-line"
        )
      );

      add(
        line(
          total,
          layout.endMarkerTop,
          total,
          layout.markerBottom,
          "marker-line"
        )
      );

      const nodeReady = stages.find(
        (stage) => stage.stageClass === "stage-node"
      ).seconds;

      add(
        line(
          nodeReady,
          layout.barTop,
          nodeReady,
          layout.markerBottom,
          "leader"
        )
      );

      add(
        make("circle", {
          cx: sx(nodeReady),
          cy: sy(layout.flowY),
          r: sy(layout.dotRadius) - sy(layout.zero),
          class: "node-dot"
        })
      );

      add(
        make("circle", {
          cx: sx(total),
          cy: sy(layout.flowY),
          r: sy(layout.dotRadius) - sy(layout.zero),
          class: "token-dot"
        })
      );

      add(
        text(
          layout.zero,
          layout.startLabelY,
          "8:00 · запрос принят, ожидание",
          "endpoint",
          "start"
        )
      );

      add(
        text(
          total / layout.midDivisor,
          layout.sequenceY,
          "этапы идут последовательно — следующий ждёт предыдущий",
          "sequence-note",
          "middle"
        )
      );

      add(
        text(
          total,
          layout.tokenTitleY,
          "первый токен",
          "endpoint",
          "end"
        )
      );

      add(
        text(
          total,
          layout.tokenTotalY,
          `итого ${total} с`,
          "endpoint-detail",
          "end"
        )
      );

      add(
        line(
          total,
          layout.tokenLeaderTop,
          total,
          layout.endMarkerTop,
          "leader"
        )
      );

      add(
        text(
          nodeReady,
          layout.nodeLabelY,
          "нода готова, модель ещё нет",
          "event-label",
          "middle"
        )
      );

      const forward = stages.find(
        (stage) => stage.stageClass === "stage-forward"
      );
      const forwardStart = total - forward.seconds;
      const forwardMiddle =
        (forwardStart + total) / layout.midDivisor;

      add(
        line(
          forwardMiddle,
          layout.barBottom,
          forwardMiddle,
          layout.forwardLeaderY,
          "leader"
        )
      );

      add(
        text(
          total,
          layout.forwardLabelY,
          `${forward.seconds} с · первый forward`,
          "event-label",
          "end"
        )
      );

      add(
        text(
          layout.zero,
          layout.legendTitleY,
          "Что происходит на каждом участке",
          "legend-title",
          "start"
        )
      );

      stages.forEach((stage, index) => {
        const rowY = layout.legendRows[index];
        const rowTop =
          rowY - layout.legendRowHeight / layout.midDivisor;
        const rowBottom =
          rowY + layout.legendRowHeight / layout.midDivisor;
        const swatchTop =
          rowY - layout.swatchHeight / layout.midDivisor;
        const swatchBottom =
          rowY + layout.swatchHeight / layout.midDivisor;

        add(
          rect(
            layout.zero,
            rowTop,
            total,
            rowBottom,
            "legend-back"
          )
        );

        const swatch = rect(
          layout.zero,
          swatchTop,
          layout.swatchWidth,
          swatchBottom,
          stage.swatchClass
        );

        swatch.setAttribute(
          "rx",
          sy(layout.swatchRadius) - sy(layout.zero)
        );
        swatch.setAttribute(
          "ry",
          sy(layout.swatchRadius) - sy(layout.zero)
        );
        add(swatch);

        add(
          text(
            layout.legendTextX,
            rowY,
            stage.label,
            "legend-main",
            "start"
          )
        );

        add(
          text(
            layout.legendDetailX,
            rowY,
            stage.detail,
            "legend-detail",
            "start"
          )
        );
      });

      fallback.hidden = true;
    } catch (error) {
      document.getElementById("fallback").hidden = false;
      document.getElementById("fallback").textContent =
        "Схема должна была показать последовательный путь холодного старта: запрос ждёт выделения ноды, загрузки файлов и весов, подготовки движка и первого вычисления, после которого появляется первый токен.";
    }
  </script>
</body>
</html>
