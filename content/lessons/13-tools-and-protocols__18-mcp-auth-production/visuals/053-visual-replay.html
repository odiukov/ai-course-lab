<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Четыре шага валидатора сервера B</title>
<style>
  :root{
    --bg:#fbfbfd; --fg:#1a1c22; --muted:#5a6072;
    --ok:#1a7f4b; --okbg:#e4f6ec; --bad:#b3261e; --badbg:#fdeae8;
    --line:#8b91a4; --card:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14161c; --fg:#e8eaf0; --muted:#a2a9bd;
      --ok:#5fd39b; --okbg:#123227; --bad:#ff8a80; --badbg:#3a1c1a;
      --line:#6d748a; --card:#1c1f28;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  .wrap{max-width:900px;margin:0 auto;padding:10px 12px 14px;}
  h2{font-size:15px;margin:0 0 6px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
  .fallback{font-size:13px;line-height:1.5;color:var(--fg);}
</style>
</head>
<body>
<div class="wrap">
  <h2>Четыре шага валидатора сервера B (<span class="mono">tasks.example.com</span>)</h2>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    // ---------- данные схемы ----------
    var STEPS = [
      {n:"1", ok:true,  t:"Подпись",  d:"JWT разобран, ключ найден по kid — подпись сходится"},
      {n:"2", ok:true,  t:"iss",      d:"iss есть в authorization_servers — тот же IdP"},
      {n:"3", ok:false, t:"aud",      d:"в токене https://notes.example.com, ждём https://tasks.example.com"},
      {n:"4", ok:false, t:"401",      d:"invalid_token, audience mismatch, resource_metadata"}
    ];
    var TOKEN = "украденный токен: aud=https://notes.example.com";

    // ---------- одна система координат ----------
    var ORIGIN = {x:14, y:12}, SCALE = 4;
    function sx(x){ return ORIGIN.x + SCALE * x; }
    function sy(y){ return ORIGIN.y + SCALE * y; }

    // единицы схемы
    var W = 200, CARD_W = 148, CARD_H = 20, GAP = 6, TOP = 18, LEFT = 26;
    var FS = 11, FS_S = 9.5, PAD = 8;

    var NS="http://www.w3.org/2000/svg";
    function el(n,a){ var e=document.createElementNS(NS,n);
      for(var k in a) e.setAttribute(k,a[k]); return e; }

    var svg = el('svg',{viewBox:"0 0 "+sx(W)+" "+sy(TOP+4*(CARD_H+GAP)+12),
      preserveAspectRatio:"xMidYMid meet", role:"img",
      "aria-label":"Четыре шага валидации токена сервером B"});

    var defs = el('defs',{});
    ['line','bad'].forEach(function(kind){
      var m = el('marker',{id:"ah-"+kind, markerWidth:"7", markerHeight:"7",
        refX:"6", refY:"3.2", orient:"auto"});
      var p = el('path',{d:"M0,0 L6.4,3.2 L0,6.4 z",
        fill: kind==='bad' ? "var(--bad)" : "var(--line)"});
      m.appendChild(p); defs.appendChild(m);
    });
    svg.appendChild(defs);

    function text(x,y,s,opt){
      opt = opt||{};
      var t = el('text',{x:sx(x)+(opt.dx||0), y:sy(y)+(opt.dy||0),
        "text-anchor":opt.anchor||"start",
        "font-size":(opt.fs||FS), fill:opt.fill||"var(--fg)"});
      if(opt.mono) t.setAttribute('class','mono');
      if(opt.weight) t.setAttribute('font-weight',opt.weight);
      t.textContent = s;
      return t;
    }

    // ---------- входящий токен ----------
    svg.appendChild(text(LEFT, TOP - 7, TOKEN,
      {anchor:"start", fs:FS_S, mono:true, fill:"var(--bad)", dy:-2}));

    var tokX = LEFT + 6;
    svg.appendChild(el('line',{x1:sx(tokX), y1:sy(TOP-5), x2:sx(tokX), y2:sy(TOP-1),
      stroke:"var(--bad)", "stroke-width":1.6, "marker-end":"url(#ah-bad)"}));

    // ---------- четыре плашки ----------
    STEPS.forEach(function(s,i){
      var y = TOP + i*(CARD_H+GAP);
      var col = s.ok ? "var(--ok)" : "var(--bad)";
      var bgc = s.ok ? "var(--okbg)" : "var(--badbg)";

      svg.appendChild(el('rect',{x:sx(LEFT), y:sy(y), rx:SCALE,
        width:sx(LEFT+CARD_W)-sx(LEFT), height:sy(y+CARD_H)-sy(y),
        fill:bgc, stroke:col, "stroke-width":1.2}));

      // номер шага — слева от плашки, якорь end
      svg.appendChild(text(LEFT, y+CARD_H/2, "шаг "+s.n,
        {anchor:"end", dx:-PAD, dy:4, fs:FS, weight:"600", fill:"var(--muted)"}));

      // заголовок внутри плашки, слева
      svg.appendChild(text(LEFT, y+7, s.t,
        {anchor:"start", dx:PAD, dy:4, fs:FS, weight:"700", fill:col, mono:true}));

      // описание внутри плашки, ниже заголовка
      svg.appendChild(text(LEFT, y+15, s.d,
        {anchor:"start", dx:PAD, dy:4, fs:FS_S, fill:"var(--fg)"}));

      // маркер ок/провал — справа внутри плашки, якорь end
      svg.appendChild(text(LEFT+CARD_W, y+CARD_H/2, s.ok ? "✓ ок" : "✕ стоп",
        {anchor:"end", dx:-PAD, dy:4, fs:FS, weight:"700", fill:col}));

      // стрелка к следующей плашке
      if(i < STEPS.length-1){
        var bad = !s.ok;
        svg.appendChild(el('line',{
          x1:sx(tokX), y1:sy(y+CARD_H), x2:sx(tokX), y2:sy(y+CARD_H+GAP),
          stroke: bad ? "var(--bad)" : "var(--line)", "stroke-width":1.6,
          "marker-end":"url(#ah-"+(bad?"bad":"line")+")"}));
      }
    });

    // ---------- подпись сбоку у шага 3 (у хвоста мысли, справа от плашки) ----------
    var y3 = TOP + 2*(CARD_H+GAP);
    svg.appendChild(text(LEFT+CARD_W, y3+6, "сравнение строк,",
      {anchor:"start", dx:PAD, dy:0, fs:FS_S, fill:"var(--muted)"}));
    svg.appendChild(text(LEFT+CARD_W, y3+12, "не криптография",
      {anchor:"start", dx:PAD, dy:0, fs:FS_S, fill:"var(--muted)"}));
    svg.appendChild(text(LEFT+CARD_W, y3+18, "на каждом запросе",
      {anchor:"start", dx:PAD, dy:0, fs:FS_S, fill:"var(--muted)"}));

    // ---------- нижняя строка-легенда ----------
    var yEnd = TOP + 4*(CARD_H+GAP);
    svg.appendChild(text(LEFT, yEnd + 4,
      "access-token privilege restriction: токен, не назвавший тебя в aud, отклоняется",
      {anchor:"start", fs:FS_S, fill:"var(--muted)"}));

    host.appendChild(svg);
  }catch(e){
    var d = document.createElement('div');
    d.className = 'fallback';
    d.textContent = "Схема должна показывать четыре шага валидатора сервера B "
      + "(tasks.example.com) для украденного токена с aud=https://notes.example.com: "
      + "1) подпись по kid — ок; 2) iss в authorization_servers — ок; "
      + "3) aud не совпал (https://notes.example.com против https://tasks.example.com) — провал; "
      + "4) ответ 401 с error=\"invalid_token\", error_description=\"audience mismatch\" "
      + "и resource_metadata.";
    host.appendChild(d);
  }
})();
</script>
</body>
</html>
