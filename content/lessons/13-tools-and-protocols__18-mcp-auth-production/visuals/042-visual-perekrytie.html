<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Окно перекрытия ключей</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1c2330; --muted:#5b6676; --axis:#8a94a4;
    --old:#c2410c; --oldbg:#fdd9c2; --new:#1d4ed8; --newbg:#cfdcfb;
    --band:#f59e0b; --tok:#047857; --tokbg:#c7ece0; --danger:#b91c1c;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#11151c; --fg:#e7ecf3; --muted:#98a3b3; --axis:#65707f;
      --old:#fb923c; --oldbg:#4a2a12; --new:#93b4fd; --newbg:#1b2b52;
      --band:#fbbf24; --tok:#5eead4; --tokbg:#123c34; --danger:#f87171;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:8px 10px}
  h2{font-size:15px;margin:0 0 6px}
  svg{display:block;width:100%;height:auto;max-height:520px}
  .fail{color:var(--danger);font-size:13px}
</style>
<div class="wrap">
  <h2>Окно перекрытия ключей: новый публикуется рядом со старым</h2>
  <svg id="s" viewBox="0 0 940 320" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Лента времени смены ключа"></svg>
  <p id="fb" class="fail" hidden></p>
</div>
<script>
(function(){
try{
  /* ---- данные схемы (минуты от 09:00) ---- */
  var D={
    keys:[{id:"k_2026_03",from:0,to:119,lane:0,cls:"old"},
          {id:"k_2026_04",from:7,to:119,lane:1,cls:"new"}],
    overlap:{from:7,to:119},
    refresh:[0,15,30,45,60,75,90,105],
    miss:8,
    token:{from:59,to:119,lane:3},
    danger:60,
    axis:{from:0,to:119,
      ticks:[{t:0,l:"09:00"},{t:15,l:"09:15"},{t:60,l:"10:00"},{t:119,l:"10:59"}],
      minor:[30,45,75,90,105]}
  };

  /* ---- одна пара функций перевода ---- */
  var origin={x:165,y:70}, scale={x:6,y:46};
  function sx(x){return origin.x+x*scale.x;}
  function sy(y){return origin.y+y*scale.y;}

  var NS="http://www.w3.org/2000/svg", svg=document.getElementById("s");
  function el(n,a){var e=document.createElementNS(NS,n);
    for(var k in a) e.setAttribute(k,a[k]); svg.appendChild(e); return e;}
  function bar(x1,x2,lane,fill,stroke){
    el("rect",{x:sx(x1),y:sy(lane-0.24),width:sx(x2)-sx(x1),height:sy(lane+0.24)-sy(lane-0.24),
      rx:6,fill:fill,stroke:stroke,"stroke-width":1.5});
  }
  function line(x1,y1,x2,y2,st,w,dash){
    var a={x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),stroke:st,"stroke-width":w,
      "stroke-linecap":"round"};
    if(dash)a["stroke-dasharray"]=dash; el("line",a);
  }
  function txt(s,x,y,anch,fill,size,dx,dy){
    var t=el("text",{x:sx(x)+(dx||0),y:sy(y)+(dy||0),"text-anchor":anch,
      fill:fill,"font-size":size||13,"font-family":"inherit"});
    t.textContent=s; return t;
  }

  el("rect",{x:0,y:0,width:940,height:320,fill:"var(--bg)"});

  /* окно перекрытия */
  el("rect",{x:sx(D.overlap.from),y:sy(-0.45),
    width:sx(D.overlap.to)-sx(D.overlap.from),height:sy(1.45)-sy(-0.45),
    rx:8,fill:"var(--band)","fill-opacity":.14,
    stroke:"var(--band)","stroke-width":1.2,"stroke-dasharray":"5 4"});
  txt("окно перекрытия ключей",16,-0.85,"start","var(--band)",13);
  txt("k_2026_03 выведен в 10:59",119,-0.85,"end","var(--old)",13);

  /* ключи */
  D.keys.forEach(function(k){
    var f=k.cls==="old"?"var(--oldbg)":"var(--newbg)",
        s=k.cls==="old"?"var(--old)":"var(--new)";
    bar(k.from,k.to,k.lane,f,s);
    txt(k.id,k.from,k.lane,"start",s,13,8,4);
  });
  txt("09:07 публикация",D.keys[1].from,0.5,"start","var(--new)",12,6,4);
  txt("Сервер",-3,0.28,"end","var(--muted)",12);
  txt("авторизации",-3,0.72,"end","var(--muted)",12);

  /* кеш ресурса */
  line(D.axis.from,2,D.miss,2,"var(--old)",4);
  line(D.miss,2,D.axis.to,2,"var(--tok)",4);
  D.refresh.forEach(function(t){
    el("circle",{cx:sx(t),cy:sy(2),r:5,fill:"var(--bg)",
      stroke:"var(--axis)","stroke-width":2});
  });
  el("rect",{x:sx(D.miss)-6,y:sy(2)-6,width:12,height:12,
    transform:"rotate(45 "+sx(D.miss)+" "+sy(2)+")",
    fill:"var(--bg)",stroke:"var(--tok)","stroke-width":2});
  txt("09:08",D.miss,1.62,"middle","var(--tok)",12);
  txt("оба ключа в кеше",75,1.62,"middle","var(--muted)",12);
  txt("только k_2026_03",D.axis.from,2.42,"start","var(--old)",12);
  txt("Кеш ресурса",-3,2,"end","var(--muted)",12,0,4);

  /* токен */
  bar(D.token.from,D.token.to,D.token.lane,"var(--tokbg)","var(--tok)");
  txt("токен подписан k_2026_03",D.token.from,D.token.lane,"start","var(--tok)",13,12,4);
  txt("09:59 выдан",D.token.from,3.42,"start","var(--tok)",12);
  txt("10:59 exp",D.token.to,3.42,"end","var(--tok)",12);
  txt("Токен",-3,3,"end","var(--muted)",12,0,4);

  /* опасная точка */
  line(D.danger,-0.6,D.danger,4,"var(--danger)",1.6,"6 5");
  txt("10:00 снять старый = 401",D.danger,-0.85,"middle","var(--danger)",13);

  /* ось времени */
  line(D.axis.from,4,D.axis.to,4,"var(--axis)",1.6);
  D.axis.minor.forEach(function(t){ line(t,4,t,4.12,"var(--axis)",1.2); });
  D.axis.ticks.forEach(function(k){
    line(k.t,3.9,k.t,4.16,"var(--axis)",1.6);
    txt(k.l,k.t,4.35,"middle","var(--fg)",12);
  });
  txt("время",-3,4,"end","var(--muted)",12,0,4);

  /* легенда */
  el("circle",{cx:sx(1),cy:sy(4.95),r:5,fill:"var(--bg)",
    stroke:"var(--axis)","stroke-width":2});
  txt("плановое обновление кеша раз в 15 мин",3,5,"start","var(--muted)",12);
  el("rect",{x:sx(46)-6,y:sy(4.95)-6,width:12,height:12,
    transform:"rotate(45 "+sx(46)+" "+sy(4.95)+")",
    fill:"var(--bg)",stroke:"var(--tok)","stroke-width":2});
  txt("промах по kid — одно синхронное обновление",48,5,"start","var(--muted)",12);
}catch(e){
  var p=document.getElementById("fb");
  p.hidden=false;
  p.textContent="Схема не построилась. Она показывает ленту времени: в 09:07 "+
   "сервер авторизации публикует k_2026_04 рядом с k_2026_03; кеш ресурса "+
   "обновляется раз в 15 минут (09:00, 09:15, …), промах по kid в 09:08 "+
   "вызывает одно синхронное обновление, и дальше в кеше лежат оба ключа; "+
   "токен, выданный под k_2026_03 в 09:59, валиден до 10:59, поэтому снятие "+
   "старого ключа в 10:00 даёт 401, а вывести k_2026_03 можно только в 10:59.";
}
})();
</script>
</html>
