<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Односторонний путь данных к весам модели</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f8fb;
    --panel: #ffffff;
    --text: #172033;
    --muted: #5d687c;
    --line: #66758f;
    --flow: #2563eb;
    --flow-fill: #dbeafe;
    --gate-fill: #ecfdf5;
    --gate-line: #16845b;
    --weights-fill: #ede9fe;
    --weights-line: #6d45c6;
    --card-fill: #fff7d6;
    --card-line: #a46b00;
    --danger: #c93434;
    --danger-fill: #fff0f0;
    --footer-fill: #e9eef8;
    --border: #cbd3df;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #10141d;
      --panel: #171d29;
      --text: #edf2fb;
      --muted: #aab6ca;
      --line: #8795ad;
      --flow: #72a7ff;
      --flow-fill: #172f58;
      --gate-fill: #123d31;
      --gate-line: #62d3a9;
      --weights-fill: #302854;
      --weights-line: #b49aff;
      --card-fill: #443719;
      --card-line: #f1c563;
      --danger: #ff8585;
      --danger-fill: #472126;
      --footer-fill: #222c3d;
      --border: #394459;
    }
  }

  html,
  body {
    background: var(--page);
    color: var(--text);
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
  }

  figure {
    margin: unset;
    max-width: 1200px;
    background: var(--panel);
    border: 1px solid var(--border);
  }

  figcaption {
    font-size: 20px;
    font-weight: bold;
    color: var(--text);
  }

  .subtitle,
  .fallback {
    font-size: 14px;
    color: var(--muted);
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 520px;
    background: var(--panel);
  }

  .phase {
    fill: var(--muted);
    font-size: 13px;
    font-weight: bold;
  }

  .phase-line,
  .flow-line,
  .blocked-line,
  .cross-line,
  .mark-line {
    fill: none;
    vector-effect: non-scaling-stroke;
  }

  .phase-line {
    stroke: var(--border);
    stroke-width: 2px;
  }

  .flow-line {
    stroke: var(--flow);
    stroke-width: 3px;
  }

  .flow-head {
    fill: var(--flow);
  }

  .node {
    stroke-width: 2px;
    vector-effect: non-scaling-stroke;
  }

  .source-node {
    fill: var(--flow-fill);
    stroke: var(--flow);
  }

  .gate-node {
    fill: var(--gate-fill);
    stroke: var(--gate-line);
  }

  .corpus-node {
    fill: var(--flow-fill);
    stroke: var(--flow);
  }

  .weights-node {
    fill: var(--weights-fill);
    stroke: var(--weights-line);
  }

  .card-node {
    fill: var(--card-fill);
    stroke: var(--card-line);
  }

  .node-title {
    fill: var(--text);
    font-size: 15px;
    font-weight: bold;
  }

  .node-detail {
    fill: var(--muted);
    font-size: 12px;
  }

  .check {
    fill: var(--gate-line);
  }

  .mark-line {
    stroke: currentColor;
    stroke-width: 2px;
  }

  .source-mark,
  .corpus-mark {
    color: var(--flow);
  }

  .weight-dot {
    fill: var(--weights-line);
  }

  .card-mark {
    color: var(--card-line);
  }

  .delete-node {
    fill: var(--danger-fill);
    stroke: var(--danger);
  }

  .delete-title {
    fill: var(--danger);
    font-size: 15px;
    font-weight: bold;
  }

  .delete-detail {
    fill: var(--text);
    font-size: 12px;
  }

  .blocked-line,
  .cross-line {
    stroke: var(--danger);
    stroke-width: 3px;
  }

  .blocked-head {
    fill: var(--danger);
  }

  .blocked-label {
    fill: var(--danger);
    font-size: 14px;
    font-weight: bold;
  }

  .footer-box {
    fill: var(--footer-fill);
    stroke: var(--border);
    stroke-width: 2px;
    vector-effect: non-scaling-stroke;
  }

  .footer-text {
    fill: var(--text);
    font-size: 15px;
    font-weight: bold;
  }
</style>
</head>
<body>
<figure aria-labelledby="diagram-title">
  <figcaption id="diagram-title">Односторонний путь данных к весам модели</figcaption>
  <div class="subtitle">
    Контроль работает до обучения; удаление исходника после обучения не откатывает веса.
  </div>
  <svg id="diagram"
       viewBox="0 0 1200 410"
       width="1200"
       height="410"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="diagram-title diagram-description">
    <desc id="diagram-description">
      Источник проходит проверку лицензии и opt-out, попадает в обучающий корпус,
      влияет на веса модели и затем описывается в карточке модели. Попытка удалить
      влияние из уже обученных весов перечёркнута.
    </desc>
  </svg>
  <div id="fallback" class="fallback" hidden>
    Схема должна показать односторонний поток: источник → проверка лицензии →
    проверка opt-out → обучающий корпус → веса модели → карточка модели.
    Удаление источника после обучения не возвращает веса в прежнее состояние.
  </div>
</figure>

<script>
const diagramData = {
  canvas: { width: 1200, height: 410 },
  arrowHead: { length: 13, wing: 7 },
  dash: { stroke: 10, gap: 8 },

  phases: [
    {
      text: "ДО ОБУЧЕНИЯ · источник ещё можно остановить",
      label: { x: 30, y: 25, anchor: "start" },
      line: { x1: 30, y1: 42, x2: 815, y2: 42 }
    },
    {
      text: "ПОСЛЕ ОБУЧЕНИЯ · влияние уже в весах",
      label: { x: 865, y: 25, anchor: "start" },
      line: { x1: 865, y1: 42, x2: 1180, y2: 42 }
    }
  ],

  nodes: [
    {
      kind: "source",
      className: "source-node",
      box: { x: 30, y: 70, width: 150, height: 100 },
      labels: [
        { text: "Источник", x: 105, y: 105, className: "node-title" },
        { text: "сайт или страница", x: 105, y: 134, className: "node-detail" }
      ],
      marks: [
        { kind: "line", x1: 50, y1: 88, x2: 78, y2: 88, className: "source-mark" },
        { kind: "line", x1: 50, y1: 94, x2: 70, y2: 94, className: "source-mark" }
      ]
    },
    {
      kind: "license",
      className: "gate-node",
      box: { x: 225, y: 70, width: 170, height: 100 },
      labels: [
        { text: "Проверка лицензии", x: 310, y: 105, className: "node-title" },
        { text: "разрешение подтверждено", x: 310, y: 134, className: "node-detail" }
      ],
      marks: [
        { kind: "circle", cx: 245, cy: 90, r: 7, className: "check" }
      ]
    },
    {
      kind: "optout",
      className: "gate-node",
      box: { x: 440, y: 70, width: 165, height: 100 },
      labels: [
        { text: "Проверка opt-out", x: 522, y: 105, className: "node-title" },
        { text: "отказ не заявлен", x: 522, y: 134, className: "node-detail" }
      ],
      marks: [
        { kind: "circle", cx: 460, cy: 90, r: 7, className: "check" }
      ]
    },
    {
      kind: "corpus",
      className: "corpus-node",
      box: { x: 650, y: 62, width: 165, height: 116 },
      labels: [
        { text: "Обучающий", x: 732, y: 103, className: "node-title" },
        { text: "корпус", x: 732, y: 124, className: "node-title" },
        { text: "проверенные примеры", x: 732, y: 151, className: "node-detail" }
      ],
      marks: [
        { kind: "line", x1: 670, y1: 82, x2: 696, y2: 82, className: "corpus-mark" },
        { kind: "line", x1: 670, y1: 88, x2: 696, y2: 88, className: "corpus-mark" },
        { kind: "line", x1: 670, y1: 94, x2: 690, y2: 94, className: "corpus-mark" }
      ]
    },
    {
      kind: "weights",
      className: "weights-node",
      box: { x: 865, y: 58, width: 155, height: 124 },
      labels: [
        { text: "Веса модели", x: 942, y: 101, className: "node-title" },
        { text: "изменённые числа", x: 942, y: 154, className: "node-detail" }
      ],
      marks: [
        { kind: "circle", cx: 916, cy: 124, r: 4, className: "weight-dot" },
        { kind: "circle", cx: 930, cy: 124, r: 4, className: "weight-dot" },
        { kind: "circle", cx: 944, cy: 124, r: 4, className: "weight-dot" },
        { kind: "circle", cx: 958, cy: 124, r: 4, className: "weight-dot" },
        { kind: "circle", cx: 972, cy: 124, r: 4, className: "weight-dot" },
        { kind: "circle", cx: 923, cy: 137, r: 4, className: "weight-dot" },
        { kind: "circle", cx: 937, cy: 137, r: 4, className: "weight-dot" },
        { kind: "circle", cx: 951, cy: 137, r: 4, className: "weight-dot" },
        { kind: "circle", cx: 965, cy: 137, r: 4, className: "weight-dot" }
      ]
    },
    {
      kind: "card",
      className: "card-node",
      box: { x: 1065, y: 70, width: 115, height: 100 },
      labels: [
        { text: "Карточка", x: 1122, y: 102, className: "node-title" },
        { text: "модели", x: 1122, y: 123, className: "node-title" },
        { text: "фиксирует факт", x: 1122, y: 148, className: "node-detail" }
      ],
      marks: [
        { kind: "line", x1: 1082, y1: 88, x2: 1102, y2: 88, className: "card-mark" },
        { kind: "line", x1: 1082, y1: 94, x2: 1097, y2: 94, className: "card-mark" }
      ]
    }
  ],

  flowArrows: [
    { from: { x: 180, y: 120 }, to: { x: 225, y: 120 } },
    { from: { x: 395, y: 120 }, to: { x: 440, y: 120 } },
    { from: { x: 605, y: 120 }, to: { x: 650, y: 120 } },
    { from: { x: 815, y: 120 }, to: { x: 865, y: 120 } },
    { from: { x: 1020, y: 120 }, to: { x: 1065, y: 120 } }
  ],

  deletion: {
    box: { x: 430, y: 250, width: 280, height: 62 },
    labels: [
      { text: "Источник удалён", x: 570, y: 271, className: "delete-title" },
      { text: "из хранилища и корпуса", x: 570, y: 294, className: "delete-detail" }
    ],
    arrow: {
      from: { x: 710, y: 281 },
      to: { x: 856, y: 188 }
    },
    cross: [
      { x1: 785, y1: 217, x2: 819, y2: 251 },
      { x1: 819, y1: 217, x2: 785, y2: 251 }
    ],
    note: {
      text: "удаление не возвращает веса «назад»",
      x: 735,
      y: 329,
      anchor: "start"
    }
  },

  footer: {
    box: { x: 190, y: 354, width: 820, height: 40 },
    text: {
      value: "Чтобы убрать спорное влияние, модель нужно обучить заново на чистом корпусе",
      x: 600,
      y: 374
    }
  }
};

const origin = { x: 0, y: 0 };
const scale = 1;

function sx(x) {
  return origin.x + x * scale;
}

function sy(y) {
  return origin.y + y * scale;
}

try {
  const svg = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");
  const namespace = "http://www.w3.org/2000/svg";

  function make(tag, attributes, textValue) {
    const item = document.createElementNS(namespace, tag);
    for (const [name, value] of Object.entries(attributes)) {
      item.setAttribute(name, String(value));
    }
    if (textValue) item.textContent = textValue;
    return item;
  }

  function addLine(parent, line, className) {
    parent.appendChild(make("line", {
      x1: sx(line.x1),
      y1: sy(line.y1),
      x2: sx(line.x2),
      y2: sy(line.y2),
      class: className
    }));
  }

  function addRect(parent, box, className) {
    parent.appendChild(make("rect", {
      x: sx(box.x),
      y: sy(box.y),
      width: sx(box.width) - sx(0),
      height: sy(box.height) - sy(0),
      class: className
    }));
  }

  function addText(parent, label, className) {
    parent.appendChild(make("text", {
      x: sx(label.x),
      y: sy(label.y),
      "text-anchor": label.anchor || "middle",
      "dominant-baseline": "middle",
      class: className || label.className
    }, label.text || label.value));
  }

  function addArrow(parent, arrow, lineClass, headClass, dashed) {
    const dx = arrow.to.x - arrow.from.x;
    const dy = arrow.to.y - arrow.from.y;
    const distance = Math.hypot(dx, dy);
    const ux = dx / distance;
    const uy = dy / distance;
    const baseX = arrow.to.x - ux * diagramData.arrowHead.length;
    const baseY = arrow.to.y - uy * diagramData.arrowHead.length;
    const sideX = -uy * diagramData.arrowHead.wing;
    const sideY = ux * diagramData.arrowHead.wing;

    const line = make("line", {
      x1: sx(arrow.from.x),
      y1: sy(arrow.from.y),
      x2: sx(baseX),
      y2: sy(baseY),
      class: lineClass
    });

    if (dashed) {
      line.setAttribute(
        "stroke-dasharray",
        `${sx(diagramData.dash.stroke) - sx(0)} ${sx(diagramData.dash.gap) - sx(0)}`
      );
    }

    const headPoints = [
      `${sx(arrow.to.x)},${sy(arrow.to.y)}`,
      `${sx(baseX + sideX)},${sy(baseY + sideY)}`,
      `${sx(baseX - sideX)},${sy(baseY - sideY)}`
    ].join(" ");

    parent.appendChild(line);
    parent.appendChild(make("polygon", {
      points: headPoints,
      class: headClass
    }));
  }

  function addMark(parent, mark) {
    if (mark.kind === "line") {
      addLine(parent, mark, `mark-line ${mark.className}`);
    }

    if (mark.kind === "circle") {
      parent.appendChild(make("circle", {
        cx: sx(mark.cx),
        cy: sy(mark.cy),
        r: sx(mark.r) - sx(0),
        class: mark.className
      }));
    }
  }

  const phaseLayer = make("g", {});
  const arrowLayer = make("g", {});
  const nodeLayer = make("g", {});
  const deletionLayer = make("g", {});
  const footerLayer = make("g", {});

  for (const phase of diagramData.phases) {
    addText(phaseLayer, phase.label, "phase");
    addLine(phaseLayer, phase.line, "phase-line");
  }

  for (const arrow of diagramData.flowArrows) {
    addArrow(arrowLayer, arrow, "flow-line", "flow-head", false);
  }

  for (const node of diagramData.nodes) {
    addRect(nodeLayer, node.box, `node ${node.className}`);
    for (const mark of node.marks) addMark(nodeLayer, mark);
    for (const label of node.labels) addText(nodeLayer, label, label.className);
  }

  addRect(deletionLayer, diagramData.deletion.box, "node delete-node");
  for (const label of diagramData.deletion.labels) {
    addText(deletionLayer, label, label.className);
  }

  addArrow(
    deletionLayer,
    diagramData.deletion.arrow,
    "blocked-line",
    "blocked-head",
    true
  );

  for (const crossLine of diagramData.deletion.cross) {
    addLine(deletionLayer, crossLine, "cross-line");
  }

  addText(
    deletionLayer,
    diagramData.deletion.note,
    "blocked-label"
  );

  addRect(footerLayer, diagramData.footer.box, "footer-box");
  addText(footerLayer, diagramData.footer.text, "footer-text");

  svg.appendChild(phaseLayer);
  svg.appendChild(arrowLayer);
  svg.appendChild(nodeLayer);
  svg.appendChild(deletionLayer);
  svg.appendChild(footerLayer);
  fallback.hidden = true;
} catch (error) {
  const failedDiagram = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");
  if (failedDiagram) failedDiagram.hidden = true;
  if (fallback) fallback.hidden = false;
}
</script>
</body>
</html>
