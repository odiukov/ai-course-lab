- concept: число маршрутных решений центра на единицу больше числа привлечённых специалистов, потому что завершение — тоже решение центра
  question: Задача последовательно проходит через 3 специалистов, каждый привлекается ровно один раз, работу центральный агент сам не выполняет. Сколько маршрутных решений принимает центр, если считать и решение завершить задачу?
  explanation: 'Три решения — вызвать очередного специалиста, плюс одно решение завершить: 3 + 1 = 4. Результат каждого специалиста возвращается в центр, поэтому решений всегда на одно больше числа вызовов.'
  kind: numeric
  answer: 4
  tolerance: 0.5
