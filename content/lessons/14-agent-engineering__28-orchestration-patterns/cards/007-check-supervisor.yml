- concept: выдача специалисту права самому вызывать следующего отменяет гарантию, что вход каждого исполнителя собран центром
  question: Команда разрешила специалисту по ценам напрямую дёргать специалиста по логистике «ради скорости», сохранив центрального маршрутизатора для остальных вызовов. Какая гарантия при этом теряется? Объясни своими словами.
  explanation: 'Экономия одного прыжка оплачивается потерей контроля над контекстом: тонкая настройка того, что видит каждый специалист, возможна только пока вызовы идут из одного места.'
  kind: open
  reference: 'Теряется гарантия, что вход каждого специалиста собран центром: логистика получает контекст, сформированный ценовым агентом, а центр не знает ни того, что именно ушло, ни того, что вернулось. Пропадает единая точка контроля над контекстом и маршрутом — центр перестаёт быть единственным местом, где принимается решение о следующем исполнителе, и часть маршрута становится ненаблюдаемой.'
