- concept: уровень, не сокращающий множество вариантов у вышестоящего, не даёт выигрыша иерархии
  question: Между супервизором и исполнителями добавили промежуточных руководителей, но верхний супервизор по-прежнему держит в промпте описания всех исполнителей. Что даёт такой уровень?
  explanation: Иерархия окупается только тем, что вышестоящий больше не видит полный каталог. Если каталог остался на верхнем уровне, выигрыша по контексту нет, а путь запроса стал длиннее.
