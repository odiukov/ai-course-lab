- concept: переопределяющие ограничения проверяются раньше количественного варианта по умолчанию, иначе они недостижимы
  question: Расставь по порядку проверки в функции выбора паттерна, чтобы ни одна ветка не оказалась недостижимой.
  explanation: 'Если сначала вернуть вариант по числу специалистов, любое ограничение ниже по коду никогда не сработает: функция уже вышла. Запасной вариант обязан стоять последним, а вырожденный случай — первым, чтобы лишний флаг не превращал одного исполнителя в сложную топологию.'
  kind: order
  items:
    - 'Отсечь вырожденный случай: исполнитель один'
    - Проверить переопределяющие ограничения (контекстный бюджет, критичная задержка, приоритет точности)
    - Вернуть базовый вариант по числу специалистов как запасной
  id: 024-code-pick-pattern-1
  fingerprint: 51f8e022
- concept: требование минимальной задержки переопределяет базовый выбор по числу специалистов
  question: Число специалистов укладывается в диапазон для централизованной топологии, но выставлен флаг критичной задержки. Дополни ветку.
  explanation: Прямые передачи между агентами убирают обратный прыжок через центр и сокращают маршрут. Ветка стоит выше базового возврата, иначе выбор по числу специалистов забрал бы управление первым.
  kind: cloze
  template: |-
    if latency_critical:
        return "___"
  answer: swarm
  accept:
    - swarm
    - '''swarm'''
    - '"swarm"'
  id: 024-code-pick-pattern-2
  fingerprint: b85ff9ed
- concept: проверка функции выбора требует конфликтующих комбинаций входов, а не одного примера на каждую ветку
  question: Тесты подают по одному примеру на каждый паттерн, и все проходят. Почему этого недостаточно и что нужно добавить?
  explanation: Функция выбора — это про приоритеты, а не про пять независимых возвратов. Приоритеты видны только там, где условия пересекаются.
  kind: open
  reference: 'Одиночный пример на ветку срабатывает и при неверном порядке проверок: каждый вход подобран так, что подходит ровно под одно условие, и конкуренция веток не возникает. Нужны конфликтующие комбинации: число специалистов подходит для базового варианта, но одновременно выставлен флаг критичной задержки; исполнитель один, но передан лишний флаг; ограничение по контексту сочетается с требованием точности. Такие входы показывают, какое условие действительно побеждает, а не какое просто встретилось первым.'
  id: 024-code-pick-pattern-3
  fingerprint: 713f2a71
