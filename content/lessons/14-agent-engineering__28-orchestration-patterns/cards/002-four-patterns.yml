- concept: debate решает задачу верификации, а не распределения работы между специалистами
  question: Команда добавила топологию, в которой несколько агентов независимо предлагают решение одной и той же задачи, а затем критикуют версии друг друга. Что эта топология даёт системе по сравнению с supervisor-worker?
  explanation: 'Debate по природе ближе к верификации, чем к оркестрации: агенты не делят работу, а дублируют её и перепроверяют. Поэтому его берут там, где точность важнее стоимости — в лестнице Anthropic это последняя ступень. Разделение работы — про supervisor-worker, низкая задержка — про swarm, большие популяции — про hierarchical.'
  kind: choice
  options:
    - Снижение вероятности ошибки в одном ответе ценой дополнительных вызовов модели
    - Разделение задачи на непересекающиеся части между специалистами
    - Сокращение задержки за счёт устранения центрального маршрутизатора
    - Масштабирование на большие популяции агентов при ограниченном контексте
  correct: 0
  id: 002-four-patterns-1
  fingerprint: a9ff164b
- concept: стоимость debate растёт как число предложений плюс раунды взаимной критики
  question: В debate-схеме 5 агентов независимо готовят предложение, затем идут 2 раунда взаимной критики, в каждом раунде высказывается каждый из 5 агентов. Сколько всего вызовов модели требует такой прогон?
  explanation: '5 предложений + 2 раунда × 5 критик = 5 + 10 = 15 вызовов вместо одного у single-agent. Отсюда правило: debate оправдан, когда цена ошибки выше цены токенов, а не как топология по умолчанию.'
  kind: numeric
  answer: 15
  tolerance: 0.5
  id: 002-four-patterns-2
  fingerprint: 9e8e018c
- concept: 'CrewAI Flow против Crew: следующий шаг выбирает код или LLM, и в продакшене стартуют с детерминированного режима'
  question: CrewAI формализует два режима развёртывания — Flow и Crew. В чём между ними ключевая разница и с чего рекомендуется начинать в продакшене?
  explanation: 'Flow — событийная детерминированная автоматизация: порядок шагов прописан в коде, его проще отлаживать и воспроизводить, поэтому это рекомендуемая точка старта для продакшена. Crew — роли, договаривающиеся на ходу, следующий шаг выбирает модель. Этот выбор ортогонален четырём паттернам: и Flow, и Crew обычно ложатся на supervisor или иерархию.'
  kind: choice
  options:
    - Flow — детерминированная событийная автоматизация, следующий шаг определяет код; Crew — автономная работа по ролям, шаг выбирает LLM; начинать рекомендуют с Flow
    - Flow — автономная работа по ролям; Crew — жёсткая последовательность событий; начинать рекомендуют с Crew
    - Flow задаёт топологию swarm, Crew задаёт иерархию; начинать рекомендуют с Crew
    - Разница только в API, режимы взаимозаменяемы, порядок старта не важен
