- concept: 'решение принимается в порядке: ограничения задачи, топология, требуемые от инструмента свойства, конкретный фреймворк'
  question: Расставь шаги выбора реализации мультиагентной системы в правильном порядке.
  explanation: 'Обратный порядок незаметно превращает выбор библиотеки в выбор архитектуры: под удобный примитив подгоняется структура взаимодействия. Требования к инструменту — это уже следствие принятого решения о топологии.'
  kind: order
  items:
    - 'Сформулировать ограничения задачи: число специалистов, требования к контролю маршрута, цена ошибки, допустимая задержка'
    - Выбрать топологию, отвечающую этим ограничениям
    - 'Выписать свойства, которые инструмент обязан выражать: вложенные группы, видимый маршрут, возможность остановить передачу'
    - Выбрать фреймворк, в котором эти свойства выражаются естественно, а не имитируются вручную
  id: 029-framework-fit-1
  fingerprint: e7db867e
- concept: соответствие паттернов и инструментов многие-ко-многим, поэтому название библиотеки не может служить названием архитектуры
  question: Команда выбрала иерархию, но в описании системы пишет «у нас архитектура на <название фреймворка>». Что не так с такой формулировкой?
  explanation: Соответствие «паттерн — инструмент» не взаимно однозначно в обе стороны. Из имени библиотеки нельзя восстановить, кто принимает решения о маршруте и кому передаётся работа, — а это и есть архитектура.
  kind: choice
  options:
    - 'Ничего: каждый фреймворк реализует ровно один паттерн, поэтому его название однозначно задаёт топологию'
    - Одна топология реализуется несколькими инструментами, и один инструмент выражает несколько топологий, поэтому имя библиотеки не описывает форму взаимодействия
    - Название фреймворка описывает топологию, но не описывает режим управления
