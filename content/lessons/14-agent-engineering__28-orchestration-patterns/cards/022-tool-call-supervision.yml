- concept: порядок шагов одного хода супервизии через вызов инструмента-специалиста
  question: Расставь по порядку шаги одного хода супервизора, оформленного через вызовы инструментов.
  explanation: 'Ключевая точка — второй шаг: между выбором модели и запуском специалиста стоит твой код, который решает, что именно уйдёт внутрь. Возврат результата тоже идёт через центр, а не в общую историю в обход супервизора.'
  kind: order
  items:
    - Супервизор выбирает вызов инструмента, соответствующего нужному специалисту
    - Код формирует вход специалиста из выбранных полей контекста
    - Специалист выполняет работу над полученным входом
    - Результат возвращается супервизору
    - Супервизор решает следующее действие с учётом результата
  id: 022-tool-call-supervision-1
  fingerprint: f98a75c1
- concept: автоматическая пересылка всей истории каждому специалисту одновременно ухудшает качество и расширяет доступ к чувствительным данным
  question: В общей истории клиента лежат документы, удостоверяющие личность, переписка о цене и множество бытовых сообщений. Что не так с тем, чтобы отдавать эту историю целиком каждому вызываемому специалисту?
  explanation: 'Лишний контекст двумя способами вредит: вытесняет из внимания специалиста то, что действительно относится к его вопросу, и без нужды расширяет круг данных, к которым он прикасается. Оформление специалиста как функции с явными полями делает границу передаваемого видимой и проверяемой.'
  kind: choice
  options:
    - 'Ничего: чем больше контекста, тем точнее работает каждый специалист'
    - Специалист получает шум, не относящийся к его задаче, и одновременно доступ к чувствительным сведениям, которые ему не нужны
    - История увеличивает глубину топологии и превращает её в иерархию
  correct: 1
  id: 022-tool-call-supervision-2
