- concept: иерархический маршрут строится двумя последовательными выборами сверху вниз, конечный исполнитель определяется только внутри выбранной команды
  question: Расставь шаги иерархической маршрутизации одной заявки в правильном порядке.
  explanation: Верхний уровень не знает полного списка исполнителей — он оперирует только командами. Если категория сразу отображается в имя исполнителя, получается плоский маршрут с декоративной табличкой команды.
  kind: order
  items:
    - Классифицировать заявку и получить одну категорию из закрытого набора
    - Верхний супервизор переводит категорию в команду (подсупервизора)
    - Подсупервизор выбранной команды выбирает исполнителя среди своих
    - 'Вернуть маршрут, сохраняющий оба перехода: команда и затем исполнитель'
  id: 014-code-hierarchical-route-1
  fingerprint: a21653ba
- concept: второй выбор ограничен составом выбранной команды, иначе уровень не сокращает пространство вариантов
  question: Функция маршрутизации сначала определяет команду, но затем ищет исполнителя по общему списку всех сотрудников. Что не так?
  explanation: 'Смысл уровня — сузить множество вариантов. Поиск по полному списку возвращает то же самое, что и плоская маршрутизация: если удалить промежуточную команду и результат не изменится, второго уровня фактически нет.'
  kind: choice
  options:
    - Второй выбор должен идти только среди исполнителей выбранной команды — иначе первый уровень ничего не ограничивает
    - 'Ничего: результат всё равно корректный, порядок поиска не важен'
    - Нужно наоборот — сначала найти исполнителя, потом определить его команду
