- concept: неизвестная категория требует явного резервного маршрута, а не молчаливого попадания в первый элемент списка
  question: Классификатор вернул категорию, для которой в таблице команд нет соответствия. Как должна повести себя иерархическая маршрутизация?
  explanation: 'Дефолт «первая команда» маскирует ошибку классификации и создаёт неверную маршрутизацию, которую потом невозможно отследить. Явный fallback нужен на обоих уровнях: и когда не нашлась команда, и когда внутри команды нет подходящего исполнителя.'
  kind: choice
  options:
    - Вернуть заранее предусмотренный резервный маршрут
    - Отдать заявку первой команде из списка
    - Опросить все команды по очереди, пока кто-то не согласится
