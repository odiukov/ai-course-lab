- concept: меньшее число переходов оплачивается потерей единой точки наблюдения — выбор определяется тем, какая цена сейчас выше
  question: 'Своими словами: почему сокращение числа переходов между агентами нельзя считать безусловным улучшением, и как тогда выбирать топологию?'
  explanation: 'Это компромисс, а не рейтинг топологий. Ответ должен называть обе стороны: выигрыш в переходах и потерю единой точки контроля, и критерий выбора — какое из требований сейчас дороже.'
  kind: open
  reference: 'Прямые передачи убирают возврат в центр и снижают задержку, но вместе с центром исчезает узел, у которого видна вся маршрутизация — систему становится труднее наблюдать и о ней труднее рассуждать. Поэтому выбирают по доминирующему требованию: если дороже задержка и передачи между конкретной парой специалистов часты — прямая передача; если дороже способность разобрать инцидент и контролировать, какой контекст уходит исполнителю — централизованный маршрутизатор.'
