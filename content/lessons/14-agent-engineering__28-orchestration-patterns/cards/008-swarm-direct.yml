- concept: какие примитивы фреймворков реализуют одноранговую передачу между агентами
  question: Какой механизм реализует именно одноранговую передачу, когда любой агент может отдать работу любому другому?
  explanation: Handoffs в OpenAI Agents SDK и swarm-топология в LangGraph дают прямую передачу через общий набор инструментов. create_supervisor и Hierarchical Process, наоборот, вводят центральный маршрутизатор.
  kind: choice
  options:
    - Hierarchical Process в CrewAI
    - create_supervisor в LangGraph
    - Handoffs в OpenAI Agents SDK, когда передача разрешена между любой парой агентов
  correct: 2
