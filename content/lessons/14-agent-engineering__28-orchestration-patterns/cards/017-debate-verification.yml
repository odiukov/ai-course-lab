- concept: debate накладывается поверх существующей топологии, а не заменяет её маршрут работы
  question: 'В системе с центральным супервизором и исполнителями решили применить debate: супервизор собирает четыре независимых ответа и раздаёт их на взаимную критику. Что происходит с топологией?'
  explanation: Topology отвечает на вопрос «кто кому отдаёт следующую часть работы», debate — «как тщательнее проверить уже предложенное». Поэтому debate совместим с любым маршрутом и во фреймворках лишь выглядит как ещё один выбор топологии.
  kind: choice
  options:
    - 'Она остаётся прежней: debate ложится поверх, маршрут работы не меняется'
    - 'Она превращается в одноранговую: агенты теперь общаются напрямую'
    - 'Она обязана стать иерархической: критикам нужен отдельный подсупервизор'
  correct: 0
  id: 017-debate-verification-2
  fingerprint: 0831fbff
- concept: критерий применения debate — цена ошибки выше цены дополнительных вызовов модели
  question: Когда debate оправдан?
  explanation: Debate не покупает ни скорость, ни простоту управления — он покупает дополнительную проверку. Поэтому его берут на дорогих решениях (юридические споры, крупные выплаты), а переполнение контекста лечится иерархией, а не debate.
  kind: choice
  options:
    - Когда цена ошибки в ответе выше стоимости дополнительных вызовов модели
    - Когда нужно сократить задержку ответа пользователю
    - Когда описания специалистов не помещаются в контекст супервизора
  correct: 0
  id: 017-debate-verification-3
