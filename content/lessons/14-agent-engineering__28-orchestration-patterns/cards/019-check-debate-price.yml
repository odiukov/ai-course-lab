- concept: несколько агентов на одной модели дают коррелированные ошибки, поэтому debate снижает риск, но не гарантирует истину
  question: Четыре агента независимо предлагают ответ, потом критикуют друг друга. Все запущены на одной модели с почти одинаковым системным промптом. Почему согласие всех четырёх нельзя считать доказательством правильности?
  explanation: 'Debate покупает дополнительную проверку, а не истину. Источники ошибок у одинаково настроенных агентов пересекаются: слепое пятно модели повторится во всех предложениях, и взаимная критика его не заметит. Разнообразие промптов, ролей или моделей повышает шанс, что ошибка окажется некоррелированной.'
  kind: choice
  options:
    - Критика всегда слабее предложения, поэтому раунды бесполезны
    - 'Одинаковая модель и близкие промпты дают коррелированные ошибки: агенты могут разделять одно и то же заблуждение'
    - Итоговый ответ выбирается случайно, поэтому согласие ничего не значит
  correct: 1
  id: 019-check-debate-price-1
  fingerprint: cb231aad
- concept: потеря независимости на фазе предложений обесценивает проверку из-за схождения к первому варианту
  question: Инженер решил сэкономить и подаёт каждому следующему предлагающему агенту черновики уже ответивших коллег. Объясни своими словами, что ломается в такой схеме.
  explanation: 'Фаза предложений и фаза критики разделены не ради красоты: сначала нужны действительно разные версии, и только потом их столкновение. Последовательная передача черновиков превращает параллельную проверку в дорогое согласие с первым ответившим.'
  kind: open
  reference: Проверочная сила схемы держится на том, что предложения получены независимо. Увидев чужой черновик, агент опирается на него как на опору и склоняется к тому же варианту, а не строит своё решение. Разброс мнений схлопывается, критиковать становится нечего, и система платит за все вызовы, получая по сути один ответ, размноженный несколько раз.
  id: 019-check-debate-price-2
  fingerprint: 4ef5bd03
