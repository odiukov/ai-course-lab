- concept: основание для усложнения формулируется как измеримый порог и перепроверяется тем же замером после изменения
  question: Команда предлагает заменить одного агента супервизором со специалистами. Как сформулировать и проверить основание для такого перехода, чтобы решение не было вкусовым?
  explanation: Каждая ступень добавляет вызовы, задержку и новые места отказа. Оплачивать этот счёт имеет смысл только против конкретного измеренного ограничения, и подтверждается покупка тем же замером после изменения.
  kind: open
  reference: 'Основание должно звучать как измеримое утверждение с порогом: доля ошибочно обработанных заявок выше допустимой, задержка в верхнем процентиле выше SLA, стоимость обработки выше бюджета. Значение снимается на текущей базовой линии до изменения. После перехода те же метрики измеряются заново на той же нагрузке. Если названное узкое место не сдвинулось или ухудшилось, ступень не оправдана и изменение откатывается. «Хочется больше агентов» и «так выглядит серьёзнее» проверяемыми основаниями не являются.'
  id: 023-decision-ladder-1
  fingerprint: 52e20fe6
- concept: 'сопоставление симптома с подходящей ступенью: смешение разных типов работы лечится разделением на специалистов с центральным маршрутизатором'
  question: Один агент укладывается в бюджет и в SLA по задержке, но регулярно путает три разных типа запросов и применяет к ним чужие инструкции. Какое усложнение отвечает именно на этот симптом?
  explanation: Симптом — смешение инструкций для разных типов работы, значит нужна изоляция ролей и явная маршрутизация. Прямые передачи отвечают на проблему задержки, а параллельная критика — на цену ошибки; ни то, ни другое здесь не измерено как узкое место.
  kind: choice
  options:
    - Развести типы работы по отдельным специалистам с центральным маршрутизатором
    - Перейти на прямые передачи между агентами без центра
    - Добавить параллельные предложения и раунды взаимной критики
  correct: 0
