- concept: иерархия оправдана только тогда, когда описания всех специалистов перестают помещаться в контекст одного супервизора
  question: В системе 6 специалистов, их описания свободно помещаются в контекст одного супервизора вместе с запросом и историей работы. Стоит ли вводить подсупервизоров?
  explanation: Порог для иерархии один — контекстный бюджет супервизора. Пока 6 описаний по паре сотен токенов помещаются рядом с задачей, второй уровень даёт только лишнюю передачу и дополнительную точку отказа.
  kind: choice
  options:
    - 'Нет: одного супервизора достаточно, лишний уровень ничего не разгружает'
    - 'Да: иерархия всегда надёжнее плоской схемы'
    - Да, но только если специалисты относятся к разным доменам
  correct: 0
  id: 013-hierarchy-context-1
  fingerprint: 36a99d2c
- concept: условие перехода к иерархической оркестрации формулируется через контекстный бюджет, а не через размер организации
  question: Сформулируй своими словами условие, при котором вложенные супервизоры оправданы.
  explanation: Критерий — переполнение контекста, а не число сотрудников, солидность схемы или количество доменов. 60 специалистов по 300 токенов — это 18000 токенов меню, и супервизор тонет в собственном каталоге.
  kind: open
  reference: Когда контекстный бюджет одного супервизора уже не вмещает описания всех специалистов вместе с запросом, правилами маршрутизации и историей. Тогда верхний супервизор выбирает не исполнителя, а команду/подсупервизора, и каждое решение принимается по короткому меню. До этого порога дополнительный уровень только удлиняет путь запроса.
  id: 013-hierarchy-context-2
  fingerprint: 8f0541fe
- concept: какие примитивы фреймворков реализуют вложенную иерархию супервизоров
  question: Чем реализуют иерархическую оркестрацию в LangGraph и CrewAI?
  explanation: 'Иерархия — это граф внутри графа: подграф LangGraph и вложенный crew CrewAI сами внутри имеют своего супервизора и исполнителей. Счётчики прыжков относятся к swarm, параллельные предложения с критикой — к debate.'
  kind: choice
  options:
    - Вложенными подграфами в LangGraph и вложенными crew в CrewAI
    - Счётчиками прыжков в LangGraph и hop-limit в CrewAI
    - Параллельными предлагающими агентами и раундами взаимной критики
  correct: 0
