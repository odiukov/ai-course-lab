- concept: топология определяется фактическим получателем передачи, а не названием функции маршрутизации
  question: Функция называется swarm_route, но при смене исполнителя всегда возвращает центральный узел, который затем выбирает следующего специалиста. Что это за топология?
  explanation: 'Признак одноранговой топологии — получатель является специалистом, а не маршрутизатором. Если центр участвует в каждой смене исполнителя, имя функции ничего не меняет: маршрут остался звездой.'
  kind: choice
  options:
    - Одноранговая, потому что функция реализует передачу работы
    - Централизованная supervisor-worker под новым именем
    - 'Гибридная: одноранговая по коду, централизованная по данным'
  correct: 1
  id: 009-code-swarm-route-1
  fingerprint: 508e5aab
- concept: порядок шагов внутри одного вызова функции прямой передачи
  question: Расставь шаги одного вызова функции прямой передачи в одноранговой топологии.
  explanation: Функция сначала классифицирует следующую часть задачи, потом отображает категорию на специалиста и отдаёт его напрямую. Промежуточного возврата в центр между вторым и третьим шагом нет.
  kind: order
  items:
    - Определить, какой тип работы требуется следующим
    - Сопоставить этому типу подходящего специалиста
    - Вернуть этого специалиста как непосредственного получателя работы
  id: 009-code-swarm-route-2
  fingerprint: 5cdc1b91
- concept: за один вызов маршрутизации происходит не больше одной передачи
  question: Зачем ограничивать функцию маршрутизации одной передачей за вызов, а не позволять ей сразу построить всю цепочку исполнителей?
  explanation: Один вызов — один переход. Тогда каждый переход можно посчитать, залогировать и при необходимости прервать. Цепочка, построенная заранее, лишает оркестратор контроля над серединой маршрута.
  kind: choice
  options:
    - Иначе функция не сможет использовать LLM
    - Чтобы каждый переход оставался отдельным наблюдаемым событием, которое оркестратор может учесть и остановить
    - Потому что специалист не умеет вернуть результат дважды
  correct: 1
  id: 009-code-swarm-route-3
  fingerprint: 91190f2d
