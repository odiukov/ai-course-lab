- concept: 'при одинаковой задаче топологии различаются числом операций: swarm короче, иерархия глубже, debate дороже всех'
  question: Один и тот же запрос прогоняют через четыре топологии на одинаковом входе. Расставь паттерны по количеству операций — от самого короткого трейса к самому дорогому.
  explanation: 'Демо специально печатает op count: supervisor самый аккуратный, swarm самый короткий, иерархия самая глубокая, debate самый дорогой. Выбор топологии — это выбор множителя к счёту за токены.'
  kind: order
  items:
    - Swarm — прямые передачи, меньше всего прыжков
    - Supervisor-worker — аккуратный трейс, но каждая передача идёт через центр
    - Hierarchical — самый глубокий трейс из-за промежуточных слоёв супервизоров
    - Debate — параллельные предложения плюс раунды критики, самый дорогой
  id: 003-common-classifier-1
  fingerprint: 8c8e354e
- concept: 'контролируемое сравнение топологий: фиксируешь задачу, вход и поведение модели, меняешь только маршрут работы'
  question: Стенд сравнивает четыре топологии на скриптованной (детерминированной) LLM вместо реальной. Зачем?
  explanation: Задача одна (refund / bug / sales), вход один, модель отвечает предсказуемо — тогда разная длина и глубина трейсов приписывается именно обвязке. Разные задачи для разных топологий сделали бы сравнение бессмысленным.
  kind: choice
  options:
    - 'Чтобы единственной меняющейся переменной остался маршрут передачи работы: при недетерминированной модели разница в трейсах могла бы объясняться случайными ответами, а не топологией'
    - Чтобы скрыть тот факт, что swarm без реальной модели работать не может
    - Чтобы уменьшить число интентов с трёх до одного
    - Потому что supervisor-worker не поддерживает вызовы настоящих моделей
