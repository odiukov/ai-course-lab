- concept: достижение предела передач требует заранее заданного безопасного исхода
  question: Что должна сделать система в момент, когда лимит передач достигнут?
  explanation: 'Лимит без предусмотренного исхода превращается в тихий обрыв. Нужен явный терминальный путь: сообщение об исчерпании автоматической маршрутизации или передача человеку.'
  kind: choice
  options:
    - 'Перейти к заранее определённому безопасному исходу: например, эскалация на ручной разбор или явный отказ'
    - Обнулить счётчик и продолжить маршрут с текущего агента
    - Вернуть последний промежуточный ответ как окончательный
