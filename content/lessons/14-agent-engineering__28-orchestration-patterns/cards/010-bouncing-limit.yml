- concept: величина предела выводится из длины нормального маршрута
  question: Самый длинный законный маршрут в системе укладывается в 6 передач. Каким разумно взять предел числа передач?
  explanation: Предел, равный максимуму нормального маршрута, будет резать законные случаи; отсутствие предела оставляет возможность бесконечной болтанки. Берут конечное значение с небольшим запасом над нормой.
  kind: choice
  options:
    - Ровно 6, чтобы отсечь всё лишнее
    - Около 9 — с запасом над самым длинным нормальным маршрутом, но конечным
    - Предел не нужен, если инструкции агентов написаны аккуратно
