- concept: распознавание чередования требует, чтобы два агента были разными
  question: Детектор чередующегося маршрута сравнивает записи истории через одну на совпадение. Зачем ему дополнительно проверять, что два участвующих агента различны?
  explanation: Повтор одного агента совпадает по позициям, но означает, что задача осталась на месте. Болтанка — это возврат работы между двумя разными исполнителями.
  kind: choice
  options:
    - Иначе история вида writer, writer, writer, writer будет ошибочно признана болтанкой, хотя передачи не было
    - Иначе детектор не сможет обработать историю с одним агентом в начале
    - Иначе счётчик передач будет расти вдвое быстрее
  correct: 0
  id: 011-code-detect-bouncing-1
  fingerprint: 3dfdf274
- concept: порядок проверок в детекторе чередующегося маршрута
  question: Расставь проверки детектора чередования в порядке выполнения.
  explanation: Сначала защита от короткой истории, иначе индексация упадёт или даст ложный результат. Потом сравнение позиций, и в конце — отсечение случая, где «чередуется» один и тот же агент.
  kind: order
  items:
    - Убедиться, что история достаточно длинная для сравнения
    - Взять хвост истории нужной длины
    - Сравнить записи через одну на совпадение
    - Убедиться, что два чередующихся агента различны
  id: 011-code-detect-bouncing-2
  fingerprint: 32faf2b9
- concept: детектор только распознаёт ситуацию, решение об остановке принимает оркестратор
  question: Детектор чередования сообщил, что задача ходит между двумя агентами. Что он делает дальше?
  explanation: 'Разделение распознавания и политики: детектор отвечает на вопрос «болтается ли задача сейчас», а что делать с этим фактом — эскалировать, сменить маршрут или продолжить — решает вызывающий код.'
  kind: choice
  options:
    - Прерывает маршрут и возвращает отказ пользователю
    - 'Ничего: он возвращает признак, а решение остановить маршрут принимает оркестратор'
    - Переназначает задачу третьему агенту
  correct: 1
  id: 011-code-detect-bouncing-3
  fingerprint: 2039974d
