- concept: стоимость топологии нормируется на одну успешно завершённую заявку и включает повторные попытки
  question: На профилировании топология обработала 200 заявок, успешно завершились 160, всего израсходовано 4800 вызовов модели (включая повторные попытки после сбоев). Сколько вызовов приходится на одну успешно завершённую заявку?
  explanation: '4800 / 160 = 30. Делить на общее число запущенных заявок нельзя: тогда топология с частыми ретраями и низкой долей успеха выглядит дешевле, чем есть. Единица стоимости — доведённый до результата ответ, а не попытка.'
  kind: numeric
  answer: 30
  tolerance: 0.5
  id: 026-comparison-metrics-1
  fingerprint: d840c897
- concept: задержку топологии под нагрузкой оценивают по хвосту распределения, а не только по среднему
  question: Две топологии профилируют на одинаковой нагрузке. У A средняя задержка 900 мс и p95 = 7 с, у B средняя 1,4 с и p95 = 1,8 с. SLA требует ответа не дольше 2 с. Какой вывод корректен?
  explanation: SLA нарушается на конкретных запросах, а не в среднем. У A каждый двадцатый запрос длится до 7 с — среднее это прячет. Поэтому задержку сравнивают по хвосту (p95/p99) рядом со средним.
  kind: choice
  options:
    - A быстрее, потому что у неё меньше средняя задержка
    - B соответствует SLA, а A нарушает его на заметной доле запросов, несмотря на лучшее среднее
    - Обе топологии соответствуют SLA, так как средние значения укладываются в 2 с
  correct: 1
  id: 026-comparison-metrics-2
  fingerprint: 729a84ef
- concept: метрика точности требует критерия качества, объявленного до прогона
  question: Почему при профилировании топологий точность задают как долю ответов, прошедших заранее объявленную проверку качества, а не оценивают ответы после прогона?
  explanation: Точность — доля ответов, прошедших проверку. Проверка, придуманная задним числом, измеряет вкус оценивающего, а не топологию, и результаты двух прогонов перестают быть сопоставимыми.
  kind: open
  reference: 'Точность должна быть сравнимой величиной между топологиями: одна и та же процедура проверки, применённая к одинаковым заявкам. Если критерий формулируется после того, как результаты видны, он подстраивается под понравившийся вариант, и число перестаёт измерять топологию. Объявленная заранее проверка также делает метрику воспроизводимой при повторном прогоне и позволяет считать долю прошедших автоматически, а не по впечатлению.'
  id: 026-comparison-metrics-3
  fingerprint: d6efe829
