- concept: при истинно параллельном запуске общее время равно максимальной задержке, а не сумме
  question: Четыре предлагающих агента отвечают за 4, 7, 10 и 5 секунд. Все задачи созданы сразу, ожидание одно на всю группу. Сколько секунд займёт сбор всех предложений?
  explanation: Параллельный запуск даёт max(4, 7, 10, 5) = 10 секунд. Если бы каждая задача создавалась после ответа предыдущей, вышло бы 26 секунд — это признак, что цикл ждёт внутри себя и параллельности нет.
  kind: numeric
  answer: 10
  tolerance: 0.5
  id: 018-code-run-parallel-1
  fingerprint: f965cc2e
- concept: 'порядок операций в параллельном запуске: сначала стартуют все задачи, ожидание одно на группу'
  question: Расставь шаги параллельного запуска предлагающих агентов.
  explanation: Ожидание должно стоять после старта всех задач. Ожидание внутри цикла создания превращает параллельную фазу предложений в последовательную очередь, хотя предложения независимы.
  kind: order
  items:
    - Создать задачу для каждого агента с одним и тем же исходным запросом, не дожидаясь ответа
    - Дождаться завершения всей группы задач
    - Сопоставить каждый ответ его агенту и вернуть собранный набор
  id: 018-code-run-parallel-2
  fingerprint: ad9a09b9
- concept: соответствие «агент — ответ» нельзя выводить из порядка завершения задач
  question: Функция параллельного запуска складывает ответы в список по мере их прихода. Почему это ломает результат?
  explanation: 'Порядок завершения определяется задержками, а не позицией в исходном списке. Нужен явный контракт: либо результаты собираются в исходном порядке агентов, либо возвращаются пары «агент — ответ». Иначе критика припишет предложение не тому автору.'
  kind: choice
  options:
    - Быстрый агент финиширует раньше медленного, и порядок ответов перестаёт совпадать с порядком агентов
    - Ответы, пришедшие позже, затирают более ранние
    - Список нельзя дополнять из нескольких задач одновременно
  correct: 0
