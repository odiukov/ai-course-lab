- concept: каталог специалистов расходует контекст супервизора линейно по их числу, ещё до запроса и истории
  question: 'Плоский supervisor-worker: у супервизора 60 специалистов, описание каждого занимает 150 токенов. Сколько токенов промпта уходит только на каталог специалистов, ещё до пользовательского запроса и истории диалога?'
  explanation: 'Каталог стоит N × размер описания: 60 × 150 = 9000 токенов. Стоимость растёт линейно с числом специалистов и платится на каждом ходу маршрутизации, независимо от того, сколько специалистов реально понадобится для задачи.'
  kind: numeric
  answer: 9000
  tolerance: 100
  id: 015-context-budget-1
  fingerprint: 56dd63d2
- concept: иерархия не уменьшает число специалистов в системе, а распределяет каталог между разными промптами
  question: Команду из 60 специалистов разбили на 6 направлений по 10 человек и поставили над ними верхнего супервизора. Что именно изменилось в системе?
  explanation: Иерархия — это разрез каталога по промптам, а не сокращение штата. Все 60 описаний по-прежнему существуют, просто 6 описаний направлений лежат у верхнего супервизора, а 10 описаний специалистов — только у супервизора своего направления. Выигрыш — в размере одного промпта, а не в размере системы.
  kind: choice
  options:
    - Общее число описаний специалистов в системе не изменилось, но ни один промпт больше не содержит их все сразу
    - Общее число описаний специалистов сократилось до 6, остальные удалены из системы
    - Описания стали короче, потому что часть информации о специалисте вынесена в имя направления
    - 'Каталог полностью исчез: маршрут теперь вычисляется кодом, а не моделью'
  correct: 0
  id: 015-context-budget-2
  fingerprint: 9aa16000
- concept: раздутый каталог ухудшает маршрутизацию, вытесняя из контекста сам запрос и историю
  question: Супервизор с большим плоским каталогом стал чаще выбирать неподходящего специалиста, хотя нужный в списке есть. Какое объяснение согласуется с ограничением контекстного бюджета?
  explanation: Каталог, запрос, правила маршрутизации и история конкурируют за один и тот же бюджет. Когда меню занимает большую его часть, детали задачи вытесняются, а множество похожих описаний размывает выбор. Симптом — падение качества решения, а не отказ вызова.
  kind: choice
  options:
    - Каталог занял столько места, что запрос пользователя и история работы получают меньше внимания, а близкие описания плохо различаются между собой
    - Специалисты стали хуже выполнять свою работу из-за роста нагрузки на них
    - Модель физически не может вызвать инструмент, если инструментов больше десяти
    - Ошибка возникает потому, что специалисты не могут передавать работу друг другу напрямую
  correct: 0
  id: 015-context-budget-3
  fingerprint: 7f45cf4c
