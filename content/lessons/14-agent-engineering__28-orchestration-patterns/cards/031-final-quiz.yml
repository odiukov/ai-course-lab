- concept: реальный продакшен-поток часто не сводится к одному каноническому паттерну и работает как гибрид
  question: 'Инженер сопоставляет семь своих продакшен-потоков с каноническими паттернами оркестрации и обнаруживает, что два потока не ложатся ни на один чисто: там есть центральный маршрутизатор, но исполнители на одном участке передают работу друг другу напрямую. Что это означает для описания и сопровождения системы?'
  explanation: Упражнение урока прямо предполагает, что часть потоков не ляжет чисто. Полезный вывод — размечать систему по участкам и требовать гарантий отдельно для каждого, а не выбирать один ярлык на всю систему.
  kind: open
  reference: 'Это нормальный гибрид, а не ошибка классификации: канонические паттерны — словарь для описания маршрута работы, а не список допустимых архитектур. Такой поток описывают по участкам: центральный участок — supervisor-worker со своими гарантиями (единая точка маршрутизации и аудита), участок с прямыми передачами — одноранговый, со своими рисками (нет узла с полной историей маршрута, нужны ограничители передач). Опасно натягивать на систему одно название: тогда к участку с прямыми передачами по инерции приписывают гарантии централизованного и не ставят нужных ограничителей.'
  id: 031-final-quiz-1
  fingerprint: 4df1fdf0
- concept: результат профилирования топологий переносится в продакшен только если профильная нагрузка воспроизводит его состав и интенсивность
  question: 'Команда сравнила четыре топологии на 40 искусственных запросах: все короткие, однотипные, без повторных попыток и без пиков. В продакшене же половина запросов смешивает несколько типов работы и приходит всплесками. Какой вывод корректен?'
  explanation: 'Равные условия обеспечивают честность сравнения, но не переносимость. Однотипные короткие запросы прячут именно те эффекты, ради которых выбирают топологию: накладные ходы маршрутизации на смешанной работе и деградацию хвоста задержки под всплесками.'
  kind: choice
  options:
    - Победитель профилирования переносится в продакшен, потому что топология сравнивалась в равных условиях
    - 'Сравнение не даёт основания для выбора: нагрузка не воспроизводит состав и интенсивность продакшена, а именно на смешанных запросах и пиках топологии расходятся сильнее всего'
    - 'Профилирование не нужно вовсе: топологию выбирают по числу специалистов'
    - Достаточно увеличить число искусственных запросов, состав нагрузки на результат не влияет
  correct: 1
  id: 031-final-quiz-2
