- concept: какие примитивы фреймворков реализуют именно supervisor-worker
  question: Какой набор фреймворковых примитивов относится к паттерну supervisor-worker?
  explanation: 'Название CrewAI Hierarchical Process обманчиво: это супервизор над исполнителями, а не многослойная иерархия. Вложенные подграфы и вложенные crew — это hierarchical; swarm-топология и handoffs — peer-to-peer.'
  kind: choice
  options:
    - LangGraph `create_supervisor`, Anthropic orchestrator-workers, CrewAI Hierarchical Process
    - Топология swarm в LangGraph и handoffs в OpenAI Agents SDK
    - Вложенные подграфы в LangGraph и вложенные crew в CrewAI
    - Параллельные предлагающие агенты с раундами взаимной критики
  correct: 0
