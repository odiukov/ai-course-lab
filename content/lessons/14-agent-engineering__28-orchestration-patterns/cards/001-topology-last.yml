- concept: 'topology-first thinking — антипаттерн: топология выбирается под названный сбой, а не наоборот'
  question: 'Команда говорит: «нашему пайплайну нужна мультиагентность». Что, согласно рекомендациям Anthropic по построению агентных систем, должно быть сделано до выбора топологии?'
  explanation: '«Успех не про самую изощрённую систему, а про правильную систему под задачу». Порядок решения начинается с одного агента плюс workflow-паттернов; topology-first thinking — заявленный антипаттерн: топология объявлена раньше, чем названа проблема.'
  kind: choice
  options:
    - Назвать конкретную проблему, которую топология решает, и убедиться, что один агент с workflow-паттернами её не закрывает
    - Выбрать фреймворк, потому что топология определяется его API
    - Заранее заложить три уровня супервизоров, чтобы систему потом не переписывать
    - Замерить стоимость токенов у всех четырёх паттернов и взять самый дешёвый
  correct: 0
  id: 001-topology-last-1
  fingerprint: f70d9feb
- concept: каждая передача работы между агентами добавляет прыжок, задержку и точку потери контекста
  question: Почему добавление ещё одного агента в пайплайн не бесплатно, даже если сам агент хорошо справляется со своей узкой ролью? Объясни своими словами.
  explanation: 'Издержки топологии измеримы: количество операций и глубина трейса. Пока проблема не названа, эти издержки оплачиваются без выигрыша.'
  kind: open
  reference: 'Каждый новый участник — это новая передача работы: дополнительный вызов модели, дополнительная задержка и ещё одно место, где контекст обрезается или искажается при передаче. В supervisor-топологии передача идёт через центр, то есть стоит два прыжка вместо одного. Поэтому агента добавляют только тогда, когда выигрыш перекрывает эти издержки; если исходная ошибка — плохое различение двух типов обращений, дешевле починить инструкцию или примеры.'
  id: 001-topology-last-2
  fingerprint: 63a67f24
