- concept: число операций — приблизительный показатель цены, а не точная сумма счёта, потому что операции неравноценны по токенам
  question: Одну и ту же заявку одна топология обрабатывает за 7 операций, другая за 21. Как корректно интерпретировать это сравнение?
  explanation: 'Операции неравноценны: короткий маршрутный ход и длинный ответ специалиста с полным контекстом расходуют разное число токенов. Счётчик операций даёт быструю и честную оценку порядка разницы, а не итоговую сумму в валюте.'
  kind: choice
  options:
    - Вторая топология стоит ровно втрое дороже первой в деньгах
    - Вторая топология делает втрое больше действий; это оценка порядка накладных расходов, а точная стоимость зависит от объёма токенов в каждой операции
    - Число операций не связано с ценой, сравнивать по нему нельзя
  correct: 1
  id: 020-trace-shapes-1
  fingerprint: 7292b50f
- concept: корректность финального ответа не измеряет накладную работу оркестрации, поэтому топологии сравнивают по журналу действий
  question: Две топологии вернули на одну заявку одинаково верный ответ. Объясни, почему из этого не следует, что они равноценны, и куда смотреть, чтобы их различить.
  explanation: Качество ответа — одна ось сравнения, накладные расходы оркестрации — другая. При равном качестве решение принимается по второй оси, и увидеть её можно только в журнале действий.
  kind: open
  reference: 'Финальная реплика показывает только результат и ничего не говорит о том, сколько работы потрачено на пути к нему. Различие лежит в журнале действий: сколько было вызовов модели, сколько передач работы и контекста, сколько проверок. Именно эта служебная работа определяет стоимость и задержку, поэтому сравнивать топологии нужно по трейсу, а не по одному ответу.'
  id: 020-trace-shapes-2
  fingerprint: 17e41ecd
