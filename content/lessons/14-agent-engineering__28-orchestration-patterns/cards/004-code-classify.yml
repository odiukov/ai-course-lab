- concept: классификатор — общий узел для всех топологий, поэтому в нём не должно быть логики конкретной топологии
  question: Почему в стенде, сравнивающем четыре топологии, классификация вынесена в отдельную функцию и не содержит ни выбора агента, ни составления ответа? Объясни своими словами.
  explanation: 'Тот же принцип контролируемого сравнения: фиксируем всё, кроме способа передачи работы.'
  kind: open
  reference: 'Классификатор — общая часть для всех четырёх паттернов. Если внутрь него положить выбор агента или готовый ответ, разные топологии начнут получать разный объём уже сделанной работы, и сравнение трейсов перестанет быть честным: непонятно, что дало выигрыш — маршрут или спрятанная в классификаторе логика. Кроме того, узел с одной ответственностью (строка на входе, метка на выходе) переиспользуется без изменений и тестируется отдельно.'
