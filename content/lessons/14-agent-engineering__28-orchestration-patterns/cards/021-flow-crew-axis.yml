- concept: режим управления (детерминированный поток событий против автономных ролей) — ось, ортогональная выбору топологии
  question: Команда уже выбрала supervisor-worker. Что остаётся нерешённым после этого выбора?
  explanation: 'Топология описывает, кто с кем связан. Режим управления описывает, кто выбирает следующий ход. Это независимые оси: одна и та же связка супервизора со специалистами работает и под жёсткими переходами в коде, и под решениями модели.'
  kind: choice
  options:
    - 'Ничего: топология однозначно задаёт и способ выбора следующего шага'
    - Только число специалистов, всё остальное определено топологией
    - Кто принимает решение о следующем переходе — код по заранее заданным правилам или модель по текущему контексту
  correct: 2
  id: 021-flow-crew-axis-1
  fingerprint: '35800434'
- concept: детерминированность относится к правилам переходов между шагами, а не к отсутствию модели внутри шага
  question: 'Коллега утверждает: «Если режим детерминированный, значит LLM там не используется». Объясни своими словами, в чём он ошибается.'
  explanation: 'Именно поэтому детерминированный режим рекомендуют как стартовую точку для продакшена: он не отказывается от модели, он забирает у неё право выбирать следующий шаг.'
  kind: open
  reference: 'Детерминированность касается движения между шагами: событие такое-то запускает заданный шаг, ошибка запускает заранее описанную ветку. Внутри шага модель вполне может писать текст, извлекать поля или анализировать документ. Фиксирован маршрут, а не содержимое работы, поэтому запуск воспроизводим и отлаживаем, хотя вывод модели остаётся вероятностным.'
  id: 021-flow-crew-axis-2
  fingerprint: d9e1a9d9
- concept: автономный режим по ролям обычно ложится на централизованную топологию с маршрутизатором на модели
  question: Режим автономной совместной работы по ролям чаще всего ложится на какую топологию?
  explanation: Автономный режим по ролям и режим событийной автоматизации оба обычно ложатся на централизованные топологии; в автономном варианте центр остаётся, но следующий ход выбирает модель, а не код. Иерархия и debate решают другие задачи — контекстный бюджет и верификацию.
  kind: choice
  options:
    - На supervisor-worker, где роль маршрутизатора выполняет LLM
    - На иерархию из трёх и более уровней супервизоров
    - 'На debate: роли обязаны критиковать друг друга'
  correct: 0
