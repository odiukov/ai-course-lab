<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Как контекстный бюджет создаёт второй уровень</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fb;
      --panel: #ffffff;
      --panel-soft: #eef2f7;
      --ink: #172033;
      --muted: #5d687b;
      --line: #8792a6;
      --border: #cbd3df;
      --accent: #315fd1;
      --accent-soft: #e6edff;
      --warning: #b64b2e;
      --warning-soft: #fff0e9;
      --success: #16745a;
      --success-soft: #e4f5ef;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #11151d;
        --panel: #1a202b;
        --panel-soft: #222a37;
        --ink: #f1f4fa;
        --muted: #adb7c8;
        --line: #7f8ba0;
        --border: #3b4658;
        --accent: #83a4ff;
        --accent-soft: #263657;
        --warning: #ff9d7d;
        --warning-soft: #422a25;
        --success: #6fd0ad;
        --success-soft: #203d35;
      }
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    figure {
      margin: 0;
      max-width: 1200px;
      background: var(--page);
    }

    figcaption {
      padding: 14px 20px 8px;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.25;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 490px;
      background: var(--page);
    }

    .panel {
      fill: var(--panel);
      stroke: var(--border);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .catalog {
      fill: var(--panel-soft);
      stroke: var(--border);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .supervisor {
      fill: var(--accent-soft);
      stroke: var(--accent);
      stroke-width: 2.5px;
      vector-effect: non-scaling-stroke;
    }

    .specialist {
      fill: var(--panel);
      stroke: var(--border);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .mini-description {
      fill: var(--panel);
      stroke: var(--border);
      stroke-width: 1.5px;
      vector-effect: non-scaling-stroke;
    }

    .total-left {
      fill: var(--warning-soft);
      stroke: var(--warning);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .total-right {
      fill: var(--success-soft);
      stroke: var(--success);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .flow {
      fill: none;
      stroke: var(--line);
      stroke-width: 2.5px;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .divider {
      fill: none;
      stroke: var(--border);
      stroke-width: 2px;
      stroke-dasharray: 7px 8px;
      vector-effect: non-scaling-stroke;
    }

    .heading {
      fill: var(--ink);
      font-size: 17px;
      font-weight: 700;
    }

    .label {
      fill: var(--ink);
      font-size: 15px;
      font-weight: 650;
    }

    .small {
      fill: var(--muted);
      font-size: 13px;
      font-weight: 550;
    }

    .group-label {
      fill: var(--ink);
      font-size: 12px;
      font-weight: 700;
    }

    .number-left {
      fill: var(--warning);
      font-size: 17px;
      font-weight: 750;
    }

    .number-right {
      fill: var(--success);
      font-size: 17px;
      font-weight: 750;
    }

    .insight {
      fill: var(--ink);
      font-size: 16px;
      font-weight: 700;
    }

    .insight-note {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 550;
    }

    .fallback {
      fill: var(--ink);
      font-size: 17px;
      font-weight: 650;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-caption">
    <figcaption id="diagram-caption">Как контекстный бюджет создаёт второй уровень</figcaption>
    <svg id="diagram"
         viewBox="0 0 1200 490"
         width="1200"
         height="490"
         role="img"
         aria-labelledby="svg-title svg-description"
         preserveAspectRatio="xMidYMid meet">
      <title id="svg-title">Сравнение плоской команды и двухуровневой иерархии</title>
      <desc id="svg-description">Слева супервизор читает четыре описания по двести токенов. Справа сорок описаний распределены между пятью подсупервизорами по восемь описаний.</desc>
    </svg>
  </figure>

  <script>
    const data = [{
      namespace: "http://www.w3.org/2000/svg",
      canvas: { x: 0, y: 0, width: 1200, height: 490 },
      radius: { panel: 14, box: 10, mini: 4 },
      divider: { x: 550, top: 18, bottom: 405 },
      left: {
        heading: { x: 280, y: 30, text: "4 описания: каталог занимает 800 токенов" },
        supervisor: { x: 180, y: 52, width: 200, height: 54 },
        supervisorLabel: { x: 280, y: 84, text: "Один супервизор" },
        arrow: {
          from: { x: 280, y: 106 },
          to: { x: 280, y: 132 },
          wingLeft: { x: 273, y: 123 },
          wingRight: { x: 287, y: 123 }
        },
        catalog: { x: 54, y: 132, width: 452, height: 232 },
        catalogLabel: { x: 74, y: 157, text: "Полный каталог в контексте" },
        cards: [
          { x: 74, y: 170, width: 412, height: 38 },
          { x: 74, y: 216, width: 412, height: 38 },
          { x: 74, y: 262, width: 412, height: 38 },
          { x: 74, y: 308, width: 412, height: 38 }
        ],
        cardText: "Описание специалиста",
        tokenText: "200 токенов",
        total: { x: 126, y: 374, width: 308, height: 42 },
        totalText: { x: 280, y: 401, text: "4 × 200 = 800 токенов" }
      },
      right: {
        heading: { x: 875, y: 30, text: "40 описаний: полный каталог — 8000 токенов" },
        supervisor: { x: 765, y: 52, width: 220, height: 62 },
        supervisorLabel: { x: 875, y: 78, text: "Верхний супервизор" },
        directionLabel: { x: 875, y: 101, text: "видит 5 направлений" },
        trunk: { x: 875, top: 114, bus: 144 },
        bus: { left: 641, right: 1109, y: 144 },
        branch: { top: 144, bottom: 184, wing: 177, spread: 6 },
        groupY: 184,
        groupWidth: 102,
        groupHeight: 182,
        groupHeaderY: 210,
        groupFooterY: 353,
        groupLabel: "Подсуп.",
        groupFooter: "8 × 200",
        groups: [
          { x: 590, center: 641 },
          { x: 707, center: 758 },
          { x: 824, center: 875 },
          { x: 941, center: 992 },
          { x: 1058, center: 1109 }
        ],
        mini: {
          offsetX: 14,
          width: 74,
          height: 8,
          rows: [224, 238, 252, 266, 280, 294, 308, 322]
        },
        total: { x: 655, y: 374, width: 440, height: 42 },
        totalText: { x: 875, y: 401, text: "5 × 8 × 200 = 8000 токенов" }
      },
      insight: {
        box: { x: 92, y: 429, width: 1016, height: 50 },
        title: { x: 600, y: 451, text: "Два коротких выбора: 5 направлений → 8 специалистов" },
        note: { x: 600, y: 470, text: "Все 40 описаний больше не занимают контекст верхнего супервизора" }
      },
      fallback: [
        { x: 60, y: 210, text: "Схема должна показать: 4 описания × 200 = 800 токенов." },
        { x: 60, y: 245, text: "При росте до 40 описаний × 200 = 8000 токенов появляется второй уровень." }
      ]
    }];

    const origin = { x: 0, y: 0 };
    const scale = { x: 1, y: 1 };

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const [model] = data;
    const svg = document.getElementById("diagram");

    try {
      const make = (tag, attributes, className) => {
        const element = document.createElementNS(model.namespace, tag);
        Object.entries(attributes).forEach(([name, value]) => {
          element.setAttribute(name, value);
        });
        if (className) element.setAttribute("class", className);
        return element;
      };

      const add = element => {
        svg.appendChild(element);
        return element;
      };

      const rectangle = (box, className, radius) => add(make("rect", {
        x: sx(box.x),
        y: sy(box.y),
        width: sx(box.x + box.width) - sx(box.x),
        height: sy(box.y + box.height) - sy(box.y),
        rx: sx(radius) - sx(origin.x),
        ry: sy(radius) - sy(origin.y)
      }, className));

      const line = (from, to, className) => add(make("line", {
        x1: sx(from.x),
        y1: sy(from.y),
        x2: sx(to.x),
        y2: sy(to.y)
      }, className));

      const text = (label, className, anchor) => {
        const element = add(make("text", {
          x: sx(label.x),
          y: sy(label.y),
          "text-anchor": anchor
        }, className));
        element.textContent = label.text;
        return element;
      };

      const arrow = spec => {
        line(spec.from, spec.to, "flow");
        line(spec.wingLeft, spec.to, "flow");
        line(spec.wingRight, spec.to, "flow");
      };

      rectangle(model.canvas, "panel", model.radius.panel);

      const { left, right, divider, insight } = model;

      line(
        { x: divider.x, y: divider.top },
        { x: divider.x, y: divider.bottom },
        "divider"
      );

      text(left.heading, "heading", "middle");
      rectangle(left.supervisor, "supervisor", model.radius.box);
      text(left.supervisorLabel, "label", "middle");
      arrow(left.arrow);

      rectangle(left.catalog, "catalog", model.radius.panel);
      text(left.catalogLabel, "small", "start");

      left.cards.forEach(card => {
        rectangle(card, "specialist", model.radius.box);
        text(
          {
            x: card.x + 18,
            y: card.y + 24,
            text: left.cardText
          },
          "label",
          "start"
        );
        text(
          {
            x: card.x + card.width - 18,
            y: card.y + 24,
            text: left.tokenText
          },
          "small",
          "end"
        );
      });

      rectangle(left.total, "total-left", model.radius.box);
      text(left.totalText, "number-left", "middle");

      text(right.heading, "heading", "middle");
      rectangle(right.supervisor, "supervisor", model.radius.box);
      text(right.supervisorLabel, "label", "middle");
      text(right.directionLabel, "small", "middle");

      line(
        { x: right.trunk.x, y: right.trunk.top },
        { x: right.trunk.x, y: right.trunk.bus },
        "flow"
      );
      line(
        { x: right.bus.left, y: right.bus.y },
        { x: right.bus.right, y: right.bus.y },
        "flow"
      );

      right.groups.forEach(group => {
        line(
          { x: group.center, y: right.branch.top },
          { x: group.center, y: right.branch.bottom },
          "flow"
        );
        line(
          {
            x: group.center - right.branch.spread,
            y: right.branch.wing
          },
          {
            x: group.center,
            y: right.branch.bottom
          },
          "flow"
        );
        line(
          {
            x: group.center + right.branch.spread,
            y: right.branch.wing
          },
          {
            x: group.center,
            y: right.branch.bottom
          },
          "flow"
        );

        const groupBox = {
          x: group.x,
          y: right.groupY,
          width: right.groupWidth,
          height: right.groupHeight
        };
        rectangle(groupBox, "catalog", model.radius.box);

        text(
          {
            x: group.center,
            y: right.groupHeaderY,
            text: right.groupLabel
          },
          "group-label",
          "middle"
        );

        right.mini.rows.forEach(row => {
          rectangle(
            {
              x: group.x + right.mini.offsetX,
              y: row,
              width: right.mini.width,
              height: right.mini.height
            },
            "mini-description",
            model.radius.mini
          );
        });

        text(
          {
            x: group.center,
            y: right.groupFooterY,
            text: right.groupFooter
          },
          "small",
          "middle"
        );
      });

      rectangle(right.total, "total-right", model.radius.box);
      text(right.totalText, "number-right", "middle");

      rectangle(insight.box, "supervisor", model.radius.panel);
      text(insight.title, "insight", "middle");
      text(insight.note, "insight-note", "middle");
    } catch (error) {
      while (svg.lastChild) svg.removeChild(svg.lastChild);

      const fallbackBackground = document.createElementNS(model.namespace, "rect");
      fallbackBackground.setAttribute("x", sx(model.canvas.x));
      fallbackBackground.setAttribute("y", sy(model.canvas.y));
      fallbackBackground.setAttribute(
        "width",
        sx(model.canvas.x + model.canvas.width) - sx(model.canvas.x)
      );
      fallbackBackground.setAttribute(
        "height",
        sy(model.canvas.y + model.canvas.height) - sy(model.canvas.y)
      );
      fallbackBackground.setAttribute("class", "panel");
      svg.appendChild(fallbackBackground);

      model.fallback.forEach(label => {
        const message = document.createElementNS(model.namespace, "text");
        message.setAttribute("x", sx(label.x));
        message.setAttribute("y", sy(label.y));
        message.setAttribute("text-anchor", "start");
        message.setAttribute("class", "fallback");
        message.textContent = label.text;
        svg.appendChild(message);
      });
    }
  </script>
</body>
</html>
