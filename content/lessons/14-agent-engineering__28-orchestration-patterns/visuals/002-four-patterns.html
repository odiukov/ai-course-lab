<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Карта четырёх паттернов оркестрации</title>
<style>
  :root{
    color-scheme:light dark;
    --page:#f6f7fb;
    --panel:#ffffff;
    --panel-soft:#f1f4f9;
    --ink:#182234;
    --muted:#5d697b;
    --border:#cbd3df;
    --supervisor:#197a86;
    --swarm:#c06622;
    --hierarchy:#7452ad;
    --debate:#b64b61;
    --node:#ffffff;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --page:#10151e;
      --panel:#171e29;
      --panel-soft:#202938;
      --ink:#edf2f8;
      --muted:#aeb9c8;
      --border:#3b485b;
      --supervisor:#55bdc7;
      --swarm:#f0a15f;
      --hierarchy:#b79ae5;
      --debate:#ef8298;
      --node:#171e29;
    }
  }
  html,body{background:var(--page);color:var(--ink)}
  body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  figure{
    margin:0;
    overflow:hidden;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
  }
  figcaption{
    padding:14px 18px 8px;
    font-size:20px;
    font-weight:750;
    letter-spacing:-.01em;
  }
  svg{
    display:block;
    width:100%;
    height:auto;
    max-height:470px;
    background:var(--panel);
  }
  .panel{fill:var(--panel-soft);stroke:var(--border);stroke-width:1.5}
  .node{fill:var(--node);stroke-width:2}
  .route{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .head{stroke:none}
  .panel-title{fill:var(--ink);font-size:15px;font-weight:800;letter-spacing:.08em}
  .node-label{fill:var(--ink);font-size:12px;font-weight:700}
  .caption{fill:var(--ink);font-size:14px;font-weight:750}
  .note{fill:var(--muted);font-size:12px;font-weight:550}
  .fallback{fill:var(--muted);font-size:16px}
</style>
</head>
<body>
<figure>
  <figcaption>Карта четырёх паттернов оркестрации</figcaption>
  <svg id="map" viewBox="0 0 1120 470" width="1120" height="470"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="svg-title svg-desc">
    <title id="svg-title">Четыре паттерна оркестрации агентов</title>
    <desc id="svg-desc">Супервизор, рой, двухуровневая иерархия и дебаты трёх участников.</desc>
  </svg>
</figure>
<script>
const data=[{
  ns:"http://www.w3.org/2000/svg",
  canvas:{w:1120,h:470},
  zero:0,negOne:-1,negTwo:-2,
  head:{length:0.72,wing:0.38},
  panel:{y:3,h:39,round:0.8,titleY:1.35,ruleY:33},
  panels:[
    {x:0,w:24,title:"СУПЕРВИЗОР",color:"var(--supervisor)",
     captions:[
       {x:12,y:35.4,text:"Все передачи — через центр",class:"caption"},
       {x:12,y:38.2,text:"Единая точка контроля",class:"note"},
       {x:12,y:40.5,text:"Цена: лишний прыжок маршрута",class:"note"}
     ]},
    {x:26,w:24,title:"РОЙ",color:"var(--swarm)",
     captions:[
       {x:38,y:35.4,text:"Передачи напрямую",class:"caption"},
       {x:38,y:38.2,text:"Короче путь, нет единого центра",class:"note"},
       {x:38,y:40.5,text:"Нужен лимит передач",class:"note"}
     ]},
    {x:52,w:24,title:"ИЕРАРХИЯ",color:"var(--hierarchy)",
     captions:[
       {x:64,y:35.4,text:"2 уровня управления",class:"caption"},
       {x:64,y:38.2,text:"Руководители делят контекст",class:"note"},
       {x:64,y:40.5,text:"Оправдано для большой команды",class:"note"}
     ]},
    {x:78,w:26,title:"ДЕБАТЫ",color:"var(--debate)",
     captions:[
       {x:91,y:35.4,text:"3 участника параллельно",class:"caption"},
       {x:91,y:38.2,text:"Затем — взаимная критика",class:"note"},
       {x:91,y:40.5,text:"Цель: снизить вероятность ошибки",class:"note"}
     ]}
  ],
  nodes:[
    {x:8,y:9,w:8,h:5,label:"Центр",color:"var(--supervisor)"},
    {x:1.5,y:23,w:6,h:4.5,label:"Факты",color:"var(--supervisor)"},
    {x:9,y:23,w:6,h:4.5,label:"Текст",color:"var(--supervisor)"},
    {x:16.5,y:23,w:6,h:4.5,label:"Зал",color:"var(--supervisor)"},

    {x:28,y:9.5,w:7,h:4.5,label:"Факты",color:"var(--swarm)"},
    {x:41,y:9.5,w:7,h:4.5,label:"Текст",color:"var(--swarm)"},
    {x:34.5,y:23,w:7,h:4.5,label:"Зал",color:"var(--swarm)"},

    {x:60,y:7,w:8,h:4.5,label:"Главный",color:"var(--hierarchy)"},
    {x:53.5,y:16,w:9,h:4.5,label:"Рук. фактов",color:"var(--hierarchy)"},
    {x:65.5,y:16,w:9,h:4.5,label:"Рук. формы",color:"var(--hierarchy)"},
    {x:53,y:26,w:5,h:4,label:"Факт",color:"var(--hierarchy)"},
    {x:59,y:26,w:5,h:4,label:"Архив",color:"var(--hierarchy)"},
    {x:65,y:26,w:5,h:4,label:"Текст",color:"var(--hierarchy)"},
    {x:71,y:26,w:4.5,h:4,label:"Зал",color:"var(--hierarchy)"},

    {x:79.5,y:10,w:7,h:4.5,label:"Участник А",color:"var(--debate)"},
    {x:87.5,y:10,w:7,h:4.5,label:"Участник Б",color:"var(--debate)"},
    {x:95.5,y:10,w:7,h:4.5,label:"Участник В",color:"var(--debate)"}
  ],
  arrows:[
    {color:"var(--supervisor)",bi:true,points:[{x:10,y:14},{x:4.5,y:23}]},
    {color:"var(--supervisor)",bi:true,points:[{x:12,y:14},{x:12,y:23}]},
    {color:"var(--supervisor)",bi:true,points:[{x:14,y:14},{x:19.5,y:23}]},

    {color:"var(--swarm)",bi:true,points:[{x:35,y:11.75},{x:41,y:11.75}]},
    {color:"var(--swarm)",bi:true,points:[{x:31.5,y:14},{x:37,y:23}]},
    {color:"var(--swarm)",bi:true,points:[{x:44.5,y:14},{x:39,y:23}]},

    {color:"var(--hierarchy)",points:[{x:62,y:11.5},{x:58,y:16}]},
    {color:"var(--hierarchy)",points:[{x:66,y:11.5},{x:70,y:16}]},
    {color:"var(--hierarchy)",points:[{x:56.5,y:20.5},{x:55.5,y:26}]},
    {color:"var(--hierarchy)",points:[{x:59.5,y:20.5},{x:61.5,y:26}]},
    {color:"var(--hierarchy)",points:[{x:68.5,y:20.5},{x:67.5,y:26}]},
    {color:"var(--hierarchy)",points:[{x:71.5,y:20.5},{x:73.25,y:26}]},

    {color:"var(--debate)",bi:true,points:[{x:86.5,y:12.25},{x:87.5,y:12.25}]},
    {color:"var(--debate)",bi:true,points:[{x:94.5,y:12.25},{x:95.5,y:12.25}]},
    {color:"var(--debate)",bi:true,points:[
      {x:83,y:14.5},{x:83,y:21},{x:99,y:21},{x:99,y:14.5}
    ]}
  ],
  tags:[
    {x:12,y:18.1,text:"маршрутизация",color:"var(--supervisor)"},
    {x:38,y:18.3,text:"прямые передачи",color:"var(--swarm)"},
    {x:64,y:23.2,text:"исполнители",color:"var(--hierarchy)"},
    {x:91,y:24.2,text:"критика версий друг друга",color:"var(--debate)"}
  ],
  fallback:{x:52,y:21,text:"Схема должна показать супервизор, рой, иерархию и дебаты."}
}];
const origin={x:40,y:25};
const scale={x:10,y:10};
const sx=x=>origin.x+x*scale.x;
const sy=y=>origin.y+y*scale.y;

try{
  const [D]=data;
  const svg=document.getElementById("map");
  const title=document.getElementById("svg-title");
  const desc=document.getElementById("svg-desc");
  svg.replaceChildren(title,desc);

  const make=(name,attrs,text)=>{
    const node=document.createElementNS(D.ns,name);
    for(const [key,value] of Object.entries(attrs)) node.setAttribute(key,value);
    if(text!==undefined) node.textContent=text;
    return node;
  };
  const addText=item=>{
    svg.append(make("text",{
      x:sx(item.x),y:sy(item.y),
      dx:item.dx??D.zero,dy:item.dy??D.zero,
      class:item.class??"note",
      fill:item.color??"var(--ink)",
      "text-anchor":item.anchor??"middle",
      "dominant-baseline":"middle"
    },item.text));
  };
  const addHead=(tip,behind,color)=>{
    const vx=tip.x-behind.x;
    const vy=tip.y-behind.y;
    const magnitude=Math.hypot(vx,vy);
    const ux=vx/magnitude;
    const uy=vy/magnitude;
    const bx=tip.x-ux*D.head.length;
    const by=tip.y-uy*D.head.length;
    const left={x:bx-uy*D.head.wing,y:by+ux*D.head.wing};
    const right={x:bx+uy*D.head.wing,y:by-ux*D.head.wing};
    const points=[tip,left,right]
      .map(point=>`${sx(point.x)},${sy(point.y)}`).join(" ");
    svg.append(make("polygon",{points,fill:color,class:"head"}));
  };

  for(const panel of D.panels){
    svg.append(make("rect",{
      x:sx(panel.x),y:sy(D.panel.y),
      width:sx(panel.x+panel.w)-sx(panel.x),
      height:sy(D.panel.y+D.panel.h)-sy(D.panel.y),
      rx:sx(panel.x+D.panel.round)-sx(panel.x),
      class:"panel"
    }));
    svg.append(make("line",{
      x1:sx(panel.x+1.2),y1:sy(D.panel.ruleY),
      x2:sx(panel.x+panel.w-1.2),y2:sy(D.panel.ruleY),
      stroke:"var(--border)","stroke-width":"1.5"
    }));
    addText({
      x:panel.x+panel.w/scale.y,
      y:D.panel.titleY,
      text:panel.title,class:"panel-title",color:panel.color
    });
    for(const caption of panel.captions) addText(caption);
  }

  for(const arrow of D.arrows){
    const points=arrow.points
      .map(point=>`${sx(point.x)},${sy(point.y)}`).join(" ");
    svg.append(make("polyline",{
      points,class:"route",stroke:arrow.color
    }));
    const [first,second]=arrow.points;
    const last=arrow.points.at(D.negOne);
    const beforeLast=arrow.points.at(D.negTwo);
    addHead(last,beforeLast,arrow.color);
    if(arrow.bi) addHead(first,second,arrow.color);
  }

  for(const node of D.nodes){
    svg.append(make("rect",{
      x:sx(node.x),y:sy(node.y),
      width:sx(node.x+node.w)-sx(node.x),
      height:sy(node.y+node.h)-sy(node.y),
      rx:sx(node.x+D.panel.round)-sx(node.x),
      class:"node",stroke:node.color
    }));
    addText({
      x:node.x+node.w/scale.y,
      y:node.y+node.h/scale.y,
      text:node.label,class:"node-label"
    });
  }

  for(const tag of D.tags) addText(tag);
}catch(error){
  const [D]=data;
  const svg=document.getElementById("map");
  while(svg.lastChild) svg.removeChild(svg.lastChild);
  const message=document.createElementNS(D.ns,"text");
  message.setAttribute("x",sx(D.fallback.x));
  message.setAttribute("y",sy(D.fallback.y));
  message.setAttribute("text-anchor","middle");
  message.setAttribute("class","fallback");
  message.textContent=D.fallback.text;
  svg.append(message);
}
</script>
</body>
</html>
