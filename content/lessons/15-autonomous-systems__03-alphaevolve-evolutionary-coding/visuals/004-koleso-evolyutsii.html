<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Полный цикл AlphaEvolve</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #eef2f7;
      --canvas: #f8fafc;
      --text: #172033;
      --muted: #526078;
      --line: #52637c;
      --arrow: #395ec9;
      --database-fill: #e4ecff;
      --database-stroke: #496ac5;
      --selection-fill: #e4f5ef;
      --selection-stroke: #298366;
      --mutation-fill: #fff0d9;
      --mutation-stroke: #c77720;
      --evaluation-fill: #f2e9ff;
      --evaluation-stroke: #8153ba;
      --core: #34435b;
      --frame: #cbd4e2;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #090f1c;
        --canvas: #111a2b;
        --text: #eef3ff;
        --muted: #b7c1d5;
        --line: #8d9bb3;
        --arrow: #8ba9ff;
        --database-fill: #1b315d;
        --database-stroke: #8ba9ff;
        --selection-fill: #173d35;
        --selection-stroke: #62d0ad;
        --mutation-fill: #493019;
        --mutation-stroke: #f0aa5b;
        --evaluation-fill: #35244e;
        --evaluation-stroke: #c29ae9;
        --core: #d9e2f3;
        --frame: #354158;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: unset;
      background: var(--page);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: 100%;
      max-width: 960px;
      margin-inline: auto;
    }

    h1 {
      margin: unset;
      padding: 12px;
      font-size: 22px;
      line-height: normal;
      text-align: center;
    }

    .stage {
      width: 100%;
      background: var(--canvas);
      border: 2px solid var(--frame);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 460px;
      background: var(--canvas);
    }

    .flow {
      fill: none;
      stroke: var(--arrow);
      stroke-width: 3px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arrowhead {
      fill: var(--arrow);
      stroke: var(--arrow);
      stroke-width: 1px;
      stroke-linejoin: round;
    }

    .node-box {
      stroke-width: 2px;
    }

    .database .node-box {
      fill: var(--database-fill);
      stroke: var(--database-stroke);
    }

    .selection .node-box {
      fill: var(--selection-fill);
      stroke: var(--selection-stroke);
    }

    .mutation .node-box {
      fill: var(--mutation-fill);
      stroke: var(--mutation-stroke);
    }

    .evaluation .node-box {
      fill: var(--evaluation-fill);
      stroke: var(--evaluation-stroke);
    }

    .node-title {
      fill: var(--text);
      font-size: 17px;
      font-weight: bold;
    }

    .node-subtitle {
      fill: var(--muted);
      font-size: 13px;
    }

    .edge-label {
      fill: var(--text);
      stroke: var(--canvas);
      stroke-width: 5px;
      stroke-linejoin: round;
      paint-order: stroke;
      font-size: 12px;
      font-weight: bold;
    }

    .core-title {
      fill: var(--core);
      font-size: 16px;
      font-weight: bold;
    }

    .core-text {
      fill: var(--muted);
      font-size: 13px;
    }

    .footer {
      fill: var(--muted);
      font-size: 12px;
      font-weight: bold;
    }

    #fallback {
      padding: 12px;
      color: var(--text);
      background: var(--canvas);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Полный цикл AlphaEvolve</h1>

    <div class="stage">
      <svg
        id="diagram"
        viewBox="0 0 960 460"
        width="960"
        height="460"
        preserveAspectRatio="xMidYMid meet"
        role="img"
        aria-labelledby="svg-title svg-description"
      >
        <title id="svg-title">Полный цикл AlphaEvolve</title>
        <desc id="svg-description">
          Кольцевая схема: база программ, выбор родителей, точечная мутация
          от языковой модели, машинная оценка и возврат улучшенного варианта
          в подходящую ячейку базы.
        </desc>
      </svg>

      <p id="fallback" hidden>
        Схема должна была показать цикл: из базы программ выбирают родителей,
        LLM вносит точечное изменение, машина компилирует, запускает и
        оценивает кандидата, после чего лучший вариант возвращается в
        подходящую ячейку базы.
      </p>

      <noscript>
        <p id="noscript-fallback">
          Из базы программ выбирают родителей, LLM предлагает точечную
          мутацию, машина оценивает результат, а улучшенный вариант
          возвращается в базу.
        </p>
      </noscript>
    </div>
  </main>

  <script>
    const data = [
      {
        type: "meta",
        origin: { x: 38, y: 10 },
        scale: { x: 8.84, y: 9.8 },
        zero: 0
      },
      {
        type: "arrow",
        curve: [
          { x: 65, y: 8 },
          { x: 70, y: 8 },
          { x: 77, y: 12 },
          { x: 78, y: 17 }
        ],
        head: [
          { x: 78, y: 17 },
          { x: 76.8, y: 15.4 },
          { x: 79.2, y: 15.6 }
        ],
        label: {
          x: 79,
          y: 9,
          anchor: "middle",
          text: "один или несколько"
        }
      },
      {
        type: "arrow",
        curve: [
          { x: 82, y: 29 },
          { x: 82, y: 33 },
          { x: 73, y: 36 },
          { x: 67, y: 37.5 }
        ],
        head: [
          { x: 67, y: 37.5 },
          { x: 69.2, y: 35.9 },
          { x: 69.4, y: 38.2 }
        ],
        label: {
          x: 84,
          y: 32,
          anchor: "middle",
          text: "промпт с контекстом"
        }
      },
      {
        type: "arrow",
        curve: [
          { x: 33, y: 38 },
          { x: 25, y: 38 },
          { x: 20, y: 34 },
          { x: 20, y: 29 }
        ],
        head: [
          { x: 20, y: 29 },
          { x: 18.8, y: 31 },
          { x: 21.2, y: 31 }
        ],
        label: {
          x: 19,
          y: 37,
          anchor: "middle",
          text: "кандидат"
        }
      },
      {
        type: "arrow",
        curve: [
          { x: 20, y: 17 },
          { x: 20, y: 12 },
          { x: 29, y: 8 },
          { x: 35, y: 8 }
        ],
        head: [
          { x: 35, y: 8 },
          { x: 33, y: 6.8 },
          { x: 33, y: 9.2 }
        ],
        label: {
          x: 18,
          y: 9,
          anchor: "middle",
          text: "улучшился → в свою ячейку"
        }
      },
      {
        type: "node",
        kind: "database",
        bounds: { x1: 35, y1: 3, x2: 65, y2: 13, rx: 1.2, ry: 1.2 },
        lines: [
          {
            x: 50,
            y: 5.7,
            anchor: "middle",
            className: "node-title",
            text: "База программ"
          },
          {
            x: 50,
            y: 8.4,
            anchor: "middle",
            className: "node-subtitle",
            text: "MAP-elites / острова"
          },
          {
            x: 50,
            y: 10.8,
            anchor: "middle",
            className: "node-subtitle",
            text: "лучший в каждой ячейке"
          }
        ]
      },
      {
        type: "node",
        kind: "selection",
        bounds: { x1: 70, y1: 18, x2: 95, y2: 28, rx: 1.2, ry: 1.2 },
        lines: [
          {
            x: 82.5,
            y: 20.7,
            anchor: "middle",
            className: "node-title",
            text: "Выбор родителей"
          },
          {
            x: 82.5,
            y: 23.4,
            anchor: "middle",
            className: "node-subtitle",
            text: "родители + сильные соседи"
          },
          {
            x: 82.5,
            y: 25.8,
            anchor: "middle",
            className: "node-subtitle",
            text: "задача + правила оценки"
          }
        ]
      },
      {
        type: "node",
        kind: "mutation",
        bounds: { x1: 34, y1: 33, x2: 66, y2: 43, rx: 1.2, ry: 1.2 },
        lines: [
          {
            x: 50,
            y: 35.7,
            anchor: "middle",
            className: "node-title",
            text: "Точечная мутация от LLM"
          },
          {
            x: 50,
            y: 38.4,
            anchor: "middle",
            className: "node-subtitle",
            text: "локальная правка программы"
          },
          {
            x: 50,
            y: 40.8,
            anchor: "middle",
            className: "node-subtitle",
            text: "модель не выносит вердикт"
          }
        ]
      },
      {
        type: "node",
        kind: "evaluation",
        bounds: { x1: 5, y1: 18, x2: 30, y2: 28, rx: 1.2, ry: 1.2 },
        lines: [
          {
            x: 17.5,
            y: 20.7,
            anchor: "middle",
            className: "node-title",
            text: "Машинная оценка"
          },
          {
            x: 17.5,
            y: 23.4,
            anchor: "middle",
            className: "node-subtitle",
            text: "компиляция → запуск → число"
          },
          {
            x: 17.5,
            y: 25.8,
            anchor: "middle",
            className: "node-subtitle",
            text: "сломалось или хуже → отбросить"
          }
        ]
      },
      {
        type: "text",
        x: 50,
        y: 20.7,
        anchor: "middle",
        className: "core-title",
        text: "Разделение ролей"
      },
      {
        type: "text",
        x: 50,
        y: 23.3,
        anchor: "middle",
        className: "core-text",
        text: "LLM предлагает изменение"
      },
      {
        type: "text",
        x: 50,
        y: 25.7,
        anchor: "middle",
        className: "core-text",
        text: "оценщик решает числом"
      },
      {
        type: "text",
        x: 50,
        y: 45.1,
        anchor: "middle",
        className: "footer",
        text: "Каждый запуск меняет выбор для следующего оборота"
      }
    ];

    const meta = data.find(item => item.type === "meta");
    const origin = meta.origin;
    const scale = meta.scale;
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      const make = (name, attributes, className) => {
        const element = document.createElementNS(namespace, name);

        for (const [key, value] of Object.entries(attributes)) {
          element.setAttribute(key, value);
        }

        if (className) {
          element.setAttribute("class", className);
        }

        return element;
      };

      const makeText = item => {
        const text = make(
          "text",
          {
            x: sx(item.x),
            y: sy(item.y),
            "text-anchor": item.anchor,
            "dominant-baseline": "middle"
          },
          item.className
        );

        text.textContent = item.text;
        return text;
      };

      const arrowLayer = make("g", { "aria-hidden": "true" }, "arrows");
      const labelLayer = make("g", { "aria-hidden": "true" }, "labels");
      const nodeLayer = make("g", { "aria-hidden": "true" }, "nodes");
      const noteLayer = make("g", { "aria-hidden": "true" }, "notes");

      for (const item of data.filter(entry => entry.type === "arrow")) {
        const [start, controlA, controlB, end] = item.curve;
        const pathData = [
          "M", sx(start.x), sy(start.y),
          "C", sx(controlA.x), sy(controlA.y),
          sx(controlB.x), sy(controlB.y),
          sx(end.x), sy(end.y)
        ].join(" ");

        arrowLayer.append(
          make("path", { d: pathData }, "flow")
        );

        const points = item.head
          .map(point => `${sx(point.x)},${sy(point.y)}`)
          .join(" ");

        arrowLayer.append(
          make("polygon", { points }, "arrowhead")
        );

        labelLayer.append(makeText({
          ...item.label,
          className: "edge-label"
        }));
      }

      for (const item of data.filter(entry => entry.type === "node")) {
        const group = make("g", {}, `node ${item.kind}`);
        const box = item.bounds;

        group.append(
          make(
            "rect",
            {
              x: sx(box.x1),
              y: sy(box.y1),
              width: sx(box.x2) - sx(box.x1),
              height: sy(box.y2) - sy(box.y1),
              rx: sx(box.rx) - sx(meta.zero),
              ry: sy(box.ry) - sy(meta.zero)
            },
            "node-box"
          )
        );

        for (const line of item.lines) {
          group.append(makeText(line));
        }

        nodeLayer.append(group);
      }

      for (const item of data.filter(entry => entry.type === "text")) {
        noteLayer.append(makeText(item));
      }

      svg.append(arrowLayer, labelLayer, nodeLayer, noteLayer);
      fallback.hidden = true;
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");

      if (svg) {
        svg.hidden = true;
      }

      if (fallback) {
        fallback.hidden = false;
      }
    }
  </script>
</body>
</html>
