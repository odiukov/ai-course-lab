- concept: при замере производительности полученный результат обязан быть использован, иначе оптимизатор удаляет измеряемое вычисление и замер показывает пустой прогон
  question: 'Стенд замеряет время кандидата так: берёт метку времени, вызывает кандидата, отбрасывает возвращённое значение, берёт вторую метку. Один кандидат внезапно показал 0,4 мс вместо обычных 240 мс. Что самое вероятное?'
  explanation: 'Если возвращённое значение никуда не идёт, компилятор, JIT или ленивое вычисление вправе не считать его вовсе — измеряется накладной расход вызова. Поэтому в замере результат обязательно потребляют: складывают, сравнивают с эталоном, пишут в переменную вне области оптимизации. Прохождение корректности этого не закрывает: корректность проверялась в другом прогоне.'
  kind: choice
  options:
    - Кандидат нашёл принципиально лучший алгоритм, и результат надо принять
    - Результат нигде не используется, поэтому вычисление могло быть выброшено, и замер отражает пустой прогон
    - Метка времени имеет слишком грубое разрешение для быстрых кандидатов
    - Кандидат прошёл проверку корректности, значит замеру можно доверять
  correct: 1
  id: 034-audit-do-zapuska-1
  fingerprint: 0c1563dd
- concept: 'стенд контролируют заранее испорченным кандидатом: он обязан быть отвергнут, причём по ожидаемой причине'
  question: Аудит оценщика перед запуском эволюции включает контроль стендом на заранее испорченном кандидате. Объясни своими словами, как он устроен и что означает его провал.
  explanation: 'Смысл контроля — проверить сам измерительный инструмент до того, как на него потратят бюджет поиска. Аудит идёт строго до цикла: оценщик, не ловящий знакомую поломку, превращает поиск в машину по производству красивого и неверного кода.'
  kind: open
  reference: 'В стенд намеренно подают кандидата с известной поломкой: возвращает зашитый ответ, падает на редком входе, портит общее состояние, обходит вычисление. Ожидание фиксируется заранее: такой кандидат должен быть отвергнут, и именно по той причине, которую заложили. Если он проходит — оценщик слеп к этому классу отказов, и цикл будет находить такие кандидаты всё чаще. Если он отвергнут, но по другой причине, диагностика оценщика ненадёжна и настоящий отказ припишется не тому.'
  id: 034-audit-do-zapuska-2
  fingerprint: a3261340
- concept: повторяющиеся входы и общее состояние между прогонами фальсифицируют замер, потому что кандидат может отдавать кэшированный или зашитый ответ
  question: Стенд гоняет каждого кандидата на одном и том же наборе входов подряд, не сбрасывая состояние процесса между прогонами. Какую поломку такой стенд пропустит?
  explanation: 'При повторе одинаковых входов без сброса состояния кэширование и заготовленные ответы выглядят как честное ускорение. Поэтому в аудит закладывают меняющиеся входы, изоляцию состояния между прогонами и отдельную проверку на зашитые ответы. Остальные три поломки видны и такому стенду: они проявляются на первом же прогоне.'
  kind: choice
  options:
    - Кандидата, который считает результат один раз и дальше отдаёт его из кэша или зашитой таблицы
    - Кандидата, который возвращает результат с недопустимой погрешностью на всех входах
    - Кандидата, который падает с исключением на первом же входе
    - Кандидата, который работает медленнее затравки на каждом входе
  correct: 0
