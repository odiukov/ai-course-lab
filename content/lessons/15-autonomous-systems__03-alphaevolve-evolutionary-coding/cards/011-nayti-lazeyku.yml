  fingerprint: d7ba208a
- concept: аномальный скачок балла диагностируют разбором того, что награждает формула, а не проверкой добросовестности кандидата
  question: Лидер поколения внезапно улучшил метрику в сотни раз, тогда как обычный шаг давал проценты. Как разобраться, что произошло?
  explanation: 'Кандидат ничего не нарушал: он максимизировал написанную формулу. Скачок на порядки — сигнал не о гениальности и не об обмане, а о том, что найдена область, где балл растёт без роста полезного результата.'
  kind: open
  reference: 'Запустить лидера и посмотреть его фактическое поведение и выход, а не только балл. Затем разобрать формулу оценки: какое минимальное поведение даёт такой балл, какие условия формула не проверяет (корректность результата, полнота выхода, использование входа). Проверить кандидата независимой проверкой того свойства, ради которого запускался поиск. Если разрыв подтверждается — чинить оценщик: добавлять недостающее условие как обязательное, а не спорить с кандидатом.'
  id: 011-nayti-lazeyku-2
  fingerprint: 9d40b4ca
