  explanation: Сетка MAP-elites обычно многомерная. Кортеж с самого начала фиксирует форму координаты, поэтому переход от одного признака к двум не требует переписывать вставку и поиск в архиве. Балл в ключ не входит — он решает конкуренцию внутри ячейки.
  kind: choice
  options:
