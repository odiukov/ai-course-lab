- concept: замена обитателя ячейки идёт по строгому неравенству, поэтому при равных баллах прежний кандидат остаётся
  question: Вставка в архив, где балл — MSE (меньше значит лучше), а при точном равенстве баллов прежний обитатель сохраняется. Заполни пропуск в условии.
  explanation: 'Строгое `<` даёт два нужных свойства: обитателя вытесняет только настоящее улучшение, а ничья не приводит к бессмысленной подмене. С `<=` архив дрейфовал бы между равноценными кандидатами, а с `>` отбор пошёл бы в сторону роста ошибки.'
  kind: cloze
  template: |-
    if key not in archive or cand.mse ___ archive[key].mse:
        archive[key] = cand
  answer: <
  accept:
    - <
    - '&lt;'
    - strictly less
    - меньше
  id: 026-archive-insert-1
  fingerprint: 4f2ec4b6
- concept: направление сравнения в правиле замены задаётся тем, минимизируется метрика или максимизируется; перевёрнутый знак превращает отбор в отбор худших
  question: Оценщик считает MSE, мутации работают, но лучший балл архива от поколения к поколению не падает, а стабильно растёт. Что проверить первым делом?
  explanation: 'MSE минимизируется, поэтому условие замены должно быть «новый меньше». Перевёрнутый знак делает архив коллекцией худших: каждое поколение методично вытесняет хорошие кандидаты плохими, и кривая балла поднимается монотонно. Гранулярность сетки и размер поколения меняют скорость и разнообразие поиска, но не разворачивают его направление.'
  kind: choice
  options:
    - Направление неравенства в условии замены обитателя ячейки
    - Число диапазонов, на которые разбит структурный признак
    - Количество потомков, генерируемых за одно поколение
    - Наличие затравочной программы в архиве
