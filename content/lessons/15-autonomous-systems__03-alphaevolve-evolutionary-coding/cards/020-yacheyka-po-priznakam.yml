- concept: гранулярность разбиения признака на диапазоны балансирует разнообразие и отбор
  question: Признак кандидата — вещественное число, и его берут как координату без объединения в диапазоны. Чем это плохо для архива?
  explanation: 'Слишком мелкое дробление даёт по ячейке на кандидата: сравнивать не с кем, вытеснения нет, архив растёт без предела. Слишком грубое — сваливает непохожие решения в одну ячейку и убивает разнообразие. Диапазоны выбирают между этими двумя крайностями.'
  kind: choice
  options:
    - Почти каждый кандидат получает уникальную ячейку, отбор внутри ячеек перестаёт работать, и архив вырождается в список всего подряд
    - Все кандидаты попадут в одну ячейку, и разнообразие пропадёт
    - Ключи станут невычислимыми, потому что признак должен быть целым числом
  correct: 0
