- concept: координаты архива должны описывать способ решения, а не повторять целевой балл
  question: Инженер берёт координатой ячейки саму ошибку кандидата, разбитую на диапазоны. Что не так с таким признаком?
  explanation: Признак обязан говорить, чем кандидаты устроены по-разному, а не насколько они хороши. Если координата дублирует балл, «разные ячейки» превращаются в ступени одной шкалы качества, и смысл раздельного хранения теряется.
  kind: choice
  options:
    - Ошибку нельзя разбить на диапазоны, она вещественная
    - Ячейки начнут упорядочиваться по качеству, и архив снова сведётся к гонке за лучшим баллом вместо хранения непохожих решений
    - Ключ станет слишком длинным и замедлит поиск родителей
