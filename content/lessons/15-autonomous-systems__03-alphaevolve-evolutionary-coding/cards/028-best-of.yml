- concept: поиск глобального лидера обходит только занятые ячейки, а не все ячейки сетки признаков
  question: 'Сетка архива задана двумя признаками: у первого 6 диапазонов, у второго 5. Заселено 9 ячеек. Сколько кандидатов сравнит между собой функция поиска лучшего кандидата в архиве?'
  explanation: Сетка допускает 6 × 5 = 30 ячеек, но обход идёт по фактическим значениям архива — их 9. Пустые ячейки не хранят кандидата, сравнивать в них нечего, и стоимость поиска лидера растёт с заселённостью, а не с размером сетки.
  kind: numeric
  answer: 9
  tolerance: 0.5
  id: 028-best-of-1
  fingerprint: 8cb0c26b
- concept: редукцию по минимуму инициализируют отсутствием значения, а не константой, чтобы функция была корректна и на пустой коллекции
  question: Функция ищет кандидата с минимальной MSE и на пустом архиве должна вернуть `None`. Заполни пропуск в условии обновления лидера.
  explanation: 'Первый кандидат становится лидером именно потому, что лидера ещё нет. Такой старт заодно решает случай пустого архива: цикл не выполняется, возвращается `None`. Инициализация нулём соврала бы — ноль это идеальный балл, и настоящий лидер никогда бы его не побил; инициализация «бесконечностью» требует фиктивного объекта с полем mse.'
  kind: cloze
  template: |-
    best = None
    for cand in archive.values():
        if ___ or cand.mse < best.mse:
            best = cand
    return best
  answer: best is None
  accept:
    - best is None
    - not best
    - best == None
  id: 028-best-of-2
  fingerprint: 256f18c3
- concept: при равных лучших баллах любой из лидеров — корректный ответ, дополнительное правило ничьей поиску лидера не нужно
  question: В архиве два кандидата из разных ячеек имеют одинаковую минимальную MSE 0,35. Что должна делать функция поиска лучшего кандидата?
  explanation: Функция отвечает на вопрос «какой лучший балл достигнут и кем», а по баллу кандидаты неразличимы. Правило ничьей нужно, только если от него зависит что-то дальше (воспроизводимость прогона, отчёт). Глубина описывает устройство кандидата и не является критерием качества, а `None` зарезервирован под «архив пуст».
  kind: choice
  options:
    - Вернуть любого из них — оба одинаково корректны как ответ
    - Вернуть того, чьё выражение глубже, чтобы выбор был однозначен
    - Вернуть оба кандидата списком, иначе результат неполон
    - Вернуть `None`, потому что единственного лидера нет
  correct: 0
  id: 028-best-of-3
