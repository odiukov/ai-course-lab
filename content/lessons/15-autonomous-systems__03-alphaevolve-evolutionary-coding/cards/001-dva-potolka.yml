  fingerprint: 0561ae94
- concept: 'два подхода отказывают по-разному: LLM даёт убедительную ошибку, случайный поиск не даёт жизнеспособных кандидатов'
  question: Чем типичный провал LLM-правки отличается от типичного провала случайной мутации кода?
  explanation: 'Это и есть два разных потолка: правдоподобие без гарантии истинности против поиска без понимания устройства кода. Именно из-за разной природы отказов их можно поставить друг против друга.'
  kind: choice
  options:
    - LLM выдаёт запускаемый код с неверным поведением, а мутация чаще всего вообще не даёт работающей программы
    - LLM выдаёт несобирающийся код, а мутация — рабочий, но медленный
    - 'Оба подхода отказывают одинаково: обе выдают синтаксические ошибки'
