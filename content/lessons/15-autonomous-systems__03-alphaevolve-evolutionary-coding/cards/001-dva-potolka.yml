- concept: 'конфабуляция: модель достраивает правдоподобное продолжение без гарантии соответствия задаче'
  question: Модель выдала правку кода с аккуратным именованием и объяснением «теперь быстрее и корректнее». Объясни своими словами, почему это не является свидетельством корректности.
  explanation: 'Ключ в том, что уверенность формулировки и внешняя аккуратность кода не коррелируют с корректностью: обе стороны — продукт одного и того же генератора правдоподобного текста.'
  kind: open
  reference: Модель оптимизирует правдоподобие текста, а не истинность утверждения о программе. Она порождает код и объяснение, которые выглядят как типичное правильное решение, но встроенной связи с фактическим поведением программы на входных данных у неё нет. Ошибка может проявиться только на редком или краевом входе, при этом объяснение останется таким же уверенным. Единственный способ отличить настоящее улучшение от конфабуляции — выполнить код и измерить результат.
