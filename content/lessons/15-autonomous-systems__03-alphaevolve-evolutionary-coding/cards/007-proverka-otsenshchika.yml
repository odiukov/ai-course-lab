- concept: оценщик обязан выдавать вердикт без человека в петле, потому что цикл делает слишком много прогонов
  question: Почему подробная экспертная рубрика проверки кода не годится на роль оценщика в эволюционном цикле, даже если её составил сильный инженер?
  explanation: 'Победы AlphaEvolve все лежат там, где вердикт выдаёт машина: побитовое сравнение матриц, симулятор кластера, секундомер на железе, GPU-секунды на шаг. Человек в петле убивает и скорость цикла, и воспроизводимость.'
  kind: open
  reference: Цикл прогоняет тысячи кандидатов, и на каждого нужен вердикт; человек столько оценок не выдаст ни по скорости, ни стабильно — один и тот же код в разные дни получит разные баллы. Плюс рубрика мерит впечатление от кода (стиль, читаемость), а не последствие его запуска, поэтому её можно удовлетворить оформлением, не улучшив поведение программы.
  id: 007-proverka-otsenshchika-2
