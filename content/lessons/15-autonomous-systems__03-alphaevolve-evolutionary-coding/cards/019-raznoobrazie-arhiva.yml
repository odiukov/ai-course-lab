- concept: 'острова и MAP-elites удерживают разнообразие разными механизмами: изоляцией подпопуляций против явных координат признаков'
  question: Чем механизм разнообразия на островах отличается от MAP-elites?
  explanation: 'На островах разнообразие держится ограничением обмена: соседняя группа не тянет всех к своему лидеру. В MAP-elites обмен не ограничен, но кандидат попадает в ячейку по своим признакам, и вытесняет он только соседа по ячейке. Оценщик и в том и в другом случае один и тот же.'
  kind: choice
  options:
    - Острова делят популяцию на почти изолированные группы, а MAP-elites разводит кандидатов по ячейкам заранее выбранных признаков решения
    - Острова хранят только лучшего кандидата, а MAP-elites хранит вообще всех кандидатов
    - Острова оценивают кандидатов своим оценщиком, а MAP-elites — общим
    - Острова требуют оптимальной программы-затравки, MAP-elites — корректной
