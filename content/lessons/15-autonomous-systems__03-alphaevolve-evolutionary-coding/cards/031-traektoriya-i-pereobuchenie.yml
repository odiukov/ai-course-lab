- concept: сравнение двух конфигураций поиска честно только при равном бюджете поколений и повторе на нескольких начальных значениях генератора случайности
  question: Нужно проверить гипотезу, что без отложенной проверки разрыв между рабочей и отложенной метрикой систематически растёт. Как поставить сравнение двух конфигураций?
  explanation: Мутации случайны, поэтому единичный запуск может оказаться удачным или неудачным сам по себе. Разный бюджет поколений добавляет второе объяснение разницы, и вывод становится необоснованным. Повтор на нескольких начальных значениях при равном бюджете отделяет систематический рост разрыва от шума.
  kind: choice
  options:
    - Запустить каждую конфигурацию по одному разу и сравнить конечные рабочие метрики
    - Дать конфигурации без отложенной проверки больше поколений, раз ей труднее
    - Запустить обе конфигурации при одинаковом бюджете поколений на пяти разных начальных значениях генератора случайности и сравнить разрывы
    - Сравнивать конфигурации по числу принятых мутаций, а не по метрикам
