- concept: мутация локальна, поэтому множество достижимых за один шаг программ определяется структурой родителя, а не его баллом
  question: 'Кандидат A имеет ошибку 0,22, кандидат B — 0,50, и устроены они по-разному: у A глубина 3, у B глубина 9. Объясни, почему B имеет смысл держать как родителя, хотя по метрике он проигрывает.'
  explanation: Это про разницу между значением и достижимостью. Балл — свойство точки, окрестность — свойство её формы. Отбор строго по баллу оставляет поиску одну стартовую окрестность, и всё, что требует временного ухудшения на пути, становится недостижимым.
  kind: open
  reference: 'Мутация меняет программу точечно, поэтому за один шаг из родителя достижима только его окрестность. Окрестность определяется тем, как родитель устроен, а не тем, какой у него балл: из мелкого выражения A ни одна одиночная правка не даёт того, что лежит рядом с девятиуровневым B. Балл говорит, насколько хорош кандидат сейчас; структура говорит, куда из него можно шагнуть. Выбросив B как «худшего», мы вычёркиваем целую область поиска, до которой из A пришлось бы идти цепочкой правок, каждая из которых по дороге ухудшает метрику и потому отклоняется.'
  id: 027-lider-arhiva-2
  fingerprint: 620a5e16
