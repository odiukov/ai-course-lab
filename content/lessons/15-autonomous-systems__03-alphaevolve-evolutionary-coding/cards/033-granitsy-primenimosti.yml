- concept: отложенные данные проверяют перенос результата на новые входы в рамках выбранного измерителя, но не проверяют, что сам измеритель выражает цель
  question: Программу отбора получателей помощи оптимизируют по показателю «трудоустройство в течение 90 дней» и добавляют отложенную выборку людей, которую поиск не видел. Объясни своими словами, что эта отложенная проверка докажет, а что нет.
  explanation: 'Отложенные данные закрывают вопрос обобщения, а не вопрос валидности критерия. Это два независимых отказа: подгонка под знакомые входы и подмена намерения удобной прокси-величиной; второй отложенной выборкой не диагностируется.'
  kind: open
  reference: 'Отложенная выборка докажет только перенос: показатель, полученный на данных поиска, сохраняется на новых людях, значит найдено не запоминание конкретных случаев. Она измеряет тот же показатель, поэтому ничего не говорит о том, правильно ли «работа в течение 90 дней» выражает цель — благополучие человека. Если измеритель выбран неверно, отложенная проверка просто подтвердит устойчивое достижение неверной цели.'
