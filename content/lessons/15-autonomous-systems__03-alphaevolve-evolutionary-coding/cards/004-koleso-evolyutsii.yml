- concept: промпт генератора содержит не только родителя, но и сильных соседей из базы, сигнатуру оценщика и описание задачи
  question: Что, кроме самой родительской программы, обычно кладут в промпт модели-генератора на шаге создания нового варианта?
  explanation: Сильные соседи показывают модели, что уже сработало, сигнатура оценщика говорит, по какому числу её будут судить, описание задачи задаёт смысл. Работа модели после этого — предложить точечное изменение с шансом поднять балл, а не воспроизвести готовое решение.
  kind: choice
  options:
    - Несколько лучших вариантов из базы, сигнатуру оценщика и краткое описание задачи
    - Полный лог всех отвергнутых кандидатов за прогон, чтобы модель их не повторяла
    - Готовый список конкретных правок, которые модель должна применить дословно
  correct: 0
