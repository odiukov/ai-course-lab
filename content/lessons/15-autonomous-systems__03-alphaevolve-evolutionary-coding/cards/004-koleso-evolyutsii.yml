- concept: 'порядок одного оборота эволюционного цикла: отбор родителя, генерация варианта, запуск и оценка, вставка в базу, новый отбор из обновлённой базы'
  question: Расставьте действия одного оборота эволюционного цикла поиска программ в правильном порядке.
  explanation: 'Ключевой момент порядка: балл появляется только после запуска, поэтому вставка в базу идёт строго после оценки, а не после генерации. Следующий отбор родителей опирается на обновлённое содержимое базы — так результат каждого оборота влияет на выбор в следующем.'
  kind: order
  items:
    - Насэмплировать родителя (или нескольких) из базы вариантов
    - Попросить LLM выдать изменённую версию родителя
    - Скомпилировать и запустить полученный вариант на оценщике
    - Вставить вариант в базу вместе с его баллом и признаками
    - Насэмплировать следующего родителя уже из обновлённой базы
  id: 004-koleso-evolyutsii-1
  fingerprint: 2d0a05e5
- concept: структурированная база (MAP-elites, острова) хранит несколько непохожих решений, чтобы поиск не залипал на текущем лидере
  question: Зачем база вариантов хранит лучших представителей в разных ячейках по признакам (MAP-elites) или в нескольких независимых островах, а не одного абсолютного чемпиона?
  explanation: Если оставлять только лидера, все потомки будут вариациями одного решения, и поиск остановится на первом приличном холме. Ячейки и острова держат в живых кандидатов, которые сейчас слабее, но занимают другую область пространства решений — из них и приходят неожиданные прорывы.
  kind: choice
  options:
    - Чтобы сохранить непохожие направления поиска и не застрять в локальном оптимуме вокруг текущего лидера
    - Чтобы каждое направление можно было оценивать своим отдельным оценщиком со своей метрикой
    - Чтобы уменьшить объём хранимых данных за счёт удаления дубликатов программ
  correct: 0
