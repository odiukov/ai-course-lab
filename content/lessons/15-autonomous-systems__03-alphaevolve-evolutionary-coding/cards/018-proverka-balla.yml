  fingerprint: 7dc9dacd
- concept: отложенные точки годятся для проверки, только если поиск не имел к ним доступа
  question: Инженер хочет проверить, выучил ли эволюционный цикл общее правило. Какой набор точек даст честный ответ?
  explanation: Как только точки участвуют в отборе, поиск подстраивается под них, и балл на них перестаёт быть независимой проверкой. Честен только набор, скрытый от цикла.
  kind: choice
  options:
    - Набор, по которому цикл отбирал кандидатов всё время поиска
    - Тот же набор, прогнанный повторно для надёжности
    - Набор, отложенный до старта и ни разу не участвовавший в отборе
  correct: 2
