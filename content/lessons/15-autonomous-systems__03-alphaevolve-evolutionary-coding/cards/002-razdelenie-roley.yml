- concept: оценщик применяет одну заранее заданную процедуру измерения ко всем кандидатам, что делает баллы сравнимыми
  question: Почему процедура оценивания задаётся заранее и одинакова для всех кандидатов? Объясни своими словами.
  explanation: Сравнимость баллов — техническое условие отбора. Оценщик ничего не знает о намерениях автора правки, он проверяет наблюдаемое поведение по неизменным правилам.
  kind: open
  reference: 'Оценщик — фиксированная программа: он компилирует или запускает кандидата, прогоняет одни и те же тесты и измеряет одну и ту же величину (время, память, точность). Из-за этого баллы разных вариантов лежат на одной шкале и их можно сравнивать между собой и отбирать родителей. Если бы критерий менялся под каждый вариант или зависел от его описания, числа перестали бы быть сопоставимыми и отбор потерял бы смысл.'
