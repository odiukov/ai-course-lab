- concept: самоизменяющегося агента отбирают по внешнему набору задач с автоматическим вердиктом, и доля решённых задач — сильный, но не полный сигнал качества
  question: Система эволюционирует код собственного агента, и доля решённых задач внешнего набора выросла с 24% до 41%. Объясни своими словами, почему это сильный сигнал и чего он всё равно не гарантирует.
  explanation: 'Ключ в том, что вердикт машинно-проверяемый и потому дешёвый для цикла, но покрытие набора конечно. Это то же ограничение, что и у любого фиксированного набора проверок: отбор оптимизирует именно его содержимое.'
  kind: open
  reference: 'Оценщиком здесь служит внешний набор задач репозиториев с автоматическим вердиктом: задача либо решена проверками, либо нет, и человек в петле не нужен. Рост доли решённых задач означает, что новая версия агента объективно закрывает больше проверяемых случаев, — балл нельзя получить убедительным рассуждением. Но набор задач описывает только те требования, которые в него попали: устойчивость, безопасность, поведение на непокрытых сценариях остаются неизмеренными, поэтому высокая доля не равна «агент стал лучше во всём».'
