- concept: разрыв между классами сложности растёт с размером входа, поэтому спор об асимптотике решает замер на большом входе
  question: Реализация заявлена как O(n log n), а на деле работает за O(n²). Во сколько примерно раз она медленнее заявленной на входе n = 65536 (логарифм по основанию 2)?
  explanation: 'n² / (n·log₂n) = n / log₂n = 65536 / 16 = 4096. Именно поэтому спор об асимптотике решается прогоном на большом входе: на маленьком n разница теряется в шуме, на большом — она в тысячи раз и не зависит от того, насколько убедительно описана реализация.'
  kind: numeric
  answer: 4096
  tolerance: 50
