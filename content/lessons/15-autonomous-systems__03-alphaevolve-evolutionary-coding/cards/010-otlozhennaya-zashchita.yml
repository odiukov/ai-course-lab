- concept: высокий балл на фиксированном наборе входов не доказывает, что найдено общее решение
  question: Кандидат прошёл все 250 проверок фиксированного набора и стал лидером, но на первом же новом входе выдал неверный ответ. Что это говорит об оценщике?
  explanation: 'Отбор оптимизирует то, что мерят. Если мерят на одном и том же наборе, выгодно подстроиться под его особенности: распознать знакомые случаи или запомнить ответы. Балл остаётся честным числом, но перестаёт быть свидетельством обобщения.'
  kind: choice
  options:
    - Оценщик был недетерминированным
    - Набор входов был фиксирован и виден поиску, поэтому балл измерял подгонку под эти входы, а не решение класса задач
    - Кандидат содержал синтаксическую ошибку, не замеченную тестом
  correct: 1
  id: 010-otlozhennaya-zashchita-1
  fingerprint: 87fde572
- concept: входы, генерируемые в момент оценки, и скрытый от генератора оценщик исключают запоминание проверок
  question: Чем отложенный оценщик со случайно генерируемыми в момент запуска входами отличается по эффекту от большого, но заранее зафиксированного тестового набора?
  explanation: Ключ не в размере набора, а в недоступности входов до момента оценки. Зазубрить то, что генерируется при вас, невозможно, поэтому единственный путь к стабильно высокому баллу — решать общий класс задач.
  kind: choice
  options:
    - Он работает быстрее, потому что входов меньше
    - Ни кандидат, ни модель, его породившая, не могли видеть конкретные проверки, поэтому запоминание ответов перестаёт быть выигрышной стратегией
    - Он выдаёт более точные числа, потому что усредняет по случайности
  correct: 1
  id: 010-otlozhennaya-zashchita-2
  fingerprint: 60ba7d90
- concept: ревью человека перед внедрением ловит требования, которых нет ни в одной автоматической проверке
  question: Отложенный оценщик со случайными входами уже стоит в цикле. Зачем DeepMind всё равно требует человеческого ревью перед деплоем найденного решения?
  explanation: Случайные входы закрывают запоминание, но не закрывают неполноту самой проверки. Человек нужен там, где вопрос «а это вообще то, что мы хотели» не выражен ни одной метрикой.
  kind: open
  reference: 'Генератор входов покрывает лишь то, что в него заложили: редкий или опасный случай может не появиться ни разу. Кроме того, кандидат бывает формально корректным, но нарушает неявные требования реальной системы — использует недопустимое допущение, ломает совместимость, портит поведение при сбое, нагружает ресурс, который не измеряется. Ревью проверяет не балл, а смысл: какие сокращения и допущения сделал код и что будет от его запуска в проде.'
  id: 010-otlozhennaya-zashchita-3
  fingerprint: '59455315'
