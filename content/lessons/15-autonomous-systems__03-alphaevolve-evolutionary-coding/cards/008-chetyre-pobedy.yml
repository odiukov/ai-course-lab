- concept: эвристику планирования нагрузки оценивают симулятором, проигрывающим историческую нагрузку, а не единичным тестом
  question: Эволюционный цикл улучшает эвристику, которая раскладывает задания по машинам кластера. Какой оценщик даёт сравнимые баллы кандидатам?
  explanation: 'Качество планировщика проявляется только на потоке заданий, а не на одном примере: на трёх заданиях любая эвристика выглядит одинаково. Симулятор на исторической нагрузке даёт число (потерянные вычисления) и воспроизводит одни и те же условия каждому кандидату.'
  kind: choice
  options:
    - Юнит-тест, проверяющий эвристику на одном наборе из трёх заданий
    - Симулятор, проигрывающий записанную реальную нагрузку кластера и считающий потерянные вычисления
    - Оценка администраторов кластера, читающих новую эвристику
  correct: 1
  id: 008-chetyre-pobedy-1
  fingerprint: 43c80ac2
- concept: для низкоуровневого ядра заявленное ускорение подтверждают замером на целевом железе, потому что выигрыш зависит от аппаратуры
  question: Кандидат переписал вычислительное ядро и в комментарии обосновал, что новая схема доступа к памяти экономит операции. Почему цикл всё равно запускает ядро на целевом ускорителе?
  explanation: 'У ядер вроде FlashAttention оценщик состоит из двух частей: тест на корректность и замер по часам на реальном железе. Экономия операций на бумаге регулярно не превращается в экономию времени на конкретном ускорителе.'
  kind: choice
  options:
    - Потому что комментарий может содержать синтаксическую ошибку
    - Потому что выигрыш зависит от кэшей, пропускной способности памяти и планировщика конкретного устройства, и подтверждается только замером на нём
    - Потому что запуск нужен, чтобы посчитать число строк кода
  correct: 1
  id: 008-chetyre-pobedy-2
  fingerprint: 2bfb6115
- concept: симулятор выражает выигрыш эвристики в абсолютных единицах потерянных ресурсов
  question: Симулятор проигрывает нагрузку объёмом 200 000 машино-часов. Старая эвристика теряет впустую 4.5% этого объёма, новая — 3.7%. Сколько машино-часов экономит новая эвристика?
  explanation: (4.5% − 3.7%) = 0.8% от 200 000 = 1600 машино-часов. Симулятор превращает расплывчатое «планировщик стал лучше» в число, которое можно сравнить у любых двух кандидатов.
  kind: numeric
  answer: 1600
  tolerance: 1
  id: 008-chetyre-pobedy-3
  fingerprint: 6fdd575e
