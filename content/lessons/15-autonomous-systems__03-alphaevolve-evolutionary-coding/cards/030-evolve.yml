- concept: история лучшего балла не может ухудшаться, потому что обитателя ячейки вытесняет только улучшение
  question: После каждого поколения в историю пишется MSE глобального лидера. Получилась последовательность 0,80 → 0,31 → 0,31 → 0,46 → 0,20. Что это означает?
  explanation: 'Ни одна операция цикла не удаляет кандидата, кроме замены на строго лучшего в той же ячейке. Значит минимум по архиву может только падать или стоять на месте — последовательность обязана быть невозрастающей. Скачок 0,31 → 0,46 указывает на реальную поломку: перевёрнутое сравнение при вставке, затирание ячейки или сравнение по неверному полю в поиске лидера.'
  kind: choice
  options:
    - 'В коде есть баг: лидер не может ухудшиться, раз вытеснение в ячейке происходит только при меньшей ошибке, а новые кандидаты лишь добавляются'
    - 'Всё в порядке: мутации случайны, поэтому лидер естественно колеблется от поколения к поколению'
    - 'Всё в порядке: подъём до 0,46 — это выход из локального минимума, обязательный для дальнейшего улучшения'
    - 'Это признак переобучения: на отложенных точках ошибка и должна расти в середине поиска'
  correct: 0
