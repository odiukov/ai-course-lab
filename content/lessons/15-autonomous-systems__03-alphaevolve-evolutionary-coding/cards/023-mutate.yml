- concept: при мутации ветви рекурсивный вызов идёт только в выбранную ветвь, вторая переносится без изменений
  question: Мутация выбрала левую ветвь узла-операции. Чем заполнить пропуск?
  explanation: 'Локальность обеспечивается именно так: рекурсия уходит в одну ветвь, вторая копируется как есть, операция сохраняется. Вызов `mutate` на обе ветви сразу дал бы уже не точечное изменение.'
  kind: cloze
  template: |-
    op, left, right = expr
    # мутируем левую ветвь
    return (op, ___, right)
  answer: mutate(left)
  accept:
    - mutate(left)
  id: 023-mutate-1
  fingerprint: 5a119b73
- concept: мутация не изменяет родителя на месте, а собирает и возвращает новый узел
  question: Почему `mutate` должна собирать новое выражение, а не менять переданное на месте?
  explanation: Один родитель порождает много потомков и остаётся в архиве со своим измеренным баллом. Мутация на месте меняет объект, на который ссылается архив, — балл перестаёт соответствовать содержимому, и поломка проявится далеко от места ошибки.
  kind: choice
  options:
    - Иначе рекурсия не сможет дойти до листьев
    - 'Родитель уже лежит в архиве и служит источником для других потомков: правка на месте молча испортит сохранённого кандидата и его оценённый балл'
    - Иначе оценщик не сможет вычислить ошибку нового выражения
  correct: 1
  id: 023-mutate-2
  fingerprint: c453176c
- concept: 'каждая ветка мутации обязана вернуть узел допустимой формы: лист заменяется целиком, у операции остаются оба аргумента'
  question: Мутация попала в лист — переменную или число. Что она может с ним сделать, не нарушив формат дерева?
  explanation: 'У листа нет ветвей, поэтому единственная доступная правка — подстановка нового фрагмента вместо него. При этом любой результат мутации обязан быть вычислимым: у операции должны остаться оба аргумента, иначе кандидат сломает интерпретатор ещё до оценки.'
  kind: choice
  options:
    - 'Заменить его целиком на другой лист или на операцию с двумя аргументами: дочерних узлов у листа нет, спускаться некуда'
    - Рекурсивно вызвать себя на его дочерних узлах
    - Оставить операцию с одним аргументом, второй заполнить позже
  correct: 0
  id: 023-mutate-3
  fingerprint: 5b311fdc
