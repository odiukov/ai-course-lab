- concept: 'накопительный эффект: цепочка небольших принятых улучшений перемножается'
  question: Затравка выполняется за 250 мс. Пять поколений подряд дают принятого потомка, каждый быстрее родителя на 10%. Сколько миллисекунд занимает последний потомок?
  explanation: '250 × 0,9⁵ ≈ 147,62 мс — ускорение почти в 1,7 раза без единого гениального скачка. Так и работает цикл: каждое принятое изменение становится новой базой для следующего.'
  kind: numeric
  answer: 147.62
  tolerance: 0.5
  id: 005-zatravka-i-pokolenie-2
  fingerprint: 6b795887
- concept: точечное изменение предпочтительнее полного переписывания, потому что его легче измерить и приписать эффект
  question: Почему от модели обычно требуют одно точечное изменение родителя, а не полное переписывание «идеальной» версии?
  explanation: 'Крупное переписывание — рискованный скачок: оно чаще ломается целиком, а при успехе непонятно, какая из десятков перемен дала выигрыш. Точечная правка сохраняет накопленное и превращает поиск в управляемую последовательность проверенных шагов.'
  kind: choice
  options:
    - Маленькая правка чаще остаётся рабочей, а её эффект однозначно виден в балле
    - Большие правки запрещены оценщиком по формальным причинам
    - Модель физически не способна сгенерировать длинный код
