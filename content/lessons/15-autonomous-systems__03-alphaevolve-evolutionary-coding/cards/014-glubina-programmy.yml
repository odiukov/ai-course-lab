- concept: глубина выражения — число уровней вдоль самого длинного пути от корня до листа
  question: Глубину выражения считают как число уровней вдоль самого длинного пути от всего выражения до отдельного листа (переменной или числа); сам лист даёт один уровень. Чему равна глубина выражения ((x*x) + 3) * (x - (x + (x*8)))?
  explanation: 'Лист — один уровень. Слева: x*x — два уровня, (x*x)+3 — три. Справа: x*8 — два, x+(x*8) — три, x-(x+(x*8)) — четыре. Корневое умножение берёт максимум по веткам (четыре) и добавляет свой уровень: 5. Считается самый длинный путь, а не общее число операций.'
  kind: numeric
  answer: 5
  tolerance: 0.5
  id: 014-glubina-programmy-1
  fingerprint: 45be6e7c
- concept: структурный признак описывает устройство кандидата и сам по себе не упорядочивает кандидатов по качеству
  question: Кандидат A имеет глубину выражения заметно больше, чем кандидат B. Что из этого следует о качестве решений?
  explanation: 'Структурный признак и балл — разные измерения. Глубина отвечает на вопрос «насколько иначе устроен кандидат», а не «кто лучше»: глубокий кандидат бывает и точнее, и хуже. Ранжирует только оценщик.'
  kind: choice
  options:
    - 'Ничего: глубина описывает устройство программы, а качество задаёт отдельный балл оценщика'
    - A точнее, потому что более вложенная программа выражает более сложную зависимость
    - B лучше, потому что короткая программа всегда обобщается лучше глубокой
    - A и B заведомо равны по качеству, раз признак у них разный
