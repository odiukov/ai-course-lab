- concept: среднеквадратичная ошибка неотрицательна и равна нулю ровно при точном совпадении на всех точках
  question: Кандидат на всех проверочных точках выдал в точности эталонные ответы. Какое значение вернёт функция среднеквадратичной ошибки?
  explanation: 'Каждое отклонение равно нулю, квадраты тоже, сумма и среднее — ноль. Метрика не бывает отрицательной: квадраты неотрицательны. Поэтому направление отбора однозначно — чем меньше значение, тем лучше кандидат, а ноль это нижняя граница.'
