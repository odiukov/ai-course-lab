- concept: вход и эталонный ответ должны браться парой, иначе сравниваются несоответствующие друг другу значения
  question: В функции ошибки списки входов и эталонных ответов обходят двумя независимыми циклами и сравнивают элементы по разным счётчикам. Что ломается?
  explanation: 'Точка проверки — это пара «вход, правильный ответ». Расцепив её, оценщик меряет расхождение между несвязанными величинами: правильный кандидат получит большую ошибку, и отбор пойдёт по мусорному сигналу. Совместный обход парами (zip) удерживает соответствие.'
  kind: choice
  options:
