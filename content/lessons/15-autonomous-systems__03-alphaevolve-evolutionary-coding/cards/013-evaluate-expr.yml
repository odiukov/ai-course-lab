- concept: сбой при вычислении кандидата нельзя подменять нейтральным числом, иначе поломка получает валидный балл
  question: Кандидат при вычислении падает — например, делением на ноль. Почему исполнителю нельзя возвращать в этом случае 0 и почему это опаснее, чем упавший прогон?
  explanation: 'Молчаливая подмена сбоя нейтральным числом ломает связь балла с реальным поведением программы: оценщик перестаёт отличать работающее решение от упавшего.'
  kind: open
  reference: 'Возврат 0 превращает сбой в обычное числовое значение, которое пойдёт в формулу ошибки наравне с честными ответами. Тогда сломанный кандидат может случайно получить приличный балл (если целевые значения близки к нулю) и попасть в базу как жизнеспособный родитель, а цикл начнёт развивать неработающую ветку. Явный сбой, наоборот, — честный сигнал: кандидат отбраковывается или получает заведомо худший балл, и поиск не тратится на мусор.'
  id: 013-evaluate-expr-3
  fingerprint: 213241f4
