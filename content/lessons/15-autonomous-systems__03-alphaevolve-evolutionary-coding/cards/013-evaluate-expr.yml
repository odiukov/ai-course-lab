  fingerprint: 612a31c4
- concept: исполнение кандидата ограничивают арифметикой, потому что кандидат — сгенерированный чужой код
  question: Почему исполнитель кандидатов в эволюционном цикле запускает выражение без доступа к встроенным функциям и импорту модулей?
  explanation: Цикл исполняет то, что породил генератор, а не то, что написал человек. Ограничение до арифметики и переданного входа делает запуск кандидата безопасным.
  kind: choice
  options:
    - Иначе вычисление станет слишком медленным для тысяч прогонов
    - Иначе кандидаты потеряют вложенную структуру
    - Кандидаты порождаются автоматически, и без ограничения выполнялся бы произвольный непроверенный код
  correct: 2
