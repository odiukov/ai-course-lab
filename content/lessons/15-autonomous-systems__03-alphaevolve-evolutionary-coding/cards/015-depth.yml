- concept: глубина узла-операции равна максимуму глубин аргументов плюс уровень самой операции, а не их сумме
  question: В рекурсивной функции глубины дерева выражения для узла-операции взяли сумму глубин левого и правого аргументов вместо максимума. Что теперь измеряет функция?
  explanation: 'Глубина — длина самого длинного пути от узла до листа, поэтому вклад даёт только более глубокая ветка. Сумма складывает обе ветки и растёт от ширины дерева: у несимметричного выражения, где одна ветка обрывается сразу, ответы разойдутся.'
  kind: choice
  options:
    - Суммарный размер обеих веток, а не длину самого длинного пути до листа
    - 'То же самое: для деревьев сумма и максимум совпадают'
    - Глубину только более короткой ветки
    - Число листьев в дереве
  correct: 0
  id: 015-depth-1
  fingerprint: b44ef962
- concept: в рекурсивном обходе базовый случай проверяется раньше обращения к дочерним узлам
  question: Расставь шаги рекурсивной функции, вычисляющей глубину узла дерева выражения.
  explanation: 'Базовый случай обязан идти перед рекурсией: у листа нет полей с дочерними узлами, и обращение к ним кончится ошибкой или бесконечным спуском. Сначала распознаём вид узла, потом спускаемся.'
  kind: order
  items:
    - Проверить, лист ли текущий узел (переменная или число)
    - Если лист — вернуть базовый уровень и не спускаться дальше
    - Иначе рекурсивно вычислить глубину левого аргумента
    - Рекурсивно вычислить глубину правого аргумента
    - Вернуть максимум двух глубин плюс уровень текущей операции
  id: 015-depth-2
  fingerprint: 6d38a687
- concept: 'форму программы и её значение вычисляют разные обходы одного дерева: структурный признак не требует запуска кандидата'
  question: Почему функция, измеряющая глубину выражения, не обращается к вычислителю значения выражения, хотя обходит то же самое дерево?
  explanation: 'Структурный признак снимается со строения дерева, балл — с результата исполнения. Смешивать обходы не нужно: глубина одинакова при любом входе, а значение меняется от точки к точке.'
  kind: open
  reference: 'Это два разных вопроса к одному дереву. Вычислитель подставляет конкретное значение переменной и сворачивает дерево в число — он отвечает на вопрос «что программа считает». Обход глубины смотрит только на форму: тип узла и наличие аргументов, — и отвечает на вопрос «насколько глубоко вложена конструкция». Значения листьев на глубину не влияют, поэтому запускать кандидата не нужно, и признак можно измерить даже там, где вычисление упало бы с ошибкой.'
  id: 015-depth-3
  fingerprint: d4543ba2
