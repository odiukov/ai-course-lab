- concept: детерминированность и скорость оценщика как условия работоспособности цикла
  question: Почему от оценщика требуют детерминированности и высокой скорости? Объясни своими словами.
  explanation: Оба требования — про то, чтобы сигнал отбора был чистым и достаточно частым. Медленный оценщик убивает количество итераций, шумный — их качество.
  kind: open
  reference: 'Детерминированность нужна, чтобы одинаковый код при одинаковых условиях получал одинаковый балл: иначе шум измерения смешивается с реальным улучшением, в архив попадают удачные прогоны, а не удачные программы, и отбор идёт по случайности. Скорость нужна потому, что цикл держится на большом числе повторений: если одна оценка стоит часы, за разумное время цикл сделает лишь несколько итераций и накопительный эффект не успеет проявиться.'
