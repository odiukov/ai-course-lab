- concept: оценщик должен измерять целевое свойство целиком, иначе отбор эксплуатирует лазейку в метрике
  question: Оценщик измеряет только время работы и не проверяет правильность вывода. Какой вариант выиграет отбор?
  explanation: Отбор сохраняет всё, что набирает высокий балл, и не различает честное решение и эксплуатацию дыры в проверке. Любая лазейка в оценщике автоматически становится целью оптимизации, поэтому метрика должна включать и корректность, и производительность.
  kind: choice
  options:
    - Программа, которая мгновенно возвращает мусор, потому что по единственной метрике она лучшая
    - Самая корректная программа, ведь корректность обычно коррелирует со скоростью
    - 'Ни одна: цикл остановится, обнаружив неполноту метрики'
