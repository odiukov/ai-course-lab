- concept: возведение отклонений в квадрат не даёт промахам разных знаков взаимно погаситься
  question: Оценщик усредняет не квадраты отклонений, а сами отклонения со знаком. Какой дефект получает такая метрика?
  explanation: 'Знаковые отклонения складываются с погашением: перелёт на девять и недолёт на девять дадут в сумме ноль, хотя обе точки предсказаны неверно. Квадрат (как и модуль) убирает знак, поэтому каждая ошибка добавляет вклад.'
