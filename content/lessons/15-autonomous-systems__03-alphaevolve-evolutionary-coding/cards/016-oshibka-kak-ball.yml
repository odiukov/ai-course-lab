- concept: квадратичный штраф делает один крупный промах дороже нескольких мелких той же суммарной величины
  question: Кандидат A ошибается на каждой точке понемногу, кандидат B точен везде, кроме одной точки, где промах велик; суммарная величина отклонений у них одинакова. Кого предпочтёт среднеквадратичная ошибка и почему?
  explanation: Выбор степени в метрике — это выбор того, какие ошибки считать недопустимыми. Квадрат делает выбросы дорогими, поэтому цикл отбирает равномерно приличные решения, а не решения с одной провальной точкой.
  kind: open
  reference: 'Предпочтёт A. Квадрат растёт быстрее величины отклонения, поэтому один большой промах даёт непропорционально большой вклад: промах вдесятеро больше добавляет всотеро больше. При равной сумме модулей набор мелких ошибок даёт меньшую сумму квадратов, чем один выброс. Это осознанное свойство метрики: она наказывает крупные провалы и толкает поиск к кандидатам без катастрофических точек. Если такое поведение нежелательно, берут метрику без квадрата (среднее абсолютных отклонений).'
