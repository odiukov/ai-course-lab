- concept: прокси-метрика поверхностного признака награждает косметические правки без смыслового изменения
  question: Оценщик выдаёт «качество кода» по доле коротких строк и плотности комментариев. Какие изменения цикл начнёт накапливать?
  explanation: 'Прокси мерит форму, поэтому дешевле всего максимизировать форму. Реальные циклы поиска в 2025–2026 годах именно так и вырождались: удаление комментариев и переименования поднимали балл, а поведение программы не менялось.'
  kind: choice
  options:
    - Разбиение длинных выражений на строки, переименование переменных и правку комментариев без изменения поведения
    - Замену алгоритма на более быстрый
    - Устранение ошибок на краевых входах
