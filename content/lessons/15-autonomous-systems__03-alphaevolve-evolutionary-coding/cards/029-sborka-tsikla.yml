- concept: цикл не ведёт истории отклонённых кандидатов, поэтому потерянная ветвь достижима только повторной генерацией
  question: Потомок оценён и отклонён при вставке в архив. Объясни своими словами, что происходит с ним дальше и чем это ограничивает поиск.
  explanation: Архив — не журнал прогона, а набор точек старта. Отклонение означает полное забывание кандидата вместе с потраченным на его оценку бюджетом; если такая ветвь понадобится, за неё придётся заплатить генерацией и оценкой ещё раз.
  kind: open
  reference: 'Отклонённый потомок нигде не сохраняется: архив хранит по одному обитателю на ячейку, а отдельного списка проигравших нет. Он не может быть выбран родителем позже, и вернуться в эту область поиск способен только заново сгенерировав похожее выражение из доступного родителя. Плюс такого забывания — следующее поколение стартует только из измеренных и выигравших свои сравнения точек; минус — цикл может повторно тратить бюджет на уже проверенные варианты.'
