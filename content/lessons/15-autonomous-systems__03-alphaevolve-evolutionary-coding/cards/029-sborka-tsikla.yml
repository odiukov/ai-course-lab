- concept: оценки потомков внутри одного поколения независимы друг от друга, зависимость возникает лишь на границе поколений
  question: Почему потомков одного поколения можно оценивать параллельно, а поколения приходится проходить последовательно?
  explanation: MSE потомка вычисляется по его собственному выражению и фиксированным проверочным точкам — порядок и соседи не влияют. А вот родителя следующего поколения выбирают из архива, каким он стал после всех вставок, и эту зависимость параллелизмом не убрать.
  kind: choice
  options:
    - Оценка потомка зависит только от него самого, а выбор родителей следующего поколения — от уже обновлённого архива
    - Оценщик считает MSE тем точнее, чем больше кандидатов измеряется одновременно
    - Мутация одного потомка использует результат оценки предыдущего потомка того же поколения
    - Параллельная оценка допустима лишь для кандидатов, попавших в одну ячейку
