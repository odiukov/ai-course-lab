- concept: число занятых ячеек архива не убывает и растёт только за счёт попаданий в свободные ячейки
  question: 'В архиве MAP-elites занято 11 ячеек. Поступают 15 новых кандидатов: 6 из них попадают в свободные ячейки, 9 — в уже занятые, и из этих девяти 5 оказываются лучше текущих обитателей. Сколько ячеек занято после обработки всех пятнадцати?'
  explanation: 'Занятость растёт только от попаданий в свободные ячейки: 11 + 6 = 17. Попадания в занятую ячейку либо меняют обитателя, либо отклоняются — в обоих случаях число занятых ячеек то же. Поэтому 5 успешных вытеснений на счётчик не влияют, а освободить ячейку правило вставки вообще не умеет.'
  kind: numeric
  answer: 17
  tolerance: 0.5
  id: 025-elitizm-yacheyki-1
  fingerprint: 7e196edc
- concept: итоговое содержимое ячейки не зависит от порядка поступления кандидатов
  question: Кандидаты попадают в архив по одному, в случайном порядке. Объясни своими словами, почему конечный обитатель отдельной ячейки не зависит от того, в каком порядке кандидаты в неё поступали.
  explanation: 'Вставка — это накопление минимума по ячейке. Минимум коммутативен и ассоциативен, поэтому финал одинаков при любом порядке. Отличаться будет лишь путь: при порядке 0,41 → 0,36 замена одна, при порядке 0,36 → 0,41 замен нет.'
  kind: open
  reference: 'Правило вставки сводит содержимое ячейки к выбору лучшего балла среди всех, кто в неё попал: обитатель заменяется ровно тогда, когда новичок лучше. Такой выбор минимума (для MSE) не зависит от порядка — как не зависит от порядка минимум набора чисел. Порядок влияет только на промежуточные состояния ячейки, на число фактических замен и на то, кто останется при точном равенстве баллов.'
  id: 025-elitizm-yacheyki-2
  fingerprint: 91d96bc0
- concept: вставка сначала адресуется ключом ячейки, а сравнение баллов происходит уже внутри найденной ячейки
  question: Расставь шаги вставки нового кандидата в архив MAP-elites в правильном порядке.
  explanation: 'Адрес считается раньше конкуренции: пока ключ не вычислен, неизвестно, с кем вообще сравнивать. Обратный порядок — сравнить, а потом искать ячейку — приводит к сравнению с произвольным кандидатом архива.'
  kind: order
  items:
    - вычислить ключ ячейки по структурным признакам кандидата
    - взять содержимое архива по этому ключу
    - сравнить балл кандидата с баллом обитателя ячейки (для пустой ячейки сравнение не нужно)
    - заменить обитателя либо отклонить кандидата
  id: 025-elitizm-yacheyki-3
  fingerprint: bf5d3546
