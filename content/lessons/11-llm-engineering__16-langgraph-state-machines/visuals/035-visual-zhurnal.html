<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Журнал чекпоинтов и ветка</title>
<style>
  :root{
    --bg:#fbfbfd; --fg:#1c1c22; --muted:#6b6b78;
    --line:#4a4a58; --main:#2f6fb2; --branch:#c2622a; --fill:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14161a; --fg:#e9e9ef; --muted:#a0a0b0;
      --line:#9a9ab0; --main:#6fb0ee; --branch:#e59a5c; --fill:#1e2128;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:100%;padding:8px 10px 10px;box-sizing:border-box;}
  h2{font-size:14px;margin:0 0 6px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .lg{font-size:11px;color:var(--muted);margin:6px 0 0;line-height:1.5;}
  .err{font-size:12px;color:var(--fg);line-height:1.5;}
  text{font-family:inherit;fill:var(--fg);}
</style>
</head>
<body>
<div class="wrap">
  <h2>Журнал чекпоинтов одного thread_id: 15 записей и ветка от history[3]</h2>
  <div id="slot"></div>
  <p class="lg" id="legend">
    Синяя линия — исходный прогон, <code>history[0]</code> сверху вниз до <code>history[14]</code>.
    Оранжевая — ветка от <code>history[3]</code>: тот же <code>thread_id</code>, новые <code>checkpoint_id</code>.
    Старые записи не затираются, у <code>history[3]</code> просто два ребёнка.
  </p>
</div>
<script>
(function(){
try{
  /* ---------- данные схемы ---------- */
  var N = 15;                 // 15 чекпоинтов одного thread_id
  var FORK = 3;               // ответвление от history[3]
  var BRANCH = 3;             // длина ветки (записи ветки)
  var main = [], i;
  for(i=0;i<N;i++) main.push({i:i, x:0, y:i});
  var branch = [];
  for(i=0;i<BRANCH;i++) branch.push({i:i, x:4, y:FORK+1+i});

  /* ---------- одна система координат ---------- */
  var ORIGIN = {x:150, y:38};
  var SCALE  = {x:34, y:30};
  function sx(x){ return ORIGIN.x + x*SCALE.x; }
  function sy(y){ return ORIGIN.y + y*SCALE.y; }

  /* ---------- литералы: холст, отступы, толщины, шрифт ---------- */
  var W = 640, H = 500, R = 7, LW = 2, FS = 11, PAD = 11;

  var ns='http://www.w3.org/2000/svg';
  function el(n,a){var e=document.createElementNS(ns,n);for(var k in a)e.setAttribute(k,a[k]);return e;}
  var svg = el('svg',{viewBox:'0 0 '+W+' '+H,preserveAspectRatio:'xMidYMid meet',
                      role:'img','aria-label':'Журнал из 15 чекпоинтов и ветка от четвёртой записи'});
  function line(a,b,color,dash){
    var e=el('line',{x1:sx(a.x),y1:sy(a.y),x2:sx(b.x),y2:sy(b.y),
      stroke:color,'stroke-width':LW,'stroke-linecap':'round'});
    if(dash)e.setAttribute('stroke-dasharray',dash);
    svg.appendChild(e); return e;
  }
  function dot(p,color){
    svg.appendChild(el('circle',{cx:sx(p.x),cy:sy(p.y),r:R,fill:'var(--fill)',
      stroke:color,'stroke-width':LW}));
  }
  function txt(p,s,anchor,dx,dy,cls){
    var t=el('text',{x:sx(p.x)+dx,y:sy(p.y)+dy,'text-anchor':anchor,'font-size':FS});
    if(cls)t.setAttribute('fill',cls);
    t.appendChild(document.createTextNode(s)); svg.appendChild(t); return t;
  }

  var defs=el('defs',{});
  ['main','branch'].forEach(function(k){
    var m=el('marker',{id:'ah-'+k,viewBox:'0 0 10 10',refX:'9',refY:'5',
      markerWidth:'6',markerHeight:'6',orient:'auto-start-reverse'});
    m.appendChild(el('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'var(--'+k+')'}));
    defs.appendChild(m);
  });
  svg.appendChild(defs);

  /* ---------- основная лента ---------- */
  for(i=0;i<main.length-1;i++) line(main[i],main[i+1],'var(--main)');
  line(main[main.length-1],{x:0,y:N-1+0.62},'var(--main)').setAttribute('marker-end','url(#ah-main)');
  for(i=0;i<main.length;i++){
    dot(main[i],'var(--main)');
    txt(main[i],'history['+i+']','end',-PAD,FS*0.36,'var(--fg)');
  }

  /* ---------- ветка: вниз-вправо от history[3] ---------- */
  var forkP = main[FORK], b0 = branch[0];
  var knee = {x:b0.x, y:forkP.y};
  line(forkP,{x:knee.x-0.22,y:knee.y},'var(--branch)','6 4');
  line(knee,b0,'var(--branch)').setAttribute('marker-end','url(#ah-branch)');
  for(i=0;i<branch.length-1;i++) line(branch[i],branch[i+1],'var(--branch)');
  line(branch[branch.length-1],{x:b0.x,y:branch[branch.length-1].y+0.62},'var(--branch)')
    .setAttribute('marker-end','url(#ah-branch)');
  for(i=0;i<branch.length;i++){
    dot(branch[i],'var(--branch)');
    txt(branch[i],'новая запись','start',PAD,FS*0.36,'var(--fg)');
  }

  /* подпись у хвоста ответвления, над линией */
  txt({x:forkP.x+0.35,y:forkP.y},'запуск от checkpoint_id','start',0,-PAD,'var(--branch)');
  txt({x:forkP.x+0.35,y:forkP.y},'у history[3] два ребёнка','start',0,-PAD+FS+3,'var(--muted)');

  /* один thread_id — подпись сверху по центру ленты, снизу — итог */
  txt({x:0,y:0},'один thread_id','middle',0,-PAD-4,'var(--muted)');
  txt({x:b0.x,y:N-1+0.62},'старая линия цела','start',-R,FS+PAD,'var(--muted)');

  document.getElementById('slot').appendChild(svg);
}catch(e){
  var d=document.getElementById('slot');
  d.className='err';
  d.textContent='Схема должна показывать: столбик из 15 чекпоинтов одного thread_id — '+
    'history[0] сверху до history[14] снизу, — и стрелку вниз-вправо от history[3] '+
    'во вторую линию новых записей. Старые записи не затираются: у history[3] два ребёнка.';
}
})();
</script>
</body>
</html>
