<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта четырёх топологий дебатов</title>
<style>
  :root {
    color-scheme: light dark;
    --canvas: #f7f3ea;
    --card: #fffdf8;
    --ink: #252723;
    --muted: #666b63;
    --border: #d8d3c8;
    --blue: #3978a8;
    --green: #43846b;
    --orange: #b66d34;
    --violet: #765da8;
    --node-text: #fffdf8;
    --badge: #ece7dc;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--canvas);
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 520px;
    background: var(--canvas);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  text {
    fill: var(--ink);
  }

  .main-title {
    font-size: 25px;
    font-weight: bold;
  }

  .subtitle {
    font-size: 14px;
    fill: var(--muted);
  }

  .card {
    fill: var(--card);
    stroke: var(--border);
    stroke-width: 1.5;
  }

  .divider {
    stroke: var(--border);
    stroke-width: 1.2;
  }

  .topology-title {
    font-size: 15px;
    font-weight: bold;
  }

  .network-edge {
    fill: none;
    stroke: currentColor;
    stroke-width: 2.5;
    stroke-linecap: round;
  }

  .graph-dense .network-edge {
    stroke-width: 1.7;
  }

  .node-halo {
    fill: var(--card);
    stroke: currentColor;
    stroke-width: 1.3;
  }

  .node {
    fill: currentColor;
    stroke: var(--card);
    stroke-width: 2.2;
  }

  .node-label {
    fill: var(--node-text);
    font-size: 13px;
    font-weight: bold;
    dominant-baseline: central;
  }

  .count {
    fill: currentColor;
    font-size: 29px;
    font-weight: bold;
  }

  .count-label {
    fill: var(--muted);
    font-size: 13px;
  }

  .caption-rule {
    stroke: var(--border);
    stroke-width: 1.2;
  }

  .caption {
    fill: var(--muted);
    font-size: 14px;
    font-weight: bold;
  }

  .tone-blue {
    color: var(--blue);
  }

  .tone-green {
    color: var(--green);
  }

  .tone-orange {
    color: var(--orange);
  }

  .tone-violet {
    color: var(--violet);
  }

  .fallback {
    fill: var(--ink);
    font-size: 16px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #171a18;
      --card: #202521;
      --ink: #f1eee6;
      --muted: #b7bcb4;
      --border: #3d443e;
      --blue: #78b8e3;
      --green: #77c29e;
      --orange: #e5a166;
      --violet: #b6a0e3;
      --node-text: #171a18;
      --badge: #2b312c;
    }
  }
</style>
</head>
<body>
<svg
  id="diagram"
  width="1200"
  height="430"
  viewBox="0 0 1200 430"
  preserveAspectRatio="xMidYMid meet"
  role="img"
  aria-labelledby="diagram-title diagram-description">
  <title id="diagram-description">
    Звезда, цепочка и дерево из пяти агентов имеют по четыре ненаправленные
    связи, а полный граф из пяти агентов имеет десять связей.
  </title>
  <text id="diagram-title" class="main-title">Карта четырёх топологий дебатов</text>
  <text id="diagram-subtitle" class="subtitle">Пять агентов — четыре разных маршрута информации</text>
  <g id="stage"></g>
  <line id="caption-rule" class="caption-rule"></line>
  <text id="diagram-caption" class="caption">Одинаковое число каналов не означает одинаковый маршрут</text>
</svg>

<script>
const DATA = Object.freeze([
  {
    origin: [24, 18],
    scale: 1,
    zero: 0,
    unit: 1,
    nodeRadius: 17,
    haloRadius: 21,
    titlePoint: [16, 22],
    subtitlePoint: [16, 42],
    captionRule: [[16, 365], [1150, 365]],
    captionPoint: [575, 392],
    fallbackPoint: [575, 210]
  },
  {
    key: "star",
    title: "ЗВЕЗДА",
    tone: "tone-blue",
    groupClass: "",
    count: 4,
    countLabel: "ненаправленные связи",
    bounds: [16, 60, 274, 338],
    titlePoint: [145, 91],
    divider: [[38, 110], [252, 110]],
    countPoint: [145, 302],
    countLabelPoint: [145, 324],
    nodes: [
      { id: "A", point: [145, 190] },
      { id: "B", point: [88, 147] },
      { id: "C", point: [202, 147] },
      { id: "D", point: [88, 243] },
      { id: "E", point: [202, 243] }
    ],
    edges: [
      ["A", "B"],
      ["A", "C"],
      ["A", "D"],
      ["A", "E"]
    ]
  },
  {
    key: "chain",
    title: "ЦЕПОЧКА",
    tone: "tone-green",
    groupClass: "",
    count: 4,
    countLabel: "ненаправленные связи",
    bounds: [306, 60, 564, 338],
    titlePoint: [435, 91],
    divider: [[328, 110], [542, 110]],
    countPoint: [435, 302],
    countLabelPoint: [435, 324],
    nodes: [
      { id: "A", point: [345, 194] },
      { id: "B", point: [390, 194] },
      { id: "C", point: [435, 194] },
      { id: "D", point: [480, 194] },
      { id: "E", point: [525, 194] }
    ],
    edges: [
      ["A", "B"],
      ["B", "C"],
      ["C", "D"],
      ["D", "E"]
    ]
  },
  {
    key: "tree",
    title: "ДЕРЕВО",
    tone: "tone-orange",
    groupClass: "",
    count: 4,
    countLabel: "ненаправленные связи",
    bounds: [596, 60, 854, 338],
    titlePoint: [725, 91],
    divider: [[618, 110], [832, 110]],
    countPoint: [725, 302],
    countLabelPoint: [725, 324],
    nodes: [
      { id: "A", point: [725, 139] },
      { id: "B", point: [675, 200] },
      { id: "C", point: [775, 200] },
      { id: "D", point: [645, 255] },
      { id: "E", point: [705, 255] }
    ],
    edges: [
      ["A", "B"],
      ["A", "C"],
      ["B", "D"],
      ["B", "E"]
    ]
  },
  {
    key: "graph",
    title: "ПОЛНЫЙ ГРАФ",
    tone: "tone-violet",
    groupClass: "graph-dense",
    count: 10,
    countLabel: "ненаправленных связей",
    bounds: [886, 60, 1144, 338],
    titlePoint: [1015, 91],
    divider: [[908, 110], [1122, 110]],
    countPoint: [1015, 302],
    countLabelPoint: [1015, 324],
    nodes: [
      { id: "A", point: [1015, 135] },
      { id: "B", point: [1080, 182] },
      { id: "C", point: [1055, 255] },
      { id: "D", point: [975, 255] },
      { id: "E", point: [950, 182] }
    ],
    edges: [
      ["A", "B"],
      ["A", "C"],
      ["A", "D"],
      ["A", "E"],
      ["B", "C"],
      ["B", "D"],
      ["B", "E"],
      ["C", "D"],
      ["C", "E"],
      ["D", "E"]
    ]
  }
]);

const [CONFIG, ...TOPOLOGIES] = DATA;
const origin = Object.freeze(CONFIG.origin);
const scale = CONFIG.scale;
const [originX, originY] = origin;
const sx = x => originX + x * scale;
const sy = y => originY + y * scale;

const SVG_NS = "http://www.w3.org/2000/svg";
const diagram = document.getElementById("diagram");
const stage = document.getElementById("stage");
const title = document.getElementById("diagram-title");
const subtitle = document.getElementById("diagram-subtitle");
const caption = document.getElementById("diagram-caption");
const captionRule = document.getElementById("caption-rule");
const { zero, unit, nodeRadius, haloRadius } = CONFIG;

function makeElement(name, className) {
  const element = document.createElementNS(SVG_NS, name);
  if (className) element.setAttribute("class", className);
  return element;
}

function locateText(element, point, anchor) {
  const [x, y] = point;
  element.setAttribute("x", sx(x));
  element.setAttribute("y", sy(y));
  element.setAttribute("text-anchor", anchor);
}

function locateLine(element, points) {
  const [start, end] = points;
  const [xOne, yOne] = start;
  const [xTwo, yTwo] = end;
  element.setAttribute("x1", sx(xOne));
  element.setAttribute("y1", sy(yOne));
  element.setAttribute("x2", sx(xTwo));
  element.setAttribute("y2", sy(yTwo));
}

function makeCard(bounds) {
  const [left, top, right, bottom] = bounds;
  const corners = [
    [left, top],
    [right, top],
    [right, bottom],
    [left, bottom]
  ];
  const card = makeElement("polygon", "card");
  card.setAttribute(
    "points",
    corners.map(point => {
      const [x, y] = point;
      return `${sx(x)},${sy(y)}`;
    }).join(" ")
  );
  return card;
}

function makeNode(node) {
  const [x, y] = node.point;
  const group = makeElement("g", "agent");
  const halo = makeElement("ellipse", "node-halo");
  const circle = makeElement("ellipse", "node");
  const label = makeElement("text", "node-label");

  halo.setAttribute("cx", sx(x));
  halo.setAttribute("cy", sy(y));
  halo.setAttribute("rx", sx(haloRadius) - sx(zero));
  halo.setAttribute("ry", sy(haloRadius) - sy(zero));

  circle.setAttribute("cx", sx(x));
  circle.setAttribute("cy", sy(y));
  circle.setAttribute("rx", sx(nodeRadius) - sx(zero));
  circle.setAttribute("ry", sy(nodeRadius) - sy(zero));

  locateText(label, node.point, "middle");
  label.textContent = node.id;

  const accessibleName = makeElement("title");
  accessibleName.textContent = `Агент ${node.id}`;

  group.append(accessibleName, halo, circle, label);
  return group;
}

function makeEdge(firstNode, secondNode) {
  const edge = makeElement("line", "network-edge");
  locateLine(edge, [firstNode.point, secondNode.point]);
  return edge;
}

function drawTopology(topology) {
  const group = makeElement(
    "g",
    `${topology.tone} ${topology.groupClass}`
  );
  group.setAttribute("aria-label", `${topology.title}: ${topology.count} связей`);

  const card = makeCard(topology.bounds);
  const heading = makeElement("text", "topology-title");
  const divider = makeElement("line", "divider");
  const count = makeElement("text", "count");
  const countLabel = makeElement("text", "count-label");
  const edgeLayer = makeElement("g", "edges");
  const nodeLayer = makeElement("g", "nodes");
  const nodeById = new Map(topology.nodes.map(node => [node.id, node]));

  locateText(heading, topology.titlePoint, "middle");
  heading.textContent = topology.title;
  locateLine(divider, topology.divider);

  topology.edges.forEach(pair => {
    const [firstId, secondId] = pair;
    edgeLayer.append(
      makeEdge(nodeById.get(firstId), nodeById.get(secondId))
    );
  });

  topology.nodes.forEach(node => nodeLayer.append(makeNode(node)));

  locateText(count, topology.countPoint, "middle");
  count.textContent = topology.count;
  locateText(countLabel, topology.countLabelPoint, "middle");
  countLabel.textContent = topology.countLabel;

  group.append(card, heading, divider, edgeLayer, nodeLayer, count, countLabel);
  stage.append(group);
}

try {
  locateText(title, CONFIG.titlePoint, "start");
  locateText(subtitle, CONFIG.subtitlePoint, "start");
  locateLine(captionRule, CONFIG.captionRule);
  locateText(caption, CONFIG.captionPoint, "middle");

  TOPOLOGIES.forEach(drawTopology);

  if (stage.childElementCount < unit) {
    throw new Error("Схема не построена");
  }
} catch (error) {
  stage.replaceChildren();
  const fallback = makeElement("text", "fallback");
  locateText(fallback, CONFIG.fallbackPoint, "middle");
  fallback.textContent =
    "Схема: звезда, цепочка и дерево — по 4 связи; полный граф — 10 связей.";
  stage.append(fallback);
}
</script>
</body>
</html>
