<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Карта четырёх новых деталей</title>
<style>
  :root{
    --bg:#fbfbfa; --fg:#1c1c1a; --muted:#6b6b66;
    --old:#8a8a82; --oldfill:#eeeeea;
    --new:#1b6f8c; --newfill:#dff0f6;
    --off:#8c5a1b; --offfill:#f7ecd9;
    --line:#a8a8a0;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16181a; --fg:#e8e8e4; --muted:#9a9a94;
      --old:#6e6e68; --oldfill:#232527;
      --new:#63c2df; --newfill:#12333d;
      --off:#e0a355; --offfill:#3a2c16;
      --line:#4a4c4e;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .wrap{background:var(--bg);padding:8px 4px 10px;}
  h2{margin:0 0 6px;font-size:15px;font-weight:600;text-align:center;}
  svg{display:block;width:100%;height:auto;max-height:520px;margin:0 auto;}
  .fail{padding:10px;color:var(--fg);font-size:13px;}
</style>
</head>
<body>
<div class="wrap">
  <h2>Шесть ручек GPT-2 и четыре добавки DeepSeek-V3</h2>
  <div id="host"></div>
</div>
<script>
(function(){
  var host=document.getElementById('host');
  try{
    var NS='http://www.w3.org/2000/svg';
    var W=880, H=470;

    // ---- данные схемы (единственные литералы-данные) ----
    var oldKnobs=[
      {y:1,label:'размер словаря'},
      {y:2,label:'число слоёв (глубина)'},
      {y:3,label:'ширина'},
      {y:4,label:'RMSNorm'},
      {y:5,label:'SwiGLU'},
      {y:6,label:'RoPE'}
    ];
    var newParts=[
      {y:1.1,tag:'MLA',place:'внутри attention',
       note:'K и V сжаты в один латент', kind:'new'},
      {y:2.7,tag:'роутинг без вспомогательного loss',place:'в MLP-части',
       note:'из 256 экспертов на токен работают 8', kind:'new'},
      {y:4.3,tag:'MTP',place:'на выходе',
       note:'предсказывает 2 токена, а не 1', kind:'new'},
      {y:5.9,tag:'DualPipe',place:'вне модели',
       note:'в конфиге его нет — это порядок работы GPU', kind:'off'}
    ];

    // ---- один origin, один scale, одна пара sx/sy ----
    var origin={x:24,y:36};
    var scale={x:118,y:62};
    function sx(x){return origin.x+x*scale.x;}
    function sy(y){return origin.y+y*scale.y;}

    // пиксельные литералы: только отступ подписи, толщина, шрифт
    var PAD=8, TH=1.6, FS=13, FSS=11.5;

    var svg=document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    svg.setAttribute('role','img');
    host.appendChild(svg);

    function el(n,a){var e=document.createElementNS(NS,n);
      for(var k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
    function txt(x,y,s,anchor,cls,size){
      var t=el('text',{x:x,y:y,'text-anchor':anchor,
        'font-size':size||FS,fill:cls,'dominant-baseline':'middle'});
      t.textContent=s;return t;}

    // marker
    var defs=el('defs',{});
    ['new','off'].forEach(function(k){
      var m=document.createElementNS(NS,'marker');
      m.setAttribute('id','ah-'+k);m.setAttribute('markerWidth','7');
      m.setAttribute('markerHeight','7');m.setAttribute('refX','6');
      m.setAttribute('refY','3');m.setAttribute('orient','auto');
      var p=document.createElementNS(NS,'path');
      p.setAttribute('d','M0,0 L6,3 L0,6 z');
      p.setAttribute('fill','var(--'+k+')');
      m.appendChild(p);defs.appendChild(m);
    });

    // фон
    el('rect',{x:sx(0)-origin.x,y:sy(0)-origin.y,width:W,height:H,fill:'var(--bg)'});

    // ---- левая колонка: шесть ручек, вычеркнуты ----
    var L0=0.15, L1=1.55;               // x-границы левой рамки
    el('rect',{x:sx(L0),y:sy(0.55),width:sx(L1)-sx(L0),height:sy(6.45)-sy(0.55),
      rx:sy(0.12)-sy(0),fill:'var(--oldfill)',stroke:'var(--old)',
      'stroke-width':TH,'stroke-dasharray':'5 4'});
    txt(sx((L0+L1)/2),sy(0.3),'знакомое из шага 3','middle','var(--muted)',FSS);

    oldKnobs.forEach(function(d){
      txt(sx(L1)-PAD,sy(d.y),d.label,'end','var(--old)',FS);
      el('line',{x1:sx(L0+0.08),y1:sy(d.y),x2:sx(L1-0.05),y2:sy(d.y),
        stroke:'var(--old)','stroke-width':TH});
    });

    // ---- правая колонка: четыре добавки ----
    var R0=2.6, R1=6.9;
    newParts.forEach(function(d,i){
      var col=d.kind==='new'?'var(--new)':'var(--off)';
      var fill=d.kind==='new'?'var(--newfill)':'var(--offfill)';
      el('rect',{x:sx(R0),y:sy(d.y-0.42),width:sx(R1)-sx(R0),
        height:sy(d.y+0.42)-sy(d.y-0.42),rx:sy(0.1)-sy(0),
        fill:fill,stroke:col,'stroke-width':TH,
        'stroke-dasharray':d.kind==='off'?'6 4':'none'});
      txt(sx(R0)+PAD,sy(d.y-0.16),d.tag,'start',col,FS)
        .setAttribute('font-weight','600');
      txt(sx(R0)+PAD,sy(d.y+0.17),d.place+' — '+d.note,'start','var(--muted)',FSS);
      // стрелка от левой колонки: подпись у хвоста уже стоит слева
      el('line',{x1:sx(L1+0.15),y1:sy(oldKnobs[Math.min(i*2,5)].y),
        x2:sx(R0)-PAD,y2:sy(d.y),stroke:col,'stroke-width':TH,
        'marker-end':'url(#ah-'+d.kind+')',
        'stroke-dasharray':d.kind==='off'?'4 4':'none'});
    });

    // ---- разделитель: три в файле, четвёртой нет ----
    var sepY=5.2;
    el('line',{x1:sx(R0-0.25),y1:sy(sepY),x2:sx(R1),y2:sy(sepY),
      stroke:'var(--line)','stroke-width':TH,'stroke-dasharray':'2 5'});
    txt(sx(R1),sy(sepY-0.24),'три — есть в конфиге','end','var(--muted)',FSS);
    txt(sx(R1),sy(sepY+0.26),'четвёртая — только в обучении','end','var(--muted)',FSS);

    // ---- итог ----
    txt(sx((R0+R1)/2),sy(6.45),
      '6 старых ручек + 4 новые детали = 671B всего, 37B активных',
      'middle','var(--fg)',FS);
  }catch(e){
    host.innerHTML='<div class="fail">Схема должна показывать: слева шесть '+
      'ручек GPT-2 (размер словаря, число слоёв, ширина, RMSNorm, SwiGLU, '+
      'RoPE) — все вычеркнуты как знакомые из шага 3. Справа четыре добавки '+
      'DeepSeek-V3 по месту в модели: MLA — внутри attention; роутинг без '+
      'вспомогательного loss — в MLP-части (из 256 экспертов на токен '+
      'работают 8); MTP — на выходе (2 токена вместо 1); DualPipe — вне '+
      'модели, в конфиге его нет. Первые три есть в файле, четвёртой нет.</div>';
  }
})();
</script>
</body>
</html>
