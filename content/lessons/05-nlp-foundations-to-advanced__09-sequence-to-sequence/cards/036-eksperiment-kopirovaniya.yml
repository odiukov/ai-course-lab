- concept: задача копирования изолирует способность архитектуры сохранять информацию о длинном входе
  question: Объясни своими словами, почему ухудшение точности на длинных последовательностях в задаче точного копирования служит признаком потери информации, а не недостаточного понимания языка.
  explanation: В уроке задача остаётся одинаковой для всех длин, но точность падает с 89% до уровня, близкого к случайным 50%. Поскольку семантическое понимание для копирования не нужно, такое падение выявляет ограничение способа сохранения и передачи входной информации.
  kind: open
  reference: 'Копирование не требует интерпретировать смысл или преобразовывать вход: модель должна лишь сохранить токены и их порядок. Если при неизменном правиле качество падает только из-за увеличения длины, значит архитектура всё хуже удерживает детали входной последовательности.'
  id: 036-eksperiment-kopirovaniya-2
  fingerprint: f6339ecc
