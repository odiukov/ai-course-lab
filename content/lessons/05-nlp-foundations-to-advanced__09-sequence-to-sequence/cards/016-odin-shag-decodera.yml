- concept: порядок вычислений в одном вызове рекуррентного decoder
  question: Расположите операции одного шага GRU-decoder в правильном порядке.
  explanation: Сначала индекс токена превращается в вектор. GRU объединяет этот вектор с прежним состоянием, после чего линейный слой получает новое состояние и вычисляет логиты следующего токена.
  kind: order
  items:
    - Преобразовать входной токен в embedding
    - Передать embedding и прежний hidden state в GRU
    - Спроецировать выход GRU линейным слоем в логиты по словарю
    - Вернуть логиты и обновлённый hidden state
  id: 016-odin-shag-decodera-1
  fingerprint: 56f7842a
- concept: передача обновлённого hidden state между последовательными вызовами decoder
  question: Decoder выполнил один шаг и вернул logits и next_hidden. Какое состояние нужно подать ему при обработке следующего токена?
  explanation: На следующем вызове decoder получает next_hidden, возвращённый предыдущим вызовом. Благодаря этому информация, накопленная при обработке прошлых токенов, сохраняется по всей генерируемой последовательности.
  kind: choice
  options:
    - Прежнее состояние, которое подавалось на завершённом шаге
    - Обновлённое состояние next_hidden
    - Тензор logits вместо скрытого состояния
    - Нулевое состояние при каждом новом токене
  correct: 1
  id: 016-odin-shag-decodera-2
  fingerprint: 800ab0f2
