- concept: softmax не требуется перед выбором токена с максимальным логитом
  question: Decoder выбирает следующий токен по максимальному логиту. Почему перед argmax можно не применять softmax?
  explanation: 'Softmax монотонно преобразует логиты: большему логиту соответствует большая вероятность. Поэтому argmax по логитам и argmax по вероятностям возвращают один и тот же индекс.'
  kind: choice
  options:
    - Softmax сохраняет порядок логитов, поэтому индекс максимума не изменится
    - Argmax автоматически преобразует логиты в вероятности
    - Softmax нужен только при использовании padding-токенов
  correct: 0
  id: 021-teacher-forcing-input-1
  fingerprint: f8f4efe7
- concept: обе ветви teacher forcing должны возвращать тензор одинаковой формы для decoder
  question: Batch-first decoder принимает по одному входному токену для каждой последовательности. Какое требование должно выполняться и для истинных токенов из tgt, и для предсказаний модели?
  explanation: Срез целевых токенов теряет ось последовательности, поэтому её добавляют обратно. После выбора argmax предсказание также сохраняют с одноэлементной осью, чтобы любой результат можно было сразу передать decoder.
  kind: choice
  options:
    - Обе ветви должны сохранять отдельную одноэлементную ось последовательности
    - Обе ветви должны содержать распределение по всему словарю
    - Обе ветви должны удалять ось батча
  correct: 0
  id: 021-teacher-forcing-input-2
  fingerprint: a96f90fd
- concept: одна скалярная случайная выборка задаёт общую ветвь teacher forcing для всего батча
  question: При выборе teacher forcing программа генерирует одно скалярное случайное значение для батча. Как это влияет на обработку примеров?
  explanation: Скалярное сравнение даёт одно булево решение, поэтому ветвление применяется сразу ко всему батчу. Для независимого выбора по примерам понадобился бы тензор случайных значений и поэлементное смешивание ветвей.
  kind: choice
  options:
    - 'Все примеры батча используют одну и ту же ветвь: истинный токен или предсказание'
    - Для каждого примера автоматически генерируется отдельное решение
    - Истинный токен получает только пример с наибольшим loss
  correct: 0
