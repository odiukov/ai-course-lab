- concept: безопасное вычисление masked mean для батча без валидных целевых токенов
  question: Объясни, как избежать деления на ноль при вычислении masked sequence cross-entropy, если все целевые позиции оказались padding-токенами.
  explanation: У полностью padding-батча сумма маски равна нулю. Без защиты она становится нулевым знаменателем; ограничение знаменателя снизу сохраняет корректное конечное значение.
  kind: open
  reference: Нужно ограничить количество валидных токенов снизу положительным значением перед делением. После обнуления masked-позиций числитель останется нулевым, поэтому функция вернёт конечный нулевой loss вместо NaN или бесконечности.
  id: 025-sequence-cross-entropy-3
  fingerprint: d88f538e
