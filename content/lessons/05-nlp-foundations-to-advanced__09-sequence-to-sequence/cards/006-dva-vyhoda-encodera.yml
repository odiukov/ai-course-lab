- concept: различие между последовательностью состояний outputs и финальным состоянием hidden у GRU-энкодера
  question: Объясните своими словами, чем различаются тензоры outputs и hidden, возвращаемые однослойной GRU с batch_first=True.
  explanation: 'При batch_first=True ось последовательности сохраняется в outputs, поэтому доступны состояния всех токенов. В hidden оси последовательности нет: там остаётся финальное состояние каждого примера.'
  kind: open
  reference: outputs содержит скрытое состояние для каждой позиции входной последовательности, а hidden — только финальное скрытое состояние для каждого примера в батче.
  id: 006-dva-vyhoda-encodera-1
  fingerprint: 23f8dfb2
- concept: совпадение hidden с состоянием последней позиции outputs в однослойной однонаправленной GRU
  question: Как связано значение hidden со скрытым состоянием последней позиции в outputs у однослойной однонаправленной GRU?
  explanation: GRU последовательно обновляет скрытое состояние. Состояние после последнего токена одновременно записывается в последнюю позицию outputs и возвращается отдельно как hidden.
  kind: open
  reference: hidden совпадает со скрытым состоянием последней позиции в outputs; это отдельная удобная выдача того же результата, а не независимо вычисленная сводка.
  id: 006-dva-vyhoda-encodera-2
  fingerprint: d1926dab
