- concept: ограничение максимальной длины завершает декодирование, если модель не предсказывает EOS
  question: Объясни своими словами, зачем при авторегрессивном декодировании задают максимальную длину результата, даже если модель умеет предсказывать <EOS>.
  explanation: <EOS> — основное условие завершения, но его появление не гарантировано. Поэтому цикл декодирования также останавливают при достижении заранее заданного предела длины.
  kind: open
  reference: Модель может ни разу не выбрать <EOS>, например из-за ошибки или зацикливания. Максимальная длина служит запасным условием остановки и не позволяет генерации продолжаться бесконечно.
  id: 019-bos-eos-i-obratnaya-svyaz-2
  fingerprint: e09311b0
