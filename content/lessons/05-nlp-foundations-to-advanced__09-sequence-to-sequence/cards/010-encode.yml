- concept: Embedding преобразует категориальные индексы токенов в обучаемые векторы
  question: Почему индексы токенов обычно пропускают через Embedding перед передачей в GRU?
  explanation: Без Embedding номера токенов выглядели бы как скалярные величины с искусственным отношением порядка и расстояния. Обучаемые векторы позволяют модели самой сформировать полезное представление каждого токена.
  kind: open
  reference: Индекс токена является категориальным идентификатором, а не числовой величиной. Embedding сопоставляет каждому индексу обучаемый вектор признаков, с которым может работать GRU.
  id: 010-encode-1
  fingerprint: 385b4f02
- concept: padding_idx исключает embedding служебного токена дополнения из обучения
  question: Заполни аргумент Embedding, который указывает индекс токена дополнения.
  explanation: Строка матрицы Embedding, выбранная через padding_idx, не обновляется градиентным спуском. Поэтому дополнение последовательностей не обучается как содержательный токен.
  kind: cloze
  template: self.embed = nn.Embedding(src_vocab_size, embed_dim, ___=pad_id)
  answer: padding_idx
  accept:
    - padding_idx
  id: 010-encode-2
