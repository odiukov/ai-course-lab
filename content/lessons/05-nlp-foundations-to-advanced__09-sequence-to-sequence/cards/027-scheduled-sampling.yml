- concept: форма расписания scheduled sampling является настраиваемой, но доля teacher forcing должна уменьшаться
  question: Какое утверждение о расписании scheduled sampling верно?
  explanation: 'У scheduled sampling нет обязательной универсальной кривой: допустимы разные способы уменьшения teacher forcing ratio. Существенно общее направление — со временем реже подставлять истинный предыдущий токен и чаще использовать предсказание модели.'
  kind: choice
  options:
    - Долю teacher forcing можно снижать равномерно, ступенчато или после начального периода обучения
    - Для всех seq2seq-задач существует единственное оптимальное расписание
    - Доля teacher forcing должна расти, чтобы обучение становилось ближе к авторегрессивному инференсу
    - Расписание определяет только learning rate и не меняет входы decoder
