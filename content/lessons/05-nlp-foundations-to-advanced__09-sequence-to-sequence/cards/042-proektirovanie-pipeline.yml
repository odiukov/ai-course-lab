- concept: стартовый checkpoint для seq2seq выбирают по задаче и языковому покрытию
  question: Какой стартовый checkpoint разумнее выбрать для перевода с португальского на несколько других языков?
  explanation: При выборе checkpoint важны соответствие задаче и охват исходного и целевых языков. Для многоязычного перевода подходит семейство вроде NLLB, тогда как известность или размер модели сами по себе не гарантируют нужной языковой поддержки.
  kind: choice
  options:
    - Самый крупный доступный checkpoint независимо от языков обучения
    - Предобученный многоязычный encoder-decoder checkpoint с поддержкой нужных языков
    - Любую англоязычную decoder-only модель без проверки токенизатора
    - Случайно инициализированную RNN, чтобы избежать влияния предобучения
  correct: 1
  id: 042-proektirovanie-pipeline-1
  fingerprint: 5e9c2dff
- concept: generation drift выявляют проверкой выходов из верхнего хвоста распределения длины
  question: Объясни своими словами, почему перед выпуском seq2seq-системы недостаточно проверить только короткие выходы и как построить проверку длинных результатов.
  explanation: Короткий результат может завершиться раньше, чем накопленные авторегрессивные ошибки станут заметны. В материале рекомендуется отдельно просматривать длинные выходы и искать повторы, обрывы и смысловой drift — характерное проявление exposure bias при инференсе.
  kind: open
  reference: На длинных выходах собственные ранние ошибки модели дольше подаются обратно в декодер и могут вызвать повторы, циклы, обрывы или постепенный уход от смысла. Поэтому нужно отобрать примеры из верхнего хвоста распределения длины и вручную проверить связность, полноту и соответствие исходному содержанию.
  id: 042-proektirovanie-pipeline-2
  fingerprint: 40d9bf64
