- concept: выбор teacher forcing происходит после текущего предсказания и определяет вход decoder на следующем шаге
  question: Расположите действия одного шага обучения авторегрессивного decoder в правильном порядке.
  explanation: Teacher forcing не изменяет уже сделанное предсказание и не отменяет loss. После оценки текущего предсказания он лишь выбирает, какой прошлый токен decoder увидит на следующем шаге.
  kind: order
  items:
    - Получить логиты текущего токена из текущего входа и скрытого состояния
    - Сравнить логиты с истинным текущим токеном и добавить шаговый loss
    - Случайно решить, применять ли teacher forcing
    - Подать на следующий шаг истинный текущий токен или предсказание модели
  id: 020-vybor-vhoda-pri-obuchenii-1
  fingerprint: 8e83bd52
- concept: teacher forcing с вероятностным коэффициентом независимо выбирается на каждой позиции последовательности
  question: Как обычно применяется вероятностный teacher forcing при обработке одной целевой последовательности?
  explanation: Коэффициент задаёт вероятность отдельного решения на каждом шаге, а не точную долю подсказок в последовательности. Поэтому фактическое число шагов с teacher forcing меняется от прохода к проходу.
  kind: choice
  options:
    - Для каждой позиции заново случайно выбирается истинный токен или предсказание модели
    - Один случайный выбор делается сразу для всей последовательности
    - Истинный токен подаётся только после ошибочного предсказания
    - Заранее выбирается фиксированное число позиций с подсказкой
  correct: 0
  id: 020-vybor-vhoda-pri-obuchenii-2
  fingerprint: b4a565bc
