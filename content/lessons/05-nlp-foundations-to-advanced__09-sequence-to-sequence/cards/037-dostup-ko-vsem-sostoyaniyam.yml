- concept: распределение attention пересчитывается на каждом шаге декодирования
  question: Почему decoder с attention вычисляет веса по состояниям encoder заново при создании каждого выходного токена?
  explanation: Фиксированные веса давали бы одно и то же представление входа на всех шагах. Пересчёт attention позволяет фокусу перемещаться вслед за тем фрагментом источника, который нужен для текущего выходного токена.
  kind: open
  reference: Разным выходным токенам могут соответствовать разные части входа, поэтому на каждом шаге decoder должен заново определять наиболее полезные состояния encoder.
