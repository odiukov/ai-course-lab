- concept: идентификаторы токенов имеют смысл только в словаре токенизатора, согласованного с checkpoint модели
  question: К encoder-decoder модели подключили токенизатор от другого checkpoint. Формы входных тензоров подходят, но результат генерации стал бессвязным. Какова наиболее вероятная причина?
  explanation: Модель обучалась связывать каждый идентификатор с конкретным токеном своего словаря. Другой токенизатор может присвоить тому же идентификатору иной фрагмент текста, поэтому вход и выход интерпретируются неверно, даже если технически размеры тензоров совместимы.
  kind: choice
  options:
    - Одинаковые идентификаторы обозначают разные фрагменты текста для модели и чужого токенизатора
    - Encoder-decoder модели поддерживают только посимвольную токенизацию
    - Чужой токенизатор автоматически отключает autoregressive decoding
    - Модель перестаёт вычислять распределение по выходному словарю
  correct: 0
  id: 039-gotovaya-model-1
  fingerprint: 97b98417
- concept: служебные токены можно исключить при преобразовании сгенерированных идентификаторов в пользовательский текст
  question: Заполни аргумент, чтобы при декодировании результата Hugging Face не выводить служебные токены.
  explanation: Параметр skip_special_tokens=True убирает из итоговой строки технические маркеры вроде BOS, EOS и padding. Они нужны модели для обработки последовательности, но обычно не должны отображаться пользователю.
  kind: cloze
  template: text = tok.decode(output_ids, ___)
  answer: skip_special_tokens=True
  accept:
    - skip_special_tokens = True
  id: 039-gotovaya-model-2
