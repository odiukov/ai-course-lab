- concept: minimum risk training оптимизирует качество полной последовательности по целевой метрике
  question: Какое описание лучше всего отличает minimum risk training от обычного обучения seq2seq с токенной кросс-энтропией?
  explanation: Токенная кросс-энтропия оценивает правильность отдельных следующих токенов, а minimum risk training приближает обучение к итоговой цели, оценивая последовательность целиком по метрике качества.
  kind: choice
  options:
    - Оно оценивает полную сгенерированную последовательность с помощью метрики вроде sentence-level BLEU
    - Оно заменяет decoder классификатором отдельных входных токенов
    - Оно требует, чтобы каждый токен перевода стоял на той же позиции, что и в единственном эталоне
    - Оно обучает только encoder, не изменяя параметры генератора
  correct: 0
  id: 041-loss-i-nagrada-posledovatelnosti-1
  fingerprint: fd21c3ca
- concept: reinforcement learning fine-tuning обучает генератор по награде за последовательность
  question: Объясните своими словами, как reinforcement learning позволяет донастраивать генератор текста по метрике качества полной последовательности.
  explanation: В reinforcement learning обучающий сигнал задаётся наградой за результат генерации целиком, а не отдельной правильной меткой на каждой позиции. Такой принцип применяется, в частности, при RLHF для языковых моделей.
  kind: open
  reference: Модель генерирует последовательность и получает за неё награду, вычисленную по выбранной метрике. Обновление параметров повышает вероятность последовательностей и решений, связанных с высокой наградой, и понижает её для низкой награды.
  id: 041-loss-i-nagrada-posledovatelnosti-2
  fingerprint: 2b063862
