- concept: состав состояния отдельной гипотезы в beam search
  question: Какие данные нужно хранить отдельно для каждой живой гипотезы beam search?
  explanation: Разные префиксы приводят decoder в разные скрытые состояния. Поэтому у каждой гипотезы должны быть собственные токены, состояние decoder и накопленная оценка всего пути.
  kind: choice
  options:
    - Токенный префикс, соответствующее ему состояние decoder и накопленную оценку
    - Только последний предсказанный токен и размер целевого словаря
    - Общее для всего луча состояние decoder и оценку последнего токена
  correct: 0
  id: 032-luchi-i-ocenki-1
  fingerprint: ad3674a2
- concept: расширение и глобальное прореживание гипотез на одном шаге beam search
  question: Расположи действия одного шага beam search в правильном порядке.
  explanation: Сначала расширяется каждая живая гипотеза, после чего все продолжения конкурируют в общем наборе. Луч формируется по накопленной оценке последовательности целиком, а не отдельно внутри каждого исходного префикса.
  kind: order
  items:
    - Получить распределение следующего токена для каждой живой гипотезы
    - Построить возможные продолжения гипотез и обновить их накопленные оценки
    - Объединить получившиеся продолжения в общий набор кандидатов
    - Оставить в луче лучшие незавершённые кандидаты
  id: 032-luchi-i-ocenki-2
  fingerprint: e40bbb62
- concept: обработка завершённых гипотез с EOS в beam search
  question: Как beam search должен поступить с гипотезой, которая сгенерировала EOS?
  explanation: 'EOS закрывает последовательность, поэтому дальнейшее расширение не требуется. Однако завершённую гипотезу сохраняют: после окончания поиска её оценку сравнивают с оценками других завершённых последовательностей.'
  kind: choice
  options:
    - Сохранить её как завершённую с итоговой оценкой и больше не расширять
    - Оставить среди живых и продолжать добавлять к ней токены
    - Немедленно вернуть её, не сравнивая с другими завершёнными гипотезами
  correct: 0
  id: 032-luchi-i-ocenki-3
  fingerprint: 2b366299
