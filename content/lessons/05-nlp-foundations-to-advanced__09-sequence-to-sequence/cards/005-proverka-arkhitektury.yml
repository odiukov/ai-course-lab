- concept: decoder вычисляет распределение вероятностей по целевому словарю
  question: Какая часть классической seq2seq-модели на каждом шаге выдаёт распределение вероятностей для следующего целевого токена?
  explanation: Decoder использует своё текущее состояние и предыдущий целевой токен, чтобы получить распределение по целевому словарю. Context vector лишь задаёт его начальное состояние.
  kind: choice
