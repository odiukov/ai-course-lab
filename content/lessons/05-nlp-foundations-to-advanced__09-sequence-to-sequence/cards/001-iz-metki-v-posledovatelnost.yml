- concept: seq2seq отображает входную последовательность в выходную последовательность переменной длины
  question: Какая задача требует модели типа sequence-to-sequence, а не обычного классификатора?
  explanation: Классификатор возвращает одну метку фиксированного типа. В переводе результат состоит из последовательности токенов, причём её длина не обязана совпадать с длиной входа.
  kind: choice
  options:
    - Перевести предложение, породив последовательность токенов неизвестной заранее длины
    - Определить тональность отзыва, выбрав метку из фиксированного набора
    - Решить, относится ли письмо к спаму
  correct: 0
  id: 001-iz-metki-v-posledovatelnost-1
  fingerprint: ac241d5e
- concept: выход переменной длины формируется по одному токену до знака конца последовательности
  question: Расположите действия декодера seq2seq в порядке авторегрессионной генерации ответа.
  explanation: Декодер последовательно принимает решения о каждом токене. Специальный знак конца сообщает, когда нужно остановиться, поэтому длину ответа не требуется задавать заранее.
  kind: order
  items:
    - Предсказать очередной выходной токен
    - Добавить предсказанный токен к выходной последовательности
    - Проверить, является ли токен знаком конца последовательности
    - Завершить генерацию при знаке конца или повторить цикл для следующего токена
  id: 001-iz-metki-v-posledovatelnost-2
  fingerprint: 9084484c
- concept: исходная и целевая последовательности могут использовать разные словари токенов
  question: Почему в задаче машинного перевода входной и выходной словари токенов не обязаны совпадать?
  explanation: Seq2seq связывает две последовательности, но не требует общего пространства токенов. Например, русская исходная фраза и английский перевод естественно кодируются разными словарями.
  kind: open
  reference: Вход и выход могут относиться к разным языкам, для которых используются разные наборы слов, частей слов и служебных токенов. Поэтому encoder обрабатывает токены исходного словаря, а decoder порождает токены целевого словаря.
  id: 001-iz-metki-v-posledovatelnost-3
  fingerprint: 610ed0f6
