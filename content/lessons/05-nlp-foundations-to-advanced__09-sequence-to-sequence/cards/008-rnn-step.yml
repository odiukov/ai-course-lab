- concept: broadcasting смещения при обновлении состояния RNN
  question: Почему в выражении обновления состояния можно прибавить вектор b к матрице состояний всего батча?
  explanation: При broadcasting вектор b с размерностью скрытого состояния виртуально распространяется по измерению батча и прибавляется к каждой строке.
  kind: choice
  options:
    - PyTorch превращает матрицу состояний в один вектор
    - Оператор сложения использует только первую строку матрицы
    - PyTorch автоматически применяет один и тот же вектор смещения к каждой строке батча
