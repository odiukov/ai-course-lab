- concept: softmax нормализует произвольные логиты в вероятности
  question: Какое утверждение всегда верно для значений, полученных применением softmax к логитам?
  explanation: Softmax возводит экспоненту каждого логита в положительное число и делит её на сумму экспонент. Поэтому результат образует нормированное распределение вероятностей.
  kind: choice
  options:
    - Все значения неотрицательны, а их сумма равна единице
    - Все значения положительны и равны друг другу
    - Каждое значение сохраняет величину соответствующего логита
    - Отрицательным логитам соответствуют отрицательные вероятности
  correct: 0
  id: 014-softmax-po-slovaryu-1
  fingerprint: 959ab45e
- concept: softmax не меняется при одинаковом сдвиге всех логитов
  question: Объясни своими словами, что произойдёт с распределением softmax, если ко всем логитам текущего шага прибавить одну и ту же константу.
  explanation: Для сдвинутого логита экспонента получает одинаковый множитель для всех токенов. При нормализации этот множитель сокращается, поэтому важны разности между логитами, а не их абсолютный уровень.
  kind: open
  reference: 'Распределение не изменится: общий множитель, появившийся после возведения сдвинутых логитов в экспоненту, сократится в числителе и знаменателе.'
  id: 014-softmax-po-slovaryu-2
  fingerprint: 74939bee
- concept: softmax нормализует логиты отдельно на каждом шаге декодирования
  question: Decoder сформировал логиты для нескольких последовательных позиций. По какой оси следует применять softmax, чтобы получить вероятности следующего токена на каждой позиции?
  explanation: Каждая позиция представляет отдельное предсказание следующего токена. Поэтому на каждом шаге нормализуются оценки всех токенов словаря; смешивать при нормализации разные позиции или примеры батча нельзя.
  kind: choice
  options:
    - По оси токенов целевого словаря отдельно для каждой позиции и каждого элемента батча
    - По временной оси сразу для всей последовательности
    - По оси батча, сравнивая разные примеры между собой
    - Одновременно по всем элементам тензора логитов
  correct: 0
  id: 014-softmax-po-slovaryu-3
