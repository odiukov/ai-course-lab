- concept: обновление finished до записи результата исключает EOS из выходного тензора
  question: Расположите операции одного шага батчевого greedy decoding так, чтобы EOS не попадал в возвращаемые последовательности.
  explanation: Флаги обновляют сразу после выбора токенов. Поэтому строка, только что выдавшая EOS, уже считается завершённой при маскировании, и вместо EOS в output_ids записывается pad_id.
  kind: order
  items:
    - Выбрать next_token с помощью argmax по логитам
    - Обновить finished условием finished | (next_token == eos_id)
    - Завершить цикл, если истинны все флаги finished
    - Замаскировать токены завершённых строк значением pad_id и добавить результат в output_ids
  id: 028-zhadnyi-cikl-1
  fingerprint: 431a0378
- concept: finished.all сокращает цикл, а построчная маска обеспечивает корректность завершённых последовательностей
  question: При батчевом greedy decoding часть последовательностей уже выдала EOS, а остальные ещё генерируются. Какие действия нужны для корректного результата?
  explanation: Проверка finished.all() позволяет дождаться всех строк и завершить цикл раньше предельной длины. Маскирование отдельно защищает уже закончившиеся строки от токенов, которые decoder продолжает предсказывать после EOS.
  kind: choice
  options:
    - Сразу остановить весь цикл при появлении любого EOS
    - Продолжать цикл до finished.all(), не изменяя токены уже завершённых строк
    - Маскировать токены завершённых строк в pad_id и остановиться, когда finished.all()
    - Удалять завершённые строки из hidden state без изменения остальных тензоров
  correct: 2
