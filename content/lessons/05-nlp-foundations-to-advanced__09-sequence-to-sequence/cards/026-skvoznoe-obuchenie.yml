- concept: порядок полного прямого и обратного прохода при обучении seq2seq на батче
  question: Расположите операции обучения seq2seq-модели на батче в правильном порядке.
  explanation: 'Параметры не обновляют между токенами: сначала строится полный прямой проход encoder и decoder, затем общий лосс запускает backpropagation through time, после чего optimizer совместно обновляет параметры.'
  kind: order
  items:
    - Обнулить градиенты параметров
    - Закодировать исходные последовательности и получить начальное состояние decoder
    - Пройти все целевые позиции и накопить общий лосс
    - Вызвать backward для распространения градиентов через развёрнутые во времени вычисления
    - Вызвать optimizer.step для обновления параметров
  id: 026-skvoznoe-obuchenie-1
  fingerprint: 138d3cd9
- concept: распространение градиента от позднего шага decoder к ранним вычислениям encoder
  question: Объясните своими словами, как ошибка на поздней целевой позиции может изменить параметры, использованные при обработке начала исходной последовательности.
  explanation: Скрытые состояния связывают временные шаги в единый вычислительный граф. Поэтому лосс позднего предсказания влияет не только на выходной слой decoder, но и на более ранние рекуррентные вычисления обоих компонентов.
  kind: open
  reference: При backpropagation through time градиент идёт назад через цепочку скрытых состояний decoder, достигает переданного encoder состояния, а затем распространяется через скрытые состояния encoder к ранним входным позициям.
  id: 026-skvoznoe-obuchenie-2
  fingerprint: 8dc04a4b
- concept: необходимость обнуления накопленных градиентов перед обучением на следующем батче
  question: Почему в стандартном цикле обучения PyTorch перед прямым проходом следующего батча вызывают optimizer.zero_grad()?
  explanation: PyTorch по умолчанию накапливает градиенты в полях параметров. Без обнуления очередной backward прибавит новые градиенты к оставшимся от предыдущего батча, что изменит предполагаемое обновление.
  kind: choice
  options:
    - Чтобы обнулить значения функции потерь
    - Чтобы сбросить скрытые состояния внутри уже построенного графа
    - Чтобы случайно переинициализировать веса модели
    - Чтобы удалить padding-токены из целевых последовательностей
    - Чтобы градиенты нового backward не сложились с градиентами предыдущего батча
  correct: 4
  id: 026-skvoznoe-obuchenie-3
  fingerprint: 69e77481
