- concept: финальное скрытое состояние рекуррентного encoder накапливает информацию по мере чтения входа
  question: Что представляет собой context vector однонаправленного GRU-encoder без attention?
  explanation: На каждой позиции GRU обновляет состояние с учётом текущего embedding и предыдущего состояния. Поэтому финальный hidden содержит накопленное представление последовательности, а не только информацию о последнем токене.
  kind: choice
  options:
    - Embedding последнего входного токена без учёта предыдущих токенов
    - Среднее арифметическое embeddings всех входных токенов
    - Результат последовательных рекуррентных обновлений, учитывающий последний токен и накопленную ранее информацию
    - Конкатенацию скрытых состояний всех входных позиций
  correct: 2
  id: 009-prohod-encodera-1
  fingerprint: e0a345e0
- concept: рекуррентное кодирование чувствительно к порядку входных токенов
  question: Объясни своими словами, почему две последовательности из одинаковых токенов, расположенных в разном порядке, обычно получают разные context vectors в однонаправленном GRU-encoder.
  explanation: GRU обрабатывает не множество токенов, а упорядоченную последовательность. При перестановке токенов меняются промежуточные состояния и входные данные для последующих обновлений, поэтому меняется и итоговый context vector.
  kind: open
  reference: Каждое новое скрытое состояние зависит одновременно от текущего токена и состояния, полученного после предыдущего префикса. Перестановка токенов меняет последовательность рекуррентных обновлений и поэтому обычно меняет финальное состояние.
  id: 009-prohod-encodera-2
  fingerprint: 39cce236
