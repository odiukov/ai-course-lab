- concept: ошибки при авторегрессивном инференсе могут накапливаться из-за подачи предсказанных токенов обратно в decoder
  question: Seq2seq-модель обучалась с teacher forcing, а при инференсе подала ошибочно предсказанный токен на следующий вход decoder. Почему это может исказить всю оставшуюся последовательность?
  explanation: При teacher forcing decoder обычно видит правильные целевые префиксы. На инференсе его собственная ошибка становится частью следующего входа и может привести к незнакомому префиксу, поэтому последующие ошибки начинают накапливаться.
  kind: choice
  options:
    - Ошибочный токен меняет целевой префикс, а decoder мало обучался продолжать такие префиксы
    - После первой ошибки context vector автоматически обнуляется
    - Любая ошибка необратимо запрещает decoder предсказывать токен EOS
    - При инференсе перестают использоваться параметры выходной проекции
  correct: 0
  id: 022-exposure-bias-1
  fingerprint: 1e5020e5
- concept: teacher-forced loss не измеряет способность decoder восстанавливаться после собственных ошибок
  question: Объясни своими словами, почему низкий loss при обучении seq2seq-модели с teacher forcing не гарантирует устойчивую авторегрессивную генерацию.
  explanation: Условия вычисления обучающего loss и условия генерации различаются. Loss на правильных префиксах может быть низким, даже если одна ранняя ошибка во время инференса уводит decoder в незнакомую область и портит продолжение.
  kind: open
  reference: Обучающий loss оценивает предсказания преимущественно при условии правильных предыдущих токенов. Во время авторегрессивной генерации decoder получает собственные предсказания, включая ошибочные, и может оказаться на префиксах, с которыми почти не сталкивался при обучении. Поэтому хороший teacher-forced loss не показывает, умеет ли модель восстанавливаться после своих ошибок.
  id: 022-exposure-bias-2
  fingerprint: 998b5288
