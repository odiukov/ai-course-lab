- concept: нейросетевой кодек превращает непрерывное аудио в дискретные токены для языковой модели
  question: Почему Token LM предсказывает токены нейросетевого кодека, а не отдельные отсчёты звуковой волны?
  explanation: Отдельный отсчёт звуковой волны почти ничего не сообщает о воспринимаемом звуке. EnCodec группирует сигнал в кадры и описывает их дискретными токенами, которые можно предсказывать авторегрессивно.
  kind: choice
  options:
    - Кодек заранее определяет окончательную структуру музыкального произведения
    - Отдельные отсчёты нельзя хранить и обрабатывать на компьютере
    - Кодек представляет значимые фрагменты аудио дискретными номерами из обученных кодбуков
  correct: 2
  id: 004-token-lm-1
  fingerprint: 37d144d3
- concept: число токенов кодека определяется длительностью, частотой кадров и количеством кодбуков
  question: Кодек выдаёт 75 кадров в секунду и использует 6 кодбуков. Сколько токенов потребуется для представления 24 секунд аудио?
  explanation: 'На каждый кадр приходится по одному токену каждого кодбука: 24 × 75 × 6 = 10800. Аналогично, в EnCodec из материала 30 секунд при 50 кадрах в секунду и 4 кодбуках дают 6000 токенов.'
  kind: numeric
  answer: 10800
  tolerance: 0.1
  id: 004-token-lm-2
  fingerprint: 6d127b91
- concept: Token LM генерирует музыку через условное авторегрессивное предсказание и декодирование токенов
  question: Расположите этапы условной генерации музыки с Token LM в правильном порядке.
  explanation: Условие направляет авторегрессивную модель, но её непосредственный результат — токены EnCodec. В слышимое аудио их превращает отдельный декодер кодека.
  kind: order
  items:
    - Преобразовать текст или мелодию в эмбеддинг условия
    - Авторегрессивно предсказать последовательность токенов кодека
    - Передать токены декодеру нейросетевого кодека
    - Получить звуковую волну
  id: 004-token-lm-3
  fingerprint: 0b42a8cf
