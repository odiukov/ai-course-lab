- concept: поиск короткого запрещённого имени по границам слов
  question: Заполни выражение для шаблона, который найдёт правило как отдельную фразу, но не внутри более длинного слова.
  explanation: Экранирование не даёт символам правила превратиться в части регулярного выражения, а проверки соседних символов ограничивают совпадение границами слов. Поэтому короткое имя не сработает внутри другого слова.
  kind: cloze
