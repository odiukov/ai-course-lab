- concept: возврат сработавшего правила для аудита фильтра промптов
  question: Какой результат функции проверки промпта наиболее полезен для журналирования и настройки слишком широких правил?
  explanation: Конкретное сработавшее правило объясняет причину блокировки и позволяет заметить частые ложные срабатывания. Простое логическое значение такой диагностической информации не содержит.
  kind: choice
  options:
    - 'Только логическое значение: заблокирован промпт или нет'
    - Сработавшее правило либо null при отсутствии совпадения
    - Нормализованный промпт без сведений о совпадении
    - Количество слов в исходном промпте
