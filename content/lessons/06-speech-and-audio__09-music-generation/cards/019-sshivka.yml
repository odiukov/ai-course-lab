- concept: комплементарные коэффициенты линейного кроссфейда имеют постоянную единичную сумму
  question: Заполни условие для комплементарных огибающих линейного кроссфейда.
  explanation: Пока коэффициент первого фрагмента плавно уменьшается, коэффициент второго увеличивается на ту же величину. Постоянная единичная сумма не добавляет к смеси общего скачка усиления.
