- concept: длительность результата кроссфейда равна сумме длительностей фрагментов за вычетом перекрытия
  question: Фрагмент A длится 27 секунд, фрагмент B — 26 секунд. Они перекрываются на 3 секунды. Какова длительность результата в секундах?
  explanation: 'Область перекрытия входит в оба исходных фрагмента, но в результате учитывается только один раз: 27 + 26 − 3 = 50 секунд.'
  kind: numeric
  answer: 50
