- concept: FAD вычисляется по распределениям аудиоэмбеддингов сгенерированной и реальной выборок
  question: Расположи этапы вычисления Fréchet Audio Distance в правильном порядке.
  explanation: FAD сравнивает не формы аудиоволн отдельных файлов, а статистики двух облаков эмбеддингов. Поэтому сначала нужны выборки и единый экстрактор признаков, затем оценки средних и ковариаций.
  kind: order
  items:
    - Собрать выборки сгенерированного и реального аудио
    - Получить эмбеддинги всех записей с помощью одной и той же аудиомодели
    - Оценить средние векторы и ковариационные матрицы двух наборов эмбеддингов
    - Вычислить расстояние Фреше между полученными распределениями
  id: 034-fad-idea-1
  fingerprint: 8b914df7
- concept: FAD нельзя содержательно оценить по одиночной паре аудиофайлов
  question: Исследователь вычислил FAD по одному сгенерированному треку и одной реальной записи. Почему такой результат нельзя использовать для оценки модели?
  explanation: Для FAD оценивают средние и ковариации эмбеддингов двух достаточно крупных выборок. Одиночная пара файлов не характеризует разнообразие результатов модели и реального аудио.
  kind: choice
  options:
    - Одиночные эмбеддинги не позволяют надёжно оценить распределения и их разброс
    - FAD применим только к аудио с одинаковой мелодией
    - Перед вычислением FAD треки обязательно нужно разделить на стемы
    - FAD определён только для записей одинаковой длительности
  correct: 0
