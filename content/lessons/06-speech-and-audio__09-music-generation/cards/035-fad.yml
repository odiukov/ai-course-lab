- concept: сближение стандартных отклонений уменьшает компоненту FAD, отвечающую за разброс
  question: Средние значения сгенерированной и референсной выборок совпадают, но стандартное отклонение генераций больше. Какое изменение уменьшит упрощённый FAD при неизменном среднем?
  explanation: При совпадающих средних остаётся слагаемое с квадратом разности стандартных отклонений. Оно уменьшается, когда разброс генераций приближается к разбросу референсов.
  kind: choice
  options:
    - Ещё сильнее увеличить стандартное отклонение генераций
    - Приблизить стандартное отклонение генераций к референсному
    - Переставить элементы генераций в другом порядке
    - Прибавить одинаковую константу к обеим выборкам
