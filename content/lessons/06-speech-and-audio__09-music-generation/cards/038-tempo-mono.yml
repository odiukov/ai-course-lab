- concept: копирование моносигнала в два канала не создаёт полноценную стереопанораму
  question: Почему простое дублирование моносигнала в левый и правый каналы не устраняет проблему монофонического выхода музыкальной модели и какая обработка подходит лучше?
  explanation: Формальное наличие левого и правого каналов ещё не означает стерео. Одинаковые каналы сохраняют моносовместимый центр без ширины и пространственных различий; их должна синтезировать специализированная реконструкция.
