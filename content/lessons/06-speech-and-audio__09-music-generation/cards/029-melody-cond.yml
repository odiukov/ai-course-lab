- concept: при мелодическом обусловливании хромаграмма задаёт высотный рисунок, а текстовый промпт — желаемый тембр
  question: Почему MusicGen-melody может превратить напетую мелодию в исполнение на рояле, сохранив узнаваемое движение нот, но не голос исполнителя?
  explanation: 'У модели есть два разных условия: хромаграмма ограничивает мелодию, а текст описывает звучание. Поскольку тембр голоса при построении хромаграммы отбрасывается, его можно заменить тембром указанного в промпте инструмента.'
