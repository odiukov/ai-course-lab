- concept: сжатое латентное представление снижает вычислительную стоимость диффузии аудио
  question: Почему системы латентной диффузии обычно удаляют шум в сжатом представлении аудио, а не непосредственно в звуковой волне?
  explanation: Сырая волна содержит десятки тысяч отсчётов в секунду. Сжатый латент намного компактнее, поэтому многократное применение диффузионной модели обходится дешевле; после очистки латент декодируется обратно в звук.
  kind: choice
  options:
    - Латент содержит меньше значений, поэтому итерации диффузии требуют меньше вычислений
    - Звуковая волна не может содержать случайный шум
    - Текстовый запрос можно применить только к дискретным токенам
    - Латент гарантирует наличие куплетов и припевов
