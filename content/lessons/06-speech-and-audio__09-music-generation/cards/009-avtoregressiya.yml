- concept: сгенерированное отклонение становится контекстом и может накапливаться на длинном горизонте
  question: Объясни своими словами, почему один неудачно выбранный токен способен повлиять на всю оставшуюся часть музыки в авторегрессивной модели.
  explanation: При генерации модель принимает собственные предыдущие ответы за данность. Из-за этого локальное отклонение меняет распределения следующих токенов, а накопление таких изменений помогает объяснить, почему MusicGen начинает терять связность на длинных фрагментах.
  kind: open
  reference: Выбранный токен добавляется в контекст и участвует в предсказании всех последующих токенов. Модель не возвращается для его исправления, поэтому вызванное им отклонение может поддерживаться и усиливаться по мере продолжения генерации.
