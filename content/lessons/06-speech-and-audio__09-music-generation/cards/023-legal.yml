  fingerprint: 0912591c
- concept: водяные знаки и метаданные обеспечивают раскрытие факта генерации музыки искусственным интеллектом
  question: Какой технический контроль помогает выполнить требование о маркировке музыки, созданной искусственным интеллектом?
  explanation: Водяные знаки и метаданные позволяют обозначить происхождение трека. Обработка громкости, частоты дискретизации или структуры микса не раскрывает слушателю факт ИИ-генерации.
  kind: choice
  options:
    - Добавлять водяные знаки и сведения о генерации в метаданные
    - Повышать частоту дискретизации готового аудио
    - Разделять композицию на отдельные стемы
    - Нормализовать громкость перед публикацией
  correct: 0
