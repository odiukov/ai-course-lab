- concept: временной зазор между окнами снижает ложные срабатывания из-за локальной музыкальной связности
  question: Метрика повторяемости музыкальных токенов ошибочно помечает множество соседних окон как зацикливание. Как лучше скорректировать алгоритм?
  explanation: Соседние фрагменты закономерно похожи из-за общего ритма, тональности и непрерывности композиции. Параметр min_gap исключает такие пары и позволяет искать повторы на достаточно далёком временном горизонте.
  kind: choice
  options:
    - Считать повтором любое частичное совпадение соседних окон
    - Сравнивать только окна, разделённые минимальным временным зазором
    - Удалить из последовательности все токены, встречающиеся несколько раз
  correct: 1
  id: 018-repetition-rate-1
  fingerprint: 8233fc7b
- concept: базовый кодбук лучше отражает музыкальную основу при поиске повторов
  question: Почему при поиске повторяющихся фрагментов многокодбуковой аудиопоследовательности полезно анализировать только базовый кодбук?
  explanation: Базовый кодбук несёт грубую структуру сигнала, а последующие слои уточняют тембр и другие детали. Эти вариации могут скрыть структурный повтор, поэтому для метрики зацикливания полезнее сравнивать основу.
  kind: choice
  options:
    - Остальные кодбуки содержат только сведения о длительности трека
    - Базовый кодбук гарантирует отсутствие припевов
    - Уточняющие кодбуки добавляют акустические детали, затрудняющие сравнение музыкальной основы
  correct: 2
  id: 018-repetition-rate-2
  fingerprint: 3ba9a667
- concept: порог отбраковки по повторяемости нужно калибровать на размеченных слухом генерациях
  question: Почему нельзя назначить универсальный порог repetition_rate для отбраковки музыкальных генераций без проверки на реальных треках?
  explanation: Repetition_rate фиксирует сходство токеновых фрагментов, но не понимает их музыкальную функцию. Поэтому границу брака калибруют на примерах, оценённых человеком, а не выбирают как универсальную константу.
  kind: open
  reference: Музыка содержит допустимые структурные повторы, например возвращение припева, которые метрика не отличает от нежелательного зацикливания. Порог следует подобрать по прослушанным примерам хороших и зациклившихся генераций для конкретной модели и жанра.
  id: 018-repetition-rate-3
  fingerprint: 1bfac191
