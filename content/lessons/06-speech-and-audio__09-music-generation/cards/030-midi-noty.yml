- concept: равные отношения частот соответствуют равным музыкальным интервалам
  question: Две пары нот находятся в разных регистрах, но отношение верхней частоты к нижней в обеих парах одинаково. Что можно сказать об интервалах между нотами в равномерной темперации?
  explanation: Разность номеров нот зависит от логарифма отношения частот. Поэтому одинаковое отношение частот означает одинаковое число полутонов независимо от регистра и тембра.
  kind: choice
  options:
    - Интервалы в полутонах одинаковы
    - У более высокой пары интервал больше
    - У более низкой пары интервал больше
    - Без сведений о тембре сравнить интервалы невозможно
