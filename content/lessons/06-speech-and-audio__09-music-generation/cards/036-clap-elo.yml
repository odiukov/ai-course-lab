- concept: CLAP оценивает соответствие сгенерированного аудио текстовому промпту
  question: Какой аспект музыкальной генерации непосредственно измеряет CLAP-оценка?
  explanation: 'CLAP сопоставляет текст и аудио в общем пространстве представлений: высокая оценка означает, что результат соответствует описанию. Распределительное сходство измеряет FAD, а музыкальность и структурные дефекты требуют человеческой оценки.'
  kind: choice
  options:
    - Смысловое соответствие аудио текстовому промпту
    - Сходство распределения генераций с распределением настоящей музыки
    - Отсутствие сбитых переходов и потери структуры
    - Предпочтение слушателей между конкурирующими моделями
  correct: 0
  id: 036-clap-elo-1
  fingerprint: 4ab3ae52
- concept: соответствие промпту не гарантирует субъективную музыкальность результата
  question: Почему высокой CLAP-оценки недостаточно, чтобы признать сгенерированный трек музыкально качественным?
  explanation: Трек может точно соответствовать жанру, настроению и инструментам из промпта, но оставаться монотонным или содержать музыкальные артефакты. Поэтому text-audio alignment и субъективная музыкальность — разные оси оценки.
  kind: open
  reference: CLAP проверяет соответствие аудио текстовому запросу, но не гарантирует развитие композиции, устойчивость структуры, естественность вокальных фраз или отсутствие неудачных переходов. Эти свойства нужно дополнительно оценивать на слух.
  id: 036-clap-elo-2
  fingerprint: 5c5255f4
