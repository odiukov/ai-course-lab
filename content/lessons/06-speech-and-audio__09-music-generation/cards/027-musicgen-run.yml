- concept: последовательность базового инференса MusicGen от загрузки модели до сохранения аудио
  question: Расположи действия в порядке, необходимом для генерации и сохранения трека с помощью MusicGen.
  explanation: Сначала создают модель и настраивают генерацию, затем получают аудиотензор из текстового промпта. Для записи через torchaudio тензор переносят на CPU и сохраняют с частотой 32000 Гц.
  kind: order
  items:
    - Загрузить предобученный чекпойнт MusicGen
    - Задать параметры генерации, включая длительность
    - Передать текстовое описание в метод generate
    - Перенести выбранный аудиотензор на CPU и сохранить его с нативной частотой дискретизации
