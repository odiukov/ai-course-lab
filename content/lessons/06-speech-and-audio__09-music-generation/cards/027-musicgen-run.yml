- concept: для быстрой проверки музыкального промпта рационально сначала использовать минимальный чекпойнт MusicGen
  question: Какой размер MusicGen разумно выбрать для первых итераций над новым промптом и почему?
  explanation: Small содержит 300 млн параметров и удобен для быстрых экспериментов. Medium на 1,5 млрд и large на 3,3 млрд параметров требуют больше ресурсов, поэтому их разумнее использовать после первичной проверки идеи.
  kind: open
  reference: 'Следует начать с musicgen-small: он быстрее генерирует и позволяет проверить, передаёт ли промпт нужный стиль. Более крупные варианты имеет смысл подключать после того, как формулировка промпта устоялась.'
