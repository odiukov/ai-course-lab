- concept: архитектура закрытой музыкальной модели остаётся гипотезой, если её выводят только по поведению системы
  question: У коммерческой модели генерации музыки закрыты веса и не опубликовано техническое описание. По результатам работы она напоминает гибрид авторегрессионного генератора и диффузионного вокодера. Как корректнее представить этот вывод?
  explanation: Поведение системы позволяет предполагать архитектуру, но не доказывает её. Для Suno, Udio и Lyria веса закрыты, поэтому описание авторегрессионной основы, диффузионного вокодера и специализированных голов следует считать гипотезой.
  kind: choice
  options:
    - Как доказанный факт об устройстве модели
    - Как обоснованную гипотезу, выведенную из наблюдаемого поведения
    - Как подтверждение того, что модель обучалась без нейросетевого кодека
    - Как точное восстановление всех компонентов модели
  correct: 1
  id: 014-hybrid-suno-1
  fingerprint: 90b48f94
- concept: в предполагаемой гибридной архитектуре авторегрессионная часть строит музыкальную структуру, а диффузионный вокодер синтезирует звук
  question: Расположите стадии предполагаемого гибридного тракта генерации музыки в правильном порядке.
  explanation: Предполагается, что авторегрессионная модель отвечает за последовательность и форму трека, а диффузионный вокодер — за качественный синтез звука из готового представления.
  kind: order
  items:
    - Авторегрессионная часть последовательно предсказывает токены нейросетевого кодека
    - Формируется завершённое токенное представление трека
    - Диффузионный вокодер преобразует представление в итоговую звуковую волну
  id: 014-hybrid-suno-2
  fingerprint: 9901c8bb
- concept: ELO музыкальной модели выражает сравнительные предпочтения участников слепых парных оценок
  question: Объясните своими словами, что можно и чего нельзя заключить из того, что ELO одной модели генерации музыки выше, чем у другой.
  explanation: Рейтинг Suno v5 в материале получен из слепых парных сравнений. Поэтому важна его позиция относительно других моделей, а не абсолютное значение само по себе.
  kind: open
  reference: Можно заключить, что в рамках данного набора слепых парных сравнений слушатели чаще предпочитали первую модель. Нельзя считать ELO абсолютной мерой качества, доказательством превосходства для любого жанра или указанием на конкретную архитектуру модели.
  id: 014-hybrid-suno-3
  fingerprint: b17a4533
