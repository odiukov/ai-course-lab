- concept: AudioLDM применяет латентную диффузию не только к музыке, но также к звуковым эффектам и речи
  question: Объясни своими словами, почему AudioLDM называют моделью text-to-audio, а не только генератором музыки.
  explanation: Семейство AudioLDM обобщает подход латентной диффузии на несколько классов звука. Текстовым условием можно описать музыкальный фрагмент, шум или эффект, а также речевое аудио.
  kind: open
  reference: 'AudioLDM получает текстовое описание и с помощью латентной диффузии может создавать разные виды аудио: музыку, звуковые эффекты и речь. Поэтому область её применения шире одной только музыкальной генерации.'
