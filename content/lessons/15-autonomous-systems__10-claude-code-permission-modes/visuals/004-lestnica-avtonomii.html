<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Лестница автономии от plan до bypassPermissions</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #f5f7fb;
      --text: #172033;
      --muted: #536078;
      --line: #38455e;
      --separator: #a8b1c2;
      --step-plan: #dce9f7;
      --step-default: #c5ddf1;
      --step-edits: #a9cee9;
      --step-auto: #88bbdd;
      --step-dont: #647fa8;
      --step-bypass: #b34f59;
      --step-dark-text: #172033;
      --step-light-text: #ffffff;
      --safe: #315f91;
      --danger: #9c3642;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #151922;
        --text: #eef2f8;
        --muted: #b6c0d1;
        --line: #d5dceb;
        --separator: #596274;
        --step-plan: #30445d;
        --step-default: #355575;
        --step-edits: #3b668a;
        --step-auto: #427ba1;
        --step-dont: #526d96;
        --step-bypass: #9d4650;
        --step-dark-text: #f5f8fc;
        --step-light-text: #ffffff;
        --safe: #8fc5f2;
        --danger: #ff9ca5;
      }
    }

    html,
    body {
      margin: unset;
      padding: unset;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      background: var(--background);
      overflow: hidden;
    }

    h1 {
      margin: unset;
      padding: unset;
      font-size: 20px;
      font-weight: bold;
      color: var(--text);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      background: var(--background);
    }

    text {
      font-family: inherit;
    }

    #fallback {
      margin: unset;
      padding: unset;
      font-size: 16px;
      color: var(--text);
    }
  </style>
</head>
<body>
  <main aria-labelledby="diagram-heading">
    <h1 id="diagram-heading">Лестница автономии: от plan до bypassPermissions</h1>

    <svg
      id="diagram"
      width="1200"
      height="440"
      viewBox="0 0 1200 440"
      role="img"
      aria-labelledby="diagram-heading diagram-description"
      preserveAspectRatio="xMidYMid meet"
    >
      <desc id="diagram-description">
        Шесть ступеней режимов разрешений. Чем выше ступень, тем больше
        решений передано агенту и тем больше действий проходит без просмотра
        пользователем. DontAsk и bypassPermissions оба не задают вопросов,
        но первый отклоняет неизвестное действие, а второй выполняет его.
      </desc>
      <g id="drawing"></g>
    </svg>

    <p id="fallback" hidden>
      Схема должна была показать лестницу из шести режимов: plan, default,
      acceptEdits, auto, dontAsk и bypassPermissions. Чем выше ступень, тем
      больше действий проходит без просмотра. DontAsk отклоняет неизвестное,
      а bypassPermissions выполняет всё.
    </p>
  </main>

  <script>
    const diagramData = [
      {
        role: "settings",
        origin: { x: 120, y: 325 },
        scale: 1,
        baseY: 0,
        axis: {
          x: 18,
          fromY: 0,
          toY: 292,
          head: [
            { x: 10, y: 278 },
            { x: 18, y: 292 },
            { x: 26, y: 278 }
          ],
          label: {
            x: -66,
            y: 145,
            rotation: -90,
            text: "Больше действий проходит без просмотра"
          }
        },
        outline: [
          { x: 46, y: 0 },
          { x: 46, y: 60 },
          { x: 196, y: 60 },
          { x: 196, y: 100 },
          { x: 346, y: 100 },
          { x: 346, y: 140 },
          { x: 496, y: 140 },
          { x: 496, y: 180 },
          { x: 646, y: 180 },
          { x: 646, y: 220 },
          { x: 796, y: 220 },
          { x: 796, y: 260 },
          { x: 946, y: 260 },
          { x: 946, y: 0 }
        ],
        separator: {
          fromX: 46,
          toX: 946,
          y: -28
        },
        legend: {
          intro: {
            x: 46,
            y: -55,
            text: "Оба режима молчат. При неопределённости:"
          },
          dontAsk: {
            x: 430,
            y: -55,
            mode: "dontAsk",
            result: "→ отклонить"
          },
          bypass: {
            x: 690,
            y: -55,
            mode: "bypassPermissions",
            result: "→ выполнить"
          },
          conclusion: {
            x: 46,
            y: -82,
            text: "Тишина одинакова — переданный контроль противоположен."
          }
        },
        labelPadding: 8,
        lineThickness: 2,
        outlineThickness: 3,
        titleFontSize: 16,
        compactTitleFontSize: 14,
        detailFontSize: 11,
        axisFontSize: 14,
        legendFontSize: 14,
        legendModeFontSize: 14
      },
      {
        role: "step",
        mode: "plan",
        detail: "план + просмотр",
        x: 46,
        width: 150,
        height: 60,
        modeY: 39,
        detailY: 17,
        color: "--step-plan",
        textColor: "--step-dark-text",
        modeFont: "title"
      },
      {
        role: "step",
        mode: "default (Manual)",
        detail: "опасное — по запросу",
        x: 196,
        width: 150,
        height: 100,
        modeY: 79,
        detailY: 57,
        color: "--step-default",
        textColor: "--step-dark-text",
        modeFont: "compact"
      },
      {
        role: "step",
        mode: "acceptEdits",
        detail: "запись — автоматически",
        x: 346,
        width: 150,
        height: 140,
        modeY: 119,
        detailY: 97,
        color: "--step-edits",
        textColor: "--step-dark-text",
        modeFont: "title"
      },
      {
        role: "step",
        mode: "auto",
        detail: "решает классификатор",
        x: 496,
        width: 150,
        height: 180,
        modeY: 159,
        detailY: 137,
        color: "--step-auto",
        textColor: "--step-dark-text",
        modeFont: "title"
      },
      {
        role: "step",
        mode: "dontAsk",
        detail: "неизвестное отклоняет",
        x: 646,
        width: 150,
        height: 220,
        modeY: 199,
        detailY: 177,
        color: "--step-dont",
        textColor: "--step-light-text",
        modeFont: "title"
      },
      {
        role: "step",
        mode: "bypassPermissions",
        detail: "разрешает всё",
        x: 796,
        width: 150,
        height: 260,
        modeY: 239,
        detailY: 217,
        color: "--step-bypass",
        textColor: "--step-light-text",
        modeFont: "compact"
      }
    ];

    const [settings, ...steps] = diagramData;
    const origin = Object.freeze(settings.origin);
    const scale = settings.scale;
    const sx = x => origin.x + x * scale;
    const sy = y => origin.y - y * scale;

    try {
      const svg = document.getElementById("diagram");
      const drawing = document.getElementById("drawing");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      const create = (name, attributes, text) => {
        const node = document.createElementNS(namespace, name);

        for (const [key, value] of Object.entries(attributes)) {
          node.setAttribute(key, String(value));
        }

        if (text !== undefined) {
          node.textContent = text;
        }

        return node;
      };

      const variable = name =>
        getComputedStyle(document.documentElement)
          .getPropertyValue(name)
          .trim();

      const axisLine = create("line", {
        x1: sx(settings.axis.x),
        y1: sy(settings.axis.fromY),
        x2: sx(settings.axis.x),
        y2: sy(settings.axis.toY),
        stroke: variable("--line"),
        "stroke-width": settings.lineThickness,
        "stroke-linecap": "round",
        "vector-effect": "non-scaling-stroke"
      });

      const axisHead = create("polygon", {
        points: settings.axis.head
          .map(point => `${sx(point.x)},${sy(point.y)}`)
          .join(" "),
        fill: variable("--line")
      });

      const axisLabelX = sx(settings.axis.label.x);
      const axisLabelY = sy(settings.axis.label.y);
      const axisLabel = create(
        "text",
        {
          x: axisLabelX,
          y: axisLabelY,
          fill: variable("--muted"),
          "font-size": settings.axisFontSize,
          "font-weight": "bold",
          "text-anchor": "middle",
          transform:
            `rotate(${settings.axis.label.rotation} ` +
            `${axisLabelX} ${axisLabelY})`
        },
        settings.axis.label.text
      );

      drawing.append(axisLine, axisHead, axisLabel);

      for (const step of steps) {
        const left = step.x;
        const right = step.x + step.width;
        const top = step.height;

        const block = create("path", {
          d:
            `M ${sx(left)} ${sy(settings.baseY)} ` +
            `L ${sx(left)} ${sy(top)} ` +
            `L ${sx(right)} ${sy(top)} ` +
            `L ${sx(right)} ${sy(settings.baseY)} Z`,
          fill: variable(step.color),
          stroke: variable("--background"),
          "stroke-width": settings.lineThickness,
          "stroke-linejoin": "round",
          "vector-effect": "non-scaling-stroke"
        });

        const centerX = step.x + step.width / scale / (scale + scale);
        const modeFontSize =
          step.modeFont === "compact"
            ? settings.compactTitleFontSize
            : settings.titleFontSize;

        const mode = create(
          "text",
          {
            x: sx(centerX),
            y: sy(step.modeY),
            fill: variable(step.textColor),
            "font-size": modeFontSize,
            "font-weight": "bold",
            "text-anchor": "middle",
            "dominant-baseline": "middle"
          },
          step.mode
        );

        const detail = create(
          "text",
          {
            x: sx(centerX),
            y: sy(step.detailY),
            fill: variable(step.textColor),
            "font-size": settings.detailFontSize,
            "text-anchor": "middle",
            "dominant-baseline": "middle"
          },
          step.detail
        );

        drawing.append(block, mode, detail);
      }

      let outlinePath = "";
      let outlineCommand = "M";

      for (const point of settings.outline) {
        outlinePath +=
          `${outlineCommand} ${sx(point.x)} ${sy(point.y)} `;
        outlineCommand = "L";
      }

      const outline = create("path", {
        d: outlinePath,
        fill: "none",
        stroke: variable("--line"),
        "stroke-width": settings.outlineThickness,
        "stroke-linejoin": "round",
        "stroke-linecap": "round",
        "vector-effect": "non-scaling-stroke"
      });

      const separator = create("line", {
        x1: sx(settings.separator.fromX),
        y1: sy(settings.separator.y),
        x2: sx(settings.separator.toX),
        y2: sy(settings.separator.y),
        stroke: variable("--separator"),
        "stroke-width": settings.lineThickness,
        "vector-effect": "non-scaling-stroke"
      });

      const legendIntro = create(
        "text",
        {
          x: sx(settings.legend.intro.x),
          y: sy(settings.legend.intro.y),
          fill: variable("--muted"),
          "font-size": settings.legendFontSize,
          "text-anchor": "start",
          "dominant-baseline": "middle"
        },
        settings.legend.intro.text
      );

      const dontAskMode = create(
        "text",
        {
          x: sx(settings.legend.dontAsk.x),
          y: sy(settings.legend.dontAsk.y),
          fill: variable("--safe"),
          "font-size": settings.legendModeFontSize,
          "font-weight": "bold",
          "text-anchor": "start",
          "dominant-baseline": "middle"
        },
        settings.legend.dontAsk.mode
      );

      const dontAskResult = create(
        "text",
        {
          x: sx(settings.legend.dontAsk.x + 82),
          y: sy(settings.legend.dontAsk.y),
          fill: variable("--text"),
          "font-size": settings.legendFontSize,
          "text-anchor": "start",
          "dominant-baseline": "middle"
        },
        settings.legend.dontAsk.result
      );

      const bypassMode = create(
        "text",
        {
          x: sx(settings.legend.bypass.x),
          y: sy(settings.legend.bypass.y),
          fill: variable("--danger"),
          "font-size": settings.legendModeFontSize,
          "font-weight": "bold",
          "text-anchor": "start",
          "dominant-baseline": "middle"
        },
        settings.legend.bypass.mode
      );

      const bypassResult = create(
        "text",
        {
          x: sx(settings.legend.bypass.x + 146),
          y: sy(settings.legend.bypass.y),
          fill: variable("--text"),
          "font-size": settings.legendFontSize,
          "text-anchor": "start",
          "dominant-baseline": "middle"
        },
        settings.legend.bypass.result
      );

      const conclusion = create(
        "text",
        {
          x: sx(settings.legend.conclusion.x),
          y: sy(settings.legend.conclusion.y),
          fill: variable("--text"),
          "font-size": settings.legendFontSize,
          "font-weight": "bold",
          "text-anchor": "start",
          "dominant-baseline": "middle"
        },
        settings.legend.conclusion.text
      );

      drawing.append(
        outline,
        separator,
        legendIntro,
        dontAskMode,
        dontAskResult,
        bypassMode,
        bypassResult,
        conclusion
      );

      fallback.hidden = true;
    } catch (error) {
      document.getElementById("diagram").hidden = true;
      document.getElementById("fallback").hidden = false;
    }
  </script>
</body>
</html>
