- concept: подготовка фонового прогона идёт от сокращения среды к бюджетам и только затем к повышению автономии
  question: Расставьте подготовку автономного фонового прогона в правильном порядке.
  explanation: 'Автономию назначают последней, потому что она осмысленна только относительно уже посчитанного радиуса поражения: пока в рабочей области видны ключи доступа, никакой режим не делает прогон безопасным. Сначала инвентарь доступов, затем бюджеты, потом решение о том, сколько подтверждений снимать.'
  kind: order
  items:
    - 'Свести доступную среду к минимуму: нужные каталоги смонтированы, учётные данные и продовые подключения убраны'
    - 'Задать пределы прогона: ходы, вызовы инструментов, расходы'
    - Выбрать уровень автономии режима под самый рискованный класс действий задачи
