- concept: режим, лишённый исхода «спросить», вынужден отображать неопределённость в отказ
  question: Режим, который никогда не задаёт вопросов, встречает действие, не покрытое ни одним правилом. Объясни своими словами, какое базовое решение он обязан дать и почему у него нет третьего варианта.
  explanation: 'Отсюда и назначение таких режимов: одноразовые песочницы, задачи в CI, скрипты — где нет человека, способного ответить на вопрос, и заранее известно, что разрешено.'
  kind: open
  reference: 'Его таблица базовых решений не содержит исхода «спросить», значит непокрытому действию остаются только «разрешить» или «отклонить». Разрешение по умолчанию превратило бы отсутствие правила в полный доступ — любое действие, о котором автор настроек не подумал, прошло бы без проверки. Поэтому неопределённость отображается в отказ: режим ничего не сделает, если правила не заданы, и расширяется только явным добавлением разрешений.'
  id: 018-rezhim-kak-politika-3
  fingerprint: 580d4b7e
