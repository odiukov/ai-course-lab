- concept: базовое решение режима применяется только там, где явное правило не дало более точного исхода
  question: Слово «базовое» в выражении «базовое решение режима» означает, что это решение...
  explanation: Режим задаёт фон для целых категорий действий, явные правила — точечные уточнения поверх него. Если бы базовое решение было неизменяемым, правила были бы бессмысленны; если бы они проверялись после выполнения, проверка не защищала бы ни от чего.
  kind: choice
  options:
    - применяется, когда более точное явное правило не покрыло действие
    - 'нельзя изменить никакими правилами: оно окончательное'
    - применяется первым, а правила проверяются только после выполнения действия
    - действует лишь в начале сессии, пока агент не выполнил первое действие
