- concept: «Manual» в `default` означает ручной контроль опасных точек, а не подтверждение каждого шага
  question: Режим `default` подписан в интерфейсе как «Manual». Что именно подтверждается вручную?
  explanation: 'Название вводит в заблуждение: обычную работу агент ведёт сам и обращается к человеку лишь на точках повышенного риска. Это контроль опасных развилок, а не пошаговое одобрение всего подряд.'
  kind: choice
  options:
    - Каждый шаг агента, включая чтение файлов
    - 'Только опасные действия: запуск команд, обращения к сети, разрушительные операции'
    - Только правки файлов, а команды выполняются свободно
  correct: 1
  id: 005-plan-default-2
  fingerprint: abb76ff6
- concept: выбор между plan и default определяется тем, что вызывает сомнение — маршрут работы или отдельные рискованные шаги
  question: Ты впервые запускаешь агента на чужом репозитории рядом с боевым кодом и не уверен даже в направлении работы. Какой режим брать?
  explanation: '`plan` проверяет намерение заранее, `default` — риск по ходу работы. Если неясен маршрут, ловить его на отдельных опасных командах поздно: агент уже пойдёт не туда, просто безопасными шагами.'
  kind: choice
  options:
    - '`plan`: сомнение вызывает сам маршрут, его нужно проверить до первых действий'
    - '`acceptEdits`: правки всё равно придётся вносить во многих файлах'
    - '`dontAsk`: он ничего не спрашивает и просто отклоняет лишнее'
  correct: 0
