- concept: 'источник решения различается: в auto судит классификатор по соответствию запросу, в dontAsk — заранее записанные правила'
  question: 'Два режима не показывают пользователю ни одного запроса подтверждения: в одном каждое действие оценивает модель-классификатор, в другом всё сверяется со списком заранее заданных разрешений. Объясни, чем отличается источник решения и как это меняет подготовку к запуску.'
  explanation: 'Оба режима молчат, но по разным причинам: один опирается на суждение модели во время работы, другой — на статический список, составленный человеком заранее.'
  kind: open
  reference: 'В `auto` решение принимает модель-классификатор в момент запуска действия: она сопоставляет действие с запросом пользователя и блокирует выход за его рамки. Правила заранее писать не нужно, но и предсказать вердикт заранее нельзя — он зависит от формулировки запроса. В `dontAsk` решение полностью зафиксировано до старта: выполняется только то, что разрешено правилами, всё остальное отклоняется. Значит, подготовка ложится на человека — не описал нужное действие заранее, и агент просто ничего не сделает. Первый режим гибче и не требует настройки, второй предсказуем и повторяем, потому и годится для CI и одноразовых песочниц.'
  id: 008-ostavshiesya-rezhimy-2
