- concept: специфичность правила измеряется шириной множества подходящих действий, а не длиной записи
  question: 'Три правила совпали с одним действием: `Bash(docker:*)`, `Bash(docker compose up --detach --build)` и `Bash(docker compose:*)`. Какое из них самое специфичное?'
  explanation: 'Специфичность — размер множества, которое правило покрывает. Точная команда покрывает один случай, `docker compose:*` — подмножество, `docker:*` — самое широкое. Длина текста тут ни при чём: она лишь коррелирует с сужением.'
  kind: choice
  options:
    - '`Bash(docker:*)` — оно записано короче всего, значит проще'
    - '`Bash(docker compose up --detach --build)` — под него подходит ровно одна команда'
    - '`Bash(docker compose:*)` — оно посередине и потому надёжнее'
    - 'Все три равны: они совпали с одним и тем же действием'
  correct: 1
  id: 014-specificity-1
  fingerprint: 22bdf5b4
- concept: правила упорядочиваются от самого широкого охвата к самому узкому
  question: Расставь правила от наименее специфичного к наиболее специфичному.
  explanation: Каждый следующий уровень добавляет буквальное условие и отсекает часть предыдущего множества. Порядок нужен, чтобы при нескольких совпадениях выбрать правило, описывающее ситуацию точнее всего.
  kind: order
  items:
    - правило без указания инструмента — совпадает с любым действием
    - '`Bash` без ограничения — любая команда оболочки'
    - '`Bash(pytest:*)` — команды, начинающиеся с pytest'
    - '`Bash(pytest tests/api/test_auth.py)` — одна конкретная команда'
  id: 014-specificity-2
  fingerprint: e1c820f2
- concept: специфичность и решение политики — независимые характеристики правила
  question: Более специфичное правило совпало с действием и содержит решение `deny`, менее специфичное — `allow`. Объясни своими словами, почему высокая специфичность правила сама по себе не говорит, разрешено действие или нет.
  explanation: 'Смешение двух слоёв — частая ошибка: люди подсознательно считают, что «уточнение = запрет». На практике уточняющее правило часто именно разрешает узкий случай в широком запрете.'
  kind: open
  reference: 'Специфичность отвечает на вопрос «насколько узко правило описывает действие», решение — на вопрос «что делать при совпадении». Это два независимых поля: узкое правило может как разрешать (точечное исключение из общего запрета), так и запрещать (точечный запрет внутри общего разрешения). Поэтому сначала выбирают, какое правило релевантнее, и лишь потом читают записанное в нём решение.'
  id: 014-specificity-3
  fingerprint: 885fec99
