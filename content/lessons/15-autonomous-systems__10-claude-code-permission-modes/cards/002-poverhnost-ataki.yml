- concept: поверхность атаки — всё, с чем агент технически способен взаимодействовать, а не то, что упомянуто в задаче
  question: Агенту поручили найти причину падения одного теста. Что составляет поверхность атаки этой сессии?
  explanation: 'Поверхность атаки считается по возможностям, а не по намерениям: файловая система, сеть, переменные окружения с ключами, буфер обмена, вкладки браузера, открытые терминалы. Фактически затронутые файлы — подмножество, известное только постфактум.'
  kind: choice
  options:
    - Только те файлы, которые агент фактически открыл в ходе работы
    - Только каталог проекта, потому что задача сформулирована про него
    - Всё, что агент технически способен прочитать, изменить, запустить или передать доступными ему инструментами
  correct: 2
  id: 002-poverhnost-ataki-1
  fingerprint: 320eda55
- concept: формулировка запроса не создаёт технической границы доступа — границу задают права и режим разрешений
  question: 'Разработчик пишет агенту: «работай только внутри каталога проекта». Что это даёт технически?'
  explanation: Границы запроса и границы возможностей — разные вещи. Запущенная агентом команда может обратиться к домашней папке или переменным окружения независимо от того, как красиво сформулировано поручение. Стену вокруг проекта строят права и режим, а не предложение в промпте.
  kind: choice
  options:
    - 'Жёсткое ограничение файловой системы: выход за каталог станет невозможен'
    - 'Ничего на уровне доступа: граница задаётся правами процесса и режимом разрешений, а текст просьбы лишь описывает желаемый результат'
    - Автоматический запрет сетевых вызовов и обращений к ключам
  correct: 1
  id: 002-poverhnost-ataki-2
  fingerprint: 5b24c1f1
