- concept: 'полнота каскада ограничена сверху первой ступенью: пропущенное дешёвым фильтром до дорогой проверки не доходит'
  question: Дорогой проверяющий второй ступени безошибочно распознаёт опасные действия. Почему каскад в целом всё равно может их пропустить?
  explanation: 'Каскад — последовательный фильтр: то, что первая ступень пропустила как безобидное, до второй не доходит. Поэтому качество каскада оценивают по промахам дешёвого фильтра, а не только по пойманным случаям.'
  kind: choice
  options:
    - Вторая ступень получает только то, что отметила первая, поэтому её ошибки пропуска исправить некому
    - Вторая ступень видит действия в другом порядке и теряет контекст
    - Дорогая проверка отключается, когда бюджет сессии израсходован
    - Вторая ступень выносит решение медленнее, чем действие успевает выполниться
