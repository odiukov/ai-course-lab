- concept: 'порядок обработки действия в каскаде: дешёвый отбор, затем условный дорогой разбор'
  question: Расставьте шаги обработки одного предложенного действия в двухступенчатом каскаде проверки.
  explanation: 'Порядок задаёт экономику схемы: дорогой шаг выполняется условно, только после срабатывания дешёвого. Если поменять ступени местами, каскад перестанет экономить вычисления.'
  kind: order
  items:
    - Предложенное действие поступает на вход каскада
    - Дешёвое правило по ключевым словам ищет подозрительный сигнал
    - При отсутствии сигнала действие пропускается без дорогого анализа
    - При наличии сигнала действие передаётся медленному проверяющему с расширенным набором правил
    - Проверяющий выносит итоговое решение по действию
