- concept: незаметная инъекция меняет поведение, не порождая ни одного помеченного действия, поэтому детектор по форме действия слеп к ней
  question: Почему проверка, работающая по форме предложенного действия, не ловит тонкий prompt injection?
  explanation: Детектор ищет отпечаток на действии. Если воздействие сдвигает выбор агента внутри полностью разрешённых операций — какой файл прочитать, что записать, — отпечатка нет, и помечать нечего.
  kind: choice
  options:
    - Потому что такое воздействие всегда приходит из зашифрованных источников
    - Потому что оно меняет поведение агента, не породив ни одного действия опасного вида
    - Потому что проверка отключается на длинных сессиях
    - Потому что оно срабатывает только после превышения бюджета сессии
