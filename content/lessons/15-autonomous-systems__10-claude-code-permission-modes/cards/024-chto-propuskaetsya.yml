- concept: косвенный prompt injection — остаточный риск, который не закрывается детекцией до конца, поэтому опираются на ограничение последствий
  question: Косвенный prompt injection считают уязвимостью, которую нельзя закрыть до конца. Объясни своими словами, какой практический вывод из этого следует для настройки агента.
  explanation: Это тот случай, когда правильный ответ — не более умный детектор, а меньший радиус ущерба. Режим разрешений и окружение исполнения работают именно с последствиями, поэтому они дополняют классификатор, а не дублируют его.
  kind: open
  reference: 'Раз детекция принципиально неполна, нельзя строить безопасность на надежде поймать все инъекции. Вывод — ограничивать последствия: сужать окружение и права, в которых работает агент, отделять доступ к чувствительным данным от каналов наружу, требовать подтверждения на выходящих наружу действиях и держать бюджеты как предохранитель. Детекция остаётся полезной, но становится одним слоем, а не единственным.'
