- concept: 'слои итоговой политики отвечают на разные вопросы: допустимо ли действие, сколько таких шагов позволено и до чего агент вообще способен дотянуться'
  question: Режим, явные правила и классификатор проверили очередное действие и разрешили его. На какой вопрос эти механизмы в принципе не отвечают?
