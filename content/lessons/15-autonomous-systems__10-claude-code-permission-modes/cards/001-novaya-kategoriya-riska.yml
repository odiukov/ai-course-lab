- concept: ущерб от агента не требует злого умысла — хватает слишком широкого толкования задачи и продолжения работы после неожиданного результата
  question: Объясни своими словами, почему автономный агент может нанести реальный ущерб, даже если честно пытается выполнить поручение.
  explanation: 'Модель угроз здесь не «злонамеренный ИИ», а обычное непонимание, помноженное на права и скорость. Отсюда и вопрос безопасности: не «насколько умён агент», а «какие действия он может совершить без моего решения».'
  kind: open
  reference: 'Агенту не нужно «хотеть навредить». Достаточно неверно понять цель, истолковать задачу шире, чем имелось в виду, или продолжить цепочку после неожиданного промежуточного результата. Опасность даёт комбинация трёх свойств: самостоятельность (агент сам выбирает следующий шаг), реальные полномочия (он выполняет команды, а не советует) и скорость (десятки связанных действий быстрее, чем человек успевает проверить замысел каждого). Поэтому цена одной неточной формулировки — не неверный совет, а цепочка выполненных действий.'
  id: 001-novaya-kategoriya-riska-2
