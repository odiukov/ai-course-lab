- concept: тестовая траектория обязана содержать случаи, которые проверка пропускает, иначе прогон не измеряет границу её возможностей
  question: Вы собираете короткую синтетическую траекторию для проверки классификатора действий. Почему в неё специально включают случаи, которые классификатор, как известно заранее, не поймает?
  explanation: Смысл фикстуры — измерять, а не демонстрировать. Поймано целевое и пропущено целевое — два разных числа, и второе прямо определяет, какие внешние ограничения обязательны в конфигурации прогона.
  kind: open
  reference: 'Прогон, где всё поймано, не отличим от прогона, где нечего было ловить: он показывает работоспособность кода, но не границу возможностей проверки. Заранее размеченные пропуски дают вторую половину картины — где именно защита слепа, и, значит, какой риск придётся закрывать другими средствами (бюджетами на ходы и вызовы, изоляцией среды, ограничением доступов). Без таких случаев легко принять отсутствие срабатываний за отсутствие угроз и оставить остаточный риск незакрытым.'
