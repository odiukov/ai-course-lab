- concept: режим подбирают под самый строгий класс действий, который встретится в задаче, а не под её объём
  question: 'Задача: переименовать функцию в 40 файлах и после каждого пакета правок прогонять тесты. Объясни своими словами, по какому признаку подбирать режим, и чего ты добьёшься выбором acceptEdits.'
  explanation: 'Объём работы (40 файлов) не меняет политику: политика реагирует на классы действий. Правильный ход — перечислить классы, которые задача затронет, и выбрать режим по самому строгому из них.'
  kind: open
  reference: 'Режим выбирают по составу действий задачи, а не по её длине. В задаче два класса действий: запись файлов и запуск команд. acceptEdits снимет подтверждения только с первого класса, поэтому прогон тестов всё равно будет останавливаться на вопросе — количество вопросов упадёт, но сессия не станет автономной. Если нужен проход без пауз, требуется режим, который решает и про команды (auto с классификатором или dontAsk с заранее заданным правилом на запуск тестов).'
