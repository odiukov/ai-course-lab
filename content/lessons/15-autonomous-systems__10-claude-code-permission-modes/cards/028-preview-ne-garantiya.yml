- concept: статус research preview означает, что классификатор — один слой защиты, и строить на нём единственную точку отказа нельзя
  question: 'Команда включила auto и не добавила больше ничего: без бюджетов, без белых списков, без изолированной рабочей области, без разбора траекторий. Какая ошибка допущена?'
  explanation: 'Research preview прямо описывает классификатор как слой, а не решение, и перечисляет спутников: бюджеты, белые списки, изолированные рабочие области, разбор траекторий. Каждая мера ловит свой тип промаха; без них правильный вопрос «что остановит агента, когда оценка окажется неверной» остаётся без ответа.'
  kind: choice
  options:
    - 'Никакой: классификатор проверяет каждое действие до запуска, чего достаточно'
    - Классификатор стал единственной точкой отказа — его ошибку ничто не перехватывает и ничто не ограничивает её последствия
    - Ошибка в том, что бюджеты обязательны технически и сессия не стартует
    - Ошибка только в отсутствии разбора траекторий, остальные меры дублируют классификатор
  correct: 1
