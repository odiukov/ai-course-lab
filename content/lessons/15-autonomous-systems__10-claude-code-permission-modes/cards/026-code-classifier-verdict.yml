- concept: корректность каскада проверяется не только вердиктом, но и фактом вызова дорогой ступени
  question: Реализация всегда вызывает обе ступени и возвращает решение второй. На синтетической траектории вердикты совпадают с ожидаемыми. Почему такая реализация всё равно считается неверной?
  explanation: Экономия каскада существует только благодаря пропуску дорогой ступени. Поэтому проверка смотрит на побочный эффект — был ли вызван глубокий проверяющий, — а не только на итоговую строку вердикта.
  kind: choice
  options:
    - Вторая ступень не умеет обрабатывать безопасные действия
    - 'Нарушен смысл каскада: дорогая проверка выполняется на всём потоке, а не на отобранной части, и тест это фиксирует'
    - Вердикт второй ступени всегда строже, поэтому безопасные действия будут отклонены
    - Порядок ступеней перестал соблюдаться
