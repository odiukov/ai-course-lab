- concept: полярность булева результата вспомогательной функции берётся из её контракта, а не угадывается по имени
  question: 'Вспомогательная функция первой ступени возвращает `True`. По документации это означает «обнаружен подозрительный признак». Разработчик прочитал `True` как «разрешить» и написал `if flagged: return "allow"`. Что произойдёт?'
  explanation: 'Инверсия полярности не ломает выполнение — она молча выворачивает политику наизнанку: помеченное действие получает разрешение, а безобидное отправляется на дорогой разбор. Такие ошибки не ловятся типами, только чтением контракта и примеров вызова.'
  kind: choice
  options:
    - 'Ничего страшного: обе ступени всё равно вернут одинаковый вердикт'
    - 'Ветви поменяются местами: подозрительные действия пройдут без проверки, а обычные уйдут в дорогую ступень'
    - Функция начнёт падать с исключением на первом же действии
