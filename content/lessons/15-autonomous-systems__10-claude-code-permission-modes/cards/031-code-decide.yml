- concept: слой, способный только запрещать, применяется после слоёв, способных разрешать — иначе его вето теряется
  question: Функция политики агента складывается из слоёв. Один слой умеет и разрешать, и запрещать действие, другой умеет только запрещать (когда исчерпан лимит). В каком порядке их применяют, чтобы ограничение работало?
  explanation: Слой с правом только запрещать не выносит разрешений, поэтому он обязан стоять после разрешающих и иметь право вето. Если поставить его первым или объединять решения через ИЛИ, исчерпанный лимит перестанет останавливать действие и превратится в декоративную цифру.
  kind: choice
  options:
    - 'Сначала ограничивающий слой: если лимит не исчерпан, он сразу разрешает действие'
    - Ограничивающий слой применяют последним, и его запрет перекрывает любое разрешение предыдущих слоёв
    - 'Порядок не важен: результаты слоёв объединяются как логическое ИЛИ разрешений'
  correct: 1
  id: 031-code-decide-1
  fingerprint: 8e24b2c5
- concept: при разборе явных правил в решении участвуют только правила максимальной специфичности, менее конкретные совпадения отбрасываются целиком
  question: 'Действию соответствуют четыре правила: два широких и два узких (все четыре совпали). Узкие одинаково конкретны, но дают разные решения. Как политика получает один исход?'
  explanation: Менее конкретные совпадения вытесняются более конкретными и в итог не входят вовсе. Конфликт остаётся только внутри группы с максимальной специфичностью, и там его сводят к одному исходу по строгости, а не по позиции в файле.
  kind: choice
  options:
    - Объединяет решения всех четырёх совпавших правил
    - Оставляет только два самых конкретных правила и объединяет их решения по строгости
    - Берёт то правило, которое записано в настройках раньше остальных
  correct: 1
