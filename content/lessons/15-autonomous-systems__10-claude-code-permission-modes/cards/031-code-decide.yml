- concept: единая точка политики делегирует классификацию и разбор правил помощникам, а не переписывает их логику внутри себя
  question: Почему функция, выносящая итоговое решение о действии, не должна сама определять класс риска и сама разбирать строки правил, хотя код там короткий?
  explanation: 'Разделение обязанностей здесь не стилистика: дубль классификации даёт расхождение решений, которое не видно ни в тестах классификатора, ни в тестах правил. Итоговая функция проверяется на композиции — что вето бюджета срабатывает, что классификатор дергается только там, где нужен, что ветка без совпавших правил падает на базовое решение режима.'
  kind: open
  reference: 'Классификация действия и разбор правил — отдельные функции с собственными контрактами и тестами. Если продублировать их логику внутри итоговой функции, появятся два независимых источника истины: правка в одной копии не доедет до другой, и одно и то же действие получит разные классы или разные совпадения в зависимости от того, кто его оценивал. Итоговая функция отвечает только за композицию: получить класс, получить базовое решение режима, отобрать и объединить правила, при необходимости запросить классификатор, применить бюджеты. Так её ошибки локализуются в порядке слоёв, а ошибки классификации — в своей функции.'
  id: 031-code-decide-3
  fingerprint: fd30a80d
