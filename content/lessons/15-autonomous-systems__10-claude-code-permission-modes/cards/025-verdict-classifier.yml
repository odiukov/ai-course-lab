- concept: 'срабатывание дешёвой ступени — это направление на проверку, а не итоговый запрет: вердикт выносит вторая ступень'
  question: 'Двухступенчатая проверка действий агента: дешёвый фильтр по ключевым словам, затем медленный проверяющий с правилами. Фильтр пометил команду удаления файла как подозрительную. Что означает эта пометка для итогового вердикта?'
  explanation: 'Первая ступень отвечает не «опасно ли», а «нужна ли дорогая проверка». Запрет по одному ключевому слову блокировал бы удаление файла из каталога сборки, который восстанавливается сборкой заново. Голосования тоже нет: если фильтр молчит, второй ступени просто не существует в этом прогоне.'
  kind: choice
  options:
    - Действие уже отклонено; вторая ступень лишь оформляет отказ
    - Действие направлено на глубокую проверку, и итоговое решение вынесет она — вплоть до разрешения
    - Действие разрешено, а пометка попадает только в журнал
    - Итоговый вердикт складывается голосованием обеих ступеней поровну
  correct: 1
  id: 025-verdict-classifier-1
  fingerprint: 820a3662
- concept: двухступенчатый конвейер — учебная модель; реальный режим auto опирается на отдельную модель-классификатор без задокументированного двухступенчатого контракта
  question: Учебный код показывает проверку действий как конвейер «фильтр по ключевым словам → проверяющий с правилами». Как это соотносится с реальным режимом auto?
  explanation: Конвейер выбран ради наглядности цены проверки. Реальный auto держится на отдельной модели-классификаторе, которая сверяет предложенное действие с задачей и состоянием сессии; внутренняя раскладка на ступени не является публичным контрактом, и полагаться на неё в рассуждениях о безопасности нельзя.
  kind: choice
  options:
    - Это точная копия контракта auto, включая порядок ступеней и их состав
    - 'Это упрощение: в auto решение принимает отдельная модель-классификатор, а двухступенчатый контракт не задокументирован'
    - В auto ступеней больше, но каждая по-прежнему работает по списку ключевых слов
    - В auto первая ступень выполняется на стороне пользователя, вторая — на сервере
  correct: 1
  id: 025-verdict-classifier-2
  fingerprint: 4db4ed8a
- concept: фильтр по ключевым словам не видит параметров и соседних действий, поэтому его сигнал требует уточнения более дорогой проверкой
  question: Почему сигнал ступени с проверкой по ключевым словам нельзя сделать окончательным вердиктом? Объясни своими словами, чего этой ступени не хватает.
  explanation: Дешёвая ступень оптимизирована под скорость, а не под точность. Она полезна как маршрутизатор нагрузки, но как единственный судья даёт и лишние блокировки, и пропуски.
  kind: open
  reference: 'Ключевые слова видят только форму действия — сам глагол или подстроку. Они не различают путь, окружение и роль действия в траектории: удаление файла в каталоге сборки и удаление каталога с ключами доступа выглядят одинаково. Более дорогая ступень смотрит на параметры действия, правила и соседние действия и потому может как подтвердить тревогу, так и снять её. Отсюда две ошибки грубого фильтра: ложные тревоги на безобидных операциях и пропуск опасного действия, сформулированного без тревожных слов.'
  id: 025-verdict-classifier-3
