  question: Отправка изменений в удалённый репозиторий должна выполняться только после явного подтверждения человеком. В какую секцию настроек Claude Code попадает описание этого действия?
  explanation: 'В настройках решение политики выражается тем, в каком разделе лежит описание действия: `allow` — выполнить без вопроса, `ask` — остановиться и запросить подтверждение, `deny` — не выполнять. Требование «сначала спроси человека» — это ровно `ask`.'
