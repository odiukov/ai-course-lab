- concept: разные бюджетные пределы ловят разные виды разгона, поэтому один не заменяет остальные
  question: Агент уложился в лимит итераций и не приблизился к потолку в 7 долларов, но сделал 15 обращений к `WebFetch` при лимите 15. Что это показывает про устройство бюджетов?
  explanation: 'Пределы независимы: можно потратить весь денежный бюджет на длинном рассуждении почти без вызовов инструментов, а можно засыпать сеть запросами за копейки и за несколько итераций. Поэтому потолки ставят по всем трём осям — итерации, деньги, вызовы конкретного инструмента.'
  kind: choice
  options:
    - 'Лимит инструмента избыточен: денежный потолок остановил бы агента раньше'
    - Каждый предел считает свой ресурс, и разгон по одному из них не виден остальным
    - Сработавший лимит инструмента означает, что действия были опасными
    - Лимиты должны быть согласованы так, чтобы всегда срабатывать одновременно
