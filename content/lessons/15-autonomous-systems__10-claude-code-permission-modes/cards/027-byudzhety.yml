- concept: срабатывание или несрабатывание лимита ничего не говорит о качестве и безопасности работы
  question: Одна сессия завершилась, не достигнув ни одного лимита; другая была прервана по денежному потолку. Что из этого следует про качество их работы? Ответь своими словами.
  explanation: 'Путаница между «остановлен» и «вёл себя плохо» приводит к неверным выводам: люди поднимают потолки, чтобы «не мешали», и теряют единственный предохранитель против бесконечной корректной работы.'
  kind: open
  reference: 'Ничего. Лимит — счётчик расхода, а не оценка результата и не оценка риска. Уложившаяся в бюджет сессия могла сделать неверную или вредную правку; прерванная сессия могла честно и корректно исследовать задачу, просто дорого. Вопрос, на который отвечают бюджеты, другой: сколько ресурсов вы готовы отдать одной попытке. Смысловую оценку действия даёт классификатор, а границы последствий — изоляция.'
