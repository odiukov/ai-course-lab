- concept: агент действует ровно с теми правами, что и учётная запись пользователя, из-под которой он запущен
  question: Агент запущен из обычной пользовательской сессии на рабочем ноутбуке. Какие права у команд, которые он выполняет?
  explanation: 'Никакого отдельного пониженного профиля у агента нет: он наследует права запустившего его пользователя. Разница только в темпе — человек не выполнит сотни команд за секунды, а агент выполнит.'
  kind: choice
  options:
    - 'Урезанные права песочницы: по умолчанию доступен только текущий каталог'
    - 'Ровно те же, что у самого пользователя: всё, до чего дотягивается его учётная запись'
    - Права только на чтение, пока пользователь явно не выдаст права на запись
  correct: 1
  id: 003-proverka-prav-1
  fingerprint: a521225d
- concept: радиус ущерба задаётся окружением исполнения, поэтому одинаковая просьба на разных машинах имеет разный риск
  question: Одна и та же просьба «прогони тесты» выполняется на чистой учебной машине и на рабочем ноутбуке с загруженными ключами доступа и открытыми сессиями к боевым сервисам. Что различается?
  explanation: Риск — это не свойство текста задачи, а свойство пары «задача + окружение». Один и тот же неудачный шаг на пустой машине стоит перезапуска, а рядом с ключами и продовыми сессиями — инцидента.
  kind: choice
  options:
    - Сложность самой задачи для агента
    - 'Радиус возможного ущерба: окружение определяет, каких ресурсов может коснуться ошибка'
    - 'Ничего не различается: риск задаётся формулировкой поручения'
  correct: 1
  id: 003-proverka-prav-2
  fingerprint: 2020eea0
