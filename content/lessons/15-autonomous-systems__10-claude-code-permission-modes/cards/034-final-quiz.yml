- concept: предел прогона выводится расчётом из темпа шагов и средней цены шага, а не назначается на глаз
  question: Прогон без присмотра планируется на 8 часов, агент делает примерно один шаг раз в 40 секунд, средняя стоимость шага — 6 центов. Какой потолок расходов в долларах нужен, чтобы предел не оборвал прогон раньше срока?
  explanation: '8 часов при шаге раз в 40 секунд дают 8·3600/40 = 720 шагов, а 720·0.06 ≈ 43.2 доллара. Порядок расчёта тот же для любого предела: сначала оцениваешь темп и длительность, потом ставишь число. Поставить потолок ниже расчёта — сознательное решение оборвать прогон на середине, и это должно быть выбором, а не случайностью.'
  kind: numeric
  answer: 43.2
  tolerance: 1
