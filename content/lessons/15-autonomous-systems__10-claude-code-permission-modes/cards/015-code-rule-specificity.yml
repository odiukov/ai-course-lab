- concept: оценка специфичности должна давать устойчивый порядок, а не конкретные «правильные» числа
  question: Одна реализация возвращает оценки 0/1/2, другая 0/10/200 для тех же трёх уровней уточнения. Обе проходят тесты. Почему?
  explanation: 'Функция нужна как ключ сортировки. Значение имеет только монотонность: более узкое правило получает большую оценку. Любая шкала с тем же порядком одинаково пригодна для последующего выбора победителя.'
  kind: choice
  options:
    - Тесты сравнивают только относительный порядок оценок, а не их абсолютные значения
    - Тесты округляют любые оценки до диапазона 0–2
    - Вторая реализация ошибочна, просто тесты неполные
    - Абсолютные значения важны, но в этих наборах они случайно совпали
  correct: 0
  id: 015-code-rule-specificity-1
  fingerprint: 9012e7e5
- concept: шаблон `*` как ограничение не сужает множество и не должен повышать оценку выше правила вовсе без ограничения
  question: Как соотносятся оценки специфичности правил `Bash` (без ограничения) и `Bash(*)`?
  explanation: Наивная реализация повышает оценку за сам факт наличия скобок, и `Bash(*)` начинает выигрывать у `Bash`, хотя множество покрываемых команд у них одинаковое. Считать надо буквальные части шаблона, а не длину строки или наличие ограничения.
  kind: choice
  options:
    - 'Они равны или почти равны: оба покрывают все команды инструмента'
    - '`Bash(*)` заметно специфичнее: в нём присутствует ограничение'
    - '`Bash` специфичнее: отсутствие ограничения — самый строгий случай'
    - 'Сравнивать нельзя: одно правило неполное'
  correct: 0
  id: 015-code-rule-specificity-2
  fingerprint: f78dd82b
- concept: решение правила не участвует в вычислении его специфичности
  question: В реализации `rule_specificity` появилась строка, добавляющая 100 к оценке, если решение правила — `deny`. Что сломается?
  explanation: 'Строгость и точность описания решаются на разных этапах: сначала выбирают релевантные правила по специфичности, конфликт решений разбирается отдельным шагом. Смешав их в одной оценке, получаешь `Bash` с `deny`, побеждающий `Bash(pytest tests/unit)` с `allow` — узкое исключение перестаёт работать.'
  kind: choice
  options:
    - Широкий запрет начнёт вытеснять точное разрешающее правило, хотя оно описывает действие точнее
    - 'Ничего: запреты и так должны побеждать, просто раньше'
    - Функция перестанет работать с правилами без ограничения
    - Сломается только сортировка при равных оценках
  correct: 0
  id: 015-code-rule-specificity-3
  fingerprint: 9c782f93
