- concept: разборщик правила обязан срезать пробелы вокруг частей, иначе они попадут внутрь значения и сорвут последующее сопоставление
  question: Разборщик правил получает строку `  git push  |  ask  ` и раскладывает её по полям структуры. Зачем обязательно срезать пробелы перед возвратом?
  explanation: Пробелы — часть форматирования строки, а не часть значения. Если они остаются внутри поля, правило выглядит корректным, но при сопоставлении не подходит ни к одному действию — политика тихо перестаёт работать, не выдавая ошибки.
  kind: choice
  options:
    - Иначе в поле действия окажется `«  git push  »`, и сравнение с реальным действием агента не совпадёт
    - Иначе структура займёт заметно больше памяти при большом числе правил
    - Иначе решение политики поменяется на противоположное
  correct: 0
  id: 011-code-parse-rule-1
  fingerprint: 5100f66e
- concept: повреждённая строка правила не должна незаметно превращаться в действующее правило с подставленным решением
  question: В разборщик правил пришла строка, в которой решение политики отсутствует вовсе. Какое поведение опаснее всего для политики в целом?
  explanation: 'Догаданное решение неотличимо от написанного человеком: политика будет уверенно применять правило, которого никто не задавал. Ошибку чтения нужно оставить ошибкой чтения — иначе она сразу превращается в ошибку действия. Как именно сигналить (специальное значение или исключение), диктует контракт функции и тесты.'
  kind: choice
  options:
    - Вернуть признак ошибки и не создавать правило
    - Подставить решение по умолчанию и вернуть внешне корректную структуру
    - Сообщить об ошибке способом, который описан в контракте функции
  correct: 1
  id: 011-code-parse-rule-2
  fingerprint: bf748c67
