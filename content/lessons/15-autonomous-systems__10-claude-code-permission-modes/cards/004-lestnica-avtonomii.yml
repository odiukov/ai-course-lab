- concept: '`dontAsk` при неопределённости отклоняет действие, `bypassPermissions` — разрешает, хотя оба не задают вопросов'
  question: Агент собирается выполнить действие, которое не покрыто заранее заданными правилами. Что произойдёт в `dontAsk` и что в `bypassPermissions`?
  explanation: 'Оба режима молчат, но ведут себя противоположно: `dontAsk` пропускает только заранее разрешённое, а всё остальное отклоняет; `bypassPermissions` одобряет всё, включая разрушительные команды. Тишина не означает одинаковый контроль.'
  kind: choice
  options:
    - Оба режима одинаково прервутся и спросят пользователя
    - '`dontAsk` отклонит действие, `bypassPermissions` выполнит его'
    - '`dontAsk` выполнит действие, `bypassPermissions` отклонит'
