- concept: '`acceptEdits` снимает подтверждение только с записи файлов, не с команд и не с сети'
  question: В режиме `acceptEdits` агент переписывает файлы без вопросов. Что он всё ещё обязан подтверждать?
  explanation: '`acceptEdits` автоматизирует ровно один класс действий — запись в файлы, чтобы не подтверждать десятки однотипных правок при рефакторинге. Команды, сеть и разрушительные операции остаются за человеком.'
  kind: choice
  options:
    - 'Ничего: подтверждения в этом режиме отключены полностью'
    - Запуск команд и обращения к сети
    - Чтение файлов проекта
