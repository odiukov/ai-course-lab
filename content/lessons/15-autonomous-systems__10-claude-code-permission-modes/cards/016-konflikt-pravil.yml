- concept: конфликт решений разрешается по строгости, а не по порядку записей в настройках
  question: 'Настройки собраны из двух источников: общего файла команды и локального файла проекта. Для одной команды первый даёт `allow`, второй — `deny`. Файлы читаются в разном порядке на разных машинах. Каким должен быть исход?'
  explanation: 'Зависимость от порядка делает политику невоспроизводимой: та же конфигурация ведёт себя по-разному в разных окружениях. Выбор самого строгого исхода коммутативен, поэтому результат одинаков независимо от порядка слияния источников.'
  kind: choice
  options:
    - '`deny` на всех машинах: исход не зависит от порядка чтения источников'
    - 'Решение источника, прочитанного последним: он переопределяет предыдущий'
    - 'Решение источника, прочитанного первым: остальные уже не влияют'
    - '`ask`: при конфликте политика всегда переходит к подтверждению'
  correct: 0
  id: 016-konflikt-pravil-1
  fingerprint: 694814f5
- concept: решения политики упорядочены по количеству свободы, которую они оставляют агенту
  question: Расставь решения политики от наименее строгого к наиболее строгому.
  explanation: Шкала измеряет, сколько свободы остаётся агенту. `ask` строже `allow`, потому что вставляет человека в цикл; `deny` строже `ask`, потому что не оставляет пути к выполнению даже при согласии человека.
  kind: order
  items:
    - allow — действие выполняется сразу, без участия человека
    - ask — выполнение приостанавливается до решения человека
    - deny — действие не выполняется вовсе
  id: 016-konflikt-pravil-2
  fingerprint: 5ff697cc
- concept: асимметрия цены ошибки объясняет, почему при конфликте выбирают строгий исход, а не разрешающий
  question: Объясни своими словами, почему при противоречивых решениях политика выбирает более строгое, а не пытается угадать «настоящее намерение» автора настроек.
  explanation: 'Тот же принцип «fail closed» действует в сетевых фильтрах и системах доступа: при неоднозначности отказ обратим, а выполненное действие — нет.'
  kind: open
  reference: 'Цена двух ошибок различается. Лишний запрет стоит задержки: человек видит отказ и может переформулировать запрос или поправить правила. Лишнее разрешение стоит уже выполненного действия, которое могло изменить состояние системы необратимо. Угадывание намерения к тому же недетерминировано и невоспроизводимо. Поэтому неопределённость разрешается в сторону меньшей свободы агента, а конфликт остаётся видимым, чтобы человек его устранил.'
  id: 016-konflikt-pravil-3
  fingerprint: fb9f8c43
