- concept: разрешения снижают вероятность ошибочного действия, изоляция снижает цену уже совершённой ошибки — это разные рычаги
  question: Чем изоляция принципиально отличается от режимов и правил разрешений?
  explanation: 'Разрешения отвечают «допустимо ли это действие» и могут ошибиться. Изоляция ничего не решает — она убирает саму возможность: если ключей нет в окружении, а продовые диски не смонтированы, ошибочно разрешённая команда портит одноразовую копию.'
  kind: choice
  options:
    - Изоляция принимает более строгие решения о допустимости тех же действий
    - Изоляция сокращает набор технически доступных возможностей, поэтому действует, даже когда решение оказалось ошибочным
    - Изоляция заменяет классификатор, проверяя действия быстрее
    - Изоляция применяется только к сетевым действиям, разрешения — только к файловым
  correct: 1
  id: 029-izolyaciya-2
  fingerprint: cc485900
- concept: для dontAsk и bypassPermissions одноразовым должен быть не только контейнер, но и доступные ему ключи
  question: Одноразовый контейнер удаляется после прогона, но внутрь ему передан рабочий токен CI, действующий месяцами. Достаточно ли этого для запуска в `bypassPermissions`?
  explanation: 'Одноразовость среды не делает одноразовыми её секреты. Токен, доступный процессу без подтверждений, уходит за пределы контейнера и остаётся валидным. Условие для `dontAsk` и `bypassPermissions` двойное: одноразовый контейнер и одноразовые ключи доступа.'
  kind: choice
  options:
    - 'Да: контейнер уничтожается, значит следы прогона не сохраняются'
    - 'Нет: долгоживущий токен переживает контейнер, и утечка или его использование действуют после удаления среды'
    - Да, если токен доступен только на чтение файлов проекта
    - Нет, но проблема решается сокращением времени жизни контейнера
  correct: 1
  id: 029-izolyaciya-3
  fingerprint: 9d56c246
