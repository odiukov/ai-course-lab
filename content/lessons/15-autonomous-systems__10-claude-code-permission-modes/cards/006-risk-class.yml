- concept: класс риска описывает действие, режим разрешений принимает решение — это два разных слоя
  question: 'Запись в файл в режимах `default` и `acceptEdits`: что у неё общее, а что разное? Объясни своими словами.'
  explanation: 'Разделение слоёв нужно, чтобы обсуждать режим и опасность отдельно: режим меняет только объём вашего надзора, а не последствия операции.'
  kind: open
  reference: 'Класс риска у обеих записей одинаковый: действие меняет данные, но остаётся в пределах файла — технические свойства операции от режима не зависят. Разное — решение: в `default` запись может потребовать подтверждения, в `acceptEdits` она проходит автоматически. Классификация описывает действие, политика разрешений определяет, что с ним делать. Смешивать их нельзя: иначе получится, будто смена режима сделала операцию менее опасной, хотя она лишь перестала спрашивать.'
  id: 006-risk-class-3
  fingerprint: 9c8c8c9b
