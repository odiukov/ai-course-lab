- concept: сетевое обращение добавляет внешний контур, которого нет у чтения и записи локальных файлов
  question: Какое из действий расширяет контур риска за пределы локальной машины?
  explanation: 'Чтение не меняет среду, запись остаётся в пределах файла, запуск команды может затронуть множество файлов. Сеть отличается качественно: данные уходят наружу, и отозвать их нельзя.'
  kind: choice
  options:
    - Чтение файла в каталоге проекта
    - Запись изменённого содержимого в файл
    - Сетевой запрос к внешнему сервису
  correct: 2
