- concept: сопоставление правила с действием проверяет сначала вид инструмента, и только затем цель
  question: Правило описывает `Write(config/*.yaml)`, агент выполняет `Read(config/app.yaml)`. Строка-цель подходит под шаблон правила. Совпадает ли правило с действием?
  explanation: 'Правило состоит из двух частей: вид инструмента и ограничение на цель. Обе должны совпасть. `Write` и `Read` — разные операции над одним и тем же файлом с разным радиусом ущерба, поэтому одинаковая строка пути не делает правило применимым.'
  kind: choice
  options:
    - 'Нет: инструменты разные, совпадение цели ничего не значит'
    - 'Да: цель подходит под шаблон, значит правило применимо'
    - Да, но только если правило имеет решение `allow`
    - Нет, потому что в шаблоне используется звёздочка
  correct: 0
  id: 013-code-rule-matches-1
  fingerprint: c0e0d808
- concept: шаблон со звёздочкой сопоставляется целиком, а не как поиск подстроки
  question: 'Правило разрешает `Bash(git log:*)`. Агент запускает `sudo rm -rf / # git log:all`. Наивная реализация ищет подстроку `git log:` в команде. Что произойдёт?'
  explanation: 'Шаблон должен покрывать строку целиком: якорь в начале и в конце. Поиск вхождения где угодно позволяет спрятать произвольную команду вокруг разрешённого фрагмента — классический обход списка разрешений.'
  kind: choice
  options:
    - 'Ничего страшного: подстрока найдена, значит команда действительно про git log'
    - Правило совпадёт и разрешит разрушительную команду, потому что совпадение не привязано к началу и концу строки
    - 'Правило не совпадёт: звёздочка требует, чтобы после неё ничего не было'
    - Правило совпадёт, но решение будет автоматически понижено до `ask`
  correct: 1
  id: 013-code-rule-matches-2
  fingerprint: 993b3ef2
- concept: отсутствующее ограничение в правиле означает «любая цель», а не пустую цель
  question: Правило записано как `Bash` без скобок и аргументов. Как функция сопоставления должна трактовать пустое ограничение?
  explanation: Пустое ограничение и ограничение-пустая-строка — разные вещи. Первое означает отсутствие сужения (любая команда этого инструмента), второе — требование равенства пустой строке, под которое почти ничего не попадёт.
  kind: choice
  options:
    - Совпадает с любым вызовом `Bash`, независимо от команды
    - Совпадает только с вызовом `Bash` с пустой строкой команды
    - 'Не совпадает ни с чем: правило неполное'
    - Совпадает с любым инструментом, раз ограничения нет
  correct: 0
