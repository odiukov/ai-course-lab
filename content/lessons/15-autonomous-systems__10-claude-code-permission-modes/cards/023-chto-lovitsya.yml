- concept: выходящая за рамки команда помечается по несоответствию типу текущей работы, а не по опасности команды самой по себе
  question: Одна и та же команда `curl` в одной сессии помечается как выходящая за рамки, а в другой проходит спокойно. Объясни своими словами, что решает исход.
  explanation: 'Это по-прежнему распознавание формы, а не чтение мыслей: нужен лишь текущий тип работы, а не восстановление далёкого замысла. Поэтому список запрещённых команд сам по себе хуже — он не различает эти два случая.'
  kind: open
  reference: Исход решает соответствие команды тому, чем сессия занималась до этого. Если в сессии были только правки файлов, сетевой вызов резко выпадает из типа работы и помечается. Если задача изначально про загрузку данных или проверку внешнего сервиса, та же команда лежит в рамках запроса. Опасность оценивается не у команды в вакууме, а у пары «действие + характер текущей сессии».
  id: 023-chto-lovitsya-3
