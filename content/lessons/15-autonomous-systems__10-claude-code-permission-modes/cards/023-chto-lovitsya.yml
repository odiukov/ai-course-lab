- concept: цикл вызовов распознаётся сравнением с несколькими предыдущими действиями — нужна короткая история, а не намерение
  question: Агент семь раз подряд предлагает почти одинаковый вызов, меняя лишь один параметр. Какая информация нужна проверке, чтобы это заметить?
  explanation: Одно действие в цикле выглядит нормальным; подозрительна повторяемость. Достаточно сравнить очередной вызов с несколькими предыдущими — это распознавание шаблона, поэтому проверка дешёвая и надёжная.
  kind: choice
  options:
    - Полная расшифровка замысла агента и прогноз последствий цепочки
    - Короткая история последних вызовов для сравнения действия N+1 с действием N
    - Оценка стоимости каждого вызова в долларах
    - Только текст текущего действия — цикл виден в нём самом
  correct: 1
