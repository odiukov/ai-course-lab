- concept: несовпавшее правило воздерживается от решения, а не выносит отказ
  question: 'В политике есть правило: запретить отправку данных через `wget`. Агент запускает `pytest`. Объясни, почему это правило не выносит по данному действию никакого решения, и что тогда определит исход.'
  explanation: 'Ключевое различие: «правило сказало нет» и «ни одно правило не совпало» — разные состояния. Первое даёт отказ, второе передаёт решение дальше по политике и режиму.'
  kind: open
  reference: 'Решение `deny` живёт внутри правила и включается только после того, как действие совпало с описанием. `pytest` не подходит под описание `wget`, поэтому правило не применяется — оно не запрещает и не разрешает, а просто выпадает из рассмотрения. Запрет на одно действие не гасит весь терминал. Исход определят остальные правила политики, а если ни одно не совпало — текущий режим разрешений: в `default` опасное действие вызовет вопрос пользователю, в `dontAsk` действие без заранее разрешающего правила будет отклонено, в `bypassPermissions` — выполнено.'
  id: 012-sopostavlenie-pravila-2
