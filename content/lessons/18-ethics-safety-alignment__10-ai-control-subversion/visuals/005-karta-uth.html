<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Поток работы между U, T и ограниченным бюджетом H</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f5f7fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #536078;
      --line: #64748b;
      --flow: #2563eb;
      --flow-soft: #dbeafe;
      --u-fill: #e8efff;
      --u-stroke: #315fbd;
      --t-fill: #e8f7ef;
      --t-stroke: #237a52;
      --h-fill: #fff1d6;
      --h-stroke: #a65d09;
      --decision-fill: #f0eaff;
      --decision-stroke: #7049b8;
      --router-fill: #ffffff;
      --meter-empty: #ead9b8;
      --meter-full: #d97706;
      --shadow: #d9dfeb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111725;
        --panel: #171f2f;
        --ink: #eef3ff;
        --muted: #b7c1d6;
        --line: #94a3b8;
        --flow: #70a5ff;
        --flow-soft: #20375c;
        --u-fill: #1d3154;
        --u-stroke: #79a7ff;
        --t-fill: #173c31;
        --t-stroke: #68d6a2;
        --h-fill: #49351b;
        --h-stroke: #f2b55d;
        --decision-fill: #30244c;
        --decision-stroke: #bd9cff;
        --router-fill: #171f2f;
        --meter-empty: #5a482e;
        --meter-full: #f2a43c;
        --shadow: #0b0f18;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    body {
      margin: auto;
    }

    main {
      max-width: 1180px;
      margin: auto;
      background: var(--panel);
      border: 2px solid var(--shadow);
    }

    h2 {
      font-size: 22px;
      text-align: center;
      color: var(--ink);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 430px;
      background: var(--panel);
      overflow: visible;
    }

    text {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      user-select: none;
    }

    .fallback {
      min-height: 430px;
      background: var(--panel);
      color: var(--ink);
      font-size: 17px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <h2 id="diagram-title">Поток работы: U → T → ограниченный бюджет H</h2>

    <svg
      id="diagram"
      viewBox="0 0 1180 430"
      width="1180"
      height="430"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-title diagram-description">
      <desc id="diagram-description">
        U создаёт 1000 выходов. T проверяет или правит каждый выход.
        До ручной проверки H доходит только 10 выходов, то есть 1 процент потока.
      </desc>
    </svg>

    <div
      id="fallback"
      class="fallback"
      hidden
      data-message="Схема должна была показать: U создаёт 1000 выходов, T проверяет или правит каждый, а H вручную проверяет только 10 выходов — 1% потока.">
      Схема должна была показать: U создаёт 1000 выходов, T проверяет или правит
      каждый, а H вручную проверяет только 10 выходов — 1% потока.
    </div>
  </main>

  <script>
    const diagramData = [{
      canvas: { width: 1180, height: 430 },
      unit: 1,
      nodes: [
        {
          kind: "u",
          x: 45, y: 100, w: 175, h: 180,
          labels: [
            { text: "U", x: 132, y: 145, dx: 0, dy: 0, anchor: "middle", size: 34, weight: "bold", tone: "ink" },
            { text: "сильная модель", x: 132, y: 182, dx: 0, dy: 0, anchor: "middle", size: 16, weight: "normal", tone: "muted" },
            { text: "создаёт", x: 132, y: 217, dx: 0, dy: 0, anchor: "middle", size: 15, weight: "normal", tone: "muted" },
            { text: "1000 выходов", x: 132, y: 249, dx: 0, dy: 0, anchor: "middle", size: 20, weight: "bold", tone: "ink" }
          ]
        },
        {
          kind: "t",
          x: 390, y: 80, w: 230, h: 220,
          labels: [
            { text: "T", x: 505, y: 120, dx: 0, dy: 0, anchor: "middle", size: 34, weight: "bold", tone: "ink" },
            { text: "проверяет или правит", x: 505, y: 150, dx: 0, dy: 0, anchor: "middle", size: 16, weight: "normal", tone: "muted" },
            { text: "каждый выход", x: 505, y: 276, dx: 0, dy: 0, anchor: "middle", size: 18, weight: "bold", tone: "ink" }
          ]
        },
        {
          kind: "h",
          x: 875, y: 55, w: 240, h: 180,
          labels: [
            { text: "H", x: 995, y: 92, dx: 0, dy: 0, anchor: "middle", size: 34, weight: "bold", tone: "ink" },
            { text: "ручная проверка", x: 995, y: 123, dx: 0, dy: 0, anchor: "middle", size: 16, weight: "normal", tone: "muted" },
            { text: "только 10 выходов", x: 995, y: 151, dx: 0, dy: 0, anchor: "middle", size: 18, weight: "bold", tone: "ink" },
            { text: "1% потока", x: 995, y: 178, dx: 0, dy: 0, anchor: "middle", size: 16, weight: "bold", tone: "h" }
          ]
        },
        {
          kind: "decision",
          x: 875, y: 300, w: 240, h: 85,
          labels: [
            { text: "Решение протокола", x: 995, y: 334, dx: 0, dy: 0, anchor: "middle", size: 18, weight: "bold", tone: "ink" },
            { text: "выпуск или остановка", x: 995, y: 362, dx: 0, dy: 0, anchor: "middle", size: 15, weight: "normal", tone: "muted" }
          ]
        }
      ],
      checks: [
        { box: { x: 430, y: 174, w: 18, h: 18 }, tick: [[434, 183], [440, 189], [447, 178]], line: [[462, 183], [575, 183]] },
        { box: { x: 430, y: 207, w: 18, h: 18 }, tick: [[434, 216], [440, 222], [447, 211]], line: [[462, 216], [575, 216]] },
        { box: { x: 430, y: 240, w: 18, h: 18 }, tick: [[434, 249], [440, 255], [447, 244]], line: [[462, 249], [575, 249]] }
      ],
      router: {
        points: [[720, 190], [750, 155], [780, 190], [750, 225]],
        label: { text: "ОТБОР", x: 750, y: 194, dx: 0, dy: 0, anchor: "middle", size: 13, weight: "bold", tone: "ink" }
      },
      flows: [
        {
          kind: "main",
          points: [[220, 190], [390, 190]],
          head: [[390, 190], [370, 180], [370, 200]],
          label: { text: "1000 выходов", x: 235, y: 162, dx: 0, dy: 0, anchor: "start", size: 17, weight: "bold", tone: "flow" }
        },
        {
          kind: "main",
          points: [[620, 190], [720, 190]],
          head: [[720, 190], [700, 180], [700, 200]],
          label: { text: "проверен каждый", x: 625, y: 162, dx: 0, dy: 0, anchor: "start", size: 15, weight: "bold", tone: "flow" }
        },
        {
          kind: "selected",
          points: [[780, 190], [820, 190], [820, 145], [875, 145]],
          head: [[875, 145], [855, 135], [855, 155]],
          label: { text: "10 выходов • 1%", x: 810, y: 112, dx: 0, dy: 0, anchor: "middle", size: 16, weight: "bold", tone: "h" }
        },
        {
          kind: "rest",
          points: [[780, 190], [820, 190], [820, 342], [875, 342]],
          head: [[875, 342], [855, 332], [855, 352]],
          label: { text: "остальной поток", x: 806, y: 270, dx: 0, dy: 0, anchor: "end", size: 15, weight: "normal", tone: "muted" }
        },
        {
          kind: "human",
          points: [[995, 235], [995, 300]],
          head: [[995, 300], [985, 280], [1005, 280]],
          label: { text: "ручной вердикт", x: 1012, y: 266, dx: 8, dy: 0, anchor: "start", size: 14, weight: "normal", tone: "h" }
        }
      ],
      meter: {
        count: 10,
        x: 908, y: 194,
        segment: 13,
        height: 14,
        gap: 18
      },
      legend: [
        { text: "U: способность используется часто", x: 45, y: 416, dx: 0, dy: 0, anchor: "start", size: 14, weight: "normal", tone: "muted" },
        { text: "T: проверяет весь поток", x: 450, y: 416, dx: 0, dy: 0, anchor: "start", size: 14, weight: "normal", tone: "muted" },
        { text: "H: только 10 выходов — 1%", x: 805, y: 416, dx: 0, dy: 0, anchor: "start", size: 14, weight: "bold", tone: "h" }
      ],
      strokes: {
        outline: 2,
        flowBand: 14,
        flow: 3,
        check: 2
      }
    }];

    const origin = { x: 0, y: 0 };
    const scale = { x: 1, y: 1 };

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const [d] = diagramData;
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const ns = "http://www.w3.org/2000/svg";

      const colors = {
        ink: "var(--ink)",
        muted: "var(--muted)",
        flow: "var(--flow)",
        h: "var(--h-stroke)"
      };

      const nodeStyle = {
        u: ["var(--u-fill)", "var(--u-stroke)"],
        t: ["var(--t-fill)", "var(--t-stroke)"],
        h: ["var(--h-fill)", "var(--h-stroke)"],
        decision: ["var(--decision-fill)", "var(--decision-stroke)"]
      };

      const make = (tag, attrs = {}) => {
        const element = document.createElementNS(ns, tag);
        Object.entries(attrs).forEach(([name, value]) => {
          element.setAttribute(name, String(value));
        });
        return element;
      };

      const append = element => {
        svg.appendChild(element);
        return element;
      };

      const rect = (box, fill, stroke, width) => append(make("rect", {
        x: sx(box.x),
        y: sy(box.y),
        width: sx(box.x + box.w) - sx(box.x),
        height: sy(box.y + box.h) - sy(box.y),
        fill,
        stroke,
        "stroke-width": width,
        "vector-effect": "non-scaling-stroke"
      }));

      const points = list => list
        .map(point => `${sx(point[0])},${sy(point[1])}`)
        .join(" ");

      const path = (list, stroke, width, fill = "none") => append(make("polyline", {
        points: points(list),
        fill,
        stroke,
        "stroke-width": width,
        "stroke-linecap": "round",
        "stroke-linejoin": "round",
        "vector-effect": "non-scaling-stroke"
      }));

      const label = spec => {
        const text = append(make("text", {
          x: sx(spec.x),
          y: sy(spec.y),
          dx: spec.dx,
          dy: spec.dy,
          fill: colors[spec.tone],
          "font-size": spec.size,
          "font-weight": spec.weight,
          "text-anchor": spec.anchor
        }));
        text.textContent = spec.text;
        return text;
      };

      d.nodes.forEach(node => {
        const [fill, stroke] = nodeStyle[node.kind];
        rect(node, fill, stroke, d.strokes.outline);
      });

      d.flows.forEach(flow => {
        if (flow.kind === "main") {
          path(flow.points, "var(--flow-soft)", d.strokes.flowBand);
        }
      });

      d.flows.forEach(flow => {
        const stroke = flow.kind === "selected" || flow.kind === "human"
          ? "var(--h-stroke)"
          : flow.kind === "rest"
            ? "var(--line)"
            : "var(--flow)";

        path(flow.points, stroke, d.strokes.flow);
        append(make("polygon", {
          points: points(flow.head),
          fill: stroke,
          stroke,
          "stroke-width": d.strokes.outline,
          "stroke-linejoin": "round",
          "vector-effect": "non-scaling-stroke"
        }));
      });

      append(make("polygon", {
        points: points(d.router.points),
        fill: "var(--router-fill)",
        stroke: "var(--flow)",
        "stroke-width": d.strokes.outline,
        "stroke-linejoin": "round",
        "vector-effect": "non-scaling-stroke"
      }));

      d.checks.forEach(check => {
        rect(check.box, "var(--panel)", "var(--t-stroke)", d.strokes.check);
        path(check.tick, "var(--t-stroke)", d.strokes.check);
        path(check.line, "var(--t-stroke)", d.strokes.check);
      });

      const meterIndices = Array.from(
        { length: d.meter.count },
        (_, index) => index
      );

      meterIndices.forEach(index => {
        const meterBox = {
          x: d.meter.x + index * d.meter.gap,
          y: d.meter.y,
          w: d.meter.segment,
          h: d.meter.height
        };
        rect(
          meterBox,
          "var(--meter-full)",
          "var(--h-stroke)",
          d.strokes.outline
        );
      });

      d.nodes.forEach(node => node.labels.forEach(label));
      d.flows.forEach(flow => label(flow.label));
      label(d.router.label);
      d.legend.forEach(label);

      fallback.hidden = true;
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      svg.hidden = true;
      fallback.hidden = false;
      fallback.textContent = fallback.dataset.message;
    }
  </script>
</body>
</html>
