- concept: взаимная информация равна уменьшению неопределённости цели после наблюдения признака
  question: Как через энтропию выразить взаимную информацию между признаком X и целью Y?
  explanation: H(Y) описывает неопределённость цели без знания признака, а H(Y | X) — оставшуюся неопределённость после наблюдения X. Их разность показывает, сколько неопределённости устраняет признак.
  kind: choice
  options:
    - H(Y) − H(Y | X)
    - H(Y | X) − H(Y)
    - H(X) + H(Y)
    - H(Y) / H(X)
  correct: 0
  id: 017-mi-uncertainty-1
  fingerprint: 0beb06f8
- concept: независимость признака и цели приводит к нулевой взаимной информации
  question: Для каждого возможного значения признака X условное распределение цели p(Y | X) совпадает с её безусловным распределением p(Y). Чему равна взаимная информация I(X; Y)?
  explanation: Если p(Y | X) не отличается от p(Y), знание X не меняет ожиданий относительно Y. Признак и цель независимы, поэтому неопределённость цели не уменьшается и взаимная информация равна нулю.
  kind: choice
  options:
    - Нулю
    - Энтропии признака X
    - Энтропии цели Y
    - Она обязательно отрицательна
  correct: 0
  id: 017-mi-uncertainty-2
  fingerprint: ae001760
