  fingerprint: e1d05855
- concept: локальную позицию признака в текущем подмножестве нужно преобразовать в исходный индекс через список оставшихся столбцов
  question: Заполни пропуск так, чтобы получить исходный номер наименее важного столбца, если least_idx — его позиция в текущем подмножестве.
  explanation: '`least_idx` относится к столбцам `X_subset`, а не к исходной матрице `X`. Список `remaining` хранит соответствие текущих позиций исходным номерам, поэтому нужен элемент `remaining[least_idx]`.'
  kind: cloze
  template: original_idx = ___
  answer: remaining[least_idx]
  accept:
    - remaining[int(least_idx)]
