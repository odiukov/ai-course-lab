- concept: итоговая маска RFE отмечает признаки, у которых сохранился общий ранг выживших
  question: В реализации RFE исключённому признаку перед удалением присваивается отдельный ранг, а у выживших сохраняется общий ранг. Какое условие должно определять `True` в итоговой маске?
  explanation: Массив `rankings` изначально заполнен единицами, а ранги исключённых признаков перезаписываются. Поэтому после отбора условие `rankings == 1` истинно только для оставшихся признаков.
  kind: choice
  options:
    - Ранг признака равен общему рангу выживших
    - Ранг признака больше ранга последнего исключённого
    - Признак был исключён раньше остальных
