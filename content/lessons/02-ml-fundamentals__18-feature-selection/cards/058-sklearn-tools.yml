- concept: при обучении Pipeline последовательно обучает и применяет трансформеры перед обучением итоговой модели
  question: Расположи операции в порядке их выполнения при вызове fit у Pipeline с двумя селекторами и классификатором.
  explanation: Каждый промежуточный шаг обучается на входе, полученном от предыдущего шага, и передаёт дальше преобразованные данные. Последний estimator получает уже отобранные признаки.
  kind: order
  items:
    - Обучить VarianceThreshold на исходных обучающих признаках и преобразовать их
    - Обучить SelectKBest на результате предыдущего преобразования и снова сократить набор признаков
    - Обучить итоговый классификатор на признаках, оставшихся после обоих селекторов
  id: 058-sklearn-tools-2
  fingerprint: bf490c93
- concept: при predict Pipeline применяет уже обученные преобразования в том же порядке без повторного fit
  question: Объясни своими словами, что происходит с новыми объектами при вызове predict у заранее обученного Pipeline, содержащего селекторы признаков и модель.
  explanation: Новые данные проходят через ту же цепочку преобразований, которая была настроена на обучающей выборке. Это сохраняет одинаковый состав и порядок признаков при обучении и прогнозировании.
  kind: open
  reference: Pipeline последовательно вызывает transform у уже обученных селекторов, передаёт сокращённую матрицу следующему шагу и затем вызывает predict у итоговой модели. Селекторы на новых объектах повторно не обучаются.
  id: 058-sklearn-tools-3
  fingerprint: 394536eb
