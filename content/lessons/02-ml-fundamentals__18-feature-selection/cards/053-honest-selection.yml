- concept: отбор признаков по объединённым train и test создаёт утечку данных, даже если модель обучается только на train
  question: После разделения данных разработчик объединил train и test, вычислил взаимную информацию признаков с целевой переменной и выбрал лучшие признаки. Саму модель он обучил только на train. Как оценить эту процедуру?
  explanation: Отбор признаков является частью обучения. Если при нём использованы ответы из test, выбранное подмножество уже подстроено под будущую проверку, поэтому её результат будет оптимистичным.
  kind: choice
  options:
    - 'Произошла утечка: целевые значения test повлияли на состав признаков'
    - Процедура корректна, потому что строки test не передавались в метод fit модели
    - Процедура корректна, если test заметно меньше train
    - Ошибка влияет только на скорость, но не на оценку качества
  correct: 0
  id: 053-honest-selection-1
  fingerprint: e39bec4b
- concept: при кросс-валидации отбор признаков заново обучается внутри каждого разбиения
  question: Расположите действия в корректном порядке для одного разбиения кросс-валидации с отбором признаков.
  explanation: Каждая валидационная часть должна оставаться невидимой и для модели, и для метода отбора. Поэтому селектор обучают отдельно внутри каждого разбиения, обычно поместив его вместе с моделью в pipeline.
  kind: order
  items:
    - Выделить обучающую и валидационную части текущего разбиения
    - Обучить метод отбора только на обучающей части
    - Преобразовать обучающую часть с помощью полученной маски признаков
    - Преобразовать валидационную часть той же маской без повторного обучения отбора
    - Обучить модель и оценить её на преобразованной валидационной части
  id: 053-honest-selection-2
  fingerprint: e85d09f0
- concept: несупервизируемый отбор признаков также настраивают только на train
  question: Почему VarianceThreshold, который не использует целевую переменную, всё равно не следует обучать на объединённых train и test? Объясните своими словами и укажите корректный порядок действий.
  explanation: 'Отсутствие обращения к y не исключает утечку: статистики самих признаков test тоже являются информацией о проверочных данных. Test должен участвовать только в окончательном преобразовании и оценке.'
  kind: open
  reference: Даже без целевой переменной test содержит информацию о распределении будущих данных. Если по нему вычислить дисперсии и выбрать столбцы, проверочная часть повлияет на обучение. Нужно обучить VarianceThreshold только на train, а затем без пересчёта применить полученную маску к train и test.
  id: 053-honest-selection-3
  fingerprint: 12cb7d7c
