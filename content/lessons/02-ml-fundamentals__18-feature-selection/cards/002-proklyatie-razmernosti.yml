- concept: в высокой размерности расстояния между точками теряют различительную способность
  question: Как обычно меняется полезность понятия «ближайший сосед» при росте числа признаков?
  explanation: 'В многомерном пространстве расстояния склонны концентрироваться: ближайшие точки оказываются не настолько ближе остальных. Поэтому соседство хуже отражает содержательное сходство объектов.'
  kind: choice
  options:
    - Относительная разница между расстояниями до ближайших и более далёких точек уменьшается
    - Ближайший сосед становится полностью идентичен объекту по всем признакам
    - Расстояние до любой точки становится равным нулю
    - Ближайший сосед обязательно начинает принадлежать тому же классу
