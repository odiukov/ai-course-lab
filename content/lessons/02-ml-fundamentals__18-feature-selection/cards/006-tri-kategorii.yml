- concept: filter-методы оценивают признаки по отдельности без обучения модели и могут пропускать их взаимодействия
  question: Два признака почти не связаны с целевой переменной по отдельности, но хорошо предсказывают её совместно. Какой подход с наибольшей вероятностью отклонит оба признака, не заметив их взаимодействия?
  explanation: Filter-метод оценивает каждый признак отдельно и не проверяет их совместную работу. Wrapper оценивает целые подмножества, а embedded выполняет отбор в процессе обучения модели.
  kind: choice
  options:
    - Filter-метод с отдельной статистической оценкой каждого признака
    - Wrapper-метод с оценкой подмножеств по качеству модели
    - Embedded-метод, выполняющий отбор во время обучения
  correct: 0
  id: 006-tri-kategorii-1
  fingerprint: a677fc5b
- concept: wrapper-методы сравнивают подмножества признаков посредством многократного обучения и оценки модели
  question: Расположите действия одного цикла wrapper-отбора признаков в правильном порядке.
  explanation: Wrapper-подход использует качество модели как оценку подмножества. Поэтому для каждого нового набора признаков модель приходится обучать и проверять заново.
  kind: order
  items:
    - Выбрать очередное подмножество признаков
    - Обучить модель на выбранном подмножестве
    - Оценить качество обученной модели
    - Изменить подмножество с учётом результата и повторить цикл
  id: 006-tri-kategorii-2
  fingerprint: de4b7dda
- concept: embedded-методы выполняют отбор признаков внутри обучения и зависят от механизма модели
  question: Объясните своими словами, почему L1-регуляризация и выбор признаков для разбиений в дереве относятся к embedded-методам.
  explanation: 'Ключевой признак embedded-подхода — отбор встроен в обучение модели. Конкретный механизм отбора определяется устройством алгоритма: регуляризацией у линейной модели или правилами построения дерева.'
  kind: open
  reference: 'В обоих случаях полезность признаков определяется самим алгоритмом во время обучения: L1-регуляризация может обнулить их веса, а дерево выбирает признаки для разбиений. Отдельной процедуры перебора подмножеств после или до обучения не требуется.'
  id: 006-tri-kategorii-3
  fingerprint: d6d69d8b
