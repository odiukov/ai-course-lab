- concept: np.digitize по умолчанию относит значение на внутренней границе к правому интервалу
  question: Число точно совпало с одной из внутренних границ, переданных в `np.digitize`, а параметр `right` не указан. В какую корзину оно попадёт?
  explanation: 'По умолчанию используется `right=False`: внутренняя граница включается в начинающийся на ней интервал, то есть в корзину справа.'
  kind: choice
  options:
    - В корзину справа от границы
    - В корзину слева от границы
