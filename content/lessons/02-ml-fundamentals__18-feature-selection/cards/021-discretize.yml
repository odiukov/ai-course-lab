- concept: постоянный массив при дискретизации нужно явно отнести к одной корзине
  question: Заполни ветку функции дискретизации для случая, когда все значения массива одинаковы.
  explanation: У постоянного массива нет ненулевого диапазона, поэтому равномерные границы вырождаются. Массив нулей относит все наблюдения к одной корзине, сохраняет форму входа и имеет целочисленный тип.
