- concept: финальный метод отбора признаков выбирают в соответствии с типом модели
  question: Какое соответствие между типом модели и методом финального отбора признаков верно?
  explanation: Для линейной модели финальный отбор естественно встроить через L1-регуляризацию. Для деревьев объединяют tree importance и permutation importance, а с моделью другого типа применяют RFE, используя её как базовую.
  kind: choice
  options:
    - Линейная модель — лассо; деревья — встроенная и перестановочная важность; другая модель — рекурсивное исключение признаков с этой моделью
    - Линейная модель — важность деревьев; деревья — лассо; другая модель — только порог дисперсии
    - Линейная модель — перестановочная важность; деревья — рекурсивное исключение с линейной моделью; другая модель — лассо
  correct: 0
  id: 052-decision-flow-1
  fingerprint: f5531ee2
- concept: при очень высокой размерности дорогой отбор запускают после последовательных дешёвых фильтров
  question: Расположи этапы отбора для набора с тысячами признаков в рекомендуемом порядке.
  explanation: При числе признаков больше 500 схема сначала применяет variance threshold и mutual information, а затем запускает дорогой RFE только на выживших признаках. После отбора результат обязательно проверяют относительно полного набора.
  kind: order
  items:
    - Удалить почти неизменные признаки порогом дисперсии
    - Сократить оставшийся набор фильтром по взаимной информации
    - Запустить рекурсивное исключение признаков на прошедших фильтры кандидатах
    - Сравнить качество модели на выбранных и на всех признаках
  id: 052-decision-flow-2
  fingerprint: e996a8cf
- concept: полезность отбора признаков подтверждают сравнением с моделью на полном наборе
  question: После отбора признаков модель показала качество не лучше, чем та же модель на полном наборе. Какое решение следует принять и почему?
  explanation: Финальная развилка схемы основана на проверке качества. Если отбор не улучшил результат, короткий список сам по себе не оправдывает потерю признаков.
  kind: open
  reference: 'Следует попробовать другой метод отбора либо оставить все признаки: сокращённый набор нужно использовать только тогда, когда практическое сравнение подтверждает его пользу.'
  id: 052-decision-flow-3
  fingerprint: 0186c855
