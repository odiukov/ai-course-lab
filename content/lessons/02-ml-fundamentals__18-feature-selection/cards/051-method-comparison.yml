- concept: Tree importance сочетает среднюю скорость со способностью учитывать нелинейность и взаимодействия признаков
  question: Нужно учитывать нелинейные зависимости и взаимодействия признаков, но избежать медленных методов вроде RFE и permutation importance. Какой метод лучше соответствует этим требованиям?
  explanation: Tree importance имеет среднюю скорость и может учитывать как нелинейность, так и взаимодействия. Mutual information замечает нелинейную связь, но оценивает признаки по отдельности; L1 и корреляционный фильтр ориентированы на линейные зависимости.
  kind: choice
  options:
    - Tree importance
    - Mutual information
    - L1 / Lasso
    - Correlation filter
  correct: 0
  id: 051-method-comparison-1
  fingerprint: 427376c7
- concept: Permutation importance является медленным model-agnostic методом, способным отражать нелинейность и взаимодействия, усвоенные моделью
  question: После обучения произвольной модели требуется оценить признаки методом, который не привязан к внутреннему устройству этой модели и способен отражать сложные зависимости. Низкая скорость допустима. Какой метод подходит?
  explanation: Permutation importance относится к model-agnostic методам и может отражать нелинейность и взаимодействия, если обученная модель их использует. За универсальность приходится платить медленной оценкой.
  kind: choice
  options:
    - Permutation importance
    - Tree importance
    - RFE
    - Variance threshold
  correct: 0
  id: 051-method-comparison-2
  fingerprint: d1143e33
