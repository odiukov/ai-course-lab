- concept: жадные направления отбора могут приводить к разным итоговым подмножествам
  question: Почему forward selection и backward elimination могут выбрать разные признаки при одинаковых модели, данных и метрике?
  explanation: Оба метода жадные и не пересматривают уже принятые решения. Forward selection движется от пустого набора, а backward elimination — от полного, поэтому доступные им последовательности подмножеств различаются.
  kind: choice
  options:
    - Они начинают с разных наборов и необратимо принимают локально лучшие решения
    - Forward selection использует только целевую переменную, а backward elimination — только признаки
    - Backward elimination всегда перебирает все возможные подмножества
    - Forward selection обязательно сохраняет больше признаков
  correct: 0
  id: 030-forward-backward-3
