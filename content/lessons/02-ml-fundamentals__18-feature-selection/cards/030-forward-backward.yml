- concept: forward selection начинает с пустого набора и последовательно добавляет наиболее полезные признаки
  question: Расположите этапы forward selection в правильном порядке.
  explanation: Forward selection строит набор с нуля. На каждом круге он фиксирует лучшее добавление, а при отсутствии улучшения завершает поиск.
  kind: order
  items:
    - Начать с пустого набора признаков
    - Поочерёдно добавить каждый доступный признак и оценить модель на валидационных данных
    - Оставить признак, давший наибольшее улучшение качества
    - Повторять отбор среди оставшихся признаков, пока качество улучшается
    - Остановиться, когда ни один новый признак не помогает
  id: 030-forward-backward-1
  fingerprint: 444734eb
- concept: backward elimination начинает с полного набора и удаляет наименее полезные признаки
  question: Какое действие соответствует одному раунду backward elimination?
  explanation: Backward elimination обучает модели без каждого из текущих признаков по очереди. Удаляется тот признак, исключение которого меньше всего ухудшает качество или даже улучшает его.
  kind: choice
  options:
    - Поочерёдно исключить каждый признак, сравнить качество моделей и окончательно удалить наименее полезный признак
    - Оценить каждый признак отдельно от модели и удалить признак с наименьшей дисперсией
    - Начать с пустого набора и добавить признак с наибольшей взаимной информацией
    - Перебрать все возможные подмножества и выбрать лучшее
  correct: 0
  id: 030-forward-backward-2
