- concept: детерминированные копии признака не добавляют новой информации
  question: В наборе данных есть масса посылки в килограммах и масса той же посылки в граммах, вычисленная точным умножением. Что даёт второй признак?
  explanation: Масса в граммах однозначно вычисляется из массы в килограммах, поэтому новая колонка не несёт дополнительного знания. Удаление таких повторов сокращает набор признаков без потери сигнала.
  kind: choice
  options:
    - Новый независимый сигнал о целевой переменной
    - Дублирующее представление уже имеющейся информации
    - Гарантированное повышение качества на новых данных
    - Устранение необходимости проверять качество модели
  correct: 1
  id: 005-cel-otbora-1
  fingerprint: f329e4ad
- concept: ценность признака определяется его полезной информацией о цели, а не фактом доступности
  question: Какой принцип соответствует цели отбора признаков?
  explanation: Отбор признаков ищет содержательный набор, который сохраняет полезный сигнал о цели. Простое увеличение числа колонок не гарантирует появления новой информации, зато усложняет обучение и объяснение модели.
  kind: choice
  options:
    - Сохранить все доступные колонки на случай, если модель найдёт им применение
    - Сохранить признаки с устойчивой полезной информацией о цели и удалить неинформативные повторы
    - Выбирать признаки только по удобству их названий
    - Максимизировать число входных колонок независимо от качества модели
  correct: 1
