- concept: важность признака в ансамбле деревьев получают суммированием взвешенных снижений неоднородности и усреднением по деревьям
  question: В первом дереве признак использован в узлах с вкладами 24 × 0.15 и 9 × 0.20, а во втором — с вкладом 12 × 0.10. Чему равна его средняя важность по деревьям до общей нормировки?
  explanation: 'В первом дереве важность равна 24 × 0.15 + 9 × 0.20 = 5.4, во втором — 12 × 0.10 = 1.2. Среднее по деревьям: (5.4 + 1.2) / 2 = 3.3.'
  kind: numeric
  answer: 3.3
  tolerance: 0.01
  id: 046-tree-importance-1
  fingerprint: 7e5b7b09
- concept: критерий неоднородности зависит от типа задачи дерева
  question: Какие меры неоднородности обычно применяют при вычислении важности признаков в деревьях?
  explanation: Классификационное дерево оценивает смешанность классов через Gini или энтропию, а регрессионное — разброс числовой цели, обычно через дисперсию. Снижение соответствующей меры после разбиения образует вклад признака.
  kind: choice
  options:
    - Gini или энтропию в классификации, дисперсию в регрессии
    - Дисперсию в классификации, энтропию в регрессии
    - Только корреляцию с целью в задачах обоих типов
    - Косинусное расстояние в классификации, Gini в регрессии
  correct: 0
