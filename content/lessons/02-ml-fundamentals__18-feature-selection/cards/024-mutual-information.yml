- concept: маргинальное распределение цели переиспользуется для всех признаков
  question: Почему вероятности значений целевой переменной можно вычислить до цикла по признакам, а вероятности корзин признака приходится вычислять внутри цикла?
  explanation: Маргинальные вероятности классов общие для всех MI-оценок. Маргинальные вероятности корзин различаются между признаками, поскольку каждый столбец дискретизируется отдельно.
  kind: open
  reference: Распределение цели y не меняется при переходе между столбцами X, поэтому его достаточно вычислить один раз. Распределение корзин зависит от значений текущего признака и должно пересчитываться для каждого столбца.
  id: 024-mutual-information-2
  fingerprint: 2fc65715
- concept: натуральный логарифм выражает взаимную информацию в натах
  question: В каких единицах выражена взаимная информация, если при суммировании вкладов используется np.log?
  explanation: np.log вычисляет натуральный логарифм, поэтому результат измеряется в натах. При использовании логарифма по основанию два взаимная информация выражалась бы в битах.
  kind: choice
