- concept: RFE с логистической моделью ранжирует признаки по модулю коэффициента, а не по его знаку
  question: 'В очередной итерации RFE логистическая модель получила для стандартизованных признаков коэффициенты: A = −2,4, B = 1,3, C = 0,2. Какой признак следует удалить как наименее важный?'
  explanation: Силу влияния оценивают по модулю коэффициента. У признака C модуль веса равен 0,2 — это минимальное значение. Знак показывает направление влияния, поэтому отрицательный вес признака A не делает его слабым.
  kind: choice
  options:
    - A, потому что его коэффициент отрицательный
    - B, потому что его коэффициент меньше коэффициента A без учёта знака
    - C, потому что модуль его коэффициента наименьший
    - 'Ни один: коэффициенты разных знаков нельзя сравнивать'
  correct: 2
  id: 031-logistic-importance-1
  fingerprint: 502618eb
- concept: модули коэффициентов можно сравнивать как оценки важности только при сопоставимом масштабе признаков
  question: Почему нельзя надёжно сравнивать важность двух признаков только по модулям коэффициентов логистической регрессии, если признаки измерены в несопоставимых масштабах?
  explanation: Большой или маленький коэффициент может быть следствием выбранной единицы измерения, а не реальной силы признака. Стандартизация делает изменение на одну единицу сопоставимым между признаками.
  kind: open
  reference: Коэффициент показывает изменение внутреннего балла модели при изменении признака на единицу. После смены единицы измерения численный коэффициент изменится обратно пропорционально масштабу, хотя прогнозы модели могут остаться прежними. Поэтому перед сравнением модулей коэффициентов признаки следует привести к сопоставимому масштабу.
  id: 031-logistic-importance-2
  fingerprint: 1a082b7d
