- concept: знак ошибки в градиентном спуске для логистической регрессии определяется выражением pred − y
  question: Заполни выражение для ошибки, после которого веса обновляются вычитанием градиента.
  explanation: При обновлении через вычитание градиента нужна ошибка pred − y. Если поменять операнды местами, направление шага изменится на противоположное.
  kind: cloze
  template: |-
    error = ___
    w -= lr * (X.T @ error) / len(X)
  answer: pred - y
  accept:
    - np.subtract(pred, y)
  id: 032-logistic-weights-1
  fingerprint: a2fc729d
- concept: смещение логистической регрессии обновляется по средней ошибке объектов
  question: В пакете из 8 объектов сумма ошибок pred − y равна 2.4. Текущее смещение равно −0.3, а скорость обучения — 0.25. Каким станет смещение после одного обновления?
  explanation: Средняя ошибка равна 2.4 / 8 = 0.3. Обновление даёт b = −0.3 − 0.25 × 0.3 = −0.375.
  kind: numeric
  answer: -0.375
  tolerance: 0.000001
  id: 032-logistic-weights-2
  fingerprint: '84779100'
- concept: ограничение логитов предотвращает численное переполнение при вычислении сигмоиды
  question: Зачем перед вычислением экспоненты ограничивать очень большие по модулю логиты логистической модели?
  explanation: Для большого отрицательного логита выражение exp(−z) может выйти за допустимый числовой диапазон. Ограничение аргумента делает вычисление устойчивым, а сигмоида в этой области уже практически насыщена.
  kind: choice
  options:
    - Чтобы избежать переполнения экспоненты при практически неизменных насыщенных вероятностях
    - Чтобы привести все признаки к одинаковому масштабу
    - Чтобы коэффициенты модели не могли стать отрицательными
    - Чтобы автоматически удалить слабые признаки
  correct: 0
  id: 032-logistic-weights-3
  fingerprint: 12e6495e
