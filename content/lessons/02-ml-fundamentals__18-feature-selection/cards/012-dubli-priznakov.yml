- concept: высокая попарная корреляция сама по себе не доказывает избыточность признака для предсказания цели
  question: Признаки A и B сильно коррелируют. Объясни, почему одной этой информации недостаточно, чтобы удалить B.
  explanation: Коррелированные признаки могут различаться в деталях, важных для цели. Поэтому удаление обосновывают не только величиной корреляции, но и тем, добавляет ли признак полезную информацию и как его исключение влияет на качество модели.
  kind: open
  reference: Сильная корреляция показывает сходство признаков, но не доказывает, что B не содержит дополнительной информации о целевой переменной. Нужно проверить, сохраняет ли B полезный сигнал при наличии A, и сравнить качество модели с этим признаком и без него.
