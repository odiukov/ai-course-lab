  fingerprint: 6e7bfc0f
- concept: ранги RFE формируются после последовательных переобучений, а не из единственного снимка важностей
  question: Инженер обучил модель на полном наборе признаков, один раз отсортировал их по важности и назвал результат рангами RFE. В чём ошибка?
  explanation: После каждого удаления RFE снова обучает модель на изменившемся наборе. Ранги отражают всю последовательность пересчётов, а не сортировку единственного набора важностей.
  kind: choice
  options:
    - RFE переобучает модель после удаления признаков, поэтому важности оставшихся могут изменяться
    - RFE всегда назначает всем признакам одинаковый ранг
    - RFE ранжирует признаки только по их дисперсии
    - RFE не использует оценки важности модели
  correct: 0
  id: 035-rfe-ranks-2
  fingerprint: d134d5a7
- concept: ранги RFE являются порядковыми величинами внутри конкретного запуска и не сравниваются напрямую между запусками
  question: Почему по рангам признаков из разных запусков RFE нельзя напрямую заключить, какой признак полезнее?
  explanation: Изменение выборки, модели или условий отбора меняет переобучения и порядок выбывания. Поэтому одинаковые или разные ранги из отдельных запусков не образуют общей шкалы важности.
  kind: open
  reference: Каждый запуск создаёт собственную последовательность удаления, зависящую от модели, данных, состава признаков и целевого размера подмножества. Ранг показывает место признака только в этой последовательности и не является абсолютной мерой полезности.
  id: 035-rfe-ranks-3
  fingerprint: 9612384a
