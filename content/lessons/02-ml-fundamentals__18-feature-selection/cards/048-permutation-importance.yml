- concept: перестановочная важность для метрики «чем больше, тем лучше» равна падению качества после перемешивания признака
  question: До перемешивания признака модель получила F1 = 0,91, а после перемешивания — 0,68. Чему равна permutation importance этого признака?
  explanation: 'Для F1 важность вычисляется как разность исходного качества и качества после перемешивания: 0,91 − 0,68 = 0,23. Большое падение указывает, что модель заметно опиралась на признак.'
  kind: numeric
  answer: 0.23
  tolerance: 0.001
  id: 048-permutation-importance-1
  fingerprint: 338a6dcd
- concept: перемешивание сохраняет набор значений признака, но разрушает его соответствие объектам
  question: Что происходит с признаком при вычислении permutation importance?
  explanation: Перестановка не меняет набор значений столбца, но разрывает связь этих значений с конкретными объектами. Уже обученную модель затем оценивают на изменённых валидационных данных.
  kind: choice
  options:
    - Его значения заменяют случайными числами за пределами исходного диапазона
    - Его значения переставляют между объектами, сохраняя сам набор значений
    - Его удаляют, после чего обучают модель заново
    - Его перемешивают вместе с целевой переменной и остальными признаками
  correct: 1
  id: 048-permutation-importance-2
  fingerprint: f2e5b4e0
- concept: усреднение нескольких перестановок уменьшает случайность оценки permutation importance
  question: Почему значения одного признака обычно перемешивают несколько раз, а полученные падения качества усредняют?
  explanation: Permutation importance зависит от случайной перестановки. Усреднение по повторениям снижает разброс оценки и лучше отражает типичный ущерб от разрушения информации признака.
  kind: open
  reference: Результат отдельной случайной перестановки может оказаться нетипично разрушительным или, наоборот, почти безвредным. Повторения и усреднение делают оценку важности устойчивее к конкретному случайному порядку значений.
  id: 048-permutation-importance-3
  fingerprint: 001ae2d7
