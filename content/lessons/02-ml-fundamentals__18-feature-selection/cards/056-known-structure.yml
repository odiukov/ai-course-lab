- concept: синтетические данные позволяют оценивать отбор признаков по заранее известной структуре сигнала
  question: Зачем метод отбора признаков проверяют на синтетических данных, в которых роли столбцов заданы генератором?
  explanation: В синтетическом наборе генератор заранее определяет, какие признаки несут сигнал, какие лишь связаны с ним, а какие являются шумом. Поэтому результат метода можно проверить непосредственно, а не только через качество последующей модели.
  kind: choice
  options:
    - Чтобы сопоставить найденный рейтинг с известным разделением признаков на сигнал и шум
    - Чтобы гарантировать идеальное качество любой модели
    - Чтобы автоматически устранить корреляции между столбцами
    - Чтобы получить единственно возможный порядок всех признаков
  correct: 0
  id: 056-known-structure-1
  fingerprint: a1dcf172
- concept: фиксированный seed обеспечивает воспроизводимое и справедливое сравнение методов отбора
  question: Расположи действия для воспроизводимого сравнения нескольких методов отбора признаков.
  explanation: Фиксированный seed воспроизводит ту же случайную реализацию данных. Благодаря этому различия в результатах относятся к методам отбора, а не к тому, что каждому из них досталась другая выборка.
  kind: order
  items:
    - Задать общий seed генератора случайных чисел
    - Сгенерировать эталонную таблицу с известной структурой признаков
    - Запустить сравниваемые методы на одной и той же таблице
    - Сопоставить их результаты с известными ролями признаков
  id: 056-known-structure-2
  fingerprint: 45392c98
- concept: на конечной выборке независимый шум может случайно получить ненулевую эмпирическую оценку связи с целью
  question: Шумовой признак был сгенерирован независимо от цели, но на конечной выборке получил небольшую ненулевую оценку важности. Объясни, почему это возможно.
  explanation: Чистый шум не содержит настоящего сигнала о цели, однако случайные совпадения в ограниченной выборке неизбежны. Поэтому от хорошего метода ожидают устойчивого отделения сигнальной группы от шумовой, а не абсолютно нулевой оценки каждого шумового столбца.
  kind: open
  reference: Независимость означает отсутствие связи в генеральном распределении, но конечная случайная выборка содержит статистические колебания. Из-за них эмпирическая корреляция или другая оценка важности шумового признака может немного отличаться от нуля.
  id: 056-known-structure-3
  fingerprint: 1a62af71
