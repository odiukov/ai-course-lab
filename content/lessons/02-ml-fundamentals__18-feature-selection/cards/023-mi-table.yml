- concept: вклад ячейки в MI использует отношение совместной вероятности к произведению маргинальных вероятностей
  question: В выборке из 96 объектов значение X=a встречается у 32 объектов, значение Y=b — у 48, а сочетание X=a и Y=b — у 24. Чему равно отношение p(a,b) / (p(a)p(b))?
  explanation: p(a,b)=24/96=0,25, p(a)=32/96=1/3, p(b)=48/96=1/2. Поэтому отношение равно 0,25 / ((1/3)·(1/2)) = 1,5. Оно больше единицы, значит сочетание встречается чаще, чем ожидалось бы при независимости.
  kind: numeric
  answer: 1.5
  tolerance: 0.01
  id: 023-mi-table-1
  fingerprint: 0e41ad75
- concept: отрицательный вклад отдельной ячейки совместим с неотрицательной суммарной взаимной информацией
  question: Как правильно интерпретировать ячейку, для которой p(x,y) меньше p(x)p(y)?
  explanation: При p(x,y) < p(x)p(y) отношение внутри логарифма меньше единицы, поэтому вклад ячейки отрицателен. Однако MI складывается из вкладов всех сочетаний значений и в итоге всегда неотрицательна.
  kind: choice
  options:
    - Её вклад положителен, поэтому итоговая MI обязательно положительна
    - Её вклад отрицателен, но знак итоговой MI определяется суммой по всем ячейкам, и сама MI не бывает отрицательной
    - Её вклад равен нулю независимо от остальных ячеек
    - Отрицательный вклад этой ячейки означает отрицательную итоговую MI
  correct: 1
  id: 023-mi-table-2
  fingerprint: a260ced8
