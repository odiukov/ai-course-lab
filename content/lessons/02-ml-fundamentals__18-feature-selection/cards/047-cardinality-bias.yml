- concept: перестановочная важность на отложенных данных выявляет ложную важность высококардинального признака
  question: Древесная важность почти уникального кода велика, но после случайного перемешивания его значений на отложенной выборке качество модели почти не меняется. Объясни, что это означает.
  explanation: Перестановка разрушает связь признака с целью. Если метрика на отложенных данных не ухудшается, признак не помогает обобщению, даже когда накопленное снижение неоднородности при обучении делает его важным.
  kind: open
  reference: Код не несёт устойчивого предсказательного сигнала. Высокая древесная важность возникла из-за удобных случайных разбиений обучающих данных, а неизменное качество после перестановки показывает, что на новых данных модель практически не зависит от этого признака.
  id: 047-cardinality-bias-2
