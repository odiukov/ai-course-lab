- concept: Variance Threshold удаляет признак, если его дисперсия ниже выбранного порога
  question: Что можно достоверно заключить о признаке, который метод Variance Threshold решил удалить?
  explanation: Метод сравнивает дисперсию каждого признака с порогом и не рассматривает целевую переменную или параметры модели. Поэтому удаление говорит только о недостаточной изменчивости признака.
  kind: choice
  options:
    - Его дисперсия ниже заданного порога
    - Он слабо связан с целевой переменной
    - Модель присвоила ему маленький коэффициент
    - Он является копией другого признака
  correct: 0
  id: 008-variance-smysl-1
  fingerprint: 01c82397
- concept: высокая дисперсия не гарантирует предсказательную полезность признака
  question: Почему признак с высокой дисперсией нельзя автоматически считать полезным для предсказания?
  explanation: Variance Threshold обнаруживает постоянные и почти постоянные признаки, но не оценивает связь с целью. Поэтому он подходит для предварительной очистки, однако не заменяет более содержательный отбор признаков.
  kind: open
  reference: Высокая дисперсия означает лишь, что значения признака заметно различаются. Эти различия могут быть случайным шумом и не содержать информации о целевой переменной.
  id: 008-variance-smysl-2
  fingerprint: 60a72fef
