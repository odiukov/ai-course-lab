- concept: целевая функция L1 складывает ошибку прогноза и взвешенную сумму модулей коэффициентов
  question: У линейной модели ошибка прогноза равна 0,14, коэффициенты равны 4 и −1, а alpha = 0,02. Чему равна целевая функция с L1-регуляризацией?
  explanation: Сумма модулей коэффициентов равна |4| + |−1| = 5. Штраф составляет 0,02 × 5 = 0,10, поэтому итоговая величина равна 0,14 + 0,10 = 0,24.
  kind: numeric
  answer: 0.24
  tolerance: 0.001
  id: 039-l1-penalty-1
  fingerprint: 2e0ad94a
- concept: модули в L1-штрафе не позволяют коэффициентам разных знаков взаимно компенсироваться
  question: Почему в L1-регуляризации складывают модули коэффициентов, а не сами коэффициенты?
  explanation: Большие положительный и отрицательный коэффициенты могут дать маленькую обычную сумму, хотя оба заметно влияют на прогноз. Сумма модулей учитывает величину каждого коэффициента независимо от его знака.
  kind: choice
  options:
    - Чтобы отрицательные коэффициенты автоматически считались ошибочными
    - Чтобы коэффициенты разных знаков не компенсировали друг друга в штрафе
    - Чтобы все коэффициенты после обучения стали положительными
    - Чтобы штраф зависел только от числа признаков
  correct: 1
  id: 039-l1-penalty-2
  fingerprint: 6291885d
