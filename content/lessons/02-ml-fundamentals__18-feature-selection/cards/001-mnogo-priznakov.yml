- concept: проклятие размерности делает данные разреженными и повышает потребность в обучающих примерах
  question: Объясни своими словами, почему увеличение числа признаков без соответствующего роста выборки затрудняет поиск устойчивых закономерностей.
  explanation: Высокая размерность разреживает данные и делает близость наблюдений менее информативной. Для надёжного выявления закономерностей модели требуется гораздо больше примеров.
  kind: open
  reference: С каждым новым измерением пространство признаков быстро увеличивается, поэтому наблюдения становятся более разреженными. Имеющихся примеров перестаёт хватать, чтобы надёжно покрыть это пространство и отличить устойчивые зависимости от случайных совпадений.
