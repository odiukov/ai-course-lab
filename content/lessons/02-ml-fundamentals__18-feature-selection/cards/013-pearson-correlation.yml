- concept: знак корреляции задаёт направление линейной связи, а модуль — её силу
  question: Для пары признаков A коэффициент корреляции равен −0,74, а для пары B — +0,46. Какое утверждение верно?
  explanation: Модуль −0,74 больше модуля +0,46, поэтому линейная связь в паре A сильнее. Знак минус означает, что увеличение одной величины связано с уменьшением другой.
  kind: choice
  options:
    - У пары A связь сильнее и положительная
    - У пары B связь сильнее, поскольку её коэффициент положительный
    - У пары A связь сильнее по модулю и отрицательная
  correct: 2
  id: 013-pearson-correlation-1
  fingerprint: 4005cf0d
- concept: близкая к нулю корреляция не исключает выраженную нелинейную зависимость
  question: Между двумя величинами наблюдается чёткая U-образная зависимость, но корреляция Пирсона близка к нулю. Почему это не противоречие?
  explanation: Низкая корреляция говорит об отсутствии выраженной линейной связи, а не об отсутствии любой зависимости. Нелинейная структура при этом может быть сильной.
  kind: open
  reference: Корреляция Пирсона измеряет линейное совместное изменение. В U-образной зависимости один участок убывает, а другой возрастает, поэтому их линейные направления могут компенсироваться.
  id: 013-pearson-correlation-2
  fingerprint: 3e972f29
- concept: корреляция сама по себе не доказывает причинно-следственную связь
  question: В наблюдениях продажи солнцезащитного крема положительно коррелируют с числом солнечных ожогов. Какой вывод обоснован?
  explanation: Корреляция фиксирует совместное изменение, но не устанавливает причину. Жаркая солнечная погода может одновременно увеличивать и продажи крема, и риск ожогов.
  kind: choice
  options:
    - Покупка крема вызывает солнечные ожоги
    - Солнечные ожоги заставляют людей покупать крем заранее
    - Величины изменяются согласованно, но причиной обеих может быть солнечная погода
  correct: 2
  id: 013-pearson-correlation-3
  fingerprint: 0c7bb28a
