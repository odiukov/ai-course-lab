- concept: из сильно коррелированной пары можно сохранить признак с большей взаимной информацией с целью
  question: Модуль корреляции двух признаков превышает заданный порог. Как выбрать, какой из них оставить, если доступна целевая переменная?
  explanation: Попарная корреляция показывает сходство признаков, но не определяет их полезность для цели. Mutual information позволяет оставить участника пары, который несёт больше информации о целевой переменной.
  kind: choice
  options:
    - Оставить признак с меньшим числом уникальных значений
    - Всегда оставлять признак, расположенный левее в таблице
    - Оставить признак с большей взаимной информацией с целью
  correct: 2
  id: 015-correlation-filter-1
  fingerprint: 04329cf2
- concept: корреляционный фильтр завершается, когда среди оставшихся признаков нет пар выше порога
  question: Расположите этапы корреляционного отбора признаков в правильном порядке.
  explanation: Удаление одного признака меняет состав рассматриваемого множества. Поэтому фильтр должен проверять пары среди выживших и останавливаться лишь тогда, когда ни одна такая пара не превышает порог.
  kind: order
  items:
    - Вычислить попарные корреляции признаков
    - Найти среди ещё не удалённых признаков пару, у которой модуль корреляции превышает порог
    - Удалить из найденной пары один признак по выбранному критерию
    - Продолжать проверку выживших признаков, пока нарушающих порог пар не останется
  id: 015-correlation-filter-2
  fingerprint: c175b5cf
