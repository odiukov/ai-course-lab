- concept: нулевой L1-коэффициент дублёра означает отсутствие дополнительной пользы при наличии выбранного признака, а не отсутствие связи с целью
  question: Два почти дублирующих признака A и B хорошо связаны с целью. После обучения с L1-регуляризацией коэффициент A ненулевой, а коэффициент B равен нулю. Какой вывод наиболее обоснован?
  explanation: L1 может оставить одного представителя из группы взаимозаменяемых признаков. Поэтому нулевой вес B показывает его малую добавочную ценность после учёта A, хотя сам B может быть информативен и хорошо предсказывать цель.
  kind: choice
  options:
    - Признак B не связан с целью
    - При наличии A признак B почти не добавляет новой информации модели
    - Признак A причинно влияет на цель, а B — нет
    - Нулевой коэффициент доказывает ошибку в данных признака B
  correct: 1
  id: 043-l1-correlated-1
  fingerprint: 0ab59a5b
- concept: устойчивость сигнала группы дублёров оценивается по выбору хотя бы одного её представителя, а не только по частоте каждого признака
  question: В повторных запусках L1-отбора модель почти всегда выбирает один признак из группы близких дублёров, но конкретный выбранный признак постоянно меняется. Как оценить устойчивость такого сигнала?
  explanation: У взаимозаменяемых признаков индивидуальные частоты выбора распределяются между членами группы. Поэтому отбор каждого столбца может выглядеть неустойчивым, хотя событие «выбран хотя бы один признак из группы» повторяется надёжно.
  kind: open
  reference: Следует рассматривать группу целиком и считать, как часто выбирается хотя бы один её представитель. Низкая частота выбора каждого отдельного признака может быть следствием конкуренции взаимозаменяемых дублёров, тогда как высокая частота выбора группы показывает устойчивость общего сигнала.
  id: 043-l1-correlated-2
  fingerprint: be051e5c
