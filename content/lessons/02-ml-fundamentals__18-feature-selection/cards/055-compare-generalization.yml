- concept: время прогноза оценивают отдельно от затрат на отбор и обучение
  question: Почему при оценке отбора признаков стоит отдельно измерять время прогноза модели?
  explanation: Затраты подготовки возникают при переобучении, а затраты прогноза повторяются при обработке новых объектов. Поэтому одинаковое общее время подготовки не означает одинаковую эксплуатационную эффективность.
  kind: open
  reference: Отбор и обучение относятся к затратам подготовки модели, а прогноз — к её эксплуатации. Сокращённый набор признаков может ускорять каждый прогноз, даже если сам отбор сделал подготовку модели дольше.
  id: 055-compare-generalization-3
  fingerprint: edd57fc7
