- concept: повторные замеры дают более надёжную оценку времени выполнения
  question: Как надёжнее сравнить скорость двух методов отбора признаков?
  explanation: На единичный замер влияют фоновые процессы и случайные колебания нагрузки. Повторные запуски в одинаковых условиях позволяют оценить типичное время и его разброс.
  kind: choice
  options:
    - Выполнить несколько запусков в одинаковых условиях и сравнить агрегированные результаты
    - Сравнить только самые быстрые запуски каждого метода
    - Запустить каждый метод однократно в разное время
    - Оценить скорость по числу строк в реализации
