- concept: формула p^n опирается на независимость шагов и отсутствие восстановления; повтор и проверка результата меняют оценку
  question: Оценка сквозного успеха агента как p^n (p — точность шага, n — длина цепочки) даёт пессимистичный прогноз. При каких допущениях эта формула верна и что в реальном агенте позволяет превзойти её оценку?
  explanation: 'Ключ в двух допущениях: независимость и отсутствие восстановления. Retry и валидация результата поднимают эффективную p; коррелированные ошибки и тихие неверные результаты, наоборот, делают реальность хуже формулы.'
  kind: open
  reference: 'p^n верна, если шаги независимы, каждая ошибка фатальна для остатка цепочки и восстановления нет. Реальный агент часто нарушает эти допущения: он видит результат вызова и может обнаружить провал (ошибка инструмента, пустой результат, неожиданный тип) и повторить шаг или выбрать другой инструмент — тогда эффективная точность шага выше p. Ошибки бывают и коррелированы: плохое описание инструмента валит все обращения к нему, и никакой повтор не помогает. Обратная сторона — ошибки, которые не сигнализируют о себе (правдоподобный, но неверный результат), проходят дальше по цепочке и накапливаются, так что p^n остаётся полезной нижней границей для планирования длины траектории.'
  id: 001-vopros-smenilsya-3
  fingerprint: 8c83b711
