- concept: 'сквозная надёжность цепочки вызовов равна произведению пошаговых точностей: p^n'
  question: 'Агент решает задачу цепочкой из 25 зависимых вызовов инструментов: каждый следующий вызов использует результат предыдущего, любая ошибка ломает остаток цепочки. Точность одного вызова — 0,98, ошибки независимы. Какова вероятность, что агент доведёт задачу до конца?'
  explanation: При независимых шагах сквозная вероятность = p^n = 0,98^25 ≈ 0,60. Пошаговая точность, которая на одном вызове выглядит почти идеальной, на длинной цепочке съедает больше трети запусков — поэтому агентные бенчмарки меряют завершение задачи, а не долю корректных отдельных вызовов.
  kind: numeric
  answer: 0.6
  tolerance: 0.015
  id: 001-vopros-smenilsya-1
  fingerprint: 6dd3012b
- concept: 'смена предмета оценки function calling: от одиночного корректного вызова к длинным агентным траекториям'
  question: Ранние бенчмарки function calling проверяли, выдаст ли модель синтаксически и семантически верный одиночный вызов функции по запросу. Что стало основным предметом оценки в современных агентных бенчмарках?
  explanation: Одиночный корректный вызов — закрытая базовая линия (её показал ещё Toolformer, обучившийся звать инструменты на самообучении). Современный ориентир — длинные агентные цепочки, где отдельно ломаются память о прошлых шагах, частичная наблюдаемость, восстановление после сбоя инструмента и галлюцинация несуществующих инструментов.
  kind: choice
  options:
    - Скорость генерации токенов при выводе JSON-аргументов
    - 'Способность довести многошаговую траекторию до конца: удержать состояние между вызовами, восстановиться после сбоя инструмента и не выдумать несуществующий инструмент'
    - Размер контекстного окна, в которое помещаются описания инструментов
    - Доля вызовов, где имя функции совпадает с эталонным по точному строковому сравнению
