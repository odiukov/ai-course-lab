- concept: 'порядок стадий внутри диспетчера: разрешение имени, приведение аргументов, валидация, исполнение под лимитами'
  question: Диспетчер получил от модели имя инструмента и словарь аргументов. Расставьте стадии обработки одного вызова в порядке исполнения.
  explanation: 'Каждая стадия потребляет результат предыдущей: без разрешённого имени неизвестна схема, по которой приводить; приводить нужно до проверки, иначе валидация забракует строку "7" там, где приведение дало бы целое 7; исполнять можно только проверенные аргументы. Лимиты снимаются с контракта найденного инструмента, поэтому они доступны только после разрешения имени.'
  kind: order
  items:
    - разрешить имя в реестре и получить контракт инструмента
    - привести значения аргументов к объявленным в схеме типам
    - проверить аргументы на обязательность, домен и формат
    - исполнить тело инструмента с таймаутом и лимитом памяти из его контракта
    - вернуть результат исполнения в единой форме наблюдения
  id: 026-dispatch-1
  fingerprint: c418396b
- concept: таймаут, память, сетевой доступ и поверхность чтения/записи — свойства конкретного инструмента, а не общая настройка агента
  question: Агент исполняет инструменты с одним общим таймаутом 30 секунд и одним общим набором прав на файловую систему. Что принципиально теряется при такой схеме?
  explanation: 'Общий лимит всегда настраивается по худшему случаю: если хоть одному инструменту нужны 30 секунд и запись на диск, их получают все. Ограничения (что читается, что пишется, есть ли сеть, сколько секунд и памяти) объявляются в контракте каждого инструмента и применяются точечно. Отсюда и претензия к run_shell: у него поверхность записи — вся файловая система, сузить нечего.'
  kind: choice
  options:
    - 'Ничего не теряется: общая настройка проще и покрывает все инструменты сразу'
    - Права выдаются по максимуму нужд самого требовательного инструмента, поэтому безобидное чтение получает ту же поверхность записи и сети, что и самый опасный вызов
    - Модель перестаёт видеть описания инструментов и чаще выбирает не тот
    - JSON Schema аргументов перестаёт валидироваться
  correct: 1
  id: 026-dispatch-2
  fingerprint: 9a65b946
- concept: гарантии обработки вызова держатся единственностью точки входа, а не дисциплиной разработчика в каждом месте вызова
  question: 'В коде агента инструменты исполняются из трёх мест: основной цикл, ветка повтора после ошибки и обработчик параллельных вызовов. Приведение типов и валидация скопированы в каждое. Почему это считается дефектом архитектуры, а не стилистической претензией?'
  explanation: Свойство, которое обязано выполняться всегда, надёжно только если его физически нельзя обойти. Единственная функция-диспетчер делает пропуск приведения или валидации невозможным по построению, а не по памяти автора. Побочно это даёт одно место для лимитов и одну форму возврата — цикл разбирает единый формат и для успеха, и для отказа.
  kind: choice
  options:
    - Копии кода увеличивают размер контекста, отправляемого модели
    - 'Инвариант «ни один аргумент не доходит до тела инструмента непроверенным» держится дисциплиной в трёх местах: любая правка или новая точка вызова его молча ломает, и отказ вылезает уже трейсбеком из инструмента'
    - Три точки вызова мешают модели выбрать правильный инструмент
    - Параллельные вызовы вообще нельзя обрабатывать отдельной веткой
  correct: 1
  id: 026-dispatch-3
  fingerprint: 6469e9bc
