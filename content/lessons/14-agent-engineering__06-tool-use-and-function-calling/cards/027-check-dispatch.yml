- concept: сужение параметра инструмента переносит выбор адреса/цели из аргумента, который формирует модель, в код, чем сужает сетевую поверхность
  question: Инструмент `http_get(url)` предлагают заменить на `fetch_weather(city)`. Объясни своими словами, какая из мерок песочницы при этом меняется и почему такая замена — не вопрос вкуса.
  explanation: 'Сужение инструмента — это перенос решения из зоны модели в зону кода. Для каждого инструмента прописывают четыре мерки: что читает, что пишет, есть ли сеть, сколько секунд и памяти; замена свободного URL на фиксированный эндпоинт с параметром режет третью из них.'
  kind: open
  reference: 'Меняется сетевая поверхность. У `http_get(url)` адрес запроса задаёт модель — достижимо любое, что видно с машины агента: внутренние сервисы, метаданные облака, произвольный внешний хост, куда можно утечь данные. У `fetch_weather(city)` базовый адрес и путь зашиты в коде, модель управляет только значением одного поля, домен которого проверяется. Выбор цели переехал из аргумента в код, поэтому набор достижимых адресов стал конечным и не зависит от того, что модель напишет в вызове. Заодно уменьшается поверхность чтения: наружу возвращается только погодный ответ, а не произвольное тело ответа.'
  id: 027-check-dispatch-2
  fingerprint: fd0df3b3
