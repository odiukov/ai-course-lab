- concept: инструмент-отказ покрывает непокрытость каталога, а не нехватку аргумента; второй случай требует уточняющего вопроса, иначе выполнимая задача теряется
  question: 'В каталоге есть инструмент-отказ и инструмент `book_meeting(room, start_time)`. Пользователь: «забронируй переговорку». Время не названо. Что должно быть записано в описании инструмента-отказа, чтобы агент повёл себя правильно?'
  explanation: Смешение двух ситуаций даёт разные убытки. «Запрос не покрыт» — конец ветки, действий нет. «Подходящий инструмент есть, не хватает поля» — восстановимо одним уточняющим вопросом, и отказ здесь молча теряет выполнимую задачу. Граница между этими случаями живёт только в описании инструмента-отказа, поэтому она проговаривается там явно.
  kind: choice
  options:
    - Что отказ вызывается всегда, когда валидация аргументов вернула ошибку
    - Что отказ вызывается, только если запрос не покрыт ни одним инструментом; при нехватке аргумента у подходящего инструмента надо запросить недостающее у пользователя
    - Что отказ вызывается, если модель не уверена в выборе между двумя инструментами
    - Что отказ вызывается после исчерпания лимита повторных попыток вызова
