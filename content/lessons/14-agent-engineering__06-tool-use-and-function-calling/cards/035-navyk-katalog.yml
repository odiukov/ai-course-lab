- concept: обязательный аргумент отказа превращает каждый отказ в структурированное наблюдение и делает пробелы каталога измеримыми
  question: 'Инструмент-отказ можно объявить со схемой без аргументов, а можно с обязательным полем `reason: string`. Объясни своими словами, что даёт второй вариант в эксплуатации агента.'
  explanation: Отказ — не тупик, а точка сбора требований. Схема из одного строкового поля стоит дёшево, а даёт и диагностику причин, и материал для расширения каталога.
  kind: open
  reference: 'Отказ без аргументов даёт только счётчик: столько-то запросов агент не смог обслужить, а почему — неизвестно. Обязательный `reason` заставляет модель записать, чего именно не хватило, и превращает каждый отказ в наблюдение, которое проходит через диспетчер и логируется вместе с исходным запросом. Накопленные reason''ы становятся данными о покрытии каталога: если из 400 отказов сотня говорит про погоду и курсы доставки, это готовый список инструментов на добавление. Побочный эффект тот же, что у любого обязательного поля схемы: модель обязана сформулировать причину до вызова, то есть проверить себя, что снижает долю отказов «на всякий случай». Плюс `reason` возвращается в наблюдении и позволяет агенту объяснить пользователю, что именно недоступно.'
