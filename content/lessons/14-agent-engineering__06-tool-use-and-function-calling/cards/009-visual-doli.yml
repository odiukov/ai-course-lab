- concept: малый вес категории в бенчмарке говорит о её насыщенности, а не о её незначимости для продакшена
  question: 'Инженер видит, что в бенчмарке function calling на категорию простых одношаговых вызовов приходится малая доля баллов, и делает вывод: значит, одношаговые вызовы в его сервисе не критичны и тестировать их не нужно. В чём ошибка рассуждения?'
  explanation: 'Два разных вопроса: бенчмарк ранжирует модели, ваши тесты проверяют вашу систему. Насыщенная категория теряет вес в первом и не теряет значимости во втором. В BFCL V4 non-live одиночный вызов стоит 10% не потому, что он не нужен, а потому, что по нему уже никого не отличить.'
  kind: open
  reference: 'Он читает вес как меру важности, а вес — мера различающей способности. Категория получила мало баллов именно потому, что все модели её проходят почти идеально, то есть она максимально важна и при этом уже решена. Для ранжирования моделей она бесполезна, для его сервиса — по-прежнему фундамент, на котором стоят все многоходовые сценарии. Практический вывод другой: выбирая модель, ориентироваться на тяжёлые категории (там разница реальна), но собственные регрессионные тесты на базовые вызовы держать, потому что бенчмарк отвечает на вопрос «какая модель лучше», а не «работает ли мой сервис».'
  id: 009-visual-doli-2
  fingerprint: 51cab657
