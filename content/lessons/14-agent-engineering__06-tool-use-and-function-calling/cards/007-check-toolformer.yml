- concept: 'после дообучения вызов инструмента становится частью языкового моделирования: модель сама эмитит вызов в потоке текста, а не управляется внешним планировщиком'
  question: Toolformer дообучают на корпусе, где выжившие вызовы API вписаны прямо в текст. Что это меняет в том, как модель работает во время инференса, по сравнению с подходом «описать инструменты в промпте и попросить их звать»?
  explanation: Ключ в том, что фильтрация по падению loss встраивает вызовы в само языковое моделирование. Поэтому у фронтир-моделей использование инструментов встроено намертво, а 7B-моделям без отдельного дообучения под инструменты промпт заменить это не может.
  kind: open
  reference: 'Вызов инструмента превращается в обычное продолжение текста: модель предсказывает токены вызова там, где по её же оценке дальше идёт плохо предсказуемый кусок, — решение «звать или нет» встроено в веса, а не задаётся внешней инструкцией. Внешняя система нужна только чтобы исполнить вызов и вернуть результат обратно в поток генерации. Отсюда и практическое следствие: у моделей, прошедших такое обучение, момент вызова выбирается устойчиво, а модели без него держатся только на формулировке промпта.'
