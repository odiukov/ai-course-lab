- concept: 'результат приведения нельзя кодировать sentinel-значением: None или дефолт неотличимы от легитимно приведённого значения, нужен явный признак успеха рядом с результатом'
  question: Функция приведения аргумента должна сообщать вызывающему и результат, и факт неудачи. Какой контракт возврата корректен?
  explanation: '`None` и дефолты — валидные значения аргументов сами по себе, поэтому по одному результату нельзя отличить успех от провала: необязательное поле законно равно `None`, а счётчик законно равен нулю. Явный флаг снимает угадывание по типу. Исключение же вместо наблюдения роняет агентный цикл: модель не получает шанса исправить аргумент на следующем ходу.'
  kind: choice
  options:
    - Возвращать приведённое значение, а при неудаче `None`; вызывающий проверяет результат на `None`
    - 'Возвращать пару: признак успеха и вторым элементом либо значение, либо текст ошибки'
    - Возвращать значение по умолчанию для целевого типа, а неудачу писать в лог
    - Бросать `ValueError` и ловить его try/except в теле каждого инструмента
  correct: 1
