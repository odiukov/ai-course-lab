- concept: приведение типов размещается единой точкой на границе диспетчера, а не заплатками в местах использования значения
  question: Инструмент падает с `TypeError`, потому что модель прислала число строкой. Объясни своими словами, почему приведение выносят в одну функцию на входе диспетчера, а не вставляют `int()` в том месте, где значение используется.
  explanation: Валидация — свойство границы между моделью и системой, а не отдельных функций. Приведение на входе диспетчера превращает проверку типов в контракт, за которым код инструмента может доверять аргументам.
  kind: open
  reference: 'Заплатка чинит один путь исполнения: следующий инструмент, читающий число из аргументов, упадёт так же, и таких мест ровно столько, сколько сигнатур в реестре. Хуже, что `int()` на месте — это не проверка, а второй источник исключений: на неразбираемой строке он выбросит ошибку внутри тела инструмента, где её уже некому превратить в наблюдение для модели. Единая точка на границе даёт три вещи: тело инструмента работает с гарантированно корректными типами и не содержит валидационного кода; все отказы формулируются в одном формате и возвращаются модели как наблюдение, а не как стектрейс; правило приведения (что чинится молча, что отклоняется) описано и меняется в одном месте, а не расползается по кодовой базе разными версиями.'
