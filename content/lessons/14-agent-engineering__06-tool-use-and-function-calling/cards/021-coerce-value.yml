- concept: bool — подтип int в Python, поэтому проверка булева типа обязана предшествовать проверке целого, иначе True тихо проедет как единица
  question: |-
    Функция приведения принимает значение и целевой тип. Схема ждёт integer, модель прислала `True`. Дополни защиту, чтобы булево значение не прошло как целое число:

    ```python
    if isinstance(value, ___):
        return (False, f"expected integer, got boolean {value!r}")
    if isinstance(value, int):
        return (True, value)
    ```
  explanation: 'В Python `bool` наследуется от `int`, и `isinstance(True, int)` истинно. Если сначала спросить про int, `True` превратится в 1, а `False` — в 0, и инструмент получит количество вместо флага. Порядок проверок здесь не стилистика: узкий тип проверяется раньше широкого.'
  kind: cloze
  template: |-
    if isinstance(value, ___):
        return (False, f"expected integer, got boolean {value!r}")
    if isinstance(value, int):
        return (True, value)
  answer: bool
  accept:
    - bool
    - (bool,)
    - (bool)
