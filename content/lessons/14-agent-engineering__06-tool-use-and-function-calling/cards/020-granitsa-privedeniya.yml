- concept: 'допустимость приведения проверяется обратной записью: результат, сериализованный назад, обязан совпасть с исходным литералом'
  question: 'Схема требует `quantity` целым числом. В четырёх разных вызовах пришли строки: `"14"`, `"14 шт."`, `"0014"`, `"3.25"`. Какие из них можно привести молча, если критерий — совпадение обратной записи с исходной строкой?'
  explanation: 'Читаем и записываем назад: 14 → `"14"` совпало, потерь нет. `"0014"` → 14 → `"14"`, ведущие нули пропали; `"14 шт."` → 14 → `"14"`, слово исчезло; `"3.25"` → 3 → `"3"`, дробная часть выброшена. Везде, кроме первого, приведение молча уничтожает часть данных, которую никто не просил выбрасывать, — это отклонение с описательной ошибкой, а не починка.'
  kind: choice
  options:
    - Только `"14"`
    - '`"14"` и `"0014"` — обе дают целое 14'
    - '`"14"`, `"0014"` и `"14 шт."` — во всех случаях число читается однозначно'
    - 'Все четыре: целая часть везде извлекается'
  correct: 0
  id: 020-granitsa-privedeniya-1
  fingerprint: 9a5173da
- concept: молчаливое срезание лишней части аргумента уничтожает диагностический сигнал о том, что модель неверно поняла назначение поля
  question: Валидатор может срезать хвост и превратить `"12 коробок молока"` в целое 12 для поля `quantity`. Кроме потери данных, чем плох такой молчаливый разбор? Объясни своими словами.
  explanation: Приведение — распознавание уже написанного значения, а не догадка о недописанном. Догадка не только рискует ошибиться, она ещё и прячет от вас класс отказа «модель не поняла поле».
  kind: open
  reference: 'Лишний текст в числовом поле — сигнал, что модель могла неправильно понять контракт поля: решила, что сюда пишут описание позиции заказа, а не количество. Срезав хвост, вы получаете формально валидный вызов и теряете единственное свидетельство сбоя: заказ на 12 чего-то неопределённого уйдёт дальше в систему, а причина — плохое описание поля или неверный выбор инструмента — останется невидимой. Отклонение со структурированным наблюдением и чинит текущий вызов (модель переспросит/исправится на следующем ходу), и оставляет ошибку видимой в логах.'
  id: 020-granitsa-privedeniya-2
  fingerprint: a639a641
- concept: приведение опирается на заранее объявленную грамматику литералов типа, а не на понятность чтения человеку
  question: Поле `active` объявлено булевым. В одном вызове пришло `"true"`, в другом — `"да"`. Человеку понятны оба. Почему валидатор вправе принять первое и обязан отклонить второе?
  explanation: Граница проходит по объявленному контракту разбора, а не по интуиции. Для `"true"` правило чтения существует и обратная запись даёт тот же литерал. Для `"да"` словаря нет — приняв его, вы негласно расширяете схему и дальше будете вечно спорить, входят ли туда `"ага"`, `"yep"`, `"1"`. Нужны такие значения — объявите их в схеме явно, тогда это уже не догадка.
  kind: choice
  options:
    - '`"да"` длиннее и содержит не-ASCII символы, такие значения небезопасны'
    - '`"true"` — литерал булева типа с объявленной грамматикой разбора, а отображения `"да" → true` вы нигде не определяли: это ваша догадка, а не чтение'
    - '`"да"` невозможно распознать программно'
    - 'Оба надо принимать: смысл однозначен в обоих случаях'
  correct: 1
  id: 020-granitsa-privedeniya-3
