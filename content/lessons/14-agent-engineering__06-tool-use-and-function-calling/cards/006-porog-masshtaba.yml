- concept: порог масштаба обходится дообучением под инструменты или сменой модели, но не промпт-инжинирингом
  question: Локальная модель среднего размера стабильно ошибается с вызовами инструментов, и это диагностировано как ограничение способностей модели. Какое вмешательство адресует причину?
  explanation: У фронтир-моделей использование инструментов встроено в предобучение, поэтому там ничего доделывать не нужно. Модели ниже порога получают этот навык только целевым дообучением под инструменты либо заменяются на модель побольше. Варианты про промпт и температуру не меняют способности модели, а именно она здесь ограничивающий фактор.
  kind: choice
  options:
    - Добавить в системный промпт больше few-shot примеров вызовов и ужесточить формулировки
    - Сузить температуру сэмплирования и увеличить количество доступных инструментов
    - Дообучить модель отдельно под использование инструментов или взять модель большего размера
    - Переписать описания инструментов в императивном тоне
