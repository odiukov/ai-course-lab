- concept: надёжный вызов инструмента требует оценки собственной неуверенности, а слабый предсказатель текста плохо оценивает и границу своих знаний
  question: Объясни своими словами, почему способность вовремя вызвать инструмент связана с общим качеством предсказания текста у модели, а не является отдельным независимым навыком.
  explanation: 'Ровно тот же сигнал лежит в основе отбора у Toolformer: вызов оставляли там, где результат инструмента снижал loss на следующем токене. Применить этот навык — значит поймать момент нехватки знаний изнутри. Способность к такому самооцениванию растёт вместе с общим качеством языкового моделирования, поэтому tool use и проявляется только с масштабом.'
  kind: open
  reference: 'Решение «вызвать инструмент» — это по сути оценка собственной неуверенности: модель должна понять, что здесь она сама не дотянет. Такая оценка опирается на то же распределение следующего токена, что и обычная генерация. Модель, которая в целом плохо предсказывает текст, плохо предсказывает и то, где именно ей не хватит знаний, поэтому дёргает инструмент вслепую: на арифметике считает сама и врёт, на тривиальном факте лезет в поиск. Доступ к инструментам добавляет ей вариантов действия, но не добавляет критерия выбора момента — отсюда и отрицательный эффект ниже порога масштаба.'
  id: 006-porog-masshtaba-2
