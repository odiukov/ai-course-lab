- concept: структурированный вывод по схеме предпочтён договорённости о формате в свободном тексте, потому что даёт машинно-проверяемый контракт с локализацией ошибки до конкретного поля
  question: 'Инструменты можно было бы вызывать проще: попросить модель писать в свободном тексте строку вида `CALL: search(query=..., limit=...)` и разбирать её регуляркой. Объясни, почему вместо этого вызов оформляют структурированным выводом с JSON Schema.'
  explanation: 'Ключевое слово в определении function calling — «с валидацией по схеме». Схема не принуждает модель, но даёт локальной проверке точный предмет: какое поле, какое значение, какое допустимое множество. Именно эта локализация делает отказ восстановимым за один повторный ход.'
  kind: open
  reference: 'Схема — машинно-проверяемый контракт: у каждого аргумента объявлены тип, домен и обязательность, поэтому отказ локализуется до конкретного поля («limit должен быть целым») и возвращается модели как пригодное для исправления наблюдение. Разбор свободного текста подтверждает только форму строки: типов нет, пропущенное поле неотличимо от опечатки, вложенные структуры и кавычки разбираются неоднозначно, а ошибка выглядит как общий «не удалось распарсить». Плюс структурированный канал отделён от обычного текста ответа — модель не может случайно «вызвать» инструмент, процитировав пример, и наоборот.'
  id: 036-quiz-3
  fingerprint: 4f04b6e0
