- concept: 'результат инструмента доходит до модели только следующим проходом: один вызов модели не видит исхода собственного вызова'
  question: Расставь по порядку обмен между моделью и рантаймом при работе одного инструмента.
  explanation: 'Модель не получает результат внутри того же ответа, где вызвала инструмент: нужен второй проход по модели. Отсюда и цена цепочек — каждый инструмент в траектории это ещё один полный ход, и отсюда же требование связывать результат с вызовом по идентификатору, а не по позиции.'
  kind: order
  items:
    - 'Модель эмитит вызов инструмента: имя, аргументы, идентификатор вызова'
    - Рантайм валидирует аргументы по схеме и исполняет инструмент под его лимитами
    - Результат уходит модели отдельным сообщением с тем же идентификатором вызова
    - Модель делает следующий ход, уже видя результат инструмента
