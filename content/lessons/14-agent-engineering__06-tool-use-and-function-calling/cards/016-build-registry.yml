- concept: запрос несуществующего имени инструмента — восстановимый отказ модели, поэтому реестр возвращает наблюдение со списком доступных имён, а не исключение
  question: Модель эмитит вызов инструмента с именем `serch`, которого в реестре нет. Что должен вернуть диспетчер?
  explanation: Опечатка или выдуманное имя — это галлюцинация инструмента, класс отказа самой модели, а не поломка кода. Модель способна исправиться на следующем ходу, если наблюдение содержит и факт промаха, и список допустимых имён. Исключение обрывает цикл и лишает модель шанса на вторую попытку; пустой результат хуже всего — он выдаёт ошибку за успех. Автоподстановка похожего имени превращает промах в тихий неверный вызов.
  kind: choice
  options:
    - Строку-наблюдение о том, что такого имени нет, с перечнем зарегистрированных имён
    - Исключение, прерывающее выполнение агента
    - Пустой результат, как если бы инструмент отработал без данных
    - Результат ближайшего по написанию инструмента
  correct: 0
