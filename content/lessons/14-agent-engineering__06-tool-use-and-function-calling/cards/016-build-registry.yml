- concept: 'форма отказа выбирается по тому, кто способен его починить: контрактные ошибки разработчика — краш на старте, ошибки модели — наблюдение в цикле'
  question: 'Реестр инструментов сталкивается с двумя ошибками: дублирующимся именем при регистрации и обращением к незарегистрированному имени во время работы. Объясни, по какому критерию выбирают форму реакции на каждую.'
  explanation: 'Один и тот же реестр обязан вести себя противоположным образом в двух ситуациях, и различает их не тяжесть, а авторство ошибки. Практическая проверка: зарегистрировать пару одноимённых инструментов — процесс должен умереть; запросить несуществующее имя — должна вернуться строка. Одинаковое поведение в обоих случаях означает, что реестр недоделан.'
  kind: open
  reference: 'Критерий — адресат ошибки, то есть тот, кто способен её устранить. Дублирующееся имя закладывает разработчик в коде регистрации; модели тут исправлять нечего, а ошибка обнаружима до приёма первого запроса — значит громкое падение на старте, дешёвое и однозначное. Обращение к несуществующему имени порождает модель в момент вывода; это восстановимый отказ, и её нужно снабдить обратной связью — структурированным наблюдением с фактом промаха и списком доступных имён. Отсюда правило: контрактные и конфигурационные нарушения падают как можно раньше и как можно громче, а ошибки в содержании вызова возвращаются в контекст модели как данные для следующей попытки. Смешение форм даёт две типовые беды: тихая перезапись прячет дефект конфигурации до пятнадцатого шага траектории, а исключение на опечатку убивает прогон там, где хватило бы одного дополнительного хода.'
  id: 016-build-registry-3
  fingerprint: 1667aab3
