- concept: 'переводчик провайдера двунаправлен: он не только сериализует объявление вниз, но и разбирает ответ провайдера обратно в каноническую форму вызова'
  question: Расставь путь одного вызова инструмента в агенте с каноническим каталогом и слоем трансляции под провайдера.
  explanation: 'Слой трансляции работает в обе стороны, и это главное: без обратного разбора остальной агент (реестр, валидатор, диспетчер) пришлось бы писать заново под каждого провайдера. При двустороннем переводчике смена провайдера меняет только его, каталог и цикл агента не трогаются.'
  kind: order
  items:
    - 'Инструмент объявлен один раз в канонической форме: имя, описание, схема аргументов'
    - Переводчик провайдера переливает каноническое объявление в формат этого провайдера и кладёт в запрос
    - Провайдер возвращает вызов инструмента в своей форме — со своими именами полей и своей обёрткой
    - Переводчик разбирает ответ обратно в каноническую форму вызова (имя + словарь аргументов)
    - Реестр находит функцию по имени, диспетчер валидирует аргументы и исполняет
