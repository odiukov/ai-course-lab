- concept: бенчмарк перед релизом гоняется по собственной сборке агента как регрессионный тест системы, а не читается как таблица лидеров моделей
  question: Команда собирается брать модель с верхней строки публичной таблицы BFCL и на этом закончить проверку использования инструментов. Объясни своими словами, что даёт прогон BFCL по собственному агенту перед релизом и почему таблица лидеров это не заменяет.
  explanation: BFCL перед релизом — это тест, а не витрина. Если использование инструментов центрально для продукта, единственная цифра из чужой таблицы ничего не говорит о твоих 26 инструментах и твоём цикле; собственный прогон ловит провалы на своей нагрузке и служит базовой линией для следующих изменений.
  kind: open
  reference: 'Таблица лидеров измеряет модель на чужих инструментах и чужих промптах. В проде отказывает система целиком: конкретные описания инструментов, схемы аргументов, системный промпт, оркестрация цикла, обработка ошибок. Прогон бенчмарка по своей сборке — это регрессионный тест этой системы: он показывает, где разваливаются длинные многоходовые траектории, где агент зовёт несуществующий инструмент вместо воздержания, где ломается динамический выбор следующего шага по результату предыдущего. Смысл ровно тот же, что у любого теста: узнать про свои провалы от бенчмарка, а не от пользователей в день запуска. Плюс прогон даёт базовую линию, с которой сравниваются следующие релизы и смена провайдера.'
  id: 034-multiprovayder-3
