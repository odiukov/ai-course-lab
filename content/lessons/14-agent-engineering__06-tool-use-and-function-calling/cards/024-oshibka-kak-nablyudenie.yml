- concept: исключение при отказе валидации лишает модель сигнала об отказе, поэтому стоимость восстановления переносится с цикла агента на человека
  question: Траектория из 60 шагов, на 9-м шаге валидация аргумента отклоняет вызов, и код делает `raise ValueError`. Что при этом получает модель?
  explanation: Исключение уходит вверх по стеку приложения, а не в диалог. Модель остаётся с невыполненным вызовом и без единого байта информации о причине, поэтому оставшийся 51 шаг не выполняется. Смысл наблюдения не в мягкости формулировки, а в том, что отказ едет по каналу, который модель читает.
  kind: choice
  options:
    - 'Ничего: она ждала результат вызова, результат не пришёл, траектория оборвана и чинить её будет человек'
    - Текст исключения, поскольку рантайм автоматически докладывает его в контекст следующего хода
    - Пустой результат, который она распознаёт как отказ и повторяет вызов
    - Сообщение об ошибке, но только если исключение перехвачено на 60-м шаге
