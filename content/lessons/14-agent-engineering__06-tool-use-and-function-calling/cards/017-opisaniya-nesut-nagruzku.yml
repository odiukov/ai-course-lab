- concept: 'отсутствие ограничений в описании модель читает как разрешение, а не как нехватку информации: пустое описание — максимально широкий контракт, а не нейтральный'
  question: 'Инструменту оставили описание из одного слова: `"Search"`. Объясни, почему это не «нейтральный дефолт», а конкретное поведение, и какое именно.'
  explanation: 'Ключ: у описания нет режима «молчу». Всё, что оно не запретило, остаётся разрешённым, потому что других источников знания об уместности у модели нет — тело функции ей недоступно.'
  kind: open
  reference: 'Модель выбирает инструмент по объявленному контракту, и описание — единственное место, где может стоять условие применимости. Если условий нет, ни один запрос не отсекается: слово «Search» формально покрывает и арифметику, и факты, которые модель и так знает. То есть пустое или односложное описание задаёт не «нет информации», а самое широкое разрешение — «зови когда угодно». Сузить область можно только явными условиями: когда инструмент применим и для чего его использовать не надо.'
  id: 017-opisaniya-nesut-nagruzku-2
  fingerprint: f592dd8e
- concept: 'починка отказа «выбран не тот инструмент» ставится как контролируемое изменение: фиксируются имя, схема и промпт, варьируется только текст описания'
  question: Модель систематически зовёт не тот инструмент. Расставь шаги проверки гипотезы «дело в описании» по порядку.
  explanation: Смысл порядка — изоляция переменной. Если вместе с описанием поменять имя или схему, причину улучшения приписать будет нечему. Сначала смотрим фактический контракт (часто там не то, что в голове у разработчика), потом меняем одну строку, потом измеряем на том же наборе промптов.
  kind: order
  items:
    - Достать из реестра ровно тот текст описания, который ушёл модели в контракте
    - Дописать в описание условия применимости и явные случаи, когда инструмент звать не следует
    - Прогнать те же промпты, оставив имя инструмента и input_schema без изменений
    - Сравнить долю неверных выборов до и после и убедиться, что изменилась только она
