- concept: чтобы отличить деградацию от длины траектории от дефекта конкретного инструмента, длину варьируют при фиксированных инструментах и промптах
  question: Расставь шаги эксперимента, который отделяет дрейф на длинной траектории от дефекта конкретного инструмента.
  explanation: Дрейф после долгих цепочек — отдельный класс отказа, и его нельзя увидеть, тестируя вызовы по одному. Единственная изменяемая переменная — длина; всё остальное держат постоянным, иначе разницу в успехе не на что списать. Если короткая версия стабильна, а длинная сыпется, дефект не в инструменте и не в его описании.
  kind: order
  items:
    - Зафиксировать набор инструментов, их описания и формулировку задачи — менять только длину траектории
    - Прогнать задачу в короткой версии (около 7 вызовов) много раз и замерить долю успешных прогонов
    - Прогнать эквивалентную по инструментам задачу в длинной версии (около 45 вызовов) столько же раз и замерить долю успеха
    - 'Сравнить доли: провал только в длинной версии при исправной короткой указывает на накопление ошибок, а не на плохой инструмент'
  id: 012-chetyre-mesta-provalov-2
  fingerprint: 350523fc
- concept: плавающая между прогонами точка отказа свидетельствует о накоплении ошибки, а детерминированная — о дефекте схемы или описания инструмента
  question: Один и тот же сценарий агента ломается на 41-м вызове в первом прогоне и на 36-м во втором, при одинаковых входных данных. О чём говорит сам факт, что точка отказа плавает?
  explanation: 'Детерминированный дефект — кривое описание, неверный тип аргумента, битая схема — ломается воспроизводимо в одной и той же точке. Разброс точки отказа при одинаковом входе означает, что до неё траектория деградировала постепенно: терялся контекст, копились неточные аргументы, накапливался дрейф. Поэтому правка текста описания такой отказ не устраняет — он просто уезжает на другой номер шага.'
  kind: choice
  options:
    - 'Об ошибке в JSON-схеме инструмента: она проявляется случайно'
    - О накоплении ошибки вдоль траектории — отказ вызревает постепенно, а не срабатывает на конкретном детерминированном дефекте описания
    - О том, что инструмент возвращает данные в неверной кодировке
    - О том, что параллельные вызовы перепутали tool_use_id
  correct: 1
