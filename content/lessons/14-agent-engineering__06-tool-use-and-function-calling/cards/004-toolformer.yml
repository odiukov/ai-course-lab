- concept: 'разметка вызовов инструментов в Toolformer self-supervised: кандидатов вписывает сама модель в уже существующий текст, людей-аннотаторов нет'
  question: Toolformer дообучают на корпусе, где обращения к API уже вписаны прямо в текст. Откуда берётся эта разметка?
  explanation: 'Метод обходит аннотаторов целиком: берётся текст, который и так лежит в предобучающем наборе, и модель расставляет в нём кандидатов на вызовы калькулятора, QA-системы, поиска, переводчика, календаря. Ручная разметка тут нежизнеспособна дважды: аннотаторы не сходятся во мнении, нужен ли инструмент в конкретном месте, и объёма не набрать. Синтетика вокруг вызовов — другой подход, не этот.'
  kind: choice
  options:
    - Большая команда аннотаторов размечает корпус вручную, спорные места решают голосованием
    - Разметку выгружают из логов реальных вызовов API в продакшене
    - Модель сама вписывает кандидатов на вызовы в обычный предобучающий текст, человеческих меток нет вообще
    - Инструменты генерируют синтетические предложения вокруг своих вызовов, и этот синтетик становится корпусом
  correct: 2
  id: 004-toolformer-1
  fingerprint: 72708bd3
- concept: 'пайплайн Toolformer: щедрая генерация кандидатов, исполнение, фильтрация, дообучение на выжившем'
  question: Расставь этапы построения обучающего корпуса Toolformer в правильном порядке.
  explanation: 'Схема generate-then-filter: на первом этапе гонятся за полнотой (кандидатов много, качество не важно), на втором — за точностью (жёсткий отбор режет большинство). Порядок критичен: фильтровать нечего, пока кандидат не исполнен, а дообучение идёт только по тому, что выжило. После дообучения вызов инструмента становится частью того, как модель продолжает фразу, а не отдельным навыком поверх.'
  kind: order
  items:
    - Взять сырой текст из предобучающего корпуса, без каких-либо меток о вызовах
    - Дать модели щедро, почти наугад, вписать кандидатов на вызовы инструментов прямо в строки текста
    - Выполнить каждого кандидата и получить фактический результат инструмента
    - Прогнать кандидатов через фильтр полезности и выбросить тех, кто его не прошёл
    - Дообучить модель на отфильтрованном корпусе, где выжившие вызовы остались вписанными в текст
  id: 004-toolformer-2
  fingerprint: ee625530
- concept: 'использование инструментов — эмерджентное свойство масштаба: ниже порога разметка инструментов модели вредит'
  question: Локальная модель на 4 млрд параметров дёргает инструменты не к месту и путает их между собой. Инженер пятый раз переписывает описания инструментов и системный промпт — эффекта нет. Что об этой ситуации говорит результат Toolformer про масштаб и что делать вместо переписывания промптов?
  explanation: 'Ключ — что это эмерджентное по масштабу свойство, а не дефект промпта. У фронтир-моделей 2026 года использование инструментов вшито в предобучение, поэтому им хватает описаний; у мелких моделей его надо ставить отдельным дообучением. Отличить одно от другого просто: если тот же набор инструментов с теми же описаниями надёжно работает на большой модели, дело в модели.'
  kind: open
  reference: 'Toolformer показал, что использование инструментов проявляется с размером модели: крупным моделям разметка вызовов помогает, маленьким — вредит, они не понимают, когда инструмент вообще уместен. Значит проблема лежит не в формулировках промпта, а ниже порога масштаба, и правки описаний её не снимут. Реальные варианты два: дообучить малую модель специально под использование инструментов (большинству моделей масштаба нескольких миллиардов параметров это нужно, чтобы быть надёжными) либо взять модель побольше, где использование инструментов встроено в предобучение.'
  id: 004-toolformer-3
  fingerprint: 1d352bf7
