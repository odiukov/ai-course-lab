- concept: 'ошибка сопоставления пар «вызов — результат» относится к классу тихих отказов: исполнение успешно, исключения нет, дефект виден только по содержанию ответа'
  question: Рантайм перепутал местами два результата в батче параллельных вызовов и вернул их модели. Объясни своими словами, почему этот дефект опаснее падения инструмента с исключением и что из этого следует для тестирования.
  explanation: Ключевое различие — наблюдаемость отказа. Громкий отказ восстановим внутри цикла агента; тихий уходит в ответ пользователю. Поэтому склейка пар — код, требующий явного теста на перемешанный порядок возврата, а не просто аккуратности при написании.
  kind: open
  reference: 'При падении инструмента отказ громкий: рантайм получает исключение, модель получает наблюдение об ошибке и может повторить вызов. Перепутанное сопоставление не даёт никакого сигнала об отказе: оба вызова выполнились успешно, оба результата валидны по форме, схема не нарушена. Модель не имеет доступа к тому, какой запрос породил какой ответ, кроме идентификатора, — проверить подмену ей нечем, и она уверенно выдаёт корректно оформленный, но фактически неверный ответ. Отсюда: корректность сопоставления нельзя проверять по факту отсутствия ошибок в логах, её нужно тестировать отдельно — например, прогоном батча, где результаты намеренно возвращаются в порядке, обратном порядку вызовов, и проверкой, что каждая пара «вызов — результат» сошлась по идентификатору.'
