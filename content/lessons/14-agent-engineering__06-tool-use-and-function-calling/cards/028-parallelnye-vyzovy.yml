- concept: в один параллельный батч попадают только вызовы, аргументы которых не зависят от результатов друг друга; зависимость по данным принудительно сериализует ход
  question: Какой набор вызовов НЕЛЬЗЯ выдать одним параллельным батчем в одном ходу ассистента?
  explanation: 'Параллелить можно только то, что не связано по данным. Во втором наборе аргумент второго вызова физически не существует, пока не вернулся первый результат, — это зависимость, и модели придётся потратить два хода. Остальные наборы независимы: одинаковое имя инструмента параллельности не мешает, мешает только зависимость по данным.'
