- concept: перечень допустимых значений аргумента объявляется ключом enum внутри определения самого свойства, а не на уровне схемы
  question: Инструмент погоды принимает аргумент units только из двух допустимых значений. Какой ключ стоит на месте пропуска?
  explanation: 'enum — ограничение конкретного свойства, поэтому живёт рядом с type и description этого свойства, внутри его объекта. Вынесенный на уровень схемы enum ограничивал бы весь объект аргументов целиком и никак не сузил бы units: модель получила бы право слать любую строку.'
  kind: cloze
  template: |-
    "input_schema": {
      "type": "object",
      "properties": {
        "units": {"type": "string", "___": ["metric", "imperial"]}
      },
      "required": ["units"]
    }
  answer: enum
  accept:
    - enum
    - '"enum"'
    - '''enum'''
  id: 014-make-tool-1
  fingerprint: f0c6ec44
- concept: имена в required не проверяются на существование среди properties — несуществующее имя даёт не ошибку, а неисполнимое ограничение и невынужденный аргумент
  question: В контракте инструмента свойство описано как query, а в списке required по опечатке стоит querry. Что произойдёт при вызове API провайдера?
  explanation: 'JSON Schema не требует, чтобы имена в required встречались в properties: required лишь говорит «этот ключ обязан присутствовать». Ключ querry нигде не описан, модели о нём неизвестно, а query из-под требования выпал. Ошибки нет ни на стороне Python, ни на стороне провайдера — отказ проявится только как странное поведение модели в диалоге. Отсюда смысл собственной проверки на этапе сборки контракта: сравнить множество имён из required с ключами properties и упасть сразу.'
  kind: choice
  options:
    - 'Провайдер вернёт ошибку валидации схемы: имя в required не найдено среди properties'
    - 'Запрос пройдёт, но требование окажется бессмысленным: query перестаёт быть обязательным, и модель может вызвать инструмент без него'
    - Провайдер молча переименует свойство query в querry и потребует его
    - Модель откажется вызывать инструмент, пока не получит непротиворечивую схему
  correct: 1
  id: 014-make-tool-2
  fingerprint: 1c5bfcd5
- concept: контракт инструмента передаётся по сети как JSON, поэтому его значения обязаны быть JSON-типами, а не произвольными объектами языка
  question: Контракт инструмента собирается кодом, и в схему аргумента случайно попал объект Python — например, член класса Enum вместо строки, или множество вместо списка. Объясни своими словами, почему это ломается и на каком шаге проявится.
  explanation: 'Схема — данные для передачи, а не структура в памяти процесса. Всё, что не выражается JSON-типами, обязано быть приведено к ним на границе: члены Enum — к своим строковым значениям в списке enum, множества — к спискам. json.dumps на собранном контракте воспроизводит ту же проверку локально и переносит отказ с сетевого вызова на момент сборки.'
  kind: open
  reference: 'Контракт уезжает провайдеру как тело HTTP-запроса, то есть сериализуется в JSON. В JSON есть только объекты, массивы, строки, числа, булевы значения и null. Член Enum, множество, datetime, произвольный экземпляр класса ни в один из этих типов не отображаются, поэтому сериализация падает с TypeError ещё до сети — либо, если сериализатор настроен снисходительно, уезжает искажённое представление, которое провайдер отвергнет как невалидную схему. Проявится это на первом же реальном вызове, а не при сборке словаря, потому что сама сборка объект просто кладёт в словарь и ни о чём не спрашивает. Дешёвая проверка — прогнать готовый контракт через json.dumps сразу после сборки: это ровно та операция, которую потом выполнит клиент провайдера.'
  id: 014-make-tool-3
  fingerprint: db499ad6
