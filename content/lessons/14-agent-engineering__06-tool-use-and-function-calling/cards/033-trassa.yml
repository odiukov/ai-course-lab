- concept: 'негативный тест реестра ставится как изоляция одиночного дефекта: за прогон портится ровно один аргумент при остальных валидных, чтобы отказ атрибутировался конкретной ветке, а критерием приёмки служит успешный повторный вызов модели'
  question: Расставьте по порядку шаги проверки реестра инструментов намеренной порчей вызова.
  explanation: 'Порча сразу нескольких элементов даёт неатрибутируемый отказ: непонятно, какая проверка сработала первой и чьё сообщение вы читаете. Отсюда правило одного дефекта на прогон и обход веток по одной. Критерий приёмки — не факт отклонения (отклонить умеет и `ValidationError: bad input`), а то, что модель по наблюдению собрала корректный вызов при повторной попытке.'
  kind: order
  items:
    - Выбрать одну ветку отказа для проверки (пропуск обязательного поля, неверный тип, значение вне enum, несуществующее имя инструмента)
    - Собрать вызов, в котором испорчен ровно один элемент, а все остальные аргументы валидны
    - Прогнать вызов через реестр и получить наблюдение об отказе в том же канале, куда приходят обычные результаты
    - 'Прочитать текст наблюдения как вход модели: названы ли инструмент, поле, полученное значение и допустимое множество'
    - Отдать наблюдение модели и проверить, что повторный вызов собран правильно
    - Повторить цикл для следующей ветки отказа
