- concept: 'галлюцинация инструмента и неверный аргумент — разные классы отказа: в первом функции нет в описанном наборе, во втором она есть, но вызвана криво'
  question: Агенту описаны инструменты `create_refund(order_id, amount)` и `get_order(order_id)`. В трассировке он выдаёт вызов `refund_order(order_id="A-317")`. К какому классу отказов это относится?
  explanation: '`refund_order` не существует — агент придумал имя. Отдельная категория, которую бенчмарки вроде BFCL меряют отдельной долей трассировок. Неверный аргумент выглядел бы как `create_refund(order_id="A-317")` без обязательного `amount`: функция реальная, вызов кривой. Лечится это разными вещами: галлюцинация — жёсткой валидацией имени по схеме, кривой аргумент — валидацией сигнатуры и понятным описанием полей.'
  kind: choice
  options:
    - 'Неверный аргумент: имя поля должно быть другим'
    - 'Галлюцинация инструмента: вызванной функции нет в описанном наборе'
    - 'Отказ восстановления: инструмент вернул ошибку и агент не повторил вызов'
    - 'Частичная наблюдаемость: агент не видел состояния заказа'
  correct: 1
  id: 003-check-problema-1
  fingerprint: f4695a0e
- concept: 'провал памяти и частичная наблюдаемость — разные причины: в одном случае факт был в контексте и потерян, в другом он вообще не попадал в наблюдения агента'
  question: Агент управляет деплоем. Он запускает раскатку, хотя релиз уже помечен как заблокированный. Объясни, чем провал памяти отличается здесь от частичной наблюдаемости и как отличить одно от другого по трассировке.
  explanation: Симптом один — неверное действие, лечение противоположное. Расширять контекст бесполезно, если факт в него никогда не попадал; добавлять инструмент чтения бесполезно, если данные уже приходили и потерялись.
  kind: open
  reference: 'Провал памяти: флаг блокировки уже был в трассировке — например, вернулся ответом инструмента на седьмом шаге, — но к тридцатому шагу выпал из рабочего контекста, и агент действует так, будто его не было. Частичная наблюдаемость: флага в трассировке нет вовсе, ни один вызванный инструмент его не возвращал, состояние мира шире того, что агент способен увидеть доступными инструментами. Отличать по трассировке: искать, встречался ли факт хоть раз в наблюдениях. Встречался и потерян — память, чинится сжатием/внешним хранилищем состояния и переносом ключевых фактов вперёд. Не встречался — наблюдаемость, чинится добавлением инструмента чтения или обязательной перепроверкой состояния перед действием.'
  id: 003-check-problema-2
  fingerprint: f4141fc5
- concept: корректное поведение при отсутствии подходящего инструмента — воздержаться от вызова, и именно это проверяет категория галлюцинаций в бенчмарке
  question: В бенчмарке функционального вызова есть категория задач, где запрос пользователя намеренно не покрывается ни одним из предоставленных инструментов. Что засчитывается как правильный ответ модели?
  explanation: 'Категория меряет воздержание. Модель, которая всегда что-то вызывает, набирает на таких задачах ноль и в продакшене тихо портит состояние: вызов «ближайшего похожего» инструмента — тот же класс отказа, что и выдуманное имя функции. Отдельная доля трассировок в наборе нужна именно потому, что обычные метрики точности вызова этот режим не ловят.'
  kind: choice
  options:
    - Вызвать наиболее близкий по смыслу инструмент из доступных
    - Не вызывать ничего и сообщить, что подходящего инструмента нет
    - Вызвать инструмент с пустыми аргументами и дождаться ошибки
    - Сгенерировать описание недостающего инструмента и вызвать его
  correct: 1
