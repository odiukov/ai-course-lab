- concept: процедура оценки по состоянию требует реального исполнения траектории в песочнице с рабочим API и изоляции прогонов друг от друга
  question: Расставь шаги оценки агента по конечному состоянию (state-based) в правильном порядке.
  explanation: 'Ключевое отличие от сравнения строк: вызовы обязаны исполняться по-настоящему, поэтому нужен рабочий API и сброс состояния перед каждым прогоном — иначе результаты прогонов текут друг в друга. Плата за это — дороже и медленнее, чем сравнение AST; выигрыш — оценивается результат, а не текст вызова.'
  kind: order
  items:
    - Привести песочницу с рабочим API в фиксированное начальное состояние
    - Прогнать всю траекторию агента, реально исполняя каждый его вызов на этом API
    - Считать фактическое состояние API после прогона (существует ли объект, каков остаток, снят ли статус)
    - Сравнить полученное состояние с целевым и выставить зачёт/незачёт независимо от формы вызовов
  id: 010-otsenka-po-sostoyaniyu-2
  fingerprint: 8932ce72
- concept: ассерт по строке вызова хрупок к рефакторингу инструмента и слеп к побочным эффектам; ассерт по состоянию системы — наоборот
  question: Ты пишешь регрессионные тесты для агента, который управляет файловым хранилищем и календарём. Объясни, почему ассерт вида «агент вызвал upload_file с аргументом path=...» плох, и на что его заменить.
  explanation: 'Это то же правило, по которому устроена оценка по состоянию в BFCL: проверяется система после прогона, а не протокол вызовов. Полезно ассертить не только целевой факт, но и отсутствие лишних изменений — иначе вредный побочный эффект пройдёт незамеченным.'
  kind: open
  reference: 'Такой ассерт проверяет форму вызова. Он ломается от переименования аргумента, смены сигнатуры инструмента или эквивалентного разложения работы на другие вызовы — то есть падает там, где поведение не изменилось. И наоборот, он молчит про побочные эффекты: агент мог загрузить файл, а следующим шагом удалить его или затереть чужой — форма первого вызова всё равно совпала. Заменять нужно на ассерт по состоянию системы после прогона: файл существует по нужному пути и с нужным содержимым, лишних объектов в каталоге нет, событие в календаре создано на нужное время. Тогда тест переживает рефакторинг инструментов и ловит реальную потерю данных.'
  id: 010-otsenka-po-sostoyaniyu-3
