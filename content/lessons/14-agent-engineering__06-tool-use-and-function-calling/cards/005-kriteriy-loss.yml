- concept: выигрыш кандидата измеряется как разность loss на верном следующем токене без результата инструмента и с ним
  question: Кандидат на вызов калькулятора проверяется по Toolformer-критерию. Без подставленного результата модель даёт верному следующему токену вероятность 0.02, с подставленным результатом — 0.55. Насколько упал кросс-энтропийный loss на этом токене (в натуральных логарифмах)?
  explanation: 'Loss на одном токене = -ln p. Без инструмента: -ln(0.02) ≈ 3.91. С инструментом: -ln(0.55) ≈ 0.60. Падение ≈ 3.31 нат. Кандидат сравнивается с порогом: превысил — аннотация остаётся в корпусе для дообучения, не превысил — выбрасывается.'
  kind: numeric
  answer: 3.31
  tolerance: 0.06
  id: 005-kriteriy-loss-2
  fingerprint: cb6fc34f
- concept: 'критерий отбора — прокси: он измеряет прирост предсказуемости текста, а не фактическую правильность ответа инструмента, и отсюда его слабые места'
  question: Toolformer оставляет кандидата, если результат инструмента снижает loss на следующем токене. Объясни своими словами, почему такой фильтр может пропустить вызов с фактически неверным результатом и отбросить вызов с фактически верным.
  explanation: 'Здесь и сила, и ограничение self-supervised сигнала: он бесплатный и масштабируемый, потому что берётся прямо из loss на существующем тексте, но он лишь коррелирует с настоящей полезностью вызова. Никакой отдельной проверки корректности выхода инструмента в пайплайне нет.'
  kind: open
  reference: 'Фильтр не сверяет ответ инструмента с истиной — он сверяет два предсказания следующего токена, без результата и с ним. Поэтому неверный результат, случайно совпавший с тем, что дальше написано в корпусе (или просто сдвинувший модель в нужную сторону), снижает loss и выживает. И наоборот: фактически верный ответ, поставленный там, где продолжение и так предсказуемо, не даёт выигрыша и вычёркивается. Критерий отвечает на вопрос «помогла ли подсказка угадать текст», а не «правда ли это» и не «уместен ли вызов». Плюс — не нужны разметчики, сам корпус показывает места, где без помощи угадывается плохо; минус — качество разметки ограничено тем, насколько предсказуемость текста совпадает с полезностью инструмента.'
  id: 005-kriteriy-loss-3
  fingerprint: 691b6418
