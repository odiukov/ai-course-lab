- concept: наблюдение об отказе валидации обязано называть поле, полученное значение и допустимое множество, иначе повторная попытка модели не информированнее первой
  question: Валидатор отклонил вызов инструмента и вернул модели строку «invalid arguments». Почему такого наблюдения недостаточно и что в нём должно быть?
  explanation: 'Каждый провал валидации должен возвращать структурированное наблюдение, а не исключение. Ценность наблюдения измеряется тем, насколько оно сужает выбор модели: имя поля + фактическое значение + допустимое множество.'
  kind: open
  reference: 'Наблюдение — это единственный вход модели для следующей попытки. «invalid arguments» не сужает пространство вариантов: модель не знает, какое поле сломано, что она в него положила и что туда допустимо, поэтому вторая попытка статистически повторяет первую. Наблюдение должно называть конкретное поле, полученное значение и ограничение: «поле status получило in_progress, допустимы open или closed», «поле ticket_id обязательно и отсутствует», «поле due_date не разобралось как дата, ожидается ISO-8601». Тогда исправление получается за один ход, и агент восстанавливается сам вместо стектрейса в логе.'
  id: 022-enum-required-format-2
  fingerprint: c53de281
- concept: проверка формата парсером предметного типа и получение значения — одна операция, поэтому в тело инструмента уходит разобранное значение, а не исходная строка
  question: Аргумент `due_date` пришёл строкой. Валидатор прогнал её парсером дат, парсер отработал без ошибки. Что корректнее передать в тело инструмента?
  explanation: 'Парсер даёт не булев вердикт, а разобранное значение — оно и есть результат проверки. Если дальше поехала исходная строка, её разберут второй раз, возможно другим кодом, другой локалью или другой таймзоной, и провалидированное значение разойдётся с использованным. Регулярка тут вообще не помощник: она подтверждает форму строки, а не существование даты.'
  kind: choice
  options:
    - Объект даты, который вернул парсер
    - Исходную строку — парсер уже подтвердил, что она корректна
    - Исходную строку, дополнительно проверенную регуляркой на длину и разделители
    - 'Обе версии: строку для логов и объект для логики'
  correct: 0
