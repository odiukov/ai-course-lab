- concept: модель выбирает инструмент только по объявленному контракту (имя, описание, схема входа), тело функции ей недоступно
  question: 'Инструмент `fetch_invoice` реализован аккуратно: внутри есть комментарии, типизация, докстрока с примерами вызова. В объявлении для модели у него имя, описание «Invoice tool» и корректная JSON Schema. Модель регулярно зовёт его не там, где нужно. Что из перечисленного модель вообще НЕ учитывает при выборе?'
  explanation: 'В запрос уходит только контракт: name, description, input_schema. Исходник, докстрока и внутренняя логика в контекст не попадают. Поэтому «хорошо документированный код» ничего не даёт модели — документировать надо именно поле description.'
  kind: choice
  options:
    - Имя инструмента
    - Докстроку и реализацию функции
    - Текст описания в объявлении
    - Типы и обязательность полей в схеме входа
  correct: 1
  id: 013-tool-schema-1
  fingerprint: 1b548ddd
- concept: переезд между провайдерами меняет имя ключа со схемой, сама JSON Schema остаётся прежней
  question: Объявление инструмента переносят из формата Anthropic (`input_schema`) в формат OpenAI. Заполни пропуск ключом, под которым туда кладут ту же самую JSON Schema.
  explanation: Anthropic кладёт схему в `input_schema`, OpenAI — в `function.parameters`. Внутри обоих — обычная JSON Schema с properties/required/types/enums. Миграция контракта сводится к переименованию ключа, а не к переписыванию схемы.
  kind: cloze
  template: '{"type": "function", "function": {"name": "get_weather", "description": "...", "___": {"type": "object", "properties": {...}, "required": [...]}}}'
  answer: parameters
  accept:
    - parameters
    - function.parameters
    - '"parameters"'
  id: 013-tool-schema-2
  fingerprint: a1ad9b8e
- concept: описание задаёт условия применимости и границу между пересекающимися инструментами, а не сообщает о существовании инструмента
  question: 'У агента два инструмента с пересекающейся зоной: `vector_search` по внутренней базе документов и `web_search` по интернету. Агент постоянно уходит в веб там, где ответ лежит во внутренней базе. Объясни, что именно надо написать в описаниях, чтобы развести их, и почему одной точной формулировки назначения каждого мало.'
  explanation: 'Сравни «Search» и «Use when the user asks about events after your knowledge cutoff»: первое лишь сообщает, что инструмент существует, второе задаёт, когда его звать и когда нет. Модель читает описание как инструкцию, поэтому граница между пересекающимися инструментами должна быть прописана явно, включая запрет.'
  kind: open
  reference: 'Описание — единственный сигнал, по которому модель решает, уместен ли инструмент в конкретной ситуации, поэтому в нём должны стоять условия вызова, а не назначение. Мало сказать «searches internal docs» и «searches the web»: обе фразы описывают, что инструмент делает, и обе подходят к запросу «найди информацию». Нужны положительные и отрицательные условия и явная граница между ними: у `vector_search` — «use for questions about internal policies, product docs and anything indexed in the company knowledge base; try this first», у `web_search` — «use only when the answer requires public or recent information not present in internal docs, e.g. events after the knowledge cutoff; do not use for internal policy questions». Отрицательное условие («когда НЕ звать») снимает пересечение, и без него модель выбирает по слабым косвенным признакам вроде порядка инструментов в списке. Плохие описания — главная причина отказов класса «выбран не тот инструмент».'
  id: 013-tool-schema-3
  fingerprint: 08eff2f8
