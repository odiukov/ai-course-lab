- concept: 'JSON Schema в каталоге — объявление для модели, а не механизм принуждения: аргументы вернувшегося вызова всё равно валидируются локально'
  question: 'Схема входа отправлена модели в каталоге инструментов: перечислены `properties`, `required`, типы и `enum`. Означает ли это, что пришедшие от модели аргументы можно передавать в функцию без проверки? Объясни.'
  explanation: 'Каталог отвечает на вопрос «что модель может позвать и с чем», а не «что дойдёт до функции». Граница доверия проходит по возврату вызова: всё, что пришло от модели, — вход из ненадёжного источника. Отсюда пара «схема объявлена в каталоге + та же схема проверяется локально перед исполнением».'
  kind: open
  reference: 'Нет. Схема в каталоге — это описание контракта для модели, а не валидатор на стороне провайдера. Модель генерирует аргументы, и они могут нарушить схему: пропущенное обязательное поле, строка вместо числа, значение вне enum, лишний ключ. Некоторые провайдеры умеют ограничивать декодирование по схеме, но полагаться на это как на гарантию нельзя — это отдельная опция, а не свойство самого каталога. Поэтому валидация аргументов остаётся на стороне приложения, до вызова функции, и её отказ — восстановимый: результат-наблюдение с описанием несоответствия возвращается модели, чтобы она переформулировала вызов.'
  id: 018-tool-catalog-3
