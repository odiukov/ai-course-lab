- concept: формат провайдера применяется на границе сериализации, а определения инструментов остаются провайдер-агностичными
  question: 'Приложение ходит и в Anthropic, и в OpenAI одним набором инструментов. Где корректно держать различия формата (плоский словарь против обёртки `{"type": "function", "function": {...}}`)?'
  explanation: 'Имя, описание и схема входа одинаковы для обоих провайдеров — различается только упаковка. Если упаковку зашить в определения, добавление провайдера потребует править каждый инструмент; если держать её в сериализаторе, добавляется одна ветка, а список инструментов, схемы и реестр не трогаются. Реестр вообще к формату отношения не имеет: он исполняет уже разобранный вызов.'
  kind: choice
  options:
    - 'В самих определениях инструментов: каждый инструмент хранит по варианту словаря на провайдера'
    - В функции сериализации каталога, которая принимает провайдера параметром; определения инструментов о провайдере не знают
    - 'В JSON Schema каждого аргумента: тип поля задаёт, в какую обёртку попадёт инструмент'
    - 'В реестре диспетчеризации: он раскладывает вызовы по формату провайдера при исполнении'
