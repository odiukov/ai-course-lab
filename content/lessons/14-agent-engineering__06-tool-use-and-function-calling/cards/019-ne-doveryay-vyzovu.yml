- concept: 'проверки аргумента упорядочены по зависимости: наличие поля предшествует проверке его типа, тип — проверке домена и формата значения'
  question: Расставь проверки одного аргумента в порядке, при котором каждая следующая имеет осмысленный вход.
  explanation: 'Проверять домен или формат отсутствующего поля не о чем: получишь исключение внутри самого валидатора вместо наблюдения для модели. Домен и формат также предполагают уже приведённый тип — сравнивать строку "17" с целочисленным диапазоном бессмысленно. Порядок даёт ещё и точную первую ошибку: модель получает одно понятное наблюдение, а не каскад производных.'
  kind: order
  items:
    - Убедиться, что обязательное поле присутствует в объекте аргументов
    - Привести значение к типу из схемы или отклонить, если приведение неоднозначно
    - Проверить, что значение входит в объявленный enum-домен
    - Разобрать значение парсером предметного формата (дата, email, URL)
