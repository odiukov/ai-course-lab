- concept: формат аргумента проверяется парсером предметного типа, потому что регулярка подтверждает только форму строки, а не существование значения
  question: Поле `deadline` объявлено как дата ISO. Валидатор проверяет его регуляркой `^\d{4}-\d{2}-\d{2}$`. Какой дефект такой проверки принципиален, а не устраним усложнением шаблона?
  explanation: '"2027-02-31" синтаксически безупречна и любому шаблону соответствует, но такой даты нет: високосность и длина месяцев — календарная логика, а не свойство строки. Настоящий парсер дат отвергнет её и вернёт причину. То же с email и URL: разбор реальным парсером проверяет допустимость значения, регулярка — только его написание.'
  kind: choice
  options:
    - Регулярка медленнее вызова парсера дат
    - Регулярка подтверждает форму записи, но пропускает несуществующие значения вроде "2027-02-31", а календарные правила в шаблон не выражаются
    - Регулярка не умеет работать со строками длиннее 32 символов
    - Регулярка не вернёт модели текст ошибки
