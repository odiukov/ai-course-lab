<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>От отдельных memory bank к одной общей памяти</title>
<style>
  :root {
    color-scheme: light dark;
    --page: aliceblue;
    --panel: white;
    --panel-alt: ghostwhite;
    --ink: midnightblue;
    --muted: slategray;
    --line: lightslategray;
    --soft-line: lightsteelblue;
    --memory: lavender;
    --memory-edge: mediumpurple;
    --accent: royalblue;
    --arrow: darkorange;
    --qa: deepskyblue;
    --qb: mediumseagreen;
    --qc: gold;
    --qd: coral;
    --qe: orchid;
    --summary-old: lavenderblush;
    --summary-new: honeydew;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #111827;
      --panel: #172033;
      --panel-alt: #1d2940;
      --ink: #f1f5f9;
      --muted: #aebbd0;
      --line: #8390a8;
      --soft-line: #40516c;
      --memory: #302b54;
      --memory-edge: #a78bfa;
      --accent: #7db4ff;
      --arrow: #ffb45b;
      --qa: #38bdf8;
      --qb: #4ade80;
      --qc: #facc15;
      --qd: #fb7185;
      --qe: #e879f9;
      --summary-old: #38243a;
      --summary-new: #19372e;
    }
  }

  html,
  body {
    margin: unset;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .scheme-title {
    margin: unset;
    font-size: 20px;
    font-weight: bold;
    text-align: center;
    line-height: normal;
    background: var(--page);
    color: var(--ink);
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 490px;
    background: var(--page);
  }

  .panel {
    fill: var(--panel);
    stroke: var(--soft-line);
    stroke-width: 2px;
  }

  .shared-panel {
    fill: var(--panel-alt);
    stroke: var(--accent);
    stroke-width: 2px;
  }

  .section-label {
    fill: var(--ink);
    font-size: 15px;
    font-weight: bold;
  }

  .small-label {
    fill: var(--muted);
    font-size: 12px;
  }

  .bank-label {
    fill: var(--ink);
    font-size: 13px;
    font-weight: bold;
  }

  .connection {
    fill: none;
    stroke: var(--line);
    stroke-width: 1px;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
  }

  .person-head {
    fill: var(--accent);
    stroke: var(--panel);
    stroke-width: 1px;
  }

  .person-body {
    fill: none;
    stroke: var(--accent);
    stroke-width: 2px;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
  }

  .notebook {
    fill: var(--memory);
    stroke: var(--memory-edge);
    stroke-width: 1.5px;
  }

  .notebook-line {
    stroke: var(--memory-edge);
    stroke-width: 1px;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
  }

  .scene-line {
    stroke: var(--soft-line);
    stroke-width: 1px;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
  }

  .shared-memory {
    fill: var(--memory);
    stroke: var(--memory-edge);
    stroke-width: 2.5px;
  }

  .query {
    stroke: var(--panel);
    stroke-width: 1px;
    stroke-linejoin: round;
  }

  .query-dot {
    fill: var(--ink);
  }

  .query-a { fill: var(--qa); }
  .query-b { fill: var(--qb); }
  .query-c { fill: var(--qc); }
  .query-d { fill: var(--qd); }
  .query-e { fill: var(--qe); }

  .arrow {
    fill: none;
    stroke: var(--arrow);
    stroke-width: 2.5px;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
  }

  .arrow-label {
    fill: var(--arrow);
    font-size: 13px;
    font-weight: bold;
  }

  .summary-old {
    fill: var(--summary-old);
    stroke: var(--memory-edge);
    stroke-width: 1.5px;
  }

  .summary-new {
    fill: var(--summary-new);
    stroke: var(--accent);
    stroke-width: 1.5px;
  }

  .summary-title {
    fill: var(--muted);
    font-size: 12px;
    font-weight: bold;
  }

  .summary-text {
    fill: var(--ink);
    font-size: 14px;
    font-weight: bold;
  }

  .footer {
    fill: var(--ink);
    font-size: 13px;
  }

  .fallback {
    fill: var(--ink);
    font-size: 15px;
  }
</style>
</head>
<body>
<h1 class="scheme-title" id="scheme-title">От отдельных memory bank к одной общей памяти</h1>
<svg id="scheme" width="1000" height="450" viewBox="0 0 1000 450"
     preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="scheme-title scheme-desc">
  <desc id="scheme-desc">Слева 50 объектов связаны с 50 отдельными блокнотами памяти. Справа 50 query-закладок находятся в одном общем memory bank.</desc>
  <g id="diagram"></g>
</svg>

<script>
const data = [{
  canvas: [1000, 450],
  zero: 0,
  origin: [0, 0],
  scale: [1, 1],
  count: 50,
  grid: { cols: 10, rows: 5 },
  rhythm: { half: 2, quarter: 4, fifth: 5 },
  corner: 8,
  panels: {
    left: { x: 20, y: 48, w: 420, h: 278 },
    right: { x: 590, y: 48, w: 380, h: 278 }
  },
  left: {
    personX: 54, personY: 99, personDX: 19, personDY: 44,
    fan: 1.4, center: 4.5,
    bankX: 286, bankY: 84, bankDX: 14, bankDY: 44,
    bankW: 10, bankH: 30,
    headR: 4, bodyH: 9, armW: 5, legW: 4
  },
  right: {
    bankX: 615, bankY: 84, bankW: 330, bankH: 220,
    queryX: 640, queryY: 105, queryDX: 30, queryDY: 39,
    queryW: 15, queryH: 24, notch: 5, dotR: 2.5,
    sceneInset: 14, sceneGap: 38
  },
  arrow: {
    x1: 460, y1: 188, x2: 560, y2: 188,
    head: 12, wing: 8,
    labelX: 510, labelY: 164,
    noteX: 510, noteY: 216
  },
  labels: {
    leftObjectsX: 137, leftBanksX: 356, topY: 72,
    rightQueriesX: 780, rightTopY: 72,
    rightBankX: 780, rightBankY: 299
  },
  summaries: {
    y: 344, h: 68,
    leftX: 20, leftW: 420,
    rightX: 590, rightW: 380,
    titleY: 365, textY: 394
  },
  footer: { x: 500, y: 438 },
  fallback: { x: 500, y: 225 }
}];

const [D] = data;
const [originX, originY] = D.origin;
const [scaleX, scaleY] = D.scale;
const origin = { x: originX, y: originY };
const scale = { x: scaleX, y: scaleY };

const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

const svg = document.getElementById("scheme");
const root = document.getElementById("diagram");
const NS = "http://www.w3.org/2000/svg";
const palette = ["query-a", "query-b", "query-c", "query-d", "query-e"];

function node(tag, attributes, content) {
  const item = document.createElementNS(NS, tag);
  Object.entries(attributes).forEach(([name, value]) => item.setAttribute(name, value));
  if (content) item.textContent = content;
  return item;
}

function addRect(parent, x, y, w, h, radius, className) {
  parent.appendChild(node("rect", {
    x: sx(x),
    y: sy(y),
    width: sx(x + w) - sx(x),
    height: sy(y + h) - sy(y),
    rx: sx(radius) - sx(D.zero),
    class: className
  }));
}

function addLine(parent, x1, y1, x2, y2, className) {
  parent.appendChild(node("line", {
    x1: sx(x1), y1: sy(y1),
    x2: sx(x2), y2: sy(y2),
    class: className
  }));
}

function addText(parent, x, y, content, className, anchor) {
  parent.appendChild(node("text", {
    x: sx(x),
    y: sy(y),
    class: className,
    "text-anchor": anchor,
    "dominant-baseline": "middle"
  }, content));
}

function addCircle(parent, x, y, radius, className) {
  parent.appendChild(node("circle", {
    cx: sx(x),
    cy: sy(y),
    r: sx(x + radius) - sx(x),
    class: className
  }));
}

function personPath(x, y) {
  const L = D.left;
  return [
    "M", sx(x), sy(y + L.headR),
    "L", sx(x), sy(y + L.headR + L.bodyH),
    "M", sx(x - L.armW), sy(y + L.headR + L.bodyH / D.rhythm.half),
    "L", sx(x + L.armW), sy(y + L.headR + L.bodyH / D.rhythm.half),
    "M", sx(x), sy(y + L.headR + L.bodyH),
    "L", sx(x - L.legW), sy(y + L.headR + L.bodyH + L.legW),
    "M", sx(x), sy(y + L.headR + L.bodyH),
    "L", sx(x + L.legW), sy(y + L.headR + L.bodyH + L.legW)
  ].join(" ");
}

function queryPath(x, y) {
  const Q = D.right;
  return [
    "M", sx(x), sy(y),
    "L", sx(x + Q.queryW), sy(y),
    "L", sx(x + Q.queryW), sy(y + Q.queryH),
    "L", sx(x + Q.queryW / D.rhythm.half), sy(y + Q.queryH - Q.notch),
    "L", sx(x), sy(y + Q.queryH),
    "Z"
  ].join(" ");
}

try {
  addRect(root, D.panels.left.x, D.panels.left.y, D.panels.left.w,
    D.panels.left.h, D.corner, "panel");
  addRect(root, D.panels.right.x, D.panels.right.y, D.panels.right.w,
    D.panels.right.h, D.corner, "shared-panel");

  addText(root, D.labels.leftObjectsX, D.labels.topY,
    "50 объектов", "section-label", "middle");
  addText(root, D.labels.leftBanksX, D.labels.topY,
    "50 отдельных memory bank", "section-label", "middle");
  addText(root, D.labels.rightQueriesX, D.labels.rightTopY,
    "50 query-закладок", "section-label", "middle");

  Array.from({ length: D.count }).forEach((unused, index) => {
    const row = Math.floor(index / D.grid.cols);
    const column = index % D.grid.cols;
    const drift = (column - D.left.center) * D.left.fan;
    const personX = D.left.personX + column * D.left.personDX;
    const personY = D.left.personY + row * D.left.personDY + drift;
    const bankX = D.left.bankX + column * D.left.bankDX;
    const bankY = D.left.bankY + row * D.left.bankDY + drift;

    addLine(root,
      personX + D.left.armW,
      personY + D.left.headR + D.left.bodyH / D.rhythm.half,
      bankX,
      bankY + D.left.bankH / D.rhythm.half,
      "connection");
  });

  Array.from({ length: D.count }).forEach((unused, index) => {
    const row = Math.floor(index / D.grid.cols);
    const column = index % D.grid.cols;
    const drift = (column - D.left.center) * D.left.fan;
    const personX = D.left.personX + column * D.left.personDX;
    const personY = D.left.personY + row * D.left.personDY + drift;
    const bankX = D.left.bankX + column * D.left.bankDX;
    const bankY = D.left.bankY + row * D.left.bankDY + drift;

    addCircle(root, personX, personY, D.left.headR, "person-head");
    root.appendChild(node("path", {
      d: personPath(personX, personY),
      class: "person-body"
    }));

    addRect(root, bankX, bankY, D.left.bankW, D.left.bankH,
      D.left.headR, "notebook");
    addLine(root,
      bankX + D.left.bankW / D.rhythm.quarter,
      bankY + D.left.bankH / D.rhythm.quarter,
      bankX + D.left.bankW - D.left.bankW / D.rhythm.quarter,
      bankY + D.left.bankH / D.rhythm.quarter,
      "notebook-line");
    addLine(root,
      bankX + D.left.bankW / D.rhythm.quarter,
      bankY + D.left.bankH / D.rhythm.half,
      bankX + D.left.bankW - D.left.bankW / D.rhythm.quarter,
      bankY + D.left.bankH / D.rhythm.half,
      "notebook-line");
  });

  addRect(root, D.right.bankX, D.right.bankY, D.right.bankW,
    D.right.bankH, D.corner, "shared-memory");

  Array.from({ length: D.grid.rows }).forEach((unused, row) => {
    const sceneY = D.right.bankY + D.right.sceneInset + row * D.right.sceneGap;
    addLine(root,
      D.right.bankX + D.right.sceneInset,
      sceneY,
      D.right.bankX + D.right.bankW - D.right.sceneInset,
      sceneY,
      "scene-line");
  });

  Array.from({ length: D.count }).forEach((unused, index) => {
    const row = Math.floor(index / D.grid.cols);
    const column = index % D.grid.cols;
    const queryX = D.right.queryX + column * D.right.queryDX;
    const queryY = D.right.queryY + row * D.right.queryDY;
    root.appendChild(node("path", {
      d: queryPath(queryX, queryY),
      class: "query " + palette[index % palette.length]
    }));
    addCircle(root,
      queryX + D.right.queryW / D.rhythm.half,
      queryY + D.right.queryH / D.rhythm.quarter,
      D.right.dotR,
      "query-dot");
  });

  addText(root, D.labels.rightBankX, D.labels.rightBankY,
    "1 общий memory bank", "bank-label", "middle");

  addLine(root, D.arrow.x1, D.arrow.y1,
    D.arrow.x2, D.arrow.y2, "arrow");
  root.appendChild(node("path", {
    d: [
      "M", sx(D.arrow.x2 - D.arrow.head), sy(D.arrow.y2 - D.arrow.wing),
      "L", sx(D.arrow.x2), sy(D.arrow.y2),
      "L", sx(D.arrow.x2 - D.arrow.head), sy(D.arrow.y2 + D.arrow.wing)
    ].join(" "),
    class: "arrow"
  }));
  addText(root, D.arrow.labelX, D.arrow.labelY,
    "Object Multiplex", "arrow-label", "middle");
  addText(root, D.arrow.noteX, D.arrow.noteY,
    "общий контекст — один раз", "small-label", "middle");

  addRect(root, D.summaries.leftX, D.summaries.y,
    D.summaries.leftW, D.summaries.h, D.corner, "summary-old");
  addRect(root, D.summaries.rightX, D.summaries.y,
    D.summaries.rightW, D.summaries.h, D.corner, "summary-new");

  addText(root,
    D.summaries.leftX + D.summaries.leftW / D.rhythm.half,
    D.summaries.titleY, "БЫЛО", "summary-title", "middle");
  addText(root,
    D.summaries.leftX + D.summaries.leftW / D.rhythm.half,
    D.summaries.textY,
    "50 объектов → 50 независимых memory bank",
    "summary-text", "middle");

  addText(root,
    D.summaries.rightX + D.summaries.rightW / D.rhythm.half,
    D.summaries.titleY, "СТАЛО", "summary-title", "middle");
  addText(root,
    D.summaries.rightX + D.summaries.rightW / D.rhythm.half,
    D.summaries.textY,
    "50 объектов → 50 query-закладок → 1 memory bank",
    "summary-text", "middle");

  addText(root, D.footer.x, D.footer.y,
    "Общий контекст хранится вместе; идентичности остаются раздельными",
    "footer", "middle");
} catch (error) {
  root.textContent = "";
  addText(root, D.fallback.x, D.fallback.y,
    "Схема: 50 отдельных memory bank сменяются 50 query-закладками в одной общей памяти.",
    "fallback", "middle");
}
</script>
</body>
</html>
