- concept: ошибочный фрагмент идентичности порождает одновременно IDFP и IDFN
  question: Часть ground-truth траектории tracker записал под отдельным ошибочным ID. После глобального сопоставления этот фрагмент не относится к правильной предсказанной траектории. Как он учитывается в IDF1?
  explanation: Ошибочный ID создаёт лишние объекто-кадры предсказанной идентичности, то есть IDFP. Одновременно правильная идентичность отсутствует на этих кадрах, поэтому возникают IDFN.
  kind: choice
  options:
    - Только как IDTP
    - Только как IDFP
    - Только как IDFN
    - Одновременно как IDFP ошибочной идентичности и IDFN правильной идентичности
  correct: 3
  id: 045-idf1-2
  fingerprint: bc10b49c
- concept: влияние смены ID на IDF1 определяется длительностью испорченного участка траектории
  question: Почему два трекера с одинаковым числом событий ID switch могут получить заметно разные значения IDF1?
  explanation: Для IDF1 важна продолжительность нарушения идентичности. Одиночное переключение в начале длинной траектории может повредить гораздо больше объекто-кадров, чем такое же переключение у её конца.
  kind: open
  reference: IDF1 считает объекто-кадры с правильной и неправильной идентичностью после глобального сопоставления траекторий, а не только события переключения. Если после смены ID ошибочная идентичность сохраняется долго, она создаёт больше IDFP и IDFN и сильнее снижает IDF1.
  id: 045-idf1-3
  fingerprint: '315912e4'
