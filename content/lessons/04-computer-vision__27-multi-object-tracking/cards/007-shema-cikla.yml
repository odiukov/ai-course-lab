- concept: ReID-признаки помогают DeepSORT сохранять идентичности при пересечении траекторий
  question: Объясни своими словами, почему DeepSORT обычно устойчивее SORT, когда траектории похожих объектов пересекаются.
  explanation: SORT опирается на модель движения и IoU, поэтому близкие или пересекающиеся рамки могут оказаться неоднозначными. DeepSORT добавляет embedding внешнего вида как дополнительный сигнал сопоставления.
  kind: open
  reference: DeepSORT сравнивает не только положение рамок, но и ReID-признаки внешнего вида. Поэтому при неоднозначной геометрии он может связать детекцию с визуально похожим треком и снизить риск переключения ID.
