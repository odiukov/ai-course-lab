- concept: плотная сцена уменьшает разрыв между IoU кандидатов и делает назначение чувствительным к шуму
  question: Объясни, почему увеличение числа близко расположенных объектов делает association только по IoU менее надёжной даже при использовании глобального алгоритма назначения.
  explanation: 'При высокой плотности IoU перестаёт давать явно лучшего кандидата: несколько продолжений трека выглядят почти одинаково. Глобальная оптимизация находит лучшее назначение для данной матрицы стоимостей, но не устраняет неоднозначность самой матрицы.'
  kind: open
  reference: В плотной сцене одна рамка пересекается сразу с несколькими соседними рамками, поэтому их IoU оказываются близкими. Небольшая ошибка локализации детекций может изменить порядок этих оценок, и глобальный алгоритм выберет другое допустимое назначение, вызвав переключение ID.
  id: 027-gde-iou-lomaetsya-2
