- concept: размер контекстного окна ограничивает продолжительность доступной tracker-у истории
  question: Почему memory-based tracker не может бесконечно накапливать признаки всех прошлых кадров, даже если дополнительная история иногда помогает сохранять идентичность?
  explanation: 'Долгая память не бесплатна и не бесконечна: сохранённые признаки расходуют память, участвуют во внимании и постепенно заполняют доступное контекстное окно.'
  kind: open
  reference: Memory bank занимает конечное контекстное окно. По мере накопления признаков растут требования к памяти и их обработке, а после заполнения контекста всю историю одновременно использовать нельзя.
