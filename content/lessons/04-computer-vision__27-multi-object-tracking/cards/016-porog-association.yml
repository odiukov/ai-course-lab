- concept: назначения с запретительной стоимостью необходимо отбрасывать после работы Hungarian algorithm
  question: Hungarian algorithm вернул пару, которая до назначения была помечена запретительной стоимостью. Почему это возможно и как должен поступить трекер?
  explanation: Большая конечная стоимость делает связь крайне невыгодной, но не удаляет её из матрицы. Поэтому жёсткий запрет обеспечивается не только штрафом перед оптимизацией, но и проверкой полученных пар после неё.
  kind: open
  reference: Алгоритм строит формальное назначение по всей конечной матрице и при недостатке допустимых связей может выбрать даже ячейку с огромной стоимостью. Трекер должен проверить результат и отвергнуть такую пару, оставив трек без обновления, а детекцию — без привязки.
  id: 016-porog-association-2
  fingerprint: 7f44cb5c
