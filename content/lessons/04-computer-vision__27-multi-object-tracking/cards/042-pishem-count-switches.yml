- concept: пропуск совпадений не сбрасывает последнее назначение объекта разметки
  question: В упрощённой метрике словарь назначений обновляется только при допустимом IoU-совпадении. Объект разметки был связан с track_id=A, затем несколько кадров не имел допустимого совпадения, а после этого оказался связан с track_id=B. Что произойдёт?
  explanation: Пустой кадр или отсутствие совпадения с IoU > 0.5 приводит к continue либо пропуску обновления, но не удаляет запись из prev_assignment. Поэтому новое допустимое назначение B сравнивается с последним сохранённым A.
  kind: choice
  options:
    - Будет засчитано переключение, потому что сохранённое назначение A пережило пропуск
    - Переключения не будет, потому что любой пропуск автоматически удаляет назначение
    - Переключение будет засчитано только при наличии объекта на каждом промежуточном кадре
  correct: 0
  id: 042-pishem-count-switches-1
  fingerprint: 9bc2403f
- concept: независимый выбор argmax для каждого объекта разметки не гарантирует взаимно однозначного сопоставления
  question: Упрощённая функция для каждого объекта разметки независимо выбирает трек с максимальным IoU. Почему такое сопоставление не является взаимно однозначным и чем это может исказить подсчёт переключений идентичности?
  explanation: В коде argmax вычисляется отдельно для каждой строки матрицы IoU. Между строками нет координации, поэтому один столбец может быть выбран многократно; глобальное взаимно однозначное назначение устраняет эту неоднозначность.
  kind: open
  reference: Один и тот же предсказанный трек может оказаться лучшим сразу для нескольких объектов разметки, поскольку после выбора он не исключается из рассмотрения. Тогда функция запишет одинаковый track_id нескольким физическим объектам и может получить искусственные назначения или переключения. Полноценное сопоставление должно ограничивать каждый трек и каждый объект разметки одной парой.
  id: 042-pishem-count-switches-2
  fingerprint: c83b63ba
