- concept: накопление признаков из разных кадров делает представление объекта устойчивее к изменениям его вида
  question: Почему при видеотрекинге полезно дополнять memory bank признаками объекта из разных кадров, а не хранить единственный шаблон?
  explanation: Единственный шаблон быстро устаревает при смене ракурса или перекрытии. История признаков сохраняет несколько проявлений того же экземпляра и тем самым поддерживает его узнаваемость во времени.
  kind: open
  reference: На разных кадрах объект может менять позу, ракурс, силуэт или быть частично перекрыт. Признаки из нескольких наблюдений представляют разные состояния того же экземпляра, поэтому модель может узнавать его даже тогда, когда текущее изображение плохо похоже на первоначальный шаблон.
  id: 033-sam2-memory-2
  fingerprint: f80dcbe9
