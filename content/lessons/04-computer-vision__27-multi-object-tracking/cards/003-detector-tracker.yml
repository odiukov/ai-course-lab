- concept: покадровый детектор не хранит траекторию объекта
  question: Система получает только результат детектора для текущего кадра. На какой вопрос она не сможет надёжно ответить без temporal tracking?
  explanation: 'Детектор описывает объекты на отдельном кадре: их классы, положения и уверенности. Для ответа о прошлом положении нужна накопленная во времени история наблюдений.'
  kind: choice
  options:
    - Какой класс объекта виден сейчас?
    - Где объект находился раньше?
    - Какова уверенность текущей детекции?
  correct: 1
  id: 003-detector-tracker-1
  fingerprint: 193ddf91
- concept: история трека позволяет вычислять характеристики движения и события во времени
  question: Какие сведения о поведении объекта можно получить из последовательности его положений, но нельзя получить из одной покадровой детекции? Приведи два примера.
  explanation: Одна детекция описывает только текущее наблюдение. Последовательность положений образует временную историю, из которой выводятся движение, длительность состояний и события между кадрами.
  kind: open
  reference: Например, по истории положений можно определить направление движения, длительность нахождения в зоне или факт пересечения заданной линии.
  id: 003-detector-tracker-2
  fingerprint: 684e1823
