- concept: кадр без детекций всё равно должен быть передан трекеру
  question: В видеопоследовательности встретился кадр без детекций. Как должен поступить управляющий цикл трекера?
  explanation: Пустой кадр тоже продвигает время трекера. Вызов step с пустым набором оставляет last_frame без обновления, поэтому возраст несовпавших треков растёт и max_age продолжает означать число пропущенных кадров.
  kind: choice
  options:
    - Пропустить кадр и не вызывать трекер
    - Создать новый трекер для следующего непустого кадра
    - Вызвать тот же трекер с пустым набором детекций и текущим индексом кадра
    - Повторно передать детекции предыдущего кадра
  correct: 2
  id: 025-pishem-run-tracker-2
