- concept: HOTA подходит для общего академического сравнения multi-object tracking
  question: Какую метрику следует выбрать для общего академического сравнения трекеров, если важны и обнаружение объектов, и корректность их связей во времени?
  explanation: 'HOTA учитывает обе стороны tracking: качество детекции через DetA и качество association через AssA. Поэтому её используют как комплексную метрику для академического сравнения трекеров.'
  kind: choice
  options:
    - IoU
    - MOTA
    - HOTA
    - IDF1
  correct: 2
  id: 046-hota-1
  fingerprint: 88cfdf83
- concept: сбалансированная HOTA не позволяет одному сильному компоненту полностью компенсировать другой
  question: Может ли трекер получить высокую HOTA за счёт почти идеального обнаружения объектов, если он часто связывает их с неправильными идентичностями? Объясни своими словами.
  explanation: HOTA требует одновременно хороших DetA и AssA. Сильная детекция не скрывает путаницу идентичностей, как и безошибочные связи не компенсируют большое количество пропусков и ложных обнаружений.
  kind: open
  reference: Нет. Высокая точность детекции повышает DetA, но ошибки связывания снижают AssA. HOTA сбалансированно объединяет эти компоненты, поэтому плохое сохранение идентичностей ограничивает итоговую оценку.
  id: 046-hota-2
  fingerprint: da137d49
