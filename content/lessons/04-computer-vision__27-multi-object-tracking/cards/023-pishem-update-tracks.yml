- concept: пустой набор детекций должен сохранять двумерный контракт формы массива рамок
  question: Объясните, почему пустой набор детекций в трекере лучше представлять как двумерный массив рамок с нулём строк, а не как одномерный пустой массив.
  explanation: В реализации пустой набор имеет форму (0, 4), поэтому IoU для существующих треков получает корректную форму (число треков, 0). Массив формы (0,) нарушил бы ожидание, что у каждой рамки есть отдельная ось координат.
  kind: open
  reference: Двумерная форма сохраняет тот же контракт данных, что и для непустого набора рамок. Благодаря этому операции с координатами, построение IoU-матрицы и создание матрицы стоимости работают с ожидаемыми измерениями даже на кадре без детекций.
  id: 023-pishem-update-tracks-2
