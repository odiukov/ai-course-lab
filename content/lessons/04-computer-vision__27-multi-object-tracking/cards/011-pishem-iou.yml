- concept: нижняя положительная граница знаменателя делает вычисление IoU устойчивым для вырожденных рамок
  question: Объясни своими словами, зачем перед делением ограничивать площадь объединения рамок снизу малой положительной константой.
  explanation: В реализации знаменатель ограничивают через np.clip(union, 1e-8, None). Это не даёт пустым рамкам вызвать деление на ноль.
  kind: open
  reference: У вырожденных или пустых рамок площадь объединения может быть нулевой. Замена нулевого знаменателя малой положительной величиной предотвращает деление на ноль и появление некорректного результата.
