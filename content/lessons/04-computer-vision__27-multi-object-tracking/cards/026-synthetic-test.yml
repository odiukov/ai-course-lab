- concept: синтетические детекции позволяют изолированно проверить механику трекера
  question: В системе tracking-by-detection на реальном видео происходят смены ID. Какой эксперимент лучше всего проверит, что причина находится в логике трекера, а не в детекторе?
  explanation: Заранее сгенерированные рамки исключают изображение и детектор из эксперимента. Если на таком входе меняются ID, ошибку следует искать в сопоставлении, обновлении состояния или жизненном цикле треков.
  kind: choice
  options:
    - Запустить тот же детектор на видео более высокого разрешения
    - Подавать трекеру заранее сгенерированные рамки с известными гладкими траекториями
    - Заменить алгоритм назначения, не меняя входные детекции
  correct: 1
  id: 026-synthetic-test-1
  fingerprint: 931be551
- concept: фиксированный seed обеспечивает воспроизводимость синтетического теста
  question: Объясните, зачем фиксировать seed при случайной генерации синтетических траекторий для тестирования трекера.
  explanation: При одинаковом seed генератор создаёт одну и ту же последовательность рамок. Детерминированный вход превращает случайный пример в воспроизводимый тест.
  kind: open
  reference: Фиксированный seed каждый раз создаёт одинаковые начальные позиции и скорости объектов. Благодаря этому сбой можно повторить на том же входе, сравнить результаты до и после исправления и не спутать изменение кода с новой случайной выборкой.
  id: 026-synthetic-test-2
  fingerprint: 028e3a7c
