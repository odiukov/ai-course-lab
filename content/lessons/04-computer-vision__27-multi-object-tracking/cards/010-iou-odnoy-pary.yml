- concept: IoU равен отношению площади пересечения рамок к площади их объединения
  question: Две рамки размером 18 × 14 пикселей сдвинуты относительно друг друга на 9 пикселей по горизонтали и не сдвинуты по вертикали. Чему равен их IoU?
  explanation: Площадь пересечения равна 9 × 14 = 126, площадь каждой рамки — 252, а площадь объединения — 252 + 252 − 126 = 378. Поэтому IoU = 126 / 378 ≈ 0,333.
  kind: numeric
  answer: 0.333
  tolerance: 0.002
  id: 010-iou-odnoy-pary-1
  fingerprint: 5a30c400
- concept: IoU оценивает только геометрическое совпадение рамок и не устанавливает идентичность объекта
  question: Объясни своими словами, почему высокий IoU между рамкой трека и новой детекцией ещё не доказывает, что они относятся к одному физическому объекту.
  explanation: IoU превращает геометрическое перекрытие в сравнимую оценку, но не анализирует содержимое рамок. Например, рамки двух находящихся рядом людей могут пересекаться, хотя это разные объекты.
  kind: open
  reference: IoU учитывает только площади и взаимное расположение рамок. Рамки разных объектов тоже могут сильно перекрываться, поэтому для надёжного сопоставления могут понадобиться признаки внешнего вида, движения или другие данные.
  id: 010-iou-odnoy-pary-2
  fingerprint: eb0f1b01
