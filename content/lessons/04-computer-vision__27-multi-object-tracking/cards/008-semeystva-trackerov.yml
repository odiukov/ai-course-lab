- concept: SORT сопоставляет предсказанные Kalman filter треки с детекциями по геометрическому IoU без модели внешнего вида
  question: Какое описание точнее всего соответствует алгоритму SORT?
  explanation: SORT сочетает Kalman filter с Hungarian assignment по IoU. Он быстр и прост, но без признаков внешнего вида хуже различает объекты при перекрытиях и близких траекториях.
  kind: choice
  options:
    - Kalman filter предсказывает состояние треков, а Hungarian algorithm сопоставляет их с детекциями по IoU
    - CNN сравнивает ReID-признаки объектов, не используя модель движения
    - Слабые детекции обязательно обрабатываются отдельным повторным проходом
    - Движение камеры оценивается и вычитается перед каждым сопоставлением
