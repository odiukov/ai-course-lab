  fingerprint: 07e55ade
- concept: ковариация описывает неопределённость компонентов состояния и связи между их ошибками
  question: Объясни своими словами, зачем Kalman filter хранит ковариацию вместе с оценкой положения, размера и скорости трека.
  explanation: 'Одного набора координат и скоростей недостаточно: одинаковые оценки могут иметь разную надёжность. Ковариация позволяет фильтру сильнее корректировать состояние детекцией, когда предсказание менее уверенное.'
  kind: open
  reference: Ковариация показывает неопределённость каждого компонента состояния и возможную связь между их ошибками. Благодаря этому фильтр может учитывать надёжность предсказания и измерения при обновлении трека.
  id: 019-kalman-state-2
  fingerprint: 9350a2e7
