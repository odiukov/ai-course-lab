  fingerprint: 97b767b8
- concept: надёжные назначения выполняются раньше попыток восстановить непривязанные треки по слабым детекциям
  question: Почему ByteTrack сначала сопоставляет треки с уверенными детекциями и лишь затем использует слабые детекции для оставшихся треков?
  explanation: Разделение на проходы ограничивает влияние шумных рамок. При пороге confidence 0,5 детекция с уверенностью 0,35 была бы отброшена, но ByteTrack сохраняет её как резерв для продолжения ещё не сопоставленного трека.
  kind: open
  reference: Так надёжные детекции первыми получают подходящие треки, а слабые наблюдения не конкурируют с ними за назначения. После этого слабые детекции могут восстановить только те треки, которые остались без пары, например после краткого перекрытия объекта.
  id: 029-bytetrack-2
  fingerprint: 6ef3f675
