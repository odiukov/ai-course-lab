- concept: в прямоугольной матрице Hungarian algorithm строит пары для меньшей стороны
  question: Треков меньше, чем детекций, и все стоимости конечны. Объясни, что произойдёт с лишними детекциями при назначении один-к-одному.
  explanation: В прямоугольной матрице алгоритм выбирает непересекающиеся пары для меньшей стороны. Поэтому при избытке детекций некоторые из них неизбежно остаются несопоставленными.
  kind: open
  reference: Каждый трек будет сопоставлен не более чем с одной уникальной детекцией, а часть детекций останется без пары, поскольку одну детекцию нельзя назначить нескольким трекам и меньшей стороной являются треки.
  id: 014-hungarian-2
  fingerprint: 834c7443
- concept: кубическая сложность Hungarian algorithm определяет рост времени при масштабировании матрицы
  question: Число треков и число детекций одновременно увеличили вдвое. Во сколько примерно раз возрастёт асимптотическое время Hungarian algorithm при кубической зависимости от их суммарного количества?
  explanation: Суммарный размер задачи удваивается, а кубическая функция при удвоении аргумента возрастает в восемь раз.
