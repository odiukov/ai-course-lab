  fingerprint: 15dfdab1
- concept: ID трека сохраняется при изменении положения и размера ограничивающей рамки
  question: Объясни своими словами, почему перемещение или изменение размера bounding box не требует автоматически присваивать объекту новый ID.
  explanation: Рамка строится отдельно на каждом кадре и естественно меняется вместе с движением объекта, ракурсом и ошибками детектора. Постоянный ID нужен именно для объединения таких разных рамок в историю одного объекта.
  kind: open
  reference: ID обозначает предполагаемый физический объект и связывает его наблюдения во времени, тогда как bounding box — лишь новое измерение положения и размера объекта на конкретном кадре. Если association считает детекцию продолжением прежнего трека, ID сохраняется.
  id: 002-id-vo-vremeni-2
  fingerprint: 30677a99
