- concept: MOTA объединяет пропуски, ложные срабатывания и переключения идентичности относительно числа размеченных объекто-кадров
  question: В разметке содержится 640 объекто-кадров. Трекер допустил 32 пропуска, создал 16 лишних рамок и 8 раз переключил ID. Чему равна MOTA?
  explanation: Суммарная ошибка равна 32 + 16 + 8 = 56. Поэтому MOTA = 1 − 56 / 640 = 0,9125. Метрика складывает ошибки детекции и идентичности, не показывая их вклад по отдельности.
  kind: numeric
  answer: 0.9125
  tolerance: 0.0001
  id: 040-oshibki-tracking-1
  fingerprint: e4b55ef8
- concept: компоненты DetA и AssA в HOTA раздельно характеризуют обнаружение объектов и сохранение связей между кадрами
  question: Что означает сочетание высокой DetA и низкой AssA в отчёте HOTA?
  explanation: DetA отражает качество обнаружения, а AssA — качество association. Поэтому такое сочетание указывает не на основную проблему детектора, а на ошибки построения и сохранения траекторий.
  kind: open
  reference: 'Трекер в целом хорошо обнаруживает объекты, но плохо связывает их наблюдения между кадрами: траектории распадаются или идентификаторы назначаются непоследовательно.'
  id: 040-oshibki-tracking-2
  fingerprint: cc272b93
