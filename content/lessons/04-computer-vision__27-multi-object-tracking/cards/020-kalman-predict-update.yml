- concept: объединение прогноза движения с измерением подавляет покадровый шум детектора
  question: Почему последовательность predict и update обычно даёт более гладкую траекторию рамки, чем полная замена состояния каждой новой детекцией?
  explanation: 'Kalman filter объединяет два источника информации: динамическую модель и шумное наблюдение. В результате случайные смещения и изменения размера детекций сглаживаются, одновременно уточняя положение и скорость трека.'
  kind: open
  reference: Predict задаёт ожидаемое положение по модели движения, а update корректирует его с учётом детекции и неопределённостей. Поэтому случайные ошибки отдельных детекций влияют на состояние лишь частично, а не превращаются целиком в скачки траектории.
  id: 020-kalman-predict-update-2
  fingerprint: f3bd8e29
