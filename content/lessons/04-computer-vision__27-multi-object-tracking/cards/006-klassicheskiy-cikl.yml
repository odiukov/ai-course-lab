- concept: порядок операций в цикле классического tracking-by-detection
  question: Расположите основные операции классического tracker в порядке их выполнения для нового кадра.
  explanation: 'На каждом кадре tracker повторяет цикл predict → associate → update: сначала оценивает ожидаемые состояния треков, затем ищет соответствия с детекциями и после этого обновляет состояние.'
  kind: order
  items:
    - Спрогнозировать текущие состояния существующих треков
    - Сопоставить прогнозы с детекциями нового кадра
    - Обновить состояния треков по результатам сопоставления
  id: 006-klassicheskiy-cikl-1
  fingerprint: a57bac12
- concept: predict экстраполирует состояния треков и не создаёт детекции
  question: Что представляет собой результат операции predict в классическом tracker?
  explanation: Predict использует предыдущие состояния и модель движения, например фильтр Калмана, чтобы оценить положения треков в новом кадре. Это прогноз, который затем сопоставляется с независимыми результатами детектора.
  kind: choice
  options:
    - Ожидаемые положения существующих треков в новом кадре
    - Набор объектов, заново найденных детектором
    - Окончательное сопоставление треков с детекциями
    - Список треков, которые нужно немедленно удалить
  correct: 0
  id: 006-klassicheskiy-cikl-2
  fingerprint: b9d46607
- concept: обработка совпавших и несопоставленных сущностей после association
  question: Объясните своими словами, что обычно происходит после association с совпавшей парой, детекцией без подходящего трека и треком без подходящей детекции.
  explanation: Association разделяет результаты на совпавшие пары и остатки. Совпадения уточняют состояние, новые детекции запускают треки, а временно потерянным трекам дают пережить несколько кадров без наблюдения.
  kind: open
  reference: Совпавший трек обновляют по детекции; несопоставленная детекция может породить новый трек; несопоставленный трек отмечают как пропущенный и удаляют только после превышения допустимого возраста пропусков.
  id: 006-klassicheskiy-cikl-3
  fingerprint: 8631d38e
