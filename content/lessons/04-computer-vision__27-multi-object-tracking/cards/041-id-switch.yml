- concept: упрощённый подсчёт ID switches требует сопоставления рамок и сравнения текущего track_id с прошлым назначением каждого gt_id
  question: Расположи действия упрощённого алгоритма подсчёта ID switches в правильном порядке.
  explanation: Сначала нужно установить допустимое пространственное соответствие, например при IoU > 0.5. Затем текущий track_id сравнивают с сохранённым для того же gt_id; различие добавляет одно переключение для этого объекта.
  kind: order
  items:
    - Сопоставить объект разметки с подходящей предсказанной рамкой
    - Получить track_id выбранного предсказанного трека
    - Сравнить track_id с предыдущим назначением для того же gt_id
    - При смене увеличить счётчик и сохранить текущее назначение
  id: 041-id-switch-2
  fingerprint: edfd616a
