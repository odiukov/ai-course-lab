- concept: memory bank может восстановить идентичность после долгого перекрытия по признакам внешности, даже если объект появился в неожиданном месте
  question: После продолжительного перекрытия объекты появились далеко от своих прежних позиций. Объясни, почему трекер на основе memory bank обычно лучше сохраняет их ID, чем трекер, сопоставляющий рамки только по IoU.
  explanation: При долгом перекрытии координатный прогноз становится ненадёжным, а трек может устареть. Сохранённые признаки экземпляра дают memory-based трекеру дополнительное свидетельство идентичности, не зависящее только от положения.
  kind: open
  reference: IoU-трекер опирается главным образом на геометрическую близость текущих и прошлых рамок, поэтому после долгого исчезновения надёжное соответствие может пропасть. Memory bank сохраняет признаки внешности каждого экземпляра и сравнивает их с признаками нового кадра, что позволяет восстановить ID вопреки неожиданной позиции.
  id: 034-iou-vs-memory-1
  fingerprint: bb00e3ba
- concept: визуальное сходство объектов является источником ошибок memory-based tracking
  question: В какой ситуации преимущество memory bank перед геометрическим IoU-сопоставлением сильнее всего уменьшается?
  explanation: Memory bank различает экземпляры по сохранённым пространственно-временным признакам. Если внешность объектов почти неразличима, эти признаки становятся неоднозначными, поэтому возможна перестановка идентичностей.
  kind: choice
  options:
    - Объекты выглядят почти одинаково и долго перекрывают друг друга
    - Объекты имеют хорошо различимые признаки внешности
    - После перекрытия объект появляется в неожиданной части кадра
    - Камера записывает последовательность без пропущенных кадров
