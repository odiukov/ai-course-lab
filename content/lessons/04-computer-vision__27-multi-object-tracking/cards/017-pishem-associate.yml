- concept: функция association возвращает индексы и не управляет жизненным циклом треков
  question: Почему функцию сопоставления удобно ограничить возвратом индексов совпавших и непривязанных элементов, не поручая ей обновление Track и создание новых ID?
  explanation: Association решает только задачу соответствия между двумя текущими наборами. Изменение состояния, назначение ID и удаление устаревших треков остаются обязанностью трекера, поэтому эту логику проще тестировать и заменять независимо.
  kind: open
  reference: Индексы отделяют вычисление соответствий от управления состоянием трекера. Вызывающий код может по ним обновить совпавшие Track, сохранить непривязанные треки для ожидания и создать новые Track для непривязанных детекций.
