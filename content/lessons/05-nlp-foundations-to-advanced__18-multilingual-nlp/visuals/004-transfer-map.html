<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Путь навыка через общую многоязычную модель</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fc;
      --panel: #ffffff;
      --panel-soft: #f1f4fb;
      --ink: #182033;
      --muted: #5d6880;
      --border: #c9d1e2;
      --model: #5b50c8;
      --model-soft: #eceaff;
      --head: #176b87;
      --head-soft: #e2f5fa;
      --english: #2878b8;
      --english-soft: #e6f3ff;
      --urdu: #b25c18;
      --urdu-soft: #fff0df;
      --french: #8a4aa0;
      --french-soft: #f7eaff;
      --caption: #eef1f7;
      --error: #9f2d35;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111521;
        --panel: #1b2130;
        --panel-soft: #222a3b;
        --ink: #f0f3fa;
        --muted: #b5bfd2;
        --border: #46516a;
        --model: #aaa2ff;
        --model-soft: #302d59;
        --head: #68c8df;
        --head-soft: #173b48;
        --english: #65b8ef;
        --english-soft: #18384e;
        --urdu: #f3a454;
        --urdu-soft: #49301a;
        --french: #d999eb;
        --french-soft: #42294a;
        --caption: #202737;
        --error: #ff9da5;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    main {
      max-width: 1200px;
      margin: auto;
    }

    h1 {
      font-size: 24px;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--panel);
      border: 1px solid var(--border);
    }

    .card,
    .model-card,
    .head-card,
    .caption-box {
      stroke-width: 2px;
    }

    .card {
      fill: var(--panel-soft);
      stroke: var(--border);
    }

    .model-card {
      fill: var(--model-soft);
      stroke: var(--model);
    }

    .head-card {
      fill: var(--head-soft);
      stroke: var(--head);
    }

    .caption-box {
      fill: var(--caption);
      stroke: var(--border);
    }

    .flow,
    .head-link {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .flow {
      stroke-width: 3px;
    }

    .head-link {
      stroke: var(--head);
      stroke-width: 2px;
    }

    .flow-input,
    .arrow-input {
      stroke: var(--model);
      fill: var(--model);
    }

    .flow-english,
    .arrow-english {
      stroke: var(--english);
      fill: var(--english);
    }

    .flow-urdu,
    .arrow-urdu {
      stroke: var(--urdu);
      fill: var(--urdu);
    }

    .flow-french,
    .arrow-french {
      stroke: var(--french);
      fill: var(--french);
    }

    .arrow-input,
    .arrow-english,
    .arrow-urdu,
    .arrow-french {
      stroke-width: 1px;
    }

    text {
      fill: var(--ink);
      font-size: 16px;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
    }

    .small {
      fill: var(--muted);
      font-size: 14px;
    }

    .micro {
      fill: var(--muted);
      font-size: 13px;
    }

    .model-title {
      fill: var(--model);
      font-size: 18px;
      font-weight: bold;
    }

    .head-title {
      fill: var(--head);
      font-size: 16px;
      font-weight: bold;
    }

    .english-title {
      fill: var(--english);
      font-size: 16px;
      font-weight: bold;
    }

    .urdu-title {
      fill: var(--urdu);
      font-size: 16px;
      font-weight: bold;
    }

    .french-title {
      fill: var(--french);
      font-size: 16px;
      font-weight: bold;
    }

    .zero-label {
      fill: var(--urdu);
      font-size: 16px;
      font-weight: bold;
    }

    .stream-tag {
      font-size: 13px;
      font-weight: bold;
    }

    .fallback {
      color: var(--error);
      font-size: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="diagram-heading">Путь навыка через общую многоязычную модель</h1>

    <svg id="diagram"
         width="1200"
         height="420"
         viewBox="0 0 1200 420"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="diagram-heading diagram-description">
      <desc id="diagram-description">
        Тысяча размеченных английских отзывов проходит через общую
        многоязычную модель. Настроенная на английском обучаемая часть
        выдаёт предсказания для английского, урду и французского,
        причём для урду использовано ноль обучающих меток.
      </desc>
    </svg>

    <p id="fallback" class="fallback" hidden>
      Схема должна была показать, как английские размеченные тексты входят
      в общую многоязычную модель, а справа появляются предсказания для
      английского, урду и французского; для урду — 0 обучающих меток.
    </p>

    <noscript>
      <p class="fallback">
        Английские размеченные тексты входят в общую многоязычную модель.
        Справа модель предсказывает метки для английского, урду и
        французского; для урду — 0 обучающих меток.
      </p>
    </noscript>
  </main>

  <script>
    const data = [{
      zero: 0,
      radius: 14,
      tagRadius: 18,
      input: { x1: 30, y1: 132, x2: 278, y2: 252 },
      model: { x1: 360, y1: 122, x2: 660, y2: 262 },
      head: { x1: 418, y1: 38, x2: 602, y2: 100 },
      outputs: [
        {
          box: { x1: 832, y1: 42, x2: 1170, y2: 122 },
          kind: "english",
          title: "Предсказание: английский",
          detail: "«возврат» / «не возврат»",
          titleY: 74,
          detailY: 101
        },
        {
          box: { x1: 832, y1: 162, x2: 1170, y2: 242 },
          kind: "urdu",
          title: "Предсказание: урду",
          detail: "0 обучающих меток",
          titleY: 194,
          detailY: 221
        },
        {
          box: { x1: 832, y1: 282, x2: 1170, y2: 362 },
          kind: "french",
          title: "Предсказание: французский",
          detail: "«возврат» / «не возврат»",
          titleY: 314,
          detailY: 341
        }
      ],
      inputFlow: {
        points: [
          { x: 278, y: 192 },
          { x: 348, y: 192 }
        ],
        head: [
          { x: 348, y: 192 },
          { x: 334, y: 184 },
          { x: 334, y: 200 }
        ]
      },
      outputFlows: [
        {
          kind: "english",
          tag: "англ.",
          tagAt: { x: 704, y: 142 },
          path: [
            { command: "M", x: 660, y: 152 },
            { command: "C", x: 724, y: 152, x2: 748, y2: 82, x3: 820, y3: 82 }
          ],
          head: [
            { x: 820, y: 82 },
            { x: 806, y: 74 },
            { x: 806, y: 90 }
          ]
        },
        {
          kind: "urdu",
          tag: "урду",
          tagAt: { x: 720, y: 202 },
          path: [
            { command: "M", x: 660, y: 202 },
            { command: "L", x: 820, y: 202 }
          ],
          head: [
            { x: 820, y: 202 },
            { x: 806, y: 194 },
            { x: 806, y: 210 }
          ]
        },
        {
          kind: "french",
          tag: "фр.",
          tagAt: { x: 704, y: 260 },
          path: [
            { command: "M", x: 660, y: 232 },
            { command: "C", x: 724, y: 232, x2: 748, y2: 322, x3: 820, y3: 322 }
          ],
          head: [
            { x: 820, y: 322 },
            { x: 806, y: 314 },
            { x: 806, y: 330 }
          ]
        }
      ],
      headLink: {
        x1: 510, y1: 100, x2: 510, y2: 122
      },
      caption: { x1: 118, y1: 382, x2: 1082, y2: 414 },
      labels: {
        input: [
          { x: 154, y: 162, text: "Английские размеченные тексты", cls: "section-title" },
          { x: 154, y: 194, text: "1 000 отзывов", cls: "" },
          { x: 154, y: 222, text: "«возврат» / «не возврат»", cls: "small" }
        ],
        model: [
          { x: 510, y: 154, text: "Общая многоязычная модель", cls: "model-title" },
          { x: 510, y: 187, text: "строит близкие внутренние", cls: "" },
          { x: 510, y: 213, text: "представления для близких смыслов", cls: "" },
          { x: 510, y: 242, text: "язык меняется — область смысла сохраняется", cls: "micro" }
        ],
        head: [
          { x: 510, y: 64, text: "Обучаемая часть", cls: "head-title" },
          { x: 510, y: 87, text: "настроена на английском", cls: "micro" }
        ],
        inputFlow: [
          { x: 312, y: 174, text: "обучение", cls: "small" }
        ],
        caption: [
          {
            x: 600,
            y: 403,
            text: "Один смысловой маршрут → три языка; целевая разметка для урду не нужна",
            cls: "small"
          }
        ]
      }
    }];

    const origin = { x: 0, y: 0 };
    const scale = 1;
    const sx = x => origin.x + x * scale;
    const sy = y => origin.y + y * scale;

    try {
      const [D] = data;
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      const make = (name, attributes, content) => {
        const element = document.createElementNS(namespace, name);
        Object.entries(attributes).forEach(([key, value]) => {
          element.setAttribute(key, String(value));
        });
        if (content !== undefined) element.textContent = content;
        return element;
      };

      const addRect = (box, className) => {
        svg.appendChild(make("rect", {
          x: sx(box.x1),
          y: sy(box.y1),
          width: sx(box.x2) - sx(box.x1),
          height: sy(box.y2) - sy(box.y1),
          rx: sx(D.radius) - sx(D.zero),
          ry: sy(D.radius) - sy(D.zero),
          class: className
        }));
      };

      const addText = (item, anchor = "middle") => {
        svg.appendChild(make("text", {
          x: sx(item.x),
          y: sy(item.y),
          class: item.cls,
          "text-anchor": anchor
        }, item.text));
      };

      const addPolygon = (points, className) => {
        const value = points
          .map(point => `${sx(point.x)},${sy(point.y)}`)
          .join(" ");
        svg.appendChild(make("polygon", {
          points: value,
          class: className
        }));
      };

      const flowPath = flow => {
        const parts = flow.path.map(segment => {
          if (segment.command === "C") {
            return `${segment.command} ${sx(segment.x)} ${sy(segment.y)} ` +
              `${sx(segment.x2)} ${sy(segment.y2)} ` +
              `${sx(segment.x3)} ${sy(segment.y3)}`;
          }
          return `${segment.command} ${sx(segment.x)} ${sy(segment.y)}`;
        });
        return parts.join(" ");
      };

      svg.appendChild(make("line", {
        x1: sx(D.inputFlow.points.at(D.zero).x),
        y1: sy(D.inputFlow.points.at(D.zero).y),
        x2: sx(D.inputFlow.points.at(-scale).x),
        y2: sy(D.inputFlow.points.at(-scale).y),
        class: "flow flow-input"
      }));
      addPolygon(D.inputFlow.head, "arrow-input");

      D.outputFlows.forEach(flow => {
        svg.appendChild(make("path", {
          d: flowPath(flow),
          class: `flow flow-${flow.kind}`
        }));
        addPolygon(flow.head, `arrow-${flow.kind}`);
      });

      svg.appendChild(make("line", {
        x1: sx(D.headLink.x1),
        y1: sy(D.headLink.y1),
        x2: sx(D.headLink.x2),
        y2: sy(D.headLink.y2),
        class: "head-link"
      }));

      addRect(D.input, "card");
      addRect(D.model, "model-card");
      addRect(D.head, "head-card");
      D.outputs.forEach(output => addRect(output.box, "card"));
      addRect(D.caption, "caption-box");

      D.outputFlows.forEach(flow => {
        svg.appendChild(make("circle", {
          cx: sx(flow.tagAt.x),
          cy: sy(flow.tagAt.y),
          r: sx(D.tagRadius) - sx(D.zero),
          class: `card flow-${flow.kind}`
        }));
        addText({
          x: flow.tagAt.x,
          y: flow.tagAt.y + D.tagRadius / scale - D.radius / scale,
          text: flow.tag,
          cls: `stream-tag ${flow.kind}-title`
        });
      });

      D.labels.input.forEach(item => addText(item));
      D.labels.model.forEach(item => addText(item));
      D.labels.head.forEach(item => addText(item));
      D.labels.inputFlow.forEach(item => addText(item));
      D.labels.caption.forEach(item => addText(item));

      D.outputs.forEach(output => {
        addText({
          x: output.box.x1 + (output.box.x2 - output.box.x1) / (scale + scale),
          y: output.titleY,
          text: output.title,
          cls: `${output.kind}-title`
        });
        addText({
          x: output.box.x1 + (output.box.x2 - output.box.x1) / (scale + scale),
          y: output.detailY,
          text: output.detail,
          cls: output.kind === "urdu" ? "zero-label" : "small"
        });
      });

      fallback.hidden = true;
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      svg.hidden = true;
      fallback.hidden = false;
    }
  </script>
</body>
</html>
