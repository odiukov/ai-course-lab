- concept: косинусное сходство не меняется при положительном масштабировании одного из векторов
  question: Положительное масштабирование эмбеддинга меняет его длину, но сохраняет направление. Заполните тождество.
  explanation: При положительном масштабировании числитель и длина масштабируемого вектора умножаются на один и тот же коэффициент, который сокращается. Поэтому косинус сравнивает направления, а не абсолютные длины эмбеддингов.
  kind: cloze
  template: cos(a, αb) = ___ при положительном α
  answer: cos(a, b)
  accept:
