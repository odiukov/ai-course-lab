- concept: zero-shot-классификация через NLI требует преобразовать каждую метку в естественную гипотезу
  question: Как корректно представить метку «экономика» при zero-shot-классификации с помощью NLI-модели?
  explanation: NLI-модель оценивает отношение между посылкой и полноценной гипотезой. Поэтому название класса вербализуют как естественное утверждение, истинность которого можно проверить по исходному тексту.
  kind: choice
  options:
    - Передать модели только слово «экономика» как посылку
    - Сформулировать гипотезу «Этот текст посвящён экономике»
    - Добавить к модели новую выходную нейронную голову
    - Заменить исходный текст определением экономики
  correct: 1
  id: 022-nli-trick-1
  fingerprint: 076a6492
- concept: NLI-классификация оценивает каждую кандидатную гипотезу относительно одной и той же посылки
  question: Расположите этапы zero-shot-классификации текста с помощью NLI в правильном порядке.
  explanation: Классы сначала превращают в гипотезы, затем каждую гипотезу проверяют на одной и той же посылке. Итоговый класс определяется сравнением оценок логического следования.
  kind: order
  items:
    - Сформулировать для каждой кандидатной метки естественную гипотезу
    - Составить пары из исходного текста-посылки и каждой гипотезы
    - Получить для каждой пары оценку entailment
    - Выбрать метку гипотезы с максимальной оценкой entailment
  id: 022-nli-trick-2
  fingerprint: 9a46fdd6
- concept: предсказанный класс соответствует гипотезе с наибольшей поддержкой entailment
  question: Объясните своими словами, как из оценок NLI для нескольких кандидатных классов получить итоговую метку текста.
  explanation: NLI-модель не возвращает название прикладного класса напрямую. Класс восстанавливают по гипотезе, которую исходный текст поддерживает сильнее остальных.
  kind: open
  reference: Для каждого класса формулируют гипотезу и оценивают, насколько она логически следует из исходного текста. Затем выбирают класс, чья гипотеза получила наибольшую оценку entailment.
  id: 022-nli-trick-3
  fingerprint: 7b3f6aa6
