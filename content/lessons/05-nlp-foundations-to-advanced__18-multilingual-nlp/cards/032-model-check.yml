- concept: Aya подходит для многоязычного диалога и следования инструкциям
  question: Нужно построить многоязычного ассистента, который отвечает на вопросы и выполняет сформулированные пользователем инструкции. Какое семейство соответствует этой задаче?
  explanation: Aya — многоязычная LLM, предназначенная для диалога и следования промптам. NLLB специализируется на переводе, XLM-R — на задачах с энкодером, а mT-пять — на общей text-to-text генерации.
