- concept: канонически эквивалентные записи Unicode без нормализации могут получить разные токенизации
  question: Два слова выглядят одинаково, но в одном буква с диакритикой записана единым символом, а в другом — базовой буквой и комбинируемым знаком. Почему модель может обработать их по-разному?
  explanation: Одинаковое отображение не означает одинаковую последовательность Unicode-кодов. Без предварительной нормализации токенизатор может построить разные последовательности токенов, и модели придётся отдельно учить связь между ними.
  kind: choice
  options:
    - Токенизатор получает разные последовательности кодовых точек и может разбить их на разные токены
    - Визуально одинаковые строки всегда получают одинаковые токены
    - Комбинируемые знаки автоматически удаляются из любого обучающего корпуса
    - Модель сравнивает внешний вид текста, а не его компьютерное представление
  correct: 0
  id: 010-variant-tax-1
  fingerprint: ecf698b2
- concept: Unicode-нормализация должна предшествовать токенизации
  question: Расположите этапы обработки текста в порядке, который сокращает различия между канонически эквивалентными Unicode-записями.
  explanation: Нормализация после токенизации уже не объединит разные разбиения. Одну и ту же согласованную процедуру следует применять и при подготовке обучающих данных, и при инференсе.
  kind: order
  items:
    - Получить исходную строку
    - Привести строку к выбранной форме Unicode-нормализации
    - Передать нормализованную строку токенизатору
  id: 010-variant-tax-2
  fingerprint: cb9ae7df
- concept: диакритику нельзя безусловно удалять, если она различает значения слов
  question: Объясните своими словами, почему удаление всей диакритики — рискованный способ уменьшить число вариантов написания.
  explanation: Нормализация должна объединять технически разные записи одного текста, но не стирать языковые признаки. Если диакритика меняет значение, её удаление создаёт неоднозначность вместо устойчивости.
  kind: open
  reference: В некоторых языках диакритические знаки различают слова или грамматические формы. Их удаление может слить разные единицы в одну и уничтожить смысловую информацию, поэтому нужно устранять технические расхождения представления, сохраняя значимые различия.
  id: 010-variant-tax-3
  fingerprint: ffbd8647
