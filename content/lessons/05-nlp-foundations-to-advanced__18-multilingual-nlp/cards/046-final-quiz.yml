- concept: few-shot перенос использует небольшой размеченный набор целевого языка для дообучения
  question: Объясни своими словами, почему перенос перестаёт быть zero-shot, если при дообучении использовали даже небольшой размеченный набор целевого языка.
  explanation: 'Режим определяется не размером набора сам по себе, а участием целевой разметки в обучении: без неё перенос zero-shot, с небольшим набором — few-shot.'
  kind: open
  reference: Zero-shot не допускает использования целевой разметки для дообучения. Если модель адаптируют на небольшом числе размеченных примеров целевого языка, это few-shot перенос.
  id: 046-final-quiz-2
  fingerprint: 87c96f26
- concept: NLLB ориентирована на широкий охват машинного перевода, включая языки с малыми ресурсами
  question: Какая особенность NLLB особенно важна при создании перевода для языков с дефицитом обучающих данных?
  explanation: NLLB — многоязычное семейство машинного перевода, разработанное с акцентом на широкий языковой охват и поддержку языков с малыми ресурсами.
  kind: choice
  options:
    - Модель предназначена только для классификации текстов из Википедии
    - Модель охватывает множество языков и специально включает языки с малыми ресурсами
    - Модель работает только с одним языком, выбранным при предобучении
    - Модель требует размечать классы вместо переводных пар
  correct: 1
