- concept: zero-shot перенос исключает влияние целевой разметки на обучение, настройку и выбор модели
  question: Объясни, почему подбор гиперпараметров по размеченной выборке целевого языка нарушает условие zero-shot cross-lingual переноса, даже если эти примеры не участвовали в обновлении весов.
  explanation: Для строгой zero-shot оценки недостаточно исключить целевые примеры из градиентного обучения. Целевая разметка также не должна влиять на настройку гиперпараметров, раннюю остановку или выбор лучшего чекпоинта.
  kind: open
  reference: 'Целевая разметка всё равно направляет разработку: по ней выбирают настройки или версию модели. Поэтому итоговая система уже использует информацию о правильных ответах на целевом языке и оценка не является строго zero-shot.'
  id: 003-transfer-check-2
