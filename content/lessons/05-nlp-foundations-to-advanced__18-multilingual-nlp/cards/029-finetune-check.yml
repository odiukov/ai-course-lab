- concept: число эпох задаёт количество проходов по данным, а learning rate — величину обновлений параметров
  question: Как различаются роли числа эпох и learning rate при few-shot fine-tuning многоязычной модели?
  explanation: Дополнительные эпохи повторно показывают модели те же примеры. Небольшой learning rate ограничивает величину каждого изменения и снижает риск резко перезаписать многоязычные представления.
  kind: choice
  options:
    - Число эпох определяет количество проходов по датасету, а learning rate — размер шага обновления параметров
    - Число эпох определяет размер словаря, а learning rate — максимальную длину текста
    - Число эпох управляет padding, а learning rate — удалением исходных колонок
  correct: 0
  id: 029-finetune-check-1
  fingerprint: bc3aa677
- concept: сырые колонки удаляются при токенизации, чтобы коллатор получал только модельные поля
  question: Заполни аргумент Dataset.map, который удалит исходные колонки после создания токенизированных полей.
  explanation: Функция токенизации возвращает input_ids, attention_mask и labels, а remove_columns удаляет исходные text и label. Иначе коллатор может попытаться преобразовать строки в тензоры.
  kind: cloze
  template: ds = ds.map(tokenize_fn, ___=ds.column_names)
  answer: remove_columns
  accept:
    - remove_columns
  id: 029-finetune-check-2
  fingerprint: f6e3aa6d
- concept: truncation ограничивает длину примеров, а динамический padding выравнивает их внутри батча
  question: Объясни своими словами, почему truncation без padding-коллатора не гарантирует, что токенизированные примеры удастся собрать в один батч.
  explanation: Обрезание устанавливает верхнюю границу длины, но не выравнивает все последовательности. Динамический padding выполняет выравнивание отдельно для каждого батча и обычно требует меньше вычислений, чем дополнение всех примеров до общего предела.
  kind: open
  reference: Truncation только обрезает последовательности, превышающие предел, но более короткие примеры сохраняют разные длины. DataCollatorWithPadding дополняет их до длины самого длинного примера текущего батча, после чего из них можно составить прямоугольный тензор.
  id: 029-finetune-check-3
  fingerprint: 2d2dc680
