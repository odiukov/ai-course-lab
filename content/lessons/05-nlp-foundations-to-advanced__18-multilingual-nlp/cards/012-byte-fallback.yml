- concept: byte fallback устраняет OOV благодаря представлению любого корректного Unicode-текста последовательностью байтов
  question: Токенизатор встретил фрагмент редкой письменности, которого нет среди обычных subword-токенов. Почему byte fallback позволяет не заменять этот фрагмент на <unk>?
  explanation: Любую корректную строку Unicode можно представить байтами. Если токенизатор располагает токенами для всех значений байтов, он может без потерь закодировать даже незнакомую письменность и затем восстановить исходную строку.
  kind: choice
  options:
    - Он кодирует фрагмент последовательностью байтов и выдаёт известный токен для каждого байта
    - Он создаёт новый subword-токен и навсегда добавляет его в словарь
    - Он транслитерирует фрагмент на язык с лучшим покрытием словаря
    - Он заменяет фрагмент токеном с наиболее похожим эмбеддингом
  correct: 0
  id: 012-byte-fallback-1
  fingerprint: c7bb4e0d
- concept: байтовая представимость редкого слова не означает, что модель понимает его значение
  question: Объясни своими словами, почему byte fallback устраняет OOV, но сам по себе не даёт модели понимания редкого слова.
  explanation: 'Byte fallback решает проблему представления: модель получает точную последовательность вместо общей заглушки. Семантика из байтов автоматически не возникает — для её освоения нужны примеры употребления слова, а длинная байтовая цепочка дополнительно расходует контекст.'
  kind: open
  reference: Byte fallback сохраняет точную запись слова как последовательность байтов, поэтому информация не исчезает за <unk>. Однако связь этой последовательности со значением слова модель должна выучить по обучающим данным; кроме того, байтовое представление может состоять из множества токенов.
  id: 012-byte-fallback-2
  fingerprint: 07cb67b9
