- concept: accuracy по объединённым примерам взвешивает языки пропорционально размерам их тестовых наборов
  question: Для языка A модель дала 612 правильных ответов на 720 примерах, а для языка B — 32 правильных ответа на 80 примерах. Какой будет единая accuracy после объединения обоих наборов?
  explanation: После объединения получаем (612 + 32) / (720 + 80) × 100% = 80,5%. Такой показатель сильнее зависит от языка A, потому что его тестовый набор значительно больше.
