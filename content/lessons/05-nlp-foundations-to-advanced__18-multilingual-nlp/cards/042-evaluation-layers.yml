- concept: разрыв межъязыковой согласованности измеряется долей эквивалентных пар с разными предсказаниями
  question: Разрыв согласованности определён как процент пар точных переводов, для которых модель предсказала разные классы. Из 25 пар предсказания различаются в 6. Чему равен разрыв в процентах?
  explanation: Разрыв равен 6 / 25 × 100% = 24%. Такая метрика показывает, насколько часто язык формулировки меняет предсказание при неизменном смысле.
  kind: numeric
  answer: 24
  tolerance: 0.01
  id: 042-evaluation-layers-1
  fingerprint: 3da2adbb
- concept: entity-level tests выявляют ошибки обработки именованных сущностей, которые не видны по итоговому классу
  question: Почему высокая accuracy классификации обращений не отменяет необходимости отдельно тестировать имена людей, организаций и географические названия?
  explanation: Accuracy задачи проверяет правильность итоговой метки, но не гарантирует корректную обработку каждого значимого фрагмента текста. Специальные тесты на сущностях обнаруживают эту скрытую слабость.
  kind: open
  reference: Итоговый класс может быть выбран верно, даже если модель плохо распознала или обработала именованную сущность. Entity-level tests изолируют ошибки, связанные с конкретными сущностями, письменностью и токенизацией целевого языка.
  id: 042-evaluation-layers-2
  fingerprint: 3ef7c5ae
- concept: сравнение с одноязычной моделью выявляет потерянный потенциал целевого языка из-за совместного использования параметров
  question: На одном отложенном наборе многоязычная модель получила accuracy 83%, а обученная с нуля только для целевого языка — 91%. При этом тесты переводных пар и именованных сущностей не выявили заметных проблем. Какой вывод непосредственно поддерживают эти результаты?
  explanation: Одноязычный baseline показывает, какого качества можно достичь без разделения параметров между языками. Его преимущество в 8 процентных пунктов указывает на потерянный потенциал целевого языка, но само по себе ничего не доказывает о согласованности переводов или сущностях.
  kind: choice
  options:
    - Многоязычная модель уступает достижимому для этого языка качеству
    - Модель систематически меняет класс при переводе
    - Токенизатор обязательно искажает все именованные сущности
    - Одноязычная модель лучше переносится на остальные языки
  correct: 0
  id: 042-evaluation-layers-3
  fingerprint: 0b196948
