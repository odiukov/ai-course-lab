- concept: одинаковые seed образуют парные запуски и отделяют эффект экспериментального фактора от случайности обучения
  question: Объясните, зачем при сравнении двух исходных языков запускать оба режима с одинаковым набором seed, а затем сравнивать средние результаты.
  explanation: Результат дообучения зависит от случайной инициализации, порядка батчей и других стохастических операций. Поэтому небольшое преимущество одного режима может оказаться шумом; парные запуски с одинаковыми seed и сравнение средних делают вывод надёжнее.
  kind: open
  reference: 'Одинаковые seed создают сопоставимые пары запусков: каждому результату одного исходного языка соответствует результат другого при той же управляемой случайности. Усреднение по нескольким seed уменьшает влияние случайных колебаний и помогает оценить устойчивый эффект выбора исходного языка.'
  id: 045-honest-experiments-2
  fingerprint: e61a262d
