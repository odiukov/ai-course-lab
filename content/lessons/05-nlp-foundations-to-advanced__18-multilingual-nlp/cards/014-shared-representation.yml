- concept: межъязыковое семантическое сближение может возникать без параллельного корпуса переводов
  question: Объясни своими словами, почему masked language modeling на текстах разных языков может сблизить представления переводных по смыслу выражений, даже если модель не получала готовых пар переводов.
  explanation: Параллельные предложения помогают, но не являются обязательным условием. Совместное обучение на похожих контекстных закономерностях постепенно организует скрытое пространство по смыслу, а не только по языку или написанию.
  kind: open
  reference: В разных языках сходные смыслы встречаются в похожих контекстах и отношениях. Общие параметры вынуждены находить признаки, полезные сразу для таких контекстов, а имена, числа и совпадающие подсловные элементы служат дополнительными опорными точками. Поэтому семантически близкие выражения могут получать близкие скрытые представления без явной таблицы переводов.
  id: 014-shared-representation-2
  fingerprint: d4630e03
