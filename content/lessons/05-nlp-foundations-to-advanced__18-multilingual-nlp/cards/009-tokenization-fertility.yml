- concept: нормальные loss и perplexity не доказывают пригодность токенизатора для целевого языка
  question: Почему разумные значения loss и perplexity на целевом языке ещё не означают, что токенизатор выбран удачно?
  explanation: Проблемы токенизатора могут проявиться в продакшне как ошибки морфологии и редких словоформ, не вызывая очевидной аномалии в кривой потерь. Дополнительные данные сами по себе не устраняют неудачную сегментацию.
  kind: open
  reference: Модель способна обучаться даже при чрезмерном дроблении слов, поэтому метрики обучения могут выглядеть нормально, хотя высокий fertility расходует контекст и затрудняет восстановление редких словоформ. Качество токенизации нужно проверять отдельно.
