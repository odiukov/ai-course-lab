- concept: для машинного перевода следует выбирать специально обученное переводческое семейство
  question: Заполни пропуск названием подходящего семейства моделей.
  explanation: NLLB специально обучена преобразовывать исходную последовательность в её перевод. Модель для классификации выдаёт метку, а модель свободной генерации не обязана точно сохранять смысл исходного текста.
  kind: cloze
  template: Задача состоит в построении эквивалентного текста на другом языке, поэтому базовым кандидатом будет семейство ___.
  answer: NLLB
  accept:
    - NLLB
    - семейство NLLB
