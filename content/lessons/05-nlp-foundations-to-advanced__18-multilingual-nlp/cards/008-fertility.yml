- concept: tokenization fertility вычисляется как среднее число токенов на исходное слово
  question: Токенизатор преобразовал текст из 180 слов в 279 токенов. Чему равна tokenization fertility?
  explanation: 'Fertility равна отношению числа токенов к числу слов: F = T / W. Поэтому 279 / 180 = 1,55 токена на слово.'
  kind: numeric
  answer: 1.55
  tolerance: 0.01
  id: 008-fertility-1
  fingerprint: 6281392c
- concept: fertility характеризует среднее дробление слов по всему тексту, а не разбиение каждого отдельного слова
  question: Объясни своими словами, почему fertility 2,25 не означает, что каждое слово было разбито ровно на 2,25 токена.
  explanation: Значение вычисляется для корпуса целиком. Оно усредняет разные варианты сегментации отдельных слов и не описывает каждое слово в отдельности.
  kind: open
  reference: Fertility — это среднее отношение общего числа токенов к общему числу слов. Отдельные слова могут остаться одним токеном или разбиться на разное количество токенов.
  id: 008-fertility-2
  fingerprint: 191232f3
