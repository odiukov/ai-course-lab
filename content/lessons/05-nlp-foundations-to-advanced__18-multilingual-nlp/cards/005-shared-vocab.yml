- concept: раздельные словари дублируют общие морфемы и не дают им накапливать совместную статистику
  question: Почему отдельные subword-словари для родственных языков могут быть менее эффективны, чем один общий словарь, если в языках встречаются одинаковые корни и аффиксы?
  explanation: Общий словарь сокращает дублирование повторяющихся частей слов и объединяет статистику по ним. Особенно это полезно для родственных языков, заимствований, имён, общих корней и аффиксов.
  kind: open
  reference: В раздельных словарях одинаковые морфемы получают разные токены и отдельные параметры, поэтому занимают место несколько раз, а наблюдения из одного языка не улучшают представление соответствующей единицы в другом. Общий словарь объединяет такие наблюдения в одном токене.
  id: 005-shared-vocab-2
