- concept: qWALS оценивает типологическое сходство языков по признакам WALS
  question: Какой метод подходит для численной оценки типологической близости потенциального исходного языка к целевому на основе признаков World Atlas of Language Structures?
  explanation: qWALS оценивает сходство языков по типологическим признакам WALS. LANGRANK ранжирует исходные языки по сочетанию нескольких факторов, включая сходство, объём корпуса и генетическое родство.
  kind: choice
  options:
    - qWALS
    - LANGRANK
    - Tokenization fertility
  correct: 0
  id: 033-source-language-1
  fingerprint: '9909e282'
- concept: выбор исходного языка подтверждают контролируемым сравнением переноса на целевой язык
  question: Расположите этапы контролируемого выбора между английским и типологически близким исходным языком.
  explanation: Чтобы измерить влияние именно исходного языка, модель, объём обучающих данных и остальные условия фиксируют. Окончательное решение принимают по результатам на общем целевом тесте; qWALS или LANGRANK служат предварительным ориентиром.
  kind: order
  items:
    - Выбрать английский и ресурсный язык, типологически близкий к целевому
    - Отдельно дообучить одну и ту же исходную модель на каждом языке при одинаковом объёме данных и прочих условиях
    - Оценить обе полученные модели на одном и том же тестовом наборе целевого языка
    - Выбрать источник по качеству на целевом тесте, а не по размеру доступного корпуса
  id: 033-source-language-2
  fingerprint: fe43f4ec
