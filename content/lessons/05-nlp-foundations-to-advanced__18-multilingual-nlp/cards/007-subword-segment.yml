- concept: корректная полная сегментация сохраняет исходную последовательность символов
  question: Какое простое свойство результата позволяет проверить, что subword-сегментация не пропустила и не продублировала символы полностью покрытого словом словаря?
  explanation: Каждый выбранный токен должен покрывать очередной непрерывный участок входа. Поэтому их конкатенация восстанавливает исходное слово; несовпадение указывает на ошибку в границах или обновлении текущей позиции.
  kind: open
  reference: Если соединить полученные subword-токены без разделителей, должна восстановиться исходная строка. То есть concat(parts) == word.
