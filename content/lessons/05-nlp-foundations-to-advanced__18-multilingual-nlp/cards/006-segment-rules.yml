- concept: отсутствующее в словаре слово представляется последовательностью известных subword-токенов
  question: В фиксированном словаре токенизатора нет слова целиком, но есть подсловные части, из которых его можно составить. Как токенизатор обычно передаст это слово модели?
  explanation: Subword-токенизация позволяет представить незнакомое целое через известные части. Модель получает идентификаторы этих частей, а словарь во время обычного инференса не расширяется.
  kind: choice
  options:
    - Добавит целое слово в словарь и создаст для него новый идентификатор
    - Разобьёт слово на известные части и передаст последовательность их идентификаторов
    - Удалит слово из входного текста
    - Заменит каждую букву одним и тем же неизвестным токеном
  correct: 1
  id: 006-segment-rules-1
  fingerprint: 9cef7c8b
- concept: жадное subword-разбиение последовательно выбирает самый длинный допустимый фрагмент текущего остатка слова
  question: Расположите действия жадного subword-токенизатора в правильном порядке.
  explanation: При жадном разборе токенизатор на каждой позиции ищет самый длинный подходящий словарный фрагмент, фиксирует его и продолжает с оставшейся частью слова.
  kind: order
  items:
    - Взять ещё не обработанный остаток слова
    - Найти самый длинный начальный фрагмент остатка, допустимый словарём и его позицией в слове
    - Выдать идентификатор найденного фрагмента и убрать его из остатка
    - Повторять разбор, пока остаток не закончится
  id: 006-segment-rules-2
  fingerprint: ad25c7ec
