- concept: оценка типологической близости помогает отбирать исходные языки, но не предсказывает точное качество переноса
  question: Почему высокий показатель типологического сходства исходного и целевого языков нельзя считать гарантией лучшей точности модели?
  explanation: qWALS превращает совпадения типологических признаков в полезный сигнал для выбора кандидатов. Однако она не моделирует все факторы downstream-задачи, поэтому окончательный вывод требует оценки качества переноса на целевом языке.
  kind: open
  reference: Типологическая оценка учитывает сходство языковых структур, но итог переноса также зависит от задачи, качества и объёма данных, модели, токенизатора и процедуры обучения. Поэтому оценка пригодна для приоритизации кандидатов, а не для объявления победителя без эксперимента.
  id: 034-language-similarity-rule-2
  fingerprint: af094ede
