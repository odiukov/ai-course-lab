- concept: результаты поиска по сходству выбираются после сортировки оценок по убыванию
  question: Для каждого документа уже вычислена оценка сходства с запросом. Как корректно выбрать наиболее релевантные результаты?
  explanation: Чем выше косинусное сходство, тем ближе документ к запросу. Поэтому индексы сортируют по убыванию оценок, после чего оставляют первые top_k.
  kind: choice
  options:
    - Отсортировать индексы по убыванию оценок и взять начало списка
    - Отсортировать индексы по возрастанию оценок и взять начало списка
    - Выбрать оценки, расположенные ближе всего к нулю
  correct: 0
  id: 019-cross-lingual-retrieve-1
  fingerprint: 345ff4c1
- concept: матрично-векторное умножение вычисляет оценку запроса для каждой строки матрицы документов
  question: Заполни пропуск так, чтобы получить по одной оценке сходства для каждого документа.
  explanation: Каждая строка document_embeddings представляет отдельный документ. Умножение матрицы на вектор запроса возвращает вектор, где каждой строке документа соответствует одна оценка.
  kind: cloze
  template: scores = ___ @ query_embedding
  answer: document_embeddings
  accept:
    - doc_embeddings
    - emb_docs
  id: 019-cross-lingual-retrieve-2
  fingerprint: 7a3293bc
- concept: число результатов top-k ограничено числом доступных документов
  question: Как должна вести себя функция top-k-поиска, если запрошено больше результатов, чем содержится документов, и почему?
  explanation: Top_k задаёт верхнюю границу числа результатов, но не создаёт новых кандидатов. Если документов меньше, корректный ответ содержит только существующие документы.
  kind: open
  reference: Она должна вернуть все доступные документы в порядке убывания сходства, не добавляя фиктивные результаты и не повторяя документы.
  id: 019-cross-lingual-retrieve-3
  fingerprint: cf07ad26
