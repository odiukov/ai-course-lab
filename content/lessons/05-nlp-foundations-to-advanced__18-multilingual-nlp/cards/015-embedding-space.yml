- concept: для единично нормированных эмбеддингов косинусное сходство равно скалярному произведению
  question: Единично нормированные эмбеддинги предложений равны u = (0.6, 0.8) и v = (0.8, 0.6). Чему равно их косинусное сходство?
  explanation: 'Для единично нормированных векторов косинусное сходство равно скалярному произведению: 0.6 × 0.8 + 0.8 × 0.6 = 0.96. Так в коде сходство можно вычислить через np.dot.'
  kind: numeric
  answer: 0.96
  tolerance: 0.001
  id: 015-embedding-space-1
  fingerprint: 75eeb474
- concept: межъязыковой семантический поиск ранжирует кандидатов по смысловой близости, а не по совпадению языка
  question: Многоязычный семантический поиск получил запрос «Самолёт приземлился». Какой кандидат должен иметь наибольшее косинусное сходство с запросом?
  explanation: Английская фраза передаёт тот же смысл, поэтому её эмбеддинг должен оказаться ближе к запросу, несмотря на другой язык. В материале сходство переводов ожидается около 0.85–0.95, а предложения с другим смыслом — примерно 0.3.
  kind: choice
  options:
    - «Поезд прибыл на станцию»
    - «The plane has landed»
    - «L’avion a décollé»
  correct: 1
