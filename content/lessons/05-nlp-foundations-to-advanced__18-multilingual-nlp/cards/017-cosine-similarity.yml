- concept: косинусное сходство ненормированных векторов вычисляется делением скалярного произведения на произведение их норм
  question: Заполни выражение, вычисляющее cosine similarity для двух ненулевых одномерных массивов NumPy.
  explanation: Деление скалярного произведения на произведение евклидовых норм убирает влияние длины векторов и оставляет сравнение их направлений.
  kind: cloze
  template: |-
    dot = np.dot(a, b)
    denom = np.linalg.norm(a) * np.linalg.norm(b)
    return float(___)
  answer: dot / denom
  accept:
    - np.dot(a, b) / denom
    - dot / (np.linalg.norm(a) * np.linalg.norm(b))
