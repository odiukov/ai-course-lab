  fingerprint: '67163218'
- concept: косинусное сходство не определено, если хотя бы один из векторов нулевой
  question: Почему функция cosine similarity должна отдельно обрабатывать случай, когда один из входных векторов нулевой?
  explanation: Норма нулевого вектора равна нулю, поэтому формула приводит к делению на ноль. Кроме того, направление нулевого вектора не определено, а значит, не определён и косинус угла с ним.
  kind: choice
  options:
    - Нулевой вектор автоматически считается максимально непохожим на любой другой
    - Нулевой вектор необходимо сначала заменить единичным вектором
    - У нулевого вектора нет направления, а его норма обращает знаменатель формулы в ноль
