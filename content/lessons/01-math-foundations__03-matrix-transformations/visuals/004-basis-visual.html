<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Базисные векторы до и после преобразования</title>
<style>
  :root{
    --bg:#fbfbfa; --fg:#1c1b19; --muted:#6b6862;
    --grid:#d9d6cf; --grid2:#c3bdb0;
    --v1:#b4531c; --v2:#1f6f8b; --box:#efece5; --line:#8d887c;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16181c; --fg:#e9e7e3; --muted:#9b978f;
      --grid:#2c3037; --grid2:#3a4049;
      --v1:#e8944f; --v2:#63c1d8; --box:#20242a; --line:#7c8794;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
  .wrap{max-width:900px;margin:0 auto;padding:10px 12px 14px;}
  h2{font-size:15px;font-weight:600;margin:0 0 6px;letter-spacing:.01em;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .fail{font-size:14px;line-height:1.5;color:var(--fg);}
  text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace;}
</style>
<div class="wrap">
  <h2>Базисные векторы до и после преобразования M = [[2, 1], [0, 1]]</h2>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    /* ---- данные схемы ---- */
    var D = {
      M:  [[2,1],[0,1]],
      e1: [1,0],
      e2: [0,1],
      gx: [-1,0,1,2],
      gy: [-1,0,1,2],
      gap: 1.1,          /* зазор панель↔рамка матрицы, в клетках */
      headLen: 0.26,
      headHalf: 0.11,
      boxW: 4.1,
      boxY0: 0.2,
      boxY1: 1.6
    };

    function apply(m,v){
      return [m[0][0]*v[0]+m[0][1]*v[1], m[1][0]*v[0]+m[1][1]*v[1]];
    }

    /* ---- геометрия выводится из данных, а не подбирается ---- */
    var gx=D.gx, gy=D.gy;
    var xa=gx[0], xb=gx[gx.length-1], ya=gy[0], yb=gy[gy.length-1];

    /* габарит образа сетки: достаточно четырёх углов, преобразование линейное */
    var corners=[[xa,ya],[xb,ya],[xb,yb],[xa,yb]].map(function(p){ return apply(D.M,p); });
    var ix0=Math.min.apply(null,corners.map(function(p){return p[0];}));
    var ix1=Math.max.apply(null,corners.map(function(p){return p[0];}));
    var iy0=Math.min.apply(null,corners.map(function(p){return p[1];}));
    var iy1=Math.max.apply(null,corners.map(function(p){return p[1];}));

    var box={x0: xb + D.gap, y0: D.boxY0, y1: D.boxY1};
    box.x1 = box.x0 + D.boxW;
    var shift = box.x1 + D.gap - ix0;          /* сдвиг правой панели вправо */

    var xmin=xa, xmax=ix1+shift;
    var ymin=Math.min(ya,iy0), ymax=Math.max(yb,iy1);

    /* пиксельные литералы: поля, отступы подписей, толщины, кегль */
    /* слева поле шире: там подпись e₂ висит снаружи оси */
    var MARGL=46, MARGR=22, MARGT=22, MARGB=22, TOPPAD=26, BOTPAD=46;
    var PAD=10, PADY=18, LW=1.6, GW=1, FS=14, FSM=15;
    var scale=36;

    var origin={ x: MARGL - xmin*scale, y: MARGT + TOPPAD + ymax*scale };
    var W = Math.round(MARGL + (xmax-xmin)*scale + MARGR);
    var H = Math.round(origin.y - ymin*scale + BOTPAD + MARGB);

    function sx(x){ return origin.x + x*scale; }
    function sy(y){ return origin.y - y*scale; }

    var NS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    svg.setAttribute('role','img');

    function el(n,a){ var e=document.createElementNS(NS,n);
      for(var k in a) e.setAttribute(k,a[k]); svg.appendChild(e); return e; }

    function seg(p,q,stroke,w,op){
      el('line',{x1:sx(p[0]),y1:sy(p[1]),x2:sx(q[0]),y2:sy(q[1]),
        stroke:stroke,'stroke-width':w,'stroke-opacity':(op==null?1:op),
        'stroke-linecap':'round'});
    }
    function label(p,txt,anchor,dx,dy,fill,size,cls){
      var t=el('text',{x:sx(p[0])+dx,y:sy(p[1])+dy,'text-anchor':anchor,
        fill:fill,'font-size':(size||FS)});
      if(cls) t.setAttribute('class',cls);
      t.textContent=txt; return t;
    }
    function labelPx(x,y,txt,fill,size){
      var t=el('text',{x:x,y:y,'text-anchor':'middle',fill:fill,'font-size':(size||FS)});
      t.textContent=txt; return t;
    }
    function arrow(from,to,color){
      var dx=to[0]-from[0], dy=to[1]-from[1], L=Math.hypot(dx,dy);
      var ux=dx/L, uy=dy/L, nx=-uy, ny=ux;
      var b=[to[0]-ux*D.headLen, to[1]-uy*D.headLen];
      seg(from,b,color,LW);
      var a1=[b[0]+nx*D.headHalf, b[1]+ny*D.headHalf];
      var a2=[b[0]-nx*D.headHalf, b[1]-ny*D.headHalf];
      el('polygon',{fill:color,points:
        sx(to[0])+','+sy(to[1])+' '+sx(a1[0])+','+sy(a1[1])+' '+sx(a2[0])+','+sy(a2[1])});
    }
    function moved(v){ var w=apply(D.M,v); return [w[0]+shift, w[1]]; }

    /* сетка «до» */
    gx.forEach(function(i){ seg([i,ya],[i,yb],'var(--grid)',GW); });
    gy.forEach(function(j){ seg([xa,j],[xb,j],'var(--grid)',GW); });
    seg([xa,0],[xb,0],'var(--line)',GW);
    seg([0,ya],[0,yb],'var(--line)',GW);

    /* сетка «после» — образы тех же линий, сдвинутые вправо */
    gx.forEach(function(i){ seg(moved([i,ya]),moved([i,yb]),'var(--grid2)',GW); });
    gy.forEach(function(j){ seg(moved([xa,j]),moved([xb,j]),'var(--grid2)',GW); });
    seg(moved([xa,0]),moved([xb,0]),'var(--line)',GW);
    seg(moved([0,ya]),moved([0,yb]),'var(--line)',GW);

    /* единичный квадрат до и его образ — ромб */
    var unit=[[0,0],[1,0],[1,1],[0,1]];
    el('polygon',{points:unit.map(function(p){return sx(p[0])+','+sy(p[1]);}).join(' '),
      fill:'var(--v1)','fill-opacity':0.10});
    el('polygon',{points:unit.map(moved).map(function(p){return sx(p[0])+','+sy(p[1]);}).join(' '),
      fill:'var(--v1)','fill-opacity':0.10});

    /* базисные векторы «до» */
    var O=[0,0];
    arrow(O,D.e1,'var(--v1)');
    arrow(O,D.e2,'var(--v2)');
    label([D.e1[0]/2,0],'e₁=[1,0]','middle',0,PADY,'var(--v1)');
    label([0,D.e2[1]/2],'e₂=[0,1]','end',-PAD,0,'var(--v2)');

    /* базисные векторы «после» — столбцы M */
    var O2=moved(O), f1=moved(D.e1), f2=moved(D.e2);
    arrow(O2,f1,'var(--v1)');
    arrow(O2,f2,'var(--v2)');
    label([(O2[0]+f1[0])/2,(O2[1]+f1[1])/2],'e₁′=[2,0]','middle',0,PADY,'var(--v1)');
    label([(O2[0]+f2[0])/2,(O2[1]+f2[1])/2],'e₂′=[1,1]','end',-PAD,-4,'var(--v2)');

    /* матрица посередине */
    label([box.x0+0.25,(box.y0+box.y1)/2],'M =','start',0,0,'var(--fg)',FSM,'mono');
    var cx=(box.x0+box.x1)/2+0.6;
    label([cx,1.12],'[  2   1 ]','middle',0,0,'var(--fg)',FSM,'mono');
    label([cx,0.58],'[  0   1 ]','middle',0,0,'var(--fg)',FSM,'mono');
    el('rect',{x:sx(box.x0),y:sy(box.y1),
      width:sx(box.x1)-sx(box.x0),height:sy(box.y0)-sy(box.y1),
      rx:8,fill:'none',stroke:'var(--line)','stroke-width':GW});

    /* стрелки-переходы */
    arrow([xb+0.15,0.9],[box.x0-0.15,0.9],'var(--line)');
    arrow([box.x1+0.15,0.9],[shift+ix0-0.15,0.9],'var(--line)');

    /* заголовки панелей */
    label([(xa+xb)/2,ymax],'Исходный базис','middle',0,-PAD,'var(--muted)');
    label([shift+(ix0+ix1)/2,ymax],'После преобразования M','middle',0,-PAD,'var(--muted)');

    /* легенда — по центру всего холста */
    labelPx(W/2, sy(ymin)+22,
      'Столбцы M — концы новых стрелок: e₁′=[2,0] (первый столбец), e₂′=[1,1] (второй)',
      'var(--fg)');
    labelPx(W/2, sy(ymin)+40,
      'Квадрат стал ромбом, сетка наклонилась: линии остались параллельными и равномерными',
      'var(--muted)');

    host.appendChild(svg);
  }catch(err){
    host.innerHTML='<p class="fail">Схема не построилась. Она должна показывать: '+
      'слева базисные векторы e₁=[1,0] (вправо) и e₂=[0,1] (вверх) на клетчатой сетке; '+
      'посередине матрицу M = [[2, 1], [0, 1]]; справа те же векторы после преобразования — '+
      'e₁′=[2,0] (вправо, вдвое длиннее) и e₂′=[1,1] (наискось вверх-вправо), то есть столбцы M, '+
      'вместе с наклонённой сеткой, где единичный квадрат превратился в ромб.</p>';
  }
})();
</script>
</html>
