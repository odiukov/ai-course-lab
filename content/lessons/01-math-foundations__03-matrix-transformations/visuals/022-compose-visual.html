<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Два пути одной точки (1, 0)</title>
<style>
  :root{
    --bg:#fbfaf7; --ink:#23201a; --axis:#8b8577; --grid:#d8d3c7;
    --c1:#1d5fb8; --c2:#c2610a; --panel:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171c; --ink:#e7e7e2; --axis:#5f6874; --grid:#2b313a;
      --c1:#7cb0ff; --c2:#f2a24d; --panel:#1a1e25;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.45 "Helvetica Neue",Arial,sans-serif;}
  .wrap{max-width:650px;margin:0 auto;padding:12px;box-sizing:border-box;}
  h2{margin:0 0 8px;font-size:16px;font-weight:600;}
  .fig{background:var(--panel);border:1px solid var(--grid);border-radius:8px;padding:6px;}
  svg{display:block;width:100%;height:auto;max-height:520px;}
  text{font:15px "Helvetica Neue",Arial,sans-serif;fill:var(--ink);}
  text.pt{font-size:14px;}
  .ax{stroke:var(--axis);stroke-width:1.4;fill:none;}
  .ax-t{fill:var(--axis);font-size:14px;}
  .s1{stroke:var(--c1);}
  .s2{stroke:var(--c2);}
  .f1{fill:var(--c1);}
  .f2{fill:var(--c2);}
  .curve{fill:none;stroke-width:2.2;}
  .lab1{fill:var(--c1);}
  .lab2{fill:var(--c2);}
  ul.legend{list-style:none;margin:10px 0 0;padding:0;font-size:14px;}
  ul.legend li{margin:4px 0;}
  .sw{display:inline-block;width:22px;height:3px;vertical-align:middle;
    margin-right:8px;border-radius:2px;}
  .sw1{background:var(--c1);} .sw2{background:var(--c2);}
  .fallback{color:var(--ink);font-size:14px;margin:0;}
  code{font-size:13px;}
</style>
<div class="wrap">
  <h2>Два пути одной точки (1, 0)</h2>
  <div class="fig" id="fig"></div>
  <ul class="legend">
    <li><span class="sw sw1"></span>Сначала поворот 90°, потом масштаб:
      (1, 0) → (0, 1) → (0, 0.5) — это <code>S @ R</code></li>
    <li><span class="sw sw2"></span>Сначала масштаб, потом поворот 90°:
      (1, 0) → (2, 0) → (0, 2) — это <code>R @ S</code></li>
  </ul>
</div>
<script>
(function(){
  var fig = document.getElementById('fig');
  try{
    /* ---------- данные схемы ---------- */
    var D = {
      origin: {x:200, y:380},
      scale: 120,
      axis: {x0:-0.5, x1:2.6, y0:-0.5, y1:2.4},
      tickX: [1, 2],
      tickY: [0.5, 1, 2],
      dot: 0.05, tick: 0.07,
      arrow: {gap:0.09, head:0.15, wing:0.075},
      segs: [
        {k:1, p0:[1,0], c:[1.15,1.15], p1:[0,1],
         t:'\u2460 поворот 90\u00B0', at:[0,0.3], dx:8, dy:0, anc:'start'},
        {k:1, p0:[0,1], c:[-0.3,0.75], p1:[0,0.5],
         t:'\u2461 масштаб', at:[-0.3,0.75], dx:0, dy:0, anc:'end'},
        {k:2, p0:[1,0], c:[1.5,-0.35], p1:[2,0],
         t:'\u2460 масштаб', at:[1.5,-0.5], dx:0, dy:0, anc:'middle'},
        {k:2, p0:[2,0], c:[1.5,1.5], p1:[0,2],
         t:'\u2461 поворот 90\u00B0', at:[1.6,1.7], dx:0, dy:0, anc:'start'}
      ],
      pts: [
        {p:[1,0],   t:'(1, 0)',   dx:-10, dy:22, anc:'end', k:0},
        {p:[0,1],   t:'(0, 1)',   dx:-8,  dy:-10, anc:'end', k:1},
        {p:[0,0.5], t:'(0, 0.5)', dx:-8,  dy:20, anc:'end', k:1},
        {p:[2,0],   t:'(2, 0)',   dx:10,  dy:22, anc:'start', k:2},
        {p:[0,2],   t:'(0, 2)',   dx:-8,  dy:6,  anc:'end', k:2}
      ]
    };

    /* ---------- единственный перевод координат ---------- */
    var O = D.origin, S = D.scale;
    function sx(x){ return O.x + x * S; }
    function sy(y){ return O.y - y * S; }
    function P(p){ return sx(p[0]) + ' ' + sy(p[1]); }

    var R  = sx(D.dot)  - sx(0);   /* радиус точки в пикселях */
    var TK = sx(D.tick) - sx(0);   /* половина засечки */

    var out = [];
    function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
    function txt(x, y, anc, cls, s){
      out.push('<text x="'+x+'" y="'+y+'" text-anchor="'+anc+'" class="'+cls+'">'
        + esc(s) + '</text>');
    }

    /* оси */
    out.push('<path class="ax" d="M '+P([D.axis.x0,0])+' L '+P([D.axis.x1,0])+'"/>');
    out.push('<path class="ax" d="M '+P([0,D.axis.y0])+' L '+P([0,D.axis.y1])+'"/>');
    /* засечки */
    D.tickX.forEach(function(v){
      out.push('<path class="ax" d="M '+sx(v)+' '+(sy(0)-TK)+' L '+sx(v)+' '+(sy(0)+TK)+'"/>');
    });
    D.tickY.forEach(function(v){
      out.push('<path class="ax" d="M '+(sx(0)-TK)+' '+sy(v)+' L '+(sx(0)+TK)+' '+sy(v)+'"/>');
    });
    txt(sx(D.axis.x1)+14, sy(0)+5, 'start', 'ax-t', 'x');
    txt(sx(0)-8, sy(D.axis.y1)-8, 'end', 'ax-t', 'y');
    txt(sx(0)-8, sy(0)+20, 'end', 'ax-t', '0');

    /* кривые со стрелками */
    var A = D.arrow;
    D.segs.forEach(function(s){
      var d = [s.p1[0]-s.c[0], s.p1[1]-s.c[1]];
      var L = Math.hypot(d[0], d[1]) || 1;
      var u = [d[0]/L, d[1]/L], n = [-u[1], u[0]];
      var tip  = [s.p1[0]-u[0]*A.gap, s.p1[1]-u[1]*A.gap];
      var back = [tip[0]-u[0]*A.head, tip[1]-u[1]*A.head];
      var w1 = [back[0]+n[0]*A.wing, back[1]+n[1]*A.wing];
      var w2 = [back[0]-n[0]*A.wing, back[1]-n[1]*A.wing];
      out.push('<path class="curve s'+s.k+'" d="M '+P(s.p0)+' Q '+P(s.c)+' '+P(tip)+'"/>');
      out.push('<polygon class="f'+s.k+'" points="'+P(tip)+' '+P(w1)+' '+P(w2)+'"/>');
      txt(sx(s.at[0])+s.dx, sy(s.at[1])+s.dy, s.anc, 'lab'+s.k, s.t);
    });

    /* точки и их подписи */
    D.pts.forEach(function(q){
      out.push('<circle cx="'+sx(q.p[0])+'" cy="'+sy(q.p[1])+'" r="'+R
        + '" class="'+(q.k ? 'f'+q.k : 'ax-t')+'"/>');
      txt(sx(q.p[0])+q.dx, sy(q.p[1])+q.dy, q.anc, 'pt', q.t);
    });

    fig.innerHTML = '<svg viewBox="60 60 500 400" preserveAspectRatio="xMidYMid meet" '
      + 'role="img" aria-label="Две последовательности преобразований точки (1, 0)">'
      + out.join('') + '</svg>';
  }catch(e){
    fig.innerHTML = '<p class="fallback">Схема должна показывать один старт и два финиша. '
      + 'Верхний путь: (1, 0) — поворот 90° → (0, 1) — масштаб → (0, 0.5). '
      + 'Нижний путь: (1, 0) — масштаб → (2, 0) — поворот 90° → (0, 2). '
      + 'Те же два шага в разном порядке дают финиши, отличающиеся в 4 раза.</p>';
  }
})();
</script>
</html>
