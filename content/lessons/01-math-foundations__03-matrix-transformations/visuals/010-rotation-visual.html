<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Поворот на 45°</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1a1a1a; --muted:#6b7280; --grid:#e5e7eb;
    --axis:#9ca3af; --a:#1d4ed8; --b:#b45309; --arc:#94a3b8;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12151a; --fg:#e8eaed; --muted:#9aa4b2; --grid:#242a33;
      --axis:#5b6470; --a:#7aa2ff; --b:#f0b45e; --arc:#5b6470;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:12px;box-sizing:border-box;}
  h2{font-size:15px;font-weight:600;margin:0 0 8px;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .fail{font-size:13px;line-height:1.5;color:var(--fg);}
</style>
</head>
<body>
<div class="wrap">
  <h2>Поворот на 45°: точки скользят по своим окружностям</h2>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    var W = 700, H = 480;
    var origin = {x: 300, y: 380};
    var scale  = 95;
    var PAD = 8, FS = 14, LW = 1.6;

    function sx(x){ return origin.x + x * scale; }
    function sy(y){ return origin.y - y * scale; }

    var DATA = {
      A:  {x: 2,    y: 1,    label: "A(2, 1)"},
      Ap: {x: 0.71, y: 2.12, label: "A′(0.71, 2.12)"},
      B:  {x: 0,    y: 2,    label: "B(0, 2)"},
      Bp: {x:-1.41, y: 1.41, label: "B′(−1.41, 1.41)"},
      xMin: -2.5, xMax: 3, yMin: -0.5, yMax: 3,
      ticks: [-2,-1,1,2,3]
    };

    var NS = "http://www.w3.org/2000/svg";
    function el(n, a){ var e = document.createElementNS(NS,n);
      for(var k in a) e.setAttribute(k, a[k]); return e; }
    function txt(x,y,s,anchor,cls){
      var t = el("text",{x:x,y:y,"text-anchor":anchor,"font-size":FS,
        "font-family":"inherit",class:cls||"" });
      t.textContent = s; return t;
    }

    var svg = el("svg",{viewBox:"0 0 "+W+" "+H,
      preserveAspectRatio:"xMidYMid meet",role:"img",
      "aria-label":"Точки A и B поворачиваются на 45 градусов по дугам окружностей"});

    // --- grid ---
    var g = el("g",{stroke:"var(--grid)","stroke-width":1});
    for(var i=Math.ceil(DATA.xMin); i<=DATA.xMax; i++)
      g.appendChild(el("line",{x1:sx(i),y1:sy(DATA.yMin),x2:sx(i),y2:sy(DATA.yMax)}));
    for(var j=Math.ceil(DATA.yMin); j<=DATA.yMax; j++)
      g.appendChild(el("line",{x1:sx(DATA.xMin),y1:sy(j),x2:sx(DATA.xMax),y2:sy(j)}));
    svg.appendChild(g);

    // --- axes ---
    var ax = el("g",{stroke:"var(--axis)","stroke-width":LW,"stroke-linecap":"round"});
    ax.appendChild(el("line",{x1:sx(DATA.xMin),y1:sy(0),x2:sx(DATA.xMax),y2:sy(0)}));
    ax.appendChild(el("line",{x1:sx(0),y1:sy(DATA.yMin),x2:sx(0),y2:sy(DATA.yMax)}));
    svg.appendChild(ax);

    // ticks + numbers
    var tk = el("g",{});
    DATA.ticks.forEach(function(v){
      if(v>=DATA.xMin && v<=DATA.xMax){
        tk.appendChild(el("line",{x1:sx(v),y1:sy(0),x2:sx(v),y2:sy(-0.06),
          stroke:"var(--axis)","stroke-width":LW}));
        tk.appendChild(txt(sx(v), sy(0)+FS+PAD, String(v), "middle"));
      }
      if(v>=DATA.yMin && v<=DATA.yMax && v>0){
        tk.appendChild(el("line",{x1:sx(0),y1:sy(v),x2:sx(-0.06),y2:sy(v),
          stroke:"var(--axis)","stroke-width":LW}));
        tk.appendChild(txt(sx(0)-PAD, sy(v)+FS*0.35, String(v), "end"));
      }
    });
    tk.setAttribute("fill","var(--muted)");
    svg.appendChild(tk);
    svg.appendChild(txt(sx(DATA.xMax), sy(0)+FS+PAD, "x", "end")).setAttribute("fill","var(--muted)");
    svg.appendChild(txt(sx(0)+PAD, sy(DATA.yMax)+FS*0.9, "y", "start")).setAttribute("fill","var(--muted)");
    svg.appendChild(txt(sx(0)-PAD, sy(0)+FS+PAD, "0", "end")).setAttribute("fill","var(--muted)");

    // --- circles of constant radius ---
    function radius(p){ return Math.sqrt(p.x*p.x + p.y*p.y); }
    var rA = radius(DATA.A), rB = radius(DATA.B);
    var circ = el("g",{fill:"none",stroke:"var(--arc)","stroke-width":1,
      "stroke-dasharray":"3 4",opacity:"0.75"});
    circ.appendChild(el("circle",{cx:sx(0),cy:sy(0),r:sx(rA)-sx(0)}));
    circ.appendChild(el("circle",{cx:sx(0),cy:sy(0),r:sx(rB)-sx(0)}));
    svg.appendChild(circ);

    // --- radii ---
    var rad = el("g",{stroke:"var(--muted)","stroke-width":1,opacity:"0.6"});
    [DATA.A,DATA.Ap,DATA.B,DATA.Bp].forEach(function(p){
      rad.appendChild(el("line",{x1:sx(0),y1:sy(0),x2:sx(p.x),y2:sy(p.y)}));
    });
    svg.appendChild(rad);

    // --- arc from p to q, counter-clockwise, with arrow head at q ---
    function arc(p,q,color){
      var r = radius(p);
      var d = "M "+sx(p.x)+" "+sy(p.y)+" A "+(sx(r)-sx(0))+" "+(sy(0)-sy(r))+
              " 0 0 0 "+sx(q.x)+" "+sy(q.y);
      var path = el("path",{d:d,fill:"none",stroke:color,
        "stroke-width":LW+0.6,"stroke-linecap":"round"});
      // arrow head built from data coords: tangent at q (counter-clockwise)
      var a = Math.atan2(q.y,q.x);
      var hb = 0.20, hw = 0.10;                       // head length/width in units
      var tx = -Math.sin(a), ty = Math.cos(a);        // tangent direction
      var nx = Math.cos(a),  ny = Math.sin(a);        // radial direction
      var bx = q.x - tx*hb, by = q.y - ty*hb;
      var head = el("polygon",{fill:color,points:
        sx(q.x)+","+sy(q.y)+" "+
        sx(bx+nx*hw)+","+sy(by+ny*hw)+" "+
        sx(bx-nx*hw)+","+sy(by-ny*hw)});
      return [path, head];
    }
    arc(DATA.A, DATA.Ap, "var(--a)").forEach(function(n){ svg.appendChild(n); });
    arc(DATA.B, DATA.Bp, "var(--b)").forEach(function(n){ svg.appendChild(n); });

    // --- points ---
    function dot(p,color){
      svg.appendChild(el("circle",{cx:sx(p.x),cy:sy(p.y),r:5,fill:color}));
    }
    dot(DATA.A,"var(--a)"); dot(DATA.Ap,"var(--a)");
    dot(DATA.B,"var(--b)"); dot(DATA.Bp,"var(--b)");

    // --- labels: разведены в разные стороны ---
    function lab(p,s,anchor,dx,dy,color){
      var t = txt(sx(p.x)+dx, sy(p.y)+dy, s, anchor);
      t.setAttribute("fill",color); t.setAttribute("font-weight","600");
      svg.appendChild(t);
    }
    lab(DATA.A,  DATA.A.label,  "start",  PAD,  FS*0.9, "var(--a)");   // справа-снизу
    lab(DATA.Ap, DATA.Ap.label, "start",  PAD, -PAD,    "var(--a)");   // справа-сверху
    lab(DATA.B,  DATA.B.label,  "start",  PAD,  FS*0.9, "var(--b)");   // справа-снизу
    lab(DATA.Bp, DATA.Bp.label, "end",   -PAD, -PAD,    "var(--b)");   // слева-сверху

    // --- легенда: радиусы не меняются ---
    var leg = el("g",{fill:"var(--muted)","font-size":FS});
    var l1 = txt(sx(DATA.xMin), sy(DATA.yMin)+FS*2.6,
      "|OA| = |OA′| ≈ 2.24     |OB| = |OB′| = 2     поворот на 45° против часовой", "start");
    leg.appendChild(l1);
    svg.appendChild(leg);

    host.appendChild(svg);
  }catch(e){
    host.innerHTML = '<p class="fail">Схема не построилась. Она должна была показать: '+
      'точка A(2, 1) по дуге окружности радиуса ≈2.24 переходит в A′(0.71, 2.12), '+
      'а точка B(0, 2) по дуге радиуса 2 переходит в B′(−1.41, 1.41). '+
      'Обе дуги идут против часовой стрелки на один и тот же угол 45°, '+
      'расстояния до начала координат не меняются, а у B′ первая координата '+
      'становится отрицательной.</p>';
  }
})();
</script>
</body>
</html>
