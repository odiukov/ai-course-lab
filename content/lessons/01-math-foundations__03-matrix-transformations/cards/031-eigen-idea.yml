- concept: собственное значение находится как общий коэффициент пропорциональности между Av и v
  question: Для матрицы A = [[5, 4], [4, 5]] вектор v = [4, 4] является собственным. Чему равно соответствующее собственное значение?
  explanation: A @ v = [36, 36] = 9 · [4, 4]. Результат пропорционален исходному вектору, поэтому собственное значение равно 9.
  kind: numeric
  answer: 9
  tolerance: 0.001
  id: 031-eigen-idea-1
  fingerprint: fb1f5452
- concept: отрицательное собственное значение меняет ориентацию вектора, но сохраняет его прямую
  question: Ненулевой вектор v удовлетворяет равенству A @ v = -4v. Что происходит с ним при преобразовании A?
  explanation: Отрицательный знак разворачивает вектор в противоположную сторону, а модуль собственного значения задаёт изменение длины. При этом вектор остаётся на той же прямой.
  kind: choice
  options:
    - Он остаётся на той же прямой, разворачивается в противоположную сторону и увеличивается по длине
    - Он поворачивается на произвольный угол без изменения длины
    - Он сохраняет и направление, и длину без изменений
