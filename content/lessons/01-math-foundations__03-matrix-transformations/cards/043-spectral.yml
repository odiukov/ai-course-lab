- concept: лапласиан графа вычисляется как разность матрицы степеней и матрицы смежности
  question: Заполни пропуск в формуле комбинаторного лапласиана графа.
  explanation: Диагональная матрица D хранит степени узлов, а матрица A — их связи. Их разность L = D − A называется лапласианом графа.
  kind: cloze
  template: D = diag(deg(vᵢ)),  L = ___
  answer: D - A
  accept:
    - D-A
    - D − A
  id: 043-spectral-1
  fingerprint: 4c747515
- concept: собственные векторы лапласиана с малыми собственными значениями выявляют сообщества графа
  question: Как собственный вектор лапласиана с малым собственным значением помогает разделить граф на сообщества?
  explanation: Координаты такого собственного вектора служат числовым представлением узлов. Узлы плотной группы получают близкие значения, поэтому сообщества можно отделить по заметным разрывам между ними.
  kind: choice
  options:
    - Его максимальная координата указывает узел с наибольшей степенью, а остальные узлы отбрасываются
    - Его координаты напрямую задают наличие или отсутствие каждого ребра
    - Он сопоставляет узлам числа, которые обычно близки внутри одного сообщества и заметно различаются между сообществами
  correct: 2
  id: 043-spectral-2
  fingerprint: 1ad88870
