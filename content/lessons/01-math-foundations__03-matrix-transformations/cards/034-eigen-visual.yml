- concept: при повторном применении матрицы направление с наибольшим по модулю собственным значением становится доминирующим
  question: Матрица A имеет собственные векторы p и q с положительными собственными значениями 9 и 4 соответственно. Вектор x содержит ненулевые компоненты вдоль обоих собственных векторов. Объясните своими словами, к какому направлению будет приближаться A^k x при росте k и почему.
  explanation: 'Повторное применение матрицы возводит собственные значения в степень: компоненты получают множители 9^k и 4^k. Поскольку 9^k растёт относительно 4^k, результирующий вектор всё сильнее направлен вдоль p.'
  kind: open
  reference: Направление A^k x будет приближаться к направлению p. После каждого применения матрицы компонента вдоль p умножается на 9, а компонента вдоль q — на 4, поэтому их отношение растёт как (9/4)^k и первая компонента начинает преобладать.
  id: 034-eigen-visual-2
  fingerprint: 7b27dd0a
