- concept: результат np.linalg.det для матриц с плавающей точкой следует сравнивать с ожидаемым значением с учётом численной погрешности
  question: Для матрицы поворота `np.linalg.det` вернул значение, очень близкое к единичному, но не совпавшее с ним точно. Как это интерпретировать и как корректно проверить результат?
  explanation: Тригонометрические значения и операции линейной алгебры вычисляются с конечной точностью. Поэтому вместо ровной единицы можно получить `0.9999999999999998`; для проверки подходит сравнение с допуском, а `np.round` или форматирование — для удобного отображения.
  kind: open
  reference: Небольшое отклонение возникает из-за округления чисел с плавающей точкой и само по себе не означает ошибку. Определитель следует сравнивать с ожидаемым значением приближённо, например через `np.isclose`, либо округлять только для вывода.
