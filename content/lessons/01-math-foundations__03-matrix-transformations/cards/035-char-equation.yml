- concept: собственные значения находятся как корни характеристического уравнения
  question: Дана матрица [[5, 6], [6, 5]]. Найдите её наибольшее собственное значение.
  explanation: Характеристический определитель равен (5 − λ)(5 − λ) − 36. Приравнивая его к нулю, получаем (5 − λ)(5 − λ) = 36. Наибольший корень равен 5 + 6 = 11.
  kind: numeric
  answer: 11
  tolerance: 0.25
