- concept: в базисе собственных векторов матрица линейного преобразования становится диагональной
  question: Заполни пропуск в формуле, выражающей матрицу A в координатах её собственного базиса.
  explanation: Из A = V D V⁻¹ следует V⁻¹ A V = D. Таким образом, после перехода в базис из собственных векторов преобразование описывается диагональной матрицей.
