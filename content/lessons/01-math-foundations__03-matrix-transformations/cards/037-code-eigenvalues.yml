- concept: отрицательный дискриминант даёт комплексно-сопряжённые собственные значения
  question: Какие собственные значения имеет матрица [[5, -9], [9, 5]]?
  explanation: След равен 10, определитель — 106, а дискриминант — -324. Поэтому вещественная часть каждого корня равна 5, а мнимые части равны 9 и -9.
  kind: choice
  options:
    - 14 и -5
    - 5 и 9
    - 9 + 5i и 9 - 5i
    - -5 + 9i и -5 - 9i
    - 10 + 9i и 10 - 9i
    - 5 + 9i и 5 - 9i
  correct: 5
  id: 037-code-eigenvalues-1
  fingerprint: 8b6b5a77
- concept: порядок вычислений в алгоритме поиска собственных значений квадратной матрицы
  question: Алгоритм должен найти собственные значения матрицы [[a, b], [c, d]]. Расположи действия в правильном порядке.
  explanation: 'Каждый следующий этап использует результаты предыдущего: дискриминант зависит от следа и определителя, а вид корней определяется знаком дискриминанта.'
  kind: order
  items:
    - Извлечь из строк матрицы элементы a, b, c и d
    - Вычислить след и определитель
    - Вычислить дискриминант по следу и определителю
    - Выбрать формулу для вещественных или комплексных корней по знаку дискриминанта
  id: 037-code-eigenvalues-2
  fingerprint: bf9a3638
- concept: кратное собственное значение сохраняется в результате с его алгебраической кратностью
  question: Что должна вернуть функция, которая всегда выдаёт пару собственных значений, если дискриминант характеристического уравнения равен нулю? Объясни почему.
  explanation: При нулевом дискриминанте обе ветви формулы дают одно и то же значение. Поэтому интерфейс функции сохраняет пару элементов, хотя их значения совпадают.
  kind: open
  reference: Она должна вернуть пару одинаковых значений. Нулевой дискриминант означает, что характеристическое уравнение имеет совпадающие корни, но кратный корень учитывается с его алгебраической кратностью.
  id: 037-code-eigenvalues-3
  fingerprint: 1059c9a0
