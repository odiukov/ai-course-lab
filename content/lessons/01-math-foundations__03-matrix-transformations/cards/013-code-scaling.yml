- concept: структура матрицы независимого масштабирования по осям
  question: Как должна быть устроена матрица масштабирования с коэффициентами sx и sy?
  explanation: Диагональное расположение коэффициентов заставляет каждую координату умножаться на собственный масштаб. Нулевые внедиагональные элементы исключают влияние горизонтальной координаты на вертикальную и наоборот.
  kind: open
  reference: Она хранит sx и sy на главной диагонали, а во внедиагональных позициях — нули.
  id: 013-code-scaling-1
  fingerprint: 99d95f9e
- concept: вычисление координаты после масштабирования вдоль соответствующей оси
  question: Точку с горизонтальной координатой 7 масштабируют по горизонтали с коэффициентом -6. Какой станет её горизонтальная координата?
  explanation: 'При масштабировании горизонтальная координата умножается на sx: 7 · (-6) = -42. Отрицательный коэффициент также меняет направление относительно начала координат.'
  kind: numeric
  answer: -42
  tolerance: 0.001
  id: 013-code-scaling-2
