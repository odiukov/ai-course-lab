- concept: направление горизонтального сдвига определяется знаком коэффициента сдвига
  question: Преобразование задано формулами x′ = x + ky и y′ = y. Коэффициент k отрицателен. Куда смещаются точки с положительной координатой y?
  explanation: При положительном y произведение ky отрицательно, поэтому новая координата x′ меньше исходной. Координата y не меняется, следовательно, точки смещаются влево без изменения высоты.
  kind: choice
  options:
    - Вправо, сохраняя высоту
    - Влево, сохраняя высоту
    - Вниз, сохраняя горизонтальную координату
  correct: 1
  id: 016-shear-visual-1
  fingerprint: 7fe8724f
- concept: при сдвиге вдоль x горизонтальное смещение пропорционально координате y
  question: Чем горизонтальный сдвиг x′ = x + ky принципиально отличается от обычного параллельного переноса вправо или влево?
  explanation: Прибавка к координате x равна ky, поэтому точки на разных высотах перемещаются на разные расстояния. При параллельном переносе горизонтальная прибавка была бы одинаковой для всех точек.
  kind: choice
  options:
    - При сдвиге величина горизонтального перемещения зависит от высоты точки
    - При сдвиге все точки получают одинаковую прибавку к координате x
    - При сдвиге изменяется только координата y
    - При сдвиге расстояния между любыми точками обязательно сохраняются
  correct: 0
