- concept: разность образов двух точек равна образу их разности при линейном преобразовании
  question: Заполните формулу для разности координат двух точек после применения линейного преобразования.
  explanation: По линейности матрицу можно вынести за разность. Поэтому расстояние между преобразованными точками равно норме вектора A(q − p).
  kind: cloze
  template: 'Для матрицы A и точек p и q: Aq − Ap = ___'
  answer: A(q − p)
  accept:
    - A(q - p)
    - A @ (q - p)
    - A @ (q − p)
  id: 046-ex-square-1
  fingerprint: 6adc33ca
- concept: неравномерное масштабирование по координатным осям превращает осевой квадрат в прямоугольник
  question: Квадрат со сторонами, параллельными координатным осям, независимо масштабировали по осям с разными положительными коэффициентами. Какая фигура получится?
  explanation: Каждая сторона остаётся параллельной своей координатной оси, поэтому прямые углы сохраняются. Разные коэффициенты меняют длины горизонтальных и вертикальных сторон по-разному, и квадрат становится прямоугольником.
  kind: choice
  options:
    - Квадрат того же размера
    - Прямоугольник, который в общем случае не является квадратом
    - Ромб без прямых углов
    - Произвольная трапеция
  correct: 1
