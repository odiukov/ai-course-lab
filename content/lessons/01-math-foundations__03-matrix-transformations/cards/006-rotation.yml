- concept: знак и положение синуса в матрице поворота против часовой стрелки
  question: Заполни пропуск в матрице поворота плоскости против часовой стрелки.
  explanation: 'В правой верхней клетке стоит −sin φ: при положительном повороте исходное вертикальное направление получает отрицательную горизонтальную координату. Если заменить этот минус плюсом, преобразование перестанет быть чистым поворотом.'
  kind: cloze
  template: R(φ) = \begin{pmatrix} \cos φ & ___ \\ \sin φ & \cos φ \end{pmatrix}
  answer: -\sin φ
  accept:
    - −sin φ
    - -sin φ
    - -sin(φ)
    - −sin(φ)
  id: 006-rotation-1
  fingerprint: 5ca055b5
- concept: ортогональность матрицы поворота обеспечивает сохранение длины
  question: Почему умножение на матрицу R(φ) сохраняет длину любого вектора?
  explanation: 'Столбцы матрицы поворота ортонормированы: тождество cos²φ + sin²φ = 1 даёт им единичную длину, а противоположные знаки обеспечивают взаимную перпендикулярность. Поэтому поворот меняет направление, но не длину вектора.'
  kind: choice
  options:
    - Её столбцы имеют единичную длину и взаимно перпендикулярны
    - Все элементы матрицы положительны
    - В каждой строке матрицы стоят одинаковые значения
    - Матрица прибавляет к обеим координатам одну и ту же величину
