- concept: отражение относительно оси y меняет знак первой координаты и сохраняет вторую
  question: Заполни пропуск в формуле отражения точки относительно оси y.
  explanation: При отражении относительно оси y точка переходит на противоположную сторону по горизонтали, поэтому знак координаты x меняется. Вертикальная координата y остаётся прежней.
  kind: cloze
  template: (x, y) → (___, y)
  answer: -x
  accept:
    - −x
  id: 017-reflection-1
  fingerprint: 3213f97e
- concept: отражение подходит для аугментации, если оно сохраняет целевую метку
  question: При каком условии зеркальное отражение изображения можно корректно использовать как аугментацию обучающих данных?
  explanation: Аугментация должна изменять входные данные, не нарушая соответствие между примером и его меткой. Например, зеркальное фото кошки остаётся изображением кошки, поэтому его можно добавить в обучающую выборку с той же меткой.
  kind: choice
  options:
    - После отражения правильная метка класса остаётся прежней
    - Отражённое изображение полностью совпадает с исходным
    - Отражение создаёт новый класс объектов
    - Все пиксели сохраняют свои исходные позиции
  correct: 0
