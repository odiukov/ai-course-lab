- concept: отражение является обратным преобразованием самому себе
  question: К точке применили зеркальное отражение, а затем повторили то же самое отражение. Где окажется точка и почему?
  explanation: При первом отражении меняется сторона относительно оси, а повторное такое же отражение возвращает прежнюю сторону. Поэтому матрица отражения является обратной самой себе.
  kind: open
  reference: Точка вернётся в исходное положение, потому что повторное изменение знака координаты восстанавливает её первоначальное значение.
