- concept: координатные оси являются инвариантными прямыми при независимом масштабировании по осям
  question: Объясните своими словами, почему точка, лежащая на одной из координатных осей, после независимого масштабирования по осям не может сойти с этой оси.
  explanation: Горизонтальная и вертикальная координаты масштабируются независимо. Нулевая координата не становится ненулевой, поэтому каждая координатная ось преобразуется сама в себя.
  kind: open
  reference: Координата, равная нулю, после умножения на любой коэффициент масштабирования остаётся нулевой. Поэтому у точки сохраняется принадлежность той же координатной оси.
