- concept: нулевая координата собственного вектора требует нулевой соответствующей координаты его образа
  question: Пусть v — собственный вектор матрицы A, причём координата vᵢ равна нулю. Какой должна быть координата (Av)ᵢ?
  explanation: Из Av = λv следует (Av)ᵢ = λvᵢ. Если vᵢ = 0, то и (Av)ᵢ = 0. Делить на эту координату нельзя, поэтому λ находят по другой, ненулевой координате.
  kind: choice
  options:
    - Она может быть любой
    - Она должна совпадать с собственным значением
    - Она должна быть нулевой
  correct: 2
  id: 033-code-is-eigenvector-1
  fingerprint: 0afc8929
- concept: нулевой вектор исключён из определения собственного вектора
  question: Почему нулевой вектор нельзя считать собственным вектором матрицы, хотя равенство Av = λv для него выполняется?
  explanation: При v = [0, 0] обе стороны равенства Av = λv всегда равны нулю независимо от λ. Такая проверка ничего не сообщает о действии матрицы, поэтому нулевой вектор отсекают отдельно.
  kind: open
  reference: Для нулевого вектора равенство выполняется при любом λ и не определяет ни особого направления, ни единственного коэффициента масштабирования. Поэтому собственный вектор по определению должен быть ненулевым.
  id: 033-code-is-eigenvector-2
  fingerprint: 3c73d004
- concept: пропорциональность векторов с дробными координатами проверяется с числовым допуском
  question: Заполните пропуск в проверке равенства Av и λv с учётом погрешности вычислений.
  explanation: np.allclose сравнивает координаты с допуском. Это надёжнее точного ==, поскольку вычисленное значение может оказаться равным 2.9999999999 вместо 3.
  kind: cloze
  template: np.___(A @ v, lam * v)
  answer: allclose
  accept:
    - allclose
  id: 033-code-is-eigenvector-3
