- concept: ось трёхмерного поворота задаёт неизменную координату и плоскость вращения
  question: Как верно описать действие поворота вокруг оси y?
  explanation: При повороте вокруг оси y точки движутся в плоскостях, параллельных x–z, а координата y не меняется. Поэтому в матрице Ry центральный элемент равен единице, а остальные элементы этой строки и столбца равны нулю.
  kind: choice
  options:
    - Координата x сохраняется, а плоскость x–y вращается
    - Координата z сохраняется, а плоскость x–y вращается
    - Координаты x и y вращаются, а z сохраняется
    - Все координаты изменяются независимо друг от друга
    - Координата y сохраняется, а плоскость x–z вращается
  correct: 4
  id: 024-3d-rotation-1
  fingerprint: fa1d4c20
- concept: изменение координат точки при развороте вокруг координатной оси
  question: Точку с координатами (4, −6, 9) повернули вокруг оси x на 180°. Объясни своими словами, какими станут её координаты и почему.
  explanation: 'Матрица Rx не изменяет компоненту вдоль оси x. При угле 180° косинус равен −1, а синус — нулю, поэтому y и z меняют знаки: (4, −6, 9) переходит в (4, 6, −9).'
  kind: open
  reference: Координаты станут (4, 6, −9). При повороте вокруг оси x координата x сохраняется, а разворот на 180° меняет направления обеих координат в плоскости y–z на противоположные.
  id: 024-3d-rotation-2
  fingerprint: 35e2a42f
