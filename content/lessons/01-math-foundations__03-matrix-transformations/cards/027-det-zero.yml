- concept: модуль определителя задаёт масштаб площади, а его знак показывает смену ориентации
  question: Преобразование плоскости увеличило площадь любой фигуры в семь раз и сменило ориентацию. Чему равен его определитель? Объясните ответ.
  explanation: 'Масштаб площади равен |det|, поэтому модуль определителя равен 7. Поскольку ориентация изменилась, определитель должен быть отрицательным: det = −7.'
  kind: open
  reference: 'Определитель равен −7: модуль 7 означает увеличение площади в семь раз, а отрицательный знак — смену ориентации.'
