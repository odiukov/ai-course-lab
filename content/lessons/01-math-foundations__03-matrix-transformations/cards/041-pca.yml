- concept: доля объяснённой дисперсии компоненты равна отношению её собственного значения к сумме всех собственных значений
  question: Собственные значения ковариационной матрицы равны 12, 7 и 5. Какую долю общей дисперсии объясняет компонента с собственным значением 12?
  explanation: 'Общая дисперсия равна сумме собственных значений: 12 + 7 + 5 = 24. Поэтому доля компоненты равна 12 / 24 = 0.5.'
  kind: numeric
  answer: 0.5
  tolerance: 0.001
