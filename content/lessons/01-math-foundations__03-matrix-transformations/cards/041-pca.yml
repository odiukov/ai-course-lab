- concept: снижение размерности в PCA выполняется от ковариационной матрицы к отбору компонент с наибольшими собственными значениями
  question: Расположите этапы PCA в правильном порядке.
  explanation: Собственные векторы задают направления компонент. Сортировка по собственным значениям ставит первыми направления с наибольшей дисперсией, после чего проекция на выбранные компоненты уменьшает размерность.
  kind: order
  items:
    - Вычислить ковариационную матрицу данных
    - Найти её собственные векторы и собственные значения
    - Отсортировать собственные векторы по убыванию соответствующих собственных значений
    - Оставить первые k собственных векторов
    - Спроецировать данные на выбранные направления
