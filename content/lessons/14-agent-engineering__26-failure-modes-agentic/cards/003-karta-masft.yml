  fingerprint: 151cfdb8
- concept: категории верхнего уровня MASFT — места поиска причины отказа, а не последовательные этапы работы системы
  question: 'Инженер читает категории MASFT (спецификация и проектирование системы, несогласованность между агентами, проверка выполнения задачи) как конвейер: система проходит их по очереди. Что не так с таким чтением?'
  explanation: Таксономия классифицирует причины, а не фазы исполнения. Ошибка спецификации может проявиться в самом конце трейса, а провал верификации — существовать с первой реплики. Чтение «сверху вниз» сужает поиск, чтение «слева направо» придумывает несуществующую хронологию.
  kind: choice
  options:
    - Это оси диагностики — области, где ищут причину; порядок между ними не задан, и отказ может относиться к любой из них независимо от момента в трейсе
    - Порядок правильный, но начинать надо с проверки выполнения задачи
    - Категории — это стадии жизненного цикла проекта, а не выполнения задачи
    - Конвейер верен только для одноагентных систем
  correct: 0
  id: 003-karta-masft-2
  fingerprint: 31e049eb
- concept: один трейс допускает несколько ярлыков отказа, но каждый ярлык должен опираться на наблюдаемое в трейсе поведение
  question: При разборе одного трейса аналитик поставил два ярлыка отказа из разных категорий таксономии. Объясни своими словами, законно ли это и какое требование к каждому ярлыку остаётся обязательным.
  explanation: 'Множественная разметка — норма для реальных трейсов. Держит её от произвола одно правило: ярлык = наблюдение, а не интерпретация мотивов модели. Именно это и даёт MASFT каппу 0,88 вместо вкусовщины.'
  kind: open
  reference: 'Законно: режимы не взаимоисключающие, одно выполнение может содержать несколько сбоев — например, задача была плохо специфицирована, и одновременно результат никто не верифицировал. Обязательное требование: каждый ярлык опирается на наблюдаемое поведение в трейсе (конкретную реплику, вызов инструмента, принятый без проверки результат), а не на догадку о «характере» или «лени» модели. Иначе разметка перестаёт быть воспроизводимой и согласие между разметчиками падает.'
  id: 003-karta-masft-3
  fingerprint: e816438c
