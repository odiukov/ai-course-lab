- concept: ярлыки Omission/Redundancy/Disorder присваиваются только относительно эталонной декомпозиции задачи — из одного трейса без плана они невыводимы
  question: 'Тебе дали только трейс агента: список вызовов инструментов с аргументами и ответами. Плана или эталонной декомпозиции задачи нет. Почему по такому материалу нельзя разметить Omission, Redundancy и Disorder, и что нужно добавить?'
  explanation: 'Ошибки подцелей — реляционные: они существуют не в трейсе сам по себе, а в паре «трейс — план». Поэтому в разметке отказов сначала фиксируют эталонную декомпозицию (из спецификации задачи или из плана самого агента), и только потом сопоставляют с ней запись выполнения.'
  kind: open
  reference: 'Все три ярлыка — расхождения между трейсом и эталонным набором подцелей. Omission = подцель из эталона не встречается в трейсе; Redundancy = встречается больше раз, чем требует эталон; Disorder = встречается, но раньше подцели, дающей ей вход. Без эталона нет отсчёта: невозможно сказать, что вызова «не хватает» (может, он и не требовался), что вызов «лишний» (может, задача требует его дважды) и что порядок «нарушен» (может, зависимости другие). Нужна эталонная декомпозиция задачи на подцели с указанием их кратности и зависимостей по данным; тогда разметка сводится к сравнению состава, кратности и порядка.'
  id: 012-check-subgoals-2
  fingerprint: 80a95d23
