- concept: преждевременное завершение определяется по расхождению между состоянием цели и моментом остановки, независимо от того, была ли проверка
  question: Многоагентная система остановила работу и вернула ответ, хотя целевое состояние среды ещё не достигнуто. Объясни своими словами, по какому признаку такой отказ относят к преждевременному завершению, и чем он отличается от отказов проверки.
  explanation: 'Все три режима третьей категории MASFT дают одинаковый внешний симптом — рапорт об успехе при невыполненной задаче, — но ломается разное: условие остановки, покрытие проверок, критерий проверки. Различать их нужно потому, что исправления не взаимозаменяемы.'
  kind: open
  reference: 'Признак преждевременного завершения — момент остановки: система прекратила исполнение (или диалог между агентами оборвался) до того, как цель задачи достигнута; часть работы просто не была сделана. Отказы проверки касаются другого — работа могла быть доведена или не доведена, но система не смогла правильно установить факт выполнения: либо нужные условия не проверялись (отсутствующая/неполная проверка), либо проверялись негодным способом или с ошибочным выводом (неверная проверка). Практически: при преждевременном завершении надо чинить условие остановки и управление циклом агента, при отказах проверки — набор и критерии приёмочных проверок.'
  id: 006-task-verification-3
