- concept: неполная проверка отличается от неверной по тому, что часть требуемых условий вообще не входит в набор проверяемых
  question: 'Задача: перевести деньги и отправить клиенту подтверждение по e-mail. Валидатор системы проверяет только успешность транзакции; отправку письма он не смотрит вообще. Письмо не ушло, система отчиталась об успехе. Как это классифицировать и что менять?'
  explanation: Требование сформулировано полностью, транзакция проверена корректным способом. Пропущено само условие — отправка письма не покрыта ни одной проверкой. Это неполная проверка, и лечится она расширением набора условий приёмки. Неверная проверка означала бы, что письмо проверяли, но по ошибочному признаку.
  kind: choice
  options:
    - 'Неполная проверка: набор проверяемых условий уже набора требований задачи — нужно расширить набор условий приёмки'
    - 'Неверная проверка: критерий транзакции подобран неправильно — нужно сменить критерий'
    - 'Преждевременное завершение: транзакция не завершилась — нужно продлить цикл агента'
    - 'Ошибка спецификации: требование про письмо не было задано'
