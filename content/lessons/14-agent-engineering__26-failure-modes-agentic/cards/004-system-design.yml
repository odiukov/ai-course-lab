- concept: отказ относится к спецификации и системному проектированию, когда правило разрешения конфликта не задано заранее
  question: 'Многоагентная система готовит отчёт: агент-аналитик считает выручку по данным CRM, агент-финансист — по выгрузке из бухгалтерии, агент-редактор собирает итог. Цифры расходятся, редактор молча берёт версию CRM. В задании не сказано, какой источник считать приоритетным при расхождении. К какой категории MASFT относится этот отказ и почему?'
  explanation: 'Ключевой признак — решение, которого проектировщик не принял. Приоритет источников относится к спецификации результата и устройству системы. Пока правило не записано, разные запуски будут выбирать по-разному, а более сильная модель не угадает намерение автора: MASFT прямо утверждает, что такие отказы — дефекты проектирования, а не дефицит возможностей модели.'
  kind: choice
  options:
    - 'Спецификация и системное проектирование: правило разрешения конфликта источников не задано, агент вынужден додумать его сам'
    - 'Межагентное недопонимание: редактор неверно интерпретировал сообщение финансиста'
    - 'Верификация и завершение задачи: не хватило проверки итогового числа перед выдачей'
    - 'Ограничение базовой модели: модель слишком слаба, чтобы выбрать верный источник'
  correct: 0
  id: 004-system-design-1
  fingerprint: 351d0467
- concept: противоречивые требования делают задачу неразрешимой, поэтому отказ возникает до первого действия агента
  question: 'Агенту закупок задали два жёстких ограничения: «выбирай поставщика с наименьшей ценой» и «работай только с поставщиками, имеющими склад в стране заказчика», при том что все дешёвые поставщики зарубежные. Объясни своими словами, почему любой ответ агента будет засчитан как отказ и что именно нужно чинить.'
  explanation: 'Типичная ошибка разбора — читать последний неверный ответ как ошибку исполнителя. Проверка простая: существует ли хотя бы один вариант, удовлетворяющий всем ограничениям. Если нет — виновата постановка, и правка агента ничего не даст.'
  kind: open
  reference: 'Множество допустимых решений пусто: ни один вариант не удовлетворяет обоим ограничениям одновременно. Значит, отказ заложен в самой постановке задачи и существует ещё до первого действия агента — независимо от качества рассуждений исполнителя. Это отказ категории спецификации и системного проектирования: подробность инструкций не спасает, если требования взаимно исключают друг друга. Чинить нужно задание: снять жёсткость с одного из требований, задать приоритет между ними (например, склад важнее цены) или разрешить агенту сообщать о невыполнимости вместо выбора. Перебор моделей, промптов и повторных запусков здесь бесполезен.'
  id: 004-system-design-2
  fingerprint: 3f9b6243
- concept: диагностика отказа идёт от условий задачи к трейсу исполнителя, а не наоборот
  question: Расставь шаги разбора отказа многоагентной системы в порядке, который позволяет отделить дефект спецификации от ошибки исполнения.
  explanation: 'Порядок неслучаен: каждый следующий шаг имеет смысл, только если предыдущий пройден. Разбирать рассуждения агента при неразрешимой или недоопределённой задаче — значит чинить исполнителя вместо задания и получать «исправления», которые не воспроизводятся на следующем запуске.'
  kind: order
  items:
    - Восстановить, какие требования, ограничения и условие остановки были фактически заданы системе
    - Проверить, существует ли хотя бы один результат, удовлетворяющий всем ограничениям одновременно
    - Проверить, задано ли однозначное правило выбора на случай расхождения промежуточных результатов агентов
    - Проверить, был ли у агента доступ к контексту и инструментам, нужным для выполнения требований
    - И только затем разбирать трейс рассуждений агента как ошибку исполнения
  id: 004-system-design-3
  fingerprint: 26de37c1
