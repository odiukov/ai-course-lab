- concept: 'успешный вызов инструмента с пустой полезной нагрузкой не является ошибкой инструмента: детектор смотрит статус вызова, а не содержимое ответа'
  question: 'Разметчик трейсов помечает событие как проблему с инструментом, если инструмент вернул ошибку вызова. В трейсе агент вызвал разрешённый инструмент `lookup_order`, получил статус `ok` и тело ответа `{"orders": []}`, после чего сообщил пользователю, что заказов нет. Должен ли детектор поднять флаг проблемы с инструментом?'
  explanation: Отказ инструмента и неудачный исход задачи — разные слои. Инструмент вернул корректный ответ, просто множество результатов пустое. Если считать пустоту ошибкой, детектор зальёт разметку ложными срабатываниями на всех нормальных «ничего не найдено», а настоящие сбои вызова утонут в шуме. Признак ошибки берут из статусного поля события, а не из размера полезной нагрузки.
  kind: choice
  options:
    - 'Нет: вызов технически отработал, пустой результат — это факт о мире, а не сбой инструмента'
    - 'Да: пустой ответ означает, что инструмент не выполнил свою работу'
    - 'Да: любой ответ без полезных данных считается ошибкой вызова'
    - Нет, но только если агент дальше вызвал тот же инструмент повторно
  correct: 0
  id: 015-tool-problems-1
  fingerprint: e94f7787
- concept: детектор проблем с инструментами — дизъюнкция независимых условий по событиям, возвращающая флаг на первом совпадении и пропускающая события, не являющиеся вызовами
  question: Дополните условие детектора так, чтобы он помечал трейс при неразрешённом имени инструмента ИЛИ при ошибке вызова существующего инструмента.
  explanation: 'Два признака независимы, поэтому связаны через `or`: имя вне списка разрешённых ловит выдуманное действие, статус ошибки ловит неверный вызов реального инструмента. Первое совпадение уже решает исход трейса, продолжать обход незачем — отсюда ранний `return True`. Текстовые ответы агента отсеиваются проверкой типа события: они не вызовы и статуса вызова не имеют.'
  kind: cloze
  template: |-
    for event in trace:
        if event["type"] != "tool_call":
            continue
        if event["name"] not in ALLOWED_TOOLS or ___:
            return True
    return False
  answer: event["status"] == "error"
  accept:
    - event['status'] == 'error'
    - event["status"] != "ok"
    - event.get("status") == "error"
    - event["error"]
    - event.get("error")
  id: 015-tool-problems-2
  fingerprint: bf3f8291
- concept: сигнатурный детектор режимов отказа имеет фиксированную стоимость и детерминированный вывод, поэтому запускается на каждом прогоне в CI, в отличие от детектора на LLM
  question: Команда прогоняет 8000 трейсов агента на каждом коммите. Почему для первичной разметки режимов отказа выбирают сигнатурные детекторы (сверка имени инструмента со списком, поиск повтора одного и того же вызова), а не детектор на базе LLM?
  explanation: 'Сигнатурный детектор глуп по сравнению с моделью, но его стоимость и вывод предсказуемы: 8000 трейсов — это 8000 проходов по списку, а не 8000 запросов к модели с оплатой и разбросом ответов. Это делает его пригодным для блокирующей проверки в CI. LLM оставляют на спорные трейсы и на случаи, где сигнатуры не хватает — например, на семантические расхождения между рассуждением и действием.'
  kind: choice
  options:
    - Сигнатурный детектор стоит константу на трейс и даёт воспроизводимый ответ, а LLM-детектор требует отдельного вызова модели на каждый трейс и может менять вердикт от прогона к прогону
    - Сигнатурные детекторы обнаруживают больше режимов отказа, чем LLM
    - LLM-детектор не способен работать с текстом трейса без дообучения
    - Сигнатурные детекторы не требуют заранее известной таксономии режимов отказа
  correct: 0
  id: 015-tool-problems-3
  fingerprint: fc472d5b
