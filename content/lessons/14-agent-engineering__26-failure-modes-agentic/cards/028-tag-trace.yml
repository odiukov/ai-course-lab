- concept: 'результат детектора преобразуется в метку по факту его наличия, а не по истинности значения: индекс 0 — валидная находка'
  question: Детектор повтора возвращает позицию первого повторённого вызова или None, если повторов нет. Разметчик навешивает метку по факту находки. Заполни пропуск так, чтобы повтор на самой первой позиции не потерялся.
  explanation: 'Детектор возвращает данные (позицию), а метка — это булев факт находки. Проверка `if idx:` уронила бы случай idx == 0, то есть повтор в начале трейса: 0 ложен как значение, но истинен как находка. Для детекторов, возвращающих список (например, цели scope creep), метка ставится по непустоте списка.'
  kind: cloze
  template: |-
    idx = first_repeat_index(events)
    if idx ___ None:
        labels.append("redundant_action")
  answer: is not
  accept:
    - is not
    - '!='
    - is not None
    - '!= None'
  id: 028-tag-trace-1
  fingerprint: 3183d0a9
- concept: ранний выход из разметчика после первого совпадения искажает измеряемое распределение режимов отказа, а не только теряет одну метку
  question: Разметчик прогоняет четыре детектора в фиксированном порядке и написан цепочкой if/elif с возвратом первой сработавшей метки. На 400 трейсах строят распределение по режимам отказа. Какое искажение это даёт?
  explanation: Режимы отказа сосуществуют в одном трейсе, поэтому детекторы — независимые предикаты, а не взаимоисключающие ветки. При elif трейс с повтором и ложным успехом уходит в корзину того детектора, что стоит раньше, и частота ложного успеха систематически занижается — распределение начинает отражать порядок кода, а не поведение агента.
  kind: choice
  options:
    - 'Частота режимов, проверяемых позже, занижена: их трейсы уже забрал первый сработавший детектор'
    - Все частоты завышены, потому что один трейс попадает сразу в несколько корзин
    - Распределение не меняется, страдает только скорость разметки
    - Занижена частота первого детектора, потому что он проверяется на неотфильтрованных трейсах
  correct: 0
  id: 028-tag-trace-2
