- concept: нормальный трейс получает явную метку отсутствия отказов, а не пустой результат, чтобы отличать проверенный чистый трейс от неразмеченного
  question: Детекторы не нашли на трейсе ни одного режима отказа. Почему разметчик возвращает явную метку вида "clean", а не пустой список или пустую строку?
  explanation: 'Знаменатель распределения — все трейсы, включая успешные. Пустой результат сливает два разных состояния: «проверен, чисто» и «не проверен / детектор упал», и доля отказов посчитается по неверному знаменателю. Явная метка делает отрицательный случай наблюдаемым, что нужно и для порога в CI.'
  kind: choice
  options:
    - Чтобы каждый прогон давал строку в распределении и чистый трейс отличался от трейса, который вовсе не размечали
    - Потому что пустой список нельзя сохранить в JSON
    - 'Чтобы ускорить агрегацию: подсчёт по строкам быстрее подсчёта по спискам'
    - Потому что режимов отказа ровно пять и каждый трейс обязан попасть в один из них
