- concept: доля режима отказа считается от числа трейсов, а не от числа выставленных меток
  question: Разметчик прогнали на 50 трейсах. Он выставил 61 метку, из них метка `Tool Error` стоит 17 раз и относится к 14 разным трейсам. Какую долю для `Tool Error` должно вернуть распределение режимов? Ответ в долях единицы.
  explanation: 'Распределение отвечает на вопрос «в какой доле трейсов встречается режим», поэтому знаменатель — размер выборки (50), а числитель — число затронутых трейсов (14): 14/50 = 0.28. Делить на 61 (все метки) нельзя: получится доля режима среди меток, а не среди прогонов, и такое число несравнимо с базовой линией по трейсам.'
  kind: numeric
  answer: 0.28
  tolerance: 0.005
  id: 032-mode-distribution-1
  fingerprint: b74e2154
- concept: режим засчитывается трейсу как индикатор наличия, кратность одной метки внутри трейса игнорируется
  question: Детекторы могут вернуть для одного трейса одну и ту же метку несколько раз (например, два независимых признака Redundancy). Счётчик режима должен вырасти при этом на единицу, а не на два. Заполни пропуск.
  explanation: Единица измерения — трейс, а не срабатывание детектора. Без дедупликации трейс с двумя одинаковыми метками даст долю больше 1 для одного режима, что бессмысленно. `set(...)` сводит метки трейса к множеству присутствующих режимов, и каждый режим прибавляет к счётчику максимум единицу.
  kind: cloze
  template: |-
    counts = {mode: 0 for mode in ALL_MODES}
    for trace in traces:
        for mode in ___(tag_trace(trace)):
            counts[mode] += 1
  answer: set
  accept:
    - set
    - frozenset
    - dict.fromkeys
    - set()
  id: 032-mode-distribution-2
  fingerprint: 14ce340b
- concept: результат распределения содержит полный набор режимов, потому что отсутствующий ключ неотличим от нуля при сравнении прогонов
  question: Объясни своими словами, зачем распределение режимов отказа должно возвращать все режимы таксономии, в том числе с нулевой долей, а не только те, что встретились в выборке.
  explanation: 'Нуль — это измерение, а не отсутствие измерения. Ноль в выдаче означает «режим проверяли, он не встретился»; пропущенный ключ означает неизвестность. Для мониторинга дрейфа это разные вещи: по нулю можно построить сравнение с порогом, по отсутствию ключа — нет.'
  kind: open
  reference: 'Распределение сравнивают с базовой линией и с предыдущими прогонами. Если режим просто отсутствует в словаре, читающий код не может отличить «режим не встретился» от «детектор не запускался / ключ переименован / режим выпал из таксономии». Полный набор ключей даёт стабильную форму результата: любые два прогона сравниваются покомпонентно без предварительного выравнивания ключей, вычитание базовой линии не падает на KeyError, а нулевая доля становится явным утверждением «искали и не нашли». Тот же довод, что и с явной меткой отсутствия отказов у чистого трейса: пустота как результат должна быть записана, а не подразумеваться.'
  id: 032-mode-distribution-3
  fingerprint: 495f21d2
