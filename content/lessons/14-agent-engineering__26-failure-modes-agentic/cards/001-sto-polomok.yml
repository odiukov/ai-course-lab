- concept: отказы агента укладываются в небольшое число повторяющихся категорий, поэтому их разбирают по распределению, а не поштучно
  question: Почему при разборе неудачных трейсов агента их сначала группируют по повторяющимся типам отказа, а не чинят каждый инцидент по отдельности?
  explanation: 'Ключевая мысль: отказы повторяемы. Пока категории не названы, за ними нельзя ни следить, ни измерять эффект фикса. После группировки одна правка закрывает целую группу инцидентов, а доля каждой категории задаёт порядок работ.'
  kind: open
  reference: 'Отказы не случайный шум: они укладываются в небольшое число повторяющихся категорий, и одна категория даёт сразу десятки инцидентов. Группировка превращает вопрос «почему агент иногда ошибается» в вопрос «какие сбои повторяются и сколько раз», то есть даёт распределение и приоритет: чинить категорию с наибольшей частотой. Поштучный ремонт лечит симптомы, не даёт понять, покрыт ли основной источник отказов, и не показывает эффект исправления в метрике. Средняя успешность говорит, как часто всё получилось; разбор по категориям — что именно предстоит чинить.'
