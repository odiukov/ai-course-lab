- concept: трейс как единица измерения — одна полная запись выполнения задачи агентом
  question: Что в оценке агентных систем называют трейсом?
  explanation: Трейс — один прогон задачи целиком, от входа до результата. Именно трейсы делят на успешные и неуспешные, поэтому успешность считается по ним. Отдельный вызов модели — шаг внутри трейса, а лог только падений упускает трейсы, которые завершились без исключения, но с неверным результатом.
