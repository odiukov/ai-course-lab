- concept: код ошибки от инструмента не различает выдуманное действие и неверный вызов — классификация делается сверкой с контрактом инструмента
  question: Два вызова агента вернули одинаковый ответ 422 Unprocessable Entity. Что позволит отнести один из них к hallucinated action, а другой — к tool misuse?
  explanation: 'Ответ об ошибке — это реакция принимающей стороны, а не диагноз. Одинаковый 422 (как и 400) прилетает и на несуществующее действие, и на реальный инструмент с плохими аргументами. Различие даёт только контракт: есть ли такое имя и такое поле в описании инструмента.'
  kind: choice
  options:
    - Текст сообщения об ошибке, который вернул сервер
    - 'Сверка имени и аргументов вызова с контрактом инструмента: официальным именем, назначением и допустимой схемой аргументов'
    - Число повторных попыток агента после ошибки
    - Задержка ответа инструмента
  correct: 1
  id: 014-tool-signatures-1
  fingerprint: c9acd18b
- concept: доступность инструмента оценивается относительно списка, выданного конкретному агенту в момент вызова, а не относительно существования сервиса в мире
  question: Агент вызвал `warehouse.relocate`. Такой эндпоинт действительно есть в складской системе компании, но в список инструментов, переданный этому агенту, входят только поиск и резервирование. Как классифицировать вызов?
  explanation: Доступность считается по набору инструментов, выданному агенту в этот момент, а не по тому, существует ли похожий сервис где-то ещё. Кнопки у агента нет — он выдумал действие. Отсутствие подключения может быть причиной, но ярлык отказа в трейсе — hallucinated action.
  kind: choice
  options:
    - 'Tool misuse: инструмент реален, значит проблема в способе вызова'
    - 'Hallucinated action: для этого агента такого инструмента в его наборе нет'
    - 'Ни то ни другое: это отказ инфраструктуры, инструмент просто не подключили'
    - Cascading error, потому что вызов провалился
  correct: 1
  id: 014-tool-signatures-2
  fingerprint: a2d3aee8
- concept: tool misuse охватывает и выбор не того реального инструмента, а не только ошибки в аргументах
  question: Агенту нужно было прочитать запись из каталога, но он вызвал реальный инструмент удаления записи — все аргументы валидны, вызов прошёл успешно. Объясни своими словами, к какому режиму отказа это относится и почему успешный вызов не спасает.
  explanation: 'Ключ — контракт инструмента цел, значит выдумки нет. Провал вызова вообще не входит в определение misuse: критерий — расхождение между задачей и применённым средством, а не код ответа.'
  kind: open
  reference: 'Это tool misuse. Категория покрывает не только неверные аргументы (пропущенное обязательное поле, неверный тип, чужой идентификатор), но и выбор не того существующего инструмента — удаление вместо чтения. Hallucinated action тут неприменим: и имя инструмента, и все его аргументы есть в контракте. Успешный ответ инструмента ничего не доказывает: инструмент отработал ровно то, что у него просили, а расхождение — между задачей и выбранным средством. Более того, успешный неверный вызов опаснее провалившегося: он меняет состояние системы и не оставляет следа в мониторинге ошибок.'
  id: 014-tool-signatures-3
  fingerprint: 0de69cf8
