- concept: все три ошибки подцелей ловятся сравнением списка выполненных инструментов с планом по составу и по порядку, без разбора текста рассуждений
  question: Объясни своими словами, какой дешёвой проверки трейса достаточно, чтобы поймать сразу Omission, Redundancy и Disorder, и почему для этого не нужно читать рассуждения агента.
  explanation: Ошибки подцелей — свойство последовательности действий, а не формулировок агента. Сравнение «план против трейса» по составу и порядку исчерпывает три категории и стоит дёшево, тогда как чтение рассуждений дорого и субъективно.
  kind: open
  reference: 'Достаточно взять список фактически выполненных вызовов инструментов и сопоставить его с планом по двум признакам: по составу (какие шаги присутствуют и сколько раз каждый) и по порядку следования. Отсутствующий шаг даёт Omission, лишнее повторение — Redundancy, перестановка при полном совпадении состава — Disorder. Все три определяются как расхождение двух последовательностей, поэтому проверка не требует интерпретации текста рассуждений и делается автоматически.'
