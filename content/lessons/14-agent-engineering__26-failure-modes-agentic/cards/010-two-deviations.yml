- concept: 'три ошибки на уровне подцелей — Omission, Redundancy, Disorder — различаются по типу расхождения трейса с планом: состав против кратности против порядка'
  question: 'План агента: получить токен, создать заказ, отправить письмо. В трейсе видны вызовы: создать заказ, получить токен, отправить письмо. Какая ошибка на уровне подцелей?'
  explanation: 'Состав шагов совпал с планом и кратность каждого равна единице, значит ни Omission, ни Redundancy. Расхождение только в порядке — Disorder. Аналогия с рецептом: соль есть, соль одна, но насыпана до воды.'
  kind: choice
  options:
    - Omission — пропущенный шаг
    - Redundancy — повторённый шаг
    - Disorder — шаги выполнены не в том порядке
    - 'Ошибки нет: все шаги плана выполнены'
  correct: 2
