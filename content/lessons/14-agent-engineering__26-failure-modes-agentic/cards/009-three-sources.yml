- concept: разграничение среды и внутреннего состояния по сопоставлению фактического ответа внешней системы с тем, что записано в состоянии
  question: Агент отчитался, что комната свободна, хотя она занята. Данные о занятости пришли из внешнего календаря. Объясни своими словами, какое сопоставление в журнале отличает отказ среды от отказа внутреннего состояния.
  explanation: 'Оба случая дают один симптом и одинаково уверенный финальный ответ, но ремонтируются в разных местах: в первом чинят интеграцию и обработку ошибок внешнего сервиса, во втором — обновление накопленной записи. Различает их только сопоставление сырого ответа среды с содержимым состояния на том же шаге.'
  kind: open
  reference: 'Нужно сравнить фактический ответ внешней системы с тем, что агент положил и держал в состоянии. Если календарь сам вернул устаревшие или неполные данные (кэш, ошибка прав, обрыв соединения), а агент использовал их без искажения — источник среда: внешний сервис отдал неверную картину мира. Если ответ календаря был актуален и корректен, но в состоянии сохранилось значение из более раннего вызова или уточнение не перезаписало старую запись — источник внутреннее состояние. Поэтому в журнале нужны и сырые ответы внешних систем, и история изменений состояния: по одному финальному сообщению агента эти два случая неразличимы.'
  id: 009-three-sources-3
