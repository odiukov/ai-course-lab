- concept: 'внутреннее состояние как источник: ранняя неточность в накопленной записи переживает шаги и срабатывает только в финальном действии'
  question: 'Агент закупает партию комплектующих. На раннем шаге зафиксировано количество 200 штук, затем пользователь уточнил: 50. Уточнение попало в переписку, но в рабочую запись заказа не переписалось, и через несколько шагов заявка ушла поставщику на 200 штук. Почему такой отказ относят к эволюции внутреннего состояния, а не к последнему шагу исполнения?'
  explanation: Состояние — всё, что система накопила по ходу выполнения, и оно меняется с каждым шагом. Финальный вызов был верен относительно своего входа, поэтому место ремонта — момент, где уточнение не обновило запись. Отсюда требование смотреть историю изменений состояния, а не только последний вызов инструмента.
  kind: choice
  options:
    - Потому что действие на последнем шаге корректно исполнило то значение, которое к этому моменту накопилось в состоянии; ошибка внесена раньше и дожила до действия
    - Потому что любая ошибка в числах по определению относится к состоянию, а не к действиям
    - Потому что последний шаг выполнял внешний сервис поставщика, а значит отвечает среда
    - Потому что отказ проявился после нескольких шагов, а всё отложенное относят к состоянию
  correct: 0
