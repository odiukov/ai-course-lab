- concept: 'внутри несогласованности между агентами удержание информации и игнорирование ввода различаются по месту обрыва передачи: не отправлено против отправлено и не учтено'
  question: Агент-исследователь выяснил, что нужная лицензия несовместима с коммерческим использованием, и написал это в общий канал. Агент-сборщик итогового отчёта прочитал сообщение, но включил библиотеку в рекомендации без оговорок. Какой режим отказа из категории несогласованности между агентами здесь фиксируется?
  explanation: 'Ключ — где оборвалась связка. Информация была передана, значит удержания нет; отказ произошёл на приёмной стороне, которая её не учла. Если бы исследователь оставил ограничение при себе, это было бы удержание информации. Разметка идёт по наблюдаемому в трейсе: есть сообщение в канале — есть передача.'
  kind: choice
  options:
    - Удержание информации
    - Игнорирование ввода другого агента
    - Уход от задачи
    - Отказ запросить разъяснение
  correct: 1
  id: 005-agent-misalignment-1
  fingerprint: 9713ffd9
- concept: несоответствие рассуждения и действия фиксируется по расхождению между выводом, который агент сам сформулировал, и вызовом инструмента, который он сделал
  question: 'В трейсе агент рассуждает: «лимит запросов исчерпан, нужно писать в staging-эндпоинт», после чего вызывает инструмент с URL продакшена и получает ошибку. Как классифицировать такой отказ?'
  explanation: 'Здесь неопределённости не было и никакого чужого ввода не терялось: агент сам вывел правильное решение, а действие разошлось с ним. Именно расхождение «сказал одно — вызвал другое» и есть отдельный режим. Практический смысл: улучшать промпт-рассуждение бесполезно, лечится проверкой действия против только что заявленного плана.'
  kind: choice
  options:
    - Несоответствие рассуждения и действия — вывод верный, вызов ему противоречит
    - Игнорирование ввода другого агента — агент не учёл сообщение соседа
    - Перезапуск разговора — агент обнулил состоявшееся обсуждение
    - Отказ запросить разъяснение — агент не уточнил, какой эндпоинт использовать
  correct: 0
  id: 005-agent-misalignment-2
  fingerprint: fc29dd62
- concept: необоснованный перезапуск разговора агентом отличается от системной потери контекста тем, что состояние было доступно, но агент сам его обнулил
  question: Объясни своими словами, чем необоснованный перезапуск разговора отличается от потери истории взаимодействия, если внешне в обоих случаях агент начинает задачу с нуля. По какому признаку в трейсе их разделяют и почему это разные проблемы для починки?
  explanation: 'MASFT разделяет режимы по тому, где оборвалась совместная работа, а не по внешнему симптому. Один и тот же наблюдаемый эффект (задача начата с нуля) даёт два разных ярлыка и два разных плана исправления. Это же согласуется с главным утверждением работы: часть таких поломок — дефекты проектирования системы, а не слабость базовой модели.'
  kind: open
  reference: 'Потеря истории — сбой системы: контекст или память не сохранились, агенту нечего было использовать. Перезапуск разговора — сбой самого агента: предыдущие сообщения и состояние были доступны в контексте, но агент без причины начал обсуждение заново, отбросив уже достигнутые договорённости. В трейсе различие видно по наличию истории на входе шага: если прошлые реплики есть в контексте, а агент их проигнорировал и открыл диалог с чистого листа — это перезапуск. Разница важна для починки: потеря истории лечится инфраструктурой (хранилище состояния, передача контекста между вызовами), а перезапуск — правилами и проверками на стороне агента, потому что новая база или больший контекст его не устранят.'
  id: 005-agent-misalignment-3
  fingerprint: c96605da
