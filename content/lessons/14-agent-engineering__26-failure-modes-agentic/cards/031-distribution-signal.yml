- concept: 'порог и базовая линия привязаны к конкретному агенту и задаче: одна и та же доля режима отказа нормальна для одного контура и аномальна для другого'
  question: 'Двум агентам поставили общий порог оповещения: тревога, если доля трейсов с меткой «повтор подцели» превысит 15%. Объясни своими словами, почему единая константа для разных агентов — плохой критерий, и что использовать вместо неё.'
  explanation: Мониторинг отвечает не на «есть ли отказы?», а на «изменился ли характер отказов сильнее допустимого?». Ответ на второй вопрос требует опорной точки для каждого агента отдельно; общая константа приравнивает контуры с разным нормальным фоном и ломается в обе стороны.
  kind: open
  reference: 'Доля режима отказа сама по себе не интерпретируема: у агента с длинными цепочками вызовов и ретраями 15% повторов может быть привычным фоном, а у простого агента из двух шагов те же 15% — резкий сбой. Общая константа поэтому одновременно слишком чувствительна для одного контура и слишком глуха для другого. Вместо неё для каждого агента (и каждой версии) фиксируют собственную базовую линию — распределение режимов на последней приемлемо работавшей версии — и задают порог как величину отклонения от неё, с учётом обычного разброса именно этого показателя и цены пропуска/ложной тревоги. Сравнивается не абсолютный уровень, а сдвиг характера отказов относительно своей опорной точки.'
  id: 031-distribution-signal-3
