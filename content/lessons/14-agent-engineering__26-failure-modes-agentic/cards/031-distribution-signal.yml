- concept: порог оповещения задаётся ценой пропущенного сбоя, ценой ложной тревоги и обычным разбросом показателя, а не самим фактом отклонения от базовой линии
  question: Доля трейсов с меткой «преждевременное завершение» на проверенной версии агента держится около 4% и от недели к неделе гуляет в пределах пары процентных пунктов. Чем должен определяться порог, после которого отклонение эскалируется дежурному?
  explanation: Порог — отметка операционной значимости, а не индикатор «есть отличие». Порог ниже естественных колебаний (тут ±2 п.п. вокруг 4%) даёт поток ложных тревог; порог выше — прячет реальный дрейф. Выбор балансирует цену пропуска и цену ложного вызова. Абсолютное число за сутки зависит от объёма запусков и не сравнимо между днями.
  kind: choice
  options:
    - Любым отличием текущего значения от базовой линии — иначе часть дрейфа останется незамеченной
    - Обычным разбросом показателя, ценой пропущенного сбоя и ценой ложной тревоги в этом контуре
    - Абсолютным числом трейсов с меткой за сутки, потому что нагрузка на дежурного зависит от их количества
  correct: 1
  id: 031-distribution-signal-2
