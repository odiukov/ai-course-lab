- concept: 'ущерб от Redundancy определяется идемпотентностью повторённого вызова: повтор неидемпотентного действия создаёт второй побочный эффект'
  question: Агент выполнил одну и ту же подцель дважды (Redundancy). Что определяет, будет ли это просто лишним расходом ресурсов или испортит результат?
  explanation: 'Redundancy — расхождение трейса с планом по кратности. Последствие зависит от природы вызова: идемпотентный (GET, пересчёт итога) при повторе оставляет целевое состояние тем же, неидемпотентный (POST оплаты, отправка) применяет эффект второй раз — два списания, два письма. Поэтому при разборе повтора сначала смотрят на класс инструмента, а не на число повторений.'
  kind: choice
  options:
    - 'Идемпотентность повторённого действия: чтение или перерасчёт вернут то же состояние, а перевод средств или отправка письма создадут второй побочный эффект'
    - 'Длина трейса: чем больше шагов всего, тем безобиднее любой повтор'
    - Порядок, в котором стоят два одинаковых вызова относительно остальных подцелей
    - Наличие в трейсе текста рассуждения, объясняющего повтор
  correct: 0
  id: 011-subgoal-errors-1
  fingerprint: f234cf58
- concept: 'порядок подцелей диктуется зависимостями по данным: Disorder — исполнение шага раньше того, что производит его вход'
  question: 'Задача агента: выставить клиенту счёт. Расставьте подцели в порядке, который не даёт Disorder — так, чтобы каждый шаг получал уже готовый вход.'
  explanation: 'Disorder — единственная из трёх ошибок подцелей, при которой состав и кратность трейса совпадают с планом: присутствуют все шаги и по одному разу. Ловится только сравнением последовательности. Причина, по которой порядок вообще важен, — зависимость по данным: подстановка суммы до расчёта возьмёт пустое или устаревшее значение, отправка до сохранения отправит несуществующий файл.'
  kind: order
  items:
    - Получить список позиций заказа из базы
    - Посчитать сумму с налогом
    - Подставить сумму в шаблон счёта
    - Сохранить готовый PDF
    - Отправить файл клиенту
  id: 011-subgoal-errors-2
  fingerprint: cb642e71
- concept: корректность каждого отдельного вызова не доказывает полноту выполнения плана, поэтому Omission не ловится пошаговой валидацией
  question: Каждый вызов инструмента в трейсе агента вернул код 200 и валидный ответ, ни одной ошибки исполнения нет. Почему этого недостаточно, чтобы исключить Omission, и какая проверка её обнаружит?
  explanation: Omission — расхождение по составу, а не по корректности вызовов. Отсутствующее действие не может упасть с ошибкой, поэтому мониторинг исключений и статусов её не видит; нужны сравнение с планом и content-level проверка целевого состояния.
  kind: open
  reference: 'Пошаговая валидация проверяет локальное свойство: корректность выполненного вызова. Omission — свойство глобальное: отсутствие в трейсе необходимой подцели. Пропущенный шаг не порождает ни исключения, ни кода ошибки — он просто не оставляет записи, а все оставшиеся действия при этом корректны сами по себе. Обнаружить можно только сопоставлением множества выполненных подцелей с плановым: разность ''план минус трейс'' по составу и есть пропуск. Дополнительно помогает проверка целевого состояния среды после завершения (документ содержит число, запись создана), потому что Omission проявляется расхождением конечного состояния с целью при внешне чистом трейсе.'
  id: 011-subgoal-errors-3
  fingerprint: 3cb5d7cd
