- concept: 'тип проверки определяется тем, какое свидетельство доступно в данной точке цепочки: до вызова проверяем намерение, после вызова — состояние среды'
  question: Агент должен удалить запись в базе. Какая проверка принципиально не может стоять до вызова инструмента, а только после него?
  explanation: 'До вызова доступно только намерение агента — имя инструмента, аргументы, формулировка действия; всё это проверяемо статически. Фактическое состояние среды меняется самим вызовом, поэтому подтверждение результата возможно лишь после него. Отсюда и разные шлюзы в разных точках: один отсеивает неверный запрос, другой — ложный отчёт об успехе.'
  kind: choice
  options:
    - Валидация имени инструмента и типов аргументов по его контракту
    - Классификатор безопасности, оценивающий запланированное действие как опасное
    - Чтение базы и подтверждение, что запись отсутствует
    - Сверка идентификатора записи с тем, который назвал пользователь
