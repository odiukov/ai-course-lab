- concept: шлюзы обрамляют каждый отдельный шаг цепочки, а не завершают её целиком
  question: 'Агент выполняет один шаг цепочки: записывает отчёт в общее хранилище. Расставь элементы шага в порядке исполнения при полном обрамлении шлюзами.'
  explanation: Шлюзы не выносятся в конец цепочки — они окружают каждый шаг. До вызова отсеиваются неверный запрос и опасное действие, после вызова среда даёт независимое свидетельство результата, и только оно открывает доступ к следующему шагу. При такой раскладке ошибка ещё может возникнуть, но не получает разрешения стать следующим действием.
  kind: order
  items:
    - Проверить, что имя инструмента и его аргументы соответствуют контракту инструмента
    - Прогнать запланированное действие через классификатор безопасности
    - Выполнить вызов инструмента
    - Прочитать состояние хранилища и сравнить с ожидаемым результатом шага
    - Разрешить агенту сообщить об успехе и перейти к следующему шагу
