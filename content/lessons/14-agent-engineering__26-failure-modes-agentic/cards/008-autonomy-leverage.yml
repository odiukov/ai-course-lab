- concept: 'дрейф от исходной задачи и неправильное использование инструментов — разные новые отказы автономности: первый меняет цель, второй сохраняет цель, но неверно применяет средство'
  question: Объясни своими словами, чем дрейф от исходной задачи отличается от неправильного использования инструментов, и приведи по одному примеру каждого.
  explanation: 'Оба отказа входят в группу новых, порождённых автономностью, но точка поломки разная: у дрейфа ломается цель, у неправильного использования — средство при верной цели. Смешивать их дорого, потому что меры защиты не пересекаются: ограничение прав инструмента не спасает от дрейфа, а повтор цели в промпте не спасает от вызова разрушительного метода.'
  kind: open
  reference: 'Дрейф от исходной задачи — агент постепенно подменяет поставленную цель другой: получил задачу «найти причину одной жалобы», а закончил перенастройкой правил уведомлений для всего сервиса. Цель, которую он преследует к концу трейса, не та, что была на входе. Неправильное использование инструментов — цель остаётся верной, но средство применяется не по назначению или с неверными параметрами: агент правильно хочет посмотреть один заказ, но вызывает инструмент массового обновления вместо чтения, или передаёт в фильтр слишком широкий шаблон. Различать важно потому, что чинятся они разным: дрейф — удержанием цели и напоминанием исходной формулировки на каждом шаге, неправильное использование — сужением набора и прав инструментов, схемами параметров и валидацией вызова.'
  id: 008-autonomy-leverage-3
  fingerprint: e070f359
