- concept: автономность не повышает вероятность ошибки, а увеличивает число необратимых действий, которые одна ошибка успевает запустить до человеческой проверки, поэтому контроль ставят на длину цепочки, а не только на качество модели
  question: Агент и чат-ассистент используют одну и ту же модель с одинаковой частотой ошибок. У агента ущерб от инцидентов на порядок выше. Какая мера прицельно бьёт в причину разрыва?
  explanation: 'Разрыв не в вероятности ошибки — она одинаковая. Разрыв в том, сколько действий ошибка успевает запустить: чат-ассистент ошибку произносит, агент её исполняет и подаёт результат на вход следующим шагам. Снижение частоты ошибок ущерб уменьшает пропорционально, но рычаг оставляет прежним. Работает ограничение на количество необратимых действий до точки контроля.'
  kind: choice
  options:
    - Дообучить модель на 500 тысячах дополнительных примеров, чтобы снизить частоту ошибок
    - Ограничить число необратимых вызовов инструментов, которые агент может выполнить до подтверждения человеком
    - Увеличить окно контекста, чтобы агент видел больше истории
    - Логировать все ответы агента и разбирать их раз в квартал
