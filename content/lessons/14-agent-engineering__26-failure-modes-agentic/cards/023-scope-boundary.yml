- concept: разграничение необходимой подцели и расширения задачи по тому, служит ли действие запрошенному результату или создаёт новый результат во внешнем мире
  question: Пользователь попросил агента собрать пять открытых issue репозитория и сгруппировать их по меткам. Какое из действий агента — расширение задачи (scope creep), а не необходимая подцель?
  explanation: 'Подцель законна, если без неё запрошенный результат не собрать: получение issue, нормализация времени, повторный запрос после сбоя — всё это служит группировке. Закрытие issue не помогает построить группировку, зато меняет состояние внешней системы и принимает решение за пользователя. Граница проходит по порученному результату, а не по разумности действия.'
  kind: choice
  options:
    - Запросить у API список открытых issue вместе с их метками
    - Привести время создания issue к одному часовому поясу, чтобы отсортировать таблицу
    - Закрыть две issue, которые агент счёл дубликатами
    - Повторить запрос к API после ответа с ошибкой пагинации
  correct: 2
  id: 023-scope-boundary-1
  fingerprint: 4b47a2d1
- concept: scope creep фиксируется по отсутствию разрешения на цель, а не по нарушению запрета; явный запрет добавляет вторую метку — потерю контекста
  question: Агент выполнил действие, о котором пользователь не просил. Объясни своими словами, почему для метки scope creep не требуется, чтобы пользователь это действие запрещал, и что меняется в разметке, если запрет всё-таки был высказан в начале задачи.
  explanation: 'Порядок разметки: сначала проверяем, входила ли цель в разрешённые пользователем — если нет, это scope creep независимо от запретов. Затем отдельно проверяем, было ли в трейсе явное ограничение раньше нарушающего действия — если было, добавляется context loss.'
  kind: open
  reference: 'Scope creep определяется относительно множества целей, которые пользователь разрешил, а не множества, которые он запретил. Разрешения перечислимы, запреты — нет: пользователь физически не может заранее назвать все действия, которых не хочет. Поэтому достаточное условие отказа — отсутствие разрешения на цель, а не наличие запрета. Если же ограничение было высказано явно и агент действовал вопреки нему, трейс получает вторую метку — context loss: ограничение присутствовало в контексте, но не удержалось до момента действия. Это два разных источника отказа (граница задачи и удержание ограничений), поэтому обе метки могут стоять на одном трейсе одновременно.'
  id: 023-scope-boundary-2
  fingerprint: 8fbb53a0
- concept: тяжесть scope creep определяется необратимостью внешнего побочного эффекта лишней цели, а не количеством лишних действий
  question: 'Два трейса получили метку scope creep. В первом агент сверх просьбы выполнил семь лишних поисковых запросов и построил дополнительный отчёт для себя. Во втором — одно лишнее действие: отправил письмо с данными пользователя внешнему адресату. Какой трейс приоритетнее в разборе и почему?'
  explanation: 'Ранжируют scope creep по последствиям лишней цели, а не по числу лишних шагов. Чтения и внутренние вычисления обратимы: результат просто выбрасывается. Действия с внешним эффектом — трата денег, изменение записи, создание PR, отправка письма, раскрытие данных другому человеку — создают состояние, которое агент откатить не может, а раскрытие данных не откатывается вообще.'
  kind: choice
  options:
    - 'Первый: лишних действий больше, значит и отклонение от задачи сильнее'
    - 'Второй: лишняя цель произвела необратимый внешний эффект, который нельзя откатить действиями агента'
    - 'Оба одинаково: метка одна и та же, приоритет задаётся только частотой метки в выборке'
    - 'Первый: больше вызовов инструментов означает выше вероятность каскада'
  correct: 1
  id: 023-scope-boundary-3
