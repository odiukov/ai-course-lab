- concept: 'порядок сборки контура: трейсы сначала попадают в хранилище, детекторы работают по хранилищу, а порог применяется к агрегату по прогону, а не к одиночному трейсу'
  question: Расставь этапы автоматического контроля качества агента в правильном порядке — от прогона тестовых задач до решения о блокировке выкладки.
  explanation: 'Хранилище идёт первым: детектор без места, откуда брать трейсы, — функция, которую некому вызвать. Метки кладутся рядом с трейсом, иначе число нельзя ни проверить, ни пересчитать. Решение принимается по агрегату всего прогона, а не по отдельному трейсу: одиночный отказ — шум, доля — измеримая характеристика версии.'
  kind: order
  items:
    - Агент выполняет тестовые задачи, и полный трейс каждого запуска сохраняется в хранилище
    - По сохранённым трейсам автоматически прогоняются детекторы режимов отказа
    - Метки детекторов записываются рядом с исходным трейсом
    - 'По всему прогону считается агрегат: доля трейсов, в которых найден хотя бы один отказ'
    - Агрегат сравнивается с заранее согласованным порогом, и при превышении сборка блокируется
