- concept: общий шлюз по доле затронутых трейсов не защищает от редких, но дорогих режимов, поэтому их закрывают отдельными порогами по режиму
  question: Общий шлюз пропускает сборку, если доля трейсов хотя бы с одним отказом не превышает согласованной границы. Почему команде дополнительно задают отдельные пороги на конкретные режимы отказа?
  explanation: 'Общий шлюз усредняет: несколько трейсов с необратимым внешним побочным эффектом теряются в допустимой доле мелких отказов. Отдельный порог по такому режиму (например, нулевая терпимость к галлюцинации успеха при неизменном состоянии среды) закрывает эту дыру. Варианты про суммирование долей неверны — из-за множественных меток доли режимов не складываются в общую.'
  kind: choice
  options:
    - Редкий режим с тяжёлыми последствиями почти не сдвигает общую долю и проходит шлюз, хотя допускать его нельзя
    - Отдельные пороги нужны, чтобы сумма долей всех режимов давала ровно общую долю затронутых трейсов
    - Общий шлюз считает метки, а пороги по режимам считают трейсы, поэтому вторые точнее
    - Отдельные пороги заменяют общий шлюз, когда детекторов становится больше трёх
