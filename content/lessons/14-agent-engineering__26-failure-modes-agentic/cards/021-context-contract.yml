- concept: 'context loss отличается от каскада по первопричине: отсутствующее в контексте ограничение против предыдущего неверного результата'
  question: 'Агенту в начале задачи сказано: «не пиши ни в одну таблицу прод-базы, только в staging». Дальше он 60 действий читает схемы, сравнивает миграции, получает от инструментов корректные ответы. На 61-м действии он выполняет запись в прод-таблицу, потому что так быстрее применить миграцию. Все предыдущие вызовы вернули верные данные. Какой режим отказа это и почему?'
  explanation: Каскад требует вышестоящего неверного результата, который порождает последствия дальше по цепочке (галлюцинация про SKU и четыре запроса к API). Здесь вся цепочка данных корректна — исчезло само ограничение. Инструмент существует и вызван правильно по контракту, поэтому это не hallucinated action и не tool misuse.
  kind: choice
  options:
    - 'Cascading errors: одна ошибка потянула за собой запись в прод'
    - 'Context loss: раннее ограничение перестало влиять на выбор, при этом предыдущие результаты верны'
    - 'Hallucinated action: агент вызвал несуществующий инструмент записи'
    - 'Tool misuse: инструмент записи вызван с неверными аргументами'
  correct: 1
  id: 021-context-contract-1
  fingerprint: '69174191'
- concept: успешное достижение цели не исключает context loss, поэтому детекция требует сверки каждого позднего решения с ограничениями, заданными в начале, а не проверки итогового результата
  question: Почему метрика «задача выполнена, цель достигнута» не обнаруживает context loss, и какую проверку надо ставить вместо неё?
  explanation: 'Ключ: context loss даёт валидный на вид результат при нарушенном ограничении. Отсюда требование тащить набор ограничений через весь трейс и сверять с ним каждое действие, а не только финальное состояние.'
  kind: open
  reference: 'При context loss цель как раз достигается: результат собран, бюджет и формат соблюдены, поэтому итоговая приёмка по цели даёт «успех». Теряется не цель, а раннее ограничение — правило, которое должно действовать на каждом последующем шаге. Значит, нужна проверка не итога, а каждого позднего решения против списка ограничений, заданных в начале задачи: для каждого действия задаётся вопрос «не нарушает ли оно ранее установленное правило?». Соседние действия смотреть недостаточно — между правилом и нарушением накапливаются результаты поиска, ответы инструментов и промежуточные планы, поэтому локальная согласованность сохраняется.'
  id: 021-context-contract-2
  fingerprint: 1c1e84c9
- concept: отказ при context loss локализуется в позднем нарушающем действии, а не в момент выдачи ограничения
  question: Ограничение выдано агенту в первом сообщении, несовместимое с ним действие выполнено на 88-м шаге. Куда относить точку отказа при разборе трейса?
  explanation: Разбор идёт по наблюдаемым действиям. Само по себе отсутствие упоминания ограничения в рассуждениях не нарушение — нарушением становится действие, несовместимое с правилом. Поэтому отказ размечается на 88-м шаге, хотя ограничение прозвучало в начале.
  kind: choice
  options:
    - 'К первому сообщению: ограничение сформулировано так, что агент его не удержал'
    - 'К 88-му шагу: ошибка начинается с действия, нарушившего ранее заданное правило'
    - 'К середине трейса: к первому шагу, после которого ограничение перестало упоминаться в рассуждениях'
    - Точку отказа определить нельзя, пока не воспроизведён весь прогон заново
  correct: 1
