- concept: 'выбор инструмента наблюдаемости определяется типом вопроса: агрегат по многим трейсам против детального восстановления одного'
  question: 'Своими словами: чем задача «разобрать один конкретный инцидент и разметить место отказа» отличается по требованиям к инструменту от задачи «понять, какие режимы отказа выросли в продакшене»?'
  explanation: 'Три разных вопроса — три инструмента: найти неизвестный массовый узор (кластеризация), разобрать отдельную сессию (повтор и разметка), проверить известное правило домена (своя сигнатура). Ошибка выбора обычно выглядит так: ищут новый режим отказа предикатами, которые по построению знают только старые.'
  kind: open
  reference: 'Разбор инцидента требует полного пошагового восстановления одного трейса: что агент получил на вход, какие инструменты вызвал с какими аргументами, что вернула среда, что он ответил пользователю — плюс возможность поставить метку отказа на конкретный шаг. Инструмент здесь оптимизирован на глубину по одной сессии и на ручную разметку. Вторая задача — агрегатная: нужны много трейсов сразу, группировка похожих по сходству и сравнение долей с базовой линией; глубина отдельного трейса тут вторична. Отсюда и разделение труда: повтор сессий даёт материал для разметки и таксономии, кластеризация — распределение и детекцию дрейфа, а доменные сигнатуры проверяют известные правила предметной области, которых не знает ни одна из платформ.'
