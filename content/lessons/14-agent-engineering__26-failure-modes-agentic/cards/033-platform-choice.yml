- concept: кластеризация по сходству находит ранее неизвестный режим отказа, тогда как правило-предикат ловит только заранее сформулированный критерий
  question: После обновления модели доля неуспешных прогонов выросла, но какие именно новые ошибки появились — неизвестно. Какой инструмент подходит для первого шага и почему?
  explanation: Предикат ловит только то, что уже сформулировано как правило — новый узор он пропустит по определению. Кластеризация работает от сходства между трейсами, поэтому даёт заметить группу, которой раньше не было. Уже после того, как узор описан, его переводят в дешёвую сигнатуру и гоняют на каждом прогоне.
  kind: choice
  options:
    - 'Кластеризация трейсов по сходству: она группирует похожие случаи и показывает выросшую группу, не требуя заранее знать сигнатуру сбоя'
    - 'Набор доменных предикатов: они дают детерминированный флаг и потому обнаруживают любой новый тип отказа'
    - 'Пошаговый повтор сессий: единственный способ увидеть распределение режимов отказа по всему продакшену'
    - 'Счётчик исключений: рост неизвестных ошибок всегда проявляется через рост числа падений'
