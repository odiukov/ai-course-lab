- concept: постусловие фиксируется до выполнения действия, и вердикт об успехе выносится сравнением прочитанного состояния с этим постусловием
  question: Расставь шаги проверочного шлюза для действия агента в правильном порядке.
  explanation: Постусловие, придуманное после результата, подгоняется под то, что получилось, и перестаёт быть проверкой. Поэтому критерий фиксируют до действия, затем читают среду и только потом выносят вердикт. Пропуск третьего шага возвращает нас к доверию словам агента.
  kind: order
  items:
    - 'Заранее сформулировать наблюдаемое постусловие: какой факт о состоянии среды должен стать истинным'
    - Дать агенту выполнить действие инструментом
    - Прочитать фактическое состояние среды независимым запросом, не используя ответ агента
    - Сравнить прочитанное состояние с постусловием и признать успех только при совпадении
  id: 025-claim-vs-state-2
  fingerprint: f13275b7
- concept: успешный статус вызова инструмента — свидетельство о доставке запроса, а не о целевом состоянии, поэтому подтверждением служит побочный эффект в системе-приёмнике
  question: Агент вызвал API календаря для создания встречи и получил HTTP 202. Почему этот код нельзя считать подтверждением выполнения задачи и что проверять вместо него? Объясни своими словами.
  explanation: 'Статус вызова — метрика-заменитель: она коррелирует с успехом, но расходится с ним именно в тех случаях, ради которых шлюз и ставят. Проверка постусловия в системе-приёмнике ловит расхождение между заявлением об успехе и состоянием среды одной строкой кода.'
  kind: open
  reference: 'Код ответа говорит только о судьбе запроса: он принят транспортом и, возможно, поставлен в очередь. Целевое состояние — существование встречи — из него не следует: запрос мог быть отброшен при обработке, применён к другому календарю, создать событие с не тем временем или участниками. Подтверждением должен быть независимо наблюдаемый побочный эффект в системе-приёмнике: событие с нужной датой и участниками читается из календаря отдельным запросом. Тот же принцип для других действий: для письма — запись в папке отправленных, для файла — существование по нужному пути и, если важно содержимое, его размер или сами данные. Проверять надо тот факт, ради которого задача ставилась, а не факт о канале связи с инструментом.'
  id: 025-claim-vs-state-3
  fingerprint: a3e8d109
