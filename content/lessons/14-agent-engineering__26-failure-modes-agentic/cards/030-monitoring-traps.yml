- concept: детекция дрейфа качества требует зафиксированной заведомо хорошей опорной точки, иначе утверждение «стало хуже» неопределимо
  question: Команда собирает мониторинг агента и добавляет проверки содержимого, но не хранит ни одного зафиксированного прогона с известным хорошим результатом. Объясни своими словами, какой класс отказов такой мониторинг ловить не будет и почему.
  explanation: 'Три типичные ошибки мониторинга отказов: разметка только падений, отсутствие baseline и избыточные алерты. Baseline — не украшение дашборда, а второй операнд сравнения: детекция дрейфа это утверждение о разнице между текущим состоянием и последней известной хорошей точкой.'
  kind: open
  reference: 'Не будет ловить дрейф — постепенное ухудшение качества. Проверки содержимого ловят нарушение абсолютных условий (сумма превышает исходный платёж, адресат не совпадает с заявкой). Дрейф же — это относительное утверждение: доля допустимых результатов упала, ответы стали хуже, чем раньше. «Хуже» бессмысленно без второго члена сравнения. Нужна последняя заведомо хорошая точка — зафиксированный baseline из прогонов с проверенными результатами, с которым сравнивают текущие. Без него ухудшение с 96% до 78% допустимых исходов выглядит просто как текущее число, а не как регрессия, и обнаружится только когда абсолютные пороги начнут пробиваться массово.'
  id: 030-monitoring-traps-2
  fingerprint: 59beaac8
- concept: алерт на каждый отдельный отказ разрушает мониторинг через отключение алертов людьми, поэтому отказы группируют и ограничивают частоту оповещений
  question: Агентная система даёт около 1200 содержательных отказов в сутки. Каждый отказ немедленно поднимает дежурного звонком. Какое последствие делает такую схему хуже отсутствия алертов, и что с этим делают?
  explanation: 'Проблема не техническая, а человеческая: канал оповещения с такой плотностью выгорает за дни, дежурные глушат его, и система остаётся вообще без надзора — хуже, чем при честном отсутствии алертов. Лечится агрегацией (сто повторов одного режима отказа — одно оповещение) и rate limiting, так что до человека доходит распределение и всплески, а не поток единичных событий.'
  kind: choice
  options:
    - Звонки нагружают телефонную инфраструктуру; нужно перейти на email
    - Дежурные перестают реагировать и отключают оповещения, после чего мониторинг теряется целиком; отказы группируют по типу и ограничивают частоту оповещений
    - Каждый звонок замедляет агента; нужно вынести алерты в асинхронную очередь
    - Отказы дублируются в логах; нужно повысить порог логирования до ERROR
  correct: 1
  id: 030-monitoring-traps-3
  fingerprint: e6ba6396
