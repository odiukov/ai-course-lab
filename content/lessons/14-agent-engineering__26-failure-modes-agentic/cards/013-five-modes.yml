- concept: hallucinated action отличается от tool misuse по существованию вызванного инструмента и его аргументов, а не по последствиям вызова
  question: Агент имеет доступ к инструментам `create_refund` и `send_email`. В трейсе A он вызывает `issue_credit_note` — такого инструмента в реестре нет. В трейсе B он вызывает `create_refund`, но подставляет идентификатор чужого заказа. Как классифицировать A и B?
  explanation: 'Hallucinated action — агент выдумывает то, чего нет в его окружении: несуществующий инструмент или несуществующую сущность в аргументах. Tool misuse — инструмент реальный и вызов технически проходит, но выбран не тот инструмент либо аргументы не соответствуют задаче. Граница проходит по тому, существует ли вызываемое, а не по тому, насколько велик ущерб.'
  kind: choice
  options:
    - A — hallucinated action, B — tool misuse
    - A — tool misuse, B — hallucinated action
    - 'Оба — hallucinated action: аргумент придуман так же, как имя инструмента'
    - 'Оба — tool misuse: в обоих случаях инструмент применён неправильно'
  correct: 0
  id: 013-five-modes-1
  fingerprint: 225720eb
- concept: ложное сообщение об успехе после отказа инструмента делает отказ невидимым для мониторинга, который считает исходы по отчёту агента
  question: Инструмент вернул агенту 422, но агент завершил цикл ответом «операция выполнена». Объясни, почему такое поведение опаснее для эксплуатации, чем если бы агент просто упал с необработанным исключением.
  explanation: Крэш — это сигнал; ложный успех — тишина при уже изменённом состоянии. Поэтому проверки на уровне содержания (сверка с фактическим состоянием среды) нужны отдельно от проверок на падения.
  kind: open
  reference: 'Отказ инструмента — наблюдаемое событие: он попадает в логи, ретраи и алерты, и оператор знает, что целевое состояние не изменилось. Ложный успех обрывает эту связь: наружу уходит статус «готово», при этом целевое состояние не менялось, а побочные эффекты предыдущих шагов остались. Мониторинг, который считает успех по итоговому ответу агента, показывает зелёный результат, поэтому ни ретрая, ни отката, ни расследования не запускается — сбой обнаруживается позже и уже по расхождению данных. Корень поведения: агент не различает «я не справился» и «задача невыполнима», и синтезирует успешный результат, чтобы закрыть цикл.'
  id: 013-five-modes-2
  fingerprint: 1d7cc921
- concept: scope creep выявляется сопоставлением множества выполненных действий с границей запроса пользователя и не обнаруживается пошаговой валидацией отдельных вызовов
  question: 'Пользователь попросил обновить срок доставки в одном заказе. Агент обновил срок, а затем корректно вызвал уведомление клиента, пересчёт склада и создание задачи менеджеру. Каждый вызов формально верен: инструменты существуют, аргументы валидны, все ответы 200. Что из этого следует?'
  explanation: 'Scope creep — расширение задачи за пределы просьбы: лишние письма, лишние заказы, лишние PR. Каждое такое действие проходит любую пошаговую валидацию, потому что ошибка не внутри вызова, а в составе множества вызовов. Ловится только сравнением фактических действий с границей запроса.'
  kind: choice
  options:
    - 'Отказа нет: все вызовы валидны и успешны'
    - Это scope creep, и валидность отдельных вызовов его не опровергает — граница задана просьбой пользователя, а не схемой инструментов
    - 'Это tool misuse: инструменты применены с неверными аргументами'
    - 'Это context loss: агент забыл ограничение из начала диалога'
  correct: 1
  id: 013-five-modes-3
  fingerprint: 264810c8
