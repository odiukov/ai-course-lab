- concept: результат работы инструмента недоверен наравне с найденным контентом, потому что его содержимым управляет внешняя сторона
  question: Почему выход инструмента считается недоверенным источником, хотя инструмент вызвал сам агент?
  explanation: Доверие определяется тем, кто пишет текст, а не тем, кто его запросил. Страница, письмо или ответ сервиса контролируются посторонним, поэтому директивы оттуда исполнять нельзя — читать как данные можно.
  kind: choice
  options:
    - Потому что инструменты часто возвращают неверно отформатированные данные
    - 'Потому что содержимое ответа задаёт внешняя сторона, а не пользователь: агент контролирует только сам факт вызова'
    - Потому что выход инструмента приходит позже пользовательского сообщения
    - Потому что инструменты не поддерживают метки источника
