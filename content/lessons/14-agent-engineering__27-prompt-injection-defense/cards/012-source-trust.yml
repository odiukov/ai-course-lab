- concept: 'разделение обязанностей: проверка происхождения и поиск текстовых признаков — независимые слои, каждый со своим входом'
  question: Почему проверку доверия к источнику не совмещают с поиском подозрительных фраз в одной функции? Что даёт разделение?
  explanation: Разные входы — разные функции. Такая структура позволяет усилить один слой, не порождая ложных отказов в другом, и делает поведение проверяемым по отдельности.
  kind: open
  reference: 'Это два независимых сигнала с разными входами. Проверка происхождения смотрит только на метку и отвечает, может ли этот источник вообще выражать намерение пользователя; она не зависит от формулировки — вежливый текст с найденной страницы остаётся недоверенным, а грубое сообщение пользователя доверенным. Поиск маркеров смотрит только на текст и не знает, откуда он взялся. Смешение слоёв ломает обе проверки: недоверенный источник начнёт получать доверие за безобидные формулировки, а доверенный — блокироваться за цитату. Разделённые слои комбинируются в решении валидатора: недоверенный источник плюс признаки директивы дают отказ, и каждое правило можно тестировать и менять отдельно.'
