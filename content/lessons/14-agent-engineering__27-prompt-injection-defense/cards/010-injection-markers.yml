- concept: маркеры делают короткими подстроками, потому что инъекция спрятана внутри длинного постороннего текста
  question: Почему элементы списка маркеров инъекции формулируют короткими фрагментами, а не целыми предложениями атаки?
  explanation: Аргумент вызова — это заметка или страница целиком. Целое предложение атаки совпадёт только при дословном повторении; короткий оборот вроде «игнорируй предыдущие» находится внутри любого обрамления.
  kind: choice
  options:
    - Короткие строки занимают меньше памяти при сканировании
    - Инъекция встроена в длинный посторонний текст, и искать нужно вхождение подстроки, а не совпадение всего аргумента
    - Длинные строки нельзя записать в список Python
    - Модель не воспринимает предложения длиннее нескольких слов
  correct: 1
  id: 010-injection-markers-1
  fingerprint: a05c188e
- concept: сканирование маркеров нормализует регистр, иначе смена регистра обходит проверку
  question: Дополни проверку так, чтобы «ИГНОРИРУЙ ПРЕДЫДУЩИЕ» ловилось тем же маркером, что и вариант строчными буквами.
  explanation: Маркеры хранятся в одном регистре, поэтому входной текст нормализуют перед поиском. Без нормализации атака обходится сменой регистра одной буквы — самый дешёвый способ разойтись с сигнатурой.
  kind: cloze
  template: 'if any(marker in text.___() for marker in injection_markers()):'
  answer: lower
  accept:
    - lower
    - casefold
    - text.lower
    - lower()
  id: 010-injection-markers-2
  fingerprint: cd0ca7f5
- concept: слишком общий маркер даёт отказы на легитимных вызовах, и такую защиту выключают
  question: В список маркеров добавили слово «отправь». Какой главный практический риск такого маркера?
  explanation: 'Маркер должен ловить командный оборот атаки — отмену прежних правил, подмену роли, сокрытие вмешательства, — а не любой глагол. Поэтому тестовый набор обязательно содержит хороший вызов: если он блокируется, маркер слишком широкий.'
  kind: choice
  options:
    - Он замедлит сканирование длинных аргументов
    - Он сработает на обычных легитимных вызовах, поток ложных отказов сделает валидатор непригодным, и его отключат
    - Он не найдётся ни в одном реальном тексте атаки
    - Он помешает исполнителю передать аргументы инструменту
  correct: 1
  id: 010-injection-markers-3
  fingerprint: 44b14678
