- concept: вердикт валидатора трёхзначный, потому что вредный вызов и допустимое необратимое действие требуют разных исходов
  question: Почему функция проверки кандидатного вызова возвращает три исхода (разрешить / отклонить / запросить подтверждение), а не булево значение?
  explanation: 'При булевом ответе необратимые, но законные действия придётся либо пропускать автоматически, либо блокировать целиком. Третий исход сохраняет разницу: «это делать нельзя» и «это можно, но не мне решать».'
  kind: choice
  options:
    - 'Чтобы логи были подробнее: смысл тот же, различие только в отчётности'
    - Потому что булев ответ склеивает два разных случая — вызов, который исполнять нельзя, и вызов, который допустим, но требует человеческого решения
    - Потому что третий исход нужен для случаев, когда валидатор упал с ошибкой
  correct: 1
  id: 026-validate-call-1
  fingerprint: 51f79301
- concept: на признаки инъекции сканируются значения аргументов вызова, а не имя инструмента
  question: Валидатор собирает текст для сканирования маркеров. Что должно попасть на вход?
  explanation: 'Имя инструмента выбирается из фиксированного реестра и атакующим не управляется. Подложенный текст приезжает в значениях: адрес получателя, тело письма, поисковый запрос, путь. Сканировать надо их.'
  kind: cloze
  template: |-
    text = " ".join(str(v) for v in ___)
    markers = injection_markers(text)
  answer: call.args.values()
  accept:
    - call.arguments.values()
    - args.values()
    - arguments.values()
    - call["args"].values()
    - значения аргументов вызова
  id: 026-validate-call-2
  fingerprint: f0cc03d9
- concept: проверки упорядочены так, что безусловный отказ выносится раньше эскалации к человеку
  question: Расставь проверки внутри валидатора так, чтобы вызов, который в принципе исполнять нельзя, отсекался до того, как система потратит внимание человека.
  explanation: 'Эскалация к человеку — дорогой и медленный исход, и на явно плохом вызове она бессмысленна: подтверждать нечего. Поэтому дешёвые машинные отказы идут первыми, а подтверждение остаётся только для вызовов, переживших обе предыдущие проверки.'
  kind: order
  items:
    - Сверить предлагаемое действие с заявленной целью пользователя; при необъяснимом расхождении — отклонить
    - Просканировать текстовые значения аргументов на признаки инъекции; при попадании — не разрешать автоматически
    - Оценить чувствительность действия и для необратимой операции вернуть запрос подтверждения человека
  id: 026-validate-call-3
  fingerprint: c4d010c7
