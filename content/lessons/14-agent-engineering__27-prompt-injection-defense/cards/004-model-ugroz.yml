  fingerprint: f2cb8452
- concept: внедрённые инструкции конкурируют с промптом разработчика в момент чтения контента, а не при настройке агента
  question: В какой момент внедрённая в контент инструкция начинает соперничать с промптом разработчика?
  explanation: Пока текст лежит на чужом сервере, он безвреден. Конкуренция инструкций возникает на ингесте — когда найденный текст оказывается в одном контексте с настоящими указаниями и модель должна решить, чему следовать.
  kind: choice
  options:
    - В момент, когда контент прочитан и попал в контекст модели вместе с задачей пользователя
    - В момент публикации контента атакующим на его сайте
    - Только после того, как агент сохранит контент в долговременную память
    - Только если разработчик забыл задать системный промпт
