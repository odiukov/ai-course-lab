- concept: поверхность атаки определяется вопросом «кто контролирует контент, который попадёт в контекст позже», а не списком участников диалога
  question: Какой вопрос нужно задать при оценке поверхности непрямой инъекции у агента, и почему список участников диалога для этого не годится?
  explanation: 'Отсюда практические ограничители: allowlist адресов, сужение того, какие источники агент вообще может втягивать, и проверка вызовов инструментов после чтения недоверенного контента.'
  kind: open
  reference: 'Вопрос: кто может повлиять на контент, который агент когда-либо втянет в контекст? Сюда входят авторы веб-страниц по доступным ссылкам, отправители писем, загрузчики документов, поставщики результатов поиска, авторы записей в памяти и выходы других агентов. Список участников диалога не годится: атакующий в диалог не заходит, у него нет учётной записи в системе — он влияет на данные, которые агент прочитает позже.'
