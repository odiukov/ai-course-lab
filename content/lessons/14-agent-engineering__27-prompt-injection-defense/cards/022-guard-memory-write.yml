  fingerprint: 97edc4db
- concept: для директивной записи в память безопасный исход — полный отказ, а не вырезание подозрительных слов
  question: Заметка для памяти выглядит как указание агенту. Разработчик предлагает не отклонять её, а удалить сработавшие маркеры и сохранить остаток. Почему это плохая идея?
  explanation: 'То же рассуждение, что и с маркерами вообще: совпадение по подстроке — сигнал, а не полное описание атаки. Чинить подозрительный вход редактированием — значит доверять своей полноте распознавания.'
  kind: open
  reference: 'Санитизация оставляет текст, который писал атакующий. Смысл директивы держится не на конкретных словах: убрали «execute», осталась перефразировка, императив на другом языке или намёк, который следующая сессия прочитает как команду. Список маркеров всё равно неполон, поэтому вырезание даёт ложное ощущение безопасности при сохранённой полезной нагрузке. Запись в память переживает диалог, цена ошибки высокая, а потеря одной легитимной заметки дёшева — поэтому правильный исход отказ целиком, с записанной причиной.'
  id: 022-guard-memory-write-2
  fingerprint: 2859a451
