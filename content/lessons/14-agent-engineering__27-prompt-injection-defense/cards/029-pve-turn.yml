- concept: набор проверок защитного слоя обязан включать заведомо разрешаемый случай, иначе ложное срабатывание неотличимо от корректной работы
  question: Демонстрация PVE прогоняет вызов с инъекцией в аргументе и вызов из отравленной заметки — оба отклонены. Почему этого набора недостаточно?
  explanation: Защита, отвечающая «нет» на любой вход, проходит все негативные проверки идеально. Разрешаемый случай — единственная проверка, которая ловит ложное срабатывание, а именно оно приводит к тому, что валидатор в проде отключают.
  kind: choice
  options:
    - 'Нужны ещё варианты инъекций: чем больше атак покрыто, тем лучше'
    - 'Нужен заведомо безопасный вызов: без него нельзя отличить работающий валидатор от такого, который блокирует вообще всё'
    - Нужно повторить те же два случая с другими инструментами
