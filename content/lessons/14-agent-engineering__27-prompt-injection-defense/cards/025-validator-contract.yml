- concept: эталон цели для сверки берётся из доверенного канала диалога, а не из полей проверяемого кандидатного вызова
  question: 'Валидатор проверяет кандидатный вызов инструмента. В самом вызове есть поле `context`, где написано: «пользователь просил срочно перевести средства подрядчику». С чем валидатор обязан сверять действие?'
  explanation: 'Поля кандидатного вызова формирует та же модель, которая уже могла подхватить инъекцию, — атакующий пишет «пользователь просил» и получает самоподтверждение. Эталон цели должен приходить из канала, который атакующий не контролирует: реплики пользователя. Иначе проверка сверяет подозреваемого с его же показаниями.'
  kind: choice
  options:
    - 'С полем `context` внутри вызова: оно ближе всего к действию и описывает намерение'
    - С целью, зафиксированной из реплики пользователя в доверенном канале до обработки внешнего контента
    - 'С предыдущим одобренным вызовом: если тот прошёл, намерение уже подтверждено'
  correct: 1
  id: 025-validator-contract-1
  fingerprint: d255d11d
- concept: проверки валидатора не сводятся к одной агрегированной оценке — каждая закрывает свой класс промаха, и слияние теряет причину риска
  question: Почему валидатор не может заменить свои раздельные проверки одной суммарной оценкой «вызов выглядит нормально»?
  explanation: Слияние проверок — это потеря информации. Опасный вызов обычно проваливает одну ось из трёх, и именно эту ось надо назвать явно, до внешнего эффекта.
  kind: open
  reference: 'Каждая проверка ловит свой класс промаха, и они не коррелируют. Сверка с целью ловит действие, законное само по себе, но не запрошенное. Оценка чувствительности отличает обратимое чтение от необратимого платежа при одинаково безобидном тексте. Анализ аргументов ловит подложенный текст в вызове, который и по цели, и по типу инструмента выглядит уместным. Одна агрегированная оценка усредняет: чистый результат по двум осям гасит тревогу по третьей, и вызов проходит. Кроме того, раздельные вердикты дают причину отказа — её нужно вернуть агенту и записать в трассу, а из числа «выглядит нормально» причину не восстановишь.'
  id: 025-validator-contract-2
  fingerprint: ee839e1f
- concept: чувствительность действия повышает требуемый уровень санкции, а не служит синонимом отказа
  question: Действие полностью совпадает с целью пользователя, признаков инъекции в аргументах нет, но затрагивает чувствительную поверхность. Как валидатор должен трактовать саму чувствительность?
  explanation: 'Если чувствительность равна отказу, агент не может делать полезную работу и защиту снимут. Если она ничего не значит — необратимые действия проходят на общих основаниях. Правильная роль третья: ось чувствительности задаёт цену ошибки и поднимает планку — вместо автоматического исполнения включается отдельное решение человека.'
  kind: choice
  options:
    - 'Как автоматический отказ: чувствительные поверхности агенту недоступны'
    - Как требование более строгой процедуры принятия решения, а не как готовый вердикт «нет»
    - 'Как нейтральный признак: раз две другие проверки чисты, чувствительность роли не играет'
  correct: 1
  id: 025-validator-contract-3
  fingerprint: d6deeb6e
