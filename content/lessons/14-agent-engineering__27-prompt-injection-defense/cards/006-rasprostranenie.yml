- concept: классификация распространяющихся атак по носителю, который переносит инъекцию за пределы одного эпизода
  question: По какому признаку удобнее всего различать распространяющиеся последствия непрямой инъекции? Назови признак и разберись, какие носители бывают.
  explanation: 'Носитель задаёт и защиту: фильтровать собственный вывод, валидировать запись в память, помечать происхождение записей в общих хранилищах.'
  kind: open
  reference: 'Признак — носитель, который переносит инъекцию дальше одного эпизода. Носители: собственный ответ агента, который прочитает следующий читатель (самораспространение); долговременная запись — заметка, предпочтение, «факт» в памяти, которую агент сам достанет в новой сессии (стойкое отравление); общий источник знаний, из которого читают несколько агентов (заражение экосистемы). Формулировка вредного текста может быть одинаковой — различается путь переноса.'
  id: 006-rasprostranenie-3
