- concept: заражение информационной экосистемы распространяет ложные факты через общий источник знаний, а не самокопирующуюся команду
  question: Заражённый агент записал выдуманный «факт» в общую базу знаний, которой пользуются несколько других агентов. Чем этот сценарий отличается от самораспространяющейся инъекции?
  explanation: 'Различать сценарии удобно по носителю: ответ агента — червь, общий источник знаний — заражение экосистемы. Во втором случае остальные агенты даже не выполняют чужую инструкцию, они просто верят ложным данным.'
  kind: choice
  options:
    - 'Распространяется не команда, а данные: другие агенты принимают запись за обычную информацию из доверенного источника'
    - 'Ничем: любая запись в общий источник — это червь по определению'
    - Тем, что здесь не нужен ни один вызов инструмента
    - Тем, что заражение экосистемы затрагивает только того агента, который сделал запись
