- concept: 'подмена ролей: контент, взятый ради фактов, начинает управлять обработкой'
  question: Объясни своими словами, в какой момент данные превращаются в инструкции для агента и почему это подмена ролей, а не обычное чтение.
  explanation: Ключ — не формулировка текста, а то, какие полномочия ему приписаны. Пока чужой текст остаётся материалом, всё нормально; опасность начинается, когда он влияет на выбор следующего действия.
  kind: open
  reference: Агент забирает чужой контент как материал (факты, сумма счёта, текст страницы). Превращение происходит, когда модель воспринимает часть этого контента не как материал для чтения, а как основание для действия — то есть отдаёт источнику данных право определять поведение. Роль «источник фактов» подменяется ролью «источник команд», хотя у автора контента нет никаких полномочий у пользователя.
  id: 001-granitsa-doveriya-3
  fingerprint: ef832067
