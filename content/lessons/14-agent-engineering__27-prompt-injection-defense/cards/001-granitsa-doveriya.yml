- concept: вредоносная инструкция не обязана выглядеть как команда для человека — она прячется в невидимых или служебных участках контента
  question: 'Команда агента фильтрует загружаемые страницы глазами: оператор смотрит видимый текст и, если ничего похожего на приказ не видит, страница считается безопасной. Почему такая проверка ненадёжна?'
  explanation: В модель уходит извлечённый текст целиком, а не то, что отрисовал бы браузер человеку. Инъекцию прячут в невидимом слое, поэтому «выглядит нормально» ничего не гарантирует.
  kind: choice
  options:
    - 'Модель читает и то, что человек не видит: белый текст, alt-атрибуты, метаданные, комментарии, служебные поля'
    - Оператор физически не успевает читать страницы быстрее агента
    - Видимый текст всегда безопасен, опасны только вложенные файлы
    - Модель игнорирует видимый текст и опирается только на заголовок страницы
  correct: 0
  id: 001-granitsa-doveriya-2
