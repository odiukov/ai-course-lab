- concept: внедрённый текст управляет не только выбором инструмента, но и значениями его аргументов
  question: Почему сравнение внедрённого промпта с вызовом функции считают точным, а не приблизительным?
  explanation: 'Опасность не в том, что агент «сделал что-то не то», а в том, что атакующий определяет операцию вместе с параметрами: перевод уходит на его счёт, письмо — на его адрес. Это ровно та степень контроля, которую даёт вызов функции.'
  kind: choice
  options:
    - Потому что модель внутренне компилирует текст в байт-код перед вызовом инструмента
    - Потому что внедрённый текст задаёт и выбираемую операцию, и подставляемые в неё значения — то есть и имя функции, и её аргументы
    - Потому что любой текст, попавший в контекст, автоматически становится исполняемым
    - Потому что инструменты агента реализованы как обычные функции языка программирования
  correct: 1
  id: 008-proizvolnyy-kod-1
  fingerprint: 3a41f630
- concept: равенство «найденный промпт = исполнение кода» ограничено множеством разрешённых агенту операций, а не системой целиком
  question: Утверждение «обработка найденного промпта равносильна произвольному исполнению кода» не означает, что текст получил доступ к операционной системе. Где на самом деле проходит граница этого равенства и как её измерить у конкретного агента?
  explanation: 'Формулировка задаёт практическую мерку: сначала считаем реестр и права, потом делаем вывод об ущербе. Отсюда прямое следствие — сокращение реестра сокращает достижимый ущерб при неизменной вероятности инъекции.'
  kind: open
  reference: 'Равенство действует на поверхности инструментов — множестве операций, которые агенту разрешено вызывать, вместе с правами, под которыми они выполняются. Внедрённый текст не запускает произвольный процесс на машине; он получает доступ к тем и только тем действиям, что перечислены в реестре инструментов. Измеряется это перечислением реестра и полномочий каждого инструмента: если доступны только чтение календаря и черновики, ущерб ограничен ими, а подключение платежей или публикации расширяет доступный атакующему «набор команд». Поэтому оценивать риск нужно по правам агента, а не по убедительности текста.'
  id: 008-proizvolnyy-kod-2
  fingerprint: 8d0e4700
