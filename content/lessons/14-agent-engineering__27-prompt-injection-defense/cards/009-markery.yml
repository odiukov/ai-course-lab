- concept: срабатывание маркера — основание перевести вызов в более строгий режим обработки, а не окончательный вердикт об атаке
  question: Валидатор нашёл в аргументе вызова инструмента признак из списка маркеров инъекции. Какая трактовка этого срабатывания корректна?
  explanation: 'Маркер — вероятностный признак. Он бывает и у безопасного текста (цитата, пример, отчёт), и отсутствует у переформулированной атаки. Поэтому срабатывание задаёт следующий шаг процедуры — усиление проверки перед исполнением, — а не устанавливает вину. Трактовка «событие для лога» бесполезна: вызов уже исполнится, а вердикт нужен до действия с внешними последствиями.'
  kind: choice
  options:
    - 'Сигнал повышенного риска: вызов переводится в более строгий режим — отказ, полная проверка или запрос дополнительного подтверждения'
    - 'Доказательство атаки: контент можно окончательно пометить как вредоносный и удалить из источника'
    - 'Информационное событие: вызов исполняется как обычно, срабатывание пишется в лог для последующего анализа'
    - 'Признак поломки инструмента: вызов повторяется с теми же аргументами после перезапуска'
  correct: 0
  id: 009-markery-2
