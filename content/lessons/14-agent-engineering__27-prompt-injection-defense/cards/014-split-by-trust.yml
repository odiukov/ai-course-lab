- concept: внутри каждой группы сохраняется исходный относительный порядок фрагментов
  question: Зачем при разделении фрагментов по доверию сохранять их исходный относительный порядок внутри каждой группы?
  explanation: Разделение — техническая операция над потоком, она не должна менять смысл. Перестановка ломает ссылки вида «как я писал выше» и делает поведение агента зависящим от деталей реализации сортировки.
  kind: choice
  options:
    - 'Смысл фрагментов зависит от последовательности: ответы ссылаются на предыдущие сообщения, и перестановка искажает контекст, который увидит модель'
