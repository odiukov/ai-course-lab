  question: На списке из 5 фрагментов функция разделения вернула 2 доверенных и 2 недоверенных. Что это значит?
  explanation: 'Выпавший фрагмент незаметно исчезает из контекста либо позже используется мимо обеих политик — это дыра, а не фильтрация. Ровно одна группа на фрагмент, сумма длин групп равна длине входа: такое свойство легко проверяется тестом.'
  kind: choice
  options:
    - 'В функции дефект: разбиение обязано покрывать вход целиком, один фрагмент выпал из обработки'
    - 'Всё верно: фрагменты, которые не удалось классифицировать, корректно пропускать'
    - Всё верно, если пятый фрагмент был пустым по тексту
    - 'Всё верно: часть фрагментов может попасть сразу в обе группы и не считаться дважды'
