- concept: меры защиты различаются соотношением стоимости внедрения и сокращения поверхности атаки
  question: Продуктовой команде нужно за один день заметно сократить поверхность непрямой инъекции у веб-агента. Какая мера даёт наибольший эффект при наименьшей стоимости внедрения?
  explanation: Список разрешённых источников пишется за минуты и сразу отсекает весь остальной интернет как канал доставки инъекции. Дообучение долгое и не даёт гарантий, а подтверждение каждого шага убивает агентность продукта.
  kind: choice
  options:
    - Короткий список разрешённых доменов и файлов, до которых агент вообще может дотянуться
    - Дообучение основной модели на примерах инъекций
    - Ручное подтверждение человеком каждого шага агента
  correct: 0
  id: 020-six-controls-1
  fingerprint: 6a2db54f
- concept: 'guardrails на инструмент двусторонние: проверяется и то, что уходит в вызов, и то, что возвращается из него'
  question: Почему guardrails ставят не только на входы инструмента, но и на его выходы?
  explanation: Ответ инструмента — очередной ввод для модели, и его содержимым нередко управляет внешняя сторона. Проверка только аргументов защищает от неверного действия, но не от того, что придёт обратно.
  kind: choice
  options:
    - Выход нужно проверять ради подсчёта токенов и стоимости вызова
    - Возвращённый инструментом результат сам попадает в контекст модели и может нести инструкции внешней стороны
    - Проверка выхода нужна, чтобы убедиться, что инструмент действительно был вызван
  correct: 1
  id: 020-six-controls-2
  fingerprint: 8744ad1f
