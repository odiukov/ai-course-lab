- concept: запись в память разносит момент внедрения и момент срабатывания, из-за чего инцидент не виден в трассе исходного диалога
  question: Инъекция была сохранена агентом в долговременную память и сработала только в следующем сеансе. Что это меняет для обнаружения атаки?
  explanation: В сеансе внедрения ничего подозрительного не происходит — текст просто сохранён. Эффект возникает позже и в другом контексте, поэтому операции записи в память логируют и проверяют как отдельный класс событий.
  kind: choice
  options:
    - 'Ничего: трасса сеанса, где текст попал в систему, покажет отклонённое действие'
    - Опасное действие и его причина оказываются в разных трассах, поэтому разбирать надо и запись в память, а не только вызовы инструментов
    - Атака перестаёт быть непрямой инъекцией и становится прямой
  correct: 1
