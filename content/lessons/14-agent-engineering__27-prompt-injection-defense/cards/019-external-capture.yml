- concept: спан хранит ссылку на внешне сохранённый контент и метаданные происхождения, а не сам текст
  question: Агент за один запуск прочитал 40 внешних страниц. По мере control «content capture with external storage», что должно попасть в запись о шаге (спан)?
  explanation: 'Мера разделяет содержимое и запись о действии: проза уезжает во внешнее хранилище, в спане остаются ссылка и происхождение. Полный текст раздувает трассу и тащит инъекцию в каждый лог, голая строка «обработано» уничтожает улику.'
  kind: choice
  options:
    - Полный текст всех 40 страниц, чтобы трасса была самодостаточной
    - Ссылка на сохранённый во внешнем хранилище объект плюс адрес источника, время получения и метка доверия
    - Только строка «40 документов обработано» без деталей
    - Хеш системного промпта агента
  correct: 1
  id: 019-external-capture-1
  fingerprint: d7177974
- concept: для разбора инцидента нужна неизменяемая копия полученного контента, а не ссылка на живой источник
  question: Через три недели после инцидента расследователь открывает трассу. Почему одного адреса исходной страницы недостаточно?
  explanation: Атакующий правит или сносит страницу после срабатывания. Разбирать надо ровно тот байт-в-байт контент, который вошёл в контекст, — поэтому в хранилище лежит снимок с идентификатором версии, а не только URL.
  kind: choice
  options:
    - Адрес занимает слишком много места в спане
    - Внешний источник мог измениться или исчезнуть, поэтому нужна зафиксированная версия того текста, который реально получил агент
    - Адреса нельзя показывать аудиторам по требованиям приватности
    - По адресу нельзя определить, какой инструмент его запросил
  correct: 1
  id: 019-external-capture-2
  fingerprint: c20955fe
- concept: захват контента — мера разбираемости инцидентов, а не предотвращения инъекции
  question: Команда внедрила внешнее хранение найденного контента и считает, что закрыла риск непрямой инъекции. В чём ошибка? Объясни, какое место в защите занимает эта мера.
  explanation: 'В доктрине защиты это последняя из шести мер, и она про разбор постфактум. Меры расставлены по разным местам цепочки: одни ограничивают вход, другие проверяют шаг, эта сохраняет улику.'
  kind: open
  reference: 'Внешнее хранение ничего не блокирует: инъекция всё так же попадает в контекст и может породить вызов инструмента. Мера даёт наблюдаемость — сохранённый снимок контента и происхождение позволяют после инцидента показать конкретный заражённый фрагмент. Предотвращение остаётся за другими мерами: ограничение источников (allowlist), оценка каждого действия до исполнения, guardrails на вход и выход инструмента, подтверждение человеком.'
  id: 019-external-capture-3
  fingerprint: bf355126
