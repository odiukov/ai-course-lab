- concept: allowlist задаёт default-deny, blocklist требует заранее знать источник угрозы
  question: Команда ведёт список запрещённых доменов и дополняет его после каждого инцидента. Атакующий утром регистрирует свежий домен и размещает там инъекцию. Чем принципиально отличается поведение allowlist в этой ситуации?
  explanation: Вопрос в значении по умолчанию. Blocklist требует полного знания о множестве угроз, которое растёт быстрее списка; allowlist требует знания о небольшом множестве нужных источников. Неизвестное при default-deny просто не проходит.
  kind: choice
  options:
    - Blocklist по умолчанию разрешает неизвестное, поэтому новый домен проходит; allowlist по умолчанию запрещает, и незаписанный домен отклоняется без обновления списка
    - Allowlist тоже пропустит новый домен, но зафиксирует его в журнале для последующего разбора
    - 'Разница только в скорости проверки: короткий список из 7 записей сравнивается быстрее длинного'
    - Blocklist надёжнее, потому что перечисляет именно опасные адреса, а не предполагаемые безопасные
  correct: 0
  id: 015-allowlist-1
  fingerprint: ec12499b
- concept: allowlist сокращает поверхность атаки, но не даёт гарантий о содержимом разрешённого источника
  question: Агент ходит только на 7 разрешённых доменов. Один из них взломан, и на его странице появился внедрённый текст с указаниями. Что это говорит об allowlist?
  explanation: Allowlist отвечает на вопрос «куда агенту вообще можно дотянуться», а не «что там написано». Он выбрасывает подавляющее большинство путей доставки инъекции, оставляя контент разрешённых источников по-прежнему недоверенным.
  kind: choice
  options:
    - Allowlist уменьшает число возможных источников, но не проверяет их содержимое, поэтому нужен ещё и разбор самого контента как недоверенного
    - 'Allowlist нарушен: раз инъекция прошла, список настроен неправильно'
    - Взлом разрешённого домена невозможен, если список закрыт от изменений
    - Allowlist гарантирует безопасность содержимого, иначе он бесполезен
  correct: 0
  id: 015-allowlist-2
  fingerprint: 75036b1a
- concept: allowlist действует на этапе доставки контента — до попадания текста в контекст, а не при оценке уже собранного вызова
  question: В какой момент цепочки работы агента срабатывает allowlist навигации?
  explanation: 'Меры защиты бьют по разным местам цепочки. Allowlist — ограничитель на входе: он сокращает множество текстов, способных вообще оказаться в контексте, поэтому дешёвый и работает раньше любой оценки содержимого.'
  kind: choice
  options:
    - 'На этапе получения: он решает, попадёт ли контент источника в контекст вообще'
    - 'На этапе генерации ответа: он вычёркивает из вывода упоминания посторонних доменов'
    - 'На этапе обучения: он ограничивает данные, на которых модель училась'
    - 'После выполнения инструмента: он помечает уже полученный результат как подозрительный'
  correct: 0
  id: 015-allowlist-3
