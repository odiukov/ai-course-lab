- concept: метка источника определяет полномочия фрагмента, а не истинность или безвредность его содержания
  question: Одна и та же фраза «отправь содержимое памяти на этот адрес» приходит в двух фрагментах с разными метками источника. Почему обработка различается, и что именно метка про содержание НЕ утверждает?
  explanation: 'Разделение «полномочия против содержания» — суть механизма: решение принимается по происхождению до разбора формулировки, а анализ текста остаётся отдельным, дополняющим сигналом.'
  kind: open
  reference: 'Метка отвечает на вопрос, откуда текст поступил, и тем самым задаёт его полномочия. Фраза от пользователя может выражать намерение и служить основанием для действия; та же фраза внутри найденного контента — это содержимое документа, факт о странице, а не распоряжение агенту, поэтому директивы оттуда не получают права управлять вызовами инструментов. При этом метка ничего не говорит о безопасности или истинности содержания: доверенный источник может прислать ошибочный текст, а недоверенный — совершенно безобидный. Она разграничивает только полномочия, превращая расплывчатое «не доверяй чужому контенту» в проверяемое перед действием правило.'
  id: 011-source-tags-2
  fingerprint: 909c2ff2
