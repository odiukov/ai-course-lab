- concept: вендорская защита обучена на общем трафике и не наблюдает инварианты конкретного продукта, поэтому её берут как основу и дописывают доменный слой поверх
  question: Почему готовые guardrails вендора принципиально не могут заменить собственные правила продукта? Объясни, что именно вендору недоступно.
  explanation: 'Разделение ответственности: общая поверхность атаки — зона вендора, инварианты продукта — твоя. Доменные предикаты удобно встраивать в тот же контракт валидатора, который уже сверяет действие с целью пользователя и решает, нужен ли человек.'
  kind: open
  reference: 'Вендор оптимизирует защиту под общий случай: недоверенный найденный контент, типовые формулировки внедрённых инструкций, опасные категории операций. Ему не видны семантика домена и внутренние правила: какой порог суммы требует человека, какой формат имеет корректный идентификатор товара, какая роль вправе оформить возврат, какие комбинации параметров запрещены регламентом. Эти инварианты не выводятся из текста вызова и не встречаются в общем трафике. Отсюда композиция, а не выбор: вендорский слой закрывает распространённые атаки и обновляется силами вендора, доменный слой поверх него кодирует правила бизнеса и отклоняет или эскалирует вызовы, безупречные по форме.'
  id: 032-vendor-and-domain-2
