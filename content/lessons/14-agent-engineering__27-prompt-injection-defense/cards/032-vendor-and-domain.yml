- concept: доменный и вендорский слои закрывают разные классы промахов, поэтому замена одного другим оставляет непокрытую поверхность
  question: Команда написала подробный набор доменных правил (лимиты сумм, форматы идентификаторов, права ролей) и решила отключить вендорские guardrails как избыточные. Что останется непокрытым?
  explanation: 'Три последних пункта — ровно то, что покрывают доменные правила. Непокрытым остаётся общий класс: инъекции в найденном контенте и их типовые эксплойты. Слои складываются, а не заменяют друг друга — вендорский даёт базу против распространённых атак, доменный ловит вызовы, безупречные по форме, но запрещённые регламентом.'
  kind: choice
  options:
    - 'Атаки общего вида: внедрённые в найденный контент инструкции, самокопирующиеся инъекции, увод данных на внешний канал'
    - Превышение порога суммы при переводе
    - Вызов с идентификатором неверного формата
    - Действие, выполненное ролью без соответствующего права
