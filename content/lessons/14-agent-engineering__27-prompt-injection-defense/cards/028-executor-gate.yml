  fingerprint: 6471456b
- concept: отказ означает, что инструмент вообще не вызывался, а не что его результат отброшен постфактум
  question: 'Реализация исполнителя устроена так: инструмент вызывается всегда, а при отрицательном вердикте валидатора его результат просто не показывают агенту. Что не так?'
  explanation: Вызов инструмента меняет состояние мира вне агента, а не только его контекст. Единственная ветка, которой позволено трогать инструмент, — ветка после одобрения; ветка отказа обязана заканчиваться без вызова.
  kind: choice
  options:
    - 'Ничего: агент результата не видит, значит утечки нет'
    - Внешний эффект уже произошёл — письмо ушло, деньги списаны, файл удалён; скрытие результата не отменяет действия
    - Проблема только в лишних расходах на вызовы API
  correct: 1
