- concept: риск агента определяется не только тем, что он читает, но и тем, что ему разрешено сделать после чтения
  question: Два агента читают один и тот же заражённый документ. У первого есть только поиск и ответ пользователю, у второго — почта, календарь и перевод денег. Объясни, чем отличается ущерб и какой вывод из этого следует для проектирования.
  explanation: 'Формулировка «обработка найденных промптов равносильна исполнению кода на поверхности инструментов» означает ровно это: масштаб последствий задаётся тем, что лежит в реестре.'
  kind: open
  reference: 'Оба одинаково уязвимы к самому влиянию инъекции, но реализуемый ущерб разный: у первого — искажённый ответ и, возможно, подсунутая ссылка; у второго — реальные внешние действия: утечка переписки, отмена встреч, платёж. Вывод: ограничивать реестр инструментов до необходимого минимума на задачу, урезать права каждого инструмента и ставить подтверждение или валидатор на действия с необратимыми последствиями.'
