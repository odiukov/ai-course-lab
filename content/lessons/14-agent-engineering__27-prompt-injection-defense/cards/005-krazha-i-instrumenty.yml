- concept: «произвольное использование инструментов» означает любой инструмент из реестра агента в пределах его прав, а не любую операцию системы
  question: Что означает «произвольное использование инструментов» в контексте непрямой инъекции?
  explanation: «Произвольный» относится к выбору внутри реестра, а не к выходу за его пределы. Поэтому размер и мощность реестра инструментов — прямая мера ущерба от одной удачной инъекции.
  kind: choice
  options:
    - Атакующий может направлять любой инструмент, выданный агенту разработчиком, в пределах его разрешений
    - Атакующий получает возможность запускать любые программы на машине пользователя
    - Атакующий может добавлять в реестр агента новые инструменты
    - Атакующий может менять системный промпт и права доступа агента
