- concept: к какому хосту реально идёт подключение определяет разобранный hostname, а не порядок слов в строке URL
  question: К какому серверу подключится клиент по адресу `https://corp.example.net@attacker.test/data`?
  explanation: Всё, что стоит до `@` в authority-части, — это userinfo (имя пользователя и пароль). Хост — то, что после `@`. Проверка подстрокой найдёт в такой строке разрешённый домен и пропустит запрос на чужой сервер, поэтому URL сначала разбирают и сверяют именно поле hostname.
  kind: choice
  options:
    - attacker.test
    - corp.example.net
    - corp.example.net, а attacker.test — путь на нём
    - Адрес некорректен, подключения не будет
  correct: 0
  id: 016-is-url-allowed-1
  fingerprint: 8c5d0f8d
- concept: суффиксное совпадение домена требует явной границы-точки, иначе подходит любой домен, оканчивающийся теми же буквами
  question: Заполни пропуск так, чтобы разрешался сам домен и его настоящие поддомены, но не домен, у которого разрешённое имя лишь окончание строки.
  explanation: 'Без точки `endswith(d)` пропустит `notexample.net` для записи `example.net`. Точка ставит границу метки домена: подходит только то, что действительно является поддоменом, и отдельно сравнивается точное равенство самому домену.'
  kind: cloze
  template: |-
    host = urlparse(url).hostname.lower()
    allowed = any(host == d or host.endswith(___) for d in allowed_domains)
  answer: '"." + d'
  accept:
    - '"." + d'
    - '''.'' + d'
    - '"."+d'
    - f".{d}"
    - '''.''+d'
  id: 016-is-url-allowed-2
  fingerprint: ba08add8
- concept: hostname сравнивается без учёта регистра и без порта, а неподдерживаемая схема — отказ
  question: allowed_domains = {"shop.example.net"}. Какой адрес функция обязана разрешить?
  explanation: Регистр в именах хостов незначим, а порт не входит в hostname — первый адрес ведёт ровно на разрешённый хост. Второй лишь начинается с разрешённого имени, у третьего запрещённая схема, у четвёртого нет границы-точки перед `example.net`, и `myshop.example.net` — другой домен, а не поддомен записи.
  kind: choice
  options:
    - https://SHOP.EXAMPLE.NET:8443/cart
    - https://shop.example.net.mirror.test/cart
    - ftp://shop.example.net/cart
    - https://myshop.example.net/cart
  correct: 0
  id: 016-is-url-allowed-3
  fingerprint: 22edca27
