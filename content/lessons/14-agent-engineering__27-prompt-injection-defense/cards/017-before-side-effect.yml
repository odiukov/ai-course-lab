- concept: оценка безопасности стоит между сформированным вызовом инструмента и его исполнением
  question: Расставь шаги обработки одного действия агента так, чтобы проверка была защитой, а не разбором инцидента.
  explanation: 'Проверка должна стоять у самой границы вызова: раньше действие ещё не конкретно (нечего проверять), позже эффект уже наступил. Проверка после исполнения обнаруживает инцидент, но не предотвращает его.'
  kind: order
  items:
    - 'Модель формирует конкретное предложение: какой инструмент вызвать и с какими аргументами'
    - Оценщик проверяет источник команды, аргументы, назначение и связь с исходной задачей пользователя
    - Вызов инструмента исполняется и создаёт внешний эффект
    - Результат и вердикт оценщика записываются для последующего разбора
  id: 017-before-side-effect-1
  fingerprint: f392fe56
- concept: 'безопасность шага не наследуется следующим шагом: состояние и доступный контент меняются между шагами'
  question: Первые 25 шагов агента оценщик признал безопасными. Почему 26-й всё равно оценивается заново, а не пропускается по «накопленному доверию»?
  explanation: Между шагами в контекст попадает новый текст, а сам агент оказывается в новом состоянии с новыми доступными действиями. Безобидное чтение страницы способно породить следующий шаг с отправкой файла — доверие непереносимо, оценка идёт по действию, а не по истории.
  kind: choice
  options:
    - Каждый шаг приносит новое содержимое и новое состояние, поэтому вердикт по предыдущему действию ничего не говорит о следующем
    - Повторная оценка нужна только для статистики ложных срабатываний
    - Оценщик кэширует вердикт, но кэш истекает по таймеру, а не по смыслу
    - После серии безопасных шагов доверие действительно можно повышать и проверять реже
  correct: 0
  id: 017-before-side-effect-2
  fingerprint: 8a2e98b9
- concept: пооперационная оценка сверяет действие с исходной задачей пользователя, чего проверка доступа к ресурсу не делает
  question: Агент ищет билет и остаётся на разрешённом домене, но собирается вызвать инструмент выгрузки файла из хранилища. Проверка адреса пройдена. Что должна поймать пооперационная оценка?
  explanation: Слои проверяют разное. Allowlist отвечает, куда можно дотянуться; пооперационная оценка — что конкретно делается, откуда пришло намерение и относится ли оно к тому, о чём просил пользователь. Выгрузка файла в задаче про поиск билета не имеет основания, даже если адрес разрешён.
  kind: choice
  options:
    - 'Несоответствие действия исходной задаче пользователя: разрешённое назначение не делает само действие уместным'
    - Только неверный формат аргументов инструмента
    - 'Ничего: раз домен в списке, действие допустимо'
    - Только превышение лимита в 60 вызовов инструментов за сессию
  correct: 0
  id: 017-before-side-effect-3
  fingerprint: dc320bd7
