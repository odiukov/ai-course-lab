- concept: накладной расход PVE равен стоимости валидатора, умноженной на число кандидатных вызовов инструмента
  question: Один вызов основной модели стоит 50 условных единиц, вызов модели-валидатора — 2. Агент предлагает 5 кандидатных вызовов инструмента, каждый проверяется валидатором. Сколько условных единиц стоит вся работа?
  explanation: 'На каждый кандидат идёт пара «основная модель + валидатор»: 50 + 2 = 52. Пять кандидатов — 5 × 52 = 260 против 250 без защиты, накладной расход 4%. Стоимость PVE предсказуема и линейна по числу точек риска.'
  kind: numeric
  answer: 260
  tolerance: 1
  id: 024-pve-flow-1
  fingerprint: 3675ef03
- concept: валидатор оплачивается по числу предложенных кандидатов, включая отклонённых и повторные попытки, а не по числу выполненных действий
  question: Агент под PVE предложил вызов, валидатор отказал, агент предложил другой путь, и второй вызов исполнили. Сколько раз отработал валидатор и почему?
  explanation: Валидатор стоит между предложением и исполнением, поэтому видит всех кандидатов. Отклонённые попытки и повторные предложения тоже проходят проверку — счёт растёт по предложенным действиям, а не по совершённым.
  kind: choice
  options:
    - Один раз — платят только за действие, которое реально выполнилось
    - Два раза — проверяется каждый кандидат, включая отклонённый, потому что решение выносится до исполнения
    - Ни разу — после отказа агент переходит в доверенный режим
    - Три раза — отказ требует отдельной перепроверки исполнителем
  correct: 1
  id: 024-pve-flow-2
