- concept: 'набор проверок валидатора: согласие с целью пользователя, чувствительность затрагиваемой поверхности, признаки инъекции в аргументах'
  question: Что из перечисленного НЕ входит в вопросы, которые модель-валидатор задаёт про кандидатный вызов инструмента?
  explanation: 'Три вопроса валидатора закрывают три разные дыры: соответствие цели ловит расползание задачи, чувствительная поверхность — опасные инструменты, разбор аргументов — подложенный текст. Задержка и бюджет — вопрос производительности, не безопасности.'
  kind: choice
  options:
    - Согласуется ли действие с тем, что пользователь заявил как цель
    - Затрагивает ли действие чувствительную поверхность
    - Нет ли в аргументах текста, похожего на инъекцию
    - Уложится ли исполнение вызова в бюджет задержки
  correct: 3
