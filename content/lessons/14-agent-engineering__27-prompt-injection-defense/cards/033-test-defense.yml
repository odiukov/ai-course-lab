- concept: ужесточение правил одновременно снижает пропуск атак и повышает долю ложных отказов, поэтому изменение оценивают на обоих наборах сразу
  question: 'Команда ужесточила правила валидатора: теперь блокируются все атаки из набора вместо прежних 90%. Что нужно измерить, прежде чем считать изменение улучшением?'
  explanation: 'Идеальный результат по атакам достижим и вырожденным правилом «отказывать всегда», поэтому одна метрика ничего не доказывает. Строгость крутится в обе стороны: ослабление пропускает атаки, ужесточение растит ложные отказы, и каждое изменение прогоняют на обоих наборах.'
  kind: choice
  options:
    - Только процент заблокированных атак — он вырос, значит защита стала лучше
    - 'Долю отказов на наборе легитимных вызовов: ужесточение могло поднять её'
    - Среднюю задержку валидатора, остальные показатели при ужесточении не меняются
    - Размер журнала исполненных вызовов до и после изменения
  correct: 1
