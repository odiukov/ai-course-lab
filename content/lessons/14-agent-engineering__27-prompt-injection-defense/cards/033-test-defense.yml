- concept: оценка ложных отказов достоверна только на наборе, воспроизводящем разнообразие реального легитимного трафика
  question: Валидатор показал ноль отказов на наборе легитимных вызовов, но в проде пользователи жалуются на постоянные блокировки. Какой дефект набора это объясняет?
  explanation: Число ложных отказов имеет смысл только вместе с описанием набора, на котором оно получено. Узкий набор даёт оптимистичную оценку и скрывает края, на которых правила слишком широки.
  kind: open
  reference: 'Набор нерепрезентативен: в нём однотипные формулировки, один-два источника контента и узкий подмножество инструментов, тогда как реальные запросы приходят разными словами, из разных разрешённых источников и задействуют весь реестр инструментов. Метрика ложных отказов измеряет поведение защиты только на том распределении, которое ей показали, поэтому набор хорошего трафика собирают из реальных легитимных запросов и обновляют вместе с ростом продукта; иначе нулевой показатель означает лишь узость выборки, а не точность границы.'
