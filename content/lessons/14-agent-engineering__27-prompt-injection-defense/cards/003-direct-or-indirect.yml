  fingerprint: 941c280f
- concept: при прямой инъекции пользователь — атакующий, при непрямой — жертва; отсюда разные точки контроля
  question: Чем роль пользователя при непрямой инъекции отличается от его роли при прямой?
  explanation: 'Разные роли дают разные защиты: против прямой работает фильтрация пользовательского ввода и guardrails, против непрямой это бесполезно — фильтр входа диалога такую команду просто не встречает.'
  kind: choice
  options:
    - При прямой инъекции пользователь сам пытается обойти ограничения, при непрямой — он жертва, а команду вписал посторонний в контент
    - В обоих случаях пользователь атакующий, отличается лишь канал ввода
    - При непрямой инъекции пользователь всегда сообщник владельца контента
    - Роль пользователя одинакова, отличается только модель, которую он использует
  correct: 0
