- concept: фильтр пользовательского ввода не покрывает непрямую инъекцию, потому что у неё другая точка входа
  question: Почему модерация пользовательского ввода не защищает агента от непрямой инъекции? Объясни своими словами.
  explanation: Разные точки входа требуют разных механизмов. Сообщение пользователя может быть безупречным — вредным окажется то, что агент принёс сам.
  kind: open
  reference: 'Фильтр стоит на входе диалога и проверяет сообщения пользователя. Непрямая инъекция входит не там: она приезжает в результате вызова инструмента (страница, PDF, письмо, заметка в памяти) уже после того, как сообщение прошло проверку. Значит, контроль нужен на границе «результат инструмента попадает в контекст» и перед следующим вызовом инструмента.'
  id: 003-direct-or-indirect-3
  fingerprint: 0982dbd0
