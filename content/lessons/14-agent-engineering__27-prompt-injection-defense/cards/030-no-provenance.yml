- concept: гранулярность меток источника задаётся различием применяемых правил, а не бинарной шкалой доверенный/недоверенный
  question: Почему недостаточно двух меток — «доверенный» и «недоверенный» — и стоит различать хотя бы `user`, `web`, `memory`, `system`?
  explanation: Метки нужны ровно настолько подробные, насколько различаются решения, которые на них опираются. Если для веб-текста и для заметки из памяти политика одна и та же, хватит одной метки; если разная — склейка в «недоверенное» стирает нужное различие.
  kind: choice
  options:
    - 'Для читаемости логов: смысл проверок от этого не меняется'
    - 'Потому что правила у недоверенных каналов разные: содержимое веб-страницы никогда не задаёт задачу, а запись из памяти проверяется перед использованием и может влиять на план после проверки'
    - Потому что модель лучше понимает длинные метки, чем короткие
  correct: 1
