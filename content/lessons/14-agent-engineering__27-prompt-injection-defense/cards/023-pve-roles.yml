- concept: валидатор — отдельная модель, потому что контекст, уже подхвативший инъекцию, не может оценивать сам себя
  question: Почему проверку кандидатного вызова инструмента поручают отдельной небольшой модели, а не просят основную модель самой оценить своё предложение?
  explanation: 'Компрометирован именно контекст, поэтому самооценка компрометирована вместе с ним: модель уверенно обоснует, почему её предложение разумно. Валидатор запускается на чистом контексте — только цель пользователя и кандидат.'
  kind: choice
  options:
    - Основная модель слишком дорогая, чтобы выдавать два ответа подряд
    - Основная модель уже прочитала недоверенный контент, и та же инъекция, что породила действие, влияет и на его оценку
    - Основная модель не имеет доступа к аргументам собственного вызова
  correct: 1
  id: 023-pve-roles-1
  fingerprint: e2499a53
- concept: PVE разводит право предлагать действие и право его разрешить и выполнить по разным компонентам
  question: В схеме Prompt-Validator-Executor основная модель предложила вызов инструмента с конкретными аргументами. Чем это предложение отличается от команды?
  explanation: 'Смысл схемы в разделении полномочий: агент предлагает, валидатор разрешает, исполнитель делает. Если один компонент совмещает предложение и исполнение, слово «проверено» ничего не гарантирует.'
  kind: choice
  options:
    - 'Ничем: исполнитель получает предложение и выполняет его, а валидатор пишет отчёт параллельно'
    - 'Это кандидат: до вердикта валидатора исполнитель его не получает, и при отказе действие не доходит до выполнения'
    - Предложение отличается только форматом — исполнитель сам решает, разбирать его или нет
  correct: 1
  id: 023-pve-roles-2
  fingerprint: 229d94e0
- concept: отказ валидатора возвращается основной модели как обратная связь, а не завершает задачу
  question: Валидатор отклонил кандидатный вызов инструмента. Объясни своими словами, почему отказ передают основной модели сообщением вида «в этом действии отказано, попробуй другой путь», а не просто обрывают выполнение задачи.
  explanation: 'Валидатор — фильтр действий, а не выключатель агента. Продуктовая пригодность защиты важна не меньше строгости: защиту, ломающую обычные сценарии, отключают.'
  kind: open
  reference: 'Отказ относится к конкретному действию с конкретными аргументами, а не к задаче пользователя. Основная модель получает сигнал и может достичь цели другим способом — иным инструментом, иными аргументами или запросом подтверждения у человека. Обрыв задачи на каждом отказе сделал бы агента бесполезным и подтолкнул бы команду отключить валидатор; кроме того, обратная связь оставляет след в трассе: видно, какие пути были отклонены.'
  id: 023-pve-roles-3
  fingerprint: 4a156525
