- concept: 'цепочка непрямой инъекции: получение контента, попадание в контекст, формирование намерения, вызов инструмента'
  question: Расставь звенья непрямой инъекции по порядку — от текста атакующего до последствия во внешнем мире.
  explanation: Каждое звено — отдельная точка контроля. Можно ограничить, какой контент вообще втягивается, можно пометить его происхождение в контексте, можно проверять сам вызов перед исполнением.
  kind: order
  items:
    - Атакующий размещает инструкцию в контенте, который агент когда-нибудь заберёт (страница, документ, письмо, заметка)
    - Агент вызывает инструмент получения контента и втягивает этот текст в контекст модели рядом с задачей пользователя
    - Модель трактует чужой текст как основание для действия и формирует вызов инструмента с параметрами
    - Инструмент выполняет полученную команду и вызывает эффект во внешнем мире
  id: 002-attack-chain-1
  fingerprint: 34ad9c86
- concept: инструмент исполняет уже оформленный вызов и не видит происхождения породившего его текста
  question: Почему нельзя рассчитывать, что инструмент (перевод денег, отправка письма, запись в календарь) сам отклонит вызов, порождённый инъекцией?
  explanation: 'На последнем переходе контекст происхождения теряется: до инструмента доезжают имя операции и аргументы. Значит, проверка происхождения должна стоять до вызова — на уровне валидатора или политики, а не внутри самого инструмента.'
  kind: choice
  options:
    - Инструмент получает только оформленные параметры вызова и не знает, из какого текста они возникли
    - Инструменты не имеют прав на опасные операции, поэтому проверка не нужна
    - Инструмент видит весь контекст модели, но не умеет читать HTML
    - Инструмент отклонит вызов, если он не совпадает с последним сообщением пользователя
  correct: 0
  id: 002-attack-chain-2
  fingerprint: 1cf7bf36
- concept: тяжесть инъекции определяется тем, где кончается текст и начинается действие с внешними последствиями
  question: Агент прочитал страницу со спрятанной инструкцией, но у него нет ни одного инструмента с внешними эффектами — только генерация ответа пользователю. Как меняется риск?
  explanation: 'Переход «намерение — вызов инструмента» и даёт последствия во внешнем мире. Без такого перехода остаётся манипуляция содержанием ответа: тоже вред (дезинформация, подсунутая ссылка, семя для червя), но без прямого действия от имени пользователя.'
  kind: choice
  options:
    - 'Риск падает до искажения ответа: инъекция может врать пользователю, но не может сама совершить действие наружу'
    - 'Риск исчезает полностью: без инструментов инъекция технически невозможна'
    - 'Риск не меняется: модель всё равно выполнит команду внутри себя'
    - 'Риск растёт: без инструментов модель охотнее слушается найденного текста'
  correct: 0
  id: 002-attack-chain-3
  fingerprint: b3a5b14f
