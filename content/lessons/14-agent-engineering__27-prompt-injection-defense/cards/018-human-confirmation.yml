- concept: подтверждение привязано к конкретному действию и его параметрам, а не выдаётся один раз на всю сессию
  question: 'В начале работы пользователь написал: «делай всё, что нужно, я тебе доверяю». Что это даёт агенту в модели с человеком в контуре?'
  explanation: 'Общая фраза не содержит того, что подтверждают: конкретного действия и его параметров. Пользователь не может согласиться на списание, о котором ещё не знает, поэтому подтверждение выдаётся на один показанный ему вызов, а не на класс будущих действий.'
  kind: choice
  options:
    - 'Не даёт права на необратимые действия: каждое такое действие подтверждается отдельно, с показом объекта, суммы и получателя'
    - Даёт бессрочное право на любые действия до конца сессии
    - Даёт право на действия до определённого порога, например до 500 евро, дальше — подтверждение
    - Даёт право на любые действия, если оценщик признал их безопасными
  correct: 0
  id: 018-human-confirmation-2
  fingerprint: a0c18ea3
- concept: критерий вынесения решения человеку — необратимость эффекта, действие от имени пользователя или получение чувствительного доступа
  question: По какому признаку действие относят к требующим подтверждения человеком?
  explanation: 'Отбор идёт по цене ошибки, а не по стоимости вычислений: подготовку можно переделать, а ушедший платёж, отправленное письмо и открытую сессию — нет. Действия от имени пользователя добавляют и вторую проблему — атрибуцию последствий человеку.'
  kind: choice
  options:
    - 'Оно необратимо, совершается от имени пользователя или открывает чувствительный доступ: покупка, отправка сообщения, вход в аккаунт, прохождение CAPTCHA'
    - Оно дорого по токенам и потому требует отдельного решения о расходах
    - Оно содержит длинный текст, который человеку полезно вычитать
    - Оно использует инструмент, добавленный в агента недавно
