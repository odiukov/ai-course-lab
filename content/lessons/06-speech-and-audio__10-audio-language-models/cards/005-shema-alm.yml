- concept: последовательность аудиовекторов сохраняет временной порядок звуковых событий
  question: Почему аудиоэнкодер языковой аудиомодели обычно возвращает последовательность векторов по времени, а не один общий вектор для всей записи?
  explanation: Каждый вектор описывает отдельный временной участок записи. Их порядок позволяет LLM рассуждать о последовательности речи и других звуков, а не только определять, что они где-то присутствовали.
  kind: open
  reference: Последовательность сохраняет локальные признаки и временной порядок событий. Благодаря этому модель может различать, какой звук появился раньше, что происходило между событиями и что последовало за ними; один общий вектор сильно затруднил бы такие выводы.
  id: 005-shema-alm-2
  fingerprint: 5d548573
