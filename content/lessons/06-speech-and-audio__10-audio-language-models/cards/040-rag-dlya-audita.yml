- concept: аудит соблюдения требований требует сопоставления фактов из аудио с актуальными критериями из RAG
  question: Система точно установила по записи, что оператор не предложил клиенту передать жалобу руководителю. Как определить, является ли это нарушением?
  explanation: 'Аудиомодель устанавливает, что произошло в разговоре. Для вывода о нарушении нужен актуальный нормативный критерий: обязан ли оператор предложить эскалацию в такой ситуации. RAG извлекает этот критерий из базы регламентов.'
  kind: choice
  options:
    - Оценить вежливость и уверенность речи оператора
    - Сопоставить установленный факт с актуальным регламентом, найденным через RAG
    - Повторно обработать запись более крупной аудиомоделью
    - Составить подробный пересказ всего разговора
  correct: 1
  id: 040-rag-dlya-audita-1
  fingerprint: 03e52364
- concept: вынесение регламентов в базу RAG позволяет обновлять правила аудита без переобучения модели
  question: Объясни своими словами, почему при изменении регламента колл-центра обычно достаточно обновить документы в базе RAG, а не переобучать аудиоязыковую модель.
  explanation: RAG отделяет изменяемые правила организации от способностей модели анализировать аудио и текст. Новый регламент становится доступен системе после обновления поисковой базы, тогда как веса модели менять не требуется.
  kind: open
  reference: Правила соответствия хранятся вне параметров модели и добавляются в запрос после поиска по базе. Поэтому модель продолжает извлекать факты из аудио, но сравнивает их уже с обновлёнными требованиями.
  id: 040-rag-dlya-audita-2
  fingerprint: 6e310c1e
