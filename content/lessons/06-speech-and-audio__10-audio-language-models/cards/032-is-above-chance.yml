- concept: равенство случайному уровню не является его превышением
  question: Почему при реализации is_above_chance следует использовать оператор >, а не >=?
  explanation: При четырёх вариантах ровно 25% соответствует случайному угадыванию. Такой результат находится на пороге, а не выше него, поэтому сравнение должно быть строгим.
  kind: open
  reference: Оператор >= признал бы результат, точно равный уровню случайного угадывания, результатом выше случайного. Превышение должно быть строгим, поэтому при равенстве функция возвращает False.
