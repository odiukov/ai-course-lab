- concept: LoRA снижает стоимость инструкционного дообучения LLM за счёт небольших обучаемых добавок
  question: Нужно дообучить аудиоязыковую модель отвечать на вопросы по записям, но полный файнтюнинг LLM слишком дорог. Почему для этой задачи подходит LoRA?
  explanation: Инструкционное дообучение можно проводить либо для всей LLM, либо через LoRA. LoRA изменяет поведение модели с помощью небольшого числа обучаемых добавок, поэтому требует заметно меньше памяти и вычислений, чем обновление всех весов языковой модели.
  kind: choice
  options:
    - Она обучает небольшие добавочные матрицы, сохраняя основные веса LLM замороженными
    - Она заменяет аудиоэнкодер готовой системой распознавания речи
    - Она добавляет речевой декодер для озвучивания ответов
    - Она преобразует аудиопризнаки в токенные эмбеддинги без инструкционного обучения
  correct: 0
  id: 019-tri-stadii-1
  fingerprint: e1a52dc5
- concept: для голосового ответа LALM нужен отдельный речевой декодер
  question: Аудиоязыковая модель уже принимает речь и генерирует текст. Какое изменение требуется, чтобы она могла отвечать синтезированной речью?
  explanation: Аудиоэнкодер обеспечивает восприятие звука, а LLM формирует содержимое ответа. Для генерации звукового сигнала нужен отдельный речевой декодер; поэтому стадия обучения голосовому выходу необязательна для моделей, отвечающих только текстом.
  kind: choice
  options:
    - Заменить projector текстовым токенизатором
    - Добавить речевой декодер, преобразующий выход модели в голос
    - Удалить LLM и передавать признаки энкодера напрямую пользователю
    - Обучать аудиоэнкодер только на текстовых подписях
  correct: 1
  id: 019-tri-stadii-2
  fingerprint: 765f21b1
