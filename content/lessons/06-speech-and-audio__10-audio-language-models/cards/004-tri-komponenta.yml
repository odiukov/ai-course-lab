- concept: projector согласует представления аудиоэнкодера с пространством токенных эмбеддингов LLM
  question: В LALM аудиоэнкодер выдаёт скрытые представления, формат которых несовместим со входными эмбеддингами языковой модели. Какую функцию должен выполнять projector?
  explanation: Projector — линейный слой или MLP, который согласует размерность и формат признаков аудиоэнкодера с эмбеддингами LLM. Благодаря этому языковая модель может обрабатывать аудио- и текстовые представления в одной последовательности.
  kind: choice
  options:
    - Преобразовывать аудиопризнаки в пространство эмбеддингов LLM
    - Генерировать звуковую волну из ответа модели
    - Обновлять веса LLM во время каждого запроса
    - Удалять текстовые токены из входной последовательности
  correct: 0
  id: 004-tri-komponenta-1
  fingerprint: 35066b6d
- concept: на начальном этапе обучения LALM замораживают аудиоэнкодер и LLM, обучая только projector
  question: Объясни своими словами, какие части LALM обычно замораживают на начальном этапе выравнивания, какую часть обучают и зачем.
  explanation: Начальное обучение должно прежде всего состыковать уже готовые аудио- и языковые компоненты. Поэтому меняют небольшой projector, а веса энкодера и LLM сохраняют фиксированными.
  kind: open
  reference: Аудиоэнкодер и LLM замораживают, а обучают только projector на задачах распознавания речи и описания аудио. Projector учится переводить аудиопризнаки в понятное LLM пространство эмбеддингов, не требуя дорогого обновления всех параметров модели.
  id: 004-tri-komponenta-2
  fingerprint: d9c0b535
- concept: аудиосигнал проходит через энкодер и projector перед обработкой языковой моделью
  question: Расположи операции в порядке прохождения аудиосигнала через базовую LALM.
  explanation: Энкодер сначала извлекает признаки звука, projector согласует их с входным пространством языковой модели, после чего LLM использует полученные представления для генерации ответа.
  kind: order
  items:
    - Аудиоэнкодер превращает сигнал в последовательность признаков
    - Projector переводит признаки в пространство токенных эмбеддингов LLM
    - LLM обрабатывает аудио- и текстовые представления и генерирует текст
  id: 004-tri-komponenta-3
  fingerprint: 907d2193
