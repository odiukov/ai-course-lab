- concept: смысловая нарезка аудиозаписи выделяет главы по смене тем, а не только по смене говорящих
  question: Объясни своими словами, чем смысловая нарезка подкаста на главы отличается от разметки записи по говорящим.
  explanation: Смена говорящего не обязательно означает начало новой темы, а одна тема может обсуждаться несколькими участниками. Поэтому для глав требуется понимание содержания записи, а не только идентификация голосов.
  kind: open
  reference: Разметка по говорящим отмечает, кто и когда говорит, а смысловая нарезка определяет тематические границы и объединяет фрагменты записи в содержательные главы.
