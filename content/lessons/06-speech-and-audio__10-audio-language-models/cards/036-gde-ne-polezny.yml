- concept: для анализа длинной записи диаризацию выполняют до обработки коротких фрагментов аудиоязыковой моделью
  question: Расположите этапы обработки длинного совещания так, чтобы снизить риск приписать реплики не тем участникам.
  explanation: На длинных разговорах LALM хуже сохраняет связь между содержанием реплики и голосом. Предварительная диаризация фиксирует говорящих до анализа коротких фрагментов; при обратном порядке модель может создать убедительное резюме с неверной атрибуцией.
  kind: order
  items:
    - Выполнить диаризацию и определить говорящего для каждой реплики
    - Сформировать короткие фрагменты с сохранёнными метками говорящих
    - Передать фрагменты аудиоязыковой модели для анализа
    - Объединить результаты, не теряя метки говорящих
  id: 036-gde-ne-polezny-1
  fingerprint: 961e51ce
- concept: офлайновый пакетный инференс не обеспечивает рассуждение по аудиопотоку в реальном времени
  question: Система принимает запись только после её завершения, а затем целиком передаёт её LALM. Почему такую систему нельзя считать помощником, рассуждающим по ходу живого разговора?
  explanation: Большинство LALM рассчитано на готовый аудиофайл и возвращает результат после пакетной обработки. Это отличается от потокового режима, где модель должна обрабатывать новые фрагменты и отвечать во время разговора.
  kind: open
  reference: При офлайновом пакетном инференсе модель начинает обработку лишь после получения готовой записи. Для работы в реальном времени нужны потоковый приём аудио, постепенное обновление контекста и выдача ответа до завершения разговора.
  id: 036-gde-ne-polezny-2
  fingerprint: 6271de3e
