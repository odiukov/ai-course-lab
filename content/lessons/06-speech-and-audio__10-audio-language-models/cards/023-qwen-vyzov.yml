- concept: поле type задаёт способ интерпретации каждого элемента мультимодального content
  question: Какой формат `content` позволяет процессору однозначно разобрать пользовательский запрос, содержащий звук и текстовую инструкцию?
  explanation: 'Поле `type` служит явным признаком модальности. По нему процессор понимает, как обработать полезную нагрузку элемента: значение `audio` как звуковой сигнал, а значение `text` как текст.'
  kind: choice
  options:
    - Одна строка, в которой путь к аудиофайлу и инструкция разделены пробелом
    - Список словарей, где каждый словарь содержит `type` и соответствующую этому типу полезную нагрузку
    - Кортеж из роли пользователя и необработанного аудиотензора
    - Несколько независимых вызовов модели — по одному для каждой модальности
  correct: 1
  id: 023-qwen-vyzov-1
  fingerprint: fe19affc
- concept: мультимодальный processor преобразует структурированные сообщения в тензорные входы для генерации
  question: Почему в `model.generate` передают распакованный результат `processor.apply_chat_template`, а не исходный список `messages`? Объясните границу ответственности этих компонентов.
  explanation: '`apply_chat_template` связывает удобный формат сообщения с низкоуровневым интерфейсом модели. Оператор `**` передаёт созданные процессором именованные тензоры как аргументы `generate`.'
  kind: open
  reference: '`messages` — это удобное прикладное представление диалога с типизированными фрагментами. Процессор разбирает эту структуру, применяет шаблон чата и подготавливает модельные тензоры. `model.generate` уже принимает эти подготовленные входы и генерирует продолжение, поэтому вручную собирать мультимодальную последовательность не требуется.'
  id: 023-qwen-vyzov-2
  fingerprint: 1baadf12
