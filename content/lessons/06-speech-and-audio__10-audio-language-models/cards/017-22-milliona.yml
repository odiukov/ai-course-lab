- concept: небольшой адаптер создаёт мультимодальную систему за счёт повторного использования возможностей предобученных компонентов
  question: В аудио-языковой системе соединены предобученный аудиоэнкодер, предобученная LLM и небольшой обучаемый адаптер. Почему такой адаптер может обеспечить работу с аудио, несмотря на малое число собственных параметров?
  explanation: 'Основные способности уже распределены между крупными предобученными компонентами: энкодер извлекает акустические признаки, а LLM работает со смыслом и формирует ответ. Поэтому 22 млн параметров projector''а не заменяют эти модели, а позволяют использовать их совместно.'
  kind: choice
  options:
    - Он заново обучается распознавать звуки и одновременно осваивает все языковые знания
    - Он использует уже освоенные способности энкодера и LLM, обучаясь связывать результаты их работы
    - Любая нейросеть получает новые способности сразу после добавления нескольких линейных слоёв
    - Все знания аудиоэнкодера автоматически копируются в параметры адаптера
