- concept: общая точность вычисляется как микроусреднение по всем примерам
  question: После оценки модели доступны счётчики hits и seen по категориям. Какая формула правильно вычисляет общую точность при разном числе примеров в категориях?
  explanation: Нужно сложить все правильные ответы и разделить на общее число примеров. Среднее категориальных точностей придаёт одинаковый вес категориям разного размера и поэтому может исказить overall.
  kind: choice
  options:
    - sum(hits[c] / seen[c] for c in seen) / len(seen)
    - sum(hits.values()) / sum(seen.values())
    - sum(hits.values()) / len(seen)
    - max(hits[c] / seen[c] for c in seen)
  correct: 1
  id: 030-accuracy-by-category-1
  fingerprint: aeeb1c23
- concept: категории без примеров не включаются в результат
  question: Функция строит словарь точностей только по фактически полученным результатам. Как поступить с поддерживаемой категорией, которая ни разу не встретилась во входных данных?
  explanation: Без примеров у категории нет знаменателя, поэтому её точность не определена. Нулевое значение ошибочно выглядело бы как измеренный провал модели, а вычисление дроби привело бы к делению на ноль.
  kind: choice
  options:
    - Добавить её с нулевой точностью
    - Добавить её со значением точности другой категории
    - Не добавлять её в словарь
    - Считать её полностью правильно распознанной
  correct: 2
  id: 030-accuracy-by-category-2
  fingerprint: bd7fd1ce
- concept: сортировка категорий обеспечивает детерминированный порядок результата
  question: Заполни пропуск так, чтобы категории добавлялись в словарь в предсказуемом порядке.
  explanation: sorted(seen) возвращает ключи категорий в стабильном отсортированном порядке. Благодаря этому результаты разных прогонов удобно сравнивать построчно.
  kind: cloze
  template: 'result = {category: hits[category] / seen[category] for category in ___(seen)}'
  answer: sorted
  accept:
    - sorted
  id: 030-accuracy-by-category-3
  fingerprint: e749ad30
