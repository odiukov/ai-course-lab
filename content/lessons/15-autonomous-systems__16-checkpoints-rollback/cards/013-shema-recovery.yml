- concept: последовательность событий от остановки воркера до продолжения workflow другим воркером
  question: Воркер перестал отвечать посреди выполнения запуска. Расставь события механизма lease recovery в порядке, в котором они происходят.
  explanation: 'Ни один шаг нельзя пропустить или переставить: без истечения лиза захват незаконен, без захвата нет владельца, без чтения чекпоинта нет опоры, а без решения workflow восстановленное состояние остаётся просто данными. Восстановление отдаёт точку продолжения, а не команду что-либо выполнить.'
  kind: order
  items:
    - воркер перестаёт продлевать лиз на запуск
    - срок лиза истекает, запуск снова доступен для захвата
    - свободный воркер захватывает лиз на этот запуск
    - новый владелец читает из журнала последний чекпоинт запуска
    - снимок из чекпоинта материализуется как рабочее состояние
    - логика workflow выбирает следующее действие от восстановленной границы
  id: 013-shema-recovery-1
  fingerprint: b5af546d
- concept: плановое выключение воркера при деплое обрабатывается тем же механизмом, что и аварийное падение
  question: 'Идёт постепенный деплой: инстансы воркеров по очереди выключаются и поднимаются в новой версии. Что происходит с запусками, которые в этот момент были в полёте на выключаемом инстансе?'
  explanation: 'Лиз выражает только владение запуском и истекает, если его перестали продлевать — причина остановки продлений роли не играет. Поэтому механизм, придуманный для падений, бесплатно даёт переживаемость постепенных деплоев: работа в полёте подхватывается другим воркером.'
  kind: choice
  options:
    - Запуски продолжает другой воркер от последнего чекпоинта — для системы плановое выключение неотличимо от падения
    - Запуски приходится стартовать заново с самого начала, потому что деплой сбрасывает журнал чекпоинтов
    - Деплой блокируется до завершения всех активных запусков, иначе работа теряется
    - Запуски помечаются завершёнными, поскольку воркер вышел штатно, а не аварийно
  correct: 0
  id: 013-shema-recovery-2
  fingerprint: 9ef6ca13
- concept: прогресс, существовавший только в памяти процесса, исчезает вместе с ним; наблюдаемо лишь то, что попало в журнал
  question: Воркер выполнил часть перехода и обновил свои структуры в памяти, но чекпоинт записать не успел и упал. Что видит воркер, подхвативший запуск?
  explanation: Память процесса не переживает процесс. Новый воркер наследует владение запуском, а не адресное пространство упавшего, поэтому его единственный источник — журнал. Всё, что не пересекло границу записи, для системы просто не существовало.
  kind: choice
  options:
    - Состояние из последнего записанного чекпоинта; промежуточный прогресс упавшего процесса недоступен
    - Состояние на момент падения — среда восстанавливает память процесса вместе с лизом
    - Пустое состояние, так как незавершённый переход обнуляет предыдущие чекпоинты
    - Состояние на середине перехода, помеченное как частично применённое
  correct: 0
  id: 013-shema-recovery-3
  fingerprint: a90228ab
