- concept: условие успешного захвата — лиза нет или его срок истёк; действующий чужой лиз оставляет запись нетронутой
  question: Воркер вызывает захват лиза на запуск, у которого уже есть владелец, а дедлайн лиза — в будущем. Каким должен быть результат?
  explanation: 'Запись разрешена ровно в двух случаях: лиза нет или его срок уже прошёл. Живой чужой лиз означает, что запуск ведёт другой исполнитель, и вытеснение дало бы двух воркеров на одном запуске — то, ради чего лиз и заведён. Ожидание внутри захвата тоже недопустимо: функция обязана вернуть отказ и отпустить вызывающего.'
  kind: choice
  options:
    - Захват неуспешен, запись владельца и дедлайн остаются прежними
    - 'Захват успешен: новый воркер вытесняет прежнего, раз он обратился позже'
    - Захват успешен, но дедлайн сохраняется от прежнего владельца
    - Операция ждёт истечения чужого лиза и затем записывает нового владельца
  correct: 0
  id: 018-claim-lease-1
  fingerprint: ed6be9f1
- concept: успешный захват записывает и нового владельца, и новый срок лиза
  question: Захват лиза удался. Что записывается в запись запуска?
  explanation: 'Владелец без свежего дедлайна оставляет запуск в состоянии «занят по уже истёкшему сроку»: любой следующий воркер тут же сочтёт лиз просроченным и заберёт запуск. Дедлайн без владельца не даёт понять, кого продлевать. Обе величины имеют смысл только вместе и записываются одной операцией.'
  kind: choice
  options:
    - Идентификатор нового владельца вместе с новым временем окончания лиза
    - Только идентификатор нового владельца — дедлайн выставит первое продление
    - Только новый дедлайн; владелец определяется по журналу чекпоинтов
    - Идентификатор нового владельца и отметка о числе предыдущих захватов
  correct: 0
