- concept: сокращение зазора между эффектом и записью статуса уменьшает частоту дублей, но не устраняет класс отказа — нужен другой протокол записи, а не оптимизация
  question: 'Команда предлагает лечить double-execute так: ускорить сохранение статуса после внешнего вызова, чтобы окно уязвимости стало как можно короче. Объясни своими словами, почему это не решение.'
  explanation: 'Оптимизация превращает системную ошибку в редкую системную ошибку. Правильный критерий: после любого падения состояние должно допускать однозначную процедуру доследования, а не быть просто маловероятным.'
  kind: open
  reference: 'Две операции — внешний вызов и запись его результата — принципиально не атомарны, поэтому окно между ними нельзя обнулить, только сжать. Ускорение снижает частоту попаданий, но оставляет тот же класс отказа: рано или поздно процесс упадёт внутри окна и останется состояние «одобрено, но не записано», из которого нельзя отличить выполненный эффект от невыполненного. Лечится это сменой протокола (запись намерения до вызова, ключ идемпотентности, проверка после действия), а не оптимизацией времени.'
