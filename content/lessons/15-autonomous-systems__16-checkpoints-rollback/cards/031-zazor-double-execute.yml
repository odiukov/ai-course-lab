- concept: 'анатомия инцидента double-execute: дубль порождает возобновление по неполной записи, а не отказ внешнего сервиса'
  question: Расставь события инцидента double-execute в порядке их наступления.
  explanation: 'Ни на одном шаге внешний сервис не ошибся: он честно выполнил оба запроса. Дубль создало возобновление, которое приняло неполную запись за доказательство того, что эффекта не было.'
  kind: order
  items:
    - Действие одобрено, для него выделен ключ идемпотентности
    - Внешний вызов выполняется, побочный эффект наступает, сервис отвечает успехом
    - Процесс падает до того, как статус «выполнено» записан
    - Возобновление читает состояние «одобрено, но не выполнено»
    - Действие выполняется повторно, побочный эффект наступает второй раз
