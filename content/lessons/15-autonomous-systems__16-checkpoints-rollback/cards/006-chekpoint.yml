- concept: checkpoint связывает snapshot с конкретным переходом workflow (откуда и куда), snapshot фиксирует только содержимое
  question: Чем checkpoint отличается от snapshot?
  explanation: Snapshot отвечает на вопрос «что сохранено», checkpoint — «результатом какого перехода это стало». Без привязки к переходу копия данных не становится точкой, которой можно доверять при восстановлении.
  kind: choice
  options:
    - Checkpoint хранит больше полей состояния, чем snapshot
    - 'Checkpoint связывает снимок с конкретным переходом workflow: из какого именованного состояния в какое'
    - Checkpoint хранится в памяти, а snapshot — на диске
    - Разницы нет, это два названия одной сущности
  correct: 1
  id: 006-chekpoint-1
  fingerprint: 5b7456f4
- concept: 'переход нельзя вывести из содержимого снимка: одинаковый статус встречается в разных местах процесса, а данные меняются до завершения шага'
  question: Почему по содержимому снимка нельзя надёжно определить, какой переход workflow он завершает?
  explanation: Именно поэтому в продакшене сохраняют не голые копии данных, а чекпоинты с явно указанным переходом.
  kind: open
  reference: 'Во-первых, одно и то же именованное состояние (статус) может встречаться в нескольких местах процесса — например, при ретраях или в разных ветках графа, и по одному лишь статусу непонятно, какой из переходов имелся в виду. Во-вторых, рабочие данные могли начать меняться до завершения шага, поэтому содержимое снимка не обязано однозначно соответствовать границе перехода. Явная привязка «из состояния A в состояние B» убирает догадки: восстановление опирается на зафиксированную границу, а не выводит её из полей.'
  id: 006-chekpoint-2
  fingerprint: 200b3785
