- concept: нарушенное предусловие при возобновлении — это законный исход workflow (отказ, эскалация, новое одобрение), а не сбой, лечащийся ретраем
  question: 'Возобновлённый workflow видит: ключ идемпотентности свободен, но одобренное предусловие больше не выполняется. Как правильно поступить?'
  explanation: Это не техническая ошибка, а изменившееся состояние мира. Ретрай ждёт исчезнувшего разрешения вслепую; корректно зафиксировать исход и вернуть решение туда, где действие одобряли.
  kind: choice
  options:
    - Повторять попытку с задержкой, пока предусловие снова не выполнится
    - Выполнить действие, раз повтором оно не является
    - 'Не выполнять действие и перевести запуск в явный исход: отказ, эскалацию или повторное одобрение'
