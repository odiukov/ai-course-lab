- concept: каждый механизм безопасного шага закрывает свой отказ, и выпадение одного даёт конкретную предсказуемую дыру
  question: Шаг создаёт чекпоинт и умеет откатываться, а независимую проверку целевого состояния после вызова не делает. Какой отказ остаётся неприкрытым?
  explanation: Готовый механизм отката бесполезен без того, что его включает. Недопустимое действие ловит предусловие, повтор — ключ идемпотентности, а расхождение ответа и фактического состояния виден только независимой постпроверкой.
  kind: choice
  options:
    - Шаг повторно выполнит действие при перезапуске воркера
    - Шаг примет успешный ответ вызова за завершённый переход и зафиксирует его, а откат не запустится, потому что нечему подать сигнал о расхождении
    - Шаг не сможет создать чекпоинт после успешного перехода
    - Шаг выполнит действие, недопустимое по бизнес-правилам
  correct: 1
