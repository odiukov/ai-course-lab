- concept: 'проигравший в захвате обязан полностью отступить: отказ — конечный результат, а не повод продолжать работу'
  question: 'Воркер попытался захватить запуск, но условная запись вернула отказ: лиз уже принадлежит другому. Как он должен поступить?'
  explanation: 'Атомарный захват имеет смысл только если проигравший действительно отступает. Иначе двойное выполнение возвращается через чёрный ход: владелец один, а работу делают двое. Перезапись чужого действующего лиза ломает ровно ту гарантию, ради которой лиз существует.'
  kind: choice
  options:
    - 'Не выполнять по этому запуску ничего: ни поднимать состояние, ни продолжать workflow, ни делать его внешние вызовы'
    - Восстановить состояние из журнала и продолжить, но не менять запись запуска
    - Немедленно повторить попытку захвата, перезаписав чужого владельца
  correct: 0
