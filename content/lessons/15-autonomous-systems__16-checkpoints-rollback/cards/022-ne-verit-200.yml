- concept: 'проверка перед действием и проверка после действия отвечают на разные вопросы: допустимость эффекта против его фактического наступления'
  question: Чем постпроверка отличается от проверки предусловия?
  explanation: 'Это две разные проверки на разных концах действия: одна разрешает эффект, другая подтверждает его наступление. Провал первой запрещает выполнять действие, провал второй означает заведомо плохое состояние и включает откат.'
  kind: choice
  options:
