- concept: 'механизмы расхождения успешного ответа и фактического эффекта: подтверждение до записи, частичный сбой после приёма'
  question: 'Своими словами: как получается, что сервис ответил успехом, а нужный побочный эффект не наступил?'
  explanation: 'Между «запрос принят» и «состояние изменено» лежит вся внутренняя работа сервиса, которая может оборваться. Отсюда правило: проверять наблюдаемый результат, а не статус ответа.'
  kind: open
  reference: Успех может вернуться раньше фактического изменения (сервис подтверждает приём или ставит работу в очередь), внутренняя запись может не сохраниться, а последующая операция в цепочке — упасть уже после отправки ответа. Ответ фиксирует границу обмена, а не финальное состояние ресурса, поэтому подтверждением служит только перечитанное целевое состояние.
