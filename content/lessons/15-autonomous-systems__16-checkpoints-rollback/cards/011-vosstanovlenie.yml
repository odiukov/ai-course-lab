- concept: восстановление состояния — операция чтения без внешних побочных эффектов; выполнение действия отделено от возврата данных
  question: Чекпоинт был записан сразу после того, как workflow сформировал и отправил клиенту счёт. Новый воркер восстанавливается из этого чекпоинта. Что происходит в момент восстановления?
  explanation: 'Восстановление читает снимок и кладёт его содержимое обратно в память: идентификаторы, вычисленные суммы, отметку достигнутого перехода. Если бы оно заодно повторяло сохранённые действия, каждый перезапуск после сбоя множил бы счета и уведомления.'
  kind: choice
  options:
    - Счёт формируется и отправляется повторно — восстановление воспроизводит сохранённый шаг
    - В рабочее состояние возвращаются сохранённые данные, никакой внешний вызов не выполняется
    - Внешние вызовы отменяются, а состояние откатывается к началу запуска
    - Ничего не происходит, пока workflow не подтвердит отправку счёта
  correct: 1
  id: 011-vosstanovlenie-1
  fingerprint: e7a8e120
- concept: восстановление отвечает на вопрос «откуда продолжать», а решение «что делать дальше» принимает логика workflow
  question: Воркер восстановился из чекпоинта. Что система знает сразу после этого и что ей ещё предстоит решить?
  explanation: 'Это граница ответственности: восстановление — команда «верни мне сохранённую точку», а не «повтори прошлое». Смешение этих ролей и приводит к тому, что при каждом подхвате запуска дублируются внешние вызовы.'
  kind: open
  reference: 'Знает: содержимое сохранённого состояния (идентификаторы, промежуточные вычисленные значения) и переход, на котором запуск был зафиксирован, — то есть точку в графе, откуда продолжать. Не знает и должна решить дальше: какое действие выполнять следующим. Выбор следующего шага делает логика workflow, получив восстановленные данные; сама операция восстановления никаких переходов не инициирует и ходом запуска не управляет.'
  id: 011-vosstanovlenie-2
  fingerprint: 04ecdb6d
