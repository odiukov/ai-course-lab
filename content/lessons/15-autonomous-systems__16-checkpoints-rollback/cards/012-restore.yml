- concept: 'восстановление собирается из готовых частей: отбор записи делегируется поиску, а само восстановление лишь материализует состояние'
  question: Расставь шаги реализации восстановления по чекпоинту в правильном порядке.
  explanation: Восстановление не перебирает журнал само — это уже работа поиска, и дублирование логики отбора приводит к двум расходящимся правилам выбора записи. Проверка на отсутствие идёт до обращения к содержимому, иначе копирование упадёт на пустом результате.
  kind: order
  items:
    - Передать идентификаторы запуска и нужного перехода в функцию поиска чекпоинта
    - Проверить, вернула ли она запись или обозначение отсутствия
    - Из найденной записи сделать независимую копию сохранённого состояния
    - Вернуть эту копию как рабочее состояние воркера
  id: 012-restore-1
  fingerprint: e7dcdb4e
- concept: 'восстановление отдаёт независимую копию: последующие изменения нового воркера не должны затрагивать сохранённую запись'
  question: Восстановление возвращает ссылку на данные, лежащие внутри найденного чекпоинта. Воркер продолжает работу и меняет полученное состояние. Что произойдёт при следующем восстановлении из того же чекпоинта?
  explanation: Общая ссылка означает, что рабочее состояние и сохранённая запись — один объект. Правки воркера задним числом переписывают точку возврата, и повторное восстановление даёт смесь сохранённого и уже наработанного — состояние, которого не было ни в один момент времени.
  kind: choice
  options:
    - Вернётся исходное сохранённое состояние — чекпоинт защищён от изменений
    - Вернётся состояние, в которое уже попали правки нового воркера
    - Восстановление завершится ошибкой, потому что запись занята
    - 'Вернётся пустое состояние: ссылка после изменений становится недействительной'
  correct: 1
