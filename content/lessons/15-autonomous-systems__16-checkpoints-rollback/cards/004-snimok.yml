- concept: при сбое сомнительное рабочее состояние отбрасывают и восстанавливают данные из снимка
  question: Внешний сервис перестал отвечать на середине шага, и рабочее состояние workflow оказалось под сомнением. Объясни, что делают с рабочим состоянием и почему восстановление из снимка надёжнее реконструкции.
  explanation: 'Разделение рабочего состояния и снимка существует именно ради этого случая: ошибка в рабочем состоянии не переписывает опору для восстановления.'
  kind: open
  reference: Сомнительное или повреждённое рабочее состояние отбрасывают и берут содержимое последнего снимка. Снимок — то, что действительно было сохранено в конкретный момент, а не догадка о том, какие поля успели измениться до обрыва. Реконструкция «по памяти» опирается на состояние, которое уже могло быть частично переписано неудавшимся шагом, и потому не даёт опоры.
