- concept: запись статуса до действия делает потерю эффекта ненаблюдаемой, потому что завершённое на вид состояние не вызывает никакой проверки
  question: 'Порядок перевернули: сначала пишут «выполнено», затем делают внешний вызов. Процесс падает между этими операциями. Чем этот отказ хуже, чем дубль при обратном порядке?'
  explanation: 'Оба порядка ошибочны, но по-разному. «Сначала действие» оставляет подозрительное состояние, которое само требует доследования и потому обнаруживается. «Сначала статус» оставляет состояние, неотличимое от честного успеха: никто не пойдёт проверять, и эффект просто не случится молча.'
  kind: choice
  options:
    - Тем, что дубль стоит дороже, чем пропущенное действие
    - Тем, что состояние выглядит завершённым, никакой проверки не запускает, и пропажа эффекта остаётся ненаблюдаемой
    - Тем, что теряется ключ идемпотентности и повтор становится небезопасным
    - Тем, что откат к предыдущему чекпоинту при таком порядке технически невозможен
