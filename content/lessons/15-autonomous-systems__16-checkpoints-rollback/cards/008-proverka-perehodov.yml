- concept: надёжной считается работа до последней записанной границы; переход, оборванный на середине, гарантий не имеет
  question: Воркер завершил переход «собран → отгружен», записал checkpoint и упал в середине следующего перехода. Что после сбоя можно считать надёжно сохранённым?
  explanation: Граница проходит по последней записанной фиксации завершённого перехода. Всё, что менялось после неё, жило только в памяти упавшего воркера и проверке не поддаётся; всё, что до неё, лежит в хранилище.
  kind: choice
  options:
    - Состояние «отгружен» вместе с записью о завершённом переходе к нему
    - Состояние, до которого воркер успел дойти в момент падения
    - Только самое первое состояние запуска
    - 'Ничего: сбой обесценивает все записи запуска'
  correct: 0
  id: 008-proverka-perehodov-1
  fingerprint: fe6324fc
- concept: пропущенная граница делает неотличимым завершённый переход от невыполненного
  question: Реализация фиксирует состояние «время от времени, когда оно выглядит актуальным», а не на каждой границе перехода. Какую конкретную неоднозначность это создаёт после сбоя? Объясни своими словами.
  explanation: Ключевое слово — неоднозначность. «Иногда сохранять» даёт состояние без ответа на вопрос, что именно из него уже доведено до конца.
  kind: open
  reference: 'Последняя сохранённая запись может отставать от фактически выполненной работы. Тогда по хранилищу нельзя отделить переход, который уже завершился, от того, который ещё предстоит выполнить: обе ситуации выглядят одинаково — записи нет. Восстанавливающемуся воркеру приходится либо выполнять переход заново, либо пропускать его, и оба решения принимаются вслепую. Фиксация на каждой границе убирает выбор: отсутствие записи однозначно означает незавершённый переход.'
  id: 008-proverka-perehodov-2
  fingerprint: 615bbcb1
