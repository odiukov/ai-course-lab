- concept: 'виды отката перебираются в порядке убывания точности возврата: прямая отмена, компенсация, передача человеку'
  question: Расставь ветки выбора плана отката в том порядке, в каком их проверяют для конкретного побочного эффекта.
  explanation: 'Порядок идёт от самого полного возврата к самому слабому: прямая отмена не оставляет следа, компенсация оставляет исходное событие в истории, передача человеку вообще не восстанавливает состояние автоматически.'
  kind: order
  items:
    - Проверить, можно ли прямо обратить эффект тем же каналом, которым он создан (in-band rollback)
    - Если прямого обратного действия нет, подобрать новое действие, нейтрализующее деловой результат исходного (компенсирующая транзакция)
    - Если автоматическая компенсация опасна или требует решения, поставить workflow на паузу и передать состояние человеку (out-of-band rollback)
  id: 027-karta-otkatov-1
  fingerprint: 04c76779
- concept: граница между прямой отменой и компенсацией — доступность обратного действия тем же каналом, а не масштаб последствия
  question: По какому признаку эффект относят к прямой отмене, а не к компенсирующей транзакции?
  explanation: 'Строка, вставленная и тут же удалённая, исчезает целиком — это in-band. Посылку, отданную курьеру, обратным вызовом того же канала не отозвать: остаётся только новое действие с обратным деловым результатом, то есть компенсация. Цена и давность тут ни при чём.'
  kind: choice
  options:
    - Эффект дешёвый и затрагивает мало данных
    - Эффект ещё можно обратить тем же механизмом, которым он создан, не оставляя следа в целевой системе
    - Эффект произошёл меньше минуты назад
    - Эффект был выполнен без одобрения человека
  correct: 1
  id: 027-karta-otkatov-2
  fingerprint: 27020c28
- concept: out-of-band выбирается по риску и неоднозначности автоматической компенсации, а не по её технической невозможности
  question: 'Компенсирующее действие для эффекта технически доступно, но его исход зависит от спорных обстоятельств: неизвестно, кто виноват в расхождении, и правила возврата допускают разные решения. Какая ветка отката верна?'
  explanation: 'Триггер out-of-band — не отсутствие технической возможности, а то, что автоматический выбор компенсации небезопасен или требует человеческого решения. Помечать эффект неоткатываемым задним числом нельзя: такая метка объявляется заранее, до коммита.'
  kind: choice
  options:
    - 'Всё равно in-band: раз действие доступно, надо обратить эффект тем же каналом'
    - 'Всё равно компенсация: доступность действия — достаточное основание запустить его автоматически'
    - 'Out-of-band: workflow ставится на паузу, плохое состояние передаётся человеку для разбора'
    - 'Никакая: эффект помечается как неоткатываемый прямо в момент аварии'
  correct: 2
  id: 027-karta-otkatov-3
  fingerprint: 9c728901
