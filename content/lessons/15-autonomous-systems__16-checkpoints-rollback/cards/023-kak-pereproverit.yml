- concept: проверка существования объекта слабее проверки совпадения его содержимого с задуманным состоянием
  question: Workflow дописал конфигурацию в файл. Какой вариант постпроверки подтверждает эффект сильнее остальных?
  explanation: Наличие в листинге и рост размера совместимы с обрезанной или испорченной записью. Совпадение хеша прочитанного содержимого с ожидаемым — единственная из трёх проверок, различающая правильный и частично записанный файл.
  kind: choice
  options:
    - Файл присутствует в листинге каталога
    - Размер файла увеличился по сравнению с прежним
    - Файл прочитан обратно, и его хеш совпал с хешем задуманного содержимого
  correct: 2
  id: 023-kak-pereproverit-1
  fingerprint: b24cc095
- concept: постпроверка строится как независимое чтение целевого ресурса с последующим сравнением полей, а не как повтор действия
  question: Расставь шаги надёжной постпроверки после запроса на изменение записи во внешнем сервисе.
  explanation: Ответ сервиса — только сигнал приёма запроса. Дальше идёт независимое чтение целевого ресурса и сверка полей; расхождение переводит workflow в откат, а не в повторную отправку.
  kind: order
  items:
    - Дождаться ответа сервиса на запрос изменения
    - Отдельным запросом прочитать целевой ресурс из сервиса
    - Сравнить значимые поля прочитанного ресурса с задуманным состоянием
    - При расхождении объявить состояние плохим и запустить откат
  id: 023-kak-pereproverit-2
  fingerprint: 1b0e9968
- concept: 'постпроверка выбирается под тип побочного эффекта: у каждого канала своё наблюдаемое целевое состояние'
  question: Workflow отправил письмо через почтовый сервис. Какая постпроверка соответствует именно этому побочному эффекту?
  explanation: Установленное соединение и валидный адрес — это условия до эффекта. Наблюдаемое целевое состояние для отправки письма — запись с его message ID среди отправленных.
  kind: choice
  options:
    - Найти message ID письма в папке «отправленные»
    - Убедиться, что SMTP-соединение установилось
    - Проверить, что адрес получателя корректно составлен
  correct: 0
