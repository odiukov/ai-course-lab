- concept: стоимость лишней записи ограничена и обратима, стоимость повторного внешнего вызова — нет
  question: 'Инженер спорит, стоит ли писать состояние после каждого перехода: «это же лишние обращения к базе». Какой аргумент корректно объясняет, почему в продакшене цена всё равно оправдана?'
  explanation: 'Сравниваются несопоставимые величины: дешёвая и обратимая внутренняя запись против внешнего побочного эффекта, который повтор дублирует. Записи не ускоряют работу и не снижают частоту сбоев — они сокращают ущерб от сбоя.'
  kind: choice
  options:
    - Запись перехода стоит миллисекунды и полностью внутренняя, а повторный внешний вызов (платёж, письмо, заявка партнёру) уже произведён во внешней системе и сам собой не отменяется
    - База данных всё равно кеширует записи, поэтому дополнительные записи не занимают места
    - Частые записи ускоряют выполнение самого workflow, потому что состояние не нужно пересчитывать
    - Чем больше записей, тем реже происходят сбои процесса
