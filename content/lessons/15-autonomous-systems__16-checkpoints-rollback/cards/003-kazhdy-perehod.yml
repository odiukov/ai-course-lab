- concept: переход состояния — любая смена именованного состояния workflow, а не только выделенные «важные» точки коммита
  question: Что считается переходом состояния графа, который продакшен-реализация обязана сохранять?
  explanation: Определение опирается на смену именованного состояния, а не на субъективную важность шага. Наивная реализация сохраняет только выделенные точки коммита — отсюда длинные участки переигрывания и неточное восстановление по лизу.
  kind: choice
  options:
    - Любой шаг, переводящий workflow из одного именованного состояния в другое
    - Только шаг, который меняет данные во внешней системе
    - Только шаг, помеченный разработчиком как точка коммита
    - Только шаг, после которого workflow завершается или ветвится
