- concept: 'число записей в журнале равно числу выполненных переходов: один вызов записи — один checkpoint'
  question: Функция записи checkpoint вызывается на каждом переходе workflow и не содержит внутренних условий пропуска. Запуск прошёл 9 переходов состояния и завершился без сбоев. Сколько записей окажется в журнале checkpoint этого запуска?
  explanation: 'Контракт функции: один вызов — одна запись. Никакой фильтрации внутри нет, поэтому 9 переходов дают ровно 9 checkpoint, каждый со своим снимком и своей парой состояний. Расхождение счётчиков (например, 7 записей на 9 переходов) — прямой признак того, что часть переходов не сохранена.'
  kind: numeric
  answer: 9
  tolerance: 0.4
  id: 007-checkpoint-1
  fingerprint: 3e277eeb
- concept: 'порядок построения записи checkpoint: данные перехода, снимок, связывание, помещение в журнал, возврат записи'
  question: Расставь действия функции записи checkpoint в правильном порядке.
  explanation: 'Снимок нужен раньше записи: записывать нечего, пока нет зафиксированного содержимого. Связывание идёт после снимка, потому что запись состоит из снимка плюс описания перехода. Добавление в журнал — последнее действие с побочным эффектом, а возврат созданной записи (а не журнала и не снимка) даёт вызывающему коду ссылку на то, что реально сохранено.'
  kind: order
  items:
    - получить данные текущего перехода (исходное и целевое состояние)
    - построить снимок состояния, относящегося к этому переходу
    - связать снимок с парой состояний перехода в одну запись checkpoint
    - добавить получившуюся запись в журнал checkpoint
    - вернуть созданную запись вызывающему коду
  id: 007-checkpoint-2
  fingerprint: 9f9c7c8c
