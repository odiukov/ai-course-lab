- concept: 'порядок этапов одобренного действия: проверка предусловий, выполнение с фиксацией, постпроверка, компенсация'
  question: Расставь этапы выполнения одобренного действия в правильном порядке.
  explanation: 'Одобрение — исходная точка маршрута, а не отметка «готово». Каждый этап закрывает свой вопрос: «мир ещё такой же», «докуда дошли», «оно произошло», «как отменить».'
  kind: order
  items:
    - 'Проверить предусловия: состояние мира всё ещё такое, под какое действие одобряли'
    - Выполнить внешнее действие и зафиксировать чекпоинт достигнутой точки
    - 'Проверить постусловие: побочный эффект действительно наблюдается во внешней системе'
    - Если постпроверка провалилась — выполнить компенсирующее действие
  id: 002-karta-sostoyaniy-1
  fingerprint: a6bffbc0
- concept: восстановление продолжает от последнего чекпоинта и проверяет уже сделанное, а не переигрывает действие от одобрения
  question: Одобрено резервирование 5 единиц товара из 40 доступных. Воркер уменьшил остаток и отключился до подтверждения. Что делает новый воркер?
  explanation: Повтор от одобрения снимет ещё 5 единиц и даст 30 вместо 35. Чекпоинт отвечает не на вопрос «что агент собирался сделать», а «какой участок пути уже надёжно пройден», и проверка идёт оттуда.
  kind: choice
  options:
    - Выполняет задачу заново с самого одобрения — резерв создаётся ещё раз
    - Открывает последний чекпоинт и проверяет, существует ли резерв; если он есть, повторное списание не выполняется
    - Считает задачу проваленной и сразу возвращает остаток к 40
    - Ждёт нового одобрения от человека, других вариантов нет
  correct: 1
  id: 002-karta-sostoyaniy-2
  fingerprint: fbf68e88
- concept: откат — это компенсирующее действие, возвращающее внешнее состояние к точке перед изменением
  question: Постпроверка не подтвердила побочный эффект частично выполненного действия. Что делает система и относительно какого состояния?
  explanation: Компенсация работает против зафиксированной точки старта изменения — иначе неясно, что именно отменять и до какого объёма.
  kind: open
  reference: 'Запускается откат: компенсирующее действие, которое приводит внешнее состояние к тому, каким оно было перед началом изменения. Это не удаление записи о попытке и не откат внутреннего состояния процесса — внешние эффекты нельзя «стереть», их можно только компенсировать обратной операцией (снять резерв, сделать возврат платежа). Опорой служит состояние, зафиксированное чекпоинтом до начала изменения.'
  id: 002-karta-sostoyaniy-3
  fingerprint: ec7e6f4c
