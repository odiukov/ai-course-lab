- concept: чекпоинт фиксирует внутреннее состояние агента, но не доказывает, случился ли внешний побочный эффект
  question: Агент отправил запрос во внешнюю платёжную систему и упал до того, как записал ответ. Что достоверно даёт последний чекпоинт при возобновлении?
  explanation: 'Чекпоинт — запись внутреннего состояния процесса. Граница между последней записью и сбоем непрозрачна: побочный эффект мог пересечь её незаметно для агента. Поэтому внешнее состояние надо выяснять отдельной проверкой, а не выводить из чекпоинта.'
  kind: choice
  options:
    - Подтверждение, что запрос дошёл до платёжной системы
    - Гарантию, что списание не произошло, раз ответ не записан
    - Только то, что агент успел надёжно зафиксировать до сбоя; состояние внешнего мира по нему неизвестно
    - Полный результат внешнего вызова, включая код ответа
  correct: 2
  id: 001-posle-sboya-1
  fingerprint: 932239de
- concept: отсутствие записи об ответе покрывает несколько разных внешних исходов, неразличимых изнутри процесса
  question: После перезапуска в журнале агента нет ответа от внешнего сервиса. Какие исходы это состояние покрывает?
  explanation: Снаружи эти исходы дают разные результаты, изнутри возобновлённого процесса выглядят одинаково — «ответа нет». Поэтому первый шаг после восстановления — не действие, а выяснение реального внешнего исхода.
  kind: choice
  options:
    - 'Только один: вызов не состоялся'
    - Запрос не дошёл, дошёл и был отклонён, либо успешно выполнился, но подтверждение не сохранилось
    - 'Только два: вызов отклонён либо истёк таймаут'
    - 'Ни одного: пустая запись означает, что шаг не начинался'
  correct: 1
  id: 001-posle-sboya-2
  fingerprint: 87f449d5
- concept: 'возобновляемость не равна безопасному продолжению: слепой повтор и слепой откат одинаково ошибочны'
  question: Процесс восстановлен и видит одобренное действие с незавершённым шагом. Объясни своими словами, почему нельзя ни просто повторить действие, ни просто откатить его.
  explanation: 'Durable execution даёт возобновляемость — способность продолжить. Безопасность продолжения даёт другая машинерия: идемпотентность, проверка предусловий и постпроверка побочного эффекта.'
  kind: open
  reference: 'Слепой повтор удваивает побочный эффект, если действие уже прошло во внешней системе (клиент получает возврат дважды). Слепой откат пытается компенсировать то, чего могло не быть, и портит состояние в другую сторону. Оба варианта предполагают знание, которого у процесса нет. Сначала нужна проверка фактического внешнего состояния (плюс ключ идемпотентности, чтобы повтор был безопасен), и только потом выбор: продолжить, пропустить или компенсировать.'
  id: 001-posle-sboya-3
  fingerprint: db69b68d
