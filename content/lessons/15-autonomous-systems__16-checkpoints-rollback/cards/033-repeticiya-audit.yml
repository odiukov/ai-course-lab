- concept: бэкенд чекпоинтов и аудит-трейла обязан переживать деплой и пересоздание контейнера, иначе надзор пропадает ровно в момент, когда он нужен
  question: Чекпоинты и записи об откатах хранятся в памяти процесса и в файловой системе контейнера. Почему это ломает надзор, даже если механизм отката работает безупречно?
  explanation: 'Надзор нужен именно после сбоя и деплоя. Эфемерное хранилище гарантированно теряет данные в этот момент: кнопка «Откатить» остаётся, а целевой чекпоинт и след предыдущей версии — нет. Требование к хранилищу здесь инфраструктурное, к качеству модели отношения не имеет.'
  kind: choice
  options:
    - Потому что доступ к контейнеру медленнее, чем к внешней базе
    - Потому что после деплоя или перезапуска история исчезает, и аудитор не может ни выбрать точку возврата, ни восстановить картину происшествия
    - Потому что в контейнере нельзя гарантировать корректный порядок записей
    - Потому что чекпоинты в файлах нельзя сделать неизменяемыми
