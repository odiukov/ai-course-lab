- concept: провалившаяся проверка обязана поднимать алерт человеку, потому что тихая запись в лог откладывает обнаружение до момента, когда вмешательство уже бесполезно
  question: Почему для эффективного человеческого надзора недостаточно записывать провалившиеся проверки в лог — почему требуется алерт?
  explanation: 'Разница между логом и алертом — не в детальности, а в том, кто инициирует чтение. Тихая строка превращает отказ надзора в отложенный: механизм формально сработал, а человек не подключился.'
  kind: open
  reference: 'Надзор эффективен, только если человек узнаёт о проблеме внутри окна, когда ещё можно вмешаться: остановить workflow, откатить, не дать эффекту повториться или распространиться. Лог — пассивный канал: он читается по случаю или задним числом при разборе инцидента. Провал постпроверки означает, что фактическое состояние разошлось с ожидаемым, то есть надзор нужен прямо сейчас; поэтому такое событие обязано активно вытолкнуть сигнал человеку, а не ждать, пока его найдут.'
