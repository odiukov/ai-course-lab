- concept: 'порядок работы отката: поиск целевого чекпоинта, отбор зафиксированных после него действий, обратные действия, восстановление снимка последним'
  question: Расставь этапы работы функции отката к заданному чекпоинту.
  explanation: 'Снимок восстанавливается последним: пока внешние последствия не сняты, внутренняя точка возврата не соответствует реальности. Незавершённые действия в отбор не попадают — отменять там нечего.'
  kind: order
  items:
    - Найти целевой чекпоинт по его идентификатору в журнале запуска
    - Отобрать только те действия, которые были успешно зафиксированы после этого чекпоинта
    - Выполнить записанные планы отката для отобранных действий, двигаясь от последнего к первому
    - Убедиться, что все планы отработали успешно и ни один не потребовал участия человека
    - Восстановить снимок состояния из целевого чекпоинта и вернуть результат отката
  id: 026-rollback-to-1
  fingerprint: 574752d4
- concept: внешние эффекты снимаются в обратном порядке фиксации из-за зависимостей между ними
  question: Дополни цикл обхода подтверждённых после целевого чекпоинта действий.
  explanation: 'Поздние эффекты часто опираются на ранние: вернуть товар в продажу раньше возврата денег — значит на время отдать и товар, и деньги. Обход от последнего к первому снимает зависимости в правильную сторону.'
  kind: cloze
  template: |-
    for action in ___(committed_after_target):
        run_rollback_plan(action)
  answer: reversed
  accept:
    - reversed
    - reversed()
    - обратном порядке
  id: 026-rollback-to-2
  fingerprint: 039bbf20
- concept: частичный откат возвращается как явный неуспех с указанием места остановки, а не как достигнутая цель
  question: Средний из планов отката завершился ошибкой, более поздние уже отработали, а более ранние — ещё нет. Что должна вернуть функция отката?
  explanation: 'Объявить чекпоинт восстановленным, пока часть эффектов жива, — прямая ложь вызывающей стороне: она продолжит работу от точки, которой в реальности нет. Место остановки нужно, чтобы дорабатывать откат руками или ветвью с участием человека, а не переигрывать уже снятые эффекты.'
  kind: choice
  options:
    - 'Успех: целевой чекпоинт достигнут, потому что снимок всё равно можно восстановить'
    - Неуспех с указанием, на каком действии откат остановился, без восстановления снимка целевого чекпоинта
    - Успех с предупреждением, а неудавшийся план молча поставить в очередь на повтор
    - Исключение без данных о проделанной части, чтобы вызывающая сторона начала откат заново с самого начала
  correct: 1
  id: 026-rollback-to-3
  fingerprint: 01d7b46b
