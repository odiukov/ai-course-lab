- concept: истечение лиза — факт о владении запуском, из него не следует ничего о том, какая работа успела завершиться
  question: Лиз запуска, который выполнял упавший воркер, истёк. Что следует из самого факта истечения?
  explanation: 'Лиз отвечает на один вопрос: занят запуск или свободен. Что успело выполниться, знает журнал чекпоинтов, а незаписанные изменения никто не откатывает — они просто исчезли вместе с памятью процесса.'
  kind: choice
  options:
    - Что начатый последним переход не завершился
    - Что прежний владелец больше не удерживает запуск, и только это; о состоянии работы истечение не говорит ничего
    - Что все изменения, не попавшие в чекпоинт, уже откачены хранилищем
  correct: 1
  id: 015-srok-liza-1
  fingerprint: 260a5b93
- concept: живость воркера не наблюдается напрямую — она выводится из потока продлений лиза
  question: Хранилище не может проверить, работает ли ещё процесс воркера. Объясни своими словами, как механизм лиза заменяет такую проверку и что именно доказывает истечение срока.
  explanation: 'Ключ в том, что «жив» — это вывод, а не наблюдение. Наблюдаемый сигнал один: пришло продление или нет. Отсюда и требование постоянно продлевать лиз во время работы.'
  kind: open
  reference: Живой воркер обязан регулярно продлевать лиз, сдвигая дедлайн вперёд. Хранилище видит не сам процесс, а только поток продлений. Если продления прекратились, дедлайн доходит до текущего времени и лиз истекает. Строго говоря, истечение доказывает не смерть воркера, а лишь то, что продления перестали приходить, — этого достаточно, чтобы освободить запуск, но недостаточно, чтобы делать выводы о выполненной работе.
  id: 015-srok-liza-2
  fingerprint: 643c4ef4
- concept: момент освобождения запуска отсчитывается от последнего успешного продления, а не от момента падения воркера
  question: Лиз выдаётся на 45 секунд и продлевается каждые 12 секунд. Воркер падает через 6 секунд после очередного успешного продления. Через сколько секунд после падения запуск станет свободным?
  explanation: 'Дедлайн ставится в момент последнего продления: 45 секунд от него. Падение произошло через 6 секунд, значит осталось 45 − 6 = 39. Хранилище про падение не знает, оно просто ждёт свой дедлайн.'
  kind: numeric
  answer: 39
  tolerance: 0.1
  id: 015-srok-liza-3
  fingerprint: 35f6c870
