- concept: 'журнал чекпоинтов просматривается от конца к началу: первое совпадение с конца — самое свежее, прямой обход вернёт устаревшую запись при повторе перехода'
  question: В журнале запуска 5 записей, и переход `charge` встречается в нём дважды — при первой попытке и при повторе. Поиск идёт от начала коллекции и возвращает первое совпадение. Что получит вызывающий код?
  explanation: Записи лежат в порядке добавления, поэтому всё, что левее, сохранено раньше. Обход от начала останавливается на самой ранней попытке и подсовывает состояние, которое уже перекрыто повтором. Обход от конца даёт последнюю фиксацию нужного перехода.
  kind: choice
  options:
    - Состояние с первой, уже устаревшей попытки `charge`
    - Состояние с последней попытки `charge`
    - Обе записи `charge`, объединённые в одну
    - Признак отсутствия результата, потому что совпадений больше одного
  correct: 0
  id: 010-find-checkpoint-1
  fingerprint: 4f7d2a9a
- concept: отсутствие подходящей записи — отдельный явный исход поиска, а не повод подставить соседнюю или сочинить новую
  question: Функция поиска чекпоинта не нашла ни одной записи с нужным идентификатором перехода. Как она должна себя повести?
  explanation: 'Подмена отсутствия чужой записью превращает честное «такого перехода не сохраняли» в правдоподобное, но ложное состояние, и ошибка всплывёт уже после восстановления. Создание новой записи вдобавок нарушает контракт: поиск только читает, ничего не сохраняет и ничего не восстанавливает.'
  kind: choice
  options:
    - Вернуть последнюю запись коллекции как ближайшую по времени
    - Создать и записать пустой чекпоинт для этого перехода
    - Вернуть предусмотренное сигнатурой обозначение отсутствия результата
    - Вернуть первую запись коллекции как безопасную точку старта
  correct: 2
