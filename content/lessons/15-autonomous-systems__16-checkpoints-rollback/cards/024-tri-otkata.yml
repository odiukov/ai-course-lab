- concept: компенсирующая транзакция добавляет новое действие с обратным деловым результатом, оставляя исходное в истории, в отличие от прямой отмены эффекта
  question: Чем компенсирующая транзакция отличается от прямой отмены побочного эффекта?
  explanation: 'Удаление только что вставленной строки убирает след целиком. Возврат средств след не убирает: списание и возврат обе видны в истории, исправлен лишь итог. Это стандартный приём SAGA.'
  kind: choice
  options:
    - Компенсация стирает исходное действие, прямая отмена его сохраняет
    - Компенсация не устраняет исходное действие, а добавляет обратное по деловому результату; в истории остаются обе операции
    - Компенсация выполняется вручную, прямая отмена — автоматически
  correct: 1
  id: 024-tri-otkata-1
  fingerprint: 027aaf95
- concept: пауза workflow с передачей плохого состояния человеку — заранее объявленная ветка плана отката, а не отсутствие плана
  question: 'Для действия нет безопасной автоматической отмены: груз уже у перевозчика. Как выглядит корректный план отката?'
  explanation: 'Внешний откат — полноценный тип плана: workflow ставится на паузу, плохое состояние сохраняется для разбора, решение принимает человек. Ложная отмена хуже её отсутствия, потому что маскирует реальное состояние.'
  kind: choice
  options:
    - Оставить план пустым и решать проблему по факту аварии
    - 'Записать как план: остановить workflow, сохранить состояние и передать разбор человеку'
    - Записать формальную отмену, даже если она не действует, чтобы план был заполнен
  correct: 1
  id: 024-tri-otkata-2
  fingerprint: e2b7c50d
- concept: необратимость объявляется в предложении действия до коммита и повышает требования к подтверждению человеком
  question: 'Действие необратимо: отменить его нельзя ничем. Когда об этом должно стать известно?'
  explanation: «Откат невозможен» — часть предложения действия, а не открытие во время аварии. Отсутствие отката компенсируется усиленным подтверждением человеком в момент коммита, иначе последствия обнаруживаются, когда исправить их уже нечем.
  kind: choice
  options:
    - В момент аварии, когда откат понадобится
    - В предложении действия, до коммита, вместе с более строгим подтверждением человеком
    - После постпроверки, если она провалилась
  correct: 1
