- concept: длительность лиза — компромисс между скоростью подхвата и риском объявить живого воркера мёртвым
  question: Команда решает, каким сделать срок лиза. Что теряется при слишком длинном сроке и что — при слишком коротком?
  explanation: 'Обе крайности плохи по-разному: одна стоит времени простоя, другая — корректности. Именно поэтому лиз продлевают часто, а срок его жизни держат кратно больше интервала продления.'
  kind: open
  reference: 'Длинный лиз: после падения воркера запуск долго стоит без исполнителя — никто не имеет права его взять, пока заявка не истекла, и восстановление задерживается на весь срок. Короткий лиз: живой, но замедлившийся воркер (пауза сборщика мусора, тормозящая сеть) не успевает продлить заявку, его объявляют мёртвым, и запуск подхватывает второй воркер — два исполнителя работают параллельно. Срок выбирают заметно больше обычного интервала продления, но достаточно коротким, чтобы простой после сбоя оставался приемлемым.'
