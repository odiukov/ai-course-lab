- concept: лиз — короткоживущая аренда запуска; передача другому воркеру законна только после её истечения, иначе два исполнителя ведут один запуск
  question: Зачем система ждёт истечения лиза, прежде чем отдать запуск другому воркеру?
  explanation: 'Лиз — заявка «этот воркер сейчас выполняет этот запуск», которую живой воркер постоянно продлевает. Истёкший лиз — единственный доступный извне признак, что исполнителя больше нет. Перехват раньше срока означает два воркера на одном запуске: дублирующиеся внешние вызовы и конкурирующие записи.'
  kind: choice
  options:
    - Чтобы за это время дописались чекпоинты, которые ещё не попали в хранилище
    - Чтобы убедиться, что прежний воркер больше не ведёт этот запуск, и не получить двух исполнителей одновременно
    - Чтобы содержимое снимка успело устареть и не мешало восстановлению
    - Чтобы очередь успела удалить старые чекпоинты запуска
