<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Поток решения IFC перед вызовом инструмента</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f5f7fb;
    --surface: #ffffff;
    --surface-soft: #edf2f8;
    --ink: #172033;
    --muted: #596579;
    --line: #8995a8;
    --trusted: #147d64;
    --trusted-soft: #dff5ec;
    --untrusted: #a75808;
    --untrusted-soft: #fff0d5;
    --danger: #b33a42;
    --danger-soft: #ffe5e7;
    --tool: #53627b;
    --tool-soft: #e8edf5;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #111722;
      --surface: #1b2432;
      --surface-soft: #222e3e;
      --ink: #eef3fa;
      --muted: #b6c0cf;
      --line: #7f8ba0;
      --trusted: #69d7b5;
      --trusted-soft: #173f37;
      --untrusted: #ffc46d;
      --untrusted-soft: #4a3519;
      --danger: #ff8e95;
      --danger-soft: #4d252a;
      --tool: #b4c3db;
      --tool-soft: #29364a;
    }
  }

  html,
  body {
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .figure {
    background: var(--page);
  }

  .figure-title {
    font-size: 20px;
  }

  .diagram {
    display: block;
    width: 100%;
    height: auto;
    max-height: 430px;
    background: var(--page);
  }

  .diagram text {
    fill: var(--ink);
    font-size: 15px;
  }

  .diagram .small {
    fill: var(--muted);
    font-size: 13px;
  }

  .diagram .tag-text {
    font-size: 13px;
    font-weight: bold;
  }

  .diagram .node-title {
    font-size: 15px;
    font-weight: bold;
  }

  .diagram .gate-title {
    font-size: 16px;
    font-weight: bold;
  }

  .card,
  .diamond,
  .tag,
  .legend-swatch {
    stroke-width: 2;
  }

  .card {
    fill: var(--surface);
    stroke: var(--line);
  }

  .trusted-card {
    fill: var(--trusted-soft);
    stroke: var(--trusted);
  }

  .untrusted-card {
    fill: var(--untrusted-soft);
    stroke: var(--untrusted);
  }

  .confirm-card {
    fill: var(--danger-soft);
    stroke: var(--danger);
    stroke-width: 3;
  }

  .tool-card {
    fill: var(--tool-soft);
    stroke: var(--tool);
  }

  .trusted-tag {
    fill: var(--trusted);
    stroke: var(--trusted);
  }

  .untrusted-tag {
    fill: var(--untrusted);
    stroke: var(--untrusted);
  }

  .trusted-tag-text,
  .untrusted-tag-text {
    fill: var(--surface) !important;
  }

  .diamond {
    fill: var(--surface-soft);
    stroke: var(--line);
    stroke-width: 3;
  }

  .flow,
  .arrow-head {
    stroke-width: 3;
  }

  .flow {
    fill: none;
    stroke: var(--line);
  }

  .arrow-head {
    stroke-linejoin: round;
  }

  .trusted-flow {
    stroke: var(--trusted);
  }

  .trusted-head {
    fill: var(--trusted);
    stroke: var(--trusted);
  }

  .untrusted-flow {
    stroke: var(--untrusted);
  }

  .untrusted-head {
    fill: var(--untrusted);
    stroke: var(--untrusted);
  }

  .danger-flow {
    stroke: var(--danger);
  }

  .danger-head {
    fill: var(--danger);
    stroke: var(--danger);
  }

  .conditional-flow {
    stroke: var(--tool);
  }

  .conditional-head {
    fill: var(--tool);
    stroke: var(--tool);
  }

  .trusted-label {
    fill: var(--trusted) !important;
    font-weight: bold;
  }

  .untrusted-label {
    fill: var(--untrusted) !important;
    font-weight: bold;
  }

  .danger-label {
    fill: var(--danger) !important;
    font-weight: bold;
  }

  .rule {
    fill: var(--ink);
    font-size: 15px;
    font-weight: bold;
  }

  .fallback {
    color: var(--danger);
    background: var(--danger-soft);
    font-size: 15px;
  }
</style>
</head>
<body>
<main class="figure">
  <h2 class="figure-title" id="figure-title">Поток решения IFC перед вызовом инструмента</h2>

  <svg
    id="ifc-diagram"
    class="diagram"
    width="1200"
    height="430"
    viewBox="0 0 1200 430"
    preserveAspectRatio="xMidYMid meet"
    role="img"
    aria-labelledby="figure-title diagram-description">
    <title>Доверенный и недоверенный потоки проходят проверку IFC перед инструментом</title>
    <desc id="diagram-description">
      Доверенный запрос поддерживает действие и разрешается. Команда отправить сообщение всем контактам,
      пришедшая из недоверенного документа, останавливается шлюзом явного подтверждения перед инструментом.
    </desc>
    <g id="diagram-root"></g>
  </svg>

  <div id="diagram-fallback" class="fallback" hidden>
    Схема должна показать два потока: доверенный запрос пользователя разрешает поддержанное им действие,
    а команда «отправить всем контактам» из недоверенного документа останавливается шлюзом подтверждения
    перед инструментом отправки.
  </div>

  <noscript>
    Доверенный запрос пользователя и недоверенный документ получают разные метки. Команда из документа
    не достигает инструмента отправки без явного подтверждения пользователя.
  </noscript>
</main>

<script>
(() => {
  const diagramData = [
    {
      kind: "config",
      origin: { x: 0, y: 0 },
      scale: { x: 1, y: 1 },
      arrowHead: 12,
      arrowWing: 7,
      previousIndex: -2,
      lastIndex: -1
    },
    {
      kind: "arrow",
      tone: "trusted",
      points: [{ x: 255, y: 80 }, { x: 315, y: 80 }],
      label: { x: 285, y: 62, text: "влияние", anchor: "middle", className: "trusted-label small" }
    },
    {
      kind: "arrow",
      tone: "trusted",
      points: [{ x: 540, y: 80 }, { x: 605, y: 80 }],
      label: { x: 572, y: 114, text: "доверенный поток", anchor: "middle", className: "trusted-label small" }
    },
    {
      kind: "arrow",
      tone: "trusted",
      points: [{ x: 765, y: 80 }, { x: 820, y: 80 }],
      label: { x: 792, y: 62, text: "да", anchor: "middle", className: "trusted-label small" }
    },
    {
      kind: "arrow",
      tone: "untrusted",
      points: [{ x: 255, y: 240 }, { x: 315, y: 240 }],
      label: { x: 285, y: 222, text: "влияние", anchor: "middle", className: "untrusted-label small" }
    },
    {
      kind: "arrow",
      tone: "untrusted",
      points: [{ x: 540, y: 240 }, { x: 605, y: 240 }],
      label: { x: 572, y: 276, text: "недоверенный поток", anchor: "middle", className: "untrusted-label small" }
    },
    {
      kind: "arrow",
      tone: "danger",
      points: [{ x: 765, y: 240 }, { x: 820, y: 240 }],
      label: { x: 792, y: 222, text: "нет", anchor: "middle", className: "danger-label small" }
    },
    {
      kind: "arrow",
      tone: "conditional",
      points: [
        { x: 990, y: 295 },
        { x: 990, y: 318 },
        { x: 1050, y: 318 },
        { x: 1050, y: 342 }
      ],
      label: {
        x: 970,
        y: 323,
        text: "только после явного «Да»",
        anchor: "end",
        className: "small"
      }
    },
    {
      kind: "box",
      className: "card trusted-card",
      x: 25, y: 35, w: 230, h: 90,
      tag: {
        x: 40, y: 47, w: 165, h: 25,
        className: "tag trusted-tag",
        textClass: "tag-text trusted-tag-text",
        text: "ДОВЕРЕННЫЙ ЗАПРОС",
        tx: 122, ty: 65
      },
      lines: [
        { x: 40, y: 96, text: "«Найди свободное", className: "" },
        { x: 40, y: 116, text: "время»", className: "" }
      ]
    },
    {
      kind: "box",
      className: "card trusted-card",
      x: 315, y: 35, w: 225, h: 90,
      lines: [
        { x: 330, y: 61, text: "ВЫДЕЛЕННОЕ ДЕЙСТВИЕ", className: "node-title" },
        { x: 330, y: 91, text: "Найти свободное", className: "" },
        { x: 330, y: 112, text: "время", className: "" }
      ]
    },
    {
      kind: "diamond",
      className: "diamond",
      cx: 685, cy: 80, rx: 80, ry: 55,
      lines: [
        { x: 685, y: 64, text: "Есть доверенное", anchor: "middle", className: "node-title" },
        { x: 685, y: 86, text: "основание", anchor: "middle", className: "" },
        { x: 685, y: 107, text: "действия?", anchor: "middle", className: "" }
      ]
    },
    {
      kind: "box",
      className: "card trusted-card",
      x: 820, y: 35, w: 205, h: 90,
      lines: [
        { x: 922, y: 68, text: "РАЗРЕШИТЬ", anchor: "middle", className: "gate-title trusted-label" },
        { x: 922, y: 96, text: "Запрос поддерживает", anchor: "middle", className: "small" },
        { x: 922, y: 116, text: "это действие", anchor: "middle", className: "small" }
      ]
    },
    {
      kind: "box",
      className: "card untrusted-card",
      x: 25, y: 190, w: 230, h: 100,
      tag: {
        x: 40, y: 202, w: 190, h: 25,
        className: "tag untrusted-tag",
        textClass: "tag-text untrusted-tag-text",
        text: "НЕДОВЕРЕННЫЙ ДОКУМЕНТ",
        tx: 135, ty: 220
      },
      lines: [
        { x: 40, y: 252, text: "«Отправь всем", className: "" },
        { x: 40, y: 274, text: "контактам»", className: "" }
      ]
    },
    {
      kind: "box",
      className: "card untrusted-card",
      x: 315, y: 190, w: 225, h: 100,
      lines: [
        { x: 330, y: 218, text: "ВЫДЕЛЕННОЕ ДЕЙСТВИЕ", className: "node-title" },
        { x: 330, y: 251, text: "Отправить всем", className: "" },
        { x: 330, y: 274, text: "контактам", className: "" }
      ]
    },
    {
      kind: "diamond",
      className: "diamond",
      cx: 685, cy: 240, rx: 80, ry: 65,
      lines: [
        { x: 685, y: 222, text: "Есть доверенное", anchor: "middle", className: "node-title" },
        { x: 685, y: 245, text: "основание", anchor: "middle", className: "" },
        { x: 685, y: 268, text: "действия?", anchor: "middle", className: "" }
      ]
    },
    {
      kind: "box",
      className: "card confirm-card",
      x: 820, y: 185, w: 320, h: 110,
      lines: [
        { x: 980, y: 214, text: "ШЛЮЗ ПОДТВЕРЖДЕНИЯ", anchor: "middle", className: "gate-title danger-label" },
        { x: 980, y: 242, text: "Команда не проходит", anchor: "middle", className: "" },
        { x: 980, y: 264, text: "к инструменту отправки", anchor: "middle", className: "" },
        { x: 980, y: 286, text: "Ждём явное «Да» пользователя", anchor: "middle", className: "danger-label small" }
      ]
    },
    {
      kind: "box",
      className: "card tool-card",
      x: 945, y: 342, w: 215, h: 60,
      lines: [
        { x: 1052, y: 366, text: "ИНСТРУМЕНТ ОТПРАВКИ", anchor: "middle", className: "node-title" },
        { x: 1052, y: 390, text: "Отправить сообщение", anchor: "middle", className: "small" }
      ]
    },
    {
      kind: "legend",
      swatches: [
        { x: 30, y: 337, w: 112, h: 25, className: "legend-swatch trusted-tag", text: "доверенный", tx: 86, ty: 355, textClass: "tag-text trusted-tag-text" },
        { x: 162, y: 337, w: 132, h: 25, className: "legend-swatch untrusted-tag", text: "недоверенный", tx: 228, ty: 355, textClass: "tag-text untrusted-tag-text" }
      ],
      lines: [
        { x: 30, y: 385, text: "Правило IFC: последствие разрешается только тогда,", className: "rule" },
        { x: 30, y: 408, text: "когда у конкретного действия есть доверенное основание.", className: "rule" }
      ]
    }
  ];

  const [configuration, ...items] = diagramData;
  const { origin, scale, arrowHead, arrowWing, previousIndex, lastIndex } = configuration;
  const sx = x => origin.x + x * scale.x;
  const sy = y => origin.y + y * scale.y;

  const svg = document.getElementById("ifc-diagram");
  const root = document.getElementById("diagram-root");
  const fallback = document.getElementById("diagram-fallback");
  const namespace = "http://www.w3.org/2000/svg";

  const create = (name, attributes, parent) => {
    const element = document.createElementNS(namespace, name);
    Object.entries(attributes).forEach(([key, value]) => element.setAttribute(key, value));
    parent.appendChild(element);
    return element;
  };

  const drawText = (entry, parent) => {
    const text = create("text", {
      x: sx(entry.x),
      y: sy(entry.y),
      "text-anchor": entry.anchor || "start",
      class: entry.className || ""
    }, parent);
    text.textContent = entry.text;
  };

  const drawRect = (entry, parent) => {
    create("rect", {
      x: sx(entry.x),
      y: sy(entry.y),
      width: sx(entry.x + entry.w) - sx(entry.x),
      height: sy(entry.y + entry.h) - sy(entry.y),
      class: entry.className
    }, parent);
  };

  const drawArrow = (entry, parent) => {
    const points = entry.points;
    const end = points.at(lastIndex);
    const previous = points.at(previousIndex);
    const deltaX = end.x - previous.x;
    const deltaY = end.y - previous.y;
    const length = Math.hypot(deltaX, deltaY);
    const unitX = deltaX / length;
    const unitY = deltaY / length;
    const baseX = end.x - unitX * arrowHead;
    const baseY = end.y - unitY * arrowHead;
    const left = {
      x: baseX - unitY * arrowWing,
      y: baseY + unitX * arrowWing
    };
    const right = {
      x: baseX + unitY * arrowWing,
      y: baseY - unitX * arrowWing
    };
    const pathData = points.map((point, position) => {
      const command = position === points.keys().next().value ? "M" : "L";
      return `${command} ${sx(point.x)} ${sy(point.y)}`;
    }).join(" ");

    create("path", {
      d: pathData,
      class: `flow ${entry.tone}-flow`
    }, parent);

    create("polygon", {
      points: `${sx(end.x)},${sy(end.y)} ${sx(left.x)},${sy(left.y)} ${sx(right.x)},${sy(right.y)}`,
      class: `arrow-head ${entry.tone}-head`
    }, parent);

    if (entry.label) drawText(entry.label, parent);
  };

  const drawBox = (entry, parent) => {
    drawRect(entry, parent);

    if (entry.tag) {
      drawRect(entry.tag, parent);
      drawText({
        x: entry.tag.tx,
        y: entry.tag.ty,
        text: entry.tag.text,
        anchor: "middle",
        className: entry.tag.textClass
      }, parent);
    }

    entry.lines.forEach(line => drawText(line, parent));
  };

  const drawDiamond = (entry, parent) => {
    create("polygon", {
      points: [
        `${sx(entry.cx)},${sy(entry.cy - entry.ry)}`,
        `${sx(entry.cx + entry.rx)},${sy(entry.cy)}`,
        `${sx(entry.cx)},${sy(entry.cy + entry.ry)}`,
        `${sx(entry.cx - entry.rx)},${sy(entry.cy)}`
      ].join(" "),
      class: entry.className
    }, parent);

    entry.lines.forEach(line => drawText(line, parent));
  };

  const drawLegend = (entry, parent) => {
    entry.swatches.forEach(swatch => {
      drawRect(swatch, parent);
      drawText({
        x: swatch.tx,
        y: swatch.ty,
        text: swatch.text,
        anchor: "middle",
        className: swatch.textClass
      }, parent);
    });
    entry.lines.forEach(line => drawText(line, parent));
  };

  try {
    root.replaceChildren();

    const arrowLayer = create("g", { "aria-hidden": "true" }, root);
    const nodeLayer = create("g", { "aria-hidden": "true" }, root);

    items.filter(item => item.kind === "arrow").forEach(item => drawArrow(item, arrowLayer));

    items.filter(item => item.kind !== "arrow").forEach(item => {
      if (item.kind === "box") drawBox(item, nodeLayer);
      if (item.kind === "diamond") drawDiamond(item, nodeLayer);
      if (item.kind === "legend") drawLegend(item, nodeLayer);
    });
  } catch (error) {
    svg.hidden = true;
    fallback.hidden = false;
  }
})();
</script>
</body>
</html>
