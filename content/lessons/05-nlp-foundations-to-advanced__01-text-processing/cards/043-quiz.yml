- concept: токеном может быть байт, а не только целое слово или символ
  question: Может ли один байт считаться token? Объясни своими словами.
  explanation: Границы tokens определяет токенизатор. Поэтому token не обязан совпадать с целым словом или даже с целым символом.
  kind: open
  reference: Да. Token — это единица, которую потребляет модель согласно выбранному токенизатору; такой единицей может быть слово, часть слова, символ или отдельный байт.
  id: 043-quiz-2
  fingerprint: 12bd8dc6
