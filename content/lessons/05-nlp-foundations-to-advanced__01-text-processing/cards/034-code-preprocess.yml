- concept: при отсутствии POS-теггера preprocess назначает каждому токену тег NOUN
  question: Функция preprocess должна продолжать работу без переданного POS-теггера. Чем заполнить пропуск?
  explanation: Заглушка создаёт для каждого токена пару с тегом NOUN. Функция не падает без теггера, но лемматизация глаголов и других частей речи может оказаться неверной.
  kind: cloze
  template: tags = pos_tagger(tokens) if pos_tagger else ___
  answer: '[(token, "NOUN") for token in tokens]'
  accept:
    - '[(t, "NOUN") for t in tokens]'
    - '[(token, ''NOUN'') for token in tokens]'
    - '[(t, ''NOUN'') for t in tokens]'
  id: 034-code-preprocess-1
  fingerprint: 29c8f8b6
- concept: частичный результат POS-теггера нарушает соответствие между выходными списками preprocess
  question: POS-теггер вернул пары только для части токенов, а preprocess не проверяет полноту результата. Что произойдёт?
  explanation: Леммы вычисляются только по парам, которые вернул теггер. Заглушка с NOUN применяется лишь при полном отсутствии теггера, поэтому частичный результат нарушит выравнивание списков.
  kind: choice
  options:
    - Список lemmas окажется короче списков tokens и stems
    - Отсутствующие пары автоматически получат тег NOUN
    - Список stems также сократится до длины результата теггера
    - Токенизация автоматически запустится повторно
  correct: 0
  id: 034-code-preprocess-2
  fingerprint: 7cd96319
- concept: стемминг и лемматизация являются независимыми ветвями обработки общих токенов
  question: Почему в preprocess стемы следует вычислять из токенов в нижнем регистре, а не из уже полученных лемм?
  explanation: 'Обе нормализации начинаются от общего списка токенов: стеммер получает токены после нормализации регистра, а лемматизатор — пары токена и части речи. Последовательное применение изменило бы контракт preprocess.'
  kind: open
  reference: Стемминг и лемматизация создают разные представления одних и тех же токенов. Если передавать леммы в стеммер, результат стемминга начнёт зависеть от POS-тегов и правил лемматизатора, хотя обе ветви должны независимо исходить из токенов.
  id: 034-code-preprocess-3
  fingerprint: f5a86346
