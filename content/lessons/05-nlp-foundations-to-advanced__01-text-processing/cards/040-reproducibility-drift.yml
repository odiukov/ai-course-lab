- concept: контрольный корпус должен покрывать пограничные случаи токенизации, чувствительные к изменению правил библиотеки
  question: Объясните своими словами, почему в контрольный корпус регрессионного теста токенизации стоит включать предложения с апострофами, URL и временными метками, а не ограничиваться случайными простыми фразами.
  explanation: 'Контрольные предложения подбирают не случайно: они должны задевать правила, которые могут измениться между версиями. Поэтому в набор включают апострофы, URL, время и другие пограничные конструкции.'
  kind: open
  reference: Изменения токенизаторов чаще проявляются на неоднозначных границах токенов. Корпус с такими конструкциями с большей вероятностью обнаружит дрейф поведения библиотеки, тогда как простые фразы могут продолжить обрабатываться одинаково.
  id: 040-reproducibility-drift-1
  fingerprint: 80b73fb9
- concept: эталонные результаты предобработки фиксируют до обновления зависимости и не перезаписывают до анализа различий
  question: Расположите действия в правильном порядке при проверке новой версии библиотеки предобработки.
  explanation: Если сначала получить результаты новой версии и сразу записать их как ожидаемые, тест узаконит дрейф вместо его обнаружения. Замороженный эталон позволяет увидеть каждое изменение токенизации или лемматизации до выпуска.
  kind: order
  items:
    - На проверенной версии выполнить предобработку контрольного корпуса и сохранить точные результаты как эталон
    - Установить кандидатную версию библиотеки в тестовом окружении
    - Запустить тот же корпус, не изменяя сохранённые ожидания
    - Изучить обнаруженные различия и только затем решить, допустимо ли обновление
  id: 040-reproducibility-drift-2
  fingerprint: f0efcf25
