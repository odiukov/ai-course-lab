- concept: более мелкая зернистость токенизации не гарантирует более высокого качества модели
  question: Объясни своими словами, почему переход от слов к отдельным символам не обязательно делает языковую модель точнее.
  explanation: 'Зернистость задаёт компромисс: мелкие токены сохраняют больше деталей, но увеличивают последовательности и объём структуры, которую модель должна выучить самостоятельно.'
  kind: open
  reference: Символьная токенизация позволяет различать мелкие элементы текста, но создаёт более длинные последовательности и не передаёт слова как готовые смысловые единицы. Модели приходится самостоятельно учиться собирать из символов морфемы и слова, поэтому дополнительная детализация может усложнить обучение, а не улучшить качество.
  id: 008-check-zernistost-2
  fingerprint: bd6ba7e3
