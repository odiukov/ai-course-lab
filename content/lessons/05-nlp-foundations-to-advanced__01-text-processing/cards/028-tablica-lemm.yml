- concept: нормализация регистра должна одинаково применяться к табличному поиску и запасным правилам
  question: Лемматизатор ищет ключ `(word.lower(), pos)` в таблице, но затем проверяет суффикс через `word.endswith("ing")`. Как лучше исправить обработку неизвестного слова `JUMPING`?
  explanation: Сейчас поиск в таблице регистронезависим, а запасное правило — регистрозависимо. Если сначала вычислить нормализованное слово, обе ветви будут одинаково обрабатывать `jumping`, `JUMPING` и другие варианты регистра.
  kind: choice
  options:
    - Проверять суффикс только до поиска слова в таблице
    - Добавить в таблицу все варианты написания слова заглавными буквами
    - Один раз привести слово к нижнему регистру и использовать результат во всех ветвях
    - Убрать часть речи из ключа таблицы
  correct: 2
  id: 028-tablica-lemm-1
  fingerprint: 266964c7
- concept: простое удаление суффикса даёт как пропуски преобразований, так и ложные преобразования
  question: Лемматизатор для неизвестных слов удаляет `ing` у глаголов и конечную `s` у существительных. Объясни, почему такое правило может оставить `painted` ненормализованным, но превратить существительное `glass` в ошибочное `glas`.
  explanation: 'Суффиксная эвристика может ошибаться в обе стороны: не преобразовать настоящую словоформу или удалить букву, которая принадлежит основе. Совпадения окончания недостаточно, чтобы надёжно определить лемму.'
  kind: open
  reference: Правило распознаёт форму только по конкретному окончанию и не анализирует морфологию слова. Поэтому оно пропускает глагольные формы с другими окончаниями, например `painted`, и ошибочно принимает часть основы `glass` за показатель множественного числа. Полноценный лемматизатор использует морфологические правила, словарь и исключения.
  id: 028-tablica-lemm-2
