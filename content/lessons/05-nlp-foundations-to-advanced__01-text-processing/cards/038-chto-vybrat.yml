- concept: spaCy подходит для быстрого многоязычного NLP-конвейера в продакшене
  question: Команде нужен быстрый многоязычный NLP-конвейер для продакшена, а заменять отдельные алгоритмы токенизации и нормализации она не планирует. Что разумнее выбрать?
  explanation: spaCy ориентирован на производительные готовые конвейеры и поддерживает множество языков. Он особенно уместен, когда важнее скорость внедрения и выполнения, чем свободная замена каждого компонента.
  kind: choice
  options:
    - Самостоятельно собрать конвейер из компонентов NLTK
    - Использовать готовый конвейер spaCy
    - Применить только регулярные выражения
    - Написать собственный стеммер и POS-теггер
  correct: 1
