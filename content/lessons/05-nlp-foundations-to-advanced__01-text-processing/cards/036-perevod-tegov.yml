- concept: теги прилагательных нельзя переводить из Penn Treebank в WordNet простым копированием первой буквы
  question: Инженер переводит Penn Treebank-теги в WordNet-категории выражением `tag[0].lower()`. Для какого тега результат будет неверным?
  explanation: Penn Treebank обозначает прилагательные тегами на `J`, например `JJ`, а WordNet использует для них код `a`. Поэтому механическое преобразование первой буквы даст ошибочное `j` вместо `a`.
  kind: choice
  options:
    - '`JJ`'
    - '`RB`'
    - '`VBD`'
    - '`NNS`'
  correct: 0
  id: 036-perevod-tegov-1
  fingerprint: c6af1a0e
- concept: переводчик POS-тегов использует категорию существительного как запасной вариант
  question: Заполни запасную ветвь переводчика тегов Penn Treebank в категории WordNet.
  explanation: После отдельных проверок глаголов, прилагательных и наречий функция возвращает `n`. Так существительные и все остальные нераспознанные Penn Treebank-теги попадают в категорию существительных WordNet.
  kind: cloze
  template: |-
    def to_wordnet(tag):
        if tag.startswith("V"):
            return "v"
        if tag.startswith("J"):
            return "a"
        if tag.startswith("R"):
            return "r"
        return ___
  answer: '"n"'
  accept:
    - '''n'''
    - 'n'
  id: 036-perevod-tegov-2
  fingerprint: 4ced14ab
