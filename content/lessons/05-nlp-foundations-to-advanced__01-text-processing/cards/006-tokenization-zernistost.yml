- concept: посимвольная токенизация не требует явно обозначенных пробелами границ слов
  question: Почему посимвольная токенизация может быть полезна для языка, в котором слова обычно не разделяются пробелами?
  explanation: Разбиение по словам опирается на распознавание их границ, а посимвольное разбиение работает и без таких границ. Цена этого решения — более длинные последовательности токенов.
  kind: open
  reference: 'Она не пытается сначала определить границы слов: каждый символ становится отдельным токеном, поэтому отсутствие пробелов не мешает разбиению строки.'
