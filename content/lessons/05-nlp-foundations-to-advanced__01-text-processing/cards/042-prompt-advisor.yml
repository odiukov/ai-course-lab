- concept: указание режима отказа превращает рекомендацию в проверяемую гипотезу
  question: Почему промпт-советчик по предобработке должен вместе с конфигурацией называть режим отказа, который следует проверить тестом?
  explanation: Обоснование объясняет выбор, но само по себе не доказывает его надёжность. Режим отказа связывает совет с конкретным тестом на данных задачи.
  kind: open
  reference: Рекомендация может выглядеть правдоподобно, но ошибаться на пограничных данных. Явно названный режим отказа подсказывает проверку, способную опровергнуть неподходящую конфигурацию до её внедрения.
  id: 042-prompt-advisor-2
  fingerprint: 6a7c03e9
- concept: конкретное имя библиотечной функции устраняет неоднозначность реализации
  question: Заполни вызов NLTK, если советчик выбрал стандартную токенизацию слов и должен выдать исполнимую конфигурацию.
  explanation: Название библиотеки без конкретного вызова оставляет реализацию неоднозначной. Для выбранного варианта NLTK советчик должен назвать функцию `word_tokenize`.
  kind: cloze
  template: tokens = nltk.___(text)
  answer: word_tokenize
  accept:
