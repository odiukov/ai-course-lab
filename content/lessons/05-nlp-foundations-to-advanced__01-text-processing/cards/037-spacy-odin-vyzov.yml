- concept: написание, лемма и часть речи хранятся как атрибуты одного Token
  question: После обработки текста с помощью spaCy переменная token содержит отдельный токен. Как получить его исходное написание, лемму и часть речи?
  explanation: token.text хранит написание из исходного текста, token.lemma_ — словарную форму, а token.pos_ — универсальную метку части речи. Эти сведения привязаны к одному объекту Token, поэтому отдельные списки сопоставлять не требуется.
  kind: choice
  options:
    - token.text, token.lemma_, token.pos_
    - token.word, token.root, token.tag
    - token.text(), token.lemma(), token.pos()
    - doc.text, doc.lemma_, doc.pos_
  correct: 0
  id: 037-spacy-odin-vyzov-2
  fingerprint: add4b739
- concept: интегрированный конвейер spaCy упрощает обработку ценой менее простой замены отдельных компонентов
  question: Объясни своими словами главный компромисс использования готового конвейера spaCy вместо самостоятельного вызова отдельных инструментов токенизации, POS-разметки и лемматизации.
  explanation: Готовый nlp-конвейер уменьшает количество ручной стыковки и предоставляет согласованный Doc. Обратная сторона такой интеграции — меньшая свобода при точечной замене его компонентов.
  kind: open
  reference: spaCy выполняет связанные этапы одним вызовом и возвращает согласованные аннотации на токенах, но заменить отдельный этап собственной реализацией обычно сложнее, чем в конвейере, собранном вручную.
  id: 037-spacy-odin-vyzov-3
  fingerprint: 9eb3ec68
