- concept: альтернатива без квантификатора выделяет каждый знак пунктуации отдельно
  question: Токенизатор использует последнюю альтернативу, сопоставляющую один непробельный символ, который не является буквой или цифрой. Почему последовательность «?!» превратится в два токена, а не в один?
  explanation: В пунктуационном шаблоне нет квантификатора, который разрешал бы одному совпадению охватить несколько соседних знаков. Поэтому каждый знак образует отдельный токен.
  kind: open
  reference: 'Пунктуационная альтернатива сопоставляет ровно один символ за раз: после вопросительного знака поиск продолжается и отдельно находит восклицательный знак. Для объединения последовательности знаков понадобился бы квантификатор повторения.'
