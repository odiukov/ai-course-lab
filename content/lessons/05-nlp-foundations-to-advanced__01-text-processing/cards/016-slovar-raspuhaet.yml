- concept: почти уникальные токены не дают достаточно повторных наблюдений для обучения устойчивой связи с целевым событием
  question: Почему токен, встречающийся только в единственной строке лога, обычно плохо помогает модели распознавать повторяющийся тип ошибки?
  explanation: Обучение опирается на повторяющиеся статистические связи. Почти уникальные значения занимают место в словаре, но не дают модели устойчивого сигнала для обобщения.
  kind: open
  reference: По единственному наблюдению нельзя надёжно оценить связь токена с типом ошибки. Модель скорее запомнит конкретную строку, чем выучит закономерность, применимую к новым логам.
