- concept: неизменный результат лемматизатора не доказывает, что вход уже является леммой
  question: Лемматизатор вернул слово без изменений. Объясните, почему этого недостаточно, чтобы считать нормализацию успешной, и что следует проверить.
  explanation: Совпадение входа и выхода неоднозначно. Например, watched осталось неизменным не потому, что это лемма, а потому, что формы не было среди 10 записей, а запасное правило распознавало только окончание ing.
  kind: open
  reference: Неизменное слово может быть как настоящей словарной формой, так и неизвестной лемматизатору словоформой. Нужно проверить часть речи, наличие формы в словаре, применимость запасных правил и при необходимости сравнить результат с полноценным морфологическим анализатором.
  id: 031-watched-promah-2
  fingerprint: 7197cc41
