- concept: лемматизация приводит словоформы к словарной форме с учётом грамматического контекста
  question: Системе нужно объединять формы одного слова, получая корректную словарную форму, а не просто обрезанную основу. Какой метод подходит лучше всего?
  explanation: Лемматизация сопоставляет словоформы со словарной леммой и может учитывать их грамматическую роль. Стемминг лишь отсекает части слова по правилам, поэтому результат не всегда является настоящим словом.
  kind: choice
  options:
    - Токенизация
    - Лемматизация
    - Стемминг
    - Присвоение токенам целочисленных идентификаторов
  correct: 1
  id: 002-tri-voprosa-1
  fingerprint: ded99995
- concept: агрессивный стемминг может ошибочно объединять разные по смыслу слова
  question: После предобработки тематически не связанные слова стали иметь одинаковое представление, хотя границы токенов определены правильно. Какая причина наиболее вероятна?
  explanation: Стеммер механически отсекает суффиксы и окончания. Слишком грубые правила могут свести разные по смыслу слова к одной основе и тем самым испортить поиск, классификацию или тематическое моделирование.
  kind: choice
  options:
    - Слишком агрессивные правила стемминга
    - Слишком большой словарь токенов
    - Сохранение знаков препинания
    - Использование лемматизации с корректными частями речи
