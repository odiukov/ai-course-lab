- concept: шаблоны для структурированных сущностей следует ставить перед общими альтернативами регулярного токенизатора
  question: Регулярный токенизатор должен сохранять адрес электронной почты одним токеном. Как следует встроить соответствующий шаблон в существующее выражение и почему?
  explanation: Регулярные альтернативы проверяются в заданном порядке. Специальные конструкции вроде адресов электронной почты и URL нужно распознавать раньше общих буквенных и пунктуационных фрагментов.
  kind: open
  reference: Добавить шаблон адреса электронной почты перед общими шаблонами слов, чисел и пунктуации. Тогда более специфичная альтернатива захватит адрес целиком раньше, чем общие правила разобьют его на части.
