  fingerprint: 3f563506
- concept: непоследовательные границы токенов расщепляют обучающую статистику
  question: В одной части обучающего корпуса выражение с апострофом представлено одним токеном, а в другой — двумя. Почему это может ухудшить обучение модели?
  explanation: Модель учится по последовательностям идентификаторов. Если одна конструкция токенизируется по-разному, обучающее распределение дробится и каждое представление получает меньше полезных примеров.
  kind: open
  reference: Одинаковая языковая конструкция получает разные последовательности идентификаторов, поэтому её контексты и частоты распределяются между несколькими представлениями. Модели сложнее накопить согласованную статистику.
  id: 001-modeli-chitayut-chisla-2
  fingerprint: 1c9e0db5
