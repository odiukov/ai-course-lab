- concept: момент early stopping выбирают по качеству на валидационных данных
  question: Какой сигнал следует использовать для early stopping при обучении gradient boosting?
  explanation: Early stopping оценивает способность ансамбля обобщать, поэтому ориентируется на валидационную ошибку. Обучающая ошибка может продолжать снижаться даже тогда, когда новые деревья уже не помогают на новых данных.
  kind: choice
  options:
    - Снижение ошибки на обучающей выборке
    - Улучшение ошибки на отдельной валидационной выборке
    - Увеличение глубины очередного дерева
    - Рост суммарного числа листьев в ансамбле
  correct: 1
  id: 040-early-stopping-1
  fingerprint: 99e2aa04
- concept: счётчик терпения увеличивается при отсутствии улучшения и сбрасывается при новом минимуме
  question: Расположите действия алгоритма early stopping в правильном порядке.
  explanation: Терпение измеряет число последовательных раундов без нового минимума валидационной ошибки. Любое улучшение начинает отсчёт заново, а достижение порога завершает обучение.
  kind: order
  items:
    - После очередного раунда вычислить ошибку на валидационной выборке
    - Сравнить полученную ошибку с лучшим сохранённым значением
    - При новом минимуме сохранить ансамбль и сбросить счётчик, иначе увеличить счётчик
    - При исчерпании терпения остановить обучение и восстановить лучший сохранённый ансамбль
  id: 040-early-stopping-2
  fingerprint: e0d633cd
- concept: после early stopping используют ансамбль с минимальной валидационной ошибкой, а не последнюю обученную версию
  question: Обучение gradient boosting остановилось после нескольких раундов без улучшения, но минимальная валидационная ошибка была достигнута раньше. Какую версию ансамбля нужно использовать и почему?
  explanation: Порог терпения намеренно сдвигает момент остановки относительно лучшего раунда. Поэтому early stopping должен сопровождаться сохранением лучшего состояния ансамбля.
  kind: open
  reference: Нужно восстановить сохранённую версию ансамбля, на которой валидационная ошибка была минимальной. Последующие раунды нужны лишь для проверки, не окажется ли ухудшение временным, поэтому модель в момент остановки не обязательно является лучшей.
  id: 040-early-stopping-3
  fingerprint: 877c91df
