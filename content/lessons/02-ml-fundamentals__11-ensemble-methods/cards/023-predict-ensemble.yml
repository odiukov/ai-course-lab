- concept: предсказания моделей группируются по объектам перед голосованием
  question: Список predictions содержит по одному вектору меток от каждой модели. Заполни пропуск, чтобы majority_vote получала голоса всех моделей отдельно для каждого объекта.
  explanation: 'Распаковка predictions в zip транспонирует логику обхода: каждая полученная группа содержит метки разных моделей для одной и той же позиции в X. Поэтому голоса разных объектов не смешиваются.'
  kind: cloze
  template: result = [majority_vote(votes) for votes in ___]
  answer: zip(*predictions)
  accept:
    - zip(*predictions)
    - list(zip(*predictions))
  id: 023-predict-ensemble-1
  fingerprint: fbc6a92d
- concept: форма итогового прогноза ансамбля определяется числом входных объектов
  question: Классификационный ансамбль получает пакет объектов X и список models. Какую форму должен иметь итоговый результат после голосования?
  explanation: Каждый объект из X получает собственное голосование среди моделей и одну итоговую метку. Число моделей определяет количество голосов, но не длину результата.
  kind: choice
  options:
    - (len(X),) — вектор итоговых меток, индексированный объектами
    - (len(models),) — вектор итоговых меток, индексированный моделями
    - (len(models), len(X)) — матрица необъединённых прогнозов
    - () — одна общая метка для всего пакета
  correct: 0
