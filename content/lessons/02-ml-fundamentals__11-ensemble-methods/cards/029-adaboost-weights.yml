- concept: AdaBoost начинает обучение с одинаковых весов всех объектов
  question: Обучающая выборка содержит 8 объектов. Какой начальный вес получит каждый объект в AdaBoost?
  explanation: При равномерной инициализации каждому объекту назначается вес w_i = 1/N. Поэтому при N = 8 вес равен 1/8 = 0,125.
  kind: numeric
  answer: 0.125
  tolerance: 0.0001
  id: 029-adaboost-weights-1
  fingerprint: 70c2b71d
- concept: деление на сумму весов делает взвешенную ошибку независимой от общего масштаба весов
  question: Зачем в формуле взвешенной ошибки AdaBoost сумму весов ошибочно классифицированных объектов делят на сумму всех весов?
  explanation: Числитель и знаменатель при общем масштабировании весов изменяются в одинаковое число раз, поэтому их отношение остаётся прежним. Если веса уже нормированы и в сумме дают 1, знаменатель можно численно не учитывать.
  kind: choice
  options:
    - Чтобы общее умножение всех весов на один и тот же положительный коэффициент не меняло ошибку
    - Чтобы правильно классифицированные объекты всегда влияли сильнее ошибочно классифицированных
    - Чтобы взвешенная ошибка зависела только от количества объектов в выборке
    - Чтобы любая слабая модель автоматически становилась лучше случайного классификатора
