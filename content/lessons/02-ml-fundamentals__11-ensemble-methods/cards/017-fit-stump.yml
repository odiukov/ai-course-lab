- concept: значение минимума и достигшие его параметры кандидата нужно сохранять совместно
  question: Почему при обнаружении меньшей ошибки decision stump нужно одновременно обновить минимальную ошибку, индекс признака, порог и полярность?
  explanation: Поиск должен хранить не только минимальное значение целевой функции, но и соответствующий ему аргумент. Для stump этим аргументом является совместная комбинация признака, порога и полярности.
  kind: open
  reference: Все сохранённые значения должны описывать один и тот же лучший кандидат. Если обновить ошибку отдельно от параметров, итоговая модель может получить комбинацию, которая никогда не участвовала в сравнении и не достигала сохранённого минимума.
