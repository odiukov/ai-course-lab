- concept: взвешенная ошибка stump равна сумме весов неверно классифицированных объектов
  question: Decision stump неверно классифицировал объекты с весами 0,12, 0,19 и 0,27. Чему равна его взвешенная ошибка?
  explanation: 'Нужно сложить веса только ошибочно классифицированных объектов: 0,12 + 0,19 + 0,27 = 0,58. Количество верных и неверных прогнозов без учёта весов здесь недостаточно.'
  kind: numeric
  answer: 0.58
  tolerance: 0.001
  id: 016-fit-stump-theory-1
  fingerprint: 777cc76a
- concept: decision stump выбирается полным перебором признаков, порогов и направлений по минимальной взвешенной ошибке
  question: Расположите действия обучения decision stump в правильном порядке.
  explanation: Stump последовательно оценивает все доступные комбинации признака, порога и направления правила. Лучшей считается комбинация с минимальной суммой весов объектов, на которых прогноз не совпал с меткой.
  kind: order
  items:
    - Перебрать признаки и получить для каждого признакa множество допустимых порогов.
    - Для очередного порога проверить оба направления присвоения классов.
    - Построить прогнозы и сложить веса ошибочно классифицированных объектов.
    - Сохранить признак, порог и направление с наименьшей взвешенной ошибкой.
  id: 016-fit-stump-theory-2
  fingerprint: 11294ee1
- concept: полярность позволяет обратить соответствие сторон порога меткам классов
  question: Зачем при проверке фиксированного признака и порога decision stump рассматривает обе полярности?
  explanation: Сам порог только делит значения на две стороны, но не определяет, какой класс назначить каждой стороне. Проверка обеих полярностей позволяет выбрать как прямое, так и обратное правило.
  kind: choice
  options:
    - Чтобы автоматически изменить веса обучающих объектов
    - Чтобы использовать разные подмножества строк для одного порога
    - Чтобы проверить оба возможных соответствия между сторонами порога и метками классов
  correct: 2
  id: 016-fit-stump-theory-3
  fingerprint: 3274920a
