- concept: boosting последовательно переносит внимание на ошибки текущего ансамбля
  question: Расположите этапы обучения boosting-ансамбля в правильном порядке.
  explanation: После каждого раунда boosting повышает значимость трудных объектов. Поэтому очередная модель обучается с учётом ошибок уже накопленного ансамбля.
  kind: order
  items:
    - Назначить исходные веса обучающим объектам
    - Обучить базовую модель с учётом текущих весов
    - Определить объекты, на которых накопленный ансамбль ошибается
    - Обновить веса, усилив влияние ошибочно предсказанных объектов
    - Продолжить последовательное обучение и объединить полученные модели
  id: 026-boosting-sequence-1
  fingerprint: 7a87b226
- concept: итоговый прогноз boosting формируется взвешенным объединением базовых моделей
  question: Как обычно формируется итоговый прогноз boosting-ансамбля?
  explanation: Boosting сохраняет ранее обученные модели и объединяет их ответы. Более успешные базовые модели могут получить больший вес в итоговом прогнозе.
  kind: choice
  options:
    - Используется только прогноз самой новой модели
    - Прогнозы моделей объединяются с весами, отражающими их качество
    - Из прогнозов случайно выбирается один
    - Все обучающие объекты получают одинаковый прогноз
  correct: 1
  id: 026-boosting-sequence-2
  fingerprint: 2d6540f3
- concept: чрезмерное число раундов boosting может привести к подгонке под шум
  question: Почему продолжительное обучение boosting-ансамбля способно вызвать переобучение?
  explanation: После исправления закономерных ошибок среди объектов с большим весом может остаться шум. Новые модели продолжат подгоняться под него, ухудшая обобщение.
  kind: choice
  options:
    - Алгоритм постепенно прекращает учитывать трудные примеры
    - Все базовые модели начинают обучаться независимо
    - Алгоритм может всё сильнее подстраиваться под шумные и аномальные примеры
    - Итоговый прогноз автоматически заменяется случайным
  correct: 2
  id: 026-boosting-sequence-3
  fingerprint: c0789b13
