- concept: bagging создаёт разнообразие базовых моделей за счёт разных версий обучающих данных
  question: Какой сценарий обучения соответствует bagging, если базовый алгоритм и его настройки остаются одинаковыми?
  explanation: В bagging различаются данные, полученные моделями, а не обязательно алгоритмы или настройки. Благодаря разным обучающим выборкам базовые модели могут выучить разные случайные закономерности, после чего их прогнозы объединяются.
  kind: choice
  options:
    - Каждую модель независимо обучают на своей версии исходной обучающей выборки, а затем объединяют прогнозы
    - Все модели обучают на одной и той же выборке, после чего выбирают прогноз первой модели
    - Каждая следующая модель обучается специально исправлять ошибки предыдущей
  correct: 0
  id: 010-bagging-idea-1
  fingerprint: 03c4ece0
- concept: базовые модели bagging обучаются независимо и не исправляют решения друг друга
  question: Объясни своими словами, что означает независимое обучение моделей в bagging и почему их можно обучать параллельно.
  explanation: В bagging нет последовательной цепочки, где новая модель ждёт результат предыдущей. Каждая модель решает задачу самостоятельно на своей выборке, а взаимодействие появляется лишь на этапе объединения прогнозов.
  kind: open
  reference: Каждая базовая модель получает свою версию обучающих данных и обучается без доступа к прогнозам или ошибкам остальных моделей. Зависимости между этапами обучения нет, поэтому модели можно обучать одновременно; их ответы объединяются только после обучения.
  id: 010-bagging-idea-2
  fingerprint: 009947cc
