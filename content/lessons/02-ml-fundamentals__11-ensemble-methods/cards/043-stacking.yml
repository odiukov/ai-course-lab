- concept: мета-модель учится учитывать совместную картину прогнозов и условную надёжность базовых моделей
  question: Объясните своими словами, чем объединение прогнозов в stacking отличается от простого голосования большинством.
  explanation: Мета-модель изучает связь между совместной картиной прогнозов и правильным ответом. Поэтому один и тот же базовый алгоритм может получать разное влияние в зависимости от прогнозов остальных моделей.
  kind: open
  reference: При простом голосовании учитывается число голосов за каждый ответ. В stacking мета-модель обучается на сочетаниях прогнозов и может по-разному доверять базовым моделям в разных ситуациях, учитывая их согласие и разногласия.
