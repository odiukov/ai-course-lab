- concept: отношение весов ошибочного и верно классифицированного объектов после обновления равно экспоненте удвоенного alpha
  question: Объекты A и B имели одинаковые веса. Stump с коэффициентом alpha = 0.7 ошибся на A и правильно классифицировал B. Во сколько раз после обновления и нормализации вес A будет больше веса B?
  explanation: Вес A умножается на exp(0.7), а вес B — на exp(-0.7). Их отношение становится exp(0.7) / exp(-0.7) = exp(1.4) ≈ 4.06. Нормализация делит оба веса на одну сумму и не меняет это отношение.
  kind: numeric
  answer: 4.06
  tolerance: 0.02
