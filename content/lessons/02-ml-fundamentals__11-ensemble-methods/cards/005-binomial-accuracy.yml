- concept: вероятность правильного большинства равна верхнему хвосту биномиального распределения
  question: Ансамбль состоит из 7 независимых классификаторов, каждый из которых отвечает правильно с вероятностью 80%. Какова вероятность правильного решения при голосовании большинством? Ответ дай десятичной дробью.
  explanation: 'Большинству нужны как минимум 4 правильных голоса, поэтому складываются биномиальные вероятности для k от 4 до 7: сумма C(7,k)·0.8^k·0.2^(7-k) равна 0.966656.'
  kind: numeric
  answer: 0.966656
  tolerance: 0.0001
  id: 005-binomial-accuracy-2
