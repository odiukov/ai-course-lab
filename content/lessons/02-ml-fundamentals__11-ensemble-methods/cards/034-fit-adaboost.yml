- concept: после стандартного обновления AdaBoost суммарные веса ошибочных и верно классифицированных объектов выравниваются
  question: В раунде бинарного AdaBoost взвешенная ошибка stump не является крайней, поэтому clipping её не изменил. Как после обновления и нормализации соотносятся суммарные веса ошибочных и верно классифицированных объектов?
  explanation: Обозначим исходные массы ошибочных и верных ответов через e и c. После обновления они равны e·exp(alpha) и c·exp(-alpha). Подстановка alpha как половины логарифма отношения c к e показывает, что эти выражения равны. Нормализация сохраняет равенство.
  kind: choice
  options:
    - Ошибочные объекты получают больший суммарный вес
    - Верно классифицированные объекты получают больший суммарный вес
    - Обе группы получают одинаковый суммарный вес
  correct: 2
  id: 034-fit-adaboost-1
  fingerprint: dd3d3b68
- concept: каждый stump должен использоваться с коэффициентом alpha того же раунда
  question: Заполните пропуск так, чтобы при вычислении голоса ансамбля каждый stump использовался с соответствующим ему коэффициентом.
  explanation: Модель и её alpha сохраняются в одном раунде и должны извлекаться синхронно. zip объединяет элементы с одинаковыми позициями, не смешивая коэффициенты разных stump.
  kind: cloze
  template: total = sum(alpha * predict_stump(stump, X) for alpha, stump in ___)
  answer: zip(alphas, stumps)
  accept:
    - zip(self.alphas, self.stumps)
  id: 034-fit-adaboost-2
  fingerprint: 015874eb
- concept: экспоненциальное перевзвешивание AdaBoost требует симметричного знакового кодирования классов
  question: Почему обновление `weights *= exp(-alpha * y * pred)` работает как задумано со знаковыми метками классов, но ломается при кодировании меток нулём и единицей?
  explanation: AdaBoost различает правильные ответы и промахи по знаку произведения `y * pred`. Нулевая метка уничтожает этот сигнал, поэтому классы перед обучением нужно представить противоположными знаками.
  kind: open
  reference: 'При знаковом кодировании произведение истинной метки и прогноза положительно для верного ответа и отрицательно для ошибки, поэтому их веса изменяются в противоположных направлениях. Если истинная метка или прогноз равны нулю, произведение и показатель экспоненты обнуляются: вес такого объекта не меняется даже тогда, когда модель ошиблась.'
  id: 034-fit-adaboost-3
  fingerprint: bd61b7df
