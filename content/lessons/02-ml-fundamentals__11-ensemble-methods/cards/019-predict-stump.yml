- concept: при предсказании decision stump использует только признак, выбранный во время обучения
  question: Заполни пропуск так, чтобы decision stump применял порог к выбранному при обучении признаку.
  explanation: Decision stump хранит индекс признака, на котором найдено лучшее разбиение. Поэтому predict извлекает столбец X[:, feature_idx], а остальные признаки при вычислении этой модели не использует.
  kind: cloze
  template: |-
    values = ___
    mask = polarity * values < polarity * threshold
  answer: X[:, feature_idx]
  accept:
    - X[:,feature_idx]
    - X[:, feature_idx]
  id: 019-predict-stump-1
  fingerprint: 92f935a6
- concept: векторизованное предсказание decision stump строится через начальную разметку и замену по булевой маске
  question: Расположи операции в порядке, необходимом для получения предсказаний обученного decision stump.
  explanation: Сначала все объекты получают метку +1. Затем условие polarity * value < polarity * threshold выделяет нужные строки, и только в них метка заменяется на -1. Такой порядок сразу гарантирует одно предсказание для каждой строки X.
  kind: order
  items:
    - Создать массив длиной по числу строк входной матрицы и заполнить его положительной меткой.
    - По выбранному столбцу вычислить булеву маску с использованием порога и полярности.
    - Заменить на отрицательную метку ответы в строках, отмеченных маской.
  id: 019-predict-stump-2
  fingerprint: 06ac4eee
