- concept: при квадратичной ошибке следующее дерево обучается на остатке y минус текущий прогноз ансамбля
  question: Истинная цена объекта равна 25 млн рублей, а текущий ансамбль предсказывает 16 млн. Какое целевое значение получит для этого объекта следующее дерево градиентного бустинга при квадратичной ошибке?
  explanation: При квадратичной ошибке целевое значение нового дерева — остаток y − F(x). Здесь он равен 25 − 16 = 9 млн рублей. Положительный знак означает, что прогноз ансамбля нужно увеличить.
  kind: numeric
  answer: 9
  tolerance: 0.001
  id: 037-gradient-residuals-1
  fingerprint: c2a5f002
- concept: для произвольной дифференцируемой функции потерь псевдоостаток равен отрицательному градиенту по текущему прогнозу
  question: Какую цель задают новой базовой модели в градиентном бустинге, если используется произвольная дифференцируемая функция потерь?
  explanation: Новая модель приближает псевдоостатки — отрицательный градиент функции потерь по прогнозу ансамбля. Это задаёт направление изменения прогноза, которое уменьшает потерю; для квадратичной ошибки оно совпадает с обычным остатком.
  kind: choice
  options:
    - Исходные целевые значения без учёта текущего ансамбля
    - Текущие прогнозы ансамбля
    - Отрицательный градиент функции потерь по текущему прогнозу
    - Веса объектов, пропорциональные величине ошибки
  correct: 2
