- concept: bootstrap использует случайный выбор с возвращением
  question: Заполни параметр, чтобы получить bootstrap-индексы для выборки того же размера, что и исходные данные.
  explanation: 'Параметр replace=True включает выбор с возвращением: после каждого вытягивания индекс снова может быть выбран, поэтому в результате возможны повторы.'
  kind: cloze
  template: idx = rng.choice(len(X), size=len(X), replace=___)
  answer: 'True'
  accept:
    - 'true'
    - 'TRUE'
  id: 011-bootstrap-indices-1
  fingerprint: 9b592a47
- concept: одни и те же bootstrap-индексы применяются к признакам и целевым меткам
  question: Для обучения с учителем получен список bootstrap-индексов. Как правильно собрать выборки признаков и целевых меток?
  explanation: Одинаковые индексы сохраняют соответствие между наблюдением и его правильным ответом. Если индекс повторяется, вместе повторяются и строка признаков, и связанная с ней метка.
  kind: choice
  options:
    - Независимо сгенерировать новые индексы для признаков и меток
    - Применить индексы только к признакам, а метки оставить без изменений
    - Отдельно отсортировать признаки и метки после выборки
    - Применить одну и ту же последовательность индексов к признакам и меткам
  correct: 3
  id: 011-bootstrap-indices-2
  fingerprint: 298b7cd7
- concept: размер bootstrap-выборки и число уникальных объектов — разные величины
  question: Объясни своими словами, почему bootstrap-выборка может иметь столько же позиций, сколько исходный набор, но содержать меньше уникальных объектов.
  explanation: Повторные попадания занимают отдельные позиции выборки, но не добавляют новых уникальных объектов. Одновременно часть исходных наблюдений может ни разу не быть выбрана.
  kind: open
  reference: Число случайных вытягиваний задаёт размер bootstrap-выборки. Поскольку выбор выполняется с возвращением, некоторые исходные объекты могут попасть в неё повторно, а другие — не попасть вовсе. Поэтому количество позиций сохраняется, а количество уникальных объектов может быть меньше.
  id: 011-bootstrap-indices-3
  fingerprint: 94d142ff
