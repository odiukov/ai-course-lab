- concept: зависимость точности большинства от размера ансамбля нелинейна и имеет убывающую абсолютную отдачу
  question: Объясни, почему одинаковое увеличение размера ансамбля не обязано каждый раз давать одинаковую прибавку к точности голосования большинством.
  explanation: 'Переход от 21 к 101 модели увеличивает число участников почти в пять раз, но точность растёт лишь с 74% до 84%. Прибыль нельзя масштабировать пропорционально числу моделей: результат постепенно приближается к потолку в 100%.'
  kind: open
  reference: Точность большинства зависит от числа моделей нелинейно и ограничена сверху. По мере уменьшения оставшейся вероятности ошибки дальнейшее добавление независимых моделей продолжает помогать, но абсолютная прибавка к точности обычно становится меньше.
