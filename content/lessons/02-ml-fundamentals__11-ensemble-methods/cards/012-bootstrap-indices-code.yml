- concept: вероятность того, что объект не попадёт в bootstrap-выборку
  question: В наборе 10 объектов. Bootstrap-выборка того же размера формируется с возвращением. Какова вероятность, что некоторый фиксированный объект не будет выбран ни разу?
  explanation: При каждом вытягивании объект пропускают с вероятностью 9/10. Для всей выборки вероятность равна (9/10)^10 ≈ 0.349. При увеличении набора она стремится примерно к 36.8% — ожидаемой доле out-of-bag объектов.
  kind: numeric
  answer: 0.349
  tolerance: 0.002
  id: 012-bootstrap-indices-code-1
  fingerprint: 1c55b3d9
- concept: out-of-bag объекты дают валидационные данные для модели, обученной на bootstrap-выборке
  question: Как получить оценку качества отдельной модели в bagging без специального валидационного разбиения?
  explanation: Объекты, не выбранные в bootstrap-выборку конкретной модели, называются out-of-bag. Эта модель их не видела при обучении, поэтому на них можно оценивать её качество; обычно таких объектов около 36.8%.
  kind: choice
  options:
    - Оценить модель на исходных объектах, не попавших в её bootstrap-выборку
    - Оценить модель на тех же объектах, на которых она обучалась
    - Использовать только среднюю тренировочную ошибку всех моделей
  correct: 0
  id: 012-bootstrap-indices-code-2
  fingerprint: 936ddc58
