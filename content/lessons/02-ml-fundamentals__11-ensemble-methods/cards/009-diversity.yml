- concept: полезное разнообразие определяется ошибками относительно истинных меток, а не простым расхождением предсказаний
  question: Две модели часто выдают разные метки. Почему этого недостаточно, чтобы признать их полезной парой для ансамбля, и что следует проверить на размеченной выборке?
  explanation: Ансамблю помогает не любое различие ответов, а взаимное компенсирование ошибок. Поэтому оценивают совпадение промахов и случаи, когда правильный ответ одной модели исправляет ошибку другой.
  kind: open
  reference: 'Нужно сопоставить предсказания с истинными метками и изучить совместные ошибки: как часто одна модель отвечает правильно именно на тех объектах, где другая ошибается. Простое расхождение может возникать из-за дополнительных ошибок и само по себе не означает, что модели прикрывают слабые места друг друга.'
  id: 009-diversity-2
