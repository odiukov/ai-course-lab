- concept: соотношение ошибок на обучении и проверке позволяет отличить высокий bias от высокого variance
  question: У модели A ошибка велика и на обучающей, и на проверочной выборке, причём значения близки. У модели B ошибка на обучении мала, а на проверке заметно выше и сильно меняется при смене выборки. Какой диагноз верен?
  explanation: Большая ошибка уже на обучении указывает на недообучение и высокий bias — здесь уместен boosting. Малая обучающая ошибка при нестабильной проверочной указывает на высокий variance — здесь логичны bagging или random forest.
  kind: choice
  options:
    - У модели A высокий bias, у модели B высокий variance
    - У модели A высокий variance, у модели B высокий bias
    - У обеих моделей высокий bias
    - У обеих моделей высокий variance
  correct: 0
  id: 046-method-selection-1
  fingerprint: b398c664
- concept: stacking способен уменьшать bias и variance, но усложняет систему и создаёт риск переобучения мета-модели
  question: Когда stacking может быть оправдан вместо более простого объединения моделей и какой риск особенно важно контролировать?
  explanation: Stacking обучает мета-модель комбинировать прогнозы базовых моделей, поэтому способен работать и с bias, и с variance. Однако без аккуратной валидации его дополнительная гибкость повышает риск переобучения.
  kind: open
  reference: Stacking оправдан, когда уже есть сильные различающиеся базовые модели и требуется дополнительный прирост качества. За гибкость приходится платить сложностью, а мета-модель может переобучиться.
  id: 046-method-selection-2
  fingerprint: 803b44e2
