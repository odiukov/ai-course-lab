- concept: learning rate масштабирует вклад очередного дерева в прогноз градиентного бустинга
  question: Текущий прогноз градиентного бустинга равен 45. Очередное дерево предлагает поправку 16, а learning rate равен 0.25. Каким станет прогноз после обновления?
  explanation: 'Обновление равно learning_rate × поправка дерева: 0.25 × 16 = 4. Поэтому новый прогноз равен 45 + 4 = 49.'
  kind: numeric
  answer: 49
  tolerance: 0.001
  id: 039-learning-rate-1
  fingerprint: a0551425
- concept: learning rate и количество деревьев образуют компромисс между осторожностью и скоростью обучения
  question: В градиентном бустинге learning rate заметно уменьшили, не меняя остальных настроек. Какое изменение обычно требуется, чтобы ансамбль успел достичь сопоставимого качества?
  explanation: Меньший learning rate ослабляет вклад каждого дерева, поэтому для накопления достаточной суммарной поправки обычно нужно больше деревьев. Это делает обучение медленнее, но часто улучшает обобщение.
  kind: choice
  options:
    - Увеличить количество деревьев
    - Уменьшить количество деревьев
    - Заменить остатки исходными целевыми значениями
    - Обучать все деревья независимо
  correct: 0
  id: 039-learning-rate-2
  fingerprint: 3bbeb9d1
- concept: уменьшение learning rate ограничивает влияние каждой отдельной поправки, но не повышает точность базового дерева
  question: Объясни своими словами, почему уменьшение learning rate может сделать градиентный бустинг устойчивее, хотя само очередное дерево от этого не становится точнее.
  explanation: Learning rate не меняет найденную деревом функцию, а сокращает величину шага при добавлении этой функции в ансамбль. Ошибка отдельного дерева поэтому оказывает меньшее влияние на итоговый прогноз.
  kind: open
  reference: Learning rate применяется после обучения дерева и масштабирует его вклад в ансамбль. Поэтому неточная или чрезмерная поправка слабее изменяет общий прогноз; следующие деревья затем работают с обновлёнными остатками. Цена такой осторожности — необходимость обучить больше деревьев.
  id: 039-learning-rate-3
  fingerprint: a7fbdbe4
