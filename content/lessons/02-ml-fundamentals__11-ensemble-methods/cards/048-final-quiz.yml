  kind: choice
  options:
    - XGBoost — вариант градиентного бустинга с регуляризацией, оптимизацией второго порядка и ускорениями реализации
    - XGBoost — разновидность stacking с деревом в роли мета-модели
    - XGBoost — bagging деревьев без последовательного исправления ошибок
