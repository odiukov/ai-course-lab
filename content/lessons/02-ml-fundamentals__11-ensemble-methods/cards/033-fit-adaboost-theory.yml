- concept: каждый раунд AdaBoost передаёт обновлённые веса следующему базовому классификатору
  question: Расположите действия одного раунда AdaBoost и перехода к следующему в правильном порядке.
  explanation: Сначала stump обучается с текущими весами. Его ошибка определяет alpha, затем alpha используется для перевзвешивания объектов. После нормализации именно новые веса поступают в следующий раунд.
  kind: order
  items:
    - Обучить новый stump с текущими весами объектов
    - Получить предсказания и вычислить взвешенную ошибку stump
    - Рассчитать коэффициент alpha по взвешенной ошибке
    - Обновить и нормализовать веса объектов
    - Передать обновлённые веса в следующий раунд
  id: 033-fit-adaboost-theory-1
  fingerprint: 28c2986f
- concept: ограничение крайних значений ошибки сохраняет коэффициент alpha конечным
  question: Зачем перед вычислением alpha ограничивать взвешенную ошибку stump так, чтобы она не достигала точных границ допустимого интервала?
  explanation: При нулевой или предельной ошибке отношение внутри логарифма вырождается, поэтому alpha становится бесконечным по модулю. `np.clip` слегка отодвигает ошибку от границ и обеспечивает конечное вычисление.
  kind: choice
  options:
    - Чтобы логарифм не привёл к бесконечному значению alpha или делению на ноль
    - Чтобы все обученные stumps получили одинаковый коэффициент alpha
    - Чтобы заменить нормализацию весов после их обновления
    - Чтобы преобразовать непрерывные признаки в бинарные
  correct: 0
  id: 033-fit-adaboost-theory-2
  fingerprint: 6bc014e9
