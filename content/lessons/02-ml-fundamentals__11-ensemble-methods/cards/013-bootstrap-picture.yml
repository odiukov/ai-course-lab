- concept: кратность появления объекта в bootstrap-выборке задаёт его эффективный вес при обучении базовой модели
  question: Объясни своими словами, почему разные количества повторов строк могут привести к разным моделям, даже если набор уникальных строк в bootstrap-выборках совпадает.
  explanation: Алгоритм обрабатывает не только уникальные строки, а все позиции bootstrap-выборки. Повторяющийся объект учитывается многократно и получает больший эффективный вес.
  kind: open
  reference: 'Каждое появление строки занимает отдельную позицию и снова участвует в обучении. Поэтому строка с большей кратностью сильнее влияет на функцию потерь и параметры модели: одинаковый набор уникальных строк при разных кратностях задаёт разные эффективные веса объектов.'
