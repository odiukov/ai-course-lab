- concept: для классификации типичное число признаков-кандидатов пропорционально квадратному корню из общего числа признаков
  question: Заполни распространённую эвристику random forest для задачи классификации.
  explanation: Если всего доступно d признаков, для классификации часто рассматривают примерно sqrt(d) случайных кандидатов в каждом узле. Для регрессии распространена другая эвристика — около трети признаков.
  kind: cloze
  template: max_features = ___
  answer: sqrt(d)
  accept:
    - √d
    - корень из d
