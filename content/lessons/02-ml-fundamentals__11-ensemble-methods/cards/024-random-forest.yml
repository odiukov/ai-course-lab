- concept: случайное подмножество признаков выбирается заново для каждого разбиения дерева
  question: Как random forest ограничивает признаки при построении очередного узла дерева?
  explanation: 'В каждом узле random forest заново выбирает случайное подмножество признаков и ищет лучшее разбиение только среди них. Не попавший в набор признак не удаляется: он может стать кандидатом в другом узле.'
  kind: choice
  options:
    - Один набор признаков выбирается для всего леса, остальные признаки удаляются
    - Один набор признаков выбирается для дерева и используется во всех его узлах
    - Для текущего узла выбирается случайный набор кандидатов, а в следующем узле жеребьёвка повторяется
    - Случайно выбранный признак обязательно используется без сравнения с другими кандидатами
  correct: 2
  id: 024-random-forest-1
  fingerprint: 02e27119
- concept: размер подмножества признаков задаёт компромисс между силой отдельных деревьев и разнообразием леса
  question: Объясни своими словами, что обычно происходит с деревьями random forest при слишком большом и при слишком маленьком числе признаков-кандидатов на разбиение.
  explanation: Параметр числа признаков-кандидатов балансирует качество отдельного дерева и различие между деревьями. Полезен промежуточный размер, при котором деревья достаточно сильны, но не повторяют одну и ту же структуру.
  kind: open
  reference: При слишком большом наборе сильные признаки часто выбираются разными деревьями, поэтому деревья становятся похожими и их ошибки сильнее коррелируют. При слишком маленьком наборе деревья разнообразнее, но отдельные разбиения и сами деревья могут стать слабее.
