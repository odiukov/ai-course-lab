- concept: ничья в чётном ансамбле не считается правильным решением строгого большинства
  question: В ансамбле из 14 классификаторов ровно 7 дали правильный ответ. Нужно ли учитывать этот исход при вычислении вероятности правильного решения большинства?
  explanation: Для строгого большинства правильных голосов должно быть больше половины. При результате 7 против 7 возникает ничья, поэтому такой исход не добавляется к точности голосования.
  kind: choice
  options:
    - Да, это минимально достаточное число правильных голосов
    - Да, но только с половинным весом
    - Только если точность отдельного классификатора выше средней
    - Нет, при равенстве голосов строгого большинства нет
  correct: 3
  id: 006-vote-accuracy-1
  fingerprint: 76eab057
- concept: биномиальная формула точности голосования предполагает независимые испытания с одинаковой вероятностью успеха
  question: При каком условии число классификаторов, ответивших правильно, можно моделировать биномиальным распределением?
  explanation: Биномиальное распределение описывает сумму независимых испытаний Бернулли с общей вероятностью успеха. При зависимых ошибках число правильных голосов может иметь другое распределение, и биномиальная сумма даст неверную оценку.
  kind: choice
  options:
    - Все классификаторы обязательно принадлежат одному семейству моделей
    - Каждый классификатор выдаёт одинаковое число классов
    - Ошибки классификаторов полностью совпадают
    - Правильность ответов классификаторов независима и имеет одну и ту же вероятность
  correct: 3
  id: 006-vote-accuracy-2
  fingerprint: 637fdd78
