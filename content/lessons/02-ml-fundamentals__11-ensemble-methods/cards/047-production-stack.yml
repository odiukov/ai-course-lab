- concept: практический порядок построения решения для табличных данных
  question: Расположи этапы построения сильного решения для табличных данных в рекомендуемом порядке.
  explanation: Сначала получают устойчивый boosting-бейзлайн, затем настраивают основные параметры. Stacking добавляют после этого, если ожидаемый небольшой прирост оправдывает усложнение системы.
  kind: order
  items:
    - Оценить LightGBM или XGBoost с параметрами по умолчанию с помощью кросс-валидации
    - Настроить n_estimators, learning_rate, max_depth и min_child_weight, продолжая использовать кросс-валидацию
    - При необходимости небольшого дополнительного прироста собрать stacking из разных моделей
  id: 047-production-stack-2
  fingerprint: 474fa31c
- concept: gradient boosting обычно служит более сильной отправной точкой для табличных данных, чем специализированные нейросетевые архитектуры
  question: Какую модель разумнее первой проверить для типичной задачи предсказания на табличных данных?
  explanation: Для табличных данных gradient boosting обычно превосходит специализированные нейросетевые архитектуры. TabNet и NODE иногда достигают сопоставимого качества, но редко обгоняют хорошо настроенный XGBoost.
  kind: choice
  options:
    - Хорошо настроенный XGBoost или LightGBM
    - TabNet, поскольку нейросети стабильно превосходят boosting на таблицах
    - NODE, поскольку boosting неприменим к смешанным табличным признакам
  correct: 0
  id: 047-production-stack-3
  fingerprint: 945d6593
