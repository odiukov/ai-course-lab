- concept: нормализация весов AdaBoost делит каждый ненормированный вес на их общую сумму
  question: После обновления ненормированные веса пяти объектов равны 0,08; 0,13; 0,17; 0,22 и 0,31. Каким станет последний вес после нормализации?
  explanation: Общая сумма ненормированных весов равна 0,91. Поэтому последний вес станет 0,31 / 0,91 ≈ 0,341. Такое деление меняет общий масштаб весов, но сохраняет их пропорции.
  kind: numeric
  answer: 0.341
  tolerance: 0.002
