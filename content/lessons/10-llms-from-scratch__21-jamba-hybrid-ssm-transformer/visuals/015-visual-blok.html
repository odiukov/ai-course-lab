<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Схема слоёв блока Jamba</title>
<style>
  :root{
    --bg:#fbfaf7; --ink:#23232a; --muted:#76767f;
    --accent:#b4531a; --line:#4a4a55; --soft:#c9c7bf; --box:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15161a; --ink:#e9e9ef; --muted:#9b9ba8;
      --accent:#f0a267; --line:#b9b9c6; --soft:#3d3f47; --box:#1e2027;
    }
  }
  html,body{margin:0}
  .wrap{background:var(--bg);color:var(--ink);padding:12px 10px 14px;
        font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  h2{margin:0 0 6px;font-size:14px;font-weight:600;letter-spacing:.01em}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg)}
  .fail{color:var(--accent);font-size:13px;margin:6px 0 0}
  .guide{stroke:var(--soft);stroke-width:1;stroke-dasharray:3 3}
  .box{fill:var(--box);stroke:var(--line);stroke-width:1.25}
  .box.acc{stroke:var(--accent);stroke-width:1.75}
  .glyph{fill:var(--ink);font-size:15px;font-weight:600;text-anchor:middle}
  .glyph.acc{fill:var(--accent)}
  .bar{stroke:var(--line);stroke-width:3.5}
  .bar.acc{stroke:var(--accent)}
  .dense{fill:var(--muted);font-size:13px;text-anchor:middle}
  .row{fill:var(--muted);font-size:12px;text-anchor:end}
  .flow{stroke:var(--line);stroke-width:1}
  .head{fill:var(--line)}
  .cap{fill:var(--muted);font-size:11px}
  .note{fill:var(--accent);font-size:11px;text-anchor:middle}
  .brace{stroke:var(--accent);stroke-width:1.25;fill:none}
  .side{fill:var(--accent);font-size:13px;text-anchor:start}
  .lg{fill:var(--muted);font-size:11px;text-anchor:start}
</style>
<div class="wrap">
  <h2>Блок Jamba: 8 слоёв, две метки на каждом</h2>
  <svg id="s" viewBox="0 0 660 186" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Восемь позиций: семь слоёв Mamba и один attention, MoE через слой"></svg>
  <p class="fail" id="f" hidden></p>
</div>
<script>
(function(){
  var svg = document.getElementById("s");
  try{
    /* ---- данные схемы ---- */
    var D = {
      layers: [
        {top:"M", moe:false}, {top:"M", moe:true},
        {top:"M", moe:false}, {top:"M", moe:true},
        {top:"M", moe:false}, {top:"M", moe:true},
        {top:"M", moe:false}, {top:"A", moe:true}
      ],
      y: { flow:1.70, rowTop:1.15, rowMoe:0.40,
           guideHi:1.40, guideLo:0.05,
           braceHi:1.40, braceLo:0.10, side:0.70,
           note:-0.05, lg1:-0.40, lg2:-0.72 },
      x: { first:0, last:7, rowLabel:-0.30, legend:-0.55,
           flowTail:-0.15, flowHead:7.15, brace:7.35, side:7.50 },
      box:{ w:0.50, h:0.46 },
      bar:{ hi:0.60, lo:0.20 },
      head:{ len:0.13, half:0.07 },
      tick:0.08
    };

    /* ---- один origin, один scale, одна пара функций перевода ---- */
    var origin = { x:60, y:130 }, scale = 58;
    function sx(x){ return origin.x + x * scale; }
    function sy(y){ return origin.y - y * scale; }

    var NS = "http://www.w3.org/2000/svg";
    function el(name, attrs, text){
      var n = document.createElementNS(NS, name);
      for (var k in attrs) n.setAttribute(k, attrs[k]);
      if (text != null) n.textContent = text;
      svg.appendChild(n);
      return n;
    }
    function line(x1,y1,x2,y2,cls){
      return el("line",{x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),"class":cls});
    }
    function label(x,y,cls,text,dx,dy){
      var t = el("text",{x:sx(x),y:sy(y),"class":cls},text);
      if (dx) t.setAttribute("dx",dx);
      if (dy) t.setAttribute("dy",dy);
      return t;
    }

    /* порядок прохождения токена */
    line(D.x.flowTail, D.y.flow, D.x.flowHead - D.head.len, D.y.flow, "flow");
    el("polygon",{ "class":"head", points:
      [ sx(D.x.flowHead)+","+sy(D.y.flow),
        sx(D.x.flowHead-D.head.len)+","+sy(D.y.flow+D.head.half),
        sx(D.x.flowHead-D.head.len)+","+sy(D.y.flow-D.head.half) ].join(" ") });
    label((D.x.first + D.x.last)/2, D.y.flow, "cap", "вход → выход: порядок прохождения токена", null, -8)
      .setAttribute("text-anchor","middle");

    /* подписи строк слева */
    label(D.x.rowLabel, D.y.rowTop, "row", "тип слоя", -10, 4);
    label(D.x.rowLabel, D.y.rowMoe, "row", "MoE", -10, 4);

    /* позиции */
    D.layers.forEach(function(L, i){
      var cx = D.x.first + i, acc = (i === D.layers.length - 1);

      line(cx, D.y.guideHi, cx, D.y.guideLo, "guide");

      el("rect",{
        x: sx(cx - D.box.w/2), y: sy(D.y.rowTop + D.box.h/2),
        width: sx(cx + D.box.w/2) - sx(cx - D.box.w/2),
        height: sy(D.y.rowTop - D.box.h/2) - sy(D.y.rowTop + D.box.h/2),
        rx: sx(D.x.first + D.tick) - sx(D.x.first),
        "class": acc ? "box acc" : "box"
      });
      var g = label(cx, D.y.rowTop, acc ? "glyph acc" : "glyph", L.top);
      g.setAttribute("dominant-baseline","central");

      if (L.moe) line(cx, D.bar.hi, cx, D.bar.lo, acc ? "bar acc" : "bar");
      else label(cx, D.y.rowMoe, "dense", "M", null, 4);
    });

    /* последняя позиция: attention и MoE вместе */
    label(D.x.last, D.y.note, "note", "attention + MoE");

    /* сбоку: ×4 блока */
    el("path",{ "class":"brace", d:
      "M" + sx(D.x.brace - D.tick) + "," + sy(D.y.braceHi) +
      " L" + sx(D.x.brace) + "," + sy(D.y.braceHi) +
      " L" + sx(D.x.brace) + "," + sy(D.y.braceLo) +
      " L" + sx(D.x.brace - D.tick) + "," + sy(D.y.braceLo) });
    label(D.x.side, D.y.side, "side", "×4 блока = 32 слоя", null, 4);

    /* легенда */
    label(D.x.legend, D.y.lg1, "lg",
      "l = 8 — 7 слоёв Mamba (M) + 1 слой attention (A) в блоке;  e = 2 — MoE через слой");
    label(D.x.legend, D.y.lg2, "lg",
      "│ — MoE включён в этом слое   ·   M внизу — плотный feed-forward, без MoE");
  }catch(e){
    var f = document.getElementById("f");
    f.hidden = false;
    f.textContent = "Схема не построилась. Она должна показывать 8 позиций в ряд: "
      + "M M M M M M M A (7 слоёв Mamba и 1 слой attention, l = 8), под ними отметки MoE "
      + "через одну позицию (e = 2) — вертикальная черта значит «MoE есть», буква M значит «нет»; "
      + "MoE попадает и на последнюю позицию, то есть на слой attention. Сбоку: ×4 блока = 32 слоя.";
    svg.remove();
  }
})();
</script>
</html>
