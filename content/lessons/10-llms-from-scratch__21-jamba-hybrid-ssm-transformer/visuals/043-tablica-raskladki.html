<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Расклад 2026: масштабы семейств</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1b1f24;
    --muted: #5b6570;
    --axis: #8a949e;
    --grid: #e3e7ec;
    --total: #2b6cb0;
    --active: #d97706;
    --pure: #6b7280;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171b;
      --fg: #e8ecf1;
      --muted: #9aa4b0;
      --axis: #6b7581;
      --grid: #262c33;
      --total: #7fb3e8;
      --active: #f0b04a;
      --pure: #9aa4b0;
    }
  }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  .wrap { background: var(--bg); color: var(--fg); padding: 8px 10px 10px; box-sizing: border-box; }
  h2 { font: 600 15px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0 0 4px; }
  .sub { font: 400 12px/1.4 system-ui, sans-serif; color: var(--muted); margin: 0 0 6px; }
  svg { display: block; width: 100%; height: auto; max-height: 470px; }
  .fail { font: 400 13px/1.5 system-ui, sans-serif; color: var(--fg); white-space: pre-wrap; }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
</style>
</head>
<body>
<div class="wrap">
  <h2>Расклад 2026: масштабы семейств</h2>
  <p class="sub">Синий — всего параметров, оранжевый — активных на токен. Шкала логарифмическая.</p>
  <div id="host"><svg id="chart" viewBox="0 0 860 400" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Масштабы семейств моделей"></svg></div>
</div>
<script>
(function () {
  var host = document.getElementById("host");
  try {
    // ---- данные схемы (единственные литеральные числа предметной области) ----
    var ROWS = [
      { label: "Mamba-2 3B",            total: 3,   active: null, kind: "pure",   note: "чистая SSM" },
      { label: "Mamba-3 1.5B",          total: 1.5, active: null, kind: "pure",   note: "ICLR 2026, база" },
      { label: "Jamba 52B/12B",         total: 52,  active: 12,   kind: "hybrid", note: "март 2024, 256k на 80 ГБ" },
      { label: "Jamba 1.5 Large 398B/94B", total: 398, active: 94, kind: "hybrid", note: "август 2024" },
      { label: "DeepSeek-V3 671B/37B",  total: 671, active: 37,   kind: "moe",    note: "ориентир масштаба" }
    ];
    var TICKS = [1, 3, 10, 30, 100, 300, 671];

    // ---- один origin и один scale ----
    var origin = { x: 250, y: 60 };            // px: точка (0,0) модельных координат
    var scale  = { x: 82, y: 62 };             // px на 1 модельную единицу
    // модельные координаты: x = log10(параметры), y = индекс строки
    function sx(x) { return origin.x + x * scale.x; }
    function sy(y) { return origin.y + y * scale.y; }

    var LG = Math.LN10;
    function lg(v) { return Math.log(v) / LG; }

    var svg = document.getElementById("chart");
    var NS = "http://www.w3.org/2000/svg";
    function el(n, a) {
      var e = document.createElementNS(NS, n);
      for (var k in a) e.setAttribute(k, a[k]);
      svg.appendChild(e);
      return e;
    }
    function txt(x, y, s, anchor, cls, size) {
      var t = el("text", { x: x, y: y, "text-anchor": anchor, "font-size": size, fill: cls });
      t.textContent = s;
      return t;
    }

    var PAD = 5;      // пиксельный отступ подписи от точки привязки
    var LW = 1;       // толщина линий
    var FS = 12;      // размер шрифта
    var FS_S = 11;

    var yTop = -0.55, yBot = ROWS.length - 0.45;
    var xMin = lg(TICKS[0]), xMax = lg(TICKS[TICKS.length - 1]);

    // фон
    el("rect", { x: 0, y: 0, width: 860, height: 400, fill: "var(--bg)" });

    // сетка + засечки шкалы
    for (var i = 0; i < TICKS.length; i++) {
      var xv = lg(TICKS[i]);
      el("line", {
        x1: sx(xv), y1: sy(yTop), x2: sx(xv), y2: sy(yBot),
        stroke: "var(--grid)", "stroke-width": LW
      });
      txt(sx(xv), sy(yBot) + PAD * 3, TICKS[i] + "B", "middle", "var(--muted)", FS_S);
    }
    // ось значений
    el("line", {
      x1: sx(xMin), y1: sy(yBot), x2: sx(xMax), y2: sy(yBot),
      stroke: "var(--axis)", "stroke-width": LW * 1.5
    });
    txt(sx(xMax), sy(yBot) + PAD * 6, "параметры, млрд (лог)", "end", "var(--muted)", FS_S);

    // ось названий (левая граница строк)
    el("line", {
      x1: sx(xMin), y1: sy(yTop), x2: sx(xMin), y2: sy(yBot),
      stroke: "var(--axis)", "stroke-width": LW * 1.5
    });

    // стрелка масштаба: 52B -> 398B (хвост подписан)
    var iA = 2, iB = 3, yArr = (iA + iB) / 2;
    var xA = lg(ROWS[iA].total), xB = lg(ROWS[iB].total);
    el("line", {
      x1: sx(xA), y1: sy(yArr), x2: sx(xB) - PAD, y2: sy(yArr),
      stroke: "var(--total)", "stroke-width": LW * 1.5, "stroke-dasharray": "4 3"
    });
    el("polygon", {
      points: [
        sx(xB) + "," + sy(yArr),
        (sx(xB) - PAD * 2) + "," + (sy(yArr) - PAD),
        (sx(xB) - PAD * 2) + "," + (sy(yArr) + PAD)
      ].join(" "),
      fill: "var(--total)"
    });
    txt(sx(xA) - PAD, sy(yArr) + PAD, "×8 по размеру, рецепт тот же", "end", "var(--total)", FS_S);

    // строки
    for (var r = 0; r < ROWS.length; r++) {
      var row = ROWS[r];
      var xT = lg(row.total);
      var colT = row.kind === "pure" ? "var(--pure)" : "var(--total)";

      // название слева от оси
      txt(sx(xMin) - PAD * 2, sy(r) + PAD * 0.8, row.label, "end", "var(--fg)", FS);

      // полоса от левого края шкалы до значения total
      el("line", {
        x1: sx(xMin), y1: sy(r), x2: sx(xT), y2: sy(r),
        stroke: colT, "stroke-width": LW * 6, "stroke-opacity": 0.28
      });
      el("circle", { cx: sx(xT), cy: sy(r), r: PAD, fill: colT });
      // подпись total — НАД точкой
      txt(sx(xT), sy(r) - PAD * 2, row.total + "B всего", "middle", colT, FS_S);

      if (row.active !== null) {
        var xAv = lg(row.active);
        el("circle", { cx: sx(xAv), cy: sy(r), r: PAD * 0.8, fill: "var(--active)" });
        // подпись active — ПОД точкой, в другую сторону
        txt(sx(xAv), sy(r) + PAD * 3.4, row.active + "B активных", "middle", "var(--active)", FS_S);
      } else {
        txt(sx(xT) + PAD * 2, sy(r) + PAD * 0.8, row.note, "start", "var(--muted)", FS_S);
      }
    }

    // примечания к гибридам — справа от точки total, выше линии
    txt(sx(lg(ROWS[2].total)) + PAD * 2, sy(2) - PAD * 2, "256k на одной карте 80 ГБ", "start", "var(--muted)", FS_S);
  } catch (e) {
    host.innerHTML = '<p class="fail">Схема не построилась. Она должна была показать по одной строке на модель, ' +
      'от малой к большой: Mamba-2 3B и Mamba-3 1.5B (чистые SSM, активных = всего), ' +
      'Jamba 52B всего / 12B активных, Jamba 1.5 Large 398B / 94B, DeepSeek-V3 671B / 37B — ' +
      'на общей логарифмической шкале параметров. Разброс от 52B до 398B — почти восьмикратный, ' +
      'при неизменном рецепте блока.</p>';
  }
})();
</script>
</body>
</html>
