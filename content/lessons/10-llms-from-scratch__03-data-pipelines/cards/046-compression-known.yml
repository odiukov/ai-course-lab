- concept: коэффициент сжатия равен числу символов корпуса, делённому на число токенов после токенизации
  question: Корпус содержит 2 100 000 символов. После токенизации получилось 300 000 токенов. Чему равен коэффициент сжатия (символов на токен)?
  explanation: 'Коэффициент сжатия = число символов / число токенов = 2 100 000 / 300 000 = 7.0 символа на токен. Это заметно выше типичных для обычного английского 3–4 символов на токен: вероятно, токенизатор использует длинные доменные merges или корпус полон повторяющихся шаблонов.'
  kind: numeric
  answer: 7
  tolerance: 0.05
  id: 046-compression-known-1
  fingerprint: c1a3f652
- concept: низкий коэффициент сжатия означает, что токенизатор дробит текст на мелкие куски, потому что текст не похож на тот, на котором он обучался
  question: На новом срезе корпуса коэффициент сжатия равен 1,2 символа на токен, тогда как на остальных срезах он около 3,6. Что это скорее всего означает?
  explanation: 'Чем меньше символов приходится на токен, тем мельче куски, на которые распадается текст. Значение около 1 говорит, что почти каждый символ стал отдельным токеном: словарь токенизатора не покрывает этот материал. Длинные merges дали бы обратное — большое значение, а не 1,2.'
  kind: choice
  options:
    - Токенизатор дробит текст почти посимвольно — в срезе, вероятно, другой язык, повреждённый текст, коды или незнакомые слова
    - Срез содержит документы более высокого качества, чем остальной корпус
    - Токенизатор выучил длинные доменно-специфичные merges для этого среза
    - Срез слишком мал, чтобы коэффициент вообще был определён
  correct: 0
