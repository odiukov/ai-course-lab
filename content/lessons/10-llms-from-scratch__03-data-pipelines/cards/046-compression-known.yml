  fingerprint: 9012c71c
- concept: коэффициент сжатия — сигнал к расследованию, а не мера качества текста
  question: Почему по коэффициенту сжатия нельзя судить, хорош ли текст в корпусе, и как тогда правильно им пользоваться?
  explanation: Метрика отвечает на вопрос «насколько токенизатор подходит этим данным», а не «хорошие ли это данные». Одно число по всему корпусу почти бесполезно — работает разбивка по срезам и сравнение с другими метриками.
  kind: open
  reference: 'Коэффициент сжатия измеряет только соотношение символов и токенов, то есть насколько словарь токенизатора подходит этому тексту. Осмысленность, связность и полезность документа он не оценивает: бессмысленный текст на привычном токенизатору языке даст нормальные 3–4 символа на токен, а качественный документ на другом языке — аномально низкое значение. Пользоваться им надо как сигналом: считать отдельно по языкам, источникам и этапам очистки, сравнивать срезы между собой и сопоставлять с покрытием vocabulary, чтобы найти, где именно корпус перестал быть похож на ожидаемый.'
  id: 046-compression-known-3
  fingerprint: 04b84cda
