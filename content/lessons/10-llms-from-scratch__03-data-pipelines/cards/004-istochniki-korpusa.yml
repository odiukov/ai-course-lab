- concept: код с GitHub — источник среднего качества из-за форков-дублей и заброшенного/нерабочего кода
  question: Почему код, собранный с публичных репозиториев, относят к источникам среднего, а не высокого качества?
  explanation: Репозитории массово форкаются и вендорят зависимости, поэтому один и тот же файл встречается многократно; плюс мёртвые проекты и сгенерированные артефакты. Объём кодовых источников порядка терабайта, и на них опираются StarCoder, CodeLlama, DeepSeek-Coder — но перед обучением нужна дедупликация.
  kind: choice
  options:
    - В нём много копий одних и тех же проектов и заброшенных, нерабочего вида файлов
    - В нём слишком мало токенов, чтобы влиять на модель
    - Код нельзя токенизировать теми же токенизаторами, что и текст
    - Лицензии запрещают использовать код при обучении, поэтому его качество считают низким
