- concept: подготовленные веб-корпуса — это тот же веб, уже прошедший часть фильтрации, а не источник гарантированно чистого текста
  question: Чем подготовленный веб-корпус (например, RefinedWeb) отличается от сырого веб-обхода и почему его наличие не отменяет собственную фильтрацию данных?
  explanation: Curated web (например, RefinedWeb, на нём учили Falcon) — промежуточная категория между сырым Common Crawl и высококачественными источниками вроде Wikipedia, книг и научных статей. Он экономит работу, но не заменяет её.
  kind: open
  reference: 'Подготовленный веб-корпус — это те же страницы интернета, но уже прошедшие часть очистки авторами корпуса: отброшен мусор, реклама, часть дублей и низкокачественных страниц. Поэтому его качество оценивают как средне-высокое против низкого у сырого обхода, а объём заметно меньше исходного (единицы терабайт против сотен). Но фильтрация была сделана под чужие критерии и не идеальна: остаются дубли, шум, нежелательный и повторяющийся текст, персональные данные, возможные пересечения с бенчмарками. Значит, свои шаги отбора, дедупликации и проверки на утечку тестов всё равно нужны — просто мусора на входе меньше.'
  id: 004-istochniki-korpusa-3
