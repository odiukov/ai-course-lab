- concept: оптимальные N и D растут как квадратный корень из бюджета compute, поэтому рост C в k² раз даёт рост каждого в k раз
  question: Лаборатория увеличивает бюджет обучения в 49 раз и хочет остаться в compute-оптимальной точке по закону Chinchilla. Во сколько примерно раз при этом нужно увеличить число параметров модели?
  explanation: 'N_opt ∝ C^0.5, значит множитель у N равен корню из множителя у C: √49 = 7. Столько же (7×) добавляется и к числу обучающих токенов — оба ресурса масштабируются одинаково.'
  kind: numeric
  answer: 7
  tolerance: 0.3
  id: 051-chinchilla-1
  fingerprint: 24f296e7
- concept: бюджет обучения примерно пропорционален произведению числа параметров и числа обработанных токенов
  question: 'Инженер утверждает: «Я увеличил модель в 5 раз и корпус в 5 раз, значит счёт за обучение вырастет в 5 раз». Объясни своими словами, почему это неверно и какой множитель ожидать.'
  explanation: 'Ключ — мультипликативность: compute ≈ произведение параметров на токены. Сбалансированный рост в k раз по обоим направлениям стоит примерно k² по бюджету.'
  kind: open
  reference: 'Стоимость обучения (FLOPs) зависит и от размера модели, и от числа обработанных токенов примерно как их произведение: C ∝ N·D. Каждый токен прогоняется через все параметры, поэтому увеличение обоих ресурсов в 5 раз даёт 5·5 = 25 раз по compute, а не 5. Обратная сторона того же соотношения: чтобы N и D выросли в 5 раз, бюджет должен вырасти в 25 раз — именно поэтому в законе Chinchilla N_opt и D_opt пропорциональны C^0.5.'
  id: 051-chinchilla-2
  fingerprint: 99c2f9a9
- concept: намеренная перетренировка за пределами compute-оптимума оправдана тем, что обучение оплачивается один раз, а инференс — постоянно
  question: Команда может выпустить либо compute-оптимальную модель на 34B параметров, либо модель на 13B, намеренно обученную далеко за пределами Chinchilla-оптимума на гораздо большем числе токенов, с тем же качеством. Модель пойдёт в продакшн на миллиарды запросов. Какой аргумент оправдывает выбор второго варианта?
  explanation: 'Это «inference-optimal» масштабирование: Chinchilla оптимизирует только compute обучения, но модель потом обслуживают годами. Лишние FLOPs обучения — разовый расход, а меньшее число параметров сокращает стоимость каждого инференса. Llama 3 (70B на 15T токенов, ~214 токенов на параметр) — ровно этот выбор.'
  kind: choice
  options:
    - Перетренировка снижает итоговый loss сильнее, чем любой compute-оптимальный запуск того же качества
    - Дополнительная стоимость обучения платится однократно, а меньшая модель дешевле обслуживать при каждом запросе
    - Закон Chinchilla неприменим к моделям меньше 34B параметров
    - Обучение на большем числе токенов уменьшает суммарный бюджет compute на обучение
  correct: 1
