- concept: доля полезных позиций при паддинге равна сумме реальных токенов, делённой на произведение числа последовательностей и длины последовательности
  question: Модель принимает последовательности длиной 1024 токена. Четыре документа (120, 300, 180 и 400 токенов) отправляют на обучение по одному в последовательности, дополняя каждый паддингом. Какой процент обработанных позиций несёт полезный текст?
  explanation: Полезных токенов 120+300+180+400 = 1000. Обработано 4 × 1024 = 4096 позиций. 1000/4096 ≈ 0.244, то есть 24.4%. Остальные ~75.6% compute уходят на заполнители.
  kind: numeric
  answer: 24.4
  tolerance: 0.5
  id: 032-cena-paddinga-1
  fingerprint: cc613acc
- concept: маскирование паддинга убирает его из функции потерь, но не из вычислений, потому что плотные операции идут над всем прямоугольным тензором
  question: Паддинг-токены помечены маской, и модель не считает по ним loss. Почему они всё равно стоят вычислительного бюджета?
  explanation: 'Маска отвечает за то, чему модель учится, а не за то, что считает GPU. Матричные умножения идут над прямоугольным массивом заданного размера: позиция занята паддингом или текстом — арифметика одинаковая. Отсюда и разрыв вроде 13% полезной работы против 87% пустоты в наивной схеме.'
  kind: choice
  options:
    - Маска применяется только на инференсе, а на обучении она игнорируется
    - Плотные операции выполняются над тензором фиксированной формы целиком, поэтому память и время тратятся на все позиции независимо от маски
    - Паддинг-токены влияют на градиенты через эмбеддинги, и это единственный источник затрат
    - Маскирование само по себе дороже, чем обработка полезных токенов
