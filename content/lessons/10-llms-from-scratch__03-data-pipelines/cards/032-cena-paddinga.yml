- concept: доля compute, потраченного впустую, растёт при уменьшении средней длины документа относительно длины последовательности
  question: Корпус A состоит из документов средней длиной 1500 токенов, корпус B — средней длиной 90 токенов. Оба обучают с длиной последовательности 4096 и наивным дополнением по одному документу на последовательность. Где потери compute на паддинг выше и почему?
  explanation: Доля полезных позиций ≈ средняя длина документа / длина последовательности. Для A это 1500/4096 ≈ 37%, для B — 90/4096 ≈ 2.2%. Короткие документы при большой длине последовательности — худший случай наивного паддинга, и именно ради них применяют упаковку нескольких документов в одну последовательность.
  kind: choice
  options:
    - 'В корпусе A: длинные документы требуют больше внимания на каждую позицию'
    - 'Одинаково: длина последовательности фиксирована, значит и потери фиксированы'
    - 'В корпусе B: чем короче документ относительно длины последовательности, тем большую долю позиций занимает заполнитель'
    - В корпусе B, но только если размер батча меньше числа документов
