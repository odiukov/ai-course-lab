- concept: вычислительная стоимость одного запроса инференса определяется числом параметров, а не объёмом обучающего корпуса
  question: Сервис заменил модель на 96 млрд параметров моделью на 24 млрд параметров, которой показали намного больший корпус. Во сколько раз примерно уменьшится вычислительная стоимость одного запроса при прочих равных?
  explanation: 'Стоимость прямого прохода на запрос масштабируется с числом параметров: 96 / 24 = 4. Объём обучающих токенов в этой стоимости не участвует вообще — он влияет только на качество полученных весов. Поэтому дополнительные токены обучения не удорожают эксплуатацию, а сокращение размера модели удешевляет каждый запрос.'
  kind: numeric
  answer: 4
  tolerance: 0.1
  id: 052-inference-optimal-1
  fingerprint: b65b7531
- concept: за compute-оптимальной точкой качество продолжает расти, но отдача на дополнительные вычисления убывает
  question: Модель на 13 млрд параметров уже прошла compute-оптимальное соотношение данных и параметров. Корпус увеличивают ещё вдвое. Что произойдёт с loss?
  explanation: Compute-оптимум — это точка лучшей отдачи на вложенные вычисления, а не потолок качества. За ней loss всё ещё падает, просто медленнее на каждую вложенную единицу compute. Llama 3 с примерно 15 трлн токенов на 70 млрд параметров лежит далеко за этой точкой и от этого не деградирует, а становится лучше — просто дорогой ценой.
  kind: choice
  options:
    - Продолжит снижаться, но каждое следующее улучшение обойдётся дороже по вычислениям
    - 'Начнёт расти: за оптимальной точкой лишние данные портят веса'
    - 'Перестанет меняться: за оптимумом дополнительные токены не несут информации'
    - Снизится сильнее, чем до оптимальной точки, потому что модель уже разогрета
  correct: 0
  id: 052-inference-optimal-2
  fingerprint: e1acaeb7
- concept: перетренировка не опровергает закон Chinchilla, а оптимизирует другую целевую функцию — не один запуск обучения, а всю жизнь модели
  question: Модель обучили на корпусе, в десяток раз превышающем compute-оптимальный для её размера. Значит ли это, что закон Chinchilla неверен? Объясни своими словами.
  explanation: Chinchilla — training-compute-optimal; так называемое inference-optimal масштабирование считает другую величину. Обе постановки корректны, они просто минимизируют разные вещи, поэтому дают разные ответы про оптимальный размер модели.
  kind: open
  reference: 'Нет. Закон Chinchilla отвечает на узкий вопрос: как при фиксированном бюджете обучающих вычислений получить минимальный loss. В этой постановке он остаётся верным. Перетренированная модель решает другую задачу оптимизации: минимизируется не стоимость одного запуска обучения, а суммарная стоимость модели за всю её жизнь, включая инференс. Меняется целевая функция, а не сам закон, поэтому слово «перетренировка» означает лишь отклонение от Chinchilla-баланса, а не порчу модели.'
  id: 052-inference-optimal-3
  fingerprint: 111e95d2
