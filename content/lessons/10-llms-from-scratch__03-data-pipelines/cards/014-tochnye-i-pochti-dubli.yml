- concept: непойманные почти-дубли дают повторяющемуся материалу непропорциональный вес и создают ложную оценку разнообразия корпуса
  question: Объясни своими словами, чем вредны для обучения модели почти-дубли, если корпус всё равно большой и повторов в нём, скажем, около четверти.
  explanation: 'Два разных вреда: перекос веса повторяющегося материала (переобучение и запоминание) и завышенная оценка разнообразия корпуса. Масштаб проблемы не гипотетический — у Llama дедупликация убрала около 38% веб-данных, то есть больше трети скачанного веба была повторами.'
  kind: open
  reference: 'Почти-дубль — это перепечатка, зеркало или слегка обновлённая версия одного текста. Если их не убрать, модель много раз увидит практически один и тот же пример, и этот материал получит вес, не соответствующий его реальной ценности: модель сильнее запоминает именно его, вплоть до дословного воспроизведения. Одновременно портится оценка корпуса: заявленный объём в токенах создаёт иллюзию разнообразия, хотя реального нового содержания там на четверть меньше. То есть страдают и распределение обучающего сигнала, и планирование бюджета данных.'
