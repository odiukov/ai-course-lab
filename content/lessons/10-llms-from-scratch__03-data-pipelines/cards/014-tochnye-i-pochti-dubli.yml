- concept: 'дедупликация идёт двумя разными механизмами: дешёвое точное совпадение по хешу до дорогого поиска почти-дублей по сходству'
  question: Расставь этапы дедупликации корпуса в том порядке, в котором их выполняют на практике.
  explanation: 'Сначала очистка: иначе разный обвес вокруг одного текста мешает даже точному совпадению. Затем хеширование — линейное по числу документов и почти бесплатное, оно снимает самый массовый слой повторов. И только на уменьшенном остатке запускают дорогой поиск почти-дублей по сходству содержания, где порог обычно ставят около 0.85.'
  kind: order
  items:
    - Очистить текст документов от разметки и служебных фрагментов
    - Сгруппировать документы по хешу содержимого и выбросить точные копии
    - Для оставшихся документов измерить сходство содержания и удалить почти-дубли выше выбранного порога
