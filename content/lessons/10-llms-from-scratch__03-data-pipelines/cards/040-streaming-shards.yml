- concept: потоковый конвейер токенизации записывает результат порциями и закрывает шард по достижении лимита, не собирая полную ленту токенов
  question: Расставь этапы потоковой подготовки обучающих данных для порции очищенных документов в правильном порядке.
  explanation: 'Ключ в том, что запись идёт порциями: память освобождается после каждой порции, а не после всего корпуса. Обратный порядок (сначала собрать весь список токенов, потом резать) требует держать всю ленту в RAM — для корпуса на триллион токенов это ~4 ТБ даже при 4 байтах на идентификатор.'
  kind: order
  items:
    - Токенизировать очередную порцию документов
    - Вставить служебный токен конца документа между документами порции
    - Нарезать полученный поток идентификаторов на последовательности фиксированной длины
    - Дописать готовые последовательности в текущий открытый шард
    - По достижении лимита размера закрыть шард и открыть следующий с номером на единицу больше
  id: 040-streaming-shards-3
