- concept: при потоковой записи в шарды пиковая оперативная память определяется размером одного шарда, а не размером всего корпуса
  question: Один шард содержит 65536 последовательностей длиной 512 токенов, каждый идентификатор токена хранится в 2 байтах. Сколько мегабайт (МиБ) оперативной памяти нужно, чтобы держать один такой шард целиком в памяти?
  explanation: '65536 × 512 = 33 554 432 токена, по 2 байта = 67 108 864 байта = 64 МиБ. Размер корпуса при этом может быть любым: он ограничивает место на диске, а пиковую RAM задаёт размер шарда, потому что во время обучения открыт один шард (или несколько), а не вся лента токенов.'
  kind: numeric
  answer: 64
  tolerance: 0.5
  id: 040-streaming-shards-2
