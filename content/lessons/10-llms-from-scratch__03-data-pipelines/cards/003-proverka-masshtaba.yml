- concept: 'два вида ограничения требуют разных исправлений: память — уменьшение объёма одновременно размещаемых данных, пропускная способность — ускорение доставки'
  question: Обучение упирается либо в память, либо в пропускную способность пайплайна. Объясни своими словами, почему лечение у этих двух случаев разное, и назови по два конкретных приёма для каждого.
  explanation: 'Ограничения отвечают на разные вопросы: «сколько данных влезает одновременно» и «сколько данных проходит за секунду». Поэтому и рычаги разные, а применение чужого рычага не помогает или вредит.'
  kind: open
  reference: 'Память ограничивает, сколько данных и активаций лежит на устройстве одновременно; при её нехватке процесс падает с OOM. Лечение — сокращать одновременно размещаемый объём: меньший размер батча с накоплением градиента (gradient accumulation), более короткая длина последовательности, checkpointing активаций, смешанная точность, шардирование состояния оптимизатора. Пропускная способность ограничивает, сколько батчей пайплайн отдаёт в секунду; симптом — GPU простаивает при свободной памяти, ошибок нет. Лечение — ускорять доставку: больше воркеров загрузчика, prefetch и перекрытие чтения с вычислением, заранее токенизированные данные в бинарном формате вместо парсинга на ходу, быстрый локальный диск вместо сети. Приёмы не взаимозаменяемы: увеличение числа воркеров не спасёт от OOM, а уменьшение батча не ускорит медленное чтение с диска — оно даже усилит простой, потому что батчей понадобится больше.'
  id: 003-proverka-masshtaba-2
  fingerprint: 02d366ab
- concept: доля простоя GPU считается из разницы между временем шага и временем подготовки батча
  question: GPU считает один шаг обучения на батче за 120 мс. Загрузчик данных отдаёт очередной батч раз в 300 мс, работая без перекрытия с вычислением. Какой процент времени GPU простаивает в ожидании данных?
  explanation: 'Цикл длится 300 мс: 120 мс вычисления и 180 мс ожидания. 180/300 = 0.6, то есть 60% времени GPU ничего не делает. Памяти при этом может хватать с запасом — это чистое ограничение пропускной способности, и лечится оно prefetch и параллельной загрузкой, а не уменьшением батча.'
  kind: numeric
  answer: 60
  tolerance: 1
