- concept: честное сравнение двух реализаций требует фиксировать корпус, токенизатор и максимальную длину последовательности, чтобы разница в скорости относилась к способу исполнения
  question: Ты хочешь сравнить пропускную способность своей реализации токенизации и библиотечной. Что нужно зафиксировать одинаковым в обоих прогонах и почему без этого вывод о скорости ничего не значит?
  explanation: 'Смысл сравнения — изолировать одну переменную. Совпадение алгоритма ещё не означает совпадения пропускной способности, но обратное тоже верно: разница в пропускной способности что-то говорит о реализации только при совпадении входа, токенизатора, max_length и способа замера.'
  kind: open
  reference: 'Одинаковыми должны быть корпус (те же документы и тот же их объём), токенизатор с тем же словарём и merges, максимальная длина последовательности и правило усечения, а также сама метрика скорости — токены, делённые на полное время замера, с исключением PAD. Тогда единственная переменная — способ исполнения: интерпретируемый Python против скомпилированного кода и одного процесса против нескольких. Если различаются вход, словарь или max_length, реализации считают разное число токенов, и быстрый прогон мог просто выполнить меньше работы — тогда отношение скоростей не измеряет качество реализации.'
