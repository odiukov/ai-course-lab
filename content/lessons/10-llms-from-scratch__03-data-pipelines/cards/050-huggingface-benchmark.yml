- concept: выигрыш от ускоренной токенизации переводится в абсолютное сокращение времени подготовки корпуса умножением исходного времени на обратный коэффициент
  question: Учебный Python-пайплайн токенизирует корпус 7 часов. Переход на скомпилированный токенизатор с 3 параллельными процессами даёт ускорение в 14 раз. Сколько минут займёт токенизация после перехода?
  explanation: '7 часов = 420 минут, 420 / 14 = 30 минут. Именно такой пересчёт показывает, почему продакшен-команды берут скомпилированные токенизаторы: на масштабе триллионов токенов тот же коэффициент превращает недели ожидания в часы и решает, будут ли данные поступать к ускорителям с нужной скоростью.'
  kind: numeric
  answer: 30
  tolerance: 1
