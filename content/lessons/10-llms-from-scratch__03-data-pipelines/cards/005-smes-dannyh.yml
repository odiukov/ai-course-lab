- concept: оптимальная пропорция источников не выводится формулой, её подбирают экспериментами и замерами на бенчмарках
  question: Почему лаборатория не может вычислить оптимальные доли веба, кода, книг и математики аналитически, и как эти доли определяют на практике?
  explanation: Формулы для смеси данных нет — в отличие от Chinchilla-соотношения для размера модели и числа токенов. Остаются ablation-прогоны на маленьких моделях плюс оценка на бенчмарках; это одна из самых дорогих и закрытых частей подготовки LLM, поэтому состав корпуса лаборатории обычно не публикуют.
  kind: open
  reference: 'Связь между долей источника и итоговой способностью не описывается известной формулой: эффект зависит от токенизатора, архитектуры, объёма корпуса, дедупликации и от того, как источники взаимодействуют между собой (код помогает рассуждениям, математика — коду). Поэтому смесь подбирают эмпирически: обучают уменьшенные модели-пробники на разных вариантах пропорций (ablation), замеряют результат на наборе бенчмарков по каждой целевой способности и переносят выигравшую смесь на полный прогон. Раскрытая смесь Llama 3 (около 50% веб, 25% код, 13% книги и статьи, 8% математика, 4% многоязычный веб) — итог такого перебора, а не вывод из теории.'
  id: 005-smes-dannyh-3
  fingerprint: 94b29a44
