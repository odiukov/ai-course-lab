- concept: доля источника в смеси переводится в абсолютное число обучающих токенов этого типа
  question: Корпус обучения содержит 800 миллиардов токенов, доля кода в смеси данных — 18%. Сколько миллиардов токенов кода увидит модель за одну эпоху?
  explanation: 'Доля умножается на общий объём: 0.18 × 800 = 144 миллиарда токенов кода. Именно так считают реальные смеси: у Llama 3 доля кода 25% от 15.6 триллиона даёт около 3.9 триллиона токенов кода — больше, чем весь корпус GPT-3.'
  kind: numeric
  answer: 144
  tolerance: 1
  id: 005-smes-dannyh-1
  fingerprint: 9ed1b1e1
- concept: 'при фиксированном объёме корпуса доли источников конкурируют: рост одной доли вытесняет остальные'
  question: Команда обучает модель на фиксированном бюджете в 900 миллиардов токенов и решает поднять долю математики с 6% до 16%, чтобы улучшить рассуждения. Что неизбежно произойдёт с корпусом?
  explanation: Доли в смеси всегда суммируются в 100%, а бюджет токенов конечен. Прибавка 10 процентных пунктов математике — это 90 миллиардов токенов, отнятых у других источников. Поэтому усиление одной способности почти всегда оплачивается ослаблением другой.
  kind: choice
  options:
    - Общий объём корпуса вырастет на 10%, остальные доли сохранятся
    - Суммарная доля прочих источников упадёт на те же 10 процентных пунктов, и модель увидит меньше токенов веба, кода или книг
    - Модель просто пройдёт математику дважды, не затронув другие источники
    - Качество математики вырастет без последствий, потому что доли источников независимы
  correct: 1
