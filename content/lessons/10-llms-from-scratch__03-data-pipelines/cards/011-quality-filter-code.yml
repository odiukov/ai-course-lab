- concept: 'фильтр качества устроен как цепочка проверок с ранним выходом: True возвращается только после того, как ни одна проверка не отбраковала документ'
  question: Расставь шаги функции-фильтра качества документа в том порядке, в котором она их выполняет.
  explanation: 'Каждая проверка при провале сразу выходит с False, поэтому следующие даже не считаются: короткий документ отбраковывается до подсчёта долей. True — единственный выход, до которого доезжают документы, прошедшие все проверки. Так фильтр даёт пайплайну однозначный булев вердикт: сохранить или отбросить.'
  kind: order
  items:
    - разбить текст на список слов методом split()
    - вернуть False, если слов меньше минимально допустимого числа
    - вернуть False, если доля слов целиком в верхнем регистре превышает свой порог
    - вернуть False, если доля спецсимволов превышает свой порог
    - вернуть True
  id: 011-quality-filter-code-1
  fingerprint: 5aa936b8
- concept: порог в фильтре сравнивается строгим неравенством, поэтому документ со значением ровно на пороге проверку проходит
  question: Фильтр качества отбраковывает документ, если доля слов в верхнем регистре строго больше порога. Порог равен 0.25, а в документе доля таких слов ровно 0.25. Что сделает фильтр на этой проверке?
  explanation: Условие отбраковки — строгое `>`, поэтому равенство порогу его не выполняет и документ идёт на проверку спецсимволов. Порог означает «максимально допустимое значение», а не «первое запрещённое». True возвращается лишь после последней проверки, поэтому вариант с досрочным True тоже неверен.
  kind: choice
  options:
    - пропустит документ дальше — на следующую проверку
    - 'вернёт False: значение достигло порога'
    - вернёт True, не выполняя остальные проверки
    - 'поднимет исключение: значение на границе неопределено'
  correct: 0
  id: 011-quality-filter-code-2
  fingerprint: 17025fe5
- concept: знаменатель для доли спецсимволов защищают от нуля, чтобы функция не падала на пустом тексте, независимо от порядка проверок
  question: Объясни своими словами, зачем при подсчёте доли спецсимволов делить не на длину текста напрямую, а на максимум из длины текста и единицы.
  explanation: 'Ключевое: деление на ноль — это исключение, а не просто плохое число, и оно уронит обработку корпуса. Защита знаменателя — локальная страховка, не полагающаяся на порядок проверок; аналогичная страховка нужна и доле капса, где знаменатель — число слов.'
  kind: open
  reference: 'Пустая строка имеет нулевую длину, и прямое деление на неё даёт ZeroDivisionError — падение всего пайплайна на одном мусорном документе. Максимум с единицей превращает знаменатель в единицу, доля получается нулевой, и функция спокойно доходит до вердикта. Формально пустой текст отсеивается раньше — на проверке минимального числа слов, — но защита делает каждую проверку корректной сама по себе: она не зависит от того, что стоит выше по цепочке, и выдержит перестановку или отключение предыдущих условий.'
  id: 011-quality-filter-code-3
  fingerprint: 910ed7f7
