- concept: оценка Jaccard равна доле позиций, где компоненты двух MinHash-подписей совпали
  question: Две MinHash-подписи имеют по 128 компонентов. На 96 позициях значения совпали. Какова оценка Jaccard-сходства документов?
  explanation: 'Оценка равна c/k: 96/128 = 0.75. Каждая позиция — независимая попытка вытянуть минимум по своей хеш-функции, и вероятность совпадения минимумов равна истинному Jaccard, поэтому доля совпадений его и оценивает. При пороге 0.8 такая пара дублем не считается.'
  kind: numeric
  answer: 0.75
  tolerance: 0.01
  id: 023-ocenka-po-podpisi-1
  fingerprint: 35745ccb
- concept: компоненты подписей сравнивают только попозиционно, потому что одна позиция — одна общая хеш-функция
  question: Почему при оценке Jaccard по MinHash-подписям сравнивают компоненты только на одинаковых позициях, а не ищут любые общие числа в двух подписях?
  explanation: Позиция i в обеих подписях — это один и тот же хеш, то есть один и тот же случайный порядок шинглов. Равенство минимумов под ним означает, что минимальный шингл общий, а вероятность этого равна Jaccard. Совпадение чисел из разных позиций порождено разными хеш-функциями и о пересечении множеств не говорит — это просто случайная коллизия значений.
  kind: choice
  options:
    - Позиции в подписи упорядочены по возрастанию хеша, и порядок нельзя нарушать
    - 'Совпадение осмысленно только внутри одной хеш-функции: равенство минимумов под общим случайным порядком означает, что минимум лежит в пересечении множеств шинглов'
    - Поиск общих чисел по всей подписи слишком медленный, поэтому его заменяют попозиционным сравнением
    - Числа в разных позициях берутся из разных документов, поэтому их нельзя сравнивать
  correct: 1
  id: 023-ocenka-po-podpisi-2
  fingerprint: 5f5063a9
- concept: число компонентов подписи задаёт шаг дискретности и точность оценки Jaccard
  question: Инженер уменьшил длину MinHash-подписи со 128 компонентов до 16, чтобы сэкономить память. Что произойдёт с оценкой Jaccard?
  explanation: 'Оценка c/k — среднее по k независимым испытаниям с вероятностью успеха J, поэтому она несмещена при любом k. Но при k=16 возможны только значения 0, 1/16, 2/16, ..., и разброс вокруг истинного значения куда шире, чем при k=128. Возле порога 0.8 это даёт ошибочные решения: пара то попадает в дубли, то нет.'
  kind: choice
  options:
    - Оценка станет систематически завышать сходство, потому что коротких подписей чаще хватает на совпадение
    - 'Оценка останется точной: длина подписи влияет только на скорость сравнения'
    - Оценка останется несмещённой, но станет грубее — её значения кратны 1/16, а разброс вокруг истинного Jaccard вырастет
    - 'Оценка перестанет работать: при длине меньше 32 совпадения позиций теряют смысл'
  correct: 2
  id: 023-ocenka-po-podpisi-3
