- concept: в числителе sequence utilization учитываются все непустые токены, включая служебные разделители документов, и исключается только PAD
  question: Корпус упакован в 6 последовательностей по 512 позиций. В них лежат 2600 токенов текста и 40 токенов-разделителей конца документа, остальные позиции — PAD. Чему равен sequence utilization?
  explanation: 'Непустые — все токены, кроме PAD, служебные разделители тоже занимают реальные позиции и предсказываются моделью: 2600 + 40 = 2640. Всего позиций 6 × 512 = 3072. 2640 / 3072 ≈ 0.859. Если ошибочно выкинуть разделители, получится 2600 / 3072 ≈ 0.846 — заниженная оценка.'
  kind: numeric
  answer: 0.859
  tolerance: 0.005
  id: 047-sequence-utilization-1
  fingerprint: feb9f7b5
- concept: 'sequence utilization характеризует раскладку токенов по блокам, а не корпус: один корпус при разных схемах упаковки даёт разные значения'
  question: 'Один и тот же токенизированный корпус упаковали двумя способами: (A) каждый документ в свою последовательность с добиванием PAD до конца блока, (B) документы склеены в непрерывный поток и нарезаны по длине блока. Что можно сказать о sequence utilization?'
  explanation: 'Числитель (реальные токены) у обоих одинаков, а знаменатель — полная вместимость блоков — разный: вариант A плодит хвосты PAD в каждом блоке, вариант B оставляет PAD только в последнем. Поэтому метрику считают по готовым последовательностям: она измеряет качество упаковки, а не свойства текста.'
  kind: choice
  options:
    - У обоих способов utilization одинаков, потому что число реальных токенов корпуса не изменилось
    - У способа B utilization выше, потому что метрика зависит от схемы раскладки, а не от корпуса
    - У способа A utilization выше, потому что границы документов сохранены
    - 'Utilization для B не определён: без PAD знаменатель обнуляется'
  correct: 1
  id: 047-sequence-utilization-2
  fingerprint: af2f22ac
