- concept: число уникальных пар документов при полном переборе равно N(N-1)/2
  question: В коллекции 800 документов. Сколько уникальных пар нужно проверить, если считать сходство для каждой возможной пары (пара A-B и B-A считается один раз)?
  explanation: 'Число пар = N(N-1)/2 = 800·799/2 = 319600. Деление на 2 убирает двойной счёт: сравнение A с B и B с A — одна и та же работа. Уже на сотнях документов пар в сотни раз больше, чем самих документов.'
  kind: numeric
  answer: 319600
  tolerance: 1
  id: 020-kvadratichnaya-problema-1
  fingerprint: fb8a6936
- concept: объём попарного перебора растёт как квадрат числа документов, поэтому рост корпуса в k раз даёт рост работы примерно в k² раз
  question: Корпус вырос с 300 документов до 900. Во сколько примерно раз выросло число пар при полном попарном сравнении?
  explanation: 'N(N-1)/2 растёт примерно как N². Корпус вырос втрое — работа выросла примерно в 3² = 9 раз (точно: 404550/44850 ≈ 9.02). Именно поэтому полный перебор отстаёт от роста корпуса всё сильнее.'
  kind: numeric
  answer: 9
  tolerance: 0.3
  id: 020-kvadratichnaya-problema-2
  fingerprint: 707449ec
- concept: квадратичный перебор чинят сокращением количества выполняемых сравнений, а не ускорением одного сравнения или добавлением машин
  question: Поиск почти-дублей полным попарным перебором не укладывается в бюджет. Какое изменение реально снимает узкое место?
  explanation: 'Первый, второй и четвёртый варианты делят или уменьшают константу, но число пар всё равно растёт как N². Работает только отказ от большинства сравнений: сначала дешёвый отбор кандидатов (LSH-корзины), потом точный Jaccard по короткому списку. Экономия возникает за счёт пар, которые вообще не проверялись.'
  kind: choice
  options:
    - Оптимизировать функцию сходства, чтобы одно сравнение работало вдвое быстрее
    - Раздать перебор на кластер из 64 машин
    - Дешёвым способом отобрать небольшое множество пар-кандидатов и точное сходство считать только для них
    - Хранить множества шинглов в памяти вместо диска
  correct: 2
  id: 020-kvadratichnaya-problema-3
