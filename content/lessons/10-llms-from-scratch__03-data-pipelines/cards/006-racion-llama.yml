- concept: размер корпуса в токенах измеряет фактический учебный поток, а не объём файлов на диске, поэтому терабайты и токены не связаны фиксированным коэффициентом
  question: 'Лаборатория сообщает: модель обучена на 11 триллионах токенов, сырые исходники занимали 6 ТБ. Объясни своими словами, почему из этой пары чисел нельзя вывести коэффициент «токенов на терабайт» и сравнивать корпуса разных моделей по терабайтам.'
  explanation: У Llama 3 15.6 триллиона токенов пришло из источников общим сырым объёмом больше 5 ТБ — соотношение здесь результат фильтрации, дедупликации и повторов, а не физическое свойство данных. Терабайты меряют хранение, токены — обучающее воздействие.
  kind: open
  reference: 'Терабайты — место на диске до обработки; токены — сколько текстовых фрагментов модель реально увидела на обучении. Между ними стоит вся подготовка: дедупликация и фильтрация выбрасывают большую часть сырых байтов (у веб-обхода — почти всё), а отобранные высококачественные источники могут повторяться и давать долю учебного потока непропорционально своему размеру на диске. Плюс сам коэффициент байт-в-токен непостоянен: код, математика, языки с небайтовым письмом токенизируются с разной плотностью. Поэтому два корпуса одинакового объёма в ТБ дают разное число токенов, и сравнивать надо токены.'
  id: 006-racion-llama-2
  fingerprint: d5a185ff
