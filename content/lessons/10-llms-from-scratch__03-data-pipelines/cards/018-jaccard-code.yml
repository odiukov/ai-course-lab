- concept: коэффициент Жаккара равен размеру пересечения множеств шинглов, делённому на размер их объединения
  question: У документа A 40 шинглов, у документа B 60 шинглов, общих у них 24 шингла. Чему равен коэффициент Жаккара этих двух документов? Ответ округли до двух знаков.
  explanation: 'Пересечение = 24. Объединение = 40 + 60 − 24 = 76 (общие шинглы нельзя считать дважды). 24 / 76 ≈ 0.32. Частая ошибка — взять знаменателем 100 (сумму размеров) и получить 0.24: тогда сходство систематически занижается, и настоящие почти-дубли не проходят порог.'
  kind: numeric
  answer: 0.32
  tolerance: 0.01
  id: 018-jaccard-code-1
  fingerprint: be05680a
- concept: составные операторы над множествами меняют левый операнд на месте, поэтому функция сходства обязана использовать обычные операторы
  question: Функция считает сходство двух множеств шинглов и не должна портить переданные ей множества. Какая строка нарушает это требование?
  explanation: '`&=` — составное присваивание: оно перезаписывает s1 результатом пересечения на месте. Множество передано по ссылке, значит у вызывающего кода множество шинглов документа окажется урезанным, и все последующие сравнения этого документа дадут неверные значения. `s1 & s2` и `s1 | s2` создают новые множества и входные данные не трогают. То же различие между `s1.update(s2)` и `s1.union(s2)`.'
  kind: choice
  options:
    - inter = s1 & s2
    - s1 &= s2
    - union = s1 | s2
    - size = len(s1) + len(s2)
  correct: 1
  id: 018-jaccard-code-2
  fingerprint: 699eede2
- concept: при пустом объединении значение сходства выбирается по смыслу задачи дедупликации, а не выводится из формулы
  question: 'Формула сходства Жаккара при двух пустых множествах шинглов не определена: и пересечение, и объединение пусты. В пайплайне дедупликации корпуса такой случай договариваются считать нулевым сходством, а не единичным. Объясни, почему единица здесь была бы хуже.'
  explanation: 'Значение при пустом объединении — соглашение пайплайна: формула его не задаёт. Возврат 0.0 держит два эффекта вместе: документы без шинглов не объявляются дублями, и деления на ноль не происходит. Решение о судьбе коротких/пустых документов остаётся за фильтром длины, где оно и должно приниматься осознанно.'
  kind: open
  reference: 'Математически 0/0 не определён, поэтому значение — решение разработчика. Единица означала бы «полные дубли», и все документы, у которых шинглов не получилось (текст короче окна шинглирования, пустая строка после очистки), стали бы дублями друг друга и массово удалялись — то есть отбраковка шла бы по признаку отсутствия шинглов, а не по признаку сходства содержимого. Ноль означает «не дубли»: такие документы остаются в корпусе и отбраковываются, если нужно, отдельным фильтром длины/качества. Дополнительный эффект — ранняя проверка пустого объединения снимает ZeroDivisionError, поэтому функция не падает на краевых входах.'
  id: 018-jaccard-code-3
  fingerprint: f09ca873
