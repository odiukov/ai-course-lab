- concept: 'порядок этапов near-duplicate дедупликации: от текста к множеству, к подписи, к корзинам, к проверке'
  question: Расставь этапы поиска почти-дублей в корпусе по порядку выполнения.
  explanation: 'Каждый этап сжимает объём работы для следующего: шинглы делают документ множеством, MinHash делает множество коротким вектором, LSH сокращает число пар, и только на самом маленьком остатке считается дорогое точное Jaccard-сходство. Порог отсечения обычно берут около 0.8.'
  kind: order
  items:
    - Разбить текст документа на множество n-грамм (шинглов)
    - Свернуть множество шинглов в MinHash-подпись фиксированной длины
    - Разложить подписи по корзинам LSH и собрать пары-кандидаты
    - Посчитать точное Jaccard-сходство для каждой пары-кандидата
    - Удалить одну копию из пар, где сходство выше порога
  id: 027-lsh-visual-1
  fingerprint: aab27255
- concept: в LSH пара становится кандидатом при полном совпадении хотя бы одной полосы подписи, а не при совпадении всех полос
  question: MinHash-подпись из 200 чисел разбита на 50 полос по 4 числа. Какое условие делает два документа парой-кандидатом?
  explanation: 'Полоса работает как адрес корзины: хешируется вся полоса целиком, поэтому её 4 числа должны совпасть все сразу. Зато полос много, и условие между ними — ИЛИ: одного попадания в общую корзину достаточно. Требование совпадения всех 50 полос свело бы схему почти к точному совпадению, а отдельные разрозненные числа корзину не задают.'
  kind: choice
  options:
    - Хотя бы одна из 50 полос совпала у них целиком, все 4 числа полосы
    - Все 50 полос совпали целиком
    - Совпало хотя бы одно из 200 чисел подписи, в любой позиции
    - Совпало не менее половины чисел подписи, независимо от их расположения по полосам
  correct: 0
