- concept: общая корзина LSH — это гипотеза о сходстве, требующая проверки точным Jaccard, потому что схема намеренно допускает ложных кандидатов
  question: Два документа попали в одну корзину LSH. Почему их нельзя сразу объявить дублями и удалить один из них?
  explanation: 'LSH меняет полноту на скорость: он даёт короткий список пар, заслуживающих проверки. Удаление без проверки выбрасывало бы уникальные документы, случайно разделившие корзину с чужим текстом.'
  kind: open
  reference: 'Корзина отбирает кандидатов, а не выносит вердикт. Совпадение полосы возможно и у документов с низким реальным сходством: полоса — это лишь несколько позиций подписи, а сама подпись — вероятностная оценка Jaccard. Схему настраивают так, чтобы почти не терять настоящие дубли, и платят за это ложными кандидатами. Поэтому по каждой паре из корзины считают точное Jaccard-сходство множеств шинглов и удаляют копию только при превышении порога (обычно 0.8). Ценность LSH в том, что он отсёк подавляющее большинство заведомо непохожих пар и сделал дорогую проверку выполнимой.'
  id: 027-lsh-visual-3
  fingerprint: 1ed88915
