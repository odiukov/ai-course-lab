- concept: покрытие vocabulary равно доле уникальных встретившихся id токенов от размера словаря токенизатора
  question: Корпус токенизирован токенизатором с размером vocabulary 8192. При подсчёте уникальных идентификаторов токенов в корпусе их оказалось 3072. Чему равно покрытие vocabulary (долей от единицы)?
  explanation: 'vocab_utilization = unique_tokens / tokenizer_vocab_size = 3072 / 8192 = 0.375, то есть 37.5%. Считается по множеству уникальных id, а не по общему числу токенов: сколько раз встретился каждый id, на метрику не влияет.'
  kind: numeric
  answer: 0.375
  tolerance: 0.005
  id: 045-statistiki-korpusa-1
  fingerprint: 3d494855
- concept: средняя длина документа не различает распределения, крайности видны только по минимуму и максимуму
  question: У двух корпусов средняя длина документа в словах совпадает и равна 400. Какой вывод о них правомерен?
  explanation: Одно среднее не задаёт распределение. Минимум и максимум длин сразу показывают крайности, а полную картину даёт распределение длин целиком. Число документов и покрытие vocabulary из средней длины не выводятся.
  kind: choice
  options:
    - Оба корпуса состоят из документов примерно одинаковой длины
    - 'Совпадение средних не различает корпуса: один может быть однородным, другой — смесью заметок на 12 слов и текстов на 9000 слов'
    - У обоих корпусов совпадёт и число документов
    - У обоих корпусов совпадёт покрытие vocabulary
  correct: 1
  id: 045-statistiki-korpusa-2
  fingerprint: de7df7a2
- concept: покрытие vocabulary показывает, какая часть словаря задействована данными, но не измеряет качество корпуса
  question: Объясни своими словами, почему низкое покрытие vocabulary нельзя трактовать как признак плохого корпуса, а высокое — как признак хорошего.
  explanation: Метрика связывает две вещи — словарь токенизатора и данные — и не смотрит на содержание текстов. Её читают как сигнал о том, насколько словарь подходит корпусу, а выводы о качестве делают по другим проверкам.
  kind: open
  reference: 'Покрытие показывает лишь, какая доля уже существующего словаря токенизатора реально встретилась в данных. Низкое покрытие может означать, что корпус узкодоменный и редкие токены словаря ему просто не нужны — на качестве текстов это не сказывается. Высокое покрытие может возникнуть из-за шума: мусорные символы, битая кодировка, случайные строки задевают много редких id и поднимают метрику. Поэтому это диагностика соответствия словаря данным, а не оценка качества корпуса; качество проверяют фильтрами и дедупликацией.'
  id: 045-statistiki-korpusa-3
  fingerprint: 8083f6ab
