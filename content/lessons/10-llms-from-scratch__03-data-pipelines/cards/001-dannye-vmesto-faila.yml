- concept: Chinchilla-оптимум задаёт примерно 20 обучающих токенов на каждый параметр модели
  question: Вы планируете обучение модели на 13 миллиардов параметров и хотите попасть в compute-оптимальное соотношение из статьи Chinchilla. Сколько примерно триллионов обучающих токенов нужно пропустить через модель?
  explanation: Chinchilla-оптимум ≈ 20 токенов на параметр (у самой Chinchilla 1.4T токенов на 70B параметров). 13B × 20 = 260B токенов = 0.26 триллиона. Меньше — модель недообучена, параметры простаивают.
  kind: numeric
  answer: 0.26
  tolerance: 0.03
  id: 001-dannye-vmesto-faila-1
  fingerprint: 6e3c652c
- concept: при фиксированном бюджете compute перекачанные параметры при малом числе токенов проигрывают меньшей модели, обученной дольше
  question: 'Два эксперимента съедают примерно одинаковый бюджет compute: модель A — 200B параметров на 200B токенов, модель B — 40B параметров на 1.0T токенов. Что предсказывает Chinchilla?'
  explanation: 'У A ~1 токен на параметр, у B — 25. Это ровно случай Gopher (280B на 300B токенов) против Chinchilla (70B на 1.4T): вчетверо меньшая модель обошла большую, потому что увидела в 20 раз больше данных. Compute можно потратить на параметры или на токены — Chinchilla указывает оптимальную пропорцию.'
  kind: choice
  options:
    - 'A будет лучше: параметров в пять раз больше, а объём данных на качество почти не влияет'
    - 'B будет лучше: A недообучена — на параметр приходится около 1 токена вместо ~20'
    - 'Модели окажутся эквивалентны: при равном compute результат от распределения параметров и токенов не зависит'
    - 'Предсказать нельзя: качество определяется только архитектурой трансформерных блоков'
  correct: 1
  id: 001-dannye-vmesto-faila-2
  fingerprint: d59ed478
- concept: при почти одинаковой архитектуре разницу в качестве LLM определяет корпус данных, а не устройство модели
  question: Три современные LLM собраны из одинаковых по сути блоков (attention + feedforward), но заметно отличаются по качеству вывода. Объясни своими словами, откуда берётся разница и почему пайплайн данных — часть архитектуры результата.
  explanation: 'Ключ: данные, а не блоки. Качество и объём корпуса плюс пропускная способность пайплайна определяют, выучит модель язык или шум.'
  kind: open
  reference: 'Архитектура у больших моделей почти унифицирована — стопка трансформерных блоков. Отличаются они корпусом: объёмом токенов (Llama 3 — 15.6T, DeepSeek-V2 — 8.1T, GPT-3 — 300B) и его качеством: очисткой, дедупликацией, фильтрацией по качеству. Модель выучивает распределение того, что ей подали, поэтому мусор в корпусе становится мусором в выводе, а нехватка токенов оставляет параметры недообученными. Плюс инженерное требование: пайплайн должен отдавать батчи быстрее, чем GPU их потребляют, иначе кластер простаивает и бюджет compute сгорает впустую.'
  id: 001-dannye-vmesto-faila-3
  fingerprint: 80e73902
