- concept: пропущенная LSH-парой пара документов не возвращается изменением порога точной проверки — лечится только настройкой генерации кандидатов
  question: Два документа имеют истинное Jaccard-сходство 0.91, но не совпали ни в одной полосе LSH и потому не попали в список кандидатов. Какое изменение конфигурации даёт шанс поймать эту пару?
  explanation: 'Порог применяется только к парам, которые уже стали кандидатами. Если общей корзины не нашлось, точная проверка вообще не запускается, и любое значение порога ни на что не влияет. Полнота кандидатов регулируется разбиением подписи: больше полос — короче полоса — легче совпадение — больше кандидатов (и больше ложных срабатываний в придачу).'
  kind: choice
  options:
    - Понизить порог точной проверки с 0.9 до 0.75
    - Увеличить число полос (уменьшить число строк в полосе) при том же размере подписи
    - Оставить настройки и повторить прогон — при том же наборе хеш-функций пара всплывёт сама
    - Повысить порог точной проверки, чтобы отсечь лишние пары и освободить место
  correct: 1
  id: 030-dedup-tradeoffs-1
  fingerprint: b55da9f1
- concept: порог точной проверки задаёт компромисс между сохранёнными дублями и удалёнными непохожими документами
  question: Порог точной Jaccard-проверки в near-duplicate дедупликации подняли с 0.75 до 0.95. Объясни своими словами, как это изменит состав итогового корпуса и на какой тип ошибок порог вообще не влияет.
  explanation: Порог — второй этап конвейера. Он отвечает на вопрос «достаточно ли похож найденный кандидат», а не «всех ли кандидатов нашли». Пропуски на этапе поиска кандидатов исправляются параметрами LSH, а не порогом.
  kind: open
  reference: 'Высокий порог делает удаление более консервативным: удаляются только очень близкие пары, поэтому меньше риск выбросить содержательно разные документы, но в корпусе остаётся больше пере­писанных и слегка изменённых копий. Порог 0.75, наоборот, чистит агрессивнее и режет часть законно разных текстов. Компромисс односторонний: порог управляет только решением по уже найденным кандидатам. На пары, которые LSH не предложил, он не действует — такие дубли остаются в корпусе при любом пороге.'
  id: 030-dedup-tradeoffs-2
  fingerprint: 56c5407c
