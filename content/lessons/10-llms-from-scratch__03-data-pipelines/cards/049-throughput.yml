- concept: замер на слишком коротком прогоне искажён фиксированными накладными расходами старта, поэтому мерят большой фрагмент и повторяют
  question: Замер пропускной способности сделан на одном документе и занял 0.7 секунды. Почему полученное число ненадёжно?
  explanation: 'Накладные расходы старта фиксированные: на коротком прогоне они занимают почти всё время и метрика получается случайной. Лечится прогоном достаточно большого фрагмента и несколькими повторами замера.'
  kind: choice
  options:
    - Запуск процессов, чтение первого шарда и заполнение буферов занимают непропорционально большую долю такого короткого прогона
    - На коротких документах токенизатор работает по другому алгоритму
    - Пропускная способность определена только для корпусов, размер которых кратен размеру шарда
    - Один документ всегда даёт завышенную скорость, потому что помещается в кэш
