- concept: пропускная способность равна числу обработанных токенов, делённому на полное время замера
  question: Пайплайн подготовки данных выдал 72 400 реальных токенов за 8 секунд работы. Какова пропускная способность в токенах в секунду?
  explanation: tokens/sec = обработанные токены / время. 72 400 / 8 = 9050 tokens/sec. Это средний темп за весь замер, а не гарантия, что каждую секунду выдавалось ровно столько.
  kind: numeric
  answer: 9050
  tolerance: 50
  id: 049-throughput-1
  fingerprint: 555b1a32
- concept: в числителе throughput считают только реальные токены, PAD исключают, иначе метрика растёт без роста полезной работы
  question: Инженер меряет скорость подготовки данных и включает в числитель PAD-токены вместе с реальными. Что произойдёт с метрикой tokens/sec?
  explanation: PAD раздувает числитель, знаменатель тот же — метрика улучшается на бумаге, а полезных токенов пайплайн выдаёт столько же. Поэтому для скорости подготовки данных считают только настоящие токены.
  kind: choice
  options:
    - Она вырастет, хотя количество полезных токенов и время остались прежними
    - Она упадёт, потому что PAD увеличивает время обработки
    - 'Она не изменится: PAD не участвует в вычислениях'
    - Она станет точнее, потому что учитывает реальный размер тензоров
  correct: 0
