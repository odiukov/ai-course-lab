- concept: доля капса считается как отношение слов целиком в верхнем регистре ко всем словам документа
  question: Документ содержит 200 слов, из них 76 написаны целиком заглавными буквами. Чему равна доля капса, по которой фильтр качества принимает решение?
  explanation: Доля = 76/200 = 0,38. Решение принимается по всему документу, поэтому отдельные аббревиатуры вроде NASA почти не двигают долю. При пороге 0,25 такой документ отклоняется, при пороге 0,45 — проходит.
  kind: numeric
  answer: 0.38
  tolerance: 0.01
  id: 010-quality-heuristics-1
  fingerprint: 8f66085f
- concept: спецсимволами считаются все символы, кроме буквенно-цифровых и пробельных, а доля берётся от общего числа символов текста
  question: Фильтр качества отбраковывает документы по доле спецсимволов. Какие символы попадают в числитель этой доли?
  explanation: Условие `not c.isalnum() and not c.isspace()` считает символ шумом, если он не буквенно-цифровой и не пробельный. Если бы пробелы попадали в числитель, любой нормальный текст с долей пробелов около 0,15 сразу вылетал бы за порог 0,1.
  kind: choice
  options:
    - Все символы, кроме букв и цифр, включая пробелы, табуляции и переводы строк
    - Все символы, кроме букв, цифр и пробельных символов
    - Только знаки препинания из заранее заданного списка
    - Только символы за пределами ASCII
  correct: 1
  id: 010-quality-heuristics-2
  fingerprint: a8e887c3
- concept: ужесточение порогов формальных признаков увеличивает долю ложных отбраковок полезных документов
  question: Порог доли спецсимволов в фильтре качества снизили с 0,08 до 0,02. Какой основной эффект это даст на корпусе веб-страниц?
  explanation: Пороги ловят подозрительную форму, а не истинное качество. Технический текст со скобками, операторами и пунктуацией легко даёт долю спецсимволов выше 0,02, поэтому строгий порог режет полезные документы. Три числа фильтра — это компромисс между терпимым шумом и потерей полезных исключений.
  kind: choice
  options:
    - Отсеется больше машинного шума, но вместе с ним уйдут листинги кода, формулы и таблицы
    - Отсеется только машинный шум, полезные документы не пострадают
    - Отсев не изменится, потому что порог влияет лишь на очень короткие документы
    - Вырастет доля мусора, так как проверка станет мягче
  correct: 0
  id: 010-quality-heuristics-3
