- concept: ожидаемое число совпавших позиций подписи равно произведению числа хеш-функций на истинное Jaccard-сходство
  question: Истинное Jaccard-сходство двух документов равно 0,3. Подписи построены на 640 независимых хеш-функциях. Сколько позиций подписи совпадёт в среднем?
  explanation: 'Вероятность совпадения на отдельной позиции равна истинному Jaccard, значит в среднем совпадёт 640 × 0,3 = 192 позиции. Оценка несмещённая: центр колебаний попадает точно в истинное значение, но конкретный замер даст 185 или 199 — почти никогда ровно 192.'
  kind: numeric
  answer: 192
  tolerance: 1
