- concept: разброс оценки уменьшают только независимые хеш-функции, а копии одной функции не добавляют новой информации о сходстве
  question: Вместо 300 независимых хеш-функций инженер берёт 3 хеш-функции и записывает каждую в подпись по 100 раз, получая подпись длиной 300. Что произойдёт с разбросом оценки Jaccard?
  explanation: Взаимное погашение случайных отклонений работает только для независимых проверок. Сотня копий одной хеш-функции всегда совпадает или не совпадает вместе, поэтому в подписи из 300 позиций реальной информации ровно на 3 испытания — разброс остаётся огромным.
  kind: choice
  options:
