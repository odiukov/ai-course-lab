  question: В документе 400 слов, из них 140 — чисто числовые токены вида "1875", остальные написаны строчными буквами. Чему равна доля слов капсом, которую посчитает фильтр?
  explanation: 'Проверка на верхний регистр требует хотя бы одну букву: у токена "1875" букв нет, и он капсом не считается. Доля равна 0/400 = 0, порог по капсу такой документ не тронет. Отбраковать таблицу цифр может только проверка доли спецсимволов.'
