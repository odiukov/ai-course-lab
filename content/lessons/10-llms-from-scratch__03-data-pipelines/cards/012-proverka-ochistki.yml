  question: Расставь этапы обработки сырого документа из веб-обхода так, чтобы пороги качества считались по осмысленным числам.
  explanation: Если считать доли до очистки, угловые скобки, кавычки и слэши из разметки попадут в спецсимволы, и нормальная статья превысит порог из-за вёрстки, а не из-за качества текста. Очистка идёт первой, пороги применяются к тому тексту, который реально попадёт в корпус.
