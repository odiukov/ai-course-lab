- concept: fertility как число токенов на слово переводит объём текста в объём токенов и выше для нелатинских письменностей
  question: Корпус содержит 5000 слов на языке с нелатинской письменностью, для которого fertility токенизатора равна 2.4 токена на слово. Сколько примерно токенов даст этот корпус после токенизации?
  explanation: 'Fertility — среднее число токенов на слово: 5000 × 2.4 = 12000 токенов. Для английского в GPT-4 fertility около 1.3, поэтому те же 5000 слов дали бы ~6500 токенов. Нелатинские письменности дробятся сильнее, и один и тот же смысловой объём стоит почти вдвое больше токенов — это влияет и на бюджет обучения, и на цену инференса.'
  kind: numeric
  answer: 12000
  tolerance: 100
  id: 053-final-quiz-1
  fingerprint: 2f6ef799
- concept: perplexity-фильтр отбраковывает документ по непохожести на эталонный чистый текст, а не по сложности или редкости темы
  question: Документы корпуса оценивают маленькой языковой моделью, обученной на эталонном чистом тексте, и отбрасывают те, у которых perplexity высока. Что фактически означает высокая perplexity документа?
  explanation: Perplexity измеряет только то, насколько эталонная модель «удивлена» текстом. Высокое значение = распределение слов непохоже на чистые эталонные данные, что типично для мусора, спама, битой разметки. Но фактическую правдивость, дубли и длину такой фильтр не проверяет, а осмысленный текст редкого домена (код, математика, узкая специальность) может отбраковаться ложно.
  kind: choice
  options:
    - Документ содержит фактические ошибки
    - Документ не похож на тот текст, на котором обучалась эталонная модель
    - Документ слишком длинный для одной последовательности
    - Документ дублирует другой документ корпуса
  correct: 1
