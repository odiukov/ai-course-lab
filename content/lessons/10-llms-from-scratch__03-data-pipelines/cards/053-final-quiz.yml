- concept: attention mask в упакованной последовательности запрещает attention пересекать границы документов, иначе модель учит связи между несвязанными текстами
  question: Несколько независимых документов уложены в одну последовательность фиксированной длины. Объясни своими словами, зачем при этом нужна attention mask, запрещающая attention пересекать границы документов, и что произойдёт без неё.
  explanation: 'Упаковка убирает потери на паддинг, но создаёт новую проблему: границы документов внутри блока существуют только логически. Работоспособной упаковка становится лишь в паре с корректной маской — иначе выигрыш в утилизации оплачивается порчей обучающего сигнала.'
  kind: open
  reference: 'Плотная упаковка кладёт в один блок разные документы, между которыми нет смысловой связи. Attention mask — бинарная маска, которая для каждого токена разрешает смотреть только на токены своего документа. Без такой маски токен видит предыдущий, посторонний документ и модель учится предсказывать продолжение по несвязанному контексту: появляются ложные зависимости, обучающий сигнал шумит, а качество падает тем сильнее, чем больше документов попадает в один блок. Служебный токен конца документа сам по себе только помечает границу, но не мешает attention её пересечь — блокирует именно маска.'
  id: 053-final-quiz-3
  fingerprint: ec9bf393
