<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Разбираем смесь данных Llama 3</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f9fc;
      --ink: #172033;
      --muted: #596579;
      --line: #c7cfdd;
      --panel: #ffffff;
      --band: #e9eef7;
      --web: #3677d8;
      --code: #7254c7;
      --books: #d97834;
      --math: #2c9a76;
      --multi: #c64f79;
      --inside: #ffffff;
      --focus: #4d3698;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #101522;
        --ink: #eef3ff;
        --muted: #b3bed2;
        --line: #465168;
        --panel: #171e2d;
        --band: #222c3f;
        --web: #5592ef;
        --code: #9278e8;
        --books: #ed995c;
        --math: #4fc39b;
        --multi: #e06f98;
        --inside: #ffffff;
        --focus: #c2b4ff;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      padding: 12px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: -0.01em;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 470px;
      overflow: visible;
      background: var(--panel);
      border: 2px solid var(--line);
    }

    svg text {
      font-family: inherit;
      fill: var(--ink);
    }

    .segment {
      stroke: var(--panel);
      stroke-linejoin: round;
    }

    .segment-web,
    .swatch-web {
      fill: var(--web);
    }

    .segment-code,
    .swatch-code {
      fill: var(--code);
    }

    .segment-books,
    .swatch-books {
      fill: var(--books);
    }

    .segment-math,
    .swatch-math {
      fill: var(--math);
    }

    .segment-multi,
    .swatch-multi {
      fill: var(--multi);
    }

    .pie-outline {
      fill: none;
      stroke: var(--line);
    }

    .divider {
      stroke: var(--line);
    }

    .legend-name {
      font-weight: bold;
    }

    .legend-amount {
      fill: var(--muted);
    }

    .inside-label {
      fill: var(--inside);
      font-weight: bold;
      paint-order: stroke;
      stroke: rgba(20, 27, 42, 0.28);
      stroke-linejoin: round;
    }

    .code-mark {
      fill: none;
      stroke: var(--focus);
    }

    .summary-band {
      fill: var(--band);
      stroke: var(--line);
    }

    .summary-main {
      font-weight: bold;
    }

    .summary-note {
      fill: var(--muted);
    }

    .fallback {
      fill: var(--ink);
    }

    noscript p {
      margin: 8px 0 0;
      padding: 12px;
      background: var(--panel);
      border: 2px solid var(--line);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>Разбираем смесь данных Llama 3</h1>

  <svg
    id="diagram"
    viewBox="0 0 960 430"
    width="960"
    height="430"
    preserveAspectRatio="xMidYMid meet"
    role="img"
    aria-labelledby="diagram-title diagram-desc"
  >
    <title id="diagram-title">Круговая диаграмма смеси данных Llama 3</title>
    <desc id="diagram-desc">
      Из 15,6 триллиона токенов 50% приходится на веб, 25% на код,
      13% на книги и научные статьи, 8% на математику и 4% на
      многоязычный веб.
    </desc>
  </svg>

  <noscript>
    <p>
      Смесь Llama 3: веб — 50% и 7,8 трлн токенов; код — 25% и
      3,9 трлн; книги и научные статьи — 13% и примерно 2 трлн;
      математика — 8% и 1,25 трлн; многоязычный веб — 4% и
      624 млрд. Всего — 15,6 трлн токенов.
    </p>
  </noscript>

  <script>
    const DATA = Object.freeze([
      {
        kind: "scene",
        logicalWidth: 96,
        logicalHeight: 43,
        center: [27.5, 20.2],
        radius: 15.2,
        startAngle: -90,
        fullTurnFactor: 2,
        halfTurn: 180,
        total: 100,
        largeArcAt: 50,
        smallArcFlag: "0",
        largeArcFlag: "1",
        sweepFlag: "1",
        divider: [[48, 4.5], [48, 35.7]],
        summaryBox: [7.5, 37.1, 81, 4.2],
        summaryMain: [9.5, 39.7],
        summaryNote: [47.5, 39.7],
        webInside: [33.5, 20.4],
        codeInside: [22.2, 27.2],
        codeRing: [27.5, 20.2, 16.1],
        fallback: [
          ["Схема должна была показать смесь Llama 3:", 8, 12],
          ["50% веба · 25% кода · 13% книг и научных статей", 8, 18],
          ["8% математики · 4% многоязычного веба", 8, 24],
          ["Всего: 15,6 трлн токенов", 8, 30]
        ]
      },
      {
        kind: "slice",
        key: "web",
        label: "Веб",
        pct: 50,
        amount: "7,8 трлн",
        swatch: [52, 4.8, 3.1, 3.1],
        namePoint: [56.8, 6.2],
        amountPoint: [56.8, 8.7]
      },
      {
        kind: "slice",
        key: "code",
        label: "Код",
        pct: 25,
        amount: "3,9 трлн",
        swatch: [52, 11.1, 3.1, 3.1],
        namePoint: [56.8, 12.5],
        amountPoint: [56.8, 15]
      },
      {
        kind: "slice",
        key: "books",
        label: "Книги и научные статьи",
        pct: 13,
        amount: "≈ 2 трлн",
        swatch: [52, 17.4, 3.1, 3.1],
        namePoint: [56.8, 18.8],
        amountPoint: [56.8, 21.3]
      },
      {
        kind: "slice",
        key: "math",
        label: "Математика",
        pct: 8,
        amount: "1,25 трлн",
        swatch: [52, 23.7, 3.1, 3.1],
        namePoint: [56.8, 25.1],
        amountPoint: [56.8, 27.6]
      },
      {
        kind: "slice",
        key: "multi",
        label: "Многоязычный веб",
        pct: 4,
        amount: "624 млрд",
        swatch: [52, 30, 3.1, 3.1],
        namePoint: [56.8, 31.4],
        amountPoint: [56.8, 33.9]
      }
    ]);

    const origin = Object.freeze({ x: 0, y: 0 });
    const scale = 10;
    const CANVAS = Object.freeze({ width: 960, height: 430 });
    const LABEL_PAD = 12;
    const LINE = 2;
    const FONT = Object.freeze({
      inside: 18,
      legendName: 18,
      legendAmount: 16,
      summaryMain: 17,
      summaryNote: 15,
      fallback: 18
    });

    const sx = x => origin.x + x * scale;
    const sy = y => origin.y + y * scale;

    const svg = document.getElementById("diagram");
    const namespace = "http://www.w3.org/2000/svg";
    const scene = DATA.find(item => item.kind === "scene");
    const slices = DATA.filter(item => item.kind === "slice");

    function make(tag, attributes, parent) {
      const node = document.createElementNS(namespace, tag);
      Object.entries(attributes).forEach(([name, value]) => {
        node.setAttribute(name, String(value));
      });
      (parent || svg).appendChild(node);
      return node;
    }

    function addText(content, point, className, fontSize, anchor) {
      const [x, y] = point;
      const text = make("text", {
        x: sx(x),
        y: sy(y),
        class: className,
        "font-size": fontSize,
        "text-anchor": anchor,
        "dominant-baseline": "middle"
      });
      text.textContent = content;
      return text;
    }

    try {
      const [centerX, centerY] = scene.center;
      const radiusX = sx(scene.radius) - sx(origin.x);
      const radiusY = sy(scene.radius) - sy(origin.y);

      make("rect", {
        x: sx(origin.x),
        y: sy(origin.y),
        width: sx(scene.logicalWidth) - sx(origin.x),
        height: sy(scene.logicalHeight) - sy(origin.y),
        fill: "var(--panel)"
      });

      let currentAngle = scene.startAngle;

      slices.forEach(item => {
        const angleSize =
          scene.fullTurnFactor *
          scene.halfTurn *
          item.pct /
          scene.total;
        const endAngle = currentAngle + angleSize;
        const startRadians =
          currentAngle * Math.PI / scene.halfTurn;
        const endRadians =
          endAngle * Math.PI / scene.halfTurn;

        const startX =
          centerX + scene.radius * Math.cos(startRadians);
        const startY =
          centerY + scene.radius * Math.sin(startRadians);
        const endX =
          centerX + scene.radius * Math.cos(endRadians);
        const endY =
          centerY + scene.radius * Math.sin(endRadians);
        const largeArc =
          item.pct > scene.largeArcAt
            ? scene.largeArcFlag
            : scene.smallArcFlag;

        make("path", {
          d: [
            "M", sx(centerX), sy(centerY),
            "L", sx(startX), sy(startY),
            "A", radiusX, radiusY,
            scene.smallArcFlag,
            largeArc,
            scene.sweepFlag,
            sx(endX), sy(endY),
            "Z"
          ].join(" "),
          class: `segment segment-${item.key}`,
          "stroke-width": LINE,
          "vector-effect": "non-scaling-stroke"
        });

        currentAngle = endAngle;
      });

      make("circle", {
        cx: sx(centerX),
        cy: sy(centerY),
        r: sx(scene.radius) - sx(origin.x),
        class: "pie-outline",
        "stroke-width": LINE,
        "vector-effect": "non-scaling-stroke"
      });

      const [ringX, ringY, ringRadius] = scene.codeRing;
      make("circle", {
        cx: sx(ringX),
        cy: sy(ringY),
        r: sx(ringRadius) - sx(origin.x),
        class: "code-mark",
        "stroke-width": LINE,
        "vector-effect": "non-scaling-stroke"
      });

      addText(
        "50%",
        scene.webInside,
        "inside-label",
        FONT.inside,
        "middle"
      );

      addText(
        "25%",
        scene.codeInside,
        "inside-label",
        FONT.inside,
        "middle"
      );

      const [[dividerStartX, dividerStartY],
        [dividerEndX, dividerEndY]] = scene.divider;

      make("line", {
        x1: sx(dividerStartX),
        y1: sy(dividerStartY),
        x2: sx(dividerEndX),
        y2: sy(dividerEndY),
        class: "divider",
        "stroke-width": LINE,
        "vector-effect": "non-scaling-stroke"
      });

      slices.forEach(item => {
        const [swatchX, swatchY, swatchWidth, swatchHeight] =
          item.swatch;

        make("rect", {
          x: sx(swatchX),
          y: sy(swatchY),
          width: sx(swatchWidth) - sx(origin.x),
          height: sy(swatchHeight) - sy(origin.y),
          class: `swatch-${item.key}`,
          stroke: "var(--panel)",
          "stroke-width": LINE,
          "vector-effect": "non-scaling-stroke"
        });

        addText(
          `${item.label} · ${item.pct}%`,
          item.namePoint,
          "legend-name",
          FONT.legendName,
          "start"
        );

        addText(
          `${item.amount} токенов`,
          item.amountPoint,
          "legend-amount",
          FONT.legendAmount,
          "start"
        );
      });

      const [boxX, boxY, boxWidth, boxHeight] = scene.summaryBox;

      make("rect", {
        x: sx(boxX),
        y: sy(boxY),
        width: sx(boxWidth) - sx(origin.x),
        height: sy(boxHeight) - sy(origin.y),
        class: "summary-band",
        "stroke-width": LINE,
        "vector-effect": "non-scaling-stroke"
      });

      addText(
        "15,6 трлн токенов — вся смесь",
        scene.summaryMain,
        "summary-main",
        FONT.summaryMain,
        "start"
      );

      addText(
        "доля источника = доля учебного потока",
        scene.summaryNote,
        "summary-note",
        FONT.summaryNote,
        "start"
      );

      svg.style.padding = `${LABEL_PAD}px`;
      svg.setAttribute("data-canvas-width", String(CANVAS.width));
      svg.setAttribute("data-canvas-height", String(CANVAS.height));
    } catch (error) {
      svg.replaceChildren();

      const background = document.createElementNS(namespace, "rect");
      background.setAttribute("x", String(sx(origin.x)));
      background.setAttribute("y", String(sy(origin.y)));
      background.setAttribute(
        "width",
        String(sx(scene.logicalWidth) - sx(origin.x))
      );
      background.setAttribute(
        "height",
        String(sy(scene.logicalHeight) - sy(origin.y))
      );
      background.setAttribute("fill", "var(--panel)");
      svg.appendChild(background);

      scene.fallback.forEach(line => {
        const [content, x, y] = line;
        const text = document.createElementNS(namespace, "text");
        text.setAttribute("x", String(sx(x)));
        text.setAttribute("y", String(sy(y)));
        text.setAttribute("class", "fallback");
        text.setAttribute("font-size", String(FONT.fallback));
        text.setAttribute("text-anchor", "start");
        text.setAttribute("dominant-baseline", "middle");
        text.textContent = content;
        svg.appendChild(text);
      });
    }
  </script>
</body>
</html>
