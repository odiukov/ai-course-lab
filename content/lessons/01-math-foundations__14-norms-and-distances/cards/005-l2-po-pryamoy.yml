- concept: смена знака отдельной компоненты не меняет евклидову норму
  question: Как изменится евклидова норма вектора, если у одной его компоненты заменить знак на противоположный?
  explanation: Каждая компонента входит в норму через свой квадрат, поэтому противоположные по знаку значения дают одинаковый вклад в длину.
  kind: choice
  options:
    - Не изменится, потому что при возведении в квадрат знак исчезает
    - Уменьшится, потому что отрицательная компонента вычитается
    - Увеличится, потому что отрицательная компонента добавляет штраф
    - Станет неопределённой для отрицательной компоненты
