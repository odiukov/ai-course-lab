- concept: мера Жаккара равна отношению размера пересечения множеств к размеру их объединения
  question: Заполни формулу меры Жаккара для множеств A и B.
  explanation: В числителе считают общие элементы, а в знаменателе — все разные элементы из обоих множеств. Повторяющийся элемент входит в объединение без дублирования.
  kind: cloze
  template: J(A,B) = ___
  answer: '|A ∩ B| / |A ∪ B|'
  accept:
    - '|A∩B|/|A∪B|'
    - размер пересечения / размер объединения
    - card(A ∩ B) / card(A ∪ B)
  id: 029-jaccard-obshchee-ko-vsemu-1
  fingerprint: cda47b6f
- concept: расстояние Жаккара является дополнением сходства Жаккара до единицы
  question: Мера Жаккара для двух наборов равна 0,73. Чему равно расстояние Жаккара?
  explanation: 'Значение сходства вычитают из единицы: расстояние равно 0,27. Чем больше доля общих элементов, тем меньше это расстояние.'
  kind: numeric
  answer: 0.27
  tolerance: 0.001
