- concept: норма L∞ равна максимальному модулю координаты вектора
  question: Заполни пропуск в формуле нормы L∞.
  explanation: 'L∞ не суммирует координаты: она выбирает наибольшую из их абсолютных величин. Поэтому знак координаты не влияет на её вклад.'
  kind: cloze
  template: 'Для вектора x = (a, b, c): ‖x‖∞ = ___'
  answer: max(|a|, |b|, |c|)
  accept:
    - max(abs(a), abs(b), abs(c))
    - максимум из |a|, |b| и |c|
  id: 012-linf-hudshee-otklonenie-1
  fingerprint: 77a23028
- concept: изменение немаксимальной координаты не влияет на L∞, пока её модуль не превысит текущий максимум
  question: Модуль одной из координат вектора меньше максимального модуля среди остальных координат. При каком условии изменение только этой координаты не изменит норму L∞?
  explanation: Значение L∞ задаёт крупнейший модуль. Изменения меньших координат не влияют на результат, пока ни одна из них не становится больше действующего максимума.
  kind: open
  reference: Норма сохранится, если новый модуль изменённой координаты не превысит максимальный модуль среди неизменённых координат.
  id: 012-linf-hudshee-otklonenie-2
  fingerprint: 9ff7a0a9
