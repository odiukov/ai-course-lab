- concept: поиск HNSW последовательно уточняет позицию при спуске от верхнего слоя к нижнему
  question: Расположите этапы поиска запроса в многослойном графе HNSW в правильном порядке.
  explanation: HNSW сначала выполняет грубую навигацию по разреженному слою, затем использует достигнутую позицию как вход на более плотный слой. При каждом спуске поиск уточняется, а итоговый кандидат выбирается в нижней окрестности.
  kind: order
  items:
    - Начать с точки входа на верхнем слое
    - Переходить к соседям, которые ближе к запросу, пока улучшение возможно
    - Спуститься с найденной позиции на следующий слой
    - Повторять уточнение вплоть до нижнего слоя
    - Вернуть лучший из найденных кандидатов
