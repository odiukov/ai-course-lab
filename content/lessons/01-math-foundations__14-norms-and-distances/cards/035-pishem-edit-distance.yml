- concept: границы матрицы редакционного расстояния задаются длинами непустых префиксов
  question: Как инициализировать границы таблицы редакционного расстояния, соответствующие пустому префиксу одной из строк?
  explanation: Получить непустой префикс из пустого можно последовательными вставками, а превратить его в пустой — последовательными удалениями. Поэтому значение на границе совпадает с длиной соответствующего префикса.
  kind: choice
  options:
    - Заполнить обе границы одинаковым постоянным значением
    - Оставить границы пустыми и вычислить их вместе с внутренними ячейками
    - Расстояние от пустого префикса до префикса строки равно длине этого префикса
    - Скопировать на границы символы исходных строк
  correct: 2
  id: 035-pishem-edit-distance-1
  fingerprint: 3685241e
- concept: стоимость диагонального перехода определяется совпадением текущих символов
  question: Заполни пропуск в вычислении стоимости диагонального перехода, если a_char и b_char — сравниваемые символы.
  explanation: Сравнение различия ложно при совпадении символов и истинно при необходимости замены. Преобразование результата в целое число непосредственно задаёт стоимость перехода.
  kind: cloze
  template: replace_or_match = diagonal + ___
  answer: int(a_char != b_char)
  accept:
    - int(b_char != a_char)
    - (a_char != b_char)
    - (b_char != a_char)
  id: 035-pishem-edit-distance-2
  fingerprint: 587f75ed
- concept: порядок заполнения матрицы определяется зависимостями между префиксами
  question: Объясни, почему перед вычислением внутренней ячейки таблицы редакционного расстояния должны быть известны значения сверху, слева и по диагонали.
  explanation: Динамическое программирование строит решение для каждой пары префиксов из уже найденных решений меньших подзадач. Если нужный предшественник ещё не вычислен, применить рекуррентный переход невозможно.
  kind: open
  reference: Эти ячейки содержат оптимальные ответы для более коротких префиксов и соответствуют удалению, вставке и совпадению либо замене. Поэтому сначала инициализируют границы, а внутренние ячейки обходят в порядке, при котором все предшественники уже вычислены.
  id: 035-pishem-edit-distance-3
  fingerprint: 69b00eb3
