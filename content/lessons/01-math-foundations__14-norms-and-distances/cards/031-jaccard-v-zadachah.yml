  fingerprint: 777bedfe
- concept: IoU является мерой Жаккара для множеств пикселей переднего плана
  question: Как нужно представить результат сегментации и эталонную разметку, чтобы метрика Intersection over Union совпала с мерой Жаккара?
  explanation: Предсказанная маска задаёт множество пикселей объекта, а эталонная маска — второе множество. IoU делит размер их пересечения на размер объединения, то есть применяет меру Жаккара к пикселям.
  kind: choice
  options:
    - Как множества пикселей, отнесённых к объекту
    - Как списки яркостей всех пикселей изображения
    - Как векторы координат центров найденных областей
    - Как распределения цветов фоновых пикселей
  correct: 0
