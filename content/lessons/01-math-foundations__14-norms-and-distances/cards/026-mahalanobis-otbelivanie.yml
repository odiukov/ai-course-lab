- concept: расстояние Махаланобиса равно евклидовой длине после отбеливающего линейного преобразования
  question: Дана невырожденная ковариационная матрица данных. Расположите действия для вычисления расстояния Махаланобиса через отбеливание.
  explanation: Отбеливающее преобразование устраняет корреляции и нормирует разброс признаков. Евклидова длина преобразованной разности совпадает с расстоянием Махаланобиса в исходных координатах.
  kind: order
  items:
    - Найти обратную ковариационную матрицу
    - Построить отбеливающую матрицу W, чья граммова матрица равна найденной обратной матрице
    - Применить W к разности x − y
    - Найти евклидову длину преобразованной разности
  id: 026-mahalanobis-otbelivanie-1
  fingerprint: cdc3402b
- concept: при единичной ковариационной матрице расстояние Махаланобиса совпадает с евклидовым
  question: Ковариационная матрица признаков единичная. Как соотносятся расстояние Махаланобиса и евклидово расстояние между любыми двумя точками?
  explanation: Для единичной ковариационной матрицы обратная поправка ничего не меняет. Квадратичная форма становится обычной суммой квадратов координат разности, поэтому расстояния совпадают.
  kind: choice
  options:
    - Они совпадают
    - Расстояние Махаланобиса равно квадрату евклидова
    - Расстояние Махаланобиса всегда равно нулю
    - Их соотношение определяется только углом между точками
