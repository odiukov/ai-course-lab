- concept: косинусная близость убывает при увеличении угла между векторами
  question: Угол между ненулевыми векторами пары A меньше угла между векторами пары B. У какой пары косинусная близость больше?
  explanation: На диапазоне возможных углов между векторами косинус убывает с ростом угла. Поэтому меньшему углу соответствует большая косинусная близость; длины векторов на неё не влияют.
  kind: choice
  options:
