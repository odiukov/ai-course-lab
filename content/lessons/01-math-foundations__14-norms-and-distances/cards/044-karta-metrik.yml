- concept: метрику выбирают по структуре данных и смыслу существенных изменений
  question: Расположите этапы обоснованного выбора меры различия в правильном порядке.
  explanation: Формат данных сужает набор кандидатов, но окончательный выбор определяется задачей. Даже числовые векторы можно сравнивать разными способами в зависимости от того, важны ли направление, масштаб, корреляции или отдельные координаты.
  kind: order
  items:
    - 'Определить математическую природу объектов: множества, строки, числовые векторы или распределения'
    - Сформулировать, какие изменения объектов существенны для решаемой задачи
    - Выбрать меру, способ вычисления которой соответствует этим изменениям
  id: 044-karta-metrik-2
  fingerprint: 028c13f2
- concept: норма максимума подходит, когда результат определяется наибольшим покоординатным отклонением
  question: При контроле детали брак фиксируется, если хотя бы один измеряемый размер отклоняется от нормы слишком сильно. Какую норму следует использовать для объединения отклонений и почему?
  explanation: Суммарная или евклидова величина может скрыть критическое отклонение одной координаты среди малых отклонений остальных. Норма максимума сохраняет именно то значение, от которого зависит решение о браке.
  kind: open
  reference: 'Следует использовать норму максимума, или L-бесконечность: она равна наибольшему абсолютному отклонению среди координат и поэтому непосредственно отражает худшее измерение.'
  id: 044-karta-metrik-3
  fingerprint: 859a2edf
