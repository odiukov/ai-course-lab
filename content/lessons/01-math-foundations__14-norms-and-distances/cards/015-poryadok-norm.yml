- concept: условие равенства нормы-максимума, евклидовой и манхэттенской норм
  question: При каком условии все три нормы ненулевого вектора — норма-максимум, евклидова и манхэттенская — совпадают? Объясните своими словами.
  explanation: При единственной ненулевой координате каждая норма сводится к её модулю. Несколько ненулевых координат увеличивают сумму квадратов относительно максимального квадрата и сумму модулей относительно евклидовой нормы.
  kind: open
  reference: Все три нормы совпадают, когда у вектора ненулевая не более чем одна координата. Тогда максимум модулей, корень из суммы квадратов и сумма модулей равны модулю этой координаты. Если ненулевых координат несколько, появляются дополнительные положительные слагаемые, поэтому равенство нарушается.
  id: 015-poryadok-norm-2
  fingerprint: e99b6412
