- concept: квадратичный рост MSE делает эту функцию потерь чувствительнее к крупным ошибкам, чем MAE
  question: В наборе ошибок регрессионной модели появился одиночный крупный выброс, а остальные ошибки малы. Какая функция потерь придаст этому выбросу наибольший относительный вес?
  explanation: В MAE штраф растёт линейно, а в MSE — квадратично, поэтому крупная ошибка быстрее начинает доминировать в общей потере. Huber loss после порога переходит к линейному росту и тем самым ограничивает влияние выброса.
  kind: choice
  options:
    - MSE, потому что возводит ошибки в квадрат
    - MAE, потому что берёт абсолютные значения ошибок
    - Huber loss, потому что для крупных ошибок использует квадратичный штраф
    - Все три функции придадут выбросу одинаковый относительный вес
  correct: 0
  id: 018-mae-mse-huber-1
  fingerprint: d6e04657
- concept: Huber loss сочетает квадратичный штраф для малых ошибок с линейным штрафом для крупных
  question: Объясни своими словами, почему Huber loss одновременно обеспечивает плавное обучение на малых ошибках и устойчивость к выбросам.
  explanation: Квадратичная ветвь помогает плавно уточнять уже близкие предсказания. Линейная ветвь не позволяет очень большой ошибке непропорционально увеличить общую потерю.
  kind: open
  reference: Для малых ошибок Huber loss ведёт себя квадратично, как MSE, поэтому имеет плавный градиент около нуля. После заданного порога штраф растёт линейно, как MAE, и крупные выбросы не получают чрезмерного влияния.
  id: 018-mae-mse-huber-2
