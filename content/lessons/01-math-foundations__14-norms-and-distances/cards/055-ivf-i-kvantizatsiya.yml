- concept: IVF направляет запрос в ближайшие кластеры и просматривает только связанные с ними инвертированные списки
  question: Расположи этапы поиска в IVF-индексе в правильном порядке.
  explanation: IVF сначала использует центроиды для грубой маршрутизации запроса, а затем вычисляет расстояния только до объектов из выбранных списков. Это сокращает объём поиска по сравнению с полным перебором.
  kind: order
  items:
    - Найти ближайшие к запросу центроиды кластеров
    - Выбрать связанные с этими кластерами инвертированные списки
    - Сравнить запрос с кандидатами из выбранных списков
  id: 055-ivf-i-kvantizatsiya-1
  fingerprint: 961ee52e
- concept: квантование уменьшает объём хранения векторов ценой погрешности в оценке расстояний
  question: Поиск уже укладывается в требования по задержке, но векторный индекс занимает слишком много оперативной памяти. Какое изменение непосредственно решает эту проблему?
  explanation: Квантование хранит компактные коды вместо полных наборов координат, поэтому снижает расход памяти. Расстояния по таким кодам оцениваются приближённо, что может ухудшить качество поиска.
  kind: choice
  options:
    - Просматривать больше кластеров IVF при каждом запросе
    - Заменить точные координаты векторов компактными кодами квантования
    - Вычислять точные расстояния до всех векторов набора
    - Добавить дополнительные связи между узлами графового индекса
  correct: 1
