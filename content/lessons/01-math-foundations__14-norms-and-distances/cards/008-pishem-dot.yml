- concept: скалярное произведение определено для векторов одинаковой размерности
  question: Как должна поступить функция скалярного произведения, если ей передали векторы [8, 9] и [10, 11, 12]?
  explanation: Скалярное произведение сопоставляет координаты двух векторов позиция к позиции, поэтому их размерности должны совпадать. Молчаливое удаление или добавление координат изменило бы исходные векторы.
  kind: choice
  options:
