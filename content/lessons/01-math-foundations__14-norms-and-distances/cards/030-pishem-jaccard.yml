- concept: мера Жаккара для множеств не учитывает повторения элементов во входных коллекциях
  question: Как должно измениться сходство Жаккара, если в одном входном списке повторно добавить уже присутствующий тег?
  explanation: Жаккар сравнивает множества уникальных элементов. Преобразование списка в set удаляет дубликаты, поэтому повторный «круг» не меняет ни пересечение, ни объединение.
  kind: choice
  options:
    - Увеличиться, потому что совпадений стало больше
    - Уменьшиться, потому что список стал длиннее
    - Не измениться, если перед вычислением преобразовать коллекции в множества
    - Стать неопределённым из-за повторяющегося элемента
  correct: 2
  id: 030-pishem-jaccard-1
  fingerprint: ae556b48
- concept: два пустых множества требуют отдельной обработки при вычислении сходства Жаккара
  question: Что должна вернуть реализация сходства Жаккара для двух пустых множеств?
  explanation: У двух пустых множеств объединение тоже пусто, поэтому формула приводит к делению на ноль. По принятому соглашению такие множества полностью совпадают, и функция возвращает 1.0.
  kind: choice
  options:
    - Максимальное сходство, поскольку множества совпадают
    - Минимальное сходство, поскольку общих элементов нет
    - Бесконечность
    - Результат обычного деления размеров пересечения и объединения
