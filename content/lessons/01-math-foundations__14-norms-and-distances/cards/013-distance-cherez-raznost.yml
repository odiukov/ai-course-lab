- concept: инвариантность расстояния к общему сдвигу точек
  question: Оба вектора сдвинули на один и тот же вектор c. Заполни пропуск в формуле для расстояния, порождённого нормой.
  explanation: 'Общий сдвиг сокращается в разности: (a + c) − (b + c) = a − b. Вектор между точками и его норма поэтому не меняются.'
  kind: cloze
  template: d(a + c, b + c) = ___
  answer: d(a,b)
  accept:
    - d(a, b)
    - '||a-b||'
    - ‖a−b‖
