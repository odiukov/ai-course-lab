  fingerprint: 277ed557
- concept: обратная KL при ограниченном приближении склонна выбирать отдельную моду целевого распределения
  question: Объясни своими словами, почему минимизация D_KL(Q || P) может заставить однопиковую модель Q сосредоточиться около одной моды многомодального распределения P.
  explanation: 'Обратная KL особенно невыгодно оценивает вероятность, которую Q назначает областям с очень малой вероятностью по P. При недостаточно гибкой Q это создаёт mode-seeking поведение: модель предпочитает хорошо описать одну моду, а не соединять несколько мод.'
  kind: open
  reference: В обратной KL вклад взвешивается вероятностями Q. Если Q помещает массу в область, где P почти равна нулю, отношение q(x) к p(x) становится большим и возникает сильный штраф. Поэтому модели выгодно выбрать область одной моды P, не заполняя маловероятные промежутки между модами.
  id: 039-pryamaya-obratnaya-kl-2
  fingerprint: 866362b9
- concept: различие между направлениями KL исчезает, если модель может точно представить целевое распределение
  question: Заполни пропуск в условии общего оптимума прямой и обратной KL.
  explanation: При Q = P отношения вероятностей равны единице, поэтому обе KL-дивергенции достигают своего минимального значения. Разное mode-covering и mode-seeking поведение проявляется, когда семейство Q не может точно воспроизвести P.
  kind: cloze
  template: Если допустимое семейство Q содержит точное целевое распределение P, оба направления KL минимизируются при Q = ___.
  answer: P
  accept:
    - P
    - p
