- concept: алгоритм вычисления Lp-нормы вектора
  question: Расположи операции вычисления Lp-нормы в правильном порядке.
  explanation: 'Lp-норма объединяет координаты по единой схеме: модуль, степень p, сумма и корень той же степени.'
  kind: order
  items:
    - Взять абсолютные значения координат
    - Возвести каждое абсолютное значение в степень p
    - Сложить полученные значения
    - Извлечь из суммы корень степени p
  id: 009-lp-obshaya-semya-1
  fingerprint: ff60720a
- concept: рост p усиливает относительный вклад крупных координат в Lp-норму
  question: Объясни своими словами, как увеличение параметра p меняет вклад крупных и малых координат при вычислении Lp-нормы.
  explanation: 'Параметр p задаёт способ объединения координат: при его росте различия между крупными и малыми абсолютными значениями усиливаются до извлечения корня.'
  kind: open
  reference: Чем больше p, тем сильнее возведение в степень выделяет координаты с крупными абсолютными значениями относительно малых. Поэтому итоговая норма всё больше определяется крупнейшими координатами.
  id: 009-lp-obshaya-semya-2
  fingerprint: f199bb42
