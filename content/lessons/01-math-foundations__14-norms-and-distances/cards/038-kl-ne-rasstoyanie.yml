- concept: направленность KL-дивергенции нарушает требование симметрии метрики
  question: Для распределений P и Q оказалось, что D_KL(P || Q) не равно D_KL(Q || P). Какой вывод из этого следует?
  explanation: Для любой метрики должно выполняться d(P, Q) = d(Q, P). В KL-дивергенции члены суммы взвешиваются вероятностями первого распределения, поэтому перестановка P и Q в общем случае меняет результат.
  kind: choice
  options:
    - KL остаётся метрикой, поскольку обе величины неотрицательны
    - Распределения необходимо нормировать повторно
    - KL не является метрикой, поскольку результат зависит от порядка аргументов
    - Для восстановления симметрии достаточно выбрать другое основание логарифма
  correct: 2
  id: 038-kl-ne-rasstoyanie-1
  fingerprint: e22dfa0b
- concept: нарушение KL-дивергенцией неравенства треугольника
  question: Для распределений P, Q и R выполняется D_KL(P || R) > D_KL(P || Q) + D_KL(Q || R). Объясни своими словами, что это говорит о KL-дивергенции.
  explanation: 'Метрика обязана удовлетворять неравенству треугольника: прямое расстояние не должно превышать сумму расстояний через промежуточную точку. Приведённое соотношение нарушает это требование.'
  kind: open
  reference: 'KL-дивергенция нарушает неравенство треугольника: суммарное расхождение через промежуточное распределение Q оказалось меньше прямого расхождения. Следовательно, KL нельзя считать метрикой.'
  id: 038-kl-ne-rasstoyanie-2
  fingerprint: f348d3c5
