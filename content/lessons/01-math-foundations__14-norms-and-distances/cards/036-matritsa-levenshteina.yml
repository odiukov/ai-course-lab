- concept: смысл внутренней клетки матрицы редакционного расстояния
  question: Что означает элемент D[i, j] в матрице Левенштейна для строк A и B?
  explanation: Каждая клетка решает отдельную задачу для пары префиксов. Поэтому правый нижний элемент матрицы для kitten и sitting представляет расстояние уже между полными строками и равен 3.
  kind: choice
  options:
    - Число совпадающих символов во всей строке A и префиксе B[:j]
    - Стоимость преобразования всей строки A во всю строку B после i + j операций
    - Минимальное число правок для преобразования префикса A[:i] в префикс B[:j]
    - Разность длин префиксов A[:i] и B[:j]
  correct: 2
  id: 036-matritsa-levenshteina-1
  fingerprint: 5a68470e
- concept: полнота рекуррентного перехода в алгоритме Левенштейна
  question: Почему при вычислении внутренней клетки матрицы Левенштейна достаточно сравнить переходы слева, сверху и по диагонали?
  explanation: Переход слева соответствует вставке, сверху — удалению, по диагонали — совпадению или замене последних символов. Любой допустимый путь должен завершаться одним из этих способов, поэтому выбор минимальной стоимости не упускает оптимальное преобразование.
  kind: open
  reference: Последний шаг любого преобразования рассматриваемых префиксов можно представить как вставку последнего символа, удаление последнего символа либо сопоставление последних символов с возможной заменой. Этим случаям соответствуют переходы слева, сверху и по диагонали, поэтому минимум их стоимостей охватывает все варианты оптимального завершения.
  id: 036-matritsa-levenshteina-2
  fingerprint: 2874a917
