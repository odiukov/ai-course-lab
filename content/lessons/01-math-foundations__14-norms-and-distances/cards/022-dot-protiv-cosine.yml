- concept: скалярное произведение объединяет длины векторов и косинус угла между ними
  question: Заполни пропуск в формуле, связывающей скалярное произведение с длинами и направлением векторов.
  explanation: Множитель cos(θ) отражает согласованность направлений, а нормы ||a|| и ||b|| — длины векторов. Поэтому скалярное произведение зависит и от направления, и от масштаба.
  kind: cloze
  template: a · b = ||a|| · ||b|| · ___
  answer: cos(θ)
  accept:
    - cos(theta)
    - cos(угла между a и b)
    - cos ∠(a,b)
  id: 022-dot-protiv-cosine-1
  fingerprint: f0bd9d8d
- concept: из-за учёта длины скалярное произведение может ранжировать векторы иначе, чем косинусная близость
  question: Длина запроса q равна 2. Для объекта x длина вектора равна 8, а косинусная близость с q — 0.5. Для объекта y длина равна 4, а косинусная близость — 0.75. Как различается их ранжирование?
  explanation: Для x скалярное произведение равно 2 · 8 · 0.5 = 8, а для y — 2 · 4 · 0.75 = 6. Поэтому dot ставит x выше благодаря большей длине, хотя направление y лучше согласовано с запросом.
  kind: choice
  options:
    - Скалярное произведение ставит x выше y, а косинусная близость — y выше x
    - Обе меры ставят x выше y
    - Обе меры ставят y выше x
    - Скалярные произведения равны, хотя косинусная близость выше у y
