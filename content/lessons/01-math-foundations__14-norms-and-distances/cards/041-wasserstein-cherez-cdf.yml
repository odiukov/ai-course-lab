- concept: разность CDF в точке выражает дисбаланс массы, которая должна пересечь эту точку
  question: Для некоторой координаты t накопленные вероятности равны F_P(t) = 0,7 и F_Q(t) = 0,4. Как интерпретировать их разность 0,3 в задаче переноса P в Q?
  explanation: 'CDF учитывает всю массу слева от выбранной координаты. Избыток 0,3 у P относительно Q нельзя устранить перестановками только слева от t: этот объём массы должен пересечь границу. Интегрирование таких дисбалансов по прямой даёт расстояние Вассерштейна.'
  kind: choice
  options:
    - Это чистый избыток массы слева от t, который должен пересечь границу в точке t
    - Это расстояние, на которое требуется переместить каждую частицу
    - Это разность плотностей распределений непосредственно в точке t
    - Это вероятность того, что обе случайные величины примут одинаковое значение
