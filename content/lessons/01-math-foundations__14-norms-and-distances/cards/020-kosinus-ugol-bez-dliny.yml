- concept: косинусная близость не определена для нулевого вектора
  question: Что произойдёт при попытке вычислить косинусную близость нулевого и ненулевого векторов по стандартной формуле?
  explanation: В знаменателе стоит произведение норм сравниваемых векторов. Норма нулевого вектора равна нулю, поэтому формула потребовала бы деления на ноль.
  kind: choice
  options:
    - Получится максимальная близость
    - Получится минимальная близость
    - Результат будет нейтральным
    - Результат будет зависеть только от ненулевого вектора
    - Близость не определена из-за нулевой нормы в знаменателе
