- concept: негладкая вершина области суммы модулей допускает диапазон направлений касания
  question: Для ограничения |u| + |v| ≤ ρ решение оказалось в вершине (ρ, 0). Почему небольшое изменение направления градиента функции потерь может оставить решение в этой же вершине?
  explanation: 'У вершины нет единственной касательной: ей соответствует конус опорных направлений. Поэтому разные направления градиента могут выбирать одну точку (ρ, 0), где вес v обнулён.'
  kind: choice
  options:
    - Негладкую вершину поддерживает целый диапазон направлений линий уровня
    - В вершине градиент функции потерь обязательно равен нулю
    - Все точки границы суммы модулей дают одинаковую функцию потерь
