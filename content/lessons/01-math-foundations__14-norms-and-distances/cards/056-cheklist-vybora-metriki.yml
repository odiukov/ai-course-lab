- concept: взвешенное редакционное расстояние учитывает неодинаковую значимость разных замен символов
  question: Объясните своими словами, почему для сравнения последовательностей ДНК может быть полезнее взвешенное редакционное расстояние, а не вариант с одинаковой стоимостью всех замен.
  explanation: Обычное редакционное расстояние считает все замены равноценными. Взвешенный вариант позволяет сделать близкие или частые замены дешёвыми, а редкие или существенные — дорогими.
  kind: open
  reference: Разные пары нуклеотидов могут заменяться с неодинаковой биологической вероятностью или иметь разные последствия. Взвешенное редакционное расстояние задаёт стоимость отдельно для каждой пары и поэтому лучше отражает предметный смысл изменений.
