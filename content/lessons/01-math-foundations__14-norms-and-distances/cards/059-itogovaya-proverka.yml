- concept: Elastic Net объединяет L1- и L2-регуляризацию и подходит для групп скоррелированных признаков
  question: В линейной модели много скоррелированных признаков. Нужны одновременно разреженность весов и более устойчивое поведение целых групп признаков. Какую регуляризацию выбрать?
  explanation: Elastic Net сочетает L1-компоненту, создающую разреженность, и L2-компоненту, стабилизирующую веса скоррелированных признаков.
