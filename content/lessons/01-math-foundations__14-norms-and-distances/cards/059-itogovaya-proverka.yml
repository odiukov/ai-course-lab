- concept: норма обращается в ноль только на нулевом векторе
  question: Объясни, почему функция N(x) = |x₁| не является нормой на пространстве двумерных векторов.
  explanation: Норма должна быть нулевой только для нулевого вектора. Функция |x₁| полностью игнорирует вторую координату, поэтому это условие не выполняется.
  kind: open
  reference: 'Она может равняться нулю для ненулевого вектора: например, у любого вектора с x₁ = 0 и x₂ ≠ 0 значение N(x) равно нулю. Это нарушает обязательное свойство нормы.'
  id: 059-itogovaya-proverka-3
  fingerprint: d2fcf512
