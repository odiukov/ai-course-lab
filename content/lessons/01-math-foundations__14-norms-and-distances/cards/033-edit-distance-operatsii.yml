- concept: редакционная близость отражает сходство написания, но не сходство значений
  question: Объясни своими словами, почему малое редакционное расстояние между словами не доказывает, что они близки по смыслу.
  explanation: Эта метрика сравнивает форму строк, а не их значение. Поэтому она подходит для поиска опечаток и похожих записей, но сама по себе не измеряет семантическую близость.
  kind: open
  reference: Редакционное расстояние учитывает только операции над символами. Похожие по написанию слова могут обозначать разные вещи, а синонимы могут состоять из совершенно разных последовательностей символов.
