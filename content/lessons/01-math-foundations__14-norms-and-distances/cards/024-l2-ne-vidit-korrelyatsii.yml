- concept: евклидово расстояние не учитывает корреляции между признаками
  question: Объясни своими словами, почему евклидово расстояние может переоценить отличие объекта, если несколько его признаков сильно коррелируют.
  explanation: Если признаки связаны, их совместное изменение не равно набору независимых свидетельств об отличии. Обычное евклидово расстояние не знает ковариационной структуры и может фактически придать одному фактору избыточный вес.
  kind: open
  reference: Евклидово расстояние рассматривает координаты как независимые направления. Поэтому согласованные отклонения нескольких коррелирующих признаков учитываются по отдельности, хотя могут отражать одну общую причину.
