- concept: при вложенных множествах пересечение равно меньшему множеству, а объединение — большему
  question: Все каналы из набора подписок Алисы входят в набор Бориса, но у Бориса есть дополнительные каналы. Что является пересечением и объединением этих наборов?
  explanation: Общими являются все подписки Алисы, поэтому её набор образует пересечение. Объединение включает также дополнительные подписки Бориса и совпадает с его набором.
  kind: choice
  options:
    - Пересечение — набор Алисы, объединение — набор Бориса
    - Пересечение — набор Бориса, объединение — набор Алисы
    - И пересечение, и объединение равны набору Алисы
    - И пересечение, и объединение равны набору Бориса
  correct: 0
