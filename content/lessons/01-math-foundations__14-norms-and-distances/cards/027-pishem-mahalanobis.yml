- concept: квадратичная форма расстояния Махаланобиса использует обратную ковариационную матрицу
  question: Заполни пропуск в реализации расстояния Махаланобиса.
  explanation: К вектору разности применяется обратная ковариационная матрица. Это матричное преобразование, а не поэлементное деление или замена элементов на обратные.
  kind: cloze
  template: |-
    delta = x - y
    scaled = ___ @ delta
    distance = sqrt(dot(delta, scaled))
  answer: inverse(covariance)
  accept:
    - inv(covariance)
    - np.linalg.inv(covariance)
  id: 027-pishem-mahalanobis-1
  fingerprint: a18c7499
- concept: вырожденная ковариационная матрица требует явной обработки
  question: Что должна сделать реализация расстояния Махаланобиса, если ковариационная матрица вырождена и обычной обратной матрицы не существует?
  explanation: Вырожденную матрицу нельзя обратить обычным способом. Корректная реализация должна явно сообщить о проблеме либо использовать псевдообратную матрицу, если такое поведение предусмотрено.
  kind: choice
  options:
    - Сообщить понятную ошибку или применить предусмотренную псевдообратную матрицу
    - Заменить каждый элемент ковариационной матрицы на обратный ему
    - Без предупреждения перейти к евклидову расстоянию
    - Вернуть нулевое расстояние для любой пары точек
