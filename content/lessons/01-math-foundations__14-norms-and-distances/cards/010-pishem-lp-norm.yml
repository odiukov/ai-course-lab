- concept: форма шара нормы L∞ на плоскости
  question: Как выглядит на плоскости граница шара фиксированного радиуса для нормы L∞?
  explanation: Норма L∞ определяется наибольшей по модулю координатой. Ограничение этой координаты фиксированным радиусом образует квадрат, а в пространстве большей размерности — гиперкуб.
  kind: choice
  options:
    - Квадрат со сторонами, параллельными координатным осям
    - Окружность
    - Ромб с вершинами на координатных осях
    - Эллипс с наклонёнными осями
  correct: 0
  id: 010-pishem-lp-norm-1
  fingerprint: fe44ae62
- concept: инвариантность Lp-нормы к перестановке координат
  question: Почему перестановка координат вектора не меняет его Lp-норму?
  explanation: Lp-норма зависит от набора модулей координат, а не от их позиций. Поскольку сумма не зависит от порядка слагаемых, любая перестановка координат сохраняет норму.
  kind: open
  reference: В формуле Lp-нормы складываются степени модулей всех координат. Перестановка меняет порядок слагаемых, но не их значения и не сумму, поэтому норма остаётся прежней.
  id: 010-pishem-lp-norm-2
  fingerprint: 7d2af11f
