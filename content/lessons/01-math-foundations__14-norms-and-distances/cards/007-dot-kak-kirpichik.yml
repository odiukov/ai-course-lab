- concept: евклидова длина вектора равна квадратному корню из его скалярного произведения с самим собой
  question: Известно, что x · x = 64. Чему равна евклидова длина вектора x?
  explanation: 'Скалярное произведение вектора с самим собой равно квадрату его евклидовой длины: x · x = ||x||². Поэтому ||x|| = √64 = 8.'
  kind: numeric
  answer: 8
  tolerance: 0.25
  id: 007-dot-kak-kirpichik-1
  fingerprint: dd0927ab
- concept: для векторов единичной длины скалярное произведение совпадает с косинусной близостью
  question: Заполните пропуск в формуле для двух векторов единичной длины.
  explanation: В общей формуле u · v = ||u|| ||v|| cos(θ) обе длины единичны, поэтому множители длин исчезают и остаётся cos(θ).
  kind: cloze
  template: Если ||u|| = ||v|| = единице, то u · v = ___
  answer: cos(θ)
  accept:
    - cos θ
    - cos(theta)
    - косинус угла между u и v
  id: 007-dot-kak-kirpichik-2
  fingerprint: 58765f4a
- concept: скалярное произведение подходит для ранжирования, когда длина вектора несёт полезный сигнал
  question: В поисковой системе длина вектора объекта кодирует его популярность, и популярные объекты при прочих равных должны получать более высокую оценку. Какую меру сходства логичнее использовать?
  explanation: Скалярное произведение зависит и от направления, и от длин векторов, поэтому сохраняет сигнал популярности. Косинусная близость делит результат на обе длины и устраняет этот сигнал.
  kind: choice
  options:
    - Скалярное произведение
    - Косинусную близость
    - Меру, которая сначала заменяет все координаты их знаками
