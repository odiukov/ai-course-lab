<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Одна единица пути — разные фигуры</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f9fc;
      --panel: #ffffff;
      --text: #172033;
      --muted: #667085;
      --axis: #8390a5;
      --guide: #a8b1c0;
      --p-one: #d65f28;
      --p-two: #1677b8;
      --p-three: #7b55c7;
      --p-infinity: #16856b;
      --point: #172033;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background: var(--page);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .diagram {
      background: var(--panel);
    }

    .diagram-title {
      color: var(--text);
      font-size: 20px;
      font-weight: bold;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      background: var(--panel);
      font-family: inherit;
      shape-rendering: geometricPrecision;
    }

    .axis {
      fill: none;
      stroke: var(--axis);
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tick {
      stroke: var(--axis);
      stroke-width: 1.5;
      stroke-linecap: round;
    }

    .axis-label {
      fill: var(--muted);
      font-size: 16px;
      font-weight: bold;
    }

    .guide {
      fill: none;
      stroke: var(--guide);
      stroke-width: 1.5;
      stroke-linecap: round;
    }

    .guide-label {
      fill: var(--muted);
      font-size: 14px;
    }

    .boundary {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .p-one {
      stroke: var(--p-one);
    }

    .p-two {
      stroke: var(--p-two);
    }

    .p-three {
      stroke: var(--p-three);
    }

    .p-infinity {
      stroke: var(--p-infinity);
    }

    .origin-point {
      fill: var(--point);
      stroke: var(--panel);
      stroke-width: 2;
    }

    .legend-text {
      fill: var(--text);
      font-size: 15px;
    }

    .legend-note {
      fill: var(--muted);
      font-size: 14px;
    }

    .fallback {
      fill: var(--text);
      font-size: 16px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --panel: #171f2c;
        --text: #edf2f8;
        --muted: #aeb9c9;
        --axis: #8996aa;
        --guide: #68768b;
        --p-one: #ff9b6a;
        --p-two: #63b9ee;
        --p-three: #b59af2;
        --p-infinity: #65cdb0;
        --point: #edf2f8;
      }
    }
  </style>
</head>
<body>
  <main class="diagram" aria-labelledby="diagram-heading">
    <div class="diagram-title" id="diagram-heading">
      Одна единица пути — разные фигуры
    </div>
    <svg
      id="plot"
      viewBox="0 0 760 450"
      width="760"
      height="450"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-heading"
    ></svg>
    <noscript>
      На общих осях единичные границы имеют форму ромба при p=1,
      круга при p=2, скруглённого квадрата при p=3 и квадрата при p=∞.
    </noscript>
  </main>

  <script>
    const DATA = Object.freeze({
      namespace: "http://www.w3.org/2000/svg",
      origin: Object.freeze({ x: 380, y: 190 }),
      scale: 140,
      precision: 2,
      numbers: Object.freeze({
        zero: 0,
        one: 1,
        two: 2,
        three: 3
      }),
      sampling: Object.freeze({
        count: 160
      }),
      axes: Object.freeze({
        horizontal: Object.freeze({
          start: Object.freeze({ x: -1.7, y: 0 }),
          end: Object.freeze({ x: 1.7, y: 0 }),
          arrow: Object.freeze([
            Object.freeze({ x: 1.7, y: 0 }),
            Object.freeze({ x: 1.62, y: 0.045 }),
            Object.freeze({ x: 1.62, y: -0.045 })
          ]),
          label: Object.freeze({
            text: "x₁",
            anchor: Object.freeze({ x: 1.7, y: 0 }),
            dx: 10,
            dy: 6,
            side: "start"
          })
        }),
        vertical: Object.freeze({
          start: Object.freeze({ x: 0, y: -1.16 }),
          end: Object.freeze({ x: 0, y: 1.3 }),
          arrow: Object.freeze([
            Object.freeze({ x: 0, y: 1.3 }),
            Object.freeze({ x: -0.045, y: 1.22 }),
            Object.freeze({ x: 0.045, y: 1.22 })
          ]),
          label: Object.freeze({
            text: "x₂",
            anchor: Object.freeze({ x: 0, y: 1.3 }),
            dx: 0,
            dy: -10,
            side: "middle"
          })
        }),
        ticks: Object.freeze([
          Object.freeze({
            from: Object.freeze({ x: -1, y: -0.035 }),
            to: Object.freeze({ x: -1, y: 0.035 })
          }),
          Object.freeze({
            from: Object.freeze({ x: 1, y: -0.035 }),
            to: Object.freeze({ x: 1, y: 0.035 })
          }),
          Object.freeze({
            from: Object.freeze({ x: -0.035, y: -1 }),
            to: Object.freeze({ x: 0.035, y: -1 })
          }),
          Object.freeze({
            from: Object.freeze({ x: -0.035, y: 1 }),
            to: Object.freeze({ x: 0.035, y: 1 })
          })
        ])
      }),
      guide: Object.freeze({
        start: Object.freeze({ x: -1.06, y: -1.06 }),
        end: Object.freeze({ x: 1.06, y: 1.06 }),
        dash: Object.freeze([0.055, 0.05]),
        label: Object.freeze({
          text: "диагональное направление",
          anchor: Object.freeze({ x: -1.06, y: -1.06 }),
          dx: -10,
          dy: 16,
          side: "end"
        })
      }),
      curves: Object.freeze([
        Object.freeze({
          p: "infinity",
          className: "p-infinity",
          label: "p=∞ — квадрат",
          dash: Object.freeze([0.1, 0.055]),
          points: Object.freeze([
            Object.freeze({ x: -1, y: -1 }),
            Object.freeze({ x: 1, y: -1 }),
            Object.freeze({ x: 1, y: 1 }),
            Object.freeze({ x: -1, y: 1 })
          ])
        }),
        Object.freeze({
          p: 3,
          className: "p-three",
          label: "p=3 — скруглённый квадрат",
          dash: Object.freeze([0.035, 0.035])
        }),
        Object.freeze({
          p: 2,
          className: "p-two",
          label: "p=2 — круг",
          dash: Object.freeze([])
        }),
        Object.freeze({
          p: 1,
          className: "p-one",
          label: "p=1 — ромб",
          dash: Object.freeze([])
        })
      ]),
      legend: Object.freeze([
        Object.freeze({
          curve: "p-one",
          anchor: Object.freeze({ x: -1.72, y: -1.4 }),
          lineEnd: Object.freeze({ x: -1.47, y: -1.4 }),
          text: "p=1 — ромб",
          dx: 10,
          dy: 5
        }),
        Object.freeze({
          curve: "p-two",
          anchor: Object.freeze({ x: 0.1, y: -1.4 }),
          lineEnd: Object.freeze({ x: 0.35, y: -1.4 }),
          text: "p=2 — круг",
          dx: 10,
          dy: 5
        }),
        Object.freeze({
          curve: "p-three",
          anchor: Object.freeze({ x: -1.72, y: -1.66 }),
          lineEnd: Object.freeze({ x: -1.47, y: -1.66 }),
          text: "p=3 — скруглённый квадрат",
          dx: 10,
          dy: 5
        }),
        Object.freeze({
          curve: "p-infinity",
          anchor: Object.freeze({ x: 0.1, y: -1.66 }),
          lineEnd: Object.freeze({ x: 0.35, y: -1.66 }),
          text: "p=∞ — квадрат",
          dx: 10,
          dy: 5
        })
      ]),
      originPoint: Object.freeze({
        center: Object.freeze({ x: 0, y: 0 }),
        radiusPoint: Object.freeze({ x: 0.035, y: 0 })
      }),
      fallback: Object.freeze({
        first: Object.freeze({
          text: "Не удалось построить границы единичного шара.",
          anchor: Object.freeze({ x: 0, y: 0.12 })
        }),
        second: Object.freeze({
          text: "Должны быть показаны ромб p=1, круг p=2, скруглённый квадрат p=3 и квадрат p=∞.",
          anchor: Object.freeze({ x: 0, y: -0.12 })
        })
      })
    });

    const origin = Object.freeze({
      x: DATA.origin.x,
      y: DATA.origin.y
    });
    const scale = DATA.scale;

    const sx = (x) => origin.x + x * scale;
    const sy = (y) => origin.y - y * scale;

    const svg = document.getElementById("plot");
    const ZERO = DATA.numbers.zero;
    const ONE = DATA.numbers.one;
    const TWO = DATA.numbers.two;

    function rounded(value) {
      return Number(value.toFixed(DATA.precision));
    }

    function element(name, attributes, text) {
      const node = document.createElementNS(DATA.namespace, name);
      for (const [key, value] of Object.entries(attributes)) {
        node.setAttribute(key, value);
      }
      if (text !== undefined) {
        node.textContent = text;
      }
      return node;
    }

    function pointAttributes(point) {
      return {
        x: rounded(sx(point.x)),
        y: rounded(sy(point.y))
      };
    }

    function line(from, to, className) {
      return element("line", {
        x1: rounded(sx(from.x)),
        y1: rounded(sy(from.y)),
        x2: rounded(sx(to.x)),
        y2: rounded(sy(to.y)),
        class: className
      });
    }

    function polygon(points, className) {
      const value = points
        .map((point) => `${rounded(sx(point.x))},${rounded(sy(point.y))}`)
        .join(" ");
      return element("polygon", {
        points: value,
        class: className
      });
    }

    function dashValue(values) {
      return values
        .map((value) => rounded(Math.abs(sx(value) - sx(ZERO))))
        .join(" ");
    }

    function pathFromPoints(points, closePath) {
      let first = true;
      let value = "";
      for (const point of points) {
        const command = first ? "M" : "L";
        value += `${command}${rounded(sx(point.x))} ${rounded(sy(point.y))} `;
        first = false;
      }
      if (closePath) {
        value += "Z";
      }
      return value;
    }

    function superellipsePoints(p) {
      const points = [];
      const count = DATA.sampling.count;
      const power = TWO / p;

      for (let index = ZERO; index <= count; index += ONE) {
        const angle = TWO * Math.PI * index / count;
        const cosine = Math.cos(angle);
        const sine = Math.sin(angle);
        points.push({
          x: Math.sign(cosine) * Math.pow(Math.abs(cosine), power),
          y: Math.sign(sine) * Math.pow(Math.abs(sine), power)
        });
      }
      return points;
    }

    function addText(parent, definition, className) {
      const coordinates = pointAttributes(definition.anchor);
      parent.appendChild(element("text", {
        x: coordinates.x + definition.dx,
        y: coordinates.y + definition.dy,
        "text-anchor": definition.side,
        class: className
      }, definition.text));
    }

    function renderAxes(layer) {
      const horizontal = DATA.axes.horizontal;
      const vertical = DATA.axes.vertical;

      layer.appendChild(line(horizontal.start, horizontal.end, "axis"));
      layer.appendChild(polygon(horizontal.arrow, "axis"));
      layer.appendChild(line(vertical.start, vertical.end, "axis"));
      layer.appendChild(polygon(vertical.arrow, "axis"));

      for (const tick of DATA.axes.ticks) {
        layer.appendChild(line(tick.from, tick.to, "tick"));
      }

      addText(layer, horizontal.label, "axis-label");
      addText(layer, vertical.label, "axis-label");
    }

    function renderGuide(layer) {
      const guide = line(DATA.guide.start, DATA.guide.end, "guide");
      guide.setAttribute("stroke-dasharray", dashValue(DATA.guide.dash));
      layer.appendChild(guide);
      addText(layer, DATA.guide.label, "guide-label");
    }

    function renderCurves(layer) {
      for (const curve of DATA.curves) {
        const points = curve.points || superellipsePoints(curve.p);
        const path = element("path", {
          d: pathFromPoints(points, true),
          class: `boundary ${curve.className}`
        });

        if (curve.dash.length) {
          path.setAttribute("stroke-dasharray", dashValue(curve.dash));
        }
        layer.appendChild(path);
      }
    }

    function renderOrigin(layer) {
      const center = DATA.originPoint.center;
      const radiusPoint = DATA.originPoint.radiusPoint;
      const radius = Math.abs(sx(radiusPoint.x) - sx(center.x));

      layer.appendChild(element("circle", {
        cx: rounded(sx(center.x)),
        cy: rounded(sy(center.y)),
        r: rounded(radius),
        class: "origin-point"
      }));
    }

    function renderLegend(layer) {
      for (const item of DATA.legend) {
        const swatch = line(
          item.anchor,
          item.lineEnd,
          `boundary ${item.curve}`
        );
        const curve = DATA.curves.find(
          (candidate) => candidate.className === item.curve
        );

        if (curve.dash.length) {
          swatch.setAttribute("stroke-dasharray", dashValue(curve.dash));
        }
        layer.appendChild(swatch);

        layer.appendChild(element("text", {
          x: rounded(sx(item.lineEnd.x)) + item.dx,
          y: rounded(sy(item.lineEnd.y)) + item.dy,
          "text-anchor": "start",
          class: "legend-text"
        }, item.text));
      }
    }

    function render() {
      svg.replaceChildren();

      const description = element(
        "desc",
        {},
        "На общих координатных осях показаны четыре границы единичного шара: ромб для p=1, круг для p=2, скруглённый квадрат для p=3 и квадрат для p=∞."
      );
      const guideLayer = element("g", {});
      const curveLayer = element("g", {});
      const axisLayer = element("g", {});
      const legendLayer = element("g", {});

      svg.appendChild(description);
      renderGuide(guideLayer);
      renderCurves(curveLayer);
      renderAxes(axisLayer);
      renderOrigin(axisLayer);
      renderLegend(legendLayer);

      svg.appendChild(guideLayer);
      svg.appendChild(curveLayer);
      svg.appendChild(axisLayer);
      svg.appendChild(legendLayer);
    }

    function renderFallback() {
      svg.replaceChildren();

      for (const row of [DATA.fallback.first, DATA.fallback.second]) {
        svg.appendChild(element("text", {
          x: rounded(sx(row.anchor.x)),
          y: rounded(sy(row.anchor.y)),
          "text-anchor": "middle",
          class: "fallback"
        }, row.text));
      }
    }

    try {
      render();
    } catch (error) {
      renderFallback();
    }
  </script>
</body>
</html>
