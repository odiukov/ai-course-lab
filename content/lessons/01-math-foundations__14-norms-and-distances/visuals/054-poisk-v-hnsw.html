<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Длинные прыжки сверху, точные шаги снизу</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f9fc;
    --ink: #172033;
    --muted: #526079;
    --panel-top: #eaf1ff;
    --panel-mid: #eaf8f5;
    --panel-low: #f0f8e8;
    --panel-line: #b8c5d8;
    --edge: #9ba9bd;
    --node: #ffffff;
    --node-line: #60708a;
    --route: #dc5f24;
    --route-node: #fff1e7;
    --target: #16805d;
    --target-fill: #e3f8ee;
    --label-bg: #f7f9fc;
    --error: #a12626;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #111722;
      --ink: #edf3ff;
      --muted: #aebbd0;
      --panel-top: #19263d;
      --panel-mid: #172d2d;
      --panel-low: #223020;
      --panel-line: #43516a;
      --edge: #59677c;
      --node: #182130;
      --node-line: #9cabc0;
      --route: #ff9868;
      --route-node: #43291f;
      --target: #66d6aa;
      --target-fill: #183c31;
      --label-bg: #111722;
      --error: #ff9a9a;
    }
  }

  html,
  body {
    background: var(--page);
    color: var(--ink);
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
  }

  h1 {
    font-size: 22px;
    text-align: center;
  }

  figure {
    margin-inline: auto;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 430px;
    background: var(--page);
  }

  .layer {
    stroke: var(--panel-line);
    stroke-width: 1.5;
    vector-effect: non-scaling-stroke;
  }

  .top-layer {
    fill: var(--panel-top);
  }

  .middle-layer {
    fill: var(--panel-mid);
  }

  .bottom-layer {
    fill: var(--panel-low);
  }

  .edge {
    stroke: var(--edge);
    stroke-width: 1.5;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
  }

  .node {
    fill: var(--node);
    stroke: var(--node-line);
    stroke-width: 1.5;
    vector-effect: non-scaling-stroke;
  }

  .route {
    stroke: var(--route);
    stroke-width: 4;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
  }

  .arrowhead {
    fill: var(--route);
  }

  .route-node {
    fill: var(--route-node);
    stroke: var(--route);
    stroke-width: 3;
    vector-effect: non-scaling-stroke;
  }

  .target-halo {
    fill: var(--target-fill);
    stroke: var(--target);
    stroke-width: 3;
    vector-effect: non-scaling-stroke;
  }

  .target-core {
    fill: var(--target);
    stroke: var(--target);
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
  }

  .layer-label {
    fill: var(--ink);
    font-size: 17px;
    font-weight: 700;
  }

  .hint {
    fill: var(--muted);
    font-size: 15px;
    font-weight: 600;
    paint-order: stroke;
    stroke: var(--label-bg);
    stroke-width: 6;
    stroke-linejoin: round;
  }

  .route-label {
    fill: var(--route);
    font-size: 15px;
    font-weight: 700;
    paint-order: stroke;
    stroke: var(--label-bg);
    stroke-width: 7;
    stroke-linejoin: round;
  }

  .target-label {
    fill: var(--target);
    font-size: 16px;
    font-weight: 700;
    paint-order: stroke;
    stroke: var(--label-bg);
    stroke-width: 7;
    stroke-linejoin: round;
  }

  .summary {
    fill: var(--ink);
    font-size: 17px;
    font-weight: 650;
  }

  #fallback {
    color: var(--error);
    font-size: 17px;
    text-align: center;
  }
</style>
</head>
<body>
<main>
  <h1 id="diagram-title">Длинные прыжки сверху, точные шаги снизу</h1>
  <figure aria-labelledby="diagram-title">
    <svg id="diagram"
         viewBox="0 0 1120 430"
         width="1120"
         height="430"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="diagram-title diagram-description">
      <desc id="diagram-description">
        Три слоя графа HNSW: редкий верхний, промежуточный и плотный нижний.
        Маршрут запроса сначала делает дальние переходы, затем спускается и
        уточняет результат короткими шагами до ближайшей точки.
      </desc>
      <g id="drawing"></g>
    </svg>
    <p id="fallback" hidden>
      Схема должна была показать три слоя HNSW: длинные переходы наверху,
      спуск с сохранением найденной области и короткое уточнение до ближайшей
      точки в плотном нижнем слое.
    </p>
  </figure>
</main>

<script>
const data = {
  panels: [
    { kind: "top-layer", x: 4, y: 3, x2: 108, y2: 13.5 },
    { kind: "middle-layer", x: 4, y: 15, x2: 108, y2: 25.5 },
    { kind: "bottom-layer", x: 4, y: 27, x2: 108, y2: 39 }
  ],
  nodeRadius: 0.58,
  targetRadius: 1.02,
  targetCoreRadius: 0.48,
  arrow: { size: 1.25, wing: 0.72 },
  layers: [
    {
      nodes: [
        { key: "t0", x: 12, y: 8.5 },
        { key: "t1", x: 28, y: 10 },
        { key: "t2", x: 45, y: 7.5 },
        { key: "t3", x: 61, y: 10 },
        { key: "t4", x: 80, y: 8.5 },
        { key: "t5", x: 99, y: 10 }
      ],
      edges: [
        ["t0", "t1"], ["t0", "t2"], ["t1", "t2"],
        ["t2", "t3"], ["t2", "t4"], ["t3", "t4"],
        ["t4", "t5"]
      ]
    },
    {
      nodes: [
        { key: "m0", x: 11, y: 21 },
        { key: "m1", x: 20, y: 18.5 },
        { key: "m2", x: 29, y: 22.5 },
        { key: "m3", x: 39, y: 19 },
        { key: "m4", x: 48, y: 23 },
        { key: "m5", x: 57, y: 19.5 },
        { key: "m6", x: 66, y: 22.5 },
        { key: "m7", x: 73, y: 18.5 },
        { key: "m8", x: 80, y: 20 },
        { key: "m9", x: 88, y: 22 },
        { key: "m10", x: 97, y: 19 },
        { key: "m11", x: 103, y: 23 }
      ],
      edges: [
        ["m0", "m1"], ["m0", "m2"], ["m1", "m2"],
        ["m1", "m3"], ["m2", "m3"], ["m2", "m4"],
        ["m3", "m4"], ["m3", "m5"], ["m4", "m5"],
        ["m4", "m6"], ["m5", "m6"], ["m5", "m7"],
        ["m6", "m7"], ["m6", "m8"], ["m7", "m8"],
        ["m7", "m9"], ["m8", "m9"], ["m8", "m10"],
        ["m9", "m10"], ["m9", "m11"], ["m10", "m11"]
      ]
    },
    {
      linkRadius: 7.1,
      nodes: [
        { key: "b0", x: 9, y: 31 },
        { key: "b1", x: 15, y: 29.5 },
        { key: "b2", x: 20, y: 33 },
        { key: "b3", x: 25, y: 29 },
        { key: "b4", x: 30, y: 32 },
        { key: "b5", x: 35, y: 29.5 },
        { key: "b6", x: 39, y: 34 },
        { key: "b7", x: 44, y: 30.5 },
        { key: "b8", x: 48, y: 35 },
        { key: "b9", x: 52, y: 31 },
        { key: "b10", x: 56, y: 36 },
        { key: "b11", x: 60, y: 29.5 },
        { key: "b12", x: 64, y: 33.5 },
        { key: "b13", x: 68, y: 30 },
        { key: "b14", x: 71, y: 35.5 },
        { key: "b15", x: 75, y: 32 },
        { key: "b16", x: 78, y: 37 },
        { key: "b17", x: 81, y: 29.5 },
        { key: "b18", x: 84, y: 35.5 },
        { key: "b19", x: 88, y: 33 },
        { key: "b20", x: 90, y: 37 },
        { key: "b21", x: 93, y: 35 },
        { key: "b22", x: 94, y: 30 },
        { key: "target", x: 99, y: 34 },
        { key: "b24", x: 102, y: 29 },
        { key: "b25", x: 104, y: 37 }
      ]
    }
  ],
  entry: { x: 6.5, y: 8.5 },
  route: [
    [{ x: 6.5, y: 8.5 }, { x: 12, y: 8.5 }],
    [{ x: 12, y: 8.5 }, { x: 45, y: 7.5 }],
    [{ x: 45, y: 7.5 }, { x: 80, y: 8.5 }],
    [{ x: 80, y: 8.5 }, { x: 80, y: 20 }],
    [{ x: 80, y: 20 }, { x: 88, y: 22 }],
    [{ x: 88, y: 22 }, { x: 88, y: 33 }],
    [{ x: 88, y: 33 }, { x: 93, y: 35 }],
    [{ x: 93, y: 35 }, { x: 99, y: 34 }]
  ],
  routeKeys: ["t0", "t2", "t4", "m8", "m9", "b19", "b21"],
  labels: [
    {
      text: "Верхний слой · редкий",
      x: 6, y: 5.2, dx: 0, dy: 0,
      anchor: "start", kind: "layer-label"
    },
    {
      text: "скорость",
      x: 105.5, y: 5.2, dx: 0, dy: 0,
      anchor: "end", kind: "hint"
    },
    {
      text: "длинные переходы",
      x: 47, y: 5.2, dx: 0, dy: 0,
      anchor: "middle", kind: "route-label"
    },
    {
      text: "запрос",
      x: 6.5, y: 8.5, dx: -10, dy: -12,
      anchor: "end", kind: "route-label"
    },
    {
      text: "спускаемся, сохраняя область",
      x: 81, y: 14.2, dx: 9, dy: -2,
      anchor: "start", kind: "route-label"
    },
    {
      text: "Промежуточный слой",
      x: 6, y: 17.2, dx: 0, dy: 0,
      anchor: "start", kind: "layer-label"
    },
    {
      text: "переходы короче",
      x: 51, y: 17.2, dx: 0, dy: 0,
      anchor: "middle", kind: "hint"
    },
    {
      text: "снова спускаемся",
      x: 87, y: 26.3, dx: -9, dy: -2,
      anchor: "end", kind: "route-label"
    },
    {
      text: "Нижний слой · плотный",
      x: 6, y: 29.2, dx: 0, dy: 0,
      anchor: "start", kind: "layer-label"
    },
    {
      text: "точность",
      x: 105.5, y: 29.2, dx: 0, dy: 0,
      anchor: "end", kind: "hint"
    },
    {
      text: "короткое уточнение",
      x: 60, y: 29.2, dx: 0, dy: 0,
      anchor: "middle", kind: "hint"
    },
    {
      text: "ближайшая точка",
      x: 99, y: 34, dx: 0, dy: 29,
      anchor: "middle", kind: "target-label"
    },
    {
      text: "Сверху — дальние прыжки · снизу — локальные шаги",
      x: 56, y: 41.3, dx: 0, dy: 0,
      anchor: "middle", kind: "summary"
    }
  ]
};

const origin = { x: 0, y: 0 };
const scale = { x: 10, y: 10 };

const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const svg = document.getElementById("diagram");
  const root = document.getElementById("drawing");
  const namespace = "http://www.w3.org/2000/svg";

  const make = (name, attributes, className) => {
    const element = document.createElementNS(namespace, name);
    Object.entries(attributes).forEach(([key, value]) => {
      element.setAttribute(key, value);
    });
    if (className) element.setAttribute("class", className);
    return element;
  };

  const line = (a, b, className) => make("line", {
    x1: sx(a.x),
    y1: sy(a.y),
    x2: sx(b.x),
    y2: sy(b.y)
  }, className);

  const circle = (point, radius, className) => make("circle", {
    cx: sx(point.x),
    cy: sy(point.y),
    r: sx(radius) - sx(origin.x)
  }, className);

  const nodeMaps = data.layers.map(layer =>
    new Map(layer.nodes.map(node => [node.key, node]))
  );

  data.panels.forEach(panel => {
    root.appendChild(make("rect", {
      x: sx(panel.x),
      y: sy(panel.y),
      width: sx(panel.x2) - sx(panel.x),
      height: sy(panel.y2) - sy(panel.y)
    }, `layer ${panel.kind}`));
  });

  data.layers.forEach((layer, layerIndex) => {
    const edgeGroup = make("g", {}, "edges");
    const nodeMap = nodeMaps[layerIndex];

    if (layer.edges) {
      layer.edges.forEach(([from, to]) => {
        edgeGroup.appendChild(line(nodeMap.get(from), nodeMap.get(to), "edge"));
      });
    } else {
      layer.nodes.forEach((from, fromIndex) => {
        layer.nodes.forEach((to, toIndex) => {
          if (toIndex <= fromIndex) return;
          const distance = Math.hypot(to.x - from.x, to.y - from.y);
          if (distance <= layer.linkRadius) {
            edgeGroup.appendChild(line(from, to, "edge"));
          }
        });
      });
    }

    root.appendChild(edgeGroup);
  });

  const nodeGroup = make("g", {}, "nodes");
  data.layers.forEach(layer => {
    layer.nodes.forEach(node => {
      if (node.key !== "target") {
        const kind = data.routeKeys.includes(node.key) ? "route-node" : "node";
        nodeGroup.appendChild(circle(node, data.nodeRadius, kind));
      }
    });
  });
  root.appendChild(nodeGroup);

  const routeGroup = make("g", {}, "search-route");
  data.route.forEach(([from, to]) => {
    routeGroup.appendChild(line(from, to, "route"));

    const length = Math.hypot(to.x - from.x, to.y - from.y);
    const ux = (to.x - from.x) / length;
    const uy = (to.y - from.y) / length;
    const base = {
      x: to.x - ux * data.arrow.size,
      y: to.y - uy * data.arrow.size
    };
    const left = {
      x: base.x - uy * data.arrow.wing,
      y: base.y + ux * data.arrow.wing
    };
    const right = {
      x: base.x + uy * data.arrow.wing,
      y: base.y - ux * data.arrow.wing
    };

    const points = [to, left, right]
      .map(point => `${sx(point.x)},${sy(point.y)}`)
      .join(" ");

    routeGroup.appendChild(make("polygon", { points }, "arrowhead"));
  });
  root.appendChild(routeGroup);

  const target = nodeMaps
    .map(nodeMap => nodeMap.get("target"))
    .find(Boolean);

  root.appendChild(circle(target, data.targetRadius, "target-halo"));
  root.appendChild(circle(target, data.targetCoreRadius, "target-core"));

  const labelGroup = make("g", {}, "labels");
  data.labels.forEach(label => {
    const text = make("text", {
      x: sx(label.x),
      y: sy(label.y),
      dx: label.dx,
      dy: label.dy,
      "text-anchor": label.anchor
    }, label.kind);
    text.textContent = label.text;
    labelGroup.appendChild(text);
  });
  root.appendChild(labelGroup);
} catch (error) {
  document.getElementById("diagram").hidden = true;
  document.getElementById("fallback").hidden = false;
}
</script>
</body>
</html>
