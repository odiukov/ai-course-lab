- concept: порог IoU в NMS задаёт компромисс между подавлением дублей и сохранением соседних объектов
  question: Объясни своими словами, к каким ошибкам приводят слишком низкий и слишком высокий пороги IoU в NMS.
  explanation: Порог определяет, какое перекрытие достаточно велико, чтобы считать кандидата дублем. Его снижение делает подавление агрессивнее, а повышение — мягче.
  kind: open
  reference: При слишком низком пороге NMS может подавить рамки соседних объектов даже при умеренном перекрытии. При слишком высоком пороге оно подавляет только почти совпадающие рамки, поэтому вокруг одного объекта остаются дубли.
  id: 011-nms-rpn-2
  fingerprint: 577acf69
