- concept: размеры пересечения неперекрывающихся рамок ограничивают снизу нулём
  question: Почему перед вычислением площади пересечения рамок его ширину и высоту ограничивают снизу нулём?
  explanation: Отрицательный размер означает отсутствие пересечения, поэтому соответствующая площадь должна быть нулевой. Ограничение предотвращает появление некорректного положительного IoU.
