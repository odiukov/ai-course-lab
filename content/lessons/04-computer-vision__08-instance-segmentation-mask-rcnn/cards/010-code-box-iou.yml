- concept: NMS использует IoU и оценки объектности для удаления дублирующих предложений
  question: Как NMS с помощью оценок объектности и IoU превращает несколько предложений вокруг одного объекта в одно основное предложение?
  explanation: Оценка определяет, какое предложение сохранить первым, а IoU выявляет остальные рамки, вероятно описывающие тот же объект.
  kind: open
  reference: NMS сначала рассматривает предложения в порядке убывания оценки объектности, принимает наиболее уверенное и подавляет предложения, которые слишком сильно перекрываются с уже принятым по IoU.
