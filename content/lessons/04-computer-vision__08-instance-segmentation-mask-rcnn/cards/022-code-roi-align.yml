- concept: порядок координат в последней оси сетки для grid_sample
  question: '`torch.meshgrid(grid_y, grid_x, indexing="ij")` вернул тензоры `yy` и `xx`, из которых получены нормированные координаты `gy` и `gx`. Как их нужно объединить для передачи в `F.grid_sample`?'
  explanation: '`meshgrid` с аргументами `grid_y, grid_x` возвращает сначала вертикальные, затем горизонтальные координаты. Однако последняя ось сетки `grid_sample` должна хранить их в порядке `x, y`, поэтому складывают `[gx, gy]`.'
  kind: choice
  options:
    - '`torch.stack([gy, gx], dim=-1)`, потому что `meshgrid` получил вертикальные координаты первыми'
    - Порядок не имеет значения, если обе координаты нормированы
    - '`torch.stack([gx, gy], dim=-1)`, потому что `grid_sample` ожидает горизонтальную координату перед вертикальной'
  correct: 2
  id: 022-code-roi-align-1
  fingerprint: e4a8bd12
- concept: полупиксельное согласование координат RoI с align_corners=False
  question: Объясните, зачем после применения `spatial_scale` границы RoI сдвигают на половину клетки карты признаков при использовании `F.grid_sample` с `align_corners=False`.
  explanation: При `align_corners=False` центры элементов карты согласуются с целочисленными индексами, а внешние границы лежат между ними. Полупиксельный сдвиг устраняет различие соглашений и сохраняет точное пространственное выравнивание RoI.
  kind: open
  reference: Сдвиг переводит координаты границ из соглашения, где целые значения описывают границы клеток, в систему координат, где целое значение соответствует центру клетки. Без него все точки выборки окажутся систематически смещены на половину клетки карты признаков.
  id: 022-code-roi-align-2
  fingerprint: 53f289b7
