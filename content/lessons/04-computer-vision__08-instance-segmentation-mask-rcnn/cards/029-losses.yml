- concept: различие между регрессией рамок в RPN и финальным уточнением рамок в box head
  question: Какое слагаемое loss непосредственно обучает box head уточнять координаты рамки-предложения?
  explanation: L_box_reg штрафует box head за неточное финальное уточнение рамки-предложения. L_rpn_box относится к более ранней регрессии рамок кандидатов в RPN, а L_mask обучает попиксельное предсказание маски.
  kind: choice
  options:
    - L_rpn_cls
    - L_rpn_box
    - L_box_cls
    - L_box_reg
    - L_mask
  correct: 3
  id: 029-losses-1
  fingerprint: 9a35335e
- concept: диагностика подсистем Mask R-CNN по динамике отдельных слагаемых loss
  question: Во время обучения общий loss снижается и L_mask уверенно уменьшается, но L_box_reg остаётся почти неизменным, а предсказанные рамки неточны. Какой вывод наиболее обоснован?
  explanation: Уменьшение суммы потерь может быть обеспечено только частью слагаемых. Падающий L_mask показывает обучение масочной головы, тогда как застывший L_box_reg вместе с неточными рамками указывает на проблему их финального уточнения.
  kind: choice
  options:
    - Нужно прежде всего менять mask head, потому что он отвечает за геометрию рамок
    - Масочная голова обучается, а проблему следует искать в финальном уточнении рамок
    - RPN перестала отличать объекты от фона, что однозначно следует из поведения L_box_reg
    - Все части модели улучшаются, поскольку общий loss уменьшается
  correct: 1
  id: 029-losses-2
  fingerprint: 9b7187ac
