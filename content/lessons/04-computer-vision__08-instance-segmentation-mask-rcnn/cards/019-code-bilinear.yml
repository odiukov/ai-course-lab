- concept: ограничение индексов соседей на границе карты признаков
  question: При билинейной выборке точка лежит на правой или нижней границе карты признаков. Как безопасно получить соседние индексы?
  explanation: 'Индекс соседа ограничивают размером карты, чтобы обращение к тензору оставалось допустимым. Округлять саму точку нельзя: это уничтожило бы плавность билинейной выборки.'
  kind: choice
  options:
    - Разрешить индексам выйти за границу и положиться на автоматическое округление
    - Ограничить индекс правого и нижнего соседа последним допустимым столбцом или строкой
    - Округлить дробные координаты точки к центру ближайшей клетки
    - Отбросить всю точку как недопустимую
  correct: 1
