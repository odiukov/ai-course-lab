- concept: сохранение канального измерения при билинейной выборке
  question: Почему билинейная выборка из карты формы `(C, H, W)` в одной пространственной точке возвращает вектор формы `(C,)`, а не скаляр?
  explanation: Выборка смешивает соседние значения отдельно для каждого канала. В результате каждой пространственной точке соответствует вектор признаков, содержащий по одному интерполированному значению на канал.
  kind: open
  reference: Пространственные координаты одинаковы для всех каналов, но значения каналов различаются. Интерполяция выполняется независимо в каждом канале, поэтому пространственные измерения исчезают, а канальное измерение сохраняется.
  id: 019-code-bilinear-3
  fingerprint: da79a4fc
