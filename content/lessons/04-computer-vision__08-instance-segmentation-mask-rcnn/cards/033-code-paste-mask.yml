- concept: низкое разрешение предсказания ограничивает точность границ маски
  question: Почему контуры масок Mask R-CNN обычно выглядят мягче, чем контуры модели, предсказывающей сегментацию сразу в полном разрешении?
  explanation: Масштабирование увеличивает размер маски, но не добавляет новых пространственных деталей. Поэтому грубый низкоразмерный контур превращается в сглаженную границу.
  kind: open
  reference: Mask R-CNN сначала предсказывает маску на небольшой сетке, а затем растягивает её до размеров объекта. Интерполяция сглаживает переходы, но не может восстановить мелкие детали границы, отсутствующие в низком разрешении.
  id: 033-code-paste-mask-2
