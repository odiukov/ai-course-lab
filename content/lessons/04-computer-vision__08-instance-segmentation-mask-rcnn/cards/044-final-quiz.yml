- concept: строгий порог Mask IoU лучше выявляет улучшение тонких границ
  question: Объясни своими словами, почему увеличение разрешения mask head может повысить Mask AP при строгом пороге IoU на изображениях с тонкими структурами, но почти не повлиять на результат для крупных компактных объектов.
  explanation: Переход от 28×28 к 56×56 даёт больше точек для описания контура. Это полезно для пальцев, спиц или листьев, но редко меняет IoU круглых и компактных объектов настолько, чтобы увеличить AP.
  kind: open
  reference: Высокое разрешение точнее описывает узкие детали и сложные контуры, поэтому небольшое улучшение границы помогает пройти строгий порог IoU. Для крупных гладких объектов исходная сетка уже достаточно хорошо передаёт форму, и дополнительное разрешение почти не меняет пересечение и объединение масок.
