- concept: экземпляры одного класса сохраняются в обучающей цели как отдельные записи
  question: На изображении размечено несколько объектов одного класса. Должны ли их значения в `labels` быть различными и как модель отличает эти экземпляры при обучении?
  explanation: Метка отвечает только за категорию объекта, поэтому у экземпляров одного класса она совпадает. Их индивидуальность задают отдельные рамки и маски, согласованные с метками по позиции.
  kind: open
  reference: 'Значения класса могут повторяться. Экземпляры различаются отдельными согласованными записями в `boxes` и `masks`: каждой позиции в `labels` соответствует собственная рамка и собственная бинарная маска.'
