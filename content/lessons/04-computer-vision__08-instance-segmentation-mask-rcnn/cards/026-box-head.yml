- concept: box head совместно классифицирует RoI и предсказывает поправки его рамки
  question: Какие результаты box head вычисляет для одного RoI в Mask R-CNN?
  explanation: 'Box head решает связанные задачи классификации и регрессии рамки: определяет класс кандидата либо фон и уточняет его координаты. Маску предсказывает отдельная mask head.'
  kind: choice
  options:
    - Оценки классов, включая фон, и поправки координат рамки
    - Только вероятность наличия любого объекта
    - Бинарную маску объекта и уровень пирамиды признаков
    - Новую карту признаков всего изображения
  correct: 0
  id: 026-box-head-1
  fingerprint: 25209c1c
- concept: поправки box head применяются к рамке-предложению, а не к исходному якорю
  question: Заполни пропуск в условной записи декодирования рамки после box head.
  explanation: RPN уже преобразовала якорь в рамку-предложение. Box head предсказывает следующую порцию смещений, поэтому декодировать их нужно относительно текущей рамки кандидата.
