  question: Модель нашла 27 объектов на изображении размером 256×384 пикселя. Полноразмерные маски хранятся в `float16`. Сколько примерно MiB занимает тензор масок с одиночным канальным измерением?
  explanation: 'Нужно сохранить 27 × 256 × 384 значений по два байта: это 5 308 416 байт, или примерно 5.06 MiB. Одиночное канальное измерение не добавляет дополнительного множителя.'
