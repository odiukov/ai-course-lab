- concept: после RoI Align признаки одного кандидата параллельно поступают в независимые головы рамки и маски
  question: Какая схема правильно описывает обработку кандидата после RoI Align в Mask R-CNN?
  explanation: RoI Align подготавливает общие признаки кандидата, после чего вычислительный граф разветвляется. Box head предсказывает класс и уточнение рамки, а mask head сохраняет пространственную структуру и определяет принадлежность позиций объекту. Выход одной головы не служит входом для другой.
  kind: choice
  options:
    - Голова рамки определяет класс и координаты, а затем передаёт свой результат голове маски
    - Голова маски строит силуэт, из которого затем голова рамки вычисляет класс и координаты
    - Одни и те же признаки RoI поступают параллельно голове рамки и голове маски, которые формируют предсказания независимо
    - RoI случайно направляется либо в голову рамки, либо в голову маски
  correct: 2
  id: 025-two-heads-1
  fingerprint: f7eee9b5
- concept: разделение голов позволяет каждой задаче использовать подходящее представление признаков
  question: Объясни своими словами, почему в Mask R-CNN классификацию с уточнением рамки и построение маски выполняют специализированные головы, а не один последовательный блок.
  explanation: Box head отвечает на вопросы о классе объекта и границах его рамки, а mask head решает пространственную задачу для позиций внутри области. Параллельная специализация уменьшает конфликт требований и не передаёт ошибки промежуточного решения одной головы в другую.
  kind: open
  reference: Для классификации и уточнения рамки нужны обобщённые признаки объекта, тогда как маске необходимы пространственные детали внутри RoI. Независимые головы могут оптимизироваться под разные задачи, а маска не становится зависимой от промежуточного решения головы рамки.
  id: 025-two-heads-2
  fingerprint: 90f6f531
