- concept: тип результата Mask R-CNN в torchvision определяется режимом модели
  question: Mask R-CNN из torchvision вызвали с изображениями и размеченными целями, после чего получили словарь тензоров потерь вместо масок. Как это следует интерпретировать?
  explanation: В режиме train модель принимает изображения и targets и возвращает словарь потерь. В режиме eval результатом становятся предсказания для каждого изображения. Текущий режим отражён во флаге model.training.
  kind: choice
  options:
    - Модель находится в режиме обучения и вернула величины ошибок для оптимизации
    - Модель не обнаружила ни одного объекта
    - Маски автоматически заменяются потерями при низкой уверенности
    - Словарь потерь означает несовместимый формат изображений
  correct: 0
  id: 042-train-mode-contract-1
  fingerprint: b444b870
- concept: порядок обновления параметров по словарю потерь
  question: Расположите действия одного шага обучения Mask R-CNN в правильном порядке.
  explanation: 'Градиенты вычисляют по суммарной тензорной потере, затем оптимизатор обновляет параметры. item() используют для логирования после вычислений: он возвращает обычное число, не связанное с графом градиентов.'
  kind: order
  items:
    - Получить от модели словарь тензоров потерь и сложить его значения
    - Обнулить накопленные градиенты оптимизатора
    - Вызвать backward() для общей потери
    - Вызвать optimizer.step() для обновления параметров
    - Преобразовать отдельные потери через item() для журнала
  id: 042-train-mode-contract-2
  fingerprint: ace44026
- concept: преждевременный вызов item() разрывает участие потери в автоматическом дифференцировании
  question: Объясните своими словами, почему нельзя преобразовать все компоненты потерь через item() перед их суммированием и вызовом backward().
  explanation: Оптимизатору нужны градиенты, а они строятся по вычислительному графу тензорной общей потери. Обычные числа после item() подходят для отображения и журналирования, но не для обратного распространения.
  kind: open
  reference: item() извлекает из тензора обычное числовое значение, которое не хранит связь с вычислительным графом. Если сначала преобразовать потери в числа, backward() не сможет провести градиенты к параметрам модели. Для обучения складывают исходные тензоры, а item() применяют только к значениям для журнала.
  id: 042-train-mode-contract-3
  fingerprint: 49d82b72
