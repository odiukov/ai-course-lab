- concept: семантическая сегментация не различает отдельные экземпляры одного класса
  question: Модель правильно выделила все клетки на микроскопическом снимке, но соприкасающиеся клетки образовали одну общую область. Какой результат получила модель?
  explanation: Семантическая сегментация назначает пикселям класс, но не обязана разделять соседние объекты этого класса. Поэтому соприкасающиеся клетки могут слиться в одну маску.
  kind: choice
  options:
    - Семантическую сегментацию класса «клетка»
    - Instance-сегментацию отдельных клеток
    - Детекцию каждой клетки рамкой
  correct: 0
  id: 001-zadacha-instance-1
  fingerprint: 23f25449
- concept: Mask R-CNN решает instance-сегментацию как детекцию объекта с последующим предсказанием его маски
  question: Объясните своими словами, как схема «детекция плюс маска» позволяет Mask R-CNN разделять соприкасающиеся объекты одного класса.
  explanation: Маска в Mask R-CNN привязана к конкретному найденному кандидату, а не ко всему классу сразу. Благодаря этому одинаковые и даже соприкасающиеся объекты сохраняются как отдельные экземпляры.
  kind: open
  reference: Сначала модель находит отдельные объекты и задаёт для каждого собственную рамку-кандидат. Затем для каждого кандидата независимо предсказывается маска, поэтому объекты одного класса получают разные маски.
  id: 001-zadacha-instance-2
  fingerprint: b93190f2
