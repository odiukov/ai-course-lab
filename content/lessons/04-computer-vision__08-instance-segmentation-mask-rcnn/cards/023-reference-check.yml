- concept: масштаб максимального абсолютного расхождения отличает погрешность вычислений от ошибки алгоритма
  question: Две реализации RoIAlign получили одинаковые входы и настройки. Объясните, как по максимальной абсолютной разнице их результатов отличить обычную погрешность вычислений от ошибки в алгоритме.
  explanation: Мелкие расхождения возникают из-за порядка и округления арифметических операций. Заметная разница при одинаковых условиях означает, что реализации вычисляют разные точки или значения, даже если формы выходных тензоров совпадают.
  kind: open
  reference: Если расхождение находится на уровне ожидаемого округления чисел с плавающей точкой, реализации практически совпадают. Если оно на несколько порядков больше, следует искать систематическую ошибку, например неверное преобразование координат или смещение точек выборки.
