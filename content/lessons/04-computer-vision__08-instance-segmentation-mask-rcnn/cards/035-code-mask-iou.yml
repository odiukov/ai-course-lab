- concept: вычисление Mask IoU не должно изменять переданные массивы
  question: Почему реализация mask_iou обычно не должна пороговать входные массивы на месте?
  explanation: Сравнение массива с порогом может создать отдельную булеву маску без изменения исходных данных. Это сохраняет вероятности модели и делает функцию предсказуемой при повторных вызовах.
  kind: open
  reference: Входные маски могут повторно использоваться вызывающим кодом, например для визуализации или расчёта других метрик. Изменение массива внутри mask_iou уничтожит исходные вероятности и создаст скрытый побочный эффект, поэтому булевы маски следует получать как новые результаты сравнений.
