- concept: локальная маска преобразуется в полноразмерную с помощью уточнённой рамки
  question: Объясни своими словами, как из локальной вероятностной маски кандидата получить маску размера исходного изображения и какую роль при этом играет уточнённая рамка.
  explanation: 'Выход mask head задан в локальных координатах кандидата. Поэтому его нельзя растягивать на весь кадр: маску увеличивают только до размера итоговой рамки и вставляют в соответствующую область полноразмерного нулевого тензора.'
  kind: open
  reference: Локальную маску интерполируют до ширины и высоты уточнённой рамки, а затем помещают по координатам этой рамки на нулевой холст размера изображения. Локальная маска задаёт форму экземпляра, а рамка — её масштаб и положение; вне рамки значения остаются нулевыми.
  id: 032-paste-mask-theory-1
  fingerprint: fc2a0160
- concept: часть маски за границей изображения обрезается без изменения масштаба видимой части
  question: Уточнённая рамка экземпляра частично выходит за правую границу изображения. Что нужно сделать при переносе локальной маски на полноразмерный холст?
  explanation: Маску сначала связывают с геометрией уточнённой рамки. Если рамка пересекает границу кадра, берут только пересечение с изображением; видимую часть не сжимают и не сдвигают.
  kind: choice
  options:
    - Сжать всю маску так, чтобы она поместилась в видимую часть рамки
    - Сдвинуть рамку влево вместе с маской
    - Обрезать часть маски за границей кадра, сохранив положение и масштаб оставшейся части
    - Полностью отбросить предсказание экземпляра
  correct: 2
  id: 032-paste-mask-theory-2
