- concept: билинейная интерполяция является выпуклой комбинацией соседних значений
  question: Почему результат билинейной интерполяции внутри клетки не может оказаться меньше всех соседних значений или больше их?
  explanation: Билинейная интерполяция вычисляет взвешенную сумму соседей. Веса неотрицательны и в сумме дают единицу, поэтому результат является их выпуклой комбинацией и остаётся между минимальным и максимальным значениями.
  kind: choice
  options:
    - Каждый сосед умножается на неотрицательный вес, а сумма всех весов равна единице
    - Алгоритм после интерполяции обрезает результат по минимуму и максимуму
    - Для вычисления всегда выбирается значение ближайшего соседа
    - Все соседние значения предварительно заменяются их средним
