- concept: восстановление углов рамки по её центру и полуразмерам
  question: Рамка задана центром `(cx, cy)`, полушириной `p` и полувысотой `q`. Как правильно получить координаты её углов?
  explanation: Левая и верхняя границы находятся вычитанием соответствующего полуразмера из центра, а правая и нижняя — прибавлением. Перестановка ширины и высоты искажает рамку.
  kind: choice
  options:
    - '`(cx - p, cy - q, cx + p, cy + q)`'
    - '`(cx + p, cy + q, cx - p, cy - q)`'
    - '`(cx - q, cy - p, cx + q, cy + p)`'
  correct: 0
  id: 008-code-decode-delta-1
  fingerprint: 9e815f64
- concept: нулевые поправки являются тождественным преобразованием якорной рамки
  question: Объясни своими словами, почему декодирование нулевых смещений должно возвращать исходную якорную рамку.
  explanation: Это базовый инвариант декодирования. Если он нарушен, причина обычно в неверном вычислении центра или размера, перепутанном порядке координат либо неправильной сборке результата.
  kind: open
  reference: Нулевые поправки не сдвигают центр, а множители изменения ширины и высоты становятся единичными. Поэтому центр и размеры остаются прежними, и восстановленные углы совпадают с углами якоря.
  id: 008-code-decode-delta-2
  fingerprint: '15920206'
