- concept: смещение центра RPN задаётся относительно размера якоря
  question: Центр якоря по горизонтали находится в координате 140 пикселей, его ширина равна 80 пикселям, а RPN предсказал t_x = -0,25. Какой будет горизонтальная координата центра уточнённой рамки?
  explanation: 'Горизонтальный сдвиг равен t_x w_a: −0,25 · 80 = −20 пикселей. Поэтому новый центр находится в координате 140 − 20 = 120 пикселей.'
  kind: numeric
  answer: 120
  tolerance: 0.01
  id: 007-box-delta-1
  fingerprint: 94112fac
- concept: экспоненциальная параметризация задаёт положительное мультипликативное изменение размера рамки
  question: Какую роль играет экспонента в формуле w = w_a e^{t_w} при уточнении якоря?
  explanation: Значение экспоненты всегда положительно, поэтому уточнённая ширина не может стать отрицательной. Параметр t_w управляет не прибавкой в пикселях, а отношением новой ширины к ширине якоря.
  kind: choice
  options:
    - Преобразует смещение ширины в фиксированную поправку в пикселях
    - Задаёт положительный множитель, которым масштабируется ширина якоря
    - Позволяет ширине принимать отрицательные значения при сильном сжатии
    - Преобразует ширину рамки в оценку объектности
  correct: 1
