- concept: при смене набора классов согласованно заменяются предсказатели рамок и масок
  question: Предобученную torchvision Mask R-CNN адаптируют к новому набору категорий объектов. Какие компоненты необходимо заменить, чтобы классификация и маски использовали одну новую систему классов?
  explanation: Box predictor выдаёт классы и поправки рамок, а mask predictor — классовые каналы масок. Если заменить лишь одну голову, их выходы будут относиться к разным наборам категорий. Поэтому обе головы создают заново с одинаковым num_classes.
  kind: choice
  options:
    - Только box_predictor
    - Только mask_predictor
    - box_predictor и mask_predictor с одинаковым num_classes
    - Backbone и FPN, оставив оба предсказателя прежними
  correct: 2
  id: 039-head-swap-1
  fingerprint: d0330a43
- concept: входные размерности новых голов берутся из заменяемых слоёв для сохранения совместимости с RoI-признаками
  question: Почему при замене голов Mask R-CNN их входные размерности обычно считывают из существующих box_predictor и mask_predictor, а не задают произвольными константами?
  explanation: Замена касается выходов, зависящих от нового числа классов, но интерфейс со входными RoI-признаками должен сохраниться. Неверная входная размерность приведёт к несовместимости тензоров при прямом проходе.
  kind: open
  reference: Новые головы должны принимать признаки той же формы, которые уже формируют RoI-ветви модели. Считывание in_features и in_channels из прежних предсказателей сохраняет совместимость тензорных размерностей и не привязывает код к вручную угаданной конфигурации архитектуры.
  id: 039-head-swap-2
  fingerprint: '98810375'
