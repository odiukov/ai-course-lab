- concept: усреднение AP по порогам IoU учитывает точность локализации
  question: Две модели одинаково обнаруживают объекты при мягком требовании к перекрытию, но одна из них точнее совмещает рамки и контуры с разметкой. Какая метрика лучше выявит это различие?
  explanation: COCO AP усредняет качество по порогам IoU от 0,50 до 0,95. Строгие пороги снижают оценку за неточные рамки и контуры, которые могли бы пройти проверку только при IoU 0,50.
  kind: choice
  options:
    - AP, рассчитанный только при мягком пороге IoU
    - AP, усреднённый по диапазону порогов IoU
    - Среднее число предсказаний на изображение
  correct: 1
  id: 043-evaluation-diagnostics-1
  fingerprint: 803157c9
- concept: Mask AP зависит не только от качества mask head, но и от успешности детекции
  question: Почему даже очень точный mask head не может компенсировать объекты, пропущенные детектором Mask R-CNN?
  explanation: 'Маска предсказывается после обнаружения объекта и для конкретного RoI. Поэтому ошибки детекции распространяются на Mask AP: маска не может быть оценена как верная, если экземпляр вообще не найден.'
  kind: open
  reference: Mask head строит маску только для найденного кандидата. Если детектор не создал правильное обнаружение объекта, соответствующей маски в предсказаниях не будет, поэтому пропуск ухудшит Mask AP независимо от точности сегментации других объектов.
  id: 043-evaluation-diagnostics-2
  fingerprint: 75949bec
