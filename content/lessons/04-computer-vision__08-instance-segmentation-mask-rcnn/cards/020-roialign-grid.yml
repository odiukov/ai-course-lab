- concept: координаты точек выборки RoI Align получаются как центры равных бинов дробной ROI
  question: Расположи операции вычисления точек выборки RoI Align в правильном порядке.
  explanation: RoI Align сохраняет дробные границы, делит область на равные бины и вычисляет центр каждого бина. Полученные координаты не округляются.
  kind: order
  items:
    - Перевести границы ROI в систему координат карты признаков, сохранив дробную часть
    - Вычислить ширину и высоту ROI
    - Разделить ширину и высоту на число столбцов и строк выходной сетки
    - Разместить точку выборки в центре каждого полученного бина
  id: 020-roialign-grid-1
  fingerprint: ca796bdd
- concept: перенос ROI без изменения размера одинаково сдвигает все точки выборки
  question: Дробную ROI на карте признаков сдвинули вправо на величину Δx, не меняя её ширину и число столбцов выходной сетки. Что произойдёт с горизонтальными координатами точек выборки?
  explanation: Ширина бинов при таком переносе не меняется, а их левая граница сдвигается на Δx. Поэтому центр каждого бина и соответствующая точка выборки сдвигаются на ту же величину.
  kind: choice
  options:
    - Каждая координата увеличится на Δx
    - Изменятся только координаты точек крайнего правого столбца
    - Координаты останутся прежними, изменятся только снятые значения признаков
    - Все точки переместятся к ближайшим целым координатам
  correct: 0
  id: 020-roialign-grid-2
  fingerprint: 6fa55cde
