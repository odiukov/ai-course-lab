- concept: форма матрицы попарных IoU определяется количеством кандидатов и сравниваемых рамок
  question: RPN выдал 11 рамок-кандидатов, которые сравнивают с 13 эталонными рамками. Какую форму имеет матрица IoU, если строки соответствуют кандидатам?
  explanation: Для каждой пары «кандидат — эталонная рамка» вычисляется отдельный IoU. Поэтому 11 кандидатов образуют строки, 13 эталонных рамок — столбцы, а форма матрицы равна 11 × 13.
  kind: choice
  options:
    - 11 × 13
    - 13 × 11
    - 11 × 11
    - 13 × 13
  correct: 0
  id: 009-pairwise-iou-1
  fingerprint: bba60bd2
- concept: элемент матрицы IoU хранит перекрытие конкретного кандидата с конкретной рамкой
  question: Заполни пропуск в определении элемента матрицы попарных IoU.
  explanation: Индекс i выбирает рамку-кандидата, а индекс j — рамку, с которой её сравнивают. Значение I[i, j] равно площади пересечения этой пары, делённой на площадь её объединения.
  kind: cloze
  template: I[i, j] = IoU(___)
  answer: candidate_i, box_j
  accept:
    - кандидат_i, рамка_j
    - proposal_i, box_j
    - candidate i, box j
  id: 009-pairwise-iou-2
  fingerprint: 00e6b8a0
