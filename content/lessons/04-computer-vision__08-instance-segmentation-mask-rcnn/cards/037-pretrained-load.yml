- concept: объём памяти для весов равен числу параметров, умноженному на размер одного параметра
  question: Модель содержит 24 млн параметров, каждый из которых занимает 8 байт. Сколько примерно мегабайт занимают только её веса, если считать мегабайт как миллион байт?
  explanation: 'Нужно умножить число параметров на размер одного значения: 24 млн × 8 байт = 192 млн байт, то есть примерно 192 МБ. Аналогично 46 млн параметров Mask R-CNN в float32 занимают около 184 МБ.'
  kind: numeric
  answer: 192
  tolerance: 0.5
