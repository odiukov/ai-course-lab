- concept: при строгом условии подавления рамка с IoU, равным порогу, сохраняется
  question: В greedy NMS кандидат имеет IoU, точно равный заданному порогу, с уже выбранной рамкой. Что произойдёт при условии подавления `ious > iou_threshold`?
  explanation: Подавляются только кандидаты с IoU строго выше порога. Поэтому равенство порогу проходит фильтр. При пороге 0.7 рамка с IoU 0.7 остаётся, а с IoU больше 0.7 удаляется.
  kind: choice
  options:
    - Кандидат останется для дальнейшего отбора
    - Кандидат будет подавлен
    - Его координаты усреднят с выбранной рамкой
  correct: 0
  id: 012-code-nms-1
  fingerprint: bfeec4f5
- concept: сравнение одной рамки с набором через матрицу попарных IoU требует размерности набора
  question: Почему при реализации NMS выбранную рамку передают в функцию попарного IoU как набор из одной рамки, а затем удаляют одиночное измерение результата?
  explanation: Если выбранная рамка имеет форму [1, 4], а оставшиеся — [M, 4], `box_iou` возвращает матрицу [1, M]. После удаления одиночной размерности получается вектор [M], которым удобно фильтровать оставшиеся индексы.
  kind: open
  reference: Функция попарного IoU принимает два набора рамок и возвращает матрицу сравнений. Поэтому выбранную рамку представляют как одноэлементный набор, а полученную строку IoU превращают в вектор, совпадающий по длине с набором оставшихся кандидатов.
  id: 012-code-nms-2
  fingerprint: 85e6e0ae
