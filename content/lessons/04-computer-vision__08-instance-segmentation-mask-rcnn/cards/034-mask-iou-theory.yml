- concept: Mask IoU равен отношению пиксельного пересечения масок к их объединению
  question: Предсказанная и эталонная маски совпали на 48 пикселях. Ещё 12 пикселей есть только в предсказании, а 24 — только в эталоне. Чему равен Mask IoU?
  explanation: Пересечение содержит 48 пикселей, а объединение — 48 + 12 + 24 = 84. Поэтому Mask IoU = 48 / 84 ≈ 0,571.
  kind: numeric
  answer: 0.571
  tolerance: 0.01
  id: 034-mask-iou-theory-1
  fingerprint: 774c7a8a
- concept: сопоставление метрик рамок и масок помогает локализовать узкое место Mask R-CNN
  question: У Mask R-CNN метрика для рамок высокая, а метрика для масок заметно ниже. Какой вывод наиболее обоснован?
  explanation: Метрики рамок и масок оценивают разные результаты. Хорошие рамки при слабых Mask IoU указывают, что объекты локализуются, но их пиксельные силуэты предсказываются неточно.
  kind: choice
  options:
    - RPN не способен находить объекты на изображении
    - Качество масок можно считать высоким, поскольку рамки предсказываются хорошо
    - Локализация рамками работает лучше пиксельного выделения силуэтов, поэтому узкое место вероятнее находится в mask head
  correct: 2
  id: 034-mask-iou-theory-2
