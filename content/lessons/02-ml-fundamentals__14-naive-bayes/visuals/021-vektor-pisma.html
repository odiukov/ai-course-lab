<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Как письмо становится строкой матрицы признаков</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fc;
      --surface: #ffffff;
      --surface-soft: #f1f4f9;
      --ink: #192232;
      --muted: #667085;
      --line: #aeb8c8;
      --line-strong: #66758c;
      --free: #d94b64;
      --free-soft: #fde8ed;
      --money: #a86600;
      --money-soft: #fff1cf;
      --meeting: #3369b7;
      --meeting-soft: #e6efff;
      --accent: #5c4ac7;
      --accent-soft: #ece9ff;
      --shadow: #dfe4ec;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --surface: #182130;
        --surface-soft: #202b3c;
        --ink: #edf2fa;
        --muted: #aeb9ca;
        --line: #526078;
        --line-strong: #8491a6;
        --free: #ff8195;
        --free-soft: #4a2631;
        --money: #f4bd57;
        --money-soft: #49391d;
        --meeting: #8eb8ff;
        --meeting-soft: #243b61;
        --accent: #b2a6ff;
        --accent-soft: #37305f;
        --shadow: #0c1018;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
      padding: 12px;
    }

    figure {
      margin: 0 auto;
      max-width: 1080px;
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: 0 3px 12px var(--shadow);
      overflow: hidden;
    }

    figcaption {
      padding: 13px 18px 9px;
      font-size: 22px;
      font-weight: bold;
      line-height: 1.2;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 440px;
      background: var(--surface);
    }

    text {
      fill: var(--ink);
      font-size: 16px;
    }

    .small {
      font-size: 14px;
    }

    .tiny {
      font-size: 13px;
    }

    .section-label {
      font-size: 17px;
      font-weight: bold;
    }

    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .muted-text {
      fill: var(--muted);
    }

    .free-text {
      fill: var(--free);
      font-weight: bold;
    }

    .money-text {
      fill: var(--money);
      font-weight: bold;
    }

    .meeting-text {
      fill: var(--meeting);
      font-weight: bold;
    }

    .value {
      font-size: 30px;
      font-weight: bold;
    }

    .panel {
      fill: var(--surface-soft);
      stroke: var(--line);
      stroke-width: 1.5px;
    }

    .mail-card {
      fill: var(--surface);
      stroke: var(--line-strong);
      stroke-width: 2px;
    }

    .dictionary {
      fill: var(--accent-soft);
      stroke: var(--accent);
      stroke-width: 1.5px;
    }

    .free-cell {
      fill: var(--free-soft);
      stroke: var(--free);
      stroke-width: 1.5px;
    }

    .money-cell {
      fill: var(--money-soft);
      stroke: var(--money);
      stroke-width: 1.5px;
    }

    .meeting-cell {
      fill: var(--meeting-soft);
      stroke: var(--meeting);
      stroke-width: 1.5px;
    }

    .row-cell {
      fill: var(--surface);
      stroke: var(--line-strong);
      stroke-width: 1.5px;
    }

    .future-cell {
      fill: var(--surface-soft);
      stroke: var(--line);
      stroke-width: 1.5px;
    }

    .arrow-line {
      stroke: var(--accent);
      stroke-width: 2.5px;
      stroke-linecap: round;
    }

    .arrow-head {
      fill: var(--accent);
    }

    .guide-free,
    .guide-money,
    .guide-meeting {
      fill: none;
      stroke-width: 2px;
      stroke-linecap: round;
    }

    .guide-free {
      stroke: var(--free);
    }

    .guide-money {
      stroke: var(--money);
    }

    .guide-meeting {
      stroke: var(--meeting);
    }

    #fallback {
      padding: 28px;
      color: var(--ink);
      background: var(--surface-soft);
      font-size: 16px;
    }

    #fallback[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title">
    <figcaption id="diagram-title">Как письмо становится строкой матрицы признаков</figcaption>
    <svg id="diagram" viewBox="0 0 1080 440" width="1080" height="440"
         preserveAspectRatio="xMidYMid meet" role="img"
         aria-labelledby="svg-title svg-description">
      <title id="svg-title">Преобразование письма в строку матрицы признаков</title>
      <desc id="svg-description">Словарь free, money, meeting задаёт три колонки. Письмо free free money превращается в строку 2, 1, 0.</desc>
    </svg>
    <div id="fallback">
      Схема должна показать: словарь [free, money, meeting] задаёт порядок колонок,
      а письмо «free free money» превращается в строку [2, 1, 0].
    </div>
  </figure>

  <script>
    const DATA = [{
      zero: 0,
      origin: { x: 40, y: 24 },
      scale: { x: 10, y: 10 },
      round: { small: 0.7, card: 1.2 },
      dictionaryBox: { x1: 20, y1: 1, x2: 80, y2: 7, round: 1.2 },
      dictionaryLabel: {
        x: 22.5, y: 4, text: "Словарь фиксирует порядок колонок:"
      },
      dictionaryValue: {
        x: 66, y: 4, text: "[free, money, meeting]"
      },
      mail: { x1: 2, y1: 11, x2: 31, y2: 29, round: 1.2 },
      mailLabels: [
        { x: 4, y: 13.8, text: "Письмо", cls: "section-label", anchor: "start" },
        { x: 4, y: 17.8, text: "«free free money»", cls: "code", anchor: "start" },
        { x: 4, y: 27.2, text: "meeting не встретилось", cls: "small muted-text", anchor: "start" }
      ],
      tokens: [
        {
          box: { x1: 4, y1: 20.2, x2: 11.2, y2: 24.6, round: 0.7 },
          x: 7.6, y: 22.4, text: "free", boxCls: "free-cell", textCls: "code free-text"
        },
        {
          box: { x1: 12.2, y1: 20.2, x2: 19.4, y2: 24.6, round: 0.7 },
          x: 15.8, y: 22.4, text: "free", boxCls: "free-cell", textCls: "code free-text"
        },
        {
          box: { x1: 20.4, y1: 20.2, x2: 29, y2: 24.6, round: 0.7 },
          x: 24.7, y: 22.4, text: "money", boxCls: "money-cell", textCls: "code money-text"
        }
      ],
      arrow: {
        tail: { x: 33, y: 20 },
        head: { x: 42, y: 20 },
        upper: { x: 40.6, y: 18.9 },
        lower: { x: 40.6, y: 21.1 },
        label: { x: 33, y: 16.7, text: "считаем по словарю" }
      },
      tableTitle: {
        x: 45, y: 8.8, text: "Строка матрицы признаков"
      },
      columns: [
        {
          header: { x1: 45, y1: 11, x2: 56, y2: 17, round: 0.7 },
          current: { x1: 45, y1: 17, x2: 56, y2: 25, round: 0.7 },
          future: { x1: 45, y1: 25, x2: 56, y2: 31, round: 0.7 },
          headerText: { x: 50.5, y: 14, text: "письмо" },
          currentText: { x: 50.5, y: 21, text: "это" },
          futureText: { x: 50.5, y: 28, text: "другое" },
          headerCls: "panel",
          currentCls: "row-cell",
          futureCls: "future-cell",
          textCls: "small"
        },
        {
          header: { x1: 56, y1: 11, x2: 70, y2: 17, round: 0.7 },
          current: { x1: 56, y1: 17, x2: 70, y2: 25, round: 0.7 },
          future: { x1: 56, y1: 25, x2: 70, y2: 31, round: 0.7 },
          headerText: { x: 63, y: 14, text: "free" },
          currentText: { x: 63, y: 21, text: "2" },
          futureText: { x: 63, y: 28, text: "…" },
          headerCls: "free-cell",
          currentCls: "row-cell",
          futureCls: "future-cell",
          textCls: "free-text"
        },
        {
          header: { x1: 70, y1: 11, x2: 84, y2: 17, round: 0.7 },
          current: { x1: 70, y1: 17, x2: 84, y2: 25, round: 0.7 },
          future: { x1: 70, y1: 25, x2: 84, y2: 31, round: 0.7 },
          headerText: { x: 77, y: 14, text: "money" },
          currentText: { x: 77, y: 21, text: "1" },
          futureText: { x: 77, y: 28, text: "…" },
          headerCls: "money-cell",
          currentCls: "row-cell",
          futureCls: "future-cell",
          textCls: "money-text"
        },
        {
          header: { x1: 84, y1: 11, x2: 98, y2: 17, round: 0.7 },
          current: { x1: 84, y1: 17, x2: 98, y2: 25, round: 0.7 },
          future: { x1: 84, y1: 25, x2: 98, y2: 31, round: 0.7 },
          headerText: { x: 91, y: 14, text: "meeting" },
          currentText: { x: 91, y: 21, text: "0" },
          futureText: { x: 91, y: 28, text: "…" },
          headerCls: "meeting-cell",
          currentCls: "row-cell",
          futureCls: "future-cell",
          textCls: "meeting-text"
        }
      ],
      guides: [
        { x1: 63, y1: 9.7, x2: 63, y2: 10.5, cls: "guide-free" },
        { x1: 77, y1: 9.7, x2: 77, y2: 10.5, cls: "guide-money" },
        { x1: 91, y1: 9.7, x2: 91, y2: 10.5, cls: "guide-meeting" }
      ],
      result: {
        x: 50, y: 35.2,
        text: "Итоговый вектор: [2, 1, 0]"
      },
      explanation: {
        x: 50, y: 39,
        text: "Новое письмо добавит строку, но колонки останутся в порядке словаря."
      }
    }];

    const [D] = DATA;
    const origin = Object.freeze(D.origin);
    const scale = Object.freeze(D.scale);
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const svg = document.getElementById("diagram");
    const fallback = document.getElementById("fallback");
    const namespace = "http://www.w3.org/2000/svg";

    function make(tag, attributes, content) {
      const element = document.createElementNS(namespace, tag);
      Object.entries(attributes).forEach(([name, value]) => {
        element.setAttribute(name, String(value));
      });
      if (content !== undefined) {
        element.textContent = content;
      }
      svg.appendChild(element);
      return element;
    }

    function box(item, cls) {
      return make("rect", {
        x: sx(item.x1),
        y: sy(item.y1),
        width: sx(item.x2) - sx(item.x1),
        height: sy(item.y2) - sy(item.y1),
        rx: sx(item.round ?? D.zero) - sx(D.zero),
        ry: sy(item.round ?? D.zero) - sy(D.zero),
        class: cls
      });
    }

    function text(item, cls, anchor) {
      return make("text", {
        x: sx(item.x),
        y: sy(item.y),
        class: cls ?? "",
        "text-anchor": anchor ?? "middle",
        "dominant-baseline": "middle"
      }, item.text);
    }

    function line(item, cls) {
      return make("line", {
        x1: sx(item.x1),
        y1: sy(item.y1),
        x2: sx(item.x2),
        y2: sy(item.y2),
        class: cls
      });
    }

    try {
      box(D.dictionaryBox, "dictionary");
      text(D.dictionaryLabel, "small", "start");
      text(D.dictionaryValue, "code section-label", "middle");

      box(D.mail, "mail-card");
      D.mailLabels.forEach(item => text(item, item.cls, item.anchor));

      D.tokens.forEach(token => {
        box(token.box, token.boxCls);
        text(token, token.textCls, "middle");
      });

      make("line", {
        x1: sx(D.arrow.tail.x),
        y1: sy(D.arrow.tail.y),
        x2: sx(D.arrow.head.x),
        y2: sy(D.arrow.head.y),
        class: "arrow-line"
      });

      make("polygon", {
        points: [
          `${sx(D.arrow.head.x)},${sy(D.arrow.head.y)}`,
          `${sx(D.arrow.upper.x)},${sy(D.arrow.upper.y)}`,
          `${sx(D.arrow.lower.x)},${sy(D.arrow.lower.y)}`
        ].join(" "),
        class: "arrow-head"
      });

      text(D.arrow.label, "small muted-text", "start");
      text(D.tableTitle, "section-label", "start");
      D.guides.forEach(guide => line(guide, guide.cls));

      D.columns.forEach(column => {
        box(column.header, column.headerCls);
        box(column.current, column.currentCls);
        box(column.future, column.futureCls);
        text(column.headerText, `code ${column.textCls}`, "middle");
        text(column.currentText, column.currentText.text === "это" ? "small" : `value ${column.textCls}`, "middle");
        text(column.futureText, "small muted-text", "middle");
      });

      text(D.result, "code section-label", "middle");
      text(D.explanation, "small muted-text", "middle");
      fallback.hidden = true;
    } catch (error) {
      fallback.hidden = false;
      fallback.textContent =
        "Схема должна показать: словарь [free, money, meeting] задаёт порядок колонок, " +
        "а письмо «free free money» превращается в строку [2, 1, 0].";
    }
  </script>
</body>
</html>
