<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сравнение двух классов без общего знаменателя</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f5f7fb;
      --surface: #ffffff;
      --panel: #f8fafc;
      --ink: #172033;
      --muted: #5b6475;
      --line: #9aa5b5;
      --accent: #1769aa;
      --accent-soft: #e4f2ff;
      --common: #087f8c;
      --common-soft: #dff6f4;
      --cancel: #c43d4f;
      --winner: #157347;
      --winner-soft: #e2f5e9;
      --ordinary-soft: #eef1f5;
      --border: #cbd3df;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #10141c;
        --surface: #171d28;
        --panel: #1d2431;
        --ink: #edf2f8;
        --muted: #b1bbca;
        --line: #778397;
        --accent: #65b7f3;
        --accent-soft: #173b55;
        --common: #55d4d0;
        --common-soft: #173d40;
        --cancel: #ff7d8c;
        --winner: #78d69e;
        --winner-soft: #183d2b;
        --ordinary-soft: #29313e;
        --border: #485365;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
    }

    .diagram {
      max-width: 960px;
      margin-inline: auto;
      background: var(--surface);
    }

    .diagram-title {
      font: bold 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      box-sizing: border-box;
      border: 1px solid var(--border);
      background: var(--surface);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .panel {
      fill: var(--panel);
      stroke: var(--border);
    }

    .class-spam {
      fill: var(--accent-soft);
      stroke: var(--accent);
    }

    .class-ordinary {
      fill: var(--ordinary-soft);
      stroke: var(--line);
    }

    .common-chip {
      fill: var(--common-soft);
      stroke: var(--common);
    }

    .score-spam {
      fill: var(--winner-soft);
      stroke: var(--winner);
    }

    .score-ordinary {
      fill: var(--ordinary-soft);
      stroke: var(--line);
    }

    .winner-box {
      fill: var(--winner-soft);
      stroke: var(--winner);
    }

    .ink-line {
      stroke: var(--ink);
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .muted-line {
      stroke: var(--line);
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .accent-line {
      stroke: var(--accent);
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .cancel-line {
      stroke: var(--cancel);
      fill: none;
      stroke-linecap: round;
    }

    .arrow-head {
      fill: var(--accent);
      stroke: var(--accent);
      stroke-linejoin: round;
    }

    .text {
      fill: var(--ink);
      font-size: 18px;
    }

    .small {
      fill: var(--muted);
      font-size: 14px;
    }

    .class-label {
      fill: var(--ink);
      font-size: 16px;
      font-weight: bold;
    }

    .formula {
      fill: var(--ink);
      font-size: 17px;
    }

    .denominator {
      fill: var(--common);
      font-size: 17px;
      font-weight: bold;
    }

    .common-label {
      fill: var(--common);
      font-size: 15px;
      font-weight: bold;
    }

    .score {
      fill: var(--ink);
      font-size: 22px;
      font-weight: bold;
    }

    .comparison {
      fill: var(--ink);
      font-size: 25px;
      font-weight: bold;
    }

    .winner-text {
      fill: var(--winner);
      font-size: 17px;
      font-weight: bold;
    }

    .fallback {
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--border);
      font: 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
  </style>
</head>
<body>
  <figure class="diagram" aria-labelledby="diagram-title">
    <h2 class="diagram-title" id="diagram-title">Сравнение двух классов без общего знаменателя</h2>
    <svg id="scheme" viewBox="0 0 960 430" width="960" height="430"
         preserveAspectRatio="xMidYMid meet" role="img"
         aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Сравнение оценок для спама и обычного письма</title>
      <desc id="svg-desc">В двух формулах зачёркнут одинаковый знаменатель P признаков. После этого сравниваются оценки likelihood умножить на prior: 0,012 и 0,004. Побеждает спам.</desc>
    </svg>
    <p id="fallback" class="fallback" hidden>
      В обеих формулах один и тот же знаменатель P(признаки), поэтому для выбора класса
      сравниваются только likelihood × prior: 0,012 больше 0,004, значит выбирается «спам».
    </p>
  </figure>

  <script>
    const diagramData = [{
      zero: 0,
      origin: { x: 0, y: 0 },
      scale: { x: 1, y: 1 },
      canvas: { width: 960, height: 430 },
      lineWidth: 2,
      heavyWidth: 3,
      hairWidth: 1,
      radius: 12,
      arrowSize: 12,
      arrowHalf: 7,

      common: {
        label: { x: 480, y: 25 },
        chip: { x: 315, y: 7, width: 330, height: 27 },
        guideLeft: { x: 435, y: 38 },
        guideJoint: { x: 480, y: 44 },
        guideRight: { x: 525, y: 38 }
      },

      panels: [
        {
          box: { x: 28, y: 48, width: 904, height: 116 },
          classBox: { x: 48, y: 65, width: 104, height: 29 },
          classText: { x: 100, y: 85 },
          lhs: { x: 62, y: 128 },
          equals: { x: 279, y: 128 },
          numerator: { x: 475, y: 104 },
          fraction: { x1: 319, y1: 116, x2: 631, y2: 116 },
          denominatorChip: { x: 405, y: 121, width: 140, height: 27 },
          denominator: { x: 475, y: 141 },
          cancel: { x1: 410, y1: 148, x2: 540, y2: 121 },
          arrow: { x1: 650, y1: 128, x2: 735, y2: 128 },
          arrowLabel: { x: 692, y: 111 },
          scoreBox: { x: 752, y: 94, width: 153, height: 54 },
          scoreLabel: { x: 828, y: 111 },
          score: { x: 828, y: 137 },
          lhsText: "P(спам | признаки)",
          numeratorText: "P(признаки | спам) · P(спам)",
          denominatorText: "P(признаки)",
          classTextValue: "спам",
          scoreText: "0,012"
        },
        {
          box: { x: 28, y: 180, width: 904, height: 116 },
          classBox: { x: 48, y: 197, width: 132, height: 29 },
          classText: { x: 114, y: 217 },
          lhs: { x: 62, y: 260 },
          equals: { x: 279, y: 260 },
          numerator: { x: 475, y: 236 },
          fraction: { x1: 319, y1: 248, x2: 631, y2: 248 },
          denominatorChip: { x: 405, y: 253, width: 140, height: 27 },
          denominator: { x: 475, y: 273 },
          cancel: { x1: 410, y1: 280, x2: 540, y2: 253 },
          arrow: { x1: 650, y1: 260, x2: 735, y2: 260 },
          arrowLabel: { x: 692, y: 243 },
          scoreBox: { x: 752, y: 226, width: 153, height: 54 },
          scoreLabel: { x: 828, y: 243 },
          score: { x: 828, y: 269 },
          lhsText: "P(обычное | признаки)",
          numeratorText: "P(признаки | обычное) · P(обычное)",
          denominatorText: "P(признаки)",
          classTextValue: "обычное",
          scoreText: "0,004"
        }
      ],

      comparison: {
        divider: { x1: 170, y1: 314, x2: 790, y2: 314 },
        caption: { x: 480, y: 337 },
        leftBox: { x: 250, y: 350, width: 170, height: 46 },
        leftText: { x: 335, y: 381 },
        sign: { x: 480, y: 381 },
        rightBox: { x: 540, y: 350, width: 170, height: 46 },
        rightText: { x: 625, y: 381 },
        winnerBox: { x: 354, y: 401, width: 252, height: 25 },
        winnerText: { x: 480, y: 420 }
      },

      strings: {
        common: "одинаковый P(признаки) в обеих формулах",
        equals: "=",
        remains: "остаётся",
        scoreLabel: "likelihood × prior",
        caption: "После зачёркивания общего знаменателя:",
        greater: ">",
        winner: "выбираем «спам»"
      }
    }];

    const [DATA] = diagramData;
    const origin = DATA.origin;
    const scale = DATA.scale;
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("scheme");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";
      const z = DATA.zero;

      const element = (name, attributes, parent) => {
        const item = document.createElementNS(namespace, name);
        Object.entries(attributes).forEach(([key, value]) => {
          item.setAttribute(key, String(value));
        });
        (parent || svg).appendChild(item);
        return item;
      };

      const group = className => element("g", { class: className });

      const text = (point, value, className, anchor, parent) => {
        const item = element("text", {
          x: sx(point.x),
          y: sy(point.y),
          class: className,
          "text-anchor": anchor
        }, parent);
        item.textContent = value;
        return item;
      };

      const line = (segment, className, width, parent) => element("line", {
        x1: sx(segment.x1),
        y1: sy(segment.y1),
        x2: sx(segment.x2),
        y2: sy(segment.y2),
        class: className,
        "stroke-width": width
      }, parent);

      const rect = (box, className, width, parent) => element("rect", {
        x: sx(box.x),
        y: sy(box.y),
        width: sx(box.x + box.width) - sx(z),
        height: sy(box.y + box.height) - sy(z),
        rx: sx(DATA.radius) - sx(z),
        ry: sy(DATA.radius) - sy(z),
        class: className,
        "stroke-width": width
      }, parent);

      const arrow = (segment, parent) => {
        line(segment, "accent-line", DATA.lineWidth, parent);
        const points = [
          [segment.x2, segment.y2],
          [segment.x2 - DATA.arrowSize, segment.y2 - DATA.arrowHalf],
          [segment.x2 - DATA.arrowSize, segment.y2 + DATA.arrowHalf]
        ].map(([x, y]) => `${sx(x)},${sy(y)}`).join(" ");
        element("polygon", {
          points: points,
          class: "arrow-head",
          "stroke-width": DATA.hairWidth
        }, parent);
      };

      const commonGroup = group("common-denominator");
      rect(DATA.common.chip, "common-chip", DATA.lineWidth, commonGroup);
      text(DATA.common.label, DATA.strings.common, "common-label", "middle", commonGroup);
      line({
        x1: DATA.common.guideLeft.x,
        y1: DATA.common.guideLeft.y,
        x2: DATA.common.guideJoint.x,
        y2: DATA.common.guideJoint.y
      }, "muted-line", DATA.hairWidth, commonGroup);
      line({
        x1: DATA.common.guideJoint.x,
        y1: DATA.common.guideJoint.y,
        x2: DATA.common.guideRight.x,
        y2: DATA.common.guideRight.y
      }, "muted-line", DATA.hairWidth, commonGroup);

      DATA.panels.forEach((panel, panelPosition) => {
        const panelGroup = group("formula-panel");
        rect(panel.box, "panel", DATA.lineWidth, panelGroup);

        const classStyle = panelPosition === DATA.panels.keys().next().value
          ? "class-spam"
          : "class-ordinary";

        rect(panel.classBox, classStyle, DATA.lineWidth, panelGroup);
        text(panel.classText, panel.classTextValue, "class-label", "middle", panelGroup);

        text(panel.lhs, panel.lhsText, "formula", "start", panelGroup);
        text(panel.equals, DATA.strings.equals, "formula", "middle", panelGroup);
        text(panel.numerator, panel.numeratorText, "formula", "middle", panelGroup);

        line(panel.fraction, "ink-line", DATA.lineWidth, panelGroup);
        rect(panel.denominatorChip, "common-chip", DATA.hairWidth, panelGroup);
        text(panel.denominator, panel.denominatorText, "denominator", "middle", panelGroup);
        line(panel.cancel, "cancel-line", DATA.heavyWidth, panelGroup);

        arrow(panel.arrow, panelGroup);
        text(panel.arrowLabel, DATA.strings.remains, "small", "middle", panelGroup);

        const scoreStyle = panelPosition === DATA.panels.keys().next().value
          ? "score-spam"
          : "score-ordinary";

        rect(panel.scoreBox, scoreStyle, DATA.lineWidth, panelGroup);
        text(panel.scoreLabel, DATA.strings.scoreLabel, "small", "middle", panelGroup);
        text(panel.score, panel.scoreText, "score", "middle", panelGroup);
      });

      const result = DATA.comparison;
      const resultGroup = group("comparison-result");

      line(result.divider, "muted-line", DATA.hairWidth, resultGroup);
      text(result.caption, DATA.strings.caption, "small", "middle", resultGroup);

      rect(result.leftBox, "score-spam", DATA.lineWidth, resultGroup);
      text(result.leftText, DATA.panels.map(panel => panel.scoreText).shift(),
        "comparison", "middle", resultGroup);

      text(result.sign, DATA.strings.greater, "comparison", "middle", resultGroup);

      rect(result.rightBox, "score-ordinary", DATA.lineWidth, resultGroup);
      text(result.rightText, DATA.panels.map(panel => panel.scoreText).pop(),
        "comparison", "middle", resultGroup);

      rect(result.winnerBox, "winner-box", DATA.lineWidth, resultGroup);
      text(result.winnerText, DATA.strings.winner, "winner-text", "middle", resultGroup);

      fallback.hidden = true;
    } catch (error) {
      const svg = document.getElementById("scheme");
      const fallback = document.getElementById("fallback");
      if (svg) {
        svg.hidden = true;
      }
      if (fallback) {
        fallback.hidden = false;
      }
    }
  </script>
</body>
</html>
