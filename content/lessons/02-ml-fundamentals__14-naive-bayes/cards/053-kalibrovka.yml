- concept: калиброванная вероятность соответствует наблюдаемой доле положительного класса среди объектов с похожим прогнозом
  question: Откалиброванный классификатор присвоил 250 похожим объектам вероятность положительного класса 64%. Примерно сколько из них должно относиться к положительному классу?
  explanation: У хорошо откалиброванной модели среди объектов с прогнозом около 64% положительный класс встречается примерно в 64% случаев. Поэтому ожидаемое число равно 250 × 0,64 = 160.
  kind: numeric
  answer: 160
  tolerance: 1
  id: 053-kalibrovka-1
  fingerprint: 4c5bf8a7
- concept: калибратор обучают на прогнозах для объектов, которые базовая модель не использовала при обучении
  question: Расположи этапы кросс-валидационной калибровки Naive Bayes в правильном порядке.
  explanation: Калибратор должен видеть оценки, полученные вне обучающей выборки соответствующей базовой модели. Кросс-валидация создаёт такие оценки, после чего сигмоидальная зависимость сопоставляет их с реальными частотами классов.
  kind: order
  items:
    - Разделить обучающие данные на фолды.
    - Обучать Naive Bayes на части фолдов и получать его оценки на отложенном фолде.
    - Собрать оценки для отложенных объектов вместе с их истинными метками.
    - Обучить сигмоидальную корректирующую зависимость между оценками и метками.
    - Преобразовывать оценки Naive Bayes для новых объектов в откалиброванные вероятности.
  id: 053-kalibrovka-2
  fingerprint: 7fd1afb3
