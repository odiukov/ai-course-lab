- concept: Multinomial Naive Bayes принимает неотрицательные TF-IDF-веса как взвешенные счётчики
  question: После преобразования TF-IDF матрица признаков содержит дробные значения. Объясните, почему такую матрицу можно подать в MultinomialNB и какое ограничение должны соблюдать её значения.
  explanation: В вычислениях MultinomialNB признаки умножают логарифмические вероятности терминов, поэтому вместо целых счётчиков могут использоваться неотрицательные веса TF-IDF. Отрицательный вес нельзя интерпретировать как количество или массу наблюдений.
  kind: open
  reference: 'MultinomialNB может использовать неотрицательные дробные признаки как взвешенные счётчики: вклад термина определяется его весом, а не обязан быть целым числом появлений. Отрицательные значения недопустимы, поскольку они не соответствуют частотной модели.'
  id: 048-tfidf-dlya-nb-2
  fingerprint: b035ad97
