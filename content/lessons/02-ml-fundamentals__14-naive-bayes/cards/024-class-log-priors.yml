- concept: позиции классов и их логарифмических prior должны быть согласованы
  question: В реализации Multinomial Naive Bayes классы сохранены в одном порядке, а логарифмы их априорных вероятностей — в другом. Объясни, почему это ошибка и как её избежать.
  explanation: Предсказание сопоставляет классам оценки по позициям массивов. Если порядок различается, модель добавит каждому классу чужой prior и может выбрать неверную метку.
  kind: open
  reference: Оценка в каждой позиции должна складываться с prior того же класса. Нужно вычислять и записывать логарифмы prior, перебирая классы в том же порядке, в котором они сохранены в массиве классов.
  id: 024-class-log-priors-2
  fingerprint: 3d0b32b9
