- concept: координаты bag-of-words являются неотрицательными целыми счётчиками
  question: Какие значения могут принимать координаты вектора bag-of-words и почему?
  explanation: Bag-of-words строится подсчётом появлений токенов. Отсутствующему токену соответствует нулевой счётчик, а присутствующему — положительное целое количество вхождений.
  kind: open
  reference: 'Каждая координата — неотрицательное целое число: она показывает, сколько раз соответствующий словарю токен встретился в документе. Отрицательные и дробные количества появлений невозможны.'
  id: 019-dokument-v-vektor-1
  fingerprint: 98f415b8
- concept: вектор bag-of-words короткого документа обычно разрежен
  question: Почему представление короткого документа в виде bag-of-words обычно содержит много нулевых координат?
  explanation: Координата ненулевая только для слова, встретившегося в документе. Если словарь велик, а документ короток, подавляющее большинство словарных слов отсутствует, поэтому вектор получается разреженным.
  kind: choice
  options:
    - Большинство слов из общего словаря не встречается в конкретном коротком документе
    - Положительные счётчики взаимно уничтожаются при сложении
    - Каждому токену документа выделяется несколько пустых координат
    - Частоты слов заменяются их отрицательными логарифмами
  correct: 0
  id: 019-dokument-v-vektor-2
  fingerprint: e6e9daba
