- concept: дисперсия управляет шириной нормального распределения и штрафом за отклонение от среднего
  question: Объясни, как увеличение дисперсии при неизменном среднем меняет нормальное распределение признака в Gaussian NB.
  explanation: Дисперсия входит и в показатель экспоненты, и в нормирующий множитель. Большая дисперсия делает колокол шире и снижает его пик; малая концентрирует плотность возле среднего.
  kind: open
  reference: Распределение становится шире, а его вершина — ниже. Для фиксированного отклонения от среднего модуль показателя экспоненты уменьшается, поэтому такое отклонение штрафуется слабее.
  id: 045-kogda-gaussian-2
  fingerprint: 9940aadb
