- concept: редкие текстовые признаки делают оценки весов логистической регрессии нестабильными на малой выборке
  question: Почему логистическая регрессия может давать нестабильные предсказания, если словарь намного больше размеченной текстовой выборки?
  explanation: Для каждого слова нужно оценить отдельный вес. Если слово встретилось лишь в нескольких документах, его связь с классом легко оказывается случайной, поэтому небольшое изменение выборки заметно меняет вес и предсказания.
  kind: choice
  options:
    - Она не умеет работать с разреженными векторами
    - Веса редких слов оцениваются по слишком малому числу наблюдений и имеют высокую дисперсию
    - Она всегда присваивает всем словам одинаковые веса
    - Её функция потерь не учитывает правильные классы
  correct: 1
  id: 002-malye-dannye-1
  fingerprint: babf5322
- concept: глубокие текстовые деревья переобучаются на случайных словах в малочисленных узлах
  question: Решающее дерево для классификации текстов продолжает делить выборку по наличию отдельных слов, пока в листьях не остаётся очень мало документов. Каково наиболее вероятное последствие?
  explanation: В узле с малым числом документов случайное совпадение слова и класса выглядит как полезное разбиение. Глубокое дерево запоминает такие совпадения, получая низкую ошибку на обучении, но высокую — на новых данных.
  kind: choice
  options:
    - Дерево обнаружит только самые частые слова и станет недообученным
    - Расстояния между всеми документами станут одинаковыми
    - Случайные слова превратятся в правила, которые плохо обобщаются на новые документы
    - Все листья автоматически получат одинаковый класс
  correct: 2
  id: 002-malye-dannye-2
  fingerprint: c319e418
- concept: концентрация расстояний ослабляет понятие ближайшего соседа в текстовых пространствах высокой размерности
  question: Объясните своими словами, почему KNN плохо работает с разреженными текстовыми векторами очень высокой размерности.
  explanation: KNN предполагает, что близкие точки действительно похожи. Из-за концентрации расстояний в пространствах с множеством слов ближайший сосед выделяется слабо, поэтому его класс становится ненадёжной подсказкой.
  kind: open
  reference: В высокой размерности документы обычно совпадают лишь по малой части признаков, а расстояния до ближайших и остальных соседей становятся близкими. Поэтому ближайший документ может не быть содержательно похожим, и основанное на локальности решение KNN теряет надёжность.
  id: 002-malye-dannye-3
  fingerprint: d0b2e553
