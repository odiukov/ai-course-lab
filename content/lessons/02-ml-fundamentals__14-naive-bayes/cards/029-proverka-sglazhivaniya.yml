- concept: чрезмерно сильное сглаживание ослабляет полезные различия между частотами слов
  question: Объясни своими словами, почему слишком большое значение alpha может ухудшить классификацию, хотя оно надёжно устраняет нулевые вероятности.
  explanation: Сглаживание не только защищает от нулей. Чем больше alpha, тем ближе распределение слов к равномерному и тем слабее влияние статистики обучающей выборки.
  kind: open
