- concept: размер словаря равен числу уникальных токенов во всей коллекции документов
  question: Функция строит словарь по документам [["мак", "дуб", "мак", "лён"], [], ["дуб", "ива", "тис"], ["бук", "вяз", "ива"]]. Сколько записей будет в словаре?
  explanation: 'Повторные вхождения «мак», «дуб» и «ива» не создают новых записей, а пустой документ ничего не добавляет. Уникальные токены: «мак», «дуб», «лён», «ива», «тис», «бук» и «вяз».'
  kind: numeric
  answer: 7
  tolerance: 0.01
  id: 018-build-vocabulary-1
  fingerprint: f391e92e
- concept: следующий свободный индекс можно получить из текущего размера словаря
  question: Заполни пропуск так, чтобы каждый новый токен получал очередной индекс, а уже зарегистрированный токен сохранял прежний.
  explanation: До вставки нового токена длина словаря совпадает со следующим свободным индексом. Проверка принадлежности не позволяет повторному токену перезаписать уже назначенный индекс.
  kind: cloze
  template: |-
    for document in documents:
        for token in document:
            if token not in vocabulary:
                vocabulary[token] = ___
  answer: len(vocabulary)
  accept:
    - len(vocabulary)
    - vocabulary.__len__()
  id: 018-build-vocabulary-2
  fingerprint: bd41b571
