- concept: условная независимость признаков при фиксированном классе позволяет разложить совместный likelihood в произведение
  question: Заполни пропуск в формуле для условно независимых признаков x и y при известном классе c.
  explanation: 'Наивное допущение применяется после фиксации класса: совместная условная вероятность признаков заменяется произведением их отдельных условных вероятностей.'
  kind: cloze
  template: P(x, y | c) = ___
  answer: P(x | c) * P(y | c)
  accept:
    - P(x|c)P(y|c)
    - P(y|c) * P(x|c)
  id: 009-uslovnaya-nezavisimost-1
  fingerprint: 759b88dc
- concept: условная независимость признаков не означает их безусловной независимости
  question: Какое утверждение точнее всего описывает допущение Naive Bayes?
  explanation: Naive Bayes допускает условную независимость признаков внутри фиксированного класса. В данных признаки могут быть связаны как в целом, так и фактически внутри класса — модель лишь игнорирует эту связь при вычислении likelihood.
  kind: choice
  options:
    - Признаки считаются независимыми только при условии, что класс уже известен
    - Признаки считаются независимыми во всех объектах независимо от класса
    - Каждый признак может встречаться только в одном классе
    - Значения всех признаков должны иметь одинаковую вероятность
