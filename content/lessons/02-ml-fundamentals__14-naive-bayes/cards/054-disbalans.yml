- concept: accuracy может скрывать полный провал на редком классе при сильном дисбалансе
  question: Классификатор почти всегда правильно распознаёт многочисленный отрицательный класс, но пропускает редкий положительный класс. Почему одной accuracy недостаточно для оценки модели?
  explanation: При дисбалансе ошибки на редком классе слабо влияют на общую долю правильных ответов. Поэтому высокую accuracy нужно дополнять precision и recall для целевого класса.
  kind: choice
  options:
    - Большинство объектов обеспечивает высокую accuracy, даже если модель не решает задачу обнаружения редкого класса
    - Accuracy применима только к моделям с непрерывными признаками
    - Accuracy не учитывает правильные ответы для отрицательного класса
  correct: 0
  id: 054-disbalans-1
  fingerprint: c005709b
- concept: precision равен доле истинно положительных объектов среди всех положительных прогнозов
  question: Модель выдала 24 положительных прогноза, из которых 18 оказались верными. Чему равен precision положительного класса?
  explanation: 'Precision считается среди положительных прогнозов: TP / (TP + FP). Здесь это 18 / 24 = 0.75. Остальные 6 прогнозов были ложными тревогами.'
  kind: numeric
  answer: 0.75
  tolerance: 0.001
  id: 054-disbalans-2
  fingerprint: cebd4125
- concept: recall равен доле найденных положительных объектов среди всех истинно положительных объектов
  question: Заполни формулу recall через число истинно положительных и ложноотрицательных результатов.
  explanation: 'В знаменателе находятся все реальные положительные объекты: найденные моделью TP и пропущенные FN. Поэтому модель, пропустившая весь редкий класс, получает минимальный recall.'
  kind: cloze
  template: recall = TP / (TP + ___)
  answer: FN
  accept:
    - false negatives
    - ложноотрицательные результаты
    - ложные отрицания
  id: 054-disbalans-3
  fingerprint: bc8b82fe
