- concept: знаменатель сглаженной условной вероятности включает псевдосчётчик для каждого слова словаря
  question: Заполни выражение для нормализации счётчиков слов одного класса после сглаживания Лапласа.
  explanation: Псевдосчётчик alpha прибавляется к каждой координате, поэтому общая масса счётчиков увеличивается на alpha, умноженное на размер словаря.
  kind: cloze
  template: denominator = token_counts.sum() + ___
  answer: alpha * vocab_size
  accept:
    - vocab_size * alpha
    - alpha * len(token_counts)
  id: 027-feature-log-probs-1
  fingerprint: 465db59b
- concept: Multinomial Naive Bayes оценивает частоты слов класса суммированием bag-of-words-счётчиков документов
  question: Как получить вектор счётчиков слов для одного класса из строк bag-of-words-матрицы, относящихся к этому классу?
  explanation: Multinomial Naive Bayes использует общее число употреблений каждого слова в классе. Поэтому строки документов складывают, сохраняя отдельную сумму для каждого столбца словаря.
  kind: choice
  options:
    - Сложить выбранные строки по каждому столбцу словаря
    - Посчитать число документов, в которых каждый столбец ненулевой
    - Сложить значения внутри каждой строки и использовать суммы длин документов
    - Усреднить все столбцы по выбранным документам
  correct: 0
  id: 027-feature-log-probs-2
  fingerprint: 01af3c6f
- concept: условное распределение слов нормализуется независимо для каждого класса
  question: Почему при вычислении feature log probabilities нельзя делить счётчики слов класса на сумму сглаженных счётчиков сразу по всем классам?
  explanation: Feature log probabilities описывают распределение слов при фиксированном классе. Нормализация общей массой нескольких классов смешивает эти условные распределения и делает строки ненормированными.
  kind: open
  reference: 'Каждая строка должна задавать отдельное условное распределение P(word | class). Поэтому её нормализуют собственной суммой: после экспоненцирования логарифмических вероятностей значения внутри каждой строки должны суммироваться в единицу. Общий знаменатель по всем классам нарушил бы это свойство.'
  id: 027-feature-log-probs-3
  fingerprint: 1b70ed15
