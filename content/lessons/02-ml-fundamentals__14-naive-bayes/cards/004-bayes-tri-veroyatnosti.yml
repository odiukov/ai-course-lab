- concept: likelihood — это вероятность признаков при заданном классе, а не вероятность класса при признаках
  question: Какую величину в классификаторе Naive Bayes называют likelihood?
  explanation: 'Likelihood имеет направление P(признаки | класс): он показывает, насколько характерны наблюдаемые признаки для заданного класса. Обратная условная вероятность P(класс | признаки) — это posterior.'
  kind: choice
  options:
    - Вероятность класса при наблюдаемых признаках
    - Вероятность наблюдаемых признаков при заданном классе
    - Общую вероятность наблюдаемых признаков независимо от класса
  correct: 1
  id: 004-bayes-tri-veroyatnosti-1
  fingerprint: ca03f5d5
- concept: при сравнении классов posterior пропорционален произведению likelihood и prior
  question: Заполни пропуск в формуле сравнения классов по теореме Байеса.
  explanation: Знаменатель P(признаки) одинаков для всех сравниваемых классов, поэтому для выбора победителя достаточно сравнить произведения likelihood и prior.
  kind: cloze
  template: P(класс | признаки) ∝ P(признаки | класс) · ___
  answer: P(класс)
  accept:
    - prior
    - априорная вероятность класса
  id: 004-bayes-tri-veroyatnosti-2
  fingerprint: e499366d
- concept: высокий likelihood не гарантирует высокий posterior из-за влияния prior
  question: Объясни своими словами, почему класс с более высоким likelihood не обязательно получит самый высокий posterior.
  explanation: Теорема Байеса объединяет свидетельства с исходной частотой класса. Поэтому при сравнении нужно учитывать произведение P(признаки | класс) и P(класс), а не один likelihood.
  kind: open
  reference: Posterior зависит не только от likelihood, но и от prior. Если класс изначально встречается гораздо реже, его низкая априорная вероятность может перевесить преимущество в likelihood.
  id: 004-bayes-tri-veroyatnosti-3
  fingerprint: 9e600668
