- concept: обучение и предсказание должны использовать одно и то же соответствие между словами и колонками
  question: При обучении слову «возврат» соответствовала одна колонка, а при предсказании энкодер поместил его в другую. Какое требование устраняет такую ошибку?
  explanation: Параметры модели связаны с конкретными колонками. Если отображение слова в индекс меняется, модель применяет выученную вероятность одного слова к другому признаку.
  kind: choice
  options:
    - Сортировать значения признаков по убыванию перед классификацией
    - Создавать новый словарь отдельно для каждого документа
    - Объединять все колонки с одинаковыми частотами
    - Назначать колонку по позиции слова в предложении
    - Использовать при обучении и предсказании одно и то же отображение слова в индекс колонки
  correct: 4
  id: 017-slovar-kolonki-1
  fingerprint: de434937
- concept: словарь строится после токенизации и до подсчёта частот по колонкам
  question: Расположите операции подготовки текстовых признаков в правильном порядке.
  explanation: Сначала из текста выделяют токены, затем определяют набор известных токенов и их индексы. Только после этого частоты можно записывать в однозначно определённые колонки.
  kind: order
  items:
    - Токенизировать обучающие тексты
    - Построить словарь и закрепить токены за колонками
    - Подсчитать частоты токенов в назначенных им колонках
  id: 017-slovar-kolonki-2
  fingerprint: 4edb28bb
- concept: неизвестный словарю токен не имеет отдельной координаты в фиксированном признаковом представлении
  question: В документе встретился токен, которого нет в фиксированном словаре модели, и специального признака для неизвестных токенов не предусмотрено. Что произойдёт при построении вектора признаков и почему?
  explanation: Размер и смысл колонок фиксируются во время обучения. Незнакомый токен можно учитывать только через заранее предусмотренный признак неизвестного токена или после перестроения представления и повторного обучения модели.
  kind: open
  reference: 'Токен не получит отдельной координаты и не изменит вектор как самостоятельный признак, потому что словарь не назначил ему колонку. Добавлять новую колонку только при предсказании нельзя: параметры модели для неё не обучались.'
  id: 017-slovar-kolonki-3
  fingerprint: f7142f03
