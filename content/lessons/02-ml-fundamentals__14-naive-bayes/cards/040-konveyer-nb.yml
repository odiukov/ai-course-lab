- concept: при отсутствии учтённых признаков логарифмический балл класса равен его log-prior
  question: Вектор признаков документа пуст. Чему равен балл класса, вычисляемый как log P(class) плюс сумма логарифмических вкладов признаков? Объясните почему.
  explanation: В формуле к log-prior прибавляется сумма вкладов признаков. Для пустого вектора эта сумма равна нулю, поэтому признаковая часть не меняет балл класса.
  kind: open
  reference: 'Баллу log P(class), то есть log-prior этого класса: при отсутствии признаков сумма их вкладов пуста и равна нулю.'
