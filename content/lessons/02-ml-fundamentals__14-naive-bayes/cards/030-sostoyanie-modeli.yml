- concept: для применения обученной модели не требуется хранить исходную обучающую выборку
  question: Объясни своими словами, почему после вызова `fit` модель Multinomial Naive Bayes может классифицировать новые объекты без доступа к исходной обучающей матрице.
  explanation: '`fit` сохраняет оценки распределений, необходимые для дальнейших вычислений. Исходные объекты уже не участвуют в формуле оценки нового примера: используются его признаки и сохранённые параметры модели.'
  kind: open
  reference: Во время обучения информация из выборки сводится к списку классов, log-prior классов и таблице условных log-вероятностей признаков. Для классификации нужны только эти параметры и вектор признаков нового объекта, поэтому повторно обращаться к обучающим примерам не требуется.
  id: 030-sostoyanie-modeli-2
  fingerprint: 7fe52ddb
