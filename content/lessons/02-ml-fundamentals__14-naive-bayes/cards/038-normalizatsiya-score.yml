- concept: разность двух log-баллов определяет их отношение весов и нормализованные вероятности
  question: Два класса получили log-баллы −8 и −10. Какова после экспоненцирования и нормализации вероятность класса с баллом −8?
  explanation: Вероятность равна exp(−8) / (exp(−8) + exp(−10)) ≈ 0,881. Более высокий log-балл получает большую вероятность, а обе вероятности после нормализации складываются в единицу.
  kind: numeric
  answer: 0.881
  tolerance: 0.002
  id: 038-normalizatsiya-score-1
  fingerprint: db4c4f0d
- concept: вычитание общего максимума обеспечивает численно устойчивую нормализацию и не меняет вероятности
  question: Классы получили log-баллы 920, 917 и 905. Как вычислить нормализованные вероятности без переполнения при экспоненцировании?
  explanation: Общий сдвиг всех log-баллов сокращается при нормализации, поэтому вероятности не меняются. После вычитания максимума крупнейший показатель экспоненты становится нулевым, что предотвращает переполнение.
  kind: choice
  options:
    - Сначала возвести исходные баллы в экспоненту, округлить веса, а затем поделить их на сумму
    - Разделить каждый log-балл на сумму всех log-баллов
    - Вычесть из каждого log-балла максимальный балл, экспоненцировать результаты и поделить веса на их сумму
  correct: 2
