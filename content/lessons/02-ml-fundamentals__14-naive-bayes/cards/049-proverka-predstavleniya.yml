- concept: на коротких текстах бинарное наличие слова может быть надёжнее малых и зашумлённых частот
  question: Почему BernoulliNB иногда превосходит MultinomialNB при классификации очень коротких сообщений?
  explanation: MultinomialNB учитывает величину счётчика, но на коротком тексте различия частот часто случайны. BernoulliNB отбрасывает эти различия и работает с бинарным присутствием слов.
  kind: open
  reference: В коротких сообщениях слова редко повторяются, поэтому их счётчики малы и дают мало надёжной информации о частоте. BernoulliNB использует более устойчивый для таких текстов факт наличия или отсутствия каждого слова.
