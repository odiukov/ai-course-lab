- concept: MultinomialNB не требует приведения признаков к единому масштабу
  question: Нужно ли применять стандартизацию только потому, что колонки неотрицательных признаков имеют разные типичные величины, если далее используется MultinomialNB? Объясни своими словами.
  explanation: Разный масштаб колонок сам по себе не требует стандартизации для MultinomialNB. Важно сохранить осмысленные неотрицательные счётчики или веса. При этом изменение масштаба может изменить вклад признака в балл класса, поэтому ненужное преобразование не является нейтральным.
  kind: open
  reference: Нет. MultinomialNB оценивает частоты или суммарные веса признаков по классам и не использует чувствительную к масштабу итеративную оптимизацию. Естественные неотрицательные значения можно оставить без стандартизации; центрирование даже способно сделать часть значений отрицательной и нарушить требования модели.
  id: 055-trebovaniya-k-vhodu-2
