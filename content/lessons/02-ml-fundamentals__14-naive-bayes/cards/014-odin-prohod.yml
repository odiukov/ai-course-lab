- concept: пакетное предсказание Naive Bayes можно векторизовать как матричную операцию
  question: Объясни, как вычислить оценки классов Naive Bayes сразу для пакета разреженных документов с помощью матриц.
  explanation: После обучения параметры уже сохранены. Для пакета документов суммирование вкладов признаков выражается умножением разреженной матрицы документов на матрицу параметров классов, что эффективно выполняется оптимизированными численными библиотеками.
  kind: open
  reference: Матрицу признаков документов умножают на матрицу сохранённых логарифмических оценок признаков для классов, после чего к каждому столбцу прибавляют логарифм prior соответствующего класса. Максимальная итоговая оценка задаёт предсказанный класс.
  id: 014-odin-prohod-2
