- concept: сохранение размерности после редукции обеспечивает корректный broadcasting по строкам
  question: Зачем при вычислении построчного максимума log-баллов сохранять свёрнутую ось с помощью keepdims=True?
  explanation: Сохранённая ось оставляет максимумы в форме столбца. Broadcasting тогда сопоставляет каждой строке её собственный максимум и распространяет его по столбцам классов.
  kind: choice
  options:
    - Чтобы получить столбец максимумов и вычесть максимум каждого объекта из всех его классов
    - Чтобы NumPy автоматически отсортировал классы по вероятности
    - Чтобы преобразовать log-баллы в целочисленный тип
