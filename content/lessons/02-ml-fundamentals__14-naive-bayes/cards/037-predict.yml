- concept: предсказание использует обученные параметры модели, не изменяя их
  question: Что должно произойти с обученными параметрами MultinomialNB после вызова predict(X)? Объясни почему.
  explanation: Обучение параметров происходит в fit. Вызов predict лишь использует class_log_prior_ и feature_log_prob_ для расчёта ответов, поэтому повторное обучение или изменение этих массивов не требуется.
