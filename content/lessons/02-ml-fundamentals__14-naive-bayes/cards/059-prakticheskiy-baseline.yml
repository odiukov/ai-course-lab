- concept: совпадение accuracy недостаточно для проверки эквивалентности двух реализаций классификатора
  question: Самописный Multinomial Naive Bayes и реализация из sklearn показали одинаковую accuracy. Какая дополнительная проверка убедительнее всего подтвердит корректность самописной модели?
  explanation: Одинаковая accuracy допускает разные предсказания и разные внутренние параметры. При одинаковых данных и настройках должны с небольшой численной погрешностью совпадать классы, log-prior, feature log-probabilities и итоговые метки.
  kind: choice
  options:
    - Сравнить порядок классов, log-prior, условные log-вероятности признаков и предсказания
    - Повторно вычислить только accuracy на той же выборке
    - Увеличивать alpha, пока обе модели не начнут предсказывать один класс
    - Сравнить только время обучения моделей
  correct: 0
  id: 059-prakticheskiy-baseline-1
  fingerprint: 10111d39
- concept: контролируемый эксперимент меняет один фактор при неизменной тестовой выборке
  question: Расположите действия для корректного сравнения нескольких значений сглаживания MultinomialNB.
  explanation: Постоянный train/test split делает результаты сопоставимыми, а изменение только alpha позволяет связать различие качества именно со сглаживанием. Если одновременно менять выборку или признаки, причина изменения метрики станет неоднозначной.
  kind: order
  items:
    - Один раз разделить данные на обучающую и тестовую части
    - Для каждого запуска менять только alpha
    - Обучать модель на одной и той же обучающей части
    - Оценивать все модели на неизменной тестовой части
    - Сопоставить результаты и выбрать alpha по отложенной оценке
  id: 059-prakticheskiy-baseline-2
  fingerprint: 4dcdba50
- concept: повторные стратифицированные подвыборки отделяют устойчивую зависимость качества от случайности состава малой выборки
  question: Почему при построении learning curve для Naive Bayes недостаточно по одному разу обучить модель на каждой выбранной величине train?
  explanation: Один набор может случайно содержать особенно показательные или, наоборот, трудные документы. Повторы оценивают разброс результата, а стратификация не позволяет изменению баланса классов маскироваться под эффект размера train.
  kind: open
  reference: На малых обучающих выборках результат сильно зависит от случайно попавших объектов. Нужно делать несколько подвыборок каждого размера, сохранять в них доли классов и агрегировать метрики; тогда видны среднее качество и его разброс, а случайно удачный набор не выглядит устойчивым преимуществом модели.
  id: 059-prakticheskiy-baseline-3
  fingerprint: 4700acf5
