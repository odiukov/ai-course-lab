- concept: в логарифмическом likelihood вклад слова умножается на число его появлений в документе
  question: Заполни коэффициент, с которым условная вероятность токена входит в логарифмический likelihood документа.
  explanation: x_v — число появлений токена v в документе. Поэтому повторяющийся токен несколько раз добавляет один и тот же вклад к оценке класса.
