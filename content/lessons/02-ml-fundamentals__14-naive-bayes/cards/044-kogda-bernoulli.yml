- concept: отсутствие характерного для класса признака уменьшает балл этого класса в Bernoulli Naive Bayes
  question: Объясни своими словами, почему отсутствие слова, которое обычно встречается в документах некоторого класса, служит свидетельством против этого класса в Bernoulli Naive Bayes.
  explanation: В балл класса входят оба возможных состояния каждого бинарного признака. Отсутствующее слово даёт вклад через вероятность отсутствия, и этот вклад особенно неблагоприятен, когда модель ожидала увидеть слово.
  kind: open
  reference: Bernoulli NB учитывает для каждого признака не только вероятность наличия, но и вероятность отсутствия. Если слово почти всегда присутствует в документах класса, вероятность его отсутствия мала, поэтому соответствующий логарифмический вклад заметно снижает балл класса.
  id: 044-kogda-bernoulli-2
  fingerprint: 86835cad
