- concept: универсального размера выборки для перехода от Naive Bayes к логистической регрессии не существует
  question: Можно ли заранее задать единый размер обучающей выборки, после которого в текстовой классификации всегда следует заменять Naive Bayes логистической регрессией? Объясни своими словами.
  explanation: 'Количество примеров само по себе не задаёт универсального порога. На практике сравнивают валидационное качество при разных объёмах обучающих данных: если Naive Bayes вышел на плато, а логистическая регрессия продолжает улучшаться, переход может быть оправдан.'
  kind: open
  reference: Нет. Точка смены лидера зависит от признакового представления, свойств и корреляций признаков, качества разметки и самой задачи. Выбирать момент перехода следует по качеству моделей на отложенных данных и их кривым обучения.
