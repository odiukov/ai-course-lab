- concept: отношение условных вероятностей одного слова показывает силу свидетельства в пользу одного класса относительно другого
  question: После сглаживания P(«акция» | спам) = 0.63, а P(«акция» | обычная почта) = 0.09. Во сколько раз появление слова «акция» вероятнее в спаме?
  explanation: 'Нужно сравнить вероятности одного и того же слова: 0.63 / 0.09 = 7. Это отношение характеризует свидетельство от слова, но итоговый выбор класса также зависит от других слов и априорных вероятностей.'
  kind: numeric
  answer: 7
  tolerance: 0.01
