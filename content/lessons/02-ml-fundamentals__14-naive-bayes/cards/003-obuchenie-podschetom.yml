- concept: накопленные счётчики позволяют обновлять Naive Bayes по новым размеченным данным без повторного обучения на всей выборке
  question: В обучающий набор добавили новое размеченное письмо. Объясните, как обновить мультиномиальный Naive Bayes, не обрабатывая заново старые письма.
  explanation: Счётчики классов, слов по классам и общего числа слов сохраняют всю информацию, необходимую для оценки параметров модели. Поэтому новое размеченное наблюдение добавляется простым обновлением этих статистик.
  kind: open
  reference: Нужно увеличить число документов соответствующего класса, добавить в счётчики этого класса вхождения слов из нового письма и обновить общее число токенов класса. После этого вероятности пересчитываются из обновлённых счётчиков; повторная оптимизация весов не нужна.
