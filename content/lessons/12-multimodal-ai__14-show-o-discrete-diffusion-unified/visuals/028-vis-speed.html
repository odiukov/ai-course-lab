<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Три семейства по числу проходов</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1b1f24;
    --muted: #5a6570;
    --axis: #8b95a1;
    --bar1: #c8503c;
    --bar2: #3d6fb4;
    --bar3: #2e8c62;
    --note: #7a4fb0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181d;
      --fg: #e6ebf0;
      --muted: #9aa5b1;
      --axis: #5c6773;
      --bar1: #e87a63;
      --bar2: #7aa5e0;
      --bar3: #5cc296;
      --note: #b892e6;
    }
  }
  html, body { margin: 0; padding: 0; }
  .wrap {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 10px 12px 12px;
    box-sizing: border-box;
  }
  h2 {
    font-size: 15px;
    margin: 0 0 6px;
    font-weight: 600;
  }
  svg { display: block; width: 100%; height: auto; max-height: 470px; }
  .fail { font-size: 13px; color: var(--muted); line-height: 1.5; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
</style>
</head>
<body>
<div class="wrap">
  <h2>Три семейства по числу проходов трансформера</h2>
  <div id="slot"></div>
</div>
<script>
(function () {
  var slot = document.getElementById('slot');
  try {
    // ---- данные схемы ----
    var DATA = [
      { name: 'Chameleon / Emu3', kind: 'авторегрессия по токенам', passes: 4096, low: 1024, label: '1024–4096 проходов', color: 'var(--bar1)' },
      { name: 'Transfusion',      kind: 'непрерывная диффузия',     passes: 20,   low: 20,   label: '~20 проходов',       color: 'var(--bar2)' },
      { name: 'Show-o',           kind: 'маскированная дискретная', passes: 16,   low: 16,   label: '~16 проходов',       color: 'var(--bar3)' }
    ];

    // ---- холст (литералы: viewBox, толщины, кегли, отступы подписей) ----
    var W = 900, H = 460;
    var FS = 14, FS_SMALL = 12, FS_BIG = 15;
    var PAD = 8, PAD2 = 16, LW = 2, LW_THIN = 1;

    // ---- одна система координат ----
    // ось X: логарифм числа проходов, ось Y: индекс полосы (сверху вниз)
    var origin = { x: 330, y: 60 };
    var scale  = { x: 118, y: 96 };
    function sx(x) { return origin.x + x * scale.x; }
    function sy(y) { return origin.y + y * scale.y; }

    var L10 = Math.LN10;
    function lg(v) { return Math.log(v) / L10; }

    var SVG = 'http://www.w3.org/2000/svg';
    function el(n, a) {
      var e = document.createElementNS(SVG, n);
      for (var k in a) e.setAttribute(k, a[k]);
      return e;
    }
    function txt(x, y, s, anchor, size, fill, weight) {
      var t = el('text', {
        x: x, y: y, 'text-anchor': anchor, 'font-size': size,
        fill: fill, 'dominant-baseline': 'middle'
      });
      if (weight) t.setAttribute('font-weight', weight);
      t.textContent = s;
      return t;
    }

    var svg = el('svg', {
      viewBox: '0 0 ' + W + ' ' + H,
      preserveAspectRatio: 'xMidYMid meet',
      role: 'img',
      'aria-label': 'Число проходов трансформера: Chameleon и Emu3 1024–4096, Transfusion ~20, Show-o ~16'
    });
    svg.appendChild(el('rect', { x: 0, y: 0, width: W, height: H, fill: 'var(--bg)' }));

    // ---- ось (шкала числа проходов, логарифмическая) ----
    var TICKS = [1, 10, 100, 1000, 4096];
    var axisY = DATA.length;                 // строка оси — сразу под последней полосой
    var xMin = lg(1), xMax = lg(4096);

    svg.appendChild(el('line', {
      x1: sx(xMin), y1: sy(axisY), x2: sx(xMax), y2: sy(axisY),
      stroke: 'var(--axis)', 'stroke-width': LW
    }));

    TICKS.forEach(function (v) {
      var x = sx(lg(v));
      svg.appendChild(el('line', {
        x1: x, y1: sy(axisY), x2: x, y2: sy(axisY + 0.09),
        stroke: 'var(--axis)', 'stroke-width': LW_THIN
      }));
      svg.appendChild(el('line', {
        x1: x, y1: sy(-0.45), x2: x, y2: sy(axisY),
        stroke: 'var(--axis)', 'stroke-width': LW_THIN,
        'stroke-dasharray': '2 5', opacity: 0.45
      }));
      svg.appendChild(txt(x, sy(axisY + 0.09) + PAD2, String(v), 'middle', FS_SMALL, 'var(--muted)'));
    });
    svg.appendChild(txt(sx(xMax), sy(axisY + 0.09) + PAD2 * 2 + PAD, 'проходов трансформера на картинку', 'end', FS_SMALL, 'var(--muted)'));

    // ---- полосы ----
    var half = 0.20; // полутолщина полосы в единицах оси Y

    DATA.forEach(function (d, i) {
      var yc = sy(i);
      var x0 = sx(xMin);
      var xLow = sx(lg(d.low));
      var xHi = sx(lg(d.passes));
      var yTop = sy(i - half), yBot = sy(i + half);

      // корпус полосы до нижней границы диапазона
      svg.appendChild(el('rect', {
        x: x0, y: yTop, width: xLow - x0, height: yBot - yTop,
        fill: d.color, opacity: 0.85
      }));
      // диапазон 1024–4096 — штриховкой посветлее
      if (xHi > xLow) {
        svg.appendChild(el('rect', {
          x: xLow, y: yTop, width: xHi - xLow, height: yBot - yTop,
          fill: d.color, opacity: 0.35
        }));
        svg.appendChild(el('line', {
          x1: xLow, y1: yTop, x2: xLow, y2: yBot,
          stroke: 'var(--bg)', 'stroke-width': LW
        }));
      }

      // название модели — слева от начала полосы, anchor=end
      svg.appendChild(txt(x0 - PAD2, yc - PAD, d.name, 'end', FS_BIG, 'var(--fg)', '600'));
      svg.appendChild(txt(x0 - PAD2, yc + PAD2 - PAD / 2, d.kind, 'end', FS_SMALL, 'var(--muted)'));

      // число проходов — справа от конца полосы, anchor=start
      svg.appendChild(txt(xHi + PAD2 - PAD / 2, yc, d.label, 'start', FS, d.color, '600'));
    });

    // ---- выноска «в 64 раза меньше вызовов сети» ----
    var yNote = DATA.length + 0.85;
    var xA = sx(lg(16));    // Show-o
    var xB = sx(lg(1024));  // нижняя граница Chameleon

    svg.appendChild(el('line', {
      x1: xA, y1: sy(yNote), x2: xB, y2: sy(yNote),
      stroke: 'var(--note)', 'stroke-width': LW
    }));
    [[xA, 1], [xB, -1]].forEach(function (p) {
      var x = p[0], dir = p[1];
      var head = el('polygon', {
        points: [
          x + ',' + sy(yNote),
          (x + dir * (sx(0.11) - sx(0))) + ',' + sy(yNote - 0.075),
          (x + dir * (sx(0.11) - sx(0))) + ',' + sy(yNote + 0.075)
        ].join(' '),
        fill: 'var(--note)'
      });
      svg.appendChild(head);
      svg.appendChild(el('line', {
        x1: x, y1: sy(yNote - 0.22), x2: x, y2: sy(yNote + 0.22),
        stroke: 'var(--note)', 'stroke-width': LW_THIN, opacity: 0.7
      }));
    });

    // подпись у середины отрезка, над ним
    svg.appendChild(txt((xA + xB) / 2, sy(yNote) - PAD2 - PAD / 2,
      '1024 против 16 — в 64 раза меньше вызовов сети', 'middle', FS, 'var(--note)', '600'));
    svg.appendChild(txt((xA + xB) / 2, sy(yNote) + PAD2 + PAD / 2,
      '4096 против 16 — в 256 раз', 'middle', FS_SMALL, 'var(--muted)'));

    slot.appendChild(svg);
  } catch (e) {
    slot.innerHTML = '<p class="fail">Схема должна была показать три полосы длиной по числу проходов трансформера на одну картинку: ' +
      'Chameleon / Emu3 — 1024–4096 проходов (авторегрессия по токенам), Transfusion — ~20 (непрерывная диффузия), ' +
      'Show-o — ~16 (маскированная дискретная диффузия). И выноску между 16 и 1024: в 64 раза меньше вызовов сети ' +
      '(против 4096 — в 256 раз).</p>';
  }
})();
</script>
</body>
</html>
