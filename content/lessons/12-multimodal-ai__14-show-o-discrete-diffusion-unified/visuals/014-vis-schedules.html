<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mask_ratio(t) при T = 8: косинус и прямая</title>
<style>
  :root{
    --bg:#fbfbfd; --fg:#1b2130; --muted:#5c6577;
    --grid:#dadee8; --axis:#394154;
    --cos:#b4400a; --lin:#1a49cf;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#111420; --fg:#e9edf6; --muted:#a3adc0;
      --grid:#2a3040; --axis:#8d97ad;
      --cos:#fb9a4b; --lin:#7fa6ff;
    }
  }
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
  .wrap{max-width:720px;margin:0 auto;padding:10px 12px 14px}
  h2{font-size:15px;font-weight:600;margin:0 0 4px}
  svg{display:block;width:100%;height:auto;background:var(--bg)}
  text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:var(--fg)}
  .mut{fill:var(--muted)}
  .cosT{fill:var(--cos)} .linT{fill:var(--lin)}
  .grid{stroke:var(--grid);fill:none}
  .axis{stroke:var(--axis);fill:none}
  .axf{fill:var(--axis);stroke:none}
  .guide{stroke:var(--muted);fill:none;stroke-dasharray:4 4}
  .cos{stroke:var(--cos);fill:none;stroke-linecap:round}
  .lin{stroke:var(--lin);fill:none;stroke-linecap:round}
  .dcos{stroke:var(--cos)} .dlin{stroke:var(--lin)} .dmut{stroke:var(--muted)}
  #fb{display:none;color:var(--muted);margin:0}
</style>
</head>
<body>
<div class="wrap">
  <h2>mask_ratio(t) при T = 8, сетка из 16 токенов: косинус против прямой</h2>
  <svg id="d" viewBox="0 0 560 404" role="img"
       aria-label="Два расписания маскирования: косинус и прямая"></svg>
  <p id="fb">Схема: обе кривые mask_ratio(t) при T = 8 выходят из доли 1.0 при t = 0
  и приходят в 0 при t = 8. На t = 4 косинус держит 0.707 — 11 из 16 закрыто,
  прямая уже спустилась до 0.5 — 8 из 16.</p>
</div>
<script>
(function(){
try{
  /* ---- данные схемы (единственные литералы предметной области) ---- */
  var D = {
    T: 8, grid: 16, samples: 64,
    tEnd: 8.6, yEnd: 1.12,
    tTicks: [0, 2, 4, 6, 8],
    yTicks: [{v:1, s:"1.0"}, {v:0.707, s:"0.707"}, {v:0.5, s:"0.5"}, {v:0, s:"0"}],
    mark: 4,
    tick: {x:0.022, y:0.085},
    arrow: {dt:0.28, dy:0.03, dx:0.16, dh:0.055},
    at: {cos:2, lin:6, linTail:0.1, cosLbl:0.924, linLbl:0.5}
  };

  /* ---- один origin, один scale, одна пара sx/sy ---- */
  var origin = {x:66, y:352}, scale = {x:56, y:292};
  function sx(x){ return origin.x + x * scale.x; }
  function sy(y){ return origin.y - y * scale.y; }

  /* ---- формулы урока ---- */
  function cosR(t){ return Math.cos(Math.PI * t / (2 * D.T)); }
  function linR(t){ return 1 - t / D.T; }

  var NS = "http://www.w3.org/2000/svg", svg = document.getElementById("d");
  function add(tag, a, txt){
    var e = document.createElementNS(NS, tag);
    for (var k in a) e.setAttribute(k, a[k]);
    if (txt != null) e.textContent = txt;
    svg.appendChild(e); return e;
  }
  function seg(x1,y1,x2,y2,cls,w,extra){
    var a = {x1:sx(x1), y1:sy(y1), x2:sx(x2), y2:sy(y2), "class":cls, "stroke-width":w};
    for (var k in (extra||{})) a[k] = extra[k];
    return add("line", a);
  }
  function dot(t,y,cls){ return seg(t,y,t,y,cls,9,{"stroke-linecap":"round"}); }
  function curve(fn, cls){
    var p = "", i, t;
    for (i = 0; i <= D.samples; i++){
      t = i * D.T / D.samples;
      p += (i ? " L" : "M") + sx(t) + " " + sy(fn(t));
    }
    return add("path", {d:p, "class":cls, "stroke-width":2.4});
  }
  function tri(pts, cls){
    return add("polygon", {points: pts.map(function(p){
      return sx(p[0]) + "," + sy(p[1]);
    }).join(" "), "class":cls});
  }
  function label(t, y, dx, dy, anchor, cls, size, txt){
    return add("text", {x:sx(t)+dx, y:sy(y)+dy, "text-anchor":anchor,
                        "class":cls, "font-size":size}, txt);
  }

  /* ---- сетка по горизонталям ---- */
  D.yTicks.forEach(function(k){ seg(0, k.v, D.T, k.v, "grid", 1); });

  /* ---- оси со стрелками ---- */
  seg(0, 0, D.tEnd, 0, "axis", 1.6);
  seg(0, 0, 0, D.yEnd, "axis", 1.6);
  tri([[D.tEnd,0], [D.tEnd-D.arrow.dt, D.arrow.dy], [D.tEnd-D.arrow.dt, -D.arrow.dy]], "axf");
  tri([[0,D.yEnd], [-D.arrow.dx, D.yEnd-D.arrow.dh], [D.arrow.dx, D.yEnd-D.arrow.dh]], "axf");

  /* ---- засечки и их подписи ---- */
  D.tTicks.forEach(function(t){
    seg(t, 0, t, -D.tick.x, "axis", 1.6);
    label(t, 0, 0, 20, "middle", "mut", 12.5, String(t));
  });
  D.yTicks.forEach(function(k){
    seg(0, k.v, -D.tick.y, k.v, "axis", 1.6);
    label(0, k.v, -9, 4, "end", "mut", 12.5, k.s);
  });

  /* ---- названия осей: хвост оси y сверху, ось t снизу по центру ---- */
  label(0, D.yEnd, 9, -9, "start", "mut", 12.5, "доля закрытых токенов (из 16)");
  label(D.mark, 0, 0, 40, "middle", "mut", 12.5, "шаг t, всего T = 8");

  /* ---- вертикальный ориентир на середине ---- */
  seg(D.mark, 0, D.mark, 1, "guide", 1.2);

  /* ---- сами кривые ---- */
  curve(linR, "lin");
  curve(cosR, "cos");

  /* ---- общие концы ---- */
  dot(0, 1, "dmut");
  dot(D.T, 0, "dmut");

  /* ---- точки на t = 4 и их подписи: одна вверх-вправо, другая вниз-влево ---- */
  dot(D.mark, cosR(D.mark), "dcos");
  dot(D.mark, linR(D.mark), "dlin");
  label(D.mark, D.at.cosLbl, 14, 30, "start", "cosT", 13, "0.707 (11 из 16 закрыто)");
  label(D.mark, D.at.linLbl, -14, 22, "end", "linT", 13, "0.5 (8 из 16 закрыто)");

  /* ---- метки кривых: косинус над своей кривой, прямая под своей ---- */
  label(D.at.cos, cosR(D.at.cos), 10, -10, "start", "cosT", 13, "косинус");
  label(D.at.lin, D.at.linTail, 12, 6, "start", "linT", 13, "прямая");
}catch(e){
  var s = document.getElementById("d"), f = document.getElementById("fb");
  if (s) s.style.display = "none";
  if (f) f.style.display = "block";
}
})();
</script>
</body>
</html>
