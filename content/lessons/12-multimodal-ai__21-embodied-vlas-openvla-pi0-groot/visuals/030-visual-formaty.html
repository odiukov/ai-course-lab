<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Три формата рядом</title>
<style>
  :root{
    --bg:#fbfaf7; --fg:#1e232b; --muted:#5f6a78; --axis:#8b95a3;
    --c1:#c0562f; --c2:#2f7d6b; --c3:#4a5ec0; --grid:#e3e0d8;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14181e; --fg:#e9edf2; --muted:#9aa6b4; --axis:#5c6673;
      --c1:#e8875c; --c2:#5fc0a8; --c3:#8b9bec; --grid:#242a33;
    }
  }
  html,body{margin:0}
  .wrap{background:var(--bg);color:var(--fg);padding:10px 12px 12px;
    font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;box-sizing:border-box}
  h2{margin:0 0 6px;font-size:15px;font-weight:600}
  svg{display:block;width:100%;height:auto;max-height:470px}
  text{font:400 12px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg)}
  .mut{fill:var(--muted);font-size:11px}
  .big{font-size:13px;font-weight:600}
  .fail{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h2>Три формата действий: сколько токенов на 30 шагов управления</h2>
  <div id="host"></div>
  <noscript class="fail">Схема: три полосы токенов на 30 шагов управления — дискретные бины 300 токенов, FAST 10 токенов, flow matching 0 токенов (мимо словаря).</noscript>
</div>
<script>
(function(){
  var host=document.getElementById("host");
  try{
    // ---- данные схемы -------------------------------------------------
    var STEPS=30;
    var ROWS=[
      {key:"bins", name:"Дискретные бины", per:10,  total:300, note:"10 токенов × 30 шагов", col:"var(--c1)"},
      {key:"fast", name:"FAST",            per:0.3, total:10,  note:"~10 токенов на 30 шагов", col:"var(--c2)"},
      {key:"flow", name:"Flow matching",   per:0,   total:0,   note:"мимо словаря", col:"var(--c3)"}
    ];

    // ---- один origin, один scale --------------------------------------
    var origin={x:196,y:56}, scale={x:0.79,y:66};   // x: 1 токен, y: 1 ряд
    function sx(x){ return origin.x + x*scale.x; }
    function sy(y){ return origin.y + y*scale.y; }

    var VB={w:760,h:300};
    var LW=1.4, FS=12, PAD=8;

    var svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("viewBox","0 0 "+VB.w+" "+VB.h);
    svg.setAttribute("preserveAspectRatio","xMidYMid meet");
    svg.setAttribute("role","img");

    function el(n,a){var e=document.createElementNS(svg.namespaceURI,n);
      for(var k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
    function txt(x,y,s,cls,anchor){var t=el("text",{x:x,y:y,"text-anchor":anchor||"start",
      "font-size":FS}); if(cls)t.setAttribute("class",cls); t.textContent=s; return t;}

    var AX_Y=2.62;              // ряд, на котором лежит ось токенов
    var TICKS=[0,10,300];

    // ---- ось токенов ---------------------------------------------------
    el("line",{x1:sx(0),y1:sy(AX_Y),x2:sx(300),y2:sy(AX_Y),
      stroke:"var(--axis)","stroke-width":LW});
    TICKS.forEach(function(v){
      el("line",{x1:sx(v),y1:sy(AX_Y),x2:sx(v),y2:sy(AX_Y+0.09),
        stroke:"var(--axis)","stroke-width":LW});
      txt(sx(v),sy(AX_Y+0.09)+PAD+FS-3,String(v),"mut","middle");
      if(v>0)el("line",{x1:sx(v),y1:sy(-0.30),x2:sx(v),y2:sy(AX_Y),
        stroke:"var(--grid)","stroke-width":LW,"stroke-dasharray":"3 4"});
    });
    txt(sx(300),sy(AX_Y+0.09)+PAD+2*FS+2,"токенов на 30 шагов","mut","end");

    // ---- начало координат ---------------------------------------------
    el("circle",{cx:sx(0),cy:sy(AX_Y),r:2.6,fill:"var(--axis)"});
    el("line",{x1:sx(0),y1:sy(-0.30),x2:sx(0),y2:sy(AX_Y),
      stroke:"var(--axis)","stroke-width":LW});

    // ---- полосы --------------------------------------------------------
    var BH=0.30;                                     // высота полосы в ряд-единицах
    ROWS.forEach(function(r,i){
      var y=i;
      // подпись формата — слева от нуля, anchor end
      txt(sx(0)-PAD, sy(y)+4, r.name, "big", "end");
      // пояснение — под названием, тоже слева
      txt(sx(0)-PAD, sy(y)+4+FS+4, r.note, "mut", "end");

      if(r.total>0){
        el("rect",{x:sx(0),y:sy(y-BH/2),width:sx(r.total)-sx(0),
          height:sy(BH/2)-sy(-BH/2),fill:r.col,rx:2});
        // итог — справа от полосы
        txt(sx(r.total)+PAD, sy(y)+4, r.total+" токенов", "big", "start");
        // на шаг — над полосой
        txt(sx(r.total/2), sy(y-BH/2)-PAD, r.per+" на шаг", "mut", "middle");
      } else {
        // нулевая полоса: поток чисел из нуля, без словаря
        var y0=sy(y);
        el("line",{x1:sx(0),y1:y0,x2:sx(46),y2:y0,stroke:r.col,
          "stroke-width":LW+1.6,"stroke-dasharray":"2 7","stroke-linecap":"round"});
        el("circle",{cx:sx(0),cy:y0,r:4.2,fill:r.col});
        txt(sx(52)+PAD, sy(y)+4, "0 токенов", "big", "start");
        txt(sx(23), sy(y-BH/2)-PAD, "0 на шаг", "mut", "middle");
      }
    });

    // ---- стрелка «мимо словаря»: хвост у flow, подпись у хвоста --------
    var ax0=sx(150), ax1=sx(258), ay=sy(2.30);
    el("line",{x1:ax0,y1:ay,x2:ax1,y2:ay,stroke:"var(--c3)","stroke-width":LW+0.4});
    el("polygon",{points:[sx(258),sy(2.30),sx(248),sy(2.30-0.06),sx(248),sy(2.30+0.06)]
      .reduce(function(a,v,i,arr){return i%2?a:(a+(a?" ":"")+v+","+arr[i+1]);},""),
      fill:"var(--c3)"});
    txt(ax0-PAD, ay+4, "π₀: числа напрямую,", "mut", "end");
    txt(ax0-PAD, ay+4+FS+3, "токенизации нет", "mut", "end");
    txt(ax1, ay-PAD, "словарь не участвует", "mut", "end");

    // ---- легенда: родословная ------------------------------------------
    var ly=sy(AX_Y+0.44);
    txt(sx(0), ly, "RT-2 (3–5 Гц)  →  OpenVLA  →  FAST (×3–5)  →  π₀ (50 шагов за 5 проходов)  →  GR00T",
      "mut", "start");
    txt(sx(0)-PAD, ly, "родословная:", "mut", "end");

    host.appendChild(svg);
  }catch(e){
    host.innerHTML='<p class="fail">Схема не построилась. Она должна показывать три полосы токенов на 30 шагов управления: дискретные бины — 300 токенов (10 на шаг), FAST — 10 токенов (~0.3 на шаг), flow matching — 0 токенов, потому что выход идёт мимо словаря.</p>';
  }
})();
</script>
</body>
</html>
