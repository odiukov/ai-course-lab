<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Водитель и штурман</title>
<style>
  :root{
    --bg:#fbfbfa; --fg:#1c1b19; --muted:#6b6864;
    --s2:#b45309; --s1:#0e7490; --grid:#d9d5cf;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16181c; --fg:#e9e6e1; --muted:#9c9791;
      --s2:#f0a838; --s1:#4dd0e1; --grid:#33373d;
    }
  }
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:900px;margin:0 auto;padding:8px 4px 10px;}
  h2{font-size:15px;margin:0 0 2px;font-weight:650;}
  .sub{font-size:12px;color:var(--muted);margin:0 0 4px;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .fail{font-size:13px;color:var(--muted);padding:8px 2px;line-height:1.5;}
  text{font-family:inherit;}
</style>
</head>
<body>
<div class="wrap">
  <h2>Водитель и штурман: одна секунда работы</h2>
  <p class="sub">Штурман говорит раз в секунду, водитель подруливает сто раз.</p>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    // ---- данные схемы ----
    var DATA = {
      tEnd: 1,                 // секунда
      s2: { hz: 1,  y: 3, label: 'System 2 — большая VLM, 1 Гц' },
      s1: { hzLo: 50, hzHi: 100, y: 1, label: 'System 1 — голова действий, 50-100 Гц' },
      ticksT: [0, 0.25, 0.5, 0.75, 1],
      axisY: 0,
      shown: 50                // рисуем нижнюю границу: 50 тактов за секунду
    };

    // ---- один origin, один scale ----
    var ORIGIN = { x: 120, y: 250 };
    var SCALE  = { x: 700, y: 52 };
    function sx(x){ return ORIGIN.x + x * SCALE.x; }
    function sy(y){ return ORIGIN.y - y * SCALE.y; }

    // ---- литералы: холст, отступы подписей, толщины, шрифт ----
    var VB_W = 900, VB_H = 330;
    var PAD_LBL = 10, PAD_SM = 6, HEAD = 7;
    var LW = 2, LW_THIN = 1.2, FS = 13, FS_SM = 11.5;

    var NS = 'http://www.w3.org/2000/svg';
    function el(n, a){ var e = document.createElementNS(NS, n);
      for(var k in a) e.setAttribute(k, a[k]); return e; }
    function txt(x, y, s, anchor, cls, size){
      var t = el('text', {x:x, y:y, 'text-anchor':anchor||'middle',
        fill:'var(--'+(cls||'fg')+')', 'font-size':(size||FS)});
      t.textContent = s; return t;
    }

    var svg = el('svg', {viewBox:'0 0 '+VB_W+' '+VB_H,
      preserveAspectRatio:'xMidYMid meet', role:'img',
      'aria-label':'За одну секунду System 2 выдаёт одну подцель, System 1 — от 50 до 100 команд суставам'});

    // ---- ось времени ----
    svg.appendChild(el('line', {x1:sx(0), y1:sy(DATA.axisY), x2:sx(DATA.tEnd), y2:sy(DATA.axisY),
      stroke:'var(--grid)', 'stroke-width':LW}));
    DATA.ticksT.forEach(function(t){
      svg.appendChild(el('line', {x1:sx(t), y1:sy(DATA.axisY), x2:sx(t), y2:sy(DATA.axisY) - PAD_SM,
        stroke:'var(--grid)', 'stroke-width':LW_THIN}));
    });
    svg.appendChild(txt(sx(0), sy(DATA.axisY) + PAD_LBL + FS_SM, '0 с', 'middle', 'muted', FS_SM));
    svg.appendChild(txt(sx(DATA.tEnd), sy(DATA.axisY) + PAD_LBL + FS_SM, '1 с', 'middle', 'muted', FS_SM));
    svg.appendChild(txt(sx(DATA.tEnd / 2), sy(DATA.axisY) + PAD_LBL + FS_SM * 2.4,
      'время, одна секунда', 'middle', 'muted', FS_SM));

    // ---- дорожка System 2: одна подцель на всю секунду ----
    var y2 = DATA.s2.y;
    svg.appendChild(el('line', {x1:sx(0), y1:sy(y2), x2:sx(DATA.tEnd), y2:sy(y2),
      stroke:'var(--s2)', 'stroke-width':LW, 'stroke-dasharray':'6 5', opacity:0.55}));
    // один импульс в t=0
    svg.appendChild(el('line', {x1:sx(0), y1:sy(y2), x2:sx(0), y2:sy(y2 + 0.7),
      stroke:'var(--s2)', 'stroke-width':LW + 1}));
    svg.appendChild(el('circle', {cx:sx(0), cy:sy(y2 + 0.7), r:HEAD * 0.6, fill:'var(--s2)'}));
    svg.appendChild(txt(sx(0) - PAD_LBL, sy(y2 + 0.7), '1 подцель', 'end', 's2', FS));
    svg.appendChild(txt(sx(0) + PAD_LBL, sy(y2) - PAD_SM,
      '«возьми кружку за ручку» — держится всю секунду', 'start', 'muted', FS_SM));
    svg.appendChild(txt(sx(DATA.tEnd) + PAD_LBL, sy(y2), DATA.s2.label, 'start', 's2', FS_SM));

    // ---- дорожка System 1: 50 тактов за секунду ----
    var y1 = DATA.s1.y, n = DATA.shown;
    svg.appendChild(el('line', {x1:sx(0), y1:sy(y1), x2:sx(DATA.tEnd), y2:sy(y1),
      stroke:'var(--s1)', 'stroke-width':LW_THIN, opacity:0.45}));
    for(var i = 0; i < n; i++){
      var t = i / n;
      svg.appendChild(el('line', {x1:sx(t), y1:sy(y1), x2:sx(t), y2:sy(y1 + 0.55),
        stroke:'var(--s1)', 'stroke-width':LW_THIN}));
    }
    svg.appendChild(txt(sx(0) - PAD_LBL, sy(y1 + 0.55), '50-100 команд', 'end', 's1', FS));
    svg.appendChild(txt(sx(DATA.tEnd) + PAD_LBL, sy(y1), DATA.s1.label, 'start', 's1', FS_SM));

    // ---- стрелка от подцели вниз к дорожке System 1 (подпись у хвоста) ----
    var xa = DATA.tEnd * 0.5;
    svg.appendChild(el('line', {x1:sx(xa), y1:sy(y2) - PAD_SM * 0, x2:sx(xa), y2:sy(y1 + 0.55) + HEAD,
      stroke:'var(--muted)', 'stroke-width':LW_THIN, 'stroke-dasharray':'3 4'}));
    svg.appendChild(el('polygon', {points:
      sx(xa) + ',' + sy(y1 + 0.55) + ' ' +
      (sx(xa) - HEAD * 0.7) + ',' + (sy(y1 + 0.55) - HEAD) + ' ' +
      (sx(xa) + HEAD * 0.7) + ',' + (sy(y1 + 0.55) - HEAD),
      fill:'var(--muted)'}));
    svg.appendChild(txt(sx(xa) + PAD_SM, sy(y2) - PAD_SM * 0 + FS_SM,
      'та же строчка задания', 'start', 'muted', FS_SM));

    // ---- легенда под схемой ----
    svg.appendChild(txt(sx(0), sy(DATA.axisY) + PAD_LBL + FS_SM * 4.2,
      'На 1 подцель приходится 50-100 циклов управления: 1 Гц против 50-100 Гц.',
      'start', 'fg', FS_SM));

    host.appendChild(svg);
  }catch(e){
    var d = document.createElement('div');
    d.className = 'fail';
    d.textContent = 'Схема не построилась. Она показывает две дорожки времени за одну секунду: '
      + 'System 2 (1 Гц) выдаёт ровно одну подцель «возьми кружку за ручку» и держит её всю секунду, '
      + 'а System 1 (50-100 Гц) успевает выдать за то же время от 50 до 100 наборов команд суставам. '
      + 'То есть на одну подцель приходится 50-100 циклов управления.';
    host.appendChild(d);
  }
})();
</script>
</body>
</html>
