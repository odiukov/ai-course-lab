- concept: поэлементное сложение с позиционными эмбеддингами сохраняет форму последовательности
  question: Последовательность токенов и таблица позиционных эмбеддингов имеют одинаковую форму `(L, d_model)`. Что произойдёт с формой после корректного добавления позиций?
  explanation: Позиционные эмбеддинги не присоединяют как новые строки или признаки, а складывают с токенами поэлементно. Поэтому для ViT вход и результат имеют форму 197 × d_model.
