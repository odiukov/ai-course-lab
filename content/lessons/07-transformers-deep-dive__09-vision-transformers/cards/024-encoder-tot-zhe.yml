- concept: стандартный трансформерный энкодер не зависит от модальности токенов при соблюдении входного интерфейса
  question: Почему реализацию энкодера BERT можно без изменения внутренних блоков применить к патч-эмбеддингам изображения?
  explanation: Стандартный трансформерный энкодер работает с последовательностью векторов фиксированной ширины. Источник этих векторов ему неизвестен, поэтому после подготовки патч-токенов можно использовать те же LayerNorm, Self-Attention, MLP и остаточные связи, что и в BERT.
  kind: choice
  options:
    - Энкодер получает последовательность векторов нужной ширины и не учитывает, были они получены из слов или из патчей
    - Self-Attention автоматически преобразует каждый патч в свёрточную карту признаков
    - Позиционные эмбеддинги превращают стандартные блоки BERT в специализированные зрительные слои
    - MLP внутри каждого блока восстанавливает исходные пиксели перед обработкой
  correct: 0
  id: 024-encoder-tot-zhe-1
  fingerprint: c7109b00
- concept: порядок операций и остаточных связей в pre-LayerNorm блоке трансформерного энкодера
  question: Расположите операции одного блока энкодера ViT в порядке выполнения.
  explanation: Блок имеет структуру LayerNorm → Self-Attention → остаточное сложение → LayerNorm → MLP → остаточное сложение. Каждая остаточная связь обходит только соответствующую ей подчасть.
  kind: order
  items:
    - Нормализовать вход блока и передать результат в Self-Attention
    - Прибавить выход Self-Attention к исходному входу блока
    - Нормализовать полученную сумму и передать результат в MLP
    - Прибавить выход MLP к входу этой MLP-подчасти
  id: 024-encoder-tot-zhe-2
  fingerprint: fc01ca52
