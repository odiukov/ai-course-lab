- concept: кратный рост числа параметров может давать лишь небольшой прирост точности
  question: В семействе моделей число параметров выросло с 48 млн до 288 млн, а точность — с 71% до 76%. Объясни своими словами, что это говорит об эффективности масштабирования.
  explanation: Рост с 48 млн до 288 млн — шестикратный, а изменение точности с 71% до 76% составляет только пять процентных пунктов. Поэтому кратное увеличение модели не означает пропорционального улучшения качества.
  kind: open
  reference: 'Число параметров увеличилось в шесть раз, тогда как точность выросла лишь на пять процентных пунктов. Масштабирование даёт убывающую отдачу: вычислительная и параметрическая стоимость растёт гораздо быстрее качества.'
