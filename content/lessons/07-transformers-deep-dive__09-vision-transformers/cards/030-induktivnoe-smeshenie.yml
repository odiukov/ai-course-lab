- concept: self-supervised предобучение компенсирует высокую потребность ViT в размеченных данных
  question: Объясните своими словами, почему self-supervised предобучение на большой коллекции неразмеченных изображений особенно полезно для Vision Transformer.
  explanation: Ранним ViT для конкуренции со свёрточными сетями требовались огромные размеченные наборы. Сильный self-supervised претрейн переносит основную часть обучения визуальным закономерностям на доступные неразмеченные изображения.
  kind: open
  reference: ViT не получает важные свойства изображений в виде жёстких архитектурных ограничений и должен освоить их из примеров. Self-supervised обучение позволяет извлечь пространственные и семантические закономерности из большого объёма изображений без ручной разметки, после чего для конкретной задачи требуется меньше размеченных данных.
  id: 030-induktivnoe-smeshenie-2
