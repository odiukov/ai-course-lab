- concept: вложенные циклы задают построчный порядок координат патчей
  question: 'Какая структура обхода создаёт координаты патчей построчно: каждый ряд слева направо, затем переход к следующему ряду?'
  explanation: Внешний цикл фиксирует ряд, а внутренний последовательно проходит все патчи этого ряда. Для изображения 224 × 224 с патчами 16 × 16 это даёт сначала весь верхний ряд, а последним — патч с началом в (208, 208).
  kind: choice
  options:
    - Внешний цикл перебирает верхнюю координату сверху вниз, внутренний — левую координату слева направо
    - Внешний цикл перебирает левую координату слева направо, внутренний — верхнюю координату сверху вниз
    - Обе координаты перебираются независимо, а патчи добавляются в случайном порядке
  correct: 0
  id: 005-patch-grid-1
  fingerprint: 181ce0ad
- concept: делимость стороны изображения на размер патча необходима для полного покрытия без потери края
  question: Почему функция построения сетки неперекрывающихся квадратных патчей должна отклонить изображение, сторона которого не делится на размер патча?
  explanation: Например, при стороне 225 и патче 16 полные патчи покрывают только 224 пикселя по каждой оси. Проверка делимости не позволяет незаметно отбросить оставшуюся полосу.
  kind: open
  reference: Без делимости у края останется полоса, которую нельзя покрыть целым патчем заданного размера. Если цикл просто остановится перед ней, часть изображения будет молча потеряна, поэтому функция должна явно сообщить об ошибке.
  id: 005-patch-grid-2
  fingerprint: 1049d0f4
