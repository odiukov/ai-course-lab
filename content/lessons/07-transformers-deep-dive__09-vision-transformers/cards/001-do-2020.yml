- concept: локальность и разделение весов как индуктивные предположения свёрточных сетей
  question: Какие предположения о структуре изображений заранее заложены в стандартную свёртку?
  explanation: Ограниченное поле свёртки задаёт локальность, а применение одного фильтра по всему изображению разделяет веса между позициями. Эти свойства встроены в архитектуру CNN, а не приобретаются только из обучающих данных.
  kind: choice
  options:
    - Близкие пиксели особенно связаны, а один детектор признака полезен в разных областях изображения
    - Каждый пиксель независим, а для каждой области изображения нужен отдельный детектор
    - Все пиксели сразу сравниваются друг с другом без каких-либо ограничений
    - Положение каждого объекта заранее известно и не меняется между изображениями
  correct: 0
  id: 001-do-2020-1
  fingerprint: 15d255c5
- concept: отказ ViT от обязательных свёрточных индуктивных предположений
  question: Объясните своими словами, что архитектурно изменилось, когда для распознавания изображений вместо CNN начали применять Vision Transformer без свёрток.
  explanation: 'Работа Dosovitskiy и соавторов показала, что свёртки не являются обязательной основой компьютерного зрения: изображение можно представить последовательностью патчей и обработать обычным энкодером трансформера. Цена более слабых встроенных предположений — повышенная потребность в масштабе данных и вычислений.'
  kind: open
  reference: CNN заранее ограничивает обработку локальными областями и использует одни и те же фильтры во всех позициях. Vision Transformer превращает изображение в последовательность патчей и позволяет механизму внимания выучить связи между ними, не задавая свёрточную локальность и разделение весов как обязательное правило.
  id: 001-do-2020-2
  fingerprint: f34b1010
