  fingerprint: 5207041a
- concept: замороженный бэкбон сохраняет фиксированное отображение изображения в признаки, тогда как выход головы меняется
  question: Одно и то же изображение подают в модель до и после нескольких обновлений обучаемой головы. Бэкбон заморожен, предобработка и режим его работы не меняются. Что произойдёт?
  explanation: Замороженный бэкбон реализует фиксированное отображение изображения в эмбеддинг. Его выход не меняется, но обучаемая голова по-новому преобразует этот эмбеддинг, поэтому логиты могут стать другими.
  kind: choice
  options:
    - Изменится только вектор признаков бэкбона, а логиты останутся прежними
    - Изменятся и вектор признаков бэкбона, и логиты
    - Не изменятся ни вектор признаков, ни логиты
    - Вектор признаков бэкбона останется прежним, а логиты могут измениться
  correct: 3
  id: 035-zamorozit-backbone-2
