- concept: обучаемые и синусоидальные позиционные эмбеддинги различаются способом получения их значений
  question: Чем обучаемые позиционные эмбеддинги принципиально отличаются от синусоидальных?
  explanation: Обучаемая таблица является частью параметров модели. Синусоидальный код детерминированно вычисляется из координат и не обновляется градиентным спуском.
  kind: choice
  options:
    - Обучаемые эмбеддинги обновляются оптимизатором, а синусоидальные вычисляются по фиксированной формуле
    - Синусоидальные эмбеддинги зависят от содержимого изображения, а обучаемые — только от координат
    - Обучаемые эмбеддинги применимы только к служебному токену
    - Синусоидальные эмбеддинги заменяют линейную проекцию патчей
