- concept: маскирование патчей предотвращает тривиальное копирование целевого представления при самоконтролируемом предобучении
  question: Объясни своими словами, зачем скрывать часть патчей, если энкодер обучают предсказывать их представления.
  explanation: Цель такого предобучения — научить энкодер извлекать структуру изображения из контекста, а не выполнять тождественное преобразование доступного целевого патча.
  kind: open
  reference: Без маскирования модель могла бы получить представление целевого патча непосредственно из его пикселей и научиться почти копировать вход. Маскирование заставляет восстанавливать скрытое представление по контексту видимых патчей.
  id: 038-itog-3
  fingerprint: ae2fab19
