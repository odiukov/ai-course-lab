- concept: параметры независимых блоков энкодера суммируются по слоям, а общие компоненты ViT учитываются однократно
  question: Почему при подсчёте параметров ViT стоимость энкодерного блока умножают на layers, а проекцию патчей, CLS-токен, позиционные эмбеддинги и классификационную голову — нет?
  explanation: 'Число применений операции не определяет число параметров. Важно, разделяются ли веса: у разных энкодерных слоёв веса независимы, а входные компоненты и голова существуют в единственном экземпляре.'
  kind: open
  reference: Каждый слой энкодера является отдельным экземпляром блока со своими обучаемыми матрицами и нормализациями, поэтому его параметры повторяются layers раз. Проекция патчей, CLS-токен, таблица позиций и голова принадлежат всей модели и используются совместно, поэтому каждую из этих частей считают один раз.
