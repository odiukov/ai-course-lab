- concept: flatten меняет форму представления патча, сохраняя все значения
  question: Что происходит с данными RGB-патча при стандартном flatten перед линейной проекцией?
  explanation: Flatten лишь записывает компоненты патча в виде одномерного вектора. Значения не усредняются и не отбрасываются, поэтому при известном порядке исходную форму можно восстановить.
  kind: choice
  options:
    - Цветовые каналы каждого пикселя усредняются
    - Соседние пиксели заменяются их средним значением
    - Пространственные оси и каналы разворачиваются в один вектор без потери элементов
    - Из патча сохраняются только признаки границ
