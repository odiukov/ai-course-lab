- concept: матричное проецирование строк не смешивает информацию между патчами
  question: Почему при вычислении Y = XW выходная строка для одного патча не зависит от содержимого остальных патчей?
  explanation: Элемент выходной строки вычисляется как сумма только по признакам того же входного патча. Поэтому строка 5 результата остаётся представлением строки 5 входа; взаимодействие между патчами появится позже в self-attention.
  kind: open
  reference: Каждая строка результата вычисляется отдельно как произведение соответствующей строки X на общую матрицу W. Другие строки X в эту сумму не входят, поэтому патчи не смешиваются и сохраняют соответствие строк.
  id: 015-linear-project-2
  fingerprint: c4fa75be
