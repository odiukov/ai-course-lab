- concept: сдвиг локальных окон обеспечивает обмен информацией между областями изображения
  question: Объясните своими словами, зачем в последовательных слоях Swin Transformer сдвигают границы локальных окон.
  explanation: 'Сдвиг меняет состав локальных групп: прежние границы перестают быть постоянными барьерами. Так информация проходит между соседними областями, хотя каждый отдельный слой по-прежнему вычисляет attention только внутри небольших окон.'
  kind: open
  reference: Без сдвига токены из разных окон не взаимодействовали бы. После сдвига часть токенов, прежде находившихся в соседних окнах, попадает в одно новое окно и обменивается информацией. Повторение таких слоёв расширяет область распространения признаков без глобального attention.
  id: 031-deit-swin-3
  fingerprint: d8f4fe7a
