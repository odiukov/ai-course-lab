- concept: дистилляция в DeiT передаёт ученику распределение вероятностей учителя по классам
  question: Почему обучение DeiT по ответам заранее обученной модели-учителя может быть информативнее обучения только по жёстким меткам классов?
  explanation: 'Жёсткая метка сообщает только правильный класс, а распределение учителя содержит дополнительную информацию: какие альтернативные классы похожи и насколько учитель уверен. В DeiT этот сигнал осваивает специальный distillation-токен.'
  kind: choice
  options:
    - Распределение вероятностей учителя отражает сходство классов и неопределённость предсказания
    - Учитель автоматически добавляет в датасет новые изображения
    - Ответы учителя уменьшают число патчей в каждом изображении
    - Дистилляция полностью устраняет необходимость в целевой функции
  correct: 0
  id: 031-deit-swin-1
  fingerprint: efa2dd45
- concept: при фиксированном размере окна вычислительная стоимость оконного attention линейна по числу токенов изображения
  question: Число токенов изображения увеличивают, но число токенов в каждом окне Swin Transformer оставляют постоянным. Как растёт суммарное число вычисляемых attention-связей?
  explanation: Каждый токен взаимодействует только с постоянным числом токенов своего окна. Поэтому добавление новых окон увеличивает объём вычислений пропорционально числу токенов, тогда как глобальный attention сравнивал бы каждую пару токенов.
  kind: choice
  options:
    - Линейно по общему числу токенов
    - Квадратично по общему числу токенов
    - Экспоненциально по общему числу токенов
    - Не зависит от общего числа токенов
  correct: 0
