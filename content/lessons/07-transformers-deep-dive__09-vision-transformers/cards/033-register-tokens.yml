- concept: attention sinks особенно вредят задачам, использующим признаки отдельных патчей
  question: Почему attention sinks в патч-токенах обычно опаснее для сегментации и поиска соответствий, чем для классификации изображения через токен [CLS]?
  explanation: Последствия зависят от того, какие выходы энкодера читает последующая задача. Плотные задачи требуют корректного признака в каждой пространственной позиции, тогда как классификатор через [CLS] использует глобальную сводку.
  kind: open
  reference: Сегментация и поиск соответствий непосредственно используют представление каждого патча как локальный признак. Если патч стал attention sink и хранит служебную или глобальную информацию, его локальное описание искажается. Классификация через [CLS] опирается главным образом на агрегированное представление всего изображения, поэтому повреждение нескольких локальных токенов может быть менее заметно.
  id: 033-register-tokens-2
  fingerprint: 8f42d6db
- concept: нормализация softmax вынуждает распределить всю массу внимания между доступными токенами
  question: Почему голова с softmax-attention не может выразить решение «не обращать внимания ни на один токен»?
  explanation: 'Softmax преобразует оценки совместимости в распределение: веса неотрицательны, а их сумма равна единице. Поэтому масса внимания должна куда-то попасть даже тогда, когда полезного адресата для конкретной головы нет; некоторые токены могут стать sinks.'
  kind: choice
  options:
    - Веса внимания после softmax неотрицательны и в каждой строке суммируются до единицы
    - Все значения матрицы запросов обязаны быть одинаковыми
    - Softmax оставляет ненулевым ровно один вес
    - Ключи и значения всегда имеют общие параметры
  correct: 0
