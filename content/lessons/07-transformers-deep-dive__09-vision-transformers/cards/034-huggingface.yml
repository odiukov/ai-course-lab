- concept: индексация одного токена удаляет ось последовательности и сохраняет оси батча и признаков
  question: Тензор скрытых состояний имеет символическую форму B × N × D. Заполните форму результата после выбора токена t у каждого элемента батча.
  explanation: Целочисленный индекс t выбирает одну позицию и удаляет ось токенов. Поэтому out[:, 0] для формы (1, 197, 768) даёт форму (1, 768).
  kind: cloze
  template: H[:, t] ∈ R^{___}
  answer: B×D
  accept:
    - B x D
    - B*D
    - (B, D)
    - B,D
  id: 034-huggingface-2
  fingerprint: 0a2ff353
- concept: локальные задачи зрения используют пространственно привязанные выходы патч-токенов
  question: Объясните своими словами, почему для сегментации изображения недостаточно сохранить только глобальный служебный токен и зачем нужны выходы патч-токенов.
  explanation: В выходе ViT служебный токен удобен для решения на уровне всей картинки. Остальные 196 выходов соответствуют отдельным патчам и содержат контекстуализированные локальные признаки, необходимые для определения того, что находится в разных местах изображения.
  kind: open
  reference: Глобальный токен сжимает информацию об изображении в одно представление и не предоставляет отдельного признака для каждой области. Патч-токены сохраняют соответствие участкам изображения, поэтому по ним можно делать локальные предсказания.
  id: 034-huggingface-3
  fingerprint: adfe38c4
