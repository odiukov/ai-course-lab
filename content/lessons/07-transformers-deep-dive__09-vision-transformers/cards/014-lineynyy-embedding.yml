- concept: линейное проецирование всех неперекрывающихся патчей можно реализовать одной свёрткой
  question: Объясни, почему слой Conv2d с размером ядра P и шагом P эквивалентен разбиению изображения на неперекрывающиеся патчи и применению к каждому патчу одной линейной проекции.
  explanation: Ядро охватывает патч целиком, а равный ему шаг переносит ядро сразу к следующему патчу. d_model выходных каналов дают d_model координат каждого токена, причём веса общей свёртки разделяются между всеми позициями.
  kind: open
  reference: Шаг P не даёт соседним окнам перекрываться, поэтому каждое положение ядра соответствует отдельному патчу. Значения ядра задают линейное преобразование пикселей патча, а каждый выходной канал создаёт одну координату токена. Одни и те же веса ядра применяются ко всем патчам.
  id: 014-lineynyy-embedding-2
