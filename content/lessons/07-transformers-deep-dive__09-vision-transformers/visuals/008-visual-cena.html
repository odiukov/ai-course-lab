<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Цена мелкого патча</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1b1f26; --mut:#5c6472; --grid16:#2f6fd0; --grid8:#c2410c;
    --img:#e8edf5; --imgline:#b9c4d6; --warn:#8b1c1c;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12151a; --fg:#e8ecf3; --mut:#98a2b3; --grid16:#7fb0ff; --grid8:#ff9d5c;
      --img:#1d232c; --imgline:#39414f; --warn:#ff8080;
    }
  }
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:900px;margin:0 auto;padding:8px 10px 12px;}
  h2{font-size:15px;margin:0 0 6px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .fail{font-size:13px;color:var(--warn);white-space:pre-wrap;}
</style>
</head>
<body>
<div class="wrap">
  <h2>Цена мелкого патча: вдвое мельче — в 16 раз дороже</h2>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById("host");
  try{
    // ---- данные схемы ----
    var IMG = 224;                       // сторона картинки, пиксели
    var VARIANTS = [
      {patch:16, side:14, tokens:196, pairs:38416, x0:0,   color:"var(--grid16)", tag:"патч 16"},
      {patch:8,  side:28, tokens:784, pairs:614656, x0:280, color:"var(--grid8)",  tag:"патч 8"}
    ];
    var RATIO = 16;

    // ---- одна система координат ----
    var ORIGIN = {x:60, y:300};   // sx(0), sy(0)
    var SCALE  = 0.85;            // единиц данных -> пиксели
    function sx(x){ return ORIGIN.x + x*SCALE; }
    function sy(y){ return ORIGIN.y - y*SCALE; }

    // ---- литералы, что разрешены ----
    var VB_W = 620, VB_H = 400, PAD = 6, LW = 1, LWG = 1.6, FS = 13, FSB = 15, FSS = 11.5;

    var NS = "http://www.w3.org/2000/svg";
    function el(n,a){ var e=document.createElementNS(NS,n);
      for(var k in a){ e.setAttribute(k,a[k]); } return e; }
    function txt(x,y,s,anchor,size,fill,weight){
      var t=el("text",{x:x,y:y,"text-anchor":anchor,"font-size":size,
        fill:fill||"var(--fg)","font-weight":weight||"normal"});
      t.textContent=s; return t;
    }

    var svg = el("svg",{viewBox:"0 0 "+VB_W+" "+VB_H,preserveAspectRatio:"xMidYMid meet",
      role:"img","aria-label":"Патч 16 даёт 196 токенов и 38 416 пар, патч 8 даёт 784 токена и 614 656 пар — в 16 раз дороже"});
    svg.appendChild(el("rect",{x:0,y:0,width:VB_W,height:VB_H,fill:"var(--bg)"}));

    var defs = el("defs");
    var mk = el("marker",{id:"arw",viewBox:"0 0 10 10",refX:"9",refY:"5",
      markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"});
    mk.appendChild(el("path",{d:"M0,0 L10,5 L0,10 z",fill:"var(--mut)"}));
    defs.appendChild(mk); svg.appendChild(defs);

    VARIANTS.forEach(function(v){
      var g = el("g",{});
      var L = v.x0, R = v.x0 + IMG;          // в единицах данных
      var B = 0,   T = IMG;

      // подложка «картинка»
      g.appendChild(el("rect",{x:sx(L),y:sy(T),width:sx(R)-sx(L),height:sy(B)-sy(T),
        fill:"var(--img)",stroke:"var(--imgline)","stroke-width":LW}));

      // сетка патчей
      for(var i=0;i<=v.side;i++){
        var c = L + i*v.patch;
        g.appendChild(el("line",{x1:sx(c),y1:sy(B),x2:sx(c),y2:sy(T),
          stroke:v.color,"stroke-width":LW,opacity:"0.55"}));
        var r = B + i*v.patch;
        g.appendChild(el("line",{x1:sx(L),y1:sy(r),x2:sx(R),y2:sy(r),
          stroke:v.color,"stroke-width":LW,opacity:"0.55"}));
      }
      // рамка сетки поверх
      g.appendChild(el("rect",{x:sx(L),y:sy(T),width:sx(R)-sx(L),height:sy(B)-sy(T),
        fill:"none",stroke:v.color,"stroke-width":LWG}));

      // заголовок варианта — над картинкой, middle по центру
      g.appendChild(txt(sx((L+R)/2), sy(T)-PAD*4, v.tag+" · сетка "+v.side+"×"+v.side,
        "middle", FSB, v.color, "600"));
      g.appendChild(txt(sx((L+R)/2), sy(T)-PAD, "картинка "+IMG+"×"+IMG,
        "middle", FSS, "var(--mut)"));

      // строки чисел — под картинкой, разнесены по вертикали
      g.appendChild(txt(sx((L+R)/2), sy(B)+PAD*3.5,
        v.side+" × "+v.side+" = "+v.tokens.toLocaleString("ru-RU")+" токенов",
        "middle", FS));
      g.appendChild(txt(sx((L+R)/2), sy(B)+PAD*6.5,
        "пар: "+v.pairs.toLocaleString("ru-RU"),
        "middle", FS, v.color, "600"));

      svg.appendChild(g);
    });

    // стрелка между сетками, подпись у хвоста слева-сверху
    var a1 = VARIANTS[0].x0 + IMG, a2 = VARIANTS[1].x0, my = IMG/2;
    svg.appendChild(el("line",{x1:sx(a1+PAD),y1:sy(my),x2:sx(a2-PAD),y2:sy(my),
      stroke:"var(--mut)","stroke-width":LWG,"marker-end":"url(#arw)"}));
    svg.appendChild(txt(sx(a1+PAD), sy(my)-PAD*2, "в 16 раз", "start", FSB, "var(--warn)", "700"));
    svg.appendChild(txt(sx(a1+PAD), sy(my)+PAD*3.2, "дороже", "start", FSB, "var(--warn)", "700"));

    // легенда снизу — одна строка, привязана к левому краю первой картинки
    var ly = -34;
    svg.appendChild(txt(sx(VARIANTS[0].x0), sy(ly),
      "токенов вчетверо больше (196 → 784), пар — как квадрат числа токенов: 4 × 4 = "+RATIO,
      "start", FSS, "var(--mut)"));
    svg.appendChild(txt(sx(VARIANTS[0].x0), sy(ly)+PAD*3,
      "614 656 / 38 416 = "+RATIO,
      "start", FSS, "var(--mut)"));

    host.appendChild(svg);
  }catch(e){
    host.innerHTML = '<p class="fail">Схема не построилась. Она должна показывать:\n'+
      'картинка 224×224, патч 16 — сетка 14×14 = 196 токенов и 38 416 пар;\n'+
      'патч 8 — сетка 28×28 = 784 токена и 614 656 пар;\n'+
      '614 656 / 38 416 = 16 — в 16 раз дороже.</p>';
  }
})();
</script>
</body>
</html>
