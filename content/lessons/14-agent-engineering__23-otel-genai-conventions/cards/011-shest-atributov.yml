- concept: отсутствующий на спане атрибут нельзя восстановить из уже собранных трейсов — ответ на этот вопрос уходит из телеметрии в чтение кода
  question: 'RAG-сервис инструментирован, спаны retrieval видны, но `gen_ai.data_source.id` не записывается. Поступает жалоба: «ответы устарели, похоже, читаем старый индекс». Объясни своими словами, почему трейсы за прошлую неделю тут не помогут и что даёт запись этого атрибута.'
  explanation: 'Ключевое различие: данные о корпусе существуют в рантайме, но в телеметрию не попали. Трейсинг отвечает только на те вопросы, под которые заранее заведены атрибуты; добавление `gen_ai.data_source.id` сегодня не чинит вчерашние спаны.'
  kind: open
  reference: 'Атрибут — это ось фильтрации, зафиксированная в момент экспорта спана. Чего не записали, того в хранилище нет: постфактум восстановить, к какому корпусу обращался конкретный вызов, из трейсов невозможно — придётся читать код и конфиги и гадать, какая версия была задеплоена в тот момент. С записанным `gen_ai.data_source.id` тот же вопрос становится запросом: сгруппировать retrieval-спаны по идентификатору хранилища и увидеть, что часть трафика уходит в старый корпус. Общий принцип: каждый непроставленный атрибут — вопрос, который навсегда переезжает из дашборда в ручной разбор кода.'
  id: 011-shest-atributov-3
  fingerprint: 3864c0fa
