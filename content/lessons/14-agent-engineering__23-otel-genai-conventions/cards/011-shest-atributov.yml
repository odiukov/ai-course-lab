- concept: поверх общего словаря gen_ai.* существуют отдельные соглашения для конкретных технологий (Anthropic, OpenAI, Azure AI Inference, AWS Bedrock)
  question: Инструментация клиента AWS Bedrock пишет спаны. Как соотносятся общий словарь `gen_ai.*` и соглашения для конкретной технологии?
  explanation: 'Конвенции устроены слоями: базовый набор `gen_ai.*` даёт переносимость между провайдерами, а специфика (Anthropic, Azure AI Inference, AWS Bedrock, OpenAI) добавляется сверху. Поэтому кросс-провайдерный запрос по `gen_ai.provider.name` и `gen_ai.request.model` работает одинаково, а вендорские детали доступны там, где они есть.'
  kind: choice
  options:
    - Общие атрибуты `gen_ai.*` применимы всегда, а для отдельных технологий заданы дополнительные соглашения поверх них
    - 'Вендорские соглашения заменяют общие: при работе с Bedrock атрибуты `gen_ai.*` не используются'
    - Вендорских соглашений в GenAI-конвенциях нет, каждая инструментация придумывает свои ключи
    - Общий словарь применим только к чат-операциям, для всего остального нужны вендорские схемы
