- concept: родитель нового спана берётся с вершины стека открытых спанов трейсера, а не передаётся аргументом в вызывающий код
  question: Трейсер открывает новый спан, когда стек открытых спанов не пуст. Расставь действия трейсера в правильном порядке.
  explanation: 'Родительство неявное: трейсер держит стек открытых, но ещё не закрытых спанов, и вершина стека на момент открытия и есть родитель. Поэтому функции инструментов и клиентов модели не обязаны принимать чужой span_id лишним аргументом — забыть протащить его нельзя, потому что его никто не тащит.'
  kind: order
  items:
    - посмотреть на верхний элемент стека открытых спанов
    - записать его идентификатор в parent_id нового спана
    - положить новый спан на вершину стека
    - при закрытии снять этот спан с вершины, вернув наверх предыдущий
  id: 019-stek-vlozhennosti-1
  fingerprint: 5bb4efdd
- concept: незакрытый спан остаётся на вершине стека и перехватывает родительство у последующих спанов того же уровня
  question: Прогон агента открывает подряд семь спанов инструментов, каждый должен быть ребёнком invoke_agent. В коде пятого инструмента спан открывается, но из-за раннего return не закрывается. Как будет выглядеть дерево дальше?
  explanation: 'Стек снимается только закрытием. Незакрытый спан продолжает быть верхним элементом, поэтому всё, что открывается после него, вешается под него. Дерево — это буквально порядок открытий и закрытий, никакой отдельной проверки «кому логически принадлежит спан» нет, и ошибки тоже не будет: структура молча уедет вглубь.'
  kind: choice
  options:
    - шестой и седьмой инструменты станут детьми пятого, а не invoke_agent, потому что пятый остался на вершине стека
    - 'шестой и седьмой станут сиротами: у них будет пустой parent_id и собственный trace_id'
    - ничего не изменится — трейсер знает, что все инструменты принадлежат invoke_agent, и восстановит связь по имени спана
    - трейсер выбросит ошибку при открытии шестого спана, потому что стек оказался в невалидном состоянии
  correct: 0
  id: 019-stek-vlozhennosti-2
  fingerprint: 1b846b19
- concept: при пустом стеке родитель ищется во входящем контексте трассы, и только при его отсутствии спан становится корнем
  question: Обработчик запроса открывает первый спан, стек открытых спанов трейсера пуст. Откуда возьмётся родитель?
  explanation: Пустой стек значит только «в этом процессе сейчас ничего не открыто». Родитель может прийти извне — в сериализованном контексте запроса; тогда спан продолжает чужую трассу. Корнем нового трейса он становится лишь тогда, когда и стек пуст, и входящего контекста нет. Закрытые спаны из стека уже сняты и родителями быть не могут.
  kind: choice
  options:
    - спан всегда становится корнем нового трейса — пустой стек означает начало трассы
    - родителем станет последний закрытый спан этого трейсера
    - родитель берётся из контекста трассы, пришедшего с запросом; если контекста нет — спан становится корнем нового трейса
    - 'открытие спана при пустом стеке невозможно: сначала нужно явно создать корневой спан'
  correct: 2
