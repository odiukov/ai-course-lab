- concept: корень дерева спанов определяется как спан, чей parent_span_id не встречается среди span_id имеющегося набора
  question: 'Экспортёр отдал 11 спанов одного прогона плоским списком: имя, время старта, длительность, span_id, parent_span_id. Как надёжно определить корневой спан?'
  explanation: 'Корень — это спан, чьего родителя нет в наборе: ссылка ведёт наружу или её нет вовсе. Остальные признаки — совпадения, а не определение. Порядок в списке отражает лишь момент закрытия, самая большая длительность не гарантирована при разъехавшемся стеке, а ранний старт бывает и у ребёнка, если родитель открылся тем же тиком часов. Важный побочный эффект: критерий сам находит сирот — спан с чужим parent_span_id всплывает как второй корень, поэтому корни надо считать, а не брать первый попавшийся.'
  kind: choice
  options:
    - Взять спан с самой большой длительностью — родитель всегда длится дольше всех
    - Взять спан, чей parent_span_id отсутствует среди span_id этого набора
    - Взять спан, который лежит в списке последним, потому что список отсортирован по времени закрытия
    - Взять спан с самым ранним временем старта
  correct: 1
  id: 024-span-tree-1
  fingerprint: '38757061'
- concept: 'порядок восстановления иерархии спанов из плоского списка: индекс по родителю, отбор корней, рекурсивный спуск с накоплением глубины'
  question: Расставь шаги функции, которая превращает плоский список спанов в дерево с отступами.
  explanation: 'Иерархия лежит в поле parent_span_id, а не в порядке строк, поэтому первое действие — переиндексировать список по родителю: без этого каждый спуск стоит полного прохода по списку. Множество span_id нужно раньше отбора корней, потому что критерий корня формулируется именно через отсутствие в нём. Глубина не хранится на спане — она накапливается по ходу рекурсии и превращается в ширину отступа только на печати.'
  kind: order
  items:
    - 'Построить индекс: словарь из parent_span_id в список его детей'
    - Собрать множество всех span_id набора
    - Отобрать корни — спаны, чей parent_span_id не входит в это множество
    - Для каждого корня рекурсивно обойти детей из индекса, увеличивая глубину на единицу при спуске
    - На каждом спане напечатать отступ по глубине, затем имя и длительность
  id: 024-span-tree-2
  fingerprint: 55900c58
- concept: детей в дереве спанов сортируют по времени старта, потому что порядок исходного списка отражает моменты закрытия и не совпадает с порядком запуска
  question: Функция печатает детей спана в том порядке, в каком они встретились в исходном плоском списке от экспортёра. Что с этим не так?
  explanation: 'Спан попадает в экспорт в момент завершения, поэтому плоский список упорядочен по времени закрытия: короткий брат, запущенный вторым, окажется в списке раньше первого. Дерево от этого не сломается структурно — глубина и связи считаются по parent_span_id, — но вывод перестанет быть воспроизводимым: тот же прогон при других длительностях нарисуется в другом порядке. Лечится явной сортировкой детей по времени старта, и тогда чтение сверху вниз совпадает с ходом выполнения.'
  kind: choice
  options:
    - 'Ничего: экспортёр всегда отдаёт спаны в порядке их запуска'
    - Список отсортирован по моменту закрытия, поэтому братья печатаются не в порядке старта, и одно и то же дерево рисуется по-разному при разных длительностях
    - Порядок детей ломает вычисление глубины отступа
    - Порядок детей меняет parent_span_id у внуков
  correct: 1
  id: 024-span-tree-3
