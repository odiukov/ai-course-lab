- concept: opt-in переводит выбор словаря имён из неявного дефолта версии в явную декларацию конфигурации
  question: 'Объясни своими словами: что даёт явный opt-in на экспериментальный набор GenAI-соглашений и почему без него обновление библиотеки инструментации меняет телеметрию незаметно для команды?'
  explanation: Смысл опции — заменить неявную зависимость от версии на явную, читаемую строку конфигурации. Стоит одна строка, а её отсутствие всплывает как «спаны идут, график пустой».
  kind: open
  reference: 'Без переменной инструментация испускает набор имён по умолчанию для своей версии — то есть словарь атрибутов оказывается неявной функцией версии зависимости. Обновил библиотеку — молча поехал набор ключей, никакой ошибки и никакого предупреждения. Явный opt-in делает выбор набора частью конфигурации: в окружении записано, какой словарь запрошен, и это видно при ревью и при разборе инцидента. Плюс запрашивается согласованный набор целиком, а не смесь старых и новых ключей.'
  id: 028-stability-opt-in-2
  fingerprint: af80e587
- concept: opt-in фиксирует, какой набор имён испускается сейчас, но не даёт гарантии стабильности этих имён в будущем — такую гарантию даёт только перевод соглашения в стабильный статус
  question: Команда включила opt-in на актуальный экспериментальный набор GenAI-соглашений. Какое утверждение о гарантиях верно?
  explanation: 'Экспериментальный статус означает отсутствие обязательства сохранять имена. Opt-in убирает случайность («что приедет с новой версией»), но не отменяет эволюцию словаря: переход на новую версию соглашений остаётся управляемым событием, которое команда планирует, а не ловит по пустому графику.'
  kind: choice
  options:
    - 'Имена атрибутов теперь стабильны навсегда: рабочая группа не может их менять после включения опции'
    - Опция фиксирует, какой набор имён испускается в текущей конфигурации, но сам экспериментальный набор в будущих версиях может измениться — гарантию неизменности даёт только стабильный статус соглашения
    - Опция автоматически дублирует каждый атрибут под старым и новым именем, поэтому запросы никогда не сломаются
    - 'Опция переносит совместимость на бэкенд: он обязан маппить старые имена на новые'
  correct: 1
  id: 028-stability-opt-in-3
