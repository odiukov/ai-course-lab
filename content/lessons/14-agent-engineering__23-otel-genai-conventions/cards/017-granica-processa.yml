- concept: признак разрыва трассы на входе — у первого спана сервиса собственный trace_id и пустой parent_id
  question: Вызывающий сервис жалуется на 7 секунд ожидания, а в бэкенде наблюдаемости спаны вашего агента образуют отдельное дерево длительностью 3 секунды. По каким полям спанов надёжнее всего подтвердить, что трасса разорвана именно на входе в ваш сервис?
  explanation: Связь спанов держится на trace_id и parent_id. Если сервис при старте попросил трейсер завести новый трейс, его спаны получают свежий trace_id, а первый спан остаётся без родителя — это и есть подпись разрыва. Kind, provider и разница длительностей нормальны и в целой трассе.
  kind: choice
  options:
    - У корневого спана агента свой trace_id, не совпадающий с trace_id вызывающего, и пустой parent_id
    - У спанов агента отличается gen_ai.provider.name
    - У спанов агента kind равен INTERNAL, а у вызывающего CLIENT
    - Сумма длительностей дочерних спанов меньше длительности родителя
  correct: 0
  id: 017-granica-processa-1
  fingerprint: 768db90f
- concept: входящий контекст трассы восстанавливается операцией extract пропагатора из заголовков запроса
  question: Обработчик HTTP-запроса должен продолжить чужую трассу, а не начать свою. Какой операцией пропагатора W3C восстанавливается контекст из заголовков?
  explanation: inject пишет контекст в исходящий carrier, extract читает его из входящего. Без extract переданный context пуст, спан становится корнем нового трейса, и связь с вызывающим теряется навсегда — восстановить её постфактум нечем.
  kind: cloze
  template: |-
    ctx = TraceContextTextMapPropagator().___(carrier=request.headers)
    with tracer.start_as_current_span("invoke_agent billing", context=ctx):
        ...
  answer: extract
  accept:
    - extract
    - .extract
  id: 017-granica-processa-2
  fingerprint: 9d305d68
- concept: отсутствующий или невалидный traceparent — штатная ситуация, обрабатываемая стартом нового корневого трейса
  question: В запрос пришёл заголовок traceparent с испорченной структурой (не разбирается в четыре части). Как обязан повести себя сервис?
  explanation: Битый или отсутствующий заголовок означает лишь, что вы первый в цепочке — это штатный случай. Извлечение контекста не должно ронять обработку бизнес-запроса; пропагатор возвращает пустой контекст, и спан корректно становится корнем нового трейса.
  kind: choice
  options:
    - Отклонить запрос с 400, раз телеметрия невалидна
    - Начать новый корневой трейс и обслужить запрос как обычно
    - Сохранить строку заголовка в атрибут спана и не создавать спанов
    - Отключить трассировку для этого запроса целиком
  correct: 1
  id: 017-granica-processa-3
  fingerprint: 1c21de48
