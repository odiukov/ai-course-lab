- concept: у дочернего спана trace_id копируется у родителя без изменений, а заново генерируется только span_id
  question: Оркестратор открывает вложенный спан инструмента, когда на стеке уже есть открытый спан агента. Какие идентификаторы получает новый спан?
  explanation: trace_id — идентификатор всей трассы, он один на дерево и передаётся вниз без изменений. Уникальность обеспечивает span_id, который генерируется для каждого спана. Связь ребёнка с родителем несёт parent_span_id. Если ребёнку сгенерировать свой trace_id, дерево распадётся на отдельные одиночные трассы.
  kind: choice
  options:
    - Новый span_id, trace_id скопирован у родителя, parent_span_id равен span_id родителя
    - Новый span_id и новый trace_id, parent_span_id равен span_id родителя
    - Новый trace_id, span_id скопирован у родителя, parent_span_id пустой
    - Все три идентификатора наследуются от родителя без изменений
  correct: 0
  id: 020-start-span-1
  fingerprint: 4a5f79cd
- concept: в момент открытия спана известны только начальные поля, а длительность и статус принципиально недоступны и дописываются при закрытии
  question: Почему функция, открывающая спан, не может сразу заполнить его длительность и статус завершения?
  explanation: 'Открытый спан по определению наполовину пуст: зафиксирована отметка старта, а конец ещё не наступил. Попытка дописать конец и статус в момент старта означает выдуманные данные. Открытая запись полезна и сама по себе: по ней видно, что операция началась и с какого момента, даже если процесс упадёт и спан никогда не закроется.'
  kind: choice
  options:
    - 'Эти поля вычисляются только в момент закрытия: операция ещё выполняется, её итог и время окончания неизвестны'
    - Эти поля запрещены семантическими соглашениями GenAI и заполняются только бэкендом
    - Эти поля требуют явного opt-in через переменную окружения
    - Эти поля можно заполнить сразу, но их принято оставлять пустыми ради экономии места в трейсе
  correct: 0
  id: 020-start-span-2
  fingerprint: bac092ae
- concept: открытый спан помещается на стек до возврата наружу, иначе следующий вложенный спан прицепится к чужому родителю
  question: Расставьте действия функции открытия спана в правильном порядке.
  explanation: 'Стек читается первым, потому что от него зависят trace_id и parent_span_id. Укладка на стек обязана произойти до возврата: если спан вернуть, но не положить, следующий вложенный спан увидит на вершине предыдущего соседа и прицепится к чужому родителю — дерево получится с неправильной вложенностью, но без единой ошибки в логах.'
  kind: order
  items:
    - 'Посмотреть на стек открытых спанов: пуст он или нет'
    - Определить trace_id и parent_span_id — новый корень либо наследование от верхнего элемента стека
    - Сгенерировать собственный span_id и зафиксировать отметку времени старта
    - Положить готовый спан на вершину стека
    - Вернуть спан вызывающему коду
  id: 020-start-span-3
  fingerprint: c0f7c61b
