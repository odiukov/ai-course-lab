- concept: часть дефектов инструментирования читается прямо с полей спана, а выбор словаря имён виден только косвенно — по тому, какие имена атрибутов вообще испускаются
  question: Вы аудируете чужую инструментацию GenAI, имея только собранные трейсы, без доступа к конфигурации процесса. Какое утверждение верно?
  explanation: 'Родитель, набор атрибутов и наличие текста — это поля самого спана, они наблюдаемы. Переменная opt-in живёт в окружении приложения и на спан не пишется: о ней судят по тому, какой словарь имён пришёл в бэкенд. Поэтому в аудите первые три проверки делаются по трейсу, а четвёртая требует либо вывода по именам, либо взгляда в конфигурацию.'
  kind: choice
  options:
    - Отсутствие родительской связи, отсутствие атрибута провайдера и текст промпта в атрибутах видны прямо на спане, а вот выставленный opt-in на набор соглашений определяется лишь косвенно — по тому, какие имена атрибутов испускаются
    - Все четыре типовые поломки одинаково читаются по самим спанам, конфигурация процесса не нужна
    - 'По трейсам нельзя судить ни об одной из поломок: и связи, и атрибуты, и захват содержимого — свойства конфигурации, а не спанов'
