- concept: атрибуты GenAI не гарантированы на спане, поэтому потребитель обязан деградировать до «неизвестно», а не падать
  question: Почему код, который читает атрибуты GenAI-спанов, обязан работать с отсутствующими ключами, а не обращаться к ним напрямую?
  explanation: 'Ключевая мысль: словарь имён — контракт про то, КАК называется атрибут, а не про то, что он ЕСТЬ. Отсюда безопасное чтение со значением по умолчанию вместо прямого доступа к ключу.'
  kind: open
  reference: 'Соглашения GenAI задают словарь имён, но не гарантируют присутствие всех атрибутов: большинство из них рекомендованные, а не обязательные, содержимое (входы/выходы) вообще не пишется без явного opt-in, а часть инструментаций настроена неполно или относится к другой версии экспериментальной схемы. Значит любой атрибут может отсутствовать. Потребитель — дашборд, экспортёр, форматтер — должен подставить заглушку («провайдер неизвестен») и вывести остальное. Падение на одном неполном спане обнуляет картину по всему трейсу, а неполный спан как раз чаще всего принадлежит плохо настроенному фреймворку, то есть тому месту, которое и надо увидеть.'
  id: 007-describe-span-3
  fingerprint: 8132462a
