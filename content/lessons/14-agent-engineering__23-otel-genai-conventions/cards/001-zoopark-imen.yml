- concept: семантические конвенции GenAI в OpenTelemetry задаёт отдельная рабочая группа GenAI SIG, а не отдельные вендоры инструментации
  question: Кто в экосистеме OpenTelemetry отвечает за единый набор имён спанов и атрибутов для LLM-приложений?
  explanation: 'Семантические конвенции — это спецификация OpenTelemetry, и за GenAI-часть отвечает GenAI SIG. Бэкенды и просмотрщики ничего не нормализуют: они хранят то имя спана, которое прислала инструментация. Поэтому договорённость должна быть на стороне записи данных, а не чтения.'
  kind: choice
  options:
    - Каждый вендор инструментации сам публикует свою схему, а бэкенд трейсов сводит их к общей
    - Рабочая группа GenAI SIG внутри OpenTelemetry, в чью схему целится вся экосистема
    - Поставщик модели (OpenAI, Anthropic) — вместе с API он определяет и телеметрию
    - Просмотрщик трейсов (Jaeger, Grafana Tempo) — он нормализует имена при приёме данных
  correct: 1
  id: 001-zoopark-imen-1
  fingerprint: e4bd067d
- concept: имя спана — ключ, по которому строится запрос, поэтому запрос с перечислением вендорских имён деградирует молча, без ошибки
  question: Инженер считает среднюю задержку вызовов модели запросом, где имя спана сверяется со списком из семи известных вендорских имён. В сервис добавили восьмую библиотеку инструментации со своим именем спана. Объясни, почему это опаснее, чем упавший запрос.
  explanation: 'Ключевая мысль: поломка не в коде агентов и не в бэкенде — каждый вендор сделал всё корректно. Поломка в отсутствии договора между тем, кто пишет спан, и тем, кто его потом ищет. Отказы видны, а молчаливая недосчитанная агрегация — нет.'
  kind: open
  reference: 'Имя спана — ключ выборки. Спаны новой библиотеки просто не попадают под фильтр, поэтому запрос не падает и не выдаёт ошибку: он возвращает число, посчитанное по неполному множеству. Метрика тихо становится неправдой, и заметить это можно только вручную сверив список имён с реально приходящими спанами. Единое имя из конвенций делает запрос устойчивым: новая библиотека, следующая стандарту, автоматически попадает в ту же выборку без правки запроса.'
  id: 001-zoopark-imen-2
  fingerprint: 6504c60a
