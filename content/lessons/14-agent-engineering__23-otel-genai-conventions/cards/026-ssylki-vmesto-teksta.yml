- concept: содержимое на спане наследует модель доступа трейсов, то есть становится видимым всем читателям телеметрии, а ссылка возвращает разграничение доступа
  question: Команда включила gen_ai.input.messages в проде. Безопасность возражает не из-за объёма данных. В чём главный аргумент?
  explanation: 'Текст на спане наследует модель доступа телеметрии, а она заведомо широкая: трейсы существуют, чтобы их смотрели все, кто разбирает инциденты. Паспортные данные и переписка утекают не через атаку, а через штатный просмотр. Ссылка-идентификатор разрывает это: спан несёт ключ, а сам текст лежит в хранилище со своим отдельным доступом, который выдаётся адресно.'
  kind: choice
  options:
    - Трейсы читает вся эксплуатация — дежурные, аналитики, авторы дашбордов, — и их уровень доступа не рассчитан на персональные данные пользователей, которые приезжают внутри промпта
    - Атрибуты спанов передаются по OTLP без шифрования, поэтому текст можно перехватить на транспорте
    - Спецификация запрещает записывать в атрибуты строки длиннее фиксированного лимита, и длинный промпт будет обрезан
    - Захват содержимого удваивает задержку экспортёра, потому что сериализация текста происходит синхронно
