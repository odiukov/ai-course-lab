- concept: хранение содержимого вне трейса убирает недоверенный текст с поверхности, которую читают люди и обрабатывают инструменты, — это встроенная защита от отравления содержимым
  question: Почему запись ссылки вместо самого текста заодно уменьшает риск отравления содержимым (prompt injection), а не только экономит место?
  explanation: 'Ключевая мысль: захват содержимого расширяет поверхность, на которую попадает недоверенный текст. Экономия объёма — приятный побочный эффект, а защитный смысл в том, что ссылка не переносит чужие инструкции в систему, которую читают люди и скармливают инструментам.'
  kind: open
  reference: 'В промпте и ответе модели лежит недоверенный текст: пользовательский ввод, содержимое документов, выдача внешних сервисов. Попадая на спан, он оказывается на поверхности, которую читают глазами дежурные и которую обрабатывают инструменты поверх трейсов — просмотрщики, суммаризаторы инцидентов, агенты-помощники. Инструкция, вшитая в такой текст, доезжает до этих читателей и обработчиков вместе с телеметрией. Если на спане только идентификатор, чужой текст в трейс не попадает вовсе: чтобы его увидеть, нужно осознанно пойти в хранилище по ключу. Недоверенное содержимое остаётся в одном месте с известными правилами обращения, вместо того чтобы расползаться по системе наблюдаемости.'
