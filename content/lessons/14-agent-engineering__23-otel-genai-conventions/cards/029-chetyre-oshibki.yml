- concept: поломки телеметрии делятся на конфигурационные (устраняются однократным изменением и держатся сами) и дисциплинарные (возвращаются при каждом вмешательстве человека), и вторые дороже при равном единичном ущербе
  question: 'Команда собрала список типовых поломок GenAI-трейсинга: не выставлен атрибут провайдера; контекст трассы не пробрасывается в спаны инструментов; не выставлен opt-in на версию семантических соглашений; в спаны попадает полное содержимое промптов. Разделите этот список на две группы по способу устранения и объясните, почему группа из одного элемента обычно дороже группы из трёх.'
  explanation: 'Ключ — не сам список, а способ устранения. Конфигурационная поломка имеет состояние, которое сохраняется; дисциплинарная зависит от действия человека и потому повторяется. При сравнении стоимости учитывают частоту повторения и обратимость: три конфигурационных ошибки дают пустые панели и неразличимую задержку (это восстанавливаемо после починки), а утечка содержимого в трейсы необратима.'
  kind: open
  reference: 'Первые три — конфигурация: атрибут провайдера прописывается в инструментации, проброс контекста — в клиентах и обработчиках, opt-in — переменной окружения. Каждое исправляется один раз, закрепляется в коде/деплое и дальше держится само; регрессия видна как изменение кода. Четвёртая — дисциплина: захват содержимого управляется переключателем, который человек может включить в любой момент («на минутку, поймать баг»), поэтому поломка возвращается при каждом вмешательстве и не закрывается одним коммитом. Дороже она потому, что вероятность повторения не убывает со временем, а единичный ущерб необратим: попавшие в трейсы персональные данные и секреты уже прочитаны всеми, у кого есть доступ к телеметрии, и «выключить обратно» не отменяет утечку. Снижают её не разовым исправлением, а мерами того же типа, что и дисциплина: запрет включения в проде на уровне конфигурации, хранение содержимого снаружи со ссылкой на спане, ограничение доступа.'
