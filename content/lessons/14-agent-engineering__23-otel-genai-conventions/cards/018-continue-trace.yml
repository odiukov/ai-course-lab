- concept: идентификатор из одних нулей невалиден по стандарту, несмотря на правильную длину и допустимый алфавит
  question: Сервис получил заголовок traceparent, где все поля нужной длины и состоят из hex-символов, но trace_id целиком набран нулями. Как обязан поступить приёмник по W3C Trace Context?
  explanation: 'Стандарт отдельно запрещает нулевые значения trace_id и span_id: они зарезервированы как маркер «идентификатора нет». Проверка длины и hex-алфавита такой заголовок пропускает, поэтому запрет нулей — отдельное правило валидации. Ошибку клиенту возвращать нельзя: телеметрия не должна ломать наблюдаемый продукт.'
  kind: choice
  options:
    - Считать заголовок невалидным и начать новый корневой трейс
    - 'Принять заголовок: длина и алфавит корректны, значение нулей допустимо'
    - Принять trace_id, но обнулить флаги сэмплирования
    - Вернуть клиенту ошибку валидации запроса
  correct: 0
  id: 018-continue-trace-1
  fingerprint: bdb66bb9
- concept: traceparent требует hex-символы строго в нижнем регистре, регистр не нормализуется приёмником
  question: В traceparent пришёл trace_id правильной длины, но часть букв — в верхнем регистре (например, `4BF9...`). Что предписывает стандарт?
  explanation: 'W3C Trace Context задаёт формат полей как lowercase hex. Верхний регистр — нарушение формата, и приёмник обращается с ним как с любым другим битым заголовком: стартует собственный корневой трейс. Нормализация регистра «на всякий случай» опасна тем, что маскирует сломанного отправителя выше по цепочке.'
  kind: choice
  options:
    - Привести к нижнему регистру и продолжить трейс
    - 'Считать заголовок невалидным: допускается только нижний регистр hex'
    - Принять как есть — регистр hex-символов не значим
    - Принять trace_id, но не использовать его как родителя
  correct: 1
  id: 018-continue-trace-2
  fingerprint: 0c6dd4d8
- concept: разбор traceparent — конвейер проверок от структуры к содержимому, и только пройдя весь конвейер, поля идут в новый спан
  question: Расставьте шаги разбора входящего traceparent в порядке, в котором их выполняет корректная реализация.
  explanation: 'Порядок идёт от дешёвых структурных проверок к содержательным: без разбиения по дефисам нечего проверять на hex, а проверка на нули имеет смысл только для полей уже правильной длины. Любой провал на любом шаге даёт один и тот же результат — новый корневой трейс, а не исключение.'
  kind: order
  items:
    - Проверить, что заголовок вообще присутствует
    - Разбить строку по дефисам и проверить число полей и длину каждого
    - Проверить, что каждое поле состоит только из допустимых hex-символов нижнего регистра
    - Отбросить идентификаторы, состоящие из одних нулей
    - Вернуть trace_id, входящий span_id как родительский и флаги сэмплирования
  id: 018-continue-trace-3
  fingerprint: 9068878e
