- concept: в проде содержимое хранят во внешнем хранилище, а на спан пишут идентификатор-ссылку вместо самого текста
  question: Продовому сервису нужно уметь поднимать текст запроса по упавшему прогону, но трейсы читает вся дежурная смена. Какой паттерн рекомендуют соглашения GenAI?
  explanation: Ссылка-идентификатор занимает десятки байт против килобайт на промпт, а главное — переносит доступ к персональным данным в хранилище со своими правами и сроком хранения. Обрезка и шифрование на спане оставляют данные в системе мониторинга, где политики доступа под них не рассчитаны.
  kind: choice
  options:
    - Хранить содержимое во внешнем хранилище (S3, лог-стор), а на спан писать идентификатор-ссылку
    - Писать полное содержимое на спан, но урезать его до первых 512 символов
    - Писать содержимое на спан в зашифрованном виде и раздавать ключ дежурным
    - Отключить захват полностью и восстанавливать текст из атрибутов gen_ai.request.model и usage
