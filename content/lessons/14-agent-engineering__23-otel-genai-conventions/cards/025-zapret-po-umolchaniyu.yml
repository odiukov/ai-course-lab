- concept: ответ модели записывается на спан под стандартным ключом gen_ai.output.messages
  question: Захват содержимого включён осознанно. Под каким ключом на спан кладут сообщения, которые вернула модель?
  explanation: 'Триада атрибутов захвата: gen_ai.system_instructions — системная инструкция, gen_ai.input.messages — то, что ушло в модель, gen_ai.output.messages — то, что она вернула. Свой ключ вида llm.response.text ломает потребителей, которые ищут стандартное имя.'
  kind: cloze
  template: span.set_attribute("___", serialize(response_messages))
  answer: gen_ai.output.messages
