- concept: постоянная часть имени стоит первой, поэтому по префиксу выбираются все агентские спаны разом
  question: Почему соглашения ставят категорию перед именем агента (`invoke_agent editor`), а не наоборот (`editor invoke_agent`)?
  explanation: 'Постоянная часть впереди делает имя пригодным для префиксного фильтра: `invoke_agent*` соберёт всех агентов, `invoke_agent editor` — только одного. Если начинать с имени агента, общий фильтр по категории разваливается.'
  kind: choice
  options:
    - Потому что префикс `invoke_agent` даёт выборку сразу всех агентских спанов, а полное имя — выборку одного агента
    - Потому что бэкенды трассировки сортируют спаны по имени лексикографически и категория должна быть ключом сортировки
    - Потому что имя агента может содержать пробелы и обязано стоять в конце строки
    - Потому что первое слово имени спана бэкенд копирует в gen_ai.operation.name
