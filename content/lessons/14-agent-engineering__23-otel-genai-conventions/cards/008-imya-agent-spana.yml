  explanation: Нет имени — нет суффикса, только `invoke_agent`. Заглушки вроде `unknown`/`None` и незаполненный шаблон `{name}` создают в графиках фантомного агента с таким «именем», склеивая туда все безымянные прогоны из разных мест системы.
