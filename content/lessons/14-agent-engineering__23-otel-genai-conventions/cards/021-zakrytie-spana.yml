- concept: статус спана локален для этого спана и ошибка на дочернем не переводит родителя в ERROR
  question: В прогоне агента спан инструмента `fetch_page` закрылся со статусом ERROR по таймауту, повтор того же инструмента закрылся с OK, агент вернул пользователю корректный ответ и его спан закрылся. Какой статус будет у спана `invoke_agent`?
  explanation: 'Статус — свойство отдельного спана, выставляемое в момент его закрытия: OK по умолчанию, ERROR если из блока вылетело исключение. Автоматического распространения вверх нет. Именно поэтому в дереве видно успешный прогон с одним провалившимся шагом внутри: два спана инструмента (ERROR и OK) под спаном агента со статусом OK. Если бы статус поднимался, все прогоны с ретраями выглядели бы как отказы.'
  kind: choice
  options:
    - OK — статус каждого спана выставляется при его собственном закрытии и не наследуется от детей
    - ERROR — любой дочерний спан со статусом ERROR помечает всех родителей вверх по дереву
    - UNSET — при смешанных статусах детей родитель не может определить свой статус
    - ERROR у `invoke_agent`, но OK у корневого спана трассы, так как ошибка поднимается ровно на один уровень
  correct: 0
  id: 021-zakrytie-spana-1
  fingerprint: 4fc9b1b6
- concept: 'спаны закрываются в порядке, обратном открытию: дети раньше родителя, иначе длительность родителя не покрывает работу детей'
  question: Агент запускает спан `invoke_agent`, внутри него — спан `chat` на вызов модели, а внутри обработки ответа — спан инструмента `search_docs`. Расставьте закрытия спанов в правильном порядке.
  explanation: 'Закрытие идёт снизу вверх, обратно порядку открытия. Родитель обязан фиксировать время конца после того, как закончились все его дети: иначе он отчитается о длительности, в которую не входит работа, реально выполненная внутри него, и в дереве появится ребёнок, кончающийся позже родителя. Если агент отработал 6 200 мс, а `chat` внутри — 3 400 мс, корректный порядок закрытия — единственное, что гарантирует 6 200 ≥ 3 400.'
  kind: order
  items:
    - закрыть спан инструмента `search_docs`
    - закрыть спан `chat`
    - закрыть спан `invoke_agent`
  id: 021-zakrytie-spana-2
  fingerprint: 7c81b7bb
- concept: при завершении спана с ошибкой рядом со статусом ERROR записывается атрибут с типом исключения
  question: Спан инструмента завершается из-за вылетевшего исключения. Помимо статуса ERROR на спан кладётся имя класса ошибки (например, `TimeoutError`). Под каким ключом?
  explanation: Статус ERROR говорит только «упало», без указания на причину. Атрибут `error.type` несёт имя класса исключения, и по нему в бэкенде можно разделить таймауты, отказы авторизации и ошибки парсинга ответа — то есть разные способы починки. Без него все падения инструмента сливаются в одну строку дашборда.
  kind: cloze
  template: |-
    span.set_status("ERROR")
    span.attributes["___"] = type(exc).__name__
  answer: error.type
  accept:
    - error.type
    - '''error.type'''
    - '"error.type"'
  id: 021-zakrytie-spana-3
  fingerprint: 2640825f
