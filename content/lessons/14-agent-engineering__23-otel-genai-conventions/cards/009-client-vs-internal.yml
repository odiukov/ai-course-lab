- concept: вид агентского спана выбирается по тому, исполняется агент в вашем процессе или в удалённом сервисе
  question: Команда инструментирует четыре агентских рантайма. Для какого из них спан invoke_agent должен получить вид CLIENT?
  explanation: CLIENT ставится, когда прогон агента выполняется за границей процесса — удалёнными агентскими сервисами вроде OpenAI Assistants API или Bedrock Agents. CrewAI, LangChain и рукописный ReAct крутятся внутри вашего процесса, значит INTERNAL.
  kind: choice
  options:
    - Агент на CrewAI, собранный из ваших классов и исполняемый в том же процессе
    - Прогон агента через OpenAI Assistants API — управление циклом на стороне провайдера
    - Свой ReAct-цикл на 12 итераций, написанный вручную поверх SDK
    - Агент на LangChain, запускаемый внутри вашего воркера
  correct: 1
  id: 009-client-vs-internal-1
  fingerprint: 173f4c41
- concept: in-process оркестратор остаётся INTERNAL, даже если внутри ходит по сети — сетевой вызов уезжает в дочерний спан
  question: Агент на LangChain работает внутри вашего сервиса и за прогон делает 3 HTTP-вызова к чужому LLM API. Какие виды спанов корректны?
  explanation: Вид спана описывает границу процесса для той работы, которую спан покрывает. Сам прогон агента идёт в вашем процессе — INTERNAL. Уход по сети происходит в дочерних операциях модели, и именно они помечаются CLIENT.
  kind: choice
  options:
    - invoke_agent — CLIENT, потому что внутри есть сетевые вызовы
    - invoke_agent — INTERNAL, а вызовы модели — отдельные дочерние спаны CLIENT
    - invoke_agent — CLIENT, дочерние спаны модели — INTERNAL
    - Все спаны прогона — INTERNAL, раз оркестрация ваша
  correct: 1
  id: 009-client-vs-internal-2
  fingerprint: b5271332
- concept: вид спана делит одинаково выглядящую задержку на зону чужой ответственности и зону собственного кода, задавая разные способы починки
  question: Два спана называются invoke_agent planner и оба длятся 6.5 секунды. Зачем дежурному инженеру знать их вид спана и как он изменит действия?
  explanation: Одинаковые 6.5 s дают противоположные решения. Без kind инженер пойдёт профилировать свой код там, где тормозил удалённый сервис, и наоборот.
  kind: open
  reference: 'Имя и длительность не говорят, где потрачено время. CLIENT означает, что прогон ушёл за границу процесса в чужой агентский сервис: медленно — значит сетевые тайм-ауты, троттлинг или чужой сбой, лечится тайм-аутами, ретраями, деградацией. INTERNAL означает, что агент крутился в вашем процессе: медленно — виноват ваш код, надо профилировать оркестрацию. Поэтому по kind фильтруют дашборды и разводят зону чужой ответственности от собственной.'
  id: 009-client-vs-internal-3
  fingerprint: ee825b63
