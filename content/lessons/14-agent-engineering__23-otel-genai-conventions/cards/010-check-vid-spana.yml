- concept: вид спана выбирается для каждого агентского спана отдельно и не наследуется от родителя, поэтому в одной трассе соседствуют INTERNAL- и CLIENT-агенты
  question: In-process оркестратор Router сам оформлен как агентский спан и внутри вызывает субагента, который целиком исполняется в удалённом агентском сервисе провайдера. Спан субагента — дочерний к спану Router. Какие виды у этих двух спанов?
  explanation: Вид назначается спану по его собственной работе, а не по родителю и не по поддереву. Router крутится в вашем процессе — INTERNAL. Прогон субагента происходит за границей процесса — CLIENT. Именно поэтому в одной трассе спокойно уживаются оба вида, и по CLIENT-ветке видно вклад провайдера.
  kind: choice
  options:
    - 'Оба INTERNAL: дочерний спан наследует вид родителя'
    - Router — INTERNAL, субагент — CLIENT
    - 'Оба CLIENT: если где-то в поддереве есть сеть, вся ветка помечается CLIENT'
    - 'Router — CLIENT, субагент — INTERNAL: наружу торчит именно оркестратор'
