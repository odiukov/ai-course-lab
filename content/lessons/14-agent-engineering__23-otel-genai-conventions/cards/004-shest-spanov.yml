- concept: разница между длительностью родительского спана агента и суммой дочерних спанов — это время, проведённое в собственном коде оркестрации
  question: В трейсе одного прогона спан `invoke_agent` длится 20.0 с. Внутри него лежат спаны модели длительностью 3.2 с и 2.6 с и спаны инструментов длительностью 1.1 с, 5.3 с и 0.7 с. Сколько секунд ушло на код самого агента (сборка промпта, парсинг ответа, выбор инструмента)?
  explanation: Сумма дочерних спанов = 3.2+2.6+1.1+5.3+0.7 = 12.9 с. Родитель 20.0 с. Остаток 20.0-12.9 = 7.1 с нигде не нарисован отдельной полоской — это время между вызовами, то есть ваш собственный код. Большой остаток означает, что узкое место не в LLM и не во внешнем API, а в оркестрации.
  kind: numeric
  answer: 7.1
  tolerance: 0.05
  id: 004-shest-spanov-1
  fingerprint: dde12261
- concept: спан инструмента без проброшенного контекста теряет родительскую связь и становится сиротой
  question: Инструментация пишет спаны вызовов инструментов, но не пробрасывает контекст трассировки из спана агента. Что произойдёт с этими спанами в бэкенде?
  explanation: Родительскую связь несёт только контекст трассировки, никакой эвристики по времени бэкенд не применяет. Спан-сирота отображается как отдельная одинокая полоска — атрибуция задержки по прогону становится невозможной. Поэтому контекст надо пробрасывать во все вызовы инструментов.
  kind: choice
  options:
    - 'Они станут корнями отдельных трейсов: длительность видна, но к какому прогону агента относится вызов — нет'
    - Они будут отброшены коллектором как невалидные и не попадут в бэкенд
    - Бэкенд восстановит родителя по совпадению временных интервалов и имени сервиса
    - Они автоматически привяжутся к последнему спану `invoke_agent` в том же процессе
