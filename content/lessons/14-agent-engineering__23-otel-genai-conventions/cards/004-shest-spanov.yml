- concept: разбиение прогона на спаны модели и инструментов даёт атрибуцию задержки и определяет объект оптимизации
  question: 'Спан `invoke_agent` — 9.0 с. Внутри: спаны модели 0.8 с и 0.6 с, спаны инструментов 0.2 с, 7.1 с и 0.1 с. Что даёт этот трейс по сравнению с одной цифрой сквозной задержки?'
  explanation: Спаны модели дают 1.4 с, инструменты — 7.4 с, из них 7.1 с в одном вызове. Одна цифра сквозной задержки говорит «медленно», разбиение на категории спанов (агент / модель / инструмент) говорит, где именно, и указывает на конкретное лечение.
  kind: choice
  options:
    - Он показывает, что время съел вызов внешнего инструмента, а не LLM, — оптимизировать надо тайм-аут и кэш этого вызова, а не промпты
    - Он показывает, что модель работает медленно и нужна модель поменьше
    - Он показывает только суммарную задержку, разложение спанов на решение об оптимизации не влияет
    - Он показывает, что задержка целиком в коде агента, потому что спанов больше одного
