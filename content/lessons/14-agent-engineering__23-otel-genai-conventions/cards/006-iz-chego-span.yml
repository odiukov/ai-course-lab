- concept: спан хранит две абсолютные отметки времени (начало и конец), а длительность из них вычисляется
  question: Спан вызова инструмента начался в 09:12:41.250 и закончился в 09:12:44.100. Какова его длительность в секундах?
  explanation: 'Спан не несёт поля «длительность» — он несёт start и end как абсолютные метки, а длительность выводится вычитанием: 44.100 − 41.250 = 2.85 с. Хранение именно двух отметок, а не готового числа, позволяет ещё и выстраивать спаны на общей шкале: видно, шли ли два вызова параллельно, был ли зазор между ними и как дочерний спан ложится внутрь родительского.'
  kind: numeric
  answer: 2.85
  tolerance: 0.01
  id: 006-iz-chego-span-1
  fingerprint: b2887a0f
- concept: расход входных токенов записывается на спан как атрибут со стандартным ключом gen_ai.usage.input_tokens
  question: 'Дополни запись атрибута на спане вызова модели: на вход ушло 2450 токенов промпта.'
  explanation: 'Числа расхода токенов живут в четвёртом слоте спана — в атрибутах, парах «ключ — значение». Ключ берётся из соглашений GenAI: gen_ai.usage.input_tokens для промпта и gen_ai.usage.output_tokens для ответа. Рядом обычно стоит gen_ai.request.model, чтобы токены можно было пересчитать в деньги по нужному прайсу.'
  kind: cloze
  template: span.set_attribute("___", 2450)
  answer: gen_ai.usage.input_tokens
  accept:
    - gen_ai.usage.input_tokens
  id: 006-iz-chego-span-2
  fingerprint: 91f0d04b
- concept: 'kind спана кодирует границу процесса: работа внутри своего кода или обращение к внешнему сервису'
  question: Спан вызова модели корректно назван, имеет обе отметки времени и полный набор атрибутов GenAI, но kind не выставлен и остался значением по умолчанию (INTERNAL). Что именно перестаёт быть видно по такому спану?
  explanation: 'Длительность даёт пара времён, модель — атрибут gen_ai.request.model, родитель — контекст трассировки. А вот граница процесса кодируется только в kind: CLIENT означает исходящий вызов к внешнему сервису, INTERNAL — работу внутри собственного кода. С затёртым kind сетевой вызов LLM выглядит как локальное вычисление, и задержку списывают не на того.'
  kind: choice
  options:
    - Сколько времени заняла операция
    - Ушла ли работа за пределы процесса — к чужому API — или выполнялась своим кодом
    - Какая модель обслуживала запрос
    - К какому родительскому спану относится эта операция
  correct: 1
  id: 006-iz-chego-span-3
  fingerprint: a020b9dc
