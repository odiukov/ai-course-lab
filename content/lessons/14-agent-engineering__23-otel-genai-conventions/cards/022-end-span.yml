- concept: 'закрытие спана — набор обязательных действий: сверка с вершиной стека, отметка конца, вычисление длительности, статус, снятие со стека'
  question: Расставь шаги закрытия спана в трассировщике со стеком активных спанов в правильном порядке.
  explanation: 'Сверка с вершиной идёт первой: если закрывают не тот спан, дописывать в него поля бессмысленно. Отметка конца нужна раньше длительности, потому что длительность из неё считается. Снятие со стека — последним: пока спан не снят, он остаётся текущим родителем, и следующий открытый спан уедет не в ту ветку дерева.'
  kind: order
  items:
    - Проверить, что закрываемый спан находится на вершине стека активных спанов, иначе сигнализировать об ошибке порядка
    - Снять отметку времени конца тем же источником времени, которым бралось начало
    - Вычислить длительность как разность отметки конца и отметки начала
    - 'Записать статус спана: OK либо ERROR с сообщением'
    - Снять спан с вершины стека, чтобы следующий спан прицепился к правильному родителю
