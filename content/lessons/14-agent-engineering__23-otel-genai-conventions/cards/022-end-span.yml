- concept: статус — независимая от длительности координата исхода спана; без него одинаковые по времени успех и отказ неразличимы
  question: 'Два спана `chat` в трассах длятся по 2470 мс: первый вернул ответ модели, второй упал по таймауту провайдера. На спанах записаны время начала, время конца, длительность и атрибуты запроса. Почему дашборд показывает их одинаково?'
  explanation: 'Длительность отвечает на вопрос «сколько», статус — на вопрос «чем кончилось», и одно из другого не следует: отказ бывает и быстрым, и медленным. Поэтому при закрытии спана статус ставится явно — OK либо ERROR с коротким сообщением, — иначе доля ошибок по трейсам не считается вообще.'
  kind: choice
  options:
    - 'Нет статуса спана: исход — отдельное измерение, которое из длительности не выводится'
    - Потому что таймаут по определению даёт ту же длительность, что и успешный вызов
    - Потому что отсутствует атрибут gen_ai.response.model, а исход считается по нему
    - Потому что оба спана имеют одного родителя и агрегируются в одну полосу
