- concept: семантические соглашения GenAI — это спецификация словаря имён и атрибутов, а не исполняемая библиотека инструментации
  question: Что именно представляют собой семантические соглашения GenAI в OpenTelemetry?
  explanation: 'Соглашения — документ. Он фиксирует, как называется спан (`invoke_agent {gen_ai.agent.name}`), какие у него атрибуты (`gen_ai.provider.name`, `gen_ai.request.model`, `gen_ai.data_source.id`) и что в них кладут. Код пишут другие: SDK провайдеров, адаптеры фреймворков. Транспорт — отдельная вещь, это OTLP.'
  kind: choice
  options:
    - 'Спецификацию: согласованный словарь имён спанов и атрибутов, который реализуют сторонние SDK и фреймворки'
    - Готовую библиотеку инструментации, которую подключают к агенту вместо SDK провайдера
    - Формат хранения трейсов на диске бэкенда наблюдаемости
    - Протокол передачи спанов по сети вместо OTLP
  correct: 0
  id: 002-genai-sig-1
  fingerprint: ecdf7117
- concept: экспериментальный статус соглашений означает, что имена атрибутов могут переименоваться между версиями и молча обнулить дашборды
  question: Большая часть соглашений GenAI всё ещё имеет экспериментальный статус. Что это значит на практике для команды, которая уже построила дашборды на этих атрибутах?
  explanation: '«Экспериментальный» = имя может смениться между версиями. Ломается это тихо: запрос по старому имени просто ничего не находит, ошибки нет. Поэтому набор имён фиксируют явно через `OTEL_SEMCONV_STABILITY_OPT_IN`, а не после первого пустого графика.'
  kind: choice
  options:
    - Имена атрибутов могут переименовать в следующей версии, и после обновления коллектора или бэкенда графики окажутся пустыми
    - Атрибуты пишутся в спаны, но бэкенды обязаны их отбрасывать до выхода стабильной версии
    - Экспериментальные атрибуты хранятся меньший срок, чем стабильные, и удаляются раньше
    - Экспериментальные атрибуты нельзя использовать в проде, только в тестовом окружении
  correct: 0
  id: 002-genai-sig-2
  fingerprint: 49ad9fec
- concept: 'бэкенды потребляют один и тот же словарь по-разному: одни маппят атрибуты GenAI в собственную схему LLM-наблюдаемости, другие показывают их как сырые атрибуты'
  question: Агент пишет спаны по соглашениям GenAI. Что произойдёт с атрибутами вида `gen_ai.*` в разных бэкендах наблюдаемости?
  explanation: Словарь один, потребление разное. Datadog подтягивает атрибуты GenAI прямо в свою схему LLM Observability, Grafana, Jaeger и Honeycomb показывают их как сырые атрибуты спана. Смысл стандарта в том, что трейс читается везде — а насколько красиво, зависит от бэкенда.
  kind: choice
  options:
    - Часть бэкендов маппит их в собственную схему LLM-наблюдаемости, остальные отображают как обычные сырые атрибуты спана
    - Только бэкенды с поддержкой GenAI покажут спаны, у прочих трейс не отобразится вообще
    - Все бэкенды обязаны реализовать одинаковый LLM-интерфейс, иначе не проходят сертификацию OpenTelemetry
    - Атрибуты `gen_ai.*` видны только через экспортёр вендора модели, а не через OTLP
  correct: 0
