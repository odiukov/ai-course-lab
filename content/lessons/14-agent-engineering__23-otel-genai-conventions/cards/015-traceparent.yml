- concept: в заголовке traceparent span_id — идентификатор спана-отправителя, и именно он становится parent_id у спана получателя
  question: Сервис A по HTTP вызывает сервис B и передаёт заголовок traceparent. Какую часть заголовка сервис B обязан использовать как parent_id создаваемого им спана?
  explanation: 'trace_id склеивает все спаны в одну трассу, но не задаёт иерархию. Ветку задаёт span_id отправителя: для получателя это ссылка на родителя. Если получатель проигнорирует span_id, его спан попадёт в верную трассу, но повиснет без родителя.'
  kind: choice
  options:
    - trace_id — идентификатор всего прогона
    - span_id — идентификатор спана, активного у отправителя в момент вызова
    - байт флагов
    - поле версии формата
  correct: 1
  id: 015-traceparent-1
  fingerprint: 33e4057a
- concept: флаг sampled переносит решение о сборе трейса от корня ко всем участникам цепочки, чтобы трасса не собралась наполовину
  question: В traceparent последний байт — флаги, младший бит которых означает sampled. Зачем этот бит вообще едет по сети вместе с идентификаторами?
  explanation: 'Если бы каждый сервис решал сам, часть спанов одной трассы экспортировалась бы, а часть нет — на выходе получилось бы дырявое дерево, по которому нельзя считать длительности. Бит sampled распространяет единое решение: сброшен — downstream не тратит ресурсы на экспорт.'
  kind: choice
  options:
    - Чтобы каждый сервис заново принимал собственное решение о сэмплировании
    - Чтобы решение о том, записывается трасса или отбрасывается, принималось один раз выше по цепочке и соблюдалось всеми участниками
    - Чтобы получатель мог проверить целостность trace_id
    - Чтобы бэкенд знал, какой вендор инструментации сгенерировал заголовок
  correct: 1
  id: 015-traceparent-2
  fingerprint: 8c8a62f1
- concept: 'контекст трассы пересекает границу процесса только в сериализованном виде: его пишут в carrier запроса и разбирают на другой стороне'
  question: Расставьте по порядку шаги проброса контекста трассы через вызов удалённого сервиса по HTTP.
  explanation: 'Ссылка на родителя живёт в памяти вызывающего процесса и через сеть не переезжает. Поэтому её приходится записывать текстом в carrier (заголовок), а на приёме разбирать обратно в контекст. Пропуск любого шага рвёт дерево: без записи получатель стартует новую трассу, без разбора — сирота внутри правильной трассы.'
  kind: order
  items:
    - Клиент сериализует активный контекст (trace_id и span_id текущего спана) в строку traceparent
    - Клиент кладёт эту строку в заголовок исходящего HTTP-запроса
    - Сервер извлекает и разбирает заголовок traceparent из входящего запроса
    - Сервер создаёт свой спан, подставляя span_id из заголовка как parent_id
  id: 015-traceparent-3
  fingerprint: 804de206
