- concept: выбор между изменением и отказом определяется тем, отделима ли допустимая часть цели от недопустимой
  question: Решатель нашёл конфликт в предложенном действии. По какому признаку он выбирает между изменённым вариантом и отказом?
  explanation: Третий исход существует ради отделимой части цели. Если вся ценность действия держится на недопустимой части, безопасная версия перестаёт быть помощью — тогда честнее отказ.
  kind: choice
  options:
    - Изменение — если недопустимую часть можно убрать, сохранив полезное намерение; отказ — если безопасная версия уже не решает исходную задачу
    - Изменение — если оценка полезности высокая; отказ — если низкая
    - Изменение — при нарушении нижних уровней; отказ — при любом нарушении верхних
  correct: 0
  id: 016-three-outcomes-1
  fingerprint: b4cd4845
- concept: изменённый вариант проверяется по тому, какое действие в итоге произойдёт, а не по переформулировке запроса
  question: Запрошено действие с публикацией чужих личных телефонов. Какой из «изменённых» вариантов на самом деле не является изменением?
  explanation: 'Мелкий шрифт меняет оформление, а исполняемое действие остаётся прежним: номера всё равно публикуются. Изменение засчитывается только тогда, когда конфликт исчезает из самого действия, а не из его описания.'
  kind: choice
  options:
    - Оставить описание вакансии, убрать номера и добавить форму записи
    - Опубликовать те же номера, но мелким шрифтом внизу объявления
    - Заменить прямые номера на общий контакт организатора
  correct: 1
  id: 016-three-outcomes-2
  fingerprint: bbf04951
- concept: третий исход выполняет допустимую часть цели вместо бинарного «да/нет» и потому снижает долю глухих отказов
  question: Объясни своими словами, что даёт решателю третий исход «изменить действие» по сравнению с системой, где есть только разрешение и отказ.
  explanation: Бинарная схема платит за безопасность ложными отказами. Третий исход снимает часть этой платы, но только когда исправленная версия действительно устраняет конфликт.
  kind: open
  reference: 'При двух исходах любое частично проблемное действие целиком проваливается в отказ, хотя допустимая часть цели остаётся выполнимой. Изменение позволяет удалить недопустимую часть и выполнить остальное: пользователь получает помощь, а нарушение не происходит. Так выравнивание перестаёт работать только как запрет и начинает участвовать в решении задачи.'
  id: 016-three-outcomes-3
  fingerprint: 9a93c1eb
