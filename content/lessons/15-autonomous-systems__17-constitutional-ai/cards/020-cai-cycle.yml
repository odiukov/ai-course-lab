- concept: 'последовательность стадий обучения Constitutional AI: генерация, критика по принципам, переписывание, обучение на предпочтении'
  question: Расположи стадии обучения безвредности методом Constitutional AI в порядке их выполнения.
  explanation: 'Каждая стадия потребляет выход предыдущей: критиковать нечего без ответа, переписывать нечего без диагноза, а обучающая пара существует только после правки. Перестановка ломает конвейер: RLAIF без переписывания получил бы лишь метку «плохо» без образца лучшего поведения.'
  kind: order
  items:
    - Модель генерирует ответы на набор запросов
    - Модель критикует каждый ответ по записанным принципам
    - Модель переписывает ответ с учётом критики
    - На парах «исходный ответ — исправленный ответ» запускается RLAIF
  id: 020-cai-cycle-1
  fingerprint: bfbd0938
- concept: человеческий вклад сосредоточен в тексте принципов, а разметка отдельных примеров производится моделью
  question: Команда собирает обучающие данные методом Constitutional AI для набора из 12 000 запросов. Где в этом процессе требуется работа человека?
  explanation: Смысл метода — заменить дорогую человеческую разметку каждого примера на один написанный людьми документ. Один набор принципов разворачивается в сколько угодно обучающих пар, поэтому объём человеческого труда не растёт вместе с числом запросов.
  kind: choice
  options:
    - Человек пишет текст принципов; критику и правки по всем запросам генерирует модель
    - Человек размечает каждую пару ответов как лучшую или худшую, модель только генерирует тексты
    - Человек пишет критику, а модель выполняет только переписывание
    - Человек проверяет каждую правку перед попаданием пары в обучение
  correct: 0
  id: 020-cai-cycle-2
  fingerprint: cc6530be
- concept: обучающим сигналом служит пара «исходный — исправленный», а не бинарная метка вредности
  question: Почему для обучения используют пару «исходный ответ — его исправленная версия», а не просто метку «этот ответ вредный»?
  explanation: 'Отсюда и характер результата: модель отказывает с объяснением по принципу и сохраняет безопасную помощь, а не выдаёт «не могу» на любой сложный запрос.'
  kind: open
  reference: 'Метка сообщает только, что ответ отвергнут, но не показывает, каким он должен быть: пространство «не таких» ответов огромно, и глухой отказ тоже ему удовлетворяет. Пара задаёт направление: два текста отличаются ровно тем, что нарушение устранено, а остальное содержание сохранено, поэтому предпочтение исправленного варианта учит модель конкретному исправлению, а не общему избеганию темы.'
  id: 020-cai-cycle-3
  fingerprint: dc0410bc
