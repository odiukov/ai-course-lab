- concept: цель иерархии — предсказуемое разрешение конфликтов, а не оптимальное поведение по какой-то одной оси
  question: Иерархия приоритетов не гарантирует, что модель поведёт себя наилучшим образом с точки зрения пользы, честности или безопасности по отдельности. Что она тогда даёт? Объясни своими словами.
  explanation: 'Отсюда и следствие: полезность на нижнем уровне проигрывает этическому возражению не иногда, а всегда — иначе порядок перестал бы быть порядком.'
  kind: open
  reference: 'Она даёт детерминированный ответ на вопрос «что делать, когда оба варианта плохи», без обращения к человеку и без спора о том, что важнее. Это та же конструкция, что приоритеты процессов в Unix или классы QoS в сети: заранее объявленный порядок, по которому конфликт разрешается одинаково каждый раз. Ценность здесь в предсказуемости и проверяемости решения — по любому конфликту можно сказать, какой уровень выиграл и почему, — а не в том, что результат максимален по какой-то одной оси.'
  id: 011-four-tiers-3
  fingerprint: 564206f0
