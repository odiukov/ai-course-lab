- concept: ранний выход по абсолютному запрету означает, что операторские настройки и оценки вообще не участвуют в решении
  question: В маршруте решателя проверка абсолютных запретов стоит до применения операторских настроек и до ранжирования уровней. Что даёт именно такой порядок?
  explanation: Порядок вызовов кодирует силу ограничения. Если бы настройки применялись раньше, конфигурация получила бы шанс изменить вход блокирующей проверки. Ранний возврат отказа делает эту ветку недостижимой.
  kind: choice
  options:
    - 'Ускорение: дорогие проверки выполняются реже'
    - 'Непереопределяемость: настройки и оценки не успевают повлиять на сработавший абсолютный запрет'
    - Возможность оператору смягчить запрет, если этого требует развёртывание
  correct: 1
  id: 017-resolve-1
  fingerprint: f84a217b
- concept: resolve не содержит правил, а маршрутизирует готовые проверки в фиксированной последовательности стадий
  question: Расставь стадии функции resolve в правильном порядке.
  explanation: 'Каждая стадия — вызов отдельной, уже написанной функции. Сам маршрут не изобретает правил: его ответственность — порядок, ранний выход и выбор исхода по найденному уровню.'
  kind: order
  items:
    - Проверить предложенное действие блокирующей проверкой абсолютных запретов и при срабатывании вернуть отказ
    - Применить допустимые операторские настройки поверх значений по умолчанию
    - Найти первый нарушенный уровень в порядке приоритета
    - 'Выбрать исход: разрешить, отказать или вернуть изменённое действие'
  id: 017-resolve-2
