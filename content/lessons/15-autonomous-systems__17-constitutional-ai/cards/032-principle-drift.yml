  fingerprint: 35d026e8
- concept: 'стабильность формулировки не равна стабильности принципа: смысл задаётся тем, как принцип делит реальные случаи'
  question: Формулировка принципа не менялась ни в одной версии конституции. Почему из этого не следует, что поведение модели по этому принципу осталось прежним?
  explanation: 'Отсюда и практический вывод: контроль версий документа не отслеживает дрейф. Нужен контроль поведения.'
  kind: open
  reference: 'Принцип работает не как текст, а как граница между случаями, где он требует отказа, и случаями, где не требует. Обучение меняет то, как модель классифицирует пограничные ситуации: что она считает личными сведениями, что — достаточным основанием. Формулировка при этом та же, а разделение случаев другое. Текст стабилен ровно настолько, насколько стабильно его применение.'
  id: 032-principle-drift-2
  fingerprint: 3b185399
- concept: единичный ответ не отличает дрейф от случайного разброса — сигналом служит устойчивость сдвига по повторяемому набору
  question: После очередного цикла обучения модель один раз ответила на пограничный запрос мягче, чем раньше. Что это доказывает о дрейфе трактовки?
  explanation: 'Именно защитимость каждого отдельного ответа делает дрейф незаметным. Вывод строится на систематике: одна и та же граница раз за разом проводится в новом месте на неизменной подборке случаев.'
  kind: choice
  options:
    - 'Дрейф произошёл: изменение поведения зафиксировано'
    - 'Почти ничего: отдельный ответ обычно можно разумно защитить, дрейф виден только как устойчивый сдвиг на серии повторов'
    - 'Дрейфа нет: пока текст конституции прежний, поведение по определению прежнее'
