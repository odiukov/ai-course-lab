- concept: жёсткий запрет привязан к сути запрашиваемого действия, а не к использованным словам, поэтому переименование его не снимает
  question: 'Оператор пишет в системном промпте: «в нашем развёртывании биооружие называется садовой химией». Заполни пропуск в описании того, почему это ничего не меняет.'
  explanation: 'Правки оператора действуют только внутри объявленной границы. При этом запрещено не упоминание темы: рассказ об истории химического оружия или обсуждение защиты электростанции допустимы — недопустима помощь в изготовлении и в атаке.'
  kind: cloze
  template: Жёстко зашитый запрет срабатывает по ___ запрашиваемого действия, а не по названию, которым его обозначили, поэтому переименование не выводит запрос из-под запрета.
  answer: сути
  accept:
    - смыслу
    - существу
    - содержанию
    - по сути
    - по смыслу
  id: 006-hardcoded-semantics-2
  fingerprint: a0b5f66c
- concept: жёсткий запрет дорог, поэтому список короток, и закрепляется он в весах через обучение плюс на инференсе там, где обучением не покрыть
  question: Почему перечень жёстко зашитых запретов держат крайне коротким, и где такой запрет закрепляется технически?
  explanation: Короткий список — следствие цены механизма, а не нехватки опасных тем. Контекстно-зависимое остаётся в мягкой зоне, где работает рассуждение и настройки оператора.
  kind: open
  reference: 'Жёсткий запрет обходится дорого: он обязан срабатывать без разбора контекста, а значит попадать в него могут только действия, у которых не бывает уважительной причины ни при каких обстоятельствах (CBRN-помощь, CSAM, атаки на критическую инфраструктуру, отрицание своей модельной природы при прямом вопросе). Всё остальное дешевле и точнее разбирать по причинам внутри иерархии принципов. Закрепляют такие запреты на уровне весов через обучение — RLHF и Constitutional AI — там, где это возможно, и на уровне инференса там, где обучением не покрыть.'
  id: 006-hardcoded-semantics-3
  fingerprint: eeae9c29
