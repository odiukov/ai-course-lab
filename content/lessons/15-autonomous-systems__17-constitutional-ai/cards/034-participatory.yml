- concept: 'широкий опрос не делает набор принципов верным, но показывает, что авторство конституции — вопрос управления: кто задаёт правила и можно ли решение пересмотреть'
  question: Компания опросила широкую выборку жителей и получила альтернативный набор принципов, совпадающий с внутренним лишь частично. Что из этого следует?
  explanation: 'Участие публики не наделяет её вариант истинностью. Значимо другое: раз состав авторов заметно меняет набор принципов, корпоративный список нельзя подавать как нейтрально найденную истину — и тогда важна процедура, а не только текст.'
  kind: choice
  options:
    - Публичная версия автоматически верна и должна заменить внутреннюю
    - Опрос не относится к конституции, поскольку принципы выводятся формально
    - 'Правоты из опроса не следует, но следует, что выбор принципов — управленческий вопрос: чьи ценности представлены, кто решает и можно ли решение пересмотреть'
