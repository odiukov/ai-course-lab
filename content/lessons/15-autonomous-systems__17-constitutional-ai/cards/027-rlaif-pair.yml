- concept: пара сравнима только когда оба кандидата отвечают на один и тот же запрос
  question: Почему в паре предпочтений оба кандидата должны быть ответами на один и тот же запрос?
  explanation: Сравнение изолирует один фактор — как отвечать на данный запрос. При разных запросах «победитель» может выигрывать просто потому, что его запрос был проще или безобиднее, и модель выучит не то различие.
  kind: choice
  options:
    - Иначе разница между ними смешивает качество ответа с разницей самих запросов, и обучающий сигнал теряет смысл
    - Иначе пара не поместится в контекстное окно модели вознаграждения
    - Иначе нельзя посчитать численную оценку каждого кандидата
    - Иначе критика не сможет найти нарушение ни в одном из ответов
