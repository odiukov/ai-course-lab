- concept: обучение на предпочтениях сдвигает распределение по многим парам, а одна пара не задаёт правило поведения
  question: Собрано 40 000 пар «нарушающий ответ — исправленный ответ». Объясни своими словами, что делает с моделью обучение на таком наборе и почему одна отдельная пара практически ничего не меняет.
  explanation: 'Ключевое: предпочтения меняют вероятности, а не добавляют пункт в перечень запретов. Отсюда и масштаб набора — сдвиг поведения складывается из множества согласованных сравнений.'
  kind: open
  reference: 'Обучение поднимает вероятность ответов, похожих на победителей, и снижает вероятность ответов, похожих на проигравших. Это статистический сдвиг распределения, а не запись правила: градиент от одной пары мал, а обобщается не конкретный текст, а признаки, общие для многих победителей (отказ от опасной части, объяснение причины, сохранение полезного). Поэтому нужен большой и разнообразный набор пар: на отдельной паре модель либо ничего не выучит, либо запомнит случайную особенность именно этих двух текстов.'
