- concept: цена обобщения — аудит смещается с проверки совпадения на оценку корректности трактовки
  question: Почему решение агента, выровненного по принципам, труднее проверить постфактум, чем решение по перечню запретов?
  explanation: 'Обобщение и аудируемость обмениваются друг на друга: чем шире принцип, тем больше пространство возможных неверных суждений и тем дороже их проверка.'
  kind: open
  reference: 'У перечня проверка бинарна: либо запрос совпал с пунктом, либо нет, и это видно со стороны. У принципа проверять приходится цепочку суждения: верно ли модель установила факты, тот ли принцип выбрала, не растянула ли его слишком широко. Ошибка переезжает из покрытия списка в трактовку — например, законное восстановление собственного аккаунта принимается за взлом и получает отказ. Такие сбои не ловятся сверкой с текстом правил, нужен разбор рассуждения и обстоятельств случая.'
  id: 003-reason-based-2
  fingerprint: be572976
