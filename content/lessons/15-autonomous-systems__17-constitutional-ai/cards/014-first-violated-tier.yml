- concept: функция итерируется по фиксированной последовательности уровней и возвращает уровень на первом же найденном нарушении
  question: 'Заполни пропуск: функция должна вернуть уровень, на котором остановился обход.'
  explanation: Обход идёт по кортежу уровней в порядке приоритета, а `return tier` даёт ранний выход на первом сработавшем уровне. Возврат самого `violations.get(tier)` вернул бы признак, а не имя уровня.
  kind: cloze
  template: |-
    def first_violated_tier(violations):
        for tier in ("oversight", "ethics", "guidelines", "helpfulness"):
            if violations.get(tier):
                return ___
        return None
  answer: tier
  accept:
    - tier
  id: 014-first-violated-tier-1
  fingerprint: af6e2e1c
- concept: 'инвариант функции: перестановка отметок во входных данных не меняет результат, потому что порядок берётся из кода, а не из входа'
  question: На вход подан словарь отметок о нарушениях. Тесты перетасовывают порядок его ключей и ждут прежнего ответа. Какая реализация даёт этот инвариант?
  explanation: Порядок приоритета — свойство иерархии, а не входных данных. Если он зашит в код, перестановка ключей ничего не меняет. Алфавитная сортировка дала бы порядок ethics, guidelines, helpfulness, oversight — то есть неверный.
  kind: choice
  options:
    - Перебор ключей входного словаря и возврат первого с отметкой
    - Перебор собственного списка уровней в порядке приоритета и обращение к входу по имени
    - Сортировка ключей входного словаря по алфавиту перед перебором
  correct: 1
  id: 014-first-violated-tier-2
  fingerprint: fbd09b82
- concept: «нарушений нет» — отдельный исход функции, а не самый нижний уровень
  question: Ни одна отметка о нарушении не выставлена. Что корректно вернуть из функции поиска первого нарушенного уровня?
  explanation: Возврат уровня означал бы найденное нарушение. Полезность как значение по умолчанию заставила бы вызывающий код искать несуществующий конфликт, а верхний уровень породил бы ложные отказы.
  kind: choice
  options:
    - Самый нижний уровень (полезность) как значение по умолчанию
    - Самый высокий уровень, чтобы вызывающий код перестраховался
    - Пустое значение — признак того, что нарушенного уровня нет
  correct: 2
  id: 014-first-violated-tier-3
  fingerprint: 05a36f1c
