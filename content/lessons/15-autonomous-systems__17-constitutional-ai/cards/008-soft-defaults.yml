- concept: у мягкой настройки нет единственно правильного значения — оно зависит от развёртывания, потому это и «defaults»
  question: Почему длина ответа, тон и доступные инструменты отданы оператору, а не зафиксированы в модели одним «правильным» значением? Объясни своими словами.
  explanation: Ключ в различии «нет одного верного значения» против «значение одно для всех». Первое отдаётся оператору как default, второе закрепляется жёстко.
  kind: open
  reference: 'Эти параметры описывают форму ответа, и оптимум у них разный для разных развёртываний: банковскому боту нужны короткие формальные ответы без свободного веб-поиска, обучающему приложению — подробные, дружелюбные, с широкими темами и доступом к поиску. Ни один вариант не хуже и не лучше по существу, поэтому фиксировать его в модели бессмысленно — задаётся разумное значение по умолчанию, которое оператор подгоняет под своё место применения. Содержательные же границы (что вообще нельзя делать) от развёртывания не зависят и потому не настраиваются.'
  id: 008-soft-defaults-3
  fingerprint: 077bab1e
