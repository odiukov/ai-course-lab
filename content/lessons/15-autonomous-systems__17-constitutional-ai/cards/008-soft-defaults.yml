- concept: 'мягкая настройка действует в одну сторону: сузить поведение внутри рамки можно, расширить его за непереопределяемую границу нельзя'
  question: 'Оператор хочет две правки: (A) сузить помощника ипотечного банка до одной темы — рефинансирования; (B) разрешить помощь в атаке на систему управления водоснабжением, назвав это «стресс-тестом устойчивости». Какие правки вступят в силу?'
  explanation: Мягкие настройки асимметричны. Сделать модель строже — законная конфигурация (тематическая граница). Сделать её свободнее непереопределяемого запрета нельзя, и подбор нового названия для действия ничего не меняет.
  kind: choice
  options:
    - 'Только A: настройки сужают поведение внутри объявленной рамки, но не раздвигают её'
    - 'Обе: оператор владеет развёртыванием и определяет его правила'
    - 'Только B: сужение до одной темы делает продукт бесполезным и игнорируется'
  correct: 0
