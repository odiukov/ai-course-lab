- concept: 'два встречных ограничения на список правил: покрытие требует длины, быстрый инференс требует краткости'
  question: Объясни своими словами, почему требования «покрыть редкие случаи» и «решать быстро при ограниченных вычислениях» тянут список правил в противоположные стороны.
  explanation: 'Ключ — что это два независимых давления на одну и ту же структуру: полнота требует длины, дешёвый инференс требует краткости, и оба выполнить перечислением нельзя.'
  kind: open
  reference: Чтобы закрыть редкие случаи, список приходится удлинять — добавлять условия, исключения и правила о приоритете конфликтующих пунктов. Но каждое условие надо проверить и сопоставить с ситуацией на инференсе, а это время и вычисления. Короткий список применяется быстро, но оставляет пробелы; длинный покрывает больше, но становится медленным, внутренне противоречивым и всё равно не описывает следующее невиданное сочетание. Отсюда переход к выравниванию по принципам, где один принцип заменяет ветвящееся дерево частных запретов.
