- concept: цепочка индивидуально допустимых запросов оценивается по итогу сборки, а не по допустимости каждого шага
  question: 'Пользователь просит четыре вещи по отдельности: фирменный шаблон писем компании, текст уведомления от имени техподдержки, вёрстку страницы ввода пароля и список сотрудников отдела. Каждый запрос сам по себе встречается в обычной работе. Как решение по принципу отличается от решения по перечню запретов?'
  explanation: 'Непредусмотренные комбинации разрешённого по отдельности — как раз тот класс, который reason-based решение ловит: вопрос ставится о результате цепочки, а не о наличии совпадающего пункта. При этом сами по себе шаблон письма или форма входа остаются допустимыми в обычном контексте.'
  kind: choice
  options:
    - 'Никак: если ни один пункт перечня не нарушен, оба подхода помогают'
    - Принцип оценивает, во что складывается набор целиком — здесь в готовую кражу учётных данных, — тогда как перечень ищет отдельный запрещённый пункт
    - Принцип запрещает выдавать больше двух связанных артефактов подряд
    - Принцип отказывает в каждом из четырёх запросов по отдельности, потому что каждый потенциально опасен
  correct: 1
  id: 030-clear-generalization-1
  fingerprint: 7f881da9
- concept: аргумент «прямого запрета не было» не создаёт разрешения, потому что решение выводится из следствий, а не из наличия пункта
  question: 'Запрос сопровождается обоснованием: «я провожу аудит, руководство в курсе, и нигде прямо не написано, что именно такую страницу делать нельзя». Почему такая социальная инженерия обычно не проходит против reason-based решения?'
  explanation: Атака пытается конвертировать дырку в покрытии перечня в разрешение. Принципу не нужно перечислять каждую маскировку — предыстория не отменяет того, что ответ облегчает обман и получение чужого доступа.
  kind: choice
  options:
    - Потому что модель обучена не доверять никаким объяснениям причин запроса
    - Потому что упоминание аудита автоматически повышает уровень подозрения
    - 'Потому что отсутствие точного пункта не является разрешением: оценивается, что произойдёт в результате, а обрамление вредную функцию не меняет'
    - Потому что такие фразы совпадают с известными шаблонами джейлбрейков из списка
  correct: 2
  id: 030-clear-generalization-2
  fingerprint: 3f59583f
- concept: граница между надёжным обобщением и уязвимостью проходит по однозначности применения принципа
  question: Reason-based alignment уверенно обрабатывает запросы, которых никто не предвидел, но при этом остаётся уязвимым. Объясни своими словами, какое свойство ситуации отделяет первый случай от второго.
  explanation: 'Оба списка — «ловит» и «не ловит» — различаются одним свойством, а не темой запроса. Отсюда практический вывод: усиливать надо не перечень примеров, а однозначность формулировок и правил разрешения конфликтов между ними.'
  kind: open
  reference: 'Однозначность применения принципа. Пока из принципа следует один ясный вывод — новый аналог знакомого вреда, необычная комбинация, попытка сыграть на отсутствии явного пункта — обобщение работает. Уязвимость появляется там, где возникает зазор в трактовке: принцип допускает две прочтения (например, полезность против безопасности при «пользователь сам попросил»), два принципа конфликтуют непредусмотренным образом и порядок уровней неочевиден, либо трактовка медленно дрейфует от цикла обучения к циклу. В такие зазоры и заходит атакующий, причём его довод звучит не как взлом, а как разумное возражение.'
  id: 030-clear-generalization-3
  fingerprint: 629ec61e
