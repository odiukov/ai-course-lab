- concept: при подмене посылки отказывают входные данные рассуждения, а не применение принципа
  question: Модель получила запрос с выдуманным утверждением о профессиональном статусе пользователя, корректно применила принцип «помогай специалистам» и выдала вредную инструкцию. Где сбой?
  explanation: 'Атака идёт не по правилу, а по входу для правила. Поэтому ужесточение формулировок этот класс не закрывает: любой принцип, опирающийся на описание ситуации, уязвим, пока описание задаёт сам пользователь.'
  kind: choice
  options:
    - В формулировке принципа — её надо переписать строже
    - 'В посылке: вывод верно получен из ложного описания ситуации'
    - 'В цепочке рассуждения: модель пропустила шаг применения принципа'
  correct: 1
  id: 035-false-premises-1
  fingerprint: cb84c3a1
- concept: в критичной зоне решение не должно зависеть от утверждений, которые пользователь может просто написать сам
  question: Почему часть поведения закрепляют жёстко зашитым запретом вместо того, чтобы оставить её разбору по причинам? Объясни своими словами.
  explanation: 'Так делится нагрузка двух слоёв: рассуждение обобщает на непредвиденное, жёсткий слой не гнётся под подмену входных данных.'
  kind: open
  reference: 'Разбор по причинам работает с описанием ситуации, а описание поставляет пользователь и может его выдумать: лицензия, роль, утверждённое исследование, самовыданное разрешение. Там, где цена ошибки недопустима, решение не должно зависеть от непроверяемой посылки, поэтому проверка выносится по сути запрашиваемого действия и вообще не спрашивает, кто перед ней. Остальной длинный хвост неоднозначных случаев остаётся рассуждению.'
  id: 035-false-premises-2
  fingerprint: be2f58fe
