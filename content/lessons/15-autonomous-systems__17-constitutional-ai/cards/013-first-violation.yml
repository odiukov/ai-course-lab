- concept: после фиксации нарушения на верхнем уровне нижние замечания перестают влиять на классификацию конфликта
  question: Проверка ответа дошла до уровня этики и нашла манипулятивную формулировку. Ниже обнаружились ещё и нарушение guidelines, и слабая полезность. Как это меняет классификацию главного конфликта?
  explanation: Классификация фиксируется на первом сверху нарушенном уровне. Дополнительные нижние проблемы можно перечислить в разборе, но они не переопределяют, о чём именно спор.
  kind: choice
  options:
    - 'Никак: главный конфликт остаётся этическим, нижние замечания остаются отдельными замечаниями'
    - Главным становится тот уровень, где нарушений больше
    - Классификация переходит к полезности как к самому конкретному уровню
