- concept: вклад отдельного уровня приоритета измеряется абляцией — перестановкой уровня в коде и сравнением множества входов, изменивших исход, а не одним прогоном
  question: Ты хочешь узнать, насколько уровень «этика» реально влияет на поведение решателя. Опиши процедуру измерения и объясни, почему одного тестового запроса недостаточно.
  explanation: 'Порядок уровней — строчка кода, а не декларация. Проверяется он дифференциально: меняешь одну строчку и смотришь на множество изменившихся исходов. Совпадение исхода на отдельном кейсе не говорит ни о чём — кейс мог не дойти до изменённого уровня.'
  kind: open
  reference: 'Абляция: взять фиксированный набор запросов (скажем, 240 конфликтных кейсов), прогнать через исходный решатель, записать исход по каждому. Затем изменить одну вещь — поднять полезность выше этики в порядке уровней — и прогнать тот же набор. Сравнивать не итоговые доли отказов, а поимённый diff: список кейсов, у которых исход поменялся, и направление изменения. Именно этот список показывает, что удерживал уровень. Один запрос недостаточен по двум причинам: (1) исход по нему может совпасть в обеих конфигурациях, потому что кейс разрешался нижними уровнями и до этики вообще не доходил; (2) единичный результат не отличает эффект перестановки от разброса самой модели — нужен повторяемый набор, чтобы сдвиг был устойчивым, а не случайным.'
  id: 037-final-quiz-2
  fingerprint: 99f669c2
