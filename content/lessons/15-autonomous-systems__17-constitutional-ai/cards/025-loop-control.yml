- concept: 'чистая проверка и исчерпание лимита — исходы с разной гарантией: один подтверждает соответствие, другой лишь останавливает процесс'
  question: Цикл критики и правки ограничен пятью раундами. В одном прогоне он завершился чистой критикой, в другом — упёрся в лимит. Чем эти два исхода отличаются по смыслу?
  explanation: 'Лимит — предохранитель от бесконечной самопроверки, а не знак качества. Правки могут ходить по кругу: одна чинит A, следующая ради B возвращает A. На выходе отдают последнюю версию и причину остановки, чтобы дальше решал внешний контур.'
  kind: choice
  options:
    - 'Ничем: оба означают, что финальная версия соответствует конституции'
    - Чистая критика означает, что нарушений не найдено; лимит означает только остановку — последняя версия может нарушать принципы
    - 'Лимит сильнее: он означает, что модель перебрала все возможные правки и выбрала лучшую'
    - Чистая критика означает остановку без результата, а лимит — успешное завершение
