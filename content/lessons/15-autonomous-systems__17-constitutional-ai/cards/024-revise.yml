- concept: стадия правки возвращает только текст ответа, потому что её выход — вход следующего этапа конвейера
  question: Функция правки возвращает исправленный ответ вместе с пояснением, что и почему было изменено. Чем это мешает?
  explanation: Выход стадии переписывания используется как предпочитаемый вариант в паре для RLAIF и как вход для возможного следующего прохода. Примесь метакомментария обучает модель писать такие комментарии в обычных ответах. Прозрачность обеспечивает критика, которая хранится отдельно.
  kind: choice
  options:
    - Ничем, пояснение полезно для прозрачности процесса
    - 'Возвращённая строка перестаёт быть ответом пользователю: в обучающую пару и в следующий проход попадёт текст со служебными рассуждениями о редактировании'
    - Пояснение противоречит принципам конституции
  correct: 1
