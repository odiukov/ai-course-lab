- concept: задание на правку адресует конкретный дефект, иначе модель режет не то и не столько
  question: Вместо передачи критики стадии правки дают инструкцию «сделай этот ответ безопаснее». Каков типичный результат?
  explanation: Критика указывает, где резать, а исходный ответ — что сохранить. Без первого модель ориентируется на общее ощущение опасности, а оно распределено по всему тексту, и правка расползается.
  kind: choice
  options:
