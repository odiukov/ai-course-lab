- concept: выбор победителя берётся из происхождения ответа (он прошёл цикл критики и правки), а не из измерения свойств текста
  question: Откуда сборщик пары предпочтений знает, какой из двух ответов предпочтительный?
  explanation: Выбор уже сделан предыдущей стадией конвейера. Если сборщик начнёт судить по признакам текста, он введёт второй, независимый и неаудируемый критерий — и пары начнут расходиться с конституцией, по которой их строили.
  kind: choice
  options:
    - 'Из происхождения: победитель — тот, что создан правкой для устранения найденного нарушения принципа'
    - 'Из измерения текста: победителем становится более длинный и вежливо сформулированный ответ'
    - Из повторного вызова критики на обоих ответах и сравнения числа замечаний
    - Из численной оценки полезности, которую сборщик считает для каждого ответа
