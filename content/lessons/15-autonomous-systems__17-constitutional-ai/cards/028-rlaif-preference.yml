- concept: пара, где победитель и проигравший совпадают, вырождена и не несёт обучающего сигнала
  question: Критика не нашла нарушений, поэтому цикл вернул ответ без изменений, и в пару предпочтения попали два одинаковых текста. Объясни, что даст такая пара при обучении и как с ней поступить.
  explanation: Пара предпочтений кодирует различие, а не отдельные тексты. Нет различия — нет сигнала, и в наборе остаётся балласт, разбавляющий полезные примеры.
  kind: open
  reference: 'Пара вырождена: победитель и проигравший идентичны, разницы, которую можно выучить, нет. Обучение на предпочтениях опирается на разность между кандидатами — здесь она нулевая, так что пара либо не даёт градиента, либо вносит шум. Такие пары нужно отфильтровать на этапе сборки набора: собирать пару стоит только когда правка действительно состоялась (текст изменился), иначе чистый ответ просто не порождает обучающего примера.'
