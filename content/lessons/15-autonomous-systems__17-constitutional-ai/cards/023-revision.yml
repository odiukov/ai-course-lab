- concept: 'критерий сохранения фрагмента двойной: он отвечает на запрос и не конфликтует с принципом'
  question: При переписывании ответа решается, какие куски оставить. Какому условию должен удовлетворять сохраняемый фрагмент?
  explanation: 'Одного условия мало с обеих сторон: безобидный, но нерелевантный текст превращает правку в отписку, а полезный фрагмент с остатком опасной инструкции сохраняет нарушение. Держатся оба признака сразу.'
  kind: choice
  options:
    - Он одновременно относится к запросу пользователя и не конфликтует с принципами конституции
    - Достаточно того, что он безвреден, даже если к запросу отношения не имеет
    - Достаточно того, что он полезен, даже если частично воспроизводит опасную инструкцию
    - Он должен быть дословно перенесён из исходного ответа без изменений
  correct: 0
