- concept: содержание правок задаёт целевое поведение, поэтому подмена правки глухим отказом обучает избыточным отказам
  question: Что произойдёт с обученной моделью, если на стадии переписывания каждый помеченный ответ заменять коротким отказом?
  explanation: Правки — это образец целевого поведения, а не просто способ убрать нарушение из выборки. Каким сделаешь исправленный ответ, такому поведению модель и научится.
  kind: open
  reference: 'Пары начнут поощрять отказ как таковой: модель научится, что при малейшем признаке риска предпочтителен пустой ответ. Вырастет доля лишних отказов на запросах, где допустимая часть отделима и вполне выполнима, а способность отделять нарушающий фрагмент от полезного содержания не сформируется — этому в данных нет примеров.'
  id: 023-revision-3
