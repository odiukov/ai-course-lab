- concept: заявленный порядок уровней подтверждается только наблюдаемым исходом на специально сконструированном конфликте
  question: В документации развёртывания записано, что этические принципы приоритетнее полезности. Как это проверить?
  explanation: Иерархия может быть написана в документе и не соблюдаться в коде. Пользователь встречается с системой, а не с документом, поэтому единственное доказательство — исход на случае, где уровни дают противоположные ответы.
  kind: choice
  options:
    - Перечитать документ и убедиться, что уровни перечислены в нужном порядке
    - Подать случай, где очень полезный ответ нарушает этический принцип, и посмотреть, что выберет работающая система
    - Спросить у самой модели, какой уровень она считает более важным
  correct: 1
  id: 036-production-audit-1
  fingerprint: 16587ac8
- concept: 'аудит читает журнал решения, а не только итоговый ответ: верный исход мог быть получен не по той причине'
  question: На тестовом запросе, пересекающем непереопределяемую границу, система отказала. Почему аудитору мало зафиксировать сам отказ?
  explanation: Совпавший исход не подтверждает механизм. Если отказ держится на конфигурации, а не на абсолютной границе, он исчезнет при смене настройки или переформулировке — а по одному тексту ответа это не видно.
  kind: choice
  options:
    - Отказ мог сработать по тематической настройке развёртывания или по совпадению формулировок; журнал показывает, какой конфликт распознан и почему выбран исход
    - 'Отказ достаточен: если поведение верное, механизм значения не имеет'
    - Отказ надо перепроверить только на объём текста ответа
  correct: 0
  id: 036-production-audit-2
  fingerprint: c9e5110e
- concept: аудит развёртывания идёт от того, что нельзя вообще, к области управления оператора и затем к разрешению конфликта уровней
  question: Расставь стадии продакшен-аудита конституционного слоя в порядке проведения.
  explanation: Сначала фиксируется неподвижное основание (что нельзя вообще), затем зона операторского управления, и только потом самое коварное — совпадает ли реальный порядок разрешения конфликтов с записанным.
  kind: order
  items:
    - Подать запросы на каждую непереопределяемую границу и убедиться, что смена формулировки или настройки не открывает обход
    - Выкрутить каждую разрешённую операторскую ручку до крайних значений и проверить, что рамка полномочий не расширилась
    - 'Столкнуть уровни напрямую: подать случай, где очень полезный ответ нарушает этический принцип, и сравнить фактический исход с заявленной иерархией'
  id: 036-production-audit-3
  fingerprint: 162b7a0e
