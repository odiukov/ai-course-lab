- concept: и излишне разрешительная, и излишне строгая среда — сбои рантайма, а не выравнивания
  question: В одном развёртывании агент выполнил все вредные вызовы, потому что среда пропускает любые действия. В другом агент не может выполнить ни одного правильного вызова, потому что среда запрещает почти всё. Как классифицировать эти два сбоя?
  explanation: Слишком покладистые веса становятся опасны именно потому, что среда всё пропускает, а глухие отказы при строгой среде тоже порождены её настройкой. В обоих случаях чинить нужно рантайм; конституция закрывает другой класс проблем.
  kind: choice
  options:
    - Первый — проблема рантайма, второй — проблема выравнивания модели
    - 'Оба — проблемы рантайма: он задаёт границу возможного в обе стороны'
    - 'Оба — проблемы конституции: она должна была описать оба случая'
