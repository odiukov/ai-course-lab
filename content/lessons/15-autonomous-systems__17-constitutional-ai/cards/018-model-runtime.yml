- concept: 'слои не заменяют друг друга: выравнивание не даёт гарантии исполнения, а ограничение доступа не формирует предпочтений'
  question: Объясни своими словами, почему хорошо выровненной модели всё равно не выдают полные права доступа — и почему жёсткие права доступа не отменяют необходимость выравнивания.
  explanation: 'Ключевое различие: конституция влияет на выбор действия, рантайм — на множество исполнимых действий. Ни одно из двух множеств не покрывает другое.'
  kind: open
  reference: 'Выравнивание задаёт предпочтения, а не гарантию: модель может неверно понять ситуацию, поддаться убедительной формулировке или просто ошибиться, и тогда неверное решение превратится в действие ровно настолько, насколько это позволит среда. С другой стороны, ограничение прав ничему модель не учит: внутри выданных полномочий она всё равно принимает решения сама, и во всех неохваченных ограничениями случаях работают только её предпочтения. Слои закрывают разные классы отказов и потому нужны оба.'
