- concept: 'уступка нижнего уровня локальна: он отменяется только в точке конфликта и продолжает действовать во всём остальном'
  question: Агент нарушил требуемый формат отчёта, чтобы показать оператору аномальные сырые показания датчика. Что происходит с этим форматным требованием дальше?
  explanation: 'Более высокий уровень не стирает нижний, а вырезает из него ровно ту часть, что мешает. Стрелка приоритета читается как «нижнее действует там, где не мешает верхнему»: сначала сохраняется рамка, затем внутри неё ищется максимально полезное и соответствующее руководствам поведение.'
  kind: choice
  options:
    - 'Оно продолжает действовать для всей остальной части отчёта: уступка касается только той части, где был конфликт'
    - Оно отключено до конца сессии, раз уже было нарушено один раз
    - Оно отменяется навсегда для этого развёртывания, так как показало несовместимость с надзором
