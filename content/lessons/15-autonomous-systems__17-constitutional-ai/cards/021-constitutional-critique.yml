- concept: конституционная критика соединяет фрагмент ответа, конкретный принцип и объяснение их несовместимости
  question: Какая из формулировок является конституционной критикой ответа, а не общей оценкой?
  explanation: 'Критика по конституции обязана нести три связанные части: конкретное место в ответе, конкретный принцип и объяснение, почему одно нарушает другое. Оценка без места («противоречит конституции») и место без основания («безответственно») одинаково непроверяемы.'
  kind: choice
  options:
    - «Ответ написан безответственно и производит плохое впечатление»
    - «Ответ противоречит конституции»
    - «Блок с пошаговой процедурой синтеза даёт готовую инструкцию к причинению вреда и потому нарушает принцип, запрещающий помогать с опасными действиями»
  correct: 2
  id: 021-constitutional-critique-1
  fingerprint: 14c4da06
- concept: нарушение определяется содержанием ответа, а смягчающее обрамление его не снимает
  question: Ответ открывается фразой «делать это опасно и я не советую», а дальше даёт полную рабочую инструкцию к опасному действию. Что должна зафиксировать критика по конституции?
  explanation: Принцип нарушает то, что ответ реально передаёт пользователю, а не тон обрамления. Дисклеймер меняет вежливость, но не убирает переданную возможность причинить вред, поэтому критика указывает именно на блок с инструкцией.
  kind: choice
  options:
    - 'Нарушение сохраняется: инструкция передана, и предупреждение перед ней этого не отменяет'
    - 'Нарушения нет: модель предупредила о риске, значит ответственность перешла к пользователю'
    - Нарушение частичное, и его тяжесть уменьшается пропорционально длине предупреждения
  correct: 0
  id: 021-constitutional-critique-2
  fingerprint: 6c467979
- concept: критика с явным основанием делает разметку проверяемой сторонним читателем
  question: Что даёт цикл обучения от привязки критики к записанному принципу, чего не даёт вердикт «этот ответ плохой»? Объясни своими словами.
  explanation: Конституция переводит субъективное недовольство в проверяемое утверждение «вот место, вот правило, вот противоречие», и именно эта связка служит заданием для следующей стадии — правки.
  kind: open
  reference: 'Привязка делает утверждение проверяемым: другой человек или другая модель может взять тот же принцип, тот же фрагмент и сказать, следует ли вывод. Вердикт без основания невоспроизводим — он отражает вкус конкретного оценщика, и по нему нельзя ни оспорить разметку, ни понять, какое именно свойство ответа надо изменить при переписывании. Кроме того, явный принцип задаёт единый критерий для всего набора данных, а не разный для каждого примера.'
  id: 021-constitutional-critique-3
  fingerprint: 68f4f87a
