- concept: на каждом раунде критикуется накопленная (последняя исправленная) версия ответа, а не первоначальная
  question: Цикл «критика — правка» держит переменную с последней версией ответа и обновляет её после каждой правки. Что нужно подать на вход критике внутри очередного раунда, чтобы цикл не диагностировал уже устранённое нарушение снова?
  explanation: 'Состояние цикла — текущая версия ответа. Если критике каждый раунд отдавать первоначальный текст, она будет возвращать один и тот же диагноз, а правки предыдущих раундов потеряются: цикл никогда не сойдётся и вернёт результат одной последней правки исходника.'
  kind: cloze
  template: 'result = critique(___, constitution)  # вызов внутри одного раунда цикла'
  answer: current
  accept:
    - current
    - current_answer
    - current_response
    - текущий ответ
    - последняя версия
  id: 026-critique-revise-loop-1
  fingerprint: bbb01555
- concept: при завершении по чистой проверке число вызовов правки на единицу меньше числа вызовов критики
  question: Цикл «критика — правка» с лимитом 8 раундов. Критика находит нарушение в раундах с первого по четвёртый включительно, а в пятом раунде нарушений нет. Сколько раз за весь прогон была вызвана правка?
  explanation: 'Правка вызывается только когда критика нашла нарушение: 4 раза. Критика вызвана 5 раз — последний вызов чистый и завершает цикл без правки. Лимит 8 задаёт максимум раундов проверки, а не обязательное число правок.'
  kind: numeric
  answer: 4
  tolerance: 0.5
  id: 026-critique-revise-loop-2
  fingerprint: '07478764'
- concept: чистая проверка завершает цикл без вызова правки, потому что правка без найденного дефекта может только ухудшить соответствующий ответ
  question: Критика вернула «нарушений нет». Что должен сделать цикл и почему?
  explanation: Правка адресует конкретный найденный дефект. Без диагноза ей нечего устранять, а любое переписывание рискует срезать полезную часть ответа. Досрочный выход по чистой проверке — нормальный исход, а не экономия шага.
  kind: choice
  options:
    - 'Вернуть текущую версию сразу: правка без найденного дефекта не имеет предмета и может лишь испортить уже соответствующий принципам ответ'
    - 'Всё равно вызвать правку один раз: дополнительное переписывание повышает безопасность ответа'
    - Дожать цикл до лимита раундов, чтобы у всех прогонов было одинаковое число правок
    - Вернуть первоначальный ответ, раз к нему нет замечаний по существу
