- concept: критика оценивает выданный ответ, а не сам запрос пользователя
  question: На вредный запрос модель ответила корректным отказом с объяснением. Что должна вернуть функция критики по конституции?
  explanation: Объект проверки — то, что модель выдала, а не то, о чём её попросили. Отказ на вредный запрос как раз соответствует принципам; критика запроса относилась бы к другой стадии и другому входу.
  kind: choice
  options:
    - Указание на нарушение, потому что тема запроса вредная
    - 'Отсутствие нарушений: оценивается ответ, а вредность запроса сама по себе ответ не порочит'
    - Нарушение с пометкой «риск», потому что модель вообще ответила на такой запрос
  correct: 1
  id: 022-critique-1
  fingerprint: 184d3b83
- concept: правило берётся из переданной конституции до проверки, а не подбирается под уже найденный недостаток
  question: Функция критики читает ответ, решает, что он ей не нравится, и затем формулирует принцип, под который этот недостаток удобно подвести. В чём здесь дефект?
  explanation: Смысл конституции в том, что набор принципов фиксирован заранее и один для всех примеров. Принцип, сочинённый постфактум, всегда подтвердит любой вердикт, и аудит разметки становится невозможным.
  kind: choice
  options:
    - 'Ни в чём: важно, что недостаток найден, а формулировка принципа вторична'
    - Правило, придуманное после наблюдения, подгоняется под вывод, и критику нельзя проверить по заранее заданному набору принципов
    - 'Дефект только в производительности: генерация принципа стоит лишнего вызова модели'
  correct: 1
  id: 022-critique-2
  fingerprint: a9a74371
- concept: ложные срабатывания критики портят обучающие пары, а не остаются безобидным шумом
  question: Функция критики устроена так, что на безупречном ответе всё равно выдумывает какой-нибудь недостаток — «чтобы не возвращать пустоту». Чем это опасно для последующего обучения?
  explanation: Критика — вход для стадии переписывания. Выдуманный дефект порождает пару, где корректный ответ помечен как худший, и RLAIF обучается на этом смещении. «Нарушений нет» — законный результат работы, а не признак её неудачи.
  kind: choice
  options:
    - 'Ничем: лишняя критика просто не приведёт к изменениям в ответе'
    - На вход правки попадут корректные ответы, их перепишут «безопаснее», и модель обучится предпочитать более осторожные версии там, где ничего не нарушено
    - Опасно только тем, что растёт число вызовов модели и стоимость прогона
  correct: 1
  id: 022-critique-3
  fingerprint: 88e13071
