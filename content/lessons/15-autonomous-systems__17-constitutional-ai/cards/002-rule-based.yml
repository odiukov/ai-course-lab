- concept: сильные стороны rule-based alignment — дешёвая проверка и аудируемость постфактум
  question: Что rule-based alignment (выравнивание по перечню запретов) даёт из того, чего трудно добиться от выравнивания по принципам?
  explanation: 'Правило — это булева проверка признаков: применяется быстро и оставляет аудиторский след. Устойчивость к переформулировкам и покрытие невиданного — как раз то, чего у RBA нет.'
  kind: choice
  options:
    - Дешёвую проверку на инференсе и возможность после инцидента точно указать, какой пункт сработал или не сработал
    - Устойчивость к переформулировке вредного запроса другими словами
    - Автоматическое покрытие случаев, которых авторы не предвидели
  correct: 0
  id: 002-rule-based-1
  fingerprint: 694ec1c1
- concept: RBA даёт одновременно ложные пропуски и лишние отказы, потому что решает по проверяемым признакам, а не по смыслу
  question: Правило запрещает раскрывать данные клиента без подтверждения личности. Объясни, как один и тот же механизм порождает и пропуск опасного запроса, и отказ в безопасном.
  explanation: Обе ошибки — следствие одного разрыва между признаком и смыслом. Именно за этот разрыв RBA платит своей скоростью.
  kind: open
  reference: 'Правило принимает решение по формальному признаку (есть ли отметка о подтверждении), а не по смыслу ситуации. Мошенник с украденным кодом подтверждения формально признак предъявил — запрос проходит, хотя вреден. Наоборот, безобидная просьба, случайно попавшая под определение «данных клиента», блокируется, хотя риска в ней нет. Чем жёстче и дешевле граница, тем чаще смысл и проверяемый признак расходятся: отсюда и ложные пропуски, и лишние отказы на близких аналогах.'
  id: 002-rule-based-2
  fingerprint: c637e0f5
