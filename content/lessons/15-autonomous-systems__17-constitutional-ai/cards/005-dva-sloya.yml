- concept: 'два разных механизма решения: сначала блокирующая проверка абсолютных запретов, затем взвешивание по иерархии'
  question: Оператор настроил агента на максимально подробные ответы, и пользователь просит нечто, попадающее под жёстко зашитый запрет. Как устроено решение?
  explanation: 'Слои разнородны. Абсолютные запреты — жёсткая проверка без разбора контекста; иерархия принципов включается только тогда, когда такой границы не пересекли. Порядок такой: сначала «вообще можно?», потом «как лучше поступить?».'
  kind: choice
  options:
    - 'Абсолютный запрет проверяется первым и обрывает разбор: полезность и настройка оператора вообще не участвуют во взвешивании'
    - Полезность и запрет взвешиваются как равные аргументы, побеждает сторона с большим весом
    - Настройка оператора имеет приоритет, потому что оператор несёт ответственность за развёртывание
