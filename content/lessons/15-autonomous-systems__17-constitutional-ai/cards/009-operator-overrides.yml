- concept: allow-list допустимых ключей безопаснее, чем слияние всей операторской конфигурации поверх defaults
  question: 'Слой применения операторских настроек собирают двумя способами. Вариант A: взять defaults и слить поверх весь объект оператора, затем удалить известные опасные ключи. Вариант B: взять defaults и скопировать только ключи из явного списка настраиваемых. Почему для настроек модели с непереопределяемыми запретами выбирают B?'
  explanation: 'Deny-list всегда отстаёт от изобретательности вызывающей стороны: защищает только от перечисленных имён. Allow-list из четырёх настраиваемых пунктов (длина, тема, стиль, инструменты) даёт замкнутое множество: всё за его пределами просто не влияет на результат, включая поля, о которых автор функции не думал.'
  kind: choice
  options:
    - B работает быстрее, потому что копирует меньше полей
    - A безопасен только при отсутствии вложенных объектов в конфигурации
    - 'B по умолчанию отвергает неизвестное: новое поле, придуманное оператором, не проходит, тогда как в A любое поле проходит, пока его не внесли в чёрный список'
    - A не даёт валидировать типы значений, а B даёт
  correct: 2
  id: 009-operator-overrides-1
  fingerprint: e0e76b0e
- concept: конфигурационный слой не место для смысловой проверки запроса — это разные входы и разные моменты
  question: Функция применения операторских настроек и проверка абсолютных запретов разнесены по разным местам конвейера. Что именно делает их объединение в одну функцию неправильным по существу?
  explanation: Настройки — статическая рамка на всё развёртывание; запрет — решение о конкретном тексте запроса. Смешав их, получаешь конфигурацию, влияющую на смысловую проверку, то есть ровно тот канал переопределения, которого не должно существовать.
  kind: choice
  options:
    - Проверка запретов должна выполняться быстрее, чем сборка конфигурации
    - 'Они работают с разными входами: настройки описывают рамку развёртывания и применяются один раз, а проверка запретов оценивает смысл каждого конкретного запроса пользователя'
    - Конфигурация приходит от оператора, а запреты закрепляются исключительно в весах и на инференсе не проверяются
    - Объединение допустимо, если функция возвращает новый объект и не мутирует вход
  correct: 1
  id: 009-operator-overrides-2
  fingerprint: 9bbda7c7
- concept: валидация значения по типу и диапазону нужна отдельно от проверки имени ключа
  question: Ключ настройки прошёл allow-list. Почему этого недостаточно и что ещё обязана проверить функция перед записью значения в результат?
  explanation: 'Две независимые оси: что можно настраивать и в каких пределах. Allow-list закрывает первую, валидация значений — вторую.'
  kind: open
  reference: 'Имя ключа говорит лишь о том, что настройка вообще разрешена оператору, но не о том, что переданное значение осмысленно. Нужна проверка значения: тип (список инструментов — действительно список строк, а не строка или словарь), допустимое множество или диапазон (стиль — одно из известных значений; длина — из ожидаемого набора либо положительное число в разумных границах), и отбрасывание значения, не прошедшего проверку, с сохранением значения по умолчанию. Иначе валидное имя ключа становится каналом для мусора или для значения, ломающего дальнейшую логику (например, длина, отключающая ограничение вовсе). Проверка имени защищает от расширения множества настраиваемого, проверка значения — от расширения диапазона внутри одной настройки.'
  id: 009-operator-overrides-3
  fingerprint: fc7d8dce
