<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Как более высокий уровень перебивает более низкий</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f4ed;
      --panel: #fffdf8;
      --ink: #17202a;
      --muted: #59636e;
      --border: #b8c0c8;
      --tier-one: #cce6df;
      --tier-two: #dbe9cf;
      --tier-three: #eee3bf;
      --tier-four: #ead5ca;
      --one-edge: #176c62;
      --two-edge: #4f792e;
      --three-edge: #8b691d;
      --four-edge: #95523d;
      --arrow: #a53030;
      --arrow-soft: #f3d7d2;
      --focus: #fff7e2;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #10161c;
        --panel: #172028;
        --ink: #f1f4f6;
        --muted: #bdc6ce;
        --border: #4d5a65;
        --tier-one: #183e3a;
        --tier-two: #2d4024;
        --tier-three: #493c20;
        --tier-four: #4b2d28;
        --one-edge: #62cabc;
        --two-edge: #9ac879;
        --three-edge: #e2bd5c;
        --four-edge: #df9179;
        --arrow: #ff8f85;
        --arrow-soft: #4c2928;
        --focus: #29271f;
      }
    }

    html,
    body {
      margin: unset;
      padding: unset;
      background: var(--page);
      color: var(--ink);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    figure {
      margin: unset;
      background: var(--panel);
    }

    figcaption {
      box-sizing: border-box;
      padding: 12px 18px 8px;
      color: var(--ink);
      font-size: 20px;
      font-weight: bold;
      line-height: normal;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      background: var(--panel);
    }

    .background {
      fill: var(--panel);
    }

    .top-rule {
      fill: var(--muted);
      font-size: 14px;
      font-weight: bold;
      letter-spacing: normal;
    }

    .step {
      stroke-width: 3px;
      vector-effect: non-scaling-stroke;
    }

    .tier-1 {
      fill: var(--tier-one);
      stroke: var(--one-edge);
    }

    .tier-2 {
      fill: var(--tier-two);
      stroke: var(--two-edge);
    }

    .tier-3 {
      fill: var(--tier-three);
      stroke: var(--three-edge);
    }

    .tier-4 {
      fill: var(--tier-four);
      stroke: var(--four-edge);
    }

    .number-disc {
      fill: var(--panel);
      stroke-width: 3px;
      vector-effect: non-scaling-stroke;
    }

    .tier-1-number {
      stroke: var(--one-edge);
    }

    .tier-2-number {
      stroke: var(--two-edge);
    }

    .tier-3-number {
      stroke: var(--three-edge);
    }

    .tier-4-number {
      stroke: var(--four-edge);
    }

    .level-number {
      fill: var(--ink);
      font-size: 22px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .level-title {
      fill: var(--ink);
      font-size: 19px;
      font-weight: bold;
      dominant-baseline: middle;
    }

    .level-note {
      fill: var(--muted);
      font-size: 14px;
      dominant-baseline: middle;
    }

    .arrow-line {
      fill: none;
      stroke: var(--arrow);
      stroke-width: 4px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .arrow-head {
      fill: var(--arrow);
      stroke: var(--arrow);
      stroke-width: 2px;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .arrow-tail {
      fill: var(--arrow-soft);
      stroke: var(--arrow);
      stroke-width: 3px;
      vector-effect: non-scaling-stroke;
    }

    .arrow-label {
      fill: var(--arrow);
      font-size: 15px;
      font-weight: bold;
    }

    .arrow-explanation {
      fill: var(--muted);
      font-size: 14px;
    }

    .legend-rule {
      stroke: var(--border);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .legend-lead {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
    }

    .legend-text {
      fill: var(--muted);
      font-size: 15px;
    }

    .fallback-title {
      fill: var(--ink);
      font-size: 20px;
      font-weight: bold;
      text-anchor: middle;
    }

    .fallback-text {
      fill: var(--muted);
      font-size: 16px;
      text-anchor: middle;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-heading">
    <figcaption id="diagram-heading">
      Как более высокий уровень перебивает более низкий
    </figcaption>

    <svg
      id="priority-diagram"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 960 456"
      width="960"
      height="456"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description"
    >
      <title id="svg-title">Четыре уровня приоритета</title>
      <desc id="svg-description">
        Вертикальная лестница от безопасности и человеческого надзора
        до полезности. Стрелка разрешения конфликта идёт от уровня 4
        к уровню 1: более низкий уровень уступает более высокому.
      </desc>
      <g id="drawing"></g>
    </svg>
  </figure>

  <script>
    const levels = [
      {
        level: "1",
        title: "Безопасность и человеческий надзор",
        note: "сохранить предупреждение и возможность вмешаться",
        x1: 8, y1: 8, x2: 105, y2: 19,
        numberX: 14, numberY: 13.5, radius: 3.2,
        titleX: 20, titleY: 12,
        noteX: 20, noteY: 16
      },
      {
        level: "2",
        title: "Этика",
        note: "не скрывать ошибку и не вводить человека в заблуждение",
        x1: 14, y1: 21, x2: 105, y2: 32,
        numberX: 20, numberY: 26.5, radius: 3.2,
        titleX: 26, titleY: 25,
        noteX: 26, noteY: 29
      },
      {
        level: "3",
        title: "Руководства Anthropic",
        note: "соблюдать продуктовый формат отчёта",
        x1: 20, y1: 34, x2: 105, y2: 45,
        numberX: 26, numberY: 39.5, radius: 3.2,
        titleX: 32, titleY: 38,
        noteX: 32, noteY: 42
      },
      {
        level: "4",
        title: "Полезность",
        note: "завершить маршрут и аккуратно оформить результат",
        x1: 26, y1: 47, x2: 105, y2: 58,
        numberX: 32, numberY: 52.5, radius: 3.2,
        titleX: 38, titleY: 51,
        noteX: 38, noteY: 55
      }
    ];

    const layout = [
      {
        name: "background",
        x1: -5, y1: -3, x2: 155, y2: 73
      },
      {
        name: "topRule",
        x: 8, y: 4.5,
        text: "ВЫШЕ — СИЛЬНЕЕ ПРИ КОНФЛИКТЕ"
      },
      {
        name: "arrow",
        tailX: 114, tailY: 52.5,
        headX: 114, headY: 13.5,
        wingLeftX: 110, wingLeftY: 18.5,
        wingRightX: 118, wingRightY: 18.5,
        tailRadius: 2.1,
        labelX: 116, labelY: 39,
        label: "РАЗРЕШЕНИЕ КОНФЛИКТА",
        explanationX: 116, explanationY: 43,
        explanation: "уровень 4 уступает уровню 1"
      },
      {
        name: "legendRule",
        x1: 8, y1: 61, x2: 147, y2: 61
      },
      {
        name: "legendLead",
        x: 8, y: 65,
        text: "Сначала сохраняется рамка уровня 1."
      },
      {
        name: "legendText",
        x: 8, y: 69,
        text: "Затем внутри неё снова действуют уровни 2–4."
      },
      {
        name: "fallback",
        titleX: 75, titleY: 29,
        textX: 75, textY: 37
      }
    ];

    const origin = Object.freeze({ x: 30, y: 18 });
    const scale = 6;

    const sx = x => origin.x + x * scale;
    const sy = y => origin.y + y * scale;

    const canvasWidth = 960;
    const canvasHeight = 456;
    const labelPadding = 12;
    const lineWidth = 3;
    const titleFontSize = 20;
    const bodyFontSize = 16;

    const svgNamespace = "http://www.w3.org/2000/svg";
    const drawing = document.getElementById("drawing");

    const make = (name, attributes, text) => {
      const node = document.createElementNS(svgNamespace, name);

      Object.entries(attributes).forEach(([key, value]) => {
        node.setAttribute(key, String(value));
      });

      if (text !== undefined) {
        node.textContent = text;
      }

      return node;
    };

    const findLayout = name => layout.find(item => item.name === name);

    const rectFromCorners = (item, className) => make("rect", {
      x: sx(item.x1),
      y: sy(item.y1),
      width: sx(item.x2) - sx(item.x1),
      height: sy(item.y2) - sy(item.y1),
      class: className
    });

    const circleAt = (x, y, radius, className) => make("circle", {
      cx: sx(x),
      cy: sy(y),
      r: sx(radius) - sx(0),
      class: className
    });

    const textAt = (x, y, value, className, anchor) => make("text", {
      x: sx(x),
      y: sy(y),
      class: className,
      "text-anchor": anchor
    }, value);

    const lineBetween = (x1, y1, x2, y2, className) => make("line", {
      x1: sx(x1),
      y1: sy(y1),
      x2: sx(x2),
      y2: sy(y2),
      class: className
    });

    const polygonFrom = (points, className) => make("polygon", {
      points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
      class: className
    });

    const renderFallback = error => {
      drawing.replaceChildren();

      const background = findLayout("background");
      const fallback = findLayout("fallback");

      drawing.append(
        rectFromCorners(background, "background"),
        make("text", {
          x: sx(fallback.titleX),
          y: sy(fallback.titleY),
          class: "fallback-title",
          "font-size": titleFontSize
        }, "Схема уровней приоритета"),
        make("text", {
          x: sx(fallback.textX),
          y: sy(fallback.textY),
          class: "fallback-text",
          "font-size": bodyFontSize
        }, "Стрелка должна идти от уровня 4 к уровню 1.")
      );

      document
        .getElementById("priority-diagram")
        .setAttribute(
          "aria-label",
          `Не удалось построить схему: ${error.message}. ` +
          "Она показывает, что уровень 4 уступает уровню 1."
        );
    };

    try {
      const background = findLayout("background");
      const topRule = findLayout("topRule");
      const arrow = findLayout("arrow");
      const legendRule = findLayout("legendRule");
      const legendLead = findLayout("legendLead");
      const legendText = findLayout("legendText");

      const fragment = document.createDocumentFragment();

      fragment.append(
        rectFromCorners(background, "background"),
        textAt(
          topRule.x,
          topRule.y,
          topRule.text,
          "top-rule",
          "start"
        )
      );

      levels.forEach(level => {
        const group = make("g", {
          class: `level level-${level.level}`,
          "aria-label": `Уровень ${level.level}: ${level.title}`
        });

        group.append(
          rectFromCorners(level, `step tier-${level.level}`),
          circleAt(
            level.numberX,
            level.numberY,
            level.radius,
            `number-disc tier-${level.level}-number`
          ),
          textAt(
            level.numberX,
            level.numberY,
            level.level,
            "level-number",
            "middle"
          ),
          textAt(
            level.titleX,
            level.titleY,
            level.title,
            "level-title",
            "start"
          ),
          textAt(
            level.noteX,
            level.noteY,
            level.note,
            "level-note",
            "start"
          )
        );

        fragment.append(group);
      });

      const arrowGroup = make("g", {
        "aria-label": "Разрешение конфликта: от уровня 4 к уровню 1"
      });

      arrowGroup.append(
        lineBetween(
          arrow.tailX,
          arrow.tailY,
          arrow.headX,
          arrow.headY,
          "arrow-line"
        ),
        polygonFrom(
          [
            { x: arrow.headX, y: arrow.headY },
            { x: arrow.wingLeftX, y: arrow.wingLeftY },
            { x: arrow.wingRightX, y: arrow.wingRightY }
          ],
          "arrow-head"
        ),
        circleAt(
          arrow.tailX,
          arrow.tailY,
          arrow.tailRadius,
          "arrow-tail"
        ),
        make("text", {
          x: sx(arrow.labelX) + labelPadding,
          y: sy(arrow.labelY),
          class: "arrow-label",
          "text-anchor": "start"
        }, arrow.label),
        make("text", {
          x: sx(arrow.explanationX) + labelPadding,
          y: sy(arrow.explanationY),
          class: "arrow-explanation",
          "text-anchor": "start"
        }, arrow.explanation)
      );

      fragment.append(
        arrowGroup,
        lineBetween(
          legendRule.x1,
          legendRule.y1,
          legendRule.x2,
          legendRule.y2,
          "legend-rule"
        ),
        textAt(
          legendLead.x,
          legendLead.y,
          legendLead.text,
          "legend-lead",
          "start"
        ),
        textAt(
          legendText.x,
          legendText.y,
          legendText.text,
          "legend-text",
          "start"
        )
      );

      drawing.replaceChildren(fragment);

      const svg = document.getElementById("priority-diagram");
      svg.setAttribute("width", String(canvasWidth));
      svg.setAttribute("height", String(canvasHeight));
      svg.style.setProperty("--diagram-line-width", `${lineWidth}px`);
    } catch (error) {
      renderFallback(error);
    }
  </script>
</body>
</html>
