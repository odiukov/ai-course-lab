<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Рост активаций по слоям</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f9fc;
    --panel: #ffffff;
    --panel-border: #cbd5e1;
    --text: #182230;
    --muted: #526174;
    --axis: #64748b;
    --cool: #2878c8;
    --cool-fill: #e5f2ff;
    --warm: #c77800;
    --warm-fill: #fff0cf;
    --hot: #d34444;
    --hot-fill: #ffe4e4;
    --danger: #b51f35;
    --danger-fill: #ffd4dc;
    --norm: #087f72;
    --norm-fill: #d9f5ef;
    --divider: #aab5c4;
    --legend: #edf2f7;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--page);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .figure {
    background: var(--page);
    padding: 12px 14px 10px;
  }

  .heading {
    margin: 0;
    font-size: 22px;
    font-weight: bold;
  }

  .intro {
    margin: 0;
    padding-top: 4px;
    color: var(--muted);
    font-size: 14px;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 430px;
    margin-top: 6px;
    background: var(--page);
  }

  .panel {
    fill: var(--panel);
    stroke: var(--panel-border);
    stroke-width: 2px;
  }

  .divider {
    stroke: var(--divider);
    stroke-width: 2px;
    stroke-dasharray: 6px 8px;
  }

  .panel-title {
    fill: var(--text);
    font-size: 18px;
    font-weight: bold;
  }

  .panel-subtitle {
    fill: var(--muted);
    font-size: 13px;
  }

  .step {
    stroke-width: 2px;
  }

  .step-cool {
    fill: var(--cool-fill);
    stroke: var(--cool);
  }

  .step-warm {
    fill: var(--warm-fill);
    stroke: var(--warm);
  }

  .step-hot {
    fill: var(--hot-fill);
    stroke: var(--hot);
  }

  .step-danger {
    fill: var(--danger-fill);
    stroke: var(--danger);
  }

  .step-normalized {
    fill: var(--norm-fill);
    stroke: var(--norm);
  }

  .stair {
    fill: none;
    stroke-width: 4px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .stair-growing {
    stroke: var(--danger);
  }

  .stair-normalized {
    stroke: var(--norm);
  }

  .range {
    fill: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 14px;
    font-weight: bold;
  }

  .layer-caption {
    fill: var(--muted);
    font-size: 12px;
  }

  .layer-number {
    fill: var(--text);
    font-size: 13px;
    font-weight: bold;
  }

  .depth-arrow {
    fill: none;
    stroke: var(--axis);
    stroke-width: 2px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .depth-label {
    fill: var(--muted);
    font-size: 12px;
  }

  .legend-box {
    fill: var(--legend);
    stroke: var(--panel-border);
    stroke-width: 2px;
  }

  .legend-text {
    fill: var(--muted);
    font-size: 13px;
  }

  .fallback-text {
    fill: var(--text);
    font-size: 16px;
  }

  .fallback:empty {
    display: none;
  }

  .fallback {
    margin: 0;
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #101720;
      --panel: #17212c;
      --panel-border: #405064;
      --text: #eef4fb;
      --muted: #b4c0cf;
      --axis: #93a4b8;
      --cool: #64b5ff;
      --cool-fill: #17334d;
      --warm: #ffc15c;
      --warm-fill: #473719;
      --hot: #ff8585;
      --hot-fill: #4d2528;
      --danger: #ff7188;
      --danger-fill: #51232e;
      --norm: #58d5c5;
      --norm-fill: #173f3b;
      --divider: #53647a;
      --legend: #1d2936;
    }
  }
</style>
</head>
<body>
<main class="figure">
  <h1 id="diagram-title" class="heading">Активации по мере углубления сети</h1>
  <p id="diagram-desc" class="intro">Одинаковые слои без нормализации и с LayerNorm.</p>
  <svg id="diagram"
       viewBox="0 0 1200 430"
       width="1200"
       height="430"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="diagram-title diagram-desc"></svg>
</main>
<p id="fallback" class="fallback" role="status"></p>

<script>
const data = [
  {
    divider: [[60, 1.6], [60, 36.2]],
    legend: [3, 38.2, 114, 3.1, 60, 40.35],
    fallback: [60, 21.5],
    corner: 0.8
  },
  {
    frame: [2, 1, 55, 35.5],
    title: [6, 4.3, "Без нормализации"],
    subtitle: [6, 6.7, "усиление накапливается"],
    stair: [
      [6, 24.2], [18, 24.2],
      [18, 19.2], [30, 19.2],
      [30, 14.2], [42, 14.2],
      [42, 9.2], [54, 9.2]
    ],
    stairClass: "stair stair-growing",
    steps: [
      [6, 24.2, 12, 4.3, 12, 26.95, "[0, 1]", "step step-cool"],
      [18, 19.2, 12, 4.3, 24, 21.95, "[0, 100]", "step step-warm"],
      [30, 14.2, 12, 4.3, 36, 16.95, "[0, 10 000]", "step step-hot"],
      [42, 9.2, 12, 4.3, 48, 11.95, "[0, inf]", "step step-danger"]
    ],
    layers: [
      [12, 30.7, "1"],
      [24, 30.7, "5"],
      [36, 30.7, "10"],
      [48, 30.7, "50"]
    ],
    layerCaption: [5.2, 30.7, "слой"],
    arrow: [
      [6, 33.1], [54, 33.1],
      [54, 33.1], [52.7, 32.35],
      [54, 33.1], [52.7, 33.85]
    ],
    arrowLabel: [6, 35.25, "глубина сети"]
  },
  {
    frame: [63, 1, 55, 35.5],
    title: [67, 4.3, "С LayerNorm"],
    subtitle: [67, 6.7, "диапазон удерживается"],
    stair: [
      [67, 24.2], [79, 24.2],
      [79, 19.2], [91, 19.2],
      [91, 14.2], [103, 14.2],
      [103, 9.2], [115, 9.2]
    ],
    stairClass: "stair stair-normalized",
    steps: [
      [67, 24.2, 12, 4.3, 73, 26.95, "[-1, 1]", "step step-normalized"],
      [79, 19.2, 12, 4.3, 85, 21.95, "[-1, 1]", "step step-normalized"],
      [91, 14.2, 12, 4.3, 97, 16.95, "[-1, 1]", "step step-normalized"],
      [103, 9.2, 12, 4.3, 109, 11.95, "[-1, 1]", "step step-normalized"]
    ],
    layers: [
      [73, 30.7, "1"],
      [85, 30.7, "5"],
      [97, 30.7, "10"],
      [109, 30.7, "50"]
    ],
    layerCaption: [66.2, 30.7, "слой"],
    arrow: [
      [67, 33.1], [115, 33.1],
      [115, 33.1], [113.7, 32.35],
      [115, 33.1], [113.7, 33.85]
    ],
    arrowLabel: [67, 35.25, "глубина сети"]
  }
];

const origin = { x: 0, y: 0 };
const scale = { x: 10, y: 10 };
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

const svg = document.getElementById("diagram");
const fallback = document.getElementById("fallback");
const [layout, ...panels] = data;
const ns = "http://www.w3.org/2000/svg";

function element(name, attributes, content) {
  const node = document.createElementNS(ns, name);
  for (const [key, value] of Object.entries(attributes)) {
    node.setAttribute(key, value);
  }
  if (content !== undefined) node.textContent = content;
  return node;
}

function pathFrom(points) {
  let path = "";
  for (const [x, y] of points) {
    path += `${path ? " L" : "M"} ${sx(x)} ${sy(y)}`;
  }
  return path;
}

function addText(parent, x, y, content, className, anchor, dx, dy) {
  const attributes = {
    x: sx(x),
    y: sy(y),
    class: className,
    "text-anchor": anchor
  };
  if (dx !== undefined) attributes.dx = dx;
  if (dy !== undefined) attributes.dy = dy;
  parent.appendChild(element("text", attributes, content));
}

try {
  const [dividerStart, dividerEnd] = layout.divider;
  svg.appendChild(element("line", {
    x1: sx(dividerStart[0]),
    y1: sy(dividerStart[1]),
    x2: sx(dividerEnd[0]),
    y2: sy(dividerEnd[1]),
    class: "divider"
  }));

  for (const panel of panels) {
    const group = element("g", {});
    const [fx, fy, fw, fh] = panel.frame;

    group.appendChild(element("rect", {
      x: sx(fx),
      y: sy(fy),
      width: sx(fw),
      height: sy(fh),
      rx: sx(layout.corner),
      ry: sy(layout.corner),
      class: "panel"
    }));

    addText(
      group,
      panel.title[0],
      panel.title[1],
      panel.title[2],
      "panel-title",
      "start"
    );

    addText(
      group,
      panel.subtitle[0],
      panel.subtitle[1],
      panel.subtitle[2],
      "panel-subtitle",
      "start"
    );

    for (const step of panel.steps) {
      const [x, y, width, height, tx, ty, label, className] = step;
      group.appendChild(element("rect", {
        x: sx(x),
        y: sy(y),
        width: sx(width),
        height: sy(height),
        rx: sx(layout.corner),
        ry: sy(layout.corner),
        class: className
      }));
      addText(group, tx, ty, label, "range", "middle");
    }

    group.appendChild(element("path", {
      d: pathFrom(panel.stair),
      class: panel.stairClass
    }));

    addText(
      group,
      panel.layerCaption[0],
      panel.layerCaption[1],
      panel.layerCaption[2],
      "layer-caption",
      "start"
    );

    for (const [x, y, label] of panel.layers) {
      addText(group, x, y, label, "layer-number", "middle");
    }

    group.appendChild(element("path", {
      d: pathFrom(panel.arrow),
      class: "depth-arrow"
    }));

    addText(
      group,
      panel.arrowLabel[0],
      panel.arrowLabel[1],
      panel.arrowLabel[2],
      "depth-label",
      "start"
    );

    svg.appendChild(group);
  }

  const [lx, ly, lw, lh, ltx, lty] = layout.legend;
  svg.appendChild(element("rect", {
    x: sx(lx),
    y: sy(ly),
    width: sx(lw),
    height: sy(lh),
    rx: sx(layout.corner),
    ry: sy(layout.corner),
    class: "legend-box"
  }));

  addText(
    svg,
    ltx,
    lty,
    "Ступени показывают глубину, подписи — диапазон передаваемых активаций",
    "legend-text",
    "middle"
  );
} catch (error) {
  const message = "Схема должна была показать рост [0, 1] → [0, 100] → [0, 10 000] → [0, inf] и стабильный диапазон [-1, 1] с LayerNorm.";
  fallback.textContent = message;
  svg.replaceChildren();
  svg.appendChild(element("text", {
    x: sx(layout.fallback[0]),
    y: sy(layout.fallback[1]),
    class: "fallback-text",
    "text-anchor": "middle"
  }, message));
}
</script>
</body>
</html>
