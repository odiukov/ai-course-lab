<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>19% ошибки из одного вычитания</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1a1a1a; --muted:#6b6b6b; --axis:#3a3a3a;
    --true:#1f7a4d; --calc:#c0392b; --noise:#c0392b; --grid:#dcdcdc;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171a; --fg:#e8e8e8; --muted:#a0a6ad; --axis:#c2c8ce;
      --true:#4fd48a; --calc:#ff7b6b; --noise:#ff7b6b; --grid:#2c3238;
    }
  }
  html,body{margin:0;background:var(--bg);}
  .wrap{background:var(--bg);color:var(--fg);max-width:920px;margin:0 auto;padding:8px 10px 10px;
        font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;box-sizing:border-box}
  h2{font-size:15px;margin:0 0 4px;font-weight:600}
  svg{display:block;width:100%;height:auto;max-height:520px}
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .fallback{color:var(--fg);font-size:13px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap">
  <h2>Одно вычитание — 19.2% ошибки</h2>
  <svg id="s" viewBox="0 0 700 300" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Сравнение истинной разности 0.0000001 и вычисленной 0.00000011920929"></svg>
  <div id="fb" class="fallback" hidden></div>
</div>
<script>
(function(){
  var svg=document.getElementById("s");
  try{
    // ---- данные схемы (единица оси = 1e-7) ----
    var D={
      a:{label:"a = 1.0000001", stored:"в памяти 1.00000011920929", tail:1.1920929},
      b:{label:"b = 1.0000000", stored:"в памяти 1.00000000000000", tail:0},
      unit:"единица оси = 0.0000001",
      trueD:1,           // 0.0000001
      calcD:1.1920929,   // 0.00000011920929
      err:"относительная ошибка 19.2%"
    };
    // ---- одна пара перевода ----
    var origin={x:150,y:250}, scale={x:330,y:58};
    function sx(x){return origin.x + x*scale.x;}
    function sy(y){return origin.y - y*scale.y;}

    var LP=8, LP2=14, FS=13, FSS=11.5, LW=1.6;
    var NS="http://www.w3.org/2000/svg";
    function el(n,at){var e=document.createElementNS(NS,n);for(var k in at)e.setAttribute(k,at[k]);return e;}
    function add(n,at,t){var e=el(n,at);if(t!=null)e.textContent=t;svg.appendChild(e);return e;}
    function line(x1,y1,x2,y2,at){
      at=at||{};at.x1=sx(x1);at.y1=sy(y1);at.x2=sx(x2);at.y2=sy(y2);
      if(!at.stroke)at.stroke="var(--axis)";at["stroke-width"]=at["stroke-width"]||LW;
      return add("line",at);
    }
    function txt(x,y,dx,dy,anchor,t,cls,fs){
      return add("text",{x:sx(x)+dx,y:sy(y)+dy,"text-anchor":anchor,
        "font-size":fs||FS,fill:cls||"var(--fg)"},t);
    }
    // наконечник стрелки: вершины через sx/sy
    function head(x,y,dir){
      var w=0.055, h=0.30*dir;
      var p=[[sx(x),sy(y)],[sx(x-w),sy(y-h)],[sx(x+w),sy(y-h)]];
      return add("polygon",{points:p.map(function(q){return q[0]+","+q[1];}).join(" "),
        fill:"var(--axis)"});
    }
    function bar(x0,x1,y,color,sw){
      line(x0,y,x1,y,{stroke:color,"stroke-width":sw,"stroke-linecap":"butt"});
      line(x0,y-0.14,x0,y+0.14,{stroke:color,"stroke-width":LW});
      line(x1,y-0.14,x1,y+0.14,{stroke:color,"stroke-width":LW});
    }

    // ---- ось разности ----
    var AX=1.55, yAxis=0;
    line(0,yAxis,AX,yAxis,{stroke:"var(--axis)"});
    head(AX,yAxis,1);
    // засечки 0 .. 1.5
    for(var k=0;k<=3;k++){
      var v=k*0.5;
      line(v,-0.10,v,0.10,{stroke:"var(--axis)","stroke-width":1.2});
      txt(v,-0.10,0,LP2+4,"middle",(v).toFixed(1),"var(--muted)",FSS);
    }
    txt(AX,yAxis,-LP,-LP2,"end",D.unit,"var(--muted)",FSS);

    // ---- истинная разность (выше оси) ----
    bar(0,D.trueD,1.05,"var(--true)",4);
    txt(0,1.05,LP,-LP,"start","истинная разность  0.0000001","var(--true)",FS);
    line(D.trueD,1.05,D.trueD,0.12,{stroke:"var(--true)","stroke-width":1,
      "stroke-dasharray":"4 4"});

    // ---- вычисленная разность (ниже оси) ----
    bar(0,D.calcD,-1.05,"var(--calc)",4);
    txt(0,-1.05,LP,LP2+4,"start","вычислено  0.00000011920929","var(--calc)",FS);
    line(D.calcD,-1.05,D.calcD,-0.12,{stroke:"var(--calc)","stroke-width":1,
      "stroke-dasharray":"4 4"});

    // ---- зазор = ошибка, подпись у хвоста стрелки ----
    bar(D.trueD,D.calcD,0.42,"var(--noise)",3);
    txt(D.calcD,0.42,LP,-LP,"start",D.err,"var(--noise)",FS);

    // ---- слагаемые слева: a и b, разведены по вертикали ----
    var xL=-0.40;
    txt(xL,1.62,0,0,"start",D.a.label,"var(--fg)",FS);
    txt(xL,1.62,0,LP2,"start",D.a.stored,"var(--muted)",FSS);
    txt(xL,0.92,0,0,"start",D.b.label,"var(--fg)",FS);
    txt(xL,0.92,0,LP2,"start",D.b.stored,"var(--muted)",FSS);
    txt(xL,0.30,0,0,"start","единицы сокращаются — остаётся хвост","var(--muted)",FSS);
    line(xL,0.05,-0.06,0.05,{stroke:"var(--grid)","stroke-width":1});

    // ---- легенда снизу ----
    txt(0,-1.72,0,0,"start","δ = |d̂ − d| / |d| = (0.00000011920929 − 0.0000001) / 0.0000001 ≈ 0.19",
        "var(--muted)",FSS);
  }catch(e){
    svg.setAttribute("hidden","");
    var fb=document.getElementById("fb");
    fb.hidden=false;
    fb.textContent="Схема должна была показать: a = 1.0000001 (в памяти 1.00000011920929) "+
      "и b = 1.0000000. Истинная разность 0.0000001, вычисленная 0.00000011920929. "+
      "Зазор между ними — относительная ошибка 19.2%.";
  }
})();
</script>
</body>
</html>
