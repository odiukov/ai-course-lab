- concept: успешный gradcheck подтверждает лишь локальное согласование прямого и обратного проходов, а не качество модели
  question: Что можно и чего нельзя заключить об обучаемой модели после успешного torch.autograd.gradcheck?
  explanation: gradcheck проверяет узкое техническое свойство backward относительно forward на выбранных входах. Он не оценивает постановку задачи, архитектуру, данные или будущую динамику обучения.
  kind: open
  reference: Можно заключить, что аналитические производные согласуются с численными оценками в проверенных точках. Нельзя заключить, что функция потерь удачна, модель полезна или обучение обязательно сойдётся.
  id: 052-kogda-proveryat-3
  fingerprint: c86fa630
