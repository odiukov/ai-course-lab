- concept: для надёжного gradcheck нужен небольшой вход двойной точности с вычислением градиента в гладкой детерминированной точке
  question: Какой вход лучше всего подходит для проверки пользовательской функции через torch.autograd.gradcheck?
  explanation: Обычно gradcheck запускают на малом детерминированном входе float64 с requires_grad=True. Двойная точность уменьшает влияние округления, а точки разрыва и случайность могут вызвать расхождение даже при корректной реализации.
  kind: choice
  options:
    - Небольшой тензор torch.double с requires_grad=True в гладкой точке без случайности
    - Большой тензор одинарной точности с requires_grad=False
    - Тензор двойной точности в точке излома функции модуля
    - Случайно изменяющийся при каждом вызове тензор одинарной точности
  correct: 0
  id: 052-kogda-proveryat-2
