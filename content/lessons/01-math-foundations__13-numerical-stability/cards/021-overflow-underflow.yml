- concept: исчезновение порядка в экспоненте может проявиться как минус бесконечность только при последующем логарифмировании
  question: В вычислениях одинарной точности программа сначала получает `p = exp(-105)`, а затем вычисляет `log(p)`. Математически композиция должна вернуть исходный аргумент. Почему программа может получить `-inf`, и на какой операции возникла первопричина?
  explanation: '`exp(-105)` меньше наименьшего положительного субнормального значения в формате одинарной точности, поэтому сохраняется как ноль. `log()` лишь делает уже произошедшее исчезновение порядка заметным, возвращая `-inf`.'
  kind: open
  reference: Результат экспоненты математически положителен, но настолько мал, что не представим даже как субнормальное число и округляется до нуля. Последующий логарифм нуля возвращает `-inf`, однако первопричина возникла раньше — при вычислении экспоненты.
