- concept: преобразование из float32 в bfloat16 сохраняет экспоненту и отбрасывает младшую часть мантиссы
  question: Как устроено простое преобразование числа из формата одинарной точности IEEE в Brain Floating Point?
  explanation: У float32 и bfloat16 одинаковая 8-битная экспонента. Поэтому при простом преобразовании сохраняются знак, экспонента и старшие биты мантиссы, а младшие 16 бит отбрасываются. Диапазон остаётся почти тем же, но точность уменьшается.
  kind: choice
  options:
    - Сохраняются знак и экспонента, а младшие биты мантиссы отбрасываются
    - Сохраняется вся мантисса, а экспонента заменяется более короткой
    - Экспонента обнуляется, а значение переносится целиком в мантиссу
    - Отбрасываются старшие биты экспоненты и младшие биты мантиссы
  correct: 0
  id: 057-bfloat16-vs-float16-1
  fingerprint: 524c6332
- concept: float16 подходит для инференса с ограниченными значениями, когда точность важнее широкого диапазона
  question: 'В инференсе гарантировано, что промежуточные значения не выходят за небольшой диапазон, но важно точнее различать близкие числа. Какой формат выбрать: классический IEEE half precision или Brain Floating Point? Объясни почему.'
  explanation: У float16 10 бит мантиссы против 7 у bfloat16, поэтому в пределах допустимого диапазона он точнее различает близкие значения. bfloat16 полезнее при обучении, где широкий диапазон экспоненты защищает от переполнения.
  kind: open
  reference: 'Следует выбрать классический IEEE half precision, то есть float16: при безопасном диапазоне его более длинная мантисса даёт большую точность, а преимущество широкого диапазона bfloat16 не используется.'
  id: 057-bfloat16-vs-float16-2
  fingerprint: f129cc08
