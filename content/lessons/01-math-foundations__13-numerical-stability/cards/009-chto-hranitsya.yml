- concept: умножение нормализованного двоичного числа на основание системы меняет экспоненту без изменения мантиссы
  question: Два положительных нормализованных двоичных числа отличаются ровно в основание системы счисления раз. Как соотносятся их представления, если переполнения и субнормальных значений нет?
  explanation: Умножение нормализованного двоичного числа на 2 сдвигает масштаб через экспоненту, не меняя значащую часть. Поэтому у float32-представлений 0.1 и 0.2 совпадает мантисса, но различается экспонента.
  kind: choice
  options:
    - Мантиссы совпадают, а экспоненты отличаются на один шаг
    - Экспоненты совпадают, а мантиссы инвертированы
    - Совпадает только знаковый бит, остальные поля не связаны
    - Мантисса большего числа обязательно содержит больше значащих битов
