- concept: ошибки округления могут накапливаться при последовательном суммировании малых обновлений
  question: После множества небольших обновлений градиента накопленная сумма слегка отличается от результата вычисления в более высокой точности. Какова наиболее вероятная причина?
  explanation: Формат с конечной мантиссой округляет промежуточные результаты. При длинной последовательности сложений отдельные малые погрешности могут накопиться и заметно сместить итоговую сумму.
