- concept: тождество сдвига log-sum-exp верно для любой конечной вещественной константы
  question: Для каких значений $c$ верно тождество $\log\sum_i e^{x_i}=c+\log\sum_i e^{x_i-c}$?
  explanation: В каждом показателе можно прибавить и вычесть любую константу $c$. Затем общий множитель $e^c$ выносится из суммы, а логарифм превращает его в слагаемое $c$. Выбор максимума нужен для численной устойчивости, но не для справедливости равенства.
  kind: choice
  options:
    - Только для $c=\max_i x_i$
    - Только для неотрицательных $c$
    - Для любого конечного вещественного $c$
    - Только для $c$, равного одному из $x_i$
  correct: 2
  id: 028-dokazatelstvo-1
  fingerprint: 6cbc39f7
- concept: вывод тождества сдвига log-sum-exp из свойств экспоненты и логарифма
  question: Расположите преобразования в порядке, который доказывает тождество сдвига log-sum-exp для произвольной константы $c$.
  explanation: Сначала показатель переписывается без изменения, затем используется правило экспоненты. Одинаковый положительный множитель выносится из суммы, после чего логарифм произведения разделяется на сумму логарифмов.
  kind: order
  items:
    - Представить каждый показатель как $x_i-c+c$
    - Разложить $e^{x_i-c+c}$ в произведение $e^{x_i-c}e^c$
    - Вынести общий множитель $e^c$ за знак суммы
    - Применить свойство логарифма произведения и равенство $\log(e^c)=c$
  id: 028-dokazatelstvo-2
  fingerprint: 36b4a980
