- concept: переполнение распространяется от конечного значения через inf к NaN и разрушает обучение
  question: Расположите события в типичном порядке развития численной аварии во время обучения.
  explanation: Переполнение сначала возникает в конкретной операции и даёт inf. Дальнейшая арифметика может превратить его в NaN, после чего нечисловые значения быстро распространяются по вычислительному графу и градиентам.
  kind: order
  items:
    - Активация или логит ещё имеет конечное значение
    - Одна из операций переполняется и возвращает inf
    - Последующие недопустимые операции с inf порождают NaN
    - NaN распространяется по градиентам и делает дальнейшее обучение бессмысленным
  id: 002-tri-simptoma-2
  fingerprint: c2bca696
