- concept: коэффициент обрезания по норме равен отношению порога к текущей норме
  question: Градиент имеет координаты (8, 15), а его евклидова норма равна 17. Порог обрезания по норме равен 10. На какой коэффициент нужно умножить градиент?
  explanation: Поскольку текущая норма превышает порог, коэффициент равен 10 / 17 ≈ 0.588. После такого масштабирования норма градиента станет равна порогу, а направление не изменится.
  kind: numeric
  answer: 0.588
  tolerance: 0.005
