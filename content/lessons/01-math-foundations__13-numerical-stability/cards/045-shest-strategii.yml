- concept: clamp ограничивает аргумент экспоненты заданным диапазоном
  question: Чему примерно равно выражение exp(clamp(12, -9, 9))?
  explanation: Clamp заменяет аргумент 12 верхней границей 9, поэтому вычисляется exp(9) ≈ 8103.08. Это предотвращает попадание экспоненты в опасную область, но изменяет результат за границей диапазона.
  kind: numeric
  answer: 8103.08
  tolerance: 0.5
  id: 045-shest-strategii-1
  fingerprint: a06d0823
- concept: epsilon защищает допустимую границу области определения, но не исправляет существенно отрицательный аргумент логарифма
  question: Величина p по смыслу должна быть неотрицательной, но из предыдущего вычисления пришло p = -0.02. Почему log(p + 1e-6) — неправильный способ исправить ситуацию?
  explanation: Малый epsilon помогает при допустимом нуле или погрешности около границы. Значение -0.02 существенно отрицательно, и добавление 1e-6 не возвращает его в область определения логарифма.
  kind: choice
  options:
    - Epsilon всегда превращает результат логарифма в бесконечность
    - После добавления epsilon аргумент остаётся отрицательным, а само значение указывает на ошибку в предыдущих вычислениях
    - Логарифм нельзя вычислять для значений меньше единицы
    - Epsilon разрешено добавлять только в знаменатели
  correct: 1
  id: 045-shest-strategii-2
  fingerprint: 54dbc30d
- concept: градиенты обрезают до обновления параметров, чтобы ограничить разрушительно большой шаг оптимизации
  question: Объясни своими словами, зачем обрезать слишком большие градиенты и почему это делают до обновления весов.
  explanation: 'Gradient clipping действует профилактически: он уменьшает чрезмерный градиент перед тем, как тот изменит параметры. Проверка isfinite лишь обнаруживает уже возникшее неконечное значение и не заменяет обрезку.'
  kind: open
  reference: Обрезка ограничивает величину градиента или его норму, поэтому оптимизатор не делает чрезмерно большой шаг. Её применяют до обновления, потому что после записи бесконечных или NaN-весов повреждение уже распространится на следующие прямые и обратные проходы.
  id: 045-shest-strategii-3
  fingerprint: d908845c
