- concept: кросс-энтропия около натурального логарифма числа классов указывает на почти равномерные предсказания
  question: Заполните пропуск в диагностическом ориентире для классификатора, который распределяет вероятность поровну между всеми классами.
  explanation: При равномерном распределении вероятность правильного класса равна обратной величине от K, поэтому отрицательный логарифм этой вероятности равен ln(K). Если loss надолго застывает около этого уровня, модель, вероятно, не учится; стоит проверить метки, функцию потерь, мёртвые ReLU и прохождение градиентов.
  kind: cloze
  template: Если классов K и предсказания равномерны, кросс-энтропийный loss равен ___.
  answer: ln(K)
  accept:
    - ln K
    - log(K)
    - натуральный логарифм K
  id: 064-katalog-bagov-2
