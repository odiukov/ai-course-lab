- concept: softmax сохраняет порядок классов по величине логитов
  question: Объясните, почему класс с большим логитом всегда получает большую вероятность softmax.
  explanation: Если один логит больше другого, его экспонента также больше. Деление обоих значений на общую положительную сумму не меняет это неравенство.
  kind: open
  reference: Экспонента является строго возрастающей функцией, а все экспоненциальные веса делятся на один и тот же положительный знаменатель. Поэтому порядок вероятностей совпадает с порядком логитов.
