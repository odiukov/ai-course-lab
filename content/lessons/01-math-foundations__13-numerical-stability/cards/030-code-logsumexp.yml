- concept: сумма экспонент после вычитания максимума ограничена числом элементов
  question: Для непустого списка длины k вычислили S = sum(exp(x - max(xs))) по всем x. В каких пределах находится S?
  explanation: Все показатели экспоненты неположительны, поэтому каждое слагаемое не превосходит единицу. Максимальный элемент после вычитания самого себя даёт экспоненту от нуля, то есть единицу. Поэтому сумма не меньше единицы и не больше числа элементов.
  kind: choice
  options:
    - От единицы до k включительно
    - Всегда строго меньше единицы
    - От k до бесконечности
  correct: 0
  id: 030-code-logsumexp-1
  fingerprint: 48d777d1
- concept: log-sum-exp одинаковых значений равен общему значению плюс логарифм их количества
  question: Чему примерно равен logsumexp для списка из 6 одинаковых значений, каждое из которых равно 12?
  explanation: Для одинаковых значений x сумма экспонент равна n·exp(x), поэтому результат равен x + ln(n). Здесь получается 12 + ln(6) ≈ 13.79.
  kind: numeric
  answer: 13.79
  tolerance: 0.01
  id: 030-code-logsumexp-2
  fingerprint: 18bd38d5
