- concept: неявный старший бит увеличивает эффективную точность нормализованного числа
  question: У нормализованного двоичного числа старший бит значащей части не хранится в поле мантиссы. Почему его можно восстановить и какую пользу это даёт?
  explanation: У нормализованного float32 перед точкой подразумевается единица. Поэтому 23 сохранённых бита мантиссы дают 24 бита эффективной значащей части. Для нуля и субнормальных значений это правило не применяется.
  kind: open
  reference: После нормализации значащая часть всегда начинается с единицы, поэтому этот бит можно подразумевать. Освободившееся место используют для хранения ещё одного дробного бита, повышая точность без расширения формата.
  id: 004-raspil-bitov-2
  fingerprint: c33aba46
