- concept: machine epsilon — минимальная прибавка к единице, различимая в данном формате
  question: Дополните определение machine epsilon.
  explanation: При меньшей прибавке округление вернёт исходную единицу. Для float32 machine epsilon составляет примерно 1.19e-7.
  kind: cloze
  template: Machine epsilon ε — наименьшее положительное число, для которого ___.
  answer: 1.0 + ε != 1.0
  accept:
    - 1 + ε != 1
    - 1.0 + epsilon != 1.0
    - 1 + epsilon ≠ 1
