- concept: центральная конечная разность оценивает производную по двум симметричным значениям функции
  question: Для проверки градиента получены f(x+h) = 6.8 и f(x-h) = 5.2 при h = 0.4. Чему равна оценка производной центральной разностью?
  explanation: Центральная разность равна (f(x+h) - f(x-h)) / (2h). Получаем (6.8 - 5.2) / 0.8 = 2.0.
  kind: numeric
  answer: 2
  tolerance: 0.01
  id: 066-itogovaya-proverka-3
  fingerprint: b2c0fef3
