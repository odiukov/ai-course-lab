- concept: обновления в алгоритме Кэхана выполняются в порядке, сохраняющем старую сумму для вычисления компенсации
  question: Расположите операции одной итерации суммирования Кэхана в правильном порядке. Перед итерацией известны накопленная сумма s, компенсация c и очередное слагаемое x.
  explanation: Сначала к слагаемому применяют прежнюю компенсацию, затем получают временную сумму. Новую компенсацию вычисляют, пока доступна старая s, и только после этого присваивают s = t.
  kind: order
  items:
    - Вычислить скорректированное слагаемое y = x - c
    - Вычислить временную новую сумму t = s + y
    - 'Обновить компенсацию: c = (t - s) - y'
    - 'Заменить накопленную сумму: s = t'
  id: 012-kahan-ideya-2
