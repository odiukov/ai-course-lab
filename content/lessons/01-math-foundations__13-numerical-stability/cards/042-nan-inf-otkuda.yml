- concept: деление на очень малый ненулевой знаменатель может переполнить формат
  question: Почему деление конечного ненулевого числа на ненулевой знаменатель иногда всё же возвращает бесконечность?
  explanation: 'Для появления бесконечности знаменатель не обязан быть точно нулевым: достаточно, чтобы математический результат деления оказался вне диапазона формата.'
  kind: open
