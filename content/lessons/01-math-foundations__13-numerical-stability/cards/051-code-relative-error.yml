- concept: градиенты противоположных знаков дают относительную ошибку больше единицы
  question: Аналитический градиент равен 7, а численный — −4. Чему равна относительная ошибка, если нижний порог знаменателя не влияет на результат?
  explanation: Абсолютное расхождение равно |7 − (−4)| = 11, а масштаб сравнения — max(|7|, |−4|) = 7. Поэтому relative_error = 11 / 7 ≈ 1.5714. Значение больше единицы отражает не только различие величин, но и несовпадение направлений градиентов.
  kind: numeric
  answer: 1.5714
  tolerance: 0.0001
  id: 051-code-relative-error-1
  fingerprint: e8c9c421
- concept: формула относительной ошибки симметрична относительно двух сравниваемых градиентов
  question: Почему relative_error не изменится, если поменять аналитический и численный градиенты местами?
  explanation: И абсолютная разница, и максимум модулей симметричны. Поэтому формула измеряет расхождение между градиентами, не назначая одному из них особую роль.
  kind: open
  reference: 'Числитель не изменится, потому что |a − b| = |b − a|. Знаменатель тоже останется прежним: максимум модулей и фиксированного нижнего порога не зависит от порядка аргументов.'
  id: 051-code-relative-error-2
  fingerprint: 78288dbe
