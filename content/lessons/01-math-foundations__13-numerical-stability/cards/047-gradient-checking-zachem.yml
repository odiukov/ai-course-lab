- concept: численный градиент служит независимой проверкой аналитического градиента
  question: Как надёжнее всего проверить аналитический градиент нового слоя?
  explanation: Численный градиент получают непосредственно из значений функции потерь, поэтому он не повторяет возможную ошибку в формулах обратного распространения. Уменьшение loss само по себе не доказывает правильность производных.
  kind: choice
  options:
    - Повторно вычислить его по тем же формулам обратного распространения
    - Оценить производную по изменениям функции потерь при малых возмущениях параметра и сравнить результаты
    - Убедиться, что функция потерь хотя бы иногда уменьшается
    - Увеличить размер обучающего батча
  correct: 1
  id: 047-gradient-checking-zachem-1
  fingerprint: e75083f2
- concept: относительная ошибка нормирует расхождение градиентов на их масштаб
  question: Заполни пропуск в общей формуле сравнения аналитического и численного градиентов.
  explanation: Деление на максимальный модуль градиентов делает оценку зависимой от их масштаба, а малая положительная константа защищает знаменатель, когда оба градиента близки к нулю. В материале для неё используется 10^-8.
  kind: cloze
  template: relative_error = |g_a - g_n| / max(|g_a|, |g_n|, ___)
  answer: ε
  accept:
    - epsilon
    - малое положительное число
    - положительная константа
  id: 047-gradient-checking-zachem-2
  fingerprint: 250be3db
