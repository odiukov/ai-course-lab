- concept: альтернативные пути в HMM суммируются в логарифмической шкале через log-sum-exp
  question: Алгоритм для скрытой марковской модели хранит вероятности частичных путей в логарифмической шкале. Как следует объединить несколько альтернативных путей, ведущих в одно состояние?
  explanation: Вероятности альтернативных путей складываются. В логарифмической шкале точному сложению вероятностей соответствует log-sum-exp. Выбор только максимума дал бы алгоритм Витерби, а не полную сумму по путям.
  kind: choice
  options:
    - Сложить их логарифмические вероятности
    - Применить log-sum-exp к их логарифмическим вероятностям
    - Оставить только путь с максимальной логарифмической вероятностью
    - Перемножить их логарифмические вероятности
  correct: 1
  id: 031-gde-vstrechaetsya-lse-1
  fingerprint: 7de6e27c
- concept: кросс-энтропия по логитам равна log-sum-exp всех логитов минус логит правильного класса
  question: Заполни пропуск в формуле кросс-энтропии для логитов z и правильного класса y.
  explanation: Логарифм softmax для правильного класса равен z_y − logsumexp(z). Кросс-энтропия берёт это выражение с противоположным знаком.
  kind: cloze
  template: CE(z, y) = ___ - z_y
  answer: logsumexp(z)
  accept:
    - log(sum(exp(z)))
    - log(Σ_i exp(z_i))
  id: 031-gde-vstrechaetsya-lse-2
  fingerprint: 8c2e750c
- concept: логарифм плотности смеси вычисляется как log-sum-exp логарифмов взвешенных компонент
  question: Смесь распределений имеет веса π_k и плотности компонент p_k(x). Объясни, как вычислить log p(x) в логарифмической шкале и почему простое сложение log p_k(x) неверно.
  explanation: Плотность смеси задаётся суммой π_k p_k(x). Поэтому после перехода к логарифмам внутри log-sum-exp должны находиться log π_k + log p_k(x), включая логарифм веса каждой компоненты.
  kind: open
  reference: Для каждой компоненты вычисляют log π_k + log p_k(x), после чего применяют log-sum-exp по k. Простое сложение логарифмов соответствовало бы произведению компонент, тогда как плотность смеси является суммой их взвешенных плотностей.
  id: 031-gde-vstrechaetsya-lse-3
  fingerprint: a85139b2
