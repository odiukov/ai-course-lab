- concept: обучаемые gamma и beta возвращают сети свободу выбора масштаба и сдвига после нормализации
  question: Зачем после стандартизации активаций LayerNorm применяет обучаемые параметры gamma и beta?
  explanation: Gamma умножает нормализованные значения, а beta сдвигает их. Поэтому нормализация стабилизирует исходный масштаб вычислений, не лишая сеть возможности восстановить полезный ей диапазон активаций.
  kind: choice
  options:
    - Чтобы сеть могла выбрать подходящие масштаб и сдвиг нормализованных значений
    - Чтобы навсегда ограничить активации фиксированным диапазоном
    - Чтобы вычислить статистики по всему обучающему набору
    - Чтобы увеличить разрядность формата чисел
