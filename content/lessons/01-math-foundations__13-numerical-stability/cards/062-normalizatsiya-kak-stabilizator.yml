- concept: нормализация стабилизирует численный масштаб активаций на глубине сети
  question: Объясни своими словами, почему нормализация активаций служит численным стабилизатором при прямом и обратном проходах.
  explanation: Последовательные преобразования могут многократно усиливать или ослаблять значения. Нормализация делает масштаб входов следующих слоёв предсказуемее, уменьшая риск выхода вычислений из безопасного численного диапазона.
  kind: open
  reference: Она регулярно возвращает активации к контролируемому масштабу, поэтому их величины не растут бесконтрольно по мере прохождения слоёв. Это снижает риск переполнения на прямом проходе и чрезмерного роста градиентов на обратном.
  id: 062-normalizatsiya-kak-stabilizator-3
