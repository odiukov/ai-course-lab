- concept: нулевая вероятность истинного класса превращает кросс-энтропийный loss в положительную бесконечность
  question: Заполни результат для кросс-энтропии, если истинному классу присвоена ровно нулевая вероятность.
  explanation: Логарифм нуля равен минус бесконечности. Знак минус в формуле кросс-энтропии меняет результат на положительную бесконечность.
  kind: cloze
  template: loss = -log(p_true); при нулевой p_true значение loss равно ___
  answer: +inf
  accept:
    - inf
    - положительная бесконечность
    - бесконечность
