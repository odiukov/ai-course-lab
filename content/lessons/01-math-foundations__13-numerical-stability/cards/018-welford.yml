- concept: накопленная сумма квадратов отклонений в алгоритме Уэлфорда обновляется через старое и новое средние
  question: Какой рекуррентной формулой алгоритм Уэлфорда обновляет накопленную величину M после пересчёта среднего?
  explanation: Уэлфорд прибавляет произведение отклонений нового значения от старого и нового средних. Такое обновление учитывает сдвиг среднего и сохраняет корректную накопленную сумму квадратов отклонений.
