- concept: результат предыдущего шага входит в аргументы следующего и потому в его ключ, поэтому ключи вниз по цепочке зависят от значений вверх по ней
  question: В workflow результат шага `reserve_stock` передаётся аргументом в шаг `charge_payment`. Как это связывает ключи двух шагов и что произойдёт с ключом `charge_payment`, если резервирование при новом прогоне вернёт другой идентификатор?
  explanation: 'Цепочка ключей наследует значения вверх по потоку данных. Это причина, по которой недетерминизм в начале сценария дорого обходится в конце: он сдвигает ключи всех последующих шагов и обнуляет уже накопленный журнал.'
  kind: open
  reference: Ключ activity строится из её имени и аргументов вызова. Раз результат `reserve_stock` попадает в аргументы `charge_payment`, ключ второго шага зависит от значения, полученного на первом. Пока первый шаг восстанавливается из журнала, его результат неизменен, аргументы второго шага те же, ключ совпадает и списание подставляется из журнала. Если же первый шаг выполнится заново и вернёт другой идентификатор, ключ `charge_payment` изменится, совпадения в журнале не найдётся и списание произойдёт по-настоящему — второй раз. Поэтому важно, чтобы ранние шаги восстанавливались из журнала, а не переигрывались.
