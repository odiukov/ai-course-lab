- concept: цена наивного перезапуска растёт с числом внешних действий, которые прогон успел выполнить
  question: Два прогона падают одинаково. Первый успел только скачать данные, второй уже разослал уведомления и записал бухгалтерские проводки. Почему стоимость наивного перезапуска у них принципиально разная?
  explanation: Скачивание можно повторить почти безвредно. Второе уведомление и вторая проводка — новые реальные факты, которые придётся разгребать вручную. Чем больше внешних действий позади, тем дороже команда «начать заново».
  kind: choice
  options:
    - Второй потратил больше процессорного времени, поэтому его перезапуск дольше
    - У второго повтор создаёт дубликаты необратимых внешних действий, а у первого — только повторное чтение
    - Первый нельзя перезапускать вообще, пока данные не удалены
