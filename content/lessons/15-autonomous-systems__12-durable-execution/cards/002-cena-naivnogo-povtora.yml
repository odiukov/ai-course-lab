- concept: перезапуск программы возвращает в начало её собственное состояние, но не откатывает внешние системы, изменённые прошлым запуском
  question: Что наивный перезапуск процесса НЕ возвращает в исходное состояние?
  explanation: Процесс стартует чистым, но мир — нет. Побочный эффект существует вне процесса, поэтому второй запуск не отменяет первый, а добавляет к нему.
