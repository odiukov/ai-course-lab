- concept: восстановление технического состояния не восстанавливает целостность рассуждения, если корректность требует одного непрерывного контекстного окна
  question: Почему для части задач на рассуждение и однократных генераций durable execution не спасает прогон, даже если журнал полностью цел?
  explanation: Durable execution даёт гарантию только на то, что попало в durable-хранилище. Целостность рассуждения туда не попадает, поэтому механизм не применим к задачам, где корректность требует единого прохода.
  kind: open
  reference: 'Такие задачи корректны только тогда, когда весь ход мысли прошёл в одном контекстном окне от начала до конца. Durable execution восстанавливает записанное: результаты завершённых activity, ключи, точку остановки. Но связная цепочка рассуждения жила в контексте модели, а не в журнале, и склеить её из независимых продолжений нельзя — продолжение стартует с другим контекстом и может противоречить уже сделанной части. Восстановимость процесса тут не равна восстановимости результата, поэтому дешевле и честнее перезапустить генерацию целиком.'
