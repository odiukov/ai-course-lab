  question: Для какой задачи накладные расходы durable execution окупятся хуже всего?
  explanation: 'Короткое строго read-only извлечение информации можно просто повторить: повтор безопасен (внешний мир не тронут) и дёшев (полминуты). Остальные варианты уже оплатили внешние записи или дорогие вычисления — там повтор стоит больше, чем ведение журнала.'
  kind: choice
  options:
    - Агент час обходит склад и по частям переносит остатки в учётную систему
