- concept: маркером реального выполнения в журнале служит событие старта activity, записываемое непосредственно перед вызовом тела функции
  question: Функция считает реальные запуски activity по журналу событий. Какой тип события фильтруется?
  explanation: Обёртка пишет событие старта ровно перед вызовом тела функции, поэтому такая запись существует тогда и только тогда, когда работа действительно началась. Replay стартовое событие не порождает — он лишь читает готовый результат.
  kind: cloze
  template: |-
    def execution_count(event_log):
        return sum(1 for event in event_log if event["type"] == ___)
  answer: '"activity_started"'
  accept:
    - activity_started
    - '''activity_started'''
    - '"started"'
    - started
  id: 030-execution-count-1
  fingerprint: a76ea45b
- concept: подсчёт по событиям завершения занижает реальную работу, потому что прерванный или упавший запуск завершения не записывает
  question: 'Инженер реализовал `execution_count` через подсчёт событий завершения activity, рассуждая: «завершение есть — значит, функция работала». В чём дефект такой реализации?'
  explanation: 'Запись завершения появляется только у успеха, а расход возникает уже в момент старта: процессор, сетевой запрос, токены модели. Сорвавшаяся попытка стоила денег, но по завершениям невидима. Журнал только дописывается и старые записи не правит, так что вариант с удалением тоже неверен.'
  kind: choice
  options:
    - Запуск, оборвавшийся на середине или упавший, завершения не записывает, поэтому потраченная им работа выпадает из счёта
    - События завершения дублируются при каждом replay и счётчик завышается
    - События завершения не содержат имени activity, поэтому их нельзя различить
    - Журнал хранит завершения только для последней попытки, а промежуточные удаляет
