- concept: суммарное число реальных запусков тел activity при durable replay складывается из попыток первого прогона и только незавершённых шагов после восстановления
  question: Workflow состоит из 7 activity. В первом прогоне все предшествующие завершились, а сбой случился во время пятой activity — она успела стартовать и упала. Прогон восстанавливают через durable replay. Сколько раз всего за оба прогона реально запускалось тело activity?
  explanation: 'Первый прогон: 4 завершённых плюс сорвавшийся пятый запуск = 5 реальных выполнений. При восстановлении первые 4 берутся из журнала (запусков нет), реально выполняются пятая, шестая и седьмая = 3. Итого 5 + 3 = 8. Наивный перезапуск дал бы 5 + 7 = 12.'
  kind: numeric
  answer: 8
  tolerance: 0.5
  id: 029-izmerimaya-polza-1
  fingerprint: b83b75a7
- concept: экономия durable execution измеряется числом запусков тел activity, а не числом пройденных строк кода workflow
  question: Два прогона одного workflow завершились, оба прошли одни и те же строки кода оркестрации. Почему «число пройденных шагов workflow» — негодная метрика пользы durable execution, и какой счётчик её показывает?
  explanation: Метрика должна коррелировать с деньгами и временем. Число проходов по коду оркестрации при replay не уменьшается принципиально — уменьшается число реальных выполнений activity, и только этот счётчик показывает выигрыш.
  kind: open
  reference: 'Код workflow при восстановлении проходится с начала, поэтому число пройденных строк одинаково у наивного перезапуска и у durable replay — метрика слепа к разнице. Стоят же не строки, а обращения к внешнему миру: вызовы модели, сетевые запросы, запись в БД, процессорное время. Поэтому считать надо запуски тел activity — сколько раз функция действительно исполнилась. Возврат сохранённого результата проводит сценарий через ту же строку, но не создаёт нового расхода и счётчик не двигает; неуспешная попытка расход создаёт и в счётчик входит.'
