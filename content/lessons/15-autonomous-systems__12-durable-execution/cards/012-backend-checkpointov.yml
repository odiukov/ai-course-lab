- concept: долговечность чекпоинтов растёт по мере вынесения хранилища за пределы процесса, а затем и хоста
  question: Расставь варианты размещения чекпоинтов от наименее долговечного к наиболее долговечному.
  explanation: 'Каждый шаг вынимает состояние из более узкой области жизни: память живёт ровно столько, сколько процесс; файл привязан к машине; общая база живёт независимо от того, какой процесс и на каком хосте обратился. Именно поэтому локальный файл годится для разработки, а продакшен, где воркеры пересоздаются на других узлах, требует внешнего хранилища.'
  kind: order
  items:
    - Структура в оперативной памяти процесса — состояние исчезает вместе с завершением процесса
    - Локальный файл на диске воркера — переживает перезапуск процесса, но остаётся на прежнем хосте
    - Отдельное общее хранилище вне воркеров — доступно любому новому процессу на любом хосте
  id: 012-backend-checkpointov-1
  fingerprint: 39f3eaf1
- concept: долговечность in-memory-хранилища определяется его настройкой сохранения на диск, а не самим выбором технологии
  question: Команда держит чекпоинты в in-memory-хранилище вроде Redis. Переживут ли чекпоинты полную потерю экземпляра?
  explanation: Отделённость от воркера даёт переносимость между процессами, но не долговечность. Долговечность появляется, когда записи попадают на диск — через AOF или снимки. Без этого падение экземпляра уносит чекпоинты, и durable execution превращается в обычный процесс с внешним кешем.
  kind: choice
  options:
    - 'Зависит от настройки: с журналом записи (AOF) или периодическими снимками данные восстановимы, без них — теряются'
    - 'Да, всегда: такое хранилище работает отдельно от воркеров, значит состояние durable по определению'
    - 'Нет, никогда: данные из оперативной памяти принципиально невозможно восстановить после потери экземпляра'
    - 'Зависит только от того, один экземпляр или кластер: в кластере данные не теряются'
  correct: 0
  id: 012-backend-checkpointov-2
  fingerprint: '57649762'
- concept: гарантия durable execution не сильнее долговечности выбранного бэкенда
  question: В системе аккуратно реализованы чекпоинты, ключи сессий и replay, но хранилище чекпоинтов теряет данные при своём перезапуске. Объясни, почему прогоны всё равно не переживают сбой.
  explanation: 'Отсюда практический вывод: выбор бэкенда — не деталь конфигурации, а часть гарантии. Файл на одном хосте, кеш без записи на диск или структура в памяти процесса ограничивают долговечность прогона независимо от того, насколько правильно написан workflow.'
  kind: open
  reference: 'Восстановление работает так: по ключу сессии находят последний чекпоинт и записанные результаты и заново проходят логику, подставляя их вместо повторного выполнения. Всё это опирается на то, что записи физически существуют после сбоя. Если бэкенд их теряет, найти нечего: ключ указывает в пустоту, журнала для replay нет, и прогон начинается с нуля. Логика durable execution лишь описывает, как использовать сохранённое состояние, а сохраняет его бэкенд — поэтому итоговая гарантия равна минимуму из корректности логики и долговечности хранилища.'
  id: 012-backend-checkpointov-3
  fingerprint: a4f550df
