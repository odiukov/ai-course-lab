- concept: человеческие ворота ставят на переходах, где меняется риск или требуются новые полномочия, а не на каждом чекпоинте
  question: Где в длинной автономной задаче по программированию разумно ставить ворота с участием человека?
  explanation: 'Ворота дороги: они останавливают работу и требуют внимания человека, поэтому их тратят на необратимое и на расширение полномочий. Ворота на каждом чекпоинте убивают автономность, ворота только в конце пропускают необратимые действия без надзора. Решение человека при этом само сохраняется в журнале как состояние прогона.'
  kind: choice
  options:
    - На каждом чекпоинте, чтобы человек видел весь ход работы
    - Только в самом конце, когда результат готов к приёмке
    - 'Перед переходами, меняющими риск или требующими новых полномочий: миграция данных, удаление файлов, обращение к продакшену, а также после неожиданной смены плана'
