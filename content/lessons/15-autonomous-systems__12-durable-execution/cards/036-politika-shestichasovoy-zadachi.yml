- concept: исчерпанный бюджет участка — сигнал остановиться и пересмотреть подход, а не работать быстрее или продолжать в долг
  question: Участку длинной задачи назначен бюджет — 25 минут и 120 вызовов модели. Агент исчерпал бюджет, не добравшись до результата участка. Как должна отреагировать политика?
  explanation: Смысл бюджета участка — не подгонять агента, а ограничить цену неудачной гипотезы. Остановка с фиксацией «этот путь не дал результата» не даёт одной ошибочной ветке съесть остаток многочасовой задачи; автопродление бюджета отменяет саму защиту.
  kind: choice
  options:
    - Остановиться и пересмотреть подход, зафиксировав, что гипотеза не сработала
    - Автоматически выдать участку добавочный бюджет и продолжить ту же линию
    - Сжать оставшиеся шаги, чтобы уложиться в изначальный лимит
  correct: 0
