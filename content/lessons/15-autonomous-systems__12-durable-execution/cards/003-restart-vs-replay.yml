- concept: при durable replay код workflow проходится заново, но завершённые activity не исполняются повторно — их результаты берутся из журнала
  question: Workflow упал и перезапустился под управлением durable-движка. Журнал содержит записи о 12 завершённых activity. Что произойдёт с кодом workflow и с этими 12 действиями?
  explanation: 'Replay — это повторное прохождение пути решений, а не повторная съёмка сцены. Движок не умеет прыгать в середину функции: он честно исполняет код с начала, но на каждом обращении к уже завершённой activity отдаёт записанный результат вместо реального вызова. Поэтому три вызова инструментов из примера с четырёхчасовым прогоном не повторяются, хотя код, который их вызывает, проходится ещё раз.'
  kind: choice
  options:
    - Код workflow пойдёт с самого начала, но все 12 activity будут выполнены реально второй раз
    - Код workflow пойдёт с самого начала, а вместо вызова каждой из 12 завершённых activity движок подставит записанный результат
    - Код workflow стартует ровно с 13-й строки, предыдущие строки не исполняются вообще
    - Код workflow не запускается, пока оператор вручную не подтвердит содержимое журнала
  correct: 1
  id: 003-restart-vs-replay-1
  fingerprint: 5ebeea72
- concept: подтверждение человека — тоже activity, чей результат живёт в журнале, поэтому при восстановлении человека не переспрашивают
  question: Длинный прогон дважды останавливался и просил у человека одобрение; оба одобрения получены. Затем процесс упал. Почему durable execution не заставит человека одобрять то же самое ещё раз?
  explanation: 'Ожидание решения человека укладывается в ту же схему, что и вызов инструмента: старт зафиксирован, результат записан. Значит, при восстановлении он воспроизводится из журнала. Наивный цикл `while True` этого не умеет и переспрашивает про то, что уже одобрено, — а повторные вопросы дорого стоят доверием, в отличие от переплаты за токены.'
  kind: choice
  options:
    - Потому что запрос к человеку — это чистое вычисление, и движок вычисляет ответ сам
    - Потому что ответ человека записан в журнал как результат завершённой activity и при восстановлении воспроизводится оттуда
    - Потому что после сбоя движок автоматически считает все ожидающие одобрения полученными
    - Потому что взаимодействие с человеком хранится в оперативной памяти процесса и переживает перезапуск
  correct: 1
  id: 003-restart-vs-replay-2
  fingerprint: 16afd2ee
- concept: надёжность агента падает примерно квадратично с ростом горизонта, поэтому удлинение прогона само по себе не бесплатно
  question: Наблюдения METR показывают, что доля успеха агента падает примерно квадратично с ростом горизонта задачи. Durable execution позволило растянуть прогон в 5 раз по времени. Во сколько раз примерно снизится доля успеха, если других изменений нет?
  explanation: 'Квадратичная зависимость: рост горизонта в k раз означает падение доли успеха примерно в k² раз, здесь 5² = 25. Отсюда предупреждение: durable execution снимает ограничение по длительности, но кривая деградации остаётся прежней, и очень длинный прогон — это много плохих шагов, аккуратно сохранённых в журнал.'
  kind: numeric
  answer: 25
  tolerance: 1
  id: 003-restart-vs-replay-3
