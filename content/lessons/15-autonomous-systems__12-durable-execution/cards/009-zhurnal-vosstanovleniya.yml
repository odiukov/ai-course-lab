- concept: решения оркестрации тоже попадают в журнал, поэтому восстановленный прогон идёт по подтверждённому пути
  question: Workflow выбрал одну из двух веток обработки, и это решение записано в event log. Что даёт такая запись при восстановлении?
  explanation: Журнал фиксирует не только activity, но и решения workflow. Поэтому путь прогона подтверждён историей, а если перечитанный код вдруг уходит в другую ветку — это сигнал сломанного детерминизма в оркестрации, а не нормальная адаптация.
  kind: choice
  options:
    - 'Ничего: после сбоя ветка выбирается заново, наугад из доступных'
    - Позволяет уйти в другую ветку, если условия за время простоя изменились
    - Восстановленный прогон идёт по той же ветке, что и до сбоя, и расхождение с записью сразу видно
  correct: 2
