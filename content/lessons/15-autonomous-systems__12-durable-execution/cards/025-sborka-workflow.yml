- concept: политики повтора и таймаута навешиваются на activity, потому что только у неё есть записанные границы старта и завершения
  question: Разработчик хочет повторять неудачное обращение к платёжному шлюзу до пяти раз с растущей паузой. К чему движок может применить такую политику?
  explanation: 'Движок видит не строки, а события журнала: старт activity и её завершение или отказ. Повтор, таймаут и предел попыток он умеет применять к тому, что имеет такие границы. Обращение, спрятанное прямо в коде оркестрации, для движка не существует как отдельная единица — им нельзя управлять, его нельзя повторить контролируемо.'
  kind: choice
  options:
    - 'К activity, оформляющей обращение к шлюзу: у неё есть записанные в журнале старт и завершение'
    - К любой строке кода workflow — движок отслеживает исключения построчно
    - 'Только ко всему прогону целиком: политика повтора задаётся один раз на workflow'
    - К workflow, потому что именно он решает, обращаться ли к шлюзу
  correct: 0
  id: 025-sborka-workflow-2
