- concept: шаг восстановим, если по его ключу есть успешное завершение, независимо от предшествовавших отказов
  question: 'В журнале по ключу шага `charge_payment` подряд идут события: старт, отказ, старт, успешное завершение с результатом. Какой статус получит шаг в снимке восстановления?'
  explanation: 'Журнал только дописывается, поэтому история попыток остаётся в нём целиком. Для решения «подставлять или выполнять» важен один факт: есть ли по ключу запись о завершении с результатом. Прошлые отказы этот факт не отменяют — они лишь показывают, как шаг дошёл до успеха.'
  kind: choice
  options:
    - restored — успешное завершение по этому ключу есть, и его результат подставится
    - pending — наличие отказа означает, что шаг нужно выполнить заново
    - pending — журнал противоречив, потому что стартов больше одного
    - restored только после того, как функция удалит из журнала запись об отказе
  correct: 0
