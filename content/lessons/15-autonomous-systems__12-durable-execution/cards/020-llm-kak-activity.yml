- concept: 'нулевая температура не делает вызов модели воспроизводимым: выход меняется между версиями модели, а сам вызов остаётся удалённым'
  question: Инженер выставляет температуру модели в ноль и заявляет, что теперь вызов детерминирован и его можно делать прямо в коде оркестрации. В чём ошибка рассуждения?
  explanation: Температура убирает только один источник разброса. Провайдер меняет версии моделей, и тот же промпт со временем даёт другой текст. Плюс остаются таймауты, лимиты частоты и оплата за каждый вызов — свойства удалённого сервиса, а не параметра сэмплирования.
  kind: choice
  options:
    - При нулевой температуре модель перестаёт отвечать на открытые вопросы
    - Выход всё равно может измениться после обновления версии модели, и вызов остаётся сетевым — платным, медленным и способным упасть
    - Нулевая температура повышает стоимость вызова, поэтому его выгоднее вынести наружу
  correct: 1
  id: 020-llm-kak-activity-1
  fingerprint: 93ea19ff
- concept: модель, вызывающая инструменты, производит внешние изменения, поэтому её вызов нельзя считать чистым чтением
  question: Модель внутри агента может вызывать инструменты — например, создавать запись в CRM или отправлять письмо. Как это меняет отношение к её вызову?
  explanation: 'Одна строка кода с вызовом модели может обернуться реальным письмом клиенту. Значит, к ней применимы те же требования, что к любой внешней записи: фиксировать факт вызова и результат, а повтор делать безопасным.'
  kind: choice
  options:
    - 'Никак: инструменты выполняются отдельно от вызова модели и учитываются сами по себе'
    - 'Вызов перестаёт быть чистым получением текста: за ним стоят изменения во внешних системах, и повторное выполнение может продублировать их'
    - Вызов становится детерминированным, потому что результат определяется ответом инструмента
  correct: 1
  id: 020-llm-kak-activity-2
