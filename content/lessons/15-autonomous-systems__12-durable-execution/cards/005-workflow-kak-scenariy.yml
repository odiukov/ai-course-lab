- concept: чтение часов и случайных чисел внутри workflow ломает детерминизм и, значит, воспроизводимость replay
  question: Какая конструкция внутри кода workflow нарушает требование детерминизма?
  explanation: 'Часы (как и `random`) при повторном проходе дают другое значение: первый прогон мог попасть в одну ветку, replay — в другую. Данные из журнала при replay воспроизводятся байт в байт, поэтому решения по ним детерминированы.'
  kind: choice
  options:
    - Ветвление по результату activity, который уже записан в журнал событий
    - Сравнение полученной оценки с порогом 40
    - Выбор ветки по текущему показанию системных часов
  correct: 2
  id: 005-workflow-kak-scenariy-1
  fingerprint: cfe585a4
- concept: детерминизм ограничивает источник данных для решений, а не наличие ветвлений и ожиданий
  question: Запрещает ли требование детерминизма использовать в workflow ветвления и ожидания?
  explanation: 'Workflow как раз и есть код оркестрации: последовательность activity, ветвления, ожидания. Ограничение касается источника данных для решения — он обязан воспроизводиться из журнала.'
  kind: choice
  options:
    - Да, код workflow должен быть строго линейным
    - 'Нет: ветвиться можно по данным, воспроизводимым при replay, а ожидания задаются через API движка'
    - Ветвления разрешены, но любые ожидания запрещены
  correct: 1
  id: 005-workflow-kak-scenariy-2
  fingerprint: 1737f4be
- concept: детерминизм workflow означает воспроизводимость последовательности решений при повторном чтении журнала
  question: Все результаты завершённых activity сохранены в журнале. Почему этого недостаточно и код workflow обязан ещё и принимать те же решения в том же порядке?
  explanation: 'Determinизм сохраняет не всю память агента, а порядок уже принятых решений — именно это делает продолжение тем же прогоном, а надёжность дешёвой: хранить надо события, а не снимки памяти.'
  kind: open
  reference: 'Журнал восстанавливает состояние только в паре с кодом: replay заново проходит логику оркестрации и сопоставляет свои решения с записанными событиями. Если при повторном проходе workflow выбирает другую ветку (одобрить вместо ручной проверки), то дальше он запрашивает не те activity, которые записаны: движок либо диагностирует расхождение с журналом, либо продолжит уже другой прогон, в котором часть побочных эффектов первого остаётся неучтённой. Поэтому недетерминированные источники (время, случайность, прямые вызовы наружу) выносятся из workflow, а решения принимаются по данным из журнала.'
  id: 005-workflow-kak-scenariy-3
  fingerprint: c4341595
