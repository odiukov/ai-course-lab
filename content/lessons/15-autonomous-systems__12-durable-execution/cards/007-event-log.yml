- concept: 'журнал только дописывается: неудача и повтор дают новые события, а прежние записи не правятся'
  question: Activity «отправить счёт» упала, система запустила её ещё раз, и вторая попытка удалась. Как это отражается в event log durable-системы?
  explanation: 'Журнал append-only: события добавляются в хвост, прошлое не переписывается. Правка «на месте» стёрла бы факт неудачи и число попыток, а именно по ним потом видно, что внешнее действие могло уйти наружу дважды.'
  kind: choice
  options:
    - Запись об отказе заменяется записью об успехе, чтобы журнал показывал итог
    - К журналу дописываются события повторного запуска и завершения, а запись об отказе остаётся на месте
    - Журнал сессии очищается и пишется заново, начиная с удачной попытки
  correct: 1
  id: 007-event-log-1
  fingerprint: 956e5686
- concept: по одному итоговому статусу нельзя понять, на каком переходе остановилась работа, а по последовательности событий — можно
  question: Прогон завершился с единственной пометкой «ошибка». Объясни своими словами, какой информации в таком статусе нет и что вместо него даёт последовательность событий.
  explanation: Текущий статус — это свёртка, которая теряет путь. Durable-система хранит переходы, потому что решение «выполнять или брать записанный результат» принимается по конкретным фактам, а не по слову «ошибка».
  kind: open
  reference: 'Статус не показывает, докуда дошла работа: ушёл ли внешний запрос, вернулся ли ответ, потерялся ли он после получения. Последовательность событий различает эти случаи: событие старта со входами говорит, что попытка началась; отсутствие события завершения — что подтверждённого результата нет; событие отказа — причину. По ленте событий видно, какие шаги подтверждены и с какого места безопасно продолжать; по одной итоговой метке — нет.'
  id: 007-event-log-2
  fingerprint: 7932a4ab
