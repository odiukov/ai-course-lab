- concept: реальное выполнение завершается записью результата, что переводит тот же вызов на ветку replay при следующем восстановлении
  question: Обёртка не нашла результат в журнале и выполнила activity по-настоящему. Объясни, что она обязана сделать после получения ответа и как это влияет на следующее восстановление.
  explanation: Запись результата — это то, что превращает выполненный вызов в чекпоинт. Ветка «выполнить» всегда заканчивается пополнением журнала, иначе следующий прогон снова пойдёт по ней же.
  kind: open
  reference: После успешного выполнения обёртка записывает событие завершения с ключом вызова и полученным результатом. Благодаря этому при следующем восстановлении тот же вызов найдёт результат по своему ключу и уйдёт в ветку replay, а не выполнится второй раз. Без записи результат остаётся только в памяти процесса и пропадёт при падении, и внешнее действие повторится.
