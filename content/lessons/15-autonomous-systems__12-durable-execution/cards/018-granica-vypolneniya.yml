- concept: код workflow не различает replay и реальное выполнение — различие инкапсулировано в обёртке activity
  question: 'В движке durable execution код workflow одинаков при первом прогоне и при восстановлении: те же вызовы activity, те же присваивания результатов. Где находится решение «вернуть сохранённое значение или выполнить действие»?'
  explanation: 'Обёртка перехватывает вызов, строит ключ и обращается к журналу. Настоящая функция не знает о журнале, а workflow не знает, откуда пришёл ответ. Именно эта граница делает replay прозрачным: код workflow пишется как обычная линейная программа.'
  kind: choice
  options:
    - В теле самой activity, которая проверяет, не выполнялась ли она раньше
    - В обёртке вокруг activity, между вызовом из workflow и настоящей функцией
    - В коде workflow, который перед каждым шагом сверяется с журналом
    - В планировщике, который заранее вырезает завершённые вызовы из кода workflow
  correct: 1
