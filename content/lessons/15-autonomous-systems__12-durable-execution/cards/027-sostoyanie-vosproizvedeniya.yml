- concept: статус pending означает отсутствие завершённого результата в журнале, а не сбой или ошибку самого шага
  question: 'Workflow из 9 activity восстановлен после аварийного перезапуска. Снимок состояния replay показывает: 5 шагов помечены `restored`, остальные `pending`. Что достоверно следует про шаги со статусом `pending`?'
  explanation: '`pending` — утверждение о журнале, а не диагноз шага: подходящего завершённого результата нет. Причина может быть любой — шаг упал, шаг прервали на середине, либо сбой случился раньше, чем управление до него дошло. Смешивать `pending` с «ошибкой» опасно: тогда нормальная недостигнутая работа выглядит как инцидент.'
  kind: choice
  options:
    - Все они завершились с ошибкой и требуют ручного разбора
    - Для них в журнале нет записи об успешном завершении, поэтому они ещё должны реально выполниться — включая те, до которых прогон не успел дойти
    - Они выполнены, но их результаты не сериализовались
    - Они были пропущены веткой условия и больше не выполнятся
  correct: 1
  id: 027-sostoyanie-vosproizvedeniya-1
  fingerprint: 2503e51d
- concept: статус restored описывает происхождение значения в текущем прогоне — оно взято из журнала, а не получено новым запуском тела activity
  question: 'Оператор видит у шага статус `restored` и делает вывод: «значит, действие только что отработало заново, данные свежие». Объясни своими словами, почему этот вывод неверен и что на самом деле утверждает `restored`.'
  explanation: Снимок replay отвечает на вопрос «откуда взялось значение в этом прогоне», а не «когда его получили из внешнего мира». `restored` = чтение записи; реальный запуск возможен только для шагов без завершения в журнале.
  kind: open
  reference: '`restored` означает, что при восстановлении движок нашёл в журнале запись о завершении этой activity и подставил сохранённый выход, не вызывая тело функции. Значение получено не сейчас, а в момент первого прохода: время его получения — прошлое, внешний вызов повторно не делался, лимиты и деньги повторно не тратились. Поэтому по `restored` нельзя судить об актуальности данных (курс, остаток, статус заказа могли измениться) и нельзя считать, что побочный эффект произошёл повторно. Свежесть значения — отдельное свойство, и если она нужна, шаг нельзя восстанавливать из журнала.'
  id: 027-sostoyanie-vosproizvedeniya-2
  fingerprint: e52d1316
