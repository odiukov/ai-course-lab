- concept: 'проверка журнала предшествует запуску activity: сначала ключ и поиск результата, и лишь затем возможное выполнение'
  question: Расставь шаги, которые движок durable execution выполняет при каждом обращении workflow к activity.
  explanation: 'Порядок здесь и есть суть механизма: сначала доказательство завершения, потом действие. Обратный порядок — выполнить и потом сверить — уже оплатил бы внешний эффект, ради избавления от которого журнал и ведётся.'
  kind: order
  items:
    - Вычислить стабильный ключ вызова из имени activity и её аргументов
    - Найти в журнале завершённое событие с точно таким ключом
    - Если результат найден — вернуть сохранённое значение, не запуская activity
    - Если результата нет — выполнить activity и записать её результат в журнал
  id: 016-poisk-zavershennogo-1
  fingerprint: e5d374be
- concept: переиспользование результата требует точного совпадения ключа, включая аргументы вызова
  question: В журнале есть завершённая activity `resize(photo-99, width=320)`. Workflow вызывает `resize(photo-99, width=1600)`. Что сделает движок?
  explanation: 'Ключ включает аргументы, поэтому 320 и 1600 — разные логические действия. Частичное сходство ничего не даёт: право пропустить выполнение появляется только при точном совпадении ключа.'
  kind: choice
  options:
    - 'Вернёт сохранённый результат: файл и activity те же'
    - 'Выполнит activity по-настоящему: ключ не совпадает, готового результата для этой работы нет'
    - Вернёт сохранённый результат и допишет новый ключ к прежней записи
  correct: 1
  id: 016-poisk-zavershennogo-2
  fingerprint: 2079ed7e
- concept: запись об отказе не содержит выхода, поэтому не может служить основанием для замены выполнения
  question: Для ключа activity в журнале нашлась запись об отказе с текстом ошибки. Почему её нельзя использовать вместо выполнения?
  explanation: Подставить вместо вызова можно только сохранённое возвращаемое значение. Отказ фиксирует, что попытка была и результата не дала, — работа по этому ключу всё ещё не выполнена.
  kind: choice
  options:
    - Потому что записи об отказе устаревают быстрее остальных
    - Потому что в ней нет выхода activity — вернуть workflow нечего, кроме факта неудачи
    - Потому что отказ обязан очищать журнал по этому ключу
  correct: 1
  id: 016-poisk-zavershennogo-3
  fingerprint: be17343e
