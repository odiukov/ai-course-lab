- concept: durable execution не повышает надёжность отдельных шагов и не улучшает решения агента, а снижает цену факта падения
  question: 'Коллега предлагает: «Подключим durable execution — агент станет реже ошибаться и падать». Что в этом утверждении неверно и что durable execution действительно даёт?'
  explanation: 'Ключевое разделение: вероятность сбоя прежняя, цена сбоя другая. Иначе легко ждать от durable execution качества, которого оно не даёт.'
  kind: open
  reference: 'Durable execution не предотвращает сбои и не влияет на качество решений модели: шаги падают с той же частотой, а плохие шаги остаются плохими (и аккуратно попадают в журнал). Оно меняет стоимость падения — прогон перестаёт быть одной хрупкой попыткой, живущей только пока жив конкретный процесс: после сбоя новый процесс восстанавливает историю из durable-журнала и продолжает с последней подтверждённой точки. Побочный эффект такой надёжности — снятие ограничения по длительности прогона, а надёжность на длинном горизонте деградирует (METR: деградация после ~35 минут), поэтому длинные прогоны надо проектировать отдельно.'
  id: 001-sboy-dlinnogo-progona-3
