- concept: объём потерянной работы при сбое ограничен интервалом после последнего чекпоинта
  question: Прогон рассчитан на 9 часов. Сбой произошёл на отметке 6:30, последний чекпоинт записан на 6:00. На сколько часов работы больше придётся выполнить заново при наивном перезапуске с нуля, чем при продолжении из чекпоинта?
  explanation: 'С чекпоинта теряются 0.5 часа (интервал 6:00–6:30). Наивный перезапуск теряет все 6.5 часов. Разница 6.5 − 0.5 = 6 часов: цена сбоя определяется не длиной прогона, а расстоянием до последнего чекпоинта.'
  kind: numeric
  answer: 6
  tolerance: 0.1
