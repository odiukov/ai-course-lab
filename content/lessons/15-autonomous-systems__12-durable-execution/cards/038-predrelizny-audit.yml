- concept: 'гарантия восстановления конъюнктивна: нарушение любого одного из проверяемых свойств обнуляет обещание продолжить прогон'
  question: Развёртывание долгоживущего агента проверяют перед выпуском. Какие свойства должны выполняться одновременно и почему нельзя считать «четыре из пяти» приемлемым результатом?
  explanation: Каждый пункт закрывает свой способ сломать восстановление, и они не компенсируют друг друга — поэтому аудит проходится целиком, а не по большинству.
  kind: open
  reference: 'Проверяют: (1) каждая операция с внешним миром вынесена в отдельную activity со стабильным ключом; (2) workflow детерминирован — внутри нет прямых сетевых вызовов, чтения часов, случайности; (3) чекпоинты лежат в durable-бэкенде, доступном всем воркерам, а не в памяти или локальном файле одного процесса; (4) состояние ожидания человека записано в журнал, а не держится живым процессом; (5) описана политика участия человека при продолжении — что принимается как есть, а что требует свежего одобрения. Свойства конъюнктивны: обещание «продолжим после сбоя» держится на самом слабом. Детерминированный workflow с чекпоинтами в памяти воркера не переживёт гибель хоста; идеальный бэкенд не спасёт, если недетерминизм в workflow уведёт replay по другой ветке; всё вместе бесполезно, если пауза на согласование живёт только в оперативной памяти.'
  id: 038-predrelizny-audit-2
  fingerprint: 039d1c4f
