- concept: опасность повтора растёт от чистого вычисления к чтению изменяемых данных и далее к внешней записи
  question: Расставь операции по возрастанию опасности их повторного выполнения после сбоя.
  explanation: 'Градация по тому, насколько операция выходит за пределы процесса: вычисление — только цена, чтение — риск рассогласования, внешняя запись — новый факт в мире, который нельзя отменить перезапуском.'
  kind: order
  items:
    - Пересчёт суммы по данным в памяти — повтор лишь снова расходует ресурсы
    - Чтение изменяемого файла или таблицы — повтор может вернуть уже другие данные
    - Запись в базу или отправка письма — повтор создаёт второе необратимое внешнее событие
  id: 004-proverka-pobochnyh-effektov-1
  fingerprint: 04bc892b
- concept: при replay чтение подменяется записанным результатом, чтобы дальнейшие решения остались согласованы с уже пройденным путём
  question: Агент прочитал файл до сбоя, а к моменту восстановления файл изменили. Почему durable replay возвращает записанный результат первого чтения, а не читает файл заново?
  explanation: 'Чтение само по себе безвредно, но недетерминированно: у него могут быть разные результаты при одинаковых входах. Поэтому оно попадает в журнал наравне с записями.'
  kind: open
  reference: 'Решения, принятые до сбоя, уже опираются на старое содержимое и записаны в журнал. Если replay подставит новые данные, workflow может свернуть в другую ветку — и продолжение перестанет соответствовать журналу: это будет уже другой прогон, а часть побочных эффектов от прежней ветки останется в мире. Записанный результат делает replay воспроизводимым. Если по задаче нужны свежие данные, это оформляется как новая activity чтения после точки восстановления, а не как подмена старого результата.'
  id: 004-proverka-pobochnyh-effektov-2
  fingerprint: 45e95dd8
- concept: безопасность повтора определяется идемпотентностью операции, а не тем, читает она или пишет
  question: Какую из операций безопаснее всего выполнить повторно после сбоя?
  explanation: 'PUT с фиксированным идентификатором идемпотентен: второй вызов приводит систему в то же состояние. POST создаёт вторую сущность, письмо — второе событие у человека. Идемпотентность — способ сделать повтор безвредным там, где он всё же случится.'
  kind: choice
  options:
    - PUT, устанавливающий статус заказа в «shipped» по его идентификатору
    - POST, создающий новый платёж
    - Отправку письма клиенту с уведомлением об оплате
  correct: 0
