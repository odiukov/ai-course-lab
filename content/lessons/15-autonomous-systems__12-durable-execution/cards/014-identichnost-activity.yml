- concept: ключ, выведенный только из входных данных, склеивает намеренно разные вызовы с совпадающими аргументами
  question: 'Workflow намеренно делает 6 одинаковых платежей одному получателю: сумма, счёт и назначение совпадают у всех шести. Ключ activity строится исключительно из входных аргументов. Сколько из этих платежей не будет выполнено, потому что движок примет их за повтор уже завершённого вызова?'
  explanation: Все 6 вызовов дадут один и тот же ключ. Первый выполнится и запишет результат, остальные 5 попадут в ветку replay и вернут сохранённое значение. Ключ обязан отражать личность действия — позицию в выполнении workflow, а не только содержимое аргументов.
  kind: numeric
  answer: 5
  tolerance: 0.5
  id: 014-identichnost-activity-2
  fingerprint: 19f5170a
- concept: стабильный ключ различает повтор одной логической операции и новую операцию с теми же данными
  question: Объясни своими словами, почему совпадения входных аргументов недостаточно, чтобы считать два вызова activity одним и тем же действием.
  explanation: Идентичность и содержимое — разные вещи. Ключ фиксирует «какое это по счёту логическое действие», а аргументы — «что именно оно делает». Без этого разделения либо дублируются внешние эффекты, либо теряются намеренно повторяющиеся операции.
  kind: open
  reference: 'Аргументы описывают содержимое операции, а не её идентичность. Приложение может законно выполнить две одинаковые операции подряд: два одинаковых платежа, две отправки одного письма, два заказа одинаковой доставки. Поэтому идентичность задаётся отдельным стабильным ключом, привязанным к конкретному месту в выполнении workflow: все попытки одного вызова получают этот ключ неизменным, а следующий намеренный вызов — новый ключ. Так движок отличает retry (результат брать из журнала) от нового действия (выполнять по-настоящему).'
  id: 014-identichnost-activity-3
  fingerprint: 45e1c7ef
