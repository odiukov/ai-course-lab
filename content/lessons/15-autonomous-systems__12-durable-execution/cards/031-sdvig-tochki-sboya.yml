- concept: экономия replay пропорциональна числу завершённых до сбоя activity, поэтому при пустом журнале оба подхода стоят одинаково
  question: Прогон из 8 activity падает ещё до того, как первая activity успела записать завершение. Объясни, почему в этом сценарии durable replay не даёт экономии по сравнению с наивным перезапуском.
  explanation: Journal-based replay заменяет выполнение только там, где есть записанный результат. Пустой журнал = нулевая экономия; это верхняя граница вреда сбоя, а не аргумент против механизма.
  kind: open
  reference: 'Экономия replay возникает только за счёт событий завершения, лежащих в журнале: их результаты подставляются вместо вызова тела. Если ни одна activity не завершилась, журнал не содержит выходов, подставлять нечего, и после восстановления реально исполняются все 8 шагов — столько же, сколько при наивном перезапуске (8 попыток первого прогона фактически равны нулю завершённых). Выгода растёт ровно с числом подтверждённых завершений к моменту сбоя.'
