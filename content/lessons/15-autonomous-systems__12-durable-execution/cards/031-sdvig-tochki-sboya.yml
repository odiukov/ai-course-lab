- concept: разрыв в стоимости между наивным перезапуском и durable replay растёт по мере сдвига точки сбоя к концу прогона
  question: 'Прогон из 10 activity. Сравнивают два сценария: сбой после первой activity и сбой после девятой. Как ведёт себя разница в суммарном числе реальных выполнений между наивным перезапуском и durable replay?'
  explanation: 'Наивно: 1 + 10 = 11 против 9 + 10 = 19. Durable: 10 в обоих случаях. Выигрыш пропорционален объёму работы, уже подтверждённой журналом к моменту сбоя.'
  kind: choice
  options:
