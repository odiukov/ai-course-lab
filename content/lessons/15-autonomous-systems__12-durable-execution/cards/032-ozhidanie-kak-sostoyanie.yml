- concept: 'порядок возобновления прогона после получения ответа человека: событие ответа дописывается, прогон поднимается, доходит до точки приостановки и идёт дальше'
  question: Расставь по порядку, что происходит, когда человек одобряет предложенное действие через несколько часов после запроса.
  explanation: 'Ответ сначала становится фактом в журнале, и только затем прогон возобновляется: восстановление ведёт его по подтверждённой истории до точки приостановки, где ожидание уже закрыто ответом, и работа идёт дальше.'
  kind: order
  items:
    - Ответ человека дописывается в журнал прогона как новое событие
    - Движок поднимает прогон и восстанавливает его по истории событий
    - Восстановленный прогон доходит до места, где было зафиксировано ожидание, и находит там ответ
    - Workflow продолжается со следующего после паузы решения
