- concept: ожидание ответа человека реализуется как записанное состояние прогона, поэтому пауза не требует живого процесса и переживает перезапуск
  question: Агент подготовил опасное действие и ждёт одобрения человека, которое придёт через много часов. Какая реализация паузы переживёт перезапуск воркеров и деплой?
  explanation: 'Первые два варианта держат паузу в оперативной памяти конкретного процесса: он исчезает — исчезает и ожидание. Durable-состояние «ждём человека» лежит в журнале, а сам ожидающий запрос — во внешней очереди или интерфейсе, поэтому во время паузы никакой процесс держать не нужно.'
  kind: choice
  options:
    - Блокирующий вызов ввода в работающем процессе агента
    - Ожидание объекта-future в памяти процесса с большим таймаутом
    - Запись состояния «запрошено одобрение, продолжение приостановлено» в durable-журнал прогона
  correct: 2
  id: 032-ozhidanie-kak-sostoyanie-1
  fingerprint: 15cdd02c
- concept: чтобы поздний ответ человека можно было применить, в durable-состоянии должны быть зафиксированы точка приостановки и идентификация ожидаемого запроса
  question: Что именно должно быть записано в durable-состоянии прогона, чтобы одобрение, пришедшее через сутки после запроса, можно было принять и применить? Объясни своими словами.
  explanation: 'Ожидание как «состояние» — это не только флаг «ждём», но и адрес: чей ответ, на какое предложение, где остановились. Без этой записи одобрение утром бессмысленно, а перезапуск сценария с нуля рискует повторить уже совершённые внешние действия.'
  kind: open
  reference: 'Нужно записать: идентификатор прогона (сессии), факт того, что прогон приостановлен в ожидании человека, идентификатор самого запроса — какое действие предложено, с какими параметрами и чьё решение требуется, а также место приостановки в логике workflow. Тогда пришедший ответ можно однозначно сопоставить с этим прогоном и этим запросом, дописать как событие журнала и продолжить с нужной точки. Если всё это существовало только в памяти процесса, поздний ответ некуда прикладывать: либо его не принимает никто, либо система стартует сценарий заново.'
  id: 032-ozhidanie-kak-sostoyanie-2
