- concept: реляционный бэкенд даёт не только сохранность, но и возможность запрашивать состояние прогонов
  question: Команде нужно не только восстанавливать прогоны после сбоя, но и отвечать на вопрос «сколько прогонов зависло на шаге подтверждения человеком за последние сутки». Что это добавляет к выбору бэкенда чекпоинтов?
  explanation: Восстановлению достаточно операции «дай последний чекпоинт по ключу». Аналитика по прогонам требует запросов по содержимому — поэтому реляционная СУБД идёт по умолчанию, а быстрый кеш такой возможности сам по себе не даёт.
  kind: choice
  options:
    - 'Ничего: любой бэкенд чекпоинтов одинаково отвечает на такие вопросы'
    - Нужен бэкенд, к состоянию которого можно делать запросы, а не только читать последний чекпоинт по ключу
    - Нужен бэкенд с наименьшей задержкой чтения
