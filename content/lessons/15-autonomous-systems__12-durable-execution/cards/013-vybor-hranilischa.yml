- concept: 'ключ сессии задаёт область состояния: он изолирует чекпоинты одного прогона от чужих в общем бэкенде'
  question: В одном общем бэкенде чекпоинтов одновременно живут сотни параллельных прогонов разных пользователей. Какую задачу решает ключ сессии (thread_id)?
  explanation: Ключ сессии — это адрес области состояния. Общее хранилище хранит все прогоны вместе, и именно ключ отделяет чекпоинты одного прогона от остальных; ни к периодичности сохранения, ни к шифрованию он отношения не имеет.
  kind: choice
  options:
    - 'Он ограничивает область: по нему из общего хранилища достаётся состояние именно этого прогона'
    - Он задаёт частоту сохранения чекпоинтов
    - Он шифрует состояние прогона от других пользователей
