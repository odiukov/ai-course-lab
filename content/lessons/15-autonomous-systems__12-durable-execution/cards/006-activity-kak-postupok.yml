- concept: 'вызов модели — обычная activity: недетерминированный, дорогой, с побочными эффектами'
  question: Почему вызов LLM оформляют как activity, а не как обычный вызов функции внутри кода workflow?
  explanation: 'Критерий тот же, что для HTTP и записи файла: другой результат при тех же входах или воздействие вне процесса. Вызов модели проходит по обоим пунктам.'
  kind: open
  reference: 'Вызов модели недетерминирован (на тех же входах даёт другой текст), может упасть или отвалиться по таймауту и стоит денег — то есть обладает всеми признаками activity. Внутри workflow он ломал бы детерминизм: при replay модель вернула бы другой ответ и оркестрация свернула бы в другую ветку. Как activity вызов пишется в журнал со входами и результатом, при восстановлении подставляется из журнала и не оплачивается второй раз; повторы и таймауты им управляет движок. Новизна durable execution для агентов ровно в этом: вызовы модели чисто ложатся в паттерн activity, известный движкам workflow (Temporal, Cadence) десять лет.'
  id: 006-activity-kak-postupok-3
  fingerprint: b6e16e91
