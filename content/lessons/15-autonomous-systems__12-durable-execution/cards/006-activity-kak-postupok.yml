- concept: журнал событий фиксирует старт activity со входами и завершение с выходами, а также отказы и повторы
  question: Что попадает в журнал событий по каждой activity?
  explanation: 'Полнота журнала — условие replay: по входам видно, что было запрошено, по выходам — что подставить вместо повторного выполнения, по отказам и повторам — что делать с незавершённым. Снимки памяти не нужны, поэтому надёжность и получается дешёвой.'
  kind: choice
  options:
    - Только итоговый результат успешно завершённых activity
    - Старт со входными аргументами, завершение с результатом, а также отказы и попытки повтора
    - Полный снимок оперативной памяти воркера на момент вызова
  correct: 1
