- concept: retry — новое реальное обращение с возможным другим результатом, replay — чтение записи без обращения к сервису
  question: Одна и та же activity — обращение к модели. В одном случае движок делает retry, в другом replay. Чем эти два действия отличаются по стоимости и результату?
  explanation: 'Retry — это попытка получить результат, которого ещё нет; ответ может отличаться от предыдущей неудачной попытки. Replay — доставка уже полученного результата: внешний сервис не трогают вообще, поэтому воспроизведение бесплатно и всегда даёт то же значение.'
  kind: choice
  options:
    - 'Retry заново обращается к модели: тратит деньги и время и может дать другой ответ; replay читает запись и возвращает прежний результат без обращения'
    - Оба обращаются к модели, но replay делает это с меньшей задержкой
    - Retry возвращает записанный ответ, а replay проверяет его новым запросом
  correct: 0
  id: 021-retry-i-replay-1
  fingerprint: 74d90228
- concept: растущая пауза и предел попыток защищают перегруженный сервис и не дают прогону висеть бесконечно
  question: Почему пауза между повторными попытками увеличивается, а само число попыток ограничивают?
  explanation: Плотный поток повторов в момент перегрузки только усугубляет её, а лимиты частоты отвечают отказом на весь этот поток. Растущая выдержка даёт сервису восстановиться, а конечный лимит попыток превращает неустранимую ошибку в явный отказ, который можно обработать.
  kind: choice
  options:
    - Чтобы каждая следующая попытка использовала более свежую версию модели
    - Чтобы частые повторы не добивали уже перегруженный сервис и не упирались в лимиты частоты, а прогон в безнадёжном случае завершался отказом, а не висел вечно
    - Чтобы результат успел записаться в журнал до следующей попытки
  correct: 1
