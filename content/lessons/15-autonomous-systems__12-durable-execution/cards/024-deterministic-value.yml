- concept: 'ключ задаёт логическое чтение: два разных обращения к источнику под одним ключом сольются в одно зафиксированное значение'
  question: 'Код оркестрации дважды обращается к часам: перед отправкой письма и после ответа клиента. Обе точки используют функцию фиксации с одним и тем же ключом. Что получит второе обращение?'
  explanation: Функция ищет запись по ключу и, найдя её, к источнику не обращается. Значит, ключ обозначает конкретное логическое чтение, а не «время вообще». Двум разным моментам нужны два разных ключа, иначе интервал между ними схлопнется в ноль.
  kind: choice
  options:
    - 'Свежее показание часов: фиксация действует только внутри одного прохода'
    - То же самое значение, что и первое — движок найдёт запись по этому ключу и вернёт её
    - 'Ошибку: повторное использование ключа запрещено'
  correct: 1
  id: 024-deterministic-value-1
  fingerprint: 762c15a0
- concept: зафиксированное значение отражает момент первого прохода, поэтому не годится для получения актуальных данных при возобновлении
  question: Прогон возобновляют через сутки после сбоя. Инженер решает получать через функцию фиксации текущий курс валюты — тем же способом, каким фиксирует время решения. Что не так?
  explanation: Фиксация существует ровно для того, чтобы значение не менялось между проходами. Если решению нужны актуальные данные после возобновления, это новая работа с новым ключом, а не воспроизведение старой записи. Смешивать эти два намерения — источник тихих ошибок.
  kind: choice
  options:
    - Курс — число с плавающей точкой, его нельзя хранить в журнале
    - 'Фиксация вернёт значение суточной давности: она сохраняет момент первого прохода, а не текущее состояние мира; за свежими данными нужно отдельное реальное обращение'
    - 'Ничего: фиксация обновляет значение при каждом возобновлении'
  correct: 1
  id: 024-deterministic-value-2
  fingerprint: 5cb646ce
- concept: ключ, вычисленный из недетерминированного источника, не совпадёт при повторном проходе и обнулит смысл фиксации
  question: Ключ для фиксации значения собирают из текущей метки времени. Что произойдёт при повторном проходе после сбоя?
  explanation: Ключ обязан быть воспроизводимым между прогонами — иначе поиск в журнале никогда не попадает в прежнюю запись. Собирать ключ из часов, случайных чисел или адреса объекта в памяти нельзя по той же причине, по которой из них нельзя принимать решения.
  kind: choice
  options:
    - Ключ окажется другим, запись не найдётся, значение вычислится заново — фиксация не работает, а журнал распухает новыми записями
    - Движок распознает метку времени в ключе и нормализует её
    - Запись найдётся, потому что поиск идёт по значению, а не по ключу
  correct: 0
