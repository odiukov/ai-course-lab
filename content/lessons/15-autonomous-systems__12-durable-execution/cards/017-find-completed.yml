- concept: «результата нет» и «результат ложен по истинностности» — разные ответы; проверка на truthiness ломает поиск завершённых activity
  question: 'Activity проверки заказа успешно завершилась и вернула пустой список найденных проблем. Функция поиска в журнале написана как `if result: return result`. Что произойдёт при восстановлении?'
  explanation: Пустой список, пустая строка, ноль и False — полноценные результаты завершённой работы. Отличать «не нашли запись» нужно отдельным признаком (сентинел, None-маркер или пара «найдено/значение»), а не истинностностью значения.
  kind: choice
  options:
    - 'Всё верно: пустой список означает, что activity ничего не сделала'
    - Функция сочтёт результат отсутствующим, и activity выполнится заново, хотя её результат уже есть в журнале
    - Функция вернёт пустой список — проверка на truthiness тут безопасна
  correct: 1
  id: 017-find-completed-1
  fingerprint: 3179c939
- concept: 'функция поиска в журнале только читает: она не выполняет activity и не дописывает событий'
  question: Почему функции, которая ищет в журнале завершённый результат по ключу, запрещено выполнять activity или добавлять события?
  explanation: Чистое чтение отвечает ровно на один вопрос — есть ли готовый результат для ключа. Если та же функция начнёт выполнять или дописывать события, повторный поиск будет видеть последствия предыдущего поиска, и журнал перестанет быть надёжным свидетельством.
  kind: choice
  options:
    - Потому что запись в журнал допустима только из workflow
    - Потому что её ответ — это доказательство о прошлом; смешение чтения с действием сделает результат поиска зависящим от самого поиска
    - Потому что дописанные события замедлят чтение журнала
  correct: 1
  id: 017-find-completed-2
  fingerprint: b118da08
