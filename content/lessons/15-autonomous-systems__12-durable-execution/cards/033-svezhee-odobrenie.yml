- concept: истёкшее одобрение возвращает прогон в состояние ожидания только для ещё не совершённого опасного действия
  question: Правило свежести говорит, что записанное одобрение просрочено. Что должен сделать workflow?
  explanation: Просрочка обесценивает только само разрешение, а не уже полученные результаты. Поэтому повторный запрос адресуется единственному ещё не совершённому опасному действию и предъявляет человеку текущие условия; завершённые activity остаются взятыми из журнала.
  kind: choice
  options:
    - Пройти весь сценарий заново с первой activity, чтобы получить согласованное состояние
    - Снова перейти в состояние «ждём человека» перед ещё не выполненным опасным действием, показав обновлённые условия
    - Продолжить выполнение, но записать в журнал предупреждение о просрочке
  correct: 1
