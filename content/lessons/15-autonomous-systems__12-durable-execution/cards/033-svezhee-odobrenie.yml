- concept: остановка ради технического восстановления и остановка из-за смыслового устаревания решения — разные причины с разными действиями
  question: 'Чем различаются две причины остановки прогона: «движок восстанавливает потерянный прогон» и «старое одобрение больше нельзя применять»? Объясни своими словами.'
  explanation: 'Смешивать их опасно в обе стороны: техническое восстановление, которое переспрашивает человека на каждом шаге, обесценивает журнал, а молчаливый перенос старого «да» через долгую паузу выполняет опасное действие в изменившихся условиях.'
  kind: open
  reference: 'Первая причина техническая: прогон упал, и движок восстанавливает его по журналу — здесь ничего не переспрашивают, завершённые шаги берутся из записей, работа продолжается. Вторая причина смысловая: одобрение сохранилось и не подделано, но условия, к которым оно относилось, изменились или прошло слишком много времени, поэтому применять его к необратимому действию небезопасно. Лечится она не восстановлением, а новым обращением к человеку с обновлёнными условиями. Журнал помогает помнить ответ; правило свежести решает, можно ли этому ответу ещё доверять.'
  id: 033-svezhee-odobrenie-3
