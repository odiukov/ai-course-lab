  question: Ключ строится только из аргументов вызова, без имени activity. В workflow есть `charge_card(order=91)` и `refund_card(order=91)`. Что произойдёт?
  explanation: Без имени в ключе два разных действия с одинаковыми аргументами становятся неотличимы. Списание и возврат схлопнутся в одно логическое действие, и второй вызов подставит сохранённый результат первого.
  kind: choice
