  question: Ключ activity вычисляется через встроенный `hash()` от строки с аргументами. Тесты в одном процессе проходят. Что сломается в проде?
  explanation: 'Хеширование строк в Python рандомизировано на старте процесса. Такой ключ стабилен внутри одного запуска — то есть ровно до момента, ради которого он и нужен: настоящего перезапуска после сбоя. Нужен детерминированный дайджест (например из hashlib).'
