- concept: при восстановлении код workflow исполняется с самого начала, а не с точки сбоя
  question: Процесс упал на девятом шаге длинного workflow. С какого места durable-система начинает исполнять код оркестрации после восстановления?
  explanation: 'Код workflow детерминирован, поэтому его дешевле прогнать заново целиком: проход по знакомому участку не стоит внешних вызовов, потому что их результаты берутся из журнала. Снимок стека хранить не нужно.'
  kind: choice
  options:
    - С первой строки workflow
    - 'С девятого шага: предыдущие строки кода не исполняются вовсе'
    - С места, куда указывает сохранённый снимок стека вызовов
  correct: 0
  id: 008-mehanika-replay-1
  fingerprint: 91dd6718
- concept: activity со стартом, но без записи завершения, при восстановлении исполняется по-настоящему
  question: В журнале у activity «списать оплату» есть событие старта, но события завершения нет. Что сделает durable-система, дойдя до этого места при восстановлении?
  explanation: 'Результат существует для системы только тогда, когда записано событие завершения с выходами. Старт без завершения — неизвестность: списание могло пройти, а могло и не дойти до банка. Поэтому такую activity исполняют заново, и именно здесь нужны идемпотентный ключ или дедупликация на стороне сервиса.'
  kind: choice
  options:
    - 'Пропустит её: раз старт записан, работа считается сделанной'
    - Остановит прогон и будет ждать ручного решения оператора
    - 'Выполнит её по-настоящему: подтверждённого результата в журнале нет'
  correct: 2
