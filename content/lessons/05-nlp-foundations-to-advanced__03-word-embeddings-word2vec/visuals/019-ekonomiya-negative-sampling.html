<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>100 000 сравнений против шести</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f8fb;
    --panel: #ffffff;
    --panel-soft: #eef2f8;
    --comparison: #e8efff;
    --text: #172033;
    --muted: #5d687b;
    --line: #8d99ad;
    --border: #cbd3df;
    --blue: #356fe5;
    --blue-soft: #e5edff;
    --green: #198754;
    --green-soft: #ddf5e8;
    --red: #c44949;
    --red-soft: #fbe5e5;
    --white: #ffffff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #10141c;
      --panel: #171d28;
      --panel-soft: #202838;
      --comparison: #182743;
      --text: #edf2fb;
      --muted: #aeb9ca;
      --line: #778399;
      --border: #354158;
      --blue: #79a2ff;
      --blue-soft: #23365d;
      --green: #63d69a;
      --green-soft: #183b2d;
      --red: #ff8d8d;
      --red-soft: #492525;
      --white: #ffffff;
    }
  }

  html,
  body {
    background: var(--page);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
      "Segoe UI", sans-serif;
  }

  figure {
    max-width: 1200px;
    margin: auto;
    background: var(--page);
  }

  h2 {
    margin: auto;
    padding: 12px 20px 8px;
    font-size: 24px;
    font-weight: bold;
    color: var(--text);
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 470px;
    background: var(--page);
  }

  .panel {
    fill: var(--panel);
    stroke: var(--border);
    stroke-width: 2;
  }

  .divider {
    stroke: var(--border);
    stroke-width: 2;
  }

  .heading {
    fill: var(--text);
    font-size: 22px;
    font-weight: bold;
  }

  .subheading {
    fill: var(--muted);
    font-size: 14px;
  }

  .node {
    fill: var(--blue-soft);
    stroke: var(--blue);
    stroke-width: 2;
  }

  .node-text {
    fill: var(--text);
    font-size: 15px;
    font-weight: bold;
    text-anchor: middle;
    dominant-baseline: middle;
  }

  .fan {
    fill: none;
    stroke: var(--line);
    stroke-width: 2;
    stroke-linecap: round;
  }

  .row {
    fill: var(--panel-soft);
    stroke: var(--border);
    stroke-width: 2;
  }

  .row-positive {
    fill: var(--green-soft);
    stroke: var(--green);
    stroke-width: 2;
  }

  .row-negative {
    fill: var(--red-soft);
    stroke: var(--red);
    stroke-width: 2;
  }

  .row-label {
    fill: var(--text);
    font-size: 14px;
    dominant-baseline: middle;
  }

  .ellipsis {
    fill: var(--muted);
    font-size: 22px;
    text-anchor: middle;
    dominant-baseline: middle;
  }

  .dot {
    fill: var(--blue);
  }

  .dot-positive {
    fill: var(--green);
  }

  .dot-negative {
    fill: var(--red);
  }

  .positive-line {
    stroke: var(--green);
    stroke-width: 2;
    stroke-linecap: round;
  }

  .negative-line {
    stroke: var(--red);
    stroke-width: 2;
    stroke-linecap: round;
  }

  .counter {
    fill: var(--panel-soft);
    stroke: var(--border);
    stroke-width: 2;
  }

  .counter-positive {
    fill: var(--green-soft);
    stroke: var(--green);
    stroke-width: 2;
  }

  .counter-main {
    fill: var(--text);
    font-size: 20px;
    font-weight: bold;
    text-anchor: middle;
  }

  .counter-note {
    fill: var(--muted);
    font-size: 13px;
    text-anchor: middle;
  }

  .comparison {
    fill: var(--comparison);
    stroke: var(--blue);
    stroke-width: 2;
  }

  .comparison-small {
    fill: var(--muted);
    font-size: 13px;
    text-anchor: middle;
  }

  .comparison-number {
    fill: var(--text);
    font-size: 28px;
    font-weight: bold;
    text-anchor: middle;
  }

  .comparison-arrow {
    fill: none;
    stroke: var(--blue);
    stroke-width: 4;
    stroke-linecap: round;
  }

  .arrow-head {
    fill: var(--blue);
  }

  .saving {
    fill: var(--blue);
    font-size: 18px;
    font-weight: bold;
    text-anchor: middle;
  }

  #fallback {
    margin: auto;
    padding: 20px;
    font-size: 16px;
    color: var(--text);
    background: var(--panel);
  }
</style>
</head>
<body>
<figure aria-labelledby="figure-heading">
  <h2 id="figure-heading">100 000 сравнений против шести</h2>

  <svg
    id="diagram"
    viewBox="0 0 1200 410"
    width="1200"
    height="410"
    preserveAspectRatio="xMidYMid meet"
    role="img"
    aria-labelledby="svg-title svg-description">
    <title id="svg-title">Полный softmax и negative sampling</title>
    <desc id="svg-description">
      Полный softmax выполняет 100 000 скалярных произведений,
      а negative sampling проверяет одну положительную и пять
      отрицательных пар — примерно в 16 000 раз меньше работы.
    </desc>
  </svg>

  <div id="fallback" hidden>
    Схема должна была показать: полный softmax выполняет 100 000
    скалярных произведений, а negative sampling использует одну
    положительную и пять отрицательных пар, всего шесть — примерно
    в 16 000 раз меньше работы.
  </div>

  <noscript>
    Полный softmax: 100 000 скалярных произведений. Negative sampling:
    одна положительная и пять отрицательных пар, всего шесть — примерно
    в 16 000 раз меньше работы.
  </noscript>
</figure>

<script>
const DATA = Object.freeze([
  ["settings", {
    origin: [0, 0],
    scale: [1, 1],
    zero: [0, 0],
    corner: 14,
    rowCorner: 10,
    dotRadius: 7,
    textInset: 18,
    rowHalfHeight: 13
  }],
  ["panels", [
    [30, 20, 535, 275],
    [635, 20, 535, 275],
    [170, 315, 860, 75]
  ]],
  ["headers", [
    [60, 56, "Полный softmax"],
    [60, 81, "весь словарь участвует в каждом обновлении"],
    [665, 56, "Negative sampling"],
    [665, 81, "те же embeddings, но только нужные пары"]
  ]],
  ["dividers", [
    [60, 94, 535, 94],
    [665, 94, 1140, 94]
  ]],
  ["centers", [
    [60, 119, 150, 52, 135, 145, "центральное слово"],
    [665, 119, 145, 52, 738, 145, "центральное слово"]
  ]],
  ["leftSource", [210, 145]],
  ["leftRows", [
    ["word", 105, "настоящий контекст", "row"],
    ["word", 135, "слово словаря", "row"],
    ["ellipsis", 165, "⋮", "ellipsis"],
    ["word", 195, "слово словаря", "row"],
    ["word", 225, "последнее слово", "row"]
  ]],
  ["leftGeometry", {
    lineEndX: 260,
    dotX: 270,
    rowX: 288,
    rowWidth: 235,
    rowHeight: 26,
    labelX: 306
  }],
  ["leftCounter", [
    [60, 215, 150, 55],
    [135, 239, "100 000"],
    [135, 258, "скалярных произведений"]
  ]],
  ["rightSource", [810, 145]],
  ["rightRows", [
    ["positive", 105, "настоящее контекстное слово"],
    ["negative", 135, "не встречалось рядом"],
    ["negative", 165, "не встречалось рядом"],
    ["negative", 195, "не встречалось рядом"],
    ["negative", 225, "не встречалось рядом"],
    ["negative", 255, "не встречалось рядом"]
  ]],
  ["rightGeometry", {
    lineEndX: 870,
    dotX: 880,
    rowX: 898,
    rowWidth: 232,
    rowHeight: 26,
    labelX: 916
  }],
  ["rightCounter", [
    [665, 210, 145, 58],
    [738, 235, "1 + 5 = 6"],
    [738, 255, "проверок"]
  ]],
  ["comparison", [
    [170, 315, 860, 75],
    [310, 337, "полный softmax"],
    [310, 363, "100 000"],
    [890, 337, "negative sampling"],
    [890, 363, "6"],
    [455, 348, 745, 348],
    [[745, 348], [724, 335], [724, 361]],
    [600, 379, "≈ в 16 000 раз меньше работы"]
  ]]
]);

try {
  const records = new Map(DATA);
  const settings = records.get("settings");
  const {
    origin: originValues,
    scale: scaleValues,
    zero,
    corner,
    rowCorner,
    dotRadius,
    textInset,
    rowHalfHeight
  } = settings;

  const [originX, originY] = originValues;
  const [scaleX, scaleY] = scaleValues;
  const [zeroX] = zero;

  const origin = Object.freeze({ x: originX, y: originY });
  const scale = Object.freeze({ x: scaleX, y: scaleY });

  const sx = x => origin.x + x * scale.x;
  const sy = y => origin.y + y * scale.y;

  const svg = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");
  const namespace = svg.namespaceURI;

  const make = (name, attributes, content) => {
    const node = document.createElementNS(namespace, name);
    Object.entries(attributes).forEach(([key, value]) => {
      node.setAttribute(key, String(value));
    });
    if (content !== undefined) node.textContent = content;
    return node;
  };

  const makeRect = (box, className, radius) => {
    const [x, y, width, height] = box;
    return make("rect", {
      x: sx(x),
      y: sy(y),
      width: sx(x + width) - sx(x),
      height: sy(y + height) - sy(y),
      rx: sx(radius) - sx(zeroX),
      class: className
    });
  };

  const makeLine = (segment, className) => {
    const [xStart, yStart, xEnd, yEnd] = segment;
    return make("line", {
      x1: sx(xStart),
      y1: sy(yStart),
      x2: sx(xEnd),
      y2: sy(yEnd),
      class: className
    });
  };

  const makeCircle = (point, className) => {
    const [x, y] = point;
    return make("circle", {
      cx: sx(x),
      cy: sy(y),
      r: sx(dotRadius) - sx(zeroX),
      class: className
    });
  };

  const makeText = (point, className, content) => {
    const [x, y] = point;
    return make("text", {
      x: sx(x),
      y: sy(y),
      class: className
    }, content);
  };

  const layer = make("g", {});

  const [leftPanel, rightPanel] = records.get("panels");
  layer.append(
    makeRect(leftPanel, "panel", corner),
    makeRect(rightPanel, "panel", corner)
  );

  const [leftHeading, leftSubheading, rightHeading, rightSubheading] =
    records.get("headers");

  layer.append(
    makeText(leftHeading, "heading", leftHeading[2]),
    makeText(leftSubheading, "subheading", leftSubheading[2]),
    makeText(rightHeading, "heading", rightHeading[2]),
    makeText(rightSubheading, "subheading", rightSubheading[2])
  );

  records.get("dividers").forEach(segment => {
    layer.append(makeLine(segment, "divider"));
  });

  records.get("centers").forEach(center => {
    const [x, y, width, height, textX, textY, label] = center;
    layer.append(
      makeRect([x, y, width, height], "node", rowCorner),
      makeText([textX, textY], "node-text", label)
    );
  });

  const [leftSourceX, leftSourceY] = records.get("leftSource");
  const leftGeometry = records.get("leftGeometry");

  records.get("leftRows").forEach(row => {
    const [kind, y, label] = row;

    if (kind === "ellipsis") {
      layer.append(
        makeText(
          [leftGeometry.rowX + leftGeometry.rowWidth / scale.x / scale.x, y],
          "ellipsis",
          label
        )
      );
      return;
    }

    layer.append(
      makeLine(
        [leftSourceX, leftSourceY, leftGeometry.lineEndX, y],
        "fan"
      ),
      makeCircle([leftGeometry.dotX, y], "dot"),
      makeRect(
        [
          leftGeometry.rowX,
          y - rowHalfHeight,
          leftGeometry.rowWidth,
          leftGeometry.rowHeight
        ],
        "row",
        rowCorner
      ),
      makeText(
        [leftGeometry.labelX, y],
        "row-label",
        label
      )
    );
  });

  const [leftCounterBox, leftCounterMain, leftCounterNote] =
    records.get("leftCounter");

  layer.append(
    makeRect(leftCounterBox, "counter", rowCorner),
    makeText(leftCounterMain, "counter-main", leftCounterMain[2]),
    makeText(leftCounterNote, "counter-note", leftCounterNote[2])
  );

  const [rightSourceX, rightSourceY] = records.get("rightSource");
  const rightGeometry = records.get("rightGeometry");

  records.get("rightRows").forEach(row => {
    const [kind, y, label] = row;
    const positive = kind === "positive";
    const lineClass = positive ? "positive-line" : "negative-line";
    const dotClass = positive ? "dot-positive" : "dot-negative";
    const rowClass = positive ? "row-positive" : "row-negative";

    layer.append(
      makeLine(
        [rightSourceX, rightSourceY, rightGeometry.lineEndX, y],
        lineClass
      ),
      makeCircle([rightGeometry.dotX, y], dotClass),
      makeRect(
        [
          rightGeometry.rowX,
          y - rowHalfHeight,
          rightGeometry.rowWidth,
          rightGeometry.rowHeight
        ],
        rowClass,
        rowCorner
      ),
      makeText(
        [rightGeometry.labelX, y],
        "row-label",
        label
      )
    );
  });

  const [rightCounterBox, rightCounterMain, rightCounterNote] =
    records.get("rightCounter");

  layer.append(
    makeRect(rightCounterBox, "counter-positive", rowCorner),
    makeText(rightCounterMain, "counter-main", rightCounterMain[2]),
    makeText(rightCounterNote, "counter-note", rightCounterNote[2])
  );

  const [
    comparisonBox,
    leftMethod,
    leftNumber,
    rightMethod,
    rightNumber,
    arrowLine,
    arrowHead,
    savingLabel
  ] = records.get("comparison");

  const arrowPoints = arrowHead
    .map(([x, y]) => `${sx(x)},${sy(y)}`)
    .join(" ");

  layer.append(
    makeRect(comparisonBox, "comparison", corner),
    makeText(leftMethod, "comparison-small", leftMethod[2]),
    makeText(leftNumber, "comparison-number", leftNumber[2]),
    makeText(rightMethod, "comparison-small", rightMethod[2]),
    makeText(rightNumber, "comparison-number", rightNumber[2]),
    makeLine(arrowLine, "comparison-arrow"),
    make("polygon", { points: arrowPoints, class: "arrow-head" }),
    makeText(savingLabel, "saving", savingLabel[2])
  );

  svg.append(layer);
} catch (error) {
  const svg = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");
  svg.hidden = true;
  fallback.hidden = false;
}
</script>
</body>
</html>
