<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Как one-hot выбирает embedding</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f9fc;
    --panel: #ffffff;
    --panel-soft: #edf3fa;
    --text: #182231;
    --muted: #58677a;
    --line: #8291a5;
    --blue: #2563eb;
    --blue-soft: #dbeafe;
    --green: #15803d;
    --green-soft: #dcfce7;
    --orange: #c2410c;
    --orange-soft: #ffedd5;
    --zero: #cbd5e1;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101722;
      --panel: #182231;
      --panel-soft: #222f42;
      --text: #eef4ff;
      --muted: #aebbd0;
      --line: #718198;
      --blue: #7aa7ff;
      --blue-soft: #19335f;
      --green: #73d891;
      --green-soft: #173d29;
      --orange: #ff9b6b;
      --orange-soft: #552b1e;
      --zero: #506078;
    }
  }

  html, body {
    background: var(--bg);
    color: var(--text);
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  h1 {
    font-size: 22px;
    line-height: 1.2;
    text-align: center;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 460px;
    background: var(--bg);
    font-family: inherit;
  }

  .panel {
    fill: var(--panel);
    stroke: var(--line);
    stroke-width: 2px;
  }

  .soft {
    fill: var(--panel-soft);
    stroke: var(--line);
    stroke-width: 1px;
  }

  .selected {
    fill: var(--green-soft);
    stroke: var(--green);
    stroke-width: 3px;
  }

  .zero {
    fill: var(--panel-soft);
    stroke: var(--zero);
    stroke-width: 1px;
  }

  .one {
    fill: var(--orange-soft);
    stroke: var(--orange);
    stroke-width: 3px;
  }

  .hidden {
    fill: var(--blue-soft);
    stroke: var(--blue);
    stroke-width: 2px;
  }

  .wire {
    fill: none;
    stroke: var(--line);
    stroke-width: 2px;
  }

  .active-wire {
    fill: none;
    stroke: var(--green);
    stroke-width: 4px;
  }

  .arrow {
    fill: var(--blue);
    stroke: var(--blue);
    stroke-width: 2px;
  }

  .active-arrow {
    fill: var(--green);
    stroke: var(--green);
    stroke-width: 2px;
  }

  .label {
    fill: var(--text);
    font-size: 18px;
    font-weight: bold;
  }

  .small {
    fill: var(--muted);
    font-size: 14px;
  }

  .number {
    fill: var(--text);
    font-size: 16px;
    font-variant-numeric: tabular-nums;
  }

  .accent {
    fill: var(--green);
    font-size: 16px;
    font-weight: bold;
  }

  .formula {
    fill: var(--blue);
    font-size: 17px;
    font-weight: bold;
  }

  .fallback {
    color: var(--text);
    font-size: 18px;
    text-align: center;
  }
</style>
</head>
<body>
<h1>One-hot не смешивает строки — единица выбирает одну строку W</h1>

<svg id="diagram"
     viewBox="0 0 1200 440"
     width="1200"
     height="440"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Как one-hot выбирает embedding из матрицы весов</title>
  <desc id="svgDesc">One-hot-вектор длины 10 000 выбирает строку матрицы W размером 10 000 на 100. Выбранные 100 чисел образуют скрытый вектор, который через W штрих даёт выход по словарю.</desc>
</svg>

<script>
(() => {
  const data = [{
    originX: 0, originY: 0, scale: 1,
    canvasX: 0, canvasY: 0, canvasW: 1200, canvasH: 440,
    one: 1,
    inputX: 45, inputY: 92, inputW: 130, inputH: 232,
    inputCellX: 76, inputCellW: 68, inputCellH: 38,
    inputRows: [105, 151, 197, 243, 289],
    inputValues: ["0", "0", "1", "0", "⋮"],
    matrixX: 270, matrixY: 80, matrixW: 330, matrixH: 256,
    matrixLabelY: 52,
    matrixRows: [96, 132, 168, 204, 240, 276],
    matrixRowH: 32,
    matrixCols: [286, 358, 430, 502, 574],
    matrixColW: 56,
    matrixValues: [
      ["·", "·", "·", "…", "·"],
      ["·", "·", "·", "…", "·"],
      ["−0,4", "0,8", "0,1", "…", "w₁₀₀"],
      ["·", "·", "·", "…", "·"],
      ["·", "·", "·", "…", "·"],
      ["⋮", "⋮", "⋮", "⋱", "⋮"]
    ],
    selectedRow: 2,
    hiddenX: 705, hiddenY: 104, hiddenW: 122, hiddenH: 208,
    hiddenCellsX: 730, hiddenCellsW: 72, hiddenCellH: 34,
    hiddenRows: [120, 160, 200, 240, 280],
    hiddenValues: ["−0,4", "0,8", "0,1", "⋮", "h₁₀₀"],
    outMatrixX: 905, outMatrixY: 101, outMatrixW: 105, outMatrixH: 214,
    outputX: 1080, outputY: 91, outputW: 82, outputH: 234,
    outputRows: [111, 151, 191, 231, 271],
    outputValues: ["y₁", "y₂", "y₃", "⋮", "y₁₀₀₀₀"],
    arrowInputStartX: 175, arrowInputEndX: 270, arrowInputY: 216,
    arrowHiddenStartX: 600, arrowHiddenEndX: 705, arrowHiddenY: 216,
    arrowOutStartX: 827, arrowOutEndX: 905, arrowOutY: 216,
    arrowVocabStartX: 1010, arrowVocabEndX: 1080, arrowVocabY: 216,
    arrowHead: 10, arrowWing: 7,
    titleY: 52, sectionLabelY: 72,
    noteY: 374, legendY: 414,
    labelPad: 10,
    inputLinkX: 144, inputLinkY: 216,
    selectedLinkX: 270, selectedLinkY: 184,
    elbowX: 224,
    rowTextY: 189,
    matrixBottomTextY: 329,
    hiddenBottomTextY: 306,
    outputBottomTextY: 318,
    noteBoxX: 270, noteBoxY: 354, noteBoxW: 557, noteBoxH: 42,
    legendBoxX: 45, legendBoxY: 403, legendBoxW: 1117, legendBoxH: 30,
    matrixDimX: 435, hiddenDimX: 766, outDimX: 957, outputDimX: 1121,
    half: 0.5,
    quarter: 0.25,
    threeQuarter: 0.75,
    inputVectorLength: "10 000",
    embeddingLength: "100",
    vocabLength: "10 000"
  }];

  const D = data[0];
  const origin = { x: D.originX, y: D.originY };
  const scale = D.scale;

  function sx(x) { return origin.x + x * scale; }
  function sy(y) { return origin.y + y * scale; }

  const svg = document.getElementById("diagram");
  const NS = "http://www.w3.org/2000/svg";

  try {
    const node = (name, attrs, parent = svg) => {
      const el = document.createElementNS(NS, name);
      Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
      parent.appendChild(el);
      return el;
    };

    const rect = (x, y, w, h, cls, parent = svg) =>
      node("rect", {
        x: sx(x), y: sy(y),
        width: sx(x + w) - sx(x),
        height: sy(y + h) - sy(y),
        class: cls
      }, parent);

    const line = (x1, y1, x2, y2, cls, parent = svg) =>
      node("line", {
        x1: sx(x1), y1: sy(y1),
        x2: sx(x2), y2: sy(y2),
        class: cls
      }, parent);

    const text = (x, y, value, cls, anchor = "middle", parent = svg) => {
      const el = node("text", {
        x: sx(x), y: sy(y),
        class: cls,
        "text-anchor": anchor,
        "dominant-baseline": "middle"
      }, parent);
      el.textContent = value;
      return el;
    };

    const arrow = (x1, y1, x2, y2, active) => {
      const cls = active ? "active-wire" : "wire";
      const headCls = active ? "active-arrow" : "arrow";
      line(x1, y1, x2 - D.arrowHead, y2, cls);
      node("polygon", {
        points: [
          `${sx(x2)},${sy(y2)}`,
          `${sx(x2 - D.arrowHead)},${sy(y2 - D.arrowWing)}`,
          `${sx(x2 - D.arrowHead)},${sy(y2 + D.arrowWing)}`
        ].join(" "),
        class: headCls
      });
    };

    rect(D.canvasX, D.canvasY, D.canvasW, D.canvasH, "soft");

    text(
      D.inputX + D.inputW * D.half,
      D.titleY,
      "one-hot",
      "label"
    );
    text(
      D.inputX + D.inputW * D.half,
      D.sectionLabelY,
      `длина ${D.inputVectorLength}`,
      "small"
    );
    rect(D.inputX, D.inputY, D.inputW, D.inputH, "panel");

    D.inputRows.forEach((rowY, index) => {
      const chosen = index === D.selectedRow;
      rect(
        D.inputCellX,
        rowY,
        D.inputCellW,
        D.inputCellH,
        chosen ? "one" : "zero"
      );
      text(
        D.inputCellX + D.inputCellW * D.half,
        rowY + D.inputCellH * D.half,
        D.inputValues[index],
        chosen ? "accent" : "number"
      );
    });

    text(
      D.inputCellX - D.labelPad,
      D.inputRows[D.selectedRow] + D.inputCellH * D.half,
      "позиция слова",
      "small",
      "end"
    );

    text(D.matrixDimX, D.matrixLabelY, "матрица W", "label");
    text(
      D.matrixDimX,
      D.sectionLabelY,
      `${D.vocabLength} × ${D.embeddingLength}`,
      "small"
    );
    rect(D.matrixX, D.matrixY, D.matrixW, D.matrixH, "panel");

    D.matrixRows.forEach((rowY, rowIndex) => {
      const chosen = rowIndex === D.selectedRow;
      D.matrixCols.forEach((colX, colIndex) => {
        rect(
          colX,
          rowY,
          D.matrixColW,
          D.matrixRowH,
          chosen ? "selected" : "soft"
        );
        text(
          colX + D.matrixColW * D.half,
          rowY + D.matrixRowH * D.half,
          D.matrixValues[rowIndex][colIndex],
          chosen ? "accent" : "number"
        );
      });
    });

    text(
      D.matrixX + D.labelPad,
      D.rowTextY,
      "выбранная строка",
      "accent",
      "start"
    );
    text(
      D.matrixDimX,
      D.matrixBottomTextY,
      "10 000 строк, по одной на слово",
      "small"
    );

    line(
      D.inputLinkX,
      D.inputLinkY,
      D.elbowX,
      D.inputLinkY,
      "active-wire"
    );
    line(
      D.elbowX,
      D.inputLinkY,
      D.elbowX,
      D.selectedLinkY,
      "active-wire"
    );
    arrow(
      D.elbowX,
      D.selectedLinkY,
      D.selectedLinkX,
      D.selectedLinkY,
      true
    );
    text(
      D.elbowX,
      D.inputLinkY + D.labelPad,
      "единица указывает строку",
      "small"
    );

    text(
      (D.arrowHiddenStartX + D.arrowHiddenEndX) * D.half,
      D.arrowHiddenY - D.labelPad,
      "забрать строку",
      "accent"
    );
    arrow(
      D.arrowHiddenStartX,
      D.arrowHiddenY,
      D.arrowHiddenEndX,
      D.arrowHiddenY,
      true
    );

    text(
      D.hiddenX + D.hiddenW * D.half,
      D.titleY,
      "скрытый вектор",
      "label"
    );
    text(
      D.hiddenX + D.hiddenW * D.half,
      D.sectionLabelY,
      `${D.embeddingLength} чисел`,
      "small"
    );
    rect(D.hiddenX, D.hiddenY, D.hiddenW, D.hiddenH, "hidden");

    D.hiddenRows.forEach((rowY, index) => {
      rect(
        D.hiddenCellsX,
        rowY,
        D.hiddenCellsW,
        D.hiddenCellH,
        index < D.selectedRow + D.one ? "selected" : "soft"
      );
      text(
        D.hiddenCellsX + D.hiddenCellsW * D.half,
        rowY + D.hiddenCellH * D.half,
        D.hiddenValues[index],
        index < D.selectedRow + D.one ? "accent" : "number"
      );
    });

    text(
      D.hiddenDimX,
      D.hiddenBottomTextY,
      "embedding слова",
      "formula"
    );

    text(
      (D.arrowOutStartX + D.arrowOutEndX) * D.half,
      D.arrowOutY - D.labelPad,
      "дальше",
      "small"
    );
    arrow(
      D.arrowOutStartX,
      D.arrowOutY,
      D.arrowOutEndX,
      D.arrowOutY,
      false
    );

    text(D.outDimX, D.titleY, "матрица W′", "label");
    text(
      D.outDimX,
      D.sectionLabelY,
      `${D.embeddingLength} × ${D.vocabLength}`,
      "small"
    );
    rect(
      D.outMatrixX,
      D.outMatrixY,
      D.outMatrixW,
      D.outMatrixH,
      "panel"
    );

    D.matrixRows.forEach((rowY, rowIndex) => {
      const innerY = D.outMatrixY +
        (rowY - D.matrixY) * D.threeQuarter;
      line(
        D.outMatrixX,
        innerY,
        D.outMatrixX + D.outMatrixW,
        innerY,
        "wire"
      );
      if (rowIndex < D.selectedRow) {
        line(
          D.outMatrixX + D.outMatrixW * D.quarter,
          D.outMatrixY,
          D.outMatrixX + D.outMatrixW * D.quarter,
          D.outMatrixY + D.outMatrixH,
          "wire"
        );
      }
    });
    text(
      D.outDimX,
      D.outMatrixY + D.outMatrixH * D.half,
      "⋯",
      "number"
    );

    text(
      (D.arrowVocabStartX + D.arrowVocabEndX) * D.half,
      D.arrowVocabY - D.labelPad,
      "оценки",
      "small"
    );
    arrow(
      D.arrowVocabStartX,
      D.arrowVocabY,
      D.arrowVocabEndX,
      D.arrowVocabY,
      false
    );

    text(D.outputDimX, D.titleY, "выход", "label");
    text(
      D.outputDimX,
      D.sectionLabelY,
      "по словарю",
      "small"
    );
    rect(D.outputX, D.outputY, D.outputW, D.outputH, "panel");

    D.outputRows.forEach((rowY, index) => {
      rect(
        D.outputX + D.labelPad,
        rowY,
        D.outputW - D.labelPad - D.labelPad,
        D.inputCellH,
        "soft"
      );
      text(
        D.outputX + D.outputW * D.half,
        rowY + D.inputCellH * D.half,
        D.outputValues[index],
        "number"
      );
    });

    text(
      D.outputDimX,
      D.outputBottomTextY,
      `${D.vocabLength} значений`,
      "small"
    );

    rect(
      D.noteBoxX,
      D.noteBoxY,
      D.noteBoxW,
      D.noteBoxH,
      "selected"
    );
    text(
      D.noteBoxX + D.noteBoxW * D.half,
      D.noteY,
      "W[позиция единицы] = [−0,4; 0,8; 0,1; …; w₁₀₀]",
      "formula"
    );

    rect(
      D.legendBoxX,
      D.legendBoxY,
      D.legendBoxW,
      D.legendBoxH,
      "panel"
    );
    text(
      D.legendBoxX + D.legendBoxW * D.half,
      D.legendY,
      "Нули ничего не добавляют • единица достаёт строку • строка становится embedding",
      "small"
    );
  } catch (error) {
    while (svg.lastChild && !["title", "desc"].includes(svg.lastChild.nodeName)) {
      svg.removeChild(svg.lastChild);
    }
    const fallback = document.createElement("p");
    fallback.className = "fallback";
    fallback.textContent =
      "Схема должна была показать: one-hot длины 10 000 выбирает одну строку W размером 10 000 × 100; эти 100 чисел образуют embedding и через W′ дают выход по словарю.";
    svg.replaceWith(fallback);
  }
})();
</script>
</body>
</html>
