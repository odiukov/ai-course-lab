- concept: угол между ненулевыми векторами восстанавливается из косинусной близости через арккосинус
  question: Заполни пропуск в NumPy-коде, который переводит cosine similarity в угол в радианах.
  explanation: Cosine similarity равна косинусу угла между ненулевыми векторами, поэтому обратная операция — arccos. Например, приведённая в уроке близость queen к вектору аналогии соответствует острому углу, а не полному совпадению направлений.
