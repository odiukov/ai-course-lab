- concept: устойчивое представление значения возникает из распределения слова по множеству контекстов
  question: Почему при обучении представления слова полезнее учитывать множество его употреблений, а не делать вывод по одному предложению?
  explanation: Дистрибутивный подход опирается не на единичного соседа, а на статистику окружений во всём корпусе. Случайные и редкие сочетания дают слабый вклад, а регулярно повторяющиеся соседства формируют устойчивое представление.
  kind: open
  reference: Отдельное употребление может быть неоднозначным или нетипичным. Повторяющиеся контексты в корпусе позволяют выделить устойчивые закономерности соседства и по ним приблизительно определить семантические связи слова.
