- concept: размах смещения по семантической оси определяется крайними координатами
  question: Координаты профессий на одной оси смещения равны −0.44, 0.09, 0.37 и 0.61. Каков наибольший разрыв между профессиями вдоль этой оси?
  explanation: 'Наибольший разрыв равен размаху координат: max − min = 0.61 − (−0.44) = 1.05. Его задают профессии на противоположных краях отсортированного списка.'
  kind: numeric
  answer: 1.05
  tolerance: 0.001
  id: 044-uprazhnenie-smeshcheniya-1
  fingerprint: 92f13e74
- concept: смещение в embeddings диагностирует ассоциации обучающего корпуса, а не свойства людей
  question: Профессия получила большую положительную проекцию на гендерную ось embedding-пространства. Какой вывод обоснован?
  explanation: Проекция отражает статистические ассоциации в конкретном корпусе и обученной модели. Она служит сигналом для аудита данных, но не доказывает свойства людей, причинность или универсальность найденной связи.
  kind: choice
  options:
    - Представители этой профессии обладают соответствующим гендерным признаком
    - Контексты обучающего корпуса связали название профессии с соответствующей стороной оси
    - Модель доказала причинную связь между профессией и гендером
    - Профессия будет иметь такое же смещение в любой Word2Vec-модели
  correct: 1
