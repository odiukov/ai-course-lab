- concept: вычисление sigmoid для скалярного произведения
  question: Скалярное произведение embeddings равно ln(7). Какую оценку даст sigmoid?
  explanation: σ(ln(7)) = 1 / (1 + e^(−ln(7))) = 1 / (1 + 1/7) = 7/8 = 0.875. Sigmoid переводит неограниченное скалярное произведение в оценку между 0 и 1.
  kind: numeric
  answer: 0.875
  tolerance: 0.001
  id: 015-sigmoid-veroyatnost-1
  fingerprint: c457b045
- concept: монотонность sigmoid сохраняет порядок скалярных произведений
  question: У пары A скалярное произведение embeddings меньше, чем у пары B. Что обязательно верно после применения sigmoid?
  explanation: 'Sigmoid строго возрастает: большее скалярное произведение всегда превращается в большую оценку. Функция меняет шкалу, но не переставляет пары в ранжировании.'
  kind: choice
  options:
    - Оценка пары A будет меньше оценки пары B
    - Обе пары получат одинаковую оценку
    - Оценка пары A будет больше оценки пары B
    - Порядок оценок нельзя определить без размерности embeddings
  correct: 0
  id: 015-sigmoid-veroyatnost-2
