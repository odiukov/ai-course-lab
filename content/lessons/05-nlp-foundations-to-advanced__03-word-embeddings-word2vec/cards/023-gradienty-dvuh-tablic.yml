- concept: одна обучающая пара разреженно обновляет только участвующие строки таблиц Word2Vec
  question: Какие строки параметров могут измениться после обработки одной положительной пары методом negative sampling?
  explanation: Один вызов train_pair точечно меняет W[center], W'[context] и строки W' для выбранных негативов. Остальные строки словаря не участвуют в вычислении этой потери и остаются прежними.
  kind: choice
  options:
    - Строка центрального слова в W, а в W' — строки настоящего контекста и выбранных негативов
    - Все строки обеих таблиц W и W'
    - Строка контекста в W и строка центрального слова в W'
    - Только строка центрального слова в W
  correct: 0
  id: 023-gradienty-dvuh-tablic-1
  fingerprint: 47e42c8c
- concept: градиенты одной пары вычисляются из согласованного состояния параметров до их обновления
  question: Почему при обработке одной пары Word2Vec полезно сначала вычислить все градиенты, используя исходные центральный и контекстные векторы, и лишь затем изменять таблицы?
  explanation: В train_pair центральный и контекстные векторы сначала сохраняются, затем по ним вычисляются оценки и grad_center. Поэтому обновления W и W' соответствуют одной обучающей паре и одному состоянию параметров.
  kind: open
  reference: Так все компоненты градиента относятся к одной и той же точке параметров и одной функции потерь. Если изменить один вектор раньше, оставшиеся обновления будут вычисляться уже из смешанного состояния модели.
  id: 023-gradienty-dvuh-tablic-2
  fingerprint: e419bd2b
- concept: скорость обучения пропорционально масштабирует градиентное обновление
  question: Заполните пропуск в общей формуле изменения параметра при градиентном спуске.
  explanation: 'Скорость обучения умножает градиент: её уменьшение делает все сдвиги осторожнее, но при неизменном градиенте не меняет направление обновления.'
