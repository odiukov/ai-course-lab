- concept: подвыборка Word2Vec стохастически удаляет вхождения слов на основе их относительной частоты в корпусе
  question: Как корректно реализовать подвыборку частых слов перед созданием обучающих пар Word2Vec?
  explanation: Порог 10^-5 относится к доле слова во всём корпусе. Частые слова удаляются вероятностно, поэтому часть их вхождений сохраняется и продолжает передавать информацию о структуре контекста.
  kind: choice
  options:
    - Навсегда удалить из словаря все слова с большим числом появлений
    - Вычислить долю каждого слова в корпусе и случайно пропускать его вхождения, повышая вероятность пропуска для более частых слов
    - Случайно удалять преимущественно редкие слова, чтобы выровнять словарь
    - Оставить от каждого слова одинаковое фиксированное число вхождений
  correct: 1
  id: 043-uprazhnenie-subsampling-1
  fingerprint: e11872ab
- concept: подвыборка перераспределяет обучающие обновления в пользу содержательных слов, не создавая новых примеров редких слов
  question: Объясните своими словами, почему подвыборка частых слов может улучшить представления редких слов, хотя не увеличивает число их появлений в корпусе.
  explanation: Фильтрация не добавляет редким словам новых контекстов. Она уменьшает число малоинформативных обновлений от частых слов, сокращает общее количество пар и освобождает ограниченный бюджет обучения для более содержательных наблюдений.
  kind: open
  reference: Подвыборка сокращает множество повторяющихся пар со служебными и другими очень частыми словами. Обучение тратит меньшую долю обновлений на такие пары, поэтому существующие примеры с редкими содержательными словами получают больший относительный вес.
  id: 043-uprazhnenie-subsampling-2
  fingerprint: 858c3f76
