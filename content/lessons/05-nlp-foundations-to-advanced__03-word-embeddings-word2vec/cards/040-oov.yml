- concept: обычный Word2Vec выдаёт вектор только для точного токена из своего словаря
  question: В словаре Word2Vec есть отдельные токены `neo` и `bank`, но нет токена `neo-bank`. Что произойдёт при запросе вектора для `neo-bank` без дополнительной предобработки?
  explanation: Word2Vec хранит готовую строку векторов для каждого токена обучающего словаря и выполняет точный поиск. Он не разбирает неизвестный токен на знакомые части, поэтому отсутствие `neo-bank` в словаре означает отсутствие его собственного вектора.
  kind: choice
  options:
    - Модель автоматически усреднит векторы `neo` и `bank`
    - Модель не сможет вернуть собственный вектор для `neo-bank`
    - Модель вычислит вектор по символам дефиса и букв
    - Модель выберет вектор наиболее похожего токена
  correct: 1
  id: 040-oov-1
  fingerprint: 45d563a2
- concept: единый токен UNK устраняет ошибку поиска, но стирает различия между неизвестными словами
  question: Объясни своими словами, почему замена всех неизвестных слов одним токеном `UNK` позволяет обработать OOV-ввод, но не даёт модели различать значения этих слов.
  explanation: Подстановка `UNK` превращает любой OOV-токен в известную запись словаря. Однако один и тот же вектор используется для всех неизвестных слов, поэтому сведения об их написании и возможном значении теряются.
  kind: open
  reference: У `UNK` есть один фиксированный вектор, которым заменяются все отсутствующие в словаре токены. Поэтому программа больше не сталкивается с отсутствующей строкой, но разные новые термины, фамилии и опечатки получают одинаковое представление.
  id: 040-oov-2
  fingerprint: 9670bf1b
