- concept: ограничение аргумента до вычисления экспоненты предотвращает численное переполнение
  question: Расположите операции безопасного вычисления sigmoid в правильном порядке.
  explanation: Сначала аргумент ограничивают диапазоном от −20 до 20 и лишь затем передают в экспоненту. Если применить np.clip после np.exp, переполнение уже могло произойти.
  kind: order
  items:
    - Ограничить вход с помощью np.clip
    - Взять отрицание ограниченного значения
    - Вычислить np.exp
    - Прибавить единицу к результату
    - Взять обратную величину
  id: 016-sigmoid-1
  fingerprint: fa017222
- concept: векторизованные операции NumPy вычисляют sigmoid поэлементно и сохраняют форму массива
  question: Функция sigmoid реализована только через np.clip, np.exp и арифметические операции NumPy. На вход передан многомерный массив. Что верно о результате?
  explanation: np.clip, np.exp и арифметика NumPy работают поэлементно. Поэтому явный цикл не нужен, а форма входного массива сохраняется.
  kind: choice
  options:
    - Получится массив той же формы с поэлементно вычисленными значениями
    - Получится одно скалярное значение, усреднённое по всем элементам
    - Получится обычный список Python независимо от типа входа
    - Возникнет ошибка, потому что np.clip принимает только скаляры
  correct: 0
