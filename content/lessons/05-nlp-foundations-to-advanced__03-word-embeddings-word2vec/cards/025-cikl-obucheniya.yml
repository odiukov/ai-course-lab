- concept: перемешивание примеров между эпохами уменьшает систематическое влияние порядка при последовательных обновлениях
  question: Объясни своими словами, зачем перед каждой эпохой перемешивать обучающие пары при последовательном обновлении параметров.
  explanation: В показанном цикле параметры обновляются после каждой пары. Без перемешивания пары всегда воздействовали бы на модель в одной последовательности; rng.shuffle(pairs) меняет её перед каждым новым проходом.
  kind: open
  reference: Каждое обновление меняет параметры, поэтому результат следующего обновления зависит от предшествующих примеров. Перемешивание варьирует этот порядок между эпохами и уменьшает устойчивое смещение, связанное с фиксированной последовательностью пар.
  id: 025-cikl-obucheniya-2
  fingerprint: 8643d12d
- concept: повторная выборка негативов расширяет набор отрицательных сравнений для одной положительной пары
  question: Одну и ту же положительную пару skip-gram встречают в нескольких эпохах, каждый раз заново выбирая негативные слова. Каково основное следствие?
  explanation: Положительная пара остаётся прежней, но новые случайные негативы дают ей разнообразные отрицательные сравнения. В учебном цикле sample_negatives вызывается заново при каждой обработке пары.
  kind: choice
  options:
    - Положительная пара со временем сравнивается с более разнообразными случайными словами
    - Положительная пара автоматически становится несколькими разными парами
    - Число строк в таблице эмбеддингов увеличивается после каждой эпохи
