- concept: результат векторной арифметики аналогии ищут по близости, а не по точному совпадению
  question: Функция вычислила целевой вектор аналогии как W[vocab[b]] - W[vocab[a]] + W[vocab[c]]. Как корректно получить слова-кандидаты?
  explanation: Линейная комбинация embeddings обычно не совпадает точно ни с одной строкой W. Поэтому она задаёт точку в пространстве, а ответом становятся ближайшие к ней векторы по косинусной близости.
  kind: choice
  options:
    - Искать строку W, в точности равную целевому вектору
    - Выбрать слово, embedding которого имеет наибольшую норму
    - Передать целевой вектор функции поиска ближайших слов по косинусной близости
  correct: 2
  id: 033-analogy-1
  fingerprint: 20f14104
- concept: исключение слов-операндов из результатов векторной аналогии
  question: Заполни аргумент exclude так, чтобы слова из запроса аналогии не попали в выдачу.
  explanation: В exclude передаются индексы строк W, а не сами строки a, b и c. Эти слова находятся близко к построенному вектору по самой структуре выражения и без исключения могут вытеснить новые ответы.
  kind: cloze
  template: return nearest(vocab, W, target, topk=topk, exclude=___)
  answer: '{vocab[a], vocab[b], vocab[c]}'
  accept:
    - set([vocab[a], vocab[b], vocab[c]])
    - set((vocab[a], vocab[b], vocab[c]))
  id: 033-analogy-2
  fingerprint: 79a6406a
