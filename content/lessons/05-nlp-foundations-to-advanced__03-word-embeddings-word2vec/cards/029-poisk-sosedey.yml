- concept: алгоритм ранжирования слов по близости к целевому вектору
  question: Расположите операции поиска ближайших слов в правильном порядке.
  explanation: После независимой нормализации скалярные произведения становятся косинусными близостями. Матрично-векторное умножение сразу даёт оценки для всего словаря, после чего остаётся ранжирование.
  kind: order
  items:
    - Вычислить нормы строк матрицы embeddings и норму целевого вектора
    - Разделить строки и целевой вектор на соответствующие нормы
    - Умножить нормализованную матрицу на нормализованный целевой вектор
    - Отсортировать полученные оценки по убыванию и выбрать верхние допустимые слова
  id: 029-poisk-sosedey-2
  fingerprint: 0c8f56cd
