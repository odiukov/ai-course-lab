- concept: полная логистическая функция потерь negative sampling
  question: Пусть s_pos — скалярное произведение центрального вектора с настоящим контекстом, а s_neg — скалярные произведения с негативами. Какую функцию потерь следует минимизировать?
  explanation: Первое слагаемое штрафует низкую оценку настоящего контекста. Слагаемые с σ(−s_neg) штрафуют высокие скалярные произведения с негативами, поэтому модель притягивает положительный контекст и отталкивает отрицательные.
  kind: choice
  options:
    - −log σ(s_pos) − Σ log σ(−s_neg)
    - −log σ(s_pos) − Σ log σ(s_neg)
    - −log σ(−s_pos) − Σ log σ(−s_neg)
    - −log σ(−s_pos) − Σ log σ(s_neg)
  correct: 0
  id: 024-train-pair-1
  fingerprint: 027a0d5e
- concept: накопление градиента параметра, участвующего во всех скалярных произведениях
  question: Почему при обучении положительной пары с набором негативов градиент центрального вектора суммирует вклады всех контекстов, а каждая строка контекстной таблицы получает только свой вклад?
  explanation: Градиент параметра складывается из производных всех слагаемых потери, которые от него зависят. Центральная строка общая для всех оценок, тогда как каждая контекстная строка при различных индексах относится только к своей оценке.
  kind: open
  reference: Центральный вектор участвует в скалярном произведении и с настоящим контекстом, и с каждым негативом, поэтому по правилу цепочки его градиент является суммой всех вкладов. Отдельный контекстный вектор участвует только в соответствующем ему скалярном произведении, поэтому получает вклад только от этого слагаемого потери.
  id: 024-train-pair-2
  fingerprint: b1049079
