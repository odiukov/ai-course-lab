- concept: косинусная близость вычисляется как нормированное скалярное произведение embeddings
  question: Даны embeddings [4, 7] и [8, 4]. Чему примерно равна их косинусная близость?
  explanation: 'Скалярное произведение равно 60, а произведение норм — √65 · √80. Поэтому cosine similarity = 60 / √5200 ≈ 0.832: векторы направлены достаточно похоже.'
  kind: numeric
  answer: 0.832
  tolerance: 0.02
  id: 027-kosinus-embeddingov-1
  fingerprint: be48bec6
- concept: положительное масштабирование embedding не изменяет его косинусную близость с другими векторами
  question: Embedding слова умножили на произвольный положительный коэффициент. Как это повлияет на его косинусную близость с неизменённым embedding другого слова?
  explanation: Положительное масштабирование меняет длину вектора, но сохраняет направление. При вычислении косинуса масштаб сокращается с таким же множителем в норме.
  kind: choice
  options:
    - Косинусная близость не изменится
    - Косинусная близость умножится на тот же коэффициент
    - Косинусная близость обязательно уменьшится
    - Результат станет равен длине масштабированного вектора
  correct: 0
  id: 027-kosinus-embeddingov-2
  fingerprint: 5b1d8e1c
- concept: отрицательная косинусная близость не является достаточным признаком антонимии
  question: Два embeddings имеют отрицательную косинусную близость. Что из этого можно заключить и почему этого недостаточно, чтобы назвать слова антонимами?
  explanation: Косинус описывает взаимное направление векторов, а не конкретное лингвистическое отношение. Антонимия требует дополнительных семантических признаков или проверки по данным.
  kind: open
  reference: Отрицательный косинус означает, что векторы образуют тупой угол и направлены в разные стороны в выученном пространстве. Геометрическое направление определяется обучающими контекстами и само по себе не является словарной меткой антонимии.
  id: 027-kosinus-embeddingov-3
  fingerprint: 31e3b95d
