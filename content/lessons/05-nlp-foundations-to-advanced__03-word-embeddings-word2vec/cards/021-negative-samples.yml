- concept: воспроизводимость случайной выборки зависит от состояния генератора и последовательности обращений к нему
  question: Объясните, при каких условиях два запуска функции negative sampling вернут одинаковые результаты.
  explanation: 'Генератор псевдослучайных чисел детерминирован: следующее значение определяется его текущим состоянием. Поэтому одного общего seed недостаточно, если до выборки генераторы использовались по-разному.'
  kind: open
  reference: Генераторы должны начинать из одинакового состояния, например быть созданы с одинаковым seed, и получать одинаковую последовательность вызовов. Любое дополнительное обращение к одному из генераторов изменит его состояние и может привести к другой выборке.
  id: 021-negative-samples-2
  fingerprint: 3c93c505
