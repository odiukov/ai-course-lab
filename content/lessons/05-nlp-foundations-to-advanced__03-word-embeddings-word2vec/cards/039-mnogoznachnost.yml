  fingerprint: 9be6245c
- concept: частота значений смещает статический embedding к наиболее распространённому значению
  question: Как повлияет на статический embedding многозначного слова ситуация, когда одно его значение встречается в обучающем корпусе намного чаще другого?
  explanation: Один вектор обучается на всех появлениях слова, поэтому вклад преобладающего значения доминирует. В приведённом в уроке случае с bank финансовые употребления составляют 80%, и итоговый вектор оказывается в основном финансовым.
  kind: open
  reference: Вектор будет сильнее отражать контексты частого значения. Контексты редкого значения тоже повлияют на него, но отдельного представления для редкого смысла не возникнет.
