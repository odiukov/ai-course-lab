- concept: успех векторной аналогии зависит от регулярности отношения в обучающем корпусе
  question: Объясни своими словами, почему аналогии Word2Vec могут хорошо работать для одних отношений и давать ошибочные ответы для других.
  explanation: Аналогия — следствие выученной геометрической закономерности, а не символического знания. Поэтому её надёжность определяется тем, насколько устойчиво нужная связь представлена в обучающих данных.
  kind: open
  reference: Word2Vec не применяет логическое правило, а отражает статистику контекстов. Если одно и то же отношение часто и последовательно проявляется в корпусе, соответствующие пары слов могут получить похожие направления смещения. Шум, редкие примеры и многозначность нарушают эту геометрическую регулярность и ухудшают результат.
  id: 032-vektornaya-arifmetika-2
  fingerprint: 3d26f498
