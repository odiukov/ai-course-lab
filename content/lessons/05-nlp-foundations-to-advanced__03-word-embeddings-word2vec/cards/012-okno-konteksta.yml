- concept: положительная пара skip-gram обозначает наблюдавшееся соседство центрального и контекстного слов
  question: По какому признаку пара слов считается положительным обучающим примером в skip-gram?
  explanation: Положительная пара фиксирует реально наблюдавшееся локальное соседство. Название не связано ни с эмоциональной окраской, ни с синонимией, ни с частотой слов.
  kind: choice
  options:
    - Контекстное слово действительно встретилось в заданном окне вокруг центрального
    - Оба слова имеют положительную эмоциональную окраску
    - Слова обязательно являются синонимами
    - Центральное слово встречается в корпусе чаще контекстного
  correct: 0
