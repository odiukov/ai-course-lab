- concept: знаковая координата слова на единичной семантической оси равна скалярному произведению
  question: Семантическая ось задана единичным вектором g = (0.6, 0.8), а embedding слова равен v = (4, 3). Чему равна знаковая координата v на этой оси?
  explanation: 'Для единичной оси знаковая координата равна v · g: 4 × 0.6 + 3 × 0.8 = 4.8. Знак показывает сторону оси, а модуль — выраженность компоненты вдоль неё.'
  kind: numeric
  answer: 4.8
  tolerance: 0.01
  id: 038-interpretiruemye-osi-2
  fingerprint: 1d52fac2
- concept: удаление смещения выполняется вычитанием проекции вектора на найденную ось
  question: Заполни формулу удаления компоненты embedding вдоль единичной оси ĝ.
  explanation: Выражение (v · ĝ)ĝ — проекция v на единичную ось. После её вычитания остаточный вектор ортогонален этой оси, поэтому измеряемая вдоль неё компонента исчезает.
  kind: cloze
  template: v_neutral = v - ___
  answer: (v · ĝ)ĝ
  accept:
    - (v @ g_hat) * g_hat
    - projection of v onto ĝ
    - proj_ĝ(v)
  id: 038-interpretiruemye-osi-3
  fingerprint: d6b0dc81
