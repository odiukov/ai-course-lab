- concept: внутренняя оценка embeddings не заменяет проверку на целевой downstream-задаче
  question: Word2Vec отлично решает тестовые аналогии, но его добавление не улучшает целевой классификатор. Какой вывод наиболее обоснован?
  explanation: Соседи и аналогии помогают диагностировать структуру пространства, но могут не переноситься на практическую задачу. Поэтому внутренние проверки следует сочетать с оценкой на задаче, ради которой embeddings обучались.
  kind: choice
  options:
    - Модель качественная, потому что аналогии важнее прикладных метрик
    - Модель качественная, если все слова присутствуют в словаре
    - 'Объявлять модель качественной рано: успех внутренних тестов не доказывает практическую пользу'
    - Нужно оценивать только скорость обучения модели
  correct: 2
  id: 041-probe-evaluation-1
  fingerprint: fae202e0
- concept: аномально малые или большие нормы embeddings служат признаком ошибки обучения
  question: При проверке Word2Vec обнаружились почти нулевые векторы и векторы с аномально большой нормой. Как это следует интерпретировать?
  explanation: Почти нулевая норма может означать, что embedding почти не обучился, а чрезмерно большая — что обучение нестабильно или обновления реализованы неверно. Проверка норм выявляет такие вырожденные случаи.
  kind: choice
  options:
    - Как возможный недостаток обучающего сигнала, нестабильность обучения или ошибку обновления весов
    - Как доказательство высокой точности аналогий
    - Как нормальное следствие семантической близости слов
    - Как гарантию хорошего качества на downstream-задаче
  correct: 0
  id: 041-probe-evaluation-2
  fingerprint: 23382d39
- concept: симметрия сходства является диагностическим инвариантом реализации
  question: Заполни проверку симметрии сходства двух слов в модели Gensim.
  explanation: 'Косинусное сходство симметрично: перестановка аргументов не должна менять результат, кроме возможной погрешности вычислений с плавающей точкой. Заметное расхождение указывает на ошибку реализации.'
