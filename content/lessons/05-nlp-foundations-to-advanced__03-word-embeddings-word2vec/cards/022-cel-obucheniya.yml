- concept: ошибочная положительная пара получает более сильный градиентный сигнал
  question: Для какой положительной пары модуль множителя `(pos_score - 1)` в градиенте будет больше?
  explanation: Чем дальше оценка положительной пары от единицы, тем больше модуль `(pos_score - 1)` и тем сильнее исправление. Уже уверенно распознанная пара изменяет веса лишь незначительно.
  kind: choice
  options:
    - Для пары с низким `pos_score`
    - Для пары с высоким `pos_score`
    - Он не зависит от `pos_score`
  correct: 0
  id: 022-cel-obucheniya-1
  fingerprint: a3d30903
- concept: градиентный шаг для негативного контекста уменьшает его скалярное произведение с центральным словом
  question: Заполни множитель в обновлении вектора отрицательного контекста.
  explanation: Оценка негатива положительна, поэтому из его вектора вычитается направленная вдоль `v_c` величина. При фиксированном `v_c` это понижает скалярное произведение и приближает sigmoid-оценку к нулю.
  kind: cloze
  template: W_prime[neg_idx] -= lr * ___ * v_c
  answer: sigmoid(W_prime[neg_idx] @ v_c)
  accept:
    - neg_score
    - sigmoid(u_neg @ v_c)
    - σ(u_neg · v_c)
  id: 022-cel-obucheniya-2
  fingerprint: ac68548d
- concept: статус отрицательной пары является локальной обучающей меткой, а не утверждением о семантической несовместимости слов
  question: Почему слово, выбранное негативом для одной пары Word2Vec, нельзя считать постоянным семантическим антонимом центрального слова?
  explanation: Negative sampling обучает модель различать наблюдавшееся соседство и случайно составленную пару. Такая метка относится к конкретному обучающему сравнению, а не задаёт вечное отношение между словами.
  kind: open
  reference: Негатив означает лишь, что слово было выбрано из шумового распределения и не являлось наблюдавшимся контекстом данного появления центрального слова. В другом фрагменте текста эти слова могут образовать настоящую положительную пару.
  id: 022-cel-obucheniya-3
  fingerprint: ab168dde
