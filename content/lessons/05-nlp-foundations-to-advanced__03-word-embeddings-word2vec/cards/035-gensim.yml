- concept: min_count отсекает токены с недостаточной частотой во всём корпусе
  question: Корпус содержит множество единичных опечаток и случайных идентификаторов. Какое действие параметра min_count помогает не тратить на них память?
  explanation: Порог min_count применяется при построении словаря. Отброшенные токены не получают строк в таблице векторов и не участвуют в обучении.
  kind: choice
  options:
    - Исключение токенов, чья частота ниже заданного порога, из словаря модели
    - Ограничение максимальной длины каждого предложения
    - Удаление контекстных слов, далёких от центрального
    - Сокращение числа координат у редких слов
  correct: 0
