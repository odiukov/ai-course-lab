- concept: досэмплирование сохраняет фиксированное число негативов для каждой положительной пары
  question: Генератор негативов сделал одну случайную выборку, удалил запрещённые слова и сразу вернул оставшиеся. Какой дефект возникает?
  explanation: 'После фильтрации часть выборки может исчезнуть. Поэтому допустимые слова нужно досэмплировать, пока не накопится ровно k_neg: случайными должны быть значения негативов, а не их количество.'
  kind: choice
  options:
    - Фактическое число негативов становится случайным и может быть меньше k_neg
    - Все положительные пары автоматически становятся отрицательными
    - Размерность эмбеддингов начинает зависеть от размера словаря
    - Контекстные слова перестают обновляться
  correct: 0
  id: 020-rovno-k-negativov-1
  fingerprint: 377c4acf
- concept: центральное и настоящее контекстное слово нельзя использовать как негативы своей положительной пары
  question: Заполните условие, которое оставляет только допустимые отрицательные слова.
  explanation: Множество forbidden содержит индексы центрального и настоящего контекстного слова. Если назначить им отрицательную метку, одно обновление будет одновременно сближать и раздвигать ту же положительную пару.
  kind: cloze
  template: negs.extend(n for n in draw if ___)
  answer: n not in forbidden
  accept:
    - n not in forbidden
    - n не входит в forbidden
  id: 020-rovno-k-negativov-2
  fingerprint: 7109d1cf
- concept: перед циклом досэмплирования нужно обработать отсутствие допустимых негативных слов
  question: Объясните, почему цикл «выбирать слова, пока не накопится k_neg допустимых негативов» требует отдельной проверки случая, когда весь словарь запрещён.
  explanation: Досэмплирование гарантирует нужное количество только тогда, когда существует хотя бы один допустимый индекс. Проверка размера словаря относительно forbidden предотвращает бесконечный цикл.
  kind: open
  reference: Если вне множества forbidden нет ни одного слова, получить допустимый негатив невозможно и цикл никогда не завершится. Реализация должна заранее обнаружить этот случай и вернуть пустой результат либо явно сообщить об ошибке.
  id: 020-rovno-k-negativov-3
  fingerprint: 7c77d6dc
