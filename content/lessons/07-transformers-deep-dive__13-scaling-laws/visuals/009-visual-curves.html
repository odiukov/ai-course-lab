<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Loss против compute</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1f2430; --mut:#5b6675; --ax:#55606f; --grid:#e3e8ef;
    --a:#c2410c; --b:#1d4ed8; --c:#047857; --env:#7c3aed;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1117; --fg:#e5e7eb; --mut:#9aa4b2; --ax:#94a3b8; --grid:#242c39;
      --a:#fb923c; --b:#93c5fd; --c:#34d399; --env:#c4b5fd;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  figure{margin:0;padding:8px 10px;background:var(--bg);}
  figcaption{font-size:13px;color:var(--fg);font-weight:600;margin:0 0 4px 2px;}
  svg{display:block;width:100%;height:auto;max-height:430px;background:var(--bg);}
  .note{font-size:11px;color:var(--mut);margin:4px 0 0 2px;}
  #fb{display:none;font-size:13px;color:var(--fg);line-height:1.45;}
  text{font-family:inherit;fill:var(--fg);}
  .tick{fill:var(--mut);}
  .ax{stroke:var(--ax);stroke-width:1.4;fill:none;}
  .head{fill:var(--ax);}
  .grid{stroke:var(--grid);stroke-width:1;}
  .a{stroke:var(--a);} .b{stroke:var(--b);} .c{stroke:var(--c);}
  .a,.b,.c{fill:none;stroke-width:2;}
  .ta{fill:var(--a);} .tb{fill:var(--b);} .tc{fill:var(--c);}
  .env{stroke:var(--env);stroke-width:3.2;fill:none;stroke-dasharray:9 5;}
  .tenv{fill:var(--env);}
  .pt{fill:var(--fg);stroke:var(--bg);stroke-width:1.6;}
</style>
</head>
<body>
<figure>
  <figcaption>Loss против compute: пучок кривых при разных D/N и нижняя огибающая</figcaption>
  <svg id="plot" viewBox="0 32 960 424" role="img"
       aria-label="Кривые loss против compute при D/N = 1.7, 20 и 200 с нижней огибающей"></svg>
  <p id="fb">Схема должна показывать: loss против log10(C) на логарифмических осях, три кривые
     для D/N = 1.7, 20 и 200, их нижнюю огибающую (компьют-оптимальную границу) и точки
     GPT-3 (D/N ≈ 1.7) и Chinchilla (D/N = 20).</p>
  <p class="note">L(N,D) = A/N<sup>α</sup> + B/D<sup>β</sup> + E; A = 406, B = 411, α = 0.34, β = 0.28, E = 1.69; C = 6ND.</p>
</figure>
<script>
(function(){
  var box=document.getElementById('plot');
  try{
    /* ---- данные схемы ---- */
    var A=406,B=411,AL=0.34,BE=0.28,E=1.69;
    var lg=Math.log10;
    var X0=20, X1=26.3;
    var Y0=lg(1.76), Y1=lg(2.78);
    var XT=[20,21,22,23,24,25,26];
    var YT=[1.8,2.0,2.2,2.4,2.6];
    var CURVES=[{r:1.7,k:'a',lab:'D/N = 1.7',off:-12},
                {r:20,k:'b',lab:'D/N = 20',off:2},
                {r:200,k:'c',lab:'D/N = 200',off:17}];
    var PTS=[{t:'GPT-3 (D/N ≈ 1.7)',C:3.15e23,r:1.714,an:'middle',dx:0,dy:-14},
             {t:'Chinchilla (D/N = 20)',C:5.88e23,r:20,an:'end',dx:-10,dy:18}];
    var DXA=0.06, DYA=0.0045, DW=0.03, TK=0.06;

    /* ---- одно начало координат, один масштаб, одна пара sx/sy ---- */
    var O={px:100,py:400,x:X0,y:Y0}, S={x:119,y:-1712};
    function sx(x){return O.px+(x-O.x)*S.x;}
    function sy(y){return O.py+(y-O.y)*S.y;}

    function loss(x,r){var C=Math.pow(10,x),N=Math.sqrt(C/(6*r)),D=r*N;
      return A/Math.pow(N,AL)+B/Math.pow(D,BE)+E;}
    function env(x){var m=Infinity,i,r,v;
      for(i=0;i<=120;i++){r=Math.pow(10,0.5+2.2*i/120);v=loss(x,r);if(v<m)m=v;}
      return m;}
    function path(f){var d='',i,x;
      for(i=0;i<=126;i++){x=X0+(X1-X0)*i/126;
        d+=(i?'L':'M')+sx(x).toFixed(1)+' '+sy(lg(f(x))).toFixed(1);}
      return d;}
    function T(x,y,s,cls,an,dx,dy,fs){
      return '<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" class="'+cls+'" text-anchor="'+an+
             '" dx="'+dx+'" dy="'+dy+'" font-size="'+fs+'">'+s+'</text>';}

    var p=[],i;

    /* сетка */
    for(i=0;i<XT.length;i++)
      p.push('<line class="grid" x1="'+sx(XT[i])+'" y1="'+sy(Y0)+'" x2="'+sx(XT[i])+'" y2="'+sy(Y1)+'"/>');
    for(i=0;i<YT.length;i++)
      p.push('<line class="grid" x1="'+sx(X0)+'" y1="'+sy(lg(YT[i]))+'" x2="'+sx(X1)+'" y2="'+sy(lg(YT[i]))+'"/>');

    /* оси со стрелками */
    p.push('<path class="ax" d="M'+sx(X0)+' '+sy(Y1+DYA)+' L'+sx(X0)+' '+sy(Y0)+' L'+sx(X1+DXA)+' '+sy(Y0)+'"/>');
    p.push('<polygon class="head" points="'+sx(X1+DXA*2)+','+sy(Y0)+' '+sx(X1+DXA)+','+sy(Y0-DYA*0.5)+' '+sx(X1+DXA)+','+sy(Y0+DYA*0.5)+'"/>');
    p.push('<polygon class="head" points="'+sx(X0)+','+sy(Y1+DYA*2)+' '+sx(X0-DW)+','+sy(Y1+DYA)+' '+sx(X0+DW)+','+sy(Y1+DYA)+'"/>');

    /* засечки и подписи осей */
    for(i=0;i<XT.length;i++){
      p.push('<line class="ax" x1="'+sx(XT[i])+'" y1="'+sy(Y0)+'" x2="'+sx(XT[i])+'" y2="'+sy(Y0-DYA)+'"/>');
      p.push(T(sx(XT[i]),sy(Y0),'10<tspan dy="-5" font-size="9">'+XT[i]+'</tspan>','tick','middle',0,20,11));
    }
    for(i=0;i<YT.length;i++){
      p.push('<line class="ax" x1="'+sx(X0)+'" y1="'+sy(lg(YT[i]))+'" x2="'+sx(X0-TK)+'" y2="'+sy(lg(YT[i]))+'"/>');
      p.push(T(sx(X0),sy(lg(YT[i])),YT[i].toFixed(1),'tick','end',-10,4,11));
    }
    p.push(T(sx(X0),sy(Y1),'loss','tick','middle',0,-16,13));
    p.push(T(sx((X0+X1)/2),sy(Y0),'compute C, FLOPs (лог. шкала)','tick','middle',0,40,13));

    /* кривые */
    for(i=0;i<CURVES.length;i++){(function(cv){
      p.push('<path class="'+cv.k+'" d="'+path(function(x){return loss(x,cv.r);})+'"/>');
      p.push(T(sx(X1),sy(lg(loss(X1,cv.r))),cv.lab,'t'+cv.k,'start',10,cv.off,12));
    })(CURVES[i]);}

    /* нижняя огибающая */
    p.push('<path class="env" d="'+path(env)+'"/>');
    p.push('<line class="env" x1="'+sx(20.15)+'" y1="'+sy(lg(1.95))+'" x2="'+sx(20.6)+'" y2="'+sy(lg(1.95))+'"/>');
    p.push(T(sx(20.7),sy(lg(1.95)),'нижняя огибающая пучка','tenv','start',0,4,12));

    /* точки */
    for(i=0;i<PTS.length;i++){var q=PTS[i],qx=lg(q.C),qy=lg(loss(lg(q.C),q.r));
      p.push('<circle class="pt" cx="'+sx(qx)+'" cy="'+sy(qy)+'" r="5"/>');
      p.push(T(sx(qx),sy(qy),q.t,'tick','',q.dx,q.dy,12).replace('text-anchor=""','text-anchor="'+q.an+'"'));
    }

    box.innerHTML=p.join('');
  }catch(err){
    box.style.display='none';
    document.getElementById('fb').style.display='block';
  }
})();
</script>
</body>
</html>
