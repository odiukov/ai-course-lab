- concept: сумма показателей масштабирования модели и данных определяется мультипликативным compute-ограничением
  question: Стоимость обучения задаётся как C = kND. При этом оптимальные размеры масштабируются как N_opt ∝ C^p и D_opt ∝ C^q. Объясни, почему показатели p и q в сумме должны давать показатель первой степени бюджета.
  explanation: 'При перемножении степенных зависимостей показатели складываются: ND ∝ C^(p+q). Compute-ограничение требует ND ∝ C, поэтому сумма показателей не зависит от результатов подгонки и обязана равняться единице.'
  kind: open
  reference: Произведение оптимальных размеров масштабируется как N_opt D_opt ∝ C^(p+q). По ограничению kND = C оно должно быть пропорционально самому бюджету C, то есть его первой степени. Поэтому p + q обязано равняться единице.
  id: 015-exponents-1
  fingerprint: 9069b41e
- concept: показатель роста оптимального размера модели равен β/(α+β)
  question: Для закона L(N,D) = A/N^α + B/D^β + E и ограничения C = kND заданы α = 0.42 и β = 0.18. Чему равен показатель степени бюджета C в зависимости N_opt ∝ C^p?
  explanation: Для оптимального размера модели p = β/(α+β). Подстановка даёт 0.18/(0.42 + 0.18) = 0.30. Показатель для данных определяется второй долей и дополняет его до единицы.
  kind: numeric
  answer: 0.3
  tolerance: 0.005
  id: 015-exponents-2
  fingerprint: 9350355f
- concept: знак разности α и β определяет направление изменения числа токенов на параметр
  question: В законе Хоффмана α = 0.27, а β = 0.21. Как будет меняться оптимальное отношение D_opt/N_opt при увеличении compute-бюджета?
  explanation: Для данных показатель равен α/(α+β), а для модели — β/(α+β). Поэтому D_opt/N_opt масштабируется как C^((α−β)/(α+β)). Здесь разность положительна, значит число токенов на параметр растёт вместе с бюджетом.
  kind: choice
  options:
    - Будет расти
    - Будет уменьшаться
    - Останется постоянным
    - Направление нельзя определить по α и β
  correct: 0
