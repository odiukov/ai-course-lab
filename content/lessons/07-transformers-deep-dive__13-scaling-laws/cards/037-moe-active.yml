- concept: активные параметры MoE определяют FLOPs, а общие параметры — память для весов
  question: У двух MoE-моделей одинаковое число активных параметров на токен, но у второй больше экспертов и больше параметров всего. Объясните, чем будут различаться их вычислительные затраты и требования к памяти.
  explanation: В MoE вычисления выполняет только выбранная маршрутизатором часть сети, но хранить приходится все веса. Поэтому 37 млрд активных параметров описывают основной масштаб FLOPs, а 671 млрд общих — основной масштаб памяти.
  kind: open
  reference: При одинаковом числе активных параметров затраты FLOPs на обработку токена будут близкими. Однако вторая модель потребует больше памяти, поскольку веса всех её экспертов необходимо хранить независимо от того, какие эксперты выбраны для конкретного токена.
  id: 037-moe-active-2
