- concept: при фиксированном compute-бюджете отношение D/N обратно пропорционально квадрату N
  question: Compute-бюджет не меняется, поэтому произведение N·D постоянно. Размер модели заменили с N на N/k, где k больше единицы. Как изменится отношение D/N?
  explanation: При постоянном произведении N·D уменьшение N в k раз увеличивает D в k раз. В отношении D/N одновременно растёт числитель и уменьшается знаменатель, поэтому оно умножается на k·k.
  kind: choice
  options:
    - Умножится на k·k
    - Умножится на k
    - Не изменится
    - Разделится на k
