- concept: распределение авторегрессионной модели между ускорителями добавляет коммуникацию в генерацию каждого токена
  question: Почему разделение слоёв авторегрессионной языковой модели между несколькими ускорителями может увеличить задержку генерации, даже если их суммарная вычислительная мощность велика?
  explanation: 'Авторегрессионная генерация последовательна: прежде чем начать следующий токен, нужно закончить вычисление текущего. У распределённой 70B-модели к вычислениям добавляется обмен данными между картами, тогда как помещающаяся на одной карте 8B-модель избегает этой межкарточной задержки.'
  kind: open
  reference: При каждом прямом проходе части модели должны последовательно обмениваться активациями или синхронизироваться через межсоединение. Следующий токен зависит от завершения текущего прохода, поэтому коммуникационная задержка попадает в критический путь генерации и повторяется для каждого токена.
  id: 027-memory-fit-2
