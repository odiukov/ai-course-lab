- concept: точка безубыточности равна разнице затрат на обучение, делённой на экономию инференса на токен
  question: Обучение модели A потребовало 317 зеттаFLOPs, а её инференс расходует 89 гигаFLOPs на токен. Для модели B эти величины равны 449 зеттаFLOPs и 59 гигаFLOPs на токен. При каком объёме выдачи их суммарные затраты сравняются? Ответьте в триллионах токенов.
  explanation: Если S измерять в триллионах токенов, полные затраты равны 317 + 89S и 449 + 59S зеттаFLOPs. Из равенства этих выражений получаем 30S = 132, поэтому S = 4.4. После этой точки модель B становится дешевле.
  kind: numeric
  answer: 4.4
  tolerance: 0.01
  id: 026-overtraining-tradeoff-1
  fingerprint: c52f64a0
- concept: противоположный порядок начальных затрат и наклонов линейных кривых стоимости создаёт единственную положительную точку безубыточности
  question: Полная стоимость модели задаётся как сумма однократных затрат на обучение и линейно растущих затрат на инференс. Модель A дешевле обучить, но она дороже на каждый выдаваемый токен, чем модель B. Что следует из такой структуры затрат?
  explanation: 'У A ниже начальная стоимость, но выше скорость роста затрат. Разность полных стоимостей является линейной функцией объёма выдачи, поэтому она меняет знак в одной точке: до неё выгоднее A, после неё — B.'
  kind: choice
  options:
    - При малом объёме выдачи дешевле A, а после единственной точки безубыточности дешевле B
    - Модель A остаётся дешевле при любом объёме выдачи
    - Модель B дешевле уже при нулевом объёме выдачи
    - Кривые полной стоимости обязательно пересекаются дважды
