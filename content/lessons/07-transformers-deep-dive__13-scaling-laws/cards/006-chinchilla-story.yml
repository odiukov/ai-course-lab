- concept: меньшая модель может превзойти большую благодаря большему числу обучающих токенов на параметр и одновременно быть дешевле в инференсе
  question: Объясни своими словами, почему при сопоставимых затратах на обучение модель с меньшим числом параметров может оказаться и точнее, и дешевле при использовании.
  explanation: GPT-3 получила около 1.7 токена на параметр, тогда как Chinchilla — около 20. Поэтому модель на 70B параметров обошла модель на 175B, а меньший размер сделал её инференс примерно в 2.5 раза дешевле.
  kind: open
  reference: Если меньшую модель обучить на существенно большем числе токенов на параметр, её ёмкость используется полнее, поэтому она может получить меньшую ошибку, чем более крупная, но недообученная модель. В инференсе меньшее число параметров требует меньше вычислений и памяти на каждый токен.
