- concept: переоценка тех же предсказаний непрерывной метрикой позволяет проверить, создан ли скачок способом оценивания
  question: Точность модели на бенчмарке резко выросла при увеличении масштаба. Как лучше всего проверить, является ли этот скачок артефактом метрики?
  explanation: Разрывная оценка выбрасывает информацию о прогрессе ниже порога. Если exact match скачет, а кросс-энтропия на тех же данных меняется плавно, это свидетельствует, что видимую эмерджентность создал способ оценивания, а не обязательно резкое изменение способности модели.
  kind: choice
  options:
    - Увеличить порог успешного ответа и проверить, станет ли скачок ещё заметнее
    - Переоценить те же предсказания по кросс-энтропии или вероятности правильного ответа и сравнить форму кривой
    - Оставить только результат самой крупной модели
    - Считать любой резкий рост точности доказательством фазового перехода в модели
