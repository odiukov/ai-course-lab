- concept: слагаемые ошибки в законе Хоффмана должны убывать при увеличении соответствующего масштаба
  question: Разработчик ошибочно написал параметрическое слагаемое как A * n_params ** alpha. Как будет вести себя предсказанный loss при росте числа параметров и неизменном числе токенов?
  explanation: 'При положительном α выражение A · N^α растёт вместе с N. В законе Хоффмана используется A / N^α: увеличение модели должно уменьшать это слагаемое loss.'
  kind: choice
  options:
