- concept: уменьшение константы закона масштабирования сдвигает кривую, не меняя её степенной наклон
  question: Новый оптимизатор уменьшил коэффициент A в законе L(C) = E + A·C^(−α), но не изменил α. Объясни, как изменятся кривая loss–compute и прогнозы дальнейшего масштабирования.
  explanation: 'Muon показал примерно двукратный выигрыш по эффективному compute относительно AdamW на тех же данных. Это интерпретируется как уменьшение A при сохранении α ≈ 0.34: меняется абсолютный уровень кривой, но не её форма.'
  kind: open
  reference: 'Кривая целиком сдвинется вниз: при любом бюджете ожидаемый reducible loss станет меньше. Поскольку показатель α сохранился, наклон кривой в логарифмических координатах и темп убывающей отдачи не изменятся; для достижения заданного улучшения всё ещё применима та же степенная зависимость, но от более низкого уровня loss.'
  id: 036-data-quality-2
  fingerprint: '27182706'
