- concept: предобучающий loss не определяет способность модели следовать инструкциям
  question: Две модели имеют одинаковый loss предсказания следующего токена. Одна из них дополнительно прошла SFT и RLHF. Какое различие наиболее ожидаемо?
  explanation: Предобучающий loss измеряет предсказание следующего токена, но не выбор полезного ответа среди правдоподобных продолжений. SFT и RLHF могут заметно улучшить следование инструкциям, диалог и код без изменения размера модели.
  kind: choice
  options:
    - Модель после post-training лучше следует инструкциям и ведёт диалог
    - Модель после post-training обязательно имеет больше параметров
    - Модель после post-training использует меньше FLOPs при каждом прямом проходе
    - Модели обязаны одинаково отвечать на пользовательские запросы
  correct: 0
  id: 038-post-training-1
  fingerprint: fecba546
- concept: для разных модальностей нужны отдельные кривые масштабирования
  question: Почему при обучении мультимодальной модели недостаточно сложить токены изображений и текста в общий объём данных и построить одну кривую loss–compute?
  explanation: Визуальные и текстовые токены можно учитывать в общем объёме данных, но они не взаимозаменяемы по обучающему эффекту. Одна агрегированная кривая скрывает состав датасета и может давать неверные прогнозы.
  kind: open
  reference: 'Токены разных модальностей неодинаково влияют на качество: текст и изображения имеют собственные зависимости loss от данных и compute. Поэтому одинаковое суммарное число токенов при разном составе датасета может давать разные результаты, и масштабирование нужно моделировать отдельно по модальностям.'
  id: 038-post-training-2
  fingerprint: 7f1add48
- concept: синтетические данные создают межпоколенческий цикл улучшения обучающих данных
  question: Расположите этапы цикла, в котором синтетические данные позволяют последующим поколениям моделей получать всё более полезный обучающий материал.
  explanation: Каждое поколение модели может производить материал для следующего. Если полезность синтетических данных растёт, эффект повторных циклов накапливается, поэтому эффективный compute способен увеличиваться быстрее фактически затраченных FLOPs одного запуска.
  kind: order
  items:
    - Обучить исходную модель на доступном корпусе
    - Использовать модель для генерации синтетических обучающих примеров
    - Обучить следующую модель на смеси доступных и улучшенных синтетических данных
    - Использовать более сильную следующую модель для подготовки данных нового поколения
  id: 038-post-training-3
  fingerprint: b011da5e
