- concept: эмерджентной называют способность, измеряемое качество которой резко возрастает после пересечения порога масштаба
  question: Какое наблюдение соответствует утверждению об эмерджентной способности модели?
  explanation: 'Гипотеза эмерджентности описывает пороговый рисунок: ниже некоторого масштаба способность почти не проявляется, а выше него измеряемое качество резко возрастает. При этом общий loss модели может снижаться плавно.'
  kind: choice
  options:
    - Качество способности понемногу растёт при каждом увеличении масштаба
    - Качество долго остаётся около исходного уровня, а после некоторого масштаба резко возрастает
    - Способность появляется только после подключения внешнего инструмента
    - Скорость инференса растёт вместе с числом параметров
  correct: 1
  id: 032-emergence-claim-1
  fingerprint: 7a17ae2f
- concept: гладкая экстраполяция loss сама по себе не указывает порог появления конкретной способности
  question: Почему точный прогноз плавного снижения loss ещё не позволяет надёжно назвать бюджет, при котором модель начнёт успешно выполнять конкретную задачу?
  explanation: Scaling law для loss предсказывает непрерывное изменение общей ошибки. Измеряемая способность при этом может выглядеть пороговой, поэтому одной кривой loss недостаточно, чтобы локализовать её предполагаемое «включение».
  kind: open
  reference: Loss отражает совокупное вероятностное качество модели, а успех в отдельной задаче может оцениваться дискретно и оставаться низким до пересечения некоторого порога. Поэтому на гладкой кривой loss точка резкого роста результата конкретного бенчмарка может быть не видна.
  id: 032-emergence-claim-2
  fingerprint: b10180ad
