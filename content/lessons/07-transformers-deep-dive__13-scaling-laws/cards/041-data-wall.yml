- concept: потолок доступных данных превращает свободный compute-оптимум в граничное решение
  question: Как записать фактически доступный объём данных, если закон масштабирования рекомендует D_unconstrained, а уникальный корпус ограничен величиной D_max?
  explanation: Пока рекомендуемый объём не превышает доступный корпус, действует свободный оптимум. После достижения потолка ограничение становится активным и D фиксируется на D_max. Именно поэтому рекомендацию порядка 190T токенов нельзя буквально выполнить при запасе качественного английского веб-текста порядка 5–10T.
  kind: cloze
  template: D_feasible = ___
  answer: min(D_unconstrained, D_max)
  accept:
    - min(D_max, D_unconstrained)
    - D_max, если D_unconstrained > D_max
  id: 041-data-wall-1
  fingerprint: e5aff3cc
- concept: многоязычные данные расширяют запас уникального обучающего материала за пределами англоязычного веба
  question: Команда исчерпала отфильтрованный англоязычный веб-корпус. Какое действие действительно расширяет запас уникальных данных, а не только увеличивает число обработанных токенов?
  explanation: Дополнительные языки дают новые документы и новую информацию. Повторные эпохи, больший батч и ускорение обучения могут увеличить число обработанных токенов или утилизацию compute, но не создают новый уникальный корпус.
  kind: choice
  options:
    - Обучить модель ещё несколько эпох на том же корпусе
    - Увеличить размер батча без изменения корпуса
    - Добавить курированные тексты на других языках
    - Повысить скорость обработки уже имеющихся примеров
  correct: 2
  id: 041-data-wall-2
  fingerprint: 9a308b6d
