- concept: в законе Хоффмана размеры модели и датасета влияют на разные слагаемые loss
  question: Для loss L(N, D) = A/N^α + B/D^β + E увеличили число параметров N, сохранив объём обучающих данных D неизменным. Как изменятся слагаемые формулы?
  explanation: N входит только в A/N^α, поэтому рост модели уменьшает именно штраф за недостаток параметров. Слагаемое B/D^β определяется объёмом данных, а E постоянно.
  kind: choice
  options:
    - Уменьшится только A/N^α
    - Уменьшится только B/D^β
    - Уменьшатся оба дробных слагаемых
    - Уменьшится только E
  correct: 0
  id: 010-hoffmann-law-1
  fingerprint: ec71b118
- concept: константа E задаёт асимптотический нижний предел loss
  question: Объясни своими словами, к какому значению стремится L(N, D) = A/N^α + B/D^β + E при неограниченном росте и модели, и обучающего датасета — и почему.
  explanation: При N → ∞ и D → ∞ штрафы A/N^α и B/D^β исчезают. Остаётся E ≈ 1.69 — асимптотический предел, который нельзя преодолеть одним лишь увеличением модели и данных.
  kind: open
  reference: 'Loss стремится к E: при росте N и D дробные слагаемые стремятся к нулю, а постоянное слагаемое остаётся. В модели Хоффмана оно представляет неустранимую ошибку.'
  id: 010-hoffmann-law-2
  fingerprint: ecd20a16
