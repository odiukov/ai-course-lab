- concept: compute-ограничение позволяет свести закон Хоффмана к функции одной переменной
  question: Пусть стоимость обучения задаётся ограничением C = κND, где κ — положительная константа. Заполни пропуск после исключения D.
  explanation: Из ограничения следует D = C/(κN). Поэтому информационный вклад преобразуется как B/D^β = B/(C/(κN))^β = B(κN/C)^β. При фиксированном бюджете loss становится функцией только N.
  kind: cloze
  template: L(N) = A/N^α + ___ + E
  answer: B(κN/C)^β
  accept:
    - B*(κ*N/C)^β
    - B / (C/(κN))^β
    - B/(C/(κN))^β
  id: 014-substitute-1
  fingerprint: 124763a4
- concept: после подстановки compute-ограничения модельный и информационный вклады меняются в противоположных направлениях
  question: Бюджет C фиксирован, D = C/(κN), а α и β положительны. Что происходит при увеличении N?
  explanation: Более крупная модель уменьшает модельный штраф A/N^α. Но при фиксированном C рост N сокращает D, поэтому штраф за нехватку данных B/D^β увеличивается. Противодействие этих вкладов создаёт внутренний минимум loss.
  kind: choice
  options:
    - A/N^α уменьшается, а B/D^β увеличивается
    - Оба слагаемых уменьшаются
    - A/N^α увеличивается, а B/D^β уменьшается
    - Оба слагаемых остаются постоянными
  correct: 0
  id: 014-substitute-2
