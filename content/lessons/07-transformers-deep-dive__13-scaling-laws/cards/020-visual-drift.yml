- concept: медленно меняющийся степенной закон может выглядеть постоянным в узком диапазоне бюджетов
  question: Объясните своими словами, почему постоянное число обучающих токенов на параметр может быть приемлемой локальной эвристикой, но плохим универсальным законом масштабирования.
  explanation: Степень C^0.097 меняется медленно, но не равна константе. Поэтому на узком окне правило кажется точным, тогда как на семи порядках бюджета накопленный рост D/N составляет примерно 4.7 раза.
  kind: open
  reference: Если D/N зависит от бюджета как слабая положительная степень, на небольшом диапазоне изменение почти незаметно и отношение выглядит постоянным. На диапазоне в несколько порядков небольшие изменения накапливаются, поэтому одна фиксированная величина уже заметно расходится с compute-оптимальным решением.
