- concept: постоянное D/N на широком диапазоне бюджетов указывает на неверную оптимизацию, если теория предсказывает положительный дрейф
  question: Теория предсказывает, что compute-оптимальное D/N медленно растёт с бюджетом. Однако солвер возвращает совершенно одинаковое D/N для всех проверенных бюджетов. Какое объяснение наиболее вероятно?
  explanation: При положительном показателе зависимости D/N от C оптимум должен смещаться вверх. В материале отношение растёт примерно с 25.7 до 121.9, поэтому ровная колонка означает фиксированное отношение или ошибку в поиске минимума.
  kind: choice
  options:
    - В солвере зафиксировано D/N или фактическая минимизация loss не выполняется
    - Постоянное D/N подтверждает любой закон с положительным показателем степени
    - Логарифмический масштаб автоматически делает вычисленные отношения одинаковыми
    - Рост бюджета обязан менять loss, но никогда не меняет положение его минимума
