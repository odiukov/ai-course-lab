- concept: внутреннюю согласованность scaling law проверяют сопоставлением его следствий с независимой эмпирической оценкой оптимума
  question: Расставьте действия для проверки того, согласуются ли параметры подогнанного scaling law с эмпирической рекомендацией по распределению compute.
  explanation: Параметры закона должны воспроизводить наблюдаемую оптимальную аллокацию. У Hoffmann опубликованные α ≈ 0.34 и β ≈ 0.28 предсказывали дрейф D/N, который противоречил рекомендации ≈20; переподгонка Besiroglu устранила это расхождение.
  kind: order
  items:
    - Взять опубликованные параметры подогнанного закона loss
    - Вывести из них compute-оптимальное распределение между размером модели и объёмом данных
    - Сравнить полученное распределение с минимумами на эмпирических IsoFLOP-разрезах
    - При систематическом расхождении заново подогнать закон к исходным наблюдениям
  id: 023-besiroglu-2
  fingerprint: 00a51903
