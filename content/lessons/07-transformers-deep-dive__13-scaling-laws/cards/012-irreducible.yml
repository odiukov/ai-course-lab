- concept: неустранимый loss отражает условную неопределённость следующего токена
  question: Почему даже идеальная языковая модель может иметь ненулевой ожидаемый loss при предсказании следующего токена?
  explanation: Если один контекст допускает несколько естественных продолжений, даже точная модель не может заранее знать выбор автора. Такая условная неопределённость оставляет положительный loss; в подгонке Hoffmann она представлена слагаемым E ≈ 1.69.
  kind: choice
  options:
    - Контекст не всегда однозначно определяет продолжение, поэтому вероятность приходится распределять между несколькими возможными токенами
    - В больших трансформерах неизбежно перестают вычисляться градиенты
    - После достижения определённого размера модель больше не может читать обучающие данные
    - Вероятности токенов в языковой модели не могут в сумме равняться единице
  correct: 0
  id: 012-irreducible-1
  fingerprint: 086117a1
- concept: значение неустранимого loss зависит от распределения данных и токенизации
  question: Почему значение E, полученное на одном корпусе и токенизаторе, нельзя считать универсальным пределом для любых языковых моделей?
  explanation: Hoffmann и соавторы получили E ≈ 1.69 для своих данных и токенизатора. При смене корпуса или токенизации меняется измеряемая условная энтропия, поэтому численное значение предела не обязано сохраняться.
  kind: open
  reference: E характеризует остаточную неопределённость конкретного распределения текстов при конкретном разбиении текста на токены. Другой корпус меняет вероятности продолжений, а другой токенизатор — сами предсказываемые единицы и loss на токен, поэтому E нужно оценивать заново.
  id: 012-irreducible-2
  fingerprint: 9a69c4ec
