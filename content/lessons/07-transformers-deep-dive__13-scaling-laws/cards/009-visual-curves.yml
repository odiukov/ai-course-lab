- concept: равные интервалы на логарифмической оси соответствуют одинаковым множителям
  question: На графике loss против compute обе оси логарифмические. Что означают равные расстояния между соседними отметками одной оси?
  explanation: 'Логарифмическая шкала кодирует отношения: равный шаг по оси означает умножение значения на один и тот же коэффициент, а не прибавление постоянной величины.'
  kind: choice
  options:
    - Значения отличаются на одну и ту же абсолютную величину
    - Значения отличаются в одно и то же число раз
    - Loss между отметками изменяется с постоянной скоростью
    - Все точки между отметками имеют одинаковую точность
  correct: 1
  id: 009-visual-curves-1
  fingerprint: 2e4486e7
- concept: уплощение кривой loss против compute показывает убывающую отдачу от масштабирования
  question: Кривая loss против compute продолжает снижаться, но по мере роста бюджета становится всё более пологой. Как это интерпретировать?
  explanation: 'Пологая часть кривой означает убывающую отдачу: дополнительный compute всё ещё улучшает loss, но очередной одинаковый множитель бюджета даёт меньший выигрыш.'
  kind: choice
  options:
    - Каждое одинаковое относительное увеличение compute уменьшает loss слабее предыдущего
    - После уплощения дополнительный compute начинает повышать loss
    - Модель перестаёт использовать обучающие данные
    - Compute и loss становятся прямо пропорциональны
  correct: 0
  id: 009-visual-curves-2
  fingerprint: 7e2a0887
