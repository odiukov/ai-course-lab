- concept: предобучающий ориентир по объёму данных не является минимальным порогом полезности файнтюна
  question: Датасет для узкого доменного файнтюна намного меньше объёма, который понадобился бы для compute-оптимального обучения базовой модели с нуля. Какой вывод наиболее обоснован?
  explanation: Ориентир в 20 токенов на параметр относится прежде всего к обучению с нуля. Базовая модель уже усвоила язык и общие знания, поэтому 10 миллионов токенов могут заметно изменить её поведение, хотя этого недостаточно для повторного обучения возможностей модели.
  kind: choice
  options:
    - Файнтюн бесполезен, пока датасет не достигнет предобучающего отношения токенов к параметрам
    - Файнтюн может адаптировать стиль, формат и терминологию, но от него не стоит ждать переобучения общих знаний и появления принципиально новых способностей
    - Недостаток данных автоматически компенсируется выбором более крупной базовой модели
    - Достаточно многократно повторить тот же датасет, чтобы он стал эквивалентен предобучающему корпусу
  correct: 1
  id: 040-finetune-data-1
  fingerprint: 5854304d
- concept: плато loss при повторных проходах может указывать на ограничение объёмом уникальных данных
  question: Loss на небольшом очищенном датасете сначала снижается, а дополнительные проходы по тем же примерам перестают давать улучшение. Как это объяснить с точки зрения законов масштабирования и что следует изменить?
  explanation: В законе loss слагаемое B/D^β уменьшается при росте объёма данных. Повторные эпохи над теми же 10 миллионами токенов не равны получению новых независимых данных, поэтому после первоначальной адаптации кривая может перестать улучшаться.
  kind: open
  reference: 'Модель вошла в режим, ограниченный данными: вклад B/D^β остаётся большим, а повторение тех же примеров почти не увеличивает объём новой информации. Следует добавить разнообразные качественные данные, сузить задачу или принять достигнутое плато, а не рассчитывать, что одни дополнительные эпохи его устранят.'
  id: 040-finetune-data-2
  fingerprint: 36ca45ba
