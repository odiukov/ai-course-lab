- concept: при фиксированном отношении токенов к параметрам размеры модели и датасета растут как квадратный корень из compute-бюджета
  question: Отношение обучающих токенов к параметрам зафиксировано. Compute-бюджет увеличили в 49 раз. Как изменятся оптимально подобранные количества параметров и токенов?
  explanation: При фиксированном r выполняется C = 6rN², поэтому N пропорционально √C. Увеличение бюджета в 49 раз увеличивает N в 7 раз. Поскольку D = rN, число токенов также увеличивается в 7 раз.
  kind: choice
  options:
    - Обе величины увеличатся в 49 раз
    - Обе величины увеличатся в 7 раз
    - Параметры увеличатся в 7 раз, а токены — в 49 раз
    - Обе величины увеличатся в √7 раза
