  template: |-
    def tokens_for_budget(compute, ratio):
        params = ___
        tokens = ratio * params
        return params, tokens
  answer: math.sqrt(compute / (FLOPS_PER_PARAM_TOKEN * ratio))
  accept:
    - (compute / (FLOPS_PER_PARAM_TOKEN * ratio)) ** 0.5
