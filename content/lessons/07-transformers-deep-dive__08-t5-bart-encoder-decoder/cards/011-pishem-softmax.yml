- concept: softmax сохраняет форму входного тензора и нормализует каждую выбранную строку до единичной суммы
  question: К матрице логитов формы (6, 8) применили softmax по последней оси. Какой результат должен получиться?
  explanation: Softmax не удаляет оси и нормализует каждый срез вдоль указанной оси. Поэтому форма остаётся (6, 8), а шесть строк образуют шесть независимых распределений.
  kind: choice
  options:
    - Матрица формы (6, 8), сумма элементов каждой строки равна единице
    - Вектор формы (6,), сумма всех его элементов равна единице
    - Матрица формы (6, 8), сумма всех элементов матрицы равна единице
    - Вектор формы (8,), каждый элемент равен сумме соответствующего столбца
