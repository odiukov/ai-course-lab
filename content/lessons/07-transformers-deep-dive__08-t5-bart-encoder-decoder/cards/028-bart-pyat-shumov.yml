- concept: text infilling требует самостоятельно определить длину скрытого спана
  question: Объясните своими словами, почему text infilling ближе к генерации и сложнее обычного маскирования токенов.
  explanation: 'Ключевое отличие заключается в неопределённой длине пропуска: метка text infilling не сообщает декодеру, сколько токенов находилось в скрытом спане.'
  kind: open
  reference: При обычном маскировании каждая метка обозначает конкретную позицию скрытого токена. В text infilling единая метка может заменять спан переменной длины, поэтому модель должна восстановить не только содержимое, но и определить, сколько токенов нужно сгенерировать.
