- concept: перестановка предложений и поворот документа по-разному искажают глобальный порядок текста
  question: Какое утверждение правильно различает перестановку предложений и поворот документа в предобучении BART?
  explanation: Перестановка предложений нарушает их исходную последовательность. Поворот документа сохраняет циклический порядок фрагментов, но выбирает ложную точку начала, заставляя модель восстановить настоящую.
  kind: choice
  options:
    - Перестановка меняет порядок предложений, а поворот переносит начало документа в произвольную позицию с циклическим продолжением
    - Перестановка удаляет границы предложений, а поворот маскирует начало документа
    - Перестановка меняет порядок токенов внутри каждого предложения, а поворот разворачивает токены задом наперёд
    - Обе функции выполняют одинаковое преобразование, но используют разные служебные токены
