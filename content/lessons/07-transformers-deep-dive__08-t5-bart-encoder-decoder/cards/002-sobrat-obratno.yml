- concept: обучение декодера предсказанию следующего выходного токена условлено на представление источника
  question: Что остаётся прежним по сравнению с обучением GPT и что добавляется при обучении encoder-decoder на паре «исходный текст — целевой текст»?
  explanation: 'Механика авторегрессивного обучения не меняется: декодер получает предыдущие целевые токены и предсказывает следующий. Отличие от GPT состоит в дополнительном условии — выходе энкодера, доступном декодеру через cross-attention.'
  kind: open
  reference: Целевую последовательность по-прежнему сдвигают и обучают декодер предсказывать следующий токен с помощью кросс-энтропийного лосса. Дополнительно каждое предсказание условлено на скрытые состояния, построенные энкодером по исходному тексту.
  id: 002-sobrat-obratno-2
