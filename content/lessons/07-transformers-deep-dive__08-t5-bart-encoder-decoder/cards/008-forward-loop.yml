- concept: порядок подслоёв декодерного блока encoder-decoder Transformer
  question: Расположите операции декодерного блока в порядке прямого прохода.
  explanation: Сначала декодер обрабатывает доступный целевой префикс с причинной маской, затем извлекает информацию из представлений энкодера и после этого пропускает результат через FFN.
  kind: order
  items:
    - Masked self-attention по уже доступным целевым токенам
    - Cross-attention к представлениям источника
    - Feed-forward network (FFN)
  id: 008-forward-loop-1
  fingerprint: 5296625c
- concept: форма выходного тензора энкодера сохраняет отдельное представление каждого исходного токена
  question: Энкодер получил последовательность длины N_src и использует скрытую размерность d_model. Какова форма его выхода, передаваемого в cross-attention декодера?
  explanation: Энкодер создаёт вектор размерности d_model для каждой из N_src позиций источника, поэтому выход имеет форму (N_src, d_model). Cross-attention позволяет декодеру обращаться ко всем этим позиционным представлениям.
  kind: choice
  options:
    - (N_src, d_model)
    - (d_model, d_model)
    - (N_src, N_src)
    - (d_model,)
  correct: 0
  id: 008-forward-loop-2
  fingerprint: 5b8b4e34
