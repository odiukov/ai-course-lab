- concept: смысл текстовой инструкции усваивается при обучении, а не обрабатывается встроенным переключателем задач
  question: Почему произвольная фраза, похожая на название задачи, не обязательно заставит instruction-tuned модель надёжно выполнить эту задачу?
  explanation: У модели нет встроенной таблицы команд, автоматически придающей любому префиксу нужное поведение. Надёжность инструкции зависит от того, насколько её смысл и соответствующая задача представлены в обучении.
  kind: open
  reference: Текст инструкции не является специальной командой API и не разбирается жёстко заданным диспетчером. Модель реагирует на него благодаря закономерностям, усвоенным на обучающих парах «инструкция и данные → требуемый результат», поэтому незнакомая или неоднозначная формулировка может сработать хуже.
