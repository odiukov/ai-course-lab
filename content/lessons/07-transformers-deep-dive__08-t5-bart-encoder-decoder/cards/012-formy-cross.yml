- concept: результат cross-attention сохраняет число целевых позиций, а размерность источника сворачивается при умножении весов на значения
  question: Объясни, почему выход cross-attention имеет N_tgt строк, хотя каждая целевая позиция обращается ко всем N_src состояниям энкодера.
  explanation: Cross-attention агрегирует все исходные значения отдельно для каждого запроса декодера. Длина источника определяет число слагаемых во взвешенной сумме, но не число строк результата.
  kind: open
  reference: 'Матрица весов имеет форму (N_tgt, N_src), а матрица значений — (N_src, d_v). При их умножении размерность N_src сворачивается, поэтому получается тензор формы (N_tgt, d_v): по одному взвешенному вектору контекста для каждой целевой позиции.'
  id: 012-formy-cross-2
