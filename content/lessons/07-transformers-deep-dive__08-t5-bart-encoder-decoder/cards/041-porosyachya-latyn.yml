- concept: качество на невиданных словах отличает усвоение правила от запоминания примеров
  question: Модель перевода в поросячью латынь хорошо работает на словах из обучающего корпуса, но часто ошибается на ранее не встречавшихся словах. Что это говорит о модели и почему общего BLEU недостаточно?
  explanation: Поросячья латынь задаётся строгим правилом, которое должно переноситься на новые слова. Высокий результат только на знакомых примерах свидетельствует скорее о запоминании, чем о систематическом обобщении.
  kind: open
  reference: Вероятнее всего, модель запомнила значительную часть обучающих соответствий, но не усвоила общее правило преобразования. Общий BLEU смешивает результаты на знакомых и новых словах, поэтому следует оценивать эти группы отдельно.
  id: 041-porosyachya-latyn-2
