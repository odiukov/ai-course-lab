- concept: распространение decoder-only связано с универсальностью instruction tuning, простотой масштабирования и совместимостью с RLHF
  question: Почему decoder-only модели стали применяться и в задачах, которые раньше часто решали архитектурами encoder-decoder? Объясни своими словами.
  explanation: Сдвиг вызван не доказанным превосходством decoder-only во всех задачах, а сочетанием универсальности, удобства масштабирования одной архитектуры и подходящего процесса дообучения с человеческой обратной связью.
  kind: open
  reference: Instruction-tuned decoder-only модели могут осваивать разные задачи через промпты; единую архитектуру проще масштабировать и обслуживать; обучение с человеческой обратной связью естественно строится вокруг авторегрессивного декодера.
  id: 036-tablica-vybora-3
  fingerprint: c02382d7
