- concept: различие модальностей входа и выхода благоприятствует архитектуре encoder-decoder
  question: Система получает последовательность акустических признаков и должна сгенерировать текстовую расшифровку. Какой архитектурный выбор лучше всего обоснован устройством задачи?
  explanation: При переходе от аудиопризнаков к тексту вход и выход принадлежат разным модальностям. Отдельный энкодер подготавливает представление аудио, а декодер авторегрессивно строит расшифровку; так устроен Whisper.
  kind: choice
  options:
    - 'Encoder-decoder: энкодер преобразует аудиопризнаки в контекстные представления, по которым декодер генерирует текст'
    - 'Decoder-only: любая задача с генерацией текста обязательно требует только декодера'
    - 'Encoder-only: всю расшифровку можно независимо предсказать за один параллельный проход'
    - Архитектуру следует выбирать исключительно по ожидаемой длине расшифровки
  correct: 0
  id: 036-tablica-vybora-1
  fingerprint: be63d1c3
- concept: единая растущая последовательность контекста и ответа естественно моделируется decoder-only
  question: Чат-агент получает историю диалога, дописывает к ней очередной ответ, а затем использует расширившуюся историю для следующей реплики. Какая архитектура здесь наиболее естественна?
  explanation: В обычном чате контекст и продолжение находятся в одной последовательности токенов. Отдельный неизменный источник отсутствует, поэтому decoder-only не требует искусственно разделять диалог на вход энкодера и выход декодера.
  kind: choice
  options:
    - Decoder-only, потому что история и новый ответ образуют одну авторегрессивно растущую последовательность
    - Encoder-decoder, потому что каждую предыдущую реплику необходимо кодировать отдельным энкодером
    - Encoder-only, потому что ответ не требуется генерировать последовательно
    - Выбор архитектуры определяется только числом участников диалога
  correct: 0
