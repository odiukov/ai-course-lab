- concept: в cross-attention запросы строятся из состояний декодера, а ключи и значения — из выходов энкодера
  question: Откуда берутся Q, K и V в слое cross-attention encoder-decoder Transformer?
  explanation: Декодер формирует запрос Q в соответствии со своим текущим состоянием. Этот запрос сопоставляется с ключами K выходных представлений энкодера, после чего взвешенная смесь соответствующих значений V передаёт декодеру информацию об исходной последовательности.
  kind: choice
  options:
    - Q — из состояний декодера, K и V — из выходов энкодера
    - Q и K — из выходов энкодера, V — из состояний декодера
    - Q, K и V — только из состояний декодера
    - Q, K и V — только из выходов энкодера
  correct: 0
  id: 009-cross-attention-ideya-1
  fingerprint: b9989b3f
- concept: cross-attention получает контекст источника через веса сходства запросов декодера с ключами энкодера
  question: Расположите операции cross-attention в правильном порядке.
  explanation: Сначала формируются Q, K и V из соответствующих источников. Затем сходство Q с K превращается в нормализованные веса, которыми смешиваются V. Полученный контекст сообщает декодеру, какие части входа важны для текущего выходного состояния.
  kind: order
  items:
    - Построить запросы из состояний декодера, а ключи и значения — из выходов энкодера
    - Вычислить оценки сходства запросов с ключами
    - Нормализовать оценки в веса внимания
    - Получить контекст как взвешенную сумму значений
  id: 009-cross-attention-ideya-2
  fingerprint: f4addaeb
