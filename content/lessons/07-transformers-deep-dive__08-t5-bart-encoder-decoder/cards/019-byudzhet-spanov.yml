- concept: для коротких последовательностей нужен ненулевой минимум числа маскируемых токенов и спанов
  question: Для очень короткой последовательности округление расчётного бюджета маскирования может дать пустое повреждение. Зачем вводить положительную нижнюю границу для n_mask и n_spans?
  explanation: Если после округления не замаскировано ничего, целевая последовательность не содержит восстанавливаемого фрагмента и пример не даёт полезного обучающего сигнала. Ненулевой минимум предотвращает такие пустые примеры.
  kind: choice
  options:
    - Чтобы все спаны имели одинаковую длину
    - Чтобы в каждом обучающем примере было что восстанавливать декодеру
    - Чтобы декодер всегда выдавал столько же токенов, сколько получил энкодер
    - Чтобы полностью скрыть исходную последовательность
