- concept: восстановление повёрнутого документа требует находить исходную границу по глобальной связности текста
  question: Почему для восстановления текста после document rotation недостаточно проверить наличие всех исходных токенов? Объясни, что должна определить модель.
  explanation: 'Поворот не удаляет информацию о токенах, но скрывает исходную точку начала. Её приходится выводить из структуры всего документа: связности предложений, ссылок на ранее введённые сущности и естественности переходов.'
  kind: open
  reference: 'Все токены уже присутствуют, поэтому задача не сводится к заполнению пропуска. Модель должна по синтаксической и дискурсивной связности найти место циклического разреза: определить, какой фрагмент является настоящим началом, а какой — окончанием документа.'
