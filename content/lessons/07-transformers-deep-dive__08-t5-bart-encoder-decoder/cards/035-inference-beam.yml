- concept: beam search особенно уместен при узком распределении допустимых выходов
  question: Для какой задачи beam search обычно подходит лучше всего?
  explanation: 'В переводе и суммаризации распределение выхода сравнительно узкое: хороших последовательностей немного, поэтому beam search может удержать их среди нескольких кандидатов. В открытом чате он склонен выбирать наиболее усреднённое и скучное продолжение.'
  kind: choice
  options:
    - Свободный диалог, где допустимо множество разнообразных продолжений
    - Перевод предложения, где число качественных вариантов относительно невелико
    - Генерация случайных реплик с максимальным разнообразием
  correct: 1
  id: 035-inference-beam-1
  fingerprint: 9a87c5ec
- concept: beam search расширяет несколько гипотез и отбирает лучшие по оценке всей частичной последовательности
  question: Расположите действия одного цикла beam search в правильном порядке.
  explanation: Beam search сначала расширяет текущие варианты, затем сравнивает оценки новых последовательностей, отбрасывает менее перспективные и продолжает генерацию из оставшихся. В отличие от greedy-декодирования, ранний выбор не сводится сразу к единственной гипотезе.
  kind: order
  items:
    - Продолжить каждую сохранённую гипотезу возможными следующими токенами
    - Вычислить оценки получившихся частичных последовательностей
    - Оставить лучшие гипотезы в пределах ширины луча
    - Использовать отобранные гипотезы на следующем шаге генерации
  id: 035-inference-beam-2
  fingerprint: f926b8ce
