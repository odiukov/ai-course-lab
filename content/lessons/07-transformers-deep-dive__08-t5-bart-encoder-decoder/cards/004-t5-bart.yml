- concept: T5 унифицирует разные NLP-задачи как преобразование текста в текст
  question: Как подход Text-to-Text Transfer Transformer позволяет обучать одну модель переводу, классификации тональности и извлечению ответа без отдельных выходных голов?
  explanation: 'В T5 и инструкция, и результат представлены текстом: например, класс задаётся словом, а извлечённый ответ — самим фрагментом. Поэтому разные задачи используют одну архитектуру, один словарь и один токенный лосс.'
  kind: choice
  options:
    - Представляет условие задачи и её результат текстом, используя общий словарь и общий языковой лосс
    - Назначает каждой задаче отдельный декодер, сохраняя только общий энкодер
    - Преобразует результаты всех задач в непрерывные векторы фиксированной длины
    - Обучает отдельную функцию потерь для каждого формата ответа
  correct: 0
  id: 004-t5-bart-1
  fingerprint: 8d5bc7b0
- concept: BART предобучается как шумоподавляющий автоэнкодер с восстановлением полного исходного текста
  question: Объясни своими словами, как для предобучения BART получают вход и правильный ответ без ручной разметки.
  explanation: 'BART создаёт обучающую пару из одного неразмеченного текста: испорченная версия становится входом, а оригинал — целевой последовательностью. В отличие от предобучения T5 со скрытыми спанами, декодер BART воспроизводит весь исходный текст.'
  kind: open
  reference: Берут исходный текст и автоматически искажают его, например маскируют или удаляют фрагменты, меняют порядок предложений либо циклически сдвигают токены. Искажённый текст подают энкодеру, а декодер обучают восстановлению полного исходного текста. Сам оригинал служит правильным ответом, поэтому ручная разметка не требуется.
  id: 004-t5-bart-2
  fingerprint: 58a9c67a
