- concept: конец реплики определяется по непрерывной тишине, поэтому возобновление речи сбрасывает её накопленную длительность
  question: Что должен сделать алгоритм end-pointing со счётчиком тишины, если до достижения порога VAD снова обнаружил речь? Объясните почему.
  explanation: Hangover измеряет именно непрерывный период отсутствия речи. Любой новый речевой кадр означает, что пользователь продолжил реплику, поэтому ранее накопленная тишина больше не относится к возможному окончанию turn.
  kind: open
  reference: Счётчик нужно сбросить и начинать накопление заново после следующего исчезновения речи. Иначе несколько отдельных пауз внутри одной реплики могут ошибочно сложиться и вызвать преждевременное объявление её конца.
  id: 017-hangover-2
