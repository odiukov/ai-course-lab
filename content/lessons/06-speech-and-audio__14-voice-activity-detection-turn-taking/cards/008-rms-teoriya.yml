- concept: RMS масштабируется пропорционально модулю коэффициента усиления
  question: RMS аудиочанка равен 0,06. Все отсчёты умножили на коэффициент 3 без клиппинга. Каким станет RMS?
  explanation: Для любого коэффициента k выполняется RMS(kx) = |k| · RMS(x). Поэтому после трёхкратного усиления RMS станет 3 · 0,06 = 0,18.
  kind: numeric
  answer: 0.18
  tolerance: 0.002
  id: 008-rms-teoriya-1
  fingerprint: 88d7c1c3
- concept: квадратный корень возвращает RMS в единицы и масштаб исходной амплитуды
  question: Зачем при вычислении RMS извлекают корень из среднего квадратов отсчётов?
  explanation: 'После возведения отсчётов в квадрат их единицы и масштаб тоже становятся квадратными: амплитуде около 0.1 соответствует средний квадрат около 0.01. Корень возвращает результат к исходному масштабу амплитуды.'
  kind: choice
  options:
    - Чтобы сохранить знак среднего отсчёта
    - Чтобы вернуть результат в единицы и масштаб исходных отсчётов
    - Чтобы автоматически перевести амплитуду в децибелы
    - Чтобы устранить влияние самых больших отсчётов
  correct: 1
  id: 008-rms-teoriya-2
  fingerprint: a544a6b7
