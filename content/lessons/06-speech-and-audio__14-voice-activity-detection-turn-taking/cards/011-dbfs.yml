- concept: dBFS измеряет уровень относительно максимальной амплитуды цифровой шкалы
  question: Для нормированного аудио RMS не превышает полную шкалу. Почему соответствующий уровень в dBFS не бывает положительным?
  explanation: 'dBFS — относительная шкала: её верхняя точка соответствует полной цифровой шкале. Поэтому сигналы ниже этой опоры получают отрицательные уровни.'
  kind: open
  reference: Полная шкала служит опорным уровнем dBFS. RMS, равный этой опоре, даёт нейтральный уровень, а меньший RMS — отрицательный, поскольку логарифм отношения к опоре становится отрицательным.
