- concept: pre-roll восстанавливает начало речи, записанное до подтверждения голосовой активности
  question: VAD подтверждает начало речи с задержкой, из-за чего распознавание теряет первый слог. Как сохранить этот слог, не повышая чувствительность детектора?
  explanation: VAD принимает решение уже после фактического начала фразы. Pre-roll хранит предшествующие 300–500 мс и добавляет их перед аудио, полученным после срабатывания, поэтому тихое начало не теряется.
  kind: choice
  options:
    - Увеличить минимальную длительность речи
    - Увеличить задержку определения конца реплики
    - Постоянно хранить недавнее аудио и при срабатывании VAD отправлять его перед текущими кадрами
    - Начинать запись только после нескольких дополнительных речевых кадров
  correct: 2
  id: 018-preroll-ponyatie-1
  fingerprint: b68672f7
- concept: pre-roll не откладывает момент срабатывания, поскольку заполняется до обнаружения речи
  question: Почему pre-roll сам по себе не добавляет ожидания перед началом обработки реплики?
  explanation: 'Pre-roll хранит прошлое аудио, а не создаёт дополнительное окно ожидания. Его основная цена — небольшой расход памяти: например, 300–500 мс моноаудио занимают лишь десятки килобайт.'
  kind: open
  reference: Буфер заполняется непрерывно ещё до срабатывания VAD. Когда речь подтверждена, уже записанные кадры можно сразу передать распознавателю вместе с текущим аудио; ждать накопления pre-roll после срабатывания не требуется.
  id: 018-preroll-ponyatie-2
  fingerprint: e8c2a7b3
