- concept: задержка после flush равна длине необработанного аудиобуфера, делённой на множитель скорости STT
  question: После flush потоковой STT осталось обработать 720 мс аудио. Модель обрабатывает его в 6 раз быстрее реального времени. Через сколько миллисекунд будет готов транскрипт?
  explanation: 'Задержка вычисляется как длина буфера, делённая на множитель скорости: 720 / 6 = 120 мс. Аналогично, буфер 500 мс при скорости 4× обрабатывается за 125 мс.'
  kind: numeric
  answer: 120
  tolerance: 0.25
  id: 030-flush-latency-1
  fingerprint: c7a66be8
- concept: множитель скорости STT должен быть положительным
  question: При каком условии функция оценки задержки после flush должна отклонить вход, а не выполнять деление?
  explanation: 'Нулевой множитель приводит к делению на ноль, а отрицательный не имеет физического смысла для скорости обработки. Поэтому при speed_multiplier <= 0 функция должна сообщать об ошибке. Положительный множитель меньше 1 допустим: он означает, что модель обрабатывает аудио медленнее реального времени.'
  kind: choice
  options:
    - Если аудиобуфер короче секунды
    - Если модель работает ровно в реальном времени
    - Если множитель скорости неположителен
    - Если результат деления получается дробным
  correct: 2
