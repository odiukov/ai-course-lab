- concept: объём памяти кольцевого аудиобуфера определяется его ёмкостью, а не длительностью сессии
  question: Монофонический поток имеет частоту дискретизации 24 кГц и формат float32. Кольцевая очередь хранит 40 чанков длительностью 15 мс каждый. Сколько байт занимает аудио в полностью заполненной очереди?
  explanation: В чанке 24000 × 15 / 1000 = 360 отсчётов. Один отсчёт float32 занимает 4 байта, поэтому чанк занимает 1440 байт, а 40 чанков — 57600 байт. После заполнения новые данные вытесняют старые, так что память дальше не растёт.
  kind: numeric
  answer: 57600
  tolerance: 1
  id: 026-kolcevoy-bufer-2
