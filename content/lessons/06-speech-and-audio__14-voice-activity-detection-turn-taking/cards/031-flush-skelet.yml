- concept: flush после конца реплики выполняется между отправкой остатка аудио и ожиданием финального транскрипта
  question: Система определения конца реплики обнаружила завершение речи, а последние аудиоданные ещё находятся в локальном буфере. Расположите действия для принудительной финализации транскрипта в правильном порядке.
  explanation: Сначала STT должен получить всё накопленное аудио, затем flush сообщает об окончании ввода, и только после этого клиент ждёт финальный результат. В реализации курса ожидание ограничено 150 мс.
  kind: order
  items:
    - Отправить накопленный остаток аудио в STT
    - Отправить STT команду flush
    - Ожидать финальный транскрипт с ограниченным таймаутом
  id: 031-flush-skelet-1
  fingerprint: 93022c59
- concept: flush требует явной поддержки со стороны STT и не может принудительно запустить блочную модель
  question: Почему команда flush не позволяет немедленно получить результат от потоковой обёртки над блочным Whisper?
  explanation: Блочный распознаватель ждёт заполнения своего фиксированного чанка. Если его протокол не поддерживает flush, внешняя команда не заставит модель обработать неполный блок. Kyutai, Deepgram и AssemblyAI такую финализацию поддерживают, а потоковый Whisper — нет.
  kind: choice
  options:
    - Whisper возвращает только промежуточные гипотезы и принципиально не создаёт финальные
    - Модель запускается после накопления фиксированного чанка и не поддерживает команду досрочной финализации
    - Whisper принимает аудио только после закрытия сетевого соединения
  correct: 1
  id: 031-flush-skelet-2
  fingerprint: 628a3806
- concept: отсутствие поддержки flush маскируется под пустую пользовательскую реплику
  question: Почему неподдерживаемый STT-вызов flush может быть ошибочно принят системой за настоящее молчание пользователя?
  explanation: При отсутствии поддержки flush распознаватель не финализирует накопленное аудио. Функция ждёт все предусмотренные 150 мс и возвращает пустоту, поэтому один только пустой транскрипт не позволяет отличить молчание от несовместимого STT.
  kind: open
  reference: STT игнорирует неподдерживаемую команду и продолжает ждать данные для обработки. Клиент достигает таймаута и получает пустой результат без обязательной ошибки или исключения, поэтому внешне сбой совместимости выглядит так же, как отсутствие речи.
  id: 031-flush-skelet-3
  fingerprint: 98a393b9
