- concept: оценка семантической завершённости управляет адаптивной задержкой ответа
  question: Объясни своими словами, как вероятность завершённости реплики должна влиять на время ожидания перед ответом голосового бота.
  explanation: 'Фиксированный порог тишины одинаково обрабатывает разные по смыслу паузы. Семантическая оценка позволяет сделать задержку плавающей: сокращать её после законченной мысли и увеличивать после незавершённой.'
  kind: open
  reference: Если реплика с высокой вероятностью завершена, бот должен отвечать быстрее. Если контекст указывает на паузу внутри незаконченной фразы, бот должен ждать дольше, чтобы не перебить пользователя.
