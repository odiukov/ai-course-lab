- concept: начало реплики подтверждается только непрерывной последовательностью речевых чанков
  question: В состоянии idle детектор получает несколько коротких речевых всплесков, разделённых тихими чанками. Суммарная длительность всплесков превышает min_speech_ms, но ни один непрерывный речевой отрезок не достигает порога. Что должен сделать автомат?
  explanation: В idle счётчик speech_ms измеряет непрерывную речь, а не сумму всех речевых шумов за сессию. Поэтому тихий чанк сбрасывает его, и разрозненные покашливания не складываются в ложный START.
  kind: choice
  options:
    - Остаться в idle, сбрасывая speech_ms при каждом тихом чанке
    - Выдать START, поскольку суммарная длительность речи превысила порог
    - Перейти в speaking после последнего речевого всплеска, но не выдавать START
  correct: 0
  id: 023-avtomat-1
  fingerprint: f0fe5bad
- concept: START является событием перехода состояния, а не признаком каждого речевого чанка
  question: Автомат уже находится в состоянии speaking и продолжает получать речевые чанки. Как он должен обрабатывать событие START?
  explanation: START обозначает границу перехода из idle в speaking. Пока состояние остаётся speaking, новые речевые чанки лишь подтверждают продолжение текущей реплики и не создают новых событий START.
  kind: choice
  options:
    - Выдавать START для каждого речевого чанка
    - Не выдавать START повторно до нового перехода из idle в speaking
    - Выдать START ещё раз после накопления min_speech_ms внутри speaking
  correct: 1
  id: 023-avtomat-2
  fingerprint: 15181b19
