- concept: выбор VAD для продукта учитывает качество, задержку и лицензионные ограничения
  question: Объясни, почему VAD с наибольшим TPR при фиксированном FPR не всегда является лучшим выбором для продакшен-системы.
  explanation: 'TPR описывает только одну сторону выбора. Таблица VAD объединяет независимые критерии: качество при заданном FPR, задержку и лицензию. Итоговый выбор — это инженерный компромисс с учётом требований продукта.'
  kind: open
  reference: Помимо качества обнаружения речи, необходимо учитывать вычислительную и алгоритмическую задержку, стоимость, условия лицензии и допустимость развёртывания в конкретном продукте. Более точная коммерческая модель может не подходить по бюджету или юридическим ограничениям, тогда как немного менее точная открытая модель окажется практичнее.
