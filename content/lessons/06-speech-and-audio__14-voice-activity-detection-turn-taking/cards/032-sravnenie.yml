- concept: задержка первого решения VAD включает накопление аудиокадра и время инференса
  question: VAD начинает обработку только после накопления кадра длительностью 24 мс, а инференс занимает ещё 2 мс. Заполни формулу минимального времени от начала кадра до готового решения.
  explanation: Время вычисления и длительность входного окна — разные компоненты задержки. Даже почти бесплатный инференс не позволяет вынести решение до того, как накоплен необходимый аудиокадр.
