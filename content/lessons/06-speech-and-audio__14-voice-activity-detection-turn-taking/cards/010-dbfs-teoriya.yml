- concept: отношение амплитуд преобразуется логарифмом в разность уровней dBFS
  question: RMS сигнала уменьшился в 5 раз. На сколько децибел изменился его уровень dBFS? Укажите изменение со знаком.
  explanation: Изменение равно 20·log10(1/5) ≈ −13.98 дБ. Поэтому умножение RMS на постоянный коэффициент превращается в прибавление постоянной величины на шкале dBFS.
  kind: numeric
  answer: -13.98
  tolerance: 0.03
  id: 010-dbfs-teoriya-2
  fingerprint: 9750d52e
- concept: положняя нижняя граница аргумента логарифма предотвращает ошибку и задаёт конечный уровень для нулевого сигнала
  question: Пусть eps — малая положительная константа. Заполните строку, которая готовит RMS к безопасному вычислению логарифма.
  explanation: Логарифм нуля не определён, поэтому аргумент ограничивают снизу положительным eps. Нулевой RMS тогда получает конечный минимальный уровень; в коде урока eps = 1e-10, что соответствует −200 dBFS.
  kind: cloze
  template: safe_rms = ___
  answer: max(rms, eps)
  accept:
    - max(eps, rms)
