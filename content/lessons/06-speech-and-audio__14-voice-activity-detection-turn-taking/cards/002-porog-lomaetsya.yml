- concept: изменение энергетического порога создаёт компромисс между ложным обнаружением шума и пропуском тихой речи
  question: Классификатор считает кадр речью, если его энергия выше заданного порога. Объясни, как на типичные ошибки повлияют понижение и повышение этого порога.
  explanation: Понижение порога увеличивает чувствительность вместе с числом ложных срабатываний на шум. Повышение уменьшает такие срабатывания, но увеличивает число пропущенных речевых кадров. Настройка порога не устраняет перекрытие уровней энергии речи и шума.
  kind: open
  reference: При понижении порога система чаще принимает фоновые звуки за речь. При повышении порога она лучше отсекает слабый шум, но чаще пропускает тихую речь и окончания фраз.
  id: 002-porog-lomaetsya-2
