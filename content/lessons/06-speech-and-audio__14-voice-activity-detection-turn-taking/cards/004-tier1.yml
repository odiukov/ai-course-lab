- concept: энергетический гейт вычисляет RMS последовательностью «квадрат — среднее — корень», а затем сравнивает результат с порогом
  question: Расположите операции энергетического гейта в правильном порядке.
  explanation: Квадраты устраняют взаимное сокращение положительных и отрицательных отсчётов, усреднение нормирует результат по длине чанка, а корень возвращает величину к шкале амплитуды. После этого RMS можно сравнить с порогом −40 dBFS.
  kind: order
  items:
    - Возвести каждый отсчёт аудиочанка в квадрат
    - Найти среднее квадратов
    - Извлечь квадратный корень
    - Сравнить полученный RMS с энергетическим порогом
  id: 004-tier1-1
  fingerprint: fc904566
- concept: среднее значение знаковых аудиоотсчётов не измеряет громкость из-за взаимного сокращения
  question: В аудиочанке есть большие по модулю положительные и отрицательные отсчёты. Объясни, почему их обычное среднее может оказаться близким к нулю и почему RMS этой проблемы не имеет.
  explanation: Звуковая волна колеблется вокруг нуля, поэтому знак отсчёта показывает направление отклонения, а не отсутствие или наличие громкости. Возведение в квадрат сохраняет вклад величины каждого отсчёта независимо от его знака.
  kind: open
  reference: Положительные и отрицательные отсчёты при сложении взаимно сокращаются, поэтому обычное среднее может быть почти нулевым даже для громкого сигнала. В RMS отсчёты сначала возводятся в квадрат, их знаки исчезают, и оба направления колебания увеличивают оценку энергии.
  id: 004-tier1-2
  fingerprint: c26c1b59
