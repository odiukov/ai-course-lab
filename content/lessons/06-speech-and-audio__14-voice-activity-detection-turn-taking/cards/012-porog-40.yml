- concept: энергетический порог выбирают в зазоре между измеренными уровнями фонового сигнала и речи
  question: Измерения показали, что уровни фонового сигнала и речи образуют две хорошо разделённые области dBFS. Где разумнее установить порог энергетического VAD?
  explanation: Порог в свободном промежутке отделяет типичный фон от типичной речи и оставляет запас на колебания их уровней. Именно поэтому в рассмотренном примере планка между тишиной около -60 dBFS и речью около -20…-30 dBFS оказывается устойчивее планки у края одной из областей.
  kind: choice
  options:
    - Внутри области типичных уровней речи
    - В зазоре между фоном и речью, с запасом до обеих областей
    - Ниже всех наблюдавшихся уровней фонового сигнала
    - На уровне самого громкого речевого фрагмента
  correct: 1
  id: 012-porog-40-1
  fingerprint: c3df3c79
- concept: абсолютный порог dBFS нужно калибровать под микрофон, усиление и акустическую обстановку
  question: Почему один и тот же абсолютный порог энергетического VAD может хорошо работать с гарнитурой в тихой комнате и плохо — со встроенным микрофоном в шумном помещении? Объясни, как выбирать порог для новой конфигурации.
  explanation: Значение -40 dBFS подходит лишь при характерном зазоре между тишиной и речью. Если шумовой фон поднимается, например до -45 dBFS, прежняя планка теряет запас и требует повторной калибровки.
  kind: open
  reference: Микрофон, усиление и окружающий шум меняют наблюдаемые уровни фона и речи, поэтому абсолютный порог не является универсальной константой. Для новой конфигурации нужно измерить распределения dBFS фоновых и речевых чанков и поставить порог в разделяющем их промежутке с запасом до обоих классов.
  id: 012-porog-40-2
