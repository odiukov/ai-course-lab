<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Черновик предлагает, большая модель проверяет</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #eef3f9;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --line: #8b98aa;
      --draft-fill: #e8efff;
      --draft-stroke: #5376c7;
      --draft-ink: #24478f;
      --target-fill: #f1edff;
      --target-stroke: #7657c4;
      --target-ink: #513694;
      --token-fill: #f8fafc;
      --token-stroke: #a9b4c3;
      --accept-fill: #e4f7ec;
      --accept-stroke: #27885a;
      --accept-ink: #17633f;
      --reject-fill: #ffeaec;
      --reject-stroke: #cf4553;
      --reject-ink: #9f2633;
      --shadow: #d7deea;
      --fallback: #fff1d8;
      --fallback-border: #c17a18;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: unset;
      padding: unset;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .figure {
      width: 100%;
      max-width: 1040px;
      margin-inline: auto;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--shadow);
    }

    h1 {
      margin: unset;
      padding: 14px 18px 8px;
      font-size: 22px;
      line-height: normal;
      font-weight: bold;
      background: var(--panel);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 470px;
      background: var(--panel);
      font-family: inherit;
    }

    .surface {
      fill: var(--panel);
    }

    .draft-card {
      fill: var(--draft-fill);
      stroke: var(--draft-stroke);
      stroke-width: 2px;
    }

    .draft-title {
      fill: var(--draft-ink);
      font-size: 17px;
      font-weight: bold;
    }

    .small-label {
      fill: var(--muted);
      font-size: 13px;
    }

    .flow-line,
    .batch-line {
      fill: none;
      stroke: var(--line);
      stroke-width: 2.5px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .flow-head,
    .batch-head {
      fill: var(--line);
    }

    .flow-label {
      fill: var(--draft-ink);
      font-size: 14px;
      font-weight: bold;
    }

    .token {
      fill: var(--token-fill);
      stroke: var(--token-stroke);
      stroke-width: 2px;
    }

    .token-rejected {
      fill: var(--reject-fill);
      stroke: var(--reject-stroke);
      stroke-width: 2px;
    }

    .token-text {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
    }

    .batch-label {
      fill: var(--muted);
      font-size: 13px;
      font-weight: bold;
    }

    .target-card {
      fill: var(--target-fill);
      stroke: var(--target-stroke);
      stroke-width: 2.5px;
    }

    .target-title {
      fill: var(--target-ink);
      font-size: 18px;
      font-weight: bold;
    }

    .target-time {
      fill: var(--target-ink);
      font-size: 14px;
    }

    .verified-accept {
      fill: var(--accept-fill);
      stroke: var(--accept-stroke);
      stroke-width: 2px;
    }

    .verified-reject {
      fill: var(--reject-fill);
      stroke: var(--reject-stroke);
      stroke-width: 2px;
    }

    .verified-text {
      fill: var(--ink);
      font-size: 14px;
      font-weight: bold;
    }

    .accept-line {
      fill: none;
      stroke: var(--accept-stroke);
      stroke-width: 2.5px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .reject-line {
      fill: none;
      stroke: var(--reject-stroke);
      stroke-width: 2.5px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .accept-dot {
      fill: var(--accept-fill);
      stroke: var(--accept-stroke);
      stroke-width: 2.5px;
    }

    .reject-dot {
      fill: var(--reject-fill);
      stroke: var(--reject-stroke);
      stroke-width: 2.5px;
    }

    .accept-mark {
      fill: var(--accept-ink);
      font-size: 18px;
      font-weight: bold;
    }

    .reject-mark {
      fill: var(--reject-ink);
      font-size: 19px;
      font-weight: bold;
    }

    .accept-label {
      fill: var(--accept-ink);
      font-size: 16px;
      font-weight: bold;
    }

    .reject-label {
      fill: var(--reject-ink);
      font-size: 16px;
      font-weight: bold;
    }

    .fallback {
      margin: unset;
      padding: 18px;
      color: var(--ink);
      background: var(--fallback);
      border-top: 2px solid var(--fallback-border);
      font-size: 16px;
      line-height: normal;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111621;
        --panel: #181f2b;
        --ink: #eef3fb;
        --muted: #aab5c5;
        --line: #8290a4;
        --draft-fill: #1d3157;
        --draft-stroke: #769af0;
        --draft-ink: #b9ceff;
        --target-fill: #30244d;
        --target-stroke: #a98bea;
        --target-ink: #d7c8ff;
        --token-fill: #222b39;
        --token-stroke: #66758a;
        --accept-fill: #173c2b;
        --accept-stroke: #55c98d;
        --accept-ink: #9ce7be;
        --reject-fill: #48232a;
        --reject-stroke: #f07582;
        --reject-ink: #ffb5bd;
        --shadow: #303a49;
        --fallback: #392d1c;
        --fallback-border: #e2a348;
      }
    }
  </style>
</head>
<body>
  <main class="figure">
    <h1 id="diagram-title">Черновик предлагает, большая модель проверяет</h1>
    <svg

      width="1040"
      height="440"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-title diagram-description"
    >
      <desc id="diagram-description">
        Draft-модель предлагает пять токенов за пять миллисекунд.
        Target-модель проверяет всю пачку за один проход за семьдесят
        миллисекунд, принимает первые четыре токена и отклоняет пятый.
      </desc>
      <g id="scene"></g>
    </svg>
    <p id="fallback" class="fallback" hidden>
      Схема должна показать: draft-модель предлагает 5 токенов за 5 мс,
      target-модель проверяет всю последовательность за 70 мс, принимает
      первые 4 токена и отклоняет 5-й.
    </p>
  </main>

        x2: 39,

        className: "accept-line"
      },
      {

        x1: 75,
        y1: 37.2,
        x2: 75,
        y2: 39,
        className: "accept-line"
      },

        x1: 39,
        y1: 39,
        x2: 75,
        y2: 39,

      },
      {
        kind: "text",
        x: 57,
        y: 42.3,
        value: "первые 4 — приняты",
        anchor: "middle",
        dx: 0,
        dy: 0,
        className: "accept-label"
      },
      {

        x1: 87,
        y1: 37.2,
        x2: 87,
        y2: 39,
        className: "reject-line"
      },
      {
        kind: "text",
        x: 87,
        y: 42.3,
        value: "5-й — отклонён",
        anchor: "middle",
        dx: 0,
        dy: 0,
        className: "reject-label"
      }
    ];

    const [config, ...sceneData] = data;
    const origin = config.origin;
    const scale = config.scale;

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const namespace = "http://www.w3.org/2000/svg";
      const scene = document.getElementById("scene");
      const fallback = document.getElementById("fallback");
      const diagram = document.getElementById("diagram");

      const make = item => {
        const node = document.createElementNS(namespace, item.kind);

        if (item.kind === "rect") {
          node.setAttribute("x", sx(item.x));
          node.setAttribute("y", sy(item.y));
          node.setAttribute("width", sx(item.x + item.w) - sx(item.x));
          node.setAttribute("height", sy(item.y + item.h) - sy(item.y));
          node.setAttribute("rx", sx(item.r) - sx(origin.x));
          node.setAttribute("ry", sy(item.r) - sy(origin.y));
        }

        if (item.kind === "line") {
          node.setAttribute("x1", sx(item.x1));
          node.setAttribute("y1", sy(item.y1));
          node.setAttribute("x2", sx(item.x2));
          node.setAttribute("y2", sy(item.y2));
        }

        if (item.kind === "circle") {
          node.setAttribute("cx", sx(item.x));
          node.setAttribute("cy", sy(item.y));
          node.setAttribute("r", sx(item.x + item.r) - sx(item.x));
        }

        if (item.kind === "polygon") {
          node.setAttribute(
            "points",
            item.points.map(point => `${sx(point.shift())},${sy(point.pop())}`).join(" ")
          );
        }

        if (item.kind === "text") {
          node.setAttribute("x", sx(item.x));
          node.setAttribute("y", sy(item.y));
          node.setAttribute("dx", item.dx);
          node.setAttribute("dy", item.dy);
          node.setAttribute("text-anchor", item.anchor);
          node.textContent = item.value;
        }

        node.setAttribute("class", item.className);
        return node;
      };

      const fragment = document.createDocumentFragment();
      sceneData.forEach(item => fragment.appendChild(make(item)));
      scene.appendChild(fragment);
      fallback.hidden = true;
      diagram.hidden = false;
    } catch (error) {
      document.getElementById("diagram").hidden = true;
      document.getElementById("fallback").hidden = false;
    }

</body>
</html>
