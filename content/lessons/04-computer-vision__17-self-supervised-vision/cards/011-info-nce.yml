- concept: кросс-энтропия вычисляет InfoNCE непосредственно из сырых logits численно устойчивым способом
  question: Почему при реализации InfoNCE сходства, делённые на temperature, следует передавать прямо в cross-entropy, а не вычислять softmax, логарифмы и экспоненты вручную?
  explanation: 'InfoNCE является кросс-энтропией по кандидатам: позитивный партнёр служит правильным классом. Библиотечная cross-entropy устойчиво выполняет нужные log-softmax и усреднение.'
  kind: open
  reference: Cross-entropy принимает сырые logits и внутри объединяет нормализацию с логарифмом через численно устойчивое вычисление log-sum-exp. Ручной расчёт экспонент может привести к переполнению или потере точности, а предварительный softmax дублирует часть вычислений функции потерь.
