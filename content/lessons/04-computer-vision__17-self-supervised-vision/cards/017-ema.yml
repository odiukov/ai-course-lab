- concept: увеличение коэффициента инерции EMA усиливает сглаживание, но увеличивает запаздывание учителя
  question: Два EMA-учителя следуют за одной и той же последовательностью весов ученика. У первого коэффициент инерции ближе к единице, чем у второго. Чем обычно будет отличаться первый учитель?
  explanation: Чем больше коэффициент инерции, тем выше доля сохранённого состояния учителя и тем меньше вклад очередного состояния ученика. Это лучше подавляет краткие колебания, но усиливает запаздывание относительно устойчивого тренда.
  kind: choice
  options:
    - Он будет быстрее повторять каждый скачок ученика и сильнее колебаться
    - Он полностью перестанет учитывать устойчивые изменения весов ученика
    - Он будет изменяться плавнее, но медленнее следовать за устойчивым движением ученика
  correct: 2
