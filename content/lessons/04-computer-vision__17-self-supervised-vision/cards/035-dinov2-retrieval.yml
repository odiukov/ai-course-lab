- concept: поиск без дообучения выполняется как поиск ближайших соседей в общем пространстве замороженного энкодера
  question: Расположите действия для поиска изображений по запросу с помощью замороженного DINOv2 в правильном порядке.
  explanation: 'Коллекция и запрос должны попасть в одно пространство признаков. После этого обучение не требуется: результат определяется сходством CLS-векторов и ранжированием ближайших соседей.'
  kind: order
  items:
    - Получить CLS-векторы изображений коллекции одним и тем же замороженным энкодером и построить индекс
    - Получить CLS-вектор запроса тем же энкодером и с той же предобработкой
    - Сравнить вектор запроса с векторами из индекса
    - Отсортировать изображения по убыванию сходства
