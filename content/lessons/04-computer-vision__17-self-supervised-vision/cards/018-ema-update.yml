- concept: присваивание локальной переменной не заменяет зарегистрированный параметр модели
  question: |-
    Почему такой цикл не изменит веса EMA-учителя?

    `for student_param, teacher_param in zip(student.parameters(), teacher.parameters()):`
    `    teacher_param = ema_value(student_param, teacher_param, momentum)`
  explanation: Имя `teacher_param` внутри цикла — локальная ссылка. Его переназначение не меняет объект `Parameter`, зарегистрированный в модели. Нужно изменить существующий параметр на месте, например через `copy_`, `mul_` и `add_` в контексте `torch.no_grad()`.
  kind: choice
  options:
    - '`student.parameters()` возвращает параметры в случайном порядке'
    - EMA-обновление параметров возможно только через оптимизатор
    - Присваивание меняет лишь локальную переменную `teacher_param`, а не данные зарегистрированного параметра
    - PyTorch запрещает использовать параметры разных моделей в одном выражении
  correct: 2
  id: 018-ema-update-1
  fingerprint: c18c1d38
- concept: EMA-учитель обновляется после шага оптимизатора ученика
  question: Расположи основные операции обучающей итерации DINO так, чтобы EMA-учитель получил актуальные веса ученика.
  explanation: Во время вычисления текущей цели учитель остаётся фиксированным. Сначала градиентный шаг изменяет ученика, а затем EMA сдвигает учителя к уже обновлённым весам, подготавливая его к следующей итерации.
  kind: order
  items:
    - Вычислить DINO loss по выходам ученика и учителя
    - Выполнить обратное распространение и шаг оптимизатора ученика
    - Без вычисления градиентов обновить учителя через EMA от новых весов ученика
  id: 018-ema-update-2
  fingerprint: fbb16e58
- concept: попарный обход параметров через zip требует одинаковой структуры моделей
  question: При каких условиях безопасно сопоставлять параметры ученика и EMA-учителя через `zip(student.parameters(), teacher.parameters())`? Объясни также, чем опасно нарушение этих условий.
  explanation: '`zip` сопоставляет элементы только по позиции и не проверяет смысл параметров. Поэтому перед таким EMA-обновлением структуры моделей должны совпадать; особенно коварно различие в длине последовательностей, поскольку лишние параметры просто не попадут в цикл.'
  kind: open
  reference: Модели должны иметь одинаковую архитектуру, одинаковое количество параметров, одинаковый порядок их регистрации и совместимые формы соответствующих тензоров. При несовместимых формах операция завершится ошибкой, а при разном количестве параметров `zip` молча остановится на более короткой последовательности и оставит часть учителя необновлённой.
  id: 018-ema-update-3
  fingerprint: a6d671ba
