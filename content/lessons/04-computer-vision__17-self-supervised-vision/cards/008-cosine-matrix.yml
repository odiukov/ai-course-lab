- concept: матрица Грама вычисляет cosine similarity между всеми парами нормализованных embedding
  question: Строки матрицы Z содержат L2-нормализованные embedding видов. Заполни формулу матрицы попарных cosine similarity.
  explanation: Произведение Z на транспонированную Z содержит скалярное произведение каждой строки со всеми строками. После L2-нормализации эти произведения равны cosine similarity.
  kind: cloze
  template: S = ___
  answer: Z Z^T
  accept:
    - Z @ Z.T
    - ZZ^T
    - Z·Z^T
  id: 008-cosine-matrix-1
  fingerprint: 062781fe
- concept: самосходство на диагонали исключают из контрастивного сравнения
  question: Почему диагональ матрицы попарных cosine similarity маскируют при вычислении InfoNCE?
  explanation: Диагональная ячейка сравнивает вид с ним самим и после нормализации равна единице. Это тривиальное совпадение не является позитивной парой разных аугментаций, поэтому его исключают.
  kind: choice
  options:
    - Там находятся сравнения каждого embedding с самим собой, которые не дают обучающего сигнала
    - На диагонали всегда находятся две аугментации одного изображения
    - Диагональные значения невозможно дифференцировать
    - Маскирование делает матрицу симметричной
  correct: 0
  id: 008-cosine-matrix-2
