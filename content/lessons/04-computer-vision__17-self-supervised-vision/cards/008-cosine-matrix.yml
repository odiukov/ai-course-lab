- concept: матрица попарной cosine similarity симметрична
  question: Объясни, почему матрица cosine similarity между одним набором embedding и самим собой симметрична.
  explanation: 'Матрица имеет вид Z Z^T. При транспонировании получается та же матрица, поскольку скалярное произведение коммутативно: сходство одного вида с другим совпадает со сходством в обратном порядке.'
  kind: open
  reference: 'Cosine similarity не зависит от порядка аргументов: скалярное произведение первого embedding со вторым равно скалярному произведению второго с первым. Поэтому элемент S_ij равен S_ji.'
  id: 008-cosine-matrix-3
  fingerprint: 3f76d519
