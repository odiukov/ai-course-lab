- concept: покоординатная дисперсия embedding по батчу служит диагностикой схлопывания представлений
  question: У self-supervised энкодера низкий loss, но поиск похожих изображений работает почти случайно. Какая статистика наиболее прямо проверяет, различает ли энкодер входные изображения?
  explanation: Если дисперсия большинства координат embedding очень мала, разные изображения получают почти одинаковые представления. Низкий loss при этом может быть следствием схлопывания, а не обучения полезных признаков.
  kind: choice
  options:
    - Средняя норма весов проекционной головы
    - Покоординатная дисперсия embedding по изображениям батча
    - Средняя яркость входных изображений
    - Количество параметров энкодера
  correct: 1
  id: 037-collapse-diagnostics-1
  fingerprint: '52422896'
- concept: превосходство над наивным baseline подтверждает решение предлоговой задачи, но не качество представлений
  question: Почему MAE loss ниже ошибки наивного восстановления средним цветом патча ещё не доказывает, что энкодер выучил полезные визуальные признаки?
  explanation: 'Baseline помогает интерпретировать абсолютное значение loss: модель действительно превзошла бессмысленную стратегию. Однако способ решить задачу реконструкции может не дать полезного пространства признаков, поэтому loss дополняют диагностикой embedding и downstream-оценкой.'
  kind: open
  reference: Такое сравнение показывает лишь, что модель восстанавливает скрытые патчи лучше простого baseline. Оно не гарантирует, что embedding различают изображения и содержат переносимые семантические признаки; дополнительно нужно проверить разброс представлений и их качество в прикладной оценке.
  id: 037-collapse-diagnostics-2
  fingerprint: d74b9cd7
