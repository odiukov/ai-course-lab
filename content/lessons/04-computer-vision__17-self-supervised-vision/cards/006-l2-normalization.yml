- concept: L2-нормализация инвариантна к положительному масштабированию embedding
  question: Даны ненулевой embedding u и embedding v = αu, где α > 0. Как соотносятся их L2-нормализованные версии?
  explanation: 'При нормализации масштаб сокращается: αu / ||αu|| = αu / (α||u||) = u / ||u||. Сохраняется направление вектора, а его исходная длина перестаёт влиять на сравнение.'
  kind: choice
  options:
    - Они совпадают
    - Версия v остаётся в α раз длиннее версии u
    - Они становятся противоположно направленными
  correct: 0
  id: 006-l2-normalization-1
  fingerprint: 6be37cb5
- concept: каждая координата L2-нормализованного embedding делится на евклидову длину вектора
  question: Embedding имеет координаты (11, 60). Чему равна его первая координата после L2-нормализации?
  explanation: Длина embedding равна √(11² + 60²) = 61. Поэтому первая нормализованная координата равна 11 / 61 ≈ 0.1803.
  kind: numeric
  answer: 0.1803
  tolerance: 0.0005
  id: 006-l2-normalization-2
  fingerprint: 341170b2
