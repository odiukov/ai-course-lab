- concept: границы cosine similarity следуют из неравенства Коши — Буняковского
  question: Почему скалярное произведение двух векторов единичной длины теоретически не может выйти за границы допустимых значений cosine similarity?
  explanation: По неравенству Коши — Буняковского модуль скалярного произведения не больше произведения норм. После L2-нормализации обе нормы равны 1, поэтому cosine similarity лежит между -1 и 1.
  kind: choice
  options:
    - Потому что транспонирование обнуляет слишком большие значения
    - Потому что матричное умножение автоматически применяет clipping
    - Потому что модуль скалярного произведения не превосходит произведения длин векторов
  correct: 2
  id: 009-cosine-similarity-matrix-1
  fingerprint: 3440bce6
- concept: результаты вычислений с плавающей точкой следует проверять с допуском
  question: Объясни, почему диагональ матрицы cosine similarity обычно проверяют с небольшим допуском, а не точным сравнением.
  explanation: Теоретически ненулевой нормализованный embedding имеет cosine similarity с собой, равную 1. На практике из-за округления результат может быть 0.9999999, поэтому используют проверку вроде allclose с малым допуском.
  kind: open
  reference: Нормализация и матричное умножение выполняются в арифметике с плавающей точкой, где возникают ошибки округления. Поэтому самосходство может получиться очень близким к единице, но не совпасть с ней побитово; заметное отклонение уже указывает на проблему в данных или нормализации.
  id: 009-cosine-similarity-matrix-2
  fingerprint: b7a2d67b
