- concept: усреднение DINO loss делает его масштаб независимым от размера батча
  question: Батч для вычисления DINO loss составили, несколько раз повторив каждый исходный объект. Предсказания и целевые распределения для копий совпадают. Как изменятся сумма и среднее по объектам?
  explanation: Каждая копия добавляет такое же слагаемое, поэтому сумма растёт вместе с батчем. Усреднение делит эту сумму на число объектов и сохраняет сопоставимый масштаб loss.
  kind: choice
  options:
    - Сумма возрастёт пропорционально числу копий, а среднее не изменится
    - Среднее возрастёт пропорционально числу копий, а сумма не изменится
    - И сумма, и среднее останутся прежними
    - И сумма, и среднее уменьшатся
  correct: 0
  id: 023-dino-loss-1
  fingerprint: 5044dc7a
- concept: DINO использует кросс-энтропию с мягким целевым распределением учителя
  question: Учитель задаёт распределение [0.6, 0.3, 0.1], а ученик — [0.5, 0.3, 0.2]. Чему равна кросс-энтропия −Σ q·ln(p)?
  explanation: Вычисление даёт −0.6·ln(0.5) − 0.3·ln(0.3) − 0.1·ln(0.2) ≈ 0.938. В DINO вероятности учителя выступают весами при отрицательных логарифмах вероятностей ученика.
  kind: numeric
  answer: 0.938
  tolerance: 0.005
  id: 023-dino-loss-2
  fingerprint: 1145b872
- concept: градиент soft-target cross-entropy направляет распределение ученика к распределению учителя
  question: Объясни, как кросс-энтропия DINO изменяет логит класса, которому ученик назначил меньшую вероятность, чем учитель.
  explanation: Производная кросс-энтропии после softmax имеет вид p_student − q_teacher. Поэтому недооценённые учеником классы усиливаются, а переоценённые ослабляются.
  kind: open
  reference: Для логита ученика градиент равен разности p_student − q_teacher. Если вероятность ученика меньше целевой вероятности учителя, градиент отрицателен, поэтому шаг градиентного спуска повышает этот логит и соответствующую вероятность.
  id: 023-dino-loss-3
  fingerprint: 1a3c2f99
