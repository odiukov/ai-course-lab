- concept: в MAE скрытые патчи самого изображения становятся целевыми значениями
  question: Объясни своими словами, откуда MAE получает правильный ответ для обучения, если у изображений нет ручных меток.
  explanation: MAE не нужны названия объектов или внешние метки. Модель получает видимые патчи на вход, а содержимое скрытых патчей использует как цель реконструкции.
  kind: open
  reference: 'MAE скрывает часть патчей входного изображения и учится восстанавливать их по видимым патчам. Поэтому целевые значения берутся из исходного изображения: временно скрытое содержимое и является правильным ответом.'
  id: 003-three-families-3
  fingerprint: f6b44edf
