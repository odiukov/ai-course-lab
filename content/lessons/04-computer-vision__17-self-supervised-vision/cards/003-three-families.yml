- concept: SimCLR повышает сходство представлений двух видов одного изображения
  question: Заполни пропуск в цели контрастивного обучения для пары аугментаций одной картинки.
  explanation: Два вида одного изображения образуют положительную пару, поэтому SimCLR увеличивает косинусное сходство их представлений. Представления других изображений служат отрицательными примерами и раздвигаются.
