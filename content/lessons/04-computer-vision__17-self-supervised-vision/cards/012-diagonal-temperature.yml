- concept: понижение temperature заостряет softmax-распределение по кандидатам
  question: В InfoNCE положительный пример имеет немного большее cosine similarity, чем самый похожий негатив. Что произойдёт при уменьшении положительной temperature?
  explanation: Деление сходств на меньшую положительную temperature увеличивает разрывы между logits. Softmax становится острее, поэтому небольшое преимущество позитива выражается сильнее, а опасные близкие негативы получают более жёсткий штраф.
  kind: choice
  options:
    - Распределение станет более равномерным
    - Softmax увереннее выделит позитив, а близкий негатив сильнее повлияет на loss
    - Позитив и негатив поменяются местами
    - Cosine similarity обоих кандидатов станет одинаковым
  correct: 1
  id: 012-diagonal-temperature-1
  fingerprint: 0013fbfd
- concept: положительная temperature меняет уверенность softmax, но сохраняет ранжирование кандидатов
  question: Объясни, почему изменение положительной temperature в InfoNCE может заметно изменить loss, но не может само по себе заменить кандидата с максимальной вероятностью.
  explanation: 'Положительное масштабирование сохраняет порядок сходств, поэтому лидер остаётся тем же. При этом softmax зависит не только от порядка, но и от величины разрывов между logits: низкая temperature делает распределение более концентрированным, высокая — более ровным.'
  kind: open
  reference: Все значения сходства делятся на один и тот же положительный коэффициент, поэтому их порядок сохраняется. Однако масштаб разностей между logits меняется, а вместе с ним меняются концентрация softmax и значение кросс-энтропии.
  id: 012-diagonal-temperature-2
  fingerprint: e190bede
