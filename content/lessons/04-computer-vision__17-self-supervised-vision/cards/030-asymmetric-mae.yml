- concept: вычислительная стоимость self-attention квадратично зависит от длины последовательности
  question: Энкодер MAE обрабатывает долю r от всех патчей изображения. Как относительно полной последовательности изменяется размер матрицы внимания в каждом слое?
  explanation: Self-attention сопоставляет каждый токен с каждым, поэтому матрица внимания имеет размер, квадратичный по длине последовательности. Если оставить долю r патчей, число элементов в ней сокращается примерно до r² от исходного.
  kind: choice
  options:
    - Уменьшается примерно до доли r
    - Уменьшается примерно до доли r²
    - Уменьшается примерно до доли 1 − r
    - Не зависит от r
  correct: 1
  id: 030-asymmetric-mae-1
  fingerprint: 3e0a9982
- concept: mask-токены добавляются после тяжёлого энкодера, а исходный порядок патчей восстанавливается перед декодированием
  question: Расположи этапы прямого прохода асимметричного MAE в правильном порядке.
  explanation: Тяжёлый энкодер не обрабатывает ни скрытые патчи, ни их заглушки. Mask-токены вставляют уже в его выход, после чего токены возвращают на исходные позиции и передают небольшому декодеру.
  kind: order
  items:
    - Отобрать видимые патчи и передать только их в энкодер
    - Получить признаки видимых патчей
    - Добавить mask-токены для скрытых позиций
    - Восстановить исходный порядок полной последовательности
    - Передать полную последовательность в лёгкий декодер для реконструкции
  id: 030-asymmetric-mae-2
  fingerprint: 2e4336c0
