- concept: при схлопывании представлений энкодер стирает различия между входными изображениями
  question: Замороженный визуальный энкодер выдаёт одинаковый embedding для любых изображений. Что произойдёт при обучении классификатора только поверх этих embeddings?
  explanation: Одинаковые embeddings не содержат информации о различиях между изображениями. Какой бы классификатор ни стоял сверху, он не может восстановить сведения, уже утраченные энкодером.
  kind: choice
  options:
    - Классификатор восстановит различия по меткам обучающей выборки
    - Классификатор различит изображения благодаря случайной инициализации
    - Классификатор не сможет различать изображения, поскольку получает одинаковые входы
  correct: 2
  id: 019-collapse-1
  fingerprint: 7db1edb1
- concept: согласование учителя и ученика допускает бесполезное константное решение
  question: Объясни своими словами, почему малый loss согласования между EMA-учителем и учеником сам по себе не исключает схлопывание представлений.
  explanation: Функция согласования проверяет совпадение выходов, но без дополнительных ограничений не требует их разнообразия. Поэтому идеальное согласие учителя и ученика ещё не означает полезность признаков.
  kind: open
  reference: Ученик может выдавать одну константу для всех входов, а EMA-учитель со временем перенимает такое поведение. Тогда их выходы совпадают для любых видов изображения и loss становится малым, хотя embeddings не содержат информации о содержимом.
  id: 019-collapse-2
  fingerprint: e059e48a
- concept: негативные пары делают полное схлопывание невыгодным в contrastive learning
  question: Какое требование contrastive loss непосредственно препятствует отображению всех изображений в один embedding?
  explanation: При полном схлопывании embeddings негативных пар совпадают, что увеличивает contrastive loss. Требование раздвигать разные изображения делает константное представление невыгодным.
  kind: choice
  options:
    - Выход энкодера должен точно восстанавливать пиксели
    - Разные изображения должны получать одинаковые представления
    - Представления негативных пар должны быть разнесены
  correct: 2
  id: 019-collapse-3
  fingerprint: f827435f
