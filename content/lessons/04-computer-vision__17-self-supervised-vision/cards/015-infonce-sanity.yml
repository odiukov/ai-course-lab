- concept: при равных logits случайный ориентир InfoNCE равен логарифму числа кандидатов
  question: В начале contrastive-обучения один вид выбирает позитив среди 39 кандидатов, которым модель назначает одинаковые вероятности. Чему примерно равен InfoNCE loss для этого вида?
  explanation: При равномерном выборе вероятность позитива равна обратному числу кандидатов, поэтому loss равен ln(39) ≈ 3.66.
  kind: numeric
  answer: 3.66
  tolerance: 0.02
  id: 015-infonce-sanity-1
  fingerprint: d56a501f
- concept: InfoNCE loss при разных размерах множества кандидатов следует сравнивать со своим случайным ориентиром
  question: В запуске A позитив выбирается среди 15 кандидатов, а наблюдаемый loss равен 2.30. В запуске B кандидатов 63, а loss равен 3.50. В каком запуске модель сильнее превзошла случайный выбор?
  explanation: Ориентиры равны ln(15) ≈ 2.71 и ln(63) ≈ 4.14. Запуск A лучше случайного примерно на 0.41, а B — примерно на 0.64, поэтому относительно своей сложности B продвинулся дальше.
  kind: choice
  options:
    - В запуске A, потому что его абсолютный loss меньше
    - В запуске B, потому что его loss дальше опустился ниже собственного случайного ориентира
    - Оба запуска одинаковы, потому что оба loss положительны
  correct: 1
  id: 015-infonce-sanity-2
  fingerprint: 8df39279
- concept: вероятность позитивного кандидата восстанавливается из InfoNCE loss как экспонента от отрицательного loss
  question: Loss для одного вида равен 0.36. Какую вероятность модель назначила его позитивному партнёру? Округли ответ до сотых.
  explanation: 'Поскольку L = −ln(p), получаем p = exp(−L). Следовательно, exp(−0.36) ≈ 0.70: позитив уже получает большую часть вероятностной массы.'
  kind: numeric
  answer: 0.7
  tolerance: 0.01
  id: 015-infonce-sanity-3
  fingerprint: c26fcd61
