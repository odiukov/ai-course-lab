- concept: аугментации SSL должны сохранять признаки, значимые для прикладной задачи
  question: На производственных снимках тип дефекта определяется главным образом небольшим изменением оттенка материала. Какую стратегию аугментаций следует выбрать для contrastive-предобучения?
  explanation: Contrastive-метод учится игнорировать различия между двумя аугментированными видами. Если аугментация меняет диагностически важный цвет, энкодер получает стимул удалить этот сигнал из представления.
  kind: choice
  options:
    - Сохранять оттенок и применять только преобразования, которые не уничтожают признак дефекта
    - Сильно изменять цвет, чтобы добиться полной инвариантности к оттенку
    - Всегда переводить оба вида изображения в градации серого
    - Случайно переставлять цветовые каналы независимо для каждого вида
  correct: 0
  id: 036-method-selection-1
  fingerprint: d7b1d3ef
- concept: предполагаемый способ использования признаков влияет на выбор семейства SSL
  question: Команде нужен замороженный визуальный энкодер, представления которого можно сразу использовать для поиска похожих изображений. Дополнительная сложность обучения с двумя сетями допустима. Какое семейство методов наиболее естественно рассмотреть первым?
  explanation: DINO обучает переносимые представления без явных негативов, и они хорошо подходят для поиска похожих изображений с замороженным энкодером. Преимущества MAE чаще полнее раскрываются после дообучения под прикладную задачу.
  kind: choice
  options:
    - MAE, поскольку реконструкция пикселей гарантирует лучшие замороженные признаки
    - Случайно инициализированный энкодер без предобучения
    - DINO, поскольку его переносимые признаки хорошо подходят для поиска и работы без полного дообучения
    - Только обучение классификатора с учителем на небольшой размеченной выборке
  correct: 2
  id: 036-method-selection-2
