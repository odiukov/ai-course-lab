- concept: сравнение качества представлений требует одинакового протокола linear probe
  question: Замороженные энкодеры A и B оценивают с помощью linear probe на одной задаче. Для A классификатор обучают дольше и подбирают регуляризацию тщательнее, чем для B. Можно ли по итоговой точности заключить, какой энкодер выучил лучшие признаки?
  explanation: Заморозка исключает изменение энкодеров, но неодинаковые данные, длительность обучения или гиперпараметры probe всё ещё влияют на точность. Для честного сравнения протокол обучения линейных классификаторов должен совпадать.
  kind: choice
  options:
    - Да, потому что параметры обоих энкодеров заморожены
    - Нет, различия в обучении классификаторов смешивают качество признаков с качеством настройки probe
    - Да, если классификаторы для обоих энкодеров остаются линейными
    - Нет, linear probe вообще не позволяет сравнивать энкодеры
  correct: 1
  id: 034-linear-probe-1
  fingerprint: 4b27b056
- concept: низкая точность linear probe свидетельствует об отсутствии удобной линейной разделимости только для проверяемой задачи
  question: Замороженный self-supervised энкодер показывает низкую точность linear probe на классификации пород животных. Что из этого можно заключить о его представлениях, а чего заключать нельзя?
  explanation: Linear probe измеряет линейную доступность информации для конкретной задачи. Отрицательный результат не проверяет все возможные задачи и не показывает, чего можно достичь при полном fine-tuning или с более выразительной головой.
  kind: open
  reference: 'Можно заключить, что информация, необходимая для различения выбранных пород, не представлена в форме, которую легко извлечь линейным классификатором. Нельзя заключать, что энкодер бесполезен вообще: его признаки могут подходить для других задач или становиться полезными после нелинейного дообучения.'
  id: 034-linear-probe-2
  fingerprint: 9ac3bb23
