- concept: предлоговая задача может отличаться от будущей прикладной задачи
  question: Модель без ручных меток предобучают восстанавливать скрытые участки изображений, а затем используют для сегментации. Почему такое предобучение может помочь?
  explanation: Предлоговая и прикладная задачи могут различаться. Важно, чтобы предобучение заставляло энкодер выделять форму, текстуру, границы и взаимное расположение частей — признаки, которые затем переносятся на сегментацию или классификацию.
  kind: choice
  options:
    - Восстановление заставляет энкодер выучить переносимые визуальные признаки, полезные и для сегментации
    - Предлоговая задача автоматически создаёт точные маски сегментации
    - После восстановления скрытых участков энкодер больше не нуждается в обучении
    - Любая автоматически созданная задача гарантированно совпадает с прикладной
  correct: 0
  id: 002-pretext-1
  fingerprint: 4f8e56f3
- concept: перенос self-supervised признаков на задачу с ручными метками
  question: Расположи этапы использования self-supervised предобучения в правильном порядке.
  explanation: Сначала энкодер получает общие визуальные признаки без ручной разметки. Затем временную задачу заменяют целевой головой и используют дорогие метки только для адаптации к нужной задаче.
  kind: order
  items:
    - Предобучить энкодер на автоматически созданной предлоговой задаче с неразмеченными изображениями
    - Убрать компонент, предназначенный только для предлоговой задачи
    - Добавить к энкодеру голову для целевой задачи
    - Обучить новую голову или дообучить модель на небольшой размеченной выборке
  id: 002-pretext-2
  fingerprint: 08901eec
- concept: предлоговая задача должна исключать нерелевантные короткие пути
  question: Модель почти безошибочно решает предлоговую задачу, распознавая рамку вокруг изображения, но её признаки плохо переносятся на классификацию объектов. Объясни причину своими словами.
  explanation: Высокое качество на предлоговой задаче само по себе не гарантирует полезных признаков. Если ответ определяется водяным знаком, рамкой или другим артефактом, модель оптимизирует этот сигнал, а не понимание изображения.
  kind: open
  reference: 'Рамка является коротким путём: она позволяет получить правильный ответ без изучения содержимого сцены. Поэтому энкодер кодирует случайный артефакт вместо формы, текстуры, границ и других содержательных признаков, нужных в прикладной задаче.'
  id: 002-pretext-3
  fingerprint: 8cbc3517
