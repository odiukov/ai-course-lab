<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Три семейства self-supervised обучения</title>
<style>
:root{
  color-scheme:light dark;
  --page:#f8fafc;
  --card:#ffffff;
  --text:#172033;
  --muted:#536078;
  --line:#aab5c7;
  --blue:#2563eb;
  --blue-soft:#dbeafe;
  --amber:#c76a08;
  --amber-soft:#fef3c7;
  --green:#16864a;
  --green-soft:#dcfce7;
  --violet:#7357c8;
  --violet-soft:#ede9fe;
  --mask:#6b7280;
  --mask-soft:#e5e7eb;
}
@media (prefers-color-scheme:dark){
  :root{
    --page:#101827;
    --card:#182235;
    --text:#f1f5f9;
    --muted:#b5c0d2;
    --line:#526079;
    --blue:#79a7ff;
    --blue-soft:#203a66;
    --amber:#f5b85b;
    --amber-soft:#51391b;
    --green:#65d493;
    --green-soft:#183f2d;
    --violet:#b7a4ff;
    --violet-soft:#352d59;
    --mask:#aab3c2;
    --mask-soft:#343f50;
  }
}
*{box-sizing:border-box}
html,body{background:var(--page);color:var(--text);margin:initial}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
h1{
  font-size:22px;
  font-weight:bold;
  text-align:center;
  margin:initial;
  padding:12px 18px 8px;
}
svg{
  display:block;
  width:100%;
  height:auto;
  max-height:440px;
  background:var(--page);
}
.card{fill:var(--card);stroke:var(--line);stroke-width:2}
.card.sim{stroke:var(--blue)}
.card.dino{stroke:var(--amber)}
.card.mae{stroke:var(--green)}
.soft-blue{fill:var(--blue-soft);stroke:var(--blue)}
.soft-amber{fill:var(--amber-soft);stroke:var(--amber)}
.soft-green{fill:var(--green-soft);stroke:var(--green)}
.soft-violet{fill:var(--violet-soft);stroke:var(--violet)}
.soft-mask{fill:var(--mask-soft);stroke:var(--mask)}
.shape{stroke-width:2}
.flow{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:round}
.flow.blue{stroke:var(--blue)}
.flow.amber{stroke:var(--amber)}
.flow.green{stroke:var(--green)}
.flow.violet{stroke:var(--violet)}
.head{stroke:none}
.head.blue{fill:var(--blue)}
.head.amber{fill:var(--amber)}
.head.green{fill:var(--green)}
.head.violet{fill:var(--violet)}
.head.neutral{fill:var(--line)}
.title{fill:var(--text);font-size:20px;font-weight:bold}
.label{fill:var(--text);font-size:15px}
.small{fill:var(--muted);font-size:13px}
.tag{fill:var(--text);font-size:14px;font-weight:bold}
.footer{font-size:14px;font-weight:bold}
.dot{stroke-width:3}
.tile{stroke-width:2}
.masked{fill:var(--mask-soft);stroke:var(--mask)}
.visible-a{fill:var(--blue-soft);stroke:var(--blue)}
.visible-b{fill:var(--amber-soft);stroke:var(--amber)}
.visible-c{fill:var(--green-soft);stroke:var(--green)}
.visible-d{fill:var(--violet-soft);stroke:var(--violet)}
[hidden]{display:none}
.fallback{
  color:var(--text);
  background:var(--card);
  border:2px solid var(--line);
  font-size:16px;
  padding:18px;
}
</style>
</head>
<body>
<h1>Три семейства self-supervised обучения</h1>
<svg id="diagram" viewBox="0 0 1200 440" width="1200" height="440"
     preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="Три параллельных маршрута: SimCLR сравнивает виды, DINO передаёт цель от EMA-учителя ученику, MAE восстанавливает скрытые патчи">
  <title>SimCLR, DINO и MAE: три источника учебного сигнала</title>
</svg>
<div id="fallback" class="fallback" hidden></div>
<script>
const DATA={
  metrics:{corner:14,round:9,head:10,half:6,node:18,cell:22,gap:3},
  cards:[
    {x:18,y:12,w:372,h:412,kind:"sim",title:"SimCLR",subtitle:"сравнение представлений"},
    {x:414,y:12,w:372,h:412,kind:"dino",title:"DINO",subtitle:"учитель — ученик"},
    {x:810,y:12,w:372,h:412,kind:"mae",title:"MAE",subtitle:"восстановление по маске"}
  ],
  sim:{
    image:{x:42,y:92,w:66,h:66,tiles:[
      {x:48,y:98,w:25,h:22,c:"visible-a"},{x:77,y:98,w:25,h:22,c:"visible-c"},
      {x:48,y:124,w:25,h:28,c:"visible-d"},{x:77,y:124,w:25,h:28,c:"visible-b"}
    ]},
    views:[
      {x:145,y:76,w:82,h:60,label:"вид 1",c:"soft-blue"},
      {x:145,y:174,w:82,h:60,label:"вид 2",c:"soft-violet"}
    ],
    nodes:[
      {x:283,y:106,label:"z₁",c:"soft-blue"},
      {x:283,y:204,label:"z₂",c:"soft-violet"},
      {x:348,y:155,label:"+",c:"soft-green"},
      {x:283,y:302,label:"чуж.",c:"soft-amber"}
    ],
    arrows:[
      {x1:108,y1:116,x2:145,y2:116,c:"blue"},
      {x1:108,y1:134,x2:145,y2:204,c:"violet"},
      {x1:227,y1:106,x2:265,y2:106,c:"blue"},
      {x1:227,y1:204,x2:265,y2:204,c:"violet"},
      {x1:301,y1:106,x2:330,y2:148,c:"blue"},
      {x1:301,y1:204,x2:330,y2:162,c:"violet"},
      {x1:265,y1:302,x2:218,y2:302,c:"amber"},
      {x1:301,y1:302,x2:348,y2:302,c:"amber"}
    ],
    texts:[
      {x:75,y:174,t:"одно изображение",a:"middle",c:"small"},
      {x:348,y:196,t:"сблизить",a:"middle",c:"label"},
      {x:283,y:340,t:"негативы — дальше",a:"middle",c:"label"}
    ],
    footer:{x:42,y:370,w:324,h:35,t:"Успех: верное сравнение",c:"soft-blue"}
  },
  dino:{
    image:{x:438,y:118,w:58,h:58,tiles:[
      {x:444,y:124,w:21,h:19,c:"visible-b"},{x:469,y:124,w:21,h:19,c:"visible-a"},
      {x:444,y:147,w:21,h:23,c:"visible-c"},{x:469,y:147,w:21,h:23,c:"visible-d"}
    ]},
    views:[
      {x:528,y:78,w:74,h:50,label:"вид 1",c:"soft-amber"},
      {x:528,y:216,w:74,h:50,label:"вид 2",c:"soft-blue"}
    ],
    nodes:[
      {x:666,y:103,label:"У",c:"soft-amber"},
      {x:666,y:241,label:"С",c:"soft-blue"},
      {x:753,y:103,label:"цель",c:"soft-amber"},
      {x:753,y:241,label:"ответ",c:"soft-blue"}
    ],
    arrows:[
      {x1:496,y1:137,x2:528,y2:103,c:"amber"},
      {x1:496,y1:157,x2:528,y2:241,c:"blue"},
      {x1:602,y1:103,x2:648,y2:103,c:"amber"},
      {x1:602,y1:241,x2:648,y2:241,c:"blue"},
      {x1:684,y1:103,x2:735,y2:103,c:"amber"},
      {x1:684,y1:241,x2:735,y2:241,c:"blue"},
      {x1:753,y1:121,x2:753,y2:223,c:"amber"},
      {x1:648,y1:229,x2:630,y2:121,c:"violet"}
    ],
    texts:[
      {x:666,y:74,t:"EMA-учитель",a:"middle",c:"label"},
      {x:666,y:280,t:"ученик",a:"middle",c:"label"},
      {x:726,y:170,t:"передаёт цель",a:"end",c:"small"},
      {x:617,y:172,t:"EMA",a:"end",c:"tag"},
      {x:617,y:192,t:"плавное обновление",a:"end",c:"small"}
    ],
    footer:{x:438,y:370,w:324,h:35,t:"Успех: совпадение с учителем",c:"soft-amber"}
  },
  mae:{
    grid:{x:834,y:92,cells:[
      {x:834,y:92,c:"masked"},{x:859,y:92,c:"masked"},{x:884,y:92,c:"visible-a"},{x:909,y:92,c:"masked"},
      {x:834,y:117,c:"masked"},{x:859,y:117,c:"visible-b"},{x:884,y:117,c:"masked"},{x:909,y:117,c:"masked"},
      {x:834,y:142,c:"masked"},{x:859,y:142,c:"masked"},{x:884,y:142,c:"masked"},{x:909,y:142,c:"visible-c"},
      {x:834,y:167,c:"visible-d"},{x:859,y:167,c:"masked"},{x:884,y:167,c:"masked"},{x:909,y:167,c:"masked"}
    ]},
    model:{x:970,y:115,w:74,h:54,label:"модель"},
    output:{x:1080,y:92,cells:[
      {x:1080,y:92,c:"visible-c"},{x:1105,y:92,c:"visible-d"},{x:1130,y:92,c:"visible-a"},{x:1155,y:92,c:"visible-b"},
      {x:1080,y:117,c:"visible-a"},{x:1105,y:117,c:"visible-b"},{x:1130,y:117,c:"visible-c"},{x:1155,y:117,c:"visible-d"},
      {x:1080,y:142,c:"visible-d"},{x:1105,y:142,c:"visible-c"},{x:1130,y:142,c:"visible-b"},{x:1155,y:142,c:"visible-c"},
      {x:1080,y:167,c:"visible-d"},{x:1105,y:167,c:"visible-a"},{x:1130,y:167,c:"visible-c"},{x:1155,y:167,c:"visible-b"}
    ]},
    arrows:[
      {x1:934,y1:142,x2:970,y2:142,c:"green"},
      {x1:1044,y1:142,x2:1080,y2:142,c:"green"}
    ],
    texts:[
      {x:884,y:225,t:"скрыто 75% патчей",a:"middle",c:"label"},
      {x:1128,y:225,t:"восстановлено",a:"middle",c:"label"},
      {x:1007,y:263,t:"видимые фрагменты",a:"middle",c:"small"},
      {x:1007,y:284,t:"→ предсказание скрытых",a:"middle",c:"small"}
    ],
    footer:{x:834,y:370,w:324,h:35,t:"Успех: восстановить пропущенное",c:"soft-green"}
  }
};
const origin={x:0,y:0};
const scale=1;
const sx=x=>origin.x+x*scale;
const sy=y=>origin.y+y*scale;

try{
  const svg=document.getElementById("diagram");
  const NS="http://www.w3.org/2000/svg";
  const m=DATA.metrics;
  const make=(name,attrs,cls)=>{
    const el=document.createElementNS(NS,name);
    Object.entries(attrs).forEach(([key,value])=>el.setAttribute(key,value));
    if(cls)el.setAttribute("class",cls);
    return el;
  };
  const add=el=>svg.appendChild(el);
  const rect=(x,y,w,h,cls,r=m.round)=>add(make("rect",{
    x:sx(x),y:sy(y),width:sx(w)-sx(0),height:sy(h)-sy(0),
    rx:sx(r)-sx(0),ry:sy(r)-sy(0)
  },cls));
  const circle=(x,y,r,cls)=>add(make("circle",{
    cx:sx(x),cy:sy(y),r:sx(r)-sx(0)
  },cls));
  const text=(x,y,value,anchor,cls)=>add(make("text",{
    x:sx(x),y:sy(y),"text-anchor":anchor
  },cls)).textContent=value;
  const line=(x1,y1,x2,y2,cls)=>add(make("line",{
    x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2)
  },cls));
  const arrow=(a)=>{
    line(a.x1,a.y1,a.x2,a.y2,"flow "+a.c);
    let p;
    if(a.y1===a.y2){
      const d=a.x2>a.x1?m.head:-m.head;
      p=[[a.x2,a.y2],[a.x2-d,a.y2-m.half],[a.x2-d,a.y2+m.half]];
    }else{
      const d=a.y2>a.y1?m.head:-m.head;
      p=[[a.x2,a.y2],[a.x2-m.half,a.y2-d],[a.x2+m.half,a.y2-d]];
    }
    add(make("polygon",{points:p.map(q=>sx(q[0])+","+sy(q[1])).join(" ")},"head "+a.c));
  };
  const image=(d)=>{
    rect(d.x,d.y,d.w,d.h,"shape soft-violet",m.corner);
    d.tiles.forEach(t=>rect(t.x,t.y,t.w,t.h,"tile "+t.c,m.round));
  };
  const view=(v)=>{
    rect(v.x,v.y,v.w,v.h,"shape "+v.c,m.corner);
    text(v.x+v.w/m.half,v.y+v.h/m.half+m.half,v.label,"middle","tag");
  };
  const footer=(f)=>{
    rect(f.x,f.y,f.w,f.h,"shape "+f.c,m.corner);
    text(f.x+f.w/m.half,f.y+f.h/m.half+m.half,f.t,"middle","footer");
  };

  DATA.cards.forEach(c=>{
    rect(c.x,c.y,c.w,c.h,"card "+c.kind,m.corner);
    text(c.x+c.w/m.half,c.y+36,c.title,"middle","title");
    text(c.x+c.w/m.half,c.y+58,c.subtitle,"middle","small");
  });

  image(DATA.sim.image);
  DATA.sim.views.forEach(view);
  DATA.sim.arrows.forEach(arrow);
  DATA.sim.nodes.forEach(n=>{
    circle(n.x,n.y,m.node,"shape dot "+n.c);
    text(n.x,n.y+m.half,n.label,"middle","tag");
  });
  DATA.sim.texts.forEach(t=>text(t.x,t.y,t.t,t.a,t.c));
  footer(DATA.sim.footer);

  image(DATA.dino.image);
  DATA.dino.views.forEach(view);
  DATA.dino.arrows.forEach(arrow);
  DATA.dino.nodes.forEach(n=>{
    circle(n.x,n.y,m.node,"shape dot "+n.c);
    text(n.x,n.y+m.half,n.label,"middle","tag");
  });
  DATA.dino.texts.forEach(t=>text(t.x,t.y,t.t,t.a,t.c));
  footer(DATA.dino.footer);

  DATA.mae.grid.cells.forEach(c=>rect(c.x,c.y,m.cell,m.cell,"tile "+c.c,m.round));
  rect(DATA.mae.model.x,DATA.mae.model.y,DATA.mae.model.w,DATA.mae.model.h,
       "shape soft-green",m.corner);
  text(DATA.mae.model.x+DATA.mae.model.w/m.half,
       DATA.mae.model.y+DATA.mae.model.h/m.half+m.half,
       DATA.mae.model.label,"middle","tag");
  DATA.mae.output.cells.forEach(c=>rect(c.x,c.y,m.cell,m.cell,"tile "+c.c,m.round));
  DATA.mae.arrows.forEach(arrow);
  DATA.mae.texts.forEach(t=>text(t.x,t.y,t.t,t.a,t.c));
  footer(DATA.mae.footer);
}catch(error){
  document.getElementById("diagram").hidden=true;
  const fallback=document.getElementById("fallback");
  fallback.hidden=false;
  fallback.textContent="Схема должна была показать три маршрута: SimCLR сближает два вида одного изображения и раздвигает негативы; DINO передаёт цель от EMA-учителя ученику; MAE скрывает 75% патчей и восстанавливает пропущенное.";
}
</script>
</body>
</html>
