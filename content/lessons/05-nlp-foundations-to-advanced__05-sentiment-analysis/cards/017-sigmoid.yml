- concept: сигмоида монотонно преобразует логит в допустимую вероятность
  question: Как изменяется результат сигмоиды при увеличении логита?
  explanation: Сигмоида отображает любой вещественный logit в интервал от 0 до 1 и монотонно возрастает. Например, нулевой logit даёт 0,5, а большие положительные и отрицательные значения приближают результат соответственно к 1 и 0.
  kind: choice
  options:
    - Монотонно растёт, оставаясь в допустимом диапазоне вероятности
    - Монотонно уменьшается и со временем становится отрицательным
    - Растёт линейно и может превысить допустимый диапазон вероятности
  correct: 0
  id: 017-sigmoid-1
  fingerprint: 8e62e99b
- concept: ограничение экстремальных логитов защищает вычисление сигмоиды от переполнения без существенной потери точности
  question: Почему в численной реализации сигмоиды полезно ограничивать слишком большие по модулю логиты перед вычислением экспоненты?
  explanation: При большом отрицательном logit выражение exp(-x) может переполниться. Обрезка x до диапазона от -20 до 20 предотвращает это, а sigmoid(20) уже примерно равна 0,999999998, поэтому полезная точность почти не теряется.
  kind: open
  reference: Ограничение не позволяет аргументу экспоненты стать настолько большим, что вычисление переполнится и вернёт inf. При экстремальных логитах сигмоида уже насыщена около границы вероятностного диапазона, поэтому такое ограничение практически не меняет результат.
  id: 017-sigmoid-2
  fingerprint: 0218068c
