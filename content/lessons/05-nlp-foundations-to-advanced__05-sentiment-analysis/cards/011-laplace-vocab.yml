- concept: аддитивное сглаживание назначает ненулевую вероятность словам, не встречавшимся в классе
  question: В классе насчитано 32 появления слов из словаря размером 8. Слово из словаря ни разу не встретилось в этом классе. Чему равна его сглаженная вероятность при α = 0.5?
  explanation: Знаменатель равен 32 + 0.5 × 8 = 36, а числитель для невстреченного слова после сглаживания равен 0.5. Поэтому вероятность составляет 0.5 / 36 ≈ 0.01389 и остаётся ненулевой.
  kind: numeric
  answer: 0.01389
  tolerance: 0.0001
  id: 011-laplace-vocab-1
  fingerprint: 87be458d
- concept: знаменатель сглаженных вероятностей должен учитывать счётчики только слов из словаря модели
  question: Словарь модели содержит 7 слов. В выбранном классе на эти слова приходится 21 появление, а ещё 6 появлений относятся к словам, исключённым из словаря. Какой знаменатель нужен при α = 0.2?
  explanation: В знаменатель входят только появления слов, для которых модель хранит вероятности, плюс сглаживающая добавка для каждого словарного слова. Исключённые слова учитывать нельзя, иначе сохранённые вероятности не сложатся в единицу.
  kind: choice
  options:
    - 21 + 0.2 × 7 = 22.4
    - 21 + 6 + 0.2 × 7 = 28.4
    - 21 + 0.2 = 21.2
    - 21 + 6 = 27
  correct: 0
