- concept: при инференсе логит должен учитывать обученный свободный член модели
  question: Заполни выражение для вычисления логитов батча в логистической регрессии.
  explanation: Матричное произведение вычисляет взвешенную сумму признаков для каждой строки, а свободный член b добавляет обученное смещение. Если пропустить b при инференсе, граница решения не будет соответствовать обученной модели.
  kind: cloze
  template: logits = ___
  answer: X @ w + b
  accept:
    - np.matmul(X, w) + b
    - X.dot(w) + b
  id: 022-predict-lr-1
  fingerprint: fbb4cefe
- concept: батч бинарных прогнозов формируется поэлементным сравнением массива вероятностей с порогом
  question: Почему обычный Python if не подходит для классификации целого батча вероятностей и как получить из них массив целочисленных бинарных меток?
  explanation: NumPy применяет оператор сравнения ко всем элементам массива одновременно. Результат имеет по одному булеву значению на объект, а astype(int) превращает эти значения в бинарные метки без цикла и скалярного if.
  kind: open
  reference: 'Сравнение массива вероятностей с порогом нужно выполнить поэлементно: оно создаст булев массив, который затем преобразуют в целочисленный тип через astype(int). Обычный if ожидает одно условие и не определяет отдельную метку для каждого элемента массива.'
  id: 022-predict-lr-2
  fingerprint: '97107759'
