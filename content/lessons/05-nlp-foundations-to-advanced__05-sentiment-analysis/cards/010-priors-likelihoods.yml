- concept: условная вероятность слова нормируется по числу токенов выбранного класса
  question: Во всех документах одного класса насчитали 28 токенов, среди которых слово «excellent» встретилось 7 раз. Чему равна оценка P(excellent | class) по относительной частоте?
  explanation: 'Для условной вероятности берут число появлений слова в классе и делят на общее число токенов того же класса: 7 / 28 = 0.25. Токены других классов в знаменатель не входят.'
  kind: numeric
  answer: 0.25
  tolerance: 0.001
  id: 010-priors-likelihoods-1
  fingerprint: 54a4fe16
- concept: multinomial Naive Bayes учитывает каждое повторное появление слова
  question: Одно и то же слово несколько раз повторяется в одном обучающем документе. Как эти повторы учитываются при оценке P(word | class) в multinomial Naive Bayes?
  explanation: Multinomial Naive Bayes моделирует появления токенов, поэтому каждый повтор входит в C(word, class). Подсчёт документов, содержащих слово, соответствовал бы другой модели признаков.
  kind: choice
  options:
    - Каждое появление увеличивает счётчик слова
    - Документ увеличивает счётчик слова только однократно
    - Повторы полностью исключаются из словаря
    - Счётчик увеличивается только при появлении слова в новом классе
  correct: 0
  id: 010-priors-likelihoods-2
  fingerprint: 0a53369b
