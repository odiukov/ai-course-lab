  fingerprint: 3034a816
- concept: принудительная бинарная разметка теряет смешанную и нейтральную тональность
  question: Отзыв одновременно отмечает достоинства товара и несколько существенных недостатков, не выражая явного итогового предпочтения. Почему разметчики могут присвоить ему разные метки в бинарной задаче тональности?
  explanation: Текст может содержать смешанную, нейтральную или слабую оценку. Когда схема допускает лишь позитивную и негативную метки, граница между ними становится спорной и возникает расхождение между разметчиками.
  kind: choice
  options:
    - Смешанное отношение не всегда однозначно сводится к позитиву или негативу
    - Бинарная классификация запрещает учитывать слова о недостатках
    - Каждый отзыв имеет объективную метку, но люди не умеют читать
    - Позитивная и негативная тональность различаются только пунктуацией
