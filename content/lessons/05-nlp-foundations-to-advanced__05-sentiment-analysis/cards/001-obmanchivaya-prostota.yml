- concept: сарказм создаёт расхождение между буквальным смыслом и выраженным отношением
  question: Объясни своими словами, почему наличие вежливых или похвальных слов не гарантирует позитивную тональность сообщения.
  explanation: При сарказме буквальный смысл и намерение автора расходятся. Модель, которая лишь подсчитывает позитивные слова, может принять насмешку или претензию за похвалу.
  kind: open
  reference: Похвальные слова могут использоваться саркастически. Тогда буквальная формулировка выглядит позитивной, но контекст и несоответствие ситуации показывают негативное отношение автора.
