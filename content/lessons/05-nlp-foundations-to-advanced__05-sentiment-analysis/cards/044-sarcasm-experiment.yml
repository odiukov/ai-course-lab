- concept: остаточные признаки для второго классификатора нужно получать вне обучающей выборки базовой модели
  question: 'Строится каскад: модель тональности, а затем детектор сарказма по её ошибкам и уверенности. Как корректно получить обучающие признаки для второго классификатора?'
  explanation: Остатки на знакомых базовой модели текстах содержат утечку и выглядят лучше, чем ошибки на новых данных. Out-of-fold-предсказания дают второму классификатору признаки, близкие к тем, которые он увидит при реальном инференсе.
  kind: choice
  options:
    - Обучить модель тональности на всей обучающей выборке и вычислить её остатки на тех же текстах
    - Получить out-of-fold-предсказания, чтобы остаток каждого текста вычисляла модель, не обучавшаяся на нём
    - Обучить оба классификатора на всей выборке и выбрать вариант с большей обучающей accuracy
  correct: 1
  id: 044-sarcasm-experiment-1
  fingerprint: 0e28a650
- concept: качество случайного baseline оценивают по серии независимых запусков
  question: Почему один запуск случайного классификатора служит ненадёжной контрольной точкой для детектора сарказма и как провести сравнение корректнее?
  explanation: Один удачный или неудачный набор случайных ответов может исказить вывод. Среднее по многим запускам лучше оценивает ожидаемый случайный уровень; если детектор остаётся ниже него, эксперимент не подтверждает способность распознавать сарказм.
  kind: open
  reference: Результат отдельного запуска случайно колеблется. Нужно выполнить серию независимых запусков на одном и том же тестовом наборе с разными seed, усреднить метрику и желательно оценить её разброс, а затем сравнить с ними детектор.
  id: 044-sarcasm-experiment-2
  fingerprint: a82a0891
