- concept: аспектный анализ тональности связывает каждую оценку с конкретным объектом
  question: В отзыве о гостинице хвалят расположение, но жалуются на чистоту номера. Какой результат соответствует аспектному анализу тональности?
  explanation: 'Аспектный анализ не смешивает разные оценки в одну метку: он связывает каждую тональность с тем аспектом, которого она касается. Для этого модели нужен структурированный выход по аспектам.'
  kind: choice
  options:
    - Один общий класс «нейтрально»
    - «Расположение — позитивно», «чистота — негативно»
    - Список всех эмоционально окрашенных слов без указания объектов
    - Две независимые оценки без названий аспектов
  correct: 1
  id: 038-transformer-cases-1
  fingerprint: 74af2c55
- concept: многоязычная предобученная модель даёт zero-shot-бейзлайн без размеченных примеров целевого языка
  question: У команды есть классификатор отзывов на основе многоязычного BERT, но нет размеченных отзывов на новом языке. Как корректнее всего оценить его применение к этому языку?
  explanation: Предобучение на множестве языков позволяет попробовать перенос без дополнительного обучения на размеченных данных целевого языка. Такой zero-shot-результат служит отправной точкой, но не гарантирует достаточного качества.
  kind: choice
  options:
    - Это zero-shot-бейзлайн, качество которого нужно проверить на целевом языке
    - Модель гарантированно сохранит качество исходного языка
    - Без размеченной обучающей выборки целевого языка инференс невозможен
    - Модель автоматически создаст достоверную разметку для целевого языка
  correct: 0
  id: 038-transformer-cases-2
  fingerprint: 5a6664f0
