- concept: ложноположительные ответы снижают precision, но не влияют на recall при неизменных TP и FN
  question: У бинарного классификатора увеличилось число FP, а TP и FN не изменились. Что произойдёт с метриками положительного класса?
  explanation: 'FP входит в знаменатель precision: TP/(TP+FP), поэтому рост FP снижает precision. Recall равен TP/(TP+FN) и при неизменных TP и FN остаётся прежним.'
  kind: choice
  options:
    - Precision уменьшится, recall не изменится
    - Recall уменьшится, precision не изменится
    - Обе метрики уменьшатся
    - Обе метрики не изменятся
  correct: 0
  id: 026-four-counters-1
  fingerprint: b799f36d
- concept: F1 вычисляется непосредственно из TP, FP и FN как 2TP/(2TP+FP+FN)
  question: Для положительного класса TP = 22, FP = 7 и FN = 13. Чему равен F1? Округлите ответ до трёх знаков после запятой.
  explanation: F1 можно вычислить как 2TP/(2TP+FP+FN). Получаем 44/(44+7+13) = 44/64 = 0,6875, то есть примерно 0,688.
  kind: numeric
  answer: 0.688
  tolerance: 0.001
  id: 026-four-counters-2
  fingerprint: f5702518
