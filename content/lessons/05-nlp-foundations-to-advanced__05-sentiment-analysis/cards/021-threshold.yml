- concept: порог преобразует непрерывную вероятность в бинарную метку с потерей информации об уверенности
  question: Почему две сильно различающиеся вероятности могут превратиться в одинаковое предсказание логистической регрессии?
  explanation: Сигмоида сохраняет непрерывную оценку уверенности, а порог оставляет только результат сравнения с границей. Поэтому разные оценки по одну сторону порога дают один класс.
  kind: open
  reference: Если обе вероятности находятся по одну сторону порога, правило классификации назначает им одну метку. После такого преобразования различие в степени уверенности модели в бинарной метке уже не сохраняется.
  id: 021-threshold-2
  fingerprint: 0f1b9a00
