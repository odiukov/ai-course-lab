- concept: знак и модуль коэффициента определяют направление и силу влияния признака на логарифм отношения шансов класса
  question: Положительный класс обозначает позитивную тональность. Как интерпретировать отрицательный коэффициент большого модуля у текстового признака в логистической регрессии?
  explanation: Отрицательный коэффициент сдвигает решение от позитивного класса, а большой модуль означает сильное влияние. Это не требует, чтобы признак встречался исключительно в негативных документах.
  kind: choice
  options:
    - При прочих равных признак заметно уменьшает логарифм отношения шансов позитивного класса
    - Признак обязательно встречается только в негативных документах
    - Признак почти не влияет на решение модели
    - Признак увеличивает вероятность позитивного класса
