- concept: суммирование логарифмов предотвращает численное обнуление произведения малых вероятностей
  question: Почему при вычислении оценки класса в Naive Bayes используют сумму логарифмов вероятностей вместо их прямого произведения?
  explanation: Произведение множества малых вероятностей может выйти за диапазон представимых чисел и превратиться в ноль. Благодаря равенству log(a·b) = log(a) + log(b) ту же оценку можно устойчиво вычислить сложением.
  kind: choice
  options:
    - Логарифмы делают условные вероятности независимыми
    - Сумма логарифмов не даёт длинному произведению малых вероятностей округлиться до нуля
    - Логарифмы автоматически нормируют оценки классов
  correct: 1
  id: 013-log-scores-1
  fingerprint: 35c50d7d
- concept: монотонность логарифма сохраняет класс с максимальной вероятностной оценкой
  question: Почему выбор класса с наибольшим log-score даёт тот же результат, что и сравнение исходных произведений вероятностей?
  explanation: Логарифм меняет масштаб оценок, но не их порядок. Поэтому максимальный log-score принадлежит тому же классу, что и максимальная исходная оценка; среди отрицательных log-score побеждает менее отрицательный.
  kind: open
  reference: 'Логарифм строго возрастает на положительных числах и поэтому сохраняет их порядок: большему произведению соответствует больший логарифм.'
  id: 013-log-scores-2
  fingerprint: 87e7ce0c
