- concept: квадратичный регуляризационный штраф в данной реализации применяется к весам, но не к свободному члену
  question: При обучении к градиенту вектора весов добавляют штраф, пропорциональный самим весам, а градиент свободного члена оставляют средней ошибкой. Какой параметр этот штраф напрямую тянет к нулю?
