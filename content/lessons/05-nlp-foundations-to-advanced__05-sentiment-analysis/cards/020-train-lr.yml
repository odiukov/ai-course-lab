- concept: произведение транспонированной матрицы признаков на вектор ошибок даёт градиент по всем признакам
  question: Матрица X имеет форму (n_samples, n_features), а err — вектор длины n_samples. Что представляет собой результат X.T @ err?
  explanation: Строки X.T соответствуют признакам, а столбцы — объектам. Умножение на err суммирует вклад ошибок объектов отдельно для каждого признака, поэтому результат имеет длину n_features.
  kind: choice
  options:
    - Вектор длины n_features, содержащий накопленный вклад ошибок для каждого признака
    - Вектор длины n_samples, содержащий новый прогноз для каждого объекта
    - Скаляр, содержащий среднюю ошибку по выборке
  correct: 0
  id: 020-train-lr-1
  fingerprint: 522916bd
- concept: градиент свободного члена равен средней ошибке по обучающей выборке
  question: Заполни выражение для градиента свободного члена при пакетном обучении логистической регрессии.
  explanation: Свободный член одинаково добавляется к логиту каждого объекта, поэтому его градиент равен среднему значению preds - y. Добавка l2 * w относится только к весам признаков и в grad_b не входит.
  kind: cloze
  template: grad_b = ___
  answer: err.mean()
  accept:
    - np.mean(err)
  id: 020-train-lr-2
  fingerprint: 7cb2b304
- concept: градиентный спуск изменяет параметры в направлении, противоположном градиенту
  question: Объясни своими словами, почему при обучении логистической регрессии из весов вычитают lr, умноженный на градиент, а не прибавляют его.
  explanation: Обновления w -= lr * grad_w и b -= lr * grad_b реализуют градиентный спуск. Прибавление положительного градиента обычно увеличивало бы функцию потерь.
  kind: open
  reference: Градиент указывает направление наиболее быстрого роста функции потерь. Чтобы уменьшать ошибку, параметры сдвигают в противоположную сторону, а lr задаёт величину этого сдвига.
  id: 020-train-lr-3
  fingerprint: bc957867
