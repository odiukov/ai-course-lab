- concept: ложноположительный ответ для класса определяется относительно выбранной целевой метки
  question: При подсчёте метрик класса c по схеме one-vs-rest какое условие описывает ложноположительное предсказание для c?
  explanation: 'Ложноположительный ответ возникает, когда модель ошибочно выбирает целевой класс: предсказание равно c, хотя истинная метка относится к другому классу.'
  kind: choice
  options:
    - Истинная метка равна c, а предсказанная не равна c
    - Истинная и предсказанная метки не равны c
    - Истинная метка не равна c, а предсказанная равна c
  correct: 2
  id: 029-code-macro-f1-1
  fingerprint: 3f6ada0a
- concept: метрики класса требуют защиты от деления на нулевой знаменатель
  question: Объясни, зачем при вычислении precision, recall и F-меры отдельно проверять их знаменатели.
  explanation: Знаменатель precision зависит от числа предсказаний целевого класса, а знаменатель recall — от числа его истинных объектов. Любое из этих множеств может оказаться пустым, поэтому вычисление должно явно обрабатывать такой случай.
  kind: open
  reference: Для класса может не оказаться предсказанных или истинных объектов, поэтому знаменатель соответствующей метрики станет нулевым. Проверка предотвращает ошибку деления, а метрике в таком случае присваивают нулевое значение.
  id: 029-code-macro-f1-2
  fingerprint: 9ef71906
