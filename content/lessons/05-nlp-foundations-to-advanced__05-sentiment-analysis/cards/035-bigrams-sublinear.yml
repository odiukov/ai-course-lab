- concept: логарифмическое масштабирование term frequency уменьшает предельный вклад каждого следующего повтора признака
  question: Почему сублинейная частота признака обычно подходит для эмоциональных повторов лучше обычного линейного счётчика?
  explanation: При sublinear TF частота преобразуется по формуле 1 + log(tf). Например, десять появлений дают частотный вес около 3,3 вместо 10, поэтому повторяющееся слово не заглушает остальные признаки документа.
  kind: open
  reference: При логарифмическом масштабировании первое появление признака остаётся значимым, но каждый следующий повтор увеличивает его вес всё слабее. Поэтому многократное повторение эмоционального слова усиливает сигнал, не превращаясь в такое же число независимых доказательств.
  id: 035-bigrams-sublinear-2
  fingerprint: 2dc0218c
