- concept: inspection of error samples grouped by error direction helps identify recurring causes of model failures
  question: Матрица ошибок показала, что модель путает негативные отзывы с позитивными и позитивные с негативными. Почему для диагностики полезно отдельно прочитать реальные тексты из обоих направлений ошибки?
  explanation: По одним счётчикам нельзя установить, какие языковые конструкции сбивают модель. Группировка ошибочных текстов по истинному и предсказанному классам позволяет не смешивать разные сбои и формулировать проверяемые гипотезы об их причинах.
  kind: open
  reference: Матрица показывает частоту и направление ошибок, но не их причины. Раздельное чтение примеров помогает обнаружить разные повторяющиеся источники ошибок, например отрицание в одном направлении и неявную оценку в другом, а затем выбрать подходящее улучшение признаков или обучающих данных.
