- concept: TF-IDF нужно обучать только на обучающей части данных, поскольку словарь и IDF являются изучаемыми параметрами
  question: Какой способ оценки классификатора тональности создаёт утечку данных?
  explanation: TF-IDF изучает словарь и частоты документов. Если построить признаки до разделения, статистика проверочных текстов повлияет на их веса, даже если их метки не использовались.
  kind: choice
  options:
    - Сначала разделить исходные тексты, затем обучить TF-IDF и классификатор только на обучающей части
    - Обучить TF-IDF на всех текстах, а затем разделить полученные векторы на обучающую и проверочную части
    - Обучить Pipeline на обучающих текстах и применить его без переобучения к проверочным текстам
  correct: 1
  id: 033-sklearn-pipeline-1
  fingerprint: 77940ca2
- concept: при кросс-валидации Pipeline заново обучает преобразования признаков внутри каждой обучающей части
  question: Почему при кросс-валидации текстов следует передавать Pipeline с TF-IDF и классификатором, а не заранее вычисленную TF-IDF-матрицу?
  explanation: Кросс-валидация честна лишь тогда, когда каждый обучаемый этап выполняет fit без доступа к текущей проверочной части. Pipeline обеспечивает такую границу для TF-IDF и классификатора.
  kind: open
  reference: Pipeline в каждом разбиении обучает словарь и IDF только на текущей обучающей части, а к проверочной части применяет уже сохранённое преобразование. Предварительная векторизация всего датасета позволила бы проверочным текстам повлиять на признаки.
  id: 033-sklearn-pipeline-2
  fingerprint: 66adcb49
