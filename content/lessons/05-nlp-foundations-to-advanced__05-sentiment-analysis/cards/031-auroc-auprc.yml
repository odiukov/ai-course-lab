- concept: при крайнем дисбалансе качество числовых оценок модели сравнивают по AUROC и AUPRC на всех порогах
  question: Положительный класс встречается крайне редко, а модель выдаёт непрерывный score. Какую пару сводных метрик следует использовать для сравнения моделей сразу по множеству порогов?
  explanation: AUROC оценивает ранжирование положительных и отрицательных примеров, а AUPRC объединяет precision и recall при изменении порога. При дисбалансе хуже 95–5 их показывают вместо accuracy.
  kind: choice
  options:
    - Accuracy и weighted-F1
    - AUROC и AUPRC
    - Precision и recall при одном фиксированном пороге
  correct: 1
  id: 031-auroc-auprc-1
  fingerprint: 613eeb3c
- concept: AUROC имеет вероятностную интерпретацию качества ранжирования классов
  question: Бинарный классификатор получил AUROC 0,83. Как точнее всего интерпретировать этот результат?
  explanation: 'AUROC характеризует порядок числовых оценок: он равен вероятности того, что случайный положительный объект будет ранжирован раньше случайного отрицательного. Метрика не фиксирует precision, recall или accuracy при конкретном пороге.'
  kind: choice
  options:
    - С вероятностью 0,83 score случайного положительного примера превысит score случайного отрицательного
    - При любом пороге precision классификатора равен 0,83
    - Доля правильно классифицированных положительных примеров равна 0,83
  correct: 0
  id: 031-auroc-auprc-2
  fingerprint: ce4877fd
- concept: базовый уровень AUPRC случайного ранжирования приблизительно равен доле положительного класса
  question: В тестовой выборке 75 положительных объектов из 2500. Каков приблизительный базовый уровень AUPRC для случайного ранжирования?
  explanation: 'Для случайного ранжирования ожидаемый уровень AUPRC примерно равен распространённости положительного класса: 75 / 2500 = 0,03. Поэтому AUPRC нужно сопоставлять с долей редкого класса, а не с базовым уровнем AUROC.'
  kind: numeric
  answer: 0.03
  tolerance: 0.002
  id: 031-auroc-auprc-3
  fingerprint: d7825e9e
