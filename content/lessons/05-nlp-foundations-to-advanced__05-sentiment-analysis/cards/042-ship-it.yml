- concept: спецификация baseline должна включать наблюдение за конкретным риском после развёртывания
  question: Модель анализа тональности показывает хорошие результаты на отложенной выборке. Зачем в проект baseline всё равно включать конкретный риск для мониторинга после запуска?
  explanation: Офлайн-оценка описывает качество на зафиксированных данных. После запуска тематика и язык входов могут измениться, поэтому заранее выбранный риск нужно отслеживать отдельно.
  kind: choice
  options:
    - Чтобы автоматически повысить офлайн-метрики без переобучения
    - Чтобы обнаружить ухудшение качества при изменении реальных данных или появлении трудных языковых случаев
    - Чтобы заменить разметку производственных примеров случайными метками
    - Чтобы гарантировать неизменность распределения входных текстов
