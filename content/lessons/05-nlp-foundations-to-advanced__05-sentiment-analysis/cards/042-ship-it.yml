- concept: выбор baseline должен учитывать свойства данных и эксплуатационные ограничения
  question: Почему признаки и классификатор для анализа тональности следует выбирать только после получения сведений о домене, языке, объёме данных, гранулярности меток и допустимой задержке?
  explanation: 'Универсального baseline нет: язык и домен влияют на признаки, объём и схема меток — на обучение и оценку, а бюджет задержки ограничивает допустимую сложность модели.'
  kind: open
  reference: Эти параметры определяют, какие представления текста применимы, достаточно ли данных для выбранной модели, какие различия должен улавливать классификатор и укладывается ли решение в эксплуатационный бюджет.
