- concept: тексты с одинаковым представлением неразличимы для детерминированного классификатора
  question: Векторизатор преобразовал два разных отзыва в совершенно одинаковые векторы. Что сделает с ними один и тот же детерминированный классификатор?
  explanation: Классификатор получает только вектор. Если векторы совпадают, его входы неразличимы, поэтому совпадут и результаты. Информацию, потерянную при представлении текста, классификатор восстановить не может.
  kind: choice
  options:
    - Восстановит исходные тексты и сравнит их смысл
    - Выдаст одинаковые оценки и предсказания
    - Автоматически добавит потерянные признаки
    - Выберет метки случайно
  correct: 1
  id: 002-represent-classify-1
  fingerprint: 2d327c9b
- concept: тональные метки необходимы для обучения классификатора, но не для построения текстовых признаков
  question: Почему неразмеченный корпус можно использовать для построения словаря и расчёта IDF, но его недостаточно для обучения классификатора тональности?
  explanation: 'Представление извлекает числовые признаки из текстов. Классификация — обучение по размеченным примерам: без правильных меток модель не узнает, в какую сторону должна проводить границу между классами.'
  kind: open
  reference: Словарь и IDF строятся по статистике самих текстов и не требуют меток тональности. Классификатору нужны пары «вектор — правильная метка», чтобы узнать, какие признаки связаны с позитивным и негативным классами.
  id: 002-represent-classify-2
  fingerprint: fde2becb
