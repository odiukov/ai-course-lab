  fingerprint: 9facffc8
- concept: устойчивый большой вес требует постоянной компенсации L2 со стороны градиента данных
  question: Почему часто встречающийся полезный признак может сохранить заметный вес при L2-регуляризации, а редкий случайный признак обычно не может? Объясни через два слагаемых градиента.
  explanation: 'Полный градиент складывается из сигнала данных и штрафа λw. L2 не запрещает большие веса: он требует, чтобы их постоянно оправдывало уменьшение ошибки на обучающих примерах.'
  kind: open
  reference: Градиент данных многократно двигает вес полезного признака в направлении, уменьшающем ошибку, и может компенсировать сжатие λw. У редкого случайного признака такой устойчивой поддержки нет, поэтому слагаемое L2 постепенно тянет его вес к нулю.
  id: 019-gradient-l2-2
  fingerprint: 7f4979ff
