<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>56 ГБ, 18 ГБ, 6 ГБ</title>
<style>
  :root{
    --bg:#f7f7fb; --fg:#1a1a2e; --muted:#5a5a72; --grid:#d8d8e4;
    --c1:#e94560; --c2:#0f3460; --c3:#1f8a5f; --floor:#8a6a1f;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12121c; --fg:#f0f0f6; --muted:#a0a0b8; --grid:#2e2e42;
      --c1:#ff6b81; --c2:#5b9bd5; --c3:#4bc98d; --floor:#e0b64a;
    }
  }
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg);
    font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{background:var(--bg);padding:10px 12px 4px}
  h2{margin:0 0 2px;font-size:15px}
  p.sub{margin:0 0 6px;font-size:12px;color:var(--muted)}
  svg{display:block;width:100%;height:auto;max-height:470px}
  .t{font-size:12px;fill:var(--fg)}
  .m{font-size:11px;fill:var(--muted)}
  .big{font-size:15px;font-weight:600;fill:var(--fg)}
  .fail{padding:8px;color:var(--fg);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h2>Память на обучение модели 7B: 56 ГБ → 18 ГБ → 6 ГБ</h2>
  <p class="sub">LoRA убирает оптимизатор. QLoRA пробивает пол из замороженных весов.</p>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    // ---------- данные ----------
    var COLS = [
      {key:'full', name:'Full fine-tune', gpu:'A100 80GB', total:56, c:'var(--c1)',
       parts:[{v:16,l:'веса fp16'},{v:16,l:'градиенты'},{v:32,l:'моменты Adam'},{v:-8,l:''}]},
      {key:'lora', name:'LoRA', gpu:'A100 40GB', total:18, c:'var(--c2)',
       parts:[{v:16,l:'веса fp16'},{v:2,l:'адаптеры + активации'}]},
      {key:'qlora', name:'QLoRA', gpu:'RTX 3090 24GB', total:6, c:'var(--c3)',
       parts:[{v:4,l:'база 4 бита'},{v:2,l:'адаптеры + активации'}]}
    ];
    // сумма частей = total; корректирующий элемент отрицателен, его не рисуем
    var TICKS = [0,6,18,56];
    var FLOOR = 16;

    // ---------- холст (литералы) ----------
    var VB_W = 760, VB_H = 470;
    var PAD = 6, LW = 1.5, ARROW = 7;

    // ---------- одна система координат ----------
    // x: 0..3 (позиции столбиков), y: 0..60 ГБ
    var origin = {x:126, y:392};
    var scale  = {x:186, y:5.6};
    function sx(x){ return origin.x + x * scale.x; }
    function sy(y){ return origin.y - y * scale.y; }

    var W = 0.46; // полуширина столбика в единицах x

    // ---------- сборка ----------
    var NS = 'http://www.w3.org/2000/svg';
    function el(n,a){ var e=document.createElementNS(NS,n);
      for(var k in a) e.setAttribute(k,a[k]); return e; }
    function txt(x,y,s,cls,anchor){
      var t=el('text',{x:x,y:y,'class':cls,'text-anchor':anchor||'middle'});
      t.textContent=s; return t;
    }

    var svg = el('svg',{viewBox:'0 0 '+VB_W+' '+VB_H,
      preserveAspectRatio:'xMidYMid meet',role:'img'});
    svg.appendChild(el('rect',{x:0,y:0,width:VB_W,height:VB_H,fill:'var(--bg)'}));

    var defs = el('defs',{});
    var mk = el('marker',{id:'ah',viewBox:'0 0 10 10',refX:'9',refY:'5',
      markerWidth:ARROW,markerHeight:ARROW,orient:'auto-start-reverse'});
    mk.appendChild(el('path',{d:'M0,0 L10,5 L0,10 z',fill:'var(--muted)'}));
    defs.appendChild(mk);
    svg.appendChild(defs);

    // сетка + ось Y
    TICKS.forEach(function(v){
      svg.appendChild(el('line',{x1:sx(-0.62),y1:sy(v),x2:sx(2.72),y2:sy(v),
        stroke:'var(--grid)','stroke-width':LW,
        'stroke-dasharray': v===0 ? 'none' : '4 4'}));
      svg.appendChild(txt(sx(-0.68), sy(v)+4, v+' ГБ','m','end'));
    });
    svg.appendChild(el('line',{x1:sx(-0.62),y1:sy(0),x2:sx(-0.62),y2:sy(60),
      stroke:'var(--grid)','stroke-width':LW}));

    // пол из замороженных весов fp16
    svg.appendChild(el('line',{x1:sx(-0.1),y1:sy(FLOOR),x2:sx(1.6),y2:sy(FLOOR),
      stroke:'var(--floor)','stroke-width':LW,'stroke-dasharray':'2 3'}));
    svg.appendChild(txt(sx(1.62), sy(FLOOR)-PAD,
      'пол LoRA: 16 ГБ замороженных весов','m','start'));

    // столбики
    COLS.forEach(function(col,i){
      var acc = 0;
      col.parts.forEach(function(p){
        if(p.v > 0){
          svg.appendChild(el('rect',{
            x:sx(i-W), y:sy(acc+p.v),
            width:sx(i+W)-sx(i-W), height:sy(acc)-sy(acc+p.v),
            fill:col.c, opacity: 0.35 + 0.2*(p.l.indexOf('вес')===0||p.l.indexOf('база')===0?2:1),
            stroke:col.c,'stroke-width':LW}));
          var mid = acc + p.v/2;
          if(sy(acc)-sy(acc+p.v) > 16){
            svg.appendChild(txt(sx(i), sy(mid)+4, p.l+' · '+p.v+' ГБ','m'));
          } else {
            svg.appendChild(txt(sx(i+W)+PAD, sy(mid)+4, p.l+' · '+p.v+' ГБ','m','start'));
          }
        }
        acc += p.v;
      });
      // сумма над столбиком
      svg.appendChild(txt(sx(i), sy(col.total)-PAD*2, col.total+' ГБ','big'));
      // подписи под осью: имя выше, карта ниже
      svg.appendChild(txt(sx(i), sy(0)+PAD*3, col.name,'t'));
      svg.appendChild(txt(sx(i), sy(0)+PAD*6, col.gpu,'m'));
    });

    // переходы: стрелки между вершинами столбиков
    function drop(i, j, label, lift){
      var y = Math.max(COLS[i].total, COLS[j].total) + lift;
      var xa = sx(i+W*0.55), xb = sx(j-W*0.55);
      svg.appendChild(el('path',{
        d:'M'+xa+','+sy(COLS[i].total+1)+' L'+xa+','+sy(y)+
          ' L'+xb+','+sy(y)+' L'+xb+','+sy(COLS[j].total+1),
        fill:'none',stroke:'var(--muted)','stroke-width':LW,
        'marker-end':'url(#ah)'}));
      // подпись у хвоста, слева от вертикали
      svg.appendChild(txt(xa-PAD, sy(y)-PAD, label,'m','start'));
    }
    drop(0,1,'−38 ГБ: ушли градиенты и моменты Adam', 4);
    drop(1,2,'−12 ГБ: база сжата с 16 бит до 4', 20);

    host.appendChild(svg);
  }catch(e){
    host.innerHTML = '<div class="fail">Схема должна была показать три столбика ' +
      'видеопамяти на обучение модели 7B: полное дообучение 56 ГБ (A100 80GB) = ' +
      '16 ГБ веса + 16 ГБ градиенты + 32 ГБ моменты Adam; LoRA 18 ГБ (A100 40GB) = ' +
      'те же 16 ГБ замороженных весов + адаптеры и активации; QLoRA 6 ГБ (RTX 3090 24GB) = ' +
      'база в 4 битах ~4 ГБ + адаптеры и активации. Пол в 16 ГБ ниже LoRA не опускается.</div>';
  }
})();
</script>
</body>
</html>
