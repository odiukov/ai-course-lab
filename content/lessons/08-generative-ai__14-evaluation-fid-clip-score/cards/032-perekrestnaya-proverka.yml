- concept: случайный качественный аудит выявляет дефекты, скрытые агрегированными метриками
  question: Объясни своими словами, зачем при оценке генератора вручную проверять случайно выбранные результаты по заранее известным категориям ошибок, если уже рассчитаны автоматические метрики.
  explanation: 'Ручной аудит дополняет численные оценки: он обнаруживает конкретные повторяющиеся ошибки, которые могут почти не повлиять на средний балл. Случайная выборка также защищает отчёт от черри-пикинга.'
  kind: open
  reference: Агрегированные метрики сводят множество результатов к средним значениям и могут скрыть локальные, но заметные дефекты — например, ошибки анатомии, текста или числа объектов. Случайный отбор уменьшает риск выбрать только удачные примеры, а разметка по категориям показывает, какие именно слабые места остаются у модели.
  id: 032-perekrestnaya-proverka-2
  fingerprint: 7f2b69e7
