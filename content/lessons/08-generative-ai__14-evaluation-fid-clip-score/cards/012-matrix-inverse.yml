- concept: последовательность операций метода Гаусса — Жордана для обращения матрицы
  question: Расположи этапы вычисления обратной матрицы методом Гаусса — Жордана в правильном порядке.
  explanation: Элементарные преобразования выполняются одновременно над обеими половинами расширенной матрицы. Когда исходная матрица слева превращается в единичную, справа получается обратная.
  kind: order
  items:
    - Составить расширенную матрицу из исходной и единичной матриц
    - Найти опорный элемент текущего столбца и при необходимости переставить строки
    - Разделить опорную строку на опорный элемент
    - Обнулить остальные элементы текущего столбца с помощью опорной строки
    - После превращения левой половины в единичную вернуть правую половину
  id: 012-matrix-inverse-1
  fingerprint: ec3c05a7
- concept: отсутствие ненулевого опорного элемента выявляет необратимую матрицу
  question: В каком случае реализация метода Гаусса — Жордана должна сообщить, что квадратная матрица необратима?
  explanation: 'Нулевой элемент на диагонали ещё не доказывает необратимость: строку можно поменять с нижней. Матрица необратима, если подходящего ненулевого опорного элемента во всём оставшемся столбце нет.'
  kind: choice
  options:
    - Если текущий диагональный элемент равен нулю
    - Если в текущем столбце среди текущей и нижних строк нет ненулевого опорного элемента
    - Если в матрице встречаются отрицательные элементы
    - Если сумма диагональных элементов равна нулю
  correct: 1
  id: 012-matrix-inverse-2
  fingerprint: a7c70246
- concept: независимое копирование строк предотвращает изменение исходной матрицы
  question: Заполни пропуск так, чтобы последующие изменения элементов work не затрагивали исходную матрицу.
  explanation: Матрица представлена вложенными списками, поэтому нужно скопировать каждую строку. Копирование только внешнего списка оставило бы строки общими с исходной матрицей.
  kind: cloze
  template: work = [___ for row in matrix]
  answer: row.copy()
  accept:
    - row[:]
    - list(row)
  id: 012-matrix-inverse-3
  fingerprint: ac23bd88
