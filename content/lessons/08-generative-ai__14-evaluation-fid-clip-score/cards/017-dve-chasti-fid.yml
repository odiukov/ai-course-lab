- concept: в одномерном случае ковариационный вклад FID равен квадрату разности стандартных отклонений
  question: Два одномерных распределения признаков имеют одинаковые средние, а их дисперсии равны 9 и 25. Чему равен ковариационный вклад в FID?
  explanation: 'В одном измерении ковариационный вклад равен 9 + 25 − 2√(9·25) = 34 − 30 = 4. Это также квадрат разности стандартных отклонений: (3 − 5)².'
  kind: numeric
  answer: 4
  tolerance: 0.01
  id: 017-dve-chasti-fid-2
  fingerprint: e3eae0de
