- concept: глубина протокола оценки должна зависеть от этапа разработки и стоимости ошибки
  question: Объясни, почему для регулярного CI и финальной проверки перед релизом разумно использовать разные по глубине протоколы оценки одной модели.
  explanation: 'Минимальный протокол рассчитан на частый запуск: например, 200 слепых пар и 50 размеченных отказов. Перед релизом объём увеличивают до 2000 пар и 500 отказов, добавляя независимые автоматические проверки. Такой прогон примерно на порядок дороже, но цена пропущенной проблемы перед выпуском тоже выше.'
  kind: open
  reference: 'В CI нужен достаточно дешёвый минимальный набор проверок по всем столпам, чтобы быстро замечать регрессии. Перед релизом оправдан более дорогой протокол: дополнительные метрики, разрезы по категориям, больше человеческих сравнений и расширенный анализ безопасности уменьшают риск пропустить систематические дефекты.'
  id: 033-chetyre-stolpa-2
  fingerprint: 1f26b28f
