- concept: CLIP score вычисляется как косинусное сходство эмбеддингов изображения и текста
  question: Заполни пропуск в формуле вычисления CLIP score для сгенерированного изображения и промпта.
  explanation: CLIP кодирует изображение и текст в векторы, после чего вычисляется косинусное сходство между ними. Оно сравнивает направления векторов, а не их длины.
  kind: cloze
  template: clip_score = ___(CLIP_image(x_gen), CLIP_text(prompt))
  answer: cos_sim
  accept:
    - cosine_similarity
    - косинусное сходство
  id: 022-clip-kosinus-1
  fingerprint: 45c37605
- concept: CLIP может не замечать ошибки в композиционных отношениях между объектами
  question: Генератор изобразил все названные в промпте объекты, но перепутал их пространственные отношения. Несмотря на это, CLIP score оказался высоким. Как это интерпретировать?
  explanation: 'У CLIP ограничено композиционное мышление: наличие подходящих объектов может обеспечить высокую близость эмбеддингов, даже если порядок, положение или отношения между объектами переданы неверно.'
  kind: choice
  options:
    - Высокая оценка доказывает, что пространственные отношения переданы правильно
    - Ошибка возможна только из-за некорректного вычисления косинусного сходства
    - CLIP мог распознать основные объекты, но не уловить ошибку в их композиции
  correct: 2
  id: 022-clip-kosinus-2
  fingerprint: 6dc97fc6
- concept: декоративные слова в промпте могут искусственно повышать CLIP score без улучшения смыслового соответствия
  question: Объясни своими словами, почему добавление к промптам слов о высоком качестве и эффектном стиле может сделать сравнение генераторов по CLIP score недостоверным.
  explanation: 'Это prompt gaming: метрика реагирует на слова, статистически связанные с привлекательными изображениями, хотя смысловое соответствие содержательной части запроса не улучшается.'
  kind: open
  reference: Такие слова могут сдвигать текстовый эмбеддинг в сторону изображений, которые CLIP связывает с визуально привлекательным контентом, и тем самым повышать оценку без более точной передачи основных объектов и отношений промпта. Поэтому модели нужно сравнивать на одном фиксированном наборе промптов без выгодных одной из них декоративных приписок.
  id: 022-clip-kosinus-3
  fingerprint: a8980b63
