- concept: кэш признаков реального набора действителен только при неизменных данных и протоколе извлечения признаков
  question: Объясни, когда сохранённые признаки реального эталонного набора можно повторно использовать для расчёта метрики, а когда их необходимо пересчитать.
  explanation: Признаки реальной стороны не зависят от проверяемого чекпойнта, поэтому обычно вычисляются один раз. Но замена эталонного набора, версии экстрактора или правил ресайза и нормализации делает прежний кэш несовместимым с новыми сгенерированными признаками.
  kind: open
  reference: Кэш можно использовать, пока не изменились эталонные изображения, экстрактор признаков и предобработка. При изменении любого из этих компонентов реальные признаки нужно извлечь заново, иначе сравниваются статистики, полученные по разным протоколам.
