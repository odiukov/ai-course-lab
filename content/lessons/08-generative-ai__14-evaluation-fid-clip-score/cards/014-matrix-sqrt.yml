- concept: итерационное обновление квадратного корня диагональной матрицы выполняется независимо для каждого диагонального элемента
  question: Пусть A = diag(36, 49, 121), а текущее приближение R = diag(6, 8, 11). Чему равен средний диагональный элемент нового приближения, полученного усреднением R и A R⁻¹?
  explanation: Средний диагональный элемент R⁻¹ равен 0.125, поэтому соответствующий элемент A R⁻¹ равен 49 · 0.125 = 6.125. Среднее значений 8 и 6.125 равно 7.0625.
  kind: numeric
  answer: 7.0625
  tolerance: 0.0001
  id: 014-matrix-sqrt-1
  fingerprint: 7d5bd9ab
- concept: конечное число итераций и ошибки вычислений дают приближённый матричный корень
  question: Почему при итерационном вычислении матричного квадратного корня обычно проверяют близость результата к ожидаемой матрице, а не точное равенство?
  explanation: Итерационный алгоритм останавливается на конечном приближении, а арифметика с плавающей точкой вносит ошибки округления. Поэтому корректность оценивают с заданным допуском.
  kind: choice
  options:
    - Конечное число итераций и округление чисел с плавающей точкой оставляют небольшую погрешность
    - Обращение матрицы всегда меняет её размер
    - Матричный квадратный корень существует только у диагональных матриц
    - Каждая итерация намеренно добавляет к элементам случайный шум
