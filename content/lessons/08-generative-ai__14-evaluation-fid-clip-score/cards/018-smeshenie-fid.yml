- concept: FID, вычисленные при разных размерах выборки, нельзя напрямую сравнивать
  question: Объясни своими словами, почему сравнение двух моделей по FID некорректно, если метрики вычислены на выборках разного размера.
  explanation: FID смещён вверх при малом количестве изображений и обычно снижается по мере увеличения выборки. Следовательно, значения, рассчитанные при разных размерах выборок, находятся фактически на разных шкалах.
  kind: open
  reference: Размер выборки влияет не только на точность, но и на ожидаемое значение оценки FID. На меньшей выборке средние и ковариации оцениваются с большим шумом, который обычно увеличивает FID. Поэтому модель с большей выборкой может получить преимущество даже без лучшего распределения изображений; для честного сравнения размеры выборок должны совпадать.
