- concept: выборочная ковариация нормируется на число степеней свободы
  question: Отклонения одного признака от среднего равны −5, −5, 5 и 5. Чему равна несмещённая выборочная дисперсия?
  explanation: Сумма квадратов отклонений равна 100. Для четырёх наблюдений делитель n − 1 равен 3, поэтому дисперсия равна 100 / 3 ≈ 33.33.
  kind: numeric
  answer: 33.33
  tolerance: 0.01
  id: 008-covariance-1
  fingerprint: 1603088c
- concept: размер ковариационной матрицы определяется числом признаков
  question: В выборке восемь изображений, каждое представлено вектором из пяти признаков. Какой размер должна иметь ковариационная матрица?
  explanation: Каждая строка и каждый столбец соответствуют признаку, поэтому пять признаков дают матрицу 5 × 5. Число изображений влияет на оценку её элементов, но не на размер.
  kind: choice
  options:
    - 5 × 5
    - 8 × 8
    - 8 × 5
    - 5 × 8
  correct: 0
  id: 008-covariance-2
  fingerprint: 8dcb4f50
- concept: ковариационная матрица симметрична из-за коммутативности умножения
  question: Объясни своими словами, почему ковариация признака A с признаком B равна ковариации признака B с признаком A.
  explanation: Для каждого наблюдения произведения (A − mean_A)(B − mean_B) и (B − mean_B)(A − mean_A) совпадают. Их суммы и нормированные значения также совпадают, поэтому матрица симметрична.
  kind: open
  reference: В обеих ячейках складываются одинаковые произведения центрированных значений. Перестановка множителей не меняет произведение, поэтому соответствующие элементы матрицы равны.
  id: 008-covariance-3
  fingerprint: 58ef3a04
