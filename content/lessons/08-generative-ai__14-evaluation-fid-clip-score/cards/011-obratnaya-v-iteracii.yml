- concept: обратная матрица служит вспомогательной операцией при итерационном вычислении матричного корня
  question: Какова роль обращения матрицы в итерационном методе вычисления матричного корня?
  explanation: Обратная матрица не является готовым корнем. Итерационный метод сочетает текущее приближение с обратным преобразованием, чтобы уменьшать ошибку приближения.
  kind: choice
  options:
