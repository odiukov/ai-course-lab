- concept: потеря направления при линейном преобразовании делает его необратимым
  question: Почему у линейного преобразования A не может быть обратной матрицы, если существуют разные векторы u и v, для которых Au = Av?
  explanation: Если разные входы переходят в один выход, преобразование теряет информацию. Никакая матрица не сможет по этому выходу восстановить, какой из исходных векторов был подан.
