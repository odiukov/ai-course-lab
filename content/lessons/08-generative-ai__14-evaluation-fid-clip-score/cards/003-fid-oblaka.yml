- concept: несовпадение разнообразия выборок ухудшает ковариационную составляющую FID
  question: Объясни своими словами, почему коллекция правдоподобных изображений может получить плохой FID, если модель генерирует лишь узкий набор похожих сцен.
  explanation: FID учитывает не только положение центра облака признаков, но и его форму через ковариацию. Потеря разнообразия сужает сгенерированное облако и увеличивает расстояние до статистик реальной выборки.
  kind: open
  reference: Даже если каждое изображение выглядит правдоподобно, признаки сгенерированной выборки образуют слишком узкое облако. Его ковариация и форма отличаются от облака реальных данных, поэтому ковариационная составляющая FID увеличивается.
  id: 003-fid-oblaka-2
