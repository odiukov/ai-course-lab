- concept: знак ковариации показывает направление совместного изменения признаков
  question: Ковариация между двумя признаками отрицательна. Как это интерпретировать?
  explanation: Отрицательная ковариация означает, что отклонения признаков от их средних чаще имеют противоположные знаки. Положительная ковариация соответствует совместному изменению в одном направлении.
  kind: choice
  options:
    - При увеличении одного признака другой обычно уменьшается
    - Оба признака обычно отклоняются от среднего в одну сторону
    - Каждый признак имеет нулевую дисперсию
    - Средние значения признаков обязательно различаются
  correct: 0
  id: 007-kovariaciya-1
  fingerprint: 7ede1ebc
- concept: ковариационная матрица строится из внешних произведений центрированных векторов
  question: Вставьте выражение, вклад которого усредняют при вычислении ковариационной матрицы.
  explanation: Сначала из вектора признаков вычитают средний вектор, а затем умножают полученный столбец на его транспонированную строку. Так возникает матрица попарных произведений отклонений.
  kind: cloze
  template: 'Вклад наблюдения xᵢ в сумму для ковариационной матрицы: ___'
  answer: (xᵢ − μ)(xᵢ − μ)ᵀ
  accept:
    - (x_i - μ)(x_i - μ)^T
    - (x_i - mu)(x_i - mu)^T
    - внешнее произведение xᵢ − μ на себя
  id: 007-kovariaciya-2
  fingerprint: a679ec7c
- concept: диагональные и внедиагональные элементы ковариационной матрицы имеют разный смысл
  question: Объясните своими словами, что описывают диагональные и внедиагональные элементы ковариационной матрицы.
  explanation: Диагональ отвечает за ширину облака вдоль отдельных координат, а остальные элементы — за связи между координатами, влияющие на направление и форму облака.
  kind: open
  reference: Диагональные элементы равны дисперсиям отдельных признаков и характеризуют их собственный разброс. Внедиагональные элементы равны ковариациям пар признаков и показывают, как эти признаки изменяются совместно.
  id: 007-kovariaciya-3
  fingerprint: c3fe6559
