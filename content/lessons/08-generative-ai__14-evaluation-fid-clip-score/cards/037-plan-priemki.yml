- concept: число промптов и число сидов контролируют разные источники вариативности оценки
  question: Почему увеличение числа сидов для небольшого набора промптов не заменяет расширение самого набора промптов?
  explanation: Сиды измеряют чувствительность результата к случайному шуму, но не добавляют новых смысловых случаев. Узкий набор промптов может дать устойчивую, однако непредставительную оценку.
  kind: open
  reference: Дополнительные сиды показывают изменчивость генерации при тех же условиях, а новые промпты расширяют охват задач, понятий и конструкций. Для убедительной оценки нужны оба вида покрытия.
