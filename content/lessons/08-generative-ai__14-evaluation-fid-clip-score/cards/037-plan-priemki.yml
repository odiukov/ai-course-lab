- concept: приёмка требует одновременного прохождения основной метрики, защитных ограничений и критических проб
  question: Заполни логическое условие выпуска чекпойнта, если primary_ok означает достаточное улучшение основной метрики, guardrails_ok — соблюдение допусков, а no_critical_failures — отсутствие критических отказов.
  explanation: 'Это система совместных ворот: сильный результат по основной метрике не компенсирует недопустимую регрессию другой оси или критический отказ на целевой пробе.'
