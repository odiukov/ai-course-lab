- concept: ресайз изображений из разных исходных разрешений по-разному меняет распределение признаков Inception
  question: FID модели A посчитан на изображениях меньшего разрешения, а FID модели B — на изображениях большего разрешения. Перед извлечением признаков все изображения автоматически приводятся к размеру входа Inception. Можно ли напрямую сравнить эти значения?
  explanation: 'Приведение к одному размеру не устраняет различие протоколов: уменьшение изображений 512×512 и 1024×1024 до 299×299 по-разному влияет на детали и признаки. Для честного сравнения FID исходное разрешение должно совпадать.'
  kind: choice
  options:
    - Да, потому что на вход Inception поступают изображения одинакового размера
    - Да, если модели получили одинаковые текстовые промпты
    - Нет, потому что ресайз из разных исходных разрешений может сформировать разные распределения признаков
    - Нет, но только если изображения сохранены в разных файловых форматах
  correct: 2
