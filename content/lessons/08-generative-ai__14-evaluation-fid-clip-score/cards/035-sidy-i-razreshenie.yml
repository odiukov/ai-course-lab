- concept: отложенные промпты должны оставаться вне обучения и настройки до финальной оценки обобщения
  question: Расположите этапы оценки генеративной модели так, чтобы тестовые промпты действительно проверяли обобщение.
  explanation: Если тестовые промпты участвуют в обучении, подборе негативных промптов или выборе чекпоинта, высокий CLIP score либо Elo может отражать подстройку под бенчмарк. Оценивать отложенный набор нужно только после фиксации модели.
  kind: order
  items:
    - Сформировать тестовый набор промптов, отделённый от данных обучения и настройки
    - Обучать и настраивать модель, не используя тестовые промпты и результаты на них
    - Зафиксировать итоговый чекпоинт модели
    - Сгенерировать изображения по отложенным промптам и вычислить метрики
