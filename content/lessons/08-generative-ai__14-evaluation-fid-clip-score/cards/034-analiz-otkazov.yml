- concept: единая заранее заданная таксономия отказов делает ручной аудит сопоставимым и позволяет считать проблемы по категориям
  question: Команда хочет сравнить характер ошибок двух генераторов изображений по результатам ручного просмотра. Какой протокол лучше всего поддерживает такое сравнение?
  explanation: 'Общие категории и критерии превращают впечатления рецензентов в сопоставимые наблюдения: можно увидеть, какие типы отказов повторяются и чем профили ошибок моделей различаются.'
  kind: choice
  options:
    - Каждый рецензент свободно описывает только самые заметные недостатки
    - Для каждого генератора выбирают наиболее показательные удачные и неудачные изображения
    - Все изображения размечают по одному заранее определённому набору категорий отказов с одинаковыми критериями
