- concept: при равных рейтингах победитель получает половину коэффициента K
  question: Две модели имеют одинаковый рейтинг Elo. После победы одной из них рейтинг обновляют с коэффициентом K = 24. Сколько пунктов получит победитель?
  explanation: При равных рейтингах ожидаемый результат победителя равен 0,5, поэтому изменение составляет K × (1 − 0,5) = K / 2. При K = 24 победитель получает 12 пунктов.
  kind: numeric
  answer: 12
  tolerance: 0.001
  id: 029-elo-proverka-1
  fingerprint: 7e3b0b45
- concept: преимущество в рейтинге Elo выражает вероятность выбора, а не гарантирует исход отдельного сравнения
  question: Может ли модель с меньшим рейтингом Elo победить модель с большим рейтингом в отдельном сравнении?
  explanation: Разница в 100 Elo соответствует примерно 64% ожидаемых побед более рейтинговой модели. Оставшиеся сравнения может выигрывать модель с меньшим рейтингом, поэтому исход одной пары не предопределён.
  kind: choice
  options:
    - Да, потому что Elo описывает ожидаемую долю побед на серии сравнений, а не гарантирует каждый исход
    - Нет, больший рейтинг Elo однозначно определяет победителя каждой пары
    - Нет, проигрыш модели с большим рейтингом означает ошибку в расчёте Elo
    - Да, но только если после сравнения рейтинги обеих моделей не обновляются
