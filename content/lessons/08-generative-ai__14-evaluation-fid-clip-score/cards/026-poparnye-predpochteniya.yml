- concept: предпочтения экспертов и неспециалистов могут различаться из-за разных критериев оценки
  question: Объясните своими словами, почему расхождение между голосами экспертов и обычных пользователей не следует автоматически считать ошибкой разметки.
  explanation: Человеческое предпочтение зависит от аудитории. Объединение разных групп без описания их состава может скрыть важное различие между профессиональной оценкой и пользовательским выбором.
  kind: open
  reference: 'Группы могут обращать внимание на разные свойства изображения: эксперты замечают технические и смысловые ошибки, а обычные пользователи оценивают общее впечатление и практическую привлекательность. Поэтому состав судей нужно фиксировать, а результаты групп полезно анализировать раздельно.'
