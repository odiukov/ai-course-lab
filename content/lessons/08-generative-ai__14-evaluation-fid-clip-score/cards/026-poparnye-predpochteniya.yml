- concept: случайное размещение результатов по сторонам нейтрализует позиционное смещение
  question: В попарном тесте результат одного генератора всегда показывают слева, а другого — справа. Как исправить этот источник систематического смещения?
  explanation: Некоторые судьи чаще выбирают вариант на привычной стороне. Независимая случайная перестановка сторон не позволяет этому предпочтению систематически помогать одному генератору.
  kind: choice
  options:
    - Случайно назначать изображения левой и правой сторонам в каждом сравнении
    - Всегда помещать слева изображение с большим разрешением
    - Разрешить судьям узнать названия генераторов
    - Показывать изображения последовательно вместо одновременного сравнения
