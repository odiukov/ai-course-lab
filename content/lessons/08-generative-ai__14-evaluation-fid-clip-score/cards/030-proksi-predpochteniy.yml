- concept: модели оценки предпочтений учатся предсказывать человеческий выбор и учитывают качества шире текстового соответствия
  question: Два изображения одинаково точно передают содержание промпта, но у одного заметны неестественные детали и визуальные артефакты. Какой оценщик лучше подходит для автоматического прогноза того, какое изображение выберет большинство людей?
  explanation: HPSv2, ImageReward и PickScore обучаются на человеческих предпочтениях. Поэтому их оценки могут отражать не только соответствие промпту, но и правдоподобие деталей, отсутствие артефактов и общее визуальное впечатление.
  kind: choice
  options:
    - Модель предпочтений, обученная на человеческих сравнениях, например HPSv2, ImageReward или PickScore
    - Метрика попиксельного расстояния между изображениями
    - Классификатор категории изображённого объекта
    - Счётчик слов в исходном промпте
  correct: 0
  id: 030-proksi-predpochteniy-1
  fingerprint: eeb050da
- concept: сырые баллы разных моделей предпочтений нельзя напрямую сопоставлять из-за различия шкал
  question: Почему более высокий балл PickScore для одного изображения сам по себе не доказывает, что оно лучше изображения, оценённого только через ImageReward?
  explanation: Числа разных автоматических судей имеют разный масштаб и смысл. Корректное ранжирование требует фиксировать оценщик и протокол, а не сравнивать его сырой балл с баллом другой модели.
  kind: open
  reference: PickScore и ImageReward обучены отдельно и используют разные внутренние шкалы. Их абсолютные баллы не откалиброваны друг относительно друга, поэтому изображения следует сравнивать одним и тем же оценщиком, желательно внутри одного промпта.
  id: 030-proksi-predpochteniy-2
  fingerprint: 7f0f1134
- concept: автоматическая модель предпочтений является прокси человеческого выбора и требует проверки людьми
  question: Автоматический судья предпочёл результаты генератора A результатам генератора B. Какой вывод методологически корректен?
  explanation: Автоматический оценщик переносит закономерности из обучающих предпочтений и может наследовать их смещения или ошибаться на другой выборке промптов. Он ускоряет предварительный отбор, но не заменяет итоговую человеческую проверку.
  kind: choice
  options:
    - Судья прогнозирует человеческое предпочтение, но итоговый вывод желательно проверить на новых человеческих сравнениях
    - Генератор A объективно лучше при любых промптах и для любой аудитории
    - Человеческая оценка больше не нужна, поскольку автоматический балл является ground truth
    - Результат гарантирует, что каждый пользователь выберет генератор A
  correct: 0
