- concept: CLIP score оценивает соответствие изображения текстовому промпту
  question: Какую метрику следует выбрать, если нужно оценить, насколько сгенерированное изображение соответствует текстовому промпту?
  explanation: 'CLIP score измеряет косинусную близость между эмбеддингами изображения и текста: чем она выше, тем лучше изображение соответствует промпту. FID сравнивает распределения изображений, а Elo агрегирует результаты попарного выбора.'
  kind: choice
  options:
    - FID
    - CLIP score
    - Elo по попарным предпочтениям
    - Время генерации
  correct: 1
  id: 001-tri-osi-1
  fingerprint: '10822999'
- concept: низкий FID не гарантирует следование промпту или предпочтение людей
  question: Почему по более низкому FID нельзя сделать вывод, что текстово-условная генеративная модель лучше конкурента во всех отношениях?
  explanation: FID покрывает только одну ось оценки. Следование условию проверяет CLIP score, а выбор предпочтительного результата — попарная человеческая оценка, которую можно агрегировать в Elo.
  kind: open
  reference: FID оценивает близость распределения сгенерированных изображений к распределению реальных изображений, но непосредственно не измеряет соответствие промпту и человеческое предпочтение. Модель с низким FID может игнорировать текстовое условие или проигрывать в попарных сравнениях.
  id: 001-tri-osi-2
  fingerprint: a2b7e0d4
- concept: рейтинг Elo агрегирует победы моделей в попарных сравнениях
  question: Несколько генеративных моделей показывают людям попарно на одинаковых промптах. Люди каждый раз выбирают более удачный результат. Какой способ подходит для сведения таких побед в общий рейтинг?
  explanation: Elo преобразует результаты серии попарных сравнений в общий рейтинг моделей. Он отражает предпочтения оценщиков, тогда как FID сравнивает распределения, а CLIP score измеряет соответствие текста и изображения.
  kind: choice
  options:
    - Косинусная близость CLIP-эмбеддингов
    - Fréchet Inception Distance
    - Рейтинг Elo
    - Среднее разрешение изображений
  correct: 2
  id: 001-tri-osi-3
  fingerprint: b5b14c5e
