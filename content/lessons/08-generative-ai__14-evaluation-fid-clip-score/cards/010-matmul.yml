- concept: элемент произведения матриц равен скалярному произведению строки первой матрицы и столбца второй
  question: Заполни пропуск в выражении для элемента произведения матриц.
  explanation: Индекс k перебирает элементы строки i матрицы a и соответствующие элементы столбца j матрицы b. Их произведения складываются в result[i][j].
  kind: cloze
  template: result[i][j] = sum(a[i][k] * ___ for k in range(len(b)))
  answer: b[k][j]
