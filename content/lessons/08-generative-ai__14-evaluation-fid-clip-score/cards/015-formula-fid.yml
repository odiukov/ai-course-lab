- concept: FID достигает минимума только при одновременном совпадении средних и ковариаций
  question: При каком условии FID между двумя гауссовыми распределениями признаков достигает минимально возможного значения?
  explanation: FID складывает штраф за расхождение средних и штраф за расхождение ковариаций. Минимум достигается, только когда оба штрафа одновременно исчезают.
  kind: choice
  options:
    - Совпадают только средние векторы
    - Совпадают только ковариационные матрицы
    - Одновременно совпадают средние векторы и ковариационные матрицы
    - Совпадают следы ковариационных матриц
  correct: 2
  id: 015-formula-fid-1
  fingerprint: 6ceff96a
- concept: одно значение FID не показывает соотношение ошибок центра и формы
  question: Две модели получили одинаковый FID. Можно ли из этого заключить, что у них одинаково расходятся с реальными данными и центры, и формы распределений признаков? Объясни своими словами.
  explanation: Одна модель может сильнее ошибаться в положении центра, а другая — в форме облака признаков. Если суммы двух штрафов равны, итоговые FID совпадут, хотя причины расхождения будут разными.
  kind: open
  reference: Нет. FID хранит только сумму вклада расхождения средних и вклада расхождения ковариаций. Одинаковая сумма может получиться при разных сочетаниях этих вкладов.
  id: 015-formula-fid-2
  fingerprint: bf1643a3
