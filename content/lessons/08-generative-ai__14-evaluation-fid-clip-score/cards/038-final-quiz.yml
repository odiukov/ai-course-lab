  fingerprint: 3bd002b6
- concept: согласие скорера предпочтений измеряется долей правильно упорядоченных отложенных пар
  question: На отложенной выборке из 80 пар скорер поставил выбранное человеком изображение выше второго изображения в 61 случае. Каково согласие скорера с людьми в процентах?
  explanation: 'Согласие равно доле совпавших решений: 61 / 80 × 100% = 76.25%.'
  kind: numeric
  answer: 76.25
  tolerance: 0.01
