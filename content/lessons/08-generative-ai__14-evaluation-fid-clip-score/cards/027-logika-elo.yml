- concept: симметричное обновление Elo сохраняет сумму рейтингов пары
  question: До матча рейтинг модели A равен 1375, а модели B — 1525. После победы рейтинг A вырос на 21 пункт. Каким стал рейтинг B?
  explanation: 'В приведённом обновлении Elo победитель получает столько же пунктов, сколько проигравший теряет. Поэтому рейтинг B уменьшается на 21: 1525 − 21 = 1504.'
  kind: numeric
  answer: 1504
  tolerance: 0.01
  id: 027-logika-elo-2
  fingerprint: d30ac267
- concept: коэффициент K управляет чувствительностью рейтинга Elo к результату матча
  question: Две системы Elo обрабатывают один и тот же матч при одинаковых исходных рейтингах, но используют разные значения K. Объясни, как большее значение K повлияет на обновление рейтингов.
  explanation: В формуле R′A = RA + K(SA − EA) коэффициент K масштабирует разность фактического и ожидаемого результатов. Чем больше K, тем быстрее и резче рейтинг реагирует на каждый матч.
  kind: open
  reference: 'Ожидаемый результат останется тем же, потому что он зависит от исходных рейтингов. Большее K пропорционально увеличит изменения рейтингов обеих моделей: победитель получит больше пунктов, а проигравший столько же дополнительно потеряет.'
