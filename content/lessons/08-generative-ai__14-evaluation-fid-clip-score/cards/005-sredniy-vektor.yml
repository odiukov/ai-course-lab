- concept: средний вектор признаков вычисляется покоординатным усреднением векторов выборки
  question: Объясни своими словами, как по набору векторов признаков изображений вычислить средний вектор.
  explanation: 'Координаты не смешиваются между собой: каждая усредняется по всей выборке независимо. Поэтому средний вектор остаётся точкой в том же пространстве признаков, что и исходные векторы.'
  kind: open
  reference: Для каждой координаты нужно отдельно найти среднее значение по всем изображениям, а затем собрать полученные значения в один вектор.
  id: 005-sredniy-vektor-1
  fingerprint: 9b9aee42
- concept: вклад расхождения центров в FID равен квадрату евклидова расстояния между средними векторами
  question: Средние векторы реальных и сгенерированных изображений равны μ_r = (5, 7) и μ_g = (11, 15). Чему равна составляющая FID, отвечающая за различие центров?
  explanation: Разности координат равны 6 и 8. Квадрат евклидова расстояния между центрами равен 6 × 6 + 8 × 8 = 100.
  kind: numeric
  answer: 100
  tolerance: 0.001
  id: 005-sredniy-vektor-2
  fingerprint: 55f39982
