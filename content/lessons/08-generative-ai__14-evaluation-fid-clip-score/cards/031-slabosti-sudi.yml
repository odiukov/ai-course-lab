- concept: предварительная фиксация и документирование распределения промптов защищают арену от черри-пикинга
  question: Расположите действия по подготовке воспроизводимого набора промптов для модельной арены в правильном порядке.
  explanation: Если выбирать задания после просмотра результатов, можно незаметно дать преимущество одной модели. Предварительно заданные категории, пропорции и полный опубликованный список делают выводы проверяемыми и показывают, какое именно распределение задач измеряет рейтинг.
  kind: order
  items:
    - Определить целевые сценарии использования и категории запросов
    - Заранее зафиксировать пропорции категорий и правила отбора
    - Сформировать и заморозить полный список промптов до просмотра результатов моделей
    - Провести сравнение и опубликовать рейтинг вместе со списком промптов, категориями и пропорциями
