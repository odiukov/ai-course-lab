- concept: несколько случайных запусков и стандартное отклонение показывают устойчивость FID
  question: Почему для оценки модели недостаточно опубликовать FID одного случайного запуска?
  explanation: Один сид может случайно приукрасить результат. Минимум три запуска и стандартное отклонение позволяют увидеть типичный уровень FID и его изменчивость.
  kind: open
  reference: Случайная инициализация и генерация могут сделать отдельный запуск необычно удачным или неудачным. Поэтому FID следует измерять на нескольких независимых сидах и сообщать среднее вместе со стандартным отклонением.
