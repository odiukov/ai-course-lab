  fingerprint: 7a7a145e
- concept: CMMD снижает возможность искусственно улучшить оценку подгонкой генератора под особенности Inception
  question: Почему генератор может получить хороший FID без сопоставимого улучшения воспринимаемого качества и какую метрику материал предлагает для противодействия такой подгонке?
  explanation: Низкое расстояние в конкретном пространстве признаков не гарантирует общего роста визуального качества. CMMD предназначена для снижения зависимости оценки от подгонки под приор Inception.
  kind: open
  reference: FID измеряется в признаках Inception, поэтому генератор можно подстроить под статистические особенности этого пространства, не улучшив изображения в целом. В качестве средства против такого gaming используется CMMD.
  id: 021-zameny-fid-2
  fingerprint: 6b4db767
