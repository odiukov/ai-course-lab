<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Геометрия двух распределений в FID</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f8fc;
    --panel: #ffffff;
    --ink: #172033;
    --muted: #626d82;
    --grid: #cbd2df;
    --real: #2878c8;
    --real-fill: #2878c833;
    --generated: #dc6b28;
    --generated-fill: #dc6b2833;
    --connector: #8c96a8;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151923;
      --panel: #1d2330;
      --ink: #eef2fa;
      --muted: #aab3c5;
      --grid: #465064;
      --real: #69b8ff;
      --real-fill: #69b8ff33;
      --generated: #ff9a5c;
      --generated-fill: #ff9a5c33;
      --connector: #7e899e;
    }
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .figure {
    background: var(--bg);
  }

  .title {
    color: var(--ink);
    font-size: 20px;
    font-weight: bold;
  }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 520px;
    background: var(--bg);
  }

  .panel {
    fill: var(--panel);
    stroke: var(--grid);
    stroke-width: 1.4px;
  }

  .guide {
    stroke: var(--grid);
    stroke-width: 1px;
  }

  .connector {
    stroke: var(--connector);
    stroke-width: 1.5px;
    stroke-dasharray: 5px 5px;
  }

  .real-ellipse {
    fill: var(--real-fill);
    stroke: var(--real);
    stroke-width: 2.4px;
  }

  .generated-ellipse {
    fill: var(--generated-fill);
    stroke: var(--generated);
    stroke-width: 2.4px;
  }

  .real-point { fill: var(--real); }
  .generated-point { fill: var(--generated); }

  .real-mark {
    stroke: var(--real);
    stroke-width: 2.4px;
  }

  .generated-mark {
    stroke: var(--generated);
    stroke-width: 2.4px;
  }

  .heading {
    fill: var(--ink);
    font-size: 19px;
    font-weight: bold;
  }

  .caption {
    fill: var(--muted);
    font-size: 13px;
  }

  .real-label {
    fill: var(--real);
    font-size: 15px;
    font-weight: bold;
  }

  .generated-label {
    fill: var(--generated);
    font-size: 15px;
    font-weight: bold;
  }

  .legend {
    fill: var(--muted);
    font-size: 13px;
  }

  .fallback {
    color: var(--ink);
    font-size: 16px;
  }
</style>
</head>
<body>
<figure class="figure" aria-labelledby="diagram-title">
  <figcaption>
    <div class="title" id="diagram-title">Геометрия двух распределений в FID</div>
    <div class="subtitle">FID сравнивает и положение центров, и форму облаков признаков</div>
  </figcaption>
  <svg id="diagram" viewBox="0 0 1000 420" role="img"
       aria-label="Сравнение почти совпадающих и сильно различающихся распределений признаков"
       preserveAspectRatio="xMidYMid meet"></svg>
  <div id="fallback" class="fallback" hidden></div>
</figure>

<script>
const data = [
  {
    id: "low",
    frame: { x1: 4, y1: 7, x2: 48, y2: 34 },
    heading: { x: 26, y: 38, text: "FID ≈ 5" },
    caption: { x: 26, y: 35.7, text: "центры и ковариации почти совпали" },
    clouds: [
      {
        type: "real",
        cx: 24.2, cy: 20.5, rx: 12, ry: 5.1, angle: -18,
        sigma: { x: 13.8, y: 27.4, dx: -8, dy: -8, anchor: "end", text: "Σ_r" },
        mu: { dx: -8, dy: -10, anchor: "end", text: "μ_r" },
        points: [
          [-9.2, 2.1], [-7.8, -0.6], [-6.5, 3], [-5.4, 0.8],
          [-4.1, -2.2], [-3.1, 2.3], [-1.8, -0.4], [-0.6, 1.7],
          [0.7, -2.3], [1.6, 0.2], [2.9, 2.5], [4.1, -1.1],
          [5.3, 1.1], [6.4, -2.4], [7.2, 0.5], [8.8, -1.2]
        ]
      },
      {
        type: "generated",
        cx: 25.5, cy: 19.7, rx: 11.3, ry: 4.8, angle: -14,
        sigma: { x: 36.6, y: 14.4, dx: 8, dy: 14, anchor: "start", text: "Σ_g" },
        mu: { dx: 8, dy: 15, anchor: "start", text: "μ_g" },
        points: [
          [-8.7, 1.4], [-7.5, -1], [-6.2, 2.5], [-5.2, -0.1],
          [-3.9, 1.8], [-2.7, -2.3], [-1.4, 0.6], [-0.2, -1.2],
          [1.1, 2.1], [2.3, -0.4], [3.6, 1.2], [4.8, -2],
          [5.8, 0.3], [6.7, -1.2], [7.9, 1.1], [9, -0.8]
        ]
      }
    ]
  },
  {
    id: "high",
    frame: { x1: 52, y1: 7, x2: 96, y2: 34 },
    heading: { x: 74, y: 38, text: "FID ≈ 100" },
    caption: { x: 74, y: 35.7, text: "сдвиг центра и другая геометрия" },
    clouds: [
      {
        type: "real",
        cx: 66.5, cy: 21.5, rx: 11.4, ry: 4.5, angle: -24,
        sigma: { x: 56.8, y: 28.4, dx: -8, dy: -8, anchor: "end", text: "Σ_r" },
        mu: { dx: -8, dy: -10, anchor: "end", text: "μ_r" },
        points: [
          [-9, 2.2], [-7.8, -0.2], [-6.7, 2.8], [-5.5, 0.5],
          [-4.3, -1.8], [-3.2, 1.7], [-2, -0.4], [-0.8, 1.1],
          [0.5, -1.9], [1.7, 0.2], [2.8, 1.8], [4, -1.2],
          [5.1, 0.7], [6.2, -1.8], [7.3, 0.1], [8.8, -1.5]
        ]
      },
      {
        type: "generated",
        cx: 84, cy: 17.2, rx: 4.8, ry: 7.7, angle: 27,
        sigma: { x: 90, y: 25.7, dx: 8, dy: -8, anchor: "start", text: "Σ_g" },
        mu: { dx: 8, dy: 15, anchor: "start", text: "μ_g" },
        points: [
          [-2.7, 5.5], [-0.8, 4.2], [1.2, 4.8], [2.4, 3.1],
          [-2.2, 2.4], [-0.4, 2], [1.6, 1.8], [3, 0.8],
          [-2.8, 0.1], [-1, -0.4], [0.8, -0.8], [2.4, -1.7],
          [-2.2, -2.4], [-0.5, -3], [1.5, -3.7], [2.2, -5.2]
        ]
      }
    ]
  }
];

const origin = { x: 0, y: 400 };
const scale = 10;

const sx = x => origin.x + x * scale;
const sy = y => origin.y - y * scale;

try {
  const svg = document.getElementById("diagram");
  const ns = "http://www.w3.org/2000/svg";
  const pointRadius = 0.19;
  const centerSize = 0.48;

  const add = (name, attrs, text) => {
    const node = document.createElementNS(ns, name);
    for (const [key, value] of Object.entries(attrs)) {
      node.setAttribute(key, value);
    }
    if (text !== undefined) node.textContent = text;
    svg.appendChild(node);
    return node;
  };

  const addText = (item, className) => add("text", {
    x: sx(item.x) + (item.dx || origin.x),
    y: sy(item.y) + (item.dy || origin.x),
    "text-anchor": item.anchor || "middle",
    "dominant-baseline": "middle",
    class: className
  }, item.text);

  for (const panel of data) {
    const frame = panel.frame;

    add("rect", {
      x: sx(frame.x1),
      y: sy(frame.y2),
      width: sx(frame.x2) - sx(frame.x1),
      height: sy(frame.y1) - sy(frame.y2),
      class: "panel"
    });

    addText(panel.heading, "heading");
    addText(panel.caption, "caption");

    const [real, generated] = panel.clouds;

    add("line", {
      x1: sx(real.cx),
      y1: sy(real.cy),
      x2: sx(generated.cx),
      y2: sy(generated.cy),
      class: "connector"
    });

    for (const cloud of panel.clouds) {
      add("ellipse", {
        cx: sx(cloud.cx),
        cy: sy(cloud.cy),
        rx: Math.abs(sx(cloud.cx + cloud.rx) - sx(cloud.cx)),
        ry: Math.abs(sy(cloud.cy + cloud.ry) - sy(cloud.cy)),
        transform: `rotate(${cloud.angle} ${sx(cloud.cx)} ${sy(cloud.cy)})`,
        class: `${cloud.type}-ellipse`
      });
    }

    for (const cloud of panel.clouds) {
      for (const [dx, dy] of cloud.points) {
        add("circle", {
          cx: sx(cloud.cx + dx),
          cy: sy(cloud.cy + dy),
          r: Math.abs(sx(pointRadius) - sx(origin.x)),
          class: `${cloud.type}-point`
        });
      }
    }

    for (const cloud of panel.clouds) {
      add("line", {
        x1: sx(cloud.cx - centerSize),
        y1: sy(cloud.cy),
        x2: sx(cloud.cx + centerSize),
        y2: sy(cloud.cy),
        class: `${cloud.type}-mark`
      });

      add("line", {
        x1: sx(cloud.cx),
        y1: sy(cloud.cy - centerSize),
        x2: sx(cloud.cx),
        y2: sy(cloud.cy + centerSize),
        class: `${cloud.type}-mark`
      });

      addText({
        x: cloud.cx,
        y: cloud.cy,
        dx: cloud.mu.dx,
        dy: cloud.mu.dy,
        anchor: cloud.mu.anchor,
        text: cloud.mu.text
      }, `${cloud.type}-label`);

      addText(cloud.sigma, `${cloud.type}-label`);
    }
  }

  add("line", {
    x1: sx(19),
    y1: sy(3.6),
    x2: sx(24),
    y2: sy(3.6),
    class: "real-ellipse"
  });

  addText({
    x: 24.8, y: 3.6, dx: 8, dy: 0,
    anchor: "start", text: "реальные признаки"
  }, "legend");

  add("line", {
    x1: sx(52.5),
    y1: sy(3.6),
    x2: sx(57.5),
    y2: sy(3.6),
    class: "generated-ellipse"
  });

  addText({
    x: 58.3, y: 3.6, dx: 8, dy: 0,
    anchor: "start", text: "признаки генератора"
  }, "legend");
} catch (error) {
  document.getElementById("diagram").hidden = true;
  const fallback = document.getElementById("fallback");
  fallback.hidden = false;
  fallback.textContent =
    "Схема должна была показать два облака признаков: почти совпадающие при FID около 5 и разнесённые, с разными центрами μ_r, μ_g и ковариациями Σ_r, Σ_g, при FID около 100.";
}
</script>
</body>
</html>
