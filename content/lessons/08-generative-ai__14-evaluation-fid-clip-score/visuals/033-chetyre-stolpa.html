<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Четыре столпа отчёта об оценке</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fc;
      --panel: #ffffff;
      --panel-soft: #eef2f8;
      --ink: #172033;
      --muted: #5d687d;
      --frame: #cbd3e1;
      --flow: #64748b;
      --decision: #172033;
      --decision-ink: #ffffff;
      --sample: #2878b8;
      --sample-soft: #e8f4fc;
      --prompt: #16856b;
      --prompt-soft: #e4f7f1;
      --preference: #7957b6;
      --preference-soft: #f0eafb;
      --failure: #c15348;
      --failure-soft: #fbeceb;
      --focus: #f0b429;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #101622;
        --panel: #182131;
        --panel-soft: #202b3e;
        --ink: #edf2fa;
        --muted: #b5c0d2;
        --frame: #3c4960;
        --flow: #9eabc0;
        --decision: #e8eef8;
        --decision-ink: #111827;
        --sample: #65b9ee;
        --sample-soft: #17344a;
        --prompt: #5cd1af;
        --prompt-soft: #153b35;
        --preference: #b89be7;
        --preference-soft: #302744;
        --failure: #f28b82;
        --failure-soft: #462927;
        --focus: #ffd166;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: unset;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      padding: 16px;
    }

    figure {
      margin: unset;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--frame);
    }

    h1 {
      margin: unset;
      padding: 18px 22px 10px;
      color: var(--ink);
      font-size: 25px;
      line-height: normal;
      font-weight: bold;
      letter-spacing: -0.02em;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 440px;
      background: var(--panel);
    }

    .guide-label {
      fill: var(--muted);
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.08em;
    }

    .pillar-shaft {
      fill: var(--panel-soft);
      stroke: var(--frame);
      stroke-width: 2px;
    }

    .pillar-cap,
    .pillar-base {
      stroke-width: 2px;
    }

    .sample .pillar-cap,
    .sample .pillar-base {
      fill: var(--sample-soft);
      stroke: var(--sample);
    }

    .prompt .pillar-cap,
    .prompt .pillar-base {
      fill: var(--prompt-soft);
      stroke: var(--prompt);
    }

    .preference .pillar-cap,
    .preference .pillar-base {
      fill: var(--preference-soft);
      stroke: var(--preference);
    }

    .failure .pillar-cap,
    .failure .pillar-base {
      fill: var(--failure-soft);
      stroke: var(--failure);
    }

    .sample .pillar-kicker {
      fill: var(--sample);
    }

    .prompt .pillar-kicker {
      fill: var(--prompt);
    }

    .preference .pillar-kicker {
      fill: var(--preference);
    }

    .failure .pillar-kicker {
      fill: var(--failure);
    }

    .pillar-kicker {
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 0.04em;
    }

    .pillar-metric {
      fill: var(--ink);
      font-size: 21px;
      font-weight: bold;
    }

    .pillar-note {
      fill: var(--muted);
      font-size: 14px;
    }

    .flow {
      stroke: var(--flow);
      stroke-width: 3px;
      stroke-linecap: round;
    }

    .flow-head {
      fill: var(--flow);
    }

    .flow-origin {
      fill: var(--panel);
      stroke: var(--flow);
      stroke-width: 3px;
    }

    .decision-halo {
      fill: var(--panel);
      stroke: var(--focus);
      stroke-width: 3px;
    }

    .decision-box {
      fill: var(--decision);
      stroke: var(--decision);
      stroke-width: 2px;
    }

    .decision-title {
      fill: var(--decision-ink);
      font-size: 22px;
      font-weight: bold;
    }

    .decision-note {
      fill: var(--decision-ink);
      font-size: 14px;
    }

    .footer-note {
      fill: var(--muted);
      font-size: 14px;
    }

    .fallback {
      fill: var(--ink);
      font-size: 17px;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title">
    <h1 id="diagram-title">Четыре столпа отчёта об оценке</h1>
    <svg
      id="diagram"
      viewBox="0 0 1100 410"
      width="1100"
      height="410"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-title diagram-description"
    >
      <desc id="diagram-description">
        FID на 10k, CLIP score на 30k, 200 слепых пар и 50 вручную
        размеченных результатов дают четыре независимых сигнала, которые
        сходятся в единое решение о релизе.
      </desc>
      <g id="scene"></g>
    </svg>
  </figure>

  <script>
    const data = [
      {
        kind: "layout",
        guideY: 22,
        pillarY: 44,
        pillarWidth: 220,
        pillarHeight: 180,
        capitalHeight: 14,
        baseHeight: 16,
        shaftInset: 14,
        half: 0.5,
        kickerOffset: 48,
        metricOffset: 91,
        noteOffset: 124,
        arrowTailOffset: 7,
        arrowLength: 15,
        arrowWing: 7,
        originDotRadius: 4,
        decisionX: 330,
        decisionY: 310,
        decisionWidth: 440,
        decisionHeight: 66,
        decisionHalo: 8,
        decisionCorner: 12,
        decisionTitleOffset: 29,
        decisionNoteOffset: 51,
        footerY: 400,
        fallbackX: 550,
        fallbackY: 196
      },
      {
        kind: "pillar",
        theme: "sample",
        x: 50,
        targetX: 390,
        kicker: "КАЧЕСТВО ВЫБОРКИ",
        metric: "FID на 10k",
        note: "против реальных данных"
      },
      {
        kind: "pillar",
        theme: "prompt",
        x: 310,
        targetX: 495,
        kicker: "СЛЕДОВАНИЕ ПРОМПТУ",
        metric: "CLIP score на 30k",
        note: "проверка связи с промптом"
      },
      {
        kind: "pillar",
        theme: "preference",
        x: 570,
        targetX: 605,
        kicker: "ПРЕДПОЧТЕНИЕ",
        metric: "200 слепых пар",
        note: "против бейзлайна"
      },
      {
        kind: "pillar",
        theme: "failure",
        x: 830,
        targetX: 710,
        kicker: "АНАЛИЗ ОТКАЗОВ",
        metric: "50 результатов",
        note: "размечены вручную"
      },
      {
        kind: "copy",
        guide: "ЧЕТЫРЕ НЕЗАВИСИМЫХ ИСТОЧНИКА СИГНАЛА",
        decision: "Единое решение о релизе",
        decisionNote: "выпускать модель или продолжить проверку",
        footer:
          "Релиз убедителен, только когда четыре сигнала не противоречат друг другу",
        fallback:
          "Схема должна показать четыре столпа оценки, ведущие к единому решению о релизе."
      }
    ];

    const origin = { x: 0, y: 0 };
    const scale = 1;

    const sx = x => origin.x + x * scale;
    const sy = y => origin.y + y * scale;

    const NS = "http://www.w3.org/2000/svg";
    const svg = document.querySelector("#diagram");
    const scene = document.querySelector("#scene");
    const layout = data.find(item => item.kind === "layout");
    const copy = data.find(item => item.kind === "copy");
    const pillars = data.filter(item => item.kind === "pillar");

    function element(name, attributes, parent) {
      const node = document.createElementNS(NS, name);
      Object.entries(attributes).forEach(([key, value]) => {
        node.setAttribute(key, String(value));
      });
      parent.appendChild(node);
      return node;
    }

    function label(parent, className, x, y, value, anchor) {
      const node = element(
        "text",
        {
          class: className,
          x: sx(x),
          y: sy(y),
          "text-anchor": anchor
        },
        parent
      );
      node.textContent = value;
      return node;
    }

    function rectangle(parent, className, x, y, width, height, corner) {
      return element(
        "rect",
        {
          class: className,
          x: sx(x),
          y: sy(y),
          width: sx(x + width) - sx(x),
          height: sy(y + height) - sy(y),
          rx: sx(corner) - sx(0),
          ry: sy(corner) - sy(0)
        },
        parent
      );
    }

    function arrow(parent, start, end) {
      const dx = end.x - start.x;
      const dy = end.y - start.y;
      const magnitude = Math.hypot(dx, dy);
      const ux = dx / magnitude;
      const uy = dy / magnitude;
      const base = {
        x: end.x - ux * layout.arrowLength,
        y: end.y - uy * layout.arrowLength
      };
      const left = {
        x: base.x - uy * layout.arrowWing,
        y: base.y + ux * layout.arrowWing
      };
      const right = {
        x: base.x + uy * layout.arrowWing,
        y: base.y - ux * layout.arrowWing
      };

      element(
        "line",
        {
          class: "flow",
          x1: sx(start.x),
          y1: sy(start.y),
          x2: sx(base.x),
          y2: sy(base.y)
        },
        parent
      );

      element(
        "polygon",
        {
          class: "flow-head",
          points: [
            `${sx(end.x)},${sy(end.y)}`,
            `${sx(left.x)},${sy(left.y)}`,
            `${sx(right.x)},${sy(right.y)}`
          ].join(" ")
        },
        parent
      );

      element(
        "circle",
        {
          class: "flow-origin",
          cx: sx(start.x),
          cy: sy(start.y),
          r:
            sx(start.x + layout.originDotRadius) -
            sx(start.x)
        },
        parent
      );
    }

    try {
      label(
        scene,
        "guide-label",
        layout.fallbackX,
        layout.guideY,
        copy.guide,
        "middle"
      );

      pillars.forEach(pillar => {
        const group = element(
          "g",
          {
            class: `pillar ${pillar.theme}`,
            "aria-label": `${pillar.kicker}: ${pillar.metric}, ${pillar.note}`
          },
          scene
        );

        rectangle(
          group,
          "pillar-cap",
          pillar.x,
          layout.pillarY,
          layout.pillarWidth,
          layout.capitalHeight,
          origin.x
        );

        rectangle(
          group,
          "pillar-shaft",
          pillar.x + layout.shaftInset,
          layout.pillarY + layout.capitalHeight,
          layout.pillarWidth - layout.shaftInset - layout.shaftInset,
          layout.pillarHeight -
            layout.capitalHeight -
            layout.baseHeight,
          origin.x
        );

        rectangle(
          group,
          "pillar-base",
          pillar.x,
          layout.pillarY + layout.pillarHeight - layout.baseHeight,
          layout.pillarWidth,
          layout.baseHeight,
          origin.x
        );

        const centerX =
          pillar.x + layout.pillarWidth * layout.half;

        label(
          group,
          "pillar-kicker",
          centerX,
          layout.pillarY + layout.kickerOffset,
          pillar.kicker,
          "middle"
        );

        label(
          group,
          "pillar-metric",
          centerX,
          layout.pillarY + layout.metricOffset,
          pillar.metric,
          "middle"
        );

        label(
          group,
          "pillar-note",
          centerX,
          layout.pillarY + layout.noteOffset,
          pillar.note,
          "middle"
        );
      });

      const arrows = element(
        "g",
        { "aria-label": "Сигналы сходятся к решению" },
        scene
      );

      pillars.forEach(pillar => {
        arrow(
          arrows,
          {
            x: pillar.x + layout.pillarWidth * layout.half,
            y:
              layout.pillarY +
              layout.pillarHeight +
              layout.arrowTailOffset
          },
          {
            x: pillar.targetX,
            y: layout.decisionY
          }
        );
      });

      rectangle(
        scene,
        "decision-halo",
        layout.decisionX - layout.decisionHalo,
        layout.decisionY - layout.decisionHalo,
        layout.decisionWidth + layout.decisionHalo + layout.decisionHalo,
        layout.decisionHeight + layout.decisionHalo + layout.decisionHalo,
        layout.decisionCorner
      );

      rectangle(
        scene,
        "decision-box",
        layout.decisionX,
        layout.decisionY,
        layout.decisionWidth,
        layout.decisionHeight,
        layout.decisionCorner
      );

      const decisionCenter =
        layout.decisionX + layout.decisionWidth * layout.half;

      label(
        scene,
        "decision-title",
        decisionCenter,
        layout.decisionY + layout.decisionTitleOffset,
        copy.decision,
        "middle"
      );

      label(
        scene,
        "decision-note",
        decisionCenter,
        layout.decisionY + layout.decisionNoteOffset,
        copy.decisionNote,
        "middle"
      );

      label(
        scene,
        "footer-note",
        layout.fallbackX,
        layout.footerY,
        copy.footer,
        "middle"
      );
    } catch (error) {
      scene.replaceChildren();
      const fallback = document.createElementNS(NS, "text");
      fallback.setAttribute("class", "fallback");
      fallback.setAttribute("x", String(sx(layout.fallbackX)));
      fallback.setAttribute("y", String(sy(layout.fallbackY)));
      fallback.setAttribute("text-anchor", "middle");
      fallback.textContent = copy.fallback;
      scene.appendChild(fallback);
      console.error(error);
    }
  </script>
</body>
</html>
