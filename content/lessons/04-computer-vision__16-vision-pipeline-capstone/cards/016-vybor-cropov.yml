- concept: после фильтрации кропов предсказания классификатора связывают с сохранёнными индексами исходных детекций
  question: Детектор выдал объекты A, B, C и D. Кропы B и D отфильтрованы, а классификатор обработал кропы A и C. Как корректно привязать его ответы к детекциям?
  explanation: Фильтрация меняет позиции элементов в списке кропов. Поэтому при добавлении каждого пригодного кропа нужно сохранить индекс породившей его детекции, а затем использовать эти индексы при сборке результатов.
  kind: choice
  options:
    - Привязать ответы к первым элементам полного списка детекций
    - Сопоставить каждый ответ с сохранённым исходным индексом соответствующего кропа
    - Отсортировать ответы по уверенности и сопоставить в таком порядке
    - Привязать ответы только по предсказанному классу
  correct: 1
  id: 016-vybor-cropov-1
  fingerprint: 69a65bf7
- concept: перед объединением кропов в пакет их пространственные размеры приводят к единой форме
  question: Почему кропы разных размеров нельзя сразу объединить через torch.stack и как подготовить их для пакетной классификации?
  explanation: После вырезания кропы обычно имеют разные высоту и ширину. Интерполяция приводит их к общей пространственной форме, после чего из них можно построить единый батч для классификатора.
  kind: open
  reference: torch.stack требует, чтобы формы всех тензоров совпадали. Каждый кроп нужно масштабировать до общей высоты и ширины, сохранив одинаковое число каналов, и только затем объединить их по новой пакетной оси.
  id: 016-vybor-cropov-2
  fingerprint: cd4e18a2
- concept: прямоугольный кроп из CHW-тензора вырезается по осям высоты и ширины с сохранением всех каналов
  question: Заполни пропуск в срезе CHW-тензора, чтобы выбрать строки кропа и сохранить все цветовые каналы.
  explanation: Первая ось CHW-тензора содержит каналы, поэтому двоеточие сохраняет их все. Вторая ось задаёт диапазон строк, а третья — диапазон столбцов.
