- concept: таймаут необязательного классификатора допускает явный частичный fallback без потери детекций
  question: Объясни своими словами, что должен вернуть vision-сервис, если детектор успешно нашёл объекты, а классификатор превысил таймаут.
  explanation: Детекции остаются полезным и достоверным результатом независимо от отказа последующего необязательного этапа. Явный статус и причина fallback не дают клиенту принять отсутствие классов за полный успешный результат.
  kind: open
  reference: Сервис должен вернуть найденные детекции без результатов классификации и явно пометить ответ как частичный, указав таймаут классификатора как причину fallback. Успешную работу детектора не следует отбрасывать или превращать весь запрос в ошибку.
  id: 040-production-polya-3
  fingerprint: '28022079'
