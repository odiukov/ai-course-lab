- concept: единый trace ID связывает этапные метрики и результат одного запроса
  question: Заполни пропуск так, чтобы запись о длительности этапа можно было связать с конкретным запросом во всех логах пайплайна.
  explanation: Один и тот же trace ID должен сопровождать запрос на всех этапах и попадать в ответ. Тогда задержку конкретного результата можно разложить по связанным с ним записям логов.
  kind: cloze
  template: log.info("stage_done", trace_id=___, stage=stage, duration_ms=elapsed)
  answer: request.trace_id
  accept:
    - trace_id
    - ctx.trace_id
