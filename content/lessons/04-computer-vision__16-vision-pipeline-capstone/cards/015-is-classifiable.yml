- concept: пригодность кропа определяется минимальным размером каждой стороны, а не площадью
  question: После обрезки по границам изображения рамка имеет размер 48 × 17 пикселей, а минимально допустимая сторона классификатора — 24 пикселя. Что должна вернуть функция проверки пригодности кропа?
  explanation: 'Проверять нужно каждую сторону отдельно: и ширина, и высота должны быть не меньше минимума. У рамки 48 × 17 высота меньше 24, поэтому классифицировать такой кроп нельзя независимо от его площади.'
  kind: choice
  options:
    - true, потому что площадь кропа достаточно велика
    - true, потому что ширина превышает минимум
    - false, потому что высота меньше минимально допустимой
    - false, потому что стороны кропа должны быть равны
  correct: 2
  id: 015-is-classifiable-1
  fingerprint: 512bd445
- concept: минимальный размер стороны включается в допустимый диапазон
  question: Заполни оператор сравнения в проверке пригодности кропа, если сторона, точно равная минимальному размеру, уже допустима.
  explanation: Граничное значение считается допустимым, поэтому используется оператор «больше или равно» для обоих измерений. Строгое сравнение ошибочно отклонило бы кроп, сторона которого точно совпадает с минимумом.
  kind: cloze
  template: return width ___ min_size and height ___ min_size
  answer: '>='
