- concept: уверенность детектора и уверенность классификатора описывают разные предсказания
  question: Почему оценку уверенности классификатора нельзя использовать как замену оценке уверенности детектора?
  explanation: Высокая уверенность классификатора не доказывает, что исходная рамка найдена надёжно; аналогично уверенная детекция не гарантирует правильный класс вырезанного объекта.
  kind: open
  reference: Детектор оценивает уверенность в наличии и локализации объекта в рамке, а классификатор — уверенность в классе уже вырезанного фрагмента. Это результаты разных моделей и ответы на разные вопросы, поэтому их следует хранить отдельно.
