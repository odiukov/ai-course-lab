- concept: контракт рамки должен однозначно фиксировать единицы измерения координат
  question: Объясни своими словами, почему кортеж координат xyxy нельзя надёжно интерпретировать, если контракт не указывает, являются координаты пиксельными или нормализованными.
  explanation: Формат xyxy задаёт порядок координат, но сам по себе не задаёт их масштаб. Поэтому единицы измерения должны быть частью контракта между компонентами пайплайна.
  kind: open
  reference: Одинаковые значения имеют разный геометрический смысл в разных системах координат. Пиксельные координаты проверяют относительно ширины и высоты изображения, а нормализованные — относительно установленного безразмерного диапазона. Без указания единиц рамку можно ошибочно проверить, масштабировать или вырезать.
  id: 006-invarianty-box-2
