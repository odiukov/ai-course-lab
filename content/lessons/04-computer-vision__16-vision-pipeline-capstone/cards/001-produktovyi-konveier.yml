- concept: качество отдельных моделей не гарантирует корректность сквозного vision-пайплайна
  question: Почему высокое качество детектора и классификатора при независимом тестировании ещё не означает, что собранный из них vision-пайплайн будет давать правильные результаты?
  explanation: Изолированные тесты проверяют модели на корректных входах, но не проверяют передачу данных между ними. На стыке рамка может быть неверно интерпретирована или преобразована, и классификатор уверенно обработает уже неправильный фрагмент изображения.
  kind: open
  reference: Между моделями данные преобразуются и передаются по интерфейсному контракту. Ошибка в формате координат, единицах измерения, нормализации, масштабе изображения или извлечении фрагмента может исказить вход следующей модели. Обе модели при этом остаются исправными, а сквозной результат становится неверным, поэтому нужно отдельно проверять стыки и весь пайплайн целиком.
  id: 001-produktovyi-konveier-1
  fingerprint: 6487d331
- concept: семантическая ошибка на стыке моделей может не вызывать технического сбоя
  question: Детектор и классификатор успешно проходят свои тесты, но в собранном пайплайне классификатор получает фрагменты фона и выдаёт для них уверенные метки. Какое объяснение следует проверить прежде всего?
  explanation: 'Если модели работают отдельно, наиболее вероятна интеграционная ошибка: неверное толкование координат, масштаба или правил вырезания фрагмента. Такая ошибка может оставаться тихой — вычисления выполняются, но следующая модель получает семантически неверный вход.'
  kind: choice
  options:
    - Нарушен контракт передачи рамок или преобразования изображения между моделями
    - Классификатор обязательно переобучился на обучающей выборке
    - Детектор обязательно не умеет находить нужный класс объектов
    - Уверенный ответ гарантирует, что классификатор получил правильный фрагмент
