- concept: распределение числа детекций показывает вариативность нагрузки, скрытую средним значением
  question: Объясните своими словами, зачем при тестировании vision-пайплайна сохранять распределение числа детекций по изображениям, а не только среднее число детекций.
  explanation: Число детекций влияет на объём последующей работы и размер результата. Одно среднее не показывает редкие изображения с особенно большим количеством объектов.
  kind: open
  reference: Одинаковое среднее возможно как при стабильном числе объектов, так и при сочетании почти пустых и очень насыщенных изображений. Распределение показывает такие различия и помогает увидеть запросы, создающие много кропов, классификаций и данных в ответе.
  id: 043-itogovyi-quiz-2
  fingerprint: '71325092'
- concept: ограничение размера ответа проверяют на фактически сериализованном результате
  question: Расположите действия в порядке проверки того, что ответы vision-пайплайна с масками укладываются в установленный лимит.
  explanation: Транспортный размер определяется всей сериализованной структурой, включая маски, метаданные и синтаксис JSON. Поэтому оценивать только исходные массивы масок недостаточно.
  kind: order
  items:
    - Подготовить репрезентативное изображение с несколькими объектами
    - Получить детекции и закодировать их маски в выбранном формате
    - Сформировать полный объект ответа и сериализовать его в JSON
    - Измерить размер полученных байтов и сравнить его с лимитом
  id: 043-itogovyi-quiz-3
  fingerprint: 7b2b6d91
