- concept: сквозной vision-пайплайн последовательно преобразует входные байты в проверенный JSON-ответ
  question: Расположите этапы обработки изображения в HTTP-сервисе компьютерного зрения в правильном порядке.
  explanation: Байты сначала превращаются в подготовленные пиксели. Детектор выдаёт области, классификатор определяет содержимое их фрагментов, после чего результаты объединяются, валидируются и сериализуются в JSON.
  kind: order
  items:
    - Декодировать и подготовить изображение
    - Найти объекты детектором
    - Вырезать и масштабировать найденные области
    - Классифицировать каждый фрагмент
    - Объединить координаты и классы
    - Проверить структуру результата по схеме
    - Сформировать JSON-ответ
  id: 002-marshrut-pipeline-1
  fingerprint: 0bc37a13
- concept: агрегация связывает пространственные результаты детектора с метками классификатора
  question: Какова основная задача этапа агрегации в пайплайне, где детектор находит области изображения, а классификатор обрабатывает вырезанные фрагменты?
  explanation: Детектор сообщает, где расположен объект, а классификатор — что находится в соответствующем фрагменте. Агрегация сопоставляет эти результаты, чтобы каждая запись ответа содержала согласованные координаты и класс.
  kind: choice
  options:
    - Повторно декодировать исходные байты изображения
    - Связать координаты каждой найденной области с результатом классификации соответствующего фрагмента
    - Проверить типы полей готового ответа вместо схемы валидации
    - Преобразовать HTTP-запрос непосредственно в тензор классификатора
  correct: 1
