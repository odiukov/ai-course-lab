- concept: сквозной vision-пайплайн последовательно преобразует входные байты в проверенный JSON-ответ
  question: Расположите этапы обработки изображения в HTTP-сервисе компьютерного зрения в правильном порядке.
  explanation: Байты сначала превращаются в подготовленные пиксели. Детектор выдаёт области, классификатор определяет содержимое их фрагментов, после чего результаты объединяются, валидируются и сериализуются в JSON.
  kind: order
  items:
    - Декодировать и подготовить изображение
    - Найти объекты детектором
    - Вырезать и масштабировать найденные области
    - Классифицировать каждый фрагмент
    - Объединить координаты и классы
    - Проверить структуру результата по схеме
    - Сформировать JSON-ответ
