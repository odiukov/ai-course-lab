- concept: переход к inference server обосновывают измеренными проблемами модельного инференса
  question: Какой сигнал лучше всего обосновывает переход от прямого запуска моделей в FastAPI к специализированному inference server?
  explanation: Inference server нужен не из-за самого статуса «продакшн», а когда измерения выявляют проблемы в обслуживании моделей, которые решают батчинг и управление вычислительными ресурсами. При приемлемых задержке и пропускной способности прямой запуск через FastAPI может оставаться более простым решением.
  kind: choice
  options:
    - Сервис назвали продакшн-сервисом
    - Измерения показывают неприемлемую хвостовую задержку, а пакетный запуск моделей заметно повышает загрузку ускорителя и пропускную способность
    - В API появился ещё один маршрут
    - Код предварительной обработки стал длиннее
  correct: 1
  id: 041-servisnyi-stek-1
  fingerprint: f2785f87
- concept: FastAPI и inference server могут разделять ответственность в одном сервисе
  question: Объясни своими словами, как распределить обязанности между FastAPI и inference server в продакшн-системе компьютерного зрения.
  explanation: 'Подключение inference server не требует отказываться от FastAPI. Эти компоненты решают разные задачи: FastAPI оркестрирует прикладной запрос, а специализированный сервер эффективно и наблюдаемо выполняет модели.'
  kind: open
  reference: 'FastAPI может оставаться внешним HTTP-слоем: принимать и проверять запросы, назначать trace ID, применять fallback и формировать ответ. Inference server располагается за ним и отвечает за выполнение моделей, батчинг, обслуживание версий, метрики и проверку готовности моделей.'
  id: 041-servisnyi-stek-2
  fingerprint: d3741f21
