- concept: распределение задержки между этапами vision-пайплайна зависит от целевого аппаратного обеспечения
  question: Почему перед оптимизацией vision-пайплайна его нужно профилировать именно на целевом оборудовании?
  explanation: Относительная стоимость декодирования, изменения размера, детектора и постобработки меняется вместе с железом и реализацией операций. Оптимизировать следует этапы, занимающие наибольшую долю времени в реальной целевой среде.
  kind: open
  reference: Разные этапы по-разному используют CPU и GPU. После переноса моделей на GPU их инференс может резко ускориться, и узким местом станет оставшийся на CPU препроцессинг; постобработка также может быть дешёвой на GPU и заметной на CPU. Поэтому профиль с другой машины может привести к неверному приоритету оптимизации.
