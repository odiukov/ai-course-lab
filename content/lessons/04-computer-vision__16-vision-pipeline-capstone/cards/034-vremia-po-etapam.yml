- concept: влияние оптимизации этапа на сквозную задержку ограничено долей этого этапа в общем времени
  question: В vision-пайплайне препроцессинг занимает 28 мс, детектор — 140 мс, а постобработка — 32 мс. На сколько процентов уменьшится суммарное время этих этапов, если ускорить препроцессинг вдвое, не меняя остальные этапы?
  explanation: Исходное время равно 200 мс. Ускорение препроцессинга вдвое экономит 14 мс, поэтому выигрыш составляет 14 / 200 × 100% = 7%. Даже крупное ускорение небольшого этапа слабо влияет на весь пайплайн.
  kind: numeric
  answer: 7
  tolerance: 0.1
