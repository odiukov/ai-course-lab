- concept: ошибка загрузки обязательной модели должна препятствовать успешному запуску сервиса
  question: При инициализации vision-сервиса не удалось загрузить обязательные веса модели. Как должен повести себя сервис?
  explanation: Без обязательной модели сервис не готов выполнять свой контракт. Ошибка при старте позволяет оркестратору не направлять трафик на неисправный экземпляр и обнаруживает проблему до пользовательского запроса.
  kind: choice
  options:
    - Завершить запуск с ошибкой, чтобы экземпляр не начал принимать запросы
    - Запуститься и сообщить об ошибке только при первом обращении к модели
    - Возвращать пустые детекции, пока модель не загрузится
    - Считать модель необязательной и пометить сервис готовым
