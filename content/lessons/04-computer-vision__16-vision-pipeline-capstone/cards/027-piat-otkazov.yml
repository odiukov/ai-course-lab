- concept: известные отказы пайплайна должны иметь раздельные типизированные контракты обработки
  question: Почему не следует оборачивать весь маршрут vision-пайплайна одним обработчиком, который превращает любое исключение в одинаковый ответ?
  explanation: Единый безликий ответ ухудшает наблюдаемость и не сообщает, кто способен исправить проблему и стоит ли повторять запрос. Явный контракт каждого отказа сохраняет эту информацию и не скрывает неожиданные дефекты.
  kind: open
  reference: Такой обработчик стирает различия между штатным пустым результатом, исправимой клиентской ошибкой и внутренним отказом сервиса. Для известных отказов нужны отдельные имена, коды, ответы и записи в журнале, чтобы клиент и оператор понимали причину и допустимое действие.
