- concept: прогрев отделяет разовые затраты инициализации от задержки установившегося режима
  question: Зачем перед измерением задержки уже запущенного vision-пайплайна выполняют прогревочный вызов и не включают его время в статистику?
  explanation: Первый вызов может включать ленивую инициализацию, выделение памяти и заполнение кэшей. Прогрев выполняет эту подготовку заранее, поэтому последующие замеры лучше описывают работу уже запущенного сервиса.
  kind: choice
  options:
    - Чтобы проверить точность предсказаний на отдельном изображении
    - Чтобы принудительно очистить память и кэши перед каждым измерением
    - Чтобы разовые выделения памяти, подготовка библиотек и заполнение кэшей не искажали задержку обычных запросов
  correct: 2
  id: 035-chestnyi-benchmark-1
  fingerprint: de937b90
- concept: медиана описывает типичную задержку, а высокий процентиль — медленный хвост распределения
  question: Объясни своими словами, почему при оценке задержки сервиса полезно сообщать и медиану, и высокий процентиль.
  explanation: 'В benchmark роль медианы выполняет p50, а хвост показывает p95. Одинаковый p50 у двух систем ещё не означает одинаковый пользовательский опыт: у одной из них p95 может быть значительно хуже.'
  kind: open
  reference: Медиана показывает задержку типичного запроса, но скрывает редкие замедления. Высокий процентиль характеризует медленный хвост и помогает понять, насколько долго иногда приходится ждать пользователю.
  id: 035-chestnyi-benchmark-2
  fingerprint: b52cb0c4
- concept: оценка хвостового процентиля на малой выборке чувствительна к отдельным медленным наблюдениям
  question: Почему высокий процентиль задержки, рассчитанный по небольшому числу запусков, следует считать лишь грубой оценкой?
  explanation: При 20 запусках хвост распределения представлен буквально несколькими значениями, поэтому единичный скачок сильно влияет на p95. Для более устойчивой оценки нужны дополнительные независимые измерения в репрезентативных условиях.
  kind: choice
  options:
    - Высокие процентили можно вычислять только для данных, распределённых нормально
    - В хвосте находится мало наблюдений, поэтому отдельный медленный запуск способен заметно сдвинуть оценку
    - После сортировки измерений информация о медленных запросах теряется
  correct: 1
  id: 035-chestnyi-benchmark-3
  fingerprint: cc11ace1
