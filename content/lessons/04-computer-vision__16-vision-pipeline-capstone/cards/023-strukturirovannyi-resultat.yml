- concept: идентификатор изображения позволяет сопоставить асинхронный результат с исходным запросом
  question: Зачем включать `image_id` в результат vision-пайплайна, если сервис может одновременно обрабатывать несколько изображений?
  explanation: При параллельной или асинхронной обработке ответы могут приходить не в порядке отправки. `image_id` сохраняет связь результата с конкретным исходным изображением.
  kind: open
  reference: '`image_id` позволяет клиенту однозначно сопоставить каждый ответ с исходным изображением независимо от порядка завершения запросов.'
