- concept: таймаут микробатчера ограничивает ожидание и запускает обработку неполного батча
  question: В сервисе с микробатчингом наступил крайний срок отправки, но очередь почти пуста. Как должен поступить микробатчер?
  explanation: Крайний срок ограничивает добавленную микробатчером задержку. По его наступлении сервис обрабатывает всё накопленное, даже если батч содержит единственный запрос.
  kind: choice
  options:
    - Продолжать ждать, пока батч полностью заполнится
    - Отправить накопленный неполный батч на обработку
    - Отменить накопленные запросы и попросить клиентов повторить их
  correct: 1
  id: 039-mikrobatching-1
  fingerprint: ad9a02df
- concept: задержка ожидания внутри общего батча зависит от момента поступления запроса
  question: Несколько запросов попали в один микробатч и были отправлены модели одновременно. Какой из них обычно провёл больше всего времени в очереди микробатчера?
  explanation: Отправка батча происходит одновременно, но запросы поступают в очередь в разные моменты. Самый ранний запрос ждёт формирования батча дольше, а пришедший перед отправкой — меньше.
  kind: choice
  options:
    - Запрос, поступивший раньше остальных
    - Запрос, поступивший позже остальных
    - Все запросы обязательно ждали одинаково долго
  correct: 0
  id: 039-mikrobatching-2
  fingerprint: da301bb2
