<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Три файла в цикле работы агента</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fb;
      --surface: #ffffff;
      --surface-muted: #eef2f6;
      --ink: #172033;
      --muted: #536176;
      --line: #738097;
      --agent: #167a5b;
      --agent-soft: #e2f5ed;
      --router: #a85a00;
      --router-soft: #fff1d6;
      --state: #176f91;
      --state-soft: #e1f4fb;
      --board: #6954a6;
      --board-soft: #eee9ff;
      --done: #24855f;
      --human: #b44b55;
      --shadow: #d9dee8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
    }

    body {
      margin: unset;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .diagram {
      margin: unset;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--shadow);
      overflow: hidden;
    }

    .heading {
      margin: unset;
      background: var(--surface);
      color: var(--ink);
      font-size: 20px;
      font-weight: bold;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 470px;
      background: var(--surface);
    }

    .card {
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .agent-card {
      fill: var(--agent-soft);
      stroke: var(--agent);
    }

    .router-card {
      fill: var(--router-soft);
      stroke: var(--router);
    }

    .state-card {
      fill: var(--state-soft);
      stroke: var(--state);
    }

    .board-card {
      fill: var(--board-soft);
      stroke: var(--board);
    }

    .divider {
      stroke-width: 1.5px;
      vector-effect: non-scaling-stroke;
    }

    .state-divider {
      stroke: var(--state);
    }

    .board-divider {
      stroke: var(--board);
    }

    .flow {
      fill: none;
      stroke: var(--line);
      stroke-width: 2.5px;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .read-flow {
      stroke: var(--agent);
    }

    .state-flow {
      stroke: var(--state);
    }

    .board-flow {
      stroke: var(--board);
    }

    .read-head {
      fill: var(--agent);
    }

    .state-head {
      fill: var(--state);
    }

    .board-head {
      fill: var(--board);
    }

    .node-title {
      fill: var(--ink);
      font-size: 16px;
      font-weight: bold;
    }

    .file-title {
      fill: var(--ink);
      font-size: 17px;
      font-weight: bold;
    }

    .node-subtitle {
      fill: var(--muted);
      font-size: 13px;
    }

    .field-label {
      fill: var(--ink);
      font-size: 12px;
    }

    .flow-label {
      fill: var(--muted);
      stroke: var(--surface);
      stroke-width: 5px;
      paint-order: stroke;
      font-size: 13px;
      font-weight: bold;
    }

    .loop-mark {
      fill: var(--agent);
      font-size: 30px;
      font-weight: bold;
    }

    .status-todo {
      fill: var(--line);
    }

    .status-active {
      fill: var(--router);
    }

    .status-done {
      fill: var(--done);
    }

    .status-human {
      fill: var(--human);
    }

    .fallback {
      color: var(--ink);
      background: var(--surface);
      font-size: 16px;
      text-align: center;
    }

    [hidden] {
      display: none;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #0d1119;
        --surface: #151b26;
        --surface-muted: #202938;
        --ink: #edf2fa;
        --muted: #aeb9ca;
        --line: #8795aa;
        --agent: #5bd1aa;
        --agent-soft: #183c34;
        --router: #f0ae55;
        --router-soft: #44331d;
        --state: #65c7e8;
        --state-soft: #193b49;
        --board: #b3a2f1;
        --board-soft: #332d51;
        --done: #64d3a5;
        --human: #ef8790;
        --shadow: #354052;
      }
    }
  </style>
</head>
<body>
  <figure class="diagram" aria-labelledby="diagram-heading">
    <figcaption id="diagram-heading" class="heading">
      Три файла в цикле работы агента
    </figcaption>

    <svg
      id="agent-diagram"
      viewBox="0 0 1000 470"
      width="1000"
      height="470"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description"
    >
      <title id="svg-title">Три файла в цикле работы агента</title>
      <desc id="svg-description">
        Цикл агента читает короткий AGENTS.md, переходит к файлам состояния
        и доски задач, а их данные возвращаются в следующий ход.
      </desc>
      <g id="drawing"></g>
    </svg>

    <p id="fallback" class="fallback" hidden>
      Схема должна показать, как цикл агента через короткий AGENTS.md читает
      agent_state.json и task_board.json, а данные обоих файлов возвращаются
      в следующий ход.
    </p>
  </figure>

  <script>
    const data = [
      {
        meta: {
          origin: { x: 36, y: 16 },
          scale: 7.5,
          zero: 0
        },
        cards: [
          {
            kind: "agent",
            box: { x: 4, y: 22, w: 25, h: 15, r: 2 },
            icon: { x: 9.5, y: 30.4, text: "↻" },
            title: { x: 20, y: 27.7, text: "ЦИКЛ АГЕНТА" },
            subtitle: { x: 20, y: 32.1, text: "очередной ход" }
          },
          {
            kind: "router",
            box: { x: 40, y: 22, w: 27, h: 15, r: 2 },
            title: { x: 53.5, y: 27.1, text: "AGENTS.md" },
            subtitle: { x: 53.5, y: 31, text: "короткий роутер" },
            note: { x: 53.5, y: 34.3, text: "ведёт к источникам фактов" }
          },
          {
            kind: "state",
            box: { x: 82, y: 7, w: 42, h: 17, r: 2 },
            title: { x: 103, y: 11.3, text: "agent_state.json" },
            subtitle: { x: 103, y: 14.2, text: "текущий момент работы" },
            divider: { x1: 84, y1: 16.2, x2: 122, y2: 16.2 },
            fields: [
              { x: 85, y: 18.7, text: "активная задача · затронутые файлы" },
              { x: 85, y: 21, text: "предположения · блокеры" },
              { x: 85, y: 23.1, text: "следующее действие" }
            ]
          },
          {
            kind: "board",
            box: { x: 82, y: 35, w: 42, h: 17, r: 2 },
            title: { x: 103, y: 39.3, text: "task_board.json" },
            subtitle: { x: 103, y: 42.2, text: "очередь работы" },
            divider: { x1: 84, y1: 44.1, x2: 122, y2: 44.1 },
            statuses: [
              {
                dot: { x: 85.5, y: 46.7, r: 0.45 },
                label: { x: 87, y: 47.1, text: "предстоит" },
                className: "status-todo"
              },
              {
                dot: { x: 102.5, y: 46.7, r: 0.45 },
                label: { x: 104, y: 47.1, text: "в работе" },
                className: "status-active"
              },
              {
                dot: { x: 85.5, y: 49.7, r: 0.45 },
                label: { x: 87, y: 50.1, text: "готово" },
                className: "status-done"
              },
              {
                dot: { x: 102.5, y: 49.7, r: 0.45 },
                label: { x: 104, y: 50.1, text: "нужен человек" },
                className: "status-human"
              }
            ]
          }
        ],
        arrows: [
          {
            className: "flow read-flow",
            segments: [
              { command: "M", points: [{ x: 29, y: 29.5 }] },
              { command: "L", points: [{ x: 40, y: 29.5 }] }
            ],
            headClass: "read-head",
            head: [
              { x: 40, y: 29.5 },
              { x: 37.2, y: 28.1 },
              { x: 37.2, y: 30.9 }
            ]
          },
          {
            className: "flow state-flow",
            segments: [
              { command: "M", points: [{ x: 67, y: 27.5 }] },
              { command: "L", points: [{ x: 73, y: 27.5 }] },
              { command: "L", points: [{ x: 73, y: 15.5 }] },
              { command: "L", points: [{ x: 82, y: 15.5 }] }
            ],
            headClass: "state-head",
            head: [
              { x: 82, y: 15.5 },
              { x: 79.2, y: 14.1 },
              { x: 79.2, y: 16.9 }
            ]
          },
          {
            className: "flow board-flow",
            segments: [
              { command: "M", points: [{ x: 67, y: 31.5 }] },
              { command: "L", points: [{ x: 73, y: 31.5 }] },
              { command: "L", points: [{ x: 73, y: 43.5 }] },
              { command: "L", points: [{ x: 82, y: 43.5 }] }
            ],
            headClass: "board-head",
            head: [
              { x: 82, y: 43.5 },
              { x: 79.2, y: 42.1 },
              { x: 79.2, y: 44.9 }
            ]
          },
          {
            className: "flow state-flow",
            segments: [
              { command: "M", points: [{ x: 103, y: 7 }] },
              { command: "L", points: [{ x: 103, y: 2 }] },
              { command: "L", points: [{ x: 16.5, y: 2 }] },
              { command: "L", points: [{ x: 16.5, y: 22 }] }
            ],
            headClass: "state-head",
            head: [
              { x: 16.5, y: 22 },
              { x: 15.1, y: 19.2 },
              { x: 17.9, y: 19.2 }
            ]
          },
          {
            className: "flow board-flow",
            segments: [
              { command: "M", points: [{ x: 103, y: 52 }] },
              { command: "L", points: [{ x: 103, y: 57 }] },
              { command: "L", points: [{ x: 16.5, y: 57 }] },
              { command: "L", points: [{ x: 16.5, y: 37 }] }
            ],
            headClass: "board-head",
            head: [
              { x: 16.5, y: 37 },
              { x: 15.1, y: 39.8 },
              { x: 17.9, y: 39.8 }
            ]
          }
        ],
        labels: [
          {
            x: 34.5,
            y: 27.2,
            anchor: "middle",
            text: "читает"
          },
          {
            x: 78,
            y: 13.2,
            anchor: "end",
            text: "текущий момент"
          },
          {
            x: 78,
            y: 41.1,
            anchor: "end",
            text: "очередь задач"
          },
          {
            x: 59.5,
            y: 4.8,
            anchor: "middle",
            text: "состояние возвращает факты в следующий ход"
          },
          {
            x: 59.5,
            y: 55.1,
            anchor: "middle",
            text: "доска возвращает факты в следующий ход"
          }
        ]
      }
    ];

    const [diagram] = data;
    const origin = diagram.meta.origin;
    const scale = diagram.meta.scale;
    const sx = x => origin.x + x * scale;
    const sy = y => origin.y + y * scale;

    const svg = document.getElementById("agent-diagram");
    const drawing = document.getElementById("drawing");
    const fallback = document.getElementById("fallback");

    function element(name, attributes, content) {
      const node = document.createElementNS(svg.namespaceURI, name);

      Object.entries(attributes).forEach(([key, value]) => {
        node.setAttribute(key, value);
      });

      if (content !== undefined) {
        node.textContent = content;
      }

      return node;
    }

    function add(name, attributes, content) {
      const node = element(name, attributes, content);
      drawing.appendChild(node);
      return node;
    }

    function pathData(segments) {
      return segments
        .map(segment => {
          const coordinates = segment.points
            .map(point => `${sx(point.x)} ${sy(point.y)}`)
            .join(" ");
          return `${segment.command} ${coordinates}`;
        })
        .join(" ");
    }

    function polygonPoints(points) {
      return points
        .map(point => `${sx(point.x)},${sy(point.y)}`)
        .join(" ");
    }

    function drawArrow(arrow) {
      add("path", {
        d: pathData(arrow.segments),
        class: arrow.className
      });

      add("polygon", {
        points: polygonPoints(arrow.head),
        class: arrow.headClass
      });
    }

    function drawBaseCard(card, className) {
      add("rect", {
        x: sx(card.box.x),
        y: sy(card.box.y),
        width: sx(card.box.w) - sx(diagram.meta.zero),
        height: sy(card.box.h) - sy(diagram.meta.zero),
        rx: sx(card.box.r) - sx(diagram.meta.zero),
        ry: sy(card.box.r) - sy(diagram.meta.zero),
        class: `card ${className}`
      });
    }

    function drawAgent(card) {
      drawBaseCard(card, "agent-card");

      add("text", {
        x: sx(card.icon.x),
        y: sy(card.icon.y),
        "text-anchor": "middle",
        class: "loop-mark"
      }, card.icon.text);

      add("text", {
        x: sx(card.title.x),
        y: sy(card.title.y),
        "text-anchor": "middle",
        class: "node-title"
      }, card.title.text);

      add("text", {
        x: sx(card.subtitle.x),
        y: sy(card.subtitle.y),
        "text-anchor": "middle",
        class: "node-subtitle"
      }, card.subtitle.text);
    }

    function drawRouter(card) {
      drawBaseCard(card, "router-card");

      add("text", {
        x: sx(card.title.x),
        y: sy(card.title.y),
        "text-anchor": "middle",
        class: "file-title"
      }, card.title.text);

      add("text", {
        x: sx(card.subtitle.x),
        y: sy(card.subtitle.y),
        "text-anchor": "middle",
        class: "node-subtitle"
      }, card.subtitle.text);

      add("text", {
        x: sx(card.note.x),
        y: sy(card.note.y),
        "text-anchor": "middle",
        class: "field-label"
      }, card.note.text);
    }

    function drawState(card) {
      drawBaseCard(card, "state-card");

      add("text", {
        x: sx(card.title.x),
        y: sy(card.title.y),
        "text-anchor": "middle",
        class: "file-title"
      }, card.title.text);

      add("text", {
        x: sx(card.subtitle.x),
        y: sy(card.subtitle.y),
        "text-anchor": "middle",
        class: "node-subtitle"
      }, card.subtitle.text);

      add("line", {
        x1: sx(card.divider.x1),
        y1: sy(card.divider.y1),
        x2: sx(card.divider.x2),
        y2: sy(card.divider.y2),
        class: "divider state-divider"
      });

      card.fields.forEach(field => {
        add("text", {
          x: sx(field.x),
          y: sy(field.y),
          "text-anchor": "start",
          class: "field-label"
        }, field.text);
      });
    }

    function drawBoard(card) {
      drawBaseCard(card, "board-card");

      add("text", {
        x: sx(card.title.x),
        y: sy(card.title.y),
        "text-anchor": "middle",
        class: "file-title"
      }, card.title.text);

      add("text", {
        x: sx(card.subtitle.x),
        y: sy(card.subtitle.y),
        "text-anchor": "middle",
        class: "node-subtitle"
      }, card.subtitle.text);

      add("line", {
        x1: sx(card.divider.x1),
        y1: sy(card.divider.y1),
        x2: sx(card.divider.x2),
        y2: sy(card.divider.y2),
        class: "divider board-divider"
      });

      card.statuses.forEach(status => {
        add("circle", {
          cx: sx(status.dot.x),
          cy: sy(status.dot.y),
          r: sx(status.dot.r) - sx(diagram.meta.zero),
          class: status.className
        });

        add("text", {
          x: sx(status.label.x),
          y: sy(status.label.y),
          "text-anchor": "start",
          class: "field-label"
        }, status.label.text);
      });
    }

    function drawCard(card) {
      const drawers = {
        agent: drawAgent,
        router: drawRouter,
        state: drawState,
        board: drawBoard
      };

      const drawer = drawers[card.kind];

      if (!drawer) {
        throw new Error(`Неизвестный тип блока: ${card.kind}`);
      }

      drawer(card);
    }

    function drawLabel(label) {
      add("text", {
        x: sx(label.x),
        y: sy(label.y),
        "text-anchor": label.anchor,
        class: "flow-label"
      }, label.text);
    }

    try {
      diagram.arrows.forEach(drawArrow);
      diagram.cards.forEach(drawCard);
      diagram.labels.forEach(drawLabel);
    } catch (error) {
      svg.hidden = true;
      fallback.hidden = false;
    }
  </script>
</body>
</html>
