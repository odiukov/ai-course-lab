- concept: критерии приёмки задают проверяемое условие перевода задачи в done
  question: Задача на доске звучит как «исправить форму регистрации». Что должно появиться в записи, чтобы статус `done` не зависел от чьего-то впечатления?
  explanation: «Форма отклоняет пустой email», «показывает понятное сообщение», «существующие проверки проходят» — это финиш, который может подтвердить любой участник. Без таких условий `done` означает лишь то, что кто-то счёл работу законченной.
  kind: choice
  options:
    - 'Критерии приёмки: наблюдаемые условия, которые можно проверить по очереди'
    - Оценка сложности задачи в часах
    - Имя того, кто предложил задачу
    - Ссылка на обсуждение, где задачу сформулировали
  correct: 0
  id: 012-board-contract-1
  fingerprint: 309cb3f1
- concept: статус задачи описывает наблюдаемый этап работы, а не оценку сложности или степень готовности
  question: Что из перечисленного не должен выражать статус задачи на доске?
  explanation: Четыре статуса — `todo`, `in_progress`, `done`, `blocked` — отвечают на вопрос «в каком положении задача», и каждое значение проверяемо снаружи. Проценты готовности и оценки сложности проверить нельзя, поэтому они превращают статус в мнение.
  kind: choice
  options:
    - Насколько задача трудная и сколько процентов работы сделано
    - Что задачу ещё не начинали
    - Что задачу выполняют прямо сейчас
    - Что продолжать её сейчас нельзя
  correct: 0
  id: 012-board-contract-2
  fingerprint: 8ce2d570
- concept: разросшаяся доска — сигнал проблемы с планированием, а не повод менять формат файла
  question: 'Доска задач перестала помещаться на один экран: задач стало много, и каждая описана абзацем. Что это в первую очередь означает?'
  explanation: 'Доска специально маленькая: её читают, чтобы понять, идёт ли работа по плану. Когда обзор пропал, чинят план, а не файл; смена формата или дробление на несколько досок только прячет симптом, а удаление критериев приёмки ломает признак готовности.'
  kind: choice
  options:
    - План разросся и его пора укрупнять или чистить
    - Формат JSON исчерпал себя и нужен другой формат
    - Файл нужно разбить на несколько досок
    - Пора удалить критерии приёмки, чтобы записи стали короче
  correct: 0
  id: 012-board-contract-3
  fingerprint: f583fe13
