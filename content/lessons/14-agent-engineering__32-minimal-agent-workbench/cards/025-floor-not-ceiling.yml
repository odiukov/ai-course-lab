- concept: надстроенная поверхность потребляет данные базовых файлов, а не заводит собственную запись о работе
  question: 'В workbench добавляют гейт верификации: перед завершением хода агент обязан подтвердить результат. Откуда гейт должен брать сведения о том, что именно проверять и по какому критерию?'
  explanation: Гейт — новая способность, а не новый источник правды. Активную задачу и точку продолжения хранит состояние, проверяемое условие завершения — карточка доски, путь к подробным правилам и командам — роутер. Собственный список внутри гейта немедленно создаёт вторую версию ответа на вопрос «какая задача активна».
  kind: choice
  options:
    - Из собственного файла гейта, где он ведёт список проверяемых задач и их критериев
    - Из файла состояния (активная задача, следующее действие) и карточки на доске (критерии приёмки), а команды находит через роутер
    - Из истории диалога текущей сессии, потому что там свежее всего описано, чем занят агент
    - 'Из diff репозитория: изменённые файлы однозначно задают набор проверок'
  correct: 1
  id: 025-floor-not-ceiling-1
  fingerprint: 7574286f
- concept: базовая тройка — предпосылка работоспособности надстроек, а не законченный workbench
  question: Почему роутер, файл состояния и доску задач называют полом workbench, а не потолком? Объясни своими словами, что означает каждая часть этого утверждения.
  explanation: Оценивать кандидата в workbench стоит вопросом «он читает роутер, доску и состояние или тайно заводит свои?». Опора даёт рост системы, дублирование — расхождение по швам.
  kind: open
  reference: '«Пол» значит: без этих трёх ролей надстройки не могут работать — контракту границ, раннеру обратной связи, гейту верификации, чеклисту ревьюера и пакету передачи дел нужны маршрутизация к правилам, знание активной задачи и перечень доступной работы. «Не потолок» значит: тройка не покрывает всё, что нужно продакшен-процессу, её штатно наращивают. Ограничение на рост одно: новая поверхность обязана опираться на существующие файлы, а не дублировать их содержимое.'
  id: 025-floor-not-ceiling-2
  fingerprint: 7528f886
- concept: признак того, что новая поверхность продублировала базовый файл, — несогласованные ответы о статусе одной задачи
  question: В репозиторий добавили чеклист ревьюера, который держит собственное поле «работа сдана». Какой наблюдаемый симптом первым укажет, что это ошибка проектирования?
  explanation: Дублирование проявляется не как ошибка выполнения, а как противоречие между артефактами. Пока источник один, вопрос «что сейчас в работе» имеет ровно один ответ; как только появляется второе поле с тем же смыслом, ответ зависит от того, какой файл прочитали.
  kind: choice
  options:
    - Чеклист станет длиннее роутера и его будет дорого читать
    - 'Об одной и той же задаче артефакты начнут отвечать по-разному: доска говорит in_progress, чеклист — сдано, и следующая сессия выбирает произвольный вариант'
    - Агент перестанет открывать чеклист, потому что предпочтёт JSON-файлы Markdown-документам
    - Команды верификации начнут выполняться дважды за ход
  correct: 1
