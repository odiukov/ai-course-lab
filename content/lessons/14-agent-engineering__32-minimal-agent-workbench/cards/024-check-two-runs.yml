- concept: продвижение измеряется изменением артефактов между запусками, а не отсутствием ошибок при выполнении
  question: Скрипт отработал десять раз подряд без единой ошибки. Что доказывает, что агент действительно продвинулся?
  explanation: 'Успешное завершение говорит лишь о том, что код не упал. Работа, повторяющая себя, выглядит ровно так же успешно. Продвижение видно только в различии артефактов: состояние на входе следующего запуска должно быть тем, которое оставил предыдущий.'
  kind: choice
  options:
    - 'Изменение наблюдаемых артефактов от запуска к запуску: другое сохранённое состояние, другая правка, другая карточка в работе'
    - Сам факт завершения всех запусков без исключений
    - Одинаковый вывод на каждом запуске — признак стабильности
    - Рост числа строк в файлах проекта
  correct: 0
