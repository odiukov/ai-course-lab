- concept: поле затронутых файлов — след конкретной активной задачи, а не инвентарь проекта
  question: В файле состояния агента есть поле «затронутые файлы». Что в него разумно писать?
  explanation: 'Поле нужно, чтобы следующий ход сразу видел зону работы текущей задачи. Инвентарь проекта восстанавливается из самого репозитория и в состоянии бесполезен: он не сужает область, а расширяет её до всего.'
  kind: choice
  options:
    - Файлы, которые агент изменил или собирается изменить в рамках текущей активной задачи
    - Полный список файлов репозитория, чтобы следующая сессия видела структуру проекта
    - Файлы, которые агент читал при любой из прошлых задач
  correct: 0
  id: 010-state-fields-1
  fingerprint: b4d62acb
- concept: пустое поле блокеров — информативное утверждение об отсутствии препятствий, а не отсутствие данных
  question: Агент дописал состояние и оставил поле «блокеры» пустым. Как это читать следующей сессии?
  explanation: 'Поле заполняется на каждом ходу, поэтому пустое значение несёт информацию наравне с заполненным: путь свободен. Если бы блокер был — отсутствующий файл, выбор, который нельзя сделать без человека, — он был бы записан.'
  kind: choice
  options:
    - 'Как явное утверждение: препятствий для продолжения нет, можно выполнять следующее действие'
    - Как признак того, что агент не успел заполнить поле, и блокеры нужно искать заново
    - Как сигнал, что задачу надо передать человеку до выяснения обстоятельств
  correct: 0
  id: 010-state-fields-2
  fingerprint: e9659af5
- concept: поле следующего действия обязано называть исполнимый ход и результат, который нужно посмотреть
  question: 'Чем запись «следующее действие: доработать модуль авторизации» хуже записи «следующее действие: запустить набор тестов авторизации и разобрать упавшие»?'
  explanation: 'Это поле превращает запись состояния из описания прошлого в точку продолжения. Критерий пригодности простой: можно ли выполнить написанное без дополнительных решений и увидеть результат.'
  kind: open
  reference: 'Первая называет область, вторая — исполнимый ход с наблюдаемым результатом. По первой новая сессия вынуждена заново восстанавливать рассуждения и угадывать, что именно дорабатывать: покрытие, обработку ошибок, интерфейс. По второй агент сразу знает, какую команду выполнить и на что смотреть после неё, и первый ход не требует догадок.'
  id: 010-state-fields-3
  fingerprint: 9d840389
