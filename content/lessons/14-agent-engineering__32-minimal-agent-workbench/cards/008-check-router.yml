- concept: роутер несёт указатели на состояние, очередь задач, глубокие правила и способ проверки результата
  question: Корневой файл инструкций для агента задуман как роутер. Какой набор содержимого этому соответствует?
  explanation: 'Роутер отвечает на четыре вопроса: где я, что осталось, какие правила действуют, чем проверить результат. Всё остальное живёт в глубоких документах и читается по ссылке, когда задача его затронула.'
  kind: choice
  options:
    - Полные процедуры на все типы задач, чтобы агенту не пришлось открывать другие файлы
    - Указатели на файл состояния, доску задач и документ с подробными правилами, плюс команда верификации
    - История принятых архитектурных решений и перечень известных багов
  correct: 1
  id: 008-check-router-1
  fingerprint: 2279c108
- concept: команда верификации в роутере даёт агенту способ самостоятельно подтвердить результат хода
  question: Зачем в корневой файл инструкций для агента кладут команду верификации, а не только ссылки на правила и текущее состояние?
  explanation: Три навигационных указателя отвечают на «где я и что делать», команда верификации — на «как понять, что работает». Без неё цикл хода не замыкается проверкой.
  kind: open
  reference: 'Без команды верификации агент знает, что делать и где искать правила, но не знает, как убедиться, что сделанное работает. Тогда он объявляет задачу выполненной по собственной оценке. Команда даёт наблюдаемый критерий: запустил, посмотрел результат, и только после этого меняет статус задачи. Она короткая, нужна на каждом ходу и поэтому остаётся в роутере, а не в глубоком документе.'
  id: 008-check-router-2
  fingerprint: af79e58b
