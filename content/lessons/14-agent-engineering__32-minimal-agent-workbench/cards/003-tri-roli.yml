- concept: предположение, сделанное агентом по ходу работы, фиксируется в файле состояния, а не остаётся неявным
  question: Агент правил модуль и по дороге решил, что конфиг лежит в корне репозитория. Решение оказалось неверным, и лишний файл был перезаписан. Куда в минимальном рабочем комплекте следовало записать это решение, чтобы следующая сессия смогла объяснить поломку?
  explanation: Файл состояния несёт id активной задачи, затронутые файлы, предположения, блокеры и следующее действие. Предположения — единственное поле, где живёт «во что агент поверил без проверки»; без него поломанный файл выглядит беспричинным. Доска хранит план, роутер — указатели, чат не переживает сессию.
  kind: choice
  options:
    - В поле предположений файла состояния рядом с активной задачей и затронутыми файлами
    - В критерии приёмки задачи на доске задач
    - В роутер AGENTS.md отдельной строкой правила
    - В историю диалога — там она лежит вместе с рассуждением
  correct: 0
  id: 003-tri-roli-1
  fingerprint: d6a73838
- concept: состояние и доска читаются и переписываются на каждом ходу, замыкая цикл, а не загружаются однократно
  question: Расставь один ход агента в рабочем комплекте из роутера, файла состояния и доски задач.
  explanation: 'Стрелки замыкаются: файлы не читаются один раз на старте, а сопровождают каждый ход. Если запись обратно пропущена, следующий проход стартует со старых фактов и повторяет уже сделанную работу.'
  kind: order
  items:
    - Прочитать роутер и получить указатели на состояние, доску, глубокие правила и команду верификации
    - 'Прочитать файл состояния и доску задач: активная задача, блокеры, очередь'
    - Выполнить ход по следующему действию из состояния
    - Записать результат хода обратно в файл состояния и обновить статус задачи на доске
  id: 003-tri-roli-2
  fingerprint: 66d3888b
- concept: поле владельца задачи задаёт, кто действует следующим, и значение human — это команда агенту остановиться
  question: На доске задач у задачи в статусе in_progress владелец указан как human. Как должен повести себя агент, дойдя до этой задачи?
  explanation: 'Владелец (builder, reviewer, human) отвечает на вопрос «кто следующий». Значение human — явная точка остановки: агент честно передаёт ход, вместо того чтобы гадать за человека. Статус задачи говорит о стадии, владелец — об исполнителе; путать их нельзя.'
  kind: choice
  options:
    - Остановиться и вернуть ход человеку, не додумывая решение за него
    - Взять задачу себе, раз она уже в статусе in_progress
    - Перевести задачу в blocked и выбрать следующую todo
    - Выполнить задачу и пометить владельца как builder
  correct: 0
