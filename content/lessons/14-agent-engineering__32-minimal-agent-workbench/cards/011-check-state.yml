- concept: критерий переноса из диалога в файл состояния — необходимость данных для продолжения работы без догадок
  question: По какому признаку решают, что фрагмент диалога обязан попасть в файл состояния?
  explanation: Файл состояния — не архив разговора, а условие продолжения. Всё, что нужно для следующего хода, записывается; остальное может остаться в диалоге и пропасть без последствий.
  kind: choice
  options:
    - Без него следующая сессия не сможет продолжить работу, не догадываясь
    - Он занимает в диалоге больше всего места
    - Он был последним сообщением перед закрытием сессии
    - Он содержит вопрос человека
  correct: 0
  id: 011-check-state-1
  fingerprint: 7c886c5e
- concept: в файл состояния уходит итог решения, а не перебор рассмотренных вариантов
  question: В диалоге агент рассмотрел четыре варианта структуры доски и выбрал один, объяснив причину. Что из этого попадает в файл состояния и почему?
  explanation: Запись «что решили и почему» превращает состояние в опору для продолжения; запись «что обсуждали» превращает его в пересказ диалога, ради ухода от которого файл и заведён.
  kind: open
  reference: 'Попадают выбранный вариант, причина выбора (как принятое предположение) и следующее действие, вытекающее из решения. Отвергнутые варианты не нужны: они не влияют на следующий ход и лишь раздувают запись, которую читают на каждом ходу. Причину выбора записывают обязательно — иначе следующая сессия увидит результат решения и может отменить его как непонятный.'
  id: 011-check-state-2
  fingerprint: 8a6a6033
