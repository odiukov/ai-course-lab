- concept: относительные ссылки внутри документа разрешаются от каталога самого документа, а не от текущей рабочей директории
  question: Линтер проверяет, что относительные ссылки в файле `docs/AGENTS.md` ведут на существующие цели. Скрипт запускают то из корня репозитория, то из подкаталога, и результат проверки меняется. Что нужно исправить?
  explanation: Ссылка внутри файла означает путь относительно этого файла. Если базой взять текущую рабочую директорию, одна и та же ссылка то проходит, то ломается в зависимости от места запуска. База — каталог файла-источника, тогда результат проверки воспроизводим.
  kind: choice
  options:
    - Разрешать каждую ссылку относительно каталога проверяемого файла, а не относительно текущей рабочей директории
    - Переписать все ссылки в абсолютные пути от корня файловой системы
    - Запретить запуск скрипта откуда-либо, кроме корня репозитория
  correct: 0
  id: 007-code-lint-router-1
  fingerprint: 9f9f5e0b
- concept: проверка продолжается после первого нарушения и отдаёт полный список найденного
  question: Линтер конфигурации останавливается и сообщает о первом же найденном нарушении. Какой практический недостаток у такого поведения?
  explanation: 'Данные для всех проверок уже есть в памяти после одного чтения файла. Остановка на первом нарушении скрывает остальные и заставляет крутить лишние круги: сначала узнаёшь про превышение длины, после починки — про битую ссылку. Полный список за один проход показывает весь объём работы сразу.'
  kind: choice
  options:
    - Ремонт идёт итерациями «исправил — запустил — узнал о следующем», хотя все нарушения были видны уже при первом проходе
    - Первое найденное нарушение может оказаться ложным срабатыванием
    - Проверка выполняется медленнее, потому что файл читается заново
  correct: 1
  id: 007-code-lint-router-2
  fingerprint: cc25dc44
- concept: 'обнаружение нарушений отделено от реакции на них: функция возвращает данные, а печать и код выхода остаются вызывающему'
  question: Почему функцию проверки лучше писать так, чтобы она возвращала список нарушений, а не печатала их и не завершала процесс?
  explanation: Функция отвечает на вопрос «что нарушено», а не «что теперь делать». Пустой список — понятный контракт «нарушений нет», и вызывающий сам выбирает вывод и код завершения.
  kind: open
  reference: Возврат данных отделяет обнаружение от реакции. Тогда одна и та же функция годится и для теста (проверяем содержимое списка, не перехватывая вывод и не ловя SystemExit), и для командной строки, и для вызова из другого инструмента, а решение — печатать, предупредить или упасть с ненулевым кодом — принимает вызывающий код. Печать и выход внутри функции жёстко привязывают её к одному сценарию использования.
  id: 007-code-lint-router-3
  fingerprint: f5fd92d0
