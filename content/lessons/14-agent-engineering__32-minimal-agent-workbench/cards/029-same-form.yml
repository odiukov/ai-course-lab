  fingerprint: db6b5140
- concept: три роли устойчивы, потому что каждая отвечает на отдельный вопрос, без которого ход агента не начинается
  question: Почему в очень разных агентских продуктах повторяется одна и та же тройка ролей — роутер, состояние, очередь работы? Назови вопрос, на который отвечает каждая роль.
  explanation: 'Отсюда практический вывод: свой агент можно писать без фреймворка — все три роли реализуются обычным Markdown и JSON, а продукты лишь заворачивают их в свою оболочку.'
  kind: open
  reference: 'Роутер отвечает на вопрос «по каким правилам действовать и где лежат подробности»; состояние — «где я остановился и что делать дальше», причём эта запись должна пережить конец сессии; очередь — «какая работа вообще доступна и что можно взять следующим». Ни один ход невозможен без ответов на все три вопроса, поэтому продукт либо предоставляет их, либо перекладывает на человека. Носители разные: Markdown-файл, внутренняя память сессии, элемент интерфейса — но роли те же.'
  id: 029-same-form-2
  fingerprint: 87fd94be
- concept: носитель роли определяет не саму роль, а её свойства — прежде всего переживает ли запись конец сессии
  question: Продукт хранит состояние агента во внутренней памяти сессии, а не в файле на диске. Что важно проверить, прежде чем считать роль состояния закрытой?
  explanation: Роль состояния существует ради непрерывности между сессиями. Внутренняя память продукта закрывает её, только если переживает завершение сессии и обрезку разговора; иначе разрыв проявится как повторение уже сделанной работы. Формат и место хранения при этом не важны.
  kind: choice
  options:
    - Что память сессии можно экспортировать в JSON — иначе роль не выполнена
    - 'Что запись доступна следующей сессии: если она исчезает вместе с сессией, роль состояния формально занята, но задачу продолжения не решает'
    - Что состояние хранится локально, а не на сервере продукта
    - Что формат состояния совпадает с `agent_state.json`, иначе агент его не разберёт
  correct: 1
