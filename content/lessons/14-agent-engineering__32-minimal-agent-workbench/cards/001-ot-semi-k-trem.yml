- concept: минимальность workbench измеряется отсутствием дублирующих обязанностей, а не количеством файлов
  question: В workbench агента шесть файлов. Два из них независимо хранят список оставшихся задач. Что означает требование «минимального комплекта»?
  explanation: 'Минимальность — про обязанности, а не про счёт. Две поверхности, отвечающие на один вопрос («что осталось»), создают расхождение версий: агент читает одну, человек обновляет другую. Схлопывание дубля убирает проблему; слепое удаление файлов — нет, потому что тогда какая-то обязанность остаётся без носителя.'
  kind: choice
  options:
    - Свести набор к любым двум файлам — чем меньше файлов, тем лучше
    - Объединить два файла с одной обязанностью в один источник, оставив по одной роли на файл
    - Оставить оба файла, но сделать один из них короче другого
    - Слить все шесть файлов в один общий документ
  correct: 1
  id: 001-ot-semi-k-trem-1
  fingerprint: e99a1472
- concept: поверхность входит в минимальный комплект, только если помогает принять решение перед ходом агента
  question: Кандидат в workbench — файл `style_history.md` с историей споров команды об оформлении кода. Как решить, включать ли его в минимальный комплект?
  explanation: Критерий отбора — влияние на конкретное решение перед ходом. Файл, не отвечающий ни на один из этих вопросов, не пропадает — он просто становится глубоким документом, который загружается по ссылке при необходимости, а не входит в базовый набор.
  kind: choice
  options:
    - 'Включить: любая документация полезна агенту'
    - Проверить, помогает ли он агенту решить, куда обратиться за правилами, где сейчас работа и что делать дальше; если нет — он вне минимального комплекта
    - Включить, если он короче остальных файлов
    - Исключить, потому что минимальный комплект не может расти со временем
  correct: 1
  id: 001-ot-semi-k-trem-2
  fingerprint: 6e442d02
