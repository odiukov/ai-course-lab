- concept: 'оркестратор ходов не воспроизводит работу хода: чтение и запись файлов остаются внутри хода, поэтому передавать состояние между итерациями в памяти не нужно'
  question: Функция сессии повторно вызывает ход, каждый раз передавая только каталог workbench, и не хранит между итерациями ни текущую задачу, ни содержимое состояния. Объясни, почему такая передача данных достаточна и что сломалось бы, начни сессия сама инициализировать состояние перед первой итерацией.
  explanation: 'Разделение простое: сессия решает «делать ли ещё ход», ход решает «что именно сделать». Инициализация состояния — это действие над данными, то есть зона ответственности хода, а не цикла. Именно поэтому второй запуск подхватывает работу там, где остановился первый.'
  kind: open
  reference: 'Каждый ход сам открывает файл состояния и доску, отрабатывает и записывает результат обратно, поэтому канал передачи данных между итерациями — файлы на диске, а не переменные сессии. Каталог однозначно определяет этот канал. Если сессия перед первой итерацией создаст пустое состояние, она затрёт запись, оставленную предыдущим запуском: уже взятая задача потеряет исполнителя, а работа начнётся заново. Оркестратор обязан оставаться без собственной памяти о задаче — иначе появляется второй источник истины, который расходится с файлом.'
  id: 021-code-run-session-3
