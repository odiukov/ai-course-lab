- concept: лимит числа ходов — страховка от незавершающегося цикла при некорректных исходах, а не штатное условие выхода
  question: Зачем циклу многократных ходов агента нужен явный верхний предел числа итераций, если цикл и так останавливается, когда работа кончилась или потребовался человек?
  explanation: 'Штатные выходы опираются на данные, которые вернул сам ход. Если ход из-за ошибки всегда рапортует «продолжаю» или не двигает файлы, цикл без предела крутится вечно. Лимит — независимый от этих данных стоп, поэтому он никогда не должен быть основным способом завершения: срабатывание лимита само по себе сигнал неисправности.'
  kind: choice
  options:
    - Чтобы ограничить расход токенов на один ход
    - Чтобы цикл завершился даже тогда, когда исходы ходов перестали сообщать корректную причину остановки
    - Чтобы задачи выполнялись строго по порядку следования на доске
    - Чтобы состояние переписывалось не чаще заданного числа раз
