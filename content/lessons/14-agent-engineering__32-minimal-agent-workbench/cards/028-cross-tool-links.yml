- concept: симлинки убирают шаг синхронизации копий, а не ускоряют его
  question: Команда правит одно правило запуска тестов. В репозитории A файлы правил для четырёх агентов — симлинки на общий источник, в репозитории B — четыре отдельных файла с одинаковым текстом. Чем принципиально различается работа?
  explanation: Дело не в скорости редактирования, а в исчезновении класса ошибок. Один источник — один ответ на вопрос «какая команда тестов правильная». Четыре копии живут самостоятельно, и через месяц репозиторий содержит четыре набора правил, то есть ровно ту противоречивость, которая роняет агента в жадный режим.
  kind: choice
  options:
    - В A правка занимает меньше времени, но проверять согласованность файлов всё равно нужно
    - В A шага согласования нет вообще, потому что копий нет; в B согласованность приходится поддерживать вручную и она разъезжается при первом пропуске
    - В B правила применяются быстрее, так как инструменту не нужно разрешать ссылку
    - 'Различий нет: в обоих случаях агенты читают одинаковый текст'
