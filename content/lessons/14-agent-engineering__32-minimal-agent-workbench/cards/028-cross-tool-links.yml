- concept: симлинк сохраняет связь с целью, поэтому переименование или удаление цели оставляет привычное имя, ведущее в никуда
  question: '`CLAUDE.md`, `.cursorrules` и `.github/copilot-instructions.md` — симлинки на корневой `AGENTS.md`. Разработчик переименовывает `AGENTS.md` в `AGENT_RULES.md`. Что произойдёт?'
  explanation: 'Ссылка хранит путь к цели, а не текст. Пока цель на месте, все имена дают одно содержимое; после переименования имена сохраняются, а чтение ведёт в никуда — и сбой выглядит как «правила вдруг перестали действовать». Отсюда правило: цель симлинка нельзя переименовывать или удалять, не поправив ссылки.'
  kind: choice
  options:
    - Ссылки автоматически перенастроятся на новое имя файла
    - 'Все три имени останутся на месте, но станут битыми ссылками: инструменты видят файл и не получают содержимого'
    - Содержимое `AGENTS.md` скопируется в каждую из трёх ссылок при следующем чтении
    - Инструменты продолжат читать правила из кеша, пока не перезапустятся
