- concept: разорванная связь между сессиями проявляется как повторение уже выполненной работы, а не как ошибка
  question: После перезапуска агент снова назначает себе ту же задачу и повторно вносит уже внесённое изменение. Ошибок и падений нет. О чём это говорит?
  explanation: 'Потеря преемственности не даёт исключения — она даёт дублирующую работу. Диагностический признак именно такой: запуск выглядит успешным, но прогресс не двигается. Лечится чтением сохранённых фактов до любого решения о том, что делать.'
  kind: choice
  options:
    - Сессия не читает сохранённые факты до выбора работы и стартует так, будто прошлой работы не было
    - Файл состояния повреждён и его нужно удалить
    - Лимит ходов выставлен слишком маленьким
    - Задача сформулирована слишком крупно для одного хода
  correct: 0
