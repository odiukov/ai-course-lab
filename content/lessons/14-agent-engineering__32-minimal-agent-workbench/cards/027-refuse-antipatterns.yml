- concept: противоречивые инструкции проявляются не как отказ или вопрос, а как тихий переход к жадному выбору первого правдоподобного пути
  question: В собранном наборе инструкций одновременно оказались «никогда не меняй публичный интерфейс» и «переименуй публичные методы для единообразия». Как это чаще всего проявляется в поведении агента?
  explanation: 'Замер AMBIG-SWE: при противоречащих инструкциях доля решённых задач падает с 48,8% до 28%, и падение сопровождается сменой режима — из интерактивного (уточняющего) в жадный. Опасность в том, что отказа нет: работа продолжается, просто по угаданной ветке. Лечение — явная нумерация приоритетов вместо плоского списка равноправных пожеланий.'
  kind: choice
  options:
    - Агент останавливается и просит человека снять противоречие
    - Агент перестаёт уточнять и молча выбирает первый правдоподобный путь — доля решённых задач падает почти вдвое
    - Агент выполняет оба правила по очереди, откатывая изменения
    - Агент выдаёт ошибку разбора инструкций и не начинает ход
  correct: 1
  id: 027-refuse-antipatterns-1
  fingerprint: e8f1432e
- concept: правило стиля становится проверяемым только вместе с конкретной командой-энфорсером и ожидаемым исходом
  question: 'В инструкциях записано: «соблюдай Google Python Style Guide». Что с этим правилом не так и как его починить?'
  explanation: 'Без энфорсера у правила нет наблюдаемого критерия выполнения: агент решает, что код «выглядит подходяще», и идёт дальше. Формулировка «после изменений запусти `make lint`, команда должна завершиться без ошибок» превращает пожелание в проверку с однозначным исходом. Цитирование гайда целиком проблему не решает, а только жжёт контекст.'
  kind: choice
  options:
    - Оно слишком строгое — надо смягчить формулировку до рекомендации
    - 'Оно непроверяемо: соответствие агент назначает себе сам. Нужно приложить точную команду линтера и требуемый исход её запуска'
    - Оно относится к людям, а ссылку на внешний документ агент открыть не может, поэтому правило надо процитировать целиком
    - Оно должно стоять в начале документа, тогда агент точно его учтёт
  correct: 1
  id: 027-refuse-antipatterns-2
  fingerprint: 81af8cb7
- concept: 'порядок разделов инструкции: команды верификации первыми, ограничения дальше, стилевые пожелания последними'
  question: Расставь разделы `AGENTS.md` в порядке, который рекомендуется для агентского чтения — от первого к последнему.
  explanation: Если начать со стиля, путь верификации оказывается погребён под длинным описанием оформления, и главное — как доказать, что работа не сломана, — теряется. Команды идут первыми, стиль последним; сухость изложения здесь фича, а не небрежность.
  kind: order
  items:
    - 'Команды верификации: как запустить тесты, линтер и сборку и какой исход считается успешным'
    - 'Ограничения на изменения: что трогать нельзя, какие интерфейсы и каталоги под запретом'
    - 'Стилевые пожелания: оформление, именование, порядок импортов'
  id: 027-refuse-antipatterns-3
  fingerprint: 302fb630
