- concept: сводка доски — производное представление, поэтому при расхождении авторитетен источник, а чинят генератор сводки
  question: 'Обзор доски показывает «блокированных задач: 0», а в самом файле доски одна задача со статусом blocked. Как следует поступить?'
  explanation: 'Обзор не хранит собственных фактов: он целиком вычисляется из доски. Значит, разойтись они могут только из-за ошибки вычисления или устаревшего кеша обзора. Правка доски «под обзор» уничтожит настоящие данные и превратит производное представление во второй источник истины.'
  kind: choice
  options:
    - Считать верным обзор и снять статус blocked в файле доски
    - Считать верным файл доски и исправить построение обзора
    - Считать оба представления равноправными и выбрать более свежее по времени изменения
    - Занести расхождение в файл состояния агента как блокер
  correct: 1
  id: 022-board-observability-1
  fingerprint: 1076dd12
- concept: состав операционного обзора определяется решением, которое он должен поддержать, а не полнотой исходной карточки
  question: Почему в короткий обзор доски выносят распределение по статусам, активную задачу и наличие задач, ждущих человека, но не выносят критерии приёмки каждой задачи?
  explanation: 'Отбор полей в обзоре — это не сжатие ради экономии места, а подгонка под конкретное решение. Детали задачи остаются в доске и доступны тому, кто её берёт; в обзоре они только заслоняют сигнал. Тот же критерий работает наоборот: если поле не влияет на решение «вмешаться или нет», ему в обзоре не место.'
  kind: choice
  options:
    - Критерии приёмки слишком длинные, чтобы храниться в JSON
    - Критерии приёмки нужны исполнителю одной конкретной задачи, а обзор отвечает на другой вопрос — требуется ли вмешательство прямо сейчас
    - Критерии приёмки меняются чаще остальных полей и быстро устаревают
    - Критерии приёмки дублируют поле цели, поэтому их не показывают нигде
  correct: 1
  id: 022-board-observability-2
  fingerprint: ea2694dc
