- concept: 'обновление только доски даёт зависшую задачу: она числится в работе, хотя никакой исполнитель её не ведёт'
  question: Агент пометил задачу T-21 на доске как in_progress, но процесс упал до записи agent_state.json. Что произойдёт при следующем запуске?
  explanation: 'Состояние — точка входа хода, и оно пустое. Агент честно решит, что ничем не занят, и уйдёт к следующей задаче. T-21 при этом навсегда останется «в работе»: её никто не ведёт, но и взять её больше нельзя, потому что статус уже не todo.'
  kind: choice
  options:
    - Агент увидит пустое состояние, возьмёт другую задачу, а T-21 останется числиться в работе без исполнителя
    - Агент восстановит T-21 из доски, потому что состояние всегда выводится из неё
    - Доска автоматически вернёт T-21 в статус todo
    - Агент откажется работать, пока доска не станет пустой
  correct: 0
  id: 015-pull-transition-1
  fingerprint: e31bcde4
- concept: обновление только состояния оставляет задачу на доске свободной и допускает её повторный захват
  question: Агент записал идентификатор задачи в agent_state.json, но оставил её на доске со статусом todo. В чём главный риск?
  explanation: Доска — общая поверхность, по ней остальные участники решают, что свободно. Пока на ней написано todo, задача выглядит ничьей, даже если в чьём-то состоянии она уже активна. Два исполнителя начнут одну работу и получат конфликт правок.
  kind: choice
  options:
    - Задача потеряет критерии приёмки
    - Другой исполнитель прочитает доску, увидит todo и возьмёт ту же задачу второй раз
    - Состояние станет нечитаемым для самого агента
    - Задача больше никогда не перейдёт в done
  correct: 1
  id: 015-pull-transition-2
  fingerprint: '69767162'
- concept: 'инвариант после захвата: доска и файл состояния должны одинаково отвечать на вопрос об активной работе, а расхождение чинится до взятия новой задачи'
  question: Объясни своими словами, по какому признаку можно убедиться, что задача действительно взята, и что делать, если доска и файл состояния расходятся.
  explanation: Взятие задачи — один согласованный переход, а не две независимые правки. Пока стороны не совпали, состояние системы не определено, и любое движение вперёд закрепляет ошибку.
  kind: open
  reference: 'Задача взята, если обе записи рассказывают одну историю: на доске у неё рабочий статус и указан владелец, а в состоянии стоит тот же идентификатор задачи и конкретное следующее действие. Простейшая проверка — сравнить идентификатор активной задачи в состоянии с идентификатором задачи в рабочем статусе на доске: они должны совпадать. Если записи расходятся (одна сторона обновлена, другая нет), нельзя молча брать новую задачу — сначала восстанавливают согласие вокруг уже выбранной, иначе одна работа либо потеряется, либо будет начата дважды.'
  id: 015-pull-transition-3
  fingerprint: 4ac594a9
