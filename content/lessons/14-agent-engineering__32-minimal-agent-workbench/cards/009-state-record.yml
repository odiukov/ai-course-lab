- concept: система учёта хранит короткий актуальный ответ о текущем положении, а не полный рассказ о прошлом
  question: Почему файл состояния держат коротким и переписывают, вместо того чтобы накапливать в нём подробную летопись сессии?
  explanation: 'Устаревшая или разросшаяся запись хуже отсутствующей: агент опирается на неё как на актуальную. Поэтому файл обновляют после каждого заметного изменения состояния.'
  kind: open
  reference: Файл отвечает на вопрос «в каком состоянии работа сейчас», и этот ответ должен читаться на каждом ходу целиком. Растущая летопись перестаёт помещаться в контекст и вынуждает искать актуальную запись среди устаревших, то есть возвращает ту же работу, от которой файл избавляет. Историю при необходимости хранит система контроля версий, а состояние остаётся текущим срезом.
  id: 009-state-record-3
  fingerprint: 18123dda
