- concept: при расхождении файла состояния и памяти сессии авторитетна запись в файле
  question: Агент помнит из текущего диалога, что активна задача по доске задач, а файл состояния называет активной задачу по роутеру. Что считается верным?
  explanation: Система учёта — это место, чья запись считается основной при расхождении. Если право последнего слова отдать памяти сессии, файл перестаёт быть опорой ровно тогда, когда он нужнее всего — после смены сессии.
  kind: choice
  options:
    - Запись в файле состояния — она и есть система учёта
    - Память сессии — она свежее файла
    - 'Ни то ни другое: работу нужно начинать заново'
    - То, что чаще упоминалось в диалоге
  correct: 0
  id: 009-state-record-1
  fingerprint: aafe1d64
- concept: изменения в репозитории показывают результат работы, но не намерение и не активную задачу
  question: Новая сессия видит в репозитории два изменённых файла и больше ничего. Чего принципиально нельзя извлечь из самих изменений?
  explanation: Артефакты хранят результат, а не намерение. Восстановление намерения по изменениям — это догадка, поэтому активная задача, причина решения и точка остановки записываются отдельно.
  kind: choice
  options:
    - Какую задачу агент считал активной и почему выбрал этот путь
    - Какие строки были добавлены и удалены
    - Какие файлы затронуты
    - В каком порядке файлы были сохранены
  correct: 0
