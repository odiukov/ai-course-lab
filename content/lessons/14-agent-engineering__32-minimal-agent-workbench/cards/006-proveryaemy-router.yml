  question: Объясни своими словами, почему проверять длину роутера и существование его ссылок выгоднее в момент правки файла, а не тогда, когда агент попробует пройти по маршруту.
  explanation: 'Проверка не оценивает качество текста, она удерживает уже принятое устройство: указатель короток и ведёт к реальному месту. Ценность в ранности — цена ошибки растёт по мере удаления от момента, когда её внесли.'
