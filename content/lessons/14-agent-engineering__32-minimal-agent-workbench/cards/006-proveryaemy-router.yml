  reference: 'В момент правки известно, какое именно изменение сломало условие: диапазон подозреваемых — одна правка, и починка сводится к её откату или доработке. Если ошибка всплывает во время хода агента, симптом отделён от причины: агент упирается в отсутствующий документ или теряет нужную оговорку в разросшемся тексте, а разбирать приходится уже испорченное состояние и потраченный ход. Плюс отказ во время выполнения недетерминирован — маршрут может долго не задеваться, и битая ссылка живёт в репозитории незамеченной.'
