- concept: монолитная инструкция передаётся при каждом вызове, поэтому её объём — постоянный налог на контекст
  question: Монолитный файл инструкций занимает 2400 строк и грузится при каждом вызове модели. Его заменяют роутером на 40 строк плюс глубокие документы, которые читаются только по ссылке. Во сколько раз меньше строк инструкций попадает в контекст на вызове, где глубокие документы не понадобились?
  explanation: 2400 / 40 = 60. Экономия берётся не из того, что знаний стало меньше, а из того, что нерелевантные разделы больше не оплачиваются токенами на каждом вызове и не занимают место, нужное коду, истории работы и ответу.
  kind: numeric
  answer: 60
  tolerance: 0.5
  id: 002-cena-monolita-1
  fingerprint: 7b9b50b6
- concept: типичный отказ при перегруженной инструкции — не полное игнорирование, а потеря одной релевантной оговорки среди нерелевантных правил
  question: Агенту выдали огромный файл правил. В нём есть нужная оговорка «не менять публичные имена без проверки», зажатая между разделами о миграциях и релизах. Какой отказ наиболее вероятен?
  explanation: Внимание модели ограничено и распределяется по всему загруженному тексту. Чем больше одновременно активных правил, тем выше шанс, что редкое, но решающее ограничение проиграет конкуренцию заметным общим формулировкам. Отказ выглядит как «в целом всё сделано правильно, кроме одной детали» — и потому его труднее заметить.
  kind: choice
  options:
    - Агент проигнорирует файл целиком и будет действовать без правил
    - Агент уверенно выполнит заметные общие указания и пропустит именно эту тихую критичную оговорку
    - Агент откажется работать, пока файл не сократят
    - Агент выполнит все правила из файла одинаково точно
  correct: 1
  id: 002-cena-monolita-2
  fingerprint: a8e6c36a
- concept: 'у длинной инструкции две разные цены: разбавление внимания и вытеснение полезного контекста'
  question: Объясни своими словами, почему увеличение объёма инструкций для агента может ухудшить результат, хотя каждое добавленное правило по отдельности верно.
  explanation: 'Разбор должен назвать оба эффекта. Уроковый пример: 3000 строк правил ради замены подписи одной кнопки — почти весь этот объём оплачен и не использован.'
  kind: open
  reference: 'Каждое правило верно, но грузятся они все сразу. Первая цена — конкуренция за внимание: релевантная оговорка тонет среди разделов, к текущей задаче не относящихся. Вторая цена — буквальная: текст передаётся токенами при каждом вызове, за нерелевантные разделы платят деньгами, и они занимают место, которое могло бы уйти под код, историю работы и ответ. Поэтому инструкция хороша не когда содержит всё, а когда нужное правило трудно не заметить: остальное выносится в глубокие документы и загружается по ссылке.'
  id: 002-cena-monolita-3
  fingerprint: 8c2fa406
