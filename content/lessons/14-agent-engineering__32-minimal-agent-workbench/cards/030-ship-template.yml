- concept: генерация workbench завершена только при заполненной реальным бэклогом доске
  question: Генератор создал корректный роутер, корректный файл состояния и `task_board.json` с пустым списком задач. Почему это считается незавершённой раскладкой?
  explanation: 'Доска существует ради одного вопроса — какую работу можно взять. Без карточек ответ пуст, и наличие файла ничего не добавляет. Демонстрационная заглушка не лучше: она даёт агенту работу, которая никому не нужна. Раскладка закончена, когда в доске лежит сегодняшний бэклог репозитория.'
  kind: choice
  options:
    - Пустой JSON-массив невалиден и сломает разбор файла
    - 'Функции выбора не из чего выбирать: пустая доска даёт агенту тот же результат, что и отсутствующая, — работы нет'
    - Агент воспримет пустую доску как сигнал, что все задачи выполнены, и удалит файл
    - Пустая доска нарушает соответствие между состоянием и очередью
