- concept: генератор разделяет фиксированную форму workbench и переменные данные конкретного репозитория
  question: Что в переиспользуемом генераторе трёхфайлового workbench задано раз и навсегда, а что приходится передавать для каждого нового репозитория? Приведи примеры переменной части.
  explanation: 'Поэтому генератор полезнее считать формой приёмки нового репозитория, а не копировщиком: одна команда экономит время именно потому, что заранее требует правильные вводные.'
  kind: open
  reference: 'Фиксирована форма: состав файлов и их роли — компактный роутер `AGENTS.md`, `agent_state.json` с нужными ключами, `task_board.json` со схемой карточек; фиксированы и правила, по которым эти части устроены. Переменны данные репозитория: название и цель проекта, реальные пути к глубоким документам, к которым ведёт роутер, команды верификации этого проекта, текущее состояние работы и сегодняшний бэклог задач. Генератор не проектирует репозиторий за инженера — он превращает собранные вводные в согласованный комплект.'
