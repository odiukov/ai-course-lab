- concept: правило выбора живёт в одном месте, захват его вызывает, а не воспроизводит
  question: Внутри операции захвата правила отбора задачи выписаны заново, вместо вызова готовой функции выбора. Код работает. Чем это опасно?
  explanation: Расхождение проявится не как падение, а как тихая рассинхронизация ответов на один вопрос. Одно правило — одна реализация; захват отвечает только за согласованную запись.
  kind: choice
  options:
    - 'Появляются две независимые копии правила: при изменении условий отбора они разойдутся, и предпросмотр начнёт показывать не ту задачу, которую реально захватит агент'
    - Захват станет медленнее из-за лишнего прохода по доске
    - Файл состояния и доска перестанут обновляться синхронно
    - Функция выбора потеряет возможность вернуть пустой результат
