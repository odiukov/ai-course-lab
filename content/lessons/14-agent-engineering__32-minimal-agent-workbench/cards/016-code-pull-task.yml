- concept: переход в работу правит поля существующей карточки, а не подменяет её новым объектом
  question: При захвате карточка на доске заменяется свежим словарём с полями идентификатора, статуса и владельца. Какое последствие наступит позже всего, но больнее всего?
  explanation: 'Захват — это переход состояния карточки, а не её пересоздание. Границы и критерии приёмки нужны ровно после захвата: по ним агент понимает, что можно трогать и когда работа считается сделанной.'
  kind: choice
  options:
    - Во время работы и при закрытии задачи негде взять цель, разрешённые границы правок и критерии приёмки — они были стёрты в момент захвата
    - Идентификатор в состоянии и на доске перестанут совпадать
    - Задача больше не сможет вернуться в статус todo
    - Другие задачи на доске потеряют владельцев
