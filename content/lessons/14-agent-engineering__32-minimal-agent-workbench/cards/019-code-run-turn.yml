- concept: ход, отклонённый проверкой перед действием, не оставляет частичных следов ни в файлах, ни в состоянии
  question: Ход собрался изменить файл, которого нет среди файлов активной задачи, и проверка это обнаружила. Что должно остаться после такого хода?
  explanation: 'Проверка стоит до действия именно затем, чтобы отказ был полным: несостоявшийся ход не должен оставлять ни изменённого файла, ни записи о нём. Половинчатый результат хуже отказа — он рассинхронизирует артефакты и журнал, и следующий запуск начнёт с неверных фактов.'
  kind: choice
  options:
    - Файл не изменён и состояние не переписано — ход не состоялся
    - Файл уже изменён, но состояние осталось прежним
    - Файл изменён, а в состоянии отмечено, что правка была вне границ
    - Файл не изменён, но состояние переведено в done
  correct: 0
