- concept: явное поле приоритета делает важность данными карточки, а не побочным следствием расположения строк в файле
  question: На доске задач порядок записей сложился как порядок добавления. Объясни, что меняет введение поля priority в правиле выбора задачи и почему без него позиция строки — плохой заменитель важности.
  explanation: 'Приоритет уточняет ровно один шаг цикла — выбор среди уже доступных задач. Он не отменяет отсева по статусу и владельцу: сначала отбираются допустимые кандидаты, и лишь среди них сравнивается priority.'
  kind: open
  reference: 'Без поля приоритета правило выбора берёт первую подходящую задачу в статусе todo, то есть фактически опирается на порядок строк в файле. Этот порядок задан историей записи (кто и когда добавил карточку), а не ценностью работы, и меняется от любой перезаписи или переупорядочивания доски — значит важность нигде не зафиксирована и не проверяема. Поле priority делает важность явными данными самой карточки: правило выбора ранжирует по нему среди доступных todo-задач, а позиция строки перестаёт нести смысл. Побочный эффект — важность становится редактируемой и обсуждаемой отдельно от статуса: чтобы поднять задачу, её правят, а не двигают в файле.'
  id: 031-hardening-2
  fingerprint: 4e46f380
- concept: формат хранения доски задаёт размер диффа при изменении одной задачи
  question: Доска из 40 задач хранится одним JSON-массивом с отступами. Агент меняет статус одной задачи, и файл перезаписывается целиком. Что даёт перевод доски на JSON Lines, где каждая задача — отдельный JSON-объект на своей строке?
  explanation: 'JSON Lines меняет не содержание доски, а её гранулярность в системе контроля версий: одна задача — одна строка, поэтому правка одной карточки видна как одна изменённая строка, а не как переформатирование всего массива. Разбор JSON остаётся (построчный), объём почти не меняется, а порядок выбора задаётся правилом выбора и полем приоритета, а не форматом файла.'
  kind: choice
  options:
    - Изменение затрагивает строку только этой задачи, остальные строки остаются байт в байт прежними
    - Файл занимает меньше места, поэтому агент тратит меньше контекста на чтение
    - Задачи читаются быстрее, потому что разбор JSON больше не нужен
    - Порядок задач в файле перестаёт влиять на выбор следующей задачи
  correct: 0
  id: 031-hardening-3
