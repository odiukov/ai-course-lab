- concept: 'тест на протечку содержимого в роутер: правка глубокого документа не должна требовать правки роутера'
  question: Как проверить, что в корневой файл маршрутизации не просочился текст руководства?
  explanation: Указатель остаётся верным, когда документ за ним меняется. Если правка правила заставляет синхронно править роутер, значит роутер хранит копию знания, а не адрес. Такие копии неизбежно расходятся с оригиналом и превращаются в тихо устаревшую инструкцию.
  kind: choice
  options:
    - Посчитать, сколько в нём заголовков
    - 'Изменить подробное правило в глубоком документе и посмотреть, придётся ли из-за этого править роутер: если да — содержимое протекло'
    - Проверить, что все ссылки ведут на файлы в одном каталоге
    - Убедиться, что роутер написан тем же стилем, что и глубокие документы
  correct: 1
  id: 004-router-links-1
  fingerprint: fe6d6309
- concept: копия содержимого в роутере создаёт второй источник истины и устаревает
  question: Команда решила продублировать текущий список открытых задач прямо в корневой файл маршрутизации, «чтобы агент видел его сразу». Объясни, чем это плохо.
  explanation: 'Ключевые пункты: расхождение версий, ложная уверенность агента и разрастание роутера. Правило простое — в роутере адреса, в целевых файлах содержимое.'
  kind: open
  reference: 'Появляется второй источник истины для одной обязанности. Настоящая очередь живёт в файле доски и меняется на каждом ходу; копия в роутере обновляется руками и начинает отставать. Агент, прочитавший копию, возьмёт закрытую или чужую задачу и при этом будет уверен, что действует по актуальным данным. Плюс копия растит роутер, возвращая его из роли указателя в роль руководства. Правильно — оставить ссылку на доску: она остаётся верной при любых изменениях содержимого.'
  id: 004-router-links-2
  fingerprint: c1188668
