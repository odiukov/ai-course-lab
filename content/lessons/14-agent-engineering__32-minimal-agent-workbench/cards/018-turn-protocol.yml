- concept: 'порядок хода: контекст, затем обязательство, затем ограниченное действие, затем запись'
  question: Расставь этапы одного хода агента в правильном порядке.
  explanation: Чтение первым даёт контекст и не даёт начать вторую работу поверх начатой. Запись последней превращает журнал в отчёт о фактах. Правка допустима только между этими двумя точками.
  kind: order
  items:
    - Прочитать файл состояния и узнать, есть ли уже активная работа
    - Если активной работы нет — взять следующую доступную задачу из очереди
    - 'Сверить разрешённые границы задачи: какой файл можно трогать и по каким критериям работа принимается'
    - Сделать одно ограниченное изменение внутри этих границ
    - 'Записать обновлённое состояние: что сделано и какое действие следующее'
  id: 018-turn-protocol-1
  fingerprint: bc7c2380
- concept: правка ограничена файлами из границ задачи, соседний файл — предмет другого хода
  question: Задача разрешает править один конкретный файл. Агент замечает, что такая же устаревшая строка встречается ещё в нескольких соседних файлах, и хочет починить их заодно. Почему это плохой ход?
  explanation: Границы задачи — это контракт о том, чего агент точно не тронет. Без него ревьюер не может судить о ходе, а параллельный исполнитель получает конфликт на файле, который никто ему не отдавал.
  kind: choice
  options:
    - Правки вне объявленных границ пересекаются с работой других исполнителей и делают результат хода непроверяемым по критериям приёмки — лишние файлы должны стать отдельной задачей
    - Массовая правка сделает diff слишком большим для записи в файл состояния
    - Соседние файлы нельзя менять, пока их статус на доске не равен todo
    - Правка соседних файлов допустима, если агент упомянет их в поле следующего действия
  correct: 0
  id: 018-turn-protocol-2
  fingerprint: b47a04f0
- concept: запись состояния после выполнения фиксирует факт, запись до выполнения фиксирует лишь намерение
  question: Агент записывает в файл состояния результат хода до того, как реально трогает файл. Объясни своими словами, почему такой порядок портит журнал.
  explanation: Ценность файла состояния в том, что ему можно верить без перепроверки репозитория. Преждевременная запись превращает журнал фактов в список планов, а расхождение обнаружится только на следующем ходу.
  kind: open
  reference: 'Запись до действия описывает намерение, а не факт: если ход прервётся, упадёт на ошибке или изменение выйдет другим, в файле останется утверждение о работе, которой не было. Следующий ход начнётся с чтения этого файла и построит решения на ложном контексте. Правильный порядок — прочитать состояние, выполнить ограниченное изменение, и только потом записать, что сделано и какое действие следующее.'
  id: 018-turn-protocol-3
  fingerprint: 39fc6e26
