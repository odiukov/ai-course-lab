- concept: поля сводки, требующие внимания, копируются из карточек доски, а не реконструируются по эвристике из других полей
  question: Сводке нужно показать, какие задачи ждут человека. Как правильно получить это множество?
  explanation: 'Владелец — самостоятельное поле карточки, и только оно отвечает на вопрос «кто действует следующим». Статус blocked и владелец human пересекаются, но не совпадают: задача может быть заблокирована, оставаясь за агентом, и наоборот. Восстановление поля по косвенным признакам даёт сводку, которая иногда врёт и при этом выглядит уверенно.'
  kind: choice
  options:
    - Прочитать поле владельца в каждой карточке доски
    - Считать ждущими человека все задачи со статусом blocked
    - Считать ждущими человека все задачи, не имеющие критериев приёмки
    - Взять задачу, записанную в файле состояния агента как активная
