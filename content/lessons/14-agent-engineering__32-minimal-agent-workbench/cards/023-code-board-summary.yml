- concept: 'неизвестное значение статуса не сводится к разрешённому: подсчёт не должен скрывать порчу данных'
  question: При обходе доски встретилась задача со статусом, которого нет среди допустимых. Какое поведение функции подсчёта правильное?
  explanation: 'Любая раскладка чужого статуса по четырём разрешённым — это догадка, выданная за факт: сводка станет правдоподобной и неверной. И тихий пропуск не лучше — задача исчезнет из общего числа. Испорченные данные обязаны доходить до наблюдателя, потому что чинить надо доску, а не отчёт по ней.'
  kind: choice
  options:
    - Отнести её к todo, поскольку работа явно не завершена
    - Отнести её к blocked, поскольку статус нераспознан
    - Не подмешивать её в счётчики допустимых статусов, а сделать проблему видимой
    - Молча пропустить задачу, чтобы сумма счётчиков осталась круглой
