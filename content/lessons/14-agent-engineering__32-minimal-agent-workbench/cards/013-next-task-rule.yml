- concept: 'статус задачи отсекает недоступную работу до любой другой проверки: done, blocked и in_progress не дают кандидата'
  question: 'На доске 9 задач. Сверху вниз первые четыре: задача со статусом done (owner builder), задача blocked (owner builder), задача in_progress (owner builder), задача todo (owner builder). Агент работает в роли builder и ищет, что взять. Какая из четырёх — кандидат?'
  explanation: Из четырёх статусов только todo означает незанятую работу. done уже не требует действий, blocked нельзя продолжать без снятия причины, in_progress уже кем-то ведётся — вход в неё это перехват чужого хода. Совпадение роли не спасает задачу с неподходящим статусом.
  kind: choice
  options:
    - 'Вторая: blocked означает, что её надо разблокировать своими силами'
    - 'Третья: статус in_progress и роль совпадает, значит работа уже её'
    - 'Четвёртая: единственная свободная работа для этой роли'
    - 'Первая: done можно перепроверить и закрыть заново'
  correct: 2
  id: 013-next-task-rule-1
  fingerprint: 9640d366
- concept: при нескольких равно подходящих задачах выбор задаётся фиксированным обходом доски, чтобы одинаковый вход давал одинаковый результат
  question: После фильтрации по статусу и роли на доске осталось 7 подходящих задач. Как правило выбора должно решать, какую из них вернуть?
  explanation: 'Правило выбора должно быть детерминированным: при одном и том же содержимом доски агент обязан каждый раз получать один и тот же ответ. Иначе нельзя объяснить, почему взята именно эта задача, и нельзя воспроизвести поведение при разборе хода. Порядок записей на доске — самый дешёвый предсказуемый критерий.'
  kind: choice
  options:
    - Брать любую из подходящих — все они формально доступны
    - Брать первую в порядке записи на доске
    - Брать задачу с самыми короткими критериями приёмки
    - Брать случайную, чтобы равномерно нагружать разные части плана
  correct: 1
  id: 013-next-task-rule-2
  fingerprint: 9799668e
