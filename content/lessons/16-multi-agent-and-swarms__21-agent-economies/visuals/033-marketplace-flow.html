<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Поток минимального маркетплейса агентов</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f9fc;
    --panel: #ffffff;
    --panel-alt: #edf3fa;
    --text: #172033;
    --muted: #526078;
    --line: #67758d;
    --accent: #2969d3;
    --accent-fill: #dceaff;
    --success: #18794e;
    --success-fill: #dff5e9;
    --gold: #9a6200;
    --gold-fill: #fff0c7;
    --violet: #7552c7;
    --violet-fill: #eee7ff;
  }

  * { box-sizing: border-box; }

  body {
    margin: unset;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  figure { margin: unset; }

  h1 {
    margin: unset;
    padding: 10px 16px;
    background: var(--bg);
    color: var(--text);
    font-size: 20px;
    font-weight: bold;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 460px;
    background: var(--bg);
  }

  .stage {
    fill: var(--panel);
    stroke: var(--line);
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
  }

  .stage-accent {
    fill: var(--accent-fill);
    stroke: var(--accent);
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
  }

  .stage-success {
    fill: var(--success-fill);
    stroke: var(--success);
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
  }

  .stage-gold {
    fill: var(--gold-fill);
    stroke: var(--gold);
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
  }

  .stage-violet {
    fill: var(--violet-fill);
    stroke: var(--violet);
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
  }

  .bid {
    fill: var(--panel-alt);
    stroke: var(--line);
    stroke-width: 1.5;
    vector-effect: non-scaling-stroke;
  }

  .coalition {
    fill: var(--panel-alt);
    stroke: var(--violet);
    stroke-width: 1.5;
    vector-effect: non-scaling-stroke;
  }

  .arrow, .feedback {
    fill: none;
    stroke: var(--accent);
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
  }

  .feedback { stroke: var(--success); }

  .arrow-head { fill: var(--accent); }
  .feedback-head { fill: var(--success); }

  text {
    fill: var(--text);
    font-size: 14px;
    dominant-baseline: middle;
  }

  .stage-title {
    font-size: 16px;
    font-weight: bold;
  }

  .small {
    fill: var(--muted);
    font-size: 12px;
  }

  .flow-label {
    fill: var(--accent);
    font-size: 12px;
    font-weight: bold;
  }

  .feedback-label {
    fill: var(--success);
    font-size: 13px;
    font-weight: bold;
  }

  .emphasis {
    fill: var(--success);
    font-size: 14px;
    font-weight: bold;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10151f;
      --panel: #192231;
      --panel-alt: #222e40;
      --text: #edf3ff;
      --muted: #aab8ce;
      --line: #71819b;
      --accent: #76a8ff;
      --accent-fill: #18365f;
      --success: #66d49d;
      --success-fill: #153d2d;
      --gold: #f2c15d;
      --gold-fill: #4b3814;
      --violet: #b99cff;
      --violet-fill: #34265a;
    }
  }
</style>
</head>
<body>
<figure aria-labelledby="diagram-title">
  <h1 id="diagram-title">Поток минимального маркетплейса агентов</h1>
  <svg id="diagram" viewBox="0 0 1100 460" width="1100" height="460"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Три агента подают ставки, победитель выполняет задачу, независимая проверка оценивает коалиции, награда распределяется по Шепли, а качество обновляет DID-репутацию.">
  </svg>
</figure>
<script>
const DATA = [
  {kind:"config", zero:0, fallbackX:550, fallbackY:230},

  {kind:"rect", x1:24, y1:174, x2:146, y2:286, cls:"stage-accent"},
  {kind:"rect", x1:174, y1:160, x2:300, y2:300, cls:"stage"},
  {kind:"rect", x1:328, y1:62, x2:510, y2:354, cls:"stage"},
  {kind:"rect", x1:348, y1:106, x2:490, y2:146, cls:"bid"},
  {kind:"rect", x1:348, y1:164, x2:490, y2:204, cls:"bid"},
  {kind:"rect", x1:348, y1:222, x2:490, y2:262, cls:"bid"},
  {kind:"rect", x1:348, y1:286, x2:490, y2:336, cls:"stage-gold"},
  {kind:"rect", x1:540, y1:174, x2:660, y2:286, cls:"stage-accent"},
  {kind:"rect", x1:690, y1:98, x2:824, y2:342, cls:"stage-violet"},
  {kind:"rect", x1:850, y1:126, x2:974, y2:314, cls:"stage-gold"},
  {kind:"rect", x1:996, y1:158, x2:1080, y2:282, cls:"stage-success"},

  {kind:"line", x1:146, y1:230, x2:174, y2:230, cls:"arrow"},
  {kind:"poly", points:[[174,230],[163,223],[163,237]], cls:"arrow-head"},
  {kind:"line", x1:300, y1:230, x2:328, y2:230, cls:"arrow"},
  {kind:"poly", points:[[328,230],[317,223],[317,237]], cls:"arrow-head"},
  {kind:"line", x1:510, y1:230, x2:540, y2:230, cls:"arrow"},
  {kind:"poly", points:[[540,230],[529,223],[529,237]], cls:"arrow-head"},
  {kind:"line", x1:660, y1:230, x2:690, y2:230, cls:"arrow"},
  {kind:"poly", points:[[690,230],[679,223],[679,237]], cls:"arrow-head"},
  {kind:"line", x1:824, y1:230, x2:850, y2:230, cls:"arrow"},
  {kind:"poly", points:[[850,230],[839,223],[839,237]], cls:"arrow-head"},
  {kind:"line", x1:974, y1:230, x2:996, y2:230, cls:"arrow"},
  {kind:"poly", points:[[996,230],[985,223],[985,237]], cls:"arrow-head"},

  {kind:"path", points:[[1038,282],[1038,412],[419,412],[419,354]], cls:"feedback"},
  {kind:"poly", points:[[419,354],[411,366],[427,366]], cls:"feedback-head"},

  {kind:"circle", cx:718, cy:188, r:15, cls:"coalition"},
  {kind:"circle", cx:757, cy:188, r:15, cls:"coalition"},
  {kind:"circle", cx:796, cy:188, r:15, cls:"coalition"},
  {kind:"rect", x1:707, y1:218, x2:748, y2:250, cls:"coalition"},
  {kind:"rect", x1:766, y1:218, x2:807, y2:250, cls:"coalition"},
  {kind:"rect", x1:724, y1:264, x2:790, y2:298, cls:"coalition"},

  {kind:"text", x:85, y:202, text:"Задача", anchor:"middle", cls:"stage-title"},
  {kind:"text", x:85, y:232, text:"Краткое резюме", anchor:"middle"},
  {kind:"text", x:85, y:258, text:"Бюджет: 10 единиц", anchor:"middle", cls:"small"},

  {kind:"text", x:237, y:190, text:"Допуск", anchor:"middle", cls:"stage-title"},
  {kind:"text", x:237, y:222, text:"DID участника", anchor:"middle"},
  {kind:"text", x:237, y:250, text:"адрес оплаты", anchor:"middle"},
  {kind:"text", x:237, y:276, text:"проверен", anchor:"middle", cls:"emphasis"},

  {kind:"text", x:419, y:84, text:"Аукцион второй цены", anchor:"middle", cls:"stage-title"},
  {kind:"text", x:365, y:126, text:"Агент А", anchor:"start"},
  {kind:"text", x:475, y:126, text:"ставка", anchor:"end", cls:"small"},
  {kind:"text", x:365, y:184, text:"Агент Б", anchor:"start"},
  {kind:"text", x:475, y:184, text:"ставка", anchor:"end", cls:"small"},
  {kind:"text", x:365, y:242, text:"Агент В", anchor:"start"},
  {kind:"text", x:475, y:242, text:"ставка", anchor:"end", cls:"small"},
  {kind:"text", x:419, y:302, text:"Победитель", anchor:"middle", cls:"stage-title"},
  {kind:"text", x:419, y:324, text:"платёж — следующая ставка", anchor:"middle", cls:"small"},

  {kind:"text", x:600, y:204, text:"Выполнение", anchor:"middle", cls:"stage-title"},
  {kind:"text", x:600, y:233, text:"задача → ответ", anchor:"middle"},
  {kind:"text", x:600, y:260, text:"победитель или команда", anchor:"middle", cls:"small"},

  {kind:"text", x:757, y:122, text:"Независимая", anchor:"middle", cls:"stage-title"},
  {kind:"text", x:757, y:145, text:"проверка качества", anchor:"middle", cls:"stage-title"},
  {kind:"text", x:718, y:188, text:"А", anchor:"middle"},
  {kind:"text", x:757, y:188, text:"Б", anchor:"middle"},
  {kind:"text", x:796, y:188, text:"В", anchor:"middle"},
  {kind:"text", x:727, y:234, text:"А+Б", anchor:"middle", cls:"small"},
  {kind:"text", x:786, y:234, text:"Б+В", anchor:"middle", cls:"small"},
  {kind:"text", x:757, y:281, text:"А+Б+В", anchor:"middle", cls:"small"},
  {kind:"text", x:757, y:320, text:"оценка коалиций", anchor:"middle", cls:"small"},

  {kind:"text", x:912, y:154, text:"Расчёт", anchor:"middle", cls:"stage-title"},
  {kind:"text", x:912, y:188, text:"Награда", anchor:"middle"},
  {kind:"text", x:912, y:216, text:"делится по Шепли", anchor:"middle"},
  {kind:"text", x:912, y:250, text:"вклад каждой", anchor:"middle", cls:"small"},
  {kind:"text", x:912, y:272, text:"коалиции учтён", anchor:"middle", cls:"small"},

  {kind:"text", x:1038, y:184, text:"DID", anchor:"middle", cls:"stage-title"},
  {kind:"text", x:1038, y:212, text:"репутация", anchor:"middle", cls:"stage-title"},
  {kind:"text", x:1038, y:246, text:"качество", anchor:"middle", cls:"small"},
  {kind:"text", x:1038, y:266, text:"обновлено", anchor:"middle", cls:"emphasis"},

  {kind:"text", x:158, y:208, text:"заявка", anchor:"middle", cls:"flow-label"},
  {kind:"text", x:314, y:252, text:"допуск", anchor:"middle", cls:"flow-label"},
  {kind:"text", x:525, y:208, text:"выбор", anchor:"middle", cls:"flow-label"},
  {kind:"text", x:675, y:252, text:"ответ", anchor:"middle", cls:"flow-label"},
  {kind:"text", x:837, y:208, text:"оценка", anchor:"middle", cls:"flow-label"},
  {kind:"text", x:985, y:252, text:"подтверждено", anchor:"middle", cls:"flow-label"},
  {kind:"text", x:728, y:434, text:"подтверждённая DID-репутация влияет на выбор в следующем раунде", anchor:"middle", cls:"feedback-label"}
];

const origin = Object.freeze({x:0, y:0});
const scale = Object.freeze({x:1, y:1});

const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

const [CONFIG, ...ITEMS] = DATA;
const SVG_NS = "http://www.w3.org/2000/svg";
const diagram = document.getElementById("diagram");

function make(tag, attrs, content) {
  const node = document.createElementNS(SVG_NS, tag);
  for (const [name, value] of Object.entries(attrs)) {
    if (value !== undefined) node.setAttribute(name, String(value));
  }
  if (content !== undefined) node.textContent = content;
  return node;
}

try {
  for (const item of ITEMS) {
    let node;

    if (item.kind === "rect") {
      node = make("rect", {
        x: sx(item.x1),
        y: sy(item.y1),
        width: sx(item.x2) - sx(item.x1),
        height: sy(item.y2) - sy(item.y1),
        class: item.cls
      });
    }

    if (item.kind === "circle") {
      node = make("circle", {
        cx: sx(item.cx),
        cy: sy(item.cy),
        r: sx(item.r) - sx(CONFIG.zero),
        class: item.cls
      });
    }

    if (item.kind === "line") {
      node = make("line", {
        x1: sx(item.x1),
        y1: sy(item.y1),
        x2: sx(item.x2),
        y2: sy(item.y2),
        class: item.cls
      });
    }

    if (item.kind === "poly") {
      node = make("polygon", {
        points: item.points.map(([x, y]) => `${sx(x)},${sy(y)}`).join(" "),
        class: item.cls
      });
    }

    if (item.kind === "path") {
      const [start, controlA, controlB, end] = item.points;
      node = make("path", {
        d: `M ${sx(start[CONFIG.zero])} ${sy(start.at(-scale.y))}
            L ${sx(controlA[CONFIG.zero])} ${sy(controlA.at(-scale.y))}
            L ${sx(controlB[CONFIG.zero])} ${sy(controlB.at(-scale.y))}
            L ${sx(end[CONFIG.zero])} ${sy(end.at(-scale.y))}`,
        class: item.cls
      });
    }

    if (item.kind === "text") {
      node = make("text", {
        x: sx(item.x),
        y: sy(item.y),
        "text-anchor": item.anchor,
        class: item.cls
      }, item.text);
    }

    if (node) diagram.appendChild(node);
  }
} catch (error) {
  diagram.replaceChildren(
    make("text", {
      x: sx(CONFIG.fallbackX),
      y: sy(CONFIG.fallbackY),
      "text-anchor": "middle",
      class: "stage-title"
    }, "Схема: ставки → выполнение → проверка коалиций → Шепли → DID-репутация")
  );
}
</script>
</body>
</html>
