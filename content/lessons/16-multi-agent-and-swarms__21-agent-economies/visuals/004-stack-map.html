<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карта пяти слоёв агентной экономики</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fc;
      --panel: #ffffff;
      --text: #172033;
      --muted: #59657a;
      --border: #cfd6e4;
      --guide: #8692a8;
      --footer: #445068;
      --governance: #7657c8;
      --governance-soft: #eee9ff;
      --settlement: #25896d;
      --settlement-soft: #e1f5ee;
      --cognition: #2677ba;
      --cognition-soft: #e4f2ff;
      --identity: #c06d20;
      --identity-soft: #fff0df;
      --depin: #b64e61;
      --depin-soft: #ffe8ed;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #10141d;
        --panel: #181e2a;
        --text: #f2f5fb;
        --muted: #b7c0d1;
        --border: #3b465b;
        --guide: #8490a6;
        --footer: #c4ccda;
        --governance: #b69cff;
        --governance-soft: #29233d;
        --settlement: #66d3af;
        --settlement-soft: #17352f;
        --cognition: #74bdf2;
        --cognition-soft: #172f43;
        --identity: #f0a760;
        --identity-soft: #3c2a1b;
        --depin: #ef8798;
        --depin-soft: #3e222a;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--text);
    }

    body,
    figure,
    h2 {
      margin: unset;
    }

    figure {
      background: var(--page);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    h2 {
      box-sizing: border-box;
      width: 100%;
      font-size: 22px;
      line-height: normal;
      color: var(--text);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 480px;
      background: var(--page);
    }

    .card {
      fill: var(--panel);
      stroke: var(--border);
      stroke-width: 2;
    }

    .accent {
      stroke: none;
    }

    .separator {
      stroke: var(--border);
      stroke-width: 2;
    }

    .guide,
    .connector {
      fill: none;
      stroke: var(--guide);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .layer-name {
      fill: var(--text);
      font-size: 21px;
      font-weight: bold;
    }

    .question {
      fill: var(--text);
      font-size: 18px;
      font-weight: bold;
    }

    .answer {
      fill: var(--muted);
      font-size: 14px;
    }

    .direction {
      fill: var(--muted);
      font-size: 14px;
      font-weight: bold;
    }

    .symbol {
      font-size: 18px;
      font-weight: bold;
    }

    .footer-label {
      fill: var(--footer);
      font-size: 15px;
      font-weight: bold;
    }

    .fallback {
      box-sizing: border-box;
      background: var(--panel);
      color: var(--text);
      border: 2px solid var(--border);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      font-size: 16px;
    }

    [hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-heading">
    <h2 id="diagram-heading">Карта пяти слоёв агентной экономики</h2>
    <svg
      id="diagram"
      viewBox="0 0 1040 460"
      width="1040"
      height="460"
      role="img"
      aria-label="Вертикальный стек из пяти слоёв: снизу DePIN, затем Identity, Cognition, Settlement и Governance"
    ></svg>
    <div id="fallback" class="fallback" hidden>
      Схема должна была показать пять отдельных слоёв одной агентной системы:
      DePIN отвечает, на чём считать; Identity — кто ты; Cognition — чем
      думаешь; Settlement — чем платишь; Governance — кто задаёт правила.
    </div>
  </figure>

  <script>
    const diagramData = [{
      origin: { x: 0, y: 0 },
      scale: { x: 1, y: 1 },
      canvas: { x: 0, y: 0, width: 1040, height: 460 },
      frame: { x: 8, y: 8, width: 1024, height: 444, radius: 16 },
      card: {
        x: 235,
        width: 760,
        height: 62,
        radius: 12,
        accentWidth: 10,
        iconX: 270,
        iconRadius: 18,
        nameX: 302,
        separatorX: 448,
        textX: 476,
        questionOffset: 23,
        answerOffset: 44
      },
      arrow: {
        x: 198,
        shaftTop: 31,
        shaftBottom: 391,
        head: [[198, 14], [187, 32], [209, 32]],
        labelX: 181,
        labelY: 393,
        connectorEndX: 235
      },
      footer: {
        y: 430,
        leftStart: 235,
        leftEnd: 398,
        textX: 615,
        rightStart: 832,
        rightEnd: 995
      },
      layers: [
        {
          name: "Governance",
          question: "кто задаёт правила?",
          answer: "допуск к работе, изменения и споры",
          symbol: "◆",
          y: 36,
          centerY: 67,
          color: "var(--governance)",
          soft: "var(--governance-soft)"
        },
        {
          name: "Settlement",
          question: "чем платишь?",
          answer: "платежи за сервис, работу и вычисления",
          symbol: "₿",
          y: 110,
          centerY: 141,
          color: "var(--settlement)",
          soft: "var(--settlement-soft)"
        },
        {
          name: "Cognition",
          question: "чем думаешь?",
          answer: "понимает задачу и выбирает действие",
          symbol: "✦",
          y: 184,
          centerY: 215,
          color: "var(--cognition)",
          soft: "var(--cognition-soft)"
        },
        {
          name: "Identity",
          question: "кто ты?",
          answer: "устойчивое имя, история и репутация",
          symbol: "●",
          y: 258,
          centerY: 289,
          color: "var(--identity)",
          soft: "var(--identity-soft)"
        },
        {
          name: "DePIN",
          question: "на чём считать?",
          answer: "GPU, хранилище и канал связи",
          symbol: "▦",
          y: 332,
          centerY: 363,
          color: "var(--depin)",
          soft: "var(--depin-soft)"
        }
      ]
    }];

    const config = diagramData.find(Boolean);
    const origin = config.origin;
    const scale = config.scale;
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      if (!svg || !fallback) {
        throw new Error("Контейнер схемы не найден");
      }

      const make = (tag, attributes, content) => {
        const element = document.createElementNS(namespace, tag);
        Object.entries(attributes).forEach(([name, value]) => {
          element.setAttribute(name, value);
        });
        if (content) {
          element.textContent = content;
        }
        return element;
      };

      const add = element => {
        svg.appendChild(element);
        return element;
      };

      const radiusX = value => sx(value) - sx(0);
      const radiusY = value => sy(value) - sy(0);
      const widthPx = value => sx(value) - sx(0);
      const heightPx = value => sy(value) - sy(0);
      const pointList = points =>
        points.map(point => `${sx(point[0])},${sy(point[1])}`).join(" ");

      svg.replaceChildren();

      add(make("title", {}, "Пять слоёв агентной экономики"));
      add(make("desc", {},
        "Стек читается снизу вверх: инфраструктура, идентичность, мышление, платежи и правила."
      ));

      add(make("rect", {
        x: sx(config.canvas.x),
        y: sy(config.canvas.y),
        width: widthPx(config.canvas.width),
        height: heightPx(config.canvas.height),
        fill: "var(--page)"
      }));

      add(make("rect", {
        x: sx(config.frame.x),
        y: sy(config.frame.y),
        width: widthPx(config.frame.width),
        height: heightPx(config.frame.height),
        rx: radiusX(config.frame.radius),
        ry: radiusY(config.frame.radius),
        fill: "var(--page)",
        stroke: "var(--border)",
        "stroke-width": "2"
      }));

      add(make("line", {
        x1: sx(config.arrow.x),
        y1: sy(config.arrow.shaftBottom),
        x2: sx(config.arrow.x),
        y2: sy(config.arrow.shaftTop),
        class: "guide"
      }));

      add(make("polygon", {
        points: pointList(config.arrow.head),
        fill: "var(--guide)"
      }));

      add(make("text", {
        x: sx(config.arrow.labelX),
        y: sy(config.arrow.labelY),
        class: "direction",
        "text-anchor": "end",
        "dominant-baseline": "middle"
      }, "читать снизу вверх"));

      config.layers.forEach(layer => {
        add(make("line", {
          x1: sx(config.arrow.x),
          y1: sy(layer.centerY),
          x2: sx(config.arrow.connectorEndX),
          y2: sy(layer.centerY),
          class: "connector"
        }));

        add(make("rect", {
          x: sx(config.card.x),
          y: sy(layer.y),
          width: widthPx(config.card.width),
          height: heightPx(config.card.height),
          rx: radiusX(config.card.radius),
          ry: radiusY(config.card.radius),
          class: "card"
        }));

        add(make("path", {
          d: [
            `M ${sx(config.card.x + config.card.radius)} ${sy(layer.y)}`,
            `L ${sx(config.card.x + config.card.accentWidth)} ${sy(layer.y)}`,
            `Q ${sx(config.card.x)} ${sy(layer.y)}`,
            `${sx(config.card.x)} ${sy(layer.y + config.card.radius)}`,
            `L ${sx(config.card.x)} ${sy(layer.y + config.card.height - config.card.radius)}`,
            `Q ${sx(config.card.x)} ${sy(layer.y + config.card.height)}`,
            `${sx(config.card.x + config.card.accentWidth)} ${sy(layer.y + config.card.height)}`,
            `L ${sx(config.card.x + config.card.accentWidth)} ${sy(layer.y)}`,
            "Z"
          ].join(" "),
          fill: layer.color,
          class: "accent"
        }));

        add(make("circle", {
          cx: sx(config.card.iconX),
          cy: sy(layer.centerY),
          r: radiusX(config.card.iconRadius),
          fill: layer.soft,
          stroke: layer.color,
          "stroke-width": "2"
        }));

        add(make("text", {
          x: sx(config.card.iconX),
          y: sy(layer.centerY),
          class: "symbol",
          fill: layer.color,
          "text-anchor": "middle",
          "dominant-baseline": "middle"
        }, layer.symbol));

        add(make("text", {
          x: sx(config.card.nameX),
          y: sy(layer.centerY),
          class: "layer-name",
          "text-anchor": "start",
          "dominant-baseline": "middle"
        }, layer.name));

        add(make("line", {
          x1: sx(config.card.separatorX),
          y1: sy(layer.y + config.card.radius),
          x2: sx(config.card.separatorX),
          y2: sy(layer.y + config.card.height - config.card.radius),
          class: "separator"
        }));

        add(make("text", {
          x: sx(config.card.textX),
          y: sy(layer.y + config.card.questionOffset),
          class: "question",
          "text-anchor": "start",
          "dominant-baseline": "middle"
        }, layer.question));

        add(make("text", {
          x: sx(config.card.textX),
          y: sy(layer.y + config.card.answerOffset),
          class: "answer",
          "text-anchor": "start",
          "dominant-baseline": "middle"
        }, layer.answer));
      });

      add(make("line", {
        x1: sx(config.footer.leftStart),
        y1: sy(config.footer.y),
        x2: sx(config.footer.leftEnd),
        y2: sy(config.footer.y),
        class: "separator"
      }));

      add(make("text", {
        x: sx(config.footer.textX),
        y: sy(config.footer.y),
        class: "footer-label",
        "text-anchor": "middle",
        "dominant-baseline": "middle"
      }, "одна работа агента — пять разных функций"));

      add(make("line", {
        x1: sx(config.footer.rightStart),
        y1: sy(config.footer.y),
        x2: sx(config.footer.rightEnd),
        y2: sy(config.footer.y),
        class: "separator"
      }));
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      if (svg) {
        svg.hidden = true;
      }
      if (fallback) {
        fallback.hidden = false;
      }
    }
  </script>
</body>
</html>
