- concept: для чистой оценки V^π(s) отдачи должны быть собраны при одной и той же политике
  question: Часть отдач из состояния s собрана при политике π_A, а часть — после перехода на политику π_B. Как следует интерпретировать среднее всех этих отдач?
  explanation: Ценность V^π(s) определяется не только состоянием, но и дальнейшим поведением политики π. Если отдачи получены при разных политиках, их общее среднее смешивает разные распределения траекторий.
  kind: choice
  options:
    - Как смесь результатов двух политик, которая в общем случае не является чистой оценкой ценности ни одной из них
    - Как оценку V для политики π_B, потому что она использовалась позже
    - Как оценку V для политики π_A, потому что при ней сбор данных начался
    - Как точную ценность состояния, не зависящую от политики
