- concept: оценка непосещённого состояния отражает инициализацию, а не отсутствие награды
  question: Метод Монте-Карло ни разу не посетил некоторое состояние, и его табличная оценка осталась равной начальному значению. Как следует интерпретировать эту оценку?
  explanation: Monte Carlo обновляет оценку только после фактического посещения. Если состояние не встречалось в эпизодах, сохранённое значение осталось результатом инициализации и ничего не говорит о его истинной ценности.
  kind: choice
  options:
    - Как доказательство того, что состояние недостижимо
    - Как точную оценку ожидаемой отдачи
    - Как отсутствие данных об отдаче из этого состояния
  correct: 2
  id: 030-net-pokrytiya-1
  fingerprint: ecb43175
- concept: опыт с выбранным действием не определяет ценности остальных действий в том же состоянии
  question: Почему многократное посещение состояния под детерминированной политикой может быть недостаточным для оценки всех Q(s, a) в этом состоянии?
  explanation: Для оценки Q(s, a) нужен опыт выполнения именно действия a в состоянии s. Само посещение состояния не даёт информации о действиях, которые политика там никогда не выбирает.
  kind: open
  reference: Детерминированная политика каждый раз выбирает одно и то же действие. Наблюдаемые отдачи позволяют обновлять Q только для выбранной пары «состояние — действие», а оценки альтернативных действий остаются неизвестными без их исследования.
  id: 030-net-pokrytiya-2
  fingerprint: 1306be25
