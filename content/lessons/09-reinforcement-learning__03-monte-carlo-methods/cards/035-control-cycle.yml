- concept: для управления нужна ценность пар «состояние — действие», позволяющая сравнивать доступные действия
  question: Почему для улучшения политики используют Q(s, a), а одной функции V(s) недостаточно?
  explanation: V(s) характеризует состояние при заданной политике, но не разделяет последствия разных действий. Q(s, a) оценивает ожидаемую отдачу после выбора конкретного a, поэтому позволяет выбрать действие с наибольшей оценкой.
  kind: choice
  options:
    - Q(s, a) оценивает отдачу при выборе конкретного действия, поэтому по ней можно сравнить действия в одном состоянии
    - Q(s, a) гарантирует исследование всех действий без случайного выбора
    - V(s) применима только к терминальным состояниям, а Q(s, a) — ко всем остальным
  correct: 0
  id: 035-control-cycle-1
  fingerprint: 11c89813
- concept: MC control чередует семплированную оценку Q и ε-жадное улучшение политики
  question: Расположите операции одной итерации on-policy Monte Carlo control в правильном порядке.
  explanation: Сначала текущая политика создаёт опыт, затем наблюдённые отдачи уточняют Q, после чего обновлённая Q используется для ε-жадного улучшения политики. Полная сходимость оценки прежней политики перед улучшением не требуется.
  kind: order
  items:
    - Собрать эпизод, действуя согласно текущей политике
    - По отдачам эпизода обновить оценки Q(s, a)
    - Сделать политику ε-жадной относительно обновлённой Q
  id: 035-control-cycle-2
  fingerprint: 616be1c1
