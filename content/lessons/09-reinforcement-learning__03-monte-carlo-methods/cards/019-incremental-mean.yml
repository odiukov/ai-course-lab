- concept: параметр n включает добавляемое наблюдение, поэтому счётчик увеличивают до вызова incremental_mean
  question: Счётчик visits[s] хранит количество отдач, уже учтённых в value[s]. Как правильно добавить новую отдачу G, если incremental_mean(value, G, n) ожидает общее количество наблюдений с учётом нового?
  explanation: Вес новой отдачи равен обратной величине общего числа наблюдений после её добавления. Если передать старый счётчик, новая отдача получит завышенный вес.
  kind: choice
  options:
    - Сначала увеличить visits[s], затем передать обновлённый visits[s] в incremental_mean
    - Сначала вызвать incremental_mean с текущим visits[s], затем увеличить счётчик
    - Передать в incremental_mean номер текущего эпизода, не изменяя visits[s]
  correct: 0
  id: 019-incremental-mean-1
  fingerprint: 56add344
- concept: инкрементальное среднее требует вещественного деления
  question: В псевдокоде языка, где деление целых чисел отбрасывает дробную часть, заполните пропуск так, чтобы поправка не обнулялась преждевременно.
  explanation: Поправка обычно является дробной частью разницы между новой отдачей и текущей оценкой. Преобразование знаменателя в вещественный тип сохраняет эту дробную часть.
  kind: cloze
