- concept: статистическая ошибка MC-оценки убывает обратно пропорционально квадратному корню из числа эпизодов
  question: Объясните, во сколько раз нужно увеличить число независимых эпизодов, чтобы типичную ошибку MC-оценки уменьшить втрое, и почему.
  explanation: 'MC использует выборочное среднее отдач, поэтому увеличение объёма выборки даёт убывающую отдачу: трёхкратное повышение точности требует девятикратного числа эпизодов.'
  kind: open
  reference: Число эпизодов нужно увеличить в девять раз. Ошибка выборочного среднего убывает обратно пропорционально квадратному корню из числа эпизодов, поэтому трёхкратное уменьшение ошибки требует возвести этот множитель в квадрат.
  id: 024-dp-etalon-2
  fingerprint: e4d4aaec
