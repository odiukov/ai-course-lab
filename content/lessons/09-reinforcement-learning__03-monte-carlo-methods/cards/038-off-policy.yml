- concept: importance-вес траектории равен произведению отношений вероятностей наблюдённых действий
  question: Для наблюдённого хвоста траектории вероятности выбранных действий при целевой и поведенческой политиках составляют соответственно 0.6 и 0.3, затем 0.45 и 0.15. Чему равен importance-вес этого хвоста?
  explanation: 'Для каждого действия вычисляется отношение π(a|s)/μ(a|s), после чего отношения перемножаются: (0.6/0.3) · (0.45/0.15) = 6.'
  kind: numeric
  answer: 6
  tolerance: 0.0007
  id: 038-off-policy-1
  fingerprint: e2217636
- concept: поведенческая политика должна покрывать все действия, возможные при целевой политике
  question: Целевая политика иногда выбирает действие a в состоянии s, но поведенческая политика назначает этому действию нулевую вероятность. Что это означает для off-policy оценки методом importance sampling?
  explanation: Importance sampling перевзвешивает только наблюдавшийся опыт. Если μ(a|s) равна нулю при положительной π(a|s), в данных не появятся необходимые траектории и отношение вероятностей определить нельзя.
  kind: choice
  options:
    - Нужно назначить таким траекториям бесконечный вес
    - 'Оценка по имеющимся данным невозможна: требуется поведенческая политика с ненулевой вероятностью этого действия'
    - Достаточно усреднить отдачи всех траекторий, не содержащих действие a
  correct: 1
  id: 038-off-policy-2
  fingerprint: a0288e48
- concept: вероятности переходов среды сокращаются в отношении вероятностей траекторий
  question: Почему importance-вес для оценки одной политики по данным другой обычно содержит отношения вероятностей действий, но не вероятностей переходов среды?
  explanation: Отношение правдоподобий сравнивает одну и ту же наблюдённую траекторию при π и μ. При неизменной динамике среды её переходные множители одинаковы и сокращаются, оставляя произведение π(A|S)/μ(A|S).
  kind: open
  reference: Обе политики действуют в одной и той же среде, поэтому множители вероятностей переходов совпадают в вероятностях траектории при π и μ и сокращаются. Различаются только распределения действий, заданные политиками.
  id: 038-off-policy-3
  fingerprint: 16d1a947
