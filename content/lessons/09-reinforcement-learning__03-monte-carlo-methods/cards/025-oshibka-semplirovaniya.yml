- concept: сходимость выборочного среднего Monte Carlo не обязана быть монотонной
  question: Объясните своими словами, почему корректная Monte Carlo-оценка после добавления нового эпизода может временно удалиться от точного значения.
  explanation: Сходимость MC проявляется как постепенное сужение случайных колебаний вокруг истинной ценности. Она не означает, что каждое следующее наблюдение обязательно уменьшает текущую ошибку.
  kind: open
  reference: Новый эпизод приносит случайную отдачу и сдвигает выборочное среднее. Поэтому отдельные обновления не обязаны приближать оценку к точному значению; при накоплении данных уменьшается типичный размах случайных отклонений, а не обеспечивается монотонное движение.
  id: 025-oshibka-semplirovaniya-2
