- concept: надёжный MC-отчёт должен одновременно описывать метод, объём данных, исследование, эталон и завершение траекторий
  question: Какой отчёт содержит достаточный контракт для принятия результата Monte Carlo-оценивания политики?
  explanation: Точечная оценка сама по себе не показывает, заслуживает ли она доверия. Контракт должен раскрывать способ отбора отдач, достаточность и неопределённость данных, исследование, корректный ориентир и причины остановки траекторий.
  kind: choice
  options:
    - Отчёт приводит только среднюю отдачу и название среды.
    - Отчёт указывает большой бюджет эпизодов и сравнивает результат с оценкой другой политики.
    - Отчёт обосновывает выбор first-visit или every-visit, задаёт бюджет и диагностику ошибки, описывает исследование, подходящий эталон и обработку завершений и тайм-аутов.
    - Отчёт указывает метод и предел длины эпизода, но не сообщает разброс и охват состояний.
  correct: 2
  id: 041-kontrakt-ocenki-1
  fingerprint: b4127fcc
- concept: при недоступности точного DP-эталона MC-оценку сравнивают с явно обозначенным ориентиром от сильного обученного агента
  question: Как организовать проверку MC-оценщика в большой или непрерывной среде, где точное табличное динамическое программирование неприменимо?
  explanation: Отсутствие точного DP-решения не отменяет внешнюю проверку. Сильный baseline помогает обнаружить явно неверные оценки, но его собственная погрешность не позволяет считать совпадение доказательством точности.
  kind: open
  reference: 'Нужно явно выбрать приблизительный ориентир или границу, например результат сильного агента на основе Q-learning либо PPO, и сравнивать оценки в одинаковой постановке: с теми же наградами, дисконтированием и горизонтом. Такой ориентир следует обозначить как приближённый, а не выдавать за точное значение.'
  id: 041-kontrakt-ocenki-2
  fingerprint: 73641eab
- concept: допуск к публикации табличной MC-оценки проверяется отдельно по числу эпизодов для каждого состояния
  question: Общий бюджет rollout исчерпан, но для редкого состояния собрано меньше эпизодов, чем требует минимальный порог контракта. Как должен поступить табличный MC-оценщик?
  explanation: Большое общее число эпизодов не гарантирует достаточной выборки для каждого состояния. Контракт требует применять порог покрытия по состояниям и честно скрывать или помечать оценки, для которых данных недостаточно.
  kind: choice
  options:
    - Опубликовать оценку состояния, поскольку общий бюджет уже исчерпан.
    - Не публиковать оценку этого состояния и отметить недостаточное покрытие.
    - Заменить оценку редкого состояния средним по всем остальным состояниям.
    - Считать отсутствие данных свидетельством нулевой ценности состояния.
  correct: 1
  id: 041-kontrakt-ocenki-3
  fingerprint: a0a87b78
