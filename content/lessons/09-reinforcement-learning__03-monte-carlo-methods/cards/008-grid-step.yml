- concept: флаг завершения перехода определяется по состоянию после выполнения действия
  question: Агент делает допустимый ход из нетерминальной клетки в терминальную. Какой флаг done должен вернуть этот же вызов grid_step?
  explanation: Терминальность проверяют после определения следующего состояния. Поэтому переход в цель немедленно возвращает done = True.
  kind: choice
  options:
