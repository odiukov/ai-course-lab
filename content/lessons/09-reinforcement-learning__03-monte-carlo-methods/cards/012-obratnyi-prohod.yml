- concept: отдача перехода включает текущую и дисконтированные будущие награды
  question: Награды траектории равны [7, 11, 13], а коэффициент дисконтирования γ = 0.5. Чему равна отдача для первого перехода?
  explanation: 'Считаем справа налево: последняя отдача равна 13, предыдущая — 11 + 0.5 × 13 = 17.5, а первая — 7 + 0.5 × 17.5 = 15.75.'
  kind: numeric
  answer: 15.75
  tolerance: 0.001
  id: 012-obratnyi-prohod-1
  fingerprint: f076e645
- concept: обратный проход вычисляет все отдачи за линейное время
  question: Расположите действия алгоритма вычисления отдач обратным проходом в правильном порядке.
  explanation: Каждая награда обрабатывается единственный раз. Обратная рекуррента использует уже вычисленную отдачу следующего перехода, поэтому весь список строится за O(T), без повторного суммирования хвостов траектории.
  kind: order
  items:
    - Инициализировать накопленную отдачу нулём
    - Просматривать награды траектории от последней к первой
    - Обновлять накопленную отдачу как текущую награду плюс γ, умноженное на прежнюю накопленную отдачу
    - После каждого обновления добавлять полученную отдачу во временный список
    - Развернуть временный список, чтобы восстановить прямой порядок переходов
  id: 012-obratnyi-prohod-2
  fingerprint: e5c79a9c
