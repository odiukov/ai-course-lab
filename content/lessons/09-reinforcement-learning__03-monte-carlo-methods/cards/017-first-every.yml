- concept: first-visit одинаково взвешивает эпизоды с посещением состояния, а every-visit сильнее взвешивает эпизоды с частыми возвратами
  question: В одном эпизоде состояние s посетили один раз, а в другом — несколько раз. Как эти эпизоды повлияют на оценку V(s)?
  explanation: First-visit использует только отдачу после первого посещения s в каждом эпизоде. Every-visit использует отдачи после всех посещений, поэтому эпизод с частыми возвратами в s сильнее влияет на среднее.
  kind: choice
  options:
    - First-visit возьмёт по одной отдаче из каждого эпизода, а every-visit даст больший вес эпизоду с повторными посещениями
    - Every-visit возьмёт по одной отдаче из каждого эпизода, а first-visit использует все посещения
    - Оба метода обязательно придадут эпизодам одинаковый вес
    - Оба метода отбросят эпизод с повторными посещениями
  correct: 0
  id: 017-first-every-1
  fingerprint: b9954b65
- concept: зависимость отдач повторных визитов создаёт конечное смещение every-visit, но не мешает его асимптотической сходимости
  question: Почему оценка every-visit MC может быть смещённой на конечной выборке, но всё же сходится к V^π(s) при накоплении эпизодов?
  explanation: 'Повторные отдачи из одной траектории нельзя считать независимыми наблюдениями: они частично разделяют общий хвост наград. Это создаёт конечное смещение every-visit, однако оно стремится к нулю по мере накопления эпизодов.'
  kind: open
  reference: Отдачи после повторных посещений состояния внутри одного эпизода скоррелированы, поскольку используют общие последующие награды; кроме того, эпизоды с большим числом посещений получают больший вес. Поэтому конечное среднее может быть смещено. При росте числа эпизодов влияние этой зависимости на оценку исчезает, и every-visit MC сходится к той же V^π(s), что и first-visit MC.
  id: 017-first-every-2
  fingerprint: c5b229e6
