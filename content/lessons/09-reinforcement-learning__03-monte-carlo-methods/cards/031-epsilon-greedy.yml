- concept: исследовательская ветка ε-жадной политики может выбрать текущее лучшее действие
  question: В состоянии доступны четыре действия, одно из которых имеет уникально максимальную оценку Q. Политика использует ε = 0.24, а в исследовательской ветке выбирает действие равномерно. Какова вероятность выбрать текущее лучшее действие?
  explanation: Лидер выбирается в жадной ветке с вероятностью 0.76 и в исследовательской ветке с вероятностью 0.24 / 4 = 0.06. Итого 0.76 + 0.06 = 0.82. Поэтому ε обозначает вероятность случайного выбора, а не вероятность отказаться от лидера.
  kind: numeric
  answer: 0.82
  tolerance: 0.001
  id: 031-epsilon-greedy-1
  fingerprint: 692cce95
- concept: ε-жадная политика сочетает использование текущего лидера с ненулевой вероятностью проверки каждого действия
  question: Как ε-жадная политика поддерживает баланс между использованием накопленных оценок Q и исследованием?
  explanation: Жадная ветка использует лучшее действие по текущим оценкам, а случайная ветка продолжает собирать данные обо всех доступных действиях. Новые отдачи могут изменить оценки Q и заменить прежнего лидера.
  kind: choice
  options:
    - После обнаружения лидера навсегда исключает остальные действия
    - В исследовательской ветке обязательно выбирает действие, отличное от текущего лидера
    - Обычно выбирает действие с максимальной Q, но сохраняет для каждого доступного действия ненулевой шанс быть выбранным
  correct: 2
  id: 031-epsilon-greedy-2
  fingerprint: 754eecf5
