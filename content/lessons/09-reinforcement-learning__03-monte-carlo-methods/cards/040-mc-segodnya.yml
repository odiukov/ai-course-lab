- concept: частичная MC-цель объединяет наблюдённую награду с дисконтированной оценкой ненаблюдаемого хвоста
  question: Прогон остановился в нетерминальном состоянии после награды 7. Коэффициент дисконтирования равен 0.6, а оценка ценности следующего состояния равна 8. Чему равна цель с бутстрэппингом?
  explanation: Цель равна 7 + 0.6 × 8 = 11.8. Награда наблюдалась, но дальнейшее будущее заменено оценкой ценности, поэтому это частичная MC-оценка.
  kind: numeric
  answer: 11.8
  tolerance: 0.01
  id: 040-mc-segodnya-2
  fingerprint: de407ce6
- concept: вычитание бейзлайна из полной эмпирической отдачи не превращает её в частичную MC-оценку
  question: В PPO отдача G вычислена по полному завершённому эпизоду, а преимущество задано как A = G − V(s). Объясни, почему вычитание бейзлайна не делает исходную отдачу частичной.
  explanation: Полнота MC определяется источником будущих наград, а не наличием бейзлайна. Частичной оценка становится при обрыве наблюдаемой траектории и бутстрэппинге из функции ценности.
  kind: open
  reference: Бейзлайн изменяет центрирование оценки преимущества, но не заменяет ненаблюдаемый хвост траектории прогнозом. Поскольку G по-прежнему включает все фактические награды до терминального состояния, она остаётся полной MC-отдачей.
  id: 040-mc-segodnya-3
  fingerprint: c6f3097c
