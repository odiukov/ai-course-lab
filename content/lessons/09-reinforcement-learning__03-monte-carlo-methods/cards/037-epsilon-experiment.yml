- concept: компромисс между недоисследованием при малом ε и ценой случайных действий при большом ε
  question: Объясните своими словами, почему как слишком малое, так и слишком большое значение ε может ухудшить результат ε-жадного Monte Carlo control.
  explanation: Малое ε усиливает риск систематической ошибки из-за недостаточного исследования. Большое ε уменьшает этот риск, но сохраняет высокую цену исследования даже после того, как хорошие действия уже найдены.
  kind: open
  reference: При слишком малом ε агент редко проверяет альтернативы и может закрепить случайно найденный, но неоптимальный маршрут. При слишком большом ε он собирает разнообразный опыт, однако продолжает часто выбирать случайные действия, что повышает шум отдач и ухудшает результат самой ε-жадной политики.
