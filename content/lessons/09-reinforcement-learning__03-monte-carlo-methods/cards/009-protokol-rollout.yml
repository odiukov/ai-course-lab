- concept: переход записывается с состоянием до выполнения действия
  question: Среда вернула следующее состояние и награду. Какую тройку нужно добавить в траекторию перед обновлением текущего состояния?
  explanation: 'Запись описывает совершённый ход: состояние до действия, выбранное действие и полученную за него награду. Следующее состояние станет исходным состоянием следующего хода.'
  kind: cloze
  template: |-
    s_next, r, done = env.step(s, a)
    trajectory.append(___)
    s = s_next
  answer: (s, a, r)
  accept:
    - (s,a,r)
  id: 009-protokol-rollout-1
  fingerprint: 1096c755
- concept: завершающий переход сохраняется в траектории до остановки rollout
  question: Среда вернула done=True. Почему rollout должен сначала сохранить совершённый переход и только затем завершить цикл?
  explanation: Признак завершения относится к результату уже выполненного действия. Поэтому последняя тройка сохраняется, а после неё новые действия больше не выбираются.
  kind: open
  reference: Потому что завершающее действие и полученная за него награда являются частью траектории и нужны для вычисления наблюдённой отдачи. done запрещает выбирать следующее действие, но не отменяет уже произошедший переход.
  id: 009-protokol-rollout-2
  fingerprint: 7a6af469
