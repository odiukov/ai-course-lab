- concept: ограничение горизонта меняет оцениваемую величину на отдачу в пределах конечного числа шагов
  question: Объясни своими словами, как явное ограничение длины эпизода меняет смысл MC-оценки политики.
  explanation: 'Лимит гарантирует конечный сэмпл, но одновременно задаёт конечногоризонтную задачу: учитывается только то, что произошло до остановки. Поэтому усечение по max_steps нельзя выдавать за естественный успех.'
  kind: open
  reference: Оценка начинает описывать отдачу, получаемую до завершения или до достижения заданного горизонта, а не результат при потенциально неограниченном ожидании. Усечённые по лимиту эпизоды нужно отличать от естественно завершившихся.
