- concept: first-visit и every-visit MC различаются отбором готовых пар «посещение — отдача»
  question: Эпизод уже сгенерирован, и отдача вычислена для каждого перехода. Что изменится, если заменить first-visit MC на every-visit MC?
  explanation: 'Обе версии могут работать с одной и той же траекторией и одинаково вычисленными отдачами. Они различаются только фильтром наблюдений: first-visit оставляет самое раннее посещение состояния в эпизоде, а every-visit использует также повторные.'
  kind: choice
  options:
    - В среднее начнут поступать отдачи от всех посещений состояния, включая повторные
    - Для повторных посещений будут заново сгенерированы награды
    - Изменится траектория эпизода и выбранные политикой действия
  correct: 0
