- concept: дисперсия обычного importance sampling быстро растёт с горизонтом из-за произведения случайных отношений вероятностей
  question: Почему обычный trajectory-wise importance sampling часто становится неустойчивым на длинных эпизодах?
  explanation: 'Каждое новое отношение вероятностей входит в произведение. Поэтому с ростом горизонта распределение весов может становиться крайне неравномерным: редкий эпизод с огромным весом начинает определять оценку, вызывая взрыв дисперсии.'
  kind: choice
  options:
    - Дисконтирование делает все поздние награды одинаковыми
    - Произведение отношений вероятностей может принимать экстремальные значения и давать редким траекториям непропорционально большой вклад
    - Целевая и поведенческая политики неизбежно становятся одинаковыми
    - Удлинение эпизода уменьшает число возможных траекторий
  correct: 1
  id: 039-vesa-is-1
  fingerprint: ea46de9b
- concept: weighted importance sampling нормирует взвешенную сумму отдач суммой importance-весов
  question: Заполни знаменатель оценки weighted importance sampling.
  explanation: В weighted IS большой вес увеличивает не только числитель, но и знаменатель. Это обычно снижает дисперсию по сравнению с делением на число эпизодов, хотя на конечной выборке нормированная оценка может быть смещена.
  kind: cloze
  template: \hat V_W(s)=\frac{\sum_i \rho_i G_i}{___}
  answer: \sum_i \rho_i
  accept:
    - ∑ᵢ ρᵢ
    - sum_i rho_i
    - сумма весов
  id: 039-vesa-is-2
  fingerprint: dd6322e0
- concept: per-decision importance sampling корректирует каждую награду только отношениями вероятностей действий, предшествовавших её получению
  question: Объясни, почему в per-decision importance sampling отношение вероятностей позднего действия не должно изменять вклад награды, полученной раньше.
  explanation: Trajectory-wise IS присваивает всей отдаче вес полной траектории, из-за чего редкое позднее действие может раздуть даже раннюю награду. Per-decision IS использует для каждой награды только соответствующий префикс весов и устраняет этот источник шума.
  kind: open
  reference: Позднее действие не могло повлиять на уже полученную награду. Поэтому её вклад нужно умножать только на произведение отношений вероятностей до момента получения этой награды. Исключение будущих множителей снижает лишнюю дисперсию.
  id: 039-vesa-is-3
  fingerprint: c27517f6
