- concept: эпизод — это полная траектория взаимодействия от начального состояния до завершения
  question: Что в обучении с подкреплением называется эпизодом?
  explanation: Эпизод охватывает весь прогон от начальной ситуации до терминального состояния. Отдельный переход является лишь одной частью эпизода.
  kind: choice
  options:
    - Распределение вероятностей всех возможных следующих состояний
    - Правило, по которому агент выбирает действия
    - Один переход между соседними состояниями
    - Законченная последовательность состояний, действий и наград до терминального состояния
  correct: 3
  id: 003-dp-vs-mc-1
  fingerprint: 2447da33
- concept: траектория Монте-Карло получается последовательным семплированием реального взаимодействия со средой
  question: Расположи этапы получения эпизода методом Монте-Карло в правильном порядке.
  explanation: Монте-Карло не перечисляет возможные продолжения с помощью модели. Агент действует, получает фактический ответ среды и сохраняет переходы, пока эпизод не завершится.
  kind: order
  items:
    - Агент выбирает действие согласно политике
    - Агент выполняет выбранное действие в среде
    - Среда возвращает награду и следующее состояние
    - Переход добавляется в запись траектории
    - При терминальном состоянии запись эпизода завершается, иначе взаимодействие продолжается
  id: 003-dp-vs-mc-2
  fingerprint: eaf3b61e
