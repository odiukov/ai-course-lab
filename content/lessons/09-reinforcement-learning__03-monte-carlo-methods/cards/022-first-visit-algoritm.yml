- concept: множество посещённых состояний сбрасывается после каждого эпизода, а оценки и счётчики сохраняются между эпизодами
  question: Как правильно организовать время жизни структур данных в first-visit MC evaluation?
  explanation: seen подавляет повторные посещения только внутри текущего эпизода, поэтому на границе эпизодов его очищают. V и counts накапливают оценку по всем эпизодам и должны сохраняться.
  kind: choice
  options:
    - Создавать seen, V и counts заново перед обработкой каждого перехода
    - Создавать seen заново для каждого эпизода, а V и counts хранить на протяжении всей оценки
    - Создать seen, V и counts один раз и никогда не сбрасывать
    - Сбрасывать V и counts после каждого эпизода, а seen сохранять
  correct: 1
  id: 022-first-visit-algoritm-1
  fingerprint: d6581da4
- concept: направление обхода траектории определяет, какое посещение повторяющегося состояния будет принято
  question: Почему обход траектории с множеством seen должен идти в хронологическом порядке для реализации first-visit MC?
  explanation: 'Само множество seen лишь оставляет одно посещение состояния. Какое именно посещение останется, задаёт порядок обхода: прямой обход выбирает первое, обратный — последнее.'
  kind: open
  reference: При хронологическом обходе первым принимается самое раннее посещение состояния в эпизоде, а последующие пропускаются. При обратном обходе тот же механизм примет самое позднее посещение, поэтому получится уже не first-visit оценка.
  id: 022-first-visit-algoritm-2
  fingerprint: 3ee9a8db
