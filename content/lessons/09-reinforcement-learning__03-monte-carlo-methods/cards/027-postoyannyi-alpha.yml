- concept: при постоянном шаге оценка сдвигается на долю α ошибки между новой отдачей и текущей оценкой
  question: Для состояния текущая оценка V(s) = 24. Наблюдена новая отдача G = 12, постоянный шаг α = 0.25. Какой станет V(s) после обновления?
  explanation: Поправка равна 0.25 · (12 − 24) = −3, поэтому новая оценка равна 24 − 3 = 21.
  kind: numeric
  answer: 21
  tolerance: 0.001
  id: 027-postoyannyi-alpha-1
  fingerprint: 0be9f906
- concept: постоянный шаг экспоненциально ослабляет влияние старых отдач
  question: Почему оценка с постоянным шагом способна отслеживать ценность состояния после изменения политики?
  explanation: При последовательных обновлениях влияние прежних наблюдений уменьшается в постоянной пропорции. Поэтому свежие данные сильнее отражаются на оценке, чем далёкая история.
  kind: choice
  options:
    - Влияние старых отдач постепенно ослабевает, а каждая свежая отдача сохраняет заметный вес
    - Все когда-либо полученные отдачи навсегда имеют одинаковый вес
    - После изменения политики оценка автоматически вычисляется без новых эпизодов
    - Каждая новая отдача полностью заменяет текущую оценку
