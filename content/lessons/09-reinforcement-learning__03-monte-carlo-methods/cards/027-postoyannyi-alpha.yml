- concept: без новых посещений состояния постоянный шаг не может отслеживать изменение его ценности
  question: Политика изменилась, но состояние s больше не посещается. Объясни, почему оценка V(s) не сможет подстроиться под новую политику даже при постоянном шаге.
  explanation: Постоянный шаг определяет размер поправки, но не создаёт данные. Для отслеживания изменений состояние должно продолжать посещаться.
  kind: open
  reference: Обновление оценки происходит только после получения новой отдачи из состояния s. Если политика больше не приводит агента в s, новых наблюдений нет, поэтому V(s) остаётся прежней независимо от выбранного шага.
