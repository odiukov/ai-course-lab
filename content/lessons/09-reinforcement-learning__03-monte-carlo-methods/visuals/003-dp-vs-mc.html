<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>От модели переходов к полным эпизодам</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: whitesmoke;
      --panel: white;
      --ink: midnightblue;
      --muted: slategray;
      --line: lightslategray;
      --soft: lavender;
      --accent: royalblue;
      --result: seagreen;
      --a: steelblue;
      --b: darkorange;
      --c: mediumseagreen;
      --d: mediumpurple;
    }

    body {
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      background: var(--panel);
    }

    h1 {
      font-size: 22px;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--panel);
      font-family: inherit;
    }

    .panel-title {
      fill: var(--ink);
      font-size: 20px;
      font-weight: bold;
    }

    .subtitle {
      fill: var(--muted);
      font-size: 14px;
    }

    .label {
      fill: var(--ink);
      font-size: 15px;
    }

    .small {
      fill: var(--muted);
      font-size: 13px;
    }

    .value {
      fill: var(--ink);
      font-size: 17px;
      font-weight: bold;
    }

    .footer {
      fill: var(--muted);
      font-size: 14px;
      font-weight: bold;
    }

    .divider,
    .model-line,
    .sample-line,
    .aggregate-line {
      fill: none;
      vector-effect: non-scaling-stroke;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .divider {
      stroke: var(--line);
    }

    .model-line {
      stroke: var(--accent);
    }

    .sample-line {
      stroke: var(--line);
    }

    .aggregate-line {
      stroke: var(--result);
    }

    .node {
      fill: var(--panel);
      stroke: var(--accent);
      vector-effect: non-scaling-stroke;
    }

    .chance {
      fill: var(--soft);
      stroke: var(--accent);
      vector-effect: non-scaling-stroke;
    }

    .backup {
      fill: var(--soft);
      stroke: var(--accent);
      vector-effect: non-scaling-stroke;
    }

    .return-box {
      fill: var(--panel);
      stroke: var(--line);
      vector-effect: non-scaling-stroke;
    }

    .mean-box {
      fill: var(--panel);
      stroke: var(--result);
      vector-effect: non-scaling-stroke;
    }

    .traj-a { stroke: var(--a); }
    .traj-b { stroke: var(--b); }
    .traj-c { stroke: var(--c); }
    .traj-d { stroke: var(--d); }

    .arrow-model { fill: var(--accent); }
    .arrow-sample { fill: var(--line); }
    .arrow-mean { fill: var(--result); }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: black;
        --panel: #111827;
        --ink: aliceblue;
        --muted: lightsteelblue;
        --line: slategray;
        --soft: #263451;
        --accent: deepskyblue;
        --result: springgreen;
        --a: deepskyblue;
        --b: gold;
        --c: springgreen;
        --d: violet;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>От модели переходов к полным эпизодам</h1>
    <svg id="diagram"
         viewBox="0 0 1000 410"
         width="1000"
         height="410"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-label="Слева динамическое программирование усредняет все возможные переходы модели, справа Монте-Карло усредняет отдачи завершённых эпизодов: 22, 25, 19 и 30, получая 24."></svg>
  </main>

  <script>
    const data = [{
      origin: { x: 0, y: 0 },
      scale: { x: 1, y: 1 },
      zero: 0,
      line: { normal: 2, strong: 3, fine: 1, dash: "6 6" },
      arrow: { length: 11, wing: 6 },
      radius: { node: 21, outcome: 18, corner: 12 },
      divider: { x: 500, top: 14, bottom: 397 },
      headings: {
        left: { x: 250, y: 25, text: "DP: ожидаемый бэкап" },
        leftSub: { x: 250, y: 51, text: "известная модель переходов" },
        right: { x: 750, y: 25, text: "MC: полные эпизоды" },
        rightSub: { x: 750, y: 51, text: "наблюдённые прогоны среды" }
      },
      dp: {
        note: [
          { x: 305, y: 81, text: "модель перечисляет все возможные s′" },
          { x: 305, y: 101, text: "и взвешивает их по P(s′ | s,a)" }
        ],
        state: { x: 72, y: 181, r: 21, text: "s" },
        action: { x: 160, y: 181, w: 58, h: 42, text: "a" },
        chance: {
          points: [
            { x: 264, y: 151 },
            { x: 294, y: 181 },
            { x: 264, y: 211 },
            { x: 234, y: 181 }
          ],
          text: "P"
        },
        direct: [
          { from: { x: 93, y: 181 }, to: { x: 131, y: 181 } },
          { from: { x: 189, y: 181 }, to: { x: 234, y: 181 } }
        ],
        outcomes: [
          {
            center: { x: 425, y: 132 },
            branch: [
              { x: 294, y: 173 },
              { x: 333, y: 132 },
              { x: 365, y: 132 },
              { x: 407, y: 132 }
            ],
            backup: [
              { x: 425, y: 150 },
              { x: 405, y: 235 },
              { x: 185, y: 255 },
              { x: 185, y: 286 }
            ]
          },
          {
            center: { x: 425, y: 181 },
            branch: [
              { x: 294, y: 181 },
              { x: 335, y: 181 },
              { x: 366, y: 181 },
              { x: 407, y: 181 }
            ],
            backup: [
              { x: 425, y: 199 },
              { x: 413, y: 246 },
              { x: 276, y: 254 },
              { x: 276, y: 286 }
            ]
          },
          {
            center: { x: 425, y: 230 },
            branch: [
              { x: 294, y: 189 },
              { x: 333, y: 230 },
              { x: 365, y: 230 },
              { x: 407, y: 230 }
            ],
            backup: [
              { x: 425, y: 248 },
              { x: 425, y: 268 },
              { x: 386, y: 270 },
              { x: 386, y: 286 }
            ]
          }
        ],
        backupBox: {
          x: 83, y: 286, w: 378, h: 62,
          title: { x: 272, y: 306, text: "Ожидаемый бэкап" },
          formula: { x: 272, y: 330, text: "Σ P(s′ | s,a) · [r + γV(s′)]" }
        },
        footer: { x: 250, y: 383, text: "все переходы модели" }
      },
      mc: {
        start: { x: 526, y: 155, w: 78, h: 52, text: "старт" },
        fork: { x: 604, top: 112, bottom: 250 },
        returnTitle: { x: 881, y: 81, text: "отдачи" },
        rows: [112, 158, 204, 250],
        returns: [22, 25, 19, 30],
        paths: [
          [
            { x: 604, y: 112 },
            { x: 661, y: 112 },
            { x: 675, y: 91 },
            { x: 720, y: 112 },
            { x: 765, y: 134 },
            { x: 786, y: 112 },
            { x: 841, y: 112 }
          ],
          [
            { x: 604, y: 158 },
            { x: 650, y: 158 },
            { x: 674, y: 181 },
            { x: 718, y: 158 },
            { x: 762, y: 136 },
            { x: 790, y: 158 },
            { x: 841, y: 158 }
          ],
          [
            { x: 604, y: 204 },
            { x: 650, y: 204 },
            { x: 676, y: 183 },
            { x: 718, y: 204 },
            { x: 760, y: 225 },
            { x: 792, y: 204 },
            { x: 841, y: 204 }
          ],
          [
            { x: 604, y: 250 },
            { x: 660, y: 250 },
            { x: 681, y: 272 },
            { x: 724, y: 250 },
            { x: 762, y: 229 },
            { x: 790, y: 250 },
            { x: 841, y: 250 }
          ]
        ],
        returnsBox: { x: 841, w: 84, h: 30 },
        bus: { x: 947, top: 112, bottom: 301 },
        mean: {
          x: 810, y: 313, w: 164, h: 46,
          text: { x: 892, y: 336, value: "среднее = 24" }
        },
        footer: { x: 750, y: 383, text: "реально случившиеся эпизоды" },
        pathClasses: ["traj-a", "traj-b", "traj-c", "traj-d"]
      },
      fallback: {
        x: 500,
        y: 205,
        text: "Схема: DP усредняет все переходы модели; MC усредняет отдачи 22, 25, 19 и 30 до 24."
      }
    }];

    const [D] = data;
    const origin = Object.freeze(D.origin);
    const scale = Object.freeze(D.scale);
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const svg = document.getElementById("diagram");
    const ns = "http://www.w3.org/2000/svg";

    function add(tag, attrs, parent = svg) {
      const node = document.createElementNS(ns, tag);
      Object.entries(attrs).forEach(([name, value]) => node.setAttribute(name, value));
      parent.appendChild(node);
      return node;
    }

    function label(point, value, className, anchor = "middle") {
      const node = add("text", {
        x: sx(point.x),
        y: sy(point.y),
        class: className,
        "text-anchor": anchor,
        "dominant-baseline": "middle"
      });
      node.textContent = value;
      return node;
    }

    function line(from, to, className, width, dash) {
      const attrs = {
        x1: sx(from.x),
        y1: sy(from.y),
        x2: sx(to.x),
        y2: sy(to.y),
        class: className,
        "stroke-width": width
      };
      if (dash) attrs["stroke-dasharray"] = dash;
      return add("line", attrs);
    }

    function arrowHead(from, to, className) {
      const dx = to.x - from.x;
      const dy = to.y - from.y;
      const length = Math.hypot(dx, dy);
      const ux = dx / length;
      const uy = dy / length;
      const bx = to.x - ux * D.arrow.length;
      const by = to.y - uy * D.arrow.length;
      const left = {
        x: bx - uy * D.arrow.wing,
        y: by + ux * D.arrow.wing
      };
      const right = {
        x: bx + uy * D.arrow.wing,
        y: by - ux * D.arrow.wing
      };
      add("polygon", {
        points: [
          `${sx(to.x)},${sy(to.y)}`,
          `${sx(left.x)},${sy(left.y)}`,
          `${sx(right.x)},${sy(right.y)}`
        ].join(" "),
        class: className
      });
    }

    function arrow(from, to, lineClass, headClass, width) {
      line(from, to, lineClass, width);
      arrowHead(from, to, headClass);
    }

    function box(item, className) {
      return add("rect", {
        x: sx(item.x),
        y: sy(item.y),
        width: sx(item.x + item.w) - sx(item.x),
        height: sy(item.y + item.h) - sy(item.y),
        rx: sx(item.x + D.radius.corner) - sx(item.x),
        ry: sy(item.y + D.radius.corner) - sy(item.y),
        class: className,
        "stroke-width": D.line.normal
      });
    }

    function circle(item, className) {
      return add("circle", {
        cx: sx(item.x),
        cy: sy(item.y),
        r: sx(item.x + item.r) - sx(item.x),
        class: className,
        "stroke-width": D.line.normal
      });
    }

    function cubic(points, className, width, dash) {
      const [start, first, second, end] = points;
      const attrs = {
        d: [
          `M ${sx(start.x)} ${sy(start.y)}`,
          `C ${sx(first.x)} ${sy(first.y)}`,
          `${sx(second.x)} ${sy(second.y)}`,
          `${sx(end.x)} ${sy(end.y)}`
        ].join(" "),
        class: className,
        "stroke-width": width
      };
      if (dash) attrs["stroke-dasharray"] = dash;
      add("path", attrs);
      return { before: second, end };
    }

    function doubleCubic(points, className, width) {
      const [start, a, b, middle, c, d, end] = points;
      add("path", {
        d: [
          `M ${sx(start.x)} ${sy(start.y)}`,
          `C ${sx(a.x)} ${sy(a.y)}`,
          `${sx(b.x)} ${sy(b.y)}`,
          `${sx(middle.x)} ${sy(middle.y)}`,
          `C ${sx(c.x)} ${sy(c.y)}`,
          `${sx(d.x)} ${sy(d.y)}`,
          `${sx(end.x)} ${sy(end.y)}`
        ].join(" "),
        class: className,
        "stroke-width": width
      });
      return { before: d, end };
    }

    try {
      line(
        { x: D.divider.x, y: D.divider.top },
        { x: D.divider.x, y: D.divider.bottom },
        "divider",
        D.line.fine,
        D.line.dash
      );

      label(D.headings.left, D.headings.left.text, "panel-title");
      label(D.headings.leftSub, D.headings.leftSub.text, "subtitle");
      label(D.headings.right, D.headings.right.text, "panel-title");
      label(D.headings.rightSub, D.headings.rightSub.text, "subtitle");

      D.dp.note.forEach(item => label(item, item.text, "small"));

      circle(D.dp.state, "node");
      label(D.dp.state, D.dp.state.text, "value");

      box({
        x: D.dp.action.x - D.dp.action.w / D.dp.action.w * D.dp.action.w / 2,
        y: D.dp.action.y - D.dp.action.h / D.dp.action.h * D.dp.action.h / 2,
        w: D.dp.action.w,
        h: D.dp.action.h
      }, "node");
      label(D.dp.action, D.dp.action.text, "value");

      add("polygon", {
        points: D.dp.chance.points
          .map(point => `${sx(point.x)},${sy(point.y)}`)
          .join(" "),
        class: "chance",
        "stroke-width": D.line.normal
      });
      label(
        {
          x: D.dp.chance.points[D.dp.chance.points.length - D.dp.chance.points.length].x,
          y: D.dp.chance.text === D.dp.chance.text
            ? D.dp.state.y
            : D.dp.state.y
        },
        D.dp.chance.text,
        "value"
      );

      D.dp.direct.forEach(item => {
        arrow(item.from, item.to, "model-line", "arrow-model", D.line.strong);
      });

      D.dp.outcomes.forEach(item => {
        const branch = cubic(
          item.branch,
          "model-line",
          D.line.normal,
          D.line.dash
        );
        arrowHead(branch.before, branch.end, "arrow-model");

        circle(
          {
            x: item.center.x,
            y: item.center.y,
            r: D.radius.outcome
          },
          "node"
        );
        label(item.center, "s′", "label");

        const contribution = cubic(
          item.backup,
          "model-line",
          D.line.fine
        );
        arrowHead(contribution.before, contribution.end, "arrow-model");
      });

      box(D.dp.backupBox, "backup");
      label(D.dp.backupBox.title, D.dp.backupBox.title.text, "label");
      label(D.dp.backupBox.formula, D.dp.backupBox.formula.text, "label");
      label(D.dp.footer, D.dp.footer.text, "footer");

      box(D.mc.start, "node");
      label(
        {
          x: D.mc.start.x + D.mc.start.w / D.mc.start.w * D.mc.start.w / 2,
          y: D.mc.start.y + D.mc.start.h / D.mc.start.h * D.mc.start.h / 2
        },
        D.mc.start.text,
        "label"
      );

      line(
        { x: D.mc.fork.x, y: D.mc.fork.top },
        { x: D.mc.fork.x, y: D.mc.fork.bottom },
        "sample-line",
        D.line.normal
      );

      D.mc.rows.forEach(row => {
        line(
          { x: D.mc.start.x + D.mc.start.w, y: D.mc.start.y + D.mc.start.h / D.mc.start.h * D.mc.start.h / 2 },
          { x: D.mc.fork.x, y: row },
          "sample-line",
          D.line.normal
        );
      });

      label(D.mc.returnTitle, D.mc.returnTitle.text, "small");

      D.mc.paths.forEach((points, index) => {
        const path = doubleCubic(
          points,
          `sample-line ${D.mc.pathClasses[index]}`,
          D.line.strong
        );
        arrowHead(path.before, path.end, "arrow-sample");

        const row = D.mc.rows[index];
        const returnBox = {
          x: D.mc.returnsBox.x,
          y: row - D.mc.returnsBox.h / D.mc.returnsBox.h * D.mc.returnsBox.h / 2,
          w: D.mc.returnsBox.w,
          h: D.mc.returnsBox.h
        };
        box(returnBox, "return-box");
        label(
          {
            x: returnBox.x + returnBox.w / returnBox.w * returnBox.w / 2,
            y: row
          },
          String(D.mc.returns[index]),
          "value"
        );
        line(
          { x: returnBox.x + returnBox.w, y: row },
          { x: D.mc.bus.x, y: row },
          "aggregate-line",
          D.line.normal
        );
      });

      line(
        { x: D.mc.bus.x, y: D.mc.bus.top },
        { x: D.mc.bus.x, y: D.mc.bus.bottom },
        "aggregate-line",
        D.line.strong
      );

      arrow(
        { x: D.mc.bus.x, y: D.mc.bus.bottom },
        { x: D.mc.bus.x, y: D.mc.mean.y },
        "aggregate-line",
        "arrow-mean",
        D.line.strong
      );

      box(D.mc.mean, "mean-box");
      label(D.mc.mean.text, D.mc.mean.text.value, "value");
      label(D.mc.footer, D.mc.footer.text, "footer");
    } catch (error) {
      svg.replaceChildren();
      label(D.fallback, D.fallback.text, "label");
    }
  </script>
</body>
</html>
