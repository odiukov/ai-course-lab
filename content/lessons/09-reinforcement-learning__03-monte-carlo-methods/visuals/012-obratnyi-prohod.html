<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Как отдача распространяется от конца эпизода</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f4f7fb;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --ink: #172033;
      --muted: #5d687b;
      --line: #9aa7ba;
      --line-soft: #d7dee9;
      --step-fill: #eef3f9;
      --step-stroke: #8a98ad;
      --reward-fill: #fff3cc;
      --reward-stroke: #d39b22;
      --reward-ink: #744b00;
      --return-fill: #e7f8ef;
      --return-stroke: #16935c;
      --return-ink: #075f3a;
      --arrow: #4967d6;
      --arrow-soft: #e9edff;
      --final-fill: #fff0d7;
      --final-stroke: #e27916;
      --final-ink: #824000;
      --shadow: #dce3ee;
      --error: #a82727;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #101521;
        --panel: #171e2c;
        --panel-soft: #1b2433;
        --ink: #edf2fb;
        --muted: #b3bfd1;
        --line: #75839a;
        --line-soft: #344155;
        --step-fill: #222d3e;
        --step-stroke: #697991;
        --reward-fill: #493a17;
        --reward-stroke: #e5b642;
        --reward-ink: #ffe49a;
        --return-fill: #163d2d;
        --return-stroke: #51d294;
        --return-ink: #b8f5d6;
        --arrow: #92a8ff;
        --arrow-soft: #283352;
        --final-fill: #4b2f18;
        --final-stroke: #ffad58;
        --final-ink: #ffd2a1;
        --shadow: #0b0f17;
        --error: #ff9d9d;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      margin: 0;
    }

    figure {
      margin: 0;
      background: var(--panel);
      border: 2px solid var(--line-soft);
    }

    figcaption {
      background: var(--panel-soft);
      border-bottom: 2px solid var(--line-soft);
      padding: 16px 22px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: bold;
    }

    .lead {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--panel);
    }

    .track {
      stroke: var(--line);
      stroke-width: 3px;
      stroke-linecap: round;
    }

    .track-head {
      fill: var(--line);
    }

    .step-shadow {
      fill: var(--shadow);
    }

    .step-card {
      fill: var(--step-fill);
      stroke: var(--step-stroke);
      stroke-width: 2px;
    }

    .step-card-final {
      fill: var(--final-fill);
      stroke: var(--final-stroke);
      stroke-width: 3px;
    }

    .step-title {
      fill: var(--ink);
      font-size: 16px;
      font-weight: bold;
      text-anchor: middle;
    }

    .step-title-final {
      fill: var(--final-ink);
    }

    .reward-chip {
      fill: var(--reward-fill);
      stroke: var(--reward-stroke);
      stroke-width: 2px;
    }

    .reward-label {
      fill: var(--muted);
      font-size: 13px;
      text-anchor: middle;
    }

    .reward-value {
      fill: var(--reward-ink);
      font-size: 21px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .return-halo {
      fill: var(--arrow-soft);
    }

    .return-node {
      fill: var(--return-fill);
      stroke: var(--return-stroke);
      stroke-width: 3px;
    }

    .return-value {
      fill: var(--return-ink);
      font-size: 21px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .return-caption {
      fill: var(--muted);
      font-size: 13px;
      text-anchor: middle;
    }

    .back-arrow {
      stroke: var(--arrow);
      stroke-width: 4px;
      stroke-linecap: round;
    }

    .back-head {
      fill: var(--arrow);
    }

    .arrow-label {
      fill: var(--arrow);
      font-size: 15px;
      font-weight: bold;
      text-anchor: middle;
    }

    .gamma-box {
      fill: var(--arrow-soft);
      stroke: var(--arrow);
      stroke-width: 2px;
    }

    .gamma-text {
      fill: var(--arrow);
      font-size: 16px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .legend-rule {
      stroke: var(--line-soft);
      stroke-width: 2px;
    }

    .legend-main {
      fill: var(--ink);
      font-size: 16px;
      font-weight: bold;
      text-anchor: middle;
    }

    .legend-note {
      fill: var(--muted);
      font-size: 14px;
      text-anchor: middle;
    }

    .error {
      fill: var(--error);
      font-size: 17px;
      text-anchor: middle;
    }

    noscript {
      display: block;
      padding: 20px;
      color: var(--error);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="scheme-heading scheme-summary">
    <figcaption>
      <h1 id="scheme-heading">Как отдача распространяется от конца эпизода</h1>
      <p class="lead" id="scheme-summary">
        Финальная награда проходит по траектории справа налево и ослабевает с каждым переходом.
      </p>
    </figcaption>

    <svg
      id="scheme"
      viewBox="0 0 960 430"
      width="960"
      height="430"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Распространение отдачи справа налево</title>
      <desc id="svg-desc">
        Три хода с наградами ноль, ноль и один. При гамма ноль целых девять
        отдачи справа налево равны один, ноль целых девять и ноль целых восемьдесят одна.
      </desc>
      <g id="drawing"></g>
    </svg>

    <noscript>
      Траектория с наградами [0, 0, 1]: при γ = 0.9 отдача распространяется
      справа налево как 1.0 → 0.9 → 0.81.
    </noscript>
  </figure>

  <script>
    const diagram = {
      gamma: "0.9",
      rewardSequence: "[0, 0, 1]",
      returnSequence: "[0.81, 0.9, 1.0]",
      steps: [
        {
          x: 1.8,
          title: "ранний ход",
          reward: "0",
          returnValue: "0.81",
          final: false
        },
        {
          x: 5.0,
          title: "средний ход",
          reward: "0",
          returnValue: "0.9",
          final: false
        },
        {
          x: 8.2,
          title: "финальный ход",
          reward: "1",
          returnValue: "1.0",
          final: true
        }
      ],
      arrows: [
        {
          fromX: 7.55,
          toX: 5.65,
          y: 0.92,
          labelX: 6.6,
          labelY: 0.57,
          label: "× γ = 0.9"
        },
        {
          fromX: 4.35,
          toX: 2.45,
          y: 0.92,
          labelX: 3.4,
          labelY: 0.57,
          label: "× γ = 0.9"
        }
      ],
      layout: {
        returnY: 1.58,
        returnRadius: 0.49,
        haloRadius: 0.61,
        returnCaptionY: 2.32,
        cardY: 2.62,
        cardWidth: 2.14,
        cardHeight: 0.82,
        cardHalfWidth: 1.07,
        shadowShiftX: 0.08,
        shadowShiftY: 0.09,
        cardCornerX: 0.18,
        cardCornerY: 0.18,
        cardTitleY: 3.11,
        rewardLabelY: 3.68,
        rewardY: 4.12,
        rewardWidth: 1.24,
        rewardHeight: 0.58,
        rewardHalfWidth: 0.62,
        rewardHalfHeight: 0.29,
        rewardCornerX: 0.16,
        rewardCornerY: 0.16,
        trackY: 3.03,
        trackGap: 1.12,
        trackHeadLength: 0.18,
        trackHeadHalfHeight: 0.12,
        backHeadLength: 0.22,
        backHeadHalfHeight: 0.14,
        gammaX: 9.62,
        gammaY: 0.92,
        gammaWidth: 1.34,
        gammaHeight: 0.58,
        gammaHalfWidth: 0.67,
        gammaHalfHeight: 0.29,
        gammaCornerX: 0.16,
        gammaCornerY: 0.16,
        ruleStartX: 0.65,
        ruleEndX: 10.35,
        ruleY: 4.68,
        legendMainX: 5.5,
        legendMainY: 5.02,
        legendNoteX: 5.5,
        legendNoteY: 5.34,
        fallbackX: 5.5,
        fallbackY: 2.75
      }
    };

    const origin = { x: 40, y: 18 };
    const scale = { x: 80, y: 72 };

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const drawing = document.getElementById("drawing");
    const labelPad = 10;

    try {
      const namespace = drawing.namespaceURI;

      const element = (name, attributes, content) => {
        const node = document.createElementNS(namespace, name);
        for (const [key, value] of Object.entries(attributes)) {
          node.setAttribute(key, String(value));
        }
        if (content !== undefined) {
          node.textContent = content;
        }
        return node;
      };

      const add = node => drawing.appendChild(node);
      const layout = diagram.layout;

      let previousStep;
      for (const step of diagram.steps) {
        if (previousStep) {
          const trackStart = previousStep.x + layout.trackGap;
          const trackEnd = step.x - layout.trackGap;

          add(element("line", {
            x1: sx(trackStart),
            y1: sy(layout.trackY),
            x2: sx(trackEnd),
            y2: sy(layout.trackY),
            class: "track"
          }));

          add(element("polygon", {
            points: [
              `${sx(trackEnd)},${sy(layout.trackY)}`,
              `${sx(trackEnd - layout.trackHeadLength)},${sy(layout.trackY - layout.trackHeadHalfHeight)}`,
              `${sx(trackEnd - layout.trackHeadLength)},${sy(layout.trackY + layout.trackHeadHalfHeight)}`
            ].join(" "),
            class: "track-head"
          }));
        }
        previousStep = step;
      }

      for (const arrow of diagram.arrows) {
        add(element("line", {
          x1: sx(arrow.fromX),
          y1: sy(arrow.y),
          x2: sx(arrow.toX),
          y2: sy(arrow.y),
          class: "back-arrow"
        }));

        add(element("polygon", {
          points: [
            `${sx(arrow.toX)},${sy(arrow.y)}`,
            `${sx(arrow.toX + layout.backHeadLength)},${sy(arrow.y - layout.backHeadHalfHeight)}`,
            `${sx(arrow.toX + layout.backHeadLength)},${sy(arrow.y + layout.backHeadHalfHeight)}`
          ].join(" "),
          class: "back-head"
        }));

        add(element("text", {
          x: sx(arrow.labelX),
          y: sy(arrow.labelY) - labelPad,
          class: "arrow-label"
        }, arrow.label));
      }

      add(element("rect", {
        x: sx(layout.gammaX - layout.gammaHalfWidth),
        y: sy(layout.gammaY - layout.gammaHalfHeight),
        width: sx(layout.gammaWidth) - sx(0),
        height: sy(layout.gammaHeight) - sy(0),
        rx: sx(layout.gammaCornerX) - sx(0),
        ry: sy(layout.gammaCornerY) - sy(0),
        class: "gamma-box"
      }));

      add(element("text", {
        x: sx(layout.gammaX),
        y: sy(layout.gammaY),
        class: "gamma-text"
      }, `γ = ${diagram.gamma}`));

      for (const step of diagram.steps) {
        add(element("circle", {
          cx: sx(step.x),
          cy: sy(layout.returnY),
          r: sx(layout.haloRadius) - sx(0),
          class: "return-halo"
        }));

        add(element("circle", {
          cx: sx(step.x),
          cy: sy(layout.returnY),
          r: sx(layout.returnRadius) - sx(0),
          class: "return-node"
        }));

        add(element("text", {
          x: sx(step.x),
          y: sy(layout.returnY),
          class: "return-value"
        }, step.returnValue));

        add(element("text", {
          x: sx(step.x),
          y: sy(layout.returnCaptionY),
          class: "return-caption"
        }, "отдача G"));

        add(element("rect", {
          x: sx(step.x - layout.cardHalfWidth + layout.shadowShiftX),
          y: sy(layout.cardY + layout.shadowShiftY),
          width: sx(layout.cardWidth) - sx(0),
          height: sy(layout.cardHeight) - sy(0),
          rx: sx(layout.cardCornerX) - sx(0),
          ry: sy(layout.cardCornerY) - sy(0),
          class: "step-shadow"
        }));

        add(element("rect", {
          x: sx(step.x - layout.cardHalfWidth),
          y: sy(layout.cardY),
          width: sx(layout.cardWidth) - sx(0),
          height: sy(layout.cardHeight) - sy(0),
          rx: sx(layout.cardCornerX) - sx(0),
          ry: sy(layout.cardCornerY) - sy(0),
          class: step.final ? "step-card-final" : "step-card"
        }));

        add(element("text", {
          x: sx(step.x),
          y: sy(layout.cardTitleY),
          class: step.final ? "step-title step-title-final" : "step-title"
        }, step.title));

        add(element("text", {
          x: sx(step.x),
          y: sy(layout.rewardLabelY),
          class: "reward-label"
        }, "реальная награда"));

        add(element("rect", {
          x: sx(step.x - layout.rewardHalfWidth),
          y: sy(layout.rewardY - layout.rewardHalfHeight),
          width: sx(layout.rewardWidth) - sx(0),
          height: sy(layout.rewardHeight) - sy(0),
          rx: sx(layout.rewardCornerX) - sx(0),
          ry: sy(layout.rewardCornerY) - sy(0),
          class: "reward-chip"
        }));

        add(element("text", {
          x: sx(step.x),
          y: sy(layout.rewardY),
          class: "reward-value"
        }, step.reward));
      }

      add(element("line", {
        x1: sx(layout.ruleStartX),
        y1: sy(layout.ruleY),
        x2: sx(layout.ruleEndX),
        y2: sy(layout.ruleY),
        class: "legend-rule"
      }));

      add(element("text", {
        x: sx(layout.legendMainX),
        y: sy(layout.legendMainY),
        class: "legend-main"
      }, `награды ${diagram.rewardSequence}  →  отдачи ${diagram.returnSequence}`));

      add(element("text", {
        x: sx(layout.legendNoteX),
        y: sy(layout.legendNoteY),
        class: "legend-note"
      }, "Источник сигнала один: финальная награда распространяется справа налево"));
    } catch (error) {
      drawing.replaceChildren();

      const fallback = document.createElementNS(drawing.namespaceURI, "text");
      fallback.setAttribute("x", String(sx(diagram.layout.fallbackX)));
      fallback.setAttribute("y", String(sy(diagram.layout.fallbackY)));
      fallback.setAttribute("class", "error");
      fallback.textContent =
        `Схема: награды ${diagram.rewardSequence}, γ = ${diagram.gamma}; ` +
        `отдача справа налево 1.0 → 0.9 → 0.81.`;
      drawing.appendChild(fallback);
    }
  </script>
</body>
</html>
