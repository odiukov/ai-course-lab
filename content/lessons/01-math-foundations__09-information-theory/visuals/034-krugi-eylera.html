<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Круги Эйлера для энтропий</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #5a5a5a;
    --x: #2f6fbf;
    --y: #c25a1e;
    --inter: #6b3fa0;
    --line: #333333;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c;
      --fg: #eceff4;
      --muted: #a6adb8;
      --x: #79b2f5;
      --y: #f0a05a;
      --inter: #c3a2f0;
      --line: #cfd4dc;
    }
  }
  html, body { margin: 0; background: var(--bg); }
  .wrap {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 8px 10px 10px;
    box-sizing: border-box;
  }
  h2 {
    font-size: 15px;
    margin: 0 0 6px;
    font-weight: 600;
  }
  svg { display: block; width: 100%; max-height: 470px; height: auto; }
  .fallback { font-size: 13px; color: var(--muted); line-height: 1.5; }
  text { font-family: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <h2>Круги Эйлера: H(X), H(Y), I(X;Y)</h2>
  <div id="host"></div>
</div>
<script>
(function () {
  var host = document.getElementById('host');
  try {
    // ---- данные схемы (в своих единицах) ----
    var D = {
      cx: { x: -1.1, y: 0 },   // центр круга H(X)
      cy: { x: 1.1, y: 0 },    // центр круга H(Y)
      r: 2.2,                  // радиус каждого круга
      lensCx: { x: -2.0, y: 0 },   // серп H(X|Y)
      lensCy: { x: 2.0, y: 0 },    // серп H(Y|X)
      mid: { x: 0, y: 0 },         // пересечение I(X;Y)
      capX: { x: -2.1, y: 2.35 },  // подпись круга H(X)
      capY: { x: 2.1, y: 2.35 },   // подпись круга H(Y)
      unionTop: { x: 0, y: -2.75 },// подпись объединения
      formula: { x: 0, y: -3.55 }, // тождество площадей
      arrTail: { x: 0, y: 1.7 },   // хвост стрелки к пересечению
      arrHead: { x: 0, y: 0.62 }   // наконечник стрелки
    };

    // ---- один origin и один scale ----
    var W = 640, H = 400;
    var SCALE = 66;
    var ORIGIN = { x: 320, y: 215 };

    function sx(x) { return ORIGIN.x + x * SCALE; }
    function sy(y) { return ORIGIN.y - y * SCALE; }

    var NS = 'http://www.w3.org/2000/svg';
    function el(name, attrs) {
      var n = document.createElementNS(NS, name);
      for (var k in attrs) n.setAttribute(k, attrs[k]);
      return n;
    }
    function label(pt, dx, dy, anchor, txt, fill, size, weight) {
      var t = el('text', {
        x: sx(pt.x) + dx,
        y: sy(pt.y) + dy,
        'text-anchor': anchor,
        fill: fill,
        'font-size': size,
        'font-weight': weight || '400'
      });
      t.textContent = txt;
      return t;
    }

    var svg = el('svg', {
      viewBox: '0 0 ' + W + ' ' + H,
      preserveAspectRatio: 'xMidYMid meet',
      role: 'img'
    });
    svg.appendChild(el('rect', { x: 0, y: 0, width: W, height: H, fill: 'var(--bg)' }));

    // радиус в пикселях — через ту же функцию перевода
    var rpx = sx(D.r) - sx(0);

    // определения: клип для правого круга, чтобы залить пересечение
    var defs = el('defs');
    var clip = el('clipPath', { id: 'clipY' });
    clip.appendChild(el('circle', { cx: sx(D.cy.x), cy: sy(D.cy.y), r: rpx }));
    defs.appendChild(clip);
    var mk = el('marker', {
      id: 'ah', viewBox: '0 0 10 10', refX: '9', refY: '5',
      markerWidth: '7', markerHeight: '7', orient: 'auto-start-reverse'
    });
    mk.appendChild(el('path', { d: 'M 0 0 L 10 5 L 0 10 z', fill: 'var(--inter)' }));
    defs.appendChild(mk);
    svg.appendChild(defs);

    // круг H(X)
    svg.appendChild(el('circle', {
      cx: sx(D.cx.x), cy: sy(D.cx.y), r: rpx,
      fill: 'var(--x)', 'fill-opacity': '0.16',
      stroke: 'var(--x)', 'stroke-width': 2
    }));
    // круг H(Y)
    svg.appendChild(el('circle', {
      cx: sx(D.cy.x), cy: sy(D.cy.y), r: rpx,
      fill: 'var(--y)', 'fill-opacity': '0.16',
      stroke: 'var(--y)', 'stroke-width': 2
    }));
    // пересечение
    var g = el('g', { 'clip-path': 'url(#clipY)' });
    g.appendChild(el('circle', {
      cx: sx(D.cx.x), cy: sy(D.cx.y), r: rpx,
      fill: 'var(--inter)', 'fill-opacity': '0.34',
      stroke: 'var(--inter)', 'stroke-width': 2
    }));
    svg.appendChild(g);

    // стрелка к пересечению (подпись у хвоста)
    svg.appendChild(el('line', {
      x1: sx(D.arrTail.x), y1: sy(D.arrTail.y),
      x2: sx(D.arrHead.x), y2: sy(D.arrHead.y),
      stroke: 'var(--inter)', 'stroke-width': 1.6,
      'marker-end': 'url(#ah)'
    }));
    svg.appendChild(label(D.arrTail, 0, -8, 'middle', 'I(X;Y) — общее', 'var(--inter)', 14, '600'));

    // подписи серпов внутри кругов
    svg.appendChild(label(D.lensCx, 0, 5, 'middle', 'H(X|Y)', 'var(--x)', 15, '600'));
    svg.appendChild(label(D.lensCy, 0, 5, 'middle', 'H(Y|X)', 'var(--y)', 15, '600'));

    // подписи кругов: слева — end, справа — start
    svg.appendChild(label(D.capX, -6, 0, 'end', 'H(X)', 'var(--x)', 16, '700'));
    svg.appendChild(label(D.capY, 6, 0, 'start', 'H(Y)', 'var(--y)', 16, '700'));

    // объединение + тождество, сверху по центру
    svg.appendChild(label(D.unionTop, 0, 0, 'middle',
      'вся закрашенная площадь = H(X,Y)', 'var(--fg)', 15, '600'));
    svg.appendChild(label(D.formula, 0, 0, 'middle',
      'H(X,Y) = H(X) + H(Y) − I(X;Y)', 'var(--muted)', 14, '400'));

    // легенда снизу
    svg.appendChild(label({ x: 0, y: -3.05 }, 0, 0, 'middle',
      'H(X) = H(X|Y) + I(X;Y)   ·   H(X,Y) = H(X) + H(Y|X)', 'var(--muted)', 13, '400'));

    host.appendChild(svg);
  } catch (e) {
    host.innerHTML = '<p class="fallback">Схема: два пересекающихся круга. ' +
      'Левый круг — H(X), правый — H(Y). Пересечение — I(X;Y). ' +
      'Левый серп (X без пересечения) — H(X|Y), правый серп — H(Y|X). ' +
      'Вся закрашенная площадь — H(X,Y) = H(X) + H(Y) − I(X;Y).</p>';
  }
})();
</script>
</body>
</html>
