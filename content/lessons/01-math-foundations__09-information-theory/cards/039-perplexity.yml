- concept: perplexity равна экспоненте cross-entropy
  question: Средняя cross-entropy языковой модели равна 4 битам на токен. Чему равна perplexity?
  explanation: Для cross-entropy в битах нужно возвести двойку в степень cross-entropy. Два в четвёртой степени равно 16, поэтому эффективное число равновероятных вариантов равно 16.
  kind: numeric
  answer: 16
  tolerance: 0.01
  id: 039-perplexity-1
  fingerprint: a0100134
- concept: perplexity не зависит от выбора битов или натов при согласованных основаниях логарифма и экспоненты
  question: Одну и ту же cross-entropy выразили сначала в битах, а затем в натах. В каждом случае perplexity рассчитали с подходящим основанием экспоненты. Как соотносятся результаты?
  explanation: При смене единицы меняется численное значение cross-entropy, но одновременно меняется основание экспоненты. Эти преобразования компенсируют друг друга, поэтому perplexity остаётся той же.
  kind: choice
  options:
    - Perplexity получится одинаковой
    - Значение, рассчитанное из натов, будет больше
    - Значение, рассчитанное из битов, будет больше
  correct: 0
  id: 039-perplexity-2
  fingerprint: a69a1246
