- concept: энтропия не меняется при перестановке вероятностей между названиями исходов
  question: У монеты A вероятность орла равна вероятности решки у монеты B, а вероятность решки у A — вероятности орла у B. Как соотносятся энтропии монет?
  explanation: 'Энтропия зависит от набора вероятностей, а не от названий исходов. Перестановка вероятностей орла и решки не меняет сумму: распределения 0.99/0.01 и 0.01/0.99 имеют одинаковую энтропию.'
  kind: choice
  options:
    - Энтропия A выше
    - Энтропия B выше
    - Энтропии равны
  correct: 2
  id: 010-monety-1
  fingerprint: 47c50a51
- concept: перечень возможных исходов не определяет энтропию без их вероятностей
  question: Почему знания перечня возможных исходов недостаточно, чтобы определить энтропию распределения?
  explanation: У обеих монет из урока возможны орёл и решка, однако распределение 0.5/0.5 даёт 1 бит энтропии, а 0.99/0.01 — около 0.08 бита. Различие создают вероятности, а не количество исходов.
  kind: open
  reference: Энтропия зависит не только от того, какие исходы возможны, но и от распределения вероятностей между ними. Один и тот же набор исходов может иметь высокую энтропию при близких вероятностях и низкую — при сильном преобладании одного исхода.
  id: 010-monety-2
  fingerprint: ee87b0d1
