- concept: label smoothing равномерно распределяет сглаживающую массу между всеми классами
  question: Заполни пропуск в формуле, где ε — параметр сглаживания, а K — число классов.
  explanation: Добавка ε делится поровну между всеми K классами. Поэтому каждый неверный класс получает ε/K, а верный — (1 − ε) + ε/K. Например, при ε = 0.1 и четырёх классах это даёт мягкую цель [0.025, 0.025, 0.925, 0.025].
  kind: cloze
  template: 'Для one-hot метки после label smoothing: p(любой неверный класс) = ___'
  answer: ε / K
  accept:
    - ε/K
    - epsilon / K
    - epsilon/K
  id: 044-label-smoothing-1
  fingerprint: d8417724
- concept: label smoothing повышает энтропию целевого распределения
  question: Как label smoothing меняет энтропию целевой one-hot метки при ненулевом параметре сглаживания?
  explanation: One-hot распределение вырождено, поэтому его энтропия равна нулю. После сглаживания несколько классов получают положительную вероятность, и энтропия становится положительной, хотя обычно не достигает максимума равномерного распределения.
  kind: choice
  options:
    - Энтропия остаётся нулевой
    - Энтропия становится положительной
    - Энтропия обязательно становится максимально возможной
    - Энтропия становится отрицательной
  correct: 1
  id: 044-label-smoothing-2
  fingerprint: 4dabd1f2
- concept: положительные вероятности неверных классов создают конечный оптимум логитов
  question: Почему при мягкой целевой метке бесконечное увеличение логита верного класса перестаёт улучшать cross-entropy?
  explanation: 'Для one-hot цели loss продолжает уменьшаться по мере приближения вероятности верного класса к 1. При цели [0.025, 0.025, 0.925, 0.025] оптимально воспроизвести именно эти вероятности: более крайнее предсказание уже увеличивает KL-дивергенцию между целью и прогнозом.'
  kind: open
  reference: Мягкая цель оставляет положительную вероятность неверным классам. Если увеличивать логит верного класса без ограничений, предсказанные вероятности остальных классов стремятся к нулю и расходятся с целью, поэтому их вклад в cross-entropy растёт. Минимум достигается, когда предсказанное распределение совпадает с мягкой целью.
  id: 044-label-smoothing-3
  fingerprint: ef0cd6d0
