- concept: label smoothing равномерно распределяет сглаживающую массу между всеми классами
  question: Заполни пропуск в формуле, где ε — параметр сглаживания, а K — число классов.
  explanation: Добавка ε делится поровну между всеми K классами. Поэтому каждый неверный класс получает ε/K, а верный — (1 − ε) + ε/K. Например, при ε = 0.1 и четырёх классах это даёт мягкую цель [0.025, 0.025, 0.925, 0.025].
  kind: cloze
  template: 'Для one-hot метки после label smoothing: p(любой неверный класс) = ___'
  answer: ε / K
  accept:
    - ε/K
    - epsilon / K
    - epsilon/K
