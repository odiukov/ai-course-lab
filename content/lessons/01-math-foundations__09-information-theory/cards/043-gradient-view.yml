- concept: градиент связки softmax и cross-entropy по логиту равен разности предсказанной и целевой вероятностей
  question: Восстановите формулу градиента cross-entropy по логиту класса.
  explanation: Softmax преобразует логиты в вероятности q, а p задаёт целевое распределение. После дифференцирования cross-entropy и softmax множители сокращаются, и остаётся q_i − p_i.
  kind: cloze
  template: ∂L/∂z_i = ___
  answer: q_i - p_i
  accept:
    - q_i − p_i
    - softmax(z)_i - p_i
    - предсказание минус истина
  id: 043-gradient-view-1
  fingerprint: 16503ab6
- concept: знак градиента автоматически повышает логит верного класса и понижает логиты неверных классов
  question: Как шаг градиентного спуска изменяет логиты при использовании softmax и cross-entropy, если предсказание ещё не совпало с one-hot меткой?
  explanation: Для верного класса q_i − p_i отрицательно, поэтому вычитание градиента повышает его логит. Для неверных классов градиент положителен, поэтому их логиты понижаются.
  kind: choice
  options:
    - Повышает логит верного класса и понижает логиты неверных
    - Понижает логит верного класса и повышает логиты неверных
    - Повышает логиты всех классов
    - Оставляет все логиты неизменными из-за нормировки softmax
  correct: 0
  id: 043-gradient-view-2
  fingerprint: 34b8e126
