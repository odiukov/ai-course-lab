- concept: дробная энтропия выражает среднее количество информации на исход, а не длину отдельного двоичного описания
  question: Почему энтропия может быть дробной, хотя длина двоичного описания каждого отдельного исхода всегда целая?
  explanation: Дробное значение не означает дробную длину отдельного кодового слова. Оно описывает средний расход битов на один результат при рассмотрении длинной серии результатов.
  kind: open
  reference: Энтропия — это среднее количество информации на исход. При совместном кодировании длинных последовательностей общая длина кода остаётся целой, но её среднее значение в расчёте на один исход может быть дробным.
