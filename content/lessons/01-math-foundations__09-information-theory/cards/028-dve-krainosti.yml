- concept: условная энтропия ограничена снизу нулём и сверху исходной энтропией целевой переменной
  question: Какое утверждение верно для условной энтропии случайной величины Y при наблюдении X?
  explanation: 'Наблюдение X не может оставить отрицательную неопределённость о Y или увеличить её по сравнению с исходной: 0 ≤ H(Y|X) ≤ H(Y).'
  kind: choice
  options:
    - Она всегда не меньше H(Y)
    - Она находится между нулём и H(Y), включая границы
    - Она может принимать любое действительное значение
  correct: 1
  id: 028-dve-krainosti-1
  fingerprint: ea55001c
- concept: полная определённость Y по X обнуляет условную энтропию
  question: Если каждому возможному значению X соответствует единственное значение Y, чему равна H(Y|X) и почему?
  explanation: Когда X полностью определяет Y, наблюдение X устраняет всю неопределённость о Y, поэтому H(Y|X) = 0.
  kind: open
  reference: H(Y|X) равна нулю, потому что после наблюдения X значение Y известно без неопределённости.
