- concept: KL-дивергенция распределения относительно самого себя равна нулю
  question: Что должна вернуть корректная реализация kl_divergence(p, p, base), если не учитывать погрешность вычислений с плавающей запятой?
  explanation: При совпадении распределений cross_entropy(p, p, base) равна entropy(p, base), поэтому их разность равна нулю. На практике возможен очень малый остаток из-за округления.
