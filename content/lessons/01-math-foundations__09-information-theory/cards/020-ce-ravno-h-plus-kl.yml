- concept: KL-дивергенция выражает среднее лишнее удивление от использования Q вместо истинного распределения P
  question: Исходы возникают согласно распределению P, но их вероятности оцениваются распределением Q. Объясни своими словами, что в этой ситуации означает D_KL(P || Q).
  explanation: Кросс-энтропия H(P, Q) измеряет среднее удивление при использовании Q, а H(P) — собственную неопределённость источника P. Их разность и есть лишнее удивление D_KL(P || Q).
  kind: open
  reference: Это дополнительное среднее удивление, или логарифмический штраф, возникающий из-за оценки исходов через Q вместо истинного распределения P.
  id: 020-ce-ravno-h-plus-kl-1
  fingerprint: d0440444
- concept: минимально достижимая кросс-энтропия равна энтропии истинного распределения и не обязана быть нулевой
  question: Истинное распределение P недетерминировано, а модель достигла точного совпадения Q = P. Каково значение H(P, Q)?
  explanation: При Q = P дивергенция KL исчезает, поэтому из H(P, Q) = H(P) + D_KL(P || Q) остаётся H(P). Если истинное распределение недетерминировано, его энтропия положительна, поэтому даже идеальная модель не достигает нулевой кросс-энтропии.
  kind: choice
  options:
    - Оно обязательно равно нулю
    - Оно равно H(P) и поэтому положительно
    - Оно равно удвоенному H(P)
    - Оно может быть отрицательным
  correct: 1
  id: 020-ce-ravno-h-plus-kl-2
  fingerprint: 5e97b41a
