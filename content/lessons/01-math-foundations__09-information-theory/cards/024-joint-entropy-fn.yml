- concept: простая сумма энтропий строк не является совместной энтропией
  question: Разработчик вычислил энтропию каждой строки таблицы p(x,y) и сложил результаты. Объясни, почему так обычно нельзя получить H(X,Y) и как выглядит корректное разложение по строкам.
  explanation: Невзвешенная сумма результатов по строкам игнорирует вероятности разных значений X. Корректная условная энтропия усредняет энтропии нормированных строк с весами p(x), после чего к ней добавляется H(X).
  kind: open
  reference: Строка таблицы обычно имеет суммарную массу p(x), а не является нормированным распределением Y. Для разложения её нужно нормировать до p(y|x), вычислить условную энтропию и учесть вес p(x). В результате H(X,Y) = H(X) + H(Y|X).
  id: 024-joint-entropy-fn-2
  fingerprint: ff4200e3
- concept: совместная энтропия не превосходит сумму маргинальных энтропий, а равенство характеризует независимость
  question: Какое утверждение можно использовать как инвариант при тестировании реализации joint_entropy вместе с энтропиями маргинальных распределений?
  explanation: 'Общая информация переменных не должна учитываться дважды: H(X,Y) = H(X) + H(Y) − I(X;Y). Взаимная информация неотрицательна и обращается в ноль для независимых переменных.'
  kind: choice
  options:
    - H(X,Y) всегда равна H(X) + H(Y)
    - H(X,Y) не меньше H(X) + H(Y), причём равенство означает независимость
    - H(X,Y) не превосходит H(X) + H(Y), причём для независимых переменных достигается равенство
    - H(X,Y) не превосходит меньшую из величин H(X) и H(Y)
  correct: 2
