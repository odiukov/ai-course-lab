- concept: минус перед логарифмическим отношением обеспечивает неотрицательное информационное содержание
  question: Объясните своими словами, почему в выражении для `information_content` перед `math.log(p)` нужен минус.
  explanation: 'При `0 < p < 1` выполняется `math.log(p) < 0`. Поэтому без минуса функция вернула бы отрицательное удивление: например, вместо ожидаемых `1.0` и `2.0` получились бы значения с противоположным знаком.'
  kind: open
  reference: Для допустимого, но не гарантированного события логарифм вероятности отрицателен. Унарный минус превращает результат в неотрицательную величину информационного содержания.
  id: 005-information-content-2
  fingerprint: 8c2ff60f
