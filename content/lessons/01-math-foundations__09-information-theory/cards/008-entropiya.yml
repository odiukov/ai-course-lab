- concept: равномерное распределение максимизирует энтропию при фиксированном наборе исходов
  question: Какое распределение на одном и том же конечном наборе возможных исходов имеет наибольшую энтропию?
  explanation: При равных вероятностях заранее угадать исход труднее всего, поэтому среднее удивление максимально. Концентрация вероятности на отдельных исходах делает источник предсказуемее и уменьшает энтропию.
  kind: choice
  options:
    - Все исходы равновероятны
    - Один исход намного вероятнее остальных
    - Вероятности сосредоточены на нескольких исходах
    - Наиболее редкий исход имеет наибольшее удивление
  correct: 0
  id: 008-entropiya-1
  fingerprint: 5599ce75
- concept: энтропия вычисляется как взвешенная вероятностями сумма удивлений исходов
  question: Источник имеет распределение вероятностей (0.75, 0.125, 0.125). Чему примерно равна его энтропия в битах?
  explanation: Нужно вычислить H = -(0.75 log₂ 0.75 + 0.125 log₂ 0.125 + 0.125 log₂ 0.125). Получается примерно 1.06 бита на исход.
  kind: numeric
  answer: 1.06
  tolerance: 0.02
  id: 008-entropiya-2
  fingerprint: 231b2e6b
- concept: энтропия задаёт нижнюю границу средней длины сжатого представления без потерь
  question: Почему более предсказуемый источник обычно удаётся сильнее сжать без потерь? Объясните связь с энтропией.
  explanation: Частым и предсказуемым исходам можно назначать короткие коды, а редким — длинные. Минимальная достижимая средняя длина такого кодирования ограничена энтропией источника.
  kind: open
  reference: У предсказуемого источника ниже среднее удивление, а значит, ниже энтропия. Энтропия задаёт теоретическую нижнюю границу среднего числа битов, необходимых для кодирования одного исхода без потери информации, поэтому источник с меньшей энтропией допускает более короткое среднее представление.
  id: 008-entropiya-3
  fingerprint: 232a485e
