- concept: одинаковое кратное уменьшение вероятности даёт одинаковую прибавку к удивлению независимо от исходной вероятности
  question: Вероятности двух разных событий уменьшили в одно и то же число раз. Объясни, почему их удивление увеличится на одинаковую величину.
  explanation: Если вероятность изменилась с p до p/k, то прирост удивления равен −log₂(p/k) + log₂(p) = log₂(k). Он зависит только от коэффициента k, а не от исходного p.
  kind: open
  reference: Разность между новым и старым удивлением равна логарифму коэффициента уменьшения вероятности. Исходная вероятность при вычитании сокращается, поэтому прибавка одинакова для обоих событий.
  id: 007-check-udivlenie-1
  fingerprint: d4c3b8e9
- concept: достоверное событие не несёт информации, потому что не устраняет неопределённость
  question: 'Событие достоверно: оно произойдёт при любом допустимом исходе. Почему сообщение о его наступлении не несёт информационного содержания?'
  explanation: 'У достоверного события p = 1, поэтому I = −log(1) = 0. Наблюдение не устраняет неопределённость: событие и так было гарантировано.'
  kind: choice
  options:
    - Оно не исключает ни одного возможного исхода
    - Его информационное содержание невозможно измерить
    - Его вероятность становится известна только после наблюдения
    - Информация определяется длиной сообщения, а оно слишком короткое
