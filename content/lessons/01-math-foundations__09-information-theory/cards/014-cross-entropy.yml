- concept: кросс-энтропия усредняет величины −log q(x) с весами истинного распределения P
  question: Для двух исходов заданы P = (0.65, 0.35) и Q = (0.72, 0.28). Чему примерно равна H(P, Q), если используется натуральный логарифм?
  explanation: H(P, Q) = −0.65 ln(0.72) − 0.35 ln(0.28) ≈ 0.659 ната. Вероятности из P задают веса, а логарифмы берутся от вероятностей модели Q.
  kind: numeric
  answer: 0.659
  tolerance: 0.002
  id: 014-cross-entropy-1
  fingerprint: bdefb1cb
- concept: при фиксированном истинном распределении кросс-энтропия минимальна, когда предсказанное распределение совпадает с истинным
  question: При каком условии H(P, Q) достигает минимального возможного значения для фиксированного P?
  explanation: Если Q = P, то H(P, Q) = H(P). Расхождение между распределениями добавляет лишние затраты кодирования, поэтому кросс-энтропия становится больше.
  kind: choice
  options:
    - Q совпадает с P
    - Q назначает всем исходам одинаковые вероятности
    - Q назначает максимальную вероятность самому редкому исходу P
    - Q перестаёт зависеть от P
