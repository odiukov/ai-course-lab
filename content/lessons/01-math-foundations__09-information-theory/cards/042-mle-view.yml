- concept: суммарная кросс-энтропия по выборке равна отрицательному логарифму правдоподобия данных
  question: Модель назначает верному классу каждого обучающего объекта вероятность q(y_i). Какое выражение связывает кросс-энтропийную потерю с правдоподобием всей выборки при независимости объектов?
  explanation: Правдоподобие независимых наблюдений равно произведению вероятностей верных классов. Логарифм превращает произведение в сумму, поэтому его отрицание совпадает с суммарной кросс-энтропией. Следовательно, минимизация этой потери максимизирует правдоподобие.
  kind: choice
  options:
    - −log(∏_i q(y_i)) = −∑_i log q(y_i)
    - log(∑_i q(y_i)) = ∏_i log q(y_i)
    - −∏_i log q(y_i) = ∑_i q(y_i)
  correct: 0
  id: 042-mle-view-1
  fingerprint: 6dc84bd6
- concept: логарифм заменяет численно неустойчивое произведение вероятностей устойчивой суммой без изменения оптимальной модели
  question: При вычислении правдоподобия большой выборки произведение множества малых вероятностей округляется до нуля. Как сохранить ту же цель оптимизации и избежать этого эффекта?
  explanation: Логарифм строго возрастает, поэтому модель с большим правдоподобием имеет и больший логарифм правдоподобия. Равенство log(∏_i q(y_i)) = ∑_i log q(y_i) заменяет неустойчивое произведение устойчивой суммой.
  kind: choice
  options:
    - Суммировать логарифмы вероятностей верных классов
    - Суммировать сами вероятности верных классов
    - Перемножать логиты до применения softmax
    - Выбирать только наибольшую вероятность в выборке
  correct: 0
