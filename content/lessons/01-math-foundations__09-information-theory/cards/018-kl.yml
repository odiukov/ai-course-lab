- concept: KL-дивергенция вычисляется как среднее логарифмическое отношение вероятностей P и Q
  question: Для двух исходов заданы распределения P = (3/4, 1/4) и Q = (1/2, 1/2). Используя логарифм по основанию 2, вычислите D_KL(P || Q) в битах.
  explanation: D_KL(P || Q) = (3/4)·log₂((3/4)/(1/2)) + (1/4)·log₂((1/4)/(1/2)) ≈ 0.189 бита. Это средняя переплата за использование Q вместо P.
  kind: numeric
  answer: 0.189
  tolerance: 0.002
  id: 018-kl-1
  fingerprint: 274147ec
- concept: KL-дивергенция зависит от направления и не является метрикой расстояния
  question: Какое утверждение о смене местами распределений P и Q верно?
  explanation: В D_KL(P || Q) усреднение выполняется с весами P, а внутри логарифма стоит отношение p(x)/q(x). При смене P и Q меняются и веса, и отношение, поэтому результаты обычно различны. Из-за этой несимметричности KL-дивергенция не является метрикой.
  kind: choice
  options:
    - D_KL(P || Q) всегда равна D_KL(Q || P)
    - D_KL(P || Q) и D_KL(Q || P) в общем случае различаются
    - После смены распределений местами KL-дивергенция обязательно становится отрицательной
    - Меньшая из двух направленных KL-дивергенций всегда равна энтропии P
  correct: 1
  id: 018-kl-2
  fingerprint: 9238240a
