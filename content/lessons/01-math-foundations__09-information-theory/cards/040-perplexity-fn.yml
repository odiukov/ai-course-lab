- concept: при сопоставимой оценке меньшая perplexity означает более уверенные и точные предсказания модели
  question: Две языковые модели оценили на одном и том же корпусе с одинаковой токенизацией. У модели A perplexity ниже, чем у модели B. Какой вывод верен?
  explanation: Perplexity — монотонное преобразование cross-entropy. Поэтому меньшая perplexity соответствует меньшей ошибке и меньшей средней неопределённости модели.
  kind: choice
  options:
    - Модель A в среднем лучше предсказывает следующие токены
    - Модель A использует больший словарь
    - Модель B всегда генерирует более разнообразный текст
  correct: 0
  id: 040-perplexity-fn-1
  fingerprint: 8d806a71
- concept: perplexity всегда положительна и достигает минимума у идеально уверенной модели
  question: Почему perplexity не может быть равна нулю и при каком предсказании она достигает минимального значения?
  explanation: 'Cross-entropy неотрицательна, поэтому её экспонента не меньше 1. Нулевая cross-entropy означает отсутствие неопределённости: модель точно знает правильный следующий токен.'
  kind: open
  reference: Экспонента любого конечного значения положительна. Минимум достигается при нулевой cross-entropy, когда модель присваивает наблюдаемому следующему токену вероятность 1; тогда perplexity равна 1.
  id: 040-perplexity-fn-2
  fingerprint: 74c111db
