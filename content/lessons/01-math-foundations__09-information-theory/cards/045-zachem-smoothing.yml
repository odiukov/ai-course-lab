- concept: нулевая кросс-энтропия для one-hot цели является инфимумом, а не достижимым минимумом при конечных логитах
  question: Почему softmax-модель с конечными логитами не может получить в точности нулевую кросс-энтропию на примере с one-hot меткой?
  explanation: У one-hot цели loss равен отрицательному логарифму вероятности верного класса. Конечный softmax не выдаёт точную единичную вероятность, поэтому loss может сколь угодно приближаться к нулю, но не достигать его.
  kind: open
  reference: Для нулевой кросс-энтропии вероятность верного класса должна быть в точности единичной. При конечных логитах softmax оставляет остальным классам положительные вероятности, поэтому вероятность верного класса лишь приближается к единичной. Нулевой loss достигается только в пределе при бесконечном разрыве логитов.
  id: 045-zachem-smoothing-1
  fingerprint: 6b00b625
- concept: равномерная составляющая label smoothing напрямую штрафует чрезмерно концентрированные предсказания
  question: Два предсказания имеют один и тот же наиболее вероятный класс, но первое почти всю вероятность отдаёт ему, а второе оставляет заметную вероятность остальным классам. Как равномерная составляющая loss при label smoothing сравнит эти предсказания?
  explanation: Равномерная составляющая усредняет отрицательные логарифмы вероятностей всех классов. Почти нулевые вероятности резко увеличивают этот штраф, поэтому label smoothing препятствует чрезмерно острым и плохо откалиброванным предсказаниям.
  kind: choice
  options:
    - Даст им одинаковый штраф, поскольку наиболее вероятный класс совпадает
    - Сильнее оштрафует первое предсказание из-за очень малых вероятностей остальных классов
    - Сильнее оштрафует второе предсказание, потому что оно менее уверенно
    - Не повлияет на loss, поскольку зависит только от энтропии метки
  correct: 1
  id: 045-zachem-smoothing-2
  fingerprint: e939eecc
