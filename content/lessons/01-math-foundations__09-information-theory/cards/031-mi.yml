- concept: отбор признаков выполняется ранжированием по взаимной информации с целевой переменной
  question: Расположи действия для отбора признаков с помощью взаимной информации в правильном порядке.
  explanation: Сначала каждый признак оценивают по количеству информации о цели, затем признаки ранжируют и выбирают наиболее информативные.
  kind: order
  items:
    - Вычислить I(X_i;Y) для каждого признака X_i
    - Отсортировать признаки по убыванию полученной взаимной информации
    - Оставить первые k признаков из ранжированного списка
