- concept: взаимная информация применима к категориальным признакам и целям
  question: Признак и целевая переменная заданы категориями без естественного числового порядка. Какой метод непосредственно подходит для оценки их статистической зависимости?
  explanation: Взаимную информацию можно вычислять по совместным и маргинальным вероятностям категорий. Пирсону нужны числовые значения, а Спирмену — как минимум осмысленный порядок категорий.
  kind: choice
  options:
    - Корреляция Пирсона
    - Корреляция Спирмена
    - Взаимная информация
    - Евклидово расстояние
