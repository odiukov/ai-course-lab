- concept: условная энтропия равна совместной энтропии за вычетом энтропии известной переменной
  question: Совместная энтропия признака X и метки Y равна 3.7 бита, а энтропия X — 2.4 бита. Чему равна H(Y|X)?
  explanation: По формуле H(Y|X) = H(X,Y) − H(X). Поэтому 3.7 − 2.4 = 1.3 бита неопределённости о Y остаётся после наблюдения X.
  kind: numeric
  answer: 1.3
  tolerance: 0.01
  id: 026-conditional-1
  fingerprint: 231af1a0
- concept: независимый признак не уменьшает неопределённость о метке
  question: Признак X статистически независим от метки Y. Как соотносятся H(Y|X) и H(Y)?
  explanation: 'При независимости наблюдение X ничего не сообщает о Y, поэтому неопределённость о метке не меняется: H(Y|X) = H(Y).'
  kind: choice
  options:
    - H(Y|X) равна H(Y)
    - H(Y|X) меньше H(Y)
    - H(Y|X) больше H(Y)
  correct: 0
  id: 026-conditional-2
  fingerprint: 2a6729f3
- concept: дерево решений предпочитает признак с наименьшей условной энтропией метки
  question: Дерево решений сравнивает несколько признаков для очередного разбиения. Как с помощью условной энтропии выбрать лучший признак и почему?
  explanation: Чем меньше H(Y|X), тем больше неопределённости о метке устраняет разбиение по X. Поэтому минимальная условная энтропия соответствует наиболее информативному признаку.
  kind: open
  reference: 'Нужно выбрать признак X, для которого H(Y|X) минимальна: после наблюдения такого признака остаётся меньше всего неопределённости о метке Y.'
  id: 026-conditional-3
  fingerprint: 2606fbac
