<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Три пути к ложному согласию</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: ivory;
      --panel: white;
      --ink: midnightblue;
      --muted: slategray;
      --line: steelblue;
      --arrow: darkorange;
      --wrong: firebrick;
      --wrong-soft: mistyrose;
      --model-soft: lavender;
      --summary: aliceblue;
      --seal: seagreen;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: darkslategray;
        --panel: midnightblue;
        --ink: whitesmoke;
        --muted: lightgray;
        --line: lightskyblue;
        --arrow: orange;
        --wrong: salmon;
        --wrong-soft: maroon;
        --model-soft: indigo;
        --summary: darkslateblue;
        --seal: lightgreen;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: initial;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .diagram {
      width: 100%;
      background: var(--page);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    h1 {
      margin: initial;
      padding: 14px 18px;
      font-size: 24px;
      text-align: center;
      background: var(--summary);
      border-bottom: 1px solid var(--line);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--page);
    }

    .panel {
      fill: var(--panel);
      stroke: var(--line);
      stroke-width: 1px;
    }

    .node {
      fill: var(--summary);
      stroke: var(--line);
      stroke-width: 2px;
    }

    .model {
      fill: var(--model-soft);
      stroke: var(--line);
      stroke-width: 2px;
    }

    .agent {
      fill: var(--panel);
      stroke: var(--line);
      stroke-width: 2px;
    }

    .vote {
      fill: var(--wrong-soft);
      stroke: var(--wrong);
      stroke-width: 2px;
    }

    .summary {
      fill: var(--summary);
      stroke: var(--line);
      stroke-width: 2px;
    }

    .path {
      fill: none;
      stroke: var(--arrow);
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .arrow-head {
      fill: var(--arrow);
      stroke: var(--arrow);
      stroke-width: 1px;
      stroke-linejoin: round;
    }

    .heading {
      fill: var(--ink);
      font-size: 18px;
      font-weight: bold;
    }

    .subheading {
      fill: var(--muted);
      font-size: 14px;
    }

    .body {
      fill: var(--ink);
      font-size: 15px;
    }

    .small {
      fill: var(--muted);
      font-size: 14px;
    }

    .arrow-label {
      fill: var(--arrow);
      font-size: 14px;
      font-weight: bold;
    }

    .wrong-label {
      fill: var(--wrong);
      font-size: 16px;
      font-weight: bold;
    }

    .seal {
      fill: var(--panel);
      stroke: var(--seal);
      stroke-width: 2px;
    }

    .seal-mark {
      fill: var(--seal);
      font-size: 16px;
      font-weight: bold;
    }

    .summary-main {
      fill: var(--ink);
      font-size: 16px;
      font-weight: bold;
    }

    .summary-note {
      fill: var(--muted);
      font-size: 15px;
    }

    .fallback {
      padding: 18px;
      font-size: 16px;
      background: var(--page);
      color: var(--ink);
    }
  </style>
</head>
<body>
  <main class="diagram">
    <h1>Три пути к ложному согласию</h1>

    <svg
      id="scheme"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 1200 450"
      width="1200"
      height="450"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Три пути к ложному согласию</title>
      <desc id="svg-desc">
        Три колонки сравнивают намеренного лжеца, агента, копирующего
        последний голос, и трёх агентов одной модели с общей ошибкой.
      </desc>
      <g id="drawing"></g>
    </svg>

    <div id="fallback" class="fallback" hidden>
      Схема должна была показать три пути к подписанному неверному голосу:
      намеренную ложь, копирование последнего голоса и общую ошибку трёх
      агентов одной базовой модели.
    </div>

    <noscript>
      <div class="fallback">
        Схема показывает три пути к ложному согласию: намеренную ложь,
        копирование чужого голоса и общую ошибку агентов одной модели.
      </div>
    </noscript>
  </main>

  <script>
    const diagramData = [{
      ns: "http://www.w3.org/2000/svg",
      zero: 0,
      math: {
        half: 0.5
      },
      arrow: {
        size: 11,
        wing: 0.48
      },
      radius: {
        panel: 16,
        node: 12,
        card: 12,
        seal: 17,
        smallSeal: 12
      },
      panels: [
        {
          x: 25, y: 58, w: 350, h: 308,
          headingX: 200, headingY: 29, subheadingY: 49,
          heading: ["Намеренная ложь"],
          subheading: ["один агент"]
        },
        {
          x: 425, y: 58, w: 350, h: 308,
          headingX: 600, headingY: 29, subheadingY: 49,
          heading: ["Копирование"],
          subheading: ["один агент, повторяющий последний голос"]
        },
        {
          x: 825, y: 58, w: 350, h: 308,
          headingX: 1000, headingY: 29, subheadingY: 49,
          heading: ["Общая ошибка"],
          subheading: ["три агента одной базовой модели"]
        }
      ],
      first: {
        knowledge: {
          x: 75, y: 80, w: 250, h: 58,
          textX: 200,
          lines: [
            { y: 105, text: "Знает правильный ответ", cls: "body" },
            { y: 126, text: "и понимает, что он верен", cls: "small" }
          ]
        },
        choice: {
          x: 75, y: 174, w: 250, h: 55,
          textX: 200,
          lines: [
            { y: 199, text: "Намеренно выбирает", cls: "body" },
            { y: 219, text: "другой ответ", cls: "small" }
          ]
        },
        arrows: [
          {
            x1: 200, y1: 138, x2: 200, y2: 174,
            labelX: 185, labelY: 160,
            label: ["искажает"], anchor: "end"
          },
          {
            x1: 200, y1: 229, x2: 200, y2: 276,
            labelX: 185, labelY: 257,
            label: ["подписывает"], anchor: "end"
          }
        ]
      },
      second: {
        observed: {
          x: 475, y: 80, w: 250, h: 58,
          textX: 600,
          lines: [
            { y: 105, text: "Последний голос:", cls: "body" },
            { y: 127, text: "неверный ответ", cls: "wrong-label" }
          ]
        },
        copier: {
          x: 475, y: 174, w: 250, h: 55,
          textX: 600,
          lines: [
            { y: 199, text: "Присоединяется", cls: "body" },
            { y: 219, text: "к увиденной позиции", cls: "small" }
          ]
        },
        arrows: [
          {
            x1: 600, y1: 138, x2: 600, y2: 174,
            labelX: 585, labelY: 160,
            label: ["видит и копирует"], anchor: "end"
          },
          {
            x1: 600, y1: 229, x2: 600, y2: 276,
            labelX: 585, labelY: 249,
            label: ["нового свидетельства"], anchor: "end",
            extraY: 264, extra: ["не добавляет"]
          }
        ]
      },
      third: {
        model: {
          x: 870, y: 80, w: 260, h: 58,
          textX: 1000,
          lines: [
            { y: 104, text: "Одна базовая модель", cls: "body" },
            { y: 126, text: "одна галлюцинация", cls: "wrong-label" }
          ]
        },
        agents: [
          { x: 840, y: 176, w: 80, h: 39, textX: 880, textY: 201 },
          { x: 960, y: 176, w: 80, h: 39, textX: 1000, textY: 201 },
          { x: 1080, y: 176, w: 80, h: 39, textX: 1120, textY: 201 }
        ],
        fan: [
          { x1: 1000, y1: 138, x2: 880, y2: 176 },
          { x1: 1000, y1: 138, x2: 1000, y2: 176 },
          { x1: 1000, y1: 138, x2: 1120, y2: 176 }
        ],
        votes: [
          { x1: 880, y1: 215, x2: 930, y2: 276 },
          { x1: 1000, y1: 215, x2: 1000, y2: 276 },
          { x1: 1120, y1: 215, x2: 1070, y2: 276 }
        ]
      },
      cards: [
        {
          x: 55, y: 276, w: 290, h: 76,
          textX: 77, titleY: 307, noteY: 333,
          title: ["Неверный голос"],
          note: ["подпись настоящая"],
          seals: [{ x: 310, y: 314, r: 17 }]
        },
        {
          x: 455, y: 276, w: 290, h: 76,
          textX: 477, titleY: 307, noteY: 333,
          title: ["Неверный голос"],
          note: ["подпись настоящая"],
          seals: [{ x: 710, y: 314, r: 17 }]
        },
        {
          x: 855, y: 276, w: 290, h: 76,
          textX: 877, titleY: 307, noteY: 333,
          title: ["Неверный голос"],
          note: ["три настоящие подписи"],
          seals: [
            { x: 1069, y: 314, r: 12 },
            { x: 1100, y: 314, r: 12 },
            { x: 1131, y: 314, r: 12 }
          ]
        }
      ],
      summary: {
        x: 25, y: 382, w: 1150, h: 56,
        textX: 600,
        lines: [
          {
            y: 406,
            text: "Снаружи след почти одинаков: подписанный неверный голос",
            cls: "summary-main"
          },
          {
            y: 428,
            text: "BFT видит подписи и совместимость — но не причину мнения",
            cls: "summary-note"
          }
        ]
      }
    }];

    const [D] = diagramData;
    const origin = { x: 0, y: 0 };
    const scale = { x: 1, y: 1 };
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const root = document.getElementById("drawing");

      function element(name, attrs, cls) {
        const node = document.createElementNS(D.ns, name);
        if (cls) node.setAttribute("class", cls);
        Object.entries(attrs).forEach(([key, value]) => {
          node.setAttribute(key, value);
        });
        root.appendChild(node);
        return node;
      }

      function roundedRect(item, cls, radius) {
        return element("rect", {
          x: sx(item.x),
          y: sy(item.y),
          width: sx(item.x + item.w) - sx(item.x),
          height: sy(item.y + item.h) - sy(item.y),
          rx: sx(radius) - sx(D.zero),
          ry: sy(radius) - sy(D.zero)
        }, cls);
      }

      function label(x, y, content, cls, anchor) {
        const node = element("text", {
          x: sx(x),
          y: sy(y),
          "text-anchor": anchor,
          "dominant-baseline": "alphabetic"
        }, cls);
        node.textContent = content;
        return node;
      }

      function labels(x, lines, anchor) {
        lines.forEach(line => {
          label(x, line.y, line.text, line.cls, anchor);
        });
      }

      function arrow(item) {
        element("line", {
          x1: sx(item.x1),
          y1: sy(item.y1),
          x2: sx(item.x2),
          y2: sy(item.y2)
        }, "path");

        const angle = Math.atan2(item.y2 - item.y1, item.x2 - item.x1);
        const leftX = item.x2 - D.arrow.size *
          Math.cos(angle - D.arrow.wing);
        const leftY = item.y2 - D.arrow.size *
          Math.sin(angle - D.arrow.wing);
        const rightX = item.x2 - D.arrow.size *
          Math.cos(angle + D.arrow.wing);
        const rightY = item.y2 - D.arrow.size *
          Math.sin(angle + D.arrow.wing);

        element("polygon", {
          points: [
            sx(item.x2) + "," + sy(item.y2),
            sx(leftX) + "," + sy(leftY),
            sx(rightX) + "," + sy(rightY)
          ].join(" ")
        }, "arrow-head");

        if (item.label) {
          label(
            item.labelX,
            item.labelY,
            item.label.join(" "),
            "arrow-label",
            item.anchor
          );
        }

        if (item.extra) {
          label(
            item.labelX,
            item.extraY,
            item.extra.join(" "),
            "arrow-label",
            item.anchor
          );
        }
      }

      function node(item, cls) {
        roundedRect(item, cls, D.radius.node);
        labels(item.textX, item.lines, "middle");
      }

      function seal(item) {
        element("circle", {
          cx: sx(item.x),
          cy: sy(item.y),
          r: sx(item.r) - sx(D.zero)
        }, "seal");
        label(
          item.x,
          item.y + item.r * D.math.half,
          "✓",
          "seal-mark",
          "middle"
        );
      }

      D.panels.forEach(panel => {
        roundedRect(panel, "panel", D.radius.panel);
        label(
          panel.headingX,
          panel.headingY,
          panel.heading.join(" "),
          "heading",
          "middle"
        );
        label(
          panel.headingX,
          panel.subheadingY,
          panel.subheading.join(" "),
          "subheading",
          "middle"
        );
      });

      D.first.arrows.forEach(arrow);
      D.second.arrows.forEach(arrow);
      D.third.fan.forEach(arrow);
      D.third.votes.forEach(arrow);

      node(D.first.knowledge, "node");
      node(D.first.choice, "node");
      node(D.second.observed, "node");
      node(D.second.copier, "node");
      node(D.third.model, "model");

      D.third.agents.forEach(agent => {
        roundedRect(agent, "agent", D.radius.node);
        label(
          agent.textX,
          agent.textY,
          "агент",
          "body",
          "middle"
        );
      });

      D.cards.forEach(card => {
        roundedRect(card, "vote", D.radius.card);
        label(
          card.textX,
          card.titleY,
          card.title.join(" "),
          "wrong-label",
          "start"
        );
        label(
          card.textX,
          card.noteY,
          card.note.join(" "),
          "small",
          "start"
        );
        card.seals.forEach(seal);
      });

      roundedRect(D.summary, "summary", D.radius.card);
      labels(D.summary.textX, D.summary.lines, "middle");
    } catch (error) {
      document.getElementById("scheme").hidden = true;
      document.getElementById("fallback").hidden = false;
    }
  </script>
</body>
</html>
