- concept: длина входа, стоимость и воспроизводимость задают компромисс между длинноконтекстной LLM и специализированной моделью
  question: Нужно суммаризировать несколько длинных документов совместно. Почему инженер может выбрать длинноконтекстную LLM, а при ограниченном бюджете или требовании стабильного выхода — специализированную модель?
  explanation: Контекст LLM может достигать десятков тысяч токенов, тогда как BART-large-CNN ограничен примерно 1024 токенами. Поэтому LLM удобнее для многодокументной суммаризации, но специализированные модели остаются полезны при дефиците вычислений и строгих требованиях к стабильности.
  kind: open
  reference: Длинноконтекстная LLM способна увидеть несколько документов целиком и учитывать связи между ними, тогда как специализированная модель может не вместить весь вход. За это преимущество LLM приходится платить большей стоимостью и меньшей воспроизводимостью формулировок; специализированные модели дешевле и стабильнее, но длинный вход приходится сокращать или делить.
