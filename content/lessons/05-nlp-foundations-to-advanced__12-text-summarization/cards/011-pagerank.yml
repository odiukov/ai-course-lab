- concept: итерации PageRank продолжаются до приближения оценок к неподвижной точке
  question: Почему для ранжирования предложений PageRank обычно выполняет несколько обновлений оценок и по какому признаку итерации можно остановить?
  explanation: 'Одного обмена недостаточно: изменившиеся оценки порождают другие вклады на следующей итерации. В реализации урока сходимость проверяется по максимальному изменению оценки и сравнивается с epsilon.'
  kind: open
  reference: Новое обновление меняет оценки узлов, а значит, и размеры их вкладов соседям на следующем круге. Итерации останавливают, когда различия между новыми и предыдущими оценками становятся меньше заданного порога.
  id: 011-pagerank-3
  fingerprint: bdb7be37
