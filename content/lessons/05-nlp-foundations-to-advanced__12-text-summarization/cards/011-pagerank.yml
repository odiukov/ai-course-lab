- concept: исходящий вклад PageRank распределяется пропорционально весам рёбер
  question: Узел с оценкой 20 имеет два исходящих ребра весом 9 и 11. Коэффициент затухания равен 0,6. Какой вклад получит сосед по ребру весом 11?
  explanation: Для передачи доступно 20 × 0,6 = 12. Доля ребра равна 11 / (9 + 11), поэтому вклад составляет 12 × 11 / 20 = 6,6. В уроке аналогично распределялись 1,7 балла пропорционально весам рёбер.
  kind: numeric
  answer: 6.6
  tolerance: 0.01
  id: 011-pagerank-1
  fingerprint: 3eed0e8a
- concept: базовая оценка поддерживает ненулевой вес каждого узла
  question: Зачем при каждом обновлении PageRank добавляет каждому узлу базовую оценку независимо от входящих рёбер?
  explanation: Базовый член не зависит от входящих связей и сохраняет положительную оценку даже у слабо связанного узла. При коэффициенте затухания 0,85 в уроке этот член равен 0,15.
  kind: choice
  options:
    - Чтобы узел без достаточных входящих вкладов не исчезал из расчёта полностью
    - Чтобы все рёбра после обновления получили одинаковый вес
    - Чтобы итоговая оценка зависела только от числа слов в предложении
    - Чтобы алгоритм всегда завершался после первого обновления
  correct: 0
  id: 011-pagerank-2
