- concept: BERTScore оценивает семантическое соответствие через сопоставление контекстных эмбеддингов токенов
  question: Как BERTScore обнаруживает сходство между эталонной и системной выжимками, если они используют разные слова?
  explanation: BERTScore сравнивает контекстные представления токенов, поэтому может сблизить синонимы и перефразирования даже без буквального совпадения слов.
  kind: choice
  options:
    - Сопоставляет контекстные эмбеддинги токенов и находит наиболее близкие пары
    - Подсчитывает только совпадающие последовательности токенов
    - Оценивает вероятность генерации выжимки по исходному документу
    - Проверяет логическое следование каждого утверждения из источника
  correct: 0
  id: 030-semantic-metrics-1
  fingerprint: c1713b84
- concept: BARTScore интерпретирует качество выжимки как её условную вероятность при заданном исходном тексте
  question: Заполните пропуск в краткой формулировке принципа BARTScore.
  explanation: BARTScore использует предобученную генеративную модель и оценивает вероятность токенов выжимки при условии источника. Поэтому на оценку влияют и содержание, и естественность формулировки для модели.
  kind: cloze
  template: Чем выше ___, тем более правдоподобной BART считает выжимку при данном исходном тексте.
  answer: p(выжимка | исходный текст)
  accept:
    - условная вероятность выжимки при исходном тексте
    - вероятность выжимки при условии исходного текста
    - p(summary | source)
  id: 030-semantic-metrics-2
  fingerprint: ff9e9135
- concept: MoverScore измеряет семантическое расхождение как минимальную стоимость переноса между распределениями контекстных представлений
  question: Упорядочьте высокоуровневые этапы вычисления MoverScore.
  explanation: MoverScore применяет идею Earth Mover Distance к контекстным представлениям. Близкие по смыслу фрагменты требуют дешёвого переноса, а серьёзное смысловое расхождение увеличивает минимальную стоимость.
  kind: order
  items:
    - Получить контекстные представления смысловых единиц обоих текстов
    - Задать стоимость переноса между единицами на основе расстояний их представлений
    - Найти перенос смысловой массы с минимальной суммарной стоимостью
  id: 030-semantic-metrics-3
  fingerprint: 567c6400
