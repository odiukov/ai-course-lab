- concept: сопоставимая стоимость суммаризатора вычисляется в расчёте на одну выжимку
  question: Обработка 81 документа суммаризатором стоила 54 рубля. Какова средняя стоимость одной выжимки в рублях?
  explanation: 'Нужно разделить полную стоимость на число результатов: 54 / 81 ≈ 0.67 рубля за выжимку. Такая нормировка позволяет сравнивать эксперименты разного масштаба.'
  kind: numeric
  answer: 0.67
  tolerance: 0.01
