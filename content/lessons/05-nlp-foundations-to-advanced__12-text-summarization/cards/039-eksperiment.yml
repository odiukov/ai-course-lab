- concept: выбор суммаризатора является многокритериальным решением по качеству, фактичности и стоимости
  question: Объясните своими словами, почему суммаризатор с лучшим ROUGE-L не обязательно является лучшим вариантом для production.
  explanation: Высокое лексическое сходство с эталоном не исключает выдуманных или искажённых фактов. Кроме того, небольшой выигрыш в качестве может не оправдывать существенно более высокую стоимость.
  kind: open
  reference: ROUGE-L отражает близость к эталонной выжимке, но не гарантирует фактическую верность и не учитывает стоимость. Выбирать модель следует по приемлемому для задачи сочетанию качества, фактичности и цены обработки.
