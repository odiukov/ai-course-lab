- concept: новое неподтверждённое отношение между упомянутыми сущностями является выдуманным фактом
  question: Источник отдельно упоминает директора и совет компании, но ничего не говорит об их решении. Выжимка утверждает, что директор получил одобрение совета. Как точнее классифицировать ошибку?
  explanation: Все сущности могут присутствовать в источнике, но связь «совет одобрил решение директора» там не подтверждается. Выжимка изобрела новый факт, поэтому это fact invention, а не подмена сущности.
  kind: choice
  options:
    - Entity swap
    - Number drift
    - Polarity flip
    - Fact invention
  correct: 3
  id: 032-hallucination-types-1
  fingerprint: 1d111fea
- concept: дословная сверка сущностей и чисел не обнаруживает все виды фактических ошибок
  question: Почему проверка того, что все имена и числа из выжимки дословно встречаются в источнике, недостаточна для полной проверки фактической верности?
  explanation: Совпадение имён и чисел проверяет лишь отдельные элементы утверждения. Для полной проверки нужно также установить, сохранён ли смысл высказывания и подтверждается ли источником сам заявленный факт.
  kind: open
  reference: Такая проверка помогает находить entity swap и number drift, но может пропустить polarity flip, если выжимка меняет направление или смысл утверждения, а также fact invention, если она создаёт неподтверждённую связь между уже упомянутыми сущностями.
  id: 032-hallucination-types-2
  fingerprint: 76f8f45f
