- concept: F1 ROUGE-L объединяет покрытие системной и эталонной выжимок гармоническим средним
  question: В системной выжимке 13 токенов, в эталоне 17 токенов, а длина их LCS равна 11. Чему примерно равна F1 ROUGE-L?
  explanation: 'Precision равен 11/13 ≈ 0,846, а recall — 11/17 ≈ 0,647. Их гармоническое среднее составляет примерно 0,733: высокий результат по одной стороне не скрывает более слабый результат по другой.'
  kind: numeric
  answer: 0.733
  tolerance: 0.005
  id: 025-rouge-l-teoriya-2
  fingerprint: 011d2c64
