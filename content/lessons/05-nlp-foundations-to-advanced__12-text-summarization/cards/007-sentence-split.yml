- concept: положительный просмотр назад позволяет разделить текст по пробелам после конечной пунктуации, сохранив сам знак
  question: Заполни регулярное выражение так, чтобы функция разделяла текст по пробельным промежуткам после точки, восклицательного или вопросительного знака, не удаляя эти знаки.
  explanation: Конструкция (?<=[.!?]) проверяет знак слева, но не включает его в разделитель. Поэтому re.split удаляет только совпавший с \s+ пробельный промежуток, а пунктуация остаётся в предложении.
  kind: cloze
  template: return re.split(r"___", text.strip())
  answer: (?<=[.!?])\s+
  accept:
    - (?<=[.?!])\s+
    - (?<=[?!.])\s+
  id: 007-sentence-split-1
  fingerprint: b17735a0
- concept: точка инициирует разделение только тогда, когда после неё находится пробельный промежуток
  question: Что вернёт функция re.split(r"(?<=[.!?])\s+", text.strip()) для строки «Релиз vA.B готов. Продолжаем?»?
  explanation: После точки между A и B нет пробела, поэтому она не образует место разделения. Пробельный промежуток после слова «готов.» удовлетворяет регулярному выражению и разделяет строку.
  kind: choice
  options:
    - '["Релиз vA.B готов.", "Продолжаем?"]'
    - '["Релиз vA.", "B готов.", "Продолжаем?"]'
    - '["Релиз vA.B готов. Продолжаем?"]'
  correct: 0
  id: 007-sentence-split-2
  fingerprint: 49f90d8e
