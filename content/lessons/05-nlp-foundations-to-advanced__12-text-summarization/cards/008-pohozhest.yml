- concept: при нормировке похожести длину предложения считают по всем токенам, включая повторы
  question: Почему в знаменателе функции похожести TextRank следует использовать число всех слов предложения, а не число различных слов?
  explanation: В исходной формуле Михалчи и Тарау длина — это количество слов с учётом повторов. Замена длины размером словаря недооценивает объём предложений с повторениями и завышает веса их связей.
  kind: open
  reference: Повторяющиеся слова тоже увеличивают длину предложения. Если учитывать только различные слова, многословное предложение с повторами получит слишком маленький знаменатель, а его похожесть будет искусственно завышена.
  id: 008-pohozhest-2
  fingerprint: 23fb80f4
