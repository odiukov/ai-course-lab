- concept: ранний возврат всех предложений, если число кандидатов не превышает лимит резюме
  question: Что должна сделать textrank_summary, если после разбиения текста число предложений не превышает top_k?
  explanation: Если все найденные предложения помещаются в заданный лимит, исключать нечего. Ранний возврат сохраняет их все и позволяет не строить матрицу похожести и не запускать итерации TextRank.
  kind: choice
  options:
    - Вернуть весь список предложений без ранжирования
    - Дополнить список копиями предложений до top_k
    - Вернуть пустой список
    - Всё равно вычислить TextRank и оставить только предложение с наибольшей оценкой
  correct: 0
  id: 014-textrank-summary-1
  fingerprint: c48afc68
- concept: оценки TextRank позиционно соответствуют исходным предложениям
  question: Заполни выражение, чтобы индексы предложений сортировались по убыванию их оценок TextRank.
  explanation: 'Элемент scores[i] содержит оценку предложения sentences[i]. Поэтому сортировать нужно индексы, используя соответствующую оценку как ключ: так выбранные индексы затем можно применить к исходному списку предложений.'
  kind: cloze
  template: 'ranked = sorted(range(len(scores)), key=lambda i: ___, reverse=True)[:top_k]'
  answer: scores[i]
  accept:
    - scores.__getitem__(i)
  id: 014-textrank-summary-2
  fingerprint: b6902788
