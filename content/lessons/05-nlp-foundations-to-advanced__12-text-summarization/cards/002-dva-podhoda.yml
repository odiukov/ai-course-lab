- concept: грамматическая корректность извлечённых предложений не гарантирует связность и полноту резюме
  question: Почему extractive-резюме может состоять из грамматически правильных предложений, но при этом быть фрагментарным или неполным? Объясни своими словами.
  explanation: Дословное извлечение сохраняет локальную корректность исходных предложений, но не создаёт новые переходы и не объединяет сведения, разбросанные по документу. Поэтому грамматичность отдельных фрагментов не равна связности и полноте всего резюме.
  kind: open
  reference: Каждое предложение остаётся грамматически правильным, поскольку дословно взято из источника. Однако выбор предложений по отдельности может пропустить смысл, распределённый между разными частями документа, а соседние выбранные фрагменты могут плохо соединяться друг с другом.
