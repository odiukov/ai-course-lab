- concept: стемминг нормализует токены до поиска совпадений, не меняя формулы ROUGE
  question: Два запуска ROUGE сравнивают одни и те же эталонную и системную выжимки. Во втором запуске включён стемминг. Что именно меняется в вычислении?
  explanation: 'Стемминг меняет представление сравниваемых токенов: родственные формы могут стать одинаковыми. После этого совпадения, общая подпоследовательность и итоговые компоненты ROUGE вычисляются обычным способом.'
  kind: choice
  options:
    - Формы слов приводятся к основам до сопоставления, а правила подсчёта метрик остаются прежними
    - Системная выжимка сравнивается с исходным документом вместо эталонной выжимки
    - Точность совпадений заменяется классификационной accuracy
    - Из вычисления полностью исключаются последовательности из нескольких токенов
  correct: 0
  id: 028-stemming-1
  fingerprint: 4ea46646
- concept: стемминг может восстанавливать совпадения слов, биграмм и общей подпоследовательности
  question: В эталонной выжимке есть фрагмент «models predict», а в системной — «model predicted». Какие совпадения может восстановить стемминг?
  explanation: После сведения форм к основам оба фрагмента представляются одинаковой последовательностью токенов. Поэтому совпадение учитывается и на уровне отдельных слов, и как соседняя пара, и при поиске общей подпоследовательности.
  kind: choice
  options:
    - Совпадения отдельных слов, соседней пары слов и элементов общей подпоследовательности
    - Только совпадения отдельных слов
    - Только совпадение общей подпоследовательности
    - Никакие, поскольку стемминг применяется лишь после вычисления ROUGE
  correct: 0
