  fingerprint: 59c9aeef
- concept: нижняя граница длины препятствует преждевременному завершению генерации
  question: Зачем при абстрактивной суммаризации задавать min_length?
  explanation: min_length запрещает генератору завершить последовательность раньше заданной длины. В коде урока граница в 60 токенов снижает риск получить слишком короткую выжимку из одного предложения.
  kind: choice
  options:
    - Чтобы модель не завершила выжимку слишком рано
    - Чтобы модель копировала только предложения из источника
    - Чтобы автоматически проверить фактическую точность выжимки
    - Чтобы сократить исходный документ перед токенизацией
  correct: 0
