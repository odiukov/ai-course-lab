- concept: при совпадении текущих элементов LCS продлевает решение для префиксов без обоих этих элементов
  question: Объясни, почему при совпадении текущих слов в динамическом программировании для LCS используют диагональную клетку, а не клетку сверху или слева.
  explanation: Переход по диагонали одновременно отбрасывает текущий элемент каждой последовательности. Поэтому добавленное совпадение корректно продлевает уже найденную общую подпоследовательность.
  kind: open
  reference: Диагональная клетка хранит LCS для префиксов, из которых исключены оба текущих слова. Совпавшие слова можно добавить к этой подпоследовательности, увеличив её длину на единицу и не учитывая ни одно из слов повторно.
  id: 024-lcs-length-2
  fingerprint: fecca668
- concept: число внутренних состояний двумерного алгоритма LCS равно произведению длин входных последовательностей
  question: Вырази количество внутренних клеток, которые нужно вычислить в полной DP-таблице LCS.
  explanation: Каждой паре позиций входных последовательностей соответствует одна внутренняя клетка. Поэтому заполняется m·n состояний, а время работы и память полной таблицы имеют порядок O(mn).
  kind: cloze
  template: Если длины входных последовательностей равны m и n, количество заполняемых внутренних клеток равно ___.
  answer: m * n
  accept:
    - mn
    - m*n
    - n*m
    - n * m
    - m·n
