- concept: качественная суммаризация балансирует краткость и сохранение ключевого смысла
  question: Объясни своими словами, почему максимально короткий текст не обязательно является хорошим резюме.
  explanation: 'Суммаризация — это оптимизация под ограничение длины: лишние подробности удаляются, но смысловой каркас должен сохраниться. Поэтому минимальное число слов само по себе не служит критерием качества.'
  kind: open
  reference: Хорошее резюме должно не только сокращать объём, но и сохранять ключевые события, связи и оговорки, необходимые для понимания исходного текста. Чрезмерное сокращение делает результат малоинформативным.
