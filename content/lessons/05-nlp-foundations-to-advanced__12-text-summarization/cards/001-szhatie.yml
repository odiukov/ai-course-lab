- concept: содержание резюме зависит от цели его использования
  question: Почему два резюме одного документа с одинаковым ограничением по длине могут включать разные детали?
  explanation: Лимит задаёт объём, но не определяет, какие сведения важнее. Например, поисковое описание, рабочая сводка и учебный конспект решают разные задачи.
  kind: choice
  options:
