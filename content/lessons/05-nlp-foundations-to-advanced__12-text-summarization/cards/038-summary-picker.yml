- concept: обработка документа за пределами контекстного окна методом chunked map-reduce
  question: Расположи действия для суммаризации документа, который не помещается в контекстное окно модели.
  explanation: При chunked map-reduce сначала суммаризируют каждый фрагмент, а затем объединяют частичные результаты. Простая обрезка дешевле, но безвозвратно исключает часть документа.
  kind: order
  items:
    - Сравнить длину документа с контекстным окном модели
    - Разбить документ на помещающиеся в окно фрагменты
    - Получить отдельную выжимку для каждого фрагмента
    - Свести частичные выжимки в одно итоговое резюме
  id: 038-summary-picker-1
  fingerprint: 9af17057
- concept: допуск abstractive-суммаризации регулируемого контента только при наличии factuality gate
  question: Система должна пересказывать юридические договоры своими словами, но команда не может внедрить проверку фактической верности. Какое решение соответствует безопасной политике выбора суммаризатора?
  explanation: Юридический текст относится к регулируемому контенту, где неподтверждённая генерацией сущность, сумма или утверждение может иметь серьёзные последствия. ROUGE не заменяет factuality gate, поэтому abstractive-подход без такой проверки следует отклонить.
  kind: choice
  options:
    - Запустить abstractive-модель и контролировать качество только с помощью ROUGE
    - Отказаться от abstractive-подхода до появления factuality gate или выбрать extractive-суммаризацию
    - Обрезать каждый договор до контекстного окна и использовать abstractive-модель
    - Выбрать более крупную generative-модель без дополнительных проверок
  correct: 1
  id: 038-summary-picker-2
  fingerprint: 747aece3
