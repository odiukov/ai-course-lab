- concept: калибровка LLM-судьи сопоставляет его оценки с человеческой разметкой и настраивает процедуру оценивания
  question: Расположи этапы калибровки LLM-судьи для оценки выжимок в правильном порядке.
  explanation: Судью проверяют на размеченной людьми выборке, а не принимают его ответы как эталон. В материале для такой калибровки рекомендованы 50–100 выжимок; расхождения используют для настройки рубрики, примеров и порогов.
  kind: order
  items:
    - Задать рубрику и подготовить выжимки с человеческими оценками
    - Получить оценки LLM-судьи на той же выборке
    - Сопоставить оценки судьи с человеческими решениями
    - Уточнить рубрику, примеры и пороги по найденным расхождениям
    - Проверить устойчивость обновлённой шкалы перед применением в production
