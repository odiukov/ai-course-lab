- concept: раздельный анализ метрик позволяет установить причину слабой оценки суммаризатора
  question: Почему при production-оценке суммаризатора полезнее анализировать показатели по отдельности, чем сводить их в один средний балл?
  explanation: Одинаковый итоговый балл может получиться у моделей с совершенно разными дефектами. Раздельные метрики показывают, вызвана ли проблема перефразированием, искажением смысла, фактической ошибкой или низким качеством изложения.
  kind: open
  reference: 'Отдельные показатели диагностируют разные свойства: лексическое совпадение, сохранение смысла, фактическую точность, связность и беглость. Единый средний балл может скрыть критический провал одного свойства за счёт высоких значений других.'
