- concept: пересечение объектов Counter учитывает минимальную частоту каждого общего слова
  question: Заполни оператор так, чтобы получить мультимножественное пересечение токенов двух предложений.
  explanation: Оператор & для Counter оставляет общие ключи и назначает каждому из них меньшую частоту из двух счётчиков. Сумма значений даёт количество попарных совпадений с учётом повторов.
