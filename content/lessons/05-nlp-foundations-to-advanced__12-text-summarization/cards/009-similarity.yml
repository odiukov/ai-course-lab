  question: Почему перед делением в функции словесной похожести нужно отдельно проверить знаменатель, если оба предложения могут быть пустыми?
  explanation: Без защитной ветки деление завершится ошибкой. Возврат вещественного нуля задаёт корректное граничное поведение для пары без слов и совпадений.
