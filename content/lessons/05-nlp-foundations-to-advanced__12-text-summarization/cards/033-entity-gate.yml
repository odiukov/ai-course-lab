- concept: новые сущности выявляются разностью множеств сущностей выжимки и источника
  question: Какую операцию над множествами применяет простой entity-level factuality gate, чтобы найти подозрительные сущности?
  explanation: Из сущностей выжимки вычитают сущности источника. Оставшиеся имена, организации, даты и числа появились только в выжимке, поэтому требуют проверки.
  kind: cloze
  template: Подозрительные сущности = E_выжимки ___ E_источника
  answer: \
  accept:
    - −
    - '-'
    - разность множеств
    - set difference
  id: 033-entity-gate-1
  fingerprint: 96fe9ac7
- concept: точное сопоставление сущностей может давать ложные срабатывания из-за алиасов и разных написаний
  question: Источник упоминает «Международный валютный фонд», а выжимка — «МВФ». Как следует интерпретировать результат factuality gate, который сравнивает сущности только по точному написанию?
  explanation: При дословном сравнении «МВФ» отсутствует в источнике и будет помечено как новая сущность. Однако это сокращение того же названия, поэтому флаг означает необходимость проверки, а не доказанную галлюцинацию.
  kind: choice
  options:
    - Выжимка гарантированно содержит галлюцинацию
    - Gate не поднимет флаг, поскольку значения выражений совпадают
    - Gate поднимет флаг, но его нужно проверить с учётом сокращений и алиасов
  correct: 2
  id: 033-entity-gate-2
