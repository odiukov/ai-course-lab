- concept: пустая входная последовательность требует раннего возврата нулевых метрик ROUGE-L
  question: Заполни условие, которое предотвращает деление на длину пустой последовательности.
  explanation: Если эталон или системная выжимка пусты, нормировать длину LCS по одной из последовательностей нельзя. Ранний возврат нулевых метрик устраняет деление на ноль и явно задаёт поведение на границе.
  kind: cloze
  template: |-
    reference_tokens = reference.lower().split()
    system_tokens = system.lower().split()
    if ___:
        return dict.fromkeys(("precision", "recall", "f1"), float())
  answer: not reference_tokens or not system_tokens
  accept:
    - len(reference_tokens) == 0 or len(system_tokens) == 0
    - not reference_tokens or len(system_tokens) == 0
    - len(reference_tokens) == 0 or not system_tokens
  id: 026-rouge-l-1
  fingerprint: '24865703'
- concept: при отсутствии общей подпоследовательности все компоненты ROUGE-L должны быть нулевыми
  question: Эталон состоит из слов «alpha beta», а системная выжимка — из слов «gamma delta». Как должна повести себя корректная реализация ROUGE-L?
  explanation: У текстов нет общей подпоследовательности, поэтому длина LCS и обе доли совпадения нулевые. Перед вычислением гармонического среднего нужно проверить нулевую сумму precision и recall и вернуть нулевой F1.
  kind: choice
  options:
    - Вернуть нулевые precision, recall и F1
    - Вернуть максимальный precision, потому что системная выжимка непуста
    - Вернуть максимальный recall, потому что эталон непуст
    - Сообщить об ошибке деления при вычислении F1
  correct: 0
