- concept: границы предложений определяют узлы графа и неделимые кандидаты на извлечение в TextRank
  question: Как разбиение текста на предложения ограничивает результат extractive-алгоритма TextRank?
  explanation: TextRank строит граф из единиц, полученных при разбиении текста. Если узлами служат предложения, алгоритм ранжирует и извлекает именно целые предложения, а не произвольные фрагменты.
  kind: choice
  options:
    - Каждое выделенное предложение становится отдельным узлом и может быть извлечено только целиком
    - TextRank после ранжирования свободно объединяет части любых предложений
    - Разбиение влияет лишь на отображение текста, но не на граф
    - Каждое слово становится узлом независимо от границ предложений
  correct: 0
  id: 006-split-teoriya-1
  fingerprint: 3dc29871
- concept: ошибочное разделение или склеивание предложений изменяет состав кандидатов для TextRank
  question: Объясните своими словами, как ложная граница предложения и пропущенная граница по-разному влияют на граф TextRank и итоговую выжимку.
  explanation: Сегментация выполняется до построения графа и задаёт набор доступных кандидатов. Последующее ранжирование меняет их оценки, но уже не исправляет ошибочные границы.
  kind: open
  reference: Ложная граница раскалывает законченную мысль на отдельные узлы, которые могут оказаться бессмысленными без соседнего фрагмента. Пропущенная граница объединяет разные мысли в один узел, поэтому TextRank сможет выбрать или отбросить их только вместе.
  id: 006-split-teoriya-2
  fingerprint: 2fef61ed
