- concept: нулевая диагональ матрицы похожести исключает искусственные петли графа TextRank
  question: Почему в графе TextRank значение `sim[i][i]` обычно оставляют нулевым?
  explanation: Сходство предложения с самим собой обычно велико, но такая связь ничего не говорит о его центральности среди других предложений. Нулевая диагональ исключает самопетли, которые могли бы удерживать значительную часть веса на исходном узле.
  kind: choice
  options:
    - Чтобы матрица похожести стала асимметричной
    - Чтобы сумма каждой строки автоматически равнялась единице
    - Чтобы предложение не передавало вес самому себе через искусственную петлю
    - Чтобы несвязанные предложения получили одинаковую похожесть
  correct: 2
