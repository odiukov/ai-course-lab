- concept: ROUGE может занижать оценку семантически близкого пересказа, поскольку стемминг объединяет формы слов, но не синонимы
  question: Объясните, почему содержательно верная abstractive-выжимка может получить низкий ROUGE даже при включённом стемминге.
  explanation: Стемминг помогает сопоставлять разные формы одной лексемы, например run и running, но не связывает разные слова с близким смыслом. Поэтому точный по смыслу парафраз всё равно может иметь невысокий ROUGE.
  kind: open
  reference: Abstractive-модель может передать смысл эталона другими словами. ROUGE опирается на совпадение текстовых фрагментов, а стемминг объединяет лишь родственные формы слов и не распознаёт синонимы, поэтому совпадений может оказаться мало.
  id: 020-rouge-zachem-2
