<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Два пути от статьи к краткой выжимке</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f7f8fc;
  --panel:#ffffff;
  --ink:#172033;
  --muted:#647089;
  --line:#a8b1c3;
  --split:#52627d;
  --extract:#176b87;
  --extract-soft:#dff4fa;
  --abstract:#7655b5;
  --abstract-soft:#eee7ff;
  --select:#f7c84b;
  --select-soft:#fff4c7;
  --warn:#b9533d;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#111622;
    --panel:#1b2332;
    --ink:#edf2fb;
    --muted:#aab5c8;
    --line:#56647b;
    --split:#9aa9c1;
    --extract:#66c7e5;
    --extract-soft:#173b49;
    --abstract:#bca4f5;
    --abstract-soft:#332953;
    --select:#f0c85b;
    --select-soft:#493f21;
    --warn:#f09882;
  }
}
html,body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
figure{margin:unset;background:var(--bg)}
figcaption{font-size:20px;font-weight:750;color:var(--ink)}
svg{display:block;width:100%;height:auto;background:var(--bg)}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:2px}
.article{fill:var(--panel);stroke:var(--split);stroke-width:2px}
.extract-panel{fill:var(--extract-soft);stroke:var(--extract);stroke-width:2px}
.abstract-panel{fill:var(--abstract-soft);stroke:var(--abstract);stroke-width:2px}
.route-common{fill:none;stroke:var(--split);stroke-width:3px;stroke-linecap:round;stroke-linejoin:round}
.route-extract{fill:none;stroke:var(--extract);stroke-width:3px;stroke-linecap:round;stroke-linejoin:round}
.route-abstract{fill:none;stroke:var(--abstract);stroke-width:3px;stroke-linecap:round;stroke-linejoin:round}
.head-common{fill:var(--split)}
.head-extract{fill:var(--extract)}
.head-abstract{fill:var(--abstract)}
.article-line{stroke:var(--line);stroke-width:3px;stroke-linecap:round}
.article-picked{stroke:var(--select);stroke-width:7px;stroke-linecap:round}
.summary-line{stroke:var(--extract);stroke-width:4px;stroke-linecap:round}
.generated-line{stroke:var(--abstract);stroke-width:4px;stroke-linecap:round}
.inner-box{fill:var(--panel);stroke:var(--abstract);stroke-width:1.5px}
.attention{fill:none;stroke:var(--abstract);stroke-width:1.5px;stroke-dasharray:5 5}
.fork{fill:var(--panel);stroke:var(--split);stroke-width:3px}
.badge-extract{fill:var(--extract)}
.badge-abstract{fill:var(--abstract)}
.badge-select{fill:var(--select-soft);stroke:var(--select);stroke-width:1.5px}
.label{font-size:16px;fill:var(--ink)}
.small{font-size:13px;fill:var(--muted)}
.tiny{font-size:12px;fill:var(--muted)}
.card-title{font-size:18px;font-weight:750;fill:var(--ink)}
.route-title{font-size:15px;font-weight:750}
.extract-text{fill:var(--extract)}
.abstract-text{fill:var(--abstract)}
.badge-text{font-size:12px;font-weight:750;fill:#fff}
.select-text{font-size:12px;font-weight:750;fill:var(--ink)}
.number{font-size:28px;font-weight:800;fill:var(--ink)}
.warning{font-size:12px;fill:var(--warn)}
</style>
</head>
<body>
<figure aria-labelledby="scheme-title">
  <figcaption id="scheme-title">Два пути от статьи к краткой выжимке</figcaption>
  <svg id="diagram" viewBox="0 0 1100 460" width="1100" height="460"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Статья из 2000 слов расходится по extractive и abstractive маршрутам">
    <title>Два пути от статьи к краткой выжимке</title>
    <desc>Сверху выбираются три исходных предложения, снизу encoder-decoder создаёт новый текст на 120 слов.</desc>
    <g id="geometry"></g>
  </svg>
</figure>
<script>
"use strict";

const [D] = Object.freeze([{
  zero:0,
  map:{origin:{x:0,y:0},scale:{x:1,y:1}},
  canvas:{w:1100,h:460},
  fallback:{x:550,y:220},
  article:{x:25,y:130,w:200,h:205,cx:125},
  fork:{x:275,y:232,r:8},
  topMethod:{x:340,y:35,w:285,h:160},
  topResult:{x:790,y:35,w:280,h:160},
  bottomMethod:{x:340,y:270,w:285,h:165},
  bottomResult:{x:790,y:270,w:280,h:165},
  articleLines:[
    {x1:52,x2:195,y:195,picked:false},
    {x1:52,x2:178,y:214,picked:true},
    {x1:52,x2:198,y:233,picked:false},
    {x1:52,x2:185,y:252,picked:true},
    {x1:52,x2:194,y:271,picked:false},
    {x1:52,x2:168,y:290,picked:true},
    {x1:52,x2:188,y:309,picked:false}
  ],
  paths:[
    {kind:"common",points:[{x:225,y:232},{x:275,y:232}]},
    {kind:"extract",points:[{x:275,y:232},{x:275,y:115},{x:340,y:115}],
     head:[{x:340,y:115},{x:326,y:107},{x:326,y:123}]},
    {kind:"abstract",points:[{x:275,y:232},{x:275,y:352},{x:340,y:352}],
     head:[{x:340,y:352},{x:326,y:344},{x:326,y:360}]},
    {kind:"extract",points:[{x:625,y:115},{x:790,y:115}],
     head:[{x:790,y:115},{x:776,y:107},{x:776,y:123}]},
    {kind:"abstract",points:[{x:625,y:352},{x:790,y:352}],
     head:[{x:790,y:352},{x:776,y:344},{x:776,y:360}]}
  ],
  summaryLines:[
    {x1:825,x2:1038,y:112},
    {x1:825,x2:1008,y:131},
    {x1:825,x2:1025,y:150}
  ],
  generatedLines:[
    {x1:825,x2:1038,y:347},
    {x1:825,x2:1014,y:366},
    {x1:825,x2:1040,y:385},
    {x1:825,x2:982,y:404}
  ],
  stages:[
    {x:365,y:337,w:72,h:50,label:"encoder"},
    {x:451,y:337,w:88,h:50,label:"cross-attention"},
    {x:553,y:337,w:52,h:50,label:"decoder"}
  ],
  innerArrows:[
    {points:[{x:437,y:362},{x:451,y:362}],
     head:[{x:451,y:362},{x:443,y:357},{x:443,y:367}]},
    {points:[{x:539,y:362},{x:553,y:362}],
     head:[{x:553,y:362},{x:545,y:357},{x:545,y:367}]}
  ],
  labels:[
    {x:125,y:156,lines:["ОБЩИЙ ВХОД"],className:"route-title",anchor:"middle"},
    {x:125,y:181,lines:["Статья"],className:"card-title",anchor:"middle"},
    {x:125,y:325,lines:["2000 слов"],className:"number",anchor:"middle"},

    {x:482,y:61,lines:["EXTRACTIVE"],className:"route-title extract-text",anchor:"middle"},
    {x:482,y:86,lines:["Выбор готовых предложений"],className:"card-title",anchor:"middle"},
    {x:482,y:143,lines:["Оценить значимость","и перенести без переписывания"],className:"small",anchor:"middle"},

    {x:930,y:61,lines:["ДОСЛОВНАЯ ВЫЖИМКА"],className:"route-title extract-text",anchor:"middle"},
    {x:930,y:91,lines:["3 предложения"],className:"number",anchor:"middle"},
    {x:930,y:180,lines:["Каждое есть в исходной статье"],className:"small",anchor:"middle"},

    {x:482,y:294,lines:["ABSTRACTIVE"],className:"route-title abstract-text",anchor:"middle"},
    {x:482,y:319,lines:["Понять → написать заново"],className:"card-title",anchor:"middle"},
    {x:482,y:414,lines:["Новый текст рождается слово за словом"],className:"small",anchor:"middle"},

    {x:930,y:294,lines:["НОВАЯ ФОРМУЛИРОВКА"],className:"route-title abstract-text",anchor:"middle"},
    {x:930,y:324,lines:["120 слов"],className:"number",anchor:"middle"},
    {x:930,y:421,lines:["Связнее, но возможен новый факт"],className:"warning",anchor:"middle"},

    {x:285,y:91,lines:["выбирает"],className:"small extract-text",anchor:"start"},
    {x:285,y:386,lines:["переписывает"],className:"small abstract-text",anchor:"start"},
    {x:690,y:100,lines:["перенос"],className:"small extract-text",anchor:"middle"},
    {x:690,y:337,lines:["порождение"],className:"small abstract-text",anchor:"middle"}
  ],
  badgeTop:{x:350,y:103,w:98,h:24,text:"дословно"},
  badgeBottom:{x:350,y:398,w:104,h:24,text:"новый текст"},
  labelStep:17,
  labelPad:4
}]);

const origin = Object.freeze(D.map.origin);
const scale = Object.freeze(D.map.scale);
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

const svg = document.getElementById("diagram");
const layer = document.getElementById("geometry");
const NS = "http://www.w3.org/2000/svg";

function node(tag, attrs, parent){
  const item = document.createElementNS(NS, tag);
  for(const [key,value] of Object.entries(attrs)) item.setAttribute(key,value);
  (parent || layer).appendChild(item);
  return item;
}

function box(item,className){
  return node("rect",{
    x:sx(item.x),
    y:sy(item.y),
    width:sx(item.w)-sx(D.zero),
    height:sy(item.h)-sy(D.zero),
    class:className
  });
}

function polyline(points,className){
  return node("polyline",{
    points:points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
    class:className
  });
}

function arrow(route){
  polyline(route.points,`route-${route.kind}`);
  if(route.head){
    node("polygon",{
      points:route.head.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
      class:`head-${route.kind}`
    });
  }
}

function textBlock(spec){
  const text = node("text",{
    x:sx(spec.x),
    y:sy(spec.y),
    class:spec.className,
    "text-anchor":spec.anchor
  });
  let first = true;
  for(const line of spec.lines){
    const span = node("tspan",{
      x:sx(spec.x),
      y:sy(spec.y + (first ? D.zero : D.labelStep))
    },text);
    span.textContent = line;
    spec.y += first ? D.zero : D.labelStep;
    first = false;
  }
  return text;
}

function badge(item,className){
  box(item,className);
  const text = node("text",{
    x:sx(item.x + item.w / D.labelPad),
    y:sy(item.y + item.h / D.labelPad + D.labelStep),
    class:"badge-text",
    "text-anchor":"middle"
  });
  text.textContent = item.text;
}

try{
  box(D.article,"article");
  box(D.topMethod,"extract-panel");
  box(D.topResult,"panel");
  box(D.bottomMethod,"abstract-panel");
  box(D.bottomResult,"panel");

  for(const route of D.paths) arrow(route);

  node("circle",{
    cx:sx(D.fork.x),
    cy:sy(D.fork.y),
    r:sx(D.fork.r)-sx(D.zero),
    class:"fork"
  });

  for(const line of D.articleLines){
    node("line",{
      x1:sx(line.x1),
      y1:sy(line.y),
      x2:sx(line.x2),
      y2:sy(line.y),
      class:line.picked ? "article-picked" : "article-line"
    });
  }

  for(const line of D.summaryLines){
    node("line",{
      x1:sx(line.x1),y1:sy(line.y),
      x2:sx(line.x2),y2:sy(line.y),
      class:"summary-line"
    });
  }

  for(const line of D.generatedLines){
    node("line",{
      x1:sx(line.x1),y1:sy(line.y),
      x2:sx(line.x2),y2:sy(line.y),
      class:"generated-line"
    });
  }

  for(const stage of D.stages){
    box(stage,"inner-box");
    const label = node("text",{
      x:sx(stage.x + stage.w / D.labelPad),
      y:sy(stage.y + stage.h / D.labelPad + D.labelStep),
      class:"tiny",
      "text-anchor":"middle"
    });
    label.textContent = stage.label;
  }

  for(const inner of D.innerArrows){
    polyline(inner.points,"attention");
    node("polygon",{
      points:inner.head.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
      class:"head-abstract"
    });
  }

  badge(D.badgeTop,"badge-extract");
  badge(D.badgeBottom,"badge-abstract");

  for(const label of D.labels) textBlock({...label,lines:[...label.lines]});
}catch(error){
  layer.replaceChildren();
  const fallback = node("text",{
    x:sx(D.fallback.x),
    y:sy(D.fallback.y),
    class:"label",
    "text-anchor":"middle"
  });
  fallback.textContent="Схема: статья из 2000 слов либо сокращается до 3 исходных предложений, либо переписывается encoder-decoder в новый текст на 120 слов.";
}
</script>
</body>
</html>
