- concept: вычислительные стадии с разными профилями нагрузки полезно масштабировать независимо
  question: Multi-view diffusion и LRM-реконструкция обе выполняют инференс без длительной подгонки параметров объекта. Почему их всё равно может быть полезно разнести по разным сервисам?
  explanation: Граница сервисов определяется не только различием между инференсом и оптимизацией. Даже два прямых прохода могут требовать разных режимов обслуживания, поэтому независимое масштабирование повышает загрузку GPU и устойчивость пайплайна.
  kind: open
  reference: У стадий могут различаться задержка, потребление памяти, возможности пакетной обработки и интенсивность входной нагрузки. Раздельные сервисы позволяют независимо подбирать GPU, параметры батчинга и число реплик, а также не дают одной стадии удерживать ресурсы другой.
