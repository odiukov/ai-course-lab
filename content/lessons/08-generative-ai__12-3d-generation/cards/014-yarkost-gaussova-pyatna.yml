- concept: величина гауссова вклада определяется нормированным квадратом расстояния
  question: Точка находится от центра гауссианы на расстоянии √22·σ. Чему примерно равен вклад гауссианы в этой точке?
  explanation: Квадрат нормированного расстояния равен 22, поэтому показатель экспоненты равен −11. Вклад составляет exp(−11) ≈ 0,0000167.
  kind: numeric
  answer: 0.0000167
  tolerance: 0.000001
  id: 014-yarkost-gaussova-pyatna-2
