- concept: увеличение сигмы расширяет гауссово пятно
  question: Как изменится вклад гауссианы в фиксированной точке вне её центра, если увеличить σ? Объясни своими словами.
  explanation: σ задаёт масштаб расстояний. Чем она больше, тем слабее штрафуется удаление от центра и тем шире область заметного вклада.
  kind: open
  reference: 'Вклад увеличится: при большей σ то же физическое расстояние становится меньше относительно размера гауссианы, поэтому экспонента убывает медленнее и пятно получается шире.'
