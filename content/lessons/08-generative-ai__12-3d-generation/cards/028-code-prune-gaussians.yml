- concept: равенство длин параллельных массивов проверяется до совместной фильтрации
  question: Объясни своими словами, почему prune_gaussians должна отклонить входные массивы параметров разной длины, а не фильтровать их через zip.
  explanation: Параллельные массивы описывают одни и те же гауссианы по одинаковым индексам. Несовпадение длин нарушает этот инвариант, а молчаливое усечение лишь маскирует проблему.
  kind: open
  reference: Разная длина означает, что взаимно однозначное соответствие параметров гауссиан уже не гарантировано. zip молча отбросит хвост более длинных массивов и скроет повреждение данных, поэтому функция должна сначала проверить длины и сообщить об ошибке.
  id: 028-code-prune-gaussians-3
