- concept: обучение трёхмерного представления по изображениям использует рендеринг как косвенную проверку геометрии
  question: Расположите этапы подгонки трёхмерного представления по наблюдаемым ракурсам в правильном порядке.
  explanation: Когда эталонная объёмная структура недоступна, модель контролируют через её проекции. Она рендерит текущую гипотезу, измеряет расхождение с наблюдаемыми видами и корректирует параметры геометрии или внешнего вида.
  kind: order
  items:
    - Задать текущие параметры трёхмерного представления
    - Отрисовать из него виды для камер наблюдаемых изображений
    - Сравнить отрисованные виды с наблюдаемыми изображениями
    - Обновить параметры представления по ошибке
