- concept: шероховатость управляет резкостью и шириной отражённого блика в PBR-материале
  question: Геометрия и базовый цвет металлической детали не меняются. Какое свойство PBR-материала нужно изменить, чтобы сделать её блик более размытым?
  explanation: 'Шероховатость определяет характер отражения света: гладкая поверхность даёт более резкий блик, а шероховатая распределяет отражение по большей области. Металличность отвечает за тип поверхности, а не за размытость блика.'
