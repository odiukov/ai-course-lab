- concept: коммерческую применимость ресурса из датасета определяет лицензия конкретной модели
  question: Почему наличие модели в Objaverse само по себе не подтверждает право использовать её в коммерческом продукте?
  explanation: 'Единая коллекция не означает единого правового режима: ограничения и разрешения относятся к конкретному ресурсу. Поэтому источник и лицензию модели необходимо сохранять и проверять отдельно.'
  kind: open
