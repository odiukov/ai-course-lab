  question: Рекламной системе нужны только согласованные изображения товара с нескольких новых ракурсов. Почему pipeline синтеза ракурсов может быть уместнее генерации производственного меша?
  explanation: Тип выхода определяет необходимую сложность pipeline. Если потребителю нужны лишь новые согласованные изображения, полноценная геометрия и материалы могут не использоваться вовсе.
