- concept: двухстадийный маршрут разделяет генерацию внешнего вида и восстановление пространственного представления
  question: Расположи этапы преобразования текстового описания в трёхмерный объект в правильном порядке.
  explanation: Multi-view diffusion сначала переводит текст в согласованные изображения, а реконструктор затем объединяет их в объёмное представление. Так генерация внешности отделяется от восстановления геометрии.
  kind: order
  items:
    - Сгенерировать по описанию согласованный набор изображений объекта с разных ракурсов
    - Передать полученные изображения модели реконструкции как виды одного объекта
    - Собрать единое пространственное представление объекта
  id: 005-schema-multiview-3d-1
  fingerprint: 830bb888
- concept: противоречия между сгенерированными ракурсами мешают реконструировать единый объект
  question: 'Модель независимо создала несколько ракурсов кружки: на одних изображениях ручка находится справа, а на других отсутствует. Как это повлияет на последующую реконструкцию?'
  explanation: Ракурсы должны описывать один и тот же объект. Если детали появляются, исчезают или перемещаются, единой геометрии, совместимой со всеми изображениями, может не существовать.
  kind: choice
  options:
    - Реконструктор получит противоречивые наблюдения, поэтому возможны искажённая геометрия и артефакты
    - Реконструктор автоматически поймёт, что изображения относятся к разным объектам, и выберет лучший
    - Изменится только разрешение текстуры, а геометрия останется корректной
    - Противоречие поможет точнее определить положение камеры
  correct: 0
