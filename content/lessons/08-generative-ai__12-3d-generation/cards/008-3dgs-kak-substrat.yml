- concept: alpha-композитинг перекрывающихся полупрозрачных примитивов зависит от порядка по глубине
  question: Почему перед alpha-композитингом перекрывающиеся проекции гауссиан нужно учитывать в согласованном порядке по глубине?
  explanation: Ближний полупрозрачный слой ослабляет вклад расположенных за ним слоёв, поэтому перестановка слоёв обычно меняет итоговый цвет. В 3DGS после проекции используется именно такой alpha-композитинг.
  kind: choice
  options:
    - Смешивание полупрозрачных слоёв в общем случае некоммутативно
    - Порядок по глубине превращает перспективную камеру в ортографическую
    - Без сортировки невозможно вычислить цвет отдельной гауссианы
    - Сортировка делает все коэффициенты непрозрачности одинаковыми
