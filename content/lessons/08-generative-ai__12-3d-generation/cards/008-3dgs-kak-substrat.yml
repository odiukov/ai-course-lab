- concept: дифференцируемый рендеринг передаёт градиент ошибки изображения параметрам гауссиан
  question: Рендер реконструируемой сцены отличается от эталонной фотографии. Что позволяет градиентному спуску определить, как изменить положения, цвета и непрозрачности гауссиан?
  explanation: Дифференцируемый рендерер связывает ошибку итогового изображения с параметрами сцены. Обратное распространение вычисляет градиенты, по которым оптимизатор корректирует гауссианы.
  kind: choice
  options:
    - Дифференцируемость операций проекции и композитинга
    - Случайная перестановка гауссиан перед каждым кадром
    - Преобразование всех гауссиан в воксельную сетку
    - Фиксация параметров камеры после первого рендера
