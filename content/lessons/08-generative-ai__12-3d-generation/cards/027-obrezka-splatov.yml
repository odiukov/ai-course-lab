- concept: порог pruning задаёт компромисс между экономией ресурсов и сохранением потенциально полезных гауссиан
  question: Объясни своими словами, почему слишком высокий порог непрозрачности при pruning может ухудшить результат обучения Gaussian Splatting.
  explanation: Слабый текущий вклад не всегда означает окончательную бесполезность. Поэтому агрессивная обрезка лучше ограничивает размер сцены, но может преждевременно уничтожить примитивы, необходимые для восстановления деталей.
  kind: open
  reference: Высокий порог может удалить не только бесполезные почти прозрачные примитивы, но и слабые гауссианы, которые ещё способны усилиться и начать описывать важную деталь сцены.
