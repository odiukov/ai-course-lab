- concept: градиент нужно заново вычислять в текущей точке пространства параметров
  question: Почему после обновления цветов гауссиан нельзя продолжать использовать градиенты, вычисленные до обновления?
  explanation: Градиент — локальная характеристика функции потерь при текущих параметрах. После изменения цветов меняются рендер, ошибка и её производные, поэтому следующую поправку нужно считать заново.
  kind: choice
  options:
    - Старые градиенты относятся к прежним значениям цветов и могут уже не указывать направление убывания ошибки
    - Градиенты разрешено использовать только при первом рендеринге
    - После обновления цветов функция потерь перестаёт зависеть от изображения
    - Повторное вычисление градиентов нужно только для экономии памяти
  correct: 0
  id: 023-code-fit-colors-1
  fingerprint: e3a4e3f2
- concept: слишком большой learning rate может сделать градиентный спуск нестабильным
  question: Цвета обновляются против градиента, однако ошибка скачет и иногда растёт. Какая причина наиболее вероятна?
  explanation: Верное направление шага ещё не гарантирует уменьшение ошибки при любой его длине. Слишком большой learning rate может перескочить через минимум и вызвать колебания или расходимость.
  kind: choice
  options:
    - Слишком большой learning rate приводит к перескакиванию через область минимума
    - Градиентный спуск требует фиксировать одно изображение на всё обучение
    - Ошибка обязана возрастать после каждого корректного обновления
    - Цвета нельзя оптимизировать с помощью производных
  correct: 0
