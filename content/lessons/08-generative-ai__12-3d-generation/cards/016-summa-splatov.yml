- concept: вычислительная сложность наивного splat-рендеринга линейна по числу пикселей и числу гауссиан
  question: Наивный двумерный splat-рендерер для каждого пикселя перебирает все гауссианы. Как изменится число вычислений вклада, если высоту изображения увеличить с 25 до 125 пикселей, сохранив ширину и число гауссиан?
  explanation: Число вычислений пропорционально произведению высоты, ширины и числа гауссиан. Высота выросла в 125 / 25 = 5 раз, поэтому объём вычислений возрастёт во столько же раз.
  kind: choice
  options:
    - Увеличится в пять раз
    - Увеличится в двадцать пять раз
    - Не изменится
    - Уменьшится в пять раз
