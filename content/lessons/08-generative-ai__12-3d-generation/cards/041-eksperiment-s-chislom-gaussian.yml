- concept: увеличение числа гауссиан расширяет возможности модели, но не гарантирует одинакового улучшения после оптимизации
  question: Объясни своими словами, почему добавление гауссиан не обязано каждый раз приводить к одинаковому снижению ошибки реконструкции.
  explanation: Большее число примитивов даёт модели больше способов приблизить цель, однако само по себе не гарантирует, что оптимизатор найдёт существенно лучшее решение.
  kind: open
  reference: Дополнительные гауссианы повышают ёмкость представления, но достигнутый результат зависит также от сложности цели, инициализации, числа итераций и хода оптимизации. Поэтому дополнительная ёмкость может использоваться не полностью.
