- concept: возведение ошибок в квадрат предотвращает компенсацию разных знаков и усиливает штраф за крупные отклонения
  question: Почему в MSE поэлементные ошибки возводят в квадрат перед усреднением?
  explanation: Квадраты всегда неотрицательны, поэтому избыток и недостаток цвета не гасят друг друга. Квадратичная зависимость также увеличивает относительный вклад крупных ошибок.
  kind: choice
  options:
    - Чтобы сохранить знак каждого отклонения в итоговой метрике
    - Чтобы ошибки противоположных знаков не компенсировались, а крупные отклонения штрафовались сильнее
    - Чтобы определить координаты пикселей с наибольшей ошибкой
    - Чтобы сделать вклад всех отклонений одинаковым
  correct: 1
