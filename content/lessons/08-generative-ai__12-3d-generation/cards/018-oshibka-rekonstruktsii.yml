- concept: одинаковая MSE не гарантирует одинаковое пространственное распределение ошибок
  question: Рендеры A и B имеют одинаковую MSE относительно целевого изображения. Почему из этого нельзя заключить, что сами рендеры одинаковы?
  explanation: MSE сводит всю карту ошибок к одному скаляру. Она позволяет сравнить общий размер отклонений, но не показывает, где именно они возникли.
  kind: open
  reference: MSE усредняет квадраты поэлементных отклонений и не хранит информацию об их расположении. Одинаковая сумма квадратов может получиться при разных ошибках в разных пикселях и цветовых каналах.
  id: 018-oshibka-rekonstruktsii-3
