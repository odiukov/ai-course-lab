- concept: аватары и одетые люди требуют специализированных моделей тела и одежды
  question: Почему для реконструкции одетого человека разумно выбрать Gaussian Avatar или HUGS, а не универсальный генератор трёхмерных предметов?
  explanation: Человеческое тело и одежда деформируются особым образом. Специализированные модели используют эти ограничения, тогда как универсальный генератор предметов не обязан их соблюдать.
  kind: open
  reference: Модели аватаров учитывают характерные ограничения человеческого тела, позы и деформации одежды, поэтому лучше сохраняют структуру человека при движении и смене ракурса.
