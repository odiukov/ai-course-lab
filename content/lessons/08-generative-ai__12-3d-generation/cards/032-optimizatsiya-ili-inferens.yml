- concept: повторное обновление параметров конкретной сцены отличает оптимизацию объекта от прямого инференса
  question: Какое наблюдение наиболее убедительно указывает, что система выполняет оптимизацию отдельного объекта, а не прямой инференс?
  explanation: При оптимизации параметры конкретного объекта итеративно подгоняются по результатам рендеринга. При прямом инференсе уже обученная сеть предсказывает представление без отдельного цикла подгонки для каждого объекта.
  kind: choice
  options:
    - Она многократно рендерит текущую сцену и обновляет её параметры по функции потерь
    - Она применяет обученную сеть с неизменными весами и сразу предсказывает параметры сцены
    - Она сохраняет результат в формате, который поддерживает материалы
    - Она принимает изображение вместо текстового описания
  correct: 0
  id: 032-optimizatsiya-ili-inferens-1
  fingerprint: ed345dd1
- concept: время генерации служит признаком архитектуры вычислений, но не является строгим доказательством
  question: Объясни своими словами, почему короткое время генерации позволяет предположить прямой инференс, но само по себе не доказывает его.
  explanation: 'Разница между DreamFusion и TripoSR отражает смену подхода: первый многократно улучшает отдельный объект, второй применяет заранее обученное отображение входа в 3D. Но секундомер измеряет весь вычислительный процесс, включая влияние железа и настроек, а не только алгоритмическую схему.'
  kind: open
  reference: Прямой проход обученной сети обычно быстрее итеративной подгонки отдельного объекта, поэтому секунды указывают на прямой инференс, а минуты или часы — на оптимизацию. Однако время также зависит от оборудования, разрешения, числа ракурсов и дополнительных стадий, поэтому для уверенного вывода нужно проверить, обновляются ли параметры сцены во время генерации.
  id: 032-optimizatsiya-ili-inferens-2
