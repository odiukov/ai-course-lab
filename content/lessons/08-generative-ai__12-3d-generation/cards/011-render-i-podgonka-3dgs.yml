- concept: alpha одновременно задаёт цветовой вклад примитива и уменьшает остаточную пропускаемость
  question: Объясни своими словами, как alpha экранного отпечатка влияет на его вклад в цвет пикселя и на вклад расположенных позади отпечатков.
  explanation: Высокая alpha усиливает собственный цвет примитива и сильнее подавляет всё, что находится за ним. При малой alpha примитив вносит небольшой вклад и оставляет большую долю пропускаемости дальним примитивам.
  kind: open
  reference: Цвет отпечатка добавляется с весом, зависящим от его alpha и накопленной пропускаемости. После этого остаточная пропускаемость умножается на величину «единица минус alpha», поэтому до более дальних отпечатков доходит только незакрытая доля.
  id: 011-render-i-podgonka-3dgs-2
