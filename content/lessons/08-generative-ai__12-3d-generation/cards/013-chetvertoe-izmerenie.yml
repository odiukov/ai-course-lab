- concept: общие гауссианы сохраняют временное соответствие частей динамической сцены
  question: Динамическую сцену можно представить общим набором гауссиан с зависящими от времени сдвигами или независимой реконструкцией каждого момента. Какое преимущество общего набора важно для временного соответствия?
  explanation: Сдвиги изменяют состояние уже существующих гауссиан, поэтому движение связывается с конкретными примитивами. Это позволяет описывать траектории частей сцены, а не хранить несвязанные статические реконструкции.
  kind: open
  reference: Одна и та же гауссиана сохраняет свою идентичность и описывает соответствующую часть сцены в разные моменты, меняя положение с помощью временного сдвига. В независимых реконструкциях такого прямого соответствия между примитивами нет.
