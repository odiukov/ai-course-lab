- concept: градиент цвета гауссианы суммирует ошибки пикселей с весами, равными её вкладам в эти пиксели
  question: Почему при вычислении градиента цвета гауссианы нельзя учитывать только пиксель, на который проецируется её центр?
  explanation: Производная MSE по цвету содержит сумму произведений остаточной ошибки пикселя на вклад гауссианы в этот пиксель. Пиксели около центра обычно влияют сильнее, но итог определяется всем экранным пятном.
  kind: open
  reference: Гауссиана влияет на целую область изображения. Поэтому её градиент должен учитывать ошибки всех затронутых пикселей, причём ошибка каждого пикселя взвешивается вкладом этой гауссианы. Вклады от слишком светлых и слишком тёмных пикселей могут частично компенсироваться.
