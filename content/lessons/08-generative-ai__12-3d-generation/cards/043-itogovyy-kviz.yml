- concept: Triplane получает признаки пространственной точки через её проекции на три координатные плоскости
  question: Как triplane-представление извлекает признаки для произвольной точки пространства?
  explanation: Triplane заменяет полную объёмную сетку тремя плоскими сетками признаков. Для пространственной точки признаки считываются по её проекциям на эти плоскости.
  kind: choice
  options:
    - Проецирует точку на три координатные плоскости, выбирает признаки из каждой сетки и объединяет их
    - Хранит отдельный обучаемый вектор для каждого возможного луча камеры
    - Интегрирует цвет и плотность вдоль луча без промежуточных сеток признаков
    - Сортирует полупрозрачные примитивы по глубине и смешивает их цвета
