- concept: SDS использует score двумерной диффузионной модели как псевдоградиент для оптимизации трёхмерного представления
  question: Объясни своими словами, какую роль играет обученная диффузионная модель в SDS при создании трёхмерного объекта.
  explanation: 'В SDS двумерная диффузия служит источником обучающего сигнала: её score превращают в псевдоградиент и используют для оптимизации параметров трёхмерной сцены.'
