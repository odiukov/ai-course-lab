  explanation: 'Быстрая реконструкция может давать плохие новые виды, а высокий SSIM может быть достигнут ценой долгой подгонки. Поэтому в hard-задании требуется сообщить обе характеристики: время работы и итоговый SSIM на отложенных ракурсах.'
