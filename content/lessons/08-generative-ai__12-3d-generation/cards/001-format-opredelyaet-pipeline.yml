- concept: память плотной воксельной сетки кубически зависит от линейного разрешения
  question: Заполни асимптотику числа ячеек плотной воксельной сетки с линейным разрешением n.
  explanation: Плотная сетка содержит ячейки по каждой пространственной оси, поэтому необходимая память растёт кубически. Из-за этого повышение детализации воксельного представления быстро становится дорогим.
  kind: cloze
  template: M(n) = ___
