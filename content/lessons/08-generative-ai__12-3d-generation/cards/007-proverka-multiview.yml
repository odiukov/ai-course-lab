- concept: невидимость детали на отдельном ракурсе может быть вызвана окклюзией
  question: Объясни своими словами, почему исчезновение детали на одном из ракурсов ещё не доказывает противоречие в геометрии объекта.
  explanation: Видимость зависит от положения камеры и взаимного перекрытия поверхностей. Поэтому сначала нужно проверить возможность окклюзии, а уже затем считать пропавшую деталь изменением объекта.
  kind: open
  reference: Деталь может находиться на обратной стороне объекта или быть перекрыта другой его частью. Несогласованность возникает лишь тогда, когда ожидаемая видимость не объясняется ракурсом, перспективой или окклюзией.
