<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Двухстадийный маршрут от промпта до 3D</title>
<style>
:root{
  color-scheme:light dark;
  --page:#f4f1ea;
  --surface:#fffdf8;
  --panel:#f7f2e8;
  --card:#ffffff;
  --ink:#25221d;
  --muted:#6d675d;
  --line:#8b8376;
  --accent:#c94f3d;
  --accent-soft:#f4c7b9;
  --blue:#397c92;
  --blue-soft:#c7e4e8;
  --gold:#d99a32;
  --cream:#f5dfb5;
  --mesh-a:#68a7b1;
  --mesh-b:#9bcbd0;
}
@media (prefers-color-scheme:dark){
  :root{
    --page:#17191c;
    --surface:#202328;
    --panel:#282c31;
    --card:#30353b;
    --ink:#f4efe6;
    --muted:#bbb4aa;
    --line:#8f969c;
    --accent:#ff806a;
    --accent-soft:#753d35;
    --blue:#71c4d8;
    --blue-soft:#315661;
    --gold:#f0b84e;
    --cream:#8b7042;
    --mesh-a:#4e98a6;
    --mesh-b:#76bdc8;
  }
}
*{box-sizing:border-box}
body{
  margin:unset;
  background:var(--page);
  color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}
main{background:var(--surface)}
h1{
  margin:unset;
  font-size:22px;
  font-weight:bold;
  text-align:center;
}
svg{
  display:block;
  width:100%;
  height:auto;
  max-height:480px;
  background:var(--surface);
}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:2px}
.card{fill:var(--card);stroke:var(--line);stroke-width:2px}
.responsibility{fill:var(--blue-soft);stroke:var(--blue);stroke-width:2px}
.arrow{stroke:var(--accent);stroke-width:3px;fill:none}
.arrow-head{fill:var(--accent)}
.separator{stroke:var(--line);stroke-width:2px;fill:none}
.object{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2px}
.object-line{stroke:var(--accent);stroke-width:2px;fill:none}
.cube{fill:none;stroke:var(--blue);stroke-width:2px}
.splat-coral{fill:var(--accent)}
.splat-gold{fill:var(--gold)}
.splat-cream{fill:var(--cream)}
.mesh-a{fill:var(--mesh-a);stroke:var(--blue);stroke-width:2px}
.mesh-b{fill:var(--mesh-b);stroke:var(--blue);stroke-width:2px}
.label{
  fill:var(--ink);
  font-size:16px;
  dominant-baseline:middle;
}
.small{fill:var(--muted);font-size:14px}
.stage{fill:var(--ink);font-size:19px;font-weight:bold}
.emphasis{fill:var(--accent);font-size:17px;font-weight:bold}
.output{fill:var(--ink);font-size:17px;font-weight:bold}
line,polyline,polygon{vector-effect:non-scaling-stroke}
#fallback{
  color:var(--ink);
  background:var(--surface);
  font-size:16px;
  text-align:center;
}
</style>
</head>
<body>
<main>
  <h1 id="diagram-title">Двухстадийный маршрут от промпта до 3D</h1>
  <svg id="diagram" viewBox="0 0 1200 430" width="1200" height="430"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="diagram-title"></svg>
  <div id="fallback" hidden>
    Промпт или одна фотография превращаются в 4–16 согласованных ракурсов,
    а затем — в gaussian splat или меш.
  </div>
  <noscript>
    Промпт или одна фотография превращаются в 4–16 согласованных ракурсов,
    а затем — в gaussian splat или меш.
  </noscript>
</main>
<script>
const diagramData={

      lid:[{x:566,y:252},{x:600,y:252}],

      lid:[{x:106,y:241},{x:140,y:241}],

      handle:[{x:93,y:258},{x:74,y:261},{x:72,y:282},{x:90,y:289}]
    }
  ],
  cube:[

    [{x:820,y:180},{x:820,y:225},{x:860,y:246},{x:860,y:198}],

  ],
  splats:[

  mesh:[

    {points:[{x:1050,y:298},{x:1072,y:327},{x:1029,y:323}],className:"mesh-a"},
    {points:[{x:1050,y:298},{x:1108,y:301},{x:1072,y:327}],className:"mesh-b"},
    {points:[{x:1095,y:267},{x:1130,y:282},{x:1108,y:301}],className:"mesh-b"},
    {points:[{x:1022,y:278},{x:1000,y:292},{x:1029,y:303}],className:"mesh-a"}
  ],
  labels:[
    {text:"ПРОМПТ ИЛИ ФОТО",point:{x:125,y:93},pad:{x:0,y:0},anchor:"middle",className:"emphasis"},
    {text:"«красный керамический",point:{x:125,y:126},pad:{x:0,y:0},anchor:"middle",className:"label small"},
    {text:"чайник с коротким носиком»",point:{x:125,y:148},pad:{x:0,y:0},anchor:"middle",className:"label small"},
    {text:"ИЛИ",point:{x:125,y:199},pad:{x:0,y:0},anchor:"middle",className:"label small"},
    {text:"одна фотография",point:{x:125,y:329},pad:{x:0,y:0},anchor:"middle",className:"label small"},
    {text:"Multi-view diffusion",point:{x:487,y:77},pad:{x:0,y:0},anchor:"middle",className:"stage"},
    {text:"придумывает согласованные изображения",point:{x:487,y:103},pad:{x:0,y:0},anchor:"middle",className:"label small"},
    {text:"4–16 согласованных ракурсов",point:{x:487,y:337},pad:{x:0,y:0},anchor:"middle",className:"emphasis"},
    {text:"3D-реконструкция",point:{x:962,y:77},pad:{x:0,y:0},anchor:"middle",className:"stage"},
    {text:"связывает наблюдения в пространстве",point:{x:962,y:99},pad:{x:0,y:0},anchor:"middle",className:"label small"},
    {text:"реконструктор",point:{x:857,y:286},pad:{x:0,y:0},anchor:"middle",className:"label small"},
    {text:"gaussian splat",point:{x:1055,y:122},pad:{x:0,y:0},anchor:"middle",className:"output"},
    {text:"меш",point:{x:1055,y:257},pad:{x:0,y:0},anchor:"middle",className:"output"},
    {text:"придумывает ВНЕШНОСТЬ",point:{x:487,y:396},pad:{x:0,y:0},anchor:"middle",className:"label"},
    {text:"восстанавливает ГЕОМЕТРИЮ",point:{x:962,y:396},pad:{x:0,y:0},anchor:"middle",className:"label"}
  ]
};
const origin={x:0,y:0};
const scale={x:1,y:1};
const toPx=point=>({
  x:origin.x+point.x*scale.x,
  y:origin.y+point.y*scale.y
});

try{
  const svg=document.getElementById("diagram");
  const ns="http://www.w3.org/2000/svg";
  const make=(name,className)=>{
    const node=document.createElementNS(ns,name);
    if(className) node.setAttribute("class",className);
    return node;
  };
  const setPoint=(node,prefix,point)=>{
    const pixel=toPx(point);
    node.setAttribute(prefix+"x",pixel.x);
    node.setAttribute(prefix+"y",pixel.y);
  };
  const polygon=(points,className)=>{
    const node=make("polygon",className);
    node.setAttribute("points",points.map(point=>{
      const pixel=toPx(point);
      return pixel.x+","+pixel.y;
    }).join(" "));
    svg.appendChild(node);
  };
  const polyline=(points,className)=>{
    const node=make("polyline",className);
    node.setAttribute("points",points.map(point=>{
      const pixel=toPx(point);
      return pixel.x+","+pixel.y;
    }).join(" "));
    svg.appendChild(node);
  };
  const line=(points,className)=>{
    const node=make("line",className);
    setPoint(node,"",points[0]);
    setPoint(node,"",points[1]);
    node.setAttribute("x2",toPx(points[1]).x);
    node.setAttribute("y2",toPx(points[1]).y);
    node.setAttribute("x1",toPx(points[0]).x);
    node.setAttribute("y1",toPx(points[0]).y);
    svg.appendChild(node);
  };
  const label=item=>{
    const node=make("text",item.className);
    const pixel=toPx(item.point);
    node.setAttribute("x",pixel.x);
    node.setAttribute("y",pixel.y);
    node.setAttribute("dx",item.pad.x);
    node.setAttribute("dy",item.pad.y);
    node.setAttribute("text-anchor",item.anchor);
    node.textContent=item.text;
    svg.appendChild(node);
  };

  for(const panel of diagramData.panels) polygon(panel.points,panel.className);
  for(const card of diagramData.cards) polygon(card,"card");
  for(const separator of diagramData.separators) line(separator,"separator");
  for(const arrow of diagramData.arrows){
    line(arrow.line,"arrow");
    polygon(arrow.head,"arrow-head");
  }
  for(const teapot of diagramData.teapots){
    polygon(teapot.body,"object");
    line(teapot.lid,"object-line");
    polygon(teapot.spout,"object");
    polyline(teapot.handle,"object-line");
  }
  for(const edge of diagramData.cube) polyline(edge,"cube");
  for(const splat of diagramData.splats) polygon(splat.points,splat.className);
  for(const face of diagramData.mesh) polygon(face.points,face.className);
  for(const item of diagramData.labels) label(item);
}catch(error){
  document.getElementById("diagram").hidden=true;
  document.getElementById("fallback").hidden=false;
}
</script>
</body>
</html>
