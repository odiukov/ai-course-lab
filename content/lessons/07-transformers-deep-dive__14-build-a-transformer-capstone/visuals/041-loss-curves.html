<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Как расходятся train и val</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1a1a1a; --muted:#6b6b6b; --grid:#e2e2e2;
    --train:#1f6feb; --val:#d1442f; --both:#2e8b57; --gap:#b08900;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14161a; --fg:#e8e8e8; --muted:#9aa0a6; --grid:#2b2f36;
      --train:#5aa2ff; --val:#ff7a5c; --both:#4fc98a; --gap:#e5c24a;
    }
  }
  html,body{margin:0}
  .wrap{background:var(--bg);color:var(--fg);padding:8px 0;
    font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  h2{font-size:15px;margin:0 0 4px 10px;font-weight:600}
  svg{display:block;width:100%;height:auto;max-height:500px;background:var(--bg)}
  .fail{padding:10px;color:var(--fg)}
  text{font-family:inherit;fill:var(--fg)}
</style>
</head>
<body>
<div class="wrap">
  <h2>Как расходятся train и val</h2>
  <div id="host"><svg id="svg" viewBox="0 0 760 430" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Две панели: слева train падает, val разворачивается вверх; справа обе кривые садятся к 1.5"></svg></div>
</div>
<script>
(function(){
  var host=document.getElementById("host");
  try{
    var SVG="http://www.w3.org/2000/svg";
    var svg=document.getElementById("svg");

    // ---- данные схемы (шаг, loss) ----
    var D={
      smoke:{
        train:[[0,3.83],[50,3.20],[100,2.80],[200,2.50],[300,2.00],[400,1.75],[500,1.60]],
        val:[[0,3.83],[50,3.25],[100,2.90],[150,2.65],[200,2.60],[300,2.70],[400,2.85],[500,3.00]],
        split:[150,2.65]
      },
      full:{
        train:[[0,4.17],[60,3.10],[130,2.50],[240,2.05],[350,1.80],[430,1.62],[500,1.50]],
        val:[[0,4.17],[60,3.20],[130,2.60],[240,2.15],[350,1.90],[430,1.72],[500,1.58]]
      },
      xt:[0,250,500], yt:[1.5,2.0,2.5,3.0,3.5,4.17],
      panelDX:270, axX:[0,500], axY:[1.4,4.35]
    };

    // ---- один origin, один scale ----
    var origin={x:70,y:330}, scale={x:0.40,y:-72};
    function sx(x){return origin.x+x*scale.x;}
    function sy(y){return origin.y+(y-D.axY[0])*scale.y;}

    // ---- примитивы ----
    var LW=1.6, FS=12.5, PAD=6;
    function el(n,a){var e=document.createElementNS(SVG,n);for(var k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
    function line(x1,y1,x2,y2,c,w,d){el("line",{x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),
      stroke:c,"stroke-width":w||LW,"stroke-dasharray":d||"none","stroke-linecap":"round"});}
    function path(pts,c,w,d){var s=pts.map(function(p,i){return (i?"L":"M")+sx(p[0])+" "+sy(p[1]);}).join(" ");
      el("path",{d:s,fill:"none",stroke:c,"stroke-width":w||2.2,"stroke-linejoin":"round","stroke-linecap":"round","stroke-dasharray":d||"none"});}
    function txt(x,y,dx,dy,s,anc,c,bold){var t=el("text",{x:sx(x)+dx,y:sy(y)+dy,"text-anchor":anc,
      "font-size":FS,fill:c||"var(--fg)"});if(bold)t.setAttribute("font-weight","600");t.textContent=s;return t;}
    function dot(x,y,c){el("circle",{cx:sx(x),cy:sy(y),r:3.4,fill:c});}
    function arrow(x1,y1,x2,y2,c){
      var ax1=sx(x1),ay1=sy(y1),ax2=sx(x2),ay2=sy(y2);
      var a=Math.atan2(ay2-ay1,ax2-ax1),h=8,w=3.6;
      el("line",{x1:ax1,y1:ay1,x2:ax2,y2:ay2,stroke:c,"stroke-width":LW});
      el("polygon",{points:[ax2,ay2,ax2-h*Math.cos(a)+w*Math.sin(a),ay2-h*Math.sin(a)-w*Math.cos(a),
        ax2-h*Math.cos(a)-w*Math.sin(a),ay2-h*Math.sin(a)+w*Math.cos(a)].join(" "),fill:c});
    }

    // ---- панель ----
    function panel(off,title,tr,va,marks){
      var O=function(x){return x+off;};
      // сетка + ось Y с засечками
      D.yt.forEach(function(v){
        line(O(D.axX[0]),v,O(D.axX[1]),v,"var(--grid)",1);
        if(off===0) txt(O(D.axX[0]),v,-PAD,4,v.toFixed(2).replace(/0$/,"").replace(/\.$/,""),"end","var(--muted)");
      });
      line(O(D.axX[0]),D.axY[0],O(D.axX[0]),D.axY[1],"var(--muted)",LW);
      line(O(D.axX[0]),D.axY[0],O(D.axX[1]),D.axY[0],"var(--muted)",LW);
      D.xt.forEach(function(s){
        line(O(s),D.axY[0],O(s),D.axY[0]-0.06,"var(--muted)",LW);
        txt(O(s),D.axY[0],0,18,String(s),"middle","var(--muted)");
      });
      txt(O(250),D.axY[0],0,34,"шаг обучения","middle","var(--muted)");
      txt(O(0),D.axY[1],0,-12,title,"start","var(--fg)",1);

      path(tr.map(function(p){return [O(p[0]),p[1]];}),"var(--train)");
      path(va.map(function(p){return [O(p[0]),p[1]];}),"var(--val)",2.2,"6 4");

      var s0=tr[0], sT=tr[tr.length-1], sV=va[va.length-1];
      dot(O(s0[0]),s0[1],"var(--fg)");
      txt(O(s0[0]),s0[1],PAD+2,-PAD,s0[1].toFixed(2),"start","var(--fg)");
      dot(O(sT[0]),sT[1],"var(--train)");
      dot(O(sV[0]),sV[1],"var(--val)");
      marks(O);
    }

    // левая панель: смоук-тест
    panel(0,"по умолчанию · 46 символов",D.smoke.train,D.smoke.val,function(O){
      var sp=D.smoke.split;
      line(O(sp[0]),D.axY[0],O(sp[0]),3.55,"var(--gap)",1.4,"3 4");
      txt(O(sp[0]),3.55,0,-9,"здесь разошлись","middle","var(--gap)");
      txt(O(500),1.60,-PAD,16,"train 1.6","end","var(--train)");
      txt(O(500),3.00,-PAD,-10,"val ползёт вверх","end","var(--val)");
      arrow(O(430),2.55,O(490),2.90,"var(--val)");
      txt(O(250),2.05,0,20,"память вместо правила","middle","var(--muted)");
    });

    // правая панель: полный режим
    panel(D.panelDX,"полный · 65 символов",D.full.train,D.full.val,function(O){
      txt(O(500),1.50,-PAD,20,"обе к 1.5","end","var(--both)");
      arrow(O(300),1.45,O(470),1.45,"var(--both)");
      txt(O(300),1.45,-PAD,4,"вместе","end","var(--both)");
    });

    // легенда одной строкой под схемой
    var lx=0, ly=1.05;
    line(lx,ly,lx+40,ly,"var(--train)",2.4);
    txt(lx+40,ly,PAD,4,"train","start","var(--fg)");
    line(lx+150,ly,lx+190,ly,"var(--val)",2.4,"6 4");
    txt(lx+190,ly,PAD,4,"val (последние 10%)","start","var(--fg)");
    txt(lx+560,ly,0,4,"старт = ln(словарь): 3.83 и 4.17","middle","var(--muted)");
  }catch(e){
    host.innerHTML='<div class="fail"><b>Схема не построилась.</b> Она должна показывать: '+
      'слева режим по умолчанию — train падает с 3.83 до 1.6, val доходит до ~2.6 около шага 150 и ползёт вверх (переобучение); '+
      'справа полный режим — train и val вместе идут с 4.17 к 1.5 за 500 шагов.</div>';
  }
})();
</script>
</body>
</html>
