- concept: матричное умножение преобразует последнюю ось тензора и сохраняет ведущие оси
  question: Тензор x имеет форму (B, N, D_in), а матрица W — форму (D_in, D_out). Какую форму получит выражение x @ W?
  explanation: Операция сопоставляет последнюю ось x с первой осью W. Оси B и N считаются ведущими и переносятся в результат без изменений, а D_in заменяется на D_out.
  kind: choice
  options:
    - (B, N, D_out)
    - (D_in, B, D_out)
    - (B, D_out, N)
  correct: 0
  id: 013-linear-1
  fingerprint: 3ed3065d
- concept: смещение линейного слоя транслируется по всем ведущим осям
  question: Почему к результату формы (B, N, D_out) можно напрямую прибавить вектор смещения формы (D_out) без циклов по батчу и позициям?
  explanation: У линейного слоя есть одно смещение на каждый выходной канал. Broadcasting автоматически повторяет этот вектор для всех последовательностей и позиций, не создавая отдельные параметры для каждой из них.
  kind: open
  reference: Размерность вектора смещения совпадает с последней осью результата. Broadcasting рассматривает отсутствующие ведущие оси как единичные и применяет один и тот же вектор смещения ко всем элементам по осям B и N.
  id: 013-linear-2
  fingerprint: 13f668d6
- concept: линейное преобразование поддерживает необязательное смещение
  question: Заполните пропуск так, чтобы функция корректно работала и с вектором смещения, и с bias=None.
  explanation: Матричное умножение выполняется всегда, а смещение добавляется только тогда, когда оно передано. Попытка вычислить y + None завершилась бы ошибкой.
  kind: cloze
  template: |-
    y = x @ W
    if bias is not None:
        y = ___
    return y
  answer: y + bias
  accept:
    - bias + y
    - y.add(bias)
  id: 013-linear-3
  fingerprint: e8065713
