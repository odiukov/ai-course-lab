- concept: для выбора обобщающего чекпойнта используют минимум validation loss
  question: Training loss продолжает снижаться, а validation loss после некоторого момента начинает расти. Какой чекпойнт разумнее выбрать для работы с новым текстом?
  explanation: Минимум validation loss отмечает чекпойнт, который лучше всего предсказывает отложенные данные. Более позднее падение training loss при росте validation loss означает, что дальнейшая подгонка уже ухудшает обобщение.
  kind: choice
  options:
    - Последний, потому что у него минимальный training loss
    - Чекпойнт около минимума validation loss
    - Первый, потому что он ещё не успел запомнить обучающие данные
  correct: 1
  id: 041-loss-curves-1
  fingerprint: 131b897f
- concept: валидационные данные должны быть исключены из обновления параметров модели
  question: Команда называет часть корпуса валидационной, но периодически обучает модель и на этих примерах. Почему полученный validation loss нельзя считать надёжной оценкой качества на новых данных?
  explanation: Валидационная часть должна оставаться вне обновлений параметров, иначе она превращается в часть обучающих данных. В уроке последние 10% текста отложены именно для независимой проверки обобщения.
  kind: choice
  options:
    - 'Произошла утечка данных: модель подстраивалась под примеры, которыми её проверяют'
    - Валидационная выборка обязательно должна быть больше обучающей
    - Validation loss корректен только для моделей без attention
  correct: 0
  id: 041-loss-curves-2
  fingerprint: c079aa53
