- concept: стопка Transformer-блоков сохраняет форму скрытых представлений
  question: На вход стопке Transformer-блоков подан тензор скрытых представлений формы `(B, N, d)`. Каждый блок сохраняет размерность модели. Какую форму имеет выход всей стопки?
  explanation: Transformer-блок уточняет скрытые представления, но не меняет их форму. Размер словаря `V` появляется только после выходной проекции `lm_head`.
  kind: choice
  options:
    - '`(B, N, d)`'
    - '`(B, d, N)`'
    - '`(B, N, V)`'
  correct: 0
  id: 006-schema-1
  fingerprint: 7bb163da
- concept: порядок преобразований в языковой Transformer-модели
  question: Расположите этапы прямого прохода GPT-подобной модели в правильном порядке.
  explanation: Сначала дискретные идентификаторы становятся векторами. Блоки последовательно уточняют эти векторы, а финальная проекция превращает каждый вектор размерности `d` в набор оценок по всему словарю.
  kind: order
  items:
    - Преобразовать идентификаторы токенов в эмбеддинги и добавить информацию о позициях
    - Пропустить скрытые представления через стопку Transformer-блоков
    - Применить финальную нормализацию
    - Спроецировать скрытые представления в оценки токенов с помощью `lm_head`
    - Получить логиты формы `(B, N, V)`
  id: 006-schema-2
  fingerprint: 1b9d1b9f
- concept: выходная LM-голова заменяет скрытую размерность на размер словаря
  question: Объясните, почему `lm_head` преобразует тензор формы `(B, N, d)` в `(B, N, V)`, не меняя оси батча и последовательности.
  explanation: 'Выходная голова применяется отдельно к каждой позиции. Она меняет только последнюю ось: вместо скрытых признаков модель выдаёт оценку для каждого возможного следующего токена.'
  kind: open
  reference: '`lm_head` независимо обрабатывает скрытый вектор каждой позиции и линейно переводит его из пространства размерности `d` в пространство размерности `V`. Поэтому для каждого элемента батча и каждой позиции появляются логиты по всем токенам словаря, а оси `B` и `N` сохраняются.'
  id: 006-schema-3
  fingerprint: 382a5656
