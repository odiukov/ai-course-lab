- concept: MFU измеряет долю теоретической вычислительной мощности, фактически использованную моделью
  question: Ускоритель теоретически способен выполнять 180 триллионов операций в секунду, а обучение модели достигает 72 триллионов. Чему равен MFU в долях от единицы?
  explanation: 'MFU — отношение достигнутой производительности к теоретическому пику: 72 / 180 = 0.4. Значит, модель использует 40% пиковой вычислительной мощности.'
  kind: numeric
  answer: 0.4
  tolerance: 0.01
