- concept: прямой проход языковой модели возвращает сырые логиты для кросс-энтропии
  question: Почему gpt_forward должен возвращать логиты, а не вероятности после softmax?
  explanation: LM-голова выдаёт сырые оценки формы (B, N, V). Их передают напрямую в кросс-энтропию, которая устойчиво нормализует оценки внутри вычисления loss. Softmax нужен позднее при сэмплировании следующего токена.
  kind: open
  reference: Кросс-энтропия для классификационных логитов сама выполняет устойчивое объединение log-softmax и отрицательного логарифмического правдоподобия. Предварительный softmax меняет ожидаемый интерфейс функции потерь, ухудшает численную устойчивость и может привести к неверным градиентам.
  id: 030-gpt-forward-2
  fingerprint: a639e158
