- concept: RMSNorm вычисляет нормировочный масштаб независимо для каждой позиции по оси каналов
  question: Тензор скрытых представлений имеет оси «пачка, позиции, каналы». По какой оси RMSNorm должен усреднять квадраты элементов?
  explanation: У каждой позиции должен быть собственный знаменатель RMS. Поэтому квадраты усредняются только по последней оси с d каналами; смешивание позиций или элементов пачки заставило бы их масштабы влиять друг на друга.
  kind: choice
  options:
    - Только по оси каналов, отдельно для каждой позиции каждого элемента пачки
    - По осям пачки и позиций, отдельно для каждого канала
    - Сразу по всем элементам тензора
    - По осям позиций и каналов, отдельно для каждого элемента пачки
  correct: 0
  id: 016-rms-norm-1
  fingerprint: eeeab5dd
- concept: эпсилон в знаменателе RMSNorm предотвращает деление на ноль
  question: Зачем в RMSNorm используют знаменатель вида sqrt(mean(x²) + eps), особенно если вектор скрытого состояния состоит из нулей?
  explanation: Без eps нулевая позиция дала бы деление на ноль. Добавка порядка 1e-6 обеспечивает численную устойчивость и почти не влияет на нормализацию векторов с обычным масштабом.
  kind: open
  reference: Для нулевого вектора среднее квадратов и его корень равны нулю. Малое положительное eps делает знаменатель ненулевым, поэтому деление остаётся определённым и не создаёт бесконечности или NaN.
  id: 016-rms-norm-2
  fingerprint: 24ba5e61
