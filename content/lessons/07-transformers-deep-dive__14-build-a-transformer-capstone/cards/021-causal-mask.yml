- concept: маскирование логитов до softmax сохраняет нормировку весов по разрешённым позициям
  question: Почему в attention запрещённые позиции маскируют до softmax, а не обнуляют их веса после softmax без повторной нормировки?
  explanation: Если сначала выполнить softmax, запрещённые позиции уже получат часть вероятностной массы. Их последующее обнуление уменьшит сумму весов. Добавление −∞ к запрещённым логитам до softmax исключает их из нормировки, поэтому разрешённые веса сами суммируются в единицу.
  kind: choice
  options:
    - После обнуления уже нормированных весов их сумма может стать меньше единицы
    - Softmax можно вычислять только для положительных логитов
    - Обнуление после softmax меняет размерность тензора
    - До softmax маска делает все разрешённые логиты одинаковыми
  correct: 0
  id: 021-causal-mask-1
  fingerprint: 0675b85f
- concept: одна позиционная маска attention может транслироваться по осям батча и голов
  question: Тензор оценок внимания имеет форму (batch, heads, query, key). Почему одну маску формы (query, key) можно применить ко всему тензору?
  explanation: Каузальное ограничение зависит от взаимного положения query и key, а не от содержимого последовательности или номера головы. Поэтому одна треугольная матрица может быть применена ко всем элементам батча и всем головам через broadcasting.
  kind: choice
  options:
    - Допустимость связи определяется номерами query и key, поэтому маска транслируется по батчу и головам
    - Все последовательности в батче содержат одинаковые токены
    - Все головы attention вычисляют одинаковые оценки
    - Softmax автоматически удаляет оси batch и heads
  correct: 0
