- concept: RoPE применяет позиционно-зависимый поворот к запросам и ключам внутри attention
  question: Какие тензоры нужно преобразовать с помощью RoPE перед вычислением attention scores?
  explanation: RoPE поворачивает запросы и ключи в зависимости от их позиций. Благодаря свойствам поворота их скалярное произведение отражает относительное смещение позиций.
  kind: cloze
  template: q_rot, k_rot = apply_rope(___, ___, positions)
  answer: q, k
  accept:
    - Q, K
    - query, key
    - queries, keys
  id: 045-exercises-1
  fingerprint: f8de73ff
- concept: MTP дополняет обучение целью предсказания более далёких будущих токенов
  question: Объясни своими словами, чем обучающий сигнал MTP отличается от обычного next-token prediction.
  explanation: Основная голова по-прежнему обучается предсказывать следующий токен, а дополнительная MTP-голова создаёт вспомогательный loss для более далёкого токена. Это может сделать обучающий сигнал богаче, хотя улучшение validation loss не гарантировано.
  kind: open
  reference: При обычном обучении модель предсказывает только непосредственно следующий токен. MTP добавляет вспомогательную цель, требующую по тому же контексту предсказывать и более далёкий будущий токен, поэтому модель совместно учится нескольким горизонтам продолжения.
  id: 045-exercises-2
  fingerprint: 723b46d8
- concept: разреженная маршрутизация MoE увеличивает общую ёмкость модели без пропорционального роста вычислений на токен
  question: Почему MoE-слой может содержать значительно больше параметров, чем плотный FFN, не используя все эти параметры для каждого токена?
  explanation: В MoE параметры хранятся во всех экспертах, но для конкретного токена активируется лишь выбранное роутером подмножество. Поэтому общая ёмкость растёт быстрее, чем вычислительная стоимость одного токена.
  kind: choice
  options:
    - Роутер направляет каждый токен только в выбранное подмножество экспертов
    - Все эксперты вычисляются, но их веса после этого усредняются
    - Эксперты используются только во время валидации
    - Роутер удаляет неактивные параметры из модели перед каждым проходом
  correct: 0
  id: 045-exercises-3
  fingerprint: cf8442b3
