- concept: плотная нумерация символов исключает неиспользуемые строки из таблицы эмбеддингов
  question: Почему для символьной модели символам обычно назначают последовательные идентификаторы, а не используют их коды Unicode напрямую?
  explanation: В корпусе урока встречается лишь 65 уникальных символов. Плотные идентификаторы позволяют создать ровно столько строк эмбеддингов, сколько символов действительно используется.
  kind: open
  reference: Размер таблицы эмбеддингов определяется диапазоном идентификаторов. Последовательная нумерация оставляет по строке только для символов словаря, тогда как разреженные коды Unicode потребовали бы множество неиспользуемых строк.
  id: 004-tokenizer-1
  fingerprint: e70a64b2
- concept: обратный словарь itos строится перестановкой ключей и значений словаря stoi
  question: Заполните пропуск так, чтобы построить отображение из идентификаторов обратно в символы.
  explanation: Метод items() возвращает пары «символ — идентификатор». Перестановка элементов каждой пары создаёт обратное отображение, необходимое для декодирования.
  kind: cloze
  template: 'itos = {i: c for c, i in ___}'
  answer: stoi.items()
  accept:
    - stoi.items()
  id: 004-tokenizer-2
  fingerprint: c2251c99
- concept: символьный токенизатор создаёт отдельный токен для каждого символа, включая пробельные символы
  question: Как символьный токенизатор обработает строку «AI\nlab», если все её символы входят в словарь?
  explanation: Функция encode обращается к stoi для каждого символа строки. Поэтому буквы и перевод строки сохраняются как отдельные токены, а decode может восстановить исходный текст.
  kind: choice
  options:
    - Создаст отдельный токен для каждого символа, в том числе для перевода строки
    - Создаст по одному токену для каждого слова и отбросит перевод строки
    - Представит всю строку одним токеном
  correct: 0
  id: 004-tokenizer-3
  fingerprint: b74d4575
