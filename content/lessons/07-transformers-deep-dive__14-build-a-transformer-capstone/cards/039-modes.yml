- concept: смоук-тест проверяет работоспособность обучающего конвейера, но не качество освоенного языка
  question: Маленькая Transformer-модель успешно обучилась на крошечном фрагменте текста, а генератор начал выдавать символы ожидаемого формата. Какой вывод обоснован?
  explanation: Смоук-тест способен обнаружить поломки прямого прохода, маски, функции потерь, оптимизатора и генератора. Крошечный обучающий набор, однако, позволяет модели просто запомнить данные и ничего не говорит о языковом обобщении.
  kind: choice
  options:
    - Модель освоила грамматику и способна обобщать на новые тексты
    - Основные части обучающего конвейера работают вместе, но языковые способности модели ещё не доказаны
    - Низкий training loss гарантирует такое же качество на независимом корпусе
    - Успешная генерация подтверждает отсутствие переобучения
  correct: 1
  id: 039-modes-1
  fingerprint: 22f4a3bf
- concept: расхождение training loss и validation loss служит признаком переобучения
  question: Объясни своими словами, что происходит, если training loss продолжает снижаться, а validation loss после первоначального снижения начинает расти.
  explanation: Training loss измеряет подгонку к данным, на которых обновлялись параметры, а validation loss — качество на отложенных данных. Их расхождение показывает, что модель начала запоминать особенности обучающего набора.
  kind: open
  reference: 'Модель всё лучше подгоняется под обучающие примеры, но хуже предсказывает независимые данные. Это признак переобучения: дальнейшее улучшение training loss отражает запоминание корпуса, а не улучшение обобщения.'
  id: 039-modes-2
  fingerprint: 1f99965f
