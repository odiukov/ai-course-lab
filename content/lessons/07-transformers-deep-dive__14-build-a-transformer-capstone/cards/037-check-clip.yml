- concept: коэффициент масштабирования при clipping равен отношению порога к исходной глобальной норме
  question: Глобальная норма градиентов равна 8, а максимальная допустимая норма — 2. На какой коэффициент будут умножены все градиенты?
  explanation: При превышении порога общий коэффициент равен 2/8 = 0.25. Все градиенты масштабируются одинаково, поэтому новая глобальная норма становится равной порогу.
  kind: numeric
  answer: 0.25
  tolerance: 0.001
  id: 037-check-clip-1
  fingerprint: a49c7896
- concept: равномерное масштабирование сохраняет направление совокупного вектора градиентов
  question: Как изменится направление совокупного вектора градиентов после ограничения глобальной нормы?
  explanation: Умножение всего вектора на один положительный коэффициент меняет его длину, но не направление. При норме 7.3 и пороге 1.0 именно так сохраняется направление шага.
  kind: choice
  options:
    - Не изменится, потому что все компоненты умножаются на один положительный коэффициент
    - Повернётся к координатной оси с наибольшей компонентой
    - Станет противоположным исходному направлению
    - Изменится непредсказуемо из-за независимого ограничения каждой компоненты
  correct: 0
