- concept: RMSNorm стабилизирует масштаб входа в преобразующую ветвь
  question: Остаточные прибавления постепенно увеличили величину активаций Transformer-блока. Как RMSNorm помогает следующей преобразующей ветви?
  explanation: RMSNorm делит координаты на общий среднеквадратичный масштаб. Это не удаляет накопленную информацию, но не позволяет слишком крупным значениям бесконтрольно усиливаться в последующих линейных преобразованиях и attention.
  kind: choice
  options:
    - Делит активации на их среднеквадратичную величину, возвращая им контролируемый масштаб
    - Вычитает накопленные остаточные прибавления из скрытого состояния
    - Обнуляет каналы с самыми большими значениями
    - Преобразует активации в вероятностное распределение
  correct: 0
  id: 015-rmsnorm-theory-1
  fingerprint: f924af20
- concept: pre-norm нормализует вход ветви, не изменяя напрямую остаточный путь
  question: Какая запись соответствует pre-norm Transformer-блоку с RMSNorm и преобразующей ветвью F?
  explanation: При pre-norm нормализованная копия x поступает в ветвь F, а исходный x проходит по остаточному пути без нормализации. Поэтому результат имеет вид x + F(RMSNorm(x)).
  kind: choice
  options:
    - y = RMSNorm(x + F(x))
    - y = x + F(RMSNorm(x))
    - y = F(x) + RMSNorm(F(x))
    - y = F(RMSNorm(x))
  correct: 1
  id: 015-rmsnorm-theory-2
  fingerprint: b92e77cf
- concept: обучаемый коэффициент RMSNorm задаёт отдельный масштаб каждому каналу
  question: Зачем RMSNorm после деления на общий среднеквадратичный масштаб умножает каждый канал на собственный обучаемый коэффициент?
  explanation: Без обучаемых коэффициентов все каналы были бы жёстко привязаны к одному правилу масштаба. Поканальные множители сохраняют стабильность нормализации, но оставляют модели свободу выбирать значимость разных признаков.
  kind: open
  reference: 'Общая нормализация стабилизирует величину вектора, а отдельные обучаемые коэффициенты позволяют модели восстановить полезные различия масштабов между каналами: одни каналы усилить, другие ослабить.'
  id: 015-rmsnorm-theory-3
  fingerprint: 528f9226
