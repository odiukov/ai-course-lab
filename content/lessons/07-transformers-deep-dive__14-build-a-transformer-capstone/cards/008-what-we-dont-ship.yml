- concept: без KV cache суммарная длина повторно обрабатываемых префиксов растёт квадратично
  question: Модель генерирует 96 токенов без KV cache. Длины префикса при последовательных вызовах attention растут от единичной длины до 96. Сколько позиций префикса будет обработано суммарно?
  explanation: Нужно сложить длины всех префиксов. Сумма арифметической прогрессии равна 96 × 97 / два = 4656. KV cache устраняет повторное вычисление ключей и значений для уже обработанных токенов.
  kind: numeric
  answer: 4656
  tolerance: 0.1
  id: 008-what-we-dont-ship-1
  fingerprint: caa73bb3
- concept: обучаемые позиционные эмбеддинги служат простой альтернативой RoPE
  question: Как можно передать Transformer информацию о позициях токенов, если RoPE сознательно не реализуют?
  explanation: Обучаемая таблица сопоставляет каждой позиции в контекстном окне отдельный вектор. Его складывают с токенным эмбеддингом перед Transformer-блоками. Это проще в реализации, хотя RoPE лучше переносит относительную позиционную структуру в attention.
  kind: choice
  options:
    - Полностью удалить позиционную информацию
    - Добавлять номер позиции только к выходным логитам
    - Хранить номера позиций исключительно в KV cache
    - Складывать токенные эмбеддинги с обучаемыми позиционными эмбеддингами
  correct: 3
  id: 008-what-we-dont-ship-2
  fingerprint: 7d281c87
- concept: scaled dot-product attention может автоматически выбрать оптимизированное Flash Attention ядро
  question: Объясни, почему использование `F.scaled_dot_product_attention` не означает отказ от Flash Attention.
  explanation: '`F.scaled_dot_product_attention` задаёт операцию, а не фиксирует конкретное ядро. Поэтому код остаётся простым, а PyTorch может автоматически применить Flash Attention, когда входы удовлетворяют его ограничениям.'
  kind: open
  reference: PyTorch сам выбирает доступное оптимизированное ядро attention. Если устройство, тип данных, формы входов и другие условия поддерживаются, вызов может быть выполнен через Flash Attention; иначе используется совместимая запасная реализация.
  id: 008-what-we-dont-ship-3
  fingerprint: 6c6fd0cd
