- concept: алгоритм преобразования логитов в нормированное распределение с помощью softmax
  question: Расположи операции softmax в правильном порядке.
  explanation: 'Экспоненты делают все величины положительными, а деление на их общую сумму нормирует результат: полученные доли неотрицательны и вместе составляют единицу.'
  kind: order
  items:
    - Вычислить экспоненту каждого логита.
    - Сложить полученные экспоненты.
    - Разделить каждую экспоненту на общую сумму.
