- concept: операции одного шага обучения должны выполняться в порядке forward, backward, обновление параметров и очистка градиентов
  question: Расположите операции одной итерации обучения языковой модели в правильном порядке для варианта, где градиенты очищаются в конце итерации.
  explanation: Сначала модель строит вычислительный граф и loss, затем backward записывает градиенты. После необязательного clipping оптимизатор обновляет параметры, а zero_grad очищает градиенты перед их следующим вычислением.
  kind: order
  items:
    - Получить обучающий батч входов и целей
    - Выполнить прямой проход и вычислить loss
    - Вызвать backward для вычисления градиентов
    - Ограничить норму градиентов
    - Выполнить шаг оптимизатора
    - Обнулить сохранённые градиенты
  id: 035-training-loop-1
  fingerprint: 15279beb
- concept: AdamW использует накопленную статистику градиентов и отдельно применяет затухание весов
  question: Какое описание оптимизатора AdamW наиболее точное?
  explanation: AdamW хранит оценки моментов градиента, поэтому величина обновления зависит от истории. Weight decay применяется отдельно от градиентного шага и сдерживает рост весов.
  kind: choice
  options:
    - Он обновляет все параметры на одинаковую константу независимо от градиентов
    - Он заменяет градиенты случайным шумом и обнуляет большие веса
    - Он адаптирует обновления по статистике прошлых градиентов и отдельно применяет weight decay
    - Он вычисляет градиенты вместо вызова backward
  correct: 2
