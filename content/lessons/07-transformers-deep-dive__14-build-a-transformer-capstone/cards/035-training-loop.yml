- concept: clipping глобальной нормы пропорционально масштабирует градиенты при превышении порога
  question: Глобальная норма градиентов равна 12.6, а допустимый максимум — 2.4. На какой коэффициент примерно будут умножены все градиенты?
  explanation: 'При превышении порога все градиенты масштабируются одним коэффициентом: 2.4 / 12.6 ≈ 0.1905. Их общее направление сохраняется, а глобальная норма уменьшается до заданного максимума.'
  kind: numeric
  answer: 0.1905
  tolerance: 0.001
  id: 035-training-loop-3
  fingerprint: 39be9cca
