- concept: SwiGLU последовательно вычисляет две проекции, активирует одну ветвь, применяет поэлементный вентиль и выполняет выходную проекцию
  question: Расположите операции прямого прохода SwiGLU FFN в правильном порядке.
  explanation: SwiGLU разветвляет вход на две проекции. SiLU применяется только к ветви вентиля, после чего ветви перемножаются поэлементно, а выходная проекция возвращает результат в пространство скрытых представлений.
  kind: order
  items:
    - Вычислить независимые проекции linear(x, W_gate) и linear(x, W_value)
    - Применить SiLU к результату проекции W_gate
    - Поэлементно умножить активированную ветвь на результат проекции W_value
    - Пропустить произведение через linear с матрицей W_out
  id: 018-swiglu-1
  fingerprint: 5c6be603
- concept: ветви SwiGLU несимметричны из-за применения SiLU только к одной проекции
  question: Что обычно произойдёт с результатом SwiGLU, если поменять местами разные матрицы W_gate и W_value?
  explanation: Хотя конечное поэлементное умножение коммутативно, выражения SiLU(linear(x, W_gate)) и linear(x, W_value) играют разные роли. После перестановки SiLU получает другой аргумент, поэтому результат в общем случае меняется.
  kind: choice
  options:
    - Результат обязательно останется прежним, потому что поэлементное умножение коммутативно
    - Результат изменится, потому что SiLU применяется только к проекции W_gate
    - Возникнет ошибка формы, даже если обе проекции имеют одинаковую выходную ширину
  correct: 1
