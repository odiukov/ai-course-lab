- concept: обучаемые матрицы SwiGLU должны сохраняться между прямыми проходами
  question: Почему нельзя создавать новые случайные матрицы внутри swiglu_ffn при каждом вызове?
  explanation: Прямой проход должен использовать переданные обучаемые параметры. Повторная случайная инициализация уничтожает накопленные обновления и делает поведение слоя нестабильным.
  kind: open
  reference: Матрицы должны быть постоянными обучаемыми параметрами модели. Если пересоздавать их при каждом прямом проходе, оптимизатор будет обновлять уже не те веса, которые используются следующим вызовом, и функция будет случайно меняться даже для одного и того же входа.
  id: 018-swiglu-3
  fingerprint: 4ad6b474
