- concept: подслои attention и FFN используют независимые обучаемые параметры нормализации
  question: Как следует параметризовать RMSNorm в pre-norm Transformer-блоке с ветвями attention и FFN?
  explanation: Attention и FFN выполняют разные преобразования и получают входы из разных состояний residual stream, поэтому каждому подслою нужен собственный обучаемый масштаб RMSNorm. Общий вектор искусственно связывает настройку двух ветвей.
  kind: choice
  options:
    - Использовать один общий вектор масштаба для обеих ветвей
    - Использовать отдельный вектор масштаба перед каждой ветвью
    - Обучать масштаб только перед attention, а перед FFN использовать единицы
  correct: 1
  id: 025-block-1
  fingerprint: a6d21fb4
- concept: при нулевом выходе преобразующих ветвей остаточные связи превращают Transformer-блок в тождественное отображение
  question: Все веса и смещения ветвей attention и FFN в pre-norm Transformer-блоке занулены, а параметры нормализации оставлены без изменений. Каким должен быть выход блока для произвольного входа и почему?
  explanation: 'При занулённых ветвях блок вычисляет только остаточные сложения: сначала x + 0, затем снова x + 0. Если выход отличается от входа, нормализованный тензор, вероятно, ошибочно записан вместо исходного residual stream.'
  kind: open
  reference: Выход должен в точности совпасть со входом. Обе преобразующие ветви возвращают нулевые тензоры, поэтому каждое остаточное сложение имеет вид x + 0. RMSNorm применяется только к входу ветви и не заменяет состояние остаточного пути.
  id: 025-block-2
  fingerprint: 54b58887
