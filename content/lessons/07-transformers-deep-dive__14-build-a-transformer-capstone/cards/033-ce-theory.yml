- concept: кросс-энтропия для one-hot цели равна отрицательному логарифму вероятности правильного токена
  question: Заполни формулу потери для одной позиции, где p_истинного — предсказанная вероятность правильного следующего токена.
  explanation: При one-hot цели слагаемые для всех неправильных классов обнуляются, поэтому остаётся −ln вероятности правильного токена. Чем меньше эта вероятность, тем больше штраф.
  kind: cloze
  template: L = ___
  answer: -ln(p_истинного)
  accept:
    - -log(p_истинного)
    - ln(1/p_истинного)
  id: 033-ce-theory-1
  fingerprint: bfc36f09
- concept: экспонента среднего кросс-энтропийного loss интерпретируется как эффективное число равновероятных вариантов
  question: Средний кросс-энтропийный loss языковой модели равен 2.08. Примерно скольким равновероятным вариантам соответствует такая неопределённость?
  explanation: 'Нужно обратить логарифм: exp(2.08) ≈ 8. Это значение также называют перплексией: модель в среднем испытывает неопределённость, сравнимую с выбором из восьми равновероятных вариантов.'
  kind: numeric
  answer: 8
  tolerance: 0.15
  id: 033-ce-theory-2
  fingerprint: 1dbbc95c
- concept: общий кросс-энтропийный loss получается усреднением потерь по целевым позициям батча
  question: Для каждой целевой позиции батча вычислен штраф −ln(p_истинного). Как обычно получают один скалярный loss для шага обучения?
  explanation: Потери отдельных позиций обычно усредняют по батчу и длине последовательности. Так масштаб loss не растёт просто из-за увеличения числа обрабатываемых позиций.
  kind: choice
  options:
    - Берут максимальный штраф среди всех позиций
    - Усредняют штрафы по всем целевым позициям
    - Берут штраф только для последней позиции каждой последовательности
    - Перемножают штрафы всех позиций
  correct: 1
  id: 033-ce-theory-3
  fingerprint: cb933330
