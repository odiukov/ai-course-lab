- concept: tied embeddings экономят параметры за счёт общей матрицы входных и выходных представлений
  question: В языковой модели словарь содержит 768 токенов, а ширина эмбеддинга равна 96. В модели без tying используются отдельная таблица входных эмбеддингов и выходная LM-голова без смещения. Сколько обучаемых параметров сэкономит tying этих матриц?
  explanation: 'Tying удаляет отдельную выходную матрицу и использует транспонированную таблицу эмбеддингов. Поэтому экономия равна размеру одной матрицы: 768 × 96 = 73728 параметров.'
  kind: numeric
  answer: 73728
  tolerance: 0.1
  id: 026-init-theory-2
  fingerprint: 607b1128
