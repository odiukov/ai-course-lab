- concept: стартовый кросс-энтропийный loss равен натуральному логарифму размера словаря при равномерных предсказаниях
  question: Необученная языковая модель распределяет вероятность поровну между всеми токенами. В словаре 256 токенов. Чему примерно равен кросс-энтропийный loss?
  explanation: При равномерном распределении вероятность правильного токена равна 1/|V|, поэтому loss равен −ln(1/|V|) = ln(|V|). Для 256 токенов ln(256) ≈ 5.55. В уроке аналогичная проверка для 65 символов даёт примерно 4.17.
  kind: numeric
  answer: 5.55
  tolerance: 0.02
  id: 027-init-1
  fingerprint: 54c6c351
- concept: малый масштаб начальных весов удерживает стартовые логиты в несатурированном диапазоне softmax
  question: Почему матрицы Transformer обычно инициализируют случайными значениями небольшого масштаба?
  explanation: Крупные начальные веса могут породить большие по модулю логиты. Тогда softmax почти всю вероятность отдаёт одному варианту, хотя модель ещё ничего не выучила. Небольшой случайный разброс, например порядка 0.02 в уроке, сохраняет различия между параметрами без ранней насыщенности.
  kind: choice
  options:
    - Чтобы все токены сразу получили строго одинаковые скрытые представления
    - Чтобы стартовые логиты не стали чрезмерно разнесёнными и softmax не выдавал необоснованно уверенные предсказания
    - Чтобы градиенты всех параметров после первого шага стали одинаковыми
    - Чтобы исключить необходимость вычислять кросс-энтропию
