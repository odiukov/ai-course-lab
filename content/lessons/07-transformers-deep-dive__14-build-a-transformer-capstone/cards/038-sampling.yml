- concept: стохастическое сэмплирование может разорвать цикл, возникающий при жадной генерации
  question: Объясни своими словами, почему top-k-сэмплирование способно вывести генерацию из повторяющегося цикла, а жадный выбор — нет.
  explanation: Случайный выбор внутри множества наиболее вероятных токенов делает следующий токен недетерминированным. Другой выпавший токен изменяет дальнейший контекст и может разорвать повторение.
  kind: open
  reference: Жадный алгоритм всегда выбирает один и тот же максимальный логит для одинакового контекста, поэтому повторившийся контекст воспроизводит прежнее продолжение. При top-k-сэмплировании из того же распределения может случайно выпасть другой допустимый токен, после чего изменятся контекст и последующие предсказания.
  id: 038-sampling-3
  fingerprint: 5cf78081
