- concept: после отсечения top-k вероятности оставшихся токенов перенормируются
  question: Top-k оставил четыре токена с исходными вероятностями 0.42, 0.28, 0.14 и 0.07. Какова новая вероятность первого токена после перенормировки?
  explanation: Суммарная масса оставшихся токенов равна 0.91. Поэтому новая вероятность первого токена равна 0.42 / 0.91 ≈ 0.4615; вероятности отброшенных токенов становятся нулевыми.
  kind: numeric
  answer: 0.4615
  tolerance: 0.001
  id: 038-sampling-1
  fingerprint: 5d4685df
- concept: параметр k управляет компромиссом между разнообразием и отсечением маловероятного хвоста
  question: Что обычно происходит при увеличении k в top-k-сэмплировании при неизменных логитах?
  explanation: Чем больше k, тем шире множество токенов, из которого разрешено сэмплировать. Это обычно повышает разнообразие, но ослабляет защиту от маловероятных продолжений.
  kind: choice
  options:
    - В выбор попадает больше маловероятных токенов, поэтому разнообразие обычно растёт
    - Результат становится полностью детерминированным
    - Вероятности всех токенов словаря становятся одинаковыми
    - Модель перестаёт учитывать контекст
  correct: 0
