- concept: additive attention обучает нелинейное правило совместимости query и key
  question: Почему additive attention может присвоить высокий score векторам query и key, которые не похожи по направлению в исходных пространствах?
  explanation: В выражении s_{t,i} = v_a^T tanh(W_a q_t + U_a k_i) преобразования W_a и U_a не требуют прямого совпадения исходных координат. Вместе с нелинейностью tanh они позволяют выучить сочетания разных признаков, полезные для совместимости.
  kind: choice
  options:
    - Обучаемые преобразования переводят их признаки во внутреннее пространство, где нелинейная сеть может распознать полезное сочетание
    - Softmax автоматически делает непохожие векторы совместимыми
    - Additive attention перед сравнением заменяет query средним значением всех key
    - Score определяется только длинами исходных векторов
  correct: 0
  id: 018-additive-score-concept-1
  fingerprint: c6d4ff5e
- concept: проекции query и key в additive attention должны иметь одну внутреннюю размерность
  question: В какое пространство должны отображаться query и key, чтобы их проекции можно было сложить в additive attention?
  explanation: Исходные query и key могут иметь разные размерности, но W_a q_t и U_a k_i должны иметь одинаковую форму (d_attn,). Тогда их можно сложить перед применением tanh.
  kind: cloze
  template: W_a q_t ∈ ___ и U_a k_i ∈ ___
  answer: R^{d_attn}
  accept:
    - ℝ^{d_attn}
    - R^d_attn
    - пространство размерности d_attn
  id: 018-additive-score-concept-2
  fingerprint: fc5a3986
