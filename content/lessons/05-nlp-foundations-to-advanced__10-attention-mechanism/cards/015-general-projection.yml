- concept: форма матрицы general score определяется размерностями состояний декодера и энкодера
  question: Пусть q ∈ ℝ^(d_q) — состояние декодера, а h_i ∈ ℝ^(d_h) — состояние энкодера. General score вычисляется как s_i = h_iᵀ(Wᵀq). Какую форму должна иметь матрица W?
  explanation: Чтобы умножение Wᵀq было определено и давало вектор размерности d_h, матрица Wᵀ должна иметь форму d_h × d_q. Следовательно, W имеет форму d_q × d_h. Полученную проекцию уже можно скалярно умножить на h_i.
  kind: choice
  options:
    - d_q × d_h
    - d_h × d_q
    - d_q × d_q
    - d_h × d_h
  correct: 0
  id: 015-general-projection-1
  fingerprint: 1c6e3a92
- concept: general attention проецирует состояние декодера перед вычислением скалярных произведений с состояниями энкодера
  question: Заполните пропуск в реализации general attention.
  explanation: Обучаемое преобразование Wᵀ переводит состояние декодера в пространство состояний энкодера. После этого каждая оценка получается обычным скалярным произведением соответствующего состояния энкодера с projected.
  kind: cloze
  template: |-
    projected = ___
    scores = encoder_states @ projected
  answer: W.T @ decoder_state
  accept:
    - W.transpose() @ decoder_state
    - Wᵀ @ decoder_state
  id: 015-general-projection-2
  fingerprint: b3b4985f
