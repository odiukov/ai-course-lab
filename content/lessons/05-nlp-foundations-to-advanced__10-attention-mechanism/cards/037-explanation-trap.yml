- concept: причинную роль attention проверяют вмешательством и сравнением предсказаний
  question: Какой эксперимент лучше всего проверяет, было ли внимание к конкретному токену причиной предсказания модели?
  explanation: 'Величина веса показывает наблюдаемое распределение внимания, но не причинность. Абляция или контрфактическая замена вмешивается в вычисление: если вслед за вмешательством систематически меняется результат, это служит свидетельством причинного влияния.'
  kind: choice
  options:
    - Построить более контрастную тепловую карту весов attention
    - Отключить или перераспределить внимание к токену и проверить, изменилось ли предсказание
    - Найти токен с максимальным весом attention
    - Усреднить веса attention по всем головам
  correct: 1
  id: 037-explanation-trap-1
  fingerprint: 940a7fcd
- concept: неизменность предсказания после изменения attention опровергает необходимость исходного распределения, но не бесполезность attention вообще
  question: Распределение attention заметно изменили, однако предсказание модели осталось прежним. Что из этого можно заключить, а что заключать нельзя?
  explanation: Устойчивый ответ после контрфактического изменения ослабляет причинную интерпретацию исходной карты. При этом вывод относится к проверенному вмешательству и примеру, а не ко всем механизмам attention и всем входам.
  kind: open
  reference: Можно заключить, что исходное распределение весов не было необходимым для данного предсказания и само по себе не доказывает ход рассуждения. Нельзя на основании одного такого опыта утверждать, что attention вообще не влияет на модель или бесполезен во всех случаях.
  id: 037-explanation-trap-2
  fingerprint: f1dc599c
- concept: карты attention подходят для выдвижения гипотез, но не являются самостоятельным доказательством объяснения
  question: Какой вывод корректно делать только по карте attention, без абляций и контрфактических проверок?
  explanation: Большой вес вроде 0,62 помогает обнаружить интересную позицию, сравнить головы или сформулировать гипотезу. Причинным объяснением такая карта становится только при дополнительной проверке влияния на результат.
  kind: choice
  options:
    - Позиция с максимальным весом обязательно определила ответ модели
    - Карта полностью восстанавливает внутренний ход рассуждения модели
    - Выделенные позиции образуют гипотезу о возможной связи, которую следует проверить вмешательством
    - Все позиции с малыми весами не влияют на последующие слои
  correct: 2
  id: 037-explanation-trap-3
  fingerprint: 28af8a60
