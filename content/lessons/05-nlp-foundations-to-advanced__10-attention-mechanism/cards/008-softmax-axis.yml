- concept: softmax сохраняет порядок оценок внимания
  question: Объясни своими словами, почему позиция с большей оценкой внимания после softmax получает больший вес.
  explanation: 'Softmax меняет масштаб оценок, но не переставляет их по величине: монотонность экспоненты и общий знаменатель сохраняют исходный порядок.'
  kind: open
  reference: Экспонента является строго возрастающей функцией, поэтому большая оценка даёт большую экспоненту. Все экспоненты делятся на один и тот же положительный знаменатель, так что их порядок сохраняется.
  id: 008-softmax-axis-2
  fingerprint: df3ccd06
