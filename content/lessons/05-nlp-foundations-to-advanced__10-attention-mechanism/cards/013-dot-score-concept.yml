- concept: dot score равен сумме попарных произведений координат query и key
  question: Query равен (11, -13), а key — (17, 19). Чему равен dot score между ними?
  explanation: 'Скалярное произведение вычисляется как сумма произведений соответствующих координат: 11·17 + (-13)·19 = 187 - 247 = -60.'
  kind: numeric
  answer: -60
  tolerance: 0.01
  id: 013-dot-score-concept-1
  fingerprint: 6fc9aabb
- concept: dot attention не содержит собственных обучаемых параметров
  question: Почему вычисление dot score в Luong attention не добавляет обучаемых параметров?
  explanation: В dot attention используется фиксированная операция qᵀk. Сами состояния могут формироваться обучаемой сетью, но функция сравнения не имеет собственных параметров. В general attention, напротив, перед сравнением применяется обучаемая матрица W.
  kind: open
  reference: Score вычисляется непосредственно как скалярное произведение query и key. В этой операции нет матрицы проекции, вектора весов или смещения, которые требовалось бы обучать.
  id: 013-dot-score-concept-2
  fingerprint: 2130caef
