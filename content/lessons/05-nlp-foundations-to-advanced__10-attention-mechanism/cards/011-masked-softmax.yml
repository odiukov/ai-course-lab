- concept: padding-маска должна расширяться по головам и запросам, сохраняя соответствие оси ключей
  question: Оценки multi-head attention имеют оси [batch, heads, queries, keys], а padding-маска — [batch, keys]. Какую форму должна получить маска для корректного broadcasting?
  explanation: Ось batch связывает маску с нужной последовательностью, а ось keys — с маскируемыми позициями. Singleton-оси позволяют повторить одну padding-маску по всем головам и запросам.
  kind: choice
  options:
