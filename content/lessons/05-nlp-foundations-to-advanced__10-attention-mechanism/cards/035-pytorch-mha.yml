- concept: число выходных позиций MultiheadAttention определяется длиной query
  question: В PyTorch MultiheadAttention получает query формы [B, Lq, E] и key/value формы [B, Lk, E]. Сколько позиционных представлений будет в output для каждого элемента батча?
  explanation: Attention вычисляет отдельный контекстуализированный результат для каждого запроса. Поэтому позиционная ось output совпадает с осью query, даже если у key и value другая длина.
  kind: choice
  options:
    - Lq — по одному для каждой позиции query
    - Lk — по одному для каждой позиции key
    - Lq + Lk — по одному для каждой входной позиции
  correct: 0
  id: 035-pytorch-mha-1
  fingerprint: d80f2f73
- concept: отключение усреднения весов attention сохраняет отдельную ось голов
  question: Какое измерение появляется в весах PyTorch MultiheadAttention, если передать average_attn_weights=False?
  explanation: Без усреднения каждая голова возвращает собственную матрицу весов между query и key. При стандартном усреднении ось H исчезает.
  kind: cloze
  template: weights.shape = (B, ___, Lq, Lk)
  answer: H
  accept:
    - num_heads
    - число голов
  id: 035-pytorch-mha-2
  fingerprint: e5f554d6
- concept: PyTorch MultiheadAttention не выполняет residual connection автоматически
  question: Объясни своими словами, добавляет ли nn.MultiheadAttention исходный query к вычисленному output и где обычно выполняют такое сложение.
  explanation: Совпадение формы output с формой query не означает, что query уже был прибавлен. Оно лишь позволяет внешнему коду выполнить residual connection.
  kind: open
  reference: Нет. nn.MultiheadAttention возвращает результат attention без автоматического прибавления query. Residual connection реализуют снаружи слоя, складывая его вход с результатом attention, обычно перед последующей нормализацией или согласно архитектуре блока.
  id: 035-pytorch-mha-3
  fingerprint: 90560cc5
