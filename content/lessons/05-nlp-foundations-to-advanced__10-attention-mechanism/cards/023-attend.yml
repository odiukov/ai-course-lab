- concept: контекст attention как выпуклая комбинация values не выходит за покоординатный диапазон исходных векторов
  question: Для некоторого признака значения во всех векторах values лежат в диапазоне от −6 до 8. Какое значение этого признака невозможно получить в context при обычных весах attention?
  explanation: Веса softmax неотрицательны и в сумме дают единицу, поэтому каждая координата context является взвешенным средним соответствующих координат values. Значение 9 лежит вне диапазона от −6 до 8.
  kind: choice
  options:
    - '5'
    - −2
    - '9'
    - '0'
  correct: 2
