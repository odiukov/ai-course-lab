- concept: совместная перестановка keys, values и маски переставляет веса, но не меняет итоговый context
  question: Что произойдёт с weights и context, если одинаково переставить позиции в keys, values и padding-маске, не меняя query? Объясни своими словами.
  explanation: Score-функция сопоставляет query каждой позиции keys. При согласованной перестановке вес переезжает вместе с соответствующим value, поэтому порядок weights меняется, а взвешенная сумма остаётся прежней.
  kind: open
  reference: 'Оценки и веса переставятся в том же порядке, но context не изменится: каждый вес останется связан со своим value, а сумма одних и тех же взвешенных векторов не зависит от порядка слагаемых.'
