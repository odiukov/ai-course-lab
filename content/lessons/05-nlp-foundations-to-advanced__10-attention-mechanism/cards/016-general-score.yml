- concept: обучаемая матрица general attention должна сохраняться между вызовами функции
  question: Как следует управлять матрицей W в реализации general attention?
  explanation: W — обучаемый параметр модели. Она должна сохранять обновлённые оптимизатором значения, поэтому её передают в функцию, а не создают заново при каждом вычислении.
  kind: choice
  options:
    - Хранить её как параметр модели и передавать в функцию вычисления оценок
    - Создавать случайную матрицу заново при каждом вызове функции
    - Вычислять её из результатов softmax
    - Заменять её текущими состояниями энкодера
  correct: 0
  id: 016-general-score-1
  fingerprint: f1a4fbd3
- concept: general attention сводится к dot attention при единичном линейном преобразовании
  question: При каком выборе матрицы W general attention даёт те же оценки, что и dot attention, если состояния энкодера и декодера принадлежат одному пространству? Объясните своими словами.
  explanation: 'Единичная матрица оставляет вектор без изменений: W.T @ decoder_state = decoder_state. Формула general score тогда превращается в обычное скалярное произведение состояний, используемое в dot attention.'
  kind: open
  reference: Если W — единичная матрица, то её транспонирование также равно единичной матрице и проекция не изменяет состояние декодера. Поэтому encoder_states @ (W.T @ decoder_state) совпадает с encoder_states @ decoder_state.
  id: 016-general-score-2
  fingerprint: f6f82dae
