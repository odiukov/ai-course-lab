- concept: мультипликативная оценка совместимости обычно вычислительно дешевле additive attention
  question: Почему dot/general attention обычно вычислительно дешевле additive attention при сопоставимом качестве?
  explanation: Dot и general attention строят scores с помощью скалярных произведений. В additive attention для каждой пары query–key дополнительно вычисляется обучаемое нелинейное преобразование.
  kind: choice
  options:
    - Мультипликативный вариант не вычисляет веса attention
    - Мультипликативный вариант использует скалярные произведения вместо отдельной нелинейной сети оценки
    - Additive attention сравнивает каждую пару позиций дважды
    - Additive attention нельзя вычислять матричными операциями
  correct: 1
  id: 040-final-quiz-1
  fingerprint: 31f5a3db
- concept: дискретную позицию выравнивания можно получить как максимум строки alignment matrix
  question: Заполни пропуск в формуле выбора входной позиции, получившей наибольший вес на шаге декодера.
  explanation: Строка A[t, :] содержит распределение attention по входным позициям для шага t. Операция argmax выбирает позицию с наибольшим весом, превращая мягкое распределение в дискретное выравнивание.
  kind: cloze
  template: j_t = ___(A[t, :])
  answer: argmax
  accept:
    - argmax_j
    - torch.argmax
  id: 040-final-quiz-2
  fingerprint: 96a49a8f
- concept: головы attention могут строить разные распределения благодаря собственным проекциям query и key
  question: Почему головы multi-head attention, получив одни и те же входные позиции, не обязаны назначать им одинаковые веса?
  explanation: Веса определяются scores между проекциями query и key. Поскольку параметры этих проекций различаются между головами, различаться могут и их матрицы attention.
  kind: open
  reference: У каждой головы есть собственные обучаемые проекции query и key. Поэтому головы сравнивают разные представления входа и могут выделять разные типы связей.
  id: 040-final-quiz-3
  fingerprint: 1d329fb2
