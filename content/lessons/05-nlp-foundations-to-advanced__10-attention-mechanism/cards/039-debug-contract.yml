- concept: диагностика переставленных осей весов attention по контракту форм
  question: При batch_size = 7, T_dec = 11, T_enc = 13 и d_h = 17 реализация возвращает output формы (7, 11, 17) и weights формы (7, 13, 11). Какой вывод верен?
  explanation: Для каждого шага декодера нужен набор весов по всем позициям энкодера, поэтому контракт weights — (batch, T_dec, T_enc). Форма output уже соответствует контракту (batch, T_dec, d_h). Перестановку смысловых осей исправляют транспонированием, а не reshape или broadcasting.
  kind: choice
  options:
    - В weights перепутаны оси позиций декодера и энкодера; две последние оси нужно транспонировать
    - В output потеряна ось энкодера; её нужно восстановить через reshape
    - Обе формы верны, поскольку weights содержат нужное количество элементов
    - 'Форму weights можно оставить такой: broadcasting автоматически восстановит смысл осей'
  correct: 0
  id: 039-debug-contract-1
  fingerprint: 651ba4cf
- concept: последовательность контрактной отладки ошибок форм в attention
  question: Расположите действия в порядке надёжной отладки ошибки форм в реализации attention.
  explanation: Сначала локализуют тензор и сравнивают фактическую форму с формой, выведенной из семантики осей. После явного исправления регрессионные проверки должны подтверждать формы output и weights и сумму весов, близкую к единице по последней оси.
  kind: order
  items:
    - Назвать подозрительный тензор и зафиксировать его фактическую форму
    - Вывести ожидаемую форму из смысловых осей batch, query, key и hidden
    - 'Внести явное исправление: транспонирование, корректное изменение формы или обучаемую проекцию'
    - Добавить проверки форм выхода и весов, а также нормировки весов по оси ключей
  id: 039-debug-contract-2
  fingerprint: 9285961a
