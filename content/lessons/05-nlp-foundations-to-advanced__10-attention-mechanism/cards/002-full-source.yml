- concept: память энкодера для attention содержит скрытое состояние каждой позиции входа
  question: Что энкодер должен предоставить декодеру в архитектуре с attention?
  explanation: Для attention сохраняют весь ряд состояний энкодера. Поэтому декодер может обращаться к представлениям разных входных позиций, а не только к финальному состоянию.
  kind: choice
  options:
    - Последовательность скрытых состояний, по одному для каждой позиции входа
    - Только последнее скрытое состояние
    - Только эмбеддинги выходных токенов
    - Один усреднённый вектор без привязки к позициям
  correct: 0
  id: 002-full-source-1
  fingerprint: 4cec4317
- concept: скрытое состояние рекуррентного энкодера представляет накопленный контекст на данной позиции
  question: Что обычно представляет скрытое состояние рекуррентного энкодера на некоторой позиции входа?
  explanation: Рекуррентное состояние обновляется по мере чтения входа, поэтому содержит сведения о текущем элементе и уже обработанном контексте. Это не простая копия отдельного токена.
  kind: choice
  options:
    - Представление обработанного к этой позиции фрагмента с накопленным контекстом
    - Точную копию токена на этой позиции без контекста
    - Готовый токен будущего выхода декодера
    - Скалярную вероятность правильности всей последовательности
  correct: 0
  id: 002-full-source-2
  fingerprint: 5b69f8dc
