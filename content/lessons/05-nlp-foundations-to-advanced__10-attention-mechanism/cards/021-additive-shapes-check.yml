- concept: форма W_a определяется левой проекцией состояния декодера в пространство attention
  question: Заполните форму матрицы проекции состояния декодера.
  explanation: Матрица слева должна принимать вектор длины d_s и выдавать вектор длины d_attn, поэтому её строки соответствуют d_attn, а столбцы — d_s.
  kind: cloze
  template: decoder_state имеет форму (d_s,), а W_a @ decoder_state — форму (d_attn,), поэтому W_a имеет форму ___.
  answer: (d_attn, d_s)
  accept:
    - d_attn × d_s
    - '[d_attn, d_s]'
    - d_attn на d_s
