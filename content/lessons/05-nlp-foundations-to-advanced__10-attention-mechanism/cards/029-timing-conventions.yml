- concept: порядок вычислений в attention Бахданау
  question: Расположите операции одного такта декодера с attention Бахданау в правильном порядке.
  explanation: 'В схеме Бахданау attention обращается к состояниям энкодера до вычисления s_t: запросом служит s_{t-1}, а полученный контекст участвует в обновлении состояния декодера.'
  kind: order
  items:
    - Взять предыдущее состояние декодера s_{t-1} как запрос
    - Вычислить веса attention и контекст c_t
    - Получить текущее состояние декодера s_t с участием контекста
    - Использовать обновлённое состояние для предсказания следующего токена
  id: 029-timing-conventions-1
  fingerprint: ddcfca44
- concept: использование s_t в attention Luong не означает утечку текущего целевого токена
  question: Почему применение текущего состояния s_t как запроса в attention Luong не даёт декодеру доступа к ещё не предсказанному токену?
  explanation: В Luong attention состояние s_t — уже обновлённое, но ещё не содержит результат текущего предсказания. Сначала декодер получает s_t, затем использует его для вычисления контекста, и лишь после этого формируется распределение следующего токена.
  kind: choice
  options:
    - Потому что s_t совпадает с последним скрытым состоянием энкодера
    - Потому что s_t вычисляется до предсказания токена из прежнего состояния и входа текущего такта
    - Потому что результат attention не участвует в предсказании токена
    - Потому что во время обучения Luong attention отключает целевые токены
  correct: 1
  id: 029-timing-conventions-2
  fingerprint: 8253d73d
