<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Разбиение 128 измерений на 8 голов</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f8fb;
    --panel: #ffffff;
    --ink: #172033;
    --muted: #5c667a;
    --line: #7c879c;
    --grid: #9aa4b5;
    --soft: #edf0f5;
    --warning: #a33d24;

    --a: #2274a5;
    --a-soft: #dceef8;
    --b: #8c55aa;
    --b-soft: #eee2f5;
    --c: #2d8b72;
    --c-soft: #daf0e9;
    --d: #c36b24;
    --d-soft: #f8e7d5;
    --e: #ad496c;
    --e-soft: #f5dfe7;
    --f: #5578bd;
    --f-soft: #dfe7f7;
    --g: #718234;
    --g-soft: #e9edcf;
    --h: #996235;
    --h-soft: #f0e2d4;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #11151d;
      --panel: #191f2a;
      --ink: #edf2fa;
      --muted: #b1bacb;
      --line: #8490a5;
      --grid: #657087;
      --soft: #252c39;
      --warning: #ff9a7c;

      --a: #66b9e8;
      --a-soft: #173b50;
      --b: #c595df;
      --b-soft: #3d294a;
      --c: #62c9aa;
      --c-soft: #183f35;
      --d: #efa76a;
      --d-soft: #4a321e;
      --e: #e98bad;
      --e-soft: #492638;
      --f: #8eaceb;
      --f-soft: #263758;
      --g: #b1c66c;
      --g-soft: #35401f;
      --h: #d6a16d;
      --h-soft: #493322;
    }
  }

  html,
  body {
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  h2 {
    color: var(--ink);
    font-size: 20px;
  }

  .diagram {
    display: block;
    width: 100%;
    height: auto;
    max-height: 430px;
    background: var(--panel);
    border: 1px solid var(--line);
  }

  .shape {
    vector-effect: non-scaling-stroke;
  }

  .flow {
    fill: none;
    stroke: var(--line);
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .bus {
    fill: none;
    stroke: var(--ink);
    stroke-width: 2.2;
    stroke-linecap: round;
  }

  .arrow-head {
    fill: var(--ink);
  }

  .card {
    stroke: var(--accent);
    stroke-width: 1.3;
    fill: var(--tint);
  }

  .accent {
    fill: var(--accent);
  }

  .hot {
    fill: var(--tint);
  }

  .matrix-bg {
    fill: var(--soft);
  }

  .matrix-line,
  .matrix-frame {
    fill: none;
    stroke: var(--grid);
    stroke-width: .8;
    shape-rendering: crispEdges;
  }

  .matrix-frame {
    stroke: var(--ink);
    stroke-width: 1.1;
  }

  .output-frame,
  .input-frame {
    fill: none;
    stroke: var(--ink);
    stroke-width: 1.7;
  }

  .separator {
    stroke: var(--line);
    stroke-width: 1;
  }

  .label {
    fill: var(--ink);
    font-size: 13px;
  }

  .small {
    fill: var(--muted);
    font-size: 12px;
  }

  .section {
    fill: var(--ink);
    font-size: 13px;
    font-weight: bold;
  }

  .number {
    fill: var(--ink);
    font-size: 14px;
    font-weight: bold;
  }

  .warning {
    fill: var(--warning);
    font-size: 12px;
    font-weight: bold;
  }

  .tone-a { --accent: var(--a); --tint: var(--a-soft); }
  .tone-b { --accent: var(--b); --tint: var(--b-soft); }
  .tone-c { --accent: var(--c); --tint: var(--c-soft); }
  .tone-d { --accent: var(--d); --tint: var(--d-soft); }
  .tone-e { --accent: var(--e); --tint: var(--e-soft); }
  .tone-f { --accent: var(--f); --tint: var(--f-soft); }
  .tone-g { --accent: var(--g); --tint: var(--g-soft); }
  .tone-h { --accent: var(--h); --tint: var(--h-soft); }

  #fallback {
    color: var(--ink);
    font-size: 14px;
  }
</style>
</head>
<body>
<h2 id="diagram-title">Разбиение 128 измерений на 8 голов</h2>

<svg
  id="diagram"
  class="diagram"
  width="960"
  height="430"
  viewBox="0 0 960 430"
  preserveAspectRatio="xMidYMid meet"
  role="img"
  aria-labelledby="diagram-title diagram-desc">
  <desc id="diagram-desc">
    Восемь голов делят ширину 128 на части по 16, каждая строит матрицу
    весов 5 на 10, после чего восемь результатов склеиваются в ширину 128.
  </desc>
  <g id="plot"></g>
</svg>

<p id="fallback" hidden>
  Схема должна была показать: 128 измерений делятся между 8 головами по 16;
  каждая голова строит веса 5×10, а результаты склеиваются обратно в 128.
</p>

<script>
const data = [
  {
    zero: 0,
    one: 1,
    two: 2,
    originX: 0,
    originY: 0,
    scaleX: 1,
    scaleY: 1,

    inputX: 35,
    inputY: 154,
    inputW: 136,
    inputH: 112,
    segmentW: 17,
    parts: 8,

    splitTailX: 171,
    splitTipX: 216,
    splitBusX: 216,
    branchTipX: 245,

    rowStart: 52,
    rowStep: 42,
    cardX: 245,
    cardW: 160,
    cardHalfH: 15,
    accentW: 8,
    cardTextX: 262,

    gridX: 425,
    gridHalfH: 12.5,
    cellW: 7,
    cellH: 5,
    gridW: 70,
    gridH: 25,
    columns: 10,
    rows: 5,
    innerColumns: 9,
    innerRows: 4,

    resultX: 525,
    resultW: 112,
    resultHalfH: 12,
    resultH: 24,
    resultTextX: 581,

    collectorX: 704,
    flowY: 210,
    outputX: 789,
    outputY: 154,
    outputW: 136,
    outputH: 112,

    arrowLength: 9,
    arrowHalfH: 5,

    headerY: 25,
    inputCenterX: 103,
    inputTopLabelY: 137,
    inputBottomLabelY: 285,
    splitLabelX: 194,
    splitLabelY: 137,

    headsHeaderX: 325,
    matrixHeaderX: 460,
    resultHeaderX: 581,
    outputCenterX: 857,
    outputTopLabelY: 137,
    outputBottomLabelY: 285,
    concatLabelX: 746,
    concatLabelY: 285,

    separatorY: 374,
    legendY: 400,
    legendLeftX: 35,
    legendRightX: 925,

    lineWidth: 1.7
  },
  [
    { cls: "tone-a", hot: [[1, 0], [6, 1], [8, 3]] },
    { cls: "tone-b", hot: [[3, 0], [7, 2], [2, 4]] },
    { cls: "tone-c", hot: [[5, 0], [1, 2], [9, 4]] },
    { cls: "tone-d", hot: [[8, 0], [4, 2], [6, 4]] },
    { cls: "tone-e", hot: [[0, 1], [5, 2], [8, 4]] },
    { cls: "tone-f", hot: [[2, 0], [9, 2], [4, 3]] },
    { cls: "tone-g", hot: [[7, 0], [3, 2], [1, 4]] },
    { cls: "tone-h", hot: [[4, 0], [0, 3], [9, 4]] }
  ]
];

const [cfg, heads] = data;
const origin = Object.freeze({ x: cfg.originX, y: cfg.originY });
const scale = Object.freeze({ x: cfg.scaleX, y: cfg.scaleY });
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

const svg = document.getElementById("diagram");
const plot = document.getElementById("plot");
const fallback = document.getElementById("fallback");

try {
  const ns = svg.namespaceURI;

  const make = (tag, attributes, parent = plot) => {
    const node = document.createElementNS(ns, tag);
    Object.entries(attributes).forEach(([name, value]) => {
      node.setAttribute(name, value);
    });
    parent.appendChild(node);
    return node;
  };

  const group = cls => make("g", { class: cls });

  const rect = (x, y, width, height, cls, parent = plot) =>
    make("rect", {
      x: sx(x),
      y: sy(y),
      width: sx(width) - sx(cfg.zero),
      height: sy(height) - sy(cfg.zero),
      class: `shape ${cls}`
    }, parent);

  const line = (x1, y1, x2, y2, cls, parent = plot) =>
    make("line", {
      x1: sx(x1),
      y1: sy(y1),
      x2: sx(x2),
      y2: sy(y2),
      class: `shape ${cls}`
    }, parent);

  const label = (x, y, value, cls, anchor = "middle", parent = plot) => {
    const node = make("text", {
      x: sx(x),
      y: sy(y),
      class: cls,
      "text-anchor": anchor,
      "dominant-baseline": "middle"
    }, parent);
    node.textContent = value;
    return node;
  };

  const horizontalArrow = (x1, y, x2, cls) => {
    line(x1, y, x2, y, cls);
    make("polygon", {
      points: [
        [x2, y],
        [x2 - cfg.arrowLength, y - cfg.arrowHalfH],
        [x2 - cfg.arrowLength, y + cfg.arrowHalfH]
      ].map(([x, py]) => `${sx(x)},${sy(py)}`).join(" "),
      class: "shape arrow-head"
    });
  };

  horizontalArrow(
    cfg.splitTailX,
    cfg.flowY,
    cfg.splitTipX,
    "flow"
  );

  line(
    cfg.splitBusX,
    cfg.rowStart,
    cfg.splitBusX,
    cfg.rowStart + (cfg.parts - cfg.one) * cfg.rowStep,
    "bus"
  );

  line(
    cfg.collectorX,
    cfg.rowStart,
    cfg.collectorX,
    cfg.rowStart + (cfg.parts - cfg.one) * cfg.rowStep,
    "bus"
  );

  horizontalArrow(
    cfg.collectorX,
    cfg.flowY,
    cfg.outputX,
    "flow"
  );

  heads.forEach((head, index) => {
    const cy = cfg.rowStart + index * cfg.rowStep;
    const matrixY = cy - cfg.gridHalfH;
    const cardY = cy - cfg.cardHalfH;
    const resultY = cy - cfg.resultHalfH;
    const tone = group(head.cls);

    rect(
      cfg.inputX + index * cfg.segmentW,
      cfg.inputY,
      cfg.segmentW,
      cfg.inputH,
      "hot",
      tone
    );

    line(
      cfg.splitBusX,
      cy,
      cfg.branchTipX,
      cy,
      "flow",
      tone
    );

    line(
      cfg.resultX + cfg.resultW,
      cy,
      cfg.collectorX,
      cy,
      "flow",
      tone
    );

    rect(
      cfg.cardX,
      cardY,
      cfg.cardW,
      cfg.cardHalfH * cfg.two,
      "card",
      tone
    );

    rect(
      cfg.cardX,
      cardY,
      cfg.accentW,
      cfg.cardHalfH * cfg.two,
      "accent",
      tone
    );

    label(
      cfg.cardTextX,
      cy,
      "голова · 16 измерений",
      "label",
      "start",
      tone
    );

    rect(
      cfg.gridX,
      matrixY,
      cfg.gridW,
      cfg.gridH,
      "matrix-bg",
      tone
    );

    head.hot.forEach(([column, row]) => {
      rect(
        cfg.gridX + column * cfg.cellW,
        matrixY + row * cfg.cellH,
        cfg.cellW,
        cfg.cellH,
        "hot",
        tone
      );
    });

    Array.from({ length: cfg.innerColumns }).forEach((unused, column) => {
      const x = cfg.gridX + (column + cfg.one) * cfg.cellW;
      line(x, matrixY, x, matrixY + cfg.gridH, "matrix-line", tone);
    });

    Array.from({ length: cfg.innerRows }).forEach((unused, row) => {
      const y = matrixY + (row + cfg.one) * cfg.cellH;
      line(cfg.gridX, y, cfg.gridX + cfg.gridW, y, "matrix-line", tone);
    });

    rect(
      cfg.gridX,
      matrixY,
      cfg.gridW,
      cfg.gridH,
      "matrix-frame",
      tone
    );

    rect(
      cfg.resultX,
      resultY,
      cfg.resultW,
      cfg.resultH,
      "card",
      tone
    );

    label(
      cfg.resultTextX,
      cy,
      "16",
      "number",
      "middle",
      tone
    );

    rect(
      cfg.outputX + index * cfg.segmentW,
      cfg.outputY,
      cfg.segmentW,
      cfg.outputH,
      "hot",
      tone
    );
  });

  rect(
    cfg.inputX,
    cfg.inputY,
    cfg.inputW,
    cfg.inputH,
    "input-frame"
  );

  rect(
    cfg.outputX,
    cfg.outputY,
    cfg.outputW,
    cfg.outputH,
    "output-frame"
  );

  label(
    cfg.inputCenterX,
    cfg.inputTopLabelY,
    "embed_dim = 128",
    "section"
  );

  label(
    cfg.inputCenterX,
    cfg.inputBottomLabelY,
    "8 частей по 16",
    "small"
  );

  label(
    cfg.splitLabelX,
    cfg.splitLabelY,
    "обучаемые проекции",
    "small"
  );

  label(
    cfg.headsHeaderX,
    cfg.headerY,
    "8 голов по 16",
    "section"
  );

  label(
    cfg.matrixHeaderX,
    cfg.headerY,
    "веса каждой: 5×10",
    "section"
  );

  label(
    cfg.resultHeaderX,
    cfg.headerY,
    "результат: 16",
    "section"
  );

  label(
    cfg.outputCenterX,
    cfg.outputTopLabelY,
    "снова 128",
    "section"
  );

  label(
    cfg.outputCenterX,
    cfg.outputBottomLabelY,
    "один вектор на позицию",
    "small"
  );

  label(
    cfg.concatLabelX,
    cfg.concatLabelY,
    "склейка 8 частей",
    "small"
  );

  line(
    cfg.legendLeftX,
    cfg.separatorY,
    cfg.legendRightX,
    cfg.separatorY,
    "separator"
  );

  label(
    cfg.legendLeftX,
    cfg.legendY,
    "Делятся признаки, не позиции: каждая голова видит Q — 5 и K/V — 10.",
    "small",
    "start"
  );

  label(
    cfg.legendRightX,
    cfg.legendY,
    "130 ÷ 8: поровну не делится",
    "warning",
    "end"
  );
} catch (error) {
  plot.replaceChildren();
  svg.hidden = true;
  fallback.hidden = false;
}
</script>
</body>
</html>
