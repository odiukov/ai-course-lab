<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Как query передвигает веса и context</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f8fb;
    --panel: #ffffff;
    --panel-soft: #eef2f7;
    --ink: #172033;
    --muted: #5d687a;
    --line: #9aa6b8;
    --state: #dfe7f2;
    --state-stroke: #70819a;
    --old: #2774c8;
    --old-soft: #e4f0ff;
    --new: #a64fc3;
    --new-soft: #f5e7fa;
    --move: #d35d2f;
    --context: #21866f;
    --context-soft: #e0f4ee;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151922;
      --panel: #202633;
      --panel-soft: #293242;
      --ink: #eef3fb;
      --muted: #b0bbca;
      --line: #728096;
      --state: #29384b;
      --state-stroke: #8da3bd;
      --old: #69adf5;
      --old-soft: #203d5c;
      --new: #d996ed;
      --new-soft: #482b52;
      --move: #ff936c;
      --context: #65cfb3;
      --context-soft: #21483f;
    }
  }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .figure {
    width: 100%;
    max-height: 520px;
    overflow: hidden;
    background: var(--bg);
    border: 1px solid var(--line);
    box-sizing: border-box;
  }

  .heading {
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    font-size: 18px;
    font-weight: bold;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 430px;
    background: var(--bg);
  }

  text {
    fill: var(--ink);
    font-size: 14px;
  }

  .small { font-size: 12px; }
  .label { font-size: 13px; font-weight: bold; }
  .value { font-size: 15px; font-weight: bold; }
  .muted { fill: var(--muted); }
  .state-box { fill: var(--state); stroke: var(--state-stroke); stroke-width: 1.5px; }
  .query-old { fill: var(--old-soft); stroke: var(--old); stroke-width: 2px; }
  .query-new { fill: var(--new-soft); stroke: var(--new); stroke-width: 2px; }
  .weight { fill: var(--panel); stroke: var(--line); stroke-width: 1.5px; }
  .weight-old-max { fill: var(--old-soft); stroke: var(--old); stroke-width: 3px; }
  .weight-new-max { fill: var(--new-soft); stroke: var(--new); stroke-width: 3px; }
  .context-box { fill: var(--context-soft); stroke: var(--context); stroke-width: 2px; }
  .guide { fill: none; stroke: var(--line); stroke-width: 1.5px; }
  .old-line { fill: none; stroke: var(--old); stroke-width: 2px; }
  .new-line { fill: none; stroke: var(--new); stroke-width: 2px; }
  .move-line { fill: none; stroke: var(--move); stroke-width: 3px; }
  .head-old { fill: var(--old); }
  .head-new { fill: var(--new); }
  .head-move { fill: var(--move); }
  .head-guide { fill: var(--line); }
  .old-text { fill: var(--old); }
  .new-text { fill: var(--new); }
  .move-text { fill: var(--move); }
  .context-text { fill: var(--context); }

  #fallback {
    display: none;
    padding: 18px;
    color: var(--ink);
    background: var(--panel);
    font-size: 14px;
  }
</style>
</head>
<body>
<figure class="figure">
  <figcaption class="heading">Как query передвигает веса и context</figcaption>
  <svg id="diagram" width="1040" height="430" viewBox="0 0 1040 430"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-label="Query смещается от cat к mat, максимум attention переходит с позиции 0 на позицию 2, а context следует за весами">
  </svg>
  <div id="fallback">
    Схема должна была показать три состояния энкодера: query сначала даёт веса
    [0.464, 0.305, 0.231], затем смещается к «mat» и переносит максимум на позицию 2.
    Вместе с весами context меняется с [0.640, 0.360, 0.193] на [0.423, 0.576, 0.215].
  </div>
</figure>

<script>
const data = {
  canvas: { width: 1040, height: 430 },
  zero: 0,
  radius: 0.12,
  padding: { near: 6, far: 10 },
  queries: [
    {
      box: [0.20, 0.82, 2.60, 1.46],
      title: "query сначала",
      vector: "[0.9, 0.1, 0.2]",
      at: [1.40, 1.08, 1.34],
      cls: "query-old"
    },
    {
      box: [9.20, 0.82, 11.75, 1.46],
      title: "query у «mat»",
      vector: "[0.1, 0.9, 0.3]",
      at: [10.475, 1.08, 1.34],
      cls: "query-new"
    }
  ],
  states: [
    {
      box: [2.95, 1.78, 4.60, 2.78],
      word: "cat · позиция 0",
      vector: "[1.0, 0.0, 0.2]",
      at: [3.775, 2.09, 2.46]
    },
    {
      box: [5.27, 1.78, 6.92, 2.78],
      word: "sat · позиция 1",
      vector: "[0.5, 0.5, 0.1]",
      at: [6.095, 2.09, 2.46]
    },
    {
      box: [7.59, 1.78, 9.24, 2.78],
      word: "mat · позиция 2",
      vector: "[0.1, 0.9, 0.3]",
      at: [8.415, 2.09, 2.46]
    }
  ],
  oldWeights: [
    { box: [2.95, 3.25, 4.60, 3.94], word: "cat", value: "0.464", x: 3.775, cls: "weight-old-max" },
    { box: [5.27, 3.25, 6.92, 3.94], word: "sat", value: "0.305", x: 6.095, cls: "weight" },
    { box: [7.59, 3.25, 9.24, 3.94], word: "mat", value: "0.231", x: 8.415, cls: "weight" }
  ],
  newWeights: [
    { box: [2.95, 4.56, 4.60, 5.25], word: "cat", value: "0.219", x: 3.775, cls: "weight" },
    { box: [5.27, 4.56, 6.92, 5.25], word: "sat", value: "0.317", x: 6.095, cls: "weight" },
    { box: [7.59, 4.56, 9.24, 5.25], word: "mat · поз. 2", value: "0.464", x: 8.415, cls: "weight-new-max" }
  ],
  rowLabels: [
    {
      title: "Сначала",
      scores: "оценки [0.94, 0.52, 0.24]",
      at: [0.18, 3.48, 3.75],
      cls: "old-text"
    },
    {
      title: "После сдвига",
      scores: "оценки [0.16, 0.53, 0.91]",
      at: [0.18, 4.79, 5.06],
      cls: "new-text"
    }
  ],
  contexts: [
    {
      box: [10.28, 3.20, 14.34, 3.99],
      title: "context сначала",
      vector: "[0.640, 0.360, 0.193]",
      at: [12.31, 3.48, 3.77]
    },
    {
      box: [10.28, 4.51, 14.34, 5.30],
      title: "context после сдвига",
      vector: "[0.423, 0.576, 0.215]",
      at: [12.31, 4.79, 5.08]
    }
  ],
  arrows: [
    {
      line: [2.60, 0.60, 9.05, 0.60],
      head: [[9.05, 0.60], [8.87, 0.50], [8.87, 0.70]],
      cls: "new-line",
      headCls: "head-new"
    },
    {
      line: [1.42, 1.46, 3.56, 1.75],
      head: [[3.56, 1.75], [3.36, 1.63], [3.33, 1.83]],
      cls: "old-line",
      headCls: "head-old"
    },
    {
      line: [10.47, 1.46, 8.61, 1.75],
      head: [[8.61, 1.75], [8.81, 1.63], [8.84, 1.83]],
      cls: "new-line",
      headCls: "head-new"
    },
    {
      line: [9.34, 3.595, 10.17, 3.595],
      head: [[10.17, 3.595], [9.99, 3.49], [9.99, 3.70]],
      cls: "guide",
      headCls: "head-guide"
    },
    {
      line: [9.34, 4.905, 10.17, 4.905],
      head: [[10.17, 4.905], [9.99, 4.80], [9.99, 5.01]],
      cls: "guide",
      headCls: "head-guide"
    }
  ],
  move: {
    points: [
      [3.775, 3.96],
      [4.45, 4.35],
      [6.93, 4.23],
      [7.53, 4.82]
    ],
    head: [[7.53, 4.82], [7.31, 4.74], [7.43, 4.57]],
    label: [5.88, 4.20],
    text: "максимум 0.464 → позиция 2"
  },
  captions: [
    { at: [5.82, 0.30], text: "query смещается к состоянию «mat»", cls: "new-text label" },
    { at: [6.10, 1.62], text: "три encoder state", cls: "muted small" },
    { at: [12.30, 5.67], text: "context сдвигается к «mat», но остаётся смесью трёх состояний", cls: "context-text label" }
  ],
  weightTextY: {
    oldWord: 3.48,
    oldValue: 3.77,
    newWord: 4.79,
    newValue: 5.08
  }
};

const origin = { x: 40, y: 22 };
const scale = 68;

const sx = x => origin.x + x * scale;
const sy = y => origin.y + y * scale;

try {
  const svg = document.getElementById("diagram");
  const ns = "http://www.w3.org/2000/svg";

  function make(tag, attrs, content) {
    const item = document.createElementNS(ns, tag);
    Object.entries(attrs || {}).forEach(([key, value]) => item.setAttribute(key, value));
    if (content !== undefined) item.textContent = content;
    svg.appendChild(item);
    return item;
  }

  function box(coords, cls) {
    const [x1, y1, x2, y2] = coords;
    return make("rect", {
      x: sx(x1),
      y: sy(y1),
      width: sx(x2) - sx(x1),
      height: sy(y2) - sy(y1),
      rx: sx(data.radius) - sx(data.zero),
      class: cls
    });
  }

  function label(x, y, content, cls, anchor, dx, dy) {
    return make("text", {
      x: sx(x),
      y: sy(y),
      dx: dx || data.zero,
      dy: dy || data.zero,
      class: cls || "",
      "text-anchor": anchor || "middle"
    }, content);
  }

  function polygon(points, cls) {
    return make("polygon", {
      points: points.map(([x, y]) => `${sx(x)},${sy(y)}`).join(" "),
      class: cls
    });
  }

  function arrow(item) {
    const [x1, y1, x2, y2] = item.line;
    make("line", {
      x1: sx(x1),
      y1: sy(y1),
      x2: sx(x2),
      y2: sy(y2),
      class: item.cls
    });
    polygon(item.head, item.headCls);
  }

  data.arrows.forEach(arrow);

  const [m0, m1, m2, m3] = data.move.points;
  make("path", {
    d: `M ${sx(m0[0])} ${sy(m0[1])} C ${sx(m1[0])} ${sy(m1[1])}, ${sx(m2[0])} ${sy(m2[1])}, ${sx(m3[0])} ${sy(m3[1])}`,
    class: "move-line"
  });
  polygon(data.move.head, "head-move");

  data.queries.forEach(item => {
    box(item.box, item.cls);
    label(item.at[0], item.at[1], item.title, "label");
    label(item.at[0], item.at[2], item.vector, "value");
  });

  data.states.forEach(item => {
    box(item.box, "state-box");
    label(item.at[0], item.at[1], item.word, "label");
    label(item.at[0], item.at[2], item.vector, "value");
  });

  data.rowLabels.forEach(item => {
    label(item.at[0], item.at[1], item.title, `${item.cls} label`, "start");
    label(item.at[0], item.at[2], item.scores, "muted small", "start");
  });

  data.oldWeights.forEach(item => {
    box(item.box, item.cls);
    label(item.x, data.weightTextY.oldWord, item.word, "small muted");
    label(item.x, data.weightTextY.oldValue, item.value, item.cls === "weight-old-max" ? "value old-text" : "value");
  });

  data.newWeights.forEach(item => {
    box(item.box, item.cls);
    label(item.x, data.weightTextY.newWord, item.word, "small muted");
    label(item.x, data.weightTextY.newValue, item.value, item.cls === "weight-new-max" ? "value new-text" : "value");
  });

  data.contexts.forEach(item => {
    box(item.box, "context-box");
    label(item.at[0], item.at[1], item.title, "context-text label");
    label(item.at[0], item.at[2], item.vector, "value");
  });

  label(data.move.label[0], data.move.label[1], data.move.text, "move-text label");

  data.captions.forEach(item => {
    label(item.at[0], item.at[1], item.text, item.cls);
  });
} catch (error) {
  const svg = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");
  svg.replaceChildren();
  svg.style.display = "none";
  fallback.style.display = "block";
}
</script>
</body>
</html>
