<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Как меняются формы внутри attention</title>
<style>
:root{
  color-scheme:light dark;
  --page:#f7f8fc;
  --panel:#ffffff;
  --ink:#172033;
  --muted:#58657a;
  --line:#74829a;
  --soft:#e9edf5;
  --accent:#376bd6;
  --accent-soft:#dbe7ff;
  --a:#dce8ff;
  --b:#bfd3ff;
  --c:#91b3fb;
  --d:#5f8fe8;
  --e:#356bc9;
  --f:#244c96;
  --band:#eef3fb;
}
@media (prefers-color-scheme:dark){
  :root{
    --page:#111621;
    --panel:#181f2c;
    --ink:#edf3ff;
    --muted:#aebbd0;
    --line:#8593aa;
    --soft:#273143;
    --accent:#82aaff;
    --accent-soft:#263e6d;
    --a:#263a60;
    --b:#315087;
    --c:#3d69ae;
    --d:#5685d1;
    --e:#79a5ed;
    --f:#a8c6ff;
    --band:#202a3a;
  }
}
*{box-sizing:border-box}
body{
  background:var(--page);
  color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}
main{background:var(--panel)}
header{
  font-size:20px;
  font-weight:bold;
}
svg{
  display:block;
  width:100%;
  height:auto;
  background:var(--panel);
  border:1px solid var(--soft);
}
.stage-title{fill:var(--ink);font-size:16px;font-weight:bold}
.shape-label{fill:var(--accent);font-size:15px;font-weight:bold}
.note{fill:var(--muted);font-size:13px}
.arrow-label{fill:var(--ink);font-size:12px;font-weight:bold}
.inside{fill:var(--ink);font-size:13px;font-weight:bold}
.band-label{fill:var(--ink);font-size:14px}
.frame{fill:var(--soft);stroke:var(--line);stroke-width:1.5}
.matrix-base{fill:var(--accent-soft);stroke:var(--panel);stroke-width:1}
.score-cell{stroke:var(--panel);stroke-width:1}
.context{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.flow{stroke:var(--accent);stroke-width:2;fill:none;stroke-linecap:round}
.bracket{stroke:var(--line);stroke-width:1.5;fill:none;stroke-linecap:round}
.legend-band{fill:var(--band)}
.heat-a{fill:var(--a)}.heat-b{fill:var(--b)}.heat-c{fill:var(--c)}
.heat-d{fill:var(--d)}.heat-e{fill:var(--e)}.heat-f{fill:var(--f)}
</style>
</head>
<body>
<main>
<header id="diagram-title">Как меняются формы внутри attention</header>
<svg id="diagram" viewBox="0 0 1040 430" width="1040" height="430"
     preserveAspectRatio="xMidYMid meet" role="img"
     aria-labelledby="diagram-title diagram-desc">
  <desc id="diagram-desc">Цепочка форм: H размером 12 на 256, scores длины 12, weights длины 12 и context длины 256.</desc>
</svg>
</main>
<script>
const [d]=Object.freeze([{
  origin:{x:18,y:8},scale:{x:1,y:1},
  k:{zero:0,one:1,two:2},
  H:{x:55,y:94,w:180,h:204,rows:12,titleX:145,titleY:38,shapeY:63},
  scores:{x:310,y:94,w:42,h:204,rows:12,titleX:331,titleY:38,shapeY:63},
  weights:{x:430,y:94,w:42,h:204,rows:12,titleX:451,titleY:38,shapeY:63},
  scaled:{x:570,y:94,w:180,h:204,rows:12,titleX:660,titleY:38,shapeY:63},
  context:{x:850,y:178,w:150,h:36,titleX:925,titleY:130,shapeY:153},
  arrows:[
    {x1:249,y1:196,x2:292,y2:196,head:[[292,196],[283,190],[283,202]],
     tx:270,ty:180,label:"сравнить"},
    {x1:370,y1:196,x2:412,y2:196,head:[[412,196],[403,190],[403,202]],
     tx:391,ty:180,label:"softmax"},
    {x1:490,y1:196,x2:552,y2:196,head:[[552,196],[543,190],[543,202]],
     tx:521,ty:180,label:"умножить строки"},
    {x1:768,y1:196,x2:832,y2:196,head:[[832,196],[823,190],[823,202]],
     tx:800,ty:248,label:"сложить по столбцам"}
  ],
  titles:[
    {x:145,y:38,text:"Состояния энкодера H",cls:"stage-title"},
    {x:145,y:63,text:"H: 12 × 256",cls:"shape-label"},
    {x:331,y:38,text:"Оценки",cls:"stage-title"},
    {x:331,y:63,text:"scores: 12",cls:"shape-label"},
    {x:451,y:38,text:"Коэффициенты",cls:"stage-title"},
    {x:451,y:63,text:"weights: 12",cls:"shape-label"},
    {x:660,y:38,text:"Взвешенные строки",cls:"stage-title"},
    {x:660,y:63,text:"12 × 256",cls:"shape-label"},
    {x:925,y:130,text:"Контекст",cls:"stage-title"},
    {x:925,y:153,text:"context: 256",cls:"shape-label"}
  ],
  labels:[
    {x:45,y:196,dx:0,dy:0,text:"12 слов",anchor:"end",cls:"note"},
    {x:145,y:338,dx:0,dy:0,text:"256 признаков",anchor:"middle",cls:"note"},
    {x:660,y:338,dx:0,dy:0,text:"256 признаков",anchor:"middle",cls:"note"},
    {x:925,y:246,dx:0,dy:0,text:"256 признаков",anchor:"middle",cls:"note"},
    {x:925,y:201,dx:0,dy:0,text:"итоговый вектор",anchor:"middle",cls:"inside"}
  ],
  brackets:[
    {x1:55,y1:316,x2:235,y2:316,tick:8,kind:"horizontal"},
    {x1:570,y1:316,x2:750,y2:316,tick:8,kind:"horizontal"},
    {x1:850,y1:224,x2:1000,y2:224,tick:8,kind:"horizontal"},
    {x1:49,y1:94,x2:49,y2:298,tick:7,kind:"vertical"}
  ],
  band:{x:28,y:365,w:966,h:42},
  bandLabels:[
    {x:45,y:391,text:"Ось слов: 12 строк → 12 scores → 12 weights → сумма убирает эту ось"},
    {x:665,y:391,text:"Ось признаков: 256 сохраняется до context"}
  ],
  classes:["heat-a","heat-e","heat-b","heat-d","heat-c","heat-f",
           "heat-b","heat-d","heat-a","heat-e","heat-c","heat-f"]
}]);
const origin=Object.freeze(d.origin);
const scale=Object.freeze(d.scale);
const sx=x=>origin.x+x*scale.x;
const sy=y=>origin.y+y*scale.y;

const svg=document.getElementById("diagram");
const ns="http://www.w3.org/2000/svg";

function make(tag,attrs,text){
  const n=document.createElementNS(ns,tag);
  for(const [key,value] of Object.entries(attrs))n.setAttribute(key,String(value));
  if(text!==undefined)n.textContent=text;
  return n;
}
function add(tag,attrs,text){
  const n=make(tag,attrs,text);
  svg.appendChild(n);
  return n;
}
function rect(x,y,w,h,cls){
  return add("rect",{
    x:sx(x),y:sy(y),
    width:sx(x+w)-sx(d.k.zero),
    height:sy(y+h)-sy(d.k.zero),
    class:cls
  });
}
function line(x1,y1,x2,y2,cls){
  return add("line",{x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),class:cls});
}
function text(item){
  return add("text",{
    x:sx(item.x)+item.dx,
    y:sy(item.y)+item.dy,
    "text-anchor":item.anchor,
    class:item.cls
  },item.text);
}
function matrix(stage,weighted){
  rect(stage.x,stage.y,stage.w,stage.h,"frame");
  Array.from({length:stage.rows}).forEach((_,index)=>{
    const rowH=stage.h/stage.rows;
    const rowY=stage.y+index*rowH;
    rect(stage.x,rowY,stage.w,rowH,
      weighted ? d.classes[index%d.classes.length] : "matrix-base");
  });
}
function vector(stage){
  rect(stage.x,stage.y,stage.w,stage.h,"frame");
  Array.from({length:stage.rows}).forEach((_,index)=>{
    const rowH=stage.h/stage.rows;
    rect(stage.x,stage.y+index*rowH,stage.w,rowH,
      "score-cell "+d.classes[index%d.classes.length]);
  });
}
function arrow(item){
  line(item.x1,item.y1,item.x2,item.y2,"flow");
  add("polygon",{
    points:item.head.map(point=>sx(point[d.k.zero])+","+sy(point[d.k.one])).join(" "),
    class:"flow"
  });
  text({x:item.tx,y:item.ty,dx:d.k.zero,dy:d.k.zero,
        text:item.label,anchor:"middle",cls:"arrow-label"});
}
function bracket(item){
  line(item.x1,item.y1,item.x2,item.y2,"bracket");
  if(item.kind==="horizontal"){
    line(item.x1,item.y1-item.tick,item.x1,item.y1+item.tick,"bracket");
    line(item.x2,item.y2-item.tick,item.x2,item.y2+item.tick,"bracket");
  }else{
    line(item.x1-item.tick,item.y1,item.x1+item.tick,item.y1,"bracket");
    line(item.x2-item.tick,item.y2,item.x2+item.tick,item.y2,"bracket");
  }
}

try{
  rect(d.band.x,d.band.y,d.band.w,d.band.h,"legend-band");
  d.arrows.forEach(arrow);
  matrix(d.H,false);
  vector(d.scores);
  vector(d.weights);
  matrix(d.scaled,true);
  rect(d.context.x,d.context.y,d.context.w,d.context.h,"context");
  d.brackets.forEach(bracket);
  d.titles.forEach(item=>text({
    x:item.x,y:item.y,dx:d.k.zero,dy:d.k.zero,
    text:item.text,anchor:"middle",cls:item.cls
  }));
  d.labels.forEach(text);
  d.bandLabels.forEach(item=>text({
    x:item.x,y:item.y,dx:d.k.zero,dy:d.k.zero,
    text:item.text,anchor:"start",cls:"band-label"
  }));
}catch(error){
  while(svg.lastChild&&svg.lastChild.tagName!=="desc")svg.removeChild(svg.lastChild);
  add("text",{
    x:sx(d.band.x),y:sy(d.context.y),
    "text-anchor":"start",class:"stage-title"
  },"Схема должна была показать: H 12 × 256 → scores 12 → weights 12 → context 256.");
}
</script>
</body>
</html>
