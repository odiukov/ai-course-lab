<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Один шаг LMPSO</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fc;
      --panel: #ffffff;
      --panel-soft: #eef2ff;
      --ink: #172033;
      --muted: #566078;
      --line: #7c89a8;
      --current: #2563eb;
      --personal: #7c3aed;
      --global: #d97706;
      --prompt: #0f766e;
      --model: #be185d;
      --candidate: #15803d;
      --test: #475569;
      --note: #fff7d6;
      --note-line: #b7791f;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #101522;
        --panel: #182033;
        --panel-soft: #202b45;
        --ink: #f1f5ff;
        --muted: #b5bfd5;
        --line: #8794b2;
        --current: #60a5fa;
        --personal: #c4b5fd;
        --global: #fbbf24;
        --prompt: #5eead4;
        --model: #f9a8d4;
        --candidate: #86efac;
        --test: #cbd5e1;
        --note: #332b16;
        --note-line: #fbbf24;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    figure {
      margin: 0;
      width: 100%;
      max-width: 1200px;
      background: var(--page);
      border: 2px solid var(--line);
    }

    figcaption {
      padding: 14px 18px;
      border-bottom: 2px solid var(--line);
      background: var(--panel);
      font-size: 20px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 430px;
      background: var(--page);
    }

    #fallback {
      padding: 18px;
      background: var(--panel);
      color: var(--ink);
      font-size: 16px;
    }

    .card {
      fill: var(--panel);
      stroke-width: 2px;
    }

    .prompt-shell {
      fill: var(--panel);
      stroke: var(--prompt);
      stroke-width: 3px;
    }

    .prompt-part {
      fill: var(--panel-soft);
      stroke: var(--prompt);
      stroke-width: 2px;
    }

    .model {
      fill: var(--panel);
      stroke: var(--model);
      stroke-width: 3px;
    }

    .note {
      fill: var(--note);
      stroke: var(--note-line);
      stroke-width: 2px;
    }

    .edge {
      fill: none;
      stroke: var(--line);
      stroke-width: 3px;
      stroke-linecap: round;
    }

    .edge-strong {
      fill: none;
      stroke: var(--prompt);
      stroke-width: 4px;
      stroke-linecap: round;
    }

    .edge-output {
      fill: none;
      stroke: var(--candidate);
      stroke-width: 4px;
      stroke-linecap: round;
    }

    .head {
      fill: var(--line);
    }

    .head-strong {
      fill: var(--prompt);
    }

    .head-output {
      fill: var(--candidate);
    }

    .divider {
      stroke: var(--line);
      stroke-width: 2px;
    }

    .title {
      fill: var(--ink);
      font-size: 17px;
      font-weight: bold;
    }

    .body {
      fill: var(--muted);
      font-size: 14px;
    }

    .small {
      fill: var(--muted);
      font-size: 13px;
    }

    .accent-current {
      fill: var(--current);
    }

    .accent-personal {
      fill: var(--personal);
    }

    .accent-global {
      fill: var(--global);
    }

    .accent-prompt {
      fill: var(--prompt);
    }

    .accent-model {
      fill: var(--model);
    }

    .accent-output {
      fill: var(--candidate);
    }

    .accent-test {
      fill: var(--test);
    }

    .arrow-label {
      fill: var(--muted);
      font-size: 13px;
      font-weight: bold;
    }

    .note-text {
      fill: var(--ink);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title">
    <figcaption id="diagram-title">
      <strong>Один шаг LMPSO: опыт роя превращается в направленную редактуру</strong>
    </figcaption>

    <svg id="diagram" viewBox="0 0 1200 430"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="diagram-title diagram-desc">
      <desc id="diagram-desc">
        Текущий программный кандидат, его личный лучший и глобальный лучший
        формируют промпт-скорость. LLM интерпретирует инструкцию, создаёт
        следующего кандидата, после чего кандидат поступает на автоматические тесты.
      </desc>
      <g id="drawing"></g>
    </svg>

    <div id="fallback">
      Схема должна показать, как текущий кандидат, личный лучший и глобальный
      лучший превращаются в инструкцию небольшого изменения; LLM создаёт по ней
      нового кандидата для автоматических тестов.
    </div>
  </figure>

  <script>
    const DATA = Object.freeze({
      zero: 0,
      origin: Object.freeze({ x: 18, y: 14 }),
      scale: Object.freeze({ x: 1, y: 1 }),

      cards: Object.freeze([
        Object.freeze({
          x: 8, y: 22, w: 240, h: 72,
          stroke: "var(--current)"
        }),
        Object.freeze({
          x: 8, y: 126, w: 240, h: 72,
          stroke: "var(--personal)"
        }),
        Object.freeze({
          x: 8, y: 230, w: 240, h: 72,
          stroke: "var(--global)"
        }),
        Object.freeze({
          x: 922, y: 62, w: 228, h: 148,
          stroke: "var(--candidate)"
        }),
        Object.freeze({
          x: 922, y: 270, w: 228, h: 82,
          stroke: "var(--test)"
        })
      ]),

      prompt: Object.freeze({ x: 312, y: 22, w: 350, h: 280 }),
      promptParts: Object.freeze([
        Object.freeze({ x: 330, y: 68, w: 314, h: 58 }),
        Object.freeze({ x: 330, y: 140, w: 314, h: 58 }),
        Object.freeze({ x: 330, y: 212, w: 314, h: 70 })
      ]),

      model: Object.freeze([
        Object.freeze({ x: 722, y: 103 }),
        Object.freeze({ x: 748, y: 82 }),
        Object.freeze({ x: 858, y: 82 }),
        Object.freeze({ x: 884, y: 103 }),
        Object.freeze({ x: 884, y: 189 }),
        Object.freeze({ x: 858, y: 210 }),
        Object.freeze({ x: 748, y: 210 }),
        Object.freeze({ x: 722, y: 189 })
      ]),

      note: Object.freeze({ x: 312, y: 332, w: 572, h: 58 }),

      edges: Object.freeze([
        Object.freeze({
          x1: 248, y1: 58, c1x: 278, c1y: 58,
          c2x: 286, c2y: 88, x2: 312, y2: 88,
          kind: "plain"
        }),
        Object.freeze({
          x1: 248, y1: 162, c1x: 278, c1y: 162,
          c2x: 286, c2y: 169, x2: 312, y2: 169,
          kind: "plain"
        }),
        Object.freeze({
          x1: 248, y1: 266, c1x: 278, c1y: 266,
          c2x: 286, c2y: 246, x2: 312, y2: 246,
          kind: "plain"
        }),
        Object.freeze({
          x1: 662, y1: 146, c1x: 686, c1y: 146,
          c2x: 698, c2y: 146, x2: 722, y2: 146,
          kind: "strong"
        }),
        Object.freeze({
          x1: 884, y1: 146, c1x: 898, c1y: 146,
          c2x: 908, c2y: 136, x2: 922, y2: 136,
          kind: "output"
        }),
        Object.freeze({
          x1: 1036, y1: 210, c1x: 1036, c1y: 230,
          c2x: 1036, c2y: 250, x2: 1036, y2: 270,
          kind: "output"
        })
      ]),

      arrow: Object.freeze({ back: 13, half: 7 }),

      dividers: Object.freeze([
        Object.freeze({ x1: 940, y1: 112, x2: 1132, y2: 112 })
      ]),

      labels: Object.freeze([
        Object.freeze({
          x: 28, y: 48, text: "Текущий кандидат", cls: "title accent-current", anchor: "start"
        }),
        Object.freeze({
          x: 28, y: 74, text: "программа: 7 из 10 тестов", cls: "body", anchor: "start"
        }),
        Object.freeze({
          x: 28, y: 152, text: "Личный лучший", cls: "title accent-personal", anchor: "start"
        }),
        Object.freeze({
          x: 28, y: 178, text: "удачная прежняя версия частицы", cls: "body", anchor: "start"
        }),
        Object.freeze({
          x: 28, y: 256, text: "Глобальный лучший", cls: "title accent-global", anchor: "start"
        }),
        Object.freeze({
          x: 28, y: 282, text: "лучший кандидат всего роя", cls: "body", anchor: "start"
        }),

        Object.freeze({
          x: 487, y: 50, text: "ПРОМПТ-«СКОРОСТЬ»", cls: "title accent-prompt", anchor: "middle"
        }),

        Object.freeze({
          x: 346, y: 90, text: "Небольшое изменение", cls: "title accent-current", anchor: "start"
        }),
        Object.freeze({
          x: 346, y: 112, text: "сохрани структуру, меняй постепенно", cls: "small", anchor: "start"
        }),

        Object.freeze({
          x: 346, y: 162, text: "Личный опыт", cls: "title accent-personal", anchor: "start"
        }),
        Object.freeze({
          x: 346, y: 184, text: "верни удачную проверку", cls: "small", anchor: "start"
        }),

        Object.freeze({
          x: 346, y: 234, text: "Опыт лидера роя", cls: "title accent-global", anchor: "start"
        }),
        Object.freeze({
          x: 346, y: 256, text: "приблизь обработку ошибок", cls: "small", anchor: "start"
        }),
        Object.freeze({
          x: 346, y: 274, text: "к глобальному лучшему", cls: "small", anchor: "start"
        }),

        Object.freeze({
          x: 692, y: 122, text: "кандидат + инструкция", cls: "arrow-label", anchor: "middle"
        }),

        Object.freeze({
          x: 803, y: 126, text: "LLM", cls: "title accent-model", anchor: "middle"
        }),
        Object.freeze({
          x: 803, y: 154, text: "интерпретирует", cls: "body", anchor: "middle"
        }),
        Object.freeze({
          x: 803, y: 176, text: "задание", cls: "body", anchor: "middle"
        }),

        Object.freeze({
          x: 903, y: 122, text: "генерирует", cls: "arrow-label", anchor: "middle"
        }),

        Object.freeze({
          x: 940, y: 92, text: "Следующий кандидат", cls: "title accent-output", anchor: "start"
        }),
        Object.freeze({
          x: 940, y: 140, text: "{ новая версия программы }", cls: "body", anchor: "start"
        }),
        Object.freeze({
          x: 940, y: 174, text: "Это пока предложение,", cls: "small", anchor: "start"
        }),
        Object.freeze({
          x: 940, y: 194, text: "а не новый рекорд", cls: "small", anchor: "start"
        }),

        Object.freeze({
          x: 1054, y: 244, text: "затем — проверка", cls: "arrow-label", anchor: "start"
        }),

        Object.freeze({
          x: 1036, y: 300, text: "Автоматические тесты", cls: "title accent-test", anchor: "middle"
        }),
        Object.freeze({
          x: 1036, y: 328, text: "оценят новую версию", cls: "body", anchor: "middle"
        }),

        Object.freeze({
          x: 598, y: 356, text: "LLM не копирует победителя: инструкция задаёт направление,", cls: "note-text", anchor: "middle"
        }),
        Object.freeze({
          x: 598, y: 378, text: "а модель создаёт новую программную версию.", cls: "note-text", anchor: "middle"
        })
      ])
    });

    const origin = Object.freeze(DATA.origin);
    const scale = Object.freeze(DATA.scale);
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const SVG_NS = "http://www.w3.org/2000/svg";
      const drawing = document.getElementById("drawing");
      const fallback = document.getElementById("fallback");

      const make = (name, attributes, className) => {
        const element = document.createElementNS(SVG_NS, name);
        for (const [key, value] of Object.entries(attributes)) {
          element.setAttribute(key, value);
        }
        if (className) {
          element.setAttribute("class", className);
        }
        drawing.appendChild(element);
        return element;
      };

      for (const card of DATA.cards) {
        const rect = make("rect", {
          x: sx(card.x),
          y: sy(card.y),
          width: sx(card.x + card.w) - sx(card.x),
          height: sy(card.y + card.h) - sy(card.y)
        }, "card");
        rect.style.stroke = card.stroke;
      }

      make("rect", {
        x: sx(DATA.prompt.x),
        y: sy(DATA.prompt.y),
        width: sx(DATA.prompt.x + DATA.prompt.w) - sx(DATA.prompt.x),
        height: sy(DATA.prompt.y + DATA.prompt.h) - sy(DATA.prompt.y)
      }, "prompt-shell");

      for (const part of DATA.promptParts) {
        make("rect", {
          x: sx(part.x),
          y: sy(part.y),
          width: sx(part.x + part.w) - sx(part.x),
          height: sy(part.y + part.h) - sy(part.y)
        }, "prompt-part");
      }

      make("polygon", {
        points: DATA.model.map(point => `${sx(point.x)},${sy(point.y)}`).join(" ")
      }, "model");

      make("rect", {
        x: sx(DATA.note.x),
        y: sy(DATA.note.y),
        width: sx(DATA.note.x + DATA.note.w) - sx(DATA.note.x),
        height: sy(DATA.note.y + DATA.note.h) - sy(DATA.note.y)
      }, "note");

      for (const divider of DATA.dividers) {
        make("line", {
          x1: sx(divider.x1),
          y1: sy(divider.y1),
          x2: sx(divider.x2),
          y2: sy(divider.y2)
        }, "divider");
      }

      for (const edge of DATA.edges) {
        const edgeClass = edge.kind === "strong"
          ? "edge-strong"
          : edge.kind === "output"
            ? "edge-output"
            : "edge";

        const headClass = edge.kind === "strong"
          ? "head-strong"
          : edge.kind === "output"
            ? "head-output"
            : "head";

        make("path", {
          d: [
            `M ${sx(edge.x1)} ${sy(edge.y1)}`,
            `C ${sx(edge.c1x)} ${sy(edge.c1y)}`,
            `${sx(edge.c2x)} ${sy(edge.c2y)}`,
            `${sx(edge.x2)} ${sy(edge.y2)}`
          ].join(" ")
        }, edgeClass);

        const vx = edge.x2 - edge.c2x;
        const vy = edge.y2 - edge.c2y;
        const length = Math.hypot(vx, vy);
        const ux = vx / length;
        const uy = vy / length;
        const baseX = edge.x2 - ux * DATA.arrow.back;
        const baseY = edge.y2 - uy * DATA.arrow.back;
        const leftX = baseX - uy * DATA.arrow.half;
        const leftY = baseY + ux * DATA.arrow.half;
        const rightX = baseX + uy * DATA.arrow.half;
        const rightY = baseY - ux * DATA.arrow.half;

        make("polygon", {
          points: [
            `${sx(edge.x2)},${sy(edge.y2)}`,
            `${sx(leftX)},${sy(leftY)}`,
            `${sx(rightX)},${sy(rightY)}`
          ].join(" ")
        }, headClass);
      }

      for (const label of DATA.labels) {
        const text = make("text", {
          x: sx(label.x),
          y: sy(label.y),
          "text-anchor": label.anchor
        }, label.cls);
        text.textContent = label.text;
      }

      fallback.hidden = true;
    } catch (error) {
      const diagram = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      diagram.hidden = true;
      fallback.hidden = false;
      fallback.textContent =
        "Схема должна показать: текущий кандидат, личный лучший и глобальный лучший формируют промпт-скорость с инструкцией небольшого изменения; LLM выдаёт следующего кандидата для автоматических тестов.";
    }
  </script>
</body>
</html>
