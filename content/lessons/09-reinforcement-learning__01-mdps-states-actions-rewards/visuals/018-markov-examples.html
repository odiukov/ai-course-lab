<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Полное и неполное состояние</title>
<style>
:root{
  color-scheme:light dark;
  --page:#f6f3ec;
  --panel:#fffdf8;
  --ink:#17232b;
  --muted:#647078;
  --border:#c9c3b8;
  --light-square:#ebe4d6;
  --dark-square:#647b70;
  --black-piece:#17232b;
  --white-piece:#fffdf8;
  --frame:#eef2ef;
  --ball:#df684b;
  --accent:#26736e;
  --accent-soft:#dceee8;
}
@media (prefers-color-scheme:dark){
  :root{
    --page:#151a1d;
    --panel:#20272b;
    --ink:#edf2f1;
    --muted:#aab5b8;
    --border:#465156;
    --light-square:#b8b09f;
    --dark-square:#51675e;
    --black-piece:#172025;
    --white-piece:#f7f2e7;
    --frame:#293236;
    --ball:#f08061;
    --accent:#65c1b7;
    --accent-soft:#27443f;
  }
}
html,body{margin:unset;padding:unset;background:var(--page);color:var(--ink)}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{background:var(--page)}
h1{
  margin:unset;
  padding:unset;
  font-size:18px;
  line-height:normal;
  color:var(--ink);
}
figure{margin:unset}
svg{
  display:block;
  width:100%;
  height:auto;
  max-height:410px;
  background:var(--page);
}
.panel{fill:var(--panel);stroke:var(--border)}
.square-light{fill:var(--light-square)}
.square-dark{fill:var(--dark-square)}
.piece-black{fill:var(--black-piece)}
.piece-white{fill:var(--white-piece);stroke:var(--black-piece)}
.frame{fill:var(--frame);stroke:var(--border)}
.frame-floor{stroke:var(--border)}
.ball{fill:var(--ball);stroke:var(--ink)}
.motion{stroke:var(--accent);fill:none}
.arrow-head{fill:var(--accent)}
.banner{fill:var(--accent-soft);stroke:var(--accent)}
.title-text{fill:var(--ink);font-weight:bold}
.label-text{fill:var(--ink)}
.small-text{fill:var(--muted)}
.accent-text{fill:var(--accent);font-weight:bold}
.question-text{fill:var(--muted);font-weight:bold}
svg text{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  dominant-baseline:middle;
}
#fallback{color:var(--ink);font-size:14px}
</style>
</head>
<body>
<main>
  <h1 id="diagram-title">Полное и неполное состояние</h1>
  <figure aria-labelledby="diagram-title">
    <svg id="art" viewBox="0 0 960 410" width="960" height="410"
         preserveAspectRatio="xMidYMid meet" role="img"
         aria-labelledby="diagram-title diagram-desc">
      <desc id="diagram-desc">Шахматная доска достаточна для следующего хода. Один кадр мяча не показывает направление, а четыре последовательных кадра восстанавливают скорость.</desc>
    </svg>
    <p id="fallback" hidden></p>
    <noscript>Слева должна быть шахматная доска, достаточная для следующего хода; справа — один неопределённый кадр мяча и четыре кадра, показывающие его скорость.</noscript>
  </figure>
</main>
<script>
const data=Object.freeze({
  zero:0,
  two:2,
  half:0.5,
  canvas:{width:960,height:410},
  labelPad:7,
  line:2,
  heavyLine:3,
  font:{title:16,label:13,small:11,piece:22,symbol:20},
  round:1.2,
  arrow:{back:1.6,wing:0.8},
  grid:[0,1,2,3,4,5,6,7],
  panels:[
    {x:1,y:1,w:52,h:55},
    {x:56,y:1,w:75,h:55}
  ],
  board:{x:7,y:9.5,cell:5},
  pieces:[
    [0,0,"♜","black"],[1,0,"♞","black"],[2,0,"♝","black"],[3,0,"♛","black"],
    [4,0,"♚","black"],[5,0,"♝","black"],[6,0,"♞","black"],[7,0,"♜","black"],
    [0,1,"♟","black"],[1,1,"♟","black"],[2,1,"♟","black"],[3,1,"♟","black"],
    [4,1,"♟","black"],[5,1,"♟","black"],[6,1,"♟","black"],[7,1,"♟","black"],
    [0,6,"♙","white"],[1,6,"♙","white"],[2,6,"♙","white"],[3,6,"♙","white"],
    [4,6,"♙","white"],[5,6,"♙","white"],[6,6,"♙","white"],[7,6,"♙","white"],
    [0,7,"♖","white"],[1,7,"♘","white"],[2,7,"♗","white"],[3,7,"♕","white"],
    [4,7,"♔","white"],[5,7,"♗","white"],[6,7,"♘","white"],[7,7,"♖","white"]
  ],
  singleFrame:{x:60,y:12,w:24,h:20,ballX:72,ballY:22,ballR:1.5},
  frames:[
    {x:89,y:13.5,w:8,h:16.5,ballX:92,ballY:26},
    {x:99,y:13.5,w:8,h:16.5,ballX:102,ballY:23},
    {x:109,y:13.5,w:8,h:16.5,ballX:112,ballY:20},
    {x:119,y:13.5,w:8,h:16.5,ballX:122,ballY:17}
  ],
  frameInset:1,
  frameFloor:2,
  ballR:1.15,
  timeline:{x1:91,y1:33,x2:125,y2:33},
  banner:{x:60,y:40,w:67,h:12.5},
  labels:[
    {x:27,y:4.5,ox:0,oy:1,text:"Полное состояние",anchor:"middle",size:"title",kind:"title"},
    {x:27,y:53.5,ox:0,oy:-1,text:"доски достаточно для следующего хода",anchor:"middle",size:"label",kind:"accent"},
    {x:93.5,y:4.5,ox:0,oy:1,text:"Неполное → полное с памятью",anchor:"middle",size:"title",kind:"title"},
    {x:72,y:9.8,ox:0,oy:-1,text:"один кадр",anchor:"middle",size:"label",kind:"label"},
    {x:72,y:35.5,ox:0,oy:1,text:"направление скрыто",anchor:"middle",size:"label",kind:"small"},
    {x:108,y:9.8,ox:0,oy:-1,text:"четыре кадра подряд",anchor:"middle",size:"label",kind:"label"},
    {x:108,y:35.5,ox:0,oy:1,text:"видны направление и скорость",anchor:"middle",size:"label",kind:"accent"},
    {x:93.5,y:44,ox:0,oy:-1,text:"Память хранит только нужный кусок прошлого",anchor:"middle",size:"label",kind:"label"},
    {x:93.5,y:49,ox:0,oy:1,text:"и делает состояние достаточным для прогноза",anchor:"middle",size:"small",kind:"small"},
    {x:65,y:20,ox:-1,oy:-1,text:"?",anchor:"end",size:"symbol",kind:"question"},
    {x:79,y:28,ox:1,oy:1,text:"?",anchor:"start",size:"symbol",kind:"question"}
  ]
});
const origin=Object.freeze({x:25,y:8});
const scale=7;
const sx=x=>origin.x+x*scale;
const sy=y=>origin.y+y*scale;

try{
  const svg=document.getElementById("art");
  const fallback=document.getElementById("fallback");
  const ns="http://www.w3.org/2000/svg";

  function node(name,attributes,parent=svg){
    const item=document.createElementNS(ns,name);
    Object.entries(attributes).forEach(([key,value])=>item.setAttribute(key,String(value)));
    parent.appendChild(item);
    return item;
  }

  function rect(shape,className,lineWidth=data.line){
    return node("rect",{
      x:sx(shape.x),
      y:sy(shape.y),
      width:sx(shape.x+shape.w)-sx(shape.x),
      height:sy(shape.y+shape.h)-sy(shape.y),
      rx:sx(data.round)-sx(data.zero),
      class:className,
      "stroke-width":lineWidth
    });
  }

  function line(segment,className,lineWidth=data.line){
    return node("line",{
      x1:sx(segment.x1),
      y1:sy(segment.y1),
      x2:sx(segment.x2),
      y2:sy(segment.y2),
      class:className,
      "stroke-width":lineWidth,
      "stroke-linecap":"round"
    });
  }

  function circle(point,radius,className,lineWidth=data.line){
    return node("circle",{
      cx:sx(point.x),
      cy:sy(point.y),
      r:sx(point.x+radius)-sx(point.x),
      class:className,
      "stroke-width":lineWidth
    });
  }

  function text(item){
    const label=node("text",{
      x:sx(item.x),
      y:sy(item.y),
      dx:item.ox*data.labelPad,
      dy:item.oy*data.labelPad,
      "text-anchor":item.anchor,
      "font-size":data.font[item.size],
      class:item.kind+"-text"
    });
    label.textContent=item.text;
    return label;
  }

  function arrow(segment){
    line(segment,"motion",data.heavyLine);
    const angle=Math.atan2(segment.y2-segment.y1,segment.x2-segment.x1);
    const baseX=segment.x2-Math.cos(angle)*data.arrow.back;
    const baseY=segment.y2-Math.sin(angle)*data.arrow.back;
    const leftX=baseX+Math.sin(angle)*data.arrow.wing;
    const leftY=baseY-Math.cos(angle)*data.arrow.wing;
    const rightX=baseX-Math.sin(angle)*data.arrow.wing;
    const rightY=baseY+Math.cos(angle)*data.arrow.wing;
    node("polygon",{
      points:[
        sx(segment.x2)+","+sy(segment.y2),
        sx(leftX)+","+sy(leftY),
        sx(rightX)+","+sy(rightY)
      ].join(" "),
      class:"arrow-head"
    });
  }

  data.panels.forEach(panel=>rect(panel,"panel"));

  data.grid.forEach(row=>{
    data.grid.forEach(column=>{
      const square={
        x:data.board.x+column*data.board.cell,
        y:data.board.y+row*data.board.cell,
        w:data.board.cell,
        h:data.board.cell
      };
      const shade=(row+column)%data.two===data.zero?"square-light":"square-dark";
      rect(square,shade,data.zero);
    });
  });

  data.pieces.forEach(piece=>{
    const glyph=node("text",{
      x:sx(data.board.x+(piece[data.zero]+data.half)*data.board.cell),
      y:sy(data.board.y+(piece[1]+data.half)*data.board.cell),
      "text-anchor":"middle",
      "font-size":data.font.piece,
      class:"piece-"+piece[3],
      "stroke-width":data.line
    });
    glyph.textContent=piece[data.two];
  });

  rect(data.singleFrame,"frame");
  line({
    x1:data.singleFrame.x+data.frameInset,
    y1:data.singleFrame.y+data.singleFrame.h-data.frameFloor,
    x2:data.singleFrame.x+data.singleFrame.w-data.frameInset,
    y2:data.singleFrame.y+data.singleFrame.h-data.frameFloor
  },"frame-floor");
  circle(
    {x:data.singleFrame.ballX,y:data.singleFrame.ballY},
    data.singleFrame.ballR,
    "ball"
  );

  data.frames.forEach(frame=>{
    rect(frame,"frame");
    line({
      x1:frame.x+data.frameInset,
      y1:frame.y+frame.h-data.frameFloor,
      x2:frame.x+frame.w-data.frameInset,
      y2:frame.y+frame.h-data.frameFloor
    },"frame-floor");
    circle({x:frame.ballX,y:frame.ballY},data.ballR,"ball");
  });

  arrow(data.timeline);
  rect(data.banner,"banner");
  data.labels.forEach(text);
}catch(error){
  const svg=document.getElementById("art");
  const fallback=document.getElementById("fallback");
  svg.hidden=true;
  fallback.hidden=false;
  fallback.textContent="Схема должна была показать шахматную доску, достаточную для следующего хода, и сравнить один кадр летящего мяча с четырьмя последовательными кадрами, по которым видны направление и скорость.";
}
</script>
</body>
</html>
