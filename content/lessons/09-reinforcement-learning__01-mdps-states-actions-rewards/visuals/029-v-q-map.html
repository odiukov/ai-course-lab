<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Разница между V и Q на одной клетке</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f9fc;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #59657a;
      --border: #cbd5e1;
      --cell: #e8f1ff;
      --cell-border: #3973c6;
      --arrow: #637086;
      --best: #c46a05;
      --best-soft: #ffe4b3;
      --legend: #eef3f8;
      --label-halo: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #101722;
        --panel: #151e2b;
        --ink: #edf3fb;
        --muted: #aebbd0;
        --border: #405069;
        --cell: #19304c;
        --cell-border: #74adff;
        --arrow: #aab7ca;
        --best: #ffb54d;
        --best-soft: #563812;
        --legend: #1c2939;
        --label-halo: #151e2b;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      color: var(--ink);
    }

    .figure {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
    }

    .figure-title {
      margin: 0;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 20px;
      font-weight: bold;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 460px;
      background: var(--panel);
    }

    .cell {
      fill: var(--cell);
      stroke: var(--cell-border);
      stroke-width: 4;
    }

    .cell-inner {
      fill: none;
      stroke: var(--cell-border);
      stroke-width: 1;
    }

    .arrow {
      stroke: var(--arrow);
      stroke-width: 5;
      stroke-linecap: round;
    }

    .arrow-head {
      fill: var(--arrow);
      stroke: var(--arrow);
      stroke-width: 2;
      stroke-linejoin: round;
    }

    .best-halo {
      stroke: var(--best-soft);
      stroke-width: 13;
      stroke-linecap: round;
    }

    .arrow.best {
      stroke: var(--best);
      stroke-width: 7;
    }

    .arrow-head.best {
      fill: var(--best);
      stroke: var(--best);
      stroke-width: 3;
    }

    .center-value {
      fill: var(--ink);
      font-size: 42px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .center-name {
      fill: var(--cell-border);
      font-size: 18px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .center-note {
      fill: var(--muted);
      font-size: 15px;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .action-label {
      fill: var(--ink);
      stroke: var(--label-halo);
      stroke-width: 5;
      paint-order: stroke;
      font-size: 17px;
      font-weight: bold;
      dominant-baseline: middle;
    }

    .action-label.best {
      fill: var(--best);
    }

    .best-label {
      fill: var(--best);
      stroke: var(--label-halo);
      stroke-width: 5;
      paint-order: stroke;
      font-size: 14px;
      font-weight: bold;
      dominant-baseline: middle;
    }

    .legend-box {
      fill: var(--legend);
      stroke: var(--border);
      stroke-width: 2;
    }

    .legend-main {
      fill: var(--ink);
      font-size: 17px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .legend-note {
      fill: var(--muted);
      font-size: 14px;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .fallback {
      fill: var(--ink);
      font-size: 18px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .fallback-note {
      fill: var(--muted);
      font-size: 16px;
      text-anchor: middle;
      dominant-baseline: middle;
    }
  </style>
</head>
<body>
  <figure class="figure">
    <figcaption class="figure-title">
      Одна клетка: V оценивает состояние, Q — конкретный ход
    </figcaption>

    <svg
      id="diagram"
      viewBox="0 0 760 460"
      width="760"
      height="460"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description"
    >
      <title id="svg-title">Разница между V и Q на одной клетке GridWorld</title>
      <desc id="svg-description">
        В центре клетки указано V от состояния, равное четырём. Вокруг клетки
        четыре действия с Q-оценками: вверх восемь, вправо шесть, вниз два,
        влево ноль. Верхнее действие выделено как лучшее.
      </desc>
      <g id="scene"></g>
    </svg>
  </figure>

  <script>
    const data = [
      {
        kind: "cell",
        left: -2.3,
        right: 2.3,
        top: 2.3,
        bottom: -2.3,
        insetLeft: -2.08,
        insetRight: 2.08,
        insetTop: 2.08,
        insetBottom: -2.08,
        nameX: 0,
        nameY: 1.12,
        valueX: 0,
        valueY: 0.12,
        noteX: 0,
        noteY: -1.18,
        name: "ценность состояния",
        value: "V(s) = 4",
        note: "общее ожидание под политикой"
      },
      {
        kind: "action",
        direction: "up",
        tailX: 0,
        tailY: 2.68,
        baseX: 0,
        baseY: 4.68,
        tipX: 0,
        tipY: 5.3,
        head: [
          { x: -0.3, y: 4.67 },
          { x: 0, y: 5.3 },
          { x: 0.3, y: 4.67 }
        ],
        labelX: 0.72,
        labelY: 4.08,
        labelDx: 10,
        labelDy: 0,
        anchor: "start",
        label: "вверх · Q(s,a) = 8",
        bestX: -0.72,
        bestY: 4.08,
        bestDx: -10,
        bestDy: 0,
        bestAnchor: "end",
        bestText: "лучшее действие",
        best: true
      },
      {
        kind: "action",
        direction: "right",
        tailX: 2.68,
        tailY: 0,
        baseX: 4.68,
        baseY: 0,
        tipX: 5.3,
        tipY: 0,
        head: [
          { x: 4.67, y: 0.3 },
          { x: 5.3, y: 0 },
          { x: 4.67, y: -0.3 }
        ],
        labelX: 4.18,
        labelY: 0.82,
        labelDx: 0,
        labelDy: 0,
        anchor: "middle",
        label: "вправо · Q(s,a) = 6",
        best: false
      },
      {
        kind: "action",
        direction: "down",
        tailX: 0,
        tailY: -2.68,
        baseX: 0,
        baseY: -4.68,
        tipX: 0,
        tipY: -5.3,
        head: [
          { x: -0.3, y: -4.67 },
          { x: 0, y: -5.3 },
          { x: 0.3, y: -4.67 }
        ],
        labelX: 0.72,
        labelY: -3.82,
        labelDx: 10,
        labelDy: 0,
        anchor: "start",
        label: "вниз · Q(s,a) = 2",
        best: false
      },
      {
        kind: "action",
        direction: "left",
        tailX: -2.68,
        tailY: 0,
        baseX: -4.68,
        baseY: 0,
        tipX: -5.3,
        tipY: 0,
        head: [
          { x: -4.67, y: 0.3 },
          { x: -5.3, y: 0 },
          { x: -4.67, y: -0.3 }
        ],
        labelX: -4.18,
        labelY: 0.82,
        labelDx: 0,
        labelDy: 0,
        anchor: "middle",
        label: "влево · Q(s,a) = 0",
        best: false
      },
      {
        kind: "legend",
        left: -8.75,
        right: 8.75,
        top: -5.68,
        bottom: -7.02,
        mainX: 0,
        mainY: -6.12,
        noteX: 0,
        noteY: -6.65,
        main: "При π(a|s) = 25%:  V(s) = (8 + 6 + 2 + 0) / 4 = 4",
        note: "V усредняет действия; Q сохраняет различия между ними"
      },
      {
        kind: "fallback",
        mainX: 0,
        mainY: 0.7,
        noteX: 0,
        noteY: -0.4,
        main: "В центре V(s) = 4, вокруг — четыре Q(s,a).",
        note: "Вверх 8, вправо 6, вниз 2, влево 0; вверх — лучший ход."
      }
    ];

    const origin = Object.freeze({ x: 380, y: 205 });
    const scale = 34;

    const sx = x => origin.x + x * scale;
    const sy = y => origin.y - y * scale;

    try {
      const svg = document.getElementById("diagram");
      const scene = document.getElementById("scene");
      const namespace = "http://www.w3.org/2000/svg";

      const make = (name, attributes, parent) => {
        const element = document.createElementNS(namespace, name);

        Object.entries(attributes).forEach(([attribute, value]) => {
          element.setAttribute(attribute, String(value));
        });

        parent.appendChild(element);
        return element;
      };

      const cell = data.find(item => item.kind === "cell");
      const actions = data.filter(item => item.kind === "action");
      const legend = data.find(item => item.kind === "legend");
      const fallback = data.find(item => item.kind === "fallback");

      make("rect", {
        x: sx(cell.left),
        y: sy(cell.top),
        width: sx(cell.right) - sx(cell.left),
        height: sy(cell.bottom) - sy(cell.top),
        class: "cell"
      }, scene);

      make("rect", {
        x: sx(cell.insetLeft),
        y: sy(cell.insetTop),
        width: sx(cell.insetRight) - sx(cell.insetLeft),
        height: sy(cell.insetBottom) - sy(cell.insetTop),
        class: "cell-inner"
      }, scene);

      const name = make("text", {
        x: sx(cell.nameX),
        y: sy(cell.nameY),
        class: "center-name"
      }, scene);
      name.textContent = cell.name;

      const value = make("text", {
        x: sx(cell.valueX),
        y: sy(cell.valueY),
        class: "center-value"
      }, scene);
      value.textContent = cell.value;

      const note = make("text", {
        x: sx(cell.noteX),
        y: sy(cell.noteY),
        class: "center-note"
      }, scene);
      note.textContent = cell.note;

      actions.forEach(action => {
        const group = make("g", {
          "aria-label": action.label
        }, scene);

        if (action.best) {
          make("line", {
            x1: sx(action.tailX),
            y1: sy(action.tailY),
            x2: sx(action.baseX),
            y2: sy(action.baseY),
            class: "best-halo"
          }, group);
        }

        make("line", {
          x1: sx(action.tailX),
          y1: sy(action.tailY),
          x2: sx(action.baseX),
          y2: sy(action.baseY),
          class: action.best ? "arrow best" : "arrow"
        }, group);

        make("polygon", {
          points: action.head
            .map(point => `${sx(point.x)},${sy(point.y)}`)
            .join(" "),
          class: action.best ? "arrow-head best" : "arrow-head"
        }, group);

        const actionLabel = make("text", {
          x: sx(action.labelX),
          y: sy(action.labelY),
          dx: action.labelDx,
          dy: action.labelDy,
          "text-anchor": action.anchor,
          class: action.best ? "action-label best" : "action-label"
        }, group);
        actionLabel.textContent = action.label;

        if (action.best) {
          const bestLabel = make("text", {
            x: sx(action.bestX),
            y: sy(action.bestY),
            dx: action.bestDx,
            dy: action.bestDy,
            "text-anchor": action.bestAnchor,
            class: "best-label"
          }, group);
          bestLabel.textContent = action.bestText;
        }
      });

      make("rect", {
        x: sx(legend.left),
        y: sy(legend.top),
        width: sx(legend.right) - sx(legend.left),
        height: sy(legend.bottom) - sy(legend.top),
        class: "legend-box"
      }, scene);

      const legendMain = make("text", {
        x: sx(legend.mainX),
        y: sy(legend.mainY),
        class: "legend-main"
      }, scene);
      legendMain.textContent = legend.main;

      const legendNote = make("text", {
        x: sx(legend.noteX),
        y: sy(legend.noteY),
        class: "legend-note"
      }, scene);
      legendNote.textContent = legend.note;
    } catch (error) {
      const svg = document.getElementById("diagram");
      const namespace = "http://www.w3.org/2000/svg";
      const fallback = data.find(item => item.kind === "fallback");

      svg.replaceChildren();

      const main = document.createElementNS(namespace, "text");
      main.setAttribute("x", sx(fallback.mainX));
      main.setAttribute("y", sy(fallback.mainY));
      main.setAttribute("class", "fallback");
      main.textContent = fallback.main;
      svg.appendChild(main);

      const note = document.createElementNS(namespace, "text");
      note.setAttribute("x", sx(fallback.noteX));
      note.setAttribute("y", sy(fallback.noteY));
      note.setAttribute("class", "fallback-note");
      note.textContent = fallback.note;
      svg.appendChild(note);
    }
  </script>
</body>
</html>
