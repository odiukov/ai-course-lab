<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Как γ ослабляет далёкие награды</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f4ec;
      --panel: #fffdf7;
      --ink: #24231f;
      --muted: #67645d;
      --axis: #393832;
      --grid: #d8d3c7;
      --guide: #aaa398;
      --slow: #176f91;
      --slow-soft: #d9edf4;
      --fast: #c05a28;
      --fast-soft: #f5dfd2;
      --horizon: #777168;
      --focus: #7d7469;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #171918;
        --panel: #202321;
        --ink: #f2efe7;
        --muted: #bbb6ab;
        --axis: #e0dcd3;
        --grid: #3e423e;
        --guide: #666b65;
        --slow: #67c6e8;
        --slow-soft: #263f47;
        --fast: #f29a6a;
        --fast-soft: #49352b;
        --horizon: #aaa49a;
        --focus: #918a80;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
    }

    .diagram {
      width: 100%;
      max-width: 860px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .diagram-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--ink);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--panel);
      border: 1px solid var(--grid);
    }

    .axis {
      stroke: var(--axis);
      stroke-width: 1.8;
      fill: none;
    }

    .tick {
      stroke: var(--axis);
      stroke-width: 1.4;
    }

    .guide {
      stroke: var(--guide);
      stroke-width: 1.2;
      fill: none;
    }

    .step-guide {
      stroke: var(--focus);
      stroke-width: 1.4;
      fill: none;
    }

    .curve {
      fill: none;
      stroke-width: 3.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .curve-fast {
      stroke: var(--fast);
    }

    .curve-slow {
      stroke: var(--slow);
    }

    .point-fast {
      fill: var(--panel);
      stroke: var(--fast);
      stroke-width: 3;
    }

    .point-slow {
      fill: var(--panel);
      stroke: var(--slow);
      stroke-width: 3;
    }

    .horizon {
      stroke: var(--horizon);
      stroke-width: 1.7;
      stroke-linecap: round;
    }

    text {
      font-size: 14px;
      fill: var(--ink);
    }

    .axis-label {
      font-size: 15px;
      font-weight: 650;
    }

    .tick-label {
      font-size: 13px;
      fill: var(--muted);
    }

    .curve-label {
      font-size: 15px;
      font-weight: 700;
    }

    .fast-label {
      fill: var(--fast);
    }

    .slow-label {
      fill: var(--slow);
    }

    .value-label {
      font-size: 15px;
      font-weight: 700;
    }

    .horizon-label {
      font-size: 14px;
      fill: var(--muted);
    }

    .note {
      font-size: 15px;
      font-weight: 650;
      fill: var(--ink);
    }

    .fallback {
      font-size: 16px;
      fill: var(--ink);
    }

    noscript {
      font-size: 15px;
      color: var(--ink);
    }
  </style>
</head>
<body>
  <main class="diagram">
    <div class="diagram-title">Как γ ослабляет далёкие награды</div>

    <svg
      id="chart"
      viewBox="0 0 860 410"
      width="860"
      height="410"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-desc"
    >
      <title id="svg-title">Вес будущей награды при разных значениях гамма</title>
      <desc id="svg-desc">
        Две кривые гамма в степени t от шага 0 до шага 100.
        На шаге 20 веса равны примерно 0,12 для гамма 0,9
        и 0,82 для гамма 0,99. Эффективные горизонты —
        10 и 100 шагов.
      </desc>
    </svg>

    <noscript>
      Схема должна показать кривые γᵗ для γ = 0,9 и γ = 0,99:
      через 20 шагов остаётся соответственно около 0,12 и 0,82 веса,
      а эффективные горизонты составляют 10 и 100 шагов.
    </noscript>
  </main>

  <script>
    const data = [
      {
        gamma: 0.9,
        horizon: 10,
        markedWeight: 0.12,
        curveClass: "curve curve-fast",
        pointClass: "point-fast",
        labelClass: "curve-label fast-label",
        valueClass: "value-label fast-label",
        legendText: "γ = 0,9",
        valueText: "0,12 — остаётся 12%",
        horizonText: "горизонт ≈ 10 шагов",
        horizonY: -0.2,
        legendY: 0.82
      },
      {
        gamma: 0.99,
        horizon: 100,
        markedWeight: 0.82,
        curveClass: "curve curve-slow",
        pointClass: "point-slow",
        labelClass: "curve-label slow-label",
        valueClass: "value-label slow-label",
        legendText: "γ = 0,99",
        valueText: "0,82 — сохраняется 82%",
        horizonText: "горизонт ≈ 100 шагов",
        horizonY: -0.35,
        legendY: 0.94
      },
      {
        zero: 0,
        one: 1,
        xMax: 100,
        markStep: 20,
        sampleStep: 1,
        yTop: 1,
        yLabel: 1.11,
        tickHalf: 0.018,
        horizonTickHalf: 0.025,
        pointRadius: 0.72,
        dashLength: 0.7,
        dashGap: 0.6,
        legendX1: 69,
        legendX2: 76,
        legendTextX: 78,
        noteX: 50,
        noteY: -0.59,
        fallbackX: 50,
        fallbackY1: 0.61,
        fallbackY2: 0.47,
        fastValueDx: 11,
        fastValueDy: 25,
        slowValueDx: 11,
        slowValueDy: -14,
        tickDy: 23,
        axisLabelDy: -12,
        horizonShortDx: 10,
        horizonShortDy: 5,
        horizonLongDy: -9,
        yLabelDy: 0
      }
    ];

    const origin = Object.freeze([82, 260]);
    const scale = Object.freeze([7.05, 216]);

    const sx = x => origin[0] + x * scale[0];
    const sy = y => origin[1] - y * scale[1];

    const [fastSeries, slowSeries, cfg] = data;
    const chart = document.getElementById("chart");
    const SVG_NS = "http://www.w3.org/2000/svg";

    function element(name, attributes, className) {
      const node = document.createElementNS(SVG_NS, name);

      if (className) {
        node.setAttribute("class", className);
      }

      for (const [key, value] of Object.entries(attributes)) {
        node.setAttribute(key, String(value));
      }

      return node;
    }

    function line(x1, y1, x2, y2, className, dashed) {
      const attributes = {
        x1: sx(x1),
        y1: sy(y1),
        x2: sx(x2),
        y2: sy(y2)
      };

      if (dashed) {
        attributes["stroke-dasharray"] =
          Math.abs(sx(cfg.dashLength) - sx(cfg.zero)) + " " +
          Math.abs(sx(cfg.dashGap) - sx(cfg.zero));
      }

      return element("line", attributes, className);
    }

    function label(x, y, value, className, anchor, dx, dy) {
      const node = element(
        "text",
        {
          x: sx(x),
          y: sy(y),
          "text-anchor": anchor,
          dx: dx,
          dy: dy
        },
        className
      );

      node.textContent = value;
      return node;
    }

    function curvePath(series) {
      let pathData = "";
      let firstPoint = true;

      for (
        let step = cfg.zero;
        step <= cfg.xMax;
        step += cfg.sampleStep
      ) {
        const weight = Math.pow(series.gamma, step);
        pathData +=
          (firstPoint ? "M " : " L ") +
          sx(step) + " " + sy(weight);
        firstPoint = false;
      }

      return element(
        "path",
        { d: pathData },
        series.curveClass
      );
    }

    function appendAxes(layer) {
      layer.append(
        line(cfg.zero, cfg.zero, cfg.xMax, cfg.zero, "axis"),
        line(cfg.zero, cfg.zero, cfg.zero, cfg.yTop, "axis")
      );

      for (const step of [cfg.zero, cfg.markStep, cfg.xMax]) {
        layer.append(
          line(
            step,
            -cfg.tickHalf,
            step,
            cfg.tickHalf,
            "tick"
          )
        );
      }

      layer.append(
        label(
          cfg.zero,
          cfg.zero,
          "0",
          "tick-label",
          "start",
          cfg.zero,
          cfg.tickDy
        ),
        label(
          cfg.markStep,
          cfg.zero,
          "20 шагов",
          "tick-label",
          "middle",
          cfg.zero,
          cfg.tickDy
        ),
        label(
          cfg.xMax,
          cfg.zero,
          "100",
          "tick-label",
          "end",
          cfg.zero,
          cfg.tickDy
        ),
        label(
          cfg.xMax,
          cfg.zero,
          "шаг будущего t",
          "axis-label",
          "end",
          cfg.zero,
          cfg.axisLabelDy
        ),
        label(
          cfg.zero,
          cfg.yLabel,
          "вес будущей награды γᵗ",
          "axis-label",
          "start",
          cfg.zero,
          cfg.yLabelDy
        )
      );
    }

    function appendGuides(layer) {
      const fastWeight = Math.pow(fastSeries.gamma, cfg.markStep);
      const slowWeight = Math.pow(slowSeries.gamma, cfg.markStep);

      layer.append(
        line(
          cfg.markStep,
          cfg.zero,
          cfg.markStep,
          cfg.yTop,
          "step-guide",
          true
        ),
        line(
          cfg.zero,
          fastWeight,
          cfg.markStep,
          fastWeight,
          "guide"
        ),
        line(
          cfg.zero,
          slowWeight,
          cfg.markStep,
          slowWeight,
          "guide"
        )
      );
    }

    function appendPointAndValue(layer, series, dx, dy) {
      const exactWeight = Math.pow(series.gamma, cfg.markStep);
      const point = element(
        "circle",
        {
          cx: sx(cfg.markStep),
          cy: sy(exactWeight),
          r: Math.abs(sx(cfg.pointRadius) - sx(cfg.zero))
        },
        series.pointClass
      );

      const value = label(
        cfg.markStep,
        exactWeight,
        series.valueText,
        series.valueClass,
        "start",
        dx,
        dy
      );

      layer.append(point, value);
    }

    function appendLegend(layer, series) {
      layer.append(
        line(
          cfg.legendX1,
          series.legendY,
          cfg.legendX2,
          series.legendY,
          series.curveClass
        ),
        label(
          cfg.legendTextX,
          series.legendY,
          series.legendText,
          series.labelClass,
          "start",
          cfg.zero,
          cfg.zero
        )
      );
    }

    function appendHorizon(layer, series, shortHorizon) {
      layer.append(
        line(
          cfg.zero,
          series.horizonY,
          series.horizon,
          series.horizonY,
          "horizon"
        ),
        line(
          cfg.zero,
          series.horizonY - cfg.horizonTickHalf,
          cfg.zero,
          series.horizonY + cfg.horizonTickHalf,
          "horizon"
        ),
        line(
          series.horizon,
          series.horizonY - cfg.horizonTickHalf,
          series.horizon,
          series.horizonY + cfg.horizonTickHalf,
          "horizon"
        )
      );

      if (shortHorizon) {
        layer.append(
          label(
            series.horizon,
            series.horizonY,
            series.horizonText,
            "horizon-label",
            "start",
            cfg.horizonShortDx,
            cfg.horizonShortDy
          )
        );
      } else {
        layer.append(
          label(
            series.horizon / (cfg.one + cfg.one),
            series.horizonY,
            series.horizonText,
            "horizon-label",
            "middle",
            cfg.zero,
            cfg.horizonLongDy
          )
        );
      }
    }

    try {
      const geometry = element("g", {});
      const guides = element("g", {});
      const curves = element("g", {});
      const annotations = element("g", {});

      appendAxes(geometry);
      appendGuides(guides);

      curves.append(
        curvePath(fastSeries),
        curvePath(slowSeries)
      );

      appendPointAndValue(
        annotations,
        fastSeries,
        cfg.fastValueDx,
        cfg.fastValueDy
      );
      appendPointAndValue(
        annotations,
        slowSeries,
        cfg.slowValueDx,
        cfg.slowValueDy
      );

      appendLegend(annotations, slowSeries);
      appendLegend(annotations, fastSeries);
      appendHorizon(annotations, fastSeries, true);
      appendHorizon(annotations, slowSeries, false);

      annotations.append(
        label(
          cfg.noteX,
          cfg.noteY,
          "Одна и та же награда — разный вес для решения сегодня",
          "note",
          "middle",
          cfg.zero,
          cfg.zero
        )
      );

      chart.append(geometry, guides, curves, annotations);
    } catch (error) {
      const removable = chart.querySelectorAll("g, path, line, circle, text");

      for (const node of removable) {
        node.remove();
      }

      const firstLine = element(
        "text",
        {
          x: sx(cfg.fallbackX),
          y: sy(cfg.fallbackY1),
          "text-anchor": "middle"
        },
        "fallback"
      );
      firstLine.textContent =
        "Здесь должны быть две кривые веса γᵗ на шагах 0–100.";

      const secondLine = element(
        "text",
        {
          x: sx(cfg.fallbackX),
          y: sy(cfg.fallbackY2),
          "text-anchor": "middle"
        },
        "fallback"
      );
      secondLine.textContent =
        "На шаге 20: 0,12 при γ = 0,9 и 0,82 при γ = 0,99.";

      chart.append(firstLine, secondLine);
    }
  </script>
</body>
</html>
