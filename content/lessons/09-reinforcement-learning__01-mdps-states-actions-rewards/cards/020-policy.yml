- concept: вероятности действий, задаваемые политикой для одного состояния, образуют нормированное распределение
  question: В некотором состоянии доступны три действия. Политика назначила первым двум действиям вероятности 0.46 и 0.17. Какую вероятность она должна назначить третьему действию?
  explanation: 'Вероятности всех доступных действий в одном состоянии должны в сумме давать единицу. Поэтому из единицы нужно вычесть 0.46 и 0.17: для третьего действия остаётся 0.37.'
  kind: numeric
  answer: 0.37
  tolerance: 0.001
  id: 020-policy-1
  fingerprint: e43342e8
- concept: детерминированность политики не влечёт детерминированность переходов среды
  question: Робот в заданном состоянии всегда выбирает команду «ехать прямо», но из-за скользкого пола после этой команды может оказаться в разных местах. Как верно описать такую систему?
  explanation: Политика описывает выбор команды агентом, а переход — реакцию среды. Здесь агент всегда выбирает одну команду, поэтому политика детерминированная. Разные возможные результаты этой команды означают стохастический переход.
  kind: choice
  options:
    - Политика стохастическая, а переход детерминированный
    - И политика, и переход детерминированные
    - Политика детерминированная, а переход стохастический
    - И политика, и переход стохастические
  correct: 2
  id: 020-policy-2
  fingerprint: 1f1dddd7
- concept: политика задаёт распределение действий отдельно для каждого состояния
  question: Почему одного распределения вероятностей действий для единственного состояния недостаточно, чтобы полностью задать политику агента?
  explanation: Запись π(a | s) явно зависит от состояния s. Поэтому полное описание политики должно сообщать, как агент выбирает действия во всех возможных ситуациях, а не только в одной.
  kind: open
  reference: Политика должна определять распределение по доступным действиям для каждого состояния, в котором агент может принимать решение. В разных состояниях эти распределения могут различаться.
  id: 020-policy-3
