- concept: положительное масштабирование всех наград сохраняет предпочтения политик, но изменяет величину обучающих обновлений
  question: Почему умножение всех наград в среде на одну и ту же положительную константу обычно не меняет оптимальную политику, но может сделать обучение PPO или DQN нестабильным?
  explanation: Масштаб награды влияет не только на смысл предпочтений, но и на численную динамику обучения. Большие по модулю сигналы создают более крупные ошибки и обновления, хотя оптимальное поведение в идеализированной постановке остаётся тем же.
  kind: open
  reference: Дисконтированная отдача каждой траектории умножается на одну и ту же положительную константу, поэтому порядок предпочтительности политик сохраняется. Однако целевые значения, ошибки и градиенты меняются по масштабу, из-за чего прежние параметры оптимизатора и ограничения обновлений могут стать неподходящими. Поэтому награды часто нормализуют.
