- concept: жадная политика выбирает действие, максимизирующее Q-значение оцениваемой политики
  question: Заполни формулу жадного выбора действия по Q-функции.
  explanation: Жадное улучшение сравнивает Q-значения всех допустимых действий в состоянии и выбирает любое действие из множества максимизаторов.
  kind: cloze
  template: a_{greedy}(s) \in ___ Q^\pi(s,a)
  answer: \arg\max_a
  accept:
    - argmax_a
    - \operatorname{argmax}_a
    - arg max по a
  id: 036-greedy-policy-1
  fingerprint: 8266fb5b
- concept: жадный выбор по Q учитывает ожидаемую отдачу целиком, а не только ближайшую награду
  question: Действие A даёт более высокую ближайшую награду, но действие B имеет более высокое Q-значение. Какое действие выберет политика, жадная по Q?
  explanation: Q-значение включает ближайшую награду и ценность последующего поведения. Поэтому жадная по Q политика выбирает B, даже если его немедленная награда меньше.
  kind: choice
  options:
    - Действие B, потому что его ожидаемая дисконтированная отдача выше
    - Действие A, потому что жадный выбор всегда максимизирует ближайшую награду
    - Случайное действие, потому что ближайшая награда и Q-значение расходятся
  correct: 0
  id: 036-greedy-policy-2
  fingerprint: 4e9be9a1
- concept: теорема об улучшении политики гарантирует неухудшение при жадном выборе по точным Q-значениям
  question: Объясни своими словами, почему политика, жадная по точным значениям Q^π, не хуже исходной политики π.
  explanation: Исходная политика усредняет Q^π по своему распределению действий, а максимум не может быть меньше такого среднего. Это локальное неравенство во всех состояниях даёт глобальное неухудшение политики.
  kind: open
  reference: В каждом состоянии новая политика выбирает действие с максимальным Q^π. Его ценность не меньше среднего Q^π по действиям, которые выбирала исходная политика. Поэтому последовательное следование новой политике не уменьшает ожидаемую отдачу из любого состояния.
  id: 036-greedy-policy-3
  fingerprint: 23f55914
