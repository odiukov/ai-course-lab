- concept: при оценке фиксированной политики изменяются оценки состояний, а не сама политика
  question: Что изменяется в ходе итеративной оценки фиксированной политики?
  explanation: Политика и модель среды остаются неизменными. Алгоритм многократно уточняет только V-функцию, чтобы определить ожидаемые последствия следования заданной политике.
  kind: choice
  options:
    - Вероятности действий политики
    - Оценки ценности состояний
    - Награды и переходы среды
  correct: 1
  id: 031-policy-eval-algorithm-1
  fingerprint: b118935a
- concept: сходимость прохода контролируется по максимальному абсолютному изменению ценности состояния
  question: После вычисления нового значения `v` для состояния дополни обновление показателя изменения за проход.
  explanation: '`delta` хранит наибольшее абсолютное изменение среди всех состояний. Если даже это изменение меньше допуска, очередной полный проход почти не сдвинул таблицу ценностей.'
  kind: cloze
  template: delta = ___
  answer: max(delta, abs(v - V[s]))
  accept:
    - max(delta, |v - V[s]|)
    - max(delta, abs(V[s] - v))
  id: 031-policy-eval-algorithm-2
  fingerprint: 75e8e137
- concept: начальные значения V являются рабочим приближением, которое уточняется повторными обновлениями Беллмана
  question: До начала итеративной оценки всем нетерминальным состояниям присвоили одинаковую ценность. Как следует интерпретировать эти значения?
  explanation: Инициализация лишь задаёт отправную точку вычислений. Оценки становятся содержательными после повторных обновлений по наградам, переходам и текущим значениям следующих состояний.
  kind: choice
  options:
    - Как начальное приближение для последующих пересчётов
    - Как доказательство одинакового качества всех состояний
    - Как окончательные ожидаемые отдачи политики
  correct: 0
  id: 031-policy-eval-algorithm-3
  fingerprint: f47585e6
