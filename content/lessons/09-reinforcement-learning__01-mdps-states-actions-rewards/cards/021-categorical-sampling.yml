- concept: дискретное действие выбирается методом накопленных вероятностей
  question: Расположите этапы случайного выбора действия из дискретной политики в правильном порядке.
  explanation: Накопленные вероятности разбивают единичный интервал на участки. Равномерная случайная точка попадает в каждый участок с вероятностью, равной его длине.
  kind: order
  items:
    - Получить вероятности допустимых действий для текущего состояния
    - Построить последовательные интервалы по накопленным вероятностям
    - Сгенерировать случайную точку из равномерного распределения
    - Выбрать действие, интервал которого содержит случайную точку
  id: 021-categorical-sampling-1
  fingerprint: 198a5cb1
- concept: выбор наиболее вероятного действия не равнозначен выборке из стохастической политики
  question: Как исполнить стохастическую политику, сохранив заданные ею вероятности действий?
  explanation: Выборка по распределению сохраняет случайность политики. Постоянный выбор максимума превращает её в детерминированное правило и исключает остальные действия.
  kind: choice
  options:
    - Каждый раз случайно выбирать действие в соответствии с его вероятностью
    - Всегда выбирать действие с наибольшей вероятностью
    - Всегда выбирать действие с наименьшей ненулевой вероятностью
    - Один раз выбрать действие и использовать его до конца эпизода
  correct: 0
  id: 021-categorical-sampling-2
  fingerprint: c11be048
- concept: ожидаемое число выборов действия равно числу испытаний, умноженному на его вероятность
  question: Действие имеет вероятность 0.35 при каждом из 80 независимых выборов. Сколько раз в среднем оно будет выбрано?
  explanation: 'Математическое ожидание числа выборов равно произведению количества испытаний на вероятность действия: 80 × 0.35 = 28. Фактическое число в отдельной серии может отличаться.'
  kind: numeric
  answer: 28
  tolerance: 0.001
  id: 021-categorical-sampling-3
  fingerprint: ae5ab7a2
