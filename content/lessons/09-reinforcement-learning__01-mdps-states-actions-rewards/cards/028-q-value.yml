- concept: Q-функция задаёт ожидаемую отдачу при фиксированных текущем состоянии и первом действии
  question: Заполни условие в определении Q-функции для политики π.
  explanation: Q^π(s, a) усредняет полную будущую отдачу при условии, что агент находится в состоянии s и первым выполняет действие a.
  kind: cloze
  template: Q^π(s, a) = E[G_t | ___]
  answer: s_t = s, a_t = a
  accept:
    - a_t = a, s_t = s
    - s_t=s, a_t=a
  id: 028-q-value-1
  fingerprint: a1e5bf34
- concept: Q-значение зависит от политики, которой агент следует после первого действия
  question: В одной и той же среде две политики начинают из состояния s одинаковым действием a, но затем выбирают действия по-разному. Как могут соотноситься Q^π(s, a) и Q^μ(s, a)?
  explanation: Первое действие зафиксировано, но Q учитывает всю последующую отдачу. После первого перехода политики π и μ могут привести к разным траекториям и наградам.
  kind: choice
  options:
    - Они обязательно равны, потому что первое действие совпадает
    - Они могут различаться из-за разных последующих решений
    - Они зависят только от награды за первый переход
  correct: 1
  id: 028-q-value-2
  fingerprint: 07f4075a
- concept: ценность состояния равна среднему Q-значений первых действий с весами политики
  question: В состоянии s политика выбирает действие A с вероятностью 0.3, а действие B — с вероятностью 0.7. Известно, что Q^π(s, A) = 8, а Q^π(s, B) = -4. Чему равно V^π(s)?
  explanation: 'Нужно усреднить Q-значения по распределению действий политики: V^π(s) = 0.3 · 8 + 0.7 · (-4) = -0.4.'
  kind: numeric
  answer: -0.4
  tolerance: 0.01
  id: 028-q-value-3
  fingerprint: f2efb658
