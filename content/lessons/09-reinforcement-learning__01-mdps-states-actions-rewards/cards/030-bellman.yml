- concept: уравнение Беллмана разлагает ценность состояния на ожидаемую ближайшую награду и дисконтированную ценность следующего состояния
  question: При заданной политике ожидаемая награда за ближайший переход равна 13, ожидаемая ценность следующего состояния — 17, а коэффициент дисконтирования — 0.72. Чему равна ценность текущего состояния по уравнению Беллмана?
  explanation: По уравнению Беллмана V(s) = E[r + γV(s')]. Поэтому V(s) = 13 + 0.72 × 17 = 25.24. Дисконтируется только ценность продолжения, а не ближайшая награда.
  kind: numeric
  answer: 25.24
  tolerance: 0.001
  id: 030-bellman-1
  fingerprint: 365ee21c
- concept: математическое ожидание в уравнении Беллмана учитывает случайность политики и переходов среды
  question: Что необходимо усреднить при вычислении правой части уравнения Беллмана для стохастической политики в стохастической среде?
  explanation: Сначала действие выбирается согласно π(a|s), а затем среда порождает следующий результат согласно P(s', r|s, a). Поэтому ожидание охватывает оба источника случайности.
  kind: choice
  options:
    - Только действия, выбираемые политикой
    - Только возможные следующие состояния среды
    - Действия по вероятностям политики и результаты переходов по вероятностям среды
    - Все состояния MDP с одинаковыми весами
  correct: 2
  id: 030-bellman-2
  fingerprint: 3354e58f
- concept: появление V-функции по обе стороны уравнения Беллмана задаёт условие самосогласованности
  question: Объясни своими словами, почему появление одной и той же V-функции по обе стороны уравнения Беллмана не означает повторного учёта будущих наград.
  explanation: Ближайшая награда учитывается отдельно, а V следующего состояния сворачивает все более поздние награды. Рекурсивная запись не копирует один и тот же участок будущего, а разрезает отдачу после первого перехода.
  kind: open
  reference: Правая часть отделяет только ближайшую награду, а V следующего состояния представляет оставшийся хвост отдачи, начинающийся уже после этого перехода. Поэтому разные слагаемые относятся к непересекающимся частям траектории, а равенство задаёт самосогласованную, или неподвижную, ценность.
  id: 030-bellman-3
  fingerprint: ca9a14dd
