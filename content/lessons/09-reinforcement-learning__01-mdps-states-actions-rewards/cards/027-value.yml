- concept: ценность одного состояния может различаться для разных политик
  question: Для одного и того же состояния s получено V^α(s) = 7 и V^β(s) = -2. Как правильно интерпретировать это различие?
  explanation: V-функция определяется парой «состояние и политика». Разные правила выбора последующих действий создают разные распределения траекторий и поэтому могут давать разные ожидаемые отдачи из одного состояния.
  kind: choice
  options:
    - Состояние s на самом деле должно быть представлено как два разных состояния
    - После старта из s политика α в среднем приносит большую отдачу, чем политика β
    - Переходы среды при политике α обязательно детерминированы
