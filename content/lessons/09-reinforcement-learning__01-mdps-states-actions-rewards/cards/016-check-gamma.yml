- concept: в коротком ограниченном эпизоде можно учитывать поздние награды без дисконтирования
  question: Почему в короткой задаче с гарантированным завершением эпизода может быть разумно не ослаблять поздние награды?
  explanation: 'Именно поэтому в RLHF для языковых моделей часто используют γ = 1: эпизоды короткие и ограниченные, так что далёкого бесконечного будущего нет.'
  kind: open
  reference: Эпизод имеет конечную длину, поэтому сумма наград остаётся ограниченной, а все последствия находятся внутри небольшого горизонта и могут учитываться полностью.
