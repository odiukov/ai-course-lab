- concept: слишком большой коэффициент дисконтирования затрудняет распределение заслуг между ранними действиями
  question: Объясни своими словами, почему коэффициент дисконтирования, очень близкий к единице, может усложнить обучение агента в длинном эпизоде.
  explanation: При большом γ эффективный горизонт растёт. Это помогает учитывать отдалённые последствия, но одна далёкая награда начинает влиять на обучение множества ранних действий, усложняя credit assignment.
  kind: open
  reference: Далёкая награда сохраняет заметный вес и может быть связана со множеством предшествующих действий. Из-за этого труднее определить, какие именно решения привели к результату, а оценка заслуг становится шумной.
  id: 013-horizon-2
