- concept: ограничение координаты границами сетки с помощью вложенных min и max
  question: Дополните выражение так, чтобы новая координата строки оставалась между символическими границами LOW и HIGH включительно.
  explanation: Внутренняя операция не даёт координате уйти ниже нижней границы, а внешняя — выше верхней. Поэтому действие в сторону стены оставляет агента в граничной клетке.
  kind: cloze
  template: nr = ___
  answer: min(max(r + dr, LOW), HIGH)
  accept:
    - min(HIGH, max(LOW, r + dr))
    - max(LOW, min(HIGH, r + dr))
  id: 008-code-grid-step-1
  fingerprint: 8544e9d4
- concept: поглощающее терминальное состояние не допускает дальнейших переходов
  question: Функцию перехода вызвали для состояния, в котором эпизод уже завершён. Какое поведение соответствует поглощающему терминальному состоянию?
  explanation: Из поглощающего терминального состояния нельзя уйти действием. Функция возвращает то же состояние, сообщает о завершении и не считает вызов новым штрафуемым переходом.
  kind: choice
  options:
    - Выполнить действие, но сохранить признак завершения
    - Переместить агента в начальное состояние нового эпизода
    - Вернуть прежнее состояние и признак завершения, не начисляя штраф за новый шаг
    - Выбрать случайное соседнее состояние
  correct: 2
  id: 008-code-grid-step-2
  fingerprint: fec87fc9
- concept: постоянный отрицательный штраф за переход делает короткие пути выгоднее длинных
  question: Два маршрута приводят к одной и той же цели, но один содержит меньше переходов. Почему при постоянном отрицательном вознаграждении за переход агенту выгоднее короткий маршрут?
  explanation: Постоянный штраф накапливается на протяжении маршрута. Если конечный результат одинаков, меньшее число переходов означает меньший общий штраф и более высокий возврат.
  kind: open
  reference: Каждый дополнительный переход добавляет отрицательное вознаграждение и уменьшает суммарный возврат. Поэтому маршрут с меньшим числом переходов даёт больший суммарный возврат.
  id: 008-code-grid-step-3
  fingerprint: 7e5f65ec
