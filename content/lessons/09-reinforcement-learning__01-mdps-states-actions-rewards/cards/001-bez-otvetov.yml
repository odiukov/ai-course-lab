- concept: обучение с подкреплением получает награды за взаимодействие вместо готовых меток правильных действий
  question: Какой сигнал обучения характерен для агента в обучении с подкреплением?
  explanation: В RL среда не сообщает правильный ответ для каждого состояния. Агент совершает действия и получает числовые награды, по которым оценивает последствия своего поведения.
  kind: choice
  options:
    - Правильное действие, указанное для каждой встреченной ситуации
    - Скалярная награда, полученная после выбранного действия и изменения состояния
    - Готовая функция, сопоставляющая каждой ситуации лучший выбор
  correct: 1
  id: 001-bez-otvetov-1
  fingerprint: 86550a46
- concept: скалярная награда не указывает непосредственно, какое действие было правильным
  question: Объясни своими словами, почему полученной награды недостаточно, чтобы считать последнее действие агента правильным.
  explanation: В отличие от метки в обучении с учителем, награда сообщает качество результата, но не называет правильное действие. Для обучения нужно учитывать контекст переходов и последствия решений.
  kind: open
  reference: Награда оценивает результат взаимодействия, который может зависеть от предыдущих состояний и всей последовательности действий. Поэтому она не является меткой правильности последнего действия.
  id: 001-bez-otvetov-2
  fingerprint: eb4c2c29
