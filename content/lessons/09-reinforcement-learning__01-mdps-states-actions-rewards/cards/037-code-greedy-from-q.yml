- concept: поиск максимума безопасно инициализировать первым фактическим кандидатом
  question: Список `q` непуст, но все его Q-оценки могут быть отрицательными. Заполни пропуск так, чтобы цикл корректно находил лучшее действие.
  explanation: '`next(it)` берёт индекс и оценку первого доступного действия. Поэтому начальный максимум является реальным кандидатом, и алгоритм корректно работает даже тогда, когда все оценки ниже нуля.'
  kind: cloze
  template: |-
    it = iter(enumerate(q))
    best_idx, best_value = ___
    for idx, value in it:
        if value > best_value:
            best_idx, best_value = idx, value
  answer: next(it)
  accept:
    - next(it)
  id: 037-code-greedy-from-q-2
  fingerprint: efeba68e
- concept: строгое сравнение при равных максимумах сохраняет первый найденный индекс
  question: Алгоритм перебирает `q = [-10.6, -4.8, -4.8, -12.9]` слева направо и меняет выбранное действие только при условии `value > best_value`. Как он разрешит равенство максимальных оценок?
  explanation: При равной оценке условие со строгим `>` ложно, поэтому уже сохранённый индекс не меняется. Замена сравнения на `>=` привела бы к выбору последнего встретившегося максимума.
  kind: choice
  options:
    - Сохранит первое действие с максимальной оценкой
    - Выберет последнее действие с максимальной оценкой
    - Выберет одно из них случайно
  correct: 0
