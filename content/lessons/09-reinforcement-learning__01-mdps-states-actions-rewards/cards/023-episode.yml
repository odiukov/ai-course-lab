- concept: остановку по лимиту шагов необходимо отличать от достижения терминального состояния
  question: Прогон остановился из-за ограничения длины, хотя среда ни разу не вернула done = True. Можно ли считать, что агент достиг терминального состояния? Объясни своими словами.
  explanation: Признак done сообщает о завершении со стороны среды. Исчерпание max_steps останавливает внешний цикл, но само по себе не означает достижение цели или другого терминального исхода.
  kind: open
  reference: Нет. Это усечённый по лимиту прогон, а не завершение в терминальном состоянии. Лимит лишь предотвращает бесконечное выполнение; причину остановки следует учитывать отдельно от успешного завершения.
  id: 023-episode-2
  fingerprint: '42266671'
