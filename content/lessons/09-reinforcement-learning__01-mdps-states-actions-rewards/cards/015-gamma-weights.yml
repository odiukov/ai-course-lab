- concept: дисконтирование задаёт порог, при котором отложенная награда становится не хуже немедленной
  question: Одно действие сразу приносит 16 баллов. Другое приносит единственную награду R через 6 шагов. При γ = 0,8 чему примерно должно быть равно минимальное R, чтобы второе действие имело не меньшую дисконтированную ценность?
  explanation: Нужно решить R·0,8⁶ ≥ 16. Поэтому R ≥ 16/0,8⁶ ≈ 61,04. Большая отложенная награда может уступать меньшей немедленной, если её дисконтированный вклад недостаточен.
  kind: numeric
  answer: 61.04
  tolerance: 0.02
