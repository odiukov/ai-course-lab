- concept: динамика без доступной модели переходов специфицируется как sample-only
  question: Симулятор позволяет выбрать действие и увидеть следующее состояние, но не раскрывает формулу перехода или вероятности возможных исходов. Как следует описать такую динамику в спецификации MDP?
  explanation: Если переход можно только наблюдать, но нельзя вычислить или перечислить его распределение, это sample-only динамика. Стохастическая модель считается известной лишь тогда, когда заданы вероятности исходов.
  kind: choice
  options:
    - 'Как sample-only: переходы доступны только через прогоны'
    - Как детерминированную
    - Как стохастическую с известной моделью
    - Как терминальную
  correct: 0
  id: 043-mdp-spec-1
  fingerprint: 2e21558e
- concept: проверяемая спецификация награды фиксирует вычисление, источник данных и момент начисления
  question: Объясни своими словами, что нужно указать в спецификации награды, чтобы её начисление можно было независимо проверить по данным среды.
  explanation: 'Слов вроде «успех» или «вовлечённость» недостаточно: проверяющий должен суметь взять данные перехода, применить записанное правило и получить ту же награду.'
  kind: open
  reference: 'Нужно определить конкретную функцию расчёта, назвать источник входных данных и указать, когда начисляется награда: на промежуточных переходах, при завершении или в обоих случаях. Также следует отметить, является сигнал разреженным или формируется на протяжении эпизода.'
  id: 043-mdp-spec-2
  fingerprint: d840fc5f
- concept: редкий выброс награды на порядки выше обычного сигнала является риском нестабильных обновлений
  question: В задаче почти все переходы дают небольшие награды сопоставимого масштаба, но одно редкое событие создаёт награду на несколько порядков больше. Что следует сделать до запуска обучения?
  explanation: Крупный выброс может доминировать в целевых значениях и обучающих обновлениях. До обучения нужно проверить обоснованность масштаба и при необходимости изменить расчёт, нормализацию или ограничение награды.
  kind: choice
  options:
    - Пометить масштаб награды как риск нестабильных градиентов и пересмотреть формулировку
    - Считать выброс безопасным, потому что он встречается редко
    - Увеличить коэффициент дисконтирования, чтобы усилить выброс
    - Удалить из состояния признаки, связанные с редким событием
  correct: 0
  id: 043-mdp-spec-3
  fingerprint: c2e71967
