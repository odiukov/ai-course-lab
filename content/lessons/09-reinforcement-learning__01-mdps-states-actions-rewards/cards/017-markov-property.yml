- concept: для восстановления марковости в состояние добавляют влияющую на переходы информацию о прошлом
  question: Робот на складе наблюдает своё положение, но его тормозной путь зависит от массы груза, загруженного ранее. Как изменить представление состояния, чтобы оно лучше удовлетворяло марковскому свойству?
  explanation: Масса груза влияет на распределение следующего положения после команды торможения. Если включить её в текущее состояние, для прогноза перехода больше не потребуется знать историю загрузки.
  kind: choice
  options:
    - Заменить алгоритм обучения на более сложный
    - Усреднить все переходы независимо от массы груза
    - Добавить массу груза в состояние робота
  correct: 2
  id: 017-markov-property-1
  fingerprint: a0deb84e
- concept: марковское свойство ограничивает распределение переходов, а не требует одинаковых случайных исходов
  question: Два запуска из одного состояния при одном и том же действии привели к разным следующим состояниям. Почему это само по себе не нарушает марковское свойство и что нужно сравнивать на самом деле?
  explanation: Марковское свойство не делает среду детерминированной. Оно требует, чтобы при фиксированных состоянии и действии история не изменяла вероятности возможных следующих состояний.
  kind: open
  reference: Случайные переходы допускают разные отдельные исходы. Нужно проверять, совпадает ли условное распределение следующих состояний для одинаковых текущего состояния и действия независимо от предшествующей истории.
  id: 017-markov-property-2
  fingerprint: 424ee02c
