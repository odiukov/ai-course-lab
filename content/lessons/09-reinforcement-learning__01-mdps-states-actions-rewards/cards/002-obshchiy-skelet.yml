- concept: единая структура MDP сохраняется при смене предметной области
  question: Объясни своими словами, что остаётся общим между управлением запасами и генерацией ответа языковой моделью, если обе задачи представлены как MDP.
  explanation: MDP отделяет общие роли от предметного содержания. Поэтому остатки и текст могут быть разными состояниями, а закупка и токен — разными действиями, но схема перехода и оценки результата остаётся общей.
  kind: open
  reference: 'В обеих задачах агент получает состояние, выбирает доступное действие, после взаимодействия со средой оказывается в новом состоянии и получает награду. Предметный смысл этих элементов различается: например, состоянием могут быть складские остатки или уже созданный текст, а действием — объём закупки или следующий токен.'
