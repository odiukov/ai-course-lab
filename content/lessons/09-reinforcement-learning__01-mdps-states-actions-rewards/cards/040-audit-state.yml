- concept: выбор между конечным окном наблюдений и рекуррентной памятью зависит от длительности значимой истории
  question: Агент видит только текущий экран. Для решения иногда важно событие, произошедшее настолько давно, что оно не помещается в практичное фиксированное окно наблюдений. Какое представление состояния наиболее уместно?
  explanation: Стопка кадров помогает, когда скрытую динамику можно восстановить по короткому окну. Если значимое событие могло произойти гораздо раньше, рекуррентное состояние позволяет переносить сжатую информацию о прошлом между шагами.
  kind: choice
  options:
    - Только текущий экран
    - Стопка фиксированного числа последних экранов
    - Текущий экран вместе с рекуррентным скрытым состоянием LSTM или GRU
    - Случайно выбранный экран из истории
  correct: 2
  id: 040-audit-state-1
  fingerprint: d88af062
- concept: рекуррентное состояние служит обновляемым сжатым резюме значимой истории, а не полным архивом наблюдений
  question: Объясни своими словами, какую роль играет скрытое состояние LSTM или GRU в частично наблюдаемой среде и почему ему не требуется хранить всю историю дословно.
  explanation: Рекуррентная сеть формирует внутреннюю память, которая дополняет текущее наблюдение. Для приближения марковского состояния важно сохранить влияющие на переходы и действия сведения, а не воспроизвести всю последовательность входов.
  kind: open
  reference: Скрытое состояние обновляется после каждого наблюдения и переносит вперёд информацию из прошлого, полезную для предсказания будущего и выбора действия. Оно может отбрасывать детали, которые не влияют на решения, поэтому является сжатым резюме, а не архивом всех наблюдений.
  id: 040-audit-state-2
  fingerprint: 60a80c8a
