- concept: отдача вычисляется как сумма наград с весами, убывающими по степеням коэффициента дисконтирования
  question: Последовательные награды равны 7, 20 и 30, а коэффициент дисконтирования γ = 0,3. Чему равна отдача с момента получения первой награды?
  explanation: 'Награды входят с весами 1, γ и γ²: 7 + 0,3 · 20 + 0,3² · 30 = 7 + 6 + 2,7 = 15,7.'
  kind: numeric
  answer: 15.7
  tolerance: 0.01
  id: 011-discounted-sum-1
  fingerprint: dc26a023
- concept: отдача характеризует конкретную последовательность наград, а не средний результат по возможным траекториям
  question: Два запуска одной политики из одного состояния завершились разными последовательностями наград. Объясни, почему их отдачи могут различаться.
  explanation: Отдача G_t складывает награды одной конкретной траектории с дисконтированием. Ожидаемая отдача по множеству возможных траекторий — это функция ценности V или Q, а не отдача отдельного запуска.
  kind: open
  reference: Отдача вычисляется отдельно для фактически полученной последовательности наград. Если траектории и награды различаются, различаются и их дисконтированные суммы; усреднение по возможным траекториям относится уже к функции ценности.
  id: 011-discounted-sum-2
  fingerprint: ffded92d
