- concept: пустая последовательность наград имеет нулевую отдачу как пустая сумма
  question: Какой результат должна возвращать функция дисконтированной отдачи для эпизода без единой награды и почему?
  explanation: В реализации накопитель изначально равен 0. Если наград нет, цикл не выполняется и это значение остаётся результатом.
  kind: open
  reference: 'Она должна возвращать нулевую отдачу: сумма по пустой последовательности равна нулю, независимо от коэффициента дисконтирования.'
  id: 012-code-discounted-return-2
  fingerprint: 5cfa3192
- concept: промежуточное округление накапливает численную ошибку в дисконтированной отдаче
  question: Почему при вычислении дисконтированной отдачи не следует округлять накопленное значение после обработки каждой награды?
  explanation: Дробная часть отдачи может участвовать в последующих вычислениях ценности или обучения. Преждевременное округление необратимо меняет эти вычисления.
  kind: open
  reference: Каждое промежуточное округление теряет часть точности, а ошибки накапливаются и искажают итоговую отдачу. Округлять следует только при отображении результата, если это требуется.
  id: 012-code-discounted-return-3
  fingerprint: 6e21c0c6
