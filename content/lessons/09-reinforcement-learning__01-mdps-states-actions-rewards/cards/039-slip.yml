- concept: влияние стохастичности переходов на ценность зависит от состояния, политики и геометрии среды
  question: Объясните, почему добавление соскальзывания в GridWorld не позволяет без вычислений заключить, что ценность каждого состояния уменьшится.
  explanation: Дополнительная случайность не имеет универсального знака влияния на V. В материале вероятность соскальзывания 0,1 иногда добавляет штрафные шаги, но при равномерной политике и симметричном шуме изменения могут взаимно компенсироваться.
  kind: open
  reference: Соскальзывание может отклонить полезное действие от цели, но может и исправить неудачно выбранное действие. Вероятности этих событий зависят от политики, положения цели, стен и текущей клетки, поэтому нужно пересчитать ожидаемые переходы и ценности.
