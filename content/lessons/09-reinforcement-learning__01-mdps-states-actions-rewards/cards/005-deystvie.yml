- concept: действие в MDP — исполнимая команда, а не желаемый результат
  question: Агент управляет складским роботом. Что корректно считать действием в MDP?
  explanation: Действие — конкретная команда, которую среда разрешает выполнить. Рост числа заказов, снижение расходов и отсутствие столкновений — желаемые результаты, но не команды управления.
  kind: choice
  options:
    - Доставить больше заказов за смену
    - Повернуть робота влево
    - Снизить общие расходы склада
    - Избежать всех столкновений
  correct: 1
  id: 005-deystvie-1
  fingerprint: e9dbeb62
- concept: детализация пространства действий создаёт компромисс между точностью управления и сложностью выбора
  question: Объясни своими словами, как увеличение детализации пространства действий влияет на возможности агента и сложность принятия решений.
  explanation: Крупные действия упрощают поиск решения, но ограничивают управление. Более мелкие действия дают точность ценой большего пространства поиска.
  kind: open
  reference: Более детальное пространство действий позволяет агенту точнее управлять системой, но увеличивает число вариантов, которые приходится исследовать и сравнивать. Поэтому обучение и выбор действия обычно становятся сложнее.
  id: 005-deystvie-2
  fingerprint: 57bfa19e
- concept: множество допустимых действий может зависеть от текущего состояния
  question: Заполни пропуск в записи множества действий, доступных агенту именно в состоянии s.
  explanation: Общее пространство действий может содержать все команды среды, но в конкретном состоянии часть из них бывает недоступна. Это выражают множеством A(s) или маской допустимых действий.
  kind: cloze
  template: 'Допустимые действия в состоянии s: ___'
  answer: A(s)
  accept:
    - A_s
    - action set A(s)
  id: 005-deystvie-3
  fingerprint: a41b22a0
