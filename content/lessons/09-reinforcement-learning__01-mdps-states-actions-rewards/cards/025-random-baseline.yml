- concept: ограничение длины rollout при постоянном отрицательном штрафе смещает среднюю отдачу в менее отрицательную сторону
  question: Почему ограничение максимальной длины rollout может сделать оценку средней отдачи случайной политики менее отрицательной, чем её ожидаемая отдача без ограничения, если каждый переход приносит штраф?
  explanation: При штрафе −1 каждый дополнительный переход уменьшает отдачу. Лимит отсекает хвост особенно долгих случайных блужданий и не учитывает их последующие штрафы. Поэтому в уроке ограниченная оценка около −58 менее отрицательна, чем неограниченное математическое ожидание −59,4.
  kind: open
  reference: Ограничение досрочно обрывает долгие незавершённые траектории. После обрыва штрафы за оставшиеся переходы больше не начисляются, поэтому усечённые отдачи оказываются выше, то есть менее отрицательными, чем полные.
  id: 025-random-baseline-2
  fingerprint: 4cb60955
