- concept: вероятности всех возможных следующих состояний при фиксированных состоянии и действии суммируются в единицу
  question: После фиксированного действия складской робот оказывается у стеллажа A с вероятностью 0.63, у стеллажа B — с вероятностью 0.22, а в остальных случаях — у стеллажа C. Какова вероятность оказаться у стеллажа C?
  explanation: 'P(s'' | s, a) — распределение вероятностей, поэтому суммы вероятностей исходов должна равняться единице: 1 − 0.63 − 0.22 = 0.15.'
  kind: numeric
  answer: 0.15
