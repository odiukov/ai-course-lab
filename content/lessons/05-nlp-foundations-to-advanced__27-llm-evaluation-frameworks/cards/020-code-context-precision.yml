- concept: нерелевантные фрагменты после последнего релевантного не меняют context precision
  question: К ранжированной выдаче добавили в самый конец несколько нерелевантных фрагментов. Как изменится context precision, вычисляемая по точности префикса на релевантных позициях?
  explanation: Метрика складывает значения точности только на позициях релевантных фрагментов. Поздние нерелевантные фрагменты не меняют ни уже вычисленные префиксы, ни число релевантных фрагментов.
  kind: choice
  options:
    - Увеличится
    - Уменьшится
    - Не изменится
  correct: 2
  id: 020-code-context-precision-1
  fingerprint: 62efc241
- concept: ошибка разбора ответа судьи должна обрабатываться отдельно от метки нерелевантности
  question: LLM-судья должен определить релевантность фрагмента, но вернул ответ, который невозможно разобрать. Почему нельзя автоматически считать фрагмент нерелевантным и как должен поступить вычислитель метрики?
  explanation: Подмена ошибки разбора отрицательной меткой смешивает технический сбой с предметным решением судьи и искажает context precision. Явный режим отказа позволяет заметить проблему и не выдавать повреждённую оценку за корректную.
  kind: open
  reference: 'Неразбираемый ответ ничего не сообщает о релевантности фрагмента. Его нужно оформить как отдельную ошибку оценки: явно завершить вычисление с ошибкой либо применить контролируемый повтор, обязательно зарегистрировав сбой.'
  id: 020-code-context-precision-2
  fingerprint: a7bdc7f6
