- concept: оценка LLM-судьи зависит от заданной рубрикой метрики качества
  question: Ответ прямо отвечает на вопрос пользователя, но содержит факт, противоречащий найденному контексту. Как должны соотноситься оценки одного LLM-судьи по релевантности ответа и по достоверности относительно контекста?
  explanation: Рубрика задаёт отдельное измерение качества. Ответ может быть прямым и тематически уместным, но недостоверным, если его утверждения не подтверждаются контекстом.
  kind: choice
  options:
    - Обе оценки должны быть высокими, поскольку ответ сформулирован прямо
    - Обе оценки должны совпадать, поскольку судья проверяет один и тот же ответ
    - Оценка релевантности может быть высокой, а оценка достоверности — низкой
  correct: 2
  id: 005-llm-as-judge-1
  fingerprint: c40058e4
- concept: LLM-as-judge преобразует рубрику и входные данные примера в оценку по конкретному критерию
  question: Расположите этапы оценки ответа с помощью LLM-судьи в правильном порядке.
  explanation: Судья получает не только ответ, но и основание для сравнения вместе с явным правилом. Затем модель применяет рубрику к тройке query–context–answer и возвращает оценку выбранного измерения качества.
  kind: order
  items:
    - Подготовить вопрос, найденный контекст, ответ и рубрику выбранного критерия
    - Передать эти данные модели-судье в промпте оценки
    - Получить и интерпретировать выставленную судьёй оценку
  id: 005-llm-as-judge-2
  fingerprint: 4d9bde6d
