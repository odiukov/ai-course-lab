- concept: RAGAS различает точность отбора контекста и полноту найденного контекста
  question: RAG-система нашла нужный фрагмент, но поставила перед ним много нерелевантных документов. Какая метрика RAGAS наиболее прямо укажет на эту проблему?
  explanation: 'Context precision оценивает, насколько полезные фрагменты преобладают среди извлечённых и насколько высоко они расположены. Context recall отвечает на другой вопрос: не пропустил ли ретривер необходимый контекст.'
  kind: choice
  options:
    - Faithfulness
    - Answer relevance
    - Context precision
    - Context recall
  correct: 2
  id: 003-tri-instrumenta-1
  fingerprint: edadb501
- concept: G-Eval позволяет оценивать ответы по пользовательскому критерию
  question: Команде нужно автоматически проверять, насколько понятно модель объясняет медицинские термины неспециалистам. Какой инструмент лучше всего подходит для задания такого собственного критерия?
  explanation: G-Eval — метод LLM-as-judge, которому можно задать собственный критерий и процедуру оценки. Поэтому он подходит для качеств вроде ясности, тона или соблюдения специальных требований.
  kind: choice
  options:
