- concept: защитный парсер перехватывает только ожидаемые ошибки входных данных
  question: Почему при разборе JSON-ответа LLM-судьи лучше перечислить ожидаемые исключения, а не использовать `except Exception`?
  explanation: '`JSONDecodeError`, `KeyError`, `TypeError` и `ValueError` описывают ожидаемые нарушения контракта ответа. Другие исключения обычно указывают на дефект программы и должны оставаться заметными.'
  kind: open
  reference: Следует перехватывать только ошибки невалидного JSON, отсутствующего ключа, неподходящей структуры и невозможного числового преобразования. Общий `except Exception` способен скрыть программную ошибку в самом парсере, затруднив её обнаружение.
  id: 030-parse-judge-score-2
  fingerprint: a15cb946
