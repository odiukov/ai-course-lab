- concept: полностью обратные ранжирования дают минимальную корреляцию Спирмена
  question: Человек расположил ответы от лучшего к худшему как K, L, M, N, а судья — как N, M, L, K. Что знак и величина корреляции Спирмена говорят о таком судье?
  explanation: 'При полном обращении порядка ρ = −1: каждый ответ, стоящий высоко у человека, занимает симметрично низкую позицию у судьи.'
  kind: open
  reference: 'Корреляция будет минимально возможной и отрицательной: судья систематически ранжирует ответы в порядке, обратном человеческому, поэтому доверять ему сравнение качества нельзя.'
