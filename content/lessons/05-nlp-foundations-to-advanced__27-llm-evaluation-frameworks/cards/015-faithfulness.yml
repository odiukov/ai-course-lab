- concept: утверждение засчитывается, когда entailment имеет наибольшую оценку NLI
  question: 'NLI-модель вернула для утверждения оценки: entailment — 0.41, neutral — 0.38, contradiction — 0.21. Следует ли засчитать утверждение при вычислении faithfulness?'
  explanation: 'Правило сравнивает классы между собой: утверждение засчитывается, если победил entailment. Отдельный порог 0.5 в таком алгоритме не используется.'
  kind: choice
  options:
    - Да, потому что entailment получил наибольшую оценку
    - Нет, потому что оценка entailment меньше 0.5
    - Нет, потому что neutral слишком близок к entailment
