- concept: context recall равен доле утверждений эталонного ответа, подтверждаемых найденным контекстом
  question: Эталонный ответ содержит 7 проверяемых утверждений. Найденный контекст подтверждает ровно 5 из них, причём некоторые доказательства дублируются, а рядом есть нерелевантные фрагменты. Чему равен context recall?
  explanation: 'Context recall считается как отношение числа покрытых эталонных утверждений к их общему числу: 5 / 7 ≈ 0.714. Дубликаты и нерелевантные фрагменты не меняют эту долю.'
  kind: numeric
  answer: 0.714
  tolerance: 0.01
  id: 021-context-recall-1
  fingerprint: b9b20780
- concept: полнота эталонного ответа ограничивает способность context recall обнаруживать пропущенные факты
  question: Эталонный ответ не упоминает важное условие, необходимое для полного ответа пользователю. Ретривер тоже не нашёл это условие, но покрыл все утверждения, присутствующие в эталоне. Какой вывод верен?
  explanation: Метрика проверяет покрытие фактов, перечисленных в эталонном ответе. Если нужного факта в эталоне нет, context recall не включает его в знаменатель и может не заметить пропуск ретривера.
  kind: choice
  options:
    - Context recall может оказаться максимальным, несмотря на фактический пропуск
    - Context recall обязательно снизится, потому что судья самостоятельно восстановит недостающий факт
    - Context recall станет неопределённым при любом неполном эталонном ответе
    - Неполнота эталона повлияет только на context precision
  correct: 0
  id: 021-context-recall-2
  fingerprint: a5532e3f
