- concept: последовательность эвристического разбиения ответа на проверяемые утверждения
  question: Расположи этапы работы функции эвристического разбиения ответа на отдельные утверждения в правильном порядке.
  explanation: Сначала определяют крупные границы предложений, затем осторожно разбирают составные конструкции. Нормализация результата выполняется после разбиения, чтобы удалить появившиеся пустые элементы, не меняя порядок утверждений.
  kind: order
  items:
    - Разбить исходный текст по границам предложений
    - Внутри каждого предложения разделить союзы только там, где обе части выражают самостоятельные сообщения
    - Убрать пробелы и пустые фрагменты, сохранив исходный порядок
  id: 013-split-claims-1
  fingerprint: 3030c60d
- concept: союз следует считать границей утверждений только между самостоятельными сообщениями
  question: Какой текст наивное разбиение по каждому вхождению союза «и» с наибольшей вероятностью разделит ошибочно?
  explanation: Во фразе «текст и изображения» союз связывает однородные дополнения, а не самостоятельные сообщения. Простое регулярное выражение создаст бессмысленный отдельный фрагмент «изображения», поэтому перед разделением полезно проверять обе стороны союза.
  kind: choice
  options:
    - Модель завершила загрузку, и сервер начал принимать запросы.
    - Модель принимает текст и изображения.
    - Индекс обновился, и поиск стал находить новые документы.
  correct: 1
  id: 013-split-claims-2
  fingerprint: 1b3dd972
