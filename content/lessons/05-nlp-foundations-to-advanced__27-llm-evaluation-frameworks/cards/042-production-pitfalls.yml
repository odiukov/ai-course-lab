- concept: нейтрализация позиционного смещения при попарном оценивании
  question: LLM-судья попарно сравнивает ответы A и B. Как организовать оценивание, чтобы обнаружить и уменьшить предпочтение варианта из-за его позиции?
  explanation: Если решение меняется при перестановке ответов, судья реагирует на позицию, а не только на качество. Оценивание обеих перестановок позволяет выявить и сгладить это смещение.
  kind: choice
  options:
    - Оценить пары и в порядке A–B, и в порядке B–A, а затем объединить результаты
    - Всегда помещать более новый ответ первым
    - Попросить судью выставить каждому ответу более подробное объяснение
    - Оставить порядок постоянным, но увеличить размер набора
  correct: 0
  id: 042-production-pitfalls-1
  fingerprint: 88a1e37c
- concept: версионирование golden dataset для воспроизводимого сравнения результатов
  question: Расположи действия при обновлении эталонного набора в правильном порядке.
  explanation: Любое изменение эталонного набора создаёт новую экспериментальную базу. Отдельный тег и его сохранение в отчёте позволяют воспроизвести прогон и не смешивать результаты, полученные на разных версиях данных.
  kind: order
  items:
    - Внести и проверить необходимые изменения в эталонных примерах
    - Создать новый неизменяемый тег версии набора
    - Запустить оценивание на версии с этим тегом
    - Сохранить тег набора вместе с результатами в отчёте
  id: 042-production-pitfalls-2
  fingerprint: f1fb3195
- concept: выбор минимально дорогого LLM-судьи, прошедшего калибровочный порог
  question: Два LLM-судьи прошли установленный порог согласия с человеческой разметкой, но один существенно дешевле. Какого судью выбрать для регулярных регрессионных прогонов и почему?
  explanation: Самая сильная модель не обязательна, если более дешёвая уже прошла калибровку. Экономичный судья поддерживает частые проверки, а редкие прогоны из-за высокой цены повышают риск пропустить регрессию.
  kind: open
  reference: Следует выбрать более дешёвого судью, поскольку требуемая надёжность уже подтверждена калибровкой. Меньшая стоимость позволяет запускать оценивание после каждого изменения, не снижая установленный порог качества.
  id: 042-production-pitfalls-3
  fingerprint: 101a4517
