- concept: context precision оценивает полезность каждого найденного фрагмента для ответа на исходный запрос
  question: По какому принципу LLM-судья должен присвоить найденному фрагменту положительную метку при расчёте context precision?
  explanation: Каждый фрагмент оценивается по содержательной полезности для ответа на запрос. Само по себе дословное цитирование, сходство с соседними результатами или высокое место в выдаче не делает фрагмент релевантным.
  kind: choice
  options:
    - Фрагмент содержит информацию, полезную для ответа на исходный запрос
    - Фрагмент дословно процитирован в сгенерированном ответе
    - Фрагмент похож по формулировкам на соседние результаты поиска
    - Фрагмент занимает достаточно высокую позицию независимо от содержания
  correct: 0
  id: 019-context-precision-1
  fingerprint: aec71351
- concept: context precision усредняет точность префикса на позициях полезных фрагментов
  question: Ретривер вернул восемь фрагментов. Полезными оказались только фрагменты на шестой и восьмой позициях. Чему равен context precision в процентах?
  explanation: На шестой позиции P@k равна одной шестой, а на восьмой — четверти. Среднее этих значений составляет примерно 20,83%. Низкая оценка отражает то, что полезные результаты появились лишь в конце выдачи.
  kind: numeric
  answer: 20.83
  tolerance: 0.05
  id: 019-context-precision-2
  fingerprint: a877ec4a
