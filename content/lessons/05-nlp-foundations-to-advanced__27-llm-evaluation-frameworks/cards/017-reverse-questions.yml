- concept: алгоритм вычисления answer relevance через восстановленные вопросы
  question: Расположите этапы вычисления answer relevance в правильном порядке.
  explanation: Метрика сначала восстанавливает возможные вопросы только из ответа, а затем семантически сравнивает их с исходным вопросом через эмбеддинги и косинусное сходство. Сходства для нескольких восстановленных вопросов обычно усредняются.
  kind: order
  items:
    - Сгенерировать по ответу несколько вопросов, на которые он мог бы отвечать
    - Получить эмбеддинги исходного и восстановленных вопросов
    - Вычислить косинусное сходство исходного вопроса с каждым восстановленным
    - Агрегировать полученные сходства в итоговую оценку
  id: 017-reverse-questions-1
  fingerprint: 7f303322
- concept: усреднение косинусных сходств для нескольких восстановленных вопросов
  question: 'Для восстановленных вопросов получены косинусные сходства с исходным вопросом: 0.72, 0.48 и 0.66. Чему равна их средняя оценка answer relevance?'
  explanation: Среднее равно (0.72 + 0.48 + 0.66) / 3 = 0.62. Несколько восстановленных вопросов позволяют учесть разные возможные интерпретации ответа.
  kind: numeric
  answer: 0.62
  tolerance: 0.001
  id: 017-reverse-questions-2
  fingerprint: 1220fe63
- concept: посторонние темы в ответе снижают answer relevance через восстановленные вопросы
  question: Исходный запрос касается настройки резервного копирования. По ответу LLM восстановила вопросы о резервном копировании, облачных тарифах и редактировании фотографий. Что это означает для answer relevance?
  explanation: Каждый восстановленный вопрос сравнивается с исходным. Вопросы о тарифах и фотографиях семантически далеки от настройки резервного копирования, поэтому они уменьшают агрегированную оценку.
  kind: choice
  options:
    - Оценка будет максимальной, потому что хотя бы один восстановленный вопрос совпадает с намерением пользователя
    - Посторонние восстановленные вопросы снизят среднее семантическое сходство и итоговую релевантность
    - Метрику невозможно вычислить без эталонного правильного ответа
    - Все восстановленные вопросы будут считаться одинаково релевантными из-за общего ответа
  correct: 1
  id: 017-reverse-questions-3
  fingerprint: 878f4dd2
