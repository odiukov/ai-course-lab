- concept: пустые строки исключаются из числителя и знаменателя faithfulness
  question: 'После извлечения получено 6 элементов: 3 пустые строки, 2 подтверждённых контекстом утверждения и 1 неподтверждённое. Чему равен faithfulness?'
  explanation: Пустые строки не являются проверяемыми утверждениями и удаляются. Среди трёх содержательных утверждений подтверждены два, поэтому faithfulness равен 2/3 ≈ 0,67.
  kind: numeric
  answer: 0.67
  tolerance: 0.01
  id: 016-check-faithfulness-1
  fingerprint: 406b1fc4
- concept: faithfulness не определён, если после очистки нет проверяемых утверждений
  question: Экстрактор вернул только пробелы и пустые строки. Какое значение faithfulness корректно записать?
  explanation: Faithfulness — доля подтверждённых утверждений среди проверяемых. Когда после очистки утверждений нет, знаменатель равен нулю, поэтому результат следует хранить как неопределённый, а не как минимальную или максимальную оценку.
  kind: choice
  options:
    - 'Максимальное значение: неподтверждённых утверждений нет'
    - 'Минимальное значение: содержательного ответа нет'
    - 'Неопределённое значение: отсутствует множество утверждений для проверки'
  correct: 2
  id: 016-check-faithfulness-2
  fingerprint: 24cd49c1
