- concept: evaluation_params определяет, какие поля LLMTestCase получает судья
  question: Заполни пропуск, чтобы G-Eval мог сопоставить фактический ответ с эталонным.
  explanation: Поле expected_output может храниться в LLMTestCase, но судья получит его только при включении EXPECTED_OUTPUT в evaluation_params. Без этого поля сравнение ответа с эталоном не входит во вход оценки.
  kind: cloze
  template: evaluation_params=[LLMTestCaseParams.INPUT, LLMTestCaseParams.ACTUAL_OUTPUT, ___]
  answer: LLMTestCaseParams.EXPECTED_OUTPUT
  accept:
    - EXPECTED_OUTPUT
  id: 027-deepeval-case-1
  fingerprint: e89a09de
- concept: результат DeepEval связывает проверяемый случай с баллом и объяснением судьи
  question: Почему в отчёте DeepEval следует сохранять input, actual_output и expected_output вместе с metric.score и metric.reason?
  explanation: Один score не показывает, какой случай оценивался и почему получен такой результат. Поля LLMTestCase дают контекст проверки, а reason позволяет проверить интерпретацию рубрики судьёй.
  kind: open
  reference: Так можно восстановить, что спросили, какой ответ дала система, с каким эталоном его сравнивали, какую оценку выставил судья и чем он её обосновал. Эта связь делает результат проверяемым и помогает разбирать изменения оценки между версиями системы.
  id: 027-deepeval-case-2
  fingerprint: 446c0a00
