- concept: чувствительность faithfulness проверяют на примерах с заранее известными галлюцинациями
  question: В тестовом наборе есть 16 ответов, каждый с одной заранее подтверждённой галлюцинацией. Настроенная проверка faithfulness обнаружила проблему в 12 ответах. Какова доля обнаруженных галлюцинаций?
  explanation: Доля обнаружения равна 12 / 16 = 0.75. Пропущенные подтверждённые галлюцинации показывают, что метрику или её порог нельзя считать надёжным детектором без дополнительной настройки.
  kind: numeric
  answer: 0.75
  tolerance: 0.01
  id: 045-final-quiz-1
  fingerprint: 52a0c9bf
- concept: контролируемое ухудшение системы служит отрицательным тестом для CI-гейта
  question: Расположи действия для проверки, что CI-гейт действительно обнаруживает регрессию RAG-системы.
  explanation: Известное ухудшение играет роль отрицательного контроля. Если после него гейт остаётся зелёным, выбранные метрики, пороги или тестовые примеры не защищают от этой регрессии.
  kind: order
  items:
    - Зафиксировать результат исправной системы на неизменном eval-наборе
    - Контролируемо ухудшить ретривер, например сократить число возвращаемых фрагментов
    - Повторить оценивание и убедиться, что CI-гейт падает
    - Вернуть исходный ретривер и проверить, что гейт снова проходит
  id: 045-final-quiz-2
  fingerprint: a93fddb4
