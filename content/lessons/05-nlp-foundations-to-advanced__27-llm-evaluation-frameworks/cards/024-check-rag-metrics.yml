- concept: низкие context precision и context recall могут одновременно указывать на две разные ошибки ретривера
  question: У RAG-системы одновременно низкие context precision и context recall. Как точнее всего интерпретировать этот результат?
  explanation: Context precision падает из-за лишних найденных фрагментов, а context recall — из-за пропущенной нужной информации. Обе неисправности ретривера могут возникнуть одновременно.
  kind: choice
  options:
    - Ретривер принёс лишние фрагменты и при этом не нашёл часть нужной информации
    - Генератор обязательно выдумал неподтверждённые утверждения
    - Ответ полностью опирается на контекст, но сформулирован слишком кратко
    - LLM-судья предпочёл ответ модели своего семейства
  correct: 0
  id: 024-check-rag-metrics-1
  fingerprint: fdc0b8e9
- concept: высокая faithfulness не гарантирует полноту ответа
  question: Почему ответ может получить высокую faithfulness, хотя в нём отсутствует важный факт, необходимый для полного ответа на вопрос?
  explanation: Faithfulness обнаруживает неподтверждённые добавления генератора, а не пропуски в его ответе. Для оценки полноты нужны другие проверки, например сопоставление ответа с вопросом или эталоном.
  kind: open
  reference: Faithfulness проверяет, подтверждается ли контекстом каждое высказанное утверждение, но не требует, чтобы генератор упомянул все нужные факты. Поэтому неполный, но полностью подтверждённый ответ может иметь высокую faithfulness.
  id: 024-check-rag-metrics-2
  fingerprint: efaa2807
