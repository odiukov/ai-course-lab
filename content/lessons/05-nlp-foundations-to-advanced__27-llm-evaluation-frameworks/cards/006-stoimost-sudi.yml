- concept: регрессионная оценка сравнивает версии системы на одном контрольном наборе после каждого изменения
  question: Команда изменила разбиение документов на фрагменты. Какая проверка лучше всего выявит ухудшения, затронувшие лишь часть пользовательских запросов?
  explanation: Регрессионная оценка использует один и тот же контрольный набор, чтобы изменение состава примеров не маскировало просадку. Низкая стоимость LLM-судьи позволяет включить такой полный прогон в проверку каждого изменения.
  kind: choice
  options:
    - Проверить несколько запросов, на которых новая настройка уже показала улучшение
    - Прогнать прежнюю и новую версии на одном полном контрольном наборе и сравнить оценки
    - Оценить только скорость обработки запросов новой версией
    - Попросить разработчика субъективно сравнить несколько случайных ответов
