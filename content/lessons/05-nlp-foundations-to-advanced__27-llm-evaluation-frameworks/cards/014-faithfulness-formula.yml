- concept: роли контекста и проверяемого утверждения во входе NLI-модели
  question: Как сформировать вход NLI-модели при проверке утверждения ответа на соответствие найденному контексту?
  explanation: NLI определяет, следует ли гипотеза из посылки. Поэтому источником фактов, то есть посылкой, служит контекст, а проверяемое атомарное утверждение становится гипотезой.
  kind: choice
  options:
    - Контекст передать как посылку, а утверждение — как гипотезу
    - Утверждение передать как посылку, а контекст — как гипотезу
    - Передать только утверждение, поскольку контекст нужен после классификации
  correct: 0
  id: 014-faithfulness-formula-1
  fingerprint: 65f1a26f
- concept: neutral означает отсутствие в контексте данных для подтверждения или опровержения утверждения
  question: 'Контекст сообщает: «Резервные копии шифруются при хранении». В ответе сказано: «Резервные копии шифруются при передаче». Какую метку NLI следует выбрать и почему?'
  explanation: Отсутствие подтверждения не равно противоречию. Для contradiction контекст должен содержать несовместимый факт, а здесь данных о передаче просто недостаточно.
  kind: open
  reference: 'Neutral: контекст ничего не сообщает о шифровании при передаче, поэтому утверждение из него не следует, но и не противоречит ему.'
  id: 014-faithfulness-formula-2
  fingerprint: fa491587
