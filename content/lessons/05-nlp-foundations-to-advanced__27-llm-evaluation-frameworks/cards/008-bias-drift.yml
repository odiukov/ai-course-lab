- concept: при неизбежной смене версии судьи обе версии оцениваемой системы нужно заново сравнить в одинаковых условиях
  question: Команда обязана заменить модель-судью новой версией. Как организовать оценку, чтобы не принять изменение шкалы судьи за улучшение или регрессию RAG-системы?
  explanation: Оценки разных версий судьи нельзя напрямую считать одной шкалой. Повторная оценка обеих систем одним новым судьёй устраняет этот источник различий, а человеческая разметка помогает проверить, что обновлённый судья действительно измеряет нужное качество.
  kind: open
  reference: Нужно прогнать и старую, и новую версии RAG-системы новой моделью-судьёй на одном контрольном наборе, сохранив одинаковые промпт и настройки, а новую шкалу дополнительно сверить с человеческой разметкой.
