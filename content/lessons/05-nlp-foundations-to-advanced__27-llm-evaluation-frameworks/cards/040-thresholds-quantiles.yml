- concept: превышение допустимого числа невалидных оценок независимо блокирует CI
  question: CI требует среднее не ниже 0.86, нижний квантиль не ниже 0.68 и не более трёх отказов судьи. Прогон дал среднее 0.91, нижний квантиль 0.74 и четыре отказа. Какое решение должен принять CI?
  explanation: 'Все условия гейта независимы и должны выполняться одновременно. Даже при хорошем среднем и нижнем квантиле четыре отказа превышают допустимый максимум, поэтому merge блокируется: непроверенные случаи нельзя считать успешными.'
  kind: choice
  options:
    - Разрешить merge, потому что обе метрики качества прошли пороги
    - Заблокировать merge из-за превышения допустимого числа отказов
    - Разрешить merge, но заменить отказы минимальными оценками
  correct: 1
  id: 040-thresholds-quantiles-2
  fingerprint: f8f552c4
- concept: квантильный гейт допускает ограниченный слабый хвост, тогда как порог для каждого примера запрещает любой единичный провал
  question: Объясни своими словами, чем нижний квантиль в CI отличается от проверки одного и того же порога для каждого тестового примера.
  explanation: Абсолютный порог даёт строгую гарантию для каждого случая, но чувствителен к единичному шумному измерению. Нижний квантиль контролирует распределение слабых результатов и потому мягче, однако отдельная крайне низкая оценка может не заблокировать merge.
  kind: open
  reference: Проверка каждого примера блокирует merge при любом результате ниже порога. Квантильный гейт допускает ограниченную долю слабых примеров, но требует, чтобы заданная граница нижнего хвоста не ухудшалась. Он устойчивее к шуму судьи и изначально трудным случаям, однако не гарантирует отсутствие отдельных провалов.
  id: 040-thresholds-quantiles-3
  fingerprint: f9b0bcbd
