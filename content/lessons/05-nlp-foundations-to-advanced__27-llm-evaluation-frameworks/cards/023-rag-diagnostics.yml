- concept: комбинация высоких метрик контекста и низкой faithfulness локализует сбой в генераторе
  question: У RAG-системы context precision и context recall высокие, но faithfulness заметно ниже нормы. Какой компонент следует проверить первым?
  explanation: Высокие context precision и recall означают, что генератор получил достаточно полезного контекста без избытка шума. Низкая faithfulness при таких условиях указывает прежде всего на неподтверждённые утверждения в сгенерированном ответе.
  kind: choice
  options:
    - 'Индексатор: он обязательно потерял нужные документы'
    - 'Генератор: он добавляет утверждения, не подтверждённые найденным контекстом'
    - 'Эмбеддинг запроса: он обязательно извлекает слишком много лишних фрагментов'
  correct: 1
  id: 023-rag-diagnostics-1
  fingerprint: 103901df
- concept: после сбоя ретривера генератор диагностируют повторно на исправленном контексте
  question: Расставь действия в правильном порядке, если context recall низкий и одновременно просели метрики ответа.
  explanation: Неполный контекст ограничивает возможности генератора и может ухудшать downstream-метрики. Поэтому сначала устраняют потерю нужных сведений при поиске, затем повторяют оценивание и только после этого отдельно диагностируют генерацию.
  kind: order
  items:
    - Определить низкий context recall как наиболее ранний обнаруженный сбой в RAG-конвейере
    - Исправить ретривер и повторно запустить оценивание на том же наборе
    - По новым значениям faithfulness и answer relevance решать, осталась ли отдельная проблема генератора
  id: 023-rag-diagnostics-2
  fingerprint: ebf648a0
