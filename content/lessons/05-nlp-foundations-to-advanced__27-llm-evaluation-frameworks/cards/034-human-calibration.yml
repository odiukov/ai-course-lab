- concept: совпадение средних оценок не доказывает калиброванность LLM-судьи
  question: Объясни, почему одинаковое среднее у ручных оценок и оценок LLM-судьи ещё не означает, что судья откалиброван.
  explanation: Калибровка проверяет согласие оценок на общих примерах, а не только итоговый агрегат. Одинаковые средние могут скрывать систематические расхождения в отдельных областях шкалы.
  kind: open
  reference: 'Ошибки могут взаимно компенсироваться: судья способен завышать баллы одним ответам и занижать другим, сохраняя то же среднее. Нужно попарно сопоставить оценки и изучить график расхождений, после чего уточнить рубрику и повторить проверку.'
