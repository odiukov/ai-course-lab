- concept: корреляция Спирмена не определена, если одна из последовательностей рангов не имеет вариации
  question: Почему функция вычисления корреляции Спирмена должна отклонить вход, в котором все оценки одного эксперта одинаковы?
  explanation: Одинаковым оценкам можно назначить средние ранги, но все получившиеся ранги также будут одинаковыми. Их стандартное отклонение равно нулю, поэтому корреляция не определена и должна приводить к явной ошибке.
  kind: choice
  options:
    - Одинаковые оценки нельзя преобразовать в ранги
    - У рангов нет вариации, поэтому знаменатель корреляции равен нулю
    - Корреляция Спирмена допускает только целочисленные оценки
    - Для одинаковых оценок нужно автоматически вернуть нейтральную корреляцию
