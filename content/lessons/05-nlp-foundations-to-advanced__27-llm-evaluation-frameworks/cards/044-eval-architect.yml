- concept: окно регрессии отличает устойчивое ухудшение качества от шума отдельного запуска
  question: Оценки модели немного колеблются между запусками. Какая политика CI лучше всего реализует логику окна регрессии?
  explanation: Окно регрессии задаёт, какие недавние результаты участвуют в решении и какое ухудшение считается устойчивым. Это снижает риск блокировки из-за случайного шума, не позволяя длительной деградации раствориться в старой истории.
  kind: choice
  options:
    - Блокировать слияние после любого запуска, в котором оценка снизилась
    - Сравнивать результаты за заранее заданное окно с базовой линией и блокировать устойчивое ухудшение сверх допуска
    - Усреднять всю историю запусков без ограничения окна
  correct: 1
  id: 044-eval-architect-1
  fingerprint: f6188ecf
- concept: стратификация eval-датасета обнаруживает регрессии в отдельных типах случаев, скрытые общей оценкой
  question: Редкий, но критичный тип запросов заметно ухудшился, а общий показатель почти не изменился. Какой элемент контракта eval-датасета непосредственно помогает обнаружить такую проблему?
  explanation: Стратификация сохраняет представительство важных типов случаев и позволяет анализировать их отдельно. Поэтому деградация редкого слоя не скрывается за хорошими результатами на массовых запросах.
  kind: choice
  options:
    - Случайное перемешивание примеров без сохранения их категорий
    - Хранение только общего среднего результата
    - Разбиение примеров по типам случаев с контролем состава и результатов каждого слоя
  correct: 2
  id: 044-eval-architect-2
  fingerprint: 9d2c56e9
