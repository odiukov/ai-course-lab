<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Четыре модели на одной шкале</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1b1f24; --muted:#5c6672; --grid:#d8dee6;
    --total:#8a63d2; --active:#e07b39; --same:#2f8f5b;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171c; --fg:#e8ecf1; --muted:#9aa5b1; --grid:#2b323b;
      --total:#b191f0; --active:#f0a05a; --same:#5cc48b;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:1000px;margin:0 auto;padding:8px 10px 12px;}
  h2{font-size:15px;margin:0 0 2px;font-weight:600;}
  p.sub{font-size:12px;color:var(--muted);margin:0 0 4px;}
  svg{width:100%;height:auto;max-height:520px;display:block;background:var(--bg);}
  .fail{font-size:13px;line-height:1.5;color:var(--fg);}
</style>
</head>
<body>
<div class="wrap">
  <h2>Четыре модели на одной шкале</h2>
  <p class="sub">Всего параметров — сколько держать в памяти. Активных на токен — за что платишь.</p>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    // ---- данные схемы ----
    var MODELS = [
      {name:"Llama 3 70B (dense)", total:70,   active:70,  tl:"70B",   al:"70B",  ratio:"1×"},
      {name:"Mixtral 8×22B",       total:141,  active:39,  tl:"141B",  al:"~39B", ratio:"3×"},
      {name:"DeepSeek-V3",         total:671,  active:37,  tl:"671B",  al:"37B",  ratio:"18×"},
      {name:"Kimi K2",             total:1000, active:32,  tl:"1T",    al:"~32B", ratio:"30×"}
    ];
    var TICKS = [0, 250, 500, 750, 1000];

    // ---- один origin, один scale ----
    var ORIGIN = {x:250, y:60};      // px положение точки (0,0) данных
    var SCALE  = {x:0.60, y:78};     // px на 1 млрд параметров; px на 1 строку
    function sx(x){ return ORIGIN.x + x * SCALE.x; }
    function sy(y){ return ORIGIN.y + y * SCALE.y; }

    // ---- холст (литералы: только размеры) ----
    var W = 960, H = 400;
    var PAD = 6, BAR = 13, FS = 12, LW = 1.2;

    var NS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(NS,"svg");
    svg.setAttribute("viewBox","0 0 "+W+" "+H);
    svg.setAttribute("preserveAspectRatio","xMidYMid meet");
    svg.setAttribute("role","img");

    function el(t,a){ var n=document.createElementNS(NS,t);
      for(var k in a) n.setAttribute(k,a[k]); return n; }
    function line(x1,y1,x2,y2,stroke,w,dash){
      var l=el("line",{x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),
        stroke:stroke,"stroke-width":w||LW,"stroke-linecap":"round"});
      if(dash) l.setAttribute("stroke-dasharray",dash);
      svg.appendChild(l); return l;
    }
    function text(x,y,dx,dy,anchor,str,fill,weight,size){
      var t=el("text",{x:sx(x)+dx,y:sy(y)+dy,"text-anchor":anchor,
        "font-size":(size||FS),"font-family":"inherit",fill:fill});
      if(weight) t.setAttribute("font-weight",weight);
      t.textContent=str; svg.appendChild(t); return t;
    }
    function rect(x,y,xw,hpx,fill,dy){
      svg.appendChild(el("rect",{x:sx(x),y:sy(y)+dy,
        width:sx(xw)-sx(0),height:hpx,rx:3,fill:fill}));
    }

    var C={fg:"var(--fg)",mut:"var(--muted)",grid:"var(--grid)",
           tot:"var(--total)",act:"var(--active)",same:"var(--same)"};

    // строки: 0 = шкала сверху, модели на 0.55 .. 3.55
    var ROW = function(i){ return 0.55 + i; };
    var LAST = ROW(MODELS.length-1);

    // ---- ось шкалы ----
    line(0, -0.30, 1000, -0.30, C.grid, LW);
    TICKS.forEach(function(v){
      line(v, -0.30, v, -0.22, C.grid, LW);
      text(v, -0.30, 0, -8, "middle", v===1000?"1T":(v+"B"), C.mut);
      if(v>0) line(v, -0.22, v, LAST+0.42, C.grid, LW, "2 5");
    });
    text(0, -0.30, 0, -26, "start", "млрд параметров", C.mut);

    // ---- строки моделей ----
    MODELS.forEach(function(m,i){
      var y = ROW(i);
      // имя слева
      text(0, y, -PAD*2, -BAR-PAD, "end", m.name, C.fg, "600");
      // полоса total
      rect(0, y, m.total, BAR, C.tot, -BAR-PAD);
      text(m.total, y, PAD*2, -PAD*2, "start", m.tl, C.tot, "600");
      // полоса active
      rect(0, y, m.active, BAR, C.act, PAD);
      text(m.active, y, PAD*2, PAD+BAR-2, "start", m.al, C.act, "600");

      // разрыв между отметками
      var same = (m.total === m.active);
      line(m.active, y, m.active, y, C.same, LW);
      if(!same){
        line(m.active, y, m.total, y, C.grid, LW, "3 4");
        text((m.active+m.total)/2, y, 0, 4, "middle",
             "разрыв "+m.ratio, C.mut, null, FS-1);
      }else{
        text(m.active, y, PAD*4, 4, "start",
             "отметки совпадают", C.same, "600", FS-1);
      }
    });

    // ---- стрелка: память DeepSeek-V3 против Llama ----
    var yA = LAST + 0.42;
    line(0, yA, 671, yA, C.tot, LW);
    var hx = sx(671), hy = sy(yA), hb = sx(671) - (sx(0)+9);
    svg.appendChild(el("polygon",{points:
      hb+","+(hy-4)+" "+hx+","+hy+" "+hb+","+(hy+4), fill:C.tot}));
    text(0, yA, PAD, -PAD, "start",
      "DeepSeek-V3 хранит почти в 10× больше, чем Llama 3 70B…", C.tot);
    text(70, yA, PAD, sy(0.22)-sy(0)+4, "start",
      "…и считает на токен примерно вдвое меньше", C.act);

    // ---- легенда ----
    var yL = yA + 0.42;
    rect(0, yL, 30, BAR-2, C.tot, -BAR+2);
    text(30, yL, PAD*2, -PAD/2, "start", "всего параметров (память)", C.fg);
    rect(330, yL, 360, BAR-2, C.act, -BAR+2);
    text(360, yL, PAD*2, -PAD/2, "start", "активных на токен (счёт за токен)", C.fg);

    host.appendChild(svg);
  }catch(e){
    host.innerHTML = '<p class="fail">Схема должна показывать две отметки у каждой модели: '+
      'Llama 3 70B — 70B всего / 70B активных (совпадают); Mixtral 8×22B — 141B / ~39B (разрыв 3×); '+
      'DeepSeek-V3 — 671B / 37B (18×); Kimi K2 — 1T / ~32B (30×). '+
      'По общему размеру порядок один, по активным — обратный.</p>';
  }
})();
</script>
</body>
</html>
