- concept: балансировочный bias влияет на состав top-k, но не входит в вычисление весов гейта
  question: Эксперты выбраны по сумме scores + bias. Какие значения нужно передать в softmax для вычисления их весов гейта в описанной схеме?
  explanation: Bias применяется только при выборе top-k. После выбора берутся исходные scores выбранных экспертов, и softmax вычисляется по ним. Так bias регулирует загрузку, не сдвигая веса смешивания напрямую.
