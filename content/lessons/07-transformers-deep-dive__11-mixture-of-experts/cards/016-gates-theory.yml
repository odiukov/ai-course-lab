- concept: отношение весов выбранных экспертов равно экспоненте разности их исходных scores
  question: У выбранных экспертов A и B исходные scores равны 9.1 и 7.7. Во сколько раз вес гейта эксперта A больше веса эксперта B?
  explanation: 'При softmax общий знаменатель сокращается: g_A / g_B = exp(9.1 − 7.7) = exp(1.4) ≈ 4.06.'
  kind: numeric
  answer: 4.06
  tolerance: 0.02
  id: 016-gates-theory-1
  fingerprint: 8071b5f8
- concept: невыбранные эксперты не входят в нормировку весов гейта
  question: Исходный score эксперта вне top-k увеличился, но состав top-k не изменился. Что произойдёт с весами гейта выбранных экспертов?
  explanation: Softmax вычисляется только по scores экспертов, вошедших в top-k. Score невыбранного эксперта отсутствует и в числителях, и в знаменателе, поэтому при неизменном top-k веса остаются прежними.
  kind: choice
  options:
    - Все веса уменьшатся из-за роста знаменателя softmax
    - Веса не изменятся
    - Вес выбранного эксперта с минимальным score станет нулевым
    - Веса выбранных экспертов станут одинаковыми
  correct: 1
