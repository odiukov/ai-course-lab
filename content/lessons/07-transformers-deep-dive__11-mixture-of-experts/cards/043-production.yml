  fingerprint: b7d5aff1
- concept: продакшен-движок берёт на себя исполнение маршрутизации и распределение экспертов по устройствам
  question: Почему при обслуживании MoE-модели через vLLM или SGLang обычно не встраивают собственную реализацию top-k-маршрутизации в серверный обработчик запросов?
  explanation: Продакшен-движок согласует маршрутизацию с батчингом, размещением экспертов и обменом активациями между устройствами. Дублирование этой логики в обработчике запросов усложняет систему и лишает её оптимизированного пути исполнения.
  kind: open
  reference: 'Эти движки нативно исполняют MoE: читают конфигурацию модели, выбирают top-k экспертов и распределяют вычисления между устройствами. Собственный код маршрутизации полезен для понимания и диагностики, но обычно не является частью продакшен-контура.'
  id: 043-production-2
  fingerprint: b7f999ba
