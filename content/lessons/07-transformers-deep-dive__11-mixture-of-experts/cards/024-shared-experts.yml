- concept: shared-эксперты обрабатывают каждый токен, а routed-эксперты активируются выборочно
  question: Чем различаются правила активации shared- и routed-экспертов в Mixture of Experts?
  explanation: Shared-эксперты включены для каждого токена без отбора. Routed-эксперты конкурируют за маршрут и активируются только при попадании в top-k.
  kind: choice
  options:
    - Shared-эксперты выбираются роутером, а routed-эксперты обрабатывают каждый токен
    - Shared-эксперты обрабатывают каждый токен, а routed-эксперты выбираются через top-k
    - Оба типа экспертов всегда обрабатывают каждый токен
    - Оба типа экспертов активируются только при переполнении остальных экспертов
  correct: 1
  id: 024-shared-experts-1
  fingerprint: dd2ca658
- concept: выделение shared-экспертов уменьшает дублирование общих знаний между специализированными экспертами
  question: Объясните своими словами, зачем в MoE общие знания выделяют в shared-экспертов, а специализацию оставляют routed-экспертам.
  explanation: В DeepSeek-V3 общий путь представлен одним shared-экспертом, а специализация — top-8 из 256 routed-экспертов. Такое разделение снижает расход ёмкости routed-экспертов на многократное хранение одних и тех же базовых закономерностей.
  kind: open
  reference: Shared-эксперт может один раз выучить закономерности, нужные всем токенам и областям. Тогда routed-экспертам не приходится независимо дублировать эти знания, и большая часть их ёмкости остаётся для специализации.
  id: 024-shared-experts-2
  fingerprint: e610825c
- concept: shared-эксперты не подвержены дисбалансу маршрутизации и отбрасыванию из-за лимита ёмкости
  question: Почему shared-эксперт не становится редко выбираемым и не теряет токены из-за переполнения маршрута?
  explanation: 'Shared-эксперт не участвует в выборе top-k: через него безусловно проходит каждый токен. Поэтому перекос решений роутера и лимит ёмкости routed-маршрутов не могут исключить его из обработки.'
  kind: choice
  options:
    - Его оценка роутера всегда принудительно максимальна
    - Его параметры копируются во все routed-эксперты
    - Он обрабатывает каждый токен вне top-k и не конкурирует за маршруты
    - Для него вспомогательный балансировочный loss всегда равен нулю
  correct: 2
  id: 024-shared-experts-3
  fingerprint: 934b8a78
