- concept: в MoE-блоке заменяется FFN-подслой, а attention и остаточная структура сохраняются
  question: Какое архитектурное изменение превращает плотный блок трансформера в MoE-блок?
  explanation: 'В MoE меняется FFN-ветвь: вместо одного FFN используются роутер и выбранные им эксперты. Attention, нормализация вокруг подслоёв и остаточное прибавление сохраняют прежнюю роль.'
  kind: choice
  options:
    - Attention заменяется набором независимых attention-голов с роутером
    - Единственный FFN заменяется роутером и набором FFN-экспертов
    - Остаточные связи заменяются взвешенной суммой скрытых состояний
    - Нормализация переносится из начала блока в конец
  correct: 1
  id: 005-ffn-swap-1
  fingerprint: 7b5c434a
- concept: MoE-подслой сохраняет интерфейс исходного FFN по входу и размерности выхода
  question: Почему MoE-подслой можно поставить на место обычного FFN, не меняя остальную часть блока трансформера?
  explanation: Эксперты обрабатывают тот же вход norm(h), а их взвешенная сумма совместима по форме с h. Замена меняет внутреннее вычисление FFN-ветви, но не её внешний интерфейс.
  kind: open
  reference: MoE получает то же нормализованное скрытое состояние, а взвешенная смесь выходов экспертов имеет ту же размерность, что и выход исходного FFN. Поэтому результат можно так же прибавить к скрытому состоянию через остаточную связь.
  id: 005-ffn-swap-2
  fingerprint: '12486296'
- concept: выход MoE-подслоя строится через оценки роутера, top-k и взвешенную сумму выходов экспертов
  question: Расположите операции MoE-подслоя в порядке вычисления его выхода для токена.
  explanation: Сначала роутер получает scores, затем top-k определяет активных экспертов. Их выходы взвешиваются функцией gate, суммируются и добавляются к h.
  kind: order
  items:
    - Роутер вычисляет оценки экспертов по нормализованному скрытому состоянию
    - По оценкам выбираются эксперты с наибольшими значениями
    - Выбранные эксперты обрабатывают нормализованное скрытое состояние
    - Выходы выбранных экспертов умножаются на веса гейта и суммируются
    - Полученная смесь прибавляется к скрытому состоянию остаточной связью
  id: 005-ffn-swap-3
  fingerprint: 699d3b42
