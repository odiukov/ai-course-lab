- concept: пропорциональное увеличение top-k сохраняет активные вычисления при дроблении широких экспертов на узкие
  question: Заполни пропуск в правиле перехода к более узким экспертам.
  explanation: Активная ширина равна произведению числа выбранных экспертов на ширину одного эксперта. После замены w на w/m выбор mk узких экспертов даёт (mk)(w/m) = kw, поэтому активные FLOPs не растут.
  kind: cloze
  template: Если ширину каждого эксперта уменьшить в m раз, то для сохранения прежней активной ширины kw нужно выбрать k′ = ___.
  answer: mk
  accept:
    - m*k
    - k*m
    - km
  id: 025-fine-grained-1
  fingerprint: a4cf4ac7
- concept: число возможных команд экспертов определяется биномиальным коэффициентом и быстро растёт с повышением зернистости
  question: Почему множество возможных маршрутов токена становится значительно богаче при большом числе узких экспертов и выборе нескольких из них?
  explanation: Роутер формирует команду из k экспертов среди E доступных, поэтому возможны C(E, k) разных наборов. Увеличение зернистости резко расширяет выбор сочетаний даже при сохранении общего числа параметров и активных FLOPs.
  kind: choice
  options:
    - Число возможных неупорядоченных команд равно C(E, k), поэтому комбинаций может стать очень много
    - Каждый узкий эксперт автоматически выполняет все функции исходного широкого эксперта
    - Роутер начинает последовательно запускать все E экспертов для каждого токена
    - Число возможных команд всегда равно произведению E и k
