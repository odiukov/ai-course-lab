- concept: фиксированный шаг балансировки вызывает колебания вокруг целевой загрузки, амплитуда которых зависит от γ
  question: Почему знаковое обновление bias с постоянным шагом γ обычно не приводит загрузку экспертов в неподвижную точку, и что изменится при уменьшении γ?
  explanation: 'Правило не ослабляет поправку по мере приближения к цели: шаг всегда равен γ. Из-за этого после пересечения цели коррекция меняет направление и может снова перебросить систему через неё. Размер γ задаёт ширину такой орбиты.'
  kind: open
  reference: Когда загрузка пересекает целевое значение, знак следующего обновления меняется, но его модуль остаётся равным γ. Поэтому система перебрасывает загрузку обратно через цель и образует цикл вокруг неё. Меньшее γ обычно уменьшает перелёты и сужает амплитуду колебаний.
  id: 030-thermostat-2
