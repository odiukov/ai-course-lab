- concept: вектор загрузки хранит отдельный счётчик для каждого эксперта, включая ни разу не выбранных
  question: Какое представление результата функции expert_usage лучше всего подходит для последующего анализа загрузки экспертов?
  explanation: Полный список сохраняет соответствие между индексом и экспертом и явно показывает нулевую загрузку. Словарь без нулей скрывает неиспользуемых экспертов, а сортировка уничтожает привязку значений к их идентификаторам.
  kind: choice
  options:
    - Словарь только с идентификаторами выбранных экспертов
    - Отсортированный по убыванию список ненулевых загрузок
    - Список длиной num_experts, где индекс задаёт эксперта, а значение — число его выборов
  correct: 2
  id: 029-code-expert-usage-1
  fingerprint: 2c3c7ef5
- concept: загрузка эксперта измеряется числом назначенных ему токенов, а не суммой весов гейта
  question: Объясни, почему при подсчёте загрузки MoE-экспертов нужно считать попадания их идентификаторов в маршруты, не умножая их на веса гейта.
  explanation: Для контроля баланса важен объём работы каждого эксперта. Если эксперт выбран, его FFN выполняется независимо от величины веса гейта; сумма весов описывает влияние на выход модели, а не число обработанных токенов.
  kind: open
  reference: Вычислительная загрузка определяется тем, сколько токенов было направлено в эксперт и потребовало запуска его FFN. Вес гейта задаёт вклад уже вычисленного выхода в смесь, поэтому даже маленький вес не отменяет самого вычисления.
  id: 029-code-expert-usage-2
  fingerprint: 05ab5a1c
