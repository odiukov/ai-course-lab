- concept: порядок обхода маршрутов не меняет сумму, если веса остаются сопоставлены своим экспертам
  question: Изменится ли результат MoE для токена, если переставить выбранных экспертов и тем же образом переставить соответствующие им веса гейта? Объясни почему.
  explanation: Сложение вкладов коммутативно, но вес относится к конкретному выходу эксперта. Поэтому порядок обхода произволен, а соответствие между индексом эксперта и весом нарушать нельзя.
  kind: open
  reference: 'Нет. Результат является суммой взвешенных выходов, поэтому порядок слагаемых не важен. Важно переставлять пары «эксперт — его вес» вместе: если веса сопоставить другим экспертам, результат обычно изменится.'
