- concept: MoE выгодна при достаточной памяти, expert parallelism и большой токенной нагрузке
  question: Для какого сценария MoE-модель подходит лучше всего?
  explanation: MoE особенно выгодна на сервере, где все веса помещаются в память, эксперты распределены между устройствами, а большой поток токенов позволяет окупить маршрутизацию. Ограниченная память, тонкий батч и преобладание стоимости attention ослабляют или устраняют это преимущество.
  kind: choice
  options:
    - Локальный офлайн-инференс на ноутбуке с ограниченной памятью
    - Обработка одиночных запросов с жёстким ограничением на задержку
    - Батчевая генерация кода на серверном кластере с большим объёмом VRAM и поддержкой expert parallelism
    - Анализ очень длинных документов, где основную часть вычислений занимает attention
  correct: 2
  id: 042-when-pick-1
  fingerprint: 11b1b749
- concept: MoE слабее экономит вычисления на контекстно-тяжёлых задачах, потому что не разреживает attention
  question: Почему разреженная MoE-модель может дать небольшую экономию при обработке очень длинных документов, хотя для каждого токена запускается лишь часть экспертов?
  explanation: Выбор экспертов разреживает FFN, а attention остаётся плотным. Поэтому MoE лучше окупается на генерации большого числа токенов, например в чате или коде, чем на задачах, где стоимость определяется прежде всего длинным контекстом.
  kind: open
  reference: MoE сокращает вычисления в FFN-подслоях, но не меняет attention. С ростом длины контекста именно attention может стать основной статьёй затрат, поэтому экономия на экспертах составляет лишь небольшую долю полной стоимости.
  id: 042-when-pick-2
  fingerprint: df9c6f3d
- concept: при малом активном бюджете параметров MoE обычно не даёт ожидаемого преимущества по качеству
  question: Команда проектирует компактную модель с активным бюджетом параметров заметно ниже масштаба, на котором проявляются преимущества специализации экспертов. Какой выбор наиболее обоснован?
  explanation: 'У очень маленьких моделей MoE обычно ещё не получает преимущества по качеству: активной вычислительной ёмкости недостаточно, чтобы специализация экспертов окупила сложность маршрутизации и хранения. В материале этот порог оценивается примерно в несколько миллиардов активных параметров.'
  kind: choice
  options:
    - Обязательно использовать MoE, потому что разреженность улучшает качество при любом размере модели
    - Максимально увеличить число экспертов, не учитывая память и маршрутизацию
    - Предпочесть плотную модель, если эксперименты не показывают измеримого выигрыша MoE
    - Выбирать архитектуру исключительно по общему числу параметров
  correct: 2
  id: 042-when-pick-3
