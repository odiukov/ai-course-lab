- concept: независимость экспертов позволяет пропускать вычисление невыбранных FFN
  question: Объясни своими словами, почему для обработки токена не требуется вычислять невыбранные эксперты MoE.
  explanation: Эксперты являются независимыми FFN, а не последовательными стадиями одного вычисления. Невыбранный эксперт не производит данные, необходимые выбранному, поэтому его прямой проход можно безопасно пропустить.
  kind: open
  reference: У каждого эксперта собственные веса, а его выход не зависит от промежуточных результатов других экспертов. Поэтому выход выбранных экспертов можно вычислить напрямую, не запуская остальные.
