- concept: увеличение E при фиксированном k повышает ёмкость MoE без роста вычислений FFN на токен
  question: В MoE-слое увеличили общее число экспертов E, сохранив прежними число активных экспертов k и размер каждого эксперта. Что произойдёт в рамках оценки вычислений FFN?
  explanation: Всего в экспертах хранится E × FFN_size параметров, а для одного токена активно k × FFN_size. Поэтому рост E при фиксированном k требует больше памяти, но не увеличивает вычисления экспертов на токен.
  kind: choice
  options:
    - Объём хранимых параметров увеличится, а число активных параметров на токен останется прежним
    - Объём хранимых параметров останется прежним, а число активных параметров на токен увеличится
    - Объём хранимых и активных параметров на токен увеличится одинаково
    - Объём хранимых и активных параметров на токен останется прежним
