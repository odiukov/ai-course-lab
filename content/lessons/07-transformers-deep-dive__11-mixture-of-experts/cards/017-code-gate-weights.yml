- concept: выбранные для каждого токена оценки извлекаются построчно операцией gather
  question: Даны `scores` формы `(tokens, experts)` и `expert_indices` формы `(tokens, selected)`. Какая операция PyTorch корректно извлечёт для каждого токена оценки назначенных именно ему экспертов?
  explanation: '`gather` сопоставляет каждой строке `scores` соответствующую строку индексов. Результат имеет ту же форму, что и `expert_indices`: для каждого токена остаются только оценки назначенных ему экспертов.'
  kind: choice
  options:
    - '`scores[expert_indices]`'
    - '`scores.index_select(-1, expert_indices)`'
    - '`torch.gather(scores, dim=-1, index=expert_indices)`'
  correct: 2
