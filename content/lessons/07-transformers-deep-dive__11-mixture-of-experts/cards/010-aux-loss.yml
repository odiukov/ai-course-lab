- concept: вспомогательный loss создаёт для роутера отдельный градиентный сигнал, направленный на выравнивание загрузки экспертов
  question: В MoE-модель добавили дифференцируемый штраф за неравномерную загрузку экспертов. Как это непосредственно влияет на обучение роутера?
  explanation: Штраф входит в общую функцию потерь, поэтому его градиент доходит до параметров роутера. Этот сигнал действует вместе с градиентом основной задачи и подталкивает роутер распределять токены равномернее.
  kind: choice
  options:
    - Роутер получает дополнительный градиентный сигнал, уменьшающий предпочтение перегруженных экспертов
    - У каждого эксперта автоматически увеличивается допустимая ёмкость
    - Выбор top-k заменяется равномерным случайным выбором
    - Токены, назначенные перегруженным экспертам, исключаются из батча
  correct: 0
  id: 010-aux-loss-1
  fingerprint: 99e660f5
- concept: общий loss при вспомогательной балансировке является взвешенной суммой основного и балансировочного loss
  question: Для батча основной loss равен 0.72, балансировочный loss — 0.16, а его коэффициент — 0.25. Чему равен общий loss?
  explanation: 'Общий loss вычисляется как L_task + λ·L_balance: 0.72 + 0.25·0.16 = 0.76.'
  kind: numeric
  answer: 0.76
  tolerance: 0.001
  id: 010-aux-loss-2
  fingerprint: 782d87ec
- concept: коэффициент вспомогательного loss задаёт компромисс между равномерностью загрузки и качеством маршрутизации для основной задачи
  question: Почему коэффициент при вспомогательном loss за дисбаланс нельзя бездумно сделать очень большим?
  explanation: Малый вес штрафа может не устранить перекос, а чрезмерный — подчинить маршрутизацию равномерности в ущерб основной задаче. Это и делает коэффициент дополнительным гиперпараметром.
  kind: open
  reference: Слишком большой коэффициент заставит роутер прежде всего выравнивать загрузку экспертов, даже когда для основной задачи полезнее направлять разные токены к наиболее подходящим экспертам. Поэтому коэффициент приходится подбирать как компромисс между балансом и качеством предсказаний.
  id: 010-aux-loss-3
  fingerprint: 67c16ccc
