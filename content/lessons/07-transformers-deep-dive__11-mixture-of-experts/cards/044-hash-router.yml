- concept: хеш-роутинг по идентификатору токена не учитывает контекстное представление и не различает значения многозначного токена
  question: Объясните, почему роутер вида hash(token_id) % E не может направлять один и тот же многозначный токен к разным экспертам в зависимости от контекста.
  explanation: Хеш фиксирует маршрут для каждого token_id заранее. Поэтому разные употребления одного токена получают одинаковое назначение, даже если их контекстные векторы и смысл различаются.
  kind: open
  reference: Результат такого роутера зависит только от идентификатора токена и числа экспертов. Контекстное представление токена в вычислении маршрута не участвует, поэтому во всех контекстах получается один и тот же эксперт. Роутер по скрытому вектору, напротив, может учитывать значение токена в конкретной последовательности.
  id: 044-hash-router-2
  fingerprint: 5dfd8e82
