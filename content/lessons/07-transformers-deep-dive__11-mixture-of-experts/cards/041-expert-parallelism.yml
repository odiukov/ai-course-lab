- concept: expert parallelism распределяет экспертов по устройствам и требует пересылки активаций к выбранным экспертам
  question: 'MoE-модель развёрнута с expert parallelism: разные GPU хранят разные эксперты. Что должно произойти после того, как роутер выбрал эксперта для токена?'
  explanation: При expert parallelism перемещают не веса экспертов, а активации токенов. После вычисления результаты возвращаются на устройство, где формируется итоговая смесь.
  kind: choice
  options:
    - Активацию токена отправляют на GPU с выбранным экспертом, а результат возвращают для объединения
    - Веса выбранного эксперта копируют на GPU роутера перед каждым вычислением
    - Токен обрабатывают только локальные эксперты, игнорируя решение роутера
  correct: 0
  id: 041-expert-parallelism-1
  fingerprint: 19f15c70
- concept: при коммуникационно-ограниченном MoE ускорение matmul слабо сокращает полную задержку
  question: Объясни своими словами, почему более быстрые матричные умножения могут почти не уменьшить latency MoE-модели с expert parallelism.
  explanation: Latency определяется суммой вычислений и коммуникации. Когда пересылка токенов к экспертам и возврат результатов заметно дольше самого matmul, производительность сети становится главным ограничением.
  kind: open
  reference: Если основную часть времени занимают all-to-all-пересылки активаций между GPU и ожидание их завершения, ускоряется лишь небольшая вычислительная часть критического пути. Поэтому полная задержка почти не меняется без ускорения сети или сокращения коммуникации.
  id: 041-expert-parallelism-2
  fingerprint: 13f95a10
