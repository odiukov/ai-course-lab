- concept: bias перегруженного эксперта уменьшают, а недогруженного увеличивают
  question: В auxiliary-loss-free балансировке эксперт стабильно получает больше целевой доли токенов. Как следует изменить его routing bias?
  explanation: У перегруженного эксперта bias уменьшают, поэтому в дальнейшем его выбирают реже. У недогруженного эксперта bias, наоборот, повышают. Направление обновления определяется отклонением фактической загрузки от целевой.
  kind: choice
  options:
    - Уменьшить bias явным шагом после измерения загрузки
    - Увеличить bias, чтобы усилить специализацию эксперта
    - Обновить bias градиентом основного loss
    - Не менять bias, а отбросить лишние токены
  correct: 0
  id: 013-bias-trick-1
  fingerprint: 01934ce6
- concept: балансировочный bias обновляется вне loss и не создаёт дополнительного градиентного сигнала
  question: Почему метод с routing bias называют auxiliary-loss-free, хотя значения bias меняются во время обучения?
  explanation: Слово auxiliary-loss-free означает отсутствие вспомогательного слагаемого в функции потерь. Bias всё же адаптируется, но его обновляют вне backpropagation, сравнивая загрузку каждого эксперта с целью.
  kind: open
  reference: Bias изменяется отдельным явным правилом на основе измеренной загрузки экспертов, а не градиентным спуском по добавочному слагаемому loss. Поэтому функция потерь основной задачи не получает балансировочного штрафа и роутер не испытывает второго градиентного сигнала.
  id: 013-bias-trick-2
  fingerprint: 6ef15029
