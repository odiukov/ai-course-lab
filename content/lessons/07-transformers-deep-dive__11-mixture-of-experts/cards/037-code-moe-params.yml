  fingerprint: d6e113eb
- concept: shared-эксперты и всегда активный роутер делают долю активных параметров отличной от простой доли выбранных routed-экспертов
  question: Пусть каждый эксперт содержит `p` параметров, в MoE есть `e` routed-экспертов, из которых выбираются `k`, а также `s` shared-экспертов и роутер из `r` параметров. Если `e > k` и вклад shared-экспертов или роутера ненулевой, как отношение active к total соотносится с `k / e`?
  explanation: При включённом роутере отношение равно `((k + s)p + r) / ((e + s)p + r)`. Разность с `k / e` имеет положительный числитель `(e - k)(sp + r)`, поэтому shared-эксперты и роутер повышают активную долю относительно `k / e`.
  kind: choice
  options:
    - Оно строго больше `k / e`
    - Оно равно `k / e`
    - Оно строго меньше `k / e`
    - Соотношение невозможно определить
