- concept: доля активируемых на токен параметров вычисляется как отношение активных параметров к общему числу параметров
  question: У MoE-модели 960 млрд параметров, из которых для одного токена активируются 120 млрд. Какой процент параметров активируется на токен?
  explanation: 'Нужно разделить активное число параметров на общее: 120 / 960 × 100% = 12.5%. Аналогично у DeepSeek-V3 активируются 37B из 671B, то есть около 5.5% весов.'
  kind: numeric
  answer: 12.5
  tolerance: 0.1
  id: 034-cost-profile-1
  fingerprint: 24d6f1bc
- concept: качество на бенчмарках не определяется одним лишь числом активных параметров на токен
  question: Разреженная модель имеет 540 млрд параметров всего и активирует 26 млрд на токен. Плотная модель активирует все свои 62 млрд параметров. Разреженная модель показывает более высокое качество на бенчмарках. Как это интерпретировать?
  explanation: MoE позволяет разделить общую ёмкость и вычисления на токен. Поэтому DeepSeek-V3 с 671B параметров всего и 37B активных может превосходить плотную Llama 3 70B, хотя активных вычислений у него меньше.
  kind: choice
  options:
    - 'Такой результат невозможен: модель с меньшим числом активных параметров всегда должна быть хуже'
    - Большой общий пул параметров может повышать ёмкость модели, даже если для каждого токена используется лишь его часть
    - Разреженная модель на самом деле вычисляет все свои параметры, иначе сравнение было бы некорректным
    - Общее число параметров никак не связано с возможностями модели
  correct: 1
