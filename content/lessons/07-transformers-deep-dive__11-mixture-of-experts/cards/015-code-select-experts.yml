- concept: результатом выбора маршрутов служат индексы экспертов, а не значения оценок
  question: Почему функция выбора экспертов должна возвращать индексы из результата top-k, а не найденные значения?
  explanation: Следующий этап использует номера выбранных экспертов для диспетчеризации токенов. Оценки top-k не заменяют эти номера.
  kind: open
  reference: Индексы однозначно указывают, какие модули экспертов нужно запустить для каждого токена. Значения отражают лишь оценки, использованные для ранжирования, и сами по себе не идентифицируют вызываемые эксперты.
