  fingerprint: 99ba8c16
- concept: тензор выбранных экспертов имеет форму (N, k) и содержит N × k индексов
  question: В батче 9 токенов, и для каждого токена выбираются 3 эксперта. Сколько элементов содержит выходной тензор индексов?
  explanation: Форма результата равна (9, 3), поэтому число индексов равно 9 × 3 = 27.
  kind: numeric
  answer: 27
