- concept: неравномерный роутинг может усиливаться через положительную обратную связь
  question: Почему небольшое начальное преимущество одного эксперта в MoE может со временем привести к коллапсу роутинга?
  explanation: Роутер без механизма балансировки выбирает экспертов только по их оценкам. Небольшое преимущество даёт эксперту больше обучающих примеров, усиливает преимущество и замыкает положительную обратную связь.
  kind: choice
  options:
    - Эксперт получает больше токенов, лучше обучается на них и становится ещё привлекательнее для роутера
    - Роутер автоматически увеличивает размер самого популярного эксперта
    - Остальные эксперты перестают участвовать в вычислениях из-за механизма attention
    - Оптимизатор намеренно замораживает экспертов с низкой загрузкой
  correct: 0
  id: 009-imbalance-1
  fingerprint: '11956598'
- concept: редко выбираемый эксперт получает мало градиентного сигнала и почти не обучается
  question: Что происходит с параметрами эксперта, которого роутер почти никогда не выбирает?
  explanation: Градиент основной задачи проходит через вычисления выбранных экспертов. Если эксперт получает лишь малую долю токенов, его веса почти не обновляются, хотя продолжают занимать память.
  kind: choice
  options:
    - Они получают мало градиентных обновлений, потому что через эксперта проходит мало токенов
    - Они обучаются с той же скоростью через градиенты других экспертов
    - Они автоматически копируют параметры самого загруженного эксперта
    - Они обновляются только градиентами из attention-подслоя
  correct: 0
