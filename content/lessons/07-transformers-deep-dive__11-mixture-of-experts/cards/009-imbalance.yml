- concept: снижение основного loss не исключает коллапс экспертов, поэтому загрузку нужно измерять отдельно
  question: Почему падающий loss сам по себе не доказывает, что эксперты MoE используются равномерно, и какую величину нужно дополнительно отслеживать?
  explanation: Даже при перекосе вида «90% токенов у одного эксперта» модель способна улучшать предсказания, поэтому кривая loss может выглядеть нормально. Коллапс обнаруживается по статистике загрузки каждого эксперта.
  kind: open
  reference: Модель может снижать loss, опираясь преимущественно на небольшую часть экспертов. Поэтому нужно отдельно считать распределение направленных токенов по экспертам, например число или долю токенов у каждого эксперта за шаг.
  id: 009-imbalance-3
  fingerprint: 13dba6ac
