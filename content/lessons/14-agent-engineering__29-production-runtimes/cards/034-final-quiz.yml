- concept: повторная доставка из очереди перезапускает задачу целиком, потому что очередь не хранит внутренний прогресс обработчика
  question: Задача из очереди упала на предпоследнем из длинной цепочки шагов, и очередь доставила её воркеру повторно. С чего начнётся обработка и почему?
  explanation: Очередь даёт повтор задачи, а не возобновление прогона. Если пройденные шаги дорогие или содержат внешние эффекты, к очереди добавляют чекпоинтинг и идемпотентность по ключу операции.
  kind: choice
  options:
    - 'С самого начала: очередь хранит только сообщение задачи, а не прогресс внутри обработчика — сохранение пройденных шагов даёт durable execution'
    - 'С предпоследнего шага: очередь автоматически запоминает позицию выполнения'
    - С последнего шага, потому что счётчик попыток хранит номер завершённого шага
    - 'Обработка не начнётся: после сбоя очередь всегда отправляет задачу сразу в DLQ'
