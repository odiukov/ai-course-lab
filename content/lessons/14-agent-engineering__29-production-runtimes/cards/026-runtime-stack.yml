- concept: 'выбор стека — производное решение: сначала фиксируются свойства запуска и ожидания, из них форма рантайма, и только потом инструмент'
  question: Расставь решения при выводе агента в продакшен в правильном порядке.
  explanation: 'Каталог фреймворков — полка с инструментами, а не рейтинг: каждый пункт закрывает одну форму. Пока форма не выбрана, сравнение фреймворков между собой бессмысленно, и наоборот — после выбора формы витрина сужается почти автоматически.'
  kind: order
  items:
    - Зафиксировать, кто запускает работу, сколько она длится, ждёт ли пользователь результат и нужно ли продолжение после сбоя
    - Выбрать форму рантайма, отвечающую этим свойствам
    - Выбрать стек или хостинг, который поддерживает выбранную форму
    - Настроить набор сигналов наблюдаемости, обязательных для этой формы
