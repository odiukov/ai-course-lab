- concept: наблюдаемость request-response строится на HTTP-логах доступа плюс спанах OTel
  question: Что достаточно собирать для наблюдаемости синхронного HTTP-агента?
  explanation: У request-response нет очереди и нет чанков. Видно ровно то, что даёт HTTP-лог доступа (когда пришёл запрос, сколько длился, какой код вернул) плюс спаны OTel по шагам агента.
  kind: choice
  options:
    - Глубину очереди и размер dead-letter queue
    - Обычные HTTP-логи доступа плюс GenAI-спаны OpenTelemetry
    - Задержку до первого токена и хвостовую задержку чанков
  correct: 1
  id: 005-request-response-2
  fingerprint: 67a3e30d
- concept: пригодность request-response оценивают по худшему реалистичному прогону, а не по среднему времени
  question: Агент отвечает в среднем за 6 секунд, но на крупных входных данных — за 52 секунды. Почему форма request-response здесь считается ненадёжной?
  explanation: Среднее время скрывает хвост распределения. Оценивать надо неудачный, но реалистичный случай — именно он определяет, доживёт ли задача до конца HTTP-соединения.
  kind: open
  reference: Потому что соединение обрывается по факту конкретного медленного запроса, а не по среднему. Ориентир пригодности request-response — около 30 секунд; прогоны на 52 секунды выйдут за таймаут посредников, и часть пользователей получит ошибку, не узнав, доделалась работа или нет. Такую задачу переносят в очередь или durable-форму.
  id: 005-request-response-3
  fingerprint: 8cb235ea
