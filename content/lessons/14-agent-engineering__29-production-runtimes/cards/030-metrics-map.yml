- concept: рантайм по расписанию контролируется по пропущенным, последнему и следующему запускам
  question: Задачи по расписанию идут «зелёными», но два ночных окна прошли вообще без запуска. Какой сигнал ловит такую ситуацию?
  explanation: Метрики успешных прогонов молчат про запуски, которых не было. Форма по расписанию обещает срабатывание в назначенный момент, поэтому и контролируется наличием срабатываний, а не только качеством состоявшихся.
  kind: choice
  options:
    - Учёт пропущенных срабатываний вместе с временем последнего и ожидаемого следующего запуска
    - Доля ошибок в HTTP-ответах сервиса
    - Средняя длительность прогона агента
    - Число открытых потоковых соединений
  correct: 0
  id: 030-metrics-map-2
  fingerprint: 549d4aa8
- concept: набор обязательных сигналов выводится из обещания выбранной формы рантайма, а не из общего состояния инфраструктуры
  question: Инфраструктурный дашборд полностью зелёный, а пользователь давно не получил результат. Объясни, почему набор контрольных сигналов приходится выводить из формы рантайма.
  explanation: Сигнал полезен ровно тогда, когда его падение означает нарушенное обещание формы. Плюс для многошаговых агентов поверх этого нужны GenAI-спаны, собранные бэкендом в трейс, — иначе сбой посреди длинного прогона снова превращается в повод переигрывать всю работу.
  kind: open
  reference: 'Общие сигналы («процесс жив», «процессор не перегружен», «ошибок мало») проверяют работоспособность машины, а не обещание, которое даёт форма выполнения. Каждая форма обещает своё: короткий синхронный ответ — задержку и её перцентили, потоковая — постепенную выдачу, устойчивая — продолжение с сохранённой позиции, фоновая — что принятая задача будет обработана, событийная — быстрый старт после события, по расписанию — что запуск состоится в срок. Нарушение любого из этих обещаний может произойти при полностью здоровой инфраструктуре, поэтому метрики выбираются под форму.'
  id: 030-metrics-map-3
  fingerprint: b185d197
