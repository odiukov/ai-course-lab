- concept: потоковая выдача меняет момент первой обратной связи, но не сокращает время вычисления на сервере
  question: Эндпоинт генерирует полный ответ за 12 секунд. Команда включает потоковую выдачу, и первый фрагмент приходит клиенту через 400 мс. Что изменилось на стороне сервера?
  explanation: Стриминг влияет на порядок доставки, а не на объём работы. Полная генерация занимает те же 12 секунд, просто пользователь видит первые токены через 400 мс и не смотрит в пустой экран.
  kind: choice
  options:
    - 'Вычисление стало короче: сервер теперь занят меньше времени'
    - Сервер по-прежнему занят те же 12 секунд, раньше приходит только первая часть результата
    - Запрос ушёл в фоновую обработку, и открытое соединение больше не нужно
  correct: 1
  id: 007-streaming-1
  fingerprint: b1a2014a
- concept: SSE даёт односторонний поток от сервера к клиенту, WebSocket — двусторонний канал
  question: Чем SSE отличается от WebSocket как транспорт для постепенной выдачи ответа?
  explanation: SSE — однонаправленная лента событий сервер→клиент. WebSocket — полнодуплексный канал. Оба держат соединение открытым, и ни один сам по себе не сохраняет результат после разрыва.
  kind: choice
  options:
    - SSE передаёт данные только от сервера к клиенту, WebSocket поддерживает обмен в обе стороны
    - SSE держит соединение открытым, а WebSocket работает отдельными короткими запросами
    - SSE гарантирует доставку результата после разрыва соединения, WebSocket — нет
  correct: 0
