- concept: потоковый ответ живёт внутри открытого соединения, поэтому не заменяет фоновую задачу с собственным идентификатором
  question: Пользователь закрывает вкладку через пару секунд после старта потокового ответа. Объясни своими словами, почему стриминг сам по себе не даёт того же, что фоновая задача.
  explanation: Стриминг решает проблему тишины во время ожидания, но не проблему выживания работы. Для второго нужна форма рантайма, где выполнение отвязано от соединения.
  kind: open
  reference: 'Стриминг привязан к живому соединению: разрыв уничтожает канал, а вместе с ним и способ вернуть результат. Выполнение не отделено от запроса, поэтому сервер может прервать работу или сохранить результат некуда. Фоновая задача выполняется независимо от клиента, получает идентификатор и хранит результат, за которым можно вернуться позже.'
