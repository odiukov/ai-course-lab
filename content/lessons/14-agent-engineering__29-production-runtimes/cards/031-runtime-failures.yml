- concept: 'ошибки рантайма усиливают друг друга: неверная форма порождает таймауты и повторы, а отсутствие DLQ и телеметрии скрывает их последствия'
  question: Объясни своими словами, почему неверно выбранная форма рантайма и отсутствие dead-letter queue образуют цепь, а не две независимые проблемы.
  explanation: 'Ключ — направление причинности: форма рантайма порождает отказы, а DLQ и наблюдаемость определяют, узнаете ли вы о них. Поэтому чинить нужно с формы; DLQ и трейсы добавляют видимость, но сами по себе таймауты не убирают.'
  kind: open
  reference: 'Неверная форма (долгая задача внутри синхронного запроса) даёт таймауты: клиент обрывает соединение, судьба задачи неизвестна, и запрос повторяется. Повторы наслаиваются и множат нагрузку — воркеры копятся. Каждый из этих прогонов может упасть, и вот здесь включается вторая ошибка: без DLQ упавшие задачи не сохраняются нигде, поэтому не видно ни их числа, ни причин. Первая ошибка производит отказы, вторая делает их невидимыми, а отсутствие durable state умножает потерянную работу, поскольку каждый повтор начинается с нуля. Отчёт выглядит чистым не потому, что система здорова, а потому, что следы потерь некуда записывать.'
  id: 031-runtime-failures-3
  fingerprint: b67931fc
