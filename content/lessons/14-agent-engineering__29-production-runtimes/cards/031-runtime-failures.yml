- concept: без DLQ доля отказов превращается в скрытую ежедневную потерю задач, размер которой считается как объём × доля отказов
  question: Очередь принимает 2500 задач в сутки, обработчик стабильно падает на 8% из них, dead-letter queue не настроена. Сколько задач за сутки исчезнет без следа?
  explanation: 'Задачи, исчерпавшие попытки, при отсутствии DLQ никуда не записываются: 2500 × 0.08 = 200 задач в день пропадают молча. В уроке та же арифметика на 1000 задачах и 10% отказов даёт 100 потерянных. DLQ не чинит отказы, но делает их объём измеримым и позволяет вернуть задачи в обработку после починки обработчика.'
  kind: numeric
  answer: 200
  tolerance: 1
  id: 031-runtime-failures-1
  fingerprint: c23751b6
- concept: фоновая работа без экспорта трейсов делает пользователя первым каналом обнаружения сбоя, что задаёт задержку реакции команды
  question: Фоновый агент выполняет прогоны без экспорта трейсов и метрик. Какое эксплуатационное последствие это даёт в первую очередь?
  explanation: Непрозрачность не создаёт сбоев — она убирает канал их обнаружения. Пока рантайм не отдаёт сигналы наружу, единственный детектор отказов — пользователь, и задержка реакции равна времени до его обращения. Потеря прогресса при перезапуске — отдельная ошибка (нет durable state), исчезновение упавших задач — третья (нет DLQ).
  kind: choice
  options:
    - Прогоны замедляются, потому что экспорт телеметрии не нагружает процесс
    - О сбое команда узнаёт только из жалобы пользователя, то есть с задержкой во весь цикл обращения
    - Задачи перестают попадать в dead-letter queue
    - Прогресс прогона теряется при перезапуске процесса
  correct: 1
