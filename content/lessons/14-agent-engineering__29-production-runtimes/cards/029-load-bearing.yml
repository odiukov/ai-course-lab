- concept: трейс покрывает один прогон целиком, спан описывает одно действие внутри него
  question: Как соотносятся трейс и спан в телеметрии агентного прогона?
  explanation: GenAI-спаны OpenTelemetry описывают отдельные действия — время старта, длительность, исход, связь с соседями. Собранные вместе, они образуют трейс одного прогона, который можно открыть в Langfuse, Phoenix или Opik.
  kind: choice
  options:
    - 'Трейс — запись одного прогона целиком, спан внутри него — отдельное действие: вызов модели, обращение к инструменту'
    - Спан — запись прогона целиком, трейс — агрегат по всем прогонам за сутки
    - Трейс — это лог ошибок, а спан — сообщение об успешном завершении
    - 'Это синонимы: разные бэкенды называют одну и ту же запись по-разному'
  correct: 0
  id: 029-load-bearing-1
  fingerprint: da24939e
- concept: сбой многошагового прогона локализуется по границе между последним успешным спаном и первым упавшим
  question: Многошаговый агент упал в середине длинного прогона. Расставь шаги разбора по трейсу в правильном порядке.
  explanation: Разбор сводится к одной границе между двумя соседними спанами, а не к чтению всего прогона. Без трейсов единственная альтернатива — перезапуск всей работы с дописанными логами.
  kind: order
  items:
    - Открыть трейс нужного прогона в бэкенде
    - Найти последний спан, завершившийся успехом
    - Открыть следующий за ним спан, где появилась ошибка
    - 'Сравнить вход и выход на этой границе: какой запрос ушёл и что вернулось'
  id: 029-load-bearing-2
  fingerprint: 5ca10532
- concept: перезапуск как способ диагностики плох тем, что стоит полного прогона и не гарантирует воспроизведения причины
  question: Почему «прогоним ещё раз с дополнительными логами» — плохая стратегия отладки дорогого многошагового агента?
  explanation: 'Именно поэтому наблюдаемость называют несущей: разница между «отлаживаем быстро по сохранённому следу» и «переигрываем всё с нуля, надеясь, что повторится». Телеметрия пишется сама во время первого же прогона.'
  kind: choice
  options:
    - Перезапуск заново тратит время и деньги всего прогона и при этом может не воспроизвести сбой, потому что ответы модели и внешние сервисы недетерминированы
    - Перезапуск запрещён, поскольку повреждает сохранённые чекпоинты
    - Дополнительные логи всегда меняют поведение агента и делают результат недействительным
    - Перезапуск даёт слишком много данных, а бэкенды наблюдаемости их не принимают
  correct: 0
