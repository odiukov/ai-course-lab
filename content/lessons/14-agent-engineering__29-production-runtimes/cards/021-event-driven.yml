- concept: в event-driven рантайме прогон создаётся по подписке на внешнее изменение, а не опросом источника самим агентом
  question: Агент должен реагировать на появление нового файла в общей папке. Что отличает event-driven рантайм от агента, который сам раз в минуту проверяет папку?
  explanation: Опрос тратит вызовы даже когда ничего не меняется и всё равно даёт задержку до размера интервала опроса. В событийной форме факт изменения приходит извне, и на каждое уведомление рантайм создаёт свой прогон. Скорость самой работы агента при этом не меняется.
  kind: choice
  options:
    - Event-driven агент работает быстрее внутри одного прогона
    - Источник сам уведомляет рантайм об изменении, и рантайм создаёт отдельный прогон под это уведомление
    - Event-driven агент постоянно держит открытое соединение с пользователем
    - Event-driven агент не нуждается в наблюдаемости, потому что запусков мало
  correct: 1
  id: 021-event-driven-1
  fingerprint: ff90c136
- concept: событие несёт контекст «что и когда изменилось», а работу выполняет запущенный им прогон
  question: Система прислала уведомление о новом счёте в папке поставщиков. Что разумно положить в само событие?
  explanation: 'Событие отвечает на вопрос «почему началась работа»: оно указывает объект, вид изменения и время. Результат обработки — задача прогона, а не события. Пустое уведомление без идентификатора заставляет агента угадывать объект; тащить в событие всю сопутствующую базу тоже не нужно — агент дотянется по идентификатору.'
  kind: choice
  options:
    - Готовую бухгалтерскую проводку по счёту
    - Идентификатор файла, тип изменения и момент, когда оно произошло
    - Полный текст всех договоров поставщика, чтобы агент ничего не запрашивал
    - Только строку «что-то изменилось» без указания объекта
  correct: 1
  id: 021-event-driven-2
  fingerprint: 6588488b
- concept: запись источника триггера позволяет отличить прогоны, начатые по разным причинам
  question: 'Один и тот же агент подписан на несколько триггеров: новое письмо, открытый pull request, срабатывание расписания. Зачем в трассировке каждого прогона хранить источник триггера?'
  explanation: Источник триггера — измерение, по которому режутся все остальные метрики прогона. Без него отладка сводится к перебору прогонов вручную, а отключить сломанный вход можно только вместе со всем агентом.
  kind: open
  reference: 'Без источника все прогоны сливаются в одну массу, и по метрикам нельзя понять, какой класс запусков сломан или дорог. Источник даёт разрез: сравнить успешность и стоимость прогонов по письмам против прогонов по pull request, найти триггер, который порождает лавину дублей, отделить плановые запуски по расписанию от реактивных, а при инциденте — быстро отключить или починить один конкретный источник, не глуша агента целиком. Он же связывает прогон с исходным объектом для разбора и повторного запуска.'
  id: 021-event-driven-3
  fingerprint: 7a1031f3
