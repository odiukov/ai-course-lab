- concept: идентификатор события помечается обработанным только после успешного завершения эффекта
  question: Расставь шаги функции однократного применения эффекта по идентификатору события в правильном порядке.
  explanation: 'Порядок «сначала эффект, потом отметка» защищает от потери работы: если эффект упал, идентификатор остаётся непомеченным и следующая доставка сделает ещё попытку. Отметка заранее означала бы, что действие никогда не выполнится.'
  kind: order
  items:
    - Проверить, есть ли идентификатор события среди уже обработанных
    - Если есть — вернуть признак пропуска, не вызывая эффект
    - Если нет — вызвать эффект
    - После успешного возврата эффекта добавить идентификатор в набор обработанных
    - Вернуть признак того, что эффект был выполнен
  id: 018-apply-once-1
  fingerprint: 02b729ab
- concept: возврат «эффект не выполнялся» — это признак распознанного дубликата, а не ошибка обработки
  question: Функция однократного применения вернула признак «эффект не выполнялся». Как воркер должен трактовать этот результат?
  explanation: 'Отказ выполнять эффект второй раз — это и есть штатная работа защиты от дублей. Задача успешна: нужное действие уже совершено при первой доставке. Считать это ошибкой значило бы гонять дубликаты по кругу.'
  kind: choice
  options:
    - Событие уже обработано ранее — задачу можно подтвердить как успешную
    - Обработка провалилась — задачу нужно вернуть в очередь
    - Лимит попыток исчерпан — задачу нужно отправить в DLQ
    - Идентификатор события повреждён — задачу нужно отбросить
  correct: 0
  id: 018-apply-once-2
