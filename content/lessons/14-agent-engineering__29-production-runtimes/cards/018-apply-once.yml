- concept: проверка наличия идентификатора и его запись должны быть одной атомарной операцией в общем хранилище, иначе параллельные воркеры выполнят эффект дважды
  question: Два воркера одновременно получили доставку одного и того же события. Что нужно, чтобы эффект всё равно случился один раз?
  explanation: 'Раздельные проверка и запись оставляют окно, в котором оба воркера видят «события ещё нет». Нужна одна неделимая операция в разделяемом хранилище: выигравший вставку выполняет эффект, второй получает конфликт и пропускает.'
  kind: choice
  options:
    - Атомарные проверка-и-запись идентификатора в общем хранилище (например, вставка с уникальным ключом)
    - Набор обработанных идентификаторов в памяти каждого воркера
    - Увеличенная пауза перед вызовом эффекта у второго воркера
    - Сортировка задач в очереди по идентификатору события
  correct: 0
