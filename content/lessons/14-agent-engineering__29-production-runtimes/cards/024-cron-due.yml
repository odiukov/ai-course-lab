- concept: скачок часов назад даёт отрицательное прошедшее время и не должен порождать запуск
  question: 'Часы машины синхронизировались и уехали назад: текущий момент оказался раньше отметки последнего запуска. Как должна повести себя проверка срока?'
  explanation: 'Обычное сравнение now - last_run >= interval само обрабатывает этот случай: отрицательная разница всегда меньше положительного интервала. Проверка срока не должна ни чинить отметку, ни падать — она отвечает только на вопрос о времени, а состояние обновляет тот, кто запускает работу.'
  kind: choice
  options:
    - 'Вернуть «не пора»: разница отрицательна, значит меньше интервала, и лишний запуск не создаётся'
    - 'Вернуть «пора»: раз отметка в будущем, она недостоверна и запуск нужно повторить'
    - Обнулить отметку последнего запуска и запустить задачу немедленно
    - Завершиться ошибкой, чтобы планировщик остановился
  correct: 0
