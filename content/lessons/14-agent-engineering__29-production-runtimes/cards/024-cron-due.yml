- concept: срок наступил, когда прошедшее с последнего запуска время не меньше интервала — сравнение нестрогое
  question: Периодическая задача идёт с интервалом 90 секунд. Последний запуск отмечен моментом 1240 по монотонным часам. Каково наименьшее значение текущего момента, при котором проверка срока даёт «пора запускать»?
  explanation: 'Условие — now - last_run >= interval, то есть 1240 + 90 = 1330. Сравнение нестрогое: ровно на границе запуск уже положен. Строгое «>» сдвинуло бы каждый запуск на один тик планировщика и накапливало бы отставание.'
  kind: numeric
  answer: 1330
  tolerance: 0.5
  id: 024-cron-due-1
  fingerprint: 90f5f42c
- concept: отсутствие отметки о предыдущем запуске означает готовность к первому старту
  question: Функция проверки срока получает отметку последнего запуска, которой у только что заведённой задачи ещё нет. Дополни ветку.
  explanation: Пустая отметка значит, что задача не запускалась ни разу, а не что она запускалась бесконечно давно или только что. Возврат True даёт первый старт на ближайшем тике; возврат False оставил бы задачу навсегда молчащей, потому что отметка обновляется только после запуска.
  kind: cloze
  template: |-
    if last_run is None:
        return ___
  answer: 'True'
  accept:
    - 'true'
    - 'True'
  id: 024-cron-due-2
