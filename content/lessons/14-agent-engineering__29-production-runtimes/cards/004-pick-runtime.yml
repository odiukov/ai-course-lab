- concept: форма определяется способом запуска и ожидания результата, а не темой или названием задачи
  question: 'Функция выбора рантайма получает задачу: запускается входящим вебхуком от платёжной системы, результата никто не ждёт синхронно, работа занимает секунды. Какую форму она должна вернуть?'
  explanation: Решает не транспорт и не тематика, а кто инициирует запуск. Внешний триггер (письмо, PR, вебхук) — это event-driven форма, даже если сам триггер доставлен по HTTP.
  kind: choice
  options:
    - request-response, потому что вебхук приходит по HTTP
    - event, потому что запуск инициирует внешнее событие
    - cron, потому что платежи приходят регулярно
  correct: 1
  id: 004-pick-runtime-1
  fingerprint: 8af6bd02
- concept: необходимость постепенной выдачи результата отличает streaming от request-response
  question: 'Дополни ветку выбора формы: пользователь ждёт ответ прямо сейчас, но результат нужно показывать по частям, а не одним куском.'
  explanation: Если ждущему пользователю нужен постепенный вывод — это streaming (SSE/WebSocket). Если ответ отдаётся одним куском и укладывается в жизнь соединения — request-response.
  kind: cloze
  template: |-
    if waits_now and needs_partial_output:
        return "___"
  answer: streaming
  accept:
    - streaming
    - stream
  id: 004-pick-runtime-2
  fingerprint: 0a9a3f86
- concept: признак «работа долгая и обязана переживать перезапуски» указывает на durable execution, а не на простую очередь
  question: Задача идёт часами, число шагов заранее неизвестно, повторный прогон с нуля недопустим по стоимости. Какую форму вернуть?
  explanation: Очередь решает «кто и когда возьмёт задачу», но не сохраняет прогресс внутри неё. Когда перезапуск с нуля недопустим, нужен durable execution; на практике его часто кладут поверх очереди.
  kind: choice
  options:
    - 'queue: задачу просто ставят и забирают позже'
    - 'durable: работа должна продолжаться с последнего успешного шага'
    - 'request-response: достаточно поднять таймаут сервера'
  correct: 1
  id: 004-pick-runtime-3
  fingerprint: dc53d412
