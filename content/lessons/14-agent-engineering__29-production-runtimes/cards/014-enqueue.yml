- concept: запись задачи должна попасть в очередь до того, как её идентификатор отдан вызывающей стороне
  question: Расставь действия функции постановки задачи в очередь в правильном порядке.
  explanation: Идентификатор — это обещание, что работа зарегистрирована. Если вернуть его до записи в очередь, вызывающая сторона получит номер несуществующей задачи и будет опрашивать её статус впустую.
  kind: order
  items:
    - Сгенерировать уникальный идентификатор задачи
    - 'Собрать запись задачи: идентификатор, полезная нагрузка, статус, время постановки'
    - Добавить запись в очередь
    - Вернуть идентификатор вызывающей стороне
