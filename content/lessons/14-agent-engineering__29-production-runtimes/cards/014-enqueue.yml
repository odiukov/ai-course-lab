- concept: запись задачи должна попасть в очередь до того, как её идентификатор отдан вызывающей стороне
  question: Расставь действия функции постановки задачи в очередь в правильном порядке.
  explanation: Идентификатор — это обещание, что работа зарегистрирована. Если вернуть его до записи в очередь, вызывающая сторона получит номер несуществующей задачи и будет опрашивать её статус впустую.
  kind: order
  items:
    - Сгенерировать уникальный идентификатор задачи
    - 'Собрать запись задачи: идентификатор, полезная нагрузка, статус, время постановки'
    - Добавить запись в очередь
    - Вернуть идентификатор вызывающей стороне
  id: 014-enqueue-1
  fingerprint: 2bf166c7
- concept: только что принятая задача помечается состоянием ожидания, отличным от состояния выполнения и завершения
  question: Заполни состояние, с которым задача кладётся в очередь при постановке.
  explanation: Состояние `queued` означает «принята, но ещё не выполняется». Оно отличает ожидающую задачу от взятой воркером (`running`) и от завершённой (`done`), иначе по записи невозможно понять, начал ли кто-то работу.
  kind: cloze
  template: 'job = {"id": job_id, "payload": payload, "status": "___"}'
  answer: queued
  accept:
    - queued
    - pending
    - в очереди
  id: 014-enqueue-2
  fingerprint: 5a1361f5
- concept: функция постановки в очередь не запускает обработчик, поэтому время её ответа не зависит от длительности задачи
  question: По какому наблюдаемому признаку видно, что функция постановки в очередь ошибочно написана как исполнитель?
  explanation: 'Приёмная часть делает фиксированный объём работы: собрать запись и положить её в очередь. Если вызов длится тем дольше, чем тяжелее вход, значит обработка происходит прямо внутри приёма — и таймаут вернулся.'
  kind: choice
  options:
    - Время её вызова растёт вместе с объёмом входных данных задачи
    - Она возвращает строковый идентификатор вместо числового
    - Она записывает в очередь полезную нагрузку целиком
    - После её вызова длина очереди увеличивается на единицу
  correct: 0
