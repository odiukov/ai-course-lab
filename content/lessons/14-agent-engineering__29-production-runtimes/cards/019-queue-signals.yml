- concept: пустая основная очередь не доказывает здоровье системы, если задачи ушли в DLQ
  question: 'Дашборд фоновой обработки показывает: в основной очереди сейчас ноль ожидающих задач, в DLQ — 640 записей за сутки. Какой вывод корректен?'
  explanation: 'Глубина падает и когда задачи выполнены, и когда они исчерпали попытки и переехали в DLQ. 640 записей в DLQ означают, что пропускная способность мнимая: работа не сделана, она просто вынута из основной очереди.'
  kind: choice
  options:
    - Очередь разгружена мгновенно, потому что воркеров с запасом
    - 'Работы нет: раз глубина нулевая, обрабатывать нечего'
    - Задачи уходят из очереди не через успешную обработку, а через окончательные отказы
  correct: 2
  id: 019-queue-signals-1
  fingerprint: df6b6261
- concept: накопление долга видно по движению глубины во времени, а не по одному мгновенному значению
  question: У двух сервисов глубина очереди сейчас одинаковая — 700 задач. У первого она весь день колеблется около 60 и подскочила до 700 после массовой рассылки. У второго она с утра росла с 60 до 700 непрерывно. Что различает эти случаи?
  explanation: Мгновенное значение глубины не отличает временный пик от накопления. Монотонный рост в течение дня значит, что задачи поступают быстрее, чем уходят, и хвост сам не рассосётся; всплеск после разовой рассылки уходит, когда источник затих. Длительность одной задачи из глубины вообще не следует.
  kind: choice
  options:
    - 'Ничего: одинаковая текущая глубина означает одинаковое состояние'
    - У первого всплеск рассосётся, у второго приём стабильно обгоняет обработку
    - У второго задачи тяжелее, поэтому каждая обрабатывается дольше
  correct: 1
  id: 019-queue-signals-2
  fingerprint: 1f5fd148
- concept: распределение времени ожидания, а не одно среднее, выявляет застрявшие задачи
  question: Среднее время ожидания в очереди — 3 секунды, и оно стабильно неделями. Почему по этому числу нельзя заключить, что все задачи обслуживаются быстро? Что смотреть вместо него?
  explanation: Ожидание в очереди распределено с длинным хвостом, а среднее — плохая сводка для такой формы. Медиана плюс перцентили разделяют «обычно быстро» и «кому-то очень плохо».
  kind: open
  reference: 'Среднее размывается массой свежих задач: сотня задач, взятых мгновенно, компенсирует несколько застрявших на часы, и итог всё равно выглядит как 3 секунды. Нужно распределение времени ожидания — медиана показывает опыт обычной задачи, высокие перцентили (p95, p99) и максимум показывают хвост, где сидят задачи, которых воркеры не добирают: например, из-за приоритета, размера или залипшего шарда. Именно хвост, а не среднее, соответствует жалобам пользователей.'
  id: 019-queue-signals-3
  fingerprint: 7285a363
