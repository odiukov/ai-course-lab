- concept: чекпоинт называет завершённый шаг, поэтому остаток списка начинается со следующего
  question: Пайплайн описан как ["fetch", "parse", "score", "publish"], чекпоинт хранит "parse". Что должна вернуть функция остатка работы?
  explanation: 'Классическая ошибка на один шаг: чекпоинт "parse" означает «parse завершён», а не «начни с parse». Повтор parse — лишняя оплаченная работа, пропуск score — потерянный результат.'
  kind: choice
  options:
    - '["score", "publish"]'
    - '["parse", "score", "publish"]'
    - '["publish"]'
    - '["fetch", "parse", "score", "publish"]'
  correct: 0
  id: 012-resume-checkpoint-1
  fingerprint: 7c4ec730
- concept: неизвестное имя чекпоинта — явная ошибка, а не тихий старт с начала
  question: Имя из чекпоинта не найдено в списке шагов. Заполни пропуск, чтобы функция не запустила процесс заново молча.
  explanation: Неизвестное имя обычно означает, что пайплайн переименовали или переставили. Тихий возврат всего списка выглядит как успешное восстановление и заново оплачивает все шаги — ошибка должна быть громкой.
  kind: cloze
  template: |-
    if checkpoint not in steps:
        raise ___(f"unknown checkpoint: {checkpoint}")
  answer: ValueError
  accept:
    - ValueError
    - KeyError
    - LookupError
  id: 012-resume-checkpoint-2
  fingerprint: 0460991b
- concept: отсутствие чекпоинта означает, что не завершён ни один шаг
  question: Функция получает пустой чекпоинт (работа ещё ни разу не сохранялась). Каким должен быть результат?
  explanation: 'Отсутствие отметки — валидное состояние первого запуска, а не поломка. Симметричный случай: чекпоинт на последнем шаге даёт пустой список — выполнять больше нечего.'
  kind: choice
  options:
    - 'Весь список шагов: ни один шаг не завершён'
    - 'Пустой список: без чекпоинта продолжать нечего'
    - Только первый шаг — остальные подберутся позже
    - 'Ошибка: без чекпоинта запуск невозможен'
  correct: 0
  id: 012-resume-checkpoint-3
  fingerprint: f0f6bf7a
