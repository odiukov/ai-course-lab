  question: Внутри функции агента появился код, который сам забирает следующее сообщение из очереди и сам проверяет, наступило ли время запуска. Чем это плохо?
  explanation: Разделение «что сделать» и «как и когда запустить» держит агента переносимым. Смешав их, вы получаете функцию, которую нельзя вызвать в тесте без очереди и без подмены часов.
