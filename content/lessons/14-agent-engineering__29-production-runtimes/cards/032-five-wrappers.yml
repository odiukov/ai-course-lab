- concept: минимальная форма рантайма выражается средствами стандартной библиотеки, а тяжёлые инфраструктурные инструменты добавляют надёжность, а не саму идею формы
  question: Почему демонстрационные формы рантайма — стриминг, очередь с DLQ, реестр триггеров, планировщик — можно собрать на генераторе, списке и словаре, и что тогда дают Celery или Kubernetes?
  explanation: 'Отделив идею формы от её промышленной реализации, проще выбирать: сначала фиксируется нужная форма и гарантии, и только потом инструмент, который эти гарантии обеспечит.'
  kind: open
  reference: 'Суть формы — это протокол запуска и выдачи результата: генератор описывает постепенную выдачу, список — буфер задач между производителем и воркером, словарь — сопоставление триггера с обработчиком, цикл со сравнением времени — планировщик. Всё это выражается десятком строк стандартной библиотеки. Промышленные инструменты не меняют форму: они добавляют устойчивость к перезапуску, распределение по машинам, гарантии доставки, масштабирование пула воркеров и наблюдаемость. То есть дают надёжность реализации, а не другую идею.'
