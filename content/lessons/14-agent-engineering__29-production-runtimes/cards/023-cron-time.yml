- concept: scheduled-рантайм отвечает только за создание запуска в назначенный момент, а не за ход и исход работы агента
  question: За что отвечает scheduled-рантайм и что остаётся за пределами его ответственности?
  explanation: 'Смешение этих ролей — типичная ошибка: в cron-правило пытаются заложить поведение при сбое. Расписание — это триггер старта, вся дальнейшая работа начинается уже после решения о запуске.'
  kind: open
  reference: 'Scheduled-рантайм отвечает ровно за одно: определить, что наступил момент, описанный расписанием, и создать запуск агента. Он не решает, как агент обработает данные, сколько будет работать, успешно ли завершится и что делать при падении. Поэтому надёжность самого прогона обеспечивается другими средствами (например, устойчивым выполнением), а не более подробным расписанием.'
  id: 023-cron-time-2
  fingerprint: de646607
- concept: календарное расписание привязано к настенным часам, поэтому перевод часов может продублировать или пропустить запуск
  question: Ночной прогон назначен на 02:40 по локальной зоне, где дважды в год переводят часы. Какой риск создаёт именно такая привязка расписания?
  explanation: Календарное правило считается по настенным часам выбранной зоны. При переходе вперёд час выпадает и совпадения не происходит, при переходе назад тот же час повторяется и совпадение случается дважды. Отсюда практика назначать служебные прогоны в UTC либо делать обработчик идемпотентным.
  kind: choice
  options:
    - В сутки перевода локальное время 02:40 может не наступить вовсе или наступить дважды, поэтому прогон пропустится либо запустится два раза
    - Прогон станет выполняться медленнее, потому что сместится нагрузка на сервер
    - Планировщик перестанет просыпаться до перезапуска процесса
    - Агент потеряет доступ к данным за пропущенный час
  correct: 0
