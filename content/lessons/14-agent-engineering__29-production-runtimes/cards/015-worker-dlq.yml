- concept: 'цикл работы с DLQ: изоляция задачи, диагностика по накопленным причинам, починка обработчика, возврат задач в основную очередь'
  question: Расставь по порядку шаги работы команды с задачами, попавшими в dead-letter queue.
  explanation: 'DLQ работает как петля: изолировать, увидеть по метрике, диагностировать по сохранённым причинам, починить, вернуть в работу. Возврат задач до исправления обработчика бесполезен — они снова придут в DLQ.'
  kind: order
  items:
    - Воркер исчерпал попытки и перекладывает задачу в DLQ вместе с причиной сбоя
    - Метрика размера DLQ растёт, и команда открывает накопленные записи
    - По совпадающим причинам ошибок находится общий дефект обработчика
    - Обработчик исправлен и выкачен
    - Подходящие задачи возвращаются из DLQ в основную очередь на повторную обработку
