- concept: задача в DLQ хранится вместе с метаданными сбоя, что делает возможным диагностику и повторный запуск после починки обработчика
  question: Почему в dead-letter queue кладут не только саму задачу, но и сопровождающие её данные? Что именно там должно оказаться и что это даёт команде?
  explanation: 'DLQ ценна не фактом изоляции, а возможностью разбора и повторного запуска. Отсюда и метрика «размер DLQ»: её рост со схожими причинами — сигнал об одном общем дефекте обработчика, а не о случайных плохих данных.'
  kind: open
  reference: 'Вместе с полезной нагрузкой задачи сохраняют причину ошибки (текст исключения/код), время последней неудачи и число сделанных попыток. Это превращает DLQ из мусорной корзины в карантин: по накопленным причинам видно, единичный это сбой или системный (например, обработчик не понимает новый формат файла), а сохранённая полезная нагрузка позволяет после исправления обработчика вернуть подходящие задачи в основную очередь и доработать их. Без метаданных задача в DLQ неотличима от потерянной: чинить нечего и повторить нечего.'
  id: 015-worker-dlq-2
