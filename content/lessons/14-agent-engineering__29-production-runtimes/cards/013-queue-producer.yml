- concept: пропускная способность фоновой обработки задаётся числом и скоростью воркеров, а не скоростью приёма задач
  question: В очередь одновременно поставили 12 задач, каждая выполняется ровно 6 минут. Работают 3 воркера, каждый берёт по одной задаче за раз. Через сколько минут будет готова последняя задача?
  explanation: '3 воркера обрабатывают задачи волнами по 3 штуки: 12 / 3 = 4 волны, 4 × 6 = 24 минуты. Приём всех 12 задач занял доли секунды — очередь не ускоряет работу, она лишь снимает ограничение на время ответа.'
  kind: numeric
  answer: 24
  tolerance: 0.1
