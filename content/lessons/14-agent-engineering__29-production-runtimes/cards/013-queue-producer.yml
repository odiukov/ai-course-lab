- concept: результат фоновой задачи доставляется отдельным каналом — webhook или pub/sub, а не тем же запросом, что её поставил
  question: Агент с длинным горизонтом выполняет задачу час. Каким способом результат обычно возвращается инициатору в queue-based рантайме?
  explanation: 'Соединение, через которое задачу поставили, давно закрыто. Поэтому результат идёт обратным каналом: webhook на адрес заказчика или сообщение в pub/sub, на которое подписан инициатор.'
  kind: choice
  options:
    - Webhook на указанный адрес или публикация события для подписчиков
    - Тем же HTTP-ответом, который держится открытым до конца работы
    - Записью в лог воркера, откуда клиент её вычитывает
    - Повторной постановкой той же задачи в очередь с флагом «готово»
