- concept: время ожидания ждущей задачи считается от момента постановки в очередь до текущего момента
  question: 'Задача ещё не взята воркером. Заполни пропуск: по какой отметке времени вычисляется её ожидание?'
  explanation: Пока задача ждёт, у неё нет ни времени старта, ни времени завершения — эти поля пусты. Единственная имеющаяся отметка — момент постановки в очередь; разница с текущим моментом и есть накопленное ожидание.
  kind: cloze
  template: wait_seconds = now - job["___"]
  answer: enqueued_at
  accept:
    - queued_at
    - enqueue_time
    - enqueued_at_ts
    - created_at
  id: 020-queue-metrics-1
  fingerprint: 88df8c35
- concept: для пустой очереди метрика ожидания не определена и не подменяется нулём
  question: Функция снимка метрик получила пустую очередь. Что вернуть в поле перцентилей ожидания?
  explanation: 'Ноль секунд — осмысленное измерение, оно читается как «задачи обслуживаются мгновенно», и на графике неотличимо от идеально здоровой очереди. Отсутствие выборки нужно кодировать отдельно от значения. Ронять весь снимок тоже нельзя: глубина и размер DLQ считаются и для пустой очереди.'
  kind: choice
  options:
    - Пустое значение (None), явно означающее «данных нет»
    - Нулевую задержку — ждущих задач нет, значит ожидание нулевое
    - Значение из предыдущего снимка, чтобы график не рвался
    - Ошибку, прерывающую сбор всех метрик
  correct: 0
  id: 020-queue-metrics-2
  fingerprint: 3a574c5a
- concept: перцентили ожидания считаются по списку возрастов ожидающих задач, а не по агрегату, накопленному заранее
  question: Расставь шаги вычисления перцентилей ожидания в снимке метрик очереди.
  explanation: 'Перцентиль — функция от выборки, поэтому сначала строится выборка возрастов, и только потом берутся квантили. Обратный порядок (усреднять по ходу и потом «доставать» перцентиль) невозможен: из одного накопленного числа распределение не восстановить.'
  kind: order
  items:
    - Отобрать задачи, которые сейчас ждут обработки в основной очереди
    - 'Для каждой такой задачи вычислить возраст: текущий момент минус момент постановки в очередь'
    - Собрать возрасты в один список
    - Передать список функции percentile и получить медиану и высокий перцентиль
  id: 020-queue-metrics-3
  fingerprint: 31a2acab
