- concept: в event-driven рантайме отдельно меряют задержку от события до старта агента и задержку самой работы агента
  question: Событийный агент подписан на входящие письма. Письмо пришло в 07:15, агент стартовал в 07:21 и отработал за 25 секунд. Пользователь жалуется на медленную реакцию. Какие две задержки нужно различать и где здесь проблема?
  explanation: Наблюдаемость event-driven формы включает источник триггера, время от события до старта и время работы агента. Без разделения этих двух чисел разработчик чинит не тот участок.
  kind: open
  reference: 'Мерить надо две разные величины: задержку от события до запуска агента (здесь около 6 минут) и задержку самой работы агента (25 секунд). Проблема не в агенте, а в доставке триггера — очередь событий, поллинг, холодный старт. Оптимизация промпта или модели ничего не даст.'
  id: 002-shest-form-2
  fingerprint: 9d769b0e
- concept: глубина очереди показывает нехватку воркеров, чего средняя задержка не выявляет
  question: У queue-based рантайма глубина очереди за сутки выросла с 60 до 4200 задач, при этом средняя длительность обработки одной задачи не изменилась. О чём это говорит?
  explanation: Растущая глубина очереди означает, что задачи приходят быстрее, чем воркеры их разбирают. Средний тайминг обработки этого не покажет — поэтому у очереди меряют глубину, распределение задержки по задачам и размер DLQ.
  kind: choice
  options:
    - Задачи стали сложнее, нужно упростить промпты
    - Пропускной способности воркеров не хватает под входящий поток — их число надо увеличивать
    - 'Ничего страшного: раз средняя длительность прежняя, система здорова'
  correct: 1
  id: 002-shest-form-3
