- concept: перехват исключения оборачивает отдельный вызов обработчика внутри цикла, чтобы сбой ограничивался одной задачей
  question: В воркере очереди нужно, чтобы падение одной задачи не останавливало обработку остальных. Где размещается перехват исключения?
  explanation: 'Перехват вокруг цикла ловит первое же исключение и выходит из цикла — исправные задачи, стоящие следом, остаются необработанными. Перехват вокруг одного вызова обработчика делает сбой принадлежностью конкретной задачи: воркер учитывает попытку, решает «вернуть в очередь или в DLQ» и переходит к следующей.'
  kind: choice
  options:
    - Вокруг всего цикла разбора очереди
    - Вокруг вызова обработчика внутри тела цикла, на каждой итерации
    - Вокруг функции постановки задачи в очередь
    - Вокруг записи задачи в DLQ
  correct: 1
  id: 016-run-worker-1
  fingerprint: 7e74ffaf
- concept: число возвратов в очередь при постоянно падающем обработчике равно лимиту попыток минус один
  question: Лимит попыток равен 6. Обработчик падает на задаче при каждом вызове. Сколько раз воркер вернёт эту задачу в основную очередь, прежде чем переложит её в DLQ?
  explanation: Каждая неудача увеличивает счётчик попыток. После неудач с 1-й по 5-ю попытки ещё остаются, задача возвращается в очередь — это 5 возвратов. Шестая неудача исчерпывает лимит, и задача уходит в DLQ, а не получает седьмую попытку. Всего вызовов обработчика — 6, возвратов — 5.
  kind: numeric
  answer: 5
  tolerance: 0.4
  id: 016-run-worker-2
  fingerprint: e2829a66
- concept: граничное условие отправки в DLQ сравнивает счётчик попыток с лимитом нестрого
  question: Задача должна попасть в DLQ ровно на той неудаче, которая исчерпывает лимит, а не на следующей. Заполни условие.
  explanation: Счётчик уже увеличен, поэтому строгое `>` дало бы задаче одну лишнюю попытку сверх лимита. Нестрогое `>=` отправляет задачу в DLQ на неудаче, номер которой совпал с лимитом.
  kind: cloze
  template: |-
    task["attempts"] += 1
    if task["attempts"] ___ max_attempts:
        dlq.append(task)
    else:
        queue.append(task)
  answer: '>='
  accept:
    - '>='
    - ≥
    - '> ='
    - task["attempts"] >= max_attempts
  id: 016-run-worker-3
  fingerprint: 0726020f
