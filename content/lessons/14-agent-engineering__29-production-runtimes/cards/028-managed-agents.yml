- concept: управляемый хостинг снимает эксплуатацию запуска, но гарантии повторов и сохранения прогресса остаются ответственностью разработчика
  question: Агент вынесен на управляемый сервис. Триггер иногда доставляется дважды, а прогон дорогой и многошаговый. Что остаётся спроектировать самой команде?
  explanation: Слово managed относится к запуску и эксплуатации среды, а не к семантике доставки и не к живучести прогона. Дубли триггеров и дорогие частично выполненные прогоны остаются задачами уровня приложения.
  kind: choice
  options:
    - Идемпотентность внешних эффектов и сохранение прогресса, чтобы сбой не заставлял переделывать всё заново
    - 'Ничего: управляемый сервис по определению исключает повторную доставку и потерю прогресса'
    - Только формат ответа для пользователя, всё остальное закрыто платформой
    - Собственный планировщик, потому что управляемые сервисы не работают с триггерами
