- concept: один продукт обычно совмещает несколько форм рантайма, и путаница возникает, когда задачу кладут в чужую форму
  question: Продукт умеет отвечать в чате, разбирать загруженные пакеты документов и считать ночную сводку. Сколько форм выполнения тут разумно использовать и что происходит, если всё свести к одной?
  explanation: Формы выбирают по задаче, а не по продукту целиком. Ошибки продакшена почти всегда начинаются с задачи, засунутой в чужую форму.
  kind: open
  reference: 'Разумно использовать несколько форм одновременно: чат — request-response или streaming, разбор пакета документов — очередь, ночная сводка — cron (желательно с durable). Реальный продукт обычно живёт на трёх-четырёх формах. Если всё свести к одной, задача оказывается в чужой форме: длинный разбор в синхронном HTTP даёт таймауты, а чат через очередь — бессмысленное ожидание.'
