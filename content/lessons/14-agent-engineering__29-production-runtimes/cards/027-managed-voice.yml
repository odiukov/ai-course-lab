- concept: голосовой диалог требует одновременного приёма и выдачи данных, потому что агент должен слушать, пока говорит
  question: Почему голосовому агенту недостаточно уметь отдавать ответ порциями — почему поток нужен в обе стороны одновременно?
  explanation: 'Односторонняя потоковая выдача решает только задержку до первой реакции. Живой разговор требует двустороннего канала: входящий звук обрабатывается ровно в тот момент, когда агент ещё выдаёт свой ответ.'
  kind: open
  reference: Пока агент проговаривает ответ, пользователь может перебить его, поправить запрос или задать уточнение. Если канал в сторону агента открыт только между репликами, перебивание либо теряется, либо обрабатывается с опозданием, и диалог вырождается в обмен монологами. Поэтому приём аудио маленькими порциями должен идти параллельно с выдачей ответа, а не чередоваться с ней.
  id: 027-managed-voice-3
