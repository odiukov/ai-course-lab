- concept: Pipecat Cloud и LiveKit Cloud — стеки, закрывающие управляемый голосовой рантайм
  question: Продукт — телефонный ассистент, которого можно перебить репликой на полуслове. Какие управляемые платформы перечислены в deployment-паттернах именно под такой голосовой рантайм?
  explanation: Pipecat Cloud / LiveKit Cloud указаны как управляемый голос. Claude Managed Agents закрывают хостируемые долгие асинхронные задачи, Agno/Mastra — HTTP-форму, cron-стеки — запуск по расписанию.
  kind: choice
  options:
    - Pipecat Cloud и LiveKit Cloud
    - Claude Managed Agents и CrewAI Flows
    - Agno и Mastra
    - Kubernetes CronJob и хостинговый cron
