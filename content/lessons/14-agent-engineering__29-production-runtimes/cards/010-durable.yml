- concept: выгода устойчивого выполнения равна стоимости повторного прогона пройденных шагов минус стоимость записей состояния
  question: Объясни своими словами, как решить, окупается ли чекпоинтинг после каждого шага.
  explanation: Устойчивое выполнение не обещает отсутствие сбоев — оно обещает, что сбой не обнулит уже оплаченную работу. Дешёвые быстрые шаги такой доплаты не оправдывают.
  kind: open
  reference: 'Нужно сравнить две величины: стоимость записи состояния на каждом шаге (задержка плюс хранилище) и ожидаемую стоимость повторения уже пройденных шагов при сбое. Если шаг — это вызов модели, обращение к платному API или ручное подтверждение, повтор десятков таких шагов заведомо дороже такого же числа коротких записей. Чем дороже шаг и чем менее предсказуема длина задачи, тем сильнее арифметика в пользу чекпоинтов.'
  id: 010-durable-3
