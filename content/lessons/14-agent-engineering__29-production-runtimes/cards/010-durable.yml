- concept: накладные расходы чекпоинтинга растут линейно с числом шагов
  question: Рантайм записывает чекпоинт после каждого шага, одна запись стоит 5 мс. Сколько миллисекунд добавит чекпоинтинг к задаче из 60 шагов?
  explanation: 60 × 5 мс = 300 мс. Это постоянная доплата за каждый шаг; сравнивать её нужно со стоимостью повторного прогона десятков вызовов модели после сбоя.
  kind: numeric
  answer: 300
  tolerance: 1
  id: 010-durable-1
  fingerprint: e5b2f24f
- concept: акторная модель ограничивает сбой пределами одного агента, а не всего прогона
  question: Что даёт акторная модель в многоагентном рантайме при падении одного из агентов?
  explanation: Акторы обмениваются сообщениями и не делят состояние, поэтому падение одного не обнуляет прогресс соседей. Вместе с чекпоинтами это даёт локализованное восстановление вместо перезапуска всего прогона.
  kind: choice
  options:
    - Сбой изолируется в пределах этого агента, остальная система продолжает работу
    - Все агенты откатываются к общему стартовому состоянию
    - Упавший агент автоматически заменяется другой моделью
