- concept: 'порядок фиксации решения о рантайме: сначала форма выполнения, затем гарантии при сбое, затем метрики, подтверждающие эти гарантии'
  question: Расставь части артефакта решения о рантайме в порядке, в котором они фиксируются и зависят друг от друга.
  explanation: Форма говорит «как работаем», гарантии — «что обещаем», метрики — «как узнаём, что обещание выполняется». Метрики выводятся из гарантий, гарантии — из формы, поэтому обратный порядок даёт набор дашбордов, не привязанных к обещаниям.
