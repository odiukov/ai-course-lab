- concept: гарантия, под которую не выбрана метрика, непроверяема в эксплуатации и остаётся пожеланием
  question: Почему в артефакте решения рядом с каждой гарантией обязана стоять метрика? Объясни на примере обещания «фоновая обработка не отстаёт от потока задач».
  explanation: Проверяемость — часть решения, а не отдельный этап после запуска. Гарантия без измеряемого сигнала не отличима от её отсутствия.
  kind: open
  reference: 'Гарантия — это утверждение о поведении системы под нагрузкой и при сбоях. Проверить его можно только измерением: без метрики нарушение обнаруживает пользователь, а не команда. Для обещания «обработка не отстаёт» нужны движение глубины очереди во времени, распределение возраста ждущих задач и поступление в DLQ. Если эти сигналы не сняты, накопление долга останется невидимым, а обещание — недоказуемым; фактически это форма без наблюдаемости, то есть агент, о состоянии которого узнают из жалоб.'
