<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Обязательные сигналы для форм выполнения</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #eef2f7;
      --surface: #ffffff;
      --surface-soft: #f7f9fc;
      --surface-alt: #f1f5f9;
      --title-bg: #e8eef7;
      --ink: #172033;
      --muted: #5a667a;
      --rule: #c8d2e1;
      --rule-strong: #8fa0b8;
      --pill: #ffffff;
      --pill-border: #b8c5d6;
      --blue: #2563eb;
      --cyan: #0784a3;
      --violet: #7656d6;
      --amber: #b56808;
      --green: #16845b;
      --rose: #c24169;
      --icon-ink: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: unset;
      padding: unset;
      background: var(--page);
      color: var(--ink);
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    .figure {
      overflow: hidden;
      background: var(--surface);
      border-color: var(--rule-strong);
      border-style: solid;
      border-width: 1px;
    }

    h1 {
      margin: unset;
      background: var(--title-bg);
      color: var(--ink);
      border-bottom-color: var(--rule);
      border-bottom-style: solid;
      border-bottom-width: 1px;
      font-size: 20px;
      font-weight: bold;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 470px;
      background: var(--surface);
      text-rendering: optimizeLegibility;
      shape-rendering: geometricPrecision;
    }

    .table-shell {
      fill: var(--surface);
      stroke: var(--rule-strong);
    }

    .header-band {
      fill: var(--surface-alt);
    }

    .row-band {
      fill: var(--surface);
    }

    .row-band.alt {
      fill: var(--surface-soft);
    }

    .rule {
      stroke: var(--rule);
      stroke-linecap: round;
    }

    .rule.strong {
      stroke: var(--rule-strong);
    }

    .header-label {
      fill: var(--muted);
      font-size: 13px;
      font-weight: bold;
    }

    .form-label {
      fill: var(--ink);
      font-size: 16px;
      font-weight: bold;
    }

    .detail-label {
      fill: var(--muted);
      font-size: 14px;
    }

    .signal-pill {
      fill: var(--pill);
      stroke: var(--pill-border);
    }

    .signal-label {
      fill: var(--ink);
      font-size: 14px;
      font-weight: bold;
    }

    .row-icon {
      stroke: none;
    }

    .row-symbol {
      fill: var(--icon-ink);
      font-size: 15px;
      font-weight: bold;
    }

    .accent-blue {
      fill: var(--blue);
    }

    .accent-cyan {
      fill: var(--cyan);
    }

    .accent-violet {
      fill: var(--violet);
    }

    .accent-amber {
      fill: var(--amber);
    }

    .accent-green {
      fill: var(--green);
    }

    .accent-rose {
      fill: var(--rose);
    }

    #fallback {
      margin: unset;
      color: var(--ink);
      background: var(--surface);
      font-size: 16px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111724;
        --surface: #182131;
        --surface-soft: #1c2738;
        --surface-alt: #222e40;
        --title-bg: #202c3e;
        --ink: #edf3fb;
        --muted: #b8c5d6;
        --rule: #3b4a60;
        --rule-strong: #62738c;
        --pill: #263348;
        --pill-border: #53657e;
        --blue: #4f83f5;
        --cyan: #24a8c2;
        --violet: #9478e8;
        --amber: #d78a24;
        --green: #31a979;
        --rose: #df6488;
      }
    }
  </style>
</head>
<body>
  <main class="figure" aria-labelledby="diagram-heading">
    <h1 id="diagram-heading">У каждой формы — свой набор обязательных сигналов</h1>

    <svg
      id="diagram"
      width="1160"
      height="430"
      viewBox="0 0 1160 430"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-desc"
    >
      <title id="svg-title">Таблица сигналов наблюдаемости для шести форм выполнения</title>
      <desc id="svg-desc">
        Для запроса и ответа нужны HTTP-логи и OTel, для потока — первый токен
        и чанки, для надёжного выполнения — чекпоинты, для очереди — глубина,
        перцентили и DLQ, для события — задержка до старта, для расписания —
        пропуски и длительность запусков.
      </desc>
    </svg>

    <p id="fallback" hidden></p>
  </main>

  <script>
    const data = [
      {
        originX: 0,
        originY: 0,
        scale: 1,
        zero: 0,
        canvasLeft: 0,
        canvasTop: 0,
        canvasRight: 1160,
        canvasBottom: 430,
        tableLeft: 16,
        tableRight: 1144,
        tableTop: 12,
        tableBottom: 418,
        headerBottom: 60,
        formDividerX: 244,
        signalDividerX: 802,
        railRight: 23,
        iconX: 39,
        iconRadius: 10,
        formTextX: 61,
        signalTextInset: 13,
        detailTextX: 824,
        headerFormX: 39,
        headerSignalX: 266,
        headerDetailX: 824,
        headerTextY: 42,
        textBaselineShift: 5,
        iconBaselineShift: 5,
        pillHalfHeight: 17,
        pillRadius: 9,
        shellRadius: 0,
        lineWidth: 1,
        strongLineWidth: 2,
        titlePadX: 18,
        titlePadY: 10,
        fallbackPadX: 18,
        fallbackPadY: 18
      },
      {
        top: 60,
        bottom: 120,
        center: 90,
        form: "Запрос → ответ",
        symbol: "↔",
        accent: "accent-blue",
        alternate: false,
        detail: "Где ответ теряет время?",
        chips: [
          { left: 266, right: 375, label: "HTTP-логи" },
          { left: 387, right: 769, label: "OTel: шаги, модель, ошибки" }
        ]
      },
      {
        top: 120,
        bottom: 180,
        center: 150,
        form: "Поток",
        symbol: "≈",
        accent: "accent-cyan",
        alternate: true,
        detail: "Где поток замолчал?",
        chips: [
          { left: 266, right: 500, label: "Время до первого токена" },
          { left: 512, right: 769, label: "Паузы и обрывы чанков" }
        ]
      },
      {
        top: 180,
        bottom: 240,
        center: 210,
        form: "Надёжное выполнение",
        symbol: "◆",
        accent: "accent-violet",
        alternate: false,
        detail: "С какого шага продолжать?",
        chips: [
          { left: 266, right: 440, label: "Последний чекпоинт" },
          { left: 452, right: 590, label: "Возобновления" },
          { left: 602, right: 769, label: "Завершённый шаг" }
        ]
      },
      {
        top: 240,
        bottom: 300,
        center: 270,
        form: "Очередь",
        symbol: "≡",
        accent: "accent-amber",
        alternate: true,
        detail: "Что застряло до воркера?",
        chips: [
          { left: 266, right: 360, label: "Глубина" },
          { left: 372, right: 601, label: "Перцентили возраста" },
          { left: 613, right: 676, label: "DLQ" }
        ]
      },
      {
        top: 300,
        bottom: 360,
        center: 330,
        form: "Событие",
        symbol: "↯",
        accent: "accent-green",
        alternate: false,
        detail: "Что задержало запуск?",
        chips: [
          { left: 266, right: 570, label: "Задержка: событие → старт" }
        ]
      },
      {
        top: 360,
        bottom: 418,
        center: 389,
        form: "Расписание",
        symbol: "◷",
        accent: "accent-rose",
        alternate: true,
        detail: "Какой запуск пропущен или затянулся?",
        chips: [
          { left: 266, right: 366, label: "Пропуски" },
          { left: 378, right: 600, label: "Длительность запусков" },
          { left: 612, right: 769, label: "Последний / следующий" }
        ]
      }
    ];

    const [layout, ...rows] = data;
    const origin = Object.freeze({ x: layout.originX, y: layout.originY });
    const scale = layout.scale;
    const sx = x => origin.x + x * scale;
    const sy = y => origin.y + y * scale;

    try {
      const svg = document.getElementById("diagram");
      const heading = document.getElementById("diagram-heading");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      heading.style.padding =
        `${sy(layout.titlePadY) - sy(layout.zero)}px ` +
        `${sx(layout.titlePadX) - sx(layout.zero)}px`;

      fallback.style.padding =
        `${sy(layout.fallbackPadY) - sy(layout.zero)}px ` +
        `${sx(layout.fallbackPadX) - sx(layout.zero)}px`;

      const make = (tag, attributes, className) => {
        const element = document.createElementNS(namespace, tag);
        Object.entries(attributes).forEach(([name, value]) => {
          element.setAttribute(name, String(value));
        });
        if (className) element.setAttribute("class", className);
        return element;
      };

      const addRect = (parent, left, top, right, bottom, radius, className) => {
        const rect = make(
          "rect",
          {
            x: sx(left),
            y: sy(top),
            width: sx(right) - sx(left),
            height: sy(bottom) - sy(top),
            rx: sx(radius) - sx(layout.zero),
            ry: sy(radius) - sy(layout.zero)
          },
          className
        );
        parent.appendChild(rect);
        return rect;
      };

      const addLine = (parent, xStart, yStart, xEnd, yEnd, className, width) => {
        const line = make(
          "line",
          {
            x1: sx(xStart),
            y1: sy(yStart),
            x2: sx(xEnd),
            y2: sy(yEnd),
            "stroke-width": width
          },
          className
        );
        parent.appendChild(line);
        return line;
      };

      const addText = (parent, value, x, y, className, anchor) => {
        const text = make(
          "text",
          {
            x: sx(x),
            y: sy(y),
            "text-anchor": anchor
          },
          className
        );
        text.textContent = value;
        parent.appendChild(text);
        return text;
      };

      const shell = addRect(
        svg,
        layout.tableLeft,
        layout.tableTop,
        layout.tableRight,
        layout.tableBottom,
        layout.shellRadius,
        "table-shell"
      );
      shell.setAttribute("stroke-width", String(layout.lineWidth));

      addRect(
        svg,
        layout.tableLeft,
        layout.tableTop,
        layout.tableRight,
        layout.headerBottom,
        layout.shellRadius,
        "header-band"
      );

      rows.forEach(row => {
        addRect(
          svg,
          layout.tableLeft,
          row.top,
          layout.tableRight,
          row.bottom,
          layout.shellRadius,
          row.alternate ? "row-band alt" : "row-band"
        );
      });

      rows.forEach(row => {
        addRect(
          svg,
          layout.tableLeft,
          row.top,
          layout.railRight,
          row.bottom,
          layout.shellRadius,
          row.accent
        );
      });

      addLine(
        svg,
        layout.formDividerX,
        layout.tableTop,
        layout.formDividerX,
        layout.tableBottom,
        "rule",
        layout.lineWidth
      );

      addLine(
        svg,
        layout.signalDividerX,
        layout.tableTop,
        layout.signalDividerX,
        layout.tableBottom,
        "rule",
        layout.lineWidth
      );

      addLine(
        svg,
        layout.tableLeft,
        layout.headerBottom,
        layout.tableRight,
        layout.headerBottom,
        "rule strong",
        layout.strongLineWidth
      );

      rows.forEach(row => {
        if (row.bottom !== layout.tableBottom) {
          addLine(
            svg,
            layout.tableLeft,
            row.bottom,
            layout.tableRight,
            row.bottom,
            "rule",
            layout.lineWidth
          );
        }
      });

      addText(
        svg,
        "ФОРМА ВЫПОЛНЕНИЯ",
        layout.headerFormX,
        layout.headerTextY,
        "header-label",
        "start"
      );

      addText(
        svg,
        "ОБЯЗАТЕЛЬНЫЕ СИГНАЛЫ",
        layout.headerSignalX,
        layout.headerTextY,
        "header-label",
        "start"
      );

      addText(
        svg,
        "ЧТО ОНИ ЛОКАЛИЗУЮТ",
        layout.headerDetailX,
        layout.headerTextY,
        "header-label",
        "start"
      );

      rows.forEach(row => {
        const icon = make(
          "circle",
          {
            cx: sx(layout.iconX),
            cy: sy(row.center),
            r: sx(layout.iconRadius) - sx(layout.zero)
          },
          `row-icon ${row.accent}`
        );
        svg.appendChild(icon);

        addText(
          svg,
          row.symbol,
          layout.iconX,
          row.center + layout.iconBaselineShift,
          "row-symbol",
          "middle"
        );

        addText(
          svg,
          row.form,
          layout.formTextX,
          row.center + layout.textBaselineShift,
          "form-label",
          "start"
        );

        row.chips.forEach(chip => {
          const pill = addRect(
            svg,
            chip.left,
            row.center - layout.pillHalfHeight,
            chip.right,
            row.center + layout.pillHalfHeight,
            layout.pillRadius,
            "signal-pill"
          );
          pill.setAttribute("stroke-width", String(layout.lineWidth));

          addText(
            svg,
            chip.label,
            chip.left + layout.signalTextInset,
            row.center + layout.textBaselineShift,
            "signal-label",
            "start"
          );
        });

        addText(
          svg,
          row.detail,
          layout.detailTextX,
          row.center + layout.textBaselineShift,
          "detail-label",
          "start"
        );
      });

      const outline = addRect(
        svg,
        layout.tableLeft,
        layout.tableTop,
        layout.tableRight,
        layout.tableBottom,
        layout.shellRadius,
        "table-shell"
      );
      outline.setAttribute("fill", "none");
      outline.setAttribute("stroke-width", String(layout.lineWidth));
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      svg.hidden = true;
      fallback.hidden = false;
      fallback.textContent =
        "Схема должна была показать таблицу из шести форм выполнения: HTTP-логи и OTel для запроса и ответа; первый токен и чанки для потока; чекпоинты для надёжного выполнения; глубину, перцентили и DLQ для очереди; задержку до старта для события; пропуски и длительность запусков для расписания.";
    }
  </script>
</body>
</html>
