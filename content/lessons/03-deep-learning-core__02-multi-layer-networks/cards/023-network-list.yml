- concept: порядок слоёв задаёт порядок композиции преобразований сети
  question: Почему одного набора слоёв недостаточно для определения последовательной нейросети без указания их порядка?
  explanation: 'Список слоёв должен быть упорядоченным: прямой проход применяет преобразования именно в записанной последовательности. Поэтому одинаковые слои в другом порядке не обязаны задавать ту же сеть и могут вообще не состыковаться.'
  kind: open
  reference: Сеть вычисляет композицию преобразований слоёв. Порядок определяет, какое преобразование выполняется раньше и какой результат получает следующий слой; перестановка слоёв обычно меняет вычисляемую функцию или делает размеры несовместимыми.
  id: 023-network-list-2
