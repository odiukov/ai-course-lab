- concept: матрично-векторная запись одновременно вычисляет предактивации всех нейронов слоя
  question: Заполни формулу для одновременного вычисления вектора предактиваций всего слоя.
  explanation: Умножение W на x одновременно формирует взвешенные суммы всех нейронов, а прибавление вектора b добавляет к каждой сумме соответствующее смещение.
  kind: cloze
  template: z = ___
  answer: Wx + b
  accept:
    - W x + b
    - W*x+b
    - W @ x + b
  id: 015-linear-step-1
  fingerprint: bc9266cc
- concept: смещение позволяет получить ненулевую предактивацию при нулевом входе
  question: Почему изменение весов W не может в общем случае заменить смещение b, если состав входного вектора не меняется?
  explanation: Веса управляют влиянием входных признаков, но без смещения результат линейного преобразования при нулевом входе всегда нулевой. Вектор b превращает его в аффинное преобразование и задаёт независимый сдвиг.
  kind: open
  reference: При нулевом входе произведение Wx равно нулевому вектору при любых весах. Смещение позволяет получить z = b и тем самым сдвигает преобразование независимо от входа.
  id: 015-linear-step-2
  fingerprint: 9e44208c
