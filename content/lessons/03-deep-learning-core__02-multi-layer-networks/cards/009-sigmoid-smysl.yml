- concept: значение сигмоиды вычисляется подстановкой предактивации в её формулу
  question: Чему равна сигмоида для предактивации z = ln(3)?
  explanation: Поскольку e^(−ln(3)) = 1/3, получаем σ(z) = 1 / (1 + 1/3) = 0,75.
  kind: numeric
  answer: 0.75
  tolerance: 0.001
  id: 009-sigmoid-smysl-1
  fingerprint: 7ec1e01e
- concept: при уменьшении предактивации сигмоида приближается к нижней границе своего диапазона, но не достигает её
  question: Что происходит с выходом сигмоиды, когда предактивация становится всё более отрицательной?
  explanation: Сигмоида всегда выдаёт значение строго между 0 и 1. При больших отрицательных значениях её выход становится сколь угодно близким к 0, но не достигает его.
  kind: choice
  options:
    - Выход приближается к нижней границе диапазона, оставаясь выше неё
    - Выход неограниченно уходит в отрицательную область
    - Выход приближается к верхней границе диапазона
    - Выход перестаёт зависеть от предактивации и остаётся в середине диапазона
  correct: 0
  id: 009-sigmoid-smysl-2
  fingerprint: bf734e04
- concept: гладкость сигмоиды даёт градиентный сигнал для настройки параметров нейрона
  question: Почему сигмоида лучше жёсткой пороговой функции подходит для обучения нейрона методом градиентного спуска?
  explanation: Для градиентного обучения нужно знать, как малое изменение параметров влияет на результат. Гладкая сигмоида передаёт такой сигнал, тогда как жёсткая ступенька почти везде его не даёт.
  kind: open
  reference: Сигмоида изменяется плавно и имеет производную, поэтому небольшое изменение входа приводит к вычислимому изменению выхода. Этот градиент позволяет определить, как корректировать веса и смещение. У жёсткого порога выход скачет, а производная почти везде равна нулю.
  id: 009-sigmoid-smysl-3
  fingerprint: 8106f32e
