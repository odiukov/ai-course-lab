- concept: универсальное приближение непрерывной функции сетью с одним достаточно широким скрытым слоем
  question: Какое утверждение корректно передаёт теорему об универсальном приближении?
  explanation: Теорема утверждает существование сети нужной ширины и подходящих параметров для сколь угодно точного приближения непрерывной функции на ограниченной области. Точное совпадение и фиксированная ширина не гарантируются.
  kind: choice
  options:
    - Сеть фиксированной ширины может точно воспроизвести любую функцию на всей области действительных чисел
    - Для любой непрерывной функции на ограниченной области и любого положительного допуска существует сеть с одним достаточно широким скрытым слоем, ошибка которой меньше этого допуска
    - Любая сеть с одним скрытым слоем автоматически приближает заданную функцию без настройки параметров
  correct: 1
  id: 037-universal-approximation-1
  fingerprint: 23d0548b
- concept: теорема универсального приближения не гарантирует лёгкость обучения и практическую эффективность архитектуры
  question: Почему из теоремы об универсальном приближении не следует, что сеть с одним скрытым слоем легко обучить?
  explanation: Утверждение о выразительности архитектуры не является утверждением об оптимизации. Подходящая сеть может существовать, но оказаться чрезвычайно широкой, а поиск её параметров — трудным.
  kind: open
  reference: Теорема гарантирует лишь существование достаточного числа нейронов и подходящих значений весов и смещений. Она не указывает необходимую ширину, не даёт способа найти параметры и не обещает, что алгоритм обучения успешно их найдёт.
  id: 037-universal-approximation-2
  fingerprint: fc57857a
