- concept: скрытый нейрон последовательно выполняет взвешивание, добавление смещения и активацию
  question: Расположите операции скрытого нейрона в порядке их выполнения при прямом проходе.
  explanation: Скрытый нейрон сначала получает входные значения, вычисляет их взвешенную сумму, добавляет смещение и только затем применяет функцию активации.
  kind: order
  items:
    - Получить выходы предыдущего слоя
    - Умножить полученные значения на соответствующие веса и сложить
    - Добавить смещение
    - Пропустить результат через функцию активации
  id: 003-tipy-sloev-2
  fingerprint: 6b720c7e
- concept: скрытые состояния являются внутренними вычисляемыми представлениями
  question: Почему промежуточные значения нейронной сети называют скрытыми состояниями?
  explanation: Скрытые состояния возникают во время прямого прохода как внутренние представления данных. Сеть учится формировать их сама, изменяя веса и смещения.
  kind: open
  reference: 'Они вычисляются внутри сети и не представлены напрямую в обучающих данных: набор данных содержит исходные признаки и целевые ответы, но не задаёт готовые значения внутренних нейронов.'
