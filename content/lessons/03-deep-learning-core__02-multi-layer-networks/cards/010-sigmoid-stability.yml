- concept: аргумент сигмоиды ограничивают до вычисления экспоненты
  question: Заполни выражение так, чтобы предактивация была ограничена симметричным диапазоном от `-limit` до `limit` перед вычислением сигмоиды.
  explanation: 'Ограничивать нужно сам аргумент до вызова `math.exp`: иначе опасная экспонента уже успеет переполниться. В реализации урока границами служат -500 и 500.'
  kind: cloze
  template: z_safe = ___
  answer: max(-limit, min(limit, z))
  accept:
    - min(limit, max(-limit, z))
  id: 010-sigmoid-stability-1
  fingerprint: 78e96051
- concept: насыщение сигмоиды делает ограничение экстремальных аргументов практически без потери результата
  question: Объясни своими словами, почему замена очень больших по модулю аргументов сигмоиды конечными граничными значениями защищает вычисление, но практически не меняет выход функции.
  explanation: Для больших положительных аргументов сигмоида практически равна 1, а для больших отрицательных — практически равна 0. Поэтому sigmoid(500) и sigmoid(1000) в обычном `float` неразличимы, но ограничение не позволяет вычислять переполняющееся экспоненциальное значение.
  kind: open
  reference: 'На краях сигмоида насыщается: при большом положительном аргументе её значение уже почти равно верхней границе диапазона, а при большом отрицательном — нижней. Поэтому дальнейшее увеличение модуля почти не влияет на выход, хотя экспонента внутри формулы может переполниться.'
  id: 010-sigmoid-stability-2
  fingerprint: 56fc361f
