- concept: сеть с заранее подобранными параметрами может выполнять прямой проход без предварительного обучения
  question: Нужно ли обучать нейросеть перед первым прямым проходом, если все её веса и смещения уже подобраны вручную? Объясни своими словами.
  explanation: В сети XOR параметры подобраны вручную так, чтобы скрытые нейроны приближали OR и NAND, а выходной — AND. Поэтому прямой проход сразу даёт нужное мягкое предсказание.
  kind: open
  reference: Нет. Заданные веса, смещения, архитектура и функции активации полностью определяют вычисление сети, поэтому она сразу готова к прямому проходу. Обучение понадобилось бы для поиска или изменения этих параметров.
  id: 033-code-xor-forward-2
  fingerprint: fc28cb51
