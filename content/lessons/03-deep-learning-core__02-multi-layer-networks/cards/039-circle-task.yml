- concept: составная нелинейная граница решения возникает при объединении нескольких скрытых признаков
  question: Объясни своими словами, как сеть со скрытым слоем и нелинейными активациями может отделить внутренность круга от внешней области.
  explanation: В архитектуре из материала 8 скрытых нейронов создают несколько промежуточных признаков, а выходной нейрон объединяет их. После обучения такая композиция способна приблизить окружность, хотя отдельные аффинные разделители остаются прямыми.
  kind: open
  reference: Скрытые нейроны формируют признаки, чувствительные к разным направлениям и участкам плоскости. После нелинейных активаций выходной нейрон объединяет эти признаки, поэтому общая граница может состоять из нескольких участков и приближать замкнутую кривую.
