- concept: качество классификатора на несбалансированных классах оценивают относительно базовой стратегии большинства
  question: В выборке большинство точек относится к внешнему классу, а модель показывает высокую accuracy. Какая проверка лучше всего покажет, выучила ли модель полезное правило?
  explanation: В материале постоянный ответ 0 уже даёт 165 правильных ответов из 200, то есть 82.5%. Поэтому такая же accuracy у случайной сети не свидетельствует о распознавании круга.
  kind: choice
  options:
    - Сравнить accuracy со стратегией, которая всегда предсказывает наиболее частый класс
    - Проверить, одинаковы ли все начальные веса скрытого слоя
    - Увеличить порог классификации и оставить только итоговую accuracy
    - Сравнить число входных координат с числом выходных нейронов
