- concept: линейная неразделимость означает невозможность безошибочно разделить классы линейной границей
  question: Объясни своими словами, что означает линейная неразделимость размеченного набора данных.
  explanation: Линейная неразделимость — свойство расположения классов. Перемещение и поворот линейной границы не дают безошибочного разделения такого набора.
