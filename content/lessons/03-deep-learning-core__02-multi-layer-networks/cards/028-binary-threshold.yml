- concept: равенство порогу разрешается выбранным оператором сравнения
  question: 'Классификатор использует правило: `label = "positive" if score >= cutoff else "negative"`. Какую метку он выдаст, если `score` точно равен `cutoff`?'
  explanation: Оператор `>=` включает точку границы в положительный класс. Поэтому при пороге 0.5 выход, равный 0.5, превращается в метку 1.
  kind: choice
  options:
    - '`positive`'
    - '`negative`'
    - Результат не определён
  correct: 0
  id: 028-binary-threshold-1
  fingerprint: 02fee305
- concept: жёсткая пороговая метка теряет информацию о величине мягкого выхода
  question: Два объекта после пороговой классификации получили одинаковую положительную метку. Можно ли только по этим меткам определить, у какого объекта мягкий выход сигмоиды был больше? Объясни своими словами.
  explanation: Порог сохраняет лишь сторону границы, на которой оказался выход. Например, 0.83 превращается в 1, но сама метка уже не сообщает, насколько далеко мягкий выход находился от порога 0.5.
  kind: open
  reference: Нет. Разные выходы сигмоиды могут находиться по одну сторону порога и потому превращаться в одинаковую метку. После порогового преобразования исходные величины восстановить нельзя.
  id: 028-binary-threshold-2
  fingerprint: d9fc71df
