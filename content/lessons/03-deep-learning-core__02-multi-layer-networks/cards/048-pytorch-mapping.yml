- concept: модули PyTorch инкапсулируют те же операции, что и самостоятельно реализованные компоненты нейросети
  question: Объясните своими словами, каким самостоятельно реализованным компонентам соответствуют nn.Linear, nn.Sigmoid и nn.Sequential.
  explanation: В модели из урока nn.Linear хранит матрицу весов и вектор смещений, nn.Sigmoid применяет нелинейность к каждому элементу, а nn.Sequential упаковывает их в единый прямой проход.
  kind: open
  reference: nn.Linear выполняет аффинное преобразование с обучаемыми весами и смещениями, nn.Sigmoid поэлементно применяет сигмоиду, а nn.Sequential последовательно передаёт результат каждого модуля следующему.
  id: 048-pytorch-mapping-1
  fingerprint: c7b5aa4d
- concept: полносвязные модули изменяют размерность признаков, сохраняя размер батча
  question: Модель состоит из nn.Linear(6, 7), nn.Sigmoid() и nn.Linear(7, 3). Какую форму получит выход для входного батча формы (5, 6)?
  explanation: Модули обрабатывают все объекты батча одинаково, поэтому размер батча 5 сохраняется. Последний nn.Linear выдаёт по 3 признака для каждого объекта, откуда форма (5, 3). В уроке по той же причине вход формы (4, 2) превращается в выход формы (4, 1).
  kind: choice
  options:
    - (5, 3)
    - (7, 3)
    - (5, 7)
    - (3, 5)
