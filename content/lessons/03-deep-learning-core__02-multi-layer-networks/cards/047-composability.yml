- concept: целую нейросеть можно использовать как компонент по её внешнему интерфейсу независимо от внутреннего устройства
  question: Одна модель преобразует аудиосигнал в тензор объявленного формата, а другая принимает этот формат и генерирует текст. Почему их можно включить в единую систему, даже если их внутренние архитектуры различаются?
  explanation: Целую модель можно рассматривать как один компонент с определёнными входом и выходом. Если следующий компонент умеет принять результат предыдущего, их прямые проходы образуют общую цепочку.
  kind: open
  reference: 'Для композиции важны внешние интерфейсы моделей: формат выхода первой модели должен соответствовать формату входа второй. Их внутренние слои и архитектуры при этом могут различаться.'
  id: 047-composability-1
  fingerprint: b098e4c6
- concept: нейросетевые модели можно соединять параллельными ветвями при совместимости интерфейсов в точке объединения
  question: Один вход нужно обработать моделями A и B параллельно, а их результаты передать модели C. Какое условие делает такую композицию корректной?
  explanation: Параллельные ветви могут быть устроены по-разному и выдавать разные признаки. Важно, чтобы каждая ветвь принимала предназначенные ей данные, а способ объединения их результатов формировал корректный вход для следующей модели.
  kind: choice
  options:
    - A и B принимают исходный вход, а объединённые результаты соответствуют входному интерфейсу C
    - A, B и C содержат одинаковое количество внутренних слоёв
    - Все модели обучались одним и тем же оптимизатором
    - A и B обязательно возвращают одинаковые значения
  correct: 0
  id: 047-composability-2
  fingerprint: 962ca274
