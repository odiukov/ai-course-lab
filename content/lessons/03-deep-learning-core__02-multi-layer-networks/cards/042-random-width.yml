- concept: эффект ширины сети следует оценивать по нескольким случайным инициализациям
  question: Объясни своими словами, как проверить, связано ли наблюдаемое изменение распределения выходов с шириной скрытого слоя, а не с удачной или неудачной случайной инициализацией.
  explanation: Один набор случайных весов смешивает эффект архитектуры со случайностью конкретной инициализации. Повторные запуски позволяют оценить типичный результат и его разброс для каждой ширины.
  kind: open
  reference: Для каждой сравниваемой ширины нужно выполнить несколько независимых инициализаций при одинаковых данных и одной схеме генерации весов, а затем сравнить распределения или сводные статистики результатов по запускам.
