- concept: смещение регулирует величину суммарного входного сигнала, необходимую для активации нейрона
  question: Объясни, почему при фиксированных положительных весах более отрицательное смещение делает сигмоидальный нейрон труднее активируемым.
  explanation: 'При весах 20 и 20 смещение −10 позволяет скрытому нейрону приблизить OR: достаточно одного активного входа. Смещение −30 у выходного нейрона требует, чтобы высокими были оба скрытых признака, и тем самым приближает AND.'
  kind: open
  reference: Смещение входит в предактивацию как слагаемое. Чем оно отрицательнее, тем большей должна быть положительная взвешенная сумма входов, чтобы предактивация стала положительной и сигмоида выдала высокий ответ.
