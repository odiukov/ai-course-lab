- concept: повторная случайная инициализация сохраняет архитектуру и формы параметров, но меняет их начальные значения
  question: Полносвязную нейросеть создали повторно с той же архитектурой, но заново случайно инициализировали параметры. Что гарантированно останется прежним?
  explanation: Архитектура фиксирует число слоёв, их размерности и связи, поэтому формы параметров сохраняются. Новая инициализация заполняет эти формы другими значениями, из-за чего выходы и качество могут измениться.
  kind: choice
  options:
    - Размерности слоёв и схема связей между ними
    - Все веса и смещения
    - Выходы сети для каждого входа
    - Качество классификации
  correct: 0
  id: 040-init-network-design-1
  fingerprint: 2d5db207
- concept: возможность выполнить прямой проход после инициализации не означает, что сеть усвоила целевую зависимость
  question: Почему нейросеть со случайно инициализированными параметрами уже может выполнить прямой проход, но это ещё не доказывает, что она научилась классифицировать точки относительно окружности?
  explanation: Для вычисления выхода достаточно, чтобы все параметры имели численные значения. Знание задачи появляется лишь тогда, когда эти значения настроены по данным, поэтому технически работающая сеть может оставаться бесполезным классификатором.
  kind: open
  reference: Инициализация присваивает весам и смещениям конкретные значения, поэтому все операции прямого прохода становятся вычислимыми. Однако случайные значения не были подобраны по обучающим данным и не кодируют правило принадлежности окружности; полезную зависимость параметры приобретают при обучении.
  id: 040-init-network-design-2
