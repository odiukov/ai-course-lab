- concept: преимущество глубины по числу параметров зависит от структуры представляемой функции
  question: Объясни своими словами, почему добавление слоёв может уменьшить необходимое число параметров, но не гарантирует этого для любой функции.
  explanation: Теорема универсального приближения утверждает возможность приближения функции достаточно широкой сетью, но ничего не обещает о компактности конкретного представления. Экономия от глубины возникает у функций, чья композиционная структура допускает переиспользование промежуточных результатов.
  kind: open
  reference: 'Глубина помогает, когда функцию можно представить как композицию повторно используемых промежуточных вычислений: разные части сети используют уже найденные признаки вместо их повторного построения. Если такой структуры нет или архитектура выбрана неудачно, дополнительные слои сами по себе не обеспечивают компактность.'
