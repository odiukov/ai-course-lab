<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Полносвязная сеть 2–3–1</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f9fc;
      --panel: #ffffff;
      --panel-soft: #eef3f9;
      --ink: #172033;
      --muted: #596579;
      --border: #cbd5e1;
      --input-one: #2563eb;
      --input-two: #0891b2;
      --hidden: #7c3aed;
      --output: #db2777;
      --input-node: #dbeafe;
      --hidden-node: #ede9fe;
      --output-node: #fce7f3;
      --white: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #0f172a;
        --panel: #172033;
        --panel-soft: #202b40;
        --ink: #f3f6fb;
        --muted: #bdc7d6;
        --border: #475569;
        --input-one: #60a5fa;
        --input-two: #22d3ee;
        --hidden: #a78bfa;
        --output: #f472b6;
        --input-node: #183861;
        --hidden-node: #35265e;
        --output-node: #5b2445;
        --white: #ffffff;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    figure,
    header,
    h1,
    p {
      margin: unset;
    }

    figure {
      background: var(--panel);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    header {
      background: var(--panel-soft);
      border-bottom: 1px solid var(--border);
      text-align: center;
    }

    h1 {
      font-size: 20px;
      font-weight: bold;
    }

    header p {
      color: var(--muted);
      font-size: 14px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 430px;
      background: var(--panel);
    }

    .layer-panel {
      fill: var(--panel-soft);
      stroke: var(--border);
      stroke-width: 1px;
    }

    .layer-title {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
      text-anchor: middle;
    }

    .layer-count {
      fill: var(--muted);
      font-size: 13px;
      text-anchor: middle;
    }

    .connection {
      fill: none;
      stroke-width: 2px;
      stroke-linecap: round;
    }

    .connection.input-one,
    .arrow.input-one {
      stroke: var(--input-one);
    }

    .connection.input-two,
    .arrow.input-two {
      stroke: var(--input-two);
    }

    .connection.hidden-output,
    .arrow.hidden-output {
      stroke: var(--hidden);
    }

    .arrow {
      fill: none;
      stroke-width: 2px;
      stroke-linecap: round;
    }

    .node {
      stroke-width: 2px;
    }

    .node.input-one {
      fill: var(--input-node);
      stroke: var(--input-one);
    }

    .node.input-two {
      fill: var(--input-node);
      stroke: var(--input-two);
    }

    .node.hidden {
      fill: var(--hidden-node);
      stroke: var(--hidden);
    }

    .node.output {
      fill: var(--output-node);
      stroke: var(--output);
    }

    .node-label {
      fill: var(--ink);
      font-size: 18px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .node-role {
      fill: var(--muted);
      font-size: 12px;
      text-anchor: middle;
    }

    .transition {
      fill: var(--panel);
      stroke-width: 2px;
    }

    .transition.first {
      stroke: var(--input-one);
    }

    .transition.second {
      stroke: var(--hidden);
    }

    .transition-text {
      fill: var(--ink);
      font-size: 13px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .legend-text {
      fill: var(--muted);
      font-size: 12px;
      dominant-baseline: middle;
    }

    .legend-line {
      stroke-width: 3px;
      stroke-linecap: round;
    }

    .legend-line.input-one {
      stroke: var(--input-one);
    }

    .legend-line.input-two {
      stroke: var(--input-two);
    }

    .fallback {
      fill: var(--ink);
      font-size: 18px;
      text-anchor: middle;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title diagram-summary">
    <header>
      <h1 id="diagram-title">Полносвязная сеть 2–3–1</h1>
      <p id="diagram-summary">Ширина слоёв и все связи между соседними слоями</p>
    </header>

    <svg
      id="network"
      viewBox="0 0 960 430"
      width="960"
      height="430"
      role="img"
      aria-labelledby="svg-title svg-description"
    >
      <title id="svg-title">Схема полносвязной нейронной сети 2–3–1</title>
      <desc id="svg-description">
        Два входа полностью соединены с тремя скрытыми нейронами,
        а три скрытых нейрона соединены с одним выходом.
      </desc>
    </svg>
  </figure>

  <script>
    const diagram = Object.freeze({
      zero: 0,
      canvas: { left: 0, top: 0, right: 960, bottom: 430 },
      panels: [
        {
          key: "input",
          x1: 48,
          x2: 244,
          y1: 35,
          y2: 352,
          titleX: 146,
          titleY: 60,
          countX: 146,
          countY: 82,
          title: "Входной слой",
          count: "2 входа"
        },
        {
          key: "hidden",
          x1: 350,
          x2: 576,
          y1: 35,
          y2: 352,
          titleX: 463,
          titleY: 60,
          countX: 463,
          countY: 82,
          title: "Скрытый слой",
          count: "3 нейрона"
        },
        {
          key: "output",
          x1: 714,
          x2: 912,
          y1: 35,
          y2: 352,
          titleX: 813,
          titleY: 60,
          countX: 813,
          countY: 82,
          title: "Выходной слой",
          count: "1 нейрон"
        }
      ],
      nodes: [
        {
          id: "x₁",
          kind: "input-one",
          x: 146,
          y: 145,
          r: 29,
          edgeLeft: 117,
          edgeRight: 175,
          roleX: 146,
          roleY: 188,
          role: "первый вход"
        },
        {
          id: "x₂",
          kind: "input-two",
          x: 146,
          y: 275,
          r: 29,
          edgeLeft: 117,
          edgeRight: 175,
          roleX: 146,
          roleY: 318,
          role: "второй вход"
        },
        {
          id: "h₁",
          kind: "hidden",
          x: 463,
          y: 120,
          r: 29,
          edgeLeft: 434,
          edgeRight: 492,
          roleX: 463,
          roleY: 158,
          role: "обрабатывает x₁ и x₂"
        },
        {
          id: "h₂",
          kind: "hidden",
          x: 463,
          y: 210,
          r: 29,
          edgeLeft: 434,
          edgeRight: 492,
          roleX: 463,
          roleY: 248,
          role: "обрабатывает x₁ и x₂"
        },
        {
          id: "h₃",
          kind: "hidden",
          x: 463,
          y: 300,
          r: 29,
          edgeLeft: 434,
          edgeRight: 492,
          roleX: 463,
          roleY: 338,
          role: "обрабатывает x₁ и x₂"
        },
        {
          id: "y",
          kind: "output",
          x: 813,
          y: 210,
          r: 31,
          edgeLeft: 782,
          edgeRight: 844,
          roleX: 813,
          roleY: 255,
          role: "общий ответ"
        }
      ],
      connections: [
        { from: "x₁", to: "h₁", kind: "input-one" },
        { from: "x₁", to: "h₂", kind: "input-one" },
        { from: "x₁", to: "h₃", kind: "input-one" },
        { from: "x₂", to: "h₁", kind: "input-two" },
        { from: "x₂", to: "h₂", kind: "input-two" },
        { from: "x₂", to: "h₃", kind: "input-two" },
        { from: "h₁", to: "y", kind: "hidden-output" },
        { from: "h₂", to: "y", kind: "hidden-output" },
        { from: "h₃", to: "y", kind: "hidden-output" }
      ],
      arrows: {
        back: 10,
        spread: 5
      },
      transitions: [
        {
          x: 300,
          y: 389,
          rx: 54,
          ry: 17,
          kind: "first",
          label: "2 → 3 · 6 связей"
        },
        {
          x: 651,
          y: 389,
          rx: 54,
          ry: 17,
          kind: "second",
          label: "3 → 1 · 3 связи"
        }
      ],
      legends: [
        {
          x1: 62,
          x2: 88,
          y: 389,
          textX: 98,
          textY: 389,
          kind: "input-one",
          text: "линии от x₁"
        },
        {
          x1: 762,
          x2: 788,
          y: 389,
          textX: 798,
          textY: 389,
          kind: "input-two",
          text: "линии от x₂"
        }
      ],
      fallback: {
        x: 480,
        y: 205,
        text:
          "Сеть 2–3–1: 2 входа соединены с 3 скрытыми нейронами, затем с 1 выходом."
      }
    });

    const origin = Object.freeze({ x: 0, y: 0 });
    const scale = Object.freeze({ x: 1, y: 1 });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("network");
      const namespace = "http://www.w3.org/2000/svg";
      const nodeById = new Map(diagram.nodes.map(node => [node.id, node]));

      const make = (name, attributes, text) => {
        const element = document.createElementNS(namespace, name);
        Object.entries(attributes).forEach(([key, value]) => {
          element.setAttribute(key, String(value));
        });
        if (text !== undefined) {
          element.textContent = text;
        }
        return element;
      };

      const panelGroup = make("g", { "aria-hidden": "true" });
      diagram.panels.forEach(panel => {
        panelGroup.append(
          make("rect", {
            class: "layer-panel",
            x: sx(panel.x1),
            y: sy(panel.y1),
            width: sx(panel.x2) - sx(panel.x1),
            height: sy(panel.y2) - sy(panel.y1),
            rx: sx(diagram.arrows.back) - sx(diagram.zero),
            ry: sy(diagram.arrows.back) - sy(diagram.zero)
          }),
          make(
            "text",
            {
              class: "layer-title",
              x: sx(panel.titleX),
              y: sy(panel.titleY)
            },
            panel.title
          ),
          make(
            "text",
            {
              class: "layer-count",
              x: sx(panel.countX),
              y: sy(panel.countY)
            },
            panel.count
          )
        );
      });
      svg.append(panelGroup);

      const connectionGroup = make("g", {
        "aria-label": "Полные связи между соседними слоями"
      });

      diagram.connections.forEach(connection => {
        const from = nodeById.get(connection.from);
        const to = nodeById.get(connection.to);
        const tipX = to.edgeLeft;
        const tipY = to.y;

        connectionGroup.append(
          make("line", {
            class: `connection ${connection.kind}`,
            x1: sx(from.edgeRight),
            y1: sy(from.y),
            x2: sx(tipX),
            y2: sy(tipY)
          }),
          make("line", {
            class: `arrow ${connection.kind}`,
            x1: sx(tipX),
            y1: sy(tipY),
            x2: sx(tipX - diagram.arrows.back),
            y2: sy(tipY - diagram.arrows.spread)
          }),
          make("line", {
            class: `arrow ${connection.kind}`,
            x1: sx(tipX),
            y1: sy(tipY),
            x2: sx(tipX - diagram.arrows.back),
            y2: sy(tipY + diagram.arrows.spread)
          })
        );
      });
      svg.append(connectionGroup);

      const nodeGroup = make("g", { "aria-label": "Узлы сети" });
      diagram.nodes.forEach(node => {
        nodeGroup.append(
          make("circle", {
            class: `node ${node.kind}`,
            cx: sx(node.x),
            cy: sy(node.y),
            r: sx(node.r) - sx(diagram.zero)
          }),
          make(
            "text",
            {
              class: "node-label",
              x: sx(node.x),
              y: sy(node.y)
            },
            node.id
          ),
          make(
            "text",
            {
              class: "node-role",
              x: sx(node.roleX),
              y: sy(node.roleY)
            },
            node.role
          )
        );
      });
      svg.append(nodeGroup);

      const footerGroup = make("g", {
        "aria-label": "Количество связей в переходах"
      });

      diagram.transitions.forEach(transition => {
        footerGroup.append(
          make("rect", {
            class: `transition ${transition.kind}`,
            x: sx(transition.x - transition.rx),
            y: sy(transition.y - transition.ry),
            width:
              sx(transition.x + transition.rx) -
              sx(transition.x - transition.rx),
            height:
              sy(transition.y + transition.ry) -
              sy(transition.y - transition.ry),
            rx: sx(transition.ry) - sx(diagram.zero),
            ry: sy(transition.ry) - sy(diagram.zero)
          }),
          make(
            "text",
            {
              class: "transition-text",
              x: sx(transition.x),
              y: sy(transition.y)
            },
            transition.label
          )
        );
      });

      diagram.legends.forEach(legend => {
        footerGroup.append(
          make("line", {
            class: `legend-line ${legend.kind}`,
            x1: sx(legend.x1),
            y1: sy(legend.y),
            x2: sx(legend.x2),
            y2: sy(legend.y)
          }),
          make(
            "text",
            {
              class: "legend-text",
              x: sx(legend.textX),
              y: sy(legend.textY),
              "text-anchor": "start"
            },
            legend.text
          )
        );
      });
      svg.append(footerGroup);
    } catch (error) {
      const svg = document.getElementById("network");
      const namespace = "http://www.w3.org/2000/svg";
      const fallback = document.createElementNS(namespace, "text");
      fallback.setAttribute("class", "fallback");
      fallback.setAttribute("x", String(sx(diagram.fallback.x)));
      fallback.setAttribute("y", String(sy(diagram.fallback.y)));
      fallback.textContent = diagram.fallback.text;
      svg.append(fallback);
    }
  </script>
</body>
</html>
