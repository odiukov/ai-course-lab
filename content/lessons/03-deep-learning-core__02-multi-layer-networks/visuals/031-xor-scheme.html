<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Подобранные вручную веса сети XOR</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fc;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #5c667a;
      --line: #78859d;
      --positive: #1976d2;
      --positive-fill: #e5f1ff;
      --negative: #c23b53;
      --negative-fill: #ffe8ed;
      --output: #7a4bb7;
      --output-fill: #f1e9ff;
      --result: #18794e;
      --result-fill: #e3f7ed;
      --formula: #eef1f7;
      --border: #c9d0dc;
      --shadow: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111722;
        --panel: #171f2c;
        --ink: #eef3fb;
        --muted: #aeb8c9;
        --line: #8e9ab0;
        --positive: #74b8ff;
        --positive-fill: #173655;
        --negative: #ff879b;
        --negative-fill: #542431;
        --output: #c09aff;
        --output-fill: #382653;
        --result: #73d6a5;
        --result-fill: #173e31;
        --formula: #202a39;
        --border: #3d495c;
        --shadow: #171f2c;
      }
    }

    html,
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .figure {
      max-width: 1200px;
      background: var(--panel);
      border: 1px solid var(--border);
    }

    h1 {
      margin: 0;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 20px;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 460px;
      background: var(--panel);
    }

    .connection {
      fill: none;
      stroke: var(--line);
      stroke-width: 2px;
      stroke-linecap: round;
    }

    .arrow {
      fill: var(--line);
    }

    .input-node {
      fill: var(--panel);
      stroke: var(--line);
      stroke-width: 3px;
    }

    .or-node {
      fill: var(--positive-fill);
      stroke: var(--positive);
      stroke-width: 3px;
    }

    .nand-node {
      fill: var(--negative-fill);
      stroke: var(--negative);
      stroke-width: 3px;
    }

    .and-node {
      fill: var(--output-fill);
      stroke: var(--output);
      stroke-width: 3px;
    }

    .result-node {
      fill: var(--result-fill);
      stroke: var(--result);
      stroke-width: 3px;
    }

    .node-label {
      fill: var(--ink);
      font-size: 20px;
      font-weight: bold;
    }

    .input-label {
      fill: var(--ink);
      font-size: 21px;
      font-weight: bold;
    }

    .layer-label {
      fill: var(--muted);
      font-size: 16px;
      font-weight: bold;
    }

    .weight {
      fill: var(--ink);
      stroke: var(--shadow);
      stroke-width: 5px;
      paint-order: stroke fill;
      font-size: 17px;
      font-weight: bold;
    }

    .bias {
      fill: var(--muted);
      stroke: var(--shadow);
      stroke-width: 4px;
      paint-order: stroke fill;
      font-size: 15px;
      font-weight: bold;
    }

    .result-note {
      fill: var(--result);
      font-size: 15px;
      font-weight: bold;
    }

    .formula-band {
      fill: var(--formula);
      stroke: var(--border);
      stroke-width: 1px;
    }

    .formula {
      fill: var(--ink);
      font-size: 16px;
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
    }

    .fallback {
      fill: var(--ink);
      font-size: 18px;
    }
  </style>
</head>
<body>
  <main class="figure">
    <h1>Подобранные вручную веса сети XOR</h1>
    <svg
      id="diagram"
      width="1200"
      height="460"
      viewBox="0 0 1200 460"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description"
    >
      <title id="svg-title">Сеть XOR с архитектурой два — два — один</title>
      <desc id="svg-description">
        Два входа поступают в скрытые нейроны OR и NAND, а их ответы
        объединяет выходной нейрон AND.
      </desc>
      <g id="drawing"></g>
      <g id="fallback"></g>
    </svg>
  </main>

  <script>
    const DATA = {
      zero: 0,
      geometry: {
        arrowBack: 0.16,
        arrowSpread: 0.08,
        bandLeft: 0.25,
        bandRight: 12.55,
        bandTop: 0.78,
        bandBottom: 0.08,
        bandRound: 0.08
      },
      layers: [
        { x: 0.95, y: 4.55, text: "Входы" },
        { x: 4.45, y: 4.55, text: "Скрытые признаки" },
        { x: 7.85, y: 4.55, text: "Выход" },
        { x: 10.55, y: 4.55, text: "Результат" }
      ],
      nodes: [
        {
          x: 0.95, y: 3.3, r: 0.25,
          label: "x₁", className: "input-node",
          textClass: "input-label"
        },
        {
          x: 0.95, y: 1.7, r: 0.25,
          label: "x₂", className: "input-node",
          textClass: "input-label"
        },
        {
          x: 4.45, y: 3.4, r: 0.52,
          label: "OR", className: "or-node",
          textClass: "node-label"
        },
        {
          x: 4.45, y: 1.6, r: 0.52,
          label: "NAND", className: "nand-node",
          textClass: "node-label"
        },
        {
          x: 7.85, y: 2.5, r: 0.52,
          label: "AND", className: "and-node",
          textClass: "node-label"
        },
        {
          x: 10.55, y: 2.5, r: 0.47,
          label: "XOR", className: "result-node",
          textClass: "node-label"
        }
      ],
      edges: [
        {
          from: { x: 1.2, y: 3.3 },
          to: { x: 3.93, y: 3.4 },
          weight: "20",
          label: { x: 1.55, y: 3.67, dx: 0, dy: 0, anchor: "middle" }
        },
        {
          from: { x: 1.16, y: 3.16 },
          to: { x: 4.02, y: 1.91 },
          weight: "−20",
          label: { x: 1.65, y: 2.84, dx: 0, dy: 0, anchor: "middle" }
        },
        {
          from: { x: 1.16, y: 1.84 },
          to: { x: 4.02, y: 3.09 },
          weight: "20",
          label: { x: 1.65, y: 2.16, dx: 0, dy: 0, anchor: "middle" }
        },
        {
          from: { x: 1.2, y: 1.7 },
          to: { x: 3.93, y: 1.6 },
          weight: "−20",
          label: { x: 1.55, y: 1.33, dx: 0, dy: 0, anchor: "middle" }
        },
        {
          from: { x: 4.94, y: 3.23 },
          to: { x: 7.36, y: 2.67 },
          weight: "20",
          label: { x: 5.63, y: 3.26, dx: 0, dy: -6, anchor: "middle" }
        },
        {
          from: { x: 4.94, y: 1.77 },
          to: { x: 7.36, y: 2.33 },
          weight: "20",
          label: { x: 5.63, y: 1.74, dx: 0, dy: 6, anchor: "middle" }
        },
        {
          from: { x: 8.37, y: 2.5 },
          to: { x: 10.08, y: 2.5 },
          weight: "",
          label: { x: 8.62, y: 2.79, dx: 0, dy: 0, anchor: "start" }
        }
      ],
      annotations: [
        {
          x: 4.45, y: 4.08, dx: 0, dy: 0,
          anchor: "middle", text: "смещение −10", className: "bias"
        },
        {
          x: 4.45, y: 0.98, dx: 0, dy: 0,
          anchor: "middle", text: "смещение 30", className: "bias"
        },
        {
          x: 7.85, y: 3.25, dx: 0, dy: 0,
          anchor: "middle", text: "смещение −30", className: "bias"
        },
        {
          x: 10.55, y: 1.58, dx: 0, dy: 0,
          anchor: "middle",
          text: "высокий ответ: [0,1] и [1,0]",
          className: "result-note"
        }
      ],
      formulas: [
        {
          x: 0.47, y: 0.42,
          text: "OR: σ(20x₁ + 20x₂ − 10)"
        },
        {
          x: 4.5, y: 0.42,
          text: "NAND: σ(−20x₁ − 20x₂ + 30)"
        },
        {
          x: 8.65, y: 0.42,
          text: "AND: σ(20h₁ + 20h₂ − 30)"
        }
      ],
      fallback: {
        x: 0.48,
        y: 2.5,
        text:
          "Схема: входы x₁ и x₂ → OR [20,20], −10; NAND [−20,−20], 30 → AND [20,20], −30 → XOR."
      }
    };

    const origin = { x: 35, y: 440 };
    const scale = 90;

    function sx(x) {
      return origin.x + x * scale;
    }

    function sy(y) {
      return origin.y - y * scale;
    }

    try {
      const NS = "http://www.w3.org/2000/svg";
      const drawing = document.getElementById("drawing");
      const fallback = document.getElementById("fallback");

      function element(name, attributes, className) {
        const item = document.createElementNS(NS, name);

        Object.entries(attributes).forEach(([key, value]) => {
          item.setAttribute(key, String(value));
        });

        if (className) {
          item.setAttribute("class", className);
        }

        return item;
      }

      function addText(point, value, className, anchor, dx, dy) {
        const item = element(
          "text",
          {
            x: sx(point.x),
            y: sy(point.y),
            dx: dx,
            dy: dy,
            "text-anchor": anchor,
            "dominant-baseline": "middle"
          },
          className
        );

        item.textContent = value;
        drawing.appendChild(item);
        return item;
      }

      function arrowPoints(edge) {
        const vx = edge.to.x - edge.from.x;
        const vy = edge.to.y - edge.from.y;
        const length = Math.hypot(vx, vy);
        const ux = vx / length;
        const uy = vy / length;
        const baseX = edge.to.x - ux * DATA.geometry.arrowBack;
        const baseY = edge.to.y - uy * DATA.geometry.arrowBack;
        const sideX = -uy * DATA.geometry.arrowSpread;
        const sideY = ux * DATA.geometry.arrowSpread;

        return [
          { x: edge.to.x, y: edge.to.y },
          { x: baseX + sideX, y: baseY + sideY },
          { x: baseX - sideX, y: baseY - sideY }
        ];
      }

      const band = element(
        "rect",
        {
          x: sx(DATA.geometry.bandLeft),
          y: sy(DATA.geometry.bandTop),
          width:
            sx(DATA.geometry.bandRight) -
            sx(DATA.geometry.bandLeft),
          height:
            sy(DATA.geometry.bandBottom) -
            sy(DATA.geometry.bandTop),
          rx:
            sx(DATA.geometry.bandRound) -
            sx(DATA.zero)
        },
        "formula-band"
      );
      drawing.appendChild(band);

      DATA.edges.forEach((edge) => {
        drawing.appendChild(
          element(
            "line",
            {
              x1: sx(edge.from.x),
              y1: sy(edge.from.y),
              x2: sx(edge.to.x),
              y2: sy(edge.to.y)
            },
            "connection"
          )
        );

        const points = arrowPoints(edge)
          .map((point) => `${sx(point.x)},${sy(point.y)}`)
          .join(" ");

        drawing.appendChild(
          element("polygon", { points: points }, "arrow")
        );
      });

      DATA.nodes.forEach((node) => {
        drawing.appendChild(
          element(
            "circle",
            {
              cx: sx(node.x),
              cy: sy(node.y),
              r: Math.abs(sx(node.x + node.r) - sx(node.x))
            },
            node.className
          )
        );
      });

      DATA.layers.forEach((label) => {
        addText(
          { x: label.x, y: label.y },
          label.text,
          "layer-label",
          "middle",
          DATA.zero,
          DATA.zero
        );
      });

      DATA.edges.forEach((edge) => {
        if (edge.weight) {
          addText(
            { x: edge.label.x, y: edge.label.y },
            edge.weight,
            "weight",
            edge.label.anchor,
            edge.label.dx,
            edge.label.dy
          );
        }
      });

      DATA.nodes.forEach((node) => {
        addText(
          { x: node.x, y: node.y },
          node.label,
          node.textClass,
          "middle",
          DATA.zero,
          DATA.zero
        );
      });

      DATA.annotations.forEach((note) => {
        addText(
          { x: note.x, y: note.y },
          note.text,
          note.className,
          note.anchor,
          note.dx,
          note.dy
        );
      });

      DATA.formulas.forEach((formula) => {
        addText(
          { x: formula.x, y: formula.y },
          formula.text,
          "formula",
          "start",
          DATA.zero,
          DATA.zero
        );
      });

      fallback.replaceChildren();
    } catch (error) {
      const NS = "http://www.w3.org/2000/svg";
      const fallback = document.getElementById("fallback");
      const drawing = document.getElementById("drawing");
      drawing.replaceChildren();
      fallback.replaceChildren();

      const message = document.createElementNS(NS, "text");
      message.setAttribute("x", String(sx(DATA.fallback.x)));
      message.setAttribute("y", String(sy(DATA.fallback.y)));
      message.setAttribute("class", "fallback");
      message.setAttribute("text-anchor", "start");
      message.setAttribute("dominant-baseline", "middle");
      message.textContent = DATA.fallback.text;
      fallback.appendChild(message);
    }
  </script>
</body>
</html>
