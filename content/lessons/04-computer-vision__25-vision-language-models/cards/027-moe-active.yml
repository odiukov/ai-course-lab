- concept: MoE и dense-модель с одинаковым числом участвующих параметров имеют разную архитектуру и эксплуатационные издержки
  question: Объясни своими словами, почему MoE-модель нельзя считать эквивалентной dense-модели с таким же числом активных параметров на токен.
  explanation: Показатель active приближённо описывает объём полезных вычислений для токена, но не учитывает маршрутизацию и коммуникационные накладные расходы. Кроме того, полные веса всех экспертов приходится хранить и размещать в памяти.
  kind: open
  reference: У MoE только выбранные эксперты обрабатывают конкретный токен, но системе всё равно нужны маршрутизатор, полный набор экспертных весов и обмен данными между устройствами или экспертами. В dense-модели один и тот же набор весов используется для всех токенов без такого выбора, поэтому одинаковое число участвующих параметров не гарантирует одинаковую скорость, память и устройство вычислений.
  id: 027-moe-active-2
  fingerprint: 30ea8840
