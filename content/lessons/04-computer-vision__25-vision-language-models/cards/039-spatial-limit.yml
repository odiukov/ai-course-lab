- concept: отношения по удалённости от камеры следует оценивать моделью глубины
  question: Роботу нужно по одному изображению определить, какой из двух предметов расположен ближе к камере. Какой специализированный компонент наиболее уместен?
  explanation: Модель глубины оценивает относительную удалённость участков сцены и поэтому подходит для отношений «ближе», «дальше» и «перед». Обычная VLM может рассуждать о сцене, но не является надёжным измерителем глубины.
  kind: choice
  options:
    - Модель глубины
    - Детектор языка текста
    - Токенизатор LLM
    - Классификатор тональности
  correct: 0
