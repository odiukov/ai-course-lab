- concept: пространственную конфигурацию суставов и частей тела следует извлекать оценщиком ключевых точек или позы
  question: Приложению для анализа упражнений нужно точно определить положения локтей, коленей и плеч человека на кадре. Какую модель следует использовать для этого измерения?
  explanation: Оценщик позы возвращает координаты анатомических ключевых точек, по которым можно вычислять положение частей тела и углы суставов. VLM полезна для смыслового описания действия, но менее надёжна для точной локализации суставов.
  kind: choice
  options:
    - Оценщик ключевых точек или позы
    - Генеративную VLM без специализированного измерителя
    - Модель машинного перевода
    - Детектор спама
  correct: 0
