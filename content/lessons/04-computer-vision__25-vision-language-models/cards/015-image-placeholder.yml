- concept: число image-placeholder-токенов должно точно совпадать с числом визуальных токенов
  question: В одном элементе батча найдено 80 позиций с токеном `<image>`, а vision encoder и проектор выдали 81 визуальный токен. Как должен поступить корректный метод слияния?
  explanation: Каждому визуальному токену должна соответствовать ровно одна зарезервированная позиция. При разном количестве позиций и эмбеддингов однозначное сопоставление невозможно, поэтому молчаливое усечение или дополнение может нарушить связь изображения с последовательностью.
  kind: choice
  options:
    - Удалить последний визуальный токен и продолжить
    - Выдать ошибку до запуска LLM
    - Добавить нулевой текстовый эмбеддинг
    - Усреднить все визуальные токены по 80 позициям
  correct: 1
  id: 015-image-placeholder-1
  fingerprint: 6bfd809b
- concept: эмбеддинги image-placeholder-токенов заменяются визуальными эмбеддингами перед передачей последовательности в LLM
  question: Переменная `positions` содержит индексы всех `<image>`-токенов одного элемента батча. Чем нужно заменить пропуск, чтобы записать на эти позиции спроецированные эмбеддинги изображения?
  explanation: Идентификатор `<image>` сначала позволяет найти зарезервированные позиции в токенизированном промпте. Затем временные текстовые эмбеддинги на этих позициях заменяются соответствующими визуальными эмбеддингами той же ширины.
  kind: cloze
  template: out[b, positions] = ___
  answer: vision_embeds[b]
  accept:
    - vision_embeds[b, :]
    - vision_embeds[b]
