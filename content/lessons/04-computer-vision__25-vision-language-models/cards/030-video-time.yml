- concept: текстовые таймкоды привязывают видеокадры к явным моментам времени
  question: Кадры видео уже переданы VLM в правильном порядке. Что добавляют перемешанные с ними текстовые токены вида <timestamp 01:24>?
  explanation: Положение кадра в последовательности сообщает относительный порядок, а текстовый таймкод задаёт явный момент. Поэтому модель может отвечать на запросы о событиях до или после указанного времени и оценивать интервалы.
  kind: choice
  options:
    - Только уникальный идентификатор каждого кадра
    - Явную привязку кадров ко времени, позволяющую сопоставлять события с моментами из запроса
    - Оценку уверенности vision encoder для каждого кадра
    - Координаты объектов внутри изображения
  correct: 1
  id: 030-video-time-1
  fingerprint: e021af2b
- concept: по явным таймкодам VLM может определять длительность между событиями
  question: Одно событие связано с токеном <timestamp 01:08>, а другое — с <timestamp 02:11>. Сколько секунд прошло между событиями?
  explanation: Первый момент соответствует 68 секундам, второй — 131 секунде. Разность равна 63 секундам. Явные текстовые таймкоды позволяют связать такое вычисление непосредственно с кадрами и событиями.
  kind: numeric
  answer: 63
  tolerance: 0.5
  id: 030-video-time-2
  fingerprint: 5455925c
