- concept: проектор не способен надёжно восстановить локальную информацию, утраченную в выходных признаках ViT
  question: Объясни своими словами, почему знание позиции каждого патча не позволяет MLP-проектору точно восстановить границу объекта, если ему доступны только признаки последнего слоя ViT.
  explanation: Пространственный адрес и визуальное содержание — разные виды информации. Сохранённая позиция патча не компенсирует потерю сведений о том, какая именно граница или текстура находилась в этой позиции.
  kind: open
  reference: Координата сообщает, откуда пришёл патч, но не сохраняет всё его исходное содержимое. Если глубокие слои ViT сгладили или смешали локальные признаки с контекстом, проектор получает уже обеднённое представление и не может надёжно восстановить отсутствующие детали только по позиции.
  id: 018-deepstack-urovni-2
