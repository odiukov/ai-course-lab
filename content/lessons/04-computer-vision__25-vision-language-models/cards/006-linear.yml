- concept: ориентация весов и форма результата линейного преобразования
  question: Тензор токенов x имеет форму (37, 512), матрица weight — (1536, 512), а bias — (1536,). Какое выражение корректно вычисляет линейное преобразование и какую форму имеет результат?
  explanation: В PyTorch веса линейного слоя хранятся как (выходные признаки, входные признаки), поэтому перед умножением нужна транспозиция. Число токенов сохраняется, а последняя размерность становится равна числу выходных признаков.
  kind: choice
  options:
    - x @ weight + bias, форма (37, 1536)
    - weight @ x.T + bias, форма (1536, 37)
    - x @ weight.T + bias, форма (37, 1536)
  correct: 2
  id: 006-linear-1
  fingerprint: 0f466b3e
- concept: broadcasting смещения в векторизованном линейном слое
  question: Заполни пропуск так, чтобы один вектор смещения автоматически прибавился к каждой строке результата.
  explanation: После матричного умножения последняя размерность результата совпадает с длиной bias. PyTorch применяет broadcasting и прибавляет этот вектор ко всем строкам без явного копирования и цикла.
  kind: cloze
  template: y = x @ weight.T + ___
  answer: bias
  accept:
    - bias
