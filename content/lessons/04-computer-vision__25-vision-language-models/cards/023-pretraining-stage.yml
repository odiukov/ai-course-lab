- concept: на этапе pre-training совместно обновляются все основные компоненты VLM
  question: Какие параметры обычно обновляют при pre-training современной VLM на большом корпусе связанных изображений и текстов?
  explanation: 'На pre-training снимают заморозку со всей VLM: ViT учится извлекать более полезные визуальные признаки, projector — передавать их в языковое пространство, а LLM — связывать увиденное со словами и знаниями. В отличие от этого, на alignment обычно обучают только projector.'
  kind: choice
  options:
    - Параметры vision encoder, projector и языковой модели
    - Только параметры projector
    - Только параметры языковой модели
    - Только параметры vision encoder
  correct: 0
  id: 023-pretraining-stage-1
  fingerprint: 2d47355e
- concept: pre-training формирует визуальные знания, а instruction tuning обучает поведению ассистента
  question: Объясните своими словами, почему instruction tuning на примерах «изображение — вопрос — ответ» не заменяет pre-training на крупном корпусе изображений и текстов.
  explanation: Этапы решают разные задачи. На pre-training вся VLM набирает визуальные знания на сотнях миллионов пар, а instruction tuning на гораздо меньшем отобранном наборе превращает её в ассистента, обучая следованию инструкциям и форматам ответов.
  kind: open
  reference: Pre-training даёт всей модели широкий визуальный опыт и знания об объектах, свойствах и ситуациях благодаря большому и разнообразному корпусу. Instruction tuning в первую очередь учит уже обладающую этими знаниями модель понимать запросы, отвечать в нужном формате и вести диалог; небольшой набор инструкций не обеспечивает сопоставимого охвата визуального мира.
  id: 023-pretraining-stage-2
  fingerprint: 1251f751
