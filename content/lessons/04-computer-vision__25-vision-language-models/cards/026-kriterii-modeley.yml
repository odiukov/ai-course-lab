  fingerprint: b74e8925
- concept: vision encoder нужно оценивать по качеству визуальных признаков для целевой задачи
  question: У двух VLM сопоставимы масштаб языковой части и длина контекста, но используются разные vision encoder. Как надёжнее выбрать модель для распознавания мелкого текста на документах?
  explanation: Vision encoder определяет, какие признаки изображения получит языковая часть. Одинаковый масштаб модели или контекст не гарантирует одинакового качества OCR, поэтому нужен профильный тест на целевых данных.
  kind: choice
  options:
    - Сравнить модели на OCR-задачах, близких к рабочим данным
    - Выбрать модель с более длинным названием энкодера
    - Считать энкодеры взаимозаменяемыми при одинаковом контексте
    - Оценивать только общий объём параметров модели
  correct: 0
