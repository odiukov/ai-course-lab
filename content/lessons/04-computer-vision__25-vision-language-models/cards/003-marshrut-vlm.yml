- concept: vision encoder представляет изображение последовательностью визуальных patch-токенов
  question: Что обычно выдаёт vision encoder в архитектуре ViT–projector–LLM?
  explanation: ViT разбивает изображение на патчи и кодирует их как последовательность векторов. Это визуальные признаки, а не готовая подпись и не дискретные текстовые токены.
  kind: choice
  options:
    - Готовую текстовую подпись к изображению
    - Последовательность векторных признаков патчей изображения
    - Распределение вероятностей следующего текстового токена
    - Строку из токенов словаря языковой модели
  correct: 1
  id: 003-marshrut-vlm-1
  fingerprint: ae68519f
- concept: при конкатенации визуальных и текстовых токенов складываются длины последовательностей, а ширина эмбеддингов сохраняется
  question: Заполни форму результата конкатенации по оси последовательности.
  explanation: Обе последовательности уже имеют общую ширину d_llm, поэтому их можно объединить вдоль оси токенов. В результате получается P + Q токенов той же размерности.
  kind: cloze
  template: (P, d_llm) concat (Q, d_llm) → (___, d_llm)
  answer: P + Q
  accept:
    - P+Q
    - Q + P
    - Q+P
  id: 003-marshrut-vlm-2
  fingerprint: d7153611
