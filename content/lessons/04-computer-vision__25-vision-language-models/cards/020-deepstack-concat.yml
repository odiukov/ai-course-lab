- concept: совместимость входов DeepStack определяется одинаковым числом патч-токенов, а не одинаковой шириной признаков
  question: Какие признаки из разных слоёв ViT можно корректно объединить функцией deepstack_concat?
  explanation: 'Строки разных матриц должны обозначать одни и те же патчи, поэтому число токенов обязано совпадать. Ширины могут быть разными: при склейке по оси признаков они просто суммируются.'
