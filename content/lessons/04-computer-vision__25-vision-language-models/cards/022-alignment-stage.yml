- concept: для alignment нужны пары «изображение — подпись», связывающие визуальные признаки с языковым смыслом
  question: Какой датасет непосредственно подходит для этапа alignment мультимодальной модели?
  explanation: Alignment обучает отображение из пространства визуальных признаков в языковое пространство. Подпись задаёт языковой смысл, которому должны соответствовать признаки изображения. Тройки с вопросами и ответами нужны уже для обучения диалоговому поведению.
  kind: choice
  options:
    - Пары из изображения и описывающей его подписи
    - Тройки из изображения, пользовательской инструкции и ответа ассистента
    - Большой корпус текста без изображений
    - Набор изображений без подписей и других текстовых данных
  correct: 0
  id: 022-alignment-stage-1
  fingerprint: 86b46b80
- concept: заморозка vision encoder и LLM превращает их пространства в неподвижные ориентиры для обучения projector
  question: Почему на этапе alignment полезно заморозить vision encoder и LLM, обучая отображение между ними?
  explanation: Замороженные компоненты задают фиксированные исходное и целевое пространства. Градиенты меняют только преобразование между ними, поэтому обучение непосредственно формирует межмодальный перевод.
  kind: open
  reference: Их пространства признаков остаются стабильными, поэтому projector вынужден научиться переводить визуальные представления в уже существующее пространство эмбеддингов LLM. Если одновременно менять обе стороны, они могут совместно сдвигаться, и задача однозначного согласования пространств становится менее устойчивой.
  id: 022-alignment-stage-2
  fingerprint: 3b0b7b47
- concept: alignment создаёт межмодальное соответствие, но не обучает модель следовать пользовательским инструкциям
  question: Модель успешно прошла alignment на парах изображений и подписей. Какой способности это само по себе не гарантирует?
  explanation: Alignment согласует пространства зрения и языка. Следование инструкциям и диалоговые форматы формируются позже на примерах вида «изображение, вопрос, ответ».
  kind: choice
  options:
    - Перевод визуальных признаков в представления, понятные языковой модели
    - Связывание объектов и свойств изображения с языковыми понятиями
    - Надёжное следование вопросам, командам и требуемым форматам ответа
    - Использование подписей как сигнала межмодального обучения
  correct: 2
  id: 022-alignment-stage-3
  fingerprint: 9972c8ab
