- concept: visual agent управляет интерфейсом в замкнутом цикле с обратной связью
  question: Расположите этапы одного цикла работы visual agent в правильном порядке.
  explanation: После каждого действия агент наблюдает новое состояние интерфейса и только затем планирует следующий ход. Благодаря этой обратной связи он может реагировать на появившиеся окна, предупреждения и сместившиеся элементы.
  kind: order
  items:
    - Получить текущее изображение интерфейса и цель
    - Выбрать действие на основе наблюдаемого состояния
    - Исполнить действие через средство управления интерфейсом
    - Получить обновлённое изображение после изменения интерфейса
