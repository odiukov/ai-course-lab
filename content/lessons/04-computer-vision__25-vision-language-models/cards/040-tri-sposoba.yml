- concept: способ размещения VLM и доменная адаптация решают независимые задачи и могут применяться вместе
  question: Изображения нельзя передавать за пределы инфраструктуры компании, а готовая VLM систематически ошибается при распознавании внутренних обозначений. Какой план устраняет обе проблемы?
  explanation: Self-hosting обеспечивает контроль над размещением данных, а доменное дообучение исправляет устойчивую ошибку на специфических обозначениях. Это разные решения, поэтому в данном случае нужны оба.
  kind: choice
  options:
    - Использовать hosted API без изменения модели
    - Разместить готовую открытую VLM самостоятельно без дополнительного обучения
    - Доменно дообучить открытую VLM на проверенных примерах и разместить её самостоятельно
    - Доменное дообучение без определения способа последующего размещения
