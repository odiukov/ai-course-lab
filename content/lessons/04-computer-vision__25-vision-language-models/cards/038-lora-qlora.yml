- concept: при LoRA базовые веса модели заморожены, а обучаются низкоранговые адаптеры
  question: Команда адаптирует крупную VLM методом LoRA. Какие параметры должны изменяться во время обучения?
  explanation: LoRA оставляет исходные веса VLM замороженными и обучает компактные низкоранговые поправки, обычно подключённые к attention и projector. Поэтому не требуется обновлять все 70 миллиардов параметров.
  kind: choice
  options:
    - Все веса vision encoder, projector и языковой модели
    - Только добавленные низкоранговые адаптеры, при замороженных базовых весах
    - Только базовые веса слоёв, к которым подключены адаптеры
    - 'Никакие параметры: LoRA изменяет только входные данные'
  correct: 1
  id: 038-lora-qlora-1
  fingerprint: 15a9171b
- concept: QLoRA экономит память за счёт низкобитного хранения замороженных базовых весов
  question: Какое изменение отличает QLoRA от обычной LoRA при адаптации крупной VLM?
  explanation: В QLoRA базовые веса квантуются, например до 4 бит, но остаются замороженными. Обучаемыми по-прежнему являются небольшие адаптеры, что снижает расход памяти.
  kind: choice
  options:
    - QLoRA размораживает vision encoder, но замораживает языковую модель
    - QLoRA заменяет низкоранговые адаптеры полным дообучением projector
    - QLoRA хранит замороженные базовые веса в низкой разрядности, продолжая обучать адаптеры
    - QLoRA удаляет attention и обучает только выходной классификатор
  correct: 2
