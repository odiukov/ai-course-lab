- concept: ранг LoRA определяет компромисс между выразительностью адаптации и затратами ресурсов
  question: Объясни своими словами, как увеличение ранга LoRA влияет на возможности адаптера и требования к ресурсам.
  explanation: Ранг задаёт размер низкоранговой поправки, а не процент качества модели. Типичный диапазон 16–64 отражает практический компромисс между компактностью и способностью адаптера освоить целевую задачу.
  kind: open
  reference: Более высокий ранг позволяет адаптеру описывать более сложную поправку к поведению модели, но увеличивает число обучаемых параметров, расход памяти и требования к данным. Низкий ранг дешевле, но может ограничивать выразительность адаптации.
  id: 038-lora-qlora-3
  fingerprint: 0ece873b
