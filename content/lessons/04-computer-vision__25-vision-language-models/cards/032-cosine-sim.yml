- concept: скалярное произведение L2-нормализованных эмбеддингов равно их косинусной близости
  question: Эмбеддинги изображения и текста уже нормализованы по последней оси. Заполни пропуск, чтобы получить косинусную близость для каждой пары в батче.
  explanation: После L2-нормализации длина каждого эмбеддинга равна единице, поэтому косинусная близость сводится к скалярному произведению. Поэлементные произведения нужно просуммировать по оси признаков.
  kind: cloze
  template: sim = (image_emb * text_emb).___
  answer: sum(dim=-1)
  accept:
    - sum(-1)
  id: 032-cosine-sim-1
  fingerprint: 58c69d0c
- concept: высокая косинусная близость отражает общую межмодальную согласованность, но не подтверждает каждую деталь ответа
  question: Проверяющий энкодер показал высокую косинусную близость изображения и ответа VLM, однако в ответе неверно указан цвет небольшого предмета. Как это интерпретировать?
  explanation: Косинусная близость сравнивает общее направление эмбеддингов изображения и текста. Она может не заметить локальную фактическую ошибку, поэтому не заменяет проверку отдельных объектов, атрибутов и отношений.
  kind: choice
  options:
    - 'Косинусная близость вычислена неправильно: при любой фактической ошибке она обязана быть низкой'
    - Ответ может быть согласован с изображением в целом, хотя отдельная деталь остаётся ошибочной
    - Высокая близость доказывает правильность ответа, поэтому цвет нужно считать верным
    - Косинусная близость измеряет только уверенность языковой модели в выбранных токенах
  correct: 1
  id: 032-cosine-sim-2
  fingerprint: '60063360'
