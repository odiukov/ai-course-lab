- concept: порядок операций в MLP-проекторе визуальных токенов
  question: Расположите операции прямого прохода MLP-проектора в правильном порядке.
  explanation: Проектор последовательно выполняет линейное преобразование, GELU и ещё одно линейное преобразование. Так визуальные признаки переводятся в пространство эмбеддингов языковой модели.
  kind: order
  items:
    - Применить входной линейный слой к визуальным токенам
    - Применить GELU к полученным скрытым представлениям
    - Применить выходной линейный слой
  id: 010-projector-forward-1
  fingerprint: 1b2d152f
- concept: MLP-проектор изменяет ширину каждого токена, сохраняя число токенов
  question: Проектор независимо применяет один и тот же MLP к каждой строке тензора визуальных токенов формы (N, D_vit). Какую форму должен иметь результат?
  explanation: Линейные слои и GELU обрабатывают каждую строку независимо. Поэтому число визуальных токенов N сохраняется, а ширина представления меняется с D_vit на D_llm.
  kind: choice
  options:
    - (N, D_llm)
    - (D_llm, N)
    - (N, N)
    - (D_vit, D_llm)
  correct: 0
  id: 010-projector-forward-2
  fingerprint: 817021c5
