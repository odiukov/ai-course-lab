- concept: сегментация CMER помогает обнаруживать локальные сбои, скрытые агрегированной метрикой
  question: Объясни своими словами, зачем отслеживать CMER отдельно по API-ручкам, типам промптов и клиентам, даже если общий CMER почти не меняется.
  explanation: CMER служит production-KPI не только в агрегированном виде. Сегментация показывает, где именно возникли галлюцинации или изменилось распределение входных данных, тогда как общее среднее может скрыть локальный рост.
  kind: open
  reference: 'Общая метрика усредняет разные распределения входов: рост ошибок в одном сегменте может компенсироваться снижением в другом. Разрезы позволяют локализовать распределение, на котором модель стала чаще выдавать уверенные, но плохо согласованные с изображением ответы.'
