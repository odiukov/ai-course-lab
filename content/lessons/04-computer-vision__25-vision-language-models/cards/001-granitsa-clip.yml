- concept: выбор среди готовых ответов остаётся закрытой классификацией, а не генерацией
  question: Объясни, почему добавление списка возможных ответов позволяет применить CLIP к вопросу об изображении, но не превращает его в генеративную vision-language model.
  explanation: Перебор вариантов сводит задачу к сравнению изображения с готовыми текстами. Генеративная VLM, напротив, получает изображение и вопрос и создаёт ответ с помощью языковой модели.
  kind: open
  reference: 'CLIP может закодировать каждый предложенный ответ и выбрать наиболее похожий на изображение. Однако он по-прежнему лишь ранжирует фиксированный набор кандидатов: отсутствующий в списке ответ или новое объяснение модель породить не может.'
