- concept: processor реализует модельно-зависимый контракт подготовки мультимодального входа
  question: Что должен сделать processor перед передачей запроса в VLM?
  explanation: Processor подготавливает pixel_values, input_ids и при необходимости дополнительные данные вроде размеров визуальной сетки. Vision encoder и projector запускаются уже внутри модели.
  kind: choice
  options:
    - Только токенизировать текст, оставив изображение в формате PIL
    - Самостоятельно запустить vision encoder и заменить image-placeholder визуальными эмбеддингами
    - Применить нужную обработку изображения, токенизировать текст и вернуть ожидаемые моделью тензоры и метаданные
  correct: 2
  id: 041-realnyy-inferens-1
  fingerprint: 1aa47b0e
- concept: chat template кодирует модельно-зависимые роли, мультимодальные маркеры и начало хода ассистента
  question: Почему нельзя без проверки применять chat template одного семейства VLM к модели другого семейства и какую роль играет add_generation_prompt?
  explanation: Chat template задаёт протокол представления диалога, а не смысл вопроса. add_generation_prompt лишь оформляет начало хода ассистента и сам по себе ничего не генерирует.
  kind: open
  reference: У семейств VLM различаются служебные токены, запись ролей и маркеры мультимодального контента. Чужой шаблон может заставить модель неверно интерпретировать изображение или границы реплик. add_generation_prompt добавляет служебное начало следующей реплики ассистента, показывая модели, что теперь она должна генерировать ответ.
  id: 041-realnyy-inferens-2
  fingerprint: 5e0233ee
- concept: из результата generate нужно отделять продолжение от входного prompt
  question: model.generate вернул последовательность токенов, начало которой совпадает с переданными input_ids. Как получить только текст нового ответа?
  explanation: Для decoder-only генерации результат обычно содержит исходный prompt и добавленное продолжение. Срез по длине input_ids оставляет только новые токены, после чего их можно декодировать.
  kind: choice
  options:
    - Декодировать всю последовательность и искать вопрос в получившейся строке
    - Отрезать префикс длиной input_ids и декодировать оставшиеся токены
    - Декодировать только input_ids, потому что ответ записывается поверх prompt
  correct: 1
  id: 041-realnyy-inferens-3
  fingerprint: 86da2ef0
