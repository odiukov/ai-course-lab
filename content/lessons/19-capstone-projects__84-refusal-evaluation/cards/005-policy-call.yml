- concept: обычный ответ возвращается только после проверки всех запрещённых шаблонов
  question: Расположи действия mock-политики в правильном порядке.
  explanation: 'Любое совпадение должно привести к отказу. Поэтому обычный ответ находится после цикла: отсутствие совпадения с одним шаблоном ещё не исключает совпадения с последующими.'
  kind: order
  items:
    - Начать перебор регулярных выражений из `_patterns`
    - Для текущего выражения выполнить `pat.search(prompt)`
    - При совпадении сразу вернуть `REFUSAL_TEXT` с `_refuse_c`
    - После завершения перебора без совпадений вернуть `ANSWER_TEXT` с `_answer_c`
