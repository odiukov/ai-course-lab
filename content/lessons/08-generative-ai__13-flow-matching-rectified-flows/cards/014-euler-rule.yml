- concept: размер равного шага Эйлера определяется длиной временного интервала и числом шагов
  question: Сэмплер проходит назад по времени от t = 0.93 до t = 0.21 за 4 одинаковых шага Эйлера. Чему равен Δt?
  explanation: 'Длина интервала равна 0.93 − 0.21 = 0.72. Делим её на 4 равных шага: Δt = 0.72 / 4 = 0.18.'
  kind: numeric
  answer: 0.18
  tolerance: 0.001
  id: 014-euler-rule-1
  fingerprint: 2c40967a
- concept: явный метод Эйлера использует значение векторного поля в начале текущего шага
  question: Какое значение векторного поля явный метод Эйлера использует для перехода из текущего состояния x_t к более раннему моменту времени?
  explanation: 'Явный шаг Эйлера берёт скорость в текущей точке: x_{t-Δt} = x_t − Δt·v_θ(x_t,t). После перехода поле вычисляется заново уже для обновлённых состояния и времени.'
  kind: choice
  options:
    - v_θ(x_t, t), вычисленное в текущем состоянии и в текущее время
    - v_θ(x_{t-Δt}, t-Δt), вычисленное заранее в ещё неизвестной конечной точке шага
    - Точное среднее значение поля вдоль всего будущего участка траектории
  correct: 0
  id: 014-euler-rule-2
  fingerprint: 181dcb73
