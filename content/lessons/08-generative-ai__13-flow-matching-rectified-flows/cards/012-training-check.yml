- concept: промежуточное состояние и целевая скорость детерминированы при фиксированных данных, шуме и времени
  question: Объясни своими словами, почему промежуточное состояние и целевую скорость в обучающем примере flow matching не нужно сэмплировать независимо.
  explanation: Источники случайности — выбор данных, шума и времени. Условно на этих величинах и вход модели, и правильный ответ вычисляются однозначно.
  kind: open
  reference: После выбора точки данных, шума и времени промежуточное состояние однозначно задаётся интерполяцией, а целевая скорость — разностью шума и точки данных. Поэтому дополнительной случайности в этих двух величинах нет.
  id: 012-training-check-2
  fingerprint: f47d79a8
