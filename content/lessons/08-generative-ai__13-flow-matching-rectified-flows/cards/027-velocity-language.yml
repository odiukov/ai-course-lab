- concept: скоростная параметризация позволяет использовать flow matching с негауссовыми интерполянтами
  question: Объясните, почему переход к предсказанию скорости полезен даже тогда, когда на гауссовом пути он алгебраически эквивалентен предсказанию шума.
  explanation: Выигрыш состоит не в новой генеративной задаче, а в более прямой цели обучения и свободе выбирать пути, не ограниченные стандартным гауссовым зашумлением.
  kind: open
  reference: 'Для гауссового пути меняется главным образом параметризация: модель непосредственно выдаёт векторное поле для ODE, а не шум, который сэмплер ещё преобразует по расписанию. При этом понятие скорости применимо и к негауссовым интерполянтам, где стандартная DDPM-параметризация шумом может быть неудобна или вовсе не задана.'
