- concept: безопасная нормализация вырожденных участков предотвращает неопределённые значения кривизны
  question: Почему при нормализации перемещений в path_curvature нужно учитывать случай, когда соседние состояния траектории совпадают?
  explanation: Защита знаменателя сохраняет конечный результат даже при неподвижных участках. Без неё одно нулевое перемещение способно превратить среднюю кривизну всей траектории в NaN.
  kind: open
  reference: У совпадающих состояний вектор перемещения имеет нулевую норму, поэтому обычное деление на норму порождает NaN или бесконечность. Норму следует ограничить снизу малым epsilon либо использовать безопасную нормализацию; при необходимости вырожденные участки можно исключить маской.
  id: 019-path-curvature-2
  fingerprint: 560eed60
- concept: для сравнения направлений объединяются координатные оси, но сохраняются оси времени и батча
  question: Перемещения имеют форму [S, B, C, H, W], где S обозначает участки траектории. Какая форма подходит для вычисления косинусного сходства отдельно для каждого участка и примера?
  explanation: Канальные и пространственные координаты образуют один вектор признаков F. Оси S и B нужно сохранить, чтобы сопоставлять соседние направления во времени отдельно для каждого примера.
  kind: choice
  options:
    - '[S, B, F], где F объединяет C, H и W'
    - '[S, B·C·H·W]'
    - '[S·B, F]'
    - '[C, H, W, S·B]'
