- concept: для обучения следующей reflow-модели достаточно сохранить концы сгенерированной траектории
  question: Почему при подготовке датасета для следующей reflow-модели обычно достаточно сохранить начальную и конечную точки прохода, не сохраняя все промежуточные состояния ODE?
  explanation: Проход первой модели нужен для определения связанной пары концов. После этого обучающие примеры для новой модели строятся на прямой между этими концами, поэтому старые промежуточные состояния можно не хранить.
  kind: open
  reference: Следующую модель обучают на заново построенных прямых интерполянтах между связанными концами пары. Для вычисления промежуточного состояния и целевой скорости такого интерполянта нужны сами концы и выбранное время, а состояния прежней кривой ODE в эту обучающую цель не входят.
