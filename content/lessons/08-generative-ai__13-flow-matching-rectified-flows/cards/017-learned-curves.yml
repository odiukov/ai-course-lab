- concept: при MSE-регрессии оптимальное предсказание скорости равно условному среднему целевых скоростей
  question: Для одного и того же входа (x_t, t) целевая скорость с равной вероятностью равна (6, 0) или (0, 10). Какой должна быть первая координата оптимального предсказания при минимизации MSE?
  explanation: MSE минимизируется условным средним целевых значений. Средняя скорость равна ((6 + 0) / 2, (0 + 10) / 2) = (3, 5), поэтому её первая координата равна 3.
  kind: numeric
  answer: 3
  tolerance: 0.01
  id: 017-learned-curves-1
  fingerprint: 08e4b7a6
- concept: прямые условные интерполянты не гарантируют прямых интегральных кривых единого векторного поля
  question: Объясни, почему обучение на прямых интерполянтах между шумом и данными не гарантирует, что траектория обученной flow-модели при генерации тоже будет прямой.
  explanation: Прямизна отдельных обучающих отрезков — свойство условных путей для конкретных пар. Модель же учит одно общее векторное поле. Если целевые скорости при одинаковых или близких входах несовместимы, поле не может воспроизвести каждый отрезок и его интегральные кривые могут оказаться непрямыми.
  kind: open
  reference: Разные обучающие пары могут приводить близкие или одинаковые состояния в один момент времени, но требовать разных скоростей. Детерминированное векторное поле задаёт для каждого состояния и времени только один вектор, поэтому регрессия усредняет несовместимые цели. При интегрировании модель последовательно следует этим локальным усреднённым векторам; их направление меняется вдоль пути, и траектория изгибается.
  id: 017-learned-curves-2
  fingerprint: 8c969f43
