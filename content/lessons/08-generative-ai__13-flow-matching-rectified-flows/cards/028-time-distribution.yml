- concept: равномерное сэмплирование времени даёт равные вероятности временным участкам равной длины
  question: Заполни формулу вероятности попадания равномерно выбранного времени в подынтервал.
  explanation: При равномерном распределении вероятность участка пропорциональна его длине. Поэтому участки равной длины встречаются в обучающих примерах одинаково часто независимо от их положения.
  kind: cloze
  template: Если t равномерно распределено на интервале I, а A — его подынтервал, то P(t ∈ A) = ___.
  answer: '|A| / |I|'
  accept:
    - length(A) / length(I)
    - μ(A) / μ(I)
  id: 028-time-distribution-1
  fingerprint: 3a1bfc3f
- concept: распределение времени меняет относительный вес ошибок вдоль пути, не меняя сам путь
  question: При обучении rectified flow равномерное сэмплирование времени заменили центрированным логит-нормальным, но формулу интерполяции оставили прежней. Что изменилось?
  explanation: Распределение времени управляет частотой показа разных промежуточных состояний и тем самым их вкладом в ожидаемый лосс. Формула пути и его конечные точки при этом не меняются.
  kind: choice
  options:
    - Конечные точки интерполяции автоматически поменялись местами
    - Прямой интерполянт превратился в криволинейную траекторию
    - Модель стала чаще получать примеры из середины пути и реже — из его краёв
    - Направление времени стало противоположным
  correct: 2
