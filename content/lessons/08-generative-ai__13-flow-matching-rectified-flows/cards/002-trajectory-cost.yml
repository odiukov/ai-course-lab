- concept: кривизна траектории усиливает ошибку крупного шага метода Эйлера
  question: Почему крупный шаг метода Эйлера плохо приближает сильно искривлённую траекторию обратной ODE?
  explanation: Эйлер использует скорость в начале шага и движется по касательной. Если траектория заметно изгибается, эта касательная срезает поворот, а полученная ошибка влияет и на последующие состояния.
  kind: choice
  options:
    - Метод сохраняет начальное направление на всём шаге, хотя истинная скорость успевает повернуться
    - Метод на каждом шаге добавляет случайный гауссов шум
    - Крупный шаг обязательно уменьшает норму состояния до нуля
  correct: 0
  id: 002-trajectory-cost-1
  fingerprint: 230cb4fb
- concept: кривизна увеличивает стоимость сэмплирования через число вычислений векторного поля
  question: Объясни своими словами, почему более искривлённая траектория генеративной ODE обычно требует больше вычислений нейросети при сэмплировании.
  explanation: Короткие шаги уменьшают ошибку срезания изгибов, но каждый из них требует нового запуска модели. Поэтому геометрическая кривизна непосредственно повышает число вычислений векторного поля.
  kind: open
  reference: На искривлённой траектории направление скорости быстро меняется, поэтому численному решателю нужны более короткие шаги. Для каждого нового шага требуется заново вычислить векторное поле нейросетью, и стоимость сэмплирования растёт.
  id: 002-trajectory-cost-2
  fingerprint: 75c52607
