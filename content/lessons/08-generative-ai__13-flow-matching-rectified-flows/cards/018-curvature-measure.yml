- concept: нормализация перемещений делает меру изгиба нечувствительной к скорости движения
  question: Меру изгиба вычисляют по различиям соседних единичных направлений перемещения. Что произойдёт с ней, если каждое ненулевое перемещение умножить на произвольный положительный коэффициент?
  explanation: Положительное масштабирование меняет длину перемещения, но после нормализации получается прежнее единичное направление. Поэтому мера реагирует на повороты, а не на скорость движения.
  kind: choice
  options:
    - Она обязательно возрастёт
    - Она обязательно уменьшится
    - Она станет равна нулю
    - Она не изменится
  correct: 3
  id: 018-curvature-measure-1
  fingerprint: b2a85f8b
- concept: вклад поворота равен длине хорды между единичными направлениями
  question: Угол между единичными направлениями двух соседних участков равен 120°. Чему равна норма их разности? Округли до трёх знаков после запятой.
  explanation: Для единичных направлений u и v выполняется ‖v − u‖² = 2 − 2 cos θ. При θ = 120° получаем ‖v − u‖ = √3 ≈ 1.732.
  kind: numeric
  answer: 1.732
  tolerance: 0.005
  id: 018-curvature-measure-2
  fingerprint: d4070084
- concept: дискретная мера смены направления зависит от плотности временной сетки
  question: Почему две траектории нельзя надёжно сравнивать по среднему различию соседних единичных направлений, если они записаны на временных сетках разной плотности?
  explanation: Мера усредняет локальные изменения направления, а их величина зависит от разбиения пути. Одинаковая сетка отделяет реальное различие формы траекторий от эффекта дискретизации.
  kind: open
  reference: Плотность сетки определяет длину участков и величину поворота между соседними направлениями. Более частая дискретизация гладкой кривой обычно разбивает тот же изгиб на меньшие изменения, поэтому значения меры могут различаться даже для одной геометрической траектории. Для сравнения нужна одинаковая временная сетка.
  id: 018-curvature-measure-3
  fingerprint: b477ea15
