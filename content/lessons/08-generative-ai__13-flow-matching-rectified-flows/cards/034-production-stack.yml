- concept: роли компонентов в конвейере генерации изображения из текста
  question: Расположи этапы современного flow-matched text-to-image конвейера в порядке выполнения.
  explanation: Сначала T5 и CLIP кодируют текст, затем MMDiT преобразует шум в латентное изображение, а VAE переводит латентное представление в пиксели.
  kind: order
  items:
    - Преобразовать промпт в текстовые представления с помощью текстовых энкодеров
    - Преобразовать шум в латентное представление с помощью дистиллированного денойзера
    - Декодировать латентное представление в пиксели с помощью автокодировщика
  id: 034-production-stack-1
  fingerprint: 647705ee
- concept: квантование уменьшает вычислительные и прежде всего память-затраты, но не обучает модель малошаговой генерации
  question: Инженер квантовал денойзер, не меняя его обучение и алгоритм сэмплирования. Какой результат наиболее обоснован?
  explanation: 'Квантование снижает разрядность весов и требования к памяти. За сокращение числа шагов отвечает отдельная ускоряющая дистилляция: именно она позволяет Flux.1-schnell работать за 1–4 шага вместо 50 у Flux.1-dev.'
  kind: choice
  options:
    - Модель станет занимать меньше памяти, но требуемое число шагов само по себе не сократится
    - Модель автоматически научится сохранять качество при очень малом числе шагов
    - Текстовые энкодеры станут не нужны, потому что денойзер получит промпт напрямую
    - Декодирование латентного представления в пиксели станет не нужно
  correct: 0
  id: 034-production-stack-2
  fingerprint: 5db7ccf4
