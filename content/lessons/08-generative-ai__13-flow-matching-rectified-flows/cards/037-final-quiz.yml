- concept: польза логит-нормального сэмплирования времени определяется контролируемым сравнением качества
  question: Объясни, как проверить, помогла ли замена равномерного сэмплирования времени на логит-нормальное, и почему концентрация времён в середине интервала сама по себе ещё не доказывает улучшение.
  explanation: Логит-нормальное распределение чаще показывает модели середину пути, но это не гарантирует лучшего конечного распределения. Вывод делают по контролируемому эксперименту и метрике сэмплов.
  kind: open
  reference: Нужно обучить сопоставимые модели, сохранив архитектуру, вычислительный бюджет и процедуру оценки и изменив только распределение времени. Затем следует сравнить качество сэмплов на одинаковых настройках генерации. Концентрация времён лишь перераспределяет вес обучающих ошибок; она считается полезной только при устойчивом улучшении итоговой метрики.
  id: 037-final-quiz-2
