- concept: flow matching и DDPM задают одинаковые гауссовы промежуточные распределения при совпадающем расписании смешивания
  question: Объясни своими словами, при каком условии гауссовый путь flow matching воспроизводит промежуточные распределения DDPM и чем тогда различаются два описания.
  explanation: Одинаковые коэффициенты смешивания задают один и тот же гауссовый условный путь. DDPM описывает его языком зашумления, а flow matching — языком скорости переноса вдоль пути.
  kind: open
  reference: 'Путь flow matching должен использовать те же зависящие от времени коэффициенты чистого сигнала и гауссова шума, что и расписание DDPM. Тогда промежуточные распределения совпадают, а различие состоит в параметризации: flow matching формулирует задачу через непрерывное поле скоростей и регрессию скорости.'
  id: 026-ddpm-connection-2
  fingerprint: 312a653b
