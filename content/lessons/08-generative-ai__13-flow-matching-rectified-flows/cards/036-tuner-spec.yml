- concept: целевое число шагов является условием оценки, а не гарантией малошаговой генерации
  question: Заполни пропуск в утверждении о конфиге flow matching.
  explanation: Запись `target_steps` сама по себе не меняет обучение или сэмплер. Модель нужно действительно запустить с этим числом шагов и сопоставить качество и задержку с более длинным контрольным запуском.
  kind: cloze
  template: '`target_steps` — это прежде всего условие ___ модели при заданном бюджете вычислений, а не обещание сохранить качество.'
  answer: оценки
