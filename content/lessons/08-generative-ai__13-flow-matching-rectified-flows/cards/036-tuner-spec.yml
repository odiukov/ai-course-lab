- concept: эффект reflow оценивается в контролируемом эксперименте с фиксированными прочими настройками обучения
  question: Объясни своими словами, почему нельзя уверенно приписать улучшение reflow, если одновременно с ним заменили оптимизатор и learning rate.
  explanation: Воспроизводимый конфиг нужен не только для запуска, но и для причинного сравнения. Контроль оптимизатора и learning rate позволяет связать наблюдаемую разницу именно с планом reflow.
  kind: open
  reference: 'Одновременное изменение нескольких факторов создаёт смешение эффектов: результат мог улучшиться из-за reflow, оптимизатора, learning rate или их взаимодействия. Для проверки вклада reflow остальные существенные настройки фиксируют.'
