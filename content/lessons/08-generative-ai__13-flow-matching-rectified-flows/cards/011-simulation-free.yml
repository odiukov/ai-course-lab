- concept: градиент flow matching проходит только через нейросетевое векторное поле
  question: При обучении conditional flow matching параметры θ входят только в предсказание v_θ(x_t, t), а обучающая цель вычисляется из сэмплированных концов траектории. Через какую часть вычислений требуется распространять градиент?
  explanation: Сэмплированные x₀, x₁ и t не зависят от θ, как и цель x₁ − x₀. Поэтому градиент лосса по θ проходит через предсказание нейросети; вычислительного графа из шагов ODE-решателя при обучении нет.
  kind: choice
  options:
    - Только через вычисление v_θ(x_t, t)
    - Через все состояния численно решаемой ODE
    - Через процедуру сэмплирования концов траектории
    - Через вычисление аналитической обучающей цели
  correct: 0
  id: 011-simulation-free-1
  fingerprint: e5605ae1
- concept: simulation-free обучение не отменяет интегрирование ODE при генерации
  question: Объясните своими словами, почему выражение «simulation-free обучение» не означает, что flow-модель вообще никогда не требует решения ODE.
  explanation: 'Simulation-free характеризует построение обучающего лосса: для него ODE не разворачивается. Однако модель учит правую часть ODE, и при генерации интегрирование этого поля обычно используется для переноса начального сэмпла к конечному состоянию.'
  kind: open
  reference: Во время обучения векторное поле восстанавливают регрессией по отдельно сэмплированным точкам и известным скоростям, поэтому обучающие примеры не требуют интегрирования ODE. После обучения для генерации новой полной траектории обычно всё же нужно численно интегрировать ODE, заданное выученным полем.
  id: 011-simulation-free-2
  fingerprint: 489789fd
