- concept: линейная интерполяция задаёт постоянную целевую скорость вдоль каждой пары шум–данные
  question: В flow matching точку данных и образец шума соединяют линейной интерполяцией, причём время направлено от данных к шуму. Какова целевая скорость вдоль этой траектории?
  explanation: Производная линейной интерполяции равна вектору от данных к шуму и не зависит от времени. При генерации ODE интегрируют в обратном направлении, поэтому движение идёт от шума к данным.
  kind: choice
  options:
    - Разность между образцом шума и точкой данных, постоянная по времени
    - Текущая точка траектории, умноженная на время
    - Случайный вектор, заново выбираемый в каждый момент
    - Градиент плотности распределения данных
  correct: 0
  id: 003-road-map-1
  fingerprint: 45dba6c1
- concept: форма промежуточных траекторий не определяет сама по себе правильность конечного распределения
  question: Два непрерывных потока при точном интегрировании переводят одно и то же распределение шума в одно и то же распределение данных. У одного траектории почти прямые, у другого — извилистые. Можно ли только по форме путей объявить второй поток неверным? Объясни своими словами.
  explanation: Для корректности генеративного потока важно, какое распределение он получает в конце. Прямая и извилистая динамика могут иметь одинаковые начальное и конечное распределения, хотя различаться поведением между ними.
  kind: open
  reference: Нет. Разные векторные поля могут задавать разные промежуточные траектории и при этом корректно переводить исходное распределение в целевое. Прямолинейность характеризует геометрию транспорта и удобство его численного приближения, а не сама по себе правильность конечного распределения.
  id: 003-road-map-2
  fingerprint: 8aff3853
