- concept: вычисление промежуточной точки линейного интерполянта
  question: Линейный интерполянт задан как x_α = x_data + α(x_noise − x_data). Пусть x_data = 8, x_noise = −4 и α = 0.6. Чему равен x_α?
  explanation: Разность концов равна −12, поэтому x_α = 8 + 0.6·(−12) = 0.8. Параметр α задаёт долю пути от данных к шуму.
  kind: numeric
  answer: 0.8
  tolerance: 0.001
  id: 004-linear-path-1
  fingerprint: 0c793938
- concept: прямое получение промежуточных состояний без симуляции динамики
  question: Что нужно сделать, чтобы получить обучающую точку линейного интерполянта для выбранных x_data, x_noise и параметра α?
  explanation: Промежуточная точка вычисляется непосредственно как смесь двух концов. Поэтому для подготовки обучающего примера не требуется разворачивать ODE или моделировать последовательность состояний.
  kind: choice
  options:
    - Подставить выбранные значения в формулу интерполяции
    - Численно проинтегрировать ODE от данных до шума
    - Найти промежуточную точку итеративной оптимизацией
    - Запустить марковскую цепь и дождаться её сходимости
