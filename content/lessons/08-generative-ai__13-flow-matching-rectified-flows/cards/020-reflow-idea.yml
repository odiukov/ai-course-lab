- concept: согласованные reflow-пары связывают исходную точку с конечной точкой, полученной интегрированием обученного потока
  question: Обучено векторное поле v_A. Как построить обучающую пару для следующей модели по правилу reflow?
  explanation: 'Reflow использует фактическое отображение, созданное обученным векторным полем: поток переводит исходную точку z в ŷ, после чего их фиксируют как новую пару. В отличие от независимого случайного сопоставления, такая пара согласована с динамикой модели.'
  kind: choice
  options:
    - Независимо выбрать шум z и случайный объект данных y, затем составить пару (z, y)
    - Запустить ODE с полем v_A из z, получить конечную точку ŷ и составить пару (z, ŷ)
    - Дважды независимо запустить ODE из z и соединить две полученные конечные точки
    - Соединить z с ближайшим объектом данных по евклидову расстоянию
  correct: 1
  id: 020-reflow-idea-1
  fingerprint: 135e364e
- concept: одна итерация reflow последовательно генерирует согласованные пары и переобучает модель на прямых интерполянтах между их концами
  question: Расположите действия одной итерации reflow после обучения исходной flow-модели в правильном порядке.
  explanation: Сначала прежняя модель сама задаёт соответствие между началами и концами траекторий. Затем следующую модель обучают уже на полученных согласованных парах. Повторение этой процедуры обычно делает траектории всё ближе к прямым.
  kind: order
  items:
    - Насэмплировать исходные точки из начального распределения
    - Проинтегрировать обученное векторное поле и записать достигнутые конечные точки
    - Составить пары из каждой исходной точки и соответствующей ей достигнутой точки
    - Обучить следующее векторное поле на прямых интерполянтах этих пар
  id: 020-reflow-idea-2
  fingerprint: 8fe9c4d0
