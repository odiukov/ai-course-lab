<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Правило 68–95–99.7</title>
<style>
  :root{ color-scheme: light dark; }
  html,body{ margin:0; background:#ffffff; color:#0f172a; }
  body{ font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  figure{ margin:0; padding:16px; max-width:860px; }
  h2{ font-size:16px; line-height:1.3; margin:0 0 10px; font-weight:600; }
  svg{ display:block; width:100%; height:auto; max-height:520px; }
  .axis{ stroke:#475569; fill:none; }
  .head{ fill:#475569; stroke:none; }
  .grid{ stroke:#94a3b8; fill:none; stroke-dasharray:4 4; }
  .curve{ fill:none; stroke:#0f172a; }
  .band1{ fill:#2563eb; opacity:.55; }
  .band2{ fill:#2563eb; opacity:.30; }
  .band3{ fill:#2563eb; opacity:.14; }
  .brk{ stroke:#1d4ed8; fill:none; }
  text{ font-size:13px; fill:#334155; }
  .pct{ font-size:14px; font-weight:600; fill:#1e3a8a; }
  .peak{ font-size:13px; fill:#475569; }
  figcaption{ font-size:13px; line-height:1.55; color:#475569; margin-top:10px; }
  .fail{ font-size:14px; line-height:1.6; color:#334155; }
  @media (prefers-color-scheme: dark){
    html,body{ background:#0b1220; color:#e5eaf3; }
    .axis{ stroke:#94a3b8; }
    .head{ fill:#94a3b8; }
    .grid{ stroke:#64748b; }
    .curve{ stroke:#e5eaf3; }
    .band1{ fill:#60a5fa; opacity:.60; }
    .band2{ fill:#60a5fa; opacity:.34; }
    .band3{ fill:#60a5fa; opacity:.16; }
    .brk{ stroke:#93c5fd; }
    text{ fill:#cbd5e1; }
    .pct{ fill:#bfdbfe; }
    .peak{ fill:#94a3b8; }
    figcaption{ color:#94a3b8; }
    .fail{ color:#cbd5e1; }
  }
</style>
</head>
<body>
<figure>
  <h2>Правило 68–95–99.7: μ = 0, σ = 1</h2>
  <div id="plot"></div>
  <figcaption>Первая сигма даёт 68 пунктов, вторая добавляет всего 27, третья — 4,7. За тремя сигмами остаётся 0,3%.</figcaption>
</figure>
<script>
(function(){
  var host = document.getElementById('plot');
  try{
    /* ---- холст (литералы: только размеры) ---- */
    var W = 760, H = 436;

    /* ---- данные схемы (в единицах x = сигмы, y = плотность) ---- */
    var BANDS = [
      { k:3, pct:"99,7%", depth:-0.150, cls:"band3" },
      { k:2, pct:"95%",   depth:-0.105, cls:"band2" },
      { k:1, pct:"68%",   depth:-0.060, cls:"band1" }
    ];
    var TICKS = [
      {x:-3,t:"\u22123\u03C3"}, {x:-2,t:"\u22122\u03C3"}, {x:-1,t:"\u22121\u03C3"},
      {x:0,t:"\u03BC"},
      {x:1,t:"1\u03C3"}, {x:2,t:"2\u03C3"}, {x:3,t:"3\u03C3"}
    ];
    var XMAX = 3.6, XAXIS = 3.72, STEP = 0.02;
    var TICK_H = 0.008, BRK_EAR = 0.020, HEAD_W = 0.14, HEAD_H = 0.012;

    /* ---- единственный origin и единственный scale ---- */
    var ORIGIN = { x: W/2, y: 305 };
    var SCALE  = { x: 95, y: 700 };

    /* ---- единственная пара функций перевода ---- */
    function sx(x){ return ORIGIN.x + x * SCALE.x; }
    function sy(y){ return ORIGIN.y - y * SCALE.y; }

    /* плотность стандартного нормального распределения */
    function pdf(x){ return Math.exp(-x*x/2) / Math.sqrt(2*Math.PI); }

    function arc(a,b){
      var d = "", x;
      for(x = a; x <= b + STEP/2; x += STEP){
        d += (d ? "L" : "M") + sx(x).toFixed(2) + "," + sy(pdf(x)).toFixed(2);
      }
      return d;
    }
    function line(x1,y1,x2,y2,cls){
      return '<path class="'+cls+'" d="M'+sx(x1)+','+sy(y1)+'L'+sx(x2)+','+sy(y2)+'"/>';
    }
    function label(x,y,dx,dy,anchor,cls,t){
      return '<text x="'+(sx(x)+dx)+'" y="'+(sy(y)+dy)+'" text-anchor="'+anchor+'" class="'+cls+'">'+t+'</text>';
    }

    var s = '';

    /* закрашенные зоны: от широкой к узкой, вложенные */
    BANDS.forEach(function(b){
      s += '<path class="'+b.cls+'" d="M'+sx(-b.k)+','+sy(0)+arc(-b.k,b.k).slice(1)+
           'L'+sx(b.k)+','+sy(0)+'Z"/>';
    });

    /* ось x со стрелкой и засечками */
    s += line(-XAXIS,0,XAXIS,0,"axis");
    s += '<path class="head" d="M'+sx(XAXIS)+','+sy(0)+
         'L'+sx(XAXIS-HEAD_W)+','+sy(HEAD_H)+
         'L'+sx(XAXIS-HEAD_W)+','+sy(-HEAD_H)+'Z"/>';

    /* пунктиры от оси до кривой + подписи сигм под осью */
    TICKS.forEach(function(t){
      s += line(t.x,0,t.x,pdf(t.x),"grid");
      s += line(t.x,-TICK_H,t.x,TICK_H,"axis");
      s += label(t.x,0,0,18,"middle","",t.t);
    });

    /* кривая */
    s += '<path class="curve" d="'+arc(-XMAX,XMAX)+'"/>';

    /* скобки с процентами под осью: у каждой своя глубина, подписи не сходятся */
    BANDS.forEach(function(b){
      s += '<path class="brk" d="M'+sx(-b.k)+','+sy(b.depth+BRK_EAR)+
           'L'+sx(-b.k)+','+sy(b.depth)+
           'L'+sx(b.k)+','+sy(b.depth)+
           'L'+sx(b.k)+','+sy(b.depth+BRK_EAR)+'"/>';
      s += label(0,b.depth,0,15,"middle","pct","\u03BC \u00B1 "+b.k+"\u03C3 \u2014 "+b.pct);
    });

    /* подпись вершины: слева от центра, чтобы не спорить с пунктиром */
    s += label(0,pdf(0),-8,-6,"end","peak","центр \u03BC = 0");

    host.innerHTML =
      '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+
      '" preserveAspectRatio="xMidYMid meet" role="img" '+
      'aria-label="Колокол нормального распределения с зонами 68, 95 и 99,7 процентов">'+
      '<g stroke-width="1.6">'+s+'</g></svg>';
  }catch(e){
    host.innerHTML = '<p class="fail">Схема должна показывать колокол нормального распределения ' +
      'с μ = 0 и σ = 1 и три вложенные закрашенные зоны: μ ± 1σ покрывает 68% площади, ' +
      'μ ± 2σ — 95%, μ ± 3σ — 99,7%. Полосы растут непропорционально: вторая сигма ' +
      'добавляет 27 пунктов, третья — 4,7; за тремя сигмами остаётся 0,3%.</p>';
  }
})();
</script>
</body>
</html>
