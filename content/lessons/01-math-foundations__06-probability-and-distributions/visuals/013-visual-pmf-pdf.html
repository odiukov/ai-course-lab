<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Столбики против кривой</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1c2330; --muted:#5c6880; --axis:#66718a;
    --bar:#3b6fd4; --barTop:#2a52a0; --curve:#c2562a; --fill:rgba(194,86,42,.28);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12161e; --fg:#e8edf6; --muted:#9aa6bd; --axis:#7d89a3;
      --bar:#6f9bec; --barTop:#a9c4f7; --curve:#f09462; --fill:rgba(240,148,98,.30);
    }
  }
  html,body{margin:0;background:var(--bg);}
  .wrap{background:var(--bg);color:var(--fg);font:400 14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:8px 4px;}
  h2{margin:0 0 4px;font-size:15px;font-weight:600;text-align:center;}
  svg{display:block;width:100%;height:auto;max-height:480px;margin:0 auto;}
  .err{padding:10px;color:var(--muted);font-size:13px;}
</style>
</head>
<body>
<div class="wrap">
  <h2>Столбики против кривой: суммировать или мерить площадь</h2>
  <div id="host"><noscript class="err">Слева: шесть столбиков по 1/6 — PMF кубика, вероятности складывают. Справа: гладкая кривая веса, площадь от 44 до 46 кг — PDF, вероятность = площадь.</noscript></div>
</div>
<script>
(function(){
  var host=document.getElementById('host');
  try{
    var NS="http://www.w3.org/2000/svg";
    var W=880, H=430;

    // ---- данные схемы ----
    var DIE=[1,2,3,4,5,6], P=1/6;
    var MU=45, SD=1.6, LO=44, HI=46;

    // ---- одна система координат ----
    // мировые единицы: x — 0..24, y — 0..10 (низ осей = 0)
    var origin={x:56,y:372}, scale={x:33,y:31};
    function sx(x){ return origin.x + x*scale.x; }
    function sy(y){ return origin.y - y*scale.y; }

    var svg=document.createElementNS(NS,"svg");
    svg.setAttribute("viewBox","0 0 "+W+" "+H);
    svg.setAttribute("preserveAspectRatio","xMidYMid meet");
    svg.setAttribute("role","img");
    host.appendChild(svg);

    function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
    function txt(x,y,s,anchor,cls,size,weight){
      var t=el("text",{x:x,y:y,"text-anchor":anchor||"middle",
        fill:cls||"var(--fg)","font-size":size||13,"font-weight":weight||400,
        "font-family":'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif'});
      t.textContent=s; return t;
    }
    var defs=el("defs",{});
    var m=document.createElementNS(NS,"marker");
    m.setAttribute("id","ah");m.setAttribute("markerWidth","8");m.setAttribute("markerHeight","8");
    m.setAttribute("refX","7");m.setAttribute("refY","3");m.setAttribute("orient","auto");
    var mp=document.createElementNS(NS,"path");
    mp.setAttribute("d","M0,0 L7,3 L0,6 Z");mp.setAttribute("fill","var(--axis)");
    m.appendChild(mp);defs.appendChild(m);

    el("rect",{x:0,y:0,width:W,height:H,fill:"var(--bg)"});

    var LW=1.6, TICK=0.16; // толщина линий, длина засечки в мировых единицах

    function axes(x0,x1,yTop,xLab,yLab,anchorX){
      el("line",{x1:sx(x0),y1:sy(0),x2:sx(x1),y2:sy(0),stroke:"var(--axis)","stroke-width":LW,"marker-end":"url(#ah)"});
      el("line",{x1:sx(x0),y1:sy(0),x2:sx(x0),y2:sy(yTop),stroke:"var(--axis)","stroke-width":LW,"marker-end":"url(#ah)"});
      txt(sx(x1),sy(0)+18,xLab,"end","var(--muted)",12);
      txt(sx(x0)+6,sy(yTop)-6,yLab,anchorX||"start","var(--muted)",12);
    }

    /* ================= ЛЕВО: PMF кубика ================= */
    var LX0=0, barW=1.1, gap=0.45, hUnit=27; // 1/6 => P*hUnit мировых единиц по y
    axes(LX0,9.2,7.2,"исход","высота = вероятность");

    var bh=P*hUnit;
    DIE.forEach(function(k,i){
      var xL=LX0+0.7+i*(barW+gap);
      el("rect",{x:sx(xL),y:sy(bh),width:sx(xL+barW)-sx(xL),height:sy(0)-sy(bh),
        fill:"var(--bar)",opacity:.85});
      el("line",{x1:sx(xL),y1:sy(bh),x2:sx(xL+barW),y2:sy(bh),stroke:"var(--barTop)","stroke-width":LW});
      el("line",{x1:sx(xL+barW/2),y1:sy(0),x2:sx(xL+barW/2),y2:sy(-TICK),stroke:"var(--axis)","stroke-width":LW});
      txt(sx(xL+barW/2),sy(0)+18,String(k),"middle","var(--fg)",12);
      txt(sx(xL+barW/2),sy(bh)-7,"1/6","middle","var(--muted)",11);
    });

    // засечка 1/6 на оси y
    el("line",{x1:sx(LX0),y1:sy(bh),x2:sx(LX0-TICK),y2:sy(bh),stroke:"var(--axis)","stroke-width":LW});
    txt(sx(LX0)-9,sy(bh)+4,"1/6","end","var(--muted)",11);

    txt(sx(LX0+4.3),sy(6.9),"PMF · кубик","middle","var(--fg)",14,600);
    txt(sx(LX0+4.3),sy(6.1),"сумма всех высот = 1","middle","var(--muted)",12);
    txt(sx(LX0+4.3),sy(-1.15),"складываем высоты","middle","var(--bar)",13,600);

    /* ================= ПРАВО: PDF веса ================= */
    var RX0=13.2, RW=9.2;                    // мировые x осей справа
    var wLo=41.4, wHi=48.6;                  // диапазон веса на оси
    var kx=(RW-1.4)/(wHi-wLo);               // вес -> мировые x
    function wx(w){ return RX0+0.7+(w-wLo)*kx; }
    var pk=1/(SD*Math.sqrt(2*Math.PI));
    var ky=5.4/pk;                            // плотность -> мировые y
    function dens(w){ var z=(w-MU)/SD; return Math.exp(-.5*z*z)/(SD*Math.sqrt(2*Math.PI)); }
    function wy(w){ return dens(w)*ky; }

    axes(RX0,RX0+RW,7.2,"вес, кг","высота = плотность");

    // площадь 44..46
    var d=["M "+sx(wx(LO))+" "+sy(0)];
    for(var w=LO;w<=HI+1e-9;w+=0.1) d.push("L "+sx(wx(w))+" "+sy(wy(w)));
    d.push("L "+sx(wx(HI))+" "+sy(0)+" Z");
    el("path",{d:d.join(" "),fill:"var(--fill)",stroke:"none"});

    // кривая
    var c=[];
    for(var v=wLo;v<=wHi+1e-9;v+=0.1) c.push((c.length?"L ":"M ")+sx(wx(v))+" "+sy(wy(v)));
    el("path",{d:c.join(" "),fill:"none",stroke:"var(--curve)","stroke-width":2.2,"stroke-linejoin":"round"});

    [LO,HI].forEach(function(w){
      el("line",{x1:sx(wx(w)),y1:sy(0),x2:sx(wx(w)),y2:sy(wy(w)),stroke:"var(--curve)","stroke-width":LW,"stroke-dasharray":"4 3"});
      el("line",{x1:sx(wx(w)),y1:sy(0),x2:sx(wx(w)),y2:sy(-TICK),stroke:"var(--axis)","stroke-width":LW});
      txt(sx(wx(w)),sy(0)+18,String(w),"middle","var(--fg)",12);
    });
    txt(sx(wx(MU)),sy(0)+18,"45","middle","var(--muted)",12);
    el("line",{x1:sx(wx(MU)),y1:sy(0),x2:sx(wx(MU)),y2:sy(-TICK),stroke:"var(--axis)","stroke-width":LW});

    // подпись площади — внутри закраски, ниже вершины кривой
    txt(sx(wx(MU)),sy(2.1),"площадь","middle","var(--fg)",13,600);
    txt(sx(wx(MU)),sy(1.35),"от 44 до 46","middle","var(--fg)",12);

    // ровно 45 кг: подпись у хвоста стрелки, слева
    var tailX=wx(41.9), tailY=6.2;
    el("line",{x1:sx(tailX),y1:sy(tailY),x2:sx(wx(MU)-0.06),y2:sy(wy(MU)+0.35),
      stroke:"var(--axis)","stroke-width":LW,"marker-end":"url(#ah)"});
    txt(sx(tailX)-4,sy(tailY)-4,"ровно 45 кг: площадь 0","end","var(--muted)",12);

    txt(sx(RX0+RW/2),sy(6.9),"PDF · вес","middle","var(--fg)",14,600);
    txt(sx(RX0+RW/2),sy(-1.15),"меряем площадь","middle","var(--curve)",13,600);

    // разделитель
    el("line",{x1:sx(11.4),y1:sy(7.4),x2:sx(11.4),y2:sy(-1.6),stroke:"var(--axis)","stroke-width":1,"stroke-dasharray":"3 5",opacity:.5});

    // легенда
    txt(sx(11.4),sy(-2.3),"вся площадь под кривой = 1, как и сумма всех столбиков","middle","var(--muted)",12);
  }catch(e){
    host.innerHTML='<p class="err">Схема должна показывать: слева шесть столбиков по 1/6 (PMF кубика, вероятности складывают), справа гладкую кривую веса с закрашенной площадью от 44 до 46 кг (PDF, вероятность = площадь).</p>';
  }
})();
</script>
</body>
</html>
