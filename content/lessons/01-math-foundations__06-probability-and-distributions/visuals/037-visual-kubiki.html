<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Один кубик, два кубика, тридцать кубиков</title>
<style>
  :root{
    --bg:#fbfaf7; --fg:#1d2328; --muted:#5d6874; --axis:#8a939d;
    --bar1:#8aa0b8; --bar2:#4c7fb8; --bar3:#1f5c99; --hint:#b8563f;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171b; --fg:#e8ecf1; --muted:#9aa5b1; --axis:#5c6670;
      --bar1:#4c5c6e; --bar2:#5a8fc6; --bar3:#8ec2f5; --hint:#e58b6f;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{padding:12px 14px 14px;background:var(--bg);}
  h1{font-size:16px;line-height:1.3;margin:0 0 6px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:470px;background:var(--bg);}
  .fallback{font-size:14px;line-height:1.5;color:var(--fg);}
  text{font-family:inherit;}
</style>
<div class="wrap">
  <h1>Один кубик, два кубика, тридцать кубиков: плоское становится колоколом</h1>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    /* ---------- данные схемы ---------- */
    var flat = [[1,1],[2,1],[3,1],[4,1],[5,1],[6,1]];

    var two = [1,2,3,4,5,6,5,4,3,2,1].map(function(c,i){ return [1 + i*0.5, c/6]; });

    var sd = Math.sqrt((35/12)/30), thirty = [];
    for(var k=0;k<25;k++){
      var v = 2.3 + k*0.1;
      thirty.push([v, Math.exp(-Math.pow(v-3.5,2)/(2*sd*sd))]);
    }

    var PANELS = [
      {dx:0,    w:0.70, bars:flat,   fill:'var(--bar1)', caption:'1 кубик',              note:'плоско'},
      {dx:6.5,  w:0.42, bars:two,    fill:'var(--bar2)', caption:'среднее 2 кубиков',   note:'сумма 7'},
      {dx:13,   w:0.09, bars:thirty, fill:'var(--bar3)', caption:'среднее 30 кубиков',  note:'почти колокол'}
    ];
    var TICKS = [[1,'1'],[3.5,'3.5'],[6,'6']];

    /* ---------- единственный перевод координат ---------- */
    var origin = {x:45, y:250};
    var scale  = {x:48, y:200};
    function sx(x){ return origin.x + x * scale.x; }
    function sy(y){ return origin.y - y * scale.y; }

    /* ---------- пиксельные литералы: холст, отступы подписей, линии, шрифт ---------- */
    var VB_W = 1000, VB_H = 352;
    var PAD_TICK = 15, PAD_CAP = 20, LW = 1.5, FS = 14, FS_CAP = 15;

    var NS = 'http://www.w3.org/2000/svg';
    function el(n,a){ var e=document.createElementNS(NS,n); for(var k in a) e.setAttribute(k,a[k]); return e; }
    function label(x,y,dy,anchor,txt,fill,size,weight){
      var t = el('text',{x:x, y:y+dy, 'text-anchor':anchor, fill:fill,
        'font-size':(size||FS), 'font-weight':(weight||'400')});
      t.textContent = txt; return t;
    }

    var svg = el('svg',{viewBox:'0 0 '+VB_W+' '+VB_H, preserveAspectRatio:'xMidYMid meet',
      xmlns:NS, role:'img', 'aria-label':'Три распределения: плоское, горка, колокол'});
    svg.appendChild(el('rect',{x:0,y:0,width:VB_W,height:VB_H,fill:'var(--bg)'}));

    PANELS.forEach(function(p){
      var g = el('g',{});

      /* столбики */
      p.bars.forEach(function(b){
        var x0 = sx(p.dx + b[0] - p.w/2), x1 = sx(p.dx + b[0] + p.w/2);
        var yT = sy(b[1]), yB = sy(0);
        g.appendChild(el('rect',{x:x0, y:yT, width:Math.max(x1-x0,1), height:Math.max(yB-yT,1),
          fill:p.fill, stroke:'var(--bg)', 'stroke-width':0.5}));
      });

      /* ось панели от 1 до 6 */
      g.appendChild(el('line',{x1:sx(p.dx+0.6), y1:sy(0), x2:sx(p.dx+6.4), y2:sy(0),
        stroke:'var(--axis)', 'stroke-width':LW}));

      /* засечки и их подписи — снизу, middle */
      TICKS.forEach(function(t){
        g.appendChild(el('line',{x1:sx(p.dx+t[0]), y1:sy(0), x2:sx(p.dx+t[0]), y2:sy(-0.04),
          stroke:'var(--axis)', 'stroke-width':LW}));
        g.appendChild(label(sx(p.dx+t[0]), sy(-0.04), PAD_TICK, 'middle', t[1], 'var(--muted)'));
      });

      /* подпись панели — ниже засечек, middle */
      g.appendChild(label(sx(p.dx+3.5), sy(-0.13), PAD_CAP, 'middle', p.caption, 'var(--fg)', FS_CAP, '600'));

      /* короткая пометка — НАД столбиками, middle */
      g.appendChild(label(sx(p.dx+3.5), sy(1.12), 0, 'middle', p.note, 'var(--hint)'));

      svg.appendChild(g);
    });

    /* пунктир по 3.5 у третьей панели: среднее прижимается к 3.5 */
    var p3 = PANELS[2];
    svg.appendChild(el('line',{x1:sx(p3.dx+3.5), y1:sy(0), x2:sx(p3.dx+3.5), y2:sy(1.05),
      stroke:'var(--hint)', 'stroke-width':LW, 'stroke-dasharray':'4 4'}));

    /* легенда одной строкой под схемой */
    svg.appendChild(label(sx(10), sy(-0.35), PAD_CAP, 'middle',
      'По горизонтали — значение от 1 до 6, по вертикали — как часто оно выпадает.',
      'var(--muted)'));
    svg.appendChild(label(sx(10), sy(-0.45), PAD_CAP, 'middle',
      'Исходное распределение не менялось: меняется только число усредняемых бросков.',
      'var(--muted)'));

    host.appendChild(svg);
  }catch(e){
    host.innerHTML = '<p class="fallback">Схема должна была показать три графика подряд: ' +
      'один кубик — шесть одинаковых столбиков (плоско); среднее двух кубиков — горка ' +
      'с пиком на сумме 7 (то есть на среднем 3.5); среднее тридцати кубиков — почти ' +
      'идеальный колокол, который вдобавок сузился вокруг 3.5.</p>';
  }
})();
</script>
</html>
