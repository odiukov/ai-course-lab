- concept: логарифм произведения равен сумме логарифмов множителей
  question: Заполни пропуск в формуле для положительных вероятностей событий A и B.
  explanation: 'Логарифм превращает произведение вероятностей в сумму: log(a · b) = log(a) + log(b). Поэтому логарифм вероятности последовательности можно вычислять сложением логарифмов её множителей.'
  kind: cloze
  template: ln(P(A) · P(B)) = ___
  answer: ln(P(A)) + ln(P(B))
  accept:
    - ln P(A) + ln P(B)
    - log(P(A)) + log(P(B))
    - log P(A) + log P(B)
  id: 041-log-veroyatnosti-1
  fingerprint: a525bd7f
- concept: из двух логарифмических вероятностей большей вероятности соответствует менее отрицательное значение
  question: Модель присвоила трём вариантам логарифмические вероятности. Какой вариант наиболее вероятен?
  explanation: Логарифм — возрастающая функция, поэтому он сохраняет порядок вероятностей. Наибольшее, то есть наименее отрицательное, значение здесь равно −5.2, значит вариант B наиболее вероятен.
  kind: choice
  options:
    - 'Вариант A: ln P(A) = −8.4'
    - 'Вариант B: ln P(B) = −5.2'
    - 'Вариант C: ln P(C) = −6.1'
  correct: 1
  id: 041-log-veroyatnosti-2
  fingerprint: 2eb38424
