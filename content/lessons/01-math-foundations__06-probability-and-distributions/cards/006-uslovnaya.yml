- concept: условная вероятность равна вероятности совместного наступления событий, делённой на вероятность условия
  question: Восстановите формулу условной вероятности.
  explanation: После наступления B новым пространством исходов становится только событие B. Числитель оставляет исходы, где произошли и A, и B, а деление на P(B) нормирует их вероятность внутри нового пространства.
  kind: cloze
  template: P(A | B) = ___
  answer: P(A ∩ B) / P(B)
  accept:
    - P(A and B) / P(B)
    - P(A и B) / P(B)
  id: 006-uslovnaya-1
  fingerprint: 4c17ebbf
- concept: события независимы, если условие не изменяет вероятность другого события
  question: Какое равенство означает, что события A и B независимы?
  explanation: 'При независимости знание о наступлении B не даёт новой информации о событии A, поэтому вероятность A после введения условия остаётся прежней. Эквивалентная запись: P(A ∩ B) = P(A) · P(B).'
  kind: choice
  options:
    - P(A | B) = P(A)
    - P(A | B) = P(B)
    - P(A ∩ B) = P(A) + P(B)
    - P(A | B) = P(A ∩ B)
  correct: 0
