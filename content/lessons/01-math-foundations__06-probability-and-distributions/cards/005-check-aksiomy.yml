- concept: вероятность события при равновозможных исходах равна доле подходящих исходов
  question: В мешке лежат 7 красных и 9 синих жетонов. Все жетоны вытягиваются с одинаковой вероятностью. Какова вероятность вытянуть красный жетон?
  explanation: Подходят 7 красных жетонов из 16 жетонов всего. Поэтому вероятность равна 7/16 = 0.4375.
  kind: numeric
  answer: 0.4375
  tolerance: 0.0001
  id: 005-check-aksiomy-1
  fingerprint: 4280e3af
- concept: вероятность отдельного события не может превышать вероятность всего пространства исходов
  question: Может ли вероятность отдельного события быть больше вероятности пространства всех возможных исходов? Объясни через аксиомы вероятности.
  explanation: 'По аксиоме P(S) = 1: всё пространство исходов уже охватывает всё, что может случиться. Поэтому значение вроде 1.2 не является вероятностью и указывает на ошибку.'
  kind: open
  reference: Нет. Вероятность всего пространства исходов равна 1, а любое событие является его частью, поэтому вероятность события не может быть больше 1.
  id: 005-check-aksiomy-2
  fingerprint: 6e7c8a35
