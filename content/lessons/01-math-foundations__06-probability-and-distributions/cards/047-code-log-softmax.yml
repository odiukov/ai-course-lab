- concept: одинаковые логиты дают одинаковые логарифмические вероятности
  question: Для логитов [7, 7, 7, 7] вычисли значение любой компоненты log_softmax. Округли результат до четырёх знаков после запятой.
  explanation: Одинаковые логиты дают равные вероятности. При четырёх классах вероятность каждого равна одной четверти, поэтому log_softmax возвращает ln одной четверти, то есть −ln(4) ≈ −1.3863.
  kind: numeric
  answer: -1.3863
  tolerance: 0.0001
  id: 047-code-log-softmax-1
  fingerprint: a0affcca
- concept: при вычислении log_softmax поправленный log-sum-exp вычитается из исходных логитов
  question: Заполни выражение возврата в численно устойчивой реализации log_softmax.
  explanation: В log_sum_exp максимум уже восстановлен после сдвига. Поэтому это общее нормирующее значение нужно вычитать из исходного логита. Если вместо него снова использовать сдвинутый логит, максимум будет учтён дважды и результат перестанет быть нормированным.
  kind: cloze
  template: |-
    max_logit = max(logits)
    shifted = [z - max_logit for z in logits]
    log_sum_exp = max_logit + math.log(sum(math.exp(z) for z in shifted))
    return [___ for z in logits]
  answer: z - log_sum_exp
  accept:
    - z-log_sum_exp
    - (z - log_sum_exp)
  id: 047-code-log-softmax-2
  fingerprint: 9e5be657
