- concept: PMF применяется к случайным величинам с отдельными перечислимыми исходами
  question: Для какой случайной величины естественно задать PMF?
  explanation: Категории образуют дискретный набор отдельных исходов, поэтому каждой из них можно назначить конкретную вероятность. Температура, время и масса обычно моделируются как непрерывные величины с плотностью.
  kind: choice
  options:
    - Выбранная моделью категория изображения
    - Точная температура воздуха
    - Продолжительность выполнения запроса
    - Масса посылки
