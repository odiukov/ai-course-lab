- concept: PMF напрямую задаёт вероятность каждого конкретного значения дискретной случайной величины
  question: Что возвращает функция вероятности PMF при подстановке допустимого значения k дискретной случайной величины X?
  explanation: Значение PMF в точке k — это непосредственно P(X = k). Для получения этой вероятности не требуется интегрирование по промежутку.
  kind: choice
  options:
    - Вероятность события X = k
    - Плотность вероятности в окрестности k
    - Среднее значение случайной величины
    - Вероятность всех значений, меньших k
  correct: 0
