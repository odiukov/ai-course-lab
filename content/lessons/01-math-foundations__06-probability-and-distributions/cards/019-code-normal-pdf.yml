- concept: параметр mu задаёт положение центра нормальной плотности
  question: Как изменится график `normal_pdf`, если увеличить `mu`, оставив `sigma` прежней?
  explanation: Плотность зависит от разности `x - mu`, поэтому изменение `mu` переносит центр кривой. При неизменной `sigma` её ширина и высота не меняются.
  kind: choice
  options:
    - Сдвинется вправо без изменения формы
    - Станет уже и выше
    - Станет шире и ниже
    - Отразится относительно горизонтальной оси
  correct: 0
  id: 019-code-normal-pdf-1
  fingerprint: 7a3a471a
- concept: показатель экспоненты строится из квадрата стандартизованного отклонения с отрицательным знаком
  question: Расположите операции вычисления экспоненциальной части `normal_pdf` в правильном порядке.
  explanation: Сначала вычисляется стандартизованное отклонение `(x - mu) / sigma`, затем его квадрат получает отрицательный коэффициент. Благодаря отрицательному знаку плотность уменьшается по мере удаления от `mu`.
  kind: order
  items:
    - Вычесть `mu` из `x`
    - Разделить полученную разность на `sigma`
    - Возвести результат в квадрат
    - Умножить квадрат на отрицательную половину
    - Вычислить экспоненту
  id: 019-code-normal-pdf-2
  fingerprint: e6b5101b
- concept: увеличение sigma расширяет нормальную плотность и уменьшает её максимум
  question: Объясните своими словами, как изменится нормальная плотность при увеличении `sigma` и какую роль в этом играют множитель перед экспонентой и её показатель.
  explanation: 'В `normal_pdf` параметр `sigma` участвует в обеих частях формулы: управляет скоростью спада от центра и обратно масштабирует высоту плотности.'
  kind: open
  reference: Кривая становится шире и ниже. Деление отклонения на большую `sigma` замедляет спад экспоненты, а обратная зависимость коэффициента от `sigma` уменьшает высоту кривой, сохраняя общую площадь.
  id: 019-code-normal-pdf-3
  fingerprint: 608c43fe
