- concept: метка правильного класса выбирает целевой логит по индексу
  question: Как определить целевой логит при вычислении cross-entropy для одного объекта?
  explanation: Целевой логит задаётся истинной меткой, а не предсказанием модели. Если автоматически брать максимум, loss перестанет штрафовать неверную классификацию.
  kind: choice
  options:
    - Взять элемент массива логитов, индекс которого совпадает с меткой правильного класса
    - Всегда взять максимальный логит модели
    - Взять среднее всех логитов
    - Выбрать логит с наименьшим абсолютным значением
  correct: 0
  id: 050-check-loss-1
  fingerprint: f5bfdd1f
- concept: cross-entropy учитывает уверенность модели даже при правильном argmax
  question: Две модели правильно выбрали класс с максимальным логитом. У первой целевой логит лишь немного выше остальных, а у второй — заметно выше. У какой модели обычно меньше cross-entropy loss?
  explanation: Правильный argmax ещё не означает одинаковую уверенность. Чем сильнее целевой логит превосходит конкурентов, тем выше вероятность правильного класса после softmax и тем меньше минус её логарифма.
  kind: choice
  options:
    - У первой, потому что её логиты расположены ближе друг к другу
    - У второй, потому что softmax назначит правильному классу большую вероятность
    - Loss обязательно одинаков, поскольку обе модели выбрали правильный класс
    - Определить невозможно даже при известных остальных логитах
  correct: 1
  id: 050-check-loss-2
  fingerprint: dfb646f8
