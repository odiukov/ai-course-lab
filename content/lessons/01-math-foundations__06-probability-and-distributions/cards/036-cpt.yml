- concept: совокупный эффект множества независимых малых ошибок часто имеет приблизительно нормальное распределение
  question: Объясни своими словами, почему суммарная ошибка измерительного прибора может быть приблизительно нормально распределена, даже если отдельные источники ошибки не нормальны.
  explanation: Нормальная форма возникает у совокупного результата, потому что в него входят многие независимые причины. Для применения этой идеи отдельные причины сами не обязаны иметь нормальное распределение.
  kind: open
  reference: Общая ошибка складывается из множества небольших примерно независимых вкладов. По центральной предельной теореме распределение такой суммы приближается к нормальному независимо от формы распределений отдельных вкладов.
