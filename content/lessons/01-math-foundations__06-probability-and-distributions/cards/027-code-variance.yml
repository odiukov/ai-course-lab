- concept: нулевая дисперсия означает отсутствие разброса среди исходов с положительной вероятностью
  question: В каком случае дисперсия дискретной случайной величины равна нулю?
  explanation: Все слагаемые p·(v−μ)² неотрицательны. Их сумма равна нулю, только если каждый исход с положительной вероятностью совпадает с математическим ожиданием.
  kind: choice
  options:
    - Все значения с положительной вероятностью совпадают
    - Вероятности всех исходов различны
    - Математическое ожидание не является возможным исходом
  correct: 0
  id: 027-code-variance-1
  fingerprint: 2956d09e
- concept: дисперсия не меняется при сдвиге всех значений на одну константу
  question: К каждому возможному значению случайной величины прибавили одну и ту же константу. Как изменится дисперсия и почему?
  explanation: При общем сдвиге значения и математическое ожидание изменяются одинаково. Разность v−μ, её квадрат и взвешенная сумма квадратов поэтому сохраняются.
  kind: open
  reference: 'Дисперсия не изменится: математическое ожидание сдвинется на ту же константу, поэтому отклонения значений от нового среднего останутся прежними.'
  id: 027-code-variance-2
  fingerprint: 286f8802
