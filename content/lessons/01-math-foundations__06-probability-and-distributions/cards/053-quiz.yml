- concept: апостериорная вероятность учитывает базовую частоту и ложноположительные срабатывания
  question: Дефект встречается в 8% деталей. Детектор находит 85% дефектных деталей и ошибочно срабатывает на 7% исправных. Какова вероятность дефекта при положительном результате детектора, в процентах?
  explanation: Истинное срабатывание имеет вероятность 0.08 × 0.85 = 0.068, ложное — 0.92 × 0.07 = 0.0644. Поэтому P(дефект | срабатывание) = 0.068 / (0.068 + 0.0644) ≈ 51.36%.
  kind: numeric
  answer: 51.36
  tolerance: 0.05
  id: 053-quiz-1
  fingerprint: 31373e5e
- concept: логиты являются ненормализованными оценками, подаваемыми в softmax
  question: Заполни пропуск названием сырых выходов классификационной модели.
  explanation: Логиты могут быть любыми вещественными числами и не обязаны суммироваться в единицу. Softmax преобразует их в распределение вероятностей.
  kind: cloze
  template: probabilities = softmax(___)
  answer: logits
  accept:
    - логиты
    - z
    - сырые логиты
  id: 053-quiz-2
  fingerprint: 539ee122
- concept: сэмплирование порождает случайный исход согласно заданному распределению
  question: Почему повторное сэмплирование из одного и того же распределения модели может давать разные токены?
  explanation: Распределение задаёт шансы исходов, а не единственный обязательный результат. Ненулевую вероятность выбора имеют все токены с ненулевой вероятностью.
  kind: open
  reference: 'Сэмплирование — случайная процедура: каждый токен выбирается с вероятностью, назначенной ему распределением. Поэтому отдельные результаты могут различаться, хотя при большом числе повторений их частоты приближаются к заданным вероятностям.'
  id: 053-quiz-3
  fingerprint: fda45879
