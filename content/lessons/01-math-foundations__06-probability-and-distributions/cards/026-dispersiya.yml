- concept: дисперсия равна среднему квадрату отклонения случайной величины от её математического ожидания
  question: Случайная величина с равными вероятностями принимает значения 7 и 13. Чему равна её дисперсия?
  explanation: Математическое ожидание равно 10. Отклонения составляют −3 и 3, их квадраты равны 9, поэтому среднее квадратов также равно 9.
  kind: numeric
  answer: 9
  tolerance: 0.05
  id: 026-dispersiya-1
  fingerprint: f3eaf232
- concept: стандартное отклонение сохраняет единицы измерения случайной величины, а дисперсия использует их квадрат
  question: Случайная величина измеряется в миллисекундах. В каких единицах измеряются её дисперсия и стандартное отклонение?
  explanation: При вычислении дисперсии отклонения возводятся в квадрат, поэтому квадрат получают и единицы измерения. Стандартное отклонение — корень из дисперсии, так что оно измеряется в тех же единицах, что и исходная величина.
  kind: choice
  options:
    - Дисперсия — в миллисекундах в квадрате, стандартное отклонение — в миллисекундах
    - Обе величины — в миллисекундах
    - Дисперсия — в миллисекундах, стандартное отклонение — без единиц
    - Обе величины — в миллисекундах в квадрате
  correct: 0
