- concept: высокая дисперсия градиентов делает обновления параметров шумными и снижает устойчивость обучения
  question: Почему большая дисперсия градиентов может мешать стабильному обучению модели, даже если среднее направление градиента полезно?
  explanation: Среднее направление описывает общий тренд, а дисперсия — изменчивость отдельных обновлений. При большой дисперсии полезный средний сигнал маскируется сильными колебаниями градиентов.
  kind: open
  reference: Отдельные оценки градиента сильно отклоняются от среднего, поэтому обновления параметров заметно меняются от батча к батчу. Шаги оптимизатора становятся шумными, и движение к минимуму оказывается менее устойчивым.
  id: 026-dispersiya-3
  fingerprint: '18656548'
