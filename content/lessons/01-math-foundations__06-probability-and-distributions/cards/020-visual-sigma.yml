- concept: симметрия нормального распределения делит вероятность за пределами трёх стандартных отклонений поровну между хвостами
  question: Какой примерно процент значений нормального распределения находится в одном хвосте дальше трёх стандартных отклонений от среднего?
  explanation: 'В пределах трёх сигм находится около 99,7% значений, поэтому снаружи остаётся 0,3%. Нормальное распределение симметрично: на каждый хвост приходится половина, то есть примерно 0,15%.'
