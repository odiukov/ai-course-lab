- concept: порядок вычислений в численно устойчивой реализации softmax
  question: Расположите операции реализации softmax в правильном порядке.
  explanation: Сначала логиты сдвигают для численной устойчивости, затем экспоненцируют и нормализуют общей суммой экспонент.
  kind: order
  items:
    - Найти максимальный логит
    - Вычесть найденный максимум из каждого логита
    - Вычислить экспоненты сдвинутых логитов
    - Сложить полученные экспоненты
    - Разделить каждую экспоненту на их общую сумму
  id: 045-code-softmax-1
  fingerprint: b8848a13
- concept: инвариантность softmax к общему аддитивному сдвигу логитов
  question: 'Заполните пропуск: прибавление одной константы ко всем логитам не меняет результат softmax.'
  explanation: Общий сдвиг умножает все экспоненты на одинаковый множитель e^c. Он сокращается при делении каждой экспоненты на их сумму.
  kind: cloze
  template: softmax([z + c for z in logits]) == ___
  answer: softmax(logits)
  accept:
    - softmax(logits)
  id: 045-code-softmax-2
  fingerprint: e5905480
- concept: кросс-энтропия для целевого класса равна log-sum-exp всех логитов минус целевой логит
  question: Выразите кросс-энтропийную потерю для заданного целевого класса непосредственно через логиты и объясните преобразование.
  explanation: Логарифм softmax целевого класса равен его логиту минус log-sum-exp всех логитов. Смена знака даёт выражение для кросс-энтропии.
  kind: open
  reference: Потеря равна log-sum-exp всех логитов минус логит целевого класса. Это следует из отрицания логарифма вероятности целевого класса после softmax.
  id: 045-code-softmax-3
  fingerprint: 4edc03f7
