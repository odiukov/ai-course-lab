- concept: вероятность интервала равна площади под функцией плотности на этом интервале
  question: Случайная величина X имеет постоянную плотность f(x) = 0.5 на отрезке [7, 9]. Чему равна вероятность P(7.4 ≤ X ≤ 8.2)?
  explanation: 'Плотность постоянна, поэтому вероятность равна площади прямоугольника: 0.5 × (8.2 − 7.4) = 0.4.'
  kind: numeric
  answer: 0.4
  tolerance: 0.001
  id: 012-pdf-1
  fingerprint: 54ccf3e4
- concept: значение функции плотности может превышать единицу, поскольку оно не является вероятностью
  question: Для непрерывной случайной величины в некоторой точке c получено f(c) = 2.7. Как это правильно интерпретировать?
  explanation: Ограничение единицей относится к вероятности, но не к высоте плотности. Плотность может быть равна 2.7 или больше, если её интеграл по всей области остаётся равным единице.
  kind: choice
  options:
    - 'Это допустимо: f(c) — плотность, а вероятность интервала определяется площадью под её графиком'
    - Это невозможно, потому что значение любой PDF должно быть не больше единицы
    - Это означает, что P(X = c) равна 2.7
    - Это однозначно означает, что PDF не нормирована
  correct: 0
  id: 012-pdf-2
  fingerprint: d558337a
- concept: вероятность отдельного точного значения непрерывной случайной величины равна нулю
  question: У непрерывной случайной величины плотность в точке c положительна. Почему из этого не следует, что P(X = c) положительна?
  explanation: Высота f(c) описывает концентрацию вероятности рядом с c, а не вероятность самой точки. Положительная вероятность возникает у промежутка ненулевой ширины.
  kind: open
  reference: Вероятность определяется площадью под плотностью. Одна точка имеет нулевую ширину, поэтому площадь над ней и вероятность точного значения равны нулю, даже если плотность в этой точке положительна.
  id: 012-pdf-3
  fingerprint: b8b23379
