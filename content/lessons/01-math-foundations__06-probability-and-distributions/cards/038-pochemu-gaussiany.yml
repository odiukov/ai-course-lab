- concept: гауссовость начальных весов задаётся разработчиком, а гауссовость шума SGD возникает из агрегирования градиентов
  question: Объясни своими словами, почему нормальное распределение появляется при инициализации весов и в шуме SGD по разным причинам.
  explanation: Гауссовская инициализация — осознанный способ задать случайный масштаб стартовых весов. Приблизительная гауссовость шума SGD — следствие агрегирования множества градиентных вкладов, то есть проявление центральной предельной теоремы.
  kind: open
  reference: 'При нормальной инициализации разработчик сам выбирает распределение, из которого независимо сэмплируются начальные веса. Шум SGD не задаётся нормальным напрямую: он часто становится приблизительно нормальным из-за усреднения вкладов градиентов множества примеров.'
