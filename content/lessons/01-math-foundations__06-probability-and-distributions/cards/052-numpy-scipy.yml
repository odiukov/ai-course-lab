- concept: доверительный уровень описывает частоту покрытия параметра при повторении процедуры
  question: Как корректно интерпретировать заявленный уровень доверия для интервала?
  explanation: 'Уровень 95% относится к процедуре: при многократном повторении исследования примерно 95% построенных интервалов накроют истинный параметр. Он не означает, что уже вычисленный фиксированный интервал содержит параметр с вероятностью 95%.'
  kind: choice
  options:
    - При многократном повторении выборки и построения интервала заданная доля таких интервалов накрывает истинный параметр
