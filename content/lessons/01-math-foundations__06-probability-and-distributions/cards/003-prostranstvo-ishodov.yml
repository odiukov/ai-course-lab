- concept: пространство элементарных исходов должно включать все возможности без взаимного пересечения
  question: Каким двум требованиям должен удовлетворять список элементарных исходов случайного эксперимента?
  explanation: 'В одном испытании реализуется ровно один элементарный исход: исходы не могут произойти одновременно, а пропущенных возможных результатов быть не должно.'
