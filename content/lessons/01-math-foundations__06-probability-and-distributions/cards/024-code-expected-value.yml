- concept: zip прекращает обработку на конце более короткого списка
  question: Что произойдёт, если функция использует zip(values, probabilities), но списки имеют разную длину?
  explanation: Обычный zip завершается вместе с самым коротким аргументом. Поэтому функция может вернуть правдоподобное, но неверное значение; длины списков следует проверять отдельно.
  kind: choice
  options:
    - Обработка молча остановится на конце более короткого списка, а лишние элементы будут проигнорированы
    - Python автоматически дополнит короткий список нулевыми значениями
    - Python будет повторять элементы короткого списка по кругу
    - zip обязательно выбросит исключение из-за несовпадения длин
