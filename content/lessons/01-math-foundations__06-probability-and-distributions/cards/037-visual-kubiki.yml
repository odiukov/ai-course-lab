- concept: центральная предельная теорема требует независимых слагаемых
  question: Случайную величину записали много раз без новых независимых испытаний, а затем усреднили получившиеся копии. Почему центральная предельная теорема не гарантирует колоколообразное распределение такого среднего?
  explanation: Для эффекта центральной предельной теоремы нужны независимые случайные вклады. Если один бросок просто скопировать 30 раз, среднее копий останется равным результату этого броска, а распределение останется плоским.
  kind: open
  reference: Все копии полностью зависимы и содержат один и тот же случайный результат. Их среднее совпадает с исходной величиной, поэтому увеличение числа копий не создаёт сумму независимых вкладов и не меняет форму распределения.
  id: 037-visual-kubiki-2
  fingerprint: 46c0a258
