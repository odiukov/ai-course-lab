- concept: уменьшение вероятности правильного класса в несколько раз увеличивает кросс-энтропию на логарифм этого множителя
  question: Вероятность правильного класса уменьшилась в k раз, где k больше единицы. Как изменилась кросс-энтропийная потеря?
  explanation: Если исходная вероятность равна p, а новая — p/k, то новая потеря равна −ln(p/k) = −ln(p) + ln(k). Поэтому потеря увеличивается на ln(k).
  kind: choice
  options:
    - Увеличилась на ln(k)
    - Уменьшилась на ln(k)
    - Увеличилась в k раз
  correct: 0
  id: 048-cross-entropy-1
  fingerprint: 8c7dedf2
- concept: вероятность правильного класса восстанавливается из кросс-энтропии экспонентой с отрицательным показателем
  question: Восстанови вероятность правильного класса из значения кросс-энтропийной потери.
  explanation: 'Экспонента обращает натуральный логарифм: из L = −ln(p) следует ln(p) = −L, поэтому p = exp(−L). Большей потере соответствует меньшая вероятность правильного класса.'
  kind: cloze
  template: Если L = -ln(p), то p = ___
  answer: exp(-L)
  accept:
    - e^(-L)
    - e^{-L}
    - exp(-L)
  id: 048-cross-entropy-2
  fingerprint: 47aa674f
