- concept: softmax сохраняет порядок логитов
  question: Для трёх классов выполняется z_A < z_B < z_C. Как соотносятся вероятности после softmax?
  explanation: Экспонента строго возрастает, а все экспоненты делятся на один и тот же положительный знаменатель. Поэтому большему логиту всегда соответствует большая вероятность.
  kind: choice
  options:
    - p_A < p_B < p_C
    - p_A > p_B > p_C
    - Все вероятности станут равными
    - Порядок вероятностей невозможно определить
  correct: 0
  id: 043-logity-softmax-1
  fingerprint: e985e942
- concept: отношение двух вероятностей softmax экспоненциально зависит от разности их логитов
  question: Заполни пропуск в формуле отношения вероятностей двух классов после softmax.
  explanation: 'Общий знаменатель softmax сокращается: exp(z_a) / exp(z_b) = exp(z_a - z_b). Поэтому линейная разница между логитами превращается в экспоненциальное отношение вероятностей.'
  kind: cloze
  template: p_a / p_b = ___
  answer: exp(z_a - z_b)
  accept:
    - e^(z_a - z_b)
    - exp(z_a-z_b)
    - e^{z_a-z_b}
  id: 043-logity-softmax-2
  fingerprint: acd17e9d
