- concept: математическое ожидание дискретной случайной величины вычисляется как сумма исходов, взвешенных их вероятностями
  question: Случайная величина принимает значение −4 с вероятностью 0.35 и значение 8 с вероятностью 0.65. Чему равно её математическое ожидание?
  explanation: 'Нужно умножить каждый исход на его вероятность и сложить результаты: (−4) · 0.35 + 8 · 0.65 = −1.4 + 5.2 = 3.8.'
  kind: numeric
  answer: 3.8
  tolerance: 0.01
  id: 023-ozhidanie-1
  fingerprint: 92a0c346
- concept: математическое ожидание описывает средний результат множества испытаний и не обязано быть возможным отдельным исходом
  question: Как правильно интерпретировать математическое ожидание случайной величины?
  explanation: Математическое ожидание учитывает вероятности исходов как веса. Оно характеризует средний результат при многократном повторении эксперимента, поэтому само значение ожидания не обязано встречаться в отдельном испытании.
  kind: choice
  options:
    - Это всегда наиболее вероятный исход
    - Это среднее арифметическое различных исходов без учёта их вероятностей
    - Это средний результат в длинной серии испытаний, который может не совпадать ни с одним отдельным исходом
  correct: 2
  id: 023-ozhidanie-2
