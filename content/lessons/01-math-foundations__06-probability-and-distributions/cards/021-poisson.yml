- concept: вероятность конкретного числа событий вычисляется по PMF распределения Пуассона
  question: Система получает в среднем 4 аварийных сигнала за смену. Согласно распределению Пуассона, какова вероятность получить ровно 7 сигналов? Округли ответ до четырёх знаков после запятой.
  explanation: Здесь λ = 4 и k = 7. Подстановка в формулу даёт P(X = 7) = 4^7 · e^(-4) / 7! ≈ 0.0595.
  kind: numeric
  answer: 0.0595
  tolerance: 0.0001
  id: 021-poisson-2
  fingerprint: ba6dbbbe
