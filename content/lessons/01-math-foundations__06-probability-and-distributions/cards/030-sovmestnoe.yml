- concept: совместное распределение задаёт вероятность каждого сочетания значений двух случайных величин
  question: Что описывает одна ячейка совместной PMF двух дискретных случайных величин X и Y?
  explanation: Совместная PMF сопоставляет вероятность каждой паре значений. Запись P(X = x, Y = y) означает вероятность того, что оба указанных равенства выполнятся одновременно.
  kind: choice
  options:
    - Вероятность того, что X или Y примет любое допустимое значение
    - Вероятность одновременного выполнения X = x и Y = y
    - Среднее значение величин X и Y
    - Разность вероятностей отдельных значений X и Y
  correct: 1
  id: 030-sovmestnoe-1
  fingerprint: c619581a
- concept: отдельные распределения двух величин не определяют, как часто их значения встречаются совместно
  question: Почему знания отдельных распределений погоды и наличия зонта недостаточно, чтобы восстановить их совместное распределение?
  explanation: Итоги по каждой величине теряют информацию о сочетаниях. Поэтому одинаковые вероятности погоды и наличия зонта по отдельности могут возникнуть при разных связях между ними.
  kind: open
  reference: Отдельные распределения показывают частоты значений каждой величины, но не сообщают, какие значения встречаются вместе. Одним и тем же отдельным распределениям могут соответствовать разные вероятности пар.
  id: 030-sovmestnoe-2
  fingerprint: d36ea16b
