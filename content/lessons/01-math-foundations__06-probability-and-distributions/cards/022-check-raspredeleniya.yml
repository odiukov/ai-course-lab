- concept: симметричные непрерывные значения, сосредоточенные около среднего, естественно моделировать нормальным распределением
  question: Погрешность датчика принимает непрерывные положительные и отрицательные значения. Малые отклонения встречаются часто, а большие — всё реже и примерно симметрично. Какое распределение подходит и почему?
  explanation: 'Описанная форма соответствует нормальному распределению: основная масса значений находится около среднего, а вероятность уменьшается по мере удаления от него.'
  kind: open
