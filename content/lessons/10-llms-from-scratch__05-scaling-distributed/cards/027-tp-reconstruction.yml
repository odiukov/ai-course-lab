- concept: tensor parallelism математически точен, поэтому заметная максимальная абсолютная ошибка относительно полного matmul указывает на дефект сборки, а не на приближённость метода
  question: Собранный из шардов выход сравнили с обычным полным матричным умножением и взяли максимальную абсолютную разницу. Получилось 0.84. Объясните своими словами, почему такое значение нельзя списать на погрешность вычислений, и что искать в коде.
  explanation: 'Ключ в том, что tensor parallelism — точный метод, а не аппроксимация. Поэтому сравнение с полным matmul работает как строгий тест: любая заметная ошибка однозначно диагностирует баг. Типичные источники: срезы весов заданы не по формуле start = gpu_id × shard_size, end = start + shard_size; куски склеены в другом порядке; выбрана ось батча вместо последней оси.'
  kind: open
  reference: 'Разрезание по выходной размерности не меняет арифметику: каждый выходной столбец считается целиком, просто на своём устройстве, из тех же чисел. Значит результат обязан совпадать с полным matmul точно, а расхождение допустимо лишь на уровне машинного эпсилона (порядка 1e-7 для float32, 1e-15 для float64) из-за округления при сложении. Разница 0.84 на много порядков больше — это дефект сборки, а не приближение. Искать надо: неверные границы среза столбцов (перекрытие или пропуск столбцов весов), перепутанный порядок частичных результатов при склейке (форма остаётся правильной, но значения стоят не в своих столбцах), неправильная ось конкатенации, либо несоответствие шарда весов тому, что вернула GPU.'
  id: 027-tp-reconstruction-3
  fingerprint: 60bf1ce7
