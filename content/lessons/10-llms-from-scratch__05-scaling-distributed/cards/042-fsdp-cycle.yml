- concept: в FSDP градиенты слоя сводятся reduce-scatter, а не all-reduce, потому что каждой GPU нужна только её часть градиентов
  question: 'Backward слоя в FSDP посчитан: на каждой GPU лежит градиент по полным параметрам слоя. Какая коллективная операция завершает шаг так, чтобы у каждой карты остался только её кусок градиента?'
  explanation: 'All-reduce дал бы каждой карте полный сведённый градиент — это ровно то состояние, которое FSDP хранить не собирается. Reduce-scatter делает сложение и раздачу одним движением: каждая GPU получает сведённый градиент только по своему шарду, и объём принятых данных в N раз меньше полного градиента.'
  kind: cloze
  template: |-
    # после backward слоя
    dist.___(output=grad_shard, input=full_layer_grad)  # свести и разложить по шардам
  answer: reduce_scatter
  accept:
    - reduce-scatter
    - reduce scatter
    - reduce_scatter_tensor
    - reduceScatter
  id: 042-fsdp-cycle-1
  fingerprint: df270106
- concept: шаг оптимизатора в FSDP выполняется локально без обмена, потому что шарды весов, градиентов и состояния оптимизатора совпадают по индексам
  question: Объясни своими словами, почему в FSDP шаг оптимизатора не требует ни одной коллективной операции, хотя forward и backward без обмена невозможны.
  explanation: 'Ключ — разница между поэлементной операцией и свёрткой по всем параметрам. Adam обновляет координаты независимо, matmul смешивает их все. Отсюда и распределение коллективов по итерации: all-gather перед вычислениями, reduce-scatter после backward, и ничего на самом шаге оптимизатора.'
  kind: open
  reference: 'Обновление веса поэлементно: новое значение параметра зависит только от старого значения этого же параметра, его градиента и моментов Adam для него же. После reduce-scatter карта держит сведённый градиент ровно по тем индексам, по которым держит веса и состояние оптимизатора — три шарда выровнены. Значит все входы формулы обновления уже локальны, чужие данные не нужны. Обмен нужен матричному умножению: там каждый выход зависит от всех параметров слоя, поэтому перед вычислением делается all-gather. Следующая связь с другими картами возникает только на all-gather на следующем forward.'
  id: 042-fsdp-cycle-2
  fingerprint: 27fe1af8
- concept: освобождение собранных параметров сразу после forward обменивает второй all-gather на снижение пика памяти
  question: В FSDP параметры слоя, собранные для forward, отбрасываются сразу после него, а перед backward собираются повторно. Что изменится, если реализация оставит собранные параметры жить от forward до backward этого слоя?
  explanation: Это обмен памяти на обмен данными. Хранение собранного слоя убирает один all-gather, но между forward и backward слоя проходят все остальные слои, так что удержанный полный слой добавляется к пику. Reduce-scatter при этом никуда не девается — он про градиенты, а не про параметры, и градиенты всё равно надо свести по картам.
  kind: choice
  options:
    - Исчезнет повторный all-gather, но полный слой будет занимать память всё время между его forward и backward
    - Исчезнет reduce-scatter градиентов, потому что параметры уже собраны на всех картах
    - 'Сократится и обмен, и пик памяти: повторная сборка — чистые накладные расходы'
    - 'Ничего не изменится: all-gather на backward выполняется из локального кэша и данных по сети не передаёт'
