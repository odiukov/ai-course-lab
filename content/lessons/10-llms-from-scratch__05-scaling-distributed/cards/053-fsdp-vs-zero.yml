- concept: выбор реализации распределённого обучения ведётся от списка требований к состоянию и переносу данных, а завершается измерением на своём кластере, а не сравнением популярности фреймворков
  question: Модель не помещается на 12 GPU. Расставь шаги выбора между двумя реализациями распределённого обучения в правильном порядке.
  explanation: 'ZeRO-3 и FSDP шардируют одно и то же, поэтому одно название ничего не обещает по памяти или скорости. Решают возможности вокруг механизма (набор стадий, поддержка offload, интеграция) и итог измерения на конкретном железе: у ZeRO-1 экономия ~4×, у ZeRO-2 ~8×, у ZeRO-3 ~N× — но реальный пик и время шага видно только на запуске.'
  kind: order
  items:
    - 'Зафиксировать требования: какие статьи состояния обучения нужно шардировать и допустима ли выгрузка в CPU RAM или на NVMe'
    - Проверить, какие из этих требований каждая реализация поддерживает и с какими ограничениями
    - Запустить кандидатов на своём кластере и измерить пик памяти на GPU и время шага
    - Зафиксировать выбор по результатам измерения
  id: 053-fsdp-vs-zero-1
  fingerprint: 42b96df7
- concept: совместимость с уже используемым стеком обучения (запуск, чекпоинты, API) — самостоятельный критерий выбора реализации шардирования, потому что базовый механизм у кандидатов совпадает
  question: 'Команда обучает модель на стандартном стеке PyTorch: свой цикл обучения, штатное сохранение и загрузка чекпоинтов, привычный запуск процессов. Нужно полное шардирование параметров, градиентов и состояний оптимизатора; выгрузка на CPU или NVMe не требуется. Какой аргумент здесь наиболее весом при выборе между родной реализацией PyTorch и внешним фреймворком?'
  explanation: 'Полное шардирование — это ZeRO-3, и оно эквивалентно FSDP: механизм тот же, разработан независимо. Раз требования по памяти закрывают обе реализации и offload не нужен, различие остаётся в возможностях вокруг механизма — и здесь весит цена интеграции с существующим запуском и чекпоинтами. Первенство идеи не даёт выигрыша в памяти, а объём обмена задаётся стратегией шардирования, а не брендом.'
  kind: choice
  options:
    - 'Стоимость интеграции: механизм шардирования у кандидатов одинаков, поэтому решает, во что обойдётся перестройка запуска и формата чекпоинтов'
    - Внешний фреймворк исторически первым реализовал идею, значит его шардирование эффективнее по памяти
    - Родная реализация всегда даёт меньший объём обмена по сети при том же числе GPU
    - Внешний фреймворк обязателен, потому что только он умеет шардировать состояния оптимизатора
