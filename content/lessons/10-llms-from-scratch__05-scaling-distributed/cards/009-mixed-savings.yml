- concept: хранение мастер-копии весов в полной точности рядом с низкоразрядными весами возвращает сэкономленный объём обратно в бюджет
  question: Реализация держит веса в половинной точности для прямого и обратного прохода, но дополнительно хранит мастер-копию тех же весов в одинарной точности для шага оптимизатора. Градиенты — половинной точности, оба момента Adam — одинарной. Как итоговый расход памяти соотносится с обучением, где всё хранится в одинарной точности?
  explanation: 'Для модели на 12 млрд параметров: одинарная точность — 48 (веса) + 48 (градиенты) + 96 (два момента) = 192 ГБ. С мастер-копией — 24 (веса) + 48 (мастер-копия) + 96 (моменты) + 24 (градиенты) = 192 ГБ. Сэкономленные на весах и градиентах 48 ГБ ровно съедены мастер-копией. Экономию даёт только та схема, где полноразрядной копии весов рядом нет.'
  kind: choice
  options:
    - 'Примерно совпадает: добавленная мастер-копия равна тому объёму, который освободили веса и градиенты'
    - Примерно вдвое меньше, потому что веса и градиенты стали вдвое уже
    - Примерно на треть меньше, потому что моменты Adam тоже ужимаются
    - Больше вдвое, потому что каждая статья дублируется в двух форматах
