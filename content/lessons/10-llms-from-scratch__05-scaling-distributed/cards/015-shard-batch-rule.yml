- concept: размер шарда = целочисленное деление батча на число GPU, плюс один пример первым `remainder` устройствам
  question: 'Батч из 58 примеров делится между 7 GPU: сначала все получают одинаковый базовый кусок, а остаток раздают по одному примеру устройствам с наименьшими номерами (нумерация с нуля). Сколько примеров получит GPU с номером 2?'
  explanation: 58 // 7 = 8 — базовый кусок, 58 % 7 = 2 — остаток. Лишние примеры уходят GPU с номерами 0 и 1, поэтому у них по 9, а у GPU 2 остаётся базовые 8. Сумма 9+9+8·5 = 58 — весь батч разобран.
  kind: numeric
  answer: 8
  tolerance: 0.5
  id: 015-shard-batch-rule-1
  fingerprint: b832b57e
- concept: позиция следующего шарда сдвигается на фактическую длину выданного куска, а не на базовый размер
  question: Заполните пропуск в цикле нарезки батча по GPU так, чтобы шарды не пересекались и между ними не было пропущенных примеров.
  explanation: Курсор обязан двигаться на длину реально выданного куска. Сдвиг только на shard_size оставил бы примеры-«довески» непрочитанными следующей итерацией и выдал бы их повторно.
  kind: cloze
  template: |-
    shard = data[offset:offset + shard_size + extra]
    offset += ___
  answer: shard_size + extra
  accept:
    - shard_size+extra
    - len(shard)
    - extra + shard_size
  id: 015-shard-batch-rule-2
  fingerprint: 8680eee2
- concept: 'вычисление старта шарда как номер_GPU × базовый_размер при неравных шардах ломает границы: появляются и повторы, и потери'
  question: Батч из 44 примеров делится между 6 GPU, размеры шардов получились 8, 8, 7, 7, 7, 7. Начало своего куска каждая GPU считает как «номер GPU × базовый размер 7», а длину берёт свою — с учётом остатка. Что произойдёт с данными?
  explanation: Стартовая позиция считается по базовому размеру 7, а первые две GPU читают по 8 примеров. Их последний пример снова попадёт в шард соседа, а суммарно прочитанный диапазон закончится раньше 44-го примера. Отсюда одновременно и дубли, и потери. Единственная надёжная схема — накапливать offset по фактическим длинам.
  kind: choice
  options:
    - 'ничего страшного: каждый пример всё равно обработается ровно один раз'
    - хвосты увеличенных шардов повторятся в начале следующих, а последние примеры батча вообще не попадут ни на одну GPU
    - остаток будет потерян, но повторов не возникнет
    - все шарды станут одинакового размера, остаток растворится
  correct: 1
  id: 015-shard-batch-rule-3
  fingerprint: 075c35c5
