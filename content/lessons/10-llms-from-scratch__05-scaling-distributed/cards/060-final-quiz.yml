- concept: all-reduce эквивалентен reduce-scatter с последующим all-gather, поэтому пара этих операций стоит примерно столько же, сколько один all-reduce
  question: Объясни своими словами, как all-reduce выражается через две другие коллективные операции, и почему это объясняет стоимость связи в схеме, где градиенты сводятся reduce-scatter, а параметры собираются all-gather.
  explanation: 'Разложение на две фазы показывает, что reduce-scatter и all-gather — половинки all-reduce: первая делает арифметику и оставляет каждому по 1/N, вторая восстанавливает полный тензор у всех. Полезно как оценка сверху при сравнении схем связи.'
  kind: open
  reference: 'All-reduce = reduce-scatter + all-gather. На первом этапе данные складываются поэлементно, но каждая GPU получает только свой кусок суммы (1/N результата). На втором этапе куски склеиваются, и полная сумма оказывается у всех. Именно так устроена кольцевая реализация: две фазы по кольцу. Следствие: пара «reduce-scatter градиентов + all-gather параметров» по объёму сравнима с одним all-reduce, поэтому шардирование состояния не удваивает трафик само по себе — трафик растёт из-за того, что параметры приходится собирать заново на каждом слое и в прямом, и в обратном проходе.'
  id: 060-final-quiz-3
  fingerprint: 11cc2d66
