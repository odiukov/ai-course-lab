- concept: all-reduce оставляет на каждой GPU тензор исходного размера, а all-gather — конкатенацию, в N раз большую
  question: На каждой из 8 GPU лежит тензор из 250 миллионов элементов. Сначала группа выполняет all-reduce, затем — all-gather тех же исходных тензоров. Сколько миллионов элементов будет занимать результат all-gather на одной GPU?
  explanation: 'All-reduce складывает поэлементно: форма выхода равна форме входа, то есть 250 млн элементов, одинаковых у всех GPU. All-gather арифметики не делает, а склеивает куски всех участников: 8 × 250 = 2000 млн элементов. Отсюда и разница в стоимости по памяти: all-gather раздувает буфер в число участников раз, all-reduce — нет.'
  kind: numeric
  answer: 2000
  tolerance: 1
  id: 060-final-quiz-1
  fingerprint: 88d21833
- concept: по медленному межузловому каналу режут модель по слоям, потому что pipeline передаёт только активации на границах стадий, а tensor parallelism — после каждого разрезанного слоя
  question: 'Модель из 96 слоёв: один слой на GPU помещается, вся модель — нет. Доступны 4 узла, внутри узла NVLink, между узлами — обычный Ethernet. Какую ось разделения модели между узлами выбрать?'
  explanation: Pipeline передаёт по медленному каналу только активации на границе стадий — один обмен на группу слоёв. Tensor parallelism требует обмена внутри каждого разрезанного слоя, десятки раз за проход, поэтому его группу держат внутри узла на NVLink. Data parallelism полную копию модели на узле не уменьшает, а модель по условию не помещается. Микробатчи влияют только на пузырь, но не на размещение весов.
  kind: choice
  options:
    - 'Tensor parallelism на все 4 узла: разрезать каждую матрицу весов на 4 части'
    - 'Pipeline parallelism между узлами: отдать каждому узлу свою группу слоёв'
    - 'Data parallelism между узлами: держать полную копию модели на каждом узле'
    - 'Ничего не менять: увеличить число микробатчей'
  correct: 1
  id: 060-final-quiz-2
