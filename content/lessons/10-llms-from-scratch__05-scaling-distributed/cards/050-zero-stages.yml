- concept: 'последовательные стадии ZeRO снимают дублирование по одной статье памяти: сначала состояния оптимизатора, затем градиенты, затем параметры'
  question: Расставь по порядку, что именно начинает шардироваться между GPU по мере перехода к более агрессивным стадиям ZeRO (от самой мягкой к самой агрессивной).
  explanation: 'ZeRO снимает дублирование не рывком, а по статье за раз. Первая стадия берёт самую крупную статью при Adam — состояния оптимизатора (~4× экономии), вторая добавляет градиенты (~8×), третья добавляет параметры (~N× при N GPU). Третья стадия механически эквивалентна FSDP: параметры слоя собираются all-gather перед вычислением и освобождаются после.'
  kind: order
  items:
    - делятся состояния оптимизатора, параметры и градиенты остаются целиком на каждой GPU
    - дополнительно делятся градиенты, полная копия параметров ещё на каждой GPU
    - дополнительно делятся сами параметры, полной модели постоянно нет ни на одной GPU
  id: 050-zero-stages-1
  fingerprint: a6785b25
- concept: экономия памяти по стадиям шардирования оплачивается ростом связанности вычисления с коммуникацией, и лишь шардирование одних состояний оптимизатора обходится без нового обмена
  question: Кластер соединён медленной сетью, и любой дополнительный коллективный обмен внутри прямого прохода дорог. Какая степень шардирования состояния обучения даёт экономию памяти, практически не меняя объём и структуру обмена относительно обычного data parallel?
  explanation: Состояния оптимизатора нужны только на шаге обновления, поэтому их разрезание не добавляет коллективов в forward/backward — обмен остаётся как у data parallel. Шардирование градиентов слегка меняет схему сведения, а шардирование параметров вводит all-gather перед каждым разрезанным слоем — десятки коллективов за проход. Чем меньше дублирования, тем теснее вычисление связано с коммуникацией.
  kind: choice
  options:
    - шардирование только состояний оптимизатора
    - шардирование состояний оптимизатора и градиентов
    - шардирование состояний оптимизатора, градиентов и параметров
    - любое шардирование требует одинакового обмена, разницы нет
  correct: 0
