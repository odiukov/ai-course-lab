- concept: выгрузка состояния обучения в CPU RAM или на NVMe расширяет доступный объём за счёт медленного канала, то есть меняет скорость на ёмкость, а не убирает потребность в памяти
  question: Объясни своими словами, что даёт и чего стоит выгрузка состояний оптимизатора в CPU RAM (или на NVMe SSD) по сравнению с их шардированием между GPU.
  explanation: 'Ключ в различении двух осей: шардирование раскладывает бюджет по устройствам, выгрузка спускает его по иерархии памяти. Первое стоит железа и коллективного обмена, второе — времени на медленной шине. На практике их комбинируют: агрессивная стадия шардирования плюс выгрузка того, что нужно реже всего.'
  kind: open
  reference: 'Шардирование делит состояние между устройствами: объём на GPU падает пропорционально числу карт, но суммарно требуется столько же быстрой HBM, то есть нужны сами GPU. Выгрузка вместо этого переносит состояние на более дешёвую и ёмкую память уровнем ниже — CPU RAM, а в пределе NVMe SSD, — освобождая память GPU без добавления карт. Плата — пропускная способность и задержка канала до этой памяти: выгруженные операции (в первую очередь шаг оптимизатора и перекачка тензоров туда-обратно) идут медленнее, поэтому это осознанный размен скорости на доступный объём. Выгрузка не отменяет потребность в памяти, а лишь размещает её там, где память дешевле.'
  id: 050-zero-stages-3
  fingerprint: b314a3e1
