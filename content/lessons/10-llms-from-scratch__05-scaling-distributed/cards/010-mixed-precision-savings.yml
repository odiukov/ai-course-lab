- concept: вырожденный вход (пустая модель) обнуляет знаменатель, поэтому относительная экономия для него не определена и требует явной обработки
  question: Функция принимает число параметров и возвращает долю сэкономленной памяти как дополнение отношения бюджетов до единицы. Что произойдёт при вызове с нулевым числом параметров и как это обработать?
  explanation: 'Относительная величина существует только при ненулевой базе. Формула вида «единица минус новый бюджет, делённый на базовый» ломается ровно тогда, когда базовый бюджет пуст. Это единственный вход, где линейность не спасает: для любого положительного числа параметров множитель сокращается и доля одна и та же.'
  kind: open
  reference: 'При нулевом числе параметров обе суммы обращаются в ноль, знаменатель отношения пуст, и вычисление падает с делением на ноль (либо даёт NaN на float). Доля экономии здесь не определена по смыслу: экономить нечего, относительной величины у пустого бюджета нет. Обрабатывают явной проверкой в начале функции — вернуть ноль как соглашение либо возбудить ошибку о некорректном вводе. Важно, что это отдельная ветка, а не результат общей формулы.'
