- concept: относительная экономия памяти не зависит от размера модели, потому что оба бюджета линейны по числу параметров и оно сокращается в отношении
  question: Функция сравнивает бюджет памяти обучения в полной и в пониженной разрядности и возвращает относительную экономию. Для модели на 13 млрд параметров экономия вышла 60 % бюджета. Сколько процентов сэкономит та же схема форматов для модели на 65 млрд параметров?
  explanation: Каждая статья бюджета — это число параметров, умноженное на байты формата. Значит оба бюджета пропорциональны числу параметров, и при делении одного на другой множитель сокращается. Модель крупнее в пять раз, но обе суммы растут одинаково, поэтому доля экономии остаётся прежней — 60 %. Меняются абсолютные гигабайты, а не доля.
  kind: numeric
  answer: 60
  tolerance: 3
  id: 010-mixed-precision-savings-1
  fingerprint: 9777a48d
- concept: относительная экономия = единица минус отношение нового бюджета к базовому; перевёрнутое отношение даёт отрицательный результат
  question: 'Есть два посчитанных бюджета памяти: базовый (полная разрядность) и новый (пониженная разрядность), новый меньше. Какое выражение возвращает долю сэкономленной памяти?'
  explanation: Отношение нового бюджета к базовому — доля памяти, которая осталась; сэкономленная доля — дополнение до единицы. Если перевернуть отношение, оно окажется больше единицы (базовый бюджет крупнее), и «экономия» выйдет отрицательной. Голое отношение нового к базовому — доля оставшегося, а не сэкономленного. Деление разности на новый бюджет считает прирост относительно уменьшенной базы, а не долю исходного бюджета.
  kind: choice
  options:
    - Из единицы вычесть отношение нового бюджета к базовому
    - Из единицы вычесть отношение базового бюджета к новому
    - Отношение нового бюджета к базовому
    - Разность бюджетов, делённую на новый бюджет
