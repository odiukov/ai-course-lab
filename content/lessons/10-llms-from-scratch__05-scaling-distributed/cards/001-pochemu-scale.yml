- concept: память под веса не зависит от размера батча, поэтому при нехватке места на веса помогает только разделение модели между устройствами
  question: Обучение падает с out of memory. Одни веса модели занимают 60 ГБ, у видеокарты 48 ГБ памяти. Что реально устранит причину?
  explanation: 'Батч, длина последовательности и checkpointing влияют только на активации. Веса, градиенты и состояния оптимизатора занимают фиксированный объём при любом батче: если одни веса больше памяти карты, модель не стартует даже с батчем в один пример. Помогает только шардирование состояния между устройствами.'
  kind: choice
  options:
    - Уменьшить размер батча до одного примера
    - Сократить длину последовательности вдвое
    - Разделить веса модели между несколькими GPU
    - Включить пересчёт активаций (gradient checkpointing)
  correct: 2
  id: 001-pochemu-scale-1
  fingerprint: 6b56e60e
- concept: полный бюджет памяти обучения = веса + градиенты + два момента Adam
  question: Модель на 30 миллиардов параметров обучают с Adam. Веса, градиенты и обе оценки моментов оптимизатора хранятся по 2 байта на число. Сколько гигабайт памяти нужно под это состояние (без активаций)?
  explanation: 'На параметр приходится 4 сущности: вес, градиент, первый момент, второй момент. При 2 байтах каждая это 8 байт на параметр. 30e9 × 8 байт = 240 ГБ. Именно поэтому крупные модели требуют нескольких GPU ещё до учёта активаций.'
  kind: numeric
  answer: 240
  tolerance: 5
  id: 001-pochemu-scale-2
  fingerprint: cfd9530e
- concept: 'несколько GPU не образуют единую память автоматически: нужен явный план разделения состояния и обмен данными, который стоит времени'
  question: Почему добавление ещё одной видеокарты не даёт автоматически удвоенную память для одной модели? Объясни своими словами, что приходится решать дополнительно.
  explanation: 'Ключевая мысль: память суммируется только логически, через явную схему шардирования. Цена — коммуникация и синхронизация, из-за чего плохое разделение оставляет часть устройств простаивать.'
  kind: open
  reference: 'У каждой GPU своя память и свои вычислительные блоки, общего адресного пространства нет. Чтобы использовать суммарную память, нужно явно решить, какая часть состояния (веса, градиенты, состояния оптимизатора, слои, примеры батча) лежит на каком устройстве. Дальше устройства обязаны синхронизироваться: при разрезании модели передаются промежуточные активации между шагами, при разных примерах на разных устройствах согласуются градиенты. Это добавляет сетевой обмен и простой в ожидании друг друга, поэтому N GPU дают меньше, чем N-кратное ускорение, и выбор схемы разделения становится частью проектирования обучения.'
  id: 001-pochemu-scale-3
  fingerprint: 15e41596
