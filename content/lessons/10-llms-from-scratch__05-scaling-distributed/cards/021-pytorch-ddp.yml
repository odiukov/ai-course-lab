  question: 'Запуск на 2 узлах по 8 GPU: всего 16 процессов. Какая переменная должна стоять в выборе устройства, чтобы процессы на втором узле не обращались к несуществующим GPU?'
  explanation: На втором узле rank принимает значения 8..15, а физических GPU в узле всего 8 (индексы 0..7). local_rank как раз и есть индекс внутри узла, он всегда 0..7. rank же уникален глобально и нужен для логирования, чекпоинтов и разбиения данных, а не для выбора карты.
