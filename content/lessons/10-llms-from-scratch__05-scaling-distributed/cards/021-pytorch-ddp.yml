- concept: 'порядок операций одной итерации DDP: раздача непересекающихся шардов, локальный forward/backward со сведением градиентов, локальный шаг оптимизатора'
  question: Расставь операции одной итерации обучения с DistributedDataParallel в правильном порядке.
  explanation: 'Обмен встроен в backward: DDP группирует параметры в бакеты и стартует all-reduce, как только бакет готов, перекрывая связь с оставшимися вычислениями. Шаг оптимизатора идёт уже после сведения, иначе процессы обновятся разными градиентами.'
  kind: order
  items:
    - DistributedSampler выдаёт каждому процессу свой непересекающийся фрагмент батча
    - Каждый процесс выполняет forward на своём фрагменте и считает локальный loss
    - Backward считает локальные градиенты, и DDP запускает их all-reduce по готовности
    - Каждый процесс вызывает свой optimizer.step() и получает те же веса, что и остальные
