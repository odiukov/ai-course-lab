- concept: накладные расходы относительно полезной работы не ограничены единицей, а доля простоя от общего времени всегда меньше единицы
  question: Конвейер из 5 стадий прогоняет всего 2 микробатча, такт стадии одинаков. Что верно про две метрики — накладные такты относительно полезной работы и долю простоя от всего доступного GPU-времени?
  explanation: Лишних тактов S−1=4. Накладные расходы = 4/2 = 200% (знаменатель — только полезные такты, поэтому величина не ограничена сверху). Доля простоя = 4/(2+4) = 4/6 ≈ 67% (знаменатель — всё время, поэтому строго меньше 100%). Число само по себе ничего не называет, пока не сказано, на что поделили лишние такты.
  kind: choice
  options:
