- concept: при FSDP/ZeRO-3 на число GPU делятся веса, градиенты и состояние оптимизатора, но не активации
  question: Обучение модели требует 140 ГБ под веса, 140 ГБ под градиенты и 560 ГБ под состояние оптимизатора. Активации составляют 24 ГБ на каждую GPU. Кластер — 16 GPU, стратегия FSDP. Сколько гигабайт памяти нужно на одну GPU?
  explanation: 'FSDP распределяет все три статьи хранимого состояния: (140 + 140 + 560) / 16 = 52.5 ГБ. Активации остаются целиком у каждой карты, так как порождаются её локальным батчем: 52.5 + 24 = 76.5 ГБ. Если бы весь итог 864 ГБ делили одной строкой на 16, получилось бы 54 ГБ — заниженная и опасная оценка.'
  kind: numeric
  answer: 76.5
  tolerance: 0.5
  id: 006-budget-model-1
  fingerprint: '24536205'
- concept: рост числа GPU при неизменном локальном батче не уменьшает память под активации
  question: Кластер расширили с 16 до 64 GPU, стратегия шардирования и батч на одну GPU остались прежними. Что произойдёт с памятью под активации на одной карте?
  explanation: Шардирование делит хранимое состояние — веса, градиенты, моменты оптимизатора. Активации возникают заново при каждом прямом проходе на локальных данных карты, поэтому их объём задаётся длиной контекста, батчем на GPU, скрытой размерностью и числом слоёв, а не размером кластера. Уменьшить их можно только меньшим локальным батчем, коротким контекстом или пересчётом активаций (gradient checkpointing).
  kind: choice
  options:
    - Уменьшится вчетверо, как и остальные статьи бюджета
    - 'Останется прежней: каждая карта считает свой локальный батч'
    - Уменьшится, но только при оптимизаторе без моментов
    - Вырастет вчетверо из-за обмена данными между картами
  correct: 1
  id: 006-budget-model-2
  fingerprint: 4fff647a
- concept: пригодность конфигурации определяется итогом на одну GPU, а не суммой памяти по кластеру
  question: Расчёт даёт 1200 ГБ суммарно по кластеру из 64 GPU и 110 ГБ на одну GPU. Лимит памяти одной карты — 96 ГБ. Какой вывод верен?
  explanation: 'Память не общая: каждая карта должна разместить свою часть у себя. Обучение упадёт с OOM при 110 > 96, независимо от суммарной ёмкости кластера. Сумма по кластеру отвечает на другой вопрос — сколько памяти занято всеми картами вместе. Чтобы пройти лимит, нужно перейти к более агрессивному шардированию или уменьшить неделимую часть — активации.'
  kind: choice
  options:
    - 'Конфигурация проходит: суммарные 1200 ГБ покрываются ёмкостью 64 карт'
    - 'Конфигурация проходит: средняя нагрузка 1200/64 ниже 96 ГБ'
    - 'Конфигурация не проходит: 110 ГБ на карту превышают её лимит 96 ГБ'
  correct: 2
  id: 006-budget-model-3
  fingerprint: 4da1d36c
