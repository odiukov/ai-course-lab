- concept: в паре column-parallel + row-parallel выход первого слоя остаётся шардированным и служит входным шардом второго, поэтому обмен нужен только в конце
  question: 'FFN трансформера: расширяющий слой сделан column-parallel, сжимающий — row-parallel. Расставьте операции одной GPU и кластера в порядке выполнения за один проход блока.'
  explanation: Долевой выход column-parallel слоя по форме ровно совпадает с тем, что нужно row-parallel слою на вход, поэтому собирать его конкатенацией между слоями не нужно. Нелинейность поэлементная, значит её можно применить к шарду локально. Коммуникация остаётся одна — суммирование после второго слоя, вместо двух обменов.
  kind: order
  items:
    - GPU умножает полный вход на свой блок столбцов весов расширяющего слоя и получает свою долю скрытых признаков
    - GPU применяет нелинейность поэлементно к своей доле скрытых признаков, без обмена с соседями
    - GPU подаёт эту долю как свой входной шард в сжимающий слой и умножает на свой блок строк его весов
    - Частичные выходы сжимающего слоя суммируются между GPU (all-reduce sum) и дают итог блока
