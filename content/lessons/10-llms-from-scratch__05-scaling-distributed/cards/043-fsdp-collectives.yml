- concept: all-gather только объединяет непересекающиеся куски без арифметики над значениями, reduce-scatter выполняет арифметику над совпадающими по форме тензорами и лишь потом делит результат
  question: 'Объясни своими словами, чем all-gather принципиально отличается от reduce-scatter с точки зрения того, что происходит со значениями: где данные просто перекладываются, а где над ними считают.'
  explanation: 'Ключ — что подаётся на вход. В all-gather входы дополняют друг друга (части одного целого), в reduce-scatter входы конкурируют (разные версии одного и того же), поэтому их нельзя склеить, а нужно сложить. Вторая половина имени reduce-scatter отличает её от all-reduce: результат не копируется всем целиком, а сразу режется на шарды — ровно то, что нужно FSDP, где каждая GPU постоянно хранит только свою долю градиентов.'
  kind: open
  reference: 'У all-gather на входе у каждой GPU свой непересекающийся кусок общего тензора; операция раздаёт куски всем, и каждая GPU складывает из них полную копию конкатенацией. Значения не меняются — это чистое размножение и склейка. У reduce-scatter на входе у каждой GPU тензор одинаковой формы (полный по размеру, но со своими значениями). Операция сначала поэлементно сводит эти тензоры между GPU (сложение или усреднение — значения меняются), а затем отдаёт каждой GPU только её срез итога, а не весь итог. Итог: all-gather расширяет данные без вычислений, reduce-scatter вычисляет и сужает.'
  id: 043-fsdp-collectives-2
  fingerprint: db919cfa
- concept: 'reduce-scatter уменьшает объём на GPU в N раз: вход — тензор полного размера у каждой GPU, выход — 1/N этого размера'
  question: 'Слой содержит 600 млн параметров. 12 GPU выполняют reduce-scatter градиентов этого слоя: каждая подаёт на вход свой локальный градиент полного размера. Сколько миллионов значений градиента остаётся у одной GPU после операции?'
  explanation: 'На входе у каждой GPU 600 млн значений (полная форма слоя, свои числа). reduce-scatter сводит их поэлементно и раздаёт итог кусками: 600 / 12 = 50 млн на GPU. Если бы вместо неё выполнили all-reduce, у каждой осталось бы 600 млн — сведённый итог целиком, что противоречит шардированному хранению. All-gather работает в противоположную сторону: из шарда 50 млн собирает 600 млн на каждой GPU.'
  kind: numeric
  answer: 50
  tolerance: 0.1
  id: 043-fsdp-collectives-3
