- concept: 'прохождение по памяти не даёт вывода о сроке прогона: время задаётся пропускной способностью и обменом, поэтому целевые требования — отдельный, независимый от бюджета памяти класс входных данных'
  question: 'Расчёт показал: при выбранной стратегии постоянная память 40 ГБ и пик 61 ГБ на карту при 80 ГБ HBM, 128 GPU. Какой вывод из этого расчёта сделать НЕЛЬЗЯ?'
  explanation: Бюджет памяти отвечает только на вопрос «поместится ли». Срок и стоимость определяются пропускной способностью, а она зависит от топологии связей, объёма коллективных обменов и доли простоя — эти величины в расчёт памяти не входят. Поэтому целевая пропускная способность, дедлайн и бюджет собираются как отдельные требования наравне с размером модели и характеристиками железа.
  kind: choice
  options:
    - что прогон уложится в отведённое время
    - что состояние обучения при этой стратегии помещается на карту
    - что остаётся около 19 ГБ запаса на неучтённые служебные расходы
    - что без шардирования того же состояния карта была бы переполнена
  correct: 0
  id: 059-training-planner-1
  fingerprint: f9dfd37f
- concept: число шагов накопления градиентов = целевой глобальный батч / (число data-parallel реплик × локальный микробатч)
  question: Целевой глобальный батч — 1024 примера. Data parallel развёрнут на 128 реплик, а по памяти на одну реплику влезает микробатч только из 2 примеров. Сколько шагов накопления градиентов нужно на одну итерацию оптимизатора?
  explanation: 'За один прямой/обратный проход кластер обрабатывает 128 × 2 = 256 примеров. Чтобы шаг оптимизатора считался по 1024 примерам, надо накопить градиенты за 1024 / 256 = 4 прохода. Так целевой батч из требований превращается в конкретную пару решений: степень data parallel и число шагов накопления. Если результат не целый, подгоняют микробатч или число реплик.'
  kind: numeric
  answer: 4
  tolerance: 0.01
  id: 059-training-planner-2
  fingerprint: 0991d0df
- concept: 'требования превращаются в план в порядке зависимости: сначала бюджет памяти, затем оси параллелизма по топологии, затем data parallel под целевой батч, затем компромиссы по остатку памяти, и только потом измерение'
  question: Расставь шаги составления плана распределённого обучения в порядке, при котором каждый следующий шаг опирается на результат предыдущего.
  explanation: 'Порядок задан зависимостями: без бюджета памяти неизвестно, сколько состояния надо разрезать; без топологии нельзя выбрать, по каким осям резать, не убив утилизацию; степень data parallel и накопление считаются от целевого батча уже при известных остальных осях; checkpointing и offload — реакция на нехватку памяти, оставшуюся после всего этого. Расчёт же служит предварительным отбором, а окончательный вывод даёт замер на пробном запуске.'
  kind: order
  items:
    - посчитать полный бюджет памяти обучения из размера модели, разрядности и оптимизатора
    - выбрать оси разрезания модели, ограничив их скоростью связей внутри узла и между узлами
    - подобрать степень data parallel и число шагов накопления под целевой глобальный батч
    - по остатку свободной памяти решить, нужны ли activation checkpointing или offload
    - измерить пик памяти и пропускную способность на пробном запуске и уточнить оценки
  id: 059-training-planner-3
  fingerprint: cd46a093
