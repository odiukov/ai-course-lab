- concept: порядок фаз занятости GPU за одну итерацию pipeline parallelism, включая повтор заполнения/опустошения в обратном проходе
  question: Расставь фазы загрузки ускорителей за одну итерацию конвейера (forward + backward) в хронологическом порядке.
  explanation: Обратный проход повторяет ту же структуру, но волна идёт от последней стадии к первой. Поэтому пузырь появляется дважды — на краях forward и на краях backward, и короткая очередь микробатчей состоит почти из одних краёв.
  kind: order
  items:
    - 'Заполнение прямого прохода: заняты только первые стадии, число занятых растёт'
    - 'Полная занятость прямого прохода: все стадии считают разные микробатчи'
    - 'Опустошение прямого прохода: первая стадия отдала последний микробатч и простаивает, за ней освобождаются следующие'
    - 'Заполнение обратного прохода: волна градиентов стартует с последней стадии'
    - 'Полная занятость обратного прохода: все стадии считают backward разных микробатчей'
    - 'Опустошение обратного прохода: работа остаётся только у первой стадии'
