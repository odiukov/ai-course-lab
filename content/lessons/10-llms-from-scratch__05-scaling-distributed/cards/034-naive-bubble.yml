- concept: доля пузыря в pipeline parallelism равна (S−1)/(M+S−1) для S стадий и M микробатчей
  question: Конвейер разбит на 8 стадий с равным временем стадии, через него прогоняют 24 микробатча. Какая доля времени работы ускорителей приходится на простой (пузырь)? Ответ дробью от 0 до 1.
  explanation: Заполнение и опустошение вместе занимают S−1 тактов, полезная середина — M тактов. Доля пузыря = (S−1)/(M+S−1) = 7/(24+7) = 7/31 ≈ 0.226. Края расписания фиксированы числом стадий, поэтому растить надо M.
  kind: numeric
  answer: 0.226
  tolerance: 0.02
  id: 034-naive-bubble-1
  fingerprint: 4916ee35
- concept: длительность заполнения и опустошения задаётся числом стадий, а число микробатчей удлиняет только участок полной занятости
  question: Конвейер из 5 стадий. Число микробатчей увеличили с 10 до 40, разбиение модели не меняли. Что произойдёт с фазой заполнения (тактов до момента, когда заняты все стадии)?
  explanation: Первый микробатч всё равно должен пройти S−1 = 4 стадии, прежде чем последняя стадия получит работу. Микробатчи добавляются в середину, где заняты все GPU, поэтому доля пузыря падает, а абсолютная длина краёв не меняется.
  kind: choice
  options:
    - Останется прежней — 4 такта, вырастет только середина расписания
    - Вырастет вчетверо, потому что микробатчей вчетверо больше
    - Сократится вчетверо, потому что стадии получают задания чаще
    - 'Исчезнет: при большом числе микробатчей заполнения нет'
  correct: 0
