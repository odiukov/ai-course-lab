- concept: при фиксированном общем батче дробление на большее число микробатчей уменьшает каждый набор активаций, поэтому суммарный объём живых активаций остаётся примерно прежним — линейный рост даёт только фиксированный размер микробатча
  question: 'Наивное расписание конвейера: сначала forward всех микробатчей, потом backward. Общий батч 512 примеров фиксирован. Сначала его гоняют одним куском (M=1), затем делят на M=32 микробатча. Во сколько раз примерно вырастет суммарный объём живых активаций на первой стадии перед началом обратного прохода?'
  explanation: 'Наборов становится 32 вместо одного, но каждый посчитан по 16 примерам вместо 512, то есть в 32 раза меньше по байтам. Произведение не меняется: 32 × (1/32) = 1. Рост памяти в M раз возникает в другом сценарии — когда размер микробатча держат постоянным и увеличивают общий батч. Поэтому корректная формулировка платы за уменьшение пузыря: растёт число независимо ожидающих наборов, а байты растут только при неизменном размере микробатча.'
  kind: numeric
  answer: 1
