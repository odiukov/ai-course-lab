- concept: 'простой стадии и объём незавершённой работы обменны: стадия перестаёт ждать только за счёт запуска новых единиц до завершения предыдущих, а незавершённое обязано храниться'
  question: Объясни своими словами, почему в конвейерном параллелизме сокращение доли простоя стадий не бывает бесплатным по памяти.
  explanation: 'Ключ — причинная связь, а не совпадение. Пузырь возникает из ожидания зависимости (backward своего же микробатча), и снимается он только запуском новой работы вперёд. Незавершённая работа = хранимое состояние. Отсюда практический вывод: наращивать число микробатчей можно ровно до предела памяти, а дальше нужны другие расписания (например, чередование forward и backward), которые ограничивают число одновременно живых наборов.'
  kind: open
  reference: 'Стадия простаивает, когда закончила свою часть и ждёт, пока результат вернётся к ней обратным проходом. Единственный способ не ждать — начать следующую единицу работы, не дожидаясь завершения предыдущей. Но незавершённая единица обязана где-то храниться: её промежуточные результаты forward нужны будущему backward и не могут быть удалены. Поэтому каждая устранённая единица простоя превращается в ещё один живой набор активаций. Простой и незавершённая работа обменны: плотнее загрузка — длиннее очередь того, что нельзя освободить. Ограничение памяти на устройстве задаёт максимум одновременно живых наборов и тем самым нижнюю границу достижимого пузыря при данном расписании.'
