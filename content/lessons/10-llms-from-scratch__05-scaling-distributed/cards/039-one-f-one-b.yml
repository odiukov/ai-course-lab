- concept: 'структура расписания 1F1B на одной стадии: разогрев forward, устойчивое чередование, дренаж оставшихся backward'
  question: Расставьте фазы работы одной стадии в расписании 1F1B по порядку выполнения.
  explanation: Число forward на разогреве задаётся расстоянием стадии до конца конвейера — именно оно и определяет, сколько комплектов активаций живёт одновременно. Дальше 1F1B держит это число постоянным, а в дренаже оно падает до нуля.
  kind: order
  items:
    - 'Разогрев: стадия выполняет несколько forward подряд, пока первый микробатч не пройдёт до конца конвейера и не вернётся'
    - 'Устойчивый режим: на каждый forward нового микробатча приходится один backward более раннего, его активации сразу освобождаются'
    - 'Дренаж: новых forward больше нет, стадия добивает backward для микробатчей, чьи активации ещё живы'
