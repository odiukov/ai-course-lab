- concept: в 1F1B число одновременно живых наборов активаций ограничено глубиной конвейера, а не числом микробатчей
  question: Pipeline parallelism на 6 стадий, общий батч разбит на 16 микробатчей, используется расписание 1F1B. Сколько примерно комплектов активаций одновременно хранит самая ранняя стадия в устоявшемся режиме?
  explanation: В 1F1B стадия после разогрева на каждый новый forward делает один backward, поэтому число микробатчей «в полёте» держится на уровне глубины конвейера — здесь около 6, а не 16. При схеме «сначала все forward» ранняя стадия дошла бы до 16 комплектов.
  kind: numeric
  answer: 6
  tolerance: 1
  id: 039-one-f-one-b-1
  fingerprint: 03bbc791
- concept: 1F1B не меняет долю пузыря относительно расписания «все forward, потом все backward», а меняет только пик памяти
  question: Конвейер из 5 стадий и 20 микробатчей переводят с расписания «сначала все forward, потом все backward» на 1F1B. Что изменится?
  explanation: 'Заполнение и опустошение конвейера задаются числом стадий, и 1F1B их не убирает: доля пузыря остаётся (S−1)/(M+S−1) = 4/24. Выигрыш в другом — backward стартует раньше, активации микробатча освобождаются раньше, и число живых комплектов держится около 5 вместо 20.'
  kind: choice
  options:
    - Доля пузыря останется той же, а пик памяти под активации снизится
    - Доля пузыря снизится примерно вдвое, пик памяти не изменится
    - Снизятся и доля пузыря, и пик памяти пропорционально числу стадий
    - Пик памяти вырастет, зато исчезнут фазы заполнения и опустошения
