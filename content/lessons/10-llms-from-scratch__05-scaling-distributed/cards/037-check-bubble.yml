- concept: чтобы удержать долю пузыря при увеличении числа стадий, число микробатчей надо увеличивать пропорционально — доля задаётся отношением M к S, а не абсолютным M
  question: Схема из 3 стадий работает с 12 микробатчами. Модель разрезают на 9 стадий. Сколько микробатчей нужно пустить в конвейер, чтобы доля простоя осталась такой же, как была?
  explanation: 'Было (3−1)/(12+3−1) = 2/14 = 1/7. Решаем (9−1)/(M+9−1) = 1/7: 8/(M+8) = 1/7, M+8 = 56, M = 48. Утроение числа стадий требует учетверения микробатчей (12 → 48): длина участка заполнения и опустошения растёт вместе с S, и её надо чем-то перекрывать.'
  kind: numeric
  answer: 48
  tolerance: 0.5
