- concept: 'порядок коллективных операций FSDP вокруг одного слоя: all-gather параметров, вычисление, освобождение чужих частей, повторный all-gather на backward, reduce-scatter градиентов'
  question: Расставь операции FSDP для одного слоя в порядке выполнения за одну итерацию обучения.
  explanation: 'Параметры собираются дважды за итерацию — перед forward и перед backward, потому что между ними чужие части уже выброшены. Градиенты сводятся не all-reduce, а reduce-scatter: каждой GPU нужен градиент только под её шард весов, ведь шаг оптимизатора она делает лишь для своей доли.'
  kind: order
  items:
    - 'All-gather: собрать полные параметры слоя со всех GPU в память каждой GPU'
    - Прямой проход слоя на собранных полных параметрах
    - Освободить чужие части параметров, оставив только свой шард
    - Повторный all-gather параметров слоя перед его обратным проходом
    - 'Reduce-scatter: свести градиенты и раздать их шарды, каждая GPU оставляет свою 1/N'
  id: 041-fsdp-sharding-2
  fingerprint: 70c12ba6
- concept: пиковая память под веса при FSDP = постоянный шард всех весов плюс временно собранный полный слой
  question: Модель на 30 млрд параметров в FP16 обучается с FSDP на 12 GPU. Самый крупный слой в полном виде занимает 1,5 ГБ. Сколько гигабайт занимают веса на одной GPU в пике, если единовременно собирается только один слой?
  explanation: 'Все веса: 30 млрд × 2 байта = 60 ГБ. Постоянный шард: 60 / 12 = 5 ГБ. Сверху временно ложится собранный полный слой: 5 + 1,5 = 6,5 ГБ. Пик выше постоянной доли ровно на размер материализованного слоя — поэтому крупные слои задают запас памяти, который нужно держать сверх расчёта 1/N.'
  kind: numeric
  answer: 6.5
  tolerance: 0.1
  id: 041-fsdp-sharding-3
