- concept: FSDP пересылает за итерацию больше данных, чем DDP, потому что параметры собираются заново перед каждым слоем и в forward, и в backward, тогда как DDP синхронизирует только градиенты один раз
  question: Почему у FSDP объём сетевого обмена за одну итерацию выше, чем у обычного data parallelism при той же модели и том же батче?
  explanation: 'В DDP полные веса уже лежат на каждой карте, поэтому обмен ровно один — сведение градиентов. В FSDP постоянно хранится только шард, значит перед вычислением каждого слоя нужен all-gather параметров, и он повторяется на обратном проходе, плюс reduce-scatter градиентов. Отсюда и правило: экономия памяти в FSDP оплачивается трафиком, а не бесплатна.'
  kind: choice
  options:
    - FSDP шлёт полную копию весов каждой карте один раз перед началом итерации, а DDP не шлёт весов вовсе
    - FSDP собирает параметры all-gather перед каждым слоем — отдельно в прямом и в обратном проходе — и вдобавок сводит градиенты, а DDP обменивается только градиентами один раз за итерацию
    - FSDP пересылает активации между картами на каждом слое, а DDP держит активации локально
