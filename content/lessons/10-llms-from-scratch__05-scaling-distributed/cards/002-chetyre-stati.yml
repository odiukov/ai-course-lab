- concept: состояния Adam — самая крупная статья памяти обучения, потому что на каждый параметр их две и каждая шире по разрядности, чем сам вес
  question: 'Модель обучают оптимизатором Adam: веса и градиенты хранятся в половинной точности, состояния оптимизатора — в одинарной. Какая статья памяти окажется самой большой и почему?'
  explanation: 'Градиент один на параметр и в той же точности, что вес, — значит равен весам по объёму. Adam же ведёт два момента (m и v) в одинарной точности: 2 записи × 4 байта против 2 байт веса, то есть в 4 раза больше весов. Для 70B это 560 ГБ против 140 ГБ весов — именно оптимизатор, а не веса, определяет число арендуемых GPU.'
  kind: choice
  options:
    - 'Градиенты: на каждый вес приходится по два градиента'
    - 'Состояния Adam: на параметр их две записи, и каждая занимает вдвое больше байтов, чем сам вес'
    - 'Веса: это единственное, что растёт вместе с числом параметров'
    - Все три статьи равны, потому что все они хранят по одному числу на параметр
  correct: 1
  id: 002-chetyre-stati-1
  fingerprint: 1fd92a15
- concept: память оптимизатора задаётся числом моментов, которые он хранит на параметр, поэтому смена оптимизатора напрямую меняет бюджет
  question: 'Модель на 30 млрд параметров обучают Adam: два момента на параметр, оба в одинарной точности. Команда переходит на SGD с моментом — один момент на параметр той же точности. Сколько ГБ памяти это освобождает?'
  explanation: Один момент на 30 млрд параметров в одинарной точности — это 30e9 × 4 байта = 120 ГБ. Adam держит две такие записи (240 ГБ), SGD с моментом — одну (120 ГБ), разница 120 ГБ. Память оптимизатора линейна по числу хранимых на параметр записей, поэтому выбор оптимизатора — прямой рычаг на бюджет памяти.
  kind: numeric
  answer: 120
  tolerance: 5
  id: 002-chetyre-stati-2
  fingerprint: d313e3ad
- concept: активации нельзя оценить как «число параметров × постоянное число байт», потому что их объём задаётся формой обрабатываемых данных и архитектурой
  question: Веса, градиенты и состояния оптимизатора считают простым умножением числа параметров на фиксированное количество байт. Объясни своими словами, почему для активаций такой расчёт не работает.
  explanation: 'Три первых статьи привязаны к параметру: 2 байта вес, 2 байта градиент, 8 байт на два момента Adam — для 8B это ровно 96 ГБ независимо от данных. Активации привязаны к данным и архитектуре, поэтому их считают по форме тензоров и уменьшают через батч, длину контекста или checkpointing.'
  kind: open
  reference: 'Активации — промежуточные тензоры прямого прохода, которые держат в памяти, чтобы посчитать градиенты на обратном проходе. Их количество определяется не только числом параметров, а формой данных и структурой сети: размером батча, длиной последовательности, числом слоёв, размерностью скрытого состояния, а у внимания ещё и квадратичной зависимостью от длины последовательности. Один и тот же набор весов при батче в 3 раза больше даёт примерно в 3 раза больше активаций, тогда как веса, градиенты и моменты не меняются вовсе. Плюс объём зависит от реализации: gradient checkpointing выбрасывает часть активаций и пересчитывает их, обменивая память на вычисления. Поэтому активации оценивают через форму тензоров каждого слоя, а не через «байт на параметр».'
  id: 002-chetyre-stati-3
  fingerprint: 5ced2f23
