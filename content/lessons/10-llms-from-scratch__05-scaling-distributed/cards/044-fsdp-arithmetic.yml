- concept: постоянно хранимое состояние обучения при Adam в смешанной точности стоит двенадцать байт на параметр, и на карту приходится эта величина, делённая на число GPU
  question: 'Модель на 30 млрд параметров обучают с Adam в смешанной точности: веса и градиенты хранятся в половинной точности (по два байта на значение), два состояния оптимизатора — в одинарной (по четыре байта). Состояние полностью шардировано между шестью GPU. Сколько ГБ постоянно занято на одной карте?'
  explanation: 'На параметр: веса — два байта, градиенты — два байта, два момента Adam — восемь байт, итого двенадцать байт. Полный бюджет 30 млрд × 12 = 360 ГБ. Полное шардирование делит все три статьи, поэтому на карту 360 / 6 = 60 ГБ. Если поделить только веса, получится 10 ГБ — оценка занижена в шесть раз, потому что градиенты и моменты никуда не исчезли.'
  kind: numeric
  answer: 60
  tolerance: 0.5
  id: 044-fsdp-arithmetic-1
  fingerprint: e5313128
- concept: постоянная часть памяти на карту обратно пропорциональна числу устройств в группе шардирования
  question: Постоянно хранимые шарды весов, градиентов и состояний оптимизатора занимают 96 ГБ на карту в группе из шести GPU. Инженер расширяет группу полного шардирования до двенадцати GPU, не меняя ни модель, ни оптимизатор, ни форматы хранения. Сколько будет занимать постоянная часть на одной карте?
  explanation: 'Полный бюджет состояния фиксирован моделью и оптимизатором: 96 × 6 = 576 ГБ. Полное шардирование раздаёт каждому устройству 1/N этого объёма, поэтому 576 / 12 = 48 ГБ. Масштабирование строго 1/N — вчетверо оно не падает. Суммарный по кластеру объём при этом не уменьшается, меняется только доля на карту.'
  kind: choice
  options:
    - 48 ГБ — постоянная часть делится на число устройств в группе
    - 96 ГБ — суммарный объём состояния не изменился, значит и на карту приходится столько же
    - 24 ГБ — удвоение числа карт снижает постоянную часть вчетверо за счёт более мелких шардов
    - 192 ГБ — каждая новая карта добавляет свою копию состояния
