- concept: корректный общий градиент — среднее локальных с весами, равными числу примеров в шарде
  question: 'Две GPU обработали шарды одного батча: первая — 60 примеров, вторая — 20. Каждая вернула градиент, уже усреднённый по примерам своего шарда: 0.6 и 0.9 соответственно. Чему равна соответствующая компонента градиента всего батча?'
  explanation: 'Локальный градиент — это сумма по примерам шарда, делённая на его размер. Чтобы вернуть градиент батча, каждый локальный вес берут пропорционально числу примеров: (60·0.6 + 20·0.9)/80 = 54/80 = 0.675. Простое среднее дало бы (0.6+0.9)/2 = 0.75 — завышено, потому что маленький шард получил бы такой же голос, как большой.'
  kind: numeric
  answer: 0.675
  tolerance: 0.005
  id: 017-neravnye-shardy-1
  fingerprint: fe9c98b2
- concept: простое среднее локальных градиентов совпадает с градиентом батча только при равных размерах шардов
  question: Батч раздают 8 GPU, каждая возвращает градиент, усреднённый внутри своего шарда, и все градиенты складывают и делят на 8. При каком условии результат в точности равен градиенту исходного батча?
  explanation: За каждым локальным градиентом стоит своё число примеров. Простое среднее даёт каждому устройству равный голос, значит эффективный вес одного примера обратно пропорционален размеру его шарда. Когда все шарды равны, эти веса совпадают, и равное усреднение совпадает со взвешенным. Число устройств и нормировка длины здесь ни при чём.
  kind: choice
  options:
    - Всегда — деление на число устройств уже нормирует результат
    - Только когда все шарды содержат одинаковое число примеров
    - Только когда число устройств является степенью двойки
    - Только когда локальные градиенты предварительно нормированы по длине
  correct: 1
  id: 017-neravnye-shardy-2
  fingerprint: 9adc621a
- concept: выравнивание размеров шардов сохраняет корректность дешёвого all-reduce mean без взвешивания
  question: Батч из 50 примеров нужно раздать 7 устройствам, а обмен градиентами — это all-reduce, который умеет только суммировать и делить на число устройств. Объясни своими словами, как обучающие фреймворки обычно обходят проблему неравных шардов и почему такой обход предпочтительнее взвешивания.
  explanation: Ключ в том, что all-reduce делит на число устройств, а не на число примеров. Либо приводим шарды к равному размеру и оставляем деление верным, либо заранее масштабируем каждый локальный градиент на долю его шарда (n_i/N) и только потом суммируем. Первый путь дешевле и потому распространён.
  kind: open
  reference: 'Размеры шардов выравнивают: лишний хвост батча отбрасывают (drop_last) либо добивают паддингом до кратности числу устройств. Тогда за каждым локальным градиентом стоит одинаковое число примеров, и простое среднее (сумма всех градиентов, делённая на число устройств) уже равно градиенту батча — то есть штатный all-reduce остаётся корректным без дополнительного обмена. Взвешивание требовало бы либо передавать размеры шардов и домножать градиенты на n_i/N до суммирования, либо менять сам коллектив; выравнивание же ничего не стоит, а цена — потеря нескольких примеров из шага (при drop_last) или пустая работа на паддинге.'
  id: 017-neravnye-shardy-3
  fingerprint: 9b3a666b
