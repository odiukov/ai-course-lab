- concept: расчётный бюджет памяти покрывает только перечисленные статьи, а падение по памяти определяется пиковым потреблением, включающим неучтённые служебные расходы
  question: Калькулятор памяти суммирует веса, градиенты, состояние оптимизатора и активации и говорит, что конфигурация помещается на GPU. Объясни своими словами, почему запуск всё равно может упасть по нехватке памяти.
  explanation: Ключ в разнице между «суммой учтённых статей» и «пиком фактического потребления». Оценка тем надёжнее, чем дальше итог от предела устройства; вплотную к лимиту вывод «поместится» практически ничего не гарантирует.
  kind: open
  reference: 'Калькулятор считает модель расходов из нескольких известных статей, а GPU должна выдержать пиковое потребление в худший момент. В пик входит то, чего в формуле нет: контекст и служебные структуры фреймворка и драйвера, буферы обмена между GPU при распределённом обучении, временные тензоры внутри операций, а также фрагментация свободной памяти. Плюс сама оценка приблизительна: если точные размеры (hidden_dim, число слоёв, длина последовательности, батч) не заданы, активации берутся по грубому приближению. Поэтому флаг «помещается» означает лишь «сумма учтённых статей не превышает лимит» — это фильтр для сравнения конфигураций, а не гарантия запуска.'
  id: 008-granicy-ocenki-2
