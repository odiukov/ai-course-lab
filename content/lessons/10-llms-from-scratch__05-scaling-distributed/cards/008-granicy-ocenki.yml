- concept: надёжность вывода о вместимости даёт измерение пика на пробном запуске с запасом, а расчёт служит лишь предварительным отбором
  question: Расставь шаги подбора конфигурации обучения по памяти в правильном порядке — от дешёвой прикидки к настоящей проверке.
  explanation: 'Расчёт дёшев и отсеивает заведомо невозможное, но подтверждает вместимость только измерение пика на реальном прогоне. Запас нужен потому, что пик плавает: длина последовательности, буферы коммуникации и фрагментация меняются от шага к шагу.'
  kind: order
  items:
    - Посчитать бюджет памяти на одну GPU для нескольких вариантов шардирования и батча
    - Отбросить варианты, у которых расчётный итог уже превышает память устройства
    - Запустить короткий пробный прогон оставшегося варианта и измерить реальный пик потребления
    - Принять конфигурацию только если измеренный пик оставляет заметный запас до лимита устройства, иначе уменьшить батч или усилить шардирование
