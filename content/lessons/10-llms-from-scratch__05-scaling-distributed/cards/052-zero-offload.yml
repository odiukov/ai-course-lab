- concept: время обмена при выгрузке равно объёму переносимого состояния, делённому на пропускную способность канала, и его сравнивают с временем вычисления шага
  question: Модель на 3 млрд параметров обучается Adam. Оба момента хранятся в fp32 (по 4 байта на момент на параметр) и целиком выгружены в CPU RAM. На каждой итерации это состояние один раз проходит по PCIe к месту вычисления и один раз обратно. Пропускная способность канала 16 ГБ/с. Сколько секунд занимает передача за одну итерацию?
  explanation: 'Состояние Adam: 3e9 × 8 байт = 24 ГБ. Туда и обратно — 48 ГБ. 48 / 16 = 3.0 с на итерацию только на передачу. Если сам шаг считается за доли секунды, канал и есть новая длительность итерации: память нашлась, скорость ушла.'
  kind: numeric
  answer: 3
  tolerance: 0.1
  id: 052-zero-offload-1
  fingerprint: 04ac6eb8
- concept: предварительная загрузка выгруженного состояния скрывает задержку только когда время вычисления не меньше времени передачи следующей порции
  question: Состояния оптимизатора выгружены за пределы GPU, а фреймворк заранее подтягивает состояние следующего слоя, пока GPU считает текущий. Слой считается 8 мс, а его состояние переносится по каналу за 20 мс. Что даст такое перекрытие?
  explanation: 'Перекрытие прячет ровно столько времени передачи, сколько длится вычисление. При 8 мс счёта против 20 мс переноса узкое место — канал: на слой уходит 20 мс, из них 12 мс GPU простаивает. Перекрытие не меняет ни пропускную способность, ни объём данных; оно окупается, только когда вычисление длиннее передачи.'
  kind: choice
  options:
    - 'Задержка исчезнет полностью: передача и вычисление идут одновременно'
    - Скрыто будет только 8 мс из 20, остальные 12 мс GPU всё равно ждёт данные
    - Передача ускорится до 8 мс, потому что идёт параллельно с вычислением
    - Перекрытие снизит объём переносимых данных примерно вдвое
  correct: 1
