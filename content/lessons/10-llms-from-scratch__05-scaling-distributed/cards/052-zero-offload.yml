- concept: при выгрузке состояний оптимизатора шаг обновления выполняется вне GPU, поэтому за итерацию канал проходят и градиенты, и обновлённые веса
  question: Состояния Adam выгружены в CPU RAM, шаг оптимизатора выполняется на CPU. Расставь события одной итерации по порядку.
  explanation: Вычисление идёт там, где лежат данные. Раз моменты живут в CPU RAM, к ним едут градиенты, обновление считает CPU, а назад едут веса. Итого канал нагружен дважды за итерацию, и это постоянный трафик на каждом шаге, а не разовый перенос при старте.
  kind: order
  items:
    - GPU завершает обратный проход и получает градиенты своего шарда
    - Градиенты передаются по PCIe в CPU RAM, где лежат моменты Adam
    - 'CPU выполняет шаг оптимизатора: обновляет моменты и веса'
    - Обновлённые веса передаются по PCIe обратно в память GPU
    - GPU начинает прямой проход следующей итерации
