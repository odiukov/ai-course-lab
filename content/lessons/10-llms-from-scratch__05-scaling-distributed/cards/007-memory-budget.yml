- concept: если стратегия делит между GPU только состояния оптимизатора и градиенты, полная копия весов остаётся на каждом устройстве и остаётся в бюджете целиком
  question: Модель на 13 млрд параметров обучается на 8 GPU. Веса и градиенты хранятся в bf16, Adam держит два момента в fp32. Выбранная стратегия делит между устройствами состояния оптимизатора и градиенты, но не веса. Сколько гигабайт (десятичных, 1 ГБ = 1e9 байт) занимают веса, градиенты и оптимизатор на одной GPU? Активации не учитывай.
  explanation: 'Веса: 13e9 × 2 = 26 ГБ, и они не делятся — на каждой GPU полная копия. Градиенты: 26 / 8 = 3.25 ГБ. Оптимизатор: 13e9 × 4 × 2 = 104 ГБ, делится на 8 = 13 ГБ. Итого 26 + 3.25 + 13 = 42.25 ГБ. Пока веса не шардируются, они доминируют в бюджете, сколько устройств ни добавляй.'
  kind: numeric
  answer: 42.25
  tolerance: 0.5
  id: 007-memory-budget-1
  fingerprint: 09c13e3b
- concept: шардирование перераспределяет состояние обучения между устройствами, но не уменьшает суммарный по кластеру объём памяти
  question: Инженер переходит от обучения без шардирования к стратегии, которая делит веса, градиенты и состояния оптимизатора между 16 GPU. Локальный батч и длина последовательности не меняются. Что произойдёт с суммарным по всему кластеру объёмом занятой памяти?
  explanation: 'Шардирование режет состояние на куски и раскладывает по устройствам: сложи куски обратно — получишь исходный объём. Выигрыш здесь только в том, что помещается на одну GPU, а не в общем расходе памяти. Активации к тому же дублируются: каждое устройство считает свою порцию данных, поэтому в сумме по кластеру их становится больше, а не меньше.'
  kind: choice
  options:
    - Суммарный объём по кластеру упадёт примерно в 16 раз, потому что каждая статья бюджета делится
    - 'Суммарный объём по кластеру не уменьшится: разделённые статьи в сумме дают ту же величину, а активации по-прежнему хранятся на каждой GPU отдельно'
    - Суммарный объём по кластеру вырастет в 16 раз, потому что каждое устройство получает полную копию состояния
    - Суммарный объём станет равен памяти одной GPU, так как кластер работает как единое адресное пространство
  correct: 1
  id: 007-memory-budget-2
  fingerprint: '90303103'
- concept: деление статей бюджета на устройства применяется к уже посчитанным полным величинам, а итог на GPU суммируется только после этого
  question: Расставь шаги расчёта бюджета памяти обучения в правильном порядке.
  explanation: 'Порядок важен: сначала считаются полные величины, потом к ним применяется деление. Если поделить раньше или сложить всё в одну сумму до шардирования, разбивка перестанет быть проверяемой — по итоговому числу уже не увидишь, какая именно статья распределилась. Активации считаются из локального батча и в шаг деления не попадают.'
  kind: order
  items:
    - Перевести размер модели из миллиардов параметров в количество параметров
    - Посчитать полные, нераспределённые объёмы памяти под веса, градиенты и состояния оптимизатора
    - Посчитать память активаций из локального батча, длины последовательности и архитектуры
    - Применить выбранную стратегию шардирования, поделив на число устройств только те статьи, которые она распределяет
    - Сложить получившиеся статьи в итог на одну GPU и сравнить его с памятью устройства
  id: 007-memory-budget-3
  fingerprint: 669599b6
