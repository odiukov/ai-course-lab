  question: В обучении GPU-аллокатор PyTorch показывает 61 ГБ reserved при 38 ГБ памяти живых тензоров. Что это значит?
  explanation: 'Аллокатор кэширует блоки, чтобы не ходить к драйверу на каждое выделение: разрыв reserved и живой памяти — нормальное состояние. Кэшированные блоки переиспользуются, если запрошенный размер укладывается в свободный кусок; проблемой это становится, лишь когда кэш раздроблен и цельного блока нужного размера нет. Утечка выглядит иначе — монотонный рост именно живой памяти от шага к шагу.'
