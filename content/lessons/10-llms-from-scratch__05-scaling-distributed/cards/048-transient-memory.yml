  question: FSDP-прогон падает по памяти на считанные гигабайты. Что даст уменьшение глубины предзагрузки параметров (числа слоёв, собираемых заранее)?
  explanation: 'Предзагрузка существует ради перекрытия: пока считается текущий слой, параметры следующего уже едут по сети. Плата — несколько полных наборов параметров в памяти одновременно. Уменьшив глубину, получаешь меньший пик и паузы на ожидании all-gather. Число коллективных операций при этом прежнее, меняется только их перекрытие с вычислением.'
