- concept: относительная стоимость полного пересчёта активаций равна цене одного дополнительного forward, делённой на цену обычного шага
  question: 'Профилирование показало, что backward у модели стоит вчетверо дороже forward. Включают полный activation checkpointing: перед backward каждый участок сети прогоняется вперёд ещё раз. На сколько процентов вырастут вычисления шага обучения?'
  explanation: 'Обычный шаг = forward (1) + backward (4) = 5 условных единиц. Полный пересчёт добавляет ещё один forward: 6 вместо 5, то есть +20%. Именно так получается и привычная цифра ~33% при backward = 2×forward: (1+2+1)/(1+2) = 4/3.'
  kind: numeric
  answer: 20
  tolerance: 1
  id: 049-checkpointing-1
  fingerprint: 32f6160c
- concept: пик памяти активаций при чекпоинтинге = сохранённые границы групп плюс активации одной пересчитываемой в данный момент группы
  question: Сеть из 96 однотипных слоёв, активации одного слоя занимают 1 ГБ. Контрольные точки ставят на границе каждой группы из 12 слоёв. Какой примерно пик памяти под активации получится в обратном проходе?
  explanation: '96/12 = 8 контрольных точек живут весь проход (8 ГБ). Плюс в момент обработки группы её 12 слоёв восстановлены целиком (12 ГБ). Итого ~20 ГБ вместо 96 ГБ. Отсюда и правило выбора размера группы: слишком крупные группы раздувают второе слагаемое, слишком мелкие — первое; минимум даёт группа порядка корня из числа слоёв.'
  kind: choice
  options:
    - около 8 ГБ — хранятся только входы восьми групп
    - около 20 ГБ — восемь сохранённых входов плюс 12 слоёв пересчитанной группы
    - около 96 ГБ — пересчёт всё равно материализует все слои
    - около 12 ГБ — держится только текущая группа
  correct: 1
  id: 049-checkpointing-2
  fingerprint: 9646916b
- concept: 'механика обработки чекпоинтнутой группы слоёв: сохранение входа, освобождение промежуточных, пересчёт от входа, градиенты, повторное освобождение'
  question: Расставьте по порядку, что происходит с одной группой слоёв при activation checkpointing за одну итерацию обучения.
  explanation: 'Ключ в том, что восстановление локально и временно: в памяти одновременно живут внутренности только одной группы. Если бы восстановленные активации не освобождались после градиентов, к концу backward накопилась бы полная сеть активаций и экономии не было бы вовсе.'
  kind: order
  items:
    - forward проходит группу и сохраняет только её вход в контрольной точке
    - промежуточные активации внутри группы освобождаются сразу после её forward
    - backward доходит до этой группы и берёт сохранённый вход
    - для группы повторно выполняется forward, восстанавливая её внутренние активации
    - по восстановленным активациям считаются градиенты слоёв группы
    - восстановленные активации снова освобождаются, backward идёт к предыдущей группе
  id: 049-checkpointing-3
  fingerprint: 1bfcd613
