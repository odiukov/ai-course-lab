- concept: каждый локальный градиент должен получить вес именно своего шарда, поэтому нарушение пар «градиент — размер» портит результат
  question: Функция сводит локальные градиенты нескольких GPU во взвешенное среднее по числу примеров. Разработчик отсортировал список размеров шардов по возрастанию, а список градиентов оставил в исходном порядке GPU. Что будет с результатом?
  explanation: Вес градиента — число примеров, на которых он посчитан. Как только пара «градиент — размер шарда» разрушена, вклад каждой GPU масштабируется чужим числом, и сумма делится на верный общий батч, давая неверный градиент. При равных шардах все веса одинаковы, поэтому ошибка маскируется — это и делает такой баг незаметным в тестах на ровном делении.
  kind: choice
  options:
    - 'Ничего: и градиенты, и размеры всё равно попадают в сумму целиком'
    - Результат станет неверным — каждый градиент умножится на число примеров чужой GPU; совпадёт с правильным только при равных размерах шардов
    - Функция упадёт с ошибкой несовпадения форм, потому что перестановка меняет размерность
    - Результат исказится только для скалярных градиентов, для массивов взвешивание самокорректируется
  correct: 1
  id: 019-data-parallel-gradient-1
  fingerprint: eb1eec1b
- concept: поэлементное сведение определено только для градиентов одинаковой формы, а несовпадение формы — ошибка входа, а не повод к broadcast
  question: 'На вход функции сведения градиентов пришли два локальных градиента: один формы (512,), другой формы (512, 8). Как должна вести себя корректная реализация?'
  explanation: 'Все GPU в data parallelism держат одну и ту же копию модели, поэтому локальные градиенты обязаны иметь одинаковую форму — форму набора параметров. Несовпадение формы означает, что реплики разошлись или собран не тот тензор. Broadcast здесь опасен: он молча вернёт массив (512, 8) вместо градиента параметров, и обучение поедет на бессмысленном шаге вместо явного падения.'
  kind: choice
  options:
    - Растянуть меньший градиент по правилам broadcast и продолжить сведение
    - 'Отклонить вход: сведение определено лишь для градиентов одинаковой формы, разные формы означают несогласованные копии модели'
    - Свести только совпадающую часть, а лишние элементы отбросить
    - Привести всё к форме первого градиента, так как он задаёт эталон
  correct: 1
  id: 019-data-parallel-gradient-2
  fingerprint: 2452be4a
- concept: объём обмена в ring all-reduce равен 2 × размер градиентов × (N−1)/N
  question: Обучение идёт на 8 GPU, размер градиентов модели — 600 МБ. Сколько мегабайт данных отправит одна GPU за полный ring all-reduce?
  explanation: 'Ring all-reduce стоит 2 × размер_градиентов × (N−1)/N: 2 × 600 × 7/8 = 1050 МБ. Множитель два — это фазы reduce-scatter и all-gather. С ростом N выражение стремится к двум размерам градиентов и не растёт линейно по числу устройств — поэтому data parallelism масштабируется на сотни карт, тогда как наивная схема «все шлют всем» стоила бы N × 600 МБ.'
  kind: numeric
  answer: 1050
  tolerance: 10
  id: 019-data-parallel-gradient-3
  fingerprint: 0c6eb220
