- concept: растягивание группы tensor parallel на несколько узлов сохраняет экономию памяти на GPU, но обрушивает утилизацию, потому что зависимость между частями одного вычисления никуда не девается
  question: Команда предлагает растянуть группу tensor parallel с одного узла на три узла, чтобы каждая GPU держала ещё меньше весов. Объясни своими словами, что при этом улучшится, что ухудшится и почему выигрыш обычно не окупается.
  explanation: 'Ключ — различать две оси: память на GPU и утилизация GPU. Tensor parallelism улучшает первую за счёт второй, и цена растёт ровно тогда, когда синхронизация уходит за границу узла: разрыв в пропускной способности между внутриузловой шиной и сетью — примерно порядок величины, плюс лишняя задержка на сетевых переходах.'
  kind: open
  reference: 'Экономия памяти сохранится и даже вырастет: веса каждого слоя режутся на большее число GPU, на карту приходится меньший шард. Ухудшится время: части одного матричного умножения зависят друг от друга, и после каждого разрезанного слоя нужен обмен частичными результатами. Внутри узла он идёт по прямой шине между картами (сотни ГБ/с и малая задержка), между узлами — через сетевое оборудование, где пиковая скорость на порядок ниже, а каждый лишний сетевой переход добавляет задержку. Обмен стоит в критическом пути, поэтому дорогие GPU большую часть времени ждут, а не считают. Разрезали вычисление — зависимость между кусками осталась. Память дешевле искать другими способами (например, разделением по слоям между узлами, где обмен реже), а группу tensor parallel держат внутри одного узла.'
