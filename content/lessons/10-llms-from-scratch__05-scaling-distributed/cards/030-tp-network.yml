- concept: сетевую скорость в Гбит/с надо перевести в ГБ/с делением на число бит в байте, прежде чем сравнивать её с внутриузловой шиной в ГБ/с
  question: Шина между GPU внутри узла даёт 600 ГБ/с. Межузловая сеть заявлена как 200 Гбит/с. Во сколько раз внутриузловая связь быстрее межузловой по пиковой пропускной способности? Ответ — число раз.
  explanation: '200 Гбит/с = 200/8 = 25 ГБ/с. 600 / 25 = 24 раза. Типичная ошибка — сравнивать 600 с 200 напрямую и получить трёхкратный разрыв: единицы разные, биты против байт. Именно этот порядок разрыва и запирает группу tensor parallel внутри узла.'
  kind: numeric
  answer: 24
  tolerance: 0.5
