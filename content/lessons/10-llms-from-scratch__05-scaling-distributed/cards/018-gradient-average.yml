- concept: если каждая GPU вернула сумму градиентов по своему шарду, эти суммы складывают и делят на размер батча ровно один раз
  question: Батч из 26 примеров разбит на шарды по 6, 9 и 11 примеров. Каждая GPU возвращает не среднее, а СУММУ градиентов по своему шарду; для одной координаты это 78, 45 и 111. Чему равна эта координата градиента полного батча, если батчевый loss определён как среднее по примерам?
  explanation: 'Суммы уже несут вес шарда внутри себя, поэтому взвешивать их повторно нельзя: (78+45+111)/26 = 234/26 = 9. Ошибка — усреднить дважды, то есть взять среднее трёх сумм (78+45+111)/3 = 78, что завышает градиент примерно в 8-9 раз. Правило: суммы складывают и делят на N один раз, средние — взвешивают числом примеров.'
  kind: numeric
  answer: 9
  tolerance: 0.01
  id: 018-gradient-average-1
  fingerprint: ed17ce45
- concept: сведение градиентов выполняется покомпонентно, и веса шардов одинаковы для всех координат градиента
  question: Модель имеет 70 000 000 параметров, обучение идёт на 16 GPU с шардами разного размера. Как устроено сведение локальных градиентов в градиент полного батча?
  explanation: Градиент — вектор длиной в число параметров, и линейность усреднения работает по каждой координате отдельно. Вес зависит только от того, сколько примеров обработала GPU, а не от того, какой это параметр, поэтому один набор из 16 весов применяется ко всем 70 млн координат сразу. Свёртка в норму теряет направление и градиентом батча не является.
  kind: choice
  options:
    - Каждая из 70 млн координат сводится независимо по одной и той же формуле, и веса шардов для всех координат одни и те же
    - Для каждой координаты вес GPU подбирается заново, пропорционально вкладу этой координаты в loss
    - Градиент каждой GPU сначала сворачивается в одно число (норму), нормы сводятся, а потом вектор восстанавливается по направлению
    - Сводятся только координаты, которые заметно изменились, остальные берутся с ведущей GPU
  correct: 0
