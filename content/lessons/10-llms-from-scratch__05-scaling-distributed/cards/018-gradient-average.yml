- concept: рассогласование соглашения «сумма против среднего» между локальным вычислением и all-reduce масштабирует итоговый градиент в размер шарда раз
  question: Кластер из 16 GPU, шарды по 32 примера. Каждая GPU по ошибке возвращает СУММУ градиентов своего шарда, а all-reduce выполняет обычное усреднение по 16 значениям. Как итог соотносится с истинным градиентом батча?
  explanation: Сумма по шарду = 32 × среднее по шарду. Усреднение по 16 GPU корректно сводит одинаковые шарды, но множитель 32 внутри каждого слагаемого остаётся. Итог завышен ровно в размер шарда раз — фактически это эквивалентно увеличению learning rate в 32 раза, что обычно и проявляется как расходящееся обучение.
  kind: choice
  options:
    - Больше истинного в 32 раза
    - Больше истинного в 16 раз
    - Больше истинного в 512 раз
    - 'Совпадает с истинным: суммирование и усреднение компенсируют друг друга'
  correct: 0
