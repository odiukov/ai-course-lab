- concept: 'стоимость прогона считается как N × (L/q) × r: длительность выводится из объёма токенов и суммарной пропускной способности, а счёт — из GPU-часов и цены часа'
  question: Обучение требует 9 триллионов токенов. Кластер из 1024 GPU держит суммарную пропускную способность 5 миллионов токенов в секунду, аренда одной GPU стоит $4 в час. Сколько долларов будет стоить прогон?
  explanation: 'T = L/q = 9e12 / 5e6 = 1,8e6 секунд = 500 часов. GPU-часы = 1024 × 500 = 512 000. Счёт = 512 000 × $4 = $2 048 000. Обратите внимание: цена одной GPU сама по себе ничего не говорит — она умножается на длительность, которую задаёт пропускная способность всего кластера.'
  kind: numeric
  answer: 2048000
  tolerance: 20000
  id: 058-throughput-cost-1
  fingerprint: 20146a69
- concept: при сублинейном росте пропускной способности счёт за прогон растёт в (во сколько раз выросло N)/(во сколько раз выросла q) раз
  question: Кластер расширяют с 4096 до 12288 GPU (в 3 раза), но из-за коммуникаций суммарная пропускная способность вырастает лишь в 2,5 раза. Объём обучения в токенах и цена GPU-часа прежние. Во сколько раз изменится стоимость прогона?
  explanation: C = N·(L/q)·r, значит отношение стоимостей = (N_new/N_old) / (q_new/q_old) = 3 / 2,5 = 1,2. Прогон закончится в 2,5 раза быстрее, но GPU-часов израсходуется на 20% больше — ровно настолько же вырастет счёт.
  kind: numeric
  answer: 1.2
  tolerance: 0.02
  id: 058-throughput-cost-2
  fingerprint: d554f7a4
- concept: сравнивать типы ускорителей нужно по цене за токен (цена часа / пропускная способность), а не по цене часа
  question: GPU типа X стоит $2,20 в час, GPU типа Y — $5,50 в час, то есть в 2,5 раза дороже. При этом Y даёт в 3,2 раза больше токенов в секунду при той же эффективности масштабирования. Какой кластер дешевле для фиксированного объёма токенов?
  explanation: 'Счёт = (цена часа) × (GPU-часы), а GPU-часы обратно пропорциональны пропускной способности. Значит решает отношение r/q — цена за токен. Здесь 2,5/3,2 ≈ 0,78: несмотря на вдвое с лишним более дорогой час, прогон на Y выйдет примерно на 22% дешевле. Быстрые дорогие GPU выгодны, пока прирост скорости обгоняет прирост цены.'
  kind: choice
  options:
    - Кластер на X — он дешевле в час, а объём токенов от типа GPU не зависит
    - Кластер на Y — цена выросла в 2,5 раза, а работа выполняется в 3,2 раза быстрее, поэтому счёт составит около 78% от варианта X
    - 'Стоимость совпадёт: рост цены всегда компенсируется ростом скорости'
    - Кластер на Y дороже ровно в 2,5 раза, скорость на счёт не влияет
  correct: 1
  id: 058-throughput-cost-3
  fingerprint: 22e6702c
