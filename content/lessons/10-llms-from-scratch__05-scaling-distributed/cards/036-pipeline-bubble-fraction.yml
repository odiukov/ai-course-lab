- concept: снижение пузыря увеличением числа микробатчей оплачивается пиком памяти под активации всех микробатчей в полёте
  question: Инженер снижает долю пузыря, увеличив число микробатчей с 2 до 32 при 8 стадиях. Какой ресурс он тратит взамен и почему?
  explanation: 'Пузырь лечится количеством микробатчей, но каждый из них живёт в памяти от своего forward до своего backward. Поэтому предел — не арифметика, а объём HBM: при 8 стадиях и 32 микробатчах ранние стадии держат больше всего одновременных наборов активаций.'
  kind: open
  reference: 'Память под активации. Каждый микробатч, запущенный в прямом проходе, обязан хранить свои активации до собственного обратного прохода. При 32 микробатчах в полёте стадия держит до 32 наборов активаций вместо 2, то есть пик памяти растёт примерно пропорционально числу микробатчей. Веса, градиенты и число шагов оптимизатора при этом не меняются — шаг всё равно один на батч. Отсюда стандартный компромисс: меньше пузырь — больше памяти, и число микробатчей ограничено сверху вместимостью GPU (либо требует пересчёта активаций).'
  id: 036-pipeline-bubble-fraction-2
