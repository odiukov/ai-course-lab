- concept: доля пузыря определяется только числом стадий и числом микробатчей и не зависит от длительности одной стадии
  question: Конвейер из 5 стадий и 3 микробатчей даёт долю пузыря ≈ 0.571. Инженер оптимизировал ядра и каждая стадия стала считать ровно вдвое быстрее (стадии по-прежнему равны между собой). Чему станет равна доля пузыря?
  explanation: 'Расписание конвейера масштабируется целиком: и полезная работа, и общее время сжимаются в одно и то же число раз, а их отношение не меняется. Доля пузыря зависит только от числа стадий и микробатчей. Итерация станет вдвое короче по времени, но простой останется той же долей слотов — уменьшить его можно только увеличением числа микробатчей или уменьшением числа стадий.'
  kind: numeric
  answer: 0.571
  tolerance: 0.005
