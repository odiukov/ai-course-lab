- concept: 'конечный автомат propose-then-commit состоит из четырёх фаз в фиксированном порядке: propose, surface, commit, verify'
  question: Расставь фазы паттерна propose-then-commit в правильном порядке.
  explanation: Предложение сначала становится долговечной записью, потом показывается человеку, потом отдельным явным коммитом исполняется, и только после исполнения проверяется по факту. Verify стоит именно после коммита.
  kind: order
  items:
    - Агент формирует предложенное действие с метаданными и сохраняет его в надёжное хранилище
    - Предложение вместе с метаданными показывается человеку-ревьюеру
    - Человек явно коммитит именно эту сохранённую запись, после чего действие выполняется
    - Система перечитывает побочный эффект и подтверждает, что он действительно произошёл
  id: 006-four-phases-1
  fingerprint: 274a3e74
- concept: фаза verify перечитывает реальное состояние после коммита; успешный ответ вызова не доказывает, что побочный эффект произошёл
  question: После коммита агент вызвал API смены тарифа и получил ответ со статусом успеха. Зачем нужна отдельная фаза проверки?
  explanation: 'Ответ вызова говорит о запросе, а не о состоянии мира: изменение могло не примениться, откатиться или примениться частично. Verify перечитывает эффект, и при расхождении система фиксирует известное плохое состояние и поднимает алерт.'
  kind: choice
  options:
    - Чтобы записать в аудиторский след, что пользователь нажал кнопку подтверждения
    - 'Чтобы независимо перечитать состояние: успешный ответ не гарантирует, что эффект применился'
    - Чтобы дать ревьюеру возможность отменить уже выполненное действие
    - Чтобы сгенерировать новый ключ идемпотентности для следующего предложения
  correct: 1
  id: 006-four-phases-2
  fingerprint: b5afb236
- concept: ключ идемпотентности в предложении гарантирует, что повторная отправка возвращает ту же запись, а не создаёт второе действие
  question: Клиент из-за таймаута семь раз повторил отправку одного и того же предложения. Какое поле в записи предложения обязано не допустить семи выполненных действий?
  explanation: 'Ключ уникален для предложения: повторный запрос с тем же ключом возвращает уже существующую запись вместо создания новой. Без него ретраи сети превращаются в дубли необратимых действий.'
  kind: cloze
  template: proposal = create_proposal(intent, scope, blast_radius, rollback_plan, ___="prop-9c41")
  answer: idempotency_key
  accept:
    - idempotencyKey
    - ключ идемпотентности
    - idempotency key
  id: 006-four-phases-3
  fingerprint: 99c94fa2
