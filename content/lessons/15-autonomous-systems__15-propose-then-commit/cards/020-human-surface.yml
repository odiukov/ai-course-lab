- concept: на фазе Surface решение принимает участник, не участвовавший в создании предложения; автор не может быть своим утверждающим
  question: 'Команда добавила в конвейер второй экземпляр того же агента: он получает готовое предложение вместе с исходной задачей и контекстом автора и выносит вердикт. Считается ли это независимым ревью на фазе Surface?'
  explanation: Независимость — свойство источника суждения, а не количества процессов. Проверяющий, унаследовавший цель и контекст автора, продолжает то же рассуждение. Гейт даёт информацию, только когда решение принимает человек вне цепочки создания и с полномочием отклонить.
  kind: choice
  options:
    - 'Да: это отдельный процесс, значит роли разделены'
    - 'Нет: проверяющий работает с той же целью и той же моделью ситуации, поэтому воспроизведёт ошибочную посылку автора; фазу Surface закрывает человек, не участвовавший в создании предложения и имеющий право отказать'
    - Да, если второй экземпляр запущен с более строгим системным промптом
  correct: 1
  id: 020-human-surface-1
  fingerprint: 2b273364
- concept: самопроверка находит формальные дефекты, но не ошибку в исходной посылке, потому что использует ту же интерпретацию ситуации
  question: Агент подготовил платёж поставщику и по просьбе перечитал собственное предложение, ответив «всё верно». Объясни своими словами, какой класс ошибок такая самопроверка ловит, а какой — нет, и почему.
  explanation: 'Проверка на согласованность с собой и проверка на соответствие реальности — разные вещи. Первая доступна автору, вторая требует внешней точки опоры: источника данных и человека, который к нему обращается.'
  kind: open
  reference: 'Самопроверка ловит формальные дефекты: незаполненные поля, опечатки, внутренние несоответствия текста самому себе. Она не ловит ошибку в посылке — например, взят счёт за другой месяц или не тот получатель, — потому что повторное чтение выполняется той же интерпретацией задачи, которая и породила ошибку: неверная посылка при перечитывании выглядит как верная. Для такой ошибки нужен независимый ревьюер, сверяющий предложение с внешним источником (исходный счёт, реестр контрагентов), а не с рассуждением автора.'
  id: 020-human-surface-2
  fingerprint: 34c7ea91
- concept: задача ревьюера — оценить допустимость показанного действия, а не реконструировать намерение агента
  question: 'Ревьюер видит предложение, в котором получатель платежа выглядит странно, и рассуждает: «Наверное, агент имел в виду головную компанию, у него обычно так». Что не так с этой позицией?'
  explanation: 'Достраивая замысел, ревьюер перестаёт быть независимой инстанцией: он одобряет не то, что выполнится, а свою реконструкцию. Выполнится же ровно предъявленное действие. Непонятное предложение — повод эскалировать или отклонить.'
  kind: choice
  options:
    - 'Ничего: понимание логики агента ускоряет ревью'
    - Ревьюер достраивает намерение вместо оценки показанного действия и тем самым возвращает решение внутрь рассуждения автора; решать нужно про эффект ровно в том виде, в каком он предъявлен, иначе — запрос разъяснений или отказ
    - Проблема лишь в том, что догадка не попадёт в аудиторский след
