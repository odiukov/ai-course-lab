- concept: происхождение данных даёт ревьюеру проверяемую ссылку на источник, тогда как намерение только заявляет причину
  question: 'Два предложения о возврате средств совпадают по тексту действия. В первом указан источник: обращение клиента и конкретная строка платежа в биллинге. Во втором поле источника заполнено фразой «по результатам анализа». Что даёт ревьюеру первое предложение?'
  explanation: 'Происхождение данных — след к конкретному источнику, который можно открыть и сверить. Обобщённая формулировка занимает поле, но проверить по ней нечего: ревьюеру остаётся верить агенту на слово.'
  kind: choice
  options:
    - Возможность открыть источник и убедиться, что он действительно поддерживает заявленную причину
    - Гарантию, что действие обратимо
    - Подтверждение, что у агента есть права на операцию
    - Более точную оценку радиуса поражения
  correct: 0
  id: 008-intent-lineage-1
  fingerprint: 6856a80d
- concept: намерение должно называть причину действия, а не пересказывать само действие
  question: 'Агент предлагает закрыть тикет №2041. В поле намерения написано: «закрыть тикет №2041». Чем плохо такое заполнение?'
  explanation: Намерение отвечает на вопрос «зачем», а не «что». Тавтологичное поле проходит формальную проверку комплектности, но не даёт ревьюеру ни одного нового факта для решения.
  kind: choice
  options:
    - Намерение дублирует действие и не сообщает причину, поэтому нельзя проверить, соответствует ли предложение задаче
    - Намерение обязано содержать план отката
    - Намерение должно быть короче описания действия
    - 'Ничего плохого: поле не пустое, ревью может продолжаться'
  correct: 0
  id: 008-intent-lineage-2
  fingerprint: 65848a36
- concept: намерение и происхождение данных отвечают на разные вопросы, и только вместе дают проверяемую причинную цепочку
  question: Чем намерение отличается от происхождения данных в предложении и почему одного намерения ревьюеру недостаточно?
  explanation: Намерение объясняет, происхождение данных — доказывает. Без второго ревьюер оценивает не факты, а качество формулировки.
  kind: open
  reference: 'Намерение отвечает на вопрос «зачем это делать» — называет цель или причину, стоящую за действием. Происхождение данных отвечает на вопрос «на основании чего агент так решил» — указывает конкретный источник: письмо, запись в базе, документ, событие. Намерение может быть правдоподобно сформулировано и при этом не соответствовать действительности: убедительность текста не является доказательством. Происхождение данных позволяет открыть источник и проверить, поддерживает ли он заявленную причину и относится ли к этому объекту. Два предложения с одинаковым текстом действия и намерения могут заслуживать разного доверия именно из-за источника.'
  id: 008-intent-lineage-3
  fingerprint: a052514c
