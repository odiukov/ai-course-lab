- concept: 'требование эффективного человеческого надзора — операциональный критерий: надзор должен реально влиять на исход, поэтому формальное одобрение его не удовлетворяет'
  question: Высокорисковая ИИ-система должна обеспечивать эффективный человеческий надзор. Команда добавила перед каждым действием кнопку Approve, и все действия одобряются. Требование выполнено?
  explanation: Регулятор требует надзора, который влияет на исход, а не наличия элемента интерфейса. Именно поэтому нужны структурированные метаданные и вынужденный содержательный ответ ревьюера.
  kind: choice
  options:
    - 'Да: человеческое участие присутствует в каждом действии, а форма участия значения не имеет'
    - 'Нет: слово «эффективный» задаёт критерий результата — человек должен быть способен понять предложенное действие и реально его остановить, а сплошная штамповка этого не показывает'
    - Да, если кнопка сопровождается предупреждающим текстом о рисках
    - Нет, но проблема снимается увеличением числа одобряющих сотрудников
  correct: 1
  id: 032-effective-oversight-1
  fingerprint: 2a20d0da
- concept: паттерн даёт проверяемый след человеческого суждения, но соответствие требованиям определяется системой, её классом риска и организацией контроля
  question: 'Менеджер заявляет: «Мы внедрили propose-then-commit, значит наша система соответствует требованиям к человеческому надзору». Что здесь верно, а что — подмена?'
  explanation: Технический паттерн производит доказательства; квалификация системы и достаточность контроля — отдельный вопрос.
  kind: open
  reference: 'Верно, что паттерн даёт то, чего нет у простого Approve: сохранённое предложение, зафиксированные показанные человеку последствия, его осмысленный ответ и последующее исполнение — то есть связную цепочку доказательств, по которой независимый наблюдатель отличит решение человека от автоматического продолжения процесса. Подмена в выводе о соответствии: соответствие определяется конкретной системой, её классом риска и организацией контроля, а паттерн лишь обеспечивает проверяемый след суждения. Без такого следа «человек участвовал» остаётся утверждением, но наличие следа само по себе не заменяет оценку системы.'
  id: 032-effective-oversight-2
  fingerprint: 98c29ef9
