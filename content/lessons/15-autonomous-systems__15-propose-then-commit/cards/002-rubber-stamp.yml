- concept: запись об одобрении в аудиторском следе доказывает факт клика, но не понимание последствий, поэтому не годится как доказательство надзора постфактум
  question: 'После инцидента расследование находит в журнале запись: «действие подтверждено пользователем, время подтверждения 0.4 с». Что эта запись доказывает?'
  explanation: 'Аудиторский след фиксирует событие «нажата кнопка». Понимание последствий он не фиксирует, поэтому история одобрений даёт ложное чувство безопасности: юридически разрешено, фактически не проверено.'
  kind: choice
  options:
    - Что человек ознакомился с содержанием действия и принял его последствия
    - Что действие было формально разрешено, но не то, что оно было понято и проверено
    - Что журналирование настроено неправильно и запись недостоверна
