- concept: ключ строится как детерминированный хэш от (кто, что, над чем), чтобы одинаковое предложение давало одинаковый ключ, а разное — разный
  question: Как правильно получать ключ идемпотентности для предложенного действия?
  explanation: Свежий UUID или метка времени на каждой попытке делают ретрай неотличимым от нового распоряжения — дедупликация ломается. Общий ключ на весь воркфлоу, наоборот, съест законные разные действия. Детерминированный хэш от (кто, что, над чем) — приём из платёжных API вроде Stripe и AWS.
  kind: choice
  options:
    - Генерировать случайный UUID на каждую попытку выполнения
    - Считать хэш от (кто, что делает, над чем) — одинаковое предложение даёт одинаковый ключ
    - Брать текущую метку времени с точностью до миллисекунды
    - Использовать один общий ключ на весь воркфлоу
