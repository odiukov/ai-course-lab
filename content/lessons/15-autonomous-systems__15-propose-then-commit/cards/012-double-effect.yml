- concept: потерянный ответ означает неизвестный исход, а не невыполненное действие
  question: Воркфлоу отправил команду на выполнение и не получил подтверждения из-за обрыва сети. Что достоверно известно системе?
  explanation: 'Отсутствие подтверждения говорит только о том, что воркфлоу не узнал результат. Рассуждение «нет ответа — значит, ничего не было» и порождает двойное списание: повтор нужен, но безопасным его делает не догадка об исходе, а дедупликация на стороне исполнителя.'
  kind: choice
