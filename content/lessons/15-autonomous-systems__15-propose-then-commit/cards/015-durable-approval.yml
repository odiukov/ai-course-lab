- concept: возобновление после одобрения начинается с точки прерывания, а не с начала воркфлоу
  question: Воркфлоу дошёл до `interrupt()`, чекпоинт записан, процесс завершился. Через двое суток приходит одобрение. Что делает система при возобновлении?
  explanation: 'Чекпоинт хранит закладку: состояние и место продолжения. Перезапуск с нуля повторил бы уже выполненные шаги и их побочные эффекты, а отклонение сделало бы любое человеческое решение бесполезным после первого рестарта. Смысл durable-паузы — продолжить ровно с точки прерывания.'
  kind: choice
  options:
    - Прогоняет воркфлоу с первого узла заново, используя сохранённые входные данные
    - Загружает чекпоинт и продолжает исполнение сразу после точки прерывания
    - Создаёт новый экземпляр воркфлоу и выполняет только шаг Commit вслепую
    - Отклоняет одобрение, потому что исходный процесс больше не существует
  correct: 1
  id: 015-durable-approval-1
  fingerprint: 89a46d1b
- concept: ожидание одобрения удерживает состояние в хранилище, а не работающий процесс
  question: Расположи события durable-паузы на одобрение в правильном порядке.
  explanation: 'Между шагами 3 и 4 в системе нет ни одного живого процесса — ожидание не стоит вычислительных ресурсов. Именно поэтому пауза может длиться дни: ждёт запись в хранилище, а не запущенная программа.'
  kind: order
  items:
    - Воркфлоу доходит до узла с вызовом interrupt() и приостанавливается
    - Состояние воркфлоу и предложение записываются чекпоинтом в постоянное хранилище
    - Процесс воркфлоу завершается или перезапускается, ничего не удерживая в памяти
    - Человек присылает решение по показанному предложению
    - Система находит сохранённый чекпоинт и восстанавливает из него состояние
    - Исполнение продолжается после точки прерывания и выполняет Commit
  id: 015-durable-approval-2
  fingerprint: 6d2d7b67
