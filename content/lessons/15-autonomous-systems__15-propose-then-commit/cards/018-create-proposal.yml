- concept: 'создание предложения атомарно: наблюдаемо либо целое предложение, либо его отсутствие, промежуточного состояния не существует'
  question: Процесс упал посреди сохранения предложения о платеже. Какое требование к хранилищу делает эту ситуацию безопасной?
  explanation: 'Видимое состояние «почти готово» опасно тем, что неполное предложение может дойти до человека, а его нельзя показывать на одобрение. Атомарность убирает такое состояние из числа наблюдаемых: после сбоя есть либо полная запись, либо ничего, и повтор просто создаст её заново.'
  kind: choice
  options:
    - Хранилище сохраняет поля по мере готовности, а недостающие дописывает при следующем запуске
    - Хранилище фиксирует предложение целиком либо не оставляет никакой записи
    - Хранилище помечает частичную запись флагом «черновик» и показывает её человеку
    - Хранилище хранит последнюю версию каждого поля отдельно
  correct: 1
  id: 018-create-proposal-1
  fingerprint: 91bdcbe3
- concept: атомарность записи в файловое хранилище достигается записью во временный файл и последующим атомарным переименованием
  question: Надёжное хранилище предложений — JSON-файл. Как записать новое состояние так, чтобы читатель никогда не увидел наполовину записанный файл?
  explanation: 'Прямая запись поверх файла оставляет окно, в котором содержимое повреждено, а сброс из памяти по расписанию теряет данные при падении. Переименование в пределах одной файловой системы — атомарная операция: читатель видит либо прежнюю версию, либо новую, целую.'
  kind: choice
  options:
    - Открыть файл на запись и дописывать объекты по мере их сборки
    - Записать полное содержимое во временный файл и атомарно переименовать его поверх целевого
    - Держать актуальное состояние в памяти, а на диск сбрасывать раз в минуту
    - Писать файл как есть, а после записи проверять его валидность и чинить при поломке
  correct: 1
  id: 018-create-proposal-2
  fingerprint: 126dece9
