- concept: 'одобрение хранится как переход конкретной записи с доказательствами (кто, когда, какие ответы), а не как булев флаг: флаг помнит согласие, но теряет его предмет и обстоятельства'
  question: Сервис хранит результат ревью как поле `approved = true` у задачи. Чего принципиально не хватает такому представлению одобрения?
  explanation: Одобрение — переход в машине состояний, а не свойство «да/нет». Переход хранит идентичность записи, ревьюера, момент и ответы чек-листа. Без этой связки фаза Commit получает безымянное «да», которое нельзя сопоставить с выполняемым эффектом.
  kind: choice
  options:
    - 'Ничего не хватает: флага достаточно, если он выставляется только после чек-листа'
    - 'Не хватает предмета и обстоятельств решения: кто проверил, когда, на какие вопросы ответил и какая именно запись перешла из состояния ожидания ревью в одобренное — флаг фиксирует факт согласия, но не то, с чем человек согласился'
    - Не хватает только отметки времени, остальное восстанавливается по логам приложения
  correct: 1
  id: 022-approval-transition-1
  fingerprint: b26f7cd9
- concept: предусловия перехода в одобренное состояние проверяются системой в момент перехода, а не обеспечиваются интерфейсом ревьюера
  question: Кнопка Approve в веб-интерфейсе разблокируется только после чек-листа. Почему сервер всё равно обязан перепроверять условия перехода при обработке запроса на одобрение?
  explanation: 'Форсирующая функция в UI меняет поведение добросовестного ревьюера, но не является гарантией. Гарантией служит проверка предусловий в точке перехода состояния: только она защищает от обхода интерфейса, устаревших вкладок и повторных запросов.'
  kind: choice
  options:
    - Чтобы дублировать проверку на случай ошибок вёрстки
    - Потому что блокировка кнопки — свойство клиента, а запрос на переход можно отправить в обход интерфейса; условия (запись ещё ожидает ревью, метаданные заполнены, срок не истёк, ответы даны) обязаны проверяться там, где меняется состояние
    - Потому что клиентские проверки медленнее серверных
  correct: 1
