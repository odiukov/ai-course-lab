- concept: успешная демонстрация счастливого сценария не подтверждает наличие рабочего HITL-гейта — аудит проверяет поведение при сбое, задержке, повторе и невнимательном ревьюере
  question: Процесс с одобрением опасного действия отработал на демонстрации без единой ошибки. Что это доказывает о качестве HITL?
  explanation: Демонстрация показывает маршрут, на котором ничего не ломается. Свойства HITL — надёжность хранения, ограниченность срока одобрения, однократность эффекта, подтверждение результата — видны только на отказных сценариях.
  kind: choice
  options:
    - 'Что гейт работает: успешный проход и есть проверка'
    - 'Практически ничего: гейт проявляет себя на сбое, задержке решения, повторной попытке и невнимательном ревьюере, а счастливый маршрут все эти ситуации обходит'
    - Что метаданные предложения достаточны, раз ревьюер смог принять решение
    - Что подтверждение эффекта не требуется, раз демонстрация завершилась успехом
  correct: 1
  id: 033-design-audit-1
  fingerprint: 26a34d14
- concept: разные свойства HITL вскрываются разными отказными сценариями, поэтому дефект локализуется выбором сценария проверки
  question: 'Аудитор хочет проверить ровно одно свойство: не выполнится ли внешний эффект дважды. Какой сценарий это показывает?'
  explanation: Перезапуск проверяет надёжность хранения, невнимательный ревьюер — слой challenge-and-response, ложный успех API — проверку фактического эффекта. Дубликат эффекта показывает именно ретрай после обрыва.
  kind: choice
  options:
    - Перезапустить процесс между показом предложения и решением человека
    - Повторить исполнение уже одобренного предложения после обрыва связи и сравнить число реальных эффектов
    - Дать ревьюеру одобрить не глядя и посмотреть, что запишется в журнал
    - Подменить ответ внешнего API на успешный и прочитать состояние ресурса
  correct: 1
  id: 033-design-audit-2
  fingerprint: da0d3a63
