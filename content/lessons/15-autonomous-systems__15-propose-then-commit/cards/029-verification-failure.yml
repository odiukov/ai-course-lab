- concept: причины провала verify различаются в записи, потому что несовпадение значения, отсутствие ресурса и недоступность чтения ведут к разным восстановительным действиям
  question: Почему `verification_failed` должен хранить конкретную причину — «значение не совпало», «ресурс не найден» или «чтение не удалось», — а не одну общую отметку неуспеха?
  explanation: Недоступность чтения и подтверждённое несовпадение значений — разные факты о мире. Схлопнув их в общий неуспех, система теряет ровно ту информацию, ради которой фаза Verify и существует.
  kind: choice
  options:
    - Чтобы уменьшить объём хранимых записей о неудачах
    - 'Потому что за этими причинами стоят разные сценарии и разные дальнейшие действия: сверка с внешней системой, поиск удалённого ресурса, повторное чтение при недоступности'
    - Потому что общая отметка не даёт пометить предложение как просроченное
    - Потому что только так одобрение остаётся действующим
