- concept: потребность в HITL определяется обратимостью последствия, а не тяжестью, длительностью или сложностью операции
  question: 'Агент выполняет два шага: (1) аналитический read-only запрос, который читает 9 миллионов строк и грузит базу на минуту, (2) один UPDATE одной строки в продакшен-таблице тарифов. На каком шаге обязателен HITL-гейт?'
  explanation: Критерий — что останется в мире после ошибки. Тяжёлое чтение не оставляет следа и относится к категории reads (никогда HITL), а маленькая запись в продакшен относится к consequential (всегда HITL).
  kind: choice
  options:
    - 'На первом: он дороже и создаёт нагрузку'
    - 'На втором: он меняет продакшен-состояние, и откат не гарантирован'
    - 'На обоих: любое обращение к продакшен-базе требует подтверждения'
  correct: 1
  id: 004-consequential-1
  fingerprint: add1a6c2
- concept: 'три категории действий упорядочены по требуемому уровню человеческого гейта: чтение — никогда, обратимое изменение — иногда, необратимый эффект — всегда'
  question: 'Расставь действия по возрастанию требуемого гейта: от того, где подтверждение не нужно никогда, до того, где оно обязательно всегда.'
  explanation: Reads не меняют состояние — гейт там только создаёт шум. Обратимые изменения гейтуются выборочно, по риску и качеству отката. Необратимые записи, транзакции и исходящие сообщения гейтуются всегда.
  kind: order
  items:
    - Вызов read-only API и перечисление ресурсов
    - Правка локального файла под контролем версий с понятным откатом
    - Изменение записей в staging-окружении, влияющее на чужую работу
    - Рассылка исходящих писем клиентам и разрушительное удаление данных без копии
  id: 004-consequential-2
  fingerprint: edac2340
