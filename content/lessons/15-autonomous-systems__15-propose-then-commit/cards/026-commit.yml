- concept: в commit предусловия и поиск уже сохранённого результата выполняются до вызова исполнителя, а запись результата и переход состояния — после него
  question: Расставь шаги реализации `commit` в правильном порядке.
  explanation: 'Отсутствующее, неодобренное или просроченное предложение отсеивается до любого внешнего вызова. Сохранённый результат проверяется тоже до вызова — иначе ретрай снова дёрнет исполнителя. Запись результата и смена состояния идут последними: пометить committed можно только после реального ответа.'
  kind: order
  items:
    - Загрузить предложение из хранилища и проверить, что его статус — approved
    - Проверить, что одобрение не просрочено на переданный момент времени
    - Посмотреть, нет ли уже сохранённого результата исполнения, и вернуть его, если он есть
    - Вызвать исполнителя, передав действие вместе с ключом идемпотентности предложения
    - Сохранить полученный результат и перевести предложение в состояние committed
  id: 026-commit-1
  fingerprint: 2e4c46b5
- concept: 'временная ошибка исполнителя оставляет запись пригодной для повторной попытки: результат не сохраняется и состояние committed не выставляется'
  question: Исполнитель вернул временную сетевую ошибку. Что `commit` должен сделать с записью предложения?
  explanation: 'Сохранённый результат и статус committed означают «исполнение завершено», и все последующие вызовы вернут этот исход, не обращаясь к исполнителю, — временная ошибка так превратится в вечную. Новый ключ на ретрае тоже недопустим: внешний сервис перестанет узнавать повтор и создаст второй эффект.'
  kind: choice
  options:
    - Перевести предложение в committed и сохранить ошибку как результат исполнения
    - Оставить статус прежним и не сохранять результат, чтобы следующий вызов мог повторить попытку с тем же ключом
    - Пометить предложение отклонённым и потребовать нового одобрения
    - Сгенерировать новый ключ идемпотентности и сразу повторить вызов
