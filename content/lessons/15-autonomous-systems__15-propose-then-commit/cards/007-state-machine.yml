- concept: отклонённое или просроченное предложение — терминальное состояние, из которого нет перехода к выполнению
  question: Ревьюер отклонил предложение об удалении ветки. Позже агент получает тот же запрос и пытается выполнить действие, ссылаясь на уже существующую запись этого предложения. Как должна повести себя корректная машина состояний propose-then-commit?
  explanation: 'Смысл машины состояний в том, что список разрешённых переходов конечен. Отклонённое, просроченное и уже выполненное предложение — поглощающие состояния: из них нельзя вернуться к исполнению. Иначе агент получает способ обойти решение человека, просто повторив запрос.'
  kind: choice
  options:
    - 'Отклонённое предложение — терминальное состояние: перехода к выполнению из него нет, нужно новое предложение и новое ревью'
    - Отклонение снимается автоматически, если агент повторяет запрос без изменений
    - Предложение возвращается в состояние ожидания ревью, потому что отклонение относилось только к первой попытке
    - Агент может выполнить действие, если с момента отклонения прошло достаточно времени
  correct: 0
  id: 007-state-machine-1
  fingerprint: 76f9c1c0
- concept: провал фазы verify фиксирует известное плохое состояние и поднимает алерт, а не трактуется как «действия не было»
  question: После коммита система перечитала состояние и не обнаружила ожидаемого побочного эффекта. Что должно произойти дальше?
  explanation: Провал проверки не означает «эффекта не было» — он означает «мы не знаем реального состояния мира». Тихий повтор может удвоить эффект, а перевод в «подтверждено» скрывает поломку. Правильный исход — явно зафиксированное плохое состояние и алерт.
  kind: choice
  options:
    - 'Зафиксировать известное плохое состояние и поднять алерт: предложение не считается подтверждённым, нужно вмешательство человека'
    - Молча повторять выполнение, пока проверка не пройдёт
    - 'Пометить предложение подтверждённым: вызов ведь вернул успех'
    - Считать, что действия не было, и вернуть предложение в очередь на ревью
  correct: 0
  id: 007-state-machine-2
  fingerprint: 396d6ef7
- concept: предложение хранится в надёжном внешнем хранилище, потому что состояние должно переживать перезапуски и связывать одобрение с конкретной записью
  question: Почему предложение в propose-then-commit сохраняется в надёжное хранилище (PostgreSQL, Redis, Durable Object), а не остаётся в памяти процесса, который его сформировал?
  explanation: В памяти процесса состояние теряется при рестарте, а без устойчивой записи нельзя ни привязать одобрение к конкретной версии, ни отличить повтор от нового действия.
  kind: open
  reference: 'Ревью асинхронно: между формированием предложения и решением человека проходит время, процесс может перезапуститься, воркер — смениться. Состояние предложения (черновик, показано, одобрено, выполнено, подтверждено) должно пережить это, иначе после рестарта непонятно, что уже одобрено и что уже выполнено. Хранилище также даёт устойчивую идентичность записи: одобрение ссылается на конкретную сохранённую версию, повторный запрос находит по ключу ту же запись, а история переходов остаётся проверяемой постфактум.'
  id: 007-state-machine-3
  fingerprint: fcde1402
