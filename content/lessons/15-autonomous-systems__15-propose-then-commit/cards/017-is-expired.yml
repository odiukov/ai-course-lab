- concept: момент проверки передаётся параметром, а не читается из системных часов внутри функции
  question: Почему `is_expired` принимает `now` аргументом вместо вызова `datetime.now()` внутри?
  explanation: 'Чтение часов внутри делает функцию недетерминированной: одна и та же проверка даёт разный результат в разные моменты, а граничные случаи невозможно проверить тестом. Явный `now` превращает проверку в чистую функцию двух моментов времени.'
  kind: choice
  options:
    - Так функция работает быстрее, потому что не обращается к системным часам
    - 'Так результат воспроизводим: тест и повторный запуск воркфлоу с тем же входом дают тот же ответ'
    - Так функция автоматически учитывает часовой пояс пользователя
    - Так исключается необходимость хранить expires_at в базе
  correct: 1
  id: 017-is-expired-2
  fingerprint: 9bb6b666
- concept: сравниваются абсолютные моменты времени с совместимыми часовыми поясами, а не строки или локальные показания часов
  question: Предложение одобрено в 11:05 в одном часовом поясе, а `expires_at` записан в другом. Что обеспечит корректную проверку срока?
  explanation: Строки и отдельные компоненты (часы, минуты) не задают точку на общей временной оси, поэтому 11:40 в одной зоне может оказаться раньше 11:39:59 в другой. Корректно сравнивать только абсолютные моменты с известным смещением; naive-значение рядом с aware-значением в Python вообще даст ошибку сравнения.
  kind: choice
  options:
    - Лексикографическое сравнение строковых представлений времени
    - Сравнение только часов и минут без учёта даты
    - Сравнение timezone-aware моментов, приведённых к общей шкале
    - Округление обоих значений до ближайшего часа перед сравнением
  correct: 2
  id: 017-is-expired-3
  fingerprint: 42370daa
