- concept: verify сравнивает только поля, которые должен был изменить commit, а не объект целиком
  question: 'Verify перечитал заказ: одобренное поле — адрес доставки — совпадает с предложением, но полное сравнение объектов дало расхождение. Почему сравнивать объект целиком нельзя?'
  explanation: Verify отвечает на вопрос «изменилось ли то, что было одобрено». Служебные поля меняются сами по себе, и сравнение объекта целиком превращает нормальную работу сервера в ложные провалы проверки.
  kind: choice
  options:
    - Сервер мог независимо обновить служебные поля — время изменения, версию, счётчики, — которые к одобренному эффекту отношения не имеют
    - Полное сравнение слишком дорого по трафику и времени
    - Клиентский кэш всегда возвращает часть полей устаревшими
  correct: 0
  id: 028-verify-1
  fingerprint: 0558083e
- concept: неуспехом verify считается не только несовпадение значения, но и недоступность ресурса и ошибка чтения
  question: Какие исходы чтения `verify` обязан трактовать как неуспех проверки?
  explanation: Verify подтверждает результат положительным наблюдением. Ресурс, который не прочитался или исчез, наблюдения не даёт, значит подтверждения нет. Ответ commit при этом запасным доказательством не служит.
  kind: choice
  options:
    - Только несовпадение прочитанного значения с одобренным
    - Несовпадение значения, отсутствие ресурса и неудавшееся чтение
    - Несовпадение значения, но лишь если исполнитель не вернул код успеха
  correct: 1
  id: 028-verify-2
  fingerprint: d10dc84c
- concept: 'verify только наблюдает результат и не выполняет ремедиацию: повторный commit внутри проверки запрещён'
  question: Verify увидел, что нужное поле не изменилось. Почему нельзя прямо внутри `verify` повторно вызвать `commit`?
  explanation: 'Разделение ролей и есть смысл фазы: commit пытается, verify наблюдает. Смешение даёт систему, которая не умеет отличать «не подтверждено» от «надо сделать ещё раз».'
  kind: open
  reference: 'Verify — наблюдатель, его выход должен быть суждением «подтверждено / не подтверждено», а не действием. Повтор внутри проверки смешивает роли и лишает систему честного сигнала: неудачное наблюдение сразу превращается в новую попытку изменить мир. К тому же провал чтения не доказывает, что эффекта не было (чтение могло попасть на устаревшую копию, ответ мог потеряться), поэтому слепой повтор рискует создать второй побочный эффект. Решение о ремедиации принимается отдельно — по зафиксированному расхождению.'
  id: 028-verify-3
  fingerprint: 7c10600f
