- concept: надзор возможен только если проверяемые параметры действия показаны до выполнения, а не пересказаны после
  question: Агент готовит исходящее действие. Что именно нужно показать человеку, чтобы его подтверждение считалось надзором, а не просто фактом нажатия кнопки? Объясни своими словами.
  explanation: 'Ключевых условий два: детали доступны заранее и одобрение связано с показанной версией. Отчёт после выполнения не даёт ни того, ни другого — вмешаться уже некуда.'
  kind: open
  reference: 'До выполнения нужно показать сам ещё не выполненный вариант действия: адресата/цель, точное содержимое и параметры изменения, объём затронутого (сколько записей, кому уйдёт), какие права и данные задействованы и что произойдёт при ошибке. Показ должен идти до эффекта, чтобы предложение можно было отклонить или вернуть на правку, а подтверждение должно запускать именно ту версию, которую человек прочитал.'
