- concept: склейка полей без разделителей и фиксированной структуры даёт коллизии ключей у разных предложений
  question: Ключ считается как хэш от конкатенации значений полей без разделителей. Предложение с параметрами (45, 6) и предложение с параметрами (4, 56) дают строку «456». Что произойдёт?
  explanation: 'Хэш детерминирован: одинаковый вход — одинаковый выход. Разные наборы полей схлопнулись в одну строку ещё до хэширования, поэтому разный по смыслу эффект получит один ключ, и исполнитель молча пропустит его как дубликат. Лечится структурированным представлением с именами полей и разделителями.'
  kind: choice
  options:
    - 'Ничего: хэш всё равно разведёт входы по разным значениям'
    - Второе предложение получит тот же ключ и будет ошибочно принято за ретрай первого
    - Оба предложения будут отклонены как некорректные
    - Второе предложение получит новый ключ, потому что порядок аргументов различается
  correct: 1
  id: 014-idempotency-key-1
  fingerprint: 85baf1fe
- concept: детерминированная сериализация входа (фиксированный порядок полей) — обязательное условие воспроизводимости ключа
  question: Вход ключа собирают в словарь и сериализуют в JSON перед хэшированием. Какой аргумент гарантирует, что два одинаковых по содержанию словаря дадут байт в байт одинаковую строку?
  explanation: Порядок ключей в словаре может отличаться между сборками входа, а хэш чувствителен к каждому байту. Фиксированный порядок полей делает сериализацию канонической, и тот же набор значений всегда даёт тот же ключ.
  kind: cloze
  template: 'payload = json.dumps({"actor": actor, "action": action, "target": target}, ___=True)'
  answer: sort_keys
  accept:
    - sort_keys=True
    - 'sort_keys '
  id: 014-idempotency-key-2
  fingerprint: 273c952a
- concept: во вход ключа входят только существенные для эффекта поля; изменчивые технические значения исключаются
  question: Какое поле нельзя включать во вход ключа идемпотентности для перевода средств?
  explanation: 'Номер попытки, метка времени ретрая и случайные значения меняются при каждом повторе, поэтому ключ перестаёт быть стабильным и каждая попытка выглядит новым действием. Во вход идут только поля, задающие сам эффект: участник, действие, цель и существенные параметры.'
  kind: choice
  options:
    - Идентификатор счёта-источника
    - Номер текущей попытки доставки
    - Сумма перевода
    - Идентификатор счёта-получателя
  correct: 1
