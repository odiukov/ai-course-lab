- concept: необратимость исходящего сообщения определяется эффектом вне системы (получатель уже прочитал), а не наличием кнопки удаления внутри неё
  question: Почтовый сервис умеет отзывать отправленное письмо. Значит ли это, что отправку клиентам можно считать обратимым действием и убрать гейт? Объясни.
  explanation: Обратимость измеряется по внешнему миру, а не по возможностям своего API. Всё, что уже увидели люди или внешние системы, вернуть нельзя, даже если запись у нас исчезнет.
  kind: open
  reference: Нет. Отзыв работает внутри системы отправителя и только пока письмо не прочитано; получатель мог уже увидеть текст, переслать его, получить push-уведомление или ответить. Эффект живёт вне контура, которым мы управляем, откат негарантирован, поэтому исходящие сообщения остаются consequential и требуют подтверждения человеком до отправки.
  id: 005-check-risk-2
  fingerprint: 866e1db4
