- concept: валидация обязана проверять информативность значения, а не только факт его непустоты
  question: Поле радиуса поражения заполнено строкой «возможны последствия», и проверка комплектности пропускает предложение дальше. В чём дефект такой проверки?
  explanation: Формально заполненное поле удовлетворяет проверке на непустоту, но не даёт ревьюеру ни одного факта. Обязательные поля нужны ради содержания ответа, поэтому и проверять надо ответ, а не занятое место.
  kind: choice
  options:
