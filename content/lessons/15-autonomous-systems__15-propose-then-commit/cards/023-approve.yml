- concept: функция одобрения фиксирует разрешение и не производит внешних эффектов — исполнение остаётся отдельной фазой
  question: В функцию одобрения предложения об удалении записей добавили сам вызов удаления — «чтобы не терять контекст». Что ломается?
  explanation: 'Разделение фаз даёт три вещи: возможность выполнить позже и из другого процесса, отдельную проверку побочного эффекта после исполнения и однозначную диагностику отказа. Побочные эффекты внутри функции одобрения всё это уничтожают.'
  kind: choice
  options:
    - 'Ничего: одобрение и так означает, что действие нужно выполнить'
    - 'Сливаются фазы: одобрение перестаёт быть отменяемым решением, исчезает точка между разрешением и исполнением, а сбой при удалении становится неотличим от сбоя записи решения; функция одобрения должна лишь создавать проверяемое разрешение'
    - 'Ломается только производительность: удаление удлиняет обработку запроса ревьюера'
  correct: 1
  id: 023-approve-1
  fingerprint: 28462eee
- concept: одобрение выполняет все предусловия до изменения состояния, а переход и сохранение — последними
  question: Расставь шаги функции одобрения в правильном порядке.
  explanation: Все предусловия проверяются до изменения состояния; переход и запись идут последними. Такой порядок гарантирует, что при провале любой проверки запись остаётся ровно в прежнем состоянии.
  kind: order
  items:
    - Убедиться, что предложение всё ещё ожидает ревью, а не одобрено или отклонено
    - Проверить комплектность обязательных метаданных предложения
    - Проверить, что срок предложения не истёк на переданный момент времени
    - Убедиться, что ревьюер не совпадает с автором предложения
    - Убедиться, что на каждый обязательный вопрос чек-листа дан положительный ответ
    - Перевести предложение в одобренное состояние и сохранить ревьюера, момент и ответы
  id: 023-approve-2
  fingerprint: b217cedc
- concept: 'провал любого предусловия оставляет запись без изменений: частичное применение одобрения запрещено'
  question: Функция одобрения записала в предложение имя ревьюера и время, а затем обнаружила, что срок предложения истёк, и вернула ошибку. Почему это дефект, даже если состояние осталось «ожидает ревью»?
  explanation: Отказ должен быть наблюдаемо «ничего не произошло». Частично заполненная запись создаёт третье, неопределённое состояние между «ожидает ревью» и «одобрено», на которое никакая последующая проверка не рассчитана.
  kind: choice
  options:
    - 'Это не дефект: состояние не изменилось, а лишние поля никому не мешают'
    - Запись получила следы несостоявшегося одобрения; позже они выглядят как признаки пройденного ревью и могут быть приняты кодом или человеком за факт одобрения — при провале предусловия запись обязана остаться нетронутой
    - Дефект только в том, что имя ревьюера — персональные данные
  correct: 1
  id: 023-approve-3
  fingerprint: b4f169d0
