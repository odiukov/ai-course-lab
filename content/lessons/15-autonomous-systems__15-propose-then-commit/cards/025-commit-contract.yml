- concept: источник истины на фазе commit — заново прочитанная запись предложения, а не признак одобрения, переданный вместе с вызовом
  question: 'Исполняющий сервис получает вызов commit, в котором передан флаг `approved: true` и полное описание действия. Что он обязан использовать как источник истины перед выполнением?'
  explanation: 'Флаг в вызове воспроизводим и повторяем: любой ретрай или ошибочная ветка кода принесёт его снова. Действующим разрешением является состояние конкретной записи в хранилище на момент исполнения, поэтому commit перечитывает её и сверяет статус, версию действия и срок.'
  kind: choice
  options:
    - Флаг `approved` в вызове — он пришёл от того же воркфлоу, что и одобрение
    - 'Заново прочитанную из хранилища запись предложения: её текущий статус, версию действия и срок одобрения'
    - Последнюю запись в логе ревью, где видно имя утверждающего
  correct: 1
  id: 025-commit-contract-1
  fingerprint: 39c4b013
- concept: право на исполнение захватывается атомарным переходом записи, потому что проверка статуса не мешает двум параллельным вызовам пройти её одновременно
  question: Два вызова commit по одному и тому же одобренному предложению приходят почти одновременно, и оба читают статус `approved`. Почему проверки статуса недостаточно и чем её надо дополнить?
  explanation: Одобрение разрешает один конкретный эффект, а не любое число попыток его воспроизвести. Гарантию даёт не порядок проверок в коде, а атомарность самого перехода записи в состояние «принято к исполнению».
  kind: open
  reference: 'Чтение статуса и последующее выполнение — две отдельные операции, между ними есть окно: оба вызова успевают увидеть `approved` и оба переходят к исполнению, получая два побочных эффекта. Нужен атомарный захват: одной операцией (условный апдейт вида «перевести из approved в in_progress, если статус всё ещё approved», compare-and-set, транзакция) право на исполнение забирает ровно один вызов. Проигравший вызов видит, что переход уже сделан, и не запускает исполнителя, а возвращает исход уже идущего или завершённого исполнения.'
  id: 025-commit-contract-2
  fingerprint: b61dc780
