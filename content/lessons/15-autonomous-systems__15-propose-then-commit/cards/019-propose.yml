- concept: 'порядок операций в propose: валидация до сохранения, поиск по ключу до создания, возврат только после фиксации'
  question: Расставь шаги функции создания предложения (propose) в правильном порядке.
  explanation: Валидация идёт до записи, иначе неполное предложение попадёт в очередь на одобрение. Поиск по ключу — до создания, иначе ретрай породит вторую запись. Возврат — после фиксации, иначе вызывающий получит предложение, которого нет в хранилище.
  kind: order
  items:
    - Собрать предложенное действие из входных параметров
    - Проверить комплектность обязательных метаданных; при пропусках вернуть ошибку, не сохраняя запись
    - Вычислить детерминированный ключ идемпотентности по параметрам действия
    - 'Обратиться к хранилищу: если запись с таким ключом уже есть — вернуть её без изменений'
    - Сохранить новое предложение в состоянии ожидания одобрения и вернуть его после успешной записи
  id: 019-propose-1
  fingerprint: d87b9968
- concept: проверка существования ключа и запись новой записи должны быть одной атомарной операцией, иначе гонка параллельных ретраев создаёт дубликат
  question: Клиент из-за таймаута отправил два одинаковых запроса на создание предложения, они обрабатываются одновременно. Функция сначала читает хранилище (ключа нет), потом пишет новую запись. Что произойдёт и как это чинится?
  explanation: 'Детерминированный ключ сам по себе не защищает: между чтением и записью есть окно. Нужна атомарная проверка-и-вставка — уникальный индекс на ключе или операция под блокировкой хранилища. Иначе человек увидит два одинаковых предложения и сможет одобрить оба.'
  kind: choice
  options:
    - 'Ничего страшного: ключи одинаковые, поэтому вторая запись перезапишет первую и останется одна'
    - Оба вызова прочитают пустой результат и создадут по записи; чтение и запись должны выполняться как одна атомарная операция (блокировка или вставка с уникальным ключом)
    - Проблема решается увеличением таймаута клиента, код менять не нужно
  correct: 1
  id: 019-propose-2
  fingerprint: 327ef775
- concept: повторный вызов возвращает уже сохранённую запись без обновления её полей — иначе ретрай доставки неотличим от нового намерения
  question: При повторной доставке того же запроса функция нашла предложение с совпавшим ключом. Почему нельзя обновить у него время создания и выдать новый идентификатор?
  explanation: 'Смысл идемпотентности — чтобы повтор был наблюдаемо тем же событием. Новые идентификатор и метка времени создают вторую сущность на уровне смысла, даже если запись в хранилище одна: срок одобрения продлевается сам собой, а решение человека привязано к идентификатору, которого больше нет.'
  kind: choice
  options:
    - Потому что запись в хранилище физически нельзя изменить после создания
    - 'Потому что обновление сделало бы ретрай доставки похожим на новое намерение: сдвинулся бы отсчёт срока действия, а ссылки ревьюера на прежний идентификатор перестали бы совпадать с записью'
    - Потому что обновление полей замедляет ответ и повышает нагрузку на хранилище
  correct: 1
  id: 019-propose-3
  fingerprint: dbafae4c
