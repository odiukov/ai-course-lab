- concept: 'комплектность предложения, актуальность одобрения и осознанность подтверждения — независимые условия, соединённые конъюнкцией: выполнение одного не компенсирует нарушение другого'
  question: Как соотносятся три требования к одобрению — предложение заполнено полностью, одобрение не устарело, ревьюер явно ответил на контрольные вопросы?
