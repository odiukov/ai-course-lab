- concept: долговечность хранения гарантирует сохранность решения, но не его актуальность в момент исполнения
  question: Одобрение пролежало в надёжном хранилище трое суток и восстановилось без потерь. Что из этого НЕ следует?
  explanation: Хранилище отвечает за сохранность байтов, а не за состояние мира. За время ожидания цена, остаток, статус заявки или права участника могли измениться, и человек проверял предложение в другом контексте. Это две разные гарантии, и вторую даёт только проверка перед Commit.
  kind: choice
  options:
    - Решение человека не исчезло при перезапусках
    - Известно, какое именно предложение было одобрено
    - Условия, при которых человек согласился, всё ещё выполняются
    - Воркфлоу может продолжить исполнение с сохранённого места
  correct: 2
  id: 016-stale-approval-1
  fingerprint: fbcea3a6
- concept: у одобрения есть граница применимости (срок или предусловие вроде версии объекта), сверяемая перед выполнением
  question: Одобрение выдано с условием «действительно 6 часов и пока версия заявки равна 3». Перед Commit система видит, что версия заявки стала 4. Как правильно поступить?
  explanation: 'Нарушено предусловие, значит выполняемое расходится с увиденным. Срок ещё не истёк, но одна из границ применимости пробита — этого достаточно. Тихая пересборка выполнила бы неодобренную версию, а полная отмена не нужна: корректный ход — новое предложение и новый показ.'
  kind: choice
  options:
    - 'Выполнить действие: одобрение получено и срок ещё не истёк'
    - Тихо пересобрать предложение под новые данные и выполнить его
    - Обновить предложение и показать его человеку на повторное одобрение
    - Отменить весь воркфлоу без возможности возобновления
  correct: 2
  id: 016-stale-approval-2
  fingerprint: 343e2452
