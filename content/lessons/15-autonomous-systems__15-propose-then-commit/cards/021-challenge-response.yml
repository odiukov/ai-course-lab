- concept: 'challenge-and-response — форсирующая функция: доступ к одобрению открывается только после явных ответов, потому что порядок доступных действий меняет поведение сильнее инструкций'
  question: 'Команда борется со штамповкой одобрений. Вариант A: над кнопкой Approve крупная надпись «Внимательно прочитайте предложение». Вариант B: кнопка Approve неактивна, пока ревьюер не ответил на вопросы о затронутом ресурсе, радиусе поражения и плане отката. Почему B работает, а A нет?'
  explanation: Форсирующая функция встраивает проверку в путь к действию, а не рядом с ним. Инструкцию можно проигнорировать без единого лишнего движения; заблокированную кнопку — нет.
  kind: choice
  options:
    - B работает потому, что напоминание в B сформулировано конкретнее
    - 'B меняет доступный порядок действий: одобрение физически недостижимо, пока не выполнено обращение к содержанию предложения, тогда как A оставляет рефлекторный клик доступным и полагается на добрую волю'
    - B работает потому, что задержка в десяток секунд сама по себе снижает число ошибок
  correct: 1
  id: 021-challenge-response-1
  fingerprint: 1ad8c2fc
- concept: вопросы чек-листа должны требовать извлечения конкретных значений предложения, иначе они снова допускают автоматический ответ
  question: Какой набор вопросов перед кнопкой одобрения действительно работает как challenge-and-response?
  explanation: 'Вопрос имеет смысл, только если ответ нельзя дать не заглянув в предложение: назвать таблицу, посмотреть объём затронутого, найти способ отката. Вопросы про прочтение, уверенность и ответственность отвечаются рефлекторно и восстанавливают штамповку в новой обёртке.'
  kind: choice
  options:
    - «Вы прочитали предложение?», «Вы согласны?», «Вы уверены?»
    - «Какой ресурс это затрагивает?», «Приемлем ли радиус поражения?», «Есть ли план отката, если это сломается?»
    - «Подтверждаете ли вы, что берёте ответственность за последствия?», «Ознакомлены ли вы с регламентом?»
  correct: 1
  id: 021-challenge-response-2
  fingerprint: 6ad4b59f
- concept: 'у ревьюера, не способного честно ответить на чек-лист, оба доступных выхода безопасны: эскалация или отказ'
  question: Ревьюер не может честно ответить на вопрос о радиусе поражения. Какие действия оставляет ему интерфейс с challenge-and-response и почему такая конструкция считается безопасным дефолтом?
  explanation: 'Безопасный дефолт — это когда бездействие и неуверенность ведут к отсутствию эффекта. Обычная пара кнопок нарушает это правило: непонимание там так же легко превращается в одобрение, как и в отказ.'
  kind: open
  reference: 'Доступны два выхода: запросить разъяснения (эскалация) или отклонить предложение. Одобрить он не может — кнопка остаётся заблокированной. Оба доступных исхода не производят необратимого эффекта: непонятое предложение либо возвращается на доработку, либо отклоняется. Опасного варианта «одобрю, наверное, всё нормально» в интерфейсе просто нет, поэтому непонимание автоматически приводит к безопасному результату, а не к случайному.'
  id: 021-challenge-response-3
  fingerprint: 60cdbd5f
