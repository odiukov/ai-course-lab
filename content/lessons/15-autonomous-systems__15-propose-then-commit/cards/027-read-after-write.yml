- concept: подтверждением эффекта служит независимое чтение целевого ресурса, а не самоотчёт компонента, выполнявшего действие
  question: Воркфлоу поднял кредитный лимит карты и хочет подтвердить, что эффект наступил. Какое наблюдение годится как подтверждение?
  explanation: Самоотчёт исполнителя и записи об ошибках говорят о ходе вызова. Подтверждает эффект только независимое наблюдение состояния того ресурса, который должен был измениться.
  kind: choice
  options:
    - Исполнитель повторно сообщил, что операция прошла без ошибок
    - Отдельный read целевого ресурса вернул именно новый лимит
    - В очереди задач нет записей об ошибках по этому воркфлоу
  correct: 1
  id: 027-read-after-write-1
  fingerprint: 86c24302
- concept: успешный ответ и состояние ресурса расходятся из-за обрыва после отправки запроса или из-за конкурентной перезаписи
  question: Запрос на изменение вернул успех, но ресурс хранит прежнее значение. Какое объяснение самое правдоподобное?
  explanation: Ложный успех рождается не из злого умысла компонента, а из сетевых разрывов и гонок записи. Именно поэтому код ответа не может служить доказательством состояния данных.
  kind: choice
  options:
    - Связь оборвалась между обработкой и фиксацией записи, либо параллельное обновление перезаписало значение старым
    - Исполнитель систематически возвращает недостоверные коды ответа
    - Ключ идемпотентности был вычислен по неверному набору полей
    - Одобрение ревьюера истекло в момент выполнения
  correct: 0
  id: 027-read-after-write-2
  fingerprint: 540babdf
- concept: фаза verify — это классический read-after-write, известный по RETURNING в базах и GetObject после PutObject
  question: Какой известный приём работы с хранилищами соответствует фазе Verify?
  explanation: И `RETURNING`, и чтение объекта после записи возвращают фактически сохранённое состояние, а не рапорт об отправленной команде. Verify стоит один дешёвый read, а его отсутствие стоит молчаливого расхождения между логом и данными.
  kind: choice
  options:
    - '`SELECT ... FOR UPDATE` перед записью'
    - '`INSERT ... RETURNING` в базе и `GetObject` после `PutObject` в объектном хранилище'
    - Экспоненциальный backoff между ретраями
    - Батчинг нескольких записей в одну транзакцию
  correct: 1
  id: 027-read-after-write-3
  fingerprint: b36c5fad
