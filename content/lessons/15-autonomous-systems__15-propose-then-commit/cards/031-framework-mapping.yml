- concept: 'одна форма HITL реализована в разных SDK под разными именами: interrupt(), RequestInfoEvent, waitForApproval()'
  question: Команда переносит готовый HITL-протокол с LangGraph на Cloudflare Workers и ищет, чем заменить `interrupt()`. Что верно?
  explanation: 'Имена в API разные, форма одна. `interrupt()` подчёркивает паузу, `RequestInfoEvent` — обмен информацией, `waitForApproval()` — условие продолжения, но во всех трёх случаях граница одна: предложение уже проверяемо, действие ещё не совершено.'
  kind: choice
  options:
    - 'Прямого аналога нет: `waitForApproval()` решает другую задачу — только приём согласия, без приостановки'
    - '`waitForApproval()` занимает то же место в форме: выполнение останавливается до побочного эффекта, ответ человека сохраняется, работа продолжается с этой точки'
    - Аналогом служит любой механизм ретрая, потому что приостановка — частный случай повторной попытки
    - 'Перенос невозможен без смены протокола: у каждого SDK своя схема человеческого надзора'
  correct: 1
  id: 031-framework-mapping-1
  fingerprint: ad0ed0fa
- concept: механизм паузы в SDK даёт место для ворот, но не обеспечивает качество надзора — это задача протокола поверх API
  question: 'Разработчик говорит: «Мы вызываем встроенный механизм ожидания одобрения из фреймворка, значит HITL у нас есть». Объясни своими словами, почему этого недостаточно и что остаётся на стороне протокола.'
  explanation: API предоставляет место для ворот; надёжными ворота делает протокол вокруг него.
  kind: open
  reference: Вызов паузы даёт только точку остановки перед побочным эффектом. Он не проверяет, что человеку показали существенные метаданные предложения, не мешает принять бессодержательное одобрение, не связывает решение с конкретной версией предложения и не защищает от повторного эффекта после возобновления, а также не подтверждает фактический результат. Полнота предложения, содержательное ревью, защита исполнения от дублей и последующая проверка реального эффекта строятся поверх API самим протоколом.
  id: 031-framework-mapping-2
  fingerprint: 594330b7
- concept: независимая конвергенция разных фреймворков на одной схеме — признак того, что схема продиктована свойствами задачи, а не выбором вендора
  question: Три независимых управляемых SDK для агентов пришли к одинаковой схеме приостановки перед опасным действием. Какой вывод из этого корректен?
  explanation: Независимое совпадение решений — сильный сигнал, что форма вытекает из природы задачи. Значит, при собственной реализации без SDK ту же границу придётся строить руками.
  kind: choice
  options:
    - Схема — временная мода экосистемы, её стоит ждать замены в следующем поколении инструментов
    - Схема продиктована свойствами самой задачи, поэтому её придётся воспроизводить и в собственной реализации без фреймворка
    - Достаточно выбрать любой из SDK, и вопрос надзора закрыт целиком
    - Совпадение означает, что фреймворки копируют друг у друга, поэтому проверять свою реализацию не нужно
  correct: 1
