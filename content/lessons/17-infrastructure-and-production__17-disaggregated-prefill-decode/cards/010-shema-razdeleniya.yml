- concept: порядок прохождения запроса через раздельные пулы prefill и decode
  question: Расположи этапы обработки запроса в системе с раздельными пулами prefill и decode.
  explanation: Сначала prefill обрабатывает промпт и создаёт состояние внимания. Затем KV-кэш пересылается в decode-пул, который продолжает запрос и выдаёт токены клиенту.
  kind: order
  items:
    - Роутер принимает пользовательский запрос
    - Промпт поступает в prefill-пул
    - Prefill-пул вычисляет KV-кэш
    - KV-кэш передаётся в decode-пул
    - Decode-пул генерирует и отправляет токены клиенту
