- concept: причинная маска предотвращает утечку будущих целевых токенов при параллельном обучении декодера
  question: При обучении autoregressive-декодера методом teacher forcing ему передают весь эталонный текст. Зачем в self-attention при этом нужна причинная маска?
  explanation: Без причинной маски позиция декодера могла бы увидеть следующие эталонные токены и фактически списать ответ. Маска сохраняет параллельное обучение, но делает доступной только текущую и предыдущие позиции, как при autoregressive-генерации.
  kind: choice
  options:
    - Чтобы декодер не использовал будущие целевые токены для предсказания текущего токена
    - Чтобы декодер обращался только к последней позиции выхода энкодера
    - Чтобы удалить из транскрипта редкие BPE-токены
    - Чтобы свести все веса attention к равномерному распределению
  correct: 0
  id: 012-dekoder-cross-attention-1
  fingerprint: 83d5e848
- concept: cross-attention может обращаться ко всему выходу энкодера, поскольку акустический вход известен до начала декодирования
  question: Почему в обычном офлайн-распознавании Whisper cross-attention декодера может обращаться ко всем позициям выхода энкодера, хотя self-attention декодера ограничен причинной маской?
  explanation: Ограничения различаются из-за доступности данных. Выход энкодера для всего клипа вычислен заранее, тогда как продолжение текста должно создаваться последовательно и не может использовать ещё не сгенерированные токены.
  kind: open
  reference: Весь аудиофрагмент сначала обрабатывается энкодером, поэтому все его акустические представления уже доступны при генерации любого текстового токена. Будущие текстовые токены ещё неизвестны, и доступ к ним вызвал бы утечку ответа, поэтому причинное ограничение требуется для self-attention, но не для cross-attention к полностью обработанному аудио.
  id: 012-dekoder-cross-attention-2
  fingerprint: 3f83bcea
