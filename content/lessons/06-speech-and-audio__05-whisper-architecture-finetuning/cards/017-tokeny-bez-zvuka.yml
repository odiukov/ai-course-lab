- concept: инструктивный смысл спецтокена формируется контекстами его употребления при обучении
  question: Объясни своими словами, почему спецтокен без соответствующего ему звука может управлять продолжением, которое генерирует декодер Whisper.
  explanation: Значение токена задаётся не обязательной связью со звуком, а статистикой обучающих последовательностей. Если спецтокен регулярно предшествует определённому типу продолжения, декодер учится менять распределение следующих токенов в соответствии с этой инструкцией.
  kind: open
  reference: Во время обучения такой токен систематически находился в инструктивном префиксе перед целевым текстом. По следующим за ним последовательностям модель выучила его контекстное значение, хотя токен не соответствует произнесённому фрагменту аудио.
