- concept: pad_or_trim изменяет длину по последней оси массива
  question: Заполните индекс оси, чтобы одна реализация работала и с одномерным аудио, и со спектрограммой, где время расположено в последнем измерении.
  explanation: Индекс -1 всегда обозначает последнюю ось независимо от числа измерений массива. Поэтому код подходит как для сэмплов, так и для многомерных признаков с временной осью в конце.
  kind: cloze
  template: current_length = x.shape[___]
  answer: '-1'
  accept:
    - '-1'
    - x.ndim - 1
  id: 008-code-pad-or-trim-2
  fingerprint: aa729a63
- concept: приведение временной длины отделено от нормализации значений
  question: Объясните своими словами, почему функция pad_or_trim не должна одновременно нормализовать амплитуды аудио или значения спектрограммы.
  explanation: Обрезка и паддинг решают вопрос формы входа, а нормализация — вопрос масштаба значений. Whisper требует собственной обработки log-mel-признаков, поэтому скрытая нормализация внутри функции длины может нарушить ожидаемое распределение входа.
  kind: open
  reference: 'У функции должен быть узкий контракт: изменить только размер временной оси, сохранив все оставшиеся исходные значения. Нормализация — отдельный этап предобработки со своими правилами; её смешивание с pad_or_trim усложняет проверку и может незаметно изменить вход модели.'
  id: 008-code-pad-or-trim-3
  fingerprint: c85318b1
