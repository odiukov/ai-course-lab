- concept: число сырых кадров определяется выбранным правилом округления неполного шага
  question: Диагностическая функция использует правило raw_frames = floor(duration / hop). Длительность клипа равна 7.37 секунды, а шаг анализа — 12 мс. Сколько сырых кадров она насчитает?
  explanation: 'Шаг нужно перевести в секунды: 12 мс = 0.012 с. Получается floor(7.37 / 0.012) = floor(614.16…) = 614. Явное правило округления не даёт разным частям пайплайна расходиться на один кадр.'
  kind: numeric
  answer: 614
  tolerance: 0.01
  id: 010-code-frame-budget-1
  fingerprint: '46308e32'
- concept: число позиций энкодера вычисляется по подогнанной длине, а не по числу сырых кадров
  question: Пусть R — число сырых кадров, W — вместимость окна, F = min(R, W), а S — коэффициент прореживания. Какая формула даёт число позиций энкодера, если F делится на S без остатка?
  explanation: Энкодер получает последовательность уже после обрезки или паддинга, поэтому его длина равна F / S. Деление R / S завысит число позиций для клипа, который длиннее окна.
  kind: choice
  options:
    - R / S
    - F / S
    - W - R
  correct: 1
  id: 010-code-frame-budget-2
  fingerprint: d67b0b07
