- concept: меньшая модель может доминировать более крупную одновременно по WER, размеру и скорости
  question: Вариант North содержит 1,2 млрд параметров, имеет WER 2,6 % и обрабатывает аудио со скоростью 1,4× реального времени. Вариант Swift содержит 680 млн параметров, имеет WER 2,1 % и скорость 7×. Объясните, почему меньший размер Swift в этой ситуации не означает компромисс по качеству.
  explanation: 'У Swift лучше все три приведённые характеристики: размер меньше, WER ниже, а скорость выше. Более крупная модель не обязательно предпочтительнее, если другой вариант лежит вне обычной кривой «больше параметров — ниже WER».'
  kind: open
  reference: Swift одновременно требует меньше параметров, допускает меньше ошибок и быстрее обрабатывает аудио. Поэтому по указанным метрикам он доминирует North, а число параметров само по себе не позволяет предсказать качество варианта.
