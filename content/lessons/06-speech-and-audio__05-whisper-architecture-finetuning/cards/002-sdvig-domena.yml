- concept: гладкий вывод Whisper не гарантирует достоверность распознавания
  question: Почему связный и уверенно звучащий текст Whisper на участке тишины нельзя считать свидетельством того, что речь действительно была распознана?
  explanation: ASR-модель может подставить статистически правдоподобную фразу даже без речи. Поэтому тишину и другие непривычные входы нужно обрабатывать явно, а результат проверять независимо от его языковой гладкости.
  kind: open
  reference: Whisper генерирует наиболее вероятную последовательность токенов и не обязан явно отвечать, что ничего не услышал. При отсутствии полезного речевого сигнала декодер может продолжить правдоподобным текстом, поэтому уверенная формулировка не гарантирует соответствия аудио.
  id: 002-sdvig-domena-2
  fingerprint: b3ca30fe
- concept: меры против сдвига домена применяют от обработки входа к изменению модели
  question: Расположите меры против ошибок Whisper в порядке разумной эскалации — от наименее затратной к наиболее затратной.
  explanation: Сначала устраняют проблемы входного аудио, затем меняют способ выбора выходных токенов. Дообучение требует размеченных данных и вычислений, поэтому к нему переходят, если более дешёвых мер недостаточно.
  kind: order
  items:
    - Исправить нарезку и подачу аудио
    - Настроить параметры декодирования
    - Дообучить модель на данных целевого домена
