- concept: языковой prior декодера может маскировать потерю корректной акустической информации
  question: Объясните, почему Whisper может выдать грамматически связную, но не относящуюся к записи транскрипцию, если на вход энкодера поданы mel-признаки в неверном масштабе.
  explanation: Децибелы Librosa могут иметь значения около −80, тогда как Whisper ожидает нормализованный вход примерно в диапазоне от −1 до 1. Энкодер получает непривычные активации, но декодер всё ещё умеет строить правдоподобный текст по своему языковому контексту, поэтому ошибка не обязана выглядеть как случайный набор символов.
  kind: open
  reference: 'Неверный масштаб переводит активации энкодера за распределение, встречавшееся при обучении, поэтому акустическое условие становится ненадёжным. Однако авторегрессионный декодер остаётся языковой моделью: управляющие токены и уже сгенерированный текст позволяют ему продолжать вероятные последовательности слов. Поэтому результат может быть гладким по форме, но не соответствовать звуку.'
