- concept: монотонная диагональ cross-attention отражает выравнивание текстовых токенов с временными позициями аудио
  question: На карте cross-attention более поздние токены декодера устойчиво связываются с более поздними позициями энкодера. Что означает такой диагональный рисунок?
  explanation: При обычной речи порядок слов соответствует ходу времени. Поэтому последовательное смещение пика внимания вправо показывает, с каким участком аудио связан каждый текстовый токен.
  kind: choice
  options:
    - Декодер перестал учитывать акустический вход
    - Модель выучила монотонное выравнивание текста с аудио
    - Энкодер предсказывает следующие текстовые токены
    - Все attention-головы выполняют одинаковую функцию
  correct: 1
  id: 042-diagonal-cross-attention-1
  fingerprint: 8cd389f1
- concept: таймстемп вычисляется умножением позиции энкодера на временной шаг его сетки
  question: Одна позиция энкодера соответствует 0.025 секунды аудио. Пик cross-attention токена находится на позиции 440. Какому времени в секундах соответствует этот пик?
  explanation: 'Время равно индексу позиции, умноженному на шаг временной сетки: 440 × 0.025 = 11 секунд.'
  kind: numeric
  answer: 11
  tolerance: 0.01
  id: 042-diagonal-cross-attention-2
  fingerprint: f4e67baa
- concept: размытое или застрявшее cross-attention указывает на отсутствие надёжной акустической привязки текста
  question: Объясни своими словами, почему размазанное по всей временной оси внимание или повторная привязка многих токенов к одной позиции может быть признаком галлюцинации распознающей модели.
  explanation: При корректном распознавании связь токенов с аудио обычно последовательно движется по временной оси. Рассеивание внимания или остановка на одной позиции показывают, что эта связь нарушена.
  kind: open
  reference: Такой рисунок означает, что декодер не находит для порождаемых токенов последовательных акустических свидетельств. Он может продолжать текст за счёт языковых закономерностей, хотя слова не привязаны к соответствующим участкам аудио.
  id: 042-diagonal-cross-attention-3
  fingerprint: cd0c8522
