- concept: строгая малая задержка потокового распознавания требует решения, рассчитанного на streaming
  question: Система должна выдавать текст по мере поступления аудио с жёстким ограничением задержки. Какой вариант наиболее уместен?
  explanation: Базовая Whisper рассчитана на обработку фиксированных окон и не предназначена для строгой потоковой задержки. Whisper-Streaming и Parakeet-TDT лучше соответствуют требованию инкрементального вывода.
  kind: choice
  options:
    - WhisperX с принудительным выравниванием после полной расшифровки
    - Обычная Whisper с LoRA для предметной области
    - Whisper-Streaming или Parakeet-TDT
    - faster-whisper с последующей диаризацией
