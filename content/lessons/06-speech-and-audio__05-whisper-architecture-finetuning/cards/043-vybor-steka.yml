- concept: 'обвязка Whisper выбирается по ограничению задачи: квантование для edge, LoRA для языковой адаптации, WhisperX для пословного выравнивания'
  question: Какое соответствие верно для запуска на маломощном устройстве, адаптации к низкоресурсному языку и получения пословных таймстемпов?
