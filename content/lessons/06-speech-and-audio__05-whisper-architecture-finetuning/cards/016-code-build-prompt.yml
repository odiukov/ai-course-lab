- concept: токен notimestamps добавляется только при отключённых таймстемпах
  question: Заполни условие, чтобы префикс декодера Whisper правильно управлял генерацией таймстемпов.
  explanation: У Whisper нет отдельного управляющего токена «генерировать таймстемпы». Токен <|notimestamps|> запрещает их, поэтому его добавляют, когда timestamps=False, и опускают, когда таймстемпы нужны.
  kind: cloze
  template: |-
    tokens = ["<|startoftranscript|>", f"<|{language}|>", f"<|{task}|>"]
    if ___:
        tokens.append("<|notimestamps|>")
  answer: not timestamps
  accept:
    - timestamps is False
    - not timestamps
  id: 016-code-build-prompt-1
  fingerprint: bde45a38
- concept: endoftext завершает целевую последовательность и не входит в инструктивный префикс декодера
  question: Функция формирует только управляющий префикс Whisper, который подаётся перед текстом транскрипции. Что ей следует сделать с токеном <|endoftext|>?
  explanation: <|endoftext|> отмечает конец целевой последовательности после транскрипции. Управляющий префикс содержит только инструкции, предшествующие генерируемому тексту, поэтому терминатор в него не включают.
  kind: choice
  options:
    - Поставить его перед токеном начала транскрипции
    - Добавить его в конец управляющего префикса
    - 'Не добавлять: этот токен обозначает завершение текста, а не инструкцию перед ним'
    - Использовать его вместо токена задачи
  correct: 2
  id: 016-code-build-prompt-2
  fingerprint: 6e6fce0c
