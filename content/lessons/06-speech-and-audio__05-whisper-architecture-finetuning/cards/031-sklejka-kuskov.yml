- concept: локальные таймкоды фрагмента переводятся в глобальные прибавлением смещения его начала
  question: Аудиофрагмент начинается на отметке 83 секунды исходной записи. Слово распознано на локальной отметке 7.35 секунды. Каков его глобальный таймкод в секундах?
  explanation: 'Глобальное время равно локальному времени плюс смещение начала фрагмента: 7.35 + 83 = 90.35 секунды. Без такого преобразования таймкоды каждого окна ошибочно отсчитывались бы от его собственного начала.'
  kind: numeric
  answer: 90.35
  tolerance: 0.005
  id: 031-sklejka-kuskov-1
  fingerprint: bd7651e4
- concept: перекрывающиеся транскрипции склеивают по единственной границе, предпочитая результаты вдали от краёв окон
  question: Два соседних аудиоокна содержат общую область речи, поэтому часть слов распознана дважды. Как корректнее сформировать итоговую транскрипцию?
  explanation: 'Единая граница стыка не позволяет общей речи попасть в результат дважды. Её выгодно располагать ближе к внутренним областям окон: у обрезанных краёв модели доступно меньше акустического контекста, поэтому распознавание там менее надёжно.'
  kind: choice
  options:
    - Последовательно добавить все слова обоих окон
    - Выбрать границу внутри перекрытия, оставить слова левого окна до неё, а правого — после неё
    - Удалить из обоих окон все слова, попавшие в перекрытие
    - Оставить только транскрипцию того окна, которое начинается раньше
  correct: 1
