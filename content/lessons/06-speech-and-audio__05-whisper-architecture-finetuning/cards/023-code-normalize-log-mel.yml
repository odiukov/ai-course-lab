- concept: единый максимум по всему клипу сохраняет относительную громкость кадров при ограничении динамического диапазона
  question: Почему при ограничении динамического диапазона log-mel признаков максимум следует вычислять по всему клипу, а не отдельно для каждого временного кадра?
  explanation: Покадровая нормализация уничтожает относительную шкалу громкости во времени. Общий максимум оставляет тихие участки тихими относительно самых громких участков клипа.
  kind: open
  reference: Единый максимум сохраняет различия громкости между кадрами. При отдельном максимуме каждый кадр получает собственный порог, поэтому тихие паузы и слабый шум искусственно растягиваются и могут стать похожими на полноценный речевой сигнал.
  id: 023-code-normalize-log-mel-2
