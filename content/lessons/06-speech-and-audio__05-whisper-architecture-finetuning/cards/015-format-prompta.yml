- concept: управляющие токены Whisper располагаются перед текстом в порядке начала, языка, задачи и режима таймстемпов
  question: Составьте промпт декодера для перевода французской речи на английский без пословных таймстемпов.
  explanation: Сначала обозначается начало расшифровки, затем язык аудио, задача декодера и режим таймстемпов. Получается промпт <|startoftranscript|><|fr|><|translate|><|notimestamps|>.
  kind: order
  items:
    - <|startoftranscript|>
    - <|fr|>
    - <|translate|>
    - <|notimestamps|>
  id: 015-format-prompta-1
  fingerprint: f2c21ee1
- concept: токены transcribe и translate задают разные задачи декодирования
  question: В аудио говорят по-испански, и нужен дословный текст на испанском. Какой токен задачи следует передать декодеру Whisper?
  explanation: <|transcribe|> сохраняет язык говорящего и создаёт расшифровку на нём. <|translate|> потребовал бы перевести речь на английский, а <|notimestamps|> управляет таймстемпами, а не языком результата.
  kind: choice
  options:
    - <|transcribe|>
    - <|translate|>
    - <|notimestamps|>
  correct: 0
  id: 015-format-prompta-2
  fingerprint: d7c2686d
- concept: известный язык аудио следует задавать явно, чтобы ошибка автоопределения не направила декодирование на другой язык
  question: Язык шумной записи заранее известен. Почему при распознавании Whisper полезно явно указать соответствующий языковой токен вместо автоопределения?
  explanation: Языковой токен не просто описывает результат постфактум, а направляет декодирование. Если автоопределение ошибочно поставит, например, <|de|> для английской речи, декодер будет генерировать текст в соответствии с неверной инструкцией.
  kind: open
  reference: Автоопределение на шумном аудио может выбрать неверный языковой тег. Этот тег становится инструкцией для декодера, поэтому модель может выдать связный текст не на том языке. Явное указание известного языка устраняет эту ошибку выбора задачи.
  id: 015-format-prompta-3
  fingerprint: c2864d11
