- concept: конец каждого окна ограничивается фактической длительностью аудио
  question: Заполни выражение так, чтобы последнее окно не выходило за границу аудиофайла.
  explanation: 'Обычное окно заканчивается в start + window, но для последнего короткого фрагмента эта точка может лежать за концом файла. min ограничивает end фактической длительностью: у записи на 62 секунды последнее окно закончится на 62, а не на 90.'
  kind: cloze
  template: end = ___
  answer: min(start + window, duration)
  accept:
