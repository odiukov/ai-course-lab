- concept: при отсутствии паузы ограничение максимальной длины требует принудительного разреза
  question: VAD обнаружил непрерывный участок речи, который длиннее допустимого входа Whisper, и подходящей паузы внутри нет. Как должен поступить сегментатор?
  explanation: Пауза задаёт предпочтительное, но не всегда доступное место разреза. Жёсткий предел входа Whisper сохраняется, поэтому длинный непрерывный участок приходится делить принудительно, принимая риск ошибки на границе.
  kind: choice
  options:
    - Передать весь участок целиком, поскольку VAD подтвердил наличие речи
    - Принудительно разрезать участок до превышения максимальной длины
    - Удалить участок как непригодный для распознавания
    - Заменить участок тишиной и передать его модели
