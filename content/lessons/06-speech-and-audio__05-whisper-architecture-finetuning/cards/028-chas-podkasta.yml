- concept: при независимой обработке сегмента Whisper не имеет акустического контекста соседних сегментов
  question: Длинную запись разделили на сегменты и распознают каждый независимо, не передавая предыдущий текст. Может ли декодер восстановить неоднозначное начало текущего сегмента по звуку из предыдущего?
  explanation: У каждого запуска собственный акустический вход и собственный выход энкодера. Cross-attention декодера обращается только к нему, поэтому без явно переданного контекста модель не знает, что звучало в соседнем окне.
  kind: choice
  options:
    - Нет, энкодер текущего запуска содержит признаки только текущего сегмента
    - Да, энкодер автоматически хранит признаки всех уже обработанных сегментов
    - Да, позиционные эмбеддинги позволяют обратиться к предыдущему звуку
    - Да, cross-attention повторно загружает соседний сегмент
  correct: 0
  id: 028-chas-podkasta-1
  fingerprint: 52ce462f
- concept: разрез внутри слова может вызвать ошибки по обе стороны границы сегментов
  question: Объясните, почему разбиение аудио посреди слова способно испортить распознавание сразу в двух соседних сегментах.
  explanation: При жёсткой нарезке часовой записи на 120 окон граница может пройти внутри слова. Тогда ни одно из двух окон не содержит слово целиком, а памяти о соседнем аудио у независимых запусков нет.
  kind: open
  reference: Первый сегмент заканчивается неполным словом, а второй начинается с фрагмента без начала. Каждый фрагмент распознаётся без недостающей части, поэтому модель может независимо превратить обе половины в ошибочные слова или пропустить их.
  id: 028-chas-podkasta-2
  fingerprint: be71bb08
- concept: VAD позволяет выбирать границы сегментов в паузах и снижать риск разрезания слов
  question: Расположите этапы подготовки длинной записи к независимому распознаванию так, чтобы реже разрезать слова.
  explanation: Whisper принимает окна длительностью до 30 секунд, но границы необязательно ставить через строго равные интервалы. VAD сначала находит паузы, после чего нарезка по этим паузам уменьшает вероятность разделить слово между окнами.
  kind: order
  items:
    - Найти речевые интервалы и паузы с помощью VAD
    - Выбрать границы сегментов преимущественно внутри найденных пауз
    - Сформировать сегменты, не превышающие максимальное окно модели
    - Распознать полученные сегменты и объединить результаты
  id: 028-chas-podkasta-3
  fingerprint: 8a682176
