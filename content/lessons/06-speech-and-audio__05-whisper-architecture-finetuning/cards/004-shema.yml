- concept: энкодер Whisper выдаёт контекстные акустические векторы, а не буквы или готовый текст
  question: Почему выход энкодера Whisper нельзя непосредственно считать расшифровкой аудио?
  explanation: Граница между энкодером и декодером разделяет акустическое представление и текстовую генерацию. Энкодер описывает услышанное скрытыми векторами; соответствующие текстовые токены выбирает только декодер.
  kind: open
  reference: Энкодер преобразует спектральные признаки в последовательность контекстных векторов, кодирующих акустическую информацию. Эти векторы не являются текстовыми символами или BPE-токенами. Расшифровку формирует декодер, который обращается к ним через cross-attention и последовательно выбирает токены из словаря.
  id: 004-shema-3
  fingerprint: 29796b65
