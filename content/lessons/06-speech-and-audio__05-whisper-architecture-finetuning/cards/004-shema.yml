- concept: Whisper последовательно преобразует звук в спектральные признаки, скрытые представления и текстовые токены
  question: Расположите этапы обработки аудио в Whisper в правильном порядке.
  explanation: Whisper не передаёт сырую волну прямо в трансформер. Сначала вычисляется log-mel спектрограмма, затем свёртки сокращают её временную длину, энкодер строит акустические представления, а декодер по одному выпускает BPE-токены.
  kind: order
  items:
    - Преобразовать звуковую волну в log-mel спектрограмму
    - Проредить временную ось спектрограммы свёрточными слоями
    - Построить контекстные векторы энкодером
    - Сгенерировать BPE-токены декодером
    - Собрать токены в текст
  id: 004-shema-1
  fingerprint: fd010429
- concept: декодер Whisper сочетает причинный self-attention с cross-attention к выходу энкодера
  question: Как декодер Whisper выбирает очередной текстовый токен?
  explanation: Причинный self-attention разрешает декодеру видеть только ранее сгенерированные токены, а cross-attention даёт доступ ко всему выходу энкодера. Поэтому текст создаётся авторегрессивно, но каждый новый токен опирается и на языковой контекст, и на аудио.
  kind: choice
  options:
    - Учитывает уже выпущенные токены и обращается через cross-attention к представлениям аудио из энкодера
    - Просматривает будущие токены ответа и напрямую считывает отсчёты звуковой волны
    - Преобразует каждый кадр спектрограммы в отдельную букву без учёта контекста
    - Копирует ближайший акустический вектор энкодера в словарь без авторегрессии
  correct: 0
