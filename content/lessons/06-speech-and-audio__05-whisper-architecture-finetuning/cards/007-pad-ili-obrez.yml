- concept: обрезка слишком длинного входа может молча удалить конец записи
  question: Whisper вернул связную расшифровку, но в ней отсутствует конец длинной записи. Объясни, как жёсткое входное окно могло привести к такому результату.
  explanation: Whisper обрабатывает 30-секундные окна. Всё за границей подготовленного окна может быть отброшено ещё до запуска модели, поэтому корректный и гладкий результат не исключает потери концовки.
  kind: open
  reference: Если запись подали одним клипом и предобработка обрезала её до предельной длины окна, аудио за границей окна вообще не попало в энкодер. Формы входа при этом остаются корректными, поэтому модель может завершить работу без ошибки и вернуть текст только для сохранённой части. Длинную запись следует заранее разбить на окна, желательно по паузам.
