- concept: недетерминизм возникает только в сегментах, дошедших до стохастического отката
  question: При повторных запусках Whisper большая часть сегментов совпадает, но отдельный сегмент получает разные расшифровки. Какое объяснение наиболее вероятно?
  explanation: Сегменты, принятые после жадного декодирования, остаются одинаковыми. Случайность появляется там, где результат отклонён и Whisper повторяет декодирование при ненулевой температуре.
  kind: choice
  options:
    - Этот сегмент не прошёл эвристическую проверку после жадного декодирования и был пересэмплирован
    - Whisper случайно меняет текст каждого сегмента независимо от выбранной температуры
    - Эвристическая проверка напрямую заменяет слова в готовой расшифровке
    - Все сегменты пересэмплируются, но совпадения в остальных сегментах всегда гарантированы
