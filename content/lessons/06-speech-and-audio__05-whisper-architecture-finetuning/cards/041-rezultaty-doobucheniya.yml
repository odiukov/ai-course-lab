- concept: эффективность доменного дообучения можно оценить снижением WER в процентных пунктах на час данных
  question: После дообучения WER снизился с 27% до 11% на 16 часах аудио. Сколько процентных пунктов WER удалось устранить в среднем на один час данных?
  explanation: Абсолютное снижение равно 27 − 11 = 16 процентным пунктам. Делим его на 16 часов и получаем 1 пункт на час. Аналогично в уроке медицинская адаптация дала 7.5 пункта за 20 часов, а исландская — 12 пунктов за 4 часа.
  kind: numeric
  answer: 1
  tolerance: 0.01
  id: 041-rezultaty-doobucheniya-1
  fingerprint: c0ce61a3
- concept: представленность целевого языка или домена в предобучении влияет на ожидаемую отдачу от каждого часа адаптационных данных
  question: Для какого целевого набора при прочих равных наиболее вероятно большое снижение WER на каждый час качественных данных для дообучения Whisper?
  explanation: 'Новые данные обычно дают больший предельный выигрыш там, где исходной модели сильнее не хватало примеров. Поэтому 4 часа исландского снизили WER с 18% до 6%, тогда как 20 часов медицинской диктовки снизили его с 12% до 4.5%: английская речь уже была хорошо представлена, а исландская — значительно хуже.'
  kind: choice
  options:
    - Для языка, который был крайне слабо представлен при исходном предобучении
    - Для распространённого языка и тематики, уже хорошо покрытых предобучением
    - Для домена, почти полностью совпадающего с исходными обучающими данными
    - Представленность в предобучении не влияет на отдачу от новых данных
