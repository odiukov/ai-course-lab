- concept: число токенов равномерной временной сетки включает обе её границы
  question: Система размечает окно длительностью 24 секунды специальными токенами с шагом 0.03 секунды, включая начальную и конечную метки. Сколько токенов времени требуется?
  explanation: Количество интервалов равно длительности, делённой на шаг. К нему добавляется начальная метка. По этому же принципу в Whisper диапазон от 0.00 до 30.00 секунды с шагом 0.02 содержит 1501 токен.
  kind: numeric
  answer: 801
  tolerance: 0.01
