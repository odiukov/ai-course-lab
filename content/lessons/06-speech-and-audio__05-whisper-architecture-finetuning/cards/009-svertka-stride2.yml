- concept: stride задаёт шаг смещения свёрточного окна вдоль временной оси
  question: Что означает параметр stride у свёртки, обрабатывающей последовательность акустических кадров?
  explanation: 'Stride определяет, на сколько входных позиций сдвигается окно перед вычислением следующего выхода. В Whisper stride 2 прореживает последовательность: 3000 входных кадров превращаются в 1500 позиций энкодера.'
  kind: choice
  options:
    - Ширину свёрточного окна
    - Расстояние между соседними положениями свёрточного окна
    - Число голов attention
    - Размер скрытого представления
  correct: 1
  id: 009-svertka-stride2-1
  fingerprint: 5f8b1387
- concept: вычислительная стоимость полного self-attention квадратично зависит от длины последовательности
  question: После свёрточного прореживания последовательность стала короче в 6 раз. Во сколько раз уменьшилось число пар позиций, сравниваемых полным self-attention?
  explanation: Полный self-attention рассматривает число пар, пропорциональное квадрату длины последовательности. Поэтому сокращение длины в 6 раз уменьшает число пар в 6² = 36 раз. Аналогично в Whisper переход от 3000 к 1500 позициям уменьшает их число вдвое, а число пар — вчетверо.
  kind: numeric
  answer: 36
  tolerance: 0.01
  id: 009-svertka-stride2-2
  fingerprint: 64aa7287
