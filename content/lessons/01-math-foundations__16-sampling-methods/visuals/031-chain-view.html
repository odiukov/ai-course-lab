<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Цепь исследует двумодальное распределение</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --ink: #172033;
      --muted: #667085;
      --axis: #475467;
      --grid: #cbd5e1;
      --mode-band: #e8efff;
      --density: #dce7ff;
      --density-line: #315bb5;
      --trace: #1f62c4;
      --trace-point: #174d9d;
      --transition: #c23b32;
      --guide: #7c879b;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827;
        --ink: #f3f4f6;
        --muted: #aab4c5;
        --axis: #c2cad6;
        --grid: #384458;
        --mode-band: #182d4f;
        --density: #203b68;
        --density-line: #8ab4ff;
        --trace: #79aaff;
        --trace-point: #b5d0ff;
        --transition: #ff8a7e;
        --guide: #8491a6;
      }
    }

    html,
    body {
      background: var(--bg);
      color: var(--ink);
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    figure {
      background: var(--bg);
      padding: 10px 12px;
    }

    h2 {
      font-size: 20px;
      margin: 0 0 6px;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 470px;
      background: var(--bg);
    }

    .mode-band {
      fill: var(--mode-band);
    }

    .grid {
      fill: none;
      stroke: var(--grid);
      stroke-width: 1.5px;
    }

    .axis {
      fill: none;
      stroke: var(--axis);
      stroke-width: 2px;
    }

    .density-fill {
      fill: var(--density);
      stroke: none;
    }

    .density-line {
      fill: none;
      stroke: var(--density-line);
      stroke-width: 3px;
    }

    .trace {
      fill: none;
      stroke: var(--trace);
      stroke-width: 2.5px;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .transition {
      fill: none;
      stroke: var(--transition);
      stroke-width: 4px;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .trace-point {
      fill: var(--trace-point);
    }

    .transition-point {
      fill: var(--transition);
    }

    .guide {
      fill: none;
      stroke: var(--guide);
      stroke-width: 1.5px;
    }

    text {
      fill: var(--ink);
      font-size: 15px;
    }

    .tick-label,
    .axis-label {
      fill: var(--muted);
      font-size: 14px;
    }

    .annotation {
      font-size: 15px;
      font-weight: bold;
      paint-order: stroke;
      stroke: var(--bg);
      stroke-width: 5px;
      stroke-linejoin: round;
    }

    .transition-label {
      fill: var(--transition);
    }

    .density-label {
      fill: var(--density-line);
      font-size: 15px;
      font-weight: bold;
    }

    #fallback {
      font-size: 16px;
      padding: 18px;
      text-align: center;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-heading">
    <h2 id="diagram-heading">Цепь исследует двумодальное распределение</h2>
    <svg id="diagram" viewBox="0 0 1000 450" width="1000" height="450"
         preserveAspectRatio="xMidYMid meet" role="img"
         aria-label="Траектория цепи из 200 шагов: долгое исследование пика около минус трёх, редкий переход и исследование пика около трёх">
      <title>Траектория цепи в двумодальном распределении</title>
      <desc>Два длинных участка траектории расположены около значений минус три и три. Между ними показан редкий переход.</desc>
    </svg>
    <p id="fallback" hidden>
      Схема должна была показать двумодальную плотность с пиками около −3 и 3 и траекторию цепи из 200 шагов: долгое исследование одного пика, редкий переход и исследование второго.
    </p>
  </figure>

  <script>
    const data = {
      zero: 0,
      modes: [-3, 3],
      steps: {
        first: 1,
        total: 200,
        increment: 1
      },
      transition: {
        start: 128,
        end: 137,
        holdEvery: 4,
        wiggle: 0.14
      },
      chain: {
        amplitude: 0.48,
        secondaryAmplitude: 0.22,
        slowRate: 0.19,
        fastRate: 0.73,
        repeatEvery: 7
      },
      density: {
        yMin: -4.45,
        yMax: 4.45,
        samples: 180,
        sigma: 0.72,
        weight: 0.5,
        exponentFactor: -0.5,
        baseline: 215,
        width: 43
      },
      plot: {
        xMin: 0,
        xMax: 200,
        yMin: -4.35,
        yMax: 4.35,
        bandHalf: 0.58,
        densityTitleX: 237,
        densityTitleY: 4.18,
        stepTitleX: 100,
        stepTitleY: -4.18,
        valueTitleX: -12,
        valueTitleY: 0
      },
      tick: {
        xHalf: 0.9,
        yHalf: 0.13,
        labelGapX: 2.2,
        labelGapY: 0.34
      },
      point: {
        radiusX: 0.62,
        radiusY: 0.045
      },
      annotations: {
        leftText: [25, -1.72],
        leftLineStart: [44, -1.88],
        leftLineEnd: [58, -2.65],
        transitionText: [112, 1.28],
        transitionLineStart: [117, 1.08],
        transitionLineEnd: [132, 0.12],
        rightText: [158, 1.72],
        rightLineStart: [166, 1.9],
        rightLineEnd: [171, 2.64]
      },
      angles: {
        vertical: -90
      },
      indices: {
        last: -1
      }
    };

    const origin = { x: 90, y: 225 };
    const scale = { x: 3.4, y: 45 };

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y - y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const NS = "http://www.w3.org/2000/svg";
      const [leftMode, rightMode] = data.modes;

      const make = (name, className) => {
        const element = document.createElementNS(NS, name);
        if (className) element.setAttribute("class", className);
        return element;
      };

      const addText = (content, x, y, className, anchor) => {
        const text = make("text", className);
        text.setAttribute("x", String(x));
        text.setAttribute("y", String(y));
        text.setAttribute("text-anchor", anchor);
        text.textContent = content;
        svg.append(text);
        return text;
      };

      for (const mode of data.modes) {
        const band = make("rect", "mode-band");
        band.setAttribute("x", String(sx(data.plot.xMin)));
        band.setAttribute("y", String(sy(mode + data.plot.bandHalf)));
        band.setAttribute(
          "width",
          String(sx(data.plot.xMax) - sx(data.plot.xMin))
        );
        band.setAttribute(
          "height",
          String(sy(mode - data.plot.bandHalf) - sy(mode + data.plot.bandHalf))
        );
        svg.append(band);
      }

      for (const mode of data.modes) {
        const grid = make("line", "grid");
        grid.setAttribute("x1", String(sx(data.plot.xMin)));
        grid.setAttribute("y1", String(sy(mode)));
        grid.setAttribute("x2", String(sx(data.plot.xMax)));
        grid.setAttribute("y2", String(sy(mode)));
        svg.append(grid);
      }

      const horizontalAxis = make("line", "axis");
      horizontalAxis.setAttribute("x1", String(sx(data.plot.xMin)));
      horizontalAxis.setAttribute("y1", String(sy(data.zero)));
      horizontalAxis.setAttribute("x2", String(sx(data.plot.xMax)));
      horizontalAxis.setAttribute("y2", String(sy(data.zero)));
      svg.append(horizontalAxis);

      const verticalAxis = make("line", "axis");
      verticalAxis.setAttribute("x1", String(sx(data.zero)));
      verticalAxis.setAttribute("y1", String(sy(data.plot.yMin)));
      verticalAxis.setAttribute("x2", String(sx(data.zero)));
      verticalAxis.setAttribute("y2", String(sy(data.plot.yMax)));
      svg.append(verticalAxis);

      for (const mode of data.modes) {
        const tick = make("line", "axis");
        tick.setAttribute("x1", String(sx(-data.tick.xHalf)));
        tick.setAttribute("y1", String(sy(mode)));
        tick.setAttribute("x2", String(sx(data.tick.xHalf)));
        tick.setAttribute("y2", String(sy(mode)));
        svg.append(tick);

        addText(
          String(mode).replace("-", "−"),
          sx(-data.tick.labelGapX),
          sy(mode - data.point.radiusY),
          "tick-label",
          "end"
        );
      }

      for (const step of [data.steps.first, data.steps.total]) {
        const tick = make("line", "axis");
        tick.setAttribute("x1", String(sx(step)));
        tick.setAttribute("y1", String(sy(-data.tick.yHalf)));
        tick.setAttribute("x2", String(sx(step)));
        tick.setAttribute("y2", String(sy(data.tick.yHalf)));
        svg.append(tick);

        addText(
          String(step),
          sx(step),
          sy(-data.tick.labelGapY),
          "tick-label",
          step === data.steps.first ? "start" : "end"
        );
      }

      addText(
        "номер шага",
        sx(data.plot.stepTitleX),
        sy(data.plot.stepTitleY),
        "axis-label",
        "middle"
      );

      const valueTitle = addText(
        "текущее значение x",
        sx(data.plot.valueTitleX),
        sy(data.plot.valueTitleY),
        "axis-label",
        "middle"
      );
      valueTitle.setAttribute(
        "transform",
        "rotate(" + data.angles.vertical + " " +
        sx(data.plot.valueTitleX) + " " + sy(data.plot.valueTitleY) + ")"
      );

      const gaussian = (value, mean) => {
        const distance = (value - mean) / data.density.sigma;
        return Math.exp(data.density.exponentFactor * distance * distance);
      };

      const densityPoints = [];
      let maximumDensity = data.zero;

      for (
        let index = data.zero;
        index < data.density.samples;
        index += data.steps.increment
      ) {
        const fraction =
          index / (data.density.samples - data.steps.increment);
        const value =
          data.density.yMin +
          (data.density.yMax - data.density.yMin) * fraction;
        const density =
          data.density.weight * gaussian(value, leftMode) +
          data.density.weight * gaussian(value, rightMode);

        maximumDensity = Math.max(maximumDensity, density);
        densityPoints.push({ value, density });
      }

      const densityCoordinates = densityPoints.map(point => ({
        x: data.density.baseline +
          data.density.width * point.density / maximumDensity,
        y: point.value
      }));

      const densityFill = make("path", "density-fill");
      const densityFillPath = [
        "M", sx(data.density.baseline), sy(data.density.yMin),
        ...densityCoordinates.flatMap(point => [
          "L", sx(point.x), sy(point.y)
        ]),
        "L", sx(data.density.baseline), sy(data.density.yMax),
        "Z"
      ].join(" ");
      densityFill.setAttribute("d", densityFillPath);
      svg.append(densityFill);

      const densityLine = make("path", "density-line");
      densityLine.setAttribute(
        "d",
        densityCoordinates.map((point, index) =>
          (index === data.zero ? "M " : "L ") +
          sx(point.x) + " " + sy(point.y)
        ).join(" ")
      );
      svg.append(densityLine);

      const densityAxis = make("line", "axis");
      densityAxis.setAttribute("x1", String(sx(data.density.baseline)));
      densityAxis.setAttribute("y1", String(sy(data.density.yMin)));
      densityAxis.setAttribute("x2", String(sx(data.density.baseline)));
      densityAxis.setAttribute("y2", String(sy(data.density.yMax)));
      svg.append(densityAxis);

      addText(
        "двумодальная плотность",
        sx(data.plot.densityTitleX),
        sy(data.plot.densityTitleY),
        "density-label",
        "middle"
      );

      const trajectory = [];

      for (
        let step = data.steps.first;
        step <= data.steps.total;
        step += data.steps.increment
      ) {
        let value;

        if (step < data.transition.start) {
          value =
            leftMode +
            data.chain.amplitude * Math.sin(step * data.chain.slowRate) +
            data.chain.secondaryAmplitude *
              Math.sin(step * data.chain.fastRate);

          if (
            step % data.chain.repeatEvery === data.zero &&
            trajectory.length
          ) {
            value = trajectory.at(data.indices.last).value;
          }
        } else if (step <= data.transition.end) {
          const progress =
            (step - data.transition.start) /
            (data.transition.end - data.transition.start);
          value =
            leftMode +
            (rightMode - leftMode) * progress +
            data.transition.wiggle *
              Math.sin(step * data.chain.fastRate);

          if (
            step !== data.transition.start &&
            step % data.transition.holdEvery === data.zero
          ) {
            value = trajectory.at(data.indices.last).value;
          }
        } else {
          value =
            rightMode +
            data.chain.amplitude * Math.sin(step * data.chain.slowRate) +
            data.chain.secondaryAmplitude *
              Math.sin(step * data.chain.fastRate);

          if (
            step % data.chain.repeatEvery === data.zero &&
            trajectory.length
          ) {
            value = trajectory.at(data.indices.last).value;
          }
        }

        trajectory.push({ step, value });
      }

      const trace = make("path", "trace");
      trace.setAttribute(
        "d",
        trajectory.map((point, index) =>
          (index === data.zero ? "M " : "L ") +
          sx(point.step) + " " + sy(point.value)
        ).join(" ")
      );
      svg.append(trace);

      const transitionPoints = trajectory.filter(point =>
        point.step >= data.transition.start &&
        point.step <= data.transition.end
      );

      const transitionPath = make("path", "transition");
      transitionPath.setAttribute(
        "d",
        transitionPoints.map((point, index) =>
          (index === data.zero ? "M " : "L ") +
          sx(point.step) + " " + sy(point.value)
        ).join(" ")
      );
      svg.append(transitionPath);

      for (const point of trajectory) {
        const marker = make(
          "ellipse",
          point.step >= data.transition.start &&
          point.step <= data.transition.end
            ? "transition-point"
            : "trace-point"
        );
        marker.setAttribute("cx", String(sx(point.step)));
        marker.setAttribute("cy", String(sy(point.value)));
        marker.setAttribute(
          "rx",
          String(Math.abs(sx(data.point.radiusX) - sx(data.zero)))
        );
        marker.setAttribute(
          "ry",
          String(Math.abs(sy(data.point.radiusY) - sy(data.zero)))
        );
        svg.append(marker);
      }

      const guides = [
        [
          data.annotations.leftLineStart,
          data.annotations.leftLineEnd
        ],
        [
          data.annotations.transitionLineStart,
          data.annotations.transitionLineEnd
        ],
        [
          data.annotations.rightLineStart,
          data.annotations.rightLineEnd
        ]
      ];

      for (const [start, end] of guides) {
        const guide = make("line", "guide");
        const [startX, startY] = start;
        const [endX, endY] = end;
        guide.setAttribute("x1", String(sx(startX)));
        guide.setAttribute("y1", String(sy(startY)));
        guide.setAttribute("x2", String(sx(endX)));
        guide.setAttribute("y2", String(sy(endY)));
        svg.append(guide);
      }

      const [leftTextX, leftTextY] = data.annotations.leftText;
      addText(
        "долго исследует первый пик",
        sx(leftTextX),
        sy(leftTextY),
        "annotation",
        "start"
      );

      const [transitionTextX, transitionTextY] =
        data.annotations.transitionText;
      addText(
        "редкий переход",
        sx(transitionTextX),
        sy(transitionTextY),
        "annotation transition-label",
        "middle"
      );

      const [rightTextX, rightTextY] = data.annotations.rightText;
      addText(
        "исследует второй пик",
        sx(rightTextX),
        sy(rightTextY),
        "annotation",
        "start"
      );

      fallback.hidden = true;
    } catch (error) {
      document.getElementById("diagram").hidden = true;
      document.getElementById("fallback").hidden = false;
    }
  </script>
</body>
</html>
