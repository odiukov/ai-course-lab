<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Как число U превращается в выбор из диапазона</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f9fc;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #58657a;
      --line: #8b98ab;
      --source: #3867d6;
      --source-soft: #dbe7ff;
      --target: #138a72;
      --target-soft: #d7f3eb;
      --guide: #c2cad6;
      --formula-bg: #eef3f8;
      --formula-line: #cdd6e2;
      --error: #9b2c2c;
      --error-bg: #fff0f0;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #10141d;
        --panel: #171d28;
        --ink: #eef3fb;
        --muted: #aeb9ca;
        --line: #748096;
        --source: #83a8ff;
        --source-soft: #25385f;
        --target: #62d5b8;
        --target-soft: #1d4d43;
        --guide: #465267;
        --formula-bg: #202938;
        --formula-line: #3b475a;
        --error: #ffb4b4;
        --error-bg: #3b2024;
      }
    }

    html,
    body {
      margin: unset;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .diagram {
      box-sizing: border-box;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--formula-line);
    }

    .diagram__heading {
      margin: unset;
      padding: 16px 22px;
      color: var(--ink);
      background: var(--panel);
      border-bottom: 1px solid var(--formula-line);
      font-size: 21px;
      line-height: normal;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 460px;
      background: var(--panel);
      shape-rendering: geometricPrecision;
    }

    .track {
      fill: none;
      stroke: var(--line);
      stroke-width: 4px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .progress-source {
      fill: none;
      stroke: var(--source);
      stroke-width: 7px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .progress-target {
      fill: none;
      stroke: var(--target);
      stroke-width: 7px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .tick {
      stroke: var(--line);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .guide {
      stroke: var(--guide);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .source-dot {
      fill: var(--source);
      stroke: var(--panel);
      stroke-width: 3px;
      vector-effect: non-scaling-stroke;
    }

    .target-dot {
      fill: var(--target);
      stroke: var(--panel);
      stroke-width: 3px;
      vector-effect: non-scaling-stroke;
    }

    .closed-end {
      fill: var(--ink);
      stroke: var(--ink);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .open-end {
      fill: var(--panel);
      stroke: var(--ink);
      stroke-width: 3px;
      vector-effect: non-scaling-stroke;
    }

    .map-arrow {
      fill: none;
      stroke: var(--ink);
      stroke-width: 3px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .map-arrow-head {
      fill: var(--ink);
    }

    .formula-box {
      fill: var(--formula-bg);
      stroke: var(--formula-line);
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
    }

    .section-label {
      fill: var(--muted);
      font-size: 17px;
      font-weight: bold;
    }

    .interval-label {
      fill: var(--muted);
      font-size: 18px;
    }

    .value-label {
      fill: var(--ink);
      font-size: 18px;
    }

    .source-label {
      fill: var(--source);
      font-size: 20px;
      font-weight: bold;
    }

    .target-label {
      fill: var(--target);
      font-size: 20px;
      font-weight: bold;
    }

    .arrow-label {
      fill: var(--muted);
      font-size: 16px;
    }

    .formula-caption {
      fill: var(--muted);
      font-size: 16px;
      font-weight: bold;
    }

    .formula {
      fill: var(--ink);
      font-size: 22px;
      font-weight: bold;
    }

    .fallback {
      box-sizing: border-box;
      padding: 24px;
      color: var(--error);
      background: var(--error-bg);
      font-size: 18px;
    }

    .fallback[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <main class="diagram">
    <h1 class="diagram__heading">Как число U превращается в выбор из диапазона</h1>

    <svg
      id="scheme"
      viewBox="0 0 1000 410"
      width="1000"
      height="410"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="scheme-title scheme-description"
    >
      <title id="scheme-title">Преобразование U = 0.65 в значение 16.5</title>
      <desc id="scheme-description">
        На отрезке от 0 до 1 число U равно 0.65. То же относительное положение
        на диапазоне от 10 до 20 соответствует значению 16.5.
      </desc>
    </svg>

    <p id="fallback" class="fallback" hidden>
      Схема должна была показать: U = 0.65 на отрезке [0, 1) преобразуется
      по формуле 10 + (20 − 10) × 0.65 и даёт 16.5.
    </p>
  </main>

  <script>
    (() => {
      const svg = document.getElementById("scheme");
      const fallback = document.getElementById("fallback");

      try {
        const data = [
          {
            u: 0.65,
            sourceMin: 0,
            sourceMax: 1,
            targetMin: 10,
            targetMax: 20
          },
          {
            zero: 0,
            origin: { x: 0, y: 0 },
            scale: { x: 10, y: 10 },
            radius: 0.72,
            source: {
              start: { x: 14, y: 12 },
              end: { x: 86, y: 12 },
              tickTop: 11.1,
              tickBottom: 12.9
            },
            target: {
              start: { x: 14, y: 28 },
              end: { x: 86, y: 28 },
              tickTop: 27.1,
              tickBottom: 28.9
            },
            labels: {
              sourceTitle: { x: 14, y: 4.4 },
              sourceInterval: { x: 86, y: 4.4 },
              sourceValue: { y: 8.9 },
              sourceLeft: { x: 14, y: 15.7 },
              sourceRight: { x: 86, y: 15.7 },
              arrow: { xOffset: 2.2, y: 20.7 },
              targetTitle: { x: 14, y: 22.6 },
              targetInterval: { x: 86, y: 22.6 },
              targetValue: { y: 25.3 },
              targetLeft: { x: 14, y: 31.7 },
              targetRight: { x: 86, y: 31.7 }
            },
            arrow: {
              tailY: 13.2,
              tipY: 26.4,
              headY: 24.9,
              halfWidth: 0.9
            },
            formulaBox: {
              left: 14,
              right: 86,
              top: 34.1,
              bottom: 39.5
            },
            formulaCaption: { x: 16, y: 36.2 },
            formula: { x: 84, y: 37.8 },
            digits: {
              source: 2,
              target: 1
            }
          }
        ];

        const [values, layout] = data;
        const origin = layout.origin;
        const scale = layout.scale;

        const sx = x => origin.x + x * scale.x;
        const sy = y => origin.y + y * scale.y;

        const namespace = "http://www.w3.org/2000/svg";
        const ratio =
          (values.u - values.sourceMin) /
          (values.sourceMax - values.sourceMin);
        const result =
          values.targetMin +
          (values.targetMax - values.targetMin) * values.u;
        const sourceX =
          layout.source.start.x +
          (layout.source.end.x - layout.source.start.x) * ratio;
        const targetX =
          layout.target.start.x +
          (layout.target.end.x - layout.target.start.x) * ratio;
        const radius = sx(layout.radius) - sx(layout.zero);

        const create = (name, attributes, content) => {
          const node = document.createElementNS(namespace, name);

          Object.entries(attributes).forEach(([key, value]) => {
            node.setAttribute(key, String(value));
          });

          if (content !== undefined) {
            node.textContent = content;
          }

          return node;
        };

        const add = node => {
          svg.appendChild(node);
          return node;
        };

        const line = (x1, y1, x2, y2, className) =>
          add(
            create("line", {
              x1: sx(x1),
              y1: sy(y1),
              x2: sx(x2),
              y2: sy(y2),
              class: className
            })
          );

        const circle = (x, y, className) =>
          add(
            create("circle", {
              cx: sx(x),
              cy: sy(y),
              r: radius,
              class: className
            })
          );

        const text = (position, content, className, anchor) =>
          add(
            create(
              "text",
              {
                x: sx(position.x),
                y: sy(position.y),
                class: className,
                "text-anchor": anchor,
                "dominant-baseline": "middle"
              },
              content
            )
          );

        text(
          layout.labels.sourceTitle,
          "Нормированная шкала",
          "section-label",
          "start"
        );
        text(
          layout.labels.sourceInterval,
          "[0, 1)",
          "interval-label",
          "end"
        );

        line(
          layout.source.start.x,
          layout.source.start.y,
          layout.source.end.x,
          layout.source.end.y,
          "track"
        );
        line(
          layout.source.start.x,
          layout.source.start.y,
          sourceX,
          layout.source.start.y,
          "progress-source"
        );

        line(
          layout.source.start.x,
          layout.source.tickTop,
          layout.source.start.x,
          layout.source.tickBottom,
          "tick"
        );
        line(
          layout.source.end.x,
          layout.source.tickTop,
          layout.source.end.x,
          layout.source.tickBottom,
          "tick"
        );

        circle(
          layout.source.start.x,
          layout.source.start.y,
          "closed-end"
        );
        circle(
          layout.source.end.x,
          layout.source.end.y,
          "open-end"
        );
        circle(sourceX, layout.source.start.y, "source-dot");

        text(
          { x: sourceX, y: layout.labels.sourceValue.y },
          `U = ${values.u.toFixed(layout.digits.source)}`,
          "source-label",
          "middle"
        );
        text(
          layout.labels.sourceLeft,
          String(values.sourceMin),
          "value-label",
          "middle"
        );
        text(
          layout.labels.sourceRight,
          String(values.sourceMax),
          "value-label",
          "middle"
        );

        line(
          targetX,
          layout.arrow.tailY,
          targetX,
          layout.arrow.tipY,
          "guide"
        );
        line(
          sourceX,
          layout.arrow.tailY,
          targetX,
          layout.arrow.tipY,
          "map-arrow"
        );

        add(
          create("polygon", {
            points: [
              `${sx(targetX)},${sy(layout.arrow.tipY)}`,
              `${sx(targetX - layout.arrow.halfWidth)},${sy(layout.arrow.headY)}`,
              `${sx(targetX + layout.arrow.halfWidth)},${sy(layout.arrow.headY)}`
            ].join(" "),
            class: "map-arrow-head"
          })
        );

        text(
          {
            x: sourceX + layout.labels.arrow.xOffset,
            y: layout.labels.arrow.y
          },
          "растянуть и сдвинуть",
          "arrow-label",
          "start"
        );

        text(
          layout.labels.targetTitle,
          "Диапазон значений",
          "section-label",
          "start"
        );
        text(
          layout.labels.targetInterval,
          "[10, 20]",
          "interval-label",
          "end"
        );

        line(
          layout.target.start.x,
          layout.target.start.y,
          layout.target.end.x,
          layout.target.end.y,
          "track"
        );
        line(
          layout.target.start.x,
          layout.target.start.y,
          targetX,
          layout.target.start.y,
          "progress-target"
        );

        line(
          layout.target.start.x,
          layout.target.tickTop,
          layout.target.start.x,
          layout.target.tickBottom,
          "tick"
        );
        line(
          layout.target.end.x,
          layout.target.tickTop,
          layout.target.end.x,
          layout.target.tickBottom,
          "tick"
        );

        circle(
          layout.target.start.x,
          layout.target.start.y,
          "closed-end"
        );
        circle(
          layout.target.end.x,
          layout.target.end.y,
          "closed-end"
        );
        circle(targetX, layout.target.start.y, "target-dot");

        text(
          { x: targetX, y: layout.labels.targetValue.y },
          result.toFixed(layout.digits.target),
          "target-label",
          "middle"
        );
        text(
          layout.labels.targetLeft,
          String(values.targetMin),
          "value-label",
          "middle"
        );
        text(
          layout.labels.targetRight,
          String(values.targetMax),
          "value-label",
          "middle"
        );

        add(
          create("rect", {
            x: sx(layout.formulaBox.left),
            y: sy(layout.formulaBox.top),
            width:
              sx(layout.formulaBox.right) -
              sx(layout.formulaBox.left),
            height:
              sy(layout.formulaBox.bottom) -
              sy(layout.formulaBox.top),
            class: "formula-box"
          })
        );

        text(
          layout.formulaCaption,
          "Преобразование:",
          "formula-caption",
          "start"
        );
        text(
          layout.formula,
          `${values.targetMin} + (${values.targetMax} − ${values.targetMin}) × ${values.u.toFixed(layout.digits.source)} = ${result.toFixed(layout.digits.target)}`,
          "formula",
          "end"
        );
      } catch (error) {
        svg.replaceChildren();
        svg.setAttribute("aria-hidden", "true");
        fallback.hidden = false;
      }
    })();
  </script>
</body>
</html>
