<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Случайные точки против одной точки в каждом слое</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fc;
      --panel: #ffffff;
      --text: #182033;
      --muted: #5b6478;
      --axis: #727d92;
      --axis-soft: #d9deea;
      --standard: #d84471;
      --standard-soft: #f8dce5;
      --standard-dark: #9f234c;
      --stratified: #087f8c;
      --stratified-soft-a: #d9f0f1;
      --stratified-soft-b: #c7e7e9;
      --stratified-dark: #075d67;
      --annotation: #7567a8;
      --frame: #d7dce7;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #121620;
        --panel: #191f2b;
        --text: #eef2fb;
        --muted: #aeb7ca;
        --axis: #a8b1c4;
        --axis-soft: #394355;
        --standard: #ff719b;
        --standard-soft: #512b3b;
        --standard-dark: #ffb0c6;
        --stratified: #48c9d2;
        --stratified-soft-a: #173f45;
        --stratified-soft-b: #20515a;
        --stratified-dark: #a4f2f5;
        --annotation: #c0b2fa;
        --frame: #3b4558;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      background: var(--panel);
      max-width: 960px;
    }

    header {
      background: var(--panel);
    }

    h1 {
      color: var(--text);
      font-size: 22px;
      line-height: normal;
    }

    header p {
      color: var(--muted);
      font-size: 15px;
      line-height: normal;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 430px;
      box-sizing: border-box;
      overflow: visible;
      background: var(--panel);
      border: 1px solid var(--frame);
    }

    svg text {
      font-family: inherit;
      fill: var(--text);
    }

    .row-title {
      font-size: 18px;
      font-weight: bold;
    }

    .row-count {
      font-size: 16px;
      font-weight: bold;
      fill: var(--muted);
    }

    .axis {
      stroke: var(--axis);
      stroke-width: 3;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .axis-end {
      stroke: var(--axis);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .axis-label {
      font-size: 15px;
      font-weight: bold;
      fill: var(--muted);
    }

    .standard-halo {
      fill: var(--standard-soft);
      stroke: none;
    }

    .standard-point {
      fill: var(--standard);
      stroke: var(--panel);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .standard-point-core {
      fill: var(--standard-dark);
      stroke: none;
    }

    .stratum-a {
      fill: var(--stratified-soft-a);
    }

    .stratum-b {
      fill: var(--stratified-soft-b);
    }

    .stratum-border {
      stroke: var(--axis-soft);
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;
    }

    .stratum-boundary {
      stroke: var(--axis);
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;
    }

    .stratified-halo {
      fill: var(--panel);
      stroke: var(--stratified);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .stratified-point {
      fill: var(--stratified);
      stroke: var(--panel);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .stratified-point-core {
      fill: var(--stratified-dark);
      stroke: none;
    }

    .brace {
      fill: none;
      stroke: var(--annotation);
      stroke-width: 2;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .annotation {
      font-size: 14px;
      font-weight: bold;
      fill: var(--annotation);
    }

    .legend {
      font-size: 14px;
      fill: var(--muted);
    }

    .fallback {
      font-size: 17px;
      fill: var(--text);
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Случайные точки против одной точки в каждом слое</h1>
      <p>Одинаковый размер обеих выборок: N = 10</p>
    </header>

    <svg
      id="diagram"
      viewBox="0 0 960 430"
      width="960"
      height="430"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-title diagram-desc"
    >
      <title id="diagram-title">Сравнение обычной и стратифицированной случайных выборок</title>
      <desc id="diagram-desc">
        Сверху показаны десять независимо выбранных точек с заметными
        скоплениями и пробелами. Снизу отрезок разделён на десять равных
        интервалов, и в каждом находится ровно одна случайная точка.
      </desc>
      <g id="drawing"></g>
    </svg>
  </main>

  <script>
    "use strict";

    const independentSamples = Object.freeze([
      0.035, 0.078, 0.096, 0.286, 0.309,
      0.548, 0.565, 0.592, 0.872, 0.968
    ]);

    const stratifiedSamples = Object.freeze([
      0.031, 0.176, 0.224, 0.382, 0.447,
      0.563, 0.681, 0.728, 0.856, 0.947
    ]);

    const [
      zero, one, two, ten,
      originX, originY, scaleX, scaleY,
      topTitleY, topLineY, topEndLabelY,
      gapStartX, gapEndX, gapBraceY, gapTickY, gapLabelY,
      clusterStartX, clusterEndX, clusterBraceY, clusterTickY, clusterLabelY,
      bottomTitleY, bandTopY, bottomLineY, bandBottomY, bottomEndLabelY,
      legendY, firstLegendX, secondLegendX,
      pointRadius, pointHaloRadius, pointCoreRadius, legendRadius,
      endTickTopDelta, endTickBottomDelta, fallbackY
    ] = Object.freeze([
      0, 1, 2, 10,
      120, 30, 720, 82,
      0.25, 1.22, 1.86,
      0.62, 0.84, 0.84, 0.94, 0.61,
      0.535, 0.605, 1.58, 1.48, 1.88,
      2.38, 2.75, 3.12, 3.49, 3.78,
      4.35, 0.08, 0.56,
      0.011, 0.019, 0.004, 0.008,
      0.08, 0.08, 2.15
    ]);

    const origin = Object.freeze({ x: originX, y: originY });
    const scale = Object.freeze({ x: scaleX, y: scaleY });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const labelPad = 12;
    const svgNamespace = "http://www.w3.org/2000/svg";
    const drawing = document.getElementById("drawing");

    function makeElement(name, attributes, content) {
      const element = document.createElementNS(svgNamespace, name);

      Object.entries(attributes).forEach(([attribute, value]) => {
        element.setAttribute(attribute, String(value));
      });

      if (content !== undefined) {
        element.textContent = content;
      }

      return element;
    }

    function addLine(x1, y1, x2, y2, className) {
      drawing.appendChild(makeElement("line", {
        x1: sx(x1),
        y1: sy(y1),
        x2: sx(x2),
        y2: sy(y2),
        class: className
      }));
    }

    function addText(x, y, content, className, anchor) {
      drawing.appendChild(makeElement("text", {
        x: sx(x),
        y: sy(y),
        class: className,
        "text-anchor": anchor
      }, content));
    }

    function addCircle(x, y, radius, className) {
      drawing.appendChild(makeElement("circle", {
        cx: sx(x),
        cy: sy(y),
        r: Math.abs(sx(radius) - sx(zero)),
        class: className
      }));
    }

    function addRect(left, top, right, bottom, className) {
      drawing.appendChild(makeElement("rect", {
        x: sx(left),
        y: sy(top),
        width: Math.abs(sx(right) - sx(left)),
        height: Math.abs(sy(bottom) - sy(top)),
        class: className
      }));
    }

    function addEndpointTicks(lineY) {
      addLine(
        zero,
        lineY - endTickTopDelta,
        zero,
        lineY + endTickBottomDelta,
        "axis-end"
      );
      addLine(
        one,
        lineY - endTickTopDelta,
        one,
        lineY + endTickBottomDelta,
        "axis-end"
      );
    }

    function addStandardPoint(x) {
      addCircle(x, topLineY, pointHaloRadius, "standard-halo");
      addCircle(x, topLineY, pointRadius, "standard-point");
      addCircle(x, topLineY, pointCoreRadius, "standard-point-core");
    }

    function addStratifiedPoint(x) {
      addCircle(x, bottomLineY, pointHaloRadius, "stratified-halo");
      addCircle(x, bottomLineY, pointRadius, "stratified-point");
      addCircle(x, bottomLineY, pointCoreRadius, "stratified-point-core");
    }

    function addBrace(left, right, horizontalY, tickY, labelY, label) {
      addLine(left, horizontalY, right, horizontalY, "brace");
      addLine(left, horizontalY, left, tickY, "brace");
      addLine(right, horizontalY, right, tickY, "brace");
      addText(
        (left + right) / two,
        labelY,
        label,
        "annotation",
        "middle"
      );
    }

    function addLegendItem(x, className, content) {
      addCircle(x, legendY, legendRadius, className);

      drawing.appendChild(makeElement("text", {
        x: sx(x) + labelPad,
        y: sy(legendY),
        class: "legend",
        "text-anchor": "start",
        "dominant-baseline": "middle"
      }, content));
    }

    try {
      drawing.replaceChildren();

      addText(
        zero,
        topTitleY,
        "Обычная случайная выборка",
        "row-title",
        "start"
      );
      addText(
        one,
        topTitleY,
        `N = ${ten}`,
        "row-count",
        "end"
      );

      addLine(zero, topLineY, one, topLineY, "axis");
      addEndpointTicks(topLineY);
      independentSamples.forEach(addStandardPoint);

      addBrace(
        gapStartX,
        gapEndX,
        gapBraceY,
        gapTickY,
        gapLabelY,
        "пробел"
      );
      addBrace(
        clusterStartX,
        clusterEndX,
        clusterBraceY,
        clusterTickY,
        clusterLabelY,
        "скопление"
      );

      addText(zero, topEndLabelY, String(zero), "axis-label", "middle");
      addText(one, topEndLabelY, String(one), "axis-label", "middle");

      addText(
        zero,
        bottomTitleY,
        "Стратифицированная выборка",
        "row-title",
        "start"
      );
      addText(
        one,
        bottomTitleY,
        `N = ${ten}`,
        "row-count",
        "end"
      );

      Array.from({ length: ten }, (_, index) => {
        const left = index / ten;
        const right = (index + one) / ten;
        const className = index % two === zero ? "stratum-a" : "stratum-b";

        addRect(left, bandTopY, right, bandBottomY, className);
      });

      addLine(zero, bandTopY, one, bandTopY, "stratum-border");
      addLine(zero, bandBottomY, one, bandBottomY, "stratum-border");

      Array.from({ length: ten + one }, (_, index) => {
        const boundary = index / ten;

        addLine(
          boundary,
          bandTopY,
          boundary,
          bandBottomY,
          "stratum-boundary"
        );
      });

      addLine(zero, bottomLineY, one, bottomLineY, "axis");
      addEndpointTicks(bottomLineY);
      stratifiedSamples.forEach(addStratifiedPoint);

      addText(zero, bottomEndLabelY, String(zero), "axis-label", "middle");
      addText(one, bottomEndLabelY, String(one), "axis-label", "middle");

      addLegendItem(
        firstLegendX,
        "standard-point",
        "независимые точки: возможны скопления и пробелы"
      );
      addLegendItem(
        secondLegendX,
        "stratified-point",
        "по одной случайной точке в каждом слое"
      );
    } catch (error) {
      drawing.replaceChildren();

      addText(
        zero,
        fallbackY,
        "Схема должна показать: сверху — скопления и пробелы, снизу — по одной случайной точке в каждом из 10 равных интервалов.",
        "fallback",
        "start"
      );
    }
  </script>
</body>
</html>
