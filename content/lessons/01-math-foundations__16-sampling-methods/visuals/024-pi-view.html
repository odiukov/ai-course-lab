<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дротики в квадрате и круге</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: whitesmoke;
      --plot-fill: white;
      --circle-fill: honeydew;
      --panel-fill: white;
      --panel-line: silver;
      --axis: dimgray;
      --boundary: seagreen;
      --inside: forestgreen;
      --outside: gray;
      --text: black;
      --muted: dimgray;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: midnightblue;
        --plot-fill: black;
        --circle-fill: darkslategray;
        --panel-fill: darkslategray;
        --panel-line: slategray;
        --axis: lightsteelblue;
        --boundary: springgreen;
        --inside: springgreen;
        --outside: lightslategray;
        --text: whitesmoke;
        --muted: lightgray;
      }
    }

    html,
    body {
      background: var(--background);
      color: var(--text);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .figure {
      background: var(--background);
      color: var(--text);
    }

    .title {
      font-size: 22px;
      font-weight: bold;
    }

    .diagram {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--background);
    }

    .diagram[hidden],
    .fallback[hidden] {
      display: none;
    }

    .plot-square {
      fill: var(--plot-fill);
      stroke: var(--axis);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .circle-area {
      fill: var(--circle-fill);
      stroke: var(--boundary);
      stroke-width: 2.5;
      vector-effect: non-scaling-stroke;
    }

    .axis {
      stroke: var(--axis);
      stroke-width: 1.25;
      vector-effect: non-scaling-stroke;
    }

    .tick {
      stroke: var(--axis);
      stroke-width: 1.25;
      vector-effect: non-scaling-stroke;
    }

    .inside-point {
      fill: var(--inside);
    }

    .outside-point {
      fill: var(--outside);
    }

    .panel {
      fill: var(--panel-fill);
      stroke: var(--panel-line);
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;
    }

    .axis-label,
    .tick-label,
    .legend-label,
    .panel-label,
    .panel-note,
    .formula {
      fill: var(--text);
    }

    .tick-label,
    .axis-label {
      font-size: 15px;
    }

    .legend-label,
    .panel-label {
      font-size: 17px;
    }

    .panel-note {
      fill: var(--muted);
      font-size: 16px;
    }

    .formula {
      font-size: 27px;
      font-weight: bold;
    }

    .fallback {
      background: var(--panel-fill);
      color: var(--text);
      font-size: 17px;
    }
  </style>
</head>
<body>
  <main class="figure" aria-labelledby="figure-title">
    <div class="title" id="figure-title">Дротики в квадрате и круге</div>

    <svg
      class="diagram"
      id="diagram"
      xmlns="http://www.w3.org/2000/svg"
      width="920"
      height="440"
      viewBox="0 0 920 440"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="figure-title figure-description"
    >
      <desc id="figure-description">
        Квадрат от минус одного до одного по обеим координатам, единичный
        круг и тысяча случайных точек. Точки внутри круга зелёные, точки
        снаружи серые.
      </desc>
      <g id="diagram-root"></g>
    </svg>

    <div class="fallback" id="fallback" hidden>
      Схема должна была показать квадрат [−1, 1] × [−1, 1], единичный круг,
      1000 точек и формулу π ≈ 4 × внутри / 1000.
    </div>
  </main>

  <script>
    const data = Object.freeze([
      {
        xMin: -1,
        xMax: 1,
        yMin: -1,
        yMax: 1,
        zero: 0,
        one: 1,
        total: 1000,
        radius: 1,
        originX: 230,
        originY: 200,
        scale: 170,
        tickHalf: 0.035,
        pointRadius: 0.009,
        legendRadius: 0.03,
        panelCorner: 0.06,
        panelLeft: 1.42,
        panelRight: 3.76,
        panelTop: 0.72,
        panelBottom: -0.62,
        panelTextX: 1.62,
        panelHeadingY: 0.48,
        panelFormulaY: 0.08,
        panelNoteY: -0.25,
        panelCountY: -0.45,
        legendY: -1.2,
        insideLegendX: -0.92,
        outsideLegendX: 0.08,
        axisNameX: 1,
        axisNameY: 0,
        yNameX: 0,
        yNameY: 1,
        seed: 314159,
        multiplier: 1664525,
        increment: 1013904223,
        modulus: 4294967296,
        shift: 0,
        labelNone: 0,
        labelLeft: -11,
        labelRight: 11,
        labelAbove: -8,
        labelBelow: 18,
        labelMiddle: 5,
        legendGap: 12
      }
    ]);

    const [cfg] = data;
    const origin = Object.freeze({ x: cfg.originX, y: cfg.originY });
    const scale = cfg.scale;

    function sx(x) {
      return origin.x + x * scale;
    }

    function sy(y) {
      return origin.y - y * scale;
    }

    try {
      const svg = document.getElementById("diagram");
      const root = document.getElementById("diagram-root");
      const fallback = document.getElementById("fallback");
      const namespace = svg.namespaceURI;

      function element(name, className) {
        const node = document.createElementNS(namespace, name);
        if (className) {
          node.setAttribute("class", className);
        }
        return node;
      }

      function line(x1, y1, x2, y2, className) {
        const node = element("line", className);
        node.setAttribute("x1", sx(x1));
        node.setAttribute("y1", sy(y1));
        node.setAttribute("x2", sx(x2));
        node.setAttribute("y2", sy(y2));
        return node;
      }

      function circle(cx, cy, radius, className) {
        const node = element("circle", className);
        node.setAttribute("cx", sx(cx));
        node.setAttribute("cy", sy(cy));
        node.setAttribute("r", Math.abs(sx(cx + radius) - sx(cx)));
        return node;
      }

      function rectangle(left, top, right, bottom, className, corner) {
        const node = element("rect", className);
        node.setAttribute("x", sx(left));
        node.setAttribute("y", sy(top));
        node.setAttribute("width", sx(right) - sx(left));
        node.setAttribute("height", sy(bottom) - sy(top));
        if (corner) {
          node.setAttribute(
            "rx",
            Math.abs(sx(cfg.zero + corner) - sx(cfg.zero))
          );
          node.setAttribute(
            "ry",
            Math.abs(sy(cfg.zero + corner) - sy(cfg.zero))
          );
        }
        return node;
      }

      function text(
        content,
        x,
        y,
        className,
        anchor,
        dx,
        dy
      ) {
        const node = element("text", className);
        node.setAttribute("x", sx(x));
        node.setAttribute("y", sy(y));
        node.setAttribute("text-anchor", anchor);
        node.setAttribute("dx", dx);
        node.setAttribute("dy", dy);
        node.textContent = content;
        return node;
      }

      const backgroundLayer = element("g");
      const axisLayer = element("g");
      const pointLayer = element("g");
      const labelLayer = element("g");
      const panelLayer = element("g");

      backgroundLayer.appendChild(
        rectangle(
          cfg.xMin,
          cfg.yMax,
          cfg.xMax,
          cfg.yMin,
          "plot-square",
          cfg.zero
        )
      );

      backgroundLayer.appendChild(
        circle(cfg.zero, cfg.zero, cfg.radius, "circle-area")
      );

      axisLayer.appendChild(
        line(cfg.xMin, cfg.zero, cfg.xMax, cfg.zero, "axis")
      );
      axisLayer.appendChild(
        line(cfg.zero, cfg.yMin, cfg.zero, cfg.yMax, "axis")
      );

      const ticks = [cfg.xMin, cfg.zero, cfg.xMax];

      for (const value of ticks) {
        axisLayer.appendChild(
          line(
            value,
            cfg.zero - cfg.tickHalf,
            value,
            cfg.zero + cfg.tickHalf,
            "tick"
          )
        );

        axisLayer.appendChild(
          line(
            cfg.zero - cfg.tickHalf,
            value,
            cfg.zero + cfg.tickHalf,
            value,
            "tick"
          )
        );

        labelLayer.appendChild(
          text(
            String(value),
            value,
            cfg.yMin,
            "tick-label",
            "middle",
            cfg.labelNone,
            cfg.labelBelow
          )
        );

        if (value !== cfg.zero) {
          labelLayer.appendChild(
            text(
              String(value),
              cfg.zero,
              value,
              "tick-label",
              "end",
              cfg.labelLeft,
              cfg.labelMiddle
            )
          );
        }
      }

      labelLayer.appendChild(
        text(
          "x",
          cfg.axisNameX,
          cfg.axisNameY,
          "axis-label",
          "start",
          cfg.labelRight,
          cfg.labelAbove
        )
      );

      labelLayer.appendChild(
        text(
          "y",
          cfg.yNameX,
          cfg.yNameY,
          "axis-label",
          "start",
          cfg.labelRight,
          cfg.labelMiddle
        )
      );

      let seed = cfg.seed;

      function randomUnit() {
        seed =
          (Math.imul(seed, cfg.multiplier) + cfg.increment) >>> cfg.shift;
        return seed / cfg.modulus;
      }

      for (let index = cfg.zero; index < cfg.total; index += cfg.one) {
        const x =
          cfg.xMin + randomUnit() * (cfg.xMax - cfg.xMin);
        const y =
          cfg.yMin + randomUnit() * (cfg.yMax - cfg.yMin);
        const isInside =
          x * x + y * y <= cfg.radius * cfg.radius;

        pointLayer.appendChild(
          circle(
            x,
            y,
            cfg.pointRadius,
            isInside ? "inside-point" : "outside-point"
          )
        );
      }

      labelLayer.appendChild(
        circle(
          cfg.insideLegendX,
          cfg.legendY,
          cfg.legendRadius,
          "inside-point"
        )
      );

      labelLayer.appendChild(
        text(
          "внутри круга",
          cfg.insideLegendX,
          cfg.legendY,
          "legend-label",
          "start",
          cfg.legendGap,
          cfg.labelMiddle
        )
      );

      labelLayer.appendChild(
        circle(
          cfg.outsideLegendX,
          cfg.legendY,
          cfg.legendRadius,
          "outside-point"
        )
      );

      labelLayer.appendChild(
        text(
          "снаружи круга",
          cfg.outsideLegendX,
          cfg.legendY,
          "legend-label",
          "start",
          cfg.legendGap,
          cfg.labelMiddle
        )
      );

      panelLayer.appendChild(
        rectangle(
          cfg.panelLeft,
          cfg.panelTop,
          cfg.panelRight,
          cfg.panelBottom,
          "panel",
          cfg.panelCorner
        )
      );

      panelLayer.appendChild(
        text(
          "Оценка площади круга",
          cfg.panelTextX,
          cfg.panelHeadingY,
          "panel-label",
          "start",
          cfg.labelNone,
          cfg.labelMiddle
        )
      );

      panelLayer.appendChild(
        text(
          "π ≈ 4 × внутри / 1000",
          cfg.panelTextX,
          cfg.panelFormulaY,
          "formula",
          "start",
          cfg.labelNone,
          cfg.labelMiddle
        )
      );

      panelLayer.appendChild(
        text(
          "«внутри» — число зелёных точек",
          cfg.panelTextX,
          cfg.panelNoteY,
          "panel-note",
          "start",
          cfg.labelNone,
          cfg.labelMiddle
        )
      );

      panelLayer.appendChild(
        text(
          "всего бросков: 1000",
          cfg.panelTextX,
          cfg.panelCountY,
          "panel-note",
          "start",
          cfg.labelNone,
          cfg.labelMiddle
        )
      );

      root.appendChild(backgroundLayer);
      root.appendChild(axisLayer);
      root.appendChild(pointLayer);
      root.appendChild(labelLayer);
      root.appendChild(panelLayer);
    } catch (error) {
      const diagram = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      diagram.hidden = true;
      fallback.hidden = false;
    }
  </script>
</body>
</html>
