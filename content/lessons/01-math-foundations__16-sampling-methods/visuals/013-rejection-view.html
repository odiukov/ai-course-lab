<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Принятые и отброшенные точки под огибающей</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f4ed;
    --panel: #fffdf8;
    --ink: #252b33;
    --muted: #616b75;
    --axis: #68737e;
    --target: #176f86;
    --target-fill: #d8eef0;
    --envelope: #7455a6;
    --reject-fill: #eee4f4;
    --accepted: #16845b;
    --accepted-edge: #075f40;
    --rejected: #d65f50;
    --rejected-edge: #a73d33;
    --point-edge: #fffdf8;
    --guide: #a8b0b7;
  }

  html,
  body {
    background: var(--page);
    color: var(--ink);
  }

  .figure {
    max-width: 960px;
    background: var(--panel);
  }

  .heading {
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 22px;
    font-weight: bold;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    background: var(--panel);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .axis {
    fill: none;
    stroke: var(--axis);
    stroke-width: 2;
    stroke-linecap: round;
  }

  .axis-guide {
    fill: none;
    stroke: var(--guide);
    stroke-width: 1;
  }

  .target-area {
    fill: var(--target-fill);
    stroke: none;
  }

  .reject-area {
    fill: var(--reject-fill);
    stroke: none;
  }

  .target-curve {
    fill: none;
    stroke: var(--target);
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .envelope-curve {
    fill: none;
    stroke: var(--envelope);
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .accepted-point {
    fill: var(--accepted);
    stroke: var(--point-edge);
    stroke-width: 2;
  }

  .rejected-point {
    fill: var(--rejected);
    stroke: var(--point-edge);
    stroke-width: 2;
  }

  .label {
    fill: var(--ink);
    font-size: 15px;
  }

  .curve-label {
    font-size: 18px;
    font-weight: bold;
    paint-order: stroke;
    stroke: var(--panel);
    stroke-width: 4;
    stroke-linejoin: round;
  }

  .target-label {
    fill: var(--target);
  }

  .envelope-label {
    fill: var(--envelope);
  }

  .area-label {
    fill: var(--muted);
    font-size: 14px;
    font-weight: bold;
    paint-order: stroke;
    stroke: var(--panel);
    stroke-width: 4;
    stroke-linejoin: round;
  }

  .legend-label {
    fill: var(--ink);
    font-size: 15px;
  }

  .note {
    fill: var(--muted);
    font-size: 14px;
  }

  .fallback {
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
  }

  .fallback[hidden],
  svg[hidden] {
    display: none;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #14171b;
      --panel: #1c2127;
      --ink: #eef2f5;
      --muted: #bac3cb;
      --axis: #a9b3bc;
      --target: #65c7d9;
      --target-fill: #173940;
      --envelope: #c6a3f1;
      --reject-fill: #3b2c48;
      --accepted: #58d19c;
      --accepted-edge: #8be9bd;
      --rejected: #ff8c7c;
      --rejected-edge: #ffb2a8;
      --point-edge: #1c2127;
      --guide: #59636d;
    }
  }
</style>
</head>
<body>
<main class="figure">
  <div class="heading">Принятые и отброшенные точки под огибающей</div>
  <svg id="diagram"
       width="960"
       height="455"
       viewBox="0 0 960 455"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-label="Целевая плотность, огибающая, принятые и отброшенные точки">
  </svg>
  <p id="fallback" class="fallback" hidden>
    Схема должна была показать целевую плотность p(x), огибающую Mq(x),
    принятые точки под p(x) и отброшенные точки между двумя кривыми.
  </p>
</main>

<script>
const data = {
  zero: { x: 0, y: 0 },
  domain: { left: 0, right: 7.4, bottom: 0, top: 1.78 },
  radius: 0.058,
  legendRadius: 0.064,
  target: [
    [0, 0.08], [0.35, 0.12], [0.7, 0.23], [1.05, 0.48],
    [1.35, 0.78], [1.65, 1.03], [1.9, 1.10], [2.2, 0.94],
    [2.5, 0.66], [2.8, 0.43], [3.15, 0.35], [3.5, 0.48],
    [3.8, 0.75], [4.1, 1.08], [4.4, 1.25], [4.7, 1.13],
    [5, 0.87], [5.35, 0.59], [5.75, 0.39], [6.15, 0.25],
    [6.55, 0.16], [6.95, 0.10], [7.3, 0.08]
  ],
  envelope: [
    [0, 0.38], [0.35, 0.55], [0.7, 0.76], [1.05, 0.98],
    [1.4, 1.20], [1.75, 1.38], [2.1, 1.50], [2.45, 1.58],
    [2.8, 1.63], [3.15, 1.66], [3.5, 1.67], [3.85, 1.66],
    [4.2, 1.62], [4.55, 1.53], [4.9, 1.41], [5.25, 1.26],
    [5.6, 1.08], [5.95, 0.89], [6.3, 0.69], [6.65, 0.50],
    [7, 0.31], [7.3, 0.18]
  ],
  accepted: [
    [0.38, 0.08], [0.72, 0.15], [1.02, 0.31], [1.27, 0.55],
    [1.53, 0.24], [1.72, 0.72], [1.88, 0.94], [2.08, 0.62],
    [2.35, 0.48], [2.62, 0.29], [2.98, 0.20], [3.28, 0.27],
    [3.55, 0.34], [3.78, 0.57], [4.02, 0.76], [4.23, 1.00],
    [4.42, 1.14], [4.63, 0.91], [4.88, 0.68], [5.16, 0.49],
    [5.48, 0.31], [5.82, 0.20], [6.2, 0.15], [6.68, 0.09]
  ],
  rejected: [
    [0.28, 0.26], [0.58, 0.48], [0.91, 0.72], [1.18, 0.91],
    [1.48, 1.08], [1.77, 1.24], [2.04, 1.28], [2.31, 1.12],
    [2.58, 1.23], [2.87, 1.04], [3.13, 0.78], [3.37, 1.30],
    [3.66, 1.12], [3.92, 1.38], [4.18, 1.43], [4.52, 1.38],
    [4.82, 1.26], [5.08, 1.12], [5.38, 0.91], [5.69, 0.76],
    [6.01, 0.64], [6.34, 0.49], [6.61, 0.35], [6.93, 0.22]
  ],
  axisLines: [
    [[0, 0], [7.4, 0]],
    [[0, 0], [0, 1.78]]
  ],
  guideLines: [
    [[1.88, 0], [1.88, 0.94]],
    [[3.92, 0], [3.92, 1.38]]
  ],
  labels: [
    {
      text: "Mq(x) — огибающая",
      at: [5.72, 1.09],
      dx: 14,
      dy: -13,
      anchor: "start",
      className: "curve-label envelope-label"
    },
    {
      text: "p(x) — целевая плотность",
      at: [5.28, 0.61],
      dx: 16,
      dy: 18,
      anchor: "start",
      className: "curve-label target-label"
    },
    {
      text: "между кривыми — отбросить",
      at: [2.92, 1.22],
      dx: -12,
      dy: -12,
      anchor: "end",
      className: "area-label"
    },
    {
      text: "под p(x) — принять",
      at: [2.46, 0.58],
      dx: 14,
      dy: 18,
      anchor: "start",
      className: "area-label"
    },
    {
      text: "высота проверки",
      at: [0.88, 1.78],
      dx: -10,
      dy: 18,
      anchor: "end",
      className: "label"
    },
    {
      text: "предложенное значение x",
      at: [7.34, 0],
      dx: 0,
      dy: 31,
      anchor: "end",
      className: "label"
    }
  ],
  legend: [
    {
      point: [0.62, -0.39],
      textAt: [0.62, -0.39],
      dx: 17,
      dy: 5,
      anchor: "start",
      text: "принята: точка ниже p(x)",
      className: "accepted-point"
    },
    {
      point: [3.8, -0.39],
      textAt: [3.8, -0.39],
      dx: 17,
      dy: 5,
      anchor: "start",
      text: "отброшена: точка выше p(x)",
      className: "rejected-point"
    }
  ],
  note: {
    text: "После проверки высоту забывают — в выборке остаётся только x.",
    at: [3.7, -0.59],
    dx: 0,
    dy: 5,
    anchor: "middle"
  }
};

const origin = Object.freeze({ x: 100, y: 340 });
const scale = Object.freeze({ x: 105, y: 170 });

const sx = x => origin.x + x * scale.x;
const sy = y => origin.y - y * scale.y;

try {
  const svg = document.getElementById("diagram");
  const namespace = "http://www.w3.org/2000/svg";

  function element(name, attributes, className) {
    const node = document.createElementNS(namespace, name);
    for (const [key, value] of Object.entries(attributes)) {
      node.setAttribute(key, value);
    }
    if (className) {
      node.setAttribute("class", className);
    }
    return node;
  }

  function lineBetween(points, className) {
    return element("line", {
      x1: sx(points[0][0]),
      y1: sy(points[0][1]),
      x2: sx(points[1][0]),
      y2: sy(points[1][1])
    }, className);
  }

  function pathData(points, closePath) {
    let first = true;
    const commands = [];
    for (const point of points) {
      commands.push(
        (first ? "M " : "L ") + sx(point[0]) + " " + sy(point[1])
      );
      first = false;
    }
    if (closePath) {
      commands.push("Z");
    }
    return commands.join(" ");
  }

  function curve(points, className) {
    return element("path", { d: pathData(points, false) }, className);
  }

  function area(points, className) {
    return element("path", { d: pathData(points, true) }, className);
  }

  function dot(point, className, radius) {
    return element("circle", {
      cx: sx(point[0]),
      cy: sy(point[1]),
      r: Math.abs(sx(radius) - sx(data.zero.x))
    }, className);
  }

  function textLabel(label, className) {
    const node = element("text", {
      x: sx(label.at[0]),
      y: sy(label.at[1]),
      dx: label.dx,
      dy: label.dy,
      "text-anchor": label.anchor
    }, className || label.className);
    node.textContent = label.text;
    return node;
  }

  const acceptedArea = [
    [data.domain.left, data.domain.bottom],
    ...data.target,
    [data.target.at(-1)[0], data.domain.bottom]
  ];

  const rejectedArea = [
    ...data.envelope,
    ...[...data.target].reverse()
  ];

  svg.append(
    area(acceptedArea, "target-area"),
    area(rejectedArea, "reject-area")
  );

  for (const guide of data.guideLines) {
    svg.append(lineBetween(guide, "axis-guide"));
  }

  for (const axis of data.axisLines) {
    svg.append(lineBetween(axis, "axis"));
  }

  svg.append(
    curve(data.envelope, "envelope-curve"),
    curve(data.target, "target-curve")
  );

  for (const point of data.accepted) {
    svg.append(dot(point, "accepted-point", data.radius));
  }

  for (const point of data.rejected) {
    svg.append(dot(point, "rejected-point", data.radius));
  }

  for (const label of data.labels) {
    svg.append(textLabel(label));
  }

  for (const item of data.legend) {
    svg.append(
      dot(item.point, item.className, data.legendRadius),
      textLabel({
        text: item.text,
        at: item.textAt,
        dx: item.dx,
        dy: item.dy,
        anchor: item.anchor
      }, "legend-label")
    );
  }

  svg.append(textLabel(data.note, "note"));
} catch (error) {
  document.getElementById("diagram").setAttribute("hidden", "");
  document.getElementById("fallback").removeAttribute("hidden");
}
</script>
</body>
</html>
