- concept: корректность метода обратной CDF следует из совпадения CDF полученной величины с целевой CDF
  question: Пусть F — непрерывная строго возрастающая CDF, U — стандартная равномерная случайная величина, а X = F⁻¹(U). Какая цепочка равенств доказывает, что X имеет CDF F?
  explanation: Поскольку F возрастает, неравенство F⁻¹(U) ≤ x эквивалентно U ≤ F(x). Для равномерной U вероятность попасть ниже порога F(x) равна самому порогу, поэтому CDF величины X совпадает с F.
  kind: choice
  options:
    - P(X ≤ x) = P(U ≤ F(x)) = F(x)
    - P(X ≤ x) = P(U ≥ F(x)) = F(x)
    - P(X ≤ x) = P(U ≤ F⁻¹(x)) = F(x)
    - P(X ≤ x) = P(U ≤ f(x)) = F(x)
  correct: 0
  id: 008-inverse-cdf-1
  fingerprint: aa9be51c
- concept: экспоненциальную выборку можно вычислить подстановкой равномерного значения в обратную CDF
  question: Для экспоненциального распределения используют эквивалентную формулу X = −ln(U) / λ. Чему равен X при U = 0.25 и λ = 2? Округли до тысячных.
  explanation: Подстановка даёт X = −ln(0.25) / 2 ≈ 1.386 / 2 ≈ 0.693. Формулы с −ln(U) и −ln(1−U) дают одинаковое распределение, поскольку U и 1−U распределены одинаково.
  kind: numeric
  answer: 0.693
  tolerance: 0.001
  id: 008-inverse-cdf-2
  fingerprint: 18721da6
