- concept: совместная плотность точек постоянна по площади под огибающей
  question: В геометрической реализации метода отбраковки берут x из q(x), затем равномерное u и вычисляют y = uMq(x). Как распределены точки (x, y) внутри области под огибающей Mq(x)?
  explanation: Абсцисса появляется с плотностью q(x), а условная плотность высоты равна 1/(Mq(x)). Их произведение равно 1/M, поэтому точки равномерно заполняют площадь под огибающей.
  kind: choice
  options:
    - С постоянной плотностью по площади, не зависящей от x
    - Плотнее там, где q(x) больше
    - Плотнее там, где p(x) больше
    - Только вдоль кривой Mq(x)
  correct: 0
  id: 013-rejection-view-1
  fingerprint: 0abad6a8
- concept: геометрическое правило принятия точки в rejection sampling
  question: Заполните условие принятия точки в геометрической реализации метода отбраковки.
  explanation: Область под p(x) соответствует принятым точкам. Точки в зазоре между p(x) и Mq(x) отбрасываются; различие между строгим и нестрогим неравенством не влияет на непрерывное распределение.
  kind: cloze
  template: Для точки (x, y), сэмплированной под огибающей Mq(x), принять предложение, если ___.
  answer: y < p(x)
  accept:
    - y <= p(x)
    - y ≤ p(x)
    - y<p(x)
    - y меньше p(x)
  id: 013-rejection-view-2
  fingerprint: c0d17ef5
