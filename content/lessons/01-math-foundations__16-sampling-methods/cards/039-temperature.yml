- concept: при неограниченном росте температуры softmax-распределение стремится к равномерному
  question: Почему при неограниченном увеличении положительной температуры softmax-распределение над конечным словарём стремится к равномерному?
  explanation: Большая температура сжимает различия между масштабированными логитами. В пределе все значения перед softmax совпадают, а softmax одинаковых значений образует равномерное распределение.
  kind: open
  reference: Все отношения логитов к температуре стремятся к нулю, поэтому их экспоненты стремятся к одному и становятся одинаковыми. После нормировки каждый токен получает одинаковую долю вероятностной массы.
  id: 039-temperature-2
  fingerprint: 6d4095a1
