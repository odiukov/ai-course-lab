- concept: локальные производные репараметризованной выборки по параметрам распределения
  question: После фиксации значения ε латентная переменная вычисляется как z = μ + σε. Какие производные позволяют передать градиент в параметры распределения?
  explanation: 'При фиксированном ε выражение z = μ + σε является обычной дифференцируемой функцией: сдвиг μ влияет на z напрямую, а влияние масштаба σ определяется выпавшим шумом ε.'
  kind: choice
  options:
    - Производная z по μ равна единице, а по σ — ε
    - Обе производные равны нулю
    - Производная z по μ равна ε, а по σ — единице
  correct: 0
  id: 053-reparameterization-1
  fingerprint: 62e13bfa
- concept: аффинное преобразование стандартного нормального шума сохраняет требуемое нормальное распределение
  question: Пусть ε — стандартный нормальный шум, не зависящий от μ и σ. Почему величина z = μ + σε имеет математическое ожидание μ и дисперсию σ в квадрате?
  explanation: У стандартного нормального шума нулевое среднее и единичный масштаб. Умножение на σ меняет масштаб, а прибавление μ — центр распределения, не нарушая его нормальность.
  kind: open
  reference: Умножение стандартного нормального шума на σ масштабирует его стандартное отклонение до σ, а прибавление μ сдвигает математическое ожидание к μ. Поэтому результат имеет требуемое нормальное распределение.
  id: 053-reparameterization-2
  fingerprint: 36219dee
