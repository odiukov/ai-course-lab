- concept: ожидаемое число предложений в rejection sampling равно числу требуемых принятых выборок, умноженному на коэффициент M
  question: В rejection sampling целевая плотность и плотность предложения нормированы, а коэффициент огибающей M равен 6. Сколько предложений в среднем потребуется, чтобы получить 75 принятых точек?
  explanation: В среднем на каждую принятую точку приходится M предложений. Поэтому ожидаемая стоимость составляет 75 × 6 = 450 предложений.
  kind: numeric
  answer: 450
  tolerance: 0.01
  id: 014-rejection-cost-1
  fingerprint: 5dc75ea6
- concept: при независимом покоординатном согласовании совместная доля принятия убывает как произведение долей по координатам
  question: Заполни формулу для доли принятия в d измерениях, если по каждой независимой координате подходящей оказывается доля c.
  explanation: Чтобы принять многомерного кандидата, условия должны одновременно выполниться по всем координатам. Независимые доли перемножаются, поэтому совместная доля принятия равна c^d и экспоненциально уменьшается с ростом размерности.
  kind: cloze
  template: alpha_d = ___
  answer: c^d
  accept:
    - c**d
    - c в степени d
  id: 014-rejection-cost-2
  fingerprint: '26305241'
