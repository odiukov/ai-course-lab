- concept: дополнение равномерной случайной величины позволяет избежать логарифма нуля
  question: Почему передавать в math.log дополнение u до единицы безопаснее, чем передавать само u?
  explanation: Если random.random() вернёт ровно 0, вызов math.log(u) завершится ошибкой. Для дополнения аргумент логарифма станет равен 1, а распределение результата останется тем же.
  kind: open
  reference: Генератор может вернуть нижнюю границу диапазона, и тогда логарифм самого u не определён. Дополнение до единицы при этом остаётся допустимым аргументом и сохраняет равномерное распределение.
