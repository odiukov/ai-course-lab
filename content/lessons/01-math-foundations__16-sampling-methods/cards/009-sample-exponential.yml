- concept: экспоненциальная выборка при фиксированном равномерном числе обратно пропорциональна интенсивности
  question: При одном и том же значении u функция вернула 12 секунд при lam = 3. Сколько секунд она вернёт при lam = 9?
  explanation: При фиксированном u числитель преобразования не меняется, поэтому результат обратно пропорционален lam. Увеличение интенсивности втрое сокращает время с 12 до 4 секунд.
  kind: numeric
  answer: 4
  tolerance: 0.000001
