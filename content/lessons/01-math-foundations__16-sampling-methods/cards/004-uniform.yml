- concept: равномерная случайная величина служит универсальным источником для сэмплирования через преобразование
  question: Объясните своими словами, как равномерная случайная величина может использоваться для получения выборок из других распределений.
  explanation: 'Равномерный генератор предоставляет случайную позицию в [0, 1). Подходящее математическое преобразование придаёт этой позиции нужное распределение: например, интервалы можно сопоставить дискретным исходам или преобразовать значение в точку непрерывного диапазона.'
  kind: open
  reference: Исходный диапазон разбивают или преобразуют так, чтобы каждому возможному результату соответствовал участок нужной вероятностной массы. Попадание равномерной величины в этот участок определяет результат выборки.
  id: 004-uniform-2
  fingerprint: f9982a72
