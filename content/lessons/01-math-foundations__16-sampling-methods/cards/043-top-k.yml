- concept: перенормировка top-k делит вероятность сохранённого токена на суммарную массу оставшихся кандидатов
  question: После top-k-фильтрации ненулевыми остались вероятности 0.47, 0.29 и 0.17. Какой станет вероятность второго токена после перенормировки?
  explanation: Суммарная масса сохранённых токенов равна 0.93. Поэтому новая вероятность второго токена равна 0.29 / 0.93 ≈ 0.312.
  kind: numeric
  answer: 0.312
  tolerance: 0.001
  id: 043-top-k-1
  fingerprint: e4e7b50a
- concept: фиксированный размер набора top-k не учитывает концентрацию распределения вероятностей
  question: Почему одно и то же значение k может сохранять маловероятные альтернативы в одном контексте, но отбрасывать правдоподобные варианты в другом?
  explanation: Top-k оставляет фиксированное количество лидеров независимо от формы распределения. Поэтому граница не адаптируется ни к уверенному распределению с явным лидером, ни к размазанному распределению с множеством близких кандидатов.
  kind: choice
  options:
    - Top-k всегда выравнивает вероятности сохранённых токенов
    - Top-k учитывает число кандидатов, но не суммарную вероятность и степень уверенности модели
    - Top-k сначала выбирает токен и только затем фильтрует распределение
    - Top-k автоматически меняет температуру в зависимости от контекста
  correct: 1
  id: 043-top-k-2
