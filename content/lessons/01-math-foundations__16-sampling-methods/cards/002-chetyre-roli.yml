  fingerprint: 1b921787
- concept: исследующее сэмплирование проверяет альтернативные параметры, гипотезы или действия
  question: Объясни своими словами, чем исследующая роль сэмплирования отличается от генерации результата.
  explanation: 'Различие определяется использованием выборки: генерация выдаёт её как результат, а исследование применяет её для поиска новых областей пространства решений.'
  kind: open
  reference: При генерации выбранный образец становится выходом модели, например текстом или изображением. При исследовании выбор направляет алгоритм к альтернативным параметрам, гипотезам или действиям, чтобы он не закрепился слишком рано на уже найденном варианте.
  id: 002-chetyre-roli-3
  fingerprint: 130fee15
