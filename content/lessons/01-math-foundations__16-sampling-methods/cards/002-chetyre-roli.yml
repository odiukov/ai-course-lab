- concept: оценка Монте-Карло приближает математическое ожидание средним по выборкам
  question: Заполни формулу оценки Монте-Карло для функции f по множеству выборок S.
  explanation: Если математическое ожидание нельзя вычислить аналитически, его приближают средним значением функции по полученным выборкам. Обычно точность оценки растёт с увеличением объёма выборки.
  kind: cloze
  template: \widehat{\mathbb{E}}[f(X)] = ___
  answer: \frac{\sum_{x \in S} f(x)}{|S|}
  accept:
    - \frac{1}{|S|}\sum_{x \in S} f(x)
    - (\sum_{x \in S} f(x))/|S|
