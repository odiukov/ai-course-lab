- concept: порядок операций в конвейере температурного, top-k и top-p сэмплирования
  question: Расположите операции функции выбора токена в правильном порядке.
  explanation: Температура сначала формирует распределение, затем top-k и top-p сокращают набор кандидатов. После фильтрации оставшуюся массу приводят к единичной сумме и только потом выполняют случайный выбор.
  kind: order
  items:
    - Преобразовать логиты в вероятности с учётом температуры
    - Применить top-k-фильтр
    - Применить top-p-фильтр к результату предыдущей фильтрации
    - Перенормировать оставшиеся вероятности
    - Передать вероятности категориальному сэмплеру и вернуть выбранный индекс
  id: 051-sample-token-1
  fingerprint: 216eb0b2
- concept: исключённый фильтром токен должен иметь нулевую вероятность перед сэмплированием
  question: Какое условие гарантирует, что категориальный сэмплер не вернёт токен, исключённый top-k или top-p-фильтром?
  explanation: Любая положительная вероятность оставляет токен доступным для случайного выбора. Нулевая вероятность исключает его полностью и остаётся нулевой после перенормировки.
  kind: choice
  options:
    - Вероятность исключённого токена обнулена
    - Вероятность исключённого токена лишь уменьшена
    - Логит исключённого токена меньше максимального
    - Исключённый токен расположен в конце словаря
