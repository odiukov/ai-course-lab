- concept: большой вес важности компенсирует недопредставленность выборки в распределении-предложении
  question: Точка получила большой вес при importance sampling. Что это означает?
  explanation: Вес не оценивает качество отдельной точки. Большое отношение p(x)/q(x) означает, что распределение q показывает такую область слишком редко относительно p, поэтому попавшая туда точка получает усиленный вклад.
  kind: choice
  options:
    - Значение функции в этой точке вычислено особенно точно
    - Подобные точки реже встречаются при выборке из q, чем должны встречаться согласно p
    - Точка обязательно находится около максимума целевой плотности
    - Точку следует считать выбросом и исключить
  correct: 1
  id: 017-importance-view-1
  fingerprint: de88dc8b
- concept: сильное различие между q и p повышает дисперсию оценки из-за доминирования редких выборок
  question: Объясни своими словами, почему importance sampling может давать нестабильную оценку, если распределение q сильно отличается от p.
  explanation: Когда q редко посещает область с заметной вероятностью под p, оценка зависит от того, попадёт ли туда хотя бы одна точка. Её большой вес может захватить всю оценку, что приводит к высокой дисперсии.
  kind: open
  reference: В областях, важных для p, распределение q может давать очень мало точек. Эти редкие точки получают огромные веса и начинают определять почти всю сумму, поэтому результат сильно меняется от одной выборки к другой.
  id: 017-importance-view-2
  fingerprint: 6f4d8380
