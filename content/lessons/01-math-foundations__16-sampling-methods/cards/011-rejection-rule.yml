- concept: вероятность принятия компенсирует отличие распределения-предложения от целевой плотности
  question: Восстановите вероятность принятия кандидата в методе отбраковки.
  explanation: Плотность принятых кандидатов пропорциональна произведению q(x) на вероятность принятия. После сокращения q(x) получается p(x)/M, поэтому итоговое распределение пропорционально целевой плотности.
  kind: cloze
  template: Для кандидата x, полученного из q(x), вероятность принятия равна ___ при условии p(x) ≤ Mq(x).
  answer: p(x) / (M q(x))
  accept:
    - p(x)/(M*q(x))
    - p(x)/(M q(x))
    - p(x) / (M * q(x))
  id: 011-rejection-rule-1
  fingerprint: 261f79c0
- concept: огибающая должна доминировать над целевой плотностью во всей области
  question: Что нарушится, если выбрать M так, что для некоторых x выполняется p(x) > Mq(x)?
  explanation: Условие p(x) ≤ Mq(x) гарантирует допустимую вероятность принятия. Если оно нарушено, отношение p(x)/(Mq(x)) превышает единицу; простое ограничение такого отношения сверху меняет плотность принятых кандидатов и искажает результат.
  kind: choice
  options:
    - Алгоритм останется точным, но будет принимать кандидатов реже
    - Изменится только время работы, а распределение принятых значений сохранится
    - Отношение принятия превысит допустимую вероятность, а его ограничение сверху внесёт смещение
  correct: 2
  id: 011-rejection-rule-2
  fingerprint: f951e695
- concept: увеличение корректной константы огибающей снижает эффективность, но не меняет целевое распределение
  question: Объясните, что произойдёт, если заменить корректную константу огибающей M на более крупную, которая также везде удовлетворяет условию доминирования.
  explanation: Более крупная огибающая равномерно уменьшает отношение p(x)/(Mq(x)). Относительные пропорции принятых значений не меняются, однако доля отказов возрастает.
  kind: open
  reference: Распределение принятых значений останется целевым, но вероятность принятия каждого кандидата уменьшится, поэтому для получения выборки потребуется больше предложений.
  id: 011-rejection-rule-3
  fingerprint: f401b9d9
