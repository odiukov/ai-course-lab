- concept: последовательность операций в алгоритме Gumbel-Max
  question: Расположи действия Gumbel-Max в правильном порядке.
  explanation: Gumbel-Max добавляет независимые шумы Гумбеля к логарифмам категориальных вероятностей и выбирает индекс максимальной суммы.
  kind: order
  items:
    - Независимо сэмплировать шум Гумбеля для каждой категории
    - Вычислить логарифм вероятности каждой категории
    - Прибавить к каждому логарифму соответствующий шум
    - Вернуть индекс категории с максимальной итоговой суммой
  id: 056-gumbel-max-1
  fingerprint: 28b34a06
- concept: Gumbel-Max воспроизводит заданное категориальное распределение без приближения
  question: Заполни пропуск в формуле точности Gumbel-Max.
  explanation: 'Особое распределение шума обеспечивает точный результат: вероятность победы каждой категории совпадает с её исходной категориальной вероятностью.'
  kind: cloze
  template: Если c = argmax_j(ln p_j + g_j), где g_j — независимые шумы Гумбеля, то P(c = i) = ___.
  answer: p_i
  accept:
    - p_i
    - вероятность категории i
    - заданная вероятность категории i
  id: 056-gumbel-max-2
  fingerprint: 3c671da6
- concept: независимость шумов по категориям необходима для случайного выбора в Gumbel-Max
  question: Почему Gumbel-Max требует отдельного независимого шума для каждой категории, а один общий шум не подходит?
  explanation: Общий шум лишь одинаково сдвигает все оценки и сокращается при их сравнении. Случайный категориальный результат возникает благодаря независимому шуму каждого кандидата.
  kind: open
  reference: Прибавление одного общего значения ко всем логарифмам вероятностей не меняет их порядок, поэтому всегда побеждает категория с наибольшей вероятностью. Независимые шумы позволяют разным категориям случайно становиться максимумом.
  id: 056-gumbel-max-3
  fingerprint: 22c6764a
