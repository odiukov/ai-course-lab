- concept: отношение вероятностей обратного и прямого предложений входит в вероятность принятия Метрополиса—Гастингса
  question: Из состояния x предложено состояние y. Отношение целевых плотностей p̃(y)/p̃(x) равно 0.7, а отношение вероятностей обратного и прямого предложений q(x|y)/q(y|x) равно 0.8. Какова вероятность принять y?
  explanation: 'Отношение принятия равно произведению двух данных отношений: 0.7 × 0.8 = 0.56. Множители q необходимы, когда предложение несимметрично.'
  kind: numeric
  answer: 0.56
  tolerance: 0.001
  id: 030-metropolis-rule-1
  fingerprint: dde9ad08
- concept: отклонённое предложение создаёт самопереход и повтор текущего состояния в цепи
  question: Алгоритм Метрополиса—Гастингса предложил перейти из x в y, но отклонил кандидата. Что следует записать как следующее состояние цепи?
  explanation: При отказе цепь остаётся в x, поэтому текущее состояние повторяется. Такие самопереходы являются полноценной частью марковской цепи; удалять их нельзя.
  kind: choice
  options:
    - Снова x
    - Состояние y с пометкой об отклонении
    - Ничего; продолжать предлагать кандидатов до принятия
  correct: 0
  id: 030-metropolis-rule-2
  fingerprint: 3d051509
- concept: принятие некоторых переходов в области меньшей плотности позволяет цепи исследовать разные моды распределения
  question: Почему Метрополис—Гастингс иногда принимает переход в состояние с меньшей целевой плотностью?
  explanation: Если принимать только улучшения, цепь станет алгоритмом подъёма к локальному максимуму и может навсегда остаться возле одной моды. Редкие ухудшающие переходы дают возможность добраться до других областей вероятностной массы.
  kind: open
  reference: Такие переходы позволяют цепи покидать локальные моды, проходить через области меньшей плотности и исследовать всё целевое распределение, а не превращаться в поиск ближайшего максимума.
  id: 030-metropolis-rule-3
  fingerprint: 96ee032a
