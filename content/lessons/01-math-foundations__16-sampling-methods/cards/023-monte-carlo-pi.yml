- concept: возврат результата внутри цикла досрочно прекращает серию испытаний Монте-Карло
  question: В функции Монте-Карло для оценки π инструкцию `return` поместили внутрь цикла по случайным точкам. К чему это приведёт?
  explanation: '`return` немедленно завершает функцию. Если выполнить его внутри цикла, функция не проведёт все `n` испытаний, поэтому доля попаданий не будет оценена по заданному числу точек.'
  kind: choice
  options:
    - Функция завершится сразу после обработки одной точки и не накопит статистику по всей серии
    - Функция обработает всю серию, но перестанет учитывать точки вне круга
    - Цикл станет бесконечным из-за неизменного счётчика
    - Случайные координаты начнут выбираться из неравномерного распределения
  correct: 0
  id: 023-monte-carlo-pi-1
  fingerprint: af61c4eb
- concept: изменение счётчика попаданий линейно изменяет оценку Монте-Карло
  question: При оценивании π методом случайных попаданий серия содержит 250 точек. На сколько изменится итоговая оценка, если число попаданий увеличить на 7 при неизменном размере серии?
  explanation: Оценка вычисляется как `4 * inside / n`. Поэтому изменение равно `4 * 7 / 250 = 0.112`.
  kind: numeric
  answer: 0.112
  tolerance: 0.0001
  id: 023-monte-carlo-pi-2
  fingerprint: f4c81164
