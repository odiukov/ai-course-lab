- concept: стратификация не увеличивает дисперсию оценки по сравнению с обычным Монте-Карло
  question: 'Одно и то же число точек используют для оценки интеграла: в одном случае их независимо выбирают по всей области, в другом — берут по одной случайной точке из каждой равной страты. Как соотносятся дисперсии оценок?'
  explanation: Стратификация гарантирует представительство каждой части области и устраняет вариативность, связанную со случайно неравномерным числом точек в разных участках. Поэтому дисперсия оценки не увеличивается.
  kind: choice
  options:
    - Стратификация всегда повышает дисперсию
    - Дисперсии обязательно совпадают
    - Дисперсия стратифицированной оценки не выше дисперсии обычной оценки Монте-Карло
  correct: 2
  id: 026-stratified-1
  fingerprint: b9161d8b
- concept: границы равных страт определяются длиной интервала и числом страт
  question: Интервал [12, 42] разбит на 6 равных страт. Чему равна нижняя граница предпоследней страты?
  explanation: Ширина страты равна (42 − 12) / 6 = 5. Последняя страта начинается в точке 37, поэтому предпоследняя начинается в точке 32 и занимает интервал [32, 37).
  kind: numeric
  answer: 32
  tolerance: 0.01
