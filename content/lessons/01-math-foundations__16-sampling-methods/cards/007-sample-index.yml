- concept: sample_index возвращает позицию выбранного исхода в списке вероятностей
  question: Функция категориального сэмплирования sample_index возвращает целое значение. Что оно обозначает и как связано с исходным списком вероятностей?
  explanation: sample_index сообщает, какой элемент распределения выбран. Чтобы получить соответствующее значение, этот индекс можно отдельно применить к списку исходов.
  kind: open
  reference: Это индекс, то есть позиция выбранного исхода в исходном списке. Он не является ни вероятностью исхода, ни самим значением исхода.
  id: 007-sample-index-1
  fingerprint: 1b069671
- concept: корректное категориальное распределение состоит из неотрицательных вероятностей с единичной суммой
  question: Какое условие должен выполнять список вероятностей, передаваемый в sample_index?
  explanation: Отрицательные вероятности недопустимы, а единичная сумма нужна, чтобы накопленная сумма образовывала корректную дискретную CDF на всём диапазоне равномерной случайной величины.
  kind: choice
  options:
    - Все вероятности неотрицательны, а их сумма близка к единице
    - Вероятности расположены по убыванию
    - Все вероятности различаются между собой
  correct: 0
  id: 007-sample-index-2
  fingerprint: 1422fa65
