- concept: самонормированная importance sampling оценка делит взвешенную сумму результатов на сумму весов
  question: Для наблюдений получены веса 3, 5 и 7, а значения функции равны 9, 11 и 13 соответственно. Чему равна самонормированная importance sampling оценка?
  explanation: Взвешенная сумма равна 3·9 + 5·11 + 7·13 = 173, а сумма весов — 15. Поэтому самонормированная оценка равна 173/15 ≈ 11.53.
  kind: numeric
  answer: 11.53
  tolerance: 0.01
  id: 018-importance-variance-1
  fingerprint: d16fa683
- concept: clipping отношений вероятностей в PPO ограничивает слишком резкие обновления политики
  question: Зачем PPO применяет clipping к отношению π_new(a|s) / π_old(a|s)?
  explanation: Траектории собраны старой политикой, поэтому отношение вероятностей показывает, насколько новая политика изменила вероятность действия. Clipping ограничивает экстремальные отношения и не позволяет нескольким действиям чрезмерно повлиять на обновление.
  kind: choice
  options:
    - Чтобы ограничить влияние слишком большого изменения вероятности действия и сдержать обновление политики
    - Чтобы превратить собранные действия в независимые выборки из новой политики
    - Чтобы гарантировать несмещённость любой оценки на конечной выборке
    - Чтобы сделать сумму всех отношений вероятностей равной единице
  correct: 0
  id: 018-importance-variance-2
  fingerprint: 1a24efc4
