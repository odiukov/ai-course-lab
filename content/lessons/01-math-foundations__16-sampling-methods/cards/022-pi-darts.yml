- concept: оценка площади по частоте попаданий требует равномерного выбора точек по всему охватывающему квадрату
  question: Объясни своими словами, почему оценка площади круга по доле попаданий будет неверной, если точки чаще выбираются возле центра квадрата.
  explanation: Частота попаданий измеряет вероятность при фактическом распределении точек. Неравномерный сэмплинг заменяет геометрическое отношение площадей другим, взвешенным отношением и тем самым создаёт смещение.
  kind: open
  reference: Доля попаданий соответствует отношению площадей только при равномерном распределении точек. Если центр выбирается чаще, круг получает непропорционально много попаданий, поэтому его площадь и значение π систематически завышаются.
