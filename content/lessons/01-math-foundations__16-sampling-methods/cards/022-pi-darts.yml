- concept: принадлежность точки кругу определяется сравнением квадрата расстояния до центра с квадратом радиуса
  question: Заполни условие, проверяющее попадание точки с координатами x и y в круг радиуса r с центром в начале координат.
  explanation: Выражение x*x + y*y — квадрат расстояния от точки до начала координат. Точка находится внутри круга или на его границе, когда это значение не превосходит квадрата радиуса.
  kind: cloze
  template: 'if x*x + y*y <= ___:'
  answer: r*r
  accept:
    - r**2
    - r * r
