- concept: каждая координата в сэмплировании Гиббса выбирается из её точного условного распределения при фиксированных остальных координатах
  question: Заполни пропуск в правиле покоординатного обновления Гиббса.
  explanation: 'Гиббс не делает произвольный шаг по одной координате: он заново выбирает x_i именно из условного распределения целевой модели, зафиксировав все остальные координаты x_{-i}.'
  kind: cloze
  template: x_i ~ ___
  answer: p(x_i | x_{-i})
  accept:
    - p(x_i|x_{-i})
    - p(x_i given x_{-i})
  id: 035-gibbs-1
  fingerprint: 7a4aa1f2
- concept: при последовательном проходе Гиббса очередное условное распределение использует уже обновлённые значения предыдущих координат
  question: Цепь Гиббса последовательно обновляет координаты A, B и C. В начале прохода состояние равно (a, b, c), а после обновления A получено a′. Из какого распределения следует выбирать новое значение B?
  explanation: Внутри прохода используются самые свежие доступные значения. Поэтому при обновлении B уже учитывается новое значение A = a′, тогда как ещё не обновлённая координата C остаётся равной c.
  kind: choice
  options:
    - p(B | A = a′, C = c)
    - p(B | A = a, C = c)
    - p(A, B, C)
    - Из произвольного распределения предложений q(B)
  correct: 0
  id: 035-gibbs-2
