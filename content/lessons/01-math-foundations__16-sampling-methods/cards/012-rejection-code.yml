- concept: усечённое распределение не может выдавать принятые значения за пределами области усечения
  question: При проверке отбраковки для усечённого нормального распределения в выборке обнаружились принятые значения за пределами разрешённого интервала. Как это интерпретировать?
  explanation: За пределами интервала плотность усечённой нормали равна нулю, поэтому порог принятия там также нулевой. Предложение может породить такое значение, но корректная отбраковка обязана его отклонить.
  kind: choice
  options:
    - Это ожидаемый эффект случайных колебаний конечной выборки
    - Это означает лишь, что для гистограммы выбрано слишком много столбцов
    - Это нормально, если распределение-предложение не является усечённым
    - 'В реализации или в целевой плотности есть ошибка: такие значения не должны приниматься'
  correct: 3
  id: 012-rejection-code-2
  fingerprint: e8f88960
