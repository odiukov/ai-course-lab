- concept: вес importance sampling равен отношению целевой плотности к плотности распределения выборки
  question: Для наблюдения x целевое распределение даёт p(x) = 0.63, а распределение выборки — q(x) = 0.21. Чему равен importance weight этого наблюдения?
  explanation: 'Вес вычисляется как w(x) = p(x) / q(x). Поэтому 0.63 / 0.21 = 3: наблюдение должно получить втрое больший вклад, чем в невзвешенной оценке.'
  kind: numeric
  answer: 3
  tolerance: 0.01
  id: 016-importance-1
  fingerprint: 7b1fffbb
- concept: распределение выборки должно покрывать всю область положительной вероятности целевого распределения
  question: Целевое распределение p приписывает событию A положительную вероятность, а распределение q никогда не порождает A. Почему importance sampling не сможет корректно учесть это событие?
  explanation: Если q(x) = 0 там, где p(x) > 0, выборка из q не содержит сведений об этой области, а вес p(x) / q(x) требует деления на ноль. Увеличение числа выборок проблему не устраняет.
  kind: choice
  options:
    - Вес события A всегда будет равен нулю
    - В выборке не появятся наблюдения A, а отношение p(x) / q(x) для них не определено
    - Все остальные наблюдения автоматически получат одинаковые веса
    - При достаточно большой выборке событие A всё равно появится
  correct: 1
  id: 016-importance-2
  fingerprint: 868080a9
