- concept: аффинное отображение равномерной величины на непрерывный диапазон
  question: Заполни формулу, которая переносит U из единичного полуинтервала в непрерывный диапазон от a до b.
  explanation: Множитель b - a растягивает единичный диапазон до нужной ширины, а прибавление a сдвигает его начало. Например, в уроке формула 10 + (30 - 10)U при U = 0,73 даёт 24,6.
  kind: cloze
  template: X = ___
  answer: a + (b - a) * U
  accept:
    - (b - a) * U + a
    - a + U * (b - a)
