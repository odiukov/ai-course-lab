- concept: burn-in уменьшает влияние начального состояния цепи на оценку
  question: Зачем в MCMC отбрасывают начальный участок цепи, запущенной далеко от типичной области целевого распределения?
  explanation: Начальные состояния отражают выбранную стартовую точку сильнее, чем стационарное распределение. Burn-in удаляет этот переходный участок, но не устраняет зависимость между оставшимися состояниями.
  kind: choice
  options:
    - Чтобы сделать оставшиеся состояния строго независимыми
    - Чтобы уменьшить смещение из-за начального состояния до выхода цепи на стационарный режим
    - Чтобы компенсировать асимметрию распределения-предложения
    - Чтобы повысить вероятность принятия последующих предложений
  correct: 1
  id: 033-mcmc-practice-1
  fingerprint: c19e7f5d
- concept: положительная автокорреляция уменьшает эффективный объём выборки MCMC
  question: Заполните утверждение об информативности коррелированной цепи.
  explanation: Похожие соседние состояния несут частично повторяющуюся информацию. Поэтому оценка по коррелированной цепи обычно менее точна, чем оценка по такому же количеству независимых выборок.
  kind: cloze
  template: При сильной положительной автокорреляции эффективный объём выборки обычно ___ числа сохранённых состояний.
  answer: меньше
  accept:
    - ниже
    - меньше номинального объёма
  id: 033-mcmc-practice-2
  fingerprint: b97dde9c
- concept: слишком малый масштаб предложения даёт высокую долю принятия, но медленное исследование распределения
  question: Цепь Метрополиса—Гастингса принимает почти каждое предложение, однако её трассировка меняется очень маленькими шагами и долго остаётся в узкой области. Объясните причину и назовите параметр, который следует настроить.
  explanation: Высокая доля принятия сама по себе не гарантирует хорошего смешивания. При слишком малых предложениях цепь принимает множество почти одинаковых состояний и плохо исследует целевое распределение.
  kind: open
  reference: Вероятнее всего, масштаб предложения слишком мал. Кандидаты находятся рядом с текущим состоянием и потому часто принимаются, но цепь медленно перемещается и сохраняет сильную автокорреляцию. Следует осторожно увеличить масштаб предложения и оценить не только долю принятия, но и качество перемещения цепи.
  id: 033-mcmc-practice-3
  fingerprint: 5a9ff4cc
