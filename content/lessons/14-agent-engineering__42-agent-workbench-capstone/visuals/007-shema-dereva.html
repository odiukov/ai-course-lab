<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дерево agent-workbench-pack</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fb;
      --panel: #ffffff;
      --panel-soft: #f0f4f8;
      --root: #e7f0ff;
      --version: #fff5d9;
      --text: #172033;
      --muted: #596579;
      --line: #7890ad;
      --accent: #2767c5;
      --accent-soft: #c9dcfa;
      --service: #a86800;
      --service-line: #d29a39;
      --border: #ccd5e1;
      --code: #253752;
      --error: #8b1e2d;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --panel: #1a2330;
        --panel-soft: #202b3a;
        --root: #172d4c;
        --version: #332b18;
        --text: #edf3fb;
        --muted: #aab8ca;
        --line: #6e88a8;
        --accent: #79adff;
        --accent-soft: #294a76;
        --service: #ffc560;
        --service-line: #9b762e;
        --border: #354459;
        --code: #d6e4f7;
        --error: #ffacb7;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    body {
      padding: 12px 16px;
    }

    figure {
      width: 100%;
      margin: 0;
      background: var(--page);
    }

    figcaption {
      margin: 0 0 8px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 750;
      letter-spacing: -0.01em;
    }

    .lead {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 470px;
      background: var(--page);
      overflow: visible;
    }

    .tree-line {
      fill: none;
      stroke: var(--line);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .separator {
      stroke: var(--border);
      stroke-width: 1;
    }

    .service-separator {
      stroke: var(--service-line);
      stroke-width: 2;
    }

    .node {
      fill: var(--panel);
      stroke: var(--border);
      stroke-width: 1;
    }

    .node-root {
      fill: var(--root);
      stroke: var(--accent);
      stroke-width: 2;
    }

    .node-version {
      fill: var(--version);
      stroke: var(--service-line);
      stroke-width: 1;
    }

    .join-dot {
      fill: var(--accent);
      stroke: var(--page);
      stroke-width: 2;
    }

    .folder-mark {
      fill: var(--accent-soft);
      stroke: var(--accent);
      stroke-width: 1;
    }

    .service-mark {
      fill: var(--service);
    }

    .root-name {
      fill: var(--text);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 17px;
      font-weight: 750;
    }

    .root-count {
      fill: var(--accent);
      font-size: 15px;
      font-weight: 700;
    }

    .group-name {
      fill: var(--text);
      font-size: 15px;
      font-weight: 700;
    }

    .file-name {
      fill: var(--code);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 13px;
    }

    .version-name {
      fill: var(--service);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 15px;
      font-weight: 750;
    }

    .version-copy {
      fill: var(--text);
      font-size: 14px;
      font-weight: 650;
    }

    .version-note {
      fill: var(--muted);
      font-size: 13px;
    }

    #fallback {
      padding: 16px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--error);
      font-size: 15px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title diagram-lead">
    <figcaption>
      <h1 id="diagram-title">Дерево пака: 14 рабочих файлов + отдельный VERSION</h1>
      <p class="lead" id="diagram-lead">Четырнадцать частей выполняют работу; служебная метка версии доводит число файлов на диске до 15.</p>
    </figcaption>

    <svg id="diagram" width="1180" height="470"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Дерево файлов agent-workbench-pack</title>
      <desc id="svg-desc">Пять ветвей содержат четырнадцать рабочих файлов. VERSION вынесен в отдельную служебную строку.</desc>
    </svg>

    <div id="fallback" hidden>
      Схема должна была показать дерево agent-workbench-pack: 4 документа,
      3 JSON-схемы, 4 Python-скрипта, install.sh, AGENTS.md и README.md —
      всего 14 рабочих файлов; отдельно лежит VERSION, поэтому на диске 15 файлов.
    </div>
  </figure>

  <script>
    const DATA = Object.freeze([
      {
        kind: "layout",
        trunkX: 294, treeTopY: 58, treeBottomY: 384,
        rootEdgeX: 259, rootMidY: 209, branchEndX: 340,
        dotR: 5, cornerR: 8, markX: 360, markSize: 13,
        dividerX: 505, serviceLineY: 420
      },
      {
        kind: "root", x: 24, y: 172, w: 235, h: 74,
        nameX: 45, nameY: 201, countX: 45, countY: 226,
        name: "agent-workbench-pack/", count: "14 рабочих файлов"
      },
      {
        kind: "group", x: 340, y: 30, w: 816, h: 56,
        midY: 58, titleX: 387, titleY: 63,
        markY: 51, dividerY1: 42, dividerY2: 74,
        title: "Верхний уровень · 2 файла",
        files: [
          { x: 532, y: 63, label: "AGENTS.md" },
          { x: 760, y: 63, label: "README.md" }
        ]
      },
      {
        kind: "group", x: 340, y: 99, w: 816, h: 75,
        midY: 136, titleX: 387, titleY: 141,
        markY: 129, dividerY1: 111, dividerY2: 162,
        title: "docs/ · 4 документа",
        files: [
          { x: 532, y: 126, label: "agent-rules.md" },
          { x: 790, y: 126, label: "reliability-policy.md" },
          { x: 532, y: 153, label: "handoff-protocol.md" },
          { x: 790, y: 153, label: "reviewer-rubric.md" }
        ]
      },
      {
        kind: "group", x: 340, y: 188, w: 816, h: 64,
        midY: 220, titleX: 387, titleY: 225,
        markY: 213, dividerY1: 200, dividerY2: 240,
        title: "schemas/ · 3 JSON-схемы",
        files: [
          { x: 532, y: 225, label: "agent_state.schema.json" },
          { x: 750, y: 225, label: "task_board.schema.json" },
          { x: 966, y: 225, label: "scope_contract.schema.json" }
        ]
      },
      {
        kind: "group", x: 340, y: 266, w: 816, h: 76,
        midY: 304, titleX: 387, titleY: 309,
        markY: 297, dividerY1: 278, dividerY2: 330,
        title: "scripts/ · 4 Python-скрипта",
        files: [
          { x: 532, y: 293, label: "init_agent.py" },
          { x: 790, y: 293, label: "run_with_feedback.py" },
          { x: 532, y: 321, label: "verify_agent.py" },
          { x: 790, y: 321, label: "generate_handoff.py" }
        ]
      },
      {
        kind: "group", x: 340, y: 356, w: 816, h: 56,
        midY: 384, titleX: 387, titleY: 389,
        markY: 377, dividerY1: 368, dividerY2: 400,
        title: "bin/ · 1 установщик",
        files: [
          { x: 532, y: 389, label: "install.sh" }
        ]
      },
      {
        kind: "version", x: 24, y: 429, w: 1132, h: 34,
        markX: 45, markY: 446, markR: 5,
        nameX: 63, nameY: 451,
        releaseX: 175, releaseY: 451,
        copyX: 285, copyY: 451,
        noteX: 1128, noteY: 451,
        name: "VERSION", release: "1.0.0",
        copy: "служебный указатель — не входит в 14 рабочих файлов",
        note: "всего на диске: 15 файлов"
      }
    ]);

    const CANVAS = Object.freeze({ width: 1180, height: 470 });
    const origin = Object.freeze({ x: 0, y: 0 });
    const scale = Object.freeze({ x: 1, y: 1 });
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const NS = "http://www.w3.org/2000/svg";
      const layout = DATA.find(item => item.kind === "layout");
      const root = DATA.find(item => item.kind === "root");
      const groups = DATA.filter(item => item.kind === "group");
      const version = DATA.find(item => item.kind === "version");

      if (!svg || !fallback || !layout || !root || !version) {
        throw new Error("Неполные данные схемы");
      }

      svg.setAttribute(
        "viewBox",
        [
          sx(0),
          sy(0),
          sx(CANVAS.width) - sx(0),
          sy(CANVAS.height) - sy(0)
        ].join(" ")
      );

      const make = (name, attrs, value) => {
        const node = document.createElementNS(NS, name);
        Object.entries(attrs).forEach(([key, attr]) => node.setAttribute(key, attr));
        if (value !== undefined) node.textContent = value;
        return node;
      };

      const line = (x1, y1, x2, y2, className) => {
        svg.appendChild(make("line", {
          x1: sx(x1), y1: sy(y1), x2: sx(x2), y2: sy(y2),
          class: className
        }));
      };

      const rect = (x, y, w, h, r, className) => {
        svg.appendChild(make("rect", {
          x: sx(x),
          y: sy(y),
          width: sx(x + w) - sx(x),
          height: sy(y + h) - sy(y),
          rx: sx(r) - sx(0),
          ry: sy(r) - sy(0),
          class: className
        }));
      };

      const circle = (x, y, r, className) => {
        svg.appendChild(make("circle", {
          cx: sx(x), cy: sy(y), r: sx(r) - sx(0), class: className
        }));
      };

      const text = (x, y, className, value, anchor) => {
        svg.appendChild(make("text", {
          x: sx(x), y: sy(y), class: className,
          "text-anchor": anchor
        }, value));
      };

      line(
        layout.trunkX,
        layout.treeTopY,
        layout.trunkX,
        layout.treeBottomY,
        "tree-line"
      );
      line(
        layout.rootEdgeX,
        layout.rootMidY,
        layout.trunkX,
        layout.rootMidY,
        "tree-line"
      );

      groups.forEach(group => {
        line(
          layout.trunkX,
          group.midY,
          layout.branchEndX,
          group.midY,
          "tree-line"
        );
        circle(layout.trunkX, group.midY, layout.dotR, "join-dot");
      });

      rect(
        root.x, root.y, root.w, root.h,
        layout.cornerR, "node-root"
      );
      text(root.nameX, root.nameY, "root-name", root.name, "start");
      text(root.countX, root.countY, "root-count", root.count, "start");

      groups.forEach(group => {
        rect(
          group.x, group.y, group.w, group.h,
          layout.cornerR, "node"
        );
        rect(
          layout.markX,
          group.markY,
          layout.markSize,
          layout.markSize,
          layout.cornerR,
          "folder-mark"
        );
        line(
          layout.dividerX,
          group.dividerY1,
          layout.dividerX,
          group.dividerY2,
          "separator"
        );
        text(
          group.titleX,
          group.titleY,
          "group-name",
          group.title,
          "start"
        );
        group.files.forEach(file => {
          text(file.x, file.y, "file-name", file.label, "start");
        });
      });

      line(
        version.x,
        layout.serviceLineY,
        version.x + version.w,
        layout.serviceLineY,
        "service-separator"
      );
      rect(
        version.x,
        version.y,
        version.w,
        version.h,
        layout.cornerR,
        "node-version"
      );
      circle(
        version.markX,
        version.markY,
        version.markR,
        "service-mark"
      );
      text(
        version.nameX,
        version.nameY,
        "version-name",
        version.name,
        "start"
      );
      text(
        version.releaseX,
        version.releaseY,
        "version-copy",
        version.release,
        "start"
      );
      text(
        version.copyX,
        version.copyY,
        "version-copy",
        version.copy,
        "start"
      );
      text(
        version.noteX,
        version.noteY,
        "version-note",
        version.note,
        "end"
      );
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      if (svg) svg.hidden = true;
      if (fallback) fallback.hidden = false;
    }
  </script>
</body>
</html>
