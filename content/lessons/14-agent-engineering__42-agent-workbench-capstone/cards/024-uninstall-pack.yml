- concept: перед удалением производной точки входа проверяется, что это именно ожидаемая ссылка на канонический источник, а не одноимённый файл пользователя
  question: В репозитории есть файл с именем одной из точек входа, которые создаёт установщик, но это обычный файл с собственным текстом, а не ссылка на канонический источник правил. Как поступает деинсталлятор?
  explanation: 'Установщик создаёт эти пути как ссылки на единственный источник — именно это и есть признак его собственности. Обычный файл с тем же именем написал пользователь: возможно, до установки пака. Проверка типа и цели ссылки отделяет поставленное от чужого; сохранение копии «на всякий случай» лишь оставляет мусор.'
  kind: choice
  options:
    - 'Удаляет: имя входит в список создаваемых точек входа'
    - 'Оставляет: совпадения имени недостаточно, удаляется только ожидаемая ссылка на канонический источник'
    - Удаляет, предварительно отложив рядом копию с другим именем
