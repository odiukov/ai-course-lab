- concept: 'повторный запуск деинсталляции не ошибка: отсутствующий управляемый путь уже находится в целевом состоянии'
  question: Деинсталлятор запускают второй раз, часть управляемых путей уже отсутствует. Каким должен быть результат?
  explanation: Деинсталлятор описывает целевое состояние («этих путей нет»), а не последовательность обязательных удалений. Уже отсутствующий файл цели не противоречит. Ошибка на нём сделала бы прерванное удаление невозможным доделать, а отказ из-за неполноты — заблокировал бы обычный повтор.
  kind: choice
  options:
