- concept: файл метки выпуска не несёт ни контракта, ни поведения, ни объяснения — он только даёт короткий идентификатор редакции
  question: В корне пака лежит крошечный файл, содержащий одну строку вроде `2.4.1`. Почему его не относят к рабочим файлам верстака?
  explanation: 'Рабочие файлы делают работу: схемы задают контракт данных, скрипты исполняют действия, документы объясняют правила, установщик раскладывает всё это. Метка выпуска не делает ничего из перечисленного — она идентифицирует редакцию. При этом она обязательна и лежит в паке, так что варианты про необязательность и про генерацию на стороне репозитория неверны.'
  kind: choice
  options:
    - Он ничего не описывает, не проверяет и не запускает — только позволяет назвать установленную редакцию, не сравнивая содержимое остальных файлов
    - 'Он необязателен: пак работает и без него, поэтому в поставку он входит по желанию команды'
    - Он генерируется установщиком в целевом репозитории, а в самом паке его нет
    - Он относится к документации, а документы считают отдельно от рабочих файлов
