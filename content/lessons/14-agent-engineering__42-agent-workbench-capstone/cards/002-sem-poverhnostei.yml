- concept: 'одна поверхность верстака собирается из нескольких файлов разных типов: схема задаёт контракт, скрипт выполняет действие'
  question: В паке рядом лежат `agent_state.schema.json` и `init_agent.py`. Как правильно понимать это соседство?
