- concept: 'одна поверхность верстака собирается из нескольких файлов разных типов: схема задаёт контракт, скрипт выполняет действие'
  question: В паке рядом лежат `agent_state.schema.json` и `init_agent.py`. Как правильно понимать это соседство?
  explanation: Поверхность — это участок работы агента, а не отдельный файл. У состояния агента есть контракт (схема) и действие (скрипт инициализации). Так же устроена проверка (политика надёжности, рубрика, `verify_agent.py`) и передача результата (`handoff-protocol.md` плюс `generate_handoff.py`).
  kind: choice
  options:
    - Это две независимые поверхности верстака, случайно связанные именем
    - 'Это одна поверхность: схема фиксирует допустимую форму данных, скрипт создаёт эти данные в целевом репозитории'
    - Схема нужна только для документации, рабочей является одна поверхность — скрипт
    - Скрипт дублирует схему на случай, если валидатор недоступен
  correct: 1
  id: 002-sem-poverhnostei-1
  fingerprint: 25f31ee6
- concept: 'порядок работы установщика пака: защита от перезаписи, копирование, подключение CI, подсказка следующих шагов'
  question: Расставь действия установщика пака (`bin/install.sh`) в порядке выполнения.
  explanation: 'Отказ идёт первым: иначе установщик затрёт уже настроенный пак. Печать следующих шагов идёт последней и снимает вопрос «а что теперь?», который иначе уходит коллеге в чат.'
  kind: order
  items:
    - Проверить, не установлен ли пак уже, и отказаться без флага `--force`
    - Скопировать содержимое пака в целевой репозиторий
    - Подключить CI, если в репозитории есть `.github/workflows/`
    - 'Напечатать следующие шаги: заполнить доску, задать команды приёмки, запустить init-скрипт'
  id: 002-sem-poverhnostei-2
  fingerprint: a28a3ad3
- concept: у пака одна точка входа в целевой репозиторий — установщик, и это делает установку проверяемой процедурой
  question: Почему пак подключают к целевому репозиторию через установщик, а не инструкцией «скопируйте эти папки руками»?
  explanation: 'Ручные шаги невоспроизводимы: часть из них теряется, часть выполняется по-разному. Единственный вход — установщик — делает установку одной процедурой, у которой есть предсказуемый результат и которую можно прогнать в CI.'
  kind: choice
  options:
    - Скрипт копирует файлы быстрее, чем файловый менеджер
    - Ручное копирование ломает права доступа на файлы
    - Одна точка входа даёт одну процедуру установки, которую можно повторить и проверить, вместо набора необязательных ручных шагов
    - Установщик шифрует содержимое пака при переносе
  correct: 2
  id: 002-sem-poverhnostei-3
  fingerprint: 66df64b7
