- concept: 'отказ установки должен быть наблюдаем для вызывающего: ненулевой код возврата, а не только сообщение в вывод'
  question: 'Установщик вызывают из shell-скрипта в конвейере. Установка отказывает: пак уже стоит, флага перезаписи нет. Каким должен быть наблюдаемый контракт отказа?'
  explanation: 'Вызывающий скрипт видит только код возврата. Отказ, завершённый успешно, конвейер пропустит: следующие шаги пойдут по несуществующей установке. Один объявленный контракт ошибки на все причины отказа делает установку проверяемой автоматикой, а не глазами.'
  kind: choice
  options:
    - Один способ сигнализации — исключение или ошибка, транслируемая в ненулевой код возврата, чтобы вызывающий конвейер остановился
    - 'Предупреждение в стандартный вывод и успешное завершение: решение принимает человек, читающий лог'
    - 'Молчаливый выход без записи: конвейер сам заметит, что файлы не появились'
