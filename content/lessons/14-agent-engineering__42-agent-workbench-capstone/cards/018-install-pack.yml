- concept: 'перезапись установки заменяет слепок целиком: наложение новых файлов поверх старых оставляет артефакты прежней редакции'
  question: Установка с force заменяет ранее установленный пак. Почему недостаточно скопировать новые файлы поверх старых?
  explanation: 'Установка — это слепок конкретной версии пака. Наложение даёт объединение двух слепков: всё новое плюс мусор из старого. Такой набор не соответствует ни одной выпущенной версии, и проверка соответствия версии перестаёт что-либо значить.'
  kind: choice
  options:
    - Файлы, исчезнувшие в новой редакции, останутся на месте, и в репозитории окажется смесь двух версий — например, схема, на которую больше ничто не ссылается
    - Копирование поверх всегда отказывает на существующих файлах, поэтому шаг просто не выполнится
    - Поверх старых файлов новые попадут с неверными правами доступа
