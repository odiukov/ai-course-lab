- concept: 'безопасный дефолт установщика: перезапись существующей установки доступна только через явный флаг, обычный запуск отказывается'
  question: Установщик по умолчанию отказывается ставиться поверх уже существующего пака и перезаписывает его только с явным флагом --force. Что даёт такой дефолт?
  explanation: 'Дефолт выбирают по цене ошибки. Молчаливая перезапись стоит потерянных локальных настроек, отказ стоит одного повторного запуска с флагом. Идемпотентность это не даёт: отказ и перезапись — разные исходы, и второй запуск без флага просто ничего не делает.'
  kind: choice
  options:
    - Разрушительное действие требует отдельного решения человека, поэтому случайный повторный запуск не затирает настроенную доску и команды приёмки
    - 'Установка становится идемпотентной: повторный запуск всегда даёт то же состояние репозитория'
    - Установщик перестаёт зависеть от порядка своих шагов и может выполнять их в любой последовательности
