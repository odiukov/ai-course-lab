- concept: расхождение версии, записанной в состоянии репозитория, и версии установленного пака указывает на пропущенную миграцию как первую гипотезу сбоя
  question: В состоянии целевого репозитория записано, что он инициализирован против версии пака 3, а в файле VERSION установленного пака стоит 6. Агент перестал читать своё состояние. С чего начинать разбор?
  explanation: 'Пара чисел — источник истины в паке и слепок в репозитории — существует ровно для такой диагностики. Пока числа совпадают, установленная редакция соответствует контрактам; разъехались через мажорные границы — значит, пропущены миграции. Переписать номер вручную означает соврать состоянию: данные останутся в старом формате.'
  kind: choice
  options:
    - Считать причиной смену модели и откатить её
    - 'Проверить, выполнялись ли миграции между этими версиями: мажорный разрыв означает, что старое состояние не соответствует новым контрактам'
    - Переписать номер в состоянии на текущий и перезапустить агента
    - 'Ничего не делать: номера версий носят справочный характер'
