- concept: применение критерия переносимости к новым кандидатам, не входящим в канонический список
  question: Что из этого можно класть в переносимый пак?
  explanation: 'Политика повторов описывает способ работы и остаётся верной в любом репозитории. Адрес стейджинга, список багов и обёртка над конкретным провайдером привязаны к одному проекту или вендору: после переноса они врут либо требуют немедленной замены.'
  kind: choice
  options:
    - Файл с адресом стейджинг-сервера и токеном CI текущего репозитория
    - Документ с политикой повторов и правилами остановки цикла обратной связи
    - Список открытых багов продукта с приоритетами
    - Модуль-обёртку над биллинговым API выбранного провайдера
