- concept: поставленный паком файл правил получает опцию сохранения, потому что пользователь мог сделать его частью собственного контракта проекта
  question: Общий файл правил для агентов поставил сам пак, и всё же деинсталлятор даёт флаг «оставить его». Почему для этого файла сделано исключение?
  explanation: Файл правил — единственная поставленная поверхность, которая обычно прирастает содержимым проекта. Признак владения у него смешанный, поэтому вместо угадывания деинсталлятор передаёт решение пользователю флагом отказа от удаления.
  kind: choice
  options:
    - Потому что без него деинсталлятор не сможет найти остальные поставленные файлы
    - Потому что пользователь мог дописать в него правила своего проекта и хочет сохранить их после удаления остальной поставки
    - Потому что этот файл формально не входит в поставку пака
