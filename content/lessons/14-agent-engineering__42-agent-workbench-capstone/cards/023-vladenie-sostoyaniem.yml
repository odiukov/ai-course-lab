- concept: отказ при незафиксированных изменениях состояния — требование обратимости операции через историю VCS, а не защита самих файлов состояния от удаления
  question: Деинсталлятор нашёл незакоммиченные изменения в файлах состояния и остановился — хотя удалять эти файлы он всё равно не собирался. Какое требование он этим защищает?
  explanation: Отказ на незафиксированном состоянии — предохранитель против необратимости, а не заявление о правах на файлы. Состояние принадлежит пользователю в любом случае; проверка лишь требует, чтобы у операции была точка возврата.
  kind: open
  reference: 'Требование обратимости. Удаление поставленных файлов безопасно потому, что рабочая область зафиксирована в истории: любой промах можно откатить. Пока в файлах состояния есть незакоммиченные изменения, откатить операцию нечем — история не содержит текущей рабочей области, и любая ошибка в границе удаления превращается в безвозвратную потерю. Отказ не утверждает, что деинсталлятор посягал на состояние; он сообщает, что безопасную границу нельзя считать подтверждённой. Сначала зафиксировать или осознанно отменить изменения, затем повторить.'
