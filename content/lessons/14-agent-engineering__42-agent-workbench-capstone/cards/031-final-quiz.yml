- concept: 'репозиторий-шаблон и вкладываемый пак — разные единицы доставки: шаблон становится самим репозиторием и применим только при старте нового проекта, пак вкладывается в уже живущий'
  question: Команда хочет раздать один и тот же набор поверхностей и новым проектам, и десятку давно работающих репозиториев. Объясни своими словами, почему форкаемый репозиторий-шаблон закрывает только первую половину задачи, и что покрывает вкладываемый пак.
  explanation: 'Разница не в формате файлов, а в том, что считается единицей поставки: у шаблона — целый репозиторий, у пака — директория внутри чужого репозитория. Поэтому пак применим и к новому, и к старому проекту, а шаблон — только к новому.'
  kind: open
  reference: 'Шаблон задаёт весь репозиторий целиком: кнопка «Use this template» создаёт новый проект из него, поэтому шаблон применим в момент старта, когда своего кода ещё нет. У давно работающего репозитория уже есть собственный корень, история и файлы — его нельзя «создать из шаблона», не потеряв всё это. Вкладываемый пак — поддиректория с установщиком: он ложится внутрь существующего дерева рядом с чужим кодом и потому применим в любой момент жизни проекта. Отсюда практический вывод: шаблон и пак — разные единицы доставки одного и того же содержимого, и для полного покрытия нужен пак, а шаблон остаётся удобной обёрткой для новых проектов.'
  id: 031-final-quiz-2
  fingerprint: a1425a84
- concept: 'единица версионирования — директория пака целиком, а не отдельный файл: поверхности выпускаются и откатываются одним слепком'
  question: В паке лежат схема состояния, скрипт-исполнитель и файл правил. Скрипт правили чаще остальных. Предлагают дать каждому файлу собственный номер редакции и обновлять их независимо. Что с этим не так?
  explanation: 'Пак поставляется и проверяется как один слепок: схема, скрипт и правила согласованы между собой в пределах выпуска. Независимые номера позволяют собрать в целевом репозитории смесь редакций, которую никто не собирал и не тестировал, и делают невозможным откат к известному рабочему состоянию — откатывать пришлось бы каждый файл по отдельности, угадывая совместимые пары.'
  kind: choice
  options:
    - 'Ничего: пофайловые номера точнее описывают историю изменений каждой поверхности'
    - Версия относится к слепку пака целиком; пофайловые номера разрешают комбинации, которые никогда не собирались и не проверялись вместе
    - 'Проблема только в трудозатратах: вести много номеров дольше, чем один'
    - Пофайловые номера допустимы для скриптов, но запрещены для схем и документов
