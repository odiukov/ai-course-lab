  question: Чем плохо вписывать проектные глобы и доменные критерии прямо в канонический пак, если сейчас проект всего один?
  explanation: Разделение источника и поставки нужно не для аккуратности, а чтобы обновление оставалось механической операцией, а не ручным разбором происхождения каждой строки.
