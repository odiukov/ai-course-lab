- concept: классификация кандидата опирается на его объявленные признаки назначения, а не на имя или расширение файла
  question: Функция-классификатор получает кандидата с именем `setup.json`. На что она должна опираться при решении?
  explanation: '`setup.json` может быть и переносимой схемой поверхности, и настройкой одного проекта. Имя и расширение о назначении не говорят, поэтому решение принимается по признакам кандидата: контракт это, рантайм, документ правил — или проектные данные.'
  kind: choice
  options:
    - 'На расширение: любой JSON — контракт, значит внутрь пака'
    - На каталог, в котором файл лежал у автора
    - На переданные признаки кандидата — его тип и область применения
    - На длину имени файла как признак служебного назначения
  correct: 2
  id: 004-classify-candidates-1
  fingerprint: 788b03bc
- concept: 'классификатор делает разбиение: каждый кандидат попадает ровно в одну группу, потерь и дублей нет'
  question: Дополни проверку разбиения после классификации кандидатов.
  explanation: 'Классификатор строит разбиение: сумма размеров групп совпадает с числом кандидатов. Если сумма меньше — кандидат потерян веткой условий, если больше — попал в обе группы.'
  kind: cloze
  template: |-
    inside, outside = classify_pack_candidates(candidates)
    assert len(inside) + len(outside) == ___
  answer: len(candidates)
  accept:
    - len(candidates)
    - len(list(candidates))
  id: 004-classify-candidates-2
  fingerprint: b5af68d6
- concept: функция-классификатор не мутирует вход и сохраняет исходный порядок элементов внутри групп
  question: Почему классификатор кандидатов не должен изменять входной список и переставлять элементы внутри полученных групп?
  explanation: 'Разбиение — чистая операция: на входе список кандидатов, на выходе два новых списка. Мутация входа и перетасовка порядка превращают проверку установки в нестабильный тест.'
  kind: open
  reference: 'Вход принадлежит вызывающему коду: если функция удаляет из него элементы или сортирует их, следующий вызов и любая другая проверка увидят уже испорченные данные, а ошибку будет трудно связать с классификатором. Сохранение исходного порядка делает результат детерминированным и сравнимым: две группы можно диффать между запусками, а расхождение указывает на изменившиеся признаки кандидатов, а не на перестановку. Практически это значит собирать новые списки и добавлять в них элементы по ходу одного прохода по входу.'
  id: 004-classify-candidates-3
  fingerprint: e4fa9d73
