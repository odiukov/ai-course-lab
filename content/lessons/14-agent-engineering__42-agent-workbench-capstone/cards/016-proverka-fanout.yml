- concept: 'инструментоспецифичные дополнения требуют отдельного файла: точка входа не имеет собственного содержимого, и правка через неё меняет общий контракт для всех агентов'
  question: Одному агенту нужно дополнительное правило, остальным — нет. Файлы правил всех инструментов — ссылки на канонический AGENTS.md. Почему нельзя просто дописать правило в файл этого агента?
  explanation: Точка входа — адрес, а не документ. Правка через неё это правка источника, то есть общего контракта. Инструментоспецифичное правило выносят в отдельный файл, который подключается рядом с общим, — так единый источник остаётся один, а расширение остаётся локальным.
  kind: choice
  options:
    - 'Своего содержимого у точки входа нет: запись через неё попадёт в канонический файл и подействует на всех агентов'
