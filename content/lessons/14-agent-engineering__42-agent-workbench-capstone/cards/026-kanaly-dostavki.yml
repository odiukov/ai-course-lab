- concept: канал выбирают по рабочему процессу получателя, а не по желаемому поведению пака
  question: Команда регулярно заводит новые репозитории и хочет, чтобы workbench уже лежал в них с первого коммита. Какой способ поставки подходит лучше всего?
  explanation: Шаблонный репозиторий даёт стартовую структуру для новых проектов; копирование директории удобно, когда репозиторий уже живёт; установка одной командой уместна внутри агентного продукта. Выбор определяется процессом команды, а менять ради него правила пака нельзя.
  kind: choice
  options:
    - Шаблонный репозиторий, который форкают как основу нового проекта
    - Копирование директории в уже существующий репозиторий
    - Отдельная редакция пака с изменёнными правилами под новые проекты
