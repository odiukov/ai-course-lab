- concept: источник исключён из множества получателей раскладки — иначе получается ссылка на саму себя и единственный настоящий файл теряется
  question: Функция планирует раскладку канонического файла правил по точкам входа инструментов и возвращает пары «где ссылка — куда ведёт». Почему сам канонический файл в список получателей не включают?
  explanation: 'Раскладка — это отношение «источник → получатели», и источник в правой части появляться не может. Иначе установщик подставит на место содержимого самоссылку: файл станет циклом, а текст правил исчезнет.'
  kind: choice
  options:
    - 'Он источник: как получатель он получил бы ссылку на себя, и установщик заменил бы единственный файл с содержимым битой ссылкой'
    - Он и так есть в репозитории, поэтому лишняя запись просто игнорируется установщиком
    - Его нельзя перезаписывать средствами файловой системы, только вручную
