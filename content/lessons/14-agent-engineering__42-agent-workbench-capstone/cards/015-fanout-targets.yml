- concept: 'переносимость требует относительной цели: абсолютный путь привязан к машине установки и ломается при клонировании, форке или переносе репозитория'
  question: Почему в ссылку на канонический файл правил записывают относительный путь, а не абсолютный вроде /Users/dev/proj/AGENTS.md?
  explanation: Абсолютный путь описывает машину, на которой запускали установщик. После клонирования в другой каталог или на другой машине такая ссылка указывает в пустоту. Относительная цель описывает положение внутри репозитория и переезжает вместе с ним.
  kind: choice
  options:
    - Относительная цель разрешается внутри самого репозитория, поэтому переживает клонирование в другой каталог, форк и работу на другой машине
    - Относительная цель занимает меньше места в индексе и быстрее читается
    - Абсолютные пути запрещены в git и не попадают в коммит
