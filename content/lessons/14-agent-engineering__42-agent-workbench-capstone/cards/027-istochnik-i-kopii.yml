- concept: полезная правка, сделанная в установленной копии, распространяется только через канонический источник
  question: В одном репозитории прямо в установленной директории исправили правило, и исправление оказалось полезным для всех. Расставь операции, чтобы оно закрепилось.
  explanation: Стрелки идут только от источника к копиям. Правка, оставшаяся в копии, будет затёрта следующей установкой и никогда не доедет до остальных репозиториев. Закрепляется она лишь через источник и новую сборку.
  kind: order
  items:
    - Перенести исправление в канонический пак — единственное место, где принимаются изменения
    - Пересобрать пак из источника и поднять его метку версии
    - Переустановить обновлённый пак в репозитории, включая тот, где правку сделали вручную
  id: 027-istochnik-i-kopii-1
  fingerprint: 33afcee9
- concept: различие версий у установленных копий допустимо, пока оно наблюдаемо; опасен не разрыв, а его незаметность
  question: Источник выпустил редакцию 6, а часть репозиториев осталась на редакции 5. Как это оценивать?
  explanation: 'Отложенное обновление — рабочее состояние. Опасно, когда установленная редакция нигде не записана: тогда отставание неотличимо от дрейфа, и понять, какой слепок лежит в репозитории, уже нельзя.'
  kind: choice
  options:
    - Нормально, если каждая установка записала свою редакцию и разрыв виден проверкой
    - 'Сбой: все установленные копии обязаны в любой момент совпадать с источником'
    - 'Нормально в любом случае: расхождение версий не влияет на работу пака'
  correct: 0
