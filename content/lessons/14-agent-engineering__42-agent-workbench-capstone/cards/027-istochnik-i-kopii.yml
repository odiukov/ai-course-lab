- concept: 'поток однонаправлен и для данных: состояние конкретной установки не поднимается в источник'
  question: Почему текущая задача, история запусков и файл состояния агента остаются в репозитории и никогда не переносятся обратно в канонический пак?
  explanation: 'Разделение «рецепт — порция» задаёт направление обмена: контракты вниз, состояние никуда. Из него же следуют правила деинсталляции и разбор дрейфа.'
  kind: open
  reference: Источник хранит рецепт, а установка — порцию. Пак задаёт схемы, скрипты и документы, одинаковые для всех репозиториев; состояние же описывает ход работы в одном конкретном месте и для других установок бессмысленно. Подняв его в источник, ты разослал бы чужую задачу и чужую историю во все репозитории при следующей установке. Поэтому вверх идут только универсальные изменения контрактов, а состояние остаётся собственностью установки — по той же причине его не трогает и деинсталлятор.
  id: 027-istochnik-i-kopii-3
