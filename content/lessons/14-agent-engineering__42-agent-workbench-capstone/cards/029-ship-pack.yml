- concept: 'проверка результата — предусловие объявления поставки готовой: путь возвращается только после успешной проверки'
  question: Расставь шаги функции, готовящей проектную поставку.
  explanation: 'Сборка идёт из источника, настройка — поверх слепка. Проверка обязана предшествовать возврату пути: если объявить поставку готовой, а потом обнаружить расхождение, наружу уже ушёл невалидный слепок.'
  kind: order
  items:
    - Собрать отдельный слепок из канонического источника, не изменяя сам источник
    - Применить к слепку проектные правила, глобы области и доменный критерий рубрики
    - Прогнать проверку пака на получившемся слепке
    - Вернуть путь к слепку и описание применённых настроек
  id: 029-ship-pack-2
