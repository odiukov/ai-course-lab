- concept: 'локальность настройки как проверяемое свойство: смена одного параметра меняет ровно один ожидаемый файл слепка'
  question: Какой тест доказывает, что настройка глобов области действительно локальна?
  explanation: 'Успешная проверка и воспроизводимость — другие свойства: оба выполняются и у функции, которая переписывает половину пака. Локальность видна только из сравнения слепков: изменился ровно ожидаемый файл, остальное не тронуто.'
  kind: choice
  options:
    - Смена одного глоба меняет только файл области, а остальные файлы слепка побайтово совпадают с прежним прогоном
    - Слепок после смены глоба проходит проверку пака без ошибок
    - Повторный запуск с теми же настройками даёт тот же слепок
