  fingerprint: d93bee70
- concept: 'сравнение ведётся по нормализованному значению файла, а не по сырому тексту: незначимые пробелы и перевод строки не образуют расхождения'
  question: Идентификатор редакции хранится в файле одной строкой, и разные редакторы дописывают в конец перевод строки. Какой вызов нужен, чтобы это не превратилось в ложное расхождение?
  explanation: Файл с содержимым "12\n" и файл с содержимым "12" описывают одну редакцию. Сравнение сырых строк объявило бы их разными и остановило бы выпуск на пустом месте. Нормализация пробелов до разбора числа убирает этот класс ложных срабатываний, не ослабляя точного сравнения самих чисел.
  kind: cloze
