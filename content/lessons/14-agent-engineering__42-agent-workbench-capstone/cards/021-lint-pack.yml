- concept: испорченное содержимое проверяемого файла — это результат проверки со своей диагностикой, а не необработанное исключение линтера
  question: В файл с идентификатором редакции кто-то вписал `v3-beta`. Как должен отреагировать линтер пака?
  explanation: 'Линтер — инструмент, который вызывают в конвейере выпуска: он обязан завершиться отчётом на любом входе. Отсутствие файла, непригодное содержимое и несовпадение чисел — три разные причины с разными действиями человека, поэтому их диагностики не сливают в одну. Исключение же не сообщает, что именно проверялось.'
  kind: choice
  options:
    - 'Упасть с исключением разбора числа: невалидный вход не входит в его зону ответственности'
    - Считать значение нулевым и продолжить сравнение с источником
    - Вернуть проваленную проверку с сообщением о непригодном содержимом, отдельным от сообщения об отсутствии файла
    - Молча пропустить проверку, раз число прочитать не удалось
  correct: 2
