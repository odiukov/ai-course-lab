- concept: 'подсказка следующих шагов привязана к успеху, а не к запуску: при отказе такой вывод создаёт ложную картину состоявшейся установки'
  question: Установщик обнаружил в репозитории уже настроенный пак и остановился, ничего не записав. Чего в его выводе быть не должно?
  explanation: Инструкция «что делать дальше» — это отчёт о состоявшемся результате. Напечатанная после отказа, она заставит пользователя настраивать установку, которой не произошло, и расхождение вскроется позже и дороже. При отказе полезны только причина и способ продолжить.
  kind: choice
  options:
    - Причины отказа и указания, каким явным флагом можно продолжить
    - Списка следующих шагов по настройке доски и команд приёмки
    - Пути, по которому найдена существующая установка
  correct: 1
