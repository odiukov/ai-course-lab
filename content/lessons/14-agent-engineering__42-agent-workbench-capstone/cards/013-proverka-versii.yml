- concept: 'мажорное повышение обнуляет минорный и патч-разряды: смена линии совместимости сбрасывает счёт изменений внутри прежней линии'
  question: Пак поднимает мажорную версию из-за несовместимого формата состояния. Что происходит с минорным и патч-разрядами и зачем это правило нужно?
  explanation: 'Без обнуления пришлось бы держать в голове, что минор из старой линии и минор из новой — разные вещи. Правило простое: мажор меняется — младшие в ноль; минор меняется — патч в ноль.'
  kind: open
  reference: 'Оба младших разряда обнуляются: новая мажорная линия начинает свой счёт с нуля. Минор считает совместимые добавления внутри одной линии совместимости, патч — правки без обязательств; при смене линии этот счёт теряет смысл, потому что считался относительно прежнего контракта. Обнуление делает сравнение версий однозначным: разряды сопоставимы только внутри одного мажора, а прыжок мажора сразу читается как «нужна миграция».'
  id: 013-proverka-versii-2
