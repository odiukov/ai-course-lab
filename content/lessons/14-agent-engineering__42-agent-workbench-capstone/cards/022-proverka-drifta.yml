- concept: 'инструмент проверки не устраняет найденное расхождение сам: перезапись метки уничтожила бы единственный признак невыполненной работы'
  question: Проверка перед выпуском нашла расхождение между версией источника пака и меткой установки в репозитории. Почему она не должна сама записать в метку актуальное значение?
  explanation: 'Метка ценна как факт: она описывает, что реально установлено. Приведя её к версии источника без установки, инструмент получит зелёную проверку при старом слепке внутри — и следующий сбой будет уже необъяснимым. Обнаружение и исправление здесь принципиально разные роли.'
  kind: choice
  options:
    - Потому что запись в целевой репозиторий требует отдельных прав
    - Потому что метка тогда покажет установку, которой не было, и невыполненная миграция станет невидимой
    - Потому что менять метку разрешено только вручную владельцем репозитория
  correct: 1
  id: 022-proverka-drifta-1
  fingerprint: 1c96d0e3
- concept: 'полнота дерева установки не является признаком согласованности: сравниваются записанные редакции, а не наличие файлов'
  question: 'В репозитории присутствуют все ожидаемые файлы пака: схемы, скрипты, документы, точки входа. Достаточно ли этого, чтобы считать установку согласованной с источником?'
  explanation: Проверка наличия отвечает на вопрос «всё ли на месте», а не «из какой редакции это всё». Полный, но устаревший слепок проходит любую проверку присутствия — расхождение видно только при сравнении объявленной версии источника с меткой установки.
  kind: choice
  options:
    - Да, полнота дерева и есть согласованность
    - 'Нет: файлы могут быть полными, но относиться к прежней редакции — сравнивать нужно записанные редакции'
    - Да, если ни один из файлов не менялся вручную после установки
  correct: 1
  id: 022-proverka-drifta-2
  fingerprint: 8dcd099a
