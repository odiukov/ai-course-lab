  fingerprint: 4cbe025a
- concept: метку установки перезаписывает только установщик, поэтому дрейф закрывается повторной установкой, а не правкой значения в метке
  question: Расставь шаги обнаружения и закрытия дрейфа между источником пака и целевым репозиторием в правильном порядке.
  explanation: Метка — квитанция установщика. Если исправить её вручную, она перестанет описывать то, что действительно лежит в репозитории, и дрейф просто станет невидимым. Единственный способ привести метку в согласие с источником — выполнить установку заново.
  kind: order
  items:
    - Прочитать версию, объявленную в источнике пака
    - Прочитать метку установки в целевом репозитории
    - Сравнить значения и зафиксировать расхождение как дрейф
    - Переустановить пак, чтобы установщик сам перезаписал метку новым значением
