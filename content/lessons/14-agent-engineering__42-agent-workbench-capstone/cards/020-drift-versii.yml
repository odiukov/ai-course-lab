- concept: устаревшую установку нельзя опознать по виду дерева или датам файлов — нужен явно записанный идентификатор редакции
  question: Пак обновили с 3.1.0 до 3.5.0, но один целевой репозиторий не переустанавливали. Файлы на месте, ссылки работают, агент запускается без ошибок. Почему факт устаревания приходится узнавать из записанной метки, а не из состояния файлов?
  explanation: 'Смысл метки в том, что она превращает невидимое свойство («из какой редакции этот слепок») в читаемое значение. Без неё остаются только ненадёжные признаки: внешний вид дерева и время изменения файлов.'
  kind: open
  reference: 'Дерево старой и новой редакции выглядит одинаково: те же каталоги, те же имена, работоспособные ссылки. Даты изменения говорят о том, когда файлы попали в репозиторий, а не какой редакции они соответствуют — их меняет любое копирование, клонирование или чекаут. Послойное сравнение содержимого с источником дорого и требует доступа к нужной редакции источника. Явная метка сводит проверку к сравнению двух коротких значений: 3.1.0 против 3.5.0 — расхождение становится наблюдаемым состоянием, а не скрытой случайностью.'
