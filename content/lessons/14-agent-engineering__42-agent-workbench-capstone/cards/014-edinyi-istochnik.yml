  question: В репозитории есть канонический файл правил и созданные установщиком файлы-точки входа для четырёх инструментов, ведущие к нему. Что можно удалить и восстановить установщиком без потери информации?
  explanation: 'Асимметрия здесь и есть смысл единого источника: содержимое живёт в одном файле, всё остальное — адреса, ведущие к нему. Восстановить адреса из содержимого можно, содержимое из адресов — нет. Поэтому удалять точки входа безопасно, а канонический файл — нет.'
