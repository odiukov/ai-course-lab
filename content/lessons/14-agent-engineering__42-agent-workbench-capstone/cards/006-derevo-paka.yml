- concept: в каноническом дереве исполняемый код рантайма лежит в scripts/, а schemas/ хранит только описания допустимой структуры данных
  question: В пак добавляют исполняемый скрипт, который читает `task_board.json` и валидирует его против схемы доски. Где в каноническом дереве пака его место?
  explanation: '`schemas/` хранит формальные образцы допустимой структуры данных и ничего не выполняет. Всё исполняемое поведение агента живёт в `scripts/` рядом с инициализацией, циклом обратной связи, проверкой и генерацией handoff.'
  kind: choice
  options:
    - В `schemas/` — рядом со схемой, которую он проверяет
    - В `scripts/` — это рантайм, исполняемое действие
    - В `docs/` — валидация относится к правилам работы
    - В `bin/` — рядом с установщиком
  correct: 1
  id: 006-derevo-paka-1
  fingerprint: 43476a36
- concept: установщик отделён в bin/, потому что отвечает за установку пака, а не за поведение агента
  question: Почему `install.sh` лежит в отдельном каталоге `bin/`, а не вместе с остальными скриптами в `scripts/`?
  explanation: 'Разделение по назначению, а не по языку: содержимое `scripts/` вызывает агент во время работы, а `bin/install.sh` вызывает человек один раз при разворачивании пака. Отдельный каталог не даёт спутать эти роли.'
  kind: choice
  options:
    - Потому что это shell-скрипт, а в `scripts/` только Python
    - Потому что установщик запускают чаще остальных скриптов
    - Потому что он управляет установкой самого пака, а не поведением агента в целевом репозитории
    - Потому что каталог `bin/` автоматически добавляется в PATH
  correct: 2
  id: 006-derevo-paka-2
  fingerprint: a549fee8
- concept: 'на верхнем уровне пака лежат две разные точки входа: AGENTS.md адресован агенту, README.md — человеку'
  question: Зачем в корне пака держат и `AGENTS.md`, и `README.md`?
  explanation: У пака два читателя. Агент заходит через `AGENTS.md` и получает оттуда правила и ссылки на поверхности; человек открывает `README.md`, чтобы понять, что это за набор и как его ставить. Слияние в один файл ломает одну из этих точек входа.
  kind: choice
  options:
    - '`README.md` — копия `AGENTS.md` на случай, если агент не поддерживает второй формат'
    - '`AGENTS.md` подключает агенту нужные инструкции, а `README.md` объясняет человеку назначение пака и порядок использования'
    - '`AGENTS.md` содержит список файлов, а `README.md` — историю версий'
    - 'Это требование установщика: он ищет ровно два файла в корне'
  correct: 1
  id: 006-derevo-paka-3
