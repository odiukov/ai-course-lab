- concept: версия набора изменений определяется самым сильным изменением в нём, а не большинством и не первым встреченным файлом
  question: 'classify_bump получает список изменённых путей: schemas/task_board.schema.json, docs/agent-rules.md, docs/reviewer-rubric.md. Каким будет ответ?'
  explanation: 'Версия описывает весь выпуск целиком. Изменённая схема может потребовать преобразования существующих данных, и патч такое предупреждение потерял бы. Свёртка идёт по приоритету: мажорное сильнее патча, патч сильнее отсутствия изменений — количество файлов каждой категории роли не играет.'
  kind: choice
  options:
    - 'Патч: документов в наборе больше, чем схем'
    - 'Мажорное поднятие: изменение схемы сильнее правок документации, а результат определяется самым сильным изменением набора'
    - Ответ зависит от того, в каком порядке пути идут в списке
    - 'Сразу оба ответа: мажорное для схемы и патч для документов'
  correct: 1
  id: 012-classify-bump-1
  fingerprint: 0fd9ed1f
- concept: перестановочная инвариантность результата — тест, отделяющий корректную свёртку по приоритету от ошибки «победил последний элемент»
  question: Реализация classify_bump идёт по списку и на каждом файле перезаписывает результат, фактически возвращая категорию последнего пути. Какой тест обнаружит ошибку быстрее всего?
  explanation: Однородные и пустые списки такая реализация обрабатывает верно, поэтому они ошибку пропустят. Признак корректной агрегации — перестановка входных путей не меняет ответ; смешанный набор в двух порядках сразу выдаёт «победил последний».
  kind: choice
  options:
    - Список из одного документа
    - 'Один и тот же смешанный список, поданный в разном порядке: ответы разойдутся'
    - Пустой список
    - Список из нескольких одинаковых путей к документам
  correct: 1
  id: 012-classify-bump-2
  fingerprint: '69925764'
- concept: 'пустой набор изменений — нейтральный исход свёртки: поднятие не требуется'
  question: В classify_bump передали пустой список изменённых путей. Что она должна вернуть?
  explanation: Пустой набор — нейтральный элемент шкалы «мажорное > патч > без изменений». Возвращать патч значит поднимать версию без причины и плодить редакции, за которыми не стоит ни одного изменения контрактов; ошибка тоже неуместна — отсутствие изменений это нормальное состояние, а не сбой.
  kind: choice
  options:
    - 'Патч: раз функцию вызвали, выпускается новая редакция'
    - 'Признак того, что поднятие не требуется: без изменений схем, скриптов и документов версия остаётся прежней'
    - Мажорное поднятие — как самый безопасный вариант
    - 'Ошибку: пустой список считается недопустимым входом'
  correct: 1
  id: 012-classify-bump-3
  fingerprint: c11d163a
