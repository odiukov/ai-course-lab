- concept: корень сборки вычисляется от расположения модуля, а не от текущей рабочей директории
  question: Сборщик пака должен давать один и тот же целевой каталог независимо от того, из какой папки терминала его запустили. Чем заполнить пропуск?
  explanation: 'Path.cwd() и относительные пути привязывают сборку к месту запуска: из другой папки скрипт либо не найдёт исходники, либо создаст outputs не там. Path(__file__).resolve().parent даёт расположение самого модуля, поэтому маршрут сборки фиксирован.'
  kind: cloze
  template: PACK_ROOT = Path(___).resolve().parent / "outputs" / "agent-workbench-pack"
  answer: __file__
  accept:
    - __file__
    - '__file__ '
  id: 009-assemble-pack-1
  fingerprint: 5bbecde6
- concept: 'стабильный вывод дерева требует явной сортировки путей: порядок обхода файловой системы не гарантирован'
  question: Сборщик печатает дерево пака, обходя каталог через rglob и выводя пути в том порядке, в каком их вернула файловая система. Почему такой вывод нельзя считать стабильным?
  explanation: Порядок выдачи обхода зависит от файловой системы и истории каталога. Пак может быть идентичным, а напечатанное дерево — разным, и различие в выводе будет ложным сигналом в CI. Сортировка относительных путей убирает эту зависимость.
  kind: choice
  options:
    - Порядок обхода файловой системы не гарантирован и может отличаться между машинами и запусками, поэтому относительные пути нужно явно отсортировать
    - rglob не заходит во вложенные каталоги, часть файлов просто потеряется
    - Дерево обязано печататься в порядке создания файлов, иначе оно неверное
    - Порядок вывода на воспроизводимость не влияет — сравнивают только содержимое файлов
  correct: 0
  id: 009-assemble-pack-2
