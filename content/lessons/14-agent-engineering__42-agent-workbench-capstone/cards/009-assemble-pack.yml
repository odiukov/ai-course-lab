- concept: 'отсутствие обязательного исходника прерывает сборку: неполный пак выпускать нельзя'
  question: Во время сборки пака выясняется, что обязательный исходный файл схемы отсутствует. Как должна повести себя функция сборки?
  explanation: 'Нулевой код выхода — это обещание, что пак собран целиком. Заглушка или молчаливый пропуск дают внешне успешную сборку с дырой в контрактах, и ошибка всплывёт уже у агента. Подтягивание файла из чужой установки вдобавок ломает детерминированность: результат начинает зависеть от состояния целевого репозитория.'
  kind: choice
  options:
    - Создать на его месте пустую заглушку и продолжить сборку
    - Пропустить файл, напечатать дерево и завершиться с нулевым кодом
    - Прервать работу понятной ошибкой, не выпуская неполный пак
    - Взять файл из ранее установленной копии пака в целевом репозитории
  correct: 2
  id: 009-assemble-pack-3
  fingerprint: f8ffef15
