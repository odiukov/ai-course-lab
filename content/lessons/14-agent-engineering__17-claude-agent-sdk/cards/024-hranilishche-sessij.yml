- concept: append дописывает один ход в конец, а load собирает из записей список сообщений на вход модели
  question: Процесс агента перезапустили. Перед новым обращением к модели надо восстановить историю диалога из хранилища сессий. Какой операцией?
  explanation: '`append(session_id, message)` только дописывает очередной ход в конец — ничего не перезаписывая, история монотонно растёт. Обратная операция `load(session_id)` читает записи и собирает из них тот самый список сообщений, который цикл кладёт модели на вход. `list_sessions()` тут не помогает: она отвечает на вопрос «какие сессии вообще есть», а не «что было в этой».'
  kind: cloze
  template: |-
    messages = store.___(session_id)
    response = model(messages)
  answer: load
  accept:
    - load(session_id)
    - store.load
  id: 024-hranilishche-sessij-2
  fingerprint: e83e12cb
- concept: флаг --session-mirror зеркалит стенограмму во внешний файл по ходу стриминга и потому пригоден для наблюдения за незавершённым прогоном
  question: Агент выполняет длинный прогон, до конца ещё далеко, а посмотреть на уже сделанные ходы нужно прямо сейчас. Что даёт флаг CLI `--session-mirror` и почему для этого не годится обычный `load`?
  explanation: Смысл флага — наблюдаемость незавершённого прогона. Он не заменяет пять операций хранилища (`append`, `load`, `list_sessions`, `delete`, `list_subkeys`), а добавляет к ним внешнюю копию стенограммы для отладки.
  kind: open
  reference: '`--session-mirror` зеркалит стенограмму сессии во внешний файл прямо по ходу стриминга: каждый ход попадает в файл по мере появления, а не после завершения прогона. Это отладочный побочный канал — файл можно читать сторонними средствами (tail, grep, редактор), не трогая процесс агента и не дожидаясь его конца. `load(session_id)` — операция самого хранилища, вызывать её надо из кода и она даёт срез диалога, а не поток; зеркало же удобно именно как непрерывно дописываемый человекочитаемый файл рядом с работающим агентом.'
  id: 024-hranilishche-sessij-3
  fingerprint: f1f73930
