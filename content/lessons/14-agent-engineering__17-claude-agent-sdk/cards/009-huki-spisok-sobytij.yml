- concept: запретить действие можно только в хуке, срабатывающем до исполнения инструмента; пост-хук способен лишь наблюдать
  question: 'Нужно, чтобы агент не мог выполнить shell-команду удаления каталога: вызов должен быть отклонён, а не зафиксирован постфактум. Какой хук жизненного цикла Claude Agent SDK для этого подходит и почему?'
  explanation: '`PostToolUse` вызывается уже после исполнения: команда отработала, отменять нечего. `Notification` — побочный канал оповещений, `Stop` — уборка на выходе. Только `PreToolUse` стоит между решением модели и исполнением, поэтому вся защитная логика (белые списки команд, запрет на запись вне рабочего каталога) живёт там; остальные хуки — про аудит и удобство.'
  kind: choice
  options:
    - '`PostToolUse` — он получает и имя инструмента, и аргументы, и результат'
    - '`PreToolUse` — он единственный срабатывает до исполнения и потому может отменить вызов'
    - '`Notification` — он рассылает оповещения по побочному каналу и блокирует вызов до подтверждения'
    - '`Stop` — он отвечает за уборку при выходе агента'
  correct: 1
  id: 009-huki-spisok-sobytij-1
  fingerprint: a34e18e9
- concept: хук перед сжатием контекста нужен, чтобы вынести важное состояние наружу до того, как часть истории будет утеряна
  question: История диалога подросла, и харнесс скоро сожмёт контекст. Нужно до этого момента выгрузить накопленные факты во внешний файл, чтобы они не растворились в сжатом пересказе. На какой хук вешается эта функция?
  explanation: '`PreCompact` — единственная точка, гарантированно срабатывающая до сжатия, когда полная история ещё доступна. `SessionEnd` слишком поздно: сжатие происходит по ходу сессии, много раз. `UserPromptSubmit` и `PostToolUse` привязаны к другим событиям и о моменте сжатия ничего не знают.'
  kind: choice
  options:
    - '`SessionEnd`'
    - '`PreCompact`'
    - '`UserPromptSubmit`'
    - '`PostToolUse`'
  correct: 1
  id: 009-huki-spisok-sobytij-2
  fingerprint: 6b20cde0
- concept: хуки жизненного цикла срабатывают в порядке, заданном фазами работы агента, а не порядком их регистрации
  question: 'Сессия агента: старт, пользователь задаёт один вопрос, агент делает один вызов инструмента, затем сессия закрывается. Расставь хуки в порядке срабатывания.'
  explanation: 'Порядок диктуется фазами работы харнесса: подготовка сессии, перехват ввода до показа модели, проверка вызова инструмента, обработка его результата, уборка. Регистрация хуков в коде на порядок не влияет — момент срабатывания задан именем точки, а не строкой конфигурации.'
  kind: order
  items:
    - SessionStart
    - UserPromptSubmit
    - PreToolUse
    - PostToolUse
    - SessionEnd
  id: 009-huki-spisok-sobytij-3
  fingerprint: 0896300d
