- concept: хостируемый вариант отдаёт кэширование промптов и сжатие раздувшейся истории как встроенные механизмы, тогда как при self-hosting их реализует владелец цикла
  question: Назови два механизма экономии контекста и стоимости, которые Claude Managed Agents дают встроенными, и объясни, кто отвечает за них при self-hosted агентном цикле.
  explanation: Оба механизма — работа над историей сообщений между витками цикла. Кто владеет циклом, тот их и реализует. Хостируемый вариант владеет циклом, поэтому отдаёт их готовыми; цена — что настроить их под себя уже нельзя.
  kind: open
  reference: 'Кэширование промптов и сжатие (компакция) контекста при разросшейся истории. В хостируемом варианте оба встроены и включаются сами. При self-hosting за них отвечает владелец цикла: он сам расставляет точки кэширования и сам решает, когда и как резать историю, — обычно через хук перед сжатием и собственную стратегию обрезки.'
  id: 031-managed-agents-2
  fingerprint: 9ec35d5c
- concept: точечное вмешательство в исполнение (собственная политика на вызове инструмента) возможно только при владении циклом, поэтому оно недоступно в хостируемом варианте
  question: Команда требует, чтобы перед каждым вызовом инструмента записи срабатывала их собственная проверка, которая может вернуть отказ по фактическим значениям аргументов. Почему это требование запрещает переход на Claude Managed Agents?
  explanation: 'Собственный отбор инструментов, собственные хуки и «нет» перед исполнением были возможны потому, что цикл был ваш. Отдавая цикл ради управляемой инфраструктуры, вы отдаёте и эти рычаги — выбор идёт не по «что лучше», а по тому, что дороже: возможность вклиниться или гарантия, что прогон доживёт до конца.'
  kind: choice
  options:
    - Потому что такая проверка живёт как точка расширения внутри агентного цикла, а в хостируемом варианте цикл крутится не у вас
    - Потому что хостируемый вариант поддерживает только инструменты чтения
    - Потому что бета-заголовок несовместим с пользовательскими инструментами
    - Потому что отказ на вызове инструмента ломает парность блоков tool_use и результата
