- concept: заглушка проверяет механику харнесса, но принципиально не проверяет качество решений модели
  question: Что НЕЛЬЗЯ проверить прогоном агента на заглушке вместо реальной модели?
  explanation: 'Заглушка проверяет механику: передачу результатов, точки хуков, границы контекста — всё, что определяется кодом харнесса. Качество выбора инструмента, устойчивость к неоднозначным формулировкам и восстановление после ошибки заглушка не проверяет вообще: решения в ней прописаны заранее, а не приняты.'
  kind: choice
  options:
    - Что результат инструмента корректно возвращается в диалог перед следующим шагом
    - Что хуки вызываются до и после исполнения инструмента
    - Что модель выберет подходящий инструмент при неоднозначной формулировке задачи
    - Что контекст оркестратора не растёт на весь объём работы субагента
  correct: 2
  id: 005-zaglushka-modeli-2
  fingerprint: 8a35716a
- concept: вызов модели выделен в подставляемую зависимость, поэтому заглушка и реальный клиент взаимозаменяемы без правки цикла
  question: Заполни пропуск так, чтобы цикл агента можно было запустить и с заглушкой, и с реальным клиентом Anthropic, не меняя ни строки внутри цикла.
  explanation: 'Цикл зависит не от конкретного провайдера, а от контракта ответа: есть запрос инструмента — исполняем и возвращаем результат, нет — отдаём финальный ответ. Пока вызов модели передан как зависимость, заглушка меняется на HTTP-клиент подстановкой аргумента, и код вокруг не знает, кто ему отвечает.'
  kind: cloze
  template: |-
    def run_agent(messages, tools, ___):
        while True:
            reply = ___(messages, tools)
            if not reply.tool_calls:
                return reply
            messages += execute(reply.tool_calls)
