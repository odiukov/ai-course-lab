- concept: трасса наблюдаемости продолжается в подпроцессе CLI за счёт передачи W3C trace context, а не заводится там заново
  question: Агент на Agent SDK запускает CLI-подпроцесс. В системе наблюдаемости прогон виден как два несвязанных дерева спанов вместо одного. Что не сработало?
  explanation: 'Единая трасса через границу процессов держится на стандартных заголовках W3C trace context: родительский спан уезжает в подпроцесс, и спаны CLI цепляются к нему. Без передачи контекста подпроцесс стартует новый корень трассы — отсюда два дерева.'
  kind: choice
  options:
    - Подпроцессу не передан W3C trace context, поэтому его спаны не получили родителя из вызывающего процесса
    - Экспортёр телеметрии не успел отправить спаны до завершения подпроцесса
    - Подпроцесс использует собственный идентификатор сессии, а трассы строятся по ключу сессии
    - Спаны подпроцесса пишутся в зеркальный файл стенограммы, а не в коллектор
  correct: 0
  id: 035-quiz-1
  fingerprint: 75d98ead
- concept: MCP-сервер — внешняя поверхность инструментов и ресурсов, подключаемая к агенту конфигурацией, а не кодом внутри агента
  question: Команде нужно дать трём разным агентам один и тот же набор из 12 операций над внутренним трекером задач. Что даёт подключение этих операций как MCP-сервера?
  explanation: 'MCP — это поверхность инструментов: сервер объявляет инструменты и ресурсы, агенты его подключают. Изоляция контекста — про субагентов, политика — про хуки; MCP не даёт ни того, ни другого, а схемы инструментов уезжают в контекст на каждом обращении к модели.'
  kind: choice
  options:
    - Набор живёт отдельным внешним источником инструментов и ресурсов, а каждый агент подключает его конфигурацией
    - Операции трекера выполняются в контексте субагента, поэтому не тратят окно основного агента
    - Модель получает описания операций один раз при старте, дальше они не попадают в контекст
    - Вызовы операций автоматически проходят проверку политики без написания хуков
  correct: 0
