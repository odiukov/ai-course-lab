- concept: 'цена перехода на Agent SDK — потеря контроля над циклом: вмешаться можно только в точках расширения, которые предусмотрела библиотека'
  question: Переход с Client SDK на Agent SDK резко сокращает объём кода. Чем за это платят? Объясни своими словами.
  explanation: 'Выигрыш Agent SDK — отлаженный цикл вместо сотен строк своей обвязки. Плата — ограниченная кастомизация: доступны только те точки вмешательства, которые заложены авторами библиотеки.'
  kind: open
  reference: 'Цикл перестаёт быть вашим: его пишет и контролирует библиотека. Вмешаться в поведение можно только там, где Agent SDK предусмотрел точку расширения (хуки, конфиг, настройки инструментов). Если нужного места вмешательства нет — остаётся обходной путь или возврат к Client SDK и собственная реализация цикла. То есть выбор между Client SDK и Agent SDK — это не выбор мощности, а выбор того, кто управляет логикой внутри цикла.'
