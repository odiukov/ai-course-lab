- concept: выигрыш от изоляции контекста определяется отношением объёма прочитанного сырья к объёму возвращаемого результата, поэтому задача с большим результатом делегируется впустую
  question: В каком из случаев запуск субагента почти не даёт выигрыша по контексту оркестратора?
  explanation: 'Субагент экономит окно только там, где результат кратно меньше сырья: сырьё сгорает в его окне, наверх идёт сводка. Если результат — сам исходный текст, он всё равно целиком приезжает в контекст оркестратора, и делегирование лишь добавляет накладные расходы на отдельный цикл.'
  kind: choice
  options:
    - «Верни полное содержимое шести файлов по 1 100 строк» — результат по объёму равен прочитанному сырью
    - «В каком из шести конфигов включён debug-режим» — ответ в одну строку
    - «Сколько тестов в каждом из шести модулей» — ответ шесть чисел
    - «Найди функцию, которая пишет в лог без маскировки» — ответ имя функции и файл
