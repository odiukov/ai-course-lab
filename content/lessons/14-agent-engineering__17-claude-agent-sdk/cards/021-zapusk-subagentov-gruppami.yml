- concept: формулировка задачи субагенту должна быть самодостаточной, потому что общая история диалога ему недоступна
  question: Оркестратор десять шагов выяснял, что проект переехал на новую схему конфигов, а затем запускает субагента с задачей «найди устаревший ключ». Субагент возвращает ключ из старой схемы. Объясни своими словами, где ошибка и почему она не чинится ретраем.
  explanation: 'Изоляция контекста работает в обе стороны: она бережёт окно оркестратора, но и лишает субагента всего, что не написано в задаче явно. Цена изоляции — обязанность упаковать необходимый контекст в формулировку.'
  kind: open
  reference: 'Ошибка в постановке задачи. Субагент запускается с пустой историей и получает только текст задачи — всё, что оркестратор выяснил за предыдущие шаги (переезд на новую схему), для субагента не существует. Он не может доспросить контекст и не может опереться на общий диалог, поэтому трактует «устаревший» по-своему. Повторный запуск с той же формулировкой даст тот же результат: чинится это переносом нужного контекста в текст задачи, а не ретраем.'
