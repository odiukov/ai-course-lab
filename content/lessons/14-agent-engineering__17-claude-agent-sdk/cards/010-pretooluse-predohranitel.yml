- concept: 'отказ хука не завершает работу агента: он приходит модели как результат вызова с причиной, и модель на следующем витке пробует другой способ'
  question: Хук перед исполнением инструмента заблокировал вызов `Write` по пути `/etc/passwd`. Объясни своими словами, что происходит с агентом дальше и почему в отказе важно передавать причину текстом.
  explanation: 'Блокировка — не исключение в коде харнесса, а обычный результат вызова инструмента в диалоге. Это делает запрет мягким управляющим сигналом: агент продолжает работу, но в разрешённом коридоре. Практическое следствие — формулировать отказ так, как формулируют сообщение об ошибке для человека: что запрещено и что делать вместо этого.'
  kind: open
  reference: 'Агент не падает и не останавливается: заблокированный вызов возвращается модели как результат этого вызова — с пометкой, что действие не выполнено, и с причиной отказа. Модель читает причину и на следующем витке цикла планирует иначе: пишет во временный каталог, просит подтверждения или сужает действие. Именно поэтому причина отказа — не украшение лога, а вход для модели: без внятного текста модель не понимает, что именно запрещено, и либо повторяет тот же вызов, либо бросает задачу целиком, хотя допустимый путь решения существовал.'
  id: 010-pretooluse-predohranitel-2
  fingerprint: 616ade39
