  question: В агенте 7 инструментов. Где должен вызываться хук проверки, чтобы политику нельзя было обойти?
  explanation: 'Единая точка исполнения — единственное место, которое нельзя пропустить: новый инструмент автоматически попадает под политику. Проверка внутри тел инструментов держится на дисциплине автора, и первый же инструмент, забывший её вызвать, отменяет всю политику. Ограничения в описании модель может проигнорировать — это подсказка, а не запрет.'
