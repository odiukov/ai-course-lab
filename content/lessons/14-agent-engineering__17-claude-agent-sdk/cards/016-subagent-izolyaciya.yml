- concept: в контекст оркестратора попадает только возвращённый результат субагента, а не прочитанное им сырьё
  question: Оркестратор раздаёт задачи 14 субагентам. Каждый субагент, пока ищет ответ, прочитывает в своё окно около 4500 токенов служебного мусора и возвращает оркестратору ответ длиной 45 токенов. Сколько примерно токенов от этой работы осядет в контексте оркестратора?
  explanation: 'У субагента отдельное окно контекста: 14 × 4500 = 63 000 токенов чтения остаются там и до оркестратора не доезжают. Оркестратор получает только 14 ответов по 45 токенов — 630. Именно это и называется изоляцией контекста: бюджет оркестратора расходуется на результаты, а не на путь к ним.'
  kind: numeric
  answer: 630
  tolerance: 5
  id: 016-subagent-izolyaciya-1
  fingerprint: e3783761
- concept: изоляция контекста сохраняет бюджет окна оркестратора, но не уменьшает объём фактически обработанных токенов
  question: Задачу поиска по репозиторию раздали субагентам вместо того, чтобы оркестратор делал её сам. Что при этом НЕ уменьшается?
  explanation: 'Прочитано ровно столько же — просто прочитанное осело в чужих окнах. Изоляция контекста перераспределяет нагрузку, а не сокращает её: экономится один конкретный дефицитный ресурс — окно оркестратора. Ждать от неё снижения общей стоимости обработки неверно.'
  kind: choice
  options:
    - Суммарное количество токенов, прочитанных и обработанных всеми агентами вместе
    - Количество токенов, занятых этой работой в окне оркестратора
    - Риск того, что оркестратор упрётся в предел своего контекстного окна
    - Объём служебного мусора, который видит оркестратор
  correct: 0
  id: 016-subagent-izolyaciya-2
