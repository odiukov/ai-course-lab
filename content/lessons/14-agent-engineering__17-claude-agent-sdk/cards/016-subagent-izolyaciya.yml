- concept: стенограмма субагента достаётся явным вызовом по решению оркестратора, а не приходит в его контекст сама
  question: Субагент вернул подозрительный ответ, и нужно посмотреть, как он к нему шёл. Какой метод Python SDK достаёт стенограмму сообщений конкретного субагента?
  explanation: '`list_subagents()` перечисляет субагентов, `get_subagent_messages()` возвращает их стенограмму. Ключевое здесь — что вызов явный: история субагента попадает в контекст только тогда, когда за ней пришли, иначе изоляция была бы бессмысленной.'
  kind: cloze
  template: |-
    for sub in await client.list_subagents():
        messages = await client.___(sub.id)
  answer: get_subagent_messages
  accept:
    - get_subagent_messages()
    - client.get_subagent_messages
  id: 016-subagent-izolyaciya-3
  fingerprint: 010edd8b
