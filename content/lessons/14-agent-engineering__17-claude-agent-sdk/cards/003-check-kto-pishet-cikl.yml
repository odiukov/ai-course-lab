- concept: Agent SDK — это харнесс Claude Code, вынесенный в библиотеку, поэтому агент наследует готовое поведение продукта, а не нейтральный пустой каркас
  question: Claude Agent SDK описывают как «цикл Claude Code в виде библиотеки». Что практически следует из этой формулировки для разработчика, который строит на нём своего агента?
  explanation: 'Ключевое слово — «Claude Code». Библиотека не собрана абстрактно под любые агенты: это извлечённый харнесс конкретного продукта. Плюс — работающий, отлаженный цикл и его возможности сразу. Минус — вместе с циклом достаются и его умолчания.'
  kind: open
  reference: 'Agent SDK — не нейтральный универсальный каркас, а тот же харнесс, на котором работает продукт Claude Code, отданный как библиотека. Поэтому агент из коробки получает готовые продуктовые решения: набор встроенных инструментов, точки расширения (хуки, MCP, субагенты), хранилище сессий и уже отлаженное поведение цикла. Обратная сторона: разработчик наследует и чужие умолчания вместе с готовым циклом, и подстраивать агента можно только там, где библиотека предусмотрела точку расширения.'
