- concept: 'внутренний порядок каскадного удаления: сначала получить субключи, затем удалить детей, родителя — последним'
  question: Хранилище сессий удаляет сессию вместе с сессиями её субагентов. Расставьте операции в том порядке, в котором их обязана выполнить реализация каскадного delete.
  explanation: 'Список детей достаётся только запросом по родительскому ключу. Сотрёшь родителя первым — спрашивать станет не у кого, и дети останутся в базе. Поэтому родитель уходит последним: он нужен как точка входа к своему поддереву до самого конца операции.'
  kind: order
  items:
    - Запросить у хранилища список субключей удаляемой сессии по её идентификатору
    - Удалить записи всех сессий субагентов из этого списка
    - Удалить запись самой родительской сессии
  id: 027-kaskadnoe-udalenie-1
  fingerprint: 725bdb74
- concept: осиротевшая сессия субагента неудалима постфактум, потому что единственный путь к ней — запрос по родительскому ключу
  question: Разработчик удалил из хранилища только родительскую сессию, а 8 сессий её субагентов остались. Почему их нельзя просто подчистить следующим вызовом?
  explanation: 'Удалить запись технически можно — проблема в адресации. Перечень сессий плоский и не говорит, чей ключ чей; операция «покажи детей» принимает идентификатор родителя. Нет родителя — нет способа собрать эти 8 ключей как группу. Отсюда и требование каскада в момент удаления: позже исправить уже нечем.'
  kind: choice
  options:
    - Записи субагентов помечены только для чтения и не принимают операцию удаления
    - 'Найти их нечем: адресуемы они были запросом субключей по родительскому идентификатору, а родитель уже стёрт'
    - Удаление сессии субагента требует, чтобы её агентный цикл был завершён, а статус завершения хранился у родителя
    - Хранилище считает их активными, пока не истечёт срок жизни записи
  correct: 1
