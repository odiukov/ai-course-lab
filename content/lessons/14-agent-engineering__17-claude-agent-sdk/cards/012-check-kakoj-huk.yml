- concept: Notification — оповещения по побочному каналу, вне ленты диалога агента с моделью
  question: Агент долго работает без человека, и нужно слать сообщения в мессенджер, когда требуется внимание оператора. При этом эти сообщения не должны попадать в диалог с моделью. Какой хук берут?
  explanation: 'Notification существует именно для оповещений по побочному каналу: оно уходит наружу, а не в историю сообщений. Stop и SessionEnd срабатывают только при завершении, PreCompact — перед сжатием контекста.'
