- concept: SessionStart/SessionEnd привязаны к границам сессии, а не к отдельному запросу или вызову инструмента
  question: Объясни своими словами, почему подключение к базе данных логично открывать в SessionStart и закрывать в SessionEnd, а не в PreToolUse и PostToolUse.
  explanation: 'Разные хуки живут в разном масштабе: сессия против одного вызова инструмента. Ресурс, который нужен всей сессии, заводят на её границах.'
  kind: open
  reference: 'SessionStart и SessionEnd срабатывают ровно один раз — на границах сессии, поэтому подходят для подготовки и уборки долгоживущих ресурсов. PreToolUse и PostToolUse срабатывают на каждом вызове инструмента, и открытие/закрытие соединения в них означало бы новое подключение на каждый вызов: лишние накладные расходы и потеря состояния между вызовами. Их назначение другое — пропускать или аудировать конкретные вызовы инструментов.'
  id: 012-check-kakoj-huk-3
