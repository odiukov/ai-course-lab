- concept: 'внутренняя последовательность обёртки вызова инструмента: разрешение имени, решение политики, защищённое исполнение, пост-обработка результата'
  question: Расставь шаги внутри функции, которая исполняет инструмент по имени и аргументам.
  explanation: 'Разрешение имени идёт первым: без найденного инструмента проверять нечего. Вердикт политики — до исполнения, иначе побочный эффект уже произошёл. Перехват исключения на самом вызове держит сбой инструмента внутри обёртки. Post-обработчик стоит между результатом и возвратом, чтобы видеть итог любого исхода.'
  kind: order
  items:
    - Найти инструмент в реестре по имени и, если его там нет, вернуть результат со статусом ошибки
    - 'Передать имя и аргументы в pre-обработчик и получить вердикт: разрешено или запрещено'
    - Исполнить инструмент, перехватывая исключение и превращая его в результат со статусом ошибки
    - Передать полученный результат в post-обработчик
    - Вернуть результат вызывающей стороне
