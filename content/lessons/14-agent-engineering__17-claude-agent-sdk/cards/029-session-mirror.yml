- concept: зеркалирование включается флагом запуска CLI и не требует изменений в коде агента или в реализации хранилища
  question: Команда хочет получать стенограмму прогона в отдельном файле для отладки. Что для этого нужно изменить?
  explanation: '`--session-mirror` — флаг CLI, а не элемент протокола стора (append/load/list_sessions/delete/list_subkeys). Поток не отклоняется и не переписывается, ему добавляется второй адресат, поэтому поведение агента и набор методов хранилища остаются прежними.'
  kind: choice
  options:
    - 'Ничего в коде: достаточно передать соответствующий флаг при запуске CLI'
    - Реализовать в хранилище сессий дополнительный метод записи в файл
    - Обернуть каждый вызов инструмента хуком, который дописывает событие в файл
    - Переопределить load(session_id), чтобы он писал результат на диск
  correct: 0
