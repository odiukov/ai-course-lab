- concept: 'агентный цикл харнесса: ответ модели с запросом инструмента, исполнение, возврат результата в диалог, повторный вызов модели'
  question: Агент на харнессе решает задачу с использованием инструментов. Расставь один виток цикла в правильном порядке.
  explanation: Харнесс — это цикл вокруг модели, а не улучшение самой модели. Модель умеет только сформулировать намерение вызвать инструмент; исполнение, укладка результата обратно в контекст и повторный вызов — работа обвязки. Цикл крутится, пока модель не вернёт ответ без запроса инструментов.
  kind: order
  items:
    - Модель возвращает ответ, содержащий запрос на вызов инструмента с аргументами
    - Харнесс перехватывает запрос и сам исполняет инструмент (читает файл, запускает команду)
    - Харнесс дописывает результат исполнения в историю сообщений как результат вызова инструмента
    - Харнесс снова вызывает модель с обновлённой историей и проверяет, нужен ли следующий инструмент
  id: 001-syroe-api-odin-zvonok-1
  fingerprint: ef0442cb
- concept: сырой Messages API возвращает намерение вызвать инструмент, но не исполняет его — исполнение целиком на вызывающей стороне
  question: Разработчик шлёт запрос в сырой Messages API, передав описание инструмента read_file. Модель отвечает блоком tool_use с именем read_file и путём. Что произошло к этому моменту?
  explanation: Один вызов API = один запрос и один ответ. tool_use — это описание того, что модель хочет сделать, а не факт исполнения. Пока цикл исполнения пишешь ты сам, ты и есть харнесс — только руками.
  kind: choice
  options:
    - Файл уже прочитан на стороне API, содержимое лежит в ответе
    - API вернул только намерение вызвать инструмент; ничего не исполнено, читать файл и слать результат обратно должна вызывающая сторона
    - API поставил вызов в очередь и исполнит его при следующем запросе
    - Модель не может вернуть tool_use без подключённого MCP-сервера
  correct: 1
  id: 001-syroe-api-odin-zvonok-2
  fingerprint: 6fcc2a1d
- concept: 'хранение сессии как отдельная функция харнесса: состояние переживает завершение процесса, в отличие от контекстного окна одного запроса'
  question: 'Своими словами: зачем харнессу отдельное хранилище сессий, если история диалога и так собирается в массиве сообщений внутри одного запуска?'
  explanation: 'Сохранение сессий — одна из вещей, которых сырое API не даёт вообще: оно stateless, всю историю ты передаёшь заново каждым запросом. Agent SDK отдаёт хранилище сессий готовым, рядом с исполнением инструментов, MCP, хуками и субагентами.'
  kind: open
  reference: 'Массив сообщений живёт только в памяти процесса: перезапуск, падение или новый день — и состояние обнулено, всё придётся собирать заново. Хранилище сессий сохраняет историю и состояние агента вне процесса, чтобы разговор можно было возобновить позже с той же точки, а не начинать с нуля. Плюс это даёт общую точку для трассировки и разбора того, что агент делал раньше. Это ортогонально размеру контекстного окна: окно ограничивает, сколько влезет в один вызов, а хранилище отвечает за то, переживёт ли состояние конец процесса.'
  id: 001-syroe-api-odin-zvonok-3
  fingerprint: 547041a1
