- concept: 'модель узнаёт об инструменте только из его схемы: имя, описание, типы и обязательность аргументов'
  question: Разработчик добавил в агента рабочую функцию чтения файла и передал её в конфиг, но модель ни разу её не вызвала. Что упущено с наибольшей вероятностью?
  explanation: 'Модель не видит тело функции — она видит только её описание в списке доступных инструментов. Без схемы (имя, что делает, какие аргументы и какого типа, что обязательно) инструмента для модели просто не существует. Схема — это подпись на ящике: по ней понятно, что внутри и как пользоваться, не открывая.'
  kind: choice
  options:
    - Схема инструмента — имя, описание назначения, типы аргументов и указание, какие обязательны
    - Функцию нужно было сделать асинхронной, иначе харнесс её не вызывает
    - Модель вызывает инструменты только после явной просьбы пользователя в промпте
    - Нужно было увеличить лимит токенов ответа
  correct: 0
  id: 004-vstroennye-instrumenty-1
  fingerprint: fd7be493
- concept: сбой внутри инструмента возвращается модели как текстовый результат вызова, а не выбрасывается исключением в агентный цикл
  question: Инструмент чтения файла получил путь, которого нет на диске, а в другой раз — путь к каталогу. Объясни своими словами, что должно произойти в обоих случаях и почему нельзя просто дать исключению подняться наверх.
  explanation: 'Граничные случаи — основная часть стоимости инструмента. Ошибка для агента не аварийная ситуация, а информация: она должна попасть в диалог как результат вызова, чтобы модель на следующем шаге приняла другое решение. Именно эта обвязка и превращает «функцию на пару строк» в полсотни.'
  kind: open
  reference: 'Инструмент обязан поймать ошибку и вернуть её модели как обычный результат вызова — понятным текстом («файл не найден», «путь указывает на каталог»). Тогда модель видит проблему в диалоге и может исправиться: уточнить путь, сделать листинг каталога, спросить пользователя. Если исключение поднимется наверх, оно уронит агентный цикл: сессия прервётся, а модель даже не узнает, что именно пошло не так. Сюда же относятся неверная кодировка и слишком большой файл — последний нельзя отдавать целиком, иначе один результат забьёт контекст.'
  id: 004-vstroennye-instrumenty-2
  fingerprint: bdd74c24
- concept: свои инструменты подключаются через тот же интерфейс схемы, что и встроенные, поэтому для модели они неотличимы
  question: В агента на Agent SDK добавили самописный инструмент запроса к внутреннему трекеру задач. Чем он будет отличаться для модели от встроенных grep или glob?
  explanation: 'Встроенные инструменты не привилегированы: они описаны той же схемой, что и любой пользовательский. Модель видит единый список, где самописный трекер выглядит ровно как read_file. Готовыми идут те десять, что всё равно написал бы первыми — чтение и запись файлов, шелл, grep, glob, загрузка веб-страниц; остальное добавляешь тем же способом.'
  kind: choice
  options:
    - 'Ничем: он объявляется через тот же интерфейс схемы и попадает в тот же список доступных инструментов'
    - Модель обращается к нему только после того, как перебрала все встроенные
    - Самописные инструменты доступны модели лишь в отдельном режиме, вне обычного цикла
    - Он требует собственного канала вызова в обход результатов tool_use
  correct: 0
