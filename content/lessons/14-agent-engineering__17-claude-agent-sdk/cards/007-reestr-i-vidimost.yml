- concept: реестр инструментов уезжает в контекст при каждом обращении к модели, поэтому его стоимость умножается на число шагов цикла независимо от того, вызывались инструменты или нет
  question: В агенте зарегистрировано 18 инструментов, карточка каждого (имя, описание, схема) занимает в среднем 140 токенов. За одну задачу агентный цикл обращается к модели 7 раз. Сколько входных токенов суммарно потрачено на реестр за эту задачу?
  explanation: 18 × 140 = 2520 токенов реестра в одном запросе. Реестр собирается заново и едет в контексте при каждом обращении к модели, поэтому 2520 × 7 = 17640. Платится это даже за те шаги, где модель отвечает текстом и не зовёт ни одного инструмента — отсюда правило держать набор инструментов узким.
  kind: numeric
  answer: 17640
  tolerance: 1
