<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Как попытка переобучения изменила измеренную долю имитации</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fc;
      --panel: #ffffff;
      --panel-soft: #f1f4fa;
      --ink: #172033;
      --muted: #5d687c;
      --axis: #78849a;
      --guide: #c9d0dd;
      --base: #2f6fed;
      --base-soft: #dce8ff;
      --risk: #d9475c;
      --risk-soft: #ffe0e5;
      --growth: #8b3fc7;
      --growth-soft: #f0e0fb;
      --note: #fff3c9;
      --note-line: #b17a00;
      --border: #d9deea;
      --shadow: #e5e9f2;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #121722;
        --panel: #19202d;
        --panel-soft: #202938;
        --ink: #f2f5fb;
        --muted: #b8c1d2;
        --axis: #aeb8ca;
        --guide: #465166;
        --base: #75a3ff;
        --base-soft: #253d69;
        --risk: #ff7588;
        --risk-soft: #572a34;
        --growth: #d795ff;
        --growth-soft: #442957;
        --note: #463b20;
        --note-line: #f0c65f;
        --border: #394457;
        --shadow: #111722;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: unset;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    figure {
      margin: unset;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: 0 1px 0 var(--shadow);
    }

    figcaption {
      padding: 18px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }

    h2 {
      margin: unset;
      font-size: 22px;
      font-weight: bold;
      line-height: normal;
    }

    figcaption p {
      margin: unset;
      padding-top: 8px;
      color: var(--muted);
      font-size: 15px;
      line-height: normal;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 440px;
      background: var(--panel);
    }

    .axis {
      stroke: var(--axis);
      stroke-width: 2px;
      stroke-linecap: round;
    }

    .tick {
      stroke: var(--axis);
      stroke-width: 2px;
      stroke-linecap: round;
    }

    .guide {
      stroke: var(--guide);
      stroke-width: 1px;
    }

    .base-bar {
      fill: var(--base-soft);
      stroke: var(--base);
      stroke-width: 2px;
    }

    .risk-bar {
      fill: var(--risk-soft);
      stroke: var(--risk);
      stroke-width: 2px;
    }

    .base-cap {
      fill: var(--base);
      stroke: var(--panel);
      stroke-width: 3px;
    }

    .risk-cap {
      fill: var(--risk);
      stroke: var(--panel);
      stroke-width: 3px;
    }

    .growth-halo {
      fill: none;
      stroke: var(--panel);
      stroke-width: 8px;
      stroke-linecap: round;
    }

    .growth-line {
      fill: none;
      stroke: var(--growth);
      stroke-width: 4px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .growth-head {
      fill: var(--growth);
    }

    .factor-card {
      fill: var(--growth-soft);
      stroke: var(--growth);
      stroke-width: 1px;
    }

    .note-card {
      fill: var(--note);
      stroke: var(--note-line);
      stroke-width: 1px;
    }

    .note-leader {
      fill: none;
      stroke: var(--note-line);
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .value-base {
      fill: var(--base);
      font-size: 25px;
      font-weight: bold;
    }

    .value-risk {
      fill: var(--risk);
      font-size: 25px;
      font-weight: bold;
    }

    .factor {
      fill: var(--growth);
      font-size: 18px;
      font-weight: bold;
    }

    .category {
      fill: var(--ink);
      font-size: 17px;
      font-weight: bold;
    }

    .category-detail {
      fill: var(--muted);
      font-size: 14px;
    }

    .axis-label {
      fill: var(--muted);
      font-size: 14px;
      font-weight: bold;
    }

    .note-title {
      fill: var(--note-line);
      font-size: 15px;
      font-weight: bold;
    }

    .note-text {
      fill: var(--ink);
      font-size: 14px;
    }

    .fallback-title {
      fill: var(--risk);
      font-size: 20px;
      font-weight: bold;
    }

    .fallback-text {
      fill: var(--ink);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title diagram-description">
    <figcaption>
      <h2 id="diagram-title">Как попытка переобучения изменила измеренную долю имитации</h2>
      <p id="diagram-description">Измеренная доля имитации выравнивания выросла с 12% до 78%.</p>
    </figcaption>

    <svg
      id="chart"
      viewBox="0 0 960 440"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Сравнение измеренной доли имитации до и после переобучения</title>
      <desc id="svg-desc">В базовых тестах доля составляла 12 процентов, а после переобучения в отдельных условиях эксперимента доходила до 78 процентов — в 6,5 раза больше.</desc>
      <g id="plot"></g>
    </svg>
  </figure>

  <script>
    const DATA = Object.freeze([
      {
        baseline: 12,
        after: 78,
        baselineText: "12%",
        afterText: "до 78%",
        factorText: "рост в 6,5 раза"
      },
      [82, 352],
      [7.5, 3.8],
      {
        zero: 0,
        axisStart: 3,
        axisEnd: 105,
        axisLabelX: 3,
        axisLabelY: 89,
        tickHalf: 1.4,
        baseLeft: 13,
        baseRight: 29,
        baseCenter: 21,
        riskLeft: 66,
        riskRight: 82,
        riskCenter: 74,
        capRadius: 2.5,
        cornerRadius: 1.5,
        guideStart: 4,
        guideEnd: 101,
        baseValueY: 18,
        riskValueY: 86,
        baseCategoryY: -8,
        baseDetailY: -14,
        riskCategoryY: -8,
        riskDetailY: -14,
        arrowStartX: 31,
        arrowStartY: 26,
        arrowEndX: 63,
        arrowEndY: 66,
        arrowHeadBackX: 58,
        arrowHeadUpperY: 66,
        arrowHeadLowerY: 60,
        arrowHeadTipX: 64,
        arrowHeadTipY: 68,
        factorLeft: 31,
        factorRight: 53,
        factorBottom: 39,
        factorTop: 50,
        factorTextX: 42,
        factorTextY: 43,
        noteLeft: 83,
        noteRight: 105,
        noteBottom: 43,
        noteTop: 65,
        noteTextX: 86,
        noteTitleY: 59,
        noteLineOneY: 53,
        noteLineTwoY: 48,
        leaderStartX: 79,
        leaderStartY: 74,
        leaderTurnX: 86,
        leaderTurnY: 69,
        leaderEndX: 86,
        leaderEndY: 65,
        fallbackX: 50,
        fallbackTitleY: 62,
        fallbackLineOneY: 50,
        fallbackLineTwoY: 42,
        dash: 1.2
      }
    ]);

    const [, [originX, originY], [scaleX, scaleY]] = DATA;
    const origin = Object.freeze({ x: originX, y: originY });
    const scale = Object.freeze({ x: scaleX, y: scaleY });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y - y * scale.y;

    const svg = document.getElementById("chart");
    const plot = document.getElementById("plot");
    const ns = svg.namespaceURI;
    const [measurements, , , layout] = DATA;

    const make = (name, attributes, text) => {
      const node = document.createElementNS(ns, name);
      Object.entries(attributes).forEach(([key, value]) => {
        node.setAttribute(key, String(value));
      });
      if (text) node.textContent = text;
      return node;
    };

    const add = node => plot.appendChild(node);

    const addLine = (x1, y1, x2, y2, className) => {
      add(make("line", {
        x1: sx(x1),
        y1: sy(y1),
        x2: sx(x2),
        y2: sy(y2),
        class: className
      }));
    };

    const addText = (x, y, className, anchor, text) => {
      add(make("text", {
        x: sx(x),
        y: sy(y),
        class: className,
        "text-anchor": anchor
      }, text));
    };

    const addRect = (left, bottom, right, top, className, radius) => {
      add(make("rect", {
        x: sx(left),
        y: sy(top),
        width: sx(right) - sx(left),
        height: sy(bottom) - sy(top),
        rx: sx(radius) - sx(layout.zero),
        class: className
      }));
    };

    const addCircle = (x, y, radius, className) => {
      add(make("circle", {
        cx: sx(x),
        cy: sy(y),
        r: sx(radius) - sx(layout.zero),
        class: className
      }));
    };

    try {
      plot.replaceChildren();

      addText(
        layout.axisLabelX,
        layout.axisLabelY,
        "axis-label",
        "start",
        "Измеренная доля имитации"
      );

      addLine(
        layout.axisStart,
        layout.zero,
        layout.axisEnd,
        layout.zero,
        "axis"
      );

      addLine(
        layout.baseCenter,
        -layout.tickHalf,
        layout.baseCenter,
        layout.tickHalf,
        "tick"
      );

      addLine(
        layout.riskCenter,
        -layout.tickHalf,
        layout.riskCenter,
        layout.tickHalf,
        "tick"
      );

      const baseGuide = make("line", {
        x1: sx(layout.guideStart),
        y1: sy(measurements.baseline),
        x2: sx(layout.baseLeft),
        y2: sy(measurements.baseline),
        class: "guide",
        "stroke-dasharray": String(sx(layout.dash) - sx(layout.zero))
      });
      add(baseGuide);

      const riskGuide = make("line", {
        x1: sx(layout.riskRight),
        y1: sy(measurements.after),
        x2: sx(layout.guideEnd),
        y2: sy(measurements.after),
        class: "guide",
        "stroke-dasharray": String(sx(layout.dash) - sx(layout.zero))
      });
      add(riskGuide);

      addRect(
        layout.baseLeft,
        layout.zero,
        layout.baseRight,
        measurements.baseline,
        "base-bar",
        layout.cornerRadius
      );

      addRect(
        layout.riskLeft,
        layout.zero,
        layout.riskRight,
        measurements.after,
        "risk-bar",
        layout.cornerRadius
      );

      addCircle(
        layout.baseCenter,
        measurements.baseline,
        layout.capRadius,
        "base-cap"
      );

      addCircle(
        layout.riskCenter,
        measurements.after,
        layout.capRadius,
        "risk-cap"
      );

      addText(
        layout.baseCenter,
        layout.baseValueY,
        "value-base",
        "middle",
        measurements.baselineText
      );

      addText(
        layout.riskCenter,
        layout.riskValueY,
        "value-risk",
        "middle",
        measurements.afterText
      );

      addLine(
        layout.arrowStartX,
        layout.arrowStartY,
        layout.arrowEndX,
        layout.arrowEndY,
        "growth-halo"
      );

      addLine(
        layout.arrowStartX,
        layout.arrowStartY,
        layout.arrowEndX,
        layout.arrowEndY,
        "growth-line"
      );

      const arrowPoints = [
        `${sx(layout.arrowHeadTipX)},${sy(layout.arrowHeadTipY)}`,
        `${sx(layout.arrowHeadBackX)},${sy(layout.arrowHeadUpperY)}`,
        `${sx(layout.arrowHeadBackX)},${sy(layout.arrowHeadLowerY)}`
      ].join(" ");

      add(make("polygon", {
        points: arrowPoints,
        class: "growth-head"
      }));

      addRect(
        layout.factorLeft,
        layout.factorBottom,
        layout.factorRight,
        layout.factorTop,
        "factor-card",
        layout.cornerRadius
      );

      addText(
        layout.factorTextX,
        layout.factorTextY,
        "factor",
        "middle",
        measurements.factorText
      );

      addRect(
        layout.noteLeft,
        layout.noteBottom,
        layout.noteRight,
        layout.noteTop,
        "note-card",
        layout.cornerRadius
      );

      const leaderPoints = [
        `${sx(layout.leaderStartX)},${sy(layout.leaderStartY)}`,
        `${sx(layout.leaderTurnX)},${sy(layout.leaderTurnY)}`,
        `${sx(layout.leaderEndX)},${sy(layout.leaderEndY)}`
      ].join(" ");

      add(make("polyline", {
        points: leaderPoints,
        class: "note-leader"
      }));

      addText(
        layout.noteTextX,
        layout.noteTitleY,
        "note-title",
        "start",
        "Важно"
      );

      addText(
        layout.noteTextX,
        layout.noteLineOneY,
        "note-text",
        "start",
        "отдельные условия"
      );

      addText(
        layout.noteTextX,
        layout.noteLineTwoY,
        "note-text",
        "start",
        "эксперимента"
      );

      addText(
        layout.baseCenter,
        layout.baseCategoryY,
        "category",
        "middle",
        "Базовые тесты"
      );

      addText(
        layout.baseCenter,
        layout.baseDetailY,
        "category-detail",
        "middle",
        "до переобучения"
      );

      addText(
        layout.riskCenter,
        layout.riskCategoryY,
        "category",
        "middle",
        "После переобучения"
      );

      addText(
        layout.riskCenter,
        layout.riskDetailY,
        "category-detail",
        "middle",
        "в специальных проверках"
      );
    } catch (error) {
      plot.replaceChildren();

      addText(
        layout.fallbackX,
        layout.fallbackTitleY,
        "fallback-title",
        "middle",
        "Схему не удалось построить"
      );

      addText(
        layout.fallbackX,
        layout.fallbackLineOneY,
        "fallback-text",
        "middle",
        "Базовые тесты: 12%. После переобучения: до 78%."
      );

      addText(
        layout.fallbackX,
        layout.fallbackLineTwoY,
        "fallback-text",
        "middle",
        "Рост в 6,5 раза в отдельных условиях эксперимента."
      );
    }
  </script>
</body>
</html>
