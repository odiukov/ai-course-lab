- concept: устойчивость оценки доли растёт с числом независимых прогонов
  question: Почему оценку доли пробивших порог траекторий считают по большому числу независимых прогонов, а не по нескольким?
  explanation: 'Это обычная статистическая точность оценки частоты: 3 прогона из 3 с пробитием и 730 из 1000 говорят о риске совсем с разной уверенностью, хотя доли близки.'
  kind: open
  reference: Каждый прогон — одна случайная реализация; при малом числе прогонов доля сильно скачет от одной удачной или неудачной серии шумов. С ростом числа независимых запусков наблюдаемая доля стабилизируется вокруг частоты, задаваемой параметрами модели, и меньше зависит от конкретного розыгрыша шума.
