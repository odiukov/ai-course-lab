- concept: оценённая доля пробитий условна на конкретной постановке (скорости, шум, порог, длина прогона), а не универсальная вероятность
  question: Множество независимых прогонов длиной 30 циклов дало долю пробитий порога 12%. Что означает это число?
  explanation: 'Доля привязана к постановке: смените порог, уровень шума или длину прогона — получите другое число. Это оценка частоты внутри модели, а не предсказание про реальные системы.'
  kind: choice
  options:
