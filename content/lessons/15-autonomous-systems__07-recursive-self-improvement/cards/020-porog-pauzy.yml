- concept: мониторинг метрики без заранее связанного с ней действия не останавливает замкнутый цикл
  question: Чем стоп-порог отличается от простого мониторинга метрики рассогласования в замкнутом цикле самоулучшения? Объясни своими словами.
  explanation: 'В автономном цикле информация без предписанного действия ничего не меняет: следующий виток запускается без участия наблюдателя. Порог — это ремень безопасности процесса, а не приборная панель.'
  kind: open
  reference: 'Мониторинг только сообщает значение: цикл при этом сам передаёт управление следующей версии и продолжается, а сообщения «стало хуже» ни к чему не обязывают. Порог заранее связывает непрерывную величину с бинарным действием: при достижении границы цикл ставится на паузу для проверки, а не продолжается. Разница не в качестве измерения, а в том, что за измерением закреплено обязательное действие.'
