- concept: порог — правило остановки, а не утверждение о безопасности значений ниже него
  question: Стоп-порог по разрыву рассогласования равен 1,5. Очередной виток дал значение 1,4. Что корректно заключить?
  explanation: 'Порог задаёт только момент обязательной паузы. Он не делит шкалу на «безопасно» и «опасно»: 1,4 — это непройденное условие остановки, а не сертификат выравнивания.'
  kind: choice
  options:
    - Система доказано безопасна, поскольку значение ниже порога
    - Правило остановки не сработало; про безопасность самого значения 1,4 порог ничего не утверждает
    - Порог выбран неверно, раз значение так близко к нему
