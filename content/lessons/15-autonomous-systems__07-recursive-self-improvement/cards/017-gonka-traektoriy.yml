- concept: отношение двух геометрических цепочек равно (r_c/r_a)^n и растёт неограниченно при любом устойчивом превосходстве скорости
  question: Способности растут с множителем 1,05 за цикл, выравнивание — с 1,02. Что происходит с отношением C/A по мере роста числа циклов?
  explanation: C_n/A_n = (r_c/r_a)^n. Любое устойчивое r_c > r_a даёт основание больше 1, и степень уводит отношение вверх без предела. Малость разницы влияет только на то, сколько витков потребуется, а не на исход.
  kind: choice
  options:
    - Оно стремится к постоянной величине, потому что разница множителей мала и фиксирована.
    - Оно растёт как (1,05/1,02) в степени числа циклов и неограниченно увеличивается.
    - Оно колеблется вокруг единицы, пока не вмешается шум.
    - Оно убывает, поскольку меньший множитель даёт больший относительный прирост.
  correct: 1
