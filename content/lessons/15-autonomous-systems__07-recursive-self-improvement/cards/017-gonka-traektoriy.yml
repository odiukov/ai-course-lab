- concept: меры удержания выравнивания (проверки на каждом цикле, кросс-модельный аудит, внешняя оценка, жёсткие пороги остановки) снижают риск, но ни одна не доказана достаточной
  question: Какой статус имеют предлагаемые механизмы удержания выравнивания в пайплайне самоулучшения — эмпирические проверки на каждом цикле, аудит другой моделью, внешняя оценка, жёсткие пороги остановки цикла?
  explanation: 'Это ремни безопасности, а не подушка: каждый уменьшает вероятность беды, ни один её не отменяет. Разнесение по разным уровням — внутрицикловые проверки, аудит другой моделью, внешний оценщик, стоп-порог — нужно, чтобы одна точка отказа не снимала всю защиту.'
  kind: choice
  options:
    - Каждый из них доказанно гарантирует, что выравнивание не отстанет от способностей.
    - Все они — разумные меры снижения риска, ни одна не доказана достаточной, поэтому их разносят по разным местам стека.
    - Достаточно любого одного, остальные избыточны и только замедляют цикл.
    - Они бесполезны, поскольку разрыв растёт по математике сложного процента.
