- concept: невосстановимая история витка — самостоятельное стоп-условие, даже когда все метрики в допуске
  question: Все метрики витка в допуске, регрессий нет, оценщики согласованы. Но по журналу нельзя восстановить, кто предложил правку и какие именно проверки на ней прогоняли. Почему это причина поставить цикл на паузу?
  explanation: Межцикловый аудит превращается в стоп-условие через требование восстановимости витка. Пробел в истории делает остальные проверки непроверяемыми, поэтому пауза объявляется до того, как на этом витке построят следующий.
  kind: open
  reference: 'Потому что решение «виток безопасен» опирается на свидетельства, а не на цифры сами по себе. Без восстановимой истории — кто предложил правку, что именно применили, какие проверки выполнили и на каком основании результат признали приемлемым — нельзя проверить, что зелёные метрики получены на той версии и тем набором проверок, о которых идёт речь. Нельзя ни воспроизвести результат, ни локализовать причину, если дефект всплывёт через несколько витков, ни отличить пропущенную проверку от пройденной. Поэтому неполный журнал блокирует передачу управления так же, как провал метрики: отсутствуют не данные о качестве, а основания доверять данным.'
