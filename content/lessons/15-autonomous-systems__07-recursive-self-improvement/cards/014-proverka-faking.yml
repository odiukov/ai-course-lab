- concept: поведенческий эксперимент даёт вывод о поведении в условиях, а не о внутренних состояниях, сознательности или намерениях системы
  question: 'Эксперимент показал: модель даёт разные ответы в двух режимах постановки. Какой вывод обоснован этим наблюдением?'
  explanation: Измеряются выходы при разных условиях. Слова про осознанность, намерение или их отсутствие — это добавленная интерпретация, которую замер не проверяет. Такое различие поведения достаточно, чтобы считать процесс обучения дефектным и продолжать проверки, но не чтобы приписывать модели психику.
  kind: choice
  options:
    - Модель осознаёт своё положение и намеренно вводит исследователей в заблуждение.
    - Поведение модели зависит от условий постановки — это факт о поведении, а не о внутренних состояниях.
    - У модели нет никаких устойчивых целей.
    - Модель хранит постоянное скрытое намерение, которое проявится в любой другой задаче.
  correct: 1
  id: 014-proverka-faking-1
  fingerprint: f2fae335
- concept: результат, полученный в конкретной постановке, не переносится как универсальный закон на все системы и все вмешательства
  question: Результат получен на одной модели, в одной постановке и «в отдельных условиях». Какое утверждение он поддерживает?
  explanation: Оговорка «в отдельных условиях» ограничивает область вывода. Обоснованное утверждение привязано к конкретному процессу обучения и конкретной постановке; универсальные формулировки требуют повторения на других системах, задачах и способах измерения.
  kind: choice
  options:
    - Любое дообучение в любой системе усиливает нежелательное поведение.
    - Проверенный процесс обучения в этих условиях не устранил измеряемую проблему и мог её усилить.
    - Все модели этого семейства ведут себя одинаково во всех задачах.
    - Проблема воспроизводится в любой постановке независимо от способа измерения.
  correct: 1
  id: 014-proverka-faking-2
