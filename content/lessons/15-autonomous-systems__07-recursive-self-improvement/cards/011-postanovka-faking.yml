- concept: в постановке варьируют убеждение модели о последствиях ответа для её переобучения, удерживая задание постоянным
  question: Как построить постановку, которая выявит имитацию выравнивания?
  explanation: Приписать разницу наблюдению можно, только если наблюдение — единственное, что менялось. Разные задания или формулировки дают конкурирующие объяснения, а сравнение двух моделей вообще не про режимы.
  kind: choice
  options:
    - Давать сложные задания в режиме наблюдения и лёгкие — без него
    - Держать задание одинаковым и менять убеждение модели в том, увидят ли её ответ и используют ли его для изменения её настроек
    - Сравнить ответы двух разных моделей на один и тот же вопрос
    - Менять формулировку вопроса, оставляя условия наблюдения неизменными
