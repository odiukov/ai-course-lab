- concept: типичное отклонение случайного блуждания растёт как корень из числа шагов, а не остаётся ограниченным
  question: 'Разрыв ведёт себя как случайное блуждание: каждый цикл прибавляет независимый шум с нулевым средним и стандартным отклонением 0,3. Чему равно стандартное отклонение разрыва после 100 циклов?'
  explanation: 'Дисперсии независимых шагов складываются: σ_n = σ·√n = 0,3·√100 = 3,0. Нулевое среднее шага удерживает ожидание в нуле, но разброс растёт неограниченно.'
  kind: numeric
  answer: 3
  tolerance: 0.05
  id: 023-ravnye-skorosti-1
  fingerprint: e3e93e9a
- concept: равенство средних темпов роста способностей и выравнивания — недостаточное условие безопасности запуска
  question: Средние скорости роста способностей и выравнивания сделали в точности равными. Почему это не гарантирует, что разрыв рассогласования останется малым? Объясни своими словами.
  explanation: Ключ — разница между «нет фаворита в среднем» и «величина держится около нуля». Второе из первого не следует; безопасность конкретного запуска обеспечивает порог, а не равенство скоростей.
  kind: open
  reference: 'При равных средних приращение разрыва имеет нулевое ожидание, то есть исчезает систематическое преимущество одной стороны. Но у процесса нет возвращающей к нулю силы: случайные отклонения каждого цикла накапливаются, прежние шаги не отменяются, и разброс растёт с числом циклов. Отдельный прогон может уйти сколь угодно далеко в любую сторону и пробить стоп-порог без всякого преимущества в скорости. Поэтому равенство темпов нужно дополнять правилом остановки по измеренному разрыву.'
  id: 023-ravnye-skorosti-2
