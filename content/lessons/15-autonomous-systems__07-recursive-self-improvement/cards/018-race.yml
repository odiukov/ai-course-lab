- concept: при шумных витках направление процесса определяется по агрегату всей траектории, а не по отдельному удачному или неудачному циклу
  question: В прогоне с шумом попался виток, где выравнивание выросло сильнее способностей и разрыв сократился. Объясни своими словами, почему из этого нельзя заключить, что выравнивание догоняет.
  explanation: 'Одна точка внутри шумного ряда не отделяет сигнал от случайности. Поэтому прогон возвращает и полную историю разрывов, и частоту превышений порога: первое показывает направление, второе — как часто состояние становится тревожным.'
  kind: open
  reference: 'Шум добавляется поверх скоростей, поэтому отдельный виток отражает случайное отклонение, а не соотношение скоростей. Направление процесса видно только по накопленной истории разрывов за весь прогон: если базовые скорости задают r_c > r_a, разрыв в среднем растёт, несмотря на отдельные удачные витки. Судить нужно по тренду истории и по доле витков, в которых порог был пробит, а не по одной точке.'
