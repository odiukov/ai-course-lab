- concept: доля тревожных витков — это отношение числа витков с превышением порога к общему числу витков, а не факт хотя бы одного превышения
  question: Прогон длится 40 циклов. Разрыв оказался выше порога в 14 из них. Чему равна доля превышений?
  explanation: 14 / 40 = 0,35. Вопрос «превышался ли порог когда-нибудь» дал бы «да» и при одном витке из сорока; доля отвечает на другой вопрос — как часто дежурному пришлось бы жать стоп.
  kind: numeric
  answer: 0.35
  tolerance: 0.005
