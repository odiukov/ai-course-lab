- concept: виток даёт следующую версию цепочки только при приросте на целевой метрике; изменение без прироста версией не становится
  question: Система S_7 предложила правку и применила её к себе; получившийся вариант проходит все тесты, но на целевой метрике набирает столько же, сколько S_7. Считается ли этот вариант версией S_8 в цепочке самоулучшения? Объясни своими словами.
  explanation: Витки цепочки считаются не по числу применённых правок, а по числу версий, доказавших превосходство на целевой метрике. Иначе любая перестановка кода наращивала бы номер версии, и разговор про 'улучшение' терял бы смысл.
  kind: open
  reference: 'Нет. Один цикл самоулучшения определён так: из системы S_n получить S_{n+1}, которая ЛУЧШЕ набирает на целевой метрике. Работоспособность и прохождение тестов — не критерий; критерий — измеренный прирост на той метрике, ради которой идёт цикл (качество на задачах для Capability RSI, качество выравнивания для Alignment RSI). Вариант без прироста — просто изменение системы, роль действующей версии остаётся у S_7, и цепочка на этом витке не продвинулась.'
  id: 004-tsepochka-versiy-2
  fingerprint: c57d4433
