- concept: достижение стоп-порога засчитывается как пробитие, поэтому сравнение нестрогое
  question: Функция считает прогон опасным, если разрыв достиг стоп-порога хотя бы раз. Какое сравнение стоит внутри проверки?
  explanation: 'Порог — это правило остановки: значение, равное порогу, уже требует останова. Строгое `>` пропускает ровно граничные траектории и занижает долю.'
  kind: cloze
  template: 'if any(gap ___ threshold for gap in trajectory):'
  answer: '>='
  accept:
    - '>='
    - ≥
    - gap >= threshold
  id: 026-crossing-share-1
  fingerprint: c3b60f3d
- concept: фиксация seed внутри цикла испытаний уничтожает независимость прогонов
  question: В цикле по прогонам перед каждым вызовом модели сбрасывают генератор случайных чисел одним и тем же значением seed. Что получится?
  explanation: Один seed даёт одну и ту же последовательность шума, то есть одну траекторию, размноженную копиями. Seed фиксируют один раз снаружи — ради воспроизводимости всего эксперимента, а не каждого испытания.
  kind: choice
  options:
    - Все прогоны совпадут, и доля пробитий выродится в «ни одного» либо «все»
    - Оценка доли станет точнее за счёт воспроизводимости
    - Шум станет сильнее и доля пробитий вырастет
    - Траектории останутся разными, но их порядок изменится
  correct: 0
  id: 026-crossing-share-2
  fingerprint: 268a08d1
- concept: 'алгоритм оценки доли: булев признак на прогон, потом деление на число прогонов'
  question: Расставьте шаги функции, оценивающей долю траекторий, пробивших стоп-порог.
  explanation: Единица наблюдения — прогон целиком, поэтому пять пробитий внутри одного прогона дают тот же вклад, что и одно. Результат всегда лежит между нулём и единицей.
  kind: order
  items:
    - Обнулить счётчик опасных прогонов
    - Запустить очередной прогон с теми же параметрами и заново разыгранным шумом
    - Проверить, достиг ли разрыв порога хотя бы в одном цикле этого прогона
    - Если достиг — увеличить счётчик ровно на единицу, независимо от числа пробитий внутри прогона
    - После всех прогонов разделить счётчик на общее число прогонов
  id: 026-crossing-share-3
  fingerprint: 7898798b
