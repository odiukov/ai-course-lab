- concept: полностью автоматизированный перебор человеческих идей — автоматизация, а не рекурсия
  question: Конвейер без участия человека обучает, тестирует и развёртывает 500 версий модели, беря варианты изменений из списка, составленного командой заранее. Как классифицировать процесс?
  explanation: Автономность и рекурсивность — разные вещи. Здесь источник каждой правки — фиксированный человеческий список, поэтому цепочка не загибается обратно на себя, сколько бы версий ни прошло.
  kind: choice
  options:
    - 'Рекурсивное самоулучшение: человек не вмешивается между версиями'
    - 'Автоматизированное улучшение: ни одна версия не влияет на то, как порождается следующая'
    - Alignment RSI, потому что критерий отбора задан людьми
    - Рекурсивное самоулучшение с человеком в контуре
