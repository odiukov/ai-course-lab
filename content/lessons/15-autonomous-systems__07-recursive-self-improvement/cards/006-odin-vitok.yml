- concept: если правки для всех витков продолжает предлагать одна и та же исходная версия, цепочки версий не возникает
  question: 'Система S_1 остаётся единственным источником правок: она же придумывает изменения для S_2, S_3 и S_4, хотя каждая новая версия проходит отбор по метрике. Чего не хватает такому процессу?'
  explanation: 'Качество версий растёт, но способ порождения правок остаётся прежним: улучшенная система получает медаль и не получает руль. Рекурсия требует, чтобы автором следующей правки становилась версия, только что победившая в проверке.'
  kind: choice
  options:
    - 'Ничего не хватает: рост метрики на каждом витке и есть рекурсия'
    - Не хватает передачи роли улучшателя новой версии — улучшается продукт, но не сам улучшатель
    - Не хватает автоматического применения правок
    - Не хватает второй метрики для оценки выравнивания
