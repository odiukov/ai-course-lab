- concept: функция одного перехода возвращает состояние после витка; проверка порога и накопление статистики — уровень прогона, а не уровень шага
  question: Почему проверку порога безопасности и подсчёт доли тревожных циклов не размещают внутри функции, вычисляющей один цикл?
  explanation: 'Шаг перехода — чистая функция состояния: вход «до цикла», выход «после цикла». Доля превышений — статистика по прогону, её считает цикл верхнего уровня. Смешение уровней ломает переиспользование шага с другими порогами и числом циклов.'
  kind: choice
  options:
    - Потому что порог нельзя вычислить, пока неизвестны скорости роста.
    - 'Потому что один переход не знает истории прогона: частота превышений определена только по множеству циклов, и это задача вызывающего кода.'
    - Потому что порог относится к выравниванию, а функция обновляет способности.
    - Потому что шум делает проверку порога бессмысленной на любом уровне.
