  question: Почему решение убрать человеческое ревью между витками RSI не считают обычной оптимизацией пайплайна?
  explanation: Ревьюер и есть узкое место, но узкое место и якорь тут — один и тот же элемент. Обычная оптимизация убирает лишнее; здесь убирается функция, которую в текущем стеке нечем заменить, поэтому это размен, а не выигрыш без издержек.
