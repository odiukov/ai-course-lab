- concept: 'рост способностей не влечёт роста выравнивания: измеряется только та цель, которую награждает оценщик'
  question: Почему нельзя измерить только качество на задачах и заключить, что выравнивание тоже выросло?
  explanation: 'Отсюда и вопрос «успевает ли выравнивание»: если способности растут на 15% за цикл, а выравнивание на 8%, разрыв копится сам, без всякого злого умысла.'
  kind: open
  reference: 'Это две разные целевые метрики. Цикл принимает кандидата по тому критерию, который зашит в оценщика: если награждается только число решённых задач, версия с ухудшенным соблюдением ограничений всё равно пройдёт отбор. Возможен и обратный случай — версия строже соблюдает ограничения, но решает меньше задач. Значит, каждую цель нужно мерить своим оценщиком.'
