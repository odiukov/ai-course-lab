- concept: регрессия — просадка отдельной критической способности при выросшем агрегированном балле, и агрегат её маскирует
  question: После витка самоулучшения средний балл системы вырос, а одна критическая способность ослабла. Объясни, почему для цикла нужен отдельный механизм обнаружения регрессий, а не только сравнение общего балла.
  explanation: 'Обнаружение регрессий — отдельная от оценщика проблема: инструмент может измерять верно, но свёртка в одно число прячет потерю. Отсюда покомпонентные допуски вместо одного среднего.'
  kind: open
  reference: 'Агрегированная оценка — это свёртка многих метрик, и заметный рост в сильных областях перекрывает падение в одной. Для цикла важно не среднее, а наличие способностей, потеря которых недопустима (аварийные сценарии, отказ от опасных действий, редкие исключения). Поэтому регрессии ловят покомпонентно: фиксируют набор критических метрик и допуск на ухудшение каждой, сравнивают новую версию с текущей принятой по каждой метрике отдельно, и падение хотя бы одной за допуск считают провалом витка независимо от агрегата. Без этого просадка обнаруживается только тогда, когда цикл уже успел построить на дефектной версии следующие.'
  id: 031-chetyre-problemy-2
  fingerprint: 1d3f52e5
- concept: межцикловый аудит проверяет последствия конкретного перехода и обязан завершиться до старта следующей самоправки
  question: На какой вопрос отвечает межцикловый аудит в пайплайне самоулучшения?
  explanation: 'Аудит между циклами — про момент и адресность проверки, а не про общее качество версии. Хорошие тесты бесполезны, если цикл ушёл на два витка вперёд, пока их результаты разбирали: проверять нужно конкретный переход и до того, как он станет основанием следующего.'
  kind: choice
  options:
    - Насколько новая версия хороша по сравнению с продуктами других команд
    - Кто проверил последствия именно этого перехода между версиями и успел ли он это сделать до запуска следующей самоправки
    - Какая архитектура даёт наибольший прирост балла за виток
    - Сколько вычислений потратил цикл на поиск кандидатов
  correct: 1
  id: 031-chetyre-problemy-3
  fingerprint: 6c4dbf5f
