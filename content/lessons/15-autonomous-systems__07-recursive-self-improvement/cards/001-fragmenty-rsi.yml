- concept: 'каждая из трёх систем фазы 2025-2026 автоматизирует свой объект улучшения: алгоритм, агентный каркас, исследования выравнивания'
  question: Какая из систем — AlphaEvolve, Darwin Gödel Machine, AAR — переписывает собственный агентный каркас, то есть инструмент, которым решаются последующие задачи?
  explanation: AlphaEvolve улучшает алгоритмы, AAR — исследования по выравниванию, а DGM правит именно тот каркас, которым сама выполняет задачи. Поэтому DGM ближе всех к самоизменению, но и ей нужен человек для проверки целостности оценщика.
  kind: choice
  options:
    - 'AlphaEvolve: она эволюционно ищет более удачные алгоритмы для заданной предметной области'
    - 'Darwin Gödel Machine: она модифицирует код своего агентного каркаса и проверяет прирост на бенчмарке'
    - 'AAR: она автоматизирует исследовательские шаги по выравниванию'
    - Все три меняют агентный каркас, различаются только метрикой
  correct: 1
  id: 001-fragmenty-rsi-1
  fingerprint: cc6b5bb1
- concept: 'автоматизация одного шага цикла не даёт замкнутого цикла: результат витка не запускает следующий виток сам'
  question: Система автоматически находит улучшенный алгоритм для заданной задачи. Объясни своими словами, почему это ещё не замкнутый цикл рекурсивного самоулучшения.
  explanation: 'Именно поэтому AlphaEvolve, DGM и AAR корректно называть незамкнутыми фрагментами RSI: они доказывают, что отдельные операции самоулучшения автоматизируемы, но переход к следующему циклу пока делает человек.'
  kind: open
  reference: 'Автоматизирован один шаг цикла — поиск улучшения. Но предметную область и постановку задаёт человек, найденное улучшение не входит автоматически в сам механизм поиска и не запускает следующий виток: решения, проверка и запуск остаются снаружи. Замкнутый цикл требует, чтобы результат витка стал источником следующего витка, а не отдельным разовым артефактом.'
  id: 001-fragmenty-rsi-2
  fingerprint: d6a5ee0a
