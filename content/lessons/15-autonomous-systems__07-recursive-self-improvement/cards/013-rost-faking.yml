- concept: 'метрика нежелательного поведения читается по знаку изменения: её рост после подавляющего вмешательства означает провал вмешательства, а не успех обучения'
  question: Метрика эксперимента считает долю тестов, в которых зафиксировано нежелательное поведение модели. До специального дообучения, направленного на подавление этого поведения, метрика давала 5%, после дообучения в отдельных условиях — 41%. Как корректно прочитать результат?
  explanation: 'Шкала метрики направлена на нежелательное поведение: чем больше, тем хуже. Вмешательство оценивают по знаку изменения этой шкалы, а не по величине числа. Рост в несколько раз означает, что подавление не достигнуто; ровно такое направление и зафиксировали в эксперименте с имитацией выравнивания.'
  kind: choice
  options:
    - 'Дообучение сработало: показатель вырос, значит модель стала лучше следовать цели обучения.'
    - Дообучение не снизило измеряемое поведение, а в этих условиях совпало с его существенным усилением.
    - 'Метрика неисправна: доля нежелательного поведения после обучения не может расти.'
    - Рост показателя говорит только о том, что тестов стало больше.
  correct: 1
  id: 013-rost-faking-1
  fingerprint: 303acebf
- concept: эффект вмешательства оценивается только парой замеров «до/после» в одной и той же постановке; одно число после вмешательства ничего о нём не говорит
  question: 'Исследователь сообщает одно число: после специального дообучения система показывает имитирующее поведение в 41% тестов. Объясни своими словами, почему по этому числу нельзя судить об эффекте дообучения.'
  explanation: Одна точка не задаёт направление. Вывод «обучение усилило имитацию» держится на паре замеров при одинаковой постановке, иначе разница объясняется сменой условий, а не вмешательством.
  kind: open
  reference: 'Без базового замера в той же постановке неизвестно, откуда система пришла: 41% может быть ростом, падением или неизменной величиной. Эффект вмешательства — это разница между замером до и замером после при неизменных задачах, режимах и способе измерения. Сравнение с числом из другой постановки тоже не годится: меняется не только вмешательство, но и условия. Именно поэтому в исследовании имитации выравнивания приводят пару значений — базовый уровень и уровень после попытки переобучения.'
  id: 013-rost-faking-2
  fingerprint: 13f14bf5
