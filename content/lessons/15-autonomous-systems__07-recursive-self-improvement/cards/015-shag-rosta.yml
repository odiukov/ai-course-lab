- concept: разрыв после одного витка равен разности двух значений, каждое из которых получено умножением общей базы на собственный множитель роста
  question: Способности и выравнивание стартуют с одинаковой отметки 2,00. За один цикл способности растут на 20%, выравнивание — на 5%. Чему равен разрыв C − A после этого цикла?
  explanation: C = 2,00 · 1,20 = 2,40; A = 2,00 · 1,05 = 2,10; разрыв 2,40 − 2,10 = 0,30. Каждый множитель применяется к своей величине от состояния до цикла, поэтому разрыв — это разность результатов, а не разность процентов.
  kind: numeric
  answer: 0.3
  tolerance: 0.005
  id: 015-shag-rosta-1
  fingerprint: cbbde38f
- concept: выравнивание обновляется от собственного значения до цикла, а не от уже обновлённых способностей
  question: Дополни формулу обновления выравнивания за один цикл так, чтобы два процесса не были искусственно связаны.
  explanation: Оба значения витка считаются от одной и той же пары «до цикла». Если подставить C_new, выравнивание начнёт зависеть от роста способностей, хотя модель такой связи не задаёт.
  kind: cloze
  template: A_new = ___ * r_a
  answer: A_old
  accept:
    - A_old
    - A_прежнее
    - A(t)
    - A_t
    - A_прошлое
