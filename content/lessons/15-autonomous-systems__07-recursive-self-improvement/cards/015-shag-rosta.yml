- concept: при равных множителях роста ненулевой начальный разрыв не сохраняется, а масштабируется тем же множителем
  question: Способности равны 4,0, выравнивание 2,5, и оба процесса растут с одинаковым множителем 1,10 за цикл. Что происходит с разрывом C − A после одного цикла?
  explanation: C·r − A·r = r·(C − A) = 1,10 · 1,5 = 1,65. Равенство множителей удерживает постоянным отношение C/A, но абсолютный разрыв растёт, если он уже был ненулевым.
  kind: choice
  options:
    - 'Разрыв остаётся 1,5: скорости одинаковы.'
    - Разрыв становится 1,65 — исходная разница умножается на тот же множитель.
    - Разрыв обнуляется, потому что процессы растут одинаково.
    - Разрыв уменьшается, так как отстающий процент даёт больший относительный прирост.
  correct: 1
  id: 015-shag-rosta-3
