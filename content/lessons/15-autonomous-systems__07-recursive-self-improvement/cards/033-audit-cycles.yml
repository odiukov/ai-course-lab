  fingerprint: a6adb028
- concept: условия паузы проверяются независимо, поэтому один виток может дать несколько причин, и число причин не равно числу проблемных витков
  question: Журнал из 12 витков. Условие «качество оценщика» нарушено на витках 3, 7 и 11; условие «регрессия критической способности» — на витках 7 и 9; условие «межцикловый аудит не завершён» — на витке 11. Сколько всего причин остановки соберёт полный отчёт?
  explanation: 'Условия проверяются независимо друг от друга: 3 срабатывания оценщика + 2 регрессии + 1 незавершённый аудит = 6 причин. Проблемных витков при этом только 4 (3, 7, 9, 11) — виток 7 несёт две причины, виток 11 тоже две. Если функция схлопывает виток в один флаг, шесть поводов для ревью превращаются в четыре и часть информации теряется.'
  kind: numeric
  answer: 6
  tolerance: 0.5
  id: 033-audit-cycles-2
