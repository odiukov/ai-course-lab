- concept: 'запись отчёта адресна: номер витка плюс перечень сработавших условий, а не общий флаг unsafe'
  question: Почему отчёт аудита хранит для каждого проблемного витка его номер и перечень сработавших условий, а не общий флаг вида unsafe=true? Объясни своими словами.
  explanation: Стоп-кран полезен, только когда указывает место и причину. Пустой список означает, что ни одно из условий паузы не сработало; каждая непустая запись — конкретный адрес (номер витка) и конкретный набор оснований блокировки.
  kind: open
  reference: 'Флаг unsafe сообщает только факт остановки и не говорит, где и что чинить: человеку придётся заново перебирать журнал вручную. Номер витка локализует место разрыва в цепочке версий — именно этот переход нельзя пропускать дальше. Перечень условий говорит, какое именно свойство процесса отказало (оценщик, устойчивость цели, регрессия, незавершённый межцикловый аудит), и каждое требует своего действия. Разные причины лечатся по-разному, поэтому их нельзя складывать в одно значение. Плюс адресная запись делает решение о паузе проверяемым постфактум: видно, на каком основании цикл был заблокирован.'
  id: 033-audit-cycles-3
  fingerprint: 9b077fbf
