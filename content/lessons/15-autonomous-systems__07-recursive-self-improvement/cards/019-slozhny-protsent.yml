- concept: 'число витков до заданного кратного роста определяется логарифмом: n = ln(k)/ln(r)'
  question: Величина умножается на 1,12 за каждый цикл. Через сколько циклов она станет втрое больше начальной? Дробный ответ допустим.
  explanation: 'Нужно (1,12)^n = 3, то есть n = ln3/ln1,12 ≈ 1,0986/0,1133 ≈ 9,7. Число витков зависит от логарифма требуемого множителя, а не от него самого: следующее утроение потребует столько же циклов, хотя абсолютный прирост будет втрое больше.'
  kind: numeric
  answer: 9.69
  tolerance: 0.3
