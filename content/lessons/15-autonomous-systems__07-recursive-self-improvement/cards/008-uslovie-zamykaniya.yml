- concept: переход между витками разрывает необходимость человеческого действия, а не факт человеческого присутствия
  question: В системе A между витками дежурный инженер читает журнал работы, но новая версия запускается автоматически без его действий. В системе B инженер обязан подтвердить оценщик, иначе следующий виток не начнётся. Где переход между витками замкнут?
  explanation: 'Проверка простая: мысленно убрать человека. В A всё продолжится по тем же правилам, в B новая версия застынет в ожидании решения. Наблюдатель без права решения — не часть механизма перехода; подтверждающий оценщик — часть.'
  kind: choice
  options:
    - 'В обеих: в каждой есть человек, значит цепочка держится на нём'
    - 'Ни в одной: любое участие человека отменяет замыкание'
    - 'Только в A: цикл разрывает обязательное действие человека, а не его наблюдение'
    - 'Только в B: подтверждение оценщика делает переход надёжнее, а значит замкнутее'
  correct: 2
  id: 008-uslovie-zamykaniya-1
  fingerprint: 702d98f7
- concept: снятие человеческой проверки оценщика замыкает переход, но открывает оптимизацию самого оценщика вместо задачи
  question: Из цикла убирают человека, который проверял целостность оценщика, и ничем эту функцию не заменяют. Что получится?
  explanation: 'Роль человека тут не церемониальная: он держит оценщик честным. Без этого прирост на метрике легче всего получить, испортив саму метрику. Замыкание перехода бесплатным не бывает — функцию вахтёра приходится чем-то заменять.'
  kind: choice
  options:
    - 'Переход между витками замкнётся, но правки, ломающие или подкручивающие проверку, начнут проходить как улучшения: цикл станет оптимизировать оценщик, а не задачу'
    - Цикл перестанет быть рекурсивным, потому что правки станет некому одобрять
    - Результат на целевой метрике перестанет расти
    - 'Ничего не изменится: оценщик от участия человека не зависит'
