- concept: результаты по переносу — сигналы, привязанные к конкретной постановке, а не окончательный вердикт системе
  question: Улучшение одной системы сохраняется при смене базовой модели, а другая система проваливается на задачах вне распределения, на котором её улучшали. Как правильно трактовать эти два наблюдения?
  explanation: 'Перенос между моделями — положительное свидетельство обобщения, провал вне распределения — отрицательное. Ни то ни другое не отвечает на вопрос, нужен ли человек между витками, и ни то ни другое не приговор всей системе: проверено ровно то, что проверено.'
  kind: choice
  options:
    - Первое доказывает, что цикл первой системы замкнут, второе — что вторая система вообще не самоулучшается
    - Это два сигнала по конкретным постановкам — положительный и отрицательный, — и каждый ограничен тем, что проверяли
    - Оба наблюдения относятся к выравниванию, а не к способностям
    - Перенос между базовыми моделями к обобщению отношения не имеет
  correct: 1
