- concept: кандидат сравнивается с текущей принятой версией, а не с исходной и не с предыдущим кандидатом, поэтому история принятых оценок не убывает
  question: Исходная система набирает 30 баллов. За пять витков кандидаты набрали по порядку 31, 29, 34, 33 и 38 баллов; кандидат принимается только если он лучше текущей принятой версии. Сколько баллов набирает финальная система?
  explanation: 'Порог для приёма — оценка текущей версии, а не исходной и не предыдущего кандидата: 31 принят (лучше 30), 29 отклонён (хуже 31), 34 принят, 33 отклонён, 38 принят. Из-за такого правила последовательность принятых оценок не убывает, и финал равен 38.'
  kind: numeric
  answer: 38
  tolerance: 0.5
  id: 007-self-improve-2
