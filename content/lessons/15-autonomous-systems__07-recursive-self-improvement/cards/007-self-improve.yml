- concept: сравнение текущей версии и кандидата имеет смысл только при одинаковой метрике и одинаковом наборе задач
  question: В цикле самоулучшения текущую версию измеряют на одном наборе задач, а каждого кандидата — на новом наборе, который кандидат же и сгенерировал. Что ломается в цикле?
  explanation: Условие «кандидат лучше» определено только относительно общего измерения. Разные наборы делают числа несравнимыми, и приём кандидата отражает лёгкость его собственного набора, а не прирост на целевой метрике. Авторство правки при этом не меняется — рекурсивность остаётся, разрушается именно критерий отбора.
  kind: choice
  options:
    - 'Решение о приёме кандидата перестаёт означать улучшение: два числа получены разными измерениями и несравнимы'
    - 'Ничего: пока метрика формально одна и та же функция, сравнение корректно'
    - 'Ломается только скорость: цикл начинает тратить лишние вызовы оценщика'
    - Цикл перестаёт быть рекурсивным, потому что правку теперь предлагает не система
