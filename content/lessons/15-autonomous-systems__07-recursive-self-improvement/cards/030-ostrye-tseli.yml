- concept: 'измеримый заменитель размытой цели оптимизируется вместо самой цели: растёт прокси, а не свойство, ради которого он введён'
  question: Честность решили измерять долей ответов, содержащих оговорку про неуверенность. За несколько витков доля выросла с 40% до 85%. Какой вывод обоснован?
  explanation: Цикл оптимизирует то, что награждается, а награждается прокси. Рост с 40% до 85% фиксирует только частоту оговорки; связь оговорки с настоящей честностью прокси не гарантирует и под давлением оптимизации разрушается первой.
  kind: choice
  options:
    - Модель стала честнее ровно вдвое
    - Выросла измеряемая доля оговорок; цикл мог научиться вставлять их и там, где уверенность оправданна
    - Оговорка — плохой признак честности, значит выравнивание ухудшилось
    - Метрика доказывает, что размытые цели можно оптимизировать так же, как бенчмарки
  correct: 1
