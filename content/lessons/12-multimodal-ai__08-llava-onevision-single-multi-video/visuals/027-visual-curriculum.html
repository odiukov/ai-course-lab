<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Лента curriculum</title>
<style>
  :root{
    --bg:#fbfaf7; --fg:#1b1b1f; --muted:#5c5c66;
    --line:#2f4f7f; --si:#dce8f7; --ov:#dcf0e4; --tt:#f7e6d8; --edge:#8a8a96;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14161a; --fg:#eceff4; --muted:#a4abb8;
      --line:#8ab4f8; --si:#1e2c40; --ov:#1d3328; --tt:#3a2a1c; --edge:#5a616e;
    }
  }
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:1000px;margin:0 auto;padding:10px 12px;}
  h2{font-size:15px;margin:0 0 6px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;}
  .box{fill:var(--si);stroke:var(--edge);}
  .t{fill:var(--fg);}
  .m{fill:var(--muted);font-size:11.5px;}
  .stage{font-size:15px;font-weight:700;}
  .name{font-size:12.5px;}
  .rail{stroke:var(--line);fill:none;}
  .arrowlbl{fill:var(--line);font-size:11.5px;font-weight:600;}
  .fallback{color:var(--muted);font-size:13px;}
</style>
<div class="wrap">
<h2>Лента curriculum: одна линия весов, три рациона</h2>
<div id="host">
<svg id="s" viewBox="0 0 940 300" preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="Три этапа SI, OV, TT на одной непрерывной линии весов">
  <rect x="0" y="0" width="940" height="300" fill="var(--bg)"/>
  <g id="g"></g>
</svg>
</div>
<noscript class="fallback">SI (AnyRes, 1820 tokens) → OV (смесь: 6×729 и 32×81) → TT (перевес в видео или наборы); веса переносятся без разрыва.</noscript>
</div>
<script>
(function(){
var g=document.getElementById("g");
try{
  // ---- данные схемы ----
  var STAGES=[
    {x:1, stage:"SI", name:"одиночные картинки",
     lines:["одна картинка на пример","AnyRes высокого разрешения","1820 tokens"]},
    {x:5, stage:"OV", name:"OneVision: смесь трёх сценариев",
     lines:["6 картинок по 729","32 кадра по 81","единый бюджет tokens"]},
    {x:9, stage:"TT", name:"перенос на задачу",
     lines:["смесь перекошена","перевес в видео","или в наборы картинок"]}
  ];
  var BOX_W=3, BOX_H=3.4, RAIL_Y=4.6, TOP=0.9;
  var LABEL_Y=5.5;

  // ---- одна пара функций перевода ----
  var origin={x:40,y:22}, scale=72;
  function sx(x){return origin.x+x*scale;}
  function sy(y){return origin.y+y*scale;}

  var NS="http://www.w3.org/2000/svg";
  function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}
  function txt(x,y,s,cls,anchor,dx,dy){
    var t=el("text",{x:sx(x)+(dx||0),y:sy(y)+(dy||0),"text-anchor":anchor,"class":cls});
    t.textContent=s;g.appendChild(t);return t;
  }
  var FILL=["var(--si)","var(--ov)","var(--tt)"];

  // ---- рельс: одна непрерывная линия под блоками ----
  var rail=el("path",{"class":"rail","stroke-width":3,
    d:"M "+sx(0.35)+" "+sy(RAIL_Y)+" L "+sx(11.3)+" "+sy(RAIL_Y)});
  g.appendChild(rail);
  // наконечник стрелки — вершины через sx/sy
  var hx=11.65, hy=RAIL_Y, hb=0.22;
  g.appendChild(el("polygon",{fill:"var(--line)",
    points:[sx(hx),sy(hy),sx(hx-0.34),sy(hy-hb),sx(hx-0.34),sy(hy+hb)].join(" ")}));
  txt(0.35,RAIL_Y,"веса переносятся, линия не обрывается","arrowlbl","start",0,26);

  STAGES.forEach(function(st,i){
    var x0=st.x-BOX_W/2;
    g.appendChild(el("rect",{"class":"box",fill:FILL[i],"stroke-width":1.5,rx:8,
      x:sx(x0),y:sy(TOP),width:sx(x0+BOX_W)-sx(x0),height:sy(TOP+BOX_H)-sy(TOP)}));
    // вертикальная связка блока с рельсом
    g.appendChild(el("path",{"class":"rail","stroke-width":1.5,"stroke-dasharray":"4 4",
      d:"M "+sx(st.x)+" "+sy(TOP+BOX_H)+" L "+sx(st.x)+" "+sy(RAIL_Y)}));
    g.appendChild(el("circle",{cx:sx(st.x),cy:sy(RAIL_Y),r:sx(0.07)-sx(0),fill:"var(--line)"}));

    txt(st.x,TOP,st.stage,"t stage","middle",0,26);
    txt(st.x,TOP,st.name,"t name","middle",0,46);
    st.lines.forEach(function(s,j){
      txt(st.x,TOP+1,s,"m","middle",0,26+j*19);
    });
    txt(st.x,LABEL_Y,"этап "+(i+1),"m","middle",0,4);
  });

  // подписи стыков: над рельсом, между блоками, разведены от подписи стрелки
  txt(3,RAIL_Y,"тот же набор весов","m","middle",0,-12);
  txt(7,RAIL_Y,"меняется только рацион","m","middle",0,-12);

  // обратного хода нет — заметка у хвоста, слева
  txt(0.35,TOP+BOX_H,"обратный порядок — отдельный ablation, он проигрывает","m","start",0,-8);
}catch(e){
  var d=document.createElement("div");
  d.className="fallback";
  d.textContent="Схема должна показать три блока подряд: SI (одна картинка, AnyRes высокого разрешения, 1820 tokens) → OV (смесь трёх сценариев: 6 картинок по 729 и 32 кадра по 81, единый бюджет) → TT (смесь с перевесом в видео или в наборы картинок). Под блоками — одна непрерывная линия со стрелкой вправо: веса переносятся, разрыва нет.";
  document.getElementById("host").appendChild(d);
}
})();
</script>
</html>
