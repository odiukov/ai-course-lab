<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Три сценария в одной коробке</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #1a1d21;
    --muted: #5c6773;
    --grid: #d7dde3;
    --box: #8892a0;
    --c1: #b4552e;
    --c2: #2f6f9f;
    --c3: #3f7d4e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a;
      --ink: #e8ecef;
      --muted: #9aa5b1;
      --grid: #333a41;
      --box: #6d7885;
      --c1: #e08a5c;
      --c2: #6fadd9;
      --c3: #79bd8b;
    }
  }
  html, body { margin: 0; background: var(--bg); }
  .wrap { background: var(--bg); color: var(--ink); max-height: 520px; }
  h3 { font: 600 15px/1.3 system-ui, sans-serif; margin: 0 0 2px; padding: 8px 10px 0; }
  svg { display: block; width: 100%; height: auto; max-height: 500px; }
  .fail { font: 13px/1.5 system-ui, sans-serif; padding: 10px; color: var(--ink); }
  text { font-family: system-ui, sans-serif; fill: var(--ink); }
</style>
<div class="wrap">
  <h3>Один бюджет визуальных tokens — три способа его нарезать</h3>
  <div id="host"></div>
</div>
<script>
(function () {
  var host = document.getElementById('host');
  try {
    // ---- данные схемы -------------------------------------------------
    var COLS = [
      { key: 'одна картинка', n: 10, per: 182, total: 1820, color: 'var(--c1)', note: '10 × 182' },
      { key: 'шесть картинок', n: 6, per: 729, total: 4374, color: 'var(--c2)', note: '6 × 729' },
      { key: '32 кадра видео', n: 32, per: 81, total: 2592, color: 'var(--c3)', note: '32 × 81' }
    ];
    var BAND = [2592, 4374];   // коридор из текста шага
    var TICKS = [0, 1820, 2592, 4374];

    // ---- холст (литералы: только viewBox и пиксельные отступы) --------
    var W = 760, H = 430;
    var PAD_LBL = 6, PAD_BIG = 10, LW = 1.6, FS = 13, FS_S = 11.5;

    // ---- одна пара функций перевода -----------------------------------
    // x — индекс колонки в единицах шага 1; y — tokens
    var origin = { x: 152, y: 348 };
    var scale = { x: 176, y: -0.0665 };
    function sx(x) { return origin.x + x * scale.x; }
    function sy(y) { return origin.y + y * scale.y; }

    var COL_HALF = 0.28;       // полуширина колонки в единицах x
    var TOP = 4600;            // верх оси в tokens

    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    svg.setAttribute('role', 'img');

    function el(tag, attrs, txt) {
      var e = document.createElementNS('http://www.w3.org/2000/svg', tag);
      for (var k in attrs) e.setAttribute(k, attrs[k]);
      if (txt != null) e.textContent = txt;
      svg.appendChild(e);
      return e;
    }
    function line(x1, y1, x2, y2, stroke, extra) {
      var a = { x1: sx(x1), y1: sy(y1), x2: sx(x2), y2: sy(y2),
                stroke: stroke, 'stroke-width': LW };
      for (var k in (extra || {})) a[k] = extra[k];
      return el('line', a);
    }
    function label(x, y, txt, anchor, dx, dy, size, fill, weight) {
      return el('text', {
        x: sx(x) + dx, y: sy(y) + dy, 'text-anchor': anchor,
        'font-size': size, fill: fill || 'var(--ink)',
        'font-weight': weight || 400
      }, txt);
    }

    el('rect', { x: 0, y: 0, width: W, height: H, fill: 'var(--bg)' });

    // ---- коридор «в одном порядке» ------------------------------------
    el('rect', {
      x: sx(-0.62), y: sy(BAND[1]),
      width: sx(2.62) - sx(-0.62), height: sy(BAND[0]) - sy(BAND[1]),
      fill: 'var(--box)', opacity: 0.13
    });
    line(-0.62, BAND[1], 2.62, BAND[1], 'var(--box)', { 'stroke-dasharray': '5 4' });
    line(-0.62, BAND[0], 2.62, BAND[0], 'var(--box)', { 'stroke-dasharray': '5 4' });
    label(2.62, (BAND[0] + BAND[1]) / 2, 'коробка одного размера',
          'end', -PAD_BIG, -PAD_LBL, FS_S, 'var(--muted)');
    label(2.62, (BAND[0] + BAND[1]) / 2, '2592 … 4374 tokens',
          'end', -PAD_BIG, FS_S + PAD_LBL, FS_S, 'var(--muted)');

    // ---- ось tokens ---------------------------------------------------
    line(-0.62, 0, -0.62, TOP, 'var(--ink)');
    line(-0.62, 0, 2.62, 0, 'var(--ink)');
    TICKS.forEach(function (t) {
      line(-0.68, t, -0.62, t, 'var(--grid)');
      label(-0.68, t, String(t), 'end', -PAD_LBL, FS_S * 0.36, FS_S, 'var(--muted)');
    });
    label(-0.62, TOP, 'визуальные tokens', 'start', PAD_LBL, -PAD_LBL, FS_S, 'var(--muted)');

    // ---- колонки с внутренней нарезкой --------------------------------
    COLS.forEach(function (c, i) {
      var xl = i - COL_HALF, xr = i + COL_HALF;

      // куски: n штук по per tokens
      for (var k = 0; k < c.n; k++) {
        var y0 = k * c.per, y1 = (k + 1) * c.per;
        el('rect', {
          x: sx(xl), y: sy(y1),
          width: sx(xr) - sx(xl), height: sy(y0) - sy(y1),
          fill: c.color, opacity: 0.34,
          stroke: c.color, 'stroke-width': c.n > 12 ? 0.5 : 1
        });
      }
      // внешний контур = итог
      el('rect', {
        x: sx(xl), y: sy(c.total),
        width: sx(xr) - sx(xl), height: sy(0) - sy(c.total),
        fill: 'none', stroke: c.color, 'stroke-width': LW + 0.6
      });

      // итог — над колонкой
      label(i, c.total, c.total + ' tokens', 'middle', 0, -PAD_BIG, FS, c.color, 600);
      // произведение — внутри колонки, ниже верха
      label(i, c.total, c.note, 'middle', 0, PAD_BIG + FS, FS, 'var(--ink)', 600);
      // сценарий — под осью
      label(i, 0, c.key, 'middle', 0, PAD_BIG + FS_S, FS_S, 'var(--muted)');
      // цена куска — ещё ниже
      label(i, 0, 'кусок = ' + c.per, 'middle', 0, PAD_BIG + FS_S * 2.6, FS_S, c.color);
    });

    // ---- стрелки: множители ходят навстречу ---------------------------
    var yArr = -720, yTxt = -1180;
    var head = 7;
    function arrow(xFrom, xTo) {
      line(xFrom, yArr, xTo, yArr, 'var(--muted)');
      var dir = xTo > xFrom ? 1 : -1;
      el('polygon', {
        points: [
          sx(xTo) + ',' + sy(yArr),
          (sx(xTo) - dir * head) + ',' + (sy(yArr) - head * 0.72),
          (sx(xTo) - dir * head) + ',' + (sy(yArr) + head * 0.72)
        ].join(' '),
        fill: 'var(--muted)'
      });
    }
    arrow(-0.2, 2.2);
    label(-0.2, yArr, 'кусков больше', 'start', 0, -PAD_LBL, FS_S, 'var(--muted)');
    arrow(2.2, -0.2);
    label(2.2, yTxt, 'кусок дешевле', 'end', 0, -PAD_LBL, FS_S, 'var(--muted)');
    line(-0.2, yTxt, 2.2, yTxt, 'var(--muted)', { opacity: 0 });

    host.appendChild(svg);
  } catch (e) {
    host.innerHTML = '<p class="fail">Схема должна показать три колонки почти одной высоты: ' +
      'одна картинка 10 × 182 = 1820 tokens, шесть картинок 6 × 729 = 4374 tokens, ' +
      '32 кадра видео 32 × 81 = 2592 tokens. Слева кусков мало, но каждый дорогой; ' +
      'справа кусков много, но каждый дешёвый — произведение остаётся в одном коридоре.</p>';
  }
})();
</script>
</html>
