<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Фиксированная и последовательная остановка</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fb;
      --surface: #ffffff;
      --text: #172033;
      --muted: #536078;
      --axis: #68738a;
      --guide: #d7dce7;
      --fixed: #2474d8;
      --sequential: #d85b35;
      --boundary: #8a55c5;
      --halo: #ffffff;
      --soft-fixed: #e8f2ff;
      --soft-sequential: #fff0ea;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111521;
        --surface: #171d2b;
        --text: #eef2fb;
        --muted: #aeb8cb;
        --axis: #a6b0c4;
        --guide: #394258;
        --fixed: #67a9ff;
        --sequential: #ff8d69;
        --boundary: #c598ff;
        --halo: #171d2b;
        --soft-fixed: #203552;
        --soft-sequential: #4b2d28;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--text);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    figure,
    h1 {
      margin: unset;
    }

    h1 {
      font-size: 20px;
      font-weight: bold;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 430px;
      background: var(--surface);
    }

    svg text {
      fill: var(--text);
      font-size: 15px;
    }

    svg .small {
      font-size: 13px;
    }

    svg .muted {
      fill: var(--muted);
    }

    svg .strong {
      font-weight: bold;
    }

    svg .axis {
      stroke: var(--axis);
      fill: none;
    }

    svg .axis-head {
      fill: var(--axis);
    }

    svg .guide {
      stroke: var(--guide);
      fill: none;
    }

    svg .fixed {
      stroke: var(--fixed);
      fill: none;
    }

    svg .sequential {
      stroke: var(--sequential);
      fill: none;
    }

    svg .boundary {
      stroke: var(--boundary);
      fill: none;
    }

    svg .fixed-mark {
      stroke: var(--halo);
      fill: var(--fixed);
    }

    svg .sequential-mark {
      stroke: var(--halo);
      fill: var(--sequential);
    }

    svg .label-halo {
      paint-order: stroke fill;
      stroke: var(--halo);
      stroke-linejoin: round;
    }

    svg .fixed-note {
      fill: var(--fixed);
    }

    svg .sequential-note {
      fill: var(--sequential);
    }

    svg .boundary-note {
      fill: var(--boundary);
    }

    svg .fallback {
      fill: var(--text);
    }
  </style>
</head>
<body>
  <figure>
    <h1>Фиксированная и последовательная остановка</h1>
    <svg
      id="diagram"
      viewBox="0 0 960 430"
      width="960"
      height="430"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svgTitle svgDescription"
    >
      <title id="svgTitle">Два заранее заданных правила остановки эксперимента</title>
      <desc id="svgDescription">
        Фиксированный тест продолжается до четырнадцатого дня.
        Последовательный тест заканчивается раньше, когда линия накопленного
        эффекта пересекает заранее заданную ужесточающуюся границу.
      </desc>
    </svg>
  </figure>

  <script>
    const DATA = Object.freeze({
      axes: {
        x: [{ x: 0, y: 0 }, { x: 15, y: 0 }],
        y: [{ x: 0, y: 0 }, { x: 0, y: 6.7 }],
        xHead: [
          { x: 15, y: 0 },
          { x: 14.72, y: 0.14 },
          { x: 14.72, y: -0.14 }
        ],
        yHead: [
          { x: 0, y: 6.7 },
          { x: -0.14, y: 6.42 },
          { x: 0.14, y: 6.42 }
        ]
      },
      guides: [
        [{ x: 3, y: 0 }, { x: 3, y: 5.72 }],
        [{ x: 14, y: 0 }, { x: 14, y: 5.72 }],
        [{ x: 8, y: 0 }, { x: 8, y: 4.15 }]
      ],
      ticks: [
        [{ x: 3, y: -0.11 }, { x: 3, y: 0.11 }],
        [{ x: 14, y: -0.11 }, { x: 14, y: 0.11 }]
      ],
      fixed: [
        { x: 0, y: 0.18 },
        { x: 1, y: 0.55 },
        { x: 2, y: 1.16 },
        { x: 3, y: 1.78 },
        { x: 4, y: 1.47 },
        { x: 5, y: 1.21 },
        { x: 6, y: 1.65 },
        { x: 7, y: 2.08 },
        { x: 8, y: 1.88 },
        { x: 9, y: 2.34 },
        { x: 10, y: 2.19 },
        { x: 11, y: 2.71 },
        { x: 12, y: 3.03 },
        { x: 13, y: 2.92 },
        { x: 14, y: 3.38 }
      ],
      sequential: [
        { x: 0, y: 0.14 },
        { x: 1, y: 0.72 },
        { x: 2, y: 1.29 },
        { x: 3, y: 1.94 },
        { x: 4, y: 2.18 },
        { x: 5, y: 2.62 },
        { x: 6, y: 3.04 },
        { x: 7, y: 3.43 },
        { x: 8, y: 4.15 }
      ],
      boundary: [
        { x: 0, y: 2.34 },
        { x: 1, y: 2.47 },
        { x: 2, y: 2.61 },
        { x: 3, y: 2.78 },
        { x: 4, y: 2.96 },
        { x: 5, y: 3.17 },
        { x: 6, y: 3.38 },
        { x: 7, y: 3.61 },
        { x: 8, y: 3.86 },
        { x: 9, y: 4.09 },
        { x: 10, y: 4.29 },
        { x: 11, y: 4.46 },
        { x: 12, y: 4.59 },
        { x: 13, y: 4.68 },
        { x: 14, y: 4.74 }
      ],
      fixedMark: [
        { x: 13.87, y: 3.38 },
        { x: 14, y: 3.56 },
        { x: 14.13, y: 3.38 },
        { x: 14, y: 3.2 }
      ],
      sequentialMark: [
        { x: 7.84, y: 4.15 },
        { x: 8, y: 4.36 },
        { x: 8.16, y: 4.15 },
        { x: 8, y: 3.94 }
      ],
      labels: [
        {
          x: 0,
          y: 6.42,
          dx: "right",
          dy: "down",
          anchor: "start",
          text: "накопленный эффект",
          className: "muted strong"
        },
        {
          x: 15,
          y: 0,
          dx: "left",
          dy: "downLarge",
          anchor: "end",
          text: "дни после запуска",
          className: "muted"
        },
        {
          x: 3,
          y: 5.92,
          dx: "none",
          dy: "up",
          anchor: "middle",
          text: "3-й день · 2 000 пользователей",
          className: "strong label-halo"
        },
        {
          x: 3,
          y: 5.6,
          dx: "none",
          dy: "up",
          anchor: "middle",
          text: "перевес уже виден, но правило ещё не выполнено",
          className: "small muted label-halo"
        },
        {
          x: 14,
          y: 5.92,
          dx: "none",
          dy: "up",
          anchor: "end",
          text: "14-й день · 10 000 на версию",
          className: "strong label-halo"
        },
        {
          x: 14,
          y: 3.38,
          dx: "left",
          dy: "downLarge",
          anchor: "end",
          text: "фиксированный: решение только здесь",
          className: "small fixed-note strong label-halo"
        },
        {
          x: 8,
          y: 4.15,
          dx: "rightLarge",
          dy: "upLarge",
          anchor: "start",
          text: "последовательный: граница пересечена",
          className: "small sequential-note strong label-halo"
        },
        {
          x: 8,
          y: 0,
          dx: "right",
          dy: "downLarge",
          anchor: "start",
          text: "досрочный стоп по правилу",
          className: "small sequential-note label-halo"
        },
        {
          x: 10.9,
          y: 5.18,
          dx: "none",
          dy: "up",
          anchor: "middle",
          text: "граница ужесточается с каждым просмотром",
          className: "small boundary-note strong label-halo"
        }
      ],
      legend: [
        {
          segment: [{ x: 0.15, y: -1.18 }, { x: 0.9, y: -1.18 }],
          className: "fixed",
          x: 1.08,
          y: -1.18,
          text: "фиксированная линия — до дня 14"
        },
        {
          segment: [{ x: 5.55, y: -1.18 }, { x: 6.3, y: -1.18 }],
          className: "sequential",
          x: 6.48,
          y: -1.18,
          text: "последовательная — до пересечения"
        },
        {
          segment: [{ x: 11.45, y: -1.18 }, { x: 12.2, y: -1.18 }],
          className: "boundary",
          x: 12.38,
          y: -1.18,
          text: "граница решения"
        }
      ]
    });

    const ORIGIN = Object.freeze({ x: 100, y: 350 });
    const SCALE = Object.freeze({ x: 52, y: 43 });

    const sx = x => ORIGIN.x + x * SCALE.x;
    const sy = y => ORIGIN.y - y * SCALE.y;

    const CANVAS = Object.freeze({ width: 960, height: 430 });
    const LABEL_PAD = Object.freeze({
      none: 0,
      right: 7,
      rightLarge: 12,
      left: -7,
      up: -6,
      upLarge: -12,
      down: 7,
      downLarge: 18
    });
    const STROKE = Object.freeze({
      axis: 2,
      guide: 1,
      line: 4,
      boundary: 3,
      mark: 2,
      dash: 8,
      gap: 7
    });
    const FONT = Object.freeze({
      normal: 15,
      small: 13,
      fallback: 15
    });

    try {
      const svg = document.querySelector("#diagram");
      const namespace = "http://www.w3.org/2000/svg";

      const make = (name, attributes, content) => {
        const node = document.createElementNS(namespace, name);
        Object.entries(attributes).forEach(([key, value]) => {
          node.setAttribute(key, String(value));
        });
        if (content !== undefined) node.textContent = content;
        return node;
      };

      const append = node => svg.appendChild(node);

      const segment = (points, className, width, extra) => {
        const [from, to] = points;
        append(make("line", {
          x1: sx(from.x),
          y1: sy(from.y),
          x2: sx(to.x),
          y2: sy(to.y),
          class: className,
          "stroke-width": width,
          "vector-effect": "non-scaling-stroke",
          ...extra
        }));
      };

      const polyline = (points, className, width, extra) => {
        append(make("polyline", {
          points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
          class: className,
          "stroke-width": width,
          "stroke-linecap": "round",
          "stroke-linejoin": "round",
          "vector-effect": "non-scaling-stroke",
          ...extra
        }));
      };

      const polygon = (points, className, width) => {
        append(make("polygon", {
          points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
          class: className,
          "stroke-width": width,
          "stroke-linejoin": "round",
          "vector-effect": "non-scaling-stroke"
        }));
      };

      segment(DATA.axes.x, "axis", STROKE.axis, {});
      segment(DATA.axes.y, "axis", STROKE.axis, {});
      polygon(DATA.axes.xHead, "axis-head", STROKE.axis);
      polygon(DATA.axes.yHead, "axis-head", STROKE.axis);

      DATA.guides.forEach((guide, kind) => {
        segment(
          guide,
          "guide",
          STROKE.guide,
          kind === DATA.guides.keys
            ? {}
            : { "stroke-dasharray": `${STROKE.dash} ${STROKE.gap}` }
        );
      });

      DATA.ticks.forEach(tick => {
        segment(tick, "axis", STROKE.axis, {});
      });

      polyline(DATA.boundary, "boundary", STROKE.boundary, {
        "stroke-dasharray": `${STROKE.dash} ${STROKE.gap}`
      });
      polyline(DATA.fixed, "fixed", STROKE.line, {});
      polyline(DATA.sequential, "sequential", STROKE.line, {});

      polygon(DATA.fixedMark, "fixed-mark", STROKE.mark);
      polygon(DATA.sequentialMark, "sequential-mark", STROKE.mark);

      DATA.labels.forEach(label => {
        append(make("text", {
          x: sx(label.x),
          y: sy(label.y),
          dx: LABEL_PAD[label.dx],
          dy: LABEL_PAD[label.dy],
          "text-anchor": label.anchor,
          class: label.className,
          "font-size": label.className.includes("small")
            ? FONT.small
            : FONT.normal
        }, label.text));
      });

      DATA.legend.forEach(item => {
        segment(
          item.segment,
          item.className,
          item.className === "boundary" ? STROKE.boundary : STROKE.line,
          item.className === "boundary"
            ? { "stroke-dasharray": `${STROKE.dash} ${STROKE.gap}` }
            : {}
        );
        append(make("text", {
          x: sx(item.x),
          y: sy(item.y),
          dx: LABEL_PAD.right,
          dy: LABEL_PAD.down,
          "text-anchor": "start",
          class: "small muted",
          "font-size": FONT.small
        }, item.text));
      });
    } catch (error) {
      const svg = document.querySelector("#diagram");
      const namespace = "http://www.w3.org/2000/svg";
      const message = document.createElementNS(namespace, "text");
      message.setAttribute("x", String(sx(0)));
      message.setAttribute("y", String(sy(4.8)));
      message.setAttribute("class", "fallback strong");
      message.setAttribute("font-size", String(FONT.fallback));
      message.textContent =
        "Схема: фиксированный тест идёт до 14-го дня,";
      svg.appendChild(message);

      const continuation = document.createElementNS(namespace, "text");
      continuation.setAttribute("x", String(sx(0)));
      continuation.setAttribute("y", String(sy(4.3)));
      continuation.setAttribute("class", "fallback");
      continuation.setAttribute("font-size", String(FONT.fallback));
      continuation.textContent =
        "а последовательный останавливается при пересечении заранее заданной границы.";
      svg.appendChild(continuation);
    }
  </script>
</body>
</html>
