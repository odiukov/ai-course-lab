- concept: влияние overlap изолируют ablation-экспериментом, меняя только величину перекрытия
  question: Какой эксперимент позволяет определить, улучшает ли overlap качество retrieval в RAG?
  explanation: Только изменение одного фактора позволяет приписать разницу именно overlap. Если одновременно меняются модель, корпус или параметры retrieval, причины результата неразличимы.
  kind: choice
  options:
    - Сравнить два индекса с одинаковыми корпусом, размером чанка, сплиттером, embedding-моделью, запросами и top_k, изменив только overlap
    - Добавить overlap и одновременно подобрать более сильную embedding-модель
    - Сравнить индекс с overlap на новом корпусе с прежним индексом на старом корпусе
    - Добавить overlap, увеличить размер чанка и оценить несколько новых запросов
  correct: 0
  id: 035-overlap-ablation-1
  fingerprint: 35ad0ca7
- concept: overlap разрешают только при измеримом выигрыше, оправдывающем дополнительные расходы
  question: Объясни своими словами, по какому критерию следует решать, включать ли overlap в рабочем RAG-индексе.
  explanation: Overlap не является страховкой по умолчанию. Бенчмарки 2026 года показывают, что он нередко не улучшает retrieval, хотя индекс может стать почти вдвое дороже.
  kind: open
  reference: Нужно на одинаковом наборе запросов сопоставить прирост качества retrieval с ростом числа чанков, времени индексации и объёма хранения. Overlap стоит включать лишь тогда, когда подтверждённый выигрыш превышает заранее установленный порог и оправдывает расходы; без заметного выигрыша его оставляют выключенным.
  id: 035-overlap-ablation-2
  fingerprint: 26db2921
