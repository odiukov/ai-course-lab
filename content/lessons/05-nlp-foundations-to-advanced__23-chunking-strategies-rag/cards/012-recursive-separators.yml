- concept: рекурсивный вызов получает только ещё не опробованные разделители
  question: Рекурсивный сплиттер перебирает разделители от крупных границ к мелким. Фрагмент остался слишком большим после попытки применить текущий разделитель. Какой набор разделителей нужно передать рекурсивному вызову?
  explanation: Рекурсия должна продолжать спуск к более мелким границам. Поэтому ей передают срез после текущего элемента — `seps[i + 1:]`. Возврат к уже проверенным разделителям не помогает разбить этот фрагмент.
  kind: choice
  options:
    - Только разделители, стоящие после текущего
    - Весь исходный список разделителей
    - Текущий разделитель и все стоящие перед ним
    - Только первый разделитель исходного списка
  correct: 0
  id: 012-recursive-separators-1
  fingerprint: eeb45d0c
- concept: fixed chunking служит запасным способом разбиения при отсутствии подходящих разделителей
  question: Что должен сделать рекурсивный сплиттер с фрагментом длиннее лимита, если в нём нет ни одного доступного разделителя?
  explanation: Если структурных границ нет, рекурсивный спуск продолжать невозможно. Реализация вызывает `chunk_fixed`, чтобы гарантированно получить фрагменты, не превышающие заданный размер.
  kind: choice
  options:
    - Вернуть фрагмент целиком, несмотря на превышение лимита
    - Отбросить фрагмент как неразбиваемый
    - Перейти к фиксированной нарезке по размеру
    - Повторно проверить те же разделители
  correct: 2
  id: 012-recursive-separators-2
  fingerprint: 33c83431
- concept: рекурсивный сплиттер дробит только превышающие лимит части
  question: Объясни своими словами, почему рекурсивный сплиттер применяет более мелкий разделитель только к слишком крупным частям, а не переделывает всю нарезку документа.
  explanation: При разбиении по текущему разделителю допустимые части собираются в чанки, а слишком длинные отдельно передаются в рекурсию со следующими разделителями. Так сохраняются крупные смысловые блоки везде, где это позволяет лимит.
  kind: open
  reference: Части, уже укладывающиеся в лимит, сохраняют найденные крупные структурные границы. Рекурсивное разбиение требуется только превышающим лимит фрагментам, поэтому остальной документ не дробится без необходимости.
  id: 012-recursive-separators-3
  fingerprint: 3566b585
