- concept: накопленный буфер выгружается до рекурсивной обработки длинной части, чтобы сохранить порядок текста
  question: Расставь действия рекурсивного сплиттера, когда очередная часть сама превышает допустимый размер.
  explanation: Буфер содержит текст, расположенный перед длинной частью, поэтому его нужно сохранить первым. Затем длинная часть рекурсивно дробится, а её подчанки добавляются следом без нарушения исходного порядка.
  kind: order
  items:
    - Добавить непустой буфер в список готовых чанков
    - Очистить буфер
    - Рекурсивно разбить длинную часть более мелкими разделителями
    - Добавить полученные подчанки в общий список и продолжить обработку
  id: 013-chunk-recursive-2
  fingerprint: 289f937b
