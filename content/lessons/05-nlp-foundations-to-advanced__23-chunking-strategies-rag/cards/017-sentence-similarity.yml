- concept: скалярное произведение нормализованных эмбеддингов равно косинусной близости
  question: Зачем нормализовать эмбеддинги предложений перед вычислением их скалярного произведения?
  explanation: После нормализации длины обоих векторов равны единице, поэтому их скалярное произведение совпадает с косинусной близостью и отражает сходство направлений.
  kind: choice
  options:
    - Чтобы результат зависел только от угла между векторами, а не от их длин
    - Чтобы увеличить размерность эмбеддингов
    - Чтобы превратить каждую координату в целое число
    - Чтобы сделать порядок предложений значимым
  correct: 0
  id: 017-sentence-similarity-1
  fingerprint: 24f4b2bf
- concept: близость пары предложений вычисляется скалярным произведением их нормализованных эмбеддингов
  question: Заполни выражение, которое возвращает близость двух предложений как обычный Python float.
  explanation: Оператор @ вычисляет скалярное произведение нормализованных векторов, а float преобразует возможный NumPy-скаляр в обычное число Python.
  kind: cloze
  template: |-
    left_emb, right_emb = encoder.encode([left_sentence, right_sentence], normalize_embeddings=True)
    return ___
  answer: float(left_emb @ right_emb)
  accept:
    - float(right_emb @ left_emb)
  id: 017-sentence-similarity-2
  fingerprint: '55307076'
- concept: оба предложения следует кодировать одним пакетным вызовом энкодера
  question: Объясни своими словами, почему пару предложений для сравнения полезно передавать в encoder.encode одним списком, а не делать отдельный вызов для каждого предложения.
  explanation: Пакетная обработка уменьшает накладные расходы вызовов модели. Полученные эмбеддинги по-прежнему можно распаковать и сравнить скалярным произведением.
  kind: open
  reference: Один пакетный вызов позволяет энкодеру обработать оба предложения вместе и обычно эффективнее двух отдельных вызовов, при этом возвращая отдельный эмбеддинг для каждого предложения.
  id: 017-sentence-similarity-3
  fingerprint: 3e839f01
