- concept: граница предложения проходит после завершающего знака, сохраняя пунктуацию внутри чанка
  question: Какое правило нарезки сохраняет предложения законченными вместе с их пунктуацией?
  explanation: Граница должна находиться после точки, вопросительного или восклицательного знака. Тогда знак остаётся частью завершённого предложения и не теряется при нарезке.
  kind: choice
  options:
    - Разрезать после завершающего знака перед началом следующего предложения
    - Удалить завершающий знак и разрезать на его месте
    - Разрезать непосредственно перед завершающим знаком
  correct: 0
  id: 007-sentence-boundaries-1
  fingerprint: e3f4d98f
- concept: очистка результатов нарезки по предложениям предотвращает появление пустых чанков
  question: Расположите этапы подготовки чанков по границам предложений в правильном порядке.
  explanation: Сначала получают кандидаты в чанки, затем нормализуют пробелы по краям и только после этого проверяют содержимое. Иначе фрагмент из пробелов или переносов строк можно ошибочно отправить в индекс.
  kind: order
  items:
    - Разделить текст по найденным границам предложений
    - Удалить пробельные символы по краям каждого фрагмента
    - Отбросить фрагменты, которые после очистки оказались пустыми
  id: 007-sentence-boundaries-2
  fingerprint: 80d37b10
- concept: сокращения и инициалы требуют исключений из простого правила границы по точке
  question: Почему нельзя считать каждую точку безусловным концом предложения и как это учитывать при sentence chunking?
  explanation: Простое правило по знаку пунктуации предсказуемо, но не различает конец фразы и точку внутри сокращения. Исключения стоит добавлять на основе конструкций, реально встречающихся в индексируемых документах.
  kind: open
  reference: Точка может входить в сокращение, инициалы или другое внутрипредложенческое обозначение. Для таких документов используют токенизатор предложений либо добавляют правила и доменные исключения, запрещающие разрез в известных конструкциях.
  id: 007-sentence-boundaries-3
  fingerprint: 66d019e6
