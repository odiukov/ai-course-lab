- concept: диалоговый корпус следует делить по репликам с сохранением роли говорящего
  question: В базе знаний хранятся переписки службы поддержки. Пользователи часто спрашивают, что именно сообщил клиент или оператор. Какая стратегия нарезки лучше всего сохраняет нужную структуру?
  explanation: Для диалогов естественной структурной единицей служит реплика. Метаданные о говорящем позволяют отличать слова клиента от ответа оператора и использовать это различие при поиске.
  kind: choice
  options:
    - Делить каждую переписку на равные фрагменты без метаданных
    - Создавать отдельный чанк для каждой реплики и сохранять говорящего в метаданных
    - Объединять все переписки за день в один чанк
    - Разрезать текст только при резкой смене семантической близости
  correct: 1
  id: 041-production-choice-1
  fingerprint: 93fa8f3c
- concept: частые перекрёстные ссылки требуют сохранения контекста за пределами локального фрагмента
  question: Почему для договоров и научных статей с частыми ссылками на другие разделы стоит рассматривать late chunking или contextual retrieval?
  explanation: Обычный локальный чанк может содержать ссылку вроде «согласно указанному исключению», не раскрывая её смысла. Late chunking и contextual retrieval помогают перенести в поисковое представление недостающий межсекционный контекст.
  kind: open
  reference: Локальный фрагмент часто невозможно правильно понять без контекста связанного раздела или всего документа. Late chunking формирует его представление с учётом документа, а contextual retrieval добавляет пояснение о месте фрагмента в общем контексте.
  id: 041-production-choice-2
  fingerprint: 882e36ec
- concept: неизвестный корпус требует нейтрального базового разбиения, измерения качества и последующей настройки
  question: Расположите действия при первом запуске RAG над ещё не изученным корпусом в правильном порядке.
  explanation: Рекомендуемый baseline — recursive по 512 токенов без overlap. Затем измеряют recall@5 на 50 запросах и только после этого подбирают размер или специализированную стратегию под документы и типы вопросов.
  kind: order
  items:
    - Запустить нейтральный recursive baseline без overlap
    - Измерить качество поиска на репрезентативном наборе запросов
    - Изменять стратегию и параметры с учётом структуры корпуса и распределения запросов
  id: 041-production-choice-3
  fingerprint: 0837ea2e
