- concept: качество chunking нужно оценивать отдельно на factoid, analytical и multi-hop запросах
  question: Как сравнить стратегии chunking, если продукт обрабатывает запросы с локальным фактом, анализом широкого контекста и связыванием разнесённых свидетельств?
  explanation: Разные стратегии chunking могут лидировать на разных типах запросов. Отдельные результаты для factoid, analytical и multi-hop запросов показывают профиль стратегии, который скрывает единая средняя метрика.
  kind: choice
  options:
    - Заранее разметить тип каждого запроса и вычислить метрику отдельно для каждого типа
    - Объединить все запросы и сравнивать стратегии только по общей метрике
    - Оставить в наборе только запросы самого частого типа
  correct: 0
  id: 037-stratified-eval-1
  fingerprint: 77ff5a82
- concept: агрегированная метрика зависит от долей типов запросов в evaluation-наборе
  question: Заполни пропуск в формуле общей метрики, взвешенной по составу evaluation-набора.
  explanation: Общая оценка является взвешенной комбинацией результатов по слоям. Поэтому изменение долей factoid, analytical и multi-hop запросов может изменить итогового победителя, даже если метрики внутри каждого слоя остались прежними.
  kind: cloze
  template: aggregate = sum(query_type_share[t] * ___[t] for t in query_types)
  answer: recall_by_type
  accept:
    - metric_by_type
    - recall_at_k_by_type
  id: 037-stratified-eval-2
  fingerprint: fabc44ed
- concept: размер каждого слоя evaluation-набора нужен для интерпретации его метрики
  question: Почему рядом с Recall@k для каждого типа запросов следует указывать количество запросов в этом слое?
  explanation: Одинаково оформленные значения Recall@k могут создавать ложное впечатление равной надёжности. Число запросов показывает объём свидетельств за каждой оценкой и помогает не переоценить результат малочисленного слоя.
  kind: open
  reference: 'Чтобы было видно, на каком объёме данных получена метрика: результат малого слоя менее устойчив и не должен восприниматься как столь же надёжный, как результат большого слоя.'
  id: 037-stratified-eval-3
  fingerprint: 9325de76
