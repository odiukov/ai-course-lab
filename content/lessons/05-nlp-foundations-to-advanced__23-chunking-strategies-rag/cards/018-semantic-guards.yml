- concept: минимальная длина при разрезе не гарантирует допустимую длину последнего semantic-чанка
  question: Почему проверка минимальной длины текущего чанка перед каждой семантической границей не гарантирует, что последний чанк тоже достигнет минимума? Как это исправить?
  explanation: Условие с min_chars защищает закрываемый чанк, но не новый хвост в конце документа. Поэтому реализация отдельно проверяет последний чанк и подклеивает его к предыдущему. Если чанк единственный, объединять его не с чем.
  kind: open
  reference: Проверка относится к чанку, который собираются закрыть. Последний открытый чанк цикл уже не проверяет, поэтому после группировки короткий хвост нужно присоединить к предыдущему чанку, если предыдущий существует.
  id: 018-semantic-guards-1
  fingerprint: faf09842
- concept: максимальная длина применяется после семантической группировки как жёсткое ограничение размера
  question: Соседние предложения остаются семантически близкими, и алгоритм собрал группу длиннее допустимого максимума. Что должна сделать описанная реализация?
  explanation: threshold может долго не находить смену темы, поэтому после семантической сборки действует max_chars. Превысившую лимит группу передают в recursive chunking, а группы допустимого размера сохраняют без дополнительного разбиения.
  kind: choice
  options:
    - Дополнительно разбить только эту группу рекурсивным сплиттером
    - Отбросить последние предложения группы
    - Повторно вычислять эмбеддинги, пока близость не уменьшится
    - Оставить группу целой, поскольку семантическая связность важнее лимита
  correct: 0
  id: 018-semantic-guards-2
