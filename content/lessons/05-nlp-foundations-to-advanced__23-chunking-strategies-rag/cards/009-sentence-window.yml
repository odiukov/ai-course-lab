- concept: размер окна предложений задаёт компромисс между сохранением контекста и точностью поиска
  question: Объясни своими словами, почему слишком широкое окно предложений может ухудшить retrieval, хотя содержит больше контекста.
  explanation: Увеличение окна помогает восстановить смысл местоимений и соседних условий лишь до определённого предела. Затем дополнительный текст размывает релевантный сигнал и может вытеснить нужный чанк из лучших результатов поиска.
  kind: open
  reference: В широкое окно вместе с ответом попадает посторонний текст. Из-за смешения тем представление чанка становится менее точным, поэтому ретриверу сложнее высоко ранжировать его по конкретному запросу. Окно должно сохранять необходимые ссылки, условия и причины, но не добавлять лишний шум.
