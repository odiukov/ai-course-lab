- concept: объём извлечённого контекста при фиксированном top-K линейно зависит от размера чанка
  question: Заполни формулу для приблизительного объёма текста, возвращаемого ретривером, если все чанки имеют одинаковый размер.
  explanation: Ретривер возвращает K чанков, поэтому их суммарный объём приблизительно равен произведению K на размер чанка. Увеличение чанка при неизменном K пропорционально увеличивает контекст запроса.
  kind: cloze
  template: retrieved_tokens ≈ ___
  answer: top_k * chunk_size
  accept:
    - top_k × chunk_size
    - chunk_size * top_k
    - K * chunk_size
  id: 034-context-cliff-1
  fingerprint: 5501b8c8
- concept: context cliff означает ухудшение работы модели ещё до достижения жёсткого лимита контекстного окна
  question: Что точнее всего описывает context cliff в RAG-системе?
  explanation: Жёсткий лимит окна показывает, сколько токенов модель способна принять, но не гарантирует, что она одинаково хорошо использует весь этот объём. Несколько крупных результатов добавляют шум и могут вызвать заметное падение качества раньше переполнения окна.
  kind: choice
  options:
    - Ретривер перестаёт находить документы, если запрос длиннее одного чанка
    - Качество ответа резко ухудшается из-за избытка контекста, хотя модель ещё технически принимает весь запрос
    - Модель автоматически отбрасывает самый длинный найденный чанк
    - Векторная база запрещает индексировать чанки разного размера
  correct: 1
  id: 034-context-cliff-2
  fingerprint: ce44d383
