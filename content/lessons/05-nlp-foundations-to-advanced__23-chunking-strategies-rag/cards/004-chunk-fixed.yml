- concept: короткий остаток текста сохраняется как последний чанк
  question: Что должна сделать фиксированная нарезка, если в конце текста осталось меньше символов, чем вмещает окно?
  explanation: 'Срез строки сам останавливается на её конце, поэтому остаток становится коротким последним чанком. Отбрасывать его нельзя: в нём может находиться существенная часть ответа.'
  kind: choice
  options:
    - Отбросить остаток как слишком короткий
    - Дополнить остаток пробелами до полной длины
    - Сохранить остаток отдельным коротким чанком
    - Всегда присоединить остаток к предыдущему чанку
  correct: 2
  id: 004-chunk-fixed-2
  fingerprint: f356efb0
- concept: фиксированная нарезка строки измеряет размер чанка в символах
  question: Объясни своими словами, что ограничивает параметр `size`, если `chunk_fixed` реализован с помощью срезов строки Python, и почему это не то же самое, что размер в токенах.
  explanation: Выражение `text[i:i + size]` работает с позициями строки. Оно ничего не знает о словах и токенах модели, поэтому фиксированный символьный размер не гарантирует фиксированную токенную длину.
  kind: open
  reference: '`size` задаёт максимальное количество позиций строки Python в чанке. Функция не запускает токенизатор, поэтому количество токенов в чанках может различаться даже при одинаковом числе символов.'
  id: 004-chunk-fixed-3
  fingerprint: 2e7b16a1
