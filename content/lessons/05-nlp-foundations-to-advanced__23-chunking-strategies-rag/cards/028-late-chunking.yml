- concept: вектор late-chunking-чанка отражает его смысл с учётом контекста документа, но не хранит весь документ
  question: Как правильно интерпретировать вектор чанка, созданный с помощью late chunking?
  explanation: Late chunking позволяет дальнему контексту повлиять на токенные представления до их объединения в вектор чанка. Однако такой вектор не содержит буквальную копию документа и не позволяет восстановить его текст.
  kind: choice
  options:
    - Это обратимое сжатие, из которого можно восстановить весь исходный документ
    - Это представление смысла чанка, сформированное с учётом контекста всего документа
    - Это объединение текстов всех чанков в одну строку перед индексацией
    - Это обычный независимо вычисленный вектор чанка с добавленным идентификатором документа
  correct: 1
  id: 028-late-chunking-1
  fingerprint: 7b37cc35
- concept: late chunking требует embedding-модели, способной совместно обработать весь документ
  question: Почему модель с коротким контекстным окном не сможет полноценно выполнить late chunking для длинного документа, даже если затем применить pooling токенных векторов?
  explanation: Pooling лишь объединяет уже рассчитанные токенные представления. Поэтому late chunking работает только тогда, когда embedding-модель сначала может обработать документ целиком и закодировать связи между удалёнными частями.
  kind: open
  reference: Модель должна увидеть весь документ совместно, чтобы токенные представления учитывали дальний контекст. Если начало документа не помещается в контекстное окно, эта информация не попадёт в токенные векторы последующих фрагментов, а pooling не сможет восстановить контекст, который модель не закодировала.
  id: 028-late-chunking-2
  fingerprint: 2cc76cbd
