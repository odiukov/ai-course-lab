- concept: финальный фрагмент без завершающего знака сохраняется при нарезке по предложениям
  question: Как sentence splitter должен обработать непустой текст в конце документа, если после него нет точки, вопросительного или восклицательного знака?
  explanation: 'Отсутствие завершающего знака не делает текст бесполезным: документы и сообщения нередко обрываются или заканчиваются без пунктуации. Поэтому непустой хвост нужно вернуть последним фрагментом.'
  kind: choice
  options:
    - Удалить его как незавершённое предложение
    - Сохранить его как последний фрагмент
    - Присоединить его к началу документа
  correct: 1
  id: 008-split-sentences-1
  fingerprint: a1487486
- concept: предложения служат базовыми единицами для последующей сборки контекстных окон
  question: Почему при sentence chunking полезно сначала надёжно выделить отдельные предложения, а уже потом объединять их в окна?
  explanation: Sentence chunking допускает как отдельные предложения, так и окна из нескольких предложений. Предварительное выделение устойчивых базовых фрагментов отделяет разбор текста от выбора объёма контекста.
  kind: open
  reference: Так границы смысловых единиц определяются один раз, после чего из предложений можно собирать окна нужного размера, не разрезая исходный текст заново и не обрывая предложения.
  id: 008-split-sentences-2
  fingerprint: b02dcc74
