- concept: semantic chunking обнаруживает локальную смену темы по близости соседних предложений
  question: Предложения A, B, C и D идут в документе именно в таком порядке. Какие пары сравнивает локальный semantic chunking при поиске смысловых границ?
  explanation: Метод последовательно сравнивает embedding каждого предложения с embedding непосредственно предыдущего. Резкое падение близости в очередной соседней паре указывает на возможную смену темы перед новым предложением.
  kind: choice
  options:
    - A–B, B–C и C–D
    - A–C и B–D
    - Каждое предложение со средним embedding всего документа
    - Все возможные пары предложений
  correct: 0
  id: 016-semantic-similarity-1
  fingerprint: b6319100
- concept: порог семантической близости управляет частотой границ между чанками
  question: Объясни своими словами, как повышение порога близости влияет на количество и размер семантических чанков.
  explanation: Граница рассматривается, когда близость соседних предложений ниже threshold. Чем выше threshold, тем больше пар попадает под это условие. При слишком низком пороге, наоборот, смены темы почти не фиксируются и могут возникать чрезмерно крупные чанки.
  kind: open
  reference: При повышении порога условие «близость ниже порога» выполняется чаще, поэтому границ становится больше, а чанки обычно получаются короче. Слишком высокий порог приводит к чрезмерно мелкой нарезке.
  id: 016-semantic-similarity-2
  fingerprint: f0408662
