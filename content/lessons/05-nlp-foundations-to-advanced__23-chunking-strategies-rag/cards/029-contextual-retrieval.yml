- concept: контекстуальная справка дополняет исходный чанк, а не заменяет его
  question: Как следует подготовить чанк к индексации при contextual retrieval, чтобы улучшить поиск и сохранить исходное свидетельство из документа?
  explanation: 'Справка служит дополнительным поисковым сигналом: она сообщает место и роль фрагмента в документе. Исходный чанк сохраняют неизменённым, поскольку именно он содержит первичный текст, а сгенерированный контекст может быть лишь его пересказом.'
  kind: choice
  options:
    - Заменить чанк сгенерированным моделью пересказом
    - Добавить сгенерированную контекстуальную справку перед неизменённым чанком
    - Индексировать справку и исходный чанк как независимые документы без связи
    - Удалить из чанка сведения, которые повторяются в справке
  correct: 1
  id: 029-contextual-retrieval-1
  fingerprint: '14290664'
- concept: последовательность подготовки индекса с contextual retrieval
  question: Расположите этапы построения индекса с contextual retrieval в правильном порядке.
  explanation: Сначала создаются исходные фрагменты. Затем модель определяет место каждого фрагмента с учётом всего документа, после чего справка объединяется именно со своим чанком. В индекс отправляется уже контекстуализированный текст.
  kind: order
  items:
    - Разбить документ на исходные чанки
    - Передать модели весь документ и поочерёдно каждый чанк для генерации контекстуальной справки
    - Соединить каждую справку с соответствующим исходным чанком
    - Построить эмбеддинги объединённых текстов и добавить их в индекс
  id: 029-contextual-retrieval-2
  fingerprint: ef659435
