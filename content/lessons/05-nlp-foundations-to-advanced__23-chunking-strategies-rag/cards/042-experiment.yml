- concept: MRR различает системы по позиции первого релевантного результата
  question: Две RAG-системы находят релевантный чанк в пределах одинакового порога выдачи для одних и тех же запросов, поэтому их Recall совпадает. Какая оценка покажет преимущество системы, которая обычно ставит первый релевантный чанк выше?
  explanation: Recall проверяет факт попадания релевантного чанка в ограниченную выдачу, а MRR учитывает обратный ранг первого подходящего результата. Поэтому более ранние попадания повышают MRR даже при одинаковом Recall.
  kind: choice
  options:
    - Средняя длина чанка
    - Общее число чанков в индексе
    - Доля документов с заголовками
    - Mean Reciprocal Rank
  correct: 3
  id: 042-experiment-1
  fingerprint: 44ee8712
- concept: честное сравнение стратегий chunking требует контролируемого эксперимента
  question: Расположите этапы контролируемого сравнения стратегий chunking в правильном порядке.
  explanation: Если вместе с chunking меняются корпус, embedding-модель или параметры поиска, различие результатов нельзя приписать одной стратегии. Сначала фиксируют условия, затем меняют единственный фактор и одинаково оценивают варианты.
  kind: order
  items:
    - Зафиксировать корпус, запросы, разметку релевантности, embedding-модель и параметры поиска
    - Построить варианты индекса, меняя только исследуемую стратегию chunking
    - Выполнить одинаковые запросы к каждому варианту и собрать метрики качества
    - Сопоставить качество границ, метрики поиска и стоимость индексации
  id: 042-experiment-2
  fingerprint: 30aeaaca
- concept: выбор стратегии chunking определяется соотношением качества поиска и стоимости индексации
  question: Почему стратегию chunking с наибольшим MRR нельзя автоматически объявлять лучшей для production-системы?
  explanation: В эксперименте contextual retrieval может улучшить ранжирование, но требует дополнительных LLM-вызовов для подготовки чанков. Практический выбор учитывает и точность, и цену каждого построения или обновления индекса.
  kind: open
  reference: 'Нужно сопоставить прирост качества с затратами на построение и обновление индекса: количеством чанков, объёмом вычисления embeddings и вызовами LLM. Небольшое улучшение MRR может не оправдать существенно более дорогую индексацию.'
  id: 042-experiment-3
  fingerprint: f4eea551
