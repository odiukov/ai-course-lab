- concept: gold-разметка релевантных чанков зависит от конкретного разбиения корпуса
  question: Две стратегии chunking создают из одних документов разные наборы чанков. Как подготовить gold-разметку для честного сравнения retrieval?
  explanation: После повторного разбиения индексы обозначают уже другие фрагменты текста. Поэтому gold-набор для каждой стратегии связывают с содержанием её чанков, а не переносят по номерам.
  kind: choice
  options:
    - Использовать одинаковые индексы чанков, поскольку исходные документы не изменились
    - Считать релевантным чанк с одинаковой позицией в результатах каждой стратегии
    - Отдельно определить релевантные чанки каждого разбиения по наличию свидетельства для ответа
  correct: 2
  id: 036-known-recall-1
  fingerprint: 57921a68
- concept: query-level Recall@k измеряет долю запросов, для которых top-k пересекается с набором релевантных чанков
  question: Объясни своими словами, что считается успешным запросом при вычислении query-level Recall@k и как из успехов отдельных запросов получается итоговая метрика.
  explanation: 'В реализации из урока Recall@5 использует бинарный результат для каждого запроса: попадание есть или его нет. Несколько релевантных чанков в пятёрке не увеличивают вклад одного запроса.'
  kind: open
  reference: Запрос считается успешным, если среди k наиболее близких чанков найден хотя бы один релевантный. Recall@k равен числу таких запросов, делённому на общее число запросов.
  id: 036-known-recall-2
  fingerprint: 4678582f
