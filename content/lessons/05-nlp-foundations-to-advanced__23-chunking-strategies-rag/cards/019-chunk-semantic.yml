- concept: пустой результат нарезки по предложениям нужно обработать до кодирования и обращения к первому элементу
  question: Зачем функции семантического чанкинга сразу возвращать пустой список, если разбиение текста не дало ни одного предложения?
  explanation: Без раннего возврата функция попытается создать первую группу из отсутствующего предложения. Кроме того, вызов энкодера для пустого набора не нужен и может не поддерживаться его реализацией.
  kind: choice
  options:
    - Чтобы автоматически снизить порог семантической близости
    - Чтобы заменить пустой документ одним служебным чанком
    - Чтобы принудительно вызвать запасной рекурсивный сплиттер
    - Чтобы не кодировать пустой набор и не обращаться к отсутствующему первому предложению
  correct: 3
  id: 019-chunk-semantic-1
  fingerprint: 3f807f09
- concept: единственную короткую семантическую группу нельзя подклеить к несуществующей предыдущей группе
  question: Почему короткий документ, образовавший всего одну семантическую группу, должен остаться самостоятельным чанком, а не проходить исправление короткого хвоста?
  explanation: Проверка количества групп защищает обращение к предыдущему чанку. Ограничение min_chars управляет разрешением на внутренние разрезы, но не требует искусственно дополнять весь короткий документ.
  kind: open
  reference: Исправление хвоста предполагает перенос последней группы в предыдущую. У единственной группы предыдущей нет, поэтому объединять её не с чем; короткий документ допустимо вернуть как один короткий чанк.
  id: 019-chunk-semantic-2
  fingerprint: a757bff9
