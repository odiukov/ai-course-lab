- concept: родительские чанки нужно дедуплицировать после поиска по дочерним чанкам
  question: В parent-document RAG лучшие дочерние чанки ссылаются на родителей A, A, B и A. Что следует передать модели в качестве контекста?
  explanation: Несколько релевантных детей могут вести к одному родителю. Повторная передача этого родителя не добавляет информации, но расходует контекст, поэтому родителей дедуплицируют по идентификатору.
  kind: choice
  options:
    - По одному экземпляру родителей A и B
    - Все найденные экземпляры родителей в порядке дочерних чанков
    - Только родителя A, поскольку он встречается чаще
    - Сами дочерние чанки без родителей
  correct: 0
  id: 022-parent-child-1
  fingerprint: ded7e5fa
- concept: child_top_k ограничивает число выбранных дочерних чанков, а не число возвращённых родителей
  question: Почему в parent-document RAG число возвращённых родительских чанков может оказаться меньше значения child_top_k?
  explanation: При child_top_k=3 все три найденных ребёнка могут принадлежать одному родителю. Тогда после дедупликации система вернёт один родительский чанк, а не три.
  kind: open
  reference: Параметр child_top_k задаёт число лучших дочерних чанков. Несколько из них могут ссылаться на одного родителя, поэтому после дедупликации уникальных родителей останется меньше.
  id: 022-parent-child-2
  fingerprint: c7d1ea6a
- concept: заданное число уникальных родителей получают расширением пула детей и остановкой после заполнения набора родителей
  question: Расположи действия алгоритма parent-document RAG в правильном порядке, если нужно получить N уникальных родительских чанков.
  explanation: 'Фиксированный небольшой child_top_k не гарантирует нужное число родителей: несколько детей могут вести к одному из них. Поэтому пул детей расширяют и обходят до заполнения набора уникальных родителей.'
  kind: order
  items:
    - Ранжировать дочерние чанки по близости к запросу
    - Последовательно обходить расширенный список лучших дочерних чанков
    - Добавлять родителя очередного ребёнка, только если его ещё нет в наборе
    - Остановиться, когда собрано N уникальных родителей
  id: 022-parent-child-3
  fingerprint: 4ee692ea
