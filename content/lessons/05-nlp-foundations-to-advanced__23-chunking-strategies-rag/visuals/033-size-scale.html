<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Размер чанка: от факта к разделу</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f9fc;
      --panel: #ffffff;
      --text: #172033;
      --muted: #5e6b82;
      --axis: #65738c;
      --guide: #d5dce8;
      --fact: #d9efff;
      --fact-line: #1687c9;
      --fact-text: #07557f;
      --analysis: #e7e0ff;
      --analysis-line: #7656d6;
      --analysis-text: #4b329b;
      --section: #d9f3e4;
      --section-line: #269861;
      --section-text: #12603b;
      --accent: #d26a22;
      --accent-soft: #fff0df;
      --shadow: rgba(31, 45, 72, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111722;
        --panel: #182130;
        --text: #edf3ff;
        --muted: #aab8ce;
        --axis: #9aaac2;
        --guide: #354258;
        --fact: #153d56;
        --fact-line: #54b6ee;
        --fact-text: #c8edff;
        --analysis: #322958;
        --analysis-line: #a88dff;
        --analysis-text: #e5dcff;
        --section: #173f31;
        --section-line: #58c98d;
        --section-text: #d0f6df;
        --accent: #ffad6f;
        --accent-soft: #4a2c1b;
        --shadow: rgba(0, 0, 0, 0.28);
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    body {
      min-width: 320px;
    }

    .figure {
      width: 100%;
      max-height: 520px;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--guide);
      box-shadow: 0 8px 28px var(--shadow);
    }

    .figure__header {
      padding: 16px 22px 10px;
      border-bottom: 1px solid var(--guide);
      background: var(--panel);
    }

    h1 {
      margin: 0;
      color: var(--text);
      font-size: 22px;
      font-weight: 760;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .figure__subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }

    #stage {
      width: 100%;
      background: var(--panel);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 430px;
      background: var(--panel);
    }

    .axis,
    .tick,
    .guide,
    .bracket,
    .leader {
      vector-effect: non-scaling-stroke;
      shape-rendering: geometricPrecision;
    }

    .axis {
      stroke: var(--axis);
      stroke-width: 2;
      stroke-linecap: round;
    }

    .tick {
      stroke: var(--axis);
      stroke-width: 2;
      stroke-linecap: round;
    }

    .guide {
      stroke: var(--guide);
      stroke-width: 1;
      stroke-dasharray: 5 6;
    }

    .band {
      stroke-width: 52;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .band.fact {
      stroke: var(--fact);
    }

    .band.analysis {
      stroke: var(--analysis);
    }

    .band.section {
      stroke: var(--section);
    }

    .band-edge {
      stroke-width: 5;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .band-edge.fact {
      stroke: var(--fact-line);
    }

    .band-edge.analysis {
      stroke: var(--analysis-line);
    }

    .band-edge.section {
      stroke: var(--section-line);
    }

    .range-dot {
      vector-effect: non-scaling-stroke;
      stroke-width: 2;
    }

    .range-dot.fact {
      fill: var(--panel);
      stroke: var(--fact-line);
    }

    .range-dot.analysis {
      fill: var(--panel);
      stroke: var(--analysis-line);
    }

    .range-dot.section {
      fill: var(--panel);
      stroke: var(--section-line);
    }

    text {
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      user-select: none;
    }

    .scale-label {
      fill: var(--text);
      font-size: 16px;
      font-weight: 690;
    }

    .axis-caption {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 620;
      letter-spacing: 0.02em;
    }

    .direction-label {
      fill: var(--muted);
      font-size: 16px;
      font-weight: 650;
    }

    .task-label {
      font-size: 17px;
      font-weight: 760;
    }

    .task-label.fact,
    .range-label.fact {
      fill: var(--fact-text);
    }

    .task-label.analysis,
    .range-label.analysis {
      fill: var(--analysis-text);
    }

    .task-label.section,
    .range-label.section {
      fill: var(--section-text);
    }

    .range-label {
      font-size: 18px;
      font-weight: 780;
      font-variant-numeric: tabular-nums;
    }

    .context-label {
      fill: var(--muted);
      font-size: 13px;
      font-weight: 560;
    }

    .bracket {
      fill: none;
      stroke: var(--accent);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .bracket-label {
      fill: var(--accent);
      font-size: 18px;
      font-weight: 790;
    }

    .arrow-head {
      fill: var(--axis);
    }

    .fallback {
      margin: 0;
      padding: 24px;
      color: var(--text);
      background: var(--accent-soft);
      font-size: 16px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="figure" aria-labelledby="diagram-title">
    <header class="figure__header">
      <h1 id="diagram-title">Размер чанка: от короткого факта до понимания раздела</h1>
      <p class="figure__subtitle">
        Чем больше смысловая дуга ответа, тем больше связанного текста нужно вернуть
      </p>
    </header>
    <div id="stage" aria-live="polite"></div>
  </main>

  <script>
    const DATA = [
      [105, 24],
      [11.2, 9.15],
      [0, 90, 6, 4.7, 7.3, 87.6],
      [
        [12, "256"],
        [36, "512"],
        [60, "1024"],
        [84, "2048"]
      ],
      [
        ["fact", 12, 36, 15, 24, "Короткий факт", "256–512 токенов", "ответ в одной строке"],
        ["analysis", 36, 60, 24, 48, "Аналитический / многошаговый", "512–1024 токенов", "сопоставление нескольких фрагментов"],
        ["section", 60, 84, 33, 72, "Понимание целого раздела", "1024–2048 токенов", "тезис, аргументы и вывод"]
      ],
      [2, 9, 14, 16.5, 12.5, 25.5, 21.5, 34.5, 30.5],
      [12, 84, 38.2, 40.2, 41.7, 48],
      [90, 8.7, 45, 1.8],
      [3.9, 7.9],
      [1.8, 3.6],
      [0, 0],
      ["Размер чанка по типу запроса", "Токены растут слева направо"],
      [1200, 430]
    ];

    const [
      originPair,
      scalePair,
      axisData,
      tickData,
      bandData,
      labelRows,
      bracketData,
      captionData,
      tickSpan,
      dotSpan,
      zeroPoint,
      accessibleText,
      canvasSize
    ] = DATA;

    const origin = Object.freeze({ x: originPair.shift(), y: originPair.shift() });
    const scale = Object.freeze({ x: scalePair.shift(), y: scalePair.shift() });
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const PAD = 10;
    const STROKE = 2;
    const FONT = 18;

    try {
      const stage = document.getElementById("stage");
      const NS = "http://www.w3.org/2000/svg";

      const make = (name, attributes, text) => {
        const element = document.createElementNS(NS, name);
        Object.entries(attributes || {}).forEach(([key, value]) => {
          element.setAttribute(key, String(value));
        });
        if (text !== undefined) {
          element.textContent = text;
        }
        return element;
      };

      const line = (x1, y1, x2, y2, className) =>
        make("line", {
          x1: sx(x1),
          y1: sy(y1),
          x2: sx(x2),
          y2: sy(y2),
          class: className
        });

      const textAt = (x, y, content, className, anchor) =>
        make("text", {
          x: sx(x),
          y: sy(y),
          class: className,
          "text-anchor": anchor,
          "dominant-baseline": "middle"
        }, content);

      const circleAt = (x, y, radiusX, className) =>
        make("circle", {
          cx: sx(x),
          cy: sy(y),
          r: sx(radiusX) - sx(zeroPoint[0]),
          class: className
        });

      const svg = make("svg", {
        viewBox: `0 0 ${canvasSize[0]} ${canvasSize[1]}`,
        width: canvasSize[0],
        height: canvasSize[1],
        preserveAspectRatio: "xMidYMid meet",
        role: "img",
        "aria-labelledby": "svg-title svg-desc"
      });

      svg.append(
        make("title", { id: "svg-title" }, accessibleText[0]),
        make(
          "desc",
          { id: "svg-desc" },
          "Шкала показывает диапазоны: 256–512 токенов для короткого факта, " +
          "512–1024 для аналитического или многошагового вопроса и " +
          "1024–2048 для понимания целого раздела. Полный диапазон отличается в 8 раз."
        )
      );

      const [
        axisStart,
        axisEnd,
        axisY,
        arrowTop,
        arrowBottom,
        arrowBack
      ] = axisData;

      const [tickTop, tickBottom] = tickSpan;
      const [dotRadius] = dotSpan;
      const [
        directionY,
        axisCaptionY,
        factRangeY,
        factContextY,
        analysisRangeY,
        analysisContextY,
        sectionRangeY,
        sectionContextY
      ] = labelRows;

      svg.append(
        textAt(
          captionData[2],
          captionData[3],
          "Сложнее вопрос → больше связанного контекста",
          "direction-label",
          "middle"
        ),
        line(axisStart, axisY, axisEnd, axisY, "axis"),
        make("polygon", {
          points: [
            `${sx(arrowBack)},${sy(arrowTop)}`,
            `${sx(axisEnd)},${sy(axisY)}`,
            `${sx(arrowBack)},${sy(arrowBottom)}`
          ].join(" "),
          class: "arrow-head"
        }),
        textAt(
          captionData[0],
          captionData[1],
          accessibleText[1],
          "axis-caption",
          "end"
        )
      );

      tickData.forEach(([x, label]) => {
        svg.append(
          line(x, tickTop, x, tickBottom, "tick"),
          textAt(x, directionY, label, "scale-label", "middle")
        );
      });

      bandData.forEach(([
        className,
        start,
        end,
        row,
        center,
        task,
        range,
        context
      ]) => {
        svg.append(
          line(start, axisY, start, row, "guide"),
          line(end, axisY, end, row, "guide"),
          line(start, row, end, row, `band ${className}`),
          line(start, row, end, row, `band-edge ${className}`),
          circleAt(start, row, dotRadius, `range-dot ${className}`),
          circleAt(end, row, dotRadius, `range-dot ${className}`),
          textAt(
            center,
            row,
            task,
            `task-label ${className}`,
            "middle"
          )
        );

        const rangeY =
          className === bandData[0][0]
            ? factRangeY
            : className === bandData[1][0]
              ? analysisRangeY
              : sectionRangeY;

        const contextY =
          className === bandData[0][0]
            ? factContextY
            : className === bandData[1][0]
              ? analysisContextY
              : sectionContextY;

        svg.append(
          textAt(
            center,
            rangeY,
            range,
            `range-label ${className}`,
            "middle"
          ),
          textAt(
            center,
            contextY,
            context,
            "context-label",
            "middle"
          )
        );
      });

      const [
        bracketStart,
        bracketEnd,
        bracketTop,
        bracketBase,
        bracketLabelY,
        bracketCenter
      ] = bracketData;

      svg.append(
        make("path", {
          d: [
            `M ${sx(bracketStart)} ${sy(bracketTop)}`,
            `L ${sx(bracketStart)} ${sy(bracketBase)}`,
            `L ${sx(bracketEnd)} ${sy(bracketBase)}`,
            `L ${sx(bracketEnd)} ${sy(bracketTop)}`
          ].join(" "),
          class: "bracket"
        }),
        textAt(
          bracketCenter,
          bracketLabelY,
          "в 8 раз: от нижней границы факта до верхней границы раздела",
          "bracket-label",
          "middle"
        )
      );

      svg.style.setProperty("--label-padding", `${PAD}px`);
      svg.style.setProperty("--base-stroke", `${STROKE}px`);
      svg.style.setProperty("--base-font", `${FONT}px`);
      stage.replaceChildren(svg);
    } catch (error) {
      const stage = document.getElementById("stage");
      const fallback = document.createElement("p");
      fallback.className = "fallback";
      fallback.textContent =
        "Схема должна была показать растущую шкалу размера чанка: " +
        "256–512 токенов для короткого факта, 512–1024 для аналитического " +
        "или многошагового вопроса и 1024–2048 для понимания целого раздела. " +
        "Между нижней и верхней границами — разница в 8 раз.";
      stage.replaceChildren(fallback);
    }
  </script>
</body>
</html>
