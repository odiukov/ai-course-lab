<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Двухуровневый индекс parent-document</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f9fc;
    --panel: #ffffff;
    --panel-soft: #eef3f8;
    --ink: #172033;
    --muted: #667085;
    --line: #aab5c5;
    --search: #5b6ee1;
    --search-soft: #e8ebff;
    --parent-a: #d97706;
    --parent-a-soft: #fff2d8;
    --parent-b: #087f8c;
    --parent-b-soft: #dcf7f5;
    --success: #18794e;
    --success-soft: #e3f5eb;
    --shadow: rgba(23, 32, 51, 0.10);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  body { padding: 10px 12px; }

  .figure {
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
    overflow: hidden;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 3px 14px var(--shadow);
  }

  .title {
    padding: 10px 16px 8px;
    border-bottom: 1px solid var(--line);
    font-size: 18px;
    font-weight: 750;
    letter-spacing: -0.01em;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 430px;
    background: var(--panel);
  }

  text {
    fill: var(--ink);
    font-family: inherit;
  }

  .muted { fill: var(--muted); }
  .section-label { fill: var(--muted); font-weight: 700; letter-spacing: 0.04em; }
  .box { fill: var(--panel-soft); stroke: var(--line); }
  .query-box { fill: var(--search-soft); stroke: var(--search); }
  .child-box { fill: var(--panel); stroke: var(--line); }
  .parent-a-box { fill: var(--parent-a-soft); stroke: var(--parent-a); }
  .parent-b-box { fill: var(--parent-b-soft); stroke: var(--parent-b); }
  .segment-a { fill: var(--panel); stroke: var(--parent-a); }
  .segment-b { fill: var(--panel); stroke: var(--parent-b); }
  .tag-a { fill: var(--parent-a); }
  .tag-b { fill: var(--parent-b); }
  .tag-text { fill: #ffffff; font-weight: 800; }
  .search-line { stroke: var(--search); fill: var(--search); }
  .arrow-a { stroke: var(--parent-a); fill: var(--parent-a); }
  .arrow-b { stroke: var(--parent-b); fill: var(--parent-b); }
  .strong { font-weight: 750; }
  .result-pill { fill: var(--success-soft); stroke: var(--success); }
  .result-text { fill: var(--success); font-weight: 800; }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0c111b;
      --panel: #141b27;
      --panel-soft: #1d2735;
      --ink: #edf2f7;
      --muted: #a9b4c4;
      --line: #445166;
      --search: #9aa7ff;
      --search-soft: #252c50;
      --parent-a: #f0a23b;
      --parent-a-soft: #3b2b17;
      --parent-b: #55cbd1;
      --parent-b-soft: #17383c;
      --success: #65d59b;
      --success-soft: #17382a;
      --shadow: rgba(0, 0, 0, 0.28);
    }
  }
</style>
</head>
<body>
<figure class="figure">
  <figcaption class="title" id="figure-title">Двухуровневый индекс parent-document</figcaption>
  <svg id="scheme"
       viewBox="0 0 1180 430"
       width="1180"
       height="430"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="figure-title figure-desc">
    <desc id="figure-desc">Три лучших child-чанка по 256 токенов ссылаются на два уникальных parent-чанка по 2048 токенов после дедупликации parent_idx.</desc>
    <g id="diagram"></g>
  </svg>
</figure>

<script>
const diagramData = [{
  canvas: { width: 1180, height: 430 },
  geometry: {
    radius: 12,
    smallRadius: 8,
    arrowHead: 11,
    arrowWing: 6,
    query: { x: 30, y: 171, width: 150, height: 72 },
    searchBus: { x: 220, top: 125, bottom: 315 },
    childX: 250,
    childWidth: 245,
    childHeight: 70,
    parentX: 760,
    parentWidth: 385,
    parentHeight: 136,
    segmentX: 782,
    segmentWidth: 341,
    segmentHeight: 44
  },
  sections: [
    { x: 105, y: 32, text: "ЗАПРОС" },
    { x: 372, y: 32, text: "ТОП-3 CHILD-РЕЗУЛЬТАТА" },
    { x: 952, y: 32, text: "КОНТЕКСТ ПОСЛЕ ДЕДУПЛИКАЦИИ" }
  ],
  query: {
    titleX: 105, titleY: 194,
    noteX: 105, noteY: 220,
    title: "запрос",
    note: "поиск по векторам"
  },
  search: {
    lineStartX: 180, lineEndX: 220, lineY: 207,
    labelX: 200, labelY: 158,
    label: "сходство"
  },
  children: [
    {
      key: "α", parent: "A", y: 90, centerY: 125,
      targetY: 116, lineClass: "arrow-a",
      labelX: 515, labelY: 102,
      title: "child α · 256 токенов",
      note: "высокое сходство",
      link: "parent_idx = A"
    },
    {
      key: "β", parent: "A", y: 185, centerY: 220,
      targetY: 169, lineClass: "arrow-a",
      labelX: 515, labelY: 244,
      title: "child β · 256 токенов",
      note: "высокое сходство",
      link: "parent_idx = A"
    },
    {
      key: "γ", parent: "B", y: 280, centerY: 315,
      targetY: 306, lineClass: "arrow-b",
      labelX: 515, labelY: 294,
      title: "child γ · 256 токенов",
      note: "высокое сходство",
      link: "parent_idx = B"
    }
  ],
  parents: [
    {
      key: "A", y: 63, segmentY: 108,
      boxClass: "parent-a-box", segmentClass: "segment-a", tagClass: "tag-a",
      title: "parent A · 2048 токенов",
      note: "8 детей × 256 токенов = 2048"
    },
    {
      key: "B", y: 237, segmentY: 282,
      boxClass: "parent-b-box", segmentClass: "segment-b", tagClass: "tag-b",
      title: "parent B · 2048 токенов",
      note: "8 детей × 256 токенов = 2048"
    }
  ],
  segments: [0, 1, 2, 3, 4, 5, 6, 7],
  footer: {
    x: 590, y: 407,
    pillX: 398, pillY: 384, pillWidth: 384, pillHeight: 34,
    text: "child_top_k = 3  →  2 уникальных родителя"
  },
  fallback: {
    x: 590, y: 215,
    text: "Схема: три child-чанка по 256 токенов ведут к двум уникальным parent-чанкам по 2048 токенов."
  }
}];

const origin = Object.freeze({ x: 0, y: 0 });
const scale = Object.freeze({ x: 1, y: 1 });

const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

const labelPad = Object.freeze({ near: 7, far: 12 });
const lineWidth = Object.freeze({ thin: 1, normal: 2, strong: 3 });
const fontSize = Object.freeze({ tiny: 10, small: 12, body: 14, large: 17 });

try {
  const data = diagramData[origin.x];
  const root = document.getElementById("diagram");
  const ns = root.namespaceURI;

  function make(tag, attrs, content) {
    const node = document.createElementNS(ns, tag);
    Object.entries(attrs).forEach(([name, value]) => node.setAttribute(name, String(value)));
    if (content !== undefined) node.textContent = content;
    root.appendChild(node);
    return node;
  }

  function rect(x, y, width, height, className, radius) {
    return make("rect", {
      x: sx(x),
      y: sy(y),
      width: sx(x + width) - sx(x),
      height: sy(y + height) - sy(y),
      rx: sx(radius) - sx(origin.x),
      ry: sy(radius) - sy(origin.y),
      class: className,
      "stroke-width": lineWidth.normal
    });
  }

  function text(x, y, content, size, className, anchor) {
    return make("text", {
      x: sx(x),
      y: sy(y),
      "font-size": size,
      class: className,
      "text-anchor": anchor,
      "dominant-baseline": "middle"
    }, content);
  }

  function line(x1, y1, x2, y2, className, width) {
    return make("line", {
      x1: sx(x1),
      y1: sy(y1),
      x2: sx(x2),
      y2: sy(y2),
      class: className,
      "stroke-width": width,
      "stroke-linecap": "round"
    });
  }

  function arrow(x1, y1, x2, y2, className) {
    const head = data.geometry.arrowHead;
    const wing = data.geometry.arrowWing;
    const length = Math.hypot(x2 - x1, y2 - y1);
    const ux = (x2 - x1) / length;
    const uy = (y2 - y1) / length;
    const baseX = x2 - ux * head;
    const baseY = y2 - uy * head;
    const leftX = baseX - uy * wing;
    const leftY = baseY + ux * wing;
    const rightX = baseX + uy * wing;
    const rightY = baseY - ux * wing;

    line(x1, y1, baseX, baseY, className, lineWidth.strong);
    make("polygon", {
      points: [
        sx(x2) + "," + sy(y2),
        sx(leftX) + "," + sy(leftY),
        sx(rightX) + "," + sy(rightY)
      ].join(" "),
      class: className
    });
  }

  data.sections.forEach(section => {
    text(section.x, section.y, section.text, fontSize.small, "section-label", "middle");
  });

  const query = data.geometry.query;
  rect(query.x, query.y, query.width, query.height, "query-box", data.geometry.radius);
  text(data.query.titleX, data.query.titleY, data.query.title, fontSize.large, "strong", "middle");
  text(data.query.noteX, data.query.noteY, data.query.note, fontSize.small, "muted", "middle");

  arrow(
    data.search.lineStartX,
    data.search.lineY,
    data.search.lineEndX,
    data.search.lineY,
    "search-line"
  );
  line(
    data.geometry.searchBus.x,
    data.geometry.searchBus.top,
    data.geometry.searchBus.x,
    data.geometry.searchBus.bottom,
    "search-line",
    lineWidth.normal
  );
  text(
    data.search.labelX,
    data.search.labelY,
    data.search.label,
    fontSize.small,
    "muted",
    "middle"
  );

  data.children.forEach(child => {
    arrow(
      data.geometry.searchBus.x,
      child.centerY,
      data.geometry.childX,
      child.centerY,
      "search-line"
    );

    rect(
      data.geometry.childX,
      child.y,
      data.geometry.childWidth,
      data.geometry.childHeight,
      "child-box",
      data.geometry.smallRadius
    );

    const tagX = data.geometry.childX + data.geometry.childWidth - data.geometry.smallRadius - labelPad.far;
    const tagY = child.centerY;

    text(
      data.geometry.childX + labelPad.far + labelPad.near,
      child.y + labelPad.far + labelPad.near,
      child.title,
      fontSize.body,
      "strong",
      "start"
    );
    text(
      data.geometry.childX + labelPad.far + labelPad.near,
      child.y + data.geometry.childHeight - labelPad.far - labelPad.near,
      child.note,
      fontSize.small,
      "muted",
      "start"
    );

    make("circle", {
      cx: sx(tagX),
      cy: sy(tagY),
      r: sx(data.geometry.smallRadius + labelPad.near) - sx(origin.x),
      class: child.parent === data.parents[origin.x].key ? "tag-a" : "tag-b"
    });
    text(tagX, tagY, child.parent, fontSize.small, "tag-text", "middle");

    arrow(
      data.geometry.childX + data.geometry.childWidth,
      child.centerY,
      data.geometry.parentX,
      child.targetY,
      child.lineClass
    );
    text(child.labelX, child.labelY, child.link, fontSize.small, "muted", "start");
  });

  data.parents.forEach(parent => {
    rect(
      data.geometry.parentX,
      parent.y,
      data.geometry.parentWidth,
      data.geometry.parentHeight,
      parent.boxClass,
      data.geometry.radius
    );

    text(
      data.geometry.parentX + labelPad.far + labelPad.near,
      parent.y + labelPad.far + labelPad.near,
      parent.title,
      fontSize.body,
      "strong",
      "start"
    );
    text(
      data.geometry.parentX + data.geometry.parentWidth - labelPad.far - labelPad.near,
      parent.y + labelPad.far + labelPad.near,
      "уникальный",
      fontSize.small,
      "muted",
      "end"
    );

    const segmentWidth = data.geometry.segmentWidth / data.segments.length;
    data.segments.forEach(segment => {
      const segmentX = data.geometry.segmentX + segment * segmentWidth;
      make("rect", {
        x: sx(segmentX),
        y: sy(parent.segmentY),
        width: sx(segmentX + segmentWidth) - sx(segmentX),
        height: sy(parent.segmentY + data.geometry.segmentHeight) - sy(parent.segmentY),
        class: parent.segmentClass,
        "stroke-width": lineWidth.thin
      });
      text(
        segmentX + segmentWidth / data.geometry.arrowWing,
        parent.segmentY + data.geometry.segmentHeight / lineWidth.normal,
        "256",
        fontSize.tiny,
        "muted",
        "middle"
      );
    });

    text(
      data.geometry.parentX + data.geometry.parentWidth / lineWidth.normal,
      parent.y + data.geometry.parentHeight - labelPad.far - labelPad.near,
      parent.note,
      fontSize.small,
      "muted",
      "middle"
    );
  });

  rect(
    data.footer.pillX,
    data.footer.pillY,
    data.footer.pillWidth,
    data.footer.pillHeight,
    "result-pill",
    data.geometry.radius
  );
  text(
    data.footer.x,
    data.footer.y,
    data.footer.text,
    fontSize.body,
    "result-text",
    "middle"
  );
} catch (error) {
  const data = diagramData[origin.x];
  const root = document.getElementById("diagram");
  const fallback = document.createElementNS(root.namespaceURI, "text");
  fallback.setAttribute("x", sx(data.fallback.x));
  fallback.setAttribute("y", sy(data.fallback.y));
  fallback.setAttribute("font-size", fontSize.body);
  fallback.setAttribute("text-anchor", "middle");
  fallback.setAttribute("dominant-baseline", "middle");
  fallback.setAttribute("class", "muted");
  fallback.textContent = data.fallback.text;
  root.appendChild(fallback);
}
</script>
</body>
</html>
