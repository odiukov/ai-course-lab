- concept: 'серия считается только непрерывной: любой вклинившийся другой вызов обнуляет счётчик повторов'
  question: Предохранитель открывает дорожку после 6 одинаковых вызовов подряд. Агент дважды подряд делает один и тот же вызов X, затем делает другой вызов Y, затем снова возвращается к X. Сколько вызовов X потребуется после Y, чтобы предохранитель открылся?
  explanation: 'Вызов Y разрывает серию, и счётчик повторов X начинается с нуля: два предыдущих X больше не учитываются. Нужны все 6 подряд. Так и задумано — условие проверяет застревание здесь и сейчас, а не общее число обращений к X за сессию; иначе редкие повторы за долгую работу постепенно накопились бы в ложное срабатывание.'
  kind: numeric
  answer: 6
  tolerance: 0.5
  id: 012-pyat-povtorov-1
  fingerprint: bc37f09d
- concept: одинаковая ошибка на разных входах и буквально одинаковые вызовы дают разные диагнозы, поэтому детектируются отдельно
  question: Инструмент `search.query` восемь раз подряд вернул одну и ту же ошибку, причём аргументы каждый раз были разными. Какой диагноз даёт этот паттерн — в отличие от серии буквально одинаковых вызовов?
  explanation: 'Разные входы с одинаковым результатом означают, что дело не во входах, — сломана общая часть, то есть инструмент. Одинаковые входы означают обратное: инструмент отвечает, но агент не продвигается. Лечение разное (одному нужен отказ инструмента и обходной путь, другому — прерывание цикла и смена плана), поэтому и детекторы держат раздельно.'
  kind: choice
  options:
    - Неисправен сам инструмент или сервис за ним
    - Агент застрял в цикле и не обрабатывает полученный ответ
    - Частота вызовов превысила допустимый порог
    - Агент выполняет инструкцию из недоверенного контента
  correct: 0
  id: 012-pyat-povtorov-2
  fingerprint: 791ecaf2
- concept: повторение идентичного вызова — самостоятельный признак зацикливания, не требующий, чтобы вызовы завершались неудачей
  question: Объясни своими словами, почему детектор повторяющегося цикла считает идущие подряд идентичные вызовы, не проверяя, успешны они или нет.
  explanation: 'Два триггера смотрят на разные вещи: цикл — на неизменность вызова, системный сбой — на неизменность ошибки при разных входах. Успешный повторяющийся вызов с внешним эффектом — худший вариант цикла, поэтому фильтровать серию по неудачам было бы прямо вредно.'
  kind: open
  reference: 'Признаком служит не ошибка, а отсутствие продвижения: если агент выбирает тот же инструмент с теми же аргументами, его состояние не изменилось от предыдущего ответа. Это верно и при успешных ответах — агент может получать корректный результат и всё равно игнорировать его, снова задавая тот же вопрос. Проверка успешности здесь только сузила бы детектор и пропустила самый дорогой случай: повторяющееся действие с внешним эффектом (перевод, возврат средств, отправка письма) успешно выполняется каждый раз, и именно поэтому цикл вокруг него нужно остановить. Серии неудач ловит отдельный триггер с другим диагнозом.'
  id: 012-pyat-povtorov-3
  fingerprint: 5e9105aa
