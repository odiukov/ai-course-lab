- concept: детекторы с накопленным состоянием требуют строго последовательного однопроходного обхода без заглядывания вперёд
  question: Почему диспетчер траектории обязан передавать действия детекторам строго по одному и по порядку, а не сначала собрать все действия и оценить их пакетом?
  explanation: 'Счётчик повторов и состояние выключателя меняются между шагами. Заглядывание вперёд ломает и то и другое: решение по действию принималось бы с учётом событий, которых на момент действия ещё не случилось, а остановка перестала бы отсекать хвост траектории.'
  kind: choice
  options:
    - Пакетная оценка медленнее из-за накладных расходов на вызовы
    - Предохранитель судит по накопленной истории и меняет состояние по ходу, а решение о каждом действии должно приниматься до его выполнения, зная только предыдущие
