- concept: адаптивный базовый уровень впитывает малые приросты, поэтому медленный рост никогда не выглядит отклонением
  question: Атакующий наращивает частоту вызовов инструментов на 3% в день. Адаптивный детектор частоты не поднимает тревогу ни разу за несколько недель. Почему?
  explanation: Сравнение всегда идёт с недавней историей. Прирост в 3% меньше нормального разброса, а завтра он уже часть нормы, поэтому суммарный рост в несколько раз проходит незамеченным.
  kind: choice
  options:
    - Детектор учитывает только абсолютное число вызовов и игнорирует их темп
    - Каждое новое значение сравнивается с базовым уровнем, который уже впитал вчерашний прирост
    - Порог детектора выставлен выше физически достижимой частоты вызовов
  correct: 1
  id: 020-drift-problem-1
  fingerprint: 93678c42
- concept: правило, не использующее историю поведения, не поддаётся медленному сдвигу базового уровня
  question: Какая защита механически поймает поведение, которое годами уползало от нормы малыми шагами?
  explanation: Любой адаптивный вариант всё равно сравнивает с прошлым и потому сдвигается вместе с ним; медленнее — значит просто дольше. Фиксированная граница сравнивает с константой, для неё история не существует.
  kind: choice
  options:
    - EWMA с меньшим коэффициентом обновления, чтобы норма двигалась медленнее
    - Оценка отклонения по частоте вызовов с более узким порогом
    - Жёсткое правило «не больше 80 вызовов за 15 минут», не зависящее от прошлых наблюдений
  correct: 2
  id: 020-drift-problem-2
  fingerprint: fe128770
- concept: статистический слой и нерастяжимая граница закрывают разные классы промахов и потому применяются вместе
  question: Объясни своими словами, почему статистические детекторы и жёсткие лимиты ставят слоями, а не выбирают что-то одно.
  explanation: 'Ключ в том, что промахи слоёв не совпадают: детектор слеп к медленному сдвигу, фиксированная граница слепа к аномалиям внутри разрешённого диапазона.'
  kind: open
  reference: 'Статистический детектор подстраивается под меняющуюся норму: он хорошо отсеивает обычный шум и ловит резкие скачки, но по числам не отличает законный дрейф от враждебного и потому пропускает атаку, растянутую во времени. Жёсткий лимит не обучается: он проверяется без истории, прост в аудите и ловит именно то, что проползло мимо детектора, — но сам по себе он груб и молчит на всём, что не пересекло границу. Слои дополняют друг друга: статистика снимает основную массу событий, жёсткая граница гарантирует потолок.'
  id: 020-drift-problem-3
  fingerprint: 31bb3260
