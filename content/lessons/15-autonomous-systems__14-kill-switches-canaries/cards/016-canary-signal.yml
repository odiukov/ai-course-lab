- concept: 'канарейка — детектор: она даёт достоверный сигнал, а остановку выполняет внешний слой реагирования'
  question: В переменные окружения агента положен фальшивый ключ доступа без реальных прав. Агент прочитал его и отправил во внешний запрос. Что именно делает канареечный токен в этот момент?
  explanation: 'Ключ фальшивый и прав не даёт, так что сам он ничего не защищает и не останавливает. Ценность в наблюдаемости: обращение атрибутируется однозначно, потому что у приманки нет законной роли в работе. Решение о реакции — отдельный слой; смешивать детектор и исполнителя не нужно, иначе один и тот же механизм и обнаруживает, и решает, что делать.'
  kind: choice
  options:
    - Блокирует исходящий запрос, потому что канарейка работает как перехватчик трафика
    - Отзывает права агента, поскольку токен связан с системой авторизации
    - 'Ничего не блокирует: она даёт достоверное событие «приманка тронута», а алерт, запись источника или включение kill switch выполняет внешняя система'
    - Автоматически переводит предохранитель этого инструмента в half-open для проверки
  correct: 2
  id: 016-canary-signal-1
  fingerprint: 97addb4b
- concept: канарейка обнаруживает утечку по появлению маркера вне ожидаемого места, даже когда сам факт чтения не наблюдался
  question: В память агента в начале сессии положена строка-маркер, которую никто не запрашивал. Спустя несколько ходов она появляется в ответе, отданном пользователю. Какой вывод даёт это наблюдение?
  explanation: Такая канарейка не измеряет чтения — она фиксирует пересечение границы. Строка попала в память искусственно и ни один запрос её не требовал, поэтому её появление в исходящем ответе означает, что содержимое памяти выкладывается наружу. Точка наблюдения здесь — выход, а не обращение, и это ловит утечку даже там, где отдельных операций чтения памяти не видно.
  kind: choice
  options:
    - 'Агент зациклился: маркер повторяется, значит вызовы дублируются'
    - 'Содержимое памяти уходит наружу: маркер оказался вне того места, где он должен был остаться'
    - Память переполнена, и старые записи вытесняются в вывод
    - 'Ответ агента корректен: маркер лежал в памяти, значит он часть законного контекста'
  correct: 1
  id: 016-canary-signal-2
  fingerprint: 92c286ce
