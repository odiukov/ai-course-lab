- concept: 'возобновление работы после аварийной остановки идёт в порядке: диагностика, исправление, проверка исправления, снятие запрета человеком'
  question: Агент остановлен аварийным выключателем. Расставь действия по возобновлению работы в правильном порядке.
  explanation: 'Снятие запрета — последний шаг, а не первый: пока причина не найдена и исправление не проверено, возобновление просто возвращает в работу ту же неизвестность. Порядок гарантирует, что за возобновление отвечает конкретное решение человека, а не истечение интервала.'
  kind: order
  items:
    - 'Установить причину: какие данные, решения и вызовы привели к опасному действию'
    - Внести исправление, устраняющее эту причину
    - Проверить исправление, не давая агенту действовать в проде
    - Человек осознанно снимает запрет во внешнем хранилище состояния выключателя
    - Агент возобновляет значимые действия
  id: 006-ruchnoy-vozvrat-2
  fingerprint: c10a5717
- concept: срабатывание аварийной остановки можно автоматизировать, а снятие — нет; асимметрия направлений
  question: Объясни своими словами, почему аварийную остановку допустимо инициировать автоматически (например, по обращению к канарейке), но недопустимо снимать по таймеру.
  explanation: 'Ключ — асимметрия последствий: ошибочная остановка обратима, ошибочное возобновление может быть необратимым. Отсюда правило: автоматический триггер вниз разрешён, автоматический возврат вверх — запрещён.'
  kind: open
  reference: 'Направления несимметричны по цене ошибки. Ложное срабатывание останавливает работу: потери — простой, он обратим и виден людям. Ложное снятие возвращает в прод агента, чья причина сбоя не устранена, и его действия могут быть необратимыми (деньги ушли, письма отправлены, данные удалены). Поэтому в сторону остановки решение можно доверить автомату по наблюдаемому признаку, а в сторону работы требуется человек, который выяснил причину, проверил исправление и принял ответственность. Таймер умеет только ждать: истечение интервала не является проверкой ничего и особенно опасно ночью, когда за возобновлением никто не наблюдает.'
  id: 006-ruchnoy-vozvrat-3
  fingerprint: 8696c4ed
