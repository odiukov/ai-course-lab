- concept: circuit breaker срабатывает по наблюдаемому паттерну вызовов и отключает только одну дорожку
  question: 'Порог настроен так: не больше 8 удалений за 30 секунд. Агент делает 14 удалений за это окно. Как ведёт себя circuit breaker?'
  explanation: Предохранитель считает вызовы сам и размыкает конкретную дорожку, на которой сработал порог. Полная остановка — задача kill switch, а согласия модели предохранитель не запрашивает.
  kind: choice
  options:
    - Полностью останавливает агента, включая чтение и переименование файлов
    - Разрывает именно дорожку удаления, остальные операции агента продолжают работать
    - Спрашивает у модели, обоснованы ли удаления, и решает по её ответу
  correct: 1
  id: 002-tri-detektora-1
  fingerprint: f2f2709b
- concept: canary token выдаёт нарушителя фактом обращения к приманке, у которой нет законных потребителей
  question: В хранилище лежит ключ, который не используется ни одной легитимной задачей. Агент его читает. Почему это считается сигналом тревоги, даже если каждое отдельное действие агента выглядело безобидным?
  explanation: 'Канарейка — приманка без законных потребителей. Она ничего не считает и ни о чём не спрашивает: обращение к ней и есть срабатывание, что позволяет поймать медленную атаку, собранную из безопасных на вид шагов.'
  kind: choice
  options:
    - Потому что чтение ключа дорого по токенам
    - 'Потому что у корректной работы нет причин к нему обращаться: само прикосновение означает выход за ожидаемые границы'
    - Потому что ключ подписан и подпись не сошлась
  correct: 1
  id: 002-tri-detektora-2
  fingerprint: aa8dfba4
- concept: kill switch выражает решение человека и не требует доказательства неисправности агента
  question: Чем kill switch отличается от предохранителя и канарейки по природе своего срабатывания?
  explanation: 'Выключатель — булево решение снаружи. Предохранитель ловит паттерн, канарейка ловит выход за границы, а выключатель просто исполняет волю оператора. Все три независимы: ни один не ждёт остальных.'
  kind: choice
  options:
    - Он передаёт прямое решение человека остановить работу целиком и не обязан обосновывать, что агент ошибается
    - Он анализирует историю вызовов и срабатывает при превышении частоты
    - Он срабатывает только когда две другие защиты уже сработали
  correct: 0
