- concept: half-open заменяет догадку о восстановлении проверкой с ограниченной ценой ошибки
  question: Из схемы предохранителя убрали состояние half-open, оставив только closed и open. Какая проблема появляется?
  explanation: 'Определение аварии и локальность блокировки от half-open не зависят. Зависит цена ошибочного вывода «кажется, уже работает»: без промежуточного состояния этот вывод проверяется всем потоком запросов, а с ним — одной-двумя пробами.'
  kind: choice
  options:
    - Предохранитель перестанет определять момент аварии и не сможет заблокировать действие
    - Придётся выбирать между блокировкой навсегда и полным возвратом потока сразу после остывания — без дешёвой проверки, восстановился ли путь
    - Триггеры аварии придётся считать по всем инструментам сразу, а не по одному
    - Пропадёт возможность блокировать действие, не останавливая агента целиком
  correct: 1
