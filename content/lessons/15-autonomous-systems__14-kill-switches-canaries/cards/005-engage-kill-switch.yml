- concept: 'задействование аварийной остановки идемпотентно: повторный вызов не снимает уже установленный запрет'
  question: Агент остановлен аварийным выключателем. Другой оператор, не зная об этом, вызывает ту же функцию задействования остановки ещё раз. Как обязана вести себя корректная реализация?
  explanation: 'Задействование остановки — направленное действие, а не переключатель. Идемпотентность значит: N вызовов дают то же состояние, что один. Иначе гонка двух операторов или повторная доставка сообщения снимет остановку в момент, когда она нужнее всего.'
  kind: choice
  options:
    - 'Оставить выключатель задействованным: состояние после второго вызова совпадает с состоянием после первого'
    - Переключить выключатель в противоположное состояние, так как повторный вызов означает отмену
    - Вернуть ошибку и снять остановку, чтобы состояние не было записано дважды
    - Задержать остановку до следующей проверки, поскольку она уже была применена
  correct: 0
  id: 005-engage-kill-switch-1
  fingerprint: fdd8fbef
- concept: остановка записывается во внешнее разделяемое состояние, чтобы её видели другие процессы и следующий запуск агента
  question: 'Дополни реализацию: куда функция обязана записать факт остановки, чтобы он пережил перезапуск процесса агента?'
  explanation: 'Запись в local_state живёт только в памяти текущего процесса: перезапуск или второй воркёр её не увидят и продолжат работу. Состояние выключателя должно лежать во внешнем контуре — feature flag, ключ Redis, подписанный конфиг в объектном хранилище.'
  kind: cloze
  template: |-
    def engage_kill_switch(flags, local_state):
        # остановку должны увидеть другие процессы и следующий запуск
        ___.set("kill_switch", "engaged")
  answer: flags
  accept:
    - flags
    - flag_store
    - внешнее хранилище флагов
  id: 005-engage-kill-switch-2
  fingerprint: b1dc3c13
- concept: варианты размещения выключателя различаются скоростью доставки решения и грубостью остановки
  question: Оператору нужен выключатель, решение по которому доезжает до работающего агента за секунды и не убивает процесс на середине уже начатой транзакции. Какой вариант реализации подходит лучше всего?
  explanation: 'Управляемый сервис фиче-флагов доставляет изменение за секунды, и агент сам замечает запрет на следующей проверке. Удаление пода — самый грубый вариант: процесс умирает где угодно. Подписанный конфиг, читаемый лишь при старте, доедет только к следующему запуску.'
  kind: choice
  options:
    - Флаг в управляемом сервисе фиче-флагов, который агент читает перед значимым действием
    - Удаление пода средствами оркестратора контейнеров
    - Подписанный конфиг в объектном хранилище, проверяемый только при старте процесса
    - Правило в файрволе, отрезающее агенту сеть
  correct: 0
