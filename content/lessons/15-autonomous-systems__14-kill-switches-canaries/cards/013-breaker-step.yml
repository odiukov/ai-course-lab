- concept: лимит пробных попыток уменьшается в момент выдачи разрешения, поэтому одновременные вызовы не могут все считать себя пробой
  question: Предохранитель находится в open, период охлаждения 45 секунд, бюджет пробных попыток 3. Ровно на 45-й секунде одновременно приходят 6 вызовов к этому инструменту, ни один ещё не успел вернуть результат. Сколько вызовов будет допущено к инструменту?
  explanation: Охлаждение истекло, предохранитель переходит в half-open с бюджетом 3. Слот занимается в момент выдачи разрешения, а не после ответа инструмента, поэтому первые 3 вызова забирают бюджет, а остальные 3 получают отказ. Если уменьшать лимит после ответа, все 6 вызовов увидят свободный бюджет и уйдут на потенциально сломанный инструмент — ровно та трата, которую предохранитель должен предотвращать.
  kind: numeric
  answer: 3
  tolerance: 0.5
  id: 013-breaker-step-2
  fingerprint: 73e47dac
- concept: переход из half-open совершается только по наблюдённому результату пробы; отсутствие результата состояние не меняет
  question: 'Пробный вызов уже отправлен инструменту, но ответ пока не получен: результата нет. В каком состоянии должен находиться предохранитель и что происходит с новыми обычными вызовами?'
  explanation: Half-open — это режим ожидания доказательства. Без результата у предохранителя нет ни основания закрыться, ни основания снова разорвать дорожку, поэтому он остаётся в half-open, слот считается израсходованным, а остальные вызовы отклоняются. Досрочный перевод в closed открыл бы трафик на инструмент, работоспособность которого ещё не подтверждена.
  kind: choice
  options:
    - Предохранитель уже closed, обычные вызовы разрешены — проба ведь не завершилась ошибкой
    - Предохранитель снова open, обычные вызовы отклоняются, а проба считается неудачной по умолчанию
    - 'Предохранитель остаётся half-open с занятым слотом: обычные вызовы отклоняются, переход ждёт фактического результата пробы'
    - Состояние не определено, функция должна повторно отправить пробный вызов
  correct: 2
