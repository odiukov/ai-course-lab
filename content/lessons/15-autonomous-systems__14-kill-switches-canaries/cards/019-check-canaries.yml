- concept: 'точка наблюдения канарейки задаётся её носителем: провайдер, слой доступа к хранилищу или исходящий канал'
  question: Канареечная строка вложена в память сессии агента. Где её срабатывание наблюдается, в отличие от канареечного файла или записи в базе?
  explanation: 'К файлу и записи базы агент обращается через слой доступа, и туда ставится наблюдение. Память агент читает внутри себя, поэтому единственная наблюдаемая точка — выход: маркер, всплывший в ответе, доказывает вынос содержимого памяти наружу.'
  kind: choice
  options:
    - В журнале операций файловой системы — память сбрасывается на диск теми же вызовами
    - В содержимом исходящих ответов и сообщений агента, а не в обращениях к хранилищу
    - 'В счётчике вызовов инструментов: память читается отдельным инструментом'
  correct: 1
  id: 019-check-canaries-2
  fingerprint: bf428303
