- concept: стоимость вызова в токенах не связана с масштабом его последствий
  question: Агент работает с денежным лимитом 120 долларов. Один вызов `db.drop_table` укладывается примерно в 40 токенов и стоит доли цента. Что это говорит об уровне защиты?
  explanation: Ограничитель расходов измеряет потребление токенов, запросов и денег. Разрушительность действия определяется целью вызова, а не его длиной, поэтому самое опасное действие часто оказывается самым дешёвым.
  kind: choice
  options:
    - 'Лимит расходов не защищает от этого вызова: его цена ничего не сообщает о величине ущерба'
    - Лимит защищает, потому что после дорогих операций денег на удаление не останется
    - Лимит защищает, если пересчитывать стоимость вызовов точнее
  correct: 0
  id: 001-budget-ne-smysl-1
  fingerprint: e5dbeaa7
- concept: уменьшение лимита расходов не снижает риск однократного опасного действия
  question: Инженер предлагает уменьшить лимит агента в двадцать раз и считать вопрос безопасности закрытым. Объясни своими словами, что такая мера даст, а что нет.
  explanation: 'Две разные оси: цена пути и допустимость пункта назначения. Снижение лимита двигает только первую ось.'
  kind: open
  reference: 'Меньший лимит сокращает объём работы: короче цепочки рассуждений, меньше вызовов инструментов и платных сервисов, раньше останавливается разгон расходов. Но опасное действие (удаление ресурса, публикация, отправка секрета) стоит гроши и умещается в любой сколь угодно малый бюджет. Ограничитель расходов отвечает на вопрос «сколько можно потратить», а не «что допустимо сделать», поэтому нужен отдельный слой, смотрящий на смысл действия.'
  id: 001-budget-ne-smysl-2
  fingerprint: aa81dfcb
- concept: класс угроз, который ограничитель расходов действительно закрывает
  question: От чего ограничитель расходов защищает надёжно?
  explanation: 'Бюджет останавливает накопление стоимости: циклы, бесконечный поиск, шквал повторов. Утечка и ошибочная публикация стоят почти ноль и проходят под любым лимитом.'
  kind: choice
  options:
    - От утечки ключа через вызов внешнего API
    - От зацикленного агента, который бесконечно повторяет запросы к платной модели
    - От публикации черновика вместо готового текста
  correct: 1
  id: 001-budget-ne-smysl-3
  fingerprint: c1d96a65
