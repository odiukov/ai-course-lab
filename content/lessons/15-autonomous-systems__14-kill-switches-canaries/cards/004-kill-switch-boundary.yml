- concept: состояние выключателя проверяется перед каждым значимым действием, а не только при запуске
  question: Агент читает флаг остановки один раз при старте процесса. Какое последствие это создаёт?
  explanation: 'Проверка только при старте делает выключатель бесполезным для текущей сессии: сигнал доходит лишь до следующего запуска. Поэтому флаг опрашивают перед каждым значимым действием.'
  kind: choice
  options:
    - Уже запущенный процесс продолжит списывать деньги и рассылать письма после переключения флага
    - Флаг перестанет быть булевым значением
    - Агент не сможет прочитать флаг вообще, пока не перезапустится вручную
