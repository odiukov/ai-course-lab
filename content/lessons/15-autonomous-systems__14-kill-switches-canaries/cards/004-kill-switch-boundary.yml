- concept: остановленный агент не производит наблюдаемых снаружи эффектов, включая записи в доступные ему логи
  question: Kill switch задействован. Агент прекратил вызовы инструментов, но продолжает писать сообщения в лог, к которому у него есть доступ и на который подписаны другие сервисы. Что здесь не так?
  explanation: 'Правило жёстче, чем «не вызывать инструменты»: агент в карантине не должен шуметь наружу. Лог, который читают другие процессы, — полноценный путь воздействия.'
  kind: choice
  options:
    - 'Ничего: логирование безопасно по определению'
    - Остановленный агент обязан не производить наблюдаемых снаружи эффектов, а запись в такой лог остаётся каналом влияния на другие системы
    - Проблема лишь в объёме логов и расходах на хранение
