- concept: приманку проектируют от очерченного нормального маршрута процесса, а не от удобного места хранения
  question: Расставь шаги проектирования канарейки для конкретного рабочего процесса агента в правильном порядке.
  explanation: 'Порядок именно такой, потому что «вне маршрута» — свойство относительное: определить его можно только после того, как маршрут описан. Приманка, положенная в удобное место до этого разбора, с высокой вероятностью окажется на пути штатной работы — например, будет прочитана фоновой сверкой, перебирающей все записи.'
  kind: order
  items:
    - 'Описать нормальный маршрут агента: какие данные он получает по заданию и к каким объектам обращается законно'
    - Выбрать место или значение, до которого этот маршрут не доходит ни при одном штатном сценарии
    - Разместить там приманку без задания в очереди, ссылок из интерфейса и связей с реальными сущностями
    - Настроить фиксацию обращения к приманке и передачу события во внешний слой реагирования
  id: 018-canary-design-1
  fingerprint: 22f4f56b
- concept: законное касание приманки лечится изменением приманки или процесса, а не исключением в правиле и не привыканием к алерту
  question: Выяснилось, что ночная фоновая сверка законно перебирает все записи реестра и каждый раз читает канареечную запись, поднимая алерт. Как правильно поступить?
  explanation: 'Канарейка ценна тем, что обращение к ней почти невозможно объяснить обычной работой. Как только штатный процесс её касается, это свойство пропадает: шум, исключение по расписанию или порог сначала гасят конкретный алерт, а затем и доверие к нему — и настоящее обращение нарушителя пройдёт незамеченным или спрячется под порогом. Лечить нужно источник: приманку или маршрут процесса.'
  kind: choice
  options:
    - Оставить как есть и приучиться считать ночные алерты нормальным шумом
    - Перенести приманку туда, куда штатные процессы не доходят, либо изменить сам процесс, чтобы он не перебирал реестр целиком
    - Понизить приоритет этого алерта, чтобы он не попадал в основную очередь
    - 'Повысить порог: считать тревогой только пять и более обращений к приманке за сутки'
  correct: 1
  id: 018-canary-design-2
  fingerprint: e50b79a3
