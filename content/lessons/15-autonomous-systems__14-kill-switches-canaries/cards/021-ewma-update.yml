- concept: коэффициент обновления обменивает длину памяти на скорость реакции
  question: Что происходит с плавающим базовым уровнем при увеличении коэффициента обновления?
  explanation: 'Это один компромисс, а не два независимых свойства: большая доля свежего значения одновременно укорачивает память и усиливает влияние выброса. Коэффициент подбирают под естественную скорость изменения процесса.'
