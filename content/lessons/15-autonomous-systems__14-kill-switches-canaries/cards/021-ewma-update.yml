  question: Дополни формулу обновления экспоненциально взвешенного среднего.
  explanation: Веса обязаны давать в сумме единицу, иначе базовый уровень поедет вверх или вниз даже на неизменных наблюдениях. Доля alpha уходит новому значению, остаток (1 - alpha) — прежней норме.
