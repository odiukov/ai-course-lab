- concept: время до изоляции складывается из доставки политики на узел и лишь затем из обработки пакета, а не из одной обработки
  question: Решение о карантине принято в момент t=0. Обновление политики устанавливается на нужном узле через 180 мс. После установки перенаправление добавляет каждому пакету 0,4 мс. Агент шлёт пакеты непрерывно. Через сколько миллисекунд после решения первый пакет окажется в honeypot?
  explanation: '180 мс уходит на доставку решения, и только потом включается быстрая часть: 180 + 0,4 = 180,4 мс. Всё, что агент отправил в течение первых 180 мс, ушло по старым правилам — субмиллисекундная цифра описывает стоимость пакета при уже работающей политике, а не момент изоляции.'
  kind: numeric
  answer: 180.4
  tolerance: 0.5
  id: 029-quarantine-latency-1
  fingerprint: 21e744cb
- concept: окно до изоляции сокращается работой над доставкой решения из control plane на узел, а не над стоимостью обработки пакета
  question: Команда хочет сократить окно, в котором подозрительный агент ещё способен отправить данные наружу. Куда осмысленно вкладываться?
  explanation: 'Узкое место на три порядка больше «быстрой» части: сотни миллисекунд против долей миллисекунды. Экономия на пакете не влияет на длину окна побега — она влияет только на то, насколько карантин замедлит трафик после активации.'
  kind: choice
  options:
    - 'В скорость распространения обновления политики на узел: готовность оператора, размер кластера, частота сверки состояния'
    - В снижение накладных расходов датапата на пакет ниже текущего субмиллисекундного значения
    - В увеличение числа honeypot-адресов, чтобы перенаправление находило цель быстрее
  correct: 0
  id: 029-quarantine-latency-2
