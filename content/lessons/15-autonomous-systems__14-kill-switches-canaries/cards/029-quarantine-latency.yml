- concept: 'порядок этапов срабатывания сетевого карантина: от решения через распространение политики к переписыванию пакета в ядре'
  question: Расставь этапы срабатывания сетевого карантина по времени.
  explanation: Первые три шага — это те самые сотни миллисекунд задержки активации; субмиллисекундная цифра относится только к четвёртому. Пока третий шаг не завершён, узел применяет прежние правила.
  kind: order
  items:
    - Принимается решение поместить агента в карантин
    - В control plane создаётся обновление сетевой политики
    - Обновление доезжает до нужного узла и устанавливается
    - eBPF в ядре переписывает назначение очередного исходящего пакета
    - Запросы агента фиксируются в honeypot и становятся форензикой
  id: 029-quarantine-latency-3
  fingerprint: e9460197
