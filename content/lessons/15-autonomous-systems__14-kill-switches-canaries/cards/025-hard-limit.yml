- concept: малый ежедневный относительный прирост складывается мультипликативно и даёт кратный рост при том, что каждый шаг близок к вчерашнему
  question: Атакующий увеличивает частоту вызовов на 4% в день, так что каждое новое значение почти совпадает со вчерашним. Во сколько раз частота вырастет за 30 дней?
  explanation: 1.04^30 ≈ 3.24. Каждый отдельный прирост в 4% незаметен на фоне шума, но произведение тридцати таких шагов даёт трёхкратный рост. Число вроде «не больше 50 вызовов за 10 минут» этой арифметики не замечает — оно сравнивает счётчик с константой.
  kind: numeric
  answer: 3.24
  tolerance: 0.15
