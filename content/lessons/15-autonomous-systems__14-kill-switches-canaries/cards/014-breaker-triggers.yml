- concept: триггер по порядку событий срабатывает от единственного вхождения, потому что доказательством служит сама последовательность, а не накопленный счётчик
  question: Агент прочитал внешний комментарий из недоверенного источника и сразу после этого один раз вызвал `file.delete`. Ошибок не было, темп вызовов низкий, повторов нет. Какой детектор обязан разорвать дорожку и почему?
  explanation: 'Счётные триггеры ищут накопление: пять одинаковых вызовов, пять неудач, превышение темпа. Контекстный триггер устроен иначе — он проверяет упорядоченную пару событий, и вред от одного удаления файла по инструкции из чужого текста уже необратим. Ждать второго такого случая бессмысленно, поэтому этот детектор срабатывает с первого совпадения.'
  kind: choice
  options:
    - 'Никакой: одного вызова недостаточно, нужно дождаться накопления счётчика до порога'
    - 'Детектор последовательности: опасен сам порядок «чтение недоверенного контента, затем разрушающий инструмент», поэтому порог равен одному вхождению'
    - 'Детектор серии неудач: удаление файла после чужого текста считается неудачным вызовом'
    - 'Детектор частоты: любое обращение к `file.delete` автоматически превышает порог скорости'
  correct: 1
  id: 014-breaker-triggers-1
  fingerprint: cdecf066
- concept: порог частоты ловит опасный темп при том, что каждый отдельный вызов успешен и уникален по входу
  question: Инструмент поиска по базе отвечает успехом на каждый вызов, все входы разные, но за минуту агент делает 200 вызовов вместо обычных 6. Объясни своими словами, какой детектор здесь должен сработать и почему детекторы повторяющегося цикла и серии неудач промолчат.
  explanation: 'Три счётных триггера измеряют разные величины: совпадение вызовов, подряд идущие неудачи и скорость. Успешный высокочастотный трафик виден только третьему, поэтому детекторы не заменяют друг друга: набор из одного «универсального счётчика» этот случай пропустит целиком.'
  kind: open
  reference: 'Сработать должен порог частоты: он смотрит на количество вызовов инструмента в единицу времени, а не на их содержание и результат. Детектор повторяющегося цикла молчит, потому что входы разные — буквального повтора вызова нет. Детектор серии неудач молчит, потому что неудач нет вовсе: каждый вызов успешен. Опасность здесь возникает не из отдельного вызова, а из темпа — нагрузка на инструмент, счёт за использование и скорость, с которой агент успевает натворить дел до вмешательства человека. Поэтому нужен отдельный детектор со собственным измерением — скоростью, а не совпадением или ошибкой.'
  id: 014-breaker-triggers-2
  fingerprint: 08c1a945
