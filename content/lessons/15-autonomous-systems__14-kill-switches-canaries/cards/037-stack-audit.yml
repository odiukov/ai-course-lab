- concept: покрытие угрозы доказывается прослеженной цепочкой от сценария до остановки, а не присутствием детектора нужного класса в перечне
  question: Команда проверяет защитную стопку агента перед развёртыванием. Что служит доказательством того, что конкретная угроза закрыта?
  explanation: 'Список названий не отвечает на вопрос «кто заметит и успеет ли». Покрытие проверяется разыгрыванием инцидента до конца: сигнал есть, он появляется вовремя, за ним следует остановка. Детектор нужного класса может существовать и при этом опаздывать или не иметь связи с механизмом остановки — тогда угроза не закрыта.'
  kind: choice
  options:
    - В стопке присутствует детектор того класса, к которому относится угроза
    - 'Для этой угрозы прослежено: какой сигнал её порождает, когда сигнал появляется и какой механизм останавливает агента до необратимого действия'
    - Число детекторов в стопке не меньше числа угроз из модели рисков
    - Все детекторы стопки покрыты автотестами и проходят их на зелёном билде
  correct: 1
  id: 037-stack-audit-1
  fingerprint: 30aa9da4
- concept: качество порога измеряется числом необратимых действий, успевающих пройти до срабатывания, относительно допустимого
  question: Предохранитель открывается после 12 подряд неуспешных вызовов опасной дорожки, и каждый такой вызов уже отправляет необратимый внешний эффект. Модель рисков допускает не более 2 таких эффектов на инцидент. Сколько недопустимых эффектов проходит сверх допуска до срабатывания?
  explanation: 12 вызовов исполняются до открытия, допустимы 2, значит сверх допуска проходит 10. Порог оценивают не по факту наличия предохранителя, а по числу необратимых действий, успевающих пройти до его срабатывания.
  kind: numeric
  answer: 10
  tolerance: 0.5
