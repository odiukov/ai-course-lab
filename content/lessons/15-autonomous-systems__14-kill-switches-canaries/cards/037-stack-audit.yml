- concept: слишком мягкая настройка существующего детектора — дыра того же рода, что и отсутствующий детектор, потому что сигнал приходит позже необратимого действия
  question: Объясни своими словами, почему при аудите защитной стопки настроенный со слишком высоким порогом детектор считается такой же дырой, как полностью отсутствующий, и чем эти два дефекта различаются при устранении.
  explanation: 'В разобранной стопке предохранитель существует, но открывается после неприемлемого числа действий: сигнал формально есть и опаздывает. Аудит цепочки «сценарий → сигнал → срок → остановка» ловит такой дефект наравне с отсутствующими аварийным выключателем и канарейкой, хотя чинится он настройкой, а не новым компонентом.'
  kind: open
  reference: 'Оба дефекта дают одинаковый результат по существу: к моменту, когда защита могла бы вмешаться, необратимое действие уже совершено, поэтому угроза не закрыта ни в одном случае. Аудит смотрит на срок срабатывания относительно момента необратимости, а не на присутствие компонента, поэтому опоздавший сигнал равносилен отсутствующему. Различие — в лечении: отсутствующий детектор требует добавить механизм и связать его с остановкой, а мягкий порог требует лишь перенастройки (снижения порога, сужения окна), при этом такая перенастройка платит ростом ложных срабатываний, и эту цену нужно оценивать отдельно.'
  id: 037-stack-audit-3
