- concept: повторные обращения к одной и той же канарейке дают отдельные попадания, а не одно — частота остаётся отдельным сигналом для следующего слоя
  question: 'В журнале 11 событий: 5 чтений одного и того же канареечного файла и 6 обращений к обычным рабочим документам. Сколько элементов вернёт `canary_hits`?'
  explanation: 'Функция собирает факты, а не уникальные приманки: каждое из 5 чтений — отдельное зафиксированное обращение. Схлопывание в одно попадание уничтожило бы информацию о частоте, которой затем может воспользоваться внешний слой — например, отличить единичный случайный контакт от планомерного перебора.'
  kind: numeric
  answer: 5
  tolerance: 0.5
