- concept: попаданием считается наблюдаемое обращение к приманке, а не факт её присутствия в среде
  question: Какое из событий журнала `canary_hits` должна отнести к попаданиям?
  explanation: 'Присутствие приманки — это её установка, состояние среды, которое существует всё время работы. Сигнал даёт только наблюдаемое обращение: чтение, изменение или вынос значения-маркера наружу. Если считать попаданием само наличие, функция будет отмечать тревогу в каждой сессии и потеряет смысл.'
  kind: choice
  options:
    - Канареечный ключ присутствует в переменных окружения процесса агента
    - Фальшивая строка существует в таблице базы данных и помечена маркером
    - Агент обновил значение канареечной записи в базе
    - Канареечный файл лежит в рабочей папке рядом с рабочими документами
