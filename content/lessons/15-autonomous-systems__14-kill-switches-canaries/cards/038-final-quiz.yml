- concept: детекторы прогоняются на фиксированной траектории с заранее известным номером шага срабатывания, что превращает срабатывание в проверяемое свойство
  question: Зачем стопку детекторов прогонять на фиксированной воспроизводимой траектории, где для каждого детектора заранее известно, на каком шаге он обязан сработать?
  explanation: Проверка защиты по принципу «алерт был» скрывает опоздание. Фиксированная траектория с ожидаемым шагом ловит и молчание, и запаздывание, и случайно ослабленный порог после правки конфигурации.
  kind: open
  reference: 'Заранее известный шаг превращает срабатывание в проверяемое свойство: тест падает не только когда детектор молчит, но и когда он срабатывает позже нужного или раньше. Без ожидаемого шага «сработало когда-нибудь» неотличимо от «сработало после необратимого действия». Воспроизводимость даёт регрессию: любое изменение порогов, кода детектора или порядка обхода немедленно видно на том же входе. Так защита тестируется как обычный код, а не оценивается по факту наличия компонентов.'
  id: 038-final-quiz-2
