- concept: при постоянном наблюдении повторные обновления приближают базовый уровень к нему геометрически, не достигая мгновенно
  question: Базовый уровень равен 100, коэффициент обновления 0.5. Пришли два наблюдения подряд, оба равны 60. Чему равен базовый уровень после второго обновления?
  explanation: 'Первый вызов: 0.5 * 100 + 0.5 * 60 = 80. Второй берёт уже 80 как прежний уровень: 0.5 * 80 + 0.5 * 60 = 70. Разрыв с наблюдением сокращается вдвое за шаг, поэтому норма подходит к 60, но не прыгает к нему.'
  kind: numeric
  answer: 70
  tolerance: 0.01
  id: 022-ewma-2
  fingerprint: 068df00e
- concept: граничные значения коэффициента вырождают обновление в замороженную норму либо в копию последнего наблюдения
  question: Чем плох коэффициент обновления, равный единице, в функции пересчёта базового уровня?
  explanation: 'При alpha = 1 вес прежнего уровня равен нулю: памяти нет. Противоположная крайность alpha = 0 замораживает норму. Смысл сглаживания живёт строго между границами.'
  kind: choice
  options:
    - Базовый уровень становится равен последнему наблюдению, и любой одиночный всплеск объявляет себя нормой
    - Базовый уровень перестаёт меняться и навсегда сохраняет стартовое значение
    - Базовый уровень растёт при каждом вызове независимо от наблюдений
