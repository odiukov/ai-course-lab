- concept: причина инцидента в записи о возврате формулируется как механизм отказа, а не как перечень последствий или наблюдений
  question: Агент поддержки остановлен аварийным выключателем после 62 ошибочных выплат. Какая формулировка годится как «причина инцидента» в записи о повторном включении?
  explanation: 'Число выплат — последствие: оно не говорит, что чинить и что предотвращать. Тишина после остановки — вообще не наблюдение о причине, остановленный агент не мог ошибаться. Причина — механизм: агент трактовал недоверенный текст как авторизацию. Только из механизма выводится обязательное исправление.'
  kind: choice
  options:
    - Агент выдал 62 некорректные компенсации за смену
    - Агент принимал текст письма клиента за подтверждение права на возврат и не сверялся с заказом
    - После остановки поток ошибочных выплат прекратился
  correct: 1
  id: 036-reenable-procedure-1
  fingerprint: 4a212e20
- concept: запись фиксирует принявшего риск ответственного за решение, а не исполнителя технической команды снятия запрета
  question: Почему в процедуре повторного включения агента отдельно фиксируют имя того, кто разрешил включение, а не только того, кто выполнил команду снятия запрета?
  explanation: 'Асимметрия срабатывания и возврата держится именно на этом: остановку можно автоматизировать, а возврат — нет, потому что возврат — принятие риска конкретным человеком. Обещание «поправим позже» и растущая очередь обращений условием возврата не являются.'
  kind: open
  reference: 'Снятие запрета — техническое действие, его может выполнить любой оператор с доступом. Ценность записи в другом: она называет человека, который взял на себя риск повторного запуска, зная причину инцидента и содержание исправления. Без такого имени включение обратно на практике делает первый, кто заметил простой и торопится восстановить сервис, — то есть кто угодно, без анализа. Имя ответственного делает решение адресным и воспроизводимым: видно, кто оценил, что механизм отказа устранён, а изменение проверено на сценарии, вызвавшем остановку.'
  id: 036-reenable-procedure-2
  fingerprint: 704252b2
