- concept: 'полный цикл переходов предохранителя: наблюдение, разрыв, остывание, проба, возврат к работе'
  question: Расположи состояния и события предохранителя (circuit breaker) в порядке одного полного цикла — от нормальной работы через срабатывание до возврата к нормальной работе после удачной пробы.
  explanation: 'Цикл замкнутый: open не финальное состояние, а half-open не отдельный режим работы, а короткий шлюз между open и closed. Неудачная проба возвращает предохранитель в open, и отсчёт остывания начинается заново — тогда цикл повторяется с шага «вызовы отклоняются».'
  kind: order
  items:
    - Предохранитель в состоянии closed пропускает вызовы и учитывает их результаты
    - Выполняется настроенное условие аварии, предохранитель переходит в open
    - Вызовы отклоняются, идёт отсчёт периода остывания
    - Период остывания истёк, предохранитель переходит в half-open
    - Пробный вызов завершается успешно, предохранитель возвращается в closed
  id: 010-breaker-states-1
  fingerprint: c2254c1a
- concept: выход из open инициируется истечением остывания, потому что в open у предохранителя нет свежих данных о состоянии инструмента
  question: Предохранитель находится в состоянии open. Что переводит его в half-open?
  explanation: Пока предохранитель open, вызовы до инструмента не доходят, значит новых данных о его состоянии не поступает вообще. Единственный доступный сигнал — время. Поэтому решение о переходе принимает таймер остывания, а данные о работоспособности появляются уже потом, из пробной попытки в half-open (по умолчанию одной).
  kind: choice
  options:
    - Истечение периода остывания
    - Сигнал от инструмента о том, что он снова работоспособен
    - Успешный вызов какого-нибудь другого инструмента
    - Обнуление счётчика неудач при перезапуске агента
  correct: 0
  id: 010-breaker-states-2
  fingerprint: 8a947eda
- concept: closed — не пассивное «всё разрешено», а режим учёта результатов, дающий основание для срабатывания
  question: Что делает предохранитель в состоянии closed, помимо того что пропускает вызовы?
  explanation: 'Условия срабатывания формулируются через историю: серия одинаковых вызовов, серия неудач, частота выше порога, опасный вызов после чтения недоверенного контента. Ни одно из них нельзя проверить без накопленного учёта, поэтому closed обязан считать. Без этого учёта переход в open просто нечем инициировать.'
  kind: choice
  options:
    - Учитывает результаты и последовательность вызовов, формируя основание для перехода в open
    - 'Ничего: closed — полностью пассивное состояние без какой-либо работы'
    - Замедляет каждый вызов, чтобы уменьшить нагрузку на инструмент
    - Требует подтверждения человека перед каждым вызовом
  correct: 0
  id: 010-breaker-states-3
  fingerprint: 7b79c270
