- concept: границу значимого действия задаёт выход эффекта за пределы процесса агента, а не субъективная опасность шага
  question: Агент готовит рассылку. Перед каким из шагов обязательна свежая проверка аварийного выключателя?
  explanation: 'Внутренняя подготовка ничего не меняет за пределами процесса: её результат можно выбросить бесплатно. Проверка нужна там, где эффект покидает процесс и становится заметен другой системе или человеку — на границе внешнего вызова.'
  kind: choice
  options:
    - Перед подстановкой данных в шаблон письма в памяти процесса
    - Перед сортировкой списка получателей во внутренней структуре
    - Перед POST-запросом в API почтового провайдера
    - Перед увеличением внутреннего счётчика обработанных получателей
  correct: 2
  id: 008-proverka-pered-deystviem-1
  fingerprint: 9bda1d65
- concept: проверка ограничивает только последующие внешние эффекты и не откатывает действие, которое уже отправлено
  question: Аварийный выключатель сработал в тот момент, когда платёжный запрос уже ушёл в банк. Какую гарантию даёт проверка перед каждым внешним действием, а какую не даёт?
  explanation: 'Отсюда практический вывод: чем крупнее шаг между проверками, тем больше эффектов проскочит после остановки. Разбивать пакетные операции на отдельные проверяемые действия — способ сузить этот зазор.'
  kind: open
  reference: 'Не даёт: отмены или отката уже отправленного запроса — он живёт вне агента, и его последствия придётся разбирать компенсирующей операцией. Даёт: агент не начнёт следующий внешний эффект — не отправит второй платёж, не запишет результат наружу. Между чтением состояния и действием всегда остаётся зазор, поэтому одна проверка охраняет ровно одно следующее действие, а не всю пачку.'
  id: 008-proverka-pered-deystviem-2
  fingerprint: e52bf9eb
