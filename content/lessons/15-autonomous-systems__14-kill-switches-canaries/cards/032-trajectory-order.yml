- concept: рубежи проверяются от глобального решения человека к локальным детекторам, и каждый следующий рассматривается только после разрешения предыдущего
  question: Расставь проверки, которые траектория выполняет перед значимым внешним действием, в правильном порядке.
  explanation: Аварийный выключатель — решение человека, обязательное для всех дорожек, поэтому никакой локальный детектор не может его задержать или переиграть. Предохранитель ограничивает одну неисправную дорожку, канарейка ловит намерение. Обратный порядок означал бы, что глобальный запрет проверяется после того, как локальные детекторы уже пропустили действие.
  kind: order
  items:
    - 'Внешний аварийный выключатель: есть ли глобальный запрет на любые действия'
    - 'Предохранитель дорожки: не открыт ли он для этого инструмента'
    - 'Канарейка: не обращается ли действие к приманке'
  id: 032-trajectory-order-1
  fingerprint: a3810322
- concept: техническая исправность вызова и его допустимость — разные критерии, поэтому успешный корректный вызов всё равно может быть остановлен детектором намерения
  question: Агент запрашивает чтение файла с фальшивым ключом доступа. Вызов синтаксически корректен, инструмент доступен, ошибок нет, предохранитель этой дорожки закрыт. Почему проверка канарейкой всё равно нужна?
  explanation: Предохранитель отвечает на вопрос «работает ли дорожка», канарейка — на вопрос «законно ли намерение». Вызов может быть безупречным технически и при этом быть именно тем событием, ради которого приманку клали.
  kind: choice
  options:
    - Она страхует предохранитель на случай, если счётчик повторов сбился
    - 'Она судит смысл обращения, а не работоспособность дорожки: у приманки нет законного сценария использования, поэтому исправный вызов остаётся тревогой'
    - Она измеряет стоимость вызова, которую предохранитель не учитывает
