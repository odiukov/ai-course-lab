- concept: признаком аномалии служит расстояние наблюдения до текущей нормы, а не его абсолютная величина
  question: Наблюдение 61 внешний вызов за интервал в одной системе поднимает тревогу, а в другой считается штатным. Что определяет разницу?
  explanation: Адаптивный детектор не знает опасного числа вызовов, он знает лишь ожидаемое. Одно и то же значение — резкий скачок относительно нормы 20 и обычный день при норме 60.
  kind: choice
  options:
    - 'Абсолютное число вызовов: в одной системе интервал длиннее'
    - Базовый уровень, сформированный недавней историей каждой системы
    - 'Стоимость вызовов: там, где вызовы дороже, тот же счёт опаснее'
  correct: 1
  id: 023-ewma-alarm-rule-1
  fingerprint: ee912dde
- concept: проверка отклонения выполняется до включения наблюдения в норму, иначе всплеск уменьшает собственное отклонение
  question: Расставь шаги обработки очередного наблюдения адаптивным детектором в правильном порядке.
  explanation: 'Если обновить норму первым, всплеск подтянет её к себе и частично замаскирует: то же самое значение даст меньшее отклонение. Детектор обязан ослабеть не раньше, чем вынес вердикт.'
  kind: order
  items:
    - Взять базовый уровень, накопленный по предыдущим наблюдениям
    - Сравнить текущее наблюдение с этим уровнем и решить вопрос о тревоге
    - Включить наблюдение в базовый уровень, получив норму для следующего шага
  id: 023-ewma-alarm-rule-2
  fingerprint: 57b66fd1
- concept: ширина допустимого отклонения обменивает ложные тревоги на пропущенные аномалии
  question: Детектор отклонения от плавающей нормы шлёт десятки тревог в день на обычных колебаниях нагрузки. Что делает расширение допустимого отклонения?
  explanation: 'Порог — единственная ручка на одной оси: узкий ловит всё, включая шум, широкий молчит, включая настоящие скачки. Выбор ширины — это выбор цены ошибки, а не устранение ошибки.'
  kind: choice
  options:
    - Убирает шумовые тревоги, но заодно пропускает часть настоящих отклонений
    - Убирает шумовые тревоги, не влияя на обнаружение настоящих отклонений
    - Ускоряет адаптацию нормы и потому чинит обе проблемы сразу
  correct: 0
  id: 023-ewma-alarm-rule-3
  fingerprint: fbaf23a4
