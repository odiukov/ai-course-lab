- concept: право на освобождение подтверждается внешним слоем авторизации, а не полем, которое может заполнить сам вызывающий
  question: Функция снятия аварийной блокировки получает вызов. Что должно служить основанием для освобождения?
  explanation: 'Строку `"human"` в аргументе может напечатать и сам агент — она не доказывает, что за освобождением стоит человек. Доверять можно только признаку, который приходит из системы, куда учётные данные агента не пишут: там подделка невозможна.'
  kind: choice
  options:
    - Аргумент `actor="human"`, переданный вызывающей стороной
    - Признак авторизации, выставленный внешним управляющим слоем и не доступный агенту для записи
    - Отчёт агента о том, что он больше не наблюдает ошибок
    - Истечение таймера остывания, заданного в конфигурации агента
  correct: 1
  id: 007-release-kill-switch-1
  fingerprint: fd6559aa
- concept: отказ в освобождении оставляет запрет полностью в силе и не производит частичных изменений состояния
  question: Вызов снятия аварийной блокировки не прошёл проверку авторизации. Опиши, что должно произойти с состоянием выключателя и что функция обязана вернуть.
  explanation: 'Опасны два варианта брака: тихое возвращение успеха при отказе (оператор думает, что запрет ещё стоит, а вызывающий думает, что снят) и частичная запись, оставляющая противоречивое состояние — блокировка формально снята, а метаданные остановки говорят обратное.'
  kind: open
  reference: 'Состояние остаётся заблокированным целиком: флаг блокировки не меняется, сопутствующие поля (кто и когда остановил, причина) тоже не перезаписываются — никакого частичного применения. Функция явно сообщает об отказе (исключение или отрицательный результат, как принято в интерфейсе), а не возвращает молчаливый успех. Правило fail-closed: при любой неуверенности в праве вызывающего система остаётся в более безопасном, остановленном состоянии.'
  id: 007-release-kill-switch-2
  fingerprint: bc2d2f35
