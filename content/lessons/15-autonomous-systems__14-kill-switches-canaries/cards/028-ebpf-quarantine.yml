- concept: переписывание назначения выполняется в датапате ядра на узле, ниже процесса агента, поэтому агент не может выбрать другой маршрут или отменить наблюдение изнутри
  question: Почему для карантина выбирают переписывание маршрута в датапате ядра узла, а не настройку прокси или переменную окружения в самом контейнере агента? Объясни своими словами.
  explanation: 'Это тот же принцип, что делает надёжной приманку: сигнал и принуждение размещают на слое, куда полномочия наблюдаемого не дотягиваются. Здесь этим слоем оказывается сетевой датапат узла.'
  kind: open
  reference: 'Всё, что живёт внутри процесса или его конфигурации, входит в зону полномочий агента: адрес прокси можно проигнорировать, переменную переопределить, соединение открыть напрямую. Правило в датапате ядра применяется к пакетам после того, как процесс их отправил, поэтому выбор назначения агентом уже ничего не решает — назначение переписывается ниже точки, где агент способен что-либо изменить. Точка принуждения должна лежать вне досягаемости того, кого она ограничивает.'
  id: 028-ebpf-quarantine-2
  fingerprint: 26d2ec3b
