- concept: 'детектор возвращает два результата, относящихся к разным моментам: вердикт о текущем наблюдении и состояние для следующего'
  question: 'Функция детектора возвращает пару: обновлённый базовый уровень и признак тревоги. К чему относится каждое из значений?'
  explanation: Вердикт вынесен по норме, существовавшей до наблюдения, поэтому он про сейчас. Новая норма ещё ни на что не повлияла и понадобится, когда придёт следующее значение — вызывающий обязан её сохранить.
  kind: choice
  options:
    - 'Оба относятся к текущему наблюдению: одно описывает его величину, другое — его опасность'
    - Признак тревоги — вердикт по текущему наблюдению, обновлённый уровень — состояние для следующего вызова
    - 'Оба относятся к следующему вызову: текущее наблюдение уже обработано вызывающим'
