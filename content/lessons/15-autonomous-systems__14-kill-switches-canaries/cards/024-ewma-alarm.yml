- concept: холодный старт инициализирует норму первым наблюдением, а не объявляет его аномалией по сравнению с нулём
  question: 'Детектор запускается впервые: накопленной нормы ещё нет, переменная базового уровня равна нулю. Что делать с первым наблюдением?'
  explanation: Сравнение с нулём даёт гарантированную ложную тревогу на каждом холодном старте. Отбрасывать тоже нельзя — тогда норма не появится никогда. Первое наблюдение служит точкой отсчёта.
  kind: choice
  options:
    - Поднять тревогу, поскольку любое положительное значение превышает нулевую норму в любое число раз
    - Принять его как стартовый базовый уровень и не считать аномалией
    - Отбросить наблюдение и ничего не обновлять до накопления нормы
  correct: 1
