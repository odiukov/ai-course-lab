<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Переходы состояний предохранителя</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f5f7fb;
      --surface: #ffffff;
      --text: #172033;
      --muted: #536078;
      --arrow: #344563;
      --closed-fill: #e4f7ed;
      --closed-stroke: #16784a;
      --closed-text: #0d5a37;
      --open-fill: #fee9e7;
      --open-stroke: #bd3c32;
      --open-text: #8d271f;
      --half-fill: #fff2cf;
      --half-stroke: #b36a00;
      --half-text: #7a4700;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #10141d;
        --surface: #171d28;
        --text: #eef3ff;
        --muted: #bac4d7;
        --arrow: #c2cce0;
        --closed-fill: #143b2b;
        --closed-stroke: #69d89d;
        --closed-text: #a8efc6;
        --open-fill: #482321;
        --open-stroke: #ff8e84;
        --open-text: #ffc0ba;
        --half-fill: #493615;
        --half-stroke: #ffc45c;
        --half-text: #ffe0a0;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    h1 {
      font-size: 22px;
    }

    .canvas {
      display: block;
      width: 100%;
      height: auto;
      background: var(--surface);
    }

    .arrow {
      fill: none;
      stroke: var(--arrow);
      stroke-width: 3px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arrow-head {
      fill: var(--arrow);
      stroke: var(--arrow);
      stroke-width: 2px;
      stroke-linejoin: round;
    }

    .state-box {
      stroke-width: 3px;
    }

    .state-closed {
      fill: var(--closed-fill);
      stroke: var(--closed-stroke);
    }

    .state-open {
      fill: var(--open-fill);
      stroke: var(--open-stroke);
    }

    .state-half {
      fill: var(--half-fill);
      stroke: var(--half-stroke);
    }

    .text-closed {
      fill: var(--closed-text);
    }

    .text-open {
      fill: var(--open-text);
    }

    .text-half {
      fill: var(--half-text);
    }

    .state-title {
      font-size: 21px;
      font-weight: bold;
    }

    .state-note {
      font-size: 15px;
    }

    .state-note-strong {
      font-size: 16px;
      font-weight: bold;
    }

    .arrow-label {
      fill: var(--text);
      stroke: var(--surface);
      stroke-width: 6px;
      paint-order: stroke fill;
      font-size: 16px;
      font-weight: bold;
    }

    .arrow-detail {
      fill: var(--muted);
      stroke: var(--surface);
      stroke-width: 6px;
      paint-order: stroke fill;
      font-size: 15px;
    }

    .fallback {
      color: var(--text);
      background: var(--surface);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1 id="diagram-title">Переходы состояний предохранителя</h1>

  <svg
    id="diagram"
    class="canvas"
    width="960"
    height="330"
    viewBox="0 0 960 330"
    preserveAspectRatio="xMidYMid meet"
    role="img"
    aria-labelledby="diagram-title diagram-desc"
  >
    <desc id="diagram-desc">
      Предохранитель переходит из closed в open после срабатывания
      триггера, после охлаждения — в half-open. Единственная проба
      возвращает его в closed при успехе или в open при неудаче.
    </desc>
  </svg>

  <p id="fallback" class="fallback" hidden>
    Схема должна была показать переходы closed → open → half-open:
    после охлаждения разрешена ровно одна пробная попытка. Успех
    возвращает closed, а неудача — open и запускает охлаждение заново.
  </p>

  <noscript>
    <p class="fallback">
      Схема: closed → open → half-open. После охлаждения разрешена
      ровно одна пробная попытка; успех ведёт в closed, неудача — в open.
    </p>
  </noscript>

  <script>
    const diagramData = [
      {
        states: [
          {
            kind: "closed",
            boxClass: "state-closed",
            textClass: "text-closed",
            center: { x: -37, y: -5 },
            halfWidth: 12,
            halfHeight: 6.5,
            corner: 1.4,
            lines: [
              {
                text: "closed",
                point: { x: -37, y: -7.8 },
                className: "state-title"
              },
              {
                text: "действия",
                point: { x: -37, y: -3.3 },
                className: "state-note"
              },
              {
                text: "разрешены",
                point: { x: -37, y: -0.2 },
                className: "state-note"
              }
            ]
          },
          {
            kind: "open",
            boxClass: "state-open",
            textClass: "text-open",
            center: { x: 37, y: -5 },
            halfWidth: 12,
            halfHeight: 6.5,
            corner: 1.4,
            lines: [
              {
                text: "open",
                point: { x: 37, y: -7.8 },
                className: "state-title"
              },
              {
                text: "новые попытки",
                point: { x: 37, y: -3.3 },
                className: "state-note"
              },
              {
                text: "блокируются",
                point: { x: 37, y: -0.2 },
                className: "state-note"
              }
            ]
          },
          {
            kind: "half",
            boxClass: "state-half",
            textClass: "text-half",
            center: { x: 0, y: 20 },
            halfWidth: 15,
            halfHeight: 6.5,
            corner: 1.4,
            lines: [
              {
                text: "half-open",
                point: { x: 0, y: 17.5 },
                className: "state-title"
              },
              {
                text: "разрешена ровно",
                point: { x: 0, y: 21.4 },
                className: "state-note"
              },
              {
                text: "1 пробная попытка",
                point: { x: 0, y: 24.6 },
                className: "state-note-strong"
              }
            ]
          }
        ],
        arrows: [
          {
            segments: [
              { command: "M", point: { x: -25, y: -5 } },
              { command: "L", point: { x: 25, y: -5 } }
            ],
            head: [
              { x: 25, y: -5 },
              { x: 22.2, y: -7 },
              { x: 22.2, y: -3 }
            ],
            labels: [
              {
                text: "триггер сработал",
                point: { x: -13, y: -7.4 },
                dx: 0,
                dy: -1,
                anchor: "middle",
                className: "arrow-label"
              }
            ]
          },
          {
            segments: [
              { command: "M", point: { x: 38, y: 1.5 } },
              {
                command: "C",
                first: { x: 38, y: 10 },
                second: { x: 28, y: 19.5 },
                point: { x: 15, y: 20 }
              }
            ],
            head: [
              { x: 15, y: 20 },
              { x: 18, y: 17.9 },
              { x: 18.1, y: 21.8 }
            ],
            labels: [
              {
                text: "после охлаждения",
                point: { x: 39, y: 8.1 },
                dx: 1,
                dy: 0,
                anchor: "start",
                className: "arrow-label"
              }
            ]
          },
          {
            segments: [
              { command: "M", point: { x: -15, y: 20 } },
              {
                command: "C",
                first: { x: -28, y: 20 },
                second: { x: -37, y: 12 },
                point: { x: -37, y: 1.5 }
              }
            ],
            head: [
              { x: -37, y: 1.5 },
              { x: -39.2, y: 4.5 },
              { x: -34.8, y: 4.5 }
            ],
            labels: [
              {
                text: "проба успешна",
                point: { x: -32, y: 12.2 },
                dx: -1,
                dy: 0,
                anchor: "end",
                className: "arrow-label"
              }
            ]
          },
          {
            segments: [
              { command: "M", point: { x: 9, y: 13.5 } },
              {
                command: "C",
                first: { x: 15, y: 9.5 },
                second: { x: 21, y: 4.5 },
                point: { x: 25, y: 0.3 }
              }
            ],
            head: [
              { x: 25, y: 0.3 },
              { x: 21.3, y: 1 },
              { x: 24.1, y: 3.6 }
            ],
            labels: [
              {
                text: "проба неудачна",
                point: { x: 8.5, y: 7.2 },
                dx: -1,
                dy: 0,
                anchor: "end",
                className: "arrow-label"
              },
              {
                text: "остывание заново",
                point: { x: 8.5, y: 10 },
                dx: -1,
                dy: 0,
                anchor: "end",
                className: "arrow-detail"
              }
            ]
          }
        ]
      }
    ];

    const origin = Object.freeze({ x: 480, y: 108 });
    const scale = 7.4;
    const sx = x => origin.x + x * scale;
    const sy = y => origin.y + y * scale;
    const labelPadding = 8;

    const svg = document.getElementById("diagram");
    const fallback = document.getElementById("fallback");
    const namespace = svg.namespaceURI;
    const [model] = diagramData;

    function make(tag, className) {
      const node = document.createElementNS(namespace, tag);
      if (className) {
        node.setAttribute("class", className);
      }
      return node;
    }

    function appendArrow(arrow) {
      const path = make("path", "arrow");
      const parts = [];

      for (const segment of arrow.segments) {
        if (segment.command === "C") {
          parts.push(
            segment.command,
            sx(segment.first.x),
            sy(segment.first.y),
            sx(segment.second.x),
            sy(segment.second.y),
            sx(segment.point.x),
            sy(segment.point.y)
          );
        } else {
          parts.push(
            segment.command,
            sx(segment.point.x),
            sy(segment.point.y)
          );
        }
      }

      path.setAttribute("d", parts.join(" "));
      svg.append(path);

      const head = make("polygon", "arrow-head");
      head.setAttribute(
        "points",
        arrow.head
          .map(point => `${sx(point.x)},${sy(point.y)}`)
          .join(" ")
      );
      svg.append(head);
    }

    function appendState(state) {
      const box = make(
        "rect",
        `state-box ${state.boxClass}`
      );

      box.setAttribute(
        "x",
        sx(state.center.x - state.halfWidth)
      );
      box.setAttribute(
        "y",
        sy(state.center.y - state.halfHeight)
      );
      box.setAttribute(
        "width",
        sx(state.center.x + state.halfWidth) -
          sx(state.center.x - state.halfWidth)
      );
      box.setAttribute(
        "height",
        sy(state.center.y + state.halfHeight) -
          sy(state.center.y - state.halfHeight)
      );
      box.setAttribute(
        "rx",
        sx(state.corner) - sx(0)
      );
      box.setAttribute(
        "ry",
        sy(state.corner) - sy(0)
      );
      svg.append(box);

      for (const line of state.lines) {
        const text = make(
          "text",
          `${line.className} ${state.textClass}`
        );
        text.setAttribute("x", sx(line.point.x));
        text.setAttribute("y", sy(line.point.y));
        text.setAttribute("text-anchor", "middle");
        text.textContent = line.text;
        svg.append(text);
      }
    }

    function appendLabel(label) {
      const text = make("text", label.className);
      text.setAttribute("x", sx(label.point.x));
      text.setAttribute("y", sy(label.point.y));
      text.setAttribute("dx", label.dx * labelPadding);
      text.setAttribute("dy", label.dy * labelPadding);
      text.setAttribute("text-anchor", label.anchor);
      text.textContent = label.text;
      svg.append(text);
    }

    try {
      for (const arrow of model.arrows) {
        appendArrow(arrow);
      }

      for (const state of model.states) {
        appendState(state);
      }

      for (const arrow of model.arrows) {
        for (const label of arrow.labels) {
          appendLabel(label);
        }
      }
    } catch (error) {
      svg.hidden = true;
      fallback.hidden = false;
    }
  </script>
</body>
</html>
