- concept: обученная модель хранит найденные правила в своих числовых параметрах
  question: Что в машинном обучении играет роль правил после завершения обучения?
  explanation: Результат обучения — модель. Найденные закономерности закодированы в значениях её параметров, поэтому модель выполняет роль правил, которые в обычной программе задаёт разработчик.
  kind: choice
  options:
    - Обученная модель с настроенными параметрами
    - Набор правильных ответов без входных данных
    - Алгоритм обучения до запуска
    - Новые объекты, для которых нужны предсказания
  correct: 0
  id: 003-dva-napravleniya-1
  fingerprint: 7f7453af
- concept: при применении обученной модели правильный ответ заранее не требуется
  question: Классификатор уже обучен. Что нужно, чтобы определить класс нового объекта?
  explanation: Правильные ответы нужны на этапе обучения. После него модель принимает ранее не встречавшийся объект и сама выдаёт предсказание на основе усвоенных закономерностей.
  kind: choice
  options:
    - Подать новый объект в обученную модель и получить предсказание
    - Подать новый объект вместе с его правильным классом
    - Снова запустить обучение только на новом объекте
    - Использовать алгоритм обучения без сохранённой модели
  correct: 0
