  fingerprint: bc731d72
- concept: смысл найденных кластеров не задаётся алгоритмом и требует интерпретации человеком
  question: Почему после кластеризации аналитик обычно изучает состав полученных групп, прежде чем давать им содержательные названия?
  explanation: Кластеризация обнаруживает структуру, а не готовые предметные категории. Один и тот же кластер можно содержательно назвать только после изучения его характерных признаков и участников.
  kind: open
  reference: Алгоритм объединяет примеры по обнаруженному сходству, но заранее заданных меток и значений групп у него нет. Поэтому содержательный смысл каждого кластера определяют после анализа входящих в него объектов.
  id: 007-unsupervised-3
  fingerprint: aa628c0c
