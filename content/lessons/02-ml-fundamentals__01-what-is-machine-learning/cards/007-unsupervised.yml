- concept: понижение размерности описывает объекты меньшим числом признаков с сохранением существенной структуры данных
  question: Инженер хочет получить компактное представление сложных объектов, при котором близкие объекты по возможности останутся близкими. Какой метод соответствует этой цели?
  explanation: Понижение размерности заменяет исходное множество признаков более компактным представлением, стараясь сохранить важные отношения между примерами.
  kind: choice
  options:
    - Классификация
    - Регрессия
    - Обучение стратегии по наградам
    - Понижение размерности
  correct: 3
