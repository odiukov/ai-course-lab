- concept: не существует алгоритма машинного обучения, превосходящего все остальные на любых задачах
  question: Алгоритм A точнее алгоритма B на одном классе данных, а на другом классе данных результаты меняются местами. Какой вывод наиболее обоснован?
  explanation: 'Согласно No Free Lunch Theorem, универсально лучшего алгоритма нет: предположения, полезные для одного класса задач, могут мешать на другом. Поэтому качество метода оценивают применительно к конкретным данным и требованиям.'
  kind: choice
  options:
    - Алгоритм A реализован с ошибкой
    - Алгоритм B нужно обучать только на первом классе данных
    - Преимущество алгоритма зависит от свойств конкретной задачи
    - Достаточно увеличить объём данных, и алгоритм A станет лучшим везде
  correct: 2
  id: 058-no-free-lunch-1
  fingerprint: b875ab7c
- concept: алгоритм выбирают через отбор подходящих кандидатов и их экспериментальное сравнение
  question: Расположите действия в разумном порядке при выборе алгоритма машинного обучения.
  explanation: Размер и структура данных, требования к объяснимости и доступные вычисления помогают сузить круг кандидатов. Окончательный выбор делают по результатам сопоставимого эксперимента, а не по популярности алгоритма.
  kind: order
  items:
    - Определить свойства данных и ограничения проекта
    - Отобрать несколько подходящих алгоритмов-кандидатов
    - Обучить кандидатов в сопоставимых условиях
    - Сравнить их качество на валидационных данных
  id: 058-no-free-lunch-2
  fingerprint: f8bffbc0
- concept: выбор модели учитывает не только качество прогнозов, но также интерпретируемость и вычислительные ограничения
  question: Объясните своими словами, почему модель с немного более высоким валидационным качеством не обязательно является лучшим выбором для проекта.
  explanation: Практически подходящая модель должна не только давать хорошие прогнозы, но и укладываться в вычислительный бюджет и требования к интерпретируемости. Поэтому максимальная метрика сама по себе не определяет лучший вариант.
  kind: open
  reference: Она может требовать недоступных вычислительных ресурсов, слишком долго обучаться или не позволять объяснять решения там, где это необходимо. Выбор модели учитывает требования и ограничения проекта наряду с качеством прогнозов.
  id: 058-no-free-lunch-3
  fingerprint: 82f698bc
