- concept: MAE — это среднее абсолютное расстояние между числовыми прогнозами и фактическими значениями
  question: Регрессионная модель выдала прогнозы 34, 51 и 76, а фактические значения оказались равны 40, 39 и 64. Чему равна средняя абсолютная ошибка (MAE)?
  explanation: 'Абсолютные промахи равны 6, 12 и 12. Их среднее: (6 + 12 + 12) / 3 = 10. MAE учитывает размер промаха, а не только факт точного совпадения.'
  kind: numeric
  answer: 10
  tolerance: 0.01
  id: 016-regression-1
  fingerprint: b18f0c59
- concept: решение регрессии представляет собой функцию или кривую, приближающую числовые наблюдения
  question: По температуре воздуха модель должна предсказывать потребление электроэнергии. Что в этом случае описывает обученное регрессионное решение?
  explanation: 'Регрессия приближает зависимость числового выхода от признаков: её можно представить кривой или более сложной поверхностью, проходящей близко к наблюдаемым точкам.'
  kind: choice
  options:
    - Кривая, сопоставляющая каждой температуре прогноз потребления
    - Граница, разделяющая дни на тёплые и холодные
    - Набор групп похожих дней без числового прогноза
    - Список допустимых категорий потребления
  correct: 0
