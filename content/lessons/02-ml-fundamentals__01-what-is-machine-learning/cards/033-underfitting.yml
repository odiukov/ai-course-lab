- concept: недообучение устраняют увеличением способности модели выражать закономерности
  question: Модель после полноценного обучения всё ещё плохо предсказывает как обучающие, так и новые примеры. Почему переход к более сложной модели может улучшить результат?
  explanation: 'Недообученная модель имеет высокое смещение: её ограничения не позволяют достаточно точно описать данные. Увеличение сложности расширяет множество зависимостей, которые она способна выучить.'
  kind: open
  reference: Высокая ошибка на обучающих данных указывает, что текущей модели может не хватать выразительности для существующей закономерности. Более сложная модель способна представить зависимость, которую простая модель систематически пропускает. Также могут помочь дополнительные признаки, ослабление регуляризации или более долгое обучение.
  id: 033-underfitting-2
  fingerprint: 3546b2f0
