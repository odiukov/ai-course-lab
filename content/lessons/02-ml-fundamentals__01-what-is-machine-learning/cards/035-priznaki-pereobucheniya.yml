- concept: одна обучающая метрика не позволяет диагностировать качество подгонки без валидационной метрики
  question: Для классификатора сообщена только точность на обучающей выборке — 98%. Какой вывод можно сделать о качестве подгонки модели?
  explanation: Обучающая точность показывает лишь качество на уже виденных примерах. Чтобы оценить подгонку и обобщение, её необходимо сопоставить с валидационной точностью.
  kind: choice
  options:
    - Модель точно хорошо обобщает
    - Модель точно переобучена
    - 'Диагноз поставить нельзя: нужна точность на данных, не использованных для обучения'
    - Модель точно недообучена
  correct: 2
  id: 035-priznaki-pereobucheniya-1
  fingerprint: 795d2dc0
- concept: валидационная точность, сильно превышающая обучающую, требует проверки разбиения данных
  question: При одинаковом способе вычисления метрик точность модели на обучении составила 84%, а на валидации — 96%. Что следует проверить в первую очередь и почему?
  explanation: Обычно модель лучше справляется с примерами, на которых обучалась. Если валидационный результат заметно выше обучающего, сначала проверяют разделение данных и отсутствие пересечения между выборками.
  kind: open
  reference: Следует проверить корректность разбиения данных и независимость валидационной выборки. Настолько более высокое качество на валидации нетипично и может означать, что выборки сформированы неправильно.
  id: 035-priznaki-pereobucheniya-2
  fingerprint: bd6356a5
