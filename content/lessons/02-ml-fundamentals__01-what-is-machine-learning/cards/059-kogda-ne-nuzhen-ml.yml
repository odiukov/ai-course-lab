- concept: модель систематически устаревает, если предметные правила меняются быстрее полного цикла переобучения
  question: Правила предметной области обновляются каждые 8 часов, а переобучение и выкладка модели занимают 40 часов. Сколько циклов обновления правил проходит за один цикл переобучения?
  explanation: За время переобучения проходит 40 / 8 = 5 обновлений правил. Значит, к моменту выкладки модель уже отражает устаревшее состояние задачи; без ускорения цикла или смены подхода ML здесь непрактичен.
