- concept: категориальный целевой ответ задаёт классификацию, а числовой — регрессию
  question: 'Есть два размеченных набора: фотографии животных с названиями видов и характеристики квартир с указанной арендной платой. Объясни, где решается классификация, а где регрессия, и назови вход и ответ в каждом случае.'
  explanation: 'Обе задачи относятся к обучению с учителем, поскольку ответы известны заранее. Выбор между классификацией и регрессией определяется типом ответа: категория или числовая величина.'
  kind: open
  reference: 'Для фотографий решается классификация: вход — изображение, ответ — категория вида животного. Для квартир решается регрессия: вход — характеристики квартиры, ответ — числовая арендная плата.'
