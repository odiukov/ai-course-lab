- concept: типичный ML-проект проходит от формулировки задачи до мониторинга внедрённой модели
  question: Расположите этапы типичного ML-проекта в правильном порядке.
  explanation: Сначала формулируют измеримую задачу, затем готовят данные и признаки, обучают и независимо оценивают модель. Внедрение выполняют после проверки, а мониторинг продолжают уже в эксплуатации.
  kind: order
  items:
    - Определить целевую величину и метрику качества
    - Собрать и подготовить данные
    - Сформировать признаки
    - Обучить модель
    - Оценить модель на отложенных данных
    - Внедрить модель
    - Отслеживать работу модели после внедрения
  id: 020-workflow-obzor-1
  fingerprint: b8f2030f
- concept: качество обобщения проверяют на данных, не использованных при обучении
  question: Модель почти безошибочно предсказывает ответы для объектов, на которых обучалась. Как надёжнее всего проверить её способность работать с новыми объектами?
  explanation: Результат на обучающих объектах может быть завышен из-за переобучения. Отложенная выборка позволяет оценить, насколько хорошо модель переносит найденные зависимости на новые данные.
  kind: choice
  options:
    - Оценить модель на заранее отложенной выборке
    - Продолжить обучение и снова проверить на обучающей выборке
    - Сразу внедрить модель для всех пользователей
    - Удалить из отчёта примеры с ошибочными прогнозами
  correct: 0
  id: 020-workflow-obzor-2
  fingerprint: 683500d2
- concept: неудовлетворительная оценка модели может потребовать возврата к данным и признакам
  question: Объясните своими словами, почему после неудачной оценки ML-модели недостаточно всегда просто заменить алгоритм обучения.
  explanation: 'Алгоритм не может восстановить информацию, которой нет во входных данных, или исправить систематически неверную разметку. Поэтому ML-конвейер итеративен: результаты оценки определяют, к какому из предыдущих этапов нужно вернуться.'
  kind: open
  reference: Причиной ошибок могут быть нерепрезентативные или некачественные данные, неверная разметка либо признаки, в которых отсутствует нужный сигнал. Поэтому следует проанализировать ошибки и при необходимости вернуться к подготовке данных или признаков, а затем повторить обучение и оценку.
  id: 020-workflow-obzor-3
  fingerprint: fac66955
