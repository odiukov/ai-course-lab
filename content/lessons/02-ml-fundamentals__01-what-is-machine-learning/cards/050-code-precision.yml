- concept: precision равен доле истинно положительных объектов среди всех положительных предсказаний
  question: Спам-фильтр пометил спамом 18 писем. Среди них 11 писем действительно оказались спамом. Чему равен precision?
  explanation: Precision = TP / (TP + FP). Все положительные предсказания уже составляют знаменатель, поэтому precision = 11 / 18 ≈ 0.611. Письма, которые фильтр не пометил как спам, в этот расчёт не входят.
  kind: numeric
  answer: 0.611
  tolerance: 0.001
  id: 050-code-precision-1
  fingerprint: ebe8dde9
- concept: при отсутствии положительных предсказаний precision требует явной обработки нулевого знаменателя
  question: Модель не выдала ни одного положительного предсказания. Как должна вести себя надёжная реализация precision?
  explanation: Если положительных предсказаний нет, то TP + FP = 0 и обычная формула приводит к делению на ноль. Этот случай обрабатывают отдельно; распространённый контракт функции — вернуть 0.0.
  kind: choice
  options:
    - Заранее обработать этот случай и вернуть значение, установленное контрактом функции
    - Разделить число истинно положительных результатов на число фактически положительных объектов
    - Считать все отрицательные предсказания ложноположительными
    - Повторять вычисление, пока знаменатель не станет ненулевым
