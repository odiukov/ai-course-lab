- concept: алгоритмы машинного обучения различаются формой и сложностью изучаемого представления, сохраняя общую схему работы
  question: Чем в общей схеме машинного обучения прежде всего различаются классификатор по ближайшему центроиду, линейная модель и трансформер?
  explanation: Центроиды, веса линейной модели и параметры трансформера — разные изучаемые представления. Однако каждый из этих алгоритмов сначала строит представление, затем предсказывает и после этого проходит оценку.
