- concept: награда оценивает последствия действия, но не указывает правильное действие
  question: Что сообщает агенту награда в обучении с подкреплением?
  explanation: 'Награда — это оценка результата действия. Она не служит готовой инструкцией: агент сам выясняет, какие действия в разных состояниях приводят к желательным последствиям.'
  kind: choice
  options:
    - Насколько желательным оказалось последствие действия
    - Какое именно действие нужно было выбрать
    - К какому заранее размеченному классу относится ситуация
  correct: 0
  id: 008-reinforcement-1
  fingerprint: aafa5ad1
- concept: качество поведения агента определяется суммарной наградой за последовательность действий
  question: Агент получает 9 баллов за успешное завершение эпизода и штраф 0.5 балла за каждый из 8 сделанных ходов. Других наград нет. Какова суммарная награда?
  explanation: 'Нужно сложить все награды и штрафы за эпизод: 9 − 8 × 0.5 = 5. Именно такую суммарную награду стремится увеличить политика агента.'
  kind: numeric
  answer: 5
  tolerance: 0.001
  id: 008-reinforcement-2
  fingerprint: 8b26ee5a
- concept: отложенная награда создаёт задачу определения действий, повлиявших на итог
  question: Почему агенту трудно учиться, если наказание выдаётся только в конце длинной последовательности действий?
  explanation: 'Это проблема распределения ответственности: отложенный сигнал нужно связать с более ранними решениями, хотя среда не указывает виновное действие напрямую.'
  kind: open
  reference: Итоговое наказание не показывает, какое из предыдущих действий стало причиной плохого результата. Агенту приходится по множеству попыток определять вклад отдельных действий.
  id: 008-reinforcement-3
  fingerprint: c4d3317d
