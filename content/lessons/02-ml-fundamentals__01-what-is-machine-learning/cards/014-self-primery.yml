- concept: в masked language modeling модель восстанавливает скрытые токены по видимому контексту
  question: Объясните, как из обычного предложения получить обучающий пример для masked language modeling без ручной разметки.
  explanation: 'Исходное предложение содержит и вход, и правильный ответ: видимые токены образуют контекст, а скрытые исходные токены становятся целями для предсказания.'
  kind: open
  reference: Часть токенов скрывают во входе, а их исходные значения используют как целевые ответы. Модель учится восстанавливать скрытые токены по оставшемуся контексту.
  id: 014-self-primery-1
  fingerprint: f7dc849d
- concept: в контрастивном обучении изменённые версии одного объекта образуют положительную пару
  question: Какая пара обычно считается положительной при контрастивном обучении изображений?
  explanation: Положительную пару получают из одного оригинала с помощью преобразований вроде обрезки или изменения цвета. Представления такой пары сближают, а представления версий других изображений — различают.
  kind: choice
  options:
    - Две независимо изменённые версии одного исходного изображения
    - Изображения разных объектов, снятых на похожем фоне
    - Любые изображения, которым модель уже назначила одинаковый класс
  correct: 0
  id: 014-self-primery-2
  fingerprint: f4ad975a
- concept: при next-token prediction каждый префикс текста сопоставляется со следующим токеном
  question: Расположите этапы создания обучающих примеров для предсказания следующего токена.
  explanation: В next-token prediction цель находится сразу после входного префикса. Последовательное смещение границы превращает один текст в множество обучающих пар «контекст — следующий токен».
  kind: order
  items:
    - Выбрать префикс последовательности как вход модели
    - Взять непосредственно следующий токен как целевой ответ
    - Обучить модель предсказывать этот токен по префиксу
    - Сдвинуть границу префикса вперёд и сформировать новый пример
  id: 014-self-primery-3
  fingerprint: 004435ff
