- concept: регуляризация добавляет к функции потерь штраф за большие веса
  question: Заполни пропуск в схематичной записи функции потерь с регуляризацией.
  explanation: Регуляризация заставляет обучение учитывать не только ошибку предсказаний, но и величину весов. Большие веса повышают итоговую функцию потерь, поэтому модель выбирает менее склонные к переобучению параметры.
