- concept: dropout случайно отключает нейроны при обучении и снижает зависимость от отдельных участков сети
  question: Объясни своими словами, что делает dropout во время обучения и почему это может уменьшить переобучение.
  explanation: Временно отключая случайные нейроны, dropout мешает отдельным частям сети стать незаменимыми. Это ограничивает совместное заучивание обучающих примеров и обычно улучшает работу на новых данных.
  kind: open
  reference: Dropout случайно зануляет часть нейронов во время обучения. Модель не может постоянно полагаться на одни и те же участки сети, поэтому учится распределять полезные закономерности и меньше запоминает шум.
