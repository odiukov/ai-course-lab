- concept: на несбалансированных данных предсказание самого частого класса служит важной тривиальной базой
  question: В тестовой выборке самый частый класс составляет 73% объектов. Модель получила accuracy 71%. Как следует оценить результат?
  explanation: Стратегия всегда выбирать самый частый класс дала бы 73%, а модель получила лишь 71%. Высокая абсолютная точность не означает пользы, если её превосходит простая база.
  kind: choice
  options:
    - Модель полезна, потому что правильно классифицирует большинство объектов
    - Модель хуже тривиальной стратегии всегда выбирать самый частый класс
    - Модель обязательно переобучилась
    - Сравнивать модель с частотой классов не требуется
  correct: 1
  id: 043-baseline-zachem-1
  fingerprint: 42249f5b
- concept: ожидаемая точность равномерного случайного угадывания равна обратному числу классов
  question: В задаче есть 8 классов. Базовый классификатор выбирает каждый класс с одинаковой вероятностью. Какова его ожидаемая accuracy в процентах?
  explanation: Вероятность угадать правильный класс равна 1/8, то есть 12.5%. Именно с этой случайной базой можно сравнивать качество модели.
  kind: numeric
  answer: 12.5
  tolerance: 0.1
