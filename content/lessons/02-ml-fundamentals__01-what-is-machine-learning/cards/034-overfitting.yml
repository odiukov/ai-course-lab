- concept: переобучение проявляется низкой ошибкой на обучении и высокой ошибкой на новых данных
  question: Какое сочетание результатов наиболее явно указывает на переобучение модели?
  explanation: При переобучении модель подгоняется под обучающие примеры, поэтому почти не ошибается на них, но плохо переносит найденную зависимость на новые данные.
  kind: choice
  options:
    - Низкая ошибка на обучающей выборке и высокая на валидационной
    - Высокая ошибка и на обучающей, и на валидационной выборке
    - Низкая ошибка и на обучающей, и на валидационной выборке
    - Высокая ошибка на обучающей выборке и низкая на валидационной
  correct: 0
  id: 034-overfitting-1
  fingerprint: 8fca2961
- concept: уменьшение сложности модели ограничивает запоминание шума и может улучшить обобщение
  question: Почему уменьшение числа параметров модели иногда улучшает её качество на новых данных, хотя ошибка на обучающей выборке может вырасти?
  explanation: Дополнительная гибкость позволяет модели запоминать не только полезную зависимость, но и шум. Ограничение сложности уменьшает такую подгонку и сокращает разрыв между качеством на обучающих и новых данных.
  kind: open
  reference: Менее сложной модели труднее подогнаться под случайные особенности каждого обучающего примера. Она может хуже запомнить обучающую выборку, зато чаще выделяет устойчивую закономерность и лучше работает на новых данных.
  id: 034-overfitting-2
  fingerprint: d06a4a0a
