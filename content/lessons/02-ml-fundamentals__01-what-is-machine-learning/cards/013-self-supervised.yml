- concept: self-supervised learning формально использует схему обучения с учителем, но получает цели без участия разметчика
  question: Почему self-supervised learning можно формально считать обучением с учителем, хотя люди не размечают данные?
  explanation: Критерий здесь — наличие пары «вход — целевой ответ» и ошибки предсказания. В self-supervised learning такая пара есть, но целевой ответ извлекается из самого объекта, а не предоставляется человеком.
  kind: open
  reference: 'Для каждого входа всё равно существует целевой ответ: модель делает предсказание, сравнивает его с целью и обучается по ошибке. Отличие в том, что цель автоматически создаётся из исходных данных, например берётся из скрытого фрагмента.'
  id: 013-self-supervised-2
