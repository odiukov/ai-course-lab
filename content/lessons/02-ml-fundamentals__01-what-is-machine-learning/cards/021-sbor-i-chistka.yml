- concept: пропуски требуют явной стратегии обработки, поскольку отсутствие измерения не является обычным значением признака
  question: Объясни своими словами, почему перед обучением модели нужно обработать пропуски и какие основные варианты действий доступны.
  explanation: 'Универсального решения для пропусков нет: удаление может сократить выборку, а заполнение — внести систематическое искажение. Поэтому способ обработки выбирают с учётом причины отсутствия данных.'
  kind: open
  reference: 'Нужно определить природу пропусков и осознанно выбрать стратегию: удалить непригодные записи или признаки либо заполнить отсутствующие значения подходящей оценкой. Иначе алгоритм может неверно интерпретировать отсутствие данных или вообще не суметь обработать вход.'
  id: 021-sbor-i-chistka-2
  fingerprint: 4532f310
- concept: исследование распределений помогает обнаруживать аномальные или ошибочные значения до обучения модели
  question: При изучении распределения числового признака аналитик нашёл редкие значения за пределами допустимого диапазона. Как следует поступить на этапе очистки и исследования данных?
  explanation: Необычное значение может быть как ошибкой, так и редким достоверным случаем. Сначала выясняют его происхождение, а затем принимают обоснованное решение об обработке.
  kind: choice
  options:
    - Исследовать источник значений и решить, исправить, удалить или сохранить их как достоверные наблюдения
    - 'Сразу обучить модель: алгоритм всегда самостоятельно распознаёт ошибки ввода'
    - Переместить все такие записи в тестовую выборку
    - Продублировать обычные записи, чтобы аномалии стали менее заметны
  correct: 0
