- concept: смещение и дисперсия определяются по разным геометрическим характеристикам облака прогнозов
  question: На мишени показаны прогнозы независимо обученных моделей для фиксированного объекта, а центр мишени обозначает истинное значение. Как по облаку точек раздельно оценить смещение и дисперсию?
  explanation: Смещение сравнивает средний прогноз с истиной, а дисперсия описывает отклонения отдельных прогнозов от их собственного среднего. Поэтому облако может быть компактным, но смещённым, или широким, но в среднем расположенным у цели.
  kind: open
  reference: Нужно найти среднее положение облака. Расстояние и направление от этого положения до истинного значения характеризуют смещение. Разброс точек вокруг среднего положения характеризует дисперсию.
  id: 038-oshibka-razlozhenie-2
  fingerprint: 6a038d03
