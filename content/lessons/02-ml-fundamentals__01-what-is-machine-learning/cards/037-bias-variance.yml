- concept: ожидаемая ошибка раскладывается на квадрат смещения, дисперсию и неустранимый шум
  question: Заполни пропуск в разложении ожидаемой ошибки модели.
  explanation: Полная ошибка состоит из квадрата смещения, дисперсии и неустранимого шума. Первые два компонента можно балансировать выбором модели, а шум обусловлен случайностью самих данных и полностью не устраняется.
