- concept: высокая дисперсия проявляется сильной зависимостью предсказаний от конкретной обучающей выборки
  question: Один и тот же алгоритм обучают на разных выборках из одного распределения, после чего получаются заметно различающиеся функции предсказания. О чём это свидетельствует?
  explanation: Если небольшая смена обучающих данных сильно меняет модель, она чувствительна к особенностям конкретной выборки. Это признак высокой дисперсии.
