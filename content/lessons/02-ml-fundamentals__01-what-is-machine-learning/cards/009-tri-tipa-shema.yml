- concept: обучение без учителя работает с набором наблюдений, а обучение с подкреплением — с действиями агента в среде
  question: Чем задача поиска структуры в готовом наборе наблюдений без меток отличается от задачи, где система выбирает действия, меняет состояние среды и получает обратную связь?
  explanation: 'Отсутствие меток само по себе ещё не означает обучение с подкреплением. Его отличительный признак — активное взаимодействие агента со средой: выбранные действия влияют на дальнейший опыт.'
  kind: open
  reference: 'В первом случае применяется обучение без учителя: алгоритм исследует структуру уже имеющихся наблюдений. Во втором — обучение с подкреплением: агент сам выбирает действия, взаимодействует со средой и учится по получаемой обратной связи.'
