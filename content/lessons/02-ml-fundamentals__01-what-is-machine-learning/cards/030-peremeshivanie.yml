- concept: при прогнозировании будущего данные делят хронологически, чтобы исключить утечку информации из будущего
  question: Объясни своими словами, почему при обучении модели прогноза спроса нельзя случайно перемешивать наблюдения из разных дат перед разделением данных.
  explanation: 'Во временных задачах порядок несёт информацию. Хронологическое разделение воспроизводит реальное применение модели: доступно только прошлое, а предсказать требуется будущее.'
  kind: open
  reference: После перемешивания будущие наблюдения могут попасть в обучение, а более ранние — в проверку. Такая модель получает информацию, которой в реальном моменте прогноза ещё не было, поэтому оценка оказывается нечестной. Для временного прогноза обучаются на прошлом, а проверяют на более позднем периоде.
  id: 030-peremeshivanie-2
