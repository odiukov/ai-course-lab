- concept: многократная настройка по валидационной выборке может привести к переобучению на неё
  question: Почему после множества изменений модели, выбранных по результатам на одной и той же валидационной выборке, её качество нужно отдельно проверить на нетронутой тестовой выборке?
  explanation: Валидационные данные не участвуют в непосредственной настройке параметров модели, но влияют на выбор признаков, алгоритма и гиперпараметров. При многократных попытках возникает переобучение на валидацию, поэтому итоговую оценку проводят на данных, не использованных для выбора решений.
  kind: open
  reference: Каждое решение, принятое по валидационному результату, косвенно подстраивает модель и процесс разработки под особенности этой выборки. Поэтому её оценка постепенно становится оптимистичной. Нетронутая тестовая выборка позволяет независимо оценить уже выбранный вариант модели.
  id: 023-train-evaluate-2
