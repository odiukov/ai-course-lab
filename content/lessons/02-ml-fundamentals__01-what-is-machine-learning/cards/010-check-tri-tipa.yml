- concept: тип обучения зависит от способа получения обучающего сигнала, а не от предметной области задачи
  question: Две команды обучают персонажей для одной и той же игры. Первая показывает модели игровые ситуации вместе с ходами эксперта. Вторая позволяет агенту играть самостоятельно и сообщает ему только награды за результаты. Какие типы обучения они используют?
  explanation: Предметная область не определяет тип обучения. Ходы эксперта служат целевыми ответами для обучения с учителем, а награды за самостоятельные действия образуют обучение с подкреплением.
  kind: choice
  options:
    - Первая — с учителем, вторая — с подкреплением
    - Обе — с учителем, потому что решают одну задачу
    - Первая — без учителя, вторая — с учителем
    - Обе — с подкреплением, потому что работают с игрой
