- concept: добавочная ценность модели измеряется выигрышем относительно тривиальной базы
  question: Модель получила accuracy 92%, а подходящая тривиальная база — 89%. На сколько процентных пунктов модель превосходит базу?
  explanation: 'Нужно вычесть точность базы из точности модели: 92% − 89% = 3 процентных пункта. Именно этот разрыв, а не изолированная accuracy модели, показывает её добавочный результат.'
  kind: numeric
  answer: 3
  tolerance: 0.01
