- concept: функция потерь численно измеряет расхождение между предсказанием модели и известным правильным ответом
  question: Что непосредственно вычисляет функция потерь при обучении модели?
  explanation: Функция потерь получает предсказанный и настоящий выходы и превращает их расхождение в числовой сигнал ошибки. Чем меньше потеря, тем лучше предсказание по выбранному критерию.
  kind: choice
  options:
    - Количество обучаемых параметров модели
    - Степень расхождения между предсказанием и правильным ответом
    - Число признаков в обучающей выборке
    - Скорость обработки одного примера
  correct: 1
  id: 019-loss-function-1
  fingerprint: bad44538
- concept: обучение использует значение функции потерь как сигнал для последовательной корректировки параметров модели
  question: Расположи этапы одного шага обучения модели в правильном порядке.
  explanation: Сначала модель выдаёт прогноз, затем функция потерь оценивает его расхождение с известным ответом. Алгоритм оптимизации использует полученный сигнал, чтобы изменить параметры и уменьшить будущие потери.
  kind: order
  items:
    - Получить предсказание модели для обучающего примера
    - Сравнить предсказание с известным ответом с помощью функции потерь
    - Скорректировать параметры модели в направлении уменьшения потерь
  id: 019-loss-function-2
  fingerprint: 16d81dc8
