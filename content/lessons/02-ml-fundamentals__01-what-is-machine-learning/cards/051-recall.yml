- concept: recall равен доле найденных положительных объектов среди всех фактически положительных
  question: В наборе было 28 объектов целевого класса. Модель правильно нашла 21 из них, а остальные пропустила. Чему равен recall?
  explanation: Recall рассчитывается как TP / (TP + FN). Модель нашла 21 из 28 фактически положительных объектов, поэтому recall = 21 / 28 = 0,75.
  kind: numeric
  answer: 0.75
  tolerance: 0.01
  id: 051-recall-1
  fingerprint: feb27793
- concept: ложноположительные предсказания не влияют на recall при неизменных TP и FN
  question: Какое изменение само по себе не изменит recall положительного класса?
  explanation: В формуле recall = TP / (TP + FN) используются только истинно положительные и ложноотрицательные результаты. Поэтому изменение числа FP при прежних TP и FN не влияет на recall.
  kind: choice
  options:
    - Число TP уменьшилось, а число FN осталось прежним
    - Число FN уменьшилось, а число TP осталось прежним
    - Число FP увеличилось, а числа TP и FN остались прежними
  correct: 2
  id: 051-recall-2
  fingerprint: 52cbaece
