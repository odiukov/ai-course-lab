- concept: золотая середина по сложности минимизирует совместный вклад смещения и дисперсии
  question: Что означает золотая середина при выборе сложности модели и почему недостаточно минимизировать только смещение или только дисперсию?
  explanation: Усложнение модели обычно снижает смещение, но повышает дисперсию, а упрощение действует наоборот. Лучшее обобщение достигается в минимуме их совместного вклада, а не на одном из краёв сложности.
  kind: open
  reference: Это сложность, при которой сумма квадрата смещения и дисперсии минимальна. Уменьшение одного компонента обычно увеличивает другой, поэтому отдельный минимум смещения или дисперсии не гарантирует лучшего обобщения.
