- concept: линейная граница ближайшего центроида не может отделить внутреннюю область от окружающего её кольца
  question: Один класс занимает круглую область, а другой окружает её кольцом. Объясните, почему классификатор по ближайшему центроиду не сможет корректно разделить эти классы.
  explanation: Граница равных расстояний до двух центроидов линейна. Она делит пространство на полупространства, но не может замкнуться вокруг внутреннего класса; для такой геометрии нужна модель с нелинейной границей.
  kind: open
  reference: Сравнение расстояний до двух центроидов создаёт линейную границу — прямую или гиперплоскость. Для разделения внутренней области и окружающего кольца нужна замкнутая нелинейная граница, поэтому такое расположение классов не выражается классификатором по ближайшему центроиду.
