- concept: semi-supervised learning совместно использует размеченные и неразмеченные данные
  question: Какой набор данных соответствует обучению с частичным привлечением учителя?
  explanation: Semi-supervised learning сочетает немного примеров с известными метками и много примеров без меток. Размеченная часть задаёт связь с целевыми классами, а неразмеченная помогает учитывать структуру распределения данных.
  kind: choice
  options:
    - Небольшой размеченный набор и значительно больший неразмеченный набор
    - Только размеченные примеры с известными целевыми ответами
    - Только неразмеченные наблюдения без целевых ответов
    - Последовательности действий агента и получаемые им награды
  correct: 0
  id: 011-semi-supervised-1
  fingerprint: 494a9594
- concept: неразмеченные данные помогают определить структуру распределения и провести границу классов через области низкой плотности
  question: Объясните своими словами, при каком допущении неразмеченные данные могут улучшить классификатор в semi-supervised learning.
  explanation: Метки сообщают, какие классы соответствуют отдельным примерам, а неразмеченные наблюдения раскрывают геометрию всего распределения. Польза возникает, если локальная близость и плотные группы действительно согласуются с классами.
  kind: open
  reference: Предполагается, что похожие или близко расположенные объекты обычно принадлежат одному классу. Неразмеченные данные показывают плотные группы и разреженные области, поэтому границу классов можно провести между группами, а не через плотное скопление объектов.
  id: 011-semi-supervised-2
  fingerprint: 5841b3b4
