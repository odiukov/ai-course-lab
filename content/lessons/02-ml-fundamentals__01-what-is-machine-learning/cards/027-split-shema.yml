  fingerprint: 6b9bc3f8
- concept: использование тестовых результатов для выбора модели лишает тест независимости
  question: Команда сравнила на тестовой выборке несколько моделей и оставила модель с лучшим тестовым результатом. Почему этот результат нельзя считать честной итоговой оценкой и что следует сделать?
  explanation: Даже без обучения весов на тестовых примерах их результаты могут повлиять на разработку. После такого выбора оценка становится оптимистичной, поэтому для независимой проверки нужна новая нетронутая тестовая выборка.
  kind: open
  reference: Тестовые данные повлияли на выбор модели и фактически стали валидационными. Итоговую модель нужно оценить на новой выборке, которая ранее не участвовала ни в обучении, ни в принятии решений.
  id: 027-split-shema-2
  fingerprint: baddf3c2
