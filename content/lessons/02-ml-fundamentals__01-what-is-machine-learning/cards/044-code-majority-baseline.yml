- concept: для пустого набора обычная формула majority baseline не определена и требует явно заданного контракта функции
  question: Почему обычную точность majority baseline нельзя непосредственно вычислить для пустого списка меток и как функция может корректно обработать такой вход?
  explanation: Обычная формула делит максимальное количество меток одного класса на общее количество объектов. Для пустого входа знаменатель равен нулю, поэтому без отдельной ветки результат не определён.
  kind: open
  reference: 'В пустом списке нет ни самого частого класса, ни объектов, на число которых можно разделить его частоту. Поэтому функция должна заранее определить контракт: например, вернуть условленное нулевое значение или явно сообщить об ошибке.'
  id: 044-code-majority-baseline-3
