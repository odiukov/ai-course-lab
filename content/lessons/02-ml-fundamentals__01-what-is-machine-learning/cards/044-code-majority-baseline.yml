- concept: точность majority baseline равна относительной частоте самого распространённого класса
  question: В наборе меток класс «кошка» встречается 8 раз, «собака» — 7 раз, а «лиса» — 4 раза. Какую точность покажет классификатор, всегда предсказывающий самый частый класс?
  explanation: Самый частый класс встречается 8 раз среди 19 объектов. Поэтому accuracy постоянного предсказания равна 8 / 19 ≈ 0.421.
  kind: numeric
  answer: 0.421
  tolerance: 0.001
  id: 044-code-majority-baseline-1
  fingerprint: 8d419cda
- concept: при равной максимальной частоте выбор любого класса-моды даёт одинаковую accuracy, но правило выбора должно быть детерминированным
  question: Два класса встречаются одинаково часто и чаще всех остальных. Как корректно обработать такую ничью при вычислении majority baseline?
  explanation: Оба лидирующих класса имеют одинаковую частоту, поэтому дают одну и ту же долю правильных ответов. Фиксированное правило выбора делает поведение функции воспроизводимым.
  kind: choice
  options:
    - 'Выбрать один из лидирующих классов по фиксированному правилу: итоговая accuracy от выбора не изменится'
    - Каждый раз выбирать случайный класс, потому что только случайность обеспечивает правильную accuracy
    - Сложить метки лидирующих классов и использовать сумму как новое предсказание
  correct: 0
