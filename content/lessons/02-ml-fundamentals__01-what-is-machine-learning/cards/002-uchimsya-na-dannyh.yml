- concept: модель можно адаптировать к изменившимся закономерностям переобучением на свежих размеченных данных
  question: Модель выявляет мошеннические операции. После смены тактики мошенников её качество снизилось. Почему добавление свежих размеченных операций и переобучение может быть удобнее ручного переписывания правил?
  explanation: В машинном обучении поведение системы определяется закономерностями в обучающих данных. Когда задача меняется, актуальные размеченные примеры позволяют обновить модель без ручного создания правила для каждого нового случая.
  kind: open
  reference: Свежие примеры отражают новые закономерности мошенничества. При переобучении модель обновляет найденные зависимости по данным, поэтому инженеру не нужно заранее формулировать и программировать каждую новую тактику.
