- concept: мониторинг модели включает контроль входных распределений и фактического качества предсказаний
  question: Какие два вида сигналов следует отслеживать, чтобы обнаруживать деградацию модели в продакшне?
  explanation: Сдвиг входных распределений позволяет заметить, что рабочие данные перестали быть похожи на обучающие. Метрики по известным правильным ответам показывают, привёл ли этот сдвиг или другие изменения среды к реальному падению качества.
  kind: open
  reference: Нужно контролировать изменения распределений входных признаков и измерять фактическое качество предсказаний после появления правильных ответов.
