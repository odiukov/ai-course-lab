- concept: pseudo-labeling превращает предсказания предварительно обученной модели в цели для последующего переобучения
  question: Расположите этапы pseudo-labeling в правильном порядке.
  explanation: Сначала нужна модель, обученная на настоящих метках. Её предсказания для неразмеченных объектов становятся псевдометками, после чего расширенный набор используют для переобучения.
  kind: order
  items:
    - Обучить начальную модель на размеченных данных
    - Получить предсказания модели для неразмеченных объектов
    - Сохранить эти предсказания как псевдометки
    - Переобучить модель на размеченных и псевдоразмеченных данных
  id: 012-semi-tehniki-2
  fingerprint: 8acfa987
- concept: consistency regularization обучает модель сохранять предсказание при небольших изменениях входа без целевой метки
  question: Объясните своими словами, почему consistency regularization можно применять к неразмеченному объекту.
  explanation: Обучающий сигнал возникает из согласованности предсказаний. Если небольшое допустимое изменение входа не должно менять его смысл, модель можно обучать выдавать устойчивый ответ, не имея человеческой метки.
  kind: open
  reference: 'Для исходного объекта и его слегка изменённой версии не нужно знать правильный ответ: обучение штрафует различие между предсказаниями модели на этих версиях и тем самым повышает устойчивость к небольшим изменениям входа.'
  id: 012-semi-tehniki-3
  fingerprint: 19e11fbd
