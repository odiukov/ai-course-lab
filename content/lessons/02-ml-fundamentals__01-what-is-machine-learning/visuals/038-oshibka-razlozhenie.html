<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Мишень: смещение против дисперсии</title>
<style>
  :root{
    --bg:#ffffff; --ink:#1b2330; --muted:#5a6678;
    --ring:#c3ccd9; --ring2:#e3e8ef; --dot:#2f6fd0; --dot2:#d2691e; --mark:#8a94a4;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12161c; --ink:#e8edf4; --muted:#9aa6b6;
      --ring:#3c4757; --ring2:#232b36; --dot:#6fa8ff; --dot2:#ffa45c; --mark:#7d8898;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:10px 12px 12px;background:var(--bg);}
  h2{font-size:15px;margin:0 0 6px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;}
  .cap{font-size:12px;color:var(--muted);margin:6px 2px 0;line-height:1.45;}
  .fail{font-size:13px;color:var(--ink);line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <h2>Мишень: смещение против дисперсии</h2>
  <div id="slot"></div>
  <p class="cap">Центр мишени — правильный ответ. Каждая точка — одна отдельная модель, обученная на своей случайной порции данных того же размера.</p>
</div>
<script>
(function(){
  var slot = document.getElementById('slot');
  try{
    /* ---------- данные схемы (единственные литералы-данные) ---------- */
    var CLOUD = [[0.10,-0.35],[-0.55,0.20],[0.62,0.42],[-0.18,0.70],[0.85,-0.55],
                 [-0.80,-0.62],[0.35,0.95],[-0.30,-0.05],[0.70,-0.02]];
    var RINGS = [0.42, 0.78, 1.15];
    var SPREAD = { low: 0.16, high: 0.55 };
    var BIAS   = { low: [0, 0], high: [-0.60, 0.50] };
    var PANELS = [
      {col:0,row:0,bias:'low', vari:'low',  caption:'то, что нужно'},
      {col:1,row:0,bias:'low', vari:'high', caption:'переобучение'},
      {col:0,row:1,bias:'high',vari:'low',  caption:'недообучение'},
      {col:1,row:1,bias:'high',vari:'high', caption:'плохо всё сразу'}
    ];
    var COLX = [0, 3.2];
    var ROWY = [0, 3.2];
    var COLLBL = ['низкая дисперсия','высокая дисперсия'];
    var ROWLBL = [['низкое','смещение'],['высокое','смещение']];

    /* ---------- одна пара функций перевода ---------- */
    var origin = {x:165, y:100}, scale = 46;
    function sx(x){ return origin.x + x * scale; }
    function sy(y){ return origin.y + y * scale; }

    /* ---------- холст ---------- */
    var W = 395, H = 340;
    var NS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    svg.setAttribute('role','img');
    svg.setAttribute('aria-label','Четыре мишени: низкое и высокое смещение против низкой и высокой дисперсии');

    var bg = document.createElementNS(NS,'rect');
    bg.setAttribute('x','0'); bg.setAttribute('y','0');
    bg.setAttribute('width',W); bg.setAttribute('height',H);
    bg.setAttribute('fill','var(--bg)');
    svg.appendChild(bg);

    function add(tag, attrs){
      var e = document.createElementNS(NS, tag);
      for (var k in attrs) e.setAttribute(k, attrs[k]);
      svg.appendChild(e); return e;
    }
    function text(px, py, s, anchor, dy, size, color){
      var t = add('text', {x:px, y:py, 'text-anchor':anchor, 'font-size':size, fill:color});
      if (dy) t.setAttribute('dy', dy);
      t.textContent = s; return t;
    }
    /* радиус тоже приходит из функции перевода */
    function rad(cx, r){ return sx(cx + r) - sx(cx); }

    /* ---------- заголовки колонок (сверху, middle) ---------- */
    for (var c = 0; c < COLX.length; c++){
      text(sx(COLX[c]), sy(-1.75), COLLBL[c], 'middle', 0, 13, 'var(--ink)');
    }
    /* ---------- подписи строк (слева, end, в две строки) ---------- */
    for (var r0 = 0; r0 < ROWY.length; r0++){
      text(sx(-1.75), sy(ROWY[r0]), ROWLBL[r0][0], 'end', -4, 13, 'var(--ink)');
      text(sx(-1.75), sy(ROWY[r0]), ROWLBL[r0][1], 'end', 12, 13, 'var(--ink)');
    }

    /* ---------- мишени ---------- */
    PANELS.forEach(function(p){
      var cx = COLX[p.col], cy = ROWY[p.row];

      for (var i = RINGS.length - 1; i >= 0; i--){
        add('circle', {
          cx: sx(cx), cy: sy(cy), r: rad(cx, RINGS[i]),
          fill: (i % 2 === 0) ? 'var(--ring2)' : 'none',
          stroke: 'var(--ring)', 'stroke-width': 1
        });
      }
      /* перекрестие центра */
      add('line', {x1:sx(cx-0.18), y1:sy(cy), x2:sx(cx+0.18), y2:sy(cy),
                   stroke:'var(--mark)','stroke-width':1});
      add('line', {x1:sx(cx), y1:sy(cy-0.18), x2:sx(cx), y2:sy(cy+0.18),
                   stroke:'var(--mark)','stroke-width':1});

      var sp = SPREAD[p.vari], bx = BIAS[p.bias][0], by = BIAS[p.bias][1];
      var col = (p.bias === 'high') ? 'var(--dot2)' : 'var(--dot)';
      CLOUD.forEach(function(d){
        var px = cx + bx + d[0] * sp;
        var py = cy + by + d[1] * sp;
        add('circle', {cx: sx(px), cy: sy(py), r: rad(0, 0.075),
                       fill: col, stroke:'var(--bg)', 'stroke-width':1});
      });

      text(sx(cx), sy(cy + 1.85), p.caption, 'middle', 0, 12.5, 'var(--muted)');
    });

    slot.appendChild(svg);
  } catch (e) {
    slot.innerHTML = '<p class="fail">Схема: четыре мишени 2×2. Столбцы — низкая и высокая дисперсия, ' +
      'строки — низкое и высокое смещение. Центр мишени — правильный ответ, каждая точка — отдельная модель, ' +
      'обученная на своей случайной порции данных. Кучно и в центре — то, что нужно; кучно, но в стороне — ' +
      'недообучение; разбросано вокруг центра — переобучение; разбросано и в стороне — плохо всё сразу.</p>';
  }
})();
</script>
</body>
</html>
