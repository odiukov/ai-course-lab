- concept: sliding window attention ограничивает связи токена фиксированной локальной окрестностью
  question: Какое описание точнее всего передаёт топологию sliding window attention?
  explanation: SWA оставляет в каждой строке attention непрерывную локальную полосу шириной W. Поэтому стоимость становится O(N · W), а при фиксированном окне растёт линейно с длиной контекста.
  kind: choice
  options:
    - Каждый токен обращается только к токенам внутри фиксированного локального окна
    - Все пары токенов сохраняются, но матрица вычисляется небольшими блоками
    - Для каждой пары токенов вычисляются две карты, которые затем усредняются
    - Каждый токен обращается только к самому первому токену последовательности
  correct: 0
  id: 003-tri-klassa-1
  fingerprint: ac0135a9
- concept: sparse attention вычисляет только заранее выбранные пары токенов
  question: Заполни пропуск в описании маски sparse attention.
  explanation: Sparse и block attention задают допустимые связи между позициями. Оценки для остальных пар не участвуют в attention и получают нулевой вес.
  kind: cloze
  template: Для пары токенов, не входящей в разрешённый разреженный шаблон, итоговый вес attention принудительно равен ___.
  answer: нулю
  accept:
    - ноль
    - нулевой величине
    - нулевому значению
  id: 003-tri-klassa-2
  fingerprint: eb968fb1
- concept: differential attention подавляет attention sink вычитанием независимо построенных карт
  question: Объясни своими словами, как differential attention помогает бороться с attention sink и чем его цель отличается от цели sliding window attention.
  explanation: 'Вычитание двух независимо параметризованных карт может погасить общий нежелательный фон, из-за которого вес стекается к началу контекста. SWA решает другую задачу: уменьшает объём работы, ограничивая доступ локальным окном.'
  kind: open
  reference: Differential attention строит две карты с отдельными проекциями запросов и ключей, а затем вычитает одну карту из другой. Общий паразитный сигнал, включая чрезмерное внимание к начальным токенам, при вычитании ослабляется. В отличие от SWA, основной смысл этого механизма — очистка внимания, а не сокращение числа рассматриваемых связей.
  id: 003-tri-klassa-3
  fingerprint: 53cdea7f
