- concept: выход attention для запроса является взвешенной суммой векторов значений
  question: Объясни своими словами, как из весов attention и матрицы значений получается выходной вектор для одного запроса.
  explanation: Softmax-веса определяют вклад каждой строки матрицы значений. Attention объединяет эти строки в один выходной вектор посредством взвешенной суммы.
  kind: open
  reference: Каждый вес умножается на соответствующий вектор значения, после чего полученные векторы складываются. Поэтому выход имеет ту же размерность, что и один вектор значения.
  id: 031-odna-stroka-2
  fingerprint: 3eb22b5b
