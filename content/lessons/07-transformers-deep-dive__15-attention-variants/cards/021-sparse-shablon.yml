- concept: заранее известная позиционная разреженность позволяет ядру планировать вычисление только разрешённых блоков
  question: Шаблон разрешённых блоков attention зависит только от позиций токенов и известен до получения значений Q и K. Какое преимущество это даёт специализированному ядру?
  explanation: Если разрешённые блоки известны заранее, ядро может составить расписание без запрещённых тайлов. Оно экономит не только арифметику, но и обращения к памяти; маскирование уже построенной плотной матрицы такой экономии не даёт.
  kind: choice
  options:
    - Не вычислять и не загружать блоки QK, целиком запрещённые шаблоном
    - Сначала вычислить плотную матрицу, а затем применить маску после softmax
    - Определить шаблон по уже вычисленным вероятностям attention
    - Гарантировать то же качество модели при любом шаблоне
  correct: 0
  id: 021-sparse-shablon-1
  fingerprint: 37db8144
- concept: крупноблочная разреженность лучше соответствует тайловой работе ускорителя, чем разрозненные разрешённые элементы
  question: Два шаблона attention разрешают одинаковое количество пар токенов. В одном разрешённые пары собраны в прямоугольные блоки, а в другом разбросаны по матрице отдельными элементами. Почему первый шаблон обычно проще эффективно реализовать на ускорителе?
  explanation: Одинаковая доля ненулевых элементов не гарантирует одинаковую скорость. Практический выигрыш зависит от того, можно ли пропускать целые блоки вычислений и памяти без дорогой обработки множества отдельных индексов.
  kind: open
  reference: Ускоритель обрабатывает и переносит данные тайлами. При блочном шаблоне ядро может целиком пропускать запрещённые тайлы и выполнять последовательные обращения к памяти. Разрозненная разреженность требует дополнительного управления и может заставить загружать тайл ради нескольких элементов.
  id: 021-sparse-shablon-2
  fingerprint: d4a1b3f7
