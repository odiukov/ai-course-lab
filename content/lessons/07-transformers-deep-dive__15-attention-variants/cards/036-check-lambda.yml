- concept: поэлементный расчёт коэффициента differential attention по двум картам
  question: Для одного токена первая карта attention дала вес 0.72, вторая — 0.15, а коэффициент смешивания равен 0.4. Какой коэффициент перед общим вектором значения останется после вычитания?
  explanation: 'Коэффициент вычисляется как A₁ − λA₂: 0.72 − 0.4 × 0.15 = 0.72 − 0.06 = 0.66.'
  kind: numeric
  answer: 0.66
  tolerance: 0.0001
  id: 036-check-lambda-1
  fingerprint: 306ef8ab
- concept: сила подавления токена определяется произведением λ на его вес во второй карте
  question: Два токена получили в первой карте одинаковый вес 0.48. Во второй карте веса равны 0.44 для токена X и 0.08 для токена Y. При коэффициенте смешивания 0.5 какой токен потеряет больше веса после differential attention?
  explanation: Из каждого веса первой карты вычитается λA₂. Для X вычет равен 0.5 × 0.44 = 0.22, а для Y — 0.5 × 0.08 = 0.04, поэтому X подавляется сильнее.
  kind: choice
  options:
    - Токен X, потому что его вес во второй карте больше
    - Токен Y, потому что его вес во второй карте меньше
    - Оба потеряют одинаково, потому что их веса в первой карте равны
    - Нельзя определить без векторов значений
  correct: 0
