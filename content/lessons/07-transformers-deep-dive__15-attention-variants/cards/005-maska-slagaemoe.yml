  fingerprint: 811bd48a
- concept: маскирование до softmax исключает запрещённые позиции из нормирующей суммы
  question: Объясни своими словами, почему обнуление запрещённых весов после softmax не эквивалентно добавлению минус бесконечности к соответствующим логитам до softmax.
  explanation: Softmax нормирует экспоненты всех переданных ему логитов. Предварительная маска убирает запрещённый член и из числителя, и из знаменателя; последующее обнуление меняет только готовый вес и нарушает нормировку.
  kind: open
  reference: При обнулении после softmax запрещённая позиция уже участвовала в знаменателе, поэтому сумма оставшихся весов становится меньше единицы. При добавлении минус бесконечности до softmax её экспонента равна нулю, и разрешённые позиции сразу нормируются только между собой.
  id: 005-maska-slagaemoe-2
  fingerprint: 7ac2577b
