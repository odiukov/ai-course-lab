  question: В причинном attention длина последовательности равна 6000, а каждая позиция в sliding window attention видит не более 750 позиций вместе с собой. Полный причинный attention содержит 18003000 разрешённых ячеек, а оконный — 4219125. Во сколько раз оконный вариант сокращает число вычисляемых ячеек?
  explanation: 'Нужно разделить число ячеек полного причинного attention на число ячеек оконного: 18003000 / 4219125 ≈ 4.27. Деление размера всей квадратной матрицы на грубую оценку произведением длины и окна дало бы завышенный коэффициент.'
