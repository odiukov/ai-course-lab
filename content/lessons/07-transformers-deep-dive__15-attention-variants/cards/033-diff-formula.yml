- concept: коэффициент λ масштабирует вторую карту перед поэлементным вычитанием
  question: Для одной позиции первая карта attention даёт вес 0.36, вторая — 0.24, а λ равен 0.75. Чему равен итоговый коэффициент перед соответствующим вектором значения?
  explanation: 'Коэффициент вычисляется как A₁ − λA₂: 0.36 − 0.75 × 0.24 = 0.18. Вторая карта сначала масштабируется, а затем вычитается из первой.'
  kind: numeric
  answer: 0.18
  tolerance: 0.001
  id: 033-diff-formula-1
  fingerprint: b7de4c17
- concept: обучаемый λ позволяет подобрать силу подавления второй карты
  question: Почему коэффициент λ в differential attention полезно обучать вместе с остальными параметрами модели, а не фиксировать заранее?
  explanation: Вторая карта не обязана содержать только сток. Поэтому оптимальная сила её вычитания зависит от данных и параметров головы; обучение λ позволяет модели самой настроить этот баланс.
  kind: open
  reference: 'Обучаемый λ позволяет по данным подобрать компромисс: достаточно сильно подавлять общий фоновый вклад второй карты, но не вычитать чрезмерно полезный сигнал, который она тоже может содержать.'
  id: 033-diff-formula-2
  fingerprint: 7c884dd3
