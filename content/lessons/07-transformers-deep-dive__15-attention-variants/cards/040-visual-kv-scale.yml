- concept: при фиксированных параметрах модели размер KV-кеша sliding window attention уменьшается пропорционально отношению окна к полной длине контекста
  question: Полный KV-кеш модели для контекста длиной 98 304 токена занимает 48 ГиБ. Сколько ГиБ потребуется при окне sliding window размером 1536 токенов, если остальные параметры не меняются?
  explanation: 'Размер кеша пропорционален числу хранимых токенов. Контекст длиннее окна в 64 раза: 98 304 / 1536 = 64. Поэтому потребуется 48 / 64 = 0,75 ГиБ.'
  kind: numeric
  answer: 0.75
  tolerance: 0.02
  id: 040-visual-kv-scale-1
  fingerprint: 5b97274d
- concept: две ветви differential attention удваивают размер KV-кеша относительно обычного полного attention
  question: KV-кеш обычного полного attention занимает 36 ГиБ. Какой объём займёт кеш differential attention при той же длине контекста и остальных неизменных параметрах?
  explanation: 'Differential attention поддерживает две ветви attention, поэтому KV-кеш удваивается: 36 × 2 = 72 ГиБ. Аналогично в материале обычный кеш на 40 ГБ превращается в 80 ГБ.'
  kind: choice
  options:
    - 18 ГиБ
    - 36 ГиБ
    - 72 ГиБ
    - 144 ГиБ
  correct: 2
