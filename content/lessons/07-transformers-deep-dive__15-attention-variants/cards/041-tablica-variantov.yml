- concept: разреженный выбор блоков сокращает вычисления Native Sparse Attention, но не линейный по длине KV-кэш
  question: В Native Sparse Attention один слой хранит по 6 KiB ключей и значений на каждый из 4096 токенов. Селектор активирует для вычисления только 25% блоков. Сколько KiB занимает KV-кэш слоя?
  explanation: Селектор уменьшает число прочитанных блоков, но не выбрасывает сохранённые ключи и значения. Поэтому размер кэша равен 4096 × 6 = 24576 KiB и остаётся O(N), хотя вычисления выполняются лишь для активной доли блоков.
  kind: numeric
  answer: 24576
  tolerance: 0.5
  id: 041-tablica-variantov-1
  fingerprint: 45d88684
- concept: сравнение качества вариантов attention требует учитывать длину доступного им контекста
  question: BigBird достигает качества полного attention только после получения заметно более длинного входного контекста. Какой вывод корректен?
  explanation: 'В таблице BigBird догоняет полный attention при вдвое более длинном контексте. Это не равенство при одинаковых условиях: экономия вычислений на токен обменивается на возможность обработать больше токенов.'
  kind: choice
  options:
    - BigBird бесплатно сохраняет качество полного attention при одинаковом контексте
    - Равенство качества частично оплачено дополнительным контекстом, поэтому сравнивать варианты нужно при явно заданном бюджете длины
    - Случайные связи устраняют необходимость хранить KV-кэш
    - При обучении разреженная схема BigBird обязательно превращается в плотный attention
  correct: 1
