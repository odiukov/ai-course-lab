- concept: более длинный эффективный контекст означает лучшее использование дальних токенов, а не увеличение допустимой длины входа
  question: Объясни своими словами, что означает более длинный эффективный контекст differential attention при неизменной длине обучающих последовательностей.
  explanation: Подавление фонового веса освобождает ёмкость внимания для содержательных дальних связей. Поэтому поиск удалённого сигнала может улучшиться даже без изменения формального лимита входа или длины последовательностей при обучении.
  kind: open
  reference: Модель способна надёжнее извлекать и использовать информацию из более удалённых частей уже доступного контекста. Это характеристика качества использования контекста, а не обязательное увеличение максимальной длины входной последовательности.
  id: 037-diff-rezultaty-2
