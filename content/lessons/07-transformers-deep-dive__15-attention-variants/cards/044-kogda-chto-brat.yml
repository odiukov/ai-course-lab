- concept: при очень длинном контексте и дефиците памяти практическим умолчанием становится смесь локальных и глобальных слоёв
  question: Модель должна обрабатывать контекст 64K токенов, а обучение и инференс с полным attention не помещаются в доступную память. Специализированного разреженного ядра нет. Какой вариант наиболее обоснован?
  explanation: 'Выше порога около 32K ограничение памяти обычно оправдывает смесь SWA и глобальных слоёв: локальные слои уменьшают рабочий объём, а глобальные сохраняют маршруты для дальних зависимостей.'
  kind: choice
  options:
    - Оставить полный attention во всех слоях
    - Использовать смесь SWA и редких глобальных слоёв
    - Перейти на sparse block attention, вычисляя сначала плотную матрицу
    - Выбрать differential attention только ради сокращения памяти
  correct: 1
