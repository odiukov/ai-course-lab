- concept: специализированные варианты attention выбираются по вычислительной инфраструктуре и характерной ошибке задачи, а не только по длине контекста
  question: Команда A разрабатывает аудиомодель и располагает собственным ядром для содержательно осмысленного блочного шаблона. У команды B long-context RAG помещается в память, но поиск портится из-за attention sink. Какая пара решений соответствует этим условиям?
  explanation: Sparse block attention оправдан, когда есть специализированный шаблон и ядро, способное действительно пропускать ненужные блоки. Differential attention выбирают, когда attention sink загрязняет поиск релевантной информации.
  kind: choice
  options:
    - A — sparse block attention; B — differential attention
    - A — differential attention; B — чистый SWA
    - A — полный attention; B — sparse block attention
    - A — чистый SWA; B — полный attention
  correct: 0
