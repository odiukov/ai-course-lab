- concept: глобальные токены создают короткий маршрут обмена между произвольными позициями
  question: Почему добавление глобальных токенов позволяет далёким позициям документа обмениваться информацией без последовательного распространения через локальные окна?
  explanation: 'Локальные окна передают информацию постепенно между соседями. Глобальный токен работает как общий узел: принимает сведения от любой позиции и делает их доступными всем остальным.'
  kind: open
  reference: Каждый глобальный токен видит всю последовательность, а все позиции видят его. Поэтому одна позиция может передать информацию глобальному токену, после чего другая позиция сможет её получить по маршруту постоянной длины.
  id: 026-longformer-bigbird-1
  fingerprint: 8fc7d9e4
- concept: фиксированное число локальных, глобальных и случайных связей на токен даёт линейную сложность
  question: Заполни оценку вычислительной стоимости sparse attention, если каждый токен использует локальное окно W, набор из g глобальных связей и r случайных связей, причём W, g и r не зависят от N.
  explanation: Для каждой из N строк вычисляется только W + g + r оценок внимания. При фиксированных W, g и r полная стоимость растёт линейно с длиной последовательности.
  kind: cloze
  template: C(N) = ___
  answer: O(N(W+g+r))
  accept:
    - O(N * (W + g + r))
    - O(N·(W+g+r))
    - O(N)
  id: 026-longformer-bigbird-2
  fingerprint: 614b9d2c
- concept: случайные связи BigBird дополняют детерминированный шаблон дальними маршрутами
  question: Какую основную роль играют случайные связи в шаблоне attention модели BigBird?
  explanation: Random-связи создают дополнительные разреженные маршруты между удалёнными позициями. Они не превращают attention в полный и не отменяют локальные или глобальные связи.
  kind: choice
  options:
    - Заменяют локальное окно и оставляют токену только дальний контекст
    - Добавляют дальние связи, которые могут охватить пары позиций вне локального окна и назначенных глобальных токенов
    - Делают все пары токенов доступными друг другу
    - Определяют глобальные токены по максимальному значению attention
  correct: 1
  id: 026-longformer-bigbird-3
  fingerprint: c61bb719
