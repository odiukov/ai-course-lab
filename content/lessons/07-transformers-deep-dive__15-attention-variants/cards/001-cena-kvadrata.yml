- concept: стоимость полного attention квадратично зависит от длины последовательности
  question: Длину входной последовательности утроили, не меняя архитектуру полного attention. Как примерно изменится число вычисляемых оценок между токенами?
  explanation: 'Полный attention вычисляет оценку для каждой пары токенов. Поэтому число оценок пропорционально квадрату длины последовательности: при утроении длины оно увеличивается вдевятеро.'
  kind: choice
  options:
    - Утроится
    - Увеличится вшестеро
    - Увеличится вдевятеро
  correct: 2
  id: 001-cena-kvadrata-1
  fingerprint: f25cfc6b
- concept: сокращение памяти без изменения связей между токенами не устраняет квадратичную арифметическую стоимость
  question: Инженер реализовал полный attention так, что квадратная матрица оценок не хранится целиком. Почему вычислительная стоимость всё равно может оставаться квадратичной?
  explanation: Квадратичная арифметика возникает из правила «каждый с каждым», а не только из хранения матрицы. Можно уменьшить расход памяти, но без пропуска части пар число вычислений останется квадратичным.
  kind: open
  reference: Потому что каждый токен всё ещё сопоставляется с каждым другим токеном. Экономия памяти не сокращает число вычисляемых пар; для изменения асимптотики нужно изменить топологию attention.
  id: 001-cena-kvadrata-2
  fingerprint: b2d5882d
