- concept: отсчёт stride-позиций от начала последовательности делает первый токен глобально доступным
  question: Почему strided-проход, который в каждой строке начинается с первой колонки, фактически создаёт глобально доступный токен?
  explanation: В реализации range(0, i + 1, stride) всегда включает j = 0. Следовательно, нулевая колонка разрешена во всех строках независимо от ширины локального окна; это осознанное свойство архитектуры, а не следствие локального attention.
  kind: open
  reference: Первая колонка входит в stride-сетку при любом положительном stride. Поэтому она открывается в каждой строке маски, и каждый последующий токен может напрямую обратить внимание на первый токен.
  id: 023-strided-mask-2
  fingerprint: f173673c
- concept: пересечение локального окна и stride-сетки не увеличивает число уникальных разрешённых связей
  question: Почему сумма размеров локального окна и stride-сетки обычно завышает точное число разрешённых позиций в строке маски?
  explanation: Оба прохода записывают 0.0 в одну матрицу. Если дальний маячок попал в локальное окно, повторная запись ничего не добавляет, поэтому W + N/stride служит лишь оценкой сверху без поправки на пересечение и границы строки.
  kind: open
  reference: Некоторые stride-позиции уже лежат внутри локального окна. Они принадлежат обоим наборам, но в итоговой маске каждая такая колонка учитывается только один раз.
  id: 023-strided-mask-3
  fingerprint: 89ff0a6e
