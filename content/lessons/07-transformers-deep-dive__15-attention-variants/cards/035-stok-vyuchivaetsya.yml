- concept: attention sink возникает, когда ключ большой нормы согласован с общей составляющей запросов
  question: 'Пусть запросы имеют общую составляющую b: q_i = b + ε_i, а ключ позиции s задан как k_s = αb. Если вклад шума ε_i мал, какое выражение приближённо описывает логит q_iᵀk_s?'
  explanation: Ключ, направленный вдоль общей составляющей запросов, даёт большой положительный скалярный продукт для многих запросов сразу. Увеличение α повышает норму ключа и усиливает устойчивое внимание к позиции s.
  kind: cloze
  template: q_iᵀk_s ≈ ___
  answer: α‖b‖²
  accept:
    - α||b||^2
    - alpha * ||b||^2
    - α(bᵀb)
