- concept: сумма коэффициентов differential attention равна единице минус коэффициент вычитания
  question: Строки P и S получены с помощью softmax. Чему равна сумма коэффициентов строки P − λS?
  explanation: Сумма элементов каждой строки softmax равна единице. Поэтому после вычитания сумма становится равной единице минус λ.
  kind: choice
  options:
    - Единице
    - Единице минус λ
    - Нулю
    - Она всегда отрицательна
  correct: 1
  id: 032-masked-row-1
  fingerprint: fa68c69d
- concept: differential attention допускает отрицательные коэффициенты перед векторами значений
  question: Почему отдельный коэффициент differential attention может быть отрицательным и чем он отличается в этом отношении от обычного веса softmax?
  explanation: Обе исходные карты неотрицательны, но их разность уже не обязана быть неотрицательной. Поэтому вклад некоторого вектора значения может не только усиливать результат, но и вычитаться из него.
  kind: open
  reference: Коэффициент получается вычитанием λS из P. Если вычитаемая величина для некоторой позиции больше соответствующего элемента P, результат отрицателен. Обычный softmax выдаёт только неотрицательные веса, а differential attention образует знаковую комбинацию векторов значений.
  id: 032-masked-row-2
  fingerprint: 215741b0
