- concept: Xavier управляет типичным масштабом активаций, но не гарантирует положение каждого отдельного значения
  question: После Xavier-инициализации у нескольких нейронов предактивации оказались далеко от нуля. Противоречит ли это назначению метода? Объясни своими словами.
  explanation: Xavier даёт статистический контроль масштаба, а не точечную гарантию. Даже при стандартном отклонении весов около 0,044 для слоя 512 → 512 отдельные суммы могут попасть в область насыщения.
  kind: open
  reference: Нет. Xavier задаёт масштаб распределения весов и помогает основной массе сигналов оставаться в чувствительной области sigmoid или tanh, но не ограничивает каждую отдельную предактивацию. Поэтому редкие значения вдали от нуля возможны.
  id: 029-xavier-activations-2
  fingerprint: b95bfc97
