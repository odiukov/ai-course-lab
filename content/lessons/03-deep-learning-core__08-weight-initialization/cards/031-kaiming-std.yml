- concept: масштаб Kaiming компенсирует ослабление второго момента функцией ReLU
  question: Почему для блока «линейный слой → ReLU» инициализация Kaiming задаёт весам больший разброс, чем потребовался бы одному линейному слою?
  explanation: Линейная часть при Var(w) = 2/fan_in создаёт примерно двойной второй момент, а ReLU оставляет около половины. Эти множители компенсируются, поэтому весь блок примерно сохраняет масштаб сигнала.
  kind: choice
  options:
    - Чтобы заранее компенсировать уменьшение второго момента после ReLU
    - Чтобы все выходные нейроны получили одинаковые веса
    - Чтобы среднее весов стало положительным
    - Чтобы масштаб весов зависел только от числа выходных нейронов
  correct: 0
  id: 031-kaiming-std-1
  fingerprint: 7d3a4f8f
- concept: стандартное отклонение нормальной инициализации Kaiming вычисляется из числа входов нейрона
  question: Слой с ReLU имеет fan_in = 200 и инициализируется нормальным распределением Kaiming. Чему равно стандартное отклонение весов?
  explanation: Для Kaiming Var(w) = 2/fan_in, поэтому σ = sqrt(2/200) = sqrt(0.01) = 0.1. Удваивается дисперсия относительно масштаба 1/fan_in, а стандартное отклонение увеличивается в sqrt(2) раза.
  kind: numeric
  answer: 0.1
  tolerance: 0.002
  id: 031-kaiming-std-2
  fingerprint: 9ccb589d
