- concept: при постоянном множителе больше единицы абсолютный прирост сигнала увеличивается с глубиной
  question: Во всех слоях сети масштаб сигнала умножается на один и тот же коэффициент, превышающий единицу. Как меняется абсолютная прибавка масштаба между соседними слоями?
  explanation: Один и тот же процент применяется ко всё большему масштабу, поэтому абсолютная прибавка растёт. Так множитель 1,05 создаёт на линейной шкале ускоряющуюся кривую, а не прямую.
  kind: choice
  options:
    - Остаётся постоянной
    - Увеличивается с глубиной
    - Уменьшается с глубиной
    - Сначала исчезает, а затем меняет знак
  correct: 1
  id: 023-compounding-visual-1
  fingerprint: fdb7ecb3
- concept: одинаковые по величине процентные усиление и ослабление не дают симметричных итоговых отклонений
  question: Объясни своими словами, почему многократное увеличение сигнала на некоторый процент и уменьшение на такой же процент не уводят его на одинаковое расстояние от начального масштаба.
  explanation: При усилении база для следующего процентного прироста растёт, а при ослаблении база для следующей потери уменьшается. Например, за 50 слоёв множители 1,05 и 0,95 дают примерно 11,47 и 0,077, а не симметричные отклонения от исходного масштаба.
  kind: open
  reference: 'Каждое изменение вычисляется от уже изменившегося значения: прибавка — от растущей базы, а убавление — от уменьшающейся. Поэтому накопленные результаты не симметричны относительно начального масштаба.'
  id: 023-compounding-visual-2
  fingerprint: 54763cd2
