- concept: повторение попарно сопоставленных экспериментов на нескольких сидах отделяет устойчивый эффект метода от удачи отдельного запуска
  question: Почему способы инициализации полезно сравнивать на нескольких случайных сидах, сохраняя один и тот же сид внутри каждой сравниваемой пары?
  explanation: Один фиксированный сид обеспечивает воспроизводимость, но может оказаться необычно благоприятным для одного метода. Несколько попарно совпадающих сидов позволяют оценить устойчивость результата, при этом Xavier и Kaiming всё равно создают веса разных масштабов согласно своим правилам.
  kind: open
  reference: Одинаковый сид внутри пары делает случайные условия сопоставимыми, поэтому различие между запусками легче связать с инициализацией. Повторение таких пар на нескольких сидах показывает, сохраняется ли преимущество при разных случайных реализациях, а не возникло ли оно из-за одного удачного старта.
