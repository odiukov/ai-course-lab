- concept: Xavier задаёт дисперсию весов через сумму fan_in и fan_out, балансируя прямой и обратный проходы
  question: У полносвязного слоя fan_in = 900 и fan_out = 300. Какова дисперсия весов при Xavier-инициализации? Запишите ответ десятичной дробью.
  explanation: По правилу Xavier дисперсия равна 2 / (900 + 300) = 1 / 600 ≈ 0.001667. Учёт обоих размеров не позволяет настроить масштаб исключительно под прямой или исключительно под обратный проход.
  kind: numeric
  answer: 0.001667
  tolerance: 0.00001
  id: 025-xavier-balance-1
  fingerprint: 1a3fb6d1
- concept: Xavier подходит sigmoid и tanh благодаря их почти линейному поведению около нуля
  question: Почему Xavier-инициализация особенно хорошо согласуется с активациями sigmoid и tanh?
  explanation: Вдали от центральной области sigmoid и tanh насыщаются, а их производные становятся малы. Xavier помогает удержать стартовые значения ближе к почти линейной области и тем самым поддерживает как прямое распространение сигналов, так и обратное распространение градиентов.
  kind: open
  reference: Она подбирает масштаб весов так, чтобы предактивации чаще оставались около нуля. В этой области sigmoid и tanh ведут себя почти линейно, поэтому дисперсия активаций и градиентов устойчивее сохраняется при прохождении многих слоёв.
  id: 025-xavier-balance-2
  fingerprint: 2fcd3046
