- concept: число случайных выборок для матрицы весов равно произведению fan_in и fan_out
  question: Инициализатор Xavier создаёт матрицу для слоя с 7 входами и 11 выходами. Сколько раз должен быть вызван random.gauss для заполнения всей матрицы?
  explanation: Матрица содержит 11 строк по 7 весов. Для каждого веса выполняется отдельный вызов random.gauss, поэтому всего нужно 11 × 7 = 77 вызовов.
  kind: numeric
  answer: 77
  tolerance: 0.001
  id: 027-xavier-init-1
  fingerprint: cf183418
- concept: повторный вызов случайного инициализатора сохраняет параметры распределения, но создаёт новые веса
  question: Почему повторные вызовы xavier_init с одинаковыми fan_in и fan_out обычно возвращают разные матрицы, хотя используют один и тот же масштаб Xavier?
  explanation: fan_in и fan_out фиксируют форму матрицы и стандартное отклонение распределения. Сами веса заново выбираются через random.gauss, поэтому их конкретные значения обычно различаются.
  kind: open
  reference: Размеры слоя каждый раз задают одинаковое стандартное отклонение и одинаковую форму матрицы, но random.gauss при каждом заполнении создаёт новые случайные выборки.
