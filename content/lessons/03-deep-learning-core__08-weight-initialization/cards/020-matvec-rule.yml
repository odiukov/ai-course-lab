- concept: каждая компонента произведения матрицы весов на входной вектор является скалярным произведением соответствующей строки матрицы с этим вектором
  question: Строки матрицы весов W обозначены как w_A, w_B и w_C, а входной вектор — как x. Как записывается результат Wx?
