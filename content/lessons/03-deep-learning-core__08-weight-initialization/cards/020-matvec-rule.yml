- concept: предактивация нейрона получается из взвешенной суммы и смещения до применения функции активации
  question: Расположите операции прямого прохода через полносвязный слой в правильном порядке.
  explanation: Умножение матрицы весов на вход сразу даёт взвешенные суммы всех нейронов. Затем к каждой сумме добавляется своё смещение, после чего применяется функция активации.
  kind: order
  items:
    - Для каждой строки весов вычислить скалярное произведение со входным вектором
    - Прибавить смещение соответствующего нейрона
    - Применить функцию активации к полученной предактивации
  id: 020-matvec-rule-2
  fingerprint: 339b16a5
