- concept: разные слои должны получать независимо инициализированные матрицы весов
  question: Почему вызов `init_fn(width, width)` размещают внутри цикла по слоям глубокой полносвязной сети?
  explanation: Вызов внутри цикла создаёт для каждого слоя отдельную случайную матрицу. Если выполнить инициализацию до цикла, все слои будут повторно применять один и тот же набор весов.
  kind: choice
  options:
    - Чтобы функция активации менялась для каждого слоя
    - Чтобы каждый слой получил новую матрицу весов, созданную по одному правилу инициализации
    - Чтобы ширина сети увеличивалась после каждого слоя
    - Чтобы разные объекты батча использовали разные веса
  correct: 1
  id: 036-forward-magnitudes-1
  fingerprint: 771467ad
- concept: масштаб выходных активаций измеряется после применения нелинейности
  question: Заполни пропуск так, чтобы метрика описывала величину именно выходных активаций слоя, а не его предактиваций.
  explanation: Сначала вычисляют предактивации, затем применяют `activation_fn` и только после этого измеряют средний модуль. Нелинейность может существенно изменить масштаб значений.
  kind: cloze
  template: magnitude = mean(abs(v) for v in ___)
  answer: post_activation_values
  accept:
    - layer_output
    - activated_values
  id: 036-forward-magnitudes-2
  fingerprint: 9059a24a
- concept: послойный профиль требует записывать метрику после каждого слоя
  question: Почему диагностическую величину активаций нужно вычислять и добавлять в результат внутри цикла по слоям?
  explanation: Послойная запись превращает один итоговый замер в траекторию масштаба сигнала по всей сети. Позиция элемента в результате соответствует глубине, после которой сделан замер.
  kind: open
  reference: Так сохраняется отдельное наблюдение для каждой глубины сети. Если вычислить метрику только после завершения цикла, получится лишь величина выхода последнего слоя, и нельзя будет увидеть, где по глубине сигнал начал затухать или расти.
  id: 036-forward-magnitudes-3
  fingerprint: e47db60b
