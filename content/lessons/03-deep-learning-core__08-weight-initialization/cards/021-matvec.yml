- concept: накопитель суммы нужно заново инициализировать для каждой строки матрицы
  question: В реализации matvec переменную накопленной суммы создали перед внешним циклом и не сбрасывают при переходе к следующей строке. Что произойдёт?
  explanation: Каждая строка задаёт отдельное вычисление, поэтому её сумма должна начинаться с нуля. Иначе накопитель переносит вклад уже обработанных строк в следующие результаты.
  kind: choice
  options:
    - Каждый результат будет содержать только последнее произведение текущей строки
    - В результаты следующих строк попадит сумма, накопленная на предыдущих строках
    - Порядок выходных значений изменится на обратный
  correct: 1
  id: 021-matvec-1
  fingerprint: 3e26b5d3
- concept: длина строки матрицы должна совпадать с длиной умножаемого вектора
  question: Матрица имеет форму m × n, а длина входного вектора равна k. При каком условии обычное матрично-векторное умножение определено?
  explanation: Каждому элементу строки матрицы нужна соответствующая координата вектора. Поэтому число столбцов n должно совпадать с длиной вектора k.
  kind: choice
  options:
    - m равно k
    - m равно n
    - n равно k
    - Никакого условия на размеры нет
  correct: 2
  id: 021-matvec-2
  fingerprint: fe8bb3de
