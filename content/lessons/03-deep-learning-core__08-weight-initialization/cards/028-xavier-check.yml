- concept: граница равномерной Xavier-инициализации вычисляется как корень из отношения шести к сумме fan_in и fan_out
  question: Для слоя с fan_in = 300 и fan_out = 700 веса инициализируют по Xavier из распределения Uniform(-limit, limit). Чему примерно равен limit?
  explanation: limit = sqrt(6 / (300 + 700)) = sqrt(0,006) ≈ 0,0775.
  kind: numeric
  answer: 0.0775
  tolerance: 0.001
