- concept: начальные веса влияют на первое обновление через прямой проход и ошибку
  question: Расположите события в порядке, в котором инициализация весов влияет на начало обучения нейросети.
  explanation: Первый прогноз вычисляется с начальными весами. Полученная ошибка определяет градиенты, а они — первое обновление параметров, поэтому инициализация задаёт исходную точку траектории обучения.
  kind: order
  items:
    - Начальные веса задают состояние сети
    - Сеть вычисляет прогноз
    - Функция потерь оценивает ошибку прогноза
    - Обратное распространение вычисляет градиенты
    - Оптимизатор обновляет веса
  id: 001-start-1
  fingerprint: 1e09e4a4
- concept: хорошая инициализация создаёт условия для обучения, но не заменяет его
  question: Какое утверждение точнее всего описывает задачу хорошей инициализации весов?
  explanation: Инициализация не обучает сеть заранее и не гарантирует итоговое качество. Она должна создать стартовое состояние, в котором сигналы и градиенты не разрушаются, а параметры могут эффективно изменяться.
  kind: choice
  options:
    - Сразу подобрать веса, которые уже дают правильные ответы
    - Обеспечить жизнеспособное распространение сигналов и возможность обновлять параметры
    - Гарантировать одинаковый итог обучения при любом наборе данных
    - Устранить необходимость в функции потерь и оптимизаторе
  correct: 1
  id: 001-start-2
  fingerprint: 6416ceee
