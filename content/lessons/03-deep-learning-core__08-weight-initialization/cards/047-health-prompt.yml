- concept: выбор инициализации должен опираться на архитектурный контекст и измерения по слоям
  question: Какой запрос позволяет обоснованно диагностировать проблему масштаба начальных весов?
  explanation: Один итоговый показатель или название популярного метода не позволяют установить причину. Для диагностики нужны устройство сети, текущая инициализация и изменение масштаба сигнала по глубине.
  kind: choice
  options:
    - «Назови лучшую инициализацию для нейросетей»
    - «Активации стали малы — следует ли всегда переходить на Kaiming?»
    - «Вот размеры и функции активации слоёв, residual-связи, распределение начальных весов и послойные статистики активаций; определи причину нестабильности и предложи стратегию»
    - «Вот средний модуль выхода последнего слоя; выбери между Xavier и Kaiming»
  correct: 2
  id: 047-health-prompt-1
  fingerprint: 5bbb0ca0
- concept: рекомендация стратегии инициализации должна следовать после постановки и проверки диагноза
  question: Расположи этапы анализа проблемы с инициализацией в логичном порядке.
  explanation: Сначала фиксируют, что именно происходит с сигналом, затем проверяют возможные причины по данным о сети. Только после этого выбирают инициализацию и формулируют проверяемое ожидаемое изменение.
  kind: order
  items:
    - Сформулировать наблюдаемый симптом по послойным метрикам
    - Сопоставить симптом с архитектурой, нелинейностями и текущим распределением весов
    - Выбрать стратегию и указать, как должны измениться диагностические метрики
  id: 047-health-prompt-2
  fingerprint: 7a7e182a
