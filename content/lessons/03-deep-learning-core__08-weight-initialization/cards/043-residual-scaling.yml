- concept: дисперсия residual-вклада изменяется пропорционально квадрату коэффициента масштабирования
  question: Почему для компенсации суммы множества сопоставимых residual-вкладов веса масштабируют обратно пропорционально квадратному корню из их количества, а не самому количеству?
  explanation: Если коэффициент равен 1/√(2N), дисперсия отдельного вклада уменьшается в 2N раз. При сложении примерно 2N таких вкладов их дисперсии в сумме остаются порядка единицы.
  kind: open
  reference: Умножение весов на коэффициент k умножает дисперсию вклада на квадрат k. Поэтому обратный квадратный корень уменьшает дисперсию каждой ветви обратно пропорционально числу ветвей, и их суммарная дисперсия остаётся порядка исходной.
  id: 043-residual-scaling-1
  fingerprint: 50979b70
- concept: количество residual-вкладов определяется числом residual-ветвей во всех блоках
  question: Трансформер содержит 45 блоков, а в каждом блоке есть отдельные residual-ветви после attention и feedforward. Коэффициент равен величине, обратной квадратному корню из общего числа ветвей. Чему он примерно равен?
  explanation: В каждом блоке две ветви, поэтому всего их 90. Коэффициент равен 1/√90 ≈ 0,105. Для сравнения, в разобранной сети из 12 блоков использовался коэффициент 1/√24 ≈ 0,204.
  kind: numeric
  answer: 0.105
  tolerance: 0.001
  id: 043-residual-scaling-2
  fingerprint: 8453e7df
