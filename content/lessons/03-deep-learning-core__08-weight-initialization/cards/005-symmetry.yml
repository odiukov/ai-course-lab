- concept: точные копии нейрона не увеличивают разнообразие признаков, представляемых слоем
  question: Почему добавление в скрытый слой точных копий уже существующего нейрона не увеличивает разнообразие признаков, которые слой может выучить?
  explanation: Число параметров формально растёт, но одинаковые нейроны остаются связанными симметрией. Пока их параметры и обновления совпадают, слой использует их как повторения одного вычислительного элемента.
  kind: open
  reference: Копии вычисляют одну и ту же функцию, получают одинаковые градиенты и синхронно обновляют параметры. Поэтому они сохраняют одинаковое поведение и представляют один и тот же признак, а не независимые признаки.
  id: 005-symmetry-2
