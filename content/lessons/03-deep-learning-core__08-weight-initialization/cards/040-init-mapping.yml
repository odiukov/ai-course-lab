- concept: residual-сложения требуют дополнительного масштабирования весов с учётом глубины
  question: Почему в глубоком трансформере недостаточно выбрать инициализацию только по функции активации и что дополнительно делают с весами residual-ветвей?
  explanation: Даже разумный масштаб отдельного слоя не предотвращает накопление сигнала при последовательных residual-сложениях. Поэтому трансформерная архитектура требует дополнительного уменьшения весов residual-ветвей примерно в 1/√(2N) раза.
  kind: open
  reference: Выход residual-ветви складывается с обходным сигналом, поэтому при многократных сложениях масштаб активаций может накапливаться. Веса некоторых residual-ветвей дополнительно уменьшают на коэффициент, зависящий от числа слоёв.
  id: 040-init-mapping-2
  fingerprint: f9369107
