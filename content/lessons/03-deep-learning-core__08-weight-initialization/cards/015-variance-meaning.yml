- concept: одинаковое среднее не означает одинаковую дисперсию
  question: Набор A содержит значения 7, 8 и 9, а набор B — 2, 8 и 14. Среднее обоих наборов равно 8. Как соотносятся их дисперсии?
  explanation: Совпадение средних ничего не говорит о ширине разброса. Значения набора B находятся гораздо дальше от общего среднего, поэтому его дисперсия больше.
  kind: choice
  options:
    - Дисперсии равны, потому что совпадают средние
    - У набора B дисперсия больше
    - У набора A дисперсия больше
    - Сравнить дисперсии без дополнительной информации невозможно
  correct: 1
  id: 015-variance-meaning-1
  fingerprint: a3ac10b1
- concept: квадраты отклонений не позволяют значениям по разные стороны среднего взаимно уничтожиться
  question: Почему среднее арифметическое обычных отклонений от среднего не измеряет разброс и как дисперсия решает эту проблему?
  explanation: Значения по разные стороны среднего могут быть одинаково далёкими, но их знаковые отклонения сократятся. Возведение отклонений в квадрат устраняет это сокращение и сохраняет информацию о величине разброса.
  kind: open
  reference: 'Отрицательные и положительные отклонения от среднего взаимно компенсируются, поэтому их среднее всегда равно нулю независимо от разброса. Дисперсия усредняет квадраты отклонений: они неотрицательны, и большие расстояния от среднего увеличивают результат.'
  id: 015-variance-meaning-2
  fingerprint: a318d655
