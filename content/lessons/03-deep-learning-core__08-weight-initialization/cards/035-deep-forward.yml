- concept: средний модуль активаций агрегирует их масштаб по координатам и объектам батча
  question: После некоторого слоя батч состоит из векторов [2, -5, 7, -8, 9] и [-6, 11, -12, 13, -14]. Средний модуль сначала вычисляют внутри каждого вектора, а затем усредняют по батчу. Каково итоговое значение?
  explanation: 'Для первого вектора средний модуль равен 31 / 5 = 6.2, для второго — 56 / 5 = 11.2. Среднее по батчу: (6.2 + 11.2) / 2 = 8.7.'
  kind: numeric
  answer: 8.7
  tolerance: 0.001
