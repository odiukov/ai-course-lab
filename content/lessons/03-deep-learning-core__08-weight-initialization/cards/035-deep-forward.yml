- concept: все объекты батча проходят через один слой с общей матрицей весов
  question: Как следует применять параметры полносвязного слоя при обработке батча?
  explanation: Матрица весов принадлежит слою, поэтому она одинакова для всех объектов батча. Новая матрица создаётся для другого слоя, а не для другого объекта внутри того же батча.
  kind: choice
  options:
