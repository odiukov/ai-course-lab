- concept: ReLU вдвое уменьшает второй момент симметричных относительно нуля предактиваций
  question: Предактивации имеют распределение, симметричное относительно нуля. Как ReLU примерно изменит их второй момент?
  explanation: Положительная и отрицательная части симметричного распределения дают одинаковый вклад квадратами. ReLU удаляет отрицательную часть, поэтому остаётся примерно половина исходного второго момента.
  kind: choice
  options:
    - Уменьшит его вдвое
    - Оставит его неизменным
    - Увеличит его вдвое
  correct: 0
  id: 030-relu-loss-1
  fingerprint: 0a2885bc
- concept: второй момент после ReLU нельзя отождествлять с дисперсией из-за ненулевого среднего
  question: Объясните своими словами, почему второй момент выходов ReLU нельзя автоматически считать их дисперсией.
  explanation: До активации симметричное распределение может иметь нулевое среднее, но ReLU удаляет отрицательные значения и сдвигает среднее вверх. Поэтому средний квадрат и дисперсия выходов становятся разными величинами.
  kind: open
  reference: После ReLU среднее обычно положительно. Второй момент — это среднее квадратов значений, а дисперсия дополнительно вычитает квадрат среднего, поэтому эти величины не совпадают.
  id: 030-relu-loss-2
  fingerprint: 7aad3007
- concept: доля обнулённых ReLU значений зависит от симметрии и смещения распределения предактиваций
  question: Распределение предактиваций заметно смещено в положительную сторону. Как это влияет на действие ReLU?
  explanation: Оценка про обнуление половины значений опирается на симметрию относительно нуля. При положительном смещении отрицательных значений обычно меньше, поэтому ReLU удаляет меньшую долю их вклада.
  kind: choice
  options:
    - Обычно обнуляется меньше значений, и второй момент сокращается слабее, чем при симметричном распределении
    - ReLU по-прежнему обязательно обнуляет ровно половину значений
    - Все положительные значения становятся отрицательными
  correct: 0
  id: 030-relu-loss-3
  fingerprint: fb4c28f9
