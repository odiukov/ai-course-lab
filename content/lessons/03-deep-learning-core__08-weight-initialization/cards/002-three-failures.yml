- concept: нулевая инициализация не нарушает симметрию между нейронами скрытого слоя
  question: Все нейроны скрытого слоя имеют одинаковые нулевые веса и смещения. Что будет происходить при градиентном обучении, если никакой другой источник асимметрии не добавлен?
  explanation: 'Одинаковые параметры дают одинаковые выходы и градиенты, поэтому обновления тоже совпадают. Нулевая инициализация не разрушает симметрию: слой из 512 нейронов фактически ведёт себя как один нейрон.'
  kind: choice
  options:
    - Каждый нейрон начнёт специализироваться на случайном признаке
    - Оптимизатор автоматически назначит нейронам разные градиенты
    - Нейроны будут получать одинаковые градиенты и останутся копиями друг друга
    - Часть нейронов обучится, а часть обязательно останется нулевой
  correct: 2
  id: 002-three-failures-1
  fingerprint: d4ce38c0
- concept: слишком маленькие случайные веса сохраняют различие нейронов, но вызывают затухание сигналов и градиентов
  question: Почему случайные, но слишком маленькие начальные веса могут сломать обучение глубокой сети, хотя нейроны уже не являются точными копиями друг друга?
  explanation: Малые случайные веса решают только проблему одинаковых нейронов. В глубокой сети повторное умножение на малые коэффициенты схлопывает прямой сигнал и градиенты почти до нуля.
  kind: open
  reference: Случайность нарушает симметрию между нейронами, но при прохождении через много слоёв активации многократно умножаются на малые величины и затухают. При обратном проходе аналогично уменьшаются градиенты, поэтому ранние слои почти не обучаются.
  id: 002-three-failures-2
  fingerprint: d3136316
- concept: слишком большие начальные веса вызывают последовательное усиление активаций, переполнение и взрыв градиентов
  question: Расположи этапы поломки глубокой сети при слишком большом масштабе начальных весов в порядке их возникновения.
  explanation: Большие веса усиливают сигнал на каждом слое. Значения могут сначала вырасти примерно до 1e15, а затем переполниться; обратный проход наследует ту же проблему, из-за чего градиенты и обновления взрываются.
  kind: order
  items:
    - Последовательные слои всё сильнее увеличивают значения активаций
    - Активации достигают предела числового формата и превращаются в бесконечности
    - При обратном проходе градиенты также многократно усиливаются
    - Обновления параметров становятся нестабильными и теряют смысл
  id: 002-three-failures-3
  fingerprint: c494156b
