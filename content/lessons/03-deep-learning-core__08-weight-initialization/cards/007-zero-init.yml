- concept: строки матрицы весов должны быть независимыми изменяемыми списками
  question: Почему выражение `[[float()] * fan_in] * fan_out` не подходит для создания матрицы весов?
  explanation: Такой код создаёт одну строку и несколько ссылок на неё. Вложенное списковое включение из реализации zero_init создаёт каждую из двух строк отдельным списком, поэтому изменение одного элемента не меняет другую строку.
  kind: choice
  options:
    - Внешнее умножение повторяет ссылку на один внутренний список, поэтому изменение веса может затронуть несколько строк
    - Функция float без аргументов возвращает целое значение неподходящего типа
    - Умножение списков автоматически меняет местами fan_in и fan_out
