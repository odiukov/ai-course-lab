- concept: residual-рекурсия разворачивается в исходный сигнал плюс сумму обновлений всех блоков
  question: Пусть каждый residual-блок вычисляет h_{l+1} = h_l + r_l. Заполни формулу для состояния после L блоков.
  explanation: 'Residual-блок не заменяет предыдущее состояние: он добавляет к нему обновление. Поэтому конечное состояние содержит исходный сигнал и сумму обновлений всех пройденных блоков.'
  kind: cloze
  template: h_L = h_0 + ___
  answer: ∑_{l=0}^{L-1} r_l
  accept:
    - sum_{l=0}^{L-1} r_l
    - r_0 + r_1 + ... + r_{L-1}
  id: 044-residual-visual-1
  fingerprint: 89f84036
- concept: дисперсии некоррелированных residual-добавок складываются
  question: Начальная дисперсия residual-потока равна 1.6. К нему прибавляют 80 взаимно некоррелированных обновлений с нулевым средним и дисперсией 0.03 каждое. Какой станет дисперсия потока?
  explanation: 'Для некоррелированных слагаемых дисперсии складываются: 1.6 + 80 × 0.03 = 4.0. Нулевое среднее обновлений не мешает их разбросу накапливаться.'
  kind: numeric
  answer: 4
  tolerance: 0.001
  id: 044-residual-visual-2
  fingerprint: 5069c9bf
