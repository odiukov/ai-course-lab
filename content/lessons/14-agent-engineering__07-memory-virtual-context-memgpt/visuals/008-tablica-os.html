<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Четыре строки соответствия</title>
<style>
  :root{
    --bg:#fbfbf9; --fg:#1b1b1f; --muted:#6a6a75;
    --os:#2f6f9f; --ag:#a8560f; --rule:#c9c9c4; --band:#f1f1ec;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16181c; --fg:#e9e9ee; --muted:#9a9aa6;
      --os:#7ab8e8; --ag:#e6a75a; --rule:#3a3d44; --band:#1e2126;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:960px;margin:0 auto;padding:8px 10px 12px;}
  h2{font-size:15px;margin:0 0 6px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .fallback{font-size:14px;line-height:1.5;color:var(--fg);}
  .fallback li{margin:2px 0;}
</style>
</head>
<body>
<div class="wrap">
  <h2>Одна и та же машина, две подписи</h2>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById("host");
  try{
    var ROWS = [
      {os:"RAM",                 ag:"главный контекст",  note:"текст промпта этого хода"},
      {os:"Диск",                ag:"внешний контекст",  note:"вектора, ключ-значение, граф"},
      {os:"Промах страницы",     ag:"вызов memory.search", note:"подкачка по требованию"},
      {os:"Ядро ОС",             ag:"ReAct-цикл агента", note:"тот же цикл, новый класс инструментов"}
    ];

    // единственное отображение: данные -> пиксели
    var ORIGIN = {x:24, y:22};
    var SCALE  = {x:24, y:24};
    function sx(x){ return ORIGIN.x + x * SCALE.x; }
    function sy(y){ return ORIGIN.y + y * SCALE.y; }

    // сетка в единицах данных
    var COL_OS = 0.5, COL_ARROW = 10, COL_AG = 13.5, COL_END = 35.5;
    var HEAD_Y = 0.6, ROW0 = 2.2, ROW_H = 2.6;
    function rowY(i){ return ROW0 + i * ROW_H; }
    var LAST = rowY(ROWS.length - 1);

    var PAD = 10, LBL = 6, FS = 13, FS_S = 11.5, LW = 1.4;

    var W = sx(COL_END) + PAD, H = sy(LAST + 1.9) + PAD;

    var svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("viewBox","0 0 "+W+" "+H);
    svg.setAttribute("preserveAspectRatio","xMidYMid meet");
    svg.setAttribute("role","img");

    function el(n,a){ var e=document.createElementNS(svg.namespaceURI,n);
      for(var k in a) e.setAttribute(k,a[k]); return e; }
    function txt(x,y,s,anchor,fill,size,weight){
      var t=el("text",{x:x,y:y,"text-anchor":anchor,fill:fill,
        "font-size":(size||FS),"font-family":"inherit","dominant-baseline":"middle"});
      if(weight) t.setAttribute("font-weight",weight);
      t.textContent=s; return t;
    }

    var defs = el("defs",{});
    var mk = el("marker",{id:"ar",viewBox:"0 0 10 10",refX:"9",refY:"5",
      markerWidth:"6",markerHeight:"6",orient:"auto-start-reverse"});
    mk.appendChild(el("path",{d:"M0,0 L10,5 L0,10 z",fill:"var(--muted)"}));
    defs.appendChild(mk); svg.appendChild(defs);

    // полосы строк
    ROWS.forEach(function(r,i){
      if(i % 2) return;
      svg.appendChild(el("rect",{
        x:sx(COL_OS - 0.5), y:sy(rowY(i) - 1.05),
        width:sx(COL_END) - sx(COL_OS - 0.5),
        height:sy(rowY(i) + 1.05) - sy(rowY(i) - 1.05),
        fill:"var(--band)"}));
    });

    // шапка колонок
    svg.appendChild(txt(sx(COL_OS), sy(HEAD_Y), "Язык ОС", "start", "var(--os)", FS_S, "600"));
    svg.appendChild(txt(sx(COL_AG), sy(HEAD_Y), "Язык агента", "start", "var(--ag)", FS_S, "600"));
    svg.appendChild(el("line",{x1:sx(COL_OS - 0.5), y1:sy(HEAD_Y + 0.75),
      x2:sx(COL_END), y2:sy(HEAD_Y + 0.75),
      stroke:"var(--rule)","stroke-width":LW}));

    // разделитель колонок
    svg.appendChild(el("line",{x1:sx(COL_AG - 1), y1:sy(HEAD_Y + 0.75),
      x2:sx(COL_AG - 1), y2:sy(LAST + 1.05),
      stroke:"var(--rule)","stroke-width":LW,"stroke-dasharray":"4 4"}));

    // строки
    ROWS.forEach(function(r,i){
      var y = rowY(i);
      svg.appendChild(txt(sx(COL_OS), sy(y), r.os, "start", "var(--os)", FS, "600"));
      svg.appendChild(el("line",{x1:sx(COL_ARROW), y1:sy(y),
        x2:sx(COL_ARROW + 2.4), y2:sy(y),
        stroke:"var(--muted)","stroke-width":LW,"marker-end":"url(#ar)"}));
      svg.appendChild(txt(sx(COL_AG), sy(y - 0.34), r.ag, "start", "var(--ag)", FS, "600"));
      svg.appendChild(txt(sx(COL_AG), sy(y + 0.52), r.note, "start", "var(--muted)", FS_S));
    });

    // подпись у хвоста стрелок, сбоку от столбца стрелок
    svg.appendChild(txt(sx(COL_ARROW + 1.2), sy(HEAD_Y), "то же самое", "middle", "var(--muted)", FS_S));

    // нижняя черта и вывод
    svg.appendChild(el("line",{x1:sx(COL_OS - 0.5), y1:sy(LAST + 1.05),
      x2:sx(COL_END), y2:sy(LAST + 1.05),
      stroke:"var(--rule)","stroke-width":LW}));
    svg.appendChild(txt(sx(COL_OS), sy(LAST + 1.75),
      "Четыре строки — четыре перевода. Механизм не менялся: новое только решение, что подкачать и когда, и принимает его модель.",
      "start", "var(--fg)", FS_S));

    host.appendChild(svg);
  }catch(e){
    host.innerHTML = '<div class="fallback">Схема должна показывать таблицу из четырёх строк соответствия: '
      + '<ul class="fallback">'
      + '<li>RAM = главный контекст (промпт этого хода)</li>'
      + '<li>диск = внешний контекст (вектора, ключ-значение, граф)</li>'
      + '<li>промах страницы = вызов <code>memory.search</code></li>'
      + '<li>ядро ОС = ReAct-цикл агента</li>'
      + '</ul>Слева язык ОС, справа язык агента, между ними стрелка «то же самое».</div>';
  }
})();
</script>
</body>
</html>
