<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Пять инструментов и три места хранения</title>
<style>
  :root{
    --bg:#fbfaf7; --ink:#1c1b19; --muted:#5f5b54; --box:#ffffff;
    --edge:#8b857b; --in:#1c6c48; --out:#8b4a12;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15181c; --ink:#e9e7e2; --muted:#a7a29a; --box:#1f2329;
      --edge:#575c64; --in:#66c497; --out:#e2a35d;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:780px;margin:0 auto;padding:10px 12px 14px}
  h3{font-size:15px;line-height:1.3;margin:0 0 6px;font-weight:600}
  svg{width:100%;height:auto;display:block}
  .box{fill:var(--box);stroke:var(--edge)}
  .nm{fill:var(--ink);font-size:13px;font-weight:600}
  .nt{fill:var(--muted);font-size:11.5px}
  .ag{fill:var(--ink);font-size:13px;font-weight:600}
  .ags{fill:var(--muted);font-size:11.5px}
  .tl{font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .tl.in{fill:var(--in)} .tl.out{fill:var(--out)}
  .ar.in{stroke:var(--in)} .ar.out{stroke:var(--out)}
  .hd.in{fill:var(--in)} .hd.out{fill:var(--out)}
  .key{fill:var(--muted);font-size:11.5px}
  .fb{font-size:13px;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <h3>Пять инструментов — три места хранения: 2 + 2 + 1</h3>
  <div id="slot"></div>
</div>
<script>
(function(){
  var slot = document.getElementById('slot');
  try{
    /* ---- данные схемы (логические единицы) ---- */
    var D = {
      agent: {x:0, y:0.2, w:4.0, h:9.2, cx:2.0, ty:4.5, sy:5.4,
              label:'Агент', sub:'один цикл'},
      placeX:13.4, placeW:13.2, placeH:1.9, padText:0.45,
      head:{len:0.34, half:0.2}, gap:0.2,
      places:[
        {y:0.35, name:'промпт-core',   note:'виден всегда · 2 инструмента'},
        {y:4.05, name:'архив',         note:'не виден никогда · 2 инструмента'},
        {y:7.75, name:'история ходов', note:'пишет рантайм · 1 инструмент'}
      ],
      arrows:[
        {y:0.90, dir:'in',  label:'core_memory_append'},
        {y:1.70, dir:'in',  label:'core_memory_replace'},
        {y:4.60, dir:'in',  label:'archival_memory_insert'},
        {y:5.40, dir:'out', label:'archival_memory_search'},
        {y:8.70, dir:'out', label:'conversation_search'}
      ],
      key:{x:0, y:10.2, text:'\u2192 запись в место    \u2190 чтение из места'}
    };
    var origin = {x:24, y:18};
    var scale  = 24;
    function sx(x){ return origin.x + x * scale; }
    function sy(y){ return origin.y + y * scale; }

    var W = 672, H = 278, LAB = 7, NS = 'http://www.w3.org/2000/svg';

    function el(n, a){
      var e = document.createElementNS(NS, n);
      for(var k in a){ e.setAttribute(k, a[k]); }
      return e;
    }
    function txt(x, y, dy, anchor, cls, s){
      var t = el('text', {x:x, y:y, 'text-anchor':anchor, class:cls});
      if(dy){ t.setAttribute('dy', dy); }
      t.textContent = s;
      return t;
    }

    var svg = el('svg', {viewBox:'0 0 '+W+' '+H,
      preserveAspectRatio:'xMidYMid meet', role:'img',
      'aria-label':'Три места хранения и пять инструментов памяти'});
    svg.appendChild(el('rect', {x:0, y:0, width:W, height:H, fill:'var(--bg)'}));

    /* агент — левая колонка, из неё выходят все вызовы */
    var a = D.agent;
    svg.appendChild(el('rect', {x:sx(a.x), y:sy(a.y),
      width:sx(a.x+a.w)-sx(a.x), height:sy(a.y+a.h)-sy(a.y),
      rx:6, 'stroke-width':1.4, class:'box'}));
    svg.appendChild(txt(sx(a.cx), sy(a.ty), 0, 'middle', 'ag', a.label));
    svg.appendChild(txt(sx(a.cx), sy(a.sy), 0, 'middle', 'ags', a.sub));

    /* три ящика */
    D.places.forEach(function(p){
      svg.appendChild(el('rect', {x:sx(D.placeX), y:sy(p.y),
        width:sx(D.placeX+D.placeW)-sx(D.placeX),
        height:sy(p.y+D.placeH)-sy(p.y),
        rx:6, 'stroke-width':1.4, class:'box'}));
      svg.appendChild(txt(sx(D.placeX+D.padText), sy(p.y+0.75), 0,
        'start', 'nm', p.name));
      svg.appendChild(txt(sx(D.placeX+D.padText), sy(p.y+1.45), 0,
        'start', 'nt', p.note));
    });

    /* пять стрелок: хвост у агента (in) или у ящика (out) */
    var xA = D.agent.x + D.agent.w + D.gap;
    var xP = D.placeX - D.gap;
    D.arrows.forEach(function(r){
      var into = (r.dir === 'in');
      var tail = into ? xA : xP;
      var tip  = into ? xP : xA;
      var base = into ? tip - D.head.len : tip + D.head.len;
      svg.appendChild(el('line', {x1:sx(tail), y1:sy(r.y),
        x2:sx(base), y2:sy(r.y), 'stroke-width':1.6, class:'ar '+r.dir}));
      svg.appendChild(el('polygon', {class:'hd '+r.dir, points:
        sx(tip)+','+sy(r.y)+' '+
        sx(base)+','+sy(r.y - D.head.half)+' '+
        sx(base)+','+sy(r.y + D.head.half)}));
      /* подпись у хвоста, над линией: запись — слева, чтение — справа */
      svg.appendChild(txt(sx(tail + (into ? D.gap : -D.gap)), sy(r.y),
        -LAB, into ? 'start' : 'end', 'tl '+r.dir, r.label));
    });

    svg.appendChild(txt(sx(D.key.x), sy(D.key.y), 0, 'start', 'key', D.key.text));
    slot.appendChild(svg);
  }catch(e){
    slot.innerHTML = '<p class="fb">Схема должна показывать три места хранения и пять инструментов: '
      + 'в промпт-core ведут две стрелки записи (core_memory_append, core_memory_replace); '
      + 'в архив — две (archival_memory_insert на запись, archival_memory_search на чтение); '
      + 'в историю ходов — одна и только на чтение (conversation_search), '
      + 'потому что туда пишет сам рантайм. Итого 2 + 2 + 1.</p>';
  }
})();
</script>
</body>
</html>
