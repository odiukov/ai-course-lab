- concept: 'процедура проверки стабильности префикса: неизменность всего текста до последнего добавленного хода при росте буфера сообщений'
  question: Расположи шаги проверки того, что сборка главного контекста наращивает текст только с хвоста, а не пересобирает его целиком.
  explanation: 'Две проверки ловят разные дефекты. Повторный вызов без изменений ловит недетерминированность самой сборки. Сравнение префиксов после добавления хода ловит переупорядочивание или переформатирование старой части. Стабильный префикс — ещё и условие попадания в серверный кэш префикса: сдвинулся первый символ, кэш не сработал на всём остатке.'
  kind: order
  items:
    - Собрать строку на текущем состоянии и сохранить результат
    - Собрать строку повторно, ничего не меняя, и убедиться в побайтовом совпадении с сохранённой
    - Добавить в буфер один новый ход
    - 'Сравнить начало новой строки с сохранённой: всё до нового хода обязано совпасть'
    - Если префикс разошёлся — искать источник недетерминированности в сборке
  id: 019-render-main-2
  fingerprint: aa1a239b
- concept: пустой раздел сериализуется с заголовком и пустым телом, потому что молчание о разделе скрывает от модели саму возможность туда писать
  question: Раздел постоянной памяти пока пуст. Почему при сборке промпта его печатают заголовком с пустым телом, а не пропускают целиком?
  explanation: 'Модель видит только плоский текст. Пропущенный раздел для неё неотличим от несуществующего, поэтому пустое тело под заголовком работает как объявление интерфейса памяти. Дефект здесь тихий: агент не ошибается, он просто никогда не пользуется разделом.'
  kind: choice
  options:
    - Иначе агент не увидит, что такой раздел существует, и не станет в него писать — заголовок объявляет доступное место записи
    - Иначе нарушится подсчёт токенов главного контекста и порог вытеснения сработает не вовремя
    - 'Иначе инструмент записи в этот раздел вернёт ошибку: заголовок нужен ему как якорь для вставки'
    - Иначе сломается разбор ответа модели, потому что число блоков в промпте и в ответе должно совпадать
