- concept: содержимое двух хранилищ формируется разными механизмами (выборочная запись агентом против автоматической полной фиксации ходов), поэтому один индекс не покрывает оба типа запросов
  question: Объясни своими словами, почему набор инструментов памяти содержит и архивный поиск, и отдельный поиск по прошлым ходам, — вместо одного поиска по общему индексу.
  explanation: 'Ключ — не в том, что хранилища разные технически, а в том, что их содержимое формируется разными механизмами: явное решение агента против автоматической полной фиксации. Разные содержимое и метаданные (авторство, порядок ходов) означают разные запросы, поэтому у каждого свой инструмент.'
  kind: open
  reference: 'Это два хранилища с разным происхождением содержимого. В архив попадает только то, что агент сам решил записать: заметил факт, переформулировал в одну строку, вызвал archival_memory_insert — то есть выборочная, сжатая, переписанная своими словами выжимка. История ходов пишется автоматически и целиком: каждая реплика в исходной формулировке, с автором и номером хода. Отсюда разные типы запросов: архив отвечает на «что я знаю про X», история — на «что и когда мы про X говорили». Дословной фразы в архиве нет в принципе, а искать общий факт по сырому логу — дорого и шумно. Один поиск по объединённому индексу смешал бы выжимки и сырые реплики и не дал бы ни точной цитаты, ни компактного факта.'
  id: 024-conv-vs-arhiv-3
