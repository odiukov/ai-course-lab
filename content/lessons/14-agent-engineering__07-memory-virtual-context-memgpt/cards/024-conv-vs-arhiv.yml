- concept: 'критерий выбора инструмента: archival_search отвечает на «что я знаю про X», conversation_search — на «что и когда было сказано про X»'
  question: Какой из запросов пользователя корректнее обслуживается `conversation_search`, а не `archival_memory_search`?
  explanation: Архив хранит короткие выжимки — по одной мысли на запись, своими словами агента; искать там дословную формулировку бессмысленно, её там физически нет. История хранит сырые реплики с авторством и порядком ходов, поэтому запрос на точную цитату и на «когда это было сказано» адресуется к ней. Вопросы вида «что я знаю про X» и запись нового факта — это архив.
  kind: choice
  options:
    - «Какой у нас установлен срок поставки по этому поставщику?»
    - «Процитируй, как именно ты сформулировал возражение, когда мы обсуждали поставщика»
    - «Запомни, что поставщик перешёл на предоплату»
    - «Что вообще известно про этого поставщика?»
  correct: 1
