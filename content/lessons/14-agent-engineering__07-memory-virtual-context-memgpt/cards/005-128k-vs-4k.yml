- concept: размер окна не является предиктором точности системы на long-horizon recall; сравнивать надо системы, а не ёмкости
  question: 'В бенчмарке на воспоминание фактов из давних сессий система с окном 256k без внешней памяти набрала меньше, чем система с окном 16k и хранилищем. Инженер делает вывод: «замер сломан, больше контекста не может быть хуже». Объясни своими словами, почему вывод неверен и что на самом деле измеряет такой бенчмарк.'
  explanation: Типичная ошибка — считать окно единственной переменной. В статье Mem0 (2025) baseline на 128k проигрывал агенту на 4k с внешней памятью именно потому, что мерили доступ к нужному факту, а не вместимость входа.
  kind: open
  reference: 'Замер сравнивает не ёмкости, а системы целиком. Большое окно устраняет только нехватку места: факт физически помещается на вход. Но точность на long-horizon recall зависит от того, какая доля входа релевантна запросу и переживает ли факт границу сессии — ни то, ни другое от ёмкости не улучшается, а первое от набивания окна ухудшается. Поэтому размер окна не предиктор итогового результата: система с маленьким окном плюс отбор релевантных записей может стабильно обходить длинноконтекстный baseline. Правильный вывод — не «замер сломан», а «ёмкость не тот параметр, который надо оптимизировать под эту задачу».'
  id: 005-128k-vs-4k-2
  fingerprint: 6ccbb2b6
