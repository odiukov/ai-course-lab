- concept: пропуск полей происхождения необратим для уже записанных данных, а порог вытеснения меняется без миграции — цена ошибки у этих решений разная
  question: 'Две настройки двухуровневой памяти забыли задать при старте: порог вытеснения буфера и поля источника (сессия и номер хода) в архивной записи. Обе ошибки обнаружены через месяц работы агента. Объясни, почему цена этих двух ошибок разная.'
  explanation: Ошибки конфигурации делятся на обратимые и необратимые по признаку того, влияют ли они на форму уже сохранённых данных. Порог вытеснения обратим, поля происхождения — нет, поэтому именно их проставляют в каркасе по умолчанию, до того как система начала писать.
  kind: open
  reference: 'Порог вытеснения — параметр рантайма: его добавляют или меняют в любой момент, и он сразу начинает действовать на текущий буфер, никакая миграция данных не нужна. Поля источника фиксируются в момент записи в архив: добавление их в схему задним числом не восстанавливает происхождение уже накопленных записей, потому что связь с исходным ходом диалога нигде не сохранилась. За месяц архив набит записями без источника — подтвердить их или точечно отозвать отравленную запись уже нельзя, остаётся массовая очистка. Отсюда правило: решения, которые фиксируются на записи, обязаны быть приняты до первого запуска, а параметры политики можно донастраивать.'
  id: 040-skill-2
  fingerprint: b152b9c1
