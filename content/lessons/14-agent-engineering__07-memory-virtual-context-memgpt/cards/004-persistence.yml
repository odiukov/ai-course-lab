- concept: 'модель не хранит состояние между вызовами: непрерывность внутри сессии создаётся повторной подачей всей истории на вход'
  question: 'Клиент ведёт диалог с LLM через API: 12 ходов подряд, модель уверенно ссылается на сказанное в ходе 3. За счёт чего возникает эта непрерывность?'
  explanation: 'Вызов модели — чистая функция от входа: подал историю — получил ответ, состояния не осталось. Ощущение диалога держится тем, что история подаётся заново каждый ход. Отсюда и следует, что новый клиент/новая сессия, не отправившая старую историю, стартует с пустого входа — это persistence-провал, отдельный от переполнения окна.'
  kind: choice
  options:
    - Сервер хранит состояние диалога и подгружает его по идентификатору пользователя
    - Клиент на каждом запросе заново отправляет всю предыдущую переписку, а модель между вызовами ничего не хранит
    - Веса модели дообучаются на ходу и запоминают факты диалога
    - Модель кеширует последние ответы в собственной внутренней памяти на время сессии
  correct: 1
  id: 004-persistence-1
  fingerprint: 9217f0d5
- concept: 'чтобы факт пережил сессию, нужен полный цикл: запись во внешнее хранилище, извлечение по новому запросу, вставка во вход текущего вызова'
  question: Пользователь в сессии A сообщил агенту правило «папку legacy не трогать». Расположи по порядку шаги, без которых это правило не подействует в сессии B.
  explanation: 'Persistence лечится не хранением, а замкнутым циклом write → retrieve → inject. Архив переписки, лежащий в логах, памятью для агента не является: пока запись не оказалась во входных токенах нового вызова, для модели её не существует. Именно поэтому конфигурация «маленькое окно + внешняя память» вытаскивает факты с долгим горизонтом, которые голое большое окно теряет.'
  kind: order
  items:
    - Во время сессии A агент записывает правило во внешнее хранилище (файл, база, memory-store) отдельно от диалога
    - В начале сессии B рантайм по запросу/контексту достаёт релевантные записи из хранилища
    - Достанутые записи вставляются в промпт текущего вызова, попадая во вход модели
    - Модель отвечает с учётом правила, потому что оно физически присутствует во входных токенах
  id: 004-persistence-2
  fingerprint: 5d6e6918
