- concept: 'процедурная память отличается способом использования: она направляет форму будущих действий, а не извлекается как содержимое ответа'
  question: Агент сохранил три записи. Какая из них процедурная?
  explanation: 'Процедурная память отвечает на вопрос «как мне это делать»: это выученное правило поведения, которое не вспоминают, чтобы сформулировать ответ, — оно молча меняет форму каждого ответа. Остальные варианты: семантический факт, эпизодический эпизод (привязка к сессии и ходу) и снова семантический факт.'
  kind: choice
  options:
    - «Пользователь просил не начинать ответ с пересказа вопроса»
    - «Пользователь развернул сервис в регионе eu-central-1»
    - '«Сессия 33, ход 7: пользователь отклонил предложенный вариант схемы»'
    - «В проекте используется PostgreSQL версии 16»
