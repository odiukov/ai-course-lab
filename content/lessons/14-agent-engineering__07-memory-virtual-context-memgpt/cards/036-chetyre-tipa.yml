- concept: ни одна из существующих реализаций памяти не покрывает все четыре типа, поэтому полная память собирается композицией систем
  question: Команда выбирает одну open-source библиотеку памяти и рассчитывает закрыть ею все потребности агента в памяти. Почему такой план обычно не срабатывает, и что даёт связка MemGPT/Letta + Zep + Mem0?
  explanation: 'Четыре типа отвечают на четыре разных вопроса — что важно сейчас, что произошло, что является правдой, как мне это делать — и требуют разных механизмов: подкачки в промпт, временной привязки, дедупликации с обновлением, извлечения поведенческих правил. Выбор «одной библиотеки памяти» на деле означает выбор одного из четырёх типов.'
  kind: open
  reference: 'Каждая реализация бьёт в свой тип. MemGPT/Letta закрывает working memory: подкачивает содержимое внутрь и наружу фиксированного бюджета промпта через инструменты памяти. Zep закрывает episodic: временной граф знаний с интервалами валидности фактов, поэтому «что было правдой тогда» становится запросом. Mem0 закрывает semantic: пайплайн извлечения, который дедуплицирует и обновляет факты в векторном, KV и графовом хранилищах. Ни одна строка не покрывает все четыре типа, а procedural (выученные правила поведения) отдельно берут разве что LangMem через фоновое извлечение поведенческих правил. Поэтому полноценная память — композиция нескольких систем, а не одна библиотека.'
  id: 036-chetyre-tipa-3
  fingerprint: 674442ee
