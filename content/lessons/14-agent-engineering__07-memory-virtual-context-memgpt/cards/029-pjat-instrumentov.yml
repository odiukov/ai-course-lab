- concept: история сообщений доступна агенту только на чтение, потому что её наполняет рантайм автоматически на каждой реплике
  question: Почему в каноническом наборе инструментов памяти есть `conversation_search`, но нет инструмента вида `conversation_append`? Объясни своими словами.
  explanation: Ключ — кто автор записи. Хранилище, которое наполняет рантайм, агенту нужно только читать; хранилище, которое наполняет агент, требует явного инструмента записи. Асимметрия набора инструментов — следствие этого, а не случайность списка.
  kind: open
  reference: 'Историю ходов пишет не агент, а рантайм: каждая реплика пользователя и ассистента попадает в буфер сообщений автоматически, полной фиксацией. Инструмент записи агенту не нужен — писать нечего, всё уже записано. Более того, ручная запись была бы вредна: агент смог бы дописать в собственную историю ход, которого не было, и дальнейший поиск возвращал бы сфабрикованный факт как реально сказанное. Остаётся единственная осмысленная операция — чтение по запросу, `conversation_search`. Сравни с архивом: туда рантайм ничего не кладёт, отбор записей делает агент, поэтому там инструмент записи обязателен.'
  id: 029-pjat-instrumentov-2
