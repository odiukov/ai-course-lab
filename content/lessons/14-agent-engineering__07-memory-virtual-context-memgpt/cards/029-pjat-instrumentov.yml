- concept: core даёт операцию замены, а архив в каноническом наборе — только вставку, потому что core занимает фиксированное место в каждом промпте, а архив читают выборочно
  question: Почему у постоянного раздела промпта есть операция замены (`core_memory_replace`), а канонический архив обходится одной вставкой (`archival_memory_insert`) без замены?
  explanation: 'Цена ошибки у мест хранения разная. Устаревшая строка в core-разделе платно едет в каждый вызов и конкурирует с актуальной прямо на входе модели — её надо удалить. Архив в промпт не подставляется: неактуальная запись лежит мёртвым грузом и вредит только если её поднимет поиск, а это решается ранжированием и метаданными записи. Отсюда и разный набор прав, а не разная важность содержимого.'
  kind: choice
  options:
    - Архив хранится в векторной БД, а там правка записей технически невозможна
    - Core занимает фиксированное место в каждом промпте, поэтому устаревший текст надо физически убрать; из архива на каждый запрос поднимаются только отобранные записи, и неактуальная просто не попадает в контекст
    - Замена в архиве не нужна, потому что архив очищается при старте новой сессии
    - Core редактируют, потому что его содержимое важнее; в архив кладут второстепенные факты, которые не жалко оставить как есть
