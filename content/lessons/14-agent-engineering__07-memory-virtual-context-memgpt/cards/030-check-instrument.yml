- concept: 'перенос факта из истории диалога в постоянный раздел — это два разных вызова: чтение оттуда, где факт лежит, и запись туда, где он должен быть виден каждому ходу'
  question: 'Пользователь: «Мы месяц назад договорились про формат код-ревью — держи это в голове постоянно». В core-разделах записи нет, обсуждение было в старой сессии. Расставь шаги агента по порядку.'
  explanation: Ни один инструмент не переносит содержимое между уровнями сам. Поиск по истории только возвращает текст в текущий ход; чтобы факт пережил сессию и был виден каждому вызову, нужна отдельная запись в core.
  kind: order
  items:
    - Вызвать conversation_search по теме код-ревью и найти ход, где договорённость прозвучала
    - Выбрать из найденных ходов конкретную формулировку и сжать её до одной строки факта
    - Вызвать core_memory_append и записать эту строку в постоянный раздел
    - Дальше опираться на строку в собранном промпте, не повторяя поиск по истории
