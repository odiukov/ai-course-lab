  fingerprint: 8c59b602
- concept: объёмное и редко нужное содержимое пишут в архив, а не в core, потому что core-раздел печатается в каждом промпте целиком и его место конечно
  question: 'Пользователь вставляет спецификацию внутреннего API на 60 строк: «пусть будет у тебя под рукой, когда дойдём до интеграции». Какой инструмент записи выбрать?'
  explanation: 'Core входит в каждый вызов целиком и его размер фиксирован: 60 строк, нужные один раз при интеграции, съедят место у фактов, нужных всегда. Архив хранит объём даром и поднимается поиском ровно в тот момент, когда дело дойдёт до интеграции.'
  kind: choice
  options:
    - core_memory_append — положить спецификацию в постоянный раздел
    - archival_memory_insert — положить спецификацию во внешнее хранилище
    - core_memory_replace — заменить содержимое раздела спецификацией
    - conversation_search — найти, где спецификация уже упоминалась
