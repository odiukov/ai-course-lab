- concept: архивная запись — сформулированный агентом пересказ, поэтому подтвердить факт можно только возвратом к исходному ходу диалога
  question: 'Агент утверждает: «пользователь просил выкатить релиз в четверг», и показывает найденную архивную запись с этим текстом. Объясни, почему сам текст записи не является подтверждением факта и что нужно хранить, чтобы подтверждение стало возможным.'
  explanation: 'Ключ — различие между фактом и его источником. Инструмент поиска по архиву возвращает текст, но не происхождение. Пара (session_id, turn_id) даёт ссылку на первичную запись разговора: это и делает факт верифицируемым, и одновременно отзываемым.'
  kind: open
  reference: 'Запись в архив делает сам агент, и он пишет туда свою формулировку, а не дословную реплику. Поэтому текст записи не различает «пользователь так сказал» и «модель так поняла или домыслила» — предъявление записи лишь повторяет утверждение агента, не проверяет его. Проверка требует внешнего свидетельства: сохранённых при записи идентификаторов источника (ID сессии и ID хода), по которым можно открыть настоящий ход диалога и прочитать исходную фразу целиком, вместе с окружающим контекстом. Тогда факт либо подтверждается, либо ловится расхождение между сказанным и записанным.'
  id: 034-citation-loss-2
  fingerprint: 202d020f
- concept: происхождение фиксируется в момент записи в архив; это дисциплина записи, а не задача, решаемая улучшением поиска
  question: Команда борется с citation loss. Какое решение устраняет причину, а не симптом?
  explanation: 'Происхождение известно ровно один раз — в момент, когда агент решает записать факт: он знает, из какого хода этот факт взят. Позже эта информация утрачена, и любой обратный поиск по похожести даёт догадку, а не доказательство, — при нескольких похожих ходах он ошибётся молча. Инструмент искать не надо: поля источника обычно уже есть в формате архивной записи, вопрос в дисциплине их заполнения. Копирование всей истории в каждую запись раздувает архив и не даёт адресации.'
  kind: choice
  options:
    - Заменить лексический поиск по архиву на векторный, чтобы находить исходную реплику по смыслу
    - Заполнять поля источника (ID сессии и ID хода) при каждой вставке в архив
    - Добавить инструмент, который после ответа ищет в истории разговоров фразу, похожую на текст записи
    - Хранить в архиве полную копию истории всех сессий рядом с каждой записью
  correct: 1
