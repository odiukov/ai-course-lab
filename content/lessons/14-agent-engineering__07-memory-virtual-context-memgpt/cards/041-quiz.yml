- concept: interrupt — это механизм передачи управления рантайму, memory tool — операция, которую этот механизм исполняет; они относятся к разным слоям и не заменяют друг друга
  question: Объясни своими словами, что в архитектуре виртуального контекста называют прерыванием (interrupt), а что — инструментом памяти (memory tool), и почему эти два понятия нельзя считать синонимами.
  explanation: 'Механизм и операция — разные слои. Именно из механизма прерывания следует главное практическое ограничение: между решением «мне нужен этот факт» и появлением факта во входе проходит один ход.'
  kind: open
  reference: 'Инструмент памяти — это объявленная операция над хранилищем (вставить запись, найти по запросу, заменить строку в постоянном разделе), которую модель может запросить как обычный вызов инструмента. Прерывание — механизм исполнения: модель обрывает генерацию, управление уходит рантайму, рантайм выполняет запрошенную операцию, а результат возвращается во вход следующего хода как наблюдение. То есть memory tool отвечает на вопрос «что делают с памятью», а interrupt — «как выполнение попадает обратно в разговор». Синонимами их считать нельзя: тем же механизмом прерывания исполняются любые другие инструменты, а операции памяти можно было бы, в принципе, выполнять и другим способом (например, фоновым процессом). Практическое следствие путаницы: если считать, что агент «читает архив сам», ожидаешь появления данных в том же ходу — на деле факт становится доступен только со следующего хода, и промпт нужно строить с учётом этого.'
  id: 041-quiz-3
