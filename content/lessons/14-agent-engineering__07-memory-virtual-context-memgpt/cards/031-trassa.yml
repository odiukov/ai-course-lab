- concept: 'жизненный цикл факта в двухуровневой памяти: запись, вытеснение из промпта, запрос, извлечение наблюдением, ответ'
  question: Расположите события полного цикла памяти агента (MemGPT-паттерн) в порядке их появления в трассе выполнения.
  explanation: 'Порядок неслучаен: запись обязана предшествовать вытеснению, иначе факт исчезает вместе с сообщением. Вытеснение обязано предшествовать вопросу, иначе извлечение не проверяется. Поиск синхронен: наблюдение вставляется до генерации ответа, а не после. Это минимальный замкнутый цикл — всё остальное в трассе обвязка.'
  kind: order
  items:
    - Агент отдельным вызовом инструмента записывает факт во внешнее хранилище (id, теги, сессия, ход)
    - Буфер главного контекста переполняется, и сообщение с этим фактом уходит из промпта
    - Поступает вопрос, ответ на который в текущем главном контексте отсутствует
    - Агент вызывает поиск по внешнему хранилищу, и найденная запись возвращается ходом-наблюдением
    - Модель формирует ответ, опираясь на вставленное в буфер наблюдение
