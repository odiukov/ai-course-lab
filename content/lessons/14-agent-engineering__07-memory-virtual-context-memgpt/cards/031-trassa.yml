- concept: прогон со сценарным агентом без вызовов LLM проверяет механику хранилища и политики буфера, но не проверяет решения модели о том, что и когда запоминать
  question: 'Демонстрация двухуровневой памяти собрана на стандартной библиотеке: хранилище со скорингом по пересечению слов, буфер фиксированного размера и сценарный агент, у которого последовательность вызовов инструментов зашита заранее. Ни одного обращения к LLM нет. Что такой прогон доказывает, а что не доказывает? Объясни своими словами.'
  explanation: 'Разделение полезное на практике: если такой прогон падает, баг в коде памяти, а не в промпте или модели. И наоборот — зелёная трасса ничего не говорит о том, что живая модель вовремя вызовет archival_memory_search на реальном диалоге; это проверяется уже с настоящей LLM и на нетривиальном объёме записей.'
  kind: open
  reference: 'Доказывает механику: инструменты записи и поиска согласованы по формату записей, политика вытеснения освобождает место и не рушит сериализацию промпта, результат поиска корректно вставляется в буфер как наблюдение и доступен следующему ходу. То есть проверена вся обвязка рантайма — контракт между хранилищем, буфером и циклом вызова. Не доказывает политику: решение о том, какой факт заслуживает записи, какой запрос требует поиска и какой из найденных кандидатов релевантен, в сценарном агенте задано человеком, а в реальной системе принимает модель. Не доказывает и качество извлечения: перебор с пересечением токенов на трёх записях выигрывает тривиально, на большом хранилище с синонимами и переформулировками он развалится. Прогон — тест интеграции, а не тест интеллекта агента и не бенчмарк поиска.'
  id: 031-trassa-3
