- concept: FIFO-вытеснение системно жертвует высокоценным началом ради объёмного свежего вывода инструментов
  question: Объясни своими словами, почему стратегия «выкидываем самое старое» при переполнении окна вредит агенту непропорционально сильно, и что нужно сделать, чтобы ценные ранние факты пережили сессию.
  explanation: 'Суть в корреляции возраста и ценности: важное приходит рано, объёмное — поздно. Само по себе увеличение окна отодвигает момент отсечки, но не меняет порядок вытеснения, поэтому сохранение ценного требует отдельного шага записи во внешнее хранилище.'
  kind: open
  reference: 'Ценность токена и его возраст в агентной сессии обратно связаны: в начале лежат постановка задачи, ограничения и договорённости с пользователем, а в конце — объёмные результаты вызовов инструментов, у которых плотность полезной информации низкая. FIFO-вытеснение сортирует ровно по возрасту, поэтому первым уходит самое ценное, а самый громоздкий мусор остаётся просто потому, что пришёл позже. Чем дольше и продуктивнее сессия, тем быстрее логи вытесняют те несколько строк, ради которых всё затевалось. Лечится это не размером окна, а внешней памятью: ключевые факты надо явно извлечь из ленты и записать в хранилище вне контекста, откуда их можно подтянуть обратно. В эксперименте Mem0 (2025) агент с окном на 4k и внешней памятью доставал долгогоризонтные факты, которые терял базовый вариант с окном на 128k.'
  id: 002-overflow-3
  fingerprint: df7cea08
