- concept: 'overflow — это жёсткая арифметика: всё, что не влезло в окно по числу токенов, физически удаляется из входа'
  question: Агент работает с окном на 32000 токенов. В начале сессии в контекст легли инструкции и ограничения задачи на 1500 токенов, затем прошло 12 вызовов инструментов, каждый вернул по 4000 токенов логов. Сколько токенов придётся выбросить из истории, чтобы вход поместился в окно?
  explanation: 1500 + 12×4000 = 49500 токенов против окна в 32000. Излишек 49500 − 32000 = 17500. При обычной стратегии вытеснения самого старого эти 17500 съедают начальные 1500 токенов инструкций целиком и ещё четыре ранних вызова инструментов. Overflow — не «модель придала меньше веса», а отсутствие текста во входе.
  kind: numeric
  answer: 17500
  tolerance: 1
  id: 002-overflow-1
  fingerprint: 7f835823
- concept: 'при усечении по окну модель не получает сигнала о потере: вход выглядит как полный разговор'
  question: Из контекста агента при переполнении окна вытеснили ранние сообщения с ограничениями задачи. Что произойдёт с его следующим ответом?
  explanation: 'Усечение отдаёт модели гладкий, синтаксически полный вход. Маркера «здесь был вырезан кусок» в нём нет, и калибровка уверенности считается по видимым токенам, а не по недостающим. Отсюда практическое следствие: пропажу договорённостей должен ловить внешний слой памяти, сама модель о дырке не сообщит.'
  kind: choice
  options:
    - Модель выдаст уверенный ответ, игнорирующий выпавшие ограничения, потому что во входе нет пометки о том, что часть истории удалена
    - Модель вернёт ошибку переполнения контекста и откажется отвечать до восстановления истории
    - Модель снизит уверенность ответа пропорционально доле вытесненных токенов
    - Модель по остаточным ссылкам в поздних сообщениях реконструирует утраченные ограничения
