- concept: 'механизм dilution: внимание распределяется по всему окну, доля нужного фрагмента падает при добавлении нерелевантного текста'
  question: Факт целиком помещается в окно и не обрезается, но точность ответа падает после того, как рядом в промпт добавили большой объём нерелевантных документов. Что происходит внутри модели?
  explanation: 'Dilution — вторая из трёх болезней памяти (наряду с overflow и persistence). Нерелевантный контекст не лежит нейтральным балластом: он конкурирует за внимание с нужным фрагментом. Модель не умеет «пропускать не по теме» — она видит всё, что положили в окно.'
  kind: choice
  options:
    - Модель распределяет внимание по всем токенам входа, поэтому доля внимания на нужный фрагмент падает по мере роста объёма постороннего текста
    - Модель читает вход последовательно и останавливается, дойдя до лимита полезных токенов
    - Модель пропускает разделы, тематически не связанные с вопросом, и потому не видит нужный факт
    - Токенизатор кодирует длинный вход грубее, и точные числа теряются при кодировании
  correct: 0
  id: 003-dilution-1
  fingerprint: 164cab93
- concept: устаревшие почти-дубликаты факта в контексте работают как дистракторы и вытягивают неверный ответ
  question: Агент отвечает на вопрос о текущем значении параметра. В контекст положили действующую версию документа плюс несколько старых редакций, где то же поле имело другое значение. Ответ оказался взят из старой редакции. Что это показывает про наполнение контекста?
  explanation: Класть «всё на всякий случай» — значит подсовывать модели правдоподобные неверные варианты того же факта. Отбор по релевантности и актуальности до вставки в промпт снижает ошибку сильнее, чем добавление контекста.
  kind: choice
  options:
    - 'Близкие по форме, но устаревшие фрагменты — самые опасные дистракторы: они похожи на нужный кусок и конкурируют с ним за внимание'
    - 'Проблема в порядке фрагментов: устаревшие редакции надо класть в начало окна, тогда ошибка исчезает'
    - 'Проблема в объёме: любые фрагменты одинаково безвредны, пока сумма токенов не превысила окно'
    - Модель всегда предпочитает более раннюю по дате версию, это её встроенное свойство
  correct: 0
  id: 003-dilution-2
  fingerprint: 5d69f301
- concept: доля нужного фрагмента во входе падает пропорционально объёму добавленного контекста
  question: Сначала в промпте 4000 токенов, из них 500 — фрагмент с нужным фактом. Потом в тот же промпт досыпали материалов, и общий объём стал 100000 токенов, а нужный фрагмент остался тем же. Во сколько раз упала доля нужного фрагмента во входе?
  explanation: 500/4000 = 12.5%, 500/100000 = 0.5%, отношение 25. Сам факт никуда не делся и не обрезан — просто его вес во входе упал в 25 раз, и вместе с ним доля внимания, которая ему достаётся.
  kind: numeric
  answer: 25
  tolerance: 0.1
  id: 003-dilution-3
