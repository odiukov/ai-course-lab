- concept: изменившийся факт в core-памяти обновляют вызовом core_memory_replace, а не core_memory_append
  question: В core-разделе агента лежит строка «основной язык проекта — Go». Пользователь сообщает, что проект переписан на Rust. Какой вызов памяти корректен?
  explanation: 'append только дописывает: в разделе окажутся два взаимоисключающих утверждения, и модель на следующем ходу читает оба как факты. replace адресует старый фрагмент и подставляет новый на его место — в промпте остаётся одна версия факта. archival_insert кладёт факт в хранилище, требующее явного поиска, и не чинит противоречие в самом промпте.'
  kind: choice
  options:
    - core_memory_append(section, «основной язык проекта — Rust»)
    - core_memory_replace(section, «основной язык проекта — Go», «основной язык проекта — Rust»)
    - archival_memory_insert(«основной язык проекта — Rust»)
    - conversation_search(«язык проекта»)
  correct: 1
  id: 014-zachem-replace-1
  fingerprint: 8f7e7ec2
- concept: 'сигнатура core_memory_replace: средний аргумент — фрагмент, подлежащий удалению'
  question: Заполните пропуск в вызове инструмента MemGPT, который заменяет устаревший фрагмент постоянного раздела промпта на актуальный.
  explanation: 'core_memory_replace принимает раздел, старый фрагмент и новый текст. Средний аргумент — точная подстрока, которую надо убрать: именно он превращает операцию из дописывания в правку. Без него инструмент выродился бы в append или в перезапись всего раздела.'
