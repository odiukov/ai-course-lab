- concept: replace адресует один фрагмент, поэтому остальное содержимое раздела сохраняется — в отличие от перезаписи раздела целиком
  question: В core-разделе агента хранится 8 фактов о пользователе. Устарел ровно один. Чем core_memory_replace лучше, чем перезапись всего раздела новым текстом?
  explanation: 'Перезапись раздела целиком заставляет модель заново сгенерировать все 8 фактов — любой из них она может исказить или потерять. replace — адресная операция над одной подстрокой: риск задет только правимый фрагмент. Меток свежести инструмент не ставит; корректность держится на том, что противоречащая строка физически удалена.'
  kind: choice
  options:
    - Он занимает меньше токенов в промпте, чем раздел до правки
    - Он меняет только названный фрагмент, а остальные факты раздела остаются нетронутыми — их не нужно воспроизводить заново
    - Он переносит устаревший факт в архивное хранилище вместо удаления
    - Он помечает новую строку как более свежую, чтобы модель предпочла её
  correct: 1
  id: 014-zachem-replace-3
  fingerprint: 3d40e88a
