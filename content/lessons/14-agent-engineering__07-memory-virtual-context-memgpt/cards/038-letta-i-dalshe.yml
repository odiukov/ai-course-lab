- concept: heartbeat нужен потому, что каждый выход модели — вызов инструмента, и после его выполнения управление по умолчанию возвращается пользователю
  question: В MemGPT каждый выход модели оформлен как вызов функции, а ответ пользователю отправляется через send_message. Зачем в таком дизайне понадобился отдельный флаг heartbeat в аргументах вызова?
  explanation: 'Если единственный выход модели — вызов функции, то после его исполнения цикл по умолчанию отдаёт очередь пользователю. Но записи в память и подкачке обычно нужна цепочка: достать, оценить, дописать, ответить. heartbeat — это просьба вернуть управление агенту ещё раз. Когда модель умеет рассуждать нативно и сама решает продолжать, костыль исчезает, но сам механизм прерывания (агент встал, рантайм достал, результат приехал следующим ходом) остаётся тем же.'
  kind: choice
  options:
    - Чтобы агент мог запросить себе следующий ход сразу после выполнения инструмента, не дожидаясь реплики пользователя
    - Чтобы рантайм проверял, что модель жива, и перезапускал зависший вызов
    - Чтобы ограничить частоту вызовов инструментов памяти и не переполнить архив
    - Чтобы пометить сообщение как служебное и не показывать его в интерфейсе
