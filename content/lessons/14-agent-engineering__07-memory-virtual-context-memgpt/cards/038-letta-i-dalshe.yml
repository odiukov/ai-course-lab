- concept: асинхронный фоновый агент обслуживания памяти снимает конкуренцию за ход диалога, но не меняет структуру хранилища и не отменяет необходимость операций консолидации и инвалидации
  question: Уборка памяти — консолидация дублей, инвалидация устаревших записей — вынесена из основного цикла агента в отдельный фоновый процесс, работающий между репликами пользователя. Объясни своими словами, что эта архитектура решает, а что не решает.
  explanation: Sleep-time-агенты меняют, КОГДА выполняется работа с памятью, а не КАКАЯ. Полезность целиком зависит от того, есть ли у хранилища операции правки и отзыва записей; фон без них просто регулярно ничего не чинит. Плюс появляется координация двух пишущих в одно хранилище.
  kind: open
  reference: 'Решает: обслуживание памяти перестаёт отнимать ход и токены у диалога. В синхронной схеме каждый вызов проверки дублей и переписывания записей занимает место в главном контексте, тратит ход и добавляет задержку в ответ пользователю; фоновый процесс работает вне пути ответа, поэтому уборку можно делать чаще и дороже (перечитывать много записей, сверять их между собой). Не решает: сами операции никуда не деваются — если в хранилище нет инвалидации и слияния записей, memory rot возникнет и в фоне; структура уровней не меняется; появляется новая проблема — гонка, когда фоновый агент правит записи, которые основной агент читает или только что записал, поэтому нужны версии/актуальность записи. Асинхронность — операционная форма, а не новый механизм памяти.'
