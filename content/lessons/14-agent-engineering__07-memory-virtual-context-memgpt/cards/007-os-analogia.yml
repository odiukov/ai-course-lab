- concept: промах страницы в ОС соответствует вызову инструмента памяти агентом
  question: В отображении MemGPT на виртуальную память ОС каждому элементу схемы соответствует элемент агента. Что играет роль промаха страницы (page fault)?
  explanation: 'Page fault — это событие «нужного куска нет в быстрой памяти, иди за ним в медленную». У агента ту же роль играет обращение к инструменту памяти: главный контекст = RAM, внешнее хранилище = диск, вызов memory.search/read/write = подкачка. Ошибки модели и лимиты провайдера — другие сущности, они в таблице соответствий не участвуют.'
  kind: choice
  options:
    - Вызов инструмента памяти вроде memory.search или memory.read, подтягивающий данные из внешнего хранилища в главный контекст
    - Ошибка модели, когда она галлюцинирует факт, которого не было во входе
    - Превышение лимита токенов, из-за которого запрос отклоняется провайдером
    - Дообучение весов на новых данных диалога
  correct: 0
  id: 007-os-analogia-1
  fingerprint: 35e61320
- concept: ядру ОС в отображении соответствует цикл управления агента, а не отдельный компонент хранилища
  question: В аналогии MemGPT с операционной системой ядро ОС управляет подкачкой. Что в архитектуре агента занимает место ядра?
  explanation: 'Ядро решает, когда и что подкачивать. У агента это делает управляющий цикл: обычный ReAct-цикл, к которому добавлен класс инструментов памяти. Векторная БД — это диск (внешний контекст), а не ядро; она ничего не решает, её только читают и пишут.'
  kind: choice
  options:
    - Векторная база данных, где лежат сохранённые записи
    - Цикл управления агента (ReAct-цикл), в котором доступны инструменты памяти
    - Токенизатор, разбивающий вход на токены
    - Системный промпт, описывающий роль ассистента
  correct: 1
  id: 007-os-analogia-2
  fingerprint: '76298795'
- concept: виртуальная память даёт иллюзию большого адресного пространства без роста физической памяти — за счёт подкачки по требованию
  question: Процесс адресует 500 ГБ данных на машине с 16 ГБ RAM и не падает. Объясни своими словами, за счёт чего это работает и что из этого механизма переносится на агента с окном контекста в 12k токенов и хранилищем на миллионы токенов.
  explanation: 'Суть виртуальной памяти — не увеличение RAM, а иллюзия большого адресного пространства поверх маленькой быстрой памяти. MemGPT берёт готовую схему: главный контекст физически ограничен и таким останется, а объём работы ограничен уже не им, а качеством политики подкачки.'
  kind: open
  reference: 'Все 500 ГБ никогда не лежат в RAM одновременно: физическая память остаётся 16 ГБ. В ней держат только страницы, нужные прямо сейчас, остальное лежит на диске; при обращении к отсутствующей странице возникает промах, страница подкачивается, процесс продолжается. Ключевое — подкачка по требованию: данные приносят в момент запроса, а не заранее. Для агента то же самое: окно в 12k токенов не растёт, но агент может работать с хранилищем произвольного размера, если у него есть инструменты, которыми он в нужный момент читает наружу и пишет наружу. Значимо не количество доступных данных, а момент и точность подкачки — кто-то должен заметить, что нужного куска в окне нет, и сходить за ним.'
  id: 007-os-analogia-3
  fingerprint: 832ade57
