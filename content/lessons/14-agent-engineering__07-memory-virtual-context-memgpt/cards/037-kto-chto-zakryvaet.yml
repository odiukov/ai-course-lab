- concept: 'тип памяти определяется вопросом, на который отвечает запись: «что произошло» против «как мне действовать»'
  question: 'Агент фиксирует два наблюдения: (A) «15 марта выкатили релиз в обход staging, упал прод»; (B) «перед выкаткой всегда прогоняй тесты на staging». Как соотносятся типы памяти для A и B?'
  explanation: 'Разделение идёт по вопросу, на который запись отвечает. A отвечает на «что произошло» — привязано к конкретному моменту и не устаревает как событие. B отвечает на «как мне это делать» — это выученная процедура, она задаёт форму будущих действий. Из одного эпизода может родиться правило, но это разные записи с разной судьбой: эпизод хранят как было, правило переписывают, когда меняется практика. Семантическая память — третий вопрос, «что является правдой» (факты о пользователе и домене), и ни A, ни B к нему не сводятся.'
  kind: choice
  options:
    - A — эпизодическая (что произошло, привязано к моменту), B — процедурная (как действовать, влияет на будущие ходы)
    - 'Обе эпизодические: B — просто краткий пересказ события A'
    - A — семантическая (факт о мире), B — эпизодическая (событие исправления)
    - 'Обе процедурные: любая запись из истории работы задаёт будущее поведение'
  correct: 0
  id: 037-kto-chto-zakryvaet-2
