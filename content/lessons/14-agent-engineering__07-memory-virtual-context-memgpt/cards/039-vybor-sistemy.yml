  question: Проект уже построен на SDK, который несёт собственную долговременную память (хранилище сессий и переиспользуемые процедуры). Что это означает для решения «какую память использовать»?
  explanation: 'Встроенная во фреймворк память — третья операционная форма наряду с self-hosted и managed. Её особенность в том, что она не выбирается отдельно: решение уже принято выбором SDK. Смена памяти означает смену фреймворка, а не подмену компонента.'
