- concept: вендорские надстройки (скоринговый слой над несколькими хранилищами, фоновое обслуживание памяти) — оптимизации поверх общей двухуровневой схемы, а не альтернативная архитектура памяти
  question: Один вендор рекламирует скоринговый слой поверх векторного, KV и графового хранилищ, другой — фоновое обслуживание памяти вне хода диалога. Можно ли считать это двумя разными архитектурами памяти? Объясни своими словами.
  explanation: 'Проверка проста: меняет ли фича сам механизм — маленький промпт плюс внешний склад плюс инструменты подкачки? Скоринг и фоновая обработка не меняют. Это оптимизации отбора и расписания внутри общего паттерна, поэтому выбор смещается на операционную ось.'
  kind: open
  reference: 'Нет. Обе фичи — надстройки над одной и той же схемой: фиксированный бюджет промпта, большой внешний склад, инструменты, переносящие записи между ними по решению агента. Скоринговый слой меняет то, как отбираются кандидаты на подкачку; фоновое обслуживание — когда выполняются консолидация и правки. Ни одно из двух не отменяет двухуровневую подкачку и не меняет способ, которым факт попадает в промпт. Поэтому такие различия не дают оси сравнения «архитектура памяти» — реально различает системы операционная форма: кто поднимает, чинит и оплачивает хранилище.'
