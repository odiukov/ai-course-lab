- concept: 'порядок работы подкачки внутрь: поиск, отбор лучших, отсев уже присутствующих в буфере записей, сборка блока с идентификаторами, запись в буфер'
  question: Расставь шаги функции подкачки данных из внешней памяти в главный контекст в правильном порядке.
  explanation: 'Отсев дубликатов идёт после отбора лучших, но до сборки блока: иначе одна и та же запись занимает место в окне столько раз, сколько её нашли. Идентификаторы попадают в блок вместе с текстом, чтобы агент мог сослаться на источник, а не пересказывать содержимое. Запись в буфер — последний шаг, потому что только после неё содержимое попадёт в следующий промпт.'
  kind: order
  items:
    - Вызвать поиск по внешнему хранилищу с полученным запросом
    - Отобрать заданное число лучших записей по релевантности
    - Отсеять записи, чьи идентификаторы уже присутствуют в буфере сообщений
    - Собрать оставшиеся записи в один текстовый блок вместе с их идентификаторами и метками
    - Добавить блок в буфер сообщений как наблюдение
