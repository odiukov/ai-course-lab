- concept: пустой результат поиска нужно материализовать явной записью в контекст, потому что отсутствие записи неотличимо от невыполненного вызова
  question: Поиск по внешней памяти вернул ноль записей. Что должна сделать функция подкачки?
  explanation: 'Если ничего не записано, следующий промпт выглядит ровно так же, как до вызова, — модель не отличает «искал и не нашёл» от «не искал» и уходит в цикл одинаковых запросов. Явная запись с текстом запроса фиксирует факт неудачи и позволяет модели сменить формулировку или сделать вывод об отсутствии данных. Заглушка без запроса этого не даёт: неизвестно, что именно не нашлось.'
  kind: choice
  options:
    - Добавить в буфер явное наблюдение вида «по запросу X ничего не найдено»
    - 'Не добавлять ничего: пустой блок только тратит токены окна'
    - Добавить в буфер пустую строку-заглушку без текста запроса
    - Повторить поиск с расширенным числом результатов и вернуть хоть что-нибудь
