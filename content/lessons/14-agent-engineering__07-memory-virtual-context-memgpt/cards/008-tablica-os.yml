- concept: 'MemGPT не изобретает новый механизм цикла: тот же ReAct-цикл плюс класс инструментов памяти, новизна — в том, что решение о подкачке принимает модель'
  question: Механизмы подкачки страниц известны десятилетиями, а ReAct-цикл агента существовал до MemGPT. Что тогда в MemGPT принципиально новое? Объясни своими словами.
  explanation: Частая ошибка — искать в таблице соответствий новый механизм. Строки таблицы — переименование давно работающих вещей. Вклад статьи в том, что политика выбора данных отдана модели как обычный вызов инструмента; отсюда же растут Letta и Mem0.
  kind: open
  reference: 'Механика не новая: цикл управления агента остаётся обычным ReAct-циклом, у которого просто появился дополнительный класс инструментов — инструменты памяти (core_memory_*, archival_memory_*, conversation_search). Новое — политика подкачки: в ОС решение, какую страницу поднять и какую вытеснить, принимает ядро по фиксированному алгоритму, а здесь решение ''что подкачать и когда'' принимает сама модель, выдавая вызов инструмента посреди хода. То есть перенесена не реализация, а вопрос: жёсткое внешнее правило заменено на решение, обучаемое и контекстно-зависимое.'
