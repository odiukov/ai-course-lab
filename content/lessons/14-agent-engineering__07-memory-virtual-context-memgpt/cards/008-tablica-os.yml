- concept: 'внешнему контексту соответствует диск: технология хранилища свободна, обязательное требование — возможность адресного поиска'
  question: Команда выбирает бэкенд для внешнего контекста двухуровневого агента. Какое требование к хранилищу вытекает из самой роли 'диска' в MemGPT?
  explanation: 'Инструменты памяти достают данные по запросу, значит от внешнего контекста нужна одна способность — искаться. Векторная база, KV-хранилище, граф одинаково годятся. Требование влезать в окно противоречит смыслу уровня: диск затем и нужен, что он неограничен.'
  kind: choice
  options:
    - Хранилище должно поддерживать поиск по запросу, а конкретная технология (вектора, ключ-значение, граф) не задана дизайном
    - 'Хранилище обязано быть векторной базой: без эмбеддингов паттерн не работает'
    - Хранилище должно помещаться в окно контекста модели целиком, иначе подкачка невозможна
    - Хранилище должно гарантировать строгую транзакционность записи, иначе главный контекст рассинхронизируется
