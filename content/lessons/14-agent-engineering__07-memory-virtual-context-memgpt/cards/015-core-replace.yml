- concept: 'неоднозначность адресации: при нескольких вхождениях old правильный ответ — отказ с указанием числа совпадений, а не выбор первого вхождения'
  question: Раздел core-памяти содержит 5 вхождений подстроки, переданной как old. Какое поведение core_memory_replace корректно?
  explanation: 'old — это адрес правки. Пять вхождений означают, что адрес не определяет одно место, и любой выбор за модель — угадывание. Отказ с числом совпадений даёт агенту информацию, по которой он расширит old до однозначного фрагмента и повторит вызов. Замена всех вхождений тоже неверна: агент просил одну правку, а получил бы пять.'
  kind: choice
  options:
    - Заменить первое вхождение и вернуть успех
    - Заменить все 5 вхождений и вернуть успех
    - Не менять раздел и вернуть ошибку с числом найденных совпадений
    - Заменить последнее вхождение как самое свежее
  correct: 2
  id: 015-core-replace-2
