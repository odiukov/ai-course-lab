- concept: 'порядок валидации в core_memory_replace: все проверки, включая длину результата, выполняются до записи в раздел'
  question: Расставь шаги реализации core_memory_replace с лимитом раздела в 600 символов в правильном порядке.
  explanation: 'new часто длиннее old, поэтому результат замены может выйти за лимит раздела. Проверять длину нужно на собранной строке до записи: если писать сначала, а проверять потом, раздел уже испорчен и нужен откат. Проверки идут от дешёвых и локальных (наличие и единственность old) к вычисляемым (длина результата), запись — последняя.'
  kind: order
  items:
    - Прочитать текущее содержимое указанного раздела
    - Посчитать вхождения old; при нуле или более чем одном вернуть ошибку без изменений
    - Собрать новый текст раздела, подставив new вместо old
    - Сравнить длину собранного текста с лимитом 600 символов и при превышении вернуть ошибку
    - Записать новый текст в раздел и вернуть успех
  id: 015-core-replace-3
