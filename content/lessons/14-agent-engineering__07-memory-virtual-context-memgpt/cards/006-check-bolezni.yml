- concept: положение нужного фрагмента относительно границы окна — критерий, различающий overflow и dilution
  question: Агент отвечает неверно на вопрос по логу. Какой единственный факт надо проверить первым, чтобы отличить overflow от dilution?
  explanation: 'Overflow — фрагмент физически отсутствует во входе. Dilution — фрагмент во входе есть, но тонет среди нерелевантного. Диагноз решается одним вопросом: внутри отсечки или за ней. Отсюда и лечение: в первом случае нужно место или отбор, во втором — только отбор.'
  kind: choice
  options:
    - Сколько всего токенов в модели контекста заявлено вендором
    - Попал ли нужный фрагмент в фактический вход вызова или был отсечён
    - Сколько раз агент вызывал инструменты за сессию
    - Начиналась ли сессия с системного промпта
  correct: 1
  id: 006-check-bolezni-1
  fingerprint: b30439b2
- concept: каждому из трёх отказов соответствует своё средство, и средства не взаимозаменяемы
  question: 'Агент в саппорте: (а) при 40 обращениях подряд теряет начало тикета, (б) внутри одного длинного тикета путает актуальный адрес доставки со старым, (в) назавтра не помнит договорённость с клиентом. Какое средство закрывает каждый из трёх случаев и почему одно общее средство не подходит?'
  explanation: Три отказа независимы. Токены покупают место, но не покупают релевантность и не переживают конец сессии, поэтому лечение подбирается по диагнозу.
  kind: open
  reference: '(а) overflow — вход не помещается: нужны бюджет токенов, сжатие старых ходов или вытеснение с сохранением важного во внешнее хранилище. (б) dilution — данные во входе есть, но конкурируют: нужны отбор релевантного под запрос, дедупликация и удаление устаревших версий факта. (в) persistence — новый вызов стартует пустым: нужны запись факта во внешнее хранилище и извлечение с вставкой во вход следующей сессии. Общего средства нет: место лечит только (а), отбор — только (б), внешняя память с извлечением — только (в). Поэтому в статье Mem0 система с маленьким окном и внешней памятью обходит baseline со 128k на long-horizon фактах.'
  id: 006-check-bolezni-2
  fingerprint: 4f2c67dd
