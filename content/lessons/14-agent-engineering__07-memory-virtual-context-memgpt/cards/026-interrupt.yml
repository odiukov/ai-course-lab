- concept: вызов памяти синхронно останавливает генерацию, потому что извлечённый факт нужен для формирования самого ответа, а не после него
  question: 'Инженер переделал рантайм так: агент дописывает ход до конца, и только потом рантайм исполняет запрошенные вызовы памяти, подкладывая результат в следующий ход. Объясни своими словами, что ломается в такой схеме.'
  explanation: Смысл прерывания — синхронность. Факт нужен до формирования ответа, поэтому агент останавливает генерацию на вызове инструмента, а не после завершения хода. Отложенное исполнение даёт лишний ход на исправление и провоцирует галлюцинацию на первом ходе.
  kind: open
  reference: 'Вызов памяти должен блокировать генерацию: агент прерывает себя, останавливается, рантайм исполняет вызов к хранилищу, результат возвращается как наблюдение и попадает во вход следующего вызова модели — и только тогда агент формирует ответ. Если ход дописывается до конца, ответ уже построен без факта: модель либо выдумает его, либо ответит «не знаю», а извлечённые данные придут с опозданием на ход и будут исправлять уже сказанное. Это та же семантика, что у блокирующего системного вызова read(): процесс засыпает и просыпается с данными, а не продолжает работать по неполученным байтам.'
