- concept: 'доступ к двум уровням стоит по-разному: главный контекст виден каждому вызову даром, внешний требует явного вызова инструмента, поэтому неограниченный объём не делает внешний уровень заменой главного'
  question: В агенте 9000 заметок во внешнем хранилище и главный контекст на 16k токенов. Какое утверждение верно описывает разницу между уровнями?
  explanation: 'Ёмкость и видимость — разные вещи. Внешний уровень неограничен именно потому, что не подаётся в промпт: он существует для модели только в момент, когда результат поиска попал во вход текущего вызова. Незапрошенная заметка для ответа не существует.'
  kind: choice
  options:
    - Внешнее хранилище участвует в каждом вызове модели, просто с меньшим весом внимания
    - Главный контекст входит в промпт каждого вызова автоматически, внешнее хранилище влияет на ответ только через вызов инструмента поиска и вставку найденного в промпт
    - Оба уровня видны модели одинаково, разница только в скорости чтения
    - Внешнее хранилище видно модели целиком, если заметок меньше, чем помещается токенов в окно
  correct: 1
  id: 011-check-urovni-1
  fingerprint: 83e18a87
- concept: уровень выбирается по тому, нужен ли фрагмент для текущего шага рассуждения, а не по его важности или долгосрочной ценности
  question: Агент ведёт разбор жалобы клиента. Есть четыре куска информации. Какой критерий определяет, что кладётся в главный контекст?
  explanation: 'Критерий — текущая релевантность, а не ценность и не размер. Важнейший факт проекта, ненужный в этом ответе, спокойно лежит во внешнем уровне: его поднимут, когда он станет нужен. Держать важное «всегда под рукой» — способ забить фиксированное окно.'
  kind: choice
  options:
    - 'Важность факта: критичное для проекта держат в главном контексте постоянно'
    - 'Свежесть: всё, что записано за последние сутки, идёт в главный контекст'
    - Нужен ли фрагмент прямо сейчас, чтобы сформировать текущий ответ; всё остальное живёт во внешнем уровне и поднимается адресно
    - 'Размер: короткие факты в главный контекст, длинные документы во внешний'
  correct: 2
  id: 011-check-urovni-2
  fingerprint: 7274662e
- concept: 'вход длиннее окна обрабатывается циклом подкачки: кусок в главный контекст, сжатый результат во внешний, освобождение места, сборка итога из поднятых результатов'
  question: Документ на 60k токенов, окно 16k. Расставь шаги двухуровневой обработки в правильном порядке.
  explanation: 'Документ на 60k в окно 16k не влезет никогда, но он и не должен: в окне по очереди бывает по одному куску, а сжатые результаты накапливаются во внешнем уровне. Ключевой шаг — освобождение места: без него цикл упирается в то же переполнение.'
  kind: order
  items:
    - Положить в главный контекст задачу и очередной кусок документа
    - Получить по этому куску вывод и записать его во внешнее хранилище
    - Убрать сам кусок из главного контекста, освободив место под следующий
    - Повторять цикл, пока не пройден весь документ
    - Поднять сохранённые выводы из внешнего хранилища в главный контекст и собрать итоговый ответ
  id: 011-check-urovni-3
  fingerprint: 765a60f3
