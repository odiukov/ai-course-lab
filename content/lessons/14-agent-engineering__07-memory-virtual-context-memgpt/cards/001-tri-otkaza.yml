- concept: persistence — потеря памяти между сессиями не зависит от размера окна
  question: Агент за одну сессию помещает весь диалог в окно и ни разу не упирается в лимит. На следующий день пользователь открывает новый чат, и агент не помнит принятых вчера решений. Какой это вид отказа памяти и что его устранит?
  explanation: Ничего не обрезалось и ничего не размылось — окно новой сессии просто пустое. Пустое окно на 512k ровно так же пусто, как на 4k, поэтому токены здесь не лечат ничего. Спасает только запись состояния за пределы окна.
  kind: choice
  options:
    - Overflow; поднять окно с 16k до 512k токенов
    - Dilution; сжать историю суммаризацией внутри окна
    - Persistence; вынести факты во внешнее хранилище и подгружать их в новую сессию
    - Overflow; увеличить лимит на число вызовов инструментов
  correct: 2
  id: 001-tri-otkaza-1
  fingerprint: e8f26d45
- concept: расширение окна снимает только overflow, dilution и persistence остаются
  question: Команда меняет модель с окном 16k на модель с окном 512k, больше ничего не трогая. Какой из трёх видов отказа памяти это снимает напрямую?
  explanation: Лишние токены решают ровно одну задачу — вместимость. Dilution они скорее усугубляют (больше места — больше мусора в нём), а на пустое окно новой сессии не влияют вообще. В замерах Mem0 (2025) базовое решение с окном 128k проигрывало агенту с окном 4k и внешней памятью именно поэтому.
  kind: choice
  options:
    - 'Только overflow: то, что раньше обрезалось за отсечкой, теперь влезает'
    - 'Overflow и dilution: больше места — точнее внимание'
    - 'Overflow и persistence: длинное окно переживает перезапуск сессии'
    - 'Все три: объём — общая причина всех трёх отказов'
  correct: 0
  id: 001-tri-otkaza-2
  fingerprint: fa8682a2
- concept: dilution — деградация точности на длинном входе при отсутствии обрезки
  question: Объясни своими словами, почему агент может «забыть» факт, который физически присутствует в окне контекста и не был обрезан.
  explanation: 'Ключевая мысль урока: важен не объём окна, а что именно окажется перед моделью прямо сейчас. Присутствие ≠ извлечение.'
  kind: open
  reference: 'Это dilution: внимание модели распределяется по всему входу, и нужный фрагмент тонет среди массы нерелевантного контекста — старых веток диалога, полных дампов инструментов, лишних документов. Даже фронтир-модели теряют точность на длинных входах, поэтому наличие факта в окне не гарантирует его использования. Лечится не увеличением окна, а отбором: класть в окно только то, что релевантно текущему шагу, а остальное держать во внешней памяти и доставать по запросу.'
