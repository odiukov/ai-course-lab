- concept: при лексическом скоринге многословная устаревшая запись обгоняет короткую свежую, потому что длина увеличивает пересечение с запросом
  question: Поиск в архиве ранжирует записи по числу общих слов с запросом. В архиве есть свежая запись из 7 слов с актуальным фактом и прошлогодняя запись из 45 слов, где тот же факт обсуждается с устаревшим значением. Почему наверх выдачи всплывёт устаревшая?
  explanation: 'Пересечение слов без нормировки на длину — это фактически премия за многословность: чем больше текста, тем выше шанс совпасть с запросом. Метка времени в такую оценку не входит вовсе, поэтому устаревший вариант факта выигрывает у актуального и именно он приезжает в контекст как истина. Отсюда два лечения: нормировка/учёт свежести в ранжировании и удаление устаревших записей.'
  kind: choice
  options:
    - Потому что поиск по умолчанию сортирует записи от старых к новым
    - Потому что абсолютное число совпадений растёт с длиной записи, а время записи в оценку вообще не входит
    - Потому что короткие записи считаются менее надёжными источниками
    - Потому что свежая запись ещё не проиндексирована
  correct: 1
  id: 032-memory-rot-2
  fingerprint: fb00d4ee
- concept: консолидация и инвалидация решают разные задачи и не заменяют друг друга
  question: Периодическая консолидация записей и явная инвалидация по детектору конфликтов — два разных средства против memory rot. Объясни своими словами, что делает каждое и почему одного из них недостаточно.
  explanation: 'Разные отказы — разные средства. В Letta консолидацией занимается sleep-time агент, в Mem0 инвалидацией — детектор конфликтов. Заменить одно другим нельзя: склейка дублей не выберет правду, а гашение конфликтов не уменьшит гору совместимых записей.'
  kind: open
  reference: 'Консолидация — фоновая переработка накопленного: агент в простое перечитывает похожие записи, склеивает дубликаты и почти-дубликаты в одну сводку, сокращая объём кандидатов на поиске. Она борется с шумом от повторов, но сама по себе не решает, какая из двух противоречащих версий факта верна. Инвалидация — точечная работа с противоречием: детектор конфликтов ловит новую запись, несовместимую со старой, и гасит устаревшую (помечает или удаляет). Она снимает конкретный конфликт, но не разгребает массу непротиворечивых дублей, которые всё равно раздувают выдачу. Отсюда нужны оба: одно сжимает объём, другое чинит актуальность.'
  id: 032-memory-rot-3
  fingerprint: 9817ce7f
