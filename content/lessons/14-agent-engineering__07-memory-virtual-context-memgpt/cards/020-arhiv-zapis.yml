- concept: tags — дешёвый предфильтр кандидатов перед дорогим сопоставлением текста, поэтому это широкие переиспользуемые категории, а не пересказ записи
  question: 'Запись архива: «Клиент просит счета в PDF, не в XLSX». Какой набор tags полезнее для последующего поиска?'
  explanation: 'Теги работают как грубый отсев: сначала выкинуть все записи не из нужной категории, и только оставшиеся сравнивать с запросом по тексту. Для этого нужны широкие ярлыки, переиспользуемые многими записями. Тег-пересказ совпадает ровно с одной записью и ничего не отсекает, а «важное»/«запомнить» стоят на всём подряд и тоже не сужают выборку.'
  kind: choice
  options:
    - '["клиент", "документооборот"]'
    - '["клиент просит счета в pdf не в xlsx"]'
    - '["важное", "запомнить", "не_забыть"]'
    - 'Теги не нужны: текст записи и так содержит все слова запроса'
  correct: 0
