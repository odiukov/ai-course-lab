- concept: 'id даёт стабильную короткую адресацию записи: ссылка и правка без пересказа текста плюс различение дубликатов'
  question: Тексты записей в архиве и так уникальны. Зачем каждой записи отдельный идентификатор — объясни своими словами, что ломается без него.
  explanation: 'Идентификатор отделяет адресацию от содержимого. Ровно поэтому в наборе полей записи он стоит рядом с текстом, а не выводится из него: содержимое меняется, ручка остаётся.'
  kind: open
  reference: 'id — короткая ручка на запись, независимая от её содержимого. Без него любая операция адресуется текстом: чтобы обновить или удалить запись, агент должен процитировать её целиком — это токены, и это ломается при малейшем расхождении в формулировке. Также по id видно тождество: две выдачи поиска с одним id — одна запись, показанная дважды, а два разных id с похожим текстом — реальные дубликаты, которые надо слить. Наконец, id стабилен при правке текста, поэтому ссылки на запись из других записей и из рассуждения агента переживают обновление.'
  id: 020-arhiv-zapis-3
  fingerprint: e03138ca
