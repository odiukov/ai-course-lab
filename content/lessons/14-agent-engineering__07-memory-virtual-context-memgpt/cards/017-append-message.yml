  question: Почему функция добавления сообщения в главный контекст возвращает признак «порог превышен», но не вытесняет старые сообщения сама?
  explanation: 'Функция, которая и пишет, и удаляет, делает потерю данных побочным эффектом обычной записи: вызывающий код не знает, что история укоротилась. Разделение даёт наблюдаемую точку решения — измерение сообщает факт, а политика (что именно вытеснить и как сжать) живёт отдельно и меняется независимо.'
