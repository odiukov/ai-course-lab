- concept: memory rot — свойство накопительного хранилища и лечится операциями над записями, тогда как разбавление внимания — свойство одного входа и лечится отбором того, что попадает в промпт
  question: У агента два разных симптома. (1) На длинном входе он теряет факт, который физически присутствует в промпте. (2) Поиск по архиву за полгода стабильно поднимает наверх устаревшие версии факта. Что верно?
  explanation: 'Разбавление внимания живёт внутри одного окна и не зависит от возраста данных: убери лишнее из входа — и оно уйдёт. Rot накапливается месяцами в хранилище, которое агент даже не видит целиком; обрезка промпта на него не действует, нужны операции над самими записями — свернуть похожее, пометить устаревшее недействительным.'
  kind: choice
  options:
    - Оба симптома — одна и та же проблема, оба лечатся более агрессивной обрезкой буфера сообщений
    - (1) — проблема одного вызова, лечится отбором того, что вообще попадает во вход; (2) — проблема накопления в хранилище, лечится консолидацией и явной инвалидацией записей
    - (1) лечится консолидацией архива, (2) лечится увеличением окна модели
    - Оба симптома исчезнут при переносе всего содержимого архива в постоянные разделы core-памяти
  correct: 1
