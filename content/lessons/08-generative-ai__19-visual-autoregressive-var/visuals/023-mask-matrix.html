<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Блочная маска внимания для 85 токенов</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7fafc;
    --ink: #17232d;
    --muted: #52616d;
    --future: #e5e9ed;
    --diagonal: #bcc5cd;
    --allowed: #8dd8ca;
    --allowed-ink: #096f67;
    --grid: #cbd2d8;
    --boundary: #53616d;
    --accent: #d97706;
    --panel: #edf5f5;
    --panel-line: #b9cbcc;
    --white: #ffffff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11181e;
      --ink: #edf5f7;
      --muted: #aebcc5;
      --future: #29333b;
      --diagonal: #46535e;
      --allowed: #225f59;
      --allowed-ink: #8ee3d5;
      --grid: #39454e;
      --boundary: #9aa9b3;
      --accent: #f4ad45;
      --panel: #19272a;
      --panel-line: #365255;
      --white: #11181e;
    }
  }

  html, body {
    background: var(--bg);
  }

  body {
    margin: 0;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 520px;
    background: var(--bg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  text {
    fill: var(--ink);
  }

  .title {
    font-size: 19px;
    font-weight: bold;
  }

  .axis-label {
    font-size: 12px;
    font-weight: bold;
    fill: var(--muted);
  }

  .label {
    font-size: 13px;
  }

  .small {
    font-size: 12px;
  }

  .tiny {
    font-size: 11px;
  }

  .strong {
    font-weight: bold;
  }

  .muted {
    fill: var(--muted);
  }

  .allowed-text {
    fill: var(--allowed-ink);
    font-weight: bold;
  }

  .accent-text {
    fill: var(--accent);
    font-weight: bold;
  }

  .future {
    fill: var(--future);
  }

  .diagonal {
    fill: var(--diagonal);
  }

  .allowed {
    fill: var(--allowed);
  }

  .token-grid {
    stroke: var(--grid);
    stroke-width: 0.45;
    vector-effect: non-scaling-stroke;
    shape-rendering: crispEdges;
  }

  .boundary {
    stroke: var(--boundary);
    stroke-width: 1.7;
    vector-effect: non-scaling-stroke;
    shape-rendering: crispEdges;
  }

  .diagonal-cross {
    stroke: var(--boundary);
    stroke-width: 1.2;
    vector-effect: non-scaling-stroke;
  }

  .bracket {
    fill: none;
    stroke: var(--allowed-ink);
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
  }

  .focus-row {
    fill: none;
    stroke: var(--accent);
    stroke-width: 2.4;
    vector-effect: non-scaling-stroke;
  }

  .focus-arrow {
    fill: none;
    stroke: var(--accent);
    stroke-width: 1.8;
    vector-effect: non-scaling-stroke;
  }

  .arrowhead {
    fill: var(--accent);
  }

  .panel {
    fill: var(--panel);
    stroke: var(--panel-line);
    stroke-width: 1.2;
    vector-effect: non-scaling-stroke;
  }

  .legend-box {
    stroke: var(--boundary);
    stroke-width: 1;
    vector-effect: non-scaling-stroke;
  }

  .matrix-frame {
    fill: none;
    stroke: var(--boundary);
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
  }

  #fallback {
    box-sizing: border-box;
    width: 100%;
    max-height: 520px;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
  }
</style>
</head>
<body>
<svg id="diagram" viewBox="0 0 800 460" width="800" height="460"
     preserveAspectRatio="xMidYMid meet" role="img"
     aria-labelledby="staticTitle diagramDescription">
  <title>Блочная маска внимания для 85 токенов</title>
  <desc id="diagramDescription">
    Матрица 85 на 85 разбита на блоки 1, 4, 16 и 64.
    Каждый масштаб видит только все предыдущие масштабы.
    Диагональные и будущие блоки закрыты. Последний блок видит 21 токен.
  </desc>
  <text id="staticTitle" class="title">Блочная маска внимания: 85 × 85</text>
  <g id="plot"></g>
</svg>

<div id="fallback" hidden>
  Блочная маска 85 × 85: блоки имеют размеры 1, 4, 16 и 64.
  Разрешены только предыдущие масштабы; диагональ и будущие блоки закрыты.
  Каждая строка последнего блока видит 1 + 4 + 16 = 21 предыдущий токен.
</div>

<script>
const DATA = Object.freeze([{
  zero: 0,
  one: 1,
  half: 0.5,
  rotation: -90,
  originX: 45,
  originY: 24,
  unit: 4,

  matrixX: 18,
  matrixY: 18,
  total: 85,
  sizes: [1, 4, 16, 64],

  titleX: 0,
  titleY: 2,
  contextLabelX: 60.5,
  contextLabelY: 7,
  queryLabelX: 6,
  queryLabelY: 60.5,

  bracketY: 15,
  bracketCapTopY: 14,
  bracketCapBottomY: 16,
  bracketLabelY: 12,

  panelX: 113,
  panelY: 16,
  panelWidth: 72,
  panelHeight: 89,
  panelTextX: 118,
  panelHeaderY: 21,

  scaleSwatchX: 117,
  scaleSwatchSize: 4,
  scaleRows: [
    { y: 27, label: "1 × 1  →  блок 1" },
    { y: 34, label: "2 × 2  →  блок 4" },
    { y: 41, label: "4 × 4  →  блок 16" },
    { y: 48, label: "8 × 8  →  блок 64" }
  ],

  ruleHeaderY: 57,
  ruleSwatchX: 117,
  ruleTextX: 124,
  allowedRuleY: 63,
  blockedRuleY: 70,
  ruleSwatchWidth: 5,
  ruleSwatchHeight: 4,

  noteX: 116,
  noteY: 77,
  noteWidth: 66,
  noteHeight: 22,
  noteTextX: 119,
  noteLines: [
    { y: 82, text: "Для любой строки блока 64:" },
    { y: 88, text: "видно 1 + 4 + 16 = 21" },
    { y: 94, text: "свой блок 64 закрыт целиком" }
  ],

  footerX: 149,
  footerY: 103,
  focusLabelX: 111,
  focusLabelOffsetY: 2,
  focusArrowStartX: 110,
  arrowSize: 1,
  crossInset: 0.25
}]);

const [D] = DATA;
const origin = Object.freeze({ x: D.originX, y: D.originY });
const scale = Object.freeze({ x: D.unit, y: D.unit });

const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const svg = document.getElementById("diagram");
  const plot = document.getElementById("plot");
  const title = document.getElementById("staticTitle");

  const make = (name, attributes, content) => {
    const node = document.createElementNS(svg.namespaceURI, name);
    for (const [key, value] of Object.entries(attributes)) {
      node.setAttribute(key, String(value));
    }
    if (content !== undefined) node.textContent = content;
    return node;
  };

  const add = node => {
    plot.appendChild(node);
    return node;
  };

  const rect = (x, y, width, height, className) => add(make("rect", {
    x: sx(x),
    y: sy(y),
    width: sx(x + width) - sx(x),
    height: sy(y + height) - sy(y),
    class: className
  }));

  const line = (x1, y1, x2, y2, className) => add(make("line", {
    x1: sx(x1),
    y1: sy(y1),
    x2: sx(x2),
    y2: sy(y2),
    class: className
  }));

  const text = (x, y, content, className, anchor) => add(make("text", {
    x: sx(x),
    y: sy(y),
    class: className,
    "text-anchor": anchor,
    "dominant-baseline": "middle"
  }, content));

  const leftArrow = (x1, y1, x2, y2) => {
    line(x1, y1, x2, y2, "focus-arrow");
    add(make("polygon", {
      points: [
        `${sx(x2)},${sy(y2)}`,
        `${sx(x2 + D.arrowSize)},${sy(y2 - D.arrowSize)}`,
        `${sx(x2 + D.arrowSize)},${sy(y2 + D.arrowSize)}`
      ].join(" "),
      class: "arrowhead"
    }));
  };

  title.setAttribute("x", sx(D.titleX));
  title.setAttribute("y", sy(D.titleY));
  title.setAttribute("text-anchor", "start");
  title.setAttribute("dominant-baseline", "middle");

  text(
    D.contextLabelX,
    D.contextLabelY,
    "возможный контекст: 85 токенов →",
    "axis-label",
    "middle"
  );

  const queryAxis = text(
    D.queryLabelX,
    D.queryLabelY,
    "запросы: 85 токенов →",
    "axis-label",
    "middle"
  );
  queryAxis.setAttribute(
    "transform",
    `rotate(${D.rotation} ${sx(D.queryLabelX)} ${sy(D.queryLabelY)})`
  );

  rect(D.matrixX, D.matrixY, D.total, D.total, "future");

  let blockStart = D.zero;
  for (const blockSize of D.sizes) {
    if (blockStart > D.zero) {
      rect(
        D.matrixX,
        D.matrixY + blockStart,
        blockStart,
        blockSize,
        "allowed"
      );
    }

    rect(
      D.matrixX + blockStart,
      D.matrixY + blockStart,
      blockSize,
      blockSize,
      "diagonal"
    );

    line(
      D.matrixX + blockStart + D.crossInset,
      D.matrixY + blockStart + D.crossInset,
      D.matrixX + blockStart + blockSize - D.crossInset,
      D.matrixY + blockStart + blockSize - D.crossInset,
      "diagonal-cross"
    );
    line(
      D.matrixX + blockStart + blockSize - D.crossInset,
      D.matrixY + blockStart + D.crossInset,
      D.matrixX + blockStart + D.crossInset,
      D.matrixY + blockStart + blockSize - D.crossInset,
      "diagonal-cross"
    );

    blockStart += blockSize;
  }

  for (
    let token = D.zero;
    token <= D.total;
    token += D.one
  ) {
    line(
      D.matrixX + token,
      D.matrixY,
      D.matrixX + token,
      D.matrixY + D.total,
      "token-grid"
    );
    line(
      D.matrixX,
      D.matrixY + token,
      D.matrixX + D.total,
      D.matrixY + token,
      "token-grid"
    );
  }

  let boundary = D.zero;
  line(
    D.matrixX,
    D.matrixY,
    D.matrixX,
    D.matrixY + D.total,
    "boundary"
  );
  line(
    D.matrixX,
    D.matrixY,
    D.matrixX + D.total,
    D.matrixY,
    "boundary"
  );

  for (const blockSize of D.sizes) {
    boundary += blockSize;
    line(
      D.matrixX + boundary,
      D.matrixY,
      D.matrixX + boundary,
      D.matrixY + D.total,
      "boundary"
    );
    line(
      D.matrixX,
      D.matrixY + boundary,
      D.matrixX + D.total,
      D.matrixY + boundary,
      "boundary"
    );
  }

  rect(D.matrixX, D.matrixY, D.total, D.total, "matrix-frame");

  const previousCount =
    D.sizes
      .slice(D.zero, D.sizes.length - D.one)
      .reduce((sum, size) => sum + size, D.zero);

  line(
    D.matrixX,
    D.bracketY,
    D.matrixX + previousCount,
    D.bracketY,
    "bracket"
  );
  line(
    D.matrixX,
    D.bracketCapTopY,
    D.matrixX,
    D.bracketCapBottomY,
    "bracket"
  );
  line(
    D.matrixX + previousCount,
    D.bracketCapTopY,
    D.matrixX + previousCount,
    D.bracketCapBottomY,
    "bracket"
  );
  text(
    D.matrixX + previousCount * D.half,
    D.bracketLabelY,
    "1 + 4 + 16 = 21 предыдущий токен",
    "small allowed-text",
    "middle"
  );

  const lastBlockRow = D.matrixY + previousCount;
  rect(
    D.matrixX,
    lastBlockRow,
    D.total,
    D.one,
    "focus-row"
  );

  text(
    D.focusLabelX,
    lastBlockRow - D.focusLabelOffsetY,
    "одна из 64 одинаковых строк",
    "small accent-text",
    "start"
  );
  leftArrow(
    D.focusArrowStartX,
    lastBlockRow + D.half,
    D.matrixX + D.total,
    lastBlockRow + D.half
  );

  rect(
    D.panelX,
    D.panelY,
    D.panelWidth,
    D.panelHeight,
    "panel"
  );

  text(
    D.panelTextX,
    D.panelHeaderY,
    "Четыре масштаба",
    "label strong",
    "start"
  );

  for (const row of D.scaleRows) {
    rect(
      D.scaleSwatchX,
      row.y - D.scaleSwatchSize * D.half,
      D.scaleSwatchSize,
      D.scaleSwatchSize,
      "diagonal legend-box"
    );
    text(
      D.panelTextX + D.scaleSwatchSize + D.one,
      row.y,
      row.label,
      "small",
      "start"
    );
  }

  text(
    D.panelTextX,
    D.ruleHeaderY,
    "Правило маски",
    "label strong",
    "start"
  );

  rect(
    D.ruleSwatchX,
    D.allowedRuleY - D.ruleSwatchHeight * D.half,
    D.ruleSwatchWidth,
    D.ruleSwatchHeight,
    "allowed legend-box"
  );
  text(
    D.ruleTextX,
    D.allowedRuleY,
    "предыдущие масштабы — открыты",
    "tiny allowed-text",
    "start"
  );

  rect(
    D.ruleSwatchX,
    D.blockedRuleY - D.ruleSwatchHeight * D.half,
    D.ruleSwatchWidth,
    D.ruleSwatchHeight,
    "diagonal legend-box"
  );
  text(
    D.ruleTextX,
    D.blockedRuleY,
    "свой и будущие — закрыты",
    "tiny",
    "start"
  );

  rect(
    D.noteX,
    D.noteY,
    D.noteWidth,
    D.noteHeight,
    "panel"
  );

  for (const note of D.noteLines) {
    text(
      D.noteTextX,
      note.y,
      note.text,
      note.y === D.noteLines[D.one].y
        ? "small allowed-text"
        : "small",
      "start"
    );
  }

  text(
    D.footerX,
    D.footerY,
    "85 запросов × 85 возможных контекстов",
    "tiny muted",
    "middle"
  );
} catch (error) {
  document.getElementById("diagram").setAttribute("hidden", "");
  document.getElementById("fallback").removeAttribute("hidden");
}
</script>
</body>
</html>
