- concept: cross-entropy для позиции равна отрицательному логарифму вероятности правильного VQ-кода
  question: Модель выдала распределение q по кодовой книге, а правильный индекс токена равен y. Заполни формулу ошибки для этой позиции.
  explanation: 'Cross-entropy с правильным классом y использует только назначенную ему вероятность: L = -ln(q_y). Чем увереннее модель в правильном VQ-коде, тем меньше штраф.'
  kind: cloze
  template: L = ___
  answer: -ln(q_y)
  accept:
    - -log(q_y)
    - -ln q_y
    - -log q_y
  id: 025-training-loss-1
  fingerprint: 43cbb591
- concept: общий loss VAR агрегирует позиционные cross-entropy со всех обучаемых масштабов
  question: VAR-трансформер выдал распределение по кодовой книге для каждой позиции нескольких масштабов. Как корректно получить скалярный loss для обновления параметров?
  explanation: Каждая позиция каждого масштаба является отдельным классификационным предсказанием со своей целевой меткой. Позиционные ошибки агрегируют в один loss; усреднение распределений смешало бы разные цели, а argmax не даёт подходящего дифференцируемого сигнала.
  kind: choice
  options:
    - Для каждой позиции вычислить cross-entropy с её правильным индексом, затем усреднить или суммировать полученные ошибки
    - Сначала усреднить распределения всех позиций, затем один раз вычислить cross-entropy
    - Преобразовать каждое распределение в argmax и посчитать только долю ошибочных индексов
    - Вычислить cross-entropy только на самом плотном масштабе, отбросив остальные
  correct: 0
  id: 025-training-loss-2
  fingerprint: 725b2352
