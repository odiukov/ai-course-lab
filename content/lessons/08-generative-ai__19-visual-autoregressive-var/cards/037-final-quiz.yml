- concept: результат текущего масштаба включается в состояние генерации до предсказания следующего масштаба
  question: Расположите действия одного этапа генерации VAR в правильном порядке.
  explanation: Сначала трансформер предсказывает текущую сетку, затем её коды выбираются параллельно. Эти коды становятся частью накопленного результата и контекста, на котором строится следующий масштаб.
  kind: order
  items:
    - Получить распределения VQ-кодов текущего масштаба из контекста более грубых масштабов
    - Параллельно выбрать VQ-коды для всех позиций текущей сетки
    - Добавить выбранные коды в известный контекст и накопленную латентную реконструкцию
    - Перейти к предсказанию следующего, более подробного масштаба
  id: 037-final-quiz-1
  fingerprint: f64bf82c
- concept: число последовательных проходов и вычислительная работа внутри проходов зависят от разных свойств пирамиды
  question: У двух VAR-пирамид одинаковое число масштабов, но во второй сетки содержат больше пространственных позиций. Что верно при параллельном предсказании позиций внутри масштаба?
  explanation: Последовательная глубина VAR определяется числом масштабов. Более плотные сетки увеличивают число обрабатываемых токенов и стоимость внимания, но не добавляют этапов, если число масштабов не изменилось.
  kind: choice
  options:
    - Последовательных проходов столько же, но вычислительная работа внутри них может быть больше
    - Число последовательных проходов обязательно равно общему числу пространственных позиций
    - Более плотные сетки уменьшают число последовательных проходов
    - Каждая дополнительная позиция требует отдельного последовательного прохода трансформера
  correct: 0
