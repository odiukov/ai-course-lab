- concept: низкие и высокие пространственные частоты кодируют разные уровни структуры изображения
  question: Какое изменение наиболее характерно для применения низкочастотного фильтра к естественному изображению?
  explanation: Низкочастотный фильтр сохраняет медленно меняющуюся структуру — крупные формы, фон и освещение — и подавляет быстрые пространственные изменения, включая резкие края и фактуры.
  kind: choice
  options:
    - Исчезают крупные цветовые области, но сохраняются мелкие текстуры
    - Сохраняется общая компоновка, а резкие границы и мелкие текстуры ослабляются
    - Все пространственные компоненты усиливаются одинаково
    - Меняется только порядок пикселей без потери деталей
