- concept: тензорная операция уменьшения должна сохранять устройство данных и граф вычислений
  question: Почему при обучении модели скрытую сетку лучше уменьшать операцией тензорного фреймворка, не преобразуя её предварительно в массив NumPy?
  explanation: Разрыв графа блокирует обратное распространение через уменьшение сетки, а лишний перенос между GPU и CPU замедляет вычисления. Тензорная операция избегает обеих проблем.
  kind: open
  reference: Тензорная операция остаётся частью графа вычислений, поэтому через неё может распространяться градиент. Она также выполняется на том же вычислительном устройстве, тогда как преобразование в NumPy обычно переносит данные на CPU и разрывает граф автоматического дифференцирования.
  id: 007-code-downsample-2
  fingerprint: 7e3c56af
