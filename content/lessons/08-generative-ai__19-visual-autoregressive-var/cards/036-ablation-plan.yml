- concept: каузальный эффект гиперпараметра оценивают абляцией при фиксации остальных условий
  question: Как поставить эксперимент, чтобы определить влияние числа масштабов VAR на качество и стоимость генерации?
  explanation: Чистая абляция меняет один фактор и фиксирует остальные. Иначе нельзя отделить эффект дополнительных масштабов от влияния codebook, декодера или бюджета обучения.
  kind: choice
  options:
    - Менять только число масштабов, сохраняя размер codebook, данные, архитектуру декодера и протокол обучения
    - Одновременно увеличивать число масштабов и размер codebook, сохраняя только набор данных
    - Сравнить две модели с разными масштабами, декодерами и бюджетами обучения
    - Выбрать модель с лучшей реконструкцией без измерения стоимости генерации
  correct: 0
  id: 036-ablation-plan-1
  fingerprint: 43642db5
- concept: улучшение реконструкции токенизатора не гарантирует улучшения генерации
  question: Объясните, почему увеличение codebook может снизить ошибку реконструкции, но не улучшить качество изображений, сгенерированных VAR.
  explanation: Реконструкция измеряет возможности токенизатора при известных кодах, а генерация зависит ещё и от способности трансформера правильно предсказать эти коды. Поэтому обе метрики нужно оценивать отдельно.
  kind: open
  reference: Более крупный codebook точнее квантует латент, однако генератору приходится предсказывать индекс среди большего числа классов. Если рост сложности предсказания приводит к большему числу ошибок, выигрыш токенизатора может не перейти в итоговое качество генерации.
  id: 036-ablation-plan-2
  fingerprint: 8a358f40
- concept: точку перегиба выбирают по предельному приросту качества относительно дополнительной вычислительной цены
  question: На кривой абляции качество реконструкции почти перестало расти, но каждый следующий масштаб продолжает увеличивать число авторегрессионных проходов. Какой принцип выбора конфигурации наиболее обоснован?
  explanation: После выхода качества на плато дополнительные масштабы дают всё меньший выигрыш, сохраняя вычислительную цену. Точка перегиба отражает разумный компромисс между качеством и стоимостью.
  kind: choice
  options:
    - Выбрать последнюю конфигурацию перед резким падением предельного прироста качества
    - Всегда выбирать максимальное доступное число масштабов
    - Всегда выбирать конфигурацию с минимальным числом проходов
    - Учитывать только качество реконструкции и игнорировать генерацию
  correct: 0
  id: 036-ablation-plan-3
