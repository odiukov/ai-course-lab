- concept: степенной закон позволяет экстраполировать FID по результатам меньших моделей
  question: Инженер обучил несколько VAR одного семейства с разными вычислительными бюджетами. Как использовать зависимость FID(C) = aC^{-b} для прогноза более крупного запуска?
  explanation: Параметры степенного закона можно оценить по менее дорогим запускам, после чего предсказать FID при большем бюджете. Такой прогноз обоснован внутри того же семейства моделей и сопоставимого режима обучения.
  kind: choice
  options:
    - Оценить параметры a и b по выполненным запускам и экстраполировать кривую при сопоставимом режиме обучения
    - Взять среднее наблюдавшихся значений FID, не учитывая вычислительный бюджет
    - Считать, что любая новая архитектура будет иметь те же параметры степенной кривой
  correct: 0
  id: 034-scaling-law-1
  fingerprint: 2851a0a6
- concept: показатель степени задаёт относительное изменение FID при масштабировании вычислений
  question: Заполни пропуск для степенного закона FID(C) = aC^{-b}, если вычислительный бюджет умножили на коэффициент k.
  explanation: Подстановка kC даёт a(kC)^{-b}. После деления на aC^{-b} остаётся k^{-b}. Чем больше b, тем быстрее уменьшается FID с ростом вычислительного бюджета.
  kind: cloze
  template: \frac{\operatorname{FID}(kC)}{\operatorname{FID}(C)} = ___
  answer: k^{-b}
  accept:
    - 1/k^b
    - k^(-b)
    - \frac{1}{k^b}
  id: 034-scaling-law-2
  fingerprint: a47749bd
- concept: параметры кривой масштабирования нельзя без проверки переносить между разными данными и рецептами обучения
  question: Почему кривую масштабирования FID, оценённую для одного семейства VAR, нельзя автоматически использовать для VAR с другим набором данных или существенно изменённым обучением?
  explanation: Закон масштабирования является эмпирической закономерностью в определённом режиме. Смена данных, архитектурных ограничений или рецепта обучения способна изменить уровень и наклон кривой, поэтому прежняя экстраполяция может стать неверной.
  kind: open
  reference: Степенной вид зависимости может сохраниться, но коэффициент исходного уровня и показатель степени зависят от семейства моделей, данных и режима обучения. После их изменения кривую необходимо проверить или оценить заново.
  id: 034-scaling-law-3
  fingerprint: c85246b9
