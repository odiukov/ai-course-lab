- concept: VAR генерирует изображение последовательным уточнением от грубого масштаба к подробному
  question: Расположите стадии генерации изображения моделью VAR в правильном порядке.
  explanation: 'VAR выполняет авторегрессию по масштабам: сначала задаёт глобальную структуру изображения, затем последовательно добавляет более мелкие пространственные детали. Это заменяет растровое предсказание отдельных токенов последовательностью полных масштабов.'
  kind: order
  items:
    - Создать наиболее грубое представление всего изображения
    - Предсказать более подробное представление с учётом доступных грубых масштабов
    - Продолжать уточнение до получения конечной токенной сетки
