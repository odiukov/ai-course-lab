- concept: качество реконструкции совместно ограничено пространственными масштабами, ёмкостью codebook и возможностями декодера
  question: Объясни своими словами, почему очень большой codebook сам по себе не гарантирует чёткую реконструкцию, если сетки масштабов остаются грубыми или декодер недостаточно выразителен.
  explanation: Размер codebook отвечает за разнообразие доступных латентных векторов, масштабы — за пространственные разрешения представления, а декодер — за восстановление пикселей. Улучшение одного звена перестаёт помогать, когда ограничением становится другое.
  kind: open
  reference: Codebook различает варианты признаков только в существующих пространственных позициях, поэтому на слишком грубой сетке ему негде представить отдельные мелкие детали. Даже точный квантованный латент не поможет, если декодер не способен преобразовать содержащуюся в нём информацию в соответствующие пиксельные структуры.
  id: 035-tokenizer-design-2
  fingerprint: 5d98099b
