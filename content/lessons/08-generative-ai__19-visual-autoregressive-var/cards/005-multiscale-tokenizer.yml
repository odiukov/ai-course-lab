- concept: каждый следующий уровень residual VQ квантует остаток реконструкции предыдущих уровней
  question: Объясни своими словами, что именно квантует очередной масштаб residual VQ и как после этого обновляется реконструкция скрытого представления.
  explanation: В residual VQ масштабы не кодируют исходное представление независимо. Каждый новый уровень приближает то, что ещё не восстановили предыдущие, а итоговое скрытое представление получается сложением их вкладов.
  kind: open
  reference: Очередной масштаб квантует разницу между исходным скрытым представлением и суммарной реконструкцией предыдущих масштабов. Его декодированный вклад увеличивают до общего размера и прибавляют к накопленной реконструкции, уменьшая остаток.
  id: 005-multiscale-tokenizer-1
  fingerprint: 2fcdca07
- concept: все масштабы мультимасштабного VQ-токенизатора выбирают векторы из общей кодовой книги
  question: Что означает общая кодовая книга в мультимасштабном VQ-токенизаторе?
  explanation: Все сетки обращаются к одной кодовой книге. Один и тот же вектор может быть выбран на разных уровнях, однако из-за различного разрешения сеток его вклад соответствует разному пространственному охвату.
  kind: choice
  options:
    - Каждый масштаб выбирает векторы из одного и того же обученного набора, но размещает их на сетке своего разрешения
    - Каждый масштаб обучает собственный словарь, а общими остаются только индексы векторов
    - Кодовая книга используется лишь на самом подробном масштабе, а грубые масштабы хранят непрерывные признаки
    - Один выбранный вектор автоматически копируется во все позиции и масштабы
