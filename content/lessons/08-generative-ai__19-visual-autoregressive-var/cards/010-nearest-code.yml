- concept: квантование выбирает элемент codebook с минимальным расстоянием до входного вектора
  question: Для скрытого вектора расстояние до элемента C меньше, чем до элементов A, B и D. Какой элемент выберет квантователь ближайшего соседа?
  explanation: Квантователь выбирает элемент codebook, минимизирующий расстояние до входного вектора. Поэтому будет выбран элемент C.
  kind: choice
  options:
    - Элемент A
    - Элемент B
    - Элемент D
    - Элемент C
  correct: 3
  id: 010-nearest-code-1
  fingerprint: 021493de
- concept: дискретный токен хранит индекс выбранного вектора, а не сам вектор признаков
  question: Заполни пропуск в псевдокоде квантования одной ячейки.
  explanation: В сетку токенов записывается целочисленный индекс. Сам вектор признаков позднее получают по этому индексу через обращение к codebook.
  kind: cloze
  template: token_grid[u, v] = ___
  answer: index_of_nearest_codebook_vector
  accept:
    - argmin_index
    - индекс ближайшего вектора codebook
    - индекс ближайшего элемента кодовой книги
  id: 010-nearest-code-2
  fingerprint: c84dfadb
- concept: квантование вносит ошибку приближения при замене непрерывного вектора элементом конечного codebook
  question: Объясни своими словами, почему восстановленный после квантования вектор обычно отличается от исходного и от чего зависит величина этой ошибки.
  explanation: Квантование заменяет произвольный непрерывный вектор ближайшим доступным представителем конечного словаря. Точное восстановление возможно лишь при совпадении с элементом codebook; качество обучения и покрытие пространства определяют потерю точности.
  kind: open
  reference: Квантователь может выбирать только из конечного набора векторов codebook. Если исходный вектор не совпадает с выбранным элементом точно, возникает ошибка, равная расстоянию между ними. Чем лучше codebook покрывает распределение скрытых векторов, тем меньше типичная ошибка.
  id: 010-nearest-code-3
  fingerprint: 64be9f47
