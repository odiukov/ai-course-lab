<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fb;
      --surface: #ffffff;
      --surface-soft: #f1f4f8;
      --ink: #172033;
      --muted: #657087;
      --grid: #cbd3df;
      --accent: #315fca;
      --accent-soft: #e8efff;
      --good: #25784a;
      --good-soft: #e5f5eb;
      --danger: #bd3043;
      --danger-soft: #fde9ec;
      --neutral-soft: #edf1f6;
      --shadow: #dce2eb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111722;
        --surface: #192231;
        --surface-soft: #202b3b;
        --ink: #f1f4f9;
        --muted: #aeb9ca;
        --grid: #435066;
        --accent: #8eafff;
        --accent-soft: #25375f;
        --good: #82d5a5;
        --good-soft: #1d3d2f;
        --danger: #ff91a0;
        --danger-soft: #4d2630;
        --neutral-soft: #283343;
        --shadow: #0c111a;
      }
    }

    html,
    body {
      background: var(--bg);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .heading {
      fill: var(--ink);
      font-size: 24px;
      font-weight: bold;
    }

    .eyebrow {
      fill: var(--muted);
      font-size: 13px;
      font-weight: bold;
    }

    .header-cell {
      fill: var(--surface-soft);
      stroke: var(--grid);
      stroke-width: 1.5px;
    }

    .header-text {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
    }

    .cell {
      stroke: var(--grid);
      stroke-width: 1.5px;
    }

    .cell-neutral {
      fill: var(--neutral-soft);
    }

    .cell-good {
      fill: var(--good-soft);
    }

    .cell-danger {
      fill: var(--danger-soft);
    }

    .cell-code {
      fill: var(--muted);
      font-size: 14px;
      font-weight: bold;
    }

    .cell-value {
      fill: var(--ink);
      font-size: 25px;
      font-weight: bold;
    }

    .cell-note {
      fill: var(--muted);
      font-size: 13px;
    }

    .danger-text {
      fill: var(--danger);
    }

    .good-text {
      fill: var(--good);
    }

    .panel {
      fill: var(--surface);
      stroke: var(--grid);
      stroke-width: 1.5px;
    }

    .metric-divider {
      stroke: var(--grid);
      stroke-width: 1.5px;
    }

    .metric-name {
      fill: var(--muted);
      font-size: 15px;
      font-weight: bold;
    }

    .metric-value {
      fill: var(--accent);
      font-size: 38px;
      font-weight: bold;
    }

    .metric-value-danger {
      fill: var(--danger);
      font-size: 38px;
      font-weight: bold;
    }

    .formula {
      fill: var(--ink);
      font-size: 14px;
    }

    .explanation {
      fill: var(--muted);
      font-size: 13px;
    }

    .summary-panel {
      fill: var(--surface);
      stroke: var(--grid);
      stroke-width: 1.5px;
    }

    .summary-divider {
      stroke: var(--grid);
      stroke-width: 1.5px;
    }

    .summary-number {
      fill: var(--ink);
      font-size: 20px;
      font-weight: bold;
    }

    .summary-label {
      fill: var(--muted);
      font-size: 13px;
    }

    .model-label {
      fill: var(--accent);
      font-size: 14px;
      font-weight: bold;
    }

    .model-box {
      fill: var(--accent-soft);
      stroke: var(--accent);
      stroke-width: 1.5px;
    }

    .fallback {
      fill: var(--danger);
      font-size: 18px;
      font-weight: bold;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <svg
    id="diagram"
    class="canvas"
    viewBox="0 0 1200 470"
    width="1200"
    height="470"
    preserveAspectRatio="xMidYMid meet"
    role="img"
    aria-labelledby="svg-title svg-description"
  >
    <title id="svg-title">99% accuracy без единого найденного случая</title>
    <desc id="svg-description">
      Матрица ошибок для тысячи объектов: TP — ноль, FN — десять,
      FP — ноль, TN — девятьсот девяносто. Accuracy равна девяноста
      девяти процентам, а recall — нулю процентов.
    </desc>

    <text id="static-heading" class="heading">
      99% accuracy — и ни одного найденного случая
    </text>

    <g id="drawing"></g>

    <g id="fallback" class="hidden">
      <text id="fallback-text" class="fallback">
        Схема: TP=0, FN=10, FP=0, TN=990; accuracy=99%, recall=0%.
      </text>
    </g>
  </svg>

  <script>
    "use strict";

    const data = Object.freeze([{
      heading: { x: 3, y: 3.2 },
      matrixLabel: { x: 3, y: 6.3, text: "МАТРИЦА ОШИБОК · 1000 ОБЪЕКТОВ" },
      metricLabel: { x: 80, y: 6.3, text: "ДВА ЧЕСТНЫХ РЕЗУЛЬТАТА" },

      matrix: {
        x: [3, 26, 50, 74],
        y: [8, 14.5, 24.5, 34.5],
        radius: 0.8,
        headers: [
          { x: 14.5, y: 11.25, text: "Фактический класс" },
          { x: 38, y: 11.25, text: "Предсказано: брак" },
          { x: 62, y: 11.25, text: "Предсказано: исправна" }
        ],
        rows: [
          { x: 14.5, y: 19.5, text: "Фактически: брак" },
          { x: 14.5, y: 29.5, text: "Фактически: исправна" }
        ],
        cells: [
          {
            bounds: [26, 14.5, 50, 24.5],
            className: "cell cell-neutral",
            x: 38,
            codeY: 17,
            valueY: 20,
            noteY: 22.5,
            code: "TP",
            value: "0",
            note: "брак найден"
          },
          {
            bounds: [50, 14.5, 74, 24.5],
            className: "cell cell-danger",
            x: 62,
            codeY: 17,
            valueY: 20,
            noteY: 22.5,
            code: "FN",
            value: "10",
            note: "весь брак пропущен",
            emphasis: "danger-text"
          },
          {
            bounds: [26, 24.5, 50, 34.5],
            className: "cell cell-neutral",
            x: 38,
            codeY: 27,
            valueY: 30,
            noteY: 32.5,
            code: "FP",
            value: "0",
            note: "ложных тревог"
          },
          {
            bounds: [50, 24.5, 74, 34.5],
            className: "cell cell-good",
            x: 62,
            codeY: 27,
            valueY: 30,
            noteY: 32.5,
            code: "TN",
            value: "990",
            note: "исправные распознаны",
            emphasis: "good-text"
          }
        ]
      },

      metrics: {
        bounds: [80, 8, 117, 34.5],
        radius: 1,
        divider: [80, 21.25, 117, 21.25],
        accuracy: {
          name: { x: 83, y: 11, text: "ACCURACY · ПО ВСЕЙ ПАРТИИ" },
          value: { x: 83, y: 15.3, text: "99%", anchor: "start" },
          formula: { x: 114, y: 14.2, text: "(0 + 990) / 1000", anchor: "end" },
          explanation: { x: 114, y: 17.2, text: "990 верных ответов из 1000", anchor: "end" }
        },
        recall: {
          name: { x: 83, y: 24.25, text: "RECALL · ТОЛЬКО СРЕДИ БРАКА" },
          value: { x: 83, y: 28.55, text: "0%", anchor: "start" },
          formula: { x: 114, y: 27.45, text: "0 / 10", anchor: "end" },
          explanation: { x: 114, y: 30.45, text: "0 найденных из 10 бракованных", anchor: "end" }
        }
      },

      summary: {
        label: { x: 3, y: 37.1, text: "ЧТО СДЕЛАЛА МОДЕЛЬ" },
        bounds: [3, 38.5, 117, 45],
        radius: 1,
        dividers: [
          [33, 38.5, 33, 45],
          [75, 38.5, 75, 45]
        ],
        modelBox: [5, 40, 31, 43.5],
        model: { x: 18, y: 41.75, text: "ВСЕГДА: «ИСПРАВНА»" },
        correctNumber: { x: 38, y: 41.1, text: "990 из 1000" },
        correctLabel: { x: 38, y: 43.2, text: "верно по всей партии" },
        missedNumber: { x: 80, y: 41.1, text: "0 из 10" },
        missedLabel: { x: 80, y: 43.2, text: "найдено среди брака" }
      },

      fallback: { x: 3, y: 12 }
    }]);

    const origin = Object.freeze({ x: 0, y: 0 });
    const scale = Object.freeze({ x: 10, y: 10 });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const [scheme] = data;

    try {
      const namespace = "http://www.w3.org/2000/svg";
      const drawing = document.getElementById("drawing");
      const heading = document.getElementById("static-heading");
      const fallback = document.getElementById("fallback");

      const make = (tag, attributes, className, parent = drawing) => {
        const node = document.createElementNS(namespace, tag);
        for (const [name, value] of Object.entries(attributes)) {
          node.setAttribute(name, String(value));
        }
        if (className) node.setAttribute("class", className);
        parent.appendChild(node);
        return node;
      };

      const rectangle = (bounds, className, radius) => {
        const [x1, y1, x2, y2] = bounds;
        return make("rect", {
          x: sx(x1),
          y: sy(y1),
          width: sx(x2) - sx(x1),
          height: sy(y2) - sy(y1),
          rx: sx(radius) - sx(origin.x),
          ry: sy(radius) - sy(origin.y)
        }, className);
      };

      const segment = points => {
        const [x1, y1, x2, y2] = points;
        return make("line", {
          x1: sx(x1),
          y1: sy(y1),
          x2: sx(x2),
          y2: sy(y2)
        }, "summary-divider");
      };

      const label = (item, className, anchor = "middle") => {
        const node = make("text", {
          x: sx(item.x),
          y: sy(item.y),
          "text-anchor": item.anchor || anchor,
          "dominant-baseline": "middle"
        }, className);
        node.textContent = item.text;
        return node;
      };

      heading.setAttribute("x", String(sx(scheme.heading.x)));
      heading.setAttribute("y", String(sy(scheme.heading.y)));
      heading.setAttribute("text-anchor", "start");
      heading.setAttribute("dominant-baseline", "middle");

      label(scheme.matrixLabel, "eyebrow", "start");
      label(scheme.metricLabel, "eyebrow", "start");

      const matrix = scheme.matrix;
      const [mx1, mx2, mx3, mx4] = matrix.x;
      const [my1, my2, my3, my4] = matrix.y;

      rectangle([mx1, my1, mx2, my2], "header-cell", matrix.radius);
      rectangle([mx2, my1, mx3, my2], "header-cell", matrix.radius);
      rectangle([mx3, my1, mx4, my2], "header-cell", matrix.radius);
      rectangle([mx1, my2, mx2, my3], "header-cell", matrix.radius);
      rectangle([mx1, my3, mx2, my4], "header-cell", matrix.radius);

      for (const item of matrix.headers) label(item, "header-text");
      for (const item of matrix.rows) label(item, "header-text");

      for (const cell of matrix.cells) {
        rectangle(cell.bounds, cell.className, matrix.radius);

        label(
          { x: cell.x, y: cell.codeY, text: cell.code },
          cell.emphasis ? "cell-code " + cell.emphasis : "cell-code"
        );

        label(
          { x: cell.x, y: cell.valueY, text: cell.value },
          cell.emphasis ? "cell-value " + cell.emphasis : "cell-value"
        );

        label(
          { x: cell.x, y: cell.noteY, text: cell.note },
          cell.emphasis ? "cell-note " + cell.emphasis : "cell-note"
        );
      }

      const metrics = scheme.metrics;
      rectangle(metrics.bounds, "panel", metrics.radius);

      const [dx1, dy1, dx2, dy2] = metrics.divider;
      make("line", {
        x1: sx(dx1),
        y1: sy(dy1),
        x2: sx(dx2),
        y2: sy(dy2)
      }, "metric-divider");

      label(metrics.accuracy.name, "metric-name", "start");
      label(metrics.accuracy.value, "metric-value", "start");
      label(metrics.accuracy.formula, "formula", "end");
      label(metrics.accuracy.explanation, "explanation", "end");

      label(metrics.recall.name, "metric-name", "start");
      label(metrics.recall.value, "metric-value-danger", "start");
      label(metrics.recall.formula, "formula", "end");
      label(metrics.recall.explanation, "explanation danger-text", "end");

      const summary = scheme.summary;
      label(summary.label, "eyebrow", "start");
      rectangle(summary.bounds, "summary-panel", summary.radius);

      for (const divider of summary.dividers) segment(divider);

      rectangle(summary.modelBox, "model-box", summary.radius);
      label(summary.model, "model-label");
      label(summary.correctNumber, "summary-number good-text", "start");
      label(summary.correctLabel, "summary-label", "start");
      label(summary.missedNumber, "summary-number danger-text", "start");
      label(summary.missedLabel, "summary-label danger-text", "start");

      fallback.classList.add("hidden");
    } catch (error) {
      const drawing = document.getElementById("drawing");
      const fallback = document.getElementById("fallback");
      const fallbackText = document.getElementById("fallback-text");

      if (drawing) drawing.replaceChildren();

      if (fallbackText) {
        fallbackText.setAttribute("x", String(sx(scheme.fallback.x)));
        fallbackText.setAttribute("y", String(sy(scheme.fallback.y)));
        fallbackText.setAttribute("text-anchor", "start");
        fallbackText.setAttribute("dominant-baseline", "middle");
      }

      if (fallback) fallback.classList.remove("hidden");
    }
  </script>
</body>
</html>
