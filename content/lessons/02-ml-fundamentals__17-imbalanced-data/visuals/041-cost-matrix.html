<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Один пропуск против ста ложных тревог</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f4f7fb;
      --surface: #ffffff;
      --surface-soft: #eef3f8;
      --ink: #172033;
      --muted: #59677d;
      --line: #9aa8bb;
      --line-strong: #53647a;
      --zero-fill: #e8edf3;
      --zero-ink: #344054;
      --fp-fill: #fde68a;
      --fp-ink: #713f12;
      --fn-fill: #fecaca;
      --fn-ink: #7f1d1d;
      --result-fill: #dbeafe;
      --result-line: #2563eb;
      --result-ink: #173a70;
      --fallback: #991b1b;
    }

    body {
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .figure {
      max-width: 1120px;
      margin: auto;
    }

    h1 {
      color: var(--ink);
      font-size: 26px;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 420px;
      background: var(--page);
      border: 1px solid var(--line);
      shape-rendering: geometricPrecision;
    }

    .panel {
      fill: var(--surface);
      stroke: var(--line-strong);
      stroke-width: 2px;
    }

    .header-cell,
    .row-cell {
      fill: var(--surface-soft);
      stroke: var(--line);
      stroke-width: 1.5px;
    }

    .cell {
      stroke: var(--line);
      stroke-width: 1.5px;
    }

    .zero-cell {
      fill: var(--zero-fill);
    }

    .fp-cell {
      fill: var(--fp-fill);
    }

    .fn-cell {
      fill: var(--fn-fill);
    }

    .bar-fp {
      fill: var(--fp-fill);
      stroke: var(--fp-ink);
      stroke-width: 2px;
    }

    .bar-fn {
      fill: var(--fn-fill);
      stroke: var(--fn-ink);
      stroke-width: 2px;
    }

    .result-box {
      fill: var(--result-fill);
      stroke: var(--result-line);
      stroke-width: 2px;
    }

    .heading {
      fill: var(--ink);
      font-size: 20px;
      font-weight: bold;
    }

    .column-label,
    .row-label {
      fill: var(--ink);
      font-size: 16px;
      font-weight: bold;
    }

    .value {
      font-size: 25px;
      font-weight: bold;
    }

    .zero-text {
      fill: var(--zero-ink);
    }

    .fp-text {
      fill: var(--fp-ink);
    }

    .fn-text {
      fill: var(--fn-ink);
    }

    .caption {
      fill: var(--muted);
      font-size: 15px;
    }

    .bar-main {
      fill: var(--ink);
      font-size: 20px;
      font-weight: bold;
    }

    .bar-total {
      fill: var(--ink);
      font-size: 18px;
      font-weight: bold;
    }

    .equal-sign {
      fill: var(--line-strong);
      font-size: 24px;
      font-weight: bold;
    }

    .panel-note {
      fill: var(--muted);
      font-size: 16px;
    }

    .result-main {
      fill: var(--result-ink);
      font-size: 24px;
      font-weight: bold;
    }

    .result-sub {
      fill: var(--result-ink);
      font-size: 19px;
      font-weight: bold;
    }

    .fallback {
      fill: var(--fallback);
      font-size: 18px;
      font-weight: bold;
    }

    text {
      dominant-baseline: middle;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --page: #101722;
        --surface: #172130;
        --surface-soft: #202c3c;
        --ink: #eef4ff;
        --muted: #b6c2d3;
        --line: #526176;
        --line-strong: #8d9db2;
        --zero-fill: #2b3747;
        --zero-ink: #e0e7f0;
        --fp-fill: #6b4d0c;
        --fp-ink: #ffe29a;
        --fn-fill: #68282d;
        --fn-ink: #ffd0d0;
        --result-fill: #18365f;
        --result-line: #75a9ff;
        --result-ink: #e2edff;
        --fallback: #ffb4b4;
      }
    }
  </style>
</head>
<body>
  <main class="figure">
    <h1>Один пропуск против ста ложных тревог</h1>

    <svg
      id="diagram"
      viewBox="0 0 1120 420"
      width="1120"
      height="420"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-desc"
    >
      <title id="svg-title">Матрица стоимости ошибок</title>
      <desc id="svg-desc">
        Матрица стоимости и две равные полосы итоговых издержек.
      </desc>
    </svg>
  </main>

  <script>
    const DATA = [
      {
        kind: "config",
        fallback: {
          x: 560,
          y: 210,
          label: "Схема должна показать: 100 ложных тревог стоят как 1 пропуск."
        }
      },

      { kind: "rect", x1: 28, y1: 18, x2: 598, y2: 307, className: "panel" },
      { kind: "rect", x1: 622, y1: 18, x2: 1092, y2: 307, className: "panel" },

      { kind: "rect", x1: 190, y1: 62, x2: 380, y2: 105, className: "header-cell" },
      { kind: "rect", x1: 380, y1: 62, x2: 570, y2: 105, className: "header-cell" },
      { kind: "rect", x1: 50, y1: 105, x2: 190, y2: 192, className: "row-cell" },
      { kind: "rect", x1: 50, y1: 192, x2: 190, y2: 279, className: "row-cell" },

      { kind: "rect", x1: 190, y1: 105, x2: 380, y2: 192, className: "cell zero-cell" },
      { kind: "rect", x1: 380, y1: 105, x2: 570, y2: 192, className: "cell fn-cell" },
      { kind: "rect", x1: 190, y1: 192, x2: 380, y2: 279, className: "cell fp-cell" },
      { kind: "rect", x1: 380, y1: 192, x2: 570, y2: 279, className: "cell zero-cell" },

      { kind: "rect", x1: 650, y1: 78, x2: 1064, y2: 148, className: "bar-fp" },
      { kind: "rect", x1: 650, y1: 182, x2: 1064, y2: 252, className: "bar-fn" },

      { kind: "rect", x1: 28, y1: 328, x2: 1092, y2: 404, className: "result-box" },

      {
        kind: "text",
        x: 313,
        y: 43,
        label: "Матрица стоимости",
        anchor: "middle",
        className: "heading"
      },
      {
        kind: "text",
        x: 285,
        y: 84,
        label: "Предсказан «+»",
        anchor: "middle",
        className: "column-label"
      },
      {
        kind: "text",
        x: 475,
        y: 84,
        label: "Предсказан «−»",
        anchor: "middle",
        className: "column-label"
      },

      {
        kind: "text",
        x: 176,
        y: 137,
        label: "Факт:",
        anchor: "end",
        className: "row-label"
      },
      {
        kind: "text",
        x: 176,
        y: 161,
        label: "мошенничество",
        anchor: "end",
        className: "row-label"
      },
      {
        kind: "text",
        x: 176,
        y: 224,
        label: "Факт:",
        anchor: "end",
        className: "row-label"
      },
      {
        kind: "text",
        x: 176,
        y: 248,
        label: "обычный платёж",
        anchor: "end",
        className: "row-label"
      },

      {
        kind: "text",
        x: 285,
        y: 139,
        label: "TP = 0",
        anchor: "middle",
        className: "value zero-text"
      },
      {
        kind: "text",
        x: 285,
        y: 169,
        label: "верное решение",
        anchor: "middle",
        className: "caption"
      },
      {
        kind: "text",
        x: 475,
        y: 139,
        label: "FN = 100",
        anchor: "middle",
        className: "value fn-text"
      },
      {
        kind: "text",
        x: 475,
        y: 169,
        label: "пропуск",
        anchor: "middle",
        className: "caption fn-text"
      },
      {
        kind: "text",
        x: 285,
        y: 226,
        label: "FP = 1",
        anchor: "middle",
        className: "value fp-text"
      },
      {
        kind: "text",
        x: 285,
        y: 256,
        label: "ложная тревога",
        anchor: "middle",
        className: "caption fp-text"
      },
      {
        kind: "text",
        x: 475,
        y: 226,
        label: "TN = 0",
        anchor: "middle",
        className: "value zero-text"
      },
      {
        kind: "text",
        x: 475,
        y: 256,
        label: "верное решение",
        anchor: "middle",
        className: "caption"
      },

      {
        kind: "text",
        x: 857,
        y: 43,
        label: "Одинаковая итоговая цена",
        anchor: "middle",
        className: "heading"
      },
      {
        kind: "text",
        x: 672,
        y: 104,
        label: "100 ложных тревог × 1",
        anchor: "start",
        className: "bar-main"
      },
      {
        kind: "text",
        x: 1042,
        y: 132,
        label: "итого 100",
        anchor: "end",
        className: "bar-total"
      },
      {
        kind: "text",
        x: 857,
        y: 165,
        label: "=",
        anchor: "middle",
        className: "equal-sign"
      },
      {
        kind: "text",
        x: 672,
        y: 208,
        label: "1 пропуск × 100",
        anchor: "start",
        className: "bar-main"
      },
      {
        kind: "text",
        x: 1042,
        y: 236,
        label: "итого 100",
        anchor: "end",
        className: "bar-total"
      },
      {
        kind: "text",
        x: 857,
        y: 281,
        label: "Равная длина полос — равная суммарная стоимость",
        anchor: "middle",
        className: "panel-note"
      },

      {
        kind: "text",
        x: 560,
        y: 354,
        label: "100 ложных тревог стоят как 1 пропуск",
        anchor: "middle",
        className: "result-main"
      },
      {
        kind: "text",
        x: 560,
        y: 383,
        label: "100 × 1 = 1 × 100 = 100",
        anchor: "middle",
        className: "result-sub"
      }
    ];

    const origin = { x: 0, y: 0 };
    const scale = 1;
    const sx = x => origin.x + x * scale;
    const sy = y => origin.y + y * scale;

    const svg = document.getElementById("diagram");
    const config = DATA.find(item => item.kind === "config");

    try {
      const layer = document.createElementNS(svg.namespaceURI, "g");
      layer.setAttribute("class", "runtime");
      svg.appendChild(layer);

      const makeRect = item => {
        const node = document.createElementNS(svg.namespaceURI, "rect");
        node.setAttribute("x", sx(item.x1));
        node.setAttribute("y", sy(item.y1));
        node.setAttribute("width", sx(item.x2) - sx(item.x1));
        node.setAttribute("height", sy(item.y2) - sy(item.y1));
        node.setAttribute("class", item.className);
        return node;
      };

      const makeLine = item => {
        const node = document.createElementNS(svg.namespaceURI, "line");
        node.setAttribute("x1", sx(item.x1));
        node.setAttribute("y1", sy(item.y1));
        node.setAttribute("x2", sx(item.x2));
        node.setAttribute("y2", sy(item.y2));
        node.setAttribute("class", item.className);
        return node;
      };

      const makeText = item => {
        const node = document.createElementNS(svg.namespaceURI, "text");
        node.setAttribute("x", sx(item.x));
        node.setAttribute("y", sy(item.y));
        node.setAttribute("text-anchor", item.anchor);
        node.setAttribute("class", item.className);
        node.textContent = item.label;
        return node;
      };

      const makers = new Map([
        ["rect", makeRect],
        ["line", makeLine],
        ["text", makeText]
      ]);

      for (const item of DATA) {
        const maker = makers.get(item.kind);
        if (maker) {
          layer.appendChild(maker(item));
        }
      }
    } catch (error) {
      const runtime = svg.querySelector(".runtime");
      if (runtime) {
        runtime.remove();
      }

      const message = document.createElementNS(svg.namespaceURI, "text");
      message.setAttribute("x", sx(config.fallback.x));
      message.setAttribute("y", sy(config.fallback.y));
      message.setAttribute("text-anchor", "middle");
      message.setAttribute("class", "fallback");
      message.textContent = config.fallback.label;
      svg.appendChild(message);
    }
  </script>
</body>
</html>
