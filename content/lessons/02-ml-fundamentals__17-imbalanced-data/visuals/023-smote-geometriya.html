<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Синтетическая точка на отрезке между соседями</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f9fc;
      --surface: #ffffff;
      --surface-soft: #f0f5fb;
      --text: #172033;
      --muted: #5d687d;
      --axis: #7b879b;
      --grid: #dbe3ee;
      --segment: #4263eb;
      --real: #1d4ed8;
      --real-ring: #bfdbfe;
      --synthetic: #e8590c;
      --synthetic-ring: #ffdcc7;
      --panel-border: #cbd7e6;
      --formula: #243b63;
      --badge: #fff0e6;
      --badge-text: #b33c00;
      --shadow: rgba(23, 32, 51, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-width: 0;
      background: var(--page);
      color: var(--text);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
      padding: 12px;
    }

    figure {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 6px 22px var(--shadow);
    }

    figcaption {
      padding: 14px 18px 10px;
      border-bottom: 1px solid var(--panel-border);
      background: var(--surface);
      font-size: 18px;
      font-weight: 700;
      line-height: 1.3;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 450px;
      background: var(--surface);
    }

    .axis {
      stroke: var(--axis);
      stroke-width: 2;
      stroke-linecap: round;
    }

    .grid {
      stroke: var(--grid);
      stroke-width: 1;
      stroke-dasharray: 4 6;
    }

    .tick {
      stroke: var(--axis);
      stroke-width: 2;
      stroke-linecap: round;
    }

    .tick-label,
    .axis-label {
      fill: var(--muted);
      font-size: 14px;
    }

    .axis-label {
      font-weight: 600;
    }

    .full-segment {
      stroke: var(--segment);
      stroke-width: 5;
      stroke-linecap: round;
      opacity: 0.38;
    }

    .travel {
      stroke: var(--synthetic);
      stroke-width: 4;
      stroke-linecap: round;
    }

    .arrowhead {
      fill: var(--synthetic);
    }

    .real-ring {
      fill: var(--real-ring);
      opacity: 0.72;
    }

    .real-point {
      fill: var(--real);
      stroke: var(--surface);
      stroke-width: 2;
    }

    .synthetic-ring {
      fill: var(--synthetic-ring);
      opacity: 0.88;
    }

    .synthetic-point {
      fill: var(--synthetic);
      stroke: var(--surface);
      stroke-width: 2;
    }

    .point-label {
      fill: var(--text);
      font-size: 16px;
      font-weight: 650;
      paint-order: stroke;
      stroke: var(--surface);
      stroke-width: 5;
      stroke-linejoin: round;
    }

    .synthetic-label {
      fill: var(--synthetic);
      font-weight: 750;
    }

    .travel-label {
      fill: var(--badge-text);
      font-size: 15px;
      font-weight: 700;
      paint-order: stroke;
      stroke: var(--surface);
      stroke-width: 5;
      stroke-linejoin: round;
    }

    .formula-panel {
      fill: var(--surface-soft);
      stroke: var(--panel-border);
      stroke-width: 2;
    }

    .formula-title {
      fill: var(--text);
      font-size: 18px;
      font-weight: 750;
    }

    .formula-line {
      fill: var(--formula);
      font-size: 16px;
    }

    .formula-result {
      fill: var(--synthetic);
      font-size: 18px;
      font-weight: 750;
    }

    .badge {
      fill: var(--badge);
      stroke: var(--synthetic-ring);
      stroke-width: 1;
    }

    .badge-text {
      fill: var(--badge-text);
      font-size: 14px;
      font-weight: 700;
    }

    .note {
      fill: var(--muted);
      font-size: 14px;
    }

    .fallback {
      margin: 16px;
      padding: 14px 16px;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      background: var(--surface-soft);
      color: var(--text);
      font-size: 16px;
      line-height: 1.45;
    }

    noscript {
      display: block;
      padding: 16px;
      color: var(--text);
      background: var(--surface-soft);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111621;
        --surface: #171e2b;
        --surface-soft: #202a3b;
        --text: #edf2fb;
        --muted: #aab6c8;
        --axis: #8694a9;
        --grid: #344156;
        --segment: #7c9cff;
        --real: #75a7ff;
        --real-ring: #294c7a;
        --synthetic: #ff914d;
        --synthetic-ring: #743919;
        --panel-border: #39465b;
        --formula: #d6e3ff;
        --badge: #442717;
        --badge-text: #ffc29d;
        --shadow: rgba(0, 0, 0, 0.28);
      }
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-caption">
    <figcaption id="diagram-caption">
      Синтетическая точка на отрезке между соседями
    </figcaption>

    <svg
      id="diagram"
      viewBox="0 0 920 450"
      width="920"
      height="450"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description"
    >
      <title id="svg-title">Интерполяция между двумя соседними точками</title>
      <desc id="svg-description">
        Точка x new с координатами 1,2 и 2,2 находится на 40 процентах
        пути от x1 с координатами 1,0 и 2,0 к x2 с координатами 1,5 и 2,5.
      </desc>
    </svg>

    <div id="fallback" class="fallback" hidden>
      Схема должна была показать отрезок от x₁ = (1,0; 2,0) до
      x₂ = (1,5; 2,5) и синтетическую точку (1,2; 2,2),
      расположенную на 40% пути от x₁ при t = 0,4.
    </div>

    <noscript>
      Схема должна была показать точку (1,2; 2,2) на 40% пути между
      x₁ = (1,0; 2,0) и x₂ = (1,5; 2,5).
    </noscript>
  </figure>

  <script>
    "use strict";

    const diagramData = [
      {
        id: "x1",
        x: 1.0,
        y: 2.0,
        coordinateLabel: "(1,0; 2,0)",
        label: "x₁ = (1,0; 2,0)"
      },
      {
        id: "new",
        x: 1.2,
        y: 2.2,
        t: 0.4,
        coordinateLabel: "(1,2; 2,2)",
        label: "xₙₑw = (1,2; 2,2)"
      },
      {
        id: "x2",
        x: 1.5,
        y: 2.5,
        coordinateLabel: "(1,5; 2,5)",
        label: "x₂ = (1,5; 2,5)"
      },
      {
        id: "difference",
        x: 0.5,
        y: 0.5,
        coordinateLabel: "(0,5; 0,5)"
      },
      {
        id: "bounds",
        zero: 0,
        one: 1,
        x: 2.0,
        y: 3.0
      }
    ];

    const canvas = Object.freeze({ width: 920, height: 450 });
    const labelPadding = 12;
    const lineThickness = 2;
    const fontSize = 16;
    const origin = Object.freeze({ x: 130, y: 405 });
    const scale = 140;

    const sx = (x) => origin.x + x * scale;
    const sy = (y) => origin.y - y * scale;

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const [x1, xNew, x2, difference, bounds] = diagramData;
      const zero = bounds.zero;
      const one = bounds.one;
      const two = one + one;
      const ns = "http://www.w3.org/2000/svg";

      const make = (name, attributes, parent = svg) => {
        const node = document.createElementNS(ns, name);
        Object.entries(attributes).forEach(([key, value]) => {
          node.setAttribute(key, String(value));
        });
        parent.appendChild(node);
        return node;
      };

      const addText = (text, x, y, className, anchor, parent = svg) => {
        const node = make("text", {
          x: sx(x),
          y: sy(y),
          class: className,
          "text-anchor": anchor,
          "dominant-baseline": "middle"
        }, parent);
        node.textContent = text;
        return node;
      };

      const pxAsData = (pixels) => pixels / scale;
      const tickSize = pxAsData(labelPadding);
      const pointRadius = pxAsData(labelPadding - lineThickness);
      const ringRadius = pxAsData(labelPadding + lineThickness + lineThickness);
      const textStep = pxAsData(fontSize + labelPadding);
      const wideStep = pxAsData(fontSize + labelPadding + lineThickness);
      const xAxisEnd = bounds.x;
      const yAxisEnd = bounds.y;

      const guides = make("g", { "aria-hidden": "true" });
      const xTicks = [x1.x, xNew.x, x2.x];
      const yTicks = [x1.y, xNew.y, x2.y];

      xTicks.forEach((value) => {
        make("line", {
          x1: sx(value),
          y1: sy(zero),
          x2: sx(value),
          y2: sy(yAxisEnd),
          class: "grid"
        }, guides);
      });

      yTicks.forEach((value) => {
        make("line", {
          x1: sx(zero),
          y1: sy(value),
          x2: sx(xAxisEnd),
          y2: sy(value),
          class: "grid"
        }, guides);
      });

      const axes = make("g", { "aria-label": "Координатные оси" });

      make("line", {
        x1: sx(zero),
        y1: sy(zero),
        x2: sx(xAxisEnd),
        y2: sy(zero),
        class: "axis"
      }, axes);

      make("line", {
        x1: sx(zero),
        y1: sy(zero),
        x2: sx(zero),
        y2: sy(yAxisEnd),
        class: "axis"
      }, axes);

      const axisArrow = pxAsData(fontSize);
      const axisWing = pxAsData(labelPadding - lineThickness);

      make("polygon", {
        points: [
          [sx(xAxisEnd), sy(zero)],
          [sx(xAxisEnd - axisArrow), sy(zero + axisWing)],
          [sx(xAxisEnd - axisArrow), sy(zero - axisWing)]
        ].map((point) => point.join(",")).join(" "),
        class: "axis"
      }, axes);

      make("polygon", {
        points: [
          [sx(zero), sy(yAxisEnd)],
          [sx(zero - axisWing), sy(yAxisEnd - axisArrow)],
          [sx(zero + axisWing), sy(yAxisEnd - axisArrow)]
        ].map((point) => point.join(",")).join(" "),
        class: "axis"
      }, axes);

      const xTickLabels = [
        [x1.x, "1,0"],
        [xNew.x, "1,2"],
        [x2.x, "1,5"]
      ];

      xTickLabels.forEach(([value, label]) => {
        make("line", {
          x1: sx(value),
          y1: sy(zero - tickSize),
          x2: sx(value),
          y2: sy(zero + tickSize),
          class: "tick"
        }, axes);

        addText(
          label,
          value,
          zero - pxAsData(labelPadding + fontSize),
          "tick-label",
          "middle",
          axes
        );
      });

      const yTickLabels = [
        [x1.y, "2,0"],
        [xNew.y, "2,2"],
        [x2.y, "2,5"]
      ];

      yTickLabels.forEach(([value, label]) => {
        make("line", {
          x1: sx(zero - tickSize),
          y1: sy(value),
          x2: sx(zero + tickSize),
          y2: sy(value),
          class: "tick"
        }, axes);

        addText(
          label,
          zero - pxAsData(labelPadding + lineThickness),
          value,
          "tick-label",
          "end",
          axes
        );
      });

      addText(
        "признак 1",
        xAxisEnd,
        zero - pxAsData(labelPadding + fontSize + fontSize),
        "axis-label",
        "end",
        axes
      );

      addText(
        "признак 2",
        zero + pxAsData(labelPadding),
        yAxisEnd - pxAsData(labelPadding),
        "axis-label",
        "start",
        axes
      );

      const interpolation = make("g", {
        "aria-label": "Отрезок интерполяции"
      });

      make("line", {
        x1: sx(x1.x),
        y1: sy(x1.y),
        x2: sx(x2.x),
        y2: sy(x2.y),
        class: "full-segment"
      }, interpolation);

      make("line", {
        x1: sx(x1.x),
        y1: sy(x1.y),
        x2: sx(xNew.x),
        y2: sy(xNew.y),
        class: "travel"
      }, interpolation);

      const dx = xNew.x - x1.x;
      const dy = xNew.y - x1.y;
      const length = Math.hypot(dx, dy);
      const ux = dx / length;
      const uy = dy / length;
      const arrowLength = pxAsData(fontSize + labelPadding);
      const arrowWidth = pxAsData(labelPadding);
      const baseX = xNew.x - ux * arrowLength;
      const baseY = xNew.y - uy * arrowLength;
      const perpendicularX = -uy;
      const perpendicularY = ux;

      make("polygon", {
        points: [
          [sx(xNew.x), sy(xNew.y)],
          [
            sx(baseX + perpendicularX * arrowWidth),
            sy(baseY + perpendicularY * arrowWidth)
          ],
          [
            sx(baseX - perpendicularX * arrowWidth),
            sy(baseY - perpendicularY * arrowWidth)
          ]
        ].map((point) => point.join(",")).join(" "),
        class: "arrowhead"
      }, interpolation);

      const travelMidX = x1.x + dx * xNew.t / (one - xNew.t);
      const travelMidY = x1.y + dy * xNew.t / (one - xNew.t);

      addText(
        "t = 0,4 — 40% пути",
        travelMidX,
        travelMidY - wideStep - textStep,
        "travel-label",
        "middle",
        interpolation
      );

      const drawPoint = (point, synthetic) => {
        const group = make("g", {
          "aria-label": point.label
        });

        make("circle", {
          cx: sx(point.x),
          cy: sy(point.y),
          r: sx(ringRadius) - sx(zero),
          class: synthetic ? "synthetic-ring" : "real-ring"
        }, group);

        make("circle", {
          cx: sx(point.x),
          cy: sy(point.y),
          r: sx(pointRadius) - sx(zero),
          class: synthetic ? "synthetic-point" : "real-point"
        }, group);

        return group;
      };

      drawPoint(x1, false);
      drawPoint(x2, false);
      drawPoint(xNew, true);

      addText(
        x1.label,
        x1.x - pxAsData(labelPadding),
        x1.y - textStep,
        "point-label",
        "end"
      );

      addText(
        x2.label,
        x2.x + pxAsData(labelPadding),
        x2.y + pxAsData(labelPadding + lineThickness),
        "point-label",
        "start"
      );

      addText(
        xNew.label,
        xNew.x + pxAsData(labelPadding),
        xNew.y - textStep,
        "point-label synthetic-label",
        "start"
      );

      const panelLeft = bounds.x + difference.x;
      const panelRight = (canvas.width - origin.x - labelPadding) / scale;
      const panelTop = bounds.y - pxAsData(labelPadding);
      const panelBottom = xNew.t / two;
      const panelTextX = panelLeft + pxAsData(labelPadding + lineThickness);
      const panelRadius = pxAsData(labelPadding);

      const panel = make("g", {
        "aria-label": "Расчёт синтетической точки"
      });

      make("rect", {
        x: sx(panelLeft),
        y: sy(panelTop),
        width: sx(panelRight) - sx(panelLeft),
        height: sy(panelBottom) - sy(panelTop),
        rx: sx(panelRadius) - sx(zero),
        ry: sy(zero) - sy(panelRadius),
        class: "formula-panel"
      }, panel);

      let cursor = panelTop - wideStep;

      addText(
        "Как получена новая точка",
        panelTextX,
        cursor,
        "formula-title",
        "start",
        panel
      );

      cursor -= wideStep;
      addText(
        "xₙₑw = x₁ + t · (x₂ − x₁)",
        panelTextX,
        cursor,
        "formula-line",
        "start",
        panel
      );

      cursor -= wideStep;
      addText(
        "x₂ − x₁ = (0,5; 0,5)",
        panelTextX,
        cursor,
        "formula-line",
        "start",
        panel
      );

      cursor -= wideStep;
      addText(
        "t = 0,4",
        panelTextX,
        cursor,
        "formula-line",
        "start",
        panel
      );

      cursor -= wideStep;
      addText(
        "(1,0; 2,0) + 0,4 · (0,5; 0,5)",
        panelTextX,
        cursor,
        "formula-line",
        "start",
        panel
      );

      cursor -= wideStep;
      addText(
        "= (1,2; 2,2)",
        panelTextX,
        cursor,
        "formula-result",
        "start",
        panel
      );

      cursor -= wideStep;

      const badgeLeft = panelTextX;
      const badgeRight = badgeLeft + difference.x + xNew.t;
      const badgeTop = cursor + pxAsData(labelPadding);
      const badgeBottom = cursor - wideStep;

      make("rect", {
        x: sx(badgeLeft),
        y: sy(badgeTop),
        width: sx(badgeRight) - sx(badgeLeft),
        height: sy(badgeBottom) - sy(badgeTop),
        rx: sx(panelRadius) - sx(zero),
        ry: sy(zero) - sy(panelRadius),
        class: "badge"
      }, panel);

      addText(
        "интерполяция",
        (badgeLeft + badgeRight) / two,
        (badgeTop + badgeBottom) / two,
        "badge-text",
        "middle",
        panel
      );

      addText(
        "Новая точка остаётся на отрезке",
        panelTextX,
        panelBottom + textStep,
        "note",
        "start",
        panel
      );

      fallback.hidden = true;
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");

      if (svg) {
        svg.hidden = true;
      }

      if (fallback) {
        fallback.hidden = false;
      }
    }
  </script>
</body>
</html>
