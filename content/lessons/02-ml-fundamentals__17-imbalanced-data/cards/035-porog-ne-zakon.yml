- concept: порог решения выбирают по целевой метрике на валидационной выборке
  question: Расположите этапы настройки порога классификатора в правильном порядке.
  explanation: Порог настраивают после обучения по неизменённым оценкам модели. Кандидаты сравнивают на валидационных данных, а в работу берут порог, который лучше всего оптимизирует выбранную метрику.
  kind: order
  items:
    - Обучить модель на обучающей выборке
    - Получить оценки положительного класса на валидационной выборке
    - Перебрать возможные пороги и преобразовать оценки в метки
    - Вычислить целевую метрику для каждого порога
    - Выбрать порог с лучшим значением метрики
