- concept: высокий MCC требует правильной классификации обоих классов
  question: В каком случае бинарный классификатор получит высокий положительный MCC?
  explanation: MCC учитывает все четыре элемента confusion matrix. Высокая оценка возможна, только когда модель одновременно хорошо распознаёт положительный и отрицательный классы.
  kind: choice
  options:
    - Он находит почти все положительные объекты, но ошибочно помечает положительными большинство отрицательных
    - Он правильно классифицирует большую часть как положительных, так и отрицательных объектов
    - Он почти всегда выбирает многочисленный отрицательный класс
    - Он систематически принимает положительные объекты за отрицательные и наоборот
  correct: 1
  id: 014-mcc-balans-1
  fingerprint: d4cd5c33
- concept: вычисление MCC по четырём элементам confusion matrix
  question: У классификатора TP = 24, TN = 630, FP = 70 и FN = 6. Чему равен MCC с округлением до сотых?
  explanation: Числитель равен 24 × 630 − 70 × 6 = 14700. Знаменатель равен √((24 + 70)(24 + 6)(630 + 70)(630 + 6)). Поэтому MCC ≈ 0,415, то есть после округления 0,41.
  kind: numeric
  answer: 0.41
  tolerance: 0.01
  id: 014-mcc-balans-2
  fingerprint: 71f4f89a
- concept: отрицательный MCC указывает на систематически перевёрнутую классификацию
  question: Объясни своими словами, что устойчиво отрицательное значение MCC говорит о предсказаниях бинарного классификатора.
  explanation: В числителе MCC произведение правильных решений TP × TN сравнивается с произведением ошибок FP × FN. Когда сочетание ошибок преобладает, MCC становится отрицательным, что указывает на обратную связь предсказаний с истинными метками.
  kind: open
  reference: 'Предсказания согласованы с истинными классами хуже случайного или постоянного ответа и имеют обратную направленность: модель систематически относит объекты к противоположным классам. Если поменять её метки местами, качество различения может стать положительным.'
  id: 014-mcc-balans-3
  fingerprint: 4873d795
