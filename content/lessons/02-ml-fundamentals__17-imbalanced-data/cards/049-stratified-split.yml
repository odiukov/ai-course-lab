- concept: стратифицированное разделение сохраняет приблизительную долю каждого класса в выборках
  question: Какой результат отличает стратифицированное разделение данных от обычного случайного разделения?
  explanation: Стратификация распределяет объекты с учётом их меток и сохраняет соотношение классов. Она не балансирует классы и не создаёт новые наблюдения.
  kind: choice
  options:
    - В каждой полученной выборке сохраняются примерно те же доли классов, что и в исходных данных
    - Численность редкого класса становится равна численности класса большинства
    - Во все полученные выборки добавляются синтетические объекты редкого класса
    - Объекты каждого класса располагаются подряд без перемешивания
  correct: 0
  id: 049-stratified-split-1
  fingerprint: 012a5816
- concept: при последовательном разделении стратификация применяется заново по меткам оставшейся выборки
  question: Заполни пропуск во втором разделении данных на train, validation и test.
  explanation: Второй вызов делит только оставшиеся объекты, поэтому для стратификации нужны соответствующие им метки y_rest. Исходный массив y уже не совпадает с разделяемой выборкой.
  kind: cloze
  template: |-
    X_rest, X_test, y_rest, y_test = train_test_split(X, y, stratify=y)
    X_train, X_val, y_train, y_val = train_test_split(X_rest, y_rest, stratify=___)
  answer: y_rest
  accept:
    - y_rest
  id: 049-stratified-split-2
  fingerprint: c9d38f0e
- concept: малое абсолютное число редких объектов повышает нестабильность оценки качества
  question: Почему validation с очень малым числом объектов редкого класса может ненадёжно сравнивать модели, даже если разделение выполнено случайно и без утечки данных?
  explanation: Чем меньше фактически положительных примеров, тем больший вклад в итоговую метрику вносит каждый из них. Стратификация снижает риск случайно получить выборку почти без редкого класса.
  kind: open
  reference: Каждый отдельный редкий объект заметно влияет на метрики редкого класса, поэтому небольшое изменение числа верных прогнозов вызывает крупный скачок оценки. Из-за высокой случайной вариативности различие метрик может отражать состав validation, а не устойчивое преимущество модели.
  id: 049-stratified-split-3
  fingerprint: 78acdd57
