- concept: четыре счётчика confusion matrix образуют полное непересекающееся разбиение наблюдений
  question: Почему сумма tp, tn, fp и fn должна совпадать с количеством классифицированных объектов?
  explanation: Для бинарной классификации возможны только четыре сочетания фактического и предсказанного классов. Если сумма счётчиков не равна размеру выборки, некоторые объекты потеряны или учтены несколько раз.
  kind: open
  reference: Каждый объект имеет фактический и предсказанный класс, поэтому попадает ровно в одну из четырёх взаимно исключающих категорий. Вместе эти категории охватывают все возможные сочетания меток.
  id: 006-code-confusion-counts-2
  fingerprint: 2f02d793
