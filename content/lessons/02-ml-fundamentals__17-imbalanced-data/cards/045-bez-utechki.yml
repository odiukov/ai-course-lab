- concept: resampling выполняют после разделения данных и применяют только к обучающей выборке
  question: Расположите этапы построения классификатора с resampling в правильном порядке.
  explanation: Сначала отделяют проверочные наблюдения, а уже затем изменяют состав train. Так данные, используемые для оценки, не влияют на обучение.
  kind: order
  items:
    - Разделить исходные несбалансированные данные на обучающую и проверочные выборки
    - Выполнить resampling только обучающей выборки
    - Обучить модель на изменённой обучающей выборке
    - Оценить модель на нетронутых проверочных данных
  id: 045-bez-utechki-1
  fingerprint: 1eebf2f6
- concept: нетронутые validation и test позволяют оценивать модель при реальном распределении классов
  question: Почему validation и test обычно не подвергают oversampling или undersampling?
  explanation: Resampling искусственно меняет распределение классов. Если изменить проверочные выборки, полученные метрики могут не отражать качество модели на данных с реальным дисбалансом.
  kind: choice
  options:
    - Чтобы они сохраняли реальную долю классов и давали репрезентативную оценку качества
    - Чтобы в них обязательно было одинаковое число объектов каждого класса
    - Чтобы модель могла обучаться на validation во время оценки
    - Чтобы полностью исключить редкий класс из проверочных выборок
  correct: 0
