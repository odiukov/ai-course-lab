- concept: SMOTE до разделения данных вызывает утечку информации из проверочных наблюдений
  question: Объясните своими словами, почему применение SMOTE ко всему датасету до его разделения может сделать оценку модели чрезмерно оптимистичной.
  explanation: 'Утечка возможна даже без буквального дублирования строк: синтетическая обучающая точка уже может содержать информацию о геометрии будущих проверочных наблюдений.'
  kind: open
  reference: SMOTE строит синтетические объекты с использованием соседей редкого класса. Если выполнить его до разделения, при создании обучающих объектов могут использоваться наблюдения, которые затем окажутся в validation или test. Поэтому информация из проверочных данных косвенно попадает в обучение, и оценка перестаёт быть независимой.
  id: 045-bez-utechki-3
  fingerprint: c6019c24
