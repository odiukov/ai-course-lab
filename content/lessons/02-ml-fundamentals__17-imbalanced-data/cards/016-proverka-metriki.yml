- concept: F1 не учитывает true negative и потому не отражает качество на отрицательном классе напрямую
  question: Почему две модели с одинаковыми TP, FP и FN, но разным числом TN получат одинаковый F1?
  explanation: F1 строится из precision и recall, а ни одна из этих величин не содержит TN. Если важно оценивать правильность решений на обоих классах, полезнее рассмотреть MCC.
  kind: open
  reference: В формулу F1 входят только precision и recall, которые зависят от TP, FP и FN. Число TN в вычислении не участвует, поэтому его изменение не меняет F1.
  id: 016-proverka-metriki-2
  fingerprint: cc152408
