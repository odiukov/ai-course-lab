- concept: веса классов усиливают вклад редких наблюдений, но не увеличивают разнообразие редкого класса
  question: Почему при крайне малом числе объектов редкого класса даже очень большой вес этого класса может не решить проблему обобщения?
  explanation: При дисбалансе тяжелее 95/5 редких исходных примеров может быть слишком мало. Большой вес усиливает их ошибки, но не создаёт дополнительной информации, поэтому обычно рассматривают сочетание нескольких вмешательств.
  kind: open
  reference: Вес увеличивает влияние имеющихся редких объектов на функцию потерь, но не добавляет новых положений в пространстве признаков. Модель может сильнее подстроиться под несколько наблюдений, не изучив разнообразие редкого класса.
