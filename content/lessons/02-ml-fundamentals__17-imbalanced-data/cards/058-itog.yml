- concept: MCC интерпретируется как корреляция между предсказанными и истинными метками
  question: Объясни своими словами, что измеряет Matthews Correlation Coefficient.
  explanation: MCC рассматривает предсказания и истинные метки как две бинарные переменные и оценивает их корреляцию. Поэтому метрика характеризует согласованность классификации по обоим классам.
  kind: open
  reference: MCC измеряет корреляцию, или согласованность, между предсказанными и истинными метками с учётом результатов классификации обоих классов.
  id: 058-itog-2
