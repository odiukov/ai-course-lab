- concept: индексы ближайших соседей получают сортировкой кандидатов по возрастанию расстояния
  question: Функция получает точку-запрос, допустимых кандидатов и значение k. Расположи действия для возврата индексов k ближайших кандидатов в правильном порядке.
  explanation: Сортировка должна опираться на расстояния, но результатом функции служат индексы. Поэтому после выбора первых k пар расстояния отбрасываются.
  kind: order
  items:
    - Вычислить расстояние от точки-запроса до каждого кандидата
    - Сохранить индекс каждого кандидата вместе с его расстоянием
    - Отсортировать пары по возрастанию расстояния
    - Оставить первые k пар
    - Извлечь и вернуть индексы из выбранных пар
  id: 025-code-k-nearest-2
  fingerprint: facba059
