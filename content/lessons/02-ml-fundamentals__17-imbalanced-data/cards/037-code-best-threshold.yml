- concept: строгое сравнение при обновлении сохраняет первый порог с максимальной оценкой
  question: Кандидатные пороги перебираются по возрастанию. Несколько порогов получили одинаковое максимальное значение метрики. Победитель обновляется только при `score > best_score`. Какой порог вернёт алгоритм?
  explanation: Равная оценка не удовлетворяет условию `score > best_score`, поэтому уже сохранённый победитель не заменяется. При переборе по возрастанию это будет наименьший порог среди достигших максимума.
  kind: choice
  options:
    - Первый порог, достигший максимума
    - Последний порог, достигший максимума
    - Среднее всех порогов с максимальной оценкой
  correct: 0
  id: 037-code-best-threshold-1
  fingerprint: fc23c5d5
- concept: начальная лучшая оценка ниже диапазона метрики гарантирует выбор хотя бы одного кандидата
  question: Почему перед перебором порогов для неотрицательной метрики `best_score` полезно инициализировать значением строго ниже допустимого диапазона?
  explanation: В реализации используется `-1.0`, тогда как F1, recall и precision неотрицательны. Поэтому алгоритм всегда сохранит реальный порог и не вернёт начальное значение лишь из-за того, что все оценки равны нулю.
  kind: open
  reference: Тогда оценка первого кандидата обязательно окажется больше начального значения и станет текущим максимумом, даже если все пороги дают минимально возможную метрику.
  id: 037-code-best-threshold-2
  fingerprint: 7f7c0623
