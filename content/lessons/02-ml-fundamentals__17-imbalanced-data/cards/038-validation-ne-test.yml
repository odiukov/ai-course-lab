- concept: целевую метрику фиксируют до экспериментов, чтобы не выбирать постфактум наиболее удачное сочетание метрики и порога
  question: Почему метрику для настройки порога следует выбрать до просмотра результатов по разным порогам и метрикам?
  explanation: Постфактум выбранная метрика становится частью поиска по результатам. Даже без изменения модели такой поиск подгоняет решение под случайные особенности доступной выборки.
  kind: open
  reference: Если выбирать и порог, и метрику после просмотра результатов, можно случайно остановиться на самой выгодной комбинации. Это добавляет ещё один уровень подгонки и делает опубликованную оценку чрезмерно оптимистичной. Критерий выбора нужно определить заранее, а независимый test использовать только для финальной проверки зафиксированного решения.
