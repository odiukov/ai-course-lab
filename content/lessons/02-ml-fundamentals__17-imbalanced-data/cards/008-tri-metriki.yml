- concept: F1 вычисляется как гармоническое среднее precision и recall
  question: У классификатора precision равна 0.72, а recall — 0.48. Чему равен F1?
  explanation: Подстановка precision 0.72 и recall 0.48 в формулу гармонического среднего даёт F1 = 0.576. Результат оказывается ближе к меньшей метрике, чем обычное среднее.
  kind: numeric
  answer: 0.576
  tolerance: 0.001
