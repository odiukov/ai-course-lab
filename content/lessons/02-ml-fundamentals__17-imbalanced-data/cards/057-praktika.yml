- concept: сохраняющая порядок калибровка меняет смысл вероятностей, но не ранжирование и AUPRC
  question: Объясни, почему сохраняющий порядок Platt scaling может улучшить калибровку вероятностей, не изменив AUPRC.
  explanation: AUPRC зависит от порядка оценок, а калибровка — от соответствия численных прогнозов наблюдаемым частотам. Поэтому порядок может остаться прежним, хотя сами значения вероятностей станут осмысленнее.
  kind: open
  reference: Platt scaling преобразует сырые оценки в вероятности. Если преобразование монотонно и сохраняет порядок объектов, то при переборе порогов получаются те же ранжированные наборы положительных прогнозов, поэтому precision-recall кривая и AUPRC остаются прежними. При этом численные значения становятся интерпретируемыми как вероятности.
  id: 057-praktika-2
  fingerprint: 7f4ecd05
- concept: balanced bagging усредняет модели, обученные на разных сбалансированных подвыборках большинства
  question: Расположи этапы balanced bagging в правильном порядке.
  explanation: Разные подмножества большинства создают разнообразие моделей, а усреднение уменьшает влияние случайно неудачной выборки. Устойчивость подхода проверяют по среднему качеству и разбросу между запусками.
  kind: order
  items:
    - Сформировать несколько обучающих выборок, включая в каждую весь редкий класс и случайное подмножество большинства
    - Обучить отдельную модель на каждой полученной выборке
    - Получить оценки всех моделей для одних и тех же объектов
    - Усреднить оценки моделей
  id: 057-praktika-3
  fingerprint: c61578c5
