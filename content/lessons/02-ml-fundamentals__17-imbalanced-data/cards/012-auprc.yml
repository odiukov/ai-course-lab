- concept: ожидаемая AUPRC случайного ранжирования равна доле положительного класса
  question: В наборе 9000 объектов, из которых 270 относятся к положительному классу. Какой примерно будет AUPRC у случайного ранжирования?
  explanation: Случайное ранжирование в среднем сохраняет исходную долю положительного класса. Поэтому его AUPRC примерно равна 270 / 9000 = 0.03.
  kind: numeric
  answer: 0.03
  tolerance: 0.001
  id: 012-auprc-1
  fingerprint: 037ceb8f
- concept: качество AUPRC относительно случайного уровня сравнивают с учётом доли положительного класса
  question: На наборе A доля положительного класса равна 4%, а AUPRC модели — 16%. На наборе B доля положительного класса равна 12%, а AUPRC — 30%. Какая модель сильнее превосходит случайное ранжирование относительно своего базового уровня?
  explanation: Для набора A отношение AUPRC к случайному уровню равно 16 / 4 = 4. Для набора B оно равно 30 / 12 = 2.5. Поэтому модель A показывает более сильное улучшение относительно базовой доли редкого класса.
  kind: choice
  options:
    - Модель B, потому что её AUPRC выше
    - Модели равноценны, потому что обе превосходят базовый уровень
    - Сравнение невозможно даже относительно случайного уровня
    - Модель A, потому что её AUPRC во столько раз сильнее превышает долю положительного класса
  correct: 3
  id: 012-auprc-2
  fingerprint: 946eed1b
- concept: AUPRC агрегирует качество ранжирования по разным порогам решения
  question: Объясни своими словами, почему AUPRC характеризует ранжирование объектов, а не качество классификации только при одном выбранном пороге.
  explanation: AUPRC учитывает сочетания precision и recall, возникающие при переборе порогов. Поэтому она оценивает порядок оценок модели в целом, тогда как метрика при одном пороге описывает только одно конкретное решение.
  kind: open
  reference: При изменении порога меняются множества объектов, признанных положительными, а вместе с ними precision и recall. Кривая precision-recall отражает эти значения для разных порогов, а площадь под ней объединяет их в одну оценку того, насколько хорошо положительные объекты подняты вверх в ранжированном списке.
  id: 012-auprc-3
  fingerprint: fdc4839a
