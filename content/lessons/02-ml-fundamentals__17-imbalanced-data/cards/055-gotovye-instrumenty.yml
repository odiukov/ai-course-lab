- concept: classification_report формирует сводку основных метрик классификации по предсказаниям
  question: Какой компонент scikit-learn следует вызвать, чтобы получить текстовую сводку с precision, recall и F1 по классам?
  explanation: classification_report сравнивает истинные и предсказанные метки и выводит precision, recall, F1 и число объектов для каждого класса. Он не обучает модель и не изменяет выборку.
  kind: choice
  options:
    - train_test_split(y_true, y_pred)
    - LogisticRegression().score(y_true, y_pred)
    - classification_report(y_true, y_pred)
    - SMOTE().fit_resample(y_true, y_pred)
