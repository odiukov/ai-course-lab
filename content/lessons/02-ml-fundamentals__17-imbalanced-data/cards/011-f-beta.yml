  fingerprint: b7ac8306
- concept: вычисление F-beta по precision, recall и beta
  question: У классификатора precision равна 0.75, recall — 0.40, а β = 3. Чему примерно равна F-beta?
  explanation: Квадрат beta равен 9. Подстановка precision 0.75 и recall 0.40 в определение F-beta даёт примерно 0.42; низкий recall заметно ограничивает результат при таком его приоритете.
  kind: numeric
  answer: 0.42
  tolerance: 0.01
  id: 011-f-beta-2
