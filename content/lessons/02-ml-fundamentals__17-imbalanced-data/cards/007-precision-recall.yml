- concept: precision — доля верных положительных прогнозов среди всех положительных прогнозов модели
  question: Спам-фильтр правильно пометил как спам 28 писем, а ещё 7 обычных писем ошибочно отправил в спам. Чему равна precision?
  explanation: 'Precision считается как TP / (TP + FP). Здесь это 28 / (28 + 7) = 28 / 35 = 0,8: верными оказались 80% срабатываний фильтра.'
  kind: numeric
  answer: 0.8
  tolerance: 0.001
  id: 007-precision-recall-1
  fingerprint: 1b668c14
- concept: false positive снижает precision, а false negative снижает recall
  question: После изменения порога число истинно положительных прогнозов и пропущенных положительных случаев не изменилось, а ложных срабатываний стало меньше. Как изменятся метрики?
  explanation: Уменьшение FP сокращает знаменатель TP + FP, поэтому precision растёт. В формуле recall = TP / (TP + FN) величины TP и FN не изменились, значит recall остаётся прежним.
  kind: choice
  options:
    - Precision вырастет, recall не изменится
    - Recall вырастет, precision не изменится
    - Обе метрики вырастут
    - Обе метрики не изменятся
  correct: 0
  id: 007-precision-recall-2
  fingerprint: 55fd7c6b
