- concept: нулевые знаменатели при вычислении precision, recall и F-меры обрабатываются явным возвратом вещественного нуля
  question: 'Объясни, как функция вычисления метрик должна обработать три крайних случая: модель не дала положительных прогнозов, в данных нет фактически положительных объектов, сумма precision и recall равна нулю.'
  explanation: У precision знаменатель равен сумме истинно и ложно положительных прогнозов, у recall — сумме истинно положительных и ложно отрицательных случаев. F-мера делится на сумму precision и recall. Проверка каждого знаменателя предотвращает деление на ноль.
  kind: open
  reference: Если нет положительных прогнозов, функция возвращает вещественный ноль для precision. Если нет фактически положительных объектов, она возвращает вещественный ноль для recall. При нулевой сумме precision и recall F-мера также становится вещественным нулём.
  id: 009-code-prf-1
  fingerprint: 776028bf
- concept: функция метрик возвращает precision, recall и F-меру в фиксированном контрактном порядке
  question: В каком порядке функция, одновременно вычисляющая precision, recall и F-меру, должна вернуть результаты по заданному контракту?
  explanation: 'Фиксированный порядок нужен для безопасной распаковки результата: сначала precision, затем recall и только потом F-мера. Перестановка значений не вызовет ошибку выполнения, но незаметно исказит дальнейшие расчёты.'
  kind: choice
  options:
    - precision, затем recall, затем F-мера
    - recall, затем precision, затем F-мера
    - F-мера, затем precision, затем recall
  correct: 0
  id: 009-code-prf-2
  fingerprint: 6f4bc0fc
