- concept: суммарная стоимость классификации равна сумме стоимостей ошибок каждого типа
  question: Система допустила 3 false negative стоимостью 70 единиц каждый и 40 false positive стоимостью 4 единицы каждый. Какова суммарная стоимость ошибок?
  explanation: 'Стоимость вычисляется отдельно для каждого типа ошибки, а затем складывается: 3 × 70 + 40 × 4 = 370. Именно эту величину минимизирует cost-sensitive learning.'
  kind: numeric
  answer: 370
  tolerance: 0.01
  id: 040-stoimost-oshibok-1
  fingerprint: 263dd738
- concept: стоимости ошибок задают по их реальным последствиям, а не только по частоте классов
  question: На каком основании следует назначать стоимости false positive и false negative в cost-sensitive learning?
  explanation: Cost-sensitive learning связывает штрафы с последствиями решений. Например, пропущенное мошенничество может стоить существенно дороже ложной тревоги, независимо от частоты классов в обучающей выборке.
  kind: choice
  options:
    - Только по соотношению количества объектов разных классов
    - 'По реальным последствиям ошибок: финансовым потерям, рискам и затратам ресурсов'
    - Одинаково для обоих типов ошибок, чтобы обучение было симметричным
    - Случайно, а затем выбирать наиболее высокую итоговую метрику
  correct: 1
