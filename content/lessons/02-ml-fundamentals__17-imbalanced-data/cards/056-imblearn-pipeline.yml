- concept: при кросс-валидации imbalanced-learn Pipeline заново применяет SMOTE только к обучающей части каждого разбиения
  question: Пайплайн из SMOTE и логистической регрессии передали функции кросс-валидации. Что происходит при обработке каждого разбиения?
  explanation: Кросс-валидация вызывает fit пайплайна независимо для каждого разбиения. SMOTE видит только текущую обучающую часть, создаёт по ней синтетические объекты, а затем модель обучается на расширенной выборке. Валидационная часть не участвует в ресемплинге.
  kind: choice
  options:
    - SMOTE один раз обучается на полном наборе данных, после чего создаются разбиения
    - SMOTE отдельно обучается на текущей обучающей части, а модель получает результат ресемплинга
    - SMOTE обучается на текущей валидационной части и преобразует обучающую часть
  correct: 1
  id: 056-imblearn-pipeline-1
  fingerprint: 9ee07b18
- concept: шаг SMOTE в imbalanced-learn Pipeline выполняется при обучении, но не изменяет объекты при предсказании
  question: Объясните своими словами, что происходит с проверочными объектами при вызове predict у обученного пайплайна SMOTE и классификатора.
  explanation: В imbalanced-learn ресемплер применяется внутри fit через fit_resample. Во время predict проверочные и тестовые наблюдения не дополняются синтетическими строками и поступают в модель без ресемплинга.
  kind: open
  reference: SMOTE не ресемплирует проверочные объекты при predict. Они в исходном виде передаются уже обученному классификатору, потому что синтетические примеры нужны только для формирования обучающей выборки.
  id: 056-imblearn-pipeline-2
  fingerprint: 9ef70471
