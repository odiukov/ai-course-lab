- concept: веса классов, сбалансированные по частоте, обратно пропорциональны численности класса
  question: 'В обучающем наборе 840 объектов: 700 отрицательных и 140 положительных. Вес класса рассчитывают как n_samples / (2 × n_class). Какой вес получит положительный класс?'
  explanation: Для положительного класса вес равен 840 / (2 × 140) = 3. Чем реже класс, тем больший множитель получают ошибки на его объектах.
  kind: numeric
  answer: 3
  tolerance: 0.001
  id: 030-ves-oshibki-1
  fingerprint: 14d918cf
- concept: взвешивание класса эквивалентно повторению его примеров по суммарному вкладу в аддитивную функцию потерь
  question: Почему увеличение веса редкого класса считают математическим аналогом oversampling в среднем?
  explanation: При аддитивной функции потерь множитель увеличивает вклад примера в общую ошибку и градиент так же, как его повторное включение. Однако фактических копий в обучающем наборе не появляется.
  kind: choice
  options:
    - Вес автоматически создаёт новые синтетические точки между редкими объектами
    - Умноженный вклад примеров в loss и градиент соответствует их повторному учёту, хотя строки набора не копируются
    - Вес удаляет часть объектов класса большинства перед обучением
    - Вес меняет только порог, по которому готовая модель выбирает класс
  correct: 1
