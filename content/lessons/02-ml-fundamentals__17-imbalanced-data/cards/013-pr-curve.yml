- concept: изменение порога выбирает рабочий компромисс, но не улучшает ранжирование модели
  question: Объясни своими словами, почему подходящий бизнесу порог решения не означает, что сама модель стала качественнее.
  explanation: Порог относится к правилу принятия решения поверх неизменных оценок модели. Он может сделать выбранный режим работы удобнее с учётом стоимости ошибок, но не добавляет модели способности лучше отделять классы.
  kind: open
  reference: Оценки объектов и их ранжирование остаются прежними. Порог лишь определяет, какие оценки считать положительными, выбирая рабочий компромисс между precision и recall. Для улучшения самой модели нужно изменить её оценки или ранжирование.
  id: 013-pr-curve-2
  fingerprint: 2b31a794
