- concept: приемлемая офлайн-оценка модели должна сопровождаться мониторингом после развёртывания
  question: Модель успешно прошла оценку качества на несбалансированных данных. Какое действие завершает такой конвейер?
  explanation: 'После приемлемых значений F1, AUPRC или MCC модель можно разворачивать, но вместе с мониторингом: распределение классов и качество прогнозов способны измениться в эксплуатации.'
  kind: choice
  options:
    - Развернуть модель и отслеживать её работу
    - Удалить редкий класс из рабочих данных
    - Зафиксировать порог и отказаться от дальнейших проверок
    - Повторно обучать модель после каждого отдельного прогноза
