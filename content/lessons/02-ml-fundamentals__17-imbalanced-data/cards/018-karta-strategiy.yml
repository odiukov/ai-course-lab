- concept: при усилении дисбаланса стартовая стратегия объединяет больше способов вмешательства
  question: Расположите стартовые стратегии от подходящей для менее выраженного дисбаланса к подходящей для наиболее выраженного.
  explanation: 'Схема предлагает усиливать вмешательство по мере роста дисбаланса: для 80/20 — веса классов, для 95/5 — SMOTE с настройкой порога, для 99/1 — сочетание всех трёх приёмов.'
  kind: order
  items:
    - Веса классов
    - SMOTE и настройка порога
    - SMOTE, веса классов и настройка порога
