- concept: случайный undersampling может потерять разновидности класса большинства и увеличить разброс модели
  question: Класс большинства случайно сокращают до размера редкого класса. Какой риск наиболее характерен для такого undersampling?
  explanation: Undersampling удаляет реальные наблюдения большинства. Вместе с ними можно потерять важные варианты этого класса, а разные случайные подвыборки способны дать заметно различающиеся модели.
  kind: choice
  options:
    - Модель обязательно запомнит точные копии объектов редкого класса
    - Из обучающей выборки могут исчезнуть полезные разновидности большинства, а результат будет зависеть от случайно сохранённых строк
    - Обучение обязательно замедлится из-за увеличения размера выборки
  correct: 1
  id: 029-riski-resampling-1
  fingerprint: 2a56cb6d
- concept: SMOTE может добавлять шум у границы классов, поскольку не учитывает распределение большинства
  question: Почему синтетические объекты SMOTE могут ухудшить границу решения, даже если они не являются точными копиями исходных наблюдений?
  explanation: Новые точки сами по себе не гарантируют полезного разнообразия. SMOTE ориентируется на геометрию редкого класса и может заполнить синтетическими наблюдениями область, занятую большинством.
  kind: open
  reference: SMOTE строит новые объекты по соседям редкого класса, не проверяя расположение объектов большинства. Поэтому синтетическая точка может оказаться в области большинства или возле неоднозначной границы и добавить шум.
  id: 029-riski-resampling-2
  fingerprint: 1dcaca40
