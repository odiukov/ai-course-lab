- concept: единичные веса сводят взвешенное обучение к обычной логистической регрессии
  question: Что произойдёт, если при обучении взвешенной логистической регрессии передать массив весов, целиком состоящий из единиц?
  explanation: Умножение на единицу не меняет ошибку ни одного примера. Поэтому при одинаковых начальных параметрах и настройках градиенты и обновления совпадут с обычным обучением.
  kind: choice
  options:
    - Все градиенты обнулятся
    - Обучение будет эквивалентно обычной логистической регрессии
    - Каждый обучающий пример будет учтён дважды
  correct: 1
  id: 050-weighted-logistic-1
  fingerprint: 76c6bbd1
- concept: веса должны учитываться в градиентах коэффициентов и свободного члена
  question: В реализации взвешенной логистической регрессии градиент коэффициентов вычисляют по weighted_error, а градиент свободного члена — по исходному error. Объясни, почему такая реализация некорректна.
  explanation: Один и тот же weighted_error участвует в вычислении gradient_w и gradient_b. Если убрать веса только из gradient_b, параметры будут обновляться по двум несовместимым целям.
  kind: open
  reference: Взвешенная функция потерь требует учитывать веса примеров во всех производных. Поэтому и градиент коэффициентов, и градиент свободного члена должны вычисляться по weighted_error; иначе свободный член обновляется так, будто веса классов не заданы.
  id: 050-weighted-logistic-2
  fingerprint: b73353e6
