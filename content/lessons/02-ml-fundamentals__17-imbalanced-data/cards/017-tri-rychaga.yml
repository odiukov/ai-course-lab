- concept: работа с дисбалансом представляет собой итеративный цикл выбора стратегии, обучения и оценки
  question: Расположи этапы работы с несбалансированной выборкой в правильном порядке.
  explanation: Сначала по выраженности дисбаланса выбирают методы, затем обучают и оценивают модель. Неудовлетворительный результат запускает новый цикл выбора стратегии.
  kind: order
  items:
    - Оценить выраженность дисбаланса классов
    - Выбрать подходящую комбинацию методов
    - Обучить модель
    - Оценить качество с помощью подходящих метрик
    - При недостаточном качестве пересмотреть стратегию, а при достаточном — внедрить модель с мониторингом
