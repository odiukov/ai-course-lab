- concept: порядок операций в одном шаге обучения при SFT совпадает с порядком в предобучении
  question: Расставь операции одного шага обучения при SFT в порядке их выполнения.
  explanation: 'Цикл идентичен предобучению. Именно поэтому SFT не требует новой архитектуры: отличается только источник примеров — размеченные диалоги вместо сплошного текста.'
  kind: order
  items:
    - 'Прямой проход: модель выдаёт распределение вероятностей следующего токена'
    - Сравнение предсказания с эталонным токеном ответа и вычисление величины потерь
    - 'Обратный проход: вычисление градиентов потерь по весам'
    - Обновление весов оптимизатором
  id: 003-sft-goal-2
  fingerprint: 49affc59
- concept: 'выполнение инструкций возникает как статистика продолжений: после реплики пользователя в данных всегда стоит выполненный результат'
  question: Модель после SFT по-прежнему лишь предсказывает следующий токен. Объясни своими словами, почему этого механизма достаточно, чтобы она отвечала на новую, ранее не виденную просьбу, а не дописывала к ней похожие просьбы.
  explanation: 'Ключ — сдвиг условного распределения P(следующий токен | контекст), а не появление нового модуля. Разметка ролей (system/user/assistant) даёт модели устойчивый сигнал границы: после начала реплики ассистента вероятны токены ответа.'
  kind: open
  reference: 'В обучающем корпусе SFT после разметки пользовательской реплики никогда не идёт ещё одна похожая инструкция — там всегда стоит её выполненный результат в реплике ассистента. Модель усваивает эту статистику: контекст вида «служебная разметка роли пользователя + текст просьбы + разметка начала реплики ассистента» становится знакомым префиксом, после которого высоковероятны токены выполнения, а не токены новой инструкции. Обобщение работает на невиданных просьбах, потому что модель опирается на структуру диалога и роль-разметку, а не на конкретный текст запроса. Механизм предсказания следующего токена не менялся — сдвинулось распределение того, что является правдоподобным продолжением.'
  id: 003-sft-goal-3
  fingerprint: 7350951f
