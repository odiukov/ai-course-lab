  question: SFT-пара имеет ответ длиной 50 токенов и разнообразие токенов 0,95 — она прошла автоматический фильтр качества данных. Что отсюда следует?
  explanation: Случайный набор слов тоже даёт высокое разнообразие и приличную длину. Три числа — длина, отношение длин, разнообразие — быстро выделяют подозрительные пары, но проверка смысла и соответствия инструкции ими не заменяется.
