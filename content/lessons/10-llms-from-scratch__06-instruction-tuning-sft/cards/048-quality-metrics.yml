  question: 'В SFT-наборе есть пара, где ответ занимает 60 токенов, но уникальных среди них только 11: одна и та же фраза повторяется много раз. Какая метрика качества данных пометит такой пример?'
  explanation: '60 токенов — нормальная длина, отношение длин тоже не выдаёт проблему: обе метрики видят только размеры. Повтор ловится долей уникальных токенов: 11/60 ≈ 0,18, значение сильно ниже типичного порога отбраковки.'
