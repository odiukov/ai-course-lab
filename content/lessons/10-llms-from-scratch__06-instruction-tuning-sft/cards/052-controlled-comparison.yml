- concept: одинаковый seed уравнивает источник случайности, но не заставляет разные модели выдать одинаковый текст
  question: Перед генерацией у base- и у SFT-модели установлен один и тот же seed генератора случайных чисел, промпт и параметры декодирования совпадают. Тексты всё равно получились разными. Объясни, почему это ожидаемо, а не признак того, что seed не сработал.
  explanation: Seed нужен, чтобы разница ответов не объяснялась удачным или неудачным случайным розыгрышем. Он делает прогон воспроизводимым и парным; расхождение текстов при равном seed как раз и есть измеряемый эффект различия весов.
  kind: open
  reference: Seed фиксирует последовательность случайных чисел, которую использует сэмплирование, — то есть уравнивает источник случайности, а не результат. Выбор токена определяется этим случайным числом ВМЕСТЕ с распределением вероятностей, которое выдала модель. У base- и SFT-модели веса разные, значит на той же позиции разные распределения, и одно и то же случайное число попадает в разные интервалы кумулятивной вероятности — выбираются разные токены. Дальше расхождение усиливается, потому что следующий шаг генерации идёт уже по разному контексту. Совпадение текстов ожидалось бы только при идентичных распределениях (например, если бы дообучение вообще не изменило веса).
  id: 052-controlled-comparison-2
  fingerprint: 4606672a
- concept: 'протокол парного сравнения двух моделей: сначала зафиксировать все условия, потом менять только модель'
  question: Расположи шаги корректного сравнения base- и SFT-модели по порядку выполнения.
  explanation: 'Порядок отражает логику контролируемого опыта: все условия фиксируются до запуска, иначе фиксировать уже нечего. Seed ставится перед каждой генерацией отдельно, а не один раз на скрипт, — иначе вторая модель стартует с уже продвинутого состояния генератора. Повтор на серии инструкций и seed нужен потому, что одна пара выходов показывает механизм, но не отличает систематическое различие поведения от случайного.'
  kind: order
  items:
    - 'Зафиксировать общий вход: один и тот же промпт в формате инструкции для обеих моделей'
    - 'Зафиксировать параметры декодирования: одну температуру и один лимит новых токенов (например, 64) для обеих моделей'
    - Установить один и тот же seed непосредственно перед запуском генерации каждой модели
    - Прогнать обе модели и сопоставить их выходы как пару
    - Повторить ту же процедуру на нескольких инструкциях и нескольких seed, чтобы отделить устойчивый рисунок поведения от единичного розыгрыша
  id: 052-controlled-comparison-3
  fingerprint: e340be05
