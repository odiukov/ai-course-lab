- concept: рост метрики на целевой задаче после узкого SFT совместим с падением качества на задачах вне обучающего распределения
  question: Модель дообучили на узкой выборке диалогов юридической поддержки. Оценка на этой задаче выросла с 64 до 89. На отдельных наборах по коду, арифметике и переводу оценки упали на 8-15 пунктов. Как это правильно назвать?
  explanation: 'Катастрофическое забывание — именно эта картина: целевая задача улучшается, прежние более общие способности деградируют. Рост 64→89 на узком тесте не доказывает, что модель стала лучше в целом. Обучение при этом отработало корректно, поэтому варианты про ошибку или утечку мимо.'
  kind: choice
  options:
    - 'Ошибка обучения: при корректном SFT все метрики растут одновременно'
    - 'Катастрофическое забывание: настройка на узкой выборке ухудшила прежние общие способности'
    - 'Переобучение на валидации: целевая метрика 89 завышена и не воспроизведётся'
    - 'Утечка данных: тестовые примеры кода попали в обучающую выборку'
  correct: 1
  id: 043-forgetting-1
  fingerprint: 218fc57c
- concept: забывание возникает потому, что SFT обновляет общие параметры, обслуживающие много навыков, даже когда потери считаются только по токенам ответа
  question: При SFT потери считают только на токенах ответа ассистента. Объясни своими словами, почему это не защищает модель от потери способностей, которых в обучающей выборке вообще не было.
  explanation: 'Ключ: маска влияет на функцию потерь, а не на множество обновляемых параметров. Специализация происходит за счёт общих представлений — потому и нужны маленький learning rate, короткое обучение и подмешивание предобучающих данных.'
  kind: open
  reference: Маска ограничивает, откуда берётся сигнал ошибки, но не то, какие веса он двигает. Градиенты от токенов ответа идут обратным проходом через всю сеть и обновляют общие параметры — те же матрицы внимания и MLP обслуживают код, арифметику, сочинение. Если почти все обучающие ответы принадлежат одной области и одному формату, шаги оптимизатора раз за разом подгоняют эти общие представления под узкое распределение, вытесняя те конфигурации весов, что были полезны в других задачах. Отдельных «весов для кода», которые можно оставить нетронутыми, у модели нет.
  id: 043-forgetting-2
  fingerprint: fb688346
- concept: «забывание» означает ухудшение извлечения и формы ответа, а не обязательное исчезновение знаний из весов
  question: После узкого SFT модель на прямой вопрос о столице страны отвечает шаблонной фразой службы поддержки и не даёт факт. Но при запросе в формате продолжения текста с двумя примерами она выдаёт верный ответ. Какой вывод корректен?
  explanation: Два примера в промпте не вносят новый факт в модель — они лишь меняют форму запроса. Раз ответ извлекается, знание в весах есть. Забывание здесь проявилось как испорченный доступ и навязанный шаблон, а не как исчезновение информации.
  kind: choice
  options:
    - Факт стёрт из весов, а верный ответ восстановлен по контексту промпта
    - Знание в весах сохранилось, ухудшился доступ к нему и форма выдачи
    - SFT не мог затронуть эту способность, значит регрессия случайна
    - Модель никогда не знала факт, few-shot научил её ему за два примера
  correct: 1
  id: 043-forgetting-3
