- concept: при SFT потери считаются только на токенах ответа ассистента, токены system и user маскируются
  question: 'В SFT-датасете каждый пример — диалог: системное сообщение, реплика пользователя, эталонный ответ ассистента. Перед вычислением потерь токены промпта помечают так, чтобы кросс-энтропия их не учитывала. Чем заполняют метки промпта в стандартном PyTorch-цикле?'
  explanation: '-100 — значение ignore_index по умолчанию в nn.CrossEntropyLoss: такие позиции выпадают из суммы потерь. Модель не штрафуется за то, что не угадала вопрос пользователя, — градиент идёт только от того, как она порождает ответ. Если маску не поставить, часть обучающего сигнала уйдёт на воспроизведение промптов.'
  kind: cloze
  template: 'labels[: len(prompt_tokens)] = ___  # потери считаем только по ответу ассистента'
  answer: '-100'
  accept:
    - '-100'
    - IGNORE_INDEX
    - ignore_index = -100
  id: 005-behavior-check-1
  fingerprint: 354f5dd3
- concept: системное сообщение в SFT-примере задаёт рамку поведения, а фактическое содержание ответа берётся из весов предобучения
  question: Команда собирает SFT-датасет на 8000 диалогов и во всех примерах ставит системное сообщение «Ты — краткий технический ассистент, отвечай одним абзацем». Что именно этим достигается?
  explanation: 'Системное сообщение — это часть контекста, на который обусловлено порождение ответа. Оно управляет манерой: краткость, тон, готовность отказать. Знание о предметной области при этом остаётся тем, что модель усвоила на предобучении, — новую справочную базу системный промпт не создаёт.'
  kind: choice
  options:
    - В модель загружается справочник технических фактов, привязанный к этому системному сообщению
    - Задаётся условие, при котором модель выбирает нужный стиль и формат ответа; фактическое наполнение берётся из знаний предобучения
    - Системное сообщение заменяет функцию потерь и переключает обучение с предсказания токенов на классификацию
    - Модель перестаёт отвечать на запросы без системного сообщения
  correct: 1
  id: 005-behavior-check-2
  fingerprint: 073bdb2e
