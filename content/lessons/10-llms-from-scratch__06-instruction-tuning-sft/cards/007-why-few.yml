- concept: объём данных SFT на несколько порядков меньше объёма предобучения
  question: Базовую модель предобучили на 1.5 триллиона токенов. Затем её дообучают на SFT-наборе из 20 000 примеров, средняя длина примера — 500 токенов. Во сколько раз корпус предобучения больше SFT-корпуса по числу токенов?
  explanation: 'SFT-корпус = 20 000 × 500 = 10 млн токенов. 1.5e12 / 1e7 = 150 000. Разрыв в пять порядков нормален: предобучение строит сам набор способностей, а SFT лишь закрепляет маршрут к одной из них.'
  kind: numeric
  answer: 150000
  tolerance: 1000
  id: 007-why-few-1
  fingerprint: 3e3026f6
- concept: SFT-масштаба хватает только на перенастройку уже имеющихся способностей; новую способность нужного масштаба данных он не создаёт
  question: Команда собрала 8 000 качественных пар «инструкция — ответ» на суахили, которого практически не было в корпусе предобучения. Что даст такое дообучение?
  explanation: 'SFT достаточен, когда целевая способность уже лежит в весах, и его задача — вывести её наружу. Языковая беглость такой способностью здесь не является: её нельзя набрать за тысячи примеров, для этого нужны порядки данных предобучения.'
  kind: choice
  options:
    - 'Модель освоит суахили так же, как английский: важна чистота пар, а не объём'
    - Модель подхватит формат диалога, но беглость на суахили останется низкой — владение языком требует данных предобучающего масштаба
    - 'Модель не изменится вообще: SFT работает только на языке предобучения'
    - Модель потеряет английский, потому что SFT перезаписывает все веса
  correct: 1
  id: 007-why-few-2
  fingerprint: eeb71db0
- concept: нужный размер SFT-набора определяется разнообразием целевых форматов поведения, а не числом предметных тем
  question: Инженер настраивает ассистента, который должен отвечать в одном строгом формате по 400 разным продуктовым темам. От чего в первую очередь зависит требуемое число SFT-примеров?
  explanation: SFT закрепляет повторяющийся выбор, а не заучивает каждый пример. Один формат ответа — это одно поведение, и тысяч примеров хватает; предметное наполнение по 400 темам берётся из уже предобученных весов.
  kind: choice
  options:
    - 'От числа тем: примеры нужны пропорционально 400 темам, иначе модель не покроет их'
    - 'От числа разных целевых форматов и режимов ответа: один и тот же выбор повторяется в примерах, темы приходят из весов предобучения'
    - 'От размера базовой модели: чем больше параметров, тем больше примеров нужно на каждую тему'
    - От длины контекстного окна, потому что оно ограничивает число примеров в батче
  correct: 1
  id: 007-why-few-3
