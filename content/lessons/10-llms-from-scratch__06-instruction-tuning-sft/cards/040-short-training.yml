- concept: 'число эпох SFT подбирают эмпирически: добавляют проход и останавливаются, когда отложенная проверка перестаёт улучшаться'
  question: Расставь шаги процедуры подбора числа эпох для SFT в правильном порядке.
  explanation: 'Число эпох — не константа, а результат замера. Улучшение обучающего loss решение не обосновывает: его нужно подтвердить на данных, которых модель не видела. Практика для SFT укладывается в 1-3 прохода, дальше улучшение обычно только на знакомых примерах.'
  kind: order
  items:
    - Отделить часть пар инструкция-ответ в отложенный набор, не участвующий в обучении
    - Провести один полный проход по обучающим данным
    - Замерить качество ответов на отложенном наборе и сохранить чекпоинт
    - Провести ещё один проход и снова замерить отложенный набор
    - Взять чекпоинт с лучшим результатом на отложенном наборе, как только дальнейшие проходы перестают его улучшать
  id: 040-short-training-2
  fingerprint: '22703e05'
- concept: повторный проход по одной и той же выборке не добавляет нового обучающего сигнала, поэтому лишние эпохи не заменяют расширение данных
  question: Инженер видит, что после дообучения модель плохо справляется с формулировками, которых в наборе не было, и предлагает поднять число эпох с четырёх до двенадцати. Объясни своими словами, почему это не решит задачу, и что помогло бы.
  explanation: Эпоха — единица повторения, не источник разнообразия. Прокручивание маленькой выборки много раз улучшает память о выборке, а обобщение на новые запросы даёт расширение и разнообразие самих данных.
  kind: open
  reference: 'Каждая новая эпоха прогоняет ровно те же примеры: ни одной новой инструкции и ни одного нового варианта ответа в данных не появляется. Обучающий сигнал только повторяется, поэтому модель всё точнее подгоняется под знакомые формулировки, а перенос на незнакомые не улучшается — растёт риск запоминания. Проблема в покрытии данных, а не в числе проходов: помогает добавить новые, разнообразные по формулировкам и типам задач пары инструкция-ответ, оставив число эпох малым.'
  id: 040-short-training-3
  fingerprint: 47d99f6c
