- concept: датасет SFT состоит из размеченных пар (инструкция, эталонный ответ), а не из сырого текста
  question: Чем датасет для supervised fine-tuning принципиально отличается от корпуса предобучения?
  explanation: 'Корпус предобучения — просто текст, цель обучения берётся из него самого (следующий токен). Для SFT нужна разметка: к каждой инструкции приложен демонстрационный ответ, на котором и считается loss. Именно поэтому такие датасеты дорогие и измеряются десятками тысяч примеров, а не триллионами токенов.'
  kind: choice
  options:
    - Он состоит из сырого текста, но только из более свежих источников
    - 'Он состоит из пар «инструкция — эталонный ответ»: у каждого запроса есть готовый образец того, чем его нужно закрыть'
    - В нём хранятся не тексты, а числовые оценки качества ответов модели
    - Он содержит те же документы, но с удалёнными редкими токенами
