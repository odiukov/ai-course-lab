- concept: 'поле input в Alpaca необязательное: инструкция без дополнительного контекста хранится в том же формате с пустым input'
  question: В наборе для SFT собраны задания вида «Переведи текст на немецкий» с приложенным абзацем и задания вида «Назови столицу Австралии» без всякого приложения. Как схема Alpaca покрывает оба случая?
  explanation: 'Alpaca-запись состоит из инструкции, необязательного входа и ответа. Многим инструкциям дополнительный контекст не нужен, поэтому поле входа остаётся пустым, а структура записи не меняется. Дублировать инструкцию в поле входа вредно: модель учится на шуме.'
  kind: choice
  options:
    - 'Поле дополнительного контекста необязательное: у второго типа заданий оно просто пустое, схема одна'
    - Задания без приложенного текста в Alpaca хранить нельзя, для них нужна другая схема
    - 'Вопрос без приложения приходится дублировать: сам вопрос кладут и в поле инструкции, и в поле контекста'
  correct: 0
  id: 016-format-check-1
  fingerprint: 3cc861a5
- concept: метки говорящих в ShareGPT — это соглашение об именовании ролей, а не сведения о том, какая модель породила ответ
  question: Диалог собран в формате ShareGPT, реплики ассистента помечены значением «gpt». Ответы при этом сгенерированы 4 разными моделями, ни одна из которых не от OpenAI. Что означает такая метка?
  explanation: 'В ShareGPT значения «human» и «gpt» закрепились как имена ролей — пользователь и ассистент. Они кодируют, чья это реплика в диалоге, а не происхождение текста. При обучении важна именно роль: по ней решают, на каких токенах считать потери.'
  kind: choice
  options:
    - Что все ответы обязаны быть проверены на совместимость с лицензией OpenAI, иначе метку надо менять
    - Что это условное имя роли ассистента, принятое в формате независимо от реального автора ответа
    - 'Что запись повреждена: метка должна называть модель, которая породила реплику'
  correct: 1
  id: 016-format-check-2
  fingerprint: c7f84891
