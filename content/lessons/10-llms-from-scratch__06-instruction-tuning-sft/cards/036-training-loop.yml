- concept: learning rate SFT на порядок-два меньше, чем при предобучении
  question: Предобучение шло с learning rate 8e-4, SFT той же модели ведут с 2e-5. Во сколько раз шаг обновления весов при SFT меньше?
  explanation: '8e-4 / 2e-5 = 40. Типичные SFT-рецепты (например, Llama 2 Chat с 2e-5) держат learning rate на один-два порядка ниже предобучающего: модель уже обучена, её аккуратно перенастраивают, а не строят с нуля.'
  kind: numeric
  answer: 40
  tolerance: 0.5
  id: 036-training-loop-2
  fingerprint: 3b52f5be
- concept: слишком большой learning rate при SFT разрушает выученное в предобучении
  question: Инженер запускает SFT на 1000 диалогах с learning rate, как при предобучении. Loss на SFT-данных быстро падает почти до нуля, но модель начинает путать факты и повторять шаблонные фразы. Объясни своими словами, что произошло.
  explanation: SFT-набор на несколько порядков меньше предобучающего, поэтому большой шаг оптимизатора легко перетягивает веса под него и разрушает предобученное поведение. Малый learning rate — способ удержать модель рядом с исходной точкой.
  kind: open
  reference: 'Крупный шаг обновления сильно смещает веса под маленький SFT-набор. Модель быстро подгоняется под эту тысячу примеров (низкий loss на них), но при этом затирает распределения, выученные на огромном предобучающем корпусе — катастрофическое забывание. Знания и общие способности живут именно в предобученных весах, SFT должен лишь слегка их перенастроить под формат ответа. Отсюда малый learning rate: он ограничивает величину сдвига за шаг. Низкий train loss на SFT-данных здесь признак переобучения на маленькой выборке, а не успеха; судить нужно по отложенной проверке.'
  id: 036-training-loop-3
  fingerprint: f4fa81ea
