- concept: оценка по пропускной способности — нижняя граница чистого счёта, реальный прогон длиннее из-за накладных операций и колебаний скорости
  question: Расчёт «токены делить на токены в секунду» дал 40 минут, а прогон занял 55. Что объясняет разницу лучше всего?
  explanation: Формула оценивает чистое время арифметики на постоянной пропускной способности. Реальная скорость плавает от железа, длины последовательностей и настроек, а к прогону добавляются подготовка данных, замеры на отложенном наборе и запись чекпоинтов. Поэтому такой расчёт — ориентир и нижняя граница, а не обещание.
  kind: choice
  options:
