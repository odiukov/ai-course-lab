- concept: вычитание максимума логитов перед экспонентой не меняет softmax, но защищает от переполнения
  question: В реализации log-softmax из строки логитов сначала вычитают их максимум, и только потом берут exp и логарифм суммы. Что даёт это вычитание?
  explanation: 'Softmax инвариантен к сдвигу всех логитов на константу: exp(x-c)/Σexp(x-c) = exp(x)/Σexp(x). Значение потерь то же, но после вычитания максимума наибольший аргумент exp равен 0, значит exp не даст inf на логитах вроде 900.'
  kind: choice
  options:
    - Ничего не меняет в результате, но не даёт exp переполниться на больших логитах
    - Сдвигает распределение так, что вероятность целевого токена растёт
    - Заменяет softmax на нормировку по максимуму и ускоряет сходимость
    - Обнуляет вклад всех токенов, кроме самого вероятного
  correct: 0
  id: 032-loss-check-1
  fingerprint: 323c119e
- concept: порядок операций в функции masked cross-entropy от плоского вида тензоров до нормировки
  question: Расставь шаги вычисления masked cross-entropy для батча последовательностей.
  explanation: Потери считаются на всех позициях сразу — маска применяется уже к готовому вектору позиционных потерь, а не отсекает позиции до прямого прохода. Нормировка идёт последней, знаменатель берётся из той же маски.
  kind: order
  items:
    - Развернуть логиты в форму (batch*seq_len, vocab), а цели и маску — в плоские векторы
    - Посчитать log-softmax по оси словаря для каждой позиции
    - Взять log-вероятность целевого токена на каждой позиции и сменить знак
    - Поэлементно умножить вектор позиционных потерь на маску
    - Разделить сумму получившегося вектора на сумму маски
  id: 032-loss-check-2
  fingerprint: d8da988e
