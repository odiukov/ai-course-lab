- concept: маску многоходового диалога строят проходом по токенам с переключателем, потому что срез «всё после первого маркера ответа» захватит поздние реплики пользователя
  question: 'В диалоге из 4 обменов маску потерь построили одним срезом: единицы поставлены на всё, что идёт после первого маркера начала ответа ассистента. Что получит модель при обучении?'
  explanation: 'Срез — монотонная операция: раз включившись, единицы идут до конца последовательности. Но реплики пользователя стоят между ответами, и они попадут под потери — модель начнёт учиться писать вопросы за пользователя. Поэтому маску строят проходом по токенам с переключателем: он включается на начале реплики ассистента и выключается на её конце, давая столько отдельных участков единиц, сколько ответов в диалоге.'
  kind: choice
  options:
    - 'Корректную маску: все реплики ассистента попадут под единицы, а первая реплика пользователя останется под нулём'
    - Маску, которая обучает модель порождать и 2-ю, 3-ю, 4-ю реплики пользователя, так как они лежат после точки среза
    - Маску, которая обучает только на первом ответе ассистента, поскольку срез обрывается на следующем маркере
    - 'Пустую маску: срез после маркера не содержит токенов ответа'
  correct: 1
  id: 028-mask-islands-1
  fingerprint: e6ff3b92
- concept: алгоритм построения маски потерь для многоходового диалога как проход с переключателем состояния
  question: Расставьте шаги построения маски потерь для диалога из 5 обменов в правильном порядке.
  explanation: 'Переключатель меняет состояние столько раз, сколько границ реплик в диалоге, поэтому маска получает отдельный участок единиц на каждый ответ ассистента. Одного прохода достаточно: состояние определяется последним встреченным маркером, а не позицией в последовательности.'
  kind: order
  items:
    - Завести флаг «сейчас реплика ассистента» со значением «выключен» и пустой список маски
    - Идти по токенам последовательности слева направо, по одному
    - Встретив маркер начала реплики ассистента, включить флаг
    - Записывать в маску 1, пока флаг включён, и 0, пока выключен
    - Встретив маркер конца реплики ассистента, выключить флаг и продолжить проход к следующей реплике пользователя
  id: 028-mask-islands-2
  fingerprint: e43dc9e0
- concept: токен конца реплики ассистента должен входить в обучаемые позиции, иначе модель не учится останавливать генерацию
  question: При разметке маски инженер выключает переключатель ровно перед токеном конца реплики ассистента, так что этот токен получает 0. Что сломается на инференсе?
  explanation: 'Токен конца реплики — такой же предсказываемый токен, как и слова ответа. Если он под нулём, сигнал «здесь пора остановиться» не поступает, и генерация не завершается сама: приходится обрубать её по лимиту длины. Контекст при этом не страдает — маска влияет только на подсчёт потерь, не на прямой проход.'
  kind: choice
  options:
    - Модель не научится предсказывать конец своей реплики и будет продолжать генерацию дальше положенного
    - Модель перестанет видеть предыдущие реплики пользователя в контексте
    - Средние потери вырастут ровно вдвое, потому что знаменатель уменьшится
    - Модель начнёт путать роли и отвечать текстом реплики пользователя
  correct: 0
