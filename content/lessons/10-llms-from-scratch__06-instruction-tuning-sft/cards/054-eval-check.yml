- concept: наблюдаемый признак усвоения структуры — модель после маркера роли переходит к ответу вместо порождения новых запросов
  question: По какому наблюдаемому признаку судят, что модель усвоила структуру диалога, если качество текста ещё низкое?
  explanation: Базовая модель, поставленная в позицию после маркера ответа, склонна продолжать документ — то есть выдавать новые пары запрос-ответ. Смена этой привычки на порождение ответа и есть усвоенная структура; осмысленность текста тут ни при чём.
  kind: choice
  options:
    - После маркера начала ответа модель порождает ответ, а не следующую инструкцию пользователя
    - Ответ содержит не менее двадцати слов
    - Ответ не повторяет ни одного токена инструкции
    - Перплексия на обучающей выборке ниже, чем до дообучения
  correct: 0
