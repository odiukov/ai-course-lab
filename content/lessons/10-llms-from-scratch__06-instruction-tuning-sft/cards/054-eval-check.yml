- concept: доля соблюдения формата считается отдельно от доли содержательно верных ответов
  question: Прогнали 40 проверочных инструкций. В 34 случаях модель ответила в требуемой структуре, и лишь 6 ответов оказались фактически верными. Чему равна доля соблюдения формата?
  explanation: 34/40 = 0.85. Доля верных по содержанию — 6/40 = 0.15, и её считают отдельно. Разрыв между 0.85 и 0.15 показывает, что поведение перенастроено, а знаний или мощности модели не хватает.
  kind: numeric
  answer: 0.85
  tolerance: 0.01
  id: 054-eval-check-3
  fingerprint: d3fd3696
