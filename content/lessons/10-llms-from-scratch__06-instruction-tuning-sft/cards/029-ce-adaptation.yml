- concept: ошибка на одной позиции равна минус натуральному логарифму вероятности правильного токена
  question: На одной позиции ответа модель дала правильному следующему токену вероятность 0.2. Чему равна кросс-энтропийная ошибка на этой позиции (натуральный логарифм)?
  explanation: 'L = -ln p(y) = -ln(0.2) ≈ 1.609. Чем ниже вероятность верного токена, тем выше штраф: при p=0.5 было бы 0.69, при p=0.9 — всего 0.11.'
  kind: numeric
  answer: 1.61
  tolerance: 0.03
  id: 029-ce-adaptation-1
  fingerprint: d3470eb5
- concept: позиционная кросс-энтропия зависит только от вероятности целевого токена, а не от того, как распределена остальная вероятность
  question: Две позиции ответа. На первой модель дала правильному токену 0.6, а оставшиеся 0.4 положила целиком на один неверный токен. На второй тоже 0.6 правильному, но 0.4 размазаны тонким слоем по сотням неверных токенов. Как соотносятся потери на этих позициях?
  explanation: L = -log p(y) читает ровно одну ячейку распределения — вероятность целевого токена. 0.6 в обоих случаях даёт -ln(0.6) ≈ 0.51. Форма хвоста на loss не влияет, влияет только на то, что модель выдаст при сэмплировании.
  kind: choice
  options:
    - Потери равны
    - На первой позиции потери больше — вероятность собрана у сильного конкурента
    - На второй позиции потери больше — модель менее решительна
    - Сравнить нельзя без размера словаря
  correct: 0
  id: 029-ce-adaptation-2
  fingerprint: d8294858
- concept: порядок вычисления ошибки на одной позиции последовательности
  question: Расставь по порядку шаги получения кросс-энтропийной ошибки на одной позиции последовательности.
  explanation: 'Ошибка считается отдельно на каждой позиции: сначала пара «предсказание — верный следующий токен», затем нормировка логитов, затем выборка ячейки цели и смена знака. Одного вердикта на всю фразу нет — модель получает столько точечных сигналов, сколько позиций.'
  kind: order
  items:
    - Сопоставить позиции её целевой токен — тот, что стоит в последовательности следующим
    - Превратить логиты этой позиции в распределение вероятностей по словарю (log-softmax)
    - Взять из распределения вероятность (log-вероятность) именно целевого токена
    - 'Поменять знак: ошибка позиции равна минус логарифму этой вероятности'
  id: 029-ce-adaptation-3
  fingerprint: 02bc58c3
