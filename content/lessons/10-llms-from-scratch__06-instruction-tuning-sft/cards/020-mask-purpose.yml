- concept: в многоходовом диалоге маска включает все реплики ассистента, а не только последнюю
  question: 'Обучающий пример — диалог из четырёх реплик: запрос пользователя, ответ ассистента, уточняющий запрос пользователя, второй ответ ассистента. Объясни своими словами, как расставить маску потерь по этому примеру и почему она не сводится к отметке одного хвостового фрагмента.'
  explanation: Маска потерь привязана к ролям, а не к позиции в конце последовательности. Многоходовой пример даёт столько обучающих целей, сколько в нём реплик ассистента; пользовательские реплики между ними остаются условием задачи с нулевым вкладом в потери.
  kind: open
  reference: 'Единицы ставятся на токены обоих ответов ассистента, нули — на токены обеих пользовательских реплик и на служебные метки ролей. Маска, таким образом, чередуется по последовательности, а не является непрерывным хвостом. Причина: цель обучения — реакция ассистента в любом месте диалога, и каждый его ответ является полноценной обучающей целью, обусловленной всей предшествующей историей. Если оставить единицы только на последнем ответе, обучающий сигнал одного диалога сократится до одной цели, а первый ответ станет просто контекстом. Все реплики при этом целиком присутствуют на прямом проходе — маска управляет только вкладом в потери.'
  id: 020-mask-purpose-3
  fingerprint: 0906b9df
