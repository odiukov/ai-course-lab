- concept: средние потери усредняются по числу немаскированных позиций, а не по длине последовательности
  question: Обучающий пример длиной 50 токенов, из которых 20 относятся к ответу ассистента и получают в маске единицу. Сумма потерь по немаскированным позициям равна 34.0. Чему равны средние потери примера при корректном маскировании?
  explanation: 'Потери каждой позиции умножаются на маску, сумма делится на число единиц: 34.0 / 20 = 1.7. Деление на полную длину (34.0 / 50 = 0.68) занизило бы значение и сделало бы величину потерь зависимой от длины запроса, а не от качества ответа.'
  kind: numeric
  answer: 1.7
  tolerance: 0.02
  id: 020-mask-purpose-2
