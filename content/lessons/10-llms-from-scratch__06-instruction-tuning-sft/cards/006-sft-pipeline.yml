- concept: бюджет времени SFT считается как examples × средняя длина × эпохи, делённое на пропускную способность GPU
  question: 'Датасет инструкций: 20 000 примеров, в среднем 400 токенов на пример. Обучение идёт 4 эпохи. Пропускная способность GPU на этой модели — 4 000 токенов в секунду. Сколько минут займёт дообучение?'
  explanation: 20 000 × 400 = 8 млн токенов за эпоху, ×4 эпохи = 32 млн токенов. 32 000 000 / 4 000 = 8 000 секунд ≈ 133 минуты. Та же формула объясняет, почему SFT на 10 000 примерах по 512 токенов в 2 эпохи укладывается примерно в час на одной A100, а предобучение на триллионах токенов — в десятки тысяч GPU-часов.
  kind: numeric
  answer: 133.3
  tolerance: 2
  id: 006-sft-pipeline-1
  fingerprint: b1f0d87e
- concept: токены с нулевой маской участвуют в прямом проходе как контекст и исключаются только из подсчёта потерь
  question: В обучающей последовательности токены инструкции помечены в маске нулём. Что это означает для прямого прохода модели?
  explanation: 'Маска влияет на функцию потерь, а не на вход. Инструкция остаётся в контексте — без неё модель не смогла бы обусловить ответ. Нулём помечают то, за что не начисляется обучающий сигнал: иначе модель училась бы ещё и воспроизводить текст пользователя.'
  kind: choice
  options:
    - Токены инструкции вырезаются из входа, модель видит только ответ
    - Модель читает всю последовательность, включая инструкцию, но градиент считается только по токенам ответа
    - Токены инструкции заменяются нулевыми эмбеддингами перед подачей в модель
    - Внимание на токены инструкции отключается, чтобы они не влияли на предсказание
  correct: 1
  id: 006-sft-pipeline-2
  fingerprint: 373a879c
- concept: шаблон чата на инференсе должен совпадать с шаблоном обучения, потому что по служебным меткам модель распознаёт границу своей реплики
  question: Модель дообучили с шаблоном чата, где реплика ассистента начинается меткой <|assistant|>. На инференсе запрос подают сырым текстом, без служебных меток. Какой результат наиболее вероятен?
  explanation: 'Служебные метки — обычные токены, на которых модель выучила статистику: после <|assistant|> идёт выполненный ответ. Убрав их, вы возвращаете вход в режим, похожий на сырой текст предобучения. Знания при этом никуда не деваются — ломается только поведенческий формат, ради которого делался SFT.'
  kind: choice
  options:
    - 'Ответ будет тем же: метки нужны только на обучении, для построения маски'
    - Модель откажется генерировать что-либо, пока не получит метку роли
    - 'Качество следования инструкции упадёт: распределение входа не совпадает с обучающим, и модель скорее продолжит текст, чем ответит на него'
    - Модель потеряет фактические знания, полученные на предобучении
  correct: 2
