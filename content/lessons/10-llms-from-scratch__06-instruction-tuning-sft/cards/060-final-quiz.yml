- concept: маску потерь нарезают тем же сдвигом, что и targets, иначе обучающий сигнал уезжает на один токен
  question: 'Вход длиной L: логиты берутся без последней позиции, targets — со сдвигом на единицу. Каким срезом подать loss_mask, построенную по исходным input_ids?'
  explanation: 'Маска размечена по позициям input_ids, а loss считается по targets. Без среза [1:] единица, стоявшая на первом токене ответа, окажется напротив предсказания второго токена: первый токен ответа выпадет из обучения, а токен, идущий сразу за ответом, наоборот войдёт в него.'
  kind: cloze
  template: loss = masked_cross_entropy(logits[:, :-1], input_ids[:, 1:], loss_mask[:, ___])
  answer: '1:'
  accept:
    - '1:'
    - '1 :'
    - '[1:]'
    - 1:L
    - 1:None
  id: 060-final-quiz-1
  fingerprint: 1ea7487d
- concept: порядок проверки одного собранного обучающего примера до запуска SFT
  question: Расставь по порядку шаги проверки собранного батча SFT перед запуском обучения.
  explanation: 'Сначала проверяется сериализация (тот ли шаблон), потом выравнивание маски и targets, потом содержимое обучаемых позиций, и только затем нормировка loss. Обратный порядок бессмыслен: делить на число позиций, которые размечены не по тому шаблону, нечего.'
  kind: order
  items:
    - Декодировать input_ids обратно в текст и сверить строку с шаблоном чата токенизатора
    - 'Проверить выравнивание маски со сдвигом: маска подаётся тем же срезом, что и targets'
    - Декодировать только позиции с ненулевой маской и убедиться, что получилась ровно реплика ассистента вместе с её закрывающим маркером
    - Прогнать один батч и проверить, что сумма потерь делится на число немаскированных позиций
  id: 060-final-quiz-2
  fingerprint: fec00f60
