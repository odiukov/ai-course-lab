- concept: критерии успеха для оценки следования инструкциям фиксируют как наблюдаемые признаки поведения до запуска генерации
  question: 'Своими словами: почему перед прогоном отложенного набора записывают наблюдаемые признаки успеха, и чем такие признаки отличаются от впечатления «текст выглядит гладко»?'
  explanation: 'SFT меняет форму поведения, значит и метрика должна быть про форму: тема, число пунктов, соблюдение ограничений, отсутствие самопродолжения. Заранее записанный список защищает от подстройки критериев под результат.'
  kind: open
  reference: 'Признаки успеха — это проверяемые свойства ответа: он относится к теме запроса, соблюдает заданное число пунктов, выполняет ограничения инструкции (формат, порядок, длина) и не продолжает генерировать новые инструкции вместо ответа. Их фиксируют заранее, чтобы оценка не подгонялась под то, что модель выдала. Гладкость текста — свойство языковой модели, унаследованное из предобучения, и она сохраняется даже когда инструкция не выполнена; поэтому по ней нельзя судить об эффекте SFT. У крошечной модели слова вообще могут быть бессмысленными — тогда оценивают ту часть поведения, которую SFT должен был изменить: выдаёт ли модель ответ после маркера ответа и останавливается ли, а не сочиняет ли следующее задание.'
  id: 051-heldout-eval-2
  fingerprint: 8d00210c
- concept: отложенный набор для оценки SFT проверяет перенос поведения, а вопрос на неизвестный факт измеряет другое умение
  question: В отложенный набор для проверки SFT добавили инструкцию «Назови дату основания завода в посёлке, о котором модель никогда не встречала текстов». Что не так с таким пунктом?
  explanation: 'SFT перенастраивает способ использования уже имеющихся способностей, а не заливает новые факты. Пункт, ответ на который требует отсутствующего в предобучении знания, провалится независимо от того, научилась модель следовать инструкциям или нет, и потому ничего не измеряет. Годный пункт — новая формулировка того же навыка: если в обучении просили список из фруктов, на проверке просят пару музыкальных инструментов в алфавитном порядке.'
  kind: choice
  options:
    - 'Ничего: любой новый вопрос годится, раз его не было в обучающих парах'
    - Он измеряет наличие факта в весах, а не перенос поведения; провал здесь не говорит об инструкционной настройке
    - Он слишком длинный, поэтому ответ не поместится в контекстное окно
    - Он требует свободной формы ответа, а оценивать можно только ответы с фиксированным числом пунктов
  correct: 1
