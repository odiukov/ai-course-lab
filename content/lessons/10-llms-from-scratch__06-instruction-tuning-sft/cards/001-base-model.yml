- concept: базовая языковая модель выбирает самое вероятное продолжение текста, а форма вопроса не является для неё командой
  question: Базовой (только предобученной, без instruction tuning) языковой модели подают строку «Перечислите три причины инфляции.» Какой выход наиболее вероятен и почему?
  explanation: 'Предобучение оптимизирует только предсказание следующего токена по корпусу документов. В корпусе задания и вопросы часто идут списками, поэтому продолжение шаблона вероятнее ответа. Знания при этом есть — нет выученного шаблона «инструкция → ответ». Именно его добавляет SFT: у Llama 2 Chat хватило ~27 000 качественных пар.'
  kind: choice
  options:
    - Список из трёх причин, потому что модель распознаёт императив и выполняет инструкцию
    - Продолжение текстового шаблона — например, ещё один пункт задания вроде «Перечислите три причины дефляции.», потому что модель максимизирует вероятность следующего токена
    - Отказ отвечать, потому что без дообучения модель не имеет доступа к экономическим знаниям
    - Пустая строка, потому что модель не встречала императивов в обучающих данных
  correct: 1
  id: 001-base-model-1
  fingerprint: f8512961
- concept: SFT меняет поведение (формат ответа), а не объём знаний модели
  question: 'Базовая модель на вопрос о температуре кипения воды выдаёт новые похожие вопросы, а после SFT отвечает «100 °C при нормальном давлении». Объясни своими словами, что именно изменило дообучение: модель узнала новый факт или что-то другое?'
  explanation: 'Разрыв между GPT-3 и ChatGPT — та же архитектура и то же предобучение; отличие в наборе пар инструкция-ответ. Alpaca показала это за 52 000 примеров и 600 долларов: поведение переключается дёшево, знания — нет.'
  kind: open
  reference: 'Факт модель знала и до SFT — связь «вода — кипение — 100 °C» уже закодирована в весах после предобучения на большом корпусе. SFT почти не добавляет знаний: на десятках тысяч пар (инструкция, ответ) нельзя выучить новую фактологию. Дообучение меняет поведение: модель усваивает шаблон диалога — что после реплики пользователя надо выдать закрывающий ответ, а не продолжать текстовый узор. Отсюда и практический вывод: если факта в базовой модели нет, SFT его не создаст, нужны другие средства (RAG, продолженное предобучение).'
  id: 001-base-model-2
  fingerprint: '47507348'
- concept: из базовой модели ответ вытягивают, оформляя запрос как продолжение документа (few-shot / текстовый шаблон)
  question: Нужно получить полезный ответ от базовой модели, но дообучать её нельзя. Какой приём сработает лучше всего?
  explanation: 'Базовая модель умеет только продолжать. Значит, задачу надо переформулировать в продолжение: few-shot-шаблон делает самым вероятным следующим токеном именно ответ. Температура и капслок на это не влияют — они не меняют распределение шаблонов, выученных при предобучении. SFT автоматизирует то же самое, зашивая шаблон диалога в веса.'
  kind: choice
  options:
    - Написать запрос капслоком и добавить «ОТВЕТЬ НЕМЕДЛЕННО», чтобы усилить императив
    - 'Оформить вход как документ с уже начатым шаблоном: дать пару примеров «Вопрос: … Ответ: …», а в конце оставить незакрытым «Ответ:»'
    - Увеличить температуру сэмплирования, чтобы модель перебрала больше вариантов и нашла ответ
    - Подавать запрос по одному токену за шаг, чтобы модель успела обработать смысл просьбы
  correct: 1
  id: 001-base-model-3
  fingerprint: 7dd2de0d
