- concept: деградацию базовых способностей оценивают по относительному росту loss на контрольном тексте, а не по абсолютной разнице
  question: На независимом сыром тексте loss модели до SFT равен 4.10, после SFT — 4.92. На сколько процентов вырос loss?
  explanation: '(4.92 − 4.10) / 4.10 = 0.20, то есть 20%. Абсолютная разница 0.82 сама по себе ничего не говорит: та же разница при базе 20.0 дала бы рост около 4%, а при базе 2.0 — 41%. Порог тревоги (порядка десятка процентов) формулируют именно в относительных величинах, потому что кросс-энтропия — логарифмическая шкала и её уровень зависит от текста и токенизации.'
  kind: numeric
  answer: 20
  tolerance: 0.5
  id: 055-forgetting-metric-1
  fingerprint: a1039f10
- concept: замеры до и после дообучения сравнимы только при идентичных тексте, нарезке на окна и способе усреднения
  question: Инженер померил loss базовой модели на 30 окнах длиной 96 токенов, а после SFT — на другом отрывке того же корпуса, окнами по 256 токенов, усредняя по токенам, а не по окнам. Получил рост loss на 12%. Какой вывод корректен?
  explanation: Loss зависит от конкретного текста, от длины окна (в длинном окне у поздних позиций больше контекста, и loss обычно ниже) и от способа усреднения. Меняя разом текст, нарезку и нормировку, вы меняете сразу и измеряемую величину. Чтобы разница отражала эффект SFT, всё, кроме весов модели, должно быть зафиксировано.
  kind: choice
  options:
    - 'Рост нельзя приписать дообучению: изменились сам текст и процедура подсчёта, поэтому сравниваются разные измерения, а не две модели'
    - Рост 12% доказывает забывание, потому что относительное сравнение не зависит от длины окна
    - Рост 12% нужно поделить пополам, так как второе окно вдвое с лишним длиннее первого
    - Измерение корректно, если оба отрывка взяты из одного корпуса
  correct: 0
  id: 055-forgetting-metric-2
  fingerprint: a7d49d99
- concept: оценка забывания усредняется по многим окнам, потому что loss на одном коротком отрывке шумен
  question: Почему loss для контроля забывания считают как среднее по многим окнам текста, а не по одному отрывку в 80 токенов?
  explanation: 'Вопрос в дисперсии, а не в вычислимости или смещении: на 80 позициях случайные редкие слова легко дают колебание в несколько процентов — сопоставимое с искомым ростом. Среднее по десяткам окон уменьшает разброс, и наблюдаемое изменение (например, рост с 4.10 до 4.92) можно приписать модели, а не выбору фрагмента.'
  kind: choice
  options:
    - 'Один короткий отрывок даёт шумную оценку: несколько трудных или лёгких токенов сдвинут результат сильнее, чем сам эффект дообучения'
    - По одному окну кросс-энтропию вычислить нельзя — формула требует минимум двух окон
    - Усреднение по окнам делает loss независимым от размера словаря
    - Каждое отдельное окно даёт смещённую оценку, а среднее устраняет смещение
  correct: 0
  id: 055-forgetting-metric-3
  fingerprint: 83b5e906
