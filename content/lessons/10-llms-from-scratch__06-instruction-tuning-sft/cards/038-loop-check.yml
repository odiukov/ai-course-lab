- concept: нулевая маска убирает прямой вклад prompt-позиций в потери, но градиент ответа всё равно проходит через их активации по self-attention
  question: В SFT-примере 48 токенов, из них последние 18 — ответ ассистента, остальные маскированы. Что происходит с позициями промпта при обратном проходе?
  explanation: Маска обнуляет dlogits на 30 маскированных позициях — прямого штрафа там нет. Но токены ответа смотрят на промпт через attention, поэтому сигнал ошибки уходит назад в ключи и значения prompt-позиций и вносит вклад в градиенты весов. Маска задаёт, что считать ошибкой, а не какие части графа отключить.
  kind: choice
  options:
    - 'Они полностью исключены из обратного прохода: градиент по ним не считается вообще'
    - Прямого вклада в потери у них нет, но градиент от позиций ответа течёт через них по связям внимания и влияет на веса
    - Они получают такой же градиент, как позиции ответа, просто с меньшим коэффициентом
    - Их градиент считается, но обнуляется оптимизатором перед шагом обновления
  correct: 1
  id: 038-loop-check-1
  fingerprint: 2e9c5b72
- concept: градиент каждого параметра — своя производная по цепному правилу, а не общий для всех тензор сигнала ошибки на логитах
  question: Почему один и тот же градиент по логитам нельзя напрямую вычесть из весов слоёв модели? Объясни своими словами, что должно произойти между сигналом ошибки на логитах и обновлением конкретной матрицы весов.
  explanation: dlogits имеет форму (batch, seq_len, vocab_size) и физически не совпадает с формами W1, W2, эмбеддингов. Каждый параметр требует своей производной по цепному правилу.
  kind: open
  reference: 'Градиент по логитам — производная потерь по выходу модели, а не по параметрам. У каждой матрицы весов своя форма и свой путь влияния на логиты. Цепное правило перемножает локальные производные вдоль этого пути: производная потерь по выходу слоя умножается на производную выхода слоя по его параметру. Только так получается тензор нужной формы, направление которого действительно уменьшает masked loss. Без обратного прохода вычитание было бы изменением весов, не связанным с ошибкой.'
  id: 038-loop-check-2
  fingerprint: 9421cfa0
- concept: параметр, применённый многократно, накапливает градиент как сумму вкладов всех своих применений
  question: Матрица W1 feed-forward-слоя применяется к каждой из 32 позиций последовательности. Как получается её итоговый градиент?
  explanation: Один и тот же параметр лежит на нескольких путях к потерям, и многомерное цепное правило требует сложить вклады всех путей. Форма градиента при этом совпадает с формой самого W1, а число позиций влияет только на величину суммы.
  kind: choice
  options:
    - Берётся вклад последней позиции — остальные уже учтены в ней
    - Вклады всех позиций, где сигнал ошибки ненулевой, суммируются в один градиент той же формы, что W1
    - Считается 32 отдельных градиента, и оптимизатор делает 32 отдельных шага
    - Берётся максимальный по модулю вклад среди 32 позиций
  correct: 1
  id: 038-loop-check-3
  fingerprint: 86d4dd70
