- concept: эталонный ответ, нарушающий собственную инструкцию, активно обучает нарушению — противоречивая разметка хуже пропуска
  question: В SFT-наборе часть примеров содержит инструкцию «ответь одним предложением», а эталонный ответ занимает шесть абзацев. Объясни, почему такие примеры вредят сильнее, чем их полное отсутствие.
  explanation: 'Качество пары означает не только фактическую верность, но и фактическое соблюдение инструкции. Разметка — это демонстрация поведения: что показано, тому и учат. Противоречивые демонстрации размывают правило, ради которого делается SFT.'
  kind: open
  reference: 'Потери считаются на токенах эталонного ответа, поэтому модель учится воспроизводить именно длинный ответ при условии «одно предложение». Она усваивает, что ограничение по длине можно не соблюдать, и переносит это на другие инструкции с ограничениями. Отсутствие примера просто оставило бы поведение неопределённым, а противоречивый пример целенаправленно закрепляет неверное. То же происходит, когда разные разметчики отвечают на одинаковые просьбы по разным правилам: целевой формат становится несогласованным, и модели труднее вывести желаемое поведение.'
  id: 008-quality-quantity-2
  fingerprint: c0ab8c2b
- concept: 'разнообразие не компенсирует низкое качество: широкое покрытие размножает ошибки по всем типам задач'
  question: 'Два SFT-набора одного размера покрывают одинаково широкий спектр: пересказ, сравнение, заданный тон, отказ при нехватке данных. В первом ответы выверены; во втором примерно каждый четвёртый ответ содержит фактическую ошибку или нарушает своё же ограничение. Что даст второй набор?'
  explanation: Разнообразие задаёт, в скольких ситуациях модель применит выученное правило; качество задаёт, какое именно правило она выучит. При грязных ответах разнообразие лишь распространяет неверное поведение на больше сценариев. Обе оси нужны вместе, одна другую не заменяет.
  kind: choice
  options:
    - Ошибки разойдутся по всем типам задач — широкое покрытие усилит их, а не компенсирует
    - 'Ошибки взаимно погасятся: разнообразие усредняет шум между типами задач'
    - Результат совпадёт с первым набором, раз покрытие форматов одинаковое
    - Модель проигнорирует ошибочные примеры, так как они в меньшинстве
