- concept: 'градиенты весов получают обратным проходом: сигнал ошибки идёт от логитов через выходной слой и блоки к эмбеддингам'
  question: 'Трансформер из 6 блоков: посчитаны логиты и градиент потерь по логитам. Расставь шаги обратного прохода в порядке, в котором вычисляются градиенты параметров.'
  explanation: Градиент по логитам — только вход обратного прохода. Каждый вес получает градиент лишь тогда, когда сигнал ошибки дошёл до него по цепочке правил дифференцирования от выхода ко входу. Пока эта цепочка не пройдена, для параметров блоков и эмбеддингов градиента просто нет.
  kind: order
  items:
    - градиент по логитам передаётся в выходную проекцию, оттуда получают градиент её весов и градиент по скрытому состоянию последнего слоя
    - полученный градиент проходит через блок 6, затем 5 и далее вниз, давая на каждом шаге градиенты весов внимания и FFN этого блока
    - градиент, дошедший до входа первого блока, даёт градиенты матрицы эмбеддингов и позиционных векторов
    - оптимизатор применяет накопленные градиенты и сдвигает каждый параметр против его градиента
  id: 037-real-backward-1
  fingerprint: 61255f19
- concept: случайное возмущение весов статистически нейтрально к функции потерь, поскольку не зависит от сигнала ошибки
  question: Вместо обратного прохода к весам FFN прибавляют независимый гауссовский шум с нулевым средним и малой дисперсией. Что произойдёт с потерями в среднем по многим таким шагам?
  explanation: Направление шума выбрано без учёта того, какой токен целевой и какие позиции обучаемы. Симметричное распределение с нулевым средним не имеет предпочтения в сторону уменьшения потерь; ненулевой систематический эффект возникает только от второго порядка — дрейфа прочь от минимума. Градиент, наоборот, по построению указывает направление наибольшего роста потерь, и шаг против него уменьшает их гарантированно при достаточно малом lr.
  kind: choice
  options:
    - потери будут медленно убывать, потому что шаг мал и модель постепенно подстраивается под данные
    - 'потери не будут систематически убывать: шум не зависит от целевых токенов и маски, поэтому улучшение и ухудшение равновероятны, а в среднем накапливается уход от текущей точки'
    - потери будут убывать вдвое медленнее градиентного спуска, так как шум в среднем совпадает с половиной градиента
    - потери мгновенно вырастут до значения случайной инициализации
  correct: 1
  id: 037-real-backward-2
  fingerprint: efd105d2
- concept: обратный проход опирается на активации, сохранённые во время forward, поэтому их приходится держать в памяти
  question: Почему при обучении нейросети промежуточные активации прямого прохода хранят в памяти до конца обратного прохода?
  explanation: 'Градиент веса линейного слоя равен произведению входа этого слоя на градиент по его выходу; softmax-внимание и нормировки тоже требуют своих сохранённых значений. Без них обратный проход пришлось бы пересчитывать прямой проход заново (это и делает gradient checkpointing, разменивая память на вычисления). Отсюда же и порядок: сначала forward с сохранением, потом backward.'
  kind: choice
  options:
    - чтобы при расхождении обучения можно было откатить модель к предыдущему состоянию
    - потому что производная каждого слоя по его весам выражается через вход этого слоя и промежуточные величины, вычисленные при прямом проходе
    - потому что функция потерь считается повторно на каждом слое во время обратного прохода
    - чтобы маска потерь применялась к каждому слою отдельно
  correct: 1
  id: 037-real-backward-3
  fingerprint: c55f22cb
