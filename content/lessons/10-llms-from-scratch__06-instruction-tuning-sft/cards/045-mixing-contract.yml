- concept: 'фрагмент сырого текста в replay-смеси обучается без маски промпта: в loss входят все допустимые target-позиции'
  question: В обучающий набор вместе с парами инструкция-ответ подмешивают фрагменты сырого текста из предобучающего корпуса. Какие позиции такого фрагмента должны попасть в подсчёт loss?
  explanation: 'В паре инструкция-ответ маска нужна, потому что есть граница: запрос модель воспроизводить не должна. У сырого текста такой границы нет — вся последовательность является целевым продолжением, поэтому после сдвига маска состоит из единиц. Именно это и возвращает модели исходную задачу предсказания следующего токена.'
  kind: choice
  options:
    - Все допустимые target-позиции последовательности (все токены, кроме позиций, у которых нет следующего токена-цели)
    - Только вторая половина фрагмента — первая работает как псевдо-промпт
    - 'Ни одной: сырой текст подаётся исключительно как контекст, градиента с него не берут'
    - Только позиции после первого встреченного служебного маркера роли
  correct: 0
  id: 045-mixing-contract-1
  fingerprint: 7736a542
- concept: доля replay-примеров не равна доле их вклада в loss, если длины обучаемых участков различаются
  question: 'Набор из 1000 примеров: 970 пар инструкция-ответ (в среднем 50 обучаемых токенов ответа) и 30 фрагментов сырого текста (в среднем 400 обучаемых токенов). Loss усредняется по всем немаскированным позициям набора. Какой процент обучаемых токенов приходится на сырой текст? Ответ в процентах.'
  explanation: 970 × 50 = 48500 токенов от SFT, 30 × 400 = 12000 от сырого текста, всего 60500. 12000 / 60500 ≈ 0.198, то есть ~19.8% при доле примеров всего 3%. Доля, заданная в примерах, и доля вклада в градиент совпадают только при равных длинах обучаемых участков; длинные replay-фрагменты тянут обучение к простому продолжению текста сильнее заявленного.
  kind: numeric
  answer: 19.8
  tolerance: 0.5
  id: 045-mixing-contract-2
  fingerprint: 66cddadf
- concept: способ усреднения loss (по примерам или по токенам батча) меняет фактический вес длинных replay-фрагментов
  question: 'В батче лежат короткие SFT-ответы и длинные фрагменты сырого текста. Loss считают двумя способами: (A) среднее по всем немаскированным токенам батча, (B) сначала среднее внутри каждого примера, потом среднее по примерам. Чем эти способы различаются?'
  explanation: При усреднении по токенам батча длинный фрагмент вносит столько слагаемых, сколько у него обучаемых позиций, и потому доминирует. При усреднении по примерам длинный фрагмент и короткий ответ получают равный вес. Поэтому при подмешивании сырого текста фиксировать нужно не только долю примеров, но и длины последовательностей и схему усреднения — иначе фактическая доля replay-сигнала отличается от задуманной.
  kind: choice
  options:
    - В (A) вес примера растёт с числом его обучаемых токенов, в (B) все примеры весят одинаково независимо от длины
    - Они дают одно и то же значение, различается только скорость вычисления
    - В (B) вес примера растёт с длиной, а в (A) все примеры равны
    - В (A) градиент по маскированным позициям перестаёт быть нулевым
  correct: 0
  id: 045-mixing-contract-3
  fingerprint: c17a1a38
