- concept: обучение на фактах, отсутствовавших в предобучении, даёт форму уверенного ответа, а не надёжное знание
  question: Команда собрала датасет инструкций про внутренний продукт, о котором в корпусе предобучения не было ни строки, и провела SFT. Какой исход наиболее вероятен?
  explanation: 'SFT задаёт поведение: «на такой вопрос отвечай уверенно и в такой форме». Если опоры в весах нет, эта форма наполняется правдоподобным вымыслом. Для новых фактов нужны либо продолженное предобучение на большом объёме, либо подача фактов в контекст (поиск/RAG).'
  kind: choice
  options:
    - Модель усвоит формат уверенных ответов про продукт, но детали будет путать и выдумывать
    - Модель надёжно запомнит все детали продукта, потому что примеры видела многократно
    - Модель откажется отвечать про продукт, так как знания нет
    - Модель начнёт запрашивать недостающие данные у пользователя
  correct: 0
