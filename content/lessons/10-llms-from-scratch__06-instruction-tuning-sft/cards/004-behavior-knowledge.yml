- concept: отказ на вредный запрос — поведенческая цель SFT, а не пробел в знаниях модели
  question: Почему обучение модели отказывать на вредный запрос относят к настройке поведения, а не к добавлению знаний? Объясни своими словами.
  explanation: 'Отказ, ответ на вопрос, соблюдение формата — всё это варианты одной цели SFT: связать уже имеющееся содержание с уместным моментом и формой вывода. Отсюда практический вывод: обход отказа промптом не означает, что модель «узнала что-то новое», — знание было и раньше, менялась только поведенческая рамка.'
  kind: open
  reference: 'Содержательно модель могла бы сгенерировать вредный текст и до настройки — нужные фрагменты уже есть в весах после предобучения. Настройка не удаляет и не добавляет фактов, она меняет выбор продолжения: примеры показывают, что после запроса такого типа уместное продолжение — отказ, а не выполнение. То есть цель — политика ответа: что и в какой ситуации выдавать, при том же наборе знаний.'
  id: 004-behavior-knowledge-3
  fingerprint: 2bb7d682
