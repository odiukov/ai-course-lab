- concept: число обучаемых позиций у немаскированного фрагмента на единицу меньше его длины из-за сдвига targets
  question: В replay-смесь попал фрагмент сырого текста длиной 512 токенов без padding. Маска промпта к нему не применяется. Сколько позиций реально входит в подсчёт потерь?
  explanation: 'Цель на позиции i — токен i+1, поэтому у последнего токена цели нет. При длине L обучаемых позиций L−1: 512 − 1 = 511. Ошибка «512» означает, что в loss включили позицию без target.'
  kind: numeric
  answer: 511
  tolerance: 0.5
  id: 047-mixing-check-1
  fingerprint: d9611cb9
- concept: фрагмент сырого текста в replay-смеси подаётся без разметки ролей чат-шаблона
  question: Инженер добавляет в SFT-смесь куски сырого корпуса. Он оборачивает каждый кусок в чат-шаблон, ставя весь текст в реплику assistant. Чем это плохо?
  explanation: Replay нужен, чтобы освежить обычное продолжение текста, а не чтобы обучить новому поведению ответа. Разметка ролями превращает корпусный шум в образец реплики ассистента. Сырой фрагмент подают как есть, с маской из единиц на всех target-позициях.
  kind: choice
  options:
    - Модель связывает обычный текст с ролью ассистента и начинает выдавать куски корпуса в ответ на инструкции
    - Чат-шаблон удлиняет последовательность, и обучение замедляется в разы
    - Токены-разделители нельзя посчитать в loss, поэтому маска станет нулевой
  correct: 0
  id: 047-mixing-check-2
  fingerprint: 6690bf16
