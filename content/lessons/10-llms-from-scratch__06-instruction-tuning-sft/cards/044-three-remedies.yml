- concept: 'доля replay-данных — компромисс: слишком большая доля размывает целевое поведение, потому что обучающий сигнал смещается к обычному продолжению текста'
  question: Объясни своими словами, почему долю предобучающих фрагментов в SFT-наборе держат небольшой, а не доводят, скажем, до половины набора.
  explanation: 'Замешивание — регуляризация против забывания, а не вторая цель обучения. Отсюда единицы процентов: хватает встречного сигнала, чтобы общие способности не уехали, но основная масса градиентов всё ещё формирует нужное поведение.'
  kind: open
  reference: 'Частота поведения в данных задаёт частоту поведения у модели: чем больше доля сырых фрагментов, тем большая часть обучающего сигнала оптимизирует обычное продолжение текста, а не выполнение инструкций. При большой доле обучение сдвигается обратно к предобучению — модель хуже держит формат ответа, роли и остановку реплики, то есть цель SFT не достигается. Небольшая доля (единицы процентов) достаточна как напоминание об общих способностях, не перебивая основной сигнал. Это компромисс: доля подбирается по замерам — целевое поведение на отложенной проверке инструкций против качества на общих задачах вне SFT-набора.'
  id: 044-three-remedies-3
