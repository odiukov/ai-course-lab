- concept: расчёт числа replay-примеров по заданной доле в итоговом наборе
  question: SFT-набор содержит 48 000 пар инструкция-ответ. К ним добавляют фрагменты предобучающего текста так, чтобы они составили 4% итогового набора. Сколько фрагментов нужно добавить?
  explanation: 'Пары инструкций составляют 96% итога: 48 000 / 0,96 = 50 000 примеров всего. Значит фрагментов 50 000 − 48 000 = 2 000. Частая ошибка — взять 4% от 48 000 (1 920): доля задана от итогового набора, а не от исходного.'
  kind: numeric
  answer: 2000
  tolerance: 1
  id: 044-three-remedies-2
