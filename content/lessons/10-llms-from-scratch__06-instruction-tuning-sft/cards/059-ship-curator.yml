- concept: требование разнообразия управляет сбором данных только когда разложено на оси с категориями и целевыми долями
  question: 'В спецификации набора инструкций записано требование: «диалоги должны быть разнообразными». Что нужно добавить, чтобы это требование реально управляло сбором данных?'
  explanation: 'Слово «разнообразный» без структуры каждый куратор трактует по-своему, и два человека соберут несовместимые наборы. Разнообразие становится проверяемым, когда названы оси, внутри каждой — категории, и для категорий заданы доли: тогда покрытие видно заранее и его можно измерить. Общий объём, авторство и примеры-образцы покрытие не задают.'
  kind: choice
  options:
    - Перечень осей разнообразия (тип задачи, сложность, длина, число ходов, стиль) с категориями внутри каждой оси и желаемой долей каждой категории
    - Указание минимального общего числа примеров в наборе
    - Требование, чтобы каждый пример собирал отдельный человек
    - Список из нескольких образцовых диалогов, на которые нужно ориентироваться
  correct: 0
  id: 059-ship-curator-1
  fingerprint: 8e91f734
- concept: целевые доли по категориям оси переводятся в число примеров, которое куратор обязан собрать
  question: План курирования задаёт по оси «тип задачи» четыре категории с долями 45%, 25%, 20% и 10%. Целевой размер набора — 3200 примеров. Сколько примеров должно попасть в самую редкую категорию?
  explanation: '0.10 × 3200 = 320. Смысл долей в том, что они переводятся в проверяемые счётчики: куратор видит, добрал он категорию или нет, и приёмка набора не зависит от впечатления сборщика.'
  kind: numeric
  answer: 320
  tolerance: 1
  id: 059-ship-curator-2
  fingerprint: a4a66e8d
- concept: 'порядок проектирования плана сбора данных: от границ способности к единице данных, приёмке и квотам разнообразия'
  question: Расставь этапы проектирования плана сбора датасета инструкций в порядке, в котором каждый следующий опирается на предыдущий.
  explanation: 'Границы способности определяют, что вообще собирается; без них нельзя описать единицу данных. Схема единицы нужна, чтобы критерии приёмки указывали на конкретные поля. Квоты разнообразия ставятся последними: они распределяют уже определённые и приёмопригодные примеры по категориям.'
  kind: order
  items:
    - Зафиксировать целевую способность и её границы, включая то, что в набор попадать не должно
    - 'Описать единицу данных: поля, роли, допустимое число реплик, обязательные и необязательные элементы'
    - Сформулировать критерии приёмки примера через наблюдаемые признаки и пороги
    - Разложить разнообразие на оси, задать внутри них категории и желаемые доли
  id: 059-ship-curator-3
  fingerprint: 20170fb6
