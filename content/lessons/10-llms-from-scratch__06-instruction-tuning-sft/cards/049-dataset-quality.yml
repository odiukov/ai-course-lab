  question: 'Инженер считает длину ответа и разнообразие токенов для отбора SFT-примеров и токенизирует каждую реплику уже обёрнутой в чат-шаблон: маркеры ролей, BOS и EOS включены. Что это ломает в метриках?'
  explanation: 'Метрики оценивают содержимое пары, а не формат обучающей последовательности. Обёртка добавляет несколько токенов в числитель длины и несколько уникальных ID в разнообразие. Для ответа из 5 токенов эта добавка сравнима с самим ответом: он проскочит порог длины и получит завышенное разнообразие. Для ответа из 400 токенов эффект почти незаметен — то есть добавка неодинакова по влиянию и меняет относительный порядок примеров.'
