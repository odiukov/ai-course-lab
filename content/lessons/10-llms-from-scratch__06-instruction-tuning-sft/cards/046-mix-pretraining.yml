- concept: 'порядок сборки смешанной эпохи: унификация структуры каждого источника, затем отбор по доле, затем перемешивание'
  question: Собираешь одну эпоху из SFT-пар и фрагментов сырого корпуса под общий загрузчик батчей. Расставь шаги функции смешивания в правильном порядке.
  explanation: 'Смешивать можно только однотипные объекты: сначала оба источника приводятся к одной тройке тензоров, и лишь потом идёт отбор по доле и перемешивание. Если перемешать раньше унификации, загрузчик получит записи разной формы. Seed ставится на перемешивание, чтобы состав эпохи повторялся при сравнении с чистым SFT.'
  kind: order
  items:
    - Привести SFT-примеры к структуре input_ids / target_ids / loss_mask, сохранив маску только на токенах ответа
    - Нарезать сырой корпус на последовательности нужной длины и построить для них тот же сдвиг targets
    - Проставить сырым фрагментам маску на всех содержательных target-позициях и нули на padding
    - Отобрать из каждого источника количество примеров, отвечающее заданной доле
    - Объединить оба списка и перемешать генератором с фиксированным seed
  id: 046-mix-pretraining-1
  fingerprint: 7594aefe
- concept: padding-позиции остаются нулями в loss_mask даже у примеров без промпта
  question: Фрагмент сырого текста длиной 300 токенов уложен в окно фиксированной длины 512 и дополнен padding. Какие позиции должны получить единицу в loss_mask?
  explanation: «Полная маска» для сырого текста означает обучение на каждом следующем настоящем токене, а не на служебном дополнении. Padding — искусственный символ выравнивания длин; сделав его учебной целью, ты научишь модель порождать padding и заодно исказишь нормировку loss, потому что знаменатель раздуется на 212 бессмысленных позиций.
  kind: choice
  options:
    - Все 512 позиций окна — у сырого текста нет промпта, значит маска полная
    - Только позиции, где target — настоящий токен корпуса; позиции padding остаются нулями
    - Только вторая половина окна, чтобы у модели был контекст
    - 'Ни одна: у сырого текста нет реплики ассистента, поэтому loss на нём не считают'
  correct: 1
  id: 046-mix-pretraining-2
  fingerprint: 5f958973
- concept: заданную долю replay выдерживают на уровне эпохи, потому что в отдельном батче она не выражается целым числом примеров
  question: Доля сырого текста в смеси задана как 0.03, батч содержит 8 примеров. На каком уровне корректно выдерживать эту долю?
  explanation: 0.03 × 8 = 0.24 примера — целым числом это не выражается, а округление до 1 даёт фактические 12.5% вместо 3%, то есть вчетверо больше замысла. Поэтому доля соблюдается на всём наборе эпохи, а перемешивание распределяет сырые фрагменты по батчам естественным образом.
  kind: choice
  options:
    - 'В каждом батче: округлить 0.24 примера до одного сырого фрагмента на батч'
    - 'На уровне всей эпохи: отобрать нужное число сырых примеров на весь набор и перемешать список'
    - 'В каждом батче: чередовать батчи целиком из сырого текста и целиком из SFT-пар'
    - Долю вообще нельзя контролировать — она задаётся случайным перемешиванием
  correct: 1
  id: 046-mix-pretraining-3
  fingerprint: 4a8e1736
