- concept: 'два примера с похожим входом и несовместимыми ответами гасят сигнал: модель усваивает смесь и ведёт себя нестабильно'
  question: В SFT-наборе для чат-ассистента на почти одинаковую инструкцию «сократи текст» в одних примерах эталон — короткий пересказ, в других — полный текст с добавленным комментарием. Как это скажется на обученной модели?
  explanation: 'Обучение подгоняет распределение под данные, а не выбирает между версиями. Одинаковый вход с несовместимыми целями даёт распределение по обоим поведениям: ответ становится лотереей. Поэтому конфликтующие примеры вычитаются из полезного сигнала, а не складываются с ним.'
  kind: choice
  options:
    - Модель выберет тот вариант, который встретился первым по порядку файла
    - Модель усвоит смесь обоих поведений и будет непредсказуемо выдавать то одно, то другое
    - Противоречащие градиенты взаимно обнулятся, и инструкция «сократи» будет просто проигнорирована
    - Модель обнаружит конфликт и оставит только логически корректный вариант
  correct: 1
  id: 010-data-scale-check-1
  fingerprint: 3214454d
- concept: частота поведения в SFT-данных задаёт частоту этого поведения у модели
  question: В наборе 250 000 пар для SFT. В 12% примеров эталонный ответ игнорирует запрошенный формат (просили JSON — в ответе обычный текст). Остальные примеры формат соблюдают. Какую примерно долю ответов с нарушением формата (в процентах) стоит ожидать от обученной модели на похожих запросах?
  explanation: 'SFT учит воспроизводить распределение эталонных ответов. Поведение, представленное в 12% примеров, воспроизводится примерно с той же частотой — ошибки не «тонут» в большинстве, они становятся частью выученного распределения. Отсюда и правило: чистка данных даёт больше, чем добавление новых строк.'
  kind: numeric
  answer: 12
  tolerance: 3
