- concept: learning rate выбирают по итоговому уровню loss, а не по скорости начального спада
  question: 'Модель дообучают тремя SFT-прогонами, различающимися только learning rate. Прогон A: loss падает быстрее всех за первые 30 шагов, но к концу эпохи держится на 1.9. Прогон B: снижается плавнее и заканчивает на 1.1. Прогон C: за всю эпоху сдвинулся с 2.4 до 2.35. Какой прогон даёт лучший режим обучения?'
  explanation: 'Скорость первых шагов — не критерий. Крупный шаг быстро сбивает loss, а затем проскакивает минимум и оседает выше (A: 1.9). Слишком мелкий шаг вообще почти не двигает веса (C: 2.4 → 2.35). Смотрят на итоговый уровень: у B он 1.1.'
  kind: choice
  options:
    - A — раньше всех вышел на низкий loss, значит шаг подобран точнее
    - B — итоговый loss самый низкий, спад устойчивый
    - C — самая гладкая кривая, значит веса портятся меньше всего
    - 'Все три равнозначны: скорость спада зависит только от данных'
  correct: 1
  id: 042-hparams-check-1
  fingerprint: 5166252b
- concept: сравнение learning rate корректно только когда все прочие настройки прогонов зафиксированы
  question: Инженер сравнивает три значения learning rate и берёт тот прогон, где итоговый loss ниже. Объясни своими словами, что должно совпадать у этих трёх прогонов, чтобы вывод про learning rate был обоснованным.
  explanation: 'Экспериментальное сравнение learning rate — это контролируемый опыт: меняется один параметр. Если у прогона с меньшим шагом ещё и другой батч или другое число эпох, кривые сравнивать нельзя — вклад факторов не разделить.'
  kind: open
  reference: 'Learning rate должен быть единственной различающейся переменной. Совпадать обязаны: обучающая выборка и её порядок, число эпох и шагов, размер батча, длина последовательности, схема маскирования потерь, инициализация/базовые веса, оптимизатор и его прочие параметры, расписание шага и warmup, seed. Иначе разница в итоговом loss объясняется не learning rate, а изменившимся вторым фактором. Кроме того, сами значения loss сравнимы, только если считаются одинаково (одна нормировка) и желательно на одной отложенной выборке.'
  id: 042-hparams-check-2
  fingerprint: bca5e786
