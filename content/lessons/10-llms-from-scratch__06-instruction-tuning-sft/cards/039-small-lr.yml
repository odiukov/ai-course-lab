- concept: падающий loss на SFT-данных не свидетельствует о сохранности прочих способностей; деградацию ловят замером вне SFT-набора
  question: Во время SFT loss на обучающих парах стабильно снижается. Почему по одному этому графику нельзя заключить, что дообучение прошло удачно, и что нужно измерять дополнительно?
  explanation: Снижающийся обучающий loss означает лишь подгонку под маленький целевой датасет. Ущерб от чрезмерного шага виден только на данных вне SFT-набора, поэтому контрольные замеры берут за его пределами.
  kind: open
  reference: 'Loss на SFT-данных отражает только то, насколько хорошо модель подгоняется под целевые пары. Катастрофическое забывание проявляется вне этих данных: модель хуже продолжает обычный текст, путается в фактах, теряет способности, которых в SFT-наборе нет, и такой график этого не покажет. Нужны замеры на задачах вне SFT-набора: качество продолжения обычного текста, знаниевые бенчмарки, задачи из предобучающего распределения — до и после дообучения. Расхождение (SFT-loss падает, внешние метрики просели) указывает на слишком сильные обновления весов.'
  id: 039-small-lr-3
  fingerprint: d65c7cc5
