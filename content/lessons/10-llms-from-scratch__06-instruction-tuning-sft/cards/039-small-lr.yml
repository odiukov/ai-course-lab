- concept: опубликованное значение learning rate — ориентир на масштаб различия, а не константа, переносимая на другую модель и конфигурацию
  question: Инженер дообучает модель другой архитектуры и другого размера, чем та, для которой опубликован рецепт SFT. Он копирует learning rate из статьи один в один. Почему это ненадёжно?
  explanation: Числа из рецептов Llama 2 (пиковый 3e-4 при предобучении против 2e-5 при SFT) показывают масштаб различия между стадиями, а не универсальную константу. Абсолютное значение зависит от конкретной модели, размера батча и оптимизатора, поэтому его подбирают замерами, а не копированием.
  kind: choice
  options:
    - Оптимальный шаг зависит от модели, размера батча, оптимизатора и датасета; опубликованное число задаёт лишь порядок различия с предобучением и требует проверки на отложенной выборке
    - Опубликованные значения намеренно занижают, чтобы результат было нельзя воспроизвести
    - Learning rate вообще не влияет на итог SFT, если пары «инструкция — ответ» качественные
    - Чужой learning rate подойдёт всегда, если совпадает формат разметки диалогов
  correct: 0
