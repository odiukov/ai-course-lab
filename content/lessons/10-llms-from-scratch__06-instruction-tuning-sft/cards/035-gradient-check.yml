- concept: нулевую сумму по словарю нельзя использовать как признак отключённой маской позиции — нужна норма или максимум модуля
  question: Инженер проверяет, что маска потерь действительно обнулила обучающий сигнал на позициях промпта. Он берёт градиент логитов на такой позиции и считает сумму его элементов по оси словаря, ожидая ноль. Почему такая проверка не отличает маскированную позицию от обучаемой?
  explanation: 'У softmax-кросс-энтропии сумма градиента по словарю нулевая на любой позиции: (p − y) даёт 1 − 1 = 0. Маскированную позицию выдаёт только то, что каждый элемент нулевой, поэтому проверяют np.abs(grad).max() или норму вектора.'
  kind: choice
  options:
    - Сумма по словарю равна нулю и на обучаемой позиции тоже, поэтому нужно смотреть максимум модуля или норму вектора
    - Сумма по словарю на маскированной позиции равна размеру словаря, а не нулю
    - 'Сумма считается по неверной оси: складывать нужно по оси позиций, а не по оси словаря'
  correct: 0
  id: 035-gradient-check-1
  fingerprint: cfa3c303
- concept: величина градиента на целевом токене равна (p − 1), делённому на число обучаемых позиций
  question: В батче 8 немаскированных позиций ответа, градиент нормирован делением на это число. На одной такой позиции модель дала целевому токену вероятность 0.2. Чему равен элемент градиента логитов, соответствующий целевому токену?
  explanation: 'До нормировки элемент целевого токена равен p − 1 = 0.2 − 1 = −0.8. После деления на 8 обучаемых позиций: −0.8 / 8 = −0.1. Знак отрицательный, потому что шаг обучения повышает вероятность целевого токена.'
  kind: numeric
  answer: -0.1
  tolerance: 0.005
  id: 035-gradient-check-2
  fingerprint: 91c67e1b
- concept: равенство нулю у чисел с плавающей точкой проверяют по допуску, а не точным сравнением
  question: 'Тест проверяет, что сумма градиента по словарю на позиции ответа равна нулю, и падает: сумма равна 3.2e-17. Что тут правильнее всего сделать?'
  explanation: Сумма тысяч float32/float64 значений почти никогда не даёт машинный ноль. 3.2e-17 — типичный шум округления; аналитически сумма нулевая. Проверяют через допуск (np.allclose или сравнение модуля с 1e-8).
  kind: choice
  options:
    - Ослабить сравнение до допуска вида abs(s) < 1e-8, потому что накопление ошибок float неизбежно
    - Переписать softmax без вычитания максимума логитов — оно и вносит остаток
    - Считать сумму в порядке возрастания индексов словаря, тогда остаток обнулится
