- concept: сумма градиента softmax-кросс-энтропии по оси словаря на одной позиции равна нулю
  question: Градиент считается как probs минус one-hot целевого токена. Словарь — 3000 токенов, позиция обучаемая (маска = 1), нормировки ещё нет. Чему равна сумма всех 3000 компонент градиента в этой позиции?
  explanation: 'Вероятности softmax суммируются ровно в 1, а one-hot вычитает ровно одну единицу в ячейке целевого токена: 1 − 1 = 0. Размер словаря роли не играет — при 3000 или при 50000 сумма та же. Практический смысл: градиент только перераспределяет вероятностную массу, отбирая её у неверных токенов и отдавая целевому. Заметно ненулевая сумма по словарю — признак ошибки в softmax или в индексации target_ids.'
  kind: numeric
  answer: 0
  tolerance: 0.001
  id: 034-d-masked-ce-2
  fingerprint: e7d04611
- concept: возвращаемый градиент сохраняет форму logits целиком, а маскированные позиции присутствуют в нём нулевыми строками
  question: Батч из 8 последовательностей длины 200, словарь 4096 токенов; обучаемых токенов ответа во всём батче 350. Какую форму обязана вернуть функция градиента, чтобы её результат можно было передать в backward модели?
  explanation: 'Backward-проход требует тензор той же формы и того же dtype, что и выход forward: каждой ячейке logits нужна своя производная. Маскирование не сжимает тензор — оно записывает нули в 8·200 − 350 позиций промпта, и эти нули дальше по цепочке дают нулевой вклад в веса. Вариант (350, 4096) потерял бы соответствие позициям, а (8, 200) перепутал бы градиент по логитам с покомпонентной ошибкой.'
  kind: choice
  options:
    - (350, 4096) — только строки обучаемых позиций
    - (8, 200, 4096) — как у logits, маскированные позиции заполнены нулями
    - (8, 200) — по одному числу на позицию
    - (8, 350, 4096) — позиции промпта выброшены из каждой последовательности
  correct: 1
  id: 034-d-masked-ce-3
