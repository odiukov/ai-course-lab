  question: 'В отчёте о чат-модели указано: первая стадия SFT — 15000 примеров, затем сбор предпочтений и дообучение по ним. Инженер хочет повторить качество, обучив только SFT на 15000 примерах. В чём ошибка рассуждения?'
  explanation: У Llama 2 Chat ~27 000 примеров относятся именно к первой стадии SFT, а дальше шли дополнительные стадии настройки. Цитировать размер SFT-набора как цену всего итогового качества — значит сравнивать один этап чужого пайплайна со всем своим.
  kind: choice
  options:
