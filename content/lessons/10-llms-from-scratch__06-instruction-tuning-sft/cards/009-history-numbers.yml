  reference: Взять опубликованные числа только как порядок величины для стартового эксперимента (тысячи, а не миллионы). Собрать обозримый набор, обучить, прогнать отложенную проверку, покрывающую нужные типы инструкций. Смотреть, на каких типах поведение неустойчиво, и добавлять примеры именно туда, повторяя цикл, пока метрика на проверке не перестанет расти. Решение принимается по результату своей модели на своих задачах, а не по совпадению с чужим размером датасета.
