  question: Ты планируешь SFT и не знаешь, сколько пар инструкция-ответ собирать. Опиши, как определить нужный объём эмпирически, вместо того чтобы копировать число из чужой публикации.
  explanation: 'Alpaca, Llama 2 Chat и LIMA дают ориентир масштаба — счёт идёт на тысячи и десятки тысяч примеров. Но конкретный размер показывает только замер: покрывает ли набор нужные типы инструкций и стало ли поведение устойчивее на отдельной выборке.'
