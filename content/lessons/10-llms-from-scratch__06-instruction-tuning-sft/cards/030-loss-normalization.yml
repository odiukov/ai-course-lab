- concept: деление masked loss на полную длину последовательности занижает её в seq_len/N_resp раз
  question: 'Пример SFT: 96 токенов всего, из них 18 — токены ответа ассистента. Сумма потерь по немаскированным позициям равна 45.0. Какое значение потерь получится, если по ошибке разделить эту сумму на полную длину последовательности?'
  explanation: 45.0 / 96 ≈ 0.47 вместо правильных 45.0 / 18 = 2.5. Занижение ровно в 96/18 ≈ 5.3 раза — во столько же раз последовательность длиннее своей обучаемой части. Замаскированные позиции дают нули в числителе, поэтому в знаменателе им места нет.
  kind: numeric
  answer: 0.47
  tolerance: 0.02
  id: 030-loss-normalization-1
  fingerprint: 4558fcf3
- concept: нормировка по длине последовательности ставит вес примера в зависимость от длины промпта
  question: В батче два примера с ответами одинаковой длины и одинаковой суммой потерь на токенах ответа. Промпт первого — 12 токенов, второго — 60. Потери усредняют по полной длине последовательности. Что произойдёт при обучении?
  explanation: 'Числитель у примеров одинаков, а знаменатели разные: короткий промпт даёт меньший делитель и больший loss. Модель сильнее учится на примерах с короткими вопросами — чистый артефакт разметки. Деление на число токенов ответа убирает эту зависимость.'
  kind: choice
  options:
    - 'Оба примера дадут одинаковый вклад: суммы потерь на ответах совпадают'
    - Пример с коротким промптом даст больший вклад в градиент, хотя качество ответов одинаково
    - Пример с длинным промптом даст больший вклад, потому что содержит больше контекста
    - Вклад определится только длиной ответа, длина промпта на него не влияет
  correct: 1
  id: 030-loss-normalization-2
  fingerprint: 2211fd32
- concept: нулевая сумма маски требует явной проверки перед делением
  question: В функции masked cross-entropy сумма маски потерь используется как знаменатель. Почему перед делением нужна отдельная проверка этой суммы?
  explanation: Если маска целиком нулевая (обрезали пример так, что реплика ассистента не попала в окно), знаменатель равен нулю. Числитель тоже ноль, но деление даёт NaN и портит все веса на шаге оптимизации. Поэтому такой пример возвращает нулевые потери явно.
  kind: choice
  options:
    - Потому что сумма маски может оказаться дробной после паддинга
    - Потому что пример без единого токена ответа даёт нулевой знаменатель и деление на ноль
    - Потому что сумма маски должна равняться длине последовательности
    - Потому что иначе градиент пойдёт по токенам промпта
  correct: 1
  id: 030-loss-normalization-3
  fingerprint: 8a9b0628
