<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Путь примера через SFT-конвейер</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f9fc;
      --panel: #ffffff;
      --panel-soft: #eef3f8;
      --ink: #172033;
      --muted: #58657a;
      --line: #8b98aa;
      --blue: #3468c0;
      --blue-soft: #e8f0ff;
      --coral: #c84d55;
      --coral-soft: #fff0f1;
      --green: #2f7d55;
      --green-soft: #e8f7ef;
      --zero: #e8edf3;
      --one: #ffdadd;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --panel: #182131;
        --panel-soft: #202c3e;
        --ink: #edf3ff;
        --muted: #b3bfd1;
        --line: #75839a;
        --blue: #78a7ff;
        --blue-soft: #20365c;
        --coral: #ff8b92;
        --coral-soft: #4a292f;
        --green: #72d69c;
        --green-soft: #203f31;
        --zero: #293548;
        --one: #573039;
      }
    }

    html,
    body {
      margin: unset;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      background: var(--page);
    }

    h1 {
      margin: unset;
      font-size: 20px;
      line-height: normal;
      text-align: center;
      color: var(--ink);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      background: var(--page);
    }

    .stage,
    .detail,
    .result,
    .model {
      fill: var(--panel);
      stroke: var(--line);
      stroke-width: 2px;
    }

    .stage-emphasis {
      fill: var(--coral-soft);
      stroke: var(--coral);
      stroke-width: 2px;
    }

    .stage-success {
      fill: var(--green-soft);
      stroke: var(--green);
      stroke-width: 2px;
    }

    .token {
      fill: var(--blue-soft);
      stroke: var(--blue);
      stroke-width: 2px;
    }

    .mask-zero {
      fill: var(--zero);
      stroke: var(--line);
      stroke-width: 2px;
    }

    .mask-one {
      fill: var(--one);
      stroke: var(--coral);
      stroke-width: 2px;
    }

    .flow {
      fill: none;
      stroke: var(--blue);
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .loss-flow {
      fill: none;
      stroke: var(--coral);
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .guide {
      fill: none;
      stroke: var(--line);
      stroke-width: 2px;
      stroke-linecap: round;
    }

    .ink {
      fill: var(--ink);
    }

    .muted {
      fill: var(--muted);
    }

    .blue {
      fill: var(--blue);
    }

    .coral {
      fill: var(--coral);
    }

    .green {
      fill: var(--green);
    }

    .label {
      font-size: 14px;
      font-weight: bold;
    }

    .body {
      font-size: 13px;
    }

    .small {
      font-size: 12px;
    }

    .mask-text {
      font-size: 16px;
      font-weight: bold;
    }

    #fallback {
      font-size: 16px;
      color: var(--ink);
      background: var(--panel);
    }
  </style>
</head>
<body>
  <main>
    <h1>Путь одного примера через SFT-конвейер</h1>
    <svg id="diagram" viewBox="0 0 1120 430" width="1120" height="430"
         role="img" aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Путь примера через supervised fine-tuning</title>
      <desc id="svg-desc">Инструкция и ответ проходят через шаблон чата, токенизацию, маску ответа, прямой проход, masked loss, обратный проход и обновляют chat-модель.</desc>
      <g id="drawing"></g>
    </svg>
    <div id="fallback" hidden>
      Схема должна показать путь пары «Назови столицу Франции» — «Париж»:
      датасет инструкций → chat template → токенизация → маска ответа →
      forward → masked loss → backward → обновлённая chat-модель.
    </div>
  </main>

  <script>
    const DATA = [{
      canvas: { left: 0, top: 0, right: 1120, bottom: 430 },
      arrow: { length: 8, wing: 5 },
      stages: [
        { left: 14, top: 54, right: 137, bottom: 137, kind: "stage", lines: ["Датасет", "инструкций"], offsets: [-9, 10] },
        { left: 151, top: 54, right: 274, bottom: 137, kind: "stage", lines: ["Chat", "template"], offsets: [-9, 10] },
        { left: 288, top: 54, right: 411, bottom: 137, kind: "stage", lines: ["Токенизация"], offsets: [0] },
        { left: 425, top: 54, right: 548, bottom: 137, kind: "stage-emphasis", lines: ["Маска", "ответа"], offsets: [-9, 10] },
        { left: 562, top: 54, right: 685, bottom: 137, kind: "stage", lines: ["Forward", "вся цепочка"], offsets: [-9, 10] },
        { left: 699, top: 54, right: 822, bottom: 137, kind: "stage-emphasis", lines: ["Masked loss", "только ответ"], offsets: [-9, 10] },
        { left: 836, top: 54, right: 959, bottom: 137, kind: "stage", lines: ["Backward"], offsets: [0] },
        { left: 973, top: 54, right: 1096, bottom: 137, kind: "stage-success", lines: ["Обновлённая", "chat-модель"], offsets: [-9, 10] }
      ],
      stageArrows: [
        { x1: 137, x2: 151, y: 95 },
        { x1: 274, x2: 288, y: 95 },
        { x1: 411, x2: 425, y: 95 },
        { x1: 548, x2: 562, y: 95 },
        { x1: 685, x2: 699, y: 95 },
        { x1: 822, x2: 836, y: 95 },
        { x1: 959, x2: 973, y: 95 }
      ],
      pair: {
        box: { left: 14, top: 174, right: 238, bottom: 309 },
        title: { x: 28, y: 194, text: "Одна обучающая пара" },
        userTag: { x: 28, y: 222, text: "Инструкция" },
        user: { x: 28, y: 242, text: "«Назови столицу Франции»" },
        answerTag: { x: 28, y: 273, text: "Ответ" },
        answer: { x: 28, y: 293, text: "«Париж»" }
      },
      sequenceTitle: { x: 260, y: 190, text: "Единая последовательность после chat template и токенизации" },
      tokens: [
        { left: 260, right: 351, text: "user", mask: "0", maskKind: "mask-zero" },
        { left: 359, right: 442, text: "Назови", mask: "0", maskKind: "mask-zero" },
        { left: 450, right: 541, text: "столицу", mask: "0", maskKind: "mask-zero" },
        { left: 549, right: 642, text: "Франции", mask: "0", maskKind: "mask-zero" },
        { left: 650, right: 769, text: "assistant", mask: "0", maskKind: "mask-zero" },
        { left: 777, right: 864, text: "Париж", mask: "1", maskKind: "mask-one" }
      ],
      tokenBand: { top: 205, bottom: 237 },
      maskBand: { top: 250, bottom: 278 },
      tokenLabel: { x: 249, y: 221, text: "токены", offset: -8 },
      maskLabel: { x: 249, y: 264, text: "маска", offset: -8 },
      contextBrace: {
        left: 260, right: 864, y: 291, tickTop: 285, tickBottom: 297,
        labelX: 562, labelY: 313, text: "Модель видит все токены как контекст"
      },
      note: {
        box: { left: 884, top: 174, right: 1106, bottom: 309 },
        title: { x: 899, y: 196, text: "Что задаёт маска" },
        lines: [
          { x: 899, y: 224, text: "0 — токен виден," },
          { x: 899, y: 243, text: "но не оценивается" },
          { x: 899, y: 272, text: "1 — по токену ответа" },
          { x: 899, y: 291, text: "считается ошибка" }
        ]
      },
      model: {
        box: { left: 14, top: 337, right: 191, bottom: 416 },
        lines: [
          { x: 102, y: 362, text: "Веса модели" },
          { x: 102, y: 389, text: "читают контекст" }
        ]
      },
      prediction: {
        box: { left: 901, top: 329, right: 1106, bottom: 379 },
        lines: [
          { x: 1003, y: 347, text: "Предсказание ответа" },
          { x: 1003, y: 365, text: "сравнивается с «Париж»" }
        ]
      },
      forward: {
        x1: 208, x2: 886, y: 351,
        label: { x: 220, y: 338, text: "Forward: предсказание следующих токенов" }
      },
      backward: {
        x1: 901, x2: 208, y: 400,
        label: { x: 887, y: 417, text: "Backward: ошибка ответа возвращается к весам" }
      },
      bridge: { x: 973, y1: 137, y2: 164 },
      classes: {
        stageText: "label ink",
        bodyText: "body ink",
        smallText: "small muted",
        maskText: "mask-text ink"
      },
      math: { one: 1, negativeOne: -1, half: 2 }
    }];

    const origin = { x: 0, y: 0 };
    const scale = { x: 1, y: 1 };
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const [data] = DATA;

    try {
      const svgNS = "http://www.w3.org/2000/svg";
      const drawing = document.getElementById("drawing");

      const make = (tag, attributes, parent = drawing) => {
        const element = document.createElementNS(svgNS, tag);
        Object.entries(attributes).forEach(([name, value]) => {
          element.setAttribute(name, value);
        });
        parent.appendChild(element);
        return element;
      };

      const polygonBox = (box, className, parent = drawing) => {
        const points = [
          `${sx(box.left)},${sy(box.top)}`,
          `${sx(box.right)},${sy(box.top)}`,
          `${sx(box.right)},${sy(box.bottom)}`,
          `${sx(box.left)},${sy(box.bottom)}`
        ].join(" ");
        return make("polygon", { points, class: className }, parent);
      };

      const line = (x1, y1, x2, y2, className, parent = drawing) =>
        make("line", {
          x1: sx(x1), y1: sy(y1),
          x2: sx(x2), y2: sy(y2),
          class: className
        }, parent);

      const text = (x, y, value, className, anchor = "start", parent = drawing) => {
        const element = make("text", {
          x: sx(x),
          y: sy(y),
          class: className,
          "text-anchor": anchor,
          "dominant-baseline": "middle"
        }, parent);
        element.textContent = value;
        return element;
      };

      const arrow = (x1, y1, x2, y2, className, parent = drawing) => {
        line(x1, y1, x2, y2, className, parent);
        const direction = x2 > x1 ? data.math.one : data.math.negativeOne;
        line(
          x2,
          y2,
          x2 - direction * data.arrow.length,
          y2 - data.arrow.wing,
          className,
          parent
        );
        line(
          x2,
          y2,
          x2 - direction * data.arrow.length,
          y2 + data.arrow.wing,
          className,
          parent
        );
      };

      data.stageArrows.forEach(item => {
        arrow(item.x1, item.y, item.x2, item.y, "flow");
      });

      data.stages.forEach(stage => {
        polygonBox(stage, stage.kind);
        const centerX = (stage.left + stage.right) / data.math.half;
        const centerY = (stage.top + stage.bottom) / data.math.half;
        stage.lines.forEach((value, position) => {
          text(
            centerX,
            centerY + stage.offsets[position],
            value,
            data.classes.stageText,
            "middle"
          );
        });
      });

      line(
        data.bridge.x,
        data.bridge.y1,
        data.bridge.x,
        data.bridge.y2,
        "guide"
      );

      polygonBox(data.pair.box, "detail");
      text(
        data.pair.title.x,
        data.pair.title.y,
        data.pair.title.text,
        data.classes.stageText
      );
      text(
        data.pair.userTag.x,
        data.pair.userTag.y,
        data.pair.userTag.text,
        "small blue"
      );
      text(
        data.pair.user.x,
        data.pair.user.y,
        data.pair.user.text,
        data.classes.bodyText
      );
      text(
        data.pair.answerTag.x,
        data.pair.answerTag.y,
        data.pair.answerTag.text,
        "small coral"
      );
      text(
        data.pair.answer.x,
        data.pair.answer.y,
        data.pair.answer.text,
        data.classes.bodyText
      );

      text(
        data.sequenceTitle.x,
        data.sequenceTitle.y,
        data.sequenceTitle.text,
        data.classes.stageText
      );

      text(
        data.tokenLabel.x + data.tokenLabel.offset,
        data.tokenLabel.y,
        data.tokenLabel.text,
        data.classes.smallText,
        "end"
      );
      text(
        data.maskLabel.x + data.maskLabel.offset,
        data.maskLabel.y,
        data.maskLabel.text,
        data.classes.smallText,
        "end"
      );

      data.tokens.forEach(token => {
        const tokenBox = {
          left: token.left,
          top: data.tokenBand.top,
          right: token.right,
          bottom: data.tokenBand.bottom
        };
        const maskBox = {
          left: token.left,
          top: data.maskBand.top,
          right: token.right,
          bottom: data.maskBand.bottom
        };
        const centerX = (token.left + token.right) / data.math.half;
        const tokenY = (data.tokenBand.top + data.tokenBand.bottom) / data.math.half;
        const maskY = (data.maskBand.top + data.maskBand.bottom) / data.math.half;

        polygonBox(tokenBox, "token");
        polygonBox(maskBox, token.maskKind);
        text(centerX, tokenY, token.text, data.classes.bodyText, "middle");
        text(centerX, maskY, token.mask, data.classes.maskText, "middle");
      });

      line(
        data.contextBrace.left,
        data.contextBrace.y,
        data.contextBrace.right,
        data.contextBrace.y,
        "guide"
      );
      line(
        data.contextBrace.left,
        data.contextBrace.tickTop,
        data.contextBrace.left,
        data.contextBrace.tickBottom,
        "guide"
      );
      line(
        data.contextBrace.right,
        data.contextBrace.tickTop,
        data.contextBrace.right,
        data.contextBrace.tickBottom,
        "guide"
      );
      text(
        data.contextBrace.labelX,
        data.contextBrace.labelY,
        data.contextBrace.text,
        data.classes.smallText,
        "middle"
      );

      polygonBox(data.note.box, "detail");
      text(
        data.note.title.x,
        data.note.title.y,
        data.note.title.text,
        data.classes.stageText
      );
      data.note.lines.forEach(item => {
        text(item.x, item.y, item.text, data.classes.bodyText);
      });

      polygonBox(data.model.box, "model");
      data.model.lines.forEach(item => {
        text(item.x, item.y, item.text, data.classes.bodyText, "middle");
      });

      polygonBox(data.prediction.box, "result");
      data.prediction.lines.forEach(item => {
        text(item.x, item.y, item.text, data.classes.smallText, "middle");
      });

      arrow(
        data.forward.x1,
        data.forward.y,
        data.forward.x2,
        data.forward.y,
        "flow"
      );
      text(
        data.forward.label.x,
        data.forward.label.y,
        data.forward.label.text,
        "small blue"
      );

      arrow(
        data.backward.x1,
        data.backward.y,
        data.backward.x2,
        data.backward.y,
        "loss-flow"
      );
      text(
        data.backward.label.x,
        data.backward.label.y,
        data.backward.label.text,
        "small coral",
        "end"
      );
    } catch (error) {
      document.getElementById("diagram").hidden = true;
      document.getElementById("fallback").hidden = false;
    }
  </script>
</body>
</html>
