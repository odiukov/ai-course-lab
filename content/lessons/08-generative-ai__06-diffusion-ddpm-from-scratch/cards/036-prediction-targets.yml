- concept: v-prediction задаёт цель как зависящую от расписания комбинацию шума и чистого образца
  question: Заполните формулу цели v-prediction, если a_t обозначает амплитуду сигнала, σ_t — амплитуду шума, а x_clean — чистый образец.
  explanation: 'Коэффициенты двух компонентов меняются вместе с расписанием: v_t = a_t·ε − σ_t·x_clean. Поэтому целевая величина плавно переходит от шума к чистому образцу с противоположным знаком.'
  kind: cloze
  template: v_t = ___
  answer: a_t·ε − σ_t·x_clean
  accept:
    - a_t ε - σ_t x_clean
    - a_t*ε - σ_t*x_clean
  id: 036-prediction-targets-1
  fingerprint: 337ab340
- concept: наблюдаемость чистого образца и добавленного шума меняется местами на краях расписания
  question: Какой вариант верно описывает прямые цели предсказания на почти чистом и почти полностью зашумлённом состояниях?
  explanation: Когда шумовая амплитуда исчезающе мала, состояние почти совпадает с чистым образцом и конкретную реализацию шума трудно различить. Когда почти исчезает сигнал, состояние в основном показывает шум, а сведения о чистом образце становятся слабыми.
  kind: choice
  options:
    - На обоих краях непосредственно виден чистый образец, а добавленный шум скрыт.
    - На обоих краях непосредственно виден добавленный шум, а чистый образец скрыт.
    - На чистом краю непосредственно виден чистый образец, а на шумном — добавленный шум; другая компонента в каждом случае слабо наблюдаема.
  correct: 2
  id: 036-prediction-targets-2
  fingerprint: 4d226d9d
- concept: v-prediction не требует деления на исчезающе малую амплитуду сигнала или шума
  question: Объясните своими словами, почему v-prediction обычно численно устойчивее прямого предсказания шума или чистого образца у краёв расписания.
  explanation: Преимущество v-prediction связано с параметризацией, а не с появлением дополнительной информации. Цель остаётся комбинацией величин спокойного масштаба, тогда как пересчёт между прямыми целями у края может потребовать деления на очень малый коэффициент.
  kind: open
  reference: V-prediction смешивает шум и чистый образец с ограниченными коэффициентами расписания. При приближении к краю один коэффициент плавно исчезает, а другой становится доминирующим, поэтому для задания цели не требуется делить на почти нулевую амплитуду сигнала или шума. Это не восстанавливает уже потерянную информацию, но предотвращает резкое усиление ошибок.
  id: 036-prediction-targets-3
  fingerprint: f04a9fd3
