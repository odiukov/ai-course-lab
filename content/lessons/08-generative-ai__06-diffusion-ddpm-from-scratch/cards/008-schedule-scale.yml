- concept: стандартный нормальный старт обратного процесса требует почти полного разрушения сигнала к последнему прямому шагу
  question: К концу прямого процесса α̅_T остаётся равным 0,49, однако генерацию начинают из стандартного нормального шума. В чём основная проблема?
  explanation: Если α̅_T далеко от нуля, то x_T сохраняет заметный вклад x_0 и не является чистым стандартным нормальным шумом. Поэтому старт обратной цепочки из N(0, I) создаёт несовпадение распределений. В материале именно это происходит при T=40 и α̅_T ≈ 0,667.
  kind: choice
  options:
    - Начальное распределение генерации не совпадает с конечным распределением прямого процесса, которое ещё зависит от x_0
    - Невозможно вычислить MSE между истинным и предсказанным шумом
    - Обратный процесс обязательно становится детерминированным
    - Дисперсия прямого процесса становится отрицательной
