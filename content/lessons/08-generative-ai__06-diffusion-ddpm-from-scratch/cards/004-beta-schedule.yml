- concept: сохранившаяся доля сигнала накапливается как произведение коэффициентов отдельных шагов
  question: На каждом переходе сохраняется доля сигнала 0.95. Какая доля исходного сигнала сохранится после 12 переходов? Округли до сотых.
  explanation: 'Доли сохранения перемножаются: 0.95^12 ≈ 0.54. Поэтому итоговое зашумление зависит не только от размера каждой порции, но и от количества переходов. Например, диапазон β от 0.0001 до 0.02 за 40 шагов оставляет около 0.667 исходного сигнала.'
  kind: numeric
  answer: 0.54
  tolerance: 0.01
