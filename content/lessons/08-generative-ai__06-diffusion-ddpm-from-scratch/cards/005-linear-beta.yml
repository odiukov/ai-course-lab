- concept: включение обеих границ линейного расписания определяет число интервалов между значениями
  question: Линейное расписание содержит 7 значений от 0.03 до 0.21 включительно. Чему равно значение с индексом 3?
  explanation: Между семью точками шесть интервалов, поэтому шаг равен (0.21 − 0.03) / 6 = 0.03. Значение с индексом 3 равно 0.03 + 3 · 0.03 = 0.12.
  kind: numeric
  answer: 0.12
  tolerance: 0.000001
  id: 005-linear-beta-1
  fingerprint: b72e4f97
- concept: линейное расписание имеет постоянную разность соседних значений
  question: Какое свойство обязательно выполняется для корректно построенного линейного расписания β?
  explanation: При линейной интерполяции к каждому следующему значению прибавляется один и тот же шаг. Поэтому постоянны соседние разности, а не отношения или сумма списка.
  kind: choice
  options:
    - Разности между соседними значениями одинаковы
    - Отношения соседних значений одинаковы
    - Сумма всех значений равна конечной границе
