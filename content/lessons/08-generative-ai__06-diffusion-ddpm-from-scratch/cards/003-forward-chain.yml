- concept: марковское свойство прямого процесса DDPM
  question: В прямом процессе DDPM требуется получить следующее зашумлённое состояние изображения. От каких состояний условно зависит этот переход?
  explanation: 'Прямой процесс образует марковскую цепь: при известном текущем состоянии более ранние состояния не дают дополнительной информации для следующего перехода. Поэтому каждый шаг можно сэмплировать, используя только предыдущую версию изображения и заданное распределение шума.'
  kind: choice
  options:
    - Только от текущего состояния
    - От всей последовательности предыдущих состояний
    - Только от исходного чистого изображения
    - От текущего состояния и предсказания нейросети
  correct: 0
  id: 003-forward-chain-1
  fingerprint: bfc4a5e0
- concept: математическое ожидание одного гауссова перехода прямого процесса
  question: Перед одним переходом значение координаты изображения равно 10, а параметр шума β равен 0.19. Каково математическое ожидание этой координаты после перехода?
  explanation: Среднее перехода равно sqrt(1 − β), умноженному на прежнее значение. Здесь sqrt(1 − 0.19) = 0.9, поэтому ожидание равно 0.9 · 10 = 9. Добавляемый гауссов шум не меняет ожидание, поскольку имеет нулевое среднее.
  kind: numeric
  answer: 9
  tolerance: 0.01
  id: 003-forward-chain-2
  fingerprint: dc7b6992
