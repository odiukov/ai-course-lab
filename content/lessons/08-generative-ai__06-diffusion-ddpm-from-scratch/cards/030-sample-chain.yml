- concept: все используемые сэмплером массивы расписания должны быть его явными зависимостями
  question: Дополните сигнатуру так, чтобы функция не зависела от скрытой глобальной переменной.
  explanation: Тело обратного перехода обращается и к alphas, и к alpha_bars. Если alphas не передать явно, функция будет зависеть от внешнего состояния и может использовать неподходящее расписание или завершиться с ошибкой.
