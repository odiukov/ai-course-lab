- concept: при дистилляции студент приближает результат нескольких переходов учителя одним крупным переходом
  question: Объясни своими словами, почему дистилляция диффузионной модели — это не простое пропускание итераций учителя.
  explanation: Пропуск итераций оставляет старой модели незнакомую задачу большого перехода. При дистилляции выход длинного фрагмента траектории учителя становится ориентиром для обучения отдельного перехода студента.
  kind: open
  reference: Студента специально обучают отображать состояние на одном уровне шума в состояние, которое учитель получает после нескольких последовательных переходов. Поэтому студент осваивает новое крупное преобразование и использует заново обученные веса, а не просто запускает прежнюю модель по сокращённому расписанию.
  id: 041-distillation-2
