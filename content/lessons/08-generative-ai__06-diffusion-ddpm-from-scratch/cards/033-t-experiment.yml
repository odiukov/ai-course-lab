- concept: слишком крупные обратные шаги могут нарушить локально-гауссово приближение и разрушить мультимодальность
  question: Объясните своими словами, почему сильное сокращение числа шагов DDPM может привести к слиянию нескольких мод сгенерированного распределения.
  explanation: DDPM разбивает сложное преобразование распределения на небольшие обратные переходы. Если переходы становятся слишком крупными, используемое для них приближение теряет точность и структура распределения может сгладиться.
  kind: open
  reference: При малом числе шагов каждый обратный переход должен устранять слишком большую порцию шума. Такой переход хуже приближается простым гауссовым распределением, поэтому накопленная ошибка может сгладить промежуток между модами и слить пики.
  id: 033-t-experiment-2
  fingerprint: db8b2a5a
