- concept: совпадение среднего не гарантирует совпадения мультимодальных распределений
  question: Распределение данных имеет раздельные левую и правую моды, а в центре плотность мала. Генератор выдаёт единственный пик в центре, хотя среднее сгенерированной выборки совпадает со средним данных. Какой вывод верен?
  explanation: Среднее описывает лишь центральное положение значений и не показывает форму распределения. У смеси раздельных мод среднее может находиться в области, где настоящие примеры редки, поэтому центральный пик свидетельствует о потере мультимодальной структуры.
  kind: choice
  options:
    - Генератор выучил распределение, потому что совпало среднее
    - Генератор не воспроизвёл мультимодальную структуру распределения
    - Генератор выучил распределение, но сэмплирование добавило лишнюю моду
  correct: 1
  id: 032-toy-mixture-1
  fingerprint: d921ba09
- concept: оценка смеси требует сравнивать не только положения мод, но и их относительные веса
  question: На гистограмме генератора левый и правый пики находятся примерно там же, где у данных, но правый пик относительно левого заметно меньше, чем в исходной выборке. Что это говорит о выученном распределении?
  explanation: Наличие пиков в правильных местах проверяет расположение мод, но этого недостаточно. Соотношение массы около пиков отражает веса компонент смеси; исчезающий или слишком слабый пик указывает на недопредставление соответствующей моды.
  kind: open
  reference: Генератор уловил расположение мод, но занизил вероятность правой компоненты смеси. Следовательно, относительные веса компонент воспроизведены неверно и часть распределения недопредставлена.
  id: 032-toy-mixture-2
