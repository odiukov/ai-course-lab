- concept: замкнутая формула позволяет получить выборку из точного распределения состояния на произвольном шаге без вычисления промежуточных состояний
  question: Нужно сгенерировать состояние x_t прямого процесса DDPM из чистого образца. Что даёт замкнутая формула для q(x_t | x_clean)?
  explanation: Последовательные гауссовские переходы сворачиваются в одно гауссовское распределение q(x_t | x_0). Прямая выборка имеет то же распределение, но не обязана воспроизводить конкретную последовательную траекторию.
  kind: choice
  options:
    - Только приближение, которое становится точным при малом шуме
    - Выборку из того же распределения, что и последовательные переходы, без вычисления промежуточных состояний
    - Среднее состояние без случайной составляющей
    - Ту же конкретную траекторию зашумления, которая получилась бы при последовательной симуляции
  correct: 1
  id: 010-closed-form-1
  fingerprint: 4387033a
- concept: шум, использованный для синтеза зашумлённого образца, служит точной обучающей целью для модели предсказания шума
  question: При подготовке обучающего примера DDPM программа сама генерирует гауссовский шум eps и с его помощью получает x_t. Зачем сохранять eps вместе с x_t?
  explanation: 'Алгоритм сам зашумляет x_0, поэтому точно знает добавленный eps. Этот шум становится бесплатной целевой меткой: сеть получает x_t и момент t, а обучается предсказывать использованный eps.'
  kind: choice
  options:
    - Чтобы использовать eps как точную целевую метку для обучения сети предсказывать добавленный шум
    - Чтобы сеть могла восстановить расписание шума без заданных коэффициентов
    - Чтобы один и тот же шум обязательно применялся ко всему датасету
    - Чтобы заменить исходный чистый образец случайным шумом в обучающей выборке
  correct: 0
  id: 010-closed-form-2
