- concept: латентная диффузия зашумляет компактное представление объекта вместо исходных пикселей или отсчётов
  question: В генераторе изображений используется VAE и диффузионная модель в латентном пространстве. Что непосредственно зашумляется во время обучения диффузионной части?
  explanation: VAE-энкодер переводит изображение в компактный латентный код, и диффузионная модель работает именно с этим кодом. После обратной диффузии латентное представление можно декодировать обратно в изображение.
  kind: choice
  options:
    - Параметры VAE-энкодера
    - Готовое изображение после декодирования
    - Компактный латентный код изображения
    - Текстовое описание изображения
