- concept: денойзер для атомных координат должен учитывать геометрические симметрии пространства
  question: Модель удаляет шум из координат атомов молекулы. Какое свойство архитектуры особенно важно, чтобы поворот всей молекулы не менял понимание её структуры?
  explanation: Эквивариантная модель согласованно преобразует свои предсказания при повороте или другом допустимом преобразовании входных координат. Поэтому одна и та же молекулярная структура распознаётся независимо от её ориентации.
  kind: choice
  options:
    - Эквивариантность относительно пространственных преобразований
    - Обработка каждой координаты независимо от остальных
    - Обязательное преобразование координат в пиксельное изображение
    - Использование только одномерных свёрток без геометрической информации
