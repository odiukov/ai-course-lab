- concept: предсказание шума одной моделью должно быть обусловлено текущим шагом диффузии
  question: Почему модель предсказания шума εθ(x_t, t), обслуживающая всё расписание DDPM, должна получать t, а не только x_t? Объясните своими словами.
  explanation: По одному x_t уровень зашумления не всегда определяется однозначно. Условие на t позволяет общей модели выбирать поведение, соответствующее текущему распределению шума.
  kind: open
  reference: Текущий шаг определяет уровень шума и тем самым меняет оптимальную интерпретацию x_t. Визуально похожие входы на разных шагах могут требовать разных предсказаний, поэтому одной модели необходимо явно сообщать t.
  id: 013-time-condition-1
  fingerprint: 45bf6224
- concept: синусоидальный эмбеддинг кодирует шаг диффузии на нескольких частотных масштабах
  question: Какое свойство синусоидального эмбеддинга делает его подходящим для передачи шага t в диффузионную модель?
  explanation: Синусы и косинусы разных частот дают многомасштабное представление t. Близкие шаги получают близкие признаки, а различия между более удалёнными шагами остаются доступными сети.
  kind: choice
  options:
    - Он делает представления всех шагов взаимно ортогональными
    - Он превращает t в многомерный вектор, который плавно меняется для соседних шагов и отражает различия на нескольких масштабах
    - Он позволяет восстановить t исключительно из изображения и больше не подавать его в сеть
  correct: 1
  id: 013-time-condition-2
  fingerprint: 15de5fb3
- concept: FiLM передаёт временное условие через поканальные масштаб и сдвиг
  question: Как временной эмбеддинг обычно используется при FiLM-кондиционировании блоков диффузионной U-Net?
  explanation: При FiLM эмбеддинг шага преобразуется в параметры, которые масштабируют и сдвигают нормализованные каналы внутри блоков. Так один набор весов адаптирует обработку к разным уровням шума.
  kind: choice
  options:
    - Необработанное значение t дописывается к каждому пикселю как отдельный цветовой канал
    - Для каждого возможного t выбирается отдельная U-Net
    - Эмбеддинг проецируется в поканальные коэффициенты масштаба и сдвига для промежуточных признаков
  correct: 2
  id: 013-time-condition-3
  fingerprint: 15a93484
