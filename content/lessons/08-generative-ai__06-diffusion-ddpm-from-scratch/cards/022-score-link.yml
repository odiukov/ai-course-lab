- concept: score задаёт локальное направление наиболее быстрого роста логарифма плотности данных
  question: Что показывает score ∇ₓ log pₜ(x) в текущей точке пространства зашумлённых объектов?
  explanation: Score — градиент логарифма плотности по текущему состоянию. Он задаёт локальное направление роста плотности, а не расстояние, готовый маршрут или конкретный обучающий пример.
  kind: choice
  options:
    - Расстояние до ближайшего обучающего объекта
    - Вероятность того, что объект был добавлен в обучающую выборку
    - Величину шума, которую следует добавить на следующем шаге
    - Глобальный маршрут к единственному наиболее вероятному объекту
    - Локальное направление наиболее быстрого увеличения логарифма плотности
  correct: 4
  id: 022-score-link-1
  fingerprint: 2f825fa0
- concept: оценка score получается из предсказанного шума сменой направления и нормировкой на масштаб шума
  question: Модель предсказывает шум εθ(xₜ,t), а стандартное отклонение шумовой компоненты на этом уровне равно σₜ. Объясни, почему оценка score имеет направление −εθ(xₜ,t) и зачем её делят на σₜ.
  explanation: Связь имеет вид sθ(xₜ,t) ≈ −εθ(xₜ,t)/σₜ. Минус обращает направление добавленного возмущения, а нормировка делает величину score сопоставимой между уровнями с разным масштабом шума.
  kind: open
  reference: Предсказанный шум указывает направление внесённого возмущения, поэтому для движения к более плотным областям его направление меняют на противоположное. Деление на σₜ нормирует предсказание с учётом масштаба шума на выбранном уровне диффузии.
  id: 022-score-link-2
  fingerprint: 241a957d
