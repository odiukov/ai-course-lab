- concept: отношение дисперсий сигнала и шума определяется как α̅_t, делённое на дополнение α̅_t до единицы
  question: В прямом процессе DDPM α̅_t равен 0,21. Чему равно отношение дисперсии сигнала к дисперсии шума?
  explanation: Доля дисперсии сигнала равна 0,21, а шума — 0,79. Поэтому их отношение составляет 0,21 / 0,79 ≈ 0,266.
