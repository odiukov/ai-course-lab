- concept: коэффициенты сохранения сигнала и добавления шума на одном переходе дополняют друг друга до единицы
  question: На некотором переходе прямого процесса DDPM коэффициент шума β_t равен 0,07. Чему равен коэффициент сохранения сигнала α_t?
  explanation: По определению α_t = 1 − β_t, поэтому α_t = 1 − 0,07 = 0,93. Чем больше β_t, тем меньшая доля сигнала сохраняется на этом переходе.
  kind: numeric
  answer: 0.93
  tolerance: 0.001
  id: 006-alpha-bar-1
  fingerprint: cb0f7ba0
- concept: шумовое расписание нужно согласовывать с числом шагов диффузии
  question: Почему нельзя без проверки переносить один и тот же диапазон β_t из длинного расписания DDPM в значительно более короткое и ожидать, что x_T станет почти чистым шумом?
  explanation: Диапазон до β = 0,02 рассчитан на гораздо более длинную цепочку. При T = 40 получается α̅_T ≈ 0,667, поэтому в x_T остаётся заметная часть исходного сигнала.
  kind: open
  reference: В короткой цепочке происходит меньше зашумляющих переходов, поэтому суммарное ослабление сигнала может оказаться недостаточным. Нужно проверить конечное значение α̅_T и при необходимости усилить β-расписание.
  id: 006-alpha-bar-2
  fingerprint: 96b211f7
- concept: фиксированное накопленное расписание можно вычислить заранее и затем индексировать
  question: Расписание β_t фиксировано до начала обучения. Как эффективнее получать α̅_t внутри обучающего цикла?
  explanation: Значения β_t, α_t и α̅_t не зависят от данных или параметров модели. Поэтому весь массив alpha_bars достаточно построить один раз перед обучением, а затем читать нужный элемент по индексу.
  kind: choice
  options:
    - Один раз заранее вычислить массив всех α̅_t и брать нужное значение по индексу t
    - В каждом батче заново перемножать коэффициенты от начала расписания до t
    - Сделать α̅_t обучаемыми параметрами нейросети
