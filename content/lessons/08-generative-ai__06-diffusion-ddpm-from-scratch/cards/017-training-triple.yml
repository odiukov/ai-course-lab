- concept: порядок вычислений одного шага обучения DDPM определяется зависимостями между исходным объектом, шумом, входом модели и loss
  question: Расположите операции одного шага обучения DDPM с предсказанием шума в правильном порядке.
  explanation: Сначала выбираются исходные данные и уровень зашумления. Затем известный сгенерированный шум используется для получения xₜ. Только после этого модель может предсказать шум, а расхождение между ε и ε̂ становится loss для обновления параметров.
  kind: order
  items:
    - Выбрать чистый объект x₀ из обучающих данных
    - Случайно выбрать шаг диффузии t
    - Сгенерировать гауссов шум ε и построить зашумлённый объект xₜ
    - Передать xₜ и t в модель и получить предсказание ε̂
    - Вычислить ошибку между ε и ε̂ и обновить параметры модели
  id: 017-training-triple-2
  fingerprint: 81ccb62c
