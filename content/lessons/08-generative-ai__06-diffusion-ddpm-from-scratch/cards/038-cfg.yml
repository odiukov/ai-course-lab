- concept: итоговое предсказание classifier-free guidance экстраполирует условное предсказание вдоль разности условного и безусловного предсказаний
  question: Для одной компоненты предсказанного шума ε_cond = 11, ε_uncond = −2, а сила guidance w = 2. Чему равна соответствующая компонента ε_cfg?
  explanation: Используем эквивалентную запись ε_cfg = ε_cond + w·(ε_cond − ε_uncond). Получаем 11 + 2·(11 − (−2)) = 37. Это экстраполяция от условного предсказания в направлении, отделяющем его от безусловного.
  kind: numeric
  answer: 37
  tolerance: 0.01
  id: 038-cfg-1
  fingerprint: 903a5ed7
- concept: classifier-free guidance усиливает условие во время инференса без изменения весов диффузионной модели
  question: Как усилить влияние условия в уже обученной диффузионной модели с помощью classifier-free guidance?
  explanation: Classifier-free guidance — настройка инференса. Модель вызывают с условием и без него, после чего sampler усиливает направление их различия. Параметры модели и прямое шумовое расписание при этом не меняются.
  kind: choice
  options:
    - На каждом обратном шаге получить условное и безусловное предсказания шума, а затем смешать их в sampler’е
    - Повторно обучить модель с более быстрым шумовым расписанием
    - Заменить временной эмбеддинг на постоянный вектор условия
    - Добавить больше случайного шума только в начало обратного процесса
