- concept: параметризация среднего обратного перехода через шум превращает ошибку средних в MSE предсказания шума
  question: Объясни, почему KL-штраф обратного перехода DDPM можно выразить через ошибку между истинным шумом и предсказанием модели.
  explanation: Одинаковые части параметризации средних сокращаются. Остаётся разность между истинным шумом и его оценкой, умноженная на коэффициент, зависящий от расписания и дисперсии обратного перехода.
  kind: open
  reference: Средние истинного и модельного гауссовых переходов выражаются одной и той же формулой, но в первой используется истинный шум, а во второй — предсказанный. Поэтому их разность пропорциональна разности шумов, и квадратичная ошибка средних превращается во взвешенную MSE между истинным и предсказанным шумом.
  id: 023-elbo-mse-2
  fingerprint: 80735a32
- concept: simple loss удаляет зависящие от шага веса ELBO и тем самым меняет относительное влияние уровней шума
  question: Чем simple loss DDPM принципиально отличается от точной функции потерь, полученной из пошаговых KL-членов ELBO?
  explanation: Точная ELBO назначает MSE каждого шага свой коэффициент. Simple loss отбрасывает эти коэффициенты, поэтому уровни шума получают равный вес; это уже не точная ELBO, но такое перераспределение внимания модели может улучшить качество генерации.
  kind: choice
  options:
    - Он обучает модель восстанавливать только исходное изображение
    - Он оставляет ошибку предсказания шума, но убирает зависящие от шага веса
    - Он заменяет гауссовский прямой процесс детерминированным
    - Он вычисляет ошибку только на самом шумном состоянии
  correct: 1
  id: 023-elbo-mse-3
  fingerprint: f940a0b3
