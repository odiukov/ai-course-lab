- concept: температура меняет остроту распределения вероятностей, сохраняя порядок логитов
  question: Почему повышение положительной температуры обычно увеличивает разнообразие генерации, хотя токен с наибольшим логитом остаётся лидером?
  explanation: Низкая температура усиливает различия между логитами и приближает сэмплирование к greedy. Высокая температура сглаживает распределение и повышает шансы альтернативных токенов, не меняя их ранжирование.
  kind: open
  reference: Деление логитов на более высокую положительную температуру сжимает различия между ними. После softmax распределение становится более равномерным, поэтому менее вероятные токены чаще выпадают при сэмплировании. Порядок токенов не меняется, поскольку деление на одну и ту же положительную величину сохраняет порядок логитов.
  id: 028-greedy-temp-3
