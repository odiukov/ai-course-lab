- concept: greedy-декодирование выбирает токен с максимальным логитом
  question: Заполни пропуск в записи одного шага greedy-декодирования.
  explanation: 'Greedy-декодирование не выполняет случайную выборку: на каждом шаге оно берёт индекс наибольшего логита. Поэтому при неизменных модели и префиксе результат детерминирован.'
  kind: cloze
  template: next_token = argmax(___)
  answer: logits
  accept:
