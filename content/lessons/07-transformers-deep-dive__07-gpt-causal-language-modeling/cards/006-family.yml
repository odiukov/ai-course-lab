- concept: качество и поведение моделей с общим causal-ядром зависят от данных, масштаба, архитектурных доработок и post-training
  question: Две decoder-only causal-модели построены по одной базовой схеме, но одна заметно лучше решает задачи и точнее следует инструкциям. Объясни своими словами, какие различия между моделями могли дать такой результат.
  explanation: Общее вычислительное ядро не означает одинаковых возможностей. Знания и качество зависят от данных и масштаба, архитектурные улучшения повышают эффективность, а SFT, RLHF и DPO заметно меняют полезность ответов и следование инструкциям.
  kind: open
  reference: Разницу могут создавать объём и качество обучающих данных, число параметров и продолжительность обучения, архитектурные доработки, а также post-training — например, обучение на примерах хороших ответов или человеческих предпочтениях. Для этого не требуется менять базовую causal-схему модели.
  id: 006-family-2
