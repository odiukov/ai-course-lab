- concept: pre-norm, RoPE и SwiGLU улучшают разные части трансформера, сохраняя базовый decoder-only рецепт
  question: Объясни своими словами, какие части трансформера изменяют pre-norm, RoPE и SwiGLU и почему эти изменения не превращают GPT в принципиально другую архитектуру.
  explanation: Эти доработки отвечают за устойчивость нормализации, представление позиций и устройство FFN. Они позволяют надёжнее обучать крупные модели, не меняя основной принцип decoder-only causal transformer.
  kind: open
  reference: Pre-norm переносит нормализацию перед подслоем и помогает устойчивому прохождению сигнала и градиентов. RoPE кодирует позиции через преобразование запросов и ключей в attention. SwiGLU меняет внутреннее преобразование FFN на управляемое воротами. Все три решения совершенствуют существующие узлы, но сохраняют стек decoder-only блоков с causal self-attention и FFN.
  id: 038-recipe-2
  fingerprint: 47c10027
