- concept: статические обученные веса не зависят от содержимого последовательности, а скоры через Q и K зависят
  question: Матрица скоров S была выучена как отдельный набор параметров и после обучения не пересчитывается из входных токенов. Какое ограничение у такого механизма?
  explanation: Статическая S может выучить предпочтения между позициями, но не реагирует на конкретные слова. При S = QKᵀ / √dₖ скоры вычисляются из текущего содержимого, поэтому для разных текстов веса могут различаться.
  kind: choice
  options:
