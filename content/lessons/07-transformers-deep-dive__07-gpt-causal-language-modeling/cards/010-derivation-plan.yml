- concept: нижнетреугольная строчно-стохастическая матрица превращает каждый выход в выпуклую комбинацию элементов префикса
  question: Почему умножение нижнетреугольной строчно-стохастической матрицы весов на последовательность даёт в каждой позиции выпуклую комбинацию доступного префикса?
  explanation: Строчная стохастичность означает неотрицательные коэффициенты с единичной суммой. Нижнетреугольная форма ограничивает ненулевые коэффициенты текущей и предшествующими позициями.
  kind: open
  reference: В каждой строке веса неотрицательны и суммируются в единицу, а коэффициенты недоступных позиций равны нулю. Поэтому выход — взвешенная сумма только элементов префикса с общей массой весов, равной единице.
