- concept: max_new_tokens ограничивает длину продолжения без учёта токенов промпта
  question: Промпт после токенизации занимает 37 токенов. Генерация дошла до лимита max_new_tokens=12, не встретив токен завершения. Сколько токенов будет в итоговой последовательности?
  explanation: Для decoder-only модели результат содержит исходный промпт и сгенерированное продолжение. max_new_tokens ограничивает только продолжение, поэтому итоговая длина равна 37 + 12 = 49 токенов.
  kind: numeric
  answer: 49
  tolerance: 0.01
  id: 041-use-it-1
  fingerprint: 8dbdd360
- concept: параметр do_sample включает стохастическое сэмплирование при генерации
  question: Подставь значение, которое включает случайный выбор следующего токена из распределения.
  explanation: При do_sample=True следующий токен сэмплируется из распределения. При do_sample=False и стандартных настройках генерация использует детерминированный выбор, поэтому одних параметров temperature и top_p недостаточно для включения сэмплирования.
  kind: cloze
