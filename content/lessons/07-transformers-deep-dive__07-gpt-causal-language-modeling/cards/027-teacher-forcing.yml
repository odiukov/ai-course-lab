- concept: teacher forcing подаёт модели истинный предыдущий токен вместо её собственного предсказания
  question: Как формируется вход модели при обучении с teacher forcing?
  explanation: При teacher forcing модель получает истинные предыдущие токены из обучающих данных, даже если её собственные предсказания были ошибочными. Собственные выходы подаются обратно на вход уже при авторегрессивной генерации.
  kind: choice
  options:
    - На каждом следующем месте используется токен, который модель предсказала ранее
    - На каждом следующем месте используется истинный предыдущий токен из обучающей последовательности
    - Все предыдущие токены заменяются самым вероятным токеном словаря
    - На вход подаются только токены, которые модель предсказала правильно
  correct: 1
  id: 027-teacher-forcing-1
  fingerprint: 0d7110a8
- concept: teacher forcing создаёт различие между условиями обучения и авторегрессивной генерации
  question: Объясните своими словами, какое различие между обучением и генерацией возникает из-за teacher forcing.
  explanation: 'Teacher forcing обеспечивает корректный контекст на обучении, но при генерации истинного продолжения нет: модель получает собственные результаты. Это несовпадение условий позволяет ранним ошибкам влиять на дальнейший текст.'
  kind: open
  reference: При обучении модель продолжает правильный префикс из данных, а при генерации использует собственные ранее сгенерированные токены. Поэтому во время генерации ошибочный токен может попасть обратно на вход и повлиять на последующие предсказания.
  id: 027-teacher-forcing-2
  fingerprint: ce8827fc
