- concept: масштабирование на √dₖ стабилизирует разброс attention-скоров при изменении размерности ключей
  question: Почему в scaled dot-product attention скалярные произведения запросов и ключей делят на √dₖ? Объясни, что происходило бы с softmax без этого деления при росте dₖ.
  explanation: Скалярное произведение суммирует вклад всех координат. Чем больше dₖ, тем шире разброс получаемых скоров; множитель 1/√dₖ компенсирует этот рост и не даёт softmax преждевременно схлопываться почти в one-hot распределение.
  kind: open
  reference: 'Если координаты запросов и ключей имеют сопоставимый разброс, дисперсия их скалярного произведения растёт примерно пропорционально dₖ, а типичный модуль — как √dₖ. Деление на √dₖ сохраняет масштаб скоров примерно постоянным. Без него большие по модулю скоры насыщали бы softmax: распределение становилось бы чрезмерно резким, а градиенты — менее полезными.'
  id: 017-stage3-2
  fingerprint: f245f451
