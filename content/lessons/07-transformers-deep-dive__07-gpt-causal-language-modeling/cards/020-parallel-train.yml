- concept: при обучении causal language model выдаёт предсказания для всех позиций последовательности параллельно
  question: Как causal language model обрабатывает обучающую последовательность при teacher forcing?
  explanation: Во время обучения вся последовательность обрабатывается совместно. Выход содержит отдельный набор логитов для каждой позиции, поэтому позиционные предсказания не требуют отдельных запусков модели.
  kind: choice
  options:
    - Запускается отдельно для каждого префикса и выдаёт логиты только его последней позиции
    - За общий forward pass выдаёт логиты на каждой позиции, после чего они сопоставляются с соответствующими целевыми токенами
    - Сначала генерирует всю новую последовательность, а затем сравнивает её с исходной
  correct: 1
  id: 020-parallel-train-1
  fingerprint: 4de130a1
- concept: общий обучающий loss получается усреднением позиционных cross-entropy-лоссов
  question: Заполни пропуск в формуле обучающей функции потерь.
  explanation: Cross-entropy вычисляется отдельно для каждой допустимой целевой позиции. Позиционные значения усредняются в скалярный loss, по которому затем выполняется backprop.
  kind: cloze
  template: L = ___{i ∈ valid positions} CE(logits_i, target_i)
  answer: mean
