- concept: параметры сэмплирования настраивают по одному и оценивают на серии генераций
  question: Объясни своими словами, почему при подборе параметров сэмплирования следует менять только один параметр за раз и проверять результат на нескольких генерациях одного промпта.
  explanation: Одновременное изменение температуры и фильтрации кандидатов не позволяет понять причину улучшения или ухудшения. Повторные прогоны показывают не отдельный пример, а характерный разброс результатов.
  kind: open
  reference: Изменение одного параметра позволяет связать наблюдаемый эффект именно с ним. Серия генераций нужна, потому что единичный стохастический результат может оказаться случайно удачным или неудачным и не отражать устойчивое поведение настройки.
