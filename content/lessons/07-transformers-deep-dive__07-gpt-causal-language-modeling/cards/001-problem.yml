- concept: языковая модель предсказывает условное распределение вероятностей следующего токена
  question: Что выдаёт causal language model для заданного текстового префикса?
  explanation: Модель оценивает каждый токен словаря как возможное продолжение при условии уже известных токенов. Конкретный следующий токен затем выбирается из этого распределения.
  kind: choice
  options:
    - Распределение вероятностей по всему словарю для следующего токена
    - Заранее подготовленное полное продолжение текста
    - Вероятность того, что весь префикс грамматически правильный
    - Единственный следующий токен без оценок других вариантов
  correct: 0
  id: 001-problem-1
  fingerprint: 0dea65f5
- concept: авторегрессивная генерация строит текст повторным предсказанием следующего токена
  question: Расположите действия одного цикла авторегрессивной генерации в правильном порядке.
  explanation: После добавления выбранного токена контекст становится длиннее, и модель заново вычисляет распределение для следующей позиции. Так последовательность порождается по одному токену.
  kind: order
  items:
    - Передать модели уже имеющийся префикс
    - Получить распределение вероятностей следующего токена
    - Выбрать токен из распределения
    - Добавить выбранный токен к префиксу
    - Повторить цикл с обновлённым префиксом
  id: 001-problem-2
  fingerprint: a8550e69
- concept: обучающие цели для next-token prediction берутся из самого текста
  question: Почему для обучения языковой модели методом next-token prediction не требуется вручную размечать правильное продолжение каждой позиции?
  explanation: 'Текст предоставляет собственную разметку: предыдущие токены образуют контекст, а следующий реально встретившийся токен становится целью. Такой обучающий сигнал называют самосупервизией.'
  kind: open
  reference: В готовой текстовой последовательности правильным целевым значением для каждой позиции служит фактически следующий токен. Поэтому входы и целевые ответы можно автоматически получить сдвигом одной и той же последовательности.
  id: 001-problem-3
  fingerprint: daa93aa9
