- concept: черновая модель предлагает кандидатов, но окончательное решение по каждому выходному токену остаётся за основной моделью
  question: Почему использование менее качественной черновой модели в speculative decoding не обязано снижать качество итоговой генерации?
  explanation: Ускорение возникает за счёт дешёвого построения кандидатов, а не за счёт передачи черновой модели права окончательного выбора. Поэтому итог остаётся под контролем основной модели.
  kind: open
  reference: Черновая модель лишь быстро предлагает продолжение. Основная модель проверяет предложенные токены, принимает подходящие и исправляет первое расхождение; непроверенный хвост не попадает в результат.
