- concept: top-p сохраняет минимальный набор наиболее вероятных токенов с суммарной вероятностью не ниже порога
  question: Расположи действия top-p-сэмплирования в правильном порядке.
  explanation: Top-p формирует ядро из самых вероятных токенов. В него обязательно входит токен, на котором накопленная сумма впервые достигает или превышает p; после отсечения хвоста вероятности нормируются заново.
  kind: order
  items:
    - Отсортировать токены по убыванию вероятности
    - Последовательно вычислить накопленную вероятность
    - Оставить минимальный префикс, накопленная вероятность которого не ниже p
    - Исключить остальные токены и перенормировать вероятности оставшихся
  id: 031-topp-1
  fingerprint: f6bfc761
- concept: размер множества кандидатов при top-p адаптируется к форме распределения вероятностей
  question: Как изменится множество кандидатов при одном и том же пороге top-p, если в одной позиции распределение резко сосредоточено на лидере, а в другой почти равномерно распределено между многими токенами?
  explanation: Top-p фиксирует накопленную долю вероятности, а не число токенов. Поэтому вероятность 0.94 уже одна превышает порог 0.9, тогда как при плоском распределении для достижения того же порога потребуется много токенов.
  kind: choice
  options:
    - В первом случае кандидатов обычно будет меньше, а во втором — больше
    - В обоих случаях останется одинаковое количество кандидатов
    - В первом случае кандидатов обычно будет больше, а во втором — меньше
    - Форма распределения не влияет на результат top-p
