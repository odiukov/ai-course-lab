- concept: causal mask запрещает элементы выше главной диагонали, где позиция ключа находится в будущем относительно позиции запроса
  question: Объясни своими словами, почему запрещённые элементы causal mask образуют верхний треугольник матрицы.
  explanation: В causal self-attention каждая позиция может обращаться к себе и к прошлому, но не к позициям справа от неё. Поэтому минус бесконечность ставится во всех ячейках выше главной диагонали.
  kind: open
  reference: Для запроса в позиции i запрещены ключи с позицией j, если j больше i. Такие пары расположены выше главной диагонали; диагональ и элементы под ней соответствуют текущей и прошлым позициям и остаются доступными.
  id: 003-mask-idea-2
  fingerprint: 55db7706
