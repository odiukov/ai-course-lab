- concept: отрицательный логарифм особенно сильно штрафует уверенные ошибки
  question: Объясни своими словами, как меняется штраф −ln(p), когда вероятность p правильного токена уменьшается и стремится к нулю.
  explanation: 'Логарифмический штраф нелинеен: для вероятностей 0.5 и 0.01 он составляет примерно 0.69 и 4.6 соответственно. Чем увереннее модель в ошибочном ответе, тем сильнее наказание.'
  kind: open
  reference: При уменьшении p штраф растёт, а при стремлении p к нулю неограниченно увеличивается. Поэтому модель получает особенно большой штраф, когда почти исключает правильный токен.
  id: 023-shift-2
  fingerprint: c2cc6736
