- concept: GPT и BERT обучаются восстанавливать токены при разных условиях контекста
  question: Какое сопоставление обучающих задач GPT и BERT корректно?
  explanation: 'Для GPT обучающая цель имеет вид P(x_t | x_{<t}): справа от предсказываемой позиции контекст недоступен. BERT оптимизирует P(x_masked | x_unmasked), поэтому при восстановлении маски может использовать незамаскированные токены и слева, и справа. Эта разница в loss формирует разные способности моделей.'
  kind: choice
  options:
    - GPT восстанавливает замаскированный токен по контексту с обеих сторон, а BERT предсказывает продолжение только по левому контексту
    - GPT предсказывает токен по предшествующему контексту, а BERT восстанавливает замаскированный токен по незамаскированному контексту с обеих сторон
    - Обе модели восстанавливают замаскированные токены по двустороннему контексту; различается только способ декодирования
    - Обе модели предсказывают продолжение по левому контексту; различается только размер словаря
  correct: 1
  id: 040-gpt-vs-bert-1
  fingerprint: 9a702f2e
- concept: пригодность модели к продолжению текста определяется обучающей целью, а не одним лишь сходством архитектурных блоков
  question: Почему модель, обученная только восстанавливать маски по двустороннему контексту, нельзя считать готовой заменой авторегрессивной модели для продолжения произвольного префикса?
  explanation: Архитектура задаёт, какие вычисления модель способна выполнять, но loss определяет, какое поведение закрепляется в весах. Masked language modeling обучает заполнению пропусков в двустороннем контексте, тогда как генерация продолжения требует отдельной причинной обучающей цели.
  kind: open
  reference: 'Её loss обучал решать другую условную задачу: находить скрытый токен внутри уже заданного окружения, включая правый контекст. Продолжение префикса требует предсказывать токены без какого-либо текста справа. Сходство attention-блоков не компенсирует отсутствие такой обучающей задачи.'
  id: 040-gpt-vs-bert-2
  fingerprint: '69975273'
