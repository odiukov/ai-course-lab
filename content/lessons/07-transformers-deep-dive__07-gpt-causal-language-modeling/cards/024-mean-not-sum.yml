- concept: суммарный loss смешивает качество предсказаний с длиной последовательности
  question: Две последовательности разной длины имеют одинаковый средний отрицательный логарифм вероятности правильного токена. Почему их суммарные loss различаются?
  explanation: Суммарный loss растёт и с позиционным штрафом, и с числом позиций. Поэтому большая сумма у длинной последовательности ещё не означает худшего качества предсказаний; для сравнения нужен штраф в расчёте на один токен.
  kind: choice
  options:
    - Более длинная последовательность обязательно предсказывается хуже
    - В более длинной последовательности учитывается больше позиционных штрафов
    - Средний позиционный штраф зависит от размера словаря
    - Короткая последовательность получает более высокие вероятности по определению
  correct: 1
  id: 024-mean-not-sum-1
  fingerprint: e32d9bfd
- concept: усреднение loss стабилизирует масштаб градиента при разном числе предсказываемых токенов
  question: Почему использование суммы позиционных loss может незаметно изменить эффективную скорость обучения, если батчи содержат разное число непустых токенов?
  explanation: При reduction='sum' длинный батч обычно создаёт более крупное обновление не из-за худших предсказаний, а из-за большего числа слагаемых. Среднее делает масштаб обновлений устойчивее к изменению числа токенов.
  kind: open
  reference: Градиент суммы складывается из градиентов всех токенов. Чем больше токенов участвует в батче, тем обычно больше масштаб итогового градиента и обновления весов при том же learning rate. Усреднение по учитываемым токенам ослабляет эту зависимость от размера или длины батча.
  id: 024-mean-not-sum-2
  fingerprint: c45faf82
