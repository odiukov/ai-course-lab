- concept: RLHF направляет поведение предобученной модели с помощью человеческих предпочтений
  question: Объясни своими словами, как человеческие предпочтения в RLHF помогают превратить базовую модель продолжения текста в чат-ассистента.
  explanation: Предобучение учит воспроизводить статистику текста, но не гарантирует полезного ответа пользователю. RLHF сдвигает поведение модели в сторону вариантов, которые люди считают более подходящими.
  kind: open
  reference: Люди сравнивают варианты ответов и указывают предпочтительные. Этот сигнал используют при post-training, чтобы модель чаще выбирала полезные и уместные ответы, а не просто правдоподобные продолжения исходного интернет-текста.
  id: 039-recipe2-2
  fingerprint: edf65c1a
