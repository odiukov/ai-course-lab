- concept: top-k-сэмплирование отбрасывает все токены вне фиксированного множества наиболее вероятных и перенормирует оставшиеся вероятности
  question: Расположи действия top-k-сэмплирования в правильном порядке.
  explanation: После отсечения хвоста сумма оставшихся вероятностей обычно меньше единицы, поэтому перед сэмплированием распределение необходимо перенормировать.
  kind: order
  items:
    - Упорядочить токены по убыванию вероятности
    - Оставить k наиболее вероятных токенов, а вероятности остальных обнулить
    - Разделить вероятности оставшихся токенов на их суммарную вероятность
    - Случайно выбрать токен из полученного распределения
  id: 029-topk-1
  fingerprint: 63a476d0
- concept: фиксированное k не позволяет top-k подстраивать размер множества кандидатов под форму распределения
  question: Объясни своими словами, почему одно и то же значение k может быть неудачным и для очень острого, и для почти плоского распределения вероятностей.
  explanation: Top-k учитывает место токена в рейтинге, но не разницу между вероятностями. Поэтому число доступных кандидатов всегда одинаково и не зависит от уверенности модели.
  kind: open
  reference: При остром распределении фиксированное k может оставить маловероятные токены вместе с явно лучшим кандидатом. При плоском распределении тот же порог по количеству может отбросить правдоподобные варианты, почти не уступающие оставленным.
  id: 029-topk-2
  fingerprint: dab6e7de
