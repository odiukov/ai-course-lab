- concept: корректное ускорение greedy-декодирования требует точного совпадения результата, а не только сходства текстов по смыслу
  question: Спекулятивный декодер работает быстрее обычного greedy-декодирования проверяющей модели, но иногда выдаёт другой токен. Какой вывод корректен?
  explanation: Для точного спекулятивного декодирования результат должен полностью совпадать с greedy-выводом проверяющей модели. Смысловая близость, высокая вероятность и редкость расхождений эту гарантию не заменяют.
  kind: choice
  options:
    - Это точное ускорение, если получившиеся тексты близки по смыслу
    - Это уже другой алгоритм генерации, а не точное ускорение исходного greedy-декодирования
    - Это точное ускорение, если несовпадающий токен имеет достаточно высокую вероятность
    - Это точное ускорение, если расхождения встречаются редко
  correct: 1
  id: 037-check-spec-1
  fingerprint: 136e4dc6
- concept: параллельная проверка амортизирует один проход большой модели по нескольким принятым токенам черновика
  question: Объясни своими словами, откуда в спекулятивном декодировании возникает ускорение, если окончательный выбор токенов всё равно определяет большая модель.
  explanation: Ускорение даёт не передача решений маленькой модели, а параллельная проверка нескольких позиций. Чем длиннее принимаемый согласованный префикс, тем больше последовательных вызовов большой модели удаётся амортизировать.
  kind: open
  reference: Большая модель проверяет сразу пачку предложенных продолжений параллельно. Если согласованный префикс содержит несколько токенов, один её проход заменяет несколько последовательных шагов обычного авторегрессивного greedy-декодирования.
  id: 037-check-spec-2
  fingerprint: abcbc5dc
