- concept: в step decay множитель gamma применяется по числу полностью пройденных интервалов step_size
  question: Для step decay заданы начальный learning rate 0.24, gamma = 0.25 и step_size = 12 эпох. Чему равен learning rate на эпохе 27?
  explanation: Число снижений равно floor(27 / 12) = 2. Поэтому learning rate равен 0.24 · 0.25² = 0.015. Между границами значение остаётся постоянным.
  kind: numeric
  answer: 0.015
  tolerance: 0.0001
  id: 008-step-decay-idea-1
  fingerprint: cce76981
- concept: границы снижения step decay приходится подбирать под датасет и архитектуру
  question: Step decay успешно настроили для одной модели, а затем без изменений перенесли на другую архитектуру и новый датасет. Почему качество обучения может ухудшиться?
  explanation: Step decay не анализирует ход обучения и не ищет подходящие моменты снижения. Границы, удачные для одной комбинации модели и данных, могут потребовать повторного подбора для другой.
  kind: choice
  options:
    - Заранее выбранные эпохи снижения могут оказаться неудачными для новой задачи
    - Step decay автоматически увеличивает learning rate при смене архитектуры
    - На новом датасете step decay превращается в плавное расписание
    - Step decay меняет направление вычисленных градиентов
  correct: 0
  id: 008-step-decay-idea-2
  fingerprint: 5ddb9ad1
- concept: резкая смена learning rate на границе step decay может вызвать временный скачок loss
  question: Почему временный скачок loss сразу после границы step decay не обязательно означает расходимость обучения?
  explanation: Step decay создаёт резкие переходы между постоянными уровнями learning rate. Из-за такого перехода loss иногда кратковременно подскакивает, даже если затем обучение стабилизируется.
  kind: open
  reference: На границе learning rate меняется скачком, поэтому режим оптимизации может временно перестроиться и loss способен ненадолго вырасти. О расходимости следует судить по дальнейшей динамике, а не по одному переходному скачку.
  id: 008-step-decay-idea-3
  fingerprint: da109d13
