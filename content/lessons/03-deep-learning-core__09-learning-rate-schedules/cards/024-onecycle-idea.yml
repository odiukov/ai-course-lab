- concept: рост learning rate в первой фазе one-cycle расширяет поиск за счёт регуляризующего шума
  question: Зачем политика one-cycle намеренно повышает learning rate в первой фазе обучения?
  explanation: Большой learning rate усиливает шум траектории и действует как регуляризация. Это помогает модели не закрепиться слишком рано в первой удобной впадине. Последующее снижение learning rate уже служит точной настройке найденного решения.
  kind: choice
  options:
    - Чтобы сделать траекторию оптимизации шумнее, исследовать больше областей ландшафта потерь и легче покидать неглубокие впадины
    - Чтобы гарантированно двигаться по направлению точного глобального минимума
    - Чтобы полностью устранить влияние случайности мини-батчей
    - Чтобы как можно раньше перейти к минимальным обновлениям параметров
  correct: 0
  id: 024-onecycle-idea-1
  fingerprint: 6ef911b0
- concept: one-cycle требует заранее известного бюджета обучения для размещения фаз роста и спада
  question: Почему для политики one-cycle нужно заранее знать общее число шагов обучения?
  explanation: 'One-cycle привязывает обе фазы к прогрессу всего обучения: сначала learning rate растёт до пика, затем падает до очень малого значения. Поэтому расписанию нужен общий бюджет, чтобы вовремя выполнить разворот и завершить спад.'
  kind: open
  reference: Положение пика learning rate и длительность последующего спада задаются относительно всего цикла. Без общего бюджета нельзя корректно определить, когда завершить расширение поиска и успеть снизить learning rate для финальной шлифовки.
  id: 024-onecycle-idea-2
  fingerprint: 3249dd3f
