- concept: разреженная выборка может пропустить экстремум learning rate между визуализируемыми шагами
  question: Расписание содержит очень узкий пик learning rate между соседними шагами, выбранными для текстового графика. Что покажет визуализация, если значения вычисляются только в выбранных точках?
  explanation: Текстовый график знает только вычисленные значения. Если пик находится между выбранными шагами, он не попадёт в выборку. Для проверки быстрых изменений нужно увеличить плотность точек или отдельно вычислить значения возле предполагаемого пика.
  kind: choice
  options:
    - Она автоматически восстановит точную высоту пика
    - Она может полностью пропустить пик и создать неверное впечатление о форме расписания
    - Она заменит пропущенный пик средним значением соседних точек
    - Она обязательно завершится ошибкой
  correct: 1
  id: 031-all-curves-1
  fingerprint: ae6a27f3
- concept: целочисленное округление длины полоски может скрыть малый положительный learning rate
  question: Объясни, почему в текстовом графике рядом с положительным числовым значением learning rate может оказаться пустая полоска.
  explanation: 'Полоска — квантованное представление: она передаёт только целое число символов. Поэтому отсутствие решёток не доказывает, что learning rate равен нулю; точное значение следует читать из числовой подписи.'
  kind: open
  reference: Длина полоски вычисляется в символах и приводится к целому числу. Если масштабированное значение меньше ширины одного символа, отбрасывание дробной части даёт пустую строку, хотя сам learning rate остаётся положительным.
  id: 031-all-curves-2
  fingerprint: 44bef5cb
