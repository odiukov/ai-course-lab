- concept: одинаковый learning rate может давать разные фактические обновления параметров
  question: Почему постоянный learning rate не гарантирует одинаковую величину обновления параметров на каждом шаге обучения?
  explanation: Learning rate — это множитель, а не готовый размер шага. При неизменном learning rate меняющаяся поправка приводит к разным обновлениям параметров.
  kind: open
  reference: Learning rate лишь масштабирует вычисленную оптимизатором поправку. Поскольку градиенты и другие составляющие этой поправки меняются по ходу обучения, фактические обновления тоже могут различаться.
