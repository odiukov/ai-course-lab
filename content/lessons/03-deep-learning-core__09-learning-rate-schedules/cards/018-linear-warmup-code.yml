- concept: linear warmup после завершения разгона должен ограничивать learning rate заданным максимумом
  question: Что произойдёт, если linear warmup всегда вычислять как lr_max * step / warmup_steps и не ограничивать долю разогрева?
  explanation: Когда step превышает warmup_steps, их отношение становится больше единицы. Без ограничения результат превысит lr_max, поэтому долю разогрева нужно ограничить сверху.
  kind: choice
  options:
    - После завершения warmup learning rate продолжит расти выше lr_max
    - После завершения warmup learning rate начнёт линейно снижаться
    - Learning rate останется равным lr_max на всех последующих шагах
  correct: 0
  id: 018-linear-warmup-code-1
  fingerprint: 80e01cd6
- concept: реализация ограниченного linear warmup сначала нормирует шаг, затем ограничивает прогресс и масштабирует его пиковым learning rate
  question: Расположи операции реализации linear warmup в правильном порядке.
  explanation: Сначала шаг переводится в безразмерную долю разогрева. Затем доля ограничивается, чтобы расписание перешло на плато, и только после этого масштабируется величиной lr_max.
  kind: order
  items:
    - Разделить текущий номер шага на warmup_steps
    - Ограничить полученную долю максимальной долей разогрева
    - Умножить ограниченную долю на lr_max
  id: 018-linear-warmup-code-2
  fingerprint: 20c991c0
