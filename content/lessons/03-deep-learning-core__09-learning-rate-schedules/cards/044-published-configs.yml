- concept: пиковый learning rate из публикации переносим только как ориентир, поскольку его масштаб зависит от полного рецепта обучения
  question: В опубликованном рецепте большого трансформера указан пиковый learning rate. Как корректнее использовать это значение при настройке свёрточной сети с другим оптимизатором?
  explanation: Абсолютные значения LR сравнимы только с учётом оптимизатора, архитектуры, batch size, данных и других настроек. Поэтому LR 0,1 у ResNet-50 и 3e-4 у Llama 3 нельзя считать взаимозаменяемыми настройками.
  kind: choice
  options:
    - 'Перенести без изменений: learning rate не зависит от архитектуры и оптимизатора'
    - Использовать как ориентир, а затем заново подобрать learning rate для нового рецепта
    - Пересчитать только пропорционально числу параметров модели
    - Перенести без изменений, если выбрана та же форма расписания
  correct: 1
  id: 044-published-configs-1
  fingerprint: 7b33c313
- concept: длительности warmup в токенах и шагах оптимизатора сравнивают только после приведения к общей единице
  question: Один отчёт задаёт warmup в обработанных токенах, а другой — в шагах оптимизатора. Почему нельзя сразу определить, где до выхода на пиковый LR произойдёт больше обновлений параметров, и какие данные нужны для сравнения?
  explanation: У GPT-3 warmup указан как 375 миллионов токенов, а у Llama 3 — как 2000 шагов. Без числа токенов на одно обновление эти величины нельзя напрямую сопоставить.
  kind: open
  reference: Нужно узнать эффективное число токенов на один шаг оптимизатора и перевести обе длительности в общую единицу. Оно зависит от batch size, длины последовательностей и накопления градиента. Если сравнивается доля обучения, также нужен полный бюджет каждого запуска.
  id: 044-published-configs-2
  fingerprint: c18a6a87
