- concept: устойчивое, но крайне медленное снижение loss указывает на слишком маленький learning rate
  question: Loss снижается без скачков, но модель очень долго остаётся почти на уровне случайной инициализации. Объясните, что это говорит о learning rate.
  explanation: Само по себе снижение loss ещё не означает удачную настройку. Если прогресс устойчивый, но едва заметный, размер обновлений, вероятнее всего, недостаточен.
