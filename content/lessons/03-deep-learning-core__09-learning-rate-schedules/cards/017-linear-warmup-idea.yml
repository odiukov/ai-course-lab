- concept: текущий learning rate при linear warmup пропорционален пройденной доле разгона
  question: Пиковый learning rate равен 0,024, а linear warmup рассчитан на 1200 обновлений. Какой learning rate будет использоваться после 300 обновлений?
  explanation: Пройдена доля 300 / 1200 от разгона, поэтому lr = 0,024 × 300 / 1200 = 0,006.
  kind: numeric
  answer: 0.006
  tolerance: 0.00001
  id: 017-linear-warmup-idea-1
  fingerprint: 09233df3
- concept: увеличение продолжительности linear warmup уменьшает скорость роста learning rate, но не меняет заданный пик
  question: Что произойдёт, если увеличить warmup_steps, сохранив прежний пиковый learning rate?
  explanation: При linear warmup прибавка за обновление равна lr_max / warmup_steps. Увеличение числа обновлений уменьшает эту прибавку, однако конечной целью остаётся тот же lr_max.
  kind: choice
  options:
    - Learning rate будет расти медленнее, но в конце разгона достигнет прежнего пика
    - Learning rate будет расти быстрее и превысит прежний пик
    - Learning rate останется постоянным на всём протяжении разгона
    - Пиковый learning rate уменьшится пропорционально продолжительности разгона
  correct: 0
  id: 017-linear-warmup-idea-2
  fingerprint: dc0dbd86
