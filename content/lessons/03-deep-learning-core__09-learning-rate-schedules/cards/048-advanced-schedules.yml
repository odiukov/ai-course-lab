- concept: warm restart повторно повышает learning rate без переинициализации параметров модели
  question: Что происходит при тёплом перезапуске в SGDR?
  explanation: Warm restart перезапускает косинусный цикл learning rate, а не само обучение. Накопленные параметры модели сохраняются, поэтому новый цикл продолжает поиск из уже достигнутой точки.
  kind: choice
  options:
    - Learning rate возвращается к верхней границе, а обучение продолжается с текущими параметрами модели
    - Параметры модели заново инициализируются, а learning rate остаётся минимальным
    - Модель загружает параметры из начала предыдущего цикла
    - Градиенты перестают вычисляться до завершения нового цикла
  correct: 0
  id: 048-advanced-schedules-1
  fingerprint: 750e8774
- concept: окно наблюдений и patience защищают адаптивное переключение learning rate от реакции на шум loss
  question: Расположите этапы надёжного обнаружения плато loss перед изменением learning rate.
  explanation: Решение по одному измерению слишком чувствительно к шуму. Окно показывает устойчивую тенденцию, а patience требует, чтобы отсутствие прогресса сохранялось достаточно долго.
  kind: order
  items:
    - Собрать окно последних измерений loss и вычислить устойчивую оценку его изменения
    - Определить, было ли значимое улучшение, а не одиночное случайное колебание
    - При отсутствии улучшения увеличить счётчик ожидания, а при улучшении сбросить его
    - Изменить learning rate только после достижения заданного patience
  id: 048-advanced-schedules-2
  fingerprint: 8ecd5e70
- concept: повышение learning rate при warm restart и снижение learning rate на плато решают разные задачи
  question: Объясните своими словами, почему warm restart повышает learning rate, а адаптивное правило при длительном плато может, наоборот, понижать его.
  explanation: 'Эти действия не противоречат друг другу: возврат к большому learning rate усиливает исследование пространства параметров, а снижение learning rate усиливает локальную доработку решения.'
  kind: open
  reference: Warm restart снова делает обновления крупнее, чтобы расширить поиск и попытаться выйти из текущей области. Снижение learning rate на плато делает обновления тоньше, когда требуется аккуратнее улучшать уже найденное решение. Выбор действия зависит от цели управления поиском.
  id: 048-advanced-schedules-3
  fingerprint: 6308712a
