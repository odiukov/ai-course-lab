- concept: заранее заданное расписание по номеру шага не реагирует автоматически на изменения loss
  question: Во время обучения loss неожиданно вырос. Как это повлияет на следующий learning rate, если используется заранее заданное расписание, зависящее только от номера шага?
  explanation: Обычное расписание вида lr = S(t) смотрит на номер шага и свои настройки, а не оценивает качество обучения. Поэтому оно не уменьшает learning rate автоматически из-за скачка loss.
  kind: open
  reference: 'Сам по себе рост loss ничего не изменит: расписание вычислит learning rate для следующего номера шага по заранее заданному правилу. Реакция на loss возможна только у расписания, которое специально использует эту метрику.'
