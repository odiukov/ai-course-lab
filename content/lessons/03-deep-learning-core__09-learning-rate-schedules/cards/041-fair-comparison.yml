- concept: расписания learning rate сравнивают при одинаковом числе обновлений параметров
  question: Два расписания обучали одну и ту же модель в одинаковых условиях, но первому разрешили выполнить больше обновлений параметров. У него оказался ниже итоговый loss. Какой вывод корректен?
  explanation: Дополнительные обновления сами по себе могут снизить loss. Для честного сравнения расписаниям дают одинаковое число шагов оптимизатора, чтобы бюджет обучения не становился смешивающим фактором.
  kind: choice
  options:
    - Первое расписание однозначно эффективнее
    - Результат нельзя приписать расписанию, потому что различался бюджет обучения
    - Второе расписание обязательно использовало слишком маленький learning rate
  correct: 1
  id: 041-fair-comparison-1
  fingerprint: cf92b5cc
- concept: лучший и конечный loss характеризуют разные свойства траектории обучения
  question: Расписание A достигло меньшего лучшего loss, чем расписание B, но завершило обучение с большим loss. Что следует из этих результатов?
  explanation: Лучший loss показывает наиболее удачную точку траектории, а конечный — состояние модели при завершении обучения. Их расхождение может указывать, что расписание достигло хорошей области, а затем ушло из неё.
  kind: choice
  options:
    - A кратковременно нашло лучшее решение, но не сохранило его до конца обучения
    - A безусловно лучше B, потому что важен только минимальный loss
    - B безусловно лучше A, потому что промежуточные значения loss не несут информации
  correct: 0
  id: 041-fair-comparison-2
  fingerprint: 8210d0a6
