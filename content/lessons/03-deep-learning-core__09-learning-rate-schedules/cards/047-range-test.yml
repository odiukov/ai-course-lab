- concept: пиковый learning rate выбирают с запасом перед началом устойчивого роста loss в LR range test
  question: На сглаженном графике LR range test loss сначала снижается, а затем устойчиво разворачивается вверх. Какой learning rate разумно взять за пиковый для основного обучения?
  explanation: Устойчивый разворот loss вверх указывает на приближение к нестабильному режиму. Сдвиг немного влево сохраняет полезно большой шаг, но оставляет запас до этой границы. Отдельный минимум может быть искажён шумом и предыдущими обновлениями модели.
  kind: choice
  options:
    - Learning rate точно в точке минимального измеренного loss
    - Learning rate немного левее начала устойчивого роста loss
    - Наибольший learning rate, достигнутый во время теста
    - Learning rate, при котором loss впервые начал снижаться
  correct: 1
  id: 047-range-test-1
  fingerprint: a2914223
- concept: после LR range test основное обучение начинают заново с исходных весов
  question: Почему после LR range test не следует просто продолжать основное обучение с получившимися весами?
  explanation: LR range test предназначен для диагностики допустимого масштаба шага. Модель в ходе него уже меняется и может испытать чрезмерно большие обновления, поэтому продолжение с этих весов смешало бы тест с основным экспериментом.
  kind: open
  reference: Во время теста learning rate намеренно проходит через широкий диапазон, включая потенциально нестабильные значения, поэтому итоговые веса отражают диагностический разгон, а не выбранный рецепт обучения. Нужно восстановить исходные веса и запустить основное расписание заново.
  id: 047-range-test-2
  fingerprint: 10c2e638
