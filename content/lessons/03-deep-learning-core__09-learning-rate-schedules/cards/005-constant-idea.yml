- concept: constant schedule подходит прежде всего для коротких экспериментов, небольших моделей и отладки
  question: В каком сценарии constant schedule наиболее оправдан как практический выбор?
  explanation: 'Constant schedule прост: нужно подобрать только одно значение learning rate. Поэтому он удобен для небольших моделей, коротких экспериментов и отладки, но редко оптимален для длительного обучения.'
  kind: choice
  options:
    - В коротком отладочном запуске небольшой модели, где важны простота и повторяемость
    - В длительном дорогом обучении, где требуется особенно точная финальная настройка
    - В любом обучении, поскольку постоянный learning rate гарантирует оптимальный результат
    - В запуске, где нужно получить максимальное итоговое качество без подбора learning rate
  correct: 0
