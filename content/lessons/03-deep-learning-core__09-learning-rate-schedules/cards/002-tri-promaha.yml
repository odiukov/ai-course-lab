- concept: колебания отличаются от расходимости тем, что loss остаётся ограниченным вблизи минимума
  question: Какой признак лучше всего отличает колебания около минимума от расходимости обучения?
  explanation: При колебаниях обновления перебрасывают параметры через минимум, но модель остаётся рядом с ним. При расходимости loss растёт, а параметры удаляются от области хороших решений.
  kind: choice
  options:
    - Loss почти не меняется с самого начала обучения
    - Loss медленно, но устойчиво снижается
    - После начального снижения loss остаётся ограниченным, но многократно растёт и падает около одного уровня
    - Loss быстро растёт, а параметры всё дальше уходят от удачного состояния
  correct: 2
  id: 002-tri-promaha-1
  fingerprint: cbf708c3
- concept: постоянный learning rate может быть подходящим в начале обучения и слишком большим возле минимума
  question: Объясни своими словами, почему один и тот же learning rate может сначала обеспечивать хорошее снижение loss, а затем вызывать колебания.
  explanation: Безопасный размер шага зависит от стадии обучения. Крупные шаги ускоряют раннее продвижение, а для точного приближения к минимуму нужны более мелкие обновления.
  kind: open
  reference: 'В начале параметры находятся далеко от минимума, поэтому сравнительно крупные обновления помогают быстро приблизиться к нему. Возле минимума тот же размер шага становится слишком грубым: обновления перескакивают через минимум, и loss начинает колебаться. Поэтому learning rate полезно уменьшать по ходу обучения.'
