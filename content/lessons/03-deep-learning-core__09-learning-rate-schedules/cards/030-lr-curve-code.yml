- concept: нулевой максимум требует безопасного масштаба только для вычисления полосок
  question: Объясни своими словами, как визуализатор learning rate должен обработать случай, когда все выбранные значения равны нулю.
  explanation: 'Подмена нужна лишь во внутреннем масштабе визуализации. Изменять сами значения learning rate нельзя: иначе вывод перестанет верно описывать расписание.'
  kind: open
  reference: Нужно оставить вычисленные learning rate нулевыми, а для знаменателя при масштабировании полосок взять любое положительное служебное значение. Тогда деления на ноль не будет, а полоски останутся пустыми.
