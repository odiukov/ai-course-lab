- concept: текущий learning rate в cosine annealing вычисляется по положению шага на косинусной кривой
  question: Cosine annealing задан формулой lr(t) = lr_min + 0.5 × (lr_max − lr_min) × (1 + cos(πt/T)). Чему равен learning rate при lr_max = 0.024, lr_min = 0.004 и t = T/3?
  explanation: При t = T/3 аргумент косинуса равен π/3, поэтому cos(π/3) = 0.5. Подстановка даёт 0.004 + 0.5 × 0.020 × 1.5 = 0.019.
  kind: numeric
  answer: 0.019
  tolerance: 0.000001
  id: 012-cosine-idea-1
  fingerprint: 311c9c9c
- concept: cosine annealing снижает learning rate непрерывно, мягче у краёв и быстрее в середине
  question: Как меняется learning rate на протяжении одного полного периода cosine annealing от максимального значения к минимальному?
  explanation: Косинусная кривая имеет малый наклон в начале и конце интервала и наибольший по модулю наклон в середине. Поэтому learning rate меняется непрерывно и не образует ступенек.
  kind: choice
  options:
    - Уменьшается с постоянной скоростью по прямой
    - Резко падает в заранее выбранных точках, а между ними остаётся постоянным
    - Сначала уменьшается медленно, в середине быстрее, а к концу снова медленно — без скачков
  correct: 2
  id: 012-cosine-idea-2
  fingerprint: f1ca4c19
