- concept: положение максимума learning rate различает затухание, смену фаз и разгон
  question: 'Расположите расписания по времени достижения максимального learning rate: от самого раннего максимума к самому позднему.'
  explanation: Cosine annealing начинает с максимального learning rate и затем затухает. One-cycle достигает пика внутри обучения, переходя от роста к спаду. Чистый линейный warmup достигает максимума лишь в конце разгона.
  kind: order
  items:
    - Cosine annealing без warmup
    - One-cycle
    - Линейный warmup без последующей фазы
  id: 032-peak-step-idea-1
  fingerprint: 109a48f2
- concept: у постоянного расписания максимум достигается на всех шагах, а не в одной пиковой точке
  question: Заполните пропуск для constant schedule, если множество argmax содержит все моменты, в которых learning rate максимален.
  explanation: При constant schedule значение learning rate не меняется, поэтому максимум достигается на каждом шаге. Первый шаг нельзя считать отдельным пиком только потому, что максимальное значение впервые встретилось там.
  kind: cloze
  template: argmax_t lr(t) = ___
  answer: все шаги обучения
  accept:
    - каждый шаг обучения
    - множество всех шагов
    - все t
  id: 032-peak-step-idea-2
  fingerprint: 5e1c4ca7
