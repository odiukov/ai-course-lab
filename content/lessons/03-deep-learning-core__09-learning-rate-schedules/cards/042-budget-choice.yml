- concept: при неизвестном числе шагов безопаснее использовать постоянный learning rate с ручным снижением
  question: Число обновлений до остановки обучения заранее неизвестно. Какую стратегию learning rate безопаснее выбрать?
  explanation: Cosine, warmup и one-cycle размещают фазы относительно полной дистанции. Если момент окончания неизвестен, такая привязка ненадёжна, поэтому разумнее сохранять постоянный LR и снижать его вручную при замедлении прогресса.
  kind: choice
  options:
    - Постоянный learning rate с ручным снижением по ходу обучения
    - One-cycle с пиком и спадом, рассчитанными на предполагаемый момент остановки
    - Cosine decay, который достигает минимума в произвольно выбранный момент
    - Warmup с длительной cosine-фазой, привязанной к вымышленному общему бюджету
  correct: 0
  id: 042-budget-choice-1
  fingerprint: ff4a3bf7
- concept: при известном числе шагов выбор расписания зависит от вычислительного бюджета
  question: Общее число шагов известно. Какое соответствие между вычислительным бюджетом и расписанием наиболее обоснованно?
  explanation: One-cycle быстро проходит рост и спад LR, поэтому подходит для короткого запуска. Cosine annealing служит безопасной отправной точкой при среднем бюджете, а долгое обучение позволяет выделить начальную часть на warmup и затем выполнить продолжительное cosine decay.
  kind: choice
  options:
    - Короткий бюджет — warmup с cosine decay; средний — one-cycle; долгий — постоянный LR
    - Короткий бюджет — one-cycle; средний — cosine annealing; долгий — warmup с cosine decay
    - Короткий бюджет — cosine annealing; средний — постоянный LR; долгий — one-cycle
    - Для любого бюджета следует использовать одно и то же расписание
  correct: 1
  id: 042-budget-choice-2
  fingerprint: 5128a9f4
