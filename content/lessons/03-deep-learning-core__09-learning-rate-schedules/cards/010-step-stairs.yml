- concept: step decay образует график из горизонтальных участков и резких заранее заданных снижений
  question: Какой график learning rate характерен для step decay?
  explanation: Step decay сохраняет learning rate постоянным внутри каждого интервала и скачком уменьшает его на границе. Поэтому график выглядит как лестница; например, в материале значения меняются на эпохах 30, 60 и 90.
  kind: choice
  options:
    - Горизонтальные участки, разделённые резкими падениями в заданные моменты
    - Непрерывная прямая линия с постоянным отрицательным наклоном
    - Плавная периодическая волна с подъёмами и спадами
    - Случайные изменения после каждого шага оптимизатора
  correct: 0
  id: 010-step-stairs-1
  fingerprint: cfd6a4da
- concept: gamma равна отношению learning rate соседней ступени к learning rate предыдущей
  question: На одной ступени learning rate равен 0.48, а после перехода — 0.12. Каково значение gamma?
  explanation: При переходе новая ступень равна предыдущей, умноженной на gamma. Поэтому gamma = 0.12 / 0.48 = 0.25. В материале аналогично используется gamma = 0.1, то есть каждая ступень в 10 раз ниже предыдущей.
  kind: numeric
  answer: 0.25
  tolerance: 0.001
  id: 010-step-stairs-2
  fingerprint: 6dff3ca8
- concept: step_size управляет длительностью горизонтальных ступеней независимо от коэффициента их снижения
  question: Как изменить step decay, чтобы ступени стали короче по времени, но относительная величина каждого падения learning rate сохранилась?
  explanation: Step_size задаёт ширину ступени — число эпох между переходами. Gamma определяет, во сколько раз меняется learning rate при переходе, поэтому для сохранения высоты падений её менять не нужно.
  kind: choice
  options:
    - Уменьшить step_size, оставив gamma прежней
    - Уменьшить gamma, оставив step_size прежним
    - Увеличить начальный learning rate, оставив остальные настройки прежними
    - Увеличить step_size и gamma одновременно
  correct: 0
  id: 010-step-stairs-3
  fingerprint: 5fd5a5f7
