- concept: отдельная нормализация полосок показывает относительный, а не абсолютный масштаб learning rate
  question: Два расписания напечатаны как текстовые графики, причём длина полоски в каждом графике нормируется по максимальному LR этого расписания. У обоих графиков самые длинные полоски одинаковы. Какой вывод корректен?
  explanation: Каждый график делит значения на собственный максимальный LR. Поэтому длины полосок позволяют сравнивать форму и относительные изменения внутри расписания, но не абсолютный масштаб между отдельно нормированными графиками.
  kind: choice
  options:
    - Абсолютные максимальные learning rate у расписаний равны
    - Каждая длинная полоска обозначает максимум внутри своего графика, но абсолютные максимумы могут различаться
    - Расписания используют одинаковое число шагов
    - Минимальные learning rate у расписаний равны
  correct: 1
  id: 029-lr-curve-idea-1
  fingerprint: 6a6b6644
- concept: текстовая визуализация расписания строится вычислением LR в выбранных точках и нормированием по их максимуму
  question: Расположи действия для построения нормированного текстового графика learning rate в правильном порядке.
  explanation: 'Сначала нужны точки и соответствующие им значения LR. Их максимум задаёт масштаб: в материале пиковому значению соответствует полоска из 40 решёток, а остальные полоски показывают долю от этого пика.'
  kind: order
  items:
    - Выбрать шаги для проверки и убедиться, что среди них есть последний шаг обучения
    - Вычислить learning rate для каждого выбранного шага
    - Найти максимальный learning rate среди вычисленных значений
    - Преобразовать каждое значение в пропорциональную длину полоски
    - Напечатать шаг, числовое значение learning rate и полоску
  id: 029-lr-curve-idea-2
  fingerprint: 1fc79d26
