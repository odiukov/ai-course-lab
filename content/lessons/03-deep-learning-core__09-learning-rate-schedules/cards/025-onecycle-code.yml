- concept: one-cycle является немонотонным кусочно-линейным расписанием с отдельными фазами роста и спада
  question: Почему one-cycle нельзя корректно реализовать одной линейной интерполяцией от стартового learning rate к финальному?
  explanation: В первой половине LR растёт от `lr_max / 25` до `lr_max`, а во второй падает до `lr_max / 10000`. Следовательно, функция должна выбирать фазу и вычислять локальный прогресс внутри неё.
  kind: open
  reference: Одна линейная интерполяция монотонно соединит старт и финиш, поэтому не сможет сначала поднять learning rate до пика, а затем опустить его. Нужны две интерполяции с переключением в середине цикла.
  id: 025-onecycle-code-2
  fingerprint: dc0dc278
