<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ступеньки learning rate</title>
  <style>
    :root {
      color-scheme: light;
      --page-bg: #f8fafc;
      --panel-bg: #ffffff;
      --text: #172033;
      --muted: #64748b;
      --axis: #64748b;
      --guide: #cbd5e1;
      --step: #2563eb;
      --step-underlay: #dbeafe;
      --band-a: #eff6ff;
      --band-b: #f8fafc;
      --boundary: #dc2626;
      --fallback-bg: #fff7ed;
      --fallback-text: #9a3412;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page-bg);
      color: var(--text);
      font-family:
        system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      width: 100%;
    }

    .diagram {
      width: 100%;
      overflow: hidden;
      background: var(--panel-bg);
    }

    .diagram__header {
      padding: 18px 22px 8px;
    }

    .diagram__title {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
      font-weight: 750;
      letter-spacing: -0.02em;
    }

    .diagram__subtitle {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .diagram__stage {
      width: 100%;
      background: var(--panel-bg);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--panel-bg);
    }

    .period-band {
      stroke: none;
    }

    .period-band--a {
      fill: var(--band-a);
    }

    .period-band--b {
      fill: var(--band-b);
    }

    .axis {
      fill: none;
      stroke: var(--axis);
      stroke-width: 2;
      stroke-linecap: round;
    }

    .axis-arrow {
      fill: var(--axis);
      stroke: none;
    }

    .guide {
      fill: none;
      stroke: var(--guide);
      stroke-width: 2;
      stroke-dasharray: 8 7;
    }

    .boundary-mark {
      fill: var(--boundary);
      stroke: none;
    }

    .tick {
      stroke: var(--axis);
      stroke-width: 2;
      stroke-linecap: round;
    }

    .step-underlay {
      fill: none;
      stroke: var(--step-underlay);
      stroke-width: 10;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }

    .step-line {
      fill: none;
      stroke: var(--step);
      stroke-width: 6;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }

    .rate-label {
      fill: var(--text);
      font-size: 18px;
      font-weight: 750;
    }

    .range-label {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 550;
    }

    .tick-label {
      fill: var(--text);
      font-size: 15px;
      font-weight: 650;
    }

    .axis-label {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 650;
    }

    .note-label {
      fill: var(--boundary);
      font-size: 15px;
      font-weight: 700;
    }

    .fallback {
      margin: 18px 22px 22px;
      padding: 16px;
      background: var(--fallback-bg);
      color: var(--fallback-text);
      font-size: 15px;
      line-height: 1.5;
    }

    noscript {
      display: block;
      padding: 16px 22px 22px;
      color: var(--fallback-text);
      background: var(--fallback-bg);
      font-size: 15px;
      line-height: 1.5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --page-bg: #0b1120;
        --panel-bg: #111827;
        --text: #f1f5f9;
        --muted: #a8b3c5;
        --axis: #94a3b8;
        --guide: #475569;
        --step: #60a5fa;
        --step-underlay: #1e3a5f;
        --band-a: #14243d;
        --band-b: #111c2d;
        --boundary: #fb7185;
        --fallback-bg: #321b17;
        --fallback-text: #fdba74;
      }
    }
  </style>
</head>
<body>
  <figure class="diagram" aria-labelledby="diagram-heading">
    <figcaption class="diagram__header">
      <h1 class="diagram__title" id="diagram-heading">
        Ступеньки learning rate
      </h1>
      <p class="diagram__subtitle">
        Значение остаётся постоянным между заранее назначенными переходами.
      </p>
    </figcaption>

    <div class="diagram__stage" id="diagram-stage">
      <svg
        id="chart"
        viewBox="0 0 1100 490"
        preserveAspectRatio="xMidYMid meet"
        role="img"
        aria-labelledby="svg-title svg-description"
      >
        <title id="svg-title">Ступенчатое снижение learning rate</title>
        <desc id="svg-description">
          Learning rate равен 0,1 до эпохи 30, затем 0,01 до эпохи 60,
          затем 0,001 до эпохи 90 и после этого 0,0001.
        </desc>
      </svg>
      <noscript>
        Схема должна была показать четыре ступени: 0,1 на эпохах 0–29,
        0,01 на эпохах 30–59, 0,001 на эпохах 60–89 и 0,0001 начиная
        с эпохи 90.
      </noscript>
    </div>
  </figure>

  <script>
    const data = Object.freeze([
      Object.freeze({
        start: 0,
        end: 30,
        middle: 15,
        level: 4,
        rate: 0.1,
        label: "LR 0,1",
        range: "эпохи 0–29"
      }),
      Object.freeze({
        start: 30,
        end: 60,
        middle: 45,
        level: 3,
        rate: 0.01,
        label: "LR 0,01",
        range: "эпохи 30–59"
      }),
      Object.freeze({
        start: 60,
        end: 90,
        middle: 75,
        level: 2,
        rate: 0.001,
        label: "LR 0,001",
        range: "эпохи 60–89"
      }),
      Object.freeze({
        start: 90,
        end: 120,
        middle: 105,
        level: 1,
        rate: 0.0001,
        label: "LR 0,0001",
        range: "начиная с эпохи 90"
      })
    ]);

    const canvas = Object.freeze({ width: 1100, height: 490 });
    const labelOffset = Object.freeze({
      small: 8,
      normal: 14,
      side: 16,
      large: 34,
      tick: 28,
      note: 62
    });
    const lineWidth = Object.freeze({
      axis: 2,
      guide: 2,
      step: 6,
      underlay: 10
    });
    const fontSize = Object.freeze({
      range: 14,
      tick: 15,
      note: 15,
      rate: 18,
      heading: 22
    });

    const origin = Object.freeze({ x: 220, y: 400 });
    const scale = Object.freeze({ x: 6.9, y: 75 });

    const sx = (x) => origin.x + x * scale.x;
    const sy = (y) => origin.y - y * scale.y;

    try {
      const svg = document.getElementById("chart");
      const stage = document.getElementById("diagram-stage");

      if (!svg || !stage) {
        throw new Error("Не найден контейнер схемы");
      }

      const create = (tag, attributes, text) => {
        const node = document.createElementNS(svg.namespaceURI, tag);

        Object.entries(attributes || {}).forEach(([name, value]) => {
          node.setAttribute(name, String(value));
        });

        if (text !== undefined) {
          node.textContent = text;
        }

        return node;
      };

      const appendGroup = (className) => {
        const group = create("g", { class: className });
        svg.appendChild(group);
        return group;
      };

      const bandsGroup = appendGroup("bands");
      const guidesGroup = appendGroup("guides");
      const axesGroup = appendGroup("axes");
      const lineGroup = appendGroup("learning-rate-staircase");
      const labelsGroup = appendGroup("labels");

      const first = data[0];
      const second = data[1];
      const third = data[2];
      const last = data[data.length - 1];

      const xAxisStart = first.start;
      const xAxisEnd = last.end + labelOffset.normal / scale.x;
      const yAxisStart = first.start;
      const yAxisEnd = first.level + labelOffset.large / scale.y;
      const bandTopLift = labelOffset.normal / scale.y;
      const bandBottomLift = labelOffset.normal / scale.y;
      const tickHalfHeight = labelOffset.small / scale.y;
      const tickHalfWidth = labelOffset.small / scale.x;
      const arrowLengthX = labelOffset.large / scale.x;
      const arrowHalfHeight = labelOffset.small / scale.y;
      const arrowHalfWidth = labelOffset.small / scale.x;
      const arrowLengthY = labelOffset.large / scale.y;

      data.forEach((period, index) => {
        const top = period.level + bandTopLift;
        const bottom = bandBottomLift;

        bandsGroup.appendChild(
          create("rect", {
            class:
              index % second.level === first.start
                ? "period-band period-band--a"
                : "period-band period-band--b",
            x: sx(period.start),
            y: sy(top),
            width: sx(period.end) - sx(period.start),
            height: sy(bottom) - sy(top)
          })
        );
      });

      [second, third, last].forEach((period) => {
        guidesGroup.appendChild(
          create("line", {
            class: "guide",
            x1: sx(period.start),
            y1: sy(first.start),
            x2: sx(period.start),
            y2: sy(first.level)
          })
        );

        guidesGroup.appendChild(
          create("rect", {
            class: "boundary-mark",
            x: sx(period.start - tickHalfWidth),
            y: sy(first.start + tickHalfHeight),
            width:
              sx(period.start + tickHalfWidth) -
              sx(period.start - tickHalfWidth),
            height:
              sy(first.start - tickHalfHeight) -
              sy(first.start + tickHalfHeight)
          })
        );
      });

      axesGroup.appendChild(
        create("line", {
          class: "axis",
          x1: sx(xAxisStart),
          y1: sy(first.start),
          x2: sx(xAxisEnd),
          y2: sy(first.start)
        })
      );

      axesGroup.appendChild(
        create("polygon", {
          class: "axis-arrow",
          points: [
            `${sx(xAxisEnd)},${sy(first.start)}`,
            `${sx(xAxisEnd - arrowLengthX)},${sy(
              first.start + arrowHalfHeight
            )}`,
            `${sx(xAxisEnd - arrowLengthX)},${sy(
              first.start - arrowHalfHeight
            )}`
          ].join(" ")
        })
      );

      axesGroup.appendChild(
        create("line", {
          class: "axis",
          x1: sx(yAxisStart),
          y1: sy(first.start),
          x2: sx(yAxisStart),
          y2: sy(yAxisEnd)
        })
      );

      axesGroup.appendChild(
        create("polygon", {
          class: "axis-arrow",
          points: [
            `${sx(yAxisStart)},${sy(yAxisEnd)}`,
            `${sx(yAxisStart - arrowHalfWidth)},${sy(
              yAxisEnd - arrowLengthY
            )}`,
            `${sx(yAxisStart + arrowHalfWidth)},${sy(
              yAxisEnd - arrowLengthY
            )}`
          ].join(" ")
        })
      );

      data.forEach((period) => {
        axesGroup.appendChild(
          create("line", {
            class: "tick",
            x1: sx(first.start - tickHalfWidth),
            y1: sy(period.level),
            x2: sx(first.start + tickHalfWidth),
            y2: sy(period.level)
          })
        );
      });

      [first, second, third, last].forEach((period) => {
        axesGroup.appendChild(
          create("line", {
            class: "tick",
            x1: sx(period.start),
            y1: sy(first.start + tickHalfHeight),
            x2: sx(period.start),
            y2: sy(first.start - tickHalfHeight)
          })
        );
      });

      let staircasePath =
        `M ${sx(first.start)} ${sy(first.level)} ` +
        `H ${sx(first.end)} ` +
        `V ${sy(second.level)} ` +
        `H ${sx(second.end)} ` +
        `V ${sy(third.level)} ` +
        `H ${sx(third.end)} ` +
        `V ${sy(last.level)} ` +
        `H ${sx(last.end)}`;

      lineGroup.appendChild(
        create("path", {
          class: "step-underlay",
          d: staircasePath
        })
      );

      lineGroup.appendChild(
        create("path", {
          class: "step-line",
          d: staircasePath
        })
      );

      data.forEach((period) => {
        labelsGroup.appendChild(
          create(
            "text",
            {
              class: "rate-label",
              x: sx(period.middle),
              y: sy(period.level),
              dy: -labelOffset.normal,
              "text-anchor": "middle"
            },
            period.label
          )
        );

        labelsGroup.appendChild(
          create(
            "text",
            {
              class: "range-label",
              x: sx(period.middle),
              y: sy(period.level),
              dy: labelOffset.large,
              "text-anchor": "middle"
            },
            period.range
          )
        );

        labelsGroup.appendChild(
          create(
            "text",
            {
              class: "axis-label",
              x: sx(first.start),
              y: sy(period.level),
              dx: -labelOffset.side,
              dy: labelOffset.small,
              "text-anchor": "end"
            },
            String(period.rate).replace(".", ",")
          )
        );
      });

      [first, second, third, last].forEach((period) => {
        labelsGroup.appendChild(
          create(
            "text",
            {
              class: "tick-label",
              x: sx(period.start),
              y: sy(first.start),
              dy: labelOffset.tick,
              "text-anchor":
                period.start === first.start ? "start" : "middle"
            },
            String(period.start)
          )
        );
      });

      labelsGroup.appendChild(
        create(
          "text",
          {
            class: "axis-label",
            x: sx(last.middle),
            y: sy(first.start),
            dy: -labelOffset.normal,
            "text-anchor": "middle"
          },
          "эпоха"
        )
      );

      labelsGroup.appendChild(
        create(
          "text",
          {
            class: "axis-label",
            x: sx(first.start),
            y: sy(third.level),
            dx: labelOffset.side,
            dy: -labelOffset.small,
            "text-anchor": "start"
          },
          "learning rate"
        )
      );

      labelsGroup.appendChild(
        create(
          "text",
          {
            class: "note-label",
            x: sx(second.end),
            y: sy(first.start),
            dy: labelOffset.note,
            "text-anchor": "middle"
          },
          "резкие переходы на эпохах 30, 60 и 90 — каждый раз в 10 раз"
        )
      );

      svg.setAttribute("width", String(canvas.width));
      svg.setAttribute("height", String(canvas.height));
    } catch (error) {
      const stage = document.getElementById("diagram-stage");

      if (stage) {
        const fallback = document.createElement("p");
        fallback.className = "fallback";
        fallback.textContent =
          "Схема должна была показать лестницу learning rate: 0,1 на эпохах 0–29, " +
          "0,01 на эпохах 30–59, 0,001 на эпохах 60–89 и 0,0001 начиная с эпохи 90. " +
          "Переходы происходят резко на эпохах 30, 60 и 90.";
        stage.replaceChildren(fallback);
      }
    }
  </script>
</body>
</html>
