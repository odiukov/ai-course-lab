<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Форма косинусного затухания</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: white;
      --panel: aliceblue;
      --ink: midnightblue;
      --muted: slategray;
      --axis: darkslategray;
      --guide: lightsteelblue;
      --curve: royalblue;
      --area: lavender;
      --point: white;
      --halo: white;
      --error: darkred;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .diagram {
      width: 100%;
      max-height: 520px;
      overflow: hidden;
      background: var(--page);
      border: 1px solid var(--guide);
    }

    .diagram__title {
      margin: 0;
      padding: 14px 18px 10px;
      background: var(--panel);
      color: var(--ink);
      font-size: 20px;
      font-weight: bold;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 476px;
      background: var(--page);
    }

    .area {
      fill: var(--area);
    }

    .guide {
      fill: none;
      stroke: var(--guide);
      stroke-width: 1.25;
      vector-effect: non-scaling-stroke;
    }

    .axis {
      fill: none;
      stroke: var(--axis);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .axis-arrow {
      fill: var(--axis);
      stroke: none;
    }

    .curve-underlay {
      fill: none;
      stroke: var(--page);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .curve {
      fill: none;
      stroke: var(--curve);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .point {
      fill: var(--point);
      stroke: var(--curve);
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
    }

    .tick-label,
    .axis-label,
    .callout,
    .summary,
    .fallback {
      font-family: inherit;
      paint-order: stroke;
      stroke: var(--halo);
      stroke-linejoin: round;
    }

    .tick-label {
      fill: var(--ink);
      stroke-width: 4;
      font-size: 14px;
    }

    .axis-label {
      fill: var(--muted);
      stroke-width: 4;
      font-size: 14px;
      font-weight: bold;
    }

    .callout {
      fill: var(--curve);
      stroke-width: 5;
      font-size: 15px;
      font-weight: bold;
    }

    .summary {
      fill: var(--ink);
      stroke-width: 5;
      font-size: 15px;
      font-weight: bold;
    }

    .fallback {
      fill: var(--error);
      stroke-width: 5;
      font-size: 16px;
      font-weight: bold;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: black;
        --panel: midnightblue;
        --ink: aliceblue;
        --muted: lightsteelblue;
        --axis: gainsboro;
        --guide: slategray;
        --curve: deepskyblue;
        --area: midnightblue;
        --point: black;
        --halo: black;
        --error: lightsalmon;
      }
    }
  </style>
</head>
<body>
  <figure class="diagram" aria-labelledby="diagram-title diagram-description">
    <figcaption class="diagram__title" id="diagram-title">
      Форма косинусного затухания
    </figcaption>

    <svg
      viewBox="0 0 960 440"
      width="960"
      height="440"
      role="img"
      preserveAspectRatio="xMidYMid meet"
      aria-labelledby="diagram-title diagram-description"
    >
      <desc id="diagram-description">
        Плавная косинусная кривая начинается при lr_max равном 0.01,
        проходит примерно через 0.005 в середине обучения и мягко
        приближается к lr_min равному 0.00001 в конце.
      </desc>
      <g id="drawing"></g>
    </svg>
  </figure>

  <script>
    const data = Object.freeze([
      {
        kind: "config",
        origin: { x: 132, y: 347 },
        scale: { x: 690, y: 255 },
        zero: 0,
        half: 0.5,
        one: 1,
        samples: 80,
        axisXEnd: 1.11,
        axisYEnd: 1.13,
        xArrow: [
          { x: 1.11, y: 0 },
          { x: 1.075, y: 0.024 },
          { x: 1.075, y: -0.024 }
        ],
        yArrow: [
          { x: 0, y: 1.13 },
          { x: -0.017, y: 1.085 },
          { x: 0.017, y: 1.085 }
        ],
        xTickHalf: 0.025,
        yTickHalf: 0.012,
        pointRadius: 0.008,
        summaryY: -0.25
      },
      { kind: "xTick", x: 0, label: "t = 0", anchor: "start" },
      { kind: "xTick", x: 0.5, label: "t = T/2", anchor: "middle" },
      { kind: "xTick", x: 1, label: "t = T", anchor: "middle" },
      { kind: "yTick", y: 1, label: "lr_max = 0.01" },
      { kind: "yTick", y: 0.5, label: "≈ 0.005" },
      { kind: "yTick", y: 0, label: "lr_min = 0.00001" },
      { kind: "keyPoint", x: 0, y: 1 },
      { kind: "keyPoint", x: 0.5, y: 0.5 },
      { kind: "keyPoint", x: 1, y: 0 },
      {
        kind: "callout",
        x: 0.16,
        label: "почти ровно",
        dx: 0,
        dy: -22,
        anchor: "middle"
      },
      {
        kind: "callout",
        x: 0.5,
        label: "самый заметный спуск",
        dx: 20,
        dy: -18,
        anchor: "start"
      },
      {
        kind: "callout",
        x: 0.84,
        label: "снова почти ровно",
        dx: 0,
        dy: -22,
        anchor: "middle"
      }
    ]);

    const config = data.find((item) => item.kind === "config");
    const origin = Object.freeze({
      x: config.origin.x,
      y: config.origin.y
    });
    const scale = Object.freeze({
      x: config.scale.x,
      y: config.scale.y
    });

    const sx = (x) => origin.x + x * scale.x;
    const sy = (y) => origin.y - y * scale.y;

    try {
      const namespace = "http://www.w3.org/2000/svg";
      const drawing = document.getElementById("drawing");

      const make = (name, attributes = {}) => {
        const element = document.createElementNS(namespace, name);
        Object.entries(attributes).forEach(([key, value]) => {
          element.setAttribute(key, String(value));
        });
        return element;
      };

      const add = (element) => {
        drawing.appendChild(element);
        return element;
      };

      const line = (xStart, yStart, xEnd, yEnd, className) => {
        return add(
          make("line", {
            x1: sx(xStart),
            y1: sy(yStart),
            x2: sx(xEnd),
            y2: sy(yEnd),
            class: className
          })
        );
      };

      const label = (
        value,
        x,
        y,
        dx,
        dy,
        anchor,
        className
      ) => {
        const element = make("text", {
          x: sx(x) + dx,
          y: sy(y) + dy,
          "text-anchor": anchor,
          "dominant-baseline": "middle",
          class: className
        });
        element.textContent = value;
        return add(element);
      };

      const polygon = (vertices, className) => {
        const points = vertices
          .map((point) => `${sx(point.x)},${sy(point.y)}`)
          .join(" ");
        return add(
          make("polygon", {
            points,
            class: className
          })
        );
      };

      const schedule = (x) => {
        return (
          config.half *
          (config.one + Math.cos(Math.PI * x))
        );
      };

      const curvePoints = [];
      let sample = config.zero;

      while (sample <= config.samples) {
        const x = sample / config.samples;
        curvePoints.push({ x, y: schedule(x) });
        sample++;
      }

      const curveCommands = curvePoints
        .map((point, position) => {
          const command = position === config.zero ? "M" : "L";
          return `${command} ${sx(point.x)} ${sy(point.y)}`;
        })
        .join(" ");

      const areaCommands = [
        `M ${sx(config.zero)} ${sy(config.zero)}`,
        `L ${sx(config.zero)} ${sy(config.one)}`,
        curvePoints
          .map(
            (point) =>
              `L ${sx(point.x)} ${sy(point.y)}`
          )
          .join(" "),
        `L ${sx(config.one)} ${sy(config.zero)}`,
        "Z"
      ].join(" ");

      add(
        make("path", {
          d: areaCommands,
          class: "area"
        })
      );

      data
        .filter((item) => item.kind === "yTick")
        .forEach((item) => {
          line(
            config.zero,
            item.y,
            config.one,
            item.y,
            "guide"
          );
        });

      line(
        config.half,
        config.zero,
        config.half,
        config.half,
        "guide"
      );

      line(
        config.zero,
        config.zero,
        config.axisXEnd,
        config.zero,
        "axis"
      );

      line(
        config.zero,
        config.zero,
        config.zero,
        config.axisYEnd,
        "axis"
      );

      polygon(config.xArrow, "axis-arrow");
      polygon(config.yArrow, "axis-arrow");

      data
        .filter((item) => item.kind === "xTick")
        .forEach((item) => {
          line(
            item.x,
            -config.xTickHalf,
            item.x,
            config.xTickHalf,
            "axis"
          );

          label(
            item.label,
            item.x,
            config.zero,
            0,
            28,
            item.anchor,
            "tick-label"
          );
        });

      data
        .filter((item) => item.kind === "yTick")
        .forEach((item) => {
          line(
            -config.yTickHalf,
            item.y,
            config.yTickHalf,
            item.y,
            "axis"
          );

          label(
            item.label,
            config.zero,
            item.y,
            -16,
            0,
            "end",
            "tick-label"
          );
        });

      add(
        make("path", {
          d: curveCommands,
          class: "curve-underlay"
        })
      );

      add(
        make("path", {
          d: curveCommands,
          class: "curve"
        })
      );

      data
        .filter((item) => item.kind === "keyPoint")
        .forEach((item) => {
          add(
            make("circle", {
              cx: sx(item.x),
              cy: sy(item.y),
              r:
                sx(config.pointRadius) -
                sx(config.zero),
              class: "point"
            })
          );
        });

      data
        .filter((item) => item.kind === "callout")
        .forEach((item) => {
          label(
            item.label,
            item.x,
            schedule(item.x),
            item.dx,
            item.dy,
            item.anchor,
            "callout"
          );
        });

      label(
        "скорость обучения",
        config.zero,
        config.axisYEnd,
        18,
        0,
        "start",
        "axis-label"
      );

      label(
        "шаг обучения t",
        config.axisXEnd,
        config.zero,
        0,
        43,
        "end",
        "axis-label"
      );

      label(
        "Наклон: почти ровно → круче → снова почти ровно",
        config.half,
        config.summaryY,
        0,
        0,
        "middle",
        "summary"
      );
    } catch (error) {
      const namespace = "http://www.w3.org/2000/svg";
      const drawing = document.getElementById("drawing");
      drawing.replaceChildren();

      const message = document.createElementNS(namespace, "text");
      message.setAttribute("x", String(sx(config.half)));
      message.setAttribute("y", String(sy(config.half)));
      message.setAttribute("text-anchor", "middle");
      message.setAttribute("dominant-baseline", "middle");
      message.setAttribute("class", "fallback");
      message.textContent =
        "Здесь должна быть плавная кривая от lr_max = 0.01 через ≈ 0.005 до lr_min = 0.00001.";
      drawing.appendChild(message);
    }
  </script>
</body>
</html>
