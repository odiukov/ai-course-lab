- concept: текущее назначение слова исключают из счётчиков перед его повторным сэмплированием
  question: Объясните своими словами, зачем в collapsed Gibbs sampling текущее слово временно удаляют из счётчиков перед выбором для него новой темы.
  explanation: Если оставить слово в счётчиках, оно само усилит тему, к которой уже относится. Это создаст лишнее самоподкрепление и исказит условные веса при пересэмплировании.
  kind: open
  reference: Чтобы прежнее назначение слова не увеличивало вес той же темы и не влияло на собственное переназначение. Условное распределение должно вычисляться по всем остальным назначениям.
  id: 009-uslovnaya-tema-3
