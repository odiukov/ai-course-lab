- concept: условный вес темы в Gibbs sampling сочетает соответствие темы документу и характерность слова для темы с поправкой на размер темы
  question: 'При переназначении слова в LDA для одной из тем известны счётчики: n_dk = 6, n_kw = 9, n_k = 45. Размер словаря V = 30, параметры α = 0.2 и β = 0.1. Чему равен ненормированный вес этой темы?'
  explanation: 'Вес равен (6 + 0.2) × (9 + 0.1) / (45 + 30 × 0.1) = 56.42 / 48 ≈ 1.18. Это ещё не вероятность: веса всех тем нужно нормировать.'
  kind: numeric
  answer: 1.18
  tolerance: 0.01
  id: 009-uslovnaya-tema-1
  fingerprint: 79f77d1a
- concept: сглаживание сохраняет ненулевую вероятность назначения темы при пустых счётчиках
  question: При переназначении слова некоторая тема пока не встречалась ни в документе, ни вместе с этим словом. Что обеспечивают положительные параметры α и β?
  explanation: Добавки α и β сглаживают нулевые счётчики. Благодаря им модель может исследовать ещё не использованные сочетания документов, слов и тем.
  kind: choice
  options:
    - Тема получает ненулевой вес и всё ещё может быть выбрана
    - Тема навсегда исключается из дальнейших назначений
    - Тема автоматически получает максимальный вес
    - Размер темы перестаёт влиять на вычисление веса
