- concept: topic diversity равна доле уникальных слов среди всех позиций в списках топовых слов
  question: Модель выделила 7 тем, для каждой взяли по 12 топовых слов. Среди всех списков оказалось 63 уникальных слова. Чему равна topic diversity?
  explanation: 'Всего в списках 7 × 12 = 84 позиции. Поэтому topic diversity = 63 / 84 = 0,75: четверть позиций занята словами, которые уже встречаются в других местах.'
  kind: numeric
  answer: 0.75
  tolerance: 0.001
  id: 029-diversity-1
  fingerprint: c3a64a3f
- concept: высокая topic diversity показывает слабое пересечение словарей тем, но не гарантирует их содержательность
  question: У модели высокая topic diversity. Какой вывод из этого обоснован?
  explanation: Topic diversity оценивает только повторяемость топовых слов между темами. Даже максимальное разнообразие можно получить на наборах случайных или редких слов, поэтому содержательность проверяют отдельно — например, через coherence и качественный просмотр.
  kind: choice
  options:
    - Топовые слова разных тем редко повторяются, но сами темы всё ещё могут быть бессмысленными
    - Каждая тема обязательно соответствует отдельному реальному понятию
    - Все топовые слова внутри каждой темы тесно связаны по смыслу
    - Документы распределены между темами с высокой уверенностью
  correct: 0
  id: 029-diversity-2
  fingerprint: 7b8fedc4
