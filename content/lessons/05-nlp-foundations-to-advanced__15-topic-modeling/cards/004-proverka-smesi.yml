- concept: топовые слова темы получают из соответствующей строки матрицы topic_word
  question: Как в обученной LDA-модели найти слова, наиболее характерные для темы k?
  explanation: Строка topic_word[k, :] задаёт распределение вероятности по словам для темы k. Наибольшие элементы этой строки соответствуют наиболее характерным словам темы.
  kind: choice
  options:
    - Отсортировать элементы строки topic_word[k, :] по убыванию
    - Отсортировать элементы столбца doc_topic[:, k] по убыванию
    - Выбрать самые длинные документы, связанные с темой k
    - Посчитать частоту темы k среди всех документов
  correct: 0
  id: 004-proverka-smesi-1
  fingerprint: 91a00db3
- concept: doc_topic и topic_word описывают разные условные распределения
  question: Известно, что тема k имеет большую долю в документе d. Достаточно ли этого, чтобы заключить, что конкретное слово w характерно для темы k? Объясни своими словами.
  explanation: doc_topic отвечает на вопрос, какие темы представлены в документе, а topic_word — какие слова вероятны внутри темы. Значение из одной матрицы не определяет значение из другой.
  kind: open
  reference: Нет. Большая доля темы k в документе описывается матрицей doc_topic, а характерность слова w для этой темы — отдельным значением topic_word[k, w]. Для вывода о слове нужна информация из topic_word.
  id: 004-proverka-smesi-2
  fingerprint: 247e486b
