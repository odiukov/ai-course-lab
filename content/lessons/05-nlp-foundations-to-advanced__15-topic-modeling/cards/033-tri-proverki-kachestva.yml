- concept: topic coherence и topic diversity выявляют разные дефекты тематической модели
  question: У тематической модели высокая coherence, но низкая topic diversity. Как наиболее обоснованно интерпретировать такой результат?
  explanation: Coherence оценивает связанность слов внутри отдельных тем, а diversity — пересечение топовых слов между темами. Поэтому связные темы могут оказаться несколькими версиями одного и того же сюжета.
  kind: choice
  options:
    - Слова внутри каждой темы связаны, но разные темы во многом повторяют друг друга
    - Темы хорошо различаются, однако слова внутри них образуют случайные смеси
    - Модель обязательно нашла содержательные и непересекающиеся темы
    - Низкая diversity доказывает, что слова внутри каждой темы не связаны
  correct: 0
  id: 033-tri-proverki-kachestva-1
  fingerprint: 319eca3d
- concept: ручное чтение проверяет содержательность тем, которую не гарантируют автоматические метрики
  question: Почему модель с высокой topic coherence и высокой topic diversity всё равно нужно проверять ручным чтением топовых слов?
  explanation: Coherence и diversity измеряют статистические свойства списков слов, а не их практический смысл. Человек должен проверить, можно ли содержательно интерпретировать каждую тему.
  kind: open
  reference: Эти метрики показывают связанность слов внутри тем и различие словарей между темами, но не определяют, соответствует ли каждая тема реальному и полезному для человека понятию. Например, статистически хорошая тема может отражать служебный шаблон корпуса. Это обнаруживается качественной проверкой.
  id: 033-tri-proverki-kachestva-2
