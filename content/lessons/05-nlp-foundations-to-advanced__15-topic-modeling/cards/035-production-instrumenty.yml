- concept: NMF приближает матрицу документов и терминов произведением двух неотрицательных матриц
  question: Дополните формулу разложения NMF для матрицы «документы × термины».
  explanation: W описывает связь документов с темами, а H — связь тем с терминами. Неотрицательность компонентов делает разложение удобным для интерпретации как набор добавочных тематических факторов.
