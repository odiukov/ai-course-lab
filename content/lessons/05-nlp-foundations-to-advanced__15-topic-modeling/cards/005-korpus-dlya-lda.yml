- concept: min_df измеряет число документов с термином, а не общее число его появлений
  question: Термин много раз повторяется в одном документе, но отсутствует во всех остальных. Почему CountVectorizer может удалить его при заданном min_df, требующем присутствия в нескольких документах?
  explanation: min_df смотрит, в скольких документах встретился термин хотя бы раз. Повторы внутри одного документа увеличивают term frequency, но не document frequency, поэтому такой термин не проходит порог min_df=2.
  kind: choice
  options:
    - Document frequency термина всё равно равна одному документу
    - CountVectorizer удаляет все повторяющиеся термины
    - min_df ограничивает длину каждого документа
    - Частые повторы автоматически считаются стоп-словами
  correct: 0
  id: 005-korpus-dlya-lda-1
  fingerprint: 93df8162
- concept: max_features ограничивает словарь наиболее частыми терминами после остальных фильтров
  question: Расположите этапы формирования ограниченного словаря Bag of Words в логическом порядке.
  explanation: Сначала удаляются заведомо неинформативные стоп-слова и термины, не прошедшие min_df и max_df. Затем max_features оставляет наиболее частые слова среди прошедших фильтры, а не среди всего исходного словаря.
  kind: order
  items:
    - Исключить заданные стоп-слова
    - Отсеять термины со слишком низкой или слишком высокой document frequency
    - Среди оставшихся терминов выбрать наиболее частые до ограничения max_features
  id: 005-korpus-dlya-lda-2
  fingerprint: 07a113f5
