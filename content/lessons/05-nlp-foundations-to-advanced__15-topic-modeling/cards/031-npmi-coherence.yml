- concept: NPMI оценивает совместную встречаемость слов относительно ожидаемой при их индивидуальных частотах
  question: Пара топовых слов часто попадает в одно скользящее окно. Что дополнительно учитывает NPMI, чтобы отличить содержательную связь от совпадения глобально частых слов?
  explanation: 'Большое число совместных появлений само по себе не доказывает связь: повсеместно встречающиеся слова и случайно часто оказываются рядом. NPMI сопоставляет наблюдаемое соседство с ожидаемым при индивидуальных частотах слов.'
  kind: choice
  options:
    - Как часто каждое слово встречается отдельно и сколько совместных появлений ожидалось бы при таких частотах
    - Только порядок слов внутри каждого окна
    - Вероятность темы в каждом документе
    - Общее количество тем в модели
  correct: 0
  id: 031-npmi-coherence-1
  fingerprint: '09304062'
- concept: c_v coherence объединяет оконные NPMI-оценки в контекстные векторы тем и сравнивает их по косинусу
  question: Расположи этапы вычисления c_v coherence в правильном порядке.
  explanation: c_v опирается на совместную встречаемость топовых слов в окнах корпуса. Парные NPMI-оценки образуют контекстные векторы, согласованность которых затем оценивается через косинусное сходство.
  kind: order
  items:
    - Провести скользящие окна по исходному корпусу и собрать статистику встречаемости топовых слов
    - Вычислить NPMI для пар топовых слов темы
    - Собрать полученные оценки в контекстные векторы темы
    - Сравнить контекстные векторы по косинусу и получить итоговую coherence
  id: 031-npmi-coherence-2
  fingerprint: 7ed7eb93
