- concept: качество настройки min_topic_size оценивают совместно по дробности тем и доле выбросов
  question: Почему после изменения min_topic_size недостаточно смотреть только на количество найденных тем?
  explanation: Высокий min_topic_size обычно подавляет мелкие темы, однако часть документов при этом может не войти ни в один надёжный кластер. Поэтому меньшее число тем само по себе не доказывает, что модель стала лучше.
  kind: open
  reference: Порог влияет не только на дробность кластеров, но и на число документов, которые HDBSCAN оставляет среди выбросов. Уменьшение количества тем может означать полезное укрупнение, но может также сопровождаться потерей содержательных групп, поэтому количество тем нужно оценивать вместе с долей выбросов.
