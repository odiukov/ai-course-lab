- concept: доля выбросов равна числу документов в служебном кластере выбросов, делённому на размер корпуса
  question: В служебной строке выбросов BERTopic находится 9180 документов, а во всём корпусе — 51000. Какова доля выбросов в процентах?
  explanation: Отношение 9180 к 51000 равно 0,18, то есть 18%. Такая доля показывает, какую часть корпуса HDBSCAN не смог уверенно отнести к тематическим кластерам.
  kind: numeric
  answer: 18
  tolerance: 0.1
