- concept: скрытая тема назначается отдельному вхождению слова, а не слову навсегда
  question: Слово «порт» встречается в документах о морских перевозках и компьютерных сетях. Как LDA может обработать эти вхождения?
  explanation: В LDA скрытая тема выбирается для каждого вхождения слова. Поэтому «порт» может относиться к теме перевозок в одном документе и к теме сетей в другом.
  kind: choice
  options:
    - Закрепить слово «порт» за одной общей темой во всём корпусе
    - Назначить отдельным вхождениям разные скрытые темы с учётом документов
    - Исключить слово из словаря из-за неоднозначности
    - Назначить каждому документу единственную тему
  correct: 1
  id: 003-generativnaya-istoriya-1
  fingerprint: f1b36412
- concept: вероятности тем в смеси документа суммируются в единицу
  question: Для документа LDA оценила смесь тем как [0.41, 0.28, 0.17, x]. Чему равно x?
  explanation: Смесь тем — распределение вероятностей, поэтому её компоненты суммируются в 1. Известные компоненты дают 0.86, значит x = 1 − 0.86 = 0.14.
  kind: numeric
  answer: 0.14
  tolerance: 0.001
  id: 003-generativnaya-istoriya-2
  fingerprint: 702e6bbf
- concept: обучение LDA восстанавливает скрытые распределения из наблюдаемых слов
  question: Объясни своими словами, какую обратную задачу решает LDA при обучении на готовом корпусе.
  explanation: 'Генеративная модель описывает переход от смеси тем к словам, а обучение выполняет вывод в обратном направлении: от слов — к вероятным тематическим назначениям и распределениям.'
  kind: open
  reference: По наблюдаемым словам LDA оценивает скрытые темы отдельных вхождений, смеси тем документов и распределения слов внутри тем.
  id: 003-generativnaya-istoriya-3
  fingerprint: c76f9100
