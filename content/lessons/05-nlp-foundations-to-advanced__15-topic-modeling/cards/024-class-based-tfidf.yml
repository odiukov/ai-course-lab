- concept: частота термина в c-TF-IDF нормализуется по сумме счётчиков в строке кластера
  question: После объединения текстов одного кластера и векторизации строка содержит 60 учтённых токенов, из которых 9 соответствуют термину «модель». Чему равна нормализованная частота этого термина до умножения на IDF?
  explanation: Нормализованная частота равна 9 / 60 = 0.15. Деление на сумму счётчиков строки устраняет преимущество кластеров, содержащих больше текста.
  kind: numeric
  answer: 0.15
  tolerance: 0.001
  id: 024-class-based-tfidf-1
  fingerprint: d4fd98d6
- concept: порядок меток необходим для однозначного сопоставления строк матрицы c-TF-IDF с кластерами
  question: Функция вернула матрицу c-TF-IDF и словарь, но не вернула порядок произвольных меток кластеров. Почему такой результат нельзя надёжно интерпретировать?
  explanation: Номер строки определяется порядком группировки меток, а не значением самой метки. Поэтому вместе с матрицей нужно сохранить и вернуть порядок меток, иначе топовые слова нельзя однозначно связать с исходными кластерами.
  kind: choice
  options:
    - Невозможно определить, какому кластеру соответствует каждая строка матрицы
    - Невозможно вычислить число терминов в словаре
    - Матрица счётчиков обязательно становится плотной
    - Нормализация строк автоматически заменяется нормализацией столбцов
  correct: 0
