- concept: нормирование весов темы не требуется для определения их рейтинга
  question: Нужно вывести слова с наибольшими весами в одной теме LDA. Почему перед сортировкой необязательно делить все веса на их сумму?
  explanation: Для выбора ведущих слов важен только порядок весов. Деление всех элементов строки `components_` на одну и ту же положительную сумму изменит их масштаб, но не переставит элементы в рейтинге.
  kind: choice
  options:
    - Потому что после обучения все веса в строке уже равны единице
    - Потому что такое деление умножает все веса на один положительный коэффициент и не меняет их порядок
    - Потому что argsort автоматически нормирует переданные значения
    - Потому что feature_names содержит веса уже в нормированном виде
