  fingerprint: 0dea1393
- concept: язык списка стоп-слов должен соответствовать языку корпуса
  question: Что произойдёт, если применить CountVectorizer со stop_words="english" к корпусу русскоязычных обращений?
  explanation: Значение stop_words="english" включает английский список стоп-слов, но не определяет язык корпуса автоматически. Для русского корпуса нужен подходящий русский список или собственный набор стоп-слов.
  kind: choice
  options:
    - Русские служебные слова в основном останутся в словаре
    - Векторизатор автоматически переведёт русский текст на английский
    - Будут удалены стоп-слова на всех поддерживаемых языках
    - Векторизатор не сможет построить матрицу признаков
