- concept: размерности матриц LDA определяются числом документов, тем и словарных терминов
  question: Корпус содержит 72 документа, модель LDA обучена с 9 темами, а словарь содержит 1400 терминов. Какие размерности имеют выходные матрицы?
  explanation: В doc_topic строки соответствуют документам, а столбцы — темам. В topic_word строки соответствуют темам, а столбцы — терминам словаря.
  kind: choice
  options:
    - 'doc_topic: (72, 9), topic_word: (9, 1400)'
    - 'doc_topic: (9, 72), topic_word: (1400, 9)'
    - 'doc_topic: (72, 1400), topic_word: (1400, 9)'
  correct: 0
  id: 013-dve-matricy-1
  fingerprint: cdbb4295
- concept: один индекс темы связывает столбец doc_topic со строкой topic_word
  question: Заполни пропуск, чтобы получить распределение слов для наиболее весомой темы документа d.
  explanation: argmax на строке doc_topic возвращает индекс наиболее весомой темы документа. Строка topic_word с тем же индексом содержит распределение слов этой темы.
  kind: cloze
  template: word_distribution = topic_word[___]
  answer: np.argmax(doc_topic[d])
  accept:
    - doc_topic[d].argmax()
    - argmax(doc_topic[d])
  id: 013-dve-matricy-2
  fingerprint: 0df11ad1
