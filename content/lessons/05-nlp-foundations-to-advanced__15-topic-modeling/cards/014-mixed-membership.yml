- concept: веса тем в LDA являются оценками тематической принадлежности, а не точными долями видимых слов определённого типа
  question: Объясни своими словами, почему вес темы в распределении документа нельзя обязательно трактовать как точную долю видимых слов, относящихся к этой теме.
  explanation: 'LDA оценивает скрытую структуру вероятностно: назначения тем не наблюдаются напрямую, а сглаживание влияет на итоговые веса. Поэтому смесь тем описывает уверенность модели, а не точную разметку поверхности текста.'
  kind: open
  reference: Вес темы — это вероятностная оценка модели, полученная из скрытых назначений тем словам с учётом всего корпуса, подсчётов и сглаживания. Поэтому он выражает степень тематической принадлежности документа, но не обязан совпадать с результатом буквального подсчёта слов определённой тематики.
  id: 014-mixed-membership-2
