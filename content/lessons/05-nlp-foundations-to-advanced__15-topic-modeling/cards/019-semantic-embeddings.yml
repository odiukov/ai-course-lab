- concept: контекст определяет положение документа в пространстве embeddings, поэтому совпадение многозначного слова не гарантирует смысловой близости
  question: Документ о гаечном ключе и документ о ключе к шифру содержат одинаковое слово. Почему их sentence embeddings могут находиться далеко друг от друга?
  explanation: Sentence embeddings отражают контекстный смысл текста. В разных окружениях слово «ключ» обозначает разные понятия, поэтому языковая модель может разместить документы в удалённых областях пространства.
  kind: open
  reference: Sentence transformer учитывает контекст всего документа и кодирует разные значения многозначного слова по-разному. Поэтому лексическое совпадение само по себе не делает документы семантически близкими.
  id: 019-semantic-embeddings-2
  fingerprint: 73ce6c1b
