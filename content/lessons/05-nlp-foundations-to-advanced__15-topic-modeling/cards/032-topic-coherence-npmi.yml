- concept: скользящие окна контекста считают отдельно внутри каждого документа
  question: Корпус состоит из документов длиной 15 и 12 токенов. Окно шириной 7 токенов сдвигают на соседнюю позицию, не пересекая границы документов. Сколько всего окон получится?
  explanation: Первый документ даёт девять допустимых позиций окна, второй — шесть. Всего получается пятнадцать окон; единое окно нельзя продолжать из конца одного документа в начало другого.
  kind: numeric
  answer: 15
  tolerance: 0.001
  id: 032-topic-coherence-npmi-1
  fingerprint: 9dc1342c
- concept: частота слова для оконной NPMI учитывает присутствие в контексте, а не число повторений внутри него
  question: Как в Python представить уникальные слова текущего окна перед обновлением счётчиков NPMI?
  explanation: Преобразование окна в множество делает признак присутствия бинарным. Повторы слова внутри одного контекста не увеличивают ни его оконную частоту, ни частоту содержащих его пар.
  kind: cloze
  template: present_words = ___(window_tokens)
  answer: set
  accept:
    - frozenset
  id: 032-topic-coherence-npmi-2
  fingerprint: 5e8d7fda
- concept: никогда не встречавшаяся совместно пара должна участвовать в среднем с минимальной NPMI
  question: Два топовых слова темы встречаются в корпусе по отдельности, но ни в одном контекстном окне не появляются вместе. Как корректно учесть эту пару при оценке темы?
  explanation: Отсутствие совместных окон — свидетельство несвязности слов. Исключение такой пары или нейтральная замена искусственно завысили бы coherence темы.
  kind: choice
  options:
    - Исключить пару из среднего, поскольку её NPMI нельзя вычислить напрямую
    - Присвоить паре нейтральную оценку, чтобы отсутствие наблюдений не влияло на тему
    - Присвоить паре минимально возможную NPMI и включить её в среднее
  correct: 2
  id: 032-topic-coherence-npmi-3
  fingerprint: 42acc1dd
