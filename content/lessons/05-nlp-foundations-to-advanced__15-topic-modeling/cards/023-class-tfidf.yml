- concept: при расчёте c-TF-IDF все документы одного кластера объединяются в один классовый псевдодокумент
  question: Объясни своими словами, какие тексты сравнивает c-TF-IDF после кластеризации корпуса.
  explanation: Единицей сравнения служит не отдельный исходный документ, а весь кластер, представленный объединённым текстом его документов. Поэтому веса характеризуют кластер целиком.
  kind: open
  reference: Документы каждого кластера объединяются в один псевдодокумент. Затем такие кластерные псевдодокументы сравниваются между собой, чтобы определить характерные для каждого кластера термины.
