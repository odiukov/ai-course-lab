- concept: номер кластера BERTopic является техническим идентификатором и сам по себе не раскрывает смысл темы
  question: BERTopic присвоил группе документов метку 11. Что можно заключить из самого числа 11?
  explanation: Метки кластеров нужны для различения групп и не задают их смысл, ранг или качество. Интерпретировать кластер можно после анализа его характерных слов, например полученных с помощью class-based TF-IDF.
  kind: choice
  options:
    - Это порядковое место темы по распространённости
    - Это технический идентификатор кластера, не содержащий семантического описания
    - Это оценка качества темы
    - Это количество характерных слов темы
  correct: 1
  id: 022-bertopic-pipeline-1
  fingerprint: 976d94e0
- concept: мягкая принадлежность HDBSCAN не превращает BERTopic в генеративную модель смеси тем, подобную LDA
  question: BERTopic дополнительно вернул для документа вектор вероятностей принадлежности к кластерам. Почему это не означает, что модель стала эквивалентна LDA со смесью тем документа?
  explanation: 'Основной результат BERTopic — кластерное назначение документа, а мягкие вероятности лишь уточняют уверенность или степень принадлежности к кластерам. LDA моделирует другой процесс: документ задаётся распределением тем, участвующим в генерации отдельных слов.'
  kind: open
  reference: 'Вероятности HDBSCAN описывают мягкую принадлежность точки к найденным кластерам и являются дополнительным результатом кластеризации. В LDA смесь тем входит в генеративную модель документа: тема выбирается для каждого слова из распределения тем документа.'
  id: 022-bertopic-pipeline-2
  fingerprint: 939307be
