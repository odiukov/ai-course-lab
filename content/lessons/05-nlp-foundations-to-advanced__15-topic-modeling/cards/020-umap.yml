- concept: UMAP при снижении размерности стремится сохранить локальные соседства объектов
  question: Что UMAP прежде всего старается сохранить при переносе эмбеддингов документов в пространство меньшей размерности?
  explanation: UMAP строит низкоразмерное представление так, чтобы близкие объекты по возможности сохранили своих соседей. Глобальные расстояния между далёкими группами при этом могут заметно измениться.
  kind: choice
  options:
    - Точные расстояния между всеми парами документов
    - Отношения ближайшего соседства между документами
    - Небольшой набор исходных координат без преобразования
    - Частоты слов внутри каждого документа
  correct: 1
  id: 020-umap-1
  fingerprint: 52c39c56
- concept: снижение размерности помогает плотностной кластеризации преодолеть концентрацию расстояний в многомерном пространстве
  question: Почему плотностная кластеризация эмбеддингов документов может работать хуже в пространстве с сотнями измерений и как UMAP помогает решить эту проблему?
  explanation: Из-за концентрации расстояний понятие локальной плотности в многомерном пространстве становится менее информативным. UMAP уменьшает размерность, стараясь не разрушить ближайшие соседства, после чего HDBSCAN легче отделяет плотные группы от разреженных областей.
  kind: open
  reference: 'В многомерном пространстве расстояния между точками становятся слабо различимыми: ближайшие и далёкие объекты оказываются сравнительно похожи по расстоянию, поэтому трудно выделить области повышенной плотности. UMAP переносит данные в пространство меньшей размерности, сохраняя главным образом локальные соседства, и делает плотные группы более различимыми для кластеризатора.'
  id: 020-umap-2
  fingerprint: 87bcefdc
