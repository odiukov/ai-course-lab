- concept: вероятность слова в документе в LDA получается суммированием вкладов всех тем
  question: Дополните формулу маргинальной вероятности слова в документе в модели LDA.
  explanation: LDA объединяет распределение тем документа P(z|d) с распределением слов каждой темы P(w|z). Суммирование по темам даёт вероятность наблюдать слово w в документе d.
  kind: cloze
  template: P(w|d) = Σ_z P(z|d) · ___
  answer: P(w|z)
  accept:
    - P(w | z)
    - p(w|z)
    - p(w | z)
  id: 002-dva-razlozheniya-1
  fingerprint: bccd3378
- concept: в BERTopic назначение документов кластерам отделено от описания кластеров словами
  question: В уже обученной модели BERTopic изменили способ вычисления ключевых слов кластеров, но не пересчитывали эмбеддинги, снижение размерности и кластеризацию. Что изменится непосредственно?
  explanation: HDBSCAN назначает документы кластерам по геометрии эмбеддингов после UMAP. Class-based TF-IDF применяется позже и лишь описывает уже найденные кластеры характерными словами.
  kind: choice
  options:
    - Текстовые описания тем, но не принадлежность документов к кластерам
    - Принадлежность документов к кластерам, но не ключевые слова тем
    - И принадлежность документов, и геометрия исходных эмбеддингов
    - Вероятностные смеси тем каждого документа
  correct: 0
