- concept: семантическое название темы задаётся человеком на основе весов слов, а не выдаётся LDA
  question: После обучения LDA аналитик назвал одну из тем «возвраты платежей». Как точнее всего понимать это название?
  explanation: LDA возвращает числовые идентификаторы тем и веса слов. Содержательное название формулирует аналитик, изучив наиболее характерные слова темы.
  kind: choice
  options:
    - Это категория, заранее заданная в словаре векторизатора
    - Это имя, которое LDA автоматически выбрала при обучении
    - Это расшифровка порядкового номера темы
    - Это метка, полученная из распределения тем по документам без участия человека
    - Это человеческая интерпретация набора слов с большими весами в теме
  correct: 4
  id: 015-slova-temy-1
  fingerprint: 4d93cab9
- concept: набор ведущих слов надёжнее раскрывает смысл темы, чем одно слово с максимальным весом
  question: Почему при интерпретации темы LDA обычно рассматривают несколько слов с наибольшими весами, а не только самое весомое слово?
  explanation: Максимальный вес ещё не делает слово однозначным названием темы. Соседние ведущие слова уточняют его смысл и помогают отличить близкие тематические сюжеты.
  kind: open
  reference: Отдельное слово может быть широким или многозначным и встречаться в разных сюжетах. Несколько ведущих слов задают совместный контекст и позволяют точнее интерпретировать тему.
  id: 015-slova-temy-2
  fingerprint: 1c6c927c
