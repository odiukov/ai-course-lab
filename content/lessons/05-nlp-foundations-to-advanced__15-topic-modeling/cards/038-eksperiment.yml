- concept: слияние известных категорий при малом числе тем отражает выбранный масштаб модели, а не обязательно её ошибку
  question: В размеченном корпусе редакционных категорий значительно больше, чем тем, заданных для LDA. Модель объединила несколько близких категорий в одну тему. Объясни, почему этого недостаточно, чтобы признать модель неудачной.
  explanation: Число тем задаёт разрешение тематической карты корпуса. В 20 Newsgroups при пяти темах совпадение с двадцатью категориями невозможно, поэтому осмысленное объединение близких групп само по себе не является провалом.
  kind: open
  reference: При числе тем, меньшем числа категорий, LDA неизбежно должна объединять часть категорий. Если объединения содержательно связны, результат соответствует выбранному уровню детализации. Качество следует проверять на нескольких значениях числа тем по метрикам и ручной интерпретации.
  id: 038-eksperiment-2
