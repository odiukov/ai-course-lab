- concept: темы модели являются гипотезой о структуре корпуса, которую нужно содержательно проверять
  question: Почему найденный тематической моделью набор тем нельзя автоматически считать единственно правильной структурой корпуса и как проверить его полезность?
  explanation: Тематическая модель не восстанавливает объективное оглавление корпуса, а предлагает интерпретируемую структуру. Поэтому названия и связность тем подтверждают просмотром характерных слов и документов.
  kind: open
  reference: Темы зависят от данных, представления текстов, алгоритма и его настроек, поэтому возможны разные разумные разбиения одного корпуса. Полезность результата проверяют по смысловой связности слов внутри тем и по репрезентативным документам, отнесённым к каждой теме.
