- concept: условные веса тем превращаются в вероятности делением каждого веса на сумму всех весов
  question: Ненормализованные условные веса тем A, B, C и D равны 5, 7, 11 и 17. Какова вероятность темы D после нормализации?
  explanation: Сумма весов равна 40, поэтому вероятность темы D равна 17 / 40 = 0.425. Такое деление превращает неотрицательные веса в распределение вероятностей.
  kind: numeric
  answer: 0.425
  tolerance: 0.001
  id: 010-topic-conditional-1
  fingerprint: e904b70e
- concept: в знаменателе словесного множителя LDA сглаживание beta учитывается для каждого термина словаря
  question: Заполни пропуск в словесном множителе условного распределения темы.
  explanation: К каждому из V терминов добавляется псевдосчётчик beta, поэтому суммарная добавка к размеру темы в знаменателе равна V · beta.
  kind: cloze
  template: (n_kw + beta) / (n_k + ___)
  answer: V * beta
  accept:
    - V*beta
    - beta * V
    - beta*V
    - Vβ
  id: 010-topic-conditional-2
  fingerprint: 88489a58
