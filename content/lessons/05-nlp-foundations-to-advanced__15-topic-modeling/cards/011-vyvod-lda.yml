- concept: повторные проходы Gibbs sampling распространяют влияние локальных переназначений по всей модели
  question: Почему для восстановления тем в LDA недостаточно один раз переназначить тему каждому вхождению слова?
  explanation: Gibbs sampling выполняет последовательность взаимозависимых локальных обновлений. Ранние назначения сделаны по ещё неустоявшимся счётчикам, поэтому следующие проходы пересматривают их с учётом обновлённой структуры корпуса.
  kind: open
  reference: 'Каждое переназначение изменяет счётчики документа и темы, от которых зависят условные вероятности последующих назначений. Поэтому нужны повторные проходы: изменения постепенно распространяются между словами и документами, а цепь приближается к согласованным конфигурациям скрытых тем.'
  id: 011-vyvod-lda-2
  fingerprint: f0c13d04
