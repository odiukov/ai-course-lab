- concept: гармоническое среднее делает F1 чувствительной к перекосу между precision и recall
  question: Объясни своими словами, почему классификатор с высокой precision, но низкой recall не может получить высокий F1.
  explanation: F1 оценивает precision и recall совместно и сильнее обычного среднего реагирует на малое значение одной из них. Высокий F1 означает, что модель одновременно избегает большого числа ложных тревог и находит значительную часть положительных объектов.
  kind: open
  reference: F1 является гармоническим средним precision и recall. Низкое значение любой из этих метрик заметно уменьшает итоговый результат, поэтому одной высокой метрики недостаточно.
