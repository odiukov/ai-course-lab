- concept: нулевое распределение строится из оценок модели после перестановки меток и повторного обучения
  question: Какой набор результатов является нулевым распределением в перестановочном тесте модели?
  explanation: Перестановка меток разрушает связь ответов с признаками, сохраняя сами признаки и частоты классов. Результаты заново обученной модели показывают, какое качество возможно при отсутствии реального сигнала.
  kind: choice
  options:
    - Оценки одной обученной модели на разных частях исходной выборки
    - Оценки после многократной перестановки меток, повторного обучения и неизменной процедуры проверки
    - Предсказанные моделью вероятности на обучающих объектах
  correct: 1
  id: 059-permutation-test-1
  fingerprint: b5103e27
- concept: p-value перестановочного теста оценивается долей случайных результатов не хуже наблюдаемого
  question: В 250 перестановочных запусках метрика оказалась не ниже наблюдаемой в 7 случаях. Оцените p-value как долю таких запусков.
  explanation: 'Нужно разделить число случайных результатов не хуже наблюдаемого на общее число перестановок: 7 / 250 = 0,028. Малое p-value означает, что наблюдаемое качество редко встречается при разрушенной связи между признаками и метками.'
  kind: numeric
  answer: 0.028
  tolerance: 0.0005
  id: 059-permutation-test-2
  fingerprint: 10a0340d
- concept: каждая перестановка требует повторного обучения при неизменной процедуре оценки
  question: Почему в перестановочном тесте после каждой перестановки меток модель нужно обучать заново и проверять тем же способом?
  explanation: Если оставить модель, обученную на настоящих метках, она уже содержит исходный сигнал. Если изменить процедуру оценки, разница результатов может быть вызвана разными условиями проверки, а не связью признаков с ответом.
  kind: open
  reference: 'Повторное обучение позволяет измерить результат всей процедуры обучения на данных без связи между признаками и метками. Неизменный способ оценки обеспечивает сопоставимость наблюдаемого качества с нулевым распределением: различаться должно только наличие или отсутствие сигнала.'
  id: 059-permutation-test-3
  fingerprint: 6023cef9
