- concept: результат confusion_matrix нужно распаковывать в порядке, заданном её контрактом
  question: Функция `confusion_matrix(y_true, y_pred)` возвращает кортеж `(tp, tn, fp, fn)`. Какая строка правильно присваивает счётчики переменным?
  explanation: Позиционное распаковывание сохраняет порядок элементов кортежа. Поэтому результат `(tp, tn, fp, fn)` нужно присвоить переменным именно как `tp, tn, fp, fn`.
  kind: choice
  options:
    - '`fp, fn, tp, tn = confusion_matrix(y_true, y_pred)`'
    - '`tn, tp, fn, fp = confusion_matrix(y_true, y_pred)`'
    - '`tp, tn, fp, fn = confusion_matrix(y_true, y_pred)`'
  correct: 2
  id: 015-code-accuracy-1
  fingerprint: 0737061f
- concept: пустую выборку нужно обработать до деления при вычислении accuracy
  question: Почему реализация `accuracy` должна отдельно обрабатывать пустые `y_true` и `y_pred`, и какое поведение задано для этого случая?
  explanation: При пустых списках `tp = tn = fp = fn = 0`, поэтому `total = 0`. Проверка `total > 0` предотвращает `ZeroDivisionError`, а для пустой выборки функция возвращает `0.0`.
  kind: open
  reference: Пустые входы дают нулевое общее число примеров, поэтому деление невозможно. Функция должна проверить знаменатель до деления и вернуть нулевое значение типа `float`.
  id: 015-code-accuracy-2
  fingerprint: e64c18be
