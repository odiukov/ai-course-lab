- concept: площадь участка под ROC-кривой вычисляется методом трапеций
  question: Две соседние точки ROC-кривой имеют координаты (FPR=0.14, TPR=0.63) и (FPR=0.44, TPR=0.93). Каков вклад участка между ними в AUC при интегрировании методом трапеций?
  explanation: Ширина трапеции равна 0.44 − 0.14 = 0.30, а её средняя высота — (0.63 + 0.93) / 2 = 0.78. Поэтому площадь участка равна 0.30 × 0.78 = 0.234.
  kind: numeric
  answer: 0.234
  tolerance: 0.001
  id: 023-auc-ploshad-1
  fingerprint: 02287d31
- concept: одно значение AUC скрывает различия между отдельными участками ROC-кривой
  question: ROC-кривые двух моделей пересекаются, но у первой модели AUC немного больше. Для продукта особенно важна область с очень низкой долей ложных срабатываний. Как корректнее выбрать модель?
  explanation: AUC суммирует всю ROC-кривую и может быть больше даже у модели, которая уступает на важном для продукта участке. При ограничении на ложные срабатывания нужно отдельно сравнить достижимый TPR в соответствующей области FPR.
  kind: choice
  options:
    - Сравнить TPR моделей в допустимой области FPR, а не полагаться только на общую AUC
    - Всегда выбрать первую модель, потому что большая AUC гарантирует превосходство в любой точке ROC-кривой
    - Выбрать модель с наибольшим числом проверенных порогов
    - Сравнить только средние значения оценок, выдаваемых моделями
  correct: 0
  id: 023-auc-ploshad-2
  fingerprint: 3dd51f5a
