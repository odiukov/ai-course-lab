- concept: кросс-валидация оценивает процедуру обучения, а не одну конкретную обученную модель
  question: Что именно оценивает K-fold cross-validation, если для каждого фолда обучается отдельный экземпляр модели?
  explanation: В разных фолдах получаются разные обученные модели. Их оценки показывают, насколько стабильно выбранная процедура обучения обобщается на данные, не использованные в соответствующем проходе.
  kind: open
  reference: 'Она оценивает ожидаемое качество способа получения модели: выбранного алгоритма, его настроек и процедуры обучения на разных подвыборках. Отдельный обученный экземпляр модели не является общим результатом всех проходов.'
  id: 044-cross-val-cycle-2
