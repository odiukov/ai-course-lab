- concept: аномально низкий результат отдельного fold служит диагностическим сигналом, а не однозначным приговором модели
  question: В K-fold cross-validation один fold дал заметно худший результат, чем остальные. Какой вывод обоснован?
  explanation: Провал отдельного fold может быть связан с трудными объектами, отдельной подгруппой или проблемой данных. Сам по себе он не доказывает непригодность модели, но его следует исследовать.
  kind: choice
  options:
    - Модель обязательно непригодна на любых новых данных
    - Результат указывает на возможную чувствительность модели к составу данных и требует анализа этого fold
    - Fold нужно автоматически исключить как случайный выброс
  correct: 1
  id: 047-cv-check-1
  fingerprint: 2c2acb23
- concept: исключение худшего fold без независимого основания создаёт оптимистически смещённую оценку
  question: Почему нельзя удалять результат самого слабого fold только на основании того, что его оценка заметно ниже остальных?
  explanation: Если отбрасывать проверки именно за плохой результат, оценка качества становится завышенной. Низкий результат может отражать реальную неустойчивость модели на трудных или необычных объектах.
  kind: open
  reference: Такое исключение выбирается после просмотра результатов и искусственно улучшает итоговую оценку. Слабый fold нужно сохранить в расчёте и проверить его состав, данные и ошибки модели; исключение допустимо лишь при отдельном обосновании, например подтверждённой ошибке формирования данных.
  id: 047-cv-check-2
  fingerprint: 1e0db9e6
