- concept: ROC-точки перед интегрированием сортируют по возрастанию FPR
  question: Почему перед вычислением площади под ROC-кривой точки нужно упорядочить по возрастанию FPR?
  explanation: FPR играет роль горизонтальной координаты. При движении слева направо ширина каждого участка неотрицательна, и площади корректно складываются.
  kind: open
  reference: Так обход кривой идёт слева направо, поэтому разности соседних FPR неотрицательны. Без сортировки отрицательные ширины участков могут исказить накопленную площадь.
  id: 024-code-auc-1
  fingerprint: 1b4b4dcc
- concept: FPR и TPR одной ROC-точки должны сохраняться как связанная пара при сортировке
  question: 'Есть два согласованных списка координат ROC-кривой: FPR и TPR. Что может произойти, если перед вычислением AUC отсортировать каждый список независимо?'
  explanation: Каждый FPR связан с TPR, полученным при том же пороге. Поэтому сначала формируют пары координат, а затем сортируют целые пары по FPR.
  kind: choice
  options:
    - Изменится только порядок порогов, а ROC-точки останутся прежними
    - FPR могут соединиться с чужими TPR, и появятся точки, не соответствующие ни одному порогу
    - Площадь всегда останется прежней, поскольку оба списка содержат те же значения
  correct: 1
  id: 024-code-auc-2
  fingerprint: d183621c
