- concept: тестовая выборка должна оставаться закрытой до фиксации модели и процедуры оценки
  question: Команда заранее выделила независимую тестовую выборку. Какие решения необходимо зафиксировать до её открытия и почему?
  explanation: Независимость теста определяется не только отсутствием обучения на его примерах. Важно, чтобы сведения о результатах тестирования не использовались при выборе модели, настроек, предобработки, порогов или метрик.
  kind: open
  reference: До открытия тестовой выборки нужно окончательно зафиксировать модель, гиперпараметры, предобработку, пороги и метрики. Тогда результат тестирования не влияет на выбор решений и служит честной оценкой качества на новых данных.
  id: 006-test-odin-raz-1
  fingerprint: ad077475
- concept: для многократной оценки в процессе разработки можно использовать вложенную кросс-валидацию
  question: Данных мало, но нужно и выбрать гиперпараметры, и получить оценку качества, не смещённую этим выбором. Какая процедура подходит лучше всего?
  explanation: Во вложенной кросс-валидации внутренний цикл отвечает за подбор гиперпараметров, а внешний оценивает всю процедуру выбора на данных, не использованных во внутреннем цикле. Это разделяет настройку и итоговую оценку даже при небольшом наборе данных.
  kind: choice
  options:
    - Выбирать гиперпараметры и сообщать качество по одним и тем же разбиениям
    - 'Использовать вложенную кросс-валидацию: внутренний цикл для выбора, внешний для оценки'
    - Обучить модель на всех данных и сообщить качество обучения
    - Проверять варианты на одной фиксированной тестовой выборке
  correct: 1
