- concept: при постоянных истинных значениях полная сумма квадратов равна нулю и формула R² требует отдельной обработки
  question: Почему функция r_squared должна отдельно обрабатывать случай, когда все значения y_true одинаковы?
  explanation: Если все реальные значения совпадают, каждое отклонение от их среднего равно нулю, поэтому ss_tot равна нулю. Обычная формула R² тогда содержит деление на ноль; приведённая реализация возвращает 0.0.
  kind: choice
  options:
    - Среднее значение y_true невозможно вычислить
    - Сумма квадратов ошибок модели всегда становится отрицательной
    - Сумма квадратов отклонений y_true от среднего становится нулевой, поэтому возникает деление на ноль
    - Квадратный корень из ошибки перестаёт быть вещественным
  correct: 2
  id: 029-code-regression-2
  fingerprint: e3ec93a1
- concept: R² вычисляется нормированием суммы квадратов ошибок модели на разброс истинных значений
  question: Для y_true = [10, 14, 18] и y_pred = [12, 13, 17] вычисли коэффициент детерминации R².
  explanation: Среднее y_true равно 14. Получаем ss_res = 6 и ss_tot = 32, поэтому R² = 1 − 6 / 32 = 0.8125.
  kind: numeric
  answer: 0.8125
