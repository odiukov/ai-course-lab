- concept: схождение обучающей и валидационной кривых на низком качестве указывает на высокий bias
  question: На learning curve качество на обучении и валидации с ростом выборки сближается, но обе кривые выходят на низкое плато. Какое действие наиболее обоснованно?
  explanation: 'Низкое общее плато при небольшом разрыве характерно для недообучения: модель не справляется даже со знакомыми данными. Простое увеличение выборки обычно не устраняет такой высокий bias; полезнее повысить выразительность модели или признаков.'
  kind: choice
  options:
    - Увеличить сложность модели или улучшить признаки
    - Продолжать собирать данные, не меняя модель
    - Выбрать другой порог классификации
    - Оценивать модель только на обучающей выборке
  correct: 0
  id: 052-learning-visual-1
  fingerprint: 9d0627ea
- concept: рост validation-кривой на правом краю learning curve означает, что дополнительные данные ещё могут быть полезны
  question: На learning curve при самых больших проверенных объёмах выборки validation-качество продолжает расти, а расстояние до train-кривой уменьшается. Что это говорит о целесообразности сбора дополнительных данных?
  explanation: Продолжающийся рост validation-качества показывает, что эффект увеличения выборки ещё не исчерпан. Сужение разрыва дополнительно указывает, что модель лучше переносит закономерности на новые данные.
  kind: open
  reference: Дополнительные данные, вероятно, ещё улучшат качество на новых примерах, поскольку validation-кривая не вышла на плато. Это диагностический прогноз, а не гарантия точного прироста.
  id: 052-learning-visual-2
  fingerprint: 531ea3af
