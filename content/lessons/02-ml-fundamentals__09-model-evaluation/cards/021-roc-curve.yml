- concept: каждый порог представлен на ROC-кривой парой значений TPR и FPR
  question: При некотором пороге классификатор получил 45 истинно положительных, 15 ложноотрицательных, 18 ложноположительных и 882 истинно отрицательных результата. Какая точка соответствует этому порогу на ROC-кривой?
  explanation: TPR = 45 / (45 + 15) = 0,75, а FPR = 18 / (18 + 882) = 0,02. Именно пара TPR и FPR задаёт точку ROC-кривой для выбранного порога.
  kind: choice
  options:
    - TPR = 0,03; FPR = 0,75
    - TPR = 0,25; FPR = 0,98
    - TPR = 0,75; FPR = 0,02
    - TPR = 0,98; FPR = 0,25
  correct: 2
  id: 021-roc-curve-1
  fingerprint: 39cd62d5
- concept: ROC-кривая описывает качество классификатора во всём диапазоне порогов, а не при одной границе решения
  question: Два классификатора показывают одинаковые TPR и FPR при выбранном пороге. Почему этого недостаточно, чтобы считать их поведение одинаковым по ROC-анализу?
  explanation: Один порог показывает лишь отдельный режим работы модели. ROC-кривая объединяет результаты для множества порогов и позволяет увидеть различия в компромиссе между правильными срабатываниями и ложными тревогами.
  kind: open
  reference: Совпадение при одном пороге означает совпадение только одной точки. При других порогах классификаторы могут давать разные пары TPR и FPR, поэтому нужно сравнить их ROC-кривые во всём диапазоне порогов.
  id: 021-roc-curve-2
  fingerprint: 3160c99c
