- concept: порог классификации выбирают с учётом относительной цены ложноположительных и ложноотрицательных ошибок
  question: Почему у классификатора нет универсально лучшего порога для всех прикладных задач?
  explanation: Порог задаёт компромисс между пропусками и ложными тревогами. Их цена определяется задачей, поэтому один и тот же порог может быть подходящим в одном применении и неприемлемым в другом.
  kind: open
  reference: Оптимальный порог зависит от последствий ошибок. Если особенно опасно пропустить положительный случай, выбирают порог в пользу recall. Если особенно дороги ложные тревоги, порог выбирают в пользу precision.
  id: 019-porog-kompromiss-2
  fingerprint: 4d90c340
- concept: изменение порога меняет правило принятия решения, не изменяя обученные параметры модели
  question: Что остаётся неизменным, если после обучения скоринговой модели поменять только порог классификации?
  explanation: Порог применяется к уже вычисленным оценкам. Его изменение может дать другую матрицу ошибок и другие precision и recall, хотя веса модели и сами оценки объектов остаются прежними.
  kind: cloze
  template: Изменение порога меняет перевод оценки в класс, но не ___ модели.
  answer: обученные параметры
  accept:
    - параметры
    - веса
    - обученные веса
