- concept: train, validation и test используются последовательно и для разных целей
  question: Расположите этапы разработки модели в правильном порядке.
  explanation: Train влияет на параметры модели, validation — на выбор модели и её настроек. Test остаётся изолированным до финальной оценки, чтобы результат отражал качество на данных, не участвовавших в разработке.
  kind: order
  items:
    - Разделить исходные данные на непересекающиеся train, validation и test
    - Обучить модели на train
    - Подобрать гиперпараметры и выбрать модель по validation
    - Зафиксировать итоговую модель
    - Один раз оценить итоговую модель на test
  id: 004-tri-vyborki-1
  fingerprint: 8a493725
- concept: слишком маленькие validation и test дают нестабильную оценку качества
  question: Почему не стоит отдавать почти все данные в train, оставляя для validation и test лишь по несколько примеров?
  explanation: Большой train помогает обучению, но крошечные контрольные выборки дают оценку с высокой случайной изменчивостью. Разбиение должно обеспечивать и достаточный материал для модели, и репрезентативную проверку.
  kind: open
  reference: 'На слишком маленьких выборках оценка сильно зависит от случайного состава данных: отдельная удачная или неудачная ошибка заметно меняет метрику. Поэтому нужно сохранить достаточно данных и для обучения, и для надёжной проверки.'
  id: 004-tri-vyborki-2
  fingerprint: f06cd515
