  fingerprint: d656ddbd
- concept: оценка регрессии должна учитывать величину ошибки числового прогноза
  question: Почему для оценки регрессионной модели недостаточно отмечать каждый прогноз только как верный или неверный?
  explanation: Числовые прогнозы могут ошибаться с разной тяжестью. Одинаковая пометка «неверно» скрывает разницу между почти точным прогнозом и промахом, который существенно влияет на результат.
  kind: open
  reference: Такой признак показывает лишь наличие ошибки и не различает небольшие и крупные промахи. В регрессии нужно измерять расстояние между предсказанным и истинным числом.
  id: 027-oshibki-regressii-2
  fingerprint: b4454048
