- concept: average precision можно вычислить как сумму значений precision, взвешенных по приросту recall
  question: При последовательном снижении порога recall каждый раз увеличивается на 0,25, а precision на этих участках равен 0,92, 0,76, 0,61 и 0,45. Чему равен average precision при ступенчатом вычислении площади?
  explanation: 'Каждое значение precision умножается на соответствующий прирост recall: AP = 0,25 × (0,92 + 0,76 + 0,61 + 0,45) = 0,685. Эта величина суммирует, насколько хорошо модель сохраняет precision при увеличении recall.'
  kind: numeric
  answer: 0.685
  tolerance: 0.001
