- concept: стратификация не может поместить редкий класс в каждый фолд, если объектов этого класса меньше, чем фолдов
  question: Объясни, почему стратифицированное разбиение не гарантирует присутствие редкого класса в каждой проверочной части, когда объектов этого класса меньше, чем фолдов.
  explanation: Стратификация распределяет доступные объекты как можно равномернее, но не создаёт новые данные. Отсутствие редкого класса в некоторых фолдах при таком ограничении неизбежно.
  kind: open
  reference: Каждый объект можно назначить только одной проверочной части. Если объектов редкого класса меньше, чем частей, распределить хотя бы по объекту во все части невозможно, поэтому некоторые из них останутся без этого класса.
