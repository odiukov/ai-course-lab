- concept: false positive rate — доля ложных срабатываний среди всех фактически отрицательных объектов
  question: Заполни знаменатель в формуле false positive rate.
  explanation: 'FPR сравнивает число ложноположительных решений со всеми фактически отрицательными объектами: FP + TN. Поэтому FPR = FP / (FP + TN).'
  kind: cloze
  template: FPR = FP / (___)
  answer: FP + TN
  accept:
    - TN + FP
    - FP+TN
    - TN+FP
  id: 022-roc-visual-1
  fingerprint: d2508d5d
- concept: AUC-ROC определяется качеством ранжирования, а не конкретной шкалой оценок модели
  question: Две модели присвоили объектам разные числовые оценки, но расположили все объекты в одном и том же порядке без ничьих. Как соотносятся их AUC-ROC?
  explanation: AUC-ROC измеряет, насколько хорошо положительные объекты ранжируются выше отрицательных. Если порядок объектов совпадает, перебор порогов даёт одинаковое качество ранжирования, даже когда сами значения оценок различаются.
  kind: choice
  options:
    - AUC-ROC обязательно одинаковы
    - Выше AUC-ROC у модели с большими числовыми оценками
    - Выше AUC-ROC у модели с меньшим порогом
    - Сравнить AUC-ROC без выбора рабочего порога невозможно
