- concept: MAE вычисляется как среднее абсолютных ошибок и сохраняет единицы целевой величины
  question: Фактические значения равны [13, 22, 37], а прогнозы — [16, 28, 44]. Чему равна MAE?
  explanation: 'Абсолютные ошибки равны 3, 6 и 7. Их среднее: 16 / 3 ≈ 5.33. MAE выражается в тех же единицах, что и прогнозируемая величина.'
  kind: numeric
  answer: 5.33
  tolerance: 0.02
  id: 028-regression-formuly-1
  fingerprint: a3da04d9
- concept: возведение ошибок в квадрат делает MSE и RMSE чувствительнее к крупным промахам, чем MAE
  question: У двух моделей одинаковая MAE, но у второй большинство ошибок малы и встречается один особенно крупный промах. Какое утверждение наиболее обоснованно?
  explanation: При вычислении MSE ошибки возводятся в квадрат, поэтому крупный промах получает непропорционально большой вес. RMSE извлекает корень уже после усреднения квадратов и сохраняет эту повышенную чувствительность.
  kind: choice
  options:
    - Коэффициент детерминации у моделей обязательно одинаков
    - MAE второй модели обязательно станет больше
    - RMSE моделей обязательно совпадёт
    - RMSE второй модели может оказаться больше из-за крупного промаха
  correct: 3
  id: 028-regression-formuly-2
  fingerprint: c9856d06
- concept: отрицательный коэффициент детерминации означает результат хуже постоянного прогноза среднего значения
  question: Объясни своими словами, что означает отрицательный коэффициент детерминации у регрессионной модели.
  explanation: Коэффициент детерминации сравнивает ошибки модели с ошибками постоянного прогноза среднего значения. Отрицательный результат показывает, что модель проигрывает такому прогнозу.
  kind: open
  reference: Сумма квадратов ошибок модели превышает разброс истинных значений относительно их среднего. Поэтому постоянный прогноз, всегда равный среднему целевой переменной, оказался бы лучше этой модели.
  id: 028-regression-formuly-3
  fingerprint: e52c781a
