- concept: размах оценок по фолдам равен разности между максимальным и минимальным результатами
  question: Cross-validation дал значения accuracy 73%, 79%, 74% и 80%. Чему равен размах результатов в процентных пунктах?
  explanation: 'Размах равен максимальной оценке минус минимальная: 80% − 73% = 7 процентных пунктов. Он показывает полную ширину колебаний между фолдами.'
  kind: numeric
  answer: 7
