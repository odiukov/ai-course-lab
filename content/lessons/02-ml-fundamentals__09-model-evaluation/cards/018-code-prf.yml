- concept: общие счётчики матрицы ошибок можно переиспользовать для совместного вычисления трёх метрик
  question: Расположите действия функции, которая эффективно вычисляет precision, recall и F1.
  explanation: Одного вызова confusion_matrix достаточно для всех трёх метрик. F1 следует вычислять после precision и recall, поскольку она использует уже найденные значения.
  kind: order
  items:
    - Один раз получить TP, TN, FP и FN с помощью confusion_matrix
    - Вычислить precision по TP и FP
    - Вычислить recall по TP и FN
    - Вычислить F1 из найденных precision и recall
    - Вернуть кортеж precision, recall и F1
  id: 018-code-prf-2
  fingerprint: c07e80ac
- concept: непустые входные данные не гарантируют ненулевые знаменатели precision и recall
  question: Почему при вычислении precision и recall недостаточно проверить только то, что входная выборка не пуста?
  explanation: Знаменатель precision равен TP + FP, а знаменатель recall — TP + FN. Любая из этих сумм может быть нулевой независимо от размера выборки.
  kind: open
  reference: Даже в непустой выборке модель может не предсказать ни одного положительного объекта, тогда у precision отсутствует ненулевой знаменатель. Аналогично, в данных может не быть истинно положительных объектов, и знаменатель recall окажется нулевым. Каждый знаменатель нужно проверять отдельно и в таком случае возвращать нулевое значение.
  id: 018-code-prf-3
  fingerprint: 164bb916
