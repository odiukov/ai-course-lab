- concept: случайное разбиение временных данных может вызвать утечку информации из будущего
  question: Объясни своими словами, почему случайное перемешивание событий за несколько лет может завысить оценку модели, которая после запуска будет предсказывать только будущие события.
  explanation: Временной порядок определяет, какая информация доступна в момент прогноза. Если обучение использует более поздние данные, тест перестаёт воспроизводить реальное предсказание будущего и даёт чрезмерно оптимистичную оценку.
  kind: open
  reference: После перемешивания в обучающую выборку могут попасть более поздние события, чем в тестовую. Модель или её признаки получают информацию о будущем относительно проверяемых случаев, хотя в реальной работе такой информации не будет. Для честной оценки обучение должно предшествовать тестированию по времени.
  id: 001-chestnaya-otsenka-3
