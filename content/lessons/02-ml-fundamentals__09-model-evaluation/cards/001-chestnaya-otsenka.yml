- concept: оценка на обучающих данных не измеряет обобщение на новые случаи
  question: Инженер измерил качество модели на тех же примерах, по которым настраивались её параметры, и получил почти безошибочный результат. Какой вывод обоснован?
  explanation: Модель могла запомнить обучающие примеры. Независимая тестовая выборка нужна, чтобы проверить способность обобщать закономерности на ранее не встречавшиеся случаи.
  kind: choice
  options:
    - Модель надёжно справится с новыми данными
    - По такому результату нельзя судить о работе на новых данных; нужна независимая тестовая выборка
    - Модель следует обучить ещё раз на тестовых примерах
