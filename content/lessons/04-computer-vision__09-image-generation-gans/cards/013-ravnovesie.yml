- concept: выход оптимального дискриминатора определяет отношение плотностей настоящих и сгенерированных данных
  question: Для некоторого изображения оптимальный дискриминатор выдаёт вероятность подлинности 0.8. Во сколько раз плотность настоящих данных в этой точке больше плотности генератора?
  explanation: Из D*(x) = p_data(x) / (p_data(x) + p_G(x)) следует p_data(x) / p_G(x) = D*(x) / (1 − D*(x)). Поэтому 0.8 / 0.2 = 4.
  kind: numeric
  answer: 4
  tolerance: 0.01
  id: 013-ravnovesie-1
  fingerprint: 19e28db5
- concept: неинформативный выход дискриминатора доказывает совпадение распределений только при его оптимальности
  question: Дискриминатор при равных долях настоящих и сгенерированных примеров всегда выдаёт априорную вероятность класса. Какой вывод об обученном генераторе обоснован?
  explanation: Слабый или недообученный дискриминатор тоже может угадывать случайно. Равенство p_G и p_data следует из постоянного выхода 0.5 лишь для лучшего возможного дискриминатора D*.
  kind: choice
  options:
    - Распределение генератора обязательно совпало с распределением данных
    - Генератор обязательно воспроизводит лишь несколько типов изображений
    - Совпадение распределений можно заключить только после проверки, что дискриминатор оптимален для текущего генератора
    - Генератор перестал зависеть от латентного вектора
  correct: 2
