- concept: генеративная модель учится воспроизводить распределение данных, а не единственный целевой образец
  question: Что является основной целью безусловной генеративной модели изображений?
  explanation: В генерации обычно нет единственного правильного изображения. Модель должна создавать разнообразные образцы, которые могли бы принадлежать тому же распределению, что и обучающие данные.
  kind: choice
  options:
    - Для каждого входа восстановить заранее назначенное изображение пиксель в пиксель
    - Создавать разнообразные новые изображения, похожие на выборки из распределения обучающих данных
    - Присваивать каждому изображению правильную метку класса
    - Находить в обучающем наборе ближайшее изображение и возвращать его без изменений
  correct: 1
  id: 001-generatsiya-1
  fingerprint: 4a7c9617
- concept: классификацию нельзя буквально обратить из-за потери информации и соответствия одной метки множеству изображений
  question: Почему генератор изображений нельзя получить, просто запустив обученный классификатор в обратном направлении?
  explanation: 'Отображение «изображение → класс» является отношением многие-к-одному: разные изображения получают одну метку. Метки недостаточно для восстановления исходных деталей, поэтому генерация требует отдельной модели распределения возможных изображений.'
  kind: open
  reference: Классификатор сжимает множество деталей изображения до метки и теряет информацию о позе, фоне, освещении и других свойствах. Одной метке соответствует множество разных изображений, поэтому обратное отображение неоднозначно. Генератор должен моделировать это разнообразие, используя дополнительные переменные, например случайный латентный вектор.
  id: 001-generatsiya-2
  fingerprint: 3528501c
