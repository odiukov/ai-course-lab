- concept: фиксированный набор латентных векторов отделяет изменение генератора от случайной смены входов
  question: Зачем при диагностике GAN периодически генерировать контрольные изображения из одного и того же заранее сохранённого набора латентных векторов?
  explanation: При фиксированных латентных векторах входы контрольной генерации не меняются. Поэтому сравнение сохранённых сэмплов между эпохами показывает, как эволюционирует отображение генератора, и помогает отличить прогресс, осцилляцию и потерю разнообразия.
  kind: choice
  options:
    - Чтобы изменения изображений отражали изменение весов генератора, а не случайную смену входного шума
    - Чтобы генератор запомнил контрольные изображения и быстрее уменьшил loss
    - Чтобы дискриминатор получал одинаковый батч на каждом шаге оптимизации
    - Чтобы полностью устранить случайность из обучения обеих сетей
