- concept: победа дискриминатора диагностируется по устойчивому сочетанию метрик и отсутствию прогресса сэмплов
  question: Какое наблюдение наиболее убедительно показывает, что discriminator стал слишком сильным и остановил обучение generator?
  explanation: Один всплеск точности ещё не означает отказ обучения. Диагноз подтверждает сохраняющееся сочетание почти идеального discriminator, большой неподвижной потери generator и отсутствия структуры в сэмплах.
  kind: choice
  options:
    - Точность discriminator кратковременно выросла, но затем снизилась, а качество сэмплов продолжило улучшаться
    - Discriminator стабильно почти безошибочен на обоих классах, его loss близок к нулю, loss generator велик и неподвижен, а сэмплы остаются шумом
    - Loss обеих сетей постепенно уменьшается, а в сэмплах появляются узнаваемые структуры
    - Loss generator колеблется, но разнообразие и качество сэмплов устойчиво растут
  correct: 1
  id: 042-discriminator-wins-1
  fingerprint: b905ae42
- concept: большая потеря генератора не гарантирует полезного градиента по его параметрам
  question: Объясни своими словами, почему большая non-saturating loss generator не доказывает, что generator получает полезное направление для обновления.
  explanation: Non-saturating loss усиливает сигнал на выходном логите, однако итоговый градиент также зависит от производных внутренних слоёв discriminator по изображению. Поэтому высокая ошибка может сочетаться с почти бесполезным обновлением generator.
  kind: open
  reference: Величина loss определяется выходом discriminator, а обновление generator — полным градиентом через все слои discriminator и самого generator. Слишком уверенный discriminator может иметь слабые или неинформативные производные возле текущих подделок, поэтому loss остаётся большой, но параметры generator почти не получают полезного направления.
  id: 042-discriminator-wins-2
  fingerprint: 4325d193
