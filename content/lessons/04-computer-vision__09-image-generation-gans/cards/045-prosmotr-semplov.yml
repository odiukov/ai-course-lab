- concept: precision и recall разделяют качество сэмплов и покрытие распределения данных
  question: Объясни своими словами, чем различаются precision и recall при оценке генеративной модели и почему полезно рассматривать обе метрики.
  explanation: 'Генератор может выдавать небольшое число очень качественных вариантов: тогда precision будет высокой, а recall — низким. Раздельные метрики позволяют отличить недостаточную реалистичность от недостаточного разнообразия.'
  kind: open
  reference: Precision показывает, какая доля сгенерированных примеров похожа на реальные данные, то есть оценивает качество. Recall показывает, какую часть разнообразия реального распределения способен покрыть генератор. Высокая precision при низком recall возможна при схлопывании мод, поэтому одна метрика не заменяет другую.
  id: 045-prosmotr-semplov-2
  fingerprint: 5553bee8
