- concept: финальная свёртка по всей карте признаков превращает её в скалярный логит
  question: Перед выходом дискриминатора остаётся пространственная карта признаков. Какая операция напрямую превращает её в скалярный логит для каждого изображения, сохраняя свёрточную архитектуру?
  explanation: Если ядро охватывает всю карту и padding отсутствует, для него существует только одна пространственная позиция. В архитектуре из урока свёртка 4×4 преобразует карту 4×4 в 1×1, после чего остаётся один логит на изображение.
  kind: choice
  options:
    - Точечная свёртка без последующей пространственной агрегации
    - Свёртка ядром во всю оставшуюся карту без padding, настроенная на скалярный выход
    - Объединение пространственных координат с осью батча
    - BatchNorm по оставшейся карте признаков
  correct: 1
  id: 026-ustroistvo-discriminatora-1
  fingerprint: 7b178d90
- concept: последовательные свёртки увеличивают рецептивное поле признаков дискриминатора
  question: Объясни своими словами, почему глубокие слои свёрточного дискриминатора могут оценивать целые формы и согласованность изображения, хотя первые слои обнаруживают лишь локальные детали.
  explanation: Свёртки со stride=2 одновременно уменьшают пространственную карту и расширяют область исходного изображения, влияющую на каждую следующую активацию. Финальная свёртка объединяет признаки карты 4×4 и формирует общую оценку изображения.
  kind: open
  reference: 'Каждая следующая свёртка получает признаки, уже собранные из соседних областей предыдущего слоя. Поэтому рецептивное поле постепенно растёт: глубокая активация зависит от всё большей части исходного изображения и объединяет локальные контуры и текстуры в признаки крупных объектов и общей правдоподобности.'
  id: 026-ustroistvo-discriminatora-2
  fingerprint: 44ae3ae8
