- concept: в режиме eval BatchNorm использует накопленную статистику вместо статистики текущего батча
  question: Почему генератор с BatchNorm перед созданием изображений переводят в режим eval, особенно если размер батча при sampling может меняться?
  explanation: В режиме train BatchNorm вычисляет статистику текущего батча, поэтому изменение его размера или состава может заметно изменить изображения. В режиме eval используется накопленная статистика, что делает sampling стабильнее.
  kind: open
  reference: В режиме eval слои BatchNorm нормализуют активации с помощью накопленных во время обучения среднего и дисперсии. Поэтому результат не зависит от статистики текущего, возможно очень маленького, батча.
  id: 034-sampling-mode-1
  fingerprint: f2d91a77
- concept: eval не отключает autograd, поэтому при sampling вычислительный граф нужно запрещать отдельно
  question: Заполни пропуск контекстом, который предотвращает построение ненужного вычислительного графа при sampling.
  explanation: Вызов eval() меняет поведение некоторых слоёв, но не отключает автоматическое дифференцирование. Контекст torch.no_grad() не сохраняет данные для обратного прохода, поэтому sampling требует меньше памяти.
  kind: cloze
  template: |-
    G.eval()
    with ___:
        imgs = G(z)
  answer: torch.no_grad()
  accept:
    - no_grad()
  id: 034-sampling-mode-2
  fingerprint: a0b73543
- concept: после временного sampling в eval генератор нужно вернуть в train для продолжения обновления статистики BatchNorm
  question: После создания контрольных изображений генератор случайно оставили в режиме eval и начали следующую эпоху. Веса по-прежнему обновляются. Что при этом происходит с BatchNorm?
  explanation: 'Режим eval не запрещает обновление весов оптимизатором, но меняет поведение BatchNorm: слой использует накопленную статистику и не обновляет её. Поэтому после sampling следует вызвать G.train().'
  kind: choice
  options:
    - Накопленные средние и дисперсии сбрасываются перед каждым батчем
    - Обучаемые параметры масштабирования и сдвига перестают получать градиенты
    - Для нормализации снова используется статистика каждого текущего батча
    - Накопленные средние и дисперсии не обновляются, а нормализация продолжает использовать прежнюю статистику
  correct: 3
