- concept: работу условного GAN проверяют управляемостью класса и внутриклассовым разнообразием
  question: Как экспериментально проверить, что условный DCGAN действительно использует метку класса, а не игнорирует её?
  explanation: Смена класса при фиксированном шуме показывает влияние метки. Разные изображения при одной метке подтверждают, что generator не свёл каждый класс к единственному шаблону.
  kind: open
  reference: 'Подать один и тот же латентный вектор с разными метками и проверить, что класс изображения меняется вслед за меткой. Затем менять шум при неизменной метке: класс должен сохраняться, а отдельные образцы — различаться.'
