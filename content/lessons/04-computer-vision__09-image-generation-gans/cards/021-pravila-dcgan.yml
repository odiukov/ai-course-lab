- concept: исключения из применения batch normalization в DCGAN
  question: На каких участках DCGAN не применяют batch normalization?
  explanation: Batch normalization используют в обеих сетях, кроме выхода G и входа D. Выход генератора формируется через tanh, а дискриминатор должен принимать исходное изображение без предварительной нормализации внутри своей архитектуры.
  kind: choice
  options:
    - На выходе генератора и входе дискриминатора
    - На входе генератора и выходе дискриминатора
    - Только в скрытых слоях генератора
    - Только в скрытых слоях дискриминатора
  correct: 0
  id: 021-pravila-dcgan-1
  fingerprint: 99b7f33d
- concept: LeakyReLU сохраняет градиент дискриминатора для отрицательных активаций
  question: Какая активация на скрытых слоях дискриминатора DCGAN не обнуляет градиент при отрицательном входе?
  explanation: DCGAN использует в дискриминаторе LeakyReLU с negative_slope=0.2. В отрицательной области её производная остаётся ненулевой, поэтому дискриминатор продолжает передавать генератору полезный градиент.
  kind: cloze
  template: activation = nn.___()
  answer: LeakyReLU
  accept:
    - LeakyReLU
    - leaky_relu
    - leaky relu
