- concept: отказ от полносвязных слоёв сохраняет пространственную структуру изображений
  question: Почему в глубоких архитектурах DCGAN избегают полносвязных слоёв и опираются на свёртки?
  explanation: Свёрточные слои обрабатывают локальные области общими фильтрами и сохраняют связи между соседними частями изображения. Это лучше соответствует структуре изображений и уменьшает число параметров по сравнению с полносвязными слоями.
  kind: open
  reference: Свёртки учитывают локальную и пространственную структуру изображения, тогда как полносвязные слои смешивают все позиции и теряют полезное представление их взаимного расположения.
  id: 021-pravila-dcgan-3
  fingerprint: 4bb8e8cb
