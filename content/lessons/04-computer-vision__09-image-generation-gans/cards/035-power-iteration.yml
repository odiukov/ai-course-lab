- concept: наибольшее сингулярное число задаёт максимальный коэффициент усиления линейного слоя
  question: Что характеризует наибольшее сингулярное число матрицы весов W?
  explanation: 'Наибольшее сингулярное число равно операторной норме матрицы: оно показывает, во сколько раз линейное преобразование способно максимально растянуть входной вектор.'
  kind: choice
  options:
    - Максимальное отношение длины Wx к длине ненулевого входного вектора x
    - Среднее значение всех элементов матрицы W
    - Количество независимых строк матрицы W
  correct: 0
  id: 035-power-iteration-1
  fingerprint: e97a7b4e
- concept: power iteration чередует нормированные умножения на матрицу и её транспонированную версию
  question: Расположите действия одного цикла power iteration и последующей оценки сингулярного числа в правильном порядке.
  explanation: Умножение на W уточняет выходное направление максимального растяжения, а умножение на Wᵀ возвращает эту информацию во входное пространство. Нормировка сохраняет направление, не позволяя длинам векторов неконтролируемо меняться.
  kind: order
  items:
    - Взять текущий нормированный входной вектор v
    - Вычислить Wv и нормировать результат, получив u
    - Вычислить Wᵀu и нормировать результат, обновив v
    - Оценить наибольшее сингулярное число выражением uᵀWv
  id: 035-power-iteration-2
  fingerprint: 9f9429f5
- concept: сохранение сингулярных векторов между обновлениями весов ускоряет повторную оценку спектральной нормы
  question: Объясните своими словами, почему при обучении сети выгодно начинать очередную power iteration с сохранённых ранее векторов u и v, а не со случайных направлений.
  explanation: Такой тёплый старт использует близость последовательных версий матрицы весов. Он позволяет дёшево обновлять приближение наибольшего сингулярного числа во время обучения.
  kind: open
  reference: После шага оптимизатора матрица весов обычно изменяется относительно мало, поэтому её ведущие сингулярные направления также остаются близки к прежним. Сохранённые u и v уже дают хорошее начальное приближение, и алгоритму требуется меньше уточнений.
  id: 035-power-iteration-3
  fingerprint: 86bde2cc
