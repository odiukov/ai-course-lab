- concept: ненасыщающаяся потеря усиливает градиент генератора при малой оценке подделки
  question: Пусть дискриминатор оценивает подделку с вероятностью 0.04. Во сколько раз модуль градиента ненасыщающейся потери по логиту дискриминатора больше модуля градиента исходной насыщающейся цели?
  explanation: 'Для исходной цели модуль градиента по логиту равен вероятности подлинности подделки, а для ненасыщающейся — единице минус эта вероятность. Поэтому отношение равно 0.96 / 0.04 = 24: ненасыщающаяся форма передаёт генератору гораздо более сильный сигнал.'
  kind: numeric
  answer: 24
  tolerance: 0.05
  id: 016-nonsaturating-1
  fingerprint: 6057250e
- concept: замена потери генератора меняет динамику градиента, но не желаемое направление оптимизации
  question: Что сохраняется при замене исходной цели генератора на ненасыщающуюся потерю?
  explanation: 'Обе формы побуждают генератор повышать D(G(z)). Ненасыщающаяся потеря меняет не желаемый результат, а форму обратной связи: при уверенном распознавании подделки её градиент остаётся полезным.'
  kind: choice
  options:
    - Численное значение потери для каждого сгенерированного изображения
    - Модуль градиента при любой оценке дискриминатора
    - Стремление генератора повышать оценку подлинности своих изображений
    - Правило обновления параметров дискриминатора и генератора одновременно
  correct: 2
  id: 016-nonsaturating-2
