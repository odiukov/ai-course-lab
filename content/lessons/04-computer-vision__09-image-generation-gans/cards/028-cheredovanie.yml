- concept: последовательность обновления дискриминатора и генератора на одном батче
  question: Расположите операции одного обучающего батча GAN в правильном порядке.
  explanation: Сначала обучается D, причём выход G отсоединяют от графа. После обновления D генератор получает сигнал уже от новой версии дискриминатора и обновляется отдельно.
  kind: order
  items:
    - Обнулить градиенты дискриминатора
    - Вычислить его потерю на настоящих и отсоединённых сгенерированных изображениях, затем обновить дискриминатор
    - Обнулить градиенты генератора
    - Снова пропустить сгенерированные изображения через обновлённый дискриминатор, затем обновить генератор
  id: 028-cheredovanie-1
  fingerprint: d7d2511a
- concept: detach предотвращает вычисление и накопление градиентов генератора при обучении дискриминатора
  question: Что произойдёт, если при обновлении дискриминатора вычислить подделки как G(z) без detach(), а затем вызвать loss_d.backward()?
  explanation: Обратный проход идёт через D и G, если граф не разорван. opt_d.step() меняет только параметры D, однако вычисленные градиенты останутся в параметрах G и могут сложиться с градиентами его собственного шага. detach() отсекает этот путь.
  kind: choice
  options:
    - Оптимизатор дискриминатора сразу изменит параметры обеих сетей
    - Градиенты будут вычислены и для генератора; его параметры пока не изменятся, но градиенты могут накопиться и исказить последующее обновление
    - Дискриминатор перестанет получать градиенты от сгенерированных изображений
    - Генератор обновится корректно, потому что его потеря совпадает с потерей дискриминатора
  correct: 1
  id: 028-cheredovanie-2
  fingerprint: 5760a7ae
