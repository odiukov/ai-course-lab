- concept: липшицева константа композиции ограничена произведением констант её компонентов
  question: Заполни формулу верхней границы для липшицевой константы композиции функций.
  explanation: Изменение сначала усиливается функцией g, а затем функцией f, поэтому коэффициенты усиления перемножаются. Ограничение каждого слоя удерживает под контролем максимально возможную крутизну всей сети.
  kind: cloze
  template: Lip(f ∘ g) ≤ ___
  answer: Lip(f) · Lip(g)
  accept:
    - Lip(f)*Lip(g)
    - Lip(f)×Lip(g)
    - произведение Lip(f) и Lip(g)
  id: 037-spectral-norm-1
  fingerprint: 73150a06
- concept: spectral normalization ограничивает чувствительность дискриминатора, а не его уверенность на любых входах
  question: Объясни своими словами, почему discriminator со spectral normalization всё ещё может уверенно распознавать явную подделку.
  explanation: Ограничение Липшица связывает разность выходов с расстоянием между входами. Оно сглаживает реакцию на малые изменения, но не требует одинаковых или неуверенных ответов для существенно разных изображений.
  kind: open
  reference: Spectral normalization ограничивает величину изменения выхода при изменении входа, но не задаёт сами значения логитов. Поэтому на достаточно различающихся изображениях оценки могут сильно отличаться, хотя между близкими входами они не должны меняться чрезмерно резко.
  id: 037-spectral-norm-2
  fingerprint: ebe658d0
