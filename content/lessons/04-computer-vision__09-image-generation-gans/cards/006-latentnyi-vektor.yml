- concept: координаты латентного вектора задают распределённые и часто переплетённые свойства изображения
  question: Объясни, почему изменение одной координаты латентного вектора может согласованно изменить множество пикселей и сразу несколько свойств изображения. Обязана ли такая координата отвечать только за один понятный признак?
  explanation: Генератор разворачивает компактный вектор из 64 чисел в 3072 связанных значения. Координаты z не соответствуют отдельным пикселям, а их смысл обычно распределён и может быть переплетён с другими координатами.
  kind: open
  reference: 'Координата проходит через общие слои генератора и влияет на множество выходных значений, поэтому изменения пикселей оказываются связанными. Генератор не обязан разделять факторы изображения: одна координата может одновременно влиять, например, на форму, цвет и освещение.'
  id: 006-latentnyi-vektor-2
  fingerprint: 5047bedb
