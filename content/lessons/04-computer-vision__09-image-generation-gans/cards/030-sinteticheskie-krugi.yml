- concept: число шагов обучения равно числу батчей в эпохе, умноженному на число эпох
  question: Набор содержит 1536 изображений, размер батча равен 96, а обучение длится 7 эпох. Сколько обновлений выполнит цикл, если каждый батч вызывает один шаг обучения?
  explanation: В одной эпохе будет 1536 / 96 = 16 батчей. За 7 эпох цикл выполнит 16 × 7 = 112 обновлений. Аналогично, в уроке 2000 изображений при batch_size=64 дают 32 батча на эпоху и около 320 шагов за 10 эпох.
  kind: numeric
  answer: 112
  tolerance: 0.25
  id: 030-sinteticheskie-krugi-2
