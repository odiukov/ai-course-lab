- concept: выходной размер транспонированной свёртки вычисляется совместно по входному размеру, stride, padding и kernel size
  question: Транспонированная свёртка получает карту высотой 9 и использует kernel_size=7, stride=5, padding=6, output_padding=0 и dilation=1. Какова высота выхода?
  explanation: Для стандартных dilation и output_padding применяется формула H_out=(H_in−1)·stride−2·padding+kernel_size. Подстановка параметров даёт высоту 35.
  kind: numeric
  answer: 35
  tolerance: 0.001
  id: 022-razmer-transposed-conv-1
  fingerprint: 96bc1bca
- concept: число каналов не влияет на пространственный размер выхода транспонированной свёртки
  question: Два слоя ConvTranspose2d получают карты одинаковой высоты и ширины и имеют одинаковые kernel_size, stride и padding, но различаются числом входных и выходных каналов. Как будут соотноситься пространственные размеры их выходов?
  explanation: Высоту и ширину определяют входной пространственный размер и параметры kernel_size, stride, padding, dilation и output_padding. Число каналов меняет глубину тензора, но не его высоту и ширину.
  kind: choice
  options:
    - Будут одинаковыми
    - Слой с большим числом выходных каналов создаст более широкую и высокую карту
    - Слой с большим числом входных каналов создаст меньшую карту
  correct: 0
