- concept: число уникальных неупорядоченных пар сэмплов без самосравнений
  question: В батче находятся 7 сгенерированных сэмплов. Сколько уникальных пар разных сэмплов нужно сравнить, если пары с обратным порядком не дублировать?
  explanation: Для n сэмплов число уникальных пар равно n(n − 1) / 2. При n = 7 получаем 7 · 6 / 2 = 21.
  kind: numeric
  answer: 21
  tolerance: 0.01
  id: 041-code-collapse-score-1
  fingerprint: 89cb33dd
- concept: включение диагонали матрицы расстояний смещает оценку разнообразия
  question: Объясни своими словами, почему при оценке разнообразия сэмплов нельзя усреднять расстояния на диагонали матрицы попарных расстояний.
  explanation: Диагональные элементы не описывают различия между сэмплами. Если включить их в среднее, среднее расстояние уменьшится и score искусственно приблизится к 1.
  kind: open
  reference: На диагонали находится расстояние каждого сэмпла до самого себя, которое всегда нулевое. Эти искусственные нули уменьшают среднее расстояние, поэтому сэмплы кажутся более похожими, чем на самом деле, а оценка mode collapse получается завышенной.
  id: 041-code-collapse-score-2
  fingerprint: 4b97bf26
