  fingerprint: 1789f8ad
- concept: попарное разнообразие сэмплов не является оценкой их реалистичности
  question: Объясни своими словами, почему низкий score mode collapse ещё не означает, что генератор создаёт качественные изображения. Приведи контрпример.
  explanation: Метрика отвечает на вопрос о разнообразии, а не о качестве. Поэтому её следует интерпретировать вместе с сохранёнными сэмплами и другими диагностическими сигналами обучения.
  kind: open
  reference: 'Score измеряет лишь сходство выходов друг с другом и не проверяет их соответствие распределению реальных изображений. Например, генератор может выдавать каждый раз разный случайный шум: попарные расстояния будут большими и score схлопывания низким, хотя сэмплы останутся нереалистичными.'
