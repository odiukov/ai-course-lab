- concept: настоящим и сгенерированным изображениям назначаются разные целевые метки дискриминатора
  question: Заполни пропуск так, чтобы цели соответствовали задаче дискриминатора GAN.
  explanation: Настоящие изображения относятся к положительному классу, поэтому для real_logits нужны единичные цели. Сгенерированные изображения относятся к отрицательному классу, поэтому для fake_logits нужны нулевые цели.
  kind: cloze
  template: real_targets, fake_targets = ___
  answer: torch.ones_like(real_logits), torch.zeros_like(fake_logits)
  accept:
    - (torch.ones_like(real_logits), torch.zeros_like(fake_logits))
  id: 015-code-discriminator-loss-1
  fingerprint: 5fdc8365
- concept: градиент BCE для поддельного изображения должен уменьшать ошибочно высокий логит дискриминатора
  question: Для сгенерированного изображения discriminator выдал большой положительный логит, то есть уверенно назвал подделку настоящей. Как минимизация BCE должна изменить этот логит?
  explanation: Цель для подделки равна нулю. Производная BCE по её логиту положительна, поэтому шаг градиентного спуска уменьшает логит и вероятность того, что discriminator примет подделку за настоящее изображение.
  kind: choice
  options:
    - Уменьшить логит, сдвигая предсказание к отрицательному классу
    - Увеличить логит, усиливая текущую уверенность
    - Оставить логит неизменным, потому что он уже далеко от границы классов
