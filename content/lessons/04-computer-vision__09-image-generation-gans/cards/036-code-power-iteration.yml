- concept: оценка сингулярного числа вычисляется как скалярная билинейная форма
  question: Как по матрице весов W_mat и последним нормированным векторам u и v получить скалярную оценку sigma?
  explanation: Произведение uᵀWv сворачивает оба векторных измерения и возвращает скалярный тензор. После power iteration векторы ориентированы вдоль ведущих сингулярных направлений, поэтому выражение приближает наибольшее сингулярное число.
  kind: cloze
  template: sigma = ___
  answer: u @ W_mat @ v
  accept:
    - u.T @ W_mat @ v
    - torch.dot(u, W_mat @ v)
  id: 036-code-power-iteration-2
  fingerprint: 1f0c7873
- concept: малое слагаемое в знаменателе делает нормализацию устойчивой для почти нулевых векторов
  question: Объясни, зачем при нормализации вектора в power iteration добавлять к его норме малое положительное слагаемое.
  explanation: Умножение на нулевую матрицу или численное вырождение может дать вектор нулевой длины. Защитное слагаемое сохраняет конечный знаменатель, почти не влияя на нормализацию невырожденных векторов.
  kind: open
  reference: Оно предотвращает деление на ноль и появление NaN, если вектор оказался нулевым или почти нулевым. Для вектора с обычной ненулевой нормой достаточно малое слагаемое почти не меняет его направление.
  id: 036-code-power-iteration-3
  fingerprint: '06627151'
