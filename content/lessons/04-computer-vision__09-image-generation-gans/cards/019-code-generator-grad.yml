- concept: градиент средней потери нормируется на количество элементов батча
  question: Заполните пропуск в формуле градиента средней по батчу функции потерь.
  explanation: Операция mean делит сумму индивидуальных потерь на число элементов N. Поэтому каждая компонента градиента также получает множитель, обратный N; без него масштаб обновления зависел бы от размера батча.
  kind: cloze
  template: Если L = mean_j q_j и производная индивидуальной потери по логиту равна r_i, то ∂L/∂a_i = ___
  answer: r_i / N
  accept:
    - r_i/N
    - r_i / batch_size
    - r_i / len(a)
  id: 019-code-generator-grad-1
  fingerprint: 684ce82f
- concept: градиент скалярной потери по массиву логитов имеет форму этого массива
  question: Дискриминатор вернул массив fake_logits, а функция потерь свела его к одному скаляру. Что должна вернуть generator_loss_grad(fake_logits) для дальнейшего обратного прохода?
  explanation: Градиент скаляра по массиву содержит отдельную частную производную для каждой его координаты, поэтому совпадает с fake_logits по форме. Это входящий градиент для последующего обратного прохода через дискриминатор и генератор.
  kind: choice
  options:
    - Один скаляр — производную потери по среднему логиту
    - Массив значений sigmoid без вычисления производных
    - Массив той же формы, где каждый элемент — частная производная потери по соответствующему логиту
    - Готовые градиенты всех параметров генератора
  correct: 2
