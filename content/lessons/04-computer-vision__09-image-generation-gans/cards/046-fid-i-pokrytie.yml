- concept: FID обычно предпочитают Inception Score как более устойчивый стандарт оценки GAN
  question: Почему для основной автоматической оценки GAN обычно предпочитают FID, а не Inception Score?
  explanation: Inception Score может давать менее надёжную картину качества генератора. FID удобнее для сравнения моделей, поскольку учитывает расхождение между признаковыми распределениями настоящих и сгенерированных наборов.
  kind: open
  reference: Inception Score считается более старой и капризной метрикой, тогда как FID стал стандартом сообщества и напрямую сопоставляет распределения признаков настоящих и сгенерированных изображений.
  id: 046-fid-i-pokrytie-2
