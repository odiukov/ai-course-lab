- concept: противоположные направления оптимизации общей целевой функции GAN
  question: Как discriminator и generator воздействуют на общую минимаксную целевую функцию GAN?
  explanation: 'Discriminator повышает целевую функцию, правильно оценивая настоящие и поддельные изображения. Generator действует в противоположном направлении: меняет подделки так, чтобы discriminator принимал их за настоящие.'
  kind: choice
  options:
    - Обе сети минимизируют её, но используют разные обучающие данные
    - Discriminator максимизирует её, а generator минимизирует
    - Generator максимизирует её, а discriminator не участвует в оптимизации
    - Обе сети максимизируют её по очереди
  correct: 1
  id: 007-igra-1
  fingerprint: 963b5a03
- concept: неразличимость настоящего и сгенерированного распределений в равновесии GAN
  question: Почему оптимальный discriminator вынужден одинаково оценивать настоящий и сгенерированный примеры, если распределение generator полностью совпало с распределением данных?
  explanation: В глобальном равновесии выполняется p_G = p_data, а расстояние Йенсена — Шеннона равно нулю. Значение D(x) = 0.5 означает не плохое обучение discriminator, а отсутствие различий, на которых можно построить классификацию.
  kind: open
  reference: 'Происхождение изображения больше нельзя определить по самому изображению: настоящие и сгенерированные примеры имеют одно распределение. Поэтому discriminator не может найти признак, который давал бы преимущество одному классу, и назначает им равные вероятности.'
  id: 007-igra-2
  fingerprint: 6d69a637
