- concept: learning rate задаёт масштаб градиента, но не гарантирует одинаковую величину обновления параметров
  question: У ранней стадии learning rate меньше, чем у головы, но норма её градиента значительно больше. Что можно утверждать о величине обновления ранней стадии?
  explanation: В простейшем случае обновление пропорционально произведению learning rate и градиента. Маленький learning rate уменьшает масштаб шага, но большой градиент всё равно может привести к заметному изменению параметров.
  kind: choice
  options:
    - Она обязательно меньше обновления головы
    - Она может оказаться больше обновления головы, поскольку зависит и от learning rate, и от градиента
    - Она обязательно равна обновлению головы
    - Параметры ранней стадии вообще не обновляются
  correct: 1
  id: 023-raznye-skorosti-1
  fingerprint: ae1e2e57
- concept: learning rate ранней группы вычисляется делением базовой скорости на заданный коэффициент
  question: Для поздней стадии задан learning rate 0.0036. Ранняя стадия должна обучаться в 60 раз медленнее. Какой learning rate нужно назначить ранней стадии?
  explanation: 'Нужно разделить скорость поздней стадии на коэффициент: 0.0036 / 60 = 0.00006. Такой масштаб позволяет осторожнее изменять ранние параметры.'
  kind: numeric
  answer: 0.00006
  tolerance: 1.e-7
  id: 023-raznye-skorosti-2
  fingerprint: da4d1c35
