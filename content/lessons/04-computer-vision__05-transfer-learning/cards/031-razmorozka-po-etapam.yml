- concept: progressive unfreezing последовательно расширяет обучаемую область от головы к ранним стадиям backbone
  question: Расположите этапы progressive unfreezing в правильном порядке.
  explanation: Сначала голова учится интерпретировать стабильные предобученные признаки. Затем граница обучаемой области постепенно сдвигается от выхода сети к её входу.
  kind: order
  items:
    - Обучить новую классификационную голову при замороженном backbone
    - Разморозить ближайшую к голове стадию backbone
    - Последовательно размораживать всё более ранние стадии backbone
  id: 031-razmorozka-po-etapam-1
  fingerprint: 6370c241
- concept: предварительное обучение головы делает градиент для позднее размораживаемых слоёв более осмысленным
  question: Почему при progressive unfreezing новую голову некоторое время обучают до размораживания ранних слоёв backbone?
  explanation: Случайно инициализированная голова в начале создаёт плохо направленный обучающий сигнал. После её адаптации градиенты, поступающие в backbone, становятся полезнее для целевой задачи.
  kind: open
  reference: Голова сначала учится связывать стабильные предобученные признаки с целевыми классами. Поэтому после размораживания backbone ошибка формируется уже не почти случайной головой, а частично обученным классификатором, и градиент лучше отражает требования новой задачи.
  id: 031-razmorozka-po-etapam-2
