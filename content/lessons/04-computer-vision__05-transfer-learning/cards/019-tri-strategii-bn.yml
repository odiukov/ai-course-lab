- concept: при достаточном объёме целевых данных BatchNorm следует обновлять статистики нового домена
  question: Предобученную модель полностью дообучают на крупной выборке изображений с нового сенсора. Распределение яркости заметно отличается от ImageNet. Какой режим BatchNorm наиболее уместен?
  explanation: Крупная целевая выборка позволяет устойчиво оценить средние и дисперсии нового домена. В train mode BatchNorm постепенно заменит неподходящие статистики ImageNet.
  kind: choice
  options:
    - Оставить BatchNorm в eval mode и сохранить статистики ImageNet
    - Держать BatchNorm в train mode, чтобы обновлять бегущие статистики
    - Удалить нормализацию из backbone
  correct: 1
  id: 019-tri-strategii-bn-1
  fingerprint: e7385165
- concept: на очень малой выборке заморозка BatchNorm снижает шум бегущих статистик
  question: Почему при дообучении на очень маленькой целевой выборке BatchNorm иногда оставляют в eval mode, даже если новый домен отличается от ImageNet?
  explanation: Здесь приходится выбирать между смещёнными, но устойчивыми статистиками исходного домена и потенциально более подходящими, но шумными статистиками малого датасета.
  kind: open
  reference: Новая выборка слишком мала для устойчивой оценки средних и дисперсий, поэтому обновляемые бегущие статистики будут шумными. Сохранение статистик ImageNet в таком случае может дать меньшую ошибку, чем их нестабильная переоценка.
  id: 019-tri-strategii-bn-2
  fingerprint: 0314face
- concept: GroupNorm подходит для обучения с постоянно крошечными батчами
  question: Backbone обучают для сегментации изображений высокого разрешения, и на каждом GPU помещается лишь крошечный батч. Чем разумнее заменить BatchNorm?
  explanation: GroupNorm вычисляет статистики по группам каналов внутри отдельного изображения и не накапливает бегущие средние по батчам. Поэтому его работа остаётся устойчивой при малом размере батча.
  kind: choice
  options:
    - Dropout, потому что он усредняет активации между примерами
    - Дополнительным полносвязным слоем, чтобы компенсировать шум
    - GroupNorm, потому что его нормализация не зависит от статистик батча
  correct: 2
  id: 019-tri-strategii-bn-3
  fingerprint: 89e0a34e
