- concept: планировщик с расписанием в эпохах вызывают после всех обучающих батчей эпохи
  question: Расписание learning rate задано в эпохах, но scheduler.step() вызывается после каждого мини-батча. К чему это приведёт?
  explanation: Планировщик продвигает расписание при каждом вызове step(). Если расписание рассчитано на эпохи, scheduler.step() нужно вызывать после полного прохода по обучающим батчам, чтобы новая скорость применялась к следующей эпохе.
  kind: choice
  options:
    - Оптимизатор перестанет учитывать momentum
    - Learning rate пройдёт расписание слишком быстро, потому что каждый батч будет засчитан как целая эпоха
    - Градиенты начнут накапливаться между эпохами
    - 'Ничего не изменится: scheduler учитывает только вызовы model.train()'
  correct: 1
  id: 036-epoha-finetuning-1
  fingerprint: cb767867
- concept: model.eval() и torch.no_grad() решают разные задачи при валидации
  question: Почему при валидации обычно нужны и model.eval(), и контекст torch.no_grad()?
  explanation: model.eval() меняет поведение модулей вроде Dropout и BatchNorm, но сам по себе не отключает autograd. torch.no_grad() экономит память и вычисления, не позволяя строить граф, но не переводит слои в режим оценки.
  kind: open
  reference: model.eval() переключает зависящие от режима слои на поведение для оценки, а torch.no_grad() запрещает построение графа градиентов. Один механизм не заменяет другой.
  id: 036-epoha-finetuning-2
  fingerprint: 89944f78
