- concept: состав обучаемых параметров и разные learning rate задают режим переноса
  question: Какая настройка оптимизатора соответствует fine-tuning предобученной модели с новой головой?
  explanation: При fine-tuning обновляются обе части модели. Предобученный backbone адаптируют осторожно малым learning rate, а случайно инициализированную голову обучают быстрее.
  kind: choice
  options:
    - Оптимизировать только backbone, исключив голову
    - Оптимизировать backbone с малым learning rate, а новую голову — с более высоким
    - Оптимизировать только новую голову, не обновляя backbone
    - Не оптимизировать ни backbone, ни голову
  correct: 1
