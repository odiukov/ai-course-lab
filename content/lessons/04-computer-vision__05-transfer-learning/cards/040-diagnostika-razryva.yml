- concept: размер прироста после fine-tuning нужно интерпретировать вместе с абсолютной точностью linear probe
  question: Два backbone после полного fine-tuning достигают 86% точности. Для первого linear probe даёт 64%, для второго — 21%. Объясни, какой backbone лучше переносится напрямую и почему одинаковая финальная точность не делает их признаки равноценными.
  explanation: Финальная точность характеризует модель после адаптации, а linear probe — полезность исходных признаков без их изменения. Поэтому оценивать переносимость только по результату fine-tuning или только по величине прироста нельзя.
  kind: open
  reference: 'Первый backbone переносится напрямую лучше: его замороженные признаки уже позволяют достичь заметной точности. Низкий probe второго backbone означает, что исходное представление плохо подходит новой задаче, а высокая итоговая точность получена главным образом за счёт сильной перестройки признаков при fine-tuning.'
