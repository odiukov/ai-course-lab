- concept: decay регулирует контраст learning rate между стадиями, не изменяя скорость головы
  question: При фиксированных base_lr и порядке стадий параметр decay увеличили, но он остался меньше единицы. Объясни, как изменится лестница learning rate.
  explanation: 'Голова получает base_lr независимо от decay. Для остальных стадий decay возводится в положительную степень: чем стадия дальше от головы, тем сильнее изменение decay влияет на её learning rate.'
  kind: open
  reference: Learning rate головы останется равным base_lr, поскольку её показатель степени равен нулю. Скорости более ранних стадий возрастут, причём сильнее изменятся удалённые от головы стадии. В результате лестница станет более пологой.
