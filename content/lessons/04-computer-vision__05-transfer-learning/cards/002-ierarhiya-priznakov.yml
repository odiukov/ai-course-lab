- concept: с глубиной CNN растёт семантическая абстракция и уменьшается точность локализации деталей
  question: При визуализации активаций двух слоёв CNN карта A точно отмечает множество отдельных границ, а карта B грубо активируется на объекте целиком. Какое объяснение наиболее вероятно?
  explanation: Ранние слои сохраняют точную пространственную информацию и реагируют на края. Поздние объединяют признаки из большей области изображения, поэтому сильнее отражают присутствие объекта или его крупных частей и слабее — положение каждого контура.
  kind: choice
  options:
    - Карта A получена из более раннего слоя, а карта B — из более позднего
    - Карта B получена из более раннего слоя, а карта A — из более позднего
    - Обе карты обязательно получены из одного слоя, но разными фильтрами
    - По характеру признаков глубину слоя определить принципиально невозможно
