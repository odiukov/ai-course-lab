- concept: decay равен отношению learning rate соседнего более глубокого слоя к learning rate слоя над ним
  question: У верхнего блока learning rate равен 0.00025, а у следующего, более глубокого, — 0.00020. Какое значение decay использовано?
  explanation: Для соседних слоёв decay = 0.00020 / 0.00025 = 0.8. Значит, при каждом переходе в глубину learning rate сохраняет четыре пятых предыдущего значения.
  kind: numeric
  answer: 0.8
  tolerance: 0.001
  id: 041-layerwise-decay-1
  fingerprint: e8ad2eb3
- concept: layer-wise LR decay особенно полезен при fine-tuning трансформеров, тогда как для CNN часто достаточно группировки по стадиям
  question: Какой подход к распределению learning rate обычно наиболее уместен для разных архитектур при fine-tuning?
  explanation: Трансформер состоит из последовательности блоков, для которых удобно задать мелкую градацию скоростей по глубине. В CNN слои естественно объединены в крупные стадии, поэтому стадийной схемы часто достаточно.
  kind: choice
  options:
    - Для трансформера назначать плавно уменьшающийся learning rate отдельным блокам, а для CNN часто ограничиваться разными скоростями по стадиям
    - Для трансформера использовать одинаковый learning rate во всех блоках, а в CNN обязательно задавать отдельную скорость каждому свёрточному слою
    - В трансформере обновлять только самый ранний блок, а в CNN — только классификационную голову
    - Использовать layer-wise decay только для CNN, поскольку в трансформерах порядок блоков не влияет на специализацию признаков
  correct: 0
  id: 041-layerwise-decay-2
  fingerprint: 21472d35
