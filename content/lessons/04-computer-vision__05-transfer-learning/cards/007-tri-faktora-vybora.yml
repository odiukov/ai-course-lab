- concept: вычислительный бюджет ограничивает возможность сравнивать и отлаживать режимы переноса
  question: Полный fine-tuning почти исчерпывает доступный вычислительный бюджет за запуск. Почему более дешёвый режим с частично замороженным backbone может оказаться практичнее?
  explanation: Бюджет требуется не только для обучения выбранной модели, но и для проверки гиперпараметров и повторения неудачных экспериментов. Более дешёвый режим иногда даёт лучше проверенное решение, даже если полный fine-tuning потенциально выразительнее.
  kind: choice
  options:
    - Он оставляет ресурсы для сравнения настроек, повторных запусков и исправления ошибок
    - Он гарантированно даёт более высокое качество на любом домене
    - Он полностью устраняет необходимость в валидационной выборке
    - Он делает объём и характер обучающих данных несущественными
