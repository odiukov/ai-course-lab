- concept: малый объём данных ограничивает число параметров, которые можно безопасно дообучать
  question: Почему далёкий от ImageNet домен не означает, что на небольшой размеченной выборке нужно автоматически разморозить весь backbone?
  explanation: 'Размер выборки и удалённость домена создают встречные требования: доменный сдвиг подталкивает менять больше слоёв, а нехватка примеров повышает риск переобучения при большом числе обучаемых параметров.'
  kind: open
  reference: Далёкий домен действительно требует адаптации признаков, но небольшая выборка не позволяет надёжно оценить обновления миллионов параметров. Полный fine-tuning может привести к переобучению, поэтому глубину разморозки приходится ограничивать и проверять по валидации.
