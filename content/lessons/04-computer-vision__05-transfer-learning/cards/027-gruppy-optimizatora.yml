- concept: параметры стадии выбираются по префиксам их иерархических имён
  question: Заполни условие, которое собирает параметры модулей, перечисленных в stage_names, в отдельную группу оптимизатора.
  explanation: named_parameters() возвращает пары из иерархического имени и самого Parameter. Проверка префикса включает вложенные веса и смещения выбранного модуля, поэтому в группу попадают параметры стадии, а не её выходы или объект модуля.
  kind: cloze
  template: |-
    stage_names = ["stem", "encoder"]
    params = [p for name, p in model.named_parameters()
              if ___]
  answer: any(name.startswith(prefix) for prefix in stage_names)
  accept:
    - any(name.startswith(k) for k in stage_names)
    - name.startswith(tuple(stage_names))
  id: 027-gruppy-optimizatora-1
  fingerprint: f0cc094b
- concept: обучаемый параметр обновляется только в том случае, если передан оптимизатору
  question: У параметра encoder.bias установлено requires_grad=True, и после backward() у него появился градиент. Однако параметр не вошёл ни в одну группу, переданную AdamW. Что произойдёт при optimizer.step()?
  explanation: requires_grad разрешает вычислить и накопить градиент, но не регистрирует параметр в оптимизаторе. optimizer.step() обходит только переданные ему группы, поэтому пропущенный параметр не обновится.
  kind: choice
  options:
    - Параметр обновится с learning rate по умолчанию
    - Параметр останется без изменения
    - Оптимизатор автоматически найдёт параметр в модели
    - Градиент заставит параметр обновиться без участия оптимизатора
  correct: 1
  id: 027-gruppy-optimizatora-2
  fingerprint: 8e6ebfc1
