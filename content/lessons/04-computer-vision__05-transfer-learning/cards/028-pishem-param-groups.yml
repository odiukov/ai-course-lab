- concept: группы оптимизатора должны образовывать непересекающееся покрытие выбранных параметров модели
  question: Объясни своими словами, какое условие должно выполняться для распределения параметров модели по группам оптимизатора и чем опасны его нарушения.
  explanation: 'Корректная группировка одновременно проверяет полноту и уникальность: нужные параметры не потеряны, а группы не пересекаются. Для стадий ResNet это обеспечивают взаимно однозначные префиксы conv1/bn1, layer1–layer4 и fc.'
  kind: open
  reference: Каждый выбранный для обучения параметр должен находиться ровно в одной группе. Пропущенный параметр не будет обновляться, а попадание одного объекта Parameter в несколько групп создаёт конфликт и обычно приводит к ошибке оптимизатора.
  id: 028-pishem-param-groups-2
  fingerprint: ebbcfb98
