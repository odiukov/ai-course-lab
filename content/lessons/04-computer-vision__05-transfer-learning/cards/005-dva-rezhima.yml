- concept: fine-tuning нужен, когда замороженное представление не сохраняет различия, важные для новой задачи
  question: Признаки замороженного предобученного backbone для двух новых классов сильно перекрываются, а усложнение классификатора не улучшает качество на валидации. Какой следующий шаг наиболее обоснован?
  explanation: 'Классификатор может использовать только информацию, сохранённую в выходных признаках backbone. Если нужное различие в них не представлено, обучение одной головы не поможет: необходимо адаптировать само представление с помощью fine-tuning.'
  kind: choice
  options:
    - Продолжить обучать только классификатор, не меняя остальные параметры
    - Разморозить часть backbone и аккуратно дообучить её на новой задаче
    - Оставить backbone замороженным и несколько раз переинициализировать классификатор
    - Уменьшить размер обучающей выборки
  correct: 1
  id: 005-dva-rezhima-1
  fingerprint: 6536e1f8
- concept: feature extraction сохраняет предобученное представление, а fine-tuning изменяет его
  question: Почему fine-tuning нельзя считать просто более долгим обучением в режиме feature extraction?
  explanation: 'Продолжительность обучения не определяет режим переноса. Главное различие — получает ли предобученная часть обновления: feature extraction подбирает новое правило поверх фиксированных признаков, а fine-tuning адаптирует сами признаки.'
  kind: open
  reference: При feature extraction параметры backbone заморожены, поэтому меняется только новая голова, интерпретирующая готовые признаки. При fine-tuning градиенты обновляют и backbone, из-за чего модель может изменить само представление входных данных и начать сохранять признаки, важные для новой задачи.
  id: 005-dva-rezhima-2
  fingerprint: 8eab7069
