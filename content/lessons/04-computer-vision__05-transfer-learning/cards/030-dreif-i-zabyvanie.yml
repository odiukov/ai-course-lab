- concept: коадаптация соседних слоёв делает сеть чувствительной к резкому дрейфу ранних признаков
  question: Почему резкое изменение ранних фильтров при fine-tuning может ухудшить работу поздних слоёв, даже если веса поздних слоёв почти не изменились?
  explanation: 'Слои предобученной сети коадаптированы: каждый следующий слой рассчитывает на устойчивую структуру выходов предыдущего. Поэтому крупное обновление в начале backbone распространяет сдвиг по всей сети и может ухудшить признаки на всех последующих уровнях.'
  kind: open
  reference: Поздние слои обучены интерпретировать определённые распределения и сочетания признаков, поступающие от ранних слоёв. Резкий дрейф ранних фильтров меняет эти входы, поэтому неизменённые поздние веса больше не распознают ожидаемые комбинации и согласованное представление распадается.
