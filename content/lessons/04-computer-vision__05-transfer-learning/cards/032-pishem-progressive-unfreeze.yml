- concept: исчерпанное расписание разморозки должно быть безопасным неизменяющим состояние вызовом
  question: Расписание progressive unfreezing уже разморозило последнюю запланированную стадию. Что должна делать функция расписания при последующих вызовах?
  explanation: После исчерпания списка стадий новых переходов нет. Проверка границы предотвращает выход за пределы списка, а отсутствие изменений сохраняет уже накопленное множество обучаемых параметров.
  kind: open
  reference: Она должна возвращать None и не менять requires_grad ни у одного параметра.
