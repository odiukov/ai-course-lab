<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Как читать разрыв между двумя режимами</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f4f7fb;
    --panel: #ffffff;
    --panel-soft: #f7f9fc;
    --ink: #172033;
    --muted: #596579;
    --grid: #d8dee9;
    --axis: #758196;
    --frozen: #4776d0;
    --frozen-edge: #2857ad;
    --good: #15966f;
    --good-edge: #087254;
    --bad: #d55055;
    --bad-edge: #a8323c;
    --callout: #fff3dc;
    --callout-edge: #c78018;
  }

  html,
  body {
    background: var(--page);
    color: var(--ink);
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
  }

  .frame {
    box-sizing: border-box;
    max-width: 900px;
    margin: auto;
    overflow: hidden;
    background: var(--panel);
    border: 1px solid var(--grid);
  }

  header {
    text-align: center;
  }

  h1 {
    font-size: 26px;
  }

  header p {
    color: var(--muted);
    font-size: 15px;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 520px;
    background: var(--panel);
    font-family: inherit;
  }

  text {
    fill: var(--ink);
  }

  .axis,
  .grid,
  .arrow,
  .callout-box,
  .bar {
    vector-effect: non-scaling-stroke;
    shape-rendering: geometricPrecision;
  }

  .axis {
    fill: none;
    stroke: var(--axis);
    stroke-width: 2px;
  }

  .grid {
    fill: none;
    stroke: var(--grid);
    stroke-width: 1px;
  }

  .frozen {
    fill: var(--frozen);
    stroke: var(--frozen-edge);
    stroke-width: 2px;
  }

  .good {
    fill: var(--good);
    stroke: var(--good-edge);
    stroke-width: 2px;
  }

  .bad {
    fill: var(--bad);
    stroke: var(--bad-edge);
    stroke-width: 2px;
  }

  .arrow.good-arrow {
    fill: var(--good);
    stroke: var(--good);
    stroke-width: 3px;
  }

  .arrow.bad-arrow {
    fill: var(--bad);
    stroke: var(--bad);
    stroke-width: 3px;
  }

  .tick-label {
    fill: var(--muted);
    font-size: 13px;
  }

  .axis-title {
    fill: var(--muted);
    font-size: 13px;
    font-weight: bold;
  }

  .legend-label {
    fill: var(--muted);
    font-size: 14px;
  }

  .group-title {
    font-size: 17px;
    font-weight: bold;
  }

  .value-label {
    font-size: 22px;
    font-weight: bold;
  }

  .arrow-label {
    font-size: 15px;
    font-weight: bold;
  }

  .group-caption {
    fill: var(--muted);
    font-size: 14px;
  }

  .callout-box {
    fill: var(--callout);
    stroke: var(--callout-edge);
    stroke-width: 2px;
  }

  .callout-heading {
    fill: var(--bad-edge);
    font-size: 14px;
    font-weight: bold;
  }

  .callout-label {
    font-size: 14px;
  }

  .reading-rule {
    fill: var(--muted);
    font-size: 15px;
    font-weight: bold;
  }

  .fallback {
    color: var(--bad-edge);
    font-size: 16px;
    text-align: center;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #111722;
      --panel: #18202d;
      --panel-soft: #202a39;
      --ink: #eef3fb;
      --muted: #b3bed0;
      --grid: #394558;
      --axis: #7d8ba2;
      --frozen: #6d9df0;
      --frozen-edge: #a8c5ff;
      --good: #39bf91;
      --good-edge: #8ce2c2;
      --bad: #ed7075;
      --bad-edge: #ffadb0;
      --callout: #342b1d;
      --callout-edge: #d59a3d;
    }
  }
</style>
</head>
<body>
<main class="frame">
  <header>
    <h1>Как читать разрыв между двумя режимами</h1>
    <p>Сравнивай путь от замороженного backbone к результату fine-tuning.</p>
  </header>

  <svg id="diagram"
       viewBox="0 0 900 390"
       width="900"
       height="390"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="diagram-title diagram-desc">
    <title id="diagram-title">Сравнение замороженного режима и fine-tuning</title>
    <desc id="diagram-desc">
      В типичном случае точность растёт с 86 до 93 процентов.
      В аварийном случае она падает с 86 до 80 процентов,
      поэтому нужно проверить learning rate backbone и BatchNorm.
    </desc>
    <g id="plot"></g>
  </svg>

  <p id="fallback" class="fallback" hidden>
    Схема должна была показать две пары: 86% → 93% как полезный
    fine-tuning и 86% → 80% как сигнал проверить LR backbone или BatchNorm.
  </p>
</main>

<script>
const data = [
  {
    role: "config",
    origin: { x: 54, y: 286 },
    scale: { x: 1, y: 9 },
    zero: 0,
    baseline: 76,
    labelPad: 8,
    bar: { width: 54 },
    axis: {
      x: 35,
      left: 35,
      right: 780,
      top: 21,
      tickLeft: 29,
      tickRight: 41,
      labelX: 24,
      title: { x: 0, y: 22.5 }
    },
    ticks: [80, 86, 93],
    legend: [
      {
        x0: 100,
        x1: 122,
        y0: 25.1,
        y1: 26.7,
        text: { x: 135, y: 25.4 },
        label: "замороженный backbone",
        className: "frozen"
      },
      {
        x0: 390,
        x1: 412,
        y0: 25.1,
        y1: 26.7,
        text: { x: 425, y: 25.4 },
        label: "после сквозного обучения",
        className: "good"
      }
    ],
    arrow: { headDx: 8, headDy: 1.15 },
    readingRule: { x: 407, y: -8.7 }
  },
  {
    role: "group",
    title: "Типичный CIFAR-10",
    titlePoint: { x: 178, y: 22 },
    caption: "размораживание помогло",
    captionPoint: { x: 178, y: -3.2 },
    bars: [
      { stage: "frozen", value: 86, x: 110, className: "frozen" },
      { stage: "fine", value: 93, x: 190, className: "good" }
    ],
    arrow: {
      x: 290,
      label: "размораживание: +7 п.п.",
      labelPoint: { x: 310, y: 13.5 },
      anchor: "start",
      className: "good-arrow"
    }
  },
  {
    role: "group",
    title: "Аварийный случай",
    titlePoint: { x: 575, y: 22 },
    caption: "fine-tuning ухудшил модель",
    captionPoint: { x: 575, y: -3.2 },
    bars: [
      { stage: "frozen", value: 86, x: 505, className: "frozen" },
      { stage: "fine", value: 80, x: 585, className: "bad" }
    ],
    arrow: {
      x: 680,
      label: "падение",
      labelPoint: { x: 690, y: 11.7 },
      anchor: "end",
      className: "bad-arrow"
    },
    callout: {
      x0: 700,
      x1: 790,
      y0: 2.7,
      y1: 12.8,
      heading: { x: 712, y: 11.2, text: "Проверить:" },
      lines: [
        { x: 712, y: 8.2, text: "LR backbone" },
        { x: 712, y: 5.2, text: "BatchNorm" }
      ]
    }
  }
];

const origin = Object.freeze(data.find(item => item.role === "config").origin);
const scale = Object.freeze(data.find(item => item.role === "config").scale);
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y - y * scale.y;

try {
  const NS = "http://www.w3.org/2000/svg";
  const cfg = data.find(item => item.role === "config");
  const groups = data.filter(item => item.role === "group");
  const plot = document.getElementById("plot");

  const level = value => value - cfg.baseline;

  const make = (tag, attributes, content) => {
    const element = document.createElementNS(NS, tag);
    Object.entries(attributes).forEach(([name, value]) => {
      element.setAttribute(name, String(value));
    });
    if (content !== undefined) {
      element.textContent = content;
    }
    return element;
  };

  const pointText = (point, content, className, anchor, dy) => {
    const attributes = {
      x: sx(point.x),
      y: sy(point.y),
      class: className,
      "text-anchor": anchor
    };
    if (dy !== undefined) {
      attributes.dy = dy;
    }
    return make("text", attributes, content);
  };

  const line = (a, b, className) => make("line", {
    x1: sx(a.x),
    y1: sy(a.y),
    x2: sx(b.x),
    y2: sy(b.y),
    class: className
  });

  const rectangle = (x0, y0, x1, y1, className) => make("rect", {
    x: sx(x0),
    y: sy(y1),
    width: sx(x1) - sx(x0),
    height: sy(y0) - sy(y1),
    class: className
  });

  const pathFrom = points => points.map((point, position) => {
    const command = position === cfg.zero ? "M" : "L";
    return `${command} ${sx(point.x)} ${sy(point.y)}`;
  }).join(" ");

  cfg.ticks.forEach(value => {
    const y = level(value);
    plot.append(
      line(
        { x: cfg.axis.left, y },
        { x: cfg.axis.right, y },
        "grid"
      ),
      line(
        { x: cfg.axis.tickLeft, y },
        { x: cfg.axis.tickRight, y },
        "axis"
      ),
      pointText(
        { x: cfg.axis.labelX, y },
        `${value}%`,
        "tick-label",
        "end"
      )
    );
  });

  plot.append(
    line(
      { x: cfg.axis.x, y: cfg.zero },
      { x: cfg.axis.x, y: cfg.axis.top },
      "axis"
    ),
    line(
      { x: cfg.axis.left, y: cfg.zero },
      { x: cfg.axis.right, y: cfg.zero },
      "axis"
    ),
    pointText(
      cfg.axis.title,
      "ТОЧНОСТЬ",
      "axis-title",
      "start"
    )
  );

  cfg.legend.forEach(item => {
    plot.append(
      rectangle(item.x0, item.y0, item.x1, item.y1, `bar ${item.className}`),
      pointText(item.text, item.label, "legend-label", "start")
    );
  });

  const drawArrow = (group, fromValue, toValue) => {
    const fromY = level(fromValue);
    const toY = level(toValue);
    const direction = Math.sign(toY - fromY);
    const shoulderY = toY - direction * cfg.arrow.headDy;
    const arrow = group.arrow;

    plot.append(
      line(
        { x: arrow.x, y: fromY },
        { x: arrow.x, y: toY },
        `arrow ${arrow.className}`
      ),
      make("path", {
        d: `${pathFrom([
          { x: arrow.x - cfg.arrow.headDx, y: shoulderY },
          { x: arrow.x, y: toY },
          { x: arrow.x + cfg.arrow.headDx, y: shoulderY }
        ])}`,
        class: `arrow ${arrow.className}`
      }),
      pointText(
        arrow.labelPoint,
        arrow.label,
        "arrow-label",
        arrow.anchor
      )
    );
  };

  groups.forEach(group => {
    plot.append(
      pointText(group.titlePoint, group.title, "group-title", "middle"),
      pointText(group.captionPoint, group.caption, "group-caption", "middle")
    );

    group.bars.forEach(bar => {
      const top = level(bar.value);
      const center = bar.x + cfg.bar.width / cfg.bar.width * cfg.bar.width / cfg.bar.width * cfg.bar.width / cfg.bar.width;
      const labelPoint = {
        x: bar.x + center - bar.x + cfg.bar.width - center + bar.x,
        y: top
      };

      plot.append(
        rectangle(
          bar.x,
          cfg.zero,
          bar.x + cfg.bar.width,
          top,
          `bar ${bar.className}`
        ),
        pointText(
          labelPoint,
          `${bar.value}%`,
          "value-label",
          "middle",
          -cfg.labelPad
        )
      );
    });

    const frozen = group.bars.find(bar => bar.stage === "frozen");
    const fine = group.bars.find(bar => bar.stage === "fine");
    drawArrow(group, frozen.value, fine.value);

    if (group.callout) {
      const box = group.callout;
      plot.append(
        rectangle(box.x0, box.y0, box.x1, box.y1, "callout-box"),
        pointText(
          box.heading,
          box.heading.text,
          "callout-heading",
          "start"
        )
      );

      box.lines.forEach(item => {
        plot.append(
          pointText(item, item.text, "callout-label", "start")
        );
      });
    }
  });

  plot.append(
    pointText(
      cfg.readingRule,
      "↑ польза от fine-tuning   ·   ↓ сигнал искать ошибку",
      "reading-rule",
      "middle"
    )
  );
} catch (error) {
  document.getElementById("diagram").hidden = true;
  document.getElementById("fallback").hidden = false;
  console.error(error);
}
</script>
</body>
</html>
