<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Лестница скоростей обучения по стадиям</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fb;
      --surface: #ffffff;
      --ink: #172033;
      --muted: #5d677b;
      --line: #2d3953;
      --guide: #8755d9;
      --stem: #dce7f5;
      --early: #cddff2;
      --feature: #bad5ee;
      --structure: #a6c9e9;
      --late: #8db9e1;
      --head: #7352c7;
      --head-edge: #57369f;
      --head-ink: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #10141d;
        --surface: #171d29;
        --ink: #f2f5fb;
        --muted: #b8c1d1;
        --line: #d7dfed;
        --guide: #c5a5ff;
        --stem: #26384d;
        --early: #29445f;
        --feature: #2d516f;
        --structure: #315f82;
        --late: #396f95;
        --head: #8867d7;
        --head-edge: #c4aeff;
        --head-ink: #ffffff;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    main {
      background: var(--surface);
    }

    h1 {
      margin: unset;
      color: var(--ink);
      font-size: 24px;
      font-weight: bold;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      background: var(--surface);
      overflow: visible;
    }

    text {
      font-family: inherit;
      fill: var(--ink);
    }

    .stage {
      stroke: var(--line);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .tone-stem {
      fill: var(--stem);
    }

    .tone-early {
      fill: var(--early);
    }

    .tone-feature {
      fill: var(--feature);
    }

    .tone-structure {
      fill: var(--structure);
    }

    .tone-late {
      fill: var(--late);
    }

    .tone-head {
      fill: var(--head);
      stroke: var(--head-edge);
    }

    .stair-outline {
      fill: none;
      stroke: var(--line);
      stroke-width: 3;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .baseline {
      stroke: var(--line);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .direction-line {
      stroke: var(--guide);
      stroke-width: 3;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .direction-head {
      fill: var(--guide);
      stroke: var(--guide);
      stroke-width: 2;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .guide-label {
      fill: var(--guide);
      font-size: 17px;
      font-weight: bold;
    }

    .recipe {
      fill: var(--muted);
      font-size: 16px;
    }

    .lr-label {
      fill: var(--ink);
      font-size: 18px;
      font-weight: bold;
    }

    .stage-name {
      fill: var(--ink);
      font-size: 18px;
      font-weight: bold;
    }

    .stage-note {
      fill: var(--muted);
      font-size: 14px;
    }

    .simultaneous {
      fill: var(--muted);
      font-size: 16px;
      font-weight: bold;
    }

    .fallback-title {
      fill: var(--ink);
      font-size: 18px;
      font-weight: bold;
    }

    .fallback-values {
      fill: var(--muted);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main aria-labelledby="diagram-heading">
    <h1 id="diagram-heading">Лестница скоростей обучения по стадиям</h1>

    <svg
      id="diagram"
      viewBox="0 0 1200 440"
      width="1200"
      height="440"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description"
    >
      <title id="svg-title">Learning rate возрастает от stem к fc</title>
      <desc id="svg-description">
        Шесть одновременно обучаемых стадий ResNet образуют лестницу:
        ранние признаки изменяются осторожнее, а новая голова — смелее.
      </desc>
    </svg>
  </main>

  <script>
    const diagramData = [
      {
        kind: "settings",
        namespace: "http://www.w3.org/2000/svg"
      },
      {
        kind: "origin",
        x: 102,
        y: 367
      },
      {
        kind: "scale",
        x: 163,
        y: 44
      },
      {
        kind: "layout",
        baselineStartX: 0,
        baselineStartY: 0,
        baselineEndX: 6.35,
        baselineEndY: 0,
        guideTextX: 3,
        guideTextY: 7.58,
        recipeX: 0,
        recipeY: 6.62,
        simultaneousX: 3,
        simultaneousY: -1.12,
        fallbackTitleX: 3,
        fallbackTitleY: 3.65,
        fallbackValuesX: 3,
        fallbackValuesY: 2.85
      },
      {
        kind: "guide",
        tailX: 0.18,
        tailY: 7.2,
        tipX: 5.92,
        tipY: 7.2,
        headTopX: 5.58,
        headTopY: 7.44,
        headBottomX: 5.58,
        headBottomY: 6.96,
        label: "к выходу модели — learning rate выше"
      },
      {
        kind: "stage",
        tone: "tone-stem",
        name: "stem",
        note: "вход",
        lr: "2.43e-6",
        x0: 0,
        x1: 1,
        base: 0,
        top: 1,
        labelX: 0.5,
        lrY: 1.3,
        nameY: -0.28,
        noteY: -0.66
      },
      {
        kind: "stage",
        tone: "tone-early",
        name: "layer1",
        note: "ранние признаки",
        lr: "8.1e-6",
        x0: 1,
        x1: 2,
        base: 0,
        top: 2,
        labelX: 1.5,
        lrY: 2.3,
        nameY: -0.28,
        noteY: -0.66
      },
      {
        kind: "stage",
        tone: "tone-feature",
        name: "layer2",
        note: "общие формы",
        lr: "2.7e-5",
        x0: 2,
        x1: 3,
        base: 0,
        top: 3,
        labelX: 2.5,
        lrY: 3.3,
        nameY: -0.28,
        noteY: -0.66
      },
      {
        kind: "stage",
        tone: "tone-structure",
        name: "layer3",
        note: "структуры задачи",
        lr: "9e-5",
        x0: 3,
        x1: 4,
        base: 0,
        top: 4,
        labelX: 3.5,
        lrY: 4.3,
        nameY: -0.28,
        noteY: -0.66
      },
      {
        kind: "stage",
        tone: "tone-late",
        name: "layer4",
        note: "поздние признаки",
        lr: "3e-4",
        x0: 4,
        x1: 5,
        base: 0,
        top: 5,
        labelX: 4.5,
        lrY: 5.3,
        nameY: -0.28,
        noteY: -0.66
      },
      {
        kind: "stage",
        tone: "tone-head",
        name: "fc",
        note: "новая голова",
        lr: "1e-3",
        x0: 5,
        x1: 6,
        base: 0,
        top: 6,
        labelX: 5.5,
        lrY: 6.3,
        nameY: -0.28,
        noteY: -0.66
      },
      {
        kind: "outline",
        points: [
          { x: 0, y: 0 },
          { x: 0, y: 1 },
          { x: 1, y: 1 },
          { x: 1, y: 2 },
          { x: 2, y: 2 },
          { x: 2, y: 3 },
          { x: 3, y: 3 },
          { x: 3, y: 4 },
          { x: 4, y: 4 },
          { x: 4, y: 5 },
          { x: 5, y: 5 },
          { x: 5, y: 6 },
          { x: 6, y: 6 },
          { x: 6, y: 0 }
        ]
      },
      {
        kind: "copy",
        recipe: "base_lr = 0.001  ·  decay = 0.3",
        simultaneous:
          "Все стадии обучаются одновременно — меняется только осторожность шага",
        fallbackTitle:
          "Схема должна была показать рост learning rate от stem к fc.",
        fallbackValues:
          "2.43e-6 → 8.1e-6 → 2.7e-5 → 9e-5 → 3e-4 → 1e-3"
      }
    ];

    const origin = diagramData.find((item) => item.kind === "origin");
    const scale = diagramData.find((item) => item.kind === "scale");

    const sx = (x) => origin.x + x * scale.x;
    const sy = (y) => origin.y - y * scale.y;

    const settings = diagramData.find((item) => item.kind === "settings");
    const layout = diagramData.find((item) => item.kind === "layout");
    const guide = diagramData.find((item) => item.kind === "guide");
    const outline = diagramData.find((item) => item.kind === "outline");
    const copy = diagramData.find((item) => item.kind === "copy");
    const stages = diagramData.filter((item) => item.kind === "stage");
    const svg = document.getElementById("diagram");

    const makeSvg = (name, attributes, content) => {
      const element = document.createElementNS(settings.namespace, name);

      for (const [attribute, value] of Object.entries(attributes)) {
        element.setAttribute(attribute, value);
      }

      if (content !== undefined) {
        element.textContent = content;
      }

      return element;
    };

    const mappedPoints = (points) =>
      points
        .map((point) => `${sx(point.x)},${sy(point.y)}`)
        .join(" ");

    const mappedPath = (points) =>
      points
        .map(
          (point, position) =>
            `${position ? "L" : "M"} ${sx(point.x)} ${sy(point.y)}`
        )
        .join(" ");

    try {
      const drawing = makeSvg("g", {
        "aria-hidden": "true"
      });

      const directionLine = makeSvg("line", {
        x1: sx(guide.tailX),
        y1: sy(guide.tailY),
        x2: sx(guide.tipX),
        y2: sy(guide.tipY),
        class: "direction-line"
      });

      const directionHead = makeSvg("polygon", {
        points: mappedPoints([
          { x: guide.tipX, y: guide.tipY },
          { x: guide.headTopX, y: guide.headTopY },
          { x: guide.headBottomX, y: guide.headBottomY }
        ]),
        class: "direction-head"
      });

      const directionLabel = makeSvg(
        "text",
        {
          x: sx(layout.guideTextX),
          y: sy(layout.guideTextY),
          "text-anchor": "middle",
          class: "guide-label"
        },
        guide.label
      );

      const recipeLabel = makeSvg(
        "text",
        {
          x: sx(layout.recipeX),
          y: sy(layout.recipeY),
          "text-anchor": "start",
          class: "recipe"
        },
        copy.recipe
      );

      drawing.append(
        directionLine,
        directionHead,
        directionLabel,
        recipeLabel
      );

      for (const stage of stages) {
        const stageGroup = makeSvg("g", {
          class: "stage-group"
        });

        const block = makeSvg("polygon", {
          points: mappedPoints([
            { x: stage.x0, y: stage.base },
            { x: stage.x0, y: stage.top },
            { x: stage.x1, y: stage.top },
            { x: stage.x1, y: stage.base }
          ]),
          class: `stage ${stage.tone}`
        });

        const learningRate = makeSvg(
          "text",
          {
            x: sx(stage.labelX),
            y: sy(stage.lrY),
            "text-anchor": "middle",
            class: "lr-label"
          },
          stage.lr
        );

        const stageName = makeSvg(
          "text",
          {
            x: sx(stage.labelX),
            y: sy(stage.nameY),
            "text-anchor": "middle",
            class: "stage-name"
          },
          stage.name
        );

        const stageNote = makeSvg(
          "text",
          {
            x: sx(stage.labelX),
            y: sy(stage.noteY),
            "text-anchor": "middle",
            class: "stage-note"
          },
          stage.note
        );

        stageGroup.append(block, learningRate, stageName, stageNote);
        drawing.append(stageGroup);
      }

      const stairOutline = makeSvg("path", {
        d: `${mappedPath(outline.points)} Z`,
        class: "stair-outline"
      });

      const baseline = makeSvg("line", {
        x1: sx(layout.baselineStartX),
        y1: sy(layout.baselineStartY),
        x2: sx(layout.baselineEndX),
        y2: sy(layout.baselineEndY),
        class: "baseline"
      });

      const simultaneous = makeSvg(
        "text",
        {
          x: sx(layout.simultaneousX),
          y: sy(layout.simultaneousY),
          "text-anchor": "middle",
          class: "simultaneous"
        },
        copy.simultaneous
      );

      drawing.append(stairOutline, baseline, simultaneous);
      svg.append(drawing);
    } catch (error) {
      svg.replaceChildren();

      const fallbackTitle = makeSvg(
        "text",
        {
          x: sx(layout.fallbackTitleX),
          y: sy(layout.fallbackTitleY),
          "text-anchor": "middle",
          class: "fallback-title"
        },
        copy.fallbackTitle
      );

      const fallbackValues = makeSvg(
        "text",
        {
          x: sx(layout.fallbackValuesX),
          y: sy(layout.fallbackValuesY),
          "text-anchor": "middle",
          class: "fallback-values"
        },
        copy.fallbackValues
      );

      svg.append(fallbackTitle, fallbackValues);
    }
  </script>
</body>
</html>
