<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Два звена надзора</title>
  <style>
    :root {
      --page: #f6f8fc;
      --surface: #ffffff;
      --surface-soft: #eef3fa;
      --surface-warm: #fff6dc;
      --surface-cool: #eaf7f3;
      --ink: #172033;
      --muted: #5d687c;
      --line: #9aa8bb;
      --oversight: #d97706;
      --oversight-soft: #fef0c7;
      --generalize: #087f6a;
      --generalize-soft: #d9f3eb;
      --result: #3957c8;
      --result-soft: #e5eaff;
      --remaining: #c5ccd8;
      --white: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111724;
        --surface: #1b2434;
        --surface-soft: #232f42;
        --surface-warm: #382d19;
        --surface-cool: #173832;
        --ink: #edf2fa;
        --muted: #b5c0d0;
        --line: #718098;
        --oversight: #f3ad38;
        --oversight-soft: #4a3616;
        --generalize: #57d2ba;
        --generalize-soft: #16463e;
        --result: #8ea5ff;
        --result-soft: #26345f;
        --remaining: #536176;
        --white: #111724;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .frame {
      max-width: 1120px;
      background: var(--surface);
      border: 1px solid var(--line);
    }

    .diagram-title {
      font-size: 21px;
      font-weight: bold;
      text-align: center;
      color: var(--ink);
      background: var(--surface);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 440px;
      background: var(--surface);
    }

    .card {
      stroke: var(--line);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .card-input {
      fill: var(--surface-soft);
    }

    .card-oversight {
      fill: var(--surface-warm);
      stroke: var(--oversight);
    }

    .card-signal {
      fill: var(--oversight-soft);
      stroke: var(--oversight);
    }

    .card-model {
      fill: var(--surface-cool);
      stroke: var(--generalize);
    }

    .card-result {
      fill: var(--result-soft);
      stroke: var(--result);
    }

    .card-pgr {
      fill: var(--surface-soft);
      stroke: var(--result);
    }

    .top-rule {
      stroke-width: 5px;
      vector-effect: non-scaling-stroke;
      stroke-linecap: round;
    }

    .rule-neutral {
      stroke: var(--line);
    }

    .rule-oversight {
      stroke: var(--oversight);
    }

    .rule-generalize {
      stroke: var(--generalize);
    }

    .rule-result {
      stroke: var(--result);
    }

    .connector {
      fill: none;
      stroke: var(--line);
      stroke-width: 3px;
      vector-effect: non-scaling-stroke;
      stroke-linecap: round;
    }

    .arrowhead {
      fill: var(--line);
    }

    .bracket-oversight {
      fill: none;
      stroke: var(--oversight);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
      stroke-linecap: round;
    }

    .bracket-generalize {
      fill: none;
      stroke: var(--generalize);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
      stroke-linecap: round;
    }

    .stage-label {
      font-size: 15px;
      font-weight: bold;
      text-anchor: middle;
    }

    .stage-oversight {
      fill: var(--oversight);
    }

    .stage-generalize {
      fill: var(--generalize);
    }

    .kicker {
      fill: var(--muted);
      font-size: 12px;
      font-weight: bold;
      text-anchor: middle;
    }

    .main-label {
      fill: var(--ink);
      font-size: 19px;
      font-weight: bold;
      text-anchor: middle;
    }

    .sub-label {
      fill: var(--muted);
      font-size: 14px;
      text-anchor: middle;
    }

    .percent-weak {
      fill: var(--oversight);
      font-size: 21px;
      font-weight: bold;
      text-anchor: middle;
    }

    .percent-result {
      fill: var(--result);
      font-size: 21px;
      font-weight: bold;
      text-anchor: middle;
    }

    .axis-title {
      fill: var(--muted);
      font-size: 14px;
      font-weight: bold;
      text-anchor: start;
    }

    .axis-base {
      fill: none;
      stroke: var(--remaining);
      stroke-width: 6px;
      vector-effect: non-scaling-stroke;
      stroke-linecap: round;
    }

    .axis-gain {
      fill: none;
      stroke: var(--result);
      stroke-width: 6px;
      vector-effect: non-scaling-stroke;
      stroke-linecap: round;
    }

    .tick {
      stroke: var(--ink);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
      stroke-linecap: round;
    }

    .point-weak {
      fill: var(--oversight);
      stroke: var(--surface);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .point-result {
      fill: var(--result);
      stroke: var(--surface);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .point-ceiling {
      fill: var(--ink);
      stroke: var(--surface);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .tick-label {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
    }

    .pgr-kicker {
      fill: var(--result);
      font-size: 14px;
      font-weight: bold;
      text-anchor: middle;
    }

    .pgr-formula {
      fill: var(--ink);
      font-size: 20px;
      font-weight: bold;
      text-anchor: middle;
    }

    .pgr-note {
      fill: var(--muted);
      font-size: 13px;
      text-anchor: middle;
    }

    .fallback {
      color: var(--ink);
      background: var(--surface);
      font-size: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="frame">
    <div class="diagram-title">
      Два звена надзора: улучшить сигнал и обобщить из него
    </div>

    <svg
      id="diagram"
      width="1120"
      height="440"
      viewBox="0 0 1120 440"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description">
      <title id="svg-title">Конвейер масштабируемого надзора и W2SG</title>
      <desc id="svg-description">
        Дебаты улучшают слабые метки, после чего сильная модель учится на них
        и достигает fine-tuned 85% при weak 70% и ceiling 95%, что даёт PGR 0,6.
      </desc>
    </svg>

    <div id="fallback" class="fallback" hidden>
      Схема должна была показать: дебаты улучшают слабые метки, сильная модель
      учится на них, а weak 70%, fine-tuned 85% и ceiling 95% дают PGR 0,6.
    </div>
  </main>

  <script>
    const DATA = [
      { x: 28, y: 18 },
      { x: 1, y: 1 },
      { zero: 0, half: 0.5 },
      {
        nodes: [
          {
            x: 0, y: 100, w: 150, h: 120, rule: "rule-neutral",
            card: "card-input",
            lines: [
              { y: 128, text: "ВХОД", className: "kicker" },
              { y: 163, text: "Слабый судья", className: "main-label" },
              { y: 192, text: "спорные ответы", className: "sub-label" }
            ]
          },
          {
            x: 195, y: 85, w: 205, h: 150, rule: "rule-oversight",
            card: "card-oversight",
            lines: [
              { y: 116, text: "МЕХАНИЗМ НАДЗОРА", className: "kicker" },
              { y: 158, text: "Дебаты", className: "main-label" },
              { y: 191, text: "сравнить доводы", className: "sub-label" },
              { y: 214, text: "выбрать надёжнее", className: "sub-label" }
            ]
          },
          {
            x: 445, y: 100, w: 170, h: 120, rule: "rule-oversight",
            card: "card-signal",
            lines: [
              { y: 128, text: "УЛУЧШЕННЫЙ СИГНАЛ", className: "kicker" },
              { y: 166, text: "weak 70%", className: "percent-weak" },
              { y: 195, text: "метки стали чище", className: "sub-label" }
            ]
          },
          {
            x: 660, y: 85, w: 190, h: 150, rule: "rule-generalize",
            card: "card-model",
            lines: [
              { y: 116, text: "W2SG", className: "kicker" },
              { y: 154, text: "Сильная модель", className: "main-label" },
              { y: 186, text: "учится на метках", className: "sub-label" },
              { y: 212, text: "и обобщает", className: "sub-label" }
            ]
          },
          {
            x: 895, y: 100, w: 165, h: 120, rule: "rule-result",
            card: "card-result",
            lines: [
              { y: 128, text: "ВЫХОД", className: "kicker" },
              { y: 166, text: "fine-tuned 85%", className: "percent-result" },
              { y: 195, text: "выше weak", className: "sub-label" }
            ]
          }
        ],
        arrows: [
          { x1: 150, y1: 160, x2: 195, y2: 160 },
          { x1: 400, y1: 160, x2: 445, y2: 160 },
          { x1: 615, y1: 160, x2: 660, y2: 160 },
          { x1: 850, y1: 160, x2: 895, y2: 160 }
        ],
        stages: [
          {
            x1: 195, x2: 615, y: 48, tickY: 61, labelY: 31,
            label: "Улучшить сигнал надзора",
            className: "bracket-oversight",
            labelClass: "stage-label stage-oversight"
          },
          {
            x1: 660, x2: 1060, y: 48, tickY: 61, labelY: 31,
            label: "Обобщить из несовершенных меток",
            className: "bracket-generalize",
            labelClass: "stage-label stage-generalize"
          }
        ],
        pgr: {
          x: 0, y: 285, w: 235, h: 110,
          lines: [
            { y: 312, text: "PGR", className: "pgr-kicker" },
            { y: 349, text: "(85 − 70) / (95 − 70) = 0,6", className: "pgr-formula" },
            { y: 378, text: "закрытая доля разрыва", className: "pgr-note" }
          ]
        },
        axis: {
          x1: 290, x2: 1035, gainX: 737, y: 342,
          titleX: 290, titleY: 294,
          title: "Качество: от слабых меток к потолку сильной модели",
          tickTop: 332, tickBottom: 352,
          points: [
            {
              x: 290, labelY: 319, label: "weak 70%",
              anchor: "start", className: "point-weak"
            },
            {
              x: 737, labelY: 381, label: "fine-tuned 85%",
              anchor: "middle", className: "point-result"
            },
            {
              x: 1035, labelY: 319, label: "ceiling 95%",
              anchor: "end", className: "point-ceiling"
            }
          ]
        }
      },
      {
        corner: 14,
        ruleInset: 15,
        arrowBack: 13,
        arrowHalf: 8,
        pointRadius: 7
      },
      {
        aria: "Дебаты улучшают слабые метки до weak 70%, сильная модель обобщает из них до fine-tuned 85% при ceiling 95%, поэтому PGR равен 0,6."
      }
    ];

    const [origin, scale, constants, geometry, measures, copy] = DATA;
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const svg = document.getElementById("diagram");
    const fallback = document.getElementById("fallback");
    const namespace = "http://www.w3.org/2000/svg";

    const make = (name, attributes, className) => {
      const element = document.createElementNS(namespace, name);
      for (const [key, value] of Object.entries(attributes)) {
        element.setAttribute(key, String(value));
      }
      if (className) element.setAttribute("class", className);
      return element;
    };

    const addText = (parent, x, y, text, className, anchor) => {
      const element = make(
        "text",
        {
          x: sx(x),
          y: sy(y),
          "text-anchor": anchor || "middle"
        },
        className
      );
      element.textContent = text;
      parent.appendChild(element);
    };

    const addArrow = (parent, arrow) => {
      parent.appendChild(
        make(
          "line",
          {
            x1: sx(arrow.x1),
            y1: sy(arrow.y1),
            x2: sx(arrow.x2),
            y2: sy(arrow.y2)
          },
          "connector"
        )
      );

      const points = [
        [arrow.x2, arrow.y2],
        [arrow.x2 - measures.arrowBack, arrow.y2 - measures.arrowHalf],
        [arrow.x2 - measures.arrowBack, arrow.y2 + measures.arrowHalf]
      ]
        .map(([x, y]) => `${sx(x)},${sy(y)}`)
        .join(" ");

      parent.appendChild(make("polygon", { points }, "arrowhead"));
    };

    const addStage = (parent, stage) => {
      parent.appendChild(
        make(
          "line",
          {
            x1: sx(stage.x1),
            y1: sy(stage.y),
            x2: sx(stage.x2),
            y2: sy(stage.y)
          },
          stage.className
        )
      );
      parent.appendChild(
        make(
          "line",
          {
            x1: sx(stage.x1),
            y1: sy(stage.y),
            x2: sx(stage.x1),
            y2: sy(stage.tickY)
          },
          stage.className
        )
      );
      parent.appendChild(
        make(
          "line",
          {
            x1: sx(stage.x2),
            y1: sy(stage.y),
            x2: sx(stage.x2),
            y2: sy(stage.tickY)
          },
          stage.className
        )
      );
      addText(
        parent,
        stage.x1 + (stage.x2 - stage.x1) * constants.half,
        stage.labelY,
        stage.label,
        stage.labelClass,
        "middle"
      );
    };

    const addCard = (parent, node) => {
      const group = make("g", {}, "");
      group.appendChild(
        make(
          "rect",
          {
            x: sx(node.x),
            y: sy(node.y),
            width: sx(node.w) - sx(constants.zero),
            height: sy(node.h) - sy(constants.zero),
            rx: sx(measures.corner) - sx(constants.zero),
            ry: sy(measures.corner) - sy(constants.zero)
          },
          `card ${node.card}`
        )
      );
      group.appendChild(
        make(
          "line",
          {
            x1: sx(node.x + measures.ruleInset),
            y1: sy(node.y),
            x2: sx(node.x + node.w - measures.ruleInset),
            y2: sy(node.y)
          },
          `top-rule ${node.rule}`
        )
      );

      for (const line of node.lines) {
        addText(
          group,
          node.x + node.w * constants.half,
          line.y,
          line.text,
          line.className,
          "middle"
        );
      }
      parent.appendChild(group);
    };

    const addPgr = (parent, pgr) => {
      parent.appendChild(
        make(
          "rect",
          {
            x: sx(pgr.x),
            y: sy(pgr.y),
            width: sx(pgr.w) - sx(constants.zero),
            height: sy(pgr.h) - sy(constants.zero),
            rx: sx(measures.corner) - sx(constants.zero),
            ry: sy(measures.corner) - sy(constants.zero)
          },
          "card card-pgr"
        )
      );

      for (const line of pgr.lines) {
        addText(
          parent,
          pgr.x + pgr.w * constants.half,
          line.y,
          line.text,
          line.className,
          "middle"
        );
      }
    };

    const addAxis = (parent, axis) => {
      addText(
        parent,
        axis.titleX,
        axis.titleY,
        axis.title,
        "axis-title",
        "start"
      );

      parent.appendChild(
        make(
          "line",
          {
            x1: sx(axis.x1),
            y1: sy(axis.y),
            x2: sx(axis.x2),
            y2: sy(axis.y)
          },
          "axis-base"
        )
      );

      parent.appendChild(
        make(
          "line",
          {
            x1: sx(axis.x1),
            y1: sy(axis.y),
            x2: sx(axis.gainX),
            y2: sy(axis.y)
          },
          "axis-gain"
        )
      );

      for (const point of axis.points) {
        parent.appendChild(
          make(
            "line",
            {
              x1: sx(point.x),
              y1: sy(axis.tickTop),
              x2: sx(point.x),
              y2: sy(axis.tickBottom)
            },
            "tick"
          )
        );
        parent.appendChild(
          make(
            "circle",
            {
              cx: sx(point.x),
              cy: sy(axis.y),
              r: sx(measures.pointRadius) - sx(constants.zero)
            },
            point.className
          )
        );
        addText(
          parent,
          point.x,
          point.labelY,
          point.label,
          "tick-label",
          point.anchor
        );
      }
    };

    try {
      svg.setAttribute("aria-label", copy.aria);

      const layerStages = make("g", {}, "");
      const layerArrows = make("g", {}, "");
      const layerCards = make("g", {}, "");
      const layerSummary = make("g", {}, "");

      for (const stage of geometry.stages) addStage(layerStages, stage);
      for (const arrow of geometry.arrows) addArrow(layerArrows, arrow);
      for (const node of geometry.nodes) addCard(layerCards, node);

      addPgr(layerSummary, geometry.pgr);
      addAxis(layerSummary, geometry.axis);

      svg.appendChild(layerStages);
      svg.appendChild(layerArrows);
      svg.appendChild(layerCards);
      svg.appendChild(layerSummary);
    } catch (error) {
      svg.hidden = true;
      fallback.hidden = false;
    }
  </script>
</body>
</html>
