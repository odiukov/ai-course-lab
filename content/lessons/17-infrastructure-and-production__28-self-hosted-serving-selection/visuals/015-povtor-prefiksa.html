<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Почему повторяемый префикс склоняет выбор к SGLang</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fc;
      --panel: #ffffff;
      --panel-soft: #f0f3fa;
      --text: #172033;
      --muted: #59657a;
      --line: #c9d1df;
      --repeat: #7357d9;
      --repeat-soft: #e7e1ff;
      --tail: #e87932;
      --tail-soft: #ffeadb;
      --cache: #168868;
      --cache-soft: #d9f4e9;
      --white: #ffffff;
      --shadow: #dde2ec;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111620;
        --panel: #19212d;
        --panel-soft: #202b3a;
        --text: #edf2fa;
        --muted: #aeb9ca;
        --line: #435064;
        --repeat: #a995ff;
        --repeat-soft: #342d58;
        --tail: #ffa463;
        --tail-soft: #513521;
        --cache: #52c7a0;
        --cache-soft: #173f35;
        --white: #10151e;
        --shadow: #0c1017;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    main {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      background: var(--page);
    }

    h1 {
      margin: 0;
      padding: 18px 28px 12px;
      font-size: 22px;
      font-weight: 750;
      line-height: normal;
      letter-spacing: -0.02em;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
      background: var(--page);
    }

    .panel {
      fill: var(--panel);
      stroke: var(--line);
      stroke-width: 1.5px;
    }

    .panel-band {
      fill: var(--panel-soft);
    }

    .divider,
    .guide {
      stroke: var(--line);
      stroke-width: 1px;
    }

    .guide {
      stroke-dasharray: 4 5;
    }

    .repeat-block {
      fill: var(--repeat-soft);
      stroke: var(--repeat);
      stroke-width: 1.5px;
    }

    .repeat-core {
      fill: var(--repeat);
    }

    .tail-block {
      fill: var(--tail);
    }

    .tail-zone {
      fill: var(--tail-soft);
      stroke: var(--tail);
      stroke-width: 1px;
      stroke-dasharray: 4 5;
    }

    .cache-block {
      fill: var(--cache);
      stroke: var(--cache);
      stroke-width: 2px;
    }

    .cache-halo {
      fill: var(--cache-soft);
      stroke: var(--cache);
      stroke-width: 1px;
      stroke-dasharray: 4 5;
    }

    .branch {
      fill: none;
      stroke: var(--tail);
      stroke-width: 2.5px;
      stroke-linecap: round;
    }

    .step-dot {
      fill: var(--repeat);
    }

    .root-dot {
      fill: var(--cache);
      stroke: var(--panel);
      stroke-width: 2px;
    }

    .end-dot {
      fill: var(--tail);
      stroke: var(--panel);
      stroke-width: 1.5px;
    }

    .heading {
      fill: var(--text);
      font-size: 18px;
      font-weight: 750;
    }

    .subheading {
      fill: var(--muted);
      font-size: 13px;
      font-weight: 550;
    }

    .label {
      fill: var(--text);
      font-size: 14px;
      font-weight: 650;
    }

    .small-label {
      fill: var(--muted);
      font-size: 13px;
      font-weight: 550;
    }

    .inside {
      fill: var(--white);
      font-size: 13px;
      font-weight: 750;
    }

    .metric-repeat {
      fill: var(--repeat);
      font-size: 18px;
      font-weight: 800;
    }

    .metric-cache {
      fill: var(--cache);
      font-size: 18px;
      font-weight: 800;
    }

    .metric-tail {
      fill: var(--tail);
      font-size: 15px;
      font-weight: 750;
    }

    .conclusion {
      fill: var(--text);
      font-size: 15px;
      font-weight: 750;
    }

    .fallback {
      margin: 0;
      padding: 28px;
      min-height: 220px;
      background: var(--panel);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      color: var(--text);
      font-size: 16px;
      line-height: normal;
    }

    [hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Почему повторяемый префикс склоняет выбор к SGLang</h1>

    <p id="fallback" class="fallback">
      Схема должна показать десять шагов агента: обычный движок десять раз
      пересчитывает общий префикс из 8000 токенов, а RadixAttention сохраняет
      один расчёт и обрабатывает только новые хвосты.
    </p>

    <svg
      id="diagram"
      hidden
      viewBox="0 0 1200 440"
      width="1200"
      height="440"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-desc"
    ></svg>
  </main>

  <script>
    const data = {
      zero: 0,
      half: 0.5,
      one: 1,
      canvas: { width: 1200, height: 440 },
      panels: [
        { x: 3, y: 2, width: 54, height: 40 },
        { x: 63, y: 2, width: 54, height: 40 }
      ],
      left: {
        title: { x: 6, y: 5.5 },
        subtitle: { x: 6, y: 8 },
        rail: { x: 6.2, y1: 10.2, y2: 31.8 },
        prefixX: 8,
        prefixWidth: 36,
        barHeight: 1.25,
        rows: [
          { y: 10.2, tail: 1.2 },
          { y: 12.6, tail: 2.1 },
          { y: 15, tail: 1.6 },
          { y: 17.4, tail: 3.1 },
          { y: 19.8, tail: 1.4 },
          { y: 22.2, tail: 2.6 },
          { y: 24.6, tail: 1.8 },
          { y: 27, tail: 3.6 },
          { y: 29.4, tail: 2.3 },
          { y: 31.8, tail: 4.2 }
        ],
        dotRadius: 0.32,
        prefixLabel: { x: 26, y: 35.6 },
        metric: { x: 26, y: 38.2 },
        conclusion: { x: 30, y: 41 }
      },
      right: {
        title: { x: 66, y: 5.5 },
        subtitle: { x: 66, y: 8 },
        statement: { x: 80.8, y: 11.2 },
        halo: { x: 66, y: 12.7, width: 31.2, height: 6.5 },
        trunk: { x: 67, y: 13.7, width: 29.5, height: 4.5 },
        trunkText: { x: 81.75, y: 16.55 },
        root: { x: 96.5, y: 15.95, radius: 0.58 },
        tailZone: { x: 98.6, y: 19.1, width: 15.3, height: 16.2 },
        ends: [
          { x: 102.2, y: 20.1 },
          { x: 104.5, y: 21.7 },
          { x: 106.1, y: 23.2 },
          { x: 108.4, y: 24.8 },
          { x: 110.7, y: 26.3 },
          { x: 103.4, y: 28 },
          { x: 105.8, y: 29.5 },
          { x: 108.1, y: 31.1 },
          { x: 110.5, y: 32.6 },
          { x: 112.8, y: 34.2 }
        ],
        endRadius: 0.34,
        tailLabel: { x: 113.8, y: 37.4 },
        conclusion: { x: 90, y: 41 }
      },
      bandHeight: 7,
      divider: { x: 60, y1: 4, y2: 40 },
      inset: 1,
      fallbackText:
        "Схема должна показать десять шагов агента: обычный движок десять раз пересчитывает общий префикс из 8000 токенов, а RadixAttention сохраняет один расчёт и обрабатывает только новые хвосты."
    };

    const origin = Object.freeze({ x: 0, y: 0 });
    const scale = Object.freeze({ x: 10, y: 10 });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const ns = "http://www.w3.org/2000/svg";

      const make = (name, attributes, className) => {
        const element = document.createElementNS(ns, name);
        Object.entries(attributes).forEach(([key, value]) => {
          element.setAttribute(key, String(value));
        });
        if (className) element.setAttribute("class", className);
        return element;
      };

      const add = element => {
        svg.appendChild(element);
        return element;
      };

      const rectangle = (box, className) =>
        add(make("rect", {
          x: sx(box.x),
          y: sy(box.y),
          width: sx(box.x + box.width) - sx(box.x),
          height: sy(box.y + box.height) - sy(box.y)
        }, className));

      const segment = (x1, y1, x2, y2, className) =>
        add(make("line", {
          x1: sx(x1),
          y1: sy(y1),
          x2: sx(x2),
          y2: sy(y2)
        }, className));

      const circle = (point, radius, className) =>
        add(make("circle", {
          cx: sx(point.x),
          cy: sy(point.y),
          r: sx(radius) - sx(data.zero)
        }, className));

      const label = (point, content, className, anchor) => {
        const element = make("text", {
          x: sx(point.x),
          y: sy(point.y),
          "text-anchor": anchor
        }, className);
        element.textContent = content;
        return add(element);
      };

      const svgTitle = make("title", { id: "svg-title" });
      svgTitle.textContent = "Сравнение повторного расчёта и RadixAttention";
      add(svgTitle);

      const svgDesc = make("desc", { id: "svg-desc" });
      svgDesc.textContent =
        "Слева общий префикс из 8000 токенов вычисляется заново на каждом из десяти шагов. Справа SGLang сохраняет префикс и вычисляет только десять коротких новых хвостов.";
      add(svgDesc);

      data.panels.forEach(panel => {
        rectangle(panel, "panel");
        rectangle({
          x: panel.x,
          y: panel.y,
          width: panel.width,
          height: data.bandHeight
        }, "panel-band");
        segment(
          panel.x + data.inset,
          panel.y + data.bandHeight,
          panel.x + panel.width - data.inset,
          panel.y + data.bandHeight,
          "divider"
        );
      });

      segment(
        data.divider.x,
        data.divider.y1,
        data.divider.x,
        data.divider.y2,
        "guide"
      );

      label(
        data.left.title,
        "Обычный движок",
        "heading",
        "start"
      );
      label(
        data.left.subtitle,
        "10 независимых вычислений",
        "subheading",
        "start"
      );

      segment(
        data.left.rail.x,
        data.left.rail.y1,
        data.left.rail.x,
        data.left.rail.y2,
        "guide"
      );

      data.left.rows.forEach(row => {
        circle(
          { x: data.left.rail.x, y: row.y + data.left.barHeight * data.half },
          data.left.dotRadius,
          "step-dot"
        );

        rectangle({
          x: data.left.prefixX,
          y: row.y,
          width: data.left.prefixWidth,
          height: data.left.barHeight
        }, "repeat-block");

        rectangle({
          x: data.left.prefixX + data.left.prefixWidth,
          y: row.y,
          width: row.tail,
          height: data.left.barHeight
        }, "tail-block");
      });

      label(
        data.left.prefixLabel,
        "тот же префикс пересчитан",
        "small-label",
        "middle"
      );
      label(
        data.left.metric,
        "8000 токенов × 10",
        "metric-repeat",
        "middle"
      );
      label(
        data.left.conclusion,
        "GPU повторяет прежнюю работу",
        "conclusion",
        "middle"
      );

      label(
        data.right.title,
        "SGLang · RadixAttention",
        "heading",
        "start"
      );
      label(
        data.right.subtitle,
        "совпадение начала найдено в кэше",
        "subheading",
        "start"
      );
      label(
        data.right.statement,
        "общий префикс вычислен один раз",
        "label",
        "middle"
      );

      rectangle(data.right.halo, "cache-halo");
      rectangle(data.right.trunk, "cache-block");
      label(
        data.right.trunkText,
        "8000 токенов из кэша",
        "inside",
        "middle"
      );

      rectangle(data.right.tailZone, "tail-zone");

      data.right.ends.forEach(endpoint => {
        segment(
          data.right.root.x,
          data.right.root.y,
          endpoint.x,
          endpoint.y,
          "branch"
        );
        circle(endpoint, data.right.endRadius, "end-dot");
      });

      circle(
        data.right.root,
        data.right.root.radius,
        "root-dot"
      );

      label(
        data.right.tailLabel,
        "10 новых хвостов",
        "metric-tail",
        "end"
      );
      label(
        data.right.conclusion,
        "GPU считает только новое",
        "conclusion",
        "middle"
      );

      fallback.hidden = true;
      svg.hidden = false;
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      if (svg) {
        svg.replaceChildren();
        svg.hidden = true;
      }
      if (fallback) {
        fallback.textContent = data.fallbackText;
        fallback.hidden = false;
      }
    }
  </script>
</body>
</html>
