<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Лестница масштаба</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #f7f9fc;
      --ink: #172033;
      --muted: #596579;
      --outline: #34435b;
      --accent: #3467d6;
      --stage-one: #dff2e7;
      --stage-two: #dcecf8;
      --stage-three: #e5e2fa;
      --stage-four: #f0e0f3;
      --component: #ffffff;
      --cache: #ffe7b8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #111722;
        --ink: #f2f5fb;
        --muted: #b6c0d0;
        --outline: #91a0b7;
        --accent: #76a5ff;
        --stage-one: #173d31;
        --stage-two: #19364b;
        --stage-three: #302d55;
        --stage-four: #452b4b;
        --component: #172131;
        --cache: #49391c;
      }
    }

    html,
    body {
      background: var(--background);
      color: var(--ink);
    }

    body,
    figure,
    h2 {
      margin: unset;
    }

    figure {
      width: 100%;
      background: var(--background);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .diagram-title {
      color: var(--ink);
      font-size: 20px;
      font-weight: bold;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 470px;
      background: var(--background);
    }

    .canvas-bg {
      fill: var(--background);
    }

    .step {
      stroke: var(--outline);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .stage-one {
      fill: var(--stage-one);
    }

    .stage-two {
      fill: var(--stage-two);
    }

    .stage-three {
      fill: var(--stage-three);
    }

    .stage-four {
      fill: var(--stage-four);
    }

    .tread {
      stroke: var(--accent);
      stroke-width: 4px;
      vector-effect: non-scaling-stroke;
    }

    .range {
      fill: var(--ink);
      font-size: 17px;
      font-weight: bold;
    }

    .solution {
      fill: var(--ink);
      font-size: 20px;
      font-weight: bold;
    }

    .detail {
      fill: var(--muted);
      font-size: 14px;
    }

    .small-detail {
      fill: var(--muted);
      font-size: 13px;
    }

    .load-arrow {
      fill: none;
      stroke: var(--accent);
      stroke-width: 3px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .arrow-head {
      fill: var(--accent);
    }

    .arrow-label {
      fill: var(--accent);
      font-size: 14px;
      font-weight: bold;
    }

    .component {
      fill: var(--component);
      stroke: var(--outline);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .cache-component {
      fill: var(--cache);
      stroke: var(--outline);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .component-label {
      fill: var(--ink);
      font-size: 13px;
      font-weight: bold;
    }

    .connection {
      fill: none;
      stroke: var(--outline);
      stroke-width: 2px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .footer-note {
      fill: var(--muted);
      font-size: 14px;
      font-weight: bold;
    }

    .fallback {
      fill: var(--ink);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-heading">
    <h2 id="diagram-heading" class="diagram-title">
      Лестница масштаба: от ноутбука до enterprise-кластера
    </h2>

    <svg
      id="scale-diagram"
      viewBox="0 0 960 470"
      width="960"
      height="470"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description">
      <title id="svg-title">Четыре ступени инфраструктуры для запуска языковой модели</title>
      <desc id="svg-description">
        От Ollama для одного пользователя через vLLM на одном GPU и production-stack
        к разделению prefill и decode с LMCache при масштабе более десяти тысяч пользователей.
      </desc>
      <g id="drawing"></g>
    </svg>
  </figure>

  <script>
    const data = [
      {
        canvas: { left: 0, top: 0, right: 96, bottom: 47 }
      },
      {
        steps: [
          {
            bounds: { left: 10, top: 33, right: 28, bottom: 41 },
            className: "stage-one",
            labels: [
              {
                text: "1 пользователь",
                anchor: { x: 19, y: 35.2 },
                offset: { x: 0, y: 0 },
                side: "middle",
                className: "range"
              },
              {
                text: "Ollama",
                anchor: { x: 19, y: 37.8 },
                offset: { x: 0, y: 0 },
                side: "middle",
                className: "solution"
              },
              {
                text: "локальная разработка",
                anchor: { x: 19, y: 39.7 },
                offset: { x: 0, y: 0 },
                side: "middle",
                className: "small-detail"
              }
            ]
          },
          {
            bounds: { left: 28, top: 25, right: 49, bottom: 41 },
            className: "stage-two",
            labels: [
              {
                text: "10–100 пользователей",
                anchor: { x: 38.5, y: 27.4 },
                offset: { x: 0, y: 0 },
                side: "middle",
                className: "range"
              },
              {
                text: "vLLM",
                anchor: { x: 38.5, y: 30.3 },
                offset: { x: 0, y: 0 },
                side: "middle",
                className: "solution"
              },
              {
                text: "на одном GPU",
                anchor: { x: 38.5, y: 32.7 },
                offset: { x: 0, y: 0 },
                side: "middle",
                className: "detail"
              },
              {
                text: "эффективная очередь запросов",
                anchor: { x: 38.5, y: 36.1 },
                offset: { x: 0, y: 0 },
                side: "middle",
                className: "small-detail"
              }
            ]
          },
          {
            bounds: { left: 49, top: 17, right: 72, bottom: 41 },
            className: "stage-three",
            labels: [
              {
                text: "100–10 000 пользователей",
                anchor: { x: 60.5, y: 19.4 },
                offset: { x: 0, y: 0 },
                side: "middle",
                className: "range"
              },
              {
                text: "vLLM production-stack",
                anchor: { x: 60.5, y: 22.4 },
                offset: { x: 0, y: 0 },
                side: "middle",
                className: "solution"
              },
              {
                text: "или SGLang",
                anchor: { x: 60.5, y: 24.9 },
                offset: { x: 0, y: 0 },
                side: "middle",
                className: "solution"
              },
              {
                text: "несколько экземпляров сервера",
                anchor: { x: 60.5, y: 28.7 },
                offset: { x: 0, y: 0 },
                side: "middle",
                className: "small-detail"
              },
              {
                text: "маршрутизация и наблюдение",
                anchor: { x: 60.5, y: 31 },
                offset: { x: 0, y: 0 },
                side: "middle",
                className: "small-detail"
              }
            ]
          },
          {
            bounds: { left: 72, top: 9, right: 92, bottom: 41 },
            className: "stage-four",
            labels: [
              {
                text: "10 000+ пользователей",
                anchor: { x: 82, y: 11.4 },
                offset: { x: 0, y: 0 },
                side: "middle",
                className: "range"
              },
              {
                text: "раздельные",
                anchor: { x: 82, y: 14.3 },
                offset: { x: 0, y: 0 },
                side: "middle",
                className: "detail"
              },
              {
                text: "prefill / decode",
                anchor: { x: 82, y: 16.8 },
                offset: { x: 0, y: 0 },
                side: "middle",
                className: "solution"
              },
              {
                text: "enterprise-кластер",
                anchor: { x: 82, y: 19.1 },
                offset: { x: 0, y: 0 },
                side: "middle",
                className: "small-detail"
              }
            ]
          }
        ]
      },
      {
        shaft: {
          from: { x: 5, y: 39 },
          to: { x: 5, y: 11 }
        },
        head: [
          { x: 5, y: 9 },
          { x: 3.9, y: 11.4 },
          { x: 6.1, y: 11.4 }
        ],
        label: {
          text: "реальная нагрузка растёт",
          anchor: { x: 6.2, y: 43.3 },
          offset: { x: 0, y: 0 },
          side: "start",
          className: "arrow-label"
        }
      },
      {
        components: [
          {
            bounds: { left: 74, top: 23, right: 81.5, bottom: 28 },
            className: "component",
            label: {
              text: "prefill",
              anchor: { x: 77.75, y: 26 },
              offset: { x: 0, y: 0 },
              side: "middle",
              className: "component-label"
            }
          },
          {
            bounds: { left: 84, top: 23, right: 91, bottom: 28 },
            className: "component",
            label: {
              text: "decode",
              anchor: { x: 87.5, y: 26 },
              offset: { x: 0, y: 0 },
              side: "middle",
              className: "component-label"
            }
          },
          {
            bounds: { left: 77.5, top: 34, right: 87.5, bottom: 38 },
            className: "cache-component",
            label: {
              text: "LMCache",
              anchor: { x: 82.5, y: 36.5 },
              offset: { x: 0, y: 0 },
              side: "middle",
              className: "component-label"
            }
          }
        ],
        directConnection: {
          from: { x: 81.5, y: 25.5 },
          to: { x: 83.3, y: 25.5 },
          head: [
            { x: 84, y: 25.5 },
            { x: 83.1, y: 24.8 },
            { x: 83.1, y: 26.2 }
          ]
        },
        cacheConnections: [
          {
            from: { x: 79.2, y: 28 },
            bend: { x: 79.2, y: 31.2 },
            to: { x: 80, y: 34 }
          },
          {
            from: { x: 87.5, y: 28 },
            bend: { x: 87.5, y: 31.2 },
            to: { x: 85.5, y: 34 }
          }
        ]
      },
      {
        label: {
          text: "Не перепрыгивай ступени: сложность добавляется только вслед за нагрузкой",
          anchor: { x: 59, y: 45.8 },
          offset: { x: 0, y: 0 },
          side: "middle",
          className: "footer-note"
        }
      },
      {
        labels: [
          {
            text: "1 пользователь — Ollama; 10–100 — vLLM на одном GPU;",
            anchor: { x: 6, y: 20 },
            offset: { x: 0, y: 0 },
            side: "start",
            className: "fallback"
          },
          {
            text: "100–10 000 — vLLM production-stack или SGLang;",
            anchor: { x: 6, y: 23 },
            offset: { x: 0, y: 0 },
            side: "start",
            className: "fallback"
          },
          {
            text: "10 000+ — раздельные prefill/decode и LMCache.",
            anchor: { x: 6, y: 26 },
            offset: { x: 0, y: 0 },
            side: "start",
            className: "fallback"
          }
        ]
      }
    ];

    const origin = Object.freeze({ x: 0, y: 0 });
    const scale = 10;

    const sx = x => origin.x + x * scale;
    const sy = y => origin.y + y * scale;

    const [
      canvasData,
      staircaseData,
      loadData,
      architectureData,
      footerData,
      fallbackData
    ] = data;

    const namespace = "http://www.w3.org/2000/svg";
    const drawing = document.getElementById("drawing");

    function createElement(name, attributes, content) {
      const element = document.createElementNS(namespace, name);

      for (const [attribute, value] of Object.entries(attributes)) {
        element.setAttribute(attribute, String(value));
      }

      if (content !== undefined) {
        element.textContent = content;
      }

      return element;
    }

    function appendLabel(parent, label) {
      parent.appendChild(createElement("text", {
        x: sx(label.anchor.x),
        y: sy(label.anchor.y),
        dx: label.offset.x,
        dy: label.offset.y,
        "text-anchor": label.side,
        class: label.className
      }, label.text));
    }

    function appendBox(parent, bounds, className) {
      parent.appendChild(createElement("rect", {
        x: sx(bounds.left),
        y: sy(bounds.top),
        width: sx(bounds.right) - sx(bounds.left),
        height: sy(bounds.bottom) - sy(bounds.top),
        class: className
      }));
    }

    function appendLine(parent, from, to, className) {
      parent.appendChild(createElement("line", {
        x1: sx(from.x),
        y1: sy(from.y),
        x2: sx(to.x),
        y2: sy(to.y),
        class: className
      }));
    }

    function appendPolygon(parent, points, className) {
      parent.appendChild(createElement("polygon", {
        points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
        class: className
      }));
    }

    try {
      appendBox(drawing, {
        left: canvasData.canvas.left,
        top: canvasData.canvas.top,
        right: canvasData.canvas.right,
        bottom: canvasData.canvas.bottom
      }, "canvas-bg");

      const stepsLayer = createElement("g", { "aria-label": "Ступени масштаба" });

      for (const step of staircaseData.steps) {
        appendBox(stepsLayer, step.bounds, `step ${step.className}`);

        appendLine(
          stepsLayer,
          { x: step.bounds.left, y: step.bounds.top },
          { x: step.bounds.right, y: step.bounds.top },
          "tread"
        );

        for (const label of step.labels) {
          appendLabel(stepsLayer, label);
        }
      }

      drawing.appendChild(stepsLayer);

      const arrowLayer = createElement("g", { "aria-label": "Рост реальной нагрузки" });
      appendLine(arrowLayer, loadData.shaft.from, loadData.shaft.to, "load-arrow");
      appendPolygon(arrowLayer, loadData.head, "arrow-head");
      appendLabel(arrowLayer, loadData.label);
      drawing.appendChild(arrowLayer);

      const architectureLayer = createElement("g", {
        "aria-label": "Разделение prefill и decode с LMCache"
      });

      for (const component of architectureData.components) {
        appendBox(architectureLayer, component.bounds, component.className);
        appendLabel(architectureLayer, component.label);
      }

      appendLine(
        architectureLayer,
        architectureData.directConnection.from,
        architectureData.directConnection.to,
        "connection"
      );
      appendPolygon(
        architectureLayer,
        architectureData.directConnection.head,
        "arrow-head"
      );

      for (const connection of architectureData.cacheConnections) {
        architectureLayer.appendChild(createElement("polyline", {
          points: [
            `${sx(connection.from.x)},${sy(connection.from.y)}`,
            `${sx(connection.bend.x)},${sy(connection.bend.y)}`,
            `${sx(connection.to.x)},${sy(connection.to.y)}`
          ].join(" "),
          class: "connection"
        }));
      }

      drawing.appendChild(architectureLayer);
      appendLabel(drawing, footerData.label);
    } catch (error) {
      drawing.replaceChildren();

      appendBox(drawing, {
        left: canvasData.canvas.left,
        top: canvasData.canvas.top,
        right: canvasData.canvas.right,
        bottom: canvasData.canvas.bottom
      }, "canvas-bg");

      for (const label of fallbackData.labels) {
        appendLabel(drawing, label);
      }
    }
  </script>
</body>
</html>
