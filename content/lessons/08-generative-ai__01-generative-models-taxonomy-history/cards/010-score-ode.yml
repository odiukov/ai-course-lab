- concept: score равен градиенту логарифма плотности по данным
  question: Для одномерного распределения log p(x) = K − 7x⁴, где K не зависит от x. Чему равен score s(x) в точке x = 5?
  explanation: В одномерном случае s(x) = d log p(x) / dx. Производная константы K равна нулю, поэтому s(x) = −28x³. При x = 5 получаем −28 · 125 = −3500.
  kind: numeric
  answer: -3500
  tolerance: 0.01
  id: 010-score-ode-1
  fingerprint: 143de4bd
- concept: неизвестная нормировочная константа не влияет на score
  question: Известна ненормированная плотность q(x) = Zp(x), где Z — неизвестная положительная константа, не зависящая от x. Как связаны score-функции q и p?
  explanation: log q(x) = log Z + log p(x). Поскольку log Z не зависит от x, его градиент равен нулю. Поэтому ненормированная и нормированная плотности имеют одинаковый score.
  kind: choice
  options:
    - ∇ₓ log q(x) = ∇ₓ log p(x)
    - ∇ₓ log q(x) = Z∇ₓ log p(x)
    - ∇ₓ log q(x) = ∇ₓ log p(x) + Z
    - Без значения Z вычислить связь невозможно
  correct: 0
  id: 010-score-ode-2
  fingerprint: 2fbb1671
