- concept: ширина полосы KDE управляет степенью сглаживания и разрешением мод
  question: Что наиболее вероятно произойдёт с KDE двухкластерной выборки, если заметно увеличить ширину полосы?
  explanation: 'Большая ширина полосы сильнее размазывает вклад каждого образца: случайные колебания сглаживаются, но отдельные моды могут перестать различаться. При слишком малой ширине, напротив, возникают узкие пики вокруг наблюдений.'
  kind: choice
  options:
    - Кривая станет более гладкой, а две моды могут слиться
    - Кривая распадётся на более узкие пики вокруг отдельных наблюдений
    - Площадь под нормированной оценкой обязательно увеличится
    - Оценка превратится в ступенчатую гистограмму
  correct: 0
  id: 030-kde-density-1
  fingerprint: aacf5877
- concept: ненулевая плотность KDE между наблюдениями возникает из-за хвостов ядер
  question: Почему KDE с гауссовым ядром может дать положительную плотность в области, где в выборке нет ни одного наблюдения?
  explanation: KDE суммирует гладкие ядра, а не считает только непосредственные попадания. Поэтому при ширине полосы 0,3 хвосты ядер около мод в −2 и +2 переносят немного оценённой массы в ложбину между ними.
  kind: open
  reference: Каждое гауссово ядро имеет ненулевые хвосты и вносит вклад не только в точке образца, но и вокруг неё. Хвосты ядер соседних наблюдений могут перекрываться в пустой области, создавая там положительную оценку плотности.
  id: 030-kde-density-2
  fingerprint: 2f0da7d9
