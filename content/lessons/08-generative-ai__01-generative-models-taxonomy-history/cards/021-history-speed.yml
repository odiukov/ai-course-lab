- concept: 'последовательность поздних вех: распространение диффузии на видео, продакшен-качество видео и предельно короткое сэмплирование'
  question: Расположите этапы развития генеративных моделей в хронологическом порядке.
  explanation: В 2024 году Sora, Stable Diffusion 3 и Flux.1 обозначили переход к видео и лидерство flow matching. В 2025 году видео достигло продакшен-уровня, а к 2026 году consistency и rectified flow нацелились на одношаговое сэмплирование.
  kind: order
  items:
    - Диффузионные модели выходят в видео, а flow matching становится ведущим направлением.
    - Генерация видео достигает продакшен-уровня.
    - Consistency-подходы вместе с rectified flow позволяют предельно сократить сэмплирование на диффузионной основе.
  id: 021-history-speed-1
  fingerprint: eb63c7cc
- concept: число кадров видео и число шагов сэмплирования являются независимыми характеристиками генерации
  question: Длительность ролика и его частота кадров не изменились, но новый сэмплер требует меньше повторных вызовов нейросети. Что именно сократилось?
  explanation: Кадры задают временное содержимое готового видео, а шаги сэмплирования — число повторных вычислений при превращении шума в результат. Поэтому сокращение шагов ускоряет генерацию, не удаляя кадры.
  kind: choice
  options:
    - Количество кадров в готовом ролике
    - Количество шагов сэмплирования и связанные с ними вычисления
    - Количество обучающих видеороликов
    - Размерность каждого кадра
  correct: 1
  id: 021-history-speed-2
  fingerprint: 6a2cae4c
