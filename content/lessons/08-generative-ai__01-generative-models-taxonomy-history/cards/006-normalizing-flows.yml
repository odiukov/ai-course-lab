- concept: формула замены переменных корректирует плотность логарифмом модуля определителя якобиана
  question: Восстанови формулу плотности для нормализующего потока, где f переводит объект x в базовую переменную z.
  explanation: Плотность зависит не только от плотности базовой точки, но и от локального изменения объёма. Его учитывает модуль определителя якобиана преобразования.
  kind: cloze
  template: \log p_X(x)=\log p_Z(f(x))+___
  answer: \log|\det J_f(x)|
  accept:
    - \log |\det J_f(x)|
    - log abs(det J_f(x))
  id: 006-normalizing-flows-1
  fingerprint: e868c074
- concept: генерация в нормализующем потоке выполняется обратным преобразованием базового образца
  question: Преобразование f переводит данные x в переменную z с простым базовым распределением. Как сгенерировать новый объект?
  explanation: При оценке плотности поток идёт от данных к базе через f, а при генерации — от случайного базового образца к данным через обратное преобразование f⁻¹.
  kind: choice
  options:
    - Выбрать z из базового распределения и вычислить x = f⁻¹(z)
    - Выбрать x из базового распределения и вычислить z = f(x)
    - Подбирать x, пока дискриминатор не примет его за настоящий объект
  correct: 0
  id: 006-normalizing-flows-2
  fingerprint: 6e79da0f
- concept: точное правдоподобие ограничивает архитектуру нормализующего потока
  question: Почему нормализующий поток нельзя без изменений построить из произвольных нейросетевых слоёв?
  explanation: Для генерации требуется применить обратное преобразование, а для точного расчёта плотности — найти определитель якобиана. Поэтому слои потока специально проектируют так, чтобы обе операции оставались вычислимыми.
  kind: open
  reference: Каждый слой должен быть обратимым, а его обратное преобразование и определитель якобиана должны вычисляться практически приемлемым способом.
  id: 006-normalizing-flows-3
  fingerprint: 4a31185f
