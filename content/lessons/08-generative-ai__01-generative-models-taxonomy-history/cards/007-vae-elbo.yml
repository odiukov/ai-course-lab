- concept: ELBO равен ожидаемому лог-правдоподобию реконструкции минус KL-дивергенция
  question: Для одного объекта ожидаемое значение log pθ(x|z) равно -8.4, а KL-дивергенция между qφ(z|x) и p(z) равна 0.6. Чему равен ELBO?
  explanation: ELBO вычисляется как E[log pθ(x|z)] − D_KL(qφ(z|x) || p(z)). Поэтому -8.4 − 0.6 = -9.0.
  kind: numeric
  answer: -9
  tolerance: 0.01
  id: 007-vae-elbo-1
  fingerprint: a55135c5
- concept: KL-регуляризация согласует коды объектов с априорным распределением, из которого выполняется генерация
  question: Из функции потерь VAE убрали KL-слагаемое. Модель хорошо восстанавливает обучающие изображения, но случайные коды из p(z) декодируются в бессмысленные изображения. Какова наиболее вероятная причина?
  explanation: Реконструкционная цель требует лишь восстановить конкретные объекты и не обязывает распределение кодов совпадать с p(z). KL-штраф приближает qφ(z|x) к априорному распределению, поэтому коды, случайно взятые из p(z), чаще попадают в освоенные декодировщиком области.
  kind: choice
  options:
    - Кодировщик мог разместить коды в произвольных изолированных областях, не согласованных с типичными значениями из p(z)
    - Без KL-слагаемого декодировщик обязательно становится линейным
    - Ожидаемое лог-правдоподобие перестаёт зависеть от параметров декодировщика
    - Удаление KL-слагаемого превращает ELBO в верхнюю границу log pθ(x)
  correct: 0
  id: 007-vae-elbo-2
  fingerprint: 7b32f352
