- concept: известные целевые элементы допускают параллельное обучение, но авторегрессионное сэмплирование остаётся последовательным
  question: При обучении трансформер одновременно вычисляет предсказания для всех позиций готовой последовательности. Почему при генерации нельзя так же одновременно получить все новые токены?
  explanation: При обучении вся целевая последовательность уже известна, поэтому условные распределения можно считать параллельно с причинной маской. При сэмплировании результат каждого выбора становится частью контекста следующего, создавая последовательную зависимость.
  kind: choice
  options:
    - Будущий сгенерированный токен должен учитывать конкретные значения ранее сэмплированных токенов, которые ещё неизвестны
    - Функция softmax работает только с одной позицией за запуск
    - Условные вероятности невозможно вычислять на графическом процессоре
    - Одновременная генерация запрещена только выбранной функцией потерь
  correct: 0
