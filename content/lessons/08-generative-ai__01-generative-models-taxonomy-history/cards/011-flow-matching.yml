- concept: flow matching обучает поле скоростей на случайных точках заданного пути между шумом и данными
  question: Какую величину обычно учится предсказывать сеть в flow matching для промежуточного состояния между шумом и данными?
  explanation: Сеть аппроксимирует зависящее от состояния и времени поле скоростей. Для обучения можно сэмплировать момент пути и соответствующее промежуточное состояние, поэтому проходить всю траекторию на каждом учебном примере не требуется.
  kind: choice
  options:
    - Мгновенную скорость движения вдоль выбранного вероятностного пути
    - Вероятность того, что дискриминатор примет состояние за настоящее
    - Точное значение логарифма плотности этого состояния
    - Градиент ошибки реконструкции по параметрам декодировщика
  correct: 0
  id: 011-flow-matching-1
  fingerprint: 7fcc64d5
- concept: генерация flow matching выполняется численным интегрированием обученного поля скоростей
  question: Расположите этапы генерации с помощью flow matching в правильном порядке.
  explanation: 'При инференсе сеть задаёт правую часть ODE: скорость для текущих состояния и времени. Численный решатель последовательно обновляет шумовой образец и переносит его в распределение данных.'
  kind: order
  items:
    - Сэмплировать начальное состояние из распределения шума
    - Задать дифференциальное уравнение с предсказанным сетью полем скоростей
    - Численно проинтегрировать уравнение от начального до конечного времени
    - Использовать конечное состояние как сгенерированный образец
  id: 011-flow-matching-2
  fingerprint: c4ee878d
- concept: малая кривизна траекторий позволяет численному решателю использовать меньше вычислений при сэмплировании
  question: Почему более прямые траектории переноса от шума к данным обычно ускоряют генерацию при flow matching?
  explanation: Сильно изгибающуюся траекторию приходится отслеживать мелкими шагами. Более прямой и гладкий путь обычно допускает крупные шаги решателя, поэтому для генерации требуется меньше вычислений сети.
  kind: choice
  options:
    - Решатель может достичь нужной точности с меньшим числом обращений к полю скоростей
    - Плотность данных становится равномерной и перестаёт требовать моделирования
    - Каждый образец генерируется одним авторегрессионным предсказанием
    - Численное интегрирование заменяется точным вычислением логарифма плотности
  correct: 0
  id: 011-flow-matching-3
  fingerprint: 3be99928
