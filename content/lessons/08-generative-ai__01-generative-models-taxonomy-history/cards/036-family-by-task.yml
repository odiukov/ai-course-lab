- concept: реконструкция объёмной сцены и генерация новых ракурсов могут выполняться разными компонентами
  question: Заполни пропуск названием пары подходов для построения объёмной сцены и достраивания новых ракурсов.
  explanation: Gaussian Splatting эффективно представляет реконструированную сцену набором полупрозрачных объёмных примитивов. Диффузионный приор дополняет эту геометрию сведениями, необходимыми для новых ракурсов.
