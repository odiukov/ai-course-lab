- concept: узкодоменная генерация лиц и общий text-to-image требуют разных семейств моделей
  question: Для одного продукта нужны резкие портреты сотрудников из узкого визуального домена, а для другого — изображения произвольных сюжетов по тексту. Какие семейства моделей подходят этим продуктам и почему?
  explanation: StyleGAN сохраняет сильные позиции в специализированной генерации лиц. Общий text-to-image требует охватывать гораздо более широкое распределение сюжетов, поэтому обычно использует текстово обусловленный flow matching в латентном пространстве.
  kind: open
  reference: 'Для узкого домена фотореалистичных лиц подходит семейство StyleGAN: оно даёт резкие результаты и быстрый инференс. Для общего text-to-image предпочтительнее flow matching в латентном пространстве VAE, поскольку такая схема рассчитана на разнообразную условную генерацию по тексту.'
