- concept: пространство моделирования и способ доступа к плотности являются независимыми характеристиками генеративной модели
  question: Модель обучает поле скоростей в непрерывном латентном пространстве, а значение log p можно получить только численным интегрированием. Каков правильный триаж?
  explanation: Объект распределения здесь — латентные переменные. Плотность доступна, но для её получения требуется интегрирование; это не прямое вычисление и не отсутствие плотности.
  kind: choice
  options:
    - Моделируются пиксели, плотность вычисляется напрямую
    - Моделируются латенты, плотность восстанавливается интегрированием
    - Моделируются латенты, плотности не существует
    - Моделируются изображения, доступна только нижняя граница плотности
  correct: 1
  id: 023-triage-representation-1
  fingerprint: eb582dcb
- concept: правдоподобия в разных пространствах относятся к разным случайным величинам
  question: Объясни своими словами, почему нельзя напрямую сопоставить заявленное правдоподобие пикселей одной модели с правдоподобием латентных кодов другой, даже если обе модели в итоге создают изображения.
  explanation: Название выходного артефакта не определяет объект плотности. Перед интерпретацией log p нужно установить, для какой переменной — пикселей, латентов, токенов или другого представления — оно вычислено.
  kind: open
  reference: Эти значения относятся к распределениям разных случайных величин и в разных пространствах. Правдоподобие латентного кода оценивает код, а не непосредственно изображение, поэтому без учёта преобразования между пространствами такие числа не являются одной и той же мерой качества.
  id: 023-triage-representation-2
  fingerprint: 1215f966
