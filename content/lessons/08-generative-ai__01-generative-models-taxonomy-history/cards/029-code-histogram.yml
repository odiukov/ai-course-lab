- concept: нормировка гистограммной плотности проверяется суммой площадей столбцов
  question: Три корзины гистограммной оценки плотности имеют ширины 0.4, 0.7 и 1.3, а их высоты равны 0.6, 0.8 и 0.15. Чему равна суммарная площадь столбцов?
  explanation: 'Площадь равна сумме произведений высоты на ширину: 0.4·0.6 + 0.7·0.8 + 1.3·0.15 = 0.995. Значение близко к единице, поэтому оценка практически нормирована.'
  kind: numeric
  answer: 0.995
  tolerance: 0.0001
  id: 029-code-histogram-1
  fingerprint: 783c24ea
- concept: полуоткрытые корзины исключают двойной подсчёт наблюдений на общих границах
  question: Как задать последовательные корзины гистограммы, чтобы наблюдение на общей границе попало ровно в одну корзину?
  explanation: У соседних полуоткрытых интервалов общая граница принадлежит только правой корзине. Правую границу последней корзины обычно включают отдельно, чтобы не потерять крайнее наблюдение.
  kind: choice
  options:
    - Использовать полуоткрытые интервалы [a, b), включив также правую границу последней корзины
    - Включать обе границы [a, b] у каждой корзины
    - Исключать обе границы (a, b) у каждой корзины
    - Считать граничное наблюдение в обеих соседних корзинах и затем усреднять их высоты
