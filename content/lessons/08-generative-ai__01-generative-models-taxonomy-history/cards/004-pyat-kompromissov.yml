- concept: точное правдоподобие дискретных кодов не означает точного правдоподобия исходных данных
  question: Почему авторегрессионная модель над дискретными кодами изображения может точно вычислять вероятность токенов, но не вероятность исходного изображения в пикселях?
  explanation: Трансформер точно моделирует распределение в пространстве кодов. Потеря информации при токенизации разрывает соответствие между этим распределением и точной плотностью в исходном пространстве.
  kind: open
  reference: Последовательность токенов имеет вычислимую авторегрессионную вероятность, однако токенизатор обычно сжимает данные с потерями и не является обратимым. Поэтому одному набору кодов могут соответствовать разные исходные изображения, и вероятность токенов нельзя считать точной плотностью пикселей.
  id: 004-pyat-kompromissov-3
  fingerprint: 99dd42e8
