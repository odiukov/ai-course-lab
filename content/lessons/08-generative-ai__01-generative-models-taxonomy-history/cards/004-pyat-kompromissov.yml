- concept: score-based модели отличаются от неявных моделей возможностью восстановить плотность интегрированием
  question: Модель учит градиент логарифма плотности, а точное правдоподобие для заданного объекта можно получить лишь с помощью дорогого интегрирования probability-flow ODE. К какому семейству она относится?
  explanation: Score задаёт направление роста логарифма плотности. В отличие от GAN, плотность здесь в принципе восстанавливается интегрированием, хотя такая процедура вычислительно дорога.
  kind: choice
  options:
    - Score-based модели и flow matching
    - GAN
    - VAE
    - Токенная авторегрессионная модель
