- concept: генерация DDPM выполняется последовательным применением обратных шагов диффузии
  question: Расположи этапы генерации образца с помощью DDPM в правильном порядке.
  explanation: DDPM не создаёт образец за один прямой проход. Генерация начинается со случайного шума и состоит из длинной последовательности небольших шагов шумоподавления.
  kind: order
  items:
    - Сэмплировать исходное состояние из распределения случайного шума
    - Предсказать шум, присутствующий в текущем состоянии
    - Получить немного менее зашумлённое состояние
    - Повторять обратные шаги до получения правдоподобного образца
  id: 008-ddpm-elbo-1
  fingerprint: cf3c9b35
- concept: DDPM можно обучать на случайных уровнях шума без разворачивания всей диффузионной цепочки
  question: Как обычно формируют отдельный обучающий пример для шумоподавителя DDPM?
  explanation: Шумное состояние для выбранного момента можно получить непосредственно из чистого образца и случайного шума. Поэтому при обучении не требуется проходить всю цепочку; разные её участки покрываются случайным выбором уровня зашумления.
  kind: choice
  options:
    - Выбирают случайный уровень зашумления, сразу получают соответствующее шумное изображение и учат модель предсказывать добавленный шум
    - Каждый раз последовательно проводят изображение через всю прямую и обратную цепочки
    - Подают только чистое изображение и учат модель генерировать случайный шум без указания уровня зашумления
  correct: 0
  id: 008-ddpm-elbo-2
