- concept: DDPM относится к моделям приближённой явной плотности благодаря оптимизации взвешенного ELBO
  question: Почему DDPM относят к моделям приближённой явной плотности, а не к моделям неявной плотности вроде GAN?
  explanation: 'Слово «приближённая» относится к целевой функции: вместо точного log p(x) оптимизируется его нижняя граница. Это принципиально отличается от GAN, где плотность вообще не моделируется в вычислимом виде.'
  kind: open
  reference: Обучение шумоподавителя DDPM соответствует оптимизации вычислимой взвешенной нижней границы правдоподобия — ELBO. Модель связана с вероятностным описанием данных, но оптимизирует границу, а не точное лог-правдоподобие. GAN, напротив, обучает генератор через дискриминатор без такой функции плотности.
  id: 008-ddpm-elbo-3
  fingerprint: 9992b58d
