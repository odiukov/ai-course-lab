- concept: одинаковая задержка сэмплирования не означает одинаковую вычислительную стоимость
  question: Сэмплер A выполняет 9 проходов по 14 мс и 60 GFLOPs, а сэмплер B — 6 проходов по 21 мс и 95 GFLOPs. Какое сравнение верно?
  explanation: 'Полная задержка одинакова: 9 × 14 = 126 мс и 6 × 21 = 126 мс. Но объём работы различается: A требует 540 GFLOPs, а B — 570 GFLOPs.'
  kind: choice
  options:
