- concept: структура данных на низкоразмерном многообразии заменяет перебор всех комбинаций признаков
  question: Объясни своими словами, почему предположение о низкоразмерном многообразии делает моделирование изображений реалистичнее, чем таблица вероятностей для всех комбинаций пикселей.
  explanation: Пиксели реальных объектов согласованы между собой, поэтому данные не заполняют всё пространство равномерно. Изучение этой структуры позволяет обобщать на новые изображения, тогда как полная таблица требует наблюдать и хранить практически недостижимое число комбинаций.
  kind: open
  reference: 'Осмысленные изображения занимают лишь структурированную часть полного пространства пикселей: значения пикселей зависят друг от друга. Модель может учить эти зависимости и описывать допустимые области пространства, не выделяя отдельную ячейку для каждого возможного изображения.'
