- concept: векторизация KDE образует матрицу вкладов «проверяемые точки × образцы»
  question: '`samples` имеет форму `(n,)`, а `points` — `(m,)`. Как интерпретировать результат выражения `points[:, None] - samples[None, :]` и по какому измерению затем усреднять ядра?'
  explanation: Каждая строка соответствует одной проверяемой точке, а каждый столбец — одному образцу. Усреднение строки по всем образцам оставляет отдельную оценку плотности для каждой точки сетки.
  kind: choice
  options:
    - Получается матрица `(m, n)`; усреднять нужно по измерению образцов `n`
    - Получается матрица `(n, m)`; усреднять нужно по измерению проверяемых точек `m`
    - Получается вектор `(m,)`; дополнительное усреднение не требуется
    - Получается матрица `(m, n)`; усреднять нужно по измерению проверяемых точек `m`
