- concept: GAN заменяет оптимизацию правдоподобия состязательным обучением на реальных и сгенерированных образцах
  question: Объясни своими словами, как генератор GAN может учиться воспроизводить распределение данных, не вычисляя p(x).
  explanation: GAN получает обучающий сигнал из состязания генератора и дискриминатора. Сравниваются реальные и сгенерированные образцы, а нормированная плотность данных при этом не вычисляется.
  kind: open
  reference: Генератор создаёт образцы, а дискриминатор учится отличать их от реальных данных. Градиент от дискриминатора показывает генератору, как делать образцы менее отличимыми от настоящих, поэтому обучение не требует явной формулы плотности.
  id: 017-taxonomy-map-2
