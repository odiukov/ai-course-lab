- concept: ожидаемый способ отказа нужно связывать с измеримой проверкой до полного запуска
  question: Команда выбрала генеративную модель, но опасается, что она будет создавать качественные, однако слишком однообразные результаты. Как лучше всего учесть этот риск в плане запуска?
  explanation: 'Способ отказа — это не обязательно сбой программы: модель может выдавать правдоподобный, но непригодный результат. Пилотная проверка с заранее заданным порогом позволяет обнаружить такой отказ до расходования полного бюджета.'
  kind: choice
  options:
    - Заранее определить метрику разнообразия, проверить пилотную выборку и установить порог остановки
    - Запустить весь объём и оценить разнообразие только после завершения
    - Следить лишь за отсутствием программных ошибок во время генерации
    - Считать высокий рейтинг модели достаточной гарантией разнообразия
