- concept: открытые и хостящиеся модели сравниваются с учётом контроля над данными и инфраструктурой
  question: Объясните своими словами, почему внешний хостящийся сервис может быть неприемлем даже при лучшем качестве генерации, и чем в такой ситуации полезна открытая модель.
  explanation: Кандидатов ранжируют не по качеству вообще, а по ограничениям конкретной задачи. Требование локальной обработки может исключить внешний сервис и сделать самостоятельно развёртываемую модель предпочтительной.
  kind: open
  reference: Если данные нельзя передавать внешнему провайдеру, хостящийся сервис нарушает жёсткое ограничение задачи независимо от качества. Открытую модель можно развернуть в контролируемой инфраструктуре и самостоятельно управлять данными, настройкой и вычислительным бюджетом, хотя это требует собственных ресурсов и сопровождения.
