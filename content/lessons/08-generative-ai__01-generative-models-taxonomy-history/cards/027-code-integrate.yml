- concept: рост численной оценки пропорционально числу разбиений указывает на пропущенный множитель ширины
  question: При увеличении числа частей оценка интеграла плотности растёт почти пропорционально числу частей, хотя должна стабилизироваться. Какая ошибка наиболее вероятна?
  explanation: При более мелком разбиении точек становится больше, но каждая должна получать меньший вес. Без множителя ширины программа складывает только высоты, поэтому сумма растёт вместе с числом частей.
  kind: choice
  options:
    - Сложены значения плотности без умножения на ширину частей
    - Вместо середин частей использованы их левые границы
    - Плотность вычисляется в формате с плавающей точкой
    - Интервал разделён на части одинаковой ширины
