- concept: GAN быстро генерирует образец единственным прямым проходом генератора
  question: Почему обученная GAN может выдавать новые изображения с низкой задержкой?
  explanation: После обучения достаточно выбрать латентный вектор z и вычислить G(z). Генерация не требует последовательного построения компонентов образца или многократного шумоподавления.
  kind: choice
  options:
    - Генератор сразу преобразует случайный латентный вектор в готовый образец
    - Дискриминатор последовательно вычисляет вероятность каждого пикселя
    - Генератор многократно удаляет шум из изображения
    - Модель интегрирует градиент логарифма плотности вдоль траектории
  correct: 0
  id: 009-gan-implicit-1
  fingerprint: c8368e8a
- concept: выход дискриминатора GAN не является нормированной плотностью данных
  question: Почему значение D(x), выданное дискриминатором GAN, нельзя считать вероятностью точки p(x)?
  explanation: D(x) — классификационная оценка, зависящая от текущих распределений настоящих и сгенерированных данных. Она не задаёт нормированную функцию p(x), поэтому GAN не предоставляет вычислимого правдоподобия произвольного наблюдения.
  kind: choice
  options:
    - Дискриминатор решает задачу различения обучающих и сгенерированных примеров, а его оценки не образуют нормированную плотность по x
    - Дискриминатор получает на вход только латентные векторы, но не наблюдения
    - Вероятность можно вычислить лишь после удаления дискриминатора
    - Случайность латентного вектора запрещает определять вероятности изображений
  correct: 0
  id: 009-gan-implicit-2
