- concept: схлопывание мод сохраняет правдоподобность отдельных образцов, но уменьшает разнообразие генерации
  question: Объясни своими словами, что происходит с распределением генератора при схлопывании мод в GAN.
  explanation: Качество отдельных изображений не гарантирует полноту выученного распределения. При схлопывании мод генератор находит ограниченное число успешных типов образцов и игнорирует другие области данных.
  kind: open
  reference: Генератор отображает множество разных латентных векторов в небольшой набор похожих образцов и покрывает лишь часть мод распределения данных. Отдельные результаты могут выглядеть реалистично, но разнообразие оказывается существенно меньше разнообразия настоящих данных.
  id: 009-gan-implicit-3
  fingerprint: b2da36ac
