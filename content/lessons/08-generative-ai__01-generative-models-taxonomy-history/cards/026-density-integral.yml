- concept: вероятность отдельного значения непрерывной случайной величины равна нулю
  question: Непрерывная случайная величина имеет положительную плотность в точке c. Чему равна вероятность события X = c?
  explanation: У отдельной точки нет ширины, поэтому площадь под плотностью над ней равна нулю. Положительная высота p(c) описывает локальную плотность, но не вероятность получить ровно c.
  kind: choice
  options:
    - Значению плотности p(c)
    - Площади под всей кривой плотности
    - Нулю
    - Её нельзя определить по плотности
