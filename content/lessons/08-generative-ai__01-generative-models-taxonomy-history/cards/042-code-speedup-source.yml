- concept: уменьшение одного множителя не считается ускорением, если полная задержка выросла
  question: Итеративный генератор выполнял 36 шагов по 12 мс, а после изменения выполняет 18 шагов по 30 мс. Каков корректный диагноз?
  explanation: Исходная задержка равна 36 × 12 = 432 мс, новая — 18 × 30 = 540 мс. Шагов стало меньше, но рост стоимости шага сделал генерацию медленнее, поэтому ускорения нет.
  kind: choice
  options:
    - fewer_steps
    - cheaper_step
    - both
    - no_speedup
  correct: 3
  id: 042-code-speedup-source-1
  fingerprint: b4c1de75
- concept: KV-кэш напрямую ускоряет авторегрессионный decode, но не повторные полнолатентные проходы диффузионной модели
  question: Почему KV-кэш нельзя напрямую перенести из авторегрессионной языковой модели в диффузионный генератор как источник такого же ускорения?
  explanation: KV-кэш полезен, когда новые элементы дописываются к неизменному префиксу. При диффузионном сэмплировании весь латент обновляется между итерациями, а стоимость определяется числом полных проходов и ценой каждого прохода.
  kind: open
  reference: В авторегрессионной модели KV-кэш сохраняет представления уже обработанного префикса и устраняет их повторное вычисление при последовательном decode. Диффузионная модель на каждой итерации заново обрабатывает изменившийся полный латент, поэтому LLM-подобного decode с неизменным префиксом у неё нет.
  id: 042-code-speedup-source-2
  fingerprint: '01193753'
