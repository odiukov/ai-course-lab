- concept: число итераций сэмплирования оценивает вычислительную задержку, но не качество генерации
  question: Сэмплер модели X последовательно вызывает нейросеть 36 раз, а модель Y создаёт результат единственным прямым проходом. Какой вывод можно сделать без дополнительных экспериментов?
  explanation: Последовательные вызовы сети увеличивают вычислительную стоимость и задержку. Однако их количество само по себе ничего не доказывает о качестве изображений или точности выполнения условий.
  kind: choice
  options:
    - При сопоставимой стоимости прохода инференс модели X, вероятно, медленнее
    - Модель Y точнее выполняет текстовые запросы
    - Модель X создаёт более качественные изображения
    - Модель Y обязательно обучалась без условий
  correct: 0
  id: 024-triage-operation-1
  fingerprint: 50d1a0df
- concept: условная генеративная модель описывает распределение данных при заданном управляющем сигнале
  question: Заполни пропуск в обозначении распределения текстово-обусловленной генеративной модели.
  explanation: Безусловная модель описывает p(x), а условная — p(x | c). Поэтому от текстово-обусловленной модели требуется не только реалистичность результата, но и его соответствие запросу c.
  kind: cloze
  template: Если x — изображение, а c — текстовый запрос, модель описывает распределение ___.
  answer: p(x | c)
  accept:
    - p(x|c)
    - p(x при c)
  id: 024-triage-operation-2
  fingerprint: 53d666b3
- concept: метрика генеративной модели должна проверять именно заявленное свойство результата
  question: Text-to-image модель показывает хороший FID, но часто меняет местами объекты, явно расположенные в запросе. Как оценить её обещание следовать таким запросам честнее?
  explanation: FID сравнивает статистики наборов изображений, но не проверяет точное соответствие каждого результата своему тексту. Следование пространственным и цветовым условиям нужно измерять отдельной целевой проверкой; визуальное качество также следует оценивать отдельно.
  kind: choice
  options:
    - Считать FID достаточным, поскольку он уже измеряет все аспекты генерации
    - Добавить проверку правильности заданных цветов и пространственных отношений
    - Оценивать только время генерации каждого изображения
    - Определить, является ли плотность модели явной или неявной
  correct: 1
  id: 024-triage-operation-3
  fingerprint: 9942df1a
