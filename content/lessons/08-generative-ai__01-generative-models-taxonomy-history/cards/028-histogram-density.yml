- concept: высота столбца гистограммы равна доле наблюдений в корзине, делённой на её ширину
  question: В выборке из 800 наблюдений одна корзина гистограммы шириной 0.25 содержит 32 наблюдения. Чему равна оценка плотности внутри этой корзины?
  explanation: Высота равна n_j/(NΔ_j). Поэтому 32/(800·0.25) = 0.16. Деление на ширину обеспечивает площадь столбца 32/800 и нормировку всей гистограммы.
  kind: numeric
  answer: 0.16
  tolerance: 0.001
  id: 028-histogram-density-1
  fingerprint: 9c3329df
- concept: ширина корзин задаёт компромисс между разрешением гистограммы и чувствительностью к шуму выборки
  question: Что обычно произойдёт, если при неизменной конечной выборке сделать корзины гистограммы существенно уже?
  explanation: Узкие корзины лучше разрешают локальную структуру, но в каждую попадает меньше наблюдений, поэтому относительные колебания счётчиков усиливаются. Внутри корзины оценка всё равно остаётся постоянной, а при правильной нормировке общая площадь равна единице.
  kind: choice
  options:
    - Оценка станет более детальной, но в ней может появиться больше случайных провалов и пиков
    - Оценка обязательно станет гладкой и приблизится к гауссовой плотности
    - Плотность внутри каждой корзины начнёт непрерывно изменяться
    - Суммарная площадь столбцов обязательно станет больше единицы
