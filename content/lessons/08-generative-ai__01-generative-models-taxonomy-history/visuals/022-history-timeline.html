<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Три эпохи развития генеративных моделей</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f9fc;
    --panel: #ffffff;
    --ink: #172033;
    --muted: #59647a;
    --axis: #34425f;
    --grid: #bac5d8;
    --zone-a: #e4efff;
    --zone-b: #eee8ff;
    --zone-c: #fff0dc;
    --zone-a-line: #5c87ca;
    --zone-b-line: #8269c6;
    --zone-c-line: #c47b35;
    --accent: #dd5538;
    --accent-soft: #fff0eb;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: unset;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
  }

  .figure {
    width: 100%;
    max-width: 1200px;
    margin: auto;
    padding: 16px;
    background: var(--panel);
    border: 1px solid var(--grid);
  }

  h2 {
    margin: unset;
    padding-bottom: 12px;
    font-size: 22px;
    text-align: center;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 460px;
    background: var(--panel);
  }

  text {
    fill: var(--ink);
    font-family: inherit;
  }

  .era-date {
    font-size: 15px;
    font-weight: bold;
    fill: var(--muted);
  }

  .era-title {
    font-size: 19px;
    font-weight: bold;
  }

  .era-question {
    font-size: 14px;
    fill: var(--muted);
  }

  .year {
    font-size: 14px;
    font-weight: bold;
    fill: var(--muted);
  }

  .models {
    font-size: 14px;
    fill: var(--muted);
  }

  .passes-main {
    font-size: 17px;
    font-weight: bold;
  }

  .passes-note {
    font-size: 14px;
    fill: var(--muted);
  }

  .axis-line,
  .tick,
  .boundary,
  .leader {
    fill: none;
    stroke: var(--axis);
    stroke-width: 2px;
    vector-effect: non-scaling-stroke;
  }

  .boundary,
  .leader {
    stroke: var(--grid);
    stroke-width: 1px;
  }

  .speed-path {
    fill: none;
    stroke: var(--accent);
    stroke-width: 4px;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
  }

  .axis-head {
    fill: var(--axis);
  }

  .speed-head,
  .speed-point {
    fill: var(--accent);
  }

  .fallback {
    padding: 18px;
    font-size: 16px;
    color: var(--ink);
    background: var(--accent-soft);
    border: 1px solid var(--accent);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #10141d;
      --panel: #171d28;
      --ink: #edf2ff;
      --muted: #b3bdd1;
      --axis: #d6deef;
      --grid: #465168;
      --zone-a: #203653;
      --zone-b: #372d55;
      --zone-c: #4d3521;
      --zone-a-line: #80aef0;
      --zone-b-line: #ae96ee;
      --zone-c-line: #e2a05f;
      --accent: #ff8065;
      --accent-soft: #42251f;
    }
  }
</style>
</head>
<body>
<figure class="figure" aria-labelledby="diagram-heading">
  <h2 id="diagram-heading">Три эпохи развития генеративных моделей</h2>
  <svg id="diagram"
       viewBox="0 0 1200 460"
       width="1200"
       height="460"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="svg-title svg-desc">
    <title id="svg-title">Временная шкала развития генеративных моделей с 2013 по 2026 год</title>
    <desc id="svg-desc">Три зоны показывают смену главного ограничения: устойчивое обучение, качество и управление, затем скорость. Число проходов сети уменьшается примерно с тысячи у DDPM до одного.</desc>
  </svg>
  <div id="fallback" class="fallback" hidden></div>
</figure>

<script>
(() => {
  "use strict";

  const DATA = Object.freeze({
    canvas: { width: 1200, height: 460 },
    style: {
      labelPadding: 12,
      thinLine: 1,
      normalLine: 2,
      strongLine: 4,
      smallFont: 14,
      normalFont: 17,
      titleFont: 19
    },
    eras: [
      {
        x1: -0.38, x2: 7.5, y1: 34, y2: 164,
        center: 3.56, dateY: 65, titleY: 101, questionY: 134,
        date: "2013–2020",
        title: "Устойчивое обучение",
        question: "Можно ли вообще обучить модель?",
        className: "zone-a"
      },
      {
        x1: 7.5, x2: 10.5, y1: 34, y2: 164,
        center: 9, dateY: 65, titleY: 101, questionY: 134,
        date: "2021–2023",
        title: "Качество и управление",
        question: "Текст · композиция · адаптация",
        className: "zone-b"
      },
      {
        x1: 10.5, x2: 13.38, y1: 34, y2: 164,
        center: 11.94, dateY: 65, titleY: 101, questionY: 134,
        date: "с 2024",
        title: "Скорость",
        question: "Главная цена — ожидание",
        className: "zone-c"
      }
    ],
    boundaries: [
      { x: 7.5, y1: 164, y2: 218 },
      { x: 10.5, y1: 164, y2: 218 }
    ],
    axis: {
      x1: -0.18, x2: 13.28, y: 218,
      head: [
        { x: 13.42, y: 218 },
        { x: 13.18, y: 211 },
        { x: 13.18, y: 225 }
      ]
    },
    tick: { y1: 210, y2: 226, labelY: 252 },
    years: [
      { x: 0, label: "2013" },
      { x: 1, label: "2014" },
      { x: 2, label: "2015" },
      { x: 3, label: "2016" },
      { x: 4, label: "2017" },
      { x: 5, label: "2018" },
      { x: 6, label: "2019" },
      { x: 7, label: "2020" },
      { x: 8, label: "2021" },
      { x: 9, label: "2022" },
      { x: 10, label: "2023" },
      { x: 11, label: "2024" },
      { x: 12, label: "2025" },
      { x: 13, label: "2026" }
    ],
    modelRows: [
      {
        x: 0, y: 289, anchor: "start",
        text: "VAE · GAN · авторегрессия · потоки · DDPM"
      },
      {
        x: 9, y: 289, anchor: "middle",
        text: "текст · ControlNet · LoRA"
      },
      {
        x: 13, y: 289, anchor: "end",
        text: "видео · flow matching"
      }
    ],
    passCurve: {
      points: [
        { x: 7, y: 352 },
        { x: 8.55, y: 350 },
        { x: 10.8, y: 386 },
        { x: 13, y: 407 }
      ],
      startRadius: 0.08,
      head: [
        { x: 13, y: 407 },
        { x: 12.76, y: 394 },
        { x: 12.69, y: 413 }
      ]
    },
    passLabels: [
      {
        x: 6.86, y: 319, anchor: "end",
        text: "DDPM, 2020", className: "passes-note"
      },
      {
        x: 6.86, y: 340, anchor: "end",
        text: "≈1000 проходов сети", className: "passes-main"
      },
      {
        x: 9.62, y: 332, anchor: "middle",
        text: "Число проходов уменьшается", className: "passes-main"
      },
      {
        x: 13, y: 438, anchor: "end",
        text: "2026 · 1 проход", className: "passes-main"
      }
    ]
  });

  const origin = Object.freeze({ x: 90, y: 18 });
  const scale = Object.freeze({ x: 78, y: 1 });

  const sx = x => origin.x + x * scale.x;
  const sy = y => origin.y + y * scale.y;

  const svg = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");
  const NS = "http://www.w3.org/2000/svg";

  const make = (name, attributes, content) => {
    const node = document.createElementNS(NS, name);
    Object.entries(attributes).forEach(([key, value]) => {
      node.setAttribute(key, String(value));
    });
    if (content !== undefined) node.textContent = content;
    return node;
  };

  const addLine = (parent, item, className) => {
    parent.appendChild(make("line", {
      x1: sx(item.x1),
      y1: sy(item.y1),
      x2: sx(item.x2),
      y2: sy(item.y2),
      class: className
    }));
  };

  const addText = (parent, item, className) => {
    parent.appendChild(make("text", {
      x: sx(item.x),
      y: sy(item.y),
      "text-anchor": item.anchor,
      class: className
    }, item.text));
  };

  const pointsValue = points => points
    .map(point => `${sx(point.x)},${sy(point.y)}`)
    .join(" ");

  try {
    const eraGroup = make("g", { "aria-label": "Три эпохи" });

    DATA.eras.forEach(era => {
      eraGroup.appendChild(make("rect", {
        x: sx(era.x1),
        y: sy(era.y1),
        width: sx(era.x2) - sx(era.x1),
        height: sy(era.y2) - sy(era.y1),
        fill: `var(--${era.className})`,
        stroke: `var(--${era.className}-line)`,
        "stroke-width": DATA.style.thinLine,
        "vector-effect": "non-scaling-stroke"
      }));

      addText(eraGroup, {
        x: era.center,
        y: era.dateY,
        anchor: "middle",
        text: era.date
      }, "era-date");

      addText(eraGroup, {
        x: era.center,
        y: era.titleY,
        anchor: "middle",
        text: era.title
      }, "era-title");

      addText(eraGroup, {
        x: era.center,
        y: era.questionY,
        anchor: "middle",
        text: era.question
      }, "era-question");
    });

    svg.appendChild(eraGroup);

    const timelineGroup = make("g", {
      "aria-label": "Временная шкала с 2013 по 2026 год"
    });

    DATA.boundaries.forEach(boundary => {
      addLine(timelineGroup, {
        x1: boundary.x,
        y1: boundary.y1,
        x2: boundary.x,
        y2: boundary.y2
      }, "boundary");
    });

    addLine(timelineGroup, {
      x1: DATA.axis.x1,
      y1: DATA.axis.y,
      x2: DATA.axis.x2,
      y2: DATA.axis.y
    }, "axis-line");

    timelineGroup.appendChild(make("polygon", {
      points: pointsValue(DATA.axis.head),
      class: "axis-head"
    }));

    DATA.years.forEach(year => {
      addLine(timelineGroup, {
        x1: year.x,
        y1: DATA.tick.y1,
        x2: year.x,
        y2: DATA.tick.y2
      }, "tick");

      addText(timelineGroup, {
        x: year.x,
        y: DATA.tick.labelY,
        anchor: "middle",
        text: year.label
      }, "year");
    });

    DATA.modelRows.forEach(row => {
      addText(timelineGroup, row, "models");
    });

    svg.appendChild(timelineGroup);

    const speedGroup = make("g", {
      "aria-label": "Сокращение числа проходов сети примерно с тысячи до одного"
    });

    const [start, controlA, controlB, end] = DATA.passCurve.points;
    const curvePath = [
      `M ${sx(start.x)} ${sy(start.y)}`,
      `C ${sx(controlA.x)} ${sy(controlA.y)}`,
      `${sx(controlB.x)} ${sy(controlB.y)}`,
      `${sx(end.x)} ${sy(end.y)}`
    ].join(" ");

    speedGroup.appendChild(make("path", {
      d: curvePath,
      class: "speed-path"
    }));

    speedGroup.appendChild(make("circle", {
      cx: sx(start.x),
      cy: sy(start.y),
      r: Math.abs(sx(DATA.passCurve.startRadius) - sx(0)),
      class: "speed-point"
    }));

    speedGroup.appendChild(make("polygon", {
      points: pointsValue(DATA.passCurve.head),
      class: "speed-head"
    }));

    DATA.passLabels.forEach(item => {
      addText(speedGroup, item, item.className);
    });

    svg.appendChild(speedGroup);
  } catch (error) {
    svg.hidden = true;
    fallback.hidden = false;
    fallback.textContent =
      "Схема должна была показать временную шкалу 2013–2026: устойчивое обучение до 2020 года, качество и управление в 2021–2023 годах, скорость с 2024 года и сокращение числа проходов DDPM примерно с 1000 до 1.";
  }
})();
</script>
</body>
</html>
