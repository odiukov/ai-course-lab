- concept: совпадающие знаки отклонений признака и цели дают положительный вклад в числитель формулы наклона
  question: Объясни своими словами, почему точки, у которых признак и целевая переменная одновременно выше своих средних или одновременно ниже них, увеличивают оценку наклона.
  explanation: Произведение двух положительных или двух отрицательных отклонений положительно. Чем больше сумма таких произведений относительно разброса признака, тем больше положительный наклон.
  kind: open
  reference: Отклонения признака и цели имеют одинаковые знаки, поэтому их произведение положительно. Такие произведения увеличивают числитель формулы для w и поддерживают положительный наклон.
