- concept: наклон прямой равен отношению суммы произведений центрированных отклонений к сумме квадратов отклонений признака
  question: Для наблюдений X = [6, 8, 10] и y = [65, 83, 101] вычисли наклон w по формуле с центрированными отклонениями.
  explanation: Средние равны 8 и 83. Сумма произведений центрированных отклонений равна 72, а сумма квадратов отклонений X — 8. Поэтому w = 72 / 8 = 9.
  kind: numeric
  answer: 9
  tolerance: 0.01
  id: 024-formula-dlya-odnogo-priznaka-1
  fingerprint: da56d0e4
- concept: прямая линейной регрессии со смещением проходит через точку средних значений признака и цели
  question: Через какую точку обязательно проходит прямая, если смещение рассчитано как b = y_mean - w * x_mean?
  explanation: При x = x_mean прогноз равен w * x_mean + b = y_mean. Следовательно, точка (x_mean, y_mean) лежит на прямой.
  kind: choice
  options:
    - Через точку (x_mean, y_mean)
    - Через начало координат
    - Через наблюдение с максимальным значением признака
