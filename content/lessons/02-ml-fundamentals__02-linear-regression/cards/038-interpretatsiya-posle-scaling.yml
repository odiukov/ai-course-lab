- concept: модули весов полностью стандартизованной модели позволяют сравнивать условную чувствительность прогноза к признакам
  question: В линейной модели стандартизованы и признаки, и цель. Для двух признаков выполняется |w_A| > |w_B|. Какой вывод обоснован?
  explanation: Стандартизация приводит признаки к общей шкале, поэтому условную чувствительность прогноза можно сравнивать по модулям весов. Причинность и устойчивость весов из этого не следуют.
  kind: choice
  options:
    - Признак A обязательно является причиной изменения цели
    - Одинаковый сдвиг каждого признака в его стандартных отклонениях сильнее изменяет прогноз для A при неизменных остальных признаках
    - Признак A имеет больший разброс в исходных единицах
    - Удаление признака B гарантированно не изменит вес признака A
