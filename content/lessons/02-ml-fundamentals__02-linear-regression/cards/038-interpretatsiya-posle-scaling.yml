- concept: коррелированные признаки могут делить объясняемый вклад и делать отдельные веса нестабильными
  question: Два стандартизованных признака сильно коррелируют. После обучения на другой похожей выборке их веса заметно изменились, хотя качество и прогнозы модели почти не изменились. Как это объяснить?
  explanation: Связанные признаки несут частично дублирующую информацию. Регрессия может перераспределять вклад между их коэффициентами, поэтому отдельный вес не следует считать устойчивой оценкой причинного эффекта.
  kind: choice
  options:
    - Это обязательно означает ошибку в градиентном спуске
    - Модель может по-разному распределять общий вклад между связанными признаками
    - Стандартизация должна полностью устранять корреляцию признаков
    - Такое возможно только при нестандартизованной цели
