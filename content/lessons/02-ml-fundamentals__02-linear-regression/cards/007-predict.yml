- concept: predict должен возвращать предсказания, чтобы другие методы модели могли использовать их
  question: Почему метод predict должен возвращать список через return, а не только выводить его через print?
  explanation: Print лишь показывает значение на экране. Return передаёт список вызывающему коду, поэтому compute_cost и compute_gradients могут получить предсказания и продолжить вычисления.
  kind: choice
  options:
    - Возвращённый список можно получить и использовать в вычислении стоимости и градиентов
    - Print автоматически сохраняет предсказания в параметрах модели
    - Return изменяет входные данные и тем самым ускоряет обучение
    - Print обучает параметры модели на выведенных значениях
