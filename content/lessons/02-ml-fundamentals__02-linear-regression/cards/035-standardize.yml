- concept: новые объекты стандартизуют статистиками обучающей выборки
  question: Модель обучили на стандартизованных признаках. Как подготовить новый объект перед передачей в модель?
  explanation: 'Новый объект нужно преобразовать по той же шкале, на которой обучалась модель. Поэтому standardize возвращает x_means и x_stds: их сохраняют и применяют ко всем будущим объектам.'
  kind: choice
  options:
    - Вычислить среднее и стандартное отклонение отдельно по значениям нового объекта
    - Использовать средние и стандартные отклонения, сохранённые при подготовке обучающей выборки
    - Повторно вычислить статистики по объединению обучающей выборки и новых объектов
  correct: 1
  id: 035-standardize-1
  fingerprint: a27de55d
- concept: постоянный признак безопасно преобразуется в нулевые значения
  question: Во всех строках таблицы один из признаков имеет одинаковое значение. Как должна поступить функция стандартизации с этим столбцом?
  explanation: У постоянного столбца дисперсия и стандартное отклонение равны 0. Деление невозможно, поэтому реализация записывает для такого признака 0 в каждой строке.
  kind: choice
  options:
    - Оставить исходные значения без изменений
    - Разделить центрированные значения на среднее столбца
    - Записать в столбец нулевые стандартизованные значения
    - Скопировать стандартное отклонение соседнего столбца
  correct: 2
  id: 035-standardize-2
  fingerprint: 65a3eb2d
