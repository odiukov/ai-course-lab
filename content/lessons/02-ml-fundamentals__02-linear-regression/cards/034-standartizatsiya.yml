- concept: каждый признак стандартизуется с использованием собственных статистик
  question: Как правильно стандартизовать столбцы площади, возраста здания и расстояния до центра?
  explanation: У признаков разные распределения и единицы измерения, поэтому у каждого должны быть собственные μ и σ. После такого преобразования их значения становятся сопоставимы по положению относительно своего среднего.
  kind: choice
  options:
    - Использовать для всех столбцов общие среднее и стандартное отклонение
    - Для каждого столбца отдельно вычислить его среднее и стандартное отклонение
    - Использовать среднее и стандартное отклонение целевой переменной
    - Стандартизовать только столбец с самыми крупными исходными значениями
  correct: 1
