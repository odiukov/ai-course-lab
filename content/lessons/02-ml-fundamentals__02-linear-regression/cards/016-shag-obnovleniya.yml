- concept: после обновления параметров градиентный спуск заново вычисляет предсказания, ошибку и градиенты
  question: Расположите действия одной итерации обучения линейной регрессии градиентным спуском в правильном порядке.
  explanation: Градиенты относятся к ошибке текущей модели. После изменения параметров модель уже другая, поэтому для следующего обновления необходимо заново получить предсказания, MSE и производные.
  kind: order
  items:
    - Вычислить предсказания с текущими параметрами
    - Вычислить MSE по предсказаниям и целевым значениям
    - Вычислить производные MSE по параметрам
    - Обновить параметры с учётом learning rate
    - Если критерий остановки не выполнен, снова вычислить предсказания с обновлёнными параметрами
  id: 016-shag-obnovleniya-2
