- concept: alpha влияет на обучение параметров, но не входит в формулу предсказания при фиксированных весах
  question: Модель Ridge уже обучена, а её веса и свободный член зафиксированы. Как alpha участвует в вычислении нового предсказания?
  explanation: 'Alpha используется во время обучения: она масштабирует штраф и его вклад в градиенты весов. После фиксации параметров формула предсказания Ridge совпадает с формулой обычной линейной модели.'
