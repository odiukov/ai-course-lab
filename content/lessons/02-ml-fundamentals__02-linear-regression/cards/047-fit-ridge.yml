- concept: снижение MSE не гарантирует снижения целевой функции Ridge
  question: За эпоху MSE уменьшился на Δ, а штрафной член вырос на величину, большую Δ. Что произошло с cost?
  explanation: Cost складывается из MSE и штрафного члена. Рост штрафа оказался больше снижения MSE, поэтому общая целевая функция увеличилась, хотя совпадение с обучающими данными улучшилось.
  kind: choice
  options:
    - Cost обязательно уменьшился
    - Cost увеличился
    - Cost не изменился
  correct: 1
  id: 047-fit-ridge-1
  fingerprint: 319327ad
- concept: все слагаемые целевой функции должны вычисляться для одного состояния параметров
  question: В реализации Ridge MSE вычислили до обновления весов, а штрафной член — после обновления. Почему их сумму нельзя считать корректным значением cost?
  explanation: Значение целевой функции характеризует конкретный набор параметров. Если её части рассчитаны для разных весов, журнал обучения смешивает два состояния модели и становится некорректным.
  kind: open
  reference: Слагаемые относятся к разным наборам весов, поэтому сумма не является значением целевой функции ни до обновления, ни после него. MSE и штраф нужно вычислять для одного и того же состояния модели.
  id: 047-fit-ridge-2
  fingerprint: 7bbd35f3
