- concept: модель большей степени сохраняет возможность представлять полиномы меньших степеней
  question: Может ли полиномиальная модель степени 8 в точности воспроизвести любой полином степени 6? Объясни почему.
  explanation: Повышение степени добавляет доступные члены, но не обязывает модель их использовать. Поэтому множество форм модели степени 6 целиком входит в множество форм модели степени 8.
  kind: open
  reference: Да. Модель степени 8 содержит все члены полинома степени 6, а коэффициенты при x^7 и x^8 можно выбрать так, чтобы эти члены не вносили вклад в прогноз.
