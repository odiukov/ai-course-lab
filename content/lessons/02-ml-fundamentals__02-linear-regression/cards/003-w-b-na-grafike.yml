- concept: изменение предсказания при изменении входа определяется наклоном w, а свободный член сокращается
  question: Для модели ŷ = wx + b вход изменился на Δx, а параметры остались прежними. Заполните формулу изменения предсказания.
  explanation: После подстановки получаем w(x + Δx) + b − (wx + b) = wΔx. Свободный член b сокращается, поэтому разность предсказаний зависит только от наклона w.
  kind: cloze
  template: ŷ(x + Δx) − ŷ(x) = ___
  answer: wΔx
  accept:
    - w * Δx
    - w·Δx
    - Δx·w
  id: 003-w-b-na-grafike-1
  fingerprint: d0aa35b6
- concept: изменение только свободного члена b сдвигает прямую вертикально без изменения наклона
  question: Модель изменилась с ŷ = −3x + 7 на ŷ = −3x + 11. Что произошло с её графиком?
  explanation: 'Коэффициент при x остался равен −3, поэтому наклон не изменился. Свободный член вырос с 7 до 11: каждое предсказание увеличилось на 4, и прямая сдвинулась вверх параллельно самой себе.'
  kind: choice
  options:
    - Прямая повернулась и стала круче
    - Прямая опустилась на 4 единицы
    - Прямая поднялась на 4 единицы, сохранив наклон
  correct: 2
  id: 003-w-b-na-grafike-2
  fingerprint: c2471f9b
