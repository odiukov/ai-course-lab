- concept: предсказание линейной модели вычисляется подстановкой входа в формулу с заданными параметрами
  question: Линейная модель имеет параметры w = 25 и b = 40. Какое предсказание она выдаст для x = 14?
  explanation: Предсказание вычисляется по формуле ŷ = wx + b. Поэтому ŷ = 25 × 14 + 40 = 390.
  kind: numeric
  answer: 390
  tolerance: 0.001
  id: 006-predskazanie-1
  fingerprint: 7fa5abe6
- concept: предсказание модели и настоящее значение целевой переменной могут различаться
  question: Объясни своими словами, чем предсказание ŷ линейной модели отличается от настоящего значения y.
  explanation: Модель вычисляет ŷ по выбранной прямой, а y берётся из реального наблюдения. Их различие показывает ошибку предсказания.
  kind: open
  reference: Предсказание ŷ — это результат вычисления по формуле модели с текущими параметрами. Настоящее y — фактически наблюдаемое значение; оно не обязано совпадать с предсказанием.
  id: 006-predskazanie-2
  fingerprint: 300c949a
