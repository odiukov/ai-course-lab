- concept: штраф ridge-регрессии равен lambda, умноженной на сумму квадратов весов
  question: В линейной модели веса равны 4 и −6, а lambda равна 0.25. Какой вклад штрафа за веса добавляется к MSE?
  explanation: Штраф равен 0.25 × (4² + (−6)²) = 0.25 × (16 + 36) = 13. Эта величина прибавляется к MSE.
  kind: numeric
  answer: 13
  tolerance: 0.001
  id: 044-zachem-ridge-1
  fingerprint: c5fc882c
- concept: lambda управляет компромиссом между качеством подгонки и величиной весов
  question: Что обычно происходит при увеличении lambda в ridge-регрессии?
  explanation: Чем больше lambda, тем сильнее функция стоимости наказывает большие веса. Поэтому обучение чаще выбирает меньшие по модулю коэффициенты, даже если ради этого приходится немного ухудшить подгонку обучающих данных.
  kind: choice
  options:
    - Регуляризация усиливается, и оптимальные веса обычно становятся меньше по модулю
    - Регуляризация ослабевает, и веса обязательно увеличиваются
    - Штраф за веса перестаёт влиять на функцию стоимости
    - Слагаемое MSE исключается из функции стоимости
