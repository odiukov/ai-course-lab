- concept: R² интерпретируется как доля разброса целевой переменной, объяснённая моделью
  question: Модель получила R² = 0.73. Как лучше всего интерпретировать этот результат?
  explanation: R² оценивает долю исходного разброса цели, которую объясняют предсказания модели. Он не задаёт долю ошибочных наблюдений или размер ошибки в единицах цели.
  kind: choice
  options:
    - Модель объясняет примерно 73% разброса целевой переменной
    - Предсказания модели ошибочны ровно в 73% наблюдений
    - Средняя абсолютная ошибка равна 0.73 единицы цели
    - Каждое предсказание отличается от ответа не более чем на 73%
  correct: 0
  id: 028-r-squared-1
  fingerprint: eb17ca6f
- concept: R² не меняется при одинаковом масштабировании настоящих значений и предсказаний
  question: Настоящие значения и предсказания перевели из метров в сантиметры. Объясни, почему R² сохранился, хотя MSE изменился.
  explanation: В формуле R² масштаб сокращается между SS_res и SS_tot. В MSE такого деления на разброс цели нет, поэтому её значение зависит от единиц измерения.
  kind: open
  reference: При одинаковом масштабировании целей и предсказаний все невязки и отклонения от среднего умножаются на один коэффициент. Обе суммы квадратов умножаются на квадрат этого коэффициента, поэтому их отношение и R² не меняются. MSE содержит только квадраты невязок, поэтому меняется вместе с масштабом.
  id: 028-r-squared-2
  fingerprint: 3dc41ead
