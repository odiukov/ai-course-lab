- concept: random_state делает случайное разделение данных воспроизводимым
  question: Заполни пропуск, чтобы при повторных запусках объекты попадали в те же обучающую и тестовую части.
  explanation: Фиксированный random_state задаёт воспроизводимую последовательность случайных действий. Он не отменяет перемешивание, а позволяет повторить то же разделение и корректно сравнивать эксперименты.
  kind: cloze
