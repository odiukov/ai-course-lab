- concept: конвейер оценки регрессии разделяет подготовку данных, обучение, прогнозирование и проверку
  question: Расположи действия корректного конвейера регрессии в scikit-learn по порядку.
  explanation: Разделение выполняют до обучения. fit подбирает параметры по обучающей части, predict применяет модель к тестовым признакам, а метрики сопоставляют прогнозы с y_test.
  kind: order
  items:
    - Разделить признаки и ответы на обучающую и тестовую части
    - Вызвать fit на обучающих признаках и ответах
    - Вызвать predict для тестовых признаков
    - Сравнить полученные прогнозы с тестовыми ответами с помощью метрик
  id: 051-sklearn-workflow-3
  fingerprint: 976c4c39
