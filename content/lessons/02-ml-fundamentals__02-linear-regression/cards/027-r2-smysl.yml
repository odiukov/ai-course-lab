- concept: R² вычисляется сравнением суммы квадратов ошибок модели с суммой квадратов отклонений целей от среднего
  question: Сумма квадратов ошибок модели равна 21, а сумма квадратов отклонений настоящих значений от их среднего — 28. Чему равен R²?
  explanation: R² = 1 − SS_res / SS_tot = 1 − 21 / 28 = 0,25. Модель объясняет четверть разброса целевой величины по сравнению с постоянным предсказанием среднего.
  kind: numeric
  answer: 0.25
  tolerance: 0.001
  id: 027-r2-smysl-1
  fingerprint: bc495c18
- concept: отрицательный R² означает, что модель уступает постоянному предсказанию среднего
  question: На тестовой выборке сумма квадратов ошибок модели больше суммы квадратов отклонений настоящих значений от их среднего. Что можно заключить о R²?
  explanation: Если SS_res больше SS_tot, их отношение превышает единицу, поэтому R² = 1 − SS_res / SS_tot становится отрицательным. В такой ситуации предсказание среднего даёт меньшую сумму квадратов ошибок.
  kind: choice
  options:
    - 'R² отрицателен: модель хуже постоянного предсказания среднего'
    - 'R² положителен: модель лучше постоянного предсказания среднего'
    - R² обязательно равен MSE
    - R² нельзя вычислить без значений признаков
  correct: 0
  id: 027-r2-smysl-2
  fingerprint: 2a04f121
