- concept: прямая предсказаний и поверхность стоимости описывают разные объекты
  question: Объясни своими словами, чем график прямой линейной регрессии отличается от поверхности MSE по параметрам w и b.
  explanation: На графике данных фиксированная пара w и b задаёт одну прямую. На поверхности стоимости параметры сами служат координатами, поэтому одна её точка представляет целую прямую и качество её предсказаний.
  kind: open
  reference: 'Прямая показывает предсказания одной модели в пространстве входов и целевых значений. Поверхность MSE сравнивает множество моделей: каждой паре параметров w и b соответствует точка, высота которой показывает ошибку этой модели.'
  id: 011-poverhnost-mse-2
  fingerprint: 7ee0c919
