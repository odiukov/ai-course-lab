- concept: полиномиальная регрессия остаётся линейной по обучаемым весам
  question: Объясни своими словами, почему модель с исходным признаком, его квадратом и кубом всё ещё считается линейной регрессией.
  explanation: Название «линейная» относится к зависимости предсказания от весов. Квадрат и куб x вычисляются заранее, поэтому для обучения это обычные отдельные признаки с линейно входящими коэффициентами.
  kind: open
  reference: 'Модель линейна по обучаемым параметрам: каждый заранее вычисленный признак умножается на свой вес, после чего вклады складываются со смещением. Нелинейны признаки относительно x, а не способ вхождения весов в формулу.'
