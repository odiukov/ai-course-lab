- concept: стандартизация центрирует признак и делит его на стандартное отклонение
  question: Заполни формулу стандартизации значения признака x, где μ — среднее, а σ — стандартное отклонение.
  explanation: Из каждого значения вычитают среднее признака, а результат делят на его стандартное отклонение. После такой обработки масштабы признаков становятся сопоставимее, что облегчает градиентный спуск.
  kind: cloze
  template: x_standardized = ___
  answer: (x - μ) / σ
  accept:
    - (x-μ)/σ
    - (x - mean) / std
  id: 033-raznye-masshtaby-2
  fingerprint: 9ab51773
