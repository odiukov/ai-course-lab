- concept: на конечной зашумлённой выборке оценки параметров могут быть близки к истинным, но не обязаны совпадать с ними точно
  question: Почему корректно обученная линейная регрессия может не восстановить в точности параметры, которыми были сгенерированы данные?
  explanation: Алгоритм подгоняет прямую под конкретные зашумлённые наблюдения. Случайные отклонения не обязаны взаимно погаситься, поэтому небольшая разница между истинными и найденными параметрами ожидаема.
  kind: open
  reference: Случайный шум и конечный размер выборки смещают наблюдаемые точки, поэтому оптимальная для конкретной выборки прямая может немного отличаться от исходной. Близость оценок к истинным параметрам свидетельствует о восстановлении закономерности, а точное совпадение не обязательно.
