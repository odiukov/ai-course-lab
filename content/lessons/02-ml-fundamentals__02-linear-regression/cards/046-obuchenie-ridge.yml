- concept: L2-регуляризация добавляет к градиенту веса слагаемое 2αw_j
  question: В Ridge-регрессии α = 0,7, а текущий вес w_j = −8. Какое слагаемое L2-регуляризация добавляет к градиенту этого веса?
  explanation: Добавка равна 2αw_j = 2 · 0,7 · (−8) = −11,2. При обновлении w_j ← w_j − η·grad отрицательная добавка увеличивает вес, то есть сдвигает его от −8 к нулю.
  kind: numeric
  answer: -11.2
  tolerance: 0.001
  id: 046-obuchenie-ridge-1
  fingerprint: 7c28a639
- concept: свободный член не регуляризуется и не получает добавку от L2-штрафа
  question: В реализации Ridge стоимость равна MSE + αΣw_j², причём свободный член b в сумму не включён. Как регуляризация изменяет градиент по b?
  explanation: Поскольку b отсутствует в штрафе αΣw_j², производная штрафа по b равна нулю. Поэтому Ridge добавляет 2αw_j только к градиентам весов, а градиент смещения остаётся таким же, как у обычной линейной регрессии.
  kind: choice
  options:
    - Добавляет к нему 2αb
    - Добавляет к нему αb²
    - 'Не изменяет его: градиент по b определяется только MSE'
    - Всегда делает градиент по b равным нулю
  correct: 2
  id: 046-obuchenie-ridge-2
  fingerprint: cda2884f
- concept: градиент L2-штрафа направляет вес к нулю независимо от его знака
  question: Объясни своими словами, почему добавка 2αw_j к градиенту Ridge-регрессии уменьшает модуль как положительного, так и отрицательного веса при α > 0.
  explanation: Обновление выполняется против градиента. Знак 2αw_j совпадает со знаком веса, поэтому шаг −η·2αw_j всегда направлен противоположно весу и сокращает его модуль при достаточно малом η.
  kind: open
  reference: При положительном весе добавка к градиенту положительна, поэтому вычитание градиента уменьшает вес. При отрицательном весе добавка отрицательна, поэтому её вычитание увеличивает вес. В обоих случаях вес приближается к нулю.
  id: 046-obuchenie-ridge-3
  fingerprint: 82ef45f8
