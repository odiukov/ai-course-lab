- concept: с несколькими признаками линейная модель задаёт гиперплоскость
  question: Объясни своими словами, какой геометрический объект задаёт линейная регрессия с несколькими признаками и чем он отличается от случая с одним признаком.
  explanation: 'Переход к нескольким признакам не делает зависимость нелинейной: сумма взвешенных признаков по-прежнему задаёт плоский объект. В многомерном пространстве его называют гиперплоскостью.'
  kind: open
  reference: С одним признаком график предсказаний является прямой. При добавлении нескольких признаков то же линейное правило задаёт многомерную плоскую поверхность — гиперплоскость.
  id: 031-mnogo-priznakov-2
