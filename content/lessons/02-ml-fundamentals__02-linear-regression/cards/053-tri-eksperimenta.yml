- concept: недостаточная степень полинома проявляется плохим качеством и на обучающей, и на тестовой выборке
  question: Степень полиномиальной модели слишком мала, чтобы передать форму зависимости в данных. Какое сочетание результатов наиболее характерно для такой модели?
  explanation: Недостаточно гибкая модель не может описать закономерность даже в обучающих данных, поэтому показывает слабый результат на обеих выборках. Хорошее обучение при плохом тесте, напротив, характерно для переобучения.
  kind: choice
  options:
    - Низкий коэффициент детерминации и на обучающей, и на тестовой выборке
    - Высокий коэффициент детерминации на обучающей выборке и заметно более низкий на тестовой
    - Высокий коэффициент детерминации на обеих выборках
  correct: 0
