- concept: излом L1-штрафа в нуле позволяет получать точно нулевые веса
  question: Объясните своими словами, почему Lasso может полностью обнулить вес ненужного признака, тогда как Ridge обычно лишь уменьшает его модуль.
  explanation: 'Lasso выполняет не только регуляризацию, но и отбор признаков: часть коэффициентов становится равной нулю. Ridge распределяет влияние между признаками и обычно сохраняет каждый коэффициент ненулевым, хотя и уменьшенным.'
  kind: open
  reference: L1-штраф зависит от модуля веса и имеет излом в нуле. При оптимизации это создаёт область, в которой минимум достигается при точно нулевом весе. L2-штраф гладкий, а его градиент уменьшается вместе с весом, поэтому Ridge обычно непрерывно сжимает коэффициент, не обнуляя его полностью.
  id: 053-tri-eksperimenta-3
  fingerprint: 4754ed34
