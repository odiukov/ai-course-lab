- concept: наклон линейной регрессии невозможно определить, если признак не изменяется
  question: Во всех наблюдениях признак X имеет одно и то же значение. Что произойдёт при вычислении наклона по центрированной формуле?
  explanation: Все отклонения X от среднего равны нулю, поэтому сумма их квадратов в знаменателе тоже равна нулю. По наблюдениям с единственным значением признака невозможно однозначно определить наклон прямой.
  kind: choice
  options:
    - Знаменатель станет нулевым, поэтому наклон нельзя определить
    - Наклон обязательно получится нулевым
    - Наклон будет равен среднему значению y
    - Числитель и знаменатель сократятся
  correct: 0
  id: 025-fit-closed-form-1
  fingerprint: 3c2c34a4
- concept: числитель наклона должен сохранять исходное соответствие между значениями признака и цели
  question: Заполни пропуск так, чтобы каждое значение признака сопоставлялось с целевым значением из того же наблюдения.
  explanation: В каждом слагаемом должны использоваться X[i] и y[i] из одной пары наблюдения. Независимая перестановка элементов y изменит произведения центрированных отклонений и может дать другой наклон.
  kind: cloze
  template: numerator = sum((X[i] - x_mean) * (___ - y_mean) for i in range(n))
  answer: y[i]
  accept:
    - y[i]
    - y.__getitem__(i)
  id: 025-fit-closed-form-2
  fingerprint: a7ec8904
- concept: метод обучения сохраняет параметры в состоянии модели и возвращает тот же объект
  question: Почему метод fit линейной модели обычно записывает найденные коэффициенты в self.w и self.b, а затем возвращает self, вместо возврата отдельной пары коэффициентов?
  explanation: Обучение изменяет состояние экземпляра модели. После записи self.w и self.b все методы этого экземпляра получают доступ к найденным параметрам, а return self сохраняет удобный объектный интерфейс.
  kind: open
  reference: 'Сохранение коэффициентов в полях объекта делает модель обученной: последующие вызовы predict используют эти параметры без дополнительной передачи. Возврат self позволяет сразу продолжить работу с тем же обученным объектом или объединять вызовы в цепочку.'
  id: 025-fit-closed-form-3
  fingerprint: 1e620ed3
