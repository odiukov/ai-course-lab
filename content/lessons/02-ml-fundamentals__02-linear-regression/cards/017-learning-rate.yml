- concept: learning rate масштабирует градиент и определяет величину изменения параметра
  question: Градиент MSE по параметру w равен 15, а learning rate равен 0.04. На какую величину изменится w за одно обновление?
  explanation: 'Модуль изменения равен произведению learning rate на модуль градиента: 0.04 × 15 = 0.6. Знак изменения определяется правилом вычитания градиента.'
  kind: numeric
  answer: 0.6
  tolerance: 0.001
  id: 017-learning-rate-1
  fingerprint: 8db29a90
- concept: слишком большой learning rate может вызывать перескакивание через минимум и расходимость
  question: Во время градиентного спуска MSE то уменьшается, то резко возрастает, причём колебания со временем усиливаются. Какое объяснение наиболее вероятно?
  explanation: При слишком большом learning rate обновления могут перебрасывать параметры через минимум. Из-за этого ошибка колеблется или растёт; слишком маленькое значение обычно приводит не к таким скачкам, а к медленному обучению.
  kind: choice
  options:
    - Learning rate слишком большой
    - Learning rate слишком маленький
    - Обучение уже сошлось к минимуму
    - Learning rate не влияет на поведение MSE
