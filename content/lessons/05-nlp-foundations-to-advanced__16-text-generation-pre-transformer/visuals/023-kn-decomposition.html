<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Две части вероятности Kneser–Ney</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f6f8fc;
      --surface: #ffffff;
      --panel: #f2f5fa;
      --ink: #172033;
      --muted: #59667d;
      --border: #aeb8ca;
      --primary: #1768ac;
      --primary-soft: #dceefe;
      --continuation: #a34b12;
      --continuation-soft: #ffead9;
      --result: #34543b;
      --result-soft: #e2f2e5;
      --arrow: #68758c;
      --fallback: #fff1d7;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #10141d;
        --surface: #171d28;
        --panel: #1d2532;
        --ink: #eef3fb;
        --muted: #b8c2d3;
        --border: #536176;
        --primary: #76bdf1;
        --primary-soft: #173a56;
        --continuation: #ffb277;
        --continuation-soft: #4b2a18;
        --result: #9bd3a7;
        --result-soft: #203d2a;
        --arrow: #9daabd;
        --fallback: #392e1d;
      }
    }

    html,
    body {
      margin: unset;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .figure {
      background: var(--page);
    }

    .figure-title {
      margin: unset;
      color: var(--ink);
      font-size: 22px;
      font-weight: 700;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      background: var(--surface);
    }

    .surface {
      fill: var(--surface);
    }

    .context {
      fill: var(--panel);
      stroke: var(--border);
    }

    .primary-panel {
      fill: var(--primary-soft);
      stroke: var(--primary);
    }

    .continuation-panel {
      fill: var(--continuation-soft);
      stroke: var(--continuation);
    }

    .result-panel {
      fill: var(--result-soft);
      stroke: var(--result);
    }

    .divider {
      stroke: var(--border);
      stroke-linecap: round;
    }

    .fraction {
      stroke: var(--primary);
      stroke-linecap: round;
    }

    .primary-arrow {
      stroke: var(--primary);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .continuation-arrow {
      stroke: var(--continuation);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    text {
      fill: var(--ink);
      font-family: inherit;
    }

    .muted {
      fill: var(--muted);
    }

    .primary-text {
      fill: var(--primary);
    }

    .continuation-text {
      fill: var(--continuation);
    }

    .result-text {
      fill: var(--result);
    }

    .heading {
      font-weight: 750;
      letter-spacing: 0.04em;
    }

    .formula {
      font-weight: 700;
    }

    .operator {
      font-weight: 500;
    }

    .fallback {
      box-sizing: border-box;
      background: var(--fallback);
      color: var(--ink);
      font-size: 18px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="figure">
    <h1 class="figure-title" id="diagram-title">
      Из каких двух частей складывается вероятность Kneser–Ney
    </h1>

    <svg
      id="diagram"
      viewBox="0 0 1180 474"
      width="1180"
      height="474"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-title diagram-desc"
    >
      <title>Разложение вероятности биграммы San Francisco</title>
      <desc id="diagram-desc">
        Основной член равен разности счётчика четыре и скидки ноль целых
        семьдесят пять, делённой на десять: ноль целых триста двадцать пять.
        К нему прибавляется lambda для San, умноженная на continuation
        probability слова Francisco.
      </desc>
    </svg>

    <div id="fallback" class="fallback" hidden>
      Схема должна была показать: вероятность Kneser–Ney для
      <b>San Francisco</b> состоит из основного члена
      <b>(4 − 0,75) / 10 = 0,325</b> и continuation-добавки
      <b>λ<sub>San</sub> × P<sub>cont</sub>(Francisco)</b>.
    </div>
  </main>

  <script>
    const DATA = [
      {
        kind: "settings",
        zero: 0,
        originX: 0,
        originY: 0,
        scaleX: 1,
        scaleY: 1,
        line: 2,
        strongLine: 3,
        small: 15,
        normal: 18,
        medium: 21,
        formula: 27,
        large: 31
      },
      {
        kind: "rect",
        className: "surface",
        x1: 0,
        y1: 0,
        x2: 1180,
        y2: 474
      },
      {
        kind: "rect",
        className: "context",
        x1: 40,
        y1: 18,
        x2: 1140,
        y2: 72,
        weight: 2
      },
      {
        kind: "text",
        className: "formula",
        x: 590,
        y: 52,
        anchor: "middle",
        size: 21,
        value: "Pₖₙ(Francisco | San) = основной член + continuation-добавка"
      },
      {
        kind: "rect",
        className: "primary-panel",
        x1: 40,
        y1: 94,
        x2: 560,
        y2: 310,
        weight: 2
      },
      {
        kind: "rect",
        className: "continuation-panel",
        x1: 620,
        y1: 94,
        x2: 1140,
        y2: 310,
        weight: 2
      },
      {
        kind: "text",
        className: "heading primary-text",
        x: 300,
        y: 128,
        anchor: "middle",
        size: 18,
        value: "ОСНОВНОЙ ЧЛЕН"
      },
      {
        kind: "text",
        className: "muted",
        x: 300,
        y: 154,
        anchor: "middle",
        size: 15,
        value: "свидетельство конкретной пары слов"
      },
      {
        kind: "text",
        className: "formula primary-text",
        x: 245,
        y: 201,
        anchor: "middle",
        size: 27,
        value: "4 − 0,75"
      },
      {
        kind: "line",
        className: "fraction",
        x1: 158,
        y1: 212,
        x2: 332,
        y2: 212,
        weight: 3
      },
      {
        kind: "text",
        className: "formula primary-text",
        x: 245,
        y: 247,
        anchor: "middle",
        size: 27,
        value: "10"
      },
      {
        kind: "text",
        className: "operator primary-text",
        x: 361,
        y: 222,
        anchor: "middle",
        size: 27,
        value: "="
      },
      {
        kind: "text",
        className: "formula primary-text",
        x: 446,
        y: 222,
        anchor: "middle",
        size: 31,
        value: "0,325"
      },
      {
        kind: "text",
        className: "muted",
        x: 300,
        y: 282,
        anchor: "middle",
        size: 15,
        value: "насколько часто Francisco шло именно после San"
      },
      {
        kind: "text",
        className: "heading continuation-text",
        x: 880,
        y: 128,
        anchor: "middle",
        size: 18,
        value: "CONTINUATION-ДОБАВКА"
      },
      {
        kind: "text",
        className: "muted",
        x: 880,
        y: 154,
        anchor: "middle",
        size: 15,
        value: "доля из перераспределённого резерва"
      },
      {
        kind: "text",
        className: "formula continuation-text",
        x: 735,
        y: 216,
        anchor: "middle",
        size: 31,
        value: "λSan"
      },
      {
        kind: "text",
        className: "operator continuation-text",
        x: 832,
        y: 216,
        anchor: "middle",
        size: 27,
        value: "×"
      },
      {
        kind: "text",
        className: "formula continuation-text",
        x: 978,
        y: 216,
        anchor: "middle",
        size: 27,
        value: "Pcont(Francisco)"
      },
      {
        kind: "text",
        className: "muted",
        x: 735,
        y: 249,
        anchor: "middle",
        size: 15,
        value: "вес резерва"
      },
      {
        kind: "text",
        className: "muted",
        x: 978,
        y: 249,
        anchor: "middle",
        size: 15,
        value: "широта разных контекстов"
      },
      {
        kind: "text",
        className: "muted",
        x: 880,
        y: 282,
        anchor: "middle",
        size: 15,
        value: "насколько хорошо Francisco продолжает разные слова"
      },
      {
        kind: "line",
        className: "primary-arrow",
        x1: 300,
        y1: 310,
        x2: 290,
        y2: 346,
        weight: 3
      },
      {
        kind: "line",
        className: "primary-arrow",
        x1: 290,
        y1: 346,
        x2: 280,
        y2: 334,
        weight: 3
      },
      {
        kind: "line",
        className: "primary-arrow",
        x1: 290,
        y1: 346,
        x2: 302,
        y2: 338,
        weight: 3
      },
      {
        kind: "line",
        className: "continuation-arrow",
        x1: 880,
        y1: 310,
        x2: 607,
        y2: 346,
        weight: 3
      },
      {
        kind: "line",
        className: "continuation-arrow",
        x1: 607,
        y1: 346,
        x2: 595,
        y2: 338,
        weight: 3
      },
      {
        kind: "line",
        className: "continuation-arrow",
        x1: 607,
        y1: 346,
        x2: 617,
        y2: 334,
        weight: 3
      },
      {
        kind: "rect",
        className: "result-panel",
        x1: 150,
        y1: 346,
        x2: 1030,
        y2: 430,
        weight: 2
      },
      {
        kind: "text",
        className: "formula primary-text",
        x: 290,
        y: 390,
        anchor: "middle",
        size: 27,
        value: "0,325"
      },
      {
        kind: "text",
        className: "operator",
        x: 414,
        y: 390,
        anchor: "middle",
        size: 27,
        value: "+"
      },
      {
        kind: "text",
        className: "formula continuation-text",
        x: 607,
        y: 390,
        anchor: "middle",
        size: 25,
        value: "λSan × Pcont(Francisco)"
      },
      {
        kind: "text",
        className: "operator",
        x: 812,
        y: 390,
        anchor: "middle",
        size: 27,
        value: "="
      },
      {
        kind: "text",
        className: "formula result-text",
        x: 931,
        y: 390,
        anchor: "middle",
        size: 25,
        value: "Pₖₙ(Francisco | San)"
      },
      {
        kind: "text",
        className: "primary-text",
        x: 290,
        y: 417,
        anchor: "middle",
        size: 15,
        value: "уменьшенная частота пары"
      },
      {
        kind: "text",
        className: "continuation-text",
        x: 607,
        y: 417,
        anchor: "middle",
        size: 15,
        value: "перераспределённая масса"
      },
      {
        kind: "text",
        className: "result-text",
        x: 931,
        y: 417,
        anchor: "middle",
        size: 15,
        value: "итоговая вероятность"
      },
      {
        kind: "text",
        className: "muted",
        x: 590,
        y: 458,
        anchor: "middle",
        size: 15,
        value: "Увиденная биграмма получает обе части; невиданный переход — только continuation-добавку."
      }
    ];

    const [settings, ...elements] = DATA;
    const origin = Object.freeze({
      x: settings.originX,
      y: settings.originY
    });
    const scale = Object.freeze({
      x: settings.scaleX,
      y: settings.scaleY
    });

    const sx = (x) => origin.x + x * scale.x;
    const sy = (y) => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const namespace = svg.namespaceURI;

      const add = (tag, attributes, value) => {
        const node = document.createElementNS(namespace, tag);
        Object.entries(attributes).forEach(([name, attribute]) => {
          if (attribute !== undefined) {
            node.setAttribute(name, String(attribute));
          }
        });
        if (value !== undefined) {
          node.textContent = value;
        }
        svg.appendChild(node);
      };

      elements.forEach((item) => {
        if (item.kind === "rect") {
          add("rect", {
            class: item.className,
            x: sx(item.x1),
            y: sy(item.y1),
            width: sx(item.x2) - sx(item.x1),
            height: sy(item.y2) - sy(item.y1),
            "stroke-width": item.weight
          });
          return;
        }

        if (item.kind === "line") {
          add("line", {
            class: item.className,
            x1: sx(item.x1),
            y1: sy(item.y1),
            x2: sx(item.x2),
            y2: sy(item.y2),
            "stroke-width": item.weight
          });
          return;
        }

        if (item.kind === "text") {
          add("text", {
            class: item.className,
            x: sx(item.x),
            y: sy(item.y),
            "text-anchor": item.anchor,
            "font-size": item.size
          }, item.value);
          return;
        }

        throw new Error("Неизвестный элемент схемы");
      });

      fallback.hidden = true;
    } catch (error) {
      document.getElementById("diagram").hidden = true;
      document.getElementById("fallback").hidden = false;
    }
  </script>
</body>
</html>
