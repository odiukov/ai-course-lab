  fingerprint: 8e59db5a
- concept: выбор библиотеки для n-граммной модели зависит от цели реализации
  question: Какая комбинация инструментов соответствует типичным целям разработки n-граммной языковой модели?
  explanation: KenLM ориентирован на эффективное практическое применение, nltk.lm удобен для учебных опытов, а самостоятельная реализация полезна прежде всего для освоения внутреннего устройства модели.
  kind: choice
  options:
    - KenLM — для прикладной системы, nltk.lm — для учебного эксперимента, собственная реализация — для понимания алгоритма
    - nltk.lm — только для высоконагруженного продакшена, KenLM — только для демонстрации формул
    - Собственная реализация — обязательный выбор для максимальной производительности
    - Одна и та же самописная реализация — для обучения, экспериментов и продакшена
  correct: 0
  id: 043-shipit-contract-3
