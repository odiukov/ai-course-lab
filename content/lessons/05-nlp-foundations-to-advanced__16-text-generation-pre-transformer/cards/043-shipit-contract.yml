- concept: Modified Kneser–Ney является практическим сглаживанием по умолчанию, а Laplace подходит главным образом для обучения
  question: Какое сглаживание разумно выбрать для прикладного n-граммного baseline на большом словаре?
  explanation: Modified Kneser–Ney обычно служит рабочим выбором по умолчанию. Laplace полезен как простая учебная схема, но на большом словаре распределяет слишком много массы между невиданными продолжениями.
  kind: choice
  options:
    - Modified Kneser–Ney
    - Laplace независимо от размера словаря
    - Полный отказ от сглаживания
    - Численное ограничение всех вероятностей снизу
  correct: 0
