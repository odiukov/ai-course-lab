- concept: фиксированный seed делает последовательность псевдослучайных выборов воспроизводимой
  question: Генератор текста дважды запускают с одинаковыми префиксом, словарём, вероятностями, ограничением длины и seed. Объясни, почему результаты должны совпасть.
  explanation: Seed задаёт начальное состояние генератора псевдослучайных чисел. При неизменных входных данных повторяются случайные пороги, выбранные токены и последующие контексты, поэтому воспроизводится весь текст.
  kind: open
  reference: 'Генератор псевдослучайных чисел детерминирован: одинаковый seed создаёт одну и ту же последовательность случайных значений. Поэтому на каждом шаге выбирается тот же токен, возникает тот же следующий контекст и вся генерация повторяется.'
  id: 033-sampling-2
  fingerprint: b647d69d
