- concept: условие обратимости кодирования текста номерами предсказаний
  question: Текст кодируют позициями истинных символов в списках продолжений, упорядоченных предсказателем. При каком условии получатель сможет восстановить текст без потерь?
  explanation: Получатель последовательно воспроизводит те же ранжированные списки и выбирает символ на переданной позиции. Каждый восстановленный символ дополняет префикс для следующего хода, поэтому исходный текст восстанавливается точно.
  kind: choice
  options:
    - Отправитель и получатель используют один и тот же детерминированный предсказатель и на каждом ходе строят список по уже восстановленному префиксу
    - Получатель знает только частоты символов во всём тексте
    - Предсказатель всегда ставит истинный символ в начало списка
    - Каждый символ кодируется независимо от предшествующего текста
  correct: 0
  id: 004-igra-v-predskazanie-1
  fingerprint: b6f0cf68
- concept: связь качества предсказания со степенью сжатия без потерь
  question: Объясни своими словами, почему улучшение предсказателя следующего символа позволяет сильнее сжимать текст без потерь.
  explanation: 'Предсказание и сжатие измеряют одну структуру: чем меньше неопределённость следующего символа, тем меньше информации в среднем требуется передать для его восстановления.'
  kind: open
  reference: Хороший предсказатель чаще помещает истинное продолжение среди первых вариантов. Поэтому последовательность позиций истинных символов содержит преимущественно малые, более предсказуемые значения и допускает более короткое кодирование. Если декодер использует тот же предсказатель, сокращение записи не мешает точному восстановлению текста.
  id: 004-igra-v-predskazanie-2
  fingerprint: 1075d579
