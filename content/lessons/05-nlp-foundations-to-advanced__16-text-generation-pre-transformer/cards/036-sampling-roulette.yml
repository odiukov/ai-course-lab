- concept: вероятность конкретной последовательности при пошаговом сэмплировании равна произведению условных вероятностей её токенов
  question: При генерации вероятность выбрать токен A равна 0.6, а вероятность затем выбрать токен B при условии A равна 0.4. Какова вероятность получить продолжение A B?
  explanation: 'Выборы выполняются последовательно, поэтому вероятность всего пути равна произведению условных вероятностей: 0.6 × 0.4 = 0.24.'
  kind: numeric
  answer: 0.24
  tolerance: 0.001
  id: 036-sampling-roulette-1
  fingerprint: f04170de
- concept: порядок обхода кандидатов меняет соответствие случайных порогов словам, но не вероятность каждого слова
  question: Кандидатов с неизменными положительными весами переставили в другом порядке перед пропорциональным сэмплированием. Что произойдёт?
  explanation: Перестановка перемещает интервалы кандидатов на шкале накопленных весов, поэтому один и тот же случайный порог может указать на другое слово. Однако длина интервала каждого слова не меняется, а значит, не меняется и его вероятность.
  kind: choice
  options:
    - Первый кандидат получит наибольшую вероятность независимо от веса
    - При отдельном фиксированном seed результат может измениться, но частоты слов во множестве запусков останутся пропорциональны их весам
    - Распределение автоматически станет равномерным
    - Кандидат с наименьшим весом перестанет выбираться
  correct: 1
