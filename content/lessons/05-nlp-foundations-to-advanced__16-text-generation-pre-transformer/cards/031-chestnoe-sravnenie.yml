- concept: разные порядки n-граммных моделей не мешают сравнению perplexity при корректной оценке каждой модели
  question: Можно ли напрямую сравнивать perplexity биграммной и триграммной моделей, хотя они используют контексты разной длины? Объясни условие корректного сравнения.
  explanation: Разная память — настоящее различие между моделями, поэтому искусственно уравнивать её не нужно. Некорректность возникает, если при тестировании изменить контекст или паддинг относительно обучения либо дать моделям разные данные или токенизацию.
  kind: open
  reference: Да. Обе модели должны предсказывать одну и ту же токенизированную тестовую последовательность, а каждую модель нужно оценивать с той шириной контекста и тем граничным паддингом, которые соответствуют её порядку.
