- concept: зависимость предсказаний счётной языковой модели от состава корпуса
  question: Почему две счётные языковые модели могут предлагать разные следующие слова после одной и той же фразы?
  explanation: Счётная модель переносит в предсказания статистику своего корпуса. Например, после слова «сильный» в архиве прогноз определялся тем, сколько раз там встречались «ветер», «дождь» и другие продолжения, а не универсальным пониманием языка.
  kind: open
  reference: Модели могли обучаться на разных корпусах. Частоты продолжений зависят от тематики, стиля и состава текстов, поэтому наиболее частое следующее слово в одном корпусе может не быть наиболее частым в другом.
  id: 001-do-transformerov-2
  fingerprint: 308609a9
