- concept: кортежи подходят для представления ключей n-граммных счётчиков благодаря хешируемости
  question: Почему контекст и полную n-грамму преобразуют в tuple перед использованием в Counter?
  explanation: Counter хранит частоты как словарь «ключ → количество». Список изменяем и потому не может быть ключом, а кортеж токенов хешируем и однозначно представляет контекст или полную n-грамму.
  kind: choice
  options:
    - Кортеж автоматически сортирует токены
    - Кортеж удаляет повторяющиеся токены
    - Counter принимает только числовые последовательности
    - Кортеж отделяет служебные токены от обычных
    - Кортеж неизменяем и хешируем, поэтому может быть ключом словаря
  correct: 4
  id: 009-train-ngram-1
  fingerprint: e8252bca
- concept: окна n-граммной модели не должны пересекать границы разных предложений
  question: Почему при обучении n-граммной модели токенизированные предложения следует обрабатывать по отдельности, а не склеивать в одну последовательность?
  explanation: Цикл по предложениям создаёт окна только внутри каждого предложения и его граничных токенов. Простая конкатенация корпуса ошибочно превратила бы соседство предложений в наблюдавшийся языковой контекст.
  kind: open
  reference: При склеивании возникнут искусственные n-граммы, связывающие конец одного предложения с началом другого. Отдельный паддинг каждого предложения сохраняет настоящие границы и не добавляет в модель несуществующие переходы.
  id: 009-train-ngram-2
  fingerprint: 5bbbb440
