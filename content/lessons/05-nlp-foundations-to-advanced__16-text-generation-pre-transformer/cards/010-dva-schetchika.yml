- concept: отдельный счётчик контекстов заранее накапливает общий размер группы продолжений
  question: Зачем при обучении n-граммной модели хранить отдельный счётчик контекстов, если их частоты можно восстановить из полного счётчика n-грамм?
  explanation: Полный счётчик различает конкретные продолжения, а отдельный счётчик контекстов сохраняет их совокупную частоту во время обучения. Это позволяет сразу получить нужный агрегат без повторного обхода всех возможных продолжений.
  kind: choice
  options:
    - Чтобы получать общую частоту контекста напрямую, не суммируя заново частоты всех его продолжений
    - Чтобы контексты разных предложений можно было объединять в одну n-грамму
    - Чтобы хранить порядок появления предложений в корпусе
    - Чтобы автоматически назначать ненулевые частоты отсутствующим n-граммам
  correct: 0
