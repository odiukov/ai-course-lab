- concept: триграммная модель извлекает из корпуса перекрывающиеся пары «контекст → следующий токен»
  question: Какие обучающие пары триграммная модель извлечёт из фразы «яркое солнце согрело город»?
  explanation: В триграмме первые два токена служат контекстом, а третий — продолжением. Окно затем сдвигается на один токен, поэтому соседние фрагменты перекрываются.
  kind: choice
  options:
    - «яркое солнце» → «согрело» и «солнце согрело» → «город»
    - «яркое» → «солнце согрело» и «солнце» → «согрело город»
    - «яркое солнце согрело» → «город»
    - «яркое солнце» → «город» и «солнце согрело» → «яркое»
  correct: 0
  id: 003-ngram-pipeline-1
  fingerprint: 45549aba
- concept: последовательность построения предсказания n-gram-модели от корпуса до следующего токена
  question: Расположи этапы работы n-gram-модели в правильном порядке.
  explanation: Корпус сначала превращается в n-граммы, затем — в таблицу счётчиков. Сглаживание резервирует вероятностную массу для невиданных событий, после чего модель получает распределение и выбирает продолжение.
  kind: order
  items:
    - Разбить токенизированный корпус на перекрывающиеся фрагменты «контекст → продолжение»
    - Сгруппировать одинаковые контексты и подсчитать их продолжения
    - Скорректировать счётчики с помощью сглаживания
    - Преобразовать скорректированные счётчики в распределение вероятностей
    - Использовать распределение для выбора следующего токена
  id: 003-ngram-pipeline-2
  fingerprint: 5bc797fa
