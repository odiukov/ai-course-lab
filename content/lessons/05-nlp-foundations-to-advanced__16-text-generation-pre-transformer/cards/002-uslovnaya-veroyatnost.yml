- concept: нормализация счётчиков продолжений в условную вероятность
  question: Контекст «зелёный чай» встретился в корпусе 56 раз, причём в 14 случаях следующим словом было «остыл». Какую вероятность триграммная модель присвоит слову «остыл» после этого контекста?
  explanation: 'Условная вероятность равна отношению совместного счётчика к счётчику контекста: 14 / 56 = 0.25. Так частоты всех продолжений одного контекста превращаются в распределение вероятностей.'
  kind: numeric
  answer: 0.25
  tolerance: 0.001
  id: 002-uslovnaya-veroyatnost-1
  fingerprint: 3afe0020
- concept: случайное сэмплирование позволяет получать разные продолжения из одного распределения
  question: Почему n-gram-модель при двух запусках может сгенерировать разные следующие слова для одного и того же контекста, хотя её счётчики не изменились?
  explanation: Нормализованные счётчики служат весами случайного выбора. Поэтому один контекст может давать разные продолжения без изменения модели; неизменными остаются вероятности этих продолжений.
  kind: open
  reference: Модель задаёт распределение вероятностей, а не единственный обязательный ответ. Если следующее слово случайно сэмплируется из этого распределения, разные запуски могут выбрать разные слова, причём более вероятные будут выпадать чаще.
  id: 002-uslovnaya-veroyatnost-2
  fingerprint: 41e04e85
