- concept: interpolation всегда смешивает оценки разных порядков, а backoff обращается к младшему порядку при отсутствии старшей n-граммы
  question: Объясните своими словами, чем interpolation отличается от backoff, если n-грамма старшего порядка уже встречалась в обучающем корпусе.
  explanation: 'Interpolation постоянно объединяет несколько распределений с заданными весами. Backoff действует условно: известные n-граммы оцениваются на старшем порядке, а для неизвестных применяется нормализованный откат к младшему.'
  kind: open
  reference: При interpolation прогноз старшего порядка всё равно смешивается с прогнозами младших порядков. При backoff для встречавшейся n-граммы используется оценка старшего порядка, а переход к более короткому контексту происходит, когда старшая n-грамма не наблюдалась.
