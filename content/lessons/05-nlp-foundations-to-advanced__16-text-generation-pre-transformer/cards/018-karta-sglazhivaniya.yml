- concept: absolute discounting освобождает вероятностную массу одинаковым уменьшением каждого ненулевого счётчика
  question: Заполните формулу скорректированного счётчика наблюдавшейся n-граммы при absolute discounting.
  explanation: Из каждого ненулевого счётчика вычитается одна и та же скидка D. Совокупная освобождённая масса затем распределяется между продолжениями, которым старший порядок не дал оценки.
