- concept: изменение порядка n-граммной модели не позволяет приписать весь выигрыш только сглаживанию
  question: Биграммная Kneser–Ney и триграммная Laplace оценены корректно на одной отложенной последовательности токенов. Какой вывод допустим из различия их perplexity, а какой — нет?
  explanation: Общая тестовая последовательность делает итоговые значения сравнимыми, но не устраняет смешение факторов. Чтобы измерить именно эффект Kneser–Ney относительно Laplace, нужно сохранить одинаковый порядок модели и менять только сглаживание.
  kind: open
  reference: Допустимо сравнить качество двух конкретных конфигураций. Нельзя утверждать, что вся разница вызвана только сглаживанием, потому что вместе со способом сглаживания изменилась ширина контекста модели.
