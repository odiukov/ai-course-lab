- concept: энтропия текста выражает среднее количество информации на следующий символ
  question: Объясни своими словами, что означает измерение условной энтропии текста в битах на символ.
  explanation: Энтропия характеризует среднюю неопределённость следующего символа при заданном контексте. Биты здесь служат единицей информации, а не указывают фиксированную длину кода каждого отдельного символа.
  kind: open
  reference: Это среднее количество информации, необходимое для представления или предсказания следующего символа при известном контексте. Речь идёт о среднем по множеству символов, поэтому значение не обязано быть целым.
