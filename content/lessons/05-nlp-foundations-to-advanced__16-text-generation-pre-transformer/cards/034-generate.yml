- concept: max_len ограничивает число сгенерированных токенов, а не полную длину результата вместе с префиксом
  question: Почему результат функции генерации может содержать больше токенов, чем указано в max_len?
  explanation: Цикл ограничивает количество добавлений после префикса. Поэтому максимальная полная длина складывается из длины префикса и числа выполненных итераций, если генерация не завершилась раньше на токене конца.
  kind: open
  reference: Потому что max_len задаёт максимальное число итераций, на каждой из которых добавляется новый токен. Префикс уже находится в результирующем списке и в этот лимит не входит; встреча токена конца может остановить генерацию раньше.
