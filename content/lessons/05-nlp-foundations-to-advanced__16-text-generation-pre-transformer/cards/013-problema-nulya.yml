- concept: несглаженная n-граммная модель не различает предложения, если каждое содержит хотя бы одну невиданную n-грамму
  question: Предложение А почти целиком состоит из хорошо знакомых модели продолжений, но содержит одну невиданную n-грамму. В предложении Б невиданных n-грамм несколько. Как несглаженная n-граммная модель сравнит их вероятности?
  explanation: Вероятность предложения равна произведению условных вероятностей продолжений. Нулевой множитель обнуляет всё произведение, поэтому оба предложения получают ноль независимо от качества остальных продолжений.
  kind: choice
  options:
    - Оценит предложение А выше, потому что знакомых продолжений в нём больше
    - Оценит предложение Б выше, потому что повторные нули компенсируют друг друга
    - Сравнит только вероятности знакомых продолжений
    - Присвоит обоим предложениям нулевую вероятность и не сможет различить их по этой оценке
  correct: 3
  id: 013-problema-nulya-1
  fingerprint: 2dde1e78
- concept: нулевой счётчик в конечном корпусе означает отсутствие наблюдения, а не невозможность языкового события
  question: Объясни своими словами, почему невиданная в обучающем корпусе n-грамма не обязательно является невозможной в языке.
  explanation: 'Сырой подсчёт смешивает два разных утверждения: «событие не наблюдалось» и «событие невозможно». Для новых текстов это слишком категорично, поэтому n-граммным моделям требуется сглаживание.'
  kind: open
  reference: Обучающий корпус конечен и не содержит всех допустимых сочетаний слов. Поэтому нулевой счётчик говорит лишь о том, что n-грамма не встретилась в выборке, а не о том, что её истинная вероятность равна нулю.
  id: 013-problema-nulya-2
  fingerprint: b419502d
