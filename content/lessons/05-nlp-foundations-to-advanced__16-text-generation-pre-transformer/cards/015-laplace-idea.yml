- concept: вероятность при сглаживании Лапласа вычисляется с добавлением псевдонаблюдения каждому слову словаря
  question: Контекст встретился 7 раз, из них целевое слово следовало за ним 6 раз. Размер словаря — 8 слов. Какую вероятность целевого слова даст сглаживание Лапласа?
  explanation: 'После прибавления единицы счётчик целевого слова становится 7, а знаменатель — 15: к числу наблюдений прибавляется размер словаря. Поэтому вероятность равна 7/15 ≈ 0.4667.'
  kind: numeric
  answer: 0.4667
  tolerance: 0.001
  id: 015-laplace-idea-1
  fingerprint: a760e076
- concept: суммарная масса псевдонаблюдений Лапласа растёт вместе с размером словаря
  question: Почему сглаживание Лапласа может сильно занизить вероятность часто наблюдавшегося продолжения при большом словаре?
  explanation: При add-one-сглаживании знаменатель увеличивается на размер словаря. Если словарь велик, добавленные псевдосчётчики могут перевесить реальные наблюдения и отнять слишком много вероятностной массы у известных продолжений.
  kind: choice
  options:
    - Оно удаляет из корпуса все редкие слова перед подсчётом вероятностей
    - Оно учитывает только последнее наблюдение каждого контекста
    - Оно добавляет псевдонаблюдение каждому слову, поэтому большой словарь создаёт значительную суммарную добавочную массу
    - Оно заменяет условные вероятности равномерным распределением независимо от счётчиков
  correct: 2
  id: 015-laplace-idea-2
