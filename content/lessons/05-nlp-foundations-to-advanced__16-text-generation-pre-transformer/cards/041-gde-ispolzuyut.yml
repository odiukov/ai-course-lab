- concept: фиксированный короткий контекст и табличные оценки обеспечивают низкую и предсказуемую задержку n-gram-модели
  question: Почему n-gram-модель может быть предпочтительнее более точной нейросетевой модели в экранной клавиатуре или другом интерактивном компоненте?
  explanation: В интерактивном интерфейсе важна не только точность, но и время ответа. Табличные n-gram-оценки требуют мало вычислений, работают локально и имеют предсказуемую стоимость, хотя хуже моделируют дальние зависимости.
  kind: open
  reference: Она использует короткий фиксированный контекст и заранее подготовленные таблицы, поэтому быстро выдаёт результат с предсказуемой задержкой и может работать прямо на устройстве без сети. Платой за это становится слабый учёт далёкого контекста.
