- concept: для полностью невиданного контекста сглаживание Лапласа задаёт равномерное распределение по словарю
  question: Какое распределение продолжений выдаст сглаживание Лапласа для контекста, который ни разу не встречался в обучающем корпусе?
  explanation: Для невиданного контекста отсутствуют и его собственный счётчик, и счётчики всех продолжений. Одинаковый псевдосчётчик поэтому даёт каждому слову одну и ту же вероятность. Частоты слов вне этого контекста Laplace не учитывает.
  kind: choice
  options:
    - Равномерное по всем словам словаря
    - Совпадающее с частотами слов во всём корпусе
    - Сосредоточенное на самом частом слове корпуса
  correct: 0
  id: 016-laplace-probability-1
  fingerprint: 14330c66
- concept: сглаживание Лапласа смещает распределение к равномерному и может сильно занизить вероятность наблюдавшихся продолжений
  question: Почему сглаживание Лапласа обычно плохо подходит языковым моделям с большим словарём и редкими контекстами?
  explanation: Laplace тянет условное распределение к равномерному. Когда наблюдений контекста мало, добавка для всего словаря подавляет реальные счётчики и искажает даже хорошо подтверждённые продолжения.
  kind: open
  reference: Оно назначает одинаковый псдевосчётчик каждому слову словаря. В большом словаре суммарная добавленная масса может преобладать над реальными наблюдениями, поэтому вероятности частых известных продолжений резко уменьшаются, а невиданные продолжения получают слишком большую совокупную массу.
  id: 016-laplace-probability-2
  fingerprint: 6561a310
