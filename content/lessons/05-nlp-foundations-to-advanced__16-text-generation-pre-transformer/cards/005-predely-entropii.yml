- concept: снижение условной энтропии отражает предсказуемость языка благодаря контексту
  question: Почему условная энтропия символа при известном контексте может быть намного ниже максимальной энтропии алфавита, хотя набор допустимых символов не меняется?
  explanation: Разница между максимальной энтропией алфавита и условной энтропией языка измеряет информацию, которую даёт контекст. Это среднее уменьшение неопределённости, а не утверждение, что определённая доля букв жёстко задана.
  kind: open
  reference: 'Контекст делает варианты неравновероятными: грамматика, смысл и устойчивые сочетания повышают вероятность немногих продолжений и снижают вероятность остальных. Поэтому средняя неопределённость уменьшается, хотя формально выбрать всё ещё можно любой символ.'
