- concept: отложенный корпус позволяет оценить обобщение модели на данных, не использованных при обучении
  question: Расположи этапы честной оценки языковой модели в правильном порядке.
  explanation: Отложенные данные отделяют до обучения и не используют при настройке модели. Поэтому итоговая метрика характеризует работу на новом тексте, а не запоминание обучающего корпуса.
  kind: order
  items:
    - Разделить корпус на обучающую и отложенную части
    - Обучить модель только на обучающей части
    - Вычислить вероятности токенов отложенной части
    - Свернуть полученные вероятности в итоговую метрику
  id: 025-heldout-ocenka-1
  fingerprint: 14c261aa
- concept: ширина контекста и граничный паддинг при оценке должны соответствовать порядку обученной языковой модели
  question: Почему нельзя оценивать n-граммную модель, передавая ей более короткие контексты и другой граничный паддинг, чем при обучении?
  explanation: Параметр порядка в функции perplexity должен соответствовать модели за prob_fn. Иначе меняются формируемые контексты и паддинг, а вычисленная метрика относится уже не к той вероятностной схеме, которая использовалась при обучении.
  kind: open
  reference: Модель обучалась оценивать условные вероятности для контекстов определённой ширины и с определёнными граничными токенами. При другой схеме оценивания ей передают не те ключи и не те условные события, статистику которых она изучала, поэтому результат не является корректной оценкой этой модели.
  id: 025-heldout-ocenka-2
  fingerprint: 44a81296
