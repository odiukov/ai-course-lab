- concept: корпусная perplexity усредняет логарифмические потери по токенам, поэтому вклад предложения зависит от его длины
  question: В тестовом корпусе длинное и короткое предложения имеют разные средние отрицательные логарифмы вероятностей. Как правильно получить общую perplexity корпуса?
  explanation: Функция накапливает log вероятности по всему тестовому корпусу и делит сумму на общее число предсказанных токенов. Поэтому длинное предложение получает больший вес, а среднее отдельных perplexity обычно даёт другой результат.
  kind: choice
  options:
    - Сложить потери всех предсказываемых токенов, разделить на их общее количество и экспоненцировать результат
    - Вычислить perplexity каждого предложения и взять их обычное арифметическое среднее
    - Использовать только perplexity самого длинного предложения
  correct: 0
