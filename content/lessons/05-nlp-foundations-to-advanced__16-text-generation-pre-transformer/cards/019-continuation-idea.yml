- concept: continuation probability равна доле различных типов биграмм, которые заканчиваются данным словом
  question: Слово w встречается после шести различных предшественников, а всего в корпусе имеется 48 различных типов биграмм. Чему равна continuation probability слова w?
  explanation: 'Continuation probability учитывает различные левые контексты: 6 / 48 = 0.125. Дополнительные повторы уже существующих биграмм не изменили бы результат.'
  kind: numeric
  answer: 0.125
  tolerance: 0.0001
  id: 019-continuation-idea-1
  fingerprint: d9ac49e7
- concept: новый тип левого контекста влияет на continuation probability, а повтор существующей биграммы — нет
  question: Какое изменение корпуса увеличит continuation probability слова w?
  explanation: Новая биграмма (v, w) добавляет слову w ещё один различный левый контекст. Повторы существующих биграмм и перестановка предложений без изменения набора биграмм новых контекстов не создают.
  kind: choice
  options:
    - Добавление ещё одного вхождения уже наблюдавшейся биграммы (u, w)
    - Добавление ранее отсутствовавшей биграммы (v, w), где v ещё не было предшественником w
    - Увеличение частоты слова w только после уже известных предшественников
    - Перестановка предложений корпуса без изменения биграмм
  correct: 1
  id: 019-continuation-idea-2
  fingerprint: 0dc6a5ae
