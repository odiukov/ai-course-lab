- concept: численное ограничение вероятности снизу не является сглаживанием языковой модели
  question: Объясни, почему замена вероятности в вычислении метрики на max(p, ε) предотвращает ошибку логарифма, но не превращает несглаженную языковую модель в сглаженную.
  explanation: Нижняя граница вроде 1e-12 делает диагностическую оценку конечной. Но вероятности, возвращаемые моделью, от этого не меняются и заново не нормализуются, поэтому это численная защита, а не метод сглаживания.
  kind: open
  reference: Ограничение применяется только внутри вычисления метрики, чтобы логарифм получал положительный аргумент. Оно не пересчитывает нормированное распределение модели и не распределяет вероятностную массу между невиданными событиями, как настоящее сглаживание.
