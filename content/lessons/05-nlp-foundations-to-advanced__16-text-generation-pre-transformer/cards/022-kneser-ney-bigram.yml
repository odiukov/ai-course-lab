- concept: при невиданном левом контексте биграммная Kneser–Ney модель напрямую использует continuation probability
  question: Заполни ветку для контекста, который ни разу не встречался в обучающем корпусе.
  explanation: У невиданного контекста нет частоты, поэтому для него нельзя вычислить ни уменьшенный основной член, ни освобождённую скидкой массу. Модель сразу использует распределение продолжений, а для неизвестного слова может вернуть малую положительную величину.
  kind: cloze
  template: |-
    denom = context_totals.get(prev)
    if not denom:
        return ___
  answer: continuation_prob.get(w, tiny_probability)
  accept:
    - continuation_prob.get(w, epsilon)
    - continuation_prob[w]
  id: 022-kneser-ney-bigram-1
  fingerprint: 4d07b26c
- concept: единая сигнатура функции условной вероятности делает разные n-граммные модели взаимозаменяемыми
  question: Несглаженная, лапласовская и Kneser–Ney биграммные модели обучаются по-разному. Какой интерфейс позволяет одной и той же функции генерации использовать любую из них?
  explanation: Генератору не нужно знать способ сглаживания или устройство внутренних счётчиков. Ему достаточно вызвать prob(context, word); одинаковая сигнатура отделяет обучение модели от её использования.
  kind: choice
  options:
    - Словарь, сопоставляющий каждой биграмме её сырой счётчик
    - Функция prob(context, word), возвращающая условную вероятность слова
    - Список слов корпуса, отсортированный по общей частоте
    - Функция, которая при каждом запросе заново подсчитывает все биграммы
  correct: 1
  id: 022-kneser-ney-bigram-2
  fingerprint: d107e99a
