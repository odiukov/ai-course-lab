- concept: baseline обнаруживает аномально слабый результат, но не локализует его причину
  question: Трансформер едва обгоняет сильную модель Kneser–Ney при корректном сравнении perplexity. Объясни, почему по этому факту нельзя определить конкретную причину проблемы и что следует проверить.
  explanation: Baseline действует как сигнализация, а не как трассировка ошибки. Результат 130 против 140 из урока заставляет начать аудит конвейера, но сам по себе не различает дефект данных, разметки целей, оптимизации или обновления параметров.
  kind: open
  reference: 'Разрыв сообщает лишь о том, что сложная модель почти не реализует ожидаемое преимущество, но не указывает на виноватый компонент. Причину нужно локализовать отдельными проверками: исследовать подготовку данных, согласованность токенизации, сдвиг входов и целевых токенов, скорость обучения, градиенты и фактическое обновление параметров.'
  id: 042-baseline-sanity-2
  fingerprint: 14b1b599
