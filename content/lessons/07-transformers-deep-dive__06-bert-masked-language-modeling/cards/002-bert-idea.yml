- concept: masked language modeling создаёт обучающие цели непосредственно из неразмеченного текста
  question: Почему для предобучения BERT методом masked language modeling не требуется ручная разметка?
  explanation: При подготовке примера часть токенов скрывают, но сохраняют их исходные значения как целевые ответы. Поэтому обычный текст сам предоставляет разметку для MLM.
  kind: choice
  options:
    - Исходный токен до маскирования автоматически служит правильным ответом
    - Модель получает правильные ответы от заранее обученной головы классификации
    - Каждое предложение автоматически относится к одному из тематических классов
    - Функция потерь не сравнивает предсказания модели с правильными ответами
  correct: 0
  id: 002-bert-idea-1
  fingerprint: 72bbe34f
- concept: перенос обучения отделяет общее предобучение encoder от адаптации к конкретной задаче
  question: Расположите этапы применения предобученного BERT к новой задаче классификации в правильном порядке.
  explanation: Сначала encoder усваивает общие закономерности языка из неразмеченного корпуса. Затем к нему добавляют специализированную голову и адаптируют систему на размеченных данных конкретной задачи.
  kind: order
  items:
    - Предобучить encoder на большом корпусе с помощью masked language modeling
    - Добавить к encoder голову для нужных классов
    - Дообучить модель на размеченных примерах целевой задачи
  id: 002-bert-idea-2
  fingerprint: 35876bc0
- concept: BERT строит представление токена с учётом контекста с обеих сторон
  question: Объясните, почему masked language modeling позволяет encoder BERT учитывать и левый, и правый контекст скрытого токена.
  explanation: 'BERT не обязан предсказывать текст строго слева направо: encoder одновременно обрабатывает доступные токены всего фрагмента. Поэтому представление и предсказание могут зависеть от контекста с обеих сторон.'
  kind: open
  reference: Скрытый токен находится внутри предложения, а все незамаскированные токены по обе стороны от него доступны encoder одновременно. Чтобы восстановить токен, модель может использовать информацию как слева, так и справа.
  id: 002-bert-idea-3
  fingerprint: 3f01b7aa
