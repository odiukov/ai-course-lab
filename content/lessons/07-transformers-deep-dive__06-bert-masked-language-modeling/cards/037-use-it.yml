- concept: оси last_hidden_state соответствуют батчу, позициям токенов и скрытым признакам
  question: Выход энкодера last_hidden_state имеет форму (B, L, D). Что обозначают эти оси?
  explanation: Энкодер возвращает скрытый вектор размерности D для каждой из L токенизированных позиций каждого объекта батча B. Поэтому last_hidden_state содержит не один вектор текста, а набор векторов токенов.
  kind: choice
  options:
    - B — объекты в батче, L — позиции токенов, D — координаты скрытого вектора
    - B — блоки attention, L — слои модели, D — число документов
    - B — размер словаря, L — классы, D — вероятности классов
  correct: 0
  id: 037-use-it-1
  fingerprint: 4128a43c
- concept: пулинг по оси токенов удаляет эту ось и сохраняет оси батча и скрытых признаков
  question: Какой станет форма тензора после усреднения скрытых векторов по всем токенизированным позициям каждого текста?
  explanation: Средний пулинг схлопывает ось токенов L. Для каждого объекта остаётся один вектор ширины D, поэтому результат имеет форму (B, D).
  kind: cloze
  template: H ∈ R^(B×L×D) → mean_pool(H, axis=L) ∈ ___
  answer: R^(B×D)
  accept:
    - (B, D)
    - B×D
    - R^{B×D}
  id: 037-use-it-2
  fingerprint: 3fa2899a
