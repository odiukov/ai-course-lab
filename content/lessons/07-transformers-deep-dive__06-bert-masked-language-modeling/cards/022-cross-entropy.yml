- concept: loss отрицательного логарифмического правдоподобия уменьшается при росте вероятности правильного токена
  question: На каждой целевой MLM-позиции вероятность правильного токена выросла. Как изменится средний loss при неизменном наборе целевых позиций?
  explanation: Для каждой позиции loss равен отрицательному логарифму вероятности правильного токена. Логарифм растёт вместе с вероятностью, поэтому его отрицательное значение уменьшается.
  kind: choice
  options:
    - Уменьшится
    - Увеличится
    - Не изменится
  correct: 0
  id: 022-cross-entropy-1
  fingerprint: 9971682d
- concept: логарифмический loss особенно сильно штрафует уверенное исключение правильного токена
  question: Почему отрицательный логарифм вероятности лучше линейного штрафа различает просто неуверенный ответ и уверенную грубую ошибку?
  explanation: Функция отрицательного логарифма становится всё круче около нулевой вероятности. Это делает уверенные ошибки существенно дороже умеренно неуверенных предсказаний.
  kind: open
  reference: Когда вероятность правильного токена стремится к нулю, отрицательный логарифм неограниченно растёт. Поэтому модель получает особенно большой штраф, если почти исключает верный ответ, тогда как линейный штраф быстро приближается к своему пределу и хуже различает такие ошибки.
  id: 022-cross-entropy-2
  fingerprint: 85dab2db
- concept: при равномерном распределении MLM-loss равен натуральному логарифму размера словаря
  question: MLM-модель распределяет вероятность поровну между 64 токенами словаря. Чему примерно равен loss на целевой позиции?
  explanation: Вероятность правильного токена при равномерном распределении равна обратной величине размера словаря. Поэтому loss равен ln(64), то есть примерно 4.16.
  kind: numeric
  answer: 4.16
  tolerance: 0.03
  id: 022-cross-entropy-3
  fingerprint: d59ae848
