- concept: NSP предсказывает, является ли второй фрагмент продолжением первого
  question: Какую обучающую цель решает Next Sentence Prediction в исходной BERT?
  explanation: 'NSP — бинарная классификация пары фрагментов: модель по представлению [CLS] определяет, был ли второй фрагмент реальным продолжением первого или был взят из другого места.'
  kind: choice
  options:
    - Восстанавливает замаскированные токены во втором фрагменте
    - Определяет, следует ли второй фрагмент за первым в исходном тексте
    - Генерирует продолжение первого фрагмента токен за токеном
    - Оценивает семантическое сходство отдельных токенов
  correct: 1
  id: 017-nsp-1
  fingerprint: 2b43e1ea
- concept: вклад компонента проверяется ablation-сравнением моделей с ним и без него
  question: Какой эксперимент лучше всего проверяет, приносит ли NSP пользу при предобучении энкодера?
  explanation: 'Ablation изолирует вклад одной детали: остальные существенные условия сохраняют, а проверяемый компонент убирают. В экспериментах RoBERTa удаление NSP не ухудшило результаты и даже повысило качество, поэтому эта цель не была полезной частью метода.'
  kind: choice
  options:
    - Сравнить модели разных размеров, обученные на разных корпусах
    - Оценить NSP-loss одной модели в конце предобучения
    - Обучить сопоставимые модели в одинаковых условиях, отключив NSP только у одной из них
    - Заменить все отрицательные пары положительными и проверить точность NSP
  correct: 2
  id: 017-nsp-2
  fingerprint: 8a747ef1
- concept: отрицательные NSP-пары из разных документов допускают тематический shortcut
  question: Объясни своими словами, почему отрицательные NSP-примеры, составленные из фрагментов разных документов, могут плохо обучать пониманию связи между предложениями.
  explanation: 'Если положительные и отрицательные пары легко различить по тематике, возникает shortcut: вместо понимания продолжения текста модель замечает смену словаря или предметной области. Это объясняет, почему NSP могла не помогать качеству энкодера.'
  kind: open
  reference: Фрагменты из разных документов часто различаются по теме и лексике. Модель может распознавать отрицательную пару по этому поверхностному различию, не анализируя логическую или дискурсивную связь между предложениями. Такая слишком лёгкая цель расходует вычисления и ёмкость модели, но даёт мало полезного обучающего сигнала.
  id: 017-nsp-3
  fingerprint: 6058c119
