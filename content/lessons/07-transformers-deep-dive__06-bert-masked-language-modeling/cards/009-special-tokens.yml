- concept: для классификации используется контекстуализированный выход [CLS], а не его исходный эмбеддинг
  question: Почему классификатор BERT получает выходной вектор [CLS] после слоёв encoder, а не входной эмбеддинг этого токена?
  explanation: Смысл для классификации появляется не в исходном служебном токене, а в его контекстуализированном представлении после обработки всей последовательности.
