- concept: маленький декодер предпочтительнее BERT-классификатора, когда категории часто меняются и ими нужно управлять через инструкцию
  question: Небольшой декодер и BERT-классификатор показывают сопоставимое качество маршрутизации обращений. Набор категорий продукта часто меняется. Объясни, почему декодер может быть практичнее.
  explanation: При сопоставимом качестве решающей становится гибкость интерфейса. Генеративная модель способна следовать обновлённой инструкции, тогда как размер и смысл выходов классификационной головы BERT обычно фиксируются при обучении.
  kind: open
  reference: Декодер может формировать название или описание категории по текстовой инструкции, поэтому изменение набора категорий иногда сводится к правке промпта. У BERT-классификатора выходная голова обычно привязана к фиксированному набору меток, и его расширение требует изменения головы и нового дообучения.
