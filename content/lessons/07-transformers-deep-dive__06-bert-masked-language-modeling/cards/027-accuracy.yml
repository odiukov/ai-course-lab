- concept: accuracy не учитывает уверенность модели, если наиболее вероятный токен не изменился
  question: Обе версии MLM-модели ставят правильный токен на первое место, но новая версия присваивает ему заметно большую вероятность. Как могут измениться метрики?
  explanation: Accuracy проверяет только совпадение токена с максимальной вероятностью с правильным ответом. В обеих версиях совпадение есть, поэтому она не меняется. Loss равен минус логарифму вероятности правильного токена, поэтому при росте этой вероятности уменьшается.
  kind: choice
  options:
    - Accuracy вырастет, а loss останется прежним
    - Accuracy останется прежней, а loss уменьшится
    - И accuracy, и loss обязательно останутся прежними
    - Accuracy останется прежней, а loss увеличится
  correct: 1
  id: 027-accuracy-1
  fingerprint: 30a3a9a9
- concept: argmax-accuracy не даёт полезного градиентного сигнала для обучения
  question: Почему MLM-модель обычно обучают по кросс-энтропийному loss, а не непосредственно по accuracy? Объясни своими словами.
  explanation: 'Accuracy — ступенчатая метрика: близкий промах и уверенная ошибка получают одинаковый результат, а повышение уверенности в уже правильном ответе не учитывается. Кросс-энтропийный loss чувствителен к таким изменениям и потому подходит для градиентной оптимизации.'
  kind: open
  reference: Accuracy зависит от результата argmax и остаётся неизменной при небольших сдвигах логитов, пока другой токен не выйдет на первое место. Поэтому почти везде она не показывает направление улучшения и не даёт полезного градиента. Кросс-энтропия плавно реагирует на изменение вероятности правильного токена.
  id: 027-accuracy-2
  fingerprint: c9034d96
