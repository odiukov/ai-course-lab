- concept: матрица классификационной головы имеет форму hidden_size × num_classes
  question: 'Encoder представляет каждый токен вектором размерности 12. Для задачи с 3 классами используется умножение строки на матрицу: hW. Какую форму должна иметь матрица W?'
  explanation: Внутренняя размерность матрицы должна совпадать с размерностью скрытого вектора, а число её столбцов — с числом классов. Поэтому умножение вектора длины 12 на матрицу 12 × 3 даёт 3 логита.
  kind: choice
  options:
    - 12 × 15
    - 15 × 12
    - 3 × 12
    - 12 × 3
  correct: 3
  id: 032-code-classify-1
  fingerprint: 3985ca06
- concept: выход случайно инициализированной классификационной головы не имеет содержательного смысла до обучения
  question: Почему нормированные вероятности от новой случайно инициализированной головы классификации ещё нельзя считать осмысленной оценкой тональности текста?
  explanation: Корректная форма выхода и нормировка подтверждают, что прямой проход собран правильно, но не качество классификации. Смысл появляется после обучения весов головы на целевой задаче.
  kind: open
  reference: Softmax лишь нормирует случайные логиты. Пока веса головы не обучены на размеченных примерах, они не связывают представление encoder'а с классами тональности.
  id: 032-code-classify-2
  fingerprint: 2b322b1c
