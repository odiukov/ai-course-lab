- concept: доля маскирования балансирует количество обучающих целей и сохранность контекста
  question: Почему в masked language modeling обычно не маскируют почти все токены последовательности?
  explanation: Слишком высокая доля маскирования оставляет мало подсказок, поэтому восстановление превращается в угадывание частых слов. Слишком низкая доля, напротив, даёт мало обучающих целей на обработанный текст; выбранная в BERT доля балансирует эти крайности.
  kind: choice
  options:
    - Исчезает контекст, необходимый для осмысленного восстановления исходных токенов
    - Encoder перестаёт принимать последовательности переменной длины
    - Модель начинает предсказывать токены только слева направо
    - Словарь модели автоматически сокращается до самых частых токенов
  correct: 0
  id: 005-mlm-signal-1
  fingerprint: 672de12a
- concept: ошибка MLM вычисляется по исходным токенам на выбранных для маскирования позициях
  question: Какие позиции последовательности должны участвовать в вычислении основной ошибки masked language modeling и почему?
  explanation: 'Модель получает обучающий сигнал там, где исходный токен был скрыт: для каждого такого места известен правильный ответ до маскирования. Незамаскированные токены прежде всего служат контекстными подсказками.'
  kind: open
  reference: Ошибка сопоставляет предсказания с исходными токенами на позициях, выбранных для маскирования. Остальные позиции сохраняют контекст и обычно не становятся целями этой ошибки.
  id: 005-mlm-signal-2
  fingerprint: fdf58170
