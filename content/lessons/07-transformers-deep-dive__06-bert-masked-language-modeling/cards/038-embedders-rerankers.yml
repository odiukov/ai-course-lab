- concept: контрастивное обучение формирует геометрию пространства текстовых эмбеддингов
  question: Объясни своими словами, как контрастивный loss должен изменять эмбеддинги подходящих и неподходящих друг другу текстов.
  explanation: 'Контрастивная цель не назначает тексту класс. Она обучает пространство представлений: связанные тексты оказываются близко, а несвязанные — далеко.'
  kind: open
  reference: Он должен увеличивать сходство или уменьшать расстояние между эмбеддингами подходящей пары и делать противоположное для неподходящей пары.
  id: 038-embedders-rerankers-2
  fingerprint: b7661196
- concept: cross-encoder вычисляет балл релевантности после совместного кодирования запроса и документа
  question: Расположи этапы вычисления оценки релевантности cross-encoder-реранкером в правильном порядке.
  explanation: Cross-encoder сначала формирует общий вход для запроса и документа, затем совместно кодирует их и только после этого вычисляет балл пары.
  kind: order
  items:
    - Объединить запрос и документ в последовательность со служебными разделителями
    - Передать объединённую последовательность в BERT-энкодер
    - Преобразовать итоговое представление пары в скалярный балл релевантности
  id: 038-embedders-rerankers-3
  fingerprint: c29d742b
