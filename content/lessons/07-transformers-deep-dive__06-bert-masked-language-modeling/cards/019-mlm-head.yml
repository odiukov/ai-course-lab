- concept: размер выхода MLM-головы равен размеру словаря
  question: Encoder выдал вектор h ∈ R⁶⁴, а словарь содержит 512 токенов. Какие размеры должны иметь матрица W и результат z при вычислении z = hW?
  explanation: Каждая строка W принимает одну координату скрытого вектора, а каждый столбец соответствует одному токену. Поэтому матрица имеет размер 64 × 512, а результат содержит 512 оценок.
  kind: choice
  options:
    - W ∈ R⁶⁴ˣ⁵¹², z ∈ R⁵¹²
    - W ∈ R⁵¹²ˣ⁶⁴, z ∈ R⁶⁴
    - W ∈ R⁶⁴ˣ⁶⁴, z ∈ R⁶⁴
  correct: 0
  id: 019-mlm-head-1
  fingerprint: cdf97c65
- concept: оценка отдельного токена вычисляется скалярным произведением скрытого вектора и столбца MLM-матрицы
  question: Заполни формулу для оценки токена с индексом j, если w_j — соответствующий ему столбец матрицы MLM-головы.
  explanation: Умножение hW одновременно вычисляет скалярное произведение h с каждым столбцом W. Результат hᵀw_j — один логит, относящийся к токену j.
  kind: cloze
  template: z_j = ___
  answer: hᵀw_j
  accept:
    - h^T w_j
    - h · w_j
    - dot(h, w_j)
  id: 019-mlm-head-2
  fingerprint: 557c0f92
- concept: выходы MLM-головы являются логитами, а не вероятностями
  question: Почему сырые выходы MLM-головы нельзя сразу интерпретировать как вероятности токенов и какое преобразование это исправляет?
  explanation: MLM-голова выдаёт логиты, пригодные для сравнения кандидатов. Для вероятностной интерпретации ко всему вектору логитов применяют softmax.
  kind: open
  reference: 'Это произвольные вещественные оценки: они могут быть отрицательными и не обязаны суммироваться до единицы. Softmax преобразует их в неотрицательное распределение вероятностей с единичной суммой, сохраняя порядок оценок.'
  id: 019-mlm-head-3
  fingerprint: 2a7aa44b
