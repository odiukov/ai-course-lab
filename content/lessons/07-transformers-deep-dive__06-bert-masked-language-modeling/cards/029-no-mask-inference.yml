- concept: маскирование наблюдаемого токена обычно повышает неопределённость предсказания на его позиции
  question: 'Одно предложение дважды пропускают через BERT: сначала выбранный токен оставляют во входе, затем заменяют на [MASK]. Почему во втором случае распределение MLM-головы обычно менее уверенное?'
  explanation: В чистом тексте скрытое состояние позиции зависит и от наблюдаемого токена, и от его контекста. При [MASK] собственная лексическая информация исчезает, поэтому контексту часто соответствуют сразу несколько правдоподобных токенов.
  kind: open
  reference: После замены на [MASK] модель теряет прямую информацию о самом токене и вынуждена восстанавливать его только по контексту. Несколько подходящих продолжений могут получить заметные вероятности, поэтому распределение обычно становится шире.
