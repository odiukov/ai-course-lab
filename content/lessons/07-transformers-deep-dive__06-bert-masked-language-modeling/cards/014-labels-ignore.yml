- concept: нецелевые позиции исключаются из функции потерь с помощью согласованного значения ignore_index
  question: MLM-модель выдаёт logits для каждой позиции последовательности. Что следует записать в `labels` для позиции, которая не выбрана обучающей целью?
  explanation: 'В PyTorch таким маркером обычно служит -100. Функция потерь пропускает эти элементы: их предсказания не влияют ни на итоговый loss, ни на градиенты.'
  kind: choice
  options:
    - Маркер, совпадающий со значением `ignore_index` функции потерь
    - Исходный ID токена
    - ID токена с максимальным logit
    - ID маскирующего токена
  correct: 0
  id: 014-labels-ignore-1
  fingerprint: a43902f1
- concept: обучение на неизменённых нецелевых позициях превращает MLM-loss в преимущественно тривиальную задачу копирования входа
  question: Что произойдёт с обучающим сигналом MLM, если вместо `ignore_index` записать исходные токены в метки всех позиций? Объясните своими словами.
  explanation: При обычной доле маскирования только 15% позиций являются целями, а 85% исключаются через -100. Если оценивать все позиции, лёгкие ответы на видимых токенах численно заглушат полезный сигнал от выбранных целей.
  kind: open
  reference: В loss попадут главным образом простые позиции, где исходный токен уже виден во входе. Модель сможет снижать ошибку копированием, а вклад восстановления действительно скрытых токенов окажется подавлен.
  id: 014-labels-ignore-2
  fingerprint: 70ea3f3e
