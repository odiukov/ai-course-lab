  question: Как должна вести себя функция MLM-loss, если в батче нет ни одной целевой позиции?
  explanation: 'При отсутствии целей усреднять нечего: знаменатель был бы нулевым. Явный возврат нулевого скаляра предотвращает деление на ноль и появление NaN.'
