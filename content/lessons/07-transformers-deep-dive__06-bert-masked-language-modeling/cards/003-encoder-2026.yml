  fingerprint: 17e2bf22
- concept: эмбеддинги документов позволяют заранее вычислить индекс для семантического поиска
  question: Почему в системе семантического поиска эмбеддинги документов можно вычислить заранее, а при поступлении запроса обрабатывать только сам запрос?
  explanation: Документный encoder не зависит от будущего запроса, поэтому его результат пригоден для многократного использования. Предварительное индексирование переносит основную часть вычислений из обработки запроса в офлайн-этап.
  kind: open
  reference: Encoder независимо преобразует каждый документ и запрос в вектор общего пространства. Векторы неизменных документов сохраняют в индексе, поэтому во время поиска остаётся получить вектор запроса и найти ближайшие к нему документы.
  id: 003-encoder-2026-2
  fingerprint: e880c66f
- concept: современные encoder-only модели развиваются за счёт новых механизмов внимания, позиционных представлений и блоков преобразования
  question: Какой вывод лучше всего следует из использования в ModernBERT таких компонентов, как Flash Attention, RoPE и GeGLU?
  explanation: ModernBERT сохраняет encoder-only устройство, но обновляет его современными компонентами. Flash Attention ускоряет вычисление внимания, RoPE задаёт позиции, а GeGLU улучшает блоки прямого распространения.
  kind: choice
  options:
    - Encoder-only архитектура продолжает модернизироваться для более эффективной работы с длинным контекстом
    - Encoder-only модели отказались от внимания и вернулись к рекуррентным слоям
    - ModernBERT стал авторегрессионным генератором текста
  correct: 0
  id: 003-encoder-2026-3
  fingerprint: 5c8bfd30
