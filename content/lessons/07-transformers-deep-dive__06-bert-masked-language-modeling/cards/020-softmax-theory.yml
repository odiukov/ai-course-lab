- concept: softmax преобразует логиты в нормированное распределение вероятностей
  question: Заполните пропуск в формуле вероятности токена после применения softmax.
  explanation: 'Экспонента превращает каждый логит в положительный вес, а деление на сумму весов нормирует результаты: все вероятности неотрицательны и в сумме дают единицу.'
  kind: cloze
  template: p_i = ___
  answer: exp(z_i) / Σ_j exp(z_j)
  accept:
    - e^{z_i} / Σ_j e^{z_j}
    - softmax(z)_i
  id: 020-softmax-theory-1
  fingerprint: 704c3fde
- concept: отношение softmax-вероятностей определяется экспонентой разности логитов
  question: Логиты двух токенов равны 7.3 и 5.1. Примерно во сколько раз вероятность первого токена после softmax больше вероятности второго?
  explanation: Общий знаменатель softmax сокращается, поэтому отношение вероятностей равно exp(7.3 − 5.1) = exp(2.2) ≈ 9.03.
  kind: numeric
  answer: 9.03
  tolerance: 0.05
  id: 020-softmax-theory-2
  fingerprint: 7eab7b78
