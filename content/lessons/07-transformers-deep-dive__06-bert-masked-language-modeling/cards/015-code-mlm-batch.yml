- concept: независимый вероятностный отбор даёт переменное число MLM-целей
  question: Каждая допустимая позиция независимо выбирается для MLM с вероятностью mask_prob. Что верно о числе выбранных позиций в последовательности?
  explanation: Сравнение случайного числа с mask_prob — независимое испытание для каждой позиции, а не выбор фиксированной квоты. Поэтому фактическое число целей колеблется, особенно на коротких последовательностях.
  kind: choice
  options:
    - Оно всегда равно заранее рассчитанной квоте
    - Оно случайно меняется между запусками, хотя средняя доля стремится к mask_prob
    - Оно определяется только размером словаря
  correct: 1
  id: 015-code-mlm-batch-1
  fingerprint: c2891058
- concept: MLM-преобразование должно изменять копию токенов, не мутируя вход вызывающего кода
  question: Дополните строку Python, чтобы последующее маскирование не изменяло переданный список tokens.
  explanation: Отдельный список позволяет портить токены для MLM-входа, сохраняя исходную последовательность вызывающего кода неизменной.
  kind: cloze
  template: input_ids = ___
  answer: list(tokens)
  accept:
    - tokens.copy()
    - tokens[:]
  id: 015-code-mlm-batch-2
  fingerprint: a561ac4f
- concept: передаваемый генератор случайных чисел делает построение MLM-батчей воспроизводимым
  question: Как организовать работу create_mlm_batch с генератором случайных чисел, чтобы тесты воспроизводились, а вызывающий код мог управлять случайностью?
  explanation: Явная передача rng отделяет алгоритм маскирования от глобального состояния случайности. Фиксированный сид удобен для тестов, а другой генератор или состояние — для получения новых батчей.
  kind: open
  reference: Принимать генератор rng параметром и в тестах передавать генератор с фиксированным сидом. Одинаковое начальное состояние генератора и одинаковые входные данные дадут одинаковый батч.
  id: 015-code-mlm-batch-3
  fingerprint: '72458914'
