- concept: MLM accuracy вычисляется только по позициям с настоящими метками
  question: Заполни знаменатель при вычислении точности MLM.
  explanation: В числителе и знаменателе учитываются только целевые позиции. Метки со значением -100 исключаются, поэтому деление на длину всей последовательности занизило бы accuracy.
  kind: cloze
  template: |-
    valid = labels != IGNORE_ID
    pred = logits.argmax(axis=-1)
    accuracy = (pred[valid] == labels[valid]).sum() / ___
  answer: valid.sum()
  accept:
    - valid.sum()
    - sum(valid)
    - valid.sum
  id: 028-code-accuracy-1
  fingerprint: 4ec6bc43
- concept: softmax не требуется для выбора наиболее вероятного токена по логитам
  question: Почему при вычислении MLM accuracy можно применять argmax непосредственно к логитам, не вычисляя softmax?
  explanation: Accuracy проверяет только токен, занявший первое место. Softmax меняет численные значения и нормирует их, но не меняет победивший столбец.
  kind: open
  reference: 'Softmax сохраняет порядок логитов: экспонента строго возрастает, а все значения делятся на один общий положительный знаменатель. Поэтому индекс максимального логита совпадает с индексом максимальной вероятности.'
  id: 028-code-accuracy-2
  fingerprint: 9d2e01e4
