<!doctype html>
<meta charset="utf-8">
<title>Одна временная шкала для трёх модальностей</title>
<style>
  :root{
    --bg:#fbfaf7; --fg:#1c1e21; --muted:#6b7280; --line:#3f4854;
    --video:#1d6fb8; --audio:#2f8f5b; --text:#7c4bbd; --accent:#d24a12; --band:rgba(210,74,18,.16);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171b; --fg:#e9eaec; --muted:#9aa3ad; --line:#8b95a1;
      --video:#63b3ed; --audio:#68d391; --text:#c4a3f5; --accent:#ff9a5c; --band:rgba(255,154,92,.20);
    }
  }
  html,body{margin:0}
  .wrap{background:var(--bg);color:var(--fg);padding:10px 12px 12px;
        font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  h2{font-size:15px;margin:0 0 6px;font-weight:600}
  svg{display:block;width:100%;max-height:520px;height:auto}
  .fb{color:var(--muted);font-size:13px}
</style>
<div class="wrap">
  <h2>Одна временная шкала: видео, аудио и текст в общей сетке</h2>
  <div id="host"><noscript class="fb">Три дорожки на одной шкале 0–3 с: видео каждые 0.25 с, аудио каждые 0.02 с, текстовый токен на 2.35 с.</noscript></div>
</div>
<script>
(function(){
  var host=document.getElementById('host');
  try{
    var DATA={
      t0:0, t1:3, tickStep:0.5, axisRow:2.75,
      tracks:[
        {row:0,step:0.25,name:'Видео',sub:'4 кадра/с · шаг 0.25 с',cls:'video',h:0.14,w:2},
        {row:1,step:0.02,name:'Аудио',sub:'50 кадров/с · шаг 20 мс',cls:'audio',h:0.09,w:1},
        {row:2,step:null,name:'Текст',sub:'редко, по репликам',cls:'text',h:0.14,w:2,tokens:[2.35]}
      ],
      moment:{from:2.30,to:2.35,marks:[{t:2.30,row:0},{t:2.32,row:1},{t:2.35,row:2}]},
      span:{from:1.00,to:1.25,count:12}
    };
    var origin={x:168,y:50}, scale={x:225,y:60};
    function sx(v){return origin.x+v*scale.x;}
    function sy(v){return origin.y+v*scale.y;}

    var NS='http://www.w3.org/2000/svg';
    var svg=document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','0 0 900 264');
    svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    svg.setAttribute('role','img');
    svg.setAttribute('aria-label','Три дорожки на одной временной шкале, вертикальный срез 50 мс');

    function el(t,a){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
    function line(x1,y1,x2,y2,stroke,w,dash){
      var e=el('line',{x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),stroke:stroke,'stroke-width':w});
      if(dash)e.setAttribute('stroke-dasharray',dash);return e;
    }
    function label(x,y,dx,dy,s,anchor,fill,size,weight){
      var e=el('text',{x:sx(x)+dx,y:sy(y)+dy,'text-anchor':anchor,fill:fill,
        'font-size':size,'font-family':'system-ui,-apple-system,Segoe UI,Roboto,sans-serif'});
      if(weight)e.setAttribute('font-weight',weight);
      e.appendChild(document.createTextNode(s));return e;
    }
    var C=function(n){return 'var(--'+n+')';};

    el('rect',{x:0,y:0,width:900,height:264,fill:C('bg')});

    /* вертикальный срез 2.30–2.35 */
    var M=DATA.moment;
    el('rect',{x:sx(M.from),y:sy(-0.25),width:sx(M.to)-sx(M.from),height:sy(2.32)-sy(-0.25),
      fill:C('band'),stroke:C('accent'),'stroke-width':1});
    label((M.from+M.to)/2,-0.42,0,0,'один миг · 50 мс','middle',C('accent'),12.5,600);

    /* дорожки */
    DATA.tracks.forEach(function(tr){
      line(DATA.t0,tr.row,DATA.t1,tr.row,C(tr.cls),1);
      if(tr.step){
        for(var t=DATA.t0;t<=DATA.t1+tr.step/2;t+=tr.step){
          var x=Math.min(t,DATA.t1);
          line(x,tr.row-tr.h,x,tr.row+tr.h,C(tr.cls),tr.w);
        }
      }
      if(tr.tokens){
        tr.tokens.forEach(function(t){
          line(t,tr.row-tr.h,t,tr.row+tr.h,C(tr.cls),tr.w);
        });
      }
      label(DATA.t0,tr.row,-14,-3,tr.name,'end',C(tr.cls),13,600);
      label(DATA.t0,tr.row,-14,11,tr.sub,'end',C('muted'),10.5);
    });
    label(2.35,2.36,0,0,'«привет» · 2.35 с','middle',C('text'),11.5);

    /* три токена одного мига */
    M.marks.forEach(function(m){
      el('circle',{cx:sx(m.t),cy:sy(m.row),r:sy(0.06)-sy(0),fill:C('accent')});
    });

    /* 12 аудиокадров между двумя видеокадрами */
    var S=DATA.span;
    line(S.from,0.14,S.from,1.32,C('muted'),1,'3 3');
    line(S.to,0.14,S.to,1.32,C('muted'),1,'3 3');
    line(S.from,1.32,S.to,1.32,C('audio'),1.5);
    line(S.from,1.26,S.from,1.32,C('audio'),1.5);
    line(S.to,1.26,S.to,1.32,C('audio'),1.5);
    label((S.from+S.to)/2,1.5,0,0,S.count+' аудиокадра на 1 видеокадр','middle',C('audio'),11.5);

    /* ось времени */
    line(DATA.t0,DATA.axisRow,3.08,DATA.axisRow,C('line'),1.5);
    var head=el('polygon',{fill:C('line')});
    head.setAttribute('points',[
      sx(3.10)+','+sy(DATA.axisRow),
      sx(3.03)+','+sy(DATA.axisRow-0.06),
      sx(3.03)+','+sy(DATA.axisRow+0.06)].join(' '));
    for(var t=DATA.t0;t<=DATA.t1+DATA.tickStep/2;t+=DATA.tickStep){
      var x=Math.min(t,DATA.t1);
      line(x,DATA.axisRow-0.07,x,DATA.axisRow+0.07,C('line'),1.5);
      label(x,DATA.axisRow,0,20,x.toFixed(1),'middle',C('muted'),11);
      line(x,-0.25,x,DATA.axisRow-0.07,C('line'),0.5,'2 5');
    }
    label(DATA.t0,DATA.axisRow,-14,4,'время, с','end',C('muted'),11.5);

    label(DATA.t0,3.30,0,0,'Вертикаль — смысл: видео 2.30 · аудио 2.32 · текст 2.35 лежат в одном срезе. Горизонталь — только порядок.',
      'start',C('fg'),11.5);

    host.textContent='';
    host.appendChild(svg);
  }catch(e){
    host.innerHTML='<p class="fb">Схема (не отрисовалась): одна шкала 0–3 с, три дорожки — видео с засечкой каждые 0.25 с (4 кадра/с), аудио каждые 0.02 с (50 кадров/с), текстовый токен «привет» на 2.35 с. Между двумя видеокадрами укладывается 12 аудиокадров. Токены 2.30 / 2.32 / 2.35 обведены в один вертикальный столбик шириной 50 мс — для модели это один миг.</p>';
  }
})();
</script>
