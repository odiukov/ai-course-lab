<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Жизненный цикл Task</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1c2530;
    --muted: #5d6b7a;
    --node: #f2f6fb;
    --stroke: #46586b;
    --term: #fdf1ec;
    --term-stroke: #b4602f;
    --accent: #1f6f8b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181d;
      --fg: #e6ecf2;
      --muted: #9aa8b6;
      --node: #1f2731;
      --stroke: #8fa3b6;
      --term: #2b2320;
      --term-stroke: #d78a58;
      --accent: #6fc3d8;
    }
  }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 8px 10px 12px; }
  h2 { font-size: 15px; margin: 0 0 6px; font-weight: 600; }
  svg { display: block; width: 100%; height: auto; max-height: 520px; background: var(--bg); }
  .fallback { font-size: 13px; line-height: 1.5; color: var(--fg); }
</style>
</head>
<body>
<div class="wrap">
  <h2>Жизненный цикл Task: семь состояний, одна петля, четыре тупика</h2>
  <div id="slot"></div>
</div>
<script>
(function () {
  var slot = document.getElementById("slot");
  try {
    var W = 760, H = 380, LW = 1.6, FS = 13, PAD = 9, R = 3.2;

    var nodes = [
      { id: "submitted",      label: "submitted",      x: 1, y: 4, kind: "start" },
      { id: "working",        label: "working",         x: 4, y: 4, kind: "mid" },
      { id: "input_required", label: "input_required", x: 4, y: 1, kind: "mid" },
      { id: "completed",      label: "completed",      x: 8, y: 6, kind: "term" },
      { id: "failed",         label: "failed",         x: 8, y: 4.6, kind: "term" },
      { id: "canceled",       label: "canceled",       x: 8, y: 3.2, kind: "term" },
      { id: "rejected",       label: "rejected",       x: 8, y: 1.8, kind: "term" }
    ];
    var edges = [
      { a: "submitted", b: "working" },
      { a: "submitted", b: "rejected", bend: 1 },
      { a: "working", b: "input_required", side: "left" },
      { a: "input_required", b: "working", side: "right", label: "через message" },
      { a: "working", b: "completed" },
      { a: "working", b: "failed" },
      { a: "working", b: "canceled" }
    ];

    var origin = { x: 96, y: 330 }, scale = 46;
    function sx(x) { return origin.x + x * scale; }
    function sy(y) { return origin.y - y * scale; }

    var by = {};
    nodes.forEach(function (n) { by[n.id] = n; });

    var rx = 2.05 * scale / 2, ry = 0.46 * scale;
    function box(n) { return { cx: sx(n.x), cy: sy(n.y), rx: rx, ry: ry }; }

    // exit point on ellipse boundary toward target
    function edgePoint(n, tx, ty) {
      var b = box(n), dx = tx - b.cx, dy = ty - b.cy;
      var d = Math.hypot(dx / b.rx, dy / b.ry) || 1;
      return { x: b.cx + dx / d, y: b.cy + dy / d };
    }

    var out = [];
    out.push('<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" ' +
      'markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
      '<path d="M 0 0 L 10 5 L 0 10 z" fill="var(--stroke)"/></marker></defs>');

    edges.forEach(function (e) {
      var A = by[e.a], B = by[e.b];
      var ac = box(A), bc = box(B);
      var p, q, d;
      if (e.side) {
        var off = (e.side === "left" ? -1 : 1) * 0.62 * scale;
        p = { x: ac.cx + off, y: ac.cy + (B.y > A.y ? -ry : ry) };
        q = { x: bc.cx + off, y: bc.cy + (B.y > A.y ? ry : -ry) };
        d = "M " + p.x + " " + p.y + " L " + q.x + " " + q.y;
      } else if (e.bend) {
        var mid = { x: sx((A.x + B.x) / 2), y: sy(B.y - 0.9) };
        p = edgePoint(A, mid.x, mid.y);
        q = edgePoint(B, mid.x, mid.y);
        d = "M " + p.x + " " + p.y + " Q " + mid.x + " " + mid.y + " " + q.x + " " + q.y;
      } else {
        p = edgePoint(A, bc.cx, bc.cy);
        q = edgePoint(B, ac.cx, ac.cy);
        d = "M " + p.x + " " + p.y + " L " + q.x + " " + q.y;
      }
      out.push('<path d="' + d + '" fill="none" stroke="var(--stroke)" ' +
        'stroke-width="' + LW + '" marker-end="url(#ah)"/>');
      if (e.label) {
        out.push('<text x="' + (q.x + PAD) + '" y="' + ((p.y + q.y) / 2) +
          '" text-anchor="start" dominant-baseline="middle" font-size="' + FS +
          '" fill="var(--accent)">' + e.label + '</text>');
      }
    });

    nodes.forEach(function (n) {
      var b = box(n);
      var fill = n.kind === "term" ? "var(--term)" : "var(--node)";
      var st = n.kind === "term" ? "var(--term-stroke)" : "var(--stroke)";
      if (n.kind === "term") {
        out.push('<ellipse cx="' + b.cx + '" cy="' + b.cy + '" rx="' + (b.rx + R) +
          '" ry="' + (b.ry + R) + '" fill="none" stroke="' + st +
          '" stroke-width="' + LW + '"/>');
      }
      out.push('<ellipse cx="' + b.cx + '" cy="' + b.cy + '" rx="' + b.rx + '" ry="' + b.ry +
        '" fill="' + fill + '" stroke="' + st + '" stroke-width="' + LW + '"/>');
      out.push('<text x="' + b.cx + '" y="' + b.cy + '" text-anchor="middle" ' +
        'dominant-baseline="middle" font-size="' + FS + '" fill="var(--fg)" ' +
        'font-family="ui-monospace, SFMono-Regular, Menlo, monospace">' + n.label + '</text>');
    });

    // group captions: own anchors, opposite sides
    out.push('<text x="' + sx(1) + '" y="' + (sy(4) + ry + PAD + FS) +
      '" text-anchor="middle" font-size="' + FS + '" fill="var(--muted)">единственный вход</text>');
    out.push('<text x="' + (sx(8) + rx + R + PAD) + '" y="' + sy(3.9) +
      '" text-anchor="start" font-size="' + FS + '" fill="var(--muted)">четыре</text>');
    out.push('<text x="' + (sx(8) + rx + R + PAD) + '" y="' + sy(3.55) +
      '" text-anchor="start" font-size="' + FS + '" fill="var(--muted)">терминальных:</text>');
    out.push('<text x="' + (sx(8) + rx + R + PAD) + '" y="' + sy(3.2) +
      '" text-anchor="start" font-size="' + FS + '" fill="var(--muted)">стрелок наружу нет</text>');
    out.push('<text x="' + (sx(4) - 0.62 * scale - PAD) + '" y="' + sy(2.5) +
      '" text-anchor="end" font-size="' + FS + '" fill="var(--accent)">единственная петля</text>');
    out.push('<text x="' + sx(2.5) + '" y="' + (sy(1.9) - PAD) +
      '" text-anchor="middle" font-size="' + FS + '" fill="var(--muted)">отказ до работы</text>');

    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H +
      '" preserveAspectRatio="xMidYMid meet" role="img" ' +
      'aria-label="Схема жизненного цикла Task: submitted, working, input_required и четыре терминальных состояния">' +
      out.join("") + '</svg>';
    slot.innerHTML = svg;
  } catch (err) {
    slot.innerHTML = '<p class="fallback">Схема должна была показать: единственный вход — ' +
      '<code>submitted</code>; из него две стрелки — в <code>working</code> и в ' +
      '<code>rejected</code> (отказ до работы). Из <code>working</code> — петля ' +
      '<code>working → input_required → working</code>, обратная стрелка подписана ' +
      '«через message». И четыре терминальных состояния — <code>completed</code>, ' +
      '<code>failed</code>, <code>canceled</code>, <code>rejected</code> — из которых ' +
      'не выходит ни одной стрелки.</p>';
  }
})();
</script>
</body>
</html>
