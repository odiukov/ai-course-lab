- concept: конечный сигнал можно представить набором синусоидальных компонент
  question: Какое утверждение выражает основную идею разложения сигнала по Фурье?
  explanation: Разложение Фурье описывает исходный сигнал через синусоидальные компоненты. Частота определяет скорость колебаний компоненты, амплитуда — её вклад, а фаза — временной сдвиг.
  kind: choice
  options:
    - Сложный конечный сигнал можно представить суммой синусоид с различными частотами, амплитудами и фазами
    - Каждый отсчёт waveform независимо хранит частоту звучания в этот момент
    - Разложить на синусоиды можно только сигнал, который сам выглядит как чистая синусоида
    - Частотное представление описывает другой звук, лишь приблизительно похожий на исходный
  correct: 0
  id: 022-fourier-idea-1
  fingerprint: 94be0df5
- concept: фазы компонент необходимы для восстановления формы сигнала
  question: У двух сигналов совпадают частоты и амплитуды всех синусоидальных компонент, но различаются их фазы. Обязаны ли совпадать waveform этих сигналов? Объясните своими словами.
  explanation: Для восстановления сигнала недостаточно знать только частоты и амплитуды. Фазы определяют взаимное выравнивание компонент и тем самым влияют на каждый отсчёт их суммы.
  kind: open
  reference: Нет. Фаза определяет, с какого положения своего периода начинается каждая компонента. При изменении относительных фаз синусоиды складываются иначе, поэтому итоговая форма waveform может измениться даже при прежних частотах и амплитудах.
  id: 022-fourier-idea-2
  fingerprint: 683670b2
- concept: сложный сигнал синтезируется поэлементным суммированием синусоидальных компонент
  question: Расположите действия в порядке синтеза waveform из заданного набора синусоидальных компонент.
  explanation: Все компоненты вычисляются на одной временной сетке и звучат одновременно. Значение итогового waveform в каждом сэмпле равно сумме значений синусоид в этот момент.
  kind: order
  items:
    - Задать частоту, амплитуду и фазу каждой компоненты
    - Вычислить значение каждой синусоиды в моменты дискретизации
    - Сложить значения всех компонент для каждого индекса сэмпла
    - Собрать полученные суммы в итоговый массив waveform
  id: 022-fourier-idea-3
  fingerprint: f6c00c9a
