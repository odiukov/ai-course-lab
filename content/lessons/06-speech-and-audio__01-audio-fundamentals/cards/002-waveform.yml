- concept: время сэмпла вычисляется делением его индекса на sample rate
  question: Аудио записано с sample rate 12000 сэмплов в секунду. Какому времени от начала соответствует сэмпл с индексом 9000? Ответ дайте в секундах.
  explanation: Время вычисляется по формуле t = n / sr. Поэтому 9000 / 12000 = 0.75 секунды.
  kind: numeric
  answer: 0.75
  tolerance: 0.001
