- concept: ручное вычисление DFT использует внешний цикл по частотным bin и внутренний цикл по сэмплам
  question: Расположи действия ручного вычисления DFT в правильном порядке.
  explanation: Для каждого k алгоритм заново проходит весь сигнал по n. Поэтому два вложенных перебора дают квадратичную сложность, из-за которой прямую DFT используют лишь для небольших проверочных примеров, а практический код применяет FFT.
  kind: order
  items:
    - Выбрать очередной частотный bin и обнулить его суммы re и im
    - Перебрать все сэмплы сигнала, добавляя произведения с косинусом и синусом
    - Сохранить полученную пару re и im для выбранного bin
    - Перейти к следующему частотному bin и повторить вычисление
