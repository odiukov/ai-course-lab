- concept: частота k-го bin DFT вычисляется как k · sr / N
  question: DFT рассчитана для сигнала с sample rate 12000 Hz и длиной 600 сэмплов. Какой частоте в герцах соответствует bin с индексом 17?
  explanation: Частота bin вычисляется по формуле f_k = k · sr / N. Поэтому f₁₇ = 17 · 12000 / 600 = 340 Hz.
  kind: numeric
  answer: 340
  tolerance: 0.01
  id: 024-bins-1
  fingerprint: 1b361dd3
- concept: при фиксированном sample rate увеличение N улучшает частотное разрешение ценой более длинного временного окна
  question: Число сэмплов N в кадре DFT увеличили вдвое, сохранив прежний sample rate. Что произойдёт с частотной сеткой и длительностью анализируемого кадра?
  explanation: Шаг сетки равен sr / N, поэтому удвоение N уменьшает его вдвое. Длительность кадра равна N / sr, поэтому она, наоборот, удваивается.
  kind: choice
  options:
    - Шаг между соседними bin уменьшится вдвое, а длительность кадра увеличится вдвое
    - Шаг между соседними bin и длительность кадра уменьшатся вдвое
    - Шаг между соседними bin увеличится вдвое, а длительность кадра уменьшится вдвое
    - Шаг между соседними bin не изменится, а длительность кадра увеличится вдвое
