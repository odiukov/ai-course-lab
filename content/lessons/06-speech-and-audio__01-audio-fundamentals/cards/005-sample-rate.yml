- concept: sample rate измеряет количество сэмплов сигнала, записываемых или воспроизводимых за секунду
  question: Что физически означает sample rate цифровой аудиозаписи?
  explanation: 'Sample rate задаёт временную плотность дискретизации: сколько значений waveform приходится на секунду. Амплитуда хранится в самих сэмплах, а точность каждого значения определяется bit depth.'
  kind: choice
  options:
    - Количество сэмплов сигнала в секунду
    - Максимальную амплитуду сигнала
    - Количество битов, отведённых на один сэмпл
    - Среднюю частоту звука в записи
  correct: 0
  id: 005-sample-rate-1
  fingerprint: 5e1c7ead
- concept: неверно заданный sample rate меняет скорость и высоту воспроизведения без изменения массива сэмплов
  question: Аудиомассив воспроизводят с sample rate выше того, при котором он был записан. Что произойдёт с длительностью и высотой звука и почему?
  explanation: Sample rate определяет скорость чтения массива. Если объявленный rate завысить, те же значения будут воспроизведены за меньшее время; все частоты при этом пропорционально сдвинутся вверх.
  kind: open
  reference: 'Запись прозвучит быстрее и короче, а высота звука повысится: проигрыватель будет считывать больше неизменённых сэмплов за каждую секунду.'
  id: 005-sample-rate-2
  fingerprint: fa6d615a
