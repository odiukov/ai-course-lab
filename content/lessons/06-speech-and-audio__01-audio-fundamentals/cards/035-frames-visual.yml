- concept: число кадров без паддинга определяется количеством полных положений окна
  question: Сигнал содержит 2205 сэмплов. Длина кадра — 441 сэмпл, шаг между началами кадров — 147 сэмплов. Неполный хвост отбрасывается. Сколько кадров получится?
  explanation: После начального кадра возможны floor((2205 − 441) / 147) = 12 полных сдвигов. Вместе с начальным кадром получается 13; следующее окно уже вышло бы за границу сигнала.
  kind: numeric
  answer: 13
  tolerance: 0.001
  id: 035-frames-visual-1
  fingerprint: b93639d6
- concept: длительность перекрытия соседних кадров равна разности длины окна и шага
  question: Аудио режут на кадры длительностью 84 ms с шагом 36 ms. Сколько миллисекунд сигнала содержится одновременно в двух соседних кадрах?
  explanation: Второй кадр начинается через 36 ms после первого, который длится 84 ms. Поэтому общая часть соседних кадров равна 84 − 36 = 48 ms.
  kind: choice
  options:
    - 36 ms
    - 84 ms
    - 120 ms
    - 48 ms
  correct: 3
  id: 035-frames-visual-2
