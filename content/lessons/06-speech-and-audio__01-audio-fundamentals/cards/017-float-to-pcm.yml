- concept: безопасный порядок операций при преобразовании float-аудио в знаковый целочисленный PCM
  question: Расположите операции преобразования нормализованного float-массива в знаковый PCM в правильном порядке.
  explanation: Сначала значения ограничивают диапазоном [-1.0, 1.0], затем масштабируют на 32 767, округляют и только после этого приводят к int16. Раннее приведение переполненных значений может вызвать переход через границу типа и смену знака.
  kind: order
  items:
    - Ограничить значения допустимым нормализованным диапазоном
    - Умножить значения на максимальную положительную амплитуду целевого формата
    - Округлить результаты до ближайших целых
    - Привести массив к целевому целочисленному dtype
  id: 017-float-to-pcm-1
  fingerprint: fb65edbd
- concept: округление к ближайшему уменьшает систематическую ошибку квантования по сравнению с усечением
  question: Почему при переводе масштабированных float-сэмплов в целые значения предпочтительно округлять к ближайшему, а не просто отбрасывать дробную часть?
  explanation: Простое приведение float к int16 отбрасывает дробную часть, поэтому положительные и отрицательные значения смещаются к нулю. Округление к ближайшему распределяет ошибку квантования более симметрично и уменьшает искажения.
  kind: choice
  options:
    - Усечение систематически сдвигает дробные результаты к нулю и увеличивает ошибку квантования
    - Округление автоматически удаляет частоты выше границы Найквиста
    - Округление сохраняет исходный dtype массива
    - Усечение изменяет частоту дискретизации сигнала
  correct: 0
