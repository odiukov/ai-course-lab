- concept: частоты выше границы Найквиста отражаются в слышимый диапазон из-за алиасинга
  question: Синусоиду частотой 19 кГц записывают с частотой дискретизации 30 кГц. На какой частоте в кГц появится её алиас?
  explanation: 'Тон выше границы Найквиста заворачивается вниз: |30 − 19| = 11 кГц. После дискретизации он становится неотличим от синусоиды этой частоты.'
  kind: numeric
  answer: 11
  tolerance: 0.01
  id: 009-nyquist-code-1
  fingerprint: 74f512b5
- concept: низкочастотный фильтр применяют до понижения частоты дискретизации
  question: Расположи действия в правильном порядке при безопасном понижении частоты дискретизации аудио.
  explanation: Фильтр должен удалить слишком высокие частоты до ресемплинга. Если сначала понизить частоту дискретизации, они уже превратятся в ложные низкочастотные компоненты, которые нельзя надёжно отделить от исходного сигнала.
  kind: order
  items:
    - Применить low-pass фильтр с учётом целевой границы Найквиста
    - Понизить частоту дискретизации
    - Передать полученный сигнал следующему этапу обработки
  id: 009-nyquist-code-2
  fingerprint: 2f074858
