- concept: оконная функция уменьшает спектральную утечку от разрывов на границах кадра
  question: Объясни своими словами, зачем перед FFT умножать аудиокадр на оконную функцию.
  explanation: FFT фактически рассматривает конечный кадр как периодически повторяющийся. Несовпадающие значения на его краях образуют искусственный скачок, энергия которого размазывается по спектру. Окно сглаживает края и уменьшает это искажение.
  kind: open
  reference: Оконная функция плавно ослабляет сигнал у границ кадра. Это уменьшает скачок между концом и началом периодически продолженного кадра и тем самым снижает спектральную утечку по соседним частотным bin.
  id: 034-framing-2
  fingerprint: fbe45a34
- concept: перекрытие кадров снижает зависимость анализа от случайного положения границ
  question: Вставь термин, описывающий способ надёжнее анализировать события, пересекающие границы кадров.
  explanation: При перекрытии один и тот же участок сигнала попадает в несколько кадров. Событие, оказавшееся у края одного кадра, будет ближе к середине другого, поэтому его спектральные признаки сохранятся надёжнее.
  kind: cloze
  template: Чтобы краткий звук не анализировался только у случайно выбранного края кадра, соседние кадры делают ___.
