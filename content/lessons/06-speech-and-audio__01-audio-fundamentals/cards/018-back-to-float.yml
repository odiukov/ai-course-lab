- concept: делитель для нормализации знакового PCM выбирают по модулю его отрицательной границы
  question: Сэмплы хранятся в знаковом 8-битном PCM с диапазоном от −128 до 127. Какая формула напрямую переводит весь диапазон в нормализованный float, не создавая значений за его границами?
  explanation: 'У знакового целого типа отрицательная граница на одно деление дальше положительной. Поэтому деление int16 на 32 768 превращает −32 768 ровно в −1.0, а 32 767 — в значение немного меньше 1.0. Для 8-битного PCM действует тот же принцип: делитель равен 128.'
  kind: choice
  options:
    - x = s / 127
    - x = s / 127.5
    - x = s / 128
  correct: 2
  id: 018-back-to-float-1
  fingerprint: fb556c61
- concept: квантование делает преобразование float в PCM и обратно необратимым
  question: Почему преобразование float-аудио в знаковый целочисленный PCM и обратно обычно не возвращает исходные float-значения побитово?
  explanation: Например, исходные 0.5 после квантования становятся 16 383, а обратное деление даёт около 0.49998. Это ожидаемая потеря точности из-за конечного числа уровней int16, а не ошибка обратного преобразования.
  kind: open
  reference: При переводе в PCM непрерывное float-значение округляется до ближайшего целочисленного уровня. Его положение между уровнями теряется, поэтому обратное масштабирование восстанавливает уровень квантования, а не точное исходное число.
  id: 018-back-to-float-2
  fingerprint: 5ac0b48b
