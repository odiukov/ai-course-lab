- concept: ошибка оценки частоты по ближайшему bin не превышает половины шага частотной сетки
  question: DFT построена для сигнала с sample rate 12000 Hz и длиной окна 600 сэмплов. Какова максимально возможная ошибка оценки частоты, если истинный тон относят к ближайшему спектральному bin?
  explanation: Расстояние между соседними bin равно 12000 / 600 = 20 Hz. Истинная частота может находиться не дальше середины промежутка от ближайшего bin, поэтому максимальная ошибка равна 20 / 2 = 10 Hz.
  kind: numeric
  answer: 10
  tolerance: 0.01
  id: 032-peak-2
  fingerprint: 9a470fc8
