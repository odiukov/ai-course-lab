- concept: спектр действительного сигнала обладает комплексно-сопряжённой симметрией
  question: Заполни формулу симметрии DFT для действительного сигнала.
  explanation: У действительного сигнала коэффициенты отрицательных частот комплексно сопряжены коэффициентам соответствующих положительных частот. Поэтому их модули совпадают, а вторая половина спектра не несёт независимой информации.
  kind: cloze
  template: X[N − k] = ___
  answer: conj(X[k])
  accept:
    - X[k]*
    - комплексно-сопряжённое X[k]
  id: 027-bins-visual-1
  fingerprint: e26ae2f3
- concept: нулевой bin DFT представляет постоянную составляющую сигнала
  question: Что показывает нулевой частотный bin DFT и с какой характеристикой waveform он связан?
  explanation: Для нулевого bin все множители DFT равны единице, поэтому коэффициент складывается из значений всех сэмплов. Если waveform центрирован относительно нуля, постоянная составляющая мала.
  kind: open
  reference: Он показывает постоянную составляющую сигнала на нулевой частоте. Его значение связано с суммой сэмплов, а при соответствующей нормализации — со средним значением waveform.
  id: 027-bins-visual-2
  fingerprint: d07842b5
