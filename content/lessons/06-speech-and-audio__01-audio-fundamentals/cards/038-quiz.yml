- concept: radix-2 FFT применима к длине входа, являющейся степенью двойки
  question: Какое условие на длину входного массива требуется для рекурсивной radix-2 FFT?
  explanation: Radix-2 FFT на каждом уровне делит массив на две равные части, поэтому такая рекурсия естественно работает для длины, являющейся степенью двойки.
  kind: choice
  options:
    - Длина должна быть степенью двойки
    - Длина должна совпадать с sample rate
    - Длина должна быть нечётной
    - Длина должна равняться числу ненулевых сэмплов
