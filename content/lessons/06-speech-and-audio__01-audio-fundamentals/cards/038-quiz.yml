- concept: DFT возвращает по одному комплексному частотному коэффициенту на каждый входной сэмпл
  question: Заполни пропуск в формуле размера результата DFT.
  explanation: DFT преобразует последовательность из N сэмплов в N комплексных коэффициентов. Одностороннее представление действительного сигнала может отбросить зеркальную половину, но полная DFT сохраняет N коэффициентов.
