<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Как секунда речи режется на кадры</title>
<style>
:root{--bg:#ffffff;--fg:#1b1f24;--mut:#68727e;--wave:#5b6b7a;--ax:#8b95a1;
--f1:#2563eb;--f2:#ea580c;--f3:#059669;--ov:#9333ea}
@media (prefers-color-scheme:dark){:root{--bg:#14171b;--fg:#e7eaed;--mut:#9aa4af;--wave:#7f8c99;--ax:#6b757f;
--f1:#60a5fa;--f2:#fb923c;--f3:#34d399;--ov:#c084fc}}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,sans-serif}
figure{margin:0;padding:10px 12px}
h2{font-size:15px;margin:0 0 6px;font-weight:600}
svg{display:block;width:100%;height:auto;max-height:470px}
text{font:12px system-ui,sans-serif;fill:var(--fg)}
.mut{fill:var(--mut)}
#fb{color:var(--mut);font-size:13px}
</style>
</head>
<body>
<figure>
<h2>Секунда при 16 kHz: окно 400 сэмплов, шаг 160 сэмплов, ≈98 кадров</h2>
<svg id="s" viewBox="0 0 1080 330" preserveAspectRatio="xMidYMid meet" role="img"
 aria-label="Полоса waveform длиной одна секунда и перекрывающиеся окна по 400 сэмплов с шагом 160"></svg>
<p id="fb" hidden></p>
</figure>
<script>
(function(){
var VB={w:1080,h:330}, PAD={l:46,r:46,t:34,b:34}, LAB=8, TICKLAB=15, FS=12;
try{
  /* ---- данные схемы ---- */
  var D={
    samples:16000, frameLen:400, hop:160, frames:98, overlap:240, mid:8000,
    rows:[{i:1,s:0},{i:2,s:160},{i:3,s:320}],
    y:{wTop:0, wMid:0.9, wBot:1.8, comb:2.6, combT:3.15,
       bar:[4.1,4.9,5.7], barH:0.4, ov:6.6, axis:7.5, tick:0.25}
  };

  /* ---- один origin, один scale, одна пара sx/sy ---- */
  var origin={x:PAD.l, y:PAD.t};
  var scale={x:(VB.w-PAD.l-PAD.r)/D.samples, y:(VB.h-PAD.t-PAD.b)/D.y.axis};
  function sx(x){return origin.x+x*scale.x;}
  function sy(y){return origin.y+y*scale.y;}

  var NS='http://www.w3.org/2000/svg', svg=document.getElementById('s');
  function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
  function line(x1,y1,x2,y2,st,w,dash){var e=el('line',{x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),stroke:st,'stroke-width':w});if(dash)e.setAttribute('stroke-dasharray',dash);return e;}
  function box(x1,y1,x2,y2,f,o,st){var e=el('rect',{x:sx(x1),y:sy(y1),width:sx(x2)-sx(x1),height:sy(y2)-sy(y1),fill:f,'fill-opacity':o,rx:2});if(st){e.setAttribute('stroke',st);e.setAttribute('stroke-width',1.5);}return e;}
  function txt(x,y,dx,dy,anc,s,cls){var e=el('text',{x:sx(x)+dx,y:sy(y)+dy,'text-anchor':anc,'font-size':FS});if(cls)e.setAttribute('class',cls);e.textContent=s;return e;}

  el('rect',{x:0,y:0,width:VB.w,height:VB.h,fill:'var(--bg)'});

  /* ---- waveform: одна секунда ---- */
  var pts=[], n, t, env, v;
  for(n=0;n<=D.samples;n+=40){
    t=n/D.samples;
    env=0.22+0.78*Math.abs(Math.sin(3.3*Math.PI*t+0.4));
    v=env*(0.55*Math.sin(2*Math.PI*220*t)+0.3*Math.sin(2*Math.PI*640*t+1)+0.15*Math.sin(2*Math.PI*1500*t+2));
    pts.push(sx(n).toFixed(1)+','+sy(D.y.wMid+0.85*v).toFixed(1));
  }
  line(0,D.y.wMid,D.samples,D.y.wMid,'var(--ax)',1);
  el('polyline',{points:pts.join(' '),fill:'none',stroke:'var(--wave)','stroke-width':1.2});
  txt(0,D.y.wTop,0,-LAB,'start','waveform: 1 с при 16 kHz = 16 000 сэмплов');

  /* ---- гребёнка начал кадров: шаг 160 сэмплов ---- */
  line(0,D.y.comb,(D.frames-1)*D.hop,D.y.comb,'var(--ax)',1);
  for(var k=0;k<D.frames;k++) line(k*D.hop,D.y.comb,k*D.hop,D.y.combT,'var(--f1)',1);
  txt(D.samples,D.y.comb,0,-LAB,'end','≈98 кадров — по одному на каждые 10 ms');
  txt(0,D.y.combT,0,TERM=TICKLAB,'start','шаг 160 сэмплов (10 ms)','mut');
  txt(D.samples,D.y.combT,0,TICKLAB,'end','(16 000 − 400) / 160 = 97.5, плюс первый кадр = 98','mut');

  /* ---- перекрытие соседних окон: 240 общих сэмплов ---- */
  box(D.hop,D.y.bar[0],D.frameLen,D.y.bar[1]+D.y.barH,'var(--ov)',0.16);
  line(D.hop,D.y.bar[0],D.hop,D.y.ov,'var(--ov)',1,'3 3');
  line(D.frameLen,D.y.bar[0],D.frameLen,D.y.ov,'var(--ov)',1,'3 3');
  line(D.hop,D.y.ov,D.frameLen,D.y.ov,'var(--ov)',1.5);
  txt(D.frameLen,D.y.ov,LAB,4,'start','240 общих сэмплов у соседних кадров');

  /* ---- три первых окна по 400 сэмплов ---- */
  var col=['var(--f1)','var(--f2)','var(--f3)'];
  D.rows.forEach(function(r,j){
    var y0=D.y.bar[j], s=r.s, e=s+D.frameLen;
    box(s,y0,e,y0+D.y.barH,col[j],0.3,col[j]);
    line(s,y0+D.y.barH/2,e,y0+D.y.barH/2,col[j],1);
    txt(e,y0+D.y.barH/2,LAB,4,'start',
      j===0 ? 'кадр 1: сэмплы 0…399 — окно 400 сэмплов (25 ms)'
            : 'кадр '+r.i+': сэмплы '+s+'…'+(e-1));
  });

  /* ---- ось сэмплов ---- */
  line(0,D.y.axis,D.samples,D.y.axis,'var(--ax)',1);
  [0,D.mid,D.samples].forEach(function(x){line(x,D.y.axis,x,D.y.axis+D.y.tick,'var(--ax)',1);});
  txt(0,D.y.axis+D.y.tick,0,TICKLAB,'start','0','mut');
  txt(D.mid,D.y.axis+D.y.tick,0,TICKLAB,'middle','8 000','mut');
  txt(D.samples,D.y.axis+D.y.tick,0,TICKLAB,'end','16 000 сэмплов = 1 с','mut');
}catch(err){
  document.getElementById('s').setAttribute('hidden','');
  var p=document.getElementById('fb'); p.hidden=false;
  p.textContent='Схема должна показывать: полосу waveform длиной 1 с при 16 kHz (16 000 сэмплов), '+
   'поверх неё окна по 400 сэмплов (25 ms) с шагом 160 сэмплов (10 ms) — кадр 1: 0…399, кадр 2: 160…559, '+
   'кадр 3: 320…719, у соседей 240 общих сэмплов; всего (16 000 − 400) / 160 = 97.5 плюс первый кадр ≈ 98 кадров.';
}
})();
</script>
</body>
</html>
