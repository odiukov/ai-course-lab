- concept: трассировка в OpenAI Agents SDK работает по умолчанию и выключается явным opt-out через переменную окружения
  question: Прогоны агента уходят в трассировку, хотя код её нигде не включал. Команда решает выключить сбор спанов полностью. Какую переменную окружения выставить в 1?
  explanation: 'Трассировка — примитив, включённый по умолчанию: спаны собираются без единой строки настройки. Отказ делается явно, переменной OPENAI_AGENTS_DISABLE_TRACING=1. Отсюда типовой прокол: наблюдаемость уже работает и уже что-то отправляет, пока никто не проверял её содержимое.'
  kind: cloze
  template: export ___=1
  answer: OPENAI_AGENTS_DISABLE_TRACING
  accept:
    - OPENAI_AGENTS_DISABLE_TRACING=1
    - openai_agents_disable_tracing
  id: 034-quiz-1
  fingerprint: 746c6e2d
- concept: Session — память диалога, живущая между отдельными прогонами Runner; без неё каждый новый прогон стартует с пустой историей
  question: Пользователь в одном обращении назвал номер заказа, а через минуту в новом обращении спрашивает «когда доставят?». Оба обращения — отдельные вызовы Runner для одного и того же агента, session не передавался. Что увидит модель во втором вызове?
  explanation: Память принадлежит не агенту, а сессии. Session — примитив, который читает историю из бэкенда перед вызовом и дописывает новые ходы после; без него прогон изолирован и знает только то, что пришло в этом вызове.
  kind: choice
  options:
    - 'Историю первого обращения: агент один и тот же, значит и память общая'
    - Только инструкции агента и новую реплику — номер заказа придётся спрашивать заново
    - Историю первого обращения, но урезанную до последнего ответа агента
    - 'Ошибку: без session Runner не запускается'
  correct: 1
