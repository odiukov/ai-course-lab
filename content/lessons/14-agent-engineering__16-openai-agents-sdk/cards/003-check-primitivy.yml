- concept: примитив Agent в OpenAI Agents SDK — это LLM вместе с инструкциями, инструментами и списком хендоффов
  question: В OpenAI Agents SDK из чего складывается примитив Agent?
  explanation: 'Agent упаковывает четыре вещи разом: модель, инструкции, инструменты и список агентов, которым можно передать работу. История диалога — это Session, а журнал — Tracing; они не входят в определение агента.'
  kind: choice
  options:
    - Только модель и системный промпт; инструменты подключаются отдельным объектом рантайма
    - LLM плюс инструкции плюс инструменты плюс доступные хендоффы
    - LLM плюс история диалога плюс журнал трассировки
    - Набор function tools, а модель выбирается уже при запуске раннера
  correct: 1
  id: 003-check-primitivy-1
  fingerprint: 9b6108ea
- concept: встроенная трассировка SDK покрывает спанами генерации LLM, вызовы инструментов, хендоффы и срабатывания guardrail
  question: Что именно попадает в спаны встроенной трассировки OpenAI Agents SDK при обычном прогоне мультиагентной системы?
  explanation: 'Tracing отвечает на вопрос «что записать в журнал» и покрывает все четыре типа событий. Именно поэтому по трассе разбирают, где цепочка ушла не туда: видно и лишний хендофф, и guardrail, остановивший прогон.'
  kind: open
  reference: Спаны создаются на генерации LLM, вызовы инструментов, хендоффы между агентами и проверки guardrail. То есть по трассе видно и каждое обращение к модели, и каждый инструмент, и путь передачи между агентами, и то, где сработала защита.
  id: 003-check-primitivy-2
