- concept: счётчик переходов живёт в состоянии прогона у рантайма, а не в инструкции агента, потому что агент видит только историю и свой промпт
  question: Где должен жить счётчик хендоффов с лимитом 4, чтобы он реально разрывал пинг-понг между агентами?
  explanation: 'Каждый агент видит историю и свою инструкцию, но решение о передаче принимает модель — просить её вести учёт ненадёжно, тем более что у разных агентов инструкции разные и общего счёта ни у кого нет. Переключение агента выполняет рантайм, перехватывая tool-call, поэтому именно там место счётчику: на лимите передача не выполняется, а текущий агент отвечает как есть либо задача уходит человеку.'
  kind: choice
  options:
    - 'В инструкции каждого агента: «не передавай задачу больше четырёх раз»'
    - 'В состоянии прогона на стороне рантайма: рантайм инкрементирует счётчик при каждом хендоффе и на лимите не разрешает следующую передачу'
    - В описании инструмента transfer_to целевого агента
    - В последнем сообщении истории, чтобы каждый следующий агент его прочитал
