- concept: цена петли хендоффов складывается из промптов всех ходов, каждый из которых несёт растущую историю
  question: 'Два агента перекидывают задачу друг другу. Каждый переход — полный ход Runner: история целиком уходит в модель. На первом ходе история весит 2000 токенов и после каждого хода прибавляет 200. Сколько входных токенов суммарно уйдёт на 12 переходов?'
  explanation: 'Промпты образуют арифметическую прогрессию: 2000, 2200, ..., 4200. Сумма = 12*2000 + 200*(0+1+...+11) = 24000 + 13200 = 37200. Ключ в том, что при хендоффе история не сбрасывается, а переносится целиком, поэтому цена петли растёт быстрее, чем число переходов.'
  kind: numeric
  answer: 37200
  tolerance: 1
  id: 025-handoff-drift-1
  fingerprint: f0bfe92d
- concept: 'общий лимит ходов прогона не заменяет счётчик переходов: он срабатывает позже и не отличает петлю маршрутизации от долгой работы'
  question: У прогона уже стоит общий лимит ходов Runner. Почему для защиты от циклической передачи между агентами этого недостаточно?
  explanation: Хендоффы расходуют тот же бюджет ходов, что и полезная работа, поэтому лимит доходит до срабатывания только после десятков пустых переходов и оплаченных промптов. И сообщение о нём говорит про исчерпанный бюджет, а не про причину. Отдельный счётчик переходов бьёт раньше и называет проблему своим именем.
  kind: choice
  options:
    - Общий лимит не применяется к ходам, порождённым вызовом transfer_to
    - Лимит ходов останавливает прогон и позже, чем нужно, и с диагностикой «кончились ходы», по которой не видно, что агенты гоняли задачу по кругу
    - Общий лимит ходов действует только на первого агента цепочки и обнуляется при смене активного агента
    - Лимит ходов проверяется моделью, а не рантаймом, поэтому модель может его проигнорировать
