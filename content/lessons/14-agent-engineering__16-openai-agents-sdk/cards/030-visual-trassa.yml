- concept: длительность родительского спана включает время детей, поэтому виновника задержки ищут в самом глубоком спане, а не в корне
  question: Корневой спан прогона агента длится 9,0 с. Объясни, почему само это число ничего не говорит о том, что чинить, и по какому правилу спускаться по дереву до причины.
  explanation: Смысл дерева в том, что оно даёт не «что случилось», а «внутри чего случилось». Плоский лог покажет те же события, но не позволит вычесть время детей из времени родителя и найти собственное время шага.
  kind: open
  reference: 'Спан родителя охватывает интервалы всех своих детей, поэтому его длительность — это сумма чужой работы, а не своей. Корень всегда «самый долгий» по определению и виновником быть не может. Идти надо вниз: у каждого уровня сравнить детей, выбрать того, кто держит основную долю времени родителя, и раскрыть его; повторять, пока не упрёшься в спан без детей или в спан, у которого большая часть времени не покрыта детьми (собственное время). Именно этот отрезок — конкретная генерация, вызов инструмента или ожидание — и есть цель оптимизации.'
