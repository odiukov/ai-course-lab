- concept: спаны агента, принявшего хендофф, вкладываются под спан хендоффа, поэтому граница между агентами читается по глубине дерева
  question: 'Агент triage вызывает transfer_to_billing_agent, дальше работает биллинговый агент: генерация, вызов инструмента, output guardrail. Как эта работа выглядит в дереве спанов?'
  explanation: 'Хендофф не завершает прогон: рантайм перехватывает tool-call, поднимает целевого агента и продолжает работу внутри того же трейса. Спан хендоффа остаётся открытым, пока работает принявший агент, поэтому его генерации, инструменты и output guardrail оказываются его детьми. Отсюда практическая польза: границу ответственности агентов не нужно вычитывать из атрибутов — она читается по глубине.'
  kind: choice
  options:
    - Спаны биллингового агента становятся потомками спана хендоффа, поэтому смена агента видна как новый уровень вложенности
    - Спаны биллингового агента идут братьями спана хендоффа на том же уровне, а принадлежность агенту хранится только в атрибутах
    - Спаны биллингового агента образуют отдельный трейс со своим корнем, не связанный с трейсом triage
    - Спан хендоффа закрывается последним и становится потомком спана генерации биллинга
