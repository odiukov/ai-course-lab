- concept: parallel выигрывает по хвостовой задержке, потому что время guardrail прячется под временем основного вызова, а blocking добавляет его к каждому прошедшему запросу
  question: Сервис с жёстким SLA на время ответа, доля запросов, которые режет guardrail, пренебрежимо мала. Почему здесь выбирают parallel?
  explanation: Оба режима ловят одинаково, отличается только порядок. В parallel guardrail идёт одновременно с основной LLM, поэтому хвостовая задержка ниже — цена в том, что при срабатывании токены уже потраченного основного ответа выбрасываются. При редких срабатываниях эта цена почти не набегает.
  kind: choice
  options:
    - В parallel guardrail-LLM работает одновременно с основной, поэтому её время прячется под временем основного вызова и не добавляется к ответу
    - В parallel guardrail успевает проверить не только вход, но и промежуточные шаги прогона
    - В parallel tripwire срабатывает надёжнее, потому что решение принимается с уже готовым ответом на руках
    - В parallel основной вызов запускается только после того, как guardrail вернул чистый результат
