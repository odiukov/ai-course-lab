- concept: монолитный промпт слабеет, потому что модель читает все правила на каждый запрос и нерелевантные правила конкурируют за внимание
  question: 'Одному агенту поддержки последовательно дописали правила по четырём доменам: возвраты, техподдержка, юридические ограничения, тарифы. Итоговая инструкция — несколько сотен строк. Почему качество соблюдения каждого отдельного правила падает, хотя модель осталась той же?'
  explanation: 'Дело не в обрезании контекста и не в порядке правил. Системный промпт подаётся модели целиком каждый вызов, поэтому правило про возвраты остаётся в контексте и тогда, когда спрашивают про API-ключ. Чем больше несвязанных доменов в одном промпте, тем больше каждое правило похоже на пункт списка, а не на команду. Лечится разделением на специализированных агентов и хендофами: у каждого агента в контексте только его домен.'
  kind: choice
  options:
    - Модель читает всю инструкцию целиком на каждый запрос, и правила из нерелевантных доменов конкурируют за внимание с нужными
    - Длинная инструкция обрезается по лимиту контекста, и последние правила физически не доходят до модели
    - Модель выполняет только то правило, которое стоит в инструкции первым, остальные игнорирует
    - Каждое новое правило увеличивает температуру сэмплирования и делает ответ случайнее
  correct: 0
  id: 001-problema-odin-agent-1
  fingerprint: 3912be3e
- concept: ограничение, вписанное в промпт того же агента, конфликтует с его основной целью — поэтому guardrail выносят отдельным примитивом
  question: Почему инструкция «никогда не раскрывай персональные данные», вписанная в системный промпт самого агента, надёжна меньше, чем отдельный guardrail? Объясни своими словами.
  explanation: 'Ключевая идея урока: агент и его ограничитель должны быть разными сущностями. Пока запрет живёт в том же промпте, что и цель «помогай», он конкурирует с ней за внимание и не даёт гарантий. Guardrail в OpenAI Agents SDK выносится наружу как отдельная проверка входа/выхода и умеет остановить выполнение независимо от того, что решил сгенерировать основной агент.'
  kind: open
  reference: 'В одном промпте одновременно живут цель «помоги пользователю по максимуму» и запрет «не раскрывай данные» — это прямой конфликт двух инструкций внутри одного распределения, и модель балансирует между ними, а не исполняет запрет жёстко. Проверяющий здесь — тот же самый вызов, который и генерирует ответ, поэтому независимой проверки нет вообще: если генерация уехала, некому её поймать. Guardrail — отдельный примитив SDK, который срабатывает на входе и/или на выходе вне основной генерации, имеет одну задачу (пропустить/остановить) и может прервать выполнение — то есть даёт детерминированную точку контроля, а не ещё один пункт в списке пожеланий.'
  id: 001-problema-odin-agent-2
  fingerprint: f7b3d310
