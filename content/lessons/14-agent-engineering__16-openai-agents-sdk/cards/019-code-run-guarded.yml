- concept: в блокирующем режиме guardrail-вызов оплачивается на всех запросах, а основной — только на прошедших проверку
  question: Обёртка над прогоном агента работает в блокирующем режиме (input-guardrail запускается до основного вызова модели). Guardrail-вызов стоит 300 токенов, основной вызов — 8000 токенов. Из 100 запросов guardrail отсекает 4. Сколько токенов будет потрачено суммарно?
  explanation: 'Guardrail отрабатывает на каждом запросе: 300 × 100 = 30 000. Основной вызов делается только для 96 прошедших: 8000 × 96 = 768 000. Итого 798 000. В параллельном режиме та же нагрузка стоила бы 8300 × 100 = 830 000, потому что там основной вызов уже сделан к моменту срабатывания tripwire.'
  kind: numeric
  answer: 798000
  tolerance: 1
  id: 019-code-run-guarded-1
  fingerprint: 5f0c024f
- concept: порядок операций обёртки одного прогона агента в блокирующем режиме
  question: Расставь шаги обёртки одного прогона агента в блокирующем режиме (input-проверки идут до основного вызова модели).
  explanation: Смысл блокирующего режима именно в том, что выход по input-tripwire происходит раньше основного вызова — иначе экономия токенов исчезает. Output-проверки по определению работают по готовому ответу, поэтому они всегда после основного вызова.
  kind: order
  items:
    - прогнать input-guardrails по пользовательскому вводу
    - при срабатывании поднять InputGuardrailTripwireTriggered, не делая основной вызов
    - выполнить основной вызов модели и записать потраченные токены
    - прогнать output-guardrails по полученному ответу и при срабатывании поднять OutputGuardrailTripwireTriggered
    - вернуть ответ вместе с счётчиком потраченных токенов
  id: 019-code-run-guarded-2
  fingerprint: d7f84a71
- concept: обёртка не должна гасить tripwire-исключение, иначе вызывающий код не отличит блокировку от пустого ответа
  question: Обёртка над прогоном агента ловит InputGuardrailTripwireTriggered внутри себя и возвращает вместо ответа None. Чем плох такой контракт?
  explanation: Tripwire — это сигнал «прогон остановлен политикой», и он должен доходить до вызывающего кода отдельным типом. Свернув его в None, ты сливаешь два разных исхода в один и лишаешься возможности по-разному их логировать и обрабатывать.
  kind: choice
  options:
    - Вызывающий код не может отличить блокировку guardrail от отсутствующего или пустого ответа модели
    - Исключение guardrail нельзя перехватывать, оно должно завершать процесс
    - None ломает счётчик потраченных токенов, потому что токены хранятся в самом ответе
    - Output-guardrails после этого перестают запускаться в параллельном режиме
  correct: 0
