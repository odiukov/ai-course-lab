- concept: 'рантайм-функция запуска guardrails: отбор по стадии, последовательное исполнение, обрыв на первой сработавшей, возврат результатов при чистом проходе'
  question: Функция запускает guardrails агента для одной стадии прогона (вход, выход или вызов инструмента). Расставьте её шаги в правильном порядке.
  explanation: 'Список guardrails агента хранит проверки всех стадий вперемешку, поэтому отбор по стадии идёт первым: output-проверке на входе нечего смотреть — ответа ещё нет. Дальше tripwire — это исключение, а не строка в отчёте: первая сработавшая обрывает прогон, остальные проверки бессмысленны. Чистый проход возвращает результаты, потому что они нужны для спанов трассировки.'
  kind: order
  items:
    - Отобрать из общего списка guardrails только те, чья стадия совпадает с текущей
    - Выполнять отобранные проверки последовательно, в порядке списка
    - На первой сработавшей проверке поднять исключение, соответствующее стадии, и не запускать остальные
    - Если ни одна не сработала — вернуть собранные результаты проверок вызывающему коду
  id: 016-code-run-guardrails-1
  fingerprint: 810775a5
- concept: порядок guardrails внутри стадии влияет на стоимость, потому что исполнение обрывается на первой сработавшей
  question: 'У агента на входной стадии две проверки: фильтр по стоп-словам (без вызова LLM) и классификатор тематики (вызов модели, ~400 токенов). Прогон guardrails останавливается на первой сработавшей. Как выгоднее упорядочить список?'
  explanation: Раз первая сработавшая проверка поднимает исключение, до второй дело не доходит. Дешёвая детерминированная проверка впереди отсекает часть запросов бесплатно. Рантайм порядок не сортирует — это ответственность того, кто собирает список.
  kind: choice
  options:
    - Сначала фильтр по стоп-словам, потом классификатор — на явно плохом запросе токены на классификатор не тратятся
    - Сначала классификатор, потом фильтр — модель точнее, её вердикт надёжнее
    - 'Порядок не важен: рантайм всё равно выполнит обе проверки и соберёт оба результата'
    - 'Порядок не важен: рантайм сам сортирует guardrails по стоимости'
  correct: 0
  id: 016-code-run-guardrails-2
  fingerprint: ffa39a21
- concept: тип исключения tripwire выбирается по стадии guardrail, а не по содержанию нарушения
  question: Guardrail проверяет готовый ответ последнего агента и нашёл в нём номер карты. Какое исключение поднимает рантайм?
  explanation: 'Тип tripwire-исключения определяет стадия: вход первого агента — InputGuardrailTripwireTriggered, выход последнего — OutputGuardrailTripwireTriggered. Содержание нарушения (PII, политика, оффтоп) на тип не влияет: вызывающий код по типу понимает, где именно прогон оборвался.'
  kind: cloze
  template: raise ___("PII found in final answer")
  answer: OutputGuardrailTripwireTriggered
  accept:
    - OutputGuardrailTripwireTriggered()
  id: 016-code-run-guardrails-3
  fingerprint: 0fb7210d
