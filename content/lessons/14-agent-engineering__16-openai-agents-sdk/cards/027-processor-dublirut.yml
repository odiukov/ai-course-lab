- concept: при дублировании спанов рычагом приватности становится содержимое спана, а не выбор получателя
  question: Биллинговый агент принимает номер карты и передаёт его в аргументах function tool. Спаны параллельно уходят в бэкенд OpenAI и в сторонний бэкенд наблюдаемости, а отключить один из адресатов нельзя. Объясни своими словами, где остаётся точка контроля над этими данными и что с ней делать.
  explanation: Ключ в том, что дублирование спанов делает вопрос «кому отдали» неуправляемым, а вопрос «что именно лежит в спане» — управляемым. Поэтому политика чувствительных данных в агентных системах формулируется как требование к полезной нагрузке спана (маскирование, суррогатные идентификаторы), а не как настройка экспортёров.
  kind: open
  reference: 'Раз список получателей закрыт (либо оба, либо трассировки нет), единственный управляемый рычаг — содержимое спана. Спаны несут аргументы инструментов, входы и выходы модели, то есть чувствительное значение попадает в них само собой. Значит защита строится не на маршрутизации, а на данных: не класть секрет в аргументы инструмента (передавать идентификатор/токен вместо самого номера), маскировать или редактировать поля до формирования спана, вычищать полезную нагрузку в собственном процессоре. Последнее защищает только свой бэкенд — копия в OpenAI уже ушла, поэтому редактирование должно происходить выше по потоку, на уровне того, что агент вообще видит.'
  id: 027-processor-dublirut-2
  fingerprint: b206b38e
