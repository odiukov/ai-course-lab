- concept: хендофф выбирается моделью по имени и описанию инструмента, поэтому неверная маршрутизация чинится текстом описания
  question: Агент поддержки постоянно уводит на биллинг-агента вопросы вида «сколько стоит доставка», хотя платёжных проблем там нет. Что исправлять в первую очередь?
  explanation: Раз хендофф — обычный tool, модель выбирает его по имени и описанию, как любой другой инструмент. Расплывчатое описание («вопросы по деньгам») ловит всё подряд. Ни порядок в списке, ни граф связей на решение модели не влияют — влияет прочитанный ею текст.
  kind: choice
  options:
    - 'Описание хендофф-инструмента: сделать его точнее, чтобы отграничить платежи от вопросов о цене'
    - 'Схему связей между агентами: убрать прямое ребро от поддержки к биллингу'
    - Порядок агентов в списке handoffs, чтобы биллинг перестал быть первым кандидатом
    - Температуру модели у агента поддержки, чтобы снизить случайность выбора
