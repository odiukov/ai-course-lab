- concept: переключение агента выполняет рантайм после перехвата tool-call, а не сама модель
  question: Расставь по порядку, что происходит при срабатывании хендоффа в OpenAI Agents SDK.
  explanation: Модель заканчивает свою работу на первом шаге — дальше она ничего не «переключает». Копирование или сворачивание истории, инициализация целевого агента и продолжение прогона — работа рантайма.
  kind: order
  items:
    - Модель делает обычный tool-call с именем transfer_to_<agent_name>
    - Рантайм SDK перехватывает этот вызов вместо выполнения функции
    - Рантайм передаёт целевому агенту историю диалога (копией или свёрнутой)
    - Прогон продолжается уже с инструкциями и инструментами целевого агента
  id: 004-handoff-eto-instrument-3
  fingerprint: 6a337eaa
