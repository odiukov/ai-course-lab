- concept: реальный охват tool guardrails считается по доле инструментов агента, реализованных как function tools
  question: У агента 9 function tools и 6 встроенных инструментов. На каждый function tool поставлен tool guardrail. Сколько процентов инструментов агента реально покрыто проверками?
  explanation: 9 из 15 инструментов = 60%. Остальные 40% — встроенные, к которым guardrail не прикрепляется. В конфиге при этом честно написано «guardrails включены», хотя больше трети поверхности агента открыта.
