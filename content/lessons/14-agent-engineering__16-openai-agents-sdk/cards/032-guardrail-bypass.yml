- concept: покрытие встроенной возможности guardrail восстанавливают, отбирая встроенный инструмент и подменяя его собственным function tool с проверкой внутри
  question: Агенту нужен доступ к содержимому файлов, но встроенный ридер не покрывается tool guardrail. Как вернуть проверку на этот доступ? Опиши два варианта.
  explanation: Guardrail стоит не вокруг агента, а вокруг инструментов, написанных самим разработчиком. Поэтому опасная встроенная возможность либо не выдаётся, либо проксируется своей функцией с проверкой.
  kind: open
  reference: 'Первый вариант — не выдавать встроенный инструмент этому агенту вовсе: набор инструментов собирает разработчик, и отсутствующий инструмент не нужно охранять. Второй — оставить встроенный инструмент закрытым, а вместо него дать собственный function tool (например, read_attachment(ticket_id)), который сам валидирует путь и только потом читает файл. У пользовательской функции есть обёртка SDK, значит есть и точка, куда прицепить tool guardrail. Общий принцип: защита сдвигается раньше вызова — либо к сборке списка инструментов, либо в свою функцию.'
