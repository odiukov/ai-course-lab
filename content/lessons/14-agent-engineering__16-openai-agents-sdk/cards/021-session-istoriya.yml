- concept: 'порядок работы Runner при переданной сессии: чтение истории из бэкенда, вызов модели, дозапись новых ходов'
  question: Расставь по порядку, что делает Runner за один вызов `Runner.run(agent, input, session=session)`.
  explanation: Session — это хранилище (SQLite-файл, Redis, своя база), а Runner — тот, кто его читает до запроса и пополняет после. Разработчик не собирает список сообщений руками, но и не видит, насколько он вырос.
  kind: order
  items:
    - Читает накопленную историю диалога из бэкенда сессии
    - Склеивает историю с новым входом и отправляет запрос модели
    - Получает ответ и дописывает новые ходы обратно в сессию
  id: 021-session-istoriya-2
