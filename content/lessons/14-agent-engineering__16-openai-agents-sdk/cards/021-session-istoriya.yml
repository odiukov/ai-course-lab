- concept: неподрезанная сессия линейно наращивает размер промпта, и накопленная история оплачивается заново в каждом запросе
  question: Диалог ведётся через сессию без подрезки. Один ход занимает в среднем 250 токенов. Сколько токенов истории уйдёт в промпт при отправке запроса, если в сессии уже накоплено 12 ходов?
  explanation: 12 × 250 = 3000 токенов. Рост линейный, и вся история отправляется заново в каждом запросе — даже в том, где пользователь спросил телефон поддержки. Отсюда практика подрезки или суммаризации сессии.
  kind: numeric
  answer: 3000
  tolerance: 1
