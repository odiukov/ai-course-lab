- concept: 'содержимое несут не только спаны генераций и вызовов инструментов: guardrail-спан хранит проверяемый текст, хендофф-спан — перенесённую историю диалога'
  question: Санитайзер спанов обработал только спаны генераций LLM и спаны вызовов инструментов. Какое чувствительное содержимое всё равно уйдёт в бэкенд трассировки?
  explanation: 'SDK отдаёт спан на каждую генерацию, каждый вызов инструмента, каждый хендофф и каждое срабатывание guardrail. Guardrail по определению видит проверяемый текст, а хендофф копирует контекст диалога целевому агенту — оба кладут это в свой спан. Имена, длительности и идентификатор трейса содержимого не несут и как раз должны пережить очистку: по ним читают дерево.'
  kind: choice
