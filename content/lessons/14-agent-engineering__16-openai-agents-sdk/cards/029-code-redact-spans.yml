  question: Расставь шаги функции очистки спанов в правильном порядке (для одного поля с содержимым).
  explanation: 'Оригинал должен попасть в хранилище до подмены поля — иначе текст теряется вместе с перезаписью. Структурные поля не трогают: по типу, имени агента, имени инструмента и длительности потом и читают дерево. Рекурсия обязательна, потому что спаны вложены: без спуска в детей их содержимое уедет наружу нетронутым.'
