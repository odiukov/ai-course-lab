- concept: 'порядок работы рантайма при хендоффе: перенос контекста, инициализация целевого агента, продолжение прогона им'
  question: Модель вызвала инструмент вида transfer_to_<agent_name>. Расставь действия рантайма OpenAI Agents SDK в порядке выполнения.
  explanation: 'Сначала переезжает история (иначе новый агент начнёт с пустого места и заставит пользователя повторяться), потом поднимается сам агент со своей конфигурацией, и только потом цикл ''модель — инструмент — модель'' крутится дальше от его лица. Порядок важен: инициализация без перенесённого контекста дала бы чистую сессию, а не хендофф.'
  kind: order
  items:
    - Контекст диалога переносится к целевому агенту — целиком или свёрнутым через бету nest_handoff_history
    - Целевой агент инициализируется со своими инструкциями и своим набором инструментов
    - 'Прогон продолжается дальше: следующую реплику генерирует уже целевой агент'
  id: 006-tri-shaga-runtime-1
  fingerprint: b202c107
- concept: при хендоффе целевой агент получает накопленную историю диалога, поэтому уже сказанные данные не переспрашиваются
  question: Пользователь назвал номер заказа агенту-маршрутизатору, и лишь несколько реплик спустя тот вызвал transfer_to_billing_agent. Что увидит биллинг-агент?
  explanation: Перенос контекста — первый шаг рантайма. Именно поэтому переспрашивать номер заказа не нужно. Если история распухла, её можно свернуть бетой nest_handoff_history — но это по-прежнему перенос содержания диалога, а не обнуление.
  kind: choice
  options:
    - Всю накопленную переписку, включая номер заказа — рантайм переносит контекст диалога целевому агенту
    - Только текст последнего сообщения пользователя, остальное теряется
    - 'Пустую сессию: у каждого агента своя изолированная история'
    - Аргументы вызова transfer_to и больше ничего
