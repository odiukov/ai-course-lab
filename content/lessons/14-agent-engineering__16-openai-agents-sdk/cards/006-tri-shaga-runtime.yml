- concept: 'хендофф не возвращает управление вызвавшему агенту: у transfer_to нет полезного результата, исходный агент выбывает из прогона'
  question: Обычный инструмент возвращает значение, которое модель читает и продолжает рассуждение. Что получает агент-источник как результат вызова transfer_to_<agent_name>?
  explanation: 'Хендофф — передача самого разговора, а не подзадача. Это отличает его от паттерна ''агент как инструмент'', где вызывающий получает результат и продолжает вести диалог. Отсюда и риск handoff drift: вернуть управление некому, обратный переход — это новый хендофф.'
  kind: choice
  options:
    - 'Ничего полезного: управление не возвращается, после переключения исходного агента в прогоне уже нет'
    - Строку-подтверждение, по которой он решает, продолжать диалог или нет
    - Итоговый ответ целевого агента, чтобы переформулировать его пользователю
    - Структуру с идентификатором целевого агента для последующего опроса статуса
