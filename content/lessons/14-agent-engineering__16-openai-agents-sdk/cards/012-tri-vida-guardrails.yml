- concept: input guardrail не видит аргументы инструментов, потому что они порождаются моделью позже; их проверяет только tool guardrail
  question: Агент-маршрутизатор с input guardrail «только запросы по поддержке» пропустил безобидный вопрос про счёт, передал его агенту биллинга, и тот вызвал инструмент с чужим номером договора в аргументах. Почему input guardrail это не остановил?
  explanation: Три вида guardrails отличаются не строгостью, а точкой установки. Input guardrail стоит на входе первого агента и смотрит ровно на входной текст. Аргументы function tool рождаются внутри прогона, поэтому их ловит только tool guardrail — он же проверяет права доступа и пишет аудит вызовов.
  kind: choice
  options:
    - Input guardrail проверил единственный текст — исходный запрос пользователя, а аргументы инструмента модель сгенерировала позже, уже внутри прогона
    - Input guardrail отключается после первого хендоффа и перестаёт срабатывать у следующих агентов
    - Input guardrail работает только в режиме parallel, а его результат отбрасывается при вызове инструмента
    - Input guardrail проверяет только длину и формат запроса, а содержимое не смотрит
  correct: 0
  id: 012-tri-vida-guardrails-1
  fingerprint: 462bab9a
- concept: сработавший guardrail поднимает исключение и останавливает прогон, а не правит ответ
  question: Guardrail на выходе последнего агента обнаружил утечку персональных данных. Каким исключением SDK сигнализирует об этом?
  explanation: Guardrail не переписывает ответ мягко — он поднимает tripwire-исключение и прогон останавливается. На входе это `InputGuardrailTripwireTriggered`, на выходе `OutputGuardrailTripwireTriggered`. Обработку отказа пишет вызывающий код.
  kind: cloze
  template: |-
    except ___ as e:
        log("output guardrail tripped", e)
  answer: OutputGuardrailTripwireTriggered
  accept:
    - agents.OutputGuardrailTripwireTriggered
  id: 012-tri-vida-guardrails-2
  fingerprint: 407c0f6d
- concept: 'точки установки трёх видов: вход первого агента, выход последнего агента, каждый function tool'
  question: В цепочке из четырёх агентов, соединённых хендоффами, где именно отрабатывают input и output guardrails?
  explanation: Input guardrail стоит на входе первого агента и отсекает небезопасное до любого вызова LLM. Output guardrail — на выходе последнего агента, ловит утечки данных и нарушения политик. Промежуточные передачи ими не покрыты, поэтому дырки внутри цепочки закрывают tool guardrails на каждом function tool.
  kind: choice
  options:
    - Input — на входе каждого из четырёх агентов, output — на выходе каждого
    - Input — на входе первого агента, output — на выходе последнего агента, который отдаёт ответ
    - Input и output одинаково срабатывают на каждом хендоффе между агентами
    - Input — на выходе первого агента, output — на входе последнего
  correct: 1
  id: 012-tri-vida-guardrails-3
  fingerprint: 491fdfeb
