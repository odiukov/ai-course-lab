- concept: трейс — контейнер одного прогона, спан — вложенная в него единица работы с типом и границами по времени
  question: Объясни своими словами, чем трейс отличается от спана в OpenAI Agents SDK и почему спаны вложены друг в друга.
  explanation: Плоский лог даёт только границы прогона. Дерево спанов позволяет вычесть время конкретного этапа из общего и назвать виновника задержки.
  kind: open
  reference: 'Трейс — это один прогон целиком (один запрос пользователя). Спан — отдельная единица работы внутри него: генерация LLM, вызов инструмента, хендофф, guardrail. У спана есть тип, момент начала и момент конца, значит и своя длительность. Спаны вкладываются, потому что работа иерархична: внутри спана агента лежат спаны его генераций, внутри спана генерации — спан вызванного инструмента. Вложенность даёт разбиение общего времени прогона по этапам, а не одно суммарное число.'
  id: 026-tracing-spany-2
  fingerprint: cdd6407b
- concept: разбиение времени прогона по спанам локализует задержку на конкретном этапе, а не на модели целиком
  question: 'Прогон занял 26 с. В трейсе: генерация triage — 0,9 с, input guardrail — 0,4 с, хендофф-спан — почти 0 с, генерация целевого агента — 1,1 с, спан инструмента `fetch_invoice` — 23,5 с. Какой вывод корректен?'
  explanation: 23,5 из 26 с лежат в одном спане инструмента. Все LLM-генерации вместе — 2,0 с, guardrail — 0,4 с, хендофф — почти мгновенный. Оптимизировать надо запрос внутри `fetch_invoice` (индекс, кеш, таймаут), а не модель.
  kind: choice
  options:
    - Узкое место — внешний вызов внутри инструмента; смена модели или сокращение промптов почти ничего не даст
    - 'Узкое место — модель: три LLM-этапа в сумме дают основную задержку'
    - 'Узкое место — хендофф: передача между агентами тянет за собой перенос истории'
    - 'Данных не хватает: длительности спанов не складываются в длительность трейса'
  correct: 0
  id: 026-tracing-spany-3
