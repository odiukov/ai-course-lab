- concept: tool guardrail привязан к событию вызова инструмента, а не к позиции агента в цепочке, поэтому он единственный работает в середине прогона
  question: Почему из трёх видов guardrails в OpenAI Agents SDK только tool guardrail способен что-то проверить в середине многоагентного прогона? Объясни своими словами.
  explanation: 'Разница по природе привязки: края прогона против события вызова. Отсюда практический вывод — покрытие середины длинной цепочки нельзя обеспечить, просто повесив guardrails на вход и выход.'
  kind: open
  reference: 'Input и output guardrails привязаны к краям прогона: первый срабатывает на входе первого агента, второй — на выходе последнего, и каждый срабатывает ровно один раз за прогон. Tool guardrail привязан не к позиции агента, а к событию: любой вызов function tool, на каком бы агенте цепочки он ни случился — на первом, на седьмом. Поэтому попытку удалить файл на седьмом агенте поймает именно он: не потому, что он строже, а потому, что он единственный оказывается в нужной точке. Важное следствие: чем длиннее цепочка хендоффов, тем больше текста проходит вообще без досмотра, и края цепочки этого не компенсируют.'
