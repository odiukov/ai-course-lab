- concept: сборщик промпта не мутирует список истории, иначе повторный вызов с той же историей даст другой результат
  question: Функция сборки промпта получает список истории из сессии и новую реплику. Объясни своими словами, почему дописывать новую реплику надо в копию списка, а не в полученный список, и как проверить, что это сделано правильно.
  explanation: 'Классическая ловушка общего изменяемого состояния: сборщик промпта только читает историю, а запись новых ходов — дело хранилища сессии. Проверка на идемпотентность (два одинаковых вызова = два одинаковых результата) ловит мутацию сразу, до того как дубли начнут копиться в проде.'
  kind: open
  reference: 'Полученный список — это состояние сессии, а не собственность функции. Дописывание в него добавляет новую реплику прямо в хранимую историю. При повторном вызове реплика придёт в промпт дважды: один раз как элемент истории, второй — как новая реплика; дальше дубли накапливаются с каждым ходом и раздувают промпт. Функция должна быть чистой: копировать историю и дописывать в копию. Проверка — вызвать функцию два раза подряд с одной и той же историей и одной и той же репликой; результаты обязаны совпасть символ в символ. Расхождение означает мутацию входа.'
  id: 022-code-session-prompt-3
  fingerprint: 04c20fc0
