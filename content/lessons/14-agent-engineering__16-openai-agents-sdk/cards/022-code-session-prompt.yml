- concept: 'порядок элементов в собранном для модели списке сообщений: инструкции текущего агента, история от старых к новым, новая реплика последней'
  question: Прослойка между хранилищем сессии и вызовом модели собирает плоский список сообщений. Расставь части в том порядке, в каком они попадают в список.
  explanation: 'Модель читает список сверху вниз: инструкции задают роль, история даёт контекст, последняя позиция — то, на что надо отвечать. Инструкции дублировать нельзя, и после хендоффа берутся инструкции нового агента, а не прежнего. Если историю развернуть от новых к старым, модель прочитает диалог задом наперёд и ответит на устаревшую реплику.'
  kind: order
  items:
    - инструкции текущего агента — один раз, в самом начале
    - сохранённые ходы диалога от самых старых к самым новым
    - новая реплика пользователя — последним элементом
  id: 022-code-session-prompt-1
  fingerprint: 59bdf2a8
- concept: лимит истории оставляет хвост диалога, а граница обрезки выравнивается по паре «вопрос — ответ»
  question: В сессии 30 ходов, лимит на историю в промпте — 8 ходов. Как правильно обрезать?
  explanation: 'Актуален хвост: модели нужны последние ходы, а самые старые выбрасываются — легко перепутать и оставить как раз начало. Но резать надо по границе пары «вопрос — ответ»: ответ ассистента без вопроса перед ним читается как утверждение из ниоткуда и путает модель сильнее, чем его отсутствие. Поэтому граница сдвигается на один ход, и в промпт попадает 7 или 8 ходов, но всегда целыми парами.'
  kind: choice
  options:
    - Взять первые 8 ходов — начало разговора задаёт контекст
    - Взять последние 8 ходов ровно по счёту, даже если первым окажется ответ ассистента без вопроса перед ним
    - Взять последние 8 ходов и сдвинуть границу так, чтобы список начинался с реплики пользователя, а не с осиротевшего ответа ассистента
    - Взять 8 ходов из середины — там основная суть диалога
  correct: 2
