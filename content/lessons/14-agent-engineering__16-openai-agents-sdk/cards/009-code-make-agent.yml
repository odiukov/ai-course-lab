- concept: хендоффы в записи агента хранятся именами и разрешаются через реестр, чтобы записи не образовывали циклических ссылок друг на друга
  question: В поле `handoffs` записи агента кладут строковые имена других агентов, а не сами их записи. Какая проблема этим решается в первую очередь?
  explanation: 'Двусторонняя маршрутизация — норма, а не исключение: при хранении прямых ссылок записи начинают ссылаться друг на друга по кругу, что ломает сериализацию, копирование и печать записи. Имя — поздняя привязка: реестр разрешает его в момент самой передачи, и агентов можно регистрировать в любом порядке. Имена инструментов вида `transfer_to_*` строятся отдельно, при сборке списка инструментов для модели, — в записи их нет.'
  kind: choice
  options:
    - Взаимные передачи (A умеет к B, B умеет обратно к A) дали бы циклическую структуру объектов; по имени рантайм находит агента в общем реестре
    - Строки занимают меньше памяти, чем словари
    - Модель не может вызвать инструмент, если его аргумент — объект
    - Имена автоматически превращаются в `transfer_to_*` без участия кода сборки
  correct: 0
