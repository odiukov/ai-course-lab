- concept: 'безопасный шаблон необязательного списочного параметра: sentinel None плюс создание нового списка в теле функции'
  question: Чем заменить пропуски, чтобы каждый вызов фабрики получал собственные списки?
  explanation: '`None` — неизменяемый sentinel: он безопасно живёт в дефолтах, а новый список создаётся внутри тела на каждый вызов. Поле при этом всё равно присутствует в записи со значением `[]`, поэтому код рантайма читает `agent["handoffs"]` без проверок на наличие ключа и без `KeyError` на агенте, который никому не передаёт управление.'
  kind: cloze
  template: |-
    def make_agent(name, instructions, tools=___, handoffs=___):
        return {
            "name": name,
            "instructions": instructions,
            "tools": list(tools) if tools else [],
            "handoffs": list(handoffs) if handoffs else [],
        }
