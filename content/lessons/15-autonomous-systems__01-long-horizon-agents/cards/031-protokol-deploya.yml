- concept: 'ограничение считается слоем защиты, только если исполняется вне контроля агента: иначе один сбой снимает и действие, и проверку'
  question: Лимит расходов в 500 долларов записан в системном промпте, и агент сам решает, когда остановиться. Почему это не считается независимым слоем защиты?
  explanation: 'Слои защитного контура должны отказывать независимо. Лимит, исполняемый рассуждением самого агента, разделяет с ним точку отказа: дрейф цели или взлом награды снимает и действие, и ограничение сразу. Тот же лимит, вшитый в платформу или прокси над API, останавливает прогон независимо от того, что агент решил.'
  kind: choice
  options:
    - Потому что лимит в промпте нельзя изменить во время прогона
    - Потому что тот же сбой рассуждения, который ведёт к перерасходу, отключает и проверку лимита
    - Потому что 500 долларов — слишком маленький лимит для ночного прогона
    - Потому что промпт не сохраняется в журнале действий
  correct: 1
