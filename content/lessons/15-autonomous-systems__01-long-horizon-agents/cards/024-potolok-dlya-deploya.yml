- concept: консервативный горизонт деплоя равен идеальному горизонту, умноженному на коэффициент переноса
  question: Идеальный горизонт модели по бенчмарку — 96 часов экспертного труда. Команда выбрала коэффициент переноса 0,15. Сколько часов экспертной сложности задачи допустимо поручать агенту в проде?
  explanation: 'H_deploy = k · H_ideal = 0,15 · 96 = 14,4 часа. Коэффициент меньше единицы всегда сжимает горизонт: бенчмарковое число задаёт верхнюю границу, а рабочий лимит получают умножением на измеренный запас.'
  kind: numeric
  answer: 14.4
  tolerance: 0.1
  id: 024-potolok-dlya-deploya-1
  fingerprint: 450d5605
- concept: стоп-краны, бюджеты и человеческие чекпоинты ограничивают ущерб и не являются основанием повысить коэффициент переноса
  question: Команда добавила к агенту жёсткие лимиты бюджета, стоп-краны и обязательные чекпоинты с человеком. Как это влияет на коэффициент переноса k?
  explanation: 'k отражает измеренную способность агента на реальных задачах. Стоп-краны и чекпоинты — это контроль последствий: они дешевле делают неудачу, но не увеличивают долю доведённых до конца длинных задач. Смешивать одно с другим — значит подпирать смелую оценку горизонта средствами, которые лишь режут убыток.'
  kind: choice
  options:
    - 'Позволяет повысить k: защитные механизмы доказывают, что агент справится с более длинными задачами'
    - 'Не повышает k: они ограничивают ущерб от ошибки, но не увеличивают способность агента доводить длинную задачу до конца'
    - 'Обнуляет необходимость в k: при наличии стоп-кранов горизонт деплоя равен идеальному'
    - Влияет только на бюджет прогона, к горизонту отношения не имеет
  correct: 1
