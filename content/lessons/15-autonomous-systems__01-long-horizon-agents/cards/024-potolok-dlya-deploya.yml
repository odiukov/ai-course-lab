- concept: величину коэффициента переноса задают наблюдаемость прогона и цена невыявленной ошибки, а не только качество модели
  question: Два одинаковых агента разворачивают в двух системах. В первой траектория хорошо просматривается и ошибку легко откатить, во второй телеметрии мало, а ошибка попадает наружу к клиентам. Что верно про коэффициенты переноса?
  explanation: k — не константа модели, а решение про допустимый риск в конкретной системе. Чем позже обнаруживается отклонение и чем дороже его последствия, тем короче должен быть отрезок автономной работы, поэтому коэффициент уменьшают.
  kind: choice
  options:
    - 'Коэффициенты равны: модель одна и та же, значит горизонт деплоя один'
    - Во второй системе коэффициент берут меньше — слабая наблюдаемость и высокая цена ошибки требуют большего запаса
    - Во второй системе коэффициент берут больше, чтобы компенсировать нехватку телеметрии длиной прогона
    - Коэффициент определяется только распределением задач и от наблюдаемости не зависит
  correct: 1
