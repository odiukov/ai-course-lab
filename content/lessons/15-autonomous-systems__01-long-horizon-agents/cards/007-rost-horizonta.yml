- concept: экспоненциальный рост задаёт постоянный множитель за равный интервал, а не постоянную прибавку в абсолютных единицах
  question: Горизонт задач растёт экспоненциально с периодом удвоения 11 месяцев. За первые 11 месяцев он вырос с 9 до 18 часов. Каким он станет ещё через 11 месяцев?
  explanation: 'При экспоненциальном росте за равный промежуток повторяется множитель, а не слагаемое: 9 → 18 → 36. Прибавка при этом растёт (сначала 9 часов, потом 18), хотя множитель неизменен.'
  kind: choice
  options:
    - 27 часов — прибавка за равный промежуток одна и та же
    - 36 часов — прежнее значение снова умножается на два
    - 45 часов — прибавка растёт быстрее удвоения
  correct: 1
  id: 007-rost-horizonta-1
  fingerprint: '80816728'
- concept: горизонт после t месяцев равен начальному значению, умноженному на 2 в степени «число пройденных периодов удвоения»
  question: Начальный горизонт 3 часа, период удвоения 9 месяцев. Каким будет горизонт через 27 месяцев (в часах)?
  explanation: 27 / 9 = 3 пройденных удвоения, значит множитель 2³ = 8, и 3 · 8 = 24 часа. Ошибка «прибавлять по 3 часа за период» дала бы 12 часов.
  kind: numeric
  answer: 24
  tolerance: 0.1
  id: 007-rost-horizonta-2
  fingerprint: e0eb4dbb
- concept: время роста в заданное число раз зависит только от периода удвоения, а не от того, с какого значения начали
  question: Две системы растут с одинаковым периодом удвоения 10 месяцев. Первая сейчас на горизонте 4 часа, вторая — 40 часов. Кому нужно меньше времени, чтобы вырасти вчетверо?
  explanation: 'Рост в 4 раза — это два удвоения независимо от стартового уровня: 2 · 10 = 20 месяцев для обеих. Разной будет только абсолютная прибавка в часах.'
  kind: choice
  options:
    - 'Первой: маленькие значения растут быстрее'
    - 'Второй: у неё больше абсолютный прирост за период'
    - 'Обеим одинаково: по 20 месяцев'
  correct: 2
