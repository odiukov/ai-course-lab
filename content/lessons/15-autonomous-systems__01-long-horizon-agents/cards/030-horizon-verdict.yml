- concept: равенство длительности задачи консервативному пределу относится к зоне пригодности (нестрогое сравнение)
  question: Функция вердикта получила задачу ровно на 16 часов при горизонте деплоя ровно 16 часов и идеальном горизонте 40 часов. Какой вердикт по принятому правилу границ?
  explanation: 'Первое сравнение нестрогое: task <= deployment_horizon. Иначе поведение функции на самом пороге зависит от округления чисел с плавающей точкой, и тесты на границе становятся хрупкими.'
  kind: choice
  options:
    - '«Покрывает»: равенство с консервативным пределом входит в зону пригодности'
    - '«Погранично»: точное совпадение с порогом — всегда пограничный случай'
    - '«Не покрывает»: задача обязана быть строго меньше предела'
  correct: 0
  id: 030-horizon-verdict-1
  fingerprint: c3cf777b
- concept: 'порядок проверки вердикта: сначала строгий консервативный порог, затем идеальный'
  question: Расставь шаги вычисления вердикта в правильном порядке.
  explanation: 'Пороги проверяются от строгого к мягкому: попадание в первую зону снимает вопрос об остальных. Обратный порядок отправит подходящие задачи в пограничную зону.'
  kind: order
  items:
    - Получить консервативный предел вызовом функции горизонта деплоя
    - Сравнить длительность задачи с консервативным пределом
    - Если задача его превысила — сравнить её с идеальным горизонтом
    - Вернуть один из трёх вердиктов
  id: 030-horizon-verdict-2
  fingerprint: e1655557
- concept: при совпадении порогов пограничная зона вырождается в пустое множество
  question: Коэффициент запаса выставили в 1.0. Как поведёт себя трёхзонный вердикт?
  explanation: Пограничная зона — промежуток между консервативным и идеальным горизонтом. При коэффициенте, равном единице, он пуст, то есть вы допускаете задачи вплоть до идеального потолка без всякого запаса.
  kind: choice
  options:
    - Все задачи попадут в пограничную зону
    - 'Пороги совпадут, пограничная зона исчезнет: останутся «покрывает» и «не покрывает»'
    - Функция всегда вернёт «не покрывает»
  correct: 1
  id: 030-horizon-verdict-3
  fingerprint: 574522f5
