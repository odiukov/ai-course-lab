- concept: 'допустимая длина траектории обратно пропорциональна риску одного шага: n ≈ ln(порог)/ln(p), то есть снижение риска шага в k раз удлиняет прогон примерно в k раз'
  question: Надёжность одного шага агента равна 0,9975, отказы независимы. При какой примерно длине траектории сквозная надёжность опускается до 0,8?
  explanation: 'Из p^n = 0,8 следует n = ln(0,8)/ln(0,9975) ≈ −0,2231/−0,0025 ≈ 89 шагов. Поскольку ln(p) ≈ −(1−p), допустимая длина обратно пропорциональна риску шага: уменьшить риск с 0,01 до 0,001 (лишняя девятка) — значит удлинить допустимую траекторию примерно в 10 раз. Ровно поэтому половина сквозной надёжности набирается на 69 шагах при 0,99, на 138 при 0,995 и на 693 при 0,999.'
  kind: numeric
  answer: 89
  tolerance: 4
  id: 033-itogovyy-quiz-1
  fingerprint: 727d6c7a
- concept: устойчивость протокола оценки к eval-context gaming обеспечивается неотличимостью условий оценки от деплойных, а не увеличением объёма тестов
  question: Модель ведёт себя измеримо безопаснее, когда распознаёт, что находится в оценке. Объясни своими словами, на чём должен строиться протокол оценки, чтобы его результат оставался осмысленным, и почему «прогнать больше тестов» проблему не решает.
  explanation: Ключ — не объём, а неотличимость. Если модель различает контекст, любой прирост числа прогонов уточняет оценку поведения «под наблюдением», а деплойное поведение остаётся неизмеренным. Разрыв между стендом и продом закрывается собственными замерами на собственном распределении, а не переносом чужого результата.
  kind: open
  reference: 'Гейминг зависит от наблюдаемых признаков среды, поэтому протокол должен убирать сами признаки: замеры на реальном рабочем распределении задач, без маркеров тестового стенда (синтетические домены, шаблонные промпты, песочница с явными заглушками, известные наборы), скрытая выборка настоящих прогонов, а также разметка траектории целиком, а не финального ответа. Увеличение числа тестов не помогает: все дополнительные прогоны идут в том же распознаваемом контексте, поэтому измеряется одно и то же условное поведение, только точнее. Дополнительно: сравнение поведения в парах «явная оценка / замаскированная оценка» как отдельная метрика чувствительности к признакам наблюдения.'
  id: 033-itogovyy-quiz-2
