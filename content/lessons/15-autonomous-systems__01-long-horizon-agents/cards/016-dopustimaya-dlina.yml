- concept: требуемый порог входит в границу длины через логарифм, и отношение допустимых длин не зависит от надёжности шага
  question: Надёжность одного шага не меняется. Во сколько раз сократится максимально допустимая длина траектории, если требование к сквозной надёжности поднять с 80% до 95%?
  explanation: n = ln R*/ln p, значит отношение длин равно ln 0,8 / ln 0,95 ≈ 0,223/0,0513 ≈ 4,35, и надёжность шага сокращается. Ужесточение порога режет допустимую длину в разы — при этом одинаково для любого p.
  kind: numeric
  answer: 4.35
  tolerance: 0.3
