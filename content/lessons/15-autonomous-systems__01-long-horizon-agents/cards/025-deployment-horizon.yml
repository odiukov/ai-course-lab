- concept: 'коэффициент запаса — доля единицы, а не процентное число: подстановка процента раздувает лимит в сто раз'
  question: Функция консервативного горизонта деплоя ожидает коэффициент запаса как долю. Инженер хочет разрешить агенту 40% идеального горизонта в 90 часов и передаёт вторым аргументом 40. Что вернёт функция?
  explanation: '90 × 40 = 3600. Правильный вызов — 90 × 0.4 = 36. Ошибка тихая: тестов на тип аргумента нет, а в прод уезжает лимит, в сто раз больший идеального горизонта.'
  kind: choice
  options:
    - 3600 часов — лимит вырос в сто раз вместо сокращения
    - 36 часов — функция сама распознает проценты
    - 90 часов — значения больше единицы игнорируются
  correct: 0
  id: 025-deployment-horizon-1
  fingerprint: 63e2b1a5
- concept: коэффициент запаса режет допустимую длину задачи, но не меняет поведение агента
  question: Команда снизила коэффициент запаса с 0.5 до 0.2 и пересчитала горизонт деплоя. Что изменилось?
  explanation: Коэффициент — свойство вашего решения о допуске, а не модели. Он меняет только границу, ниже которой вы готовы отдать задачу; надёжность шага и измеренный горизонт остаются теми же.
  kind: choice
  options:
    - Агент стал реже ошибаться на отдельном шаге
    - Сократилась допустимая длина задачи, поведение агента прежнее
    - Уменьшился идеальный горизонт модели
  correct: 1
