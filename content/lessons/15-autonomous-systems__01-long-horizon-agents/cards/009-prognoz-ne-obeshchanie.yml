- concept: экстраполяция — условное утверждение при допущении «темп сохранится», предсказание требует отдельно обосновать само это допущение
  question: Объясни своими словами, чем экстраполяция тренда отличается от предсказания и какое допущение делает экстраполяция.
  explanation: Ключевое различие — условность. Расчёт по тренду верен ровно настолько, насколько верно допущение о неизменности темпа, и подтверждать это допущение нечем изнутри самих данных.
  kind: open
  reference: 'Экстраполяция продолжает уже наблюдавшуюся зависимость при явном условии «наклон сохранится» и показывает, куда это условие приводит. Предсказание — более сильное утверждение: оно требует оценить, сохранится ли темп вообще (не упрётся ли подход в технические пределы, не изменятся ли задачи и способы измерения, не ускорит ли рост новый метод). Сама линия на эти вопросы не отвечает, поэтому её продолжение — сценарий при условии, а не утверждение о будущем.'
