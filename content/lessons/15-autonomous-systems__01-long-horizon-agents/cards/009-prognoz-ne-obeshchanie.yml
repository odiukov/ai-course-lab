- concept: экстраполированный горизонт используется как нагрузочный сценарий для проектных решений, а не как срок в плане
  question: Как корректно применять экстраполированные значения горизонта при проектировании агентной системы?
  explanation: Экстраполяция не сообщает, что случится, но показывает масштаб, который опасно не учесть. Полезное действие — проверить, переживут ли этот масштаб механизмы контроля, а не переносить числа в сроки обязательств.
  kind: choice
  options:
    - Как дату, к которой можно обещать заказчику автономную работу такой длительности
    - Как сценарий, который должны выдержать контроль доступа, наблюдаемость и возможность остановить агента, если он наступит
    - Как повод отложить решения до появления подтверждённых замеров
  correct: 1
