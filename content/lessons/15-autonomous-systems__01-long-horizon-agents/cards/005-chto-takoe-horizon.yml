- concept: 'процедура построения горизонта: разметка задач временем эксперта, прогон модели, подгонка логистической кривой, взятие точки пересечения'
  question: Расставь шаги построения метрики Time Horizon для модели в правильном порядке.
  explanation: Метрика сжимает россыпь успехов и провалов в одно человекочитаемое число. Без разметки экспертным временем шкала по горизонтали не существует, без подгонки кривой нет точки пересечения.
  kind: order
  items:
    - Разметить каждую задачу набора временем, которое тратит на неё человек-эксперт
    - Прогнать модель по задачам и отметить успехи и провалы
    - Подогнать логистическую кривую вероятности успеха против логарифма экспертного времени
    - Взять точку, где кривая пересекает уровень половинной вероятности успеха, — это и есть горизонт
  id: 005-chto-takoe-horizon-1
  fingerprint: d0ccd558
- concept: логарифмическая шкала по горизонтали нужна, потому что экспертное время задач охватывает несколько порядков
  question: Почему по горизонтальной оси при подгонке кривой откладывают логарифм экспертного времени, а не само время?
  explanation: Диапазон в несколько порядков требует логарифмической шкалы. На ней рост способностей выражается ровным трендом с постоянным временем удвоения, что и делает сравнение моделей осмысленным.
  kind: choice
  options:
    - Потому что логарифм убирает шум в замерах времени экспертов
    - Потому что набор охватывает задачи от минуты до многих часов — несколько порядков, и на линейной шкале короткие задачи слиплись бы у нуля
    - Потому что вероятность успеха обязана быть линейной функцией времени
  correct: 1
  id: 005-chto-takoe-horizon-2
  fingerprint: 7c783d6b
- concept: горизонт — середина плавной кривой, а не жёсткая граница возможностей модели
  question: Модель имеет горизонт, соответствующий задачам на двенадцать часов экспертной работы. Что из этого следует?
  explanation: Логистическая кривая — плавный переход, а не ступенька. Горизонт описывает середину зависимости успеха от сложности, поэтому отдельные исходы по обе стороны от него нормальны.
  kind: choice
  options:
    - Все задачи короче этого уровня модель решает, все длиннее — проваливает
    - 'Кривая успеха плавная: модель может провалить более короткую задачу и решить более длинную, а горизонт лишь отмечает середину зависимости'
    - Модель гарантированно решает любую задачу такого класса при достаточном числе попыток
  correct: 1
