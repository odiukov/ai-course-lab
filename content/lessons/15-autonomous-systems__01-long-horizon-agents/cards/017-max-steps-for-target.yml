- concept: 'код обратного расчёта: целая часть вниз от отношения логарифмов'
  question: Функция принимает надёжность шага p (строго меньше единицы) и минимально допустимую сквозную надёжность target. Верни наибольшее допустимое целое число шагов. Заполни пропуск.
  explanation: Отношение логарифмов даёт дробную границу; floor отсекает её вниз до целого. int здесь работает так же, потому что отношение положительно.
  kind: cloze
  template: |-
    import math

    def max_steps_for_target(p, target):
        return ___
  answer: math.floor(math.log(target) / math.log(p))
  accept:
    - math.floor(math.log(target)/math.log(p))
    - int(math.log(target) / math.log(p))
    - math.floor(math.log(target, p))
  id: 017-max-steps-for-target-1
  fingerprint: d8c51f55
- concept: направление округления дробной границы диктуется требованием «не ниже порога»
  question: Обратный расчёт дал дробное число шагов. Почему его округляют вниз, а не по обычным правилам к ближайшему целому?
  explanation: 'Округление к ближайшему может вернуть длину, при которой порог уже нарушен: у границы 4,7 значение 5 шагов даёт надёжность ниже требуемой. Требование «не ниже порога» допускает только отсечение вниз.'
  kind: choice
  options:
    - 'Потому что дробная часть означает: следующий полный шаг уже уводит сквозную надёжность ниже порога'
    - Потому что число шагов принято записывать целым, а направление округления роли не играет
    - Потому что округление вверх завышает надёжность шага, а не длину траектории
  correct: 0
  id: 017-max-steps-for-target-2
  fingerprint: ac2dc0f7
- concept: 'критерий максимальности результата: n держит порог, а n+1 уже нет'
  question: Функция вернула n шагов при надёжности шага p и цели target. Какая проверка подтверждает, что это именно максимум?
  explanation: 'Первое условие говорит, что найденная длина допустима, второе — что её нельзя увеличить. Вариант с p^(n−1) невозможен: сквозная надёжность с длиной убывает, поэтому более короткая траектория всегда надёжнее.'
  kind: choice
  options:
    - p^n ≥ target и одновременно p^(n+1) < target
    - p · n ≥ target и p · (n+1) < target
    - p^n ≥ target и p^(n−1) < target
  correct: 0
  id: 017-max-steps-for-target-3
  fingerprint: ae9f7f82
