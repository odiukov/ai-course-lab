- concept: горизонт определён относительно набора задач, критерия успеха и порога надёжности, поэтому числа с разных методик несопоставимы
  question: 'Две команды публикуют горизонт своих агентов: 3 часа и 5 часов. Наборы задач, критерий успеха и порог надёжности у них разные. Что отсюда следует?'
  explanation: 'Горизонт — не свойство модели само по себе, а результат измерения: он привязан к набору задач, к тому, что считается успехом, и к порогу надёжности, на котором берётся точка кривой. Сменив любой из трёх параметров, получаем другое число для той же модели, так что сравнивать можно только измерения по одной методике.'
  kind: choice
  options:
    - Второй агент способнее первого примерно в 5/3 раза
    - 'Числа несопоставимы: горизонт определён относительно конкретного набора задач, критерия успеха и порога надёжности'
    - Числа сопоставимы, если у обеих команд одинаковая архитектура модели
    - Сопоставить можно, взяв среднее двух горизонтов
