- concept: результат оценки — потолок способностей в идеальных условиях, а не пол надёжности в деплое
  question: Как правильно читать опубликованный результат агента на бенчмарке при планировании продового запуска?
  explanation: 'Оценка проводится в контролируемых условиях, на чужом распределении задач и там, где модель может распознать проверку. Это даёт потолок, а не пол: продовые данные, доступы, сбои инструментов и цена ошибки могут только ухудшить результат.'
  kind: choice
  options:
    - 'Как нижнюю границу: в реальной работе агент справится как минимум с этим'
    - Как верхнюю границу способностей в идеализированных условиях, которую в деплое нужно опускать
    - Как среднее ожидаемое качество, одинаковое для теста и продакшена
  correct: 1
  id: 023-proverka-eval-deploy-1
  fingerprint: c6e6d8d0
- concept: перенос результата на прод требует собственной оценки на собственном распределении задач и условий
  question: Ты хочешь понять, справится ли агент с твоим рабочим потоком. Что даёт наиболее обоснованный ответ?
  explanation: Публичные наборы и сравнения моделей отвечают на вопрос «кто сильнее вообще», но не на вопрос «что будет у меня». Перенос начинается с явного перечисления отличий твоих условий от тестовых и заканчивается прогоном на собственном распределении.
  kind: choice
  options:
    - Свежий публичный бенчмарк с большим числом задач
    - Собственная оценка на твоих типичных задачах, доступах и помехах
    - Сравнение нескольких моделей между собой на одном общем наборе
  correct: 1
  id: 023-proverka-eval-deploy-2
  fingerprint: cf3a98a2
