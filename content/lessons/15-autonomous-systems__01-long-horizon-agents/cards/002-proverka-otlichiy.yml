- concept: 'экспоненциальный рост горизонта: время удвоения около семи месяцев'
  question: Время удвоения горизонта задач держится около 7 месяцев. Через сколько месяцев горизонт вырастет примерно в 8 раз, если тренд сохранится?
  explanation: 'Рост в 8 раз — это три удвоения: 8 = 2³. Три удвоения по 7 месяцев дают 21 месяц. Та же арифметика объясняет путь от секунд у ранних моделей до часов: это примерно 14–15 удвоений, то есть рост в десятки тысяч раз.'
  kind: numeric
  answer: 21
  tolerance: 1
