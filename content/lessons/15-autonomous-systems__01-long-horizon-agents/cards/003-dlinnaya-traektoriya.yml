- concept: ошибка агента материализуется как состояние внешнего мира, а не как отклоняемый текст
  question: Чем ошибка автономного агента качественно отличается от ошибки в одноразовом ответе чат-бота?
  explanation: Текст неверного ответа можно просто не принять. Агент действует во время прогона, поэтому исправлять приходится не формулировку, а последствия связанных действий — и часть из них необратима.
