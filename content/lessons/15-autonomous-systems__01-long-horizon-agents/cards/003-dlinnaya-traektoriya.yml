- concept: надёжность длинного прогона определяется обнаружением отклонения, остановкой и обратимостью, а не средней точностью шага
  question: Почему фразы «модель почти всегда справляется с отдельным шагом» недостаточно, чтобы считать длинный прогон надёжным? Что нужно оценивать дополнительно?
  explanation: Длинный горизонт превращает отдельные промахи в накопительный процесс. Поэтому механизмы обнаружения, остановки и отката весят больше, чем пошаговая точность.
  kind: open
  reference: 'Результат каждого шага становится входом следующего, поэтому ранняя ошибка не остаётся локальной: агент продолжает рассуждать последовательно, но внутри неверной картины мира, и ошибка долго остаётся незамеченной. Оценивать надо: замечает ли агент отклонение от цели, умеет ли остановиться, и можно ли откатить уже сделанные действия.'
