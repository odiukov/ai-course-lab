- concept: траекторию агента нельзя расписать заранее, потому что каждое действие меняет среду и определяет допустимый следующий шаг
  question: Объясни своими словами, почему полную последовательность действий автономного агента нельзя зафиксировать заранее, до запуска.
  explanation: 'Отсюда растут все дальнейшие проблемы длинного горизонта: если траектория не известна заранее, её нельзя ни проверить целиком до запуска, ни оценить по одному финальному ответу.'
  kind: open
  reference: 'Каждое действие меняет внешнюю среду и порождает новую ситуацию: файл перемещён, запрос вернул неожиданный формат, инструмент выдал ошибку. Следующий шаг выбирается по фактическому результату предыдущего, а не по заранее заданному сценарию. Заранее фиксируются цель и границы, конкретная траектория складывается во время прогона.'
  id: 001-ot-chata-k-agentu-3
