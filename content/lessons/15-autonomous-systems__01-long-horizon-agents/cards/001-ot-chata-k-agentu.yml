- concept: 'структура одного круга агентного цикла: наблюдение состояния, выбор действия, исполнение, проверка изменения'
  question: Расставь этапы одного круга работы автономного агента в правильном порядке.
  explanation: 'Цикл замкнут: проверка результата — вход для следующего наблюдения. Если убрать последний этап, агент превращается в набор несвязанных одиночных действий.'
  kind: order
  items:
    - Посмотреть на текущее состояние задачи
    - Выбрать следующее действие
    - Выполнить действие
    - Проверить, как изменилось состояние, и решить, нужен ли ещё круг
