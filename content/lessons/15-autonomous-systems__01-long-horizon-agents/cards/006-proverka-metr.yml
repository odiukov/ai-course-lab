- concept: на задачах уровня горизонта вероятность успеха около 50%, поэтому горизонт нельзя читать как порог надёжности
  question: Команда планирует запускать агента на задачах ровно того класса, что соответствует его горизонту. Чего стоит ожидать?
  explanation: Горизонт берётся на пересечении с линией 50%, то есть это уровень «монетка», а не уровень надёжной работы. Для продакшена нужны задачи заметно ниже горизонта либо внешние проверки и откаты.
  kind: choice
  options:
    - Около половины таких задач закончится провалом — горизонт задан уровнем вероятности успеха 50%
    - Практически все такие задачи будут выполнены, ведь они входят в диапазон возможностей модели
    - Успех будет зависеть только от домена задачи, вероятность здесь не при чём
  correct: 0
