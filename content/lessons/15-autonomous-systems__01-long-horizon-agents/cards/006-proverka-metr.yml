- concept: горизонт — агрегат по разнородным доменам набора, а не оценка в одной предметной области
  question: Набор задач для оценки горизонта покрывает разработку софта, кибербезопасность, ML-исследования и общее рассуждение. Как это влияет на трактовку одного числа горизонта?
  explanation: Горизонт сжимает разнородный набор в одно человекочитаемое число, и эта компрессия теряет разброс по доменам. Для решения о деплое в конкретной области нужна оценка на задачах этой области.
  kind: choice
  options:
    - Число одинаково применимо к любой отдельной области — домены усредняются без потерь
    - 'Это агрегат по разнородным доменам: в конкретной области способности модели могут быть заметно выше или ниже общего числа'
    - Домены не влияют на метрику, потому что учитывается только время эксперта
  correct: 1
