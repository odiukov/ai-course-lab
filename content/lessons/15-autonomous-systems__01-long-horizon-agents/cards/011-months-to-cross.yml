- concept: область определения модели роста — строго положительные начальный горизонт, цель и период удвоения
  question: Какой ввод функция расчёта времени до порога обязана отклонить явной ошибкой?
  explanation: При нуле или отрицательном значении отношение и логарифм не определены, а деление на нулевой период удвоения невозможно — модель теряет смысл. Дробный период допустим, а совпадение цели со стартом даёт корректное нулевое ожидание.
  kind: choice
  options:
    - Дробный период удвоения
    - Нулевой или отрицательный начальный горизонт, целевой горизонт либо период удвоения
    - Цель, совпадающую с начальным горизонтом
