- concept: аналитическая формула даёт точный момент пересечения между отсчётами, тогда как перебор целых шагов даёт лишь верхнюю границу
  question: Чем расчёт момента пересечения по формуле лучше перебора горизонта помесячно?
  explanation: Перебор проверяет только сетку отсчётов и потому округляет ответ вверх до ближайшего отсчёта. Поэтому функция возвращает дробное число месяцев без округления, а перевод в календарные отметки делают уже на уровне отображения.
  kind: choice
  options:
    - Формула даёт точный момент, в том числе внутри месяца, а перебор — лишь первый отсчёт, где порог уже пройден
    - Формула учитывает изменение периода удвоения, а перебор — нет
    - Перебор всегда занижает момент пересечения
