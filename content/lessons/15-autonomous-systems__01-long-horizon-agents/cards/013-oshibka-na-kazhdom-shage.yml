- concept: удвоение длины траектории возводит сквозную надёжность в квадрат
  question: Прогон из 30 однотипных шагов завершается успешно с вероятностью 0,8. Какова сквозная надёжность прогона из 60 таких же шагов?
  explanation: 'Прогон из 60 шагов — это два независимых блока по 30, каждый из которых должен пройти целиком: 0,8 × 0,8 = 0,64. В общем виде удвоение длины возводит сквозную надёжность в квадрат, утроение — в куб. Поэтому «сделаем задачу вдвое длиннее» стоит куда дороже, чем звучит.'
  kind: numeric
  answer: 0.64
  tolerance: 0.02
