- concept: 'число элементарных действий растёт как степень: коэффициент ветвления в степени глубины дерева декомпозиции'
  question: 'Поручение агенту раскладывается строго по дереву: каждый узел даёт ровно 5 более мелких частей, и таких уровней дробления 3. Сколько элементарных действий окажется на нижнем уровне?'
  explanation: 'Каждый уровень декомпозиции умножает число узлов на коэффициент ветвления: 5^3 = 125. Поэтому добавление одного уровня дробления не прибавляет несколько шагов, а умножает их количество — короткое поручение снаружи разворачивается в сотни шагов внутри.'
  kind: numeric
  answer: 125
  tolerance: 0.5
  id: 021-derevo-zadachi-1
  fingerprint: ff6f9c27
- concept: провал проверки на узле обесценивает результаты зависимых от него узлов, а не только сам узел
  question: Агент выполнил проверку промежуточного результата и обнаружил, что исходное решение на раннем узле дерева было неверным. Какую часть работы придётся пересматривать?
  explanation: Рёбра дерева — это зависимости по данным. Результат неверного узла уже попал во все узлы ниже по зависимости, значит они построены на неверном входе и подлежат пересчёту. Узлы из независимых ветвей переделывать не нужно — этим дерево отличается и от «переделать один шаг», и от «переделать всё».
  kind: choice
  options:
    - 'Только этот узел: остальные результаты уже получены и остаются валидными'
    - Этот узел и все узлы, которые использовали его результат как вход
    - Всё дерево целиком, включая ветви, не связанные с этим узлом
    - 'Ничего: достаточно записать расхождение в лог и продолжить'
  correct: 1
  id: 021-derevo-zadachi-2
  fingerprint: 24becd71
- concept: параллелизуемость подзадач ограничена рёбрами зависимости, а не числом подзадач
  question: Задача разложена на много подзадач. Что определяет, сколько из них агент может выполнять одновременно?
  explanation: Декомпозиция даёт не список, а граф зависимостей. Подзадача стартует, когда готовы её входы, поэтому длинная цепочка зависимых узлов не ускоряется от того, что подзадач много. Ширина уровня задаёт лишь верхнюю границу параллелизма, а фактическую — структура рёбер.
  kind: choice
  options:
    - Общее количество подзадач на уровне
    - Глубина дерева декомпозиции
    - 'Наличие зависимостей: одновременно идут только подзадачи, чьи входы уже готовы'
    - Средняя длительность одной подзадачи
  correct: 2
  id: 021-derevo-zadachi-3
  fingerprint: a5eaed4e
