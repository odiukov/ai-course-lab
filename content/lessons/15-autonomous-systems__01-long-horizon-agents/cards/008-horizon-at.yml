- concept: 'доля периода даёт мультипликативную долю: за половину периода удвоения величина растёт в √2 раз'
  question: Начальный горизонт 6 часов, период удвоения 9 месяцев. Чему равен горизонт через 4.5 месяца (в часах)?
  explanation: '4.5/9 = половина периода, множитель равен 2^0.5 ≈ 1.414, то есть 6 × 1.414 ≈ 8.49 часа. Половина периода не означает половину прироста: два таких отрезка подряд должны перемножиться в двойку, а 1.414 × 1.414 = 2.'
  kind: numeric
  answer: 8.49
  tolerance: 0.1
