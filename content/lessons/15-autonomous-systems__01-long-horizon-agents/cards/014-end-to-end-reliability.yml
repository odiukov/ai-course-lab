- concept: риск прогона — дополнение сквозной надёжности до единицы, а не сумма пошаговых рисков
  question: Функция должна вернуть вероятность того, что за прогон случится хотя бы одна ошибка. Шаги независимы и равнонадёжны. Заполни пропуск.
  explanation: «Хотя бы одна ошибка» — отрицание события «все шаги успешны». Наивная сумма steps · (1 − p) переоценивает риск и на длинной траектории даёт число больше единицы, что вероятностью быть не может.
  kind: cloze
  template: |-
    def failure_risk(p, steps):
        return ___
  answer: 1 - p ** steps
  accept:
    - 1 - p**steps
    - 1 - pow(p, steps)
    - 1 - math.pow(p, steps)
  id: 014-end-to-end-reliability-1
  fingerprint: b187d447
- concept: 'монотонность сквозной надёжности: она не растёт с длиной и никогда не превышает надёжность одного шага'
  question: Какое свойство обязана выполнять корректная реализация функции сквозной надёжности?
  explanation: Каждый добавленный шаг — ещё одно условие, которое должно выполниться, поэтому итог может только падать. Если реализация выдаёт значение выше надёжности шага или растущее с длиной, в ней вместо степени умножение или сложение.
  kind: choice
  options:
    - Результат не возрастает при увеличении числа шагов и никогда не превышает надёжность одного шага
    - Результат растёт пропорционально числу шагов при надёжности шага меньше единицы
    - Результат совпадает со средней надёжностью шага независимо от длины траектории
  correct: 0
  id: 014-end-to-end-reliability-2
  fingerprint: dcf9adb0
