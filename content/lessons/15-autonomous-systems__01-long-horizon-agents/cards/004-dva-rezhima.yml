- concept: профиль стоимости длинного прогона имеет тяжёлый хвост, поэтому планировать бюджет по среднему нельзя
  question: Что означает «тяжёлый хвост» в профиле стоимости прогонов длинного агента и какой практический вывод из этого следует?
  explanation: У однократного вызова профиль стоимости предсказуемый. У длинного агента редкие затяжные прогоны определяют реальные расходы, поэтому нужны жёсткие лимиты на шаги и токены.
  kind: choice
  options:
    - Стоимость растёт равномерно с длиной задачи, поэтому среднего достаточно для планирования бюджета
    - Большинство прогонов дешёвые, но редкий прогон может стоить как сотня средних, поэтому бюджет и лимиты надо ставить по хвосту, а не по среднему
    - Стоимость непредсказуема только на первом запуске, дальше она стабилизируется
  correct: 1
