- concept: 'поверхность отказа длинного агента шире способностей модели: добавляются дрейф, зацикливания и взлом награды'
  question: У однократного чат-бота поверхность отказа сводится к способностям модели. Что добавляется к ней у агента длинного горизонта?
  explanation: 'Эти режимы отказа невозможны в одном ходе: они появляются, когда агент многократно перечитывает собственные результаты, накапливает состояние и сам оценивает прогресс.'
  kind: choice
  options:
    - Только задержки сети и таймауты инструментов
    - Дрейф от исходной цели, зацикливания и взлом награды — то есть режимы отказа, возникающие из самого цикла
    - Только рост числа опечаток в длинном тексте
  correct: 1
