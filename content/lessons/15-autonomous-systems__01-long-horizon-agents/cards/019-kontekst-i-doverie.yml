- concept: чекпоинт — сохранённый снимок состояния и решений после завершённого этапа, дающий точку возврата и проверки
  question: Что именно даёт чекпоинт в длинном агентном прогоне?
  explanation: 'Чекпоинт — снимок, а не защита. Он не влияет на цену вызова и не делает следующий шаг верным, зато даёт зафиксированную точку: с неё можно перезапуститься и на ней можно проверить, какие ограничения и решения агент нёс дальше.'
  kind: choice
  options:
    - Снижает стоимость одного вызова модели
    - 'Фиксирует состояние и принятые решения после завершённого этапа: к нему можно вернуться и по нему можно проверять работу'
    - Гарантирует, что следующий шаг агента будет выполнен без ошибки
  correct: 1
