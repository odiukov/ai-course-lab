- concept: 'рост окна контекста не отменяет уровней памяти: объём наблюдений длинного прогона растёт быстрее окна, а внимание к ранним деталям падает'
  question: 'Объясни своими словами: почему более длинное окно контекста не решает проблему памяти многочасового агентного прогона?'
  explanation: 'Ключ в том, что длина прогона не ограничена, а окно ограничено всегда. Плюс стоимость: сырая история переотправляется на каждом шаге.'
  kind: open
  reference: 'Многочасовой прогон производит наблюдения, выводы инструментов и следы рассуждения непрерывно, поэтому объём истории растёт вместе с длительностью и любое фиксированное окно рано или поздно переполняется. Пока окно не переполнено, тоже есть цена: чем длиннее лента, тем хуже агент удерживает ранние детали среди свежих, и тем дороже каждый шаг. Поэтому память строят уровнями: краткое рабочее состояние, отдельное хранилище устойчивых ограничений и чекпоинты завершённых этапов — а не одну бесконечную ленту.'
