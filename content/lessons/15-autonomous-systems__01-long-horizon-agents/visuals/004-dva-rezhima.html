<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Один ход и длинный горизонт</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f8fc;
    --panel: #ffffff;
    --panel-soft: #eef2ff;
    --ink: #172033;
    --muted: #5d6980;
    --line: #8995aa;
    --accent: #5b5bd6;
    --accent-soft: #dedfff;
    --tool: #087e8b;
    --tool-soft: #d9f3f2;
    --cost: #b35c00;
    --cost-soft: #fff0d4;
    --stop: #247447;
    --stop-soft: #dff4e7;
    --shadow: #d7dce7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111622;
      --panel: #1a2231;
      --panel-soft: #242b52;
      --ink: #eef2ff;
      --muted: #aeb9cc;
      --line: #758198;
      --accent: #a7a5ff;
      --accent-soft: #303462;
      --tool: #66d8d6;
      --tool-soft: #173f45;
      --cost: #ffc16e;
      --cost-soft: #4b341b;
      --stop: #78d69a;
      --stop-soft: #1e4730;
      --shadow: #0b0f18;
    }
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--ink); }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  figure { margin: auto; background: var(--bg); }
  figcaption {
    font-size: 24px;
    font-weight: 750;
    text-align: center;
    color: var(--ink);
  }
  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 480px;
    background: var(--bg);
  }
  text { font-family: inherit; fill: var(--ink); }
  .section { font-size: 15px; font-weight: 800; letter-spacing: .08em; }
  .node-title { font-size: 16px; font-weight: 750; }
  .body { font-size: 14px; }
  .small { font-size: 12px; fill: var(--muted); }
  .metric { font-size: 14px; font-weight: 700; }
  .big { font-size: 20px; font-weight: 800; }
  .line { fill: none; stroke: var(--line); stroke-width: 2px; }
  .accent-line { fill: none; stroke: var(--accent); stroke-width: 3px; }
  .tool-line { fill: none; stroke: var(--tool); stroke-width: 2px; }
  .stop-line { fill: none; stroke: var(--stop); stroke-width: 3px; }
  .panel { fill: var(--panel); stroke: var(--shadow); stroke-width: 2px; }
  .soft { fill: var(--panel-soft); stroke: var(--accent); stroke-width: 2px; }
  .tool { fill: var(--tool-soft); stroke: var(--tool); stroke-width: 2px; }
  .cost { fill: var(--cost-soft); stroke: var(--cost); stroke-width: 2px; }
  .stop { fill: var(--stop-soft); stroke: var(--stop); stroke-width: 2px; }
  .arrow { fill: var(--line); }
  .arrow-accent { fill: var(--accent); }
  .arrow-tool { fill: var(--tool); }
  .arrow-stop { fill: var(--stop); }
</style>
</head>
<body>
<figure>
  <figcaption>Один ход и длинный горизонт</figcaption>
  <svg id="diagram" viewBox="0 0 1200 452" width="1200" height="452"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="svgTitle svgDescription">
    <title id="svgTitle">Сравнение одного хода чат-бота и длинной агентной петли</title>
    <desc id="svgDescription">Слева запрос напрямую переходит в ответ. Справа агент выполняет сотни шагов, обращается к инструментам, накапливает расходы, проверяет результат и самостоятельно останавливается.</desc>
  </svg>
</figure>
<script>
const D = {
  zero: 0,
  canvas: { w: 1200, h: 452 },
  radius: 14,
  head: {
    right: [[0, -6], [11, 0], [0, 6]],
    left: [[11, -6], [0, 0], [11, 6]],
    down: [[-6, 0], [0, 11], [6, 0]],
    up: [[-6, 11], [0, 0], [6, 11]]
  },
  panels: [
    { x: 20, y: 42, w: 360, h: 382, cls: "panel" },
    { x: 400, y: 42, w: 780, h: 382, cls: "panel" }
  ],
  sectionLabels: [
    { x: 44, y: 72, text: "ЧАТ-БОТ · ОДИН ХОД", anchor: "start" },
    { x: 424, y: 72, text: "АГЕНТ · ДЛИННЫЙ ГОРИЗОНТ", anchor: "start" }
  ],
  leftBoxes: [
    { x: 46, y: 132, w: 116, h: 80, cls: "soft", title: "Запрос", body: "контекст" },
    { x: 238, y: 132, w: 116, h: 80, cls: "soft", title: "Ответ", body: "результат" }
  ],
  leftArrow: {
    points: [[162, 172], [227, 172]],
    tip: [[216, 166], [227, 172], [216, 178]],
    label: { x: 194, y: 152, text: "один переход", anchor: "middle" }
  },
  bot: {
    x: 126, y: 262, w: 148, h: 58,
    title: "Локальный ход",
    body: "без долгой памяти"
  },
  leftMetrics: [
    { x: 200, y: 358, text: "секунды", anchor: "middle" },
    { x: 200, y: 386, text: "около 10³ токенов", anchor: "middle" }
  ],
  agentNodes: [
    { x: 430, y: 112, w: 138, h: 64, title: "Найти файлы", tag: "прочитать" },
    { x: 602, y: 112, w: 150, h: 64, title: "Проверить", tag: "требования" },
    { x: 786, y: 112, w: 144, h: 64, title: "Составить", tag: "структуру" },
    { x: 964, y: 112, w: 174, h: 64, title: "Подготовить", tag: "черновики" },
    { x: 964, y: 224, w: 174, h: 64, title: "Сверить", tag: "результат" },
    { x: 786, y: 224, w: 144, h: 64, title: "Исправить", tag: "ошибки" },
    { x: 602, y: 224, w: 150, h: 64, title: "Сохранить", tag: "состояние" }
  ],
  flow: [
    { a: [568, 144], b: [591, 144], tip: [[580, 138], [591, 144], [580, 150]] },
    { a: [752, 144], b: [775, 144], tip: [[764, 138], [775, 144], [764, 150]] },
    { a: [930, 144], b: [953, 144], tip: [[942, 138], [953, 144], [942, 150]] },
    { a: [1051, 176], b: [1051, 213], tip: [[1045, 202], [1051, 213], [1057, 202]] },
    { a: [964, 256], b: [941, 256], tip: [[952, 250], [941, 256], [952, 262]] },
    { a: [786, 256], b: [763, 256], tip: [[774, 250], [763, 256], [774, 262]] }
  ],
  loop: {
    points: [[602, 256], [530, 256], [530, 202], [499, 202], [499, 187]],
    tip: [[493, 198], [499, 187], [505, 198]],
    label: { x: 514, y: 235, text: "следующий шаг", anchor: "end" }
  },
  tools: [
    { x: 430, y: 316, w: 128, h: 48, title: "Инструменты", body: "файлы · поиск" },
    { x: 574, y: 316, w: 128, h: 48, title: "Чекпоинты", body: "память · планы" }
  ],
  toolLinks: [
    { points: [[494, 316], [494, 276]], tip: [[488, 287], [494, 276], [500, 287]] },
    { points: [[638, 316], [638, 299]], tip: [[632, 310], [638, 299], [644, 310]] }
  ],
  ellipsis: {
    x: 720, y: 326, w: 210, h: 38,
    text: "… сотни шагов …"
  },
  cost: {
    x: 946, y: 316, w: 192, h: 48,
    title: "Расходы растут",
    body: "10⁵–10⁷ токенов"
  },
  costLink: {
    points: [[1051, 288], [1051, 305]],
    tip: [[1045, 294], [1051, 305], [1057, 294]]
  },
  stop: {
    x: 766, y: 382, w: 236, h: 34,
    text: "Критерий выполнен → стоп"
  },
  stopLink: {
    points: [[871, 288], [871, 371]],
    tip: [[865, 360], [871, 371], [877, 360]],
    label: { x: 883, y: 346, text: "самостоятельная остановка", anchor: "start" }
  },
  horizon: [
    { x: 424, y: 404, text: "минуты → часы", anchor: "start" },
    { x: 1156, y: 404, text: "единица проверки: вся траектория", anchor: "end" }
  ],
  fallback: {
    x: 600, y: 210,
    lines: [
      "Слева: один переход «запрос → ответ».",
      "Справа: агентная петля из сотен шагов",
      "с инструментами, расходами и самостоятельной остановкой."
    ],
    gap: 28
  }
};
const origin = { x: 0, y: 0 };
const scale = { x: 1, y: 1 };
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const svg = document.getElementById("diagram");
  const ns = "http://www.w3.org/2000/svg";
  const make = (name, attrs, text) => {
    const el = document.createElementNS(ns, name);
    Object.entries(attrs || {}).forEach(([key, value]) => el.setAttribute(key, value));
    if (text !== undefined) el.textContent = text;
    return el;
  };
  const add = el => svg.appendChild(el);
  const rect = item => add(make("rect", {
    x: sx(item.x), y: sy(item.y),
    width: sx(item.w) - sx(D.zero),
    height: sy(item.h) - sy(D.zero),
    rx: sx(D.radius) - sx(D.zero),
    class: item.cls
  }));
  const text = (x, y, value, cls, anchor) => add(make("text", {
    x: sx(x), y: sy(y), class: cls,
    "text-anchor": anchor
  }, value));
  const line = (a, b, cls) => add(make("line", {
    x1: sx(a[0]), y1: sy(a[1]),
    x2: sx(b[0]), y2: sy(b[1]),
    class: cls
  }));
  const polyline = (points, cls) => add(make("polyline", {
    points: points.map(point => `${sx(point[0])},${sy(point[1])}`).join(" "),
    class: cls
  }));
  const polygon = (points, cls) => add(make("polygon", {
    points: points.map(point => `${sx(point[0])},${sy(point[1])}`).join(" "),
    class: cls
  }));
  const cardText = item => {
    text(item.x + item.w / D.head.right[2][0], item.y + 27, item.title, "node-title", "middle");
    text(item.x + item.w / D.head.right[2][0], item.y + 48, item.tag || item.body, "small", "middle");
  };

  D.panels.forEach(rect);
  D.sectionLabels.forEach(item => text(item.x, item.y, item.text, "section", item.anchor));

  D.leftBoxes.forEach(item => {
    rect(item);
    cardText(item);
  });
  line(D.leftArrow.points[0], D.leftArrow.points[1], "accent-line");
  polygon(D.leftArrow.tip, "arrow-accent");
  text(D.leftArrow.label.x, D.leftArrow.label.y, D.leftArrow.label.text, "small", D.leftArrow.label.anchor);

  rect({ x: D.bot.x, y: D.bot.y, w: D.bot.w, h: D.bot.h, cls: "panel" });
  text(D.bot.x + D.bot.w / D.head.right[2][0], D.bot.y + 25, D.bot.title, "node-title", "middle");
  text(D.bot.x + D.bot.w / D.head.right[2][0], D.bot.y + 44, D.bot.body, "small", "middle");
  D.leftMetrics.forEach(item => text(item.x, item.y, item.text, "metric", item.anchor));

  D.agentNodes.forEach(item => {
    rect({ ...item, cls: "soft" });
    cardText(item);
  });
  D.flow.forEach(item => {
    line(item.a, item.b, "accent-line");
    polygon(item.tip, "arrow-accent");
  });
  polyline(D.loop.points, "accent-line");
  polygon(D.loop.tip, "arrow-accent");
  text(D.loop.label.x, D.loop.label.y, D.loop.label.text, "small", D.loop.label.anchor);

  D.tools.forEach(item => {
    rect({ ...item, cls: "tool" });
    text(item.x + item.w / D.head.right[2][0], item.y + 20, item.title, "node-title", "middle");
    text(item.x + item.w / D.head.right[2][0], item.y + 38, item.body, "small", "middle");
  });
  D.toolLinks.forEach(item => {
    line(item.points[0], item.points[1], "tool-line");
    polygon(item.tip, "arrow-tool");
  });

  rect({ x: D.ellipsis.x, y: D.ellipsis.y, w: D.ellipsis.w, h: D.ellipsis.h, cls: "panel" });
  text(D.ellipsis.x + D.ellipsis.w / D.head.right[2][0], D.ellipsis.y + 25, D.ellipsis.text, "metric", "middle");

  rect({ x: D.cost.x, y: D.cost.y, w: D.cost.w, h: D.cost.h, cls: "cost" });
  text(D.cost.x + D.cost.w / D.head.right[2][0], D.cost.y + 20, D.cost.title, "node-title", "middle");
  text(D.cost.x + D.cost.w / D.head.right[2][0], D.cost.y + 39, D.cost.body, "metric", "middle");
  line(D.costLink.points[0], D.costLink.points[1], "line");
  polygon(D.costLink.tip, "arrow");

  rect({ x: D.stop.x, y: D.stop.y, w: D.stop.w, h: D.stop.h, cls: "stop" });
  text(D.stop.x + D.stop.w / D.head.right[2][0], D.stop.y + 23, D.stop.text, "metric", "middle");
  line(D.stopLink.points[0], D.stopLink.points[1], "stop-line");
  polygon(D.stopLink.tip, "arrow-stop");
  text(D.stopLink.label.x, D.stopLink.label.y, D.stopLink.label.text, "small", D.stopLink.label.anchor);

  D.horizon.forEach(item => text(item.x, item.y, item.text, "small", item.anchor));
} catch (error) {
  const svg = document.getElementById("diagram");
  const ns = "http://www.w3.org/2000/svg";
  const fallback = document.createElementNS(ns, "text");
  fallback.setAttribute("x", sx(D.fallback.x));
  fallback.setAttribute("y", sy(D.fallback.y));
  fallback.setAttribute("class", "body");
  fallback.setAttribute("text-anchor", "middle");
  D.fallback.lines.forEach((value, index) => {
    const span = document.createElementNS(ns, "tspan");
    span.setAttribute("x", sx(D.fallback.x));
    span.setAttribute("y", sy(D.fallback.y + index * D.fallback.gap));
    span.textContent = value;
    fallback.appendChild(span);
  });
  svg.appendChild(fallback);
}
</script>
</body>
</html>
