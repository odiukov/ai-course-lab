<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Почему 99% недостаточно на 70 шагах</title>
  <style>
    :root {
      color-scheme: light;
      --page-bg: #f4f1e8;
      --panel-bg: #fffdf8;
      --text: #20262d;
      --muted: #626b73;
      --border: #d8d2c5;
      --guide: #a9b1b5;
      --link: #347d78;
      --link-edge: #24625f;
      --link-hole: #fffdf8;
      --milestone: #d78c24;
      --milestone-edge: #a96613;
      --card-bg: #f7f8f5;
      --track: #dfe5e1;
      --formula-bg: #e7f2ef;
      --formula-border: #8bb8b0;
      --formula-text: #163f3c;
      --error-bg: #fff3d8;
      --error-border: #d9a646;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --page-bg: #151a1f;
        --panel-bg: #1d242a;
        --text: #edf1f2;
        --muted: #aeb8bd;
        --border: #3d484f;
        --guide: #67757c;
        --link: #63aaa3;
        --link-edge: #8bc6c0;
        --link-hole: #1d242a;
        --milestone: #e7a94d;
        --milestone-edge: #ffd083;
        --card-bg: #242d33;
        --track: #3a464c;
        --formula-bg: #203b39;
        --formula-border: #57948d;
        --formula-text: #e4f7f4;
        --error-bg: #3a3020;
        --error-border: #a77b35;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-width: 280px;
      background: var(--page-bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      padding: 16px;
    }

    .figure {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      overflow: hidden;
      background: var(--panel-bg);
      border: 2px solid var(--border);
    }

    .figure__header {
      padding: 16px 22px 12px;
      border-bottom: 2px solid var(--border);
    }

    .figure__title {
      margin: 0;
      color: var(--text);
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .figure__subtitle {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.4;
    }

    .diagram {
      display: block;
      width: 100%;
      height: auto;
      max-height: 410px;
      background: var(--panel-bg);
    }

    .diagram text {
      font-family: inherit;
    }

    .chain-connector {
      fill: none;
      stroke: var(--guide);
      stroke-width: 2px;
      stroke-linecap: round;
    }

    .link-shell {
      fill: var(--link);
      stroke: var(--link-edge);
      stroke-width: 1px;
    }

    .link-shell--milestone {
      fill: var(--milestone);
      stroke: var(--milestone-edge);
      stroke-width: 2px;
    }

    .link-hole {
      fill: var(--link-hole);
    }

    .leader,
    .milestone-guide,
    .divider,
    .card-connector {
      fill: none;
      stroke: var(--guide);
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .milestone-dot {
      fill: var(--milestone);
      stroke: var(--milestone-edge);
      stroke-width: 2px;
    }

    .eyebrow {
      fill: var(--muted);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .chain-note {
      fill: var(--text);
      font-size: 16px;
      font-weight: 700;
    }

    .section-label {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .result-card {
      fill: var(--card-bg);
      stroke: var(--border);
      stroke-width: 2px;
    }

    .result-card--final {
      stroke: var(--milestone);
      stroke-width: 3px;
    }

    .result-step {
      fill: var(--muted);
      font-size: 15px;
      font-weight: 700;
    }

    .result-value {
      fill: var(--text);
      font-size: 28px;
      font-weight: 800;
    }

    .result-value--final {
      fill: var(--milestone-edge);
    }

    .result-suffix {
      fill: var(--muted);
      font-size: 14px;
    }

    .progress-track {
      fill: var(--track);
    }

    .progress-fill {
      fill: var(--link);
    }

    .progress-fill--final {
      fill: var(--milestone);
    }

    .formula-box {
      fill: var(--formula-bg);
      stroke: var(--formula-border);
      stroke-width: 2px;
    }

    .formula {
      fill: var(--formula-text);
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .formula-caption {
      fill: var(--formula-text);
      font-size: 16px;
      font-weight: 700;
    }

    .fallback {
      margin: 18px 22px;
      padding: 16px 18px;
      color: var(--text);
      background: var(--error-bg);
      border: 2px solid var(--error-border);
      font-size: 16px;
      line-height: 1.5;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <main class="figure" aria-labelledby="figure-title">
    <header class="figure__header">
      <h1 class="figure__title" id="figure-title">Почему 99% недостаточно на 70 шагах</h1>
      <p class="figure__subtitle">70 последовательных звеньев · надёжность каждого — 0,99</p>
    </header>

    <p class="fallback" id="fallback">
      Схема должна показать: 70 звеньев с надёжностью 0,99 каждое дают
      общую надёжность 0,99^70 ≈ 0,50.
    </p>

    <svg
      class="diagram"
      id="diagram"
      viewBox="0 0 1200 410"
      width="1200"
      height="410"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description"
      hidden
    >
      <title id="svg-title">Цепочка из 70 звеньев с надёжностью 0,99 каждое</title>
      <desc id="svg-description">
        После 1 шага успешны примерно 99 прогонов из 100, после 10 — 90,
        после 30 — 74, после 70 — 50. Итоговая надёжность равна примерно 0,50.
      </desc>
    </svg>
  </main>

  <script>
    const data = Object.freeze([{
      zero: 0,
      one: 1,
      two: 2,
      hundred: 100,
      chain: {
        count: 70,
        startX: 3,
        startY: 4.1,
        stepX: 1.02,
        linkWidth: 1.24,
        linkHeight: 1.14,
        alternateY: 0.34,
        insetX: 0.23,
        insetY: 0.24,
        outerRadius: 0.55,
        innerRadius: 0.31,
        guideY: 8.05
      },
      top: {
        labelX: 3,
        labelY: 1.45,
        noteX: 40,
        noteY: 1.45,
        leaderStartY: 1.85,
        leaderEndY: 3.88,
        leaderTargetX: 40
      },
      results: {
        sectionX: 3,
        sectionY: 9.12,
        dividerStartX: 22.6,
        dividerEndX: 76,
        dividerY: 8.92,
        cardY: 10.35,
        cardWidth: 17,
        cardHeight: 7.45,
        cardRadius: 0.55,
        titleY: 12.05,
        valueY: 14.62,
        suffixY: 16.03,
        trackY: 16.82,
        trackHeight: 0.42,
        trackInset: 1.05,
        trackRadius: 0.2,
        connectorY: 14.08
      },
      formula: {
        x: 3,
        y: 19.15,
        width: 73,
        height: 5.72,
        radius: 0.72,
        centerX: 39.5,
        equationY: 21.68,
        captionY: 23.64
      },
      milestones: [
        {
          position: 1,
          cardX: 3,
          survivors: 99,
          stepLabel: "после 1 шага",
          valueLabel: "≈ 99",
          final: false
        },
        {
          position: 10,
          cardX: 21.65,
          survivors: 90,
          stepLabel: "после 10 шагов",
          valueLabel: "≈ 90",
          final: false
        },
        {
          position: 30,
          cardX: 40.3,
          survivors: 74,
          stepLabel: "после 30 шагов",
          valueLabel: "≈ 74",
          final: false
        },
        {
          position: 70,
          cardX: 58.95,
          survivors: 50,
          stepLabel: "после 70 шагов",
          valueLabel: "≈ 50",
          final: true
        }
      ],
      copy: {
        chainLabel: "70 последовательных звеньев",
        chainNote: "каждое звено: 0,99",
        sectionLabel: "УСПЕШНЫЕ ПРОГОНЫ ИЗ 100",
        suffix: "успешных из 100",
        equation: "0,99 × 0,99 × … × 0,99 = 0,99⁷⁰ ≈ 0,50",
        caption: "99% на шаг ≠ 99% за всю задачу",
        error:
          "Схема должна показать: 70 звеньев по 0,99 дают общую надёжность 0,99^70 ≈ 0,50."
      }
    }]);

    const origin = Object.freeze({ x: 55, y: 24 });
    const scale = Object.freeze({ x: 14.2, y: 14.2 });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const [cfg] = data;
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      if (!svg || !fallback) {
        throw new Error(cfg.copy.error);
      }

      const make = (tag, attributes, content) => {
        const element = document.createElementNS(namespace, tag);
        Object.entries(attributes).forEach(([name, value]) => {
          element.setAttribute(name, String(value));
        });
        if (content !== undefined) {
          element.textContent = content;
        }
        return element;
      };

      const addText = (parent, x, y, content, className, anchor) => {
        parent.appendChild(make("text", {
          x: sx(x),
          y: sy(y),
          class: className,
          "text-anchor": anchor
        }, content));
      };

      const layer = make("g", { "aria-hidden": "true" });
      const milestonePositions = new Set(
        cfg.milestones.map(item => item.position)
      );

      addText(
        layer,
        cfg.top.labelX,
        cfg.top.labelY,
        cfg.copy.chainLabel,
        "eyebrow",
        "start"
      );

      addText(
        layer,
        cfg.top.noteX,
        cfg.top.noteY,
        cfg.copy.chainNote,
        "chain-note",
        "middle"
      );

      layer.appendChild(make("line", {
        x1: sx(cfg.top.leaderTargetX),
        y1: sy(cfg.top.leaderStartY),
        x2: sx(cfg.top.leaderTargetX),
        y2: sy(cfg.top.leaderEndY),
        class: "leader"
      }));

      for (
        let index = cfg.zero;
        index < cfg.chain.count;
        index += cfg.one
      ) {
        const x = cfg.chain.startX + index * cfg.chain.stepX;
        const even = index % cfg.two === cfg.zero;
        const y = cfg.chain.startY + (
          even ? cfg.zero : cfg.chain.alternateY
        );

        if (index < cfg.chain.count - cfg.one) {
          const nextX = x + cfg.chain.stepX;
          const nextY = cfg.chain.startY + (
            even ? cfg.chain.alternateY : cfg.zero
          );

          layer.appendChild(make("line", {
            x1: sx(x + cfg.chain.linkWidth / cfg.two),
            y1: sy(y + cfg.chain.linkHeight / cfg.two),
            x2: sx(nextX + cfg.chain.linkWidth / cfg.two),
            y2: sy(nextY + cfg.chain.linkHeight / cfg.two),
            class: "chain-connector"
          }));
        }
      }

      cfg.milestones.forEach(item => {
        const index = item.position - cfg.one;
        const x = cfg.chain.startX + index * cfg.chain.stepX;
        const even = index % cfg.two === cfg.zero;
        const y = cfg.chain.startY + (
          even ? cfg.zero : cfg.chain.alternateY
        );
        const centerX = x + cfg.chain.linkWidth / cfg.two;

        layer.appendChild(make("line", {
          x1: sx(centerX),
          y1: sy(y + cfg.chain.linkHeight),
          x2: sx(centerX),
          y2: sy(cfg.chain.guideY),
          class: "milestone-guide"
        }));

        layer.appendChild(make("circle", {
          cx: sx(centerX),
          cy: sy(cfg.chain.guideY),
          r: sx(centerX + cfg.results.trackRadius) - sx(centerX),
          class: "milestone-dot"
        }));
      });

      for (
        let index = cfg.zero;
        index < cfg.chain.count;
        index += cfg.one
      ) {
        const position = index + cfg.one;
        const x = cfg.chain.startX + index * cfg.chain.stepX;
        const even = index % cfg.two === cfg.zero;
        const y = cfg.chain.startY + (
          even ? cfg.zero : cfg.chain.alternateY
        );
        const highlighted = milestonePositions.has(position);

        layer.appendChild(make("rect", {
          x: sx(x),
          y: sy(y),
          width: sx(x + cfg.chain.linkWidth) - sx(x),
          height: sy(y + cfg.chain.linkHeight) - sy(y),
          rx: sx(x + cfg.chain.outerRadius) - sx(x),
          class: highlighted
            ? "link-shell link-shell--milestone"
            : "link-shell"
        }));

        const innerX = x + cfg.chain.insetX;
        const innerY = y + cfg.chain.insetY;
        const innerWidth = cfg.chain.linkWidth - cfg.chain.insetX * cfg.two;
        const innerHeight = cfg.chain.linkHeight - cfg.chain.insetY * cfg.two;

        layer.appendChild(make("rect", {
          x: sx(innerX),
          y: sy(innerY),
          width: sx(innerX + innerWidth) - sx(innerX),
          height: sy(innerY + innerHeight) - sy(innerY),
          rx: sx(innerX + cfg.chain.innerRadius) - sx(innerX),
          class: "link-hole"
        }));
      }

      addText(
        layer,
        cfg.results.sectionX,
        cfg.results.sectionY,
        cfg.copy.sectionLabel,
        "section-label",
        "start"
      );

      layer.appendChild(make("line", {
        x1: sx(cfg.results.dividerStartX),
        y1: sy(cfg.results.dividerY),
        x2: sx(cfg.results.dividerEndX),
        y2: sy(cfg.results.dividerY),
        class: "divider"
      }));

      cfg.milestones.forEach((item, itemIndex) => {
        const cardX = item.cardX;
        const centerX = cardX + cfg.results.cardWidth / cfg.two;
        const trackX = cardX + cfg.results.trackInset;
        const trackWidth =
          cfg.results.cardWidth - cfg.results.trackInset * cfg.two;
        const fillWidth =
          trackWidth * item.survivors / cfg.hundred;

        layer.appendChild(make("rect", {
          x: sx(cardX),
          y: sy(cfg.results.cardY),
          width: sx(cardX + cfg.results.cardWidth) - sx(cardX),
          height:
            sy(cfg.results.cardY + cfg.results.cardHeight) -
            sy(cfg.results.cardY),
          rx: sx(cardX + cfg.results.cardRadius) - sx(cardX),
          class: item.final
            ? "result-card result-card--final"
            : "result-card"
        }));

        addText(
          layer,
          centerX,
          cfg.results.titleY,
          item.stepLabel,
          "result-step",
          "middle"
        );

        addText(
          layer,
          centerX,
          cfg.results.valueY,
          item.valueLabel,
          item.final
            ? "result-value result-value--final"
            : "result-value",
          "middle"
        );

        addText(
          layer,
          centerX,
          cfg.results.suffixY,
          cfg.copy.suffix,
          "result-suffix",
          "middle"
        );

        layer.appendChild(make("rect", {
          x: sx(trackX),
          y: sy(cfg.results.trackY),
          width: sx(trackX + trackWidth) - sx(trackX),
          height:
            sy(cfg.results.trackY + cfg.results.trackHeight) -
            sy(cfg.results.trackY),
          rx: sx(trackX + cfg.results.trackRadius) - sx(trackX),
          class: "progress-track"
        }));

        layer.appendChild(make("rect", {
          x: sx(trackX),
          y: sy(cfg.results.trackY),
          width: sx(trackX + fillWidth) - sx(trackX),
          height:
            sy(cfg.results.trackY + cfg.results.trackHeight) -
            sy(cfg.results.trackY),
          rx: sx(trackX + cfg.results.trackRadius) - sx(trackX),
          class: item.final
            ? "progress-fill progress-fill--final"
            : "progress-fill"
        }));

        if (itemIndex < cfg.milestones.length - cfg.one) {
          const nextCard = cfg.milestones[itemIndex + cfg.one];
          layer.appendChild(make("line", {
            x1: sx(cardX + cfg.results.cardWidth),
            y1: sy(cfg.results.connectorY),
            x2: sx(nextCard.cardX),
            y2: sy(cfg.results.connectorY),
            class: "card-connector"
          }));
        }
      });

      layer.appendChild(make("rect", {
        x: sx(cfg.formula.x),
        y: sy(cfg.formula.y),
        width: sx(cfg.formula.x + cfg.formula.width) - sx(cfg.formula.x),
        height:
          sy(cfg.formula.y + cfg.formula.height) -
          sy(cfg.formula.y),
        rx: sx(cfg.formula.x + cfg.formula.radius) - sx(cfg.formula.x),
        class: "formula-box"
      }));

      addText(
        layer,
        cfg.formula.centerX,
        cfg.formula.equationY,
        cfg.copy.equation,
        "formula",
        "middle"
      );

      addText(
        layer,
        cfg.formula.centerX,
        cfg.formula.captionY,
        cfg.copy.caption,
        "formula-caption",
        "middle"
      );

      svg.appendChild(layer);
      svg.hidden = false;
      fallback.hidden = true;
    } catch (error) {
      const [cfg] = data;
      const fallback = document.getElementById("fallback");
      const svg = document.getElementById("diagram");

      if (svg) {
        svg.hidden = true;
      }

      if (fallback) {
        fallback.textContent = cfg.copy.error;
        fallback.hidden = false;
      }
    }
  </script>
</body>
</html>
