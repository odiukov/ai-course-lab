- concept: 'произведение в вероятности траектории получается из цепного правила плюс марковское свойство: каждый множитель условен только по текущему состоянию и действию'
  question: Почему совместная вероятность целой траектории записывается именно как произведение отдельных множителей, а не как сложная функция всей истории?
  explanation: 'Цепное правило раскладывает любую совместную вероятность в произведение условных. Марковское свойство обрезает каждое условие: следующее состояние зависит лишь от (s_t, a_t), а действие — лишь от s_t. Независимости здесь нет: a_t зависит от s_t, а s_{t+1} — от обоих. Удобство логарифма — следствие произведения, а не его причина.'
  kind: choice
  options:
