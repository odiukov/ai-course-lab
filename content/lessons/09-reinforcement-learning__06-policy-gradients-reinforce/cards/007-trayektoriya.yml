- concept: вероятность траектории пропорциональна вероятностям действий политики, поэтому изменение одного множителя политики масштабирует вероятность всей траектории
  question: В зафиксированной среде наблюдалась траектория. После обучения политика стала выбирать первое действие траектории с вероятностью 0,75 вместо 0,25, остальные множители политики не изменились. Во сколько раз изменилась вероятность этой траектории?
  explanation: 'P(τ;θ) — произведение, где вероятности переходов среды и начального состояния от θ не зависят и остаются теми же. Меняется только один множитель политики: 0,75/0,25 = 3. Вероятность траектории выросла ровно в 3 раза, хотя динамика среды осталась прежней.'
  kind: numeric
  answer: 3
