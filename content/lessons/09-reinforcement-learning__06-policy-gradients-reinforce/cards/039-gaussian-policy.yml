- concept: градиент логарифма гауссовой плотности по среднему равен (a − μ)/σ² и линейно тянет центр распределения к сэмплированному действию
  question: Гауссовская политика выдала μ = 1,2 и σ = 0,6. Агент сэмплировал действие a = 2,4. Чему равна производная log π(a|s) по μ?
  explanation: 'log N(a; μ, σ²) = −(a − μ)²/(2σ²) − log σ − ½·log(2π). Производная по μ: (a − μ)/σ² = (2,4 − 1,2)/0,36 ≈ 3,33. Знак положительный, значит при положительном преимуществе шаг двигает μ вверх, к сэмплированному действию 2,4; при отрицательном — прочь от него. Множитель 1/σ² объясняет, почему узкая политика даёт огромные градиенты.'
  kind: numeric
  answer: 3.33
