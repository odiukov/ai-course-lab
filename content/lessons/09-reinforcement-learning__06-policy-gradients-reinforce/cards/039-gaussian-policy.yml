- concept: среднее гауссовой политики задаёт предпочитаемое действие, стандартное отклонение — величину исследования; схлопывание σ убивает разведку
  question: В ходе обучения σ_θ(s) гауссовой политики упало с 0,8 до 0,003, а μ_θ(s) почти не меняется. Что это означает для агента?
  explanation: 'σ — ширина распределения: сэмплы лежат в основном в диапазоне μ ± 2σ, то есть при σ = 0,003 это интервал шириной 0,012. Агент фактически детерминирован и перестал пробовать альтернативы — типичное преждевременное схлопывание. Обратное: градиент по μ равен (a − μ)/σ², и при крошечном σ он, наоборот, огромен, так что обучение не замирает, а становится нестабильным. Лечится нижней границей на σ или энтропийным бонусом.'
  kind: choice
  options:
    - 'Политика стала почти детерминированной: агент повторяет действия около μ и почти не исследует другие'
    - Агент стал исследовать шире, потому что маленькое σ увеличивает разброс сэмплов
    - Градиент log-плотности обнулился, поэтому обучение остановилось независимо от возвратов
    - Действия перестали быть непрерывными и свелись к дискретному набору из двух значений
