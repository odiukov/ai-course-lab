- concept: дисперсия оценки градиента REINFORCE растёт с горизонтом, потому что возврат суммирует много шумных наград, и reward-to-go этого не компенсирует без базовой линии
  question: Почему для эпизодов в 1200 шагов REINFORCE без базовой линии считают неработоспособной конфигурацией, а не просто медленной?
  explanation: 'Спецификация ставит жёсткий отказ на REINFORCE-no-baseline при горизонте больше 500 шагов именно по этой причине: дело не в скорости, а в том, что оценка градиента перестаёт быть информативной.'
  kind: open
  reference: 'Вес каждого действия — это возврат, сумма примерно тысячи случайных наград. Дисперсия такой суммы растёт с длиной эпизода, поэтому оценка градиента по нескольким эпизодам почти целиком шум: полезный сигнал от отдельного действия тонет в разбросе общего возврата. Reward-to-go отрезает прошлые награды и снижает дисперсию, но остаток суммы всё равно длинный и его уровень ничем не отцентрирован. Базовая линия (скользящее среднее или обучаемая V̂(s)) вычитает типичный уровень возврата, оставляя знакопеременное преимущество, и делает это без смещения оценки. Без неё увеличение числа эпизодов даёт не медленное, а практически нулевое улучшение.'
  id: 042-check-safeguards-2
  fingerprint: 2b5c186b
