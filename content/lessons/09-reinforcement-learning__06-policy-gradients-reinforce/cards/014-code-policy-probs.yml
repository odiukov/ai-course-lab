- concept: функция вероятностей политики — композиция вычисления логитов и нормализации softmax, применённой к целому вектору
  question: Функция должна по параметрам и признакам состояния вернуть распределение вероятностей по действиям. Заполни пропуск.
  explanation: 'Распределение получается в два шага: линейный слой даёт вектор логитов (по одному на действие), softmax нормализует этот вектор в вероятности. Обратный порядок вызовов бессмысленен: softmax принимает список чисел, а не параметры и признаки.'
  kind: cloze
  template: |-
    def policy_probs(theta, state_features):
        return softmax(___(theta, state_features))
  answer: policy_logits
  accept:
    - policy_logits
    - logits
    - policy_logits(theta, state_features)
  id: 014-code-policy-probs-1
  fingerprint: 2c28832d
- concept: softmax нормализует весь вектор логитов сразу; применение к каждому логиту по отдельности даёт единицу на каждое действие
  question: В среде 5 действий. Программист по ошибке вызвал softmax отдельно для каждого логита, то есть подал на вход список из одного числа, и собрал результаты в список. Чему равна сумма элементов такого списка?
  explanation: softmax от списка из одного элемента даёт exp(l-l)/exp(l-l) = 1.0 независимо от логита. Пять таких вызовов дадут пять единиц, сумма 5.0 вместо 1.0. Нормировка на Z связывает действия между собой, поэтому softmax обязан получить весь вектор логитов целиком — иначе действия перестают конкурировать и информация о разнице логитов теряется.
  kind: numeric
  answer: 5
  tolerance: 0.01
  id: 014-code-policy-probs-2
  fingerprint: a56bb186
- concept: 'вычисление распределения по действиям отделено от выбора действия: функция возвращает вектор вероятностей длины, равной числу действий'
  question: У политики 7 действий. Что должна вернуть функция, вычисляющая распределение политики для одного состояния?
  explanation: 'Распределение — это вектор длины 7, где элемент на позиции a — вероятность действия a, и порядок должен совпадать с порядком логитов. Сэмплирование действия — отдельная операция: одна и та же функция распределения нужна и для выбора действия, и для вычисления log π(a|s) в градиенте, поэтому выбор в неё не встраивают.'
  kind: choice
  options:
    - Список из 7 неотрицательных чисел с суммой 1, где позиция соответствует действию
    - Индекс одного действия, выбранного по вероятностям
    - Одно число — вероятность наиболее вероятного действия
    - Список из 7 логитов, ещё не приведённых к сумме 1
  correct: 0
