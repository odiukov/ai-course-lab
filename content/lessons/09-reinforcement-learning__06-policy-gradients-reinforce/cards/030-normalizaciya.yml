- concept: нормализованный возврат равен отклонению от среднего батча, делённому на стандартное отклонение батча
  question: 'В батче пять эпизодов с возвратами 6, 8, 10, 12 и 14. Возвраты нормализуют по батчу: из каждого вычитают среднее и делят на стандартное отклонение (корень из среднего квадрата отклонений; ε пренебрежимо мал). Какое значение получит эпизод с возвратом 14?'
  explanation: 'Среднее батча = 10. Отклонения: −4, −2, 0, 2, 4; средний квадрат = 40/5 = 8, значит σ = 2.828. Для возврата 14: (14 − 10)/2.828 ≈ 1.414. После такого преобразования весь батч имеет среднее около нуля и разброс около единицы, поэтому ни один эпизод не может задать шаг произвольного масштаба.'
  kind: numeric
  answer: 1.414
  tolerance: 0.05
  id: 030-normalizaciya-1
  fingerprint: 5fc67a43
- concept: вычитание среднего батча делает возвраты хуже среднего отрицательными, из-за чего их действия штрафуются, хотя сырые возвраты положительны
  question: 'Все возвраты в батче положительны: 20, 40, 60, 90. Что происходит с действиями эпизода с возвратом 20 после нормализации возвратов по батчу?'
  explanation: Среднее батча = 52.5, поэтому возврат 20 даёт нормализованное значение около −1.05. Множитель при ∇log π становится отрицательным, и градиентный подъём снижает вероятность этих действий. Без вычитания среднего все действия батча получали бы положительный вес и вероятности росли бы у всех, а различались бы лишь темпы роста.
  kind: choice
  options:
    - Их вероятность увеличивается, просто слабее, чем у остальных эпизодов
    - Их вероятность уменьшается, потому что нормализованный возврат этого эпизода отрицателен
    - Их вероятность не меняется, так как нормализация затрагивает только самый большой возврат
    - Их вероятность уменьшается только если в батче есть эпизод с отрицательным сырым возвратом
