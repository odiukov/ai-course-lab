- concept: статистики нормализации берут по всему батчу, иначе сравнение между эпизодами теряется
  question: Почему среднее и стандартное отклонение для нормализации возвратов считают по всему батчу, а не отдельно внутри каждого эпизода? Объясни своими словами.
  explanation: Смысл нормализации — убрать произвольный масштаб чисел, а не различия между траекториями. Общий μ и σ по батчу сохраняют порядок примеров; поэпизодные статистики уничтожают межэпизодное сравнение, ради которого REINFORCE и усредняет по многим эпизодам.
  kind: open
  reference: 'Нормализация внутри одного эпизода вычитает его собственное среднее, поэтому лучший шаг слабого эпизода с возвратами около 15 и лучший шаг сильного эпизода с возвратами около 300 получают примерно одинаковый положительный вес. Информация о том, что один эпизод в целом гораздо лучше другого, стирается, и обучающий сигнал перестаёт различать хорошие и плохие траектории. Общие статистики по батчу приводят все возвраты к одной шкале, сохраняя их взаимный порядок: эпизод с большим возвратом остаётся выше эпизода с меньшим, меняется только величина шага.'
