- concept: G_t — это дисконтированная сумма наград, полученных начиная с шага t
  question: Эпизод длится три шага, награды по шагам равны 2, 6 и 5, коэффициент дисконтирования γ = 0,5. Чему равен возврат G_0 для первого решения?
  explanation: G_0 = r_1 + γ·r_2 + γ²·r_3 = 2 + 0,5·6 + 0,25·5 = 2 + 3 + 1,25 = 6,25. Каждая следующая награда входит со степенью γ, растущей с расстоянием во времени, поэтому далёкие награды весят меньше.
  kind: numeric
  answer: 6.25
  tolerance: 0.01
  id: 005-teorema-gradienta-1
  fingerprint: b5d125a6
- concept: 'роль множителей в слагаемом G_t · ∇log π: градиент лог-вероятности задаёт направление, возврат задаёт знак и величину шага'
  question: В слагаемом теоремы о градиенте политики G_t · ∇_θ log π_θ(a_t | s_t) за что отвечает каждый из двух множителей?
  explanation: 'Градиент лог-вероятности — чисто направление в пространстве параметров: сдвиг по нему делает пару (s_t, a_t) вероятнее. Возврат G_t работает скаляром: положительный усиливает действие, отрицательный ослабляет, большой по модулю даёт больший шаг. Правильное действие теорема не подсказывает — только усиливает или гасит уже сделанное.'
  kind: choice
  options:
    - ∇log π задаёт направление сдвига параметров, повышающее вероятность именно выбранного действия, а G_t задаёт знак и силу этого сдвига
    - ∇log π задаёт величину шага, а G_t указывает, какое действие следовало выбрать вместо сделанного
    - ∇log π нормирует вероятности, чтобы их сумма равнялась единице, а G_t убирает влияние динамики среды
    - оба множителя вычисляются средой и не зависят от параметров θ
