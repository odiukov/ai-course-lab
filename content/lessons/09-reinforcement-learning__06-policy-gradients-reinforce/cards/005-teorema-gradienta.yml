- concept: при γ = 0 возврат сводится к немедленной награде и обучающий сигнал теряет связь с отложенными наградами
  question: Агент обучается по теореме о градиенте политики с γ = 0. Как это меняет обучающий сигнал?
  explanation: 'G_t = Σ_k γ^{k-t} r_{k+1}: при γ = 0 выживает только слагаемое k = t, то есть r_{t+1}. Политика становится жадной к сиюминутной награде и не может выучить ходы, которые окупаются через несколько шагов. Чем ближе γ к единице, тем дальше в будущее протягивается кредит за действие.'
  kind: choice
  options:
    - каждое действие подкрепляется только немедленной наградой следующего шага, отложенные последствия игнорируются
    - все действия эпизода получают одинаковый множитель, равный сумме всех наград
    - градиент обращается в ноль, и политика перестаёт обновляться
    - возврат становится бесконечным, обучение расходится
