- concept: при отрицательном преимуществе вес невыбранного действия растёт, потому что минус на минус даёт плюс
  question: В softmax-политике шаг обновления — theta[i][j] += lr * advantage * grad_log_pi[i] * s[j], где grad_log_pi = one-hot(a) − probs. Агент выбрал действие 0, вероятность действия 2 равна 0,3, преимущество равно −2, lr = 0,5, признак s[j] = 6. Чему равно изменение веса theta[2][j]?
  explanation: 'Для невыбранного действия компонента градиента равна −p = −0,3. Тогда 0,5 · (−2) · (−0,3) · 6 = +1,8. Два минуса (отрицательное преимущество и отрицательная компонента градиента) дают рост: плохой выбор ослабляется, а альтернативы усиливаются.'
  kind: numeric
  answer: 1.8
  tolerance: 0.01
  id: 029-check-znak-1
  fingerprint: c50aed00
- concept: нулевое преимущество обнуляет всё обновление независимо от того, насколько вероятным было действие
  question: В REINFORCE с базовой линией возврат из состояния в точности совпал с базовой линией. Что произойдёт с параметрами на этом переходе?
  explanation: 'Преимущество входит скалярным множителем во всё слагаемое обновления. При advantage = 0 произведение равно нулю для всех действий и признаков, каким бы ни был градиент лог-вероятности. Такой переход не несёт информации: результат ровно средний.'
  kind: choice
  options:
    - Веса выбранного действия вырастут, но слабее обычного, ведь вероятность действия была мала
    - 'Ни один вес не изменится: множитель преимущества равен нулю'
    - Веса невыбранных действий уменьшатся, а вес выбранного останется прежним
  correct: 1
  id: 029-check-znak-2
  fingerprint: c2103ef5
- concept: знак изменения отдельного веса зависит и от знака признака состояния, тогда как логит сдвигается по знаку преимущества
  question: Преимущество положительное, агент выбрал действие 1, а признак состояния s[j] = −3 (остальные признаки нулевые). Что произойдёт с весом theta[1][j] и с логитом действия 1?
  explanation: Изменение веса равно lr · A · (1 − p) · s[j] < 0, потому что s[j] отрицателен. Но логит равен theta[1]·s, и его прирост равен lr · A · (1 − p) · s[j]², то есть пропорционален квадрату признака и всегда положителен при положительном преимуществе. Знак преимущества управляет вероятностями, а не отдельными весами.
  kind: choice
  options:
    - Вес theta[1][j] уменьшится, но логит действия 1 всё равно вырастет
    - 'И вес, и логит уменьшатся: отрицательный признак разворачивает подкрепление'
    - 'И вес, и логит вырастут: знак признака на обновление не влияет'
