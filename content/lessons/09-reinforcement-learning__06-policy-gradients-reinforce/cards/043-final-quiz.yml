- concept: умножение всех преимуществ на положительную константу эквивалентно изменению размера шага, а не изменению направления обновления
  question: Прогон обучался с learning rate 0.05. Затем все преимущества умножили на 4, ничего больше не меняя. Какой learning rate в исходном прогоне дал бы точно такие же обновления параметров за один шаг?
  explanation: 'Обновление пропорционально A · ∇log π, поэтому положительный множитель у A входит в шаг ровно так же, как множитель у learning rate: 0.05 · 4 = 0.2. Знак преимуществ не меняется, значит направление обновления то же. Прибавление константы к A так не работает — оно меняет знаки и потому меняет само направление.'
  kind: numeric
  answer: 0.2
  tolerance: 0.001
  id: 043-final-quiz-2
  fingerprint: 60e228bf
- concept: policy gradient параметризует и оптимизирует политику напрямую, поэтому не требует максимизации по действиям
  question: Объясни своими словами, чем оптимизация политики методом policy gradient отличается от подхода, где сначала обучают функцию ценности действий, а действие выбирают её максимизацией.
  explanation: 'Ключ — «напрямую»: параметры отвечают за вероятности действий, а не за оценку их полезности. Поэтому нет шага максимизации по действиям, и политика остаётся распределением, из которого сэмплируют.'
  kind: open
  reference: 'Policy gradient задаёт параметрическое распределение π_θ(a|s) и двигает θ по градиенту ожидаемого возврата J(θ) = E[G]. Функция ценности при этом не обязательна: если она используется, то лишь как baseline для снижения дисперсии. Value-based подход обучает Q(s,a), а политика получается как argmax по действиям — то есть на каждом шаге нужен перебор или максимизация по пространству действий и политика получается детерминированной. Отсюда практические различия: policy gradient естественно даёт стохастическую политику (сохраняется исследование, можно выучить оптимальное случайное поведение) и работает в непрерывных пространствах действий, где argmax по Q сам был бы задачей оптимизации.'
  id: 043-final-quiz-3
  fingerprint: 84cc5cda
