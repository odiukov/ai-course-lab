- concept: одинаковый возврат в разных состояниях даёт преимущества разного знака, потому что базовая линия зависит от состояния
  question: В двух разных состояниях агент получил один и тот же фактический возврат 12. Критик оценивает первое состояние как V̂ = 9, второе как V̂ = 16. Как политика обновится по этим двум переходам?
  explanation: 'A = G − V̂. Первое состояние: 12 − 9 = +3, действие сработало лучше ожидания, вероятность растёт. Второе: 12 − 16 = −4, результат ниже нормы для этого состояния, вероятность падает. Абсолютная величина возврата ничего не говорит без базовой линии этого же состояния.'
  kind: choice
  options:
    - Вероятность действия вырастет в первом состоянии и упадёт во втором
    - Оба действия получат одинаковое положительное подкрепление, так как возвраты равны
    - Оба действия получат одинаковое отрицательное подкрепление, так как в среднем критик ошибся
    - 'Ни одно обновление не произойдёт: равные возвраты дают нулевое преимущество'
  correct: 0
  id: 026-advantage-1
  fingerprint: 1a7b8f21
- concept: преимущество считается как дисконтированный будущий возврат из состояния минус оценка критика для того же состояния
  question: Агент сделал действие в состоянии s_t. После этого он получил награды 10 и 4, затем эпизод закончился. γ = 0,5, критик оценивает V̂(s_t) = 16,5. Чему равно преимущество A_t?
  explanation: 'Сначала возврат: G_t = 10 + 0,5·4 = 12. Затем A_t = G_t − V̂(s_t) = 12 − 16,5 = −4,5. Обе части берутся в одном и том же шаге t: будущие награды с дисконтом и оценка именно состояния s_t.'
  kind: numeric
  answer: -4.5
  tolerance: 0.1
  id: 026-advantage-2
  fingerprint: 1ef35bfe
- concept: при точной оценке ценности матожидание преимущества по действиям политики равно нулю, поэтому преимущество измеряет действие относительно среднего по состоянию
  question: Критик оценивает состояние идеально точно. Что тогда получится, если усреднить преимущество по всем действиям, которые политика может выбрать в этом состоянии? Объясни своими словами, что это говорит о смысле преимущества.
  explanation: 'Нулевое среднее преимущества — то же свойство, из которого базовая линия не смещает градиент. Из состояния с обычным возвратом 40 действие с возвратом 40 не даёт сигнала, а действия с 45 и 35 дают +5 и −5: политика двигает вероятности только относительно друг друга.'
  kind: open
  reference: 'Если V̂(s) равно истинному ожидаемому возврату из s при текущей политике, то среднее G_t по действиям политики равно V̂(s), значит E_{a~π}[A] = E[G] − V̂(s) = 0. Преимущество измеряет не абсолютное качество состояния, а насколько выбранное действие лучше или хуже среднего действия политики в этом же состоянии. Отсюда: в каждом состоянии часть действий обязательно имеет положительное преимущество, часть — отрицательное, и обновление перераспределяет вероятность внутри состояния, а не поднимает все действия сразу. Именно это и убирает общий сдвиг сигнала, который даёт большой одинаковый возврат.'
  id: 026-advantage-3
  fingerprint: f66f82c3
