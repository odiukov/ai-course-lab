- concept: градиент логарифма вероятности по логитам softmax равен one-hot выбранного действия минус вектор вероятностей
  question: Заполни пропуск в градиенте лог-вероятности выбранного действия по вектору логитов softmax-политики.
  explanation: Логарифм вероятности выбранного действия — это его логит минус log суммы экспонент. Дифференцирование первой части даёт единицу только на позиции a (то есть one-hot e_a), второй — вычитание всего вектора вероятностей π(·|s).
  kind: cloze
  template: ∇_l log π(a|s) = ___ − π(·|s)
  answer: e_a
  accept:
    - e_a
    - one-hot(a)
    - onehot(a)
    - one-hot вектор действия a
    - e_{a}
  id: 018-grad-log-pi-1
  fingerprint: 692cb40c
- concept: компонента градиента лог-вероятности у выбранного действия равна единице минус его вероятность
  question: Softmax-политика над четырьмя действиями выдала вероятности [0,45; 0,35; 0,12; 0,08]. Сэмплировано действие с вероятностью 0,08. Чему равна компонента ∇log π(a|s) по логиту именно этого действия?
  explanation: 'Для выбранного действия one-hot даёт единицу, из неё вычитается его вероятность: 1 − 0,08 = 0,92. У остальных действий компоненты равны минус их вероятностям: −0,45; −0,35; −0,12. Чем менее вероятным было выбранное действие, тем больше его компонента — редкий успешный выбор толкает логит сильнее.'
  kind: numeric
  answer: 0.92
  tolerance: 0.005
  id: 018-grad-log-pi-2
  fingerprint: 1b4884c0
- concept: компоненты градиента лог-вероятности суммируются в нуль, поэтому шаг только перераспределяет вероятность между действиями
  question: Объясни своими словами, почему сумма всех компонент вектора ∇log π(a|s) для softmax равна нулю, и что это значит для обновления параметров политики.
  explanation: 'Нулевая сумма — прямое следствие того, что softmax нормирован. Именно поэтому нельзя «просто поднять логит» одного действия изолированно: общий знаменатель softmax связывает все вероятности, и любое изменение перетекает по всему вектору.'
  kind: open
  reference: 'One-hot-вектор суммируется в единицу, вероятности softmax тоже суммируются в единицу, поэтому их разность даёт нуль. Практический смысл: градиент не может увеличить вероятности всех действий одновременно — сколько прибавится выбранному действию, столько в сумме отнимется у остальных. Шаг обучения перераспределяет фиксированный запас вероятности, а не создаёт его. При положительном преимуществе логит выбранного действия растёт, а остальных падает; при отрицательном — зеркально.'
  id: 018-grad-log-pi-3
  fingerprint: 791521bf
