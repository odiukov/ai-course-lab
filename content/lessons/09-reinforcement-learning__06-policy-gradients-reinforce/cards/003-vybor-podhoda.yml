- concept: градиент ожидаемого возврата в REINFORCE равен матожиданию произведения возврата на градиент логарифма вероятности действия
  question: Дополни формулу теоремы REINFORCE (Уильямс, 1992) для градиента ожидаемого возврата.
  explanation: 'Градиент оценивается сэмплированием: возврат эпизода G умножается на ∇_θ log π_θ(a | s) — градиент логарифма вероятности фактически выбранного действия. Дифференцируется политика, а не функция ценности, поэтому никакой рекурсии Беллмана и никакого argmax не требуется.'
  kind: cloze
  template: ∇J(θ) = E_π[ G · ∇_θ log ___ ]
  answer: π_θ(a | s)
  accept:
    - π_θ(a|s)
    - pi_theta(a|s)
    - pi_theta(a | s)
    - π(a|s)
    - π_θ(a_t | s_t)
  id: 003-vybor-podhoda-1
  fingerprint: dc4bf961
- concept: порядок шагов одной итерации REINFORCE
  question: Расставь шаги одной итерации обучения по REINFORCE в правильном порядке.
  explanation: 'REINFORCE работает по эпизодам: сначала нужен полный возврат, поэтому обновление невозможно до конца траектории. Подъём, а не спуск: максимизируется J(θ) = E_{π_θ}[G].'
  kind: order
  items:
    - Прогнать эпизод, сэмплируя действия из π_θ(a | s)
    - Посчитать возврат G по собранной траектории
    - На каждом шаге умножить G на ∇_θ log π_θ(a | s)
    - Усреднить полученные произведения по шагам и эпизодам
    - Сделать шаг градиентного подъёма по θ
  id: 003-vybor-podhoda-2
  fingerprint: 406af69d
- concept: в REINFORCE все действия эпизода получают один и тот же множитель возврата, а разделение полезных и бесполезных действий происходит за счёт усреднения по многим эпизодам
  question: Агент сделал 7 действий за эпизод и получил итоговую награду 4. Каждое из 7 действий получает один и тот же множитель. Почему такой грубый способ раздачи «заслуг» всё-таки обучает политику?
  explanation: Ключ — несмещённость плюс усреднение. Один эпизод даёт очень шумную оценку градиента, но матожидание указывает верное направление, а шум уходит с ростом числа эпизодов. Высокая дисперсия — главная слабость чистого REINFORCE и мотивация для PPO/GRPO.
  kind: open
  reference: 'REINFORCE не пытается определить, какое именно действие было удачным: он повышает вероятность всех действий успешной траектории и понижает вероятность действий неудачной. Разделение происходит статистически. Действие, которое реально ведёт к награде, встречается чаще в эпизодах с высоким G и получает положительный вклад систематически; случайное или бесполезное действие попадает и в хорошие, и в плохие эпизоды, и его вклады при усреднении по сотням эпизодов гасят друг друга. Оценка градиента остаётся несмещённой, но у неё высокая дисперсия — именно поэтому нужны сотни эпизодов, а поздние методы добавляют baseline и другие приёмы снижения дисперсии.'
  id: 003-vybor-podhoda-3
  fingerprint: 3d1e6775
