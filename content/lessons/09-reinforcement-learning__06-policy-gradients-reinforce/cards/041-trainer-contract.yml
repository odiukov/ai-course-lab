- concept: какая комбинация входных характеристик задачи и настроек обучения даёт жёсткий отказ конфигуратора до запуска
  question: Конфигуратор получает тип действий, длину горизонта и статистику наград. Какой из наборов он обязан отклонить, не запуская обучение?
  explanation: 'Правило отказа: REINFORCE без базовой линии на горизонтах длиннее 500 шагов. Возврат складывается из сотен шумных слагаемых, дисперсия оценки градиента такова, что сигнал тонет; reward-to-go один этого не компенсирует. Остальные два набора внутренне согласованы.'
  kind: choice
  options:
    - Непрерывное управление, горизонт 900 шагов, гауссова голова, критик A2C, нормализация возвратов
    - Ванильный REINFORCE без базовой линии, горизонт 900 шагов, reward-to-go включён
    - Дискретные 12 действий, softmax-голова, горизонт 60 шагов, скользящее среднее как базовая линия
  correct: 1
