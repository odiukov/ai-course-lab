- concept: несовместимость головы политики с типом пространства действий проверяется по входу, поэтому это отказ, а не рекомендация
  question: Почему требование непрерывного управления с softmax-головой конфигуратор отклоняет сразу, а не выдаёт как предупреждение с рекомендацией?
  explanation: Отказы конфигуратора — это проверки согласованности входа и выхода, разрешимые до запуска. Несовместимость головы с пространством действий и REINFORCE без базовой линии на длинном горизонте относятся сюда; схлопывание энтропии — нет, его видно только по метрикам прогона.
  kind: open
  reference: 'Softmax задаёт распределение по конечному списку дискретных вариантов: он выдаёт вектор вероятностей фиксированной длины. У непрерывного действия (угол руля, момент) такого списка нет — политика должна задавать плотность, например гауссову со средним и стандартным отклонением, из которой сэмплируется вещественное значение. Это не вопрос качества настройки: с softmax-головой нужное действие вообще непредставимо, обучение бессмысленно ещё до первого шага. Противоречие видно прямо из входа (тип действий против типа головы), поэтому проверка статическая и реакция — отказ.'
  id: 041-trainer-contract-3
  fingerprint: '10600e15'
