- concept: при равных логитах softmax даёт равномерное распределение с вероятностью 1/N на действие
  question: У политики 5 действий. Для текущего состояния все логиты оказались равны 4.5. Чему равна вероятность каждого действия?
  explanation: Экспоненты равных логитов равны между собой, значит каждая доля равна exp(4.5)/(5·exp(4.5)) = 0.2. Равномерный выход при равных логитах — быстрый способ убедиться, что нормализация делит на сумму всего вектора, а не на что-то другое.
  kind: numeric
  answer: 0.2
  tolerance: 0.005
  id: 015-check-probs-1
  fingerprint: d9b75487
- concept: сумма вероятностей после softmax совпадает с единицей лишь с точностью до ошибки округления чисел с плавающей точкой
  question: Тест сверяет сумму вероятностей softmax с единицей. На части входов сумма получается 0.9999999999999998. Как правильно устроить проверку?
  explanation: Деление и сложение чисел с плавающей точкой округляют результат, поэтому идеальная сумма недостижима и расхождение в последних разрядах нормально. Повторная нормализация проблему не решает — она сама снова округляет.
  kind: choice
  options:
    - Сравнивать с единицей с небольшим допуском, порядка десяти в минус девятой
    - 'Требовать точного равенства: любое расхождение означает ошибку в коде'
    - Поделить вектор на его сумму ещё раз, пока равенство не станет точным
  correct: 0
