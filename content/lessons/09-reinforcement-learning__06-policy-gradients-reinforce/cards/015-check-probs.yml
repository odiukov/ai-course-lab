- concept: равенство суммы вероятностей единице — необходимое, но не достаточное условие корректности политики
  question: Почему одной проверки «сумма выходов равна единице» мало, чтобы считать функцию вероятностей политики исправной? Приведи пример ошибки, которую такая проверка пропустит.
  explanation: Сумма, равная единице, — свойство самой нормализации, а не признак верных логитов. Полезные тесты проверяют форму выхода, устойчивость к большим логитам и согласованность порядка вероятностей с порядком логитов.
  kind: open
  reference: 'Нормализация делением на сумму даёт сумму, равную единице, при любых логитах — даже если логиты посчитаны неверно. Такая проверка пропустит перепутанные векторы весов действий (вероятности распределятся по действиям неправильно, но сумма останется правильной), потерянный или лишний признак в скалярном произведении, знак минус у логитов. Поэтому нужны и другие проверки: длина выхода равна числу действий, при равных логитах распределение равномерно, порядок вероятностей совпадает с порядком логитов, большие логиты не дают inf и nan.'
  id: 015-check-probs-3
  fingerprint: 0fa76ca6
