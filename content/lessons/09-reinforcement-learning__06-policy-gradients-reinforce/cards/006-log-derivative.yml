- concept: 'тождество log-derivative: градиент вероятности равен вероятности, умноженной на градиент её логарифма'
  question: Заполни пропуск в тождестве log-derivative, которое позволяет переписать градиент суммы по траекториям как математическое ожидание.
  explanation: 'Из производной логарифма: ∇log P = (∇P)/P, значит ∇P = P · ∇log P. Множитель P превращает сумму по всем траекториям во взвешенную вероятностями, то есть в математическое ожидание, которое оценивается сэмплированием.'
  kind: cloze
  template: \nabla_\theta P(\tau;\theta) = P(\tau;\theta) \cdot ___
  answer: \nabla_\theta \log P(\tau;\theta)
  accept:
    - ∇_θ log P(τ;θ)
    - grad log P(tau; theta)
    - \nabla_\theta \ln P(\tau;\theta)
    - ∇ log P(τ)
  id: 006-log-derivative-1
  fingerprint: 0edadcb4
- concept: при разложении log P(τ;θ) слагаемые динамики среды исчезают из градиента, потому что не зависят от θ
  question: Вероятность траектории раскладывается как P(τ;θ) = p(s_0) · Π_t p(s_{t+1} | s_t, a_t) · π_θ(a_t | s_t). Почему в ∇_θ log P(τ;θ) остаются только слагаемые с политикой?
  explanation: 'log превращает произведение в сумму: log P = log p(s_0) + Σ log p(s_{t+1}|s_t,a_t) + Σ log π_θ(a_t|s_t). Первые два блока — константы относительно θ, их градиент нулевой. Отсюда и главное следствие: модель динамики среды знать не нужно, метод model-free.'
  kind: choice
  options:
    - Потому что вероятности переходов среды всегда близки к единице и ими можно пренебречь
    - Потому что логарифм произведения даёт сумму, а слагаемые p(s_0) и p(s_{t+1} | s_t, a_t) не содержат θ, поэтому их градиент по θ равен нулю
    - Потому что среда детерминирована, и её вероятности равны нулю
    - Потому что модель среды выучивается отдельной сетью и её градиент вычитается как базовая линия
  correct: 1
  id: 006-log-derivative-2
  fingerprint: ce9673ef
- concept: численное применение ∇log P = (∇P)/P
  question: Вероятность выпавшей траектории при текущих параметрах равна 0,25. Производная этой вероятности по параметру θ равна 0,05. Чему равна производная логарифма вероятности по θ?
  explanation: '∇log P = (∇P)/P = 0,05 / 0,25 = 0,2. Деление на вероятность — это и есть нормировка, из-за которой редкие траектории с малым P дают большой по модулю ∇log P: один и тот же абсолютный прирост вероятности для редкого события значит относительно больше.'
  kind: numeric
  answer: 0.2
  tolerance: 0.01
  id: 006-log-derivative-3
  fingerprint: 05d67557
