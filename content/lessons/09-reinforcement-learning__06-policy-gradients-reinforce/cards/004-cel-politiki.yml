- concept: ожидаемый возврат считается как взвешенное по вероятностям эпизодов среднее возвратов
  question: 'Политика π_θ порождает всего два вида эпизодов: с вероятностью 0.6 возврат равен +10, с вероятностью 0.4 возврат равен −5. Чему равно J(θ)?'
  explanation: 'J(θ) = 0.6·10 + 0.4·(−5) = 6 − 2 = 4. Это и есть ожидаемый возврат: неудачные эпизоды входят в него с своим весом, а не отбрасываются.'
  kind: numeric
  answer: 4
  tolerance: 0.05
  id: 004-cel-politiki-2
  fingerprint: d7ec7f59
- concept: обучение политики — градиентный подъём по J(θ), то есть сдвиг параметров в сторону роста ожидаемого возврата
  question: Почему в методах градиента политики выполняют градиентный подъём, а не спуск, как в обычном обучении с учителем?
  explanation: Цель — максимум ожидаемого возврата, поэтому θ ← θ + α∇J(θ). Формально то же самое можно записать как спуск по потере −J(θ); знак определяется тем, что J максимизируют.
  kind: choice
  options:
    - Потому что J(θ) — ожидаемый возврат, его максимизируют, и шаг делают вдоль ∇J, а не против него
    - Потому что у политики нет функции потерь и знак градиента произволен
    - Потому что возврат может быть отрицательным, а спуск работает только с положительными величинами
    - Потому что подъём быстрее сходится, чем спуск, при одинаковой скорости обучения
  correct: 0
