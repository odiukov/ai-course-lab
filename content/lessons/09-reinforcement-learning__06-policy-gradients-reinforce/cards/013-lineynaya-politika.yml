- concept: у каждого действия свой вектор весов, поэтому число параметров равно числу действий, умноженному на число признаков
  question: Табличная среда описана 6 признаками состояния, доступно 4 действия. Сколько обучаемых весов у линейной softmax-политики (без смещений)?
  explanation: 'На каждое действие приходится свой вектор весов длиной в число признаков: 4 × 6 = 24. Признаки состояния общие для всех действий, но веса — нет: именно разные θ_a заставляют одни и те же признаки склонять выбор к разным действиям.'
  kind: choice
  options:
    - '6'
    - '10'
    - '24'
    - '64'
  correct: 2
