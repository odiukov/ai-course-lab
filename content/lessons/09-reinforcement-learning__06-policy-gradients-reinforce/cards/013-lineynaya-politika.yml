- concept: линейность означает, что логит — только взвешенная сумма признаков, поэтому он не может зависеть от взаимодействия признаков
  question: Агенту нужно выбирать действие «остановиться» только тогда, когда одновременно и заряд низкий, и препятствие близко, а при каждом условии по отдельности — не останавливаться. Почему линейная политика над этими двумя признаками не может выразить такое правило, и что нужно изменить?
  explanation: Линейность ограничивает не softmax, а способ получения логитов. Softmax-голова остаётся той же при любой архитектуре; расширяют именно вычисление логитов — либо ручными признаками взаимодействия, либо нелинейным кодировщиком.
  kind: open
  reference: 'Логит линейной политики — взвешенная сумма признаков: l_a = θ_{a,1}x_1 + θ_{a,2}x_2. Каждый признак вносит вклад независимо от значения другого, поэтому вклад «низкий заряд» одинаков и при близком, и при далёком препятствии. Правило «оба условия сразу» требует зависимости от произведения (взаимодействия) признаков, а её взвешенная сумма дать не может (это XOR-подобная задача, не разделимая линейно). Выходы: добавить признак-произведение x_1·x_2 (явная фича взаимодействия) или заменить линейную часть нелинейной сетью (MLP/CNN), оставив softmax-голову без изменений.'
  id: 013-lineynaya-politika-3
  fingerprint: 64eb7300
