  fingerprint: 609b422c
- concept: награда текущего шага входит в возврат целиком, дисконтируется только накопленный будущий возврат
  question: Эпизод состоит из одного шага с наградой 7, gamma = 0.5. Реализация по ошибке умножает на gamma всю сумму, а не только накопленный будущий возврат. Какое число она вернёт для этого единственного шага?
  explanation: 'Правильная рекуррентность: возврат = награда + gamma × (накопленный будущий возврат). Будущего нет, накопитель равен нулю, значит верный ответ 7. Ошибочная форма gamma × (награда + накопитель) даёт 0.5 × 7 = 3.5. Такая ошибка систематически занижает все возвраты в степенях gamma и незаметна на глаз, пока не проверить одношаговый эпизод.'
  kind: numeric
  answer: 3.5
  tolerance: 0.01
