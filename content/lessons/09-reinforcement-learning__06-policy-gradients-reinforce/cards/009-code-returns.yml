- concept: возврат последней позиции эпизода равен последней награде независимо от gamma
  question: 'Награды эпизода: [6, 2, 9], gamma = 0.3. Чему равен reward-to-go для последней позиции списка?'
  explanation: 'У последнего шага будущих наград нет, накопленный возврат на старте обратного прохода равен нулю: 9 + 0.3 × 0 = 9. Значение gamma на этот элемент не влияет вообще — удобная проверка корректности реализации. Для сравнения: средняя позиция даёт 2 + 0.3 × 9 = 4.7, первая 6 + 0.3 × 4.7 = 7.41.'
  kind: numeric
  answer: 9
  tolerance: 0.001
