- concept: нулевое матожидание вклада базовой линии следует из того, что сумма вероятностей действий постоянна
  question: Заполните пропуск в выкладке, показывающей, что базовая линия b(s) в среднем не вносит вклада в градиент (всё выражение обращается в нуль).
  explanation: 'Матожидание раскрывается как Σ_a π·b·(∇π)/π = b·∇Σ_a π. Сумма вероятностей всех действий тождественно постоянна при любых θ, поэтому её градиент — нулевой вектор. Отсюда: базовая линия меняет разброс отдельных обновлений, но не их среднее направление.'
  kind: cloze
  template: E_{a∼π_θ}[ b(s) · ∇_θ log π_θ(a|s) ] = b(s) · ∇_θ ___
  answer: Σ_a π_θ(a|s)
  accept:
    - сумма вероятностей всех действий
    - Σ π(a|s)
    - sum_a pi(a|s)
    - единица
    - константа
  id: 025-baseline-2
  fingerprint: 536060a9
- concept: преимущество равно возврату минус базовая линия и задаёт знак обновления
  question: 'Базовая линия — среднее возвратов трёх последних эпизодов: −50, −34 и −18. Свежий эпизод дал возврат −18. Чему равно преимущество этого эпизода?'
  explanation: 'Базовая линия = (−50 − 34 − 18)/3 = −34. Преимущество = −18 − (−34) = +16. Возврат отрицателен, а преимущество положительно: действия закрепляются, потому что эпизод лучше обычного фона, а не потому что награда положительная. Обученная V̂(s) даёт такой ориентир отдельно для каждого состояния — это уже actor-critic.'
  kind: numeric
  answer: 16
  tolerance: 0.5
  id: 025-baseline-3
  fingerprint: ddeaa822
