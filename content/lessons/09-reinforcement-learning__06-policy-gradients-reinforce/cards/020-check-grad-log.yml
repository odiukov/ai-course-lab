- concept: координата градиента лог-вероятности у невыбранного действия равна минус его вероятности
  question: Политика над четырьмя действиями выдала вероятности [0,5; 0,3; 0,15; 0,05]. Просэмплировано действие 0. Чему равна координата вектора ∇log π(a|s) по логитам, отвечающая действию 3?
  explanation: 'Градиент равен e_a − π. Для невыбранного действия координата one-hot равна 0, поэтому остаётся просто −p_i = −0,05. Чем вероятнее невыбранное действие, тем сильнее при положительном преимуществе у него отбирают вес: действие 1 теряет 0,3, а действие 3 — всего 0,05.'
  kind: numeric
  answer: -0.05
  tolerance: 0.001
  id: 020-check-grad-log-1
  fingerprint: 521e3da0
- concept: чем увереннее политика в выбранном действии, тем меньше градиент по его логиту, и шаг обучения насыщается
  question: 'Политика почти детерминирована: выбранному действию она даёт вероятность 0,98. Преимущество положительное и большое. Что произойдёт с обновлением логита этого действия?'
  explanation: 'Координата градиента у выбранного действия равна 1 − p = 0,02, и она умножается на преимущество и learning rate. Политика, уже уверенная в действии, почти перестаёт двигаться в его сторону — сигнал насыщается. Обратная сторона: если бы у выбранного действия было p = 0,05, координата равнялась бы 0,95 и шаг вышел бы куда крупнее.'
  kind: choice
  options:
    - Обновление будет большим, потому что вероятность действия близка к единице
    - 'Обновление будет крошечным: координата градиента равна 1 − 0,98 = 0,02'
    - Обновление будет нулевым независимо от преимущества
    - Обновление будет отрицательным, потому что вероятность уже почти максимальна
  correct: 1
  id: 020-check-grad-log-2
  fingerprint: e19291d5
