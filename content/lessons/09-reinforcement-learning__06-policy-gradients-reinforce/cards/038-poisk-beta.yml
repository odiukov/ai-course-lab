- concept: 'критерий выбора коэффициента энтропийного бонуса: наименьшее значение, заметно задерживающее схлопывание без ухудшения итогового возврата, причём значение зависит от задачи'
  question: Вы перебираете энтропийный коэффициент β ∈ {0, 0,003, 0,03, 0,3, 3,0} на одной задаче. Сформулируйте своими словами, по какому критерию выбирается лучшее β и почему найденное значение нельзя переносить на другую среду как константу.
  explanation: 'β — ручка цены разнообразия, а не гиперпараметр с универсальным значением. Выбор делается сравнением прогонов на конкретной задаче по паре кривых: возврат показывает, решается ли задача, энтропия — остался ли выбор между действиями.'
  kind: open
  reference: 'Берут наименьшее β, которое заметно задерживает схлопывание политики (энтропия падает не сразу), но при этом не ухудшает итоговый возврат. Крайности отсекаются с двух сторон: при β = 0 бонуса за разнообразие нет и политика может слишком рано стать уверенной в первом найденном решении; при слишком большом β (здесь 3,0) бонус за случайность перевешивает награду среды, агенту выгодно оставаться непредсказуемым и задачу он не решает. Критерий — компромисс двух метрик сразу, а не максимум энтропии и не один удачный возврат. Перенести значение нельзя, потому что оно зависит от масштаба наград среды, числа действий и длины эпизода: то же β при других наградах даст другое соотношение вклада бонуса и вклада возврата.'
  id: 038-poisk-beta-2
  fingerprint: 83b6a6a0
- concept: прогоны с разными значениями энтропийного коэффициента сравнимы только при одинаковом бюджете эпизодов
  question: Прогон с β = 0,03 обучали 800 эпизодов, прогон с β = 0,3 — 2500 эпизодов. У второго итоговый возврат выше. Что не так с выводом «β = 0,3 лучше»?
  explanation: 'Чтобы разница относилась к β, а не к длительности обучения, прогоны сравнивают при одинаковом числе эпизодов. Иначе больший бонус за разнообразие получает фору: он замедляет схлопывание, но и требует больше эпизодов, и лишние 1700 эпизодов сами по себе поднимают возврат.'
  kind: choice
  options:
    - 'Разный бюджет эпизодов: преимущество может объясняться дополнительным обучением, а не значением β'
    - 'Ничего: итоговый возврат — конечная метрика, бюджет обучения на неё не влияет'
    - Вывод неверен, потому что при большем β возврат обязан быть ниже в любом случае
    - Сравнивать нужно только пиковый возврат за один эпизод, а не итоговый
