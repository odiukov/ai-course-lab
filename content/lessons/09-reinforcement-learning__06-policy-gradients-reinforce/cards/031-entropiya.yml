- concept: энтропия равномерного распределения по N действиям равна ln N
  question: Стохастическая политика в состоянии s раскладывает вероятность поровну между 8 доступными действиями. Чему равна энтропия H(π(·|s)) в натах?
  explanation: 'H = -Σ π ln π = -8 · (1/8) ln(1/8) = ln 8 ≈ 2.079. Равномерное распределение даёт максимум энтропии, и он равен логарифму числа действий: для 8 действий это 2.079, для 2 — ln 2 ≈ 0.693.'
  kind: numeric
  answer: 2.079
  tolerance: 0.02
  id: 031-entropiya-1
  fingerprint: 79104d0b
- concept: энтропийный бонус входит в цель со знаком плюс, а коэффициент задаёт цену разнообразия
  question: К цели обучения политики добавляют член β·H(π(·|s)). Как он работает?
  explanation: 'Бонус прибавляется: агент максимизирует возврат плюс β·H, значит платит за схлопывание распределения. β — цена разнообразия: слишком маленькое почти не мешает коллапсу, большое дольше удерживает исследование. Возврат при этом никуда не девается — он остаётся основным слагаемым цели.'
  kind: choice
  options:
    - Член вычитается из цели, чтобы штрафовать политику за неопределённость и быстрее приводить её к детерминированности
    - Член прибавляется к цели, поэтому максимизация выгодна более равномерным политикам; чем больше β, тем дольше политика остаётся исследующей
    - Член заменяет возврат в градиенте, поэтому обновление перестаёт зависеть от полученных наград
    - Член масштабирует шаг градиентного подъёма, действуя как обычный learning rate
  correct: 1
  id: 031-entropiya-2
  fingerprint: 934832d6
- concept: энтропия растёт с равномерностью распределения и равна нулю у детерминированной политики
  question: У какой политики энтропия H(π(·|s)) наибольшая?
  explanation: 'Энтропия тем выше, чем ближе распределение к равномерному. У [0,40; 0,33; 0,27] она около 1.08, у [0,80; 0,15; 0,05] — около 0.62, у [0,90; 0,06; 0,04] — около 0.39. У детерминированной политики она ровно 0: ln 1 = 0, а члены с нулевой вероятностью дают 0. Именно к нулю ползёт энтропия при преждевременном схлопывании.'
  kind: choice
  options:
    - '[0,90; 0,06; 0,04]'
    - '[0,40; 0,33; 0,27]'
    - Детерминированная политика, всегда выбирающая одно и то же действие
    - '[0,80; 0,15; 0,05]'
  correct: 1
  id: 031-entropiya-3
  fingerprint: bb6920a2
