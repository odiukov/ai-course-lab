- concept: минус перед advantage в функции потерь переводит градиентный подъём по ожидаемому возврату в минимизацию, которую умеют фреймворки
  question: Политика обучается градиентным подъёмом по ожидаемому возврату, но оптимизатор фреймворка умеет только минимизировать. Заполни пропуск в строке потерь для одного шага траектории.
  explanation: 'Максимизировать advantage · log_prob — то же самое, что минимизировать −advantage · log_prob. Минус нужен только чтобы развернуть направление под API оптимизатора: сама формула остаётся REINFORCE с базовой линией.'
  kind: cloze
  template: loss = ___ * log_prob
  answer: -advantage
  accept:
    - −advantage
    - '- advantage'
    - -adv
    - -A
    - -A_t
    - минус advantage
  id: 040-loss-pattern-1
  fingerprint: '75213273'
- concept: числовое значение потери −advantage·log_prob для конкретной пары (вероятность действия, преимущество)
  question: Политика выбрала действие, дав ему вероятность 0,125; преимущество этого действия равно +7. Чему равен вклад этого шага в функцию потерь −advantage · log_prob?
  explanation: ln(0,125) ≈ −2,079. Потеря = −7 · (−2,079) ≈ 14,56. Рост вероятности действия уменьшает |log_prob| и снижает потерю, поэтому минимизатор делает удачное действие вероятнее.
  kind: numeric
  answer: 14.56
  tolerance: 0.1
  id: 040-loss-pattern-2
  fingerprint: 4af2ddec
- concept: величина потери −advantage·log_prob не является метрикой качества политики, в отличие от supervised-потери с правильным ответом
  question: Инженер смотрит на кривую значения loss = −advantage · log_prob по ходу обучения политики и видит, что оно скачет вокруг нуля и часто уходит в минус. Как это трактовать?
  explanation: 'В supervised-обучении потеря измеряет расхождение с целевым ответом и её падение = прогресс. Здесь целевого действия нет: потеря — произведение advantage на log_prob, отрицательный advantage даёт отрицательное слагаемое. Качество обучения смотрят по возврату за эпизод, а не по значению этой потери.'
  kind: choice
  options:
    - 'Знак advantage перепутан: корректная потеря такого вида неотрицательна'
    - Политика деградирует, потому что потеря не падает монотонно
    - 'Нормально: это не ошибка предсказания, у неё нет «правильного ответа» и минимума в нуле, а знак наследуется от advantage'
    - Нужно нормировать log_prob, чтобы потеря стала положительной и убывающей
  correct: 2
  id: 040-loss-pattern-3
  fingerprint: a4a6d640
