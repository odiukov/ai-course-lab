- concept: перед возведением в экспоненту из каждого логита вычитают максимум, иначе большие логиты дают переполнение
  question: 'Заполни пропуск в устойчивой реализации softmax: без этой поправки набор логитов вроде [820, 815] обрушит вычисление переполнением.'
  explanation: 'exp(820) выходит за диапазон float и даёт inf. Вычитание максимума делает наибольший показатель exp(0) = 1, остальные — числа от 0 до 1. Результат не меняется: общий множитель exp(-m) сокращается в числителе и знаменателе.'
  kind: cloze
  template: |-
    exps = [exp(l - ___) for l in logits]
    Z = sum(exps)
    return [e / Z for e in exps]
  answer: max(logits)
  accept:
    - max(logits)
    - m = max(logits)
    - максимум логитов
    - max logits
    - m
  id: 012-code-softmax-1
  fingerprint: 702c12c7
- concept: softmax инвариантен к прибавлению одной константы ко всем логитам
  question: Для трёх действий softmax вернул вероятности [0.6, 0.25, 0.15]. К каждому логиту прибавили 250 и пересчитали softmax. Чему равна вероятность первого действия?
  explanation: Прибавление константы c ко всем логитам умножает каждую экспоненту на exp(c), а этот множитель сокращается при делении на сумму. Softmax зависит только от разностей логитов, поэтому распределение остаётся [0.6, 0.25, 0.15]. Именно на этом свойстве держится вычитание максимума.
  kind: numeric
  answer: 0.6
  tolerance: 0.001
  id: 012-code-softmax-2
  fingerprint: c5a8dc97
- concept: отношение вероятностей двух действий равно экспоненте разности их логитов
  question: Логит действия A на 4 больше логита действия B (остальные действия любые). Во сколько раз вероятность A больше вероятности B?
  explanation: p_A / p_B = exp(l_A) / exp(l_B) = exp(l_A - l_B) = exp(4) ≈ 54.6. Нормировочная сумма Z одинакова для обоих и сокращается, поэтому остальные действия на это отношение не влияют.
  kind: choice
  options:
    - примерно в 54.6 раза
    - ровно в 4 раза
    - в 16 раз
    - зависит от количества остальных действий
  correct: 0
  id: 012-code-softmax-3
  fingerprint: eb52024e
